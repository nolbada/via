<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}

.locked .wd{cursor:default}.locked .wd:hover{background:none}

.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}

button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}

.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}

.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}

.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Texting are the main way of communication for many people these days, especially for teenagers.", "ko": "문자 메시지는 요즘 많은 사람들, 특히 십 대들의 주요 의사소통 수단이다.", "ok": false, "foot": [], "fixes": [{"wrong": "are", "right": "is", "partial": false, "at": [1], "point": "수일치: 동명사 주어 Texting은 단수 취급하므로 단수동사 is 사용", "topic": "수일치", "memo": "동명사 주어 Texting은 단수 취급하므로 단수동사 is 사용"}]}, {"n": 2, "tag": null, "en": "Do you want to know how communicating better through texting? Here is some useful tips.", "ko": "문자 메시지를 통해 어떻게 의사소통을 더 잘할 수 있는지 알고 싶은가? 여기 몇 가지 유용한 팁이 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "communicating", "right": "to communicate", "partial": false, "at": [6], "point": "의문사+to부정사: how 뒤에는 to부정사(to communicate) 사용", "topic": "의문사+to부정사", "memo": "how 뒤에는 to부정사(to communicate) 사용"}, {"wrong": "is", "right": "are", "partial": false, "at": [11], "point": "수일치: 주어 tips(복수)에 맞춰 동사 are 사용 (Here are ~ 도치문)", "topic": "수일치", "memo": "주어 tips(복수)에 맞춰 동사 are 사용 (Here are ~ 도치문)"}]}, {"n": 3, "tag": "Tip 1", "en": "You need knowing who you are talking to.", "ko": "당신은 누구에게 말해야 할지 알아야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "knowing", "right": "to know", "partial": false, "at": [2], "point": "to부정사: need 뒤에는 to부정사(to know) 사용, 동명사(knowing) 불가", "topic": "to부정사", "memo": "need 뒤에는 to부정사(to know) 사용, 동명사(knowing) 불가"}]}, {"n": 4, "tag": null, "en": "Henry just send the following text message to his mother.", "ko": "Henry는 방금 엄마에게 다음과 같은 문자 메시지를 보냈다.", "ok": false, "foot": [], "fixes": [{"wrong": "send", "right": "sent", "partial": false, "at": [2], "point": "시제: just와 함께 과거 사건을 나타내므로 과거형 sent 사용", "topic": "시제", "memo": "just와 함께 과거 사건을 나타내므로 과거형 sent 사용"}]}, {"n": 5, "tag": null, "en": "Mom, I want you waiting just a little longer. BRT.", "ko": "엄마, 조금만 더 기다려 주세요. 곧 갈게요.", "ok": false, "foot": [], "fixes": [{"wrong": "waiting", "right": "to wait", "partial": false, "at": [4], "point": "5형식: want + 목적어 + to부정사(to wait) 형태 사용", "topic": "5형식", "memo": "want + 목적어 + to부정사(to wait) 형태 사용"}]}, {"n": 6, "tag": null, "en": "Do you think Henry’s mother correctly understood BRT? Probably not.", "ko": "당신은 Henry의 엄마가 BRT를 정확히 이해했다고 생각하는가? 아마도 그렇지 않을 것이다.", "ok": true, "foot": [], "fixes": []}, {"n": 7, "tag": null, "en": "You can use expressions like BRT (be right there), JK (just kidding), or LOL (laughing out loud) when you texting your friend.", "ko": "친구들에게 문자 메시지를 보낼 때 BRT(곧 갈게), JK(농담이야), 또는 LOL(소리 내어 웃음) 같은 표현들을 사용할 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "texting", "right": "text", "partial": false, "at": [19], "point": "어법: when이 이끄는 절에는 주어 + 동사 형태가 필요하므로 text 사용 (texting 불가)", "topic": "어법", "memo": "when이 이끄는 절에는 주어 + 동사 형태가 필요하므로 text 사용 (texting 불가)"}, {"wrong": "friend", "right": "friends", "partial": false, "at": [21], "point": "어휘/수일치: 여러 친구들에게 보낼 수 있으므로 복수형 friends 사용", "topic": "어휘/수일치", "memo": "여러 친구들에게 보낼 수 있으므로 복수형 friends 사용"}]}, {"n": 8, "tag": null, "en": "However, being careful with such expressions when you text your teachers or parents.", "ko": "하지만 선생님이나 부모님께 문자 메시지를 보낼 때는 그런 표현을 쓰는 것에 주의해라.", "ok": false, "foot": [], "fixes": [{"wrong": "being", "right": "be", "partial": false, "at": [1], "point": "어법: 명령문은 동사원형으로 시작하므로 be careful 사용", "topic": "어법", "memo": "명령문은 동사원형으로 시작하므로 be careful 사용"}]}, {"n": 9, "tag": null, "en": "You need understanding that some of them may not knows the meanings of such expressions.", "ko": "그들 중 일부는 이런 표현의 의미를 모를 수도 있다는 것을 이해해야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "understanding", "right": "to understand", "partial": false, "at": [2], "point": "to부정사: need 뒤에는 to부정사 (to understand) 사용, 동명사 불가", "topic": "to부정사", "memo": "need 뒤에는 to부정사 (to understand) 사용, 동명사 불가"}, {"wrong": "knows", "right": "know", "partial": false, "at": [9], "point": "조동사 뒤 동사원형: may 뒤에는 동사원형 know 사용", "topic": "조동사 뒤 동사원형", "memo": "may 뒤에는 동사원형 know 사용"}]}, {"n": 10, "tag": "Tip 2", "en": "You need to understand that people use emojis different.", "ko": "당신은 사람들이 이모지를 다르게 사용한다는 점을 이해해야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "different", "right": "differently", "partial": false, "at": [8], "point": "어법: 동사 use를 수식하므로 부사 differently 사용 (형용사 different 불가)", "topic": "어법", "memo": "동사 use를 수식하므로 부사 differently 사용 (형용사 different 불가)"}]}, {"n": 11, "tag": null, "en": "Yesterday, Jisu give a birthday gift to her little brother Jihoo. Later, she get the following text message.", "ko": "어제 지수는 남동생 지후에게 생일 선물을 주었다. 이후에, 그녀는 다음과 같은 문자 메시지를 받았다.", "ok": false, "foot": [], "fixes": [{"wrong": "give", "right": "gave", "partial": false, "at": [2], "point": "시제: Yesterday와 함께 과거형 gave 사용", "topic": "시제", "memo": "Yesterday와 함께 과거형 gave 사용"}, {"wrong": "get", "right": "got", "partial": false, "at": [13], "point": "시제: 이야기의 시점이 과거이므로 과거형 got 사용", "topic": "시제", "memo": "이야기의 시점이 과거이므로 과거형 got 사용"}]}, {"n": 12, "tag": null, "en": "I love your gift. Thanks a lot.", "ko": "선물이 아주 마음에 들었어. 정말 고마워.", "ok": false, "foot": [], "fixes": [{"wrong": "love", "right": "loved", "partial": false, "at": [1], "point": "시제: 선물을 받은 시점의 감정을 나타내므로 과거형 loved 사용", "topic": "시제", "memo": "선물을 받은 시점의 감정을 나타내므로 과거형 loved 사용"}]}, {"n": 13, "tag": null, "en": "“Only one smiling face? I guess he doesn’t like my gift,” Jisu thought.", "ko": "“웃는 얼굴이 하나뿐이네? 내 선물이 마음에 안 들었나 봐.”라고 지수는 생각했다.", "ok": false, "foot": [], "fixes": [{"wrong": "doesn’t", "right": "didn’t", "partial": false, "at": [7], "point": "시제: 과거동사 thought와 이어지는 문맥이므로 과거형 didn’t 사용", "topic": "시제", "memo": "과거동사 thought와 이어지는 문맥이므로 과거형 didn’t 사용"}]}, {"n": 14, "tag": null, "en": "When we talk with someone, we use not only words but also using facial expressions and body language. In texting, we use emojis instead.", "ko": "우리는 누군가와 대화할 때, 말뿐만 아니라 얼굴 표정과 몸짓 언어도 사용한다. 문자 메시지를 보낼 때, 우리는 대신 이모지를 사용한다.", "ok": false, "foot": [], "fixes": [{"wrong": "using facial expressions", "right": "facial expressions", "partial": false, "at": [12], "point": "병렬구조: not only A but also B에서 A(words)와 B는 같은 형태(명사)여야 하므로 facial expressions 사용", "topic": "병렬구조", "memo": "not only A but also B에서 A(words)와 B는 같은 형태(명사)여야 하므로 facial expressions 사용"}]}, {"n": 15, "tag": null, "en": "Sometimes, a little emoji can speak more loud than many words.", "ko": "때때로 작은 이모지가 많은 말보다 더 큰 의미를 말할 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "more loud", "right": "louder", "partial": false, "at": [6], "point": "비교급: 1음절 단어 loud의 비교급은 -er을 붙인 louder 사용", "topic": "비교급", "memo": "1음절 단어 loud의 비교급은 -er을 붙인 louder 사용"}]}, {"n": 16, "tag": null, "en": "The problem is that not everybody use emojis in the same way.", "ko": "문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다.", "ok": false, "foot": [], "fixes": [{"wrong": "use", "right": "uses", "partial": false, "at": [6], "point": "수일치: 부정대명사 everybody는 단수 취급하므로 단수동사 uses 사용", "topic": "수일치", "memo": "부정대명사 everybody는 단수 취급하므로 단수동사 uses 사용"}]}, {"n": 17, "tag": null, "en": "Some people like to use them a lots, and some doesn’t.", "ko": "어떤 사람들은 이모지를 많이 사용하는 것을 좋아하고, 어떤 사람들은 그렇지 않다.", "ok": false, "foot": [], "fixes": [{"wrong": "a lots", "right": "a lot", "partial": false, "at": [6], "point": "어휘: a lot은 그대로 쓰며 a lots는 쓰지 않음", "topic": "어휘", "memo": "a lot은 그대로 쓰며 a lots는 쓰지 않음"}, {"wrong": "doesn’t", "right": "don’t", "partial": false, "at": [10], "point": "수일치: 주어 some(= some people, 복수)에 맞춰 don’t 사용", "topic": "수일치", "memo": "주어 some(= some people, 복수)에 맞춰 don’t 사용"}]}, {"n": 18, "tag": null, "en": "In addition, the same emojis can means different things to different people.", "ko": "게다가 같은 이모지도 사람마다 다른 것을 의미할 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "means", "right": "mean", "partial": false, "at": [6], "point": "조동사 뒤 동사원형: can 뒤에는 동사원형 mean 사용", "topic": "조동사 뒤 동사원형", "memo": "can 뒤에는 동사원형 mean 사용"}]}, {"n": 19, "tag": "Tip 3", "en": "Sometimes, you need to pick on the phone.", "ko": "때때로 당신은 전화기를 들어야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "pick on", "right": "pick up", "partial": false, "at": [4], "point": "어휘: pick on(~을 괴롭히다/트집 잡다)이 아닌 pick up(전화를 받다) 사용", "topic": "어휘", "memo": "pick on(~을 괴롭히다/트집 잡다)이 아닌 pick up(전화를 받다) 사용"}]}, {"n": 20, "tag": null, "en": "Amy just get the following text message from her best friend Nari.", "ko": "Amy는 방금 가장 친한 친구인 나리로부터 다음과 같은 문자 메시지를 받았다.", "ok": false, "foot": [], "fixes": [{"wrong": "get", "right": "got", "partial": false, "at": [2], "point": "시제: just와 함께 과거 사건을 나타내므로 과거형 got 사용", "topic": "시제", "memo": "just와 함께 과거 사건을 나타내므로 과거형 got 사용"}]}, {"n": 21, "tag": null, "en": "Did you really talked behind my back? I want you apologize to me.", "ko": "네가 정말 내 뒷담화를 했니? 나는 네가 나에게 사과하기를 원해.", "ok": false, "foot": ["1behind my back 뒤에서, 몰래 (뒷담화하다)"], "fixes": [{"wrong": "talked", "right": "talk", "partial": false, "at": [3], "point": "어법: 조동사 Did 뒤에는 동사원형 talk 사용", "topic": "어법", "memo": "조동사 Did 뒤에는 동사원형 talk 사용"}, {"wrong": "apologize", "right": "to apologize", "partial": false, "at": [10], "point": "5형식: want + 목적어 + to부정사 (to apologize) 형태 사용", "topic": "5형식", "memo": "want + 목적어 + to부정사 (to apologize) 형태 사용"}]}, {"n": 22, "tag": null, "en": "Amy wanted to text Nari and explaining the situation, but she thought again.", "ko": "Amy는 나리에게 문자 메시지를 보내서 상황을 설명하고 싶었지만, 다시 생각했다.", "ok": false, "foot": [], "fixes": [{"wrong": "explaining", "right": "explain", "partial": false, "at": [6], "point": "병렬구조: wanted to text와 (to) explain이 and로 연결되므로 explain(동사원형) 사용", "topic": "병렬구조", "memo": "wanted to text와 (to) explain이 and로 연결되므로 explain(동사원형) 사용"}]}, {"n": 23, "tag": null, "en": "“Well, this is too much for a text,” she said to herself and called Nari.", "ko": "“음, 이건 문자로 하기엔 너무 큰 일이야.” 그녀는 혼잣말을 하며 나리에게 전화를 걸었다.", "ok": true, "foot": [], "fixes": []}, {"n": 24, "tag": null, "en": "Texting is okay for casually situations, but sometimes, you has to pick up the phone.", "ko": "문자 메시지는 일상적인 상황에서는 괜찮지만 때로는 전화를 해야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "casually", "right": "casual", "partial": false, "at": [4], "point": "어법: 명사 situations를 수식하므로 형용사 casual 사용 (부사 casually 불가)", "topic": "어법", "memo": "명사 situations를 수식하므로 형용사 casual 사용 (부사 casually 불가)"}, {"wrong": "has", "right": "have", "partial": false, "at": [9], "point": "조동사 have to: 주어 you에는 has to가 아닌 have to 사용", "topic": "조동사 have to", "memo": "주어 you에는 has to가 아닌 have to 사용"}]}, {"n": 25, "tag": null, "en": "This is because misunderstandings can easy happen when you text.", "ko": "문자 메시지를 보낼 때 오해가 쉽게 생길 수 있기 때문이다.", "ok": false, "foot": ["1misunderstandings 오해들"], "fixes": [{"wrong": "easy", "right": "easily", "partial": false, "at": [5], "point": "어법: 동사 happen을 수식하므로 부사 easily 사용 (형용사 easy 불가)", "topic": "어법", "memo": "동사 happen을 수식하므로 부사 easily 사용 (형용사 easy 불가)"}]}, {"n": 26, "tag": null, "en": "Do you need to talk about sensible issues with you friends?", "ko": "친구들과 민감한 문제에 대해 이야기해야 하는가?", "ok": false, "foot": [], "fixes": [{"wrong": "sensible", "right": "sensitive", "partial": false, "at": [6], "point": "어휘: sensible(분별 있는)과 sensitive(민감한)의 혼동 — 문맥상 민감한 문제이므로 sensitive 사용", "topic": "어휘", "memo": "sensible(분별 있는)과 sensitive(민감한)의 혼동 — 문맥상 민감한 문제이므로 sensitive 사용"}, {"wrong": "you", "right": "your", "partial": false, "at": [9], "point": "인칭대명사: 명사 friends를 수식하므로 소유격 your 사용", "topic": "인칭대명사", "memo": "명사 friends를 수식하므로 소유격 your 사용"}]}, {"n": 27, "tag": null, "en": "Then, not text them. Call them instead.", "ko": "그렇다면, 그들에게 문자 메시지를 보내지 마라. 대신 그들에게 전화해라.", "ok": false, "foot": [], "fixes": [{"wrong": "not", "right": "don’t", "partial": false, "at": [1], "point": "어법: 부정 명령문은 Don’t + 동사원형 형태로 사용", "topic": "어법", "memo": "부정 명령문은 Don’t + 동사원형 형태로 사용"}]}];var PP=[["Texting is the main way of communication for many people these days, especially for teenagers.", "문자 메시지는 요즘 많은 사람들, 특히 십 대들의 주요 의사소통 수단이다.", 0], ["Do you want to know how to communicate better through texting? Here are some useful tips.", "문자 메시지를 통해 어떻게 의사소통을 더 잘할 수 있는지 알고 싶은가? 여기 몇 가지 유용한 팁이 있다.", 0], ["You need to know who you are talking to.", "당신은 누구에게 말해야 할지 알아야 한다.", 0], ["Henry just sent the following text message to his mother.", "Henry는 방금 엄마에게 다음과 같은 문자 메시지를 보냈다.", 0], ["Mom, I want you to wait just a little longer. BRT.", "엄마, 조금만 더 기다려 주세요. 곧 갈게요.", 0], ["Do you think Henry’s mother correctly understood BRT? Probably not.", "당신은 Henry의 엄마가 BRT를 정확히 이해했다고 생각하는가? 아마도 그렇지 않을 것이다.", 0], ["You can use expressions like BRT (be right there), JK (just kidding), or LOL (laughing out loud) when you text your friends.", "친구들에게 문자 메시지를 보낼 때 BRT(곧 갈게), JK(농담이야), 또는 LOL(소리 내어 웃음) 같은 표현들을 사용할 수 있다.", 0], ["However, be careful with such expressions when you text your teachers or parents.", "하지만 선생님이나 부모님께 문자 메시지를 보낼 때는 그런 표현을 쓰는 것에 주의해라.", 0], ["You need to understand that some of them may not know the meanings of such expressions.", "그들 중 일부는 이런 표현의 의미를 모를 수도 있다는 것을 이해해야 한다.", 0], ["You need to understand that people use emojis differently.", "당신은 사람들이 이모지를 다르게 사용한다는 점을 이해해야 한다.", 0], ["Yesterday, Jisu gave a birthday gift to her little brother Jihoo. Later, she got the following text message.", "어제 지수는 남동생 지후에게 생일 선물을 주었다. 이후에, 그녀는 다음과 같은 문자 메시지를 받았다.", 0], ["I loved your gift. Thanks a lot.", "선물이 아주 마음에 들었어. 정말 고마워.", 0], ["“Only one smiling face? I guess he didn’t like my gift,” Jisu thought.", "“웃는 얼굴이 하나뿐이네? 내 선물이 마음에 안 들었나 봐.”라고 지수는 생각했다.", 0], ["When we talk with someone, we use not only words but also facial expressions and body language. In texting, we use emojis instead.", "우리는 누군가와 대화할 때, 말뿐만 아니라 얼굴 표정과 몸짓 언어도 사용한다. 문자 메시지를 보낼 때, 우리는 대신 이모지를 사용한다.", 0], ["Sometimes, a little emoji can speak louder than many words.", "때때로 작은 이모지가 많은 말보다 더 큰 의미를 말할 수 있다.", 0], ["The problem is that not everybody uses emojis in the same way.", "문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다.", 0], ["Some people like to use them a lot, and some don’t.", "어떤 사람들은 이모지를 많이 사용하는 것을 좋아하고, 어떤 사람들은 그렇지 않다.", 0], ["In addition, the same emojis can mean different things to different people.", "게다가 같은 이모지도 사람마다 다른 것을 의미할 수 있다.", 0], ["Sometimes, you need to pick up the phone.", "때때로 당신은 전화기를 들어야 한다.", 0], ["Amy just got the following text message from her best friend Nari.", "Amy는 방금 가장 친한 친구인 나리로부터 다음과 같은 문자 메시지를 받았다.", 0], ["Did you really talk behind my back? I want you to apologize to me.", "네가 정말 내 뒷담화를 했니? 나는 네가 나에게 사과하기를 원해.", 0], ["Amy wanted to text Nari and explain the situation, but she thought again.", "Amy는 나리에게 문자 메시지를 보내서 상황을 설명하고 싶었지만, 다시 생각했다.", 0], ["“Well, this is too much for a text,” she said to herself and called Nari.", "“음, 이건 문자로 하기엔 너무 큰 일이야.” 그녀는 혼잣말을 하며 나리에게 전화를 걸었다.", 0], ["Texting is okay for casual situations, but sometimes, you have to pick up the phone.", "문자 메시지는 일상적인 상황에서는 괜찮지만 때로는 전화를 해야 한다.", 0], ["This is because misunderstandings can easily happen when you text.", "문자 메시지를 보낼 때 오해가 쉽게 생길 수 있기 때문이다.", 0], ["Do you need to talk about sensitive issues with your friends?", "친구들과 민감한 문제에 대해 이야기해야 하는가?", 0], ["Then, don’t text them. Call them instead.", "그렇다면, 그들에게 문자 메시지를 보내지 마라. 대신 그들에게 전화해라.", 0]];var RNUM=14;var TITLE_EN="Text Better, Communicate Better!";var PASS_EN=["Text Better, Communicate Better!", "Texting is the main way of communication for many people these days, especially for teenagers. Do you want to know how to communicate better through texting? Here are some useful tips.", "You need to know who you are talking to. Henry just sent the following text message to his mother. Mom, I want you to wait just a little longer. BRT. Do you think Henry’s mother correctly understood BRT? Probably not. You can use expressions like BRT (be right there), JK (just kidding), or LOL (laughing out loud) when you text your friends. However, be careful with such expressions when you text your teachers or parents. You need to understand that some of them may not know the meanings of such expressions.", "You need to understand that people use emojis differently. Yesterday, Jisu gave a birthday gift to her little brother Jihoo. Later, she got the following text message. I loved your gift. Thanks a lot. “Only one smiling face? I guess he didn’t like my gift,” Jisu thought. When we talk with someone, we use not only words but also facial expressions and body language. In texting, we use emojis instead. Sometimes, a little emoji can speak louder than many words. The problem is that not everybody uses emojis in the same way. Some people like to use them a lot, and some don’t. In addition, the same emojis can mean different things to different people.", "Sometimes, you need to pick up the phone. Amy just got the following text message from her best friend Nari. Did you really talk behind my back? I want you to apologize to me. Amy wanted to text Nari and explain the situation, but she thought again. “Well, this is too much for a text,” she said to herself and called Nari. Texting is okay for casual situations, but sometimes, you have to pick up the phone. This is because misunderstandings can easily happen when you text. Do you need to talk about sensitive issues with your friends? Then, don’t text them. Call them instead."];var PASS_KO=["문자 메시지를 더 잘 쓸수록, 의사소통을 더 잘할 수 있어요!", "문자 메시지는 요즘 많은 사람들, 특히 십 대들의 주요 의사소통 수단이다. 문자 메시지를 통해 어떻게 의사소통을 더 잘할 수 있는지 알고 싶은가? 여기 몇 가지 유용한 팁이 있다.", "당신은 누구에게 말해야 할지 알아야 한다. Henry는 방금 엄마에게 다음과 같은 문자 메시지를 보냈다. 엄마, 조금만 더 기다려 주세요. 곧 갈게요. 당신은 Henry의 엄마가 BRT를 정확히 이해했다고 생각하는가? 아마도 그렇지 않을 것이다. 친구들에게 문자 메시지를 보낼 때 BRT(곧 갈게), JK(농담이야), 또는 LOL(소리 내어 웃음) 같은 표현들을 사용할 수 있다. 하지만 선생님이나 부모님께 문자 메시지를 보낼 때는 그런 표현을 쓰는 것에 주의해라. 그들 중 일부는 이런 표현의 의미를 모를 수도 있다는 것을 이해해야 한다.", "당신은 사람들이 이모지를 다르게 사용한다는 점을 이해해야 한다. 어제 지수는 남동생 지후에게 생일 선물을 주었다. 이후에, 그녀는 다음과 같은 문자 메시지를 받았다. 선물이 아주 마음에 들었어. 정말 고마워. “웃는 얼굴이 하나뿐이네? 내 선물이 마음에 안 들었나 봐.”라고 지수는 생각했다. 우리는 누군가와 대화할 때, 말뿐만 아니라 얼굴 표정과 몸짓 언어도 사용한다. 문자 메시지를 보낼 때, 우리는 대신 이모지를 사용한다. 때때로 작은 이모지가 많은 말보다 더 큰 의미를 말할 수 있다. 문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다. 어떤 사람들은 이모지를 많이 사용하는 것을 좋아하고, 어떤 사람들은 그렇지 않다. 게다가 같은 이모지도 사람마다 다른 것을 의미할 수 있다.", "때때로 당신은 전화기를 들어야 한다. Amy는 방금 가장 친한 친구인 나리로부터 다음과 같은 문자 메시지를 받았다. 네가 정말 내 뒷담화를 했니? 나는 네가 나에게 사과하기를 원해. Amy는 나리에게 문자 메시지를 보내서 상황을 설명하고 싶었지만, 다시 생각했다. “음, 이건 문자로 하기엔 너무 큰 일이야.” 그녀는 혼잣말을 하며 나리에게 전화를 걸었다. 문자 메시지는 일상적인 상황에서는 괜찮지만 때로는 전화를 해야 한다. 문자 메시지를 보낼 때 오해가 쉽게 생길 수 있기 때문이다. 친구들과 민감한 문제에 대해 이야기해야 하는가? 그렇다면, 그들에게 문자 메시지를 보내지 마라. 대신 그들에게 전화해라."];var DG=[{"dlg": [["B", "Hi, Emma. I didn’t expect to see you here at the airport.", "안녕, Emma. 여기 공항에서 너를 만날 줄은 몰랐어."], ["G", "Hi, Jihan. My parents and I just said goodbye to Uncle Ted. He was visiting us, but he is going back to Ottawa just now.", "안녕, 지한아. 부모님이랑 나는 방금 Ted 삼촌께 작별 인사를 했어. 삼촌이 우리 집에 와 계셨는데, 지금 막 오타와로 돌아가셔."], ["B", "Excuse me? He is going back to where?", "뭐라고? 어디로 돌아가신다고?"], ["G", "Ottawa.", "오타와."], ["B", "A . . . ra . . . How do you spell it?", "아… 라… 그거 철자가 어떻게 돼?"], ["G", "O-t-t-a-w-a. It’s the capital of Canada. Anyway, he is getting married there next month.", "O-t-t-a-w-a야. 캐나다의 수도야. 아무튼, 삼촌은 다음 달에 거기서 결혼하셔."], ["B", "Really? Are you going to go to his wedding?", "정말? 너는 삼촌 결혼식에 갈 거야?"], ["G", "Well, my parents will, but I don’t think I can.", "음, 부모님은 가시겠지만, 나는 못 갈 것 같아."], ["B", "That’s too bad.", "그거 참 아쉽다."], ["G", "Yeah. I guess I’ll just have to text him and say congratulations.", "응. 그냥 삼촌께 문자로 축하한다고 말씀드려야 할 것 같아."]], "qs": [{"n": 1, "q": "위 대화의 내용과 일치하는 것은?", "o": ["Emma는 기차역에서 우연히 지한을 만났다.", "Emma는 오타와에서 오는 삼촌을 기다리고 있다.", "지한은 오타와를 어떻게 발음하는지 다시 묻는다.", "Emma의 삼촌은 다음 달에 서울에서 결혼식을 올린다.", "Emma는 삼촌의 결혼식에 참석하지 못하고 문자로 축하할 것이다."], "a": 4, "ans": "Emma는 삼촌의 결혼식에 참석하지 못하고 문자로 축하할 것이다.", "evs": [["G: Well, my parents will, but I don’t think I can.", "음, 부모님은 가시겠지만, 나는 못 갈 것 같아."], ["G: Yeah. I guess I’ll just have to text him and say congratulations.", "응. 그냥 삼촌께 문자로 축하한다고 말씀드려야 할 것 같아."]], "ev": ["G: Well, my parents will, but I don’t think I can.", "음, 부모님은 가시겠지만, 나는 못 갈 것 같아."], "memo": ["G: Well, my parents will, but I don’t think I can.  (음, 부모님은 가시겠지만, 나는 못 갈 것 같아.)", "G: Yeah. I guess I’ll just have to text him and say congratulations.  (응. 그냥 삼촌께 문자로 축하한다고 말씀드려야 할 것 같아.)"]}]}, {"dlg": [["B  return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}

 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}

var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});

var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
