 others. (어떤 사람들은 다른 사람들보다 연기를 더 잘한다.)","ev":"4번 문장","s":[[4,"Some people are better actors than others.","어떤 사람들은 다른 사람보다 더 나은 배우이다."]],"w":"4번에서 어떤 사람들은 다른 사람들보다 더 나은 배우라고 해요.","c":4},"h":"07f60cc513"},{"n":9,"t":"sum","q":"In Shakespeare’s quote, people have their exits and (A), and one man plays many (B) in his lifetime.","ko":"셰익스피어의 명언에 따르면 사람들은 퇴장과 (A)을(를) 가지며, 한 사람은 일생 동안 여러 (B)을(를) 연기한다.","oko":["(A) 보상 / (B) 역할","(A) 입장 / (B) 방","(A) 적 / (B) 경기","(A) 입장 / (B) 역할","(A) 보상 / (B) 경기"],"opts":["(A) rewards / (B) parts","(A) entrances / (B) rooms","(A) enemies / (B) games","(A) entrances / (B) parts","(A) rewards / (B) games"],"r":{"a":"4) (A) entrances / (B) parts (입장 / 역할)","ev":"2번 문장","s":[[2,"The most famous quote expressing this comes from Shakespeare: “All the world’s a stage, And all the men and women merely players; They have their exits and their entrances, And one man in his time plays many parts.”","이것을 표현하는 가장 유명한 명언은 셰익스피어에게서 비롯된다. “모든 세상은 연극 무대이고, 모든 남성과 여성은 단지 배우일 뿐이다. 그들은 그들의 출구와 그들의 입구를 가진다. 그리고 일생동안 한 인간은 다양한 역할을 연기한다.”"]],"w":"2번의 셰익스피어 명언에서 사람들은 퇴장(exits)과 입장(entrances)을 가지며, 한 사람이 일생 동안 여러 역할(parts)을 연기한다고 해요.","c":4},"h":"acb03bfc4b"},{"n":10,"t":"fill","q":"Others are able to act with more confidence and [A]—they often become [B].","ko":"다른 사람들은 더 큰 자신감과 [A]을(를) 가지고 연기할 수 있는데, 그들은 주로 [B]이(가) 된다.","bank":["bravado","leaders","imply","represent","quotes","masks"],"bko":{"bravado":"허세","leaders":"리더들","imply":"암시하다","represent":"표현하다","quotes":"인용문들","masks":"가면들"},"r":{"a":"[A] bravado (허세), [B] leaders (리더들)","ev":"6번 문장","s":[[6,"Others are able to act with more confidence and bravado—they often become leaders.","다른 사람들은 더 큰 자신감과 허세를 가지고 연기할 수 있는데, 그들은 주로 리더가 된다."]],"w":"6번에서 다른 사람들은 더 큰 자신감과 허세(bravado)를 가지고 연기할 수 있고, 그들은 주로 리더(leaders)가 된다고 해요.","c":null},"h":"c425a9eb45"}]},{"u":10,"id":"ch2-10-1","no":1,"ko":"내가 모델이 된다고?","items":[{"n":1,"t":"tf","q":"Schuman once had a job in fashion sales.","ko":"슈만은 한때 패션 세일즈 일을 한 적이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"After quitting his fashion sales job in 2005, Schuman went to the streets with his digital camera and spent four to five hours a day photographing people’s street wear.","2005년 패션 세일즈 일을 그만둔 후, 슈만은 디지털카메라와 함께 거리로 나갔고 하루에 네다섯 시간을 사람들의 길거리 패션을 찍으면서 보냈다."]],"w":"4번 문장에서 2005년에 패션 세일즈 일을 그만두었다(quitting his fashion sales job)고 해요. 그만두었다는 건 그전에 그 일을 했다는 뜻이라 본문과 맞아요.","c":"T"},"h":"2142b08761"},{"n":2,"t":"tf","q":"The woman in the picture is a famous model.","ko":"사진 속 여자는 유명한 모델이다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"You might think she is a model or celebrity, but she is not.","당신은 그녀가 모델이나 유명인이라고 생각할지도 모르지만, 그렇지 않다."],[3,"She is just an ordinary but fashionable woman in her own clothes, and the photographer is Scott Schuman, one of the world’s most-famous fashion photographers.","그녀는 자기 옷을 입은 한 평범하지만, 스타일 좋은 여자일 뿐이고, 사진사는 스콧 슈만으로, 세계에서 가장 유명한 패션 사진작가들 중 하나이다."]],"w":"2번에서 그녀는 모델이나 유명인이 아니라고 하고(but she is not), 3번에서 자기 옷을 입은 평범하지만 스타일 좋은 여자(an ordinary but fashionable woman)라고 해요. 유명한 모델이라는 말은 본문과 달라요.","c":"F"},"h":"8e63401897"},{"n":3,"t":"tf","q":"People found Schuman's pictures different from typical fashion photos.","ko":"사람들은 슈만의 사진이 전형적인 패션 사진과 다르다고 생각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The blog gained international attention because people found his pictures different from typical fashion photos, and millions of people from different backgrounds started visiting his blog to get style inspiration.","사람들이 그의 사진을 전형적인 패션 사진과는 다르다고 생각했기 때문에 그 블로그는 국제적인 주목을 받게 되었고, 수백만 명의 다양한 분야의 사람들이 스타일에 관한 영감을 얻기 위해 그의 블로그를 방문하기 시작했다."]],"w":"8번 문장에서 사람들이 그의 사진을 전형적인 패션 사진과 다르다고 생각했기 때문에(because people found his pictures different from typical fashion photos) 블로그가 주목받았다고 해요.","c":"T"},"h":"512dc543b6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (His target was anyone dressed attractively.)","ko":"밑줄 친 단어의 문맥상 뜻으로 가장 알맞은 것은?","opts":["평범하게","저렴하게","매력적으로","어색하게"],"word":"attractively","r":{"a":"3) 매력적으로","ev":"5~6번 문장","s":[[5,"His target was anyone dressed attractively.","대상은 매력적으로 옷을 입은 누군가였다."],[6,"It didn’t matter if they were wearing trendy clothes or expensive brands.","그들이 유행하는 옷을 입는지 비싼 브랜드 옷을 입는지는 상관없었다."]],"w":"5번에서 슈만의 대상은 anyone dressed attractively예요. 6번에서 유행이나 비싼 브랜드는 상관없다고 하니 기준은 가격이 아니라 '보기 좋게' 입었는지예요. attractively는 '매력적으로'라는 뜻이에요.","c":3},"h":"9bf3ceac49"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The blog gained international attention because people found his pictures different from typical fashion photos, and millions of people from different backgrounds started visiting his blog to get style inspiration.)","ko":"밑줄 친 단어의 문맥상 뜻으로 가장 알맞은 것은?","opts":["전형적인","독특한","오래된","값비싼"],"word":"typical","r":{"a":"1) 전형적인","ev":"8번 문장","s":[[8,"The blog gained international attention because people found his pictures different from typical fashion photos, and millions of people from different backgrounds started visiting his blog to get style inspiration.","사람들이 그의 사진을 전형적인 패션 사진과는 다르다고 생각했기 때문에 그 블로그는 국제적인 주목을 받게 되었고, 수백만 명의 다양한 분야의 사람들이 스타일에 관한 영감을 얻기 위해 그의 블로그를 방문하기 시작했다."]],"w":"typical fashion photos는 '전형적인(흔한) 패션 사진'이에요. 슈만의 사진이 그런 사진들과 달랐다(different from)는 점이 주목받은 이유예요.","c":1},"h":"615ce1015d"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nTo him, a well-dressed person is one who displays a personal style, rather than a manufactured look created by stylists.","ko":"밑줄 친 one이 가리키는 것은?","sko":"그에게 옷을 잘 입는 사람은 스타일리스트에 의해 만들어진 양산된 모습보다는, 자기 개인의 스타일을 보여 주는 사람이다.","opts":["스타일리스트","옷을 잘 입는 사람","개인의 스타일","양산된 모습"],"r":{"a":"2) 옷을 잘 입는 사람","ev":"11번 문장","s":[[11,"To him, a well-dressed person is one who displays a personal style, rather than a manufactured look created by stylists.","그에게 옷을 잘 입는 사람은 스타일리스트에 의해 만들어진 양산된 모습보다는, 자기 개인의 스타일을 보여 주는 사람이다."]],"w":"a well-dressed person is one who displays a personal style에서 one은 앞에 나온 a well-dressed person(옷을 잘 입는 사람)을 받아요. who displays 이하가 그 one을 꾸며 줘요.","c":2},"h":"89143222f7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It didn’t matter if they were wearing trendy clothes or expensive brands.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들이 유행하는 옷을 입는지 비싼 브랜드 옷을 입는지는 상관없었다.","opts":["유행하는 옷이나 비싼 브랜드 옷을 입었는지는 중요하지 않았다.","유행하는 옷과 비싼 브랜드 옷을 입은 사람만 사진에 찍혔다.","유행하는 옷을 입은 사람은 사진을 찍을 수 없었다.","비싼 브랜드 옷을 입으면 꼭 사진을 찍어야 했다."],"r":{"a":"1) 유행하는 옷이나 비싼 브랜드 옷을 입었는지는 중요하지 않았다.","ev":"6번 문장","s":[[6,"It didn’t matter if they were wearing trendy clothes or expensive brands.","그들이 유행하는 옷을 입는지 비싼 브랜드 옷을 입는지는 상관없었다."]],"w":"didn't matter는 '중요하지 않았다'이고, if는 '~인지 아닌지'예요. 그래서 유행하는 옷인지 비싼 브랜드인지는 기준이 아니었다는 뜻이에요. 나머지는 모두 유행·브랜드를 조건으로 삼아 본문과 반대예요.","c":1},"h":"f5fed79c6e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["슈만은 사진 속 모델을 유명인으로 소개했다.","슈만은 하루 대부분을 블로그에 사진을 올리며 보냈다.","슈만이 사진 찍은 대상은 비싼 브랜드를 입은 사람들뿐이었다.","유명 브랜드들은 슈만과 광고 캠페인에서 공동 작업을 했다."],"opts":["Schuman introduced the woman in the photo as a celebrity.","Schuman spent most of his day posting photos to his blog.","Schuman photographed only people in expensive brands.","Famous brands worked with Schuman on advertising campaigns."],"r":{"a":"4) Famous brands worked with Schuman on advertising campaigns.","ev":"2번, 4번, 6번, 9번 문장","s":[[2,"You might think she is a model or celebrity, but she is not.","당신은 그녀가 모델이나 유명인이라고 생각할지도 모르지만, 그렇지 않다."],[4,"After quitting his fashion sales job in 2005, Schuman went to the streets with his digital camera and spent four to five hours a day photographing people’s street wear.","2005년 패션 세일즈 일을 그만둔 후, 슈만은 디지털카메라와 함께 거리로 나갔고 하루에 네다섯 시간을 사람들의 길거리 패션을 찍으면서 보냈다."],[6,"It didn’t matter if they were wearing trendy clothes or expensive brands.","그들이 유행하는 옷을 입는지 비싼 브랜드 옷을 입는지는 상관없었다."],[9,"Soon after, famous brands began collaborating with him on advertising campaigns, and magazines started running his pictures.","곧 유명 브랜드들이 광고 캠페인에서 그와 공동 작업을 하기 시작했고, 잡지들은 그가 찍은 사진들을 싣기 시작했다."]],"w":"9번에서 유명 브랜드들이 광고 캠페인에서 그와 공동 작업을 시작했다고 해요. 2번에서 여자는 유명인이 아니고, 4번에서 네다섯 시간은 사진을 찍는 시간이며, 5~6번에서 대상은 브랜드와 상관없어요.","c":4},"h":"93d9f727dc"},{"n":9,"t":"sum","q":"Schuman believes that (A) is the most (B) thing in fashion.","ko":"슈만은 패션에서 (A)이(가) 가장 (B) 것이라고 믿는다.","oko":["(A) 가격 / (B) 비싼","(A) 개성 / (B) 중요한","(A) 유행 / (B) 지루한","(A) 가격 / (B) 중요한","(A) 개성 / (B) 비싼"],"opts":["(A) price / (B) expensive","(A) individuality / (B) important","(A) trend / (B) boring","(A) price / (B) important","(A) individuality / (B) expensive"],"r":{"a":"2) (A) individuality / (B) important (개성 / 중요한)","ev":"10번 문장","s":[[10,"Schuman believes individuality is the most important thing in fashion.","슈만은 개성이 패션에서 가장 중요한 것이라고 믿는다."]],"w":"10번에서 슈만은 개성(individuality)이 패션에서 가장 중요한(important) 것이라고 믿는다고 해요.","c":2},"h":"a23eaef55f"},{"n":10,"t":"fill","q":"A stylish woman [A] on the street, and a man [B] a picture of her.","ko":"한 맵시 있는 여성이 거리에서 [A], 한 남자가 그녀의 사진을 [B].","bank":["poses","takes","attractively","blog","photographers","inspiration"],"bko":{"poses":"포즈를 취하다","takes":"(사진을) 찍다","attractively":"매력적으로","blog":"블로그","photographers":"사진작가들","inspiration":"영감"},"r":{"a":"[A] poses (포즈를 취하다), [B] takes ((사진을) 찍다)","ev":"1번 문장","s":[[1,"A stylish woman poses on the street, and a man takes a picture of her.","한 맵시 있는 여성이 거리에서 포즈를 잡고 한 남자가 그녀의 사진을 찍는다."]],"w":"1번에서 한 맵시 있는 여성이 거리에서 포즈를 취하고(poses) 한 남자가 그녀의 사진을 찍는다(takes)고 해요. 주어가 3인칭 단수라 동사에 s가 붙었어요.","c":null},"h":"c410368ed3"}]},{"u":10,"id":"ch2-10-2","no":2,"ko":"과일인가 사람인가","items":[{"n":1,"t":"tf","q":"When the painting is turned upside down, the vegetables form a smiling face.","ko":"그림을 거꾸로 돌리면 채소들이 웃는 얼굴 모양을 이룬다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"However, when turned upside down, a different picture can be perceived.","그러나, 그것을 거꾸로 돌리면, 다른 그림이 인식될 수 있다."],[4,"The bowl transforms into a hat, and the vegetables form the shape of a man’s smiling face.","그릇은 모자가 되고, 채소는 한 남자의 웃는 얼굴 모양을 형성한다."]],"w":"3번에서 거꾸로 돌리면 다른 그림이 보인다고 하고, 4번에서 채소가 한 남자의 웃는 얼굴 모양을 이룬다(the vegetables form the shape of a man's smiling face)고 해요.","c":"T"},"h":"0ae91067e2"},{"n":2,"t":"tf","q":"Arcimboldo was not famous while he was alive.","ko":"아르침볼도는 살아 있는 동안 유명하지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Despite Arcimboldo being famous during his lifetime, his work faded from the public’s attention following his death in the sixteenth century.","아르침볼도가 그의 생애 동안 유명했음에도 불구하고, 그의 작품은 16세기 그의 죽음 이후 대중의 관심에서 서서히 사라졌다."]],"w":"10번에서 아르침볼도가 생애 동안 유명했다(famous during his lifetime)고 해요. 작품이 관심에서 사라진 것은 그가 죽은 뒤예요.","c":"F"},"h":"a91083dd26"},{"n":3,"t":"tf","q":"In the Renaissance, artists usually painted either objects or portraits.","ko":"르네상스 시대에 화가들은 보통 사물이나 초상화를 그렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"During this period, artists typically painted either objects or portraits.","이 시기에, 예술가들은 보통 사물이나 초상화를 그렸다."]],"w":"6번 문장에서 이 시기 화가들은 보통 사물이나 초상화를 그렸다(typically painted either objects or portraits)고 해요.","c":"T"},"h":"1407897f25"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Viewing his paintings from a distance, they may be perceived as human figures.)","ko":"밑줄 친 단어의 문맥상 뜻으로 가장 알맞은 것은?","opts":["지워진다","인식된다","판매된다","복원된다"],"word":"perceived","r":{"a":"2) 인식된다","ev":"3번, 8번 문장","s":[[3,"However, when turned upside down, a different picture can be perceived.","그러나, 그것을 거꾸로 돌리면, 다른 그림이 인식될 수 있다."],[8,"Viewing his paintings from a distance, they may be perceived as human figures.","그의 그림을 멀리서 본다면, 그것들은 인간의 모습처럼 인식될 수 있다."]],"w":"8번은 그의 그림을 멀리서 보면 사람의 모습처럼 perceived 될 수 있다는 말이고, 3번에서도 거꾸로 돌리면 다른 그림이 perceived 될 수 있다고 해요. 눈으로 보고 그렇게 알아본다는 뜻이라 '인식된다'가 맞아요.","c":2},"h":"814f15d322"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (His innovative method of combining many objects to create the peculiar appearance of a person served as inspiration for later surrealist painters like Salvador Dali.)","ko":"밑줄 친 단어의 문맥상 뜻으로 가장 알맞은 것은?","opts":["평범한","정확한","유명한","기이한"],"word":"peculiar","r":{"a":"4) 기이한","ev":"12번 문장","s":[[12,"His innovative method of combining many objects to create the peculiar appearance of a person served as inspiration for later surrealist painters like Salvador Dali.","많은 사물들을 결합하여 기이한 사람의 외형을 만들어내는 그의 혁신적인 기법은 이후 살바도르 달리와 같은 초현실주의 화가들에게 영감을 주는 역할을 했다."]],"w":"12번의 the peculiar appearance of a person은 사물을 결합해 만들어 낸, 보통 사람과는 다른 '기이한' 사람의 모습이에요. 그런 기법이 혁신적이라고 했으니 '평범한'은 맞지 않아요.","c":4},"h":"59874e6299"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAt first glance, it seems to depict a simple bowl filled with various vegetables.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"처음 휙 보면, 그것은 다양한 채소들로 가득 찬 단순한 그릇을 그린 것처럼 보인다.","opts":["그림","그릇","채소들","한 남자"],"r":{"a":"1) 그림","ev":"2번 문장","s":[[2,"At first glance, it seems to depict a simple bowl filled with various vegetables.","처음 휙 보면, 그것은 다양한 채소들로 가득 찬 단순한 그릇을 그린 것처럼 보인다."]],"w":"2번에서 it seems to depict(그린 것처럼 보인다)의 주어는 앞에서 말한 this painting(이 그림)이에요. 그림이 다양한 채소로 가득 찬 그릇을 그린 것처럼 보인다는 뜻이에요.","c":1,"k":"it = 그림"},"pron":"it","h":"1f2b0012fb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But, upon closer inspection, a collection of objects, such as flowers, books, or animals can be discovered.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나, 더 가까이에서 보면, 꽃, 책, 또는 동물과 같은 사물들의 모음이 발견될 수 있다.","opts":["가까이 다가가면 꽃, 책, 동물을 그린 세 점의 그림이 따로 걸려 있다.","꽃, 책, 동물은 사람의 얼굴보다 더 가까이에서만 그릴 수 있다.","가까이서 보면 그림 속 사람들이 꽃과 책과 동물로 변해 간다.","더 가까이에서 자세히 보면 꽃, 책, 동물 같은 사물들의 모음이 발견될 수 있다."],"r":{"a":"4) 더 가까이에서 자세히 보면 꽃, 책, 동물 같은 사물들의 모음이 발견될 수 있다.","ev":"9번 문장","s":[[9,"But, upon closer inspection, a collection of objects, such as flowers, books, or animals can be discovered.","그러나, 더 가까이에서 보면, 꽃, 책, 또는 동물과 같은 사물들의 모음이 발견될 수 있다."]],"w":"upon closer inspection은 '더 가까이서 자세히 살펴보면'이라는 뜻이고, a collection of objects, such as flowers, books, or animals는 '꽃, 책, 동물 같은 사물들의 모음'이에요. 그림이 따로 걸려 있다거나 사람이 변한다는 말은 본문에 없어요.","c":4},"h":"1f23b6336f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아르침볼도의 작품은 20세기에 다시 인기를 얻었다.","아르침볼도의 그림은 16세기에 다시 인기를 얻었다.","초현실주의 화가들이 아르침볼도에게 사물을 결합하는 법을 가르쳤다.","아르침볼도는 채소만 그렸고 다른 사물은 그리지 않았다."],"opts":["Arcimboldo’s artwork became popular again in the twentieth century.","Arcimboldo's paintings gained popularity again in the sixteenth century.","Surrealist painters taught Arcimboldo how to combine objects.","Arcimboldo painted only vegetables and no other objects."],"r":{"a":"1) Arcimboldo’s artwork became popular again in the twentieth century. (아르침볼도의 작품은 20세기에 다시 인기를 얻었다.)","ev":"11번 문장","s":[[11,"However, his remarkable artwork gained popularity once again in the twentieth century.","그러나, 그의 놀라운 작품은 20세기에 또다시 인기를 얻게 된다."]],"w":"11번에서 아르침볼도의 놀라운 작품은 20세기에 또다시 인기를 얻었다고 해요.","c":1},"h":"982013d13d"},{"n":9,"t":"sum","q":"Giuseppe Arcimboldo, a (A) artist of the Renaissance, pioneered a (B) style of painting.","ko":"주세페 아르침볼도는 르네상스 시대의 (A) 화가로, (B) 방식의 그림을 처음 시작했다.","oko":["(A) 부주의한 / (B) 흔한","(A) 저명한 / (B) 흔한","(A) 부주의한 / (B) 독특한","(A) 무명의 / (B) 독특한","(A) 저명한 / (B) 독특한"],"opts":["(A) careless / (B) common","(A) prominent / (B) common","(A) careless / (B) unique","(A) unknown / (B) unique","(A) prominent / (B) unique"],"r":{"a":"5) (A) prominent / (B) unique (저명한 / 독특한)","ev":"5번 문장","s":[[5,"This unique style of painting was pioneered by Giuseppe Arcimboldo, a prominent artist of the Renaissance.","이 독특한 방식의 그림은 르네상스 시대의 저명한 화가인 주세페 아르침볼도에 의해 처음 시작되었다."]],"w":"5번에서 이 독특한(unique) 방식의 그림은 르네상스 시대의 저명한(prominent) 화가인 아르침볼도가 처음 시작했다고 해요.","c":5},"h":"bbcd79fabc"},{"n":10,"t":"fill","q":"Arcimboldo [A] combined these two styles, arranging the objects in his paintings to [B] people’s faces.","ko":"아르침볼도는 이 두 가지 방식을 [A] 결합했고, 그림 속 사물들을 배치해 사람의 얼굴을 [B] 모습을 만들었다.","bank":["ingeniously","resemble","collection","distance","lifetime","faded"],"bko":{"ingeniously":"기발하게","resemble":"닮다","collection":"모음","distance":"거리","lifetime":"생애","faded":"서서히 사라졌다"},"r":{"a":"[A] ingeniously (기발하게), [B] resemble (닮다)","ev":"7번 문장","s":[[7,"Arcimboldo ingeniously combined these two styles, arranging the objects in his paintings to resemble people’s faces.","아르침볼도는 이 두 가지 방식을 기발하게 결합하여, 그의 그림 속 사물들을 사람의 얼굴처럼 보이도록 배치한다."]],"w":"7번에서 아르침볼도는 이 두 가지 방식을 기발하게(ingeniously) 결합해서, 그림 속 사물들이 사람의 얼굴을 닮도록(resemble) 배치했다고 해요.","c":null},"h":"5e45666616"}]},{"u":10,"id":"ch2-10-3","no":3,"ko":"스타들의 숨겨진 과거","items":[{"n":1,"t":"tf","q":"Bruce Willis said that acting helped him beat his stutter.","ko":"브루스 윌리스는 연기가 그가 말더듬을 극복하는 데 도움이 되었다고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In an interview, he revealed that acting helped him beat his stutter and work on his sense of humor.","한 인터뷰에서, 그는 연기가 그가 말 더듬는 것을 극복하고 유머 감각을 단련시키는 데 도움이 되었다고 밝혔다."]],"w":"6번 문장에서 한 인터뷰에서 윌리스가 연기가 말더듬을 극복하고(beat his stutter) 유머 감각을 단련시키는 데 도움이 되었다고 밝혔다고 해요.","c":"T"},"h":"f855c4dea4"},{"n":2,"t":"tf","q":"Michael Phelps got in trouble at school for talking too much.","ko":"마이클 펠프스는 학교에서 말을 너무 많이 해서 곤란에 처했다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"In school, Phelps sometimes got in trouble for not sitting still in class.","학교에서, 펠프스는 때때로 수업 시간에 가만히 앉아 있지 못하여 곤란에 처했다."]],"w":"10번에서 펠프스가 곤란해진 이유는 수업 시간에 가만히 앉아 있지 못해서(for not sitting still)예요. 말을 많이 해서라는 말은 본문에 없어요.","c":"F"},"h":"99af28b609"},{"n":3,"t":"tf","q":"Knightley's parents offered to find her an acting agent in return for learning to read.","ko":"나이틀리의 부모는 그녀가 읽는 법을 배우는 대신 연기 에이전트를 구해 주겠다고 제안했다.","r":{"a":"T (본문과 맞는 내용)","ev":"15~16번 문장","s":[[15,"To help her defeat her disability, Knightley’s parents made a deal with her.","그녀가 장애를 극복하도록 돕기 위해, 나이틀리의 부모는 그녀에게 조건을 걸었다."],[16,"They agreed to find her an acting agent if she learned to read.","만약 그녀가 읽는 법을 배운다면 그들은 그녀에게 연기 에이전트를 구해주기로 동의했다."]],"w":"15번에서 부모가 조건을 걸었고(made a deal), 16번에서 읽는 법을 배우면 연기 에이전트를 구해 주기로 동의했다고 해요.","c":"T"},"h":"37ba61313b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (After years of training, his persistent hard work ultimately resulted in multiple Olympic gold medals.)","ko":"밑줄 친 단어의 문맥상 뜻으로 가장 알맞은 것은?","opts":["일시적인","가벼운","끈질긴","숨겨진"],"word":"persistent","r":{"a":"3) 끈질긴","ev":"12번 문장","s":[[12,"After years of training, his persistent hard work ultimately resulted in multiple Olympic gold medals.","수년간의 훈련 끝에, 그의 끈질긴 고된 노력은 결국 여러 개의 올림픽 금메달의 결과로 이어졌다."]],"w":"12번은 수년간의 훈련 끝에 그의 persistent hard work가 결국 여러 개의 올림픽 금메달로 이어졌다는 말이에요. 금메달이라는 큰 결과로 이어진 노력이니 '끈질긴'이 알맞아요.","c":3},"h":"e97b1c718c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Bruce Willis is a retired actor praised for his acting ability, but he wasn’t initially natural on camera.)","ko":"밑줄 친 단어의 문맥상 뜻으로 가장 알맞은 것은?","opts":["처음에","결국","가끔","갑자기"],"word":"initially","r":{"a":"1) 처음에","ev":"4번 문장","s":[[4,"Bruce Willis is a retired actor praised for his acting ability, but he wasn’t initially natural on camera.","브루스 윌리스는 연기 실력으로 칭찬받던 은퇴한 배우이지만, 처음에 카메라 앞에서 자연스럽지 않았다."]],"w":"4번의 but he wasn't initially natural on camera는 '하지만 그는 처음에는 카메라 앞에서 자연스럽지 않았다'예요. 지금은 칭찬받는 배우이지만 처음에는 달랐다는 대비라서 initially는 '처음에'예요.","c":1},"h":"6fa4823c9e"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nBut Phelps’ focus wasn’t always strong, as he had ADHD.","ko":"밑줄 친 he이(가) 가리키는 것은?","sko":"그러나, 펠프스는 ADHD(주의력 결핍 및 과잉행동 장애)를 앓았기 때문에 그의 집중력이 늘 강하지는 않았다.","opts":["마이클 펠프스","브루스 윌리스","키이라 나이틀리","수영 코치"],"r":{"a":"1) 마이클 펠프스","ev":"9번 문장","s":[[9,"But Phelps’ focus wasn’t always strong, as he had ADHD.","그러나, 펠프스는 ADHD(주의력 결핍 및 과잉행동 장애)를 앓았기 때문에 그의 집중력이 늘 강하지는 않았다."]],"w":"9번에서 Phelps’ focus(펠프스의 집중력)가 늘 강하지는 않았다고 하고, as he had ADHD의 he도 같은 사람인 펠프스를 가리켜요.","c":1,"k":"he = 마이클 펠프스"},"pron":"he","h":"da1df2c5d7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By being funny, Willis was able to keep people’s attention off his disability and on his comedic acting skills.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"유머러스해짐으로써, 윌리스는 사람들의 관심을 자신의 장애로부터 돌리고 코믹 연기 능력으로 향하도록 할 수 있었다.","opts":["사람들이 그의 장애에 더 주목하도록 만들 수 있었다.","코믹 연기를 포기하고 장애에만 집중하게 만들 수 있었다.","사람들이 그의 연기에 관심을 끊게 만들 수 있었다.","사람들의 관심을 그의 장애가 아니라 코믹 연기 실력으로 돌릴 수 있었다."],"r":{"a":"4) 사람들의 관심을 그의 장애가 아니라 코믹 연기 실력으로 돌릴 수 있었다.","ev":"7번 문장","s":[[7,"By being funny, Willis was able to keep people’s attention off his disability and on his comedic acting skills.","유머러스해짐으로써, 윌리스는 사람들의 관심을 자신의 장애로부터 돌리고 코믹 연기 능력으로 향하도록 할 수 있었다."]],"w":"keep people's attention off his disability and on his comedic acting skills는 '사람들의 관심을 장애에서 떼고 코믹 연기 실력에 두게 하다'예요. 나머지는 관심이 장애로 가거나 연기에서 멀어진다는 뜻이라 반대예요.","c":4},"h":"10f4cedafc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마이클 펠프스는 학교 다닐 때 늘 집중력이 강했다.","키이라 나이틀리의 반 친구들은 그녀가 영화에 출연해서 놀렸다.","마이클 펠프스는 수영으로 주의를 돌린 뒤 집중력을 기를 수 있었다.","유명 인사들 가운데 학습 장애를 가진 사람은 없다."],"opts":["Michael Phelps always had strong focus in school.","Keira Knightley's classmates teased her because she acted in a movie.","Michael Phelps was able to build his concentration after he turned his attention to swimming.","None of the celebrities have learning disabilities."],"r":{"a":"3) Michael Phelps was able to build his concentration after he turned his attention to swimming.","ev":"3번, 9번, 11번, 13번 문장","s":[[3,"You may be startled to learn that many celebrities have learning disabilities, and the following is a list of inspirational stars who have learned to live with a disability.","만약 당신이 많은 유명 인사가 학습 장애를 가지고 있다는 것을 안다면 아마 놀랄지도 모를텐데, 다음은 장애를 가지고 사는 것을 배운, 영감을 주는 스타들의 목록이다."],[9,"But Phelps’ focus wasn’t always strong, as he had ADHD.","그러나, 펠프스는 ADHD(주의력 결핍 및 과잉행동 장애)를 앓았기 때문에 그의 집중력이 늘 강하지는 않았다."],[11,"But when he turned his attention to swimming, he was able to build his concentration.","그러나 그가 수영으로 주의를 돌리자, 그는 집중력을 기를 수 있었다."],[13,"When Keira Knightley was young, her classmates teased her because she could not read.","키이라 나이틀리가 어렸을 때, 그녀의 반 친구들은 그녀가 읽지 못해서 그녀를 놀렸다."]],"w":"11번에서 펠프스가 수영으로 주의를 돌리자 집중력을 기를 수 있었다고 해요. 9번에서 집중력은 늘 강하지는 않았고, 13번에서 나이틀리가 놀림받은 것은 읽지 못했기 때문이며, 3번에서 많은 유명 인사가 학습 장애를 가졌다고 해요.","c":3},"h":"7f6ebb7f6b"},{"n":9,"t":"sum","q":"Many famous people have learning disabilities, but Willis, Phelps, and Knightley each found a way to (A) their disabilities and (B) as stars.","ko":"많은 유명인이 학습 장애를 가지고 있지만, 윌리스, 펠프스, 나이틀리는 각자 자신의 장애를 (A) 스타로서 (B) 방법을 찾았다.","oko":["(A) 극복하다 / (B) 실패하다","(A) 피하다 / (B) 성공하다","(A) 탓하다 / (B) 은퇴하다","(A) 일으키다 / (B) 성공하다","(A) 극복하다 / (B) 성공하다"],"opts":["(A) overcome / (B) fail","(A) avoid / (B) succeed","(A) blame / (B) quit","(A) cause / (B) succeed","(A) overcome / (B) succeed"],"r":{"a":"5) (A) overcome / (B) succeed","ev":"3번, 12번, 17번 문장","s":[[3,"You may be startled to learn that many celebrities have learning disabilities, and the following is a list of inspirational stars who have learned to live with a disability.","만약 당신이 많은 유명 인사가 학습 장애를 가지고 있다는 것을 안다면 아마 놀랄지도 모를텐데, 다음은 장애를 가지고 사는 것을 배운, 영감을 주는 스타들의 목록이다."],[12,"After years of training, his persistent hard work ultimately resulted in multiple Olympic gold medals.","수년간의 훈련 끝에, 그의 끈질긴 고된 노력은 결국 여러 개의 올림픽 금메달의 결과로 이어졌다."],[17,"Well, you can probably imagine how it turned out, because Knightley is now one of the most renowned actresses in the world.","당신은 아마 그 결과가 어떻게 되었는지 상상할 수 있을 것인데, 왜냐하면 나이틀리는 현재 세계에서 가장 유명한 여배우 중 하나이기 때문이다."]],"w":"3번에서 장애와 사는 법을 배운 영감을 주는 스타들이라고 소개하고, 세 사람 모두 그 어려움을 이겨 내(6~7번, 11~12번, 15~17번) 지금은 유명해졌어요. 그래서 (A)는 overcome, (B)는 succeed가 알맞아요.","c":5},"h":"8204e73897"},{"n":10,"t":"fill","q":"They’re famous and [A], but they sometimes [B] obstacles, too.","ko":"그들은 유명하고 [A] 사람들이지만, 가끔은 난관에 [B].","bank":["charismatic","encounter","initially","stutter","deal","agent"],"bko":{"charismatic":"카리스마 있는","encounter":"직면하다, 맞닥뜨리다","initially":"처음에","stutter":"말더듬증","deal":"거래, 조건","agent":"에이전트, 대리인"},"r":{"a":"[A] charismatic (카리스마 있는), [B] encounter (직면하다, 맞닥뜨리다)","ev":"2번 문장","s":[[2,"They’re famous and charismatic, but they sometimes encounter obstacles, too.","그들은 유명하고, 카리스마가 있지만 그들도 가끔은 난관에 직면한다."]],"w":"2번에서 유명 인사들은 유명하고 카리스마가 있지만(charismatic) 가끔은 난관에 직면한다(encounter)고 해요.","c":null},"h":"27c1243e1e"}]},{"u":10,"id":"ch2-10-4","no":4,"ko":"수능:ON 요약문","items":[{"n":1,"t":"tf","q":"Most people watching track events focus only on how fast the athletes run.","ko":"육상 경기를 보는 대부분의 사람은 선수들이 얼마나 빨리 달리는지에만 초점을 맞춘다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Understandably, the focus is only on how fast the athletes are running, but there’s something else most people probably don’t notice.","당연하게도, 초점은 선수들이 얼마나 빨리 달리고 있는지에만 맞춰져 있지만, 대부분의 사람들이 아마도 알아채지 못하는 다른 무언가가 있다."]],"w":"2번 문장에서 초점은 선수들이 얼마나 빨리 달리는지에만(only on how fast the athletes are running) 맞춰져 있다고 해요.","c":"T"},"h":"164628529e"},{"n":2,"t":"tf","q":"Turning to the right helps the heart pump blood more easily to the other organs.","ko":"오른쪽으로 도는 것은 심장이 다른 기관으로 피를 더 쉽게 보내도록 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Turning to the right has the opposite effect, as blood is pushed to the left and away from the other organs.","오른쪽으로 도는 것은 반대의 효과가 있는데, 그 이유는 혈액이 왼쪽으로 밀려가서 다른 기관들로부터 멀어지기 때문이다."]],"w":"9번에서 오른쪽으로 도는 것은 반대의 효과가 있다고 해요. 피가 왼쪽으로 밀려가 다른 기관들에서 멀어지기 때문이에요. 피를 더 쉽게 보내는 것은 왼쪽으로 돌 때예요(7번).","c":"F"},"h":"7c2ccf0176"},{"n":3,"t":"tf","q":"The writer suggests running around a track clockwise to feel the difference.","ko":"글쓴이는 차이를 느껴 보도록 트랙을 시계 방향으로 달려 보라고 권한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12~13번 문장","s":[[12,"Next time you visit an athletics track, try running around it in a clockwise direction.","다음에 당신이 육상 트랙을 방문하면, 그 트랙을 시계 방향으로 달리는 것을 시도해 보라."],[13,"You’ll feel how much more difficult it is, and understand why we normally run the other way!","당신은 그것이 얼마나 더 힘든지를 느낄 것이며, 왜 우리가 보통 그 반대 방향으로 달리는지를 이해하게 될 것이다!"]],"w":"12번에서 트랙을 시계 방향으로 달려 보라(try running around it in a clockwise direction)고 하고, 13번에서 그러면 얼마나 더 힘든지 느낄 것이라고 해요.","c":"T"},"h":"839a55e7e1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When a runner turns to the left in a counterclockwise direction, he or she encounters centrifugal force.)","ko":"밑줄 친 단어의 문맥상 뜻으로 가장 알맞은 것은?","opts":["피한다","맞닥뜨린다","만든다","가르친다"],"word":"encounters","r":{"a":"2) 맞닥뜨린다","ev":"6번 문장","s":[[6,"When a runner turns to the left in a counterclockwise direction, he or she encounters centrifugal force.","달리기 선수가 시계 반대 방향으로 달리며 왼쪽으로 돌 때, 그 또는 그녀는 원심력을 맞닥뜨리게 된다."]],"w":"6번은 달리기 선수가 왼쪽으로 돌 때 원심력을 encounter 한다는 말이에요. 돌면 저절로 원심력이 작용하는 상황이라, '피한다'가 아니라 '맞닥뜨린다'가 알맞아요.","c":2},"h":"a24ff7948d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Firstly, it is related to the structure of the human body, specifically, the position of the heart, the body’s most vital organ, which is slightly to the left of the center.)","ko":"밑줄 친 단어의 문맥상 뜻으로 가장 알맞은 것은?","opts":["우연히","가끔은","거의","구체적으로"],"word":"specifically","r":{"a":"4) 구체적으로","ev":"5번 문장","s":[[5,"Firstly, it is related to the structure of the human body, specifically, the position of the heart, the body’s most vital organ, which is slightly to the left of the center.","우선, 이것은 인간의 신체 구조와 관련이 있는데, 구체적으로 신체의 가장 필수적인 기관인 심장의 위치이며, 그것은 중심에서 약간 왼쪽에 있다."]],"w":"5번에서 인간의 신체 구조와 관련이 있다고 먼저 말한 뒤, specifically, the position of the heart라고 더 자세히 짚어요. 넓은 말을 구체적으로 좁혀 주는 표현이라 '구체적으로'예요.","c":4},"h":"a5bb99c819"},{"n":6,"t":"ref","q":"What does the underlined \"the act\" refer to?\nThe other key point is that turning to the left is more natural for most people because the act requires the right foot to push harder.","ko":"밑줄 친 the act이(가) 가리키는 것은?","sko":"또 다른 요점은 왼쪽으로 도는 것이 오른발로 더 세게 미는 것을 필요로 하기 때문에 대부분의 사람들에게 더 자연스럽다는 것이다.","opts":["왼쪽으로 도는 것","오른발로 미는 것","육상 트랙을 방문하는 것","시계 방향으로 달리는 것"],"r":{"a":"1) 왼쪽으로 도는 것","ev":"10번 문장","s":[[10,"The other key point is that turning to the left is more natural for most people because the act requires the right foot to push harder.","또 다른 요점은 왼쪽으로 도는 것이 오른발로 더 세게 미는 것을 필요로 하기 때문에 대부분의 사람들에게 더 자연스럽다는 것이다."]],"w":"10번에서 turning to the left is more natural ... because the act requires the right foot to push harder에서 the act는 앞에 나온 turning to the left(왼쪽으로 도는 것)를 다시 가리켜요.","c":1,"k":"the act = 왼쪽으로 도는 것"},"pron":"the act","h":"5a7617a70d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Everyone enjoys watching the track and field events at the Olympics.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"모든 사람은 올림픽에서 육상 경기를 보는 것을 즐긴다.","opts":["모든 사람이 올림픽의 육상 경기를 보는 것을 즐긴다.","올림픽의 육상 경기는 보는 사람이 거의 없다.","올림픽의 육상 선수들은 경기를 즐기지 못한다.","육상 경기를 보는 것을 즐기는 사람은 일부뿐이다."],"r":{"a":"1) 모든 사람이 올림픽의 육상 경기를 보는 것을 즐긴다.","ev":"1번 문장","s":[[1,"Everyone enjoys watching the track and field events at the Olympics.","모든 사람은 올림픽에서 육상 경기를 보는 것을 즐긴다."]],"w":"1번에서 모든 사람이 올림픽에서 육상 경기를 보는 것을 즐긴다고 해요.","c":1},"h":"3e4971b6a0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["선수들은 모든 육상 경기에서 시계 방향으로 달린다.","선수들은 모든 육상 경기에서 시계 반대 방향으로 달린다.","선수들은 대부분의 육상 경기에서 방향을 고를 수 있다.","장거리 선수들만 시계 반대 방향으로 달린다."],"opts":["Athletes run in a clockwise direction in all track events.","Athletes run in a counterclockwise direction in all track events.","Athletes can choose either direction in most track events.","Only long-distance runners run in a counterclockwise direction."],"r":{"a":"2) Athletes run in a counterclockwise direction in all track events. (선수들은 모든 육상 경기에서 시계 반대 방향으로 달린다.)","ev":"3번 문장","s":[[3,"In all the events, the athletes run in a counterclockwise direction.","모든 경기에서, 선수들은 시계 반대 방향으로 달린다."]],"w":"3번에서 모든 경기에서 선수들은 시계 반대 방향으로 달린다고 해요.","c":2},"h":"b4b25a1b81"},{"n":9,"t":"sum","q":"Most people are (A), and most also have a stronger right foot, so turning left is an (B) motion.","ko":"대부분의 사람은 (A)이고 대다수가 더 강한 오른발을 가지고 있어서, 왼쪽으로 도는 것이 (B) 동작이다.","oko":["(A) 왼손잡이 / (B) 더 쉬운","(A) 오른손잡이 / (B) 더 어려운","(A) 왼손잡이 / (B) 더 어려운","(A) 오른손잡이 / (B) 더 쉬운","(A) 키가 큰 / (B) 더 빠른"],"opts":["(A) left-handed / (B) easier","(A) right-handed / (B) harder","(A) left-handed / (B) harder","(A) right-handed / (B) easier","(A) tall / (B) faster"],"r":{"a":"4) (A) right-handed / (B) easier (오른손잡이 / 더 쉬운)","ev":"11번 문장","s":[[11,"Just as most people are right-handed, most also have a stronger right foot, so turning left is an easier motion.","대부분 사람들이 오른손잡이인 것처럼 또한 대다수가 더 강한 오른발을 가지고 있고, 따라서 왼쪽으로 도는 것이 더 쉬운 동작이다."]],"w":"11번에서 대부분 사람들이 오른손잡이(right-handed)인 것처럼 대다수가 더 강한 오른발을 가지고 있어서, 왼쪽으로 도는 것이 더 쉬운(easier) 동작이라고 해요.","c":4},"h":"a81b0b50e5"},{"n":10,"t":"fill","q":"You’ll feel how much more [A] it is, and understand why we [B] run the other way!","ko":"당신은 그것이 얼마나 더 [A]지를 느낄 것이며, 왜 우리가 [B] 그 반대 방향으로 달리는지를 이해하게 될 것이다!","bank":["difficult","normally","direction","track","heart","organs"],"bko":{"difficult":"어려운","normally":"보통, 평소에","direction":"방향","track":"트랙","heart":"심장","organs":"기관들"},"r":{"a":"[A] difficult (어려운), [B] normally (보통, 평소에)","ev":"13번 문장","s":[[13,"You’ll feel how much more difficult it is, and understand why we normally run the other way!","당신은 그것이 얼마나 더 힘든지를 느낄 것이며, 왜 우리가 보통 그 반대 방향으로 달리는지를 이해하게 될 것이다!"]],"w":"13번에서 시계 방향으로 달려 보면 그것이 얼마나 더 어려운지(difficult) 느끼고, 왜 우리가 보통(normally) 그 반대 방향으로 달리는지 이해하게 된다고 해요.","c":null},"h":"d301871067"}]}];
