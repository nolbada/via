lenge.)","ko":"이 아주 작은 예술품을 만드는 것은 큰 ( )이다.","opts":["도전, 어려운 일","선물","실수","휴식"],"word":"challenge","r":{"a":"1) 도전, 어려운 일","ev":"4~5번 문장","s":[[4,"Making these tiny artworks is a big challenge.","이 아주 작은 예술품을 만드는 것은 큰 도전입니다."],[5,"First, the artist has to use a microscope to see them clearly, and use really small tools made from needles.","먼저, 예술가는 그것들을 뚜렷하게 보기 위해 현미경을 사용해야 하고, 바늘로 만든 정말 작은 도구들을 사용해야 합니다."]],"w":"4번에서 아주 작은 예술품을 만드는 것이 a big challenge라고 하고, 5~6번에서 현미경, 속눈썹, 심장 박동 사이 작업 같은 어려운 점을 설명함. challenge는 도전, 어려운 일.","c":1},"h":"c624c8554a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Small things matter in a disappearing world.)","ko":"( ) 세계에서 작은 것들은 중요하다.","opts":["커지고 있는","사라지고 있는","새로워지고 있는","변하지 않는"],"word":"disappearing","r":{"a":"2) 사라지고 있는","ev":"7~8번 문장","s":[[7,"Wigan’s small artwork has an important message: “Small things matter in a disappearing world.”","Wigan의 작은 예술품에는 중요한 메시지가 담겨 있습니다: “사라지고 있는 세계에서 작은 것들은 중요합니다.”"],[8,"He reminds us that our world is in trouble, and we need to make changes to protect the variety of life on Earth.","그는 우리에게 세계가 곤경에 처해 있고, 지구상의 다양한 생명체를 보호하기 위해 우리가 변화를 만들어야 한다는 것을 상기시킵니다."]],"w":"7번의 disappearing world는 8번에서 ‘세계가 곤경에 처해 있고 다양한 생명체를 보호해야 한다’는 이야기로 이어짐. 그래서 disappearing은 사라지고 있는. 커지거나 새로워지는 세계가 아님.","c":2},"h":"d5732ff04d"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThese sculptures are so small that they can be placed even in the eye of a needle!","ko":"밑줄 친 they가 가리키는 것은?","pron":"they","opts":["조각품들","바늘들","예술가들","그림들"],"sko":"이 조각품들은 너무 작아서 심지어 바늘구멍 안에도 놓일 수 있습니다!","r":{"a":"1) 조각품들","w":"3번 문장 These sculptures are so small that they can be placed...에서 they는 앞의 These sculptures(이 조각품들).","c":1,"ev":"3번 문장","s":[[3,"These sculptures are so small that they can be placed even in the eye of a needle!","이 조각품들은 너무 작아서 심지어 바늘구멍 안에도 놓일 수 있습니다!"]],"k":"they = 조각품들"},"h":"e1560453c1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He reminds us that our world is in trouble, and we need to make changes to protect the variety of life on Earth.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 우리에게 세계가 곤경에 처해 있고, 지구상의 다양한 생명체를 보호하기 위해 우리가 변화를 만들어야 한다는 것을 상기시킵니다.","opts":["그는 지구의 생명체가 너무 많아서 더 줄여야 한다고 말한다.","그는 세계가 안전하므로 변화를 만들 필요가 없다고 말한다.","그는 우리가 작은 예술품을 더 많이 만들어야 한다고 말한다.","그는 세계가 곤경에 처해 있어서 다양한 생명체를 보호하려면 변화가 필요하다고 상기시킨다."],"r":{"a":"4) 그는 세계가 곤경에 처해 있어서 다양한 생명체를 보호하려면 변화가 필요하다고 상기시킨다.","ev":"8번 문장","s":[[8,"He reminds us that our world is in trouble, and we need to make changes to protect the variety of life on Earth.","그는 우리에게 세계가 곤경에 처해 있고, 지구상의 다양한 생명체를 보호하기 위해 우리가 변화를 만들어야 한다는 것을 상기시킵니다."]],"w":"8번의 our world is in trouble은 세계가 곤경에 처했다는 뜻이고, we need to make changes to protect the variety of life는 다양한 생명체를 보호하기 위해 변화를 만들어야 한다는 뜻. 생명체를 줄이자거나 변화가 필요 없다는 말이 아님.","c":4},"h":"1e588aee36"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Wigan은 유명한 그림의 큰 조각품을 만든다.","그의 작품은 가장 작은 것들조차 큰 영향을 미칠 수 있다고 생각하게 한다.","그의 조각품들은 너무 커서 바늘구멍에 놓일 수 없다.","Wigan은 망원경을 사용해 조각품을 칠한다."],"opts":["Wigan makes large sculptures of famous paintings.","His tiny work makes people think that even the smallest things can have a big impact.","The sculptures are too big to be placed in the eye of a needle.","Wigan uses a telescope to paint his sculptures."],"r":{"a":"2) His tiny work makes people think that even the smallest things can have a big impact. (그의 작품은 가장 작은 것들조차 큰 영향을 미칠 수 있다고 생각하게 한다.)","ev":"1번, 3번, 5~6번, 9번 문장","s":[[1,"Willard Wigan is an artist who makes small sculptures of famous paintings and characters like the Mona Lisa and Pinocchio.","Willard Wigan은 모나리자와 피노키오 같은 유명한 그림과 캐릭터의 작은 조각품을 만드는 예술가입니다."],[3,"These sculptures are so small that they can be placed even in the eye of a needle!","이 조각품들은 너무 작아서 심지어 바늘구멍 안에도 놓일 수 있습니다!"],[5,"First, the artist has to use a microscope to see them clearly, and use really small tools made from needles.","먼저, 예술가는 그것들을 뚜렷하게 보기 위해 현미경을 사용해야 하고, 바늘로 만든 정말 작은 도구들을 사용해야 합니다."],[6,"Then, he paints his sculptures by using an eyelash and must work between heartbeats because even the pulse in his fingers can cause problems.","그다음, 그는 속눈썹을 사용해 조각품을 칠하며, 심지어 손가락의 맥박도 문제를 일으킬 수 있기 때문에 심장 박동 사이에 작업해야 합니다."],[9,"His tiny work makes people think that even the smallest things can have a big impact.","그의 아주 작은 작품은 사람들이 가장 작은 것들조차 큰 영향을 미칠 수 있다고 생각하게 합니다."]],"w":"9번에서 그의 아주 작은 작품은 가장 작은 것들조차 큰 영향을 미칠 수 있다고 생각하게 함. 조각품은 작고(1번), 바늘구멍에도 놓일 수 있으며(3번), 칠하는 도구는 속눈썹(6번)이라서 나머지는 모두 본문과 다름.","c":2},"h":"9f147326f7"},{"n":9,"t":"sum","q":"Willard Wigan is an (A) who makes small sculptures of famous paintings and characters like the Mona Lisa and (B).","ko":"Willard Wigan은 모나리자와 (B) 같은 유명한 그림과 캐릭터의 작은 조각품을 만드는 (A)입니다.","opts":["(A) artist / (B) Pinocchio","(A) artist / (B) Cinderella","(A) doctor / (B) Pinocchio","(A) doctor / (B) Cinderella","(A) teacher / (B) Pinocchio"],"oko":["(A) 예술가 / (B) 피노키오","(A) 예술가 / (B) 신데렐라","(A) 의사 / (B) 피노키오","(A) 의사 / (B) 신데렐라","(A) 교사 / (B) 피노키오"],"r":{"a":"1) (A) artist / (B) Pinocchio ((A) 예술가 / (B) 피노키오)","w":"1번 문장 Willard Wigan is an artist who makes small sculptures of famous paintings and characters like the Mona Lisa and Pinocchio.에서 가져옴.","c":1,"ev":"1번 문장","s":[[1,"Willard Wigan is an artist who makes small sculptures of famous paintings and characters like the Mona Lisa and Pinocchio.","Willard Wigan은 모나리자와 피노키오 같은 유명한 그림과 캐릭터의 작은 조각품을 만드는 예술가입니다."]]},"h":"c271ebb4a1"},{"n":10,"t":"fill","q":"Wigan’s small artwork has an [A] [B]: “Small things matter in a disappearing world.”","ko":"Wigan의 작은 예술품에는 [A] [B]이(가) 담겨 있습니다: “사라지고 있는 세계에서 작은 것들은 중요합니다.”","bank":["important","message","protect","remind","paint","use"],"bko":{"important":"중요한","message":"메시지","protect":"보호하다","remind":"상기시키다","paint":"칠하다","use":"사용하다"},"r":{"a":"[A] important (중요한), [B] message (메시지)","w":"7번 문장 Wigan’s small artwork has an important message: ...에서 가져옴. 나머지는 동사라 an ___ ___ 자리에 맞지 않음.","c":null,"ev":"7번 문장","s":[[7,"Wigan’s small artwork has an important message: “Small things matter in a disappearing world.”","Wigan의 작은 예술품에는 중요한 메시지가 담겨 있습니다: “사라지고 있는 세계에서 작은 것들은 중요합니다.”"]]},"h":"8d92cb2b81"}]},{"u":5,"id":"rg3-05-2","no":2,"ko":"서랍 속에서 잠자고 있는 전자 제품의 비밀","items":[{"n":1,"t":"tf","q":"A study shows that many households in Europe put electronic items that stop working in a drawer.","ko":"한 연구는 유럽의 많은 가정이 작동하지 않게 된 전자 제품을 서랍에 넣는다고 보여 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"When your electronic item stops working, do you put it in a drawer?","여러분의 전자 제품이 작동을 멈추면, 그것을 서랍 안에 넣나요?"],[2,"A study shows that many households in Europe do this too.","한 연구에 따르면 유럽의 많은 가정도 이렇게 한다고 해요."]],"w":"1번에서 전자 제품이 멈추면 서랍에 넣느냐고 묻고, 2번에서 한 연구가 유럽의 많은 가정도 이렇게 한다고 보여 줌. 일치.","c":"T"},"h":"aed083f10f"},{"n":2,"t":"tf","q":"Out of 74 electronic items in a household, 30 aren’t used anymore.","ko":"한 가정의 전자 제품 74개 중 30개는 더 이상 사용되지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Out of 74 electronic items in a household, 13 aren’t used anymore.","가정에 있는 74개의 전자 제품 중에서 13개는 더 이상 사용되지 않아요."]],"w":"3번 문장에서 더 이상 사용되지 않는 것은 30개가 아니라 13개(13 aren’t used anymore)임.","c":"F"},"h":"5317b19398"},{"n":3,"t":"tf","q":"E-waste includes anything with plugs, cords, and electronic parts.","ko":"e-폐기물은 플러그, 코드, 전자 부품이 있는 어떤 것이든 포함한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Whatever the reason is, e-waste includes anything with plugs, cords, and electronic parts.","이유가 무엇이든, e-폐기물은 플러그와 코드, 그리고 전자 부품이 있는 어떤 것이든 포함해요."]],"w":"7번 문장에 e-waste includes anything with plugs, cords, and electronic parts가 그대로 있음. 일치.","c":"T"},"h":"3f153f5514"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It has valuable metals like gold, silver, and copper.)","ko":"그것은 금, 은, 구리 같은 ( ) 금속을 가지고 있다.","opts":["귀중한","가벼운","오래된","값싼"],"word":"valuable","r":{"a":"1) 귀중한","ev":"8~9번 문장","s":[[8,"But, e-waste is more than regular trash.","하지만, e-폐기물은 일반적인 쓰레기 그 이상이에요."],[9,"It has valuable metals like gold, silver, and copper.","그것은 금과 은, 그리고 구리와 같은 귀중한 금속을 가지고 있어요."]],"w":"8번에서 e-폐기물이 일반 쓰레기 그 이상이라고 한 이유가 9번의 gold, silver, copper. 금, 은, 구리처럼 가치가 큰 금속이므로 valuable은 귀중한. 값싼 것이라면 쓰레기 그 이상이라고 할 수 없음.","c":1},"h":"e16687bac1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These can be reused to make batteries for electric cars and solar panels.)","ko":"이것들은 전기 자동차 배터리와 태양 전지판을 만드는 데 ( ) 수 있다.","opts":["버려지다","팔리다","재사용되다","고장 나다"],"word":"reused","r":{"a":"3) 재사용되다","ev":"10~11번 문장","s":[[10,"These can be reused to make batteries for electric cars and solar panels.","이것들은 전기 자동차 배터리와 태양 전지판을 만드는 데 재사용될 수 있어요."],[11,"So, if you have any e-waste in your house, take it to a local recycling center.","그러니까, 만약 여러분의 집에 어떠한 e-폐기물이라도 있다면, 그것을 지역 재활용 센터에 가져가세요."]],"w":"10번에서 금속들이 배터리와 태양 전지판을 만드는 데 다시 쓰일 수 있다고 함. re-(다시) + use(쓰다)라서 reused는 재사용되다. 11번에서 재활용 센터에 가져가라고 하므로 버려진다는 뜻이 아님.","c":3},"h":"d6a473f002"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSo, if you have any e-waste in your house, take it to a local recycling center.","ko":"밑줄 친 it이 가리키는 것은?","pron":"it","opts":["e-폐기물","집","지역 재활용 센터","플러그"],"sko":"그러니까, 만약 여러분의 집에 어떠한 e-폐기물이라도 있다면, 그것을 지역 재활용 센터에 가져가세요.","r":{"a":"1) e-폐기물","w":"11번 문장 if you have any e-waste in your house, take it to a local recycling center.에서 it은 앞의 any e-waste.","c":1,"ev":"11번 문장","s":[[11,"So, if you have any e-waste in your house, take it to a local recycling center.","그러니까, 만약 여러분의 집에 어떠한 e-폐기물이라도 있다면, 그것을 지역 재활용 센터에 가져가세요."]],"k":"it = e-폐기물"},"h":"8bd0d294ca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For example, they think “I might use it again,” or “I don’t know how to throw it away.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"예를 들어, 그들은 ‘나는 그것을 다시 사용할지도 몰라.’ 또는 ‘나는 그것을 어떻게 버려야 할지 몰라.’라고 생각해요.","opts":["사람들은 e-폐기물을 팔아서 돈을 벌 수 있다고 생각한다.","사람들은 e-폐기물이 다시는 쓸 수 없는 쓰레기라고 생각한다.","사람들은 e-폐기물을 버리는 방법을 모두 잘 알고 있다.","사람들은 다시 쓸지도 모른다고 생각하거나 어떻게 버릴지 몰라서 e-폐기물을 보관한다."],"r":{"a":"4) 사람들은 다시 쓸지도 모른다고 생각하거나 어떻게 버릴지 몰라서 e-폐기물을 보관한다.","ev":"5~6번 문장","s":[[5,"People keep e-waste for various reasons.","사람들은 다양한 이유로 e-폐기물을 보관해요."],[6,"For example, they think “I might use it again,” or “I don’t know how to throw it away.”","예를 들어, 그들은 ‘나는 그것을 다시 사용할지도 몰라.’ 또는 ‘나는 그것을 어떻게 버려야 할지 몰라.’라고 생각해요."]],"w":"5번에서 사람들은 다양한 이유로 e-폐기물을 보관한다고 하고, 6번이 그 예시(For example). I might use it again은 다시 쓸지도 모른다, I don’t know how to throw it away는 어떻게 버려야 할지 모른다는 뜻.","c":4},"h":"4b8c14f5c3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["한 가정의 전자 제품 대부분은 더 이상 사용되지 않는다.","e-폐기물에는 가치 있는 부분이 전혀 없다.","e-폐기물은 일반 쓰레기 그 이상이다.","사람들은 오직 한 가지 이유로 e-폐기물을 보관한다."],"opts":["Most electronic items in a household are not used anymore.","E-waste has no valuable parts.","E-waste is more than regular trash.","People keep e-waste for only one reason."],"r":{"a":"3) E-waste is more than regular trash. (e-폐기물은 일반 쓰레기 그 이상이다.)","ev":"8번 문장","s":[[8,"But, e-waste is more than regular trash.","하지만, e-폐기물은 일반적인 쓰레기 그 이상이에요."]],"w":"8번 문장: e-폐기물은 일반 쓰레기 그 이상이라고 했음.","c":3},"h":"ab6b2dd529"},{"n":9,"t":"sum","q":"By doing this, you’ll help the (A) and make a (B) future for everyone!","ko":"이렇게 함으로써, 여러분은 (A)을(를) 돕고 모두에게 더 (B) 미래를 만들 거예요!","opts":["(A) Earth / (B) better","(A) Earth / (B) worse","(A) moon / (B) better","(A) moon / (B) worse","(A) Earth / (B) colder"],"oko":["(A) 지구 / (B) 나은","(A) 지구 / (B) 나쁜","(A) 달 / (B) 나은","(A) 달 / (B) 나쁜","(A) 지구 / (B) 추운"],"r":{"a":"1) (A) Earth / (B) better ((A) 지구 / (B) 나은)","w":"12번 문장 By doing this, you’ll help the Earth and make a better future for everyone!에서 가져옴.","c":1,"ev":"12번 문장","s":[[12,"By doing this, you’ll help the Earth and make a better future for everyone!","이렇게 함으로써, 여러분은 지구를 돕고 모두에게 더 나은 미래를 만들 거예요!"]]},"h":"a4ae47fb53"},{"n":10,"t":"fill","q":"We [A] these [B] items e-waste or electronic waste.","ko":"우리는 이 [B] 물품들을 e-폐기물 또는 전자 폐기물이라고 [A].","bank":["call","unused","keep","put","throw","take"],"bko":{"call":"부르다","unused":"사용되지 않는","keep":"보관하다","put":"넣다","throw":"버리다","take":"가져가다"},"r":{"a":"[A] call (부르다), [B] unused (사용되지 않는)","w":"4번 문장 We call these unused items e-waste or electronic waste.에서 가져옴. 나머지는 동사라 these ___ items(형용사 자리)에 맞지 않고, items e-waste라고 ___하는 뜻도 안 됨.","c":null,"ev":"4번 문장","s":[[4,"We call these unused items e-waste or electronic waste.","우리는 이 사용되지 않는 물품들을 e-폐기물 또는 전자 폐기물이라고 불러요."]]},"h":"bbed3d692e"}]},{"u":5,"id":"rg3-05-3","no":3,"ko":"마법처럼 꺼진 산불, 영웅은 염소?","items":[{"n":1,"t":"tf","q":"The fire stopped because the goats had eaten most of the dry plants in the area.","ko":"염소들이 그 지역의 마른 식물 대부분을 먹어 치웠기 때문에 불이 멈췄다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The goats had eaten most of the dry plants in the area, so the fire had nothing to burn and stopped.","염소들이 그 지역의 마른 풀을 대부분 먹어 치워서, 불은 태울 것이 없어 멈췄다."]],"w":"5번 문장에 The goats had eaten most of the dry plants in the area, so the fire had nothing to burn and stopped가 있음. 일치.","c":"T"},"h":"70e1b28b08"},{"n":2,"t":"tf","q":"Every day, the goats ate dry plants covering an area as large as ten football fields.","ko":"매일 염소들은 축구 경기장 열 개만큼 넓은 지역을 뒤덮은 마른 식물들을 먹었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Every day, the goats ate dry plants covering an area as large as two football fields.","매일, 염소들은 축구 경기장 두 개만큼 넓은 지역을 뒤덮은 마른 식물들을 먹어 치웠다."]],"w":"8번 문장에서 염소들이 먹은 지역의 크기는 as large as two football fields(축구 경기장 두 개만큼)임. 열 개가 아님.","c":"F"},"h":"c06e5ecc0c"},{"n":3,"t":"tf","q":"Goats use less water than firefighters.","ko":"염소는 소방관들보다 물을 더 적게 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Plus, goats use less water than firefighters.","게다가, 염소는 소방관들보다 물을 더 적게 사용한다."]],"w":"11번 문장에 goats use less water than firefighters가 그대로 있음. 일치.","c":"T"},"h":"faf50838d9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…because goats are great at eating plants, including the poisonous ones.)","ko":"…염소는 ( ) 것들을 포함해 식물을 먹는 데 능숙하기 때문에","opts":["독성이 있는","맛있는","키가 큰","오래된"],"word":"poisonous","r":{"a":"1) 독성이 있는","ev":"7번 문장","s":[[7,"A few weeks before the fire, the city had let the goats out to remove weeds because goats are great at eating plants, including the poisonous ones.","불이 나기 몇 주 전, 도시는 염소가 독성이 있는 것들을 포함해 식물을 먹는 데 능숙하기 때문에 잡초를 없애려고 염소들을 밖으로 내보냈다."]],"w":"7번에서 염소는 plants, including the poisonous ones(독성이 있는 것들을 포함해)을 잘 먹는다고 함. 염소가 아주 잘 먹는다는 점을 강조하려고 독초까지 든 것이므로 poisonous는 독성이 있는.","c":1},"h":"584dc6f72c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That created a space with no plants and prevented the fire from spreading.)","ko":"그것은 식물이 없는 공간을 만들었고 불이 번지는 것을 ( ).","opts":["더 키웠다","막았다","불렀다","도왔다"],"word":"prevented","r":{"a":"2) 막았다","ev":"9번 문장","s":[[9,"That created a space with no plants and prevented the fire from spreading.","그것은 식물이 없는 공간을 만들었고 불이 번지는 것을 막았다."]],"w":"9번에서 식물이 없는 공간이 생겼으므로 불이 번질 수 없었음. prevent A from spreading은 A가 번지는 것을 막다. 더 키우거나 도운 것이 아니라 반대 뜻.","c":2},"h":"7c302872a2"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt looked like magic, but actually, 400 hungry goats saved the day.","ko":"밑줄 친 It이 가리키는 것은?","pron":"It","opts":["불이 갑자기 멈추고 건물이 안전해진 일","아파트 건물","거대한 산불이 난 일","염소들이 도시에서 온 일"],"sko":"마법처럼 보였지만, 사실은 400마리의 배고픈 염소들이 그날을 구한 것이었다.","r":{"a":"1) 불이 갑자기 멈추고 건물이 안전해진 일","w":"3번에서 갑자기 불이 멈추고 건물이 안전했다고 했고, 4번 It looked like magic에서 It은 그 일(불이 갑자기 멈춘 일).","c":1,"ev":"3~4번 문장","s":[[3,"Then suddenly, the fire stopped and the building was safe.","그때 갑자기, 불은 멈췄고 건물은 안전했다."],[4,"It looked like magic, but actually, 400 hungry goats saved the day.","마법처럼 보였지만, 사실은 400마리의 배고픈 염소들이 그날을 구한 것이었다."]],"k":"It = 불이 갑자기 멈추고 건물이 안전해진 일"},"h":"f5377ac43d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Goats might be the heroes we need!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["염소가 우리에게 필요한 영웅일 수도 있다.","염소는 절대 영웅이 될 수 없다.","소방관은 이제 필요하지 않다.","염소는 이미 모든 불을 껐다."],"sko":"염소야말로 우리에게 필요한 영웅일지도 모른다!","r":{"a":"1) 염소가 우리에게 필요한 영웅일 수도 있다.","w":"12번 문장 Goats might be the ","대부분의 새","바다"],"sko":"그것들은 큰 폭풍에 대처하는 특별한 방법을 가지고 있다.","r":{"a":"1) 슴새들","w":"1번에서 슴새(Shearwaters)가 바다 근처에 사는 새라고 소개되고, 2번 They have a special way에서 They는 슴새들.","c":1,"ev":"1~2번 문장","s":[[1,"Shearwaters are birds that live near the ocean.","슴새는 바다 근처에 사는 새이다."],[2,"They have a special way to deal with big storms.","그것들은 큰 폭풍에 대처하는 특별한 방법을 가지고 있다."]],"k":"They = 슴새들"},"h":"df9b144595"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Flying into a storm’s center is a smart trick that only shearwaters seem to know!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"폭풍의 중심으로 날아가는 것은 슴새들만 아는 것 같은 현명한 요령이다!","opts":["폭풍의 중심으로 날아가는 것은 모든 새가 아는 쉬운 방법이다.","폭풍의 중심에서 날아 나오는 것은 슴새들이 가장 두려워하는 일이다.","폭풍 속에서 길을 잃는 것은 슴새들만 겪는 위험한 일이다.","폭풍의 중심으로 날아가는 것은 슴새들만 아는 것 같은 현명한 요령이다."],"r":{"a":"4) 폭풍의 중심으로 날아가는 것은 슴새들만 아는 것 같은 현명한 요령이다.","ev":"12번 문장","s":[[12,"Flying into a storm’s center is a smart trick that only shearwaters seem to know!","폭풍의 중심으로 날아가는 것은 슴새들만 아는 것 같은 현명한 요령이다!"]],"w":"12번의 Flying into a storm’s center는 폭풍의 중심으로 날아가는 것, a smart trick은 현명한 요령, only shearwaters seem to know는 슴새들만 아는 것 같다는 뜻. 폭풍을 피한다는 것은 3번의 ‘대부분의 새’ 이야기라 오답.","c":4},"h":"c0a425832c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Shearwaters are birds that live near the ocean.","Shearwaters stayed in the eye of the storm for only a few minutes.","Many other birds also fly into the storm’s center.","Scientists tracked shearwaters for 11 days."],"oko":["슴새는 바다 근처에 사는 새이다.","슴새들은 폭풍의 눈에서 몇 분만 머물렀다.","다른 많은 새들도 폭풍의 중심으로 날아간다.","과학자들은 슴새를 11일 동안 추적했다."],"r":{"a":"1) Shearwaters are birds that live near the ocean. (슴새는 바다 근처에 사는 새이다.)","w":"1번 문장: 슴새는 바다 근처에 사는 새.","c":1,"ev":"1번 문장","s":[[1,"Shearwaters are birds that live near the ocean.","슴새는 바다 근처에 사는 새이다."]]},"h":"784b165617"},{"n":9,"t":"sum","q":"Scientists think shearwaters might do this to save (A) and avoid (B) near the land.","ko":"과학자들은 슴새들이 (A)을(를) 아끼고 육지 근처의 (B)을(를) 피하려고 이렇게 하는 것일지도 모른다고 생각한다. ld medal.","이것에 대해 그에게 감사하기 위해, 그에게 금메달이 주어졌다."],[9,"Unfortunately, Magawa died at the age of 8 after retiring from work.","안타깝게도, Magawa는 일에서 은퇴한 후 8살의 나이에 죽었다."]],"w":"9번: 은퇴한 후 8살에 죽었음(③). 태어난 곳은 탄자니아(2번), 지뢰는 100개 이상(7번), 받은 메달은 금메달(8번)이라 나머지는 틀림.","c":3},"h":"4ee0ab301d"},{"n":9,"t":"sum","q":"Magawa was a very (A) rat who helped find landmines in Cambodia for (B) years.","ko":"Magawa는 캄보디아에서 (B)년 동안 지뢰를 찾는 것을 도와준 매우 (A) 쥐였다.","opts":["(A) special / (B) five","(A) special / (B) ten","(A) lazy / (B) five","(A) lazy / (B) ten","(A) special / (B) fifty"],"oko":["(A) 특별한 / (B) 5","(A) 특별한 / (B) 10","(A) 게으른 / (B) 5","(A) 게으른 / (B) 10","(A) 특별한 / (B) 50"],"r":{"a":"1) (A) special / (B) five ((A) 특별한 / (B) 5)","w":"1번 문장 Magawa was a very special rat who helped find landmines in Cambodia for five years.에서 가져옴.","c":1,"ev":"1번 문장","s":[[1,"Magawa was a very special rat who helped find landmines in Cambodia for five years.","Magawa는 캄보디아에서 5년 동안 지뢰를 찾는 것을 도와준 매우 특별한 쥐였다."]]},"h":"b8b1b546e0"},{"n":10,"t":"fill","q":"In Cambodia, many years of [A] have left behind [B] landmines.","ko":"캄보디아에서는 수년간의 [A]이(가) [B] 지뢰들을 남겼다.","bank":["conflict","dangerous","medal","soccer","legacy","brave"],"bko":{"conflict":"전투, 갈등","dangerous":"위험한","medal":"메달","soccer":"축구","legacy":"유산","brave":"용감한"},"r":{"a":"[A] conflict (전투, 갈등), [B] dangerous (위험한)","w":"4번 문장 In Cambodia, many years of conflict have left behind dangerous landmines.에서 가져옴.","c":null,"ev":"4번 문장","s":[[4,"In Cambodia, many years of conflict have left behind dangerous landmines.","캄보디아에서는 수년간의 전투가 위험한 지뢰들을 남겼다."]]},"h":"3e50f7253b"}]},{"u":7,"id":"rg3-07-2","no":2,"ko":"프렌치프라이는 프랑스 음식이 아니다?","items":[{"n":1,"t":"tf","q":"The average American eats nearly 14 kilograms of French fries each year.","ko":"평균적인 미국인은 매년 거의 14킬로그램의 감자튀김을 먹는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In fact, the average American eats nearly 14 kilograms of French fries each year.","사실, 평균적인 미국인은 매년 거의 14킬로그램의 감자튀김을 먹는다."]],"w":"2번 문장 the average American eats nearly 14 kilograms of French fries each year와 일치.","c":"T"},"h":"7091dc6a64"},{"n":2,"t":"tf","q":"In the winter of 1680, it was easy for people in Namur to catch fish.","ko":"1680년 겨울에 Namur 사람들은 물고기를 쉽게 잡을 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"However, in 1680, a very cold winter caused the local river to freeze, so it was difficult to catch fish.","하지만 1680년에, 아주 추운 겨울이 그 지역의 강을 얼게 해서 물고기를 잡기가 어려웠다."]],"w":"6번에서 아주 추운 겨울에 강이 얼어서 물고기를 잡기가 어려웠다(difficult)고 함. easy는 반대.","c":"F"},"h":"d9fdca1d4d"},{"n":3,"t":"tf","q":"The name “French fries” comes from the place where they were invented.","ko":"‘French fries’라는 이름은 그것이 발명된 장소에서 나왔다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"The name actually comes from how they are prepared, not where they were invented.","그 이름은 사실 그것이 어디에서 발명되었는지가 아니라, 어떻게 준비되는지에서 나온다."]],"w":"10번에서 이름은 how they are prepared(어떻게 준비되는지)에서 왔고, not where they were invented(발명된 곳이 아님)라고 함.","c":"F"},"h":"137cfa8f4e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…but Belgium claims that they invented them.)","ko":"…하지만 벨기에는 자신들이 그것을 발명했다고 ___.","opts":["거절하다","주장하다","숨기다","부러워하다"],"word":"claims","r":{"a":"2) 주장하다","ev":"4번 문장","s":[[4,"You might think “French fries” come from France, but Belgium claims that they invented them.","여러분은 ‘French fries’가 프랑스에서 왔다고 생각할지도 모르지만, 벨기에는 자신들이 그것을 발명했다고 주장한다."]],"w":"앞에서 사람들은 프랑스 기원이라 생각하지만, but 뒤에서 벨기에는 자기들이 발명했다고 내세움. claim = 주장하다. 8번에서도 벨기에 이야기가 이 주장을 뒷받침한다고 함.","c":2},"h":"d2aacf7673"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The name actually comes from how they are prepared…)","ko":"그 이름은 사실 그것이 어떻게 ___는지에서 나온다.","opts":["팔리는","발견되는","조리되는","보관되는"],"word":"prepared","r":{"a":"3) 조리되는","ev":"10~11번 문장","s":[[10,"The name actually comes from how they are prepared, not where they were invented.","그 이름은 사실 그것이 어디에서 발명되었는지가 아니라, 어떻게 준비되는지에서 나온다."],[11,"“Frenching” means cutting food into thin pieces to cook well.","‘Frenching’은 잘 익히기 위해 음식을 얇은 조각으로 자르는 것을 의미한다."]],"w":"10번 how they are prepared에 이어 11번에서 얇게 썰어 잘 익힌다(cook well)고 설명함. prepared = 조리되는(만들어지는).","c":3},"h":"e16db4b117"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThis historical story supports that they were made in Belgium.","ko":"밑줄 친 they가 가리키는 것은?","pron":"they","opts":["감자튀김","벨기에 사람들","프랑스 사람들","역사가들"],"sko":"이 역사적인 이야기는 감자튀김이 벨기에에서 만들어졌다는 것을 뒷받침한다.","r":{"a":"1) 감자튀김","w":"7번에서 감자튀김이 처음 만들어진 이야기를 했고, 8번 This historical story supports that they were made in Belgium에서 they는 감자튀김(French fries).","c":1,"ev":"7~8번 문장","s":[[7,"They decided to fry potatoes instead of fish, and that’s how French fries were first created.","그들은 물고기 대신 감자를 튀기기로 결정했고, 그렇게 해서 감자튀김이 처음 만들어졌다."],[8,"This historical story supports that they were made in Belgium.","이 역사적인 이야기는 감자튀김이 벨기에에서 만들어졌다는 것을 뒷받침한다."]],"k":"they = 감자튀김"},"h":"730905eeda"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But then why do we call them “French fries”?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["그렇다면 왜 감자튀김을 ‘French fries’라고 부르는지 묻고 있다.","감자튀김을 왜 프랑스 사람들이 좋아하는지 묻고 있다.","감자튀김을 어떻게 만드는지 묻고 있다.","감자튀김이 어느 나라에서 가장 인기 있는지 묻고 있다."],"sko":"그렇다면 우리는 왜 그것을 ‘French fries’라고 부를까?","r":{"a":"1) 그렇다면 왜 감자튀김을 ‘French fries’라고 부르는지 묻고 있다.","w":"9번 문장 But then why do we call them “French fries”?는 왜 감자튀김을 French fries라고 부르는지 묻는 말.","c":1,"ev":"9번 문장","s":[[9,"But then why do we call them “French fries”?","그렇다면 우리는 왜 그것을 ‘French fries’라고 부를까?"]]},"h":"053eadfe68"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Belgium claims that French fries were invented in France.","People in Namur, a city in Belgium, enjoyed eating fried fish.","Frenching means cooking food in water.","The average American eats French fries only once a year."],"oko":["벨기에는 감자튀김이 프랑스에서 발명되었다고 주장한다.","벨기에의 도시 Namur의 사람들은 튀긴 생선을 즐겨 먹었다.","Frenching은 음식을 물에 삶는 것을 뜻한다.","평균적인 미국인은 일 년에 감자튀김을 한 번만 먹는다."],"r":{"a":"2) People i r musical taste when they’re around 13 or 14 years old.","사람들은 보통 13살이나 14살 즈음에 자신만의 음악 취향을 발전시키기 시작한다."]],"w":"4번 문장 People often start to develop their musical taste when they’re around 13 or 14 years old와 일치.","c":"T"},"h":"0365ef73b0"},{"n":2,"t":"tf","q":"Teenagers have less time than older people to find new music.","ko":"십 대들은 나이 든 사람들보다 새로운 음악을 찾을 시간이 적다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"First, teenagers have more time to find new music and make special memories with the songs.","먼저, 십 대들은 새로운 음악을 찾고 노래와 함께 특별한 추억을 만들 시간이 더 많다."],[8,"But as people get older, they usually get busier, and they will just listen to the music they know and love from the past.","하지만 나이가 들수록 사람들은 보통 더 바빠지고, 과거부터 알고 사랑해 온 음악만 듣게 될 것이다."]],"w":"7번에서 십 대들은 새 음악을 찾을 시간이 더 많다(more time)고 함. 8번에서 나이 든 사람들이 더 바빠진다고 하니 시간이 적은 쪽은 나이 든 사람들임.","c":"F"},"h":"2253f5d6ce"},{"n":3,"t":"tf","q":"Some scientists think our brains change with age.","ko":"일부 과학자들은 우리의 뇌가 나이에 따라 변한다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Some scientists think our brains change with age.","일부 과학자들은 우리의 뇌가 나이에 따라 변한다고 생각한다."]],"w":"9번 문장 Some scientists think our brains change with age와 그대로 일치.","c":"T"},"h":"9341a241f0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (People often start to develop their musical taste…)","ko":"사람들은 보통 자신의 음악 취향을 ___ 시작한다.","opts":["발전시키기","잃기","바꾸기","비교하기"],"word":"develop","r":{"a":"1) 발전시키기","ev":"4번 문장","s":[[4,"People often start to develop their musical taste when they’re around 13 or 14 years old.","사람들은 보통 13살이나 14살 즈음에 자신만의 음악 취향을 발전시키기 시작한다."]],"w":"13~14세쯤 처음 자기 취향이 생기기 시작한다는 내용. develop = 발전시키다(키워 가다). 5번에서 20대에는 취향을 안다고 이어짐.","c":1},"h":"989bc4f1ab"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…newer and less familiar songs might all “sound the same.”)","ko":"…더 새롭고 덜 ___ 노래들이 모두 ‘똑같이 들릴’ 수 있다.","opts":["낯선","익숙한","시끄러운","오래된"],"word":"familiar","r":{"a":"2) 익숙한","ev":"8번, 11번 문장","s":[[8,"But as people get older, they usually get busier, and they will just listen to the music they know and love from the past.","하지만 나이가 들수록 사람들은 보통 더 바빠지고, 과거부터 알고 사랑해 온 음악만 듣게 될 것이다."],[11,"So to older people, newer and less familiar songs might all “sound the same.”","그래서 나이 든 사람들에게는 더 새롭고 덜 익숙한 노래들이 모두 ‘똑같이 들릴’ 수 있다."]],"w":"8번에서 나이 든 사람들은 알고 사랑하는 노래만 듣는다고 했으니, 그 반대인 새 노래는 less familiar(덜 익숙한)임. familiar = 익숙한.","c":2},"h":"79a64e5616"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nInterestingly, this happens with many parents, not just yours.","ko":"밑줄 친 this이 가리키는 것은?","sko":"흥미롭게도, 이것은 여러분의 부모님뿐만 아니라 많은 부모님에게 일어난다.","opts":["부모님이 자녀의 음악 취향을 따라 하는 것","부모님이 자녀가 듣는 음악을 좋아하지 않는 것","부모님이 십 대 때 음악을 듣지 않았던 것","부모님이 새 노래를 직접 만드는 것"],"r":{"a":"2) 부모님이 자녀가 듣는 음악을 좋아하지 않는 것","ev":"3번 문장","s":[[3,"Interestingly, this happens with many parents, not just yours.","흥미롭게도, 이것은 여러분의 부모님뿐만 아니라 많은 부모님에게 일어난다."]],"w":"1~2번에서 부모님이 여러분이 듣는 음악을 좋아하지 않는다고 했고, 3번의 this는 그 일이 많은 부모님에게 일어난다는 뜻임.","c":2,"k":"this = 부모님이 자녀가 듣는 음악을 좋아하지 않는 것"},"pron":"this","h":"6f6cce66fa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This makes it harder to tell the difference between chords, rhythms, and melodies.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 화음, 리듬, 멜로디 사이의 차이를 구별하는 것을 더 어렵게 만든다.","opts":["화음, 리듬, 멜로디를 새로 만들어 내기가 더 쉬워진다.","화음, 리듬, 멜로디가 모두 더 크게 들리게 된다.","화음, 리듬, 멜로디가 서로 어떻게 다른지 구별하기가 더 어려워진다.","화음, 리듬, 멜로디를 따라 부르는 것이 더 즐거워진다."],"r":{"a":"3) 화음, 리듬, 멜로디가 서로 어떻게 다른지 구별하기가 더 어려워진다.","ev":"10번 문장","s":[[10,"This makes it harder to tell the difference between chords, rhythms, and melodies.","이것은 화음, 리듬, 멜로디 사이의 차이를 구별하는 것을 더 어렵게 만든다."]],"w":"tell the difference는 \"차이를 구별하다\", harder는 \"더 어렵게\"라는 뜻이라서 구별하기가 더 어려워진다는 의미임.","c":3},"h":"1cbefa381a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["대부분의 사람들은 20대 이후에도 좋아하는 음악이 계속 바뀐다.","부모님만이 십 대의 음악을 골라 준다.","20대가 되면 사람들은 보통 자신이 어떤 종류의 음악을 좋아하는지 안다.","사람들은 13살이나 14살이 되면 어떤 음악도 좋아하지 않는다."],"opts":["Most people change what music they like again and again after their 20s.","Parents are the only people who choose music for teenagers.","In their 20s, people usually know what kinds of music they like.","People do not like any music when they are 13 or 14."],"r":{"a":"3) In their 20s, people usually know what kinds of music they like. (20대가 되면 사람들은 보통 자신이 어떤 종류의 음악을 좋아하는지 안다.)","ev":"2번, 5번 문장","s":[[2,"They think it’s just “a lot of noise.”","그분들은 그것이 그저 ‘시끄러운 소음’일 뿐이라고 생각한다."],[5,"In their 20s, they usually know what kinds of music they like, and they don’t change much after that.","20대가 되면 그들은 보통 자신이 어떤 종류의 음악을 좋아하는지 알고, 그 이후로는 많이 변하지 않는다."]],"w":"5번에서 20대가 되면 보통 자신이 좋아하는 음악 종류를 알고 그 후로 많이 변하지 않는다고 함.","c":3},"h":"12258b94e6"},{"n":9,"t":"sum","q":"There is nothing (A) with your parents. It is just how people (B) change.","ko":"여러분의 부모님에게는 (A) 것이 하나도 없다. 그것은 단지 사람들이 (B) 변하는 방식일 뿐이다.","oko":["(A) 올바른 / (B) 갑자기","(A) 잘못된 / (B) 갑자기","(A) 잘못된 / (B) 자연스럽게","(A) 올바른 / (B) 자연스럽게","(A) 웃긴 / (B) 자연스럽게"],"opts":["(A) right / (B) suddenly","(A) wrong / (B) suddenly","(A) wrong / (B) naturally","(A) right / (B) naturally","(A) funny / (B) naturally"],"r":{"a":"3) (A) wrong / (B) naturally ((A) 잘못된 / (B) 자연스럽게)","ev":"12~13번 문장","s":[[12,"There’s nothing wrong with your parents.","여러분의 부모님에게는 아무 문제가 없다."],[13,"It’s just how people naturally change.","그것은 단지 사람들이 자연스럽게 변하는 방식일 뿐이다."]],"w":"12번에서 부모님에게 아무 문제(잘못된 것)가 없다고 하고, 13번에서 그것은 사람들이 자연스럽게 변하는 방식일 뿐이라고 함.","c":3},"h":"ceaa32ec66"},{"n":10,"t":"fill","q":"Sometimes, your parents don’t like the music you [A] to. They think it’s just “a lot of [B].”","ko":"때때로, 여러분의 부모님은 여러분이 [A] 음악을 좋아하지 않는다. 그분들은 그것이 그저 ‘시끄러운 [B]’일 뿐이라고 생각한다.","bank":["listen","noise","busier","older","special","different"],"bko":{"listen":"듣다","noise":"소음","busier":"더 바쁜","older":"나이 든","special":"특별한","different":"다른"},"r":{"a":"[A] listen (듣다), [B] noise (소음)","ev":"1~2번 문장","s":[[1,"Sometimes, your parents don’t like the music you listen to.","때때로, 여러분의 부모님은 여러분이 듣는 음악을 좋아하지 않는다."],[2,"They think it’s just “a lot of noise.”","그분들은 그것이 그저 ‘시끄러운 소음’일 뿐이라고 생각한다."]],"w":"1번에서 부모님은 여러분이 듣는(listen to) 음악을 좋아하지 않고, 2번에서 그것을 그저 소음(noise)이라고 생각함.","c":null},"h":"f518b144c3"}]},{"u":8,"id":"rg3-08-1","no":1,"ko":"50년 만에 달에 가는데, 옷부터 새로 바꾼다?","items":[{"n":1,"t":"tf","q":"The new spacesuits are lighter and more flexible than the old ones.","ko":"새 우주복은 이전 것들보다 더 가볍고 더 유연하다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Also, they are lighter and more flexible than the old ones.","또한, 그것들은 이전 것들보다 더 가볍고 더 유연하다."]],"w":"7번 문장 they are lighter and more flexible than the old ones와 일치. they는 새 우주복.","c":"T"},"h":"f55de330ef"},{"n":2,"t":"tf","q":"The old spacesuits could be worn by at least 90% of American men and women.","ko":"이전 우주복은 최소 90퍼센트의 미국 남성과 여성이 입을 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"The old suits were hard to move in and didn’t fit everyone.","이전의 우주복은 안에서 움직이기 힘들었고 모두에게 맞지는 않았다."],[6,"On the other hand, the new spacesuits can be worn by at least 90% of American men and women.","반면에, 새 우주복은 최소 90퍼센트의 미국 남성과 여성이 입을 수 있다."]],"w":"최소 90%가 입을 수 있는 것은 새 우주복(6번). 이전 우주복은 모두에게 맞지 않았다(5번 didn’t fit everyone).","c":"F"},"h":"778a5057be"},{"n":3,"t":"tf","q":"The helmet has a video camera and lights for better viewing.","ko":"헬멧에는 더 잘 보기 위한 비디오카메라와 조명이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"The helmet has a video camera and lights for better viewing.","헬멧에는 더 잘 보기 위한 비디오카메라와 조명이 있다."]],"w":"9번 문장 The helmet has a video camera and lights for better viewing과 그대로 일치.","c":"T"},"h":"ad8e9a6ab1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Also, they are lighter and more flexible than the old ones.)","ko":"또한, 그것들은 이전 것들보다 더 가볍고 더 ___.","opts":["무거운","유연한","값비싼","위험한"],"word":"flexible","r":{"a":"2) 유연한","ev":"7~8번 문장","s":[[7,"Also, they are lighter and more flexible than the old ones.","또한, 그것들은 이전 것들보다 더 가볍고 더 유연하다."],[8,"So, astronauts can move more easily and study the Moon better.","그래서, 우주 비행사들은 더 쉽게 움직일 수 있고 달을 더 잘 연구할 수 있다."]],"w":"더 가볍고 flexible하다는 말 뒤에 8번에서 So 더 쉽게 움직일 수 있다고 이어짐. 움직임이 쉬워지는 성질이므로 flexible = 유연한(신축성 있는).","c":2},"h":"fa208d48ea"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…to reflect heat and protect astronauts from extreme temperatures.)","ko":"…열을 ___ 우주 비행사를 극심한 온도로부터 보호하기 위해.","opts":["흡수하다","만들어내다","전달하다","반사하다"],"word":"reflect","r":{"a":"4) 반사하다","ev":"11번 문장","s":[[11,"However, the actual spacesuit will still be white, just like the old one, to reflect heat and protect astronauts from extreme temperatures.","하지만, 실제 우주복은 열을 반사하고 우주 비행사를 극심한 온도로부터 보호하기 위해 이전 것처럼 여전히 흰색일 것이다."]],"w":"흰색은 열을 튕겨 내서 우주 비행사를 극심한 온도로부터 보호함. reflect = 반사하다.","c":4},"h":"0844efef0f"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nThe new design appears black to keep some of its secrets.","ko":"밑줄 친 its가 가리키는 것은?","sko":"새 디자인은 비밀 일부를 지키기 위해 검은색으로 보인다.","opts":["달","새 디자인","NASA","검은색"],"r":{"a":"2) 새 디자인","ev":"10번 문장","s":[[10,"The new design appears black to keep some of its secrets.","새 디자인은 비밀 일부를 지키기 위해 검은색으로 보인다."]],"w":"10번에서 its secrets는 The new design의 비밀이라는 뜻임. 새 디자인이 검은색으로 보여서 비밀 일부를 지킨다고 함.","c":2,"k":"its = 새 디자인"},"pron":"its","h":"d104d9de52"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, astronauts can move more easily and study the Moon better.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서, 우주 비행사들은 더 쉽게 움직일 수 있고 달을 더 잘 연구할 수 있다.","opts":["그래서 우주 비행사들은 달에서 더 빨리 돌아올 수 있다.","그래서 우주 비행사들은 움직이기 어려워져 달을 연구하지 못한다.","그래서 우주 비행사들은 더 쉽게 움직이고 달을 더 잘 연구할 수 있다.","그래서 우주 비행사들은 달에 가지 않고 지구에서 연구한다."],"r":{"a":"3) 그래서 우주 비행사들은 더 쉽게 움직이고 달을 더 잘 연구할 수 있다.","ev":"8번 문장","s":[[8,"So, astronauts can move more easily and study the Moon better.","그래서, 우주 비행사들은 더 쉽게 움직일 수 있고 달을 더 잘 연구할 수 있다."]],"w":"move more easily는 \"더 쉽게 움직이다\", study the Moon better는 \"달을 더 잘 연구하다\"라는 뜻임.","c":3},"h":"adeff2e61e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["사람들이 달을 방문한 지 50년이 채 되지 않았다.","새 우주복은 40년 만의 첫 재설계이다.","실제 새 우주복은 검은색이다.","다음 임무에서 우주 비행사들은 이전 우주복을 입을 것이다."],"opts":["It has been less than 50 years since people visited the Moon.","The new spacesuits are the first redesign in 40 years.","The actual new spacesuit will be black.","Astronauts will wear the old suits on the next mission."],"r":{"a":"2) The new spacesuits are the first redesign in 40 years.","ev":"1번, 3번, 4번, 10~11번 문장","s":[[1,"It has been more than 50 years since people last visited the Moon.","사람들이 마지막으로 달을 방문한 지 50년이 넘었다."],[3,"This time, they will wear new spacesuits!","이번에는, 그들이 새로운 우주복을 입을 것이다!"],[4,"These new suits are the first redesign in 40 years.","이 새 우주복은 40년 만의 첫 재설계이다."],[10,"The new design appears black to keep some of its secrets.","새 디자인은 비밀 일부를 지키기 위해 검은색으로 보인다."],[11,"However, the actual spacesuit will still be white, just like the old one, to reflect heat and protect astronauts from extreme temperatures.","하지만, 실제 우주복은 열을 반사하고 우주 비행사를 극심한 온도로부터 보호하기 위해 이전 것처럼 여전히 흰색일 것이다."]],"w":"4번이 그대로 일치. 1번은 50년이 넘었고, 10번은 검은색으로 ‘보이는’ 것이며 11번에서 실제는 흰색이고, 3번에서 새 우주복을 입는다고 함.","c":2},"h":"91aca6967b"},{"n":9,"t":"sum","q":"The head of NASA said the new suit will (A) more people to visit the Moon and do new science (B).","ko":"NASA의 책임자는 이렇게 말했다. 새 우주복은 더 많은 사람들이 달을 방문하고 새로운 과학 (B)을(를) 하도록 (A).","oko":["(A) 막을 것이다 / (B) 실험","(A) 허락할 것이다 / (B) 열","(A) 허락할 것이다 / (B) 실험","(A) 막을 것이다 / (B) 우주복","(A) 허락할 것이다 / (B) 우주복"],"opts":["(A) stop / (B) tests","(A) allow / (B) heat","(A) allow / (B) tests","(A) stop / (B) suits","(A) allow / (B) suits"],"r":{"a":"3) (A) allow / (B) tests ((A) 허락할 것이다 / (B) 실험)","ev":"12번 문장","s":[[12,"The head of NASA said, “The new suit will allow more people to visit the Moon and do new science tests.”","NASA의 책임자는 “새 우주복은 더 많은 사람들이 달을 방문하고 새로운 과학 실험을 할 수 있게 해 줄 것입니다.”라고 말했다."]],"w":"12번에서 새 우주복은 더 많은 사람들이 달을 방문하고 새로운 과학 실험(tests)을 할 수 있게 해 줄 것(allow)이라고 함.","c":3},"h":"9f1516d743"},{"n":10,"t":"fill","q":"Soon, astronauts will [A] back there on NASA’s [B] mission.","ko":"곧, 우주 비행사들은 NASA의 [B] 임무로 다시 그곳에 [A] 것이다.","bank":["go","special","secrets","heat","helmet","lights"],"bko":{"go":"가다","special":"특별한","secrets":"비밀","heat":"열","helmet":"헬멧","lights":"조명"},"r":{"a":"[A] go (가다), [B] special (특별한)","ev":"2번 문장","s":[[2,"Soon, astronauts will go back there on NASA’s special mission.","곧, 우주 비행사들이 NASA의 특별한 임무로 다시 그곳에 갈 것이다."]],"w":"2번에서 우주 비행사들은 NASA의 특별한(special) 임무로 다시 그곳에 갈(go) 것이라고 함.","c":null},"h":"2f7da467cd"}]},{"u":8,"id":"rg3-08-2","no":2,"ko":"말 없이도 산 너머까지 전해지는 언어?","items":[{"n":1,"t":"tf","q":"A whistle’s sound can travel much farther than regular talking or shouting.","ko":"휘파람 소리는 일반적인 말하기나 외침보다 훨씬 더 멀리 이동할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"This is because a whistle’s sound can travel much farther than regular talking or shouting.","이는 휘파람 소리가 일반적인 말하기나 외침보다 훨씬 더 멀리 이동할 수 있기 때문이다."]],"w":"2번 문장에 a whistle’s sound can travel much farther than regular talking or shouting이 그대로 있음. 그래서 숲이나 산에서 휘파람을 언어로 쓴다(1번).","c":"T"},"h":"7356bf9b16"},{"n":2,"t":"tf","q":"In Silbo Gomero, four whistles replace the vowels and two whistles replace the consonants.","ko":"Silbo Gomero에서는 네 가지 휘파람이 모음을 대신하고 두 가지 휘파람이 자음을 대신한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Two whistles replace the five Spanish vowels, and there are four whistles for consonants.","두 가지 휘파람이 다섯 개의 스페인어 모음을 대신하고, 자음을 위한 휘파람은 네 가지이다."]],"w":"5번에서 두 가지 휘파람이 모음(five Spanish vowels)을, 네 가지 휘파람이 자음을 대신한다고 함. 숫자가 서로 바뀌었음.","c":"F"},"h":"b5e12067db"},{"n":3,"t":"tf","q":"The Hmong people use different tones of whistles to carry different messages.","ko":"Hmong 사람들은 서로 다른 메시지를 전달하기 위해 휘파람의 서로 다른 음을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"They use different tones of whistles to carry different messages.","그들은 서로 다른 메시지를 전달하기 위해 휘파람의 서로 다른 음을 사용한다."]],"w":"8번 문장 They use different tones of whistles to carry different messages와 일치. They는 7번의 Hmong 사람들.","c":"T"},"h":"330722de10"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…much farther than regular talking or shouting.)","ko":"…___ 말하기나 외침보다 훨씬 더 멀리.","opts":["갑작스러운","일반적인","특별한","조용한"],"word":"regular","r":{"a":"2) 일반적인","ev":"2번 문장","s":[[2,"This is because a whistle’s sound can travel much farther than regular talking or shouting.","이는 휘파람 소리가 일반적인 말하기나 외침보다 훨씬 더 멀리 이동할 수 있기 때문이다."]],"w":"휘파람 소리를 보통의 말하기·외침과 비교하는 문장. regular talking은 ‘평소에 하는 일반적인 말하기’. regular = 일반적인.","c":2},"h":"5a2bb67564"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The language replaces each vowel or consonant with a whistling sound.)","ko":"그 언어는 각각의 모음이나 자음을 휘파람 소리로 ___.","opts":["더한다","지운다","대신한다","따라 한다"],"word":"replaces","r":{"a":"3) 대신한다","ev":"4~5번 문장","s":[[4,"The language replaces each vowel or consonant with a whistling sound.","그 언어는 각각의 모음이나 자음을 휘파람 소리로 대신한다."],[5,"Two whistles replace the five Spanish vowels, and there are four whistles for consonants.","두 가지 휘파람이 다섯 개의 스페인어 모음을 대신하고, 자음을 위한 휘파람은 네 가지이다."]],"w":"4번 replace each vowel or consonant with a whistling sound 다음 5번에서 두 가지 휘파람이 다섯 개의 모음을 replace한다고 설명함. 글자 소리 대신 휘파람 소리를 쓴다는 뜻이므로 replace = 대신하다.","c":3},"h":"d0f75602a7"},{"n":6,"t":"ref","q":"What does the underlined \"those\" refer to?\nMore than 80 different cultures use whistles as a language, especially those in places like forests or mountains.","ko":"밑줄 친 those가 가리키는 것은?","sko":"80개가 넘는 다양한 문화권이 휘파람을 언어로 사용하는데, 특히 숲이나 산 같은 곳에 사는 문화권이 그렇다.","opts":["휘파람들","문화권들","언어들","산들"],"r":{"a":"2) 문화권들","ev":"1번 문장","s":[[1,"More than 80 different cultures use whistles as a language, especially those in places like forests or mountains.","80개가 넘는 다양한 문화권이 휘파람을 언어로 사용하는데, 특히 숲이나 산 같은 곳에 사는 문화권이 그렇다."]],"w":"1번에서 80개가 넘는 문화권이 휘파람을 언어로 쓰는데, 특히 숲이나 산 같은 곳에 있는 그 문화권(those = cultures)이 그렇다는 뜻임.","c":2,"k":"those = 문화권들"},"pron":"those","h":"cf8bb5fc4c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It shows that people can understand each other without using spoken words.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 사람들이 구어를 사용하지 않고도 서로를 이해할 수 있다는 것을 보여준다.","opts":["사람들은 말을 쓰지 않고도 서로를 이해할 수 있다.","사람들은 말을 해야만 서로를 이해할 수 있다.","휘파람은 말보다 항상 더 이해하기 쉽다.","사람들은 말을 쓰면 휘파람보다 멀리 이해된다."],"r":{"a":"1) 사람들은 말을 쓰지 않고도 서로를 이해할 수 있다.","ev":"10~11번 문장","s":[[10,"Whistling is an interesting way to communicate.","휘파람을 부는 것은 의사소통하는 흥미로운 방법이다."],[11,"It shows that people can understand each other without using spoken words.","그것은 사람들이 구어를 사용하지 않고도 서로를 이해할 수 있다는 것을 보여준다."]],"w":"without using spoken words는 ‘구어를 사용하지 않고’. 10번에서 휘파람이 의사소통의 방법이라고 했으니, 말 없이도 서로를 이해할 수 있다는 뜻.","c":1},"h":"61c7d74b9a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["휘파람을 언어로 쓰는 문화권은 80개보다 적다.","Silbo Gomero는 자음을 다섯 가지 휘파람으로 나타낸다.","Hmong 사람들은 남아메리카에 산다.","Silbo Gomero는 스페인의 라고메라섬에서 쓰인다."],"opts":["Fewer than 80 cultures use whistles as a language.","Silbo Gomero uses five whistles for consonants.","The Hmong people live in South America.","Silbo Gomero is used on La Gomera, a Spanish island."],"r":{"a":"4) Silbo Gomero is used on La Gomera, a Spanish island.","ev":"1번, 3번, 5번, 7번 문장","s":[[1,"More than 80 different cultures use whistles as a language, especially those in places like forests or mountains.","80개가 넘는 다양한 문화권이 휘파람을 언어로 사용하는데, 특히 숲이나 산 같은 곳에 사는 문화권이 그렇다."],[3,"On La Gomera in Spain’s Canary Islands, some people use a whistle language named Silbo Gomero for communication.","스페인 카나리아 제도의 라고메라섬에서는 일부 사람들이 의사소통을 위해 Silbo Gomero라는 이름의 휘파람 언어를 사용한다."],[5,"Two whistles replace the five Spanish vowels, and there are four whistles for consonants.","두 가지 휘파람이 다섯 개의 스페인어 모음을 대신하고, 자음을 위한 휘파람은 네 가지이다."],[7,"In East and Southeast Asia, the Hmong people also communicate in whistles.","동아시아와 동남아시아에서는 Hmong 사람들도 휘파람으로 의사소통한다."]],"w":"3번이 일치. 1번은 80개가 넘음, 5번은 자음 휘파람이 네 가지, 7번은 Hmong이 동아시아·동남아시아에 산다고 함.","c":4},"h":"551dbbe3f3"},{"n":9,"t":"sum","q":"You can hear the difference in whistles by how (A) or low they sound, and whether they are (B) or long.","ko":"여러분은 휘파람 소리가 얼마나 (A) 낮은지, 그리고 (B) 긴지에 따라 차이를 들을 수 있다.","oko":["(A) 큰 / (B) 짧거나","(A) 높거나 / (B) 새롭거나","(A) 높거나 / (B) 짧거나","(A) 오래된 / (B) 짧거나","(A) 큰 / (B) 새롭거나"],"opts":["(A) big / (B) short","(A) high / (B) new","(A) high / (B) short","(A) old / (B) short","(A) big / (B) new"],"r":{"a":"3) (A) high / (B) short ((A) 높거나 / (B) 짧거나)","ev":"6번 문장","s":[[6,"You can hear the difference in the whistles by how high or low they sound, and whether they are short or long.","여러분은 휘파람이 얼마나 높거나 낮게 들리는지, 그리고 짧은지 긴지에 따라 휘파람의 차이를 들을 수 있다."]],"w":"6번에서 휘파람은 소리가 높은지 낮은지, 짧은지 긴지에 따라 차이를 들을 수 있다고 함.","c":3},"h":"d26685045b"},{"n":10,"t":"fill","q":"So the same word can have different [A]. Whistling is an interesting [B] to communicate.","ko":"그래서 같은 단어가 서로 다른 [A]을(를) 가질 수 있다. 휘파람을 부는 것은 의사소통하는 흥미로운 [B]이다.","bank":["meanings","way","forests","mountains","cultures","islands"],"bko":{"meanings":"의미들","way":"방법","forests":"숲들","mountains":"산들","cultures":"문화들","islands":"섬들"},"r":{"a":"[A] meanings (의미들), [B] way (방법)","ev":"9~10번 문장","s":[[9,"So the same word can have different meanings.","그래서 같은 단어가 서로 다른 의미를 가질 수 있다."],[10,"Whistling is an interesting way to communicate.","휘파람을 부는 것은 의사소통하는 흥미로운 방법이다."]],"w":"9번에서 같은 단어가 서로 다른 의미(meanings)를 가질 수 있다고 하고, 10번에서 휘파람은 의사소통하는 흥미로운 방법(way)이라고 함.","c":null},"h":"97952fe123"}]},{"u":8,"id":"rg3-08-3","no":3,"ko":"19세기 아이스크림은 왜 칠면조 모양이었을까?","items":[{"n":1,"t":"tf","q":"In the late 19th century, people made ice cream in fun shapes like turkeys and flowers.","ko":"19세기 후반에 사람들은 칠면조나 꽃 같은 재미있는 모양으로 아이스크림을 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In the late 19th century, people made ice cream in fun shapes like turkeys, flowers, and even famous people’s heads!","19세기 후반에, 사람들은 칠면조, 꽃, 심지어 유명한 사람들의 머리와 같은 재미있는 모양으로 아이스크림을 만들었다!"]],"w":"1번 문장 In the late 19th century, people made ice cream in fun shapes like turkeys, flowers…와 일치.","c":"T"},"h":"4919b7f471"},{"n":2,"t":"tf","q":"In the late 19th century, molded ice creams were enjoyed by everybody.","ko":"19세기 후반에 틀로 찍어 낸 아이스크림은 모든 사람이 즐겼다.","r":{"a":"F (본문과 다른 내용)","ev":"3번, 6번 문장","s":[[3,"However, molded ice creams weren’t for everybody.","하지만, 틀로 찍어 낸 아이스크림은 모든 사람을 위한 것은 아니었다."],[6,"So, these desserts were mainly enjoyed by wealthy people at expensive restaurants and dinner parties.","그래서, 이 디저트는 주로 비싼 식당과 저녁 파티에서 부유한 사람들이 즐겼다."]],"w":"3번에서 틀 아이스크림은 모든 사람을 위한 것이 아니었다고 하고, 6번에서 주로 부유한 사람들이 즐겼다고 함.","c":"F"},"h":"6bf34b9331"},{"n":3,"t":"tf","q":"Ice cream cones and bars were easier to eat and clean up.","ko":"아이스크림콘과 바는 먹고 치우기가 더 쉬웠다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Everyone loved them because they were easier to eat and clean up.","모든 사람이 그것들을 아주 좋아했는데, 먹고 치우기가 더 쉬웠기 때문이다."]],"w":"8번에서 모두가 콘과 바를 좋아한 이유가 easier to eat and clean up(먹고 치우기가 더 쉬움)이었음.","c":"T"},"h":"bad99fc115"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They wanted their ice cream to look unique…)","ko":"그들은 자신들의 아이스크림이 ___ 보이기를 원했다.","opts":["독특한","평범한","차가운","달콤한"],"word":"unique","r":{"a":"1) 독특한","ev":"2번 문장","s":[[2,"They wanted their ice cream to look unique, so they created these fancy designs by using special metal molds.","그들은 자신들의 아이스크림이 독특해 보이기를 원했고, 그래서 특별한 금속 틀을 사용하여 이런 멋진 디자인을 만들었다."]],"w":"독특한 모양(칠면조, 꽃, 유명한 사람의 머리)으로 아이스크림을 만들려고 특별한 틀을 썼다는 흐름. unique = 독특한. 평범한은 반대 뜻.","c":1},"h":"7732569532"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…it took a lot of time and effort to shape the ice cream.)","ko":"…아이스크림의 모양을 만드는 데 많은 시간과 ___이 들었다.","opts":["속도","노력","재료","기술"],"word":"effort","r":{"a":"2) 노력","ev":"4번 문장","s":[[4,"The ingredients for the ice cream were expensive, and it took a lot of time and effort to shape the ice cream.","아이스크림의 재료는 비쌌고, 아이스크림의 모양을 만드는 데 많은 시간과 노력이 들었다."]],"w":"모양을 만들기 어려워서 많은 시간과 effort가 필요했다는 내용. effort = 노력. 재료(ingredients)는 앞 문장에서 따로 나옴.","c":2},"h":"2ce821038c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nKeeping it from melting was also not easy.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것이 녹지 않게 하는 것도 쉽지 않았다.","opts":["금속 틀","아이스크림","냉장고","부유한 사람들"],"r":{"a":"2) 아이스크림","ev":"5번 문장","s":[[5,"Keeping it from melting was also not easy.","그것이 녹지 않게 하는 것도 쉽지 않았다."]],"w":"5번에서 녹지 않게 하는 것(Keeping it from melting)은 아이스크림이 녹지 않게 한다는 뜻임. 4번까지 계속 아이스크림 이야기임.","c":2,"k":"it = 아이스크림"},"pron":"it","h":"affcc91917"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In other words, there was no need to make fancy-shaped ice cream anymore.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다시 말해, 더 이상 멋진 모양의 아이스크림을 만들 필요가 없었다.","opts":["멋진 모양의 아이스크림이 이전보다 더 인기를 얻게 되었다.","더 이상 아이스크림을 만들어서는 안 되었다.","더 이상 아이스크림을 팔 필요가 없었다.","멋진 모양의 아이스크림을 만들어야 할 이유가 더 이상 없었다."],"r":{"a":"4) 멋진 모양의 아이스크림을 만들어야 할 이유가 더 이상 없었다.","ev":"8~10번 문장","s":[[8,"Everyone loved them because they were easier to eat and clean up.","모든 사람이 그것들을 아주 좋아했는데, 먹고 치우기가 더 쉬웠기 때문이다."],[9,"Also, new fridge technology made ice cream easier to store and cheaper.","또한, 새로운 냉장고 기술은 아이스크림을 저장하기 더 쉽고 더 저렴하게 만들었다."],[10,"In other words, there was no need to make fancy-shaped ice cream anymore.","다시 말해, 더 이상 멋진 모양의 아이스크림을 만들 필요가 없었다."]],"w":"there was no need to ~는 ‘~할 필요가 없었다’. 콘과 바가 쉽고 싸졌으니 비싼 모양 아이스크림을 만들 필요가 사라졌다는 뜻.","c":4},"h":"e99a763d19"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["아이스크림은 플라스틱 틀로 모양을 만들었다.","아이스크림콘과 바는 20세기 초에 도입되었다.","틀로 찍어 낸 아이스크림은 만들기가 쉽고 저렴했다.","부유한 사람들만 아이스크림콘과 바를 먹었다."],"opts":["Ice cream was shaped by plastic molds.","Ice cream cones and bars were introduced in the early 20th century.","Molded ice creams were easy and cheap to make.","Only wealthy people ate ice cream cones and bars."],"r":{"a":"2) Ice cream cones and bars were introduced in the early 20th century. (아이스크림콘과 바는 20세기 초에 도입되었다.)","ev":"2번, 4번, 7~8번 문장","s":[[2,"They wanted their ice cream to look unique, so they created these fancy designs by using special metal molds.","그들은 자신들의 아이스크림이 독특해 보이기를 원했고, 그래서 특별한 금속 틀을 사용하여 이런 멋진 디자인을 만들었다."],[4,"The ingredients for the ice cream were expensive, and it took a lot of time and effort to shape the ice cream.","아이스크림의 재료는 비쌌고, 아이스크림의 모양을 만드는 데 많은 시간과 노력이 들었다."],[7,"But in the early 20th century, ice cream cones and bars were introduced.","하지만 20세기 초에, 아이스크림콘과 바가 도입되었다."],[8,"Everyone loved them because they were easier to eat and clean up.","모든 사람이 그것들을 아주 좋아했는데, 먹고 치우기가 더 쉬웠기 때문이다."]],"w":"7번에서 아이스크림콘과 바는 20세기 초에 도입되었다고 함.","c":2},"h":"0f0dc15a4f"},{"n":9,"t":"sum","q":"New (A) technology made ice cream easier to (B) and cheaper.","ko":"새로운 (A) 기술은 아이스크림을 (B) 더 쉽고 더 저렴하게 만들었다.","oko":["(A) 금속 / (B) 녹이기","(A) 냉장고 / (B) 저장하기","(A) 전화기 / (B) 부수기","(A) 냉장고 / (B) 녹이기","(A) 금속 / (B) 저장하기"],"opts":["(A) metal / (B) melt","(A) fridge / (B) store","(A) phone / (B) break","(A) fridge / (B) melt","(A) metal / (B) store"],"r":{"a":"2) (A) fridge / (B) store ((A) 냉장고 / (B) 저장하기)","ev":"9번 문장","s":[[9,"Also, new fridge technology made ice cream easier to store and cheaper.","또한, 새로운 냉장고 기술은 아이스크림을 저장하기 더 쉽고 더 저렴하게 만들었다."]],"w":"9번에서 새로운 냉장고(fridge) 기술이 아이스크림을 저장하기(store) 더 쉽고 더 저렴하게 만들었다고 함.","c":2},"h":"36f1a9f3f0"},{"n":10,"t":"fill","q":"That’s why these molds [A] a part of [B].","ko":"그것이 바로 이 틀들이 [B]의 일부가 [A] 이유이다.","bank":["became","history","unique","expensive","wealthy","famous"],"bko":{"became":"되었다(become의 과거)","history":"역사","unique":"독특한","expensive":"비싼","wealthy":"부유한","famous":"유명한"},"r":{"a":"[A] became (되었다(become의 과거)), [B] history (역사)","ev":"11번 문장","s":[[11,"That’s why these molds became a part of history.","그것이 바로 이 틀들이 역사의 일부가 된 이유이다."]],"w":"11번에서 이 틀들은 역사(history)의 일부가 되었다(became)고 함.","c":null},"h":"65bfdf77b7"}]},{"u":9,"id":"rg3-09-1","no":1,"ko":"침이 맛을 바꾼다고? 브로콜리의 비밀","items":[{"n":1,"t":"tf","q":"Saliva is 99 percent water, but it has a big effect on how things taste.","ko":"침은 99퍼센트가 물이지만 음식이 어떤 맛이 나는지에 큰 영향을 미친다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Though it is 99 percent water, it has a big effect on how things taste.","비록 99퍼센트가 물이지만, 침은 음식이 어떤 맛이 나는지에 큰 영향을 미친다."]],"w":"2번 문장 Though it is 99 percent water, it has a big effect on how things taste와 일치. Though(비록 ~이지만) 앞뒤가 대조됨.","c":"T"},"h":"69d005d87c"},{"n":2,"t":"tf","q":"When rats were fed bitter food, their saliva did not change.","ko":"쥐들에게 쓴 음식을 먹였을 때 쥐들의 침은 변하지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"In an experiment, when rats were fed bitter food, their saliva changed, and they started to accept the taste.","한 실험에서, 쥐들에게 쓴 음식을 먹였을 때 쥐들의 침이 변했고, 쥐들은 그 맛을 받아들이기 시작했다."]],"w":"5번에서 쓴 음식을 먹은 쥐들의 침이 changed(변했다)고 함. 변하지 않았다는 말은 반대.","c":"F"},"h":"c49ea4983b"},{"n":3,"t":"tf","q":"Researchers hope to make healthy foods taste better by studying saliva and food.","ko":"연구자들은 침과 음식을 연구해서 건강에 좋은 음식이 더 맛있어지게 만들기를 바란다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Researchers hope to make healthy foods taste better by studying these interactions between saliva and food.","연구자들은 침과 음식 사이의 이러한 상호작용을 연구함으로써 건강에 좋은 음식이 더 맛있어지게 만들기를 바란다."]],"w":"9번 문장 Researchers hope to make healthy foods taste better by studying these interactions between saliva and food와 일치.","c":"T"},"h":"816358aea0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It mixes with food and allows us to taste sweet, salty, or sour flavors.)","ko":"침은 음식과 섞여서 우리가 단맛, 짠맛, 신맛을 느끼는 것을 ___.","opts":["막는다","가능하게 해 준다","요구한다","잊게 한다"],"word":"allows","r":{"a":"2) 가능하게 해 준다","ev":"3번 문장","s":[[3,"It mixes with food and allows us to taste sweet, salty, or sour flavors.","침은 음식과 섞여서 우리가 단맛, 짠맛, 또는 신맛을 느낄 수 있게 해 준다."]],"w":"allow A to v는 ‘A가 ~하게 해 준다’. 침이 음식과 섞여서 우리가 맛을 느낄 수 있게 해 준다는 뜻.","c":2},"h":"e38e08618e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…when rats were fed bitter food, their saliva changed…)","ko":"쥐들에게 ___ 음식을 먹였을 때, 쥐들의 침이 변했다.","opts":["달콤한","짠","쓴","신"],"word":"bitter","r":{"a":"3) 쓴","ev":"3번, 5번 문장","s":[[3,"It mixes with food and allows us to taste sweet, salty, or sour flavors.","침은 음식과 섞여서 우리가 단맛, 짠맛, 또는 신맛을 느낄 수 있게 해 준다."],[5,"In an experiment, when rats were fed bitter food, their saliva changed, and they started to accept the taste.","한 실험에서, 쥐들에게 쓴 음식을 먹였을 때 쥐들의 침이 변했고, 쥐들은 그 맛을 받아들이기 시작했다."]],"w":"3번에 단맛(sweet)·짠맛(salty)·신맛(sour)이 따로 나오므로 bitter는 그 세 가지가 아닌 ‘쓴’. 쓴 음식을 먹은 쥐의 침이 변했고(5번), 쥐들은 그 맛을 받아들이기 시작했다.","c":3},"h":"d29aeefbad"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSaliva is more than just the liquid in our mouths; it helps us taste food and enjoy flavors.","ko":"밑줄 친 it이 가리키는 것은?","sko":"침은 우리 입 안의 단순한 액체 그 이상으로, 우리가 음식의 맛을 느끼고 풍미를 즐기도록 도와준다.","opts":["음식","침","우리의 입","단맛"],"r":{"a":"2) 침","ev":"1번 문장","s":[[1,"Saliva is more than just the liquid in our mouths; it helps us taste food and enjoy flavors.","침은 우리 입 안의 단순한 액체 그 이상으로, 우리가 음식의 맛을 느끼고 풍미를 즐기도록 도와준다."]],"w":"1번에서 침(Saliva)이 우리가 음식의 맛을 느끼고 풍미를 즐기도록 도와준다는 뜻임. it은 앞의 Saliva를 가리킴.","c":2,"k":"it = 침"},"pron":"it","h":"43ce05897b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For example, if you eat broccoli all the time, broccoli won’t taste bad to you!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"예를 들어, 브로콜리를 항상 먹는다면, 브로콜리는 여러분에게 맛이 나쁘지 않을 것이다!","opts":["브로콜리를 늘 먹으면, 그 맛이 나쁘게 느껴지지 않을 것이다.","브로콜리를 한 번만 먹어도 평생 맛이 나쁘지 않을 것이다.","브로콜리를 항상 먹으면 침이 나오지 않을 것이다.","브로콜리는 먹을수록 맛이 더 나빠질 것이다."],"r":{"a":"1) 브로콜리를 늘 먹으면, 그 맛이 나쁘게 느껴지지 않을 것이다.","ev":"7~8번 문장","s":[[7,"But researchers think our saliva works in a similar way.","하지만 연구자들은 우리의 침도 비슷한 방식으로 작용한다고 생각한다."],[8,"For example, if you eat broccoli all the time, broccoli won’t taste bad to you!","예를 들어, 브로콜리를 항상 먹는다면, 브로콜리는 여러분에게 맛이 나쁘지 않을 것이다!"]],"w":"all the time은 ‘항상’, won’t taste bad는 ‘맛이 나쁘지 않을 것이다’. 7번의 연구자들 생각(침이 비슷하게 작용)에 대한 예시임.","c":1},"h":"4d96044504"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["쥐는 사람과 똑같다.","쥐는 사람보다 크다.","쥐는 음식에 대해 말할 수 있다.","쥐는 사람이 아니다."],"opts":["Rats are the same as people.","Rats are bigger than people.","Rats can talk about food.","Rats are not people."],"r":{"a":"4) Rats are not people. (쥐는 사람이 아니다.)","ev":"6번 문장","s":[[6,"Of course, rats aren’t people.","물론, 쥐는 사람이 아니다."]],"w":"6번에서 물론 쥐는 사람이 아니라고 함.","c":4},"h":"af4db27195"},{"n":9,"t":"sum","q":"Researchers (A) that our saliva works (B) to rats’ saliva.","ko":"연구자들은 우리의 침이 쥐의 침과 (B) 작용한다고 (A).","oko":["(A) 잊는다 / (B) 나쁘게","(A) 생각한다 / (B) 비슷하게","(A) 생각한다 / (B) 다르게","(A) 잊는다 / (B) 비슷하게","(A) 묻는다 / (B) 다르게"],"opts":["(A) forget / (B) badly","(A) think / (B) similarly","(A) think / (B) differently","(A) forget / (B) similarly","(A) ask / (B) differently"],"r":{"a":"2) (A) think / (B) similarly ((A) 생각한다 / (B) 비슷하게)","ev":"7번 문장","s":[[7,"But researchers think our saliva works in a similar way.","하지만 연구자들은 우리의 침도 비슷한 방식으로 작용한다고 생각한다."]],"w":"7번에서 연구자들은 우리의 침도 비슷한 방식으로(similarly) 작용한다고 생각한다(think)고 함.","c":2},"h":"1176cf1f89"},{"n":10,"t":"fill","q":"It may lead to new [A] to [B] healthy eating.","ko":"그것은 건강한 식사를 [B] 새로운 [A](으)로 이어질지도 모른다.","bank":["ways","encourage","bitter","quiet","salty","sweet"],"bko":{"ways":"방법들","encourage":"장려하다","bitter":"쓴","quiet":"조용한","salty":"짠","sweet":"단"},"r":{"a":"[A] ways (방법들), [B] encourage (장려하다)","ev":"10번 문장","s":[[10,"It may lead to new ways to encourage healthy eating.","그것은 건강한 식사를 장려하는 새로운 방법으로 이어질지도 모른다."]],"w":"10번에서 그것은 건강한 식사를 장려하는(encourage) 새로운 방법들(ways)로 이어질지도 모른다고 함.","c":null},"h":"c0a757af12"}]},{"u":9,"id":"rg3-09-2","no":2,"ko":"번개를 레이저로 길들일 수 있을까?","items":[{"n":1,"t":"tf","q":"Metal lightning rods only work for small areas, not large places like airports.","ko":"금속 피뢰침은 공항 같은 넓은 곳이 아니라 좁은 지역에서만 작동한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"We still use metal lightning rods on buildings today, but they only work for small areas, not large places like airports.","우리는 오늘날에도 건물에 금속 피뢰침을 사용하지만, 그것은 공항 같은 넓은 곳이 아니라 좁은 지역에서만 작동한다."]],"w":"3번 문장 they only work for small areas, not large places like airports와 일치. 이것이 새 아이디어가 필요한 이유(4번).","c":"T"},"h":"bd3642147f"},{"n":2,"t":"tf","q":"Scientists have tested the laser lightning rod only inside a lab.","ko":"과학자들은 레이저 피뢰침을 실험실 안에서만 실험해 왔다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"Before, some studies said lasers might change the path of lightning, but they only tested this inside a lab.","이전에, 일부 연구들은 레이저가 번개의 경로를 바꿀지도 모른다고 말했지만, 그들은 이것을 실험실 안에서만 실험했다."],[7,"Recently, they tried this idea outside, and the laser lightning rod actually changed the path of some lightning strikes!","최근에, 그들은 이 아이디어를 밖에서 시도했고, 레이저 피뢰침은 실제로 일부 번개의 경로를 바꾸었다!"]],"w":"6번에서 이전 연구들은 실험실 안에서만 실험했지만, 7번에서 최근에는 밖에서 시도해 일부 번개의 경로를 바꿨다고 함.","c":"F"},"h":"bd2b37e732"},{"n":3,"t":"tf","q":"Scientists hope to make the laser device cheaper.","ko":"과학자들은 레이저 장치를 더 저렴하게 만들기를 바란다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"In addition, they hope to make the laser device cheaper.","또한, 그들은 레이저 장치를 더 저렴하게 만들기를 바란다."]],"w":"9번 문장 they hope to make the laser device cheaper와 일치.","c":"T"},"h":"e1b9369f36"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Now, scientists are trying to use lasers instead.)","ko":"이제, 과학자들은 ___ 레이저를 사용하려고 노력하고 있다.","opts":["대신에","함께","갑자기","다시"],"word":"instead","r":{"a":"1) 대신에","ev":"1~2번 문장","s":[[1,"Benjamin Franklin invented the lightning rod to protect people from lightning.","벤저민 프랭클린은 사람들을 번개로부터 보호하기 위해 피뢰침을 발명했다."],[2,"Now, scientists are trying to use lasers instead.","이제, 과학자들은 대신 레이저를 사용하려고 노력하고 있다."]],"w":"1번에서 프랭클린이 피뢰침(금속)을 발명했고, 2번에서 과학자들은 레이저를 쓰려고 함. 금속 피뢰침 ‘대신에’ 레이저를 쓰려는 것이므로 instead = 대신에.","c":1},"h":"82a0213929"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…scientists want to guide lightning across broad areas with lasers.)","ko":"…과학자들은 레이저로 넓은 지역에 걸쳐 번개를 ___ 싶어 한다.","opts":["막고","만들고","유도하고","측정하고"],"word":"guide","r":{"a":"3) 유도하고","ev":"8번 문장","s":[[8,"Next, scientists want to guide lightning across broad areas with lasers.","다음으로, 과학자들은 레이저로 넓은 지역에 걸쳐 번개를 유도하고 싶어 한다."]],"w":"레이저를 큰 움직이는 피뢰침처럼 써서(5번) 번개가 가는 길을 바꾸는 것이 목표. guide = 이끌다, 유도하다.","c":3},"h":"22b2607d18"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIf they can solve these problems, lasers could become a new kind of lightning rod for big areas.","ko":"밑줄 친 they가 가리키는 것은?","sko":"만약 그들이 이 문제들을 해결할 수 있다면, 레이저는 넓은 지역을 위한 새로운 종류의 피뢰침이 될 수 있을 것이다.","opts":["레이저들","번개들","과학자들","피뢰침들"],"r":{"a":"3) 과학자들","ev":"10번 문장","s":[[10,"If they can solve these problems, lasers could become a new kind of lightning rod for big areas.","만약 그들이 이 문제들을 해결할 수 있다면, 레이저는 넓은 지역을 위한 새로운 종류의 피뢰침이 될 수 있을 것이다."]],"w":"10번에서 문제를 해결하는 주체는 과학자들임. they는 문제를 해결할 수 있는 과학자들을 가리키고, lasers는 따로 나옴.","c":3,"k":"they = 과학자들"},"pron":"they","h":"0dce642274"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why scientists have a new idea to keep us safe from lightning.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 과학자들이 번개로부터 우리를 안전하게 지켜 줄 새로운 아이디어를 가지고 있는 이유이다.","opts":["과학자들이 번개로부터 안전해서 새로운 아이디어를 낸다.","그래서 과학자들은 번개를 안전하게 보관하려고 한다.","새로운 아이디어 덕분에 번개가 안전해졌다.","그래서 과학자들은 우리를 번개로부터 안전하게 지킬 새로운 아이디어를 가지고 있다."],"r":{"a":"4) 그래서 과학자들은 우리를 번개로부터 안전하게 지킬 새로운 아이디어를 가지고 있다.","ev":"3~4번 문장","s":[[3,"We still use metal lightning rods on buildings today, but they only work for small areas, not large places like airports.","우리는 오늘날에도 건물에 금속 피뢰침을 사용하지만, 그것은 공항 같은 넓은 곳이 아니라 좁은 지역에서만 작동한다."],[4,"That’s why scientists have a new idea to keep us safe from lightning.","그것이 과학자들이 번개로부터 우리를 안전하게 지켜 줄 새로운 아이디어를 가지고 있는 이유이다."]],"w":"keep us safe from lightning은 ‘우리를 번개로부터 안전하게 지키다’. That’s why는 앞 3번(금속 피뢰침의 한계)이 이유라는 뜻.","c":4},"h":"0e3c5cd336"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["금속 피뢰침은 공항 같은 넓은 곳에서 잘 작동한다.","벤저민 프랭클린은 사람들을 번개로부터 보호하기 위해 피뢰침을 발명했다.","벤저민 프랭클린은 레이저 장치를 발명했다.","과학자들은 이미 레이저 장치를 아주 저렴하게 만들었다."],"opts":["Metal lightning rods work well in large places like airports.","Benjamin Franklin invented the lightning rod to protect people from lightning.","Benjamin Franklin invented the laser device.","Scientists have already made the laser device very cheap."],"r":{"a":"2) Benjamin Franklin invented the lightning rod to protect people from lightning. (벤저민 프랭클린은 사람들을 번개로부터 보호하기 위해 피뢰침을 발명했다.)","ev":"1번, 3번, 9번 문장","s":[[1,"Benjamin Franklin invented the lightning rod to protect people from lightning.","벤저민 프랭클린은 사람들을 번개로부터 보호하기 위해 피뢰침을 발명했다."],[3,"We still use metal lightning rods on buildings today, but they only work for small areas, not large places like airports.","우리는 오늘날에도 건물에 금속 피뢰침을 사용하지만, 그것은 공항 같은 넓은 곳이 아니라 좁은 지역에서만 작동한다."],[9,"In addition, they hope to make the laser device cheaper.","또한, 그들은 레이저 장치를 더 저렴하게 만들기를 바란다."]],"w":"1번에서 벤저민 프랭클린은 사람들을 번개로부터 보호하기 위해 피뢰침을 발명했다고 함.","c":2},"h":"6243779e62"},{"n":9,"t":"sum","q":"Scientists (A) to test if a laser beam pointed at the sky could work like a big, (B) lightning rod.","ko":"과학자들은 하늘을 향한 레이저 빔이 거대하고 (B) 피뢰침처럼 작동할 수 있는지 실험해 보기로 (A).","oko":["(A) 거부했다 / (B) 아주 작은","(A) 결정했다 / (B) 움직일 수 있는","(A) 잊었다 / (B) 무거운","(A) 결정했다 / (B) 아주 작은","(A) 거부했다 / (B) 움직일 수 있는"],"opts":["(A) refused / (B) tiny","(A) decided / (B) movable","(A) forgot / (B) heavy","(A) decided / (B) tiny","(A) refused / (B) movable"],"r":{"a":"2) (A) decided / (B) movable ((A) 결정했다 / (B) 움직일 수 있는)","ev":"5번 문장","s":[[5,"Scientists decided to test if a laser beam pointed at the sky could work like a big, movable lightning rod.","과학자들은 하늘을 향한 레이저 빔이 거대하고 움직일 수 있는 피뢰침처럼 작동할 수 있는지 실험해 보기로 결정했다."]],"w":"5번에서 과학자들은 레이저 빔이 거대하고 움직일 수 있는(movable) 피뢰침처럼 작동할 수 있는지 실험해 보기로 결정했다(decided)고 함.","c":2},"h":"d1bc8fbfbc"},{"n":10,"t":"fill","q":"Before, some [A] said lasers might change the [B] of lightning, but they only tested this inside a lab.","ko":"이전에, 일부 [A]은(는) 레이저가 번개의 [B]을(를) 바꿀지도 모른다고 말했지만, 그들은 이것을 실험실 안에서만 실험했다.","bank":["studies","path","broad","cheaper","recently","quickly"],"bko":{"studies":"연구들","path":"경로","broad":"넓은","cheaper":"더 저렴한","recently":"최근에","quickly":"빠르게"},"r":{"a":"[A] studies (연구들), [B] path (경로)","ev":"6번 문장","s":[[6,"Before, some studies said lasers might change the path of lightning, but they only tested this inside a lab.","이전에, 일부 연구들은 레이저가 번개의 경로를 바꿀지도 모른다고 말했지만, 그들은 이것을 실험실 안에서만 실험했다."]],"w":"6번에서 이전에 일부 연구들(studies)은 레이저가 번개의 경로(path)를 바꿀지도 모른다고 말했다고 함.","c":null},"h":"4830e979e2"}]},{"u":9,"id":"rg3-09-3","no":3,"ko":"영국 빵집의 최고 손님은 사람이 아니었다?","items":[{"n":1,"t":"tf","q":"In the Middle Ages, people ate about 1.3 kilograms of bread a day.","ko":"중세 시대에 사람들은 하루에 약 1.3킬로그램의 빵을 먹었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In the Middle Ages, people ate a lot of bread — about 1.3 kilograms a day.","중세 시대에, 사람들은 하루에 약 1.3킬로그램의 많은 빵을 먹었다."]],"w":"2번 문장 In the Middle Ages, people ate a lot of bread — about 1.3 kilograms a day와 일치.","c":"T"},"h":"f6c3f1eca2"},{"n":2,"t":"tf","q":"Horse bread was the same as the white bread people ate.","ko":"horse bread는 사람들이 먹던 하얀 빵과 같았다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"They were fed a flat, brown bread called horse bread, which was different from the white bread people ate.","말들은 horse bread라고 불리는 납작한 갈색 빵을 먹었는데, 그것은 사람들이 먹던 하얀 빵과는 달랐다."]],"w":"4번에서 horse bread는 flat, brown bread이고 사람들이 먹던 white bread와 다르다(different from)고 함.","c":"F"},"h":"f651b7fe43"},{"n":3,"t":"tf","q":"Horse bread was cheap and easy to carry.","ko":"horse bread는 값싸고 나르기 쉬웠다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"It was cheap, easy to carry and also good for the horses.","그것은 싸고, 나르기 쉬웠으며, 말들에게도 좋았다."]],"w":"6번 문장 It was cheap, easy to carry and also good for the horses와 일치.","c":"T"},"h":"6a4defde35"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…by using leftovers from the bakery.)","ko":"…빵집에서 나온 ___을 이용해서.","opts":["새 재료","남은 음식","빈 그릇","비싼 밀가루"],"word":"leftovers","r":{"a":"2) 남은 음식","ev":"5~6번 문장","s":[[5,"This special horse bread was made for working horses by using leftovers from the bakery.","이 특별한 horse bread는 빵집의 남은 음식을 이용해서 일하는 말들을 위해 만들어졌다."],[6,"It was cheap, easy to carry and also good for the horses.","그것은 싸고, 나르기 쉬웠으며, 말들에게도 좋았다."]],"w":"horse bread를 만든 재료가 빵집에서 나온 것인데, 6번에서 값이 싸다고 함. ‘남은 음식’으로 만들었으니 값이 쌌다는 흐름.","c":2},"h":"fa26ae1001"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…they replaced horses for carrying people or heavy things.)","ko":"…철도는 사람이나 무거운 물건을 나르는 일에서 말을 ___.","opts":["도왔다","막았다","대신했다","만들었다"],"word":"replaced","r":{"a":"3) 대신했다","ev":"9~10번 문장","s":[[9,"However, when the first railways opened in England in 1830, they replaced horses for carrying people or heavy things.","하지만 1830년 영국에서 첫 철도가 개통되었을 때, 철도는 사람이나 무거운 물건을 나르는 일에서 말을 대신했다."],[10,"So, horses didn’t need to work as much and finally stopped eating horse bread.","그래서 말들은 그만큼 일할 필요가 없어졌고 마침내 horse bread를 먹는 것을 멈췄다."]],"w":"9번에서 철도가 말을 replace했고, 10번에서 말이 그만큼 일할 필요가 없게 되었다고 함. replace = 대신하다, 대체하다.","c":3},"h":"1090a1d581"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen they had to carry people and things across the country, their owners didn’t have to feed them huge amounts of grain and grass.","ko":"밑줄 친 them이 가리키는 것은?","sko":"말들이 사람과 물건을 싣고 전국을 가로질러 가야 할 때, 말의 주인들은 말들에게 엄청난 양의 곡물과 풀을 먹일 필요가 없었다.","opts":["말들","사람들과 물건들","곡물과 풀","제빵사들"],"r":{"a":"1) 말들","ev":"7~8번 문장","s":[[7,"It provided them with the energy needed for their hard work.","그것은 말들에게 힘든 일에 필요한 에너지를 제공해 주었다."],[8,"When they had to carry people and things across the country, their owners didn’t have to feed them huge amounts of grain and grass.","말들이 사람과 물건을 싣고 전국을 가로질러 가야 할 때, 말의 주인들은 말들에게 엄청난 양의 곡물과 풀을 먹일 필요가 없었다."]],"w":"8번의 they는 말들이고, their owners는 말의 주인들. 주인이 먹이는 대상 them도 말들임. 7번에서 horse bread가 말들에게 에너지를 주었다는 내용과 이어짐.","c":1},"h":"2a44e8422f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, horses didn’t need to work as much and finally stopped eating horse bread.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 말들은 그만큼 일할 필요가 없어졌고 마침내 horse bread를 먹는 것을 멈췄다.","opts":["말들이 일을 더 열심히 하게 되어서 horse bread를 더 많이 먹었다.","말들이 horse bread를 먹지 않아서 일을 덜 하게 되었다.","말들은 일을 덜 하게 되었지만 horse bread를 계속 먹었다.","말들은 그만큼 일할 필요가 없어졌고 결국 horse bread를 먹지 않게 되었다."],"r":{"a":"4) 말들은 그만큼 일할 필요가 없어졌고 결국 horse bread를 먹지 않게 되었다.","ev":"9~10번 문장","s":[[9,"However, when the first railways opened in England in 1830, they replaced horses for carrying people or heavy things.","하지만 1830년 영국에서 첫 철도가 개통되었을 때, 철도는 사람이나 무거운 물건을 나르는 일에서 말을 대신했다."],[10,"So, horses didn’t need to work as much and finally stopped eating horse bread.","그래서 말들은 그만큼 일할 필요가 없어졌고 마침내 horse bread를 먹는 것을 멈췄다."]],"w":"9번에서 철도가 말을 대신했으므로 말은 일이 줄었고(didn’t need to work as much), 그 결과(So) horse bread를 먹는 것을 멈췄음. 일이 줄어서 안 먹게 된 것이지 안 먹어서 일이 준 것이 아님.","c":4},"h":"e0eba8cfff"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["말은 영국에서 제빵사들의 가장 작은 고객이었다.","중세 시대에 말은 사람보다 빵을 더 많이 먹었다.","중세 시대에 사람들은 말보다 빵을 더 많이 먹었다.","영국의 제빵사들은 말에게 빵을 판 적이 없다."],"opts":["Horses were the smallest customers for bakers in England.","In the Middle Ages, horses ate more bread than people.","People in the Middle Ages ate more bread than horses.","Bakers in England never sold bread to horses."],"r":{"a":"2) In the Middle Ages, horses ate more bread than people. (중세 시대에 말은 사람보다 빵을 더 많이 먹었다.)","ev":"1~3번 문장","s":[[1,"It may sound strange, but horses were actually the biggest customers for bakers in England for centuries.","이상하게 들릴지도 모르지만, 말은 사실 수 세기 동안 영국에서 제빵사들의 가장 큰 고객이었다."],[2,"In the Middle Ages, people ate a lot of bread — about 1.3 kilograms a day.","중세 시대에, 사람들은 하루에 약 1.3킬로그램의 많은 빵을 먹었다."],[3,"But horses ate even more!","하지만 말들은 훨씬 더 많이 먹었다!"]],"w":"2번에서 사람들이 하루에 약 1.3킬로그램의 빵을 먹었는데, 3번에서 말들은 훨씬 더 많이 먹었다고 함.","c":2},"h":"1e675813d1"},{"n":9,"t":"sum","q":"Horse bread (A) horses with the (B) needed for their hard work.","ko":"horse bread는 말들에게 힘든 일에 필요한 (B)을(를) (A).","oko":["(A) 가져갔다 / (B) 물","(A) 제공했다 / (B) 에너지","(A) 제공했다 / (B) 물","(A) 가져갔다 / (B) 에너지","(A) 제공했다 / (B) 돈"],"opts":["(A) took / (B) water","(A) provided / (B) energy","(A) provided / (B) water","(A) took / (B) energy","(A) provided / (B) money"],"r":{"a":"2) (A) provided / (B) energy ((A) 제공했다 / (B) 에너지)","ev":"7번 문장","s":[[7,"It provided them with the energy needed for their hard work.","그것은 말들에게 힘든 일에 필요한 에너지를 제공해 주었다."]],"w":"7번에서 horse bread는 말들에게 힘든 일에 필요한 에너지(energy)를 제공해(provided) 주었다고 함.","c":2},"h":"8953d2930d"},{"n":10,"t":"fill","q":"It may sound strange, but horses were actually the [A] customers for bakers in England for [B].","ko":"이상하게 들릴지도 모르지만, 말은 사실 수 [B] 동안 영국에서 제빵사들의 [A] 고객이었다.","bank":["biggest","centuries","carry","eat","finally","across"],"bko":{"biggest":"가장 큰","centuries":"세기","carry":"나르다","eat":"먹다","finally":"마침내","across":"가로질러"},"r":{"a":"[A] biggest (가장 큰), [B] centuries (세기)","ev":"1번 문장","s":[[1,"It may sound strange, but horses were actually the biggest customers for bakers in England for centuries.","이상하게 들릴지도 모르지만, 말은 사실 수 세기 동안 영국에서 제빵사들의 가장 큰 고객이었다."]],"w":"1번에서 말은 사실 수 세기(centuries) 동안 영국에서 제빵사들의 가장 큰(biggest) 고객이었다고 함.","c":null},"h":"69550b3d67"}]},{"u":10,"id":"rg3-10-1","no":1,"ko":"갈등이 생기면 나는 거북이? 상어? 올빼미?","items":[{"n":1,"t":"tf","q":"Turtles run away from problems.","ko":"거북이들은 문제를 피해 도망간다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장에 Turtles run away from problems가 그대로 나옴. run away from은 '~에서 도망치다'.","c":"T","ev":"4번 문장","s":[[4,"Turtles run away from problems.","거북이들은 문제를 피해 도망간다."]]},"h":"442678c93d"},{"n":2,"t":"tf","q":"Teddy bears give up their relationships to keep their goals.","ko":"곰 인형들은 자신의 목표를 지키기 위해 관계를 포기한다.","r":{"a":"F (본문과 다른 내용)","w":"7번에서 곰 인형은 관계를 지키려고 자기 목표를 포기함(give up their goals to keep their relationships). 목표와 관계가 서로 바뀐 진술이라 F.","c":"F","ev":"7번 문장","s":[[7,"Teddy bears give up their goals to keep their relationships.","곰 인형들은 관계를 지키기 위해 자신의 목표를 포기한다."]]},"h":"d833050586"},{"n":3,"t":"tf","q":"Johnson found five styles that people use to deal with conflicts.","ko":"존슨은 사람들이 갈등을 다루는 데 사용하는 다섯 가지 방식을 찾아냈다(분류했다).","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장 He categorized five styles that people use to deal with conflicts with others와 같은 내용. categorize는 '분류하다'.","c":"T","ev":"3번 문장","s":[[3,"He categorized five styles that people use to deal with conflicts with others.","그는 사람들이 다른 사람들과의 갈등을 다루기 위해 사용하는 다섯 가지 방식을 분류했다."]]},"h":"e606853329"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Foxes can sacrifice some of their goals or persuade others to give up some of theirs.)","ko":"여우들은 자신의 목표 일부를 희생하거나 다른 사람들이 그들의 목표 일부를 포기하도록 ( ) 수 있다.","opts":["무시하다","비교하다","설득하다","도와주다"],"word":"persuade","r":{"a":"3) 설득하다","w":"8번에서 persuade others to give up은 남이 목표 일부를 포기하도록 '설득하다'. 여우는 서로 조금씩 양보하는 유형이라 무시하거나 비교한다는 뜻이 아님.","c":3,"ev":"8번 문장","s":[[8,"Foxes can sacrifice some of their goals or persuade others to give up some of theirs.","여우들은 자신의 목표 일부를 희생하거나 다른 사람들이 그들의 목표 일부를 포기하도록 설득할 수 있다."]]},"h":"fe92b89992"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (How people handle conflicts can make the relationship last longer and be more satisfying.)","ko":"사람들이 갈등을 어떻게 다루는지는 관계가 더 오래 지속되고 더 ( ) 만들 수 있다.","opts":["지루한","만족스러운","위험한","느린"],"word":"satisfying","r":{"a":"2) 만족스러운","w":"12번에서 갈등을 잘 다루면 관계가 더 오래가고 더 '만족스러워'진다는 흐름. 지루하거나 위험하다는 내용은 없음.","c":2,"ev":"12번 문장","s":[[12,"How people handle conflicts can make the relationship last longer and be more satisfying.","사람들이 갈등을 어떻게 다루는지는 관계가 더 오래 지속되고 더 만족스러워지게 만들 수 있다."]]},"h":"5b8f62a0c6"},{"n":6,"t":"ref","q":"What does the underlined \"these styles\" refer to?\nEveryone has their unique ways of solving conflicts, and these styles can influence their relationships.","ko":"밑줄 친 these styles이 가리키는 것은?","sko":"모든 사람은 갈등을 해결하는 자신만의 독특한 방법이 있고, 이 방식들은 그들의 관계에 영향을 줄 수 있다.","opts":["갈등을 해결하는 사람들의 방식들","다섯 마리 동물들","사람들의 관계들","갈등들"],"r":{"a":"1) 갈등을 해결하는 사람들의 방식들","w":"11번에서 these styles는 앞의 \"갈등을 해결하는 자신만의 독특한 방법(ways of solving conflicts)\"을 가리킴.","c":1,"ev":"11번 문장","s":[[11,"Everyone has their unique ways of solving conflicts, and these styles can influence their relationships.","모든 사람은 갈등을 해결하는 자신만의 독특한 방법이 있고, 이 방식들은 그들의 관계에 영향을 줄 수 있다."]],"k":"these styles = 갈등을 해결하는 사람들의 방식들"},"pron":"these styles","h":"2cdc064673"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He found that we tend to think about what we want and what other people want too.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 우리가 우리 자신이 원하는 것과 다른 사람이 원하는 것도 함께 생각하는 경향이 있다는 것을 알아냈다.","opts":["존슨은 사람들이 남이 원하는 것은 전혀 생각하지 않는다는 것을 알아냈다.","존슨은 사람들이 자신이 원하는 것과 남이 원하는 것을 함께 생각하는 경향이 있다는 것을 알아냈다.","존슨은 사람들이 자기 자신이 원하는 것만 생각한다는 것을 알아냈다.","존슨은 사람들이 아무것도 원하지 않을 때 가장 행복하다는 것을 알아냈다."],"r":{"a":"2) 존슨은 사람들이 자신이 원하는 것과 남이 원하는 것을 함께 생각하는 경향이 있다는 것을 알아냈다.","w":"what we want and what other people want too는 \"우리가 원하는 것과 다른 사람이 원하는 것도 함께\"라는 뜻이라서 둘 다 생각하는 경향이 있다는 의미임.","c":2,"ev":"2번 문장","s":[[2,"He found that we tend to think about what we want and what other people want too.","그는 우리가 우리 자신이 원하는 것과 다른 사람이 원하는 것도 함께 생각하는 경향이 있다는 것을 알아냈다."]]},"h":"28d3085be6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["거북이들은 무슨 일이 있어도 이기려고 한다.","곰 인형들은 자신의 목표를 절대 포기하지 않는다.","상어들은 다른 사람들의 요구에 신경 쓰지 않는다.","올빼미들은 시간이 걸리면 해결책 찾기를 멈춘다."],"opts":["Turtles want to win at any cost.","Teddy bears never give up their goals.","Sharks do not care about other people's needs.","Owls stop looking for a solution if it takes time."],"r":{"a":"3) Sharks do not care about other people's needs.","w":"6번에서 상어는 무슨 일이 있어도 이기려 하고 남의 요구에 신경 쓰지 않음. 이기려는 건 상어(거북이는 도망, 4번), 곰 인형은 목표를 포기(7번), 올빼미는 시간이 걸려도 계속 찾음(10번).","c":3,"ev":"4, 6~7, 10번 문장","s":[[4,"Turtles run away from problems.","거북이들은 문제를 피해 도망간다."],[6,"Sharks want to win at any cost and don’t care about others’ needs.","상어들은 무슨 일이 있어도 이기기를 원하고 다른 사람들의 요구에는 신경 쓰지 않는다."],[7,"Teddy bears give up their goals to keep their relationships.","곰 인형들은 관계를 지키기 위해 자신의 목표를 포기한다."],[10,"They try to find a solution everyone is happy with, even if it takes time.","그들은 비록 시간이 걸리더라도 모두가 만족하는 해결책을 찾으려고  panels are on water.","ko":"대부분의 태양 전지판은 물 위에 있다.","r":{"a":"F (본문과 다른 내용)","w":"2번에서 Most of them are on land(대부분은 육지에 있다)라고 함. 물 위에 설치하려는 건 최근의 새로운 시도라서 F.","c":"F","ev":"2번 문장","s":[[2,"Most of them are on land, but recently, people are trying to put floating solar panels on water.","그것들의 대부분은 육지에 있지만, 최근에 사람들은 물 위에 뜨는 태양 전지판을 설치하려고 노력하고 있다."]]},"h":"3be85bf06a"},{"n":3,"t":"tf","q":"Too many solar panels could harm the plants and animals in the water.","ko":"너무 많은 태양 전지판은 물속의 식물과 동물들을 해칠 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"10번 문장과 같은 내용. harm은 '해치다', could는 '~할 수도 있다'.","c":"T","ev":"10번 문장","s":[[10,"Too many solar panels could harm the plants and animals in the water.","너무 많은 태양 전지판은 물속의 식물과 동물들을 해칠 수 있다."]]},"h":"312181a193"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They are expensive, but some benefits make solar panels a good idea.)","ko":"그것들은 비싸지만, 몇 가지 ( )들이 태양 전지판을 좋은 아이디어로 만든다.","opts":["문제점","이점","비용","위험"],"word":"benefits","r":{"a":"2) 이점","w":"5번은 but을 기준으로 앞은 비싸다(단점), 뒤는 benefits 때문에 좋은 아이디어라는 흐름. 그래서 benefits는 이점(혜택). 비용이나 문제점이면 좋은 아이디어가 되지 못함.","c":2,"ev":"5번 문장","s":[[5,"They are expensive, but some benefits make solar panels a good idea.","그것들은 비싸지만, 몇 가지 혜택들이 태양 전지판을 좋은 아이디어로 만든다."]]},"h":"7f0631f543"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The scientists say it's important to study how these panels will affect each lake's water.)","ko":"과학자들은 이 전지판들이 각 호수의 물에 어떻게 ( ) 것인지 연구하는 것이 중요하다고 말한다.","opts":["팔다","찾다","영향을 미치다","잊다"],"word":"affect","r":{"a":"3) 영향을 미치다","w":"앞 10번에서 전지판이 물속 생물을 해칠 수 있다고 했으니, 11번은 전지판이 호수 물에 어떤 영향을 줄지 연구하자는 내용. affect는 영향을 미치다.","c":3,"ev":"11번 문장","s":[[11,"The scientists say it’s important to study how these panels will affect each lake’s water.","과학자들은 이 전지판들이 각 호수의 물에 어떻게 영향을 미칠지 연구하는 것이 중요하다고 말한다."]]},"h":"56817e1bab"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are placed on floating platforms fixed to the bottom of lakes.","
