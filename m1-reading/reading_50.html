l Yi. I imagined the great battle right off the coast of Tongyeong. Then we enjoyed taking a walk along the coast. The sunset was beautiful. I closed my eyes. I could feel Admiral Yi's love for the country. Everything was really peaceful.", "August 17th", "Early in the morning, we went to Dongpirang. There were many pretty paintings on the walls. It was the best place for taking pictures! Mom and I took hundreds of pictures. Finally, my dad said, \"Please stop! No more pictures!\"", "'Dong' means 'east,' and 'pirang' means 'cliff.' There is also Seopirang.", "Next, we went to the Jeon Hyuck-lim Museum of Art. The painter's nickname is 'The Magician of Color.' He painted the sea of Tongyeong with various blue colors. I enjoyed his paintings very much.", "What a great experience! Going on a family trip is always fun. Tongyeong, bye for now! See you next time!"];var PASS_KO=["가람이의 통영 여행 일기", "8월 16일", "나는 아침 여섯 시에 일어났다. 통영으로의 우리 가족 여행의 첫날이었다. 나는 신이 났다!", "우리는 오후 1시에 중앙시장에 도착했다. 그곳에서 우리는 점심으로 충무김밥을 먹었다. 롤 안에는 밥만 있었다! 아빠는 \"롤을 무와 오징어랑 함께 먹어 봐. 오래전에 어부들은 바다에 나가서 충무김밥을 먹었어.\"라고 말씀하셨다. 그것은 약간 매웠지만 맛있었다.", "충무는 통영의 옛 이름이다.", "오후에 우리는 이순신 공원에 갔다. 이순신 장군의 거대한 동상이 있었다. 나는 통영의 해안 바로 앞에서 있었던 위대한 전투를 상상했다. 그다음에 우리는 해안을 따라 산책하는 것을 즐겼다. 일몰이 아름다웠다. 나는 눈을 감았다. 나는 이순신 장군의 나라에 대한 사랑을 느낄 수 있었다. 모든 것이 정말 평화로웠다.", "8월 17일", "아침 일찍, 우리는 동피랑에 갔다. 벽에는 많은 예쁜 그림들이 있었다. 그곳은 사진을 찍기에 최고의 장소였다! 엄마와 나는 수백 장의 사진을 찍었다. 마침내, 나의 아빠가 \"제발 그만! 더 이상의 사진은 안 돼!\"라고 말씀하셨다.", "'동'은 '동쪽'을 의미하고, '피랑'은 '절벽'을 의미한다. 서피랑도 있다.", "다음으로, 우리는 전혁림 미술관에 갔다. 그 화가의 별명은 '색채의 마술사'이다. 그는 통영의 바다를 다양한 푸른색으로 칠했다. 나는 그의 그림들을 아주 많이 즐겼다.", "정말 좋은 경험이었구나! 가족 여행을 가는 것은 언제나 재미있다. 통영, 이젠 안녕! 다음에 보자!"];
