 내용)","ev":"6~7번 문장","s":[[6,"During that time, people were forced to use German, the language of their invaders.","그 시기 동안, 사람들은 침략자의 언어인 독일어를 쓰도록 강요받았다."],[7,"Conversations, documents, and even plays had to be in German.","대화, 문서, 그리고 심지어 연극까지 독일어로 되어야만 했다."]],"w":"6번에서 사람들은 독일어를 쓰도록 강요받았고, 7번에서 대화, 문서, 심지어 연극까지 독일어로 해야 했다고 해요.","c":"F"},"h":"113fe7dc1e"},{"n":3,"t":"tf","q":"Czech people built up hopes and dreams for independence through puppet shows.","ko":"체코 사람들은 인형극을 통해 독립에 대한 희망과 꿈을 키웠다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"They also built up hopes and dreams for independence through these puppet shows.","그들은 또한 이 인형극들을 통해 독립에 대한 희망과 꿈을 키웠다."]],"w":"10번에 They also built up hopes and dreams for independence through these puppet shows라고 나와요.","c":"T"},"h":"ee7ba79904"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...people were forced to use German, the language of their invaders.)","ko":"사람들은 ( )의 언어인 독일어를 쓰도록 강요받았다.","opts":["친구들","상인들","침략자들","관광객들"],"word":"invaders","r":{"a":"3) 침략자들","ev":"6번 문장","s":[[6,"During that time, people were forced to use German, the language of their invaders.","그 시기 동안, 사람들은 침략자의 언어인 독일어를 쓰도록 강요받았다."]],"w":"독일어를 강요한 사람들이니 나라를 차지한 쪽이에요. 합스부르크 통치(5번) 아래에서 독일어를 쓰게 했으니 invaders는 '침략자들'이에요.","c":3},"h":"6670830818"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the marionettes have become a significant part of the culture.)","ko":"...마리오네트는 그 문화의 ( ) 부분이 되어왔다.","opts":["작은","중요한","오래된","이상한"],"word":"significant","r":{"a":"2) 중요한","ev":"11번 문장","s":[[11,"Since the country gained its freedom, the marionettes have become a significant part of the culture.","나라가 자유를 얻은 이후로, 마리오네트는 그 문화의 중요한 부분이 되어왔다."]],"w":"나라가 자유를 얻은 이후로 계속 문화의 한 부분이 되어 왔다는 말이에요. significant는 '중요한'이라는 뜻이에요.","c":2},"h":"0344c17e39"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis helped people preserve their native language.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 사람들이 그들의 모국어를 보존하도록 도왔다.","opts":["합스부르크 왕가의 통치","독일어를 써야 했던 것","나라가 자유를 얻은 것","소규모 인형극을 체코어로 공연할 수 있었던 것"],"r":{"a":"4) 소규모 인형극을 체코어로 공연할 수 있었던 것","ev":"8~9번 문장","s":[[8,"However, the small puppet shows that were held in homes and alleys could still be performed in Czech.","하지만, 주택과 골목에서 열렸던 소규모의 인형극들은 여전히 체코어로 공연될 수 있었다."],[9,"This helped people preserve their native language.","이것은 사람들이 그들의 모국어를 보존하도록 도왔다."]],"w":"모국어를 지키도록 도운 것은 8번에서 말한 '작은 인형극을 여전히 체코어로 공연할 수 있었던 것'이에요. 9번의 This는 이 내용을 받은 말이에요.","c":4},"h":"dc51b7e3ff"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But what do these puppet shows have to do with independence?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그런데 이 인형극들이 독립과 무슨 관련이 있을까?","opts":["그런데 이 인형극들이 독립과 무슨 관련이 있을까?","이 인형극들은 독립을 위해 무엇을 해야 할까?","이 인형극들은 독립 이후에 어떻게 바뀌었을까?","이 인형극들은 독립과 아무 관련이 없다."],"r":{"a":"1) 그런데 이 인형극들이 독립과 무슨 관련이 있을까?","ev":"4번 문장","s":[[4,"But what do these puppet shows have to do with independence?","그런데 이 인형극들이 독립과 무슨 관련이 있을까?"]],"w":"「have to do with」는 '~과 관련이 있다'예요. 그래서 what do these puppet shows have to do with independence는 '이 인형극들이 독립과 무슨 관련이 있을까?'라는 질문이에요.","c":1},"h":"a38e754773"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마리오네트극은 체코의 축제 기간에 절대 열리지 않는다.","체코의 영토는 20세기에 합스부르크 왕가의 통치를 받았다.","마리오네트극은 특히 나라의 독립을 축하하는 축제에서 흔하다.","인형극은 큰 극장에서만 열렸다."],"opts":["Marionette shows are never held during Czech festivals.","Czech lands were under Habsburg rule in the 20th century.","Marionette shows are common during festivals that celebrate the nation’s independence.","Puppet shows were held only in big theaters."],"r":{"a":"3) Marionette shows are common during festivals that celebrate the nation’s independence.","ev":"3, 5, 8번 문장","s":[[3,"Marionette shows are common during Czech festivals, especially ones that celebrate the nation’s independence.","마리오네트극은 체코의 축제 기간 동안, 특히 나라의 독립을 축하하는 축제들에서 흔하다."],[5,"In the 17th century, Czech lands were under Habsburg rule.","17세기에, 체코의 영토는 합스부르크 왕가의 통치하에 있었다."],[8,"However, the small puppet shows that were held in homes and alleys could still be performed in Czech.","하지만, 주택과 골목에서 열렸던 소규모의 인형극들은 여전히 체코어로 공연될 수 있었다."]],"w":"3번에서 마리오네트극은 체코의 축제, 특히 독립을 축하하는 축제에서 흔하다고 해요. 합스부르크 통치는 17세기였고(5번), 작은 인형극은 주택과 골목에서 열렸어요(8번).","c":3},"h":"9dc4a4e1d7"},{"n":9,"t":"sum","q":"Under Habsburg rule, people had to use German, but small puppet shows could be (A) in Czech, which helped people (B) their native language.","ko":"합스부르크 통치하에서 사람들은 독일어를 써야 했지만, 소규모 인형극은 체코어로 (A)될 수 있었고, 이는 사람들이 모국어를 (B) 도왔다.","oko":["(A) 숨겨져 / (B) 잊도록","(A) 공연되어 / (B) 잊도록","(A) 쓰여 / (B) 바꾸도록","(A) 공연되어 / (B) 보존하도록","(A) 팔려 / (B) 보존하도록"],"opts":["(A) hidden / (B) forget","(A) performed / (B) forget","(A) written / (B) change","(A) performed / (B) preserve","(A) sold / (B) preserve"],"r":{"a":"4) (A) performed / (B) preserve","ev":"8~9번 문장","s":[[8,"However, the small puppet shows that were held in homes and alleys could still be performed in Czech.","하지만, 주택과 골목에서 열렸던 소규모의 인형극들은 여전히 체코어로 공연될 수 있었다."],[9,"This helped people preserve their native language.","이것은 사람들이 그들의 모국어를 보존하도록 도왔다."]],"w":"8번에서 작은 인형극은 체코어로 공연(performed)될 수 있었고, 9번에서 이것이 사람들이 모국어를 보존(preserve)하도록 도왔어요.","c":4},"h":"1842247ca2"},{"n":10,"t":"fill","q":"Since the country gained its [A], the marionettes have [B] a significant part of the culture.","ko":"나라가 [A]를 얻은 이후로, 마리오네트는 그 문화의 중요한 부분이 [B] 왔다.","bank":["freedom","become","preserve","invaders","alleys","German"],"bko":{"freedom":"자유","become":"~이 되다","preserve":"보존하다","invaders":"침략자들","alleys":"골목들","German":"독일어"},"r":{"a":"[A] freedom, [B] become","ev":"11번 문장","s":[[11,"Since the country gained its freedom, the marionettes have become a significant part of the culture.","나라가 자유를 얻은 이후로, 마리오네트는 그 문화의 중요한 부분이 되어왔다."]],"w":"11번에서 나라가 자유(freedom)를 얻은 이후로, 마리오네트는 그 문화의 중요한 부분이 되어(become) 왔다고 해요.","c":null},"h":"9dbdf9fdb1"}]},{"u":4,"id":"hk3-04-2","no":2,"ko":"made in 우주","items":[{"n":1,"t":"tf","q":"Veggie is a space garden on the International Space Station.","ko":"Veggie는 국제 우주 정거장에 있는 우주 정원이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Veggie—also known as the Vegetable Production System—is a space garden on the International Space Station.","채소 생산 시스템으로도 알려져 있는 Veggie는 국제 우주 정거장의 우주 정원이다."]],"w":"4번 문장에서 Veggie is a space garden on the International Space Station이라고 해요.","c":"T"},"h":"b73d250e02"},{"n":2,"t":"tf","q":"In Veggie, plants are grown in pots of soil.","ko":"Veggie에서 식물은 흙이 담긴 화분에서 길러진다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"Without gravity, the soil does not settle in pots around the plants.","중력 없이, 흙은 식물을 둘러싼 화분 안에 고정되지 않는다."],[8,"So Veggie’s plants are grown in a container of water.","그래서 Veggie의 식물은 물이 담긴 용기 안에서 길러진다."]],"w":"7번에서 중력이 없으면 흙이 화분 안에 고정되지 않는다고 하고, 8번에서 Veggie의 식물은 물이 담긴 용기 안에서 길러진다고 해요.","c":"F"},"h":"49e5bb4a50"},{"n":3,"t":"tf","q":"Astronauts have found ways to solve the problem of growing plants in space.","ko":"우주 비행사들은 우주에서 식물을 기르는 문제를 해결할 방법을 찾아냈다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Yet, astronauts have found ways to solve this problem!","그렇지만, 우주 비행사들은 이 문제를 해결할 방법을 찾아냈다!"]],"w":"3번에서 우주 비행사들이 이 문제(우주에서 식물에 물, 빛, 중력을 주기 힘든 것)를 해결할 방법을 찾아냈다고 해요.","c":"T"},"h":"f07e2cafa9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...it’s hard to provide plants with water, light, and gravity in space.)","ko":"...우주에서는 식물에 물, 빛, 그리고 중력을 ( ) 힘들기 때문이다.","opts":["빼앗기","제공하기","팔기","그리기"],"word":"provide","r":{"a":"2) 제공하기","ev":"2번 문장","s":[[2,"It seems impossible because it’s hard to provide plants with water, light, and gravity in space.","그것은 불가능하게 보이는데 왜냐하면 우주에서는 식물에 물, 빛, 그리고 중력을 제공하기가 힘들기 때문이다."]],"w":"우주에서 식물을 기르기 어려운 이유가 물, 빛, 중력을 식물에게 주기 힘들기 때문이에요. 「provide A with B」는 'A에게 B를 제공하다'예요.","c":2},"h":"8e79af314d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Their roots are fixed with a special gum...)","ko":"그것들의 뿌리는 특수한 고무로 ( ).","opts":["고정된다","잘린다","씻긴다","시든다"],"word":"fixed","r":{"a":"1) 고정된다","ev":"9번 문장","s":[[9,"Their roots are fixed with a special gum that helps the plants grow in one place.","그것들의 뿌리는 식물이 한 곳에서 자라도록 도와주는 특수한 고무로 고정된다."]],"w":"고무는 식물이 한 곳에서 자라도록 도와요. 그러니 뿌리는 그 고무로 움직이지 않게 고정돼요. fix는 '고정시키다'라는 뜻이에요.","c":1},"h":"8ddb5fabb5"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nHowever, this doesn’t work in space.","ko":"밑줄 친 this가 가리키는 것은?","sko":"하지만, 이것은 우주에서는 잘되지 않는다.","opts":["국제 우주 정거장","LED 조명으로 줄기를 위로 자라게 하는 일","지구에서 흙에 씨앗이나 뿌리를 놓고 물을 주어 식물을 기르는 방식","특수한 고무로 뿌리를 고정하는 일"],"r":{"a":"3) 지구에서 흙에 씨앗이나 뿌리를 놓고 물을 주어 식물을 기르는 방식","ev":"5~6번 문장","s":[[5,"To grow plants on the Earth, we only need to place a seed or roots in dirt and regularly provide water.","지구에서는 식물을 기르기 위해, 흙 안에 씨앗이나 뿌리를 놓고 주기적으로 물을 제공하기만 하면 된다."],[6,"However, this doesn’t work in space.","하지만, 이것은 우주에서는 잘되지 않는다."]],"w":"우주에서 잘되지 않는 것은 5번에서 말한 '지구에서 씨앗이나 뿌리를 흙에 놓고 물을 주어 식물을 기르는 방식'이에요. 7번에서 중력이 없어 흙이 고정되지 않는 이유가 나와요.","c":3},"h":"aad2d08e53"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Soon, we might be able to see a space farm with various plants!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"곧, 우리는 다양한 식물이 있는 우주 농장을 볼 수 있을지도 모른다!","opts":["우리는 곧 우주에서 다양한 식물이 있는 농장을 볼 수 없을 것이다.","우리는 이미 우주 농장에서 다양한 식물을 먹고 있다.","우리는 지구에서 다양한 식물이 있는 우주 농장을 만들었다.","곧 우리는 다양한 식물이 있는 우주 농장을 볼 수 있을지도 모른다."],"r":{"a":"4) 곧 우리는 다양한 식물이 있는 우주 농장을 볼 수 있을지도 모른다.","ev":"12번 문장","s":[[12,"Soon, we might be able to see a space farm with various plants!","곧, 우리는 다양한 식물이 있는 우주 농장을 볼 수 있을지도 모른다!"]],"w":"might be able to는 '~할 수 있을지도 모른다'는 약한 가능성이에요. 그래서 곧 다양한 식물이 있는 우주 농장을 볼 수 있을지도 모른다는 뜻이에요.","c":4},"h":"8f5c88a377"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우주에서 식물은 흙이 담긴 화분에서 길러진다.","Veggie의 식물 뿌리는 특수한 고무로 고정된다.","우주 비행사들은 우주에서 식물을 기르는 방법을 아직 찾지 못했다.","LED 조명은 줄기가 아래로 자라게 한다."],"opts":["Plants in space are grown in soil in pots.","Veggie’s plant roots are fixed with a special gum.","Astronauts have not  to grow upward.","게다가, 식물 위에 설치된 LED 조명은 줄기가 위로 자라도록 유도한다."]],"w":"10번에서 식물 위에 설치된(installed) LED 조명이 줄기가 위로(upward) 자라도록 유도한다고 해요.","c":null},"h":"125cb7f647"}]},{"u":4,"id":"hk3-04-3","no":3,"ko":"보이는 게 다가 아니야~","items":[{"n":1,"t":"tf","q":"Each human eye contains as many as 1.6 million nerve fibers.","ko":"인간의 각각의 눈은 무려 160만 개의 신경 섬유를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Each one contains as many as 1.6 million nerve fibers.","각각의 눈은 무려 160만 개의 신경 섬유들을 가지고 있다."]],"w":"2번 문장에 Each one contains as many as 1.6 million nerve fibers라고 나와요. Each one은 각각의 눈이에요.","c":"T"},"h":"6e64ee0b0f"},{"n":2,"t":"tf","q":"There are many nerves in the blind spot, so you can see everything clearly there.","ko":"맹점에는 신경이 많이 있어서 그곳에서는 모든 것을 또렷하게 볼 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4, 6번 문장","s":[[4,"However, there is a tiny spot in each eye that does not have any nerves.","하지만, 각각의 눈에는 조금의 신경도 가지고 있지 않은 작은 지점이 있다."],[6,"You cannot see anything that comes in this area.","당신은 이 영역에 들어오는 것은 아무것도 볼 수 없다."]],"w":"4번에서 맹점은 신경이 조금도 없는 작은 지점이라고 하고, 6번에서 그 영역에 들어오는 것은 아무것도 볼 수 없다고 해요.","c":"F"},"h":"8c1eea0f4a"},{"n":3,"t":"tf","q":"Nerve fibers send signals to your brain.","ko":"신경 섬유들은 당신의 뇌에 신호를 보낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"These fibers send signals to your brain, which processes what you see.","이 섬유들은 당신의 뇌에 신호를 보내는데, 그것은 당신이 보는 것을 처리한다."]],"w":"3번 문장에 These fibers send signals to your brain이라고 나와요.","c":"T"},"h":"68cb1529f6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The human eye is an incredible organ.)","ko":"인간의 눈은 ( ) 기관이다.","opts":["평범한","놀라운","작은","아픈"],"word":"incredible","r":{"a":"2) 놀라운","ev":"1번 문장","s":[[1,"The human eye is an incredible organ.","인간의 눈은 놀라운 기관이다."]],"w":"눈 하나에 신경 섬유가 160만 개나 있다는 이야기가 이어져요(2번). 그래서 incredible은 '놀라운'이라는 뜻이에요.","c":2},"h":"ac653c1841"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Your brain immediately fills in the image...)","ko":"당신의 뇌는 ( ) 그 이미지를
