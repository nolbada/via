shake the cream for only a few seconds.","You should put the lumps of butter in hot water.","Butter does not go bad even if water is left in it.","Your homemade butter is ready once you finish squeezing."],"r":{"a":"4) Your homemade butter is ready once you finish squeezing.","ev":"2번, 9번, 12~13번 문장","s":[[2,"First, fill half a jar with heavy cream and shake it for a long time.","먼저, 유지가 많은 크림으로 병의 반을 채우고 그것을 오랫동안 흔들어라."],[9,"Now place the lumps of butter in a bowl of cold water.","이제 차가운 물이 담긴 그릇에 버터 덩어리를 넣어라."],[12,"If you don’t get all the water out, your butter will quickly go bad.","만약 당신이 물을 모두 나오게 하지 못하면, 당신의 버터는 빠르게 상할 것이다."],[13,"Once you finish squeezing, your homemade butter will be ready!","일단 짜는 것이 끝나면, 손수 만든 버터가 준비될 것이다!"]],"w":"13번에서 짜는 것을 끝내면 손수 만든 버터가 준비된다고 해요. 크림은 오랫동안 흔들고(2번), 덩어리는 차가운 물에 넣고(9번), 물이 남으면 버터가 빨리 상해요(12번).","c":4},"h":"ec4b2a13ae"},{"n":9,"t":"sum","q":"When you shake cream, the fat molecules (A) together and form yellow lumps, which are (B).","ko":"크림을 흔들면 지방 분자들이 서로 (A) 노란 덩어리를 이루는데, 이것이 (B)이다.","oko":["(A) 녹아 / (B) 우유","(A) 붙어 / (B) 크림","(A) 붙어 / (B) 버터","(A) 나뉘어 / (B) 버터","(A) 녹아 / (B) 버터"],"opts":["(A) melt / (B) milk","(A) stick / (B) cream","(A) stick / (B) butter","(A) separate / (B) butter","(A) melt / (B) butter"],"r":{"a":"3) (A) stick / (B) butter","ev":"6~8번 문장","s":[[6,"When you shake it, the fat molecules stick together.","당신이 그것을 흔들면, 지방 분자들은 서로 붙는다."],[7,"Eventually, they will form yellow lumps.","결국, 그것들은 노란 덩어리를 형성할 것이다."],[8,"These lumps are butter.","이 덩어리가 버터이다."]],"w":"6번에서 지방 분자들이 stick together(서로 붙다)하고, 7번에서 노란 덩어리를 만들고, 8번에서 그 덩어리가 butter라고 해요.","c":3},"h":"16994353be"},{"n":10,"t":"fill","q":"Rinse the butter [A] two times, and then squeeze it [B] there is no more water.","ko":"버터를 [A] 두 번 헹구고, 물이 더 이상 없을 [B] 짜라.","bank":["at least","until","bowl","lumps","bad","cold"],"bko":{"at least":"적어도","until":"~할 때까지","bowl":"그릇","lumps":"덩어리","bad":"나쁜, 상한","cold":"차가운"},"r":{"a":"[A] at least, [B] until","ev":"10~11번 문장","s":[[10,"Rinse the butter at least two times in this way.","이런 방법으로 버터를 최소 두 번 헹궈라."],[11,"Finally, take out the butter and squeeze it until there is no more water.","마지막으로 버터를 꺼내 더 이상 물이 없을 때까지 그것을 짜라."]],"w":"10번 Rinse the butter at least two times, 11번 squeeze it until there is no more water에서 가져왔어요. 나머지 단어는 [A]나 [B] 자리에 넣으면 문장이 말이 되지 않아요.","c":null},"h":"e05e3af036"}]},{"u":3,"id":"rj2-03-3","no":3,"ko":"실수가 나쁜 것만은 아니야~","items":[{"n":1,"t":"tf","q":"The guests loved the cake even though it was flat.","ko":"케이크가 납작했지만 손님들은 그것을 아주 좋아했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"So her cake was flat.","그래서 그녀의 케이크는 납작했다."],[6,"She served it to her guests anyway, and they loved it!","그녀는 어쨌든 그것을 자신의 손님들에게 대접했고, 그들은 그것을 아주 좋아했다!"]],"w":"5번에서 케이크가 납작했다고 했고, 6번에서 어쨌든 대접했더니 손님들이 아주 좋아했다고 해요.","c":"T"},"h":"3a85e82f21"},{"n":2,"t":"tf","q":"Baking powder is the ingredient that makes cakes flat.","ko":"베이킹파우더는 케이크를 납작하게 만드는 재료이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Baking powder is the ingredient that makes cakes rise.","베이킹파우더는 케이크를 부풀어 오르게 만드는 재료이다."]],"w":"4번에서 베이킹파우더는 케이크를 부풀어 오르게(rise) 만드는 재료라고 해요. 납작하게 만든다는 말은 반대예요.","c":"F"},"h":"911aeaf26a"},{"n":3,"t":"tf","q":"Tofu is now enjoyed around the world.","ko":"두부는 이제 전 세계에서 즐겨진다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"His parents loved it, and now tofu is enjoyed around the world.","그의 부모님은 그것을 아주 좋아했고, 두부는 이제 전 세계에서 즐겨진다."]],"w":"13번 문장에 now tofu is enjoyed around the world가 그대로 있어요.","c":"T"},"h":"b41d7d17ee"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (According to one story, brownies were invented accidentally by a woman in the United States.)","ko":"한 이야기에 따르면, 브라우니는 미국의 한 여성에 의해 ( ) 발명되었다.","opts":["일부러","우연히","빠르게","몰래"],"word":"accidentally","r":{"a":"2) 우연히","ev":"1~2번 문장","s":[[1,"Some popular foods may have been invented by accident.","어떤 인기 있는 음식들은 우연히 발명되었을 수도 있다."],[2,"According to one story, brownies were invented accidentally by a woman in the United States.","한 이야기에 따르면, 브라우니는 미국의 한 여성에 의해 우연히 발명되었다."]],"w":"1번에서 어떤 음식들은 by accident(우연히) 발명되었을지도 모른다고 하고, 2번에서 같은 뜻으로 accidentally를 써요.","c":2},"h":"4d14324cab"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He made soybean soup, but they complained it was tasteless.)","ko":"그는 콩 수프를 만들었지만, 그들은 그것이 ( ) 불평했다.","opts":["너무 뜨겁다고","너무 짜다고","맛이 없다고","양이 적다고"],"word":"tasteless","r":{"a":"3) 맛이 없다고","ev":"10~11번 문장","s":[[10,"He made soybean soup, but they complained it was tasteless.","그는 콩 수프를 만들었지만, 그들은 그것이 맛이 없다고 불평했다."],[11,"So he added salt and cooked the soup for a few more minutes.","그래서 그는 소금을 넣고 수프를 몇 분 더 조리했다."]],"w":"10번에서 부모님이 불평했고, 11번에서 남자가 소금(salt)을 넣었어요. 소금이 필요했으니 수프는 맛이 없었다는 뜻이에요.","c":3},"h":"7dde5b2118"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey had trouble chewing their food and could only eat soft food.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 음식을 씹는 데 어려움이 있었고 부드러운 음식만 먹을 수 있었다.","opts":["브라우니를 먹은 손님들","그 중국인 남성","그 중국인 남성의 연로한 부모님","미국 여성의 가족"],"r":{"a":"3) 그 중국인 남성의 연로한 부모님","ev":"8~9번 문장","s":[[8,"A Chinese man was cooking for his elderly parents.","한 중국인 남성이 자신의 연로한 부모님을 위해 요리를 하고 있었다."],[9,"They had trouble chewing their food and could only eat soft food.","그들은 음식을 씹는 데 어려움이 있었고 부드러운 음식만 먹을 수 있었다."]],"w":"8번에서 중국인 남성이 his elderly parents(연로한 부모님)를 위해 요리했다고 했어요. 9번의 They는 그 부모님이에요.","c":3},"h":"88b5eb0cc2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"She was trying to bake a chocolate cake, but she forgot to add baking powder.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그녀는 초콜릿 케이크를 구우려고 하고 있었는데, 베이킹파우더를 넣는 것을 잊어버렸다.","opts":["그녀는 베이킹파우더를 사려고 했지만 초콜릿 케이크를 잊어버렸다.","그녀는 초콜릿 케이크를 구웠지만 베이킹파우더를 일부러 넣지 않았다.","그녀는 초콜릿 케이크를 구우려고 했고 베이킹파우더도 넣었다.","그녀는 초콜릿 케이크를 구우려고 했지만 베이킹파우더를 넣는 것을 잊었다."],"r":{"a":"4) 그녀는 초콜릿 케이크를 구우려고 했지만 베이킹파우더를 넣는 것을 잊었다.","ev":"3번 문장","s":[[3,"She was trying to bake a chocolate cake, but she forgot to add baking powder.","그녀는 초콜릿 케이크를 구우려고 하고 있었는데, 그녀는 베이킹파우더를 넣는 것을 잊어버렸다."]],"w":"was trying to bake는 '구우려고 하고 있었다', forgot to add는 '넣는 것을 잊었다'예요. 그래서 5번처럼 케이크가 납작해졌어요.","c":4},"h":"df72b6ca86"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["브라우니는 중국에서 일부러 만들어졌다.","두부는 한 남자가 연로한 부모님을 위해 수프를 만들다가 생겼다.","손님들은 미국 여성의 케이크를 먹지 않았다.","부모님은 콩 수프를 처음부터 맛있다고 했다."],"opts":["Brownies were made on purpose in China.","Tofu came from a man making soup for his elderly parents.","The guests did not eat the American woman's cake.","The parents said the soybean soup was delicious from the start."],"r":{"a":"2) Tofu came from a man making soup for his elderly parents.","ev":"2번, 6번, 8번, 10번, 12번 문장","s":[[2,"According to one story, brownies were invented accidentally by a woman in the United States.","한 이야기에 따르면, 브라우니는 미국의 한 여성에 의해 우연히 발명되었다."],[6,"She served it to her guests anyway, and they loved it!","그녀는 어쨌든 그것을 자신의 손님들에게 대접했고, 그들은 그것을 아주 좋아했다!"],[8,"A Chinese man was cooking for his elderly parents.","한 중국인 남성이 자신의 연로한 부모님을 위해 요리를 하고 있었다."],[10,"He made soybean soup, but they complained it was tasteless.","그는 콩 수프를 만들었지만, 그들은 그것이 맛이 없다고 불평했다."],[12,"When it cooled down, it turned into a delicious soybean jelly.","그것이 식자, 그것은 맛있는 콩 젤리로 변했다."]],"w":"8번과 10~12번에서 남자가 부모님을 위해 만든 콩 수프가 식어 두부가 되었어요. 브라우니는 미국 여성이 우연히 발명했고(2번), 손님들은 케이크를 아주 좋아했고(6번), 부모님은 처음에 맛이 없다고 불평했어요(10번).","c":2},"h":"b4be632480"},{"n":9,"t":"sum","q":"Some popular foods were invented by (A). Both the flat cake and the soybean soup became foods that people (B).","ko":"어떤 인기 있는 음식들은 (A)로 발명되었다. 납작한 케이크와 콩 수프는 모두 사람들이 (B) 음식이 되었다.","oko":["(A) 우연 / (B) 싫어하는","(A) 계획 / (B) 아주 좋아하는","(A) 우연 / (B) 미워하는","(A) 계획 / (B) 잊어버린","(A) 우연 / (B) 아주 좋아하는"],"opts":["(A) accident / (B) disliked","(A) plan / (B) loved","(A) accident / (B) hated","(A) plan / (B) forgot","(A) accident / (B) loved"],"r":{"a":"5) (A) accident / (B) loved","ev":"1번, 6번, 13번 문장","s":[[1,"Some popular foods may have been invented by accident.","어떤 인기 있는 음식들은 우연히 발명되었을 수도 있다."],[6,"She served it to her guests anyway, and they loved it!","그녀는 어쨌든 그것을 자신의 손님들에게 대접했고, 그들은 그것을 아주 좋아했다!"],[13,"His parents loved it, and now tofu is enjoyed around the world.","그의 부모님은 그것을 아주 좋아했고, 두부는 이제 전 세계에서 즐겨진다."]],"w":"1번에서 어떤 음식들은 by accident(우연히) 발명되었다고 하고, 6번에서 손님들이 케이크를 loved, 13번에서 부모님도 loved(두부는 전 세계에서 즐겨짐)라고 해요.","c":5},"h":"be85a58fc0"},{"n":10,"t":"fill","q":"He added [A] and cooked the soup, and when it cooled down, it [B] into a delicious soybean jelly.","ko":"그는 [A]을 넣고 수프를 조리했고, 수프가 식자 맛있는 콩 젤리로 [B].","bank":["salt","turned","parents","tasteless","invented","accident"],"bko":{"salt":"소금","turned":"변했다","parents":"부모님","tasteless":"맛없는","invented":"발명했다","accident":"우연, 사고"},"r":{"a":"[A] salt, [B] turned","ev":"11~12번 문장","s":[[11,"So he added salt and cooked the soup for a few more minutes.","그래서 그는 소금을 넣고 수프를 몇 분 더 조리했다."],[12,"When it cooled down, it turned into a delicious soybean jelly.","그것이 식자, 그것은 맛있는 콩 젤리로 변했다."]],"w":"11번 So he added salt and cooked the soup, 12번 it turned into a delicious soybean jelly에서 가져왔어요. 나머지 단어는 [A]나 [B]에 넣으면 문장이 되지 않아요.","c":null},"h":"eee2fae9ef"}]},{"u":3,"id":"rj2-03-4","no":4,"ko":"식당 인테리어에 이런 비밀이!","items":[{"n":1,"t":"tf","q":"Almost all fast-food restaurants use red and yellow.","ko":"거의 모든 패스트푸드 식당들은 빨간색과 노란색을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Almost all fast-food restaurants use red and yellow.","거의 모든 패스트푸드 식당들은 빨간색과 노란색을 사용한다."]],"w":"4번 문장에 Almost all fast-food restaurants use red and yellow가 그대로 있어요.","c":"T"},"h":"c337cecd23"},{"n":2,"t":"tf","q":"People think that cool colors make people eat more.","ko":"사람들은 한색이 사람들을 더 먹게 만든다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"People think that cool colors, such as blue and green, reduce their appetite by making them calm.","사람들은 파란색이나 녹색 같은 한색들이 그들을 차분하게 만들어서 그들의 식욕을 줄인다고 생각한다."]],"w":"8번에서 사람들은 한색이 사람들을 차분하게 만들어서 식욕을 줄인다(reduce their appetite)고 생각해요. 더 먹게 한다는 말은 반대예요.","c":"F"},"h":"d761ddc02e"},{"n":3,"t":"tf","q":"Green is used in restaurants that sell fresh, healthy food.","ko":"녹색은 신선하고 건강에 좋은 음식을 파는 식당들에서 사용된다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"So green is used in restaurants that sell fresh, healthy food.","그래서 녹색은 신선하고 건강에 좋은 음식을 파는 식당들에서 사용된다."]],"w":"12번 문장에 So green is used in restaurants that sell fresh, healthy food가 그대로 있어요.","c":"T"},"h":"48bb5f8fa6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (People think that cool colors, such as blue and green, reduce their appetite by making them calm.)","ko":"사람들은 파란색이나 녹색 같은 한색들이 그들을 차분하게 만들어서 그들의 식욕을 ( ) 생각한다.","opts":["늘린다","줄인다","바꾼다","잊게 한다"],"word":"reduce","r":{"a":"2) 줄인다","ev":"6번, 8번 문장","s":[[6,"Studies show that warm colors make people excited and cause them to eat more!","연구들은 난색들이 사람들을 들뜨게 만들고 그들이 더 많이 먹게 한다는 것을 보여준다!"],[8,"People think that cool colors, such as blue and green, reduce their appetite by making them calm.","사람들은 파란색이나 녹색 같은 한색들이 그들을 차분하게 만들어서 그들의 식욕을 줄인다고 생각한다."]],"w":"6번에서 난색은 더 먹게 한다고 했어요. 8번의 한색은 차분하게 만드는 색이라 반대로 식욕을 '줄인다'는 뜻이에요.","c":2},"h":"0fc24bf29d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, green is actually linked to food.)","ko":"하지만, 녹색은 사실 음식과 ( ).","opts":["연결된다","싸운다","떨어져 있다","섞인다"],"word":"linked","r":{"a":"1) 연결된다","ev":"9~11번 문장","s":[[9,"However, green is actually linked to food.","하지만, 녹색은 사실 음식과 연결된다."],[10,"People think of green as the color of nature and freshness.","사람들은 녹색을 자연과 신선함의 색이라고 생각한다."],[11,"This makes it the color of healthy, clean food.","이것은 그것(녹색)을 건강에 좋고 깨끗한 음식의 색으로 만든다."]],"w":"9번 뒤의 10~11번에서 녹색을 자연과 신선함의 색, 건강에 좋은 음식의 색으로 생각한다고 해요. 그래서 녹색은 음식과 '연결되어' 있어요.","c":1},"h":"15eda2f719"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis makes it the color of healthy, clean food.","ko":"밑줄 친 it이 가리키는 것은?","sko":"이것은 그것을 건강에 좋고 깨끗한 음식의 색으로 만든다.","opts":["빨간색","식욕","녹색","패스트푸드 식당"],"r":{"a":"3) 녹색","ev":"9~11번 문장","s":[[9,"However, green is actually linked to food.","하지만, 녹색은 사실 음식과 연결된다."],[10,"People think of green as the color of nature and freshness.","사람들은 녹색을 자연과 신선함의 색이라고 생각한다."],[11,"This makes it the color of healthy, clean food.","이것은 그것(녹색)을 건강에 좋고 깨끗한 음식의 색으로 만든다."]],"w":"9번과 10번에서 계속 green(녹색)을 이야기해요. 11번의 it은 green이고, 녹색이 건강에 좋은 음식의 색이 된다는 뜻이에요.","c":3},"h":"38c4d81114"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So fast-food restaurants use these colors to make people eat a lot.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 패스트푸드 식당들은 사람들이 많이 먹게 만들기 위해 이러한 색들을 사용한다.","opts":["패스트푸드 식당들은 사람들이 음식을 적게 먹게 하려고 이러한 색들을 사용한다.","사람들은 많은 색을 사용하는 패스트푸드 식당을 좋아한다.","패스트푸드 식당들은 이러한 색들을 사용하지 않는다.","패스트푸드 식당들은 사람들이 많이 먹게 하려고 이러한 색들을 사용한다."],"r":{"a":"4) 패스트푸드 식당들은 사람들이 많이 먹게 하려고 이러한 색들을 사용한다.","ev":"7번 문장","s":[[7,"So fast-food restaurants use these colors to make people eat a lot.","그래서 패스트푸드 식당들은 사람들이 많이 먹게 만들기 위해 이러한 색들을 사용한다."]],"w":"to make people eat a lot는 '사람들이 많이 먹게 하려고'라는 목적이에요. 6번에서 난색이 더 먹게 한다고 했으니 식당은 그 색들을 일부러 써요.","c":4},"h":"1bfdad1ef3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["패스트푸드 식당들은 대부분 파란색과 녹색을 사용한다.","난색은 사람들을 들뜨게 하고 더 먹게 만들 수 있다.","한색은 사람들을 더 들뜨고 배고프게 만든다.","녹색은 음식과 전혀 연결되지 않는다."],"opts":["Fast-food restaurants mostly use blue and green.","Warm colors can make people excited and eat more.","Cool colors make people more excited and hungry.","Green is never linked to food."],"r":{"a":"2) Warm colors can make people excited and eat more.","ev":"4번, 6번, 8~9번 문장","s":[[4,"Almost all fast-food restaurants use red and yellow.","거의 모든 패스트푸드 식당들은 빨간색과 노란색을 사용한다."],[6,"Studies show that warm colors make people excited and cause them to eat more!","연구들은 난색들이 사람들을 들뜨게 만들고 그들이 더 많이 먹게 한다는 것을 보여준다!"],[8,"People think that cool colors, such as blue and green, reduce their appetite by making them calm.","사람들은 파란색이나 녹색 같은 한색들이 그들을 차분하게 만들어서 그들의 식욕을 줄인다고 생각한다."],[9,"However, green is actually linked to food.","하지만, 녹색은 사실 음식과 연결된다."]],"w":"6번에서 난색은 사람들을 들뜨게 하고 더 먹게 해요. 패스트푸드 식당은 빨간색과 노란색을 쓰고(4번), 한색은 식욕을 줄이며(8번), 녹색은 사실 음식과 연결돼요(9번).","c":2},"h":"6b0656c191"},{"n":9,"t":"sum","q":"Warm colors make people excited and (A), so fast-food restaurants use them. People think cool colors reduce appetite by making them (B).","ko":"난색은 사람들을 들뜨게 하고 (A) 만들어서 패스트푸드 식당들이 사용한다. 사람들은 한색이 그들을 (B) 만들어서 식욕을 줄인다고 생각한다.","oko":["(A) 덜 먹게 / (B) 차분하게","(A) 더 먹게 / (B) 들뜨게","(A) 덜 먹게 / (B) 들뜨게","(A) 더 먹게 / (B) 피곤하게","(A) 더 먹게 / (B) 차분하게"],"opts":["(A) eat less / (B) calm","(A) eat more / (B) excited","(A) eat less / (B) excited","(A) eat more / (B) tired","(A) eat more / (B) calm"],"r":{"a":"5) (A) eat more / (B) calm","ev":"6~8번 문장","s":[[6,"Studies show that warm colors make people excited and cause them to eat more!","연구들은 난색들이 사람들을 들뜨게 만들고 그들이 더 많이 먹게 한다는 것을 보여준다!"],[7,"So fast-food restaurants use these colors to make people eat a lot.","그래서 패스트푸드 식당들은 사람들이 많이 먹게 만들기 위해 이러한 색들을 사용한다."],[8,"People think that cool colors, such as blue and green, reduce their appetite by making them calm.","사람들은 파란색이나 녹색 같은 한색들이 그들을 차분하게 만들어서 그들의 식욕을 줄인다고 생각한다."]],"w":"6번에서 난색은 사람들을 들뜨게 하고 더 먹게(eat more) 하고, 7번에서 그래서 식당들이 그 색을 써요. 8번에서 한색은 사람들을 차분하게(calm) 만들어 식욕을 줄여요.","c":5},"h":"052f1cb9dd"},{"n":10,"t":"fill","q":"People think of green as the color of [A] and freshness. So green is used in restaurants that sell [B], healthy food.","ko":"사람들은 녹색을 [A]과 신선함의 색이라고 생각한다. 그래서 녹색은 [B], 건강에 좋은 음식을 파는 식당들에서 사용된다.","bank":["nature","fresh","excited","hungry","reduce","linked"],"bko":{"nature":"자연","fresh":"신선한","excited":"들뜬","hungry":"배고픈","reduce":"줄이다","linked":"연결된"},"r":{"a":"[A] nature, [B] fresh","ev":"10번, 12번 문장","s":[[10,"People think of green as the color of nature and freshness.","사람들은 녹색을 자연과 신선함의 색이라고 생각한다."],[12,"So green is used in restaurants that sell fresh, healthy food.","그래서 녹색은 신선하고 건강에 좋은 음식을 파는 식당들에서 사용된다."]],"w":"10번 the color of nature and freshness, 12번 restaurants that sell fresh, healthy food에서 가져왔어요. 나머지 단어는 [A]나 [B] 자리에 넣으면 문장이 되지 않아요.","c":null},"h":"2a0488607f"}]},{"u":4,"id":"rj2-04-1","no":1,"ko":"4초면 충분해요","items":[{"n":1,"t":"tf","q":"A chinstrap penguin has more than 10,000 microsleeps each day.","ko":"턱끈펭귄은 매일 10,000번 넘게 마이크로 수면을 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Chinstraps have more than 10,000 microsleeps each day.","턱끈펭귄은 매일 10,000번 넘게 마이크로 수면을 한다."]],"w":"6번 문장에 Chinstraps have more than 10,000 microsleeps each day가 그대로 있어요.","c":"T"},"h":"635d49ca59"},{"n":2,"t":"tf","q":"A chinstrap penguin's microsleep lasts for about four minutes.","ko":"턱끈펭귄의 마이크로 수면은 약 4분 동안 지속된다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"They sleep for very short periods, about four seconds.","그들은 약 4초 정도의 매우 짧은 시간 동안 잠을 잔다."]],"w":"4번에서 마이크로 수면은 about four seconds, 즉 약 4초라고 해요. 4분이 아니에요.","c":"F"},"h":"b0288e5438"},{"n":3,"t":"tf","q":"Brown skuas want to eat the eggs or babies of chinstrap penguins.","ko":"갈색 도둑갈매기는 턱끈펭귄의 알이나 새끼를 먹고 싶어 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"This is because birds called brown skuas want to eat them.","이것은 갈색 도둑갈매기라고 불리는 새들이 그것들을 먹고 싶어 하기 때문이다."]],"w":"11번에서 birds called brown skuas want to eat them이라고 했고, them은 알이나 새끼예요(10번).","c":"T"},"h":"c3f5a8788d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These animals survive in Antarctica's difficult conditions with an unusual sleep pattern.)","ko":"이 동물들은 남극의 어려운 환경에서 특이한 수면 패턴으로 ( ).","opts":["살아남는다","도망친다","잠든다","사냥한다"],"word":"survive","r":{"a":"1) 살아남는다","ev":"3번 문장","s":[[3,"These animals survive in Antarctica’s difficult conditions with an unusual sleep pattern.","이 동물들은 남극의 어려운 환경에서 특이한 수면 패턴으로 생존한다."]],"w":"3번은 어려운 환경에서 특이한 수면 패턴으로 버틴다는 문장이에요. 그래서 survive는 '살아남다'예요.","c":1},"h":"a2773b261b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The other parent must protect the eggs or babies at all times.)","ko":"다른 부모는 항상 알이나 새끼를 ( ).","opts":["먹어야 한다","보호해야 한다","버려야 한다","찾아야 한다"],"word":"protect","r":{"a":"2) 보호해야 한다","ev":"10~11번 문장","s":[[10,"The other parent must protect the eggs or babies at all times.","다른 부모는 항상 알이나 새끼를 보호해야 한다."],[11,"This is because birds called brown skuas want to eat them.","이것은 갈색 도둑갈매기라고 불리는 새들이 그것들을 먹고 싶어 하기 때문이다."]],"w":"11번에서 갈색 도둑갈매기가 알과 새끼를 먹고 싶어 한다고 해요. 그래서 다른 부모는 알과 새끼를 '보호해야' 해요.","c":2},"h":"ee6897eaa7"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThis is because birds called brown skuas want to eat them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이것은 갈색 도둑갈매기라고 불리는 새들이 그것들을 먹고 싶어 하기 때문이다.","opts":["갈색 도둑갈매기들","펭귄의 부모들","알이나 새끼","낮과 밤"],"r":{"a":"3) 알이나 새끼","ev":"10~11번 문장","s":[[10,"The other parent must protect the eggs or babies at all times.","다른 부모는 항상 알이나 새끼를 보호해야 한다."],[11,"This is because birds called brown skuas want to eat them.","이것은 갈색 도둑갈매기라고 불리는 새들이 그것들을 먹고 싶어 하기 때문이다."]],"w":"10번에서 다른 부모가 보호해야 하는 것은 the eggs or babies(알이나 새끼)예요. 11번에서 도둑갈매기가 먹고 싶어 하는 them이 바로 그것들이에요.","c":3},"h":"afbc2bc47c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, it is not easy to be awake for 24 hours a day.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 하루에 24시간 동안 깨어 있는 것은 쉽지 않다.","opts":["하루에 24시간 잠을 자는 것은 쉽지 않다.","24시간마다 깨어나는 것은 매우 쉽다.","하루 24시간 동안 먹이를 사냥하는 것은 쉽다.","하루에 24시간 동안 깨어 있는 것은 쉽지 않다."],"r":{"a":"4) 하루에 24시간 동안 깨어 있는 것은 쉽지 않다.","ev":"12번 문장","s":[[12,"However, it is not easy to be awake for 24 hours a day.","하지만, 하루에 24시간 동안 깨어 있는 것은 쉽지 않다."]],"w":"it은 가주어이고 to be awake for 24 hours a day가 진짜 주어예요. be awake는 '깨어 있다'이고, not easy라서 쉽지 않다는 뜻이에요.","c":4},"h":"31e629be00"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["턱끈펭귄은 한 번에 약 4시간씩 잔다.","턱끈펭귄의 마이크로 수면은 합쳐서 하루 약 11시간이 된다.","턱끈펭귄의 이름은 길고 노란 부리에서 왔다.","알을 낳은 뒤 두 부모가 함께 먹이를 사냥하러 간다."],"opts":["Chinstrap penguins sleep for about four hours at a time.","Chinstrap penguins' microsleeps add up to around 11 hours of sleep a day.","A chinstrap penguin's name comes from its long yellow beak.","Both parents go hunting for food together after the eggs are laid."],"r":{"a":"2) Chinstrap penguins' microsleeps add up to around 11 hours of sleep a day.","ev":"2번, 4번, 7번, 9~10번 문장","s":[[2,"Their name comes from the thin black line that runs under their chin.","그들의 이름은 턱 밑으로 이어지는 가는 검은 선에서 유래한다."],[4,"They sleep for very short periods, about four seconds.","그들은 약 4초 정도의 매우 짧은 시간 동안 잠을 잔다."],[7,"These add up to around 11 hours of sleep.","이것들은 결국 약 11시간의 수면 시간이 된다."],[9,"After the chinstrap penguins lay their eggs, one parent goes hunting for food.","턱끈펭귄이 알을 낳은 후, 한 부모는 먹이를 사냥하러 간다."],[10,"The other parent must protect the eggs or babies at all times.","다른 부모는 항상 알이나 새끼를 보호해야 한다."]],"w":"7번에서 마이크로 수면이 합쳐서 약 11시간이 돼요. 한 번에 약 4초(4번)이고, 이름은 턱 밑의 가는 검은 선에서 왔고(2번), 한 부모만 사냥하러 가요(9~10번).","c":2},"h":"f29760814c"},{"n":9,"t":"sum","q":"While one chinstrap parent goes (A) for food, the other must (B) the eggs or babies from brown skuas.","ko":"한 부모가 먹이를 (A) 가는 동안, 다른 부모는 갈색 도둑갈매기로부터 알이나 새끼를 (B)해야 한다.","oko":["(A) 자러 / (B) 먹","(A) 사냥하러 / (B) 먹","(A) 자러 / (B) 보호","(A) 헤엄치러 / (B) 잃","(A) 사냥하러 / (B) 보호"],"opts":["(A) sleeping / (B) eat","(A) hunting / (B) eat","(A) sleeping / (B) protect","(A) swimming / (B) lose","(A) hunting / (B) protect"],"r":{"a":"5) (A) hunting / (B) protect","ev":"9~11번 문장","s":[[9,"After the chinstrap penguins lay their eggs, one parent goes hunting for food.","턱끈펭귄이 알을 낳은 후, 한 부모는 먹이를 사냥하러 간다."],[10,"The other parent must protect the eggs or babies at all times.","다른 부모는 항상 알이나 새끼를 보호해야 한다."],[11,"This is because birds called brown skuas want to eat them.","이것은 갈색 도둑갈매기라고 불리는 새들이 그것들을 먹고 싶어 하기 때문이다."]],"w":"9번에서 한 부모는 먹이를 사냥하러 가고(hunting), 10번에서 다른 부모는 알이나 새끼를 보호해야(protect) 해요. 11번에서 도둑갈매기가 그것들을 먹고 싶어 하기 때문이에요.","c":5},"h":"950a2087e8"},{"n":10,"t":"fill","q":"Chinstraps have more than 10,000 [A] each day, and these add up to around 11 [B] of sleep.","ko":"턱끈펭귄은 매일 10,000번 넘게 [A]를 하고, 이것들은 결국 약 11 [B]의 수면 시간이 된다.","bank":["microsleeps","hours","eggs","parents","babies","skuas"],"bko":{"microsleeps":"마이크로 수면","hours":"시간","eggs":"알","parents":"부모","babies":"새끼","skuas":"도둑갈매기"},"r":{"a":"[A] microsleeps, [B] hours","ev":"6~7번 문장","s":[[6,"Chinstraps have more than 10,000 microsleeps each day.","턱끈펭귄은 매일 10,000번 넘게 마이크로 수면을 한다."],[7,"These add up to around 11 hours of sleep.","이것들은 결국 약 11시간의 수면 시간이 된다."]],"w":"6번 more than 10,000 microsleeps each day, 7번 around 11 hours of sleep에서 가져왔어요. 나머지 단어는 하루에 10,000번 하는 것이나 수면 시간의 단위로 말이 되지 않아요.","c":null},"h":"9f9943cd68"}]},{"u":4,"id":"rj2-04-2","no":2,"ko":"어질어질 꽃 냄새","items":[{"n":1,"t":"tf","q":"We can find the titan arum in Indonesia.","ko":"우리는 titan arum을 인도네시아에서 발견할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"We can find the titan arum in Indonesia.","우리는 titan arum을 인도네시아에서 발견할 수 있다."]],"w":"3번 문장에 We can find the titan arum in Indonesia가 그대로 있어요.","c":"T"},"h":"7037f20566"},{"n":2,"t":"tf","q":"The titan arum blooms more often than other flowers.","ko":"titan arum은 다른 꽃들보다 더 자주 꽃을 피운다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It does not bloom as often as other flowers.","그것은 다른 꽃들만큼 자주 꽃을 피우지 않는다."]],"w":"7번에서 titan arum은 다른 꽃들만큼 자주 꽃을 피우지 않는다(does not bloom as often as other flowers)고 해요. 더 자주 핀다는 말은 반대예요.","c":"F"},"h":"8e53080f66"},{"n":3,"t":"tf","q":"The insects lay their eggs in the flower.","ko":"그 곤충들은 그 꽃 안에 알을 낳는다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"The insects even lay their eggs in the flower.","그 곤충들은 심지어 그 꽃 안에 알도 낳는다."]],"w":"13번 문장에 The insects even lay their eggs in the flower가 있어요.","c":"T"},"h":"55ea978f77"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It does not bloom as often as other flowers.)","ko":"그것은 다른 꽃들만큼 자주 ( ) 않는다.","opts":["꽃을 피우지","자라지","시들지","냄새가 나지"],"word":"bloom","r":{"a":"1) 꽃을 피우지","ev":"7~8번 문장","s":[[7,"It does not bloom as often as other flowers.","그것은 다른 꽃들만큼 자주 꽃을 피우지 않는다."],[8,"And when it does, it does not have a sweet smell.","그리고 그것이 필 때, 그것은 달콤한 향기를 가지고 있지 않다."]],"w":"7번은 꽃이 자주 피지 않는다는 말이고, 8번에서 when it does(그것이 필 때)라고 이어져요. 그래서 bloom은 '꽃을 피우다'예요.","c":1},"h":"6d94f80aad"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (People say that it smells like rotting meat.)","ko":"사람들은 그것이 ( ) 고기 같은 냄새가 난다고 말한다.","opts":["신선한","썩어가는","구운","얼린"],"word":"rotting","r":{"a":"2) 썩어가는","ev":"9~11번 문장","s":[[9,"Actually, it smells terrible!","사실, 그것은 끔찍한 냄새가 난다!"],[10,"People say that it smells like rotting meat.","사람들은 그것이 썩어가는 고기 같은 냄새가 난다고 말한다."],[11,"This is why it is sometimes called the “corpse flower.”","이것이 그것(titan arum)이 때때로 ‘시체꽃’이라고 불리는 이유이다."]],"w":"9번에서 냄새가 끔찍하다고 했고, 11번에서 그래서 시체꽃이라고 불린다고 해요. 끔찍한 냄새가 나는 고기는 '썩어가는' 고기예요.","c":2},"h":"07e263f380"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is why it is sometimes called the “corpse flower.”","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 그것이 때때로 ‘시체꽃’이라고 불리는 이유이다.","opts":["그것이 인도네시아에서 발견되는 것","그것이 썩어가는 고기 같은 냄새가 난다는 것","그것이 하루에 10센티미터까지 자라는 것","그것이 다른 꽃들만큼 자주 피지 않는 것"],"r":{"a":"2) 그것이 썩어가는 고기 같은 냄새가 난다는 것","ev":"10~11번 문장","s":[[10,"People say that it smells like rotting meat.","사람들은 그것이 썩어가는 고기 같은 냄새가 난다고 말한다."],[11,"This is why it is sometimes called the “corpse flower.”","이것이 그것(titan arum)이 때때로 ‘시체꽃’이라고 불리는 이유이다."]],"w":"This is why ~ 앞에는 이유가 나와요. 바로 앞 10번에서 썩어가는 고기 같은 냄새가 난다고 했고, 그래서 시체꽃이라고 불려요.","c":2},"h":"ae9c948af7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"To make matters worse, its bad smell can draw some insects like beetles and flies.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"설상가상으로, 그것의 나쁜 냄새는 딱정벌레나 파리 같은 곤충들을 끌 수 있다.","opts":["더 나쁜 일은, 그 냄새가 곤충들을 쫓아낸다는 것이다.","나쁜 냄새 때문에 딱정벌레와 파리가 더 이상 오지 못한다.","좋은 소식은, 그 냄새가 곤충들을 막아 준다는 것이다.","설상가상으로, 그 고약한 냄새가 딱정벌레나 파리 같은 곤충들을 불러들일 수 있다."],"r":{"a":"4) 설상가상으로, 그 고약한 냄새가 딱정벌레나 파리 같은 곤충들을 불러들일 수 있다.","ev":"12번 문장","s":[[12,"To make matters worse, its bad smell can draw some insects like beetles and flies.","설상가상으로, 그것의 나쁜 냄새는 딱정벌레나 파리 같은 곤충들을 끌 수 있다."]],"w":"to make matters worse는 '설상가상으로'이고, draw는 '끌어들이다'예요. 나쁜 냄새가 곤충들을 불러 모아 문제가 더 커진다는 뜻이에요.","c":4},"h":"058b1c3444"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["titan arum은 세계에서 가장 키가 작은 꽃이다.","titan arum은 하루에 10미터까지 자랄 수 있다.","titan arum은 필 때 달콤한 향기가 난다.","titan arum은 다 자라면 보통 키가 약 3미터이다."],"opts":["The titan arum is the shortest flower in the world.","The titan arum can grow up to 10 meters in one day.","The titan arum has a sweet smell when it blooms.","The titan arum is usually around 3 meters tall when it finishes growing."],"r":{"a":"4) The titan arum is usually around 3 meters tall when it finishes growing.","ev":"4~6번, 8번 문장","s":[[4,"It is one of the tallest flowers in the world.","그것은 세계에서 가장 키가 큰 꽃들 중 하나이다."],[5,"It can grow up to 10 centimeters in one day!","그것은 하루 사이에 10센티미터까지 자랄 수 있다!"],[6,"When the titan arum finishes growing, it is usually around 3 meters tall.","titan arum이 성장하는 것을 끝낼 때, 그것은 보통 키가 약 3미터이다."],[8,"And when it does, it does not have a sweet smell.","그리고 그것이 필 때, 그것은 달콤한 향기를 가지고 있지 않다."]],"w":"6번에서 다 자라면 보통 약 3미터라고 해요. 4번에서 가장 키가 큰 꽃들 중 하나이고, 5번에서 하루에 자라는 길이는 10미터가 아니라 10센티미터이며, 8번에서 달콤한 향기가 없어요.","c":4},"h":"d47c699563"},{"n":9,"t":"sum","q":"The bad smell of the titan arum can (A) insects like beetles and flies, and the insects even (B) their eggs in the flower.","ko":"titan arum의 나쁜 냄새는 딱정벌레나 파리 같은 곤충들을 (A) 수 있고, 그 곤충들은 심지어 꽃 안에 알도 (B).","oko":["(A) 끌 / (B) 먹는다","(A) 겁주어 쫓을 / (B) 낳는다","(A) 끌 / (B) 잃어버린다","(A) 겁주어 쫓을 / (B) 숨긴다","(A) 끌 / (B) 낳는다"],"opts":["(A) draw / (B) eat","(A) scare / (B) lay","(A) draw / (B) lose","(A) scare / (B) hide","(A) draw / (B) lay"],"r":{"a":"5) (A) draw / (B) lay","ev":"12~13번 문장","s":[[12,"To make matters worse, its bad smell can draw some insects like beetles and flies.","설상가상으로, 그것의 나쁜 냄새는 딱정벌레나 파리 같은 곤충들을 끌 수 있다."],[13,"The insects even lay their eggs in the flower.","그 곤충들은 심지어 그 꽃 안에 알도 낳는다."]],"w":"12번에서 나쁜 냄새가 곤충들을 draw(끌어들이다)하고, 13번에서 곤충들이 꽃 안에 알을 lay(낳다)한다고 해요.","c":5},"h":"d546b4c4fb"},{"n":10,"t":"fill","q":"It is one of the [A] flowers in the world, and it can grow up to 10 centimeters in one [B]!","ko":"그것은 세계에서 가장 [A] 꽃들 중 하나이고, 한 [B] 사이에 10센티미터까지 자랄 수 있다!","bank":["tallest","day","eggs","insects","smells","beetles"],"bko":{"tallest":"가장 키가 큰","day":"하루, 날","eggs":"알","insects":"곤충들","smells":"냄새가 나다","beetles":"딱정벌레들"},"r":{"a":"[A] tallest, [B] day","ev":"4~5번 문장","s":[[4,"It is one of the tallest flowers in the world.","그것은 세계에서 가장 키가 큰 꽃들 중 하나이다."],[5,"It can grow up to 10 centimeters in one day!","그것은 하루 사이에 10센티미터까지 자랄 수 있다!"]],"w":"4번 one of the tallest flowers in the world, 5번 grow up to 10 centimeters in one day에서 가져왔어요. 나머지 단어는 [A]나 [B] 자리에 넣으면 문장이 되지 않아요.","c":null},"h":"ab636acb2a"}]},{"u":4,"id":"rj2-04-3","no":3,"ko":"무지개색으로 빛나는 해변","items":[{"n":1,"t":"tf","q":"In 1967, the government stopped people from throwing their trash on the beach.","ko":"1967년에, 정부는 사람들이 해변에 쓰레기를 버리는 것을 막았다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In 1967, the government stopped people from throwing their trash there.","1967년에, 정부는 사람들이 그곳에 쓰레기를 버리는 것을 막았다."]],"w":"3번 문장에 In 1967, the government stopped people from throwing their trash there가 있고, there는 해변이에요.","c":"T"},"h":"2a94eefbaa"},{"n":2,"t":"tf","q":"The ocean's waves broke the glass into big rough pieces.","ko":"바다의 파도가 유리를 크고 거친 조각들로 부수었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Over the years, the ocean’s waves broke down the glass and made it into tiny smooth pieces that look like jewelry.","수년간, 바다의 파도가 유리를 부수고 그것을 보석처럼 보이는 아주 작고 매끄러운 조각들로 만들었다."]],"w":"8번에서 파도가 유리를 tiny smooth pieces(아주 작고 매끄러운 조각들)로 만들었다고 해요. 크고 거친 조각이 아니에요.","c":"F"},"h":"a815ea41b8"},{"n":3,"t":"tf","q":"Many people now want to visit Glass Beach.","ko":"많은 사람들이 이제 Glass Beach를 방문하고 싶어 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Unlike in the past, it is now a beautiful place that many people want to visit!","과거와는 달리, 그곳은 이제 많은 사람들이 방문하고 싶어 하는 아름다운 장소이다!"]],"w":"11번에서 it is now a beautiful place that many people want to visit이라고 해요. it은 Glass Beach예요.","c":"T"},"h":"e2585266b6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, one big problem remained: how to get rid of the small pieces of glass covering the beach.)","ko":"하지만, 한 가지 큰 문제가 ( ): 해변을 덮고 있는 작은 유리 조각들을 어떻게 제거할 것인가.","opts":["사라졌다","생겼다","남아 있었다","끝났다"],"word":"remained","r":{"a":"3) 남아 있었다","ev":"5~6번 문장","s":[[5,"Most of the trash was removed.","대부분의 쓰레기는 치워졌다."],[6,"However, one big problem remained: how to get rid of the small pieces of glass covering the beach.","하지만, 한 가지 큰 문제가 남아 있었는데, 해변을 덮고 있는 작은 유리 조각들을 어떻게 제거할 것인가 하는 것이었다."]],"w":"5번에서 대부분의 쓰레기가 치워졌다고 했고, 6번은 However로 반대되는 내용이에요. 그래서 큰 문제가 '남아 있었다'예요.","c":3},"h":"c99e685363"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They made the beach sparkle with all the colors of the rainbow!)","ko":"그것들은 해변이 무지개의 모든 색으로 ( ) 했다!","opts":["어두워지게","반짝이게","사라지게","흔들리게"],"word":"sparkle","r":{"a":"2) 반짝이게","ev":"8~9번 문장","s":[[8,"Over the years, the ocean’s waves broke down the glass and made it into tiny smooth pieces that look like jewelry.","수년간, 바다의 파도가 유리를 부수고 그것을 보석처럼 보이는 아주 작고 매끄러운 조각들로 만들었다."],[9,"They made the beach sparkle with all the colors of the rainbow!","그것들은 해변이 무지개의 모든 색으로 반짝이게 했다!"]],"w":"8번에서 유리가 보석처럼 보이는 조각이 되었고, 9번에서 무지개의 모든 색을 낸다고 해요. 보석 같은 조각들이 빛나니 sparkle은 '반짝이다'예요.","c":2},"h":"cd0c9c9cb0"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nUnlike in the past, it is now a beautiful place that many people want to visit!","ko":"밑줄 친 it이 가리키는 것은?","sko":"과거와는 달리, 그곳은 이제 많은 사람들이 방문하고 싶어 하는 아름다운 장소이다!","opts":["1967년","캘리포니아의 정부","Glass Beach","작은 유리 조각"],"r":{"a":"3) Glass Beach","ev":"10~11번 문장","s":[[10,"Today, this place is known as Glass Beach.","오늘날, 이 장소는 Glass Beach로 알려져 있다."],[11,"Unlike in the past, it is now a beautiful place that many people want to visit!","과거와는 달리, 그곳은 이제 많은 사람들이 방문하고 싶어 하는 아름다운 장소이다!"]],"w":"10번에서 this place는 Glass Beach로 알려져 있다고 했어요. 11번의 it은 그 장소, 즉 Glass Beach예요.","c":3},"h":"525447d7aa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Surprisingly, Mother Nature took care of the problem by herself.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"놀랍게도, 대자연은 그 문제를 혼자 처리했다.","opts":["놀랍게도, 정부가 그 문제를 혼자 처리했다.","놀랍게도, 사람들이 대자연을 돌보았다.","놀랍게도, 대자연은 그 문제를 외면했다.","놀랍게도, 대자연이 스스로 그 문제를 처리했다."],"r":{"a":"4) 놀랍게도, 대자연이 스스로 그 문제를 처리했다.","ev":"6~7번 문장","s":[[6,"However, one big problem remained: how to get rid of the small pieces of glass covering the beach.","하지만, 한 가지 큰 문제가 남아 있었는데, 해변을 덮고 있는 작은 유리 조각들을 어떻게 제거할 것인가 하는 것이었다."],[7,"Surprisingly, Mother Nature took care of the problem by herself.","놀랍게도, 대자연은 그 문제를 혼자 처리했다."]],"w":"take care of the problem은 '그 문제를 처리하다'이고, by herself는 '혼자서'예요. the problem은 6번의 유리 조각 문제이고, 처리한 것은 정부가 아니라 대자연이에요.","c":4},"h":"5facb4e537"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파도가 유리를 아주 작고 매끄러운 조각들로 만들었다.","그 해변은 늘 아름다운 곳이었다.","정부는 해변의 쓰레기를 그대로 두었다.","1967년에 사람들이 해변에 쓰레기를 버리기 시작했다."],"opts":["The waves turned the glass into tiny smooth pieces.","The beach was always a beautiful place.","The government left all the trash on the beach.","People started throwing trash on the beach in 1967."],"r":{"a":"1) The waves turned the glass into tiny smooth pieces.","ev":"1번, 3번, 5번, 8번, 11번 문장","s":[[1,"Once there was a beach in California that was full of trash.","예전에 캘리포니아에는 쓰레기로 가득 찬 해변이 있었다."],[3,"In 1967, the government stopped people from throwing their trash there.","1967년에, 정부는 사람들이 그곳에 쓰레기를 버리는 것을 막았다."],[5,"Most of the trash was removed.","대부분의 쓰레기는 치워졌다."],[8,"Over the years, the ocean’s waves broke down the glass and made it into tiny smooth pieces that look like jewelry.","수년간, 바다의 파도가 유리를 부수고 그것을 보석처럼 보이는 아주 작고 매끄러운 조각들로 만들었다."],[11,"Unlike in the past, it is now a beautiful place that many people want to visit!","과거와는 달리, 그곳은 이제 많은 사람들이 방문하고 싶어 하는 아름다운 장소이다!"]],"w":"8번에서 파도가 유리를 tiny smooth pieces로 만들었어요. 해변은 한때 쓰레기로 가득했고(1번, 11번의 Unlike in the past), 정부는 대부분의 쓰레기를 치웠고(5번), 1967년에는 오히려 버리는 것을 막았어요(3번).","c":1},"h":"f19f568544"},{"n":9,"t":"sum","q":"The beach that was once full of trash is now Glass Beach, a (A) place that many people want to (B).","ko":"한때 쓰레기로 가득 찼던 해변은 이제 많은 사람들이 (B)하고 싶어 하는 (A) 장소인 Glass Beach이다.","oko":["(A) 더러운 / (B) 방문","(A) 아름다운 / (B) 떠나","(A) 더러운 / (B) 청소","(A) 위험한 / (B) 떠나","(A) 아름다운 / (B) 방문"],"opts":["(A) dirty / (B) visit","(A) beautiful / (B) leave","(A) dirty / (B) clean","(A) dangerous / (B) leave","(A) beautiful / (B) visit"],"r":{"a":"5) (A) beautiful / (B) visit","ev":"10~11번 문장","s":[[10,"Today, this place is known as Glass Beach.","오늘날, 이 장소는 Glass Beach로 알려져 있다."],[11,"Unlike in the past, it is now a beautiful place that many people want to visit!","과거와는 달리, 그곳은 이제 많은 사람들이 방문하고 싶어 하는 아름다운 장소이다!"]],"w":"10번에서 이 장소는 Glass Beach로 알려져 있고, 11번에서 과거와 달리 많은 사람들이 방문하고(visit) 싶어 하는 아름다운(beautiful) 장소라고 해요.","c":5},"h":"cc39f8e918"},{"n":10,"t":"fill","q":"In 1967, the government stopped people [A] throwing their trash there. Projects were started to [B] up the area.","ko":"1967년에, 정부는 사람들이 그곳에 쓰레기를 버리는 것을 막았다(~가 …하는 것을 막다 = stop ~ [A] …ing). 그 지역을 [B] 위해 프로젝트들이 시작되었다.","bank":["from","clean","to","into","remove","glass"],"bko":{"from":"~로부터","clean":"치우다, 청소하다","to":"~에, ~로","into":"~ 안으로","remove":"제거하다","glass":"유리"},"r":{"a":"[A] from, [B] clean","ev":"3~4번 문장","s":[[3,"In 1967, the government stopped people from throwing their trash there.","1967년에, 정부는 사람들이 그곳에 쓰레기를 버리는 것을 막았다."],[4,"Projects were started to clean up the area.","그 지역을 치우기 위해 프로젝트들이 시작되었다."]],"w":"3번 stopped people from throwing, 4번 to clean up the area에서 가져왔어요. stop A from -ing 자리에는 from만 들어가고, up 앞에는 clean up만 말이 돼요.","c":null},"h":"6f5240816f"}]},{"u":4,"id":"rj2-04-4","no":4,"ko":"친환경 도시, 쿠리치바","items":[{"n":1,"t":"tf","q":"Curitiba was once full of poor people and pollution.","ko":"Curitiba는 한때 가난한 사람들과 오염으로 가득 차 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Curitiba, Brazil, was once a city that was full of poor people and pollution.","브라질의 Curitiba(쿠리치바)는 한때 가난한 사람들과 오염으로 가득 차 있던 도시였다."]],"w":"1번 문장에 Curitiba, Brazil, was once a city that was full of poor people and pollution이 있어요.","c":"T"},"h":"20609f4ffb"},{"n":2,"t":"tf","q":"Children received money when they brought in cans and bottles.","ko":"아이들은 캔과 병을 가져오면 돈을 받았다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Children could bring in cans and bottles and receive school supplies in return.","아이들은 캔과 병을 가져와서 보상으로 학용품을 받을 수 있었다."]],"w":"8번에서 아이들은 캔과 병을 가져오고 in return(보상으로) school supplies, 즉 학용품을 받았어요. 돈이 아니에요.","c":"F"},"h":"ecc36f8e23"},{"n":3,"t":"tf","q":"Poor people gave their trash to the local centers and got food or bus tickets.","ko":"가난한 사람들은 쓰레기를 지역 센터에 주고 음식이나 버스표를 얻었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Poor people gave their trash to the local centers and got food or bus tickets.","가난한 사람들은 그들의 쓰레기를 지역 센터들에 주고 음식이나 버스표를 얻었다."]],"w":"7번 문장이 그대로 이 내용이에요. 쓰레기를 주고 음식이나 버스표를 받았어요.","c":"T"},"h":"b66bc9efcf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The idea was to exchange trash for food.)","ko":"그 아이디어는 쓰레기를 음식으로 ( ) 것이었다.","opts":["교환하는","버리는","만드는","나누어 먹는"],"word":"exchange","r":{"a":"1) 교환하는","ev":"5~6번 문장","s":[[5,"The idea was to exchange trash for food.","그 아이디어는 쓰레기를 음식으로 교환하는 것이었다."],[6,"So, they called this the Green Exchange Program.","그래서 그들은 이것을 Green Exchange 프로그램이라고 불렀다."]],"w":"5번 문장을 6번에서 Green Exchange Program이라고 불러요. 쓰레기를 주고 음식을 받는 것이니 exchange는 '교환하다'예요.","c":1},"h":"c6415b4f50"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Children could bring in cans and bottles and receive school supplies in return.)","ko":"아이들은 캔과 병을 가져와서 보상으로 학교 ( )을 받을 수 있었다.","opts":["식물","용품","점수","간식"],"word":"supplies","r":{"a":"2) 용품","ev":"8번 문장","s":[[8,"Children could bring in cans and bottles and receive school supplies in return.","아이들은 캔과 병을 가져와서 보상으로 학용품을 받을 수 있었다."]],"w":"8번에서 아이들이 캔과 병을 가져오고 받는 것이 school supplies예요. 학교에서 쓰는 물건, 즉 학용품이니 supplies는 '용품'이에요.","c":2},"h":"6e58daf946"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nSo, they called this the Green Exchange Program.","ko":"밑줄 친 this가 가리키는 것은?","sko":"그래서 그들은 이것을 Green Exchange 프로그램이라고 불렀다.","opts":["브라질의 도시","가난한 가정","쓰레기를 음식으로 교환하자는 아이디어","학용품"],"r":{"a":"3) 쓰레기를 음식으로 교환하자는 아이디어","ev":"4~6번 문장","s":[[4,"They thought of an idea that could help both poor families and the environment.","그들은 빈곤 가정과 환경 둘 다 도울 수 있는 아이디어를 생각해 냈다."],[5,"The idea was to exchange trash for food.","그 아이디어는 쓰레기를 음식으로 교환하는 것이었다."],[6,"So, they called this the Green Exchange Program.","그래서 그들은 이것을 Green Exchange 프로그램이라고 불렀다."]],"w":"4번에서 아이디어(an idea)를 말했고, 5번에서 그 내용이 쓰레기를 음식으로 교환하는 것이라고 했어요. 6번의 this는 그 아이디어예요.","c":3},"h":"7f9331f23d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Through this program, people could get what they needed and clean up the city at the same time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 프로그램을 통해, 사람들은 그들이 필요로 하는 것을 얻고 동시에 도시를 깨끗이 치울 수 있었다.","opts":["이 프로그램을 통해 사람들은 필요한 것을 사고 도시를 떠날 수 있었다.","이 프로그램 때문에 사람들은 필요한 것을 얻지 못하고 도시는 더 더러워졌다.","이 프로그램을 통해 사람들은 도시를 깨끗이 하는 일만 할 수 있었다.","이 프로그램을 통해 사람들은 필요한 것을 얻으면서 동시에 도시도 깨끗이 할 수 있었다."],"r":{"a":"4) 이 프로그램을 통해 사람들은 필요한 것을 얻으면서 동시에 도시도 깨끗이 할 수 있었다.","ev":"9번 문장","s":[[9,"Through this program, people could get what they needed and clean up the city at the same time.","이 프로그램을 통해, 사람들은 그들이 필요로 하는 것을 얻고 동시에 도시를 깨끗이 치울 수 있었다."]],"w":"get what they needed는 '필요한 것을 얻다', clean up the city는 '도시를 깨끗이 치우다', at the same time은 '동시에'예요. 두 가지를 한꺼번에 이룰 수 있었다는 뜻이에요.","c":4},"h":"4a298d2bdf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Curitiba는 늘 세계에서 가장 친환경적인 도시들 중 하나였다.","아이들은 캔과 병을 가져오고 보상으로 학용품을 받을 수 있었다.","가난한 사람들은 돈을 내고 버스표를 샀다.","사람들은 꽃과 나무와 풀을 심는 것을 그만두었다."],"opts":["Curitiba has always been one of the greenest cities in the world.","Children could get school supplies for bringing in cans and bottles.","Poor people paid money to get bus tickets.","The people stopped planting flowers, trees, and grass."],"r":{"a":"2) Children could get school supplies for bringing in cans and bottles.","ev":"1번, 7~8번, 10번 문장","s":[[1,"Curitiba, Brazil, was once a city that was full of poor people and pollution.","브라질의 Curitiba(쿠리치바)는 한때 가난한 사람들과 오염으로 가득 차 있던 도시였다."],[7,"Poor people gave their trash to the local centers and got food or bus tickets.","가난한 사람들은 그들의 쓰레기를 지역 센터들에 주고 음식이나 버스표를 얻었다."],[8,"Children could bring in cans and bottles and receive school supplies in return.","아이들은 캔과 병을 가져와서 보상으로 학용품을 받을 수 있었다."],[10,"The people also worked together to plant flowers, trees, and grass.","사람들은 또한 꽃과 나무와 풀을 심기 위해 함께 일했다."]],"w":"8번에서 아이들은 캔과 병을 가져오고 학용품을 받아요. Curitiba는 한때 가난과 오염으로 가득했고(1번), 가난한 사람들은 돈이 아니라 쓰레기를 주고 버스표를 받았고(7번), 사람들은 함께 꽃과 나무와 풀을 심었어요(10번).","c":2},"h":"863878ee62"},{"n":9,"t":"sum","q":"Through the program, people got what they needed and (A) the city, and now Curitiba is cleaner and (B).","ko":"프로그램을 통해 사람들은 필요한 것을 얻고 도시를 (A), 지금 Curitiba는 더 깨끗하고 (B).","oko":["(A) 깨끗이 치웠고 / (B) 더 가난하다","(A) 떠났고 / (B) 더 안전하다","(A) 깨끗이 치웠고 / (B) 더 위험하다","(A) 떠났고 / (B) 더 가난하다","(A) 깨끗이 치웠고 / (B) 더 안전하다"],"opts":["(A) cleaned up / (B) poorer","(A) left / (B) safer","(A) cleaned up / (B) more dangerous","(A) left / (B) poorer","(A) cleaned up / (B) safer"],"r":{"a":"5) (A) cleaned up / (B) safer","ev":"9번, 11번 문장","s":[[9,"Through this program, people could get what they needed and clean up the city at the same time.","이 프로그램을 통해, 사람들은 그들이 필요로 하는 것을 얻고 동시에 도시를 깨끗이 치울 수 있었다."],[11,"Now Curitiba is cleaner and safer, with 16 parks, 14 forests, and over 1,000 public green spaces for people to enjoy!","이제 Curitiba는 사람들이 즐길 수 있는 16개의 공원, 14개의 숲, 그리고 1,000개 이상의 공공녹지들과 더불어 더 깨끗하고 더 안전하다!"]],"w":"9번에서 사람들은 필요한 것을 얻고 도시를 clean up했어요. 11번에서 지금 Curitiba는 cleaner and safer, 즉 더 깨끗하고 더 안전하다고 해요.","c":5},"h":"c9fe9c7070"},{"n":10,"t":"fill","q":"The people also worked [A] to plant [B], trees, and grass.","ko":"사람들은 또한 [B]과 나무와 풀을 심기 위해 [A] 일했다.","bank":["together","flowers","pollution","safer","exchange","program"],"bko":{"together":"함께","flowers":"꽃","pollution":"오염","safer":"더 안전한","exchange":"교환","program":"프로그램"},"r":{"a":"[A] together, [B] flowers","ev":"10번 문장","s":[[10,"The people also worked together to plant flowers, trees, and grass.","사람들은 또한 꽃과 나무와 풀을 심기 위해 함께 일했다."]],"w":"10번 The people also worked together to plant flowers, trees, and grass에서 가져왔어요. 나머지 단어는 [A]나 [B] 자리에 넣으면 뜻이 맞지 않아요.","c":null},"h":"fafa062b82"}]},{"u":5,"id":"rj2-05-1","no":1,"ko":"왜 자꾸 늦을까?","items":[{"n":1,"t":"tf","q":"We often believe that we can work faster than we really can.","ko":"우리는 흔히 자신이 실제로 할 수 있는 것보다 더 빠르게 일할 수 있다고 믿는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"We usually think we can work faster than we really can.","우리는 보통 자신이 실제로 할 수 있는 것보다 더 빠르게 작업할 수 있다고 생각한다."]],"w":"7번 문장에서 우리는 보통 실제보다 더 빠르게 일할 수 있다고 생각한다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"5ee7d8c277"},{"n":2,"t":"tf","q":"Unexpected events never cause delays in a project.","ko":"예상치 못한 일들은 프로젝트에서 절대 지연을 일으키지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Also, unexpected events often cause delays.","또한, 예상치 못한 일들이 자주 지연을 일으킨다."]],"w":"8번 문장에서 예상치 못한 일들이 자주 지연을 일으킨다(often cause delays)고 해요. never(절대 ~않다)는 반대 내용이에요.","c":"F"},"h":"766e99c2e2"},{"n":3,"t":"tf","q":"Giving yourself extra time can help you meet your deadline.","ko":"스스로에게 여분의 시간을 주면 마감일을 지키는 데 도움이 된다.","r":{"a":"T (본문과 맞는 내용)","ev":"12~13번 문장","s":[[12,"Also, consider giving yourself extra time to finish your project.","또한, 당신의 프로젝트를 마치기 위해 스스로에게 여분의 시간을 주는 것을 고려해라."],[13,"This will help you meet your deadline despite any unexpected delays.","이것은 당신이 어떤 예상치 못한 지연에도 불구하고 마감일을 지키도록 도와줄 것이다."]],"w":"12번에서 여분의 시간을 주는 것을 고려하라고 했고, 13번에서 이것이 예상치 못한 지연에도 마감일을 지키도록 도와준다고 해요.","c":"T"},"h":"8d5ef73b99"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You leave a short amount of time to complete it.)","ko":"당신은 그것을 ( ) 데 짧은 시간을 남겨 둔다.","opts":["시작하다","포기하다","완료하다","미루다"],"word":"complete","r":{"a":"3) 완료하다","ev":"4~5번 문장","s":[[4,"You leave a short amount of time to complete it.","당신은 그것을 완료하는 데 짧은 시간을 남겨 둔다."],[5,"In the end, you almost miss the deadline.","결국, 당신은 기한을 놓칠 뻔한다."]],"w":"숙제를 끝내기 위해 짧은 시간만 남겨 두는 상황이에요. 결국 기한을 놓칠 뻔하니(5번), complete = 완료하다(끝내다)예요.","c":3},"h":"9197c03f21"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Compare your current plan with past ones to make sure that it is realistic.)","ko":"계획이 ( )인지 확인하기 위해 현재의 계획을 과거의 계획들과 비교해라.","opts":["현실적인","화려한","복잡한","느린"],"word":"realistic","r":{"a":"1) 현실적인","ev":"11번 문장","s":[[11,"Compare your current plan with past ones to make sure that it is realistic.","계획이 현실적인지 확인하기 위해 당신의 현재 계획을 과거의 계획들과 비교해라."]],"w":"과거 계획과 비교하는 이유는 지금 계획이 실제로 지킬 수 있는 계획인지 확인하려는 거예요. realistic = 현실적인이에요.","c":1},"h":"ada8179058"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis will help you meet your deadline despite any unexpected delays.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 당신이 어떤 예상치 못한 지연에도 불구하고 마감일을 지키도록 도와줄 것이다.","opts":["현재 계획을 과거의 계획과 비교하는 것","스스로에게 여분의 시간을 주는 것","호프스태터의 법칙","예상치 못한 일들"],"r":{"a":"2) 스스로에게 여분의 시간을 주는 것","ev":"12~13번 문장","s":[[12,"Also, consider giving yourself extra time to finish your project.","또한, 당신의 프로젝트를 마치기 위해 스스로에게 여분의 시간을 주는 것을 고려해라."],[13,"This will help you meet your deadline despite any unexpected delays.","이것은 당신이 어떤 예상치 못한 지연에도 불구하고 마감일을 지키도록 도와줄 것이다."]],"w":"This는 바로 앞 12번 문장의 '스스로에게 여분의 시간을 주는 것'이에요. 비교하는 것은 11번 문장이라 한 문장 더 앞이에요.","c":2},"h":"d56353dfb4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Things like this happen because we believe too strongly in our abilities.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 일들은 우리가 우리의 능력을 너무 강하게 믿기 때문에 발생한다.","opts":["이런 일들은 우리가 우리의 능력을 믿지 못해서 생긴다.","이런 일들은 능력이 부족한 사람에게만 생긴다.","이런 일들은 우리가 너무 일찍 시작해서 생긴다.","이런 일들은 우리가 우리의 능력을 지나치게 믿기 때문에 생긴다."],"r":{"a":"4) 이런 일들은 우리가 우리의 능력을 지나치게 믿기 때문에 생긴다.","ev":"6번 문장","s":[[6,"Things like this happen because we believe too strongly in our abilities.","이러한 일들은 우리가 우리의 능력을 너무 강하게 믿기 때문에 발생한다."]],"w":"because 뒤가 이유예요. believe too strongly in our abilities는 능력을 너무 강하게 믿는다는 뜻이에요. 믿지 못한다는 반대 내용이 아니에요.","c":4},"h":"b55b0e0d85"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["쉬울 것 같은 숙제에 시간을 적게 남기면 기한을 놓칠 뻔할 수 있다.","사람들은 자신의 능력을 충분히 믿지 않는다.","프로젝트는 보통 계획한 것보다 더 짧은 시간에 끝난다.","예상치 못한 일들은 프로젝트를 끝내는 것을 도와준다."],"opts":["A project usually ends faster than planned.","People do not believe enough in their abilities.","Leaving little time for an easy-looking homework can make you almost miss the deadline.","Unexpected events help you finish your project early."],"r":{"a":"3) Leaving little time for an easy-looking homework can make you almost miss the deadline.","ev":"3~5번 문장","s":[[3,"For example, you have homework that you think will be easy.","예를 들어, 당신은 쉬울 것이라고 생각하는 숙제가 있다."],[4,"You leave a short amount of time to complete it.","당신은 그것을 완료하는 데 짧은 시간을 남겨 둔다."],[5,"In the end, you almost miss the deadline.","결국, 당신은 기한을 놓칠 뻔한다."]],"w":"3~5번에서 쉬울 것 같은 숙제에 짧은 시간만 남기면 결국 기한을 놓칠 뻔한다고 해요. 나머지는 1번(더 오래 걸림), 6번(너무 강하게 믿음), 8번(지연을 일으킴)과 반대예요.","c":3},"h":"2fdea8e87d"},{"n":9,"t":"sum","q":"According to Hofstadter’s law, a project takes a (A) time than planned, because we think we can work (B) than we really can.","ko":"호프스태터의 법칙에 따르면, 프로젝트는 우리가 실제로 할 수 있는 것보다 더 (B) 일할 수 있다고 생각하기 때문에 계획보다 (A) 시간이 걸린다.","oko":["(A) 더 짧은 / (B) 더 느리게","(A) 더 긴 / (B) 더 느리게","(A) 더 짧은 / (B) 더 빠르게","(A) 똑같은 / (B) 더 빠르게","(A) 더 긴 / (B) 더 빠르게"],"opts":["(A) shorter / (B) slower","(A) longer / (B) slower","(A) shorter / (B) faster","(A) same / (B) faster","(A) longer / (B) faster"],"r":{"a":"5) (A) longer / (B) faster","ev":"1, 7번 문장","s":[[1,"According to Hofstadter’s law, a project always takes a longer time than planned.","호프스태터의 법칙에 따르면, 프로젝트는 항상 계획된 것보다 더 오랜 시간이 걸린다."],[7,"We usually think we can work faster than we really can.","우리는 보통 자신이 실제로 할 수 있는 것보다 더 빠르게 작업할 수 있다고 생각한다."]],"w":"1번에서 프로젝트는 계획보다 더 긴 시간(longer)이 걸리고, 7번에서 우리는 실제보다 더 빠르게(faster) 일할 수 있다고 생각한다고 해요.","c":5},"h":"3cd65b62c5"},{"n":10,"t":"fill","q":"To meet your [A] despite unexpected delays, you should give yourself [B] time to finish your project.","ko":"예상치 못한 지연에도 불구하고 당신의 [A]을 지키려면, 프로젝트를 마치기 위해 스스로에게 [B] 시간을 주어야 한다.","bank":["deadline","extra","ability","tip","problem","law"],"bko":{"deadline":"마감일, 기한","extra":"여분의, 추가의","ability":"능력","tip":"방법, 요령","problem":"문제","law":"법칙"},"r":{"a":"[A] deadline, [B] extra","ev":"12~13번 문장","s":[[12,"Also, consider giving yourself extra time to finish your project.","또한, 당신의 프로젝트를 마치기 위해 스스로에게 여분의 시간을 주는 것을 고려해라."],[13,"This will help you meet your deadline despite any unexpected delays.","이것은 당신이 어떤 예상치 못한 지연에도 불구하고 마감일을 지키도록 도와줄 것이다."]],"w":"12번에서 프로젝트를 마치기 위해 extra time(여분의 시간)을 주라고 하고, 13번에서 그러면 deadline(마감일)을 지킬 수 있다고 해요. 나머지 단어는 meet 뒤나 time 앞에 자연스럽게 들어가지 않아요.","c":null},"h":"8f2dda687a"}]},{"u":5,"id":"rj2-05-2","no":2,"ko":"다 바꾸고 싶어!","items":[{"n":1,"t":"tf","q":"After you get something new, you may want to buy more new things.","ko":"새로운 것을 얻은 뒤에, 당신은 더 많은 새로운 것들을 사고 싶어질 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Suddenly you feel unhappy with your old stuff and want to buy more new things.","갑자기 당신은 당신의 오래된 물건들에 만족하지 못하고 더 많은 새로운 것들을 사고 싶어 한다."]],"w":"2번 문장에서 갑자기 오래된 물건에 만족하지 못하고 더 많은 새것을 사고 싶어 한다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"44c4d410b9"},{"n":2,"t":"tf","q":"The French philosopher was rich for most of his life.","ko":"그 프랑스 철학자는 삶의 대부분을 부유하게 보냈다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It was named after a French philosopher who was poor for most of his life.","그것은 삶의 대부분을 가난하게 보냈던 프랑스 철학자의 이름을 따서 지어졌다."]],"w":"4번 문장에서 철학자는 삶의 대부분을 가난하게(poor) 보냈다고 해요. rich(부유한)는 반대 내용이에요.","c":"F"},"h":"3fed63ca19"},{"n":3,"t":"tf","q":"After the robe came, his other things looked ugly to the philosopher.","ko":"가운이 오고 난 뒤, 그 철학자에게는 그의 다른 물건들이 보기 흉해 보였다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When he brought it home, it made his other things look ugly in comparison.","그가 그것을 집에 가지고 왔을 때, 그것은 그의 다른 물건들을 비교적 보기 흉하게 만들었다."]],"w":"6번 문장에서 가운을 집에 가져오자 그것이 다른 물건들을 비교적 보기 흉하게 만들었다고 해요.","c":"T"},"h":"a5bc3da763"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So he started replacing all his furniture and clothes with new items.)","ko":"그래서 그는 그의 모든 가구와 옷을 새로운 물품들로 ( ) 시작했다.","opts":["기록하는","교체하는","수리하는","쌓아 두는"],"word":"replacing","r":{"a":"2) 교체하는","ev":"7번 문장","s":[[7,"So he started replacing all his furniture and clothes with new items.","그래서 그는 그의 모든 가구와 옷을 새로운 물품들로 교체하기 시작했다."]],"w":"가운 때문에 다른 물건이 초라해 보여서 새 물품으로 바꾸기 시작하는 상황이에요. replace A with B = A를 B로 바꾸다(교체하다)예요.","c":2},"h":"a077ef6ce1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To prevent the Diderot effect, try to purchase things that fit your current style.)","ko":"디드로 효과를 ( ) 위해, 당신의 현재 스타일에 맞는 물건들을 구매하려고 노력해라.","opts":["막다","믿다","자랑하다","돕다"],"word":"prevent","r":{"a":"1) 막다","ev":"11번 문장","s":[[11,"To prevent the Diderot effect, try to purchase things that fit your current style and match what you already have.","디드로 효과를 방지하기 위해, 당신의 현재 스타일에 맞으며 당신이 이미 가지고 있는 것과 어울리는 물건들을 구매하려고 노력해라."]],"w":"앞에서 디드로 효과는 필요 없는 물건을 계속 사게 되는 문제로 나와요. 그래서 이 효과를 '막기' 위해 현재 스타일과 어울리는 물건을 사라는 뜻이에요. prevent = 막다예요.","c":1},"h":"7fc11bb136"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen he brought it home, it made his other things look ugly in comparison.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그가 그것을 집에 가지고 왔을 때, 그것은 그의 다른 물건들을 비교적 보기 흉하게 만들었다.","opts":["그의 집","그 프랑스 철학자","아름다운 빨간 가운","디드로 효과"],"r":{"a":"3) 아름다운 빨간 가운","ev":"5~6번 문장","s":[[5,"One day he was given a beautiful red robe.","어느 날 그는 아름다운 빨간 가운을 받았다."],[6,"When he brought it home, it made his other things look ugly in comparison.","그가 그것을 집에 가지고 왔을 때, 그것은 그의 다른 물건들을 비교적 보기 흉하게 만들었다."]],"w":"6번의 it은 바로 앞 5번 문장에서 철학자가 받은 a beautiful red robe(아름다운 빨간 가운)예요. 철학자(he)는 가운을 집에 가져온 사람이에요.","c":3},"h":"53b9894c84"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, you end up with items you don’t need.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로, 당신은 필요하지 않은 물건들을 갖게 된다.","opts":["결과적으로, 당신은 가진 물건을 모두 버리게 된다.","결과적으로, 당신은 필요한 물건을 더 싸게 사게 된다.","결과적으로, 당신은 물건을 사고 싶은 마음이 없어진다.","결과적으로, 당신은 필요하지 않은 물건들을 갖게 된다."],"r":{"a":"4) 결과적으로, 당신은 필요하지 않은 물건들을 갖게 된다.","ev":"10번 문장","s":[[10,"As a result, you end up with items you don’t need.","결과적으로, 당신은 필요하지 않은 물건들을 갖게 된다."]],"w":"end up with ~는 '결국 ~을 갖게 되다'이고, items you don’t need은 필요하지 않은 물건들이에요. 새것을 계속 산 결과로 쓸모없는 물건이 쌓인다는 뜻이에요.","c":4},"h":"bdf7b8b18e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 철학자는 부자여서 빨간 가운을 친구에게 주었다.","빨간 가운을 받은 뒤, 그 철학자는 오래된 물건들을 새것으로 교체했다.","그 철학자는 오래된 가구와 옷을 모두 그대로 두었다.","그 철학자는 물건이 보기 흉해서 빨간 가운을 샀다."],"opts":["The philosopher was rich and gave a red robe to a friend.","After getting a red robe, the philosopher replaced his old things with new ones.","The philosopher kept all his old furniture and clothes.","The philosopher bought a red robe because his things looked ugly."],"r":{"a":"2) After getting a red robe, the philosopher replaced his old things with new ones.","ev":"4~7번 문장","s":[[4,"It was named after a French philosopher who was poor for most of his life.","그것은 삶의 대부분을 가난하게 보냈던 프랑스 철학자의 이름을 따서 지어졌다."],[5,"One day he was given a beautiful red robe.","어느 날 그는 아름다운 빨간 가운을 받았다."],[6,"When he brought it home, it made his other things look ugly in comparison.","그가 그것을 집에 가지고 왔을 때, 그것은 그의 다른 물건들을 비교적 보기 흉하게 만들었다."],[7,"So he started replacing all his furniture and clothes with new items.","그래서 그는 그의 모든 가구와 옷을 새로운 물품들로 교체하기 시작했다."]],"w":"4번에서 철학자는 가난했고, 5번에서 가운을 받았고(산 것이 아님), 6번에서 가운 때문에 다른 물건이 초라해 보였으며, 7번에서 가구와 옷을 새것으로 바꾸기 시작했어요.","c":2},"h":"b2293c14ee"},{"n":9,"t":"sum","q":"One new thing leads you to (A) more new things, and you end up with items you (B).","ko":"새로운 것 한 가지는 당신이 더 많은 새로운 것들을 (A)하게 이끌고, 당신은 결국 (B) 물건들을 갖게 된다.","oko":["(A) 파는 / (B) 필요하지 않은","(A) 파는 / (B) 많이 필요한","(A) 사는 / (B) 많이 필요한","(A) 나눠 주는 / (B) 필요하지 않은","(A) 사는 / (B) 필요하지 않은"],"opts":["(A) sell / (B) don’t need","(A) sell / (B) need a lot","(A) buy / (B) need a lot","(A) give away / (B) don’t need","(A) buy / (B) don’t need"],"r":{"a":"5) (A) buy / (B) don’t need","ev":"9~10번 문장","s":[[9,"One new thing causes you to buy more new things.","한 가지 새로운 것은 당신이 더 많은 새로운 것들을 구매하게 만든다."],[10,"As a result, you end up with items you don’t need.","결과적으로, 당신은 필요하지 않은 물건들을 갖게 된다."]],"w":"9번에서 새것 하나가 더 많은 새것을 사게(buy) 만들고, 10번에서 결국 필요하지 않은(don’t need) 물건들을 갖게 된다고 해요.","c":5},"h":"f44e1cf7af"},{"n":10,"t":"fill","q":"To [A] the Diderot effect, try to purchase things that [B] your current style and match what you already have.","ko":"디드로 효과를 [A]하기 위해, 당신의 현재 스타일에 [B] 그리고 이미 가지고 있는 것과 어울리는 물건들을 구매하려고 노력해라.","bank":["prevent","fit","ugly","series","purchase","philosopher"],"bko":{"prevent":"막다, 방지하다","fit":"(스타일이) 맞다","ugly":"보기 흉한","series":"연속","purchase":"구매하다","philosopher":"철학자"},"r":{"a":"[A] prevent, [B] fit","ev":"11번 문장","s":[[11,"To prevent the Diderot effect, try to purchase things that fit your current style and match what you already have.","디드로 효과를 방지하기 위해, 당신의 현재 스타일에 맞으며 당신이 이미 가지고 있는 것과 어울리는 물건들을 구매하려고 노력해라."]],"w":"11번 문장의 To prevent the Diderot effect(디드로 효과를 방지하기 위해)와 things that fit your current style(현재 스타일에 맞는 물건들)이에요. 나머지 단어는 이 빈칸에 넣으면 뜻이 어색해요.","c":null},"h":"a03cd78d60"}]},{"u":5,"id":"rj2-05-3","no":3,"ko":"분명히 집중했는데?","items":[{"n":1,"t":"tf","q":"In the experiment, words are recognized more quickly than colors.","ko":"실험에서, 단어들은 색들보다 더 빨리 인식된다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"So words are recognized more quickly than colors.","그래서 단어들이 색들보다 더 빨리 인식된다."]],"w":"14번 문장에서 단어들이 색들보다 더 빨리 인식된다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"ac94b6e599"},{"n":2,"t":"tf","q":"The brain needs less time when it handles conflicting information.","ko":"뇌는 상충되는 정보를 다룰 때 더 적은 시간이 필요하다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"It happens because the brain needs extra time to work when it handles conflicting information.","그것은 뇌가 상충되는 정보를 다룰 때 일할 추가의 시간을 필요로 하기 때문에 발생한다."]],"w":"9번 문장에서 뇌가 상충되는 정보를 다룰 때 추가의 시간(extra time)이 필요하다고 해요. less(더 적은)는 반대예요.","c":"F"},"h":"fb2c1bb5aa"},{"n":3,"t":"tf","q":"In the experiment, the word red is written in the color yellow.","ko":"실험에서, ‘빨강’이라는 단어는 노란색으로 쓰여 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"In this experiment, the word red is written in yellow.","이 실험에서, ‘빨강’이라는 단어는 노란색으로 쓰여 있다."]],"w":"10번 문장에 the word red is written in yellow라고 그대로 나와요. 단어의 뜻(빨강)과 글자 색(노랑)이 서로 달라요.","c":"T"},"h":"19807644ed"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The word’s meaning and its color are conflicting.)","ko":"단어의 의미와 그것의 색이 ( ).","opts":["똑같은","상충되는","어울리는","비슷한"],"word":"conflicting","r":{"a":"2) 상충되는","ev":"10~11번 문장","s":[[10,"In this experiment, the word red is written in yellow.","이 실험에서, ‘빨강’이라는 단어는 노란색으로 쓰여 있다."],[11,"The word’s meaning and its color are conflicting.","단어의 의미와 그것의 색이 상충된다."]],"w":"10번에서 red라는 단어가 노란색으로 쓰여 있어요. 뜻은 빨강인데 색은 노랑이라 서로 맞지 않으니 conflicting = 상충되는이에요.","c":2},"h":"5b130a2819"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It happens because the brain needs extra time to work when it handles conflicting information.)","ko":"그것은 뇌가 상충되는 정보를 ( ) 때 일할 추가의 시간을 필요로 하기 때문에 발생한다.","opts":["버린다","기억한다","만든다","다룬다"],"word":"handles","r":{"a":"4) 다룬다","ev":"9번 문장","s":[[9,"It happens because the brain needs extra time to work when it handles conflicting information.","그것은 뇌가 상충되는 정보를 다룰 때 일할 추가의 시간을 필요로 하기 때문에 발생한다."]],"w":"뇌에 서로 맞지 않는 정보가 들어왔을 때 그것을 처리하는 상황이에요. handle = 다루다(처리하다)예요.","c":4},"h":"98cc215bb0"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis slows down your brain!","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 당신의 뇌를 늦춘다!","opts":["올바른 답을 빨리 말하는 것","뇌가 올바른 답이 떠오를 때까지 잘못된 답을 계속 보유해야 하는 것","단어를 읽는 것에 친숙한 것","색의 이름을 말하는 것"],"r":{"a":"2) 뇌가 올바른 답이 떠오를 때까지 잘못된 답을 계속 보유해야 하는 것","ev":"16~17번 문장","s":[[16,"So your brain has to hold on to the wrong answer until the right answer comes.","그래서 당신의 뇌는 올바른 답이 떠오를 때까지 잘못된 답을 계속 보유해야 한다."],[17,"This slows down your brain!","이것은 당신의 뇌를 늦춘다!"]],"w":"17번 바로 앞 16번 문장에서 뇌가 올바른 답이 떠오를 때까지 잘못된 답을 계속 보유해야 한다고 해요. 이 상황이 뇌를 늦추는 거예요.","c":2},"h":"dc80c2b303"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When there is conflicting information, the brain generally does the more familiar job first.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"상충되는 정보가 있을 때, 뇌는 일반적으로 더 친숙한 일을 먼저 한다.","opts":["상충되는 정보가 있을 때, 뇌는 보통 더 어려운 일을 먼저 한다.","상충되는 정보가 있을 때, 뇌는 아무 일도 하지 않는다.","상충되는 정보가 있을 때, 뇌는 보통 더 익숙한 일을 먼저 한다.","상충되는 정보가 있을 때, 뇌는 항상 색을 먼저 인식한다."],"r":{"a":"3) 상충되는 정보가 있을 때, 뇌는 보통 더 익숙한 일을 먼저 한다.","ev":"12번 문장","s":[[12,"When there is conflicting information, the brain generally does the more familiar job first.","상충되는 정보가 있을 때, 뇌는 일반적으로 더 친숙한 일을 먼저 한다."]],"w":"the more familiar job first는 '더 친숙한 일을 먼저'예요. generally는 '보통, 일반적으로'라는 뜻이고, 색을 먼저 인식한다는 말은 없어요(오히려 단어를 먼저 읽음, 13~14번).","c":3},"h":"2a85a0aca0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["색 대신 단어를 말했다면 당신은 스트룹 효과를 경험했을 수 있다.","뇌는 단어를 읽는 것보다 색을 읽는 것이 더 빠르다.","실험은 당신에게 색이 아니라 단어를 말하라고 요청한다.","실험에서 ‘빨강’이라는 단어는 파란색으로 쓰여 있다."],"opts":["You may have experienced the Stroop Effect if you said the word instead of the color.","The brain recognizes colors faster than words.","The experiment asks you to say the word, not the color.","In the experiment, the word red is written in blue."],"r":{"a":"1) You may have experienced the Stroop Effect if you said the word instead of the color.","ev":"7~8번 문장","s":[[7,"Did you say the word instead of the color?","색 대신에 단어를 말했는가?"],[8,"If so, you experienced the Stroop Effect.","만약 그렇다면, 당신은 스트룹 효과(Stroop Effect)를 경험했다."]],"w":"7~8번에서 색 대신 단어를
