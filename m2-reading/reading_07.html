rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Welcome back to school, friends! Opening up your bags, and let’s get to know each other!", "ko": "학교로 돌아온 걸 환영해요, 친구들! 우리 가방을 열어서 서로를 알아 가는 시간을 가져보는 것이 어떨까요?", "ok": false, "foot": [], "fixes": [{"wrong": "Opening", "right": "Open", "partial": false, "at": [5], "point": "명령문: 문장은 동사원형으로 시작해야 함 (Opening → Open), 그 뒤 콤마+and로 결과를 이어줌", "topic": "명령문", "memo": "문장은 동사원형으로 시작해야 함 (Opening → Open), 그 뒤 콤마+and로 결과를 이어줌"}]}, {"n": 2, "tag": "Bora", "en": "I always bring my headphones in my bag.", "ko": "저는 항상 제 가방에 헤드폰을 가지고 다녀요.", "ok": true, "foot": [], "fixes": []}, {"n": 3, "tag": null, "en": "I like to listen to music because it make me happy.", "ko": "저는 음악을 듣는 걸 좋아하는데 그건 저를 행복하게 하기 때문이에요.", "ok": false, "foot": [], "fixes": [{"wrong": "make", "right": "makes", "partial": false, "at": [8], "point": "수일치: 주어 it(3인칭 단수)에 맞춰 동사 makes 사용", "topic": "수일치", "memo": "주어 it(3인칭 단수)에 맞춰 동사 makes 사용"}]}, {"n": 4, "tag": null, "en": "Both Lucy and I share playlists and talking about our favorite singers.", "ko": "Lucy와 저 둘 다 재생 목록을 공유하고 저희가 가장 좋아하는 가수들에 관해 이야기해요.", "ok": false, "foot": ["1playlists 재생 목록"], "fixes": [{"wrong": "talking", "right": "talk", "partial": false, "at": [7], "point": "병렬구조: share와 등위접속사 and로 연결된 두 번째 동사는 형태를 맞춰 동사원형 talk 사용", "topic": "병렬구조", "memo": "share와 등위접속사 and로 연결된 두 번째 동사는 형태를 맞춰 동사원형 talk 사용"}]}, {"n": 5, "tag": null, "en": "My favorite singer is Gina and this is her album.", "ko": "제가 가장 좋아하는 가수는 Gina이고 이것은 그녀의 앨범이에요.", "ok": true, "foot": [], "fixes": []}, {"n": 6, "tag": null, "en": "She is the famousest singer in Korea.", "ko": "그녀는 한국에서 가장 유명한 가수예요.", "ok": false, "foot": [], "fixes": [{"wrong": "famousest", "right": "most famous", "partial": false, "at": [3], "point": "최상급: 2음절 이상의 형용사 (famous)는 앞에 most를 붙여 최상급을 만듦 (famousest는 잘못된 형태)", "topic": "최상급", "memo": "2음절 이상의 형용사 (famous)는 앞에 most를 붙여 최상급을 만듦 (famousest는 잘못된 형태)"}]}, {"n": 7, "tag": null, "en": "I always listen at her songs during lunch time.",
