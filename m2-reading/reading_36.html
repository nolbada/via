<script>
var D=[{"n": 1, "tag": null, "en": "Imagine this—you are do your homework at your desk.", "ko": "이런 상상을 해 보세요. 당신은 책상에서 숙제를 하고 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "are do", "right": "are doing", "partial": false, "at": [2], "point": "현재진행형: be동사(are) 뒤에는 동사원형-ing(doing) 형태를 씀", "topic": "현재진행형", "memo": "be동사(are) 뒤에는 동사원형-ing(doing) 형태를 씀"}]}, {"n": 2, "tag": null, "en": "Suddenly, you remember that your mom asked you call her.", "ko": "갑자기 엄마가 당신에게 전화하라고 요청했던 것이 기억나요.", "ok": false, "foot": [], "fixes": [{"wrong": "asked you call her", "right": "asked you to call her", "partial": false, "at": [6], "point": "5형식 동사 ask는 목적격보어로 to부정사(to call)를 씀", "topic": "어법", "memo": "5형식 동사 ask는 목적격보어로 to부정사(to call)를 씀"}]}, {"n": 3, "tag": null, "en": "When you pick up your smartphone, a message pop up.", "ko": "당신이 스마트폰을 집어 들 때, 메시지가 하나 떠요.", "ok": false, "foot": [], "fixes": [{"wrong": "pop up", "right": "pops up", "partial": false, "at": [8], "point": "수일치: 주어 a message(3인칭 단수)에 맞춰 동사에 -s를 붙임", "topic": "수일치", "memo": "주어 a message(3인칭 단수)에 맞춰 동사에 -s를 붙임"}]}, {"n": 4, "tag": null, "en": "It is a new video who was just post by your favorite channel.", "ko": "그것은 당신이 가장 좋아하는 채널이 방금 올린 새 영상이에요.", "ok": false, "foot": [], "fixes": [{"wrong": "who", "right": "that", "partial": false, "at": [5], "point": "관계대명사: 사물(video)을 가리키므로 who 대신 that/which 사용", "topic": "관계대명사", "memo": "사물(video)을 가리키므로 who 대신 that/which 사용"}, {"wrong": "post", "right": "posted", "partial": false, "at": [8], "point": "수동태: be동사(was)+과거분사 (posted) 형태로 써야 함(영상이 채널에 의해 '게시된' 것이므로 수동)", "topic": "수동태", "memo": "be동사(was)+과거분사 (posted) 형태로 써야 함(영상이 채널에 의해 '게시된' 것이므로 수동)"}]}, {"n": 5, "tag": null, "en": "You watch the video and keep watch many other short videos.", "ko": "당신은 그 영상을 시청하고 다른 많은 짧은 영상들을 계속 시청해요.", "ok": false, "foot": [], "fixes": [{"wrong": "keep watch", "right": "keep watching", "partial": false, "at": [5], "point": "동명사: keep은 목적어로 동명사 (watching)를 씀", "topic": "동명사", "memo": "kee !", 0], ["If it happens at night, you may have trouble sleeping.", "만약 이것이 밤에 일어나면, 당신은 잠드는 게 어려울지도 몰라요.", 0], ["More importantly, people with popcorn brain have trouble paying attention.", "더 중요한 것은, 팝콘 브레인을 가진 사람들은 집중하는 데 어려움을 겪어요.", 0], ["They cannot concentrate on one thing for a long time.", "그들은 한 가지 일에 오랜 시간 동안 집중할 수 없어요.", 0], ["In a study, people were able to focus on one thing for 2.5 minutes in 2004.", "한 연구에서, 2004년에는 사람들이 한 가지 일에 2분 30초 동안 집중할 수 있었어요.", 0], ["Nowadays, people can only concentrate for 47 seconds.", "요즘에는 사람들이 단지 47초 동안만 집중할 수 있어요.", 0], ["If you do not want to have popcorn brain, you need to make some changes.", "당신이 팝콘 브레인을 가지고 싶지 않다면 변화를 좀 줄 필요가 있어요.", 0], ["Here are some tips.", "여기에 몇 가지 조언이 있어요.", 0], ["Put away your phone.", "전화기를 치우세요.", 0], ["Leave it in another room when you need to focus.", "집중해야 할 때는 전화기를 다른 방에 두세요.", 0], ["Get moving.", "움직이세요.", 0], ["Play some sports with your friends.", "친구들과 운동을 하세요.", 0], ["Enjoy the small things in life.", "삶에서 소소한 것들을 즐기세요.", 0], ["Feel the sunshine and look at the sky.", "햇살을 느끼고 하늘을 보세요.", 0], ["Try to focus on one thing for a long time.", "한 가지 일에 오랫동안 집중하려고 노력해 보세요.", 0], ["Read a book.", "책을 읽으세요.", 0], ["Smartphones are useful.", "스마트폰은 유용해요.", 0], ["They connect people and make life easier.", "그것들은 사람들을 연결해 주고 삶을 더 편하게 해 줘요.", 0], ["However, using them too much can hurt your brain and your mind.", "그러나 그것을 너무 많이 사용하는 것은 당신의 두뇌와 정신에 해를 끼칠 수 있어요.", 0], ["It is important to cut down on screen time.", "화면을 보는 시간을 줄이는 것이 중요해요.", 0], ["Are you ready to give it a try?", "시도해 볼 준비가 되었나요?", 0]];var RNUM=36;var TITLE_EN="Do You Have Popcorn Brain?";var PASS_EN=["Do You Have Popcorn Brain?", "Imagine this—you are doing your homework at your desk. Suddenly, you remember that your mom asked you to call her. When you pick up your smartphone, a message pops up. It is a new video that was just posted by your favorite channel. You watch the video and keep watching many other short videos. Then, you hear another sound. There is a sale on the shoes that you really want. You were going to ask your mom to buy them for you. Wait, you forgot to call her two hours ago! If this story feels like yours, you may have \"popcorn brain.\" It is easy to experience popcorn brain when you do many things at the same time on your smartphone. You keep moving down the screen and clicking, and many thoughts pop up quickly, like popcorn in a pan! If it happens at night, you may have trouble sleeping. More importantly, people with popcorn brain have trouble paying attention. They cannot concentrate on one thing for a long time. In a study, people were able to focus on one thing for 2.5 minutes in 2004. Nowadays, people can only concentrate for 47 seconds. If you do not want to have popcorn brain, you need to make some changes. Here are some tips.", "Put away your phone. Leave it in another room when you need to focus. Get moving. Play some sports with your friends. Enjoy the small things in life. Feel the sunshine and look at the sky. Try to focus on one thing for a long time. Read a book. Smartphones are useful. They connect people and make life easier. However, using them too much can hurt your brain and your mind. It is important to cut down on screen time. Are you ready to give it a try?"];var PASS_KO=["당신은 팝콘 브레인을 가지고 있나요?", "이런 상상을 해 보세요. 당신은 책상에서 숙제를 하고 있어요. 갑자기 엄마가 당신에게 전화하라고 요청했던 것이 기억나요. 당신이 스마트폰을 집어 들 때, 메시지가 하나 떠요. 그것은 당신이 가장 좋아하는 채널이 방금 올린 새 영상이에요. 당신은 그 영상을 시청하고 다른 많은 짧은 영상들을 계속 시청해요. 그러자 또 다른 소리가 들려요. 당신이 정말 갖고 싶은 신발이 할인 판매 중이에요. 당신은 엄마에게 그것을 사 달라고 부탁하려던 참이었죠. 잠깐, 두 시간 전에 엄마에게 전화하는 것을 잊었네요! 만약 이 이야기가 당신의 이야기처럼 느껴진다면, 당신은 '팝콘 브레인'을 가지고 있을지도 몰라요. 당신이 스마트폰으로 동시에 많은 일을 할 때 팝콘 브레인을 경험하기 쉬워요. 당신이 계속 화면을 아래로 내리고 클릭하면, 마치 팬에 있는 팝콘처럼 많은 생각들이 빠르게 튀어나와요! 만약 이것이 밤에 일어나면, 당신은 잠드는 게 어려울지도 몰라요. 더 중요한 것은, 팝콘 브레인을 가진 사람들은 집중하는 데 어려움을 겪어요. 그들은 한 가지 일에 오랜 시간 동안 집중할 수 없어요. 한 연구에서, 2004년에는 사람들이 한 가지 일에 2분 30초 동안 집중할 수 있었어요. 요즘에는 사람들이 단지 47초 동안만 집중할 수 있어요. 당신이 팝콘 브레인을 가지고 싶지 않다면 변화를 좀 줄 필요가 있어요. 여기에 몇 가지 조언이 있어요.", "전화기를 치우세요. 집중해야 할 때는 전화기를 다른 방에 두세요. 움직이세요. 친구들과 운동을 하세요. 삶에서 소소한 것들을 즐기세요. 햇살을 느끼고 하늘을 보세요. 한 가지 일에 오랫동안 집중하려고 노력해 보세요. 책을 읽으세요. 스마트폰은 유용해요. 그것들은 사람들을 연결해 주고 삶을 더 편하게 해 줘요. 그러나 그것을 너무 많이 사용하는 것은 당신의 두뇌와 정신에 해를 끼칠 수 있어요. 화면을 보는 시간을 줄이는 것이 중요해요. 시도해 볼 준비가 되었나요?"];var DG=[{"dlg": [["W", "May I have your attention, please? This is your English teacher, Ms. Seo.", "주목해 주시겠어요? 저는 여러분의 영어 선생님인 서 선생님이에요."], ["W", "This is a reminder about the English speech contest. It starts on July 2 at 3 p.m. in the Language Hall.", "영어 말하기 대회에 대해 다시 한번 알려 드려요. 대회는 7월 2일 오후 3시에 어학관에서 시작해요."], ["W", "Make sure you are on time. The topic is technology in our lives.", "꼭 제시간에 오세요. 주제는 우리 생활 속의 기술이에요."], ["W", "Speeches should be 3 to 5 minutes long. Don't forget to email your presentation file by tonight. Thank you.", "말하기는 3분에서 5분 길이여야 해요. 오늘 밤까지 발표 파일을 이메일로 보내는 것을 잊지 마세요. 감사합니다."]], "qs": [{"n": 1, "q": "위 담화를 읽고 답할 수 없는 질문은?", "o": ["When does the English speech contest begin?", "Where will the contest be held?", "What should students speak about at the contest?", "How long should students speak at the contest?", "What is the email address for handing in the file?"], "a": 4, "ans": "What is the email address for handing in the file?", "evs": [["W: Speeches should be 3 to 5 minutes long. Don't forget to email your presentation file by tonight. Thank you.", "말하기는 3분에서 5분 길이여야 해요. 오늘 밤까지 발표 파일을 이메일로 보내는 것을 잊지 마세요. 감사합니다."]], "ev": ["W: Speeches should be 3 to 5 minutes long. Don't forget to email your presentation file by tonight. Thank you.", "말하기는 3분에서 5분 길이여야 해요. 오늘 밤까지 발표 파일을 이메일로 보내는 것을 잊지 마세요. 감사합니다."], "memo": ["W: Speeches should be 3 to 5 minutes long. Don't forget to email your presentation file by tonight. Thank you.  (말하기는 3분에서 5분 길이여야 해요. 오늘 밤까지 발표 파일을 이메일로 보내는 것을 잊지 마세요. 감사합니다.)"]}]}, {"dlg": [["W", "Henry, you look tired. What's wrong?", "Henry, 너 피곤해 보이는구나. 무슨 일 있니?"], ["B", "I'm just tired, Mom. I went to bed late last night.", "그냥 피곤해요, 엄마.  return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}

 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}

var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});

var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
