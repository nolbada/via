 ready for school, work, or an event.","GRWM(나와 함께 준비해요)은 학교, 직장, 또는 행사에 가려고 준비하는 사람을 보여주는 인기 있는 브이로그의 한 종류이다."]],"w":"4번 문장에서 GRWM은 학교, 직장, 행사를 위해 준비하는(getting ready) 사람을 보여 줘요. 요리하는 사람이 아니에요.","c":"F"},"h":"40f0c5b8c4"},{"n":3,"t":"tf","q":"Celebrities often use vlogs to connect directly with their fans.","ko":"유명인들은 종종 팬들과 직접 소통하기 위해 브이로그를 이용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"They often use vlogs to directly connect with their fans.","그들은 종종 팬들과 직접적으로 소통하기 위해 브이로그를 이용한다."]],"w":"9번 문장에 They often use vlogs to directly connect with their fans(그들은 종종 팬들과 직접 소통하려고 브이로그를 이용한다)가 그대로 나와요.","c":"T"},"h":"a0810827bb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This makes the content sound more sincere and gives fans the impression of having a personal relationship with them.)","ko":"이것은 그 내용이 더 ( ) 들리도록 만들고, 팬들에게 그들과 사적인 관계를 쌓고 있다는 인상을 준다.","opts":["화난","진실된","지루한","복잡한"],"word":"sincere","r":{"a":"2) 진실된","ev":"10~11번 문장","s":[[10,"They also show their real personalities in their daily lives through vlogs.","그들은 또한 브이로그를 통해서 일상생활 속에서의 그들의 실제 성격을 보여준다."],[11,"This makes the content sound more sincere and gives fans the impression of having a personal relationship with them.","이것은 그 내용이 더 진실되게 들리도록 만들고, 팬들에게 그들과 사적인 관계를 쌓고 있다는 인상을 준다."]],"w":"10번에서 유명인이 일상 속 실제 성격을 보여 줘요. 그래서 내용이 거짓 없이 느껴져 sincere는 '진실된'이에요.","c":2},"h":"04a3dd0e5e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They often use vlogs to directly connect with their fans.)","ko":"그들은 종종 팬들과 ( ) 소통하기 위해 브이로그를 이용한다.","opts":["가끔","우연히","느리게","직접적으로"],"word":"directly","r":{"a":"4) 직접적으로","ev":"9번 문장","s":[[9,"They often use vlogs to directly connect with their fans.","그들은 종종 팬들과 직접적으로 소통하기 위해 브이로그를 이용한다."]],"w":"브이로그를 통해 중간 과정 없이 팬들과 바로 소통한다는 뜻이에요. directly = 직접적으로.","c":4},"h":"9295071d18"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes the content sound more sincere and gives fans the impression of having a personal relationship with them.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 그 내용이 더 진실되게 들리도록 만들고, 팬들에게 그들과 사적인 관계를 쌓고 있다는 인상을 준다.","opts":["시청자들이 요리법을 배우는 것","사람들이 일상을 녹화하는 것","유명인들이 브이로그에서 일상 속 실제 성격을 보여 주는 것","유명인들이 인기를 얻는 것"],"r":{"a":"3) 유명인들이 브이로그에서 일상 속 실제 성격을 보여 주는 것","ev":"10~11번 문장","s":[[10,"They also show their real personalities in their daily lives through vlogs.","그들은 또한 브이로그를 통해서 일상생활 속에서의 그들의 실제 성격을 보여준다."],[11,"This makes the content sound more sincere and gives fans the impression of having a personal relationship with them.","이것은 그 내용이 더 진실되게 들리도록 만들고, 팬들에게 그들과 사적인 관계를 쌓고 있다는 인상을 준다."]],"w":"11번의 This는 바로 앞 10번 문장 전체, 즉 유명인들이 일상 속 실제 성격을 브이로그로 보여 주는 것이에요.","c":3},"h":"b7dce950aa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Do you think your daily activities are interesting enough to share with the world?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신의 일상 활동들이 세상과 공유할 만큼 충분히 흥미롭다고 생각하는가?","opts":["당신의 일상이 세상과 공유할 만큼 충분히 흥미롭다고 생각하는가?","세상이 당신의 일상에 관심이 없다고 생각하는가?","당신의 일상은 너무 재미있어서 혼자만 즐기고 싶은가?","세상을 여행하는 것이 일상보다 흥미롭다고 생각하는가?"],"r":{"a":"1) 당신의 일상이 세상과 공유할 만큼 충분히 흥미롭다고 생각하는가?","ev":"1번 문장","s":[[1,"Do you think your daily activities are interesting enough to share with the world?","당신의 일상 활동들이 세상과 공유할 만큼 충분히 흥미롭다고 생각하는가?"]],"w":"interesting enough to share with the world는 '세상과 공유할 만큼 충분히 흥미로운'이에요. 일상 활동이 공유할 가치가 있는지 묻는 질문이에요.","c":1},"h":"c3808a216e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["시청자들은 요리하는 법을 배우려고 연인들의 브이로그를 본다.","요리사들이 만든 브이로그는 데이트하러 갈 장소에 관한 것이다.","일부 시청자들은 요리 비법과 조리법을 배우려고 요리사들의 브이로그를 본다.","사람들은 일상을 온라인에 절대 공유하지 않는다."],"opts":["Viewers watch couples’ vlogs to learn how to cook.","Vlogs made by chefs are about places to go on a date.","Some viewers watch chefs’ vlogs to learn cooking tips and recipes.","People never share their daily lives online."],"r":{"a":"3) Some viewers watch chefs’ vlogs to learn cooking tips and recipes.","ev":"6~7번 문장","s":[[6,"Some watch couples’ vlogs to get ideas of where to go on a date.","일부는 어디로 데이트하러 갈 건지에 대한 아이디어를 얻기 위해 연인들의 브이로그를 본다."],[7,"Others watch vlogs from chefs to learn cooking tips and recipes.","다른 사람들은 요리 비법과 조리법을 배우기 위해 요리사들의 브이로그를 본다."]],"w":"7번 문장에서 요리사들의 브이로그는 요리 비법과 조리법을 배우려고 본다고 해요. 연인들의 브이로그는 데이트 장소 아이디어(6번)이고, 일상 공유는 2번에서 많은 사람이 해요.","c":3},"h":"e26830eb5b"},{"n":9,"t":"sum","q":"Many people record their daily lives and (A) the videos online, and these videos are called (B).","ko":"많은 사람들이 일상을 녹화해 그 영상을 온라인에 (A)하고, 이 영상들은 (B)라고 불린다.","oko":["(A) 지우다 / (B) 브이로그","(A) 공유하다 / (B) 블로그","(A) 보다 / (B) 조리법","(A) 숨기다 / (B) 정보","(A) 공유하다 / (B) 브이로그"],"opts":["(A) delete / (B) vlogs","(A) share / (B) blogs","(A) watch / (B) recipes","(A) hide / (B) tips","(A) share / (B) vlogs"],"r":{"a":"5) (A) share / (B) vlogs","ev":"2~3번 문장","s":[[2,"Recently, many people have been recording their day-to-day lives and sharing the videos online.","최근에, 많은 사람들이 그들의 일상생활을 녹화하고 온라인에 그 영상을 공유하고 있다."],[3,"These are called video blogs, or vlogs.","이것들은 영상 블로그, 또는 브이로그라고 불린다."]],"w":"2번 문장에서 영상을 온라인에 공유(share)하고, 3번 문장에서 그것들이 video blogs, 즉 vlogs라고 불린다고 해요.","c":5},"h":"5bfb943ae0"},{"n":10,"t":"fill","q":"Celebrities show their real [A] through vlogs, so fans feel they have a personal [B] with them.","ko":"유명인들은 브이로그를 통해 실제 [A]을 보여 주기 때문에, 팬들은 그들과 사적인 [B]를 쌓고 있다고 느낀다.","bank":["personalities","relationship","recipes","couples","directly","viewers"],"bko":{"personalities":"성격","relationship":"관계","recipes":"조리법","couples":"연인들","directly":"직접적으로","viewers":"시청자들"},"r":{"a":"[A] personalities, [B] relationship","ev":"10~11번 문장","s":[[10,"They also show their real personalities in their daily lives through vlogs.","그들은 또한 브이로그를 통해서 일상생활 속에서의 그들의 실제 성격을 보여준다."],[11,"This makes the content sound more sincere and gives fans the impression of having a personal relationship with them.","이것은 그 내용이 더 진실되게 들리도록 만들고, 팬들에게 그들과 사적인 관계를 쌓고 있다는 인상을 준다."]],"w":"10번 문장에서 유명인이 일상 속 실제 성격(personalities)을 보여 주고, 11번 문장에서 팬들이 사적인 관계(personal relationship)를 쌓는다는 인상을 받는다고 해요.","c":null},"h":"6c7737cd17"}]},{"u":7,"id":"hk3-07-4","no":4,"ko":"앗, 혀가 따가워!","items":[{"n":1,"t":"tf","q":"Pineapples contain an enzyme that makes your mouth burn.","ko":"파인애플에는 입이 화끈거리게 만드는 효소가 들어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It’s because pineapples contain an enzyme that makes your mouth burn!","그것은 파인애플에 입이 화끈거리게 만드는 효소가 들어 있기 때문이다!"]],"w":"3번 문장에 pineapples contain an enzyme that makes your mouth burn이 그대로 나와요.","c":"T"},"h":"0bc00e793d"},{"n":2,"t":"tf","q":"The enzyme in pineapples is strong enough to do serious damage to your mouth.","ko":"파인애플 속 효소는 입에 심각한 손상을 줄 만큼 강하다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"It’s too weak to do any serious damage.","그것은 어떠한 심각한 손상을 입히기에는 너무 약하다."]],"w":"5번 문장에서 효소는 너무 약해서(too weak) 심각한 손상을 줄 수 없다고 해요. 반대 내용이에요.","c":"F"},"h":"d799b6c4a7"},{"n":3,"t":"tf","q":"Pineapples are the only fruit that has this enzyme.","ko":"파인애플은 이 효소를 가진 유일한 과일이다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Pineapples are not the only fruit with this enzyme.","파인애플이 이 효소를 가진 유일한 과일은 아니다."]],"w":"10번 문장에서 Pineapples are not the only fruit with this enzyme(파인애플이 이 효소를 가진 유일한 과일은 아니다)이라고 해요.","c":"F"},"h":"7bba6df610"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It’s because pineapples contain an enzyme that makes your mouth burn!)","ko":"그것은 파인애플에 입이 ( ) 만드는 효소가 들어 있기 때문이다!","opts":["화끈거리다","얼다","젖다","가렵다"],"word":"burn","r":{"a":"1) 화끈거리다","ev":"1번, 3번 문장","s":[[1,"You may have noticed that your tongue sometimes feels painful when you eat pineapple.","당신은 파인애플을 먹을 때 혀가 가끔 아프다는 것을 알아차렸을 수도 있다."],[3,"It’s because pineapples contain an enzyme that makes your mouth burn!","그것은 파인애플에 입이 화끈거리게 만드는 효소가 들어 있기 때문이다!"]],"w":"1번에서 혀가 아프다고 했고, 3번은 그 원인이에요. 효소가 입을 따갑고 뜨겁게 만든다는 뜻이라 여기서 burn은 '화끈거리다'예요.","c":1},"h":"672233fe72"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It breaks down the protein in the food we eat, which makes it easier to digest.)","ko":"그것은 우리가 먹는 음식 안의 단백질을 분해하는데, 이는 ( )을 더 쉽게 만든다.","opts":["저장하다","요리하다","소화하다","씹다"],"word":"digest","r":{"a":"3) 소화하다","ev":"8번 문장","s":[[8,"It breaks down the protein in the food we eat, which makes it easier to digest.","그것은 우리가 먹는 음식 안의 단백질을 분해하는데, 이는 소화를 더 쉽게 만든다."]],"w":"효소가 단백질을 분해하면 몸이 음식을 받아들이기 쉬워져요. 먹은 음식과 관련된 digest는 '소화하다'예요.","c":3},"h":"b2b7694b5f"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt’s too weak to do any serious damage.","ko":"밑줄 친 It가 가리키는 것은?","sko":"그것은 어떠한 심각한 손상을 입히기에는 너무 약하다.","opts":["파인애플","파인애플 속 효소","당신의 혀","당신의 입"],"r":{"a":"2) 파인애플 속 효소","ev":"3번, 5번 문장","s":[[3,"It’s because pineapples contain an enzyme that makes your mouth burn!","그것은 파인애플에 입이 화끈거리게 만드는 효소가 들어 있기 때문이다!"],[5,"It’s too weak to do any serious damage.","그것은 어떠한 심각한 손상을 입히기에는 너무 약하다."]],"w":"5번의 It은 너무 약해서 심각한 손상을 못 주는 것이에요. 3번 문장의 an enzyme(효소)이 그 주인공이에요.","c":2},"h":"ab62e7c62c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Besides, this enzyme is what makes pineapple helpful.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"게다가, 이 효소는 파인애플을 도움이 되도록 만들어주는 것이다.","opts":["게다가, 파인애플은 이 효소를 도와주는 것이다.","게다가, 이 효소 때문에 파인애플은 도움이 되지 않는다.","게다가, 이 효소는 파인애플에 들어 있지 않은 것이다.","게다가, 이 효소는 파인애플을 도움이 되게 만드는 것이다."],"r":{"a":"4) 게다가, 이 효소는 파인애플을 도움이 되게 만드는 것이다.","ev":"7번 문장","s":[[7,"Besides, this enzyme is what makes pineapple helpful.","게다가, 이 효소는 파인애플을 도움이 되도록 만들어주는 것이다."]],"w":"what makes pineapple helpful은 '파인애플을 도움이 되게 만드는 것'이에요. this enzyme이 바로 그것이라는 뜻이에요.","c":4},"h":"262dccb64e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파인애플은 소고기나 돼지고기 요리에 단백질이 거의 없어서 함께 제공된다.","파인애플은 종종 많은 단백질이 들어 있는 요리들과 함께 제공된다.","파인애플 속 효소는 단백질을 소화하기 더 어렵게 만든다.","그 효소는 입을 너무 심하게 아프게 해서 절대 낫지 않는다."],"opts":["Pineapple is served with beef or pork because those dishes have little protein.","Pineapple is often served with dishes that contain lots of protein.","The enzyme in pineapple makes protein harder to digest.","The enzyme hurts your mouth so badly that it can never heal."],"r":{"a":"2) Pineapple is often served with dishes that contain lots of protein.","ev":"6번, 8번, 9번 문장","s":[[6,"And your mouth is capable of healing itself quickly.","그리고 당신의 입은 스스로 빠르게 치유할 수 있다."],[8,"It breaks down the protein in the food we eat, which makes it easier to digest.","그것은 우리가 먹는 음식 안의 단백질을 분해하는데, 이는 소화를 더 쉽게 만든다."],[9,"For this reason, pineapple is often served with dishes that contain lots of protein, such as beef or pork.","이러한 이유로, 파인애플은 종종 소고기나 돼지고기와 같이 많은 단백질이 들어 있는 요리들과 함께 제공된다."]],"w":"9번 문장에서 파인애플은 단백질이 많은 요리와 자주 함께 나온다고 해요. 8번에서 효소가 단백질 분해로 소화를 쉽게 하고, 6번에서 입은 스스로 빠르게 치유된다고 했어요.","c":2},"h":"90f001c17d"},{"n":9,"t":"sum","q":"The enzyme in pineapples makes your mouth (A), but it is also helpful because it makes it easier to (B) the protein in food.","ko":"파인애플 속 효소는 입이 (A)하게 만들지만, 음식 속 단백질을 (B)하는 것을 더 쉽게 해 주어 도움도 된다.","oko":["(A) 얼다 / (B) 소화하다","(A) 화끈거리다 / (B) 저장하다","(A) 화끈거리다 / (B) 소화하다","(A) 치유되다 / (B) 요리하다","(A) 얼다 / (B) 요리하다"],"opts":["(A) freeze / (B) digest","(A) burn / (B) store","(A) burn / (B) digest","(A) heal / (B) cook","(A) freeze / (B) cook"],"r":{"a":"3) (A) burn / (B) digest","ev":"3번, 8번 문장","s":[[3,"It’s because pineapples contain an enzyme that makes your mouth burn!","그것은 파인애플에 입이 화끈거리게 만드는 효소가 들어 있기 때문이다!"],[8,"It breaks down the protein in the food we eat, which makes it easier to digest.","그것은 우리가 먹는 음식 안의 단백질을 분해하는데, 이는 소화를 더 쉽게 만든다."]],"w":"3번 문장에서 효소는 입이 화끈거리게(burn) 만들고, 8번 문장에서 단백질을 분해해 소화(digest)를 쉽게 한다고 해요.","c":3},"h":"634f779c87"},{"n":10,"t":"fill","q":"Pineapples are not the only [A] with this enzyme. Many other fruits like [B] and mangoes have it, too.","ko":"파인애플은 이 효소를 가진 유일한 [A]이 아니다. [B]와 망고 같은 많은 다른 과일들도 그것을 가지고 있다.","bank":["fruit","kiwis","enzyme","damage","protein","stinging"],"bko":{"fruit":"과일","kiwis":"키위","enzyme":"효소","damage":"손상","protein":"단백질","stinging":"찌르는 듯한"},"r":{"a":"[A] fruit, [B] kiwis","ev":"10~11번 문장","s":[[10,"Pineapples are not the only fruit with this enzyme.","파인애플이 이 효소를 가진 유일한 과일은 아니다."],[11,"Many other fruits like kiwis and mangoes have it, and they cause a stinging feeling, too!","키위와 망고 같은 많은 다른 과일들이 그것을 가지고 있고, 그것들 역시 찌르는 듯한 느낌을 유발한다!"]],"w":"10번 문장에서 파인애플이 이 효소를 가진 유일한 fruit(과일)이 아니라고 하고, 11번 문장에서 kiwis(키위)와 망고도 가지고 있다고 해요.","c":null},"h":"17d46f7e18"}]},{"u":8,"id":"hk3-08-1","no":1,"ko":"비단길 따라 6,400km","items":[{"n":1,"t":"tf","q":"Aladdin and the Magic Lamp is a popular story of an Arabian character named Aladdin.","ko":"<알라딘과 마법의 램프>는 알라딘이라는 이름의 아랍인 캐릭터에 대한 인기 있는 이야기이다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Aladdin and the Magic Lamp is a popular story of an Arabian character named Aladdin.","<알라딘과 마법의 램프>는 알라딘이라는 이름의 한 아랍인 캐릭터에 대한 인기 있는 이야기이다."]],"w":"1번 문장에 그대로 나와요. 알라딘이라는 이름의 아랍인 캐릭터에 대한 인기 있는 이야기라고 해요.","c":"T"},"h":"a3a8fc7623"},{"n":2,"t":"tf","q":"In the original book, the story takes place in the Middle East.","ko":"원작에서, 그 이야기는 중동에서 일어난다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"However, in the original book, the story is set somewhere in China!","하지만, 원작에서, 그 이야기는 중국 어딘가를 배경으로 한다!"]],"w":"3번 문장에서 원작에서는 이야기가 중국 어딘가를 배경으로 한다고 해요. 중동은 많은 책과 영화(2번)의 배경이에요.","c":"F"},"h":"8e80a1db2b"},{"n":3,"t":"tf","q":"The Silk Road got its name because silk was the most popular item sold along it.","ko":"비단길은 비단이 그 길을 따라 팔린 가장 인기 있는 상품이었기 때문에 그 이름을 얻었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Silk was the most popular item, so it became the road’s name.","비단이 가장 인기있는 상품이어서, 그것이 길의 이름이 되었다."]],"w":"9번 문장에서 Silk was the most popular item, so it became the road's name(비단이 가장 인기 있는 상품이어서 길의 이름이 되었다)이라고 해요.","c":"T"},"h":"905ef7fe31"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Chinese merchants sold various kinds of goods, including tea and silk, along the routes to the Middle East and Rome.)","ko":"중국 ( )은 중동과 로마로 향하는 경로를 따라, 차와 비단을 포함하여, 다양한 종류의 상품을 팔았다.","opts":["상인들","학자들","군인들","농부들"],"word":"merchants","r":{"a":"1) 상인들","ev":"8번 문장","s":[[8,"Chinese merchants sold various kinds of goods, including tea and silk, along the routes to the Middle East and Rome.","중국 상인들은 중동과 로마로 향하는 경로를 따라, 차와 비단을 포함하여, 다양한 종류의 상품을 팔았다."]],"w":"상품을 팔았다는 말에서 merchants는 물건을 사고파는 '상인들'이에요. 10번에서 같은 사람들을 traders(상인들)라고도 불러요.","c":1},"h":"9afda2eefd"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In addition to merchandise, Chinese traders also shared various other things, like their food and fables.)","ko":"상품에 더해, 중국 상인들은 그들의 음식과 ( )와 같은 다양한 다른 것들도 공유했다.","opts":["무기","약","지도","우화"],"word":"fables","r":{"a":"4) 우화","ev":"10~11번 문장","s":[[10,"In addition to merchandise, Chinese traders also shared various other things, like their food and fables.","상품에 더해, 중국 상인들은 그들의 음식과 우화와 같은 다양한 다른 것들도 공유했다."],[11,"As a result of this cultural exchange, stories like Aladdin’s developed.","이러한 문화적 교류의 결과로, 알라딘의 이야기와 같은 이야기들이 생겨났다."]],"w":"음식과 함께 공유한 것이고, 11번에서 그 결과 알라딘 같은 이야기들이 생겼다고 해요. 그래서 fables는 옛이야기인 '우화'예요.","c":4},"h":"e9e609f3b2"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt might be because of the Silk Road.","ko":"밑줄 친 It가 가리키는 것은?","sko":"그것은 비단길 때문일 수도 있다.","opts":["알라딘과 마법의 램프 이야기","서로 매우 다른 두 문화가 하나의 옛이야기 속에 나타난 것","비단길의 길이","중국 상인들"],"r":{"a":"2) 서로 매우 다른 두 문화가 하나의 옛이야기 속에 나타난 것","ev":"4~5번 문장","s":[[4,"How did two very different cultures appear in one old story, then?","그렇다면, 서로 매우 다른 두 문화가 어떻게 하나의 옛이야기 속에 나타났을까?"],[5,"It might be because of the Silk Road.","그것은 비단길 때문일 수도 있다."]],"w":"5번의 It은 바로 앞 4번 질문의 상황이에요. 서로 매우 다른 두 문화가 하나의 옛이야기에 나타난 것이 비단길 때문일 수도 있다는 말이에요.","c":2},"h":"bb26492568"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result of this cultural exchange, stories like Aladdin’s developed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 문화적 교류의 결과로, 알라딘의 이야기와 같은 이야기들이 생겨났다.","opts":["알라딘의 이야기 때문에 문화적 교류가 시작되었다.","문화적 교류의 결과로 알라딘 같은 이야기들이 사라졌다.","이러한 문화적 교류 덕분에 알라딘 같은 이야기들이 만들어지게 되었다.","알라딘의 이야기는 문화적 교류와 아무 관련이 없다."],"r":{"a":"3) 이러한 문화적 교류 덕분에 알라딘 같은 이야기들이 만들어지게 되었다.","ev":"11번 문장","s":[[11,"As a result of this cultural exchange, stories like Aladdin’s developed.","이러한 문화적 교류의 결과로, 알라딘의 이야기와 같은 이야기들이 생겨났다."]],"w":"As a result of ~는 '~의 결과로'예요. 문화적 교류가 원인이고 알라딘 같은 이야기가 결과예요. 원인과 결과가 뒤바뀐 ①은 틀려요.","c":3},"h":"91240c26e9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["비단길은 길이가 64킬로미터밖에 안 되는 짧은 길이었다.","중국 상인들은 중동과 로마로 향하는 경로를 따라 차와 비단 같은 상품을 팔았다.","비단길은 가장 인기 있는 상품인 차의 이름을 따서 지어졌다.","비단길은 중동과 아프리카를 연결했다."],"opts":["The Silk Road was a short road that was only 64 kilometers long.","Chinese merchants sold goods such as tea and silk along the routes to the Middle East and Rome.","The Silk Road was named after tea, the most popular item.","The Silk Road connected the Middle East with Africa."],"r":{"a":"2) Chinese merchants sold goods such as tea and silk along the routes to the Middle East and Rome.","ev":"7~9번 문장","s":[[7,"This 6,400-kilometer-long road connected China to countries in the West.","이 6,400킬로미터 길이의 길은 중국을 서구권에 연결해 주었다."],[8,"Chinese merchants sold various kinds of goods, including tea and silk, along the routes to the Middle East and Rome.","중국 상인들은 중동과 로마로 향하는 경로를 따라, 차와 비단을 포함하여, 다양한 종류의 상품을 팔았다."],[9,"Silk was the most popular item, so it became the road’s name.","비단이 가장 인기있는 상품이어서, 그것이 길의 이름이 되었다."]],"w":"8번 문장에서 중국 상인들이 중동과 로마로 향하는 경로를 따라 차와 비단 같은 상품을 팔았다고 해요. 7번에서 길이는 6,400킬로미터이고 중국과 서구권을 연결했으며, 9번에서 이름은 비단에서 왔어요.","c":2},"h":"5344a7412e"},{"n":9,"t":"sum","q":"Because of the Silk Road, which (A) China to the West, very different (B) met in one old story.","ko":"중국을 서구권에 (A)한 비단길 덕분에, 매우 다른 (B)가 하나의 옛이야기 속에서 만났다.","oko":["(A) 분리했다 / (B) 문화","(A) 연결했다 / (B) 음식","(A) 보호했다 / (B) 상품","(A) 분리했다 / (B) 상인","(A) 연결했다 / (B) 문화"],"opts":["(A) separated / (B) cultures","(A) connected / (B) foods","(A) protected / (B) goods","(A) separated / (B) merchants","(A) connected / (B) cultures"],"r":{"a":"5) (A) connected / (B) cultures","ev":"4번, 5번, 7번 문장","s":[[4,"How did two very different cultures appear in one old story, then?","그렇다면, 서로 매우 다른 두 문화가 어떻게 하나의 옛이야기 속에 나타났을까?"],[5,"It might be because of the Silk Road.","그것은 비단길 때문일 수도 있다."],[7,"This 6,400-kilometer-long road connected China to countries in the West.","이 6,400킬로미터 길이의 길은 중국을 서구권에 연결해 주었다."]],"w":"7번에서 비단길은 중국을 서구권 국가들에 연결(connected)했고, 4~5번에서 그 덕분에 서로 매우 다른 두 문화(cultures)가 한 이야기에 나타났을 수 있다고 해요.","c":5},"h":"a402618154"},{"n":10,"t":"fill","q":"As a result of cultural [A] along the Silk Road, [B] like Aladdin’s developed.","ko":"비단길을 따라 이루어진 문화적 [A]의 결과로, 알라딘의 것과 같은 [B]가 생겨났다.","bank":["exchange","stories","silk","tea","routes","merchants"],"bko":{"exchange":"교류","stories":"이야기들","silk":"비단","tea":"차","routes":"경로들","merchants":"상인들"},"r":{"a":"[A] exchange, [B] stories","ev":"10~11번 문장","s":[[10,"In addition to merchandise, Chinese traders also shared various other things, like their food and fables.","상품에 더해, 중국 상인들은 그들의 음식과 우화와 같은 다양한 다른 것들도 공유했다."],[11,"As a result of this cultural exchange, stories like Aladdin’s developed.","이러한 문화적 교류의 결과로, 알라딘의 이야기와 같은 이야기들이 생겨났다."]],"w":"11번 문장에서 이러한 cultural exchange(문화적 교류)의 결과로 알라딘의 이야기 같은 stories(이야기들)가 생겨났다고 해요.","c":null},"h":"a62c56ed47"}]},{"u":8,"id":"hk3-08-2","no":2,"ko":"커튼이 왜 거기서 나와?","items":[{"n":1,"t":"tf","q":"Valley Curtain was a 381-meter-long wall of orange cloth.","ko":"<계곡의 커튼>은 381미터 길이의 주황색 천으로 된 벽이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It was a 381-meter-long wall of orange cloth hanging between two Colorado mountain slopes.","그것은 두 콜로라도 산비탈 사이에 걸려 있는 381미터 길이의 주황색 천으로 된 벽이었다."]],"w":"2번 문장에 It was a 381-meter-long wall of orange cloth가 그대로 나와요.","c":"T"},"h":"dd19ef61f0"},{"n":2,"t":"tf","q":"The artists installed the curtain before they sketched its shape.","ko":"작가들은 커튼의 형태를 밑그림으로 그리기 전에 커튼을 설치했다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"For 28 months between 1970 and 1972, they sketched the curtain’s shape, dyed a huge piece of fabric, and found a suitable valley.","1970년에서 1972년 사이의 28개월 동안, 그들은 커튼의 형태의 밑그림을 그리고, 엄청난 크기의 천 조각을 염색하고, 그리고 적절한 계곡을 발견했다."],[5,"Then, they gathered a team of 100 engineers and installed the curtain.","그 다음, 그들은 100명의 공학자들로 된 팀을 모으고 커튼을 설치했다."]],"w":"4번에서 밑그림을 그리고 염색하고 계곡을 찾은 다음, 5번에서 Then(그 다음) 커튼을 설치했어요. 순서가 반대예요.","c":"F"},"h":"ae0ffa5781"},{"n":3,"t":"tf","q":"Land artists want their work to be a part of nature.","ko":"대지 미술가들은 그들의 작품이 자연의 일부가 되기를 원한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Land artists want their work to be a part of nature.","대지 미술가들은 그들의 작품이 자연의 일부가 되기를 원한다."]],"w":"10번 문장에 Land artists want their work to be a part of nature가 그대로 나와요.","c":"T"},"h":"4bb1ad4b8e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For 28 months between 1970 and 1972, they sketched the curtain’s shape, dyed a huge piece of fabric, and found a suitable valley.)","ko":"1970년에서 1972년 사이의 28개월 동안, 그들은 커튼의 형태의 밑그림을 그리고, 엄청난 크기의 천 조각을 염색하고, ( ) 계곡을 발견했다.","opts":["위험한","거대한","낡은","적절한"],"word":"suitable","r":{"a":"4) 적절한","ev":"4번 문장","s":[[4,"For 28 months between 1970 and 1972, they sketched the curtain’s shape, dyed a huge piece of fabric, and found a suitable valley.","1970년에서 1972년 사이의 28개월 동안, 그들은 커튼의 형태의 밑그림을 그리고, 엄청난 크기의 천 조각을 염색하고, 그리고 적절한 계곡을 발견했다."]],"w":"커튼을 걸 수 있는 곳을 찾는 일이에요. 준비 과정에서 알맞은 계곡을 찾았다는 뜻이라 suitable은 '적절한'이에요.","c":4},"h":"4fcb5249cb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They had to remove the work, but they were not frustrated.)","ko":"그들은 그 작품을 치워야 했지만, ( ) 않았다.","opts":["기뻐하는","좌절한","놀란","피곤한"],"word":"frustrated","r":{"a":"2) 좌절한","ev":"7~8번 문장","s":[[7,"They had to remove the work, but they were not frustrated.","그들은 그 작품을 치워야 했지만, 좌절하지 않았다."],[8,"In fact, this was close to what they expected!","사실, 이것은 그들이 기대했던 것에 가까웠다!"]],"w":"but(하지만)으로 앞과 대조돼요. 작품을 치워야 했지만 좌절하지 않았고, 8번에서 사실은 기대했던 것에 가까웠다고 해요. frustrated는 '좌절한'이에요.","c":2},"h":"e069d8f2a8"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nIn fact, this was close to what they expected!","ko":"밑줄 친 this가 가리키는 것은?","sko":"사실, 이것은 그들이 기대했던 것에 가까웠다!","opts":["커튼의 크기가 381미터였던 것","작품이 강풍에 의해 파괴된 것","100명의 공학자가 일한 것","작품이 콜로라도에 걸려 있던 것"],"r":{"a":"2) 작품이 강풍에 의해 파괴된 것","ev":"6~8번 문장","s":[[6,"However, the work was destroyed by strong winds, just 28 hours after it was installed.","하지만, 그 작품은 설치된 지단 28시간 후에, 강풍에 의해 파괴되었다."],[7,"They had to remove the work, but they were not frustrated.","그들은 그 작품을 치워야 했지만, 좌절하지 않았다."],[8,"In fact, this was close to what they expected!","사실, 이것은 그들이 기대했던 것에 가까웠다!"]],"w":"8번 this는 바로 앞 내용이에요. 작품이 강풍에 파괴되어 치워야 했던 일(6~7번)이 그들이 기대한 것에 가까웠다는 뜻이에요.","c":2},"h":"f475097891"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the end, it was also finished by nature.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결국, 그것은 자연에 의해 마무리도 지어졌다.","opts":["마지막에는 그 작품도 자연의 힘으로 끝이 났다.","마지막에는 그 작품이 자연보다 더 오래 남았다.","마지막에는 작가들이 직접 작품을 완성했다.","마지막에는 자연이 작품을 만드는 것을 도왔다."],"r":{"a":"1) 마지막에는 그 작품도 자연의 힘으로 끝이 났다.","ev":"12번 문장","s":[[12,"In the end, it was also finished by nature.","결국, 그것은 자연에 의해 마무리도 지어졌다."]],"w":"finished by nature는 '자연에 의해 마무리되다'예요. 작품은 자연과 함께 변하다가 결국 자연(강풍)에 의해 끝났어요.","c":1},"h":"78518a61c5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["작가들은 작품을 준비하는 데 겨우 하루가 걸렸다.","작가들은 누구의 도움도 없이 커튼을 설치했다.","작가들은 100명의 공학자들로 된 팀을 모으고 커튼을 설치했다.","그 작품은 설치된 후 28개월 동안 계곡에 있었다."],"opts":["It took the artists only one day to prepare the work.","The artists installed the curtain without anyone’s help.","The artists gathered a team of 100 engineers and installed the curtain.","The work stayed in the valley for 28 months after it was installed."],"r":{"a":"3) The artists gathered a team of 100 engineers and installed the curtain.","ev":"4~6번 문장","s":[[4,"For 28 months between 1970 and 1972, they sketched the curtain’s shape, dyed a huge piece of fabric, and found a suitable valley.","1970년에서 1972년 사이의 28개월 동안, 그들은 커튼의 형태의 밑그림을 그리고, 엄청난 크기의 천 조각을 염색하고, 그리고 적절한 계곡을 발견했다."],[5,"Then, they gathered a team of 100 engineers and installed the curtain.","그 다음, 그들은 100명의 공학자들로 된 팀을 모으고 커튼을 설치했다."],[6,"However, the work was destroyed by strong winds, just 28 hours after it was installed.","하지만, 그 작품은 설치된 지단 28시간 후에, 강풍에 의해 파괴되었다."]],"w":"5번 문장에서 100명의 공학자 팀을 모아 설치했다고 해요. 4번에서 준비에 28개월이 걸렸고, 6번에서 설치 28시간 후에 파괴되었어요.","c":3},"h":"d651df5833"},{"n":9,"t":"sum","q":"Valley Curtain is an example of (A) art, because it changed with the movement of (B).","ko":"<계곡의 커튼>은 (B)의 움직임과 함께 변했기 때문에 (A) 미술의 한 예이다.","oko":["(A) 팝 / (B) 자연","(A) 대지 / (B) 사람들","(A) 팝 / (B) 천","(A) 거리 / (B) 공학자들","(A) 대지 / (B) 자연"],"opts":["(A) pop / (B) nature","(A) land / (B) people","(A) pop / (B) cloth","(A) street / (B) engineers","(A) land / (B) nature"],"r":{"a":"5) (A) land / (B) nature","ev":"9번, 11번 문장","s":[[9,"This style of artwork is known as land art or Earth art.","이러한 양식의 예술 작품은 대지 미술이라고 알려져 있다."],[11,"Valley Curtain, for example, swayed as the wind blew, so it changed with the movement of nature.","예를 들어, <계곡의 커튼>은 바람이 불 때 흔들려서, 자연의 움직임과 함께 변화했다."]],"w":"9번 문장에서 이런 양식은 land art(대지 미술)이고, 11번 문장에서 <계곡의 커튼>이 자연(nature)의 움직임과 함께 변했다고 해요.","c":5},"h":"d9391a795c"},{"n":10,"t":"fill","q":"Valley Curtain was destroyed by strong [A] just 28 [B] after it was installed.","ko":"<계곡의 커튼>은 설치된 지 단 28 [B] 후에 강한 [A]에 의해 파괴되었다.","bank":["winds","hours","valley","engineers","cloth","nature"],"bko":{"winds":"바람","hours":"시간","valley":"계곡","engineers":"공학자들","cloth":"천","nature":"자연"},"r":{"a":"[A] winds, [B] hours","ev":"6번 문장","s":[[6,"However, the work was destroyed by strong winds, just 28 hours after it was installed.","하지만, 그 작품은 설치된 지단 28시간 후에, 강풍에 의해 파괴되었다."]],"w":"6번 문장에서 작품은 strong winds(강풍)에 의해, 설치된 지 just 28 hours(단 28시간) 후에 파괴되었다고 해요.","c":null},"h":"bed31ec339"}]},{"u":8,"id":"hk3-08-3","no":3,"ko":"횡단보도가 둥둥 떠 있어요!","items":[{"n":1,"t":"tf","q":"Tim soon realized that the floating crosswalk was just an illusion.","ko":"Tim은 떠다니는 횡단보도가 단지 환상이라는 것을 곧 깨달았다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He slowed down with caution and soon realized that it was just an illusion.","그는 경계심과 함께 속도를 줄였고 곧 그것이 단지 환상이었다는 것을 깨달았다."]],"w":"3번 문장에 He slowed down with caution and soon realized that it was just an illusion이 나와요.","c":"T"},"h":"46bebd8e06"},{"n":2,"t":"tf","q":"The first crosswalk of this type was invented in a town in Spain.","ko":"이런 유형의 첫 횡단보도는 스페인의 한 마을에서 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"This was a new type of crosswalk that was invented in a town in Iceland.","이것은 아이슬란드의 한 마을에서 만들어진 새로운 유형의 횡단보도였다."]],"w":"4번 문장에서 이 새로운 유형의 횡단보도는 아이슬란드의 한 마을에서 만들어졌다고 해요. 스페인은 12번에서 사용하는 나라 중 하나예요.","c":"F"},"h":"caaf012f53"},{"n":3,"t":"tf","q":"The crosswalks are used in several other countries, such as France, China, and Spain.","ko":"그 횡단보도는 프랑스, 중국, 스페인 같은 여러 다른 나라들에서 사용된다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"The crosswalks are now used in several other countries, including France, China, and Spain.","그 횡단보도는 현재 프랑스, 중국, 그리고 스페인을 포함하여, 여러 다른 나라들에서 사용된다."]],"w":"12번 문장에 several other countries, including France, China, and Spain이 나와요.","c":"T"},"h":"1cba0f5644"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day, Tim saw something astonishing while driving to work.)","ko":"어느 날, Tim은 직장으로 운전을 하는 동안 무언가 ( ) 것을 봤다.","opts":["지루한","익숙한","놀라운","끔찍한"],"word":"astonishing","r":{"a":"3) 놀라운","ev":"1~2번 문장","s":[[1,"One day, Tim saw something astonishing while driving to work.","어느 날, Tim은 직장으로 운전을 하는 동안 무언가 놀라운 것을 봤다."],[2,"The crosswalk was floating!","횡단보도가 떠다니고 있었다!"]],"w":"2번에서 횡단보도가 떠다니고 있었어요. 길 위에서 횡단보도가 떠다니는 모습이니 astonishing은 '놀라운'이에요.","c":3},"h":"3f5cdea968"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He slowed down with caution and soon realized that it was just an illusion.)","ko":"그는 ( )과 함께 속도를 줄였고 곧 그것이 단지 환상이었다는 것을 깨달았다.","opts":["경계심","분노","기쁨","피로"],"word":"caution","r":{"a":"1) 경계심","ev":"3번 문장","s":[[3,"He slowed down with caution and soon realized that it was just an illusion.","그는 경계심과 함께 속도를 줄였고 곧 그것이 단지 환상이었다는 것을 깨달았다."]],"w":"떠다니는 횡단보도를 보고 조심하면서 속도를 줄였어요. caution은 '경계심, 조심'이에요.","c":1},"h":"4057958fa2"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey are painted on a flat surface by using clever shading techniques that make them look like white boards floating above the street!","ko":"밑줄 친 them이 가리키는 것은?","sko":"그것은 길 위에 떠다니는 흰색 판자들처럼 보이도록 만드는 기발한 명암 기법을 이용해서 평평한 표면 위에 그려진다!","opts":["흰색 판자들","횡단보도들","운전자들","과속방지턱들"],"r":{"a":"2) 횡단보도들","ev":"6~7번 문장","s":[[6,"These crosswalks appeared to be 3D, but are actually optical illusions.","이 횡단보도는 3D인 것처럼 보였지만, 실제로는 착시 현상이다."],[7,"They are painted on a flat surface by using clever shading techniques that make them look like white boards floating above the street!","그것은 길 위에 떠다니는 흰색 판자들처럼 보이도록 만드는 기발한 명암 기법을 이용해서 평평한 표면 위에 그려진다!"]],"w":"them은 '흰 판자처럼 보이게 되는' 대상이에요. 7번 앞부분의 They는 6번의 These crosswalks이고, them도 그 횡단보도들이에요. 흰 판자는 비교 대상(look like ~)이에요.","c":2},"h":"d1df6bac23"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"From far away, people appear as if they were walking on air.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"멀리서, 사람들은 마치 공중에서 걷고 있는 것처럼 보인다.","opts":["멀리서 보면 사람들이 마치 공중을 걷고 있는 것처럼 보인다.","멀리서 보면 사람들이 실제로 공중에서 걷고 있다.","가까이서 보면 사람들이 공중을 걷는 것처럼 보인다.","멀리서 보면 사람들이 걷지 않고 서 있는 것처럼 보인다."],"r":{"a":"1) 멀리서 보면 사람들이 마치 공중을 걷고 있는 것처럼 보인다.","ev":"11번 문장","s":[[11,"From far away, people appear as if they were walking on air.","멀리서, 사람들은 마치 공중에서 걷고 있는 것처럼 보인다."]],"w":"as if ~는 '마치 ~인 것처럼'이에요. 실제로 공중을 걷는 것이 아니라, 멀리서 그렇게 보인다는 뜻이에요.","c":1},"h":"6970d64845"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아이슬란드의 횡단보도는 주민들이 빠르게 달리는 차를 좋아해서 만들어졌다.","그 횡단보도는 평평한 표면 위에 그려진 착시 현상이다.","그 횡단보도는 길 위에 떠다니는 진짜 흰색 판자로 만들어졌다.","그 횡단보도는 프랑스, 중국, 스페인에서 처음 사용되었다."],"opts":["The crosswalks in Iceland were made because residents liked fast-driving cars.","The crosswalks are optical illusions painted on a flat surface.","The crosswalks are made of real white boards floating above the road.","The crosswalks were first used in France, China, and Spain."],"r":{"a":"2) The crosswalks are optical illusions painted on a flat surface.","ev":"5~7번 문장","s":[[5,"The residents were afraid of fast-driving cars, so special crosswalks were installed in the town.","그 주민들은 빠르게 달리는 차들을 두려워해서, 특별한 횡단보도가 마을에 설치되었다."],[6,"These crosswalks appeared to be 3D, but are actually optical illusions.","이 횡단보도는 3D인 것처럼 보였지만, 실제로는 착시 현상이다."],[7,"They are painted on a flat surface by using clever shading techniques that make them look like white boards floating above the street!","그것은 길 위에 떠다니는 흰색 판자들처럼 보이도록 만드는 기발한 명암 기법을 이용해서 평평한 표면 위에 그려진다!"]],"w":"6~7번에서 3D처럼 보이지만 실제로는 평평한 표면 위에 그려진 착시라고 해요. 5번에서 주민들은 빠른 차를 두려워했고, 처음 만든 곳은 아이슬란드 마을이에요(4번).","c":2},"h":"1f0498b949"},{"n":9,"t":"sum","q":"These crosswalks are (A) than speed bumps, but they still increase drivers’ (B).","ko":"이 횡단보도는 과속방지턱보다 (A)지만, 여전히 운전자들의 (B)을 높인다.","oko":["(A) 더 비싸 / (B) 경계심","(A) 더 싸 / (B) 속도","(A) 더 비싸 / (B) 분노","(A) 더 싸 / (B) 경계심","(A) 더 싸 / (B) 돈"],"opts":["(A) more expensive / (B) caution","(A) cheaper / (B) speed","(A) more expensive / (B) anger","(A) cheaper / (B) caution","(A) cheaper / (B) money"],"r":{"a":"4) (A) cheaper / (B) caution","ev":"8~9번 문장","s":[[8,"These crosswalks are helpful in many ways.","이 횡단보도는 많은 방면에서 도움이 된다."],[9,"They’re much cheaper than speed bumps, but they still increase drivers’ caution.","그것은 과속방지턱보다 훨씬 더 싸지만, 여전히 운전자들의 경계심을 높인다."]],"w":"9번 문장에서 과속방지턱보다 훨씬 더 싸지만(cheaper) 여전히 운전자들의 경계심(caution)을 높인다고 해요.","c":4},"h":"4984f32b2d"},{"n":10,"t":"fill","q":"Pedestrians love the crosswalks because, from far away, people appear as if they were [A] on [B].","ko":"보행자들은 그 횡단보도를 좋아하는데, 멀리서 보면 사람들이 마치 [B] 위를 [A] 것처럼 보이기 때문이다.","bank":["walking","air","caution","illusion","residents","cheaper"],"bko":{"walking":"걷는","air":"공중","caution":"경계심","illusion":"착시","residents":"주민들","cheaper":"더 싼"},"r":{"a":"[A] walking, [B] air","ev":"10~11번 문장","s":[[10,"Pedestrians also love them.","보행자들 또한 그것을 좋아한다."],[11,"From far away, people appear as if they were walking on air.","멀리서, 사람들은 마치 공중에서 걷고 있는 것처럼 보인다."]],"w":"10번 문장에서 보행자들이 이 횡단보도를 좋아하고, 11번 문장에서 멀리서 사람들이 마치 walking on air(공중을 걷는 것)처럼 보인다고 해요.","c":null},"h":"b520e44ba3"}]},{"u":8,"id":"hk3-08-4","no":4,"ko":"잔뜩 사둬도 불안해~","items":[{"n":1,"t":"tf","q":"People who feared that the store would run out of supplies had already bought the goods.","ko":"가게가 재고가 동날 것을 두려워한 사람들이 이미 상품을 구매했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Actually, they were already bought by people who feared that the store would run out of supplies.","사실, 그것들은 이미 그 가게가 재고가 동나는 것을 두려워한 사람들에 의해 구매되었다."]],"w":"3번 문장에 they were already bought by people who feared that the store would run out of supplies가 나와요.","c":"T"},"h":"d850920367"},{"n":2,"t":"tf","q":"People tend to buy only a small number of products whenever there is a disaster.","ko":"재난이 있을 때마다 사람들은 적은 수의 상품만 사는 경향이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Whenever there is a disaster, people tend to buy lots of products and store them.","재난이 있을 때마다, 사람들은 대량의 상품을 사고 그것들을 비축하는 경향이 있다."]],"w":"4번 문장에서 재난이 있을 때마다 사람들은 lots of products(많은 상품)를 사서 비축하는 경향이 있다고 해요.","c":"F"},"h":"87313c757d"},{"n":3,"t":"tf","q":"COVID-19 made many people around the world feel frightened.","ko":"코로나19는 전 세계 많은 사람들이 겁에 질리게 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In 2020, COVID-19 caused many people worldwide to be frightened.","2020년에, 코로나19는 전 세계 많은 사람들이 겁에 질리도록 만들었다."]],"w":"6번 문장에 COVID-19 caused many people worldwide to be frightened이 나와요.","c":"T"},"h":"a7ee6b00fa"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They were scared of running out of supplies, so they bought enormous amounts of toilet paper, water, and canned food.)","ko":"그들은 물자가 동나는 것을 두려워해서, ( ) 양의 화장지, 물, 그리고 통조림 식품을 샀다.","opts":["적은","비싼","가벼운","엄청난"],"word":"enormous","r":{"a":"4) 엄청난","ev":"7번 문장","s":[[7,"They were scared of running out of supplies, so they bought enormous amounts of toilet paper, water, and canned food.","그들은 물자가 동나는 것을 두려워해서, 엄청난 양의 화장지, 물, 그리고 통조림 식품을 샀다."]],"w":"물자가 동날까 봐 무서워서 산 것이니 아주 많이 샀어요. enormous는 '엄청난'이에요.","c":4},"h":"3ac94c36f1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Some people may not be able to get these necessities at all, which can put their lives in danger.)","ko":"몇몇 사람들은 이러한 ( )을 전혀 구하지 못할 수도 있는데, 이는 그들의 생명을 위험에 빠뜨릴 수 있다.","opts":["장난감","필수품","선물","광고"],"word":"necessities","r":{"a":"2) 필수품","ev":"10~11번 문장","s":[[10,"It can cause prices of items like food and medicine to increase rapidly.","그것은 음식과 약 같은 상품의 가격이 빠르게 오르도록 만들 수 있다."],[11,"Some people may not be able to get these necessities at all, which can put their lives in danger.","몇몇 사람들은 이러한 필수품들을 전혀 구하지 못할 수도 있는데, 이는 그들의 생명을 위험에 빠뜨릴 수 있다."]],"w":"10번에서 가격이 오르는 물건이 음식과 약이에요. 구하지 못하면 생명이 위험해질 만큼 꼭 필요한 것이니 necessities는 '필수품'이에요.","c":2},"h":"7f233893c6"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt can cause prices of items like food and medicine to increase rapidly.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 음식과 약 같은 상품의 가격이 빠르게 오르도록 만들 수 있다.","opts":["가게","재난","패닉 바잉","의약품"],"r":{"a":"3) 패닉 바잉","ev":"9~10번 문장","s":[[9,"Sometimes, panic buying can have harmful effects on society.","종종, 패닉 바잉은 사회에 해로운 영향을 끼친다."],[10,"It can cause prices of items like food and medicine to increase rapidly.","그것은 음식과 약 같은 상품의 가격이 빠르게 오르도록 만들 수 있다."]],"w":"10번의 It은 바로 앞 9번 문장의 주어, 즉 panic buying(패닉 바잉)이에요. 패닉 바잉이 가격을 빠르게 오르게 할 수 있다는 뜻이에요.","c":3},"h":"d37d70bcb9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even with buying limits, products continued to sell faster than they could be supplied.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"심지어 구매제한이 있어도, 상품은 공급될 수 있는 것보다 계속해서 더 빠르게 팔렸다.","opts":["구매 제한이 있어도 상품은 공급되는 속도보다 더 빠르게 계속 팔렸다.","구매 제한 때문에 상품이 거의 팔리지 않 ever, this can cause hip pain, backache, and knee problems.","하지만, 이것은 골반 부위 통증, 허리 통증, 그리고 무릎 문제들을 유발할 수 있다."]],"w":"this는 바로 앞 8번 내용이에요. 다른 부위가 대신 지탱하다 보니 9번처럼 통증과 문제가 생길 수 있다는 흐름이에요.","c":2},"h":"e8b2d6c31e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But if you spend too much of your day sitting, your body forgets to use your butt muscles.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 만약 당신이 하루의 너무 많은 시간을 앉아있는 데 보낸다면, 당신의 몸은 엉덩이 근육을 사용하는 것을 잊는다.","opts":["하루에 한 번만 앉으면 엉덩이 근육을 사용하는 것을 잊는다.","엉덩이 근육을 사용하느라 하루 종일 앉아 있는 것을 잊는다.","오래 서 있으면 몸이 엉덩이 근육 사용을 더 잘 기억한다.","하루 중 앉아 있는 시간이 너무 길면 몸이 엉덩이 근육을 사용하는 것을 잊는다."],"r":{"a":"4) 하루 중 앉아 있는 시간이 너무 길면 몸이 엉덩이 근육을 사용하는 것을 잊는다.","ev":"7번 문장","s":[[7,"But if you spend too much of your day sitting, your body forgets to use your butt muscles.","하지만 만약 당신이 하루의 너무 많은 시간을 앉아있는 데 보낸다면, 당신의 몸은 엉덩이 근육을 사용하는 것을 잊는다."]],"w":"spend too much of your day sitting은 하루의 너무 많은 시간을 앉아서 보내는 것이고, forgets to use는 사용하는 것을 잊는다는 뜻이에요. 그래서 4번과 같아요.","c":4},"h":"6c4b385ec4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["허리 근육은 골반 부위와 허벅지를 전혀 돕지 않는다.","죽은 엉덩이 증후군은 무릎 문제를 절대 일으키지 않는다.","엉덩이 근육은 골반 부위와 허벅지를 지탱하도록 돕는다.","오래 가만히 앉아있는 것이 이 증후군을 피하는 방법이다."],"opts":["Waist muscles never help the hips and thighs.","Dead Butt Syndrome never causes knee problems.","Your butt muscles help to support your hips and thighs.","Sitting still for a long time is the way to avoid the syndrome."],"r":{"a":"3) Your butt muscles help to support your hips and thighs.","ev":"6번 문장","s":[[6,"Your butt muscles connect to your hips and thighs, helping to support them.","당신의 엉덩이 근육은 골반 부위와 허벅지에 연결되어 있고, 그것들을 지탱하도록 돕는다."]],"w":"6번에서 엉덩이 근육이 골반 부위와 허벅지에 연결되어 그것들을 지탱하도록 돕는다고 해요. 허리는 8번에서 엉덩이 일을 이어받고, 9번에는 knee problems가 나오고, 13번은 오래 앉지 말라고 해요.","c":3},"h":"ed9f4a7926"},{"n":9,"t":"sum","q":"When you sit too much, your body (A) to use your butt muscles. Then other body parts take over, and this can (B) pain and other problems.","ko":"너무 오래 앉아 있으면 몸이 엉덩이 근육 사용을 (A). 그러면 다른 부위가 이어받고, 이것은 통증과 다른 문제들을 (B) 수 있다.","oko":["(A) 기억한다 / (B) 유발한다","(A) 잊는다 / (B) 치료한다","(A) 결정한다 / (B) 막는다","(A) 원한다 / (B) 줄인다","(A) 잊는다 / (B) 유발한다"],"opts":["(A) remembers / (B) cause","(A) forgets / (B) cure","(A) decides / (B) prevent","(A) wants / (B) reduce","(A) forgets / (B) cause"],"r":{"a":"5) (A) forgets / (B) cause","ev":"7~9번 문장","s":[[7,"But if you spend too much of your day sitting, your body forgets to use your butt muscles.","하지만 만약 당신이 하루의 너무 많은 시간을 앉아있는 데 보낸다면, 당신의 몸은 엉덩이 근육을 사용하는 것을 잊는다."],[8,"Instead, other body parts, like the waist, take over the responsibility of supporting your hips and thighs.","대신에, 허리와 같은, 다른 신체 부위들이 골반 부위와 허벅지를 지탱하는 책임을 이어받는다."],[9,"However, this can cause hip pain, backache, and knee problems.","하지만, 이것은 골반 부위 통증, 허리 통증, 그리고 무릎 문제들을 유발할 수 있다."]],"w":"7번에서 오래 앉으면 몸이 엉덩이 근육 쓰는 것을 잊고(forgets), 8번에서 다른 부위가 이어받으며, 9번에서 이것이 통증과 문제를 유발해요(cause).","c":5},"h":"45dc5512d0"},{"n":10,"t":"fill","q":"To avoid the syndrome, don't keep [A] still for too long. Get up and keep [B] your heels up and down at least every two hours.","ko":"증후군을 피하려면 너무 오래 가만히 [A] 있지 마라. 일어나서 최소한 두 시간마다 발뒤꿈치를 위아래로 [B] 해라.","bank":["sitting","moving","tight","responsibility","backache","simple"],"bko":{"sitting":"앉아 있는","moving":"움직이는","tight":"단단한","responsibility":"책임","backache":"허리 통증","simple":"간단한"},"r":{"a":"[A] sitting, [B] moving","ev":"13~14번 문장","s":[[13,"Don’t sit still for too long!","너무 오랫동안 가만히 앉아있지 말아라!"],[14,"Get up and move your heels up and down at least every two hours.","최소한 두 시간마다 일어나서 당신의 발뒤꿈치를 위아래로 움직여라."]],"w":"13번 Don't sit still(가만히 앉아있지 마라)과 14번 move your heels(발뒤꿈치를 움직여라)에서 가져왔어요. 나머지 단어는 형용사나 명사라서 keep 뒤 -ing 자리에 들어갈 수 없어요.","c":null},"h":"8846e7ee79"}]},{"u":9,"id":"hk3-09-2","no":2,"ko":"나만의 꿀조합을 찾아서","items":[{"n":1,"t":"tf","q":"Food products usually do not come with any instructions.","ko":"식품에는 보통 설명서가 전혀 딸려 있지 않다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Usually, food products come with instructions to follow.","보통, 식품에는 따라 할 설명서가 딸려 있다."]],"w":"3번에서 Usually, food products come with instructions to follow(보통 식품에는 따라 할 설명서가 딸려 있다)라고 해요. 진술문은 반대예요.","c":"F"},"h":"d0d54c1104"},{"n":2,"t":"tf","q":"Coca-Cola With Coffee was first invented by people who liked the scent of coffee and the feeling of soda.","ko":"Coca-Cola With Coffee는 커피의 향과 탄산음료의 느낌을 좋아한 사람들이 처음 발명했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Coca-Cola With Coffee, for example, was first invented by people who enjoyed the scent of coffee and the sensation of soda.","예를 들어, Coca-Cola With Coffee는 커피의 향과 탄산음료의 느낌을 즐기던 사람들에 의해 처음 발명되었다."]],"w":"5번에서 was first invented by people who enjoyed the scent of coffee and the sensation of soda라고 해요. 진술문과 같아요.","c":"T"},"h":"fb597fabd3"},{"n":3,"t":"tf","q":"The drink Coca-Cola With Coffee soon became very popular.","ko":"음료 Coca-Cola With Coffee는 곧 매우 인기를 얻었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Soon, the drink became very popular.","곧, 그 음료는 매우 인기를 얻었다."]],"w":"6번에 Soon, the drink became very popular(곧 그 음료는 매우 인기를 얻었다)가 그대로 나와요.","c":"T"},"h":"7a7490c411"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Interestingly, these combinations were created by consumers…)","ko":"흥미롭게도, 이러한 ( )은 소비자들에 의해 만들어졌고, 그것들은 매우 인기를 얻어서 실제 상품으로 만들어졌다.","opts":["상품","조합","설명서","제조사"],"word":"combinations","r":{"a":"2) 조합","ev":"1~2번 문장","s":[[1,"Have you ever tried spicy noodles with string cheese or milk with soda water?","당신은 매운 면을 스트링 치즈와 함께 또는 우유를 탄산수와 함께 먹어본 적이 있는가?"],[2,"Interestingly, these combinations were created by consumers, and they became so popular that they were made into actual products.","흥미롭게도, 이러한 조합은 소비자들에 의해 만들어졌고, 그것들은 매우 인기를 얻어서 실제 상품으로 만들어졌다."]],"w":"1번에서 매운 면+스트링 치즈, 우유+탄산수처럼 두 가지를 합친 예를 들었어요. 그 예들이 바로 2번의 combinations(조합)예요.","c":2},"h":"e976e30655"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…many consumers mix various goods like cosmetics… to match their preferences.)","ko":"마찬가지로, 많은 소비자들은 화장품, 목욕용품, 또는 다른 생활필수품과 같은 다양한 상품을 섞어서 그들의 ( )에 맞춘다.","opts":["가격","유행","설명서","기호"],"word":"preferences","r":{"a":"4) 기호","ev":"10번 문장","s":[[10,"Likewise, many consumers mix various goods like cosmetics, bathing products, or other daily necessities to match their preferences.","마찬가지로, 많은 소비자들은 그들의 기호에 맞추기 위해 화장품, 목욕용품, 또는 다른 생활필수품과 같은 다양한 상품을 섞는다."]],"w":"소비자가 상품을 섞는 이유는 자기가 좋아하는 대로 맞추기 위해서예요. 그래서 preferences = 기호(취향)가 알맞아요.","c":4},"h":"ad8c207d32"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThen, the manufacturer took the recipe and used it to develop a new product.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그 후, 제조사가 그 조리법을 가져갔고 새로운 상품을 개발하기 위해 그것을 이용했다.","opts":["제조사","새로운 상품","그 조리법","커피 향"],"r":{"a":"3) 그 조리법","ev":"7번 문장","s":[[7,"Then, the manufacturer took the recipe and used it to develop a new product.","그 후, 제조사가 그 조리법을 가져갔고 새로운 상품을 개발하기 위해 그것을 이용했다."]],"w":"used it에서 it은 바로 앞에서 제조사가 가져간 the recipe(그 조리법)를 받아요. 새 상품은 그 조리법을 이용해서 개발하는 결과물이라서 it이 아니에요.","c":3},"h":"247e6e47f6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This trend does not just apply to food products.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 유행은 단지 식품에만 해당하지 않는다.","opts":["이러한 유행은 식품에만 해당하는 것이 아니다.","이러한 유행은 식품에는 전혀 해당하지 않는다.","이러한 유행은 식품 상품을 사라지게 한다.","이러한 유행은 식품이 아닌 상품에만 해당한다."],"r":{"a":"1) 이러한 유행은 식품에만 해당하는 것이 아니다.","ev":"8번 문장","s":[[8,"This trend does not just apply to food products.","이러한 유행은 단지 식품에만 해당하지 않는다."]],"w":"does not just apply to ~는 '~에만 해당하는 것이 아니다'예요. 식품에도 해당하고 다른 상품에도 해당한다는 뜻이라서 1번이에요.","c":1},"h":"90c9a23d2c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Coca-Cola With Coffee는 제조사가 처음 발명했다.","식품에는 설명서가 절대 딸려 있지 않다.","이러한 유행은 식품 상품에만 해당한다.","사람들은 때때로 자기만의 조리법을 만드는 것을 선택한다."],"opts":["Coca-Cola With Coffee was first invented by a manufacturer.","Food products never come with instructions.","This trend applies only to food products.","People sometimes choose to create their own recipes."],"r":{"a":"4) People sometimes choose to create their own recipes.","ev":"4번 문장","s":[[4,"But people sometimes choose to create their own recipes.","하지만 사람들은 때때로 그들 자신만의 조리법을 만드는 것을 선택한다."]],"w":"4번에 People sometimes choose to create their own recipes가 있어요. 5번은 사람들이 처음 발명했고, 3번은 설명서가 딸려 있고, 8번은 식품에만 해당하지 않는다고 해요.","c":4},"h":"90b5223f85"},{"n":9,"t":"sum","q":"Some products started as combinations made by (A). When these became popular, (B) made them into real products.","ko":"어떤 상품은 (A)이 만든 조합에서 시작했다. 이것이 인기를 얻자 (B)이 그것을 실제 상품으로 만들었다.","oko":["(A) 제조사들 / (B) 소비자들","(A) 소비자들 / (B) 친구들","(A) 의사들 / (B) 제조사들","(A) 제조사들 / (B) 학생들","(A) 소비자들 / (B) 제조사들"],"opts":["(A) manufacturers / (B) consumers","(A) consumers / (B) friends","(A) doctors / (B) manufacturers","(A) manufacturers / (B) students","(A) consumers / (B) manufacturers"],"r":{"a":"5) (A) consumers / (B) manufacturers","ev":"2, 7번 문장","s":[[2,"Interestingly, these combinations were created by consumers, and they became so popular that they were made into actual products.","흥미롭게도, 이러한 조합은 소비자들에 의해 만들어졌고, 그것들은 매우 인기를 얻어서 실제 상품으로 만들어졌다."],[7,"Then, the manufacturer took the recipe and used it to develop a new product.","그 후, 제조사가 그 조리법을 가져갔고 새로운 상품을 개발하기 위해 그것을 이용했다."]],"w":"2번에서 조합은 소비자들이 만들었고 인기를 얻어 실제 상품이 되었다고 해요. 7번에서 제조사가 조리법을 가져가 새 상품을 개발했어요.","c":5},"h":"20560bd752"},{"n":10,"t":"fill","q":"Some people [A] two different perfumes to make a unique scent, and many consumers mix various goods to match their [B].","ko":"어떤 사람들은 독특한 향을 만들기 위해 두 개의 다른 향수를 [A]하고, 많은 소비자들은 다양한 상품을 섞어서 자신의 [B]에 맞춘다.","bank":["combine","preferences","popular","unique","noodles","soda"],"bko":{"combine":"조합하다","preferences":"기호","popular":"인기 있는","unique":"독특한","noodles":"면","soda":"탄산수"},"r":{"a":"[A] combine, [B] preferences","ev":"9~10번 문장","s":[[9,"Some people combine two different perfumes to make a unique scent.","몇몇 사람들은 독특한 향을 만들기 위해 두 개의 다른 향수를 조합한다."],[10,"Likewise, many consumers mix various goods like cosmetics, bathing products, or other daily necessities to match their preferences.","마찬가지로, 많은 소비자들은 그들의 기호에 맞추기 위해 화장품, 목욕용품, 또는 다른 생활필수품과 같은 다양한 상품을 섞는다."]],"w":"9번 combine two different perfumes와 10번 to match their preferences에서 가져왔어요. 나머지 단어는 동사 자리나 '자신의 ~' 자리에 넣으면 뜻이 이상해져요.","c":null},"h":"9dc2073e32"}]},{"u":9,"id":"hk3-09-3","no":3,"ko":"눈 떠보니 천재가 됐어요","items":[{"n":1,"t":"tf","q":"Orlando went to the doctor right after the ball hit his head.","ko":"Orlando는 공이 그의 머리를 맞힌 직후 병원에 갔다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"He didn’t go to the doctor because he only had a light headache.","그는 경미한 두통만 있었기 때문에 병원에 가지 않았다."]],"w":"2번에서 He didn't go to the doctor(그는 병원에 가지 않았다)라고 해요. 경미한 두통만 있었기 때문이에요.","c":"F"},"h":"1df3f5cf46"},{"n":2,"t":"tf","q":"Orlando could tell the day of the week for any date he was given.","ko":"Orlando는 주어진 어떤 날짜든 그 요일을 말할 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Given any date, he could immediately tell which day of the week it was or would be.","어떠한 날짜가 주어진다고 하더라도, 그는 그것이 그 주의 어느 요일이었는지 또는 어느 요일이 될지를 즉시 말할 수 있었다."]],"w":"5번에 Given any date, he could immediately tell which day of the week it was or would be가 있어요. 어떤 날짜든 요일을 바로 말했다는 뜻이에요.","c":"T"},"h":"0e6b0e70d0"},{"n":3,"t":"tf","q":"Most people with savant syndrome get it later in life.","ko":"서번트 증후군을 가진 대부분의 사람은 생애 나중에 그것을 얻는다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Only a few people in the world have this syndrome, and they are usually born with it.","전 세계에서 단 몇 명의 사람들만 이 증후군을 가지고 있고, 그들은 보통 그것을 가지고 태어난다."]],"w":"10번에서 그들은 보통 그것을 가지고 태어난다(they are usually born with it)고 해요. 나중에 얻는 건 드물어요.","c":"F"},"h":"d924275d52"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, when the pain ended, something unusual happened.)","ko":"하지만, 그 통증이 멎었을 때, 무언가 ( ) 일이 일어났다.","opts":["평범한","이상한","행복한","위험한"],"word":"unusual","r":{"a":"2) 이상한","ev":"3~4번 문장","s":[[3,"However, when the pain ended, something unusual happened.","하지만, 그 통증이 멎었을 때, 무언가 이상한 일이 일어났다."],[4,"He could suddenly perform calendar calculations.","그는 갑자기 달력에 관한 계산을 할 수 있었다."]],"w":"통증이 멎은 뒤 4번에서 갑자기 달력 계산을 할 수 있게 되었어요. 보통 일어나지 않는 일이라서 unusual = 이상한, 특이한이에요.","c":2},"h":"dd6dd4707a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is rare to acquire savant syndrome later in life like Orlando.)","ko":"Orlando처럼 서번트 증후군을 생애에서 나중에 ( ) 것은 드문 일이다.","opts":["치료하다","잃다","설명하다","얻다"],"word":"acquire","r":{"a":"4) 얻다","ev":"10~11번 문장","s":[[10,"Only a few people in the world have this syndrome, and they are usually born with it.","전 세계에서 단 몇 명의 사람들만 이 증후군을 가지고 있고, 그들은 보통 그것을 가지고 태어난다."],[11,"It is rare to acquire savant syndrome later in life like Orlando.","Orlando처럼 서번트 증후군을 생애에서 나중에 얻는 것은 드문 일이다."]],"w":"10번에서 보통은 태어날 때부터 가지고 있다고 했어요. 그래서 11번은 Orlando처럼 나중에 얻는 일이 드물다는 뜻이고, acquire = 얻다, 습득하다예요.","c":4},"h":"f7791f4ae3"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nOnly a few people in the world have this syndrome, and they are usually born with it.","ko":"밑줄 친 they가 가리키는 것은?","sko":"전 세계에서 단 몇 명의 사람들만 이 증후군을 가지고 있고, 그들은 보통 그것을 가지고 태어난다.","opts":["의사들","전 세계의 모든 사람들","이 증후군을 가진 소수의 사람들","Orlando와 그의 가족"],"r":{"a":"3) 이 증후군을 가진 소수의 사람들","ev":"10번 문장","s":[[10,"Only a few people in the world have this syndrome, and they are usually born with it.","전 세계에서 단 몇 명의 사람들만 이 증후군을 가지고 있고, 그들은 보통 그것을 가지고 태어난다."]],"w":"they는 앞에 나온 Only a few people in the world have this syndrome의 사람들, 즉 이 증후군을 가진 소수의 사람들이에요.","c":3},"h":"5b4733ef20"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He knew what the weather was like, what clothes he was wearing, and every other detail of each day.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 날씨가 어땠는지, 그가 무슨 옷을 입고 있었는지, 그리고 각 날마다의 다른 모든 세부 사항을 알고 있었다.","opts":["그는 날씨와 옷에 대해서만 알았고 다른 세부 사항은 몰랐다.","그는 날씨를 알아보려고 매일 옷을 갈아입었다.","그는 날씨가 어땠는지, 무슨 옷을 입고 있었는지, 그리고 매일의 다른 모든 세부 사항을 알았다.","그는 날씨와 다른 사람들의 하루도 모두 알고 있었다."],"r":{"a":"3) 그는 날씨가 어땠는지, 무슨 옷을 입고 있었는지, 그리고 매일의 다른 모든 세부 사항을 알았다.","ev":"8번 문장","s":[[8,"He knew what the weather was like, what clothes he was wearing, and every other detail of each day.","그는 날씨가 어땠는지, 그가 무슨 옷을 입고 있었는지, 그리고 각 날마다의 다른 모든 세부 사항을 알고 있었다."]],"w":"what the weather was like, what clothes he was wearing, and every other detail of each day는 날씨, 입은 옷, 매일의 다른 모든 세부 사항을 나열한 거예요. 그래서 3번이에요.","c":3},"h":"5d50fe4291"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Orlando는 사고 이후 하루하루를 완벽하게 기억할 수 있었다.","Orlando는 오랜 병 때문에 서번트 증후군이 생겼다.","서번트 증후군을 나중에 얻는 사람은 많다.","Orlando의 달력 대답은 가끔 틀렸다."],"opts":["Orlando could remember every day perfectly after the accident.","Orlando got savant syndrome from a long illness.","Many people acquire savant syndrome later in life.","Orlando's calendar answers were sometimes wrong."],"r":{"a":"1) Orlando could remember every day perfectly after the accident.","ev":"7번 문장","s":[[7,"In addition, he was able to remember every day perfectly after the accident.","게다가, 그는 사고 이후 하루하루를 완벽하게 기억할 수 있었다."]],"w":"7번에 he was able to remember every day perfectly after the accident가 있어요. 증후군은 부상 때문이었고(9번), 나중에 얻는 건 드물고(11번), 답은 항상 정확했어요(6번).","c":1},"h":"a9722f1d61"},{"n":9,"t":"sum","q":"Orlando developed savant syndrome from a head (A). Most people with it are born with it, so getting it later in life is (B).","ko":"Orlando는 머리 (A)로 서번트 증후군이 생겼다. 대부분은 태어날 때부터 가지므로, 나중에 얻는 것은 (B)이다.","oko":["(A) 병 / (B) 흔한 일","(A) 게임 / (B) 위험한 일","(A) 병 / (B) 드문 일","(A) 부상 / (B) 흔한 일","(A) 부상 / (B) 드문 일"],"opts":["(A) illness / (B) common","(A) game / (B) dangerous","(A) illness / (B) rare","(A) injury / (B) common","(A) injury / (B) rare"],"r":{"a":"5) (A) injury / (B) rare","ev":"9~11번 문장","s":[[9,"Later, the doctor said that he had developed savant syndrome from the injury.","이후에, 의사는 그 부상으로 그에게서 번트 증후군이 생겼다고 말했다."],[10,"Only a few people in the world have this syndrome, and they are usually born with it.","전 세계에서 단 몇 명의 사람들만 이 증후군을 가지고 있고, 그들은 보통 그것을 가지고 태어난다."],[11,"It is rare to acquire savant syndrome later in life like Orlando.","Orlando처럼 서번트 증후군을 생애에서 나중에 얻는 것은 드문 일이다."]],"w":"9번에서 의사가 부상(injury) 때문에 증후군이 생겼다고 해요. 10번에서 보통은 태어날 때부터 가지고, 11번에서 나중에 얻는 것은 드물다(rare)고 해요.","c":5},"h":"796066ab00"},{"n":10,"t":"fill","q":"Orlando could suddenly [A] calendar calculations, and his answers were always [B].","ko":"Orlando는 갑자기 달력 계산을 [A]할 수 있었고, 그의 대답은 항상 [B]했다.","bank":["perform","correct","doctor","baseball","injury","syndrome"],"bko":{"perform":"수행하다","correct":"정확한","doctor":"의사","baseball":"야구","injury":"부상","syndrome":"증후군"},"r":{"a":"[A] perform, [B] correct","ev":"4~6번 문장","s":[[4,"He could suddenly perform calendar calculations.","그는 갑자기 달력에 관한 계산을 할 수 있었다."],[5,"Given any date, he could immediately tell which day of the week it was or would be.","어떠한 날짜가 주어진다고 하더라도, 그는 그것이 그 주의 어느 요일이었는지 또는 어느 요일이 될지를 즉시 말할 수 있었다."],[6,"His answers were always correct.","그의 대답은 항상 정확했다."]],"w":"4번 He could suddenly perform calendar calculations와 6번 His answers were always correct에서 가져왔어요. 나머지는 명사라서 동사 자리와 always 뒤 형용사 자리에 들어갈 수 없어요.","c":null},"h":"5f28bfae90"}]},{"u":9,"id":"hk3-09-4","no":4,"ko":"영화는 하나, ‘이것’은 여러 개","items":[{"n":1,"t":"tf","q":"The poster for Avengers: Endgame in China showed the most popular characters in a bigger size.","ko":"중국의 <어벤져스: 엔드게임> 포스터는 가장 인기 있는 등장인물을 더 큰 크기로 보여 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"For example, the poster in China emphasized all of the characters equally by keeping them the same size.","예를 들어, 중국의 포스터는 모든 등장인물들을 같은 크기로 두어서 똑같이 강조했다."]],"w":"2번에서 중국 포스터는 모든 등장인물을 같은 크기로 두어서 똑같이 강조했어요. 더 크게 보여 준 건 다른 나라들의 포스터예요(3번).","c":"F"},"h":"ffd19058ec"},{"n":2,"t":"tf","q":"The original poster of The Host showed only the main characters.","ko":"<괴물>의 원래 포스터는 주인공들만 보여 주었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"It only showed the main characters.","그것은 주인공들만 보여줬다."]],"w":"6번에 It only showed the main characters(그것은 주인공들만 보여줬다)가 나와요. It은 5번의 원래 포스터예요.","c":"T"},"h":"40c007b321"},{"n":3,"t":"tf","q":"The Host was released in only a few foreign countries.","ko":"<괴물>은 해외의 몇몇 나라에서만 개봉되었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Likewise, there are different posters for The Host, a Korean monster film, which was released in 202 foreign countries.","마찬가지로, 한국의 괴수 영화인 <괴물>에도 서로 다른 포스터가 있는데, 이것은 해외 202개국에서 개봉되었다."]],"w":"4번에서 <괴물>은 202개의 해외 국가에서 개봉되었다고 해요. 몇몇 나라만이 아니에요.","c":"F"},"h":"447c756133"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the poster in China emphasized all of the characters equally…)","ko":"중국의 포스터는 모든 등장인물들을 같은 크기로 두어서 똑같이 ( ).","opts":["숨겼다","줄였다","강조했다","바꿨다"],"word":"emphasized","r":{"a":"3) 강조했다","ev":"2번 문장","s":[[2,"For example, the poster in China emphasized all of the characters equally by keeping them the same size.","예를 들어, 중국의 포스터는 모든 등장인물들을 같은 크기로 두어서 똑같이 강조했다."]],"w":"모든 인물을 같은 크기로 두었다는 건 어느 한 명만 더 크게 하지 않고 모두를 똑같이 눈에 띄게 했다는 뜻이에요. emphasize = 강조하다.","c":3},"h":"535332d518"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most of them portrayed the scene of a girl…)","ko":"그것들 대부분은 괴물의 꼬리에 붙잡혀 있는 한 소녀의 장면을 ( ).","opts":["묘사했다","삭제했다","촬영했다","개봉했다"],"word":"portrayed","r":{"a":"1) 묘사했다","ev":"8번 문장","s":[[8,"Most of them portrayed the scene of a girl who was being grabbed by the tail of the monster.","그것들 대부분은 괴물의 꼬리에 붙잡혀 있는 한 소녀의 장면을 묘사했다."]],"w":"포스터에 소녀가 괴물의 꼬리에 붙잡힌 장면을 그림으로 나타냈다는 뜻이에요. portray = 묘사하다.","c":1},"h":"9ddd62c112"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nMost of them portrayed the scene of a girl who was being grabbed by the tail of the monster.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그것들 대부분은 괴물의 꼬리에 붙잡혀 있는 한 소녀의 장면을 묘사했다.","opts":["주인공들","나라들","괴물들","다른 나라들의 포스터들"],"r":{"a":"4) 다른 나라들의 포스터들","ev":"7~8번 문장","s":[[7,"However, the posters looked a lot different in other countries.","하지만, 다른 나라들에서는 포스터가 많이 다르게 생겼다."],[8,"Most of them portrayed the scene of a girl who was being grabbed by the tail of the monster.","그것들 대부분은 괴물의 꼬리에 붙잡혀 있는 한 소녀의 장면을 묘사했다."]],"w":"them은 바로 앞 7번의 the posters(다른 나라에서의 포스터들)를 받아요. 괴물의 꼬리에 붙잡힌 소녀를 그린 것은 포스터들이에요.","c":4},"h":"578c54adc8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Their designs depend on what will draw a larger audience in each country.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것들의 디자인은 각 나라에서 무엇이 더 많은 관객을 끌어들일 것인지에 달려있다.","opts":["그것들의 디자인은 각 나라에서 무엇이 더 많은 관객을 끌어들일 것인지에 달려 있다.","그것들의 디자인은 각 나라에서 관객 수가 줄어든 이유 때문에 바뀌었다.","그것들의 디자인은 관객이 어느 나라에서 왔는지와 상관이 없다.","그것들의 디자인은 영화를 만든 나라의 문화에 달려 있다."],"r":{"a":"1) 그것들의 디자인은 각 나라에서 무엇이 더 많은 관객을 끌어들일 것인지에 달려 있다.","ev":"10번 문장","s":[[10,"Their designs depend on what will draw a larger audience in each country.","그것들의 디자인은 각 나라에서 무엇이 더 많은 관객을 끌어들일 것인지에 달려있다."]],"w":"depend on은 '~에 달려있다'이고, what will draw a larger audience는 무엇이 더 많은 관객을 끌어들일 것인지예요. 그래서 1번이에요.","c":1},"h":"5a293ee745"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["<괴물>의 원래 포스터에서는 괴물이 소녀를 붙잡고 있었다.","중국의 <어벤져스: 엔드게임> 포스터는 주인공 한 명만 더 크게 보여 주었다.","<괴물>의 포스터는 모든 나라에서 똑같았다.","다른 나라의 <괴물> 포스터 대부분은 괴물에게 붙잡힌 소녀를 묘사했다."],"opts":["In the original poster of The Host, a monster was grabbing a girl.","The poster in China showed only one hero in a bigger size.","The Host posters were the same in all countries.","Most of the other countries' posters of The Host showed a girl grabbed by the monster."],"r":{"a":"4) Most of the other countries' posters of The Host showed a girl grabbed by the monster.","ev":"8번 문장","s":[[8,"Most of them portrayed the scene of a girl who was being grabbed by the tail of the monster.","그것들 대부분은 괴물의 꼬리에 붙잡혀 있는 한 소녀의 장면을 묘사했다."]],"w":"8번에서 다른 나라 포스터 대부분이 괴물의 꼬리에 붙잡힌 소녀의 장면을 묘사했다고 해요. 원래 포스터에는 괴물이 없었고(5번), 중국은 모두 같은 크기였고(2번), 포스터는 나라마다 달랐어요(7번).","c":4},"h":"452893697a"},{"n":9,"t":"sum","q":"The Avengers: Endgame poster in China kept all characters the (A) size, but other countries made the most popular characters (B).","ko":"중국의 <어벤져스: 엔드게임> 포스터는 모든 등장인물의 크기를 (A) 했지만, 다른 나라들은 가장 인기 있는 등장인물을 (B) 했다.","oko":["(A) 같게 / (B) 더 작게","(A) 다르게 / (B) 더 크게","(A) 다르게 / (B) 더 작게","(A) 같게 / (B) 숨기게","(A) 같게 / (B) 더 크게"],"opts":["(A) same / (B) smaller","(A) different / (B) bigger","(A) different / (B) smaller","(A) same / (B) hidden","(A) same / (B) bigger"],"r":{"a":"5) (A) same / (B) bigger","ev":"2~3번 문장","s":[[2,"For example, the poster in China emphasized all of the characters equally by keeping them the same size.","예를 들어, 중국의 포스터는 모든 등장인물들을 같은 크기로 두어서 똑같이 강조했다."],[3,"However, other countries’ posters, including Korea’s, had the most popular characters placed in the center and shown in a bigger size.","하지만, 한국의 포스터를 포함하여, 다른 나라의 포스터는 가장 인기 있는 등장인물들이 중앙에 놓이게 하고 더 큰 크기로 보이게 했다."]],"w":"2번에서 중국은 모든 인물을 같은 크기로 두었고, 3번에서 다른 나라들은 가장 인기 있는 인물을 더 큰 크기로 보여 줬어요.","c":5},"h":"11bfa1a60e"},{"n":10,"t":"fill","q":"The original poster of The Host had no [A] and showed only the main [B], but other countries' posters looked different.","ko":"<괴물>의 원래 포스터에는 [A]가 없었고 주요 [B]만 보여 주었지만, 다른 나라의 포스터는 달라 보였다.","bank":["monster","characters","countries","audience","center","equally"],"bko":{"monster":"괴물","characters":"등장인물들","countries":"나라들","audience":"관객","center":"중앙","equally":"똑같이"},"r":{"a":"[A] monster, [B] characters","ev":"5~7번 문장","s":[[5,"In the original version of the poster, there was no monster.","그 포스터의 원래 버전에는, 괴물이 없었다."],[6,"It only showed the main characters.","그것은 주인공들만 보여줬다."],[7,"However, the posters looked a lot different in other countries.","하지만, 다른 나라들에서는 포스터가 많이 다르게 생겼다."]],"w":"5번 there was no monster와 6번 It only showed the main characters에서 가져왔어요. 7번에서 다른 나라에서는 포스터가 많이 달랐다고 해요. 나머지 단어를 넣으면 뜻이 맞지 않아요.","c":null},"h":"2b2268f99e"}]},{"u":10,"id":"hk3-10-1","no":1,"ko":"꿈을 지배하는 자","items":[{"n":1,"t":"tf","q":"In a lucid dream, you know that you are dreaming.","ko":"자각몽에서는 당신이 꿈을 꾸고 있다는 것을 안다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But during a lucid dream, you know that you are dreaming.","하지만 자각몽 동안에는, 당신이 꿈을 ng about it.","ev":"6번 문장","s":[[6,"Then you could change where you are just by thinking about it and escape.","그러면 당신은 그냥 당신이 있는 곳에 대해 생각함으로써 당신이 있는 곳을 바꾸고 탈출할 수 있다."]],"w":"6번에 change where you are just by thinking about it이 나와요. 보통은 꿈인 줄 모르고(2번), 자각몽은 창의력을 신장시키고(9번), 정신을 깨어 있게 해요(12번).","c":2},"h":"138bd4f364"},{"n":9,"t":"sum","q":"Lucid dreams can boost (A), and some artists try different (B) in them and use them in real life.","ko":"자각몽은 (A)을 신장시킬 수 있고, 일부 예술가들은 그 안에서 다양한 (B)을 시도하고 현실에서 쓴다.","oko":["(A) 불안 / (B) 기법","(A) 창의력 / (B) 좀비","(A) 피로 / (B) 기법","(A) 불안 / (B) 좀비","(A) 창의력 / (B) 기법"],"opts":["(A) anxiety / (B) techniques","(A) creativity / (B) zombies","(A) fatigue / (B) techniques","(A) anxiety / (B) zombies","(A) creativity / (B) techniques"],"r":{"a":"5) (A) creativity / (B) techniques","ev":"9~10번 문장","s":[[9,"These dreams are also known to boost creativity.","이러한 꿈은 창의력을 신장시킨다고도 알려져 있다."],[10,"Some artists have reported that they can try different artistic techniques in lucid dreams and then apply them in real life.","일부 예술가들은 그들이 자각몽에서 다양한 예술적 기법들을 시도할 수 있고 그 후 그것들을 현실에 적용할 수 있다고 보고했다."]],"w":"9번에서 자각몽이 창의력(creativity)을 신장시킨다고 하고, 10번에서 예술가들이 자각몽에서 다양한 예술적 기법(techniques)을 시도한 뒤 현실에 적용한다고 해요.","c":5},"h":"4a9e1ffac5"},{"n":10,"t":"fill","q":"Frequent lucid dreams keep your mind [A], so you feel [B].","ko":"잦은 자각몽은 당신의 정신을 [A] 있게 해서, 당신은 [B]을 느낀다.","bank":["awake","fatigued","zombie","technique","artist","scientist"],"bko":{"awake":"깨어 있는","fatigued":"피로한","zombie":"좀비","technique":"기법","artist":"예술가","scientist":"과학자"},"r":{"a":"[A] awake, [B] fatigued","ev":"11~12번 문장","s":[[11,"However, frequent lucid dreams are not good for your health.","하지만, 잦은 자각몽은 건강에 좋지 않다."],[12,"They keep your mind awake, so you feel fatigued.","그것은 당신의 정신이 깨어 있도록 해서, 당신은 피로를 느낀다."]],"w":"12번 They keep your mind awake, so you feel fatigued에서 가져왔어요. 나머지 단어는 모두 명사라서 keep your mind 뒤와 feel 뒤의 상태를 나타내는 자리에 맞지 않아요.","c":null},"h":"33920f9803"}]},{"u":10,"id":"hk3-10-2","no":2,"ko":"가장 달콤한 투표","items":[{"n":1,"t":"tf","q":"Each spouse of a presidential candidate submitted his or her own recipe.","ko":"대선 후보의 각 배우자는 그 또는 그녀 자신만의 조리법을 제출했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Each spouse submitted his or her own recipe.","각 배우자는 그 또는 그녀 자신만의 조리법을 제출했다."]],"w":"5번에 Each spouse submitted his or her own recipe가 그대로 있어요. 배우자가 남편이거나 아내일 수 있어서 his or her이라고 해요.","c":"T"},"h":"6aefc6ae19"},{"n":2,"t":"tf","q":"Citizens voted for a recipe without baking the cookies.","ko":"시민들은 쿠키를 구워 보지 않고 조리법에 투표했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Then, citizens voted for the one they liked more after baking the cookies themselves.","그 후, 시민들이 직접 쿠키를 구워본 후 그들이 더 좋아한 것에 투표했다."]],"w":"6번에서 시민들은 직접 쿠키를 구워 본 후(after baking the cookies themselves) 더 좋아한 쪽에 투표했어요. 굽지 않고 투표한 것이 아니에요.","c":"F"},"h":"5dfec1c82d"},{"n":3,"t":"tf","q":"The contest was originally called the Presidential Cookie Poll.","ko":"그 경연은 원래 대통령 쿠키 선거라고 불렸다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"The competition was originally called the First Lady Cookie Contest.","그 경연은 원래 영부인 쿠키 경연이라고 불렸다."]],"w":"9번에서 원래 이름은 First Lady Cookie Contest였어요. Presidential Cookie Poll은 11번에서 바뀐 새 이름이에요.","c":"F"},"h":"e233a9362a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Each spouse submitted his or her own recipe.)","ko":"각 배우자는 그 또는 그녀 자신만의 조리법을 ( ).","opts":["삭제했다","제출했다","빌렸다","기억했다"],"word":"submitted","r":{"a":"2) 제출했다","ev":"5번 문장","s":[[5,"Each spouse submitted his or her own recipe.","각 배우자는 그 또는 그녀 자신만의 조리법을 제출했다."]],"w":"5번에서 배우자들이 경연에 낸 것이 조리법이에요. 10번에도 빌이 조리법을 submit해야 했다고 나와요. submit = 제출하다.","c":2},"h":"73dccc6d5e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The competitors were the spouses of the presidential candidates.)","ko":"( )은 대선 후보들의 배우자들이었다.","opts":["심판들","관객들","요리사들","참가자들"],"word":"competitors","r":{"a":"4) 참가자들","ev":"3~4번 문장","s":[[3,"Between 1992 and 2016, a cookie recipe competition was held before every presidential election in the U.S.","1992년과 2016년 사이에, 미국에서는 매 대통령 선거 전에 쿠키 조리법 경연이 열렸다."],[4,"The competitors were the spouses of the presidential candidates.","참가자들은 대선 후보들의 배우자들이었다."]],"w":"3번의 competition은 경연이에요. 그 경연에 나가서 조리법을 낸 사람들이 4번의 competitors = 참가자들이에요.","c":4},"h":"ccf34776e2"},{"n":6,"t":"ref","q":"What does the underlined \"the one\" refer to?\nThen, citizens voted for the one they liked more after baking the cookies themselves.","ko":"밑줄 친 the one이 가리키는 것은?","sko":"그 후, 시민들이 직접 쿠키를 구워본 후 그들이 더 좋아한 것에 투표했다.","opts":["대통령 후보","시민 한 명","배우자가 제출한 조리법","선거 투표용지"],"r":{"a":"3) 배우자가 제출한 조리법","ev":"5~6번 문장","s":[[5,"Each spouse submitted his or her own recipe.","각 배우자는 그 또는 그녀 자신만의 조리법을 제출했다."],[6,"Then, citizens voted for the one they liked more after baking the cookies themselves.","그 후, 시민들이 직접 쿠키를 구워본 후 그들이 더 좋아한 것에 투표했다."]],"w":"5번에서 배우자들이 조리법을 제출했고, 6번에서 시민들이 그 조리법으로 구운 쿠키 중 더 좋아한 것(the one)에 투표해요. the one은 조리법(쿠키)이에요.","c":3},"h":"711a66f592"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For example, the Obamas, the Bushes, and the Clintons won both the cookie recipe contest and the presidential poll.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"예를 들어, 오바마 부부, 부시 부부, 그리고 클린턴 부부가 쿠키 조리법 경연과 대통령 선거 모두에서 이겼다.","opts":["오바마 부부, 부시 부부, 클린턴 부부는 쿠키 경연과 대통령 선거 모두에서 이겼다.","오바마 부부, 부시 부부, 클린턴 부부는 쿠키 경연에서만 이겼다.","오바마 부부, 부시 부부, 클린턴 부부는 쿠키 경연에서 졌지만 대통령 선거에서 이겼다.","오바마 부부, 부시 부부, 클린턴 부부는 대통령에게 쿠키를 만들어 주었다."],"r":{"a":"1) 오바마 부부, 부시 부부, 클린턴 부부는 쿠키 경연과 대통령 선거 모두에서 이겼다.","ev":"8번 문장","s":[[8,"For example, the Obamas, the Bushes, and the Clintons won both the cookie recipe contest and the presidential poll.","예를 들어, 오바마 부부, 부시 부부, 그리고 클린턴 부부가 쿠키 조리법 경연과 대통령 선거 모두에서 이겼다."]],"w":"both A and B는 'A와 B 모두'예요. 여기서 A는 쿠키 조리법 경연이고 B는 대통령 선거라서, 두 곳에서 모두 이겼다는 뜻이에요.","c":1},"h":"f4a94f95f4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["쿠키 경연은 2016년 이후에 시작되었다.","시민들은 쿠키를 굽지 않고 투표했다.","힐러리 클린턴이 출마했을 때 남편 빌이 조리법을 제출했다.","영부인만 조리법을 제출할 수 있었고 남편은 낼 수 없었다."],"opts":["The cookie contest began after 2016.","Citizens voted without baking the cookies.","Bill Clinton submitted a recipe when Hillary ran for president.","Only first ladies could submit recipes, and husbands could not."],"r":{"a":"3) Bill Clinton submitted a recipe when Hillary ran for president.","ev":"10번 문장","s":[[10,"However, when Hillary Clinton ran for president, her husband Bill had to submit his recipe.","그런데, 힐러리 클린턴이 대통령에 출마했을 때, 그녀의 남편인 빌이 그의 조리법을 제출해야 했다."]],"w":"10번에서 힐러리 클린턴이 대통령에 출마했을 때 남편 빌이 조리법을 제출해야 했다고 해요. 경연은 1992년에 시작했고(3번), 시민은 직접 구웠고(6번), 그래서 남편도 내게 되었어요.","c":3},"h":"396a60fc7e"},{"n":9,"t":"sum","q":"Before every U.S. presidential election, the (A) of the candidates each submitted a (B).","ko":"미국 대통령 선거 전마다 후보들의 (A)이 각각 (B)을 제출했다.","oko":["(A) 배우자 / (B) 조리법","(A) 자녀 / (B) 조리법","(A) 배우자 / (B) 연설문","(A) 친구 / (B) 포스터","(A) 배우자 / (B) 투표용지"],"opts":["(A) spouses / (B) recipe","(A) children / (B) recipe","(A) spouses / (B) speech","(A) friends / (B) poster","(A) spouses / (B) ballot"],"r":{"a":"1) (A) spouses / (B) recipe","ev":"3~5번 문장","s":[[3,"Between 1992 and 2016, a cookie recipe competition was held before every presidential election in the U.S.","1992년과 2016년 사이에, 미국에서는 매 대통령 선거 전에 쿠키 조리법 경연이 열렸다."],[4,"The competitors were the spouses of the presidential candidates.","참가자들은 대선 후보들의 배우자들이었다."],[5,"Each spouse submitted his or her own recipe.","각 배우자는 그 또는 그녀 자신만의 조리법을 제출했다."]],"w":"3번에서 대통령 선거 전마다 쿠키 조리법 경연이 열렸고, 4번에서 참가자는 후보들의 배우자들이며, 5번에서 각 배우자가 자기만의 조리법을 제출했어요.","c":1},"h":"4198ae3598"},{"n":10,"t":"fill","q":"When [A] Clinton ran for president, her [B] Bill had to submit his recipe.","ko":"[A] 클린턴이 대통령에 출마했을 때, 그녀의 [B] 빌이 그의 조리법을 제출해야 했다.","bank":["Hillary","husband","Obama","citizens","winner","competitors"],"bko":{"Hillary":"힐러리","husband":"남편","Obama":"오바마","citizens":"시민들","winner":"우승자","competitors":"참가자들"},"r":{"a":"[A] Hillary, [B] husband","ev":"10번 문장","s":[[10,"However, when Hillary Clinton ran for president, her husband Bill had to submit his recipe.","그런데, 힐러리 클린턴이 대통령에 출마했을 때, 그녀의 남편인 빌이 그의 조리법을 제출해야 했다."]],"w":"10번 when Hillary Clinton ran for president, her husband Bill had to submit his recipe에서 가져왔어요. 나머지 단어는 Clinton 앞 이름 자리와 her 뒤 Bill을 설명하는 자리에 맞지 않아요.","c":null},"h":"cf5b1303ee"}]},{"u":10,"id":"hk3-10-3","no":3,"ko":"이것도 재활용이 된다고?","items":[{"n":1,"t":"tf","q":"The Dragon returned to the Earth without much damage.","ko":"Dragon호는 많은 손상 없이 지구로 돌아왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"However, the Dragon succeeded in returning home without much damage.","하지만, Dragon호는 많은 손상 없이 본부로 돌아오는 데 성공했다."]],"w":"7번에 the Dragon succeeded in returning home without much damage가 있어요. 진술문과 같아요.","c":"T"},"h":"14f62a169e"},{"n":2,"t":"tf","q":"Spacecraft never need to withstand high temperatures when they return.","ko":"우주선은 돌아올 때 높은 온도를 견딜 필요가 전혀 없다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"They must withstand temperatures of up to 1,850°C.","그것은 최고 섭씨 1,850도의 온도를 견뎌야 한다."]],"w":"4번에서 우주선은 최고 섭씨 1,850도의 온도를 견뎌야 한다(must withstand)고 해요. 견딜 필요가 없다는 말은 반대예요.","c":"F"},"h":"a45b1068cb"},{"n":3,"t":"tf","q":"Most of the Dragon's parts could not be used again.","ko":"Dragon호의 부품 대부분은 다시 사용될 수 없었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"As a result, most of its parts were reusable, which saved the time and money needed to make new ones.","그 결과, 그것의 부품 중 대부분이 재사용할 수 있었는데, 이는 새로운 부품을 만들기 위해 필요한 시간과 돈을 절약했다."]],"w":"8번에서 부품 중 대부분이 재사용할 수 있었다(reusable)고 해요. 다시 사용될 수 없었다는 말은 반대예요.","c":"F"},"h":"5b70350af1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They must withstand temperatures of up to 1,850°C.)","ko":"그것은 최고 섭씨 1,850도의 온도를 ( ) 한다.","opts":["피해야","만들어야","견뎌야","측정해야"],"word":"withstand","r":{"a":"3) 견뎌야","ev":"3~4번 문장","s":[[3,"Usually, when spacecraft are sent into space, it’s extremely difficult for them to return without damage.","보통, 우주선이 우주로 보내질 때, 그것이 손상 없이 돌아오는 것은 극히 어렵다."],[4,"They must withstand temperatures of up to 1,850°C.","그것은 최고 섭씨 1,850도의 온도를 견뎌야 한다."]],"w":"3번에서 우주선이 돌아오는 것이 극히 어렵다고 했고, 4번에서 그 이유로 아주 높은 온도를 말해요. 돌아오는 동안 그 열을 견뎌야 하니까 withstand = 견디다예요.","c":3},"h":"ebd00bce6a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…most of its parts were reusable, which saved the time and money…)","ko":"그 결과, 그것의 부품 중 대부분이 ( ), 이는 새로운 부품을 만들기 위해 필요한 시간과 돈을 절약했다.","opts":["값비쌌고","다시 쓸 수 있었고","위험했고","무거웠고"],"word":"reusable","r":{"a":"2) 다시 쓸 수 있었고","ev":"8번 문장","s":[[8,"As a result, most of its parts were reusable, which saved the time and money needed to make new ones.","그 결과, 그것의 부품 중 대부분이 재사용할 수 있었는데, 이는 새로운 부품을 만들기 위해 필요한 시간과 돈을 절약했다."]],"w":"새것을 만드는 데 필요한 시간과 돈을 아꼈다는 말이 뒤에 이어져요. 있던 부품을 다시 쓸 수 있었기 때문이에요. reusable = 다시 쓸 수 있는.","c":2},"h":"9f67e7ded0"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIf they succeed, we might even take field trips to the Moon!","ko":"밑줄 친 they가 가리키는 것은?","sko":"만약 그들이 성공한다면, 우리는 심지어 달로 견학을 갈 수도 있을 것이다!","opts":["우주선들","달로 견학 가는 우리들","우주선 개발자들","국제 우주 정거장"],"r":{"a":"3) 우주선 개발자들","ev":"10~11번 문장","s":[[10,"In fact, spacecraft developers are trying to make commercial space flight possible in the future.","실제로, 우주선 개발자들은 미래에 상업적인 우주 비행을 가능하게 만들기 위해 노력하고 있다."],[11,"If they succeed, we might even take field trips to the Moon!","만약 그들이 성공한다면, 우리는 심지어 달로 견학을 갈 수도 있을 것이다!"]],"w":"11번의 they는 10번에서 상업적인 우주 비행을 가능하게 하려고 노력하는 spacecraft developers(우주선 개발자들)예요. 성공하면 우리가 달로 견학을 갈 수도 있다는 흐름이에요.","c":3},"h":"7385ea26ac"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Moreover, they don’t always land in the right place.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"게다가, 그것이 항상 올바른 장소에 착륙하는 것은 아니다.","opts":["게다가 그것들은 항상 올바른 장소에 착륙한다.","게다가 그것들은 절대 올바른 장소에 착륙하지 않는다.","게다가 그것들은 올바른 장소에만 착륙하려고 한다.","게다가 그것들은 항상 올바른 장소에 착륙하는 것은 아니다."],"r":{"a":"4) 게다가 그것들은 항상 올바른 장소에 착륙하는 것은 아니다.","ev":"5번 문장","s":[[5,"Moreover, they don’t always land in the right place.","게다가, 그것이 항상 올바른 장소에 착륙하는 것은 아니다."]],"w":"don't always ~는 '항상 ~하는 것은 아니다'라는 부분 부정이에요. 올바른 곳에 착륙할 때도 있지만 항상은 아니라는 뜻이라서 4번이에요.","c":4},"h":"df1717fa22"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대기 상층부의 강한 바람은 올바른 착륙구역으로 비행하기 어렵게 만든다.","Dragon호 같은 우주선은 우주여행을 더 비싸게 만들 것이다.","Dragon호의 부품은 너무 손상되어 다시 쓸 수 없었다.","Dragon호는 2010년에 마지막 임무를 마치고 돌아왔다."],"opts":["Heavy winds in the upper atmosphere make it difficult to navigate to the landing zone.","Spacecraft like the Dragon will make space travel more expensive.","The Dragon's parts were too damaged to be used again.","The Dragon returned from its final mission in 2010."],"r":{"a":"1) Heavy winds in the upper atmosphere make it difficult to navigate to the landing zone.","ev":"6번 문장","s":[[6,"Heavy winds blowing in the upper atmosphere make it difficult to navigate to the landing zone.","대기 상층부에서 부는 강한 바람은 착륙구역으로 비행하는 것을 어렵게 만든다."]],"w":"6번에서 대기 상층부에서 부는 강한 바람이 착륙구역으로 비행하기 어렵게 만든다고 해요. 9번은 더 저렴한 우주여행, 8번은 부품 재사용, 1번은 2020년 4월이에요.","c":1},"h":"d7cbe027e8"},{"n":9,"t":"sum","q":"Spacecraft like the Dragon may allow (A) and cheaper space travel, and developers are trying to make (B) space flight possible.","ko":"Dragon호 같은 우주선은 (A) 더 저렴한 우주여행을 가능하게 할 수 있고, 개발자들은 (B) 우주 비행을 가능하게 하려고 노력하고 있다.","oko":["(A) 더 드문 / (B) 상업적인","(A) 더 빈번한 / (B) 위험한","(A) 더 드문 / (B) 위험한","(A) 더 느린 / (B) 마지막","(A) 더 빈번한 / (B) 상업적인"],"opts":["(A) rarer / (B) commercial","(A) more frequent / (B) dangerous","(A) rarer / (B) dangerous","(A) slower / (B) final","(A) more frequent / (B) commercial"],"r":{"a":"5) (A) more frequent / (B) commercial","ev":"9~10번 문장","s":[[9,"Spacecraft like the Dragon will eventually allow for more frequent and cheaper space travel.","Dragon호와 같은 우주선은 결국 더 빈번하고 더 저렴한 우주여행을 가능하게 할 것이다."],[10,"In fact, spacecraft developers are trying to make commercial space flight possible in the future.","실제로, 우주선 개발자들은 미래에 상업적인 우주 비행을 가능하게 만들기 위해 노력하고 있다."]],"w":"9번에서 Dragon호 같은 우주선은 더 빈번하고(more frequent) 더 저렴한 우주여행을 가능하게 한다고 해요. 10번에서 개발자들은 상업적인(commercial) 우주 비행을 가능하게 하려고 노력해요.","c":5},"h":"7ed20340f2"},{"n":10,"t":"fill","q":"The Dragon was the first spacecraft to make [A] trips to the International Space Station, and it came back [B] after its final mission.","ko":"Dragon호는 국제 우주 정거장으로 [A] 운행을 한 첫 번째 우주선이었고, 마지막 임무 후 [B] 돌아왔다.","bank":["multiple","successfully","damage","winds","atmosphere","temperatures"],"bko":{"multiple":"다수의","successfully":"성공적으로","damage":"손상","winds":"바람","atmosphere":"대기","temperatures":"온도"},"r":{"a":"[A] multiple, [B] successfully","ev":"1~2번 문장","s":[[1,"The spacecraft Dragon came back to the Earth successfully again after its final mission in April 2020.","우주선 Dragon호는 2020년 4월에 마지막 임무 후 다시 성공적으로 지구로 돌아왔다."],[2,"It was the first spacecraft to make multiple trips to the International Space Station.","그것은 국제 우주 정거장으로 다수의 운행을 한 첫 번째 우주선이었다."]],"w":"1번 came back to the Earth successfully와 2번 make multiple trips에서 가져왔어요. 나머지 단어는 명사라서 trips 앞 꾸미는 자리와 came back 뒤 방법을 나타내는 자리에 들어갈 수 없어요.","c":null},"h":"e98297b465"}]},{"u":10,"id":"hk3-10-4","no":4,"ko":"오늘도 남매는 평화롭다","items":[{"n":1,"t":"tf","q":"Minnie tried to use Phil's laptop while he was at soccer practice.","ko":"Minnie는 Phil이 축구 연습 중인 동안 그의 노트북을 사용하려고 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"One day, Minnie tried to use his laptop while he was at soccer practice.","어느 날, Minnie는 그가 축구 연습 중인 동안 그의 노트북을 사용하려고 했다."]],"w":"3번에 Minnie tried to use his laptop while he was at soccer practice가 그대로 있어요.","c":"T"},"h":"acded6d3c3"},{"n":2,"t":"tf","q":"Minnie could enter the letters from the boxes as the password.","ko":"Minnie는 네모에 있는 글자들을 비밀번호로 입력할 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"Minnie tried to enter these letters, but this didn’t work.","Minnie는 그 글자들을 입력하려고 했지만, 이것은 잘되지 않았다."],[8,"Only numbers could be entered.","숫자들만 입력될 수 있었다."]],"w":"7번에서 글자들을 입력하려고 했지만 잘되지 않았고, 8번에서 숫자들만 입력될 수 있었다고 해요.","c":"F"},"h":"2f6b6462d3"},{"n":3,"t":"tf","q":"Phil was angry and shouted at Minnie when he found her.","ko":"Phil은 Minnie를 발견했을 때 화가 나서 그녀에게 소리 질렀다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"Surprisingly, he didn’t say anything.","놀랍게도, 그는 아무 말도 하지 않았다."]],"w":"14번에서 놀랍게도 Phil은 아무 말도 하지 않았어요. 소리 지른 사람은 17번에서 Minnie예요.","c":"F"},"h":"d931f80eba"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Luckily, there was a clue to figure it out:)","ko":"다행히, 그것을 알아내기 위한 ( )가 있었다.","opts":["경고","벌","단서","질문"],"word":"clue","r":{"a":"3) 단서","ev":"5번 문장","s":[[5,"Luckily, there was a clue to figure it out:","다행히, 그것을 알아내기 위한 단서가 있었다."]],"w":"4번에서 비밀번호로 잠겨 있었고, 5번에서 다행히 그것을 알아내기 위한 무엇이 있었다고 해요. 6번에서 색칠된 네모와 글자가 나와요. clue = 단서, 힌트.","c":3},"h":"de2e555ce5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Instead, he ran to the kitchen and grabbed a donut.)","ko":"대신에, 그는 부엌으로 달려가 도넛을 ( ).","opts":["던졌다","집었다","씻었다","버렸다"],"word":"grabbed","r":{"a":"2) 집었다","ev":"15번 문장","s":[[15,"Instead, he ran to the kitchen and grabbed a donut.","대신에, 그는 부엌으로 달려가 도넛을 집었다."]],"w":"17번에서 Phil이 그것(도넛)을 한 입 베어 무는 것을 봐요. 그러려면 부엌에서 도넛을 손으로 집어 들었을 거예요. grab = 집다, 붙잡다.","c":2},"h":"772f0e4b29"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nMinnie screamed as she watched him take a bite of it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"Minnie는 그가 그것을 한 입 베어 무는 것을 보았을 때 소리를 질렀다.","opts":["노트북","컴퓨터 게임","부엌","도넛"],"r":{"a":"4) 도넛","ev":"15, 17번 문장","s":[[15,"Instead, he ran to the kitchen and grabbed a donut.","대신에, 그는 부엌으로 달려가 도넛을 집었다."],[17,"Minnie screamed as she watched him take a bite of it.","Minnie는 그가 그것을 한 입 베어 무는 것을 보았을 때 소리를 질렀다."]],"w":"한 입 베어 물 수 있는 것은 15번에서 Phil이 집은 도넛이에요. 18번에서도 Phil이 도넛을 먹고 있었다고 해요.","c":4},"h":"773d1e0495"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, he would never let her use it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 그는 절대로 그녀가 그것을 사용하게 두지 않았다.","opts":["그는 절대로 그녀가 그것을 사용하게 두지 않았다.","그는 그녀가 그것을 사용하게 해 주기로 약속했다.","그는 그것을 절대로 사용하지 않으려고 했다.","그는 그녀가 그것을 사용하는 것을 좋아
