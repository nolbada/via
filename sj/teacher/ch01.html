key":"시간에서의 변화는 시차증을 유발할 수 있지만, 환경에서 오는 신호는 우리의 생체 시계를 재조정할 수 있다.","hae":"","easy":[["먼저 뼈대부터:","A shift in timing may cause jet lag, but cues from the environment can readjust our body clocks","시간에서의 변화는 시차증을 유발할 수 있지만, 환경에서 오는 신호는 우리의 생체 시계를 재조정할 수 있다."],["어떤 변화?","A major shift in day-night timing","낮과 밤 시간에서의 큰 변화."],["어떤 시차증?","temporary jet lag","일시적인 시차증."],["어떤 환경?","the new environment","새로운 환경."],["어떤 생체 시계?","our internal body clocks","우리의 내부 생체 시계."],["낮밤 시간이 크게 바뀌면 잠깐 시차증이 생기지만, 새 환경의 신호가 몸의 시계를 다시 맞춰 줌"]],"en":"A major shift in day-night timing may cause temporary jet lag, but cues from the new environment can readjust our internal body clocks.","bf":[true,false,true,true,false,true,true,true,false,true,true,true,true,true,true,false,true,true,true,true,false,true,true],"nat":"낮과 밤의 시간대가 크게 바뀌면 일시적인 시차증이 생길 수 있지만, 새로운 환경에서 오는 신호가 우리 몸속 생체 시계를 다시 맞춰 줄 수 있다."}];

gestive of this ability) / give them a (strong social) presence.","ko":"비서 로봇은 / 사용자와 상호 작용할 수 있다, // 그리고 그것의 디자인 특징은 (이러한 능력을 암시하는) / 그것에 (강한 사회적) 존재감을 부여한다.","key":"비서 로봇은 사용자와 상호 작용할 수 있으며, 그것의 디자인 특징은 그것에 존재감을 부여한다.","hae":"","easy":[["먼저 뼈대부터:","Personal assistant robots can interact with users, and their design features give them a presence","비서 로봇은 사용자와 상호 작용할 수 있고, 디자인 특징이 그것에 존재감을 부여한다."],["어떤 디자인 특징?","their design features suggestive of this ability","이러한 능력을 암시하는 디자인 특징."],["어떤 존재감?","a strong social presence","강한 사회적 존재감."],["비서 로봇은 사용자와 상호 작용할 수 있고, 그 능력을 암시하는 디자인 덕분에 강한 사회적 존재감을 가짐"]],"en":"Personal assistant robots can interact with users, and their design features suggestive of this ability give them a strong social presence.","bf":[true,true,true,true,true,true,true,true,true,true,true,false,false,false,false,true,true,true,false,false,true],"nat":"개인 비서 로봇은 사용자와 상호 작용할 수 있으며, 이러한 능력을 암시하는 로봇의 디자인 특징이 로봇에 강한 사회적 존재감을 부여한다."},{"id":"010","tag":"고3 모의응용","core":"(Extensive) research (by (cultural) psychologists and anthropologists) / shows // that cultures develop / (distinct) words and concepts (for describing emotions).","ko":"(광범위한) 연구는 ((문화) 심리학자들과 인류학자들이 수행한) / 보여 준다 // 문화 공동체들이 발달시킨다는 것을 / (뚜렷이 다른) 단어와 개념을 (감정을 묘사하기 위한).","key":"연구는 문화 공동체들이 단어와 개념을 발달시킨다는 것을 보여 준다.","hae":"","easy":[["먼저 뼈대부터:","Research shows that cultures develop words and concepts","연구는 문화 공동체들이 단어와 개념을 발달시킨다는 것을 보여 준다."],["어떤 연구?","Extensive research by cultural psychologists and anthropologists","문화 심리학자들과 인류학자들이 수행한 광범위한 연구."],["어떤 단어와 개념?","distinct words and concepts for describing emotions","감정을 묘사하기 위한 뚜렷이 다른 단어와 개념."],["문화마다 감정을 나타내는 단어와 개념이 서로 다름"]],"en":"Extensive research by cultural psychologists and anthropologists shows that cultures develop distinct words and concepts for describing emotions.","bf":[false,true,false,false,false,false,false,true,true,true,true,false,true,true,true,false,false,false],"nat":"문화 심리학자와 인류학자의 광범위한 연구는 문화 공동체가 감정을 묘사하기 위한 뚜렷이 다른 단어와 개념을 발달시킨다는 것을 보여 준다."},{"id":"011","tag":"고2 모의응용","core":"A (key) feature of cities (in decline) / is the (excessive) supply of housing and infrastructure (out of proportion to the strength (of their economies)).","ko":"도시의 (핵심적인) 특징은 (쇠퇴하는) / 주택과 사회 기반 시설의 (과도한) 공급이다 ((그들 경제의) 힘과 균형이 맞지 않는).","key":"(어떤) 도시의 특징은 주택과 사회 기반 시설의 공급이다.","hae":"핵심을 통해 어떤 도시의 특징과 관련된 내용임을 알 수 있다.","easy":[["먼저 뼈대부터:","A feature of cities is the supply of housing and infrastructure","도시의 특징은 주택과 사회 기반 시설의 공급이다."],["어떤 특징?","A key feature","핵심적인 특징."],["어떤 도시?","cities in decline","쇠퇴하는 도시."],["어떤 공급?","the excessive supply","과도한 공급."],["무엇과 균형이 안 맞는 공급?","out of proportion to the strength of their economies","그들 경제의 힘과 균형이 맞지 않는."],["쇠퇴하는 도시의 핵심 특징은 경제력에 비해 지나치게 많은 주택과 기반 시설"]],"en":"A key feature of cities in decline is the excessive supply of housing and infrastructure out of proportion to the strength of their economies.","bf":[true,false,true,true,true,false,false,true,true,false,true,true,true,true,true,false,false,false,false,false,false,false,false,false],"nat":"쇠퇴하는 도시의 핵심적인 특징은 경제력에 걸맞지 않게 주택과 사회 기반 시설이 과도하게 공급된다는 것이다."},{"id":"012","tag":"고3 모의응용","core":"Food etiquette (in (early modern) European societies) / became a sign of (social) barriers (inherent in (hierarchical) societies) / and of the impossibility of breaking them down.","ko":"식사 예절은 ((근대 초기의) 유럽 사회에서의) / (사회적) 장벽의 징표가 되었다 ((계급에 따른) 사회에 내재하는) / 그리고 그것을 부수는 것의 불가능성의.","key":"식사 예절은 장벽과 그것(장벽)을 부수는 것의 불가능성의 징표가 되었다.","hae":"식사 예절이 사람들을 구분 짓는 역할을 했음을 의미한다.","easy":[["먼저 뼈대부터:","Food etiquette became a sign of barriers and of the impossibility of breaking them down","식사 예절은 장벽과 그것을 부수는 것의 불가능성의 징표가 되었다."],["어디의 식사 예절?","Food etiquette in early modern European societies","근대 초기의 유럽 사회에서의 식사 예절."],["어떤 장벽?","social barriers inherent in hierarchical societies","계급에 따른 사회에 내재하는 사회적 장벽."],["식사 예절이 계급 사이의 벽, 그리고 그 벽을 허물 수 없음을 보여 주는 표시가 됨"]],"en":"Food etiquette in early modern European societies became a sign of social barriers inherent in hierarchical societies and of the impossibility of breaking them down.","bf":[true,true,false,false,false,false,false,true,true,true,true,false,true,false,false,false,false,true,true,true,true,true,true,true,true],"nat":"근대 초기 유럽 사회의 식사 예절은 계급 사회에 내재한 사회적 장벽과, 그 장벽을 허무는 것이 불가능함을 보여 주는 징표가 되었다."},{"id":"013","tag":"고3 모의응용","core":"The computer makes available / (a range of) data (unattainable in the age of books) / and replaces (traditional) ways of learning (such as memorization).","ko":"컴퓨터는 이용할 수 있게 한다 / (다양한) 자료를 (책의 시대에는 얻기 어려웠던) / 그리고 (전통적인) 학습 방식을 대체한다 (암기와 같은).","key":"컴퓨터는 자료를 이용할 수 있게 하고 학습 방식을 대체한다.","hae":"","easy":[["먼저 뼈대부터:","The computer makes available data and replaces ways of learning","컴퓨터는 자료를 이용할 수 있게 하고 학습 방식을 대체한다."],["어떤 범위의 자료?","a range of data","다양한 자료."],["어떤 자료?","data unattainable in the age of books","책의 시대에는 얻기 어려웠던 자료."],["어떤 학습 방식?","traditional ways of learning such as memorization","암기와 같은 전통적인 학습 방식."],["컴퓨터 덕분에 책으로는 얻기 힘든 자료를 쓰게 되고, 암기식 공부는 밀려남"]],"en":"The computer makes available a range of data unattainable in the age of books and replaces traditional ways of learning such as memorization.","bf":[true,true,true,true,false,false,false,true,false,false,false,false,false,false,true,true,false,true,true,true,false,false,false],"nat":"컴퓨터는 책의 시대에는 얻기 어려웠던 다양한 자료를 이용할 수 있게 해 주고, 암기와 같은 전통적인 학습 방식을 대체한다."},{"id":"014","tag":"고1 모의응용","core":"A (regular) supply of food and other goods / enables neighborhood retailers to operate (small) stores (within walking distance of residents’ homes).","ko":"식품 및 기타 상품의 (정기적인) 공급은 / 지역 소매업자들이 (소규모) 상점을 운영할 수 있게 한다 (주민들의 집에서 걸어갈 수 있는 거리에 있는).","key":"식품 및 기타 상품의 공급은 지역 소매업자들이 상점을 운영할 수 있게 한다.","hae":"","easy":[["먼저 뼈대부터:","A supply of food and other goods enables neighborhood retailers to operate stores","식품 및 기타 상품의 공급은 지역 소매업자들이 상점을 운영할 수 있게 한다."],["어떤 공급?","A regular supply","정기적인 공급."],["어떤 상점?","small stores within walking distance of residents’ homes","주민들의 집에서 걸어갈 수 있는 거리에 있는 소규모 상점."],["물건이 꾸준히 들어오면 동네 가까이에 작은 가게를 열 수 있음"]],"en":"A regular supply of food and other goods enables neighborhood retailers to operate small stores within walking distance of residents’ homes.","bf":[true,false,true,true,true,true,true,true,true,true,true,true,true,false,true,false,false,false,false,false,false],"nat":"식품과 그 밖의 상품이 정기적으로 공급되기 때문에, 동네 소매업자들은 주민들의 집에서 걸어갈 수 있는 거리에 작은 상점을 운영할 수 있다."},{"id":"015","tag":"고2 모의응용","core":"The use of a common resource (by (large numbers of) people) / can cause problems (such as traffic jams, overcrowding, and overuse) / and reduce its benefits (for (individual) users).","ko":"공유자원의 이용은 ((많은) 사람에 의한) / 문제를 일으킬 수 있다 (교통 체증, 혼잡, 과도한 사용과 같은) / 그리고 그것의 혜택을 감소시킬 수 있다 ((개별) 이용자들을 위한).","key":"공유자원의 이용은 문제를 일으킬 수 있으며 그것의 혜택을 감소시킬 수 있다.","hae":"","easy":[["먼저 뼈대부터:","The use of a common resource can cause problems and reduce its benefits","공유자원의 이용은 문제를 일으킬 수 있고 그것의 혜택을 감소시킬 수 있다."],["누구에 의한 이용?","by large numbers of people","많은 사람에 의한."],["어떤 문제?","problems such as traffic jams, overcrowding, and overuse","교통 체증, 혼잡, 과도한 사용과 같은 문제."],["누구를 위한 혜택?","its benefits for individual users","개별 이용자들을 위한 그것의 혜택."],["여럿이 함께 쓰는 자원은 붐비고 닳아서 각자에게 돌아가는 혜택이 줄어듦"]],"en":"The use of a common resource by large numbers of people can cause problems such as traffic jams, overcrowding, and overuse and reduce its benefits for individual users.","bf":[true,true,true,true,true,true,false,false,false,false,false,true,true,true,false,false,false,false,false,false,false,true,true,true,true,false,false,false],"nat":"많은 사람이 공유 자원을 이용하면 교통 체증, 혼잡, 과도한 사용 같은 문제가 생길 수 있고, 개별 이용자가 누리는 그 자원의 혜택이 줄어들 수 있다."},{"id":"016","tag":"고1 모의응용","core":"Examination of (human) remains (from (early) hunter-gatherer societies) / has suggested // that our ancestors had access to (abundant) food (obtainable without (great) effort).","ko":"(인간) 유해에 대한 조사는 ((초기) 수렵·채집인 사회에서 나온) / 시사해 왔다 // 우리 조상들이 (풍부한) 식량에 접근할 수 있었다는 것을 ((큰) 노력 없이 얻을 수 있는).","key":"유해에 대한 조사는 우리 조상들이 식량에 접근할 function redraw(cv,id){

  c.lineCap="round"; c.lineJoin="round"; c.lineWidth=3.5;
  (ink[id]||[]).forEach(s=>{
    c.strokeStyle=s.c; c.beginPath();
    s.pts.forEach((p,i)=>{ i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); });
    if(s.pts.length===1) c.lineTo(s.pts[0][0]+.1,s.pts[0][1]);
    c.stroke();
  });
}
function bindInk(cv,id){

  const wipe=p=>{ const a=ink[id]||[]; ink[id]=a.filter(s=>!s.pts.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<16)); redraw(cv,id); };

    const p=pos(e); if(erase){ cur="E"; wipe(p); } else { cur={c:pc,pts:[p]}; (ink[id]=ink[id]||[]).push(cur); redraw(cv,id); } };
  cv.onpointermove=e=>{ if(!cur) return; const p=pos(e); if(cur==="E") wipe(p); else{ cur.pts.push(p); redraw(cv,id); } };

    const k=w.dataset.k;
    if(activeKey===k){ hideNote(); render(); return; }
    showNote(w.dataset.w,k); render(); return;
  }
  const nx=e.target.closest("[data-next]"), pv=e.target.closest("[data-prev]");
  if(nx||pv){
    const id=(nx||pv).dataset.next||(nx||pv).dataset.prev;
    const x=SENT.concat(SENT2,REV).find(s=>s.id===id), len=stages(x).length;
    if(nx) step[id]=(step[id]||0)>=len?0:(step[id]||0)+1; else step[id]=Math.max(0,(step[id]||0)-1);
    render();
  }
});
$("#nx").onclick=()=>{ hideNote(); render(); };
["S","B","R"].forEach(k=>{ $("#tab"+k).onclick=()=>{ tab=k.toLowerCase(); hideNote(); render(); }; });
let tx=null;
$("#main").addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; },{passive:true});
$("#main").addEventListener("touchend",e=>{
  if(tx===null||pen) return;
  const dx=e.changedTouches[0].clientX-tx; tx=null;
  if(Math.abs(dx)<70) return;
  const pg=["s","b","r"], n=pg.indexOf(tab)+(dx<0?1:-1);
  if(n>=0&&n<pg.length){ tab=pg[n]; hideNote(); render(); window.scrollTo(0,0); }
},{passive:true});
function penUI(){
  document.body.classList.toggle("penon",pen);
  $("#penBtn").classList.toggle("on",pen);
  $("#penTools").hidden=!pen;
  $("#penErase").classList.toggle("on",erase);
  document.querySelectorAll(".pc").forEach(b=>b.classList.toggle("on",!erase&&b.dataset.c===pc));
}
$("#penBtn").onclick=()=>{ pen=!pen; if(pen) hideNote(); penUI(); };
$("#penErase").onclick=()=>{ erase=!erase; penUI(); };
$("#penClear").onclick=()=>{ (tab==="s"?SENT:tab==="b"?SENT2:REV).forEach(x=>delete ink[x.id]); render(); };
document.querySelectorAll(".pc").forEach(b=>b.onclick=()=>{ pc=b.dataset.c; erase=false; penUI(); });
window.addEventListener("resize",render);
penUI(); render();
</script>
