요. 사실은 각각 어땠을지 반대로 생각해 보세요.", "h2": "상상하는 말이 긍정이면 사실은 부정이고, 상상하는 말이 부정이면 사실은 긍정이에요. (1)은 긍정(had told), (2)는 부정(wouldn't have gone)이에요.", "why": "Judy가 알렸더라면 Kevin은 가지 않았을 텐데라는 말이에요. 사실은 Judy가 알리지 않았고(didn't tell) Kevin은 경기장에 갔어요(went).", "opts": [], "pencil": "가정법 과거완료의 사실은 상상하는 말과 ___이에요", "pencilKey": "반대", "page": 219, "sec": "s1"}, {"id": "S1-04", "step": 1, "no": 4, "qtype": "유형 01 가정법 과거완료", "type": "mc", "ans": "④", "concept": ["089", "088"], "gap": "", "words": [["hungry", "배고픈"], ["soup", "수프"]], "h1": "If I had been hungry, I would have eaten the soup.은 '배고팠다면 수프를 먹었을 텐데'예요. 이 말을 As로 시작하는 사실의 문장으로 바꾸려면 뜻이 어떻게 되는지 생각해 보세요.", "h2": "가정법 과거완료를 사실로 바꿀 때는 시제를 과거로 쓰고, 긍정은 부정으로, 부정은 긍정으로 뒤집어요. 상상하는 말이 둘 다 긍정이니 사실은 어떤 방향이 될지 생각해 보세요.", "why": "사실은 '배고프지 않아서 수프를 먹지 않았다'예요. 그래서 As I wasn't hungry, I didn't eat(원형 eat 먹다) the soup.이 돼요.", "opts": [{"n": "①", "en": "am – will eat", "ko": "이다 – 먹을 것이다", "ok": false, "why": "현재와 미래라서 과거 이야기와 맞지 않아요."}, {"n": "②", "en": "was – didn't eat", "ko": "이었다 – 먹지 않았다", "ok": false, "why": "was가 긍정이라서 사실의 반대가 아니에요. wasn't라야 해요."}, {"n": "③", "en": "was – ate", "ko": "이었다 – 먹었다", "ok": false, "why": "둘 다 긍정이라서 상상하는 말과 같은 뜻이 돼요."}, {"n": "④", "en": "wasn't – didn't eat", "ko": "아니었다 – 먹지 않았다", "ok": true, "why": "사실은 둘 다 부정이라서 맞아요."}, {"n": "⑤", "en": "wasn't – would eat", "ko": "아니었다 – 먹을 텐데", "ok": false, "why": "would eat은 상상하는 말이라서 사실을 말하는 문장에 쓸 수 없어요."}], "pencil": "가정법 과거완료를 사실로 바꾸면 ___ 시제에 긍정은 부정", "pencilKey": "과거", "page": 219, "sec": "s1"}, {"id": "S1-05", "step": 1, "no": 5, "qtype": "유형 01 가정법 과거완료", "type": "write", "ans": "hadn't helped", "concept": ["088"], "gap": "", "words": [["help", "돕다"], ["succeed", "성공하다"]], "h1": "'네가 나를 돕지 않았더라면 나는 성공하지 못했을 텐데'예요. 주절이 couldn't have succeeded(원형 succeed 성공하다)인 점을 먼저 보세요.", "h2": "주절이 「조동사의 과거형 + have + 과거분사」이니 if절은 「had + 과거분사」예요. 이번에는 '돕지 않았더라면'이라서 부정이에요.", "why": "if절은 지난 일을 부정으로 상상하니 hadn't helped(원형 help 돕다)가 돼요. If you hadn't helped me, I couldn't have succeeded.예요.", "opts": [], "pencil": "지난 일을 부정으로 상상하는 if절: ___ + 과거분사", "pencilKey": "hadn't", "page": 219, "sec": "s1"}, {"id": "S1-06", "step": 1, "no": 6, "qtype": "유형 01 가정법 과거완료", "type": "mc", "ans": "②", "concept": ["088"], "gap": "", "words": [["run", "달리다"], ["win", "우승하다"]], "h1": "'내가 더 빨리 달렸더라면 나는 우승할 수 있었을 텐데'는 지난 일을 반대로 상상하는 말이에요. if절과 주절의 모양을 하나씩 확인하세요.", "h2": "지난 일을 상상하는 말은 「If + 주어 + had + 과거분사, 주어 + 조동사의 과거형 + have + 과거분사」예요. run(달리다)의 과거분사는 run이에요.", "why": "if절은 had run, 주절은 could have won(원형 win 이기다)이라서 If I had run faster, I could have won.이 맞아요.", "opts": [{"n": "①", "en": "If I ran faster, I could have won.", "ko": "내가 더 빨리 달린다면 우승했을 수 있을 텐데.", "ok": false, "why": "if절이 과거형 ran이라서 지금 일을 상상하는 모양이에요. had run이라야 해요."}, {"n": "②", "en": "If I had run faster, I could have won.", "ko": "내가 더 빨리 달렸더라면 나는 우승할 수 있었을 텐데.", "ok": true, "why": "if절과 주절이 모두 알맞아요."}, {"n": "③", "en": "If I had run faster, I can have won.", "ko": "내가 더 빨리 달렸더라면 우승했을 수 있다.", "ok": false, "why": "주절의 can have won은 없는 모양이에요. could have won이라야 해요."}, {"n": "④", "en": "If I have run faster, I could win.", "ko": "내가 더 빨리 달려 왔다면 우승할 수 있을 텐데.", "ok": false, "why": "현재완료와 could win이라서 지난 일을 상상하는 모양이 아니에요."}, {"n": "⑤", "en": "If I have run faster, I could have won.", "ko": "내가 더 빨리 달려 왔다면 우승했을 수 있을 텐데.", "ok": false, "why": "if절이 현재완료 have run이라서 틀려요. had run이라야 해요."}], "pencil": "지난 일을 상상하는 주절: 조동사의 과거형 + ___ + 과거분사", "pencilKey": "have", "page": 219, "sec": "s1"}, {"id": "S1-07", "step": 1, "no": 7, "qtype": "유형 01 가정법 과거완료", "type": "write", "ans": "had done, I wouldn't have been punished", "concept": ["088"], "gap": "", "words": [["punish", "벌주다"], ["homework", "숙제"], ["do", "하다"]], "h1": "'숙제를 했더라면 벌을 받지 않았을 텐데'예요. 주어진 표현을 if절과 주절 두 부분으로 나눠 보세요. 'If I' 다음이 if절의 동사예요.", "h2": "if절은 had 뒤에 괄호 속 done을 쓰고, 주절은 wouldn't have 뒤에 수동의 모양이 와요. 벌을 '받는' 것이라서 수동이에요.", "why": "If I had done(원형 do 하다) my homework, I wouldn't have been punished.가 돼요. 벌을 '받는' 것이니까 wouldn't have been punished 모양이에요.", "opts": [], "pencil": "지난 일을 상상하는 주절의 수동: would have + ___ + 과거분사", "pencilKey": "been", "page": 219, "sec": "s1"}, {"id": "S1-08", "step": 1, "no": 8, "qtype": "유형 01 가정법 과거완료", "type": "write", "ans": "had paid, would have understood", "concept": ["088", "089"], "gap": "", "words": [["pay attention to", "~에 주의를 기울이다"], ["understand", "이해하다"]], "h1": "'Andrew가 집중하지 않아서 이해하지 못했다'는 사실을 반대로 상상하는 문장이에요. 사실이 부정이니 상상하는 말은 긍정이에요.", "h2": "if절은 「had + 과거분사」(pay의 과거분사), 주절은 will의 과거형 would를 써서 「would have + 과거분사」로 만들어요.", "why": "If Andrew had paid(원형 pay 기울이다) attention to his teacher, he would have understood(원형 understand 이해하다) what she said.가 돼요. 조건에서 will을 활용하라고 해서 would를 썼어요.", "opts": [], "pencil": "과거 사실의 반대: if절 had + 과거분사, 주절 would + ___ + 과거분사", "pencilKey": "have", "page": 219, "sec": "s1"}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 02 혼합 가정법", "type": "mc", "ans": "⑤", "concept": ["088", "088-H1"], "gap": "", "words": [["leave a message", "메시지를 남기다"], ["vegetarian", "채식주의자"], ["attend", "참석하다"]], "h1": "'어색한 것'을 찾는 문제예요. 각 보기가 과거 일(had p.p. + would have p.p.)인지 지금 일(과거형 + would)인지 구별하고 시제가 짝이 맞는지 보세요.", "h2": "if절이 were나 과거형이면 지금 일, had + 과거분사이면 지난 일을 상상하는 말이에요. 보기마다 if절과 주절의 때가 같은 쪽인지 비교해 보세요.", "why": "⑤는 '그녀가 아프지 않았더라면 모임에 참석했을 텐데'가 자연스러워요. 지난 일이므로 were not sick을 hadn't been sick으로 고쳐야 해요.", "opts": [{"n": "①", "en": "If she had left a message, I would have called her.", "ko": "그녀가 메시지를 남겼더라면 나는 전화했을 텐데.", "ok": false, "why": "had left(원형 leave 남기다)와 would have called가 짝이 맞아요."}, {"n": "②", "en": "If Robert worked harder, he could finish the work.", "ko": "Robert가 더 열심히 일한다면 그 일을 끝낼 수 있을 텐데.", "ok": false, "why": "지금 일을 상상하는 모양이 짝이 맞아요."}, {"n": "③", "en": "If I had known she was a vegetarian, I wouldn't have cooked steak.", "ko": "그녀가 채식주의자라는 걸 알았더라면 스테이크를 요리하지 않았을 텐데.", "ok": false, "why": "had known과 wouldn't have cooked가 짝이 맞아요."}, {"n": "④", "en": "If I were stronger, I would carry the furniture for you.", "ko": "내가 더 힘이 세다면 너 대신 가구를 옮길 텐데.", "ok": false, "why": "were와 would carry가 짝이 맞아요."}, {"n": "⑤", "en": "If she were not sick, she could have attended the meeting.", "ko": "그녀가 아프지 않다면 모임에 참석했을 수 있을 텐데.", "ok": true, "why": "if절은 지금, 주절은 과거라서 어색해요. hadn't been sick으로 고쳐요."}], "pencil": "지난 일을 상상하는 if절: ___ + been, 과거분사", "pencilKey": "hadn't", "page": 220, "sec": "s1"}, {"id": "S1-10", "step": 1, "no": 10, "qtype": "유형 02 혼합 가정법", "type": "mc", "ans": "②", "concept": ["088-H1", "089"], "gap": "", "words": [["snow", "눈이 오다"], ["slippery", "미끄러운"], ["road", "길"]], "h1": "'어젯밤에 눈이 와서 오늘 길이 미끄럽다'는 사실이에요. 어젯밤(과거)과 오늘(지금)이 섞여 있어서 if절과 주절의 때를 따로 보세요.", "h2": "과거에 한 일이 지금까지 영향을 줄 때 쓰는 혼합 가정법이에요. if절은 지난 일이라서 가정법 과거완료(had + 과거분사), 주절은 지금 일이라서 가정법 과거(would + 동사원형)를 써요.", "why": "'어젯밤 눈이 오지 않았더라면 오늘 길이 미끄럽지 않을 텐데'가 돼요. if절은 hadn't snowed(원형 snow 눈이 오다), 주절은 wouldn't be예요.", "opts": [{"n": "①", "en": "didn't snow – wouldn't be", "ko": "눈이 오지 않는다면 – 아닐 텐데", "ok": false, "why": "어젯밤 일이라서 didn't가 아니라 hadn't snowed라야 해요."}, {"n": "②", "en": "hadn't snowed – wouldn't be", "ko": "눈이 오지 않았더라면 – 아닐 텐데", "ok": true, "why": "if절은 지난 일, 주절은 지금 일이라서 맞아요."}, {"n": "③", "en": "didn't have snowed – wouldn't be", "ko": "(틀린 모양)", "ok": false, "why": "didn't have snowed는 없는 모양이에요."}, {"n": "④", "en": "hadn't snowed – wouldn't have been", "ko": "눈이 오지 않았더라면 – 아니었을 텐데", "ok": false, "why": "주절에 today(오늘)가 있어서 would have been이 아니라 would be라야 해요."}, {"n": "⑤", "en": "hasn't snowed – wouldn't be", "ko": "눈이 오지 않았다면 – 아닐 텐데", "ok": false, "why": "현재완료 hasn't snowed는 if절에 쓰지 않아요."}], "pencil": "혼합 가정법: if절 had + 과거분사, 주절 would + ___", "pencilKey": "동사원형", "page": 220, "sec": "s1"}, {"id": "S1-11", "step": 1, "no": 11, "qtype": "유형 02 혼합 가정법", "type": "mc", "ans": "②", "concept": ["088-H1", "089"], "gap": "", "words": [["sprain", "삐다"], ["ankle", "발목"], ["skating", "스케이트 타기"]], "h1": "'지난 주말에 발목을 삐어서 오늘 스케이트를 못 탄다'는 상황이에요. 지난 일이 지금까지 영향을 주고 있는지 먼저 보세요.", "h2": "빈칸 문장에 now(지금)가 있어요. 지금 일을 상상하는 주절은 would + 동사원형이에요. if절은 이미 hadn't sprained로 지난 일이에요.", "why": "'발목을 삐지 않았더라면 지금 친구들과 스케이트를 타고 있을 텐데'예요. 지금 일이므로 주절은 would be skating이에요.", "opts": [{"n": "①", "en": "will be", "ko": "있을 것이다", "ok": false, "why": "will은 사실이 아닌 일을 상상하는 말의 주절에 쓰지 않아요."}, {"n": "②", "en": "would be", "ko": "있을 텐데", "ok": true, "why": "지금 일을 상상하는 주절이라서 맞아요."}, {"n": "③", "en": "will have been", "ko": "있었을 것이다", "ok": false, "why": "미래완료라서 상상하는 말의 모양이 아니에요."}, {"n": "④", "en": "would have been", "ko": "있었을 텐데", "ok": false, "why": "now가 있어서 지금 일이에요. would have been이면 지난 일이 돼요."}, {"n": "⑤", "en": "would had been", "ko": "(틀린 모양)", "ok": false, "why": "would 뒤에 had를 쓸 수 없어요."}], "pencil": "지금의 결과를 상상하는 주절: would + ___", "pencilKey": "동사원형", "page": 220, "sec": "s1"}, {"id": "S1-12", "step": 1, "no": 12, "qtype": "유형 02 혼합 가정법", "type": "write", "ans": "had taken, would be", "concept": ["088-H1"], "gap": "", "words": [["advice", "조언"], ["healthy", "건강한"], ["take", "받아들이다"]], "h1": "'네가 의사의 조언을 들었더라면, 지금 건강할 텐데'예요. '들었더라면'은 지난 일이고 '지금 건강할 텐데'는 지금 일이에요.", "h2": "혼합 가정법이라서 if절은 had + 과거분사, 주절은 will의 과거형 would + 동사원형이에요. 괄호의 take는 과거분사 모양으로 바꾸세요.", "why": "If you had taken(원형 take 받아들이다) the doctor's advice, you would be healthy now.가 돼요. 지난 일이 지금에 영향을 주는 혼합 가정법이에요.", "opts": [], "pencil": "혼합 가정법: if절 had + 과거분사, 주절 ___ + 동사원형", "pencilKey": "would", "page": 220, "sec": "s1"}, {"id": "S1-13", "step": 1, "no": 13, "qtype": "유형 03 I wish / as if 가정법 과거완료", "type": "write", "ans": "had been", "concept": ["090"], "gap": "", "words": [["careful", "조심스러운"], ["wish", "바라다"]], "h1": "'네가 좀 더 조심했더라면 좋았을 텐데'는 지난 일에 대한 아쉬움이에요. I wish 뒤에 어떤 모양이 와야 하는지 떠올려 보세요.", "h2": "지난 일에 대한 아쉬움은 I wish 뒤에 「had + 과거분사」를 써요. be동사의 과거분사는 been이에요.", "why": "과거에 조심하지 않아서 아쉬운 마음이에요. 그래서 I wish you had been more careful.이 돼요.", "opts": [], "pencil": "지난 일이 아쉬운 I wish 뒤: ___ + 과거분사", "pencilKey": "had", "page": 220, "sec": "s1"}, {"id": "S1-14", "step": 1, "no": 14, "qtype": "유형 03 I wish / as if 가정법 과거완료", "type": "mc", "ans": "④", "concept": ["059", "090"], "gap": "", "words": [["regret", "후회하다"], ["must have", "~했음이 틀림없다"], ["eat too much", "너무 많이 먹다"]], "h1": "다섯 문장이 모두 '너무 많이 먹었다'는 이야기예요. 후회하는 마음인지, 확실히 추측하는 마음인지 나눠 보세요.", "h2": "I'm sorry that, I regret that, I shouldn't have p.p., I wish I had p.p.는 모두 지난 일을 후회하는 표현이에요. 후회가 아닌 다른 마음을 나타내는 문장이 하나 있어요.", "why": "①, ②, ③, ⑤는 너무 많이 먹은 것을 후회하는 말이에요. ④ must have eaten(원형 eat 먹다)은 '너무 많이 먹었음이 틀림없다'는 추측이라서 뜻이 달라요.", "opts": [{"n": "①", "en": "I'm sorry that I ate too much.", "ko": "너무 많이 먹어서 아쉽다.", "ok": false, "why": "후회하는 말이라서 나머지와 같아요."}, {"n": "②", "en": "I shouldn't have eaten too much.", "ko": "너무 많이 먹지 말았어야 했는데.", "ok": false, "why": "후회하는 말이라서 나머지와 같아요."}, {"n": "③", "en": "I wish I had not eaten too much.", "ko": "너무 많이 먹지 않았더라면 좋았을 텐데.", "ok": false, "why": "후회하는 말이라서 나머지와 같아요."}, {"n": "④", "en": "I must have eaten too much.", "ko": "나는 너무 많이 먹었음이 틀림없다.", "ok": true, "why": "확실한 추측이라서 나머지와 뜻이 달라요."}, {"n": "⑤", "en": "I regret that I ate too much.", "ko": "너무 많이 먹은 것을 후회한다.", "ok": false, "why": "후회하는 말이라서 나머지와 같아요."}], "pencil": "must have p.p.는 ___의 뜻이에요", "pencilKey": "~했음이 틀림없다", "page": 220, "sec": "s1"}, {"id": "S1-15", "step": 1, "no": 15, "qtype": "유형 03 I wish / as if 가정법 과거완료", "type": "mc", "ans": "⑤", "concept": ["090-2"], "gap": "", "words": [["London", "런던"], ["visit", "방문하다"]], "h1": "'Fred는 런던에 가 본 적이 없는데 갔던 것처럼 말한다'는 뜻이에요. as if 뒤에 가 본 적이 있는 것처럼 어떤 모양을 써야 하는지 보세요.", "h2": "as if 뒤에 had + 과거분사를 쓰면 주절(말하는 때)보다 앞선 일을 상상해요. 가 본 적이 있다는 건 말하는 때보다 앞선 일이에요.", "why": "has never been(원형 be 이다)이라서 사실은 방문한 적이 없어요. 방문했던 것처럼이라서 as if 뒤에 had visited(원형 visit 방문하다)를 써요.", "opts": [{"n": "①", "en": "visits", "ko": "방문한다", "ok": false, "why": "현재형이라서 as if 뒤에 맞지 않아요."}, {"n": "②", "en": "visited", "ko": "방문했다", "ok": false, "why": "과거형은 말하는 때와 같은 때를 상상할 때 써요. 앞선 일에는 had visited가 필요해요."}, {"n": "③", "en": "is visiting", "ko": "방문하고 있다", "ok": false, "why": "현재진행형이라서 맞지 않아요."}, {"n": "④", "en": "has visited", "ko": "방문한 적이 있다", "ok": false, "why": "현재완료는 as if 뒤에 쓰지 않아요."}, {"n": "⑤  + 과거분사예요.", "opts": [{"n": "①", "en": "as if nothing happened", "ko": "마치 아무 일도 일어나지 않는 것처럼", "ok": false, "why": "과거형은 행동하는 때와 같은 때를 상상할 때 써요. 앞선 일은 had happened라야 해요."}, {"n": "②", "en": "as if nothing had happened", "ko": "마치 아무 일도 없었던 것처럼", "ok": true, "why": "as if + had + 과거분사라서 맞아요."}, {"n": "③", "en": "as if nothing has happened", "ko": "마치 아무 일도 일어난 적이 없는 것처럼", "ok": false, "why": "현재완료는 as if 뒤에 쓰지 않아요."}, {"n": "④", "en": "as if nothing had been happened", "ko": "(틀린 모양)", "ok": false, "why": "happen은 '일어나다'라서 수동태로 쓸 수 없어요."}, {"n": "⑤", "en": "as if nothing has had happened", "ko": "(틀린 모양)", "ok": false, "why": "has had happened는 없는 모양이에요."}], "pencil": "as if + had + ___: 앞선 일을 상상해요", "pencilKey": "과거분사", "page": 221, "sec": "s1"}, {"id": "S1-21", "step": 1, "no": 21, "qtype": "유형 04 without 가정법 과거완료", "type": "mc", "ans": "①", "concept": ["090-H1"], "gap": "", "words": [["accomplish", "이루다"], ["goal", "목표"], ["help", "도움"]], "h1": "밑줄 친 Without이 '~이 없었다면'이라는 뜻이에요. 같은 뜻으로 쓸 수 있는 표현을 보기에서 찾으세요.", "h2": "'~이 없었다면'은 Without 말고도 But for ~, If it had not been for ~로 쓸 수 있어요.", "why": "Without Mr. Brown's help는 '브라운 선생님의 도움이 없었다면'이라는 뜻이에요. 같은 뜻의 But for(~이 없었다면)로 바꿔 쓸 수 있어요.", "opts": [{"n": "①", "en": "But for", "ko": "~이 없었다면", "ok": true, "why": "Without과 같은 뜻이라서 맞아요."}, {"n": "②", "en": "But", "ko": "그러나", "ok": false, "why": "뒤에 for가 없으면 '그러나'라는 뜻이 돼요."}, {"n": "③", "en": "Like", "ko": "~처럼", "ok": false, "why": "비교하는 말이라서 뜻이 달라요."}, {"n": "④", "en": "As if", "ko": "마치 ~인 것처럼", "ok": false, "why": "상상하는 말이지만 '~이 없다면'의 뜻은 아니에요."}, {"n": "⑤", "en": "Thanks to", "ko": "~ 덕분에", "ok": false, "why": "도움이 없다는 뜻이 아니라 있다는 뜻이라서 반대예요."}], "pencil": "'~이 없었다면'은 Without 또는 ___ + 명사", "pencilKey": "But for", "page": 221, "sec": "s1"}, {"id": "S1-22", "step": 1, "no": 22, "qtype": "유형 04 without 가정법 과거완료", "type": "write", "ans": "it had not been for", "concept": ["090-H1"], "gap": "", "words": [["accident", "사고"], ["world champion", "세계 챔피언"]], "h1": "But for the accident를 If로 시작하는 말로 바꾸는 문제예요. 지난 일이라서 If it 뒤에 과거완료 모양이 와요.", "h2": "But for ~는 If it으로 시작하는 말로 바꿔 쓸 수 있어요. 빈칸 하나에 it을 포함한 여러 단어가 들어가고, 지난 일이라서 과거완료 모양이에요.", "why": "'사고가 없었다면 나는 세계 챔피언이 되었을 텐데'예요. If it had not been for the accident, I would have been world champion.이 돼요.", "opts": [], "pencil": "'~이 없었다면'은 If it ___ not been for ~", "pencilKey": "had", "page": 221, "sec": "s1"}, {"id": "S1-23", "step": 1, "no": 23, "qtype": "유형 04 without 가정법 과거완료", "type": "write", "ans": "Without, couldn't have found", "concept": ["090-H1"], "gap": "", "words": [["map", "지도"], ["find", "찾다"], ["palace", "궁전"]], "h1": "'지도가 없었다면 우리는 그 궁전을 찾지 못했을 것이다'예요. 첫 빈칸은 '~이 없었다면', 나머지는 can과 find를 이용한 주절이에요.", "h2": "Without 뒤 주절은 「조동사의 과거형 + have + 과거분사」예요. can의 과거형을 부정으로 쓰고, find의 과거분사를 마지막에 써요.", "why": "Without the map, we couldn't have found(원형 find 찾다) the palace.가 돼요. 지도가 없었던 지난 일이라서 couldn't have + 과거분사예요.", "opts": [], "pencil": "Without ~, 주어 + ___ + have + 과거분사", "pencilKey": "couldn't", "page": 221, "sec": "s1"}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 05 통합형", "type": "mc", "ans": "②", "concept": ["088", "088-H1", "090"], "gap": "", "words": [["save money", "돈을 아끼다"], ["birthday party", "생일 파티"], ["crash", "충돌하다"], ["wonderful", "멋진"]], "h1": "'밑줄 친 부분이 옳은 것'을 찾는 문제예요. 각 보기의 if절이나 I wish 뒤 때가 주절과 어울리는지 하나씩 보세요.", "h2": "지난 일을 상상하는 말은 if절이나 I wish 뒤에 had + 과거분사가 필요하고, 지금 일을 상상하는 말은 과거형이 와요. 밑줄 친 부분과 주절의 때를 비교하세요.", "why": "②는 if절 had traveled와 주절 would have saved가 모두 지난 일이라서 맞아요. ①은 could help, ③은 had gone, ④는 had driven, ⑤는 could see로 고쳐야 해요.", "opts": [{"n": "①", "en": "If I were not busy, I could have helped you now.", "ko": "내가 바쁘지 않다면 지금 너를 도왔을 수 있을 텐데.", "ok": false, "why": "now가 있어서 could help라야 해요."}, {"n": "②", "en": "If we had traveled by bus, we would have saved money.", "ko": "우리가 버스로 여행했더라면 돈을 아꼈을 텐데.", "ok": true, "why": "had traveled와 would have saved가 짝이 맞아서 옳아요."}, {"n": "③", "en": "I wish I have gone to his birthday party yesterday.", "ko": "내가 어제 그의 생일 파티에 갔더라면 좋을 텐데.", "ok": false, "why": "yesterday(어제)가 있어서 have gone이 아니라 had gone이라야 해요."}, {"n": "④", "en": "If he drove more slowly, he wouldn't have crashed the car.", "ko": "그가 더 천천히 운전한다면 차를 박지 않았을 텐데.", "ok": false, "why": "주절이 지난 일이라서 if절이 had driven이라야 해요."}, {"n": "⑤", "en": "If you joined us, you could have seen the most wonderful show in the world.", "ko": "네가 우리와 함께한다면 세상에서 가장 멋진 쇼를 봤을 수 있을 텐데.", "ok": false, "why": "if절은 지금, 주절은 과거라서 어색해요. could see라야 해요."}], "pencil": "주절이 would have p.p.이면 if절은 과거형이 아니라 ___ + 과거분사", "pencilKey": "had", "page": 221, "sec": "s1"}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 05 통합형", "type": "mc", "ans": "③", "concept": ["088", "090"], "gap": "", "words": [["cat", "고양이"], ["sightseeing", "관광"], ["memory", "기억력"], ["famous", "유명한"]], "h1": "빈칸에 모두 have(가지다)가 들어가요. 각 문장이 지금 일을 상상하는지, 지난 일을 상상하는지 구별해서 have의 모양을 정하세요.", "h2": "지금 일을 상상할 때는 had, 지난 일을 상상할 때는 had + 과거분사예요. have의 과거분사도 had라서 ③은 had had 모양이에요.", "why": "③은 주절이 could have gone이라서 지난 일을 상상하는 문장이에요. if절에 had + 과거분사인 had had(원형 have 가지다)가 와요. 나머지는 모두 had 한 번만 써요.", "opts": [{"n": "①", "en": "I really love cats. I wish I had one.", "ko": "나는 고양이를 정말 좋아한다. 고양이가 한 마리 있으면 좋을 텐데.", "ok": false, "why": "지금 소망이라서 had예요. 나머지 넷과 같아요."}, {"n": "②", "en": "I wish I had brought my umbrella.", "ko": "우산을 가져왔더라면 좋을 텐데.", "ok": false, "why": "had brought의 had라서 한 번이에요. 나머지와 같아요."}, {"n": "③", "en": "If I had had more time, I could have gone sightseeing.", "ko": "시간이 더 있었더라면 관광을 갈 수 있었을 텐데.", "ok": true, "why": "지난 일이라서 had + 과거분사 had로 had had예요. 나머지와 달라요."}, {"n": "④", "en": "He talked as if he had been famous when he was young.", "ko": "그는 마치 젊을 때 유명했던 것처럼 말했다.", "ok": false, "why": "had been의 had라서 한 번이에요. 나머지와 같아요."}, {"n": "⑤", "en": "If I had a good memory, I could do a better job at my work.", "ko": "내가 기억력이 좋다면 일을 더 잘할 텐데.", "ok": false, "why": "지금 일을 상상해서 had예요. 나머지와 같아요."}], "pencil": "지난 일을 상상하는 문장에서 have의 모양은 ___", "pencilKey": "had had", "page": 221, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "가정법 과거완료", "type": "mc", "ans": "①", "concept": ["089", "088"], "gap": "", "words": [["take a taxi", "택시를 타다"], ["come earlier", "더 일찍 오다"]], "h1": "'택시를 탔더라면 더 일찍 올 수 있었을 텐데'는 지난 일을 반대로 상상하는 말이에요. 이 말을 사실로 바꾸면 어떻게 되는지 생각해 보세요.", "h2": "지난 일을 상상하는 말을 사실로 바꿀 때는 과거형을 쓰고 긍정은 부정으로, 부정은 긍정으로 뒤집어요. 주절의 could have come이 사실에서는 어떻게 바뀔지 생각해 보세요.", "why": "사실은 택시를 타지 않아서 더 일찍 오지 못한 거예요. 그래서 As I didn't take a taxi, I couldn't come earlier.가 돼요.", "opts": [{"n": "①", "en": "As I didn't take a taxi, I couldn't come earlier.", "ko": "나는 택시를 타지 않아서 더 일찍 올 수 없었다.", "ok": true, "why": "사실로 알맞게 바꿨어요."}, {"n": "②", "en": "As I didn't take a taxi, I could come earlier.", "ko": "나는 택시를 타지 않아서 더 일찍 올 수 있었다.", "ok": false, "why": "주절이 긍정이라서 뜻이 어긋나요. couldn't라야 해요."}, {"n": "③", "en": "As I have taken a taxi, I can't come earlier.", "ko": "나는 택시를 타 왔으니 더 일찍 올 수 없다.", "ok": false, "why": "현재완료와 can't라서 지난 일의 사실이 아니에요."}, {"n": "④", "en": "As I took a taxi, I could come earlier.", "ko": "나는 택시를 타서 더 일찍 올 수 있었다.", "ok": false, "why": "긍정이라서 상상하는 말과 같은 방향이에요. 사실은 반대여야 해요."}, {"n": "⑤", "en": "As I don't take a taxi, I can't come earlier.", "ko": "나는 택시를 타지 않아서 더 일찍 올 수 없다.", "ok": false, "why": "현재형이라서 지난 일이 아니에요."}], "pencil": "가정법 과거완료를 사실로 바꾸면 ___ 시제", "pencilKey": "과거", "page": 222, "sec": "s2"}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "가정법 과거완료", "type": "mc", "ans": "⑤", "concept": ["088"], "gap": "", "words": [["feel well", "몸이 괜찮다"], ["movie", "영화"], ["yesterday", "어제"]], "h1": "'어제 몸이 안 좋아서 영화를 보러 가지 못했다'는 사실이에요. 어제 일이라는 점을 보고 if절과 주절의 모양을 정하세요.", "h2": "지난 일을 반대로 상상하는 말이라서 if절은 had + 과거분사(feel의 과거분사), 주절은 would have + 과거분사(go의 과거분사)예요.", "why": "어제 몸이 좋았더라면 영화를 보러 갔을 텐데라는 상상이에요. 그래서 If I had felt(원형 feel 느끼다) well, I would have gone(원형 go 가다) to the movie.가 돼요.", "opts": [{"n": "①", "en": "felt – go", "ko": "느꼈다 – 가다", "ok": false, "why": "if절이 과거형이라서 지금 일을 상상하는 모양이에요. 어제 일이라 had felt라야 해요."}, {"n": "②", "en": "has felt – go", "ko": "느껴 왔다 – 가다", "ok": false, "why": "현재완료는 if절에 쓰지 않고, 주절도 would가 없어 틀려요."}, {"n": "③", "en": "has felt – gone", "ko": "느껴 왔다 – 간", "ok": false, "why": "현재완료이고 gone만 있어서 둘 다 틀려요."}, {"n": "④", "en": "had felt – had gone", "ko": "느꼈다면 – 갔었다", "ok": false, "why": "주절은 would 뒤에 had gone을 쓸 수 없어요. would have gone이라야 해요."}, {"n": "⑤", "en": "had felt – have gone", "ko": "느꼈더라면 – 갔을 텐데", "ok": true, "why": "if절 had felt, 주절 would have gone이라서 맞아요."}], "pencil": "지난 일을 상상하는 말: if절 had p.p., 주절 would + ___ + p.p.", "pencilKey": "have", "page": 222, "sec": "s2"}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "가정법 과거완료", "type": "mc", "ans": "④", "concept": ["088", "089"], "gap": "", "words": [["skip classes", "수업을 빠지다"], ["pass", "통과하다"], ["test", "시험"]], "h1": "'수업을 자주 빠져서 시험에 통과하지 못했다'는 지난 일이에요. 이 사실의 반대를 상상하는 말을 만들 때 두 빈칸이 각각 긍정인지 부정인지 보세요.", "h2": "사실이 '빠졌다(긍정)'이니 if절은 부정, 사실이 '통과하지 못했다(부정)'이니 주절은 긍정이에요. 각각 지난 일을 상상하는 모양으로 쓴 보기를 찾으세요.", "why": "'수업을 자주 빠지지 않았더라면 시험에 통과했을 텐데'가 돼요. 그래서 If I hadn't skipped(원형 skip 빠지다) classes often, I would have passed(원형 pass 통과하다) the test.가 맞아요.", "opts": [{"n": "①", "en": "skipped – will have passed", "ko": "빠졌다 – 통과했을 것이다", "ok": false, "why": "if절이 긍정이라서 사실과 같고, will have passed도 틀려요."}, {"n": "②", "en": "had skipped – would pass", "ko": "빠졌더라면 – 통과할 텐데", "ok": false, "why": "if절이 긍정이라서 뜻이 어긋나고 주절도 지난 일이 아니에요."}, {"n": "③", "en": "didn't skip – will have pass", "ko": "(틀린 모양)", "ok": false, "why": "will have pass는 없는 모양이에요."}, {"n": "④", "en": "hadn't skipped – would have passed", "ko": "빠지지 않았더라면 – 통과했을 텐데", "ok": true, "why": "if절 부정, 주절 긍정으로 맞아요."}, {"n": "⑤", "en": "haven't skipped – would have passed", "ko": "빠지지 않아 왔다면 – 통과했을 텐데", "ok": false, "why": "현재완료는 if절에 쓰지 않아요."}], "pencil": "사실이 긍정이면 if절은 ___, 주절은 사실이 부정이면 긍정", "pencilKey": "부정", "page": 222, "sec": "s2"}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "통합형", "type": "mc", "ans": "②", "concept": ["088", "088-H1"], "gap": "", "words": [["sandwich", "샌드위치"], ["spill", "쏟다"], ["apologize", "사과하다"], ["forgive", "용서하다"]], "h1": "ⓐ부터 ⓓ까지 하나씩 if절과 주절의 때가 맞는지 보세요. 지금을 나타내는 now, yesterday 같은 단서 단어도 찾아보세요.", "h2": "now가 있으면 혼합 가정법(if절 had p.p., 주절 would + 동사원형), 둘 다 지난 일이면 가정법 과거완료예요. 각 문장의 if절 모양이 맞는지 살펴보세요.", "why": "ⓐ(혼합 가정법)와 ⓑ(가정법 과거완료)만 옳아서 2개예요. ⓒ는 apologized를 had apologized로, ⓓ는 hasn't를 hadn't로 고쳐야 해요.", "opts": [{"n": "①", "en": "1개", "ko": "한 개", "ok": false, "why": "옳은 문장이 ⓐ와 ⓑ 두 개라서 틀려요."}, {"n": "②", "en": "2개", "ko": "두 개", "ok": true, "why": "ⓐ와 ⓑ가 옳아서 맞아요."}, {"n": "③", "en": "3개", "ko": "세 개", "ok": false, "why": "ⓒ와 ⓓ는 틀려서 세 개가 아니에요."}, {"n": "④", "en": "4개", "ko": "네 개", "ok": false, "why": "ⓒ와 ⓓ가 틀려서 네 개가 아니에요."}, {"n": "⑤", "en": "없음", "ko": "하나도 없다", "ok": false, "why": "ⓐ와 ⓑ가 옳아서 틀려요."}], "pencil": "지난 일을 상상하는 if절은 과거형이 아니라 ___ + 과거분사", "pencilKey": "had", "page": 222, "sec": "s2"}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "I wish / as if 가정법 과거완료", "type": "mc", "ans": "③", "concept": ["090"], "gap": "", "words": [["French restaurant", "프랑스 식당"], ["reservation", "예약"], ["in advance", "미리"], ["whisper", "속삭이다"]], "h1": "식당이 가득 차서 오래 기다려야 하는 상황이에요. Alice가 속으로 아쉬워하는 말이 무엇일지 생각하고, 미리 예약하지 못한 것이 지난 일인지 보세요.", "h2": "지난 일의 후회는 I wish 뒤에 「had + 과거분사」를 써요. 현재완료나 과거형, 수동태 모양은 맞지 않아요.", "why": "예약하지 못한 것이 아쉬운 마음이에요. 그래서 I wish I had made(원형 make 하다) a reservation in advance.가 맞아요.", "opts": [{"n": "①", "en": "I wish I made a reservation in advance.", "ko": "내가 미리 예약하면 좋을 텐데.", "ok": false, "why": "과거형은 지금 일에 써요. 지난 일이 아쉬우니까 had made라야 해요."}, {"n": "②", "en": "I wish I have made a reservation in advance.", "ko": "내가 미리 예약해 놓았다면 좋겠다.", "ok": false, "why": "I wish 뒤에 현재완료를 쓰지 않아요."}, {"n": "③", "en": "I wish I had made a reservation in advance.", "ko": "내가 미리 예약했더라면 좋았을 텐데.", "ok": true, "why": "I wish + had + 과거분사라서 맞아요."}, {"n": "④", "en": "I wish I had been made a reservation in advance.", "ko": "(어색한 문장)", "ok": false, "why": "수동태가 되어 뜻이 이상해져요."}, {"n": "⑤", "en": "I wish I will have made a reservation in advance.", "ko": "(틀린 문장)", "ok": false, "why": "I wish 뒤에 will은 쓰지 않아요."}], "pencil": "I wish + had + ___: 지난 일의 후회", "pencilKey": "과거분사", "page": 222, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "I wish / as if 가정법 과거완료", "type": "mc", "ans": "②", "concept": ["090-2", "089"], "gap": "", "words": [["keep talking", "계속 말하다"], ["gold medal", "금메달"], ["interested in", "~에 관심 있는"]], "h1": "'Peter는 마치 금메달을 땄던 것처럼 계속 말한다'는 문장이에요. 사실은 어땠을지 반대로 생각해 보세요.", "h2": "as if + had + 과거분사는 말하는 때보다 앞선 일을 사실과 반대로 상상해요. 긍정이면 사실은 부정이에요.", "why": "금메달을 땄던 것처럼 말하지만 사실이 아니라는 뜻이에요. 그래서 In fact, Peter didn't win(원형 win 따다) a gold medal.이 맞아요.", "opts": [{"n": "①", "en": "Peter will win a gold medal.", "ko": "Peter는 금메달을 딸 것이다.", "ok": false, "why": "앞날 이야기가 아니라서 틀려요."}, {"n": "②", "en": "In fact, Peter didn't win a gold medal.", "ko": "사실 Peter는 금메달을 따지 않았다.", "ok": true, "why": "as if 뒤 내용의 반대가 사실이라서 맞아요."}, {"n": "③", "en": "In fact, Peter won a gold medal.", "ko": "사실 Peter는 금메달을 땄다.", "ok": false, "why": "as if와 같은 방향이라서 틀려요. 사실은 반대예요."}, {"n": "④", "en": "Peter has won a gold medal many times.", "ko": "Peter는 금메달을 여러 번 땄다.", "ok": false, "why": "사실을 말하는 문장이라서 as if의 뜻과 달라요."}, {"n": "⑤", "en": "Peter is not interested in winning a gold medal.", "ko": "Peter는 금메달을 따는 데 관심이 없다.", "ok": false, "why": "관심 여부는 문장과 관계없어요."}], "pencil": "as if + had p.p.의 사실은 ___ 내용이에요", "pencilKey": "반대", "page": 222, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "직설법을 가정법으로 바꾸기", "type": "mc", "ans": "①, ⑤", "concept": ["089", "090", "088-H1"], "gap": "", "words": [["regret", "후회하다"], ["change one's mind", "마음을 바꾸다"], ["quarrel", "다투다"], ["yell at", "소리 지르다"]], "h1": "'잘못 바꾼 것을 모두 고르는' 문제예요. 윗문장(사실)과 아랫문장(상상하는 말)이 알맞은 짝인지, 특히 시제를 하나씩 살펴보세요.", "h2": "후회하는 I regret that과 I wish는 짝이에요. I wish 뒤에 지난 일이 오면 had p.p., 주절이 would have p.p.이면 had 뒤에 과거분사를 써요.", "why": "①은 I wish 뒤에 didn't change가 아니라 hadn't changed(원형 change 바꾸다)라야 해요. ⑤는 wouldn't had quarreled이 아니라 wouldn't have quarreled(원형 quarrel 다투다)라야 해요.", "opts": [{"n": "①", "en": "I regret that I changed my mind. / I wish I didn't change my mind.", "ko": "마음을 바꾼 것을 후회한다. / 마음을 바꾸지 않았더라면 좋을 텐데.", "ok": true, "why": "지난 일의 후회라서 didn't change가 아니라 hadn't changed라야 해요."}, {"n": "②", "en": "As I didn't see the sign, I didn't stop. / If I had seen the sign, I would have stopped.", "ko": "나는 표지판을 보지 못해서 멈추지 않았다. / 표지판을 봤더라면 멈췄을 텐데.", "ok": false, "why": "알맞게 바꿨어요."}, {"n": "③", "en": "As you didn't follow the rules, you are in trouble now. / If you had followed the rules, you wouldn't be in trouble now.", "ko": "너는 규칙을 따르지 않아서 지금 곤란하다. / 규칙을 따랐더라면 지금 곤란하지 않을 텐데.", "ok": false, "why": "혼합 가정법으로 알맞게 바꿨어요."}, {"n": "④", "en": "I'm sorry that I didn't take my camera with me. / I wish I had taken my camera with me.", "ko": "카메라를 가져오지 않아서 아쉽다. / 카메라를 가져왔더라면 좋을 텐데.", "ok": false, "why": "알맞게 바꿨어요."}, {"n": "⑤", "en": "As I yelled at him, we quarreled. / If I hadn't yelled at him, we wouldn't had quarreled.", "ko": "내가 그에게 소리를 질러서 우리는 다퉜다. / 내가 소리를 지르지 않았더라면 우리는 다투지 않았을 텐데.", "ok": true, "why": "wouldn't had는 틀린 모양이에요. wouldn't have quarreled이라야 해요."}], "pencil": "would 뒤에는 had가 아니라 ___를 써요", "pencilKey": "have", "page": 222, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "가정법 과거완료", "type": "write", "ans": "had missed, would have been late", "concept": ["088", "089"], "gap": "", "words": [["miss", "놓치다"], ["late", "늦은"], ["meeting", "모임"]], "h1": "'기차를 놓쳤더라면 나는 모임에 늦었을 텐데'를 괄호의 miss와 will be를 이용해 쓰는 문제예요. 두 빈칸은 if절의 동사와 주절의 동사 부분이에요.", "h2": "if절은 had + 과거분사(miss의 과거분사)예요. 주절은 will의 과거형으로 시작해 「have + 과거분사」로 이어지고, will be의 be도 과거분사로 바꿔요.", "why": "If I had missed(원형 miss 놓치다) the train, I would have been late for the meeting.이 돼요. 지난 일을 상상하는 말이라서 had missed와 would have been을 써요.", "opts": [], "pencil": "주절의 will be는 지난 일을 상상할 때 would have ___로 바꿔요", "pencilKey": "been", "page": 223, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "가정법 과거완료", "type": "write", "ans": "If the dress [it] had been on sale, Ruth would have bought it [the dress].", "concept": ["088", "089"], "gap": "", "words": [["dress", "원피스"], ["on sale", "할인 중인"], ["buy", "사다"]], "h1": "'세일 중이 아니어서 Ruth가 원피스를 사지 않았다'는 지난 사실을 반대로 상상하는 말이에요. if절을 앞에 쓰세요.", "h2": "사실이 부정(was not on sale, didn't buy)이니 상상하는 말은 긍정이에요. if절은 지난 일을 상상하는 모양, 주절은 would를 쓴 지난 일의 모양으로 써요.", "why": "If the dress had been on sale, Ruth would have bought(원형 buy 사다) it.이 돼요. 주어는 the dress를 it으로 써도 돼요.", "opts": [], "pencil": "사실이 부정이면 지난 일을 상상하는 말은 ___으로 써요", "pencilKey": "긍정", "page": 223, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "가정법 과거완료", "type": "write", "ans": "stayed → had stayed, would finish → would have finished", "concept": ["088", "089"], "gap": "", "words": [["essay", "에세이"], ["stay up late", "늦게까지 깨어 있다"], ["probably", "아마도"], ["finish", "끝내다"]], "h1": "'어제 늦게까지 깨어 있었더라면 에세이를 끝냈을 텐데'라는 내용이에요. last night(어젯밤)이라는 단서를 보고 어색한 두 곳을 찾으세요.", "h2": "어제 있었던 일을 반대로 상상하는 말이라서 if절은 had + 과거분사, 주절은 would have + 과거분사예요. 문장 속 동사 두 곳을 확인하세요.", "why": "if절의 stayed(원형 stay up 늦게까지 깨어 있다)는 had stayed로, 주절의 would finish(원형 finish 끝내다)는 would have finished로 고쳐요. 둘 다 어젯밤 일이라서 과거완료 모양이 필요해요.", "opts": [], "pencil": "last night 같은 지난 일 단서가 있으면 if절은 ___ + 과거분사", "pencilKey": "had", "page": 223, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "I wish / as if 가정법 과거완료", "type": "write", "ans": "I wish I hadn't drunk so much coffee last night.", "concept": ["090", "089"], "gap": "", "words": [["drink", "마시다"], ["coffee", "커피"], ["last night", "어젯밤"]], "h1": "I'm sorry I drank so much coffee last night.를 I wish 문장으로 바꾸는 문제예요. 어젯밤 일이라는 점을 놓치지 마세요.", "h2": "지난 일의 후회는 I wish 뒤에 「had + 과거분사」를 써요. 사실이 긍정(drank)이니 뒤는 부정이에요. drink(마시다)의 과거분사는 drunk예요.", "why": "어젯밤 커피를 많이 마신 것이 아쉬운 마음이에요. 그래서 I wish I hadn't drunk(원형 drink 마시다) so much coffee last night.이 돼요.", "opts": [], "pencil": "사실이 긍정이면 I wish + hadn't + ___", "pencilKey": "과거분사", "page": 223, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "I wish / as if 가정법 과거완료", "type": "write", "ans": "I wish I had prepared", "concept": ["090"], "gap": "", "words": [["prepare", "준비하다"], ["interview", "면접"], ["get a job", "취직하다"]], "h1": "면접 준비를 잘하지 못해서 취직하지 못했다는 지난 일이에요. 그 아쉬움을 I wish로 시작해서 쓰세요.", "h2": "지난 일의 후회라서 I wish 뒤에 「had + 과거분사」를 써요. 괄호 안에 I wish가 있으니 그대로 쓰면 돼요.", "why": "I wish I had prepared(원형 prepare 준비하다) better for the interview.는 '면접 준비를 더 잘했더라면 좋았을 텐데'라는 뜻이에요.", "opts": [], "pencil": "지난 일의 후회: I wish + ___ + 과거분사", "pencilKey": "had", "page": 223, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "I wish / as if 가정법 과거완료", "type": "write", "ans": "as if she had seen", "concept": ["090-2"], "gap": "", "words": [["talk", "말하다"], ["accident", "사고"], ["see", "보다"]], "h1": "Jasmine은 사고를 보지 못했는데 마치 본 것처럼 말했다는 내용이에요. 괄호의 as if를 활용해 빈칸을 채우세요.", "h2": "말한 때보다 앞선 일을 상상하니까 as if 뒤에 「had + 과거분사」를 써요. 주어는 she예요.", "why": "사실은 보지 못했는데 마치 목격했던 것처럼 말한 거예요. 그래서 as if she had seen(원형 see 보다)이 돼요.", "opts": [], "pencil": "as if 뒤에서 앞선 일을 상상하면 ___ + 과거분사", "pencilKey": "had", "page": 223, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "without 가정법 과거완료", "type": "write", "ans": "Without, couldn't have graduated", "concept": ["090-H1"], "gap": "", "words": [["graduate", "졸업하다"], ["uncle", "삼촌"], ["help", "도움"]], "h1": "'삼촌의 도움이 없었다면 대학을 졸업하지 못했을 것이다'예요. 첫 빈칸은 '~이 없었다면', 나머지 빈칸 세 개는 graduate를 이용한 주절이에요.", "h2": "Without 뒤 주절은 「조동사의 과거형 + have + 과거분사」예요. can의 과거형을 부정으로 쓰고, have, 그리고 graduate의 과거분사 순서로 써요.", "why": "Without my uncle's help, I couldn't have graduated(원형 graduate 졸업하다) from university.가 돼요. 도움이 있어서 졸업한 지난 일의 반대 상상이에요.", "opts": [], "pencil": "Without ~, 주어 + couldn't + have + ___", "pencilKey": "과거분사", "page": 223, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "without 가정법 과거완료", "type": "write", "ans": "If it had not been for your advice, I wouldn't have applied for the job.", "concept": ["090-H1", "088"], "gap": "", "words": [["advice", "조언"], ["apply for", "~에 지원하다"], ["job", "일자리"]], "h1": "'너의 조언이 없었더라면 나는 그 일에 지원하지 못했을 텐데'를 단어를 배열해 쓰는 문제예요. if절을 앞에 쓰라고 했어요.", "h2": "'~이 없었다면'을 If it으로 시작해 말하는 틀이 있어요. 그 뒤에 your advice를 잇고, 주절은 wouldn't have + 과거분사(apply for의 과거분사)로 이어요.", "why": "If it had not been for your advice, I wouldn't have applied(원형 apply 지원하다) for the job.이 돼요. if절이 If it had not been for로 시작하는 틀이에요.", "opts": [], "pencil": "'~이 없었다면'은 If it ___ not been for ~", "pencilKey": "had", "page": 223, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "가정법 과거완료", "type": "mc", "ans": "①", "concept": ["088", "089"], "gap": "", "words": [["bike", "자전거"], ["break", "고장 나다"], ["take a bus", "버스를 타다"]], "h1": "'자전거가 고장 나서 오늘 아침 버스를 탔다'는 지난 일이에요. 이 사실의 반대를 상상하는 빈칸 두 곳의 모양을 보세요.", "h2": "사실이 긍정(고장 났다)이니 if절은 부정이고, 사실이 긍정(버스를 탔다)이니 주절도 부정이에요. if절은 hadn't + 과거분사, 주절은 wouldn't have + 과거분사예요.", "why": "'자전거가 고장 나지 않았더라면 버스를 타지 않았을 텐데'가 돼요. 그래서 If my bike hadn't broken(원형 break 고장 나다), I wouldn't have taken(원형 take 타다) a bus.가 맞아요.", "opts": [{"n": "①", "en": "hadn't broken – wouldn't have taken", "ko": "고장 나지 않았더라면 – 타지 않았을 텐데", "ok": true, "why": "if절과 주절이 모두 알맞아서 맞아요."}, {"n": "②", "en": "didn't broken – would have taken", "ko": "(틀린 모양) – 탔을 텐데", "ok": false, "why": "didn't 뒤에 과거분사를 쓸 수 없고, 주절도 긍정이라 틀려요."}, {"n": "③", "en": "haven't broken – would haven't taken", "ko": "(틀린 모양)", "ok": false, "why": "현재완료는 if절에 맞지 않고 would haven't는 없는 모양이에요."}, {"n": "④", "en": "could have broken – had taken", "ko": "고장 날 수 있었다 – 탔었다", "ok": false, "why": "if절과 주절 모양이 거꾸로예요."}, {"n": "⑤", "en": "would have broken – hadn't taken", "ko": "고장 났을 텐데 – 타지 않았다", "ok": false, "why": "would는 주절에 쓰는 말이에요. if절 자리가 아니에요."}], "pencil": "지난 일을 상상하는 주절: wouldn't + have + ___", "pencilKey": "과거분사", "page": 224, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "가정법 과거완료", "type": "mc", "ans": "⑤", "concept": ["088", "075"], "gap": "", "words": [["illegally", "불법으로"], ["park", "주차하다"], ["handicapped spot", "장애인 주차 구역"], ["fine", "벌금을 물리다"]], "h1": "'어법상 어색한 부분'을 바르게 고친 보기를 찾는 문제예요. 주절의 wouldn't have be fined에서 이상한 곳이 어디인지 보세요.", "h2": "지난 일을 상상하는 주절은 「조동사의 과거형 + have + 과거분사」예요. 벌금을 '물게 되는' 것이니 수동태로 have been fined(원형 fine 벌금을 물리다)가 돼요.", "why": "have 다음에는 과거분사가 와야 하는데 원형 be가 있어서 어색해요. be를 been으로 고쳐 wouldn't have been fined로 써요.", "opts": [{"n": "①", "en": "hadn't를 hasn't로 고침", "ko": "hadn't를 hasn't로", "ok": false, "why": "if절의 hadn't parked는 맞아서 고칠 필요가 없어요."}, {"n": "②", "en": "parked를 parking으로 고침", "ko": "parked를 parking으로", "ok": false, "why": "hadn't parked는 과거분사가 알맞아요."}, {"n": "③", "en": "wouldn't를 would로 고침", "ko": "wouldn't를 would로", "ok": false, "why": "부정으로 상상하는 말이 맞아서 고칠 필요가 없어요."}, {"n": "④", "en": "have를 had로 고침", "ko": "have를 had로", "ok": false, "why": "would 뒤에는 have가 맞아요."}, {"n": "⑤", "en": "be를 been으로 고침", "ko": "be를 been으로", "ok": true, "why": "have 뒤에는 과거분사 been이 와야 해서 맞아요."}], "pencil": "조동사 + have 뒤에는 동사원형이 아니라 ___", "pencilKey": "과거분사", "page": 224, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "혼합 가정법", "type": "mc", "ans": "①", "concept": ["088-H1"], "gap": "", "words": [["plan", "계획하다"], ["trip", "여행"], ["mess", "엉망인 상황"], ["before we left", "떠나기 전에"]], "h1": "if절에는 before we left(떠나기 전에)가 있고, 주절에는 now(지금)가 있어요. 두 부분의 때가 같은지 다른지 보세요.", "h2": "지난 일이 지금에 영향을 줄 때는 혼합 가정법이에요. if절은 had + 과거분사, 주절은 would + 동사원형으로 써요.", "why": "'여행을 미리 계획했더라면 지금 이런 엉망인 상황에 있지 않을 텐데'라는 뜻이에요. 그래서 had planned(원형 plan 계획하다)와 wouldn't be가 맞아요.", "opts": [{"n": "①", "en": "had planned – wouldn't be", "ko": "계획했더라면 – 있지 않을 텐데", "ok": true, "why": "if절은 지난 일, 주절은 지금 일이라서 맞아요."}, {"n": "②", "en": "had planned – wouldn't have been", "ko": "계획했더라면 – 있지 않았을 텐데", "ok": false, "why": "now가 있어서 주절은 지금 일이에요. would have been이면 지난 일이 돼요."}, {"n": "③", "en": "have planned – wouldn't be", "ko": "계획해 왔다면 – 있지 않을 텐데", "ok": false, "why": "현재완료는 if절에 쓰지 않아요."}, {"n": "④", "en": "have planned – wouldn't has been", "ko": "(틀린 모양)", "ok": false, "why": "현재완료와 wouldn't has가 모두 틀려요."}, {"n": "⑤", "en": "have has planned – hadn't been", "ko": "(틀린 모양)", "ok": false, "why": "have has는 없는 모양이에요."}], "pencil": "지금의 결과를 상상하는 주절은 would + ___", "pencilKey": "동사원형", "page": 224, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "어법상 어색한 문장 고르기", "type": "mc", "ans": "①", "concept": ["088-H1", "088"], "gap": "", "words": [["take a nap", "낮잠을 자다"], ["lie", "거짓말하다"], ["dessert", "후식"], ["closed", "닫은"]], "h1": "'어색한 것'을 찾는 문제예요. 보기마다 if절이 지난 일인지, 주절에 now 같은 지금 단서가 있는지 확인하세요.", "h2": "주절에 now, still, today가 있으면 주절은 지금 일이에요. 이때 주절은 would have + 과거분사가 아니라 would + 동사원형이에요.", "why": "①은 if절이 지난 일인데 주절에 now가 있어요. 그러니 would have felt(원형 feel 느끼다)를 would feel로 고쳐야 해요.", "opts": [{"n": "①", "en": "If you had taken a nap, you would have felt better now.", "ko": "낮잠을 잤더라면 지금 기분이 더 좋았을 텐데.", "ok": true, "why": "주절에 now가 있어서 would feel이라야 해요. 어색해요."}, {"n": "②", "en": "If he hadn't lied to me, we would still be good friends.", "ko": "그가 내게 거짓말하지 않았더라면 우리는 지금도 좋은 친구일 텐데.", "ok": false, "why": "still이 있어서 would be가 맞아요."}, {"n": "③", "en": "If I hadn't eaten dessert, I wouldn't be so full now.", "ko": "후식을 먹지 않았더라면 지금 이렇게 배부르지 않을 텐데.", "ok": false, "why": "now가 있어서 would be가 맞아요."}, {"n": "④", "en": "If they had called the store, they would have known it was closed.", "ko": "그들이 가게에 전화했더라면 닫았다는 걸 알았을 텐데.", "ok": false, "why": "둘 다 지난 일이라서 맞아요."}, {"n": "⑤", "en": "If you had read this book yesterday, you would understand what I'm saying.", "ko": "네가 어제 이 책을 읽었더라면 내가 하는 말을 이해할 텐데.", "ok": false, "why": "지금 이해하는 결과라서 would understand가 맞아요."}], "pencil": "주절에 now가 있으면 would have p.p.가 아니라 would + ___", "pencilKey": "동사원형", "page": 224, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "통합형", "type": "mc", "ans": "④", "concept": ["090", "090-2", "088"], "gap": "", "words": [["teach", "가르치다"], ["clothes", "옷"], ["boring", "지루한"], ["ambulance", "구급차"]], "h1": "ⓐ부터 ⓓ까지 문장이 I wish, as if, if 중 어떤 모양인지 구별하고, 시제가 맞는지 하나씩 보세요.", "h2": "각 문장이 I wish, as if, if 중 무엇인지 구별하고, 문장 속에서 때(지금인지 지난 일인지)를 알려 주는 단서를 찾아 하나씩 맞는지 따져 보세요.", "why": "ⓐ, ⓑ, ⓒ, ⓓ는 모두 알맞은 문장이에요. 네 개 모두 옳아서 ④(4개)예요.", "opts": [{"n": "①", "en": "1개", "ko": "한 개", "ok": false, "why": "네 문장 모두 옳아서 틀려요."}, {"n": "②", "en": "2개", "ko": "두 개", "ok": false, "why": "네 문장 모두 옳아서 틀려요."}, {"n": "③", "en": "3개", "ko": "세 개", "ok": false, "why": "네 문장 모두 옳아서 틀려요."}, {"n": "④", "en": "4개", "ko": "네 개", "ok": true, "why": "ⓐ, ⓑ, ⓒ, ⓓ가 모두 옳아서 맞아요."}, {"n": "⑤", "en": "없음", "ko": "하나도 없다", "ok": false, "why": "모두 옳은 문장이라서 틀려요."}], "pencil": "혼합 가정법: if절 had p.p., 주절 would + ___", "pencilKey": "동사원형", "page": 224, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "통합형", "type": "mc", "ans": "①", "concept": ["087", "088", "090-H1"], "gap": "", "words": [["give up", "포기하다"], ["dream", "꿈"], ["help", "도움"]], "h1": "다섯 문장이 모두 'Lucy가 도와줘서 내가 꿈을 포기하지 않았다'는 이야기예요. 하나만 지금 일을 말하고 있어요. if절의 동사 모양을 비교하세요.", "h2": "if절이 과거형(didn't help)이면 지금 일을 상상하는 말이고, had + 과거분사이면 지난 일을 상상하는 말이에요. But for와 If it had not been for는 지난 일의 '~이 없었다면'이에요.", "why": "①은 if절이 과거형이라서 '지금 Lucy가 나를 도와주지 않는다면 꿈을 포기할 텐데'라는 뜻이에요. 나머지는 모두 '도와주지 않았더라면 포기했을 것이다'라는 지난 일이라서 ①만 뜻이 달라요.", "opts": [{"n": "①", "en": "If Lucy didn't help me, I would give up my dreams.", "ko": "Lucy가 나를 도와주지 않는다면 나는 꿈을 포기할 텐데.", "ok": true, "why": "지금 일을 상상하는 말이라서 나머지 넷과 뜻이 달라요."}, {"n": "②", "en": "As Lucy helped me, I didn't give up my dreams.", "ko": "Lucy가 나를 도와줘서 나는 꿈을 포기하지 않았다.", "ok": false, "why": "지난 일의 사실이라서 나머지와 같은 뜻이에요."}, {"n": "③", "en": "But for Lucy's help, I would have given up my dreams.", "ko": "Lucy의 도움이 없었다면 나는 꿈을 포기했을 텐데.", "ok": false, "why": "지난 일이라서 나머지와 같은 뜻이에요."}, {"n": "④", "en": "If Lucy hadn't helped me, I would have given up my dreams.", "ko": "Lucy가 도와주지 않았더라면 나는 꿈을 포기했을 텐데.", "ok": false, "why": "지난 일이라서 나머지와 같은 뜻이에요."}, {"n": "⑤", "en": "If it had not been for Lucy's help, I would have given up my dreams.", "ko": "Lucy의 도움이 없었다면 나는 꿈을 포기했을 텐데.", "ok": false, "why": "지난 일이라서 나머지와 같은 뜻이에요."}], "pencil": "지난 일을 상상하는 if절은 과거형이 아니라 ___ + 과거분사", "pencilKey": "had", "page": 224, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "직설법을 가정법으로 바꾸기", "type": "mc", "ans": "③, ④", "concept": ["089", "090", "090-2"], "gap": "", "words": [["regret", "후회하다"], ["forget", "잊다"], ["blame", "탓하다"], ["hospital", "병원"]], "h1": "'옳게 고친 것을 모두 고르는' 문제예요. 윗문장(사실)과 아랫문장(상상하는 말)이 짝이 맞는지 하나씩 보세요.", "h2": "I regret that과 I'm sorry that은 I wish + had p.p.와 짝이고, In fact 문장은 as if와 짝이에요. as if 뒤는 사실의 반대이고, 때가 같은지 앞서는지도 확인해야 해요.", "why": "③은 I'm sorry가 I wish had p.p.와 짝이라 맞고, ④는 사실의 반대를 알맞은 가정법 과거완료로 썼어요. ①은 hadn't forgotten, ②는 as if he had met, ⑤는 wouldn't be라야 해요.", "opts": [{"n": "①", "en": "I regret that I forgot Mom's birthday. / I wish I didn't forget Mom's birthday.", "ko": "엄마 생신을 잊은 것을 후회한다. / 엄마 생신을 잊지 않았더라면 좋을 텐데.", "ok": false, "why": "지난 일이라서 hadn't forgotten(원형 forget 잊다)라야 해요."}, {"n": "②", "en": "In fact, Jonathan has never met Suji before. / Jonathan acts as if he had never met Suji before.", "ko": "사실 Jonathan은 Suji를 전에 만난 적이 없다. / Jonathan은 Suji를 전에 만난 적이 없는 것처럼 행동한다.", "ok": false, "why": "사실이 부정이면 as if 뒤는 긍정이라서 as if he had met이라야 해요."}, {"n": "③", "en": "I'm sorry that he didn't stay with us longer. / I wish he had stayed with us longer.", "ko": "그가 우리와 더 오래 머물지 않아서 아쉽다. / 그가 더 오래 머물렀으면 좋았을 텐데.", "ok": true, "why": "지난 일의 아쉬움을 알맞게 바꿨어요."}, {"n": "④", "en": "As I didn't know the truth, I blamed her. / If I had known the truth, I wouldn't have blamed her.", "ko": "나는 진실을 몰라서 그녀를 탓했다. / 진실을 알았더라면 그녀를 탓하지 않았을 텐데.", "ok": true, "why": "가정법 과거완료로 알맞게 바꿨어요."}, {"n": "⑤", "en": "As she had a car accident, she is in the hospital now. / If she hadn't had a car accident, she wouldn't have been in the hospital now.", "ko": "그녀는 교통사고를 당해서 지금 병원에 있다. / 사고를 당하지 않았더라면 지금 병원에 있지 않았을 텐데.", "ok": false, "why": "now가 있어서 wouldn't be라야 해요."}], "pencil": "I wish + had p.p.는 I'm sorry that + ___ 시제와 짝이에요", "pencilKey": "과거", "page": 224, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "가정법 과거완료", "type": "write", "ans": "If I had known Alex was such a terrible driver, I wouldn't have lent him my car.", "concept": ["088", "089"], "gap": "", "words": [["terrible", "끔찍한"], ["lend", "빌려주다"], ["know", "알다"]], "h1": "'Alex가 운전을 못하는 걸 몰랐다. 지금 차를 빌려준 게 후회된다'를 if를 이용한 한 문장으로 쓰는 문제예요.", "h2": "사실이 부정(didn't know), 긍정(lent)이니 상상하는 말은 긍정, 부정이에요. if절과 주절 모두 지난 일을 상상하는 모양으로 써요.", "why": "'Alex가 운전을 못하는 걸 알았더라면 그에게 차를 빌려주지 않았을 텐데'가 돼요. 그래서 If I had known ~, I wouldn't have lent him my car.예요.", "opts": [], "pencil": "사실이 부정이면 if절은 ___ + 과거분사", "pencilKey": "had", "page": 225, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "가정법 과거완료", "type": "write", "ans": "If she had had more money, she would have opened a restaurant.", "concept": ["088"], "gap": "", "words": [["open", "열다, 개업하다"], ["restaurant", "식당"], ["have", "가지다"]], "h1": "'그녀에게 더 많은 돈이 있었더라면 그녀는 식당을 열었을 텐데'를 괄호의 have, will, open a restaurant로 쓰는 문제예요.", "h2": "if절은 have의 과거분사를 이용한 지난 일의 모양이고, 주절은 will의 과거형 + have + open의 과거분사예요.", "why": "If she had had(원형 have 가지다) more money, she would have opened(원형 open 열다) a restaurant.가 돼요. had had처럼 had가 두 번 나오는 점이 포인트예요.", "opts": [], "pencil": "have의 과거분사는 ___ 이라서 had + had가 돼요", "pencilKey": "had", "page": 225, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "가정법 과거완료", "type": "write", "ans": "If I had brought my swimsuit, I could have swum.", "concept": ["088", "089"], "gap": "", "words": [["swimsuit", "수영복"], ["bring", "가져오다"], ["swim", "수영하다"]], "h1": "Olivia가 수영복을 안 가져가서 수영을 못 했어요. 엄마에게 할 말을 가정법으로 10단어로 쓰는 문제예요. if, bring, can, swim을 이용하세요.", "h2": "사실의 반대를 상상해요. if절은 bring의 과거분사를 이용한 지난 일의 모양, 주절은 can의 과거형 + have + swim의 과거분사예요. 불규칙 과거분사를 떠올려 보세요.", "why": "'수영복을 가져갔더라면 수영할 수 있었을 텐데'가 돼요. If I had brought(원형 bring 가져오다) my swimsuit, I could have swum(원형 swim 수영하다).예요.", "opts": [], "pencil": "swim의 과거분사는 ___", "pencilKey": "swum", "page": 225, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "I wish / as if 가정법 과거완료", "type": "write", "ans": "I wish I hadn't spent so much money on the car.", "concept": ["059", "090"], "gap": "", "words": [["spend", "쓰다"], ["so much money", "많은 돈"], ["shouldn't have p.p.", "~하지 말았어야 했는데"]], "h1": "I shouldn't have spent ~는 '그렇게 많은 돈을 쓰지 말았어야 했는데'라는 후회예요. 이 후회를 I wish 문장으로 바꿔 보세요.", "h2": "should have p.p.는 '~했어야 했는데', shouldn't have p.p.는 '~하지 말았어야 했는데'라는 후회예요. 지난 일의 후회를 I wish 뒤에서는 어떤 모양으로 쓰는지 떠올려 보세요.", "why": "I shouldn't have spent(원형 spend 쓰다)는 지난 일의 후회이니 I wish I hadn't spent so much money on the car.로 바꿔요.", "opts": [], "pencil": "shouldn't have p.p.는 I wish + ___ + 과거분사와 같은 뜻", "pencilKey": "hadn't", "page": 225, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "I wish / as if 가정법 과거완료", "type": "write", "ans": "(1) [모범 답] I'm sorry [I regret] I threw away the receipt. (2) [모범 답] In fact, Laura hadn't come up with the idea first.", "concept": ["090", "090-2", "089"], "gap": "", "words": [["throw away", "버리다"], ["receipt", "영수증"], ["pretend", "~인 척하다"], ["come up with", "떠올리다"]], "h1": "(1)은 I wish 문장과 같은 뜻의 사실 문장, (2)는 as if 문장과 같은 뜻의 사실 문장을 쓰는 문제예요. 각각 사실이 긍정인지 부정인지 반대로 생각하세요.", "h2": "(1) I wish + hadn't p.p.는 지난 일을 한 것에 대한 아쉬움이라서 I'm sorry나 I regret로 시작해 과거형으로 써요. (2) as if + had p.p.는 In fact 뒤에서 부정으로 써요.", "why": "(1) 영수증을 버리지 않았더라면 좋았을 텐데는 I'm sorry I threw away(원형 throw 던지다) the receipt.와 같아요. (2) 마치 먼저 생각해 낸 것처럼 굴었다는 사실은 Laura가 먼저 생각해 내지 않았다는 뜻이에요.", "opts": [], "pencil": "I wish + hadn't p.p. 는 I'm sorry that + ___ 시제와 같은 뜻", "pencilKey": "과거", "page": 225, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "I wish / as if 가정법 과거완료", "type": "write", "ans": "(1) I wish you had seen [watched] this movie. (2) She talked as if she hadn't heard the news.", "concept": ["090", "090-2"], "gap": "", "words": [["movie", "영화"], ["news", "소식"], ["hear", "듣다"]], "h1": "(1)은 7단어 I wish 문장, (2)는 9단어 as if 문장이에요. 단어 수를 세면서 지난 일을 상상하는 모양을 쓰세요.", "h2": "I wish 뒤에는 「주어 + had + 과거분사」, as if 뒤에도 「주어 + had + 과거분사」를 써요. (2)는 '못 들었던'이니 부정으로 쓰세요.", "why": "(1) I wish you had seen(원형 see 보다) this movie.는 7단어, (2) She talked as if she hadn't heard(원형 hear 듣다) the news.는 9단어예요.", "opts": [], "pencil": "I wish와 as if 뒤에서 앞선 일은 ___ + 과거분사", "pencilKey": "had", "page": 225, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "통합형", "type": "write", "ans": "(1) I wish my dad had let me go to the concert. (2) If the shop owner had caught him stealing the jewelry, he would have been arrested.", "concept": ["090", "088", "089"], "gap": "", "words": [["let", "허락하다"], ["concert", "콘서트"], ["steal", "훔치다"], ["arrest", "체포하다"], ["shop owner", "가게 주인"]], "h1": "(1)은 I wish 문장, (2)는 if절 문장으로 바꾸는 문제예요. 둘 다 사실이 부정인지 긍정인지 반대로 바꾸세요.", "h2": "(1) '아빠가 허락하지 않아서 아쉽다'를 I wish 문장으로 바꿔요. (2) '들키지 않아서 체포되지 않았다'는 사실의 반대를 if절로 쓰고, 주절은 수동의 지난 일 모양이에요.", "why": "(1) I wish my dad had let(원형 let 허락하다) me go to the concert. (2) If the shop owner had caught(원형 catch 잡다) him stealing the jewelry, he would have been arrested.가 돼요.", "opts": [], "pencil": "지난 일을 반대로 상상하는 말의 수동태: would have + ___ + 과거분사", "pencilKey": "been", "page": 225, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "밑줄 친 부분 고쳐 쓰기", "type": "write", "ans": "(1) had rained (2) 없음 (3) hadn't sent (4) had not been", "concept": ["088", "088-H1", "090"], "gap": "", "words": [["harvest", "수확"], ["invest", "투자하다"], ["broke", "빈털터리의"], ["survive", "살아남다"], ["patient", "환자"]], "h1": "각 문장의 밑줄 친 부분이 지난 일을 상상하는 말에 맞는지 하나씩 보세요. 옳으면 '없음'이라고 써요.", "h2": "(1)은 주절이 would have gathered이고, (2)는 주절에 now가 있고, (3)은 앞 문장이 과거(was)이고, (4)는 주절이 couldn't have survived예요. 이 단서로 밑줄 친 곳의 모양을 정하세요.", "why": "(1) rains는 had rained(원형 rain 비가 오다), (2) hadn't invested와 wouldn't be now는 혼합 가정법이라서 없음, (3) didn't send는 hadn't sent(원형 send 보내다), (4) weren't는 had not been으로 고쳐요.", "opts": [], "pencil": "주절이 would have p.p.이면 if절 밑줄 친 부분은 ___ + 과거분사", "pencilKey": "had", "page": 225, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "had been이 어색한 문장 고르기", "type": "mc", "ans": "③", "concept": ["090", "090-2", "088"], "gap": "", "words": [["celebrity", "유명인"], ["lifeboat", "구조선"], ["drown", "익사하다"], ["housewarming party", "집들이"], ["invite", "초대하다"]], "h1": "빈칸에 모두 had been을 넣어 읽어 보세요. 그러고 나서 각 문장의 우리말 뜻이 자연스러운지 하나씩 따져 보세요.", "h2": "각 문장의 뜻을 우리말로 읽어 보고, had been만 넣어도 뜻이 자연스러운지 확인하세요. 뜻이 반대가 되는 문장이 하나 있어요.", "why": "③은 '구조선이 없었다면 나는 익사했을 것이다'라는 뜻이에요. 그래서 If it had not been for a lifeboat이라야 하고, had been만 쓰면 뜻이 반대가 돼요.", "opts": [{"n": "①", "en": "I wish I had been there with you.", "ko": "내가 너와 거기 함께 있었더라면 좋았을 텐데.", "ok": false, "why": "I wish + had been이라서 알맞아요."}, {"n": "②", "en": "Barbara talks as if she had been a celebrity.", "ko": "Barbara는 마치 유명인이었던 것처럼 말한다.", "ok": false, "why": "as if + had been이라서 알맞아요."}, {"n": "③", "en": "If it had been for a lifeboat, I would have drowned.", "ko": "구조선이 있었다면 나는 익사했을 텐데.", "ok": true, "why": "뜻이 반대가 돼서 어색해요. had not been for라야 해요."}, {"n": "④", "en": "If I had been invited, I would have gone to their housewarming party.", "ko": "내가 초대받았더라면 그들의 집들이에 갔을 텐데.", "ok": false, "why": "had been invited(수동)이라서 알맞아요."}, {"n": "⑤", "en": "If it had been sunny, they would have enjoyed dinner in the garden.", "ko": "날이 맑았더라면 그들은 정원에서 저녁을 즐겼을 텐데.", "ok": false, "why": "if절 had been sunny라서 알맞아요."}], "pencil": "'~이 없었다면'은 If it had ___ been for ~", "pencilKey": "not", "page": 226, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "I wish / as if 가정법 과거완료", "type": "write", "ans": "as if he had written the paper", "concept": ["090-2"], "gap": "", "words": [["paper", "보고서, 논문"], ["write", "쓰다"], ["act", "행동하다"]], "h1": "대화에서 보고서를 쓴 사람은 Jack이에요. 그런데 Tom이 마치 자기가 쓴 것처럼 행동한다고 했어요. 빈칸은 'He acts' 뒤에 와요.", "h2": "'마치 ~했던 것처럼'은 as if 뒤에 「had + 과거분사」를 써요. 주어는 he이고 write(쓰다)의 과거분사는 written이에요.", "why": "Tom은 쓰지 않았는데 쓴 것처럼 행동하니까 as if he had written(원형 write 쓰다) the paper가 돼요.", "opts": [], "pencil": "as if + had + ___: 앞선 일을 상상해요", "pencilKey": "과거분사", "page": 226, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "의미가 다른 문장의 개수", "type": "mc", "ans": "①", "concept": ["089", "090", "090-H1"], "gap": "", "words": [["free time", "자유 시간"], ["recognize", "알아보다"], ["hand in", "제출하다"], ["break out", "발발하다"], ["spread", "퍼지다"]], "h1": "ⓐ부터 ⓔ까지 위 문장을 사실로 바꿨을 때 아래 문장과 같은지 하나씩 보세요. 시제와 긍정·부정이 모두 맞아야 같은 뜻이에요.", "h2": "사실로 바꿀 때는 긍정은 부정으로, 부정은 긍정으로 뒤집고 시제는 과거로 맞춰요. 이 규칙대로 윗문장을 하나씩 사실로 바꿔서 아랫문장과 견주어 보세요.", "why": "ⓑ는 '모자를 벗지 않았더라면 못 알아봤을 텐데'라서 사실은 '모자를 벗어서 알아봤다'예요. 그런데 아랫문장은 '알아볼 수 없었다'라서 뜻이 달라요. 나머지 ⓐ, ⓒ, ⓓ, ⓔ는 같은 뜻이라서 1개예요.", "opts": [{"n": "①", "en": "1개", "ko": "한 개", "ok": true, "why": "ⓑ 하나만 뜻이 달라서 맞아요."}, {"n": "②", "en": "2개", "ko": "두 개", "ok": false, "why": "뜻이 다른 것은 ⓑ 하나뿐이라서 틀려요."}, {"n": "③", "en": "3개", "ko": "세 개", "ok": false, "why": "뜻이 다른 것은 ⓑ 하나뿐이라서 틀려요."}, {"n": "④", "en": "4개", "ko": "네 개", "ok": false, "why": "뜻이 다른 것은 ⓑ 하나뿐이라서 틀려요."}, {"n": "⑤", "en": "없음", "ko": "하나도 없다", "ok": false, "why": "ⓑ가 뜻이 달라서 틀려요."}], "pencil": "지난 일을 상상하는 말을 사실로 바꾸면 긍정은 ___", "pencilKey": "부정", "page": 226, "sec": "s4"}, {"id": "S4-04", "step": 4, "no": 4, "qtype": "가정법 과거완료", "type": "write", "ans": "(1) If I hadn't overslept this morning, I could have seen the sunrise. (2) If I had put the eggs back in the fridge, they wouldn't have gone bad.", "concept": ["088", "089"], "gap": "", "words": [["oversleep", "늦잠 자다"], ["sunrise", "일출"], ["put back", "도로 넣다"], ["go bad", "상하다"], ["fridge", "냉장고"]], "h1": "<보기>처럼 사실 문장을 가정법으로 바꾸는 문제예요. 사실이 긍정인지 부정인지 보고 반대로 쓰세요.", "h2": "(1) 늦잠을 자서 일출을 못 봤으니 if절 부정, 주절 긍정. (2) 달걀을 넣어 두지 않아서 상했으니 if절 긍정, 주절 부정이에요. 모두 had p.p.와 would[could] have p.p.를 써요.", "why": "(1) If I hadn't overslept(원형 oversleep 늦잠 자다) this morning, I could have seen(원형 see 보다) the sunrise. (2) If I had put(원형 put 넣다) the eggs back in the fridge, they wouldn't have gone bad.가 돼요.", "opts": [], "pencil": "사실의 반대 상상: if절 ___ + 과거분사", "pencilKey": "had", "page": 226, "sec": "s4"}, {"id": "S4-05", "step": 4, "no": 5, "qtype": "I wish / as if 가정법 과거완료", "type": "write", "ans": "(1) Lisa talked as if she had been to , "qtype": "어법상 옳은 문장 고르기", "type": "mc", "ans": "b", "concept": ["090-H1", "088"], "gap": "", "words": [["stove", "난로"], ["freeze to death", "얼어 죽다"]], "h1": "'난로가 없었다면 나는 얼어 죽었을 텐데'예요. 주절이 would have frozen인 점을 보고 if절의 때를 맞춰 보세요.", "h2": "주절이 would have + 과거분사이면 지난 일이에요. 그럴 때 '~이 없었다면'은 If it had not been for ~로 써요.", "why": "지난 일이라서 If it had not been for the stove가 맞아요. a의 If it were not for ~는 지금 일을 상상하는 모양이에요.", "opts": [{"n": "a", "en": "If it were not for the stove, I would have frozen to death.", "ko": "난로가 없다면 나는 얼어 죽었을 텐데.", "ok": false, "why": "if절은 지금 일, 주절은 지난 일이라서 때가 안 맞아요."}, {"n": "b", "en": "If it had not been for the stove, I would have frozen to death.", "ko": "난로가 없었다면 나는 얼어 죽었을 텐데.", "ok": true, "why": "if절과 주절이 모두 지난 일이라서 맞아요."}], "pencil": "'~이 없었다면'은 If it ___ not been for ~", "pencilKey": "had", "page": 227, "sec": "q"}];

var CONCEPT_NAMES={"089": "가정법 문장을 실제 사실을 말하는 문장으로 바꾸려면 어떻게 할까", "090-2": "'마치 ~인 것처럼'은 영어로 어떻게 말할까", "088": "'~라면'과 '~했더라면'은 동사 모양이 어떻게 다를까", "088-H1": "'그때 ~했더라면, 지금 ...할 텐데'는 어떻게 말할까", "090": "'~라면 좋을 텐데'와 '~했더라면 좋았을 텐데'는 어떻게 말할까", "087": "'만약 ~라면 ...할 텐데'처럼 사실과 반대로 상상할 때는 어떻게 말할까", "075": "조동사가 있거나 두 단어짜리 동사일 때 수동태는 어떻게 만들까", "059": "이미 지난 일에 대해 '틀림없어', '그럴 리 없어', '그랬어야 했는데'는 어떻게 말할까", "090-H1": "'~가 없다면'이나 '이제 ~할 때야'도 가정법으로 말할까"};
var SAVE="bpm3-"+UNIT;
var st={tab:0,idx:0,rec:{}};
function ld(){try{var s=localStorage.getItem(SAVE);if(s){var o=JSON.parse(s);if(o&&o.rec)st.rec=o.rec;if(o&&typeof o.tab==="number")st.tab=o.tab;if(o&&typeof o.idx==="number")st.idx=o.idx}}catch(e){}}
function sv(){try{localStorage.setItem(SAVE,JSON.stringify({rec:st.rec,tab:st.tab,idx:st.idx}))}catch(e){}}
function items(t){return DATA.filter(function(d){return d.sec===STEPS[t].key})}
function rec(id){return st.rec[id]||(st.rec[id]={})}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function hl(s){return esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="hl">$1</span>')}
var PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
function norm(s){return String(s||"").toLowerCase().replace(/[.\s]/g,"")}
function renderTabs(){
 var h="";STEPS.forEach(function(s,i){
  var its=items(i),done=its.filter(function(d){return rec(d.id).done}).length;
  h+='<div class="tab'+(i===st.tab?' on':'')+'" onclick="goTab('+i+')">'+esc(s.name)+'<small>'+done+'/'+its.length+'</small></div>'});
 document.getElementById("tabs").innerHTML=h;
 var all=DATA.filter(function(d){return rec(d.id).done}).length;
 document.getElementById("prog").textContent=all+"/"+DATA.length;
}
function goTab(i){st.tab=i;st.idx=0;sv();render()}
function goIdx(i){st.idx=i;sv();render()}
function render(){
 renderTabs();
 var its=items(st.tab),app=document.getElementById("app");
 if(st.tab>=STEPS.length){return}
 if(its.length===0){app.innerHTML='<div class="card">문항이 없어요.</div>';return}
 if(st.idx>=its.length){app.innerHTML=summary();return}
 var d=its[st.idx],r=rec(d.id);
 var h='<div class="nums">';
 its.forEach(function(x,i){var rr=rec(x.id);h+='<button class="nb'+(i===st.idx?' cur':'')+(rr.done?(rr.right?' ok':' ng'):'')+'" onclick="goIdx('+i+')">'+x.no+'</button>'});
 h+='<button class="nb" onclick="goIdx('+its.length+')" title="결과">결과</button></div>';
 h+='<div class="card"><span class="tag">'+esc(STEPS[st.tab].name)+' · '+d.no+'번</span><div class="qt">'+esc(d.qtype)+(d.page?' · 교재 '+d.page+'쪽':'')+'</div>';
 if(!r.done){
  h+='<button class="btn s" onclick="useHint(\''+d.id+'\',1)">'+(r.h>=1?'먼저 볼 것 (열려 있어요)':'먼저 볼 것 보기')+'</button>';
  if(r.h>=1){
   h+='<div class="hint">'+hl(d.h1)+'</div>';
   if(d.words&&d.words.length){h+='<div class="lab">단어 뜻</div><div class="chips">'+d.words.map(function(w){return '<span><b>'+esc(w[0])+'</b> '+esc(w[1])+'</span>'}).join("")+'</div>'}
   if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
   if(r.h<2)h+='<button class="btn g" onclick="useHint(\''+d.id+'\',2)">아직 막혀요 · 한 걸음 더</button>';
  }
  if(r.h>=2)h+='<div class="hint two">'+hl(d.h2)+'</div>';
  if(d.type==="mc"){
   var labs=d.opts.map(function(o){return o.n});
   var multi=d.ans.indexOf(",")>=0,sel=r.sel||[];
   h+='<div class="choices'+(labs.length===2?' two':'')+'">'+labs.map(function(l){return '<button class="ch" style="'+(multi&&sel.indexOf(l)>=0?'background:var(--soft);border-color:var(--a)':'')+'" onclick="'+(multi?'tog':'pick')+'(\''+d.id+'\',\''+l+'\')">'+esc(l)+'</button>'}).join("")+'</div>';
   h+=multi?'<div class="meter">정답이 두 개예요. 모두 누른 뒤 확인을 눌러요</div><button class="btn p" onclick="confirmMulti(\''+d.id+'\')">확인</button>':'<div class="meter">책의 답을 골라 누르면 바로 확인돼요</div>';
  }else{
   h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div>';
   h+='<button class="btn p" onclick="showW(\''+d.id+'\')">정답 확인</button>';
  }
 }else{
  h+=answerView(d,r);
 }
 h+='</div>';
 h+='<div class="nav">'+(st.idx>0?'<button class="btn g" onclick="goIdx('+(st.idx-1)+')">이전</button>':'')+'<button class="btn p" onclick="goIdx('+(st.idx+1)+')">'+(st.idx+1>=its.length?'결과 보기':'다음 문제')+'</button></div>';
 app.innerHTML=h;
}
function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
