ers는 박테리아와 젖산 칼슘이라는 영양분을 콘크리트 혼합물에 더했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"In 2006, the Dutch microbiologist Henk Jonkers developed bio-concrete as a potential solution to this problem by adding specific bacteria, such as Bacillus pseudofirmus, and a nutrient known as calcium lactate to the concrete mixture.","2006년에, 네덜란드 미생물학자 Henk Jonkers는 Bacillus pseudofirmus와 같은 특정한 박테리아와 젖산 칼슘으로 알려진 영양분을 콘크리트 혼합물에 더함으로써 이 문제에 대한 잠재적인 해결책으로서 바이오 콘크리트를 개발했다."]],"w":"7번에서 Henk Jonkers가 2006년에 특정한 박테리아와 젖산 칼슘으로 알려진 영양분을 콘크리트 혼합물에 더했다고 해요.","c":"T"},"h":"e37e5b74ca"},{"n":2,"t":"tf","q":"The bacteria in bio-concrete are always active, even when there is no water.","ko":"바이오 콘크리트의 박테리아는 물이 없을 때도 항상 활동한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"The bacteria remain dormant until they encounter water, at which point they activate and begin to feed on the calcium lactate.","그 박테리아는 그것들이 물을 만날 때까지 휴면 상태로 남아 있는데, 그 시점에 그것들은 활성화되고 젖산 칼슘을 먹기 시작한다."]],"w":"8번에서 박테리아는 물을 만날 때까지 휴면 상태(dormant)로 남아 있어요. 물을 만나야 활성화되므로 항상 활동하는 것이 아니에요.","c":"F"},"h":"14d380082f"},{"n":3,"t":"tf","q":"The concrete dome of the Pantheon in Rome has lasted for hundreds of years.","ko":"로마 판테온의 콘크리트 돔은 수백 년 동안 지속되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Built in AD 128, the Pantheon in Rome has a huge concrete dome that has lasted for hundreds of years, showing the strength of concrete and why it is a very popular building material worldwide.","AD 128년에 지어진 로마의 판테온은 수백 년 동안 지속된 거대한 콘크리트 돔을 가지고 있으며, 이는 콘크리트의 강도와 왜 그것이 전 세계적으로 매우 인기 있는 건축 자재인지를 보여준다."]],"w":"1번에서 AD 128년에 지어진 판테온에 수백 년 동안 지속된 거대한 콘크리트 돔이 있다고 해요.","c":"T"},"h":"76586b934e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (While concrete is highly durable, it is still susceptible to damage over time…)","ko":"콘크리트는 매우 내구성이 있지만, 시간이 지남에 따라 여전히 손상에 …하다.","opts":["저항력이 강한","취약한","무관심한","면역이 된"],"word":"susceptible","r":{"a":"2) 취약한","ev":"3번 문장","s":[[3,"While concrete is highly durable, it is still susceptible to damage over time due to variations in temperature and humidity.","콘크리트는 매우 내구성이 있지만, 그것은 온도와 습도의 변화들 때문에 시간이 지남에 따라 여전히 손상에 취약하다."]],"w":"While로 앞의 '내구성이 있다'와 반대되는 약점을 말해요. 시간이 지나면 손상되기 쉬우니 susceptible to damage는 '손상에 취약한'이에요.","c":2},"h":"cfce8cfcb2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…small cracks in the outer surface, through which water can penetrate the interior.)","ko":"…외부 표면의 작은 균열들, 그것을 통해 물이 내부로 …할 수 있다.","opts":["증발하다","얼다","침투하다","녹이다"],"word":"penetrate","r":{"a":"3) 침투하다","ev":"4번 문장","s":[[4,"Changing environmental conditions create small cracks in the outer surface, through which water can penetrate the interior.","변하는 환경적 조건들은 외부 표면에 작은 균열들을 만드는데, 그것을 통해 물이 내부로 침투할 수 있다."]],"w":"작은 균열은 겉면의 틈이고, 물이 그 틈을 지나 안쪽(the interior)으로 들어가요. 5번에서 그 물이 더 많은 수분이 들어오는 틈을 만든다고 이어지므로 penetrate는 '침투하다'예요.","c":3},"h":"8a123d6359"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nA recent development called bio-concrete may extend the lives of concrete structures even further by enabling them to repair themselves.","ko":"밑줄 친 them이 가리키는 것은?","sko":"바이오 콘크리트라고 불리는 최근의 개발은 그것들이 스스로를 수리하는 것을 가능하게 함으로써 콘크리트 구조물들의 수명들을 훨씬 더 연장할지도 모른다.","opts":["바이오 콘크리트","박테리아","콘크리트 구조물들","콘크리트의 수명"],"r":{"a":"3) 콘크리트 구조물들","ev":"2번 문장","s":[[2,"A recent development called bio-concrete may extend the lives of concrete structures even further by enabling them to repair themselves.","바이오 콘크리트라고 불리는 최근의 개발은 그것들이 스스로를 수리하는 것을 가능하게 함으로써 콘크리트 구조물들의 수명들을 훨씬 더 연장할지도 모른다."]],"w":"스스로를 수리하게 되는 쪽은 수명이 아니라 구조물 자체예요. enable them to repair themselves에서 them은 concrete structures(콘크리트 구조물들)를 가리켜요.","c":3},"h":"31f96b1a21"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Although self-healing structures seem like something from a science-fiction movie, they are almost a reality.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 자가 치유 구조물들이 공상 과학 영화로부터의 무언가처럼 보일지라도, 그것들은 거의 현실이다.","opts":["자가 치유 구조물은 공상 과학 영화 속 이야기처럼 보이지만 거의 현실이 되었다.","자가 치유 구조물은 공상 과학 영화에서 영감을 받아 이미 모든 건물에 쓰이고 있다.","자가 치유 구조물은 공상 과학 영화에만 나오는 것이라 현실이 되기는 어렵다.","자가 치유 구조물은 영화를 만드는 데 필요한 기술이다."],"r":{"a":"1) 자가 치유 구조물은 공상 과학 영화 속 이야기처럼 보이지만 거의 현실이 되었다.","ev":"10번 문장","s":[[10,"Although self-healing structures seem like something from a science-fiction movie, they are almost a reality.","비록 자가 치유 구조물들이 공상 과학 영화로부터의 무언가처럼 보일지라도, 그것들은 거의 현실이다."]],"w":"Although는 '비록 ~이지만'이에요. 영화 같아 보이지만 almost a reality(거의 현실)라는 대비예요. 이미 모든 건물에 쓰인다거나(과장), 현실이 되기 어렵다는 말(반대)은 아니에요.","c":1},"h":"23e3ba381f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["바이오 콘크리트는 비싼 수리가 필요 없는 구조물을 지을 수 있게 해 줄 수 있다.","바이오 콘크리트는 판테온을 지은 로마 기술자가 발명했다.","바이오 콘크리트는 표면에 매주 화학 물질을 뿌려서 균열을 고친다.","바이오 콘크리트의 박테리아는 콘크리트가 섞이자마자 일하기 시작한다."],"opts":["Bio-concrete could allow the building of strong structures that do not need expensive repairs.","Bio-concrete was invented by the Roman engineer who built the Pantheon.","Bio-concrete repairs cracks with chemicals sprayed on the surface every week.","The bacteria in bio-concrete start working as soon as the concrete is mixed."],"r":{"a":"1) Bio-concrete could allow the building of strong structures that do not need expensive repairs.","ev":"11번 문장","s":[[11,"Bio-concrete has the potential to revolutionize the construction industry by allowing the building of very strong structures that do not need expensive repairs.","바이오 콘크리트는 비싼 수리를 필요로 하지 않는 매우 튼튼한 구조물들의 건설을 허용함으로써 건설 산업에 혁명을 일으킬 잠재력을 가진다."]],"w":"11번에서 바이오 콘크리트는 비싼 수리가 필요 없는 매우 튼튼한 구조물의 건설을 허용할 잠재력이 있어요. 개발자는 2006년의 Jonkers이고(7번), 박테리아가 균열을 메우며(9번), 물을 만나야 일을 시작해요(8번).","c":1},"h":"24d33eaaf8"},{"n":9,"t":"sum","q":"Water that gets into small cracks makes the cracks (A), but in bio-concrete the limestone made by bacteria can (B) the crack.","ko":"작은 균열에 들어간 물은 균열을 (A) 만들지만, 바이오 콘크리트에서는 박테리아가 만든 석회암이 균열을 (B)할 수 있다.","oko":["(A) 더 작게 / (B) 밀봉","(A) 더 크게 / (B) 넓히다","(A) 더 작게 / (B) 넓히다","(A) 더 크게 / (B) 숨기다","(A) 더 크게 / (B) 밀봉"],"opts":["(A) smaller / (B) seal","(A) larger / (B) widen","(A) smaller / (B) widen","(A) larger / (B) hide","(A) larger / (B) seal"],"r":{"a":"5) (A) larger / (B) seal","ev":"5번, 9번 문장","s":[[5,"This weakens the concrete, leading to the formation of larger fissures that allow even more moisture to enter.","이것은 콘크리트를 약화시키고, 훨씬 더 많은 수분이 들어오는 것을 허용하는 더 큰 틈들의 형성으로 이어진다."],[9,"A by-product of this process is limestone, a substance that hardens over the course of several weeks to completely seal the crack.","이 과정의 부산물은 석회암인데, 그 균열을 완전히 밀봉하기 위해 몇 주의 과정에 걸쳐 굳어지는 물질이다."]],"w":"5번에서 물이 들어오면 콘크리트가 약해지고 더 큰 틈(larger fissures)이 생겨요. 9번에서 석회암이 굳어 균열을 완전히 밀봉(seal)해요.","c":5},"h":"025ef4253a"},{"n":10,"t":"fill","q":"As the cycle continues, the concrete structure becomes [A] and may eventually [B].","ko":"그 순환이 계속됨에 따라, 콘크리트 구조물은 [A] 상태가 되고 결국 [B]할지도 모른다.","bank":["destabilized","collapse","activate","revolutionize","penetrate","extend"],"bko":{"destabilized":"불안정해진","collapse":"붕괴하다","activate":"활성화되다","revolutionize":"혁명을 일으키다","penetrate":"침투하다","extend":"연장하다"},"r":{"a":"[A] destabilized, [B] collapse","ev":"6번 문장","s":[[6,"As the cycle continues, the concrete structure becomes destabilized and may eventually collapse.","그 순환이 계속됨에 따라, 콘크리트 구조물은 불안정해지고 결국 붕괴할지도 모른다."]],"w":"6번에서 순환이 계속되면 구조물이 불안정해지고(destabilized) 결국 붕괴할지도(collapse) 모른다고 해요. [A]는 becomes 뒤의 상태를 나타내는 말이라 destabilized만 들어가요.","c":null},"h":"4636103a77"}]},{"u":9,"id":"ms3-09-3","no":3,"ko":"소름 돋는데 왜 자꾸 보게 되지?","items":[{"n":1,"t":"tf","q":"Digital and immersive art forms use technology to create experiences that bring about shock and introspection.","ko":"디지털 그리고 몰입형 예술 형태들은 충격과 자기 성찰을 이끌어 내는 경험을 창조하기 위해 기술을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"Digital and immersive art forms continue this tradition, using technology to create experiences that elicit shock and introspection.","디지털 그리고 몰입형 예술 형태들은 충격과 자기 성찰을 이끌어 내는 경험들을 창조하기 위해 기술을 사용하며, 이 전통을 계속한다."]],"w":"13번에서 디지털·몰입형 예술은 기술을 사용해 충격(shock)과 자기 성찰(introspection)을 이끌어 내는 경험을 만든다고 해요.","c":"T"},"h":"d0f9cdc62d"},{"n":2,"t":"tf","q":"Edmund Burke argued that beauty is the strongest emotion a person could feel.","ko":"에드먼드 버크는 아름다움이 사람이 느낄 수 있는 가장 강한 감정이라고 주장했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"In 1757, the Irish philosopher Edmund Burke presented one of the first theories of the sublime in art, arguing that it is the strongest emotion a person could feel.","1757년에, 아일랜드 철학자 에드먼드 버크는 예술에서 숭고함의 첫 번째 이론들 중 하나를 제시했고, 그것이 사람이 느낄 수 있는 가장 강한 감정이라고 주장했다."]],"w":"5번에서 버크가 가장 강한 감정이라고 주장한 것은 아름다움이 아니라 숭고함(it = the sublime)이에요.","c":"F"},"h":"a36ede43e6"},{"n":3,"t":"tf","q":"In the ocean scene, a person feels both insignificant and amazed by the power of nature.","ko":"바다 장면에서 사람은 자연의 힘에 하찮음과 경외감을 동시에 느낀다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"You feel both insignificant and amazed by the immense power of nature.","당신은 자연의 거대한 힘에 의해 자신의 하찮음을 느끼면서 동시에 경외감을 느낀다."]],"w":"2번에서 You feel both insignificant and amazed by the immense power of nature라고 해요. 두 감정을 함께 느낀다는 뜻이에요.","c":"T"},"h":"a21d1285d4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the horizon stretching endlessly before you.)","ko":"…지평선이 당신 앞에 끝없이 …있는 채로.","opts":["사라지는","무너지는","뻗어 있는","흔들리는"],"word":"stretching","r":{"a":"3) 뻗어 있는","ev":"1번 문장","s":[[1,"Imagine standing at the edge of a vast, storm-swept ocean, the horizon stretching endlessly before you.","거대한, 폭풍이 휩쓸고 간 바다의 가장자리에 서 있는 것을 상상해 보라, 지평선이 당신 앞에 끝없이 뻗어 있는 채로."]],"w":"1번은 바다 끝의 지평선이 끝없이(endlessly) 앞에 이어진 모습이에요. 그래서 stretching은 '뻗어 있는'이에요.","c":3},"h":"f6a9d2a19d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the unimaginable threat it poses to those who intrude is also revealed.)","ko":"…함부로 …하는 사람들에게 그것이 가하는 상상할 수 없는 위협","opts":["함부로 들어가다","도망치다","구경하다","머무르다"],"word":"intrude","r":{"a":"1) 함부로 들어가다","ev":"11번 문장","s":[[11,"Not only is the harsh splendor of the far north revealed, but the unimaginable threat it poses to those who intrude is also revealed.","먼 북쪽의 거친 장관이 드러날 뿐만 아니라, 함부로 들어가는 사람들에게 그것이 가하는 상상할 수 없는 위협 또한 드러난다."]],"w":"먼 북쪽의 거친 땅에 들어가는 사람에게 위협이 가해진다는 문맥이에요. 10번의 난파선도 위협의 예이므로, intrude는 '함부로 들어가다'예요.","c":1},"h":"e869ae8040"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nAt its core, the sublime refers to an aesthetic quality that transcends beauty, evoking awe or a profound sense of grandeur.","ko":"밑줄 친 that이 가리키는 것은?","sko":"그것의 핵심에서, 숭고함은 아름다움을 초월하는 미적 자질을 가리키며, 경외심 또는 장엄함의 심오한 감각을 불러일으킨다.","opts":["아름다움","미적 자질","경외심","장엄함의 감각"],"r":{"a":"2) 미적 자질","ev":"4번 문장","s":[[4,"At its core, the sublime refers to an aesthetic quality that transcends beauty, evoking awe or a profound sense of grandeur.","그것의 핵심에서, 숭고함은 아름다움을 초월하는 미적 자질을 가리키며, 경외심 또는 장엄함의 심오한 감각을 불러일으킨다."]],"c":2,"k":"that = 미적 자질","w":"4번 문장 an aesthetic quality that transcends beauty에서 that은 바로 앞의 an aesthetic quality(미적 자질)를 꾸며 줘요. 아름다움을 '초월하는' 것은 아름다움 자체가 아니라 숭고함이라는 미적 자질이에요."},"pron":"that","h":"cc89ef98a3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In contemporary art, abstract expressionists like Mark Rothko sought to evoke the sublime by filling giant canvases with vast fields of color to convey overwhelming human emotions.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"현대 미술에서, 마크 로스코와 같은 추상 표현주의자들은 압도적인 인간의 감정들을 전달하기 위해 거대한 캔버스들을 색의 거대한 들판들로 채움으로써 숭고함을 불러일으키려고 노력했다.","opts":["현대 미술에서 로스코 같은 추상 표현주의자들은 작은 캔버스에 세밀한 그림을 그려 차분한 감정을 전하려 했다.","로스코 같은 추상 표현주의자들은 숭고함을 피하려고 거대한 캔버스를 색으로 가득 채웠다.","현대 미술에서 로스코는 풍경을 사실적으로 그려 압도적인 인간의 감정을 전달하려 했다.","현대 미술에서 로스코 같은 추상 표현주의자들은 거대한 캔버스를 광활한 색의 면으로 채워 압도적인 인간의 감정을 전하며 숭고함을 불러일으키려 했다."],"r":{"a":"4) 현대 미술에서 로스코 같은 추상 표현주의자들은 거대한 캔버스를 광활한 색의 면으로 채워 압도적인 인간의 감정을 전하며 숭고함을 불러일으키려 했다.","ev":"12번 문장","s":[[12,"In contemporary art, abstract expressionists like Mark Rothko sought to evoke the sublime by filling giant canvases with vast fields of color to convey overwhelming human emotions.","현대 미술에서, 마크 로스코와 같은 추상 표현주의자들은 압도적인 인간의 감정들을 전달하기 위해 거대한 캔버스들을 색의 거대한 들판들로 채움으로써 숭고함을 불러일으키려고 노력했다."]],"w":"sought to evoke the sublime은 '숭고함을 불러일으키려 노력했다', giant canvases with vast fields of color는 '색의 거대한 들판으로 채운 거대한 캔버스'예요. 작은 캔버스, 숭고함 피하기, 사실적 풍경은 모두 본문과 달라요.","c":4},"h":"5d855a1e75"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["독일의 화가 에드먼드 버크가 1757년에 숭고함의 이론을 제시했다.","낭만주의자들은 높이 솟은 산들과 격렬한 눈사태를 묘사해 자연의 힘을 전달했다.","마크 로스코는 작은 캔버스로 차분하고 편안한 감정을 표현했다.","디지털 예술 형태들은 숭고함의 전통에서 벗어났다."],"opts":["Edmund Burke, a German painter, introduced a theory of the sublime in 1757.","Romanticists conveyed the power of nature by depicting towering mountains and violent avalanches.","Mark Rothko used small canvases to express calm and relaxed feelings.","Digital art forms turned away from the tradition of the sublime."],"r":{"a":"2) Romanticists conveyed the power of nature by depicting towering mountains and violent avalanches.","ev":"8번 문장","s":[[8,"The romanticists of the 18th and 19th centuries, in particular, conveyed the majesty and power of nature, depicting towering mountains and violent avalanches.","18세기와 19세기의 낭만주의자들은, 특히, 높이 솟은 산들과 격렬한 눈사태들을 묘사하며, 자연의 위엄과 힘을 전달했다."]],"w":"8번에서 18~19세기 낭만주의자들이 높이 솟은 산들과 격렬한 눈사태를 묘사하며 자연의 위엄과 힘을 전달했어요. 버크는 아일랜드 철학자이고(5번), 로스코는 거대한 캔버스를 썼고(12번), 디지털 예술은 전통을 이어 가요(13번).","c":2},"h":"aefe2a67c2"},{"n":9,"t":"sum","q":"Beauty evokes (A) memories, whereas the sublime triggers an irresistible feeling of delightful (B).","ko":"아름다움은 (A) 기억을 불러일으키는 반면, 숭고함은 즐거운 (B)의 저항할 수 없는 감각을 유발한다.","oko":["(A) 고통스러운 / (B) 공포","(A) 편안한 / (B) 지루함","(A) 편안한 / (B) 공포","(A) 고통스러운 / (B) 기쁨","(A) 낯선 / (B) 평온"],"opts":["(A) painful / (B) horror","(A) comfortable / (B) boredom","(A) comfortable / (B) horror","(A) painful / (B) joy","(A) unfamiliar / (B) calm"],"r":{"a":"3) (A) comfortable / (B) horror","ev":"6번 문장","s":[[6,"Whereas beauty evokes memories of familiar, comfortable experiences, the sublime triggers an irresistible sensation of delightful horror.","아름다움이 친숙하고, 편안한 경험들의 기억들을 불러일으키는 반면에, 숭고함은 즐거운 공포의 저항할 수 없는 감각을 유발한다."]],"w":"6번에서 아름다움은 친숙하고 편안한(familiar, comfortable) 경험의 기억을 불러일으키고, 숭고함은 즐거운 공포(delightful horror)의 감각을 유발해요.","c":3},"h":"e02de6372e"},{"n":10,"t":"fill","q":"It shows the cold [A] of an Arctic ice field, with a tower of jagged ice shards crushing a [B].","ko":"그것은 [B]을(를) 부수고 있는 삐죽삐죽한 얼음 조각들의 탑과 함께, 북극 얼음 들판의 차가운 [A]을(를) 보여준다.","bank":["landscape","shipwreck","depicting","conveyed","expressed","evoking"],"bko":{"landscape":"풍경","shipwreck":"난파선","depicting":"묘사하는","conveyed":"전달했다","expressed":"표현했다","evoking":"불러일으키는"},"r":{"a":"[A] landscape (풍경), [B] shipwreck (난파선)","ev":"10번 문장","s":[[10,"It shows the cold landscape of an Arctic ice field, with a tower of jagged ice shards crushing a shipwreck.","그것은 난파선을 부수고 있는 삐죽삐죽한 얼음 조각들의 탑과 함께, 북극 얼음 들판의 차가운 풍경을 보여준다."]],"c":null,"w":"10번 It shows the cold landscape of an Arctic ice field, with a tower of jagged ice shards crushing a shipwreck.에서 가져왔어요. 북극 얼음 들판의 차가운 '풍경'은 landscape, 얼음 조각들의 탑이 부수고 있는 것은 '난파선'인 shipwreck이에요. depicting·conveyed·expressed·evoking은 동사 형태라서 the cold ~ of와 a ~ 뒤의 명사 자리에 들어갈 수 없어요."},"h":"5815f30c51"}]},{"u":9,"id":"ms3-09-4","no":4,"ko":"Here Comes the Well-Rounded Talent!","items":[{"n":1,"t":"tf","q":"One of the greatest advantages of STEAM education is its emphasis on hands-on, real-world applications.","ko":"STEAM 교육의 가장 큰 이점들 중 하나는 직접 해 보는 실제 세계의 응용에 대한 강조이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"One of the greatest advantages of STEAM education is its emphasis on hands-on, real-world applications.","STEAM 교육의 가장 큰 이점들 중 하나는 직접 해보는, 실제 세계의 응용들에 대한 그것의 강조이다."]],"w":"6번에서 STEAM 교육의 가장 큰 이점 중 하나가 직접 해 보는 실제 세계의 응용(hands-on, real-world applications)에 대한 강조라고 해요.","c":"T"},"h":"f0302db8c0"},{"n":2,"t":"tf","q":"STEAM education teaches each subject separately so that students can concentrate on it.","ko":"STEAM 교육은 학생들이 집중할 수 있도록 각 과목을 따로따로 가르친다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"STEAM education emphasizes the connections between subjects rather than teaching them in isolation.","STEAM 교육은 과목들을 고립시켜 가르치는 것보다는 과목들 사이의 연결들을 강조한다."]],"w":"3번에서 STEAM 교육은 과목들 사이의 연결을 강조하고 과목을 고립시켜 가르치는 것(teaching them in isolation)보다는 연결에 무게를 둔다고 해요. 따로 가르치는 것이 아니에요.","c":"F"},"h":"0c91c1d3ac"},{"n":3,"t":"tf","q":"Students might make digital art or program robots in STEAM projects.","ko":"학생들은 STEAM 프로젝트에서 디지털 예술을 만들거나 로봇을 프로그램할지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Students might create digital art to explore design and technology or program robots to see coding in action.","학생들은 디자인과 기술을 탐구하기 위해 디지털 예술을 창조하거나 코딩이 작동하는 것을 보기 위해 로봇들을 프로그램할지도 모른다."]],"w":"8번에서 학생들은 디자인과 기술을 탐구하려고 디지털 예술을 창조하거나 코딩이 작동하는 것을 보려고 로봇을 프로그램할지도 모른다고 해요.","c":"T"},"h":"6c606d59fa"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…to prepare students for an interrelated world.)","ko":"…학생들을 서로 …한 세상을 위해 준비시키기 위해.","opts":["서로 다투는","서로 관련된","멀리 떨어진","오래된"],"word":"interrelated","r":{"a":"2) 서로 관련된","ev":"2번 문장","s":[[2,"This innovative pedagogical approach blends Science, Technology, Engineering, Arts, and Mathematics to prepare students for an interrelated world.","이 혁신적인 교육적 접근법은 학생들을 서로 관련된 세상을 위해 준비시키도록 과학, 기술, 공학, 예술, 그리고 수학을 혼합한다."]],"w":"2번에서 STEAM은 다섯 과목을 혼합해 학생들을 준비시켜요. 과목들을 섞어야 할 만큼 모든 분야가 서로 얽혀 있는 세상이니, interrelated는 '서로 관련된'이에요.","c":2},"h":"5a99f011b6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…STEAM education fosters students' adaptability…)","ko":"…STEAM 교육은 학생들의 적응력을 …한다.","opts":["방해한다","측정한다","평가한다","길러 준다"],"word":"fosters","r":{"a":"4) 길러 준다","ev":"10번 문장","s":[[10,"Perhaps most importantly, STEAM education fosters students’ adaptability, a crucial skill in today’s job market.","아마도 가장 중요하게, STEAM 교육은 오늘날의 직업 시장에서 중요한 기술인 학생들의 적응력을 길러준다."]],"w":"10번은 STEAM 교육의 이점을 말하는 흐름이에요. 적응력은 오늘날 직업 시장에서 중요한 기술이라고 설명하니, fosters는 '길러 준다'예요.","c":4},"h":"65fb935bca"},{"n":6,"t":"ref","q":"What does the underlined \"where\" refer to?\nMany of these STEAM projects are carried out in teams, where students collaborate to share ideas and achieve common goals.","ko":"밑줄 친 where가 가리키는 것은?","sko":"이 STEAM 프로젝트들의 다수는 팀들로 수행되는데, 그곳에서 학생들은 아이디어들을 공유하고 공동의 목표들을 성취하기 위해 협력한다.","opts":["팀","학교","디지털 예술","로봇"],"r":{"a":"1) 팀","ev":"9번 문장","s":[[9,"Many of these STEAM projects are carried out in teams, where students collaborate to share ideas and achieve common goals.","이 STEAM 프로젝트들의 다수는 팀들로 수행되는데, 그곳에서 학생들은 아이디어들을 공유하고 공동의 목표들을 성취하기 위해 협력한다."]],"w":"학생들이 협력하는 곳은 앞에 나온 in teams(팀)예요. where는 '그런데 그곳에서'라는 뜻으로 teams를 부연 설명해요.","c":1},"h":"e5b66b44ca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of passively absorbing theoretical knowledge, students engage in meaningful learning experiences that mirror real-life scenarios.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"수동적으로 이론적인 지식을 흡수하는 것 대신에, 학생들은 실제 삶의 시나리오들을 반영하는 의미 있는 학습 경험들에 참여한다.","opts":["이론적인 지식을 수동적으로 흡수하는 것과 함께, 학생들은 실제 삶과 무관한 경험에 참여한다.","학생들은 이론적인 지식을 능동적으로 흡수하기 위해 실제 삶의 시나리오를 피한다.","수동적으로 이론적인 지식을 흡수하는 대신, 학생들은 실제 삶의 상황을 반영하는 의미 있는 학습 경험에 참여한다.","학생들은 실제 삶의 시나리오를 외우는 대신, 이론적인 지식을 수동적으로 흡수하며 배운다."],"r":{"a":"3) 수동적으로 이론적인 지식을 흡수하는 대신, 학생들은 실제 삶의 상황을 반영하는 의미 있는 학습 경험에 참여한다.","ev":"7번 문장","s":[[7,"Instead of passively absorbing theoretical knowledge, students engage in meaningful learning experiences that mirror real-life scenarios.","수동적으로 이론적인 지식을 흡수하는 것 대신에, 학생들은 실제 삶의 시나리오들을 반영하는 의미 있는 학습 경험들에 참여한다."]],"w":"Instead of ~는 '~ 대신에'이고, mirror real-life scenarios는 '실제 삶의 시나리오를 반영하다'예요. 이론을 수동적으로 받아들이는 것을 하지 않고, 실제 삶을 반영하는 경험에 참여한다는 뜻이에요.","c":3},"h":"12a6f0ea0f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["학생들은 다리의 적재 용량을 계산하는 일만 요구받는다.","학생들은 공학 프로젝트에서 다리를 설계할 때 다양한 재료와 디자인으로 실험할 수 있다.","STEAM 교육은 논리와 숫자에 집중하기 위해 예술을 제외한다.","대부분의 STEAM 프로젝트는 학생들이 아이디어를 공유하지 않도록 혼자 수행된다."],"opts":["Students are asked only to calculate the load capacity of a bridge.","Students may experiment with different materials and designs when they design a bridge in an engineering project.","STEAM education leaves out the arts to focus on logic and numbers.","Most STEAM projects are done alone so that students can avoid sharing ideas."],"r":{"a":"2) Students may experiment with different materials and designs when they design a bridge in an engineering project.","ev":"5번 문장","s":[[5,"When students design a bridge in an engineering project, for example, they don’t simply calculate load capacity; they experiment with different materials and designs to create a bridge that is both structurally sound and visually appealing.","예를 들어, 학생들이 공학 프로젝트에서 다리를 설계할 때, 그들은 단순히 적재 용량을 계산하지 않으며, 그들은 구조적으로 견고하고 시각적으로 매력적인 다리를 만들기 위해 다른 재료들과 디자인들로 실험한다."]],"w":"5번에서 학생들은 단순히 적재 용량만 계산하지 않고 다양한 재료와 디자인으로 실험해요. STEAM은 예술을 기술 과목과 통합하고(4번), 많은 프로젝트가 팀으로 수행돼요(9번).","c":2},"h":"b42e2640a6"},{"n":9,"t":"sum","q":"Because many (A) depend on science and creativity together, STEAM education gives students the (B) they need to thrive.","ko":"많은 (A)이(가) 과학과 창의성을 함께 필요로 하므로, STEAM 교육은 학생들에게 번창하는 데 필요한 (B)을(를) 갖추게 한다.","oko":["(A) 가족 / (B) 도구","(A) 산업 / (B) 장난감","(A) 가족 / (B) 성적","(A) 산업 / (B) 도구","(A) 산업 / (B) 성적"],"opts":["(A) families / (B) tools","(A) industries / (B) toys","(A) families / (B) grades","(A) industries / (B) tools","(A) industries / (B) grades"],"r":{"a":"4) (A) industries / (B) tools","ev":"11번 문장","s":[[11,"Many industries, from medical technology to entertainment, rely on a combination of science and creativity, proving that STEAM education equips students with the tools they need to thrive in various fields.","의료 기술에서 엔터테인먼트까지, 많은 산업들은 과학과 창의성의 결합에 의존하며, STEAM 교육이 학생들에게 그들이 다양한 분야들에서 번창하기 위해 필요한 도구들을 갖추게 한다는 것을 증명한다."]],"w":"11번에서 의료 기술에서 엔터테인먼트까지 많은 산업(industries)이 과학과 창의성의 결합에 의존하고, STEAM 교육이 학생들에게 필요한 도구(tools)를 갖추게 한다고 해요.","c":4},"h":"311730209d"},{"n":10,"t":"fill","q":"By [A] the arts with technical subjects, for example, STEAM encourages students to apply artistic creativity and [B] alongside logic and numbers.","ko":"예를 들어, 예술을 기술적인 과목들과 [A]함으로써, STEAM은 학생들이 논리와 숫자들과 함께 미적 창의성과 [B]을(를) 적용하도록 장려한다.","bank":["integrating","imagination","isolation","robots","calculating","absorbing"],"bko":{"integrating":"통합하는 것","imagination":"상상력","isolation":"고립","robots":"로봇들","calculating":"계산하는 것","absorbing":"흡수하는 것"},"r":{"a":"[A] integrating (통합하는 것), [B] imagination (상상력)","ev":"4번 문장","s":[[4,"By integrating the arts with technical subjects, for example, STEAM encourages students to apply artistic creativity and imagination alongside logic and numbers.","예를 들어, 예술을 기술적인 과목들과 통합함으로써, STEAM은 학생들이 논리와 숫자들과 함께 미적 창의성과 상상력을 적용하도록 장려한다."]],"c":null,"w":"4번 By integrating the arts with technical subjects, ~, STEAM encourages students to apply artistic creativity and imagination alongside logic and numbers.에서 가져왔어요. 예술을 기술적인 과목과 통합하는 것은 integrating, creativity와 짝을 이루는 말은 imagination(상상력)이에요. isolation·robots는 뜻이 맞지 않고, calculating·absorbing은 arts를 목적어로 쓰면 뜻이 맞지 않아요."},"h":"3497592118"}]},{"u":10,"id":"ms3-10-1","no":1,"ko":"다 가져가도 이건 못 가져가","items":[{"n":1,"t":"tf","q":"A diaspora is a group of people from the same area who create permanent communities in foreign lands.","ko":"디아스포라는 외국 땅에 영구적인 공동체를 만드는 같은 지역 출신 사람들의 집단이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They comprise a diaspora, which is a group of people from the same geographic area who create permanent communities in foreign lands.","그들은 디아스포라를 구성하는데, 이는 외국 땅에 영구적인 공동체를 만드는 동일한 지리적 지역 출신의 집단이다."]],"w":"2번 문장의 which 이하가 diaspora의 뜻풀이예요. 같은 지역 출신 사람들이 외국 땅에 영구적인 공동체를 만든 집단이라는 내용과 같아요.","c":"T"},"h":"b7e1876a03"},{"n":2,"t":"tf","q":"The Africans who were transported lost most aspects of their cultures, including their cuisine and music.","ko":"이송된 아프리카인들은 요리와 음악을 포함한 그들 문화의 대부분을 잃었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Despite the extreme hardships these individuals experienced, they retained many aspects of their countries’ cultures, including their cuisine, music, and religious beliefs.","이 개인들이 겪은 극심한 고난에도 불구하고, 그들은 요리, 음악, 종교적 신념 등을 포함한 그들 국가 문화의 많은 측면을 유지했다."]],"w":"5번 문장에서 이들은 극심한 고난에도 불구하고 요리, 음악, 종교적 신념을 포함한 문화의 많은 측면을 유지했어요(retained). 잃었다는 말은 반대예요.","c":"F"},"h":"6470682df3"},{"n":3,"t":"tf","q":"Members of the African Diaspora tend to lose their connections to their homelands.","ko":"아프리카 디아스포라의 구성원들은 고국과의 유대를 잃는 경향이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Regardless of their motivations, these members of the African Diaspora tend to maintain strong cultural, social, and economic connections to their homelands.","그들의 동기와 관계없이, 이러한 아프리카 디아스포라의 구성원들은 그들의 고국과 강력한 문화적, 사회적, 그리고 경제적 유대를 유지하는 경향이 있다."]],"w":"9번 문장에서 이들은 동기와 관계없이 고국과 강한 문화적, 사회적, 경제적 유대를 유지하는(maintain) 경향이 있다고 해요. 잃는다는 말은 반대예요.","c":"F"},"h":"74c6541271"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…they retained many aspects of their countries’ cultures, including their cuisine, music, and religious beliefs.)","ko":"…그들은 요리, 음악, 종교적 신념을 포함한 그들 국가 문화의 많은 측면을 유지했다.","opts":["~을 잊었다","~을 유지했다","~을 팔았다","~을 숨겼다"],"word":"retained","r":{"a":"2) ~을 유지했다","ev":"5번 문장","s":[[5,"Despite the extreme hardships these individuals experienced, they retained many aspects of their countries’ cultures, including their cuisine, music, and religious beliefs.","이 개인들이 겪은 극심한 고난에도 불구하고, 그들은 요리, 음악, 종교적 신념 등을 포함한 그들 국가 문화의 많은 측면을 유지했다."]],"w":"고난에도 불구하고(Despite) 문화의 많은 측면이 이어졌다는 흐름이에요. retain(유지하다)은 그대로 지킨다는 뜻이라 ~을 유지했다가 맞아요.","c":2},"h":"268af965e6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Since the termination of the slave trade, millions of Africans have relocated voluntarily to other regions.)","ko":"노예 무역의 종식 이후, 수백만 명의 아프리카인들이 자발적으로 다른 지역으로 이주했다.","opts":["돌아왔다","머물렀다","이주했다","도망쳤다"],"word":"relocated","r":{"a":"3) 이주했다","ev":"7번 문장","s":[[7,"Since the termination of the slave trade, millions of Africans have relocated voluntarily to other regions.","노예 무역의 종식 이후, 수백만 명의 아프리카인들이 자발적으로 다른 지역으로 이주했다."]],"w":"to other regions(다른 지역으로)가 뒤따르는 것으로 보아 relocate(이주하다)예요. 머물렀다(stay)는 반대이고, 돌아왔다는 방향이 달라요.","c":3},"h":"0b9a7126d0"},{"n":6,"t":"ref","q":"What does the underlined \"who\" refer to?\nSome sought economic or educational opportunities, while others hoped to join family members who already resided abroad.","ko":"밑줄 친 who가 가리키는 것은?","sko":"일부는 경제적 또는 교육적 기회를 찾았고, 반면 다른 이들은 이미 해외에 거주하고 있는 가족 구성원들과 합류하기를 희망했다.","opts":["일부 사람들","다른 이들","가족 구성원들","경제적·교육적 기회"],"r":{"a":"3) 가족 구성원들","ev":"8번 문장","s":[[8,"Some sought economic or educational opportunities, while others hoped to join family members who already resided abroad.","일부는 경제적 또는 교육적 기회를 찾았고, 반면 다른 이들은 이미 해외에 거주하고 있는 가족 구성원들과 합류하기를 희망했다."]],"c":3,"k":"who = 가족 구성원들","w":"8번 문장 hoped to join family members who already resided abroad에서 who는 바로 앞의 family members(가족 구성원들)를 꾸며 줘요. 이미 해외에 거주하고 있는 사람들은 합류하고 싶은 가족 구성원들이에요."},"pron":"who","h":"c69b789323"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Approximately 200 million individuals of African descent dwell in countries outside of the continent.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"약 2억 명의 아프리카계 개인들이 대륙 밖의 국가들에 거주한다.","opts":["약 2억 명의 사람들이 아프리카 대륙 안에서만 살고 있다.","약 2억 명의 아프리카계 사람들이 아프리카 대륙 밖의 나라들에 살고 있다.","아프리카 대륙에는 약 2억 개의 나라가 있다.","약 2억 명의 아프리카계 사람들이 곧 대륙을 떠날 계획이다."],"r":{"a":"2) 약 2억 명의 아프리카계 사람들이 아프리카 대륙 밖의 나라들에 살고 있다.","ev":"1번 문장","s":[[1,"Approximately 200 million individuals of African descent dwell in countries outside of the continent.","약 2억 명의 아프리카계 개인들이 대륙 밖의 국가들에 거주한다."]],"c":2,"w":"1번의 individuals of African descent는 '아프리카계 사람들', dwell in countries outside of the continent는 '대륙 밖의 나라들에 거주한다'는 뜻이에요. 그래서 약 2억 명의 아프리카계 사람들이 아프리카 밖에서 산다는 2번이 맞아요."},"h":"e61ff11041"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아프리카인들이 이송된 곳은 유럽, 북미, 남미였다.","노예 무역이 끝나자 아프리카인들의 이주도 모두 멈췄다.","디아스포라는 노예 무역 시기에만 생겨난 집단이다.","아프리카인들은 모두 가족을 만나려고 해외로 이주했다."],"opts":["Africans were transported to Europe, North America, and South America.","All African migration stopped when the slave trade ended.","The African Diaspora formed only during the era of the slave trade.","All Africans moved abroad to meet their families."],"r":{"a":"1) Africans were transported to Europe, North America, and South America.","ev":"3~4번, 7~8번 문장","s":[[3,"The origins of the African Diaspora can be traced to two distinct phenomena—slavery and voluntary migration.","아프리카 디아스포라의 기원은 두 가지 뚜렷한 현상, 즉 노예 제도와 자발적 이주로 거슬러 올라갈 수 있다."],[4,"From the 16th century to the 19th century, approximately 12 million Africans were forcibly transported to Europe, North America, and South America as part of the transatlantic slave trade.","16세기부터 19세기까지, 약 1,200만 명의 아프리카인들이 대서양 횡단 노예 무역의 일환으로 유럽, 북미, 그리고 남미로 강제 이송되었다."],[7,"Since the termination of the slave trade, millions of Africans have relocated voluntarily to other regions.","노예 무역의 종식 이후, 수백만 명의 아프리카인들이 자발적으로 다른 지역으로 이주했다."],[8,"Some sought economic or educational opportunities, while others hoped to join family members who already resided abroad.","일부는 경제적 또는 교육적 기회를 찾았고, 반면 다른 이들은 이미 해외에 거주하고 있는 가족 구성원들과 합류하기를 희망했다."]],"w":"4번에서 유럽, 북미, 남미로 강제 이송되었다고 해요. 노예 무역이 끝난 뒤에도 자발적 이주가 이어졌고(7번), 이주 이유도 가족 합류만이 아니었어요(8번). 기원은 두 가지예요(3번).","c":1},"h":"a426a949a8"},{"n":9,"t":"sum","q":"The origins of the African Diaspora can be (A) to two (B) phenomena—slavery and voluntary migration.","ko":"아프리카 디아스포라의 기원은 노예 제도와 자발적 이주라는 두 가지 (B) 현상으로 (A) 수 있다.","oko":["(A) 거슬러 올라갈 / (B) 비슷한","(A) 잊힐 / (B) 뚜렷한","(A) 거슬러 올라갈 / (B) 뚜렷한","(A) 잊힐 / (B) 비슷한","(A) 숨겨질 / (B) 단순한"],"opts":["(A) traced / (B) similar","(A) forgotten / (B) distinct","(A) traced / (B) distinct","(A) forgotten / (B) similar","(A) hidden / (B) simple"],"r":{"a":"3) (A) traced / (B) distinct ((A) 거슬러 올라갈 / (B) 뚜렷한)","ev":"3번 문장","s":[[3,"The origins of the African Diaspora can be traced to two distinct phenomena—slavery and voluntary migration.","아프리카 디아스포라의 기원은 두 가지 뚜렷한 현상, 즉 노예 제도와 자발적 이주로 거슬러 올라갈 수 있다."]],"c":3,"w":"3번에서 아프리카 디아스포라의 기원은 slavery(노예 제도)와 voluntary migration(자발적 이주)이라는 두 가지 distinct(뚜렷한) 현상으로 traced(거슬러 올라갈) 수 있다고 해요. 그래서 (A) traced, (B) distinct예요. similar·simple은 '뚜렷한 두 가지'라는 본문과 맞지 않고, forgotten·hidden은 본문에 없는 내용이에요."},"h":"d5b4502d17"},{"n":10,"t":"fill","q":"These were passed down from generation to generation, being fundamentally transformed in the process to form the unique cultural [A] of their [B].","ko":"이것들은 세대에서 세대로 전해졌고 그 과정에서 근본적으로 변형되어 그들 [B]의 독특한 문화적 [A]을(를) 형성했다.","bank":["identity","descendants","forcibly","retained","relocated","dwell"],"bko":{"identity":"정체성","descendants":"후손들","forcibly":"강제로","retained":"유지했다","relocated":"이주했다","dwell":"거주하다"},"r":{"a":"[A] identity (정체성), [B] descendants (후손들)","ev":"6번 문장","s":[[6,"These were passed down from generation to generation, being fundamentally transformed in the process to form the unique cultural identity of their descendants.","이것들은 세대에서 세대로 전해졌고 그 과정에서 근본적으로 변형되어 그들 후손의 독특한 문화적 정체성을 형성했다."]],"c":null,"w":"6번 These were passed down ~ to form the unique cultural identity of their descendants.에서 가져왔어요. 문화가 세대에서 세대로 전해져 '후손들'(descendants)의 독특한 문화적 '정체성'(identity)을 만들어요. forcibly·retained·relocated·dwell은 부사나 동사라서 cultural ~ of their ~ 의 명사 자리에 들어갈 수 없어요."},"h":"ec0b64096c"}]},{"u":10,"id":"ms3-10-2","no":2,"ko":"75살인데 뇌는 50살이래","items":[{"n":1,"t":"tf","q":"The Tsimane have very low rates of cognitive diseases even though they cannot use modern healthcare.","ko":"치마네족은 현대적인 의료 서비스를 이용할 수 없는데도 인지 질환 발생률이 매우 낮다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Despite having no access to modern healthcare, they have the lowest rates of cognitive diseases in the world.","현대적인 의료 서비스에 접근할 수 없음에도 불구하고, 그들은 세계에서 인지 질환 발생률이 가장 낮다."]],"w":"3번 문장에서 현대적인 의료에 접근할 수 없음에도 불구하고(Despite) 세계에서 인지 질환 발생률이 가장 낮다고 해요.","c":"T"},"h":"9f20480614"},{"n":2,"t":"tf","q":"The Tsimane take fewer steps per day than Westerners.","ko":"치마네족은 하루에 서양인보다 적게 걷는다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"In order to sustain their lifestyle, the Tsimane are highly active, with daily step counts exceeding 15,000, compared to 3,000 steps for Westerners.","그들의 생활 방식을 유지하기 위해, 치마네족은 서양인들의 3,000걸음에 비해 일일 걸음 수가 15,000걸음을 초과하면서 매우 활동적이다."]],"w":"9번 문장에서 치마네족은 하루 15,000걸음을 넘고 서양인은 3,000걸음이라고 해요. 치마네족이 훨씬 많이 걸어요.","c":"F"},"h":"f945d38e02"},{"n":3,"t":"tf","q":"The Tsimane have begun to get processed foods since they started contacting the outside world.","ko":"치마네족은 외부 세계와 접촉하기 시작한 이후 가공식품을 접하게 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"However, the tribe has begun to contact the outside world recently, gaining access to processed foods and ingredients like sugar and oil.","하지만, 그 부족은 최근 외부 세계와 접촉을 시작했고, 가공식품과 설탕과 기름 같은 재료에 접근하게 되었다."]],"w":"12번 문장에서 최근 외부 세계와 접촉을 시작하면서 가공식품과 설탕, 기름 같은 재료에 접근하게 되었다고 해요.","c":"T"},"h":"0e8c803a2f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Researchers have already observed an increase in obesity and cholesterol levels, …)","ko":"연구자들은 이미 비만과 콜레스테롤 수치의 증가를 관찰했다.","opts":["당뇨병","비만","영양 부족","동맥"],"word":"obesity","r":{"a":"2) 비만","ev":"13번 문장","s":[[13,"Researchers have already observed an increase in obesity and cholesterol levels, as well as the tribe’s first-ever case of diabetes.","연구자들은 이미 비만과 콜레스테롤 수치의 증가뿐만 아니라, 그 부족의 첫 번째 당뇨병 사례도 관찰했다."]],"w":"앞에 an increase in(~의 증가)과 뒤에 콜레스테롤 수치가 이어져요. 생활 방식 변화로 늘어난 건강 문제로 obesity는 비만이에요. 당뇨병(diabetes)은 같은 문장 뒤쪽에 따로 나와요.","c":2},"h":"ea694e2c69"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…a dedicated research team has been studying this tribe to understand why.)","ko":"…한 헌신적인 연구팀이 왜 그런지를 이해하기 위해 이 부족을 연구해 왔다.","opts":["유명한","값비싼","낯선","헌신적인"],"word":"dedicated","r":{"a":"4) 헌신적인","ev":"4번 문장","s":[[4,"For over 20 years, a dedicated research team has been studying this tribe to understand why.","20년이 넘는 기간 동안, 한 헌신적인 연구팀이 왜 그런지를 이해하기 위해 이 부족을 연구해 왔다."]],"w":"20년이 넘게 한 부족을 연구해 왔다는 흐름이에요. 오래 한 가지에 힘을 쏟는 연구팀이므로 dedicated는 헌신적인이에요.","c":4},"h":"0194c1fa77"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAnd because the tribe is secluded, they have had no exposure to cigarettes, alcohol, or fats used for frying.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그리고 그 부족이 고립되어 있기 때문에, 그들은 담배, 알코올, 또는 튀김에 사용되는 지방에 노출된 적이 없다.","opts":["연구자들","서양인들","그 부족","담배와 알코올"],"r":{"a":"3) 그 부족","ev":"10번 문장","s":[[10,"And because the tribe is secluded, they have had no exposure to cigarettes, alcohol, or fats used for frying.","그리고 그 부족이 고립되어 있기 때문에, 그들은 담배, 알코올, 또는 튀김에 사용되는 지방에 노출된 적이 없다."]],"c":3,"k":"they = 그 부족","w":"10번 문장 because the tribe is secluded, they have had no exposure to ~에서 they는 앞의 the tribe(그 부족)를 가리켜요. 고립되어 있어서 담배, 알코올, 튀김용 지방에 노출된 적이 없는 것은 그 부족이에요."},"pron":"they","h":"10900e1b2a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It remains to be seen whether this recent lifestyle shift will increase their rates of cognitive diseases too.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 최근의 생활 방식 변화가 그들의 인지 질환 발생률 역시 증가시킬지는 지켜봐야 한다.","opts":["이 변화는 이미 인지 질환을 크게 늘렸다.","이 변화는 인지 질환을 막아 줄 것이 분명하다.","인지 질환이 늘었는지 지켜보려는 사람은 없다.","이 변화가 인지 질환 발생률도 높일지는 아직 알 수 없다."],"r":{"a":"4) 이 변화가 인지 질환 발생률도 높일지는 아직 알 수 없다.","ev":"14번 문장","s":[[14,"It remains to be seen whether this recent lifestyle shift will increase their rates of cognitive diseases too.","이러한 최근의 생활 방식 변화가 그들의 인지 질환 발생률 역시 증가시킬지는 지켜봐야 한다."]],"w":"It remains to be seen whether ~는 '~인지는 아직 두고 봐야 한다'예요. 비만과 당뇨병은 이미 관찰되었지만(13번), 인지 질환이 늘지는 아직 모른다는 뜻이에요.","c":4},"h":"f4d69bf623"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["치마네족은 20년 미만 동안 연구되었다.","75세의 치마네족 사람은 75세 서양인의 동맥을 가지고 있다.","치마네족의 식단에는 채소, 생선, 기름기 적은 고기가 포함된다.","치마네족은 외부 세계와 접촉하면서 담배와 술을 쓰기 시작했다."],"opts":["The Tsimane have been studied for less than 20 years.","A 75-year-old Tsimane has the arteries of a 75-year-old Westerner.","The Tsimane diet includes vegetables, fish, and lean meat.","The Tsimane began to use cigarettes and alcohol when they met the outside world."],"r":{"a":"3) The Tsimane diet includes vegetables, fish, and lean meat.","ev":"4번, 8번, 10번, 11번, 12번 문장","s":[[4,"For over 20 years, a dedicated research team has been studying this tribe to understand why.","20년이 넘는 기간 동안, 한 헌신적인 연구팀이 왜 그런지를 이해하기 위해 이 부족을 연구해 왔다."],[8,"Their traditional living practices of hunting, foraging, and farming provide a nutritious diet of vegetables, fish, and lean meat.","사냥, 식량 채집, 그리고 농사와 같이 그들의 전통적인 생활 방식들은 채소, 생선, 그리고 기름기 적은 고기로 구성된 영양가 있는 식단을 제공한다."],[10,"And because the tribe is secluded, they have had no exposure to cigarettes, alcohol, or fats used for frying.","그리고 그 부족이 고립되어 있기 때문에, 그들은 담배, 알코올, 또는 튀김에 사용되는 지방에 노출된 적이 없다."],[11,"These factors have contributed to the average 75-year-old Tsimane having the arteries of a 50-year-old Westerner.","이러한 요인들은 평균적인 75세의 치마네족 사람이 50세 서양인의 동맥을 가지는 데 기여했다."],[12,"However, the tribe has begun to contact the outside world recently, gaining access to processed foods and ingredients like sugar and oil.","하지만, 그 부족은 최근 외부 세계와 접촉을 시작했고, 가공식품과 설탕과 기름 같은 재료에 접근하게 되었다."]],"w":"8번 문장에서 식단이 채소, 생선, 기름기 적은 고기라고 해요. 20년이 넘게 연구되었고(4번), 75세의 치마네족은 50세 서양인의 동맥을 가지며(11번), 외부 접촉 후 접한 것은 가공식품과 설탕, 기름이에요(12번). 담배와 술에는 노출된 적이 없다고 했어요(10번).","c":3},"h":"f8a49a3cdd"},{"n":9,"t":"sum","q":"The Tsimane’s (A) way of life has kept their brains healthy, but recent contact with the outside world has (B) their health.","ko":"치마네족의 (A) 생활 방식은 그들의 뇌를 건강하게 지켜 주었지만, 최근의 외부 세계와의 접촉은 그들의 건강을 (B).","oko":["(A) 현대적인 / (B) 좋아지게 했다","(A) 전통적인 / (B) 나빠지게 했다","(A) 현대적인 / (B) 나빠지게 했다","(A) 값비싼 / (B) 나빠지게 했다","(A) 전통적인 / (B) 좋아지게 했다"],"opts":["(A) modern / (B) improved","(A) traditional / (B) worsened","(A) modern / (B) worsened","(A) expensive / (B) worsened","(A) traditional / (B) improved"],"r":{"a":"2) (A) traditional / (B) worsened","ev":"7~9번, 12~13번 문장","s":[[7,"Researchers believe this slower brain deterioration is linked to the tribe’s healthy way of life.","연구자들은 이러한 더 느린 뇌 퇴화가 그 부족의 건강한 생활 방식과 연관되어 있다고 믿는다."],[8,"Their traditional living practices of hunting, foraging, and farming provide a nutritious diet of vegetables, fish, and lean meat.","사냥, 식량 채집, 그리고 농사와 같이 그들의 전통적인 생활 방식들은 채소, 생선, 그리고 기름기 적은 고기로 구성된 영양가 있는 식단을 제공한다."],[9,"In order to sustain their lifestyle, the Tsimane are highly active, with daily step counts exceeding 15,000, compared to 3,000 steps for Westerners.","그들의 생활 방식을 유지하기 위해, 치마네족은 서양인들의 3,000걸음에 비해 일일 걸음 수가 15,000걸음을 초과하면서 매우 활동적이다."],[12,"However, the tribe has begun to contact the outside world recently, gaining access to processed foods and ingredients like sugar and oil.","하지만, 그 부족은 최근 외부 세계와 접촉을 시작했고, 가공식품과 설탕과 기름 같은 재료에 접근하게 되었다."],[13,"Researchers have already observed an increase in obesity and cholesterol levels, as well as the tribe’s first-ever case of diabetes.","연구자들은 이미 비만과 콜레스테롤 수치의 증가뿐만 아니라, 그 부족의 첫 번째 당뇨병 사례도 관찰했다."]],"w":"뇌를 건강하게 지킨 것은 전통적인(traditional) 생활 방식이에요(2번, 7~8번). 외부 접촉 후에는 비만과 콜레스테롤 증가, 첫 당뇨병 사례가 나타나(13번) 건강이 나빠졌어요(worsened).","c":2},"h":"68f09d6027"},{"n":10,"t":"fill","q":"The brain [A] of Tsimane elders decreases 70 percent more slowly than that of Westerners, [B] their risk of cognitive disorders.","ko":"치마네족 노인들의 뇌 [A]은(는) 서양인보다 70퍼센트 더 천천히 줄어들어, 인지 장애의 위험을 [B] 효과가 있다.","bank":["volume","reducing","exposure","access","lean","secluded"],"bko":{"volume":"용적","reducing":"줄이는","exposure":"노출","access":"접근","lean":"기름기 적은","secluded":"고립된"},"r":{"a":"[A] volume, [B] reducing","ev":"5번 문장","s":[[5,"CT scans of Tsimane elders reveal that their brain volume decreases 70 percent more slowly compared to Western populations, significantly reducing their risk of cognitive disorders.","치마네족 노인들의 CT 스캔 결과는 그들의 뇌 용적이 서양 인구에 비해 70퍼센트 더 천천히 감소한다는 것을 보여주는데, 이는 인지 장애의 위험을 상당히 줄여준다."]],"w":"5번 문장에서 CT 스캔으로 뇌 용적(volume)이 더 천천히 줄어들고, 그 결과 인지 장애의 위험을 줄인다(reducing)고 해요. [B]는 앞 문장 전체의 결과를 나타내는 -ing 형태라서 reducing만 들어가요.","c":null},"h":"6d04438e9e"}]},{"u":10,"id":"ms3-10-3","no":3,"ko":"불안한 게 네 탓이 아니야","items":[{"n":1,"t":"tf","q":"Hofstede used data collected from more than 30 countries.","ko":"Hofstede는 30개국이 넘는 나라에서 수집된 데이터를 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Using data collected from over 30 countries, Hofstede identified uncertainty avoidance (UA) as one of the dimensions that determine the behaviors and values of a culture.","30개국 이상으로부터 수집된 데이터를 사용하여, Hofstede는 불확실성 회피(UA)를 한 문화의 행동들과 가치들을 결정하는 차원들 중 하나로서 식별했다."]],"w":"3번 문장에서 over 30 countries로부터 수집된 데이터를 사용했다고 해요.","c":"T"},"h":"915b44eb35"},{"n":2,"t":"tf","q":"Hofstede argued that people’s preference toward uncertainty is simply a matter of individual personality.","ko":"Hofstede는 불확실성에 대한 사람들의 선호가 단순히 개인 성격의 문제라고 주장했다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"While this preference may seem like a matter of individual personality, Dutch psychologist Geert Hofstede argued that it is a reflection of culture.","이 선호가 개인적인 성격의 문제처럼 보일지도 모르지만, 네덜란드 심리학자 Geert Hofstede는 그것이 문화의 반영이라고 주장했다."]],"w":"2번 문장에서 개인 성격의 문제처럼 보일 수 있지만(While ~) Hofstede는 그것이 문화의 반영이라고 주장했어요. 개인 성격만의 문제라는 말은 반대예요.","c":"F"},"h":"f84585d80a"},{"n":3,"t":"tf","q":"In Japan, lifetime employment and consensus-based decision-making help keep an organization stable.","ko":"일본에서는 평생 고용과 합의에 기반한 의사 결정이 조직을 안정적으로 유지하도록 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"In Japan, lifetime employment and consensus-based decision-making ensure the stability of an organization.","일본에서, 평생 고용과 합의에 기반한 의사 결정은 조직의 안정성을 보장한다."]],"w":"7번 문장에서 일본의 평생 고용과 합의에 기반한 의사 결정은 조직의 안정성을 보장한다(ensure the stability)고 해요.","c":"T"},"h":"e1158e6253"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…where people prioritize security and rely on strict behavioral codes to manage uncertainty.)","ko":"…그곳에서 사람들은 안전을 우선시하고 불확실성을 관리하기 위해 엄격한 행동 규범들에 의존한다.","opts":["~을 무시한다","~을 걱정한다","~을 우선시한다","~을 빌려준다"],"word":"prioritize","r":{"a":"3) ~을 우선시한다","ev":"5번 문장","s":[[5,"Hofstede classified Greece and Japan as high-UA cultures, where people prioritize security and rely on strict behavioral codes to manage uncertainty.","Hofstede는 그리스와 일본을 높은 UA 문화들로 분류했는데, 그곳에서 사람들은 안전을 우선시하고 불확실성을 관리하기 위해 엄격한 행동 규범들에 의존한다."]],"w":"사람들이 안전(security)을 prioritize하고 엄격한 규범에 의존한다는 흐름이에요. 불확실성을 줄이려는 문화이므로 안전을 중요하게 앞세운다는 뜻의 우선시한다가 맞아요.","c":3},"h":"88aad5b148"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (For them, ambiguity is an opportunity to forge their own path and innovate.)","ko":"그들에게, 모호함은 그들 자신의 길을 개척하고 혁신할 기회이다.","opts":["개척하다","피하다","복사하다","팔다"],"word":"forge","r":{"a":"1) 개척하다","ev":"10번 문장","s":[[10,"For them, ambiguity is an opportunity to forge their own path and innovate.","그들에게, 모호함은 그들 자신의 길을 개척하고 혁신할 기회이다."]],"w":"their own path(자기 길)와 innovate(혁신하다)가 함께 나와요. 모호함을 기회로 보고 새 길을 만들어 가는 것이므로 forge는 개척하다예요.","c":1},"h":"05e242f582"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nCompanies and individuals alike must learn to balance the need for stability with the benefits of flexibility, adapting their strategies to succeed in a culturally interconnected world.","ko":"밑줄 친 their가 가리키는 것은?","sko":"기업들과 개인들은 똑같이 안정성에 대한 필요와 유연성의 이점들 사이에서 균형을 잡는 것을 배워야 하며, 문화적으로 상호 연결된 세계에서 성공하기 위해 그들의 전략들을 적응시켜야 한다.","opts":["기업과 개인","안정성","유연성","세계"],"r":{"a":"1) 기업과 개인","ev":"13번 문장","s":[[13,"Companies and individuals alike must learn to balance the need for stability with the benefits of flexibility, adapting their strategies to succeed in a culturally interconnected world.","기업들과 개인들은 똑같이 안정성에 대한 필요와 유연성의 이점들 사이에서 균형을 잡는 것을 배워야 하며, 문화적으로 상호 연결된 세계에서 성공하기 위해 그들의 전략들을 적응시켜야 한다."]],"c":1,"k":"their = 기업과 개인","w":"13번 문장 Companies and individuals alike must learn ~, adapting their strategies to succeed에서 전략을 적응시키는 주체는 문장의 주어 Companies and individuals(기업과 개인)예요. 안정성·유연성·세계는 전략을 가지는 주체가 될 수 없어요."},"pron":"their","h":"81f8bfa492"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As globalization increases cultural interactions, these differing approaches to uncertainty management influence international business and social structures.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"세계화가 문화적 상호작용들을 증가시킴에 따라, 불확실성 관리에 대한 이 다른 접근법들은 국제적인 사업과 사회적 구조들에 영향을 미친다.","opts":["세계화로 문화 간 교류가 늘수록, 불확실성을 다루는 서로 다른 방식이 국제 사업과 사회 구조에 영향을 준다.","세계화는 문화 간 차이를 없애서 불확실성을 다루는 방식이 하나로 통일된다.","불확실성을 다루는 방식은 국제 사업에는 영향을 주지만 사회 구조에는 영향을 주지 않는다.","문화적 교류가 줄어들수록 불확실성 관리 방식이 국제 사업에 영향을 미친다."],"r":{"a":"1) 세계화로 문화 간 교류가 늘수록, 불확실성을 다루는 서로 다른 방식이 국제 사업과 사회 구조에 영향을 준다.","ev":"12번 문장","s":[[12,"As globalization increases cultural interactions, these differing approaches to uncertainty management influence international business and social structures.","세계화가 문화적 상호작용들을 증가시킴에 따라, 불확실성 관리에 대한 이 다른 접근법들은 국제적인 사업과 사회적 구조들에 영향을 미친다."]],"w":"As ~는 '~함에 따라'이고 영향을 받는 것은 international business and social structures 둘 다예요. 방식이 하나로 통일된다는 말은 없고, 교류는 줄지 않고 늘어나요(increases).","c":1},"h":"c56063333e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Hofstede는 미국의 문화만 연구했다.","일본에서는 한 명의 지도자가 다른 사람과 상의 없이 결정한다.","낮은 UA 문화의 사람들은 위험을 무슨 수를 써서라도 피하려 한다.","그리스 직원들은 상사의 명확한 지시가 있는 구조화된 환경을 선호한다."],"opts":["Hofstede studied only the culture of the United States.","In Japan, a single leader makes decisions without consulting others.","People in low-UA cultures try to avoid risk at all costs.","Greek employees prefer a structured workplace with clear directions from superiors."],"r":{"a":"4) Greek employees prefer a structured workplace with clear directions from superiors.","ev":"3번, 6~7번, 11번 문장","s":[[3,"Using data collected from over 30 countries, Hofstede identified uncertainty avoidance (UA) as one of the dimensions that determine the behaviors and values of a culture.","30개국 이상으로부터 수집된 데이터를 사용하여, Hofstede는 불확실성 회피(UA)를 한 문화의 행동들과 가치들을 결정하는 차원들 중 하나로서 식별했다."],[6,"Greek employees, for instance, favor a structured business environment with clear directives from superiors.","예를 들어, 그리스 직원들은 상사들로부터의 명확한 지시들이 있는 구조화된 사업 환경을 선호한다."],[7,"In Japan, lifetime employment and consensus-based decision-making ensure the stability of an organization.","일본에서, 평생 고용과 합의에 기반한 의사 결정은 조직의 안정성을 보장한다."],[11,"This mindset promotes a high tolerance for risk and a greater willingness to embrace change.","이 사고방식은 위험에 대한 높은 관용과 변화를 받아들이려는 더 큰 의사를 촉진한다."]],"w":"6번에서 그리스 직원들은 상사들의 명확한 지시가 있는 구조화된 사업 환경을 선호한다고 해요. 3번은 30개국 이상, 7번 일본은 합의에 기반한 의사 결정, 11번 낮은 UA 문화는 위험에 대한 높은 관용을 키운다고 해서 나머지는 틀려요.","c":4},"h":"58196c0402"},{"n":9,"t":"sum","q":"People in low-UA cultures see uncertainty as a source of (A) and feel (B) in situations without clear guidelines.","ko":"낮은 UA 문화의 사람들은 불확실성을 (A)의 원천으로 보고 명확한 지침이 없는 상황에서 (B) 기분을 느낀다.","oko":["(A) 두려움 / (B) 편안한","(A) 자유 / (B) 불안한","(A) 자유 / (B) 편안한","(A) 두려움 / (B) 불안한","(A) 자유 / (B) 화난"],"opts":["(A) fear / (B) comfortable","(A) freedom / (B) nervous","(A) freedom / (B) comfortable","(A) fear / (B) nervous","(A) freedom / (B) angry"],"r":{"a":"3) (A) freedom / (B) comfortable ((A) 자유 / (B) 편안한)","ev":"9번 문장","s":[[9,"They perceive it as a source of freedom and are comfortable in situations without clear guidelines.","그들은 그것을 자유의 원천으로서 인지하고 명확한 지침들이 없는 상황들에서 편안해한다."]],"c":3,"w":"9번에서 낮은 UA 문화의 사람들은 불확실성을 a source of freedom(자유의 원천)으로 인지하고, 명확한 지침이 없는 상황에서 comfortable(편안해한다)고 해요. 그래서 (A) freedom, (B) comfortable이에요. fear(두려움)는 자유와 반대이고, nervous(불안한)·angry(화난)는 편안하다는 본문과 맞지 않아요."},"h":"19a005ab99"},{"n":10,"t":"fill","q":"This mindset promotes a high [A] for risk and a greater [B] to embrace change.","ko":"이 사고방식은 위험에 대한 높은 [A]과(와) 변화를 받아들이려는 더 큰 [B]을(를) 촉진한다.","bank":["tolerance","willingness","classify","manage","forge","prioritize"],"bko":{"tolerance":"관용","willingness":"의지","classify":"분류하다","manage":"관리하다","forge":"개척하다","prioritize":"우선시하다"},"r":{"a":"[A] tolerance (관용), [B] willingness (의지)","ev":"11번 문장","s":[[11,"This mindset promotes a high tolerance for risk and a greater willingness to embrace change.","이 사고방식은 위험에 대한 높은 관용과 변화를 받아들이려는 더 큰 의사를 촉진한다."]],"c":null,"w":"11번 This mindset promotes a high tolerance for risk and a greater willingness to embrace change.에서 가져왔어요. 위험에 대한 '관용'은 tolerance, 변화를 받아들이려는 '의지'는 willingness예요. classify·manage·forge·prioritize는 동사라서 a high ~, a greater ~ 뒤의 명사 자리에 들어갈 수 없어요."},"h":"af074a4396"}]},{"u":10,"id":"ms3-10-4","no":4,"ko":"Forever Chemicals, Forever Consequences","items":[{"n":1,"t":"tf","q":"PFAS combine carbon and fluorine to form chemical bonds that are very hard to break.","ko":"PFAS는 탄소와 불소를 결합하여 깨기 매우 어려운 화학적 결합을 형성한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"PFAS combine carbon and fluorine to form virtually indestructible chemical bonds.","PFAS는 탄소와 불소를 결합하여 사실상 깰 수 없는 화학적 결합들을 형성한다."]],"w":"3번 문장에서 PFAS는 탄소와 불소를 결합해 사실상 깰 수 없는(virtually indestructible) 화학적 결합을 형성한다고 해요.","c":"T"},"h":"8249d66da6"},{"n":2,"t":"tf","q":"Once products containing PFAS are thrown away, the chemicals quickly break down in nature.","ko":"PFAS가 들어간 제품이 버려지면, 그 화학 물질은 자연에서 빠르게 분해된다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"However, once these products are discarded, the chemicals accumulate in the environment without naturally breaking down.","그러나, 일단 이 제품들이 버려지면, 그 화학 물질들은 자연적으로 분해되지 않고 환경에 축적된다."]],"w":"5번 문장에서 제품이 버려지면 화학 물질은 자연적으로 분해되지 않고(without naturally breaking down) 환경에 축적된다고 해요. 빠르게 분해된다는 말은 반대예요.","c":"F"},"h":"a7785ccd24"},{"n":3,"t":"tf","q":"PFAS are known for their environmental accumulation.","ko":"PFAS는 환경 축적성으로 알려져 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"These chemicals, known as PFAS, are characterized by their environmental accumulation.","PFAS로 알려진, 이 화학 물질들은 그것들의 환경 축적성에 의해 특징지어진다."]],"w":"2번 문장에서 PFAS로 알려진 이 화학 물질들은 환경 축적성(environmental accumulation)으로 특징지어진다고 해요.","c":"T"},"h":"9a5a3d8c9f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…these chemicals are incorporated into various consumer products, including nonstick pans, waterproof clothing, and food packaging.)","ko":"…이 화학 물질들은 들러붙지 않는 팬들, 방수 의류, 식품 포장을 포함하여 다양한 소비자 제품들에 포함된다.","opts":["~에서 제거된다","~에 포함된다","~에서 분해된다","~에 의해 금지된다"],"word":"incorporated","r":{"a":"2) ~에 포함된다","ev":"4번 문장","s":[[4,"Due to their exceptional resistance to heat, grease, and liquids, these chemicals are incorporated into various consumer products, including nonstick pans, waterproof clothing, and food packaging.","열, 기름, 그리고 액체들에 대한 그것들의 예외적인 저항력 때문에, 이 화학 물질들은 들러붙지 않는 팬들, 방수 의류, 그리고 식품 포장을 포함하여, 다양한 소비자 제품들에 포함된다."]],"w":"뒤에 into various consumer products(다양한 제품 안으로)와 예시(팬, 의류, 포장)가 이어져요. 제품 속에 들어가 쓰인다는 뜻이라 incorporate는 포함하다예요. 금지되는 것은 10번의 정부 정책 이야기예요.","c":2},"h":"774552bd3b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…pollution that persists in soil and drinking water.)","ko":"…흙과 식수에 지속되는 오염을 다루기 위해 더 강력한 노력이 필요하다.","opts":["사라지다","퍼지다","줄어들다","지속되다"],"word":"persists","r":{"a":"4) 지속되다","ev":"11번 문장","s":[[11,"While these regulations aim to prevent further contamination, experts argue stronger cleanup efforts and stricter policies are still needed to address pollution that persists in soil and drinking water.","이 규제들이 더 이상의 오염을 막는 것을 목표로 하기는 하지만, 전문가들은 흙과 식수에 지속되는 오염을 다루기 위해 더 강력한 정화 노력들과 더 엄격한 정책들이 여전히 필요하다고 주장한다."]],"w":"전문가들이 이미 남아 있는 오염을 다루려면 더 강한 노력이 필요하다고 해요. 그러니 persist는 사라지지 않고 계속 남아 있다는 뜻의 지속되다예요.","c":4},"h":"1c11770b3d"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAs PFAS move up the food chain, they pose a threat to humans who rely on fish from contaminated waters for food.","ko":"밑줄 친 they가 가리키는 것은?","sko":"PFAS가 먹이 사슬 위로 이동함에 따라, 그것들은 식량을 위해 오염된 수역들에서 나온 물고기에 의존하는 인간들에게 위협을 가한다.","opts":["물고기들","오염된 수역들","PFAS","인간들"],"r":{"a":"3) PFAS","ev":"8~9번 문장","s":[[8,"When PFAS enter lakes and rivers, they build up in the liver, blood, and muscle tissues of fish and other aquatic animals, disrupting hormone regulation, immune function, and reproduction.","PFAS가 호수와 강에 들어갈 때, 그것들은 물고기와 다른 수생 동물들의 간, 혈액, 그리고 근육 조직들에 쌓이며, 호르몬 조절, 면역 기능, 그리고 번식을 방해한다."],[9,"As PFAS move up the food chain, they pose a threat to humans who rely on fish from contaminated waters for food.","PFAS가 먹이 사슬 위로 이동함에 따라, 그것들은 식량을 위해 오염된 수역들에서 나온 물고기에 의존하는 인간들에게 위협을 가한다."]],"w":"위협을 가하는 쪽은 앞의 As 절의 주어 PFAS예요. 물고기와 인간은 PFAS가 쌓이거나 위협을 받는 대상이에요.","c":3},"h":"0ed6a082c5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Recognizing the risks, governments have begun enacting policies to prohibit the use of PFAS in industries such as food packaging and textiles.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 위험들을 인식하고, 정부들은 식품 포장과 직물들과 같은 산업들에서 PFAS의 사용을 금지하기 위해 정책들을 제정하는 것을 시작했다.","opts":["정부들은 위험을 알면서도 식품 포장 산업에서 PFAS 사용을 늘리는 정책을 만들었다.","PFAS를 금지하는 정책은 이미 모든 산업에서 완전히 시행되었다.","산업계가 PFAS 사용을 금지하라고 정부에 먼저 요구하기 시작했다.","정부들은 위험을 인식하고 식품 포장 같은 산업에서 PFAS 사용을 금지하는 정책을 만들기 시작했다."],"r":{"a":"4) 정부들은 위험을 인식하고 식품 포장 같은 산업에서 PFAS 사용을 금지하는 정책을 만들기 시작했다.","ev":"10번 문장","s":[[10,"Recognizing the risks, governments have begun enacting policies to prohibit the use of PFAS in industries such as food packaging and textiles.","그 위험들을 인식하고, 정부들은 식품 포장과 직물들과 같은 산업들에서 PFAS의 사용을 금지하기 위해 정책들을 제정하는 것을 시작했다."]],"w":"Recognizing the risks는 위험을 인식했다는 이유예요. 정부들은 사용을 늘리는 것이 아니라 금지하는 정책을 만들기 시작했고(have begun), 식품 포장과 직물 같은 산업이 예로 나와요. 이미 모든 산업에서 완전히 시행되었다는 말은 없어요.","c":4},"h":"e3bfc3d40d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["PFAS는 호수와 강에서 빠르게 분해된다.","PFAS는 만들어진 곳 밖으로는 이동하지 못한다.","각국 정부는 이미 모든 산업에서 PFAS를 금지했다.","PFAS는 물고기와 다른 수생 동물의 조직에 쌓일 수 있다."],"opts":["PFAS break down quickly in lakes and rivers.","PFAS cannot move beyond the place where they are made.","Governments have already banned PFAS in every industry.","PFAS can build up in the tissues of fish and other aquatic animals."],"r":{"a":"4) PFAS can build up in the tissues of fish and other aquatic animals.","ev":"5~6번, 8번, 10번 문장","s":[[5,"However, once these products are discarded, the chemicals accumulate in the environment without naturally breaking down.","그러나, 일단 이 제품들이 버려지면, 그 화학 물질들은 자연적으로 분해되지 않고 환경에 축적된다."],[6,"Being mobile, they also disperse through the air, soil, and water to remote regions.","이동성이 있어서, 그것들은 또한 공기, 흙, 그리고 물을 통해 외딴 지역들로 흩어진다."],[8,"When PFAS enter lakes and rivers, they build up in the liver, blood, and muscle tissues of fish and other aquatic animals, disrupting hormone regulation, immune function, and reproduction.","PFAS가 호수와 강에 들어갈 때, 그것들은 물고기와 다른 수생 동물들의 간, 혈액, 그리고 근육 조직들에 쌓이며, 호르몬 조절, 면역 기능, 그리고 번식을 방해한다."],[10,"Recognizing the risks, governments have begun enacting policies to prohibit the use of PFAS in industries such as food packaging and textiles.","그 위험들을 인식하고, 정부들은 식품 포장과 직물들과 같은 산업들에서 PFAS의 사용을 금지하기 위해 정책들을 제정하는 것을 시작했다."]],"w":"8번 문장에서 PFAS가 호수와 강에 들어가면 물고기와 다른 수생 동물의 간, 혈액, 근육 조직에 쌓인다고 해요. 분해되지 않고(5번), 공기, 흙, 물을 통해 퍼지며(6번), 정부는 금지하는 정책을 만들기 시작했을 뿐이에요(10번).","c":4},"h":"bc2c65493b"},{"n":9,"t":"sum","q":"“Forever chemicals” may sound (A), but in reality, they are anything but (B).","ko":"“영원한 화학 물질들”이라는 말은 (A) 느낌이지만, 현실에서 그것들은 결코 (B) 존재가 아니다.","oko":["(A) 낭만적인 / (B) 해로운","(A) 무서운 / (B) 사랑스러운","(A) 낭만적인 / (B) 사랑스러운","(A) 무서운 / (B) 해로운","(A) 지루한 / (B) 사랑스러운"],"opts":["(A) romantic / (B) harmful","(A) scary / (B) lovely","(A) romantic / (B) lovely","(A) scary / (B) harmful","(A) boring / (B) lovely"],"r":{"a":"3) (A) romantic / (B) lovely ((A) 낭만적인 / (B) 사랑스러운)","ev":"1번 문장","s":[[1,"“Forever chemicals” may sound romantic, but in reality, they are anything but lovely.","“영원한 화학 물질들”은 낭만적으로 들릴지도 모르지만, 현실에서, 그것들은 결코 사랑스럽지 않다."]],"c":3,"w":"1번에서 “영원한 화학 물질들”은 romantic(낭만적으로) 들릴지도 모르지만, 현실에서 그것들은 anything but lovely(결코 사랑스럽지 않다)고 해요. 그래서 (A) romantic, (B) lovely예요. scary·boring은 본문에 나오지 않고, harmful은 anything but 뒤에 쓰면 본문과 반대 뜻이 돼요."},"h":"4624cccb91"},{"n":10,"t":"fill","q":"Because PFAS are [A], they spread through the air, soil, and water to [B] regions, even Mount Everest.","ko":"PFAS는 [A] 성질 때문에, 공기, 흙, 물을 통해 에베레스트산까지 [B] 지역들로 퍼진다.","bank":["mobile","remote","disperse","prohibit","pose","enact"],"bko":{"mobile":"이동성이 있는","remote":"외딴","disperse":"흩어지다","prohibit":"금지하다","pose":"가하다","enact":"제정하다"},"r":{"a":"[A] mobile, [B] remote","ev":"6~7번 문장","s":[[6,"Being mobile, they also disperse through the air, soil, and water to remote regions.","이동성이 있어서, 그것들은 또한 공기, 흙, 그리고 물을 통해 외딴 지역들로 흩어진다."],[7,"Researchers have detected them at the bottom of the ocean and even at the top of Mount Everest!","연구원들은 그것들을 바다의 바닥에서 그리고 심지어 에베레스트산의 꼭대기에서도 발견했다!"]],"w":"6~7번에서 PFAS는 Being mobile(이동성이 있어서) 공기, 흙, 물을 통해 remote regions(외딴 지역들)로 흩어지고, 에베레스트산 꼭대기에서도 발견돼요. disperse·prohibit·pose·enact는 동사라서 'PFAS are ~'와 '~ regions' 자리에 들어갈 수 없어요.","c":null},"h":"dfa3d79b48"}]}];
