<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ee">
<title>데일리어법</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1c1f26;--mute:#6a6e78;--line:#e3dfd3;--accent:#2b5aa8;--soft:#e6edf8;--ok:#2d6a4f;--oks:#e3f1ea;--no:#b3261e;--nos:#fbe9e7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif;padding:14px 14px 110px;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font-family:inherit}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd h1{margin:0;font-size:20px;letter-spacing:-.01em}
.hd .sub{font-size:13px;color:var(--mute)}
.bk{border:0;background:none;color:var(--mute);font-size:14px;padding:6px 0;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(30,30,40,.05)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sb{border:1.5px solid var(--line);background:#fff;border-radius:12px;height:48px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer}
.sb.cur{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.sb.dn{background:var(--oks);border-color:#b9dcc9;color:var(--ok)}
.sb.lk{color:#bdb9aa;background:#faf9f4;cursor:default}
.sum{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sum b{font-size:30px;letter-spacing:-.02em}
.mute{color:var(--mute);font-size:14px}
.go{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;padding:15px;cursor:pointer}
.go.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.dots{display:flex;gap:6px}.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--accent)}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--no)}
.q{font-size:19px;line-height:1.95}
.w{border-bottom:1px dotted #b9b4a3;cursor:pointer}.w.lk{background:#e9f3ff;border-bottom-color:var(--accent)}
.br{display:inline-block;font-weight:700;color:var(--accent);background:var(--soft);padding:0 8px;border-radius:8px;margin:0 2px}
.lbl{font-size:13px;color:var(--mute);margin:0 0 8px;letter-spacing:.02em}
.row{display:flex;gap:10px}
.ab{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 10px;font-size:18px;font-weight:700;min-height:52px;cursor:pointer;color:var(--ink)}
.ab.ok{background:var(--oks);border-color:var(--ok);color:var(--ok)}
.ab.no{background:var(--nos);border-color:var(--no);color:var(--no)}
.hide{display:none!important}
.rv{background:#fff7e0;border:1px solid #ecd9a0;color:#7a5b00;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;line-height:1.5}
.sec{margin-top:16px}.sec:first-child{margin-top:0}.sec h4{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.02em}
.sl{border-top:1px solid var(--line)}
.sl .r{padding:8px 0 8px 10px;border-bottom:1px solid var(--line);border-left:3px solid var(--line)}.sl .r>b,.sl .r>span{display:block}
.sl .m{color:#8a8f98;font-weight:400}.sk .st{padding:6px 0 6px 10px;border-left:3px solid var(--line);margin-bottom:4px}.sk .st>small{display:block;color:var(--mute,#888);font-size:12.5px}.sk .st>b{display:block;font-size:15.5px;font-weight:600;line-height:1.45}.sk .st>span{display:block;font-size:14.5px;color:var(--accent)}.sk .sm{font-size:14px;margin-top:6px;font-weight:600}
.sl .r>b{font-size:15.5px;line-height:1.45;font-weight:600}.sl .r>span{font-size:14.5px;color:var(--accent);line-height:1.45}
.tx{font-size:15px;color:#3a3e48;line-height:1.7}
.nat{font-size:16px;line-height:1.75;background:#faf9f4;border-radius:10px;padding:10px 12px}
.gist{padding:12px 14px;border-radius:12px;background:#fff8e1;border:1px solid #f0e2b0;border-left:4px solid #d9a21b;font-size:16px;line-height:1.7;word-break:keep-all}
.post{background:#fff;border:1px solid var(--ink);border-left:6px solid var(--ink);border-radius:6px;padding:14px 14px 12px;margin-top:16px}
.post .lb{font-size:12px;letter-spacing:.1em;color:var(--mute);font-weight:600;margin-bottom:6px}
.post .fm{font-family:"Noto Serif KR",Georgia,serif;font-size:21px;font-weight:700;line-height:1.4;color:var(--ink)}
.post .fm i{font-style:normal;color:var(--accent);padding:0 .2em;font-weight:400}
.mp{margin-top:12px}
.mp .cl{font-size:12px;color:var(--mute);font-weight:600;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:2px 0 4px}
.mp .ph{display:grid;grid-template-columns:1fr 1fr;gap:3px 4px;margin-bottom:8px}
.mp .pl{grid-column:1/-1;font-size:12px;font-weight:700;border-left:3px solid var(--ink);padding-left:6px;line-height:1.2}
.mp .ce{background:#f1efe7;border-radius:6px;padding:6px 8px;font-size:15px;line-height:1.35}
.mp .ct{background:var(--soft);border-radius:6px;padding:6px 8px;font-size:15px;line-height:1.35;font-weight:700}
.mp .k{font-size:13px;color:#8a8f99;line-height:1.45;margin:2px 0 8px}
.mp .bd{margin-top:8px;font-size:15px;font-weight:700;color:var(--no)}
.mp .bd.alt{color:var(--ok,#1f8a4c)}.mp .bd.alt small{border-color:currentColor}.mp .bd small{font-size:12px;letter-spacing:.06em;margin-right:6px;border:1px solid var(--no);border-radius:4px;padding:0 5px;font-weight:600}
.trend{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.6}
.next{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.next button{max-width:560px;margin:0 auto}
.sheet{position:fixed;left:0;right:0;bottom:78px;margin:0 auto;max-width:520px;background:#1c1f26;color:#fff;border-radius:14px;padding:12px 16px;font-size:16px;z-index:5}
.sheet small{display:block;font-size:13px;color:#a9b0bd;margin-top:2px}
.res{display:flex;flex-direction:column;gap:6px}
.res .it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.res .it i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:9px;background:var(--ok)}.res .it i.no{background:var(--no)}
.tp{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.tp .l{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tp .l span{flex:1 1 100%;color:var(--mute);font-size:13px}
.tp button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}.tp button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rr{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.rr:last-child{border:0}
.rn{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin-top:2px}.rn.u{background:#c9c5b6}.rn.o{background:var(--ok)}.rn.x{background:var(--no)}
.rt{font-size:16px;line-height:1.6}.rt b{background:var(--oks);border-radius:6px;padding:0 4px}.rt small{display:block;color:var(--mute);font-size:13px;line-height:1.5;margin-top:2px}
.rec{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}.rec:last-child{border:0}.rec span:last-child{font-weight:700}
.bt{display:flex;flex-direction:column;gap:10px}.big{font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.rg{background:var(--oks);border:1px solid #b9dcc9;color:var(--ok);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;line-height:1.5}
</style></head><body>
<div class="wrap" id="app"></div>
<div class="sheet hide" id="sheet"></div>
<div class="next hide" id="nx"><button class="go" id="nb"></button></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var TM=/[?&]t=1(&|$)/.test(W.location.search);if(TM)W.TEACHER_MODE=true;
  var URL_=TM?'https://script.google.com/macros/s/AKfycbz0OolJAHbhYzjWxOkRY851Sn1-ZKL3JOYf4eWancUEotJsm4-z6aWzcm-71I9CIWyR/exec':(W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec'),PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){if(TM)return'신유정'+((/[?&]c=([AB])(&|$)/.exec(W.location.search)||[])[1]||'');return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK),now=Date.now(),RI=[];Q.forEach(function(b){b.forEach(function(it){if(!it.hu||it.hu<=now)RI.push(it)})});
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!RI.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(RI.length){var items=RI.map(function(it){var c={};for(var k in it)if(k!=='hu'&&k!=='id')c[k]=it[k];return c});var ids={};RI.forEach(function(it){if(it.id)ids[it.id]=1});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).map(function(b){return b.filter(function(it){return it.id?!ids[it.id]:false})}).filter(function(b){return b.length})))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()||/[?&]local=1(&|$)/.test(W.location.search)){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  W.WN={tap:function(items){var now=Date.now(),Q=jq(QK),HOLD=6000,w0=items.map(function(x){return x.w});Q=Q.map(function(b){return b.filter(function(it){return!(it.hu&&it.hu>now&&w0.indexOf(it.w)>=0)})}).filter(function(b){return b.length});var id0=now+'_'+Math.random().toString(36).slice(2,7);Q.push(items.map(function(it,i){var c={};for(var k in it)c[k]=it[k];c.hu=now+HOLD;c.id=id0+i;return c}));s(QK,JSON.stringify(Q));setTimeout(flush,HOLD+300);return true},untap:function(w){var now=Date.now(),Q=jq(QK),hit=false;Q=Q.map(function(b){return b.filter(function(it){if(it.hu&&it.hu>now&&it.w===w){hit=true;return false}return true})}).filter(function(b){return b.length});if(hit)s(QK,JSON.stringify(Q));return hit},add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },hwget:function(){var n=name();if(!n)return Promise.resolve([]);return post({act:'hwget',name:n,pin:PIN}).then(function(r){return(r&&r.ok&&r.hw)||[]},function(){return[]})},gate:gate,flush:flush,name:name};
  flush();
})(window);
</script>

  h+='<div class="card"><div class="q">'+tk(d.pre)+'<span class="br">[ '+tk(d.a)+' / '+tk(d.b)+' ]</span>'+tk(d.post)+'</div><div class="mute" style="margin-top:6px">모르는 단어는 눌러서 뜻 확인</div></div>';
  h+='<div class="card" id="s2"><p class="lbl">'+(cur.review&&S.res[cur.k]!=null?'처음 푼 결과':'정답 고르기')+'</p><div class="row"><button class="ab" data-k="a">'+esc(d.a)+'</button><button class="ab" data-k="b">'+esc(d.b)+'</button></div></div>';
  h+='<div class="card hide" id="exp"></div>';
  $("#app").innerHTML=h;$("#nx").classList.add("hide");$("#sheet").classList.add("hide");cur.step=1;
  $("#bk").onclick=function(){if(cur.review||cur.retry)result(cur.s);else home()};window.scrollTo(0,0);
  if(S.res[cur.k]!=null&&cur.review)pick(S.res[cur.k]===1?d.ans:(d.ans=="a"?"b":"a"),true);
}
function lay(s,en){var rows=[],buf='',cur='',dp=0;
  function fl(){if(!buf)return;var h=en?tk(buf):esc(buf);cur+=dp>0?'<span class="m">'+h+'</span>':h;buf=''}
  for(var i=0;i<s.length;i++){var c=s[i];
    if(c=='('||c=='['||c==')'||c==']'){}
    else if(c=='/'){fl();rows.push(cur);cur='';if(s[i+1]=='/')i++}
    else buf+=c}
  fl();rows.push(cur);return rows.filter(function(r){return r.replace(/<[^>]*>|\s/g,'')})}
function rd(d){
  if(!d.core)return '<div class="sec"><h4>직독직해</h4><div class="sl">'+d.sl.map(function(c){return '<div class="r"><b>'+tk(c[0])+'</b><span>'+esc(c[1])+'</span></div>'}).join('')+'</div></div>';
  var h='';
  var a=lay(d.core,1),b=lay(d.ckw,0),r='';
  if(d.dk){a=d.dk.map(function(p){return tk(p[0])});b=d.dk.map(function(p){return esc(p[1])})}
  if(!d.dk&&a.length!=b.length){a=[lay(d.core.replace(/\//g,' '),1).join(' ')];b=[lay(d.ckw.replace(/\//g,' '),0).join(' ')]}
  if(!d.dk)(function(){var wc=function(s){return s.replace(/<[^>]*>/g,' ').trim().split(/\s+/).length},ch=true;
    while(ch&&a.length>1){ch=false;
      for(var j=0;j<a.length;j++){if(wc(a[j])>2)continue;
        if(j==0){a[1]=a[0]+' '+a[1];b[1]=b[0]+' '+b[1];a.shift();b.shift()}
        else{a[j-1]+=' '+a[j];b[j-1]+=' '+b[j];a.splice(j,1);b.splice(j,1)}
        ch=true;break}}})();
  for(var i=0;i<a.length;i++)r+='<div class="r"><b>'+a[i]+'</b><span>'+b[i]+'</span></div>';
  h+='<div class="sec"><h4>직독직해</h4><div class="sl">'+r+'</div></div>';
  return h}
function pick(k,quiet){
  var d=Q[PL[cur.k]];if(cur.step!=1)return;cur.step=2;var ok=k==d.ans;
  if(!quiet&&!cur.review&&!cur.retry){S.res[cur.k]=ok?1:0;save()}if(cur.retry&&!quiet)cur.rr[cur.k]=ok?1:0;
  [].forEach.call(document.querySelectorAll(".ab"),function(x){if(x.dataset.k==d.ans)x.classList.add("ok");else if(x.dataset.k==k)x.classList.add("no")});
  var e=$("#exp");e.classList.remove("hide");
  var tr=d.trend||"";
  e.innerHTML='<div class="sec"><h4>정답</h4><b style="font-size:20px">'+esc(d[d.ans])+'</b></div>'
  +rd(d)
  +'<div class="sec"><h4>자연스러운 해석</h4><div class="nat">'+esc(d.ko)+'</div></div>'
  +(d.gist?'<div class="sec"><h4>한 줄 정리</h4><div class="gist">'+esc(d.gist)+'</div></div>':'')
  +bx(d)
  +'<div class="sec"><h4>왜 그럴까요</h4><div class="tx">'+esc(d.why).replace(/\n/g,'<br>')+'</div></div>'
  +(tr?'<div class="sec trend">'+tr+'</div>':'');
  var sq=seqOf(),last=cur.k==sq[sq.length-1];$("#nx").classList.remove("hide");$("#nb").textContent=cur.review?(last?"결과표로":"다음 문제"):(cur.retry?(last?"다시 풀기 마치기":"다음 문제"):(last?"오늘 학습 마치기":"다음 문제"));
  e.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function adv(){
  if(!cur.review&&!cur.retry){S.pos=Math.max(S.pos,cur.k+1);save()}
  var sq=seqOf(),i=sq.indexOf(cur.k);
  if(i<sq.length-1){cur.k=sq[i+1];show();return}
  if(cur.review){result(cur.s);return}
  if(cur.retry){var n=0,a=cur.rr;for(var k in a)if(a[k]===1)n++;(S.rt[cur.s]=S.rt[cur.s]||[]).push({d:fmtD(),n:n});save();result(cur.s,'다시 풀기 기록을 남겼어요');return}
  if(!S.dt[cur.s]){S.dt[cur.s]=fmtD();save()}
  (function(){var ok=0,i;for(i=cur.from;i<cur.to;i++)if(S.res[i]===1)ok++;eoSend(cur.s+1,ok,cur.to-cur.from)})();
  finish();
}
function finish(){result(cur.s,'오늘 학습을 마쳤어요 · 누적 단어 '+Object.keys(S.words).length+'개가 오답노트에 쌓였어요')}
document.addEventListener("click",function(e){
  var t=e.target;
  var w=t.closest&&t.closest(".w");
  if(w&&cur){var d=Q[PL[cur.k]],k=w.dataset.w,v=lookup(d.dict,k);if(v==null)return;
    var m=/^([A-Za-z][A-Za-z’' \-]*)\((.+?)\)(?:의 (.*))?$/.exec(v),base=m?m[1]:k,mean=m?m[2]:v,form=m&&m[3]?m[3]:"";
    var bl=base.toLowerCase(),undone=false;
    if(S.words[bl]&&window.WN&&WN.untap&&WN.untap(bl)){delete S.words[bl];save();undone=true;
      [].forEach.call(document.querySelectorAll('.w'),function(x){if(x.classList.contains('lk')&&x.dataset.w==k)x.classList.remove('lk')})}
    else{w.classList.add("lk");S.words[bl]={m:mean,src:"데일리어법"};save();
      if(window.WN){try{WN.tap([{w:bl,m:mean,src:"데일리어법",how:"문장 단어 찾기",ask:false}])}catch(x){}}}
    var sh=$("#sheet");sh.classList.remove("hide");
    sh.innerHTML=(base.toLowerCase()!=k?esc(k)+' → ':'')+'<b>'+esc(base)+'</b>('+esc(mean)+')'+(form?'<small>'+esc(k)+' = '+esc(base)+'의 '+esc(form)+'</small>':'')+(undone?'<small>오답노트에서 뺐어요</small>':'<small>오답노트에 '+esc(base.toLowerCase())+' 가 쌓였어요</small>');
    clearTimeout(window._st);window._st=setTimeout(function(){sh.classList.add("hide")},4000);return}
  var a=t.closest&&t.closest(".ab");if(a&&cur){pick(a.dataset.k);return}
  var ac=t.closest&&t.closest("[data-act]");if(ac){var as=+ac.dataset.s,k2=ac.dataset.act;if(k2=="retry")retryS(as);else if(k2=="wrong")reviewS(as,1);else if(k2=="all")reviewS(as);else home();return}
  var g=t.closest&&t.closest("[data-go]");if(g){startS(+g.dataset.go);return}
  var s=t.closest&&t.closest(".sb");if(s&&!s.classList.contains("lk")){var si=+s.dataset.s,cs=doneN();if(si<cs)result(si);else startS(si);return}
  var nn=t.closest&&t.closest("[data-n]");if(nn){var pos=S.pos;S.n=+nn.dataset.n;save();home();teacher();return}
  var op=t.closest&&t.closest("[data-op]");if(op){S.open=op.dataset.op=="1";save();home();teacher();return}
  var rs=t.closest&&t.closest("[data-rs]");if(rs){if(rs.dataset.armed){S.pos=0;S.res={};S.dt={};S.rt={};S.sv={};S.q={};S.rsT=Date.now();save();home();return}rs.dataset.armed=1;rs.textContent="한 번 더 누르면 처음부터";return}
});
$("#nb").onclick=adv;
WN.gate(function(){initS();eoFlush();var q=/[?&]day=(\d+)/.exec(location.search),fin=false;
  function deep(){if(!q)return;var cs=doneN(),sc=sessionCount(),d=+q[1]-1;if(d<cs)result(d);else if(cs<sc)startS(cs)}
  function go(){if(fin)return;fin=true;home();deep()}
