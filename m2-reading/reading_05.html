<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 5</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}
.sec{margin:26px 0 8px;font-weight:700;color:var(--pri);font-size:15px;border-left:4px solid var(--pri);padding-left:8px}
.sent{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;gap:10px;align-items:flex-start}.n{min-width:24px;color:var(--mut);font-size:13px;padding-top:3px}
.txt{font-size:18px;line-height:2}
.wd{cursor:pointer;border-radius:5px;padding:1px 2px;margin:0 1px;-webkit-tap-highlight-color:transparent}
.wd:hover{background:#eef3f8}.wd.on{background:var(--sel);box-shadow:inset 0 -2px 0 var(--selb)}
.locked .wd{cursor:default}.locked .wd:hover{background:none}
.wd.hit{background:var(--okbg);box-shadow:inset 0 -2px 0 var(--ok)}.wd.miss{background:var(--badbg);box-shadow:inset 0 -2px 0 var(--bad)}.wd.x{text-decoration:line-through;color:var(--mut)}
.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}
.note{margin:10px 0 0 34px;padding:10px 12px;border-radius:8px;font-size:14.5px}
.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}
button{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">
<header><a href="./" style="font-size:13px;color:var(--mut);text-decoration:none">&larr; M2 Reading</a><h1>Reading 5 · Have a Good Talk!</h1><div class="sub">좋은 대화를 나눠라! · 틀린 곳 찾기</div><div class="sub" id="best"></div></header>
<div class="relay" id="relay"></div><div class="rn">RELAY &middot; 앞 단계를 끝내야 다음 단계 오픈</div><div class="bmw"><span id="bm" class="bmk" style="display:none">책갈피 저장됨 &middot; 다음에 이어서 풀기<button type="button">처음부터</button></span></div><div id="app"></div>
</div>
<script>
var D=[{"n":1,"tag":null,"en":"The new school year is here! Do you get nervously when you talk to other students?","ko":"새 학년이 되었다! 당신은 다른 학생들과 대화할 때 긴장되는가?","ok":false,"foot":[],"fixes":[{"wrong":"nervously","right":"nervous","partial":false,"at":[9],"point":"형용사와 부사: get 뒤 보어 자리에는 형용사 nervous 사용","topic":"형용사와 부사","memo":"get 뒤 보어 자리에는 형용사 nervous 사용"}]},{"n":2,"tag":null,"en":"Do you have trouble starting conversations? Having a good conversation are not easy.","ko":"당신은 대화를 시작하는 데 어려움이 있는가? 대화를 잘하는 것은 쉽지 않다.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[10],"point":"be동사 수일치·과거: 동명사 주어는 단수 취급: is (are 아님)","topic":"be동사 수일치·과거","memo":"동명사 주어는 단수 취급: is (are 아님)"}]},{"n":3,"tag":null,"en":"But don't worry. Here is some tips to have a good conversation.","ko":"하지만 걱정하지 마라. 여기 좋은 대화를 나누기 위한 몇 가지 조언이 있다.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[4],"point":"be동사 수일치·과거: Here 뒤 주어 some tips(복수): are (is 아님)","topic":"be동사 수일치·과거","memo":"Here 뒤 주어 some tips(복수): are (is 아님)"}]},{"n":4,"tag":null,"en":"1. Start with small talk.","ko":"1. 가벼운 대화로 시작해라.","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":null,"en":"Begin conversations with a easy topic. Talk about the weather or hobbies.","ko":"쉬운 주제로 대화를 시작해라. 날씨나 취미에 관해 말해라.","ok":false,"foot":[],"fixes":[{"wrong":"a","right":"an","partial":false,"at":[3],"point":"관사 a/an: 모음 소리 easy 앞에는 an 사용","topic":"관사 a/an","memo":"모음 소리 easy 앞에는 an 사용"}]},{"n":6,"tag":null,"en":"For example, say, \"The weather is so nice today, doesn't it?\" Then the other person can answer easily.","ko":"예를 들면, \"오늘 날씨가 아주 좋아, 그렇지 않니?\"라고 말해라. 그러면 상대방은 쉽게 대답할 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"doesn't","right":"isn't","partial":false,"at":[9],"point":"부가의문문: be동사 is에는 isn't it 사용","topic":"부가의문문","memo":"be동사 is에는 isn't it 사용"}]},{"n":7,"tag":null,"en":"Small talk can leads to other fun topics to talk about.","ko":"가벼운 대화는 대화할 다른 재미있는 주제로 이어질 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"leads","right":"lead","partial":false,"at":[3],"point":"조동사: 조동사 can 뒤에는 동사원형: lead (leads 아님)","topic":"조동사","memo":"조동사 can 뒤에는 동사원형: lead (leads 아님)"}]},{"n":8,"tag":null,"en":"2. Listen actively.","ko":"2. 적극적으로 들어라.","ok":true,"foot":[],"fixes":[]},{"n":9,"tag":null,"en":"Don't just sit still and listen. Active listen.","ko":"그저 가만히 앉아서 듣지 마라. 적극적으로 들어라.","ok":false,"foot":[],"fixes":[{"wrong":"Active","right":"Actively","partial":false,"at":[6],"point":"형용사와 부사: 동사 listen을 꾸밀 때는 부사 Actively 사용","topic":"형용사와 부사","memo":"동사 listen을 꾸밀 때는 부사 Actively 사용"}]},{"n":10,"tag":null,"en":"Make eyes contact with the speaker. Nod you head from time to time.","ko":"화자와 눈을 맞춰라. 때때로 당신의 고개를 끄덕여라.","ok":false,"foot":[],"fixes":[{"wrong":"eyes","right":"eye","partial":false,"at":[1],"point":"명사의 복수형: 명사를 꾸미는 eye는 단수형 사용 (eye contact)","topic":"명사의 복수형","memo":"명사를 꾸미는 eye는 단수형 사용 (eye contact)"},{"wrong":"you","right":"your","partial":false,"at":[7],"point":"인칭대명사의 격: 명사 앞 소유격 your 사용","topic":"인칭대명사의 격","memo":"명사 앞 소유격 your 사용"}]},{"n":11,"tag":null,"en":"You can also say, \"Right,\" or \"I see.\" These things will shows that you're really listening.","ko":"당신은 또한 \"맞아.\" 또는 \"그렇구나.\"라고 말할 수 있다. 이러한 것들은 당신이 정말로 듣고 있다는 것을 보여줄 것이다.","ok":false,"foot":[],"fixes":[{"wrong":"shows","right":"show","partial":false,"at":[11],"point":"조동사: 조동사 will 뒤에는 동사원형: show (shows 아님)","topic":"조동사","memo":"조동사 will 뒤에는 동사원형: show (shows 아님)"}]},{"n":12,"tag":null,"en":"3. Use body language.","ko":"3. 몸짓 언어를 사용해라.","ok":true,"foot":[],"fixes":[]},{"n":13,"tag":null,"en":"Use good gestures. When you say, \"I don't know,\" you can raising your shoulders and hands.","ko":"적절한 몸짓을 사용해라. 당신이 \"나는 모르겠어.\"라고 말할 때, 당신의 어깨와 손을 들어 올릴 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"raising","right":"raise","partial":false,"at":[11],"point":"조동사 뒤 동사원형: can 뒤에는 동사원형 raise 사용","topic":"조동사 뒤 동사원형","memo":"can 뒤에는 동사원형 raise 사용"}]},{"n":14,"tag":null,"en":"You can also makes facial expressions. Lift your eyebrows or stick out your lower lip.","ko":"당신은 또한 얼굴 표정을 지을 수 있다. 눈썹을 올리거나 아랫입술을 내밀어라.","ok":false,"foot":[],"fixes":[{"wrong":"makes","right":"make","partial":false,"at":[3],"point":"조동사: 조동사 can 뒤에는 동사원형: make (makes 아님)","topic":"조동사","memo":"조동사 can 뒤에는 동사원형: make (makes 아님)"}]},{"n":15,"tag":null,"en":"Use good body language, and your message will be more stronger and clearer.","ko":"적절한 몸짓 언어를 사용해라, 그러면 당신의 메시지가 더 강력하고 더 명확해질 것이다.","ok":false,"foot":[],"fixes":[{"wrong":"more stronger","right":"stronger","partial":false,"at":[9],"point":"비교급: stronger 앞에 more 중복 불가","topic":"비교급","memo":"stronger 앞에 more 중복 불가"}]},{"n":16,"tag":null,"en":"4. Share your story.","ko":"4. 당신의 이야기를 공유해라.","ok":true,"foot":[],"fixes":[]},{"n":17,"tag":null,"en":"Be brave and tell you personal story. For example, you can talk at your childhood.","ko":"용기를 내어 당신의 개인적인 이야기를 말해라. 예를 들면, 당신은 어린 시절에 관해 말할 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[4],"point":"인칭대명사의 격: 명사 앞 소유격 your 사용","topic":"인칭대명사의 격","memo":"명사 앞 소유격 your 사용"},{"wrong":"at","right":"about","partial":false,"at":[12],"point":"기본전치사: '~에 대해 말하다'는 talk about 사용","topic":"기본전치사","memo":"'~에 대해 말하다'는 talk about 사용"}]},{"n":18,"tag":null,"en":"You can say, \"When I was 10, I was the most slow runner on my class.\" When you open up, the other person will does the same.","ko":"당신은 \"내가 10살이었을 때, 나는 반에서 달리기가 가장 느린 주자였어.\"라고 말할 수 있다. 당신이 마음을 열 때, 상대방도 똑같이 할 것이다.","ok":false,"foot":[],"fixes":[{"wrong":"most slow","right":"slowest","partial":false,"at":[10],"point":"최상급: slow의 최상급은 the slowest","topic":"최상급","memo":"slow의 최상급은 the slowest"},{"wrong":"on","right":"in","partial":false,"at":[13],"point":"기본전치사: '학급에서'는 전치사 in 사용","topic":"기본전치사","memo":"'학급에서'는 전치사 in 사용"},{"wrong":"does","right":"do","partial":false,"at":[24],"point":"조동사: 조동사 will 뒤에는 동사원형: do (does 아님)","topic":"조동사","memo":"조동사 will 뒤에는 동사원형: do (does 아님)"}]},{"n":19,"tag":null,"en":"This can lead to an more meaningful conversation.","ko":"이것은 더 의미 있는 대화로 이어질 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[4],"point":"관사 a/an: 자음 소리 more 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 more 앞에는 a 사용"}]}];var PP=[["The new school year is here!","새 학년이 되었다!",1],["Do you get nervous when you talk to other students?","당신은 다른 학생들과 대화할 때 긴장되는가?",0],["Do you have trouble starting conversations?","당신은 대화를 시작하는 데 어려움이 있는가?",0],["Having a good conversation is not easy.","대화를 잘하는 것은 쉽지 않다.",0],["But don't worry.","하지만 걱정하지 마라.",0],["Here are some tips to have a good conversation.","여기 좋은 대화를 나누기 위한 몇 가지 조언이 있다.",0],["1. Start with small talk.","1. 가벼운 대화로 시작해라.",1],["Begin conversations with an easy topic.","쉬운 주제로 대화를 시작해라.",1],["Talk about the weather or hobbies.","날씨나 취미에 관해 말해라.",0],["For example, say, \"The weather is so nice today, isn't it?\"","예를 들면, \"오늘 날씨가 아주 좋아, 그렇지 않니?\"라고 말해라.",0],["Then the other person can answer easily.","그러면 상대방은 쉽게 대답할 수 있다.",0],["Small talk can lead to other fun topics to talk about.","가벼운 대화는 대화할 다른 재미있는 주제로 이어질 수 있다.",0],["2. Listen actively.","2. 적극적으로 들어라.",1],["Don't just sit still and listen.","그저 가만히 앉아서 듣지 마라.",1],["Actively listen.","적극적으로 들어라.",0],["Make eye contact with the speaker.","화자와 눈을 맞춰라.",0],["Nod your head from time to time.","때때로 당신의 고개를 끄덕여라.",0],["You can also say, \"Right,\" or \"I see.\"","당신은 또한 \"맞아.\" 또는 \"그렇구나.\"라고 말할 수 있다.",0],["These things will show that you're really listening.","이러한 것들은 당신이 정말로 듣고 있다는 것을 보여줄 것이다.",0],["3. Use body language.","3. 몸짓 언어를 사용해라.",1],["Use good gestures.","적절한 몸짓을 사용해라.",1],["When you say, \"I don't know,\" you can raise your shoulders and hands.","당신이 \"나는 모르겠어.\"라고 말할 때, 당신의 어깨와 손을 들어 올릴 수 있다.",0],["You can also make facial expressions.","당신은 또한 얼굴 표정을 지을 수 있다.",0],["Lift your eyebrows or stick out your lower lip.","눈썹을 올리거나 아랫입술을 내밀어라.",0],["Use good body language, and your message will be stronger and clearer.","적절한 몸짓 언어를 사용해라, 그러면 당신의 메시지가 더 강력하고 더 명확해질 것이다.",0],["4. Share your story.","4. 당신의 이야기를 공유해라.",1],["Be brave and tell your personal story.","용기를 내어 당신의 개인적인 이야기를 말해라.",1],["For example, you can talk about your childhood.","예를 들면, 당신은 어린 시절에 관해 말할 수 있다.",0],["You can say, \"When I was 10, I was the slowest runner in my class.\"","당신은 \"내가 10살이었을 때, 나는 반에서 달리기가 가장 느린 주자였어.\"라고 말할 수 있다.",0],["When you open up, the other person will do the same.","당신이 마음을 열 때, 상대방도 똑같이 할 것이다.",0],["This can lead to a more meaningful conversation.","이것은 더 의미 있는 대화로 이어질 수 있다.",0]];var RNUM=5;var TITLE_EN="Have a Good Talk!";var PASS_EN=["Have a Good Talk!","The new school year is here! Do you get nervous when you talk to other students? Do you have trouble starting conversations? Having a good conversation is not easy. But don't worry. Here are some tips to have a good conversation.","1. Start with small talk.","Begin conversations with an easy topic. Talk about the weather or hobbies. For example, say, \"The weather is so nice today, isn't it?\" Then the other person can answer easily. Small talk can lead to other fun topics to talk about.","2. Listen actively.","Don't just sit still and listen. Actively listen. Make eye contact with the speaker. Nod your head from time to time. You can also say, \"Right,\" or \"I see.\" These things will show that you're really listening.","3. Use body language.","Use good gestures. When you say, \"I don't know,\" you can raise your shoulders and hands. You can also make facial expressions. Lift your eyebrows or stick out your lower lip. Use good body language, and your message will be stronger and clearer.","4. Share your story.","Be brave and tell your personal story. For example, you can talk about your childhood. You can say, \"When I was 10, I was the slowest runner in my class.\" When you open up, the other person will do the same. This can lead to a more meaningful conversation."];var PASS_KO=["좋은 대화를 나눠라!","새 학년이 되었다! 당신은 다른 학생들과 대화할 때 긴장되는가? 당신은 대화를 시작하는 데 어려움이 있는가? 대화를 잘하는 것은 쉽지 않다. 하지만 걱정하지 마라. 여기 좋은 대화를 나누기 위한 몇 가지 조언이 있다.","1. 가벼운 대화로 시작해라.","쉬운 주제로 대화를 시작해라. 날씨나 취미에 관해 말해라. 예를 들면, \"오늘 날씨가 아주 좋아, 그렇지 않니?\"라고 말해라. 그러면 상대방은 쉽게 대답할 수 있다. 가벼운 대화는 대화할 다른 재미있는 주제로 이어질 수 있다.","2. 적극적으로 들어라.","그저 가만히 앉아서 듣지 마라. 적극적으로 들어라. 화자와 눈을 맞춰라. 때때로 당신의 고개를 끄덕여라. 당신은 또한 \"맞아.\" 또는 \"그렇구나.\"라고 말할 수 있다. 이러한 것들은 당신이 정말로 듣고 있다는 것을 보여줄 것이다.","3. 몸짓 언어를 사용해라.","적절한 몸짓을 사용해라. 당신이 \"나는 모르겠어.\"라고 말할 때, 당신의 어깨와 손을 들어 올릴 수 있다. 당신은 또한 얼굴 표정을 지을 수 있다. 눈썹을 올리거나 아랫입술을 내밀어라. 적절한 몸짓 언어를 사용해라, 그러면 당신의 메시지가 더 강력하고 더 명확해질 것이다.","4. 당신의 이야기를 공유해라.","용기를 내어 당신의 개인적인 이야기를 말해라. 예를 들면, 당신은 어린 시절에 관해 말할 수 있다. 당신은 \"내가 10살이었을 때, 나는 반에서 달리기가 가장 느린 주자였어.\"라고 말할 수 있다. 당신이 마음을 열 때, 상대방도 똑같이 할 것이다. 이것은 더 의미 있는 대화로 이어질 수 있다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["cute animals","favorite class events","favorite designs of socks","ways to make new friends","worry about a new school year"],"a":1,"ans":"favorite class events","evs":[["You're right. Which activity do you like best?","맞아. 너는 어떤 활동이 가장 좋아?"],["I like “Manito” best. It's a good way to get closer with new classmates. How about you?","나는 '마니또'가 가장 좋아. 새로운 반 친구들과 더 가까워지는 좋은 방법이야. 너는 어때?"],["My favorite activity is “Funny Socks Day.”","내가 가장 좋아하는 활동은 '웃긴 양말의 날'이야."]],"ev":["You're right. Which activity do you like best?","맞아. 너는 어떤 활동이 가장 좋아?"],"ow":["오답 ✕ — 귀여운 동물 양말이 나오기는 하지만('Let's wear cute animal socks.') 동물 자체가 대화의 주제는 아니에요. 양말 이야기는 활동 하나에 속한 내용일 뿐이에요.","정답 ○ — 'Which activity do you like best?'(어떤 활동이 가장 좋아?)라는 질문에 Jake는 “Manito”, Hana는 “Funny Socks Day”라고 답했어요. 학급 행사 중 가장 좋아하는 것이 주제예요.","오답 ✕ — 'Let's wear cute animal socks.'(귀여운 동물 양말을 신자)가 나오지만 양말 디자인을 비교하는 대화가 아니에요. 너무 좁은 보기예요.","오답 ✕ — 'It's a good way to get closer with new classmates.'(새로운 반 친구들과 가까워지는 좋은 방법이야)라는 말은 마니또 활동 설명의 일부일 뿐, 친구 사귀는 방법이 대화의 중심은 아니에요.","오답 ✕ — 'Wow! She planned so many activities for us!'(선생님이 많은 활동을 계획하셨네!)라며 신나 하는 대화예요. 새 학년에 대한 걱정은 나오지 않아요."],"memo":["정답: ② favorite class events (가장 좋아하는 학급 행사)","근거: Which a a great idea.","좋은 생각이야."]],"ev":["I like chess because it's very challenging.","나는 체스가 아주 도전적이어서 좋아해."],"ow":["정답 ○ — Surin은 'I like chess because it's very challenging.'(체스가 아주 도전적이어서 좋아해)라고 했어요. (A)는 chess, (B)는 challenging이에요.","오답 ✕ — (A) chess는 맞지만, 체스가 'very challenging'(아주 도전적이다)이라고 했어요. 지루하다(boring)는 말은 없어서 (B)가 틀려요.","오답 ✕ — (B) challenging은 맞지만, 가장 좋아하는 게임은 'I like chess'(체스를 좋아해)예요. 카드(cards)는 나오지 않아서 (A)가 틀려요.","오답 ✕ — (A) chess는 맞아요. 하지만 'very challenging'(아주 도전적이다)과 easy(쉬운)는 반대 느낌이라 (B)가 틀려요.","오답 ✕ — 카드 게임은 나오지 않고, 쉽다는 말도 없어서 (A), (B) 모두 틀려요."],"memo":["정답: ① chess - challenging (체스, 아주 도전적이라서)","근거: I like chess because it's very challenging.(체스가 아주 도전적이어서 좋아해.)","함정: challenging은 '쉬운'이 아니라 '어렵지만 해볼 만한'이라는 뜻이야"],"why":"Surin은 도전적인 체스를 가장 좋아한다.","sum":"Surin likes (A)________ best because it is very (B)________, and she will play it with the boy after school.","lab":"완성된 요약문 : "}],"dlg":[["B","What do you usually do in your free time, Surin?","Surin, 너는 보통 자유 시간에 뭘 하니?"],["G","I play board games with my friends.","나는 친구들과 보드게임을 해."],["B","Which board game do you like best?","어떤 보드게임을 가장 좋아해?"],["G","I like chess because it's very challenging.","나는 체스가 아주 도전적이어서 좋아해."],["B","Me, too. Why don't we play chess together after school?","나도 그래. 방과 후에 같이 체스를 두는 게 어때?"],["G","That's a great idea.","좋은 생각이야."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["nervous - tips","excited - jokes","nervous - rules","bored - tips","angry - lessons"],"a":0,"ans":"nervous - tips","evs":[["Do you get nervous when you talk to other students?","당신은 다른 학생들과 대화할 때 긴장되는가?"],["Here are some tips to have a good conversation.","여기 좋은 대화를 나누기 위한 몇 가지 조언이 있다."]],"ev":["Do you get nervous when you talk to other students?","당신은 다른 학생들과 대화할 때 긴장되는가?"],"ow":["정답 ○ — 'Do you get nervous when you talk to other students?'(다른 학생들과 대화할 때 긴장되는가?)와 'Here are some tips to have a good conversation.'(좋은 대화를 나누기 위한 조언이 있다)에 따라 (A)는 nervous, (B)는 tips예요.","오답 ✕ — 본문은 'Do you get nervous'(긴장되는가?)라고 물어요. excited(신난)가 아니고, jokes(농담)에 대한 말도 없어서 둘 다 틀려요.","오답 ✕ — (A) nervous는 맞아요. 하지만 'Here are some tips'(몇 가지 조언이 있다)라고 했어요. 규칙(rules)이라는 말은 없어서 (B)가 틀려요.","오답 ✕ — (B) tips는 맞지만, 'Do you get nervous'(긴장되는가?)라고 했으므로 bored(지루한)는 (A)가 틀려요.","오답 ✕ — 학생들이 화가 난다(angry)는 말은 없고, 'tips'를 lessons로 바꾼 것도 틀려서 둘 다 틀려요."],"memo":["정답: ① nervous - tips (긴장됨, 조언)","근거: Do you get nervous when you talk to other students? / Here are some tips...(긴장되는가? / 몇 가지 조언이 있다.)","함정: tips(조언)와 rules(규칙)는 달라서 ③은 ✕"],"why":"대화할 때 긴장하는 학생들에게 좋은 대화를 위한 조언을 알려 주는 글이다.","sum":"Many students get (A)________ when they talk to other students, so this passage gives some (B)________ for a good conversation.","lab":"완성된 요약문 : "}],"pp":[["The new school year is here!","새 학년이 되었다!"],["Do you get nervous when you talk to other students?","당신은 다른 학생들과 대화할 때 긴장되는가?"],["Do you have trouble starting conversations?","당신은 대화를 시작하는 데 어려움이 있는가?"],["Having a good conversation is not easy.","대화를 잘하는 것은 쉽지 않다."],["But don't worry.","하지만 걱정하지 마라."],["Here are some tips to have a good conversation.","여기 좋은 대화를 나누기 위한 몇 가지 조언이 있다."]]},{"qs":[{"n":7,"q":"다음 글의 제목으로 알맞은 것은?","o":["Easy Topics Can't Last","Who Are You Talking with?","What does 'Small Talk' Mean?","Are You Looking for Fun Topics?","What Makes a Good Conversation Start?"],"a":4,"ans":"What Makes a Good Conversation Start?","evs":[["Begin conversations with an easy topic.","쉬운 주제로 대화를 시작해라."],["Talk about the weather or hobbies.","날씨나 취미에 관해 말해라."],["Small talk can lead to other fun topics to talk about.","가벼운 대화는 대화할 다른 재미있는 주제로 이어질 수 있다."]],"ev":["Begin conversations with an easy topic.","쉬운 주제로 대화를 시작해라."],"ow":["오답 ✕ — 'Small talk can lead to other fun topics'(가벼운 대화는 다른 재미있는 주제로 이어질 수 있다)라고 했으니 쉬운 주제가 오래 못 간다는 글이 아니에요.","오답 ✕ — 누구와 대화하는지에 대한 내용은 없어요. 'Begin conversations with an easy topic.'(쉬운 주제로 대화를 시작해라)처럼 시작하는 방법이 중심이에요.","오답 ✕ — 'small talk'가 나오지만 그 뜻을 정의하는 글이 아니에요. 어떻게 쓰는지(쉬운 주제로 시작하기)를 설명해요.","오답 ✕ — 'fun topics'(재미있는 주제)는 가벼운 대화에서 이어지는 결과일 뿐이고, 재미있는 주제를 찾는 방법을 말하는 글은 아니에요.","정답 ○ — 'Begin conversations with an easy topic.'(쉬운 주제로 대화를 시작해라)와 'Talk about the weather or hobbies.'(날씨나 취미에 관해 말해라)처럼 대화를 어떻게 시작하면 좋은지 알려 주는 글이므로 제목으로 알맞아요."],"memo":["정답: ⑤ What Makes a Good Conversation Start? (좋은 대화 시작의 조건)","근거: Begin conversations with an easy topic.(쉬운 주제로 대화를 시작해라.)","함정: ③ small talk의 뜻을 설명하는 글이 아니라서 ✕"],"why":"쉬운 주제로 대화를 시작하는 방법을 알려 주는 글이다."},{"n":8,"q":"윗글의 내용과 일치하지 않는 것은?","o":["The weather or hobbies can be a good topic.","Beginning conversations with small talk is good.","We can start with small talk and go to other topics.","We should actively listen to speakers.","We shouldn't move our head when we are listening."],"a":4,"ans":"We shouldn't move our head when we are listening.","evs":[["Actively listen.","적극적으로 들어라."],["Nod your head from time to time.","때때로 당신의 고개를 끄덕여라."]],"ev":["Actively listen.","적극적으로 들어라."],"ow":["오답 ✕ — 'Talk about the weather or hobbies.'(날씨나 취미에 관해 말해라)라고 했으므로 날씨나 취미는 좋은 주제가 될 수 있어요.","오답 ✕ — 'Begin conversations with an easy topic.'(쉬운 주제로 대화를 시작해라)라고 했으니 가벼운 대화로 시작하는 것은 좋다는 설명이 맞아요.","오답 ✕ — 'Small talk can lead to other fun topics to talk about.'(가벼운 대화는 다른 재미있는 주제로 이어질 수 있다)라고 했으므로 일치해요.","오답 ✕ — 'Don't just sit still and listen. Actively listen.'(그저 가만히 앉아서 듣지 말고 적극적으로 들어라)라고 했으므로 적극적으로 들어야 한다는 말은 맞아요.","정답 ○ — 본문은 'Nod your head from time to time.'(때때로 고개를 끄덕여라)라고 했어요. 들을 때 고개를 움직이지 말라는 이 보기는 반대라서 일치하지 않아요."],"memo":["정답: ⑤ 들을 때 고개를 움직이지 말아야 한다는 말은 ✕","근거: Nod your head from time to time.(때때로 고개를 끄덕여라.)","함정: nod는 '고개를 끄덕이다'라서 움직이라는 뜻이야"],"why":"들을 때는 고개를 끄덕이라고 했으므로 고개를 움직이지 말라는 말은 틀리다."}],"pp":[["1. Start with small talk.","1. 가벼운 대화로 시작해라."],["Begin conversations with an easy topic.","쉬운 주제로 대화를 시작해라."],["Talk about the weather or hobbies.","날씨나 취미에 관해 말해라."],["For example, say, \"The weather is so nice today, isn't it?\"","예를 들면, \"오늘 날씨가 아주 좋아, 그렇지 않니?\"라고 말해라."],["Then the other person can answer easily.","그러면 상대방은 쉽게 대답할 수 있다."],["Small talk can lead to other fun topics to talk about.","가벼운 대화는 대화할 다른 재미있는 주제로 이어질 수 있다."],["2. Listen actively.","2. 적극적으로 들어라."],["Don't just sit still and listen.","그저 가만히 앉아서 듣지 마라."],["Actively listen.","적극적으로 들어라."],["Make eye contact with the speaker.","화자와 눈을 맞춰라."],["Nod your head from time to time.","때때로 당신의 고개를 끄덕여라."],["You can also say, \"Right,\" or \"I see.\"","당신은 또한 \"맞아.\" 또는 \"그렇구나.\"라고 말할 수 있다."],["These things will show that you're really listening.","이러한 것들은 당신이 정말로 듣고 있다는 것을 보여줄 것이다."]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하지 않는 것은?","o":["어깨와 손을 올려서 당신이 이해했음을 드러낼 수 있다.","대화에서 얼굴 표정을 사용할 수 있다.","용기를 내어 당신의 개인적인 이야기를 말할 수 있다.","개인적 이야기로 어린 시절에 대해 말할 수 있다.","개인적인 이야기를 하는 것은 긍정적 효과가 있다."],"a":0,"ans":"어깨와 손을 올려서 당신이 이해했음을 드러낼 수 있다.","evs":[["When you say, \"I don't know,\" you can raise your shoulders and hands.","당신이 \"나는 모르겠어.\"라고 말할 때, 당신의 어깨와 손을 들어 올릴 수 있다."],["You can also make facial expressions.","당신은 또한 얼굴 표정을 지을 수 있다."],["Be brave and tell your personal story.","용기를 내어 당신의 개인적인 이야기를 말해라."]],"ev":["When you say, \"I don't know,\" you can raise your shoulders and hands.","당신이 \"나는 모르겠어.\"라고 말할 때, 당신의 어깨와 손을 들어 올릴 수 있다."],"ow":["정답 ○ — 본문은 'When you say, “I don't know,” you can raise your shoulders and hands.'(“나는 모르겠어”라고 말할 때 어깨와 손을 들어 올릴 수 있다)라고 했어요. 이해했음이 아니라 모른다는 뜻이므로 일치하지 않아요.","오답 ✕ — 'You can also make facial expressions.'(얼굴 표정도 지을 수 있다)라고 했으므로 일치해요.","오답 ✕ — 'Be brave and tell your personal story.'(용기를 내어 개인적인 이야기를 말해라)라고 했으므로 일치해요.","오답 ✕ — 'you can talk about your childhood'(어린 시절에 관해 말할 수 있다)라고 했으므로 일치해요.","오답 ✕ — 'This can lead to a more meaningful conversation.'(이것은 더 의미 있는 대화로 이어질 수 있다)라고 했으니 좋은 효과가 있다는 말은 맞아요."],"memo":["정답: ① 어깨와 손을 올리는 것은 '이해함'이 아니라 '모르겠어'를 나타냄","근거: When you say, “I don't know,” you can raise your shoulders and hands.(“나는 모르겠어”라고 말할 때 어깨와 손을 들어 올릴 수 있다.)","함정: ⑤ more meaningful conversation(더 의미 있는 대화)은 좋은 효과라서 ○"],"why":"어깨와 손을 올리는 동작은 '모르겠어'라는 뜻을 나타낸다."},{"n":10,"q":"윗글의 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["do the same - meaningful","do the same - boring","stay quiet - meaningful","leave quickly - boring","get angry - meaningful"],"a":0,"ans":"do the same - meaningful","evs":[["When you open up, the other person will do the same.","당신이 마음을 열 때, 상대방도 똑같이 할 것이다."],["This can lead to a more meaningful conversation.","이것은 더 의미 있는 대화로 이어질 수 있다."]],"ev":["When you open up, the other person will do the same.","당신이 마음을 열 때, 상대방도 똑같이 할 것이다."],"ow":["정답 ○ — 'When you open up, the other person will do the same.'(당신이 마음을 열 때 상대방도 똑같이 할 것이다)와 'This can lead to a more meaningful conversation.'(더 의미 있는 대화로 이어질 수 있다)에 따라 (A)는 do the same, (B)는 meaningful이에요.","오답 ✕ — (A) do the same은 맞아요. 하지만 'a more meaningful conversation'(더 의미 있는 대화)이라고 했으므로 boring(지루한)은 (B)가 틀려요.","오답 ✕ — (B) meaningful은 맞지만, 'the other person will do the same'(상대방도 똑같이 마음을 연다)이라고 했어요. 조용히 있는다(stay quiet)는 (A)가 틀려요.","오답 ✕ — 상대방이 빨리 떠난다는 말은 없고, 대화도 지루해지지 않고 오히려 의미 있어져요. (A), (B) 모두 틀려요.","오답 ✕ — (B) meaningful은 맞지만, 상대방이 화를 낸다는 말은 없고 'do the same'이라고 했어요. (A)가 틀려요."],"memo":["정답: ① do the same - meaningful (똑같이 마음을 엶, 의미 있는 대화)","근거: When you open up, the other person will do the same. This can lead to a more meaningful conversation.","함정: open up은 '마음을 열다'라는 뜻이야"],"why":"내가 마음을 열면 상대도 마음을 열어 더 의미 있는 대화가 된다.","sum":"If you open up and share your personal story, the other person will (A)________, and the conversation can become more (B)________.","lab":"완성된 요약문 : "}],"pp":[["3. Use body language.","3. 몸짓 언어를 사용해라."],["Use good gestures.","적절한 몸짓을 사용해라."],["When you say, \"I don't know,\" you can raise your shoulders and hands.","당신이 \"나는 모르겠어.\"라고 말할 때, 당신의 어깨와 손을 들어 올릴 수 있다."],["You can also make facial expressions.","당신은 또한 얼굴 표정을 지을 수 있다."],["Lift your eyebrows or stick out your lower lip.","눈썹을 올리거나 아랫입술을 내밀어라."],["Use good body language, and your message will be stronger and clearer.","적절한 몸짓 언어를 사용해라, 그러면 당신의 메시지가 더 강력하고 더 명확해질 것이다."],["4. Share your story.","4. 당신의 이야기를 공유해라."],["Be brave and tell your personal story.","용기를 내어 당신의 개인적인 이야기를 말해라."],["For example, you can talk about your childhood.","예를 들면, 당신은 어린 시절에 관해 말할 수 있다."],["You can say, \"When I was 10, I was the slowest runner in my class.\"","당신은 \"내가 10살이었을 때, 나는 반에서 달리기가 가장 느린 주자였어.\"라고 말할 수 있다."],["When you open up, the other person will do the same.","당신이 마음을 열 때, 상대방도 똑같이 할 것이다."],["This can lead to a more meaningful conversation.","이것은 더 의미 있는 대화로 이어질 수 있다."]]}];

function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){

function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}

function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';

 toks.forEach(function(t,ti){

  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}

function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}

function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
