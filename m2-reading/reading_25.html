<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}

.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Is you good at hide and seek? Some animals which lives in the wild are very good at camouflage.","ko":"당신은 숨바꼭질을 잘하는가? 야생에서 사는 몇몇 동물들은 위장을 매우 잘한다.","ok":false,"foot":[],"fixes":[{"wrong":"Is","right":"Are","partial":false,"at":[0],"point":"be동사의 의문문: 주어 you에는 Are: Are (Is 아님)","topic":"be동사의 의문문","memo":"주어 you에는 Are: Are (Is 아님)"},{"wrong":"lives","right":"live","partial":false,"at":[10],"point":"관계절 동사 수일치: 선행사 animals(복수)이므로 live (lives 아님)","topic":"관계절 동사 수일치","memo":"선행사 animals(복수)이므로 live (lives 아님)"}]},{"n":2,"tag":null,"en":"You can see them in the air, on land, and in the sea. Their special looks or abilities keeps them safe from predators.","ko":"당신은 그들을 하늘에서, 땅에서, 그리고 바다에서 볼 수 있다. 그들의 특별한 생김새나 능력은 그들을 포식 동물로부터 안전하게 지킨다.","ok":false,"foot":[],"fixes":[{"wrong":"keeps","right":"keep","partial":false,"at":[18],"point":"일반동사 수일치: 주어 looks or abilities(복수)는 keep (keeps 아님)","topic":"일반동사 수일치","memo":"주어 looks or abilities(복수)는 keep (keeps 아님)"}]},{"n":3,"tag":null,"en":"Let me guide you through the world of animal camouflage.","ko":"내가 당신을 동물 위장의 세계로 안내하겠다.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":"고산토끼","en":"Mountain hares are like rabbits, but they are more big and have longer leg. They are very stylish animals.","ko":"고산토끼는 토끼와 비슷하지만, 그들은 (몸이) 더 크고 더 긴 다리를 가지고 있다. 그들은 매우 멋진 동물이다.","ok":false,"foot":[],"fixes":[{"wrong":"more big","right":"bigger","partial":false,"at":[8],"point":"비교급: 짧은 형용사 big은 bigger로 비교급 만듦","topic":"비교급","memo":"짧은 형용사 big은 bigger로 비교급 만듦"},{"wrong":"leg","right":"legs","partial":false,"at":[13],"point":"명사의 복수형: 다리는 여러 개이므로 복수 legs 사용","topic":"명사의 복수형","memo":"다리는 여러 개이므로 복수 legs 사용"}]},{"n":5,"tag":null,"en":"Mountain hares change colors according for season. In summer, they turn gray-brown to match the rocks and grass.","ko":"고산토끼는 계절에 따라 색을 바꾼다. 여름에, 그들은 바위와 풀에 맞추기 위해 회갈색으로 변한다.","ok":false,"foot":[],"fixes":[{"wrong":"for","right":"to","partial":false,"at":[5],"point":"숙어 표현: \"~에 따라\"는 according to 사용","topic":"숙어 표현","memo":"\"~에 따라\"는 according to 사용"}]},{"n":6,"tag":null,"en":"In winter, they turn white to camouflage themself in the snow.","ko":"겨울에, 그들은 자신들을 눈 속에 위장하기 위해 흰색으로 변한다.","ok":false,"foot":[],"fixes":[{"wrong":"themself","right":"themselves","partial":false,"at":[7],"point":"재귀대명사: 주어 they의 재귀대명사는 themselves 사용","topic":"재귀대명사","memo":"주어 they의 재귀대명사는 themselves 사용"}]},{"n":7,"tag":null,"en":"Changing colors makes them nearly invisibly to predators like wild dogs and eagles.","ko":"색을 바꾸는 것은 그들을 들개와 독수리 같은 포식 동물들에게 거의 보이지 않게 만든다.","ok":false,"foot":[],"fixes":[{"wrong":"invisibly","right":"invisible","partial":false,"at":[5],"point":"형용사와 부사: makes them 뒤 보어 자리에는 형용사 invisible 사용","topic":"형용사와 부사","memo":"makes them 뒤 보어 자리에는 형용사 invisible 사용"}]},{"n":8,"tag":null,"en":"Did you know?","ko":"알고 있었나요?","ok":true,"foot":[],"fixes":[]},{"n":9,"tag":null,"en":"Mountain hares have really big foots. Thanks to them, mountain hares can hop in deeply snow and escape from predators.","ko":"고산토끼는 정말 큰 발을 가지고 있다. 그것들 덕분에, 고산토끼는 깊은 눈 속에서 깡충깡충 뛰어 포식 동물로부터 도망칠 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"foots","right":"feet","partial":false,"at":[5],"point":"불규칙 복수형: foot의 복수형은 feet","topic":"불규칙 복수형","memo":"foot의 복수형은 feet"},{"wrong":"deeply","right":"deep","partial":false,"at":[14],"point":"형용사와 부사: 명사 snow를 꾸미는 형용사 deep 사용","topic":"형용사와 부사","memo":"명사 snow를 꾸미는 형용사 deep 사용"}]},{"n":10,"tag":"문어","en":"Look closely at a rock under the sea. If it move, it might be an octopus.","ko":"바닷속 바위를 자세히 보아라. 만약 그것이 움직인다면, 그것은 문어일지도 모른다.","ok":false,"foot":[],"fixes":[{"wrong":"move","right":"moves","partial":false,"at":[10],"point":"3인칭 단수 현재형: 주어 it(3인칭 단수)는 동사에 -s: moves (move 아님)","topic":"3인칭 단수 현재형","memo":"주어 it(3인칭 단수)는 동사에 -s: moves (move 아님)"}]},{"n":11,"tag":null,"en":"Octopuses is sea animals with rounded bodies and eight long arms.","ko":"문어는 둥근 몸과 여덟 개의 긴 팔을 가진 해양 동물이다.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":fals 어는 위험을 느낄 때, 그들의 특별한 위장 기술을 사용한다.",0],["Octopuses can change colors and patterns to match their surroundings.","문어는 그들의 주변 환경에 맞추기 위해 색과 무늬를 바꿀 수 있다.",0],["If they're near sea plants, they look like sea plants.","만약 그들이 해초 가까이에 있으면, 그들은 해초처럼 보인다.",0],["If they're near coral reefs, they look like coral reefs.","만약 그들이 산호초 가까이에 있으면, 그들은 산호초처럼 보인다.",0],["They can also stick shells on their bodies to look like a rock.","그들은 또한 바위처럼 보이기 위해 조개껍데기를 그들의 몸에 붙일 수 있다.",0],["This can fool predators completely.","이는 포식 동물을 완전히 속일 수 있다.",0],["Did you know?","알고 있었나요?",1],["Octopuses can spread ink.","문어는 먹물을 퍼뜨릴 수 있다.",1],["It creates a dark cloud that blocks the view of predators.","그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다.",0],["This gives them enough time to escape.","이는 그들에게 도망칠 충분한 시간을 준다.",0]];var RNUM=25;var TITLE_EN="Can You Spot Them?";var PASS_EN=["Can You Spot Them?","Are you good at hide and seek? Some animals which live in the wild are very good at camouflage. You can see them in the air, on land, and in the sea. Their special looks or abilities keep them safe from predators. Let me guide you through the world of animal camouflage.","Mountain Hare","Mountain hares are like rabbits, but they are bigger and have longer legs. They are very stylish animals. Mountain hares change colors according to season. In summer, they turn gray-brown to match the rocks and grass. In winter, they turn white to camouflage themselves in the snow. Changing colors makes them nearly invisible to predators like wild dogs and eagles.","Did you know?","Mountain hares have really big feet. Thanks to them, mountain hares can hop in deep snow and escape from predators.","Octopus","Look closely at a rock under the sea. If it moves, it might be an octopus. Octopuses are sea animals with rounded bodies and eight long arms. When octopuses feel danger, they use their special camouflage skill. Octopuses can change colors and patterns to match their surroundings. If they're near sea plants, they look like sea plants. If they're near coral reefs, they look like coral reefs. They can also stick shells on their bodies to look like a rock. This can fool predators completely.","Did you know?","Octopuses can spread ink. It creates a dark cloud that blocks the view of predators. This gives them enough time to escape."];var PASS_KO=["그들을 발견할 수 있니?","당신은 숨바꼭질을 잘하는가? 야생에서 사는 몇몇 동물들은 위장을 매우 잘한다. 당신은 그들을 하늘에서, 땅에서, 그리고 바다에서 볼 수 있다. 그들의 특별한 생김새나 능력은 그들을 포식 동물로부터 안전하게 지킨다. 내가 당신을 동물 위장의 세계로 안내하겠다.","고산토끼","고산토끼는 토끼와 비슷하지만, 그들은 (몸이) 더 크고 더 긴 다리를 가지고 있다. 그들은 매우 멋진 동물이다. 고산토끼는 계절에 따라 색을 바꾼다. 여름에, 그들은 바위와 풀에 맞추기 위해 회갈색으로 변한다. 겨울에, 그들은 자신들을 눈 속에 위장하기 위해 흰색으로 변한다. 색을 바꾸는 것은 그들을 들개와 독수리 같은 포식 동물들에게 거의 보이지 않게 만든다.","알고 있었나요?","고산토끼는 정말 큰 발을 가지고 있다. 그것들 덕분에, 고산토끼는 깊은 눈 속에서 깡충깡충 뛰어 포식 동물로부터 도망칠 수 있다.","문어","바닷속 바위를 자세히 보아라. 만약 그것이 움직인다면, 그것은 문어일지도 모른다. 문어는 둥근 몸과 여덟 개의 긴 팔을 가진 해양 동물이다. 문어는 위험을 느낄 때, 그들의 특별한 위장 기술을 사용한다. 문어는 그들의 주변 환경에 맞추기 위해 색과 무늬를 바꿀 수 있다. 만약 그들이 해초 가까이에 있으면, 그들은 해초처럼 보인다. 만약 그들이 산호초 가까이에 있으면, 그들은 산호초처럼 보인다. 그들은 또한 바위처럼 보이기 위해 조개껍데기를 그들의 몸에 붙일 수 있다. 이는 포식 동물을 완전히 속일 수 있다.","알고 있었나요?","문어는 먹물을 퍼뜨릴 수 있다. 그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다. 이는 그들에게 도망칠 충분한 시간을 준다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["Somi is short and has straight hair.","Somi is tall and has long curly hair.","Somi is often sick.","Somi does not help her classmates.","Minjin does not know Somi very well."],"a":1,"ans":"Somi is tall and has long curly hair.","evs":[["G: My best friend Somi is tall with long curly hair.","내 가장 친한 친구 소미는 키가 크고 긴 곱슬머리야."],["G: She is very active and nice. She helps everyone in our class.","아주 활발하고 착해. 우리 반 모두를 도와줘."]],"ev":["G: My best friend Somi is tall with long curly hair.","내 가장 친한 친구 소미는 키가 크고 긴 곱슬머리야."],"ow":["오답 ✕ — 'My best friend Somi is tall with long curly hair.'(내 가장 친한 친구 소미는 키가 크고 긴 곱슬머리야.)라고 했는데 이 보기는 키가 작고 곱슬머리가 아니라고 해서 틀림.","정답 ○ — 'My best friend Somi is tall with long curly hair.'(내 가장 친한 친구 소미는 키가 크고 긴 곱슬머리야.)와 그대로 일치한다.","오답 ✕ — 'She is very active and nice.'(아주 활발하고 착해.)라고 했는데 자주 아프다는 말은 없다. 활발하다는 말과도 어긋난다.","오답 ✕ — 'She helps everyone in our class.'(우리 반 모두를 도와줘.)라고 했는데 이 보기는 반 친구들을 돕지 않는다고 해서 틀림.","오답 ✕ — 민진이는 소미가 어떻게 생겼는지, 성격이 어떤지 자세히 말하고 있으므로 소미를 잘 안다. 그래서 틀림."],"memo":["정답 ②: 소미는 키가 크고 긴 곱슬머리이다.","근거: My best friend Somi is tall with long curly hair.(내 가장 친한 친구 소미는 키가 크고 긴 곱슬머리야.)","함정: ④는 반 모두를 도와준다고 했으므로 ✕"],"why":"소미는 키가 크고 긴 곱슬머리에, 활발하고 착한 친구이다."}],"dlg":[["B","Minjin, what does your best friend look like?","민진아, 네 가장 친한 친구는 어떻게 생겼어?"],["G","My best friend Somi is tall with long curly hair.","내 가장 친한 친구 소미는 키가 크고 긴 곱슬머리야."],["B","What is she like?","그 애는 성격이 어때?"],["G","She is very active and nice. She helps everyone in our class.","아주 활발하고 착해. 우리 반 모두를 도와줘."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["The new student is Andy.","Andy is a tall boy.","Andy wears glasses and has curly hair.","Lucy is a drummer of a band.","Lucy will ask Andy to join her band."],"a":3,"ans":"Lucy is a drummer of a band.","evs":[["Lucy: Really? My band is looking for a new drummer.","정말? 우리 밴드가 새 드러머를 찾고 있거든."],["Giho: Why don't you ask him to join your band?","그 애에게 너희 밴드에 들어오라고 해 보는 게 어때?"]],"ev":["Lucy: Really? My band is looking for a new drummer.","정말? 우리 밴드가 새 드러머를 찾고 있거든."],"ow":["오답 ✕ — 'That's Andy. He's the new student in my class.'(저 애가 Andy야. 우리 반에 새로 온 학생이야.)라고 했으므로 일치한다.","오답 ✕ — 'He's the tall boy with curly hair.'(곱슬머리의 키 큰 남자애야.)라고 했으므로 일치한다.","오답 ✕ — 'He's the tall boy with curly hair. He is wearing glasses.'(곱슬머리의 키 큰 남자애야. 안경을 쓰고 있어.)라고 했으므로 일치한다.","정답 ○ — Lucy는 'My band is looking for a new drummer.'(우리 밴드가 새 드러머를 찾고 있거든.)라고 했다. 이미 드러머인 것이 아니라 드러머를 찾는 중이므로 일치하지 않는다.","오답 ✕ — Giho가 'Why don't you ask him to join your band?'(그 애에게 너희 밴드에 들어오라고 해 보는 게 어때?)라고 하자 Lucy가 'Okay, I will!'(좋아, 그럴게!)이라고 했으므로 일치한다."],"memo":["정답 ④: Lucy는 드러머가 아니라 새 드러머를 찾고 있다.","근거: My band is looking for a new drummer.(우리 밴드가 새 드러머를 찾고 있거든.)","함정: ⑤는 Lucy가 Okay, I will!이라고 답했으므로 맞는 말(○)"],"why":"Lucy의 밴드는 새 드러머를 찾고 있고, Lucy는 Andy에게 가입을 권해 볼 것이다."}],"dlg":[["Giho","Look! That's Andy. He's the new student in my class.","봐! 저 애가 Andy야. 우리 반에 새로 온 학생이야."],["Lucy","Where? What does he look like?","어디? 그 애는 어떻게 생겼어?"],["Giho","He's the tall boy with curly hair. He is wearing glasses.","곱슬머리의 키 큰 남자애야. 안경을 쓰고 있어."],["Lucy","Oh, I see him. He seems nice. What is he like?","아, 보인다. 착해 보이네. 그 애는 성격이 어때?"],["Giho","He is very funny and smart. I heard he also plays the drums well.","아주 재미있고 똑똑해. 드럼도 잘 친다고 들었어."],["Lucy","Really? My band is looking for a new drummer.","정말? 우리 밴드가 새 드러머를 찾고 있거든."],["Giho","Why don't you ask him to join your band?","그 애에게 너희 밴드에 들어오라고 해 보는 게 어때?"],["Lucy","Okay, I will!","좋아, 그럴게!"]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["The girl misses her grandmother.","The girl has not seen her grandmother in a while.","The girl's grandmother has short brown hair.","The girl's grandmother is caring and friendly.","The girl's grandmother never tells stories."],"a":4,"ans":"The girl's grandmother never tells stories.","evs":[["G: She is caring and friendly. She loves to tell fun stories.","자상하고 다정하셔. 재미있는 이야기를 해 주시는 걸 아주 좋아하셔."],["G: She has short brown hair and always wears stylish scarves.","짧은 갈색 머리에 항상 멋진 스카프를 하셔."]],"ev":["G: She is caring and friendly. She loves to tell fun stories.","자상하고 다정하셔. 재미있는 이야기를 해 주시는 걸 아주 좋아하셔."],"ow":["오답 ✕ — 'I miss my grandmother.'(할머니가 보고 싶어.)라고 했으므로 일치한다.","오답 ✕ — 'I haven't seen her in a while.'(한동안 할머니를 못 뵀거든.)라고 했으므로 일치한다.","오답 ✕ — 'She has short brown hair'(짧은 갈색 머리에)라고 했으므로 일치한다.","오답 ✕ — 'She is caring and friendly.'(자상하고 다정하셔.)라고 했으므로 일치한다.","정답 ○ — 'She loves to tell fun stories.'(재미있는 이야기를 해 주시는 걸 아주 좋아하셔.)라고 했는데, 이 보기는 이야기를 전혀 하지 않는다고 해서 일치하지 않는다."],"memo":["정답 ⑤: 할머니는 재미있는 이야기를 해 주시는 걸 아주 좋아하신다.","근거: She loves to tell fun stories.(재미있는 이야기를 해 주시는 걸 아주 좋아하셔.)","함정: ③은 짧은 갈색 머리라고 했으므로 맞는 말(○)"],"why":"할머니는 자상하고 다정하며 재미있는 이야기를 아주 좋아하신다."}],"dlg":[["G","I miss my grandmother. I haven't seen her in a while.","할머니가 보고 싶어. 한동안 할머니를 못 뵀거든."],["B","What does she look like?","할머니는 어떻게 생기셨어?"],["G","She has short brown hair and always wears stylish scarves.","짧은 갈색 머리에 항상 멋진 스카프를 하셔."],["B","What is she like?","성격은 어떠셔?"],["G","She is caring and friendly. She loves to tell fun stories.","자상하고 다정하셔. 재미있는 이야기를 해 주시는 걸 아주 좋아하셔."]]},{"qs":[{"n":4,"q":"위 대화의 주제로 알맞은 것은?","o":["유기견 봉사하기","개를 잘 돌보는 방법","개를 키울 때 어려운 점","내 반려견의 외모와 성격","개에게 좋은 산책 장소 추천"],"a":3,"ans":"내 반려견의 외모와 성격","evs":[["G: What is Max like?","Max는 성격이 어때?"],["G: He sounds cute. What does he look like?","귀엽겠다. 생김새는 어때?"],["B: Really? What is she like?","정말? Sally는 성격이 어때?"]],"ev":["G: What is Max like?","Max는 성격이 어때?"],"ow":["오답 ✕ — 개를 돌보는 봉사 이야기는 없다. 두 사람은 'I heard you got a new dog.'(너 새 강아지 생겼다고 들었어.)라며 각자의 반려견을 소개한다.","오답 ✕ — 개를 돌보는 방법을 알려 주는 대화가 아니다. 'What is Max like?'(Max는 성격이 어때?)처럼 개의 성격과 외모를 묻고 답한다.","오답 ✕ — 개를 키울 때 힘든 점은 언급되지 않는다. 'He sounds cute.'(귀엽겠다.), 'That's lovely.'(사랑스럽다.)처럼 좋은 점만 이야기한다.","정답 ○ — 'What is Max like?'(Max는 성격이 어때?), 'What does he look like?'(생김새는 어때?), 'What is she like?'(Sally는 성격이 어때?)로 반려견의 성격과 외모를 묻고 답하므로 주제로 알맞다.","오답 ✕ — 'Why don't we take our dogs for a walk together?'(우리 개들을 데리고 같이 산책하는 게 어때?)라는 제안이 있지만 산책 장소를 추천하는 대화는 아니다."],"memo":["정답 ④: 내 반려견의 외모와 성격","근거: What is Max like? / What does he look like?(Max는 성격이 어때? / 생김새는 어때?)","함정: ⑤는 같이 산책하자는 말만 있고 장소 추천은 없어서 ✕"],"why":"두 사람이 각자 반려견의 외모와 성격을 이야기하는 대화이다."},{"n":5,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Max is the boy's new dog.","Max is a big dog with white fur.","Sally's fur is white.","Sally is a smart and friendly dog.","The girl and the boy will walk their dogs together."],"a":1,"ans":"Max is a big dog with white fur.","evs":[["B: He is small and has white fur. He has big brown eyes.","몸집이 작고 하얀 털을 가졌어. 눈은 크고 갈색이야."],["G: That's lovely. My dog, Sally, also has white fur.","사랑스럽다. 우리 개 Sally도 하얀 털을 가졌어."]],"ev":["B: He is small and has white fur. He has big brown eyes.","몸집이 작고 하얀 털을 가졌어. 눈은 크고 갈색이야."],"ow":["오답 ✕ — 'Yeah. His name is Max.'(응. 이름은 Max야.)라고 했으므로 Max는 소년의 새 강아지이다. 일치한다.","정답 ○ — 소년이 'He is small and has white fur.'(몸집이 작고 하얀 털을 가졌어.)라고 했는데, 이 보기는 큰 개(a big dog)라고 해서 일치하지 않는다.","오답 ✕ — 'My dog, Sally, also has white fur.'(우리 개 Sally도 하얀 털을 가졌어.)라고 했으므로 일치한다.","오답 ✕ — 'She is smart and friendly.'(똑똑하고 다정해.)라고 했으므로 일치한다.","오답 ✕ — 'Why don't we take our dogs for a walk together?'(우리 개들을 데리고 같이 산책하는 게 어때?)에 'That sounds good.'(좋아.)이라고 답했으므로 일치한다."],"memo":["정답 ②: Max는 큰 개가 아니라 작고 하얀 털을 가진 개이다.","근거: He is small and has white fur.(몸집이 작고 하얀 털을 가졌어.)","함정: ③은 Sally도 하얀 털이라고 했으므로 맞는 말(○)"],"why":"Max는 큰 개가 아니라 몸집이 작은 개이다."}],"dlg":[["G","I heard you got a new dog.","너 새 강아지 생겼다고 들었어."],["B","Yeah. His name is Max.","응. 이름은 Max야."],["G","What is Max like?","Max는 성격이 어때?"],["B","He is active and playful. He loves to run around and play with a ball.","활발하고 장난기가 많아. 뛰어다니면서 공을 가지고 노는 걸 정말 좋아해."],["G","He sounds cute. What does he look like?","귀엽겠다. 생김새는 어때?"],["B","He is small and has white fur. He has big brown eyes.","몸집이 작고 하얀 털을 가졌어. 눈은 크고 갈색이야."],["G","That's lovely. My dog, Sally, also has white fur.","사랑스럽다. 우리 개 Sally도 하얀 털을 가졌어."],["B","Really? What is she like?","정말? Sally는 성격이 어때?"],["G","She is smart and friendly. She always follows me everywhere.","똑똑하고 다정해. 항상 나를 어디든 따라다녀."],["B","Why don't we take our dogs for a walk together?","우리 개들을 데리고 같이 산책하는 게 어때?"],["G","That sounds good. They might become good friends.","좋아. 둘이 좋은 친구가 될지도 몰라."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["Mountain hares are smaller than rabbits and have shorter legs.","Mountain hares never change their colors.","Mountain hares turn white in summer.","Mountain hares turn gray-brown in summer to match the rocks and grass.","Mountain hares have small feet."],"a":3,"ans":"Mountain hares turn gray-brown in summer to match the rocks and grass.","evs":[["In summer, they turn gray-brown to match the rocks and grass.","여름에, 그들은 바위와 풀에 맞추기 위해 회갈색으로 변한다."],["In winter, they turn white to camouflage themselves in the snow.","겨울에, 그들은 자신들을 눈 속에 위장하기 위해 흰색으로 변한다."]],"ev":["In summer, they turn gray-brown to match the rocks and grass.","여름에, 그들은 바위와 풀에 맞추기 위해 회갈색으로 변한다."],"ow":["오답 ✕ — 'Mountain hares are like rabbits, but they are bigger and have longer legs.'(고산토끼는 토끼와 비슷하지만, 더 크고 더 긴 다리를 가지고 있다.)라고 했는데 이 보기는 더 작고 짧은 다리라서 틀림.","오답 ✕ — 'Mountain hares change colors according to season.'(고산토끼는 계절에 따라 색을 바꾼다.)라고 했는데 이 보기는 색을 전혀 바꾸지 않는다고 해서 틀림.","오답 ✕ — 'In winter, they turn white to camouflage themselves in the snow.'(겨울에, 그들은 자신들을 눈 속에 위장하기 위해 흰색으로 변한다.)라고 했으므로 흰색은 겨울이다. 여름이 아니다.","정답 ○ — 'In summer, they turn gray-brown to match the rocks and grass.'(여름에, 그들은 바위와 풀에 맞추기 위해 회갈색으로 변한다.)와 일치한다.","오답 ✕ — 'Mountain hares have really big feet.'(고산토끼는 정말 큰 발을 가지고 있다.)라고 했는데 이 보기는 발이 작다고 해서 틀림."],"memo":["정답 ④: 고산토끼는 여름에 바위와 풀에 맞추어 회갈색으로 변한다.","근거: In summer, they turn gray-brown to match the rocks and grass.(여름에 바위와 풀에 맞추기 위해 회갈색으로 변한다.)","함정: ③은 흰색으로 변하는 때가 여름이 아니라 겨울이라서 ✕"],"why":"고산토끼는 계절에 따라 털색을 바꿔 주변에 맞춘다."},{"n":7,"q":"윗글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["colors - feet","colors - ears","sizes - feet","sounds - legs","shapes - ears"],"a":0,"ans":"colors - feet","evs":[["Mountain hares change colors according to season.","고산토끼는 계절에 따라 색을 바꾼다."],["Thanks to them, mountain hares can hop in deep snow and escape from predators.","그것들 덕분에, 고산토끼는 깊은 눈 속에서 깡충깡충 뛰어 포식 동물로부터 도망칠 수 있다."]],"ev":["Mountain hares change colors according to season.","고산토끼는 계절에 따라 색을 바꾼다."],"ow":["정답 ○ — 'Mountain hares change colors according to season.'(고산토끼는 계절에 따라 색을 바꾼다.)이므로 (A)는 colors이고, 'Mountain hares have really big feet. Thanks to them, mountain hares can hop in deep snow'(고산토끼는 정말 큰 발을 가지고 있다. 그것들 덕분에 깊은 눈 속에서 깡충깡충 뛸 수 있다)이므로 (B)는 feet이다.","오답 ✕ — (A)의 colors는 맞지만 (B)의 ears(귀)는 틀림. 눈 속에서 도망치게 도와주는 것은 'really big feet'(정말 큰 발)이다.","오답 ✕ — (B)의 feet는 맞지만 (A)의 sizes(크기)가 틀림. 고산토끼는 계절에 따라 크기가 아니라 색(colors)을 바꾼다.","오답 ✕ — 계절에 따라 바뀌는 것은 소리(sounds)가 아니라 색이고, 눈 속에서 도움이 되는 것도 다리(legs)가 아니라 발(feet)이라서 둘 다 틀림.","오답 ✕ — 계절에 따라 바뀌는 것은 모양(shapes)이 아니라 색이고, 도움이 되는 것도 귀(ears)가 아니라 발이다. 둘 다 틀림."],"memo":["정답 ①: colors - feet (색 - 발)","근거: Mountain hares change colors according to season.(고산토끼는 계절에 따라 색을 바꾼다.)","함정: 눈 속에서 도망치게 도와주는 것은 귀가 아니라 큰 발이라서 ②는 ✕"],"why":"고산토끼는 계절에 따라 색을 바꾸고 큰 발로 눈 속에서 도망친다.","sum":"Mountain hares change their (A) ______ according to season to hide from predators, and their big (B) ______ help them escape in deep snow.","lab":"완성된 요약문 : "}],"pp":[["Mountain Hare","고산토끼"],["Mountain hares are like rabbits, but they are bigger and have longer legs.","고산토끼는 토끼와 비슷하지만, 그들은 (몸이) 더 크고 더 긴 다리를 가지고 있다."],["They are very stylish animals.","그들은 매우 멋진 동물이다."],["Mountain hares change colors according to season.","고산토끼는 계절에 따라 색을 바꾼다."],["In summer, they turn gray-brown to match the rocks and grass.","여름에, 그들은 바위와 풀에 맞추기 위해 회갈색으로 변한다."],["In winter, they turn white to camouflage themselves in the snow.","겨울에, 그들은 자신들을 눈 속에 위장하기 위해 흰색으로 변한다."],["Changing colors makes them nearly invisible to predators like wild dogs and eagles.","색을 바꾸는 것은 그들을 들개와 독수리 같은 포식 동물들에게 거의 보이지 않게 만든다."],["Did you know?","알고 있었나요?"],["Mountain hares have really big feet.","고산토끼는 정말 큰 발을 가지고 있다."],["Thanks to them, mountain hares can hop in deep snow and escape from predators.","그것들 덕분에, 고산토끼는 깊은 눈 속에서 깡충깡충 뛰어 포식 동물로부터 도망칠 수 있다."]]},{"qs":[{"n":8,"q":"윗글의 내용과 일치하지 않는 것은?","o":["문어는 몸이 둥글다.","문어는 위험할 때 위장 기술을 사용한다.","문어는 주변 환경과 비슷하게 보이게 할 수 있다.","문어는 위험을 느낄 때 조개에 숨는다.","문어는 포식자에게 먹물을 뿜고 도망칠 수 있다."],"a":3,"ans":"문어는 위험을 느낄 때 조개에 숨는다.","evs":[["They can also stick shells on their bodies to look like a rock.","그들은 또한 바위처럼 보이기 위해 조개껍데기를 그들의 몸에 붙일 수 있다."],["When octopuses feel danger, they use their special camouflage skill.","문어는 위험을 느낄 때, 그들의 특별한 위장 기술을 사용한다."]],"ev":["They can also stick shells on their bodies to look like a rock.","그들은 또한 바위처럼 보이기 위해 조개껍데기를 그들의 몸에 붙일 수 있다."],"ow":["오답 ✕ — 'Octopuses are sea animals with rounded bodies and eight long arms.'(문어는 둥근 몸과 여덟 개의 긴 팔을 가진 해양 동물이다.)라고 했으므로 일치한다.","오답 ✕ — 'When octopuses feel danger, they use their special camouflage skill.'(문어는 위험을 느낄 때, 그들의 특별한 위장 기술을 사용한다.)라고 했으므로 일치한다.","오답 ✕ — 'Octopuses can change colors and patterns to match their surroundings.'(문어는 그들의 주변 환경에 맞추기 위해 색과 무늬를 바꿀 수 있다.)라고 했으므로 일치한다.","정답 ○ — 'They can also stick shells on their bodies to look like a rock.'(그들은 또한 바위처럼 보이기 위해 조개껍데기를 그들의 몸에 붙일 수 있다.)라고 했다. 조개껍데기를 몸에 붙이는 것이지 조개 속에 숨는 것이 아니므로 일치하지 않는다.","오답 ✕ — 'Octopuses can spread ink.'(문어는 먹물을 퍼뜨릴 수 있다.)와 'This gives them enough time to escape.'(이는 그들에게 도망칠 충분한 시간을 준다.)라고 했으므로 일치한다."],"memo":["정답 ④: 문어는 조개에 숨는 것이 아니라 조개껍데기를 몸에 붙인다.","근거: They can also stick shells on their bodies to look like a rock.(바위처럼 보이기 위해 조개껍데기를 몸에 붙일 수 있다.)","함정: ⑤는 먹물을 퍼뜨려 도망칠 시간을 번다고 했으므로 맞는 말(○)"],"why":"문어는 조개에 숨는 것이 아니라 조개껍데기를 몸에 붙여 바위처럼 보인다."},{"n":9,"q":"윗글에서 문어의 먹물에 대해 알 수 있는 것은?","o":["It makes the water clean.","It helps octopuses find food.","It creates a dark cloud that blocks the view of predators.","It makes predators fall asleep.","It changes the colors of the octopus's body."],"a":2,"ans":"It creates a dark cloud that blocks the view of predators.","evs":[["It creates a dark cloud that blocks the view of predators.","그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다."],["This gives them enough time to escape.","이는 그들에게 도망칠 충분한 시간을 준다."]],"ev":["It creates a dark cloud that blocks the view of predators.","그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다."],"ow":["오답 ✕ — 'It creates a dark cloud that blocks the view of predators.'(그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다.)라고 했을 뿐 물을 깨끗하게 한다는 말은 없다.","오답 ✕ — 먹물은 먹이를 찾는 데 쓰이지 않는다. 'This gives them enough time to escape.'(이는 그들에게 도망칠 충분한 시간을 준다.)라고 했으므로 도망치기 위한 것이다.","정답 ○ — 'It creates a dark cloud that blocks the view of predators.'(그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다.)와 일치한다.","오답 ✕ — 먹물이 포식자를 잠들게 한다는 말은 없다. 'blocks the view of predators'(포식 동물의 시야를 가린다)라고만 했다.","오답 ✕ — 몸의 색을 바꾸는 것은 'Octopuses can change colors and patterns'(문어는 색과 무늬를 바꿀 수 있다)에서 말한 위장 기술이고, 먹물과는 다른 r surroundings.","문어는 그들의 주변 환경에 맞추기 위해 색과 무늬를 바꿀 수 있다."],["If they're near sea plants, they look like sea plants.","만약 그들이 해초 가까이에 있으면, 그들은 해초처럼 보인다."],["If they're near coral reefs, they look like coral reefs.","만약 그들이 산호초 가까이에 있으면, 그들은 산호초처럼 보인다."],["They can also stick shells on their bodies to look like a rock.","그들은 또한 바위처럼 보이기 위해 조개껍데기를 그들의 몸에 붙일 수 있다."],["This can fool predators completely.","이는 포식 동물을 완전히 속일 수 있다."],["Did you know?","알고 있었나요?"],["Octopuses can spread ink.","문어는 먹물을 퍼뜨릴 수 있다."],["It creates a dark cloud that blocks the view of predators.","그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다."],["This gives them enough time to escape.","이는 그들에게 도망칠 충분한 시간을 준다."]]}];

function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}

function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){

 });

  var tot=0,fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});
var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});

}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
