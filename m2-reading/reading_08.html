<style>

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"Hello, teens from all around the world! What is your favorite thing to do in you free time?","ko":"전 세계의 십 대 여러분, 안녕하세요! 여러분이 여가 시간에 하기 가장 좋아하는 것은 무엇인가요?","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[15],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 your 사용"}]},{"n":2,"tag":null,"en":"Does it makes you happy?","ko":"그것은 여러분을 행복하게 해 주나요?","ok":false,"foot":[],"fixes":[{"wrong":"makes","right":"make","partial":false,"at":[2],"point":"do동사의 의문문: does 뒤 동사원형: make (makes 아님)","topic":"do동사의 의문문","memo":"does 뒤 동사원형: make (makes 아님)"}]},{"n":3,"tag":"Anya · 인도","en":"I love excited dances in Bollywood movies. The powerful moves and rhythms are amazing.","ko":"저는 볼리우드 영화에서의 신나는 춤을 정말 좋아합니다. 힘찬 움직임과 리듬은 대단해요.","ok":false,"foot":[],"fixes":[{"wrong":"excited","right":"exciting","partial":false,"at":[2],"point":"현재분사와 과거분사: dances를 꾸미는 '흥미진진한'은 exciting 사용","topic":"현재분사와 과거분사","memo":"dances를 꾸미는 '흥미진진한'은 exciting 사용"}]},{"n":4,"tag":null,"en":"At first, I copied the dance moves in me room. Now I am taking classes to learn Bollywood dances.","ko":"처음에 저는 제 방에서 그 춤 동작을 따라 했어요. 지금 저는 볼리우드 춤을 배우려고 수업을 받고 있어요.","ok":false,"foot":[],"fixes":[{"wrong":"me","right":"my","partial":false,"at":[8],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 my 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 my 사용"}]},{"n":5,"tag":null,"en":"I love the feeling of moving to the rhythm. It makes I happy.","ko":"저는 리듬에 맞춰 움직이는 느낌을 정말 좋아해요. 그것은 저를 행복하게 만들어줘요.","ok":false,"foot":[],"fixes":[{"wrong":"I","right":"me","partial":false,"at":[11],"point":"인칭대명사의 목적격: 동사 makes의 목적어는 목적격 me 사용","topic":"인칭대명사의 목적격","memo":"동사 makes의 목적어는 목적격 me 사용"}]},{"n":6,"tag":null,"en":"I want to perform in an Bollywood movie someday.","ko":"언젠가 저는 볼리우드 영화에서 공연하고 싶어요.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[5],"point":"관사 a/an: 자음 소리 Bollywood 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 Bollywood 앞에는 a  The powerful moves and rhythms are amazing. At first, I copied the dance moves in my room. Now I am taking classes to learn Bollywood dances. I love the feeling of moving to the rhythm. It makes me happy. I want to perform in a Bollywood movie someday.","Noah from Cairns, Australia","I live near the beach, and I enjoy snorkeling. When I am underwater, I feel like I am in a new world. Every weekend, I put on my mask and dive into the water. When I swim with colorful fish and see beautiful coral reefs, I feel so happy. This year, I am going to start a school project on coral reefs. This will be a great chance to share the beauty of sea life with my classmates.","Hilda from Tromsø, Norway","In my town, we can see the colorful Northern Lights. I can still remember seeing them for the first time. It was amazing! As I often watched the beautiful night sky, I began to enjoy observing stars. It makes me happy. I use star guide apps to find the names of stars in the sky. I also use a telescope to see stars better. Someday, I hope I can discover a new star and name it after myself."];var PASS_KO=["무엇이 여러분을 행복하게 해 주나요?","전 세계의 십 대 여러분, 안녕하세요! 여러분이 여가 시간에 하기 가장 좋아하는 것은 무엇인가요? 그것은 여러분을 행복하게 해 주나요?","인도 뭄바이의 Anya","저는 볼리우드 영화에서의 신나는 춤을 정말 좋아합니다. 힘찬 움직임과 리듬은 대단해요. 처음에 저는 제 방에서 그 춤 동작을 따라 했어요. 지금 저는 볼리우드 춤을 배우려고 수업을 받고 있어요. 저는 리듬에 맞춰 움직이는 느낌을 정말 좋아해요. 그것은 저를 행복하게 만들어줘요. 언젠가 저는 볼리우드 영화에서 공연하고 싶어요.","호주 케언스의 Noah","저는 해변 근처에 살고 스노클링을 즐깁니다. 저는 바닷속에 있으면 새로운 세상에 있는 것처럼 느껴요. 주말마다 저는 마스크를 쓰고 바다로 뛰어들어요. 다채로운 물고기와 수영을 하고 아름다운 산호초를 볼 때 저는 매우 행복합니다. 올해 저는 산호초에 관한 학교 프로젝트를 시작할 거예요. 이것은 해양 생물의 아름다움을 반 친구들과 공유할 수 있는 멋진 기회가 될 거예요.","노르웨이 트롬쇠의 Hilda","우리 마을에서는 화려한 오로라를 볼 수 있어요. 저는 오로라를 처음으로 보았던 것을 아직도 기억할 수 있어요. 그것은 멋졌어요! 아름다운 밤하늘을 자주 보면서 저는 별을 관찰하는 것을 즐기기 시작했죠. 그것은 저를 행복하게 만들어줘요. 저는 하늘의 별 이름을 확인하기 위해 별 가이드 앱을 사용합니다. 저는 또한 별을 더 잘 보기 위해 망원경을 사용합니다. 언젠가 저는 새로운 별을 발견해서 제 이름을 따서 그 별의 이름을 짓고 싶어요."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["석양의 아름다움","사진에 대한 관심","학교 사진 전시회 초대","사진 전시회 참가 신청하기
