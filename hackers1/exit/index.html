은 큰 동물들을 공격하고 죽인다."]],"w":"8번 문장에서 They often attack and kill large animals, such as reindeer and sheep라고 해요.","c":"T"},"h":"d6aef7f038"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Fierce wolverines even threaten other predators to steal their prey.)","ko":"사나운 울버린은 심지어 다른 포식 동물들의 먹이를 빼앗기 위해 그것들을 위협하기도 한다. (fierce는 사나운)","opts":["온순한","사나운","느린","겁 많은"],"word":"Fierce","r":{"a":"2) 사나운","ev":"10번 문장","s":[[10,"Fierce wolverines even threaten other predators to steal their prey.","사나운 울버린은 심지어 다른 포식 동물들의 먹이를 빼앗기 위해 그것들을 위협하기도 한다."]],"w":"다른 포식 동물을 위협하고 먹이를 빼앗을 정도니 fierce는 '사나운'이에요. 온순하거나 겁이 많다면 위협하지 못해요.","c":2},"h":"774011b6a7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Fierce wolverines even threaten other predators to steal their prey.)","ko":"사나운 울버린은 심지어 다른 포식 동물들의 먹이를 빼앗기 위해 그것들을 위협하기도 한다. (steal은 빼앗다)","opts":["빼앗다","나누어 주다","길러 주다","돌려주다"],"word":"steal","r":{"a":"1) 빼앗다","ev":"10번 문장","s":[[10,"Fierce wolverines even threaten other predators to steal their prey.","사나운 울버린은 심지어 다른 포식 동물들의 먹이를 빼앗기 위해 그것들을 위협하기도 한다."]],"w":"to steal their prey는 다른 동물의 먹이를 빼앗으려고 한다는 뜻이에요. 위협하는 이유라서 '나누어 주다, 돌려주다'는 맞지 않아요. steal = 빼앗다, 훔치다.","c":1},"h":"1f13406e81"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nLike the character Wolverine, they use their powerful claws to hunt.","ko":"밑줄 친 they가 가리키는 것은?","opts":["캐릭터 울버린","순록과 양","곰과 늑대","실제 동물인 울버린들"],"sko":"캐릭터 울버린처럼, 그것들은 사냥하기 위해 강력한 발톱을 사용한다.","r":{"a":"4) 실제 동물인 울버린들","ev":"5, 7번 문장","s":[[5,"Wolverines look like little bears.","울버린은 작은 곰처럼 보인다."],[7,"Like the character Wolverine, they use their powerful claws to hunt.","캐릭터 울버린처럼, 그것들은 사냥하기 위해 강력한 발톱을 사용한다."]],"w":"7번은 'Like the character Wolverine(캐릭터 울버린처럼)'이라고 했으니 캐릭터가 아니라 실제 동물이에요. 5~6번의 Wolverines(실제 동물 울버린들)를 they로 받았어요.","c":4},"h":"85b0f30ce6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Their teeth and jaws are also so strong that they can crush bones.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["이빨과 턱이 약해서 뼈를 부술 수 없다.","이빨과 턱이 매우 강해서 뼈도 부술 수 있다.","이빨과 턱이 뼈로 되어 있어서 매우 강하다.","뼈가 매우 강해서 이빨과 턱을 부술 수 있다."],"sko":"그것들의 이빨과 턱 또한 매우 강해서 뼈도 부술 수 있다.","r":{"a":"2) 이빨과 턱이 매우 강해서 뼈도 부술 수 있다.","ev":"9번 문장","s":[[9,"Their teeth and jaws are also so strong that they can crush bones.","그것들의 이빨과 턱 또한 매우 강해서 뼈도 부술 수 있다."]],"w":"'so strong that ~'은 '매우 강해서 ~하다'예요. 이빨과 턱이 강해서 뼈를 부술 수 있다는 뜻이고, 뼈가 이빨을 부수는 게 아니에요.","c":2},"h":"5fa9e9e2fb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Wolverines are bigger than bears.","Wolverines never hunt large animals.","Bears and wolves walk away when wolverines come near.","The movie Wolverine is based on a bear."],"oko":["울버린은 곰보다 크다.","울버린은 큰 동물을 절대 사냥하지 않는다.","울버린이 가까이 오면 곰과 늑대가 떠나 버린다.","영화 속 울버린은 곰을 바탕으로 만들어졌다."],"r":{"a":"3) Bears and wolves walk away when wolverines come near.","ev":"3, 5, 8, 11번 문장","s":[[3,"But did you know the character is based on a real animal?","하지만 당신은 그 캐릭터가 실제 동물을 바탕으로 한 것을 알고 있었는가?"],[5,"Wolverines look like little bears.","울버린은 작은 곰처럼 보인다."],[8,"They often attack and kill large animals, such as reindeer and sheep.","그것들은 종종 순록과 양과 같은 큰 동물들을 공격하고 죽인다."],[11,"When they come near, even bears and wolves stop eating and walk away!","그것들이 가까이 오면, 곰과 늑대조차 먹기를 멈추고 떠나 버린다!"]],"w":"11번에서 울버린이 가까이 오면 곰과 늑대가 떠나 버려요. 울버린은 작은 곰처럼 보이는 크기(5번)이고, 큰 동물도 사냥하며(8번), 영화 캐릭터는 실제 동물 울버린을 바탕으로 해요(3번).","c":3},"h":"871b1c6af3"},{"n":9,"t":"sum","q":"The movie character Wolverine is based on a real (A), and both use sharp (B) as weapons.","ko":"영화 캐릭터 울버린은 실제 (A)를 바탕으로 하고, 둘 다 날카로운 (B)을 무기로 쓴다.","opts":["(A) bear / (B) claws","(A) plant / (B) claws","(A) animal / (B) wings","(A) animal / (B) claws","(A) animal / (B) horns"],"oko":["(A) 곰 / (B) 발톱","(A) 식물 / (B) 발톱","(A) 동물 / (B) 날개","(A) 동물 / (B) 발톱","(A) 동물 / (B) 뿔"],"r":{"a":"4) (A) animal / (B) claws","ev":"2, 3, 7번 문장","s":[[2,"His sharp claws are great weapons that are strong enough to cut anything.","그의 날카로운 발톱은 어떤 것이든 자를 만큼 충분히 강한 훌륭한 무기이다."],[3,"But did you know the character is based on a real animal?","하지만 당신은 그 캐릭터가 실제 동물을 바탕으로 한 것을 알고 있었는가?"],[7,"Like the character Wolverine, they use their powerful claws to hunt.","캐릭터 울버린처럼, 그것들은 사냥하기 위해 강력한 발톱을 사용한다."]],"w":"3번에서 캐릭터는 실제 동물(animal)을 바탕으로 하고, 2번과 7번에서 캐릭터와 실제 울버린 모두 강력한 발톱(claws)을 써요. 곰처럼 보일 뿐 곰이 바탕은 아니에요(5번).","c":4},"h":"4cce516bba"},{"n":10,"t":"fill","q":"Wolverines often [A] large animals, and they even [B] other predators to steal their prey.","ko":"울버린은 종종 큰 동물들을 [A]하고, 심지어 다른 포식 동물들의 먹이를 빼앗기 위해 그것들을 [B]하기도 한다.","bank":["attack","threaten","crush","steal","walk","stop"],"bko":{"attack":"공격하다","threaten":"위협하다","crush":"부수다","steal":"빼앗다","walk":"걷다","stop":"멈추다"},"r":{"a":"[A] attack, [B] threaten","ev":"8, 10번 문장","s":[[8,"They often attack and kill large animals, such as reindeer and sheep.","그것들은 종종 순록과 양과 같은 큰 동물들을 공격하고 죽인다."],[10,"Fierce wolverines even threaten other predators to steal their prey.","사나운 울버린은 심지어 다른 포식 동물들의 먹이를 빼앗기 위해 그것들을 위협하기도 한다."]],"w":"8번에서 큰 동물을 공격하고(attack), 10번에서 다른 포식 동물을 위협해요(threaten). 두 낱말을 서로 바꾸면 본문과 달라져요. steal은 이미 뒤에 to steal로 나와 있고, crush(부수다)는 뼈에 쓰는 말이에요.","c":null},"h":"4e64e21ff4"}]},{"u":4,"id":"hk1-04-3","no":3,"ko":"주문하신 산소 나왔습니다~","items":[{"n":1,"t":"tf","q":"Rahul heard that it costs four to seven dollars.","ko":"Rahul은 그것이 4달러에서 7달러가 든다고 들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"I heard it costs four to seven dollars.","나는 4달러에서 7달러까지의 비용이 든다고 들었어."]],"w":"12번 문장에 I heard it costs four to seven dollars가 있어요.","c":"T"},"h":"e57ca2bbb0"},{"n":2,"t":"tf","q":"Rahul says air pollution is not a problem in India.","ko":"Rahul은 대기 오염이 인도에서는 문제가 아니라고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Air pollution is a big problem in India, too.","대기 오염은 인도에서도 큰 문제야."]],"w":"5번 문장에서 Rahul은 대기 오염이 인도에서도 큰 문제(a big problem)라고 해요. 문제가 아니라는 말은 반대예요.","c":"F"},"h":"01e007585b"},{"n":3,"t":"tf","q":"A diffuser in the café adds scents like lavender and orange.","ko":"카페의 디퓨저는 라벤더와 오렌지 같은 향을 더해 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"The machines are also connected to a diffuser that adds a few different scents, like lavender and orange.","기계들은 또한 라벤더와 오렌지 같은 몇 가지 다른 향들을 더해주는 디퓨저에 연결되어 있지."]],"w":"10번 문장에서 기계들이 디퓨저에 연결되어 있고, 디퓨저가 라벤더와 오렌지 같은 향을 더한다고 해요.","c":"T"},"h":"d192936279"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Well, it has machines that filter the air and produce 99% pure oxygen.)","ko":"음, 그곳은 공기를 여과해서 99퍼센트의 순수한 산소를 만들어내는 기계들을 가지고 있어. (filter는 여과하다)","opts":["끄다","나누다","여과하다","팔다"],"word":"filter","r":{"a":"3) 여과하다","ev":"9번 문장","s":[[9,"Rahul: Well, it has machines that filter the air and produce 99% pure oxygen.","음, 그곳은 공기를 여과해서 99퍼센트의 순수한 산소를 만들어내는 기계들을 가지고 있어."]],"w":"기계가 공기에서 순수한 산소를 만들어 내는 내용이에요. 공기를 깨끗하게 걸러 내는 일이니 filter = 여과하다(걸러 내다)예요.","c":3},"h":"1cd6f81088"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They say they feel refreshed and relaxed!)","ko":"그들은 상쾌하고 편안한 기분을 느낀다고 이야기해! (refreshed는 상쾌한)","opts":["피곤한","상쾌한","지루한","화난"],"word":"refreshed","r":{"a":"2) 상쾌한","ev":"11, 17번 문장","s":[[11,"Customers can breathe the pure air for 15 minutes.","손님들은 그 순수한 공기를 15분 동안 들이마실 수 있어."],[17,"They say they feel refreshed and relaxed!","그들은 상쾌하고 편안한 기분을 느낀다고 이야기해!"]],"w":"순수한 공기를 마신 사람들이 느끼는 기분이고, relaxed(편안한)와 함께 쓰여 좋은 기분이에요. refreshed = 상쾌한.","c":2},"h":"36b9c034c1"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWell, it has machines that filter the air and produce 99% pure oxygen.","ko":"밑줄 친 it이 가리키는 것은?","opts":["미세먼지","Rahul의 동네","디퓨저","Oxy Pure 카페"],"sko":"음, 그곳은 공기를 여과해서 99퍼센트의 순수한 산소를 만들어내는 기계들을 가지고 있어.","r":{"a":"4) Oxy Pure 카페","ev":"7~9번 문장","s":[[7,"It is called Oxy Pure.","그곳은 Oxy Pure라고 불려."],[8,"Minji: How does a café sell oxygen?","어떻게 카페가 산소를 판매하니?"],[9,"Rahul: Well, it has machines that filter the air and produce 99% pure oxygen.","음, 그곳은 공기를 여과해서 99퍼센트의 순수한 산소를 만들어내는 기계들을 가지고 있어."]],"w":"8번에서 민지가 카페가 어떻게 산소를 파는지 물었고, 9번 it은 그 카페(Oxy Pure)예요. 카페가 기계들을 가지고 있다는 뜻이에요.","c":4},"h":"7457c71564"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There is even a café that sells oxygen in my town now!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["우리 동네에는 이제 산소를 파는 카페까지 있어!","우리 동네의 카페는 이제 산소를 사 간다!","우리 동네에는 산소 때문에 문을 닫은 카페가 있어!","우리 동네에는 산소를 만드는 큰 공장이 있어!"],"sko":"우리 동네에는 이제 산소를 판매하는 카페도 있어!","r":{"a":"1) 우리 동네에는 이제 산소를 파는 카페까지 있어!","ev":"6번 문장","s":[[6,"There is even a café that sells oxygen in my town now!","우리 동네에는 이제 산소를 판매하는 카페도 있어!"]],"w":"a café that sells oxygen은 '산소를 파는 카페'예요. even은 '~까지도'라는 놀라움을 나타내요. 카페가 사 가는 것도, 문을 닫은 것도, 공장도 아니에요.","c":1},"h":"e24ef27a04"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Rahul stayed home because of the fine dust.","Oxy Pure has a diffuser that adds scents like lavender and orange.","Oxy Pure gives customers the pure air for 30 minutes.","Minji heard the café costs four to seven dollars."],"oko":["Rahul은 미세먼지 때문에 집에 있었다.","Oxy Pure에는 라벤더와 오렌지 같은 향을 더해 주는 디퓨저가 있다.","Oxy Pure는 손님에게 30분 동안 순수한 공기를 준다.","민지는 그 카페의 비용이 4달러에서 7달러라고 들었다."],"r":{"a":"2) Oxy Pure has a diffuser that adds scents like lavender and orange.","ev":"3, 10, 11, 12번 문장","s":[[3,"I had to stay home because of the fine dust.","미세먼지 때문에 집에 있어야 했거든."],[10,"The machines are also connected to a diffuser that adds a few different scents, like lavender and orange.","기계들은 또한 라벤더와 오렌지 같은 몇 가지 다른 향들을 더해주는 디퓨저에 연결되어 있지."],[11,"Customers can breathe the pure air for 15 minutes.","손님들은 그 순수한 공기를 15분 동안 들이마실 수 있어."],[12,"I heard it costs four to seven dollars.","나는 4달러에서 7달러까지의 비용이 든다고 들었어."]],"w":"10번에서 디퓨저가 라벤더와 오렌지 같은 향을 더해요. 집에 있었던 사람은 Rahul이 아니라 민지(3번)이고, 시간은 30분이 아니라 15분(11번)이며, 가격을 들은 사람은 Rahul(12번)이에요.","c":2},"h":"82b2e94ccd"},{"n":9,"t":"sum","q":"Air pollution is a (A) problem in India, and a café there sells (B).","ko":"대기 오염은 인도에서 (A) 문제이고, 그곳의 한 카페는 (B)를 판다.","opts":["(A) small / (B) coffee","(A) big / (B) water","(A) small / (B) oxygen","(A) big / (B) masks","(A) big / (B) oxygen"],"oko":["(A) 작은 / (B) 커피","(A) 큰 / (B) 물","(A) 작은 / (B) 산소","(A) 큰 / (B) 마스크","(A) 큰 / (B) 산소"],"r":{"a":"5) (A) big / (B) oxygen","ev":"5~6번 문장","s":[[5,"Air pollution is a big problem in India, too.","대기 오염은 인도에서도 큰 문제야."],[6,"There is even a café that sells oxygen in my town now!","우리 동네에는 이제 산소를 판매하는 카페도 있어!"]],"w":"5번에서 대기 오염은 인도에서도 큰(big) 문제이고, 6번에서 카페가 산소(oxygen)를 팔아요. 커피, 물, 마스크를 판다는 말은 없어요.","c":5},"h":"fde00fc574"},{"n":10,"t":"fill","q":"Customers can [A] the pure air for 15 minutes, and they say they feel [B].","ko":"손님들은 15분 동안 순수한 공기를 [A]할 수 있고, [B] 기분을 느낀다고 말한다.","bank":["breathe","refreshed","filter","produce","scents","popular"],"bko":{"breathe":"들이마시다","refreshed":"상쾌한","filter":"여과하다","produce":"만들어 내다","scents":"향들","popular":"인기 있는"},"r":{"a":"[A] breathe, [B] refreshed","ev":"11, 17번 문장","s":[[11,"Customers can breathe the pure air for 15 minutes.","손님들은 그 순수한 공기를 15분 동안 들이마실 수 있어."],[17,"They say they feel refreshed and relaxed!","그들은 상쾌하고 편안한 기분을 느낀다고 이야기해!"]],"w":"11번에서 손님은 순수한 공기를 15분 동안 들이마시고(breathe), 17번에서 상쾌한(refreshed) 기분을 느낀다고 말해요. filter와 produce는 기계가 하는 일이에요(9번).","c":null},"h":"8eb5e10870"}]},{"u":4,"id":"hk1-04-4","no":4,"ko":"더 이상 병원이 두렵지 않아!","items":[{"n":1,"t":"tf","q":"The Medi Teddy has a pouch in the back and covers the IV bag.","ko":"Medi Teddy는 뒤에 주머니가 있고 링거 주머니를 가려 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"It is a cute teddy bear with a pouch in the back, and it fully covers up the IV bag.","그것은 뒤에 주머니가 있는 귀여운 테디 베어 인형으로, 링거 주머니를 완전히 가려준다."]],"w":"8번 문장에 a cute teddy bear with a pouch in the back, and it fully covers up the IV bag이 있어요.","c":"T"},"h":"a03e313023"},{"n":2,"t":"tf","q":"For kids, the fear of hospitals is smaller.","ko":"아이들에게 병원에 대한 두려움은 더 작다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"For kids, the fear is bigger.","아이들에게 있어, 그 두려움은 더욱 크다."]],"w":"3번 문장에서 For kids, the fear is bigger(아이들에게 두려움은 더 크다)라고 해요. 작다는 말은 반대예요.","c":"F"},"h":"6c744ec5b7"},{"n":3,"t":"tf","q":"Like other children, Ella was afraid of the IV bags.","ko":"다른 아이들처럼 Ella는 링거 주머니를 두려워했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Like other children, she was afraid of the IV bags and medical equipment.","다른 아이들처럼, 그녀는 링거 주머니와 의료 장비를 두려워했다."]],"w":"6번 문장에 Like other children, she was afraid of the IV bags and medical equipment가 나와요.","c":"T"},"h":"6521133365"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Unfortunately, 12-year-old Ella had to go to the hospital regularly.)","ko":"불행하게도, 12살의 Ella는 정기적으로 병원에 가야 했다. (regularly는 정기적으로)","opts":["가끔","갑자기","정기적으로","우연히"],"word":"regularly","r":{"a":"3) 정기적으로","ev":"4~5번 문장","s":[[4,"Unfortunately, 12-year-old Ella had to go to the hospital regularly.","불행하게도, 12살의 Ella는 정기적으로 병원에 가야 했다."],[5,"She had a rare disease and needed to get an IV every two months.","그녀는 희귀병을 앓고 있어 두 달마다 링거를 맞아야 했다."]],"w":"5번에서 두 달마다 링거를 맞아야 했다고 해요. 일정한 간격으로 가는 것이니 regularly = 정기적으로예요.","c":3},"h":"68dd3425fb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (she was afraid of the IV bags and medical equipment)","ko":"그녀는 링거 주머니와 의료 장비를 두려워했다. (equipment는 장비)","opts":["건물","장비","의사","음식"],"word":"equipment","r":{"a":"2) 장비","ev":"6번 문장","s":[[6,"Like other children, she was afraid of the IV bags and medical equipment.","다른 아이들처럼, 그녀는 링거 주머니와 의료 장비를 두려워했다."]],"w":"링거 주머니와 함께 나오는 병원의 것이라서 equipment는 '장비, 용품'이에요. 앞의 medical tools(의료 도구, 2번)와 비슷한 말이에요.","c":2},"h":"8203013338"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIt is a cute teddy bear with a pouch in the back, and it fully covers up the IV bag.","ko":"밑줄 친 두 번째 it이 가리키는 것은?","opts":["Ella","병원","Medi Teddy","링거 주머니"],"sko":"그것은 뒤에 주머니가 있는 귀여운 테디 베어 인형으로, 링거 주머니를 완전히 가려준다.","r":{"a":"3) Medi Teddy","ev":"7~8번 문장","s":[[7,"So Ella created the Medi Teddy.","그래서 Ella는 Medi Teddy를 만들었다."],[8,"It is a cute teddy bear with a pouch in the back, and it fully covers up the IV bag.","그것은 뒤에 주머니가 있는 귀여운 테디 베어 인형으로, 링거 주머니를 완전히 가려준다."]],"w":"7번에서 Ella가 만든 것은 Medi Teddy이고, 8번은 그것이 귀여운 테디 베어라고 설명해요. 링거 주머니를 가리는 쪽이 it이므로 링거 주머니는 아니에요.","c":3},"h":"e3bbae13b2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Ella’s small but great idea has made hospitals friendlier places.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["Ella는 작은 병원을 더 큰 곳으로 만들었다.","Ella의 큰 병원이 아이들을 더 친절하게 만들었다.","Ella의 발상은 너무 작아서 병원에 도움이 되지 않았다.","Ella의 작지만 훌륭한 발상이 병원을 더 친숙한 곳으로 만들었다."],"sko":"Ella의 작지만 훌륭한 발상이 병원을 더 친숙한 곳으로 만들었다.","r":{"a":"4) Ella의 작지만 훌륭한 발상이 병원을 더 친숙한 곳으로 만들었다.","ev":"11번 문장","s":[[11,"Ella’s small but great idea has made hospitals friendlier places.","Ella의 작지만 훌륭한 발상이 병원을 더 친숙한 곳으로 만들었다."]],"w":"small but great는 '작지만 훌륭한'이고, make A B는 'A를 B로 만들다'예요. 병원(A)을 더 친숙한 곳(B)으로 만들었다는 뜻이에요.","c":4},"h":"9f2c5516c2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Ella was not afraid of IV bags.","Ella and her family have donated Medi Teddys to children’s hospitals.","The Medi Teddy makes the IV bag look bigger.","Ella had to go to the hospital only once."],"oko":["Ella는 링거 주머니를 무서워하지 않았다.","Ella와 그녀의 가족은 아동 병원에 Medi Teddy를 기부해 왔다.","Medi Teddy는 링거 주머니를 더 크게 보이게 한다.","Ella는 병원에 딱 한 번만 가면 됐다."],"r":{"a":"2) Ella and her family have donated Medi Teddys to children’s hospitals.","ev":"4, 6, 9, 10번 문장","s":[[4,"Unfortunately, 12-year-old Ella had to go to the hospital regularly.","불행하게도, 12살의 Ella는 정기적으로 병원에 가야 했다."],[6,"Like other children, she was afraid of the IV bags and medical equipment.","다른 아이들처럼, 그녀는 링거 주머니와 의료 장비를 두려워했다."],[9,"The bag doesn’t look scary anymore this way.","이렇게 하면 그 주머니는 더는 무섭게 보이지 않는다."],[10,"So far, Ella and her family have donated thousands of Medi Teddys to children’s hospitals.","지금까지, Ella와 그녀의 가족은 수천 개의 Medi Teddy를 아동 병원에 기부해왔다."]],"w":"10번에서 Ella와 가족이 Medi Teddy를 아동 병원에 기부해 왔어요. Ella는 링거 주머니를 무서워했고(6번), Medi Teddy는 주머니를 가려 덜 무섭게 하며(9번), 병원에는 정기적으로 가야 했어요(4번).","c":2},"h":"6f5fe8c29a"},{"n":9,"t":"sum","q":"Ella was afraid of the IV bag, so she made a teddy bear that (A) the bag and made hospitals (B).","ko":"Ella는 링거 주머니를 무서워해서, 주머니를 (A)하는 테디 베어를 만들었고 병원을 (B) 만들었다.","opts":["(A) shows / (B) scarier","(A) covers / (B) scarier","(A) cuts / (B) smaller","(A) fills / (B) emptier","(A) covers / (B) friendlier"],"oko":["(A) 보여 주고 / (B) 더 무서운","(A) 가리고 / (B) 더 무서운","(A) 자르고 / (B) 더 작은","(A) 채우고 / (B) 더 빈","(A) 가리고 / (B) 더 친숙한"],"r":{"a":"5) (A) covers / (B) friendlier","ev":"6, 8, 11번 문장","s":[[6,"Like other children, she was afraid of the IV bags and medical equipment.","다른 아이들처럼, 그녀는 링거 주머니와 의료 장비를 두려워했다."],[8,"It is a cute teddy bear with a pouch in the back, and it fully covers up the IV bag.","그것은 뒤에 주머니가 있는 귀여운 테디 베어 인형으로, 링거 주머니를 완전히 가려준다."],[11,"Ella’s small but great idea has made hospitals friendlier places.","Ella의 작지만 훌륭한 발상이 병원을 더 친숙한 곳으로 만들었다."]],"w":"6번에서 링거 주머니를 무서워해서 8번에서 Medi Teddy가 주머니를 가려요(covers). 그 결과 11번에서 병원이 더 친숙한(friendlier) 곳이 돼요.","c":5},"h":"e371380730"},{"n":10,"t":"fill","q":"Ella had a [A] disease and needed to get an IV every [B] months.","ko":"Ella는 [A] 병이 있어서 [B] 달마다 링거를 맞아야 했다.","bank":["rare","two","frightening","twelve","friendlier","donated"],"bko":{"rare":"희귀한","two":"두","frightening":"무서운","twelve":"열두","friendlier":"더 친숙한","donated":"기부했다"},"r":{"a":"[A] rare, [B] two","ev":"5번 문장","s":[[5,"She had a rare disease and needed to get an IV every two months.","그녀는 희귀병을 앓고 있어 두 달마다 링거를 맞아야 했다."]],"w":"5번에서 Ella는 희귀한(rare) 병이 있어서 두(two) 달마다 링거를 맞아야 했다고 해요. twelve는 Ella의 나이(4번)이고, frightening은 병이 아니라 의료 도구를 꾸미는 말(2번)이에요.","c":null},"h":"12cde094b2"}]},{"u":5,"id":"hk1-05-1","no":1,"ko":"이름이 뭐예요?","items":[{"n":1,"t":"tf","q":"The explorers had never seen an animal like a kangaroo before.","ko":"탐험가들은 이전에 캥거루 같은 동물을 본 적이 전혀 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"They had never seen an animal like this before.","그들은 이전에 이것과 같은 동물을 본 적이 전혀 없었다."]],"w":"5번 문장에 had never seen an animal like this before가 있어요. 탐험가들에게 캥거루는 처음 보는 동물이었어요.","c":"T"},"h":"022b56ae31"},{"n":2,"t":"tf","q":"The explorers kept the new animal a secret after they returned home.","ko":"탐험가들은 집으로 돌아온 후 그 새로운 동물을 비밀로 했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"After the explorers returned home, they told everyone about the new animal called kangaroo.","탐험가들은 집으로 돌아온 후, 모두에게 캥거루라고 불리는 새로운 동물에 관해 얘기했다."]],"w":"8번 문장에서 탐험가들은 집으로 돌아온 후 모두에게(told everyone) 새로운 동물에 관해 얘기했어요. 비밀로 했다는 말은 반대예요.","c":"F"},"h":"0ff5573c77"},{"n":3,"t":"tf","q":"The explorers asked the natives, \"What is this animal?\"","ko":"탐험가들은 원주민들에게 \"이 동물은 무엇입니까?\"라고 물었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"So they asked the natives, “What is this animal?”","그래서 그들은 원주민들에게 “이 동물은 무엇입니까?”라고 물었다."]],"w":"6번 문장에서 탐험가들이 원주민들에게 그렇게 물었어요. 질문한 쪽은 탐험가들이고 대답한 쪽은 원주민들이에요.","c":"T"},"h":"3dec7edc6d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (There, they saw an animal that was very unusual.)","ko":"그곳에서, 그들은 매우 특이한 동물을 보았다.","opts":["평범한","귀여운","특이한","거대한"],"word":"unusual","r":{"a":"3) 특이한","ev":"2번 문장","s":[[2,"There, they saw an animal that was very unusual.","그곳에서, 그들은 매우 특이한 동물을 보았다."]],"w":"2번 문장의 unusual은 5번에서 '이전에 본 적이 전혀 없었다'고 한 것과 이어져요. 평범하지 않은 처음 보는 동물이니 '특이한'이에요.","c":3},"h":"8600edc2a0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (From then on, the name spread all over the world.)","ko":"그 이후, 그 이름은 전 세계에 퍼졌다.","opts":["퍼졌다","멈췄다","사라졌다","바뀌었다"],"word":"spread","r":{"a":"1) 퍼졌다","ev":"9번 문장","s":[[9,"From then on, the name spread all over the world.","그 이후, 그 이름은 전 세계에 퍼졌다."]],"w":"spread(퍼지다)는 'all over the world(전 세계에)'와 이어져요. 8번에서 탐험가들이 모두에게 얘기했으니 이름이 널리 퍼진 거예요.","c":1},"h":"f984215850"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nIt also had a pouch on its belly to carry its baby.","ko":"밑줄 친 its가 가리키는 것은?","sko":"그것은 또한 배에 새끼를 데리고 다닐 주머니가 있었다.","opts":["탐험가들","원주민들","그 동물","주머니"],"r":{"a":"3) 그 동물","ev":"2~4번 문장","s":[[2,"There, they saw an animal that was very unusual.","그곳에서, 그들은 매우 특이한 동물을 보았다."],[3,"It had large ears and hopped around on two legs.","그것은 큰 귀를 가지고 있었고 두 다리로 깡충깡충 뛰어다녔다."],[4,"It also had a pouch on its belly to carry its baby.","그것은 또한 배에 새끼를 데리고 다닐 주머니가 있었다."]],"w":"배에 주머니가 있고 새끼를 데리고 다니는 것은 2번에서 본 특이한 동물(3번의 It)이에요. its는 그 동물의 것이라는 뜻이에요.","c":3},"h":"fb3949dbc0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The truth is, the natives didn’t know the name, either!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사실은, 원주민들도 그 이름을 몰랐다!","opts":["사실은 원주민들만 그 이름을 알고 있었다.","사실은 원주민들도 그 이름을 알지 못했다.","사실은 원주민들이 그 동물에게 이름을 지어 주었다.","사실은 탐험가들이 그 이름을 몰랐고 원주민들은 알았다."],"r":{"a":"2) 사실은 원주민들도 그 이름을 알지 못했다.","ev":"10~11번 문장","s":[[10,"However, kangaroo meant “I don’t know” in the natives’ language.","하지만, ‘캥거루’는 원주민 언어로 ‘나는 모른다’를 의미했다."],[11,"The truth is, the natives didn’t know the name, either!","사실은, 원주민들도 그 이름을 몰랐다!"]],"w":"10번에서 kangaroo는 '나는 모른다'라는 뜻이었어요. 11번은 그래서 원주민들도 그 이름을 몰랐다는 말이에요(either = 역시).","c":2},"h":"2e291659d4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["탐험가들은 아프리카로 항해해서 이상한 동물을 보았다.","그 동물은 작은 귀를 가지고 있었고 네 다리로 걸었다.","탐험가들은 고국의 사람들에게 그 새로운 동물에 대해 이야기했다.","원주민들은 그 동물을 잘 안다는 것을 말하려고 \"캥거루\"라고 대답했다."],"opts":["The explorers sailed to Africa and saw a strange animal.","The animal had small ears and walked on four legs.","The explorers told people at home about the new animal.","The natives answered \"Kangaroo\" to say that they knew the animal well."],"r":{"a":"3) The explorers told people at home about the new animal.","ev":"1번, 3번, 8번, 10번 문장","s":[[1,"Long ago, European explorers sailed to Australia.","오래전에, 유럽의 탐험가들은 호주로 항해했다."],[3,"It had large ears and hopped around on two legs.","그것은 큰 귀를 가지고 있었고 두 다리로 깡충깡충 뛰어다녔다."],[8,"After the explorers returned home, they told everyone about the new animal called kangaroo.","탐험가들은 집으로 돌아온 후, 모두에게 캥거루라고 불리는 새로운 동물에 관해 얘기했다."],[10,"However, kangaroo meant “I don’t know” in the natives’ language.","하지만, ‘캥거루’는 원주민 언어로 ‘나는 모른다’를 의미했다."]],"w":"8번에서 탐험가들은 돌아와 모두에게 새 동물 이야기를 했어요. 호주(1번)가 아닌 아프리카, 큰 귀·두 다리(3번)가 아닌 작은 귀·네 다리, '나는 모른다'(10번)가 아닌 잘 안다는 설명은 모두 본문과 달라요.","c":3},"h":"22fd76a3c1"},{"n":9,"t":"sum","q":"The explorers thought \"kangaroo\" was the (A) of the animal, but the natives actually meant that they did not (B) it.","ko":"탐험가들은 \"캥거루\"가 그 동물의 (A)라고 생각했지만, 사실 원주민들은 그것을 (B)하지 못한다는 뜻으로 말한 것이었다.","oko":["(A) 색깔 / (B) 보다","(A) 이름 / (B) 좋아하다","(A) 음식 / (B) 알다","(A) 크기 / (B) 듣다","(A) 이름 / (B) 알다"],"opts":["(A) color / (B) see","(A) name / (B) like","(A) food / (B) know","(A) size / (B) hear","(A) name / (B) know"],"r":{"a":"5) (A) name / (B) know","ev":"7번, 10~11번 문장","s":[[7,"The natives replied, “Kangaroo.”","원주민들은 “캥거루”라고 대답했다."],[10,"However, kangaroo meant “I don’t know” in the natives’ language.","하지만, ‘캥거루’는 원주민 언어로 ‘나는 모른다’를 의미했다."],[11,"The truth is, the natives didn’t know the name, either!","사실은, 원주민들도 그 이름을 몰랐다!"]],"w":"탐험가들은 7번의 \"Kangaroo\"를 동물의 이름(name)으로 받아들였어요. 하지만 10~11번에서 그 말은 '나는 모른다'였고 원주민들도 그 이름을 몰랐어요(know).","c":5},"h":"ea2926604f"},{"n":10,"t":"fill","q":"The unusual animal had large [A] and hopped around on two [B].","ko":"그 특이한 동물은 큰 [A]를 가지고 있었고 두 [B]로 깡충깡충 뛰어다녔다.","bank":["ears","legs","tail","eyes","pouch","hands"],"bko":{"ears":"귀","legs":"다리","tail":"꼬리","eyes":"눈","pouch":"주머니","hands":"손"},"r":{"a":"[A] ears, [B] legs","ev":"3번 문장","s":[[3,"It had large ears and hopped around on two legs.","그것은 큰 귀를 가지고 있었고 두 다리로 깡충깡충 뛰어다녔다."]],"w":"3번 문장 It had large ears and hopped around on two legs에서 가져왔어요. pouch(주머니)는 4번에서 배에 있다고 했고, tail·eyes·hands는 본문에 나오지 않아요.","c":null},"h":"0226193032"}]},{"u":5,"id":"hk1-05-2","no":2,"ko":"까먹기 전에 꼭!","items":[{"n":1,"t":"tf","q":"Tangerines make a chemical that helps fruits ripen.","ko":"귤은 과일이 익도록 돕는 화학물질을 만들어 낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"Most fruits, including tangerines, produce a small amount of a chemical that helps fruits ripen.","귤을 포함하여, 대부분의 과일은 과일이 익도록 돕는 소량의 화학물질을 만들어 낸다."],[5,"It is called ethylene.","그것은 에틸렌이라고 불린다."]],"w":"4번에서 귤을 포함한 대부분의 과일이 과일이 익도록 돕는 화학물질을 만들고, 5번에서 그 이름이 에틸렌이라고 해요.","c":"T"},"h":"28806e0e4e"},{"n":2,"t":"tf","q":"A tangerine that is hit will ripen more slowly.","ko":"맞은 귤은 더 느리게 익을 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Eventually, the tangerine will ripen faster and taste better.","결국, 귤은 더 빠르게 익고 맛이 더 좋아질 것이다."]],"w":"8번 문장에서 귤은 더 빠르게(faster) 익고 맛이 더 좋아진다고 해요. 더 느리게 익는다는 말은 반대예요.","c":"F"},"h":"6bb8ed77d6"},{"n":3,"t":"tf","q":"You can rub a tangerine hard with your hands, too.","ko":"귤을 손으로 세게 문지를 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"You can also rub it hard with your hands or drop it on the floor.","당신은 그것을 손으로 세게 문지르거나 바닥에 떨어뜨릴 수도 있다."]],"w":"3번 문장에 rub it hard with your hands가 있어요. 때리는 것 말고도 손으로 세게 문지르거나 바닥에 떨어뜨릴 수 있어요.","c":"T"},"h":"14ba6df92d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Most fruits, including tangerines, produce a small amount of a chemical that helps fruits ripen.)","ko":"귤을 포함하여, 대부분의 과일은 과일이 익도록 돕는 소량의 화학물질을 만들어 낸다.","opts":["썩다","마르다","익다","얼다"],"word":"ripen","r":{"a":"3) 익다","ev":"4번, 11번 문장","s":[[4,"Most fruits, including tangerines, produce a small amount of a chemical that helps fruits ripen.","귤을 포함하여, 대부분의 과일은 과일이 익도록 돕는 소량의 화학물질을 만들어 낸다."],[11,"It means it’s already ripe, so hitting it will only make it rot faster.","그것은 귤이 이미 익었음을 의미하므로, 귤을 때리는 것은 그것을 더 빨리 썩게 만들 뿐이다."]],"w":"ripen은 과일이 '익다'예요. 11번에서 이미 익은 귤을 ripe(익은)라고 하고, 그 귤은 때리면 썩기만 한다고 해요.","c":3},"h":"f16f880cc9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (More of it is produced when a fruit is physically stressed.)","ko":"과일이 물리적으로 압력을 받을 때 그것이 더 많이 만들어진다.","opts":["기뻐하는","압력을 받는","깨끗해진","차가워진"],"word":"stressed","r":{"a":"2) 압력을 받는","ev":"6번 문장","s":[[6,"More of it is produced when a fruit is physically stressed.","과일이 물리적으로 압력을 받을 때 그것이 더 많이 만들어진다."]],"w":"stressed는 여기서 '압력을 받는'이에요. 3번에서 세게 문지르거나 바닥에 떨어뜨리는 것처럼 과일에 힘이 가해지는 상황이에요.","c":2},"h":"05f379e9cc"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is called ethylene.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 에틸렌이라고 불린다.","opts":["귤","과일","당도","과일이 익도록 돕는 화학물질"],"r":{"a":"4) 과일이 익도록 돕는 화학물질","ev":"4~5번 문장","s":[[4,"Most fruits, including tangerines, produce a small amount of a chemical that helps fruits ripen.","귤을 포함하여, 대부분의 과일은 과일이 익도록 돕는 소량의 화학물질을 만들어 낸다."],[5,"It is called ethylene.","그것은 에틸렌이라고 불린다."]],"w":"5번의 It은 바로 앞 4번의 a chemical that helps fruits ripen(과일이 익도록 돕는 화학물질)이에요. 그 화학물질의 이름이 에틸렌이에요.","c":4},"h":"b02d736b9d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Therefore, if you hit a tangerine, it will produce more ethylene.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서, 만약 귤을 때리면, 그것은 더 많은 에틸렌을 만들어 낼 것이다.","opts":["그래서 귤을 때리면 귤이 더 많은 에틸렌을 만들어 낸다.","그래서 귤을 때리면 귤 안의 에틸렌이 모두 사라진다.","하지만 귤을 때려도 에틸렌은 늘어나지 않는다.","그래서 귤을 때리면 귤이 에틸렌을 먹어 버린다."],"r":{"a":"1) 그래서 귤을 때리면 귤이 더 많은 에틸렌을 만들어 낸다.","ev":"6~7번 문장","s":[[6,"More of it is produced when a fruit is physically stressed.","과일이 물리적으로 압력을 받을 때 그것이 더 많이 만들어진다."],[7,"Therefore, if you hit a tangerine, it will produce more ethylene.","따라서, 만약 귤을 때리면, 그것은 더 많은 에틸렌을 만들어 낼 것이다."]],"w":"6번에서 과일이 압력을 받으면 에틸렌이 더 많이 만들어진다고 했으니, 때린 귤은 에틸렌을 더 만들어 내요(produce more). 사라지거나 늘지 않는다는 말은 맞지 않아요.","c":1},"h":"1de8e0cf76"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["귤만 에틸렌을 만든다.","귤을 때리면 당도가 20퍼센트까지 올라갈 수 있다.","무른 귤은 때리면 맛이 더 좋아진다.","에틸렌은 과일이 더 느리게 익게 만든다."],"opts":["Only tangerines make ethylene.","Hitting a tangerine can raise its sugar level by up to 20%.","A soft tangerine tastes better if you hit it.","Ethylene makes fruits ripen more slowly."],"r":{"a":"2) Hitting a tangerine can raise its sugar level by up to 20%.","ev":"4번, 9~11번 문장","s":[[4,"Most fruits, including tangerines, produce a small amount of a chemical that helps fruits ripen.","귤을 포함하여, 대부분의 과일은 과일이 익도록 돕는 소량의 화학물질을 만들어 낸다."],[9,"In fact, the sugar level can increase up to 20%!","실제로, 당도가 20퍼센트까지 증가할 수 있다!"],[10,"However, if the tangerine is too soft, don’t hit it.","하지만, 귤이 너무 무르다면, 그것을 때리지 말아라."],[11,"It means it’s already ripe, so hitting it will only make it rot faster.","그것은 귤이 이미 익었음을 의미하므로, 귤을 때리는 것은 그것을 더 빨리 썩게 만들 뿐이다."]],"w":"9번에서 당도가 20퍼센트까지 증가할 수 있다고 해요. 나머지는 본문과 달라요. 4번에서 귤을 포함한 대부분의 과일이 에틸렌을 만들고(귤만이 아님), 에틸렌은 과일이 익도록 도와요(느리게가 아님). 10~11번에서 무른 귤은 때리면 안 돼요.","c":2},"h":"7650b1ca47"},{"n":9,"t":"sum","q":"When a tangerine is too (A), you should not hit it, because it is already ripe and hitting it will make it (B) faster.","ko":"너무 (A) 귤은 때리지 말아야 한다. 이미 익었고 때리면 더 빨리 (B)하게 되기 때문이다.","oko":["(A) 단단한 / (B) 익다","(A) 단 / (B) 자라다","(A) 무른 / (B) 썩다","(A) 작은 / (B) 떨어지다","(A) 차가운 / (B) 썩다"],"opts":["(A) hard / (B) ripen","(A) sweet / (B) grow","(A) soft / (B) rot","(A) small / (B) fall","(A) cold / (B) rot"],"r":{"a":"3) (A) soft / (B) rot","ev":"10~11번 문장","s":[[10,"However, if the tangerine is too soft, don’t hit it.","하지만, 귤이 너무 무르다면, 그것을 때리지 말아라."],[11,"It means it’s already ripe, so hitting it will only make it rot faster.","그것은 귤이 이미 익었음을 의미하므로, 귤을 때리는 것은 그것을 더 빨리 썩게 만들 뿐이다."]],"w":"10번에서 귤이 너무 soft(무른)하면 때리지 말라고 했고, 11번에서 이미 익은 귤을 때리면 더 빨리 rot(썩다)하게 만들 뿐이라고 해요.","c":3},"h":"805ba451d2"},{"n":10,"t":"fill","q":"Fruits make [A], and more of it is produced when a fruit is [B].","ko":"과일은 [A]를 만들어 내고, 과일이 [B] 때 그것이 더 많이 만들어진다.","bank":["ethylene","stressed","sweeter","soft","rot","ripe"],"bko":{"ethylene":"에틸렌","stressed":"압력을 받는","sweeter":"더 단","soft":"무른","rot":"썩다","ripe":"익은"},"r":{"a":"[A] ethylene, [B] stressed","ev":"4~6번 문장","s":[[4,"Most fruits, including tangerines, produce a small amount of a chemical that helps fruits ripen.","귤을 포함하여, 대부분의 과일은 과일이 익도록 돕는 소량의 화학물질을 만들어 낸다."],[5,"It is called ethylene.","그것은 에틸렌이라고 불린다."],[6,"More of it is produced when a fruit is physically stressed.","과일이 물리적으로 압력을 받을 때 그것이 더 많이 만들어진다."]],"w":"4~5번에서 과일이 만드는 화학물질의 이름은 ethylene이고, 6번에서 과일이 물리적으로 압력을 받을 때(stressed) 그것이 더 많이 만들어진다고 해요. sweeter·soft·rot·ripe는 이 문장 내용과 맞지 않아요.","c":null},"h":"cdc863e1c2"}]},{"u":5,"id":"hk1-05-3","no":3,"ko":"뛰고 구르고 매달리고~","items":[{"n":1,"t":"tf","q":"You can do parkour with just a pair of sneakers.","ko":"당신은 운동화 한 켤레만 있으면 파쿠르를 할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7~8번 문장","s":[[7,"You don’t even need any special equipment for parkour.","당신은 파쿠르를 위한 어떠한 특별한 장비도 필요하지 않다."],[8,"A pair of sneakers is enough.","운동화 한 켤레면 충분하다."]],"w":"7번에서 특별한 장비가 필요하지 않다고 하고, 8번에서 운동화 한 켤레면 충분하다고 해요.","c":"T"},"h":"9ae67dc3a2"},{"n":2,"t":"tf","q":"Parkour is a competitive sport with points and losers.","ko":"파쿠르는 점수와 패자가 있는 경쟁적인 스포츠이다.","r":{"a":"F (본문과 다른 내용)","ev":"11번, 13번 문장","s":[[11,"Parkour is a non-competitive sport.","파쿠르는 비경쟁적인 스포츠다."],[13,"There are no time limits, no points, and no losers.","시간 제한, 점수, 그리고 패자는 없다."]],"w":"11번에서 파쿠르는 non-competitive(비경쟁적인) 스포츠라고 하고, 13번에서 시간 제한도 점수도 패자도 없다고 해요.","c":"F"},"h":"2b24839513"},{"n":3,"t":"tf","q":"People sometimes add moves from gymnastics and martial arts to parkour.","ko":"사람들은 가끔 체조와 무술의 움직임을 파쿠르에 더하기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"People sometimes add various moves from gymnastics and martial arts, too.","사람들은 가끔 체조와 무술에 나오는 다양한 움직임을 더하기도 한다."]],"w":"10번 문장 People sometimes add various moves from gymnastics and martial arts, too와 같은 내용이에요.","c":"T"},"h":"cd30747077"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is parkour, a sport of going over obstacles such as walls and railings.)","ko":"그것은 벽과 난간과 같은 장애물들을 넘어가는 스포츠인 파쿠르이다.","opts":["장비","운동화","장애물","경기장"],"word":"obstacles","r":{"a":"3) 장애물","ev":"5번 문장","s":[[5,"It is parkour, a sport of going over obstacles such as walls and railings.","그것은 벽과 난간과 같은 장애물들을 넘어가는 스포츠인 파쿠르이다."]],"w":"obstacles 뒤에 such as walls and railings(벽과 난간 같은)가 와요. 넘어가야 하는 벽이나 난간이니 '장애물'이에요.","c":3},"h":"4656495cb1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Before you try parkour, however, you should exercise enough to train your muscles.)","ko":"하지만, 파쿠르를 시도해보기 전에, 당신은 근육을 단련시킬 수 있을 만큼 충분히 운동해야 한다.","opts":["뼈","근육","피부","관절"],"word":"muscles","r":{"a":"2) 근육","ev":"14번 문장","s":[[14,"Before you try parkour, however, you should exercise enough to train your muscles.","하지만, 파쿠르를 시도해보기 전에, 당신은 근육을 단련시킬 수 있을 만큼 충분히 운동해야 한다."]],"w":"muscles는 운동으로 단련시키는 '근육'이에요. 15번에서 충분히 운동하지 않으면 다칠 수 있다고 이어져요.","c":2},"h":"3d1647a446"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nPeople practice it to overcome the obstacles in their paths and go beyond their physical limits.","ko":"밑줄 친 it이 가리키는 것은?","sko":"사람들은 그들의 길에 있는 장애물들을 극복하고 그들의 신체적 한계를 넘어서기 위해 그것을 연습한다.","opts":["장애물","근육","체조","파쿠르"],"r":{"a":"4) 파쿠르","ev":"11~12번 문장","s":[[11,"Parkour is a non-competitive sport.","파쿠르는 비경쟁적인 스포츠다."],[12,"People practice it to overcome the obstacles in their paths and go beyond their physical limits.","사람들은 그들의 길에 있는 장애물들을 극복하고 그들의 신체적 한계를 넘어서기 위해 그것을 연습한다."]],"w":"사람들이 연습하는 것은 11번 문장의 주어인 Parkour예요. 장애물은 극복하는 대상이지 연습하는 것이 아니에요.","c":4},"h":"9d6f551b43"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If not, you may hurt yourself!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그렇게 하지 않으면, 다칠 수도 있다!","opts":["근육을 단련시킬 만큼 충분히 운동하지 않으면 다칠 수도 있다.","충분히 운동을 많이 하면 다칠 수도 있다.","근육을 단련하지 않아도 절대 다치지 않는다.","다치지 않으면 파쿠르를 할 수 없다."],"r":{"a":"1) 근육을 단련시킬 만큼 충분히 운동하지 않으면 다칠 수도 있다.","ev":"14~15번 문장","s":[[14,"Before you try parkour, however, you should exercise enough to train your muscles.","하지만, 파쿠르를 시도해보기 전에, 당신은 근육을 단련시킬 수 있을 만큼 충분히 운동해야 한다."],[15,"If not, you may hurt yourself!","그렇게 하지 않으면, 다칠 수도 있다!"]],"w":"If not은 앞 문장(14번)의 '근육을 단련시킬 만큼 충분히 운동하는 것'을 하지 않으면이라는 뜻이에요. 그러면 다칠 수도 있다(may hurt yourself)는 경고예요.","c":1},"h":"8d8e96ca1c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파쿠르는 헬멧 같은 특별한 장비가 필요하다.","파쿠르는 모든 동작마다 시간 제한이 있다.","파쿠르는 뛰어넘기, 구르기, 오르기를 포함한다.","사람들은 장애물이 없는 평평한 땅에서만 파쿠르를 한다."],"opts":["Parkour needs special equipment such as a helmet.","Parkour has a time limit for every move.","Parkour includes jumping, rolling, and climbing.","People do parkour only on flat ground without obstacles."],"r":{"a":"3) Parkour includes jumping, rolling, and climbing.","ev":"5번, 7번, 9번, 13번 문장","s":[[5,"It is parkour, a sport of going over obstacles such as walls and railings.","그것은 벽과 난간과 같은 장애물들을 넘어가는 스포츠인 파쿠르이다."],[7,"You don’t even need any special equipment for parkour.","당신은 파쿠르를 위한 어떠한 특별한 장비도 필요하지 않다."],[9,"Parkour includes movements like jumping, rolling, and climbing.","파쿠르는 뛰어넘기, 구르기, 그리고 오르기와 같은 동작들을 포함한다."],[13,"There are no time limits, no points, and no losers.","시간 제한, 점수, 그리고 패자는 없다."]],"w":"9번에서 파쿠르는 뛰어넘기, 구르기, 오르기 같은 동작을 포함해요. 헬멧 같은 특별한 장비는 필요 없고(7번), 시간 제한이 없으며(13번), 벽과 난간 같은 장애물을 넘어가요(5번).","c":3},"h":"cee9904032"},{"n":9,"t":"sum","q":"In parkour, people try to move from one place to another (A), and they only need a pair of (B) for it.","ko":"파쿠르에서 사람들은 한 곳에서 다른 곳으로 (A) 움직이려고 하고, 그것을 위해 (B) 한 켤레만 있으면 된다.","oko":["(A) 천천히 / (B) 운동화","(A) 빠르게 / (B) 헬멧","(A) 조심스럽게 / (B) 공","(A) 천천히 / (B) 헬멧","(A) 빠르게 / (B) 운동화"],"opts":["(A) slowly / (B) sneakers","(A) quickly / (B) helmets","(A) carefully / (B) balls","(A) slowly / (B) helmets","(A) quickly / (B) sneakers"],"r":{"a":"5) (A) quickly / (B) sneakers","ev":"6~8번 문장","s":[[6,"The goal is to move from one place to another as quickly as possible.","목표는 한 곳에서 다른 곳으로 가능한 한 빠르게 움직이는 것이다."],[7,"You don’t even need any special equipment for parkour.","당신은 파쿠르를 위한 어떠한 특별한 장비도 필요하지 않다."],[8,"A pair of sneakers is enough.","운동화 한 켤레면 충분하다."]],"w":"6번에서 목표는 한 곳에서 다른 곳으로 가능한 한 빠르게(quickly) 움직이는 것이고, 7~8번에서 운동화(sneakers) 한 켤레면 충분하다고 해요.","c":5},"h":"b03ee48a79"},{"n":10,"t":"fill","q":"There are no [A] limits in parkour, and people try to go beyond their [B] limits.","ko":"파쿠르에는 [A] 제한이 없고, 사람들은 그들의 [B] 한계를 넘어서려고 한다.","bank":["time","physical","speed","money","special","mental"],"bko":{"time":"시간","physical":"신체적인","speed":"속도","money":"돈","special":"특별한","mental":"정신적인"},"r":{"a":"[A] time, [B] physical","ev":"12~13번 문장","s":[[12,"People practice it to overcome the obstacles in their paths and go beyond their physical limits.","사람들은 그들의 길에 있는 장애물들을 극복하고 그들의 신체적 한계를 넘어서기 위해 그것을 연습한다."],[13,"There are no time limits, no points, and no losers.","시간 제한, 점수, 그리고 패자는 없다."]],"w":"13번에서 time limits(시간 제한)가 없다고 했고, 12번에서 physical limits(신체적 한계)를 넘어서려고 연습한다고 해요. speed·money·mental은 본문에 나오지 않아요.","c":null},"h":"e14d6583f7"}]},{"u":5,"id":"hk1-05-4","no":4,"ko":"패션 피플의 비밀","items":[{"n":1,"t":"tf","q":"The princess and other ladies did not want to show their bald heads.","ko":"공주와 다른 귀부인들은 그들의 민머리를 보여주기를 원하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The princess and other ladies didn’t want to show their bald heads.","공주와 다른 귀부인들은 그들의 민머리를 보여주기를 원하지 않았다."]],"w":"7번 문장에 didn’t want to show their bald heads가 그대로 있어요.","c":"T"},"h":"fb2fa5880f"},{"n":2,"t":"tf","q":"The nobles from Portugal sailed to Brazil to conquer it.","ko":"포르투갈의 귀족들은 브라질을 정복하기 위해 항해했다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"In the early 1800s, Napoleon and his armies were trying to conquer Europe.","1800년대 초반에, 나폴레옹과 그의 군대는 유럽을 정복하기 위해 노력하고 있었다."],[4,"Nobles from Portugal were afraid, so they sailed to Brazil to escape.","포르투갈의 귀족들은 겁이 나서, 도망치기 위해 브라질로 항해했다."]],"w":"4번에서 포르투갈의 귀족들이 브라질로 간 이유는 to escape(도망치기 위해)예요. 유럽을 정복하려고 한 쪽은 나폴레옹과 그의 군대(3번)예요.","c":"F"},"h":"b1cd6c097d"},{"n":3,"t":"tf","q":"Everyone on the ship got head lice on the way to Brazil.","ko":"배에 탄 모두가 브라질로 가는 길에 머릿니를 갖게 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"On the way, unfortunately, everyone on the ship got head lice.","불행히도, 가는 길에, 배에 탄 모두가 머릿니를 갖게 되었다."]],"w":"5번 문장에서 가는 길에(On the way) 배에 탄 모두가(everyone on the ship) 머릿니를 갖게 되었다고 해요.","c":"T"},"h":"c618819551"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the early 1800s, Napoleon and his armies were trying to conquer Europe.)","ko":"1800년대 초반에, 나폴레옹과 그의 군대는 유럽을 정복하기 위해 노력하고 있었다.","opts":["도망치다","정복하다","방문하다","가르치다"],"word":"conquer","r":{"a":"2) 정복하다","ev":"3~4번 문장","s":[[3,"In the early 1800s, Napoleon and his armies were trying to conquer Europe.","1800년대 초반에, 나폴레옹과 그의 군대는 유럽을 정복하기 위해 노력하고 있었다."],[4,"Nobles from Portugal were afraid, so they sailed to Brazil to escape.","포르투갈의 귀족들은 겁이 나서, 도망치기 위해 브라질로 항해했다."]],"w":"3번에서 나폴레옹의 군대가 유럽을 conquer하려 했고, 4번에서 귀족들이 겁이 나서 도망쳤어요. 겁날 만한 일이니 '정복하다'예요.","c":2},"h":"ec4fadad82"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The princess and other ladies didn’t want to show their bald heads.)","ko":"공주와 다른 귀부인들은 그들의 민머리를 보여주기를 원하지 않았다.","opts":["긴","더러운","대머리의","화려한"],"word":"bald","r":{"a":"3) 대머리의","ev":"6~7번 문장","s":[[6,"They had to shave their heads, even the princess.","그들은, 심지어 공주도, 머리를 밀어야 했다."],[7,"The princess and other ladies didn’t want to show their bald heads.","공주와 다른 귀부인들은 그들의 민머리를 보여주기를 원하지 않았다."]],"w":"6번에서 머리를 밀어야 했으니 bald heads는 머리카락이 없는 '민머리'예요. 그래서 7번에서 보여주기 싫어했어요.","c":3},"h":"3ee4acf91c"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nNobles from Portugal were afraid, so they sailed to Brazil to escape.","ko":"밑줄 친 they가 가리키는 것은?","sko":"포르투갈의 귀족들은 겁이 나서, 도망치기 위해 브라질로 항해했다.","opts":["브라질 여성들","나폴레옹과 그의 군대","배의 선원들","포르투갈의 귀족들"],"r":{"a":"4) 포르투갈의 귀족들","ev":"4번 문장","s":[[4,"Nobles from Portugal were afraid, so they sailed to Brazil to escape.","포르투갈의 귀족들은 겁이 나서, 도망치기 위해 브라질로 항해했다."]],"w":"브라질로 항해한 것은 겁이 난 포르투갈의 귀족들이에요. 나폴레옹의 군대는 겁을 준 쪽이고, 브라질 여성들은 9번에서 처음 나와요.","c":4},"h":"b6296a48c9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The secret to becoming a fashionista was head lice!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"패셔니스타가 되는 것의 비결은 머릿니였다!","opts":["패셔니스타가 되는 비결은 머릿니였다.","머릿니를 없애는 것이 패셔니스타의 비결이었다.","패셔니스타는 머릿니 때문에 터번을 벗었다.","머릿니가 있으면 패셔니스타가 될 수 없었다."],"r":{"a":"1) 패셔니스타가 되는 비결은 머릿니였다.","ev":"5~6번, 8번, 12번 문장","s":[[5,"On the way, unfortunately, everyone on the ship got head lice.","불행히도, 가는 길에, 배에 탄 모두가 머릿니를 갖게 되었다."],[6,"They had to shave their heads, even the princess.","그들은, 심지어 공주도, 머리를 밀어야 했다."],[8,"Therefore, they wore turbans when they arrived in Brazil.","그래서, 그들은 브라질에 도착했을 때 터번을 썼다."],[12,"The secret to becoming a fashionista was head lice!","패셔니스타가 되는 것의 비결은 머릿니였다!"]],"w":"머릿니 때문에 머리를 밀고(5~6번) 터번을 썼고(8번), 그것이 유행이 되었으니 패션 유행의 시작이 머릿니였다는 뜻이에요.","c":1},"h":"f5cff784ae"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["나폴레옹은 귀족들에게서 도망치려고 브라질로 항해했다.","공주조차 머릿니 때문에 머리를 밀어야 했다.","공주가 배에서 머릿니가 생긴 유일한 사람이었다.","브라질 여성들은 터번이 종교적인 전통이라고 생각했다."],"opts":["Napoleon sailed to Brazil to escape from the nobles.","Even the princess had to shave her head because of head lice.","The princess was the only person who got head lice on the ship.","The Brazilian women thought the turbans were a religious tradition."],"r":{"a":"2) Even the princess had to shave her head because of head lice.","ev":"3~6번, 10번 문장","s":[[3,"In the early 1800s, Napoleon and his armies were trying to conquer Europe.","1800년대 초반에, 나폴레옹과 그의 군대는 유럽을 정복하기 위해 노력하고 있었다."],[4,"Nobles from Portugal were afraid, so they sailed to Brazil to escape.","포르투갈의 귀족들은 겁이 나서, 도망치기 위해 브라질로 항해했다."],[5,"On the way, unfortunately, everyone on the ship got head lice.","불행히도, 가는 길에, 배에 탄 모두가 머릿니를 갖게 되었다."],[6,"They had to shave their heads, even the princess.","그들은, 심지어 공주도, 머리를 밀어야 했다."],[10,"They thought the turbans were a fashion trend from Europe, and they began to wear turbans as well.","그들은 터번이 유럽에서 온 패션 유행이라고 생각했고, 그들 역시 터번을 쓰기 시작했다."]],"w":"5~6번에서 모두가 머릿니를 갖게 되었고 공주도 머리를 밀어야 했어요. 배로 도망친 쪽은 나폴레옹이 아니라 포르투갈 귀족들이고(3~4번), 브라질 여성들은 터번을 유럽의 패션 유행이라고 생각했어요(10번).","c":2},"h":"cd30e6ded9"},{"n":9,"t":"sum","q":"Portuguese nobles sailed to Brazil to escape Napoleon. On the ship, everyone got (A), so they shaved their heads and wore (B) in Brazil.","ko":"포르투갈 귀족들은 나폴레옹을 피해 브라질로 항해했다. 배에서 모두가 (A)가 생겨서 머리를 밀고 브라질에서 (B)를 썼다.","oko":["(A) 머릿니 / (B) 장갑","(A) 감기 / (B) 터번","(A) 머릿니 / (B) 터번","(A) 열병 / (B) 신발","(A) 머릿니 / (B) 마스크"],"opts":["(A) head lice / (B) gloves","(A) a cold / (B) turbans","(A) head lice / (B) turbans","(A) a fever / (B) shoes","(A) head lice / (B) masks"],"r":{"a":"3) (A) head lice / (B) turbans","ev":"4~6번, 8번 문장","s":[[4,"Nobles from Portugal were afraid, so they sailed to Brazil to escape.","포르투갈의 귀족들은 겁이 나서, 도망치기 위해 브라질로 항해했다."],[5,"On the way, unfortunately, everyone on the ship got head lice.","불행히도, 가는 길에, 배에 탄 모두가 머릿니를 갖게 되었다."],[6,"They had to shave their heads, even the princess.","그들은, 심지어 공주도, 머리를 밀어야 했다."],[8,"Therefore, they wore turbans when they arrived in Brazil.","그래서, 그들은 브라질에 도착했을 때 터번을 썼다."]],"w":"5번에서 모두가 head lice(머릿니)를 갖게 되었고, 6번에서 머리를 밀었으며, 8번에서 브라질에 도착했을 때 turbans(터번)를 썼어요.","c":3},"h":"562c56c77b"},{"n":10,"t":"fill","q":"Brazilian women thought turbans were a fashion [A] from Europe, and the [B] to becoming a fashionista was head lice.","ko":"브라질 여성들은 터번이 유럽에서 온 패션 [A]이라고 생각했고, 패셔니스타가 되는 [B]는 머릿니였다.","bank":["trend","secret","army","noble","shave","religion"],"bko":{"trend":"유행","secret":"비결","army":"군대","noble":"귀족","shave":"밀다","religion":"종교"},"r":{"a":"[A] trend, [B] secret","ev":"10번, 12번 문장","s":[[10,"They thought the turbans were a fashion trend from Europe, and they began to wear turbans as well.","그들은 터번이 유럽에서 온 패션 유행이라고 생각했고, 그들 역시 터번을 쓰기 시작했다."],[12,"The secret to becoming a fashionista was head lice!","패셔니스타가 되는 것의 비결은 머릿니였다!"]],"w":"10번에서 터번을 a fashion trend from Europe(유럽에서 온 패션 유행)이라고 생각했고, 12번에서 The secret to becoming a fashionista was head lice라고 해요.","c":null},"h":"aa1be3f4fe"}]},{"u":6,"id":"hk1-06-1","no":1,"ko":"휴지, 어떻게 거나요?","items":[{"n":1,"t":"tf","q":"If the toilet paper is hung in the left way, your hand doesn’t have to touch the dirty wall.","ko":"화장지를 왼쪽 방식으로 걸면, 더러운 벽에 손이 닿을 필요가 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"If the toilet paper is hung in this way, your hand doesn’t have to touch the dirty wall.","만약 화장지가 이 방식으로 걸린다면, 더러운 벽에 손이 닿을 필요가 없다."]],"w":"5번 문장에 this way(왼쪽 방식)로 걸면 더러운 벽에 손이 닿을 필요가 없다는 말이 나와요. 본문과 같은 내용이에요.","c":"T"},"h":"bdafe20cfb"},{"n":2,"t":"tf","q":"Modern toilet paper was invented in 1981.","ko":"현대식 화장지는 1981년에 발명되었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Modern toilet paper was invented in 1891.","현대식 화장지는 1891년에 발명되었다."]],"w":"7번 문장에서 현대식 화장지는 1891년에 발명되었다고 해요. 1981년이 아니라 1891년이에요.","c":"F"},"h":"61a28d5e4a"},{"n":3,"t":"tf","q":"The people who hang the toilet paper the other way found many problems with it.","ko":"화장지를 다른 방식으로 건 사람들은 그것에 대해 많은 문제를 발견했다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"And they found no problems with it!","그리고 그들은 그것에 대해 아무런 문제도 발견하지 못했다!"]],"w":"10번 문장에서 그들은 아무런 문제도 발견하지 못했다(found no problems)고 해요. 많은 문제를 발견했다는 말은 반대예요.","c":"F"},"h":"c81e4f8d98"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They say it looks tidier because the loose end is slightly hidden.)","ko":"그들은 풀린 끝부분이 약간 가려져 있기 때문에 그것이 더 깔끔해 보인다고 말한다.","opts":["더 지저분한","더 깔끔한","더 어두운","더 무거운"],"word":"tidier","r":{"a":"2) 더 깔끔한","ev":"3번 문장","s":[[3,"They say it looks tidier because the loose end is slightly hidden.","그들은 풀린 끝부분이 약간 가려져 있기 때문에 그것이 더 깔끔해 보인다고 말한다."]],"w":"끝부분이 가려져 있어서 그렇게 보인다고 했으니 보기 좋게 정돈된 느낌이에요. tidy = 깔끔한이고, tidier는 '더 깔끔한'이에요.","c":2},"h":"3cdddf1ec2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Originally, it was intended to hang like the left way.)","ko":"원래, 그것은 왼쪽 방식처럼 걸도록 의도되었다.","opts":["갑자기","나중에","결국","원래"],"word":"Originally","r":{"a":"4) 원래","ev":"8번 문장","s":[[8,"Originally, it was intended to hang like the left way.","원래, 그것은 왼쪽 방식처럼 걸도록 의도되었다."]],"w":"8번은 현대식 화장지가 처음 발명되었을 때의 이야기예요. 바로 뒤 9번에서 However(하지만)로 달라진 모습이 나오므로 originally는 '원래, 처음에는'이에요.","c":4},"h":"37490263e9"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey say it looks tidier because the loose end is slightly hidden.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 풀린 끝부분이 약간 가려져 있기 때문에 그것이 더 깔끔해 보인다고 말한다.","opts":["화장지","왼쪽 방식을 쓰는 사람들","오른쪽 방식을 선호하는 몇몇 사람들","더러운 벽"],"r":{"a":"3) 오른쪽 방식을 선호하는 몇몇 사람들","ev":"2~3번 문장","s":[[2,"Some people prefer the way on the right.","몇몇 사람들은 오른쪽에 있는 방식을 선호한다."],[3,"They say it looks tidier because the loose end is slightly hidden.","그들은 풀린 끝부분이 약간 가려져 있기 때문에 그것이 더 깔끔해 보인다고 말한다."]],"w":"말하는 주체는 사람이에요. 2번에서 오른쪽 방식을 선호한다고 한 Some people을 3번에서 They로 받았어요. 왼쪽 방식을 쓰는 사람들은 4번에서 But others로 따로 나와요.","c":3},"h":"3a198f5d81"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Also, it is easier to pull the tissue down.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"또한, 휴지를 끌어내리기가 더 쉽다.","opts":["또한, 휴지를 끌어내리기가 더 쉽다.","또한, 휴지를 끌어내리기가 더 어렵다.","또한, 휴지를 위로 올리기가 더 쉽다.","또한, 휴지를 끌어내릴 필요가 없다."],"r":{"a":"1) 또한, 휴지를 끌어내리기가 더 쉽다.","ev":"6번 문장","s":[[6,"Also, it is easier to pull the tissue down.","또한, 휴지를 끌어내리기가 더 쉽다."]],"w":"easier는 easy(쉬운)의 비교급이라 '더 쉬운'이에요. pull down은 끌어내리다예요. 어렵다, 올리다, 필요 없다는 문장과 다른 내용이에요.","c":1},"h":"5d71d5c630"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["모든 사람이 화장지를 거는 올바른 방식에 동의한다.","화장지를 거는 올바른 방식에 대한 논쟁은 지금까지 계속되어 왔다.","현대식 화장지는 오른쪽 방식으로 걸도록 처음 발명되었다.","논쟁은 사람들이 다른 방식으로 걸기 시작하자마자 끝났다."],"opts":["Everyone agrees on the correct way to hang toilet paper.","The debate over the correct way to hang toilet paper has continued until now.","Modern toilet paper was first made to hang like the right way.","The debate ended as soon as people began to hang it the other way."],"r":{"a":"2) The debate over the correct way to hang toilet paper has continued until now.","ev":"11번 문장","s":[[11,"Since then, the debate over the correct way of hanging toilet paper has continued.","그때부터, 화장지를 거는 것의 올바른 방식에 대한 논쟁은 계속되어 왔다."]],"w":"11번에서 그때부터 올바른 방식에 대한 논쟁이 계속되어 왔다고 해요. 모두가 동의하거나 논쟁이 끝났다는 말은 없고, 원래는 왼쪽 방식이었어요(8번).","c":2},"h":"6e11864701"},{"n":9,"t":"sum","q":"Some people prefer the right way because it looks (A). But others think the left way is (B).","ko":"어떤 사람들은 오른쪽 방식이 (A) 보여서 선호한다. 하지만 다른 사람들은 왼쪽 방식이 (B)하다고 생각한다.","oko":["(A) 더 깔끔해 / (B) 더 지저분","(A) 더 지저분해 / (B) 더 깔끔","(A) 더 싸 / (B) 더 깔끔","(A) 더 깔끔해 / (B) 더 깔끔","(A) 더 낡아 / (B) 더 새로"],"opts":["(A) tidier / (B) dirtier","(A) dirtier / (B) cleaner","(A) cheaper / (B) cleaner","(A) tidier / (B) cleaner","(A) older / (B) newer"],"r":{"a":"4) (A) tidier / (B) cleaner","ev":"2~4번 문장","s":[[2,"Some people prefer the way on the right.","몇몇 사람들은 오른쪽에 있는 방식을 선호한다."],[3,"They say it looks tidier because the loose end is slightly hidden.","그들은 풀린 끝부분이 약간 가려져 있기 때문에 그것이 더 깔끔해 보인다고 말한다."],[4,"But others think the way on the left is actually cleaner.","하지만 다른 사람들은 왼쪽 방식이 실제로 더 깔끔하다고 생각한다."]],"w":"오른쪽 방식을 좋아하는 사람들은 더 깔끔해(tidier) 보인다고 하고(3번), 다른 사람들은 왼쪽 방식이 실제로 더 깔끔하다(cleaner)고 해요(4번).","c":4},"h":"9421985d17"},{"n":10,"t":"fill","q":"Modern toilet paper was [A] in 1891, but some people began to hang it in the [B] way.","ko":"현대식 화장지는 1891년에 [A]되었지만, 몇몇 사람들은 그것을 [B] 방식으로 걸기 시작했다.","bank":["invented","other","dirty","loose","hidden","continued"],"bko":{"invented":"발명된","other":"다른, 나머지","loose":"풀린","hidden":"가려진","continued":"계속된","dirty":"더러운"},"r":{"a":"[A] invented, [B] other","ev":"7, 9번 문장","s":[[7,"Modern toilet paper was invented in 1891.","현대식 화장지는 1891년에 발명되었다."],[9,"However, some people began to hang the toilet paper in the other way.","하지만, 몇몇 사람들이 화장지를 오른쪽 방식으로 걸기 시작했다."]],"w":"7번 was invented in 1891(1891년에 발명되었다), 9번 in the other way(다른 방식으로)에서 가져왔어요. hidden, loose는 끝부분 모양을 설명하는 말이고 dirty는 벽을 설명하는 말이라 여기 맞지 않아요.","c":null},"h":"c29105b14c"}]},{"u":6,"id":"hk1-06-2","no":2,"ko":"바닷속 미스터리 서클","items":[{"n":1,"t":"tf","q":"The circular pattern on the seafloor looked like a piece of art.","ko":"해저의 원형 무늬는 하나의 예술 작품처럼 보였다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It was a two-meter-wide circular pattern, and it looked like a piece of art.","그것은 2미터 너비의 원형 무늬였는데, 하나의 예술 작품처럼 보였다."]],"w":"2번 문장에서 그것은 2미터 너비의 원형 무늬였고 예술 작품처럼 보였다고 해요.","c":"T"},"h":"9a1af79924"},{"n":2,"t":"tf","q":"The female pufferfish makes the circle on the seafloor.","ko":"암컷 복어가 해저에 원을 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"First, the male fish creates a circle on the seafloor.","먼저, 수컷 물고기는 해저에 원을 만든다."]],"w":"7번 문장에서 원을 만드는 것은 수컷 물고기(the male fish)예요. 암컷은 둥지가 완성된 뒤 알을 낳아요(12번).","c":"F"},"h":"2404636f1b"},{"n":3,"t":"tf","q":"A female pufferfish lays eggs in the nest when it is complete.","ko":"암컷 복어는 둥지가 완성되면 그 안에 알을 낳는다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"When the nest is complete, a female pufferfish will lay eggs in it.","둥지가 완성되면, 암컷 복어는 그 안에 알을 낳을 것이다."]],"w":"12번 문장에 둥지가 완성되면 암컷 복어가 그 안에 알을 낳는다고 나와요.","c":"T"},"h":"bdf54f86eb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day, a number of divers discovered something strange…)","ko":"어느 날, 많은 잠수부들은 무언가 낯선 것을 발견했다.","opts":["잃어버렸다","발견했다","만들었다","먹었다"],"word":"discovered","r":{"a":"2) 발견했다","ev":"1번 문장","s":[[1,"One day, a number of divers discovered something strange on the seafloor near Japan.","어느 날, 많은 잠수부들은 일본 근처의 해저에서 무언가 낯선 것을 발견했다."]],"w":"잠수부들이 바다 밑에서 처음 보는 낯선 것을 찾아냈다는 내용이에요. discover = 발견하다예요.","c":2},"h":"f3da358e35"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Finally, it gathers up the sand in the center to make a nest.)","ko":"마지막으로, 그것은 둥지를 만들기 위해 중앙에 모래를 모은다.","opts":["흩뿌린다","파낸다","모은다","씻어 낸다"],"word":"gathers up","r":{"a":"3) 모은다","ev":"10번 문장","s":[[10,"Finally, it gathers up the sand in the center to make a nest.","마지막으로, 그것은 둥지를 만들기 위해 중앙에 모래를 모은다."]],"w":"가운데에 모래를 모아야 둥지가 만들어져요. gather up = 모으다예요. 흩뿌리면 둥지를 만들 수 없어요.","c":3},"h":"c570b89c30"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt builds a structure that is 20 times its size by only using its fins!","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 지느러미만 사용해서 자기 몸의 20배 크기의 구조물을 짓는다!","opts":["12센티미터 길이의 복어","일본 근처의 잠수부들","해저의 원형 무늬","물고기의 지느러미"],"r":{"a":"1) 12센티미터 길이의 복어","ev":"5~6번 문장","s":[[5,"The fish is a species of pufferfish that is only 12 centimeters long.","그 물고기는 겨우 12센티미터 길이인 복어의 한 종이다."],[6,"It builds a structure that is 20 times its size by only using its fins!","그것은 지느러미만 사용해서 자기 몸의 20배 크기의 구조물을 짓는다!"]],"w":"구조물을 짓는 주인공은 5번에 나온 12센티미터짜리 복어예요. 6번에서 its fins(그것의 지느러미)라고 했으니 지느러미는 복어의 것이지 It이 아니에요.","c":1},"h":"90d4fd7dac"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The entire process takes six weeks.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"전체 과정은 6주가 걸린다.","opts":["전체 과정은 6일이 걸린다.","전체 과정은 6개월이 걸린다.","전체 과정은 6주가 걸린다.","전체 과정은 6주 뒤에 시작된다."],"r":{"a":"3) 전체 과정은 6주가 걸린다.","ev":"11번 문장","s":[[11,"The entire process takes six weeks.","전체 과정은 6주가 걸린다."]],"w":"entire = 전체의, process = 과정이고 take six weeks = 6주가 걸리다예요. 시작이 아니라 걸리는 기간을 말해요.","c":3},"h":"3e691f308e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["잠수부들은 한국 근처 호수에서 원형 무늬를 발견했다.","잠수부들은 일본 근처 해저에서 낯선 것을 발견했다.","어부들이 일본 근처 해저에서 원형 무늬를 발견했다.","잠수부들은 일본 근처 해저에서 물고기 떼를 발견했다."],"opts":["Divers discovered a circular pattern in a lake near Korea.","Divers discovered something strange on the seafloor near Japan.","Fishermen discovered a circular pattern on the seafloor near Japan.","Divers discovered a lot of fish on the seafloor near Japan."],"r":{"a":"2) Divers discovered something strange on the seafloor near Japan.","ev":"1번 문장","s":[[1,"One day, a number of divers discovered something strange on the seafloor near Japan.","어느 날, 많은 잠수부들은 일본 근처의 해저에서 무언가 낯선 것을 발견했다."]],"w":"1번 문장에 잠수부들(divers)이 일본 근처 해저(seafloor)에서 낯선 것을 발견했다고 나와요. 장소와 사람을 하나씩 바꾼 문장은 본문과 달라요.","c":2},"h":"b88b0585b9"},{"n":9,"t":"sum","q":"The tiny pufferfish is (A) long, but its structure is (B) its size.","ko":"그 작은 복어는 길이가 (A)이지만, 그것의 구조물은 자기 크기의 (B)이다.","oko":["(A) 12센티미터 / (B) 20배","(A) 2미터 / (B) 20배","(A) 12센티미터 / (B) 2배","(A) 20센티미터 / (B) 12배","(A) 2미터 / (B) 12배"],"opts":["(A) 12 centimeters / (B) 20 times","(A) 2 meters / (B) 20 times","(A) 12 centimeters / (B) 2 times","(A) 20 centimeters / (B) 12 times","(A) 2 meters / (B) 12 times"],"r":{"a":"1) (A) 12 centimeters / (B) 20 times","ev":"5~6번 문장","s":[[5,"The fish is a species of pufferfish that is only 12 centimeters long.","그 물고기는 겨우 12센티미터 길이인 복어의 한 종이다."],[6,"It builds a structure that is 20 times its size by only using its fins!","그것은 지느러미만 사용해서 자기 몸의 20배 크기의 구조물을 짓는다!"]],"w":"5번에서 복어는 겨우 12센티미터이고, 6번에서 자기 크기의 20배인 구조물을 짓는다고 해요. 2미터는 원형 무늬의 너비예요(2번).","c":1},"h":"2ba8ecd7b3"},{"n":10,"t":"fill","q":"The male pufferfish first makes a [A] on the seafloor, and then waves its [B] along it.","ko":"수컷 복어는 먼저 해저에 [A]을 만들고, 그다음 그것을 따라 [B]를 흔든다.","bank":["circle","fins","divers","eggs","art","size"],"bko":{"circle":"원","fins":"지느러미","divers":"잠수부들","eggs":"알","art":"예술","size":"크기"},"r":{"a":"[A] circle, [B] fins","ev":"7~8번 문장","s":[[7,"First, the male fish creates a circle on the seafloor.","먼저, 수컷 물고기는 해저에 원을 만든다."],[8,"Then, it waves its fins along the circle.","그 후, 그것은 그 원을 따라 지느러미를 흔든다."]],"w":"7번에서 해저에 원(circle)을 만들고, 8번에서 그 원을 따라 지느러미(fins)를 흔든다고 해요. 알(eggs)은 둥지가 완성된 뒤 암컷이 낳는 것이에요(12번).","c":null},"h":"88cad9d2f3"}]},{"u":6,"id":"hk1-06-3","no":3,"ko":"왜 자꾸 그게 당기지?","items":[{"n":1,"t":"tf","q":"Eating spicy food makes you feel no pain at all.","ko":"매운 음식을 먹는 것은 고통을 전혀 느끼지 않게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Eating spicy food actually makes you feel pain.","매운 음식을 먹는 것은 사실 고통을 느끼도록 만든다."]],"w":"2번 문장에서 매운 음식을 먹으면 사실 고통을 느낀다고 해요. 고통을 전혀 느끼지 않는다는 말은 반대예요.","c":"F"},"h":"5b8481db7c"},{"n":2,"t":"tf","q":"The stomach sends a signal to the brain when you eat something spicy.","ko":"매운 것을 먹으면 위가 뇌에 신호를 보낸다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"When your tongue feels something spicy, it sends a signal to the brain.","당신의 혀는 무언가 매운 것을 느낄 때, 뇌에 신호를 보낸다."]],"w":"5번 문장에서 신호를 보내는 것은 위가 아니라 혀(tongue)예요.","c":"F"},"h":"bde5986a44"},{"n":3,"t":"tf","q":"Many people still want spicy food when they get stressed.","ko":"많은 사람들은 스트레스를 받으면 여전히 매운 음식을 원한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"However, many people still want spicy food when they get stressed.","하지만, 많은 사람들은 그런데도 스트레스를 받았을 때 매운 음식을 원한다."]],"w":"3번 문장에 many people still want spicy food when they get stressed가 그대로 나와요.","c":"T"},"h":"74b8a6aba2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When your tongue feels something spicy, it sends a signal to the brain.)","ko":"혀는 무언가 매운 것을 느낄 때, 뇌에 신호를 보낸다.","opts":["신호","소리","맛","고통"],"word":"signal","r":{"a":"1) 신호","ev":"5번 문장","s":[[5,"When your tongue feels something spicy, it sends a signal to the brain.","당신의 혀는 무언가 매운 것을 느낄 때, 뇌에 신호를 보낸다."]],"w":"혀가 느낀 것을 뇌에 알려 주는 것이니 '신호'가 맞아요. 소리나 맛이 아니라 정보를 전하는 신호예요.","c":1},"h":"a247368d41"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This is why you want something spicy especially when you feel stressed.)","ko":"이것이 특히 스트레스를 받았다고 느낄 때 무언가 매운 것을 원하는 이유이다.","opts":["가끔","특히","절대","대신"],"word":"especially","r":{"a":"2) 특히","ev":"9번 문장","s":[[9,"This is why you want something spicy especially when you feel stressed.","이것이 특히 스트레스를 받았다고 느낄 때 무언가 매운 먹을 것을 원하는 이유이다."]],"w":"스트레스를 받을 때 매운 것을 원하는 일이 유독 많다는 뜻이에요. especially = 특히예요.","c":2},"h":"cf723c6624"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nYour brain tells you to eat it to lower your stress!","ko":"밑줄 친 it이 가리키는 것은?","sko":"당신의 뇌가 스트레스를 낮추기 위해 당신에게 그것을 먹으라고 말하는 것이다!","opts":["스트레스","엔도르핀","매운 것","호르몬"],"r":{"a":"3) 매운 것","ev":"9~10번 문장","s":[[9,"This is why you want something spicy especially when you feel stressed.","이것이 특히 스트레스를 받았다고 느낄 때 무언가 매운 먹을 것을 원하는 이유이다."],[10,"Your brain tells you to eat it to lower your stress!","당신의 뇌가 스트레스를 낮추기 위해 당신에게 그것을 먹으라고 말하는 것이다!"]],"w":"먹는 대상은 9번에 나온 something spicy(매운 것)예요. 스트레스나 엔도르핀은 먹을 수 없어요.","c":3},"h":"6493853319"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, you usually feel better after eating spicy food.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로, 당신은 매운 음식을 먹은 후에 대개 기분이 나아진다.","opts":["결과적으로, 매운 음식을 먹은 후에 대개 배가 아프다.","결과적으로, 매운 음식을 먹기 전에 기분이 좋아진다.","결과적으로, 매운 음식을 먹으면 스트레스를 더 받는다.","결과적으로, 매운 음식을 먹은 후에 대개 기분이 나아진다."],"r":{"a":"4) 결과적으로, 매운 음식을 먹은 후에 대개 기분이 나아진다.","ev":"8번 문장","s":[[8,"As a result, you usually feel better after eating spicy food.","결과적으로, 당신은 매운 음식을 먹은 후에 대개 기분이 나아진다."]],"w":"feel better는 기분이 나아지다이고 after eating은 먹은 후에예요. 먹기 전, 배가 아픔, 스트레스 증가는 본문에 없어요.","c":4},"h":"d4dc961926"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["엔도르핀은 고통을 더 크게 만든다.","혀는 매운 것을 느끼면 위에 신호를 보낸다.","뇌는 엔도르핀이라고 불리는 호르몬을 내보낸다.","엔도르핀은 매운 음식을 먹기 전에만 나온다."],"opts":["Endorphins make the pain bigger.","The tongue sends a signal to the stomach.","The brain releases hormones called endorphins.","Endorphins only appear before eating spicy food."],"r":{"a":"3) The brain releases hormones called endorphins.","ev":"6번 문장","s":[[6,"Your brain then releases hormones called endorphins.","당신의 뇌는 그러면 엔도르핀이라고 불리는 호르몬을 내보낸다."]],"w":"6번에서 뇌가 엔도르핀이라고 불리는 호르몬을 내보낸다고 해요. 엔도르핀은 고통을 줄이고(7번), 신호는 뇌로 가요(5번).","c":3},"h":"7efcde11ae"},{"n":9,"t":"sum","q":"The tongue sends a signal to the (A), which then releases (B).","ko":"혀는 (A)에 신호를 보내고, 그것은 그다음 (B)를 내보낸다.","oko":["(A) 뇌 / (B) 엔도르핀","(A) 위 / (B) 엔도르핀","(A) 뇌 / (B) 스트레스","(A) 심장 / (B) 고통","(A) 위 / (B) 스트레스"],"opts":["(A) brain / (B) endorphins","(A) stomach / (B) endorphins","(A) brain / (B) stress","(A) heart / (B) pain","(A) stomach / (B) stress"],"r":{"a":"1) (A) brain / (B) endorphins","ev":"5~6번 문장","s":[[5,"When your tongue feels something spicy, it sends a signal to the brain.","당신의 혀는 무언가 매운 것을 느낄 때, 뇌에 신호를 보낸다."],[6,"Your brain then releases hormones called endorphins.","당신의 뇌는 그러면 엔도르핀이라고 불리는 호르몬을 내보낸다."]],"w":"혀가 뇌(brain)에 신호를 보내고(5번), 뇌가 엔도르핀(endorphins)이라는 호르몬을 내보내요(6번). 위나 심장은 나오지 않고, 스트레스와 고통은 내보내는 것이 아니에요.","c":1},"h":"848c3d25ec"},{"n":10,"t":"fill","q":"Endorphins [A] the pain and cause a positive feeling, so you usually feel [B] after eating spicy food.","ko":"엔도르핀은 고통을 [A]하고 긍정적인 감정을 일으키므로, 매운 음식을 먹은 후에 대개 기분이 [B] 느낌이 든다.","bank":["reduce","better","cause","worse","stress","tongue"],"bko":{"reduce":"줄이다","better":"더 나은","cause":"일으키다","worse":"더 나쁜","stress":"스트레스","tongue":"혀"},"r":{"a":"[A] reduce, [B] better","ev":"7~8번 문장","s":[[7,"These reduce the pain, and they also cause a positive feeling in your body.","이것은 고통을 줄이고, 신체에 긍정적인 감정도 불러일으킨다."],[8,"As a result, you usually feel better after eating spicy food.","결과적으로, 당신은 매운 음식을 먹은 후에 대개 기분이 나아진다."]],"w":"7번 These reduce the pain(고통을 줄인다), 8번 you usually feel better(기분이 나아진다)에서 가져왔어요. worse(더 나쁜)는 반대 뜻이고, cause를 넣으면 엔도르핀이 고통을 일으킨다는 뜻이 되어 맞지 않아요.","c":null},"h":"bc77b5e2bd"}]},{"u":6,"id":"hk1-06-4","no":4,"ko":"어딘가 익숙한 이 장면은?!","items":[{"n":1,"t":"tf","q":"A bomb is going to explode in 10 seconds in the movie scene.","ko":"영화 장면에서 폭탄은 10초 후에 터질 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"A bomb is going to explode in 10 seconds.","폭탄이 10초 후면 터질 것이다."]],"w":"2번 문장에 폭탄이 10초 후에 터질 것(is going to explode in 10 seconds)이라고 나와요.","c":"T"},"h":"4231a0a90c"},{"n":2,"t":"tf","q":"Clichés are new and unique to the audience.","ko":"클리셰는 청중에게 새롭고 독특하다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"They are not fresh or unique.","그것은 신선하거나 독특하지 않다."]],"w":"9번 문장에서 클리셰는 신선하거나 독특하지 않다(not fresh or unique)고 해요.","c":"F"},"h":"ccd24ec7a8"},{"n":3,"t":"tf","q":"Some clichés are loved by a wide audience.","ko":"어떤 클리셰는 많은 청중에게 사랑받는다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Moreover, some clichés are simply loved by a wide audience.","게다가, 어떤 클리셰는 많은 청중에게 그냥 사랑받기도 한다."]],"w":"12번 문장에 some clichés are simply loved by a wide audience가 그대로 나와요.","c":"T"},"h":"00d47a245d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A bomb is going to explode in 10 seconds.)","ko":"폭탄이 10초 후면 터질 것이다.","opts":["얼어붙다","사라지다","터지다","멈추다"],"word":"explode","r":{"a":"3) 터지다","ev":"2번 문장","s":[[2,"A bomb is going to explode in 10 seconds.","폭탄이 10초 후면 터질 것이다."]],"w":"폭탄이 10초 후에 어떻게 되는지를 말해요. 남자가 전선을 잘라 막아야 하는 일(3번)이니 explode는 '터지다'예요.","c":3},"h":"a9e08fe623"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This is a common cliché.)","ko":"이것은 흔한 클리셰이다.","opts":["흔한","희귀한","위험한","조용한"],"word":"common","r":{"a":"1) 흔한","ev":"7번 문장","s":[[7,"This is a common cliché.","이것은 흔한 클리셰이다."]],"w":"7번 뒤에서 클리셰는 소설과 영화에 자주 나온다고 설명해요(8번). 자주 나오니 common은 '흔한'이에요.","c":1},"h":"152dccf932"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWe have seen this situation in many stories, but we still love seeing it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"우리는 많은 이야기들에서 이 상황을 본 적 있지만, 여전히 그것을 보는 것을 좋아한다.","opts":["폭탄이 터지는 장면","많은 이야기들","새로운 클리셰","삼각관계 같은 이 상황"],"r":{"a":"4) 삼각관계 같은 이 상황","ev":"13~14번 문장","s":[[13,"For example, the “love triangle” is a very popular cliché.","예를 들어, ‘삼각관계’는 매우 인기 있는 클리셰이다."],[14,"We have seen this situation in many stories, but we still love seeing it.","우리는 많은 이야기들에서 이 상황을 본 적 있지만, 여전히 그것을 보는 것을 좋아한다."]],"w":"14번의 this situation은 13번의 삼각관계 클리셰를 말하고, 보는 것을 좋아하는 대상 it은 바로 그 상황이에요. 이야기들(stories)은 상황을 본 장소예요.","c":4},"h":"43e76a57ac"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He cuts the right wire, and the bomb stops at one second!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 올바른 전선을 자르고, 폭탄은 1초에서 멈춘다!","opts":["그는 잘못된 전선을 자르고, 폭탄이 터진다.","그는 올바른 전선을 자르고, 폭탄은 1초에서 멈춘다.","그는 전선을 자르지 않고, 폭탄은 1초에서 멈춘다.","그는 올바른 전선을 자르고, 폭탄은 10초 뒤에 터진다."],"r":{"a":"2) 그는 올바른 전선을 자르고, 폭탄은 1초에서 멈춘다.","ev":"6번 문장","s":[[6,"He cuts the right wire, and the bomb stops at one second!","그는 올바른 전선을 자르고, 폭탄은 1초에서 멈춘다!"]],"w":"right wire는 올바른 전선이에요. 남자가 그것을 자르면(cuts) 폭탄이 1초에서 멈춰요. 잘못된 전선이나 터진다는 말은 본문과 달라요.","c":2},"h":"35494bad49"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["클리셰는 항상 나쁘다.","사람들은 클리셰가 있는 이야기를 이해하기 더 어렵다고 느낀다.","클리셰는 소설에서만 나온다.","클리셰가 있는 이야기는 이미 익숙해서 더 빠르고 쉽게 이해된다."],"opts":["Clichés are always bad.","People find stories with clichés harder to understand.","Clichés appear only in novels.","We understand stories with clichés more quickly and easily because we are familiar with them."],"r":{"a":"4) We understand stories with clichés more quickly and easily because we are familiar with them.","ev":"8, 10, 11번 문장","s":[[8,"Clichés are phrases or actions that often appear in novels and movies.","클리셰는 소설과 영화 속에 자주 나오는 관용구나 행위이다."],[10,"However, this doesn’t mean they are always bad.","하지만, 이것은 그것이 항상 나쁘다는 것을 의미하지는 않는다."],[11,"We understand stories that have clichés more quickly and easily because we are already familiar with them.","우리는 클리셰에 이미 익숙하기 때문에 클리셰가 있는 이야기들을 더 빠르고 쉽게 이해한다."]],"w":"11번에서 클리셰가 있는 이야기는 익숙해서 더 빠르고 쉽게 이해된다고 해요. 항상 나쁘지 않고(10번), 소설과 영화 모두에 나와요(8번).","c":4},"h":"11a4f063bf"},{"n":9,"t":"sum","q":"Clichés are phrases or actions that often (A) in novels and movies, but they are not (B).","ko":"클리셰는 소설과 영화에 자주 (A) 관용구나 행위이지만, 그것들은 (B) 않다.","oko":["(A) 사라지는 / (B) 익숙하지","(A) 나오는 / (B) 익숙하지","(A) 사라지는 / (B) 신선하지","(A) 숨는 / (B) 인기 있지","(A) 나오는 / (B) 신선하지"],"opts":["(A) disappear / (B) familiar","(A) appear / (B) familiar","(A) disappear / (B) fresh","(A) hide / (B) popular","(A) appear / (B) fresh"],"r":{"a":"5) (A) appear / (B) fresh","ev":"8~9번 문장","s":[[8,"Clichés are phrases or actions that often appear in novels and movies.","클리셰는 소설과 영화 속에 자주 나오는 관용구나 행위이다."],[9,"They are not fresh or unique.","그것은 신선하거나 독특하지 않다."]],"w":"8번에서 클리셰는 소설과 영화에 자주 나오는(appear) 것이라 하고, 9번에서 신선하거나 독특하지 않다(not fresh)고 해요.","c":5},"h":"2f573207b5"},{"n":10,"t":"fill","q":"We have [A] this situation in many stories, but we still [B] seeing it.","ko":"우리는 많은 이야기들에서 이 상황을 [A] 적 있지만, 여전히 그것을 보는 것을 [B].","bank":["seen","love","hate","cut","explode","avoid"],"bko":{"seen":"본 (see의 과거분사)","love":"좋아하다","hate":"싫어하다","cut":"자르다","explode":"터지다","avoid":"피하다"},"r":{"a":"[A] seen, [B] love","ev":"14번 문장","s":[[14,"We have seen this situation in many stories, but we still love seeing it.","우리는 많은 이야기들에서 이 상황을 본 적 있지만, 여전히 그것을 보는 것을 좋아한다."]],"w":"14번 We have seen this situation, but we still love seeing it에서 가져왔어요. 클리셰를 여전히 좋아한다는 내용이라 hate나 avoid는 반대예요. cut과 explode는 앞의 폭탄 장면(2~6번)에 나온 말이에요.","c":null},"h":"c5dbae275a"}]},{"u":7,"id":"hk1-07-1","no":1,"ko":"안 들려요!","items":[{"n":1,"t":"tf","q":"The theater was empty when Oliver walked in.","ko":"Oliver가 들어갔을 때 극장은 비어 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The theater was empty when he walked in.","그가 들어갔을 때 극장은 비어 있었다."]],"w":"3번 문장에 The theater was empty when he walked in이 그대로 있어요. 극장이 비어 있었다는 내용과 일치해요.","c":"T"},"h":"249abba68d"},{"n":2,"t":"tf","q":"The man answered Oliver kindly.","ko":"그 남자는 Oliver에게 친절하게 대답했다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"“I hope not, sir,” the man responded angrily.","“듣지 못하셨으면 하는데요.”라고 남자가 화가 난 채로 대답했다."]],"w":"13번 문장에서 남자는 angrily(화가 난 채로) 대답했어요. 친절하게(kindly)는 반대예요.","c":"F"},"h":"41f74b6541"},{"n":3,"t":"tf","q":"The couple sat down right behind Oliver.","ko":"그 연인은 Oliver의 바로 뒤에 앉았다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"They sat down right behind him.","그들은 그의 바로 뒤에 앉았다."]],"w":"7번 문장에서 They sat down right behind him이라고 했어요. They는 연인이고 him은 Oliver예요.","c":"T"},"h":"f7b68b961c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (“Excuse me, but I can’t hear,” he whispered.)","ko":"“실례합니다만, 들을 수가 없네요.”라고 그가 속삭였다.","opts":["소리쳤다","웃었다","속삭였다","노래했다"],"word":"whispered","r":{"a":"3) 속삭였다","ev":"10~11번 문장","s":[[10,"Finally, Oliver turned around.","마침내, Oliver는 뒤돌아보았다."],[11,"“Excuse me, but I can’t hear,” he whispered.","“실례합니다만, 들을 수가 없네요.”라고 그가 속삭였다."]],"w":"10번에서 Oliver가 뒤돌아봐요. 그리고 11번에서 연인에게 조심스럽게 말하는 장면이에요. 극장에서 작게 말하는 것이므로 whisper = 속삭이다예요.","c":3},"h":"744236d645"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The theater was empty when he walked in.)","ko":"그가 들어갔을 때 극장은 비어 있었다.","opts":["비어 있는","시끄러운","가득 찬","어두운"],"word":"empty","r":{"a":"1) 비어 있는","ev":"3~5번 문장","s":[[3,"The theater was empty when he walked in.","그가 들어갔을 때 극장은 비어 있었다."],[4,"“How lucky I am!”, he said.","“얼마나 운이 좋은가!”라고 그가 말했다."],[5,"He could enjoy the movie in a quiet environment.","그는 조용한 환경에서 영화를 즐길 수 있었다."]],"w":"3번에서 극장이 empty라서 Oliver가 4번에서 운이 좋다고 말하고, 5번에서 조용한 환경이라고 해요. 사람이 없다는 뜻이므로 empty = 비어 있는이에요.","c":1},"h":"85d454e1aa"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nHe tried to pay attention to the movie, but they kept talking loudly.","ko":"그는 영화에 집중하기 위해 노력했지만, 그들은 계속해서 크게 이야기했다.","opts":["극장 직원들","그 연인","Oliver의 친구들","영화 속 인물들"],"sko":"그는 영화에 집중하기 위해 노력했지만, 그들은 계속해서 크게 이야기했다.","r":{"a":"2) 그 연인","ev":"6~9번 문장","s":[[6,"However, as soon as the film started, a couple entered.","하지만, 영화가 시작하자마자, 한 연인이 입장했다."],[7,"They sat down right behind him.","그들은 그의 바로 뒤에 앉았다."],[8,"Then, they started to talk to each other.","그 후, 그들은 서로에게 이야기를 하기 시작했다."],[9,"He tried to pay attention to the movie, but they kept talking loudly.","그는 영화에 집중하기 위해 노력했지만, 그들은 계속해서 크게 이야기했다."]],"w":"6번에서 연인(a couple)이 들어와 7번에서 앉고 8번에서 이야기를 시작해요. 9번의 they는 계속 크게 이야기하는 그 연인이에요.","c":2},"h":"c8c9403fd5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"“This is a private conversation!”\"","ko":"“이건 사적인 대화입니다!”","opts":["이 영화는 매우 재미있네요.","우리와 함께 이야기해요.","극장에서는 이야기하면 안 됩니다.","우리끼리 하는 이야기니까 듣지 말아 주세요."],"sko":"“이건 사적인 대화입니다!”","r":{"a":"4) 우리끼리 하는 이야기니까 듣지 말아 주세요.","ev":"13~14번 문장","s":[[13,"“I hope not, sir,” the man responded angrily.","“듣지 못하셨으면 하는데요.”라고 남자가 화가 난 채로 대답했다."],[14,"“This is a private conversation!”","“이건 사적인 대화입니다!”"]],"w":"private은 '사적인'이라는 뜻이라서, 다른 사람이 아니라 둘만을 위한 대화라는 말이에요. 남자는 Oliver가 대화를 듣고 있다고 생각해서 화를 낸 거예요.","c":4},"h":"639ff0b37b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Oliver went to the theater with the couple.","The couple entered the theater after the film started.","Oliver was angry before the film started.","The man said sorry to Oliver."],"oko":["Oliver는 그 연인과 함께 극장에 갔다.","그 연인은 영화가 시작한 후에 극장에 들어왔다.","Oliver는 영화가 시작하기 전에 화가 나 있었다.","남자는 Oliver에게 미안하다고 말했다."],"r":{"a":"2) The couple entered the theater after the film started.","ev":"5~6번 문장","s":[[5,"He could enjoy the movie in a quiet environment.","그는 조용한 환경에서 영화를 즐길 수 있었다."],[6,"However, as soon as the film started, a couple entered.","하지만, 영화가 시작하자마자, 한 연인이 입장했다."]],"w":"6번에서 영화가 시작하자마자 연인이 입장했어요. Oliver는 영화가 시작하기 전에는 운이 좋다고 생각했고(4~5번), 연인과 함께 간 것도 아니에요.","c":2},"h":"05e2b51b61"},{"n":9,"t":"sum","q":"Oliver was happy because the theater was (A), but then a couple began to talk (B) during the movie.","ko":"극장이 (A)해서 Oliver는 행복했지만, 영화 중에 한 연인이 (B) 이야기하기 시작했다.","opts":["(A) full / (B) loudly","(A) empty / (B) quietly","(A) empty / (B) loudly","(A) dark / (B) angrily","(A) noisy / (B) happily"],"oko":["(A) 가득 찬 / (B) 크게","(A) 비어 있는 / (B) 조용히","(A) 비어 있는 / (B) 크게","(A) 어두운 / (B) 화가 난 채로","(A) 시끄러운 / (B) 즐겁게"],"r":{"a":"3) (A) empty / (B) loudly","ev":"3, 5, 8, 9번 문장","s":[[3,"The theater was empty when he walked in.","그가 들어갔을 때 극장은 비어 있었다."],[5,"He could enjoy the movie in a quiet environment.","그는 조용한 환경에서 영화를 즐길 수 있었다."],[8,"Then, they started to talk to each other.","그 후, 그들은 서로에게 이야기를 하기 시작했다."],[9,"He tried to pay attention to the movie, but they kept talking loudly.","그는 영화에 집중하기 위해 노력했지만, 그들은 계속해서 크게 이야기했다."]],"w":"3번에서 극장이 empty(비어 있는)였고, 9번에서 연인이 계속 loudly(크게) 이야기했어요. quietly나 happily는 9번과 맞지 않아요.","c":3},"h":"c09bf7a5bf"},{"n":10,"t":"fill","q":"Oliver [A] around, and the man [B] angrily that it was a private conversation.","ko":"Oliver는 뒤로 [A], 남자는 그것이 사적인 대화라고 화가 난 채로 [B].","bank":["turned","responded","entered","stared","kept","hoped"],"bko":{"turned":"돌았다","responded":"대답했다","entered":"입장했다","stared":"쳐다봤다","kept":"계속했다","hoped":"바랐다"},"r":{"a":"[A] turned, [B] responded","ev":"10, 13, 14번 문장","s":[[10,"Finally, Oliver turned around.","마침내, Oliver는 뒤돌아보았다."],[13,"“I hope not, sir,” the man responded angrily.","“듣지 못하셨으면 하는데요.”라고 남자가 화가 난 채로 대답했다."],[14,"“This is a private conversation!”","“이건 사적인 대화입니다!”"]],"w":"10번에서 Oliver가 turned around(뒤돌아보았다)하고, 13번에서 남자가 responded a "9e52cb32ba"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The water tastes slightly sweet with apple straws.)","ko":"사과 빨대를 사용하면 물이 약간 단맛이 난다.","opts":["약간","매우 많이","전혀","갑자기"],"word":"slightly","r":{"a":"1) 약간","ev":"12번 문장","s":[[12,"The water tastes slightly sweet with apple straws.","사과 빨대를 사용하면 물이 약간 단맛이 난다."]],"w":"물이 sweet한 정도를 나타내는 말이에요. 빨대로 물에 아주 진한 맛이 나는 것은 아니므로 slightly는 약간이에요.","c":1},"h":"cae66b9d10"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAnd you can eat them after you finish drinking!","ko":"그리고 다 마신 후에는 그것들을 먹을 수 있다!","opts":["사과 주스","사과 빨대","대나무 빨대","플라스틱 빨대"],"sko":"그리고 다 마신 후에는 그것들을 먹을 수 있다!","r":{"a":"2) 사과 빨대","ev":"12~13번 문장","s":[[12,"The water tastes slightly sweet with apple straws.","사과 빨대를 사용하면 물이 약간 단맛이 난다."],[13,"And you can eat them after you finish drinking!","그리고 다 마신 후에는 그것들을 먹을 수 있다!"]],"w":"바로 앞 12번이 apple straws 이야기이고, 13번에서 다 마신 후 먹을 수 있다고 해요. 먹을 수 있는 것은 사과 빨대예요.","c":2},"h":"1494c5eeae"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"We can cut it down to make straws, and it will quickly grow back.\"","ko":"우리는 빨대를 만들기 위해 그것을 베어낼 수 있고, 그것은 빠르게 다시 자랄 것이다.","opts":["대나무는 한 번 베면 다시 자라지 않는다.","빨대를 만들려면 대나무를 새로 심어야 한다.","대나무를 베면 빨대가 빠르게 자란다.","대나무를 베어 빨대를 만들어도 금방 다시 자란다."],"sko":"우리는 빨대를 만들기 위해 그것을 베어낼 수 있고, 그것은 빠르게 다시 자랄 것이다.","r":{"a":"4) 대나무를 베어 빨대를 만들어도 금방 다시 자란다.","ev":"6번 문장","s":[[6,"We can cut it down to make straws, and it will quickly grow back.","우리는 빨대를 만들기 위해 그것을 베어낼 수 있고, 그것은 빠르게 다시 자랄 것이다."]],"w":"cut it down은 대나무를 베어낸다는 뜻이고, grow back은 다시 자란다는 뜻이에요. 두 it은 모두 대나무예요.","c":4},"h":"d095f864e3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Bamboo straws become soft easily like paper straws.","Apple straws are made from apples.","A bamboo straw can be used only once.","Bamboo does not grow back after it is cut."],"oko":["대나무 빨대는 종이 빨대처럼 쉽게 물러진다.","사과 빨대는 사과로 만들어진다.","대나무 빨대는 한 번만 사용할 수 있다.","대나무는 베고 나면 다시
