rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "Gloria와 Robbie", "en": "\"Ninety-eight, ninety-nine, one hundred! Here I come!\" Gloria counted aloud and begins to search around the house.", "ko": "\"98, 99, 100! 나 이제 간다!\" Gloria는 큰 소리로 숫자를 세고 집 주위를 찾아보기 시작했다.", "ok": false, "foot": ["1aloud 소리 내어, 큰 소리로"], "fixes": [{"wrong": "begins", "right": "began", "partial": false, "at": [11], "point": "병렬구조/시제: counted와 대등하게 연결된 동사이므로 과거형 began 사용", "topic": "병렬구조/시제", "memo": "counted와 대등하게 연결된 동사이므로 과거형 began 사용"}]}, {"n": 2, "tag": null, "en": "The eight-years-old girl was playing hide and seek with Robbie.", "ko": "이 8살짜리 여자아이는 Robbie와 숨바꼭질을 하고 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "eight-years-old", "right": "eight-year-old", "partial": false, "at": [1], "point": "어법: 명사를 수식하는 하이픈 복합형용사는 단수형 year를 사용(eight-year-old)", "topic": "어법", "memo": "명사를 수식하는 하이픈 복합형용사는 단수형 year를 사용(eight-year-old)"}]}, {"n": 3, "tag": null, "en": "Robbie was a robot who comes to her house two years ago.", "ko": "Robbie는 2년 전에 그녀의 집에 온 로봇이었다.", "ok": false, "foot": [], "fixes": [{"wrong": "comes", "right": "came", "partial": false, "at": [5], "point": "주격 관계대명사: 선행사 a robot을 받는 who절도 이야기 전체 시제에 맞춰 과거형 came 사용", "topic": "주격 관계대명사", "memo": "선행사 a robot을 받는 who절도 이야기 전체 시제에 맞춰 과거형 came 사용"}]}, {"n": 4, "tag": null, "en": "He was her most best friend.", "ko": "그는 그녀의 가장 친한 친구였다.", "ok": false, "foot": [], "fixes": [{"wrong": "most best", "right": "best", "partial": false, "at": [3], "point": "최상급: best는 이미 최상급이므로 most를 중복해서 쓰지 않음(이중 최상급 오류)", "topic": "최상급", "memo": "best는 이미 최상급이므로 most를 중복해서 쓰지 않음(이중 최상급 오류)"}]}, {"n": 5, "tag": null, "en": "Robbie was more faster and better at hiding, but he always let her to win.", "ko": "Robbie는 더 빠르고 더 잘 숨었지만, 그는 항상 그녀가 이기도록 해 줬다.", "ok": false, "foot": [], "fixes": [{"wrong": "more faster", "right": "faster", "partial": false, "at": [2], "point": "비교급: fast의 비교급은 faster이므로 more를 중복 사용하지 않음(이중비교급 오류)", "topic": "비교급", "memo": "fast의 비교급은 faster이므로 more를 중복 사용하지 않음(이중비교급 오류)"}, {"wrong": "to win", "right": "win", "partial": false, "at": [13], "point": "사역동사: let은 목적격보어로 동사원형을 취하므로 win 사용", "topic": "사역동사", "memo": "let은 목적격보어로 동사원형을 취하므로 win 사용"}]}, {"n": 6, "tag": null, "en": "In return, Gloria told him his favorite stories, Cinderella.", "ko": "보답으로 Gloria는 그가 가장 좋아하는 이야기인 <신데렐라>를 들려주었다.", "ok": false, "foot": [], "fixes": [{"wrong": "stories", "right": "story", "partial": false, "at": [7], "point": "어휘/수일치: 뒤에 나오는 Cinderella는 하나의 이야기를 가리키므로 단수명사 story 사용", "topic": "어휘/수일치", "memo": "뒤에 나오는 Cinderella는 하나의 이야기를 가리키므로 단수명사 story 사용"}]}, {"n": 7, "tag": null, "en": "Robbie metal eyes blinked with joyful.", "ko": "Robbie의 금속으로 된 눈은 기쁨으로 깜빡였다.", "ok": false, "foot": ["1blinked 눈을 깜빡였다"], "fixes": [{"wrong": "Robbie", "right": "Robbie's", "partial": false, "at": [0], "point": "어법: 명사 앞에서 소유의 의미를 나타낼 때는 's를 붙여 Robbie's로 사용", "topic": "어법", "memo": "명사 앞에서 소유의 의미를 나타낼 때는 's를 붙여 Robbie's로 사용"}, {"wrong": "joyful", "right": "joy", "partial": false, "at": [5], "point": "어휘/어법: 전치사 with 뒤에는 명사 joy를 사용(joyful은 형용사)", "topic": "어휘/어법", "memo": "전치사 with 뒤에는 명사 joy를 사용(joyful은 형용사)"}]}, {"n": 8, "tag": "Weston 부인의 반대", "en": "\"Gloria, come back to inside!\" Mrs. Weston, Gloria's mother, shouted.", "ko": "\"Gloria, 들어와!\"라고 Gloria의 엄마인 Weston 부인은 소리쳤다.", "ok": false, "foot": [], "fixes": [{"wrong": "to inside", "right": "inside", "partial": false, "at": [3], "point": "어휘/어법: inside는 그 자체로 '안으로'라는 뜻의 부사이므로 전치사 to와 함께 쓰지 않음", "topic": "어휘/어법", "memo": "inside는 그 자체로 '안으로'라는 뜻의 부사이므로 전치사 to와 함께 쓰지 않음"}]}, {"n": 9, "tag": null, "en": "She did not like Robbie.", "ko": "그녀는 Robbie를 좋아하지 않았다.", "ok": true, "foot": [], "fixes": []}, {"n": 10, "tag": null, "en": "She felt that a robot should not takes care for a child.", "ko": "그녀는 로봇이 아이를 돌봐서는 안 된다고 생각했다.", "ok": false, "foot": [], "fixes": [{"wrong": "takes", "right": "take", "partial": false, "at": [7], "point": "조동사: should 뒤에는 동사원형 take 사용", "topic": "조동사", "memo": "should 뒤에는 동사원형 take 사용"}, 른 아이들하고는 놀지 않아요.\"라고 말했다.", 0], ["Mr. Weston did not agree with her.", "Weston 씨는 그녀의 생각에 동의하지 않았다.", 0], ["He thought that Robbie was a great help to Gloria and the family.", "그는 Robbie가 Gloria와 가족에게 큰 도움이 된다고 생각했다.", 0], ["After a long talk, however, they decided to return Robbie to the factory.", "하지만 긴 대화 후에 그들은 Robbie를 공장에 돌려보내기로 결정했다.", 0], ["When Gloria found that Robbie was gone, she cried, \"He is a person just like you and me, and he is my friend!", "Gloria는 Robbie가 사라진 것을 알게 되었을 때, \"그는 엄마 아빠와 저랑 똑같은 사람이고, 그는 제 친구예요!", 0], ["“Bring him back!” Gloria's smile was gone.", "그를 다시 데려와요!\"라고 울부짖었다. Gloria의 미소는 사라졌다.", 0], ["Even a new pet and a trip to New York did not help.", "새로운 반려동물도 뉴욕으로의 여행도 소용없었다.", 0], ["Nothing could make her smile.", "아무것도 그녀를 미소 짓게 할 수 없었다.", 0], ["In the end, her parents took Gloria to the factory.", "결국, 그녀의 부모는 Gloria를 공장에 데려갔다.", 0], ["Mrs. Weston pointed to the robot workers and said, \"Look at them, Gloria.", "Weston 부인은 일하는 로봇을 가리키며 \"저들을 봐, Gloria.", 0], ["They are just machines, not people.", "그것들은 사람이 아니라 단지 기계에 불과해.\"라고 말했다.", 0], ["Gloria was not listening to her mother.", "Gloria는 엄마의 말을 듣고 있지 않았다.", 0], ["She was searching for Robbie.", "그녀는 Robbie를 찾고 있었다.", 0], ["\"There he is!\" She shouted with joy.", "\"저기에 있다!\" 그녀는 기뻐서 소리쳤다.", 0], ["She was so happy that she ran toward him.", "그녀는 너무 행복해서 그에게 달려갔다.", 0], ["At that moment, a huge machine was rushing toward her.", "그 순간 거대한 기계가 그녀에게로 돌진하고 있었다.", 0], ["Robbie saw this, ran quickly toward her, and saved her just in time.", "Robbie는 이것을 보고는 그녀에게 재빨리 달려가서 제때 그녀를 구해냈다.", 0], ["Gloria hugged Robbie tightly.", "Gloria는 Robbie를 꼭 껴안았다.", 0], ["This time, even Mrs. Weston could not separate them.", "이번에는 Weston 부인조차도 그들을 갈라놓을 수 없었다.", 0], ["Gloria's parents changed their minds about Robbie and brought him back home.", "Gloria의 부모는 Robbie에 대한 그들의 마음을 바꿨고 그를 집에 다시 데려왔다.", 0], ["Finally, the two friends lived together happily.", "결국, 두 친구는 함께 행복하게 살았다.", 0]];var RNUM=38;var TITLE_EN="I, Robot Robbie";var PASS_EN=["I, Robot Robbie", "\"Ninety-eight, ninety-nine, one hundred! Here I come!\" Gloria counted aloud and began to search around the house. The eight-year-old girl was playing hide and seek with Robbie. Robbie was a robot who came to her house two years ago. He was her best friend. Robbie was faster and better at hiding, but he always let her win. In return, Gloria told him his favorite story, Cinderella. Robbie's metal eyes blinked with joy.", "\"Gloria, come back inside!\" Mrs. Weston, Gloria's mother, shouted. She did not like Robbie. She felt that a robot should not take care of a child. She said to her husband, \"Gloria plays only with Robbie. She does not play with other children.\" Mr. Weston did not agree with her. He thought that Robbie was a great help to Gloria and the family. After a long talk, however, they decided to return Robbie to the factory. When Gloria found that Robbie was gone, she cried, \"He is a person just like you and me, and he is my friend! “Bring him back!” Gloria's smile was gone. Even a new pet and a trip to New York did not help. Nothing could make her smile.", "In the end, her parents took Gloria to the factory. Mrs. Weston pointed to the robot workers and said, \"Look at them, Gloria. They are just machines, not people. Gloria was not listening to her mother. She was searching for Robbie.", "\"There he is!\" She shouted with joy. She was so happy that she ran toward him. At that moment, a huge machine was rushing toward her. Robbie saw this, ran quickly toward her, and saved her just in time. Gloria hugged Robbie tightly. This time, even Mrs. Weston could not separate them. Gloria's parents changed their minds about Robbie and brought him back home. Finally, the two friends lived together happily."];var PASS_KO=["나, 로봇 Robbie", "\"98, 99, 100! 나 이제 간다!\" Gloria는 큰 소리로 숫자를 세고 집 주위를 찾아보기 시작했다. 이 8살짜리 여자아이는 Robbie와 숨바꼭질을 하고 있었다. Robbie는 2년 전에 그녀의 집에 온 로봇이었다. 그는 그녀의 가장 친한 친구였다. Robbie는 더 빠르고 더 잘 숨었지만, 그는 항상 그녀가 이기도록 해 줬다. 보답으로 Gloria는 그가 가장 좋아하는 이야기인 <신데렐라>를 들려주었다. Robbie의 금속으로 된 눈은 기쁨으로 깜빡였다.", "\"Gloria, 들어와!\"라고 Gloria의 엄마인 Weston 부인은 소리쳤다. 그녀는 Robbie를 좋아하지 않았다. 그녀는 로봇이 아이를 돌봐서는 안 된다고 생각했다. 그녀는 남편에게 \"Gloria는 Robbie하고만 놀아요. 그 애는 다른 아이들하고는 놀지 않아요.\"라고 말했다. Weston 씨는 그녀의 생각에 동의하지 않았다. 그는 Robbie가 Gloria와 가족에게 큰 도움이 된다고 생각했다. 하지만 긴 대화 후에 그들은 Robbie를 공장에 돌려보내기로 결정했다. Gloria는 Robbie가 사라진 것을 알게 되었을 때, \"그는 엄마 아빠와 저랑 똑같은 사람이고, 그는 제 친구예요! 그를 다시 데려와요!\"라고 울부짖었다. Gloria의 미소는 사라졌다. 새로운 반려동물도 뉴욕으로의 여행도 소용없었다. 아무것도 그녀를 미소 짓게 할 수 없었다.", "결국, 그녀의 부모는 Gloria를 공장에 데려갔다. Weston 부인은 일하는 로봇을 가리키며 \"저들을 봐, Gloria. 그것들은 사람이 아니라 단지 기계에 불과해.\"라고 말했다. Gloria는 엄마의 말을 듣고 있지 않았다. 그녀는 Robbie를 찾고 있었다.", "\"저기에 있다!\" 그녀는 기뻐서 소리쳤다. 그녀는 너무 행복해서 그에게 달려갔다. 그 순간 거대한 기계가 그녀에게로 돌진하고 있었다. Robbie는 이것을 보고는 그녀에게 재빨리 달려가서 제때 그녀를 구해냈다. Gloria는 Robbie를 꼭 껴안았다. 이번에는 Weston 부인조차도 그들을 갈라놓을 수 없었다. Gloria의 부모는 Robbie에 대한 그들의 마음을 바꿨고 그를 집에 다시 데려왔다. 결국, 두 친구는 함께 행복하게 살았다."];var DG=[{"dlg": [["G", "Do you know we have a robot in the cafeteria?", "우리 학교 식당에 로봇이 있다는 거 알아?"], ["B", "Our school got a robot? What kind of work does it do there?", "우리 학교에 로봇이 생겼어? 거기서 그게 무슨 일을 하는데?"], ["G", "It makes sandwiches really fast.", "샌드위치를 정말 빨리 만들어."], ["B", "That's cool. How do you feel about using the robot in the cafeteria?", "멋지다. 학교 식당에서 로봇을 쓰는 것에 대해 어떻게 생각해?"], ["G", "I think it's great because it can make the sandwich line move faster. We don't have to wait too long.", "샌드위치 줄이 더 빨리 줄어들 수 있으니까 좋다고 생각해. 너무 오래 기다리지 않아도 되잖아."], ["B", "It's nice, but I'm worried about the cafeteria workers. They might lose their jobs.", "좋긴 한데, 식당 직원분들이 걱정돼. 그분들이 일자리를 잃을지도 몰라."], ["G", "Good point. I hope that the school will find new roles for the workers.", "좋은 지적이야. 학교가 직원분들을 위한 새로운 역할을 찾아 주면 좋겠어."], ["B", "I hope so, too.", "나도 그러길 바라."]], "qs": [{"n": 1, "q": "위 대화의 주제로 알맞은 것은?", "o": ["choosing a dish in the cafeteria", "worry about a future with robots", "roles of the robot in the cafeteria", "things to do for the cafeteria workers"  QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
