s: 물론이죠. 저는 자전거 타는 것을 좋아해요. 저는 대략 10년 동안 자전거를 탔어요. 장거리를 타는 동안에 제 휴대 전화 배터리를 자주 다 써 버렸고, 그래서 작은 팬이 달린 이 충전기를 만들었어요. 이 작은 팬을 갖고 자전거를 타면, 바람이 그 팬을 돌리고 전력을 만들어 내요. 당신의 휴대 전화는 이 전력에 의해 충전돼요.","Ted: 와, 훌륭한 아이디어입니다. 제 자전거에 이 휴대 전화 충전기를 달고 싶네요.","Ted: 또 다른 발명가를 만나 봅시다. 안녕하세요, Kelly. 당신의 발명품은 무엇인가요?","Kelly: 저는 Sitbag을 만들었어요. 이건 가방이지만, 의자로 바뀔 수 있어요. 작년에 우리 할머니께서 넘어지셔서 다리를 다치셨거든요. 그때 이후로, 할머니는 걷는 데 어려움을 겪어 오셨어요. 그래서 할머니는 자주 쉬어야 하는데, 길거리에 벤치가 많지 않아요. Sitbag은 할머니 같은 어르신들을 위해 설계되었어요.","Ted: 정말 사려 깊네요, Kelly. 그것은 어르신들께 정말 유용할 거예요."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["이 물건은 달걀을 삶을 때 쓴다.","이 물건은 물에 넣으면 안 된다.","이 물건은 달걀이 식으면 색이 변한다.","여자는 이 물건이 창의적이지 않다고 말한다.","이 물건은 네모난 모양이다."],"a":0,"ans":"이 물건은 달걀을 삶을 때 쓴다.","evs":[["It's for boiling eggs. You can put it in the water with eggs.","달걀을 삶는 데 쓰는 거예요. 달걀과 함께 물에 넣으면 돼요."],["When the eggs are cooked, it changes its color.","달걀이 익으면, 색이 변해요."],["How creative!","정말 창의적이네요!"]],"ev":["It's for boiling eggs. You can put it in the water with eggs.","달걀을 삶는 데 쓰는 거예요. 달걀과 함께 물에 넣으면 돼요."],"ow":["정답 ○ — 남자가 \"It's for boiling eggs.\"(달걀을 삶는 데 쓰는 거예요.)라고 했으므로 맞음.","오답 ✕ — 남자가 \"You can put it in the water with eggs.\"(달걀과 함께 물에 넣으면 돼요.)라고 했는데, 이 보기는 물에 넣으면 안 된다고 해서 틀림.","오답 ✕ — 남자가 \"When the eggs are cooked, it changes its color.\"(달걀이 익으면 색이 변해요.)라고 했는데, 이 보기는 식으면 변한다고 해서 틀림.","오답 ✕ — 여자가 \"How creative!\"(정말 창의적이네요!)라고 감탄했는데, 이 보기는 창의적이지 않다고 해서 틀림.","오답 ✕ — 여자가 \"What is this round thing for?\"(이 둥근 물건은 무엇에 쓰는 건가요?)라고 했는데, 이 보기는 네모난 모양이라고 해서 틀림."],"memo":["정답 ①: 이 물건은 달걀을 삶을 때 쓴다.","근거: It's for boiling eggs.(달걀을 삶는 데 쓰는 거예요.)","함정: ③은 '식으면'이 아니라 '익으면(cooked)' 색이 변한다"],"why":"둥근 물건은 달걀을 삶을 때 쓰고 달걀이 익으면 색이 변한다."}],"dlg":[["W","Excuse me. What is this round thing for?","실례합니다. 이 둥근 물건은 무엇에 쓰는 건가요?"],["M","It's for boiling eggs. You can put it in the water with eggs.","달걀을 삶는 데 쓰는 거예요. 달걀과 함께 물에 넣으면 돼요."],["W","How does it work?","그것은 어떻게 작동하나요?"],["M","When the eggs are cooked, it changes its color.","달걀이 익으면, 색이 변해요."],["W","How creative!","정말 창의적이네요!"]]},{"qs":[{"n":2,"q":"남자가 파티를 여는 이유로 알맞은 것은?","o":["Jake의 생일이 다가와서","Jake가 다른 도시로 이사 가서","남자가 다른 도시에서 새 직장을 얻어서","남자가 자신의 생일을 축하하고 싶어서","남자가 여자를 위해 특별한 추억을 만들고 싶어서"],"a":1,"ans":"Jake가 다른 도시로 이사 가서","evs":[["Is it for his birthday?","그의 생일 때문이니?"],["No, he's moving to a different city next week.","아니, 그는 다음 주에 다른 도시로 이사 가."],["Thanks. I want to create a special memory with him.","고마워. 나는 그와 특별한 추억을 만들고 싶어."]],"ev":["Is it for his birthday?","그의 생일 때문이니?"],"ow":["오답 ✕ — 여자가 \"Is it for his birthday?\"(그의 생일 때문이니?)라고 묻자 남자가 \"No\"(아니)라고 했으므로 생일 때문이 아니라서 틀림.","정답 ○ — 남자가 \"No, he's moving to a different city next week.\"(아니, 그는 다음 주에 다른 도시로 이사 가.)라고 했으므로 Jake가 이사 가기 때문에 파티를 연다.","오답 ✕ — 이사 가는 사람은 남자가 아니라 Jake(\"he's moving to a different city\")이고, 새 직장 이야기는 나오지 않아 틀림.","오답 ✕ — 파티는 \"for my best friend, Jake\"(가장 친한 친구 Jake를 위해)라고 했으므로 남자의 생일이 아니라서 틀림.","오답 ✕ — 남자는 \"I want to create a special memory with him.\"(그와 특별한 추억을 만들고 싶어.)라고 했으므로 추억을 만들 상대는 여자가 아니라 Jake라서 틀림."],"memo":["정답 ②: Jake가 다른 도시로 이사 가서","근거: No, he's moving to a different city next week.(아니, 그는 다음 주에 다른 도시로 이사 가.)","함정: 여자가 생일이냐고 물었지만 남자가 No라고 답함"],"why":"가장 친한 친구 Jake가 다음 주에 이사 가서 특별한 추억을 만들려고 파티를 연다."}],"dlg":[["M","I'm planning to throw a party for my best friend, Jake.","나는 가장 친한 친구 Jake를 위해 파티를 열 계획이야."],["W","Is it for his birthday?","그의 생일 때문이니?"],["M","No, he's moving to a different city next week.","아니, 그는 다음 주에 다른 도시로 이사 가."],["W","That's very sweet of you.","정말 다정하구나."],["M","Thanks. I want to create a special memory with him.","고마워. 나는 그와 특별한 추억을 만들고 싶어."]]},{"qs":[{"n":3,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["The woman asks about the man's plan after school.","The man is planning to go to the gym.","The man thinks he should practice running.","The woman already knows that the man will participate in the race.","The woman wishes the man good luck."],"a":3,"ans":"The woman already knows that the man will participate in the race.","evs":[["What are you planning to do after school?","방과 후에 뭘 할 계획이니?"],["I'm planning to run in the gym. I need to practice for the race on Sports Day.","체육관에서 달릴 계획이야. 체육 대회 날 경주를 위해 연습해야 해."],["I didn't know you are going to run in the race. Good luck!","네가 경주에서 달릴 줄 몰랐어. 행운을 빌어!"]],"ev":["What are you planning to do after school?","방과 후에 뭘 할 계획이니?"],"ow":["오답 ✕ — 여자가 \"What are you planning to do after school?\"(방과 후에 뭘 할 계획이니?)라고 물었으므로 일치하는 보기임. 일치하지 않는 것을 찾는 문제라 답이 아님.","오답 ✕ — 남자가 \"I'm planning to run in the gym.\"(체육관에서 달릴 계획이야.)라고 했으므로 일치하는 보기임. 답이 아님.","오답 ✕ — 남자가 \"I need to practice for the race on Sports Day.\"(체육 대회 날 경주를 위해 연습해야 해.)라고 했으므로 달리기를 연습해야 한다고 생각하는 것이 맞아서 일치하는 보기임. 답이 아님.","정답 ○ — 여자는 \"I didn't know you are going to run in the race.\"(네가 경주에서 달릴 줄 몰랐어.)라고 했으므로 이미 알고 있었다는 보기는 일치하지 않음.","오답 ✕ — 여자가 \"Good luck!\"(행운을 빌어!)이라고 했으므로 일치하는 보기임. 답이 아님."],"memo":["정답 ④: 여자는 남자가 경주에 참가할 것을 이미 알고 있다. (본문과 다름)","근거: I didn't know you are going to run in the race.(네가 경주에서 달릴 줄 몰랐어.)","함정: didn't know(몰랐다) ↔ already knows(이미 안다)로 바꾼 함정"],"why":"여자는 남자가 경주에 나가는 것을 몰랐다고 말하므로 '이미 알고 있다'는 보기가 틀리다."}],"dlg":[["W","What are you planning to do after school?","방과 후에 뭘 할 계획이니?"],["M","I'm planning to run in the gym. I need to practice for the race on Sports Day.","체육관에서 달릴 계획이야. 체육 대회 날 경주를 위해 연습해야 해."],["W","I didn't know you are going to run in the race. Good luck!","네가 경주에서 달릴 줄 몰랐어. 행운을 빌어!"],["M","Thank you.","고마워."]]},{"qs":[{"n":4,"q":"위 대화의 주제로 알맞은 것은?","o":["a special fork for adults","the difficulty of using a fork","the problem with eating hot food","two speakers' plans for the weekend","the woman's idea for the invention fair"],"a":4,"ans":"the woman's idea for the invention fair","evs":[["I'm planning to make something for the invention fair.","발명품 박람회에 낼 무언가를 만들 계획이야."],["I'm thinking of a special fork.","특별한 포크를 생각하고 있어."],["Yeah, it can cool the food down. It will help little children when they eat hot food.","응, 음식을 식혀 줄 수 있어. 뜨거운 음식을 먹는 어린아이들에게 도움이 될 거야."]],"ev":["I'm planning to make something for the invention fair.","발명품 박람회에 낼 무언가를 만들 계획이야."],"ow":["오답 ✕ — 포크는 \"It will help little children when they eat hot food.\"(뜨거운 음식을 먹는 어린아이들에게 도움이 될 거야.)라고 했는데, 이 보기는 어른용이라고 해서 틀림.","오답 ✕ — 포크 사용이 어렵다는 말은 없다. 여자는 \"I'm thinking of a special fork.\"(특별한 포크를 생각하고 있어.)라고 새 포크 아이디어를 말했을 뿐이라 틀림.","오답 ✕ — 뜨거운 음식은 포크가 해결해 주려는 상황('when they eat hot food')일 뿐, 대화의 중심은 박람회에 낼 발명 아이디어라서 너무 좁아서 틀림.","오답 ✕ — 대화에는 \"I'm planning to make something for the invention fair.\"(발명품 박람회에 낼 무언가를 만들 계획이야.)라는 여자의 계획만 중심이고, 두 사람의 주말 계획을 함께 이야기하는 것이 아니라서 틀림.","정답 ○ — 여자가 \"I'm planning to make something for the invention fair.\"(발명품 박람회에 낼 무언가를 만들 계획이야.)라고 하며 특별한 포크 아이디어를 설명하므로 여자의 발명 아이디어가 주제임."],"memo":["정답 ⑤: the woman's idea for the invention fair","근거: I'm planning to make something for the invention fair. / I'm thinking of a special fork.","함정: ④는 '두 사람'의 계획이 아니라 여자 한 명의 아이디어를 말하는 대화라 ✕"],"why":"여자가 발명품 박람회에 낼 특별한 포크 아이디어를 이야기하는 대화이다."}],"dlg":[["M","What are you planning to do this weekend, Lucy?","이번 주말에 뭘 할 계획이니, 루시?"],["W","I'm planning to make something for the invention fair.","발명품 박람회에 낼 무언가를 만들 계획이야."],["M","What do you want to invent?","무엇을 발명하고 싶은데?"],["W","I'm thinking of a special fork.","특별한 포크를 생각하고 있어."],["M","A special fork?","특별한 포크?"],["W","Yeah, it can cool the food down. It will help little children when they eat hot food.","응, 음식을 식혀 줄 수 있어. 뜨거운 음식을 먹는 어린아이들에게 도움이 될 거야."],["M","Oh, that's an interesting idea!","오, 흥미로운 생각이구나!"]]},{"qs":[{"n":5,"q":"Which of the following is not true about the stick?","o":["It uses sound.","It is helpful for blind people.","It is a special stick for hiking.","It was invented by a teenager.","It works when people walk with it."],"a":2,"ans":"It is a special stick for hiking.","evs":[["Look at this stick. A teenager invented this.","이 지팡이를 봐. 한 십 대가 이것을 발명했어."],["No, it's not for hiking. It's for helping blind people.","아니, 등산용이 아니야. 시각 장애인을 돕기 위한 거야."],["It gives directions by sound when they walk.","그들이 걸을 때 소리로 길을 알려 줘."]],"ev":["Look at this stick. A teenager invented this.","이 지팡이를 봐. 한 십 대가 이것을 발명했어."],"ow":["오답 ✕ — 대화에서 \"It gives directions by sound when they walk.\"(걸을 때 소리로 길을 알려 줘.)라고 했으므로 소리를 이용하는 것이 맞아서 일치하는 보기임. 답이 아님.","오답 ✕ — \"It's for helping blind people.\"(시각 장애인을 돕기 위한 거야.)라고 했으므로 일치하는 보기임. 답이 아님.","정답 ○ — \"No, it's not for hiking.\"(아니, 등산용이 아니야.)라고 했는데, 이 보기는 등산용이라고 해서 사실과 다름.","오답 ✕ — \"A teenager invented this.\"(한 십 대가 이것을 발명했어.)라고 했으므로 일치하는 보기임. 답이 아님.","오답 ✕ — \"It gives directions by sound when they walk.\"(그들이 걸을 때 소리로 길을 알려 줘.)라고 했으므로 걸을 때 작동하는 것이 맞아서 일치하는 보기임. 답이 아님."],"memo":["정답 ③: It is a special stick for hiking. (사실과 다름)","근거: No, it's not for hiking. It's for helping blind people.(등산용이 아니라 시각 장애인을 돕기 위한 거야.)","함정: 남자의 질문 'Is it a hiking stick?'에 여자가 No라고 답함"],"why":"이 지팡이는 등산용이 아니라 시각 장애인을 돕기 위한 것이다."}],"dlg":[["W","Look at this stick. A teenager invented this.","이 지팡이를 봐. 한 십 대가 이것을 발명했어."],["M","What is it for? Is it a hiking stick?","무엇에 쓰는 거야? 등산 지팡이니?"],["W","No, it's not for hiking. It's for helping blind people.","아니, 등산용이 아니야. 시각 장애인을 돕기 위한 거야."],["M","Really? How does it work?","정말? 그건 어떻게 작동해?"],["W","It gives directions by sound when they walk.","그들이 걸을 때 소리로 길을 알려 줘."],["M","Oh, that's so smart.","오, 정말 똑똑하다."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Ted is the host of the show, Top Inventions.","Thomas is a teen inventor who participates in the Invention Fair.","The Wind Power is a phone charger that can be used during rides.","The Wind Power makes power by turning the bike's wheel.","Ted wants to get the Wind Power for his bike."],"a":3,"ans":"The Wind Power makes power by turning the bike's wheel.","evs":[["I'm Ted from Top Inventions.","저는 Top Inventions(최고의 발명품)의 Ted입니다."],["Today, we will meet some teen inventors at the Invention Fair and hear about their work.","오늘은 발명품 박람회에서 몇몇 십 대 발명가들을 만나 그들의 작품에 대해 들어보겠습니다."],["It's a phone charger and it uses wind to make power.","그건 휴대 전화 충전기이고 전력을 만들기 위해 바람을 이용해요."],["When you ride a bike with this small fan, the wind turns the fan and makes power.","이 작은 팬을 갖고 자전거를 타면, 바람이 그 팬을 돌리고 전력을 만들어 내요."],["I'd like to get this phone charger for my bike.","제 자전거에 이 휴대 전화 충전기를 달고 싶네요."]],"ev":["I'm Ted from Top Inventions.","저는 Top Inventions(최고의 발명품)의 Ted입니다."],"ow":["오답 ✕ — 본문에 \"I'm Ted from Top Inventions.\"(저는 Top Inventions의 Ted입니다.)라고 했으므로 일치하는 보기임. 일치하지 않는 것을 찾는 문제라 답이 아님.","오답 ✕ — 본문에 \"we will meet some teen inventors at the Invention Fair\"(발명품 박람회에서 십 대 발명가들을 만나겠습니다)와 Thomas의 발명품 이야기가 나오므로 일치하는 보기임. 답이 아님.","오답 ✕ — 본문에 \"It's a phone charger and it uses wind to make power.\"(그건 휴대 전화 충전기이고 전력을 만들기 위해 바람을 이용해요.)라고 했고 자전거를 탈 때 쓰므로 일치하는 보기임. 답이 아님.","정답 ○ — 본문에는 \"the wind turns the fan and makes power\"(바람이 그 팬을 돌리고 전력을 만들어 내요)라고 했는데, 이 보기는 자전거 바퀴를 돌려서 전력을 만든다고 해서 일치하지 않음.","오답 ✕ — 본문에 \"I'd like to get this phone charger for my bike.\"(제 자전거에 이 휴대 전화 충전기를 달고 싶네요.)라고 했으므로 일치하는 보기임. 답이 아님."],"memo":["정답 ④: The Wind Power makes power by turning the bike's wheel. (본문과 다름)","근거: the wind turns the fan and makes power.(바람이 팬을 돌리고 전력을 만들어 내요.)","함정: 돌아가는 것은 자전거 바퀴(wheel)가 아니라 작은 팬(fan)"],"why":"Wind Power는 바람이 작은 팬을 돌려서 전력을 만든다(바퀴가 아님)."},{"n":7,"q":"윗글의 제목으로 알맞은 것은?","o":["A Bike Ride with Ted","A Phone Without a Battery","The Most Famous Teen Inventors","Riding a Bicycle Faster with the Wind Power","Let's Meet the Teen Inventor of the Wind Power"],"a":4,"ans":"Let's Meet the Teen Inventor of the Wind Power","evs":[["I'm Ted from Top Inventions.","저는 Top Inventions(최고의 발명품)의 Ted입니다."],["Today, we will meet some teen inventors at the Invention Fair and hear about their work.","오늘은 발명품 박람회에서 몇몇 십 대 발명가들을 만나 그들의 작품에 대해 들어보겠습니다."],["Thomas: I invented the Wind Power.","Thomas: 저는 Wind Power를 발명했어요."],["It's a phone charger and it uses wind to make power.","그건 휴대 전화 충전기이고 전력을 만들기 위해 바람을 이용해요."]],"ev":["I'm Ted from Top Inventions.","저는 Top Inventions(최고의 발명품)의 Ted입니다."],"ow":["오답 ✕ — Ted는 자전거를 타는 사람이 아니라 발명가를 인터뷰하는 진행자이고, 자전거는 Thomas의 발 function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';

function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}

 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});

function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){

 });

  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});
var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}

 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}

function ppHtml(pp,lock){

 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';

function dlgHtml(d,lock){

function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});

 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
