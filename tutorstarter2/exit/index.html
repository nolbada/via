":"Which is the best meaning of the sentence?\n\"Dogs’ nose prints don’t change as dogs get older.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"개의 비문은 개가 나이가 들면서 변하지 않는다.","opts":["개의 비문은 개가 어릴 때만 보인다.","개가 나이가 들수록 비문이 더 선명해진다.","개가 나이가 들면 비문이 사라진다.","개의 비문은 개가 나이가 들어도 변하지 않는다."],"r":{"a":"4) 개의 비문은 개가 나이가 들어도 변하지 않는다.","ev":"13번 문장","s":[[13,"Dogs’ nose prints don’t change as dogs get older.","개의 비문은 개가 나이가 들면서 변하지 않는다."]],"w":"13번 don’t change as dogs get older는 개가 나이 들어도 비문이 변하지 않는다는 뜻이에요.","c":4},"h":"30deae96bd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["개의 비문은 개가 나이가 들면서 많이 변한다.","각 개는 자기만의 비문을 가지고 있다.","마이크로칩은 개의 몸 밖에 붙인다.","꼬리표와 목걸이는 절대 분실되지 않는다."],"opts":["Dogs’ nose prints change a lot as dogs get older.","Each dog has its own nose print.","Microchips are put outside dogs.","Tags and collars can never be lost."],"r":{"a":"2) Each dog has its own nose print.","ev":"1~2번 문장","s":[[1,"Every fingerprint is unique.","모든 지문은 유일무이하다."],[2,"Each dog’s nose print is unique too!","각 개의 비문도 유일무이하다!"]],"w":"1~2번에서 지문도, 각 개의 비문도 유일무이하다고 해요. 비문은 나이가 들어도 변하지 않고(13번), 마이크로칩은 개의 몸속에 넣으며(9번), 꼬리표와 목걸이는 분실될 수 있어요(7번).","c":2},"h":"bca74c7907"},{"n":9,"t":"sum","q":"Collecting nose prints is easy and (A), so dog owners should (B) them.","ko":"비문을 채취하는 것은 쉽고 (A), 그러니 견주들은 비문을 (B)해야 한다.","oko":["(A) 고통스럽고 / (B) 등록","(A) 고통이 없고 / (B) 제거","(A) 고통이 없고 / (B) 등록","(A) 비싸고 / (B) 숨겨","(A) 고통스럽고 / (B) 제거"],"opts":["(A) painful / (B) register","(A) painless / (B) remove","(A) painless / (B) register","(A) expensive / (B) hide","(A) painful / (B) remove"],"r":{"a":"3) (A) painless / (B) register","ev":"15~16번 문장","s":[[15,"Also it’s easy and painless to collect nose prints.","또한 비문을 채취하는 것은 쉽고 고통이 없다."],[16,"So, dog owners, hurry up and register them!","그러니 견주들이여, 서둘러서 비문을 등록하라!"]],"w":"15번에서 비문을 채취하는 것은 쉽고 고통이 없다(painless)고 하고, 16번에서 서둘러 등록하라(register)고 해요.","c":3},"h":"c804fb096d"},{"n":10,"t":"fill","q":"Tags and collars can be [A] or stolen, and microchips can also [B].","ko":"꼬리표와 목걸이는 [A] 또는 도난당할 수 있고, 마이크로칩은 또한 [B] 수 있다.","bank":["lost","break","closely","dogs","owners","patterns"],"bko":{"lost":"잃어버린","break":"부서지다","closely":"자세히","dogs":"개들","owners":"주인들","patterns":"무늬들"},"r":{"a":"[A] lost, [B] break","ev":"7, 11번 문장","s":[[7,"Tags and collars are often used, but they can be lost or stolen.","꼬리표와 목걸이가 흔히 사용되지만, 그것들은 분실되거나 도난당할 수 있다."],[11,"Microchips can also break.","마이크로칩은 또한 부서질 수 있다."]],"w":"7번 they can be lost or stolen과 11번 Microchips can also break에서 가져왔어요. be 뒤에는 과거분사 lost(잃어버린)가 오고, can also 뒤에는 동사원형 break가 와요. 다른 단어는 뜻이나 문장 모양이 맞지 않아요.","c":null},"h":"6bc3458c5c"}]},{"u":5,"id":"rt2-05-2","no":2,"ko":"휘파람을 불면 안 돼!","items":[{"n":1,"t":"tf","q":"Stagehands raised and lowered the backgrounds with ropes.","ko":"무대 담당자들은 밧줄로 배경을 올리고 내렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Stagehands raised and lowered them with ropes.","무대 담당자들이 밧줄로 그것들을 올리고 내렸다."]],"w":"5번에서 Stagehands raised and lowered them with ropes라고 해요. them은 4번의 극장 배경이에요.","c":"T"},"h":"b1ec4ca059"},{"n":2,"t":"tf","q":"Whistles from the audience helped the stagehands do their work.","ko":"관객의 휘파람은 무대 담당자들이 일하는 것을 도왔다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Whistles from the audience sometimes confused them!","관객에게서 나오는 휘파람은 때때로 그들을 혼란스럽게 했다!"]],"w":"7번에서 관객의 휘파람은 때때로 무대 담당자들을 혼란스럽게 했다(confused)고 해요. 도운 것이 아니라 방해가 됐어요.","c":"F"},"h":"6e3fcb73c8"},{"n":3,"t":"tf","q":"Today, stagehands still use whistles to send signals.","ko":"오늘날에도 무대 담당자들은 신호를 보내려고 여전히 휘파람을 사용한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"These days stagehands use headsets.","오늘날 무대 담당자들은 헤드폰을 이용한다."]],"w":"10번에서 오늘날 무대 담당자들은 헤드폰(headsets)을 이용한다고 해요. 휘파람을 쓴다는 말은 맞지 않아요.","c":"F"},"h":"d24c3fdea9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (To tell each other to pull or loosen the ropes, they whistled.)","ko":"밧줄을 당기거나 느슨하게 하라고 서로에게 말하기 위해, 그들은 휘파람을 불었다.","opts":["자르다","묶다","느슨하게 하다","던지다"],"word":"loosen","r":{"a":"3) 느슨하게 하다","ev":"6번 문장","s":[[6,"To tell each other to pull or loosen the ropes, they whistled.","밧줄을 당기거나 느슨하게 하라고 서로에게 말하기 위해, 그들은 휘파람을 불었다."]],"w":"6번은 밧줄을 당기라(pull)는 신호와 반대로 풀어 주라는 신호를 말해요. pull(당기다)과 짝이 되는 loosen = 느슨하게 하다.","c":3},"h":"28e31456e2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Whistles don’t cause accidents any more.)","ko":"휘파람은 더 이상 사고를 일으키지 않는다.","opts":["사고","배경","관습","신호"],"word":"accidents","r":{"a":"1) 사고","ev":"8, 11번 문장","s":[[8,"The background could be dropped onto an actor.","배경이 배우에게 떨어질 수도 있었다."],[11,"Whistles don’t cause accidents any more.","휘파람은 더 이상 사고를 일으키지 않는다."]],"w":"8번에서 배경이 배우에게 떨어질 수 있다고 했고, 11번에서 휘파람이 더 이상 그런 일을 일으키지 않는다고 해요. accident = 사고.","c":1},"h":"2e083b4fca"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhistles from the audience sometimes confused them!","ko":"밑줄 친 them가 가리키는 것은?","sko":"관객에게서 나오는 휘파람은 때때로 그들을 혼란스럽게 했다!","opts":["관객들","배우들","무대 담당자들","큰 그림들"],"r":{"a":"3) 무대 담당자들","ev":"5~7번 문장","s":[[5,"Stagehands raised and lowered them with ropes.","무대 담당자들이 밧줄로 그것들을 올리고 내렸다."],[6,"To tell each other to pull or loosen the ropes, they whistled.","밧줄을 당기거나 느슨하게 하라고 서로에게 말하기 위해, 그들은 휘파람을 불었다."],[7,"Whistles from the audience sometimes confused them!","관객에게서 나오는 휘파람은 때때로 그들을 혼란스럽게 했다!"]],"w":"7번에서 관객의 휘파람이 혼란스럽게 한 대상은 5번에서 밧줄로 배경을 올리고 내리던 stagehands, 6번에서 휘파람을 불던 사람들이에요.","c":3},"h":"be86df0dca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The background could be dropped onto an actor.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"배경이 배우에게 떨어질 수도 있었다.","opts":["배우가 배경 위로 올라갈 수도 있었다.","배경이 배우에게 떨어질 수도 있었다.","배우가 배경을 그릴 수도 있었다.","배경이 무대에서 사라질 수도 있었다."],"r":{"a":"2) 배경이 배우에게 떨어질 수도 있었다.","ev":"8번 문장","s":[[8,"The background could be dropped onto an actor.","배경이 배우에게 떨어질 수도 있었다."]],"w":"The background could be dropped onto an actor는 배경이 배우 위로 떨어질 수 있었다는 뜻이에요. 휘파람에 헷갈린 담당자들이 밧줄을 잘못 다루면 생길 수 있는 사고예요(7번).","c":2},"h":"5439fa36ac"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["오래전에 극장의 배경은 커다란 그림이었다.","오늘날 무대 담당자들은 서로 말하려고 휘파람을 분다.","관객의 휘파람은 무대 담당자들을 전혀 혼란스럽게 하지 않았다.","무대 담당자들은 헤드폰으로 배경을 내렸다."],"opts":["Long ago, theater backgrounds were large paintings.","Stagehands today whistle to talk to each other.","Whistles from the audience never confused stagehands.","Stagehands lowered the backgrounds with headsets."],"r":{"a":"1) Long ago, theater backgrounds were large paintings.","ev":"4번 문장","s":[[4,"A long time ago, theater backgrounds were large paintings.","오래전에, 극장의 배경은 커다란 그림들이었다."]],"w":"4번에서 오래전 극장의 배경은 커다란 그림들이었다고 해요. 오늘날은 헤드폰을 쓰고(10번), 관객의 휘파람은 혼란을 줬고(7번), 배경은 밧줄로 내렸어요(5번).","c":1},"h":"24018c55c0"},{"n":9,"t":"sum","q":"Stagehands whistled to (A) each other about the ropes, but now they use (B), so whistles don’t cause accidents.","ko":"무대 담당자들은 밧줄에 대해 서로 (A)하려고 휘파람을 불었지만, 지금은 (B)을 써서 휘파람이 사고를 일으키지 않는다.","oko":["(A) 말 / (B) 휘파람","(A) 싸우 / (B) 헤드폰","(A) 피하 / (B) 그림","(A) 말 / (B) 헤드폰","(A) 감사하 / (B) 휘파람"],"opts":["(A) tell / (B) whistles","(A) fight / (B) headsets","(A) hide from / (B) paintings","(A) tell / (B) headsets","(A) thank / (B) whistles"],"r":{"a":"4) (A) tell / (B) headsets","ev":"6, 10, 11번 문장","s":[[6,"To tell each other to pull or loosen the ropes, they whistled.","밧줄을 당기거나 느슨하게 하라고 서로에게 말하기 위해, 그들은 휘파람을 불었다."],[10,"These days stagehands use headsets.","오늘날 무대 담당자들은 헤드폰을 이용한다."],[11,"Whistles don’t cause accidents any more.","휘파람은 더 이상 사고를 일으키지 않는다."]],"w":"6번에서 휘파람은 서로에게 말하는(tell) 신호였고, 10번에서 지금은 헤드폰(headsets)을 쓰며, 11번에서 휘파람이 더 이상 사고를 일으키지 않는다고 해요.","c":4},"h":"51c3b90628"},{"n":10,"t":"fill","q":"Some [A] started for good [B].","ko":"일부 [A]은 타당한 [B]에서 시작되었다.","bank":["superstitions","reasons","silly","loosen","dropped","confused"],"bko":{"superstitions":"미신들","reasons":"이유들","silly":"어리석은","loosen":"느슨하게 하다","dropped":"떨어졌다","confused":"혼란스러운"},"r":{"a":"[A] superstitions, [B] reasons","ev":"1~2번 문장","s":[[1,"Do you think all superstitions are silly?","당신은 모든 미신이 어리석다고 생각하는가?"],[2,"Well, some started for good reasons!","그런데, 일부는 타당한 이유에서 시작되었다!"]],"w":"1번에서 미신(superstitions)이 어리석다고 생각하느냐고 묻고, 2번에서 some(= 일부 미신)은 타당한 이유(good reasons)에서 시작했다고 답해요.","c":null},"h":"719745ee22"}]},{"u":5,"id":"rt2-05-3","no":3,"ko":"도시는 초록색으로 변화 중!","items":[{"n":1,"t":"tf","q":"There is little space for trees and plants on the ground in most cities.","ko":"대부분의 도시에서는 땅 위에 나무와 식물을 위한 공간이 거의 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"There is little space for trees and plants on the ground.","땅 위에 나무와 식물을 위한 공간이 거의 없다."]],"w":"2번에서 There is little space for trees and plants on the ground라고 해요. little은 '거의 없는'이라는 뜻이에요.","c":"T"},"h":"c02f260928"},{"n":2,"t":"tf","q":"Plants and trees make flooding worse by absorbing rain.","ko":"식물과 나무는 빗물을 흡수해서 홍수를 더 심하게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"They also prevent flooding by absorbing rain.","그것들은 또한 빗물을 흡수함으로써 홍수를 방지한다."]],"w":"5번에서 식물과 나무는 빗물을 흡수함으로써 홍수를 방지한다(prevent)고 해요. 더 심하게 만든다는 말은 반대예요.","c":"F"},"h":"73100209c9"},{"n":3,"t":"tf","q":"Hundreds of plants and trees can be grown in the gardens of these buildings.","ko":"이런 건물의 정원에서는 수백 개의 식물과 나무가 자랄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Hundreds of plants and trees can be grown in these gardens.","수백 개의 식물과 나무가 이 정원에서 자랄 수 있다."]],"w":"9번에서 Hundreds of plants and trees can be grown in these gardens라고 해요.","c":"T"},"h":"10f61bffd6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Most cities are crowded.)","ko":"대부분의 도시들은 붐빈다.","opts":["조용한","깨끗한","붐비는","아름다운"],"word":"crowded","r":{"a":"3) 붐비는","ev":"1~2번 문장","s":[[1,"Most cities are crowded.","대부분의 도시들은 붐빈다."],[2,"There is little space for trees and plants on the ground.","땅 위에 나무와 식물을 위한 공간이 거의 없다."]],"w":"1번에 이어 2번에서 땅 위에 공간이 거의 없다고 해요. 사람과 건물이 가득해서 공간이 없는 모습이니 crowded = 붐비는.","c":3},"h":"3ccac2dd1a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Architects are now designing buildings with outdoor gardens.)","ko":"건축가들은 현재 야외 정원이 있는 건물을 설계하고 있다.","opts":["건축가들","화가들","농부들","기자들"],"word":"Architects","r":{"a":"1) 건축가들","ev":"8번 문장","s":[[8,"Architects are now designing buildings with outdoor gardens.","건축가들은 현재 야외 정원이 있는 건물을 설계하고 있다."]],"w":"건물을 설계하는(designing) 사람이니 Architects = 건축가들이에요.","c":1},"h":"64c64d40ca"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is called Bosco Verticale.","ko":"밑줄 친 It가 가리키는 것은?","sko":"그것은 보스코 베르티칼레라고 불린다.","opts":["이탈리아의 밀라노라는 도시","밀라노에 있는 유명한 녹색 건물","건축가들","야외 정원의 식물"],"r":{"a":"2) 밀라노에 있는 유명한 녹색 건물","ev":"10~11번 문장","s":[[10,"One of the most famous green buildings is in Milan, Italy.","가장 유명한 녹색 건물 중 하나는 이탈리아의 밀라노에 있다."],[11,"It is called Bosco Verticale.","그것은 보스코 베르티칼레라고 불린다."]],"w":"10번에서 가장 유명한 녹색 건물 중 하나가 밀라노에 있다고 했고, 11번 It is called Bosco Verticale.의 It은 바로 그 건물이에요.","c":2},"h":"d99a189e3d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So people in cities have found a new place for plants and trees — high above their heads.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 도시의 사람들은 식물과 나무를 위한 새로운 장소를 찾았는데, 바로 머리 위 높은 곳이다.","opts":["도시 사람들은 식물과 나무를 위한 새로운 장소를 머리 위 높은 곳에서 찾았다.","도시 사람들은 식물과 나무를 땅 밑에 심을 새로운 장소를 찾았다.","도시 사람들은 머리 위에 있는 식물과 나무를 모두 없애 버렸다.","도시 사람들은 식물과 나무 없이 사는 새로운 방법을 찾았다."],"r":{"a":"1) 도시 사람들은 식물과 나무를 위한 새로운 장소를 머리 위 높은 곳에서 찾았다.","ev":"7번 문장","s":[[7,"So people in cities have found a new place for plants and trees — high above their heads.","그래서 도시의 사람들은 식물과 나무를 위한 새로운 장소를 찾았는데, 바로 머리 위 높은 곳이다."]],"w":"So people in cities have found a new place for plants and trees — high above their heads.는 식물과 나무를 둘 새 장소를 머리 위 높은 곳에서 찾았다는 뜻이에요.","c":1},"h":"7f50a8d70f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대부분의 도시에는 땅 위에 식물을 위한 공간이 많다.","보스코 베르티칼레는 이탈리아의 로마에 있다.","식물과 나무는 도시의 공기를 더럽게 만든다.","보스코 베르티칼레라는 이름은 ‘수직의 숲’을 의미한다."],"opts":["Most cities have a lot of space for plants on the ground.","Bosco Verticale is in Rome, Italy.","Plants and trees make the air dirty in cities.","The name Bosco Verticale means “the vertical forest.”"],"r":{"a":"4) The name Bosco Verticale means “the vertical forest.”","ev":"10~12번 문장","s":[[10,"One of the most famous green buildings is in Milan, Italy.","가장 유명한 녹색 건물 중 하나는 이탈리아의 밀라노에 있다."],[11,"It is called Bosco Verticale.","그것은 보스코 베르티칼레라고 불린다."],[12,"Its name means “the vertical forest.”","그것의 이름은 ‘수직의 숲’을 의미한다."]],"w":"11~12번에서 이름이 Bosco Verticale이고 ‘수직의 숲’이라는 뜻이라고 해요. 땅 위 공간은 거의 없고(2번), 건물은 밀라노에 있고(10번), 식물과 나무는 공기를 깨끗하게 해요(4번).","c":4},"h":"5baf02ccc3"},{"n":9,"t":"sum","q":"Plants and trees clean the (A) and prevent (B) by absorbing rain.","ko":"식물과 나무는 (A)를 깨끗하게 하고 빗물을 흡수해서 (B)을 막는다.","oko":["(A) 공기 / (B) 홍수","(A) 물 / (B) 홍수","(A) 공기 / (B) 소음","(A) 땅 / (B) 화재","(A) 빛 / (B) 비"],"opts":["(A) air / (B) flooding","(A) water / (B) flooding","(A) air / (B) noise","(A) ground / (B) fire","(A) light / (B) rain"],"r":{"a":"1) (A) air / (B) flooding","ev":"4~5번 문장","s":[[4,"They clean the air.","그것들은 공기를 깨끗하게 한다."],[5,"They also prevent flooding by absorbing rain.","그것들은 또한 빗물을 흡수함으로써 홍수를 방지한다."]],"w":"4번에서 식물과 나무는 공기(air)를 깨끗하게 하고, 5번에서 빗물을 흡수함으로써 홍수(flooding)를 막는다고 해요.","c":1},"h":"992b1cc6eb"},{"n":10,"t":"fill","q":"Sometimes, plants and trees [A] homes for animals and help people [B].","ko":"때때로 식물과 나무는 동물들에게 서식지를 [A]하고 사람들이 [B]하도록 돕는다.","bank":["provide","relax","absorb","crowded","famous","grown"],"bko":{"provide":"제공하다","relax":"휴식하다","absorb":"흡수하다","crowded":"붐비는","famous":"유명한","grown":"자란"},"r":{"a":"[A] provide, [B] relax","ev":"6번 문장","s":[[6,"Sometimes, they provide homes for animals and help people relax.","때때로 그것들은 동물들에게 서식지를 제공하고 사람들이 휴식하도록 돕는다."]],"w":"6번 they provide homes for animals and help people relax에서 가져왔어요. [A]는 homes를 목적어로 받는 동사 provide(제공하다), [B]는 help people 뒤의 동사원형 relax(휴식하다)예요. absorb는 homes와 뜻이 맞지 않고, 나머지는 형용사나 과거분사라 자리에 맞지 않아요.","c":null},"h":"eb68f3dbac"}]},{"u":6,"id":"rt2-06-1","no":1,"ko":"후~ 생일 축하해","items":[{"n":1,"t":"tf","q":"The ancient Greeks gave gifts to Artemis, the goddess of the moon.","ko":"고대 그리스인들은 달의 여신인 아르테미스에게 선물을 바쳤다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"They gave gifts to Artemis, the goddess of the moon.","그들은 달의 여신인 아르테미스에게 선물을 바쳤다."]],"w":"5번에서 They gave gifts to Artemis, the goddess of the moon이라고 해요. They는 4번의 고대 그리스인들이에요.","c":"T"},"h":"54b09f61eb"},{"n":2,"t":"tf","q":"German parents served a cake with the same number of candles as the child’s age.","ko":"독일 부모는 아이의 나이와 같은 수의 초를 꽂은 케이크를 내어 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Parents served a cake with the same number of candles as the child’s age plus one.","부모는 아이의 나이에 하나를 더한 것과 같은 수의 초를 꽂아 케이크를 내어 주었다."]],"w":"11번에서 아이의 나이에 하나를 더한(plus one) 수의 초를 꽂았다고 해요. 나이와 같은 수가 아니라 하나 더 많아요.","c":"F"},"h":"0f2d13f297"},{"n":3,"t":"tf","q":"Some people believed that smoke from candles carried prayers to heaven.","ko":"어떤 사람들은 초에서 나온 연기가 기도를 하늘로 실어 나른다고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Some people believed that smoke from candles carried prayers to heaven.","어떤 사람들은 초에서 나온 연기가 기도를 하늘로 실어 나른다고 믿었다."]],"w":"8번에 그대로 나오는 내용이에요.","c":"T"},"h":"d3ac4b89f2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Cake with candles is a fun birthday tradition.)","ko":"초를 꽂은 케이크는 재미있는 생일 전통이다.","opts":["전통","요리","놀이","선물"],"word":"tradition","r":{"a":"1) 전통","ev":"1~2번 문장","s":[[1,"Cake with candles is a fun birthday tradition.","초를 꽂은 케이크는 재미있는 생일 전통이다."],[2,"But how did it begin?","그런데 그것이 어떻게 시작되었을까?"]],"w":"1번에서 초를 꽂은 케이크는 재미있는 생일 tradition이라고 하고, 2번에서 그것이 어떻게 시작됐는지 물어요. 오래 이어져 온 관습이니 tradition = 전통.","c":1},"h":"3462562e6f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In the 1700s they started celebrating children’s birthdays with cake.)","ko":"1700년대에 그들은 케이크로 아이들의 생일을 축하하기 시작했다.","opts":["준비하는","숨기는","축하하는","파는"],"word":"celebrating","r":{"a":"3) 축하하는","ev":"10번 문장","s":[[10,"In the 1700s they started celebrating children’s birthdays with cake.","1700년대에 그들은 케이크로 아이들의 생일을 축하하기 시작했다."]],"w":"10번은 아이들의 생일을 케이크로 기념하고 즐기기 시작했다는 뜻이에요. celebrate = 축하하다.","c":3},"h":"fc4f7196c1"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIn the 1700s they started celebrating children’s birthdays with cake.","ko":"밑줄 친 they가 가리키는 것은?","sko":"1700년대에 그들은 케이크로 아이들의 생일을 축하하기 시작했다.","opts":["독일인들","고대 그리스인들","아르테미스와 달의 여신","아이들"],"r":{"a":"1) 독일인들","ev":"9~10번 문장","s":[[9,"However, Germans probably made cake with candles a birthday tradition.","그러나 아마도 독일인들이 초를 꽂은 케이크를 생일 전통으로 만들었을 것이다."],[10,"In the 1700s they started celebrating children’s birthdays with cake.","1700년대에 그들은 케이크로 아이들의 생일을 축하하기 시작했다."]],"w":"10번의 they는 바로 앞 9번에서 초를 꽂은 케이크를 생일 전통으로 만들었다고 한 Germans(독일인들)예요.","c":1},"h":"0d755465cf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The ancient Greeks were probably the first to put candles on cake.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아마도 고대 그리스인들이 케이크에 초를 꽂은 최초의 사람들이었을 것이다.","opts":["고대 그리스인들은 케이크를 처음 만든 사람들이었을 것이다.","고대 그리스인들은 아마도 케이크에 초를 처음 꽂은 사람들이었을 것이다.","고대 그리스인들은 케이크에 초를 꽂지 않았을 것이다.","고대 그리스인들은 케이크를 가장 많이 먹은 사람들이었을 것이다."],"r":{"a":"2) 고대 그리스인들은 아마도 케이크에 초를 처음 꽂은 사람들이었을 것이다.","ev":"4번 문장","s":[[4,"The ancient Greeks were probably the first to put candles on cake.","아마도 고대 그리스인들이 케이크에 초를 꽂은 최초의 사람들이었을 것이다."]],"w":"the first to put candles on cake는 '케이크에 초를 꽂은 최초의 사람'이라는 뜻이에요. 케이크를 처음 만들었다는 말과는 달라요.","c":2},"h":"b311e50be0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["초를 꽂은 케이크는 1700년대 독일에서 시작되었다.","그리스인들은 아르테미스에게 초가 없는 큰 케이크를 바쳤다.","초에서 나온 연기가 기도를 달로 실어 날랐다.","초를 꽂은 케이크는 고대 그리스로 거슬러 올라간다."],"opts":["Cake with candles began in Germany in the 1700s.","The Greeks gave Artemis big cakes without candles.","Smoke from candles carried prayers to the moon.","Cake with candles goes back to ancient Greece."],"r":{"a":"4) Cake with candles goes back to ancient Greece.","ev":"3, 6, 8번 문장","s":[[3,"Cake with candles dates back to ancient Greece.","초를 꽂은 케이크는 고대 그리스로 거슬러 올라간다."],[6,"They gave her small cakes with candles.","그들은 그녀에게 초를 꽂은 작은 케이크를 바쳤다."],[8,"Some people believed that smoke from candles carried prayers to heaven.","어떤 사람들은 초에서 나온 연기가 기도를 하늘로 실어 나른다고 믿었다."]],"w":"3번에서 초를 꽂은 케이크는 고대 그리스로 거슬러 올라간다고 해요(date back to). 그리스인들은 초를 꽂은 작은 케이크를 바쳤고(6번), 연기가 기도를 실어 나른 곳은 하늘이에요(8번).","c":4},"h":"7c34a967c9"},{"n":9,"t":"sum","q":"Parents served a cake with candles as many as the child’s age plus (A), which showed their hope that the children would live (B).","ko":"부모는 아이의 나이에 (A)을 더한 수의 초를 꽂은 케이크를 내어 주었고, 이는 아이들이 더 (B) 살기를 바라는 마음을 나타냈다.","oko":["(A) 하나 / (B) 오래","(A) 하나 / (B) 짧게","(A) 둘 / (B) 오래","(A) 둘 / (B) 짧게","(A) 열 / (B) 행복하게"],"opts":["(A) one / (B) longer","(A) one / (B) shorter","(A) two / (B) longer","(A) two / (B) shorter","(A) ten / (B) happily"],"r":{"a":"1) (A) one / (B) longer","ev":"11~12번 문장","s":[[11,"Parents served a cake with the same number of candles as the child’s age plus one.","부모는 아이의 나이에 하나를 더한 것과 같은 수의 초를 꽂아 케이크를 내어 주었다."],[12,"It represented the parents’ hope for their children to live longer.","그것은 아이들이 더 오래 살기를 바라는 부모의 바람을 나타냈다."]],"w":"11번에서 아이 나이에 하나(one)를 더한 수의 초를 꽂았고, 12번에서 아이들이 더 오래(longer) 살기를 바라는 부모의 바람을 나타냈다고 해요.","c":1},"h":"8564caa97f"},{"n":10,"t":"fill","q":"The Greeks gave Artemis small cakes with [A], and these made the cakes [B] like the moon.","ko":"그리스인들은 아르테미스에게 [A]을 꽂은 작은 케이크를 바쳤고, 이것은 케이크를 달처럼 [B]하게 만들었다.","bank":["candles","glow","smoke","prayers","heaven","birthday"],"bko":{"candles":"초","glow":"빛나다","smoke":"연기","prayers":"기도","heaven":"하늘","birthday":"생일"},"r":{"a":"[A] candles, [B] glow","ev":"6~7번 문장","s":[[6,"They gave her small cakes with candles.","그들은 그녀에게 초를 꽂은 작은 케이크를 바쳤다."],[7,"The candles made the cakes glow like the moon.","초는 케이크를 달처럼 빛나게 만들었다."]],"w":"6번 small cakes with candles와 7번 The candles made the cakes glow like the moon에서 가져왔어요. [B]는 made the cakes 뒤의 동사원형이라 glow(빛나다)가 와요. 나머지는 명사라서 자리에 맞지 않고 뜻도 달라요.","c":null},"h":"517c1ba0fe"}]},{"u":6,"id":"rt2-06-2","no":2,"ko":"앗, 뜨거워!","items":[{"n":1,"t":"tf","q":"Scientists compared the effects of ice and other cures for burns.","ko":"과학자들은 화상에 대한 얼음과 다른 치료법의 효과를 비교했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Some scientists compared the treatment effects of ice and other cures.","몇몇 과학자들이 얼음과 다른 치료법의 치료 효과를 비교했다."]],"w":"5번에서 Some scientists compared the treatment effects of ice and other cures라고 해요.","c":"T"},"h":"b2eaeaa407"},{"n":2,"t":"tf","q":"Ice helped burns get better faster.","ko":"얼음은 화상이 더 빨리 낫도록 도왔다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"They found ice actually made the burn get better more slowly.","그들은 얼음이 실제로는 화상을 더 느리게 낫도록 한다는 것을 발견했다."]],"w":"6번에서 얼음은 실제로는 화상을 더 느리게(more slowly) 낫도록 했다고 해요. 더 빨리 낫게 한 것이 아니에요.","c":"F"},"h":"2cc0015a9e"},{"n":3,"t":"tf","q":"You should see a doctor right away for every minor burn.","ko":"가벼운 화상은 모두 바로 진찰을 받아야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"In this way, you can treat most minor burns at home.","이 방법으로, 대부분의 가벼운 화상을 집에서 치료할 수 있다."]],"w":"12번에서 대부분의 가벼운 화상은 집에서 치료할 수 있다고 해요. 2주가 지나도 낫지 않을 때 진찰을 받으라고 해요(13번).","c":"F"},"h":"ac376540a5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You run to get some ice to ease the pain.)","ko":"당신은 통증을 가라앉힐 얼음을 가지러 뛴다.","opts":["늘리다","덜어 주다","만들다","숨기다"],"word":"ease","r":{"a":"2) 덜어 주다","ev":"2번 문장","s":[[2,"You run to get some ice to ease the pain.","당신은 통증을 가라앉힐 얼음을 가지러 뛴다."]],"w":"2번은 통증을 줄이려고 얼음을 가지러 뛴다는 말이에요. ease the pain = 통증을 덜어 주다(가라앉히다).","c":2},"h":"667e7fc25e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, how can we treat a burn?)","ko":"그렇다면, 우리는 어떻게 화상을 치료할 수 있을까?","opts":["치료하다","비교하다","망치다","숨기다"],"word":"treat","r":{"a":"1) 치료하다","ev":"8번 문장","s":[[8,"So, how can we treat a burn?","그렇다면, 우리는 어떻게 화상을 치료할 수 있을까?"]],"w":"8번 질문 뒤에 9번부터 화상을 치료하는 방법이 이어져요. treat = 치료하다.","c":1},"h":"e74b76f9ff"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey found ice actually made the burn get better more slowly.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 얼음이 실제로는 화상을 더 느리게 낫도록 한다는 것을 발견했다.","opts":["화상을 입은 사람들","몇몇 과학자들","의사들","얼음 조각들"],"r":{"a":"2) 몇몇 과학자들","ev":"5~6번 문장","s":[[5,"Some scientists compared the treatment effects of ice and other cures.","몇몇 과학자들이 얼음과 다른 치료법의 치료 효과를 비교했다."],[6,"They found ice actually made the burn get better more slowly.","그들은 얼음이 실제로는 화상을 더 느리게 낫도록 한다는 것을 발견했다."]],"w":"6번의 They는 바로 앞 5번에서 얼음과 다른 치료법의 효과를 비교한 Some scientists예요.","c":2},"h":"d548f3e034"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, see a doctor if your skin doesn’t get better in two weeks.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 피부가 2주가 지나도록 낫지 않으면 진찰을 받아라.","opts":["피부가 2주가 지나도 낫지 않으면 진찰을 받아라.","피부가 2주 안에 나으면 진찰을 받아라.","2주 동안은 의사를 만나지 마라.","피부가 나으면 2주 동안 약을 먹어라."],"r":{"a":"1) 피부가 2주가 지나도 낫지 않으면 진찰을 받아라.","ev":"13번 문장","s":[[13,"However, see a doctor if your skin doesn’t get better in two weeks.","그러나 피부가 2주가 지나도록 낫지 않으면 진찰을 받아라."]],"w":"13번 if your skin doesn’t get better in two weeks는 피부가 2주가 지나도 낫지 않으면이라는 뜻이에요.","c":1},"h":"a180d2f300"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["얼음은 화상이 더 빨리 낫게 했다.","화상 입은 곳을 뜨거운 물 아래에 두어야 한다.","얼음은 동상과 심각한 피부 손상을 일으켰다.","가벼운 화상은 항상 병원에서 치료해야 한다."],"opts":["Ice made the burn get better faster.","You should put the burn under hot water.","Ice caused frostbite and serious skin damage.","Minor burns must always be treated in a hospital."],"r":{"a":"3) Ice caused frostbite and serious skin damage.","ev":"7번 문장","s":[[7,"Also, ice caused frostbite and the most serious skin damage.","게다가, 얼음은 동상과 가장 심각한 피부 손상을 야기했다."]],"w":"7번에서 얼음은 동상과 가장 심각한 피부 손상을 야기했다고 해요. 얼음은 더 느리게 낫게 했고(6번), 물은 시원한 물이어야 하며(9번), 가벼운 화상은 집에서 치료할 수 있어요(12번).","c":3},"h":"d5551f1127"},{"n":9,"t":"sum","q":"Ice does not (A) burns, and it can even cause (B).","ko":"얼음은 화상에 (A) 않고, 심지어 (B)을 일으킬 수 있다.","oko":["(A) 해를 입히 / (B) 동상","(A) 도움이 되 / (B) 햇볕에 탄 화상","(A) 닦아 주 / (B) 통증","(A) 식히 / (B) 헝겊","(A) 도움이 되 / (B) 동상"],"opts":["(A) hurt / (B) frostbite","(A) help / (B) sunburn","(A) clean / (B) pain","(A) cool / (B) cloth","(A) help / (B) frostbite"],"r":{"a":"5) (A) help / (B) frostbite","ev":"4, 7번 문장","s":[[4,"Ice doesn’t help.","얼음은 도움이 되지 않는다."],[7,"Also, ice caused frostbite and the most serious skin damage.","게다가, 얼음은 동상과 가장 심각한 피부 손상을 야기했다."]],"w":"4번에서 얼음은 도움이 되지 않는다(doesn’t help)고 하고, 7번에서 얼음이 동상(frostbite)과 가장 심각한 피부 손상을 야기했다고 해요.","c":5},"h":"77bfd481c9"},{"n":10,"t":"fill","q":"Put the burn under cool, running [A] for 20 minutes, or use a cool, wet [B].","ko":"화상 입은 곳을 시원한 흐르는 [A] 아래에 20분간 두거나, 시원한 젖은 [B]을 사용해라.","bank":["water","cloth","minor","doctor","damage","weeks"],"bko":{"water":"물","cloth":"헝겊","minor":"가벼운","doctor":"의사","damage":"손상","weeks":"주(週)들"},"r":{"a":"[A] water, [B] cloth","ev":"9~10번 문장","s":[[9,"Put the burn under cool, running water for 20 minutes.","화상 입은 곳을 시원한 흐르는 물 아래에 20분간 두어라."],[10,"Or you can use a cool, wet cloth.","또는 시원한 젖은 헝겊을 사용해도 된다."]],"w":"9번 Put the burn under cool, running water for 20 minutes와 10번 Or you can use a cool, wet cloth에서 가져왔어요. 흐르는 것은 물이고, 젖은 상태로 쓰는 것은 헝겊이에요. 나머지는 뜻이나 문장 모양이 맞지 않아요.","c":null},"h":"7177c57678"}]},{"u":6,"id":"rt2-06-3","no":3,"ko":"고래가 나타났다!","items":[{"n":1,"t":"tf","q":"The painting was a scene of people on a beach.","ko":"그 그림은 해변에 사람들이 있는 장면이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The painting was a scene of people on a beach.","그 그림은 해변에 사람들이 있는 장면이었다."]],"w":"3번에 The painting was a scene of people on a beach라고 그대로 나와요.","c":"T"},"h":"e338bd88da"},{"n":2,"t":"tf","q":"The fin under the paint was tiny.","ko":"물감 아래의 지느러미는 아주 작았다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Surprisingly, it was a huge fin!","놀랍게도, 그것은 거대한 지느러미였다!"]],"w":"7번에서 놀랍게도 그것은 거대한(huge) 지느러미였다고 해요. 작았다는 말은 반대예요.","c":"F"},"h":"9f8f46786a"},{"n":3,"t":"tf","q":"Some people believed that dead whales meant bad luck.","ko":"어떤 사람들은 죽은 고래가 불운을 의미한다고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Some people believed they meant bad luck.","어떤 사람들은 그것들이 불운을 의미한다고 믿었다."]],"w":"12번에서 Some people believed they meant bad luck이라고 해요. they는 죽은 고래들이에요.","c":"T"},"h":"1bf75d2090"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She continued to remove the layers of paint.)","ko":"그녀는 물감의 겹들을 계속해서 제거했다.","opts":["멈췄다","시작했다","거절했다","계속했다"],"word":"continued","r":{"a":"4) 계속했다","ev":"8번 문장","s":[[8,"She continued to remove the layers of paint.","그녀는 물감의 겹들을 계속해서 제거했다."]],"w":"8번은 물감을 벗겨 내는 일을 멈추지 않고 이어 갔다는 뜻이에요. 그 결과 9번에서 고래가 나타나요. continue = 계속하다.","c":4},"h":"460a81a7eb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Researchers said dead whales were an unpleasant subject for the people of that time.)","ko":"연구가들은 그 당시의 사람들에게 죽은 고래가 불쾌한 대상이었다고 말했다.","opts":["불쾌한","아름다운","흥미로운","안전한"],"word":"unpleasant","r":{"a":"1) 불쾌한","ev":"11~12번 문장","s":[[11,"Researchers said dead whales were an unpleasant subject for the people of that time.","연구가들은 그 당시의 사람들에게 죽은 고래가 불쾌한 대상이었다고 말했다."],[12,"Some people believed they meant bad luck.","어떤 사람들은 그것들이 불운을 의미한다고 믿었다."]],"w":"11번 뒤에 12번에서 죽은 고래가 불운을 의미한다고 믿었다고 해요. 그러니 unpleasant = 불쾌한(기분이 좋지 않은)이에요.","c":1},"h":"54d3f18350"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSome people believed they meant bad luck.","ko":"밑줄 친 they가 가리키는 것은?","sko":"어떤 사람들은 그것들이 불운을 의미한다고 믿었다.","opts":["죽은 고래들","연구가들","그 당시의 사람들","복원 전문가들"],"r":{"a":"1) 죽은 고래들","ev":"11~12번 문장","s":[[11,"Researchers said dead whales were an unpleasant subject for the people of that time.","연구가들은 그 당시의 사람들에게 죽은 고래가 불쾌한 대상이었다고 말했다."],[12,"Some people believed they meant bad luck.","어떤 사람들은 그것들이 불운을 의미한다고 믿었다."]],"w":"12번의 they는 바로 앞 11번에서 그 당시 사람들에게 불쾌한 대상이었다고 한 dead whales(죽은 고래들)예요.","c":1},"h":"b85cb80d19"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So it is likely that the whale was covered up.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 고래가 완전히 가려졌을 가능성이 있다.","opts":["그래서 고래가 해변으로 올라왔을 것이 확실하다.","그래서 고래가 그림에서 사라졌을 리 없다.","그래서 고래가 완전히 가려졌을 가능성이 있다.","그래서 고래가 가려진 이유를 모두가 알게 되었다."],"r":{"a":"3) 그래서 고래가 완전히 가려졌을 가능성이 있다.","ev":"13번 문장","s":[[13,"So it is likely that the whale was covered up.","그래서 고래가 완전히 가려졌을 가능성이 있다."]],"w":"it is likely that ~은 ‘~일 가능성이 있다’는 뜻이고, covered up은 완전히 가려졌다는 뜻이에요. 확실하다는 말이 아니에요.","c":3},"h":"79c003c65b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["물감 겹들이 제거되면서 죽은 고래가 나타났다.","복원 전문가는 20세기 그림을 닦고 있었다.","그 그림의 화가는 이탈리아 출신이었다.","연구가들은 고래가 숨겨진 이유를 정확히 안다."],"opts":["A dead whale appeared as the paint layers were removed.","The restorer cleaned a 20th-century painting.","The painter of the painting was from Italy.","Researchers know exactly why the whale was hidden."],"r":{"a":"1) A dead whale appeared as the paint layers were removed.","ev":"8~9번 문장","s":[[8,"She continued to remove the layers of paint.","그녀는 물감의 겹들을 계속해서 제거했다."],[9,"Soon a dead whale appeared on the beach.","곧 해변에 죽은 고래 한 마리가 나타났다."]],"w":"8~9번에서 물감의 겹들을 계속 제거하자 해변에 죽은 고래가 나타났어요. 그림은 17세기 것이고(1번), 화가는 네덜란드 사람이며(2번), 이유는 하나의 추측일 뿐이에요(14번).","c":1},"h":"3ef1b6fa8d"},{"n":9,"t":"sum","q":"Dead whales were an (A) subject at that time, so the whale was probably (B) in the painting.","ko":"그 당시 죽은 고래는 (A) 대상이어서, 그림에서 고래가 (B) 가능성이 있다.","oko":["(A) 인기 있는 / (B) 가려졌을","(A) 불쾌한 / (B) 더 잘 보였을","(A) 웃긴 / (B) 발견되었을","(A) 불쾌한 / (B) 가려졌을","(A) 인기 있는 / (B) 더 잘 보였을"],"opts":["(A) popular / (B) covered up","(A) unpleasant / (B) shown more","(A) funny / (B) found","(A) unpleasant / (B) covered up","(A) popular / (B) shown more"],"r":{"a":"4) (A) unpleasant / (B) covered up","ev":"11, 13번 문장","s":[[11,"Researchers said dead whales were an unpleasant subject for the people of that time.","연구가들은 그 당시의 사람들에게 죽은 고래가 불쾌한 대상이었다고 말했다."],[13,"So it is likely that the whale was covered up.","그래서 고래가 완전히 가려졌을 가능성이 있다."]],"w":"11번에서 죽은 고래는 그 당시 사람들에게 불쾌한(unpleasant) 대상이었고, 13번에서 그래서 고래가 완전히 가려졌을(covered up) 가능성이 있다고 해요.","c":4},"h":"f95b56050f"},{"n":10,"t":"fill","q":"As she cleaned the painting, a thin [A] of paint came off, and she saw a huge [B].","ko":"그녀가 그림을 닦을 때, 얇은 물감 한 [A]이 떼어졌고, 그녀는 거대한 [B]를 보았다.","bank":["layer","fin","guess","painter","restorer","researcher"],"bko":{"layer":"겹","fin":"지느러미","guess":"추측","painter":"화가","restorer":"복원 전문가","researcher":"연구가"},"r":{"a":"[A] layer, [B] fin","ev":"5~7번 문장","s":[[5,"As she cleaned the painting, a thin layer of paint came off.","그녀가 그림을 닦았을 때, 얇은 물감 한 겹이 떼어졌다."],[6,"She saw something strange.","그녀는 이상한 무언가를 보았다."],[7,"Surprisingly, it was a huge fin!","놀랍게도, 그것은 거대한 지느러미였다!"]],"w":"5번 a thin layer of paint came off와 6~7번 she saw something strange. Surprisingly, it was a huge fin!에서 가져왔어요. 물감은 한 겹(layer)이라고 세고, 거대한 것은 지느러미(fin)였어요. 나머지는 사람이거나 추측이라 뜻이 맞지 않아요.","c":null},"h":"513de2e729"}]},{"u":7,"id":"rt2-07-1","no":1,"ko":"앗, 귀가 먹먹해!","items":[{"n":1,"t":"tf","q":"It is not a good idea to sleep during takeoff and landing.","ko":"이륙과 착륙 동안 자는 것은 좋은 생각이 아니다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But sleeping during takeoff and landing is not a good idea.","그러나 이륙과 착륙 동안에 자는 것은 좋은 생각이 아니다."]],"w":"3번 문장에서 But sleeping during takeoff and landing is not a good idea.라고 해요. 그대로 맞는 내용이에요.","c":"T"},"h":"dd67ae441b"},{"n":2,"t":"tf","q":"Chewing gum makes the pressure in your ears worse.","ko":"껌을 씹는 것은 귀 내부의 압력을 더 나쁘게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Chewing gum helps, too.","껌을 씹는 것도 도움이 된다."]],"w":"8번 문장에서 Chewing gum helps, too.라고 해요. 껌을 씹는 것도 귀 압력을 낮추는 데 도움이 되니 반대 내용이에요.","c":"F"},"h":"eb3728b9ee"},{"n":3,"t":"tf","q":"You could lose some of your hearing in the worst case.","ko":"최악의 경우 당신은 청력 일부를 잃을 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"At worst you could lose some of your hearing.","최악의 경우에 당신은 청력 일부를 잃을 수도 있다."]],"w":"12번 문장에서 At worst you could lose some of your hearing.이라고 해요. at worst가 '최악의 경우'예요.","c":"T"},"h":"64f37969d5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (To reduce the pressure in your ears, you can yawn or swallow.)","ko":"귀 내부의 압력을 낮추기 위해 당신은 하품을 하거나 침을 삼킬 수 있다.","opts":["씹다","하품하다","뱉다","삼키다"],"word":"swallow","r":{"a":"4) 삼키다","ev":"7번 문장","s":[[7,"To reduce the pressure in your ears, you can yawn or swallow.","귀 내부의 압력을 낮추기 위해 당신은 하품을 하거나 침을 삼킬 수 있다."]],"w":"7번 문장에서 하품하기와 함께 귀 압력을 낮추는 방법으로 나와요. swallow는 '삼키다'이고, 같은 문장의 yawn은 '하품하다'라 헷갈리지 않게 주의해요. 씹다는 8번의 chew예요.","c":4},"h":"6f39f04d23"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You might feel dizzy.)","ko":"당신은 어지러울지도 모른다.","opts":["졸린","행복한","어지러운","배고픈"],"word":"dizzy","r":{"a":"3) 어지러운","ev":"11번 문장","s":[[11,"You might feel dizzy.","당신은 어지러울지도 모른다."]],"w":"귀가 손상될 때 생길 수 있는 일로 나와요. feel dizzy는 '어지러움을 느끼다'예요. 졸린은 sleepy(13번)라 다른 단어예요.","c":3},"h":"57afbe572d"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis changes the pressure in your ears.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 귀 내부의 압력을 변화시킨다.","opts":["비행기가 이륙하는 것","기압이 빠르게 변하는 것","안전띠를 매는 것","잠을 자고 싶은 것"],"r":{"a":"2) 기압이 빠르게 변하는 것","ev":"4~5번 문장","s":[[4,"At these times, the air pressure in the airplane changes quickly.","이때는, 기내 기압이 빠르게 변한다."],[5,"This changes the pressure in your ears.","이는 귀 내부의 압력을 변화시킨다."]],"w":"5번 문장의 This는 바로 앞 4번 문장의 내용, 즉 이착륙 때 기내 기압이 빠르게 변하는 것이에요. 그래서 귀 속 압력도 바뀐다고 이어져요.","c":2},"h":"7682170903"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So next time you feel sleepy on an airplane, remember: be awake during takeoff and landing.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러니 다음에 비행기에서 졸음이 오면, 기억하라. 이륙과 착륙 동안에는 깨어 있어라.","opts":["비행기에서 이륙과 착륙 때에만 잠을 자야 한다.","졸릴 때는 안전띠를 매고 바로 자는 것이 좋다.","비행기가 이륙한 뒤에는 계속 깨어 있어야 한다.","비행기에서 졸려도 이륙과 착륙 동안에는 깨어 있어야 한다."],"r":{"a":"4) 비행기에서 졸려도 이륙과 착륙 동안에는 깨어 있어야 한다.","ev":"13번 문장","s":[[13,"So next time you feel sleepy on an airplane, remember: be awake during takeoff and landing.","그러니 다음에 비행기에서 졸음이 오면, 기억하라. 이륙과 착륙 동안에는 깨어 있어라."]],"w":"remember 뒤에 be awake during takeoff and landing이 이어져요. 졸려도 이륙과 착륙 '동안'에는 깨어 있어야 한다는 뜻이에요. 이륙 뒤 내내 깨어 있으라는 말은 아니에요.","c":4},"h":"013d11376f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["하품, 침 삼키기, 껌 씹기는 귀 내부의 압력을 낮추는 데 도움이 된다.","잠을 자는 것이 귀 내부의 압력을 낮추는 데 도움이 된다.","하품하기만이 귀 내부의 압력을 낮추는 유일한 방법이다.","안전띠를 매는 것이 귀 내부의 압력을 낮춘다."],"opts":["Sleeping helps reduce the pressure in your ears.","Yawning is the only way to reduce the pressure in your ears.","Yawning, swallowing, and chewing gum can reduce the pressure in your ears.","Putting on a seat belt helps reduce the pressure in your ears."],"r":{"a":"3) Yawning, swallowing, and chewing gum can reduce the pressure in your ears.","ev":"7~8번 문장","s":[[7,"To reduce the pressure in your ears, you can yawn or swallow.","귀 내부의 압력을 낮추기 위해 당신은 하품을 하거나 침을 삼킬 수 있다."],[8,"Chewing gum helps, too.","껌을 씹는 것도 도움이 된다."]],"w":"7~8번 문장에서 하품하기, 침 삼키기, 껌 씹기가 모두 방법으로 나와요. 자는 동안은 이런 것들을 할 수 없고(9번), 하품이 유일한 방법이라는 말은 없어요. 안전띠는 1번에 나올 뿐 압력과 관계없어요.","c":3},"h":"b941adaa7c"},{"n":9,"t":"sum","q":"If you (A) during takeoff and landing, you cannot reduce the pressure in your ears, and this can (B) your ears.","ko":"이착륙 동안 (A)하면 귀 내부의 압력을 낮출 수 없고, 이것이 귀를 (B)할 수 있다.","oko":["(A) 하품하다 / (B) 손상시키다","(A) 자다 / (B) 깨끗하게 하다","(A) 껌을 씹다 / (B) 보호하다","(A) 깨어 있다 / (B) 돕다","(A) 자다 / (B) 손상시키다"],"opts":["(A) yawn / (B) damage","(A) sleep / (B) clean","(A) chew gum / (B) protect","(A) stay awake / (B) help","(A) sleep / (B) damage"],"r":{"a":"5) (A) sleep / (B) damage","ev":"9~10번 문장","s":[[9,"But you cannot do these things when you are asleep.","하지만 당신이 자고 있을 때는 이런 것들을 할 수 없다."],[10,"This could damage your ears.","이것이 귀에 손상을 줄 수 있다."]],"w":"9번에서 자고 있을 때는 압력을 낮추는 행동을 할 수 없다고 하고, 10번에서 이것이 귀에 손상을 줄 수 있다고 해요. 하품하거나 껌을 씹거나 깨어 있으면 오히려 압력을 낮출 수 있어요.","c":5},"h":"4209f5b3ac"},{"n":10,"t":"fill","q":"If you sleep during takeoff and landing, you could [A] some of your hearing. So you should be [B] at those tor Joseph Hudson gave them a solution.)","ko":"발명가 Joseph Hudson이 그들에게 해결책을 주었다.","opts":["문제","선물","해결책","설명"],"word":"solution","r":{"a":"3) 해결책","ev":"8~9번 문장","s":[[8,"Referees really needed something!","심판은 정말 무언가가 필요했다!"],[9,"Inventor Joseph Hudson gave them a solution.","발명가 Joseph Hudson이 그들에게 해결책을 주었다."]],"w":"8번에서 심판에게 무언가가 필요했다고 했고, 9번에서 Hudson이 그들에게 solution을 주었어요. 필요한 것에 대한 답이니 '해결책'이에요. gave라는 동사 때문에 '선물'로 오해하기 쉬워요.","c":3},"h":"1b668ef8a2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Soon, the whistle became common.)","ko":"곧, 호루라기가 흔해졌다.","opts":["희귀한","흔한","비싼","시끄러운"],"word":"common","r":{"a":"2) 흔한","ev":"14번 문장","s":[[14,"Soon, the whistle became common.","곧, 호루라기가 흔해졌다."]],"w":"14번은 새 호루라기가 널리 퍼졌다는 내용이고, 15번에서 대부분의 스포츠에서 쓰인다고 해요. common은 '흔한'이에요.","c":2},"h":"663bb28ddd"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIt could be heard in large crowds.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것은 수많은 군중 속에서 들릴 수 있었다.","opts":["경찰","스포츠 경기","군중","새로 발명된 호루라기"],"r":{"a":"4) 새로 발명된 호루라기","ev":"10, 12번 문장","s":[[10,"He invented a new whistle in the 1880s.","그는 1880년대에 새로운 호루라기를 발명했다."],[12,"It could be heard in large crowds.","그것은 수많은 군중 속에서 들릴 수 있었다."]],"w":"12번의 It could be heard in large crowds.에서 군중 속에서 들리는 것은 10번에서 Hudson이 발명한 new whistle이에요.","c":4},"h":"5a7f341af4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But they didn’t always have them.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 그들이 항상 호루라기를 가지고 있지는 않았다.","opts":["심판은 호루라기를 한 번도 가진 적이 없었다.","심판이 호루라기를 항상 가지고 있었던 것은 아니었다.","심판은 언제나 호루라기를 가지고 있었다.","심판은 호루라기를 항상 가지기를 싫어했다."],"r":{"a":"2) 심판이 호루라기를 항상 가지고 있었던 것은 아니었다.","ev":"1~2번 문장","s":[[1,"Whistles are useful for referees.","심판에게 호루라기는 유용하다."],[2,"But they didn’t always have them.","그러나 그들이 항상 호루라기를 가지고 있지는 않았다."]],"w":"not always는 '항상 ~인 것은 아니다'라는 부분 부정이에요. 호루라기가 없던 때도 있었다는 뜻이고, 한 번도 없었다는 뜻은 아니에요. 뒤의 3번에서 처음엔 깃발과 소리로 주의를 끌었다고 이어져요.","c":2},"h":"64a7b5eb5a"},{"n":8,"t":"match" las make only one sound when they eat.","Each gorilla has its own singing style.","Gorillas sing more quietly when they eat their favorite food.","Eva Luef studied gorillas in a zoo."],"r":{"a":"2) Each gorilla has its own singing style.","ev":"9번 문장","s":[[9,"Each gorilla has its own style.","고릴라 각자는 자신만의 스타일을 가지고 있다."]],"w":"9번에서 Each gorilla has its own style이라고 해요. 소리는 두 가지(4번), 좋아하는 음식에는 더 크게 노래하고(12번), 연구는 콩고의 야생 고릴라를 대상으로 했어요(3번).","c":2},"h":"7e80d02265"},{"n":9,"t":"sum","q":"Gorillas make two (A) when they eat: a deep humming and a (B).","ko":"고릴라는 먹을 때 두 가지 (A)를 낸다. 낮은 콧노래와 (B)이다.","oko":["(A) 소리 / (B) 농담","(A) 식사 / (B) 노래","(A) 소리 / (B) 배고픔","(A) 음식 / (B) 노래","(A) 소리 / (B) 노래"],"opts":["(A) sounds / (B) joke","(A) meals / (B) song","(A) sounds / (B) hunger","(A) foods / (B) song","(A) sounds / (B) song"],"r":{"a":"5) (A) sounds / (B) song","ev":"4, 5, 7번 문장","s":[[4,"She found that they made two different sounds during meals.","그녀는 그들이 식사 중에 두 가지 다른 소리를 낸다는 것을 발견했다."],[5,"One sound was a deep, steady humming.","한 가지 소리는 낮고 고정적인 콧노래였다."],[7,"The other sound was like a song.","다른 소리는 노래 같았다."]],"w":"4번에서 식사 중 두 가지 다른 소리(sounds)를 낸다고 하고, 5번의 낮은 콧노래와 7번의 노래 같은 소리(song)가 그 두 가지예요.","c":5},"h":"3b47a717a5"},{"n":10,"t":"fill","q":"When gorillas have their favorite food, they sing more [A], and these sounds show their [B].","ko":"고릴라는 가장 좋아하는 음식을 먹을 때 더 [A] 노래하고, 이 소리들은 그들의 [B]을 보여 준다.","bank":["loudly","happiness","delicious","wild","habit","melody"],"bko":{"loudly":"크게","happiness":"행복","delicious":"아주 맛있는","wild":"야생의","habit":"습관","melody":"멜로디"},"r":{"a":"[A] loudly, [B] happiness","ev":"12~13번 문장","s":[[12,"When they have their favorite food, they sing more loudly!","그들이 매우 좋아하는 음식을 먹을 때는, 더 크게 노래한다!"],[13,"These two habits are ways to show their happiness.","이 두 가지 습관은 그들의 행복을 보여 주는 방법이다."]],"w":"12번 they sing more loudly(더 크게 노래한다)와 13번 ways to show their happiness(행복을 보여 주는 방법)에서 가져왔어요. [A]는 sing을 꾸미는 말이라 부사 loudly가 와요. [B]는 show their 뒤의 명사인데, 본문에서 소리가 보여 주는 것은 happiness(행복)예요.","c":null},"h":"6765c99f10"}]},{"u":8,"id":"rt2-08-1","no":1,"ko":"일 년 내내 메리 크리스마스!","items":[{"n":1,"t":"tf","q":"Special street signs about Santa tell you to watch out for Santa.","ko":"산타에 관한 특별한 거리 표지판은 산타를 조심하라고 말해 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"You can see special street signs about Santa there.","그곳에서 산타에 관한 특별한 거리 표지판을 볼 수 있다."],[6,"They tell you to watch out for Santa.","그것들은 당신에게 산타를 조심하라고 말해 준다."]],"w":"5번에서 산타에 관한 특별한 거리 표지판이 있고, 6번에서 They tell you to watch out for Santa.라고 해요. They는 표지판이에요.","c":"T"},"h":"38a9d8f15e"},{"n":2,"t":"tf","q":"In Norway, people say that Santa Claus was born in Finland.","ko":"노르웨이에서 사람들은 산타클로스가 핀란드에서 태어났다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In Norway, people say that Santa Claus was born in Drøbak.","노르웨이에서 사람들은 산타클로스가 드뢰박에서 태어났다고 말한다."]],"w":"4번 문장에서 노르웨이 사람들은 산타가 드뢰박에서 태어났다고 말해요. 핀란드가 아니에요.","c":"F"},"h":"ba82f5e910"},{"n":3,"t":"tf","q":"Santa will read your letter during June and July.","ko":"산타는 당신의 편지를 6월과 7월 동안 읽을 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"He will read your letter during November and December.","그는 당신의 편지를 11월과 12월 동안 읽을 것이다."]],"w":"12번 문장에서 He will read your letter during November and December.라고 해요. 6월과 7월이 아니라 11월과 12월이에요.","c":"F"},"h":"aaa11bb9fa"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You can buy Christmas decorations and candles there.)","ko":"그곳에서 크리스마스 장식품과 양초를 살 수 있다.","opts":["장식품","양초","옷","우표"],"word":"decorations","r":{"a":"1) 장식품","ev":"8번 문장","s":[[8,"You can buy Christmas decorations and candles there.","그곳에서 크리스마스 장식품과 양초를 살 수 있다."]],"w":"8번은 크리스마스 집에서 살 수 있는 물건을 말해요. decorations는 장식품이고, 바로 뒤의 candles(양초)와 구분해야 해요.","c":1},"h":"2ee30d7d00"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If you’re lucky, you can take a picture with him on Christmas Day!)","ko":"당신이 운이 좋다면, 크리스마스에 산타와 함께 사진을 찍을 수 있다!","opts":["바쁜","유명한","운이 좋은","피곤한"],"word":"lucky","r":{"a":"3) 운이 좋은","ev":"13번 문장","s":[[13,"If you’re lucky, you can take a picture with him on Christmas Day!","당신이 운이 좋다면, 크리스마스에 산타와 함께 사진을 찍을 수 있다!"]],"w":"13번은 '운이 좋으면' 산타와 사진을 찍을 수 있다는 뜻이에요. lucky는 '운이 좋은'이고, 유명한은 7번의 famous예요.","c":3},"h":"0a030522e1"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe will read your letter during November and December.","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 당신의 편지를 11월과 12월 동안 읽을 것이다.","opts":["우체국 직원","산타","마을 주민","여행객"],"r":{"a":"2) 산타","ev":"11~12번 문장","s":[[11,"You can buy stamps and send Santa a letter.","당신은 우표를 사서 산타에게 편지를 보낼 수 있다."],[12,"He will read your letter during November and December.","그는 당신의 편지를 11월과 12월 동안 읽을 것이다."]],"w":"11번에서 산타에게 편지를 보낸다고 했고, 12번의 He는 그 편지를 읽는 산타예요.","c":2},"h":"f6932fd485"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It’s Christmas all year in Drøbak!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"드뢰박에서는 일 년 내내 크리스마스이다!","opts":["드뢰박에서는 크리스마스 하루만 사람들이 모인다.","드뢰박 사람들은 크리스마스를 싫어한다.","드뢰박은 크리스마스가 있는 달에만 문을 연다.","드뢰박에서는 일 년 내내 크리스마스이다."],"r":{"a":"4) 드뢰박에서는 일 년 내내 크리스마스이다.","ev":"3번 문장","s":[[3,"It’s Christmas all year in Drøbak!","드뢰박에서는 일 년 내내 크리스마스이다!"]],"w":"all year는 '일 년 내내'라는 뜻이에요. 그래서 드뢰박은 일 년 내내 크리스마스처럼 지낸다는 뜻이에요.","c":4},"h":"14fda4dfa7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Julehus에서 장식품과 양초를 살 수 있다.","산타의 우체국은 크리스마스 당일에만 방문할 수 있다.","거리 표지판은 양초를 어디서 사는지 알려 준다.","마을은 주로 거리 표지판으로 유명하다."],"opts":["You can buy decorations and candles at the Christmas House.","You can only visit Santa's post office on Christmas Day.","Street signs tell you where to buy candles.","The village is mainly famous for its street signs."],"r":{"a":"1) You can buy decorations and candles at the Christmas House.","ev":"7~8번 문장","s":[[7,"The village is mainly famous for Tregaarden’s Julehus, or “Christmas House.”","마을은 주로 Tregaarden’s Julehus, 즉 ‘크리스마스 집’으로 유명하다."],[8,"You can buy Christmas decorations and candles there.","그곳에서 크리스마스 장식품과 양초를 살 수 있다."]],"w":"7~8번에서 마을은 크리스마스 집으로 유명하고 그곳에서 장식품과 양초를 살 수 있어요. 표지판은 산타를 조심하라고 알려 줘요(6번).","c":1},"h":"86527980bb"},{"n":9,"t":"sum","q":"The Christmas House in Drøbak is (A) for its Christmas goods, and about 250,000 (B) visit it each year.","ko":"드뢰박의 크리스마스 집은 크리스마스 물건으로 (A)하고, 매년 약 25만 명의 (B)이 방문한다.","oko":["(A) 유명 / (B) 편지","(A) 이상 / (B) 사람","(A) 유명 / (B) 사람","(A) 저렴 / (B) 우표","(A) 닫혀 있음 / (B) 양초"],"opts":["(A) famous / (B) letters","(A) strange / (B) people","(A) famous / (B) people","(A) cheap / (B) stamps","(A) closed / (B) candles"],"r":{"a":"3) (A) famous / (B) people","ev":"7~9번 문장","s":[[7,"The village is mainly famous for Tregaarden’s Julehus, or “Christmas House.”","마을은 주로 Tregaarden’s Julehus, 즉 ‘크리스마스 집’으로 유명하다."],[8,"You can buy Christmas decorations and candles there.","그곳에서 크리스마스 장식품과 양초를 살 수 있다."],[9,"Around 250,000 people visit it each year.","매년 약 25만 명의 사람들이 그곳을 방문한다."]],"w":"7번에서 마을은 크리스마스 집으로 유명하고(famous), 8번에서 크리스마스 물건을 팔며, 9번에서 매년 약 25만 명의 사람들(people)이 방문해요.","c":3},"h":"caa6dbd8a6"},{"n":10,"t":"fill","q":"At Santa's post office, you can buy [A] and send Santa a letter, and he will [B] it in November and December.","ko":"산타의 우체국에서는 [A]를 사서 산타에게 편지를 보낼 수 있고, 산타는 11월과 12월에 그것을 [B]할 것이다.","bank":["stamps","read","November","lucky","born","famous"],"bko":{"stamps":"우표","read":"읽다","November":"11월","lucky":"운이 좋은","born":"태어난","famous":"유명한"},"r":{"a":"[A] stamps, [B] read","ev":"11~12번 문장","s":[[11,"You can buy stamps and send Santa a letter.","당신은 우표를 사서 산타에게 편지를 보낼 수 있다."],[12,"He will read your letter during November and December.","그는 당신의 편지를 11월과 12월 동안 읽을 것이다."]],"w":"11번 You can buy stamps and send Santa a letter와 12번 He will read your letter에서 가져왔어요. [A]는 buy의 목적어인 물건이라 stamps(우표)가 맞고, [B]는 will 뒤의 동사원형 read(읽다)가 와요. 나머지는 뜻이나 문장 모양이 맞지 않아요.","c":null},"h":"6c25ecdc4e"}]},{"u":8,"id":"rt2-08-2","no":2,"ko":"& Health 꿀꺽! 껌을 삼켰다고?","items":[{"n":1,"t":"tf","q":"Some people say that swallowed gum stays in your body for seven years.","ko":"몇몇 사람들은 삼킨 껌이 7년 동안 몸속에 남는다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"According to some people, now it will stay in your body for seven years.","몇몇 사람들에 따르면, 이제 그것은 7년 동안 당신의 몸속에 머물 것이다."]],"w":"3번 문장에서 According to some people, now it will stay in your body for seven years.라고 해요. 하지만 이것은 소문이고 4~5번에서 사실이 아니라고 해요. 이 문제는 '몇몇 사람들이 말한다'는 것이 맞는지를 묻고 있어요.","c":"T"},"h":"86ad16ec9e"},{"n":2,"t":"tf","q":"The swallowed gum never leaves your body.","ko":"삼킨 껌은 몸을 절대 떠나지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"And finally it leaves your body.","그리고 그것은 마침내 몸을 떠난다."]],"w":"12번 문장에서 And finally it leaves your body.라고 해요. 껌은 마침내 몸을 떠나요.","c":"F"},"h":"4c88485add"},{"n":3,"t":"tf","q":"Swallowing a lot of gum at one time can cause digestive problems.","ko":"한 번에 많은 껌을 삼키는 것은 소화 문제를 일으킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"Swallowing too much gum at once can cause digestive problems!","한꺼번에 너무 많은 껌을 삼키는 것은 소화 문제를 일으킬 수 있다!"]],"w":"14번 문장에서 Swallowing too much gum at once can cause digestive problems!라고 해요. at once는 '한꺼번에'예요.","c":"T"},"h":"4ec4f7508a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You accidentally swallowed gum.)","ko":"당신은 잘못해서 껌을 삼켰다.","opts":["일부러","뜻하지 않게","천천히","몰래"],"word":"accidentally","r":{"a":"2) 뜻하지 않게","ev":"1~2번 문장","s":[[1,"You accidentally swallowed gum.","당신은 잘못해서 껌을 삼켰다."],[2,"Oops!","이런!"]],"w":"1번 다음에 Oops!(이런!)가 나와요. 일부러 삼킨 것이 아니라 실수로 삼킨 거예요. accidentally는 '뜻하지 않게, 잘못하여'예요.","c":2},"h":"6e7217532f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Swallowing gum is usually harmless, but don’t make it a habit.)","ko":"껌을 삼키는 것은 대개는 무해하지만, 그것을 습관으로 만들지는 마라.","opts":["무해한","비싼","위험한","맛있는"],"word":"harmless","r":{"a":"1) 무해한","ev":"13번 문장","s":[[13,"Swallowing gum is usually harmless, but don’t make it a habit.","껌을 삼키는 것은 대개는 무해하지만, 그것을 습관으로 만들지는 마라."]],"w":"but 뒤에서 습관으로 만들지는 말라고 해서 앞은 '괜찮다'는 뜻이에요. harm(해) + less(없는)라서 harmless는 '무해한'이에요.","c":1},"
