rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

var D=[{"n": 1, "tag": null, "en": "Every country has their own culture.", "ko": "모든 나라는 고유의 문화를 가지고 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "their", "right": "its", "partial": false, "at": [3], "point": "대명사 일치: 단수명사 country는 단수대명사 its로 받음", "topic": "대명사 일치", "memo": "단수명사 country는 단수대명사 its로 받음"}]}, {"n": 2, "tag": null, "en": "Culture shows ways of living and to think.", "ko": "문화는 삶과 사고의 방식을 보여 준다.", "ok": false, "foot": [], "fixes": [{"wrong": "to think", "right": "thinking", "partial": false, "at": [6], "point": "병렬구조: and로 연결된 두 동명사 living, thinking의 형태를 일치", "topic": "병렬구조", "memo": "and로 연결된 두 동명사 living, thinking의 형태를 일치"}]}, {"n": 3, "tag": null, "en": "In each culture, there are rules what doesn’t allow certain things.", "ko": "각 문화마다 특정한 것들을 허용하지 않는 규칙이 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "what", "right": "that", "partial": false, "at": [6], "point": "관계대명사: 선행사 rules가 있으므로 what이 아닌 that(또는 which) 사용", "topic": "관계대명사", "memo": "선행사 rules가 있으므로 what이 아닌 that(또는 which) 사용"}, {"wrong": "doesn’t", "right": "don’t", "partial": false, "at": [7], "point": "수일치: 주어 rules(복수)에 맞춰 don’t 사용", "topic": "수일치", "memo": "주어 rules(복수)에 맞춰 don’t 사용"}]}, {"n": 4, "tag": null, "en": "So, we need knowing how to act in different countries.", "ko": "그래서 우리는 다른 나라에서 어떻게 행동해야 할지 알아야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "knowing", "right": "to know", "partial": false, "at": [3], "point": "동명사 vs to부정사: need는 목적어로 to부정사를 씀", "topic": "동명사 vs to부정사", "memo": "need는 목적어로 to부정사를 씀"}]}, {"n": 5, "tag": null, "en": "People around the world have make many unique and interesting rules.", "ko": "전 세계 사람들은 다양하고 흥미로운 규칙들을 만들어 왔다.", "ok": false, "foot": [], "fixes": [{"wrong": "have make", "right": "have made", "partial": false, "at": [4], "point": "현재완료: have/has 뒤에는 과거분사 (p.p.) 형태를 씀", "topic": "현재완료", "memo": "have/has 뒤에는 과거분사 (p.p.) 형태를 씀"}]}, {"n": 6, "tag": "스위스 · 반려동물 돌보기", "en": "In Switzerland, people real care about animals.", "ko": "스위스에서, 사람들은 동물을 정말로 아낀다.", "ok": false, "foot": [], "fixes": [{"wrong": "real", "right": "really", "partial": false, "at": [3], "point": "어법: 동사 care를 수식하는 것은 부사 really (real은 형용사)", "topic": "어법", "memo": "동사 care를 수식하는 것은 부사 really (real은 형용사)"}]}, {"n": 7, "tag": null, "en": "Swiss law does not allow people having just one hamster or one parrot at home.", "ko": "스위스 법은 사람들이 집에서 햄스터나 앵무새를 한 마리만 키우는 것을 허용하지 않는다.", "ok": false, "foot": ["1parrot 앵무새"], "fixes": [{"wrong": "having", "right": "to have", "partial": false, "at": [6], "point": "5형식: allow는 목적어 뒤에 목적격보어로 to부정사를 씀", "topic": "5형식", "memo": "allow는 목적어 뒤에 목적격보어로 to부정사를 씀"}]}, {"n": 8, "tag": null, "en": "They must to have at least two.", "ko": "최소 두 마리를 키워야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "to have", "right": "have", "partial": false, "at": [2], "point": "어법: 조동사 must 뒤에는 동사원형을 씀", "topic": "어법", "memo": "조동사 must 뒤에는 동사원형을 씀"}]}, {"n": 9, "tag": null, "en": "These pets feels lonely when they are lonely.", "ko": "이런 동물들은 혼자 있으면 외로움을 느낀다.", "ok": false, "foot": [], "fixes": [{"wrong": "feels", "right": "feel", "partial": false, "at": [2], "point": "수일치: 주어 pets(복수)에 맞춰 feel 사용", "topic": "수일치", "memo": "주어 pets(복수)에 맞춰 feel 사용"}, {"wrong": "lonely", "right": "alone", "partial": false, "at": [7], "point": "어휘: alone(혼자인, 상태)과 lonely(외로운, 감정)의 쓰임 구분 — '혼자 있을 때'는 alone", "topic": "어휘", "memo": "alone(혼자인, 상태)과 lonely(외로운, 감정)의 쓰임 구분 — '혼자 있을 때'는 alone"}]}, {"n": 10, "tag": null, "en": "They need a friend being with them.", "ko": "이들은 함께 있어 줄 친구가 필요하다.", "ok": false, "foot": [], "fixes": [{"wrong": "being", "right": "to be", "partial": false, "at": [4], "point": "to부정사의 형용사적 용법: 명사 friend를 뒤에서 꾸며 주는 to부정사", "topic": "to부정사의 형용사적 용법", "memo": "명사 friend를 뒤에서 꾸며 주는 to부정사"}]}, {"n": 11, "tag": null, "en": "Also, people which have dogs or cats must spend enough time with their pets.", "ko": "또한, 강아지나 고양이를 키우는 사람들은 충분한 시간을 반려동물과 함께 보내야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "which", "right": "who", "partial": false, "at": [2], "point": "관계대명사: 선행사가 사람(people)일 때는 who(또는 that)를 씀", "topic": "관계대명사", "memo": "선행사가 사람(people)일 때는 who(또는 that)를 씀"}]}, {"n": 12, "tag": null, "en": "Those who have dogs must let them to run outside for exercise too.", "ko": "강아지를 키우는 사람들은 강아지가 운동할 수 있도록 밖에서 뛰게 해야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "to run", "right": "run", "partial": false, "at": [7], "point": "5형식: 사역동사 let은 목적격보어로 동사원형을 씀", "topic": "5형식", "memo": "사역동사 let은 목적격보어로 동사원형을 씀"}]}, {"n": 13, "tag": null, "en": "Pets are much happily in Switzerland.", "ko": "스위스의 반려동물들은 정말 행복하다.", "ok": false, "foot": [], "fixes": [{"wrong": "much", "right": "very", "partial": false, "at": [2], "point": "어휘: 원급 형용사를 강조하는 것은 very (much는 비교급 앞에 씀)", "topic": "어휘", "memo": "원급 형용사를 강조하는 것은 very (much는 비교급 앞에 씀)"}, {"wrong": "happily", "right": "happy", "partial": false, "at": [3], "point": "어법: be동사의 보어 자리에는 형용사 happy 사용", "topic": "어법", "memo": "be동사의 보어 자리에는 형용사 happy 사용"}]}, {"n": 14, "tag": "싱가포르 · 도시 청결", "en": "Singapore is a very cleaning city.", "ko": "싱가포르는 매우 깨끗한 도시이다.", "ok": false, "foot": [], "fixes": [{"wrong": "cleaning", "right": "clean", "partial": false, "at": [4], "point": "어법: 명사 city를 꾸미는 자리에는 형용사 clean 사용 (cleaning은 동명사/분사)", "topic": "어법", "memo": "명사 city를 꾸미는 자리에는 형용사 clean 사용 (cleaning은 동명사/분사)"}]}, {"n": 15, "tag": null, "en": "Here, people cannot eat or drink on buses or the subway.", "ko": "이곳에서, 사람들은 버스나 지하철에서 먹거나 마실 수 없다.", "ok": true, "foot": [], "fixes": []}, {"n": 16, "tag": null, "en": "They also cannot sell or importing chewing gums.", "ko": "사람들은 또한 껌을 팔거나 수입할 수도 없다.", "ok": false, "foot": [], "fixes": [{"wrong": "importing", "right": "import", "partial": false, "at": [5], "point": "병렬구조: cannot 뒤에 이어지는 sell과 import의 형태를 일치", "topic": "병렬구조", "memo": "cannot 뒤에 이어지는 sell과 import의 형태를 일치"}, {"wrong": "gums", "right": "gum", "partial": false, "at": [7], "point": "어휘: gum(껌)은 물질명사로 복수형을 쓰지 않음", "topic": "어휘", "memo": "gum(껌)은 물질명사로 king. That way, French children can learn to love their food culture. Which rule is most surprising? Maybe some rules sound strange to you, but they show different lifestyles around the world. If we understand different rules from different countries, we can live together more happily."];var PASS_KO=["세계의 독특한 규칙", "모든 나라는 고유의 문화를 가지고 있다. 문화는 삶과 사고의 방식을 보여 준다. 각 문화마다 특정한 것들을 허용하지 않는 규칙이 있다. 그래서 우리는 다른 나라에서 어떻게 행동해야 할지 알아야 한다. 전 세계 사람들은 다양하고 흥미로운 규칙들을 만들어 왔다.", "스위스에서, 사람들은 동물을 정말로 아낀다. 스위스 법은 사람들이 집에서 햄스터나 앵무새를 한 마리만 키우는 것을 허용하지 않는다. 최소 두 마리를 키워야 한다. 이런 동물들은 혼자 있으면 외로움을 느낀다. 이들은 함께 있어 줄 친구가 필요하다. 또한, 강아지나 고양이를 키우는 사람들은 충분한 시간을 반려동물과 함께 보내야 한다. 강아지를 키우는 사람들은 강아지가 운동할 수 있도록 밖에서 뛰게 해야 한다. 스위스의 반려동물들은 정말 행복하다.", "싱가포르는 매우 깨끗한 도시이다. 이곳에서, 사람들은 버스나 지하철에서 먹거나 마실 수 없다. 사람들은 또한 껌을 팔거나 수입할 수도 없다. 이런 행동들은 도시를 더럽고 지저분하게 만들 수 있다. 규칙을 어기는 사람들은 벌금을 내야 한다. 싱가포르에서는 모두가 어디에서 먹고 어디에 자신의 쓰레기를 버려야 하는지 알고 있다. 이러한 규칙 덕분에, 싱가포르는 매우 깨끗한 상태를 유지한다.", "프랑스에서는 어린이들이 학교 식당에서 케첩을 먹을 수 없다. 이는 놀라운 일처럼 들리지만, 타당한 이유가 있다. 프랑스는 맛있는 음식으로 유명하다. 프랑스 사람들은 자신들의 음식을 매우 자랑스러워한다. 그들은 케첩이 음식의 진짜 맛을 숨긴다고 믿는다. 그들은 자녀들이 프랑스 요리의 맛을 보고 즐길 수 있기를 진심으로 바란다. 그런 방법으로, 프랑스 어린이들은 음식 문화를 사랑하는 법을 배울 수 있다. 어떤 규칙이 가장 놀라운가? 일부 규칙은 이상하게 들릴 수도 있지만, 그것들은 전 세계의 다양한 생활방식을 보여 준다. 만약 우리가 다른 나라의 다른 규칙을 이해한다면, 우리는 더 행복하게 더불어 살아갈 수 있다."];var DG=[{"dlg": [["G", "Excuse me. What should I visit in Sydney?", "실례합니다. 시드니에서 어디를 가 봐야 할까요?"], ["M", "I recommend Sydney Zoo. It’s the largest zoo in Australia. You can see koalas and kangaroos there.", "시드니 동물원을 추천해요. 그곳은 호주에서 가장 큰 동물원이에요. 거기서 코알라와 캥거루를 볼 수 있어요."], ["G", "That sounds fun!", "재미있겠네요!"], ["M", "Don’t forget to feed them!", "먹이 주는 것을 잊지 마세요!"], ["G", "Okay, I won’t.", "네, 잊지 않을게요."]], "qs": [{"n": 1, "q": "What does the man suggest?", "o": ["not feeding koalas and kangaroos", "going to the largest zoo in Australia", "going to a beach in Sydney", "buying koala toys at a shop", "visiting a tourist information center in Sydney"], "a": 1, "evs": [["M: I recommend Sydney Zoo. It’s the larges
