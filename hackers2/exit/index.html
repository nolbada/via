<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>

<script>
var P=[{"u":1,"id":"hk2-01-1","no":1,"ko":"유행은 죽지 않아!","items":[{"n":1,"t":"tf","q":"Skinny jeans were more popular than wide pants in the 1990s.","ko":"1990년대에는 스키니 진이 와이드 팬츠보다 더 인기였다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"For example, wide pants were a popular item in the 1990s.","예를 들어, 와이드 팬츠는 1990년대에 인기 있는 아이템이었다."]],"w":"4번 문장에서 1990년대에 인기 있던 아이템은 와이드 팬츠(wide pants)라고 해요. 스키니 진은 10년 뒤인 2000년대에 인기를 얻었어요.","c":"F"},"h":"ba5c1eb4af"},{"n":2,"t":"tf","q":"Wide pants felt new to young people because they had never worn them before.","ko":"젊은 사람들에게 와이드 팬츠가 새롭게 느껴졌는데, 전에 입어 본 적이 없었기 때문이다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"To them, wide pants were new because they had never worn them before.","그들에게는, 와이드 팬츠가 새로웠는데, 왜냐하면 이전에 그것을 입어본 적이 없었기 때문이다."]],"w":"8번 문장에 To them, wide pants were new because they had never worn them before라고 그대로 나와요. them은 7번의 젊은 사람들이에요.","c":"T"},"h":"22e7adb5ee"},{"n":3,"t":"tf","q":"Wide pants are not popular anymore, even today.","ko":"와이드 팬츠는 오늘날에도 더 이상 인기가 없다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Even today, many people enjoy wearing wide pants.","오늘날에도, 많은 사람들이 와이드 팬츠를 입는 것을 즐긴다."]],"w":"9번 문장에서 Even today, many people enjoy wearing wide pants(오늘날에도 많은 사람이 와이드 팬츠를 입는 것을 즐긴다)라고 해요. 인기가 없다는 말은 반대예요.","c":"F"},"h":"72fc0f2c66"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (People became sick of them, and they began to prefer skinny jeans.)","ko":"사람들은 그것들에 싫증이 났고, 스키니 진을 ( ) 시작했다.","opts":["거절하기","수선하기","선호하기","잊어버리기"],"word":"prefer","r":{"a":"3) 선호하기","ev":"6번 문장","s":[[6,"People became sick of them, and they began to prefer skinny jeans.","사람들은 그것들에 싫증이 나게 됐고, 그들은 스키니 진을 선호하기 시작했다."]],"w":"6번 문장에서 사람들은 와이드 팬츠에 싫증이 나서(sick of) 스키니 진을 새로 좋아하게 돼요. prefer(선호하다)는 여러 가지 중 더 좋아한다는 뜻이에요.","c":3},"h":"aff07b2108"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then, after another decade, wide pants started to become popular again…)","ko":"그 후, 또 다른 ( ) 후에, 와이드 팬츠가 다시 인기를 얻기 시작했다…","opts":["1년","10년","100년","1주일"],"word":"decade","r":{"a":"2) 10년","ev":"5, 7번 문장","s":[[5,"But after 10 years, they were too old to still be trendy.","하지만 10년 후에, 그것은 여전히 유행이기에는 너무 오래되었다."],[7,"Then, after another decade, wide pants started to become popular again, especially among young people.","그 후, 또 다른 10년 후에, 와이드 팬츠가 특히 젊은 사람들 사이에서 다시 인기 있게 되기 시작했다."]],"w":"5번에서 '10년 후(after 10 years)' 스키니 진으로 바뀌었고, 7번에서 또 한 번 다음 시기가 지나 와이드 팬츠가 돌아와요. decade는 10년이라는 뜻이에요.","c":2},"h":"dc12628c8b"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nOn the other hand, skinny jeans have lost their popularity.","ko":"밑줄 친 their가 가리키는 것은?","sko":"반면에, 스키니 진은 인기를 잃었다.","opts":["와이드 팬츠","스키니 진","젊은 사람들","1990년대 사람들"],"r":{"a":"2) 스키니 진","ev":"10번 문장","s":[[10,"On the other hand, skinny jeans have lost their popularity.","반면에, 스키니 진은 인기를 잃었다."]],"w":"10번 문장의 their는 같은 문장 앞에 나온 skinny jeans(스키니 진)를 가리켜요. 스키니 진이 인기(popularity)를 잃었다는 뜻이에요.","c":2,"k":"their = 스키니 진"},"pron":"their","h":"7a9093a3ab"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even if you haven’t, you have probably experienced this.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 당신이 이 말을 들어본 적이 없다고 하더라도, 아마 이것을 경험해봤을 것이다.","opts":["당신이 이 말을 들어본 적이 없더라도, 아마 이것을 경험해 봤을 것이다.","당신이 이 말을 들어봤다면, 분명히 이것을 경험했을 것이다.","당신은 이 말을 들어본 적도 없고, 경험해 본 적도 없을 것이다.","당신이 이것을 경험해 봤다면, 이 말을 들어본 적이 있을 것이다."],"r":{"a":"1) 당신이 이 말을 들어본 적이 없더라도, 아마 이것을 경험해 봤을 것이다.","ev":"3번 문장","s":[[3,"Even if you haven’t, you have probably experienced this.","비록 당신이 이 말을 들어본 적이 없다고 하더라도, 아마 이것을 경험해봤을 것이다."]],"w":"Even if you haven't (heard it)는 \"듣지 못했더라도\"라는 뜻이에요. probably experienced는 \"아마 경험했을 것이다\"예요. 들었든 안 들었든 아마 경험했을 거라는 말이에요.","c":1},"h":"3290d2b290"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["10년 후, 와이드 팬츠는 유행하기엔 너무 새로웠다.","10년 후, 와이드 팬츠는 유행하기엔 너무 오래된 것이 되었다.","10년 후, 와이드 팬츠는 훨씬 더 인기를 얻었다.","와이드 팬츠는 1990년대에 인기 있는 아이템이 아니었다."],"opts":["Wide pants were too new to be trendy after 10 years.","Wide pants were too old to be trendy after 10 years.","After 10 years, wide pants became even more popular.","Wide pants were not a popular item in the 1990s."],"r":{"a":"2) Wide pants were too old to be trendy after 10 years. (10년 후, 와이드 팬츠는 유행하기엔 너무 오래된 것이 되었다.)","ev":"5번 문장","s":[[5,"But after 10 years, they were too old to still be trendy.","하지만 10년 후에, 그것은 여전히 유행이기에는 너무 오래되었다."]],"w":"5번 문장에서 10년 후 와이드 팬츠는 여전히 유행이기에는 너무 오래되었다(too old to still be trendy)고 해요.","c":2},"h":"57b33a1a2b"},{"n":9,"t":"sum","q":"There is a (A) that says fashion trends (B).","ko":"‘패션 유행은 (B)’라는 (A)이(가) 있다.","oko":["(A) 노래 / (B) 사라진다","(A) 말 / (B) 사라진다","(A) 말 / (B) 반복된다","(A) 노래 / (B) 반복된다","(A) 규칙 / (B) 끝난다"],"opts":["(A) song / (B) disappear","(A) saying / (B) disappear","(A) saying / (B) repeat","(A) song / (B) repeat","(A) rule / (B) end"],"r":{"a":"3) (A) saying / (B) repeat ((A) 말 / (B) 반복된다)","ev":"1, 2번 문장","s":[[1,"“Fashion trends repeat.”","“패션 유행은 반복된다.”"],[2,"Have you ever heard this saying?","당신은 이 말을 들어본 적이 있는가?"]],"w":"1번 문장 “Fashion trends repeat.”와 2번 문장 this saying(이 말)에서 가져왔어요. 패션 유행은 반복된다(repeat)는 말(saying)이에요.","c":3},"h":"532f8f38f6"},{"n":10,"t":"fill","q":"Now, these jeans will have to [A] 10 to 20 years to become [B] again!","ko":"이제, 이 청바지는 다시 [B] 상태가 되기 위해 10년에서 20년을 [A]야 할 것이다!","bank":["wait","stylish","popularity","decade","prefer","worn"],"bko":{"wait":"기다려","stylish":"유행하는","popularity":"인기","decade":"10년","prefer":"선호하다","worn":"입었다(wear의 과거분사)"},"r":{"a":"[A] wait (기다려), [B] stylish (유행하는)","ev":"11번 문장","s":[[11,"Now, these jeans will have to wait 10 to 20 years to become stylish again!","이제, 이 청바지는 다시 유행이 되기 위해 10년에서 20년을 기다려야 할 것이다!"]],"w":"11번 문장 will have to wait(기다려야 할 것이다), become stylish(유행하는 상태가 되다)에서 가져왔어요. will have to 뒤에는 동사원형, become 뒤에는 형용사가 와요.","c":null},"h":"cd174100ec"}]},{"u":1,"id":"hk2-01-2","no":2,"ko":"신비한 반려동물사전","items":[{"n":1,"t":"tf","q":"A sugar glider can glide in the air.","ko":"슈가 글라이더는 공중에서 미끄러지듯 날 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It looks like a squirrel, but it is able to glide in the air.","그것은 다람쥐처럼 보이지만, 공중에서 미끄러지듯 날 수 있다."]],"w":"4번 문장에 it is able to glide in the air(공중에서 미끄러지듯 날 수 있다)가 나와요. 다람쥐처럼 보이지만 활공을 해요.","c":"T"},"h":"eb79c7f517"},{"n":2,"t":"tf","q":"The red-eyed crocodile skink is bigger than the dragon Toothless.","ko":"레드아이 크로커다일 스킨크는 용 투슬리스보다 더 크다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"This lizard looks like the dragon Toothless from How to Train Your Dragon, but it is much smaller.","이 도마뱀은 <드래곤 길들이기>에 나온 용 투슬리스처럼 보이지만, 훨씬 더 작다."]],"w":"11번 문장에서 스킨크는 용 투슬리스처럼 보이지만 훨씬 더 작다(much smaller)고 해요. 더 크다는 말은 반대예요.","c":"F"},"h":"99ffdebc64"},{"n":3,"t":"tf","q":"Sugar gliders like flying and hanging on your fingers.","ko":"슈가 글라이더는 날아다니는 것과 당신의 손가락에 매달리는 것을 좋아한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"It likes flying and hanging on your fingers.","그것은 날아다니는 것과 당신의 손가락에 매달리는 것을 좋아한다."]],"w":"5번 문장에 It likes flying and hanging on your fingers라고 그대로 나와요.","c":"T"},"h":"540929e421"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So, if you want to adopt a sugar glider, you had better get two.)","ko":"그래서, 슈가 글라이더를 ( ) 것을 원한다면, 두 마리를 얻는 것이 낫다.","opts":["팔다","입양하다","씻기다","그리다"],"word":"adopt","r":{"a":"2) 입양하다","ev":"8번 문장","s":[[8,"So, if you want to adopt a sugar glider, you had better get two.","그래서, 만약 슈가 글라이더를 입양하기를 원한다면, 두 마리를 얻는 것이 낫다."]],"w":"8번 문장은 슈가 글라이더를 집으로 데려와 기르려는 사람에게 하는 충고예요. adopt는 '입양하다'로, 동물을 데려와 가족으로 맞이한다는 뜻이에요.","c":2},"h":"9d186aabfb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Unlike sugar gliders, skinks are very shy and sensitive.)","ko":"슈가 글라이더와 달리, 스킨크는 매우 수줍음이 많고 ( ).","opts":["튼튼하다","느리다","사납다","예민하다"],"word":"sensitive","r":{"a":"4) 예민하다","ev":"13~14번 문장","s":[[13,"Unlike sugar gliders, skinks are very shy and sensitive.","슈가 글라이더와 달리, 스킨크는 매우 수줍음이 많고 예민하다."],[14,"If you touch them, they might become stressed and even play dead!","만약 당신이 그것들을 만지면, 스트레스를 받고 심지어 죽은 척할지도 모른다!"]],"w":"14번에서 만지면 스트레스를 받고 죽은 척한다고 해요. 작은 일에도 쉽게 반응하는 성격이라 sensitive는 '예민한'이에요.","c":4},"h":"2169ed1b12"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIf they are left alone often, they can even become sick.","ko":"밑줄 친 they가 가리키는 것은?","sko":"만약 그것들이 자주 혼자 남겨지면, 심지어 아프게 될 수도 있다.","opts":["슈가 글라이더들","다람쥐들","스킨크들","사람들"],"r":{"a":"1) 슈가 글라이더들","ev":"6~7번 문장","s":[[6,"At the same time, sugar gliders get lonely very easily.","동시에, 슈가 글라이더는 매우 쉽게 외로워진다."],[7,"If they are left alone often, they can even become sick.","만약 그것들이 자주 혼자 남겨지면, 심지어 아프게 될 수도 있다."]],"w":"6번에서 쉽게 외로워지는 동물은 sugar gliders(슈가 글라이더)예요. 7번의 they는 그 슈가 글라이더들이에요. 스킨크는 9번부터 나와요.","c":1},"h":"6b1789397c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Another unique pet is not so sociable.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"또 다른 독특한 반려동물은 별로 사교적이지 않다.","opts":["또 다른 독특한 반려동물은 모든 사람과 쉽게 친해진다.","또 다른 독특한 반려동물은 별로 크지 않다.","또 다른 독특한 반려동물은 사람들과 잘 어울리는 편이 아니다.","또 다른 독특한 반려동물은 별로 독특하지 않다."],"r":{"a":"3) 또 다른 독특한 반려동물은 사람들과 잘 어울리는 편이 아니다.","ev":"9번 문장","s":[[9,"Another unique pet is not so sociable.","또 다른 독특한 반려동물은 별로 사교적이지 않다."]],"w":"not so sociable은 '별로 사교적이지 않다'예요. 사람들과 잘 어울리지 않는다는 뜻이에요. Another unique pet은 '또 다른 독특한 반려동물'이라 독특하지 않다는 말도 틀려요.","c":3},"h":"8a4bf08699"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["슈가 글라이더는 오늘날 가장 흔한 반려동물이다.","레드아이 크로커다일 스킨크는 길이가 겨우 약 20센티미터이다.","슈가 글라이더는 수줍음이 많아서 다른 동물과 함께 있는 것을 싫어한다.","스킨크는 다람쥐처럼 생겼고 공중을 날 수 있다."],"opts":["Sugar gliders are the most common pets today.","A red-eyed crocodile skink is only about 20 centimeters long.","Sugar gliders are shy, so they hate being with other animals.","A skink looks like a squirrel and can glide in the air."],"r":{"a":"2) A red-eyed crocodile skink is only about 20 centimeters long.","ev":"12번 문장","s":[[12,"It’s only about 20 centimeters long.","그것은 겨우 약 20센티미터 길이이다."]],"w":"12번에 It's only about 20 centimeters long이라고 나와요. 가장 흔한 반려동물은 고양이, 개, 물고기, 햄스터이고(1번), 쉽게 외로워지는 건 슈가 글라이더예요(6번). 다람쥐를 닮고 나는 건 스킨크가 아니라 슈가 글라이더예요(4번).","c":2},"h":"d3fdd44c61"},{"n":9,"t":"sum","q":"Cats, dogs, fish, and hamsters are the most common pets, but some people (A) much (B) animals into their homes.","ko":"고양이, 개, 물고기, 햄스터가 가장 흔한 반려동물이지만, 몇몇 사람들은 훨씬 더 (B) 동물들을 집으로 (A).","oko":["(A) 보낸다 / (B) 더 작은","(A) 맞이한다 / (B) 더 작은","(A) 보낸다 / (B) 더 색다른","(A) 쫓아낸다 / (B) 더 귀여운","(A) 맞이한다 / (B) 더 색다른"],"opts":["(A) send / (B) smaller","(A) welcome / (B) smaller","(A) send / (B) stranger","(A) chase / (B) cuter","(A) welcome / (B) stranger"],"r":{"a":"5) (A) welcome / (B) stranger ((A) 맞이한다 / (B) 더 색다른)","ev":"1, 2번 문장","s":[[1,"Today, the most common pets are cats, dogs, fish, and hamsters.","오늘날, 가장 흔한 반려동물은 고양이, 개, 물고기, 그리고 햄스터이다."],[2,"But some people welcome much stranger animals into their homes.","하지만 몇몇 사람들은 훨씬 더 색다른 동물들을 그들의 집으로 맞이한다."]],"w":"2번 문장 But some people welcome much stranger animals into their homes(몇몇 사람들은 훨씬 더 색다른 동물들을 집으로 맞이한다)에서 가져왔어요. 흔한 반려동물과 대비되는 색다른 동물이에요.","c":5},"h":"b65c10c96a"},{"n":10,"t":"fill","q":"If you touch them, they might become [A] and even play [B]!","ko":"만약 당신이 그것들을 만지면, 그것들은 [A] 상태가 되고 심지어 [B] 척할지도 모른다!","bank":["stressed","dead","squirrel","glide","adopt","fingers"],"bko":{"stressed":"스트레스를 받은","dead":"죽은","squirrel":"다람쥐","glide":"미끄러지듯 날다","adopt":"입양하다","fingers":"손가락들"},"r":{"a":"[A] stressed (스트레스를 받은), [B] dead (죽은)","ev":"14번 문장","s":[[14,"If you touch them, they might become stressed and even play dead!","만약 당신이 그것들을 만지면, 스트레스를 받고 심지어 죽은 척할지도 모른다!"]],"w":"14번 문장 become stressed(스트레스를 받게 되다), play dead(죽은 척하다)에서 가져왔어요. become 뒤에는 형용사가 오고, play dead는 \"죽은 척하다\"라는 표현이에요.","c":null},"h":"b651724c2d"}]},{"u":1,"id":"hk2-01-3","no":3,"ko":"스키 타기 딱 좋아!","items":[{"n":1,"t":"tf","q":"Students at Sun Peaks School take a ski lift to get to school.","ko":"Sun Peaks 학교의 학생들은 학교에 가기 위해 스키 리프트를 탄다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"So they take a ski lift to get to school!","그래서 그들은 학교에 가기 위해 스키 리프트를 탄다!"]],"w":"5번 문장에 So they take a ski lift to get to school이라고 해요. 눈 덮인 길 때문에 리프트를 타고 가요.","c":"T"},"h":"8173961264"},{"n":2,"t":"tf","q":"The students at Sun Peaks School go to school on foot, by bus, or by subway.","ko":"Sun Peaks 학교의 학생들은 걸어서 또는 버스나 지하철을 타고 학교에 간다.","r":{"a":"F (본문과 다른 내용)","ev":"1~2번 문장","s":[[1,"Most students go to school on foot, by bus, or by subway.","대부분의 학생들은 도보로 또는 버스나 지하철을 타고 학교에 간다."],[2,"But the students at Sun Peaks School use a different method.","하지만 Sun Peaks 학교의 학생들은 다른 방법을 이용한다."]],"w":"1번은 '대부분의 학생들'의 등교 방법이에요. 2번 But 뒤에서 Sun Peaks 학교 학생들은 다른 방법을 쓴다고 해요.","c":"F"},"h":"3e1b29cc81"},{"n":3,"t":"tf","q":"The local parents raised funds from the local community.","ko":"지역의 학부모들은 지역 사회로부터 자금을 모았다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"They raised funds from the local community.","그들은 지역 사회로부터 자금을 모았다."]],"w":"11번 문장에 They raised funds from the local community라고 해요. They는 10번의 local parents예요.","c":"T"},"h":"7b01a5be22"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The school is located at the top of a ski slope that is 1,255 meters high.)","ko":"그 학교는 높이가 1,255미터인 스키장 꼭대기에 ( ).","opts":["무너져 있다","칠해져 있다","팔려 있다","위치해 있다"],"word":"located","r":{"a":"4) 위치해 있다","ev":"3번 문장","s":[[3,"The school is located at the top of a ski slope that is 1,255 meters high.","그 학교는 높이가 1,255미터인 스키장 꼭대기에 위치해 있다."]],"w":"3번은 학교가 스키장 꼭대기 어디에 있는지 알려 주는 문장이에요. be located at는 '~에 위치해 있다'는 뜻이에요.","c":4},"h":"a48773cc0b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Before Sun Peaks was founded, there was no school nearby.)","ko":"Sun Peaks가 ( ) 전에는, 근처에 학교가 없었다.","opts":["허물어지기","설립되기","팔리기","유명해지기"],"word":"founded","r":{"a":"2) 설립되기","ev":"8번 문장","s":[[8,"Before Sun Peaks was founded, there was no school nearby.","Sun Peaks가 설립되기 전에는, 근처에 학교가 없었다."]],"w":"8번은 학교가 생기기 전 상황이에요. found는 '설립하다'이고 was founded는 '설립되었다'예요. 같은 철자의 find(찾다)의 과거형 found와 헷갈리지 마세요.","c":2},"h":"c6c34b9d78"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nIt took students two hours to get to the closest one.","ko":"밑줄 친 one이 가리키는 것은?","sko":"학생들이 가장 가까운 학교에 가는 데 2시간이 걸렸다.","opts":["학교","스키 리프트","스키장","마을"],"r":{"a":"1) 학교","ev":"8~9번 문장","s":[[8,"Before Sun Peaks was founded, there was no school nearby.","Sun Peaks가 설립되기 전에는, 근처에 학교가 없었다."],[9,"It took students two hours to get to the closest one.","학생들이 가장 가까운 학교에 가는 데 2시간이 걸렸다."]],"w":"8번에서 근처에 학교(school)가 없었다고 했어요. 9번의 the closest one은 앞에 나온 school과 같은 종류인 '가장 가까운 학교'를 말해요.","c":1},"h":"f674923ef6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Thanks to their efforts, the children can now learn in their town.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들의 노력 덕분에, 아이들은 이제 그들의 마을에서 배울 수 있다.","opts":["아이들의 노력 때문에, 부모들은 다른 마을로 이사를 갔다.","부모들의 노력에도 불구하고, 아이들은 아직 먼 학교에 다닌다.","부모들의 노력 덕분에, 아이들은 이제 자기 마을에서 공부할 수 있다.","아이들이 열심히 공부해서, 마을에 새 학교가 생겼다."],"r":{"a":"3) 부모들의 노력 덕분에, 아이들은 이제 자기 마을에서 공부할 수 있다.","ev":"13번 문장","s":[[13,"Thanks to their efforts, the children can now learn in their town.","그들의 노력 덕분에, 아이들은 이제 그들의 마을에서 배울 수 있다."]],"w":"Thanks to는 '~ 덕분에'예요. their efforts는 10~12번에서 학교를 지으려 한 학부모들의 노력이고, 그 덕분에 아이들이 마을에서 배울 수 있어요. '~에도 불구하고'가 아니라는 점에 주의하세요.","c":3},"h":"3b9c7c96bf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["학교는 스키장 맨 아래에 있다.","학생들은 수업이 끝나면 스키를 타고 산비탈을 내려간다.","학생들은 월요일마다 야외 활동을 한다.","학교는 정부가 지었다."],"opts":["The school is at the bottom of a ski slope.","The students ski down the slope after class.","The students do outdoor activities on Mondays.","The government built the school."],"r":{"a":"2) The students ski down the slope after class.","ev":"3, 6~7, 10번 문장","s":[[3,"The school is located at the top of a ski slope that is 1,255 meters high.","그 학교는 높이가 1,255미터인 스키장 꼭대기에 위치해 있다."],[6,"Then, the students ski down the slope after class.","그리고, 학생들은 수업 후에 스키를 타고 산비탈을 내려간다."],[7,"On Fridays, they spend time in the snowy mountains doing outdoor activities.","금요일마다, 그들은 눈 덮인 산에서 야외 활동을 하며 시간을 보낸다."],[10,"So local parents worked together to build their own school.","그래서 지역의 학부모들은 그들만의 학교를 짓기 위해 함께 노력했다."]],"w":"6번 문장에 the students ski down the slope after class라고 나와요. 학교는 스키장 꼭대기에 있고(3번), 야외 활동은 금요일이며(7번), 학교는 지역 학부모들이 지었어요(10번).","c":2},"h":"a65ceca558"},{"n":9,"t":"sum","q":"Over 75,000 dollars was (A), so the children can now enjoy skiing (B).","ko":"75,000달러 이상이 (A), 그래서 아이들은 이제 스키 타는 것을 (B) 즐길 수 있다.","oko":["(A) 사라졌다 / (B) 언제든지","(A) 모였다 / (B) 결코","(A) 사라졌다 / (B) 결코","(A) 모였다 / (B) 거의 ~않게","(A) 모였다 / (B) 언제든지"],"opts":["(A) lost / (B) anytime","(A) collected / (B) never","(A) lost / (B) never","(A) collected / (B) rarely","(A) collected / (B) anytime"],"r":{"a":"5) (A) collected / (B) anytime ((A) 모였다 / (B) 언제든지)","ev":"12, 14번 문장","s":[[12,"As a result, over 75,000 dollars was collected.","결과적으로, 75,000달러 이상이 모였다."],[14,"Plus, they can enjoy skiing anytime!","게다가, 그들은 언제든지 스키 타는 것을 즐길 수 있다!"]],"w":"12번 문장 over 75,000 dollars was collected(75,000달러 이상이 모였다), 14번 문장 they can enjoy skiing anytime(언제든지 스키 타는 것을 즐길 수 있다)에서 가져왔어요.","c":5},"h":"fe1ee33042"},{"n":10,"t":"fill","q":"The [A] to the school is usually [B] with snow.","ko":"학교로 가는 [A]은(는) 보통 눈으로 [B].","bank":["way","covered","learn","raised","nearby","founded"],"bko":{"way":"길","covered":"덮여 있다","learn":"배우다","raised":"모았다","nearby":"근처에","founded":"설립했다"},"r":{"a":"[A] way (길), [B] covered (덮여 있다)","ev":"4번 문장","s":[[4,"The way to the school is usually covered with snow.","학교로 가는 길은 보통 눈으로 덮여 있다."]],"w":"4번 문장 The way to the school(학교로 가는 길), is covered with snow(눈으로 덮여 있다)에서 가져왔어요. be covered with는 \"~로 덮여 있다\"라는 표현이에요.","c":null},"h":"437031d1b4"}]},{"u":1,"id":"hk2-01-4","no":4,"ko":"색깔로 알 수 있어요","items":[{"n":1,"t":"tf","q":"An orange cup turns brown if its temperature drops below 15°C.","ko":"주황색 컵은 온도가 15도 이하로 떨어지면 갈색으로 바뀐다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"For example, an orange agnifying glasses.","ko":"산에 가면, 사람들이 (A) 플라스틱 물병들을 종종 발견한다. (B) 날에는 투명한 플라스틱병이 돋보기의 역할을 할 수 있다.","oko":["(A) 버린 / (B) 비 오는","(A) 빌린 / (B) 햇빛이 쨍쨍한","(A) 씻은 / (B) 추운","(A) 빌린 / (B) 비 오는","(A) 버린 / (B) 햇빛이 쨍쨍한"],"opts":["(A) abandoned / (B) rainy","(A) borrowed / (B) sunny","(A) washed / (B) cold","(A) borrowed / (B) rainy","(A) abandoned / (B) sunny"],"r":{"a":"5) (A) abandoned / (B) sunny ((A) 버린 / (B) 햇빛이 쨍쨍한)","ev":"1, 3번 문장","s":[[1,"When you go to the mountains, you often find plastic water bottles people have abandoned.","산에 가면, 당신은 사람들이 버린 플라스틱 물병들을 종종 발견한다."],[3,"On a sunny day, clear plastic bottles can act as magnifying glasses.","햇빛이 쨍쨍한 날, 투명한 플라스틱병은 돋보기의 역할을 할 수 있다."]],"w":"1번 문장 plastic water bottles people have abandoned(사람들이 버린 플라스틱 물병), 3번 문장 On a sunny day(햇빛이 쨍쨍한 날)에서 가져왔어요.","c":5},"h":"9dc42a4de8"},{"n":10,"t":"fill","q":"So, you should make sure not to [A] things behind in the mountains. This can [B] in huge disasters.","ko":"따라서, 당신은 산에 물건들을 [A] 않도록 반드시 주의해야 한다. 이것은 엄청난 재난을 [B] 수 있다.","bank":["leave","result","bottles","newspapers","spot","minutes"],"bko":{"leave":"두고 가지","result":"초래할","bottles":"병들","newspapers":"신문지들","spot":"지점","minutes":"분"},"r":{"a":"[A] leave (두고 가지), [B] result (초래할)","ev":"9, 10번 문장","s":[[9,"So, you should make sure not to leave things behind in the mountains.","따라서, 당신은 반드시 산에 물건들을 두고 가지 않아야 한다."],[10,"This can result in huge disasters.","이것은 엄청난 재난을 야기할 수 있다."]],"w":"9번 문장 not to leave things behind(물건들을 두고 가지 않다), 10번 문장 result in huge disasters(엄청난 재난을 초래하다)에서 가져왔어요. not to 뒤에는 동사원형 leave, can 뒤에는 동사원형 result가 와요.","c":null},"h":"7b70f0f0fe"}]},{"u":2,"id":"hk2-02-4","no":4,"ko":"나를 찾아줘","items":[{"n":1,"t":"tf","q":"Easter eggs are hidden messages or features in films, TV shows, and computer games.","ko":"이스터 에그는 영화, TV 프로그램, 그리고 컴퓨터 게임에 숨겨진 메시지나 기능이다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Easter eggs are hidden messages or features in films, TV shows, and computer games.","이스터 에그는 영화, TV 프로그램, 그리고 컴퓨터 게임에 숨겨진 메시지나 기능이다."]],"w":"1번 문장이 이스터 에그의 뜻을 그대로 알려 줘요. 영화, TV 프로그램, 컴퓨터 게임에 숨겨진 메시지나 기능이에요.","c":"T"},"h":"9c9b305674"},{"n":2,"t":"tf","q":"When you say “Give me a beat!” to Siri, Siri will sing a song.","ko":"Siri에게 “나에게 비트를 줘!”라고 말하면, Siri는 노래를 부를 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"7~9번 문장","s":[[7,"If you have an iPhone, try saying “Hey, Siri.","만약 당신이 아이폰을 가지고 있다면, “이봐, Siri야."],[8,"Give me a beat!”","나에게 비트를 줘!”라고 한번 말해봐라."],[9,"Siri will beatbox for you.","Siri는 당신을 위해 비트박스를 할 것이다."]],"w":"7~9번에서 아이폰을 가졌다면 Siri에게 “Give me a beat!”라고 말해 보라고 하고, 그러면 Siri가 beatbox for you(비트박스를 한다)고 해요. 노래를 부르는 게 아니에요.","c":"F"},"h":"725670bf29"},{"n":3,"t":"tf","q":"All Easter eggs are easy to find.","ko":"모든 이스터 에그는 찾기 쉽다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"But some of them are so hard to find that it can take years to do so.","하지만 그것들 중 몇몇은 찾기 너무 어려워서 찾는 데 몇 년이 걸릴 수 있다."]],"w":"13번 문장에서 some of them are so hard to find that it can take years(몇몇은 너무 찾기 어려워서 몇 년이 걸릴 수 있다)고 해요. 모두 쉽다는 말은 틀려요.","c":"F"},"h":"67e0eaf14e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Easter eggs are hidden messages or features in films, TV shows, and computer games.)","ko":"이스터 에그는 영화, TV 프로그램, 컴퓨터 게임에 ( ) 메시지나 기능이다.","opts":["숨겨진","오래된","값비싼","유명한"],"word":"hidden","r":{"a":"1) 숨겨진","ev":"1번 문장","s":[[1,"Easter eggs are hidden messages or features in films, TV shows, and computer games.","이스터 에그는 영화, TV 프로그램, 그리고 컴퓨터 게임에 숨겨진 메시지나 기능이다."]],"w":"이스터 에그는 처음에는 눈에 안 띄는 메시지예요. 5번에서도 '방금 이스터 에그를 찾았다(found)'고 해요. hidden은 '숨겨진'이라는 뜻이에요.","c":1},"h":"037adf19ca"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Just take the first letter of each sentence in this paragraph.)","ko":"이 ( )에 있는 각 문장의 첫 글자를 가져와 봐라.","opts":["그림","제목","문단","숫자"],"word":"paragraph","r":{"a":"3) 문단","ev":"3번 문장","s":[[3,"Just take the first letter of each sentence in this paragraph.","이 문단에 있는 각 문장의 첫 글자를 가져와 봐라."]],"w":"3번은 각 문장의 첫 글자를 모으라는 방법이에요. 문장들이 모여 있는 것은 paragraph(문단)이에요.","c":3},"h":"602b573711"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nObserve what they spell.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그것들이 어떤 단어가 되는지 봐라.","opts":["문장들","각 문장의 첫 글자들","영화들","이스터 에그들"],"r":{"a":"2) 각 문장의 첫 글자들","ev":"3~4번 문장","s":[[3,"Just take the first letter of each sentence in this paragraph.","이 문단에 있는 각 문장의 첫 글자를 가져와 봐라."],[4,"Observe what they spell.","그것들이 어떤 단어가 되는지 봐라."]],"w":"3번에서 각 문장의 첫 글자(the first letter of each sentence)를 가져오라고 했어요. 4번 they는 그 첫 글자들이고, 그 글자들이 모여 단어(ENJOY)가 돼요.","c":2},"h":"79a9f5408c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Here are some other examples you might “enjoy.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"여기 당신이 ‘즐길’ 수도 있을 다른 예시들이 있다.","opts":["여기 당신이 이미 즐긴 다른 예시들이 있다.","여기 다른 사람들이 즐기지 못한 예시들이 있다.","여기 당신이 즐길 수 없는 다른 예시들이 있다.","여기 당신이 즐길지도 모르는 다른 예시들이 있다."],"r":{"a":"4) 여기 당신이 즐길지도 모르는 다른 예시들이 있다.","ev":"6번 문장","s":[[6,"Here are some other examples you might “enjoy.”","여기 당신이 ‘즐길’ 수도 있을 다른 예시들이 있다."]],"w":"you might enjoy가 examples를 꾸며서 '당신이 즐길지도 모를 예시들'이 돼요. might는 '~일지도 모른다'는 불확실한 추측이라, 이미 즐겼다거나 즐길 수 없다는 뜻이 아니에요.","c":4},"h":"a1077222b2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Siri에게 “Give me a beat!”라고 말하면 노래를 부른다.","구글에서 “Atari Breakout”을 검색하면 벽돌 깨기 게임을 즐길 수 있다.","모든 이스터 에그는 쉽게 찾을 수 있다.","이스터 에그는 영화에서만 찾을 수 있다."],"opts":["Siri sings a song when you say “Give me a beat!”","In Google, you can enjoy a brick-breaking game by typing “Atari Breakout”.","All Easter eggs are easy to find.","Easter eggs can be found only in films."],"r":{"a":"2) In Google, you can enjoy a brick-breaking game by typing “Atari Breakout”.","ev":"10~11번 문장","s":[[10,"In Google, type “Atari Breakout” in the search bar and click on the “I’m Feeling Lucky” button.","구글에서는, 검색 창에 ‘Atari Breakout(아타리 탈옥)’을 입력하고 ‘I’m Feeling Lucky(나는 운이 좋은 것 같아)’ 버튼을 클릭해라."],[11,"Then you can enjoy a brick-breaking game!","그러면 당신은 벽돌 깨기 게임을 즐길 수 있다!"]],"w":"10~11번에서 구글 검색 창에 “Atari Breakout”을 입력하고 버튼을 누르면 벽돌 깨기 게임을 즐길 수 있다고 해요. Siri는 비트박스를 하고(9번), 어려운 것도 있으며(13번), 이스터 에그는 영화, TV, 게임에 있어요(1번).","c":2},"h":"dee1160c11"},{"n":9,"t":"sum","q":"Easter eggs are fun and (A). You have just (B) one in this paragraph.","ko":"이스터 에그는 재미있고 (A). 당신은 방금 이 문단에서 하나를 (B).","oko":["(A) 지루하다 / (B) 발견했다","(A) 흥미롭다 / (B) 잃어버렸다","(A) 지루하다 / (B) 잃어버렸다","(A) 비싸다 / (B) 발견했다","(A) 흥미롭다 / (B) 발견했다"],"opts":["(A) boring / (B) found","(A) interesting / (B) lost","(A) boring / (B) lost","(A) expensive / (B) found","(A) interesting / (B) found"],"r":{"a":"5) (A) interesting / (B) found ((A) 흥미롭다 / (B) 발견했다)","ev":"5, 12번 문장","s":[[5,"You’ve just found an Easter egg.","당신은 방금 이스터 에그를 발견했다."],[12,"Easter eggs are fun and interesting.","이스터 에그는 재미있고 흥미롭다."]],"w":"12번 문장 Easter eggs are fun and interesting(이스터 에그는 재미있고 흥미롭다), 5번 문장 You’ve just found an Easter egg(당신은 방금 이스터 에그를 발견했다)에서 가져왔어요.","c":5},"h":"5d66ba2422"},{"n":10,"t":"fill","q":"In one video game, for example, it [A] 26 years for [B] to find an Easter egg!","ko":"한 비디오 게임에서는, 예를 들어, [B]이(가) 이스터 에그를 찾는 데 26년이 [A]!","bank":["took","players","paragraph","letters","years","brick"],"bko":{"took":"걸렸다","players":"플레이어들","paragraph":"문단","letters":"글자들","years":"해(년)","brick":"벽돌"},"r":{"a":"[A] took (걸렸다), [B] players (플레이어들)","ev":"14번 문장","s":[[14,"In one video game, for example, it took 26 years for players to find an Easter egg!","한 비디오 게임에서는, 예를 들어, 플레이어가 이스터 에그를 발견하는 데 26년이 걸렸다!"]],"w":"14번 문장 it took 26 years for players to find(플레이어들이 찾는 데 26년이 걸렸다)에서 가져왔어요. take의 과거형 took이고, it takes/took 시간 for 사람 to 동사원형은 \"~가 …하는 데 시간이 걸리다\"라는 뜻이에요.","c":null},"h":"b49d75c2fd"}]},{"u":3,"id":"hk2-03-1","no":1,"ko":"킁킁, 이 냄새의 원인은?","items":[{"n":1,"t":"tf","q":"Genes are one reason why some people smell stronger than others.","ko":"유전자는 어떤 사람들이 다른 사람들보다 더 강한 냄새가 나는 이유 중 하나이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"However, some people have a stronger scent than others.","하지만, 어떤 사람들은 다른 사람들보다 더 강한 냄새를 가지고 있다."],[3,"Scientists say one reason for this is genes.","과학자들은 이것에 대한 한 가지 이유가 유전자라고 말한다."]],"w":"2번에서 사람마다 냄새의 세기가 다르다고 했고, 3번에서 그 이유 중 하나가 유전자(genes)라고 해요.","c":"T"},"h":"ee927aa97f"},{"n":2,"t":"tf","q":"Washing behind your ears often makes you smell more.","ko":"귀 뒤를 자주 씻으면 냄새가 더 많이 난다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Also, wash behind your ears frequently, and you’ll smell much less.","또한, 귀 뒤를 자주 씻어라, 그러면 냄새가 훨씬 덜 날 것이다."]],"w":"10번에서 귀 뒤를 자주 씻으면 냄새가 훨씬 덜 날 것(smell much less)이라고 해요. 더 많이 난다는 말은 반대예요.","c":"F"},"h":"8f5b40a9c4"},{"n":3,"t":"tf","q":"A person with a strong odor may have the GG gene.","ko":"강한 체취를 가진 사람은 GG 유전자를 가지고 있을지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"So, if you have a strong odor, you may have the GG gene.","그래서, 만약 당신이 강한 체취를 가지고 있다면, 당신은 GG 유전자를 가지고 있을지도 모른다."]],"w":"7번에서 강한 체취를 가지고 있다면 GG 유전자를 가지고 있을지도 모른다(may have)고 해요.","c":"T"},"h":"19cf7bb44e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, some people have a stronger scent than others.)","ko":"하지만, 어떤 사람들은 다른 사람들보다 더 강한 ( )를 가지고 있다.","word":"scent","opts":["소리","냄새","크기","온도"],"r":{"a":"2) 냄새","ev":"2번 문장","s":[[2,"However, some people have a stronger scent than others.","하지만, 어떤 사람들은 다른 사람들보다 더 강한 냄새를 가지고 있다."]],"w":"2번은 사람마다 몸에서 나는 냄새가 다르다는 말이에요. 1번의 smell bad(안 좋은 냄새가 나다)와 이어서 scent는 냄새예요.","c":2},"h":"24180b9086"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (There are a few things you can do to deal with body odor.)","ko":"체취를 ( ) 위해 당신이 할 수 있는 몇 가지가 있다.","word":"deal with","opts":["거래하다","만나다","처리하다","숨기다"],"r":{"a":"3) 처리하다","ev":"8번 문장","s":[[8,"There are a few things you can do to deal with body odor.","체취를 처리하기 위해 당신이 할 수 있는 몇 가지가 있다."]],"w":"8번 뒤에서 과일 먹기와 귀 뒤 씻기 같은 방법이 나와요. 그래서 deal with는 체취를 처리하다(다루다)예요. '거래하다'는 deal 단독의 다른 뜻이에요.","c":3},"h":"4bb4bf4c2b"},{"n":6,"t":"ref","q":"What does the underlined \"there\" refer to?\nLots of sebum and dirt build up there, causing a bad smell.","ko":"밑줄 친 there가 가리키는 것은?","sko":"많은 피지와 때가 그곳에 쌓이고 나서, 안 좋은 냄새를 유발한다.","opts":["귀 뒤","과일 속","유전자","땀샘 안쪽"],"r":{"a":"1) 귀 뒤","ev":"10~11번 문장","s":[[10,"Also, wash behind your ears frequently, and you’ll smell much less.","또한, 귀 뒤를 자주 씻어라, 그러면 냄새가 훨씬 덜 날 것이다."],[11,"Lots of sebum and dirt build up there, causing a bad smell.","많은 피지와 때가 그곳에 쌓이고 나서, 안 좋은 냄새를 유발한다."]],"w":"10번에서 귀 뒤를 자주 씻으라고 했어요. 11번의 there는 바로 앞에 나온 behind your ears(귀 뒤)를 가리켜요.","c":1},"h":"31f19e9a28"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For example, eating lots of fruit can reduce body smells by removing toxins.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"예를 들어, 많은 과일을 먹는 것은 독소를 제거함으로써 체취를 줄일 수 있다.","opts":["과일을 많이 먹으면 독소가 늘어나 체취가 심해진다.","과일을 많이 먹으면 독소를 없애 체취를 줄일 수 있다.","독소를 없애려면 과일 대신 물만 마셔야 한다.","체취가 줄어들면 과일을 더 많이 먹게 된다."],"r":{"a":"2) 과일을 많이 먹으면 독소를 없애 체취를 줄일 수 있다.","ev":"9번 문장","s":[[9,"For example, eating lots of fruit can reduce body smells by removing toxins.","예를 들어, 많은 과일을 먹는 것은 독소를 제거함으로써 체취를 줄일 수 있다."]],"w":"9번은 과일을 많이 먹는 것이 독소를 제거(removing toxins)해서 체취를 줄여 준다는 말이에요. 독소가 늘어난다는 말은 반대예요.","c":2},"h":"51ffa1642c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["체취 유전자에는 두 가지 유형만 있다.","모든 사람은 체취의 세기가 똑같다.","생선을 먹으면 몸 안의 독소가 제거된다.","체취 유전자에는 GG, GA, AA의 세 가지 유형이 있다."],"opts":["There are only two types of body odor genes.","Everyone has the same strength of body odor.","Eating fish removes toxins from the body.","There are three types of body odor genes: GG, GA, and AA."],"r":{"a":"4) There are three types of body odor genes: GG, GA, and AA. (체취 유전자에는 GG, GA, AA의 세 가지 유형이 있다.)","ev":"4번 문장","s":[[4,"There are three types of body odor genes: GG, GA, and AA.","체취 유전자에는 GG, GA, 그리고 AA의 세 가지 유형이 있다."]],"w":"4번 문장 There are three types of body odor genes: GG, GA, and AA(체취 유전자에는 GG, GA, AA의 세 가지 유형이 있다)에 그대로 나와요.","c":4},"h":"34cc9a22f3"},{"n":9,"t":"sum","q":"Sometimes our bodies smell bad, (A) when we (B).","ko":"가끔 우리 몸은 안 좋은 냄새가 나는데, (A) 우리가 (B)을(를) 흘릴 때 그렇다.","oko":["(A) 특히 / (B) 잠","(A) 결코 ~않게 / (B) 땀","(A) 거의 ~않게 / (B) 잠","(A) 결코 ~않게 / (B) 잠","(A) 특히 / (B) 땀"],"opts":["(A) especially / (B) sleep","(A) never / (B) sweat","(A) rarely / (B) sleep","(A) never / (B) sleep","(A) especially / (B) sweat"],"r":{"a":"5) (A) especially / (B) sweat ((A) 특히 / (B) 땀)","ev":"1번 문장","s":[[1,"Sometimes our bodies smell bad, especially when we sweat.","가끔 우리 몸은 안 좋은 냄새가 나는데, 특히 우리가 땀을 흘릴 때 그렇다."]],"w":"1번 문장 Sometimes our bodies smell bad, especially when we sweat(가끔 우리 몸은 안 좋은 냄새가 나는데, 특히 땀을 흘릴 때 그렇다)에서 가져왔어요.","c":5},"h":"ce14b41774"},{"n":10,"t":"fill","q":"People with type GG have the [A] smell. Those with type GA have a [B] scent, and people with AA genes smell the least.","ko":"GG형의 사람들은 [A] 냄새를 가지고 있다. GA형의 사람들은 [B] 냄새를 가지고 있고, AA 유전자를 가진 사람들은 냄새가 가장 적게 난다.","bank":["strongest","weaker","frequently","reduce","remove","wash"],"bko":{"strongest":"가장 강한","weaker":"더 약한","frequently":"자주","reduce":"줄이다","remove":"제거하다","wash":"씻다"},"r":{"a":"[A] strongest (가장 강한), [B] weaker (더 약한)","ev":"5, 6번 문장","s":[[5,"People with type GG have the strongest smell.","GG형의 사람들은 가장 강한 냄새를 가지고 있다."],[6,"Those with type GA have a weaker scent, and people with AA genes smell the least.","GA형의 사람들은 더 약한 냄새를 가지고 있고, AA 유전자를 가진 사람들이 냄새가 가장 적게 난다."]],"w":"5번 문장 have the strongest smell(가장 강한 냄새를 가지고 있다), 6번 문장 have a weaker scent(더 약한 냄새를 가지고 있다)에서 가져왔어요. the 뒤에는 최상급 strongest, a 뒤에는 비교급 weaker가 와요.","c":null},"h":"2e48f6098f"}]},{"u":3,"id":"hk2-03-2","no":2,"ko":"당신의 발연기가 최고예요!","items":[{"n":1,"t":"tf","q":"Every year, filmmakers and performers in Hollywood get together for awards shows.","ko":"매년, 할리우드의 영화 제작자들과 연기자들은 시상식을 위해 모인다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Every year, filmmakers and performers in Hollywood get together for awards shows like the Oscars and the Golden Globes.","매년, 할리우드의 영화 제작자들과 연기자들은 오스카와 골든 글로브 같은 시상식을 위해 모인다."]],"w":"1번에서 매년 할리우드의 영화 제작자들과 연기자들이 오스카와 골든 글로브 같은 시상식을 위해 모인다고 해요.","c":"T"},"h":"ad19d457e9"},{"n":2,"t":"tf","q":"The Razzies is held a day after the Oscars.","ko":"래지스는 오스카 시상식 다음 날 개최된다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Usually, the Razzies is held a day before the Oscars.","보통, 래지스는 오스카 시상식 하루 전에 개최된다."]],"w":"6번에서 래지스는 오스카 하루 전(a day before)에 개최돼요. 하루 뒤라는 말은 반대예요.","c":"F"},"h":"4d32974358"},{"n":3,"t":"tf","q":"The winner of the Razzies receives a trophy made of real gold.","ko":"래지스의 수상자는 진짜 금으로 만든 트로피를 받는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"The winner of each category is chosen by the Razzies Organization and receives a raspberry trophy painted with fake gold.","각 부문의 수상자는 래지스 협회에 의해 선정되고 가짜 금이 입혀진 라즈베리 트로피를 받는다."]],"w":"8번에서 트로피는 가짜 금(fake gold)이 입혀진 라즈베리 트로피예요. 진짜 금이 아니에요.","c":"F"},"h":"ba77ce0f7f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She received the Worst Actress award and gave a humorous speech.)","ko":"그녀는 최악의 여배우상을 받았고 ( ) 연설을 전했다.","word":"humorous","opts":["지루한","재치 있는","화난","어려운"],"r":{"a":"2) 재치 있는","ev":"10번 문장","s":[[10,"She received the Worst Actress award and gave a humorous speech.","그녀는 최악의 여배우상을 받았고 재치 있는 연설을 전했다."]],"w":"산드라 블록은 최악의 여배우상을 받고도 연설을 했어요. 이 상황에서 humorous는 웃음을 주는 '재치 있는'이라는 뜻이에요.","c":2},"h":"d9b64edaab"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (There are 10 categories, including the worst picture, director, and performers.)","ko":"최악의 영화, 감독, 그리고 연기자를 포함해 10가지 ( )이 있다.","word":"categories","opts":["후보","장소","부문","규칙"],"r":{"a":"3) 부문","ev":"7번 문장","s":[[7,"There are 10 categories, including the worst picture, director, and performers.","최악의 영화, 감독, 그리고 연기자를 포함해 10가지 부문이 있다."]],"w":"7번에서 영화, 감독, 연기자처럼 상을 나눠 주는 갈래를 열거해요. 그래서 category는 '부문'이에요.","c":3},"h":"a9883206fe"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is the Golden Raspberries, or the Razzies.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 골든 라즈베리 시상식, 즉 래지스이다.","opts":["아무도 참석하기를 원하지 않는 시상식","할리우드의 영화 제작자들","오스카 시상식","최악의 영화들"],"r":{"a":"1) 아무도 참석하기를 원하지 않는 시상식","ev":"3, 4번 문장","s":[[3,"However, there is one awards show that no one wants to attend.","하지만, 아무도 참석하기를 원하지 않는 한 시상식이 있다."],[4,"It is the Golden Raspberries, or the Razzies.","그것은 골든 라즈베리 시상식, 즉 래지스이다."]],"w":"3번 문장에서 아무도 참석하기를 원하지 않는 시상식(one awards show that no one wants to attend)이 하나 있다고 했고, 4번 문장 It is the Golden Raspberries의 It이 바로 그 시상식이에요.","c":1,"k":"It = 아무도 참석하기를 원하지 않는 시상식"},"pron":"It","h":"b4e203f3fb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"At this awards show, prizes are given to the worst films and performers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 시상식에서는, 최악의 영화와 연기자에게 상이 주어진다.","opts":["이 시상식에서는 최고의 영화와 연기자에게 상이 주어진다.","이 시상식에서는 최악의 영화와 연기자에게 상이 주어진다.","이 시상식에서는 감독에게만 상이 주어진다.","이 시상식에서는 영화관에 상이 주어진다."],"r":{"a":"2) 이 시상식에서는 최악의 영화와 연기자에게 상이 주어진다.","ev":"5번 문장","s":[[5,"At this awards show, prizes are given to the worst films and performers.","이 시상식에서는, 최악의 영화와 연기자에게 상이 주어진다."]],"w":"prizes are given to the worst films and performers는 \"최악의 영화와 연기자에게 상이 주어진다\"는 뜻이에요. worst는 bad의 최상급으로 \"가장 나쁜\"이에요.","c":2},"h":"9faea10030"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["래지스는 최고의 영화와 연기자에게 상을 준다.","래지스의 모든 수상자는 시상식에 간다.","산드라 블록은 2010년에 래지스 시상식에 갔다.","산드라 블록은 최악의 여배우상을 받기 전에 오스카상을 받았다."],"opts":["The Razzies gives prizes to the best films and performers.","Every winner of the Razzies goes to the awards show.","Sandra Bullock went to the Razzies awards show in 2010.","Sandra Bullock won an Oscar before she received the Worst Actress award."],"r":{"a":"3) Sandra Bullock went to the Razzies awards show in 2010. (산드라 블록은 2010년에 래지스 시상식에 갔다.)","ev":"9번 문장","s":[[9,"Most winners never go to this awards show, but Sandra Bullock did in 2010.","대부분의 수상자들은 절대 이 시상식에 가지 않지만, 산드라 블록은 2010년에 갔다."]],"w":"9번 문장 Most winners never go to this awards show, but Sandra Bullock did in 2010(대부분의 수상자는 가지 않지만, 산드라 블록은 2010년에 갔다)에 나와요. did는 went to this awards show를 대신한 말이에요.","c":3},"h":"bfee60d924"},{"n":9,"t":"sum","q":"Sandra Bullock won an Oscar the (A) day for a (B) film.","ko":"산드라 블록은 (A) 날 (B) 영화로 오스카상을 수상했다.","oko":["(A) 같은 / (B) 다른","(A) 다음 / (B) 같은","(A) 지난 / (B) 유명한","(A) 같은 / (B) 유명한","(A) 다음 / (B) 다른"],"opts":["(A) same / (B) different","(A) next / (B) same","(A) last / (B) famous","(A) same / (B) famous","(A) next / (B) different"],"r":{"a":"5) (A) next / (B) different ((A) 다음 / (B) 다른)","ev":"11번 문장","s":[[11,"Ironically, she won an Oscar the next day for a different film!","역설적이게도, 그녀는 다음 날에 다른 영화로 오스카상을 수상했다!"]],"w":"11번 문장 she won an Oscar the next day for a different film(그녀는 다음 날 다른 영화로 오스카상을 수상했다)에서 가져왔어요.","c":5},"h":"b3b43780ac"},{"n":10,"t":"fill","q":"They are [A] to receive awards for their [B] work.","ko":"그들은 그들의 [B] 노고에 대한 상을 받게 되어 [A].","bank":["happy","hard","held","win","winners","speech"],"bko":{"happy":"기뻐한다","hard":"힘든","held":"개최된","win":"이기다","winners":"수상자들","speech":"연설"},"r":{"a":"[A] happy (기뻐한다), [B] hard (힘든)","ev":"2번 문장","s":[[2,"They are happy to receive awards for their hard work.","그들은 그들의 노고에 대한 상을 받아서 기뻐한다."]],"w":"2번 문장 are happy to receive awards(상을 받아서 기뻐한다), for their hard work(그들의 노고에 대해)에서 가져왔어요. hard work는 \"힘든 일, 노고\"라는 뜻이에요.","c":null},"h":"f070908f5a"}]},{"u":3,"id":"hk2-03-3","no":3,"ko":"끝날 때까지 끝난 게 아니야~","items":[{"n":1,"t":"tf","q":"The Charlotte Hornets were losing by two points with three seconds left.","ko":"Charlotte Hornets는 3초를 남기고 2점 차로 지고 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Only three seconds were left until the end of the game, and the team —the Charlotte Hornets— was losing by two points.","경기 종료까지 단 3초가 남아 있었고, Charlotte Hornets라는 팀은 2점 차이로 지고 있었다."]],"w":"2번에서 경기 종료까지 단 3초가 남았고 Charlotte Hornets가 2점 차로 지고 있었다고 해요.","c":"T"},"h":"7c8fb3918a"},{"n":2,"t":"tf","q":"Jeremy Lamb was close to the basket when he grabbed the ball.","ko":"Jeremy Lamb은 공을 잡았을 때 골대 가까이에 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"At th
