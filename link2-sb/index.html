[["The dish <u>was cooked</u> by my mother.","수동","The dish was cooked by my mother.","그 요리는 우리 엄마에 의해 만들어졌다.",
  "본책 p.100 ‘능동태 vs. 수동태’ 부분을 펴세요. 「be동사 + p.p.」가 수동태라고 나와 있어요.","1) 밑줄 친 was cooked(원형 cook: 요리하다)를 보세요.  2) was(be동사) 뒤에 cooked(p.p.)가 붙어 있나요? 그리고 요리는 ‘당하는’ 쪽인가요, ‘하는’ 쪽인가요?","「be동사 + p.p.」 꼴이니까 ‘~당하다, ~되다’ 쪽이에요. 두 글자 중 ‘수’로 시작해요.","「be동사 + p.p.」 = 수동태 (~되다)"],
 ["The plate <u>was washed</u> by Minji.","수동","The plate was washed by Minji.","그 접시는 민지에 의해 씻겨졌다.",
  "본책 p.100 ‘능동태 vs. 수동태’에서 수동태의 모양을 확인하세요.","1) was washed(원형 wash: 씻다)가 밑줄이에요.  2) 접시(plate)가 스스로 씻을 수 있을까요? 누가 씻어 주는 걸까요?","접시는 ‘씻기는’ 대상이에요. 뒤에 by Minji(민지에 의해)도 힌트예요. 첫 글자 ‘수’.","by + 행위자가 붙으면 수동태 신호"],
 ["The guests <u>ate</u> the cake.","능동","The guests ate the cake.","손님들이 그 케이크를 먹었다.",
  "본책 p.100 ‘능동태 vs. 수동태’에서 ‘주어가 행위를 하는 주체’인 경우를 보세요.","1) ate(원형 eat: 먹다)는 be동사 + p.p. 모양인가요?  2) 케이크를 먹은 건 누구죠? 주어(guests)가 직접 하는 행동이에요.","be동사가 없어요. 주어가 직접 먹었으니 ‘능’으로 시작하는 두 글자예요.","주어가 직접 하면 능동 (be동사 없음)"],
 ["The meal <u>was prepared</u> by the chef.","수동","The meal was prepared by the chef.","그 식사는 요리사에 의해 준비되었다.",
  "본책 p.100 ‘능동태 vs. 수동태’의 수동태 설명을 다시 읽어 보세요.","1) was prepared(원형 prepare: 준비하다)를 보세요.  2) 식사(meal)는 준비를 ‘하는’ 쪽일까요, ‘받는’ 쪽일까요?","「was + p.p.」에 by the chef까지 있어요. ‘수’로 시작하는 두 글자예요.","was + p.p. + by ~ → 수동태"],
 ["The photographer <u>took</u> the pictures.","능동","The photographer took the pictures.","그 사진사가 사진들을 찍었다.",
  "본책 p.100 ‘능동태 vs. 수동태’의 능동태 예문(Many people visit ~)과 비교해 보세요.","1) took(원형 take: 찍다)는 과거형 동사 하나만 있어요.  2) 사진을 찍는 행동은 주어(photographer)가 직접 하나요?","be동사가 없고 주어가 직접 해요. ‘능’으로 시작하는 두 글자예요.","동사 하나만 있고 주어가 직접 함 = 능동"],
 ["The guitar <u>was played</u> by John.","수동","The guitar was played by John.","그 기타는 존에 의해 연주되었다.",
  "본책 p.100 ‘능동태 vs. 수동태’에서 수동태 예문(This picture was painted by ~)을 보세요.","1) was played(원형 play: 연주하다)가 밑줄이에요.  2) 기타(guitar)가 연주를 ‘하는’ 걸까요, ‘당하는’ 걸까요?","「was + p.p.」 + by John 이에요. ‘수’로 시작하는 두 글자예요.","was + p.p. → 주어가 ‘~되다’ (수동)"]
].forEach((r,i)=>W("BC","A",i+1,"동사 또는 동사구에 밑줄 치고 능동태는 ‘능동’, 수동태는 ‘수동’이라고 쓰시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["This window ___ by Yunho last week. (break)","was broken","This window was broken by Yunho last week.","이 창문은 지난주에 윤호에 의해 깨졌다.",
  "본책 p.100 ‘능동태의 수동태 전환’ 박스를 펴세요. 수동태는 「be동사 + p.p.」예요.","1) 창문은 ‘깨지는’ 쪽이라서 수동태예요.  2) last week(지난주)는 과거예요. be동사 과거형 + break(깨다)의 p.p.를 써요. break-broke-broken이에요.","첫 단어는 w로 시작하는 3글자(be동사 과거형), 둘째는 b로 시작하는 6글자예요.","창문(단수), 과거 → was + p.p."],
 ["She ___ a yoga lesson yesterday. (take)","took","She took a yoga lesson yesterday.","그녀는 어제 요가 수업을 들었다.",
  "본책 p.100 ‘능동태 vs. 수동태’에서 능동태 문장은 동사 하나만 쓴다고 했어요.","1) 주어 She가 요가 수업을 ‘직접 듣는’ 거예요.  2) 주어가 직접 하니까 능동태예요. yesterday(어제)라서 take(받다, 듣다)의 과거형을 써요.","t로 시작하는 4글자예요. 불규칙 변화(take-took-taken)예요.","주어가 직접 하면 능동 → 과거형 took"],
 ["English ___ by many people. (speak)","is spoken","English is spoken by many people.","영어는 많은 사람들에 의해 말해진다.",
  "본책 p.100 ‘능동태의 수동태 전환’에서 be동사는 주어와 시제에 맞춘다고 했어요.","1) 영어(English)는 ‘사용되는’ 쪽이에요. 수동태예요.  2) 시간 표현이 없으니 현재시제예요. English는 단수라서 단수 현재 be동사를 쓰고, 그 뒤에 speak(말하다)의 p.p.를 붙여요.","첫 단어는 i로 시작하는 2글자, 둘째 단어는 s로 시작하는 6글자예요. speak는 불규칙 변화예요.","주어 단수, 현재 → is + p.p."],
 ["This poem ___ in ancient Greek. (write)","was written","This poem was written in ancient Greek.","이 시는 고대 그리스어로 쓰였다.",
  "본책 p.100 ‘능동태의 수동태 전환’ ② 부분을 펴서 「be동사 + p.p.」를 확인하세요.","1) 시(poem)는 ‘쓰이는’ 대상이라 수동태예요.  2) 고대 그리스어(ancient Greek)로 쓰인 옛날 시니까 과거예요. write(쓰다)의 변화는 write-wrote-written이에요.","첫 단어 w로 시작하는 3글자, 둘째 단어 w로 시작하는 7글자예요.","시(단수), 과거 → was + written"],
 ["The thief ___ the jewels last night. (steal)","stole","The thief stole the jewels last night.","그 도둑은 어젯밤에 보석들을 훔쳤다.",
  "본책 p.100 ‘능동태 vs. 수동태’에서 주어가 행위를 하는 경우를 다시 보세요.","1) 도둑(thief)이 보석을 ‘직접 훔친’ 거예요. 능동태예요.  2) last night(어젯밤)이라서 steal(훔치다)의 과거형을 써요.","s로 시작하는 5글자예요. (steal-stole-stolen)","주어가 직접 함 → 능동 과거형 stole"]
].forEach((r,i)=>W("BC","B",i+1,"( ) 안의 말을 빈칸에 올바른 형태로 쓰시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["그 가수는 전 세계의 팬들에게 사랑받는다.<br>The singer ___ by fans around the world.","is loved","The singer is loved by fans around the world.","그 가수는 전 세계의 팬들에게 사랑받는다.",
  "본책 p.100 ‘능동태의 수동태 전환’ 박스에서 「be동사 + p.p.」를 확인하세요. 우리말의 ‘사랑받는다’가 수동 뜻이에요.","1) ‘사랑받는다’ → love(사랑하다)를 수동태로 써요.  2) 현재 이야기이고 주어 The singer는 한 명이에요. be동사를 정해요.","첫 단어 i로 시작하는 2글자, 둘째 단어 l로 시작하는 5글자예요.","사랑받는다 → is(단수) + loved"],
 ["그 집들은 한 무리의 자원봉사자들에 의해 지어졌다.<br>The houses ___ by a group of volunteers.","were built","The houses were built by a group of volunteers.","그 집들은 한 무리의 자원봉사자들에 의해 지어졌다.",
  "본책 p.100 ‘능동태의 수동태 전환’ ②에서 be동사는 주어와 시제에 맞춘다고 했어요.","1) ‘지어졌다’는 과거 + 수동이에요. build(짓다)의 p.p.를 써요.  2) 주어 The houses는 복수예요. 과거 복수 be동사를 골라요.","첫 단어 w로 시작하는 4글자, 둘째 단어 b로 시작하는 5글자예요. (build-built-built)","집들(복수), 과거 → were + built"],
 ["이 식물은 많은 나라에서 길러진다.<br>This plant ___ in many countries.","is grown","This plant is grown in many countries.","이 식물은 많은 나라에서 길러진다.",
  "본책 p.100 ‘능동태의 수동태 전환’ 박스를 보고 현재 단수일 때의 be동사를 확인하세요.","1) ‘길러진다’는 수동이에요. grow(기르다, 자라다)의 p.p.를 써요.  2) This plant는 단수이고 현재 이야기예요.","첫 단어 i로 시작하는 2글자, 둘째 단어 g로 시작하는 5글자예요. (grow-grew-grown)","식물(단수), 현재 → is + grown"],
 ["이 책은 많은 십 대들에게 읽힌다.<br>This book ___ by many teenagers.","is read","This book is read by many teenagers.","이 책은 많은 십 대들에게 읽힌다.",
  "본책 p.100 ‘능동태의 수동태 전환’에서 수동태의 모양을 다시 확인하세요.","1) ‘읽힌다’는 수동이에요. read(읽다)를 p.p.로 써요.  2) 현재 이야기이고 This book은 단수예요.","첫 단어 i로 시작하는 2글자, 둘째 단어는 4글자예요. read의 p.p.는 철자가 그대로(발음만 달라요).","책(단수), 현재 → is + read(p.p.)"],
 ["최초의 비행기는 Wright 형제에 의해서 발명되었다.<br>The first airplane ___ by the Wright Brothers.","was invented","The first airplane was invented by the Wright Brothers.","최초의 비행기는 Wright 형제에 의해서 발명되었다.",
  "본책 p.100 ‘능동태의 수동태 전환’ ② 설명을 펴서 시제에 맞는 be동사를 고르세요.","1) ‘발명되었다’는 과거 + 수동이에요. invent(발명하다)의 p.p.를 써요.  2) The first airplane은 단수예요.","첫 단어 w로 시작하는 3글자, 둘째 단어 i로 시작하는 8글자예요.","비행기(단수), 과거 → was + invented"]
].forEach((r,i)=>W("BC","C",i+1,"우리말과 일치하도록 보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7],["build","invent","read","love","grow"]));

// ===== UNIT 1 수동태의 개념 =====
C(1,"Q",1,"다음 문장의 의미로 적절한 것은?<br>Dami was given a gift by Yumi.",["Dami가 Yumi에게 선물을 주었다.","Dami가 Yumi에게 선물을 받았다."],"Dami가 Yumi에게 선물을 받았다.","Dami was given a gift by Yumi.","Dami는 Yumi에게 선물을 받았다.",
 "본책 p.102 POINT 1 ‘수동태의 형태와 의미’ 첫 설명을 읽어 보세요.","1) was given(원형 give: 주다)은 「be동사 + p.p.」 모양이에요.  2) 이런 모양이면 주어가 행동을 ‘하는’ 쪽일까요, ‘받는’ 쪽일까요? by Yumi는 ‘Yumi에 의해’예요.","주어 Dami는 선물을 ‘받은’ 쪽이에요. 두 번째 보기예요.","be + p.p. → 주어가 당함 (선물을 받았다)");
[["This movie (loves / is loved) by people of all ages.","is loved","This movie is loved by people of all ages.","이 영화는 모든 연령의 사람들에게 사랑받는다.",
  "본책 p.102 POINT 1 ‘수동태의 형태와 의미’ 의 설명과 예문 This band is loved by ~ 를 보세요.","1) 영화(movie)는 사랑을 ‘하는’ 걸까요, ‘받는’ 걸까요?  2) 뒤에 by people(사람들에 의해)이 있어요. 「be동사 + p.p.」가 맞는 쪽을 골라요.","love(사랑하다)의 p.p. loved 앞에 be동사 is가 붙은 쪽이에요. 두 번째 보기예요.","by ~ (~에 의해)가 있으면 be + p.p."],
 ["We (discussed / were discussed) various topics at the meeting.","discussed","We discussed various topics at the meeting.","우리는 회의에서 여러 주제를 논의했다.",
  "본책 p.102 POINT 1 ‘수동태의 형태와 의미’를 보세요. 주어가 행위를 하면 능동태예요.","1) 주어 We(우리)가 ‘논의한’ 쪽일까요, ‘논의되어진’ 쪽일까요?  2) 뒤에 목적어 various topics(여러 주제)가 이미 있어요. 목적어가 있으면 보통 능동태예요.","be동사가 없는 쪽이에요. 첫 번째 보기예요.","주어가 하고 목적어가 있으면 능동"],
 ["Many people (arrest / are being arrested) for cyber crimes these days.","are being arrested","Many people are being arrested for cyber crimes these days.","요즘 많은 사람들이 사이버 범죄로 체포되고 있다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표에서 진행형 줄을 보세요.","1) many people(많은 사람들)은 체포를 ‘당하는’ 쪽이에요. 수동태예요.  2) these days(요즘)는 지금 진행 중인 일이에요. 표에서 진행형 수동태 모양을 찾아요.","「be동사 + being + p.p.」 모양이에요. 주어가 복수라서 are를 써요. 두 번째 보기예요.","진행 중인 수동태 → be + being + p.p."],
 ["The next Olympics (will held / will be held) in Europe.","will be held","The next Olympics will be held in Europe.","다음 올림픽은 유럽에서 열릴 것이다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표에서 미래시제 줄을 보세요.","1) 올림픽(Olympics)은 ‘열리는’ 쪽이라 수동태예요.  2) will이 있으니 미래예요. 표의 미래 모양 「will + be + p.p.」와 비교해요.","will 뒤에 be가 빠지지 않은 쪽이에요. 두 번째 보기예요.","will 뒤 be 빠지면 X → will be held"]
].forEach((r,i)=>C(1,"A",i+1,"( ) 안에서 알맞은 말을 고르시오.<br>"+r[0],r[0].match(/\(([^)]*)\)/)[1].split(" / "),r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["My mother waters the flowers.","The flowers are watered by my mother.","The flowers are watered by my mother.","그 꽃들은 우리 엄마에 의해 물이 주어진다.",
  "본책 p.102 POINT 1 ‘수동태의 형태와 의미’ 의 화살표 그림(The farmers picked the apples)을 따라 해 보세요.","1) 목적어 the flowers(그 꽃들)를 맨 앞 주어로 보내요.  2) waters(원형 water: 물을 주다)는 「be동사 + p.p.」로, 새 주어가 복수이고 현재이니 be동사도 거기에 맞춰요.  3) 마지막에 「by + 목적격」으로 my mother를 써요.","The flowers로 시작해요. be동사는 a로 시작하는 3글자, water는 끝에 -ed를 붙이고, by my mother로 끝내요.","목적어가 주어로, 동사는 be + p.p., 주어는 by 뒤로"],
 ["The man is carrying the boxes.","The boxes are being carried by the man.","The boxes are being carried by the man.","그 상자들은 그 남자에 의해 옮겨지고 있다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 진행형 줄을 보세요.","1) is carrying(원형 carry: 나르다)은 진행형이에요.  2) 목적어 the boxes(그 상자들)가 주어가 돼요.  3) 진행형 수동태 모양 「be동사 + being + p.p.」에서 be동사는 복수 주어에 맞춰요.","The boxes로 시작해요. a로 시작하는 3글자 + b로 시작하는 5글자 + carried(원형 carry: 나르다) + by the man 순서예요.","진행형 수동 → be + being + p.p."],
 ["James Cameron will direct the new movie.","The new movie will be directed by James Cameron.","The new movie will be directed by James Cameron.","그 새 영화는 제임스 캐머런에 의해 감독될 것이다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 미래시제 줄을 보세요.","1) will direct(원형 direct: 감독하다)는 미래예요.  2) 목적어 the new movie를 주어로 올려요.  3) 미래 수동태는 「will + be + p.p.」예요. 마지막에 by James Cameron을 붙여요.","The new movie will로 시작해요. will 뒤에 b로 시작하는 2글자, 그다음 direct 끝에 -ed를 붙인 말, 마지막에 by James Cameron이에요.","능동 will + 원형 → 수동 will + be + p.p."],
 ["People built Dongdaemun Stadium in 1926.","Dongdaemun Stadium was built (by people) in 1926.","Dongdaemun Stadium was built (by people) in 1926.","동대문 운동장은 (사람들에 의해) 1926년에 지어졌다.",
  "본책 p.102 POINT 1 ‘수동태의 형태와 의미’ 맨 아래, by + 목적격을 생략할 수 있는 경우를 보세요.","1) built(원형 build: 짓다)는 과거형이에요. 목적어 Dongdaemun Stadium이 주어가 돼요.  2) 과거 수동태는 「was/were + p.p.」예요.  3) 행위자 People(사람들)은 막연한 일반인이라 by people은 써도 되고 생략해도 돼요.","Dongdaemun Stadium으로 시작해요. 단수 과거 be동사(w로 시작하는 3글자) + built예요. by people은 넣어도 빼도 돼요.","막연한 행위자(people)는 by ~ 생략 가능"]
].forEach((r,i)=>W(1,"B",i+1,"주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["The mistake was <u>correcting</u> by the teacher.","corrected","The mistake was corrected by the teacher.","그 실수는 선생님에 의해 고쳐졌다.",
  "본책 p.102 POINT 1 ‘수동태의 형태와 의미’의 「be동사 + p.p.」 형태를 확인하세요.","1) was 뒤에 correcting(원형 correct: 고치다)이 있어요. ing 형태가 맞는 자리일까요?  2) 수동태 「be동사 + ___」 빈칸에는 p.p.가 와야 해요.","correct 뒤에 ed만 붙이면 돼요. c로 시작하는 9글자예요.","be동사 뒤에는 ing가 아니라 p.p."],
 ["My house will <u>decorate</u> for the holidays.","be decorated","My house will be decorated for the holidays.","우리 집은 휴일을 위해 장식될 것이다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표에서 미래시제 줄을 보세요.","1) 집(house)은 ‘장식되는’ 쪽이라 수동태예요.  2) will 뒤에 동사원형 하나만 있어요. 표의 「will + be + p.p.」와 비교해 빠진 것을 찾아요.","be가 빠졌어요. decorate(장식하다)를 p.p.로 바꿔서 두 단어로 써요.","will 뒤 원형만 있으면 be + p.p.로 고치기"],
 ["The cookies <u>are be baked</u> now.","being baked","The cookies are being baked now.","그 쿠키들은 지금 구워지고 있다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 진행형 줄을 보세요.","1) now(지금)는 진행 중인 일이에요. 쿠키는 ‘구워지는’ 쪽이에요.  2) 진행형 수동태는 「be동사 + being + p.p.」예요. are 뒤의 be를 어떻게 바꿔야 할까요?","be 대신 be의 -ing 형태를 써요. b로 시작하는 5글자 + baked예요.","진행 수동 → are + being + p.p."],
 ["This sandwich is <u>serve</u> with tomato soup.","served","This sandwich is served with tomato soup.","이 샌드위치는 토마토 수프와 함께 제공된다.",
  "본책 p.102 POINT 1 ‘수동태의 형태와 의미’ 의 「be동사 + p.p.」를 확인하세요.","1) is 뒤에 serve(제공하다)가 원형 그대로 있어요.  2) 샌드위치는 ‘제공되는’ 쪽이에요. 수동태 문장에서 is 뒤는 어떤 형태여야 하나요?","serve 끝에 d 한 글자만 붙이면 돼요.","be동사 뒤에는 동사원형이 아니라 p.p."]
].forEach((r,i)=>W(1,"C",i+1,"밑줄 친 부분을 어법에 맞게 고치시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["월드컵은 4년마다 열린다. (hold)<br>The World Cup ___ ___ every four years.","is held","The World Cup is held every four years.","월드컵은 4년마다 열린다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 현재시제 줄(am/are/is + p.p.)을 보세요.","1) 월드컵은 ‘열리는’ 쪽이에요. 수동태예요.  2) 4년마다 반복되는 일이니 현재시제예요. The World Cup은 단수예요.","빈칸이 두 개예요. 첫 칸은 i로 시작하는 2글자, 둘째 칸은 hold(열다)의 p.p.로 h로 시작하는 4글자예요.","반복되는 일(every ~) → 현재 is + p.p."],
 ["그 백화점은 내일 문을 닫을 것이다. (close)<br>The department store ___ ___ ___ tomorrow.","will be closed","The department store will be closed tomorrow.","그 백화점은 내일 문을 닫을 것이다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표에서 미래시제 줄을 보세요.","1) tomorrow(내일)가 있으니 미래예요.  2) 백화점이 문을 ‘닫게 되는’ 수동 표현이에요. 미래 수동태 모양 「will + be + p.p.」에 close(닫다)를 넣어요.","빈칸 세 개예요. will / b로 시작하는 2글자 / c로 시작하는 6글자 순서예요.","tomorrow(내일) + 수동 → will be closed"],
 ["내 휴대폰은 수리되고 있는 중이다. (fix)<br>My cell phone ___ ___ ___.","is being fixed","My cell phone is being fixed.","내 휴대폰은 수리되고 있는 중이다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 진행형 줄을 보세요.","1) ‘~되고 있는 중이다’는 진행 + 수동이에요.  2) 진행형 수동태는 「be동사 + being + p.p.」예요. My cell phone은 단수예요.","빈칸 세 개예요. i로 시작하는 2글자 / b로 시작하는 5글자 / fix(고치다)의 p.p.(f로 시작하는 5글자) 순서예요.","~되고 있는 중 → be + being + p.p."],
 ["지난여름 가뭄으로 인해 농작물이 손해를 입었다. (damage)<br>The crops ___ ___ by a drought last summer.","were damaged","The crops were damaged by a drought last summer.","지난여름 가뭄으로 인해 농작물이 손해를 입었다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 과거시제 줄(was/were + p.p.)을 보세요.","1) last summer(지난여름)는 과거예요.  2) The crops는 복수예요. 농작물은 피해를 ‘입는’ 쪽이라 수동태예요.","빈칸 두 개예요. w로 시작하는 4글자 + damage(손해를 입히다)의 p.p.예요.","last summer(과거) + 복수 → were damaged"]
].forEach((r,i)=>W(1,"D",i+1,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));

// ===== UNIT 2 수동태의 여러 형태 =====
C(2,"Q",1,"not이 들어갈 위치로 알맞은 곳은?<br>The dress ⓐ was ⓑ designed by Julia.",["ⓐ","ⓑ"],"ⓑ","The dress was not designed by Julia.","그 드레스는 줄리아에 의해 디자인되지 않았다.",
 "본책 p.104 POINT 1 ‘부정문과 의문문’의 수동태 부정문 표를 보세요.","1) 수동태의 부정문 공식은 「be동사 + not + p.p.」예요.  2) 문장 속 was(be동사)와 designed(원형 design: 디자인하다, p.p.)가 어디 있는지 찾아요.","not은 be동사 뒤, p.p. 앞에 와요. 그러면 was와 designed 사이예요. 두 번째 자리예요.","수동태 부정문: be동사 + not + p.p.");
[["Jerry (was not / not was) invited to Kim’s party.","was not","Jerry was not invited to Kim’s party.","제리는 킴의 파티에 초대받지 않았다.",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 부정문 표(be동사 + not + p.p.)를 보세요.","1) invited(원형 invite: 초대하다)는 p.p.예요.  2) not은 be동사의 앞일까요, 뒤일까요?","be동사가 먼저, not이 뒤예요. 첫 번째 보기예요.","be동사 뒤에 not (was not + p.p.)"],
 ["(Was / Did) this hidden under the bed?","Was","Was this hidden under the bed?","이것은 침대 밑에 숨겨져 있었니?",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 의문문 표(be동사 + 주어 + p.p. ~?)를 보세요.","1) 문장 끝에 hidden(원형 hide: 숨기다)이 p.p.로 있어요.  2) 수동태 의문문은 「be동사 + 주어 + p.p.」예요. Did는 어떤 동사 모양과 짝일까요?","Did 뒤에는 동사원형이 와요. p.p.와 어울리는 것은 be동사예요. 첫 번째 보기예요.","수동태 의문문 → be동사 + 주어 + p.p."],
 ["(Are where / Where are) these sunglasses sold?","Where are","Where are these sunglasses sold?","이 선글라스는 어디에서 팔리니?",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 두 번째 줄(의문사 + be동사 + 주어 + p.p. ~?)을 보세요.","1) where(어디에서)는 의문사예요.  2) 의문사가 있으면 어디에 둔다고 했나요?  3) 의문사 다음에 be동사, 그다음에 주어(these sunglasses) 순서예요.","문장 맨 앞이 의문사 Where예요. 두 번째 보기예요.","의문사는 맨 앞 → Where are + 주어 + p.p.?"],
 ["The concert tickets (are can purchased / can be purchased) online.","can be purchased","The concert tickets can be purchased online.","그 콘서트 티켓은 온라인으로 구매될 수 있다.",
  "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표의 긍정문 줄을 보세요.","1) can(~할 수 있다)은 조동사예요.  2) 조동사가 있는 수동태는 「조동사 + be + p.p.」예요. 조동사 뒤에 be동사 원형이 있는지 확인해요.","can 바로 뒤에 be가 있고, 그다음이 purchased(원형 purchase: 구매하다)예요. 두 번째 보기예요.","조동사 + be + p.p. (be는 원형)"]
].forEach((r,i)=>C(2,"A",i+1,"( ) 안에서 알맞은 말을 고르시오.<br>"+r[0],r[0].match(/\(([^)]*)\)/)[1].split(" / "),r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["These rugs were made by local craftsmen.<br>(의문문으로)","Were these rugs made by local craftsmen?","Were these rugs made by local craftsmen?","이 러그들은 현지 장인들에 의해 만들어졌니?",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 의문문 표(be동사 + 주어 + p.p. ~?)를 보세요.","1) 의문문은 be동사를 주어 앞으로 보내요.  2) were(원형 be: ~이다)를 these rugs 앞으로 옮겨요.  3) 끝에는 물음표(?)를 붙여요.","be동사를 맨 앞으로 옮기니 문장이 대문자 W로 시작해요. 그 뒤는 주어 + made + by local craftsmen 순서이고, 끝에 물음표를 붙여요.","수동태 의문문 → be동사를 주어 앞으로"],
 ["This letter was written by Kitty.<br>(부정문으로)","This letter was not written by Kitty.","This letter was not[wasn’t] written by Kitty.","이 편지는 키티에 의해 쓰이지 않았다.",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 부정문 표(be동사 + not + p.p.)를 보세요.","1) 부정문은 be동사 뒤에 not을 붙여요.  2) was와 written(원형 write: 쓰다, p.p.) 사이를 보세요.","was와 written 사이에 n으로 시작하는 3글자를 넣어요. was와 합쳐 줄임말로 써도 돼요.","부정문: was 뒤에 not (wasn’t 가능)"],
 ["The barbeque party is held on weekends.<br>(부정문으로)","The barbeque party is not held on weekends.","The barbeque party is not[isn’t] held on weekends.","바비큐 파티는 주말에 열리지 않는다.",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 부정문 설명과 예문(Smoking is not allowed)을 보세요.","1) is(원형 be: ~이다)는 be동사이고 held(원형 hold: 열다)는 p.p.예요.  2) not을 어디에 넣을까요?","is와 held 사이에 부정을 나타내는 n으로 시작하는 3글자를 넣어요. is와 합쳐 줄임말로 써도 돼요.","be동사 뒤에 not을 붙인다"],
 ["The boxes are stored in a warehouse.<br>(의문문으로)","Are the boxes stored in a warehouse?","Are the boxes stored in a warehouse?","그 상자들은 창고에 보관되어 있니?",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 의문문 표(Is this show watched by ~?)를 보세요.","1) be동사 are(원형 be: ~이다)를 주어 앞으로 보내요.  2) 주어는 the boxes이고 stored(원형 store: 보관하다)는 그대로 둬요.","첫 단어는 A로 시작하는 3글자예요. 끝에 물음표를 붙여요.","의문문: be동사 + 주어 + p.p. ~?"]
].forEach((r,i)=>W(2,"B",i+1,"주어진 문장을 지시대로 바꿔 쓰시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["A ___ the movie ___ ___ tomorrow?<br>B Yes, it will be released tomorrow.","Will, be released","A: Will the movie be released tomorrow? B: Yes, it will be released tomorrow.","A: 그 영화는 내일 개봉될까? B: 응, 내일 개봉될 거야.",
  "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표에서 의문문 줄(조동사 + 주어 + be + p.p. ~?)을 보세요.","1) B의 대답에 it will be released가 있어요. 조동사는 will이에요.  2) 의문문에서는 조동사를 맨 앞에 두고 주어(the movie) 뒤에 be + p.p.를 써요.","빈칸 순서: W로 시작하는 4글자 / be / r로 시작하는 8글자(release의 p.p., 개봉하다)예요.","will 의문문: Will + 주어 + be + p.p. ~?"],
 ["A ___ this bread ___ today?<br>B Yes, it was baked today.","Was, baked","A: Was this bread baked today? B: Yes, it was baked today.","A: 이 빵은 오늘 구워졌니? B: 응, 오늘 구워졌어.",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 의문문 표(be동사 + 주어 + p.p. ~?)를 보세요.","1) B의 대답에 it was baked today라고 되어 있어요. 과거 수동태예요.  2) 질문은 be동사를 주어 앞으로 보내고 뒤에 p.p.를 써요.","빈칸 순서: W로 시작하는 3글자 / b로 시작하는 5글자(bake의 p.p., 굽다)예요.","과거 수동태 의문문 → Was + 주어 + p.p."],
 ["A ___ ___ this amusement park ___?<br>B It was built in 1976.","When was, built","A: When was this amusement park built? B: It was built in 1976.","A: 이 놀이공원은 언제 지어졌니? B: 1976년에 지어졌어.",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 의문사가 있는 의문문(When was the first camera invented?)을 보세요.","1) B가 1976년이라고 ‘때’를 대답했어요. 어떤 의문사를 써야 할까요?  2) 의문사 + be동사 + 주어 + p.p. 순서예요.","빈칸 순서: W로 시작하는 4글자(때를 묻는 의문사) / w로 시작하는 3글자 / b로 시작하는 5글자(build의 p.p., 짓다)예요.","때를 물으면 When + be동사 + 주어 + p.p.?"],
 ["A ___ ___ the film festival ___?<br>B It is held in Busan.","Where is, held","A: Where is the film festival held? B: It is held in Busan.","A: 그 영화제는 어디에서 열리니? B: 부산에서 열려.",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 두 번째 줄(의문사 + be동사 + 주어 + p.p. ~?)을 보세요.","1) B가 Busan(부산)이라고 ‘장소’를 대답했어요. 어떤 의문사를 써야 할까요?  2) 의문사 + be동사 + 주어 + p.p. 순서예요.","빈칸 순서: W로 시작하는 5글자(장소를 묻는 의문사) / i로 시작하는 2글자 / h로 시작하는 4글자(hold의 p.p., 열다)예요.","장소를 물으면 Where + be동사 + 주어 + p.p."]
].forEach((r,i)=>W(2,"C",i+1,"빈칸에 알맞은 말을 써서 대화를 완성하시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["This document ___ ___ ___ later. (must, stamp)","must be stamped","This document must be stamped later.","이 서류는 나중에 도장이 찍혀야 한다.",
  "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표의 긍정문 줄(조동사 + be + p.p.)을 보세요.","1) must(~해야 한다)는 조동사예요.  2) 서류는 도장이 ‘찍히는’ 쪽이라 수동태예요.  3) 조동사 + be + stamp(도장을 찍다)의 p.p. 순서로 써요.","빈칸 세 개: must / b로 시작하는 2글자 / s로 시작하는 7글자예요.","must be + p.p. (~되어야 한다)"],
 ["Your tablet ___ ___ ___ at this store. (can, fix)","can be fixed","Your tablet can be fixed at this store.","당신의 태블릿은 이 가게에서 수리될 수 있다.",
  "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표의 긍정문 줄을 보세요.","1) can(~할 수 있다)은 조동사예요.  2) 태블릿은 ‘고쳐지는’ 쪽이에요.  3) 조동사 뒤에는 be를 쓰고 그다음 fix(고치다)의 p.p.를 써요.","빈칸 세 개: can / be / f로 시작하는 5글자예요.","can + be + p.p. (~될 수 있다)"],
 ["Bananas ___ ___ ___ ___ in the refrigerator. (should, not, keep)","should not be kept","Bananas should not be kept in the refrigerator.","바나나는 냉장고에 보관되어서는 안 된다.",
  "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표의 부정문 줄(조동사 + not + be + p.p.)을 보세요.","1) should(~해야 한다)는 조동사이고 not이 함께 있어요.  2) 부정문 순서는 조동사 + not + be + p.p.예요.  3) keep(보관하다)의 p.p.를 써요.","빈칸 네 개: should / not / b로 시작하는 2글자 / k로 시작하는 4글자예요. keep은 불규칙 변화예요.","should not be + p.p. (~되면 안 된다)"],
 ["___ the package ___ ___ online? (can, track)","Can be tracked","Can the package be tracked online?","그 소포는 온라인으로 추적될 수 있나요?",
  "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표의 의문문 줄(조동사 + 주어 + be + p.p. ~?)을 보세요.","1) 의문문이라 조동사 can을 맨 앞에 둬요.  2) 그다음에 주어(the package), 마지막에 be + track(추적하다)의 p.p.예요.","빈칸 순서: C로 시작하는 3글자 / the package / b로 시작하는 2글자 / t로 시작하는 7글자예요. 맨 앞은 대문자예요.","Can + 주어 + be + p.p. ~? (~될 수 있니?)"]
].forEach((r,i)=>W(2,"D",i+1,"( ) 안의 말을 이용하여 수동태 문장을 완성하시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));

// ===== UNIT 3 주의해야 할 수동태 =====
C(3,"Q",1,"빈칸에 들어갈 말로 알맞은 것은?<br>Something strange ___.",["was happened","happened"],"happened","Something strange happened.","이상한 일이 일어났다.",
 "본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 표의 자동사 줄을 보세요.","1) happen(일어나다)은 목적어가 필요 없는 동사예요.  2) 이런 동사를 표에서 어떤 동사라고 부르나요? 수동태로 쓸 수 있을까요?","목적어가 없는 자동사는 「be + p.p.」로 바꾸지 않아요. 두 번째 보기예요.","자동사(happen)는 수동태로 쓰지 않는다");
[["This is <u>happened</u> all over the world.","happens","This happens all over the world.","이런 일은 전 세계에서 일어난다.",
  "본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 표의 자동사 줄(arrive, happen ...)을 보세요.","1) happened(원형 happen: 일어나다)는 목적어가 필요 없는 동사예요.  2) 그런 동사는 수동태로 쓸 수 있을까요? is를 빼고 현재 단수로 써요.","happen 끝에 s를 붙여요. h로 시작하는 7글자예요.","자동사는 수동태 X → 능동으로"],
 ["Janet <u>is resembled by</u> her mother.","resembles","Janet resembles her mother.","재닛은 그녀의 엄마를 닮았다.",
  "본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 표의 둘째 줄(소유, 상태를 나타내는 타동사)을 보세요.","1) resemble(닮다)은 상태를 나타내는 동사예요.  2) 이런 동사는 수동태로 쓰면 어색해져요. 능동태 문장으로 되돌려 써요. Janet은 단수예요.","is와 by를 없애고 resemble 끝에 s를 붙여요. r로 시작하는 9글자예요.","상태 동사(resemble)는 수동태 X"],
 ["We <u>were satisfied</u> the movie ending.","were satisfied with","We were satisfied with the movie ending.","우리는 그 영화의 결말에 만족했다.",
  "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 보세요.","1) satisfied(원형 satisfy: 만족시키다)는 ‘만족하는’ 뜻으로 쓰이고 뒤에 ‘만족한 대상’이 와요.  2) 표에서 be satisfied 뒤에 어떤 전치사가 붙는지 찾아요.","빠진 말은 전치사 하나예요. w로 시작하는 4글자예요.","be satisfied with (~에 만족하다)"],
 ["His message <u>was filled in</u> love.","was filled with","His message was filled with love.","그의 메시지는 사랑으로 가득 차 있었다.",
  "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표의 첫 줄을 보세요.","1) filled(원형 fill: 채우다)는 ‘~로 가득 차다’ 뜻으로 써요.  2) 표에서 be filled 뒤에 붙는 전치사를 찾아요. in은 맞을까요?","in 대신 w로 시작하는 4글자 전치사를 써요.","be filled with (in이 아님!)"]
].forEach((r,i)=>W(3,"A",i+1,"밑줄 친 부분을 어법에 맞게 고치시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["Mary looked after the abandoned dog.","The abandoned dog was looked after by Mary.","The abandoned dog was looked after by Mary.","그 버려진 개는 메리에 의해 돌봐졌다.",
  "본책 p.106 POINT 1 ‘동사구의 수동태’ 설명과 예문(Our garden was looked after by Laura.)을 보세요.","1) looked after(원형 look after: ~을 돌보다)는 두 단어가 한 덩어리 동사예요.  2) 목적어 the abandoned dog를 주어로 올리고 was + looked를 쓰되 after는 그대로 남겨요.  3) 마지막에 by Mary를 붙여요.","The abandoned dog was looked로 시작해요. 그 뒤에 a로 시작하는 5글자를 빠뜨리지 말고, 마지막에 by Mary를 붙여요.","동사구는 한 덩어리 → was looked after"],
 ["The truck ran over the bottle.","The bottle was run over by the truck.","The bottle was run over by the truck.","그 병은 트럭에 의해 치였다.",
  "본책 p.106 POINT 1 ‘동사구의 수동태’ 의 동사구 표에서 run over를 찾아보세요.","1) ran over(원형 run over: ~을 치다)는 한 덩어리 동사예요.  2) 과거 수동태는 was + p.p.인데, run의 p.p.는 run이에요 (run-ran-run).  3) over는 빠뜨리면 안 돼요.","The bottle was로 시작해요. 그 뒤에 r로 시작하는 3글자(원형과 모양이 같은 p.p.)와 o로 시작하는 4글자를 붙이고 by the truck으로 끝내요.","run over → was run over by ~"],
 ["Many people looked up to her.","She was looked up to by many people.","She was looked up to by many people.","그녀는 많은 사람들에게 존경받았다.",
  "본책 p.106 POINT 1 ‘동사구의 수동태’ 표에서 look up to(~을 존경하다)를 찾아보세요.","1) 목적어 her는 수동태에서 주어로 올라가며 She가 돼요. (her → She)  2) looked up to(원형 look up to: 존경하다) 세 단어가 한 덩어리라서, 수동태에서도 up과 to를 떼지 않고 끝까지 붙여 써요.","S로 시작하는 주어 + was looked 뒤에 u로 시작하는 2글자와 t로 시작하는 2글자를 차례로 붙이고, by many people로 끝내요.","주어가 되면 her → She, 동사구는 끝까지"]
].forEach((r,i)=>W(3,"B",i+1,"주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["Sarah was worried ___ the speech contest.","about","Sarah was worried about the speech contest.","세라는 말하기 대회에 대해 걱정했다.",
  "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표에서 be worried를 찾으세요.","1) worried(원형 worry: 걱정시키다)는 ‘걱정하는’ 뜻으로 써요.  2) 보기(in, at, with, about) 중 ‘~에 대해’ 뜻의 전치사는?","a로 시작하는 5글자예요.","be worried about (~에 대해 걱정하다)"],
 ["My refrigerator is filled ___ many fruit and vegetables.","with","My refrigerator is filled with many fruit and vegetables.","내 냉장고는 많은 과일과 채소로 가득 차 있다.",
  "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표의 첫 줄을 보세요.","1) filled(원형 fill: 채우다)는 ‘가득 찬’ 상태를 나타내요.  2) 냉장고가 과일과 채소로 가득 찼다는 뜻이에요. 표에서 be filled 뒤 전치사를 찾아요.","w로 시작하는 4글자예요.","A is filled with B (A가 B로 가득 차 있다)"],
 ["We are interested ___ old films.","in","We are interested in old films.","우리는 오래된 영화에 관심이 있다.",
  "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표의 둘째 줄을 보세요.","1) interested(원형 interest: 관심을 끌다)는 ‘관심 있는’ 뜻으로 써요.  2) ‘~에 관심이 있다’의 ‘~에’에 해당하는 전치사를 골라요.","i로 시작하는 2글자예요. (같은 줄에 있어요)","be interested in + 명사 (~에 관심이 있다)"],
 ["Everyone was surprised ___ the news.","at","Everyone was surprised at the news.","모두가 그 소식에 놀랐다.",
  "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표의 오른쪽 아래를 보세요.","1) surprised(원형 surprise: 놀라게 하다)는 ‘놀란’ 뜻으로 써요.  2) 소식을 듣고 놀랐다는 뜻이에요. 남은 전치사 중 하나를 골라요. (한 번씩만 쓰기)","a로 시작하는 2글자예요. 앞 문제들에서 쓰고 남은 전치사 중 하나예요.","be surprised at (~에 놀라다)"]
].forEach((r,i)=>W(3,"C",i+1,"보기에서 알맞은 전치사를 골라 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7],["in","at","with","about"]));
[["이 코트는 더 이상 나에게 맞지 않는다. (doesn’t / me / fit)<br>This coat ___ anymore.","doesn’t fit me","This coat doesn’t fit me anymore.","이 코트는 더 이상 나에게 맞지 않는다.",
  "본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 표의 둘째 줄(have, lack, resemble, fit, suit)을 보세요.","1) fit(맞다)은 상태를 나타내는 동사라서 수동태로 쓰지 않아요.  2) 그러면 능동태 순서예요: 부정(doesn’t) + 동사원형 + 목적어(me).","doesn’t / f로 시작하는 3글자 / m으로 시작하는 2글자 순서예요.","fit은 수동태 X → doesn’t fit me"],
 ["그 약속은 다음 주로 미뤄졌다. (was / until / off / put)<br>The appointment ___ next week.","was put off until","The appointment was put off until next week.","그 약속은 다음 주로 미뤄졌다.",
  "본책 p.106 POINT 1 ‘동사구의 수동태’ 표에서 put off(~을 미루다)를 찾아보세요.","1) ‘미뤄졌다’는 수동 + 과거예요.  2) put off(원형 put off: 미루다)가 한 덩어리 동사예요. 수동태에서도 put과 off를 떼지 말고 was 뒤에 붙여요.  3) until(~까지)은 맨 끝이에요.","순서: was / p로 시작하는 3글자 / o로 시작하는 3글자 / until 이에요.","was + put off (동사구 한 덩어리)"],
 ["Anwar는 그 페인트 색깔에 만족한다. (satisfied / the / color / with / is / paint)<br>Anwar ___.","is satisfied with the paint color","Anwar is satisfied with the paint color.","Anwar는 그 페인트 색깔에 만족한다.",
  "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표에서 be satisfied with를 보세요.","1) ‘~에 만족한다’ → be satisfied with 한 덩어리예요.  2) 주어 Anwar는 단수이고 현재라서 is를 써요.  3) ‘페인트 색깔’은 paint color 순서예요.","be동사 + p.p. + 전치사를 먼저 놓고, 그 뒤에 the + paint(페인트) + color(색깔) 순서로 이어요.","be satisfied with + 만족의 대상"],
 ["Jenny는 그녀의 조부모님에 의해 길러졌다. (brought / her / up / by / was / grandparents)<br>Jenny ___.","was brought up by her grandparents","Jenny was brought up by her grandparents.","Jenny는 그녀의 조부모님에 의해 길러졌다.",
  "본책 p.106 POINT 1 ‘동사구의 수동태’ 표에서 bring up(~을 기르다)을 보세요.","1) bring up(원형 bring up: 기르다)은 한 덩어리 동사구예요.  2) ‘길러졌다’이므로 과거 수동, 「was + bring의 p.p. + up」 모양이에요.  3) 행위자는 「by + 목적격」 자리, 소유격 her가 grandparents 앞에 와요.","세 단어 동사구(was로 시작)를 떼지 말고 먼저 쓰고, 그다음 by, 마지막에 her + 조부모님 순서예요.","동사구 수동태: was brought up by ~"]
].forEach((r,i)=>W(3,"D",i+1,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7],[["doesn’t","me","fit"],["was","until","off","put"],["satisfied","the","color","with","is","paint"],["brought","her","up","by","was","grandparents"]][i]));

// ===== 서술형 대비 연습문제 (pp.108-109) =====
[["The red tulips <u>was planted</u> yesterday. (O / X)","X, were planted","The red tulips were planted yesterday.","그 빨간 튤립들은 어제 심어졌다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 과거시제 줄과 ‘수 일치’ 설명을 보세요.","1) 주어 The red tulips는 단수일까요, 복수일까요?  2) 과거 수동태는 was/were + p.p.예요. 주어와 be동사가 맞는지 확인해요.","복수 주어에는 was를 쓸 수 없어요. w로 시작하는 4글자로 고쳐요.","복수 주어 + 과거 수동 → were + p.p."],
 ["Cash <u>is not accepted</u> on this bus. (O / X)","O","Cash is not accepted on this bus.","이 버스에서는 현금이 받아지지 않는다. (현금은 받지 않습니다.)",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 부정문 표를 보세요.","1) is not accepted(원형 accept: 받아들이다)의 모양을 보세요.  2) 수동태 부정문 「be동사 + not + p.p.」와 비교해요.","주어 Cash는 단수이고 현재 모양도 맞아요. 고칠 곳이 없어요.","is not + p.p. 모양은 OK"],
 ["They <u>lacked</u> the money to buy a new car. (O / X)","O","They lacked the money to buy a new car.","그들은 새 차를 살 돈이 부족했다.",
  "본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 표의 둘째 줄(have, lack, resemble, fit, suit)을 보세요.","1) lacked(원형 lack: ~이 부족하다)는 상태를 나타내는 동사예요.  2) 이 문장은 수동태가 아니라 능동태로 쓰였어요. 능동으로 쓰는 게 맞는지 보세요.","상태 동사는 능동으로 쓰는 게 맞아요. 고칠 곳이 없어요.","lack은 능동으로 써야 함 → O"],
 ["These baby lions <u>were brought up</u> a dog. (O / X)","X, were brought up by","These baby lions were brought up by a dog.","이 아기 사자들은 개에 의해 길러졌다.",
  "본책 p.102 POINT 1 ‘수동태의 형태와 의미’의 「by + 목적격」 설명을 보세요.","1) were brought up(원형 bring up: 기르다)은 수동태예요.  2) 수동태에서 행위자를 나타내려면 동사 뒤에 무엇이 필요한가요?  3) a dog 앞이 비어 있어요.","동사구 끝에 b로 시작하는 2글자 전치사를 넣어요.","행위자는 by + 목적격"],
 ["The extra supplies <u>are being ordered</u> now. (O / X)","O","The extra supplies are being ordered now.","추가 물품이 지금 주문되고 있다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 진행형 줄을 보세요.","1) now(지금)는 진행 중인 일이에요.  2) are being ordered(원형 order: 주문하다)가 「be동사 + being + p.p.」 모양과 같은지 비교해요.","주어 복수에 are, being, p.p.가 모두 맞아요. 고칠 곳이 없어요.","진행 수동 → be + being + p.p. (OK)"],
 ["Your package <u>will be delivered</u> tomorrow. (O / X)","O","Your package will be delivered tomorrow.","당신의 소포는 내일 배달될 것이다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 미래시제 줄을 보세요.","1) tomorrow(내일)가 있으니 미래예요.  2) will be delivered(원형 deliver: 배달하다)가 「will + be + p.p.」와 같은지 확인해요.","모양이 모두 맞아요. 고칠 곳이 없어요.","will + be + p.p. (OK)"],
 ["The restaurant <u>is filled by</u> customers. (O / X)","X, is filled with","The restaurant is filled with customers.","그 식당은 손님들로 가득 차 있다.",
  "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표의 첫 줄을 보세요.","1) filled(원형 fill: 채우다)는 ‘~로 가득 차다’ 뜻의 표현이에요.  2) 표에서 be filled 뒤에 붙는 전치사는 by일까요?","by 대신 w로 시작하는 4글자 전치사를 써요.","be filled with (by가 아님)"],
 ["Why <u>did the meeting delayed</u>? (O / X)","X, was the meeting","Why was the meeting delayed?","그 회의는 왜 연기되었니?",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 의문사가 있는 의문문 줄을 보세요.","1) delayed(원형 delay: 연기하다)는 p.p.예요. 회의는 ‘연기되는’ 쪽이에요.  2) 수동태 의문문은 의문사 + be동사 + 주어 + p.p.예요. did는 맞는 짝일까요?","did를 be동사로 바꿔요. 과거이고 주어 meeting은 단수라서 w로 시작하는 3글자예요.","의문사 + be동사 + 주어 + p.p."],
 ["These sweaters <u>should be not washed</u> in hot water. (O / X)","X, should not be washed","These sweaters should not be washed in hot water.","이 스웨터들은 뜨거운 물에서 세탁되어서는 안 된다.",
  "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표의 부정문 줄을 보세요.","1) 조동사 should가 있어요.  2) 부정문 순서는 「조동사 + not + be + p.p.」예요. not이 어디에 있는지 보세요.","be와 not의 자리를 서로 바꾸면 돼요. 조동사 바로 뒤에 not이 와요.","not은 조동사 바로 뒤 (be not X)"],
 ["Can <u>be kiwis grown</u> in Korea? (O / X)","X, kiwis be grown","Can kiwis be grown in Korea?","키위가 한국에서 길러질 수 있니?",
  "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표의 의문문 줄(조동사 + 주어 + be + p.p. ~?)을 보세요.","1) Can이 맨 앞에 있어요.  2) 그 뒤에 와야 하는 것은 주어(kiwis)일까요, be일까요? 순서를 확인해요.","be와 kiwis의 순서를 바꿔요. Can + k로 시작하는 주어 + be + grown 순서예요.","의문문: 조동사 → 주어 → be + p.p. (be가 주어 앞 X)"]
].forEach((r,i)=>W("SW","A",i+1,"밑줄 친 부분이 어법상 옳은지 판단하고, 틀리면 바르게 고치시오. (O / X)<br>"+r[0].replace(" (O / X)",""),r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["My mom turned on the lights.","The lights were turned on by my mom","The lights were turned on by my mom.","불들은 우리 엄마에 의해 켜졌다.",
  "본책 p.106 POINT 1 ‘동사구의 수동태’ 설명을 보세요. 동사구는 한 덩어리로 생각해요.","1) turned on(원형 turn on: ~을 켜다)은 한 덩어리 동사구예요.  2) 목적어 the lights가 주어, 복수 + 과거라서 be동사도 복수 과거형으로 맞춰요.  3) on을 빼먹지 말고 by my mom을 붙여요.","The lights로 시작해요. w로 시작하는 4글자 + turn 끝에 -ed + o로 시작하는 2글자 + by my mom 순서예요.","동사구는 통째로 → were turned on"],
 ["The journalists uncovered the story.","The story was uncovered by the journalists","The story was uncovered by the journalists.","그 이야기는 기자들에 의해 밝혀졌다.",
  "본책 p.102 POINT 1 ‘수동태의 형태와 의미’ 의 화살표 그림(능동 → 수동)을 보세요.","1) uncovered(원형 uncover: 밝혀내다)는 과거형이에요. 목적어 the story가 주어가 돼요.  2) the story는 단수예요. 과거 수동태 be동사를 정해요.","The story로 시작해요. 단수 과거 be동사(w로 시작하는 3글자) + uncovered + by the journalists 순서예요.","과거 단수 수동 → was + p.p. + by ~"],
 ["Every year, the choir sings this song.","this song is sung by the choir","Every year, this song is sung by the choir.","매년 이 노래는 합창단에 의해 불린다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 현재시제 줄을 보세요.","1) Every year(매년)는 반복되는 일이라 현재예요. 목적어 this song이 주어가 돼요.  2) sings(원형 sing: 노래하다)는 sing-sang-sung에서 p.p.를 써요.  3) this song은 단수라서 단수 현재 be동사를 써요.","this song으로 시작해요. i로 시작하는 2글자 + s로 시작하는 4글자 + by the choir 순서예요.","sing-sang-sung, 현재 단수 → is sung"],
 ["Tina is baking the muffins.","The muffins are being baked by Tina","The muffins are being baked by Tina.","그 머핀들은 티나에 의해 구워지고 있다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 진행형 줄을 보세요.","1) is baking(원형 bake: 굽다)은 진행형이에요.  2) 목적어 the muffins(복수)가 주어가 돼요.  3) 진행형 수동태는 be동사 + being + p.p.예요.","The muffins로 시작해요. a로 시작하는 3글자 + b로 시작하는 5글자 + baked + by Tina 순서예요.","진행 수동 → be + being + p.p."],
 ["His colleagues laughed at him.","He was laughed at by his colleagues","He was laughed at by his colleagues.","그는 그의 동료들에 의해 비웃음을 당했다.",
  "본책 p.106 POINT 1 ‘동사구의 수동태’의 예문(His ideas were laughed at by everyone.)을 보세요.","1) laughed at(원형 laugh at: ~을 비웃다)는 한 덩어리 동사구예요.  2) 목적어 him은 수동태 주어로 올라가며 He가 돼요.  3) at을 빠뜨리지 말아요.","He was로 시작해요. laugh 끝에 -ed를 붙이고, a로 시작하는 2글자를 꼭 붙인 뒤 by his colleagues로 끝내요.","laugh at → was laughed at by ~"],
 ["The company will provide food and beverages.","Food and beverages will be provided by the company","Food and beverages will be provided by the company.","음식과 음료는 회사에 의해 제공될 것이다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 미래시제 줄을 보세요.","1) will provide(원형 provide: 제공하다)는 미래예요. 목적어 food and beverages가 주어가 돼요.  2) 미래 수동태 모양은 「will + be + p.p.」예요.","Food and beverages will로 시작해요. b로 시작하는 2글자 + provide 끝에 -d를 붙인 말 + by the company 순서예요.","will provide → will be provided (be 꼭!)"],
 ["Deforestation can cause climate change.","Climate change can be caused by deforestation","Climate change can be caused by deforestation.","기후 변화는 삼림 파괴에 의해 야기될 수 있다.",
  "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표의 긍정문 줄을 보세요.","1) can(~할 수 있다)은 조동사예요. 목적어 climate change가 주어가 돼요.  2) 조동사가 있으면 「조동사 + be + p.p.」예요.  3) cause(원인이 되다)의 p.p.를 써요.","Climate change can으로 시작해요. b로 시작하는 2글자 + cause 끝에 -d를 붙인 말 + by deforestation 순서예요.","조동사 + be + p.p. + by ~"]
].forEach((r,i)=>W("SW","B",i+1,"주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>"+r[0]+(i==2?"<br>→ Every year, ___.":""),r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["(그림: 주근깨가 가득한 얼굴의 소년이 브이 표시를 하고 있다)<br>The boy’s face ___ freckles.","is covered with","The boy’s face is covered with[in] freckles.","그 소년의 얼굴은 주근깨로 덮여 있다.",
  "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표에서 be covered with[in]을 찾으세요.","1) 그림 속 소년의 얼굴에 주근깨(freckles)가 가득해요. ‘~로 덮여 있다’ 뜻이에요.  2) 현재시제로 쓰라고 했으니 be동사는 is예요. cover(덮다)의 p.p.를 써요.","빈칸 세 단어: i로 시작하는 2글자 / c로 시작하는 7글자 / w로 시작하는 4글자예요. (마지막 전치사는 i로 시작하는 2글자도 가능)","be covered with[in] (~로 덮여 있다)"],
 ["(그림: 십 대 팬들이 한 남자를 보며 환호하고 있다)<br>He ___ by many teenagers.","is looked up to","He is looked up to by many teenagers.","그는 많은 십 대들에게 존경받는다.",
  "본책 p.106 POINT 1 ‘동사구의 수동태’ 표에서 look up to(~을 존경하다)를 찾으세요.","1) 많은 십 대들이 좋아하며 따르는 사람이에요. ‘존경받는다’는 look up to를 수동태로 써요.  2) 현재시제이고 He는 단수예요. be동사 + p.p.로 만들고 up to는 그대로 남겨요.","빈칸에 네 단어: i로 시작하는 2글자 / l로 시작하는 6글자 / u로 시작하는 2글자 / t로 시작하는 2글자 순서예요.","look up to → is looked up to by ~"],
 ["(그림: 한 소녀가 동물 보호소에서 개와 고양이를 돌보고 있다)<br>She ___ taking care of animals.","is interested in","She is interested in taking care of animals.","그녀는 동물을 돌보는 일에 관심이 있다.",
  "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표에서 be interested in을 찾으세요.","1) 그림 속 소녀는 동물 돌보기를 좋아하는 것 같아요. ‘~에 관심이 있다’ 표현을 써요.  2) 현재시제이고 She는 단수예요. interest(관심을 끌다)의 p.p.를 써요.","빈칸 세 단어: is / i로 시작하는 10글자 / i로 시작하는 2글자예요.","be interested in + -ing (~하는 것에 관심)"]
].forEach((r,i)=>W("SW","C",i+1,"다음 그림을 보고 보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오. (단, 현재시제로 쓸 것)<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7],["cover","interest","look up to"]));
[["A Hey, George. I heard you hurt your arm. <u>(1) 너에게 무슨 일이 생겼니?</u><br>B Hi, Greta. Yeah, I had an accident. <u>(2) 엑스레이를 찍고 나서, 그 의사는 내 다리도 부러졌다고 말했어.</u><br>A Wow. You must be in a lot of pain. When will they remove the cast?<br>B I’ll be okay. <u>(3) 그 깁스는 다음 주에 제거될 거야.</u><br>A I’m glad to hear that. <u>(4) 오, 내가 떠나기 전에, 너를 위한 선물이 하나 있어.</u> I hope you feel better really soon!<br>B Thank you so much for the fruit, and thanks for visiting me!<br><br>(1) What ___ to you? (happen)","happened","What happened to you?","너에게 무슨 일이 생겼니?",
  "본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 표의 자동사 줄(arrive, happen, ...)을 보세요.","1) happen(일어나다)은 목적어가 없는 자동사예요.  2) 자동사는 수동태가 아니라 그냥 동사 하나로 써요. 팔을 다친 일은 이미 일어난 일이에요.","h로 시작하는 8글자예요. 과거형이에요.","happen은 수동태 X → What happened to you?"],
 ["A Hey, George. I heard you hurt your arm. <u>(1) 너에게 무슨 일이 생겼니?</u><br>B Hi, Greta. Yeah, I had an accident. <u>(2) 엑스레이를 찍고 나서, 그 의사는 내 다리도 부러졌다고 말했어.</u><br>A Wow. You must be in a lot of pain. When will they remove the cast?<br>B I’ll be okay. <u>(3) 그 깁스는 다음 주에 제거될 거야.</u><br>A I’m glad to hear that. <u>(4) 오, 내가 떠나기 전에, 너를 위한 선물이 하나 있어.</u> I hope you feel better really soon!<br>B Thank you so much for the fruit, and thanks for visiting me!<br><br>(2) After I got an X-ray, the doctor said that ___ too. (my leg, break)","my leg was broken","After I got an X-ray, the doctor said that my leg was broken too.","엑스레이를 찍고 나서, 그 의사는 내 다리도 부러졌다고 말했어.",
  "본책 p.100 ‘능동태의 수동태 전환’ 박스에서 「be동사 + p.p.」를 확인하세요.","1) ‘다리가 부러졌다’는 다리가 ‘부러짐을 당한’ 것이라 수동이에요.  2) said(원형 say: 말하다)가 과거이므로 that 뒤도 과거 시제예요.  3) break(부러뜨리다)의 변화는 break-broke-broken이에요.","my leg ___ ___. 빈칸은 w로 시작하는 3글자 + b로 시작하는 6글자예요.","다리(단수) 과거 수동 → was broken"],
 ["A Hey, George. I heard you hurt your arm. <u>(1) 너에게 무슨 일이 생겼니?</u><br>B Hi, Greta. Yeah, I had an accident. <u>(2) 엑스레이를 찍고 나서, 그 의사는 내 다리도 부러졌다고 말했어.</u><br>A Wow. You must be in a lot of pain. When will they remove the cast?<br>B I’ll be okay. <u>(3) 그 깁스는 다음 주에 제거될 거야.</u><br>A I’m glad to hear that. <u>(4) 오, 내가 떠나기 전에, 너를 위한 선물이 하나 있어.</u> I hope you feel better really soon!<br>B Thank you so much for the fruit, and thanks for visiting me!<br><br>(3) The cast ___ next week. (will, remove)","will be removed","The cast will be removed next week.","그 깁스는 다음 주에 제거될 거야.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 미래시제 줄을 보세요.","1) next week(다음 주)와 will이 있으니 미래예요.  2) 깁스는 ‘제거되는’ 쪽이라 수동태예요. 「will + be + p.p.」에 remove(제거하다)를 넣어요.","will / b로 시작하는 2글자 / r로 시작하는 7글자 순서예요.","next week + 수동 → will be + p.p.(removed)"],
 ["A Hey, George. I heard you hurt your arm. <u>(1) 너에게 무슨 일이 생겼니?</u><br>B Hi, Greta. Yeah, I had an accident. <u>(2) 엑스레이를 찍고 나서, 그 의사는 내 다리도 부러졌다고 말했어.</u><br>A Wow. You must be in a lot of pain. When will they remove the cast?<br>B I’ll be okay. <u>(3) 그 깁스는 다음 주에 제거될 거야.</u><br>A I’m glad to hear that. <u>(4) 오, 내가 떠나기 전에, 너를 위한 선물이 하나 있어.</u> I hope you feel better really soon!<br>B Thank you so much for the fruit, and thanks for visiting me!<br><br>(4) Oh, before I leave, ___ for you. (have, gift)","I have a gift","Oh, before I leave, I have a gift for you.","오, 내가 떠나기 전에, 너를 위한 선물이 하나 있어.",
  "본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 표의 둘째 줄(have, lack, ...)을 보세요.","1) have(가지다)는 소유를 나타내는 동사라서 수동태로 쓰지 않아요.  2) 그러니 능동태로 ‘나는 선물 하나를 가지고 있다’는 순서로 써요.  3) 선물 앞에는 ‘하나의’ 뜻으로 a를 붙여요.","I h로 시작하는 4글자 + a + g로 시작하는 4글자예요.","have(소유)는 수동태 X → I have a gift"]
].forEach((r,i)=>W("SW","D",i+1,"다음 대화를 읽고 밑줄 친 우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));

// ===== 내신 대비 실전문제 (pp.110-113) =====
C("NS","N",1,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>This house ___ by my dad.",["① build","② is build","③ was build","④ was built","⑤ were built"],"④ was built","This house was built by my dad.","이 집은 우리 아빠에 의해 지어졌다.",
 "본책 p.100 ‘능동태의 수동태 전환’ 박스와 p.102 POINT 1을 보세요. 수동태는 「be동사 + p.p.」예요.","1) 집(house)은 ‘지어지는’ 쪽이라 수동태예요.  2) 뒤에 by my dad(우리 아빠에 의해)가 있어요.  3) build(짓다)의 p.p.는 무엇일까요? (build-built-built) 주어는 단수예요.","be동사 뒤에 p.p.가 와야 하니 build, is build, was build는 탈락이에요. 단수 주어이므로 were도 탈락이에요.","집(단수), 과거 → was + built");
C("NS","N",2,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>A magazine about films ___ a film magazine.",["① can call","② can be call","③ can be called","④ can called","⑤ can be calling"],"③ can be called","A magazine about films can be called a film magazine.","영화에 관한 잡지는 영화 잡지라고 불릴 수 있다.",
 "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표를 보세요.","1) can(~할 수 있다)은 조동사예요.  2) 잡지는 ‘~라고 불리는’ 쪽이라 수동태예요.  3) 「조동사 + be + p.p.」 모양을 찾아요.","can 뒤에 be가 있고, 그 뒤에 call(부르다)의 p.p.가 오는 보기예요. -ing나 원형은 틀려요.","조동사 + be + p.p. → can be called");
C("NS","N",3,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>___ the man caught by the police?",["① Was","② Are","③ Were","④ When","⑤ Being"],"① Was","Was the man caught by the police?","그 남자는 경찰에 의해 붙잡혔니?",
 "본책 p.104 POINT 1 ‘부정문과 의문문’의 의문문 표(be동사 + 주어 + p.p. ~?)를 보세요.","1) caught(원형 catch: 잡다)는 p.p.예요. 수동태 의문문이에요.  2) 주어 the man은 한 명(단수)이에요.  3) 의문사가 따로 필요한 문장일까요? 시간이나 장소를 묻고 있지 않아요.","be동사 중 단수 주어에 맞는 과거형이에요. 첫 번째 보기예요.","수동태 의문문 → Was + 단수 주어 + p.p.");
C("NS","N",4,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>My playlist ___ with all my favorite songs.",["① is fill","② filled","③ is filled","④ was filling","⑤ is be filled"],"③ is filled","My playlist is filled with all my favorite songs.","내 재생목록은 내가 가장 좋아하는 모든 노래로 가득 차 있다.",
 "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표의 be filled with를 보세요.","1) 뒤에 with가 있어요. ‘~로 가득 차 있다’ 표현이에요.  2) 「be동사 + p.p.」 모양이 되어야 해요. 주어 My playlist는 단수예요.","be동사 is 뒤에 fill(채우다)의 p.p.가 온 보기예요. 세 번째 보기예요.","be filled with (~로 가득 차 있다)");
M("NS","N",5,"밑줄 친 부분을 생략할 수 있는 것을 모두 고르시오.<br>① This picture was painted <u>by Picasso</u>.<br>② Hawaii was explored <u>by James Cook</u>.<br>③ Spanish is spoken <u>by people</u> in Mexico.<br>④ The windows were closed <u>by someone</u> yesterday.<br>⑤ The first modern car was invented <u>by Karl Benz</u>.",["① This picture was painted by Picasso.","② Hawaii was explored by James Cook.","③ Spanish is spoken by people in Mexico.","④ The windows were closed by someone yesterday.","⑤ The first modern car was invented by Karl Benz."],["③ Spanish is spoken by people in Mexico.","④ The windows were closed by someone yesterday."],"Spanish is spoken in Mexico. / The windows were closed yesterday.","스페인어는 멕시코에서 사용된다. / 창문들은 어제 닫혔다.",
 "본책 p.102 POINT 1 ‘수동태의 형태와 의미’ 아래쪽, by + 목적격을 생략할 수 있는 경우(행위의 주체가 불분명하거나 불특정한 사람들)를 보세요.","1) 각 문장의 by 뒤 행위자가 누구인지 보세요.  2) Picasso, James Cook, Karl Benz는 누구인지 분명한 사람이에요. 반대로 막연한 사람은?","people(사람들)과 someone(누군가)처럼 누구인지 특정되지 않는 말이 있는 두 문장이에요. 번호가 연달아 있어요.","행위자가 불특정(people, someone)이면 by 생략 가능");
C("NS","N",6,"[6-7] 우리말을 영어로 바르게 옮긴 것을 고르시오.<br>그 지시는 제대로 이해되지 못했다.",["① The directions is not understand correctly.","② The directions was not understood correctly.","③ The directions not were understood correctly.","④ The directions were not understand correctly.","⑤ The directions were not understood correctly."],"⑤ The directions were not understood correctly.","The directions were not understood correctly.","그 지시는 제대로 이해되지 못했다.",
 "본책 p.104 POINT 1 ‘부정문과 의문문’의 부정문 표(be동사 + not + p.p.)를 보세요.","1) ‘이해되지 못했다’는 과거 + 부정 + 수동이에요.  2) The directions는 복수예요. be동사 과거형을 골라요.  3) not의 위치와 p.p.(understand의 p.p.: understood)까지 확인해요.","were not understood 순서가 맞는 보기예요. 마지막 보기예요.","복수 과거 수동 부정 → were not + p.p.");
C("NS","N",7,"[6-7] 우리말을 영어로 바르게 옮긴 것을 고르시오.<br>그 연설은 Hannah가 할 것이다.",["① The speech will give Hannah.","② The speech will be give Hannah.","③ The speech will be given Hannah.","④ The speech will be given by Hannah.","⑤ The speech will being given by Hannah."],"④ The speech will be given by Hannah.","The speech will be given by Hannah.","그 연설은 Hannah에 의해 행해질 것이다. (Hannah가 할 것이다.)",
 "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 미래시제 줄(will + be + p.p.)과 POINT 1의 by + 목적격을 보세요.","1) 연설은 ‘행해지는’ 쪽이에요. 미래 수동태예요.  2) 「will + be + p.p.」 모양을 찾아요.  3) 행위자 Hannah 앞에는 무엇이 필요할까요?","will be given(give의 p.p.) 뒤에 by Hannah가 있는 보기예요. 네 번째 보기예요.","미래 수동 → will be given by ~");
C("NS","N",8,"어느 빈칸에도 들어갈 수 없는 것은?<br>The dish was covered ___ cheese.<br>Henry was surprised ___ my response.<br>I’m worried ___ environmental pollution.<br>Natalie is satisfied ___ her grade.",["① in","② at","③ for","④ with","⑤ about"],"③ for","(어느 빈칸에도 들어갈 수 없는 것: for)","어느 빈칸에도 들어갈 수 없는 것은 for이다. (be covered with[in] / be surprised at / be worried about / be satisfied with)",
 "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표 전체를 보세요.","1) 네 문장의 표현을 찾아요: be covered(덮여 있다), be surprised(놀라다), be worried(걱정하다), be satisfied(만족하다).  2) 표에서 각각 뒤에 붙는 전치사를 하나씩 확인해요.","표에 나온 전치사는 with, in, at, about 이에요. 다섯 보기 중 이 표에 한 번도 나오지 않는 것이 답이에요.","covered with[in], surprised at, worried about, satisfied with");
C("NS","N",9,"밑줄 친 부분이 어법상 옳지 않은 것은?<br>① The dinner <u>was prepared</u> by Ben.<br>② That TV show <u>was broadcasted</u> worldwide.<br>③ Alpacas and llamas <u>are resembled</u> each other.<br>④ The classroom <u>is cleaned</u> every day.<br>⑤ The laundry <u>was done</u> by Amy.",["① was prepared","② was broadcasted","③ are resembled","④ is cleaned","⑤ was done"],"③ are resembled","Alpacas and llamas resemble each other.","알파카와 라마는 서로 닮았다.",
 "본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 표의 둘째 줄(have, lack, resemble, fit, suit)을 보세요.","1) 다섯 보기를 하나씩 읽고 ‘주어가 당하는 쪽’인지 확인해요.  2) 소유나 상태를 나타내는 동사는 수동태로 쓰지 않아요. 표의 동사가 보기 중에 있는지 찾아요.","each other(서로)가 목적어 역할을 해요. 닮다는 뜻의 동사가 수동태로 쓰인 것이 세 번째 보기예요.","resemble(닮다)은 수동태 X");
M("NS","N",10,"문장의 전환이 바르지 않은 것을 모두 고르시오.<br>① Did Minji break my umbrella? → Is my umbrella broken by Minji?<br>② A thief stole my bag yesterday. → My bag was stolen by a thief yesterday.<br>③ Steve will clean the window this afternoon. → The window will be cleaned by Steve this afternoon.<br>④ The firefighters put out a huge fire on the mountain. → A huge fire on the mountain were put out by the firefighters.<br>⑤ Jake might invite me to the party later. → I might be invited to the party later by Jake.",["① Did Minji break my umbrella? → Is my umbrella broken by Minji?","② A thief stole my bag yesterday. → My bag was stolen by a thief yesterday.","③ Steve will clean the window this afternoon. → The window will be cleaned by Steve this afternoon.","④ The firefighters put out a huge fire on the mountain. → A huge fire on the mountain were put out by the firefighters.","⑤ Jake might invite me to the party later. → I might be invited to the party later by Jake."],["① Did Minji break my umbrella? → Is my umbrella broken by Minji?","④ The firefighters put out a huge fire on the mountain. → A huge fire on the mountain were put out by the firefighters."],"① Was my umbrella broken by Minji? / ④ A huge fire on the mountain was put out by the firefighters.","① 내 우산은 민지에 의해 부서졌니? / ④ 산의 큰 불은 소방관들에 의해 꺼졌다.",
 "본책 p.102 POINT 2 ‘수동태의 시제’ 표와 p.104 POINT 1 ‘부정문과 의문문’을 보세요.","1) 능동태 문장의 시제를 먼저 확인해요. 수동태에서도 같은 시제의 be동사를 써야 해요.  2) 수동태의 be동사는 새 주어의 수에도 맞춰야 해요.  3) 각 보기에서 시제와 수가 맞는지 하나씩 체크해요.","①은 Did(과거)로 시작했는데 수동태 be동사가 현재형이에요. ④는 주어가 하나(A huge fire)인데 복수 be동사를 썼어요.","시제는 그대로, be동사는 새 주어의 수에 맞춘다");
C("NS","N",11,"대화의 빈칸에 들어갈 말로 알맞은 것은?<br>A These are my robots. They serve all the hamburgers in my restaurant.<br>B Wow. How many hamburgers ___ by your robots in a day?<br>A I’m not sure. Probably more than a hundred burgers a day.",["① serve","② served","③ is served","④ are served","⑤ is serving"],"④ are served","How many hamburgers are served by your robots in a day?","하루에 몇 개의 햄버거가 당신의 로봇들에 의해 제공되나요?",
 "본책 p.104 POINT 1 ‘부정문과 의문문’ 의 수동태 의문문 설명과 p.102 POINT 2 현재시제 줄을 보세요.","1) 빈칸 뒤에 by your robots(로봇들에 의해)가 있어요. 수동태예요.  2) How many hamburgers는 복수예요.  3) in a day(하루에)는 반복되는 일이라 현재시제예요.","복수 주어 + 현재 수동태 → be동사 + p.p.예요. are로 시작하는 보기를 골라요.","복수 현재 수동 → are + p.p.");
W("NS","N",12,"[12-13] 주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>Did Sam write this letter?","Was this letter written by Sam?","Was this letter written by Sam?","이 편지는 샘에 의해 쓰였니?",
 "본책 p.104 POINT 1 ‘부정문과 의문문’의 의문문 표(be동사 + 주어 + p.p. ~?)를 보세요.","1) Did Sam write ~?는 과거의 능동태 의문문이에요. 목적어 this letter가 주어가 돼요.  2) 수동태 의문문은 be동사를 주어 앞으로 보내요. 과거이고 this letter는 단수예요.  3) write(쓰다)의 p.p.를 써요.","W로 시작하는 3글자 + this letter + w로 시작하는 7글자 + by Sam 순서이고, 끝에 물음표를 붙여요.","수동태 의문문 → Was + 주어 + p.p. + by ~?");
W("NS","N",13,"[12-13] 주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>The audience laughed at Louis.","Louis was laughed at by the audience","Louis was laughed at by the audience.","Louis는 관객에 의해 비웃음을 당했다.",
 "본책 p.106 POINT 1 ‘동사구의 수동태’ 설명을 보세요. 동사구는 한 덩어리 동사예요.","1) laughed at(원형 laugh at: ~을 비웃다)은 한 덩어리 동사구예요.  2) 목적어 Louis가 주어가 돼요.  3) 과거 수동태 was + p.p.에 at을 그대로 남기고 by the audience를 붙여요.","Louis was로 시작해요. laugh 끝에 -ed를 붙이고 a로 시작하는 2글자를 빠뜨리지 말고 by the audience로 끝내요.","동사구는 통째로 → was laughed at by ~");
W("NS","N",14,"[14] 우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>벨기에 초콜릿은 전 세계 사람들에 의해 사랑받는다.<br>(chocolates / the / loved / people / Belgian / by / around / world / are)","Belgian chocolates are loved by people around the world","Belgian chocolates are loved by people around the world.","벨기에 초콜릿은 전 세계 사람들에 의해 사랑받는다.",
 "본책 p.100 ‘능동태의 수동태 전환’ 박스에서 수동태 순서(주어 + be동사 + p.p. + by + 행위자)를 보세요.","1) 주어는 ‘벨기에 초콜릿’이므로 Belgian chocolates예요.  2) ‘사랑받는다’는 수동 + 현재라서 복수 be동사 + loved예요.  3) 그 뒤에 by people, 마지막에 ‘전 세계’를 뜻하는 around the world를 써요.","주어(B로 시작하는 2단어) → be동사 → p.p. → by + 사람들 → ‘전 세계’(a로 시작하는 3단어) 순서예요.","주어 + be + p.p. + by 행위자 + 장소 표현",["chocolates","the","loved","people","Belgian","by","around","world","are"]);
C("NS","N",15,"( ) 안에 주어진 말을 바르게 배열할 때 별표(4번째 칸)의 위치에 오는 것은?<br>(are / being / by / lives / technology / changed)<br>Our ___ ___ ___ ___(별표) ___ ___.",["① are","② by","③ changed","④ being","⑤ technology"],"③ changed","Our lives are being changed by technology.","우리의 삶은 기술에 의해 변화되고 있다.",
 "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 진행형 줄(be동사 + being + p.p.)을 보세요.","1) 주어는 Our lives(우리의 삶)예요.  2) ‘변화되고 있다’는 진행 + 수동이에요. 진행 수동 순서를 먼저 세워요.  3) 그 뒤에 by technology가 와요.","Our lives are being ___ by technology. 여섯 칸 중 네 번째 칸(별표 칸)에는 p.p.가 와요.","진행 수동 → be동사 + being + p.p. + by ~");
M("NS","N",16,"그림이 의미하는 바를 바르게 영작한 것을 모두 고르시오.<br>(그림: 수도꼭지 아래에서 20초 동안 손을 씻는 그림 - 20초 표시)<br>① You should wash your hands for twenty seconds.<br>② You should be washed your hands for twenty seconds.<br>③ Your hands should wash for twenty seconds.<br>④ Your hands should be wash for twenty seconds.<br>⑤ Your hands should be washed for twenty seconds.",["① You should wash your hands for twenty seconds.","② You should be washed your hands for twenty seconds.","③ Your hands should wash for twenty seconds.","④ Your hands should be wash for twenty seconds.","⑤ Your hands should be washed for twenty seconds."],["① You should wash your hands for twenty seconds.","⑤ Your hands should be washed for twenty seconds."],"You should wash your hands for twenty seconds. / Your hands should be washed for twenty seconds.","너는 20초 동안 손을 씻어야 한다. / 너의 손은 20초 동안 씻겨야 한다.",
 "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표의 긍정문 줄(조동사 + be + p.p.)을 보세요.","1) 같은 뜻을 능동태와 수동태 두 가지로 쓸 수 있어요.  2) 주어가 You(사람)면 손을 직접 씻는 능동태예요. 주어가 Your hands면 씻겨지는 수동태예요.  3) 각 보기가 문법에 맞는지 하나씩 봐요.","능동은 「조동사 + 동사원형 + 목적어」, 수동은 「조동사 + be + p.p.」예요. 이 모양이 정확한 보기가 두 개 있어요 (처음과 마지막).","능동: should wash / 수동: should be washed");
C("NS","N",17,"어법상 옳은 것의 개수는?<br>• The poster will be made by he.<br>• Joanne’s new novel will be published next week.<br>• Nothing is happened in this small town.<br>• The winner will be chose through voting.<br>• His grandfather was looked up by all the villagers.",["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],"① 1개","Joanne’s new novel will be published next week. (나머지 네 문장은 틀림)","Joanne의 새 소설은 다음 주에 출간될 것이다. (옳은 문장은 이 하나뿐이다.)",
 "본책 p.102 ~ p.106의 POINT를 훑어 보세요: p.102 POINT 1(by + 목적격), p.106 POINT 1(동사구), POINT 2(자동사).","1) 다섯 문장을 하나씩 검사해요. by 뒤에는 목적격이 와야 해요.  2) happen은 수동태로 쓰지 않고, choose의 p.p.는 chose가 아니에요.  3) look up to는 to까지 한 덩어리예요.","틀린 문장이 네 개예요. 옳은 것은 will be published가 쓰인 문장 하나뿐이에요.","by + 목적격 / 자동사 X / 불규칙 p.p. / 동사구 통째로");
M("NS","N",18,"밑줄 친 부분을 잘못 고친 것을 모두 고르시오.<br>① You may be not allowed entry. → may not be<br>② The actors is disappeared. → were disappeared<br>③ These pictures were take by reporters. → were took<br>④ This beautiful picture was drawn by she. → by her<br>⑤ Gabriel was surprised in Max’s behavior. → at",["① You may be not allowed entry. → may not be","② The actors is disappeared. → were disappeared","③ These pictures were take by reporters. → were took","④ This beautiful picture was drawn by she. → by her","⑤ Gabriel was surprised in Max’s behavior. → at"],["② The actors is disappeared. → were disappeared","③ These pictures were take by reporters. → were took"],"② The actors disappeared. / ③ These pictures were taken by reporters.","② 그 배우들이 사라졌다. / ③ 이 사진들은 기자들에 의해 찍혔다.",
 "본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 표와 p.102 POINT 1 ‘수동태의 형태와 의미’를 보세요.","1) 고친 부분이 맞는지 하나씩 확인해요.  2) 자동사 disappear(사라지다)는 수동태로 쓸 수 있을까요?  3) 수동태에는 과거형이 아니라 p.p.가 와요. take의 변화(take-took-taken)를 확인해요.","②는 수동태 자체를 없애야 하고, ③은 p.p.(taken)가 필요해요. 잘못 고친 두 개는 번호가 연달아 있어요.","자동사는 수동 X / 수동태엔 과거형이 아닌 p.p.");
C("NS","N",19,"빈칸에 들어갈 말이 순서대로 짝지어진 것은?<br>• Evan was brought ___ by a loving family.<br>• The air was filled ___ the sweet smell of wildflowers.<br>• I am not interested ___ surfing at all.",["① in — at — of","② in — at — from","③ up — with — in","④ up — with — by","⑤ off — about — with"],"③ up — with — in","Evan was brought up by a loving family. / The air was filled with the sweet smell of wildflowers. / I am not interested in surfing at all.","Evan은 사랑이 넘치는 가족에 의해 길러졌다. / 공기는 야생화의 달콤한 향기로 가득 차 있었다. / 나는 서핑에 전혀 관심이 없다.",
 "본책 p.106 POINT 1 ‘동사구의 수동태’ 표와 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 보세요.","1) 첫째 문장은 bring(원형 bring: 데려오다) 뒤에 ‘기르다’ 뜻을 만드는 말이에요.  2) 둘째는 be filled 뒤, 셋째는 be interested 뒤의 전치사를 표에서 찾아요.","빈칸 순서대로 up / with / in이에요. 세 번째 보기예요.","brought up / filled with / interested in");
C("NS","N",20,"[20-21] 다음 대화를 읽고 질문에 답하시오.<br>A Hey, what are you reading?<br>B I’m reading an article about a special fashion brand.<br>A Which brand is that?<br>B It is the bag retailer Freitag. It ⓐ <u>was founded</u> by the Freitag brothers in 1993. It ⓑ <u>is known for</u> selling unique bags. To create these bags, recycled truck covers and seat belts from abandoned cars ⓒ <u>are used</u>.<br>A Wow, it’s great that the company ⓓ <u>is created</u> valuable products with old materials.<br>B Right. This ⓔ <u>is called</u> upcycling. Freitag’s bags look nice and even fashionable. Because of its one-of-a-kind style, (A) <u>many people worldwide love it</u>.<br><br>위 대화의 밑줄 친 ⓐ~ⓔ 중 어법상 틀린 것은?",["① ⓐ","② ⓑ","③ ⓒ","④ ⓓ","⑤ ⓔ"],"④ ⓓ","it’s great that the company creates valuable products with old materials.","그 회사가 낡은 재료로 가치 있는 제품을 만든다는 것이 놀라워.",
 "본책 p.102 POINT 1 ‘수동태의 형태와 의미’에서 주어가 행위를 하는 경우(능동)와 당하는 경우(수동)를 비교해 보세요.","1) ⓐ~ⓔ를 하나씩 읽고 주어가 ‘당하는 쪽’인지 ‘하는 쪽’인지 판단해요.  2) ⓓ의 주어는 the company(회사)예요. 회사가 제품을 ‘만드는’ 쪽일까요, ‘만들어지는’ 쪽일까요?  3) 뒤에 목적어 valuable products가 있어요.","목적어가 뒤에 바로 있으면 능동태가 어울려요. 네 번째 기호예요.","주어가 직접 만들면 능동 (is created X)");
W("NS","N",21,"[20-21] 위 대화의 밑줄 친 (A)를 수동태로 바꿔 쓰시오.<br>(A) many people worldwide love it<br>Because of its one-of-a-kind style, ___.","it is loved by many people worldwide","Because of its one-of-a-kind style, it is loved by many people worldwide.","그것의 독특한 스타일 때문에, 그것은 전 세계의 많은 사람들에게 사랑받는다.",
 "본책 p.100 ‘능동태의 수동태 전환’ 박스(목적어 → 주어, 동사 → be + p.p., 주어 → by + 목적격)를 보세요.","1) 능동태 many people worldwide love it에서 목적어 it이 주어가 돼요. 소문자로 시작해요.  2) love(사랑하다)는 현재, 주어 it은 단수라서 be동사도 단수 현재형이에요.  3) 마지막에 by + many people worldwide를 써요.","it으로 시작해요. i로 시작하는 2글자 + love 끝에 -d를 붙인 말 + by many people worldwide 순서예요.","it(주어) + is + p.p. + by ~");
C("NS","N",22,"빈칸에 들어갈 말이 나머지 넷과 다른 것은?<br>① Her hands were covered ___ oil.<br>② Mr. Austin is pleased ___ the food.<br>③ Mihee is worried ___ the final test.<br>④ I am not satisfied ___ your explanation.<br>⑤ The place is crowded ___ skiers in the winter.",["① Her hands were covered ___ oil.","② Mr. Austin is pleased ___ the food.","③ Mihee is worried ___ the final test.","④ I am not satisfied ___ your explanation.","⑤ The place is crowded ___ skiers in the winter."],"③ Mihee is worried ___ the final test.","Mihee is worried about the final test. (나머지는 모두 with)","미희는 기말고사에 대해 걱정한다. (나머지는 모두 with)",
 "본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 보세요.","1) 각 문장에 들어갈 전치사를 하나씩 생각해요.  2) be covered / be satisfied는 표에 있어요. be pleased(기뻐하다)와 be crowded(붐비다)는 같은 계열의 전치사를 써요.","나머지 네 개는 모두 with예요. 표에서 be worried 뒤에 붙는 전치사는 다른 말이에요. 세 번째 보기예요.","worried about / 나머지는 with");
C("NS","N",23,"우리말과 일치하도록 8단어의 영어 문장을 영작할 때 사용할 수 없는 것은?<br>그 새로운 다리는 이 회사에 의해 지어졌다.",["① bridge","② by","③ were","④ built","⑤ company"],"③ were","The new bridge was built by this company.","그 새로운 다리는 이 회사에 의해 지어졌다.",
 "본책 p.100 ‘능동태의 수동태 전환’ ②번 설명(be동사는 수동태 문장의 주어와 시제에 맞춘다)을 보세요.","1) 다리는 ‘지어지는’ 쪽이라 수동태예요. 「be동사 + p.p. + by ~」로 써요.  2) 주어 The new bridge는 단수이고 과거예요.  3) 8단어는 The new bridge ___ ___ by this company.예요.","빈칸에 들어갈 be동사는 단수 과거형이에요. 보기 중 이것과 다른 be동사를 찾아요.","단수 + 과거 수동 → was + built");
M("NS","N",24,"대화의 밑줄 친 부분이 어법상 옳은 것을 모두 고르시오.<br>A Don’t we have a meeting this afternoon? ① <u>Some important matters are had by us.</u><br>B Not anymore. ② <u>It was canceled.</u> Jimmy got COVID. ③ <u>So he should quarantined for a week.</u><br>A ④ <u>When will he be finished with his quarantine?</u><br>B Thursday.<br>A ⑤ <u>I’m worried with him.</u> I hope he gets well soon.",["① Some important matters are had by us.","② It was canceled.","③ So he should quarantined for a week.","④ When will he be finished with his quarantine?","⑤ I’m worried with him."],["② It was canceled.","④ When will he be finished with his quarantine?"],"② It was canceled. / ④ When will he be finished with his quarantine?","② 그것은 취소되었어요. / ④ 그의 격리는 언제 끝나나요?",
 "본책 p.104 POINT 1·2(의문사 의문문, 조동사 수동태)와 p.106 POINT 2·3을 보세요.","1) ①은 have(가지다) 같은 소유 동사가 수동태가 되었어요.  2) ③은 조동사 뒤 be가 빠졌고, ⑤는 be worried 뒤 전치사를 확인해요.  3) 나머지 두 문장은 문법에 맞아요.","옳은 문장은 ②와 ④예요. ②는 It was canceled(취소되었다), ④는 When will he be finished…?예요.","소유 동사 X / 조동사 + be + p.p. / worried about");
W("NS","N",25,"[25] 다음 표의 내용과 일치하도록 빈칸에 알맞은 말을 쓰시오.<br>(표: Smallpox Vaccine - Edward Jenner - 1796 / Telephone - Alexander Bell - 1876)<br>A Who invented the smallpox vaccine?<br>B The smallpox vaccine ___ ___ ___ Edward Jenner. It was the first vaccine in the world.<br>A ___ ___ the telephone ___?<br>B The first telephone was invented in 1876.","was invented by, When was, invented","A: Who invented the smallpox vaccine? B: The smallpox vaccine was invented by Edward Jenner. A: When was the telephone invented? B: The first telephone was invented in 1876.","A: 천연두 백신은 누가 발명했나요? B: 천연두 백신은 Edward Jenner에 의해 발명되었습니다. 그것은 세계 최초의 백신이었습니다. A: 전화기는 언제 발명되었습니까? B: 최초의 전화기는 1876년에 발명되었습니다.",
 "본책 p.104 POINT 1 ‘부정문과 의문문’의 수동태 의문문 표와 p.102 POINT 1(by + 목적격)을 보세요.","1) 첫 번째 대답은 ‘천연두 백신은 Edward Jenner에 의해 ~’이므로 과거 수동태예요.  2) 두 번째 질문은 B가 1876년이라고 ‘때’를 대답했어요. 의문사를 정해요.  3) 마지막 칸은 invent의 p.p.예요.","첫 번째 세 칸: w로 시작하는 3글자 / i로 시작하는 8글자 / b로 시작하는 2글자. 두 번째 질문: W로 시작하는 4글자(때를 묻는 의문사) / w로 시작하는 3글자 / i로 시작하는 8글자예요.","~에 의해 발명되었다 = was invented by");
W("NS","N",26,"[26-27] 우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>나의 눈이 그 의사에 의해 검사받아질 것이다. (examine)<br>My eyes ___ ___ ___ by the doctor.","will be examined","My eyes will be examined by the doctor.","나의 눈이 그 의사에 의해 검사받아질 것이다.",
 "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 미래시제 줄을 보세요.","1) ‘검사받아질 것이다’는 미래 + 수동이에요.  2) 미래 수동태 모양은 「will + be + p.p.」예요.  3) examine(검사하다)의 p.p.를 마지막 칸에 써요.","빈칸 세 개: will / b로 시작하는 2글자 / e로 시작하는 8글자예요.","‘~될 것이다’ = will be + p.p.(examined)");
W("NS","N",27,"[26-27] 우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>그 창문은 다음 주까지 수리되어야 한다. (should, repair)<br>The window ___ ___ ___ by next week.","should be repaired","The window should be repaired by next week.","그 창문은 다음 주까지 수리되어야 한다.",
 "본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표의 긍정문 줄(조동사 + be + p.p.)을 보세요.","1) ‘수리되어야 한다’는 should(~해야 한다)를 쓴 수동 표현이에요.  2) 조동사 should 뒤에는 be + p.p.를 써요.  3) repair(수리하다)의 p.p.를 써요.","빈칸 세 개: should / b로 시작하는 2글자 / r로 시작하는 8글자예요.","should be + p.p. (~되어야 한다)");
W("NS","N",28,"[28-29] 어법상 틀린 부분을 찾아 바르게 고치시오.<br>These tigers are taken care of three zookeepers.","three zookeepers → by three zookeepers","These tigers are taken care of by three zookeepers.","이 호랑이들은 세 명의 사육사에 의해 돌봐진다.",
 "본책 p.102 POINT 1 ‘수동태의 형태와 의미’의 「by + 목적격」 설명과 p.106 POINT 1 ‘동사구의 수동태’를 보세요.","1) are taken care of(원형 take care of: ~을 돌보다)는 수동태 동사구예요. 이 부분은 맞아요.  2) 그런데 행위자 three zookeepers(세 명의 사육사) 앞에 필요한 말이 빠졌어요.","three zookeepers 앞에 b로 시작하는 2글자 전치사를 넣어요.","수동태의 행위자 앞에는 by");
W("NS","N",29,"[28-29] 어법상 틀린 부분을 찾아 바르게 고치시오.<br>They are cleaning the road. The sidewalk is being sweep.","sweep → swept","They are cleaning the road. The sidewalk is being swept.","그들은 도로를 청소하고 있다. 보도는 쓸리고 있는 중이다.",
 "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 진행형 줄(be동사 + being + p.p.)을 보세요.","1) is being 뒤는 p.p.가 와야 해요.  2) sweep(쓸다)이 원형 그대로 있어요. sweep의 p.p.는 -ed를 붙이지 않는 불규칙 변화예요.","s로 시작하는 5글자예요. sweep에서 ee를 e로 바꾸고 끝에 t를 붙여요.","진행 수동 → being + p.p. (swept)");
W("NS","N",30,"[30] 우리말과 일치하도록 주어진 조건에 맞게 문장을 완성하시오.<br>많은 사고들이 부주의한 운전에 의해 야기된다.<br>조건: 현재시제로 쓸 것 / cause, careless driving을 이용하여 수동태 문장으로 쓸 것<br>Many accidents ___.","are caused by careless driving","Many accidents are caused by careless driving.","많은 사고들이 부주의한 운전에 의해 야기된다.",
 "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 현재시제 줄(am/are/is + p.p.)과 POINT 1의 「by + 목적격」을 보세요.","1) ‘야기된다’는 현재 + 수동이에요. 주어 Many accidents는 복수예요.  2) be동사는 복수 현재형으로 쓰고, cause(야기하다)의 p.p.를 붙여요.  3) 행위자는 by careless driving(부주의한 운전에 의해)이에요.","a로 시작하는 3글자 / c로 시작하는 6글자 / by / careless driving 순서예요.","복수 현재 수동 → are + p.p. + by ~");

// ===== 문법정리노트 (p.114) =====
[["자동사 혹은 소유나 상태를 나타내는 동사는 수동태로 쓰지 않는다.<br>The sun 1 (was disappeared / disappeared).","disappeared","The sun disappeared.","태양이 사라졌다.",
  "본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 표의 자동사 줄을 보세요.","1) disappear(사라지다)는 목적어 없이 쓰는 자동사예요.  2) 자동사는 수동태로 만들 수 있을까요? 노트에서는 과거를 나타내요.","d로 시작하는 11글자예요. disappear에 ed를 붙인 모양이에요.","자동사는 수동태 X → 그냥 과거형"],
 ["The apples 2 ___ by the farmers. 그 사과들은 그 농부들에 의해 따졌다.","were picked","The apples were picked by the farmers.","그 사과들은 그 농부들에 의해 따졌다.",
  "본책 p.102 POINT 1 ‘수동태의 형태와 의미’ 위쪽 화살표 그림(The apples were picked by the farmers)을 보세요.","1) ‘따졌다’는 과거 + 수동이에요.  2) 주어 The apples는 복수예요. 과거 복수 be동사와 pick(따다)의 p.p.를 써요.","두 단어: w로 시작하는 4글자 + p로 시작하는 6글자예요.","The apples(복수) 과거 → were picked"],
 ["These operas 3 ___ by Mozart. 이 오페라들은 모차르트에 의해 쓰이지 않았다.","were not written","These operas were not written by Mozart.","이 오페라들은 모차르트에 의해 쓰이지 않았다.",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 부정문 표(be동사 + not + p.p.)를 보세요.","1) 부정이므로 be동사 뒤에 not을 넣어요.  2) 주어 These operas는 복수, 과거예요.  3) ‘쓰이다’의 p.p.는 write의 p.p.예요.","세 단어: were / not / w로 시작하는 7글자 순서예요.","복수 과거 부정 → were not + p.p."],
 ["4 ___ Josh picked for the basketball team? Josh가 농구 팀에 뽑혔니?","Was","Was Josh picked for the basketball team?","Josh가 농구 팀에 뽑혔니?",
  "본책 p.104 POINT 1 ‘부정문과 의문문’의 의문문 표(be동사 + 주어 + p.p. ~?)를 보세요.","1) 문장 맨 앞이 비어 있고, 뒤에 Josh picked가 있어요.  2) 수동태 의문문은 be동사를 주어 앞에 써요. 주어 Josh는 단수이고 과거예요.","W로 시작하는 3글자예요.","수동태 의문문 → be동사 + 주어 + p.p.?"],
 ["My hotel room 5 ___ every day. 내 호텔 방은 매일 청소된다.","is cleaned","My hotel room is cleaned every day.","내 호텔 방은 매일 청소된다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 현재시제 줄(am/are/is + p.p.)을 보세요.","1) every day(매일)는 현재시제 신호예요.  2) 호텔 방은 ‘청소되는’ 쪽이에요. 주어 My hotel room은 단수예요.","두 단어: is + c로 시작하는 7글자(clean의 p.p.)예요.","every day(매일) + 단수 → is cleaned"],
 ["This picture 6 ___ ten years ago. 이 사진은 십 년 전에 찍혔다.","was taken","This picture was taken ten years ago.","이 사진은 십 년 전에 찍혔다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 과거시제 줄(was/were + p.p.)을 보세요.","1) ten years ago(십 년 전)는 과거 신호예요.  2) 사진은 ‘찍히는’ 쪽이에요. This picture는 단수예요.  3) take(찍다)의 p.p.를 써요.","두 단어: w로 시작하는 3글자 + t로 시작하는 5글자예요. (take-took-taken)","과거 단수 수동 → was + p.p."],
 ["These cars 7 ___ by the mechanic tomorrow. 이 차들은 정비공에 의해 내일 수리될 것이다.","will be fixed","These cars will be fixed by the mechanic tomorrow.","이 차들은 정비공에 의해 내일 수리될 것이다.",
  "본책 p.102 POINT 2 ‘수동태의 시제’ 표의 미래시제 줄(will + be + p.p.)을 보세요.","1) tomorrow(내일)는 미래 신호예요.  2) 차들은 ‘수리되는’ 쪽이라 수동태예요.  3) 미래 수동태 공식에 fix(고치다)의 p.p.를 넣어요.","세 단어: will / b로 시작하는 2글자 / f로 시작하는 5글자예요.","tomorrow + 수동 → will be fixed (복수도 will)"]
].forEach((r,i)=>W("GN","G",i+1,"문법정리노트의 빈칸에 알맞은 말을 쓰시오. (p.114)<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));

// ===== UNIT 01 QUIZ (p.116) =====
C(1,"Q",1,"A Where’s your backpack?<br>B I put ___ in my locker.",["it","one","another"],"it","A Where’s your backpack? B I put it in my locker.","A 네 배낭 어디 있어? B 내 사물함에 넣어 놨어.",
 "본책 p.116 POINT 1 ‘one(s)’ 아래의 ‘내신 적중’ 박스를 읽어 보세요.",
 "1) A가 ‘네 배낭’이라고 콕 집어서 물었어요.  2) B가 사물함에 넣은 것도 바로 그 배낭이에요. ‘바로 그것’인지, ‘같은 종류의 다른 것’인지 생각해 봐요.",
 "앞에서 말한 ‘동일한 특정 대상’을 가리키는 말이에요. i로 시작하는 두 글자예요.",
 "앞에서 말한 바로 그것 = it (one은 같은 종류의 다른 것)");
// ===== UNIT 01 연습문제 (p.117) =====
C(1,"A",1,"Would you like to have (other / another) piece of cake?",["other","another"],"another","Would you like to have another piece of cake?","케이크 한 조각 더 드시겠어요?",
 "본책 p.116 POINT 2 ‘other, another’ 아래 ● 설명(other 뒤와 another 뒤에 오는 명사)을 보세요.",
 "1) 빈칸 뒤의 piece(조각)는 하나, 즉 단수 명사예요.  2) 단수 명사 앞에는 ‘또 하나의’라는 뜻의 말을 쓰고, 복수 명사 앞에는 other를 써요.",
 "an과 other가 합쳐진 말이에요. a로 시작하는 일곱 글자예요.",
 "another + 단수 명사 (또 하나의 ~)");
C(1,"A",2,"Besides watching movies, what (other / another) hobbies do you have?",["other","another"],"other","Besides watching movies, what other hobbies do you have?","영화 보는 것 말고, 다른 취미는 무엇이 있나요?",
 "본책 p.116 POINT 2 ‘other, another’ 아래 「other + 복수 명사」 예문(many other things)을 보세요.",
 "1) 빈칸 뒤의 hobbies는 -s가 붙은 복수 명사예요.  2) 복수 명사 앞에는 ‘다른 ~’이라는 뜻의 말을 써요. 단수 명사 앞에만 쓰는 말은 안 돼요.",
 "an이 붙지 않은 짧은 쪽이에요. o로 시작하는 다섯 글자예요.",
 "other + 복수 명사 (다른 ~들)");
C(1,"A",3,"This room is too small. I want (other / another) room.",["other","another"],"another","This room is too small. I want another room.","이 방은 너무 작아요. 나는 다른 방을 원해요.",
 "본책 p.116 POINT 2 ‘other, another’의 another 설명과 「another + 단수 명사」 예문을 보세요.",
 "1) room 앞에 a나 s가 없으니 단수 명사예요.  2) 지금 방이 작으니 ‘또 하나의 방’을 원하는 거예요. 단수 명사 앞에 오는 쪽을 골라요.",
 "other 앞에 an이 붙은 형태예요. 일곱 글자예요.",
 "another room = 또 하나의 방 (단수 명사 앞)");
C(1,"A",4,"There are three roses. One is red, and (the other / the others) are white.",["the other","the others"],"the others","There are three roses. One is red, and the others are white.","장미가 세 송이 있다. 한 송이는 빨갛고, 나머지는 하얗다.",
 "본책 p.116 POINT 3 ‘부정대명사 구문’ 표에서 ‘one ~ the others’ 줄을 보세요.",
 "1) 장미는 모두 세 송이예요.  2) 하나(One)를 빼면 남는 장미는 몇 송이일까요? 뒤에 are(원형 be: ~이다)가 있으니 복수예요.",
 "남은 둘 전부를 가리키는 말이에요. 끝에 s가 붙어요.",
 "one ~ the others (여럿 중 하나 / 나머지 전부)");
C(1,"B",1,"I’ve lost my cell phone. I need a new ___.",["one","ones","it","them"],"one","I’ve lost my cell phone. I need a new one.","나는 휴대폰을 잃어버렸다. 나는 새것이 하나 필요하다.",
 "본책 p.116 POINT 1 ‘one(s)’의 첫 예문 My dad’s car is old... a new one을 보세요.",
 "1) 잃어버린 그 휴대폰을 찾겠다는 게 아니에요. ‘새 휴대폰 하나’가 필요하다는 거예요.  2) 같은 종류의 아무 것이니 ‘특정한 그것’이 아니에요. 단수예요.",
 "a new 뒤에 오는 말로, o로 시작하는 세 글자예요.",
 "a new + one (같은 종류의 아무거나 하나)");
C(1,"B",2,"I bought this T-shirt yesterday because ___ was so cheap.",["one","ones","it","them"],"it","I bought this T-shirt yesterday because it was so cheap.","나는 어제 이 티셔츠를 샀는데, 그것이 아주 쌌기 때문이다.",
 "본책 p.116 POINT 1 아래 ‘내신 적중’ 박스(it이나 them)를 보세요.",
 "1) 싼 것은 ‘이 티셔츠’, 즉 앞에서 말한 바로 그 티셔츠예요.  2) 그 하나를 다시 가리키니 특정한 대상이고, 단수예요.",
 "i로 시작하는 두 글자예요. 복수형 them은 아니에요.",
 "특정한 하나를 다시 말할 땐 it (복수는 them)");
C(1,"B",3,"Can I exchange these blue gloves for black ___?",["one","ones","it","them"],"ones","Can I exchange these blue gloves for black ones?","이 파란 장갑을 검은 것으로 교환할 수 있나요?",
 "본책 p.116 POINT 1 ‘one(s)’의 두 번째 예문 the red ones(= shoes)를 보세요.",
 "1) 바꾸고 싶은 것은 ‘검은 장갑’인데, 그 장갑은 어떤 특정한 것이 아니에요.  2) gloves(장갑)는 복수니까 대신하는 말도 복수여야 해요.",
 "o로 시작하고 끝에 s가 붙는 네 글자예요.",
 "복수 명사를 대신하는 불특정 대명사 = ones");
C(1,"B",4,"These shoes are too small now. I can’t wear ___ anymore.",["one","ones","it","them"],"them","These shoes are too small now. I can’t wear them anymore.","이 신발은 이제 너무 작다. 나는 더 이상 그것들을 신을 수 없다.",
 "본책 p.116 POINT 1 아래 ‘내신 적중’ 박스(동일한 특정 대상은 it이나 them)를 보세요.",
 "1) 신을 수 없는 것은 ‘지금 이 신발’, 바로 그 신발이에요.  2) 신발(shoes)은 복수이고 특정한 대상이니, 그에 맞는 말을 골라요.",
 "t로 시작하는 네 글자예요. it의 복수형 같은 말이에요.",
 "특정한 복수 대상은 them (불특정은 ones)");
W(1,"C",1,"This red dress is pretty, but I’m going to buy this blue <u>ones</u>.","one","This red dress is pretty, but I’m going to buy this blue one.","이 빨간 드레스는 예쁘지만, 나는 이 파란 것을 살 거예요.",
 "본책 p.116 POINT 1 ‘one(s)’의 설명(앞에 나온 명사와 같은 종류)을 보세요.",
 "1) this blue ones의 this는 ‘이 하나’를 가리켜요. this 뒤에는 단수가 와야 해요.  2) ones는 복수 형태이니 단수로 바꿔야 해요.",
 "ones에서 끝의 s 한 글자만 빼요.",
 "this/a + 단수 → one (복수일 때만 ones)");
W(1,"C",2,"Don’t tell <u>another</u> people your password.","other","Don’t tell other people your password.","다른 사람들에게 네 비밀번호를 말하지 마.",
 "본책 p.116 POINT 2 ‘other, another’ 아래 ● 설명을 보세요.",
 "1) another 뒤에는 단수 명사가 와요.  2) 그런데 people(사람들)은 복수예요. 복수 명사 앞에 쓰는 말로 바꿔 줘야 해요.",
 "another에서 an을 빼면 돼요. o로 시작하는 다섯 글자예요.",
 "other + 복수 명사 / another + 단수 명사");
W(1,"C",3,"He has two daughters. One is two and <u>the others</u> is five.","the other","He has two daughters. One is two and the other is five.","그는 딸이 둘 있다. 한 명은 두 살이고, 다른 한 명은 다섯 살이다.",
 "본책 p.116 POINT 3 ‘부정대명사 구문’ 표의 ‘one ~ the other’ 줄을 보세요.",
 "1) 딸은 모두 몇 명인가요? 한 명(One)을 빼면 남는 사람은 몇 명일까요?  2) 뒤에 is(원형 be: ~이다)가 있으니 단수를 가리키는 말이어야 해요.",
 "the others에서 s 하나만 빼면 돼요.",
 "둘 중 하나는 one, 나머지 하나는 the other");
W(1,"C",4,"Can I borrow your umbrella? I’ll return <u>one</u> tomorrow.","it","Can I borrow your umbrella? I’ll return it tomorrow.","네 우산을 빌려도 될까? 내일 돌려줄게.",
 "본책 p.116 POINT 1 아래 ‘내신 적중’ 박스(동일한 특정 대상 = it)를 보세요.",
 "1) 내일 돌려줄 것은 ‘지금 빌리는 그 우산’이에요.  2) 같은 종류의 다른 우산이 아니라 바로 그 우산이니, 특정 대상을 가리키는 말이 필요해요.",
 "i로 시작하는 두 글자예요.",
 "빌린 바로 그 물건은 one이 아니라 it");
W(1,"C",5,"A Is there an ATM around here?<br>B Yes, there is <u>it</u> on the corner.","one","A Is there an ATM around here? B Yes, there is one on the corner.","A 이 근처에 ATM이 있나요? B 네, 모퉁이에 하나 있어요.",
 "본책 p.116 POINT 1 ‘one(s)’의 설명(불특정한 사물)과 아래 ‘내신 적중’ 박스를 비교해 보세요.",
 "1) A는 an ATM, 즉 ‘아무 ATM이든 하나’가 있는지 물었어요.  2) 정해진 특정 기계가 아니라 같은 종류의 불특정한 하나예요. there is 뒤에서 처음 소개하는 말이기도 해요.",
 "o로 시작하는 세 글자예요. 단수예요.",
 "an + 명사를 받을 땐 one (처음 소개하는 불특정)");
W(1,"D",1,"나는 두 마리의 반려동물이 있다. 하나는 앵무새이고, 다른 하나는 이구아나이다.<br>I have two pets. ___ is a parrot, and ___ is an iguana.","One, the other","I have two pets. One is a parrot, and the other is an iguana.","나는 반려동물이 두 마리 있다. 한 마리는 앵무새이고, 다른 한 마리는 이구아나이다.",
 "본책 p.116 POINT 3 ‘부정대명사 구문’ 표 맨 위 줄(둘 중 하나는 ~, 나머지 하나는 …)을 보세요.",
 "1) 반려동물은 딱 두 마리예요.  2) 첫 칸은 ‘하나는’, 둘째 칸은 ‘남은 하나는’이에요. 둘뿐이니 나머지는 정해져 있어요.",
 "첫 칸은 O로 시작하는 세 글자, 둘째 칸은 the로 시작해요.",
 "둘 중 one ~ the other (나머지 하나)");
W(1,"D",2,"몇몇 사람들은 초밥을 좋아하는 반면에, 다른 몇몇 사람들은 싫어한다.<br>___ people like sushi, while ___ hate it.","Some, others","Some people like sushi, while others hate it.","어떤 사람들은 초밥을 좋아하는 반면, 다른 어떤 사람들은 싫어한다.",
 "본책 p.116 POINT 3 ‘부정대명사 구문’ 표의 ‘some ~ others’ 줄을 보세요.",
 "1) ‘몇몇 사람들’이 먼저 나오고, ‘다른 몇몇’이 뒤에 나와요.  2) 나머지 전부가 아니라 ‘일부의 다른 사람들’이에요. 뒤의 동사 hate(싫어하다)에 -s가 없으니 복수 주어예요.",
 "첫 칸은 S로 시작하는 네 글자, 둘째 칸은 o로 시작해 s로 끝나요.",
 "some ~ others (몇몇은 ~, 다른 몇몇은 …)");
W(1,"D",3,"남자 형제 셋 중, 한 명은 결혼했고 나머지 전부는 결혼하지 않았다.<br>Of the three brothers, ___ is married and ___ are not.","one, the others","Of the three brothers, one is married and the others are not.","세 형제 중 한 명은 결혼했고, 나머지는 결혼하지 않았다.",
 "본책 p.116 POINT 3 ‘부정대명사 구문’ 표의 ‘one ~ the others’ 줄을 보세요.",
 "1) 형제는 셋이고, 한 명(is married)을 빼면 두 명이 남아요.  2) 남은 사람 ‘전부’를 가리키고 뒤의 are(원형 be: ~이다)도 복수예요.",
 "첫 칸은 o로 시작하는 세 글자, 둘째 칸은 the로 시작하고 끝에 s가 있어요.",
 "여럿 중 one ~ the others (나머지 전부)");
W(1,"D",4,"반 친구들 중 몇몇은 내 아이디어를 지지하지만, 나머지 전부는 그렇지 않다.<br>___ of my classmates support my idea, but ___ don’t.","Some, the others","Some of my classmates support my idea, but the others don’t.","반 친구들 중 몇몇은 내 아이디어를 지지하지만, 나머지는 지지하지 않는다.",

W(1,"D",5,"반에 세 명의 학생이 있다. 한 명은 한국인이고, 또 다른 한 명은 일본인이고, 나머지 한 명은 미국인이다.<br>There are three students in the class. ___ is Korean, ___ is Japanese, and ___ is American.","One, another, the other[third]","There are three students in the class. One is Korean, another is Japanese, and the other[third] is American.","반에는 학생이 세 명 있다. 한 명은 한국인이고, 또 다른 한 명은 일본인이고, 나머지 한 명은 미국인이다.",
 "본책 p.116 POINT 3 표 아래 ● 설명(셋 중 하나는 one, 또 다른 하나는 another…)을 보세요.",
 "1) 모두 세 명이에요. 순서대로 ‘하나 → 또 다른 하나 → 나머지 하나’를 말해요.  2) 첫째는 One이고, 마지막은 남은 한 명이니 the를 붙여요.",
 "가운데 칸은 a로 시작하는 일곱 글자예요. 마지막 칸은 the other 또는 the third예요.",
 "셋 중 one ~ another ~ the other[third]");

W("SW","A",9,"(밑줄 친 부분이 어법상 옳으면 O, 틀리면 바르게 고치시오.)<br><u>All them</u> participated in the campaign.","All of them","All of them participated in the campaign.","그들 모두가 그 캠페인에 참여했다.",

W("SW","A",10,"(밑줄 친 부분이 어법상 옳으면 O, 틀리면 바르게 고치시오.)<br>There are two dessert options. One is cheesecake, and <u>the others</u> is blueberry sorbet.","the other","There are two dessert options. One is cheesecake, and the other is blueberry sorbet.","디저트 선택지가 두 가지 있다. 하나는 치즈케이크이고, 다른 하나는 블루베리 셔벗이다.",

W("SW","B",2,"졸업식에서 Lucy와 나는 서로 끌어안았다. (graduation / other / at / hugged / each / the / ceremony)<br>Lucy and I ___.","hugged each other at the graduation ceremony","Lucy and I hugged each other at the graduation ceremony.","졸업식에서 Lucy와 나는 서로를 껴안았다.",
 "본책 p.118 POINT 2 ‘each, every’ 아래 ● each other 설명을 보세요.",
 "1) 주어 Lucy and I 뒤에 동사 hugged(원형 hug: 껴안다)를 놓아요.  2) ‘서로’는 each other, ‘졸업식에서’는 at the graduation ceremony예요.",

W("SW","B",3,"Jessica는 매우 똑똑하다. 그녀는 시험에서 어떤 실수도 하지 않는다. (makes / never / mistakes / any)<br>Jessica is so smart. She ___ on her tests.","never makes any mistakes","Jessica is so smart. She never makes any mistakes on her tests.","Jessica는 매우 똑똑하다. 그녀는 시험에서 어떤 실수도 하지 않는다.",
 "본책 p.118 POINT 1 ‘some, any’ 표의 any 칸(부정문)을 보세요.",
 "1) never(결코 ~않다)가 들어 있어 부정의 뜻이에요. never는 보통 동사 makes(원형 make: 만들다, 저지르다) 앞에 와요.  2) ‘어떤 실수도’는 any + 복수 명사로 만들어요.",
 "네 단어예요. never 다음에 m으로 시작하는 동사(3인칭 단수형), 그다음 any, 마지막은 m으로 시작하는 복수 명사예요.",
 "never는 동사 앞, 부정의 뜻엔 any",["makes","never","mistakes","any"]);
W("SW","B",4,"그 사고에 대해 듣고 모두가 놀랐다. (surprised / all / hear / were / to)<br>___ about the accident.","All were surprised to hear","All were surprised to hear about the accident.","그 사고에 대해 듣고 모두가 놀랐다.",
 "본책 p.118 POINT 3 ‘both, all’ 아래 ● all이 대명사로 쓰일 때(사람이면 복수 취급)를 보세요.",
 "1) ‘모두가’는 All이에요. 사람을 가리키는 대명사 all은 복수로 받아요.  2) ‘놀랐다’는 were surprised(be + p.p.)이고, ‘듣고’는 to hear(감정의 원인)로 이어요.",

W("SW","B",5,"나는 두 명의 남동생이 있다. 그들은 둘 다 안경을 쓴다. (wear / both / glasses / them / of)<br>I have two brothers. ___.","Both of them wear glasses","I have two brothers. Both of them wear glasses.","나는 남동생이 두 명 있다. 그들은 둘 다 안경을 쓴다.",
 "본책 p.118 POINT 3 ‘both, all’ 아래 ● 「both of + 대명사」 설명을 보세요.",

 "Both of them으로 시작하고 wear glasses로 끝나요.",

 "pulled the boat로 시작하고 toward themselves로 끝나요.",

 "본책 p.120 POINT 4 ‘재귀대명사를 포함한 관용 표현’ 표의 by oneself 줄을 보세요.",

W("SW","C",1,"(표: midterm exam 통과 — Zack ◯, Hannah ◯, Clay X / English essay 제출 — 셋 다 ◯ / final project 완료 — Zack X, Hannah ◯, Clay ◯)<br>보기: both of / all of<br>Only Zack and Hannah: ___ (표 내용을 문장으로 쓰세요)","Both of them passed the midterm exam.","Both of them passed the midterm exam.","Zack과 Hannah 둘 다 중간고사에 통과했다.",

 "1) 표의 첫 줄(passed the midterm exam)에서 ◯인 사람은 몇 명인가요?  2) ‘둘만’이라면 both of, ‘셋 모두’라면 all of를 쓰고, of 뒤에는 대명사 them을 붙여요.",

 "본책 p.118 POINT 3 ‘both, all’ 표와 ● 「both of + 대명사」를 보세요.",
 "1) 표의 셋째 줄(completed the final project)에서 ◯는 Hannah와 Clay 두 명이에요.  2) 두 명이니 both와 all 중 어느 쪽인지 정하고, 대명사 them 앞에 of를 붙여요.",
 "첫 단어는 B로 시작하는 ‘둘 다’이고, 뒤에 of와 대명사가 와요.",

W("SW","C",3,"(표: midterm exam 통과 — Zack ◯, Hannah ◯, Clay X / English essay 제출 — 셋 다 ◯ / final project 완료 — Zack X, Hannah ◯, Clay ◯)<br>보기: both of / all of<br>Zack, Hannah, and Clay: ___ (표 내용을 문장으로 쓰세요)","All of them submitted the English essay.","All of them submitted the English essay.","Zack, Hannah, Clay 모두 영어 에세이를 제출했다.",
 "본책 p.118 POINT 3 ‘both, all’ 표와 ● 「all of + 대명사」를 보세요.",
 "1) 표의 둘째 줄(submitted the English essay)은 셋 모두 ◯예요.  2) 셋 이상이면 both가 아니라 ‘모두’라는 뜻의 말이고, 대명사 them 앞에 of를 붙여요.",
 "첫 단어는 A로 시작하는 ‘모두’이고, 뒤에 of와 대명사가 와요.",

 "본책 p.116 POINT 2 ‘other, another’의 others(다른 사람들) 설명을 보세요.",
 "1) meeting(원형 meet: 만나다) 뒤에 ‘다른 사람들’이 와야 해요.  2) another는 ‘또 하나’라는 단수예요. 여러 사람을 가리키는 말로 바꿔야 해요.",
 "the로 시작하는 두 단어예요. 뒤 단어는 o로 시작해서 s로 끝나는 여섯 글자예요.",
 "another(단수) → the others(여러 명)");
W("SW","D",2,"(밑줄 친 곳을 바르게 고치시오.)<br>A How was the ski camp?<br>B It was great. Before arriving at the camp, I was worried about meeting another. Luckily, I made a lot of new friends and ended up enjoying <u>herself</u>.<br>A I’m glad to hear that. It sounds like you had a lot of fun.<br>B Yeah. All the activities was really fun. You should try ski camp yourselves. I’m sure you’ll like it.<br>A Okay. I’ll give it a try.","myself","Luckily, I made a lot of new friends and ended up enjoying myself.","다행히 나는 새 친구를 많이 사귀었고 결국 즐거운 시간을 보냈다.",
 "본책 p.120 POINT 2 ‘재귀 용법’ 아래 ● enjoy 설명을 보세요.",
 "1) enjoying(원형 enjoy: 즐기다) 뒤에 재귀대명사가 왔어요.  2) 이 문장의 주어는 I(말하는 B)예요. 주어에 맞는 재귀대명사인지 확인해요.",
 "m으로 시작하는 여섯 글자예요. 1인칭 단수형이에요.",
 "enjoy oneself, oneself는 주어에 맞게 (I → myself)");
W("SW","D",3,"(밑줄 친 곳을 바르게 고치시오.)<br>A How was the ski camp?<br>B It was great. Before arriving at the camp, I was worried about meeting another. Luckily, I made a lot of new friends and ended up enjoying herself.<br>A I’m glad to hear that. It sounds like you had a lot of fun.<br>B Yeah. All the <u>activities was</u> really fun. You should try ski camp yourselves. I’m sure you’ll like it.<br>A Okay. I’ll give it a try.","were","All the activities were really fun.","모든 활동이 정말 재미있었다.",
 "본책 p.118 POINT 3 ‘both, all’ 표의 all (of) + 복수 명사 칸을 보세요.",
 "1) All 뒤에 the activities(복수 명사)가 와요.  2) 복수 명사가 오면 복수 취급하니, 동사 was(원형 be: ~이다)가 맞는지 확인해요.",
 "was 대신 복수 주어에 쓰는 be동사의 과거형이에요. w로 시작하는 네 글자예요.",
 "all + 복수 명사 → 복수 취급 (was → were)");
W("SW","D",4,"(밑줄 친 곳을 바르게 고치시오.)<br>A How was the ski camp?<br>B It was great. Before arriving at the camp, I was worried about meeting another. Luckily, I made a lot of new friends and ended up enjoying herself.<br>A I’m glad to hear that. It sounds like you had a lot of fun.<br>B Yeah. All the activities was really fun. You should try ski camp <u>yourselves</u>. I’m sure you’ll like it.<br>A Okay. I’ll give it a try.","yourself","You should try ski camp yourself.","너는 스키 캠프를 직접 가 봐야 해.",
 "본책 p.120 POINT 1 재귀대명사 표의 2인칭 단수·복수 칸을 보세요.",
 "1) 이 말을 듣는 사람은 A 한 명이에요.  2) 한 명에게 말하는 You는 단수예요. 재귀대명사도 단수형(-self)이어야 해요.",
