 of the women was known to the world before the book Code Girls was published.","ko":"그 여성들의 이야기는 《코드 걸스》라는 책이 출간되기 전에 세상에 알려져 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Not until the book called Code Girls was published did their story become known to the world.","《코드 걸스》라는 책이 출간되고 나서야 비로소 그들의 이야기가 세상에 알려졌다."]],"w":"10번 문장 Not until … was published did their story become known는 책이 나오고 나서야 알려졌다는 뜻. 책이 나오기 전에 알려졌다는 말과 반대.","c":"F"},"h":"9e5569332a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...the military started recruiting women.)","ko":"... 군은 여성들을 모집하기 시작했다.","opts":["해고하다","숨기다","모집하다","칭찬하다"],"word":"recruiting","r":{"a":"3) 모집하다","ev":"5번 문장","s":[[5,"Many men were away fighting, so the military started recruiting women.","많은 남성들이 전투를 하러 멀리 나가 있었기 때문에, 군은 여성들을 모집하기 시작했다."]],"w":"5번 문장은 남성들이 전쟁터에 가서 일할 사람이 부족하자 여성들을 불러 모은 상황이라 recruit = 모집하다. 6번에서 여성들이 육군과 해군에 들어간 것과 이어짐.","c":3},"h":"d35e9a8f75"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...they are remembered as brave and brilliant women...)","ko":"... 그들은 용감하고 뛰어난 여성들로 기억된다.","opts":["평범한","뛰어난","게으른","수줍은"],"word":"brilliant","r":{"a":"2) 뛰어난","ev":"11번 문장","s":[[11,"Today, they are remembered as brave and brilliant women who helped win the war in silence.","오늘날 그들은 조용히 전쟁을 승리로 이끄는 데 도움을 준 용감하고 뛰어난 여성들로 기억된다."]],"w":"brave(용감한)와 함께 쓰여 칭찬하는 말이고, 암호를 풀어 전쟁을 승리로 이끈 사람들이니 brilliant = 뛰어난, 훌륭한. 평범한이나 게으른은 반대 뜻.","c":2},"h":"ca3835a78e"},{"n":6,"t":"ref","q":"What does the underlined \"These efforts\" refer to?\nThese efforts saved thousands of lives in the Pacific…","ko":"밑줄 친 These efforts가 가리키는 것은?","sko":"이런 노력은 태평양에서 수천 명의 목숨을 구했다…","opts":["남성들이 전투에 나가 싸운 일","여성들에게 편지를 보낸 일","미군이 일본을 공격한 일","여성들이 암호를 풀고 적을 속인 일"],"r":{"a":"4) 여성들이 암호를 풀고 적을 속인 일","ev":"7~9번 문장","s":[[7,"They listened to enemy radio messages and looked for repeated symbols and secret clues.","그들은 적의 무전 메시지를 듣고 반복되는 기호와 비밀 단서를 찾았다."],[8,"They even helped create false messages to trick the enemy.","그들은 심지어 적을 속이기 위한 가짜 메시지를 만드는 것을 돕기도 했다."],[9,"These efforts saved thousands of lives in the Pacific and, according to some historians, may have shortened the war by about two years.","이런 노력은 태평양에서 수천 명의 목숨을 구했고, 일부 역사학자들에 따르면 전쟁을 약 2년 단축시켰을 수도 있다."]],"w":"9번 These efforts는 바로 앞 7~8번에서 여성들이 한 일(무전 듣기, 기호·단서 찾기, 가짜 메시지 만들기)을 가리킴. 남성들의 전투나 편지는 9번의 결과와 이어지지 않음.","c":4},"h":"0c20450141"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"During World War II, many women in the U.S. got a strange letter.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"제2차 세계대전 중, 미국의 많은 여성들이 이상한 편지를 받았다.","opts":["전쟁이 끝난 뒤 여성들이 편지를 썼다.","미국의 남성들이 이상한 편지를 받았다.","전쟁 중에 미국의 많은 여성에게 평소와 다른 편지가 도착했다.","여성들이 편지를 받기 싫어해서 전쟁이 일어났다."],"r":{"a":"3) 전쟁 중에 미국의 많은 여성에게 평소와 다른 편지가 도착했다.","ev":"1번 문장","s":[[1,"During World War II, many women in the U.S. got a strange letter.","제2차 세계대전 중, 미국의 많은 여성들이 이상한 편지를 받았다."]],"w":"got a strange letter는 '이상한 편지를 받았다'는 뜻이에요. 1번은 제2차 세계대전 중에 미국의 많은 여성이 이상한 편지를 받았다는 내용이에요.","c":3},"h":"d299549cce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["미군은 적의 암호를 푸는 데 도움이 필요했다.","남성들이 집에 너무 많아서 미군은 여성들을 모집했다.","여성들의 노력은 전쟁을 약 2년 더 길어지게 했다.","여성들의 이야기는 전쟁 직후부터 유명했다."],"opts":["The U.S. military needed help with breaking enemy codes.","The U.S. military recruited women because too many men were at home.","The women’s efforts made the war about two years longer.","The women’s story was famous right after the war."],"r":{"a":"1) The U.S. military needed help with breaking enemy codes. (미군은 적의 암호를 푸는 데 도움이 필요했다.)","ev":"4, 5, 9, 10번 문장","s":[[4,"At that time, the U.S. military needed help with breaking enemy codes.","그 무렵 미군은 적의 암호를 푸는 데 도움이 필요했다."],[5,"Many men were away fighting, so the military started recruiting women.","많은 남성들이 전투를 하러 멀리 나가 있었기 때문에, 군은 여성들을 모집하기 시작했다."],[9,"These efforts saved thousands of lives in the Pacific and, according to some historians, may have shortened the war by about two years.","이런 노력은 태평양에서 수천 명의 목숨을 구했고, 일부 역사학자들에 따르면 전쟁을 약 2년 단축시켰을 수도 있다."],[10,"Not until the book called Code Girls was published did their story become known to the world.","《코드 걸스》라는 책이 출간되고 나서야 비로소 그들의 이야기가 세상에 알려졌다."]],"w":"4번에서 미군은 적의 암호를 푸는 데 도움이 필요했다고 해요. 많은 남성이 전투에 나가 있어서 여성을 모집했고(5번), 노력은 전쟁을 약 2년 단축시켰을 수도 있으며(9번), 이야기는 책이 나온 뒤에야 알려졌어요(10번).","c":1},"h":"860211cdb8"},{"n":9,"t":"sum","q":"The women listened to enemy radio messages and looked for repeated (A), and they even helped create (B) messages to trick the enemy.","ko":"여성들은 적의 무전 메시지를 듣고 반복되는 (A)를 찾았고, 적을 속이기 위한 (B) 메시지를 만드는 것을 돕기도 했다.","oko":["(A) 지도 / (B) 진짜","(A) 기호 / (B) 진짜","(A) 기호 / (B) 가짜","(A) 지도 / (B) 가짜","(A) 숫자 / (B) 실제"],"opts":["(A) maps / (B) true","(A) symbols / (B) true","(A) symbols / (B) false","(A) maps / (B) false","(A) numbers / (B) real"],"r":{"a":"3) (A) symbols / (B) false","ev":"7~8번 문장","s":[[7,"They listened to enemy radio messages and looked for repeated symbols and secret clues.","그들은 적의 무전 메시지를 듣고 반복되는 기호와 비밀 단서를 찾았다."],[8,"They even helped create false messages to trick the enemy.","그들은 심지어 적을 속이기 위한 가짜 메시지를 만드는 것을 돕기도 했다."]],"w":"7번 문장에서 repeated symbols(반복되는 기호)를 찾았고, 8번 문장에서 적을 속이려고 false messages(가짜 메시지)를 만드는 것을 도왔음. 진짜(true, real) 메시지로는 적을 속일 수 없고, 지도는 본문에 없음.","c":3},"h":"69d3c78e48"},{"n":10,"t":"fill","q":"Those who said “yes” were [A] to a secret [B].","ko":"‘그렇다’고 답한 사람들은 비밀 [B]에 [A].","bank":["invited","job","women","codes","messages","radios"],"bko":{"invited":"초대되었다(invite의 과거분사)","job":"업무, 일","women":"여성들","codes":"암호들","messages":"메시지들","radios":"무전기들"},"r":{"a":"[A] invited (초대되었다(invite의 과거분사)), [B] job (업무, 일)","ev":"3번 문장","s":[[3,"Those who said “yes” were invited to a secret job.","‘그렇다’고 답한 사람들은 비밀 업무에 초대되었다."]],"w":"3번에서 ‘그렇다’고 답한 사람들은 비밀 업무(job)에 초대되었다(invited)고 해요. were 뒤에는 과거분사가, a secret 뒤에는 단수 명사가 와야 해요.","c":null},"h":"9c59e06ef3"}]},{"u":10,"id":"b3-10-2","no":2,"ko":"보스턴 거리를 덮친 끈적끈적한 파도의 정체는?","items":[{"n":1,"t":"tf","q":"The molasses tank exploded at 12:40 p.m. on January 15.","ko":"당밀 탱크는 1월 15일 오후 12시 40분에 폭발했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"At 12:40 p.m. on January 15, the tank exploded!","1월 15일 오후 12시 40분, 탱크가 폭발했다!"]],"w":"6번 문장에 At 12:40 p.m. on January 15, the tank exploded!가 나옴. 본문과 일치.","c":"T"},"h":"be2418a2c1"},{"n":2,"t":"tf","q":"The company that owned the tank fixed the problem when it heard strange noises.","ko":"탱크를 소유한 회사는 이상한 소리를 들었을 때 문제를 고쳤다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The tank began to produce strange noises, but the company that owned it ignored these danger signs.","탱크가 이상한 소리를 내기 시작했지만, 그것을 소유한 회사는 이런 위험 신호를 무시했다."]],"w":"5번 문장에서 회사는 이런 위험 신호를 무시했다(ignored)고 함. 문제를 고쳤다는 말과 반대.","c":"F"},"h":"80cb445bb2"},{"n":3,"t":"tf","q":"The disaster killed 150 people and injured 21.","ko":"그 참사로 150명이 죽고 21명이 다쳤다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Unfortunately, the disaster killed 21 people and injured 150.","안타깝게도, 이 참사로 21명이 죽고 150명이 다쳤다."]],"w":"10번 문장에서 21명이 죽고 150명이 다쳤다고 함. 숫자가 서로 바뀌어 있어서 본문과 다름.","c":"F"},"h":"9d988c6655"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The 4.5-meter-high wave trapped horses and people...)","ko":"높이 4.5미터의 파도가 말과 사람들을 가두었고...","opts":["구했다","도왔다","가두었다","따라갔다"],"word":"trapped","r":{"a":"3) 가두었다","ev":"9번 문장","s":[[9,"The 4.5-meter-high wave trapped horses and people, and fire even broke out in the city.","높이 4.5미터의 파도가 말과 사람들을 가두었고, 도시에는 화재까지 발생했다."]],"w":"9번 문장은 거대한 당밀 파도가 말과 사람들을 꼼짝 못 하게 덮친 상황이라 trap = 가두다. 바로 뒤 10~11번에서 피해와 구조가 어려웠다는 내용과 이어짐.","c":3},"h":"bd7b483994"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the company that owned it ignored these danger signs.)","ko":"... 그것을 소유한 회사는 이런 위험 신호를 무시했다.","opts":["알아차렸다","고쳤다","설명했다","무시했다"],"word":"ignored","r":{"a":"4) 무시했다","ev":"5번 문장","s":[[5,"The tank began to produce strange noises, but the company that owned it ignored these danger signs.","탱크가 이상한 소리를 내기 시작했지만, 그것을 소유한 회사는 이런 위험 신호를 무시했다."]],"w":"5번 문장은 탱크가 이상한 소리를 내는데도 회사가 신경 쓰지 않은 상황이고, 이어서 폭발(6번)이 일어남. ignore = 무시하다.","c":4},"h":"87ec3a6c28"},{"n":6,"t":"ref","q":"What does the underlined \"This heat\" refer to?\nThis heat caused the sugary molasses to break down and create a lot of gas.","ko":"밑줄 친 This heat가 가리키는 것은?","sko":"이 열기 때문에 달콤한 당밀이 분해되어 많은 가스가 생겨났다.","opts":["날씨가 갑자기 이례적으로 따뜻해진 것","탱크 안에 가스가 가득 찬 것","탱크가 폭발한 것","도시에 화재가 발생한 것"],"r":{"a":"1) 날씨가 갑자기 이례적으로 따뜻해진 것","ev":"2~3번 문장","s":[[2,"In January 1919, the weather suddenly became unusually warm.","1919년 1월, 날씨가 갑자기 이례적으로 따뜻해졌다."],[3,"This heat caused the sugary molasses to break down and create a lot of gas.","이 열기 때문에 달콤한 당밀이 분해되어 많은 가스가 생겨났다."]],"w":"2번에서 날씨가 갑자기 이례적으로 따뜻해졌다고 했고, 3번의 This heat가 그 따뜻해진 날씨를 가리켜요. 그 열기 때문에 당밀이 분해돼 가스가 생겼어요.","c":1,"k":"This heat = 날씨가 갑자기 이례적으로 따뜻해진 것"},"pron":"This heat","h":"0028dd841a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The sticky liquid also made rescue efforts extremely difficult.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"끈적끈적한 액체는 구조 작업도 매우 어렵게 만들었다.","opts":["끈적끈적한 액체 덕분에 구조 작업이 더 빨라졌다.","구조 작업이 시작되기도 전에 액체가 모두 말라 버렸다.","끈적끈적한 액체는 구조 작업과 아무 상관이 없었다.","끈적끈적한 액체 때문에 구조 작업이 매우 힘들어졌다."],"r":{"a":"4) 끈적끈적한 액체 때문에 구조 작업이 매우 힘들어졌다.","ev":"11번 문장","s":[[11,"The sticky liquid also made rescue efforts extremely difficult.","끈적끈적한 액체는 구조 작업도 매우 어렵게 만들었다."]],"w":"made A difficult는 ‘A를 어렵게 만들었다’. 끈적끈적한 액체가 구조를 방해했다는 뜻. 빨라졌다거나 말라 버렸다는 말은 본문에 없음.","c":4},"h":"1e87949987"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["탱크는 7월에 폭발했다.","당밀은 시속 56킬로미터로 거리에 쏟아져 나왔다.","탱크는 1919년에 지어졌다.","거리를 청소하는 데는 몇 시간밖에 걸리지 않았다."],"opts":["The tank exploded in July.","The molasses flooded the streets at 56 kilometers per hour.","The tank was built in 1919.","It took only a few hours to clean the streets."],"r":{"a":"2) The molasses flooded the streets at 56 kilometers per hour.","ev":"1, 6, 8, 12번 문장","s":[[1,"Near the harbor in Boston, Massachusetts, a huge tank was built in 1915 to store a sticky liquid known as molasses.","1915년 매사추세츠주 보스턴의 항구 근처에, 당밀이라고 알려진 끈적끈적한 액체를 저장하기 위한 거대한 탱크가 세워졌다."],[6,"At 12:40 p.m. on January 15, the tank exploded!","1월 15일 오후 12시 40분, 탱크가 폭발했다!"],[8,"Over 9,500 tons of molasses flooded the streets at 56 kilometers per hour.","9,500톤이 넘는 당밀이 시속 56킬로미터로 거리에 쏟아져 나왔다."],[12,"It took weeks to clean the streets and repair the damage.","거리를 청소하고 피해를 복구하는 데 몇 주가 걸렸다."]],"w":"8번 문장에 flooded the streets at 56 kilometers per hour가 있어 ②가 정답. ①은 6번에서 1월 15일, ③은 1번에서 1915년, ④는 12번에서 몇 주가 걸렸다고 해 틀림.","c":2},"h":"ba15748e26"},{"n":9,"t":"sum","q":"It took weeks to clean the streets and (A) the damage, and the sweet (B) of molasses stayed in the air.","ko":"거리를 청소하고 피해를 (A)하는 데 몇 주가 걸렸고, 당밀의 달콤한 (B)이(가) 공기 중에 남아 있었다.","oko":["(A) 복구하다 / (B) 맛","(A) 무시하다 / (B) 냄새","(A) 복구하다 / (B) 소리","(A) 무시하다 / (B) 맛","(A) 복구하다 / (B) 냄새"],"opts":["(A) repair / (B) taste","(A) ignore / (B) smell","(A) repair / (B) sound","(A) ignore / (B) taste","(A) repair / (B) smell"],"r":{"a":"5) (A) repair / (B) smell ((A) 복구하다 / (B) 냄새)","ev":"12~13번 문장","s":[[12,"It took weeks to clean the streets and repair the damage.","거리를 청소하고 피해를 복구하는 데 몇 주가 걸렸다."],[13,"For a long time, the sweet smell of molasses stayed in the air.","오랫동안 당밀의 달콤한 냄새가 공기 중에 남아 있었다."]],"w":"12번에서 거리를 청소하고 피해를 복구하는(repair) 데 몇 주가 걸렸고, 13번에서 당밀의 달콤한 냄새(smell)가 오랫동안 공기 중에 남아 있었다고 해요.","c":5},"h":"b3af3a5563"},{"n":10,"t":"fill","q":"The Great Molasses Disaster was [A] Boston’s “sweet [B].”","ko":"‘당밀 대참사’는 [A] 보스턴의 ‘달콤한 [B]’이었다.","bank":["truly","nightmare","exploded","strange","sticky","ignored"],"bko":{"truly":"그야말로","nightmare":"악몽","exploded":"폭발했다","strange":"이상한","sticky":"끈적끈적한","ignored":"무시했다"},"r":{"a":"[A] truly (그야말로), [B] nightmare (악몽)","ev":"14번 문장","s":[[14,"The Great Molasses Disaster was truly Boston’s “sweet nightmare.”","‘당밀 대참사’는 그야말로 보스턴의 ‘달콤한 악몽’이었다."]],"w":"14번에서 당밀 대참사는 그야말로(truly) 보스턴의 ‘달콤한 악몽(nightmare)’이었다고 해요. was 뒤에는 부사가, sweet 뒤에는 명사가 와야 해요.","c":null},"h":"7bc348f471"}]},{"u":10,"id":"b3-10-3","no":3,"ko":"눈 위에 올리는 렌즈, 처음엔 물과 유리로 시작됐다고?","items":[{"n":1,"t":"tf","q":"Leonardo da Vinci realized that water could bend light to help the eye focus.","ko":"레오나르도 다 빈치는 물이 빛을 굴절시켜 눈이 초점을 맞추는 것을 도울 수 있다는 것을 깨달았다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He realized that water could bend light to help the eye focus.","그는 물이 빛을 굴절시켜 눈이 초점을 맞추는 것을 도울 수 있다는 것을 깨달았다."]],"w":"3번 문장에 He realized that water could bend light to help the eye focus가 그대로 나옴. 본문과 일치.","c":"T"},"h":"b6a7085a3d"},{"n":2,"t":"tf","q":"René Descartes’s water-filled device allowed people to blink easily.","ko":"르네 데카르트의 물로 채운 장치는 사람들이 눈을 쉽게 깜박일 수 있게 해 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"But it was never more than an idea because the design didn’t allow people to blink.","하지만 그 설계는 사람들이 눈을 깜박일 수 없게 했기 때문에 아이디어에 불과했을 뿐이었다."]],"w":"8번 문장에서 그 설계는 사람들이 눈을 깜박일 수 없게 해서(didn’t allow people to blink) 아이디어에 그쳤다고 함. 쉽게 깜박일 수 있다는 말과 반대.","c":"F"},"h":"826d6eca72"},{"n":3,"t":"tf","q":"The first contact lenses made by Dr. Adolf Fick were soft and comfortable.","ko":"아돌프 픽 박사가 만든 최초의 콘택트렌즈는 부드럽고 편안했다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"Unfortunately, they were made of heavy glass and covered the entire eye, so they were very uncomfortable.","안타깝게도 그것들은 무거운 유리로 만들어졌고 눈 전체를 덮었기 때문에 매우 불편했다."],[11,"Finally, in the 1900s, plastic helped create soft, comfortable contact lenses.","마침내 1900년대에 플라스틱이 부드럽고 편안한 콘택트렌즈를 만드는 데 도움이 되었다."]],"w":"10번 문장에서 최초의 렌즈는 무거운 유리로 만들어져 매우 불편했다고 함. 부드럽고 편안한 렌즈는 11번에서 1900년대 플라스틱 덕분에 나옴.","c":"F"},"h":"1ac199d5f4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...things that were blurry to his eyes became clear.)","ko":"... 그의 눈에 흐릿했던 것들이 선명해졌다.","opts":["선명한","흐릿한","밝은","거대한"],"word":"blurry","r":{"a":"2) 흐릿한","ev":"2번 문장","s":[[2,"In the 1500s, when Leonardo da Vinci looked through a bowl of water, things that were blurry to his eyes became clear.","1500년대에 레오나르도 다 빈치가 물이 담긴 그릇을 통해 보았을 때, 그의 눈에 흐릿했던 것들이 선명해졌다."]],"w":"2번 문장에서 물 그릇을 통해 보자 ‘blurry’했던 것이 clear(선명한)해졌다고 하니 blurry는 clear의 반대인 흐릿한.","c":2},"h":"b5f488cfc2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...they were very uncomfortable.)","ko":"... 그것들은 매우 불편했다.","opts":["편안한","투명한","불편한","가벼운"],"word":"uncomfortable","r":{"a":"3) 불편한","ev":"10번 문장","s":[[10,"Unfortunately, they were made of heavy glass and covered the entire eye, so they were very uncomfortable.","안타깝게도 그것들은 무거운 유리로 만들어졌고 눈 전체를 덮었기 때문에 매우 불편했다."]],"w":"10번 문장에서 무거운 유리가 눈 전체를 덮었으니 불편했다는 뜻. comfortable(편안한)에 un-이 붙어 반대가 됨. 11번에서 플라스틱 렌즈가 ‘편안하다’고 한 것과 대비.","c":3},"h":"b415800198"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was supposed to sit right on the eye.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 눈 바로 위에 올려놓도록 되어 있었다.","opts":["다 빈치의 아이디어","1888년의 콘택트렌즈","플라스틱 렌즈","물로 채운 망원경 모양의 장치"],"r":{"a":"4) 물로 채운 망원경 모양의 장치","ev":"6~7번 문장","s":[[6,"He designed a telescope-shaped device filled with water.","그는 물로 채운 망원경 모양의 장치를 설계했다."],[7,"It was supposed to sit right on the eye.","그것은 눈 바로 위에 올려놓도록 되어 있었다."]],"w":"7번 It은 바로 앞 6번에서 데카르트가 설계한 물로 채운 망원경 모양의 장치(a telescope-shaped device filled with water). 눈 위에 올려놓는 것은 이 장치.","c":4},"h":"a1ab370030"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This idea would later inspire inventors to use lenses to improve vision.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 생각은 훗날 발명가들이 시력을 개선하기 위해 렌즈를 사용하도록 영감을 주게 된다.","opts":["이 생각 때문에 발명가들은 렌즈 만들기를 포기했다.","이 생각은 나중에 발명가들이 렌즈로 시력을 좋게 하도록 영감을 주었다.","이 생각은 발명가들이 눈을 감고 일하게 만들었다.","이 생각은 오히려 시력이 나빠지는 원인이 되었다."],"r":{"a":"2) 이 생각은 나중에 발명가들이 렌즈로 시력을 좋게 하도록 영감을 주었다.","ev":"4번 문장","s":[[4,"This idea would later inspire inventors to use lenses to improve vision.","이 생각은 훗날 발명가들이 시력을 개선하기 위해 렌즈를 사용하도록 영감을 주게 된다."]],"w":"inspire A to B는 'A가 B하도록 영감을 주다'라는 뜻이에요. improve vision은 '시력을 개선하다'예요. 그래서 발명가들이 렌즈로 시력을 좋게 하도록 영감을 받았다는 뜻이에요.","c":2},"h":"ecd1c8cc17"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["레오나르도 다 빈치가 최초의 콘택트렌즈를 만들었다.","르네 데카르트는 1600년대에 다 빈치의 아이디어를 발전시켰다.","아돌프 픽 박사의 렌즈는 부드러운 플라스틱으로 만들어졌다.","최초의 콘택트렌즈는 1500년대에 만들어졌다."],"opts":["Leonardo da Vinci made the first contact lenses.","René Descartes developed da Vinci’s idea in the 1600s.","Dr. Adolf Fick’s lenses were made of soft plastic.","The first contact lenses were made in the 1500s."],"r":{"a":"2) René Descartes developed da Vinci’s idea in the 1600s. (르네 데카르트는 1600년대에 다 빈치의 아이디어를 발전시켰다.)","ev":"5, 9번 문장","s":[[5,"In the 1600s, René Descartes developed da Vinci’s idea.","1600년대에 르네 데카르트가 다 빈치의 아이디어를 발전시켰다."],[9,"In 1888, Dr. Adolf Fick made the first contact lenses.","1888년, 아돌프 픽 박사가 최초의 콘택트렌즈를 만들었다."]],"w":"5번에서 1600년대에 르네 데카르트가 다 빈치의 아이디어를 발전시켰다고 해요. 최초의 콘택트렌즈는 1888년 아돌프 픽 박사가 만들었고(9번), 무거운 유리로 만들어졌어요(10번).","c":2},"h":"8eb95039e0"},{"n":9,"t":"sum","q":"You might think contact lenses are a (A) invention, but their story goes back (B).","ko":"콘택트렌즈가 (A) 발명품이라고 생각할지도 모르지만, 그 이야기는 수 (B)을(를) 거슬러 올라간다.","oko":["(A) 아주 작은 / (B) 세기","(A) 현대의 / (B) 초","(A) 아주 작은 / (B) 초","(A) 시끄러운 / (B) 세기","(A) 현대의 / (B) 세기"],"opts":["(A) tiny / (B) centuries","(A) modern / (B) seconds","(A) tiny / (B) seconds","(A) noisy / (B) centuries","(A) modern / (B) centuries"],"r":{"a":"5) (A) modern / (B) centuries ((A) 현대의 / (B) 세기)","ev":"1번 문장","s":[[1,"You might think contact lenses are a modern invention, but their story goes back centuries.","콘택트렌즈가 현대의 발명품이라고 생각할지도 모르지만, 그 이야기는 수 세기를 거슬러 올라간다."]],"w":"1번에서 콘택트렌즈가 현대의(modern) 발명품이라고 생각할지도 모르지만, 그 이야기는 수 세기(centuries)를 거슬러 올라간다고 해요.","c":5},"h":"c8828d831e"},{"n":10,"t":"fill","q":"Today’s contact lenses came from the ideas and [A] of many people in the [B].","ko":"오늘날의 콘택트렌즈는 [B]의 많은 사람들의 아이디어와 [A]에서 나왔다.","bank":["efforts","past","blurry","uncomfortable","soft","heavy"],"bko":{"efforts":"노력","past":"과거","blurry":"흐릿한","uncomfortable":"불편한","soft":"부드러운","heavy":"무거운"},"r":{"a":"[A] efforts (노력), [B] past (과거)","ev":"12번 문장","s":[[12,"Today’s contact lenses came from the ideas and efforts of many people in the past.","오늘날의 콘택트렌즈는 과거의 많은 사람들의 아이디어와 노력에서 나왔다."]],"w":"12번에서 오늘날의 콘택트렌즈는 과거(past)의 많은 사람들의 아이디어와 노력(efforts)에서 나왔다고 해요. ideas and 뒤에는 명사가, the 뒤에도 명사가 와야 해요.","c":null},"h":"5f658b8359"}]},{"u":10,"id":"b3-10-4","no":4,"ko":"지도도 GPS도 없이 태평양을 건넌 사람들","items":[{"n":1,"t":"tf","q":"People from Southeast Asia moved across the Pacific Ocean around 3000 BCE to find new land.","ko":"동남아시아에서 온 사람들은 기원전 3000년경 새로운 땅을 찾아 태평양을 건너 이동했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Around 3000 BCE, people from Southeast Asia moved across the Pacific Ocean to find new land.","기원전 3000년경, 동남아시아에서 온 사람들이 새로운 땅을 찾아 태평양을 건너 이동했다."]],"w":"1번 문장에 Around 3000 BCE, people from Southeast Asia moved across the Pacific Ocean to find new land가 있음. 본문과 일치.","c":"T"},"h":"f141b20be1"},{"n":2,"t":"tf","q":"Polynesians used maps and GPS to find their way.","ko":"폴리네시아인들은 길을 찾기 위해 지도와 GPS를 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"They had no maps or GPS.","그들에게는 지도도 GPS도 없었다."],[8,"Instead, they followed the stars, ocean waves, and seabirds to find their way.","그 대신, 그들은 길을 찾기 위해 별과 바다의 파도, 바닷새를 따라갔다."]],"w":"7번 문장에서 지도도 GPS도 없었다(had no maps or GPS)고 하고, 8번에서 대신 별과 파도, 바닷새를 따라갔다고 함. 지도와 GPS를 썼다는 말과 반대.","c":"F"},"h":"7b8459b2f8"},{"n":3,"t":"tf","q":"The Polynesian Triangle includes only three islands.","ko":"폴리네시아 삼각형에는 세 개의 섬만 포함되어 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"These three islands mark the corners of a huge region called the Polynesian Triangle.","이 세 섬은 폴리네시아 삼각형이라고 불리는 거대한 지역의 꼭짓점을 이룬다."],[12,"This area includes over a thousand islands.","이 지역에는 천 개가 넘는 섬이 포함되어 있다."]],"w":"11번 문장에서 세 섬은 삼각형의 꼭짓점일 뿐이고, 12번 문장에서 그 지역에는 천 개가 넘는 섬이 포함된다고 함. 세 개뿐이라는 말은 틀림.","c":"F"},"h":"8cf85db254"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (As their population grew, Polynesians sailed east to find more islands.)","ko":"인구가 늘어나자 B) 문화","(A) 서쪽 / (B) 문화"],"opts":["(A) eastern / (B) language","(A) western / (B) language","(A) eastern / (B) culture","(A) northern / (B) culture","(A) western / (B) culture"],"r":{"a":"5) (A) western / (B) culture ((A) 서쪽 / (B) 문화)","ev":"2~3번 문장","s":[[2,"By 1000 BCE, their families reached Tonga and Samoa in the western Pacific.","기원전 1000년까지, 그들의 가족은 서태평양의 통가와 사모아에 도달했다."],[3,"There, they developed their own culture.","그곳에서 그들은 자신들만의 문화를 발전시켰다."]],"w":"2번에서 그들은 서태평양(western Pacific)의 통가와 사모아에 도달했고, 3번에서 그곳에서 자신들만의 문화(culture)를 발전시켰다고 해요.","c":5},"h":"39e8cfe9e4"},{"n":10,"t":"fill","q":"In [A], “Polynesian” means “[B] islands.”","ko":"[A](으)로 ‘폴리네시아인’은 ‘[B] 섬’을 의미한다.","bank":["Greek","many","eventually","sailed","instead","reached"],"bko":{"Greek":"그리스어","many":"많은","eventually":"결국","sailed":"항해했다","instead":"그 대신","reached":"도달했다"},"r":{"a":"[A] Greek (그리스어), [B] many (많은)","ev":"13번 문장","s":[[13,"In Greek, “Polynesian” means “many islands.”","그리스어로 ‘폴리네시아인’은 ‘많은 섬’을 의미한다."]],"w":"13번에서 그리스어(Greek)로 ‘폴리네시아인’은 ‘많은(many) 섬’을 의미한다고 해요. In 뒤에는 언어 이름이, islands 앞에는 수량을 나타내는 형용사가 와야 해요.","c":null},"h":"d0684277f8"}]}];
