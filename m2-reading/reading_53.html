.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "September 15, 5:30 p.m.", "en": "It's a sad day for me.", "ko": "오늘은 내게 슬픈 날이다.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "This morning, I go scuba diving at my favorite spot in the sea.", "ko": "오늘 아침, 나는 바다에서 내가 가장 좋아하는 지점으로 스쿠버 다이빙을 갔다.", "ok": false, "foot": [], "fixes": [{"wrong": "go", "right": "went", "partial": false, "at": [3], "point": "시제: 오늘 아침에 있었던 일을 말하므로 과거시제 went 사용", "topic": "시제", "memo": "오늘 아침에 있었던 일을 말하므로 과거시제 went 사용"}]}, {"n": 3, "tag": null, "en": "It was a place who was full with beautiful and colorful corals.", "ko": "그곳은 아름답고 다채로운 산호들로 가득한 장소였다.", "ok": false, "foot": [], "fixes": [{"wrong": "who", "right": "that", "partial": false, "at": [4], "point": "관계대명사: 선행사 a place(사물)이므로 관계대명사 who 대신 that[또는 which] 사용", "topic": "관계대명사", "memo": "선행사 a place(사물)이므로 관계대명사 who 대신 that[또는 which] 사용"}, {"wrong": "full with", "right": "full of", "partial": false, "at": [6], "point": "전치사: '~로 가득 찬'은 be full of로 표현 (full with는 잘못된 표현)", "topic": "전치사", "memo": "'~로 가득 찬'은 be full of로 표현 (full with는 잘못된 표현)"}]}, {"n": 4, "tag": null, "en": "But today, I saw corals to get sick.", "ko": "그런데 오늘, 나는 산호들이 병들어 가고 있는 것을 보았다.", "ok": false, "foot": [], "fixes": [{"wrong": "to get", "right": "getting", "partial": false, "at": [5], "point": "5형식: 지각동사(saw) 뒤 목적격보어로는 원형부정사나 현재분사를 사용하며 to부정사는 쓰지 않음", "topic": "5형식", "memo": "지각동사(saw) 뒤 목적격보어로는 원형부정사나 현재분사를 사용하며 to부정사는 쓰지 않음"}]}, {"n": 5, "tag": null, "en": "I was such shocked that I could not move.", "ko": "나는 너무 충격을 받아서 움직일 수 없었다.", "ok": false, "foot": [], "fixes": [{"wrong": "such", "right": "so", "partial": false, "at": [2], "point": "so+형용사+that: such는 명사를 수식하므로 형용사 앞에는 so 사용", "topic": "so+형용사+that", "memo": "such는 명사를 수식하므로 형용사 앞에는 so 사용"}]}, {"n": 6, "tag": null, "en": "The warm seawater has made the corals to turn white.", "ko": "따뜻한 바닷물 때문에 산호들이 흰색으로 변해버렸다.", "ok": false, "foot": [], "fixes": [{"wrong": "to turn", "right": "turn", "partial": false, "at": [  "right": "to save", "partial": false, "at": [4], "point": "to부정사의 명사적 용법: 가주어 It ~ 진주어 to부정사(to save) 구문", "topic": "to부정사의 명사적 용법", "memo": "가주어 It ~ 진주어 to부정사(to save) 구문"}]}, {"n": 12, "tag": null, "en": "My plan is form a team of divers which love the sea.", "ko": "내 계획은 바다를 사랑하는 잠수부 팀을 만드는 것이다.", "ok": false, "foot": [], "fixes": [{"wrong": "form", "right": "to form", "partial": false, "at": [3], "point": "to부정사의 명사적 용법: be동사의 보어로 쓰일 때는 to부정사 to form 사용", "topic": "to부정사의 명사적 용법", "memo": "be동사의 보어로 쓰일 때는 to부정사 to form 사용"}, {"wrong": "which", "right": "who", "partial": false, "at": [8], "point": "관계대명사: 선행사 divers(사람)이므로 관계대명사 which 대신 who 사용", "topic": "관계대명사", "memo": "선행사 divers(사람)이므로 관계대명사 which 대신 who 사용"}]}, {"n": 13, "tag": null, "en": "My team can go underwater and taking care of the sick corals.", "ko": "우리 팀은 바닷속으로 가서 병든 산호들을 돌볼 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "taking care", "right": "take care", "partial": false, "at": [6], "point": "병렬구조: 조동사 can 뒤에는 동사원형 go와 take care가 병렬로 연결됨", "topic": "병렬구조", "memo": "조동사 can 뒤에는 동사원형 go와 take care가 병렬로 연결됨"}]}, {"n": 14, "tag": null, "en": "Many corals get sick because they don't get good care on time.", "ko": "많은 산호들은 제때 좋은 치료를 받지 못하기 때문에 아프다.", "ok": false, "foot": [], "fixes": [{"wrong": "on time", "right": "in time", "partial": false, "at": [10], "point": "어휘: '제때에, 늦지 않게'라는 의미는 in time으로 표현 (on time은 '정각에'라는 뜻)", "topic": "어휘", "memo": "'제때에, 늦지 않게'라는 의미는 in time으로 표현 (on time은 '정각에'라는 뜻)"}]}, {"n": 15, "tag": null, "en": "I'm sure that other divers are worrying about this, too.", "ko": "나는 다른 잠수부들도 이것을 걱정하고 있다고 확신한다.", "ok": false, "foot": [], "fixes": [{"wrong": "worrying", "right": "worried", "partial": false, "at": [6], "point": "어휘: 감정을 느끼는 주체(divers)에는 과거분사형 worried 사용 (worrying은 감정을 유발하는 대상에 사용)", "topic": "어휘", "memo": "감정을 느끼는 주체(divers)에는 과거분사형 worried 사용 (worrying은 감정을 유발하는 대상에 사용)"}]}, {"n": 16, "tag": null, "en": "I'm going to posting a message online to look for volunt  born from the eggs like magic.", "오늘 아침, 그 알들에서 수백 마리의 아기 산호들이 마법처럼 태어났다.", 0], ["They were cute and amazing.", "그것들은 귀엽고 놀라웠다.", 0], ["I hope this miracle will happen to other sick corals, too.", "나는 이 기적이 다른 병든 산호들에게도 일어나기를 바란다.", 0], ["Although it took time to heal the sick corals and grow healthy ones, it was worth the hard work.", "비록 병든 산호들을 치료하고 건강한 산호들을 키우는 데 시간이 걸렸지만, 그 노력은 가치 있었다.", 0]];var RNUM=53;var TITLE_EN="Living with Corals Again - A Diver's Diary";var PASS_EN=["Living with Corals Again - A Diver's Diary", "It's a sad day for me. This morning, I went scuba diving at my favorite spot in the sea. It was a place that was full of beautiful and colorful corals. But today, I saw corals getting sick. I was so shocked that I could not move. The warm seawater has made the corals turn white. Different types of waste have harmed the corals, too. Now the spot has lost its colors and beauty. This is the worst change I have ever seen in the sea.", "I have thought about how to help corals. It is not easy to save the corals alone. My plan is to form a team of divers who love the sea. My team can go underwater and take care of the sick corals. Many corals get sick because they don't get good care in time. I'm sure that other divers are worried about this, too. I'm going to post a message online to look for volunteer divers.", "For the last two weeks, my team has put ointment on sick corals. We also took some healthy baby corals from the sea and put them in tanks of seawater. We enjoy taking care of the baby corals every day. We feed them clam parts and seaweed smoothies. This food helps baby corals grow as strong as adult corals. When they are ready, we'll plant them onto the corals in the sea. Our goal is to grow many healthy corals. I look forward to seeing the results!", "Last night, some healthy corals in the sea laid eggs under the full moon. This morning, hundreds of baby corals were born from the eggs like magic. They were cute and amazing. I hope this miracle will happen to other sick corals, too. Although it took time to heal the sick corals and grow healthy ones, it was worth the hard work."];var PASS_KO=["산호와 다시 함께 살기 - 어느 잠수부의 일기", "오늘은 내게 슬픈 날이다. 오늘 아침, 나는 바다에서 내가 가장 좋아하는 지점으로 스쿠버 다이빙을 갔다. 그곳은 아름답고 다채로운 산호들로 가득한 장소였다. 그런데 오늘, 나는 산호들이 병들어 가고 있는 것을 보았다. 나는 너무 충격을 받아서 움직일 수 없었다. 따뜻한 바닷물 때문에 산호들이 흰색으로 변해버렸다. 여러 종류의 쓰레기도 산호에 해를 끼쳤다. 이제 그 지점은 그것의 색과 아름다움을 잃어버렸다. 이것은 내가 바다에서 본 것 중 최악의 변화이다.", "나는 산호를 돕는 방법에 대해 생각했다. 산호를 혼자서 구하는 것은 쉽지 않다. 내 계획은 바다를 사랑하는 잠수부 팀을 만드는 것이다. 우리 팀은 바닷속으로 가서 병든 산호들을 돌볼 수 있다. 많은 산호들은 제때 좋은 치료를 받지 못하기 때문에 아프다. 나는 다른 잠수부들도 이것을 걱정하고 있다고 확신한다. 나는 자원봉사 잠수부를 찾기 위해 온라인에 메시지를 올릴 예정이다.", "지난 두 주 동안, 우리 팀은 병든 산호에 연고를 발랐다. 우리는 또한 바다에서 건강한 아기 산호들을 가져와 바닷물 수조에 넣었다. 우리는 매일 아기 산호들을 돌보는 것을 즐긴다. 우리는 그것들에게 조개 부스러기와 해조류 스무디를 먹인다. 이 음식은 아기 산호들이 다 자란 산호만큼 강하게 자라도록 돕는다. 아기 산호들이 준비되면, 우리는 그것들을 바다의 산호에 심을 것이다. 우리의 목표는 많은 건강한 산호들을 키우는 것이다. 나는 결과를 볼 것을 기대한다!", "어젯밤, 바다의 일부 건강한 산호들이 보름달이 뜬 동안 알들을 낳았다. 오늘 아침, 그 알들에서 수백 마리의 아기 산호들이 마법처럼 태어났다. 그것들은 귀엽고 놀라웠다. 나는 이 기적이 다른 병든 산호들에게도 일어나기를 바란다. 비록 병든 산호들을 치료하고 건강한 산호들을 키우는 데 시간이 걸렸지만, 그 노력은 가치 있었다."];var DG=[{"dlg": [["B", "Hey, Jina. What are you doing?", "안녕, 지나야. 뭐 하고 있어?"], ["G", "I’m deleting my emails.", "내 이메일들을 지우고 있어."], ["B", "Why?", "왜?"], ["G", "I heard that storing emails uses a lot of energy.", "이메일을 저장하는 데 에너지가 많이 쓰인다고 들었거든."], ["B", "Really?", "정말?"], ["G", "Yeah, using too much energy is bad for the Earth.", "응, 에너지를 너무 많이 쓰는 건 지구에 나빠."], ["B", "Oh, I get it. I’ll delete my emails, too.", "아, 알겠다. 나도 내 이메일들을 지울게."], ["G", "And you should also block spam and ads.", "그리고 스팸 메일과 광고 메일도 차단하는 게 좋아."]], "qs": [{"n": 1, "q": "위 대화의 주제로 알맞은 것은?", "o": ["이메일의 환경 보호 효과", "지구를 위한 이메일 정리", "스팸과 광고 이메일 차단 설정", "에너지를 절약하는 다양한 방법", "지구를 지키기 위한 이메일 보내기"], "a": 1, "ans": "지구를 위한 이메일 정리", "evs": [["G: I heard that storing emails uses a lot of energy.", "이메일을 저장하는 데 에너지가 많이 쓰인다고 들었거든."], ["G: Yeah, using too much energy is bad for the Earth.", "응, 에너지를 너무 많이 쓰는 건 지구에 나빠."]], "ev": function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){

 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});

function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}

var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}

 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
