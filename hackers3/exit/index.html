<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 3 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"hk3-01-1","no":1,"ko":"언제 어디서나 출동!","items":[{"n":1,"t":"tf","q":"A drone can deliver blood bags in only 15 minutes.","ko":"드론은 혈액 주머니를 15분 만에 배달할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"It only takes 15 minutes to deliver the bags!","혈액 주머니를 배달하는 데 15분밖에 걸리지 않는다!"]],"w":"6번 문장에 It only takes 15 minutes to deliver the bags!가 있어요. 드론으로 보내면 15분밖에 걸리지 않는다는 내용과 일치해요.","c":"T"},"h":"8ea32de429"},{"n":2,"t":"tf","q":"Drones have to land on the ground to deliver a box.","ko":"드론은 상자를 배달하려면 땅에 착륙해야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"And they make the deliveries without landing.","그리고 그것들은 착륙을 하지 않고 배달한다."],[9,"The drones simply drop a box containing medical supplies from the sky.","드론은 의료보급품이 들어 있는 상자를 하늘에서 그냥 떨어뜨린다."]],"w":"8번에서 드론은 착륙하지 않고(without landing) 배달한다고 하고, 9번에서 하늘에서 상자를 떨어뜨린다고 해요. 땅에 착륙해야 한다는 말은 반대예요.","c":"F"},"h":"5c1c44e6af"},{"n":3,"t":"tf","q":"The box dropped by a drone is attached to a small parachute.","ko":"드론이 떨어뜨리는 상자는 작은 낙하산에 붙어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"The box is attached to a small parachute, which allows it to land safely.","그 상자는 작은 낙하산에 붙어있고, 이는 상자가 안전하게 착륙하도록 한다."]],"w":"10번에서 The box is attached to a small parachute라고 해요. 낙하산 덕분에 상자가 안전하게 착륙해요.","c":"T"},"h":"88c43c9202"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Imagine someone has been rushed to the hospital after a car accident.)","ko":"자동차 사고 후에 누군가가 병원으로 ( ) 상상해 보아라.","opts":["천천히 걸어가게 되었다","몰래 숨게 되었다","급히 수송되었다","조용히 쉬게 되었다"],"word":"rushed","r":{"a":"3) 급히 수송되었다","ev":"1번 문장","s":[[1,"Imagine someone has been rushed to the hospital after a car accident.","자동차 사고 후에 누군가가 병원으로 급히 수송되었다고 상상해 보아라."]],"w":"사고를 당한 사람이 병원으로 바삐 옮겨지는 상황이에요. has been rushed는 ‘급히 수송되었다’예요.","c":3},"h":"0aad5fbfe3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Drones can search in the dark or in areas that are hard to reach.)","ko":"드론은 어둠 속이나 ( ) 지역에서 수색을 할 수 있다.","opts":["닿다, 도달하다","잊다","만들다","고치다"],"word":"reach","r":{"a":"1) 닿다, 도달하다","ev":"13번 문장","s":[[13,"Drones can search in the dark or in areas that are hard to reach.","드론은 어둠 속이나 닿기 힘든 지역에서 수색을 할 수 있다."]],"w":"areas that are hard to reach는 ‘닿기 힘든 지역’이에요. 사람이 가기 어려운 곳이라서 드론이 수색에 도움이 돼요.","c":1},"h":"53d4673005"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe box is attached to a small parachute, which allows it to land safely.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그 상자는 작은 낙하산에 붙어있고, 이는 상자가 안전하게 착륙하도록 한다.","opts":["드론","상자","병원","낙하산"],"r":{"a":"2) 상자","ev":"9~10번 문장","s":[[9,"The drones simply drop a box containing medical supplies from the sky.","드론은 의료보급품이 들어 있는 상자를 하늘에서 그냥 떨어뜨린다."],[10,"The box is attached to a small parachute, which allows it to land safely.","그 상자는 작은 낙하산에 붙어있고, 이는 상자가 안전하게 착륙하도록 한다."]],"w":"9번에서 드론이 떨어뜨리는 것은 상자(a box)예요. 10번에서 안전하게 착륙하는 것도 그 상자라서 it은 상자를 가리켜요.","c":2},"h":"1bdca1771c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, this isn’t the only task drones perform to save lives.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 이것이 드론이 생명을 살리기 위해서 수행하는 유일한 임무는 아니다.","opts":["드론은 사람을 구하는 일을 전혀 하지 않는다.","드론이 하는 일은 오직 배달뿐이다.","드론은 생명을 살리기 위해 배달 말고도 다른 임무를 한다.","드론의 임무는 모두 위험하다."],"r":{"a":"3) 드론은 생명을 살리기 위해 배달 말고도 다른 임무를 한다.","ev":"11번 문장","s":[[11,"However, this isn’t the only task drones perform to save lives.","하지만, 이것이 드론이 생명을 살리기 위해서 수행하는 유일한 임무는 아니다."]],"w":"isn’t the only task는 ‘유일한 임무가 아니다’라는 뜻이에요. 배달 말고도 다른 임무가 있다는 말이고, 그다음 12번에서 실종자 수색이 나와요.","c":3},"h":"bc56e3f6be"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["드론은 의료품을 배달할 때 반드시 땅에 내려야 한다.","드론은 자연재해 뒤에 실종된 사람들을 찾는 데 큰 역할을 한다.","차로 혈액을 배달하는 것이 드론보다 빠르다.","드론은 밝은 낮에만 수색할 수 있다."],"opts":["Drones must land on the ground to deliver medical supplies.","Drones play a big role in finding missing people after disasters.","Delivering blood by car is faster than by drone.","Drones can search only in the daytime."],"r":{"a":"2) Drones play a big role in finding missing people after disasters.","ev":"12~13번 문장","s":[[12,"They play an especially big role when looking for missing people after natural disasters.","그것들은 자연재해 이후 실종된 사람들을 찾을 때 특히 큰 역할을 한다."],[13,"Drones can search in the dark or in areas that are hard to reach.","드론은 어둠 속이나 닿기 힘든 지역에서 수색을 할 수 있다."]],"w":"12번에서 자연재해 이후 실종된 사람들을 찾을 때 큰 역할을 한다고 해요. 드론은 착륙하지 않고(8번) 배달하고, 차보다 빠르며(4, 6번), 어둠 속에서도 수색해요(13번).","c":2},"h":"02a74ae49a"},{"n":9,"t":"sum","q":"Drones play a big role in (A) missing people after natural disasters, because they can search in the (B) and in hard-to-reach areas.","ko":"드론은 자연재해 이후 실종된 사람들을 (A)하는 데 큰 역할을 하는데, (B)이나 닿기 힘든 곳에서도 수색할 수 있기 때문이다.","oko":["(A) 찾는 / (B) 어둠","(A) 숨기는 / (B) 햇빛","(A) 돕는 / (B) 바다","(A) 잃어버리는 / (B) 어둠","(A) 찾는 / (B) 도시"],"opts":["(A) finding / (B) dark","(A) hiding / (B) sunlight","(A) paying / (B) sea","(A) losing / (B) dark","(A) finding / (B) city"],"r":{"a":"1) (A) finding / (B) dark","ev":"12~13번 문장","s":[[12,"They play an especially big role when looking for missing people after natural disasters.","그것들은 자연재해 이후 실종된 사람들을 찾을 때 특히 큰 역할을 한다."],[13,"Drones can search in the dark or in areas that are hard to reach.","드론은 어둠 속이나 닿기 힘든 지역에서 수색을 할 수 있다."]],"w":"12번에서 실종된 사람들을 찾는다(look for → finding)고 하고, 13번에서 어둠 속(the dark)이나 닿기 힘든 곳에서 수색할 수 있다고 해요.","c":1},"h":"f66549f58d"},{"n":10,"t":"fill","q":"A drone drops a [A] with medical supplies from the sky, and a small [B] helps it land safely.","ko":"드론은 의료 보급품이 든 [A]를 하늘에서 떨어뜨리고, 작은 [B]가 그것을 안전하게 착륙하게 한다.","bank":["box","parachute","hospital","accident","sky","disaster"],"bko":{"box":"상자","parachute":"낙하산","hospital":"병원","accident":"사고","sky":"하늘","disaster":"재해"},"r":{"a":"[A] box, [B] parachute","ev":"9~10번 문장","s":[[9,"The drones simply drop a box containing medical supplies from the sky.","드론은 의료보급품이 들어 있는 상자를 하늘에서 그냥 떨어뜨린다."],[10,"The box is attached to a small parachute, which allows it to land safely.","그 상자는 작은 낙하산에 붙어있고, 이는 상자가 안전하게 re exposed to something, the more you like it.)","ko":"어떤 것에 더 많이 ( ) 수록, 당신은 그것을 더 많이 좋아하게 된다.","opts":["숨겨진","칭찬받은","선택된","노출된"],"word":"exposed","r":{"a":"4) 노출된","ev":"7번 문장","s":[[7,"The more you are exposed to something, the more you like it.","어떤 것에 더 많이 노출될수록, 당신은 그것을 더 많이 좋아하게 된다."]],"w":"be exposed to는 ‘~에 노출되다’예요. 자주 접할수록 더 좋아한다는 친숙성 원칙의 핵심 표현이에요.","c":4},"h":"625e7a6a3e"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAt first, you may be indifferent or even annoyed by it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"처음에는, 무관심하거나 그것에 짜증이 날 수도 있다.","opts":["같은 광고","에펠탑","광고주","모파상"],"r":{"a":"1) 같은 광고","ev":"9~10번 문장","s":[[9,"Advertisers use the same commercial repeatedly.","광고주들은 반복적으로 같은 광고를 사용한다."],[10,"At first, you may be indifferent or even annoyed by it.","처음에는, 무관심하거나 그것에 짜증이 날 수도 있다."]],"w":"9번에서 광고주가 같은 광고(the same commercial)를 반복해 써요. 10번에서 처음에 무관심하거나 짜증이 나는 대상이 바로 그 광고예요.","c":1},"h":"01e76b039a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The more you are exposed to something, the more you like it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"어떤 것에 더 많이 노출될수록, 당신은 그것을 더 많이 좋아하게 된다.","opts":["어떤 것을 좋아할수록, 그것에서 더 많이 벗어나게 된다.","어떤 것에 노출되면, 그것을 곧바로 싫어하게 된다.","어떤 것에 더 많이 노출될수록, 그것을 더 많이 좋아하게 된다.","어떤 것을 더 많이 알수록, 그것에서 더 적게 노출된다."],"r":{"a":"3) 어떤 것에 더 많이 노출될수록, 그것을 더 많이 좋아하게 된다.","ev":"7번 문장","s":[[7,"The more you are exposed to something, the more you like it.","어떤 것에 더 많이 노출될수록, 당신은 그것을 더 많이 좋아하게 된다."]],"w":"「the more ~, the more …」는 ‘~할수록 더 …하다’예요. 많이 노출될수록(the more exposed) 더 좋아한다(the more you like it)는 뜻이에요.","c":3},"h":"4c1297f7f0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["에펠탑은 파리의 중심에서 멀리 떨어져 있었다.","모파상은 에펠탑 안의 식당에서 매일 점심을 먹곤 했다.","파리 사람들은 에펠탑에 끝내 익숙해지지 않았다.","광고는 결국 사람들이 브랜드를 싫어하게 만든다."],"opts":["The Eiffel Tower was located far from the center of Paris.","Maupassant used to have lunch at a restaurant inside the Eiffel Tower every day.","The Parisians never got used to the Eiffel Tower.","Advertisements make people hate a brand in the end."],"r":{"a":"2) Maupassant used to have lunch at a restaurant inside the Eiffel Tower every day.","ev":"1번 문장","s":[[1,"Guy de Maupassant, a famous writer, used to have lunch every day at a restaurant inside the Eiffel Tower.","유명 작가인 기 드 모파상은, 에펠탑 안에 있는 식당에서 매일 점심을 먹곤 했다."]],"w":"1번에 모파상이 에펠탑 안의 식당에서 매일 점심을 먹곤 했다고 나와요. 탑은 도시 중심에 있었고(4번), 파리 사람들은 익숙해져 좋아하게 되었으며(5번), 광고도 결국 좋아하게 만든다고 해요(12번).","c":2},"h":"0f784f1cf2"},{"n":9,"t":"sum","q":"Many Parisians (A) the Eiffel Tower at first, but after seeing it every day, they became (B) to it and started to love it.","ko":"많은 파리 사람들은 처음에는 에펠탑을 (A)했지만, 매일 보게 되면서 그것에 (B)해져서 좋아하기 시작했다.","oko":["(A) 좋아한 / (B) 익숙","(A) 무서워한 / (B) 놀라","(A) 싫어한 / (B) 반대","(A) 좋아한 / (B) 지루","(A) 싫어한 / (B) 익숙"],"opts":["(A) loved / (B) used","(A) feared / (B) surprised","(A) hated / (B) opposed","(A) loved / (B) bored","(A) hated / (B) used"],"r":{"a":"5) (A) hated / (B) used","ev":"3~5번 문장","s":[[3,"Like him, many Parisians hated the Eiffel Tower at first.","그와 같이, 많은 파리 사람들이 처음에는 에펠탑을 싫어했다."],[4,"However, the tower was located in the city’s center, so people naturally saw it every day.","하지만, 그 탑은 도시의 중심에 위치해 있어서, 사람들은 자연스럽게 그것을 매일 봤다."],[5,"Over time, they got used to it and started to love it.","시간이 지나면서, 그들은 그것에 익숙해졌고 그것을 좋아하기 시작했다."]],"w":"3번에서 처음에는 에펠탑을 싫어했고(hated), 4번에서 매일 보게 되었고, 5번에서 get used to(익숙해지다)해서 좋아하기 시작했어요.","c":5},"h":"2eca6b20a0"},{"n":10,"t":"fill","q":"At first you may be annoyed by a repeated [A], but later you choose the [B] you saw in it.","ko":"처음에는 반복되는 [A]에 짜증이 날 수 있지만, 나중에는 그 안에서 본 [B]를 고르게 된다.","bank":["commercial","brand","tower","writer","city","principle"],"bko":{"commercial":"광고","brand":"브랜드","tower":"탑","writer":"작가","city":"도시","principle":"원칙"},"r":{"a":"[A] commercial, [B] brand","ev":"10~11번 문장","s":[[10,"At first, you may be indifferent or even annoyed by it.","처음에는, 무관심하거나 그것에 짜증이 날 수도 있다."],[11,"But later, you find yourself choosing the brand you saw in the commercial.","하지만 나중에, 당신은 광고에서 본 그 브랜드를 고르고 있는 자신의 모습을 발견한다."]],"w":"10번에서 처음에는 광고(it = the commercial)에 무관심하거나 짜증이 나고, 11번에서 나중에는 그 광고에서 본 브랜드를 고르게 돼요.","c":null},"h":"2d795e72b4"}]},{"u":1,"id":"hk3-01-3","no":3,"ko":"알고 보면 달라 달라~","items":[{"n":1,"t":"tf","q":"The most basic difference between the two sports is the track length.","ko":"두 스포츠의 가장 기본적인 차이점은 트랙 길이이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The most basic difference is the track length.","가장 기본적인 차이점은 트랙 길이이다."]],"w":"3번에 The most basic difference is the track length.가 그대로 있어요.","c":"T"},"h":"4e460fd602"},{"n":2,"t":"tf","q":"The track for speed skating is shorter than the track for short-track skating.","ko":"스피드 스케이팅 트랙은 쇼트트랙 스케이팅 트랙보다 짧다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The track for speed skating, which is 400 meters long, is around four times longer than that for short-track skating.","400미터 길이인 스피드 스케이팅 트랙은 쇼트트랙 스케이팅의 트랙보다 네 배 정도 더 길다."]],"w":"4번에서 스피드 스케이팅 트랙은 쇼트트랙 트랙보다 네 배 정도 더 길다(four times longer)고 해요. 짧다는 말은 반대예요.","c":"F"},"h":"a0c551999f"},{"n":3,"t":"tf","q":"In speed skating, each skater skates in his or her own lane.","ko":"스피드 스케이팅에서는 각 선수가 자기 레인에서 스케이트를 탄다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"But in speed skating, only two skaters are on the ice, each skating in his or her own lane.","하지만 스피드 스케이팅에서는, 두 명의 스케이트 선수들만 빙판 위에 있고, 각자 자기 자신의 레인에서 스케이트를 탄다."]],"w":"8번에서 스피드 스케이팅은 두 명만 빙판 위에 있고, 각자 자기 자신의 레인에서 탄다고 해요.","c":"T"},"h":"59dd65824e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Passing competitors and navigating around them quickly are important skills.)","ko":"경쟁자들을 추월하고 그들 주위에서 빠르게 ( ) 것이 중요한 기술들이다.","opts":["길을 포기하는","얼음을 깨는","길을 찾는","동작을 멈추는"],"word":"navigating","r":{"a":"3) 길을 찾는","ev":"7번 문장","s":[[7,"Because there are so many skaters on the track, passing competitors and navigating around them quickly are important skills.","트랙 위에 너무 많은 선수들이 있기 때문에, 경쟁자들을 추월하고 그들 주위에서 빠르게 길을 찾는 것이 중요한 기술들이다."]],"w":"선수가 많은 트랙에서 경쟁자들 사이를 빠져나가며 방향을 찾는 기술이에요. navigate around them은 ‘그들 주위에서 길을 찾다’예요.","c":3},"h":"4344e21778"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In addition, the blades of speed skates are long to provide more speed.)","ko":"게다가, 스피드 스케이트의 ( )은 길어서 더 빠른 속도를 제공한다.","opts":["(스케이트) 날","신발 끈","얼음 조각","트랙 바닥"],"word":"blades","r":{"a":"1) (스케이트) 날","ev":"10번 문장","s":[[10,"In addition, the blades of speed skates are long to provide more speed.","게다가, 스피드 스케이트의 날은 길어서 더 빠른 속도를 제공한다."]],"w":"스케이트에서 길어서 더 빠른 속도를 내는 부분이 날이에요. 11번에도 쇼트트랙 스케이트의 날(blades)이 짧다고 나와요.","c":1},"h":"e18f7c7624"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThe track for speed skating, which is 400 meters long, is around four times longer than that for short-track skating.","ko":"밑줄 친 that이 가리키는 것은?","sko":"400미터 길이인 스피드 스케이팅 트랙은 쇼트트랙 스케이팅의 트랙보다 네 배 정도 더 길다.","opts":["선수","트랙","규칙","올림픽"],"r":{"a":"2) 트랙","ev":"3~4번 문장","s":[[3,"The most basic difference is the track length.","가장 기본적인 차이점은 트랙 길이이다."],[4,"The track for speed skating, which is 400 meters long, is around four times longer than that for short-track skating.","400미터 길이인 스피드 스케이팅 트랙은 쇼트트랙 스케이팅의 트랙보다 네 배 정도 더 길다."]],"w":"비교하는 대상은 ‘스피드 스케이팅 트랙’과 ‘쇼트트랙 스케이팅 트랙’이에요. than that for short-track skating은 than the track for short-track skating이라는 뜻이라 that은 트랙(the track)이에요.","c":2},"h":"cd9bb68bfa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Skaters only focus on going as fast as possible.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"스케이트 선수들은 가능한 한 빠르게 달리는 데만 집중한다.","opts":["스케이트 선수들은 천천히 달리는 데 집중한다.","스케이트 선수들은 다른 선수를 추월하는 데만 집중한다.","스케이트 선수들은 가능한 한 오래 달리려고 한다.","스케이트 선수들은 가능한 한 빠르게 달리는 데만 집중한다."],"r":{"a":"4) 스케이트 선수들은 가능한 한 빠르게 달리는 데만 집중한다.","ev":"9번 문장","s":[[9,"Skaters only focus on going as fast as possible.","스케이트 선수들은 가능한 한 빠르게 달리는 데만 집중한다."]],"w":"「as + 부사 + as possible」은 ‘가능한 한 ~하게’예요. as fast as possible은 ‘가능한 한 빠르게’이고, only focus on은 ‘~에만 집중한다’예요.","c":4},"h":"92f31c56bc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["쇼트트랙에서는 한 번에 두 명만 겨룬다.","쇼트트랙 선수들은 경쟁자를 추월하고 그들 주위에서 길을 찾는 기술이 필요하다.","스피드 스케이트의 날은 쇼트트랙 스케이트의 날보다 짧다.","스피드 스케이팅은 쇼트트랙 스케이팅과 규칙이 똑같다."],"opts":["Only two skaters compete at once in short-track skating.","Short-track skaters need skills to pass competitors and navigate around them.","The blades of speed skates are shorter than those of short-track skates.","Speed skating has the same rules as short-track skating."],"r":{"a":"2) Short-track skaters need skills to pass competitors and navigate around them.","ev":"6~7번 문장","s":[[6,"In short-track skating, four to eight skaters compete at once.","쇼트트랙 스케이팅에서는, 네 명에서 여덟 명의 스케이트 선수들이 한 번에 겨룬다."],[7,"Because there are so many skaters on the track, passing competitors and navigating around them quickly are important skills.","트랙 위에 너무 많은 선수들이 있기 때문에, 경쟁자들을 추월하고 그들 주위에서 빠르게 길을 찾는 것이 중요한 기술들이다."]],"w":"6번에서 쇼트트랙은 4~8명이 겨루고, 7번에서 그래서 경쟁자를 추월하고 주위에서 길을 찾는 것이 중요한 기술이라고 해요. 두 명만 타는 것은 스피드 스케이팅(8번)이고, 날은 스피드 쪽이 길며(10번), 규칙도 꽤 달라요(5번).","c":2},"h":"976afd08f2"},{"n":9,"t":"sum","q":"Short-track skating and speed skating look (A), but they are completely (B) sports.","ko":"쇼트트랙 스케이팅과 스피드 스케이팅은 (A) 보이지만, 완전히 (B) 스포츠이다.","oko":["(A) 다르게 / (B) 비슷한","(A) 비슷하게 / (B) 같은","(A) 비슷하게 / (B) 다른","(A) 위험하게 / (B) 다른","(A) 다르게 / (B) 같은"],"opts":["(A) different / (B) similar","(A) similar / (B) same","(A) similar / (B) different","(A) dangerous / (B) different","(A) different / (B) same"],"r":{"a":"3) (A) similar / (B) different","ev":"1~2번 문장","s":[[1,"If you’ve ever seen the Winter Olympics, you may have thought short-track skating and speed skating look very similar.","만약 당신이 동계 올림픽을 본 적 있다면, 쇼트트랙 스케이팅과 스피드 스케이팅이 매우 비슷하게 보인다고 생각했을 수도 있다."],[2,"However, these two are completely different sports.","하지만, 이 둘은 완전히 다른 스포츠이다."]],"w":"1번에서 두 스포츠가 매우 비슷하게 보인다(look very similar)고 하고, 2번에서 However 뒤에 완전히 다른(completely different) 스포츠라고 해요.","c":3},"h":"5a9a650c86"},{"n":10,"t":"fill","q":"The blades of speed skates are [A] to provide more speed, but the blades of short-track skates are [B] so that the skaters can make turns more easily.","ko":"스피드 스케이트의 날은 더 빠른 속도를 내려고 [A] 것이고, 쇼트트랙 스케이트의 날은 선수들이 방향을 더 쉽게 틀 수 있도록 [B] 것이다.","bank":["long","shorter","cheap","colorful","round","heavy"],"bko":{"long":"긴","shorter":"더 짧은","cheap":"값싼","colorful":"화려한","round":"둥근","heavy":"무거운"},"r":{"a":"[A] long, [B] shorter","ev":"10~11번 문장","s":[[10,"In addition, the blades of speed skates are long to provide more speed.","게다가, 스피드 스케이트의 날은 길어서 더 빠른 속도를 제공한다."],[11,"The blades of short-track skates, on the other hand, are shorter so that the skaters can make turns more easily.","반면에, 쇼트트랙 스케이트의 날은, 스케이트 선수들이 방향을 더 쉽게 틀 수 있도록 더 짧다."]],"w":"10번에서 스피드 스케이트의 날은 길고(long) 더 빠른 속도를 제공해요. 11번에서 쇼트트랙 스케이트의 날은 방향을 쉽게 틀 수 있도록 더 짧아요(shorter).","c":null},"h":"2330d6f18b"}]},{"u":1,"id":"hk3-01-4","no":4,"ko":"#너도 나도 챌린지!","items":[{"n":1,"t":"tf","q":"People open the bottle cap by kicking it with the tips of their toes.","ko":"사람들은 발끝으로 뚜껑을 차서 병을 연다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Then they kick the cap with the tips of their toes to open it.","그러고 나서 그들은 그것을 열기 위해 그들의 발끝으로 뚜껑을 찬다."]],"w":"3번에서 they kick the cap with the tips of their toes to open it(그것을 열기 위해 발끝으로 뚜껑을 찬다)이라고 해요.","c":"T"},"h":"ea324f8179"},{"n":2,"t":"tf","q":"Martial artists never did the cap kick before celebrities did.","ko":"무술가들은 유명인들이 하기 전에 뚜껑 차기를 한 적이 전혀 없다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Actually, martial artists used to do this to increase the accuracy of their kicks.","사실, 무술가들이 발차기의 정확성을 높이기 위해서 이것을 하곤 했다."]],"w":"6번에서 무술가들이 발차기의 정확성을 높이기 위해 이것을 하곤 했다(used to do this)고 해요. 유명인들이 하기 전에도 했으므로 ‘전혀 없다’는 틀려요.","c":"F"},"h":"12e41820d4"},{"n":3,"t":"tf","q":"Only a few people took part in the Ice Bucket Challenge.","ko":"아이스버킷 챌린지에는 소수의 사람들만 참여했다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"It was started to raise awareness of Lou Gehrig’s disease, and tens of millions of people around the world participated.","그것은 루게릭병에 대한 인식을 높이기 위해 시작되었고, 전 세계의 수천만 명의 사람들이 참여했다."]],"w":"11번에서 전 세계의 수천만 명(tens of millions of people)이 참여했다고 해요. 소수만 참여했다는 말은 반대예요.","c":"F"},"h":"4afc42235d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It starts with closing the cap loosely.)","ko":"그것은 뚜껑을 ( ) 닫는 것으로 시작한다.","opts":["느슨하게","단단하게","빠르게","조용하게"],"word":"loosely","r":{"a":"1) 느슨하게","ev":"2번 문장","s":[[2,"It starts with closing the cap loosely.","그것은 뚜껑을 느슨하게 닫는 것으로 시작한다."]],"w":"뚜껑을 loosely 닫아야 발끝으로 차서 열 수 있어요(3번). loosely는 ‘느슨하게’예요.","c":1},"h":"9058bcfe7a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… tens of millions of people around the world participated.)","ko":"전 세계의 수천만 명의 사람들이 ( ).","opts":["반대했다","구경만 했다","참여했다","거절했다"],"word":"participated","r":{"a":"3) 참여했다","ev":"11번 문장","s":[[11,"It was started to raise awareness of Lou Gehrig’s disease, and tens of millions of people around the world participated.","그것은 루게릭병에 대한 인식을 높이기 위해 시작되었고, 전 세계의 수천만 명의 사람들이 참여했다."]],"w":"루게릭병을 알리려고 시작된 챌린지에 전 세계 사람들이 함께한 것이므로 participated는 ‘참여했다’예요.","c":3},"h":"715e648315"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was started to raise awareness of Lou Gehrig’s disease, and tens of millions of people around the world participated.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 루게릭병에 대한 인식을 높이기 위해 시작되었고, 전 세계의 수천만 명의 사람들이 참여했다.","opts":["병뚜껑 챌린지","아이스버킷 챌린지","루게릭병","소셜 미디어"],"r":{"a":"2) 아이스버킷 챌린지","ev":"10~11번 문장","s":[[10,"The most famous one is the Ice Bucket Challenge, where people poured ice water over themselves.","가장 유명한 것은 아이스버킷 챌린지인데, 여기서 사람들은 자기 자신에게 얼음물을 부었다."],[11,"It was started to raise awareness of Lou Gehrig’s disease, and tens of millions of people around the world participated.","그것은 루게릭병에 대한 인식을 높이기 위해 시작되었고, 전 세계의 수천만 명의 사람들이 참여했다."]],"w":"10번에서 가장 유명한 공익 챌린지로 아이스버킷 챌린지가 나와요. 11번의 It은 그 챌린지가 시작된 이유를 설명하는 말이에요.","c":2},"h":"78e7c76236"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But many challenges are also carried out in the public interest.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 많은 챌린지가 공익을 위해 실시되기도 한다.","opts":["많은 챌린지는 돈을 벌기 위해서만 실시된다.","많은 챌린지는 공익을 위해서도 실시된다.","공익을 위한 챌린지는 거의 없다.","챌린지는 공익을 해친다."],"r":{"a":"2) 많은 챌린지는 공익을 위해서도 실시된다.","ev":"9번 문장","s":[[9,"But many challenges are also carried out in the public interest.","하지만 많은 챌린지가 공익을 위해 실시되기도 한다."]],"w":"are carried out은 ‘실시된다’, in the public interest는 ‘공익을 위해’예요. also(~도)가 있어서 재미뿐 아니라 공익을 위한 챌린지도 많다는 뜻이에요.","c":2},"h":"da14f5fbce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["무술가들은 소셜 미디어에서 유명해지려고 이 챌린지를 만들었다.","병뚜껑 챌린지에서는 얼음물을 자기 몸에 붓는다.","병뚜껑 챌린지는 영상을 지운 뒤에 완료된다.","유명인들이 소셜 미디어에서 한 뒤에 이 챌린지는 인기를 얻었다."],"opts":["Martial artists made the challenge to become famous on social media.","In the Bottle Cap Challenge, people pour ice water over themselves.","The Bottle Cap Challenge is complete after people delete the video.","The challenge became popular after celebrities did it on social media."],"r":{"a":"4) The challenge became popular after celebrities did it on social media.","ev":"6~7번 문장","s":[[6,"Actually, martial artists used to do this to increase the accuracy of their kicks.","사실, 무술가들이 발차기의 정확성을 높이기 위해서 이것을 하곤 했다."],[7,"It became popular when some celebrities started doing it on social media, calling it the Bottle Cap Challenge.","그것은 몇몇 유명인들이 소셜 미디어에서 하기 시작하고 나서 병뚜껑 챌린지라고 불렀을 때 인기를 얻게 되었다."]],"w":"7번에서 유명인들이 소셜 미디어에서 하기 시작했을 때 인기를 얻었다고 해요. 무술가들은 발차기 정확성을 높이려고 했고(6번), 얼음물은 아이스버킷 챌린지(10번)이며, 영상은 올려야(upload) 완료돼요(4~5번).","c":4},"h":"2f6e5b91e5"},{"n":9,"t":"sum","q":"In the Bottle Cap Challenge, people close a bottle cap loosely, (A) it with their toes, and (B) the video to their social media accounts.","ko":"병뚜껑 챌린지에서 사람들은 병뚜껑을 느슨하게 닫고, 발끝으로 그것을 (A) 그 영상을 소셜 미디어 계정에 (B).","oko":["(A) 던지고 / (B) 지운다","(A) 차고 / (B) 지운다","(A) 던지고 / (B) 올린다","(A) 열고 / (B) 지운다","(A) 차고 / (B) 올린다"],"opts":["(A) throw / (B) delete","(A) kick / (B) delete","(A) throw / (B) upload","(A) open / (B) delete","(A) kick / (B) upload"],"r":{"a":"5) (A) kick / (B) upload","ev":"2~4번 문장","s":[[2,"It starts with closing the cap loosely.","그것은 뚜껑을 느슨하게 닫는 것으로 시작한다."],[3,"Then they kick the cap with the tips of their toes to open it.","그러고 나서 그들은 그것을 열기 위해 그들의 발끝으로 뚜껑을 찬다."],[4,"They record this and upload the video to their social media accounts.","그들은 이것을 녹화하고 그 영상을 그들의 소셜 미디어 계정에 업로드한다."]],"w":"2번에서 뚜껑을 느슨하게 닫고, 3번에서 발끝으로 차서(kick) 열고, 4번에서 영상을 녹화해서 업로드(upload)해요.","c":5},"h":"a068122691"},{"n":10,"t":"fill","q":"The Ice Bucket Challenge was started to raise [A] of Lou Gehrig’s disease, and as a result, lots of people [B] about it.","ko":"아이스버킷 챌린지는 루게릭병에 대한 [A]을 높이려고 시작되었고, 결과적으로 많은 사람들이 그 병에 대해 [B].","bank":["awareness","learned","kicked","poured","uploaded","accuracy"],"bko":{"awareness":"인식","learned":"알게 되었다","kicked":"찼다","poured":"부었다","uploaded":"업로드했다","accuracy":"정확성"},"r":{"a":"[A] awareness, [B] learned","ev":"11~12번 문장","s":[[11,"It was started to raise awareness of Lou Gehrig’s disease, and tens of millions of people around the world participated.","그것은 루게릭병에 대한 인식을 높이기 위해 시작되었고, 전 세계의 수천만 명의 사람들이 참여했다."],[12,"As a result, lots of people learned about the disease.","결과적으로, 많은 사람들이 그 병에 대해 알게 되었다."]],"w":"11번에서 루게릭병에 대한 인식(awareness)을 높이려고 시작되었고, 12번에서 결과적으로 많은 사람들이 그 병에 대해 알게 되었어요(learned about).","c":null},"h":"1fe7b26318"}]},{"u":2,"id":"hk3-02-1","no":1,"ko":"입안에서 불꽃놀이가 팡팡!","items":[{"n":1,"t":"tf","q":"Pop Rocks give a popping sensation as they melt in your mouth.","ko":"파핑 캔디는 입안에서 녹을 때 터지는 느낌을 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They provide a unique sensation by popping as they melt in your mouth.","그것들은 입안에서 녹을 때 터짐으로써 독특한 느낌을 제공한다."]],"w":"4번에서 파핑 캔디는 입안에서 녹을 때 터짐으로써 독특한 느낌을 제공한다고 해요.","c":"T"},"h":"36d2aa9428"},{"n":2,"t":"tf","q":"Pop Rocks are made without any gas.","ko":"파핑 캔디는 가스 없이 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"To make Pop Rocks, carbon dioxide gas is poured into sugar water.","파핑 캔디를 만들기 위해서, 이산화탄소 가스는 설탕물에 부어진다."]],"w":"7번에서 파핑 캔디를 만들려면 이산화탄소 가스를 설탕물에 붓는다고 해요. 가스 없이 만든다는 말은 반대예요.","c":"F"},"h":"bd1f6e0201"},{"n":3,"t":"tf","q":"Carbon dioxide is also contained in many soft drinks.","ko":"이산화탄소는 많은 탄산음료에도 들어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Carbon dioxide is also contained in many soft drinks.","이산화탄소는 많은 탄산음료에도 들어 있다."]],"w":"11번에 Carbon dioxide is also contained in many soft drinks.가 그대로 있어요.","c":"T"},"h":"0f53af707f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When you eat it, you can feel tiny explosions in your mouth.)","ko":"그것을 먹을 때, 당신은 입안에서 ( ) 폭발들을 느낄 수 있다.","opts":["거대한","아주 작은","뜨거운","단단한"],"word":"tiny","r":{"a":"2) 아주 작은","ev":"2번 문장","s":[[2,"When you eat it, you can feel tiny explosions in your mouth.","그것을 먹을 때, 당신은 입안에서 작은 폭발들을 느낄 수 있다."]],"w":"입안에서 느끼는 폭발은 큰 폭발이 아니라 톡톡 터지는 작은 느낌이에요. tiny explosions는 ‘아주 작은 폭발들’이에요.","c":2},"h":"42da7b7091"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The key is carbon dioxide trapped inside the candy.)","ko":"비결은 사탕 내부에 ( ) 이산화탄소이다.","opts":["섞여 있는","녹아 있는","사라진","갇혀 있는"],"word":"trapped","r":{"a":"4) 갇혀 있는","ev":"6번 문장","s":[[6,"The key is carbon dioxide trapped inside the candy.","비결은 사탕 내부에 갇혀있는 이산화탄소이다."]],"w":"이산화탄소가 사탕 안에 갇혀 있다가 사탕이 녹으면 빠져나오며 터져요(9번). trapped는 ‘갇혀 있는’이에요.","c":4},"h":"4b9184a189"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen you eat them, the outer layer of sugar melts and the carbon dioxide gas escapes into the air.","ko":"밑줄 친 them이 가리키는 것은?","sko":"당신이 그것들을 먹을 때, 바깥의 설탕 층이 녹고 이산화탄소 가스가 공기 중으로 빠져나온다.","opts":["파핑 캔디","설탕물","탄산음료","아이스크림"],"r":{"a":"1) 파핑 캔디","ev":"3번, 9번 문장","s":[[3,"This is caused by candies called Pop Rocks.","이것은 파핑 캔디라고 불리는 사탕에 의해 일어난다."],[9,"When you eat them, the outer layer of sugar melts and the carbon dioxide gas escapes into the air.","당신이 그것들을 먹을 때, 바깥의 설탕 층이 녹고 이산화탄소 가스가 공기 중으로 빠져나온다."]],"w":"설탕 층이 녹고 가스가 빠져나오는 것은 파핑 캔디(Pop Rocks)를 먹을 때예요. 3번에서 소개된 Pop Rocks를 9번에서 them으로 받았어요.","c":1},"h":"00b6e518db"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why it feels like bubbles are popping in your mouth when you drink them!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 많은 탄산음료를 마실 때 입안에서 방울들이 터지고 있는 것처럼 느껴지는 이유이다!","opts":["그래서 탄산음료를 마시면 입안이 얼어붙는 느낌이 든다.","그래서 탄산음료는 파핑 캔디로 만들어진다.","그래서 탄산음료를 마실 때 입안에서 방울들이 터지는 것처럼 느껴진다.","그래서 탄산음료에는 설탕이 들어 있지 않다."],"r":{"a":"3) 그래서 탄산음료를 마실 때 입안에서 방울들이 터지는 것처럼 느껴진다.","ev":"12번 문장","s":[[12,"That’s why it feels like bubbles are popping in your mouth when you drink them!","그것이 많은 탄산음료를 마실 때 입안에서 방울들이 터지고 있는 것처럼 느껴지는 이유이다!"]],"w":"That’s why는 ‘그것이 ~한 이유이다’라는 뜻이에요. 탄산음료에 이산화탄소가 들어 있기 때문에(11번) 마실 때 방울이 터지는 것처럼 느껴져요.","c":3},"h":"ef07f81dc3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파핑 캔디는 열을 가해서 터지게 만든다.","파핑 캔디의 혼합물은 얼려져서 여러 조각으로 부서진다.","이산화탄소 가스는 먹은 뒤에도 사탕에 계속 남아 있다.","탄산음료에는 이산화탄소가 전혀 없다."],"opts":["Pop Rocks are made to pop by heating them.","The mixture for Pop Rocks is frozen and broken into pieces.","The carbon dioxide gas stays in the candy even after it is eaten.","Soft drinks have no carbon dioxide in them."],"r":{"a":"2) The mixture for Pop Rocks is frozen and broken into pieces.","ev":"8~9번 문장","s":[[8,"Then the mixture is frozen and broken into pieces.","그러고 나서 그 혼합물은 냉동되고 여러 조각들로 부서진다."],[9,"When you eat them, the outer layer of sugar melts and the carbon dioxide gas escapes into the air.","당신이 그것들을 먹을 때, 바깥의 설탕 층이 녹고 이산화탄소 가스가 공기 중으로 빠져나온다."]],"w":"8번에서 혼합물은 냉동되고 여러 조각들로 부서진다고 해요. 가스는 먹을 때 빠져나오고(9번), 탄산음료에도 이산화탄소가 들어 있어요(11번).","c":2},"h":"53b7515792"},{"n":9,"t":"sum","q":"Carbon dioxide is also in many (A), so it feels like (B) are popping in your mouth when you drink them.","ko":"이산화탄소는 많은 (A)에도 들어 있어서, 그것들을 마시면 입안에서 (B)이 터지는 것처럼 느껴진다.","oko":["(A) 아이스크림 / (B) 방울","(A) 탄산음료 / (B) 별","(A) 다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"No-shows cause problems for other customers.","노쇼는 다른 고객들에게 문제를 일으킨다."],[5,"For example, some people may not be able to board a train or plane because of unused tickets bought by no-shows.","예를 들어, 몇몇 사람들은 노쇼에 의해 구매된 사용되지 않은 표 때문에 기차나 비행기에 탑승하지 못할 수도 있다."]],"w":"4번에서 노쇼는 다른 고객들에게 문제를 일으킨다고 하고, 5번에서 기차나 비행기에 탑승하지 못하는 사람들을 예로 들어요. 식당에만 문제를 일으키는 것이 아니에요.","c":"F"},"h":"265d13f550"},{"n":3,"t":"tf","q":"A restaurant loses the chance to accept other customers while it waits for a no-show.","ko":"식당은 노쇼를 기다리는 동안 다른 고객들을 받을 기회를 잃는다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"In addition, the restaurant loses an opportunity to accept other customers while waiting for the no-show.","게다가, 식당은 노쇼를 기다리는 동안 다른 고객들을 받을 기회를 잃는다."]],"w":"10번에서 식당은 노쇼를 기다리는 동안 다른 고객들을 받을 기회를 잃는다(loses an opportunity to accept other customers)고 해요.","c":"T"},"h":"c15cbf93dc"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some customers never show up and don’t cancel beforehand.)","ko":"일부 고객들은 아예 나타나지 않고 ( ) 취소를 하지 않는다.","opts":["나중에","사전에","갑자기","천천히"],"word":"beforehand","r":{"a":"2) 사전에","ev":"2번 문장","s":[[2,"However, some customers never show up and don’t cancel beforehand.","하지만, 일부 고객들은 아예 나타나지 않고 사전에 취소를 하지 않는다."]],"w":"노쇼는 약속 전에 미리 취소하지 않는 사람이에요. beforehand는 ‘사전에, 미리’예요.","c":2},"h":"ba62f20443"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Many businesses try to prevent no-shows by charging ahead of time or making a blacklist.)","ko":"많은 사업체들은 미리 요금을 청구하거나 블랙리스트를 만듦으로써 노쇼를 ( ) 위해 노력한다.","opts":["늘리다","허락하다","기다리다","막다"],"word":"prevent","r":{"a":"4) 막다","ev":"12번 문장","s":[[12,"Nowadays, many businesses try to prevent no-shows by charging ahead of time or making a blacklist.","요즘에, 많은 사업체들은 미리 요금을 청구하거나 블랙리스트를 만듦으로써 노쇼를 막기 위해 노력한다."]],"w":"요금을 미리 받거나 블랙리스트를 만드는 것은 노쇼가 생기지 않게 하려는 노력이에요. prevent는 ‘막다’예요.","c":4},"h":"196461593f"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey can damage the business itself.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 사업체 자체에 피해를 입힐 수 있다.","opts":["노쇼들","기차와 비행기","다른 고객들","식당 종업원들"],"r":{"a":"1) 노쇼들","ev":"6~7번 문장","s":[[6,"In the restaurant business, no-shows are even worse.","요식업에서, 노쇼는 훨씬 더 심각하다."],[7,"They can damage the business itself.","그들은 사업체 자체에 피해를 입힐 수 있다."]],"w":"6번에서 요식업에서 노쇼가 훨씬 더 심각하다고 했고, 7번에서 사업체 자체에 피해를 입힐 수 있는 것은 그 노쇼들이에요.","c":1},"h":"f70b537785"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the restaurant business, no-shows are even worse.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"요식업에서, 노쇼는 훨씬 더 심각하다.","opts":["요식업에서는 노쇼가 거의 없다.","요식업에서는 노쇼가 환영받는다.","요식업에서는 노쇼가 훨씬 더 심각하다.","요식업에서는 노쇼가 기차에서 더 심각하다."],"r":{"a":"3) 요식업에서는 노쇼가 훨씬 더 심각하다.","ev":"6번 문장","s":[[6,"In the restaurant business, no-shows are even worse.","요식업에서, 노쇼는 훨씬 더 심각하다."]],"w":"even은 비교급 worse를 강조해서 ‘훨씬 더 나쁜’이라는 뜻이에요. 앞 5번의 기차·비행기 예시보다 식당에서는 더 심각하다는 말이에요.","c":3},"h":"8bfb3ba887"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["식당은 손님이 오지 않아도 추가 수입을 얻는다.","노쇼가 산 사용되지 않은 표 때문에 다른 사람이 탑승하지 못할 수 있다.","노쇼는 이제 사업체들에게 더 이상 문제가 아니다.","예약을 한 고객은 모두 노쇼라고 불린다."],"opts":["Restaurants earn extra money when customers do not come.","Unused tickets bought by no-shows can keep other people from boarding.","No-shows are no longer a problem for businesses.","All customers who make reservations are called no-shows."],"r":{"a":"2) Unused tickets bought by no-shows can keep other people from boarding.","ev":"5번 문장","s":[[5,"For example, some people may not be able to board a train or plane because of unused tickets bought by no-shows.","예를 들어, 몇몇 사람들은 노쇼에 의해 구매된 사용되지 않은 표 때문에 기차나 비행기에 탑승하지 못할 수도 있다."]],"w":"5번에서 노쇼가 산 쓰지 않은 표 때문에 일부 사람들이 기차나 비행기에 타지 못할 수도 있다고 해요. 식당은 오히려 돈을 못 받고(9번), 노쇼는 여전히 문제이며(13번), 노쇼는 예약하고 나타나지 않는 사람만을 말해요(2~3번).","c":2},"h":"52f5be014b"},{"n":9,"t":"sum","q":"To prevent no-shows, many businesses (A) ahead of time or make a (B), but no-shows still remain a problem.","ko":"노쇼를 막기 위해 많은 사업체들은 미리 (A)하거나 (B)을 만들지만, 노쇼는 여전히 문제로 남아 있다.","oko":["(A) 취소 / (B) 블랙리스트","(A) 요금 청구 / (B) 예약","(A) 기다림 / (B) 표","(A) 취소 / (B) 표","(A) 요금 청구 / (B) 블랙리스트"],"opts":["(A) cancel / (B) blacklist","(A) charge / (B) reservation","(A) wait / (B) ticket","(A) cancel / (B) ticket","(A) charge / (B) blacklist"],"r":{"a":"5) (A) charge / (B) blacklist","ev":"12~13번 문장","s":[[12,"Nowadays, many businesses try to prevent no-shows by charging ahead of time or making a blacklist.","요즘에, 많은 사업체들은 미리 요금을 청구하거나 블랙리스트를 만듦으로써 노쇼를 막기 위해 노력한다."],[13,"But no-shows still remain a problem for businesses.","하지만 노쇼는 여전히 사업체들에게 문젯거리로 남아있다."]],"w":"12번에서 사업체들은 미리 요금을 청구하거나(charge) 블랙리스트(blacklist)를 만들어 노쇼를 막으려 하고, 13번에서 그래도 노쇼는 여전히 문제로 남아 있다고 해요.","c":5},"h":"13675cdd2f"},{"n":10,"t":"fill","q":"If the people don’t come, the restaurant doesn’t get [A] for the work, and the food goes to [B].","ko":"사람들이 오지 않으면, 식당은 일에 대한 돈을 [A] 못하고, 음식은 [B]된다.","bank":["paid","waste","board","cancel","blacklist","tears"],"bko":{"paid":"돈을 받은","waste":"낭비","board":"탑승하다","cancel":"취소하다","blacklist":"블랙리스트","tears":"눈물"},"r":{"a":"[A] paid, [B] waste","ev":"9번 문장","s":[[9,"If the people don’t come, the restaurant doesn’t get paid for the work and the food goes to waste.","만약 그 사람들이 오지 않는다면, 식당은 일에 대한 돈을 받지 못하고 음식은 낭비된다."]],"w":"9번에서 사람들이 오지 않으면 식당은 일에 대한 돈을 받지 못하고(doesn’t get paid) 음식은 낭비돼요(goes to waste).","c":null},"h":"00714e3654"}]},{"u":2,"id":"hk3-02-3","no":3,"ko":"이런 건 안 주느니만 못해","items":[{"n":1,"t":"tf","q":"For Vietnamese people, cups symbolize the end of a relationship.","ko":"베트남 사람들에게 컵은 관계의 끝을 상징한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"For Vietnamese people, cups symbolize the end of a relationship since they often crack or break.","베트남 사람들에게, 컵은 자주 금이 가거나 깨지기 때문에 관계의 끝을 상징한다."]],"w":"5번에서 컵은 자주 금이 가거나 깨지기 때문에 관계의 끝을 상징한다고 해요.","c":"T"},"h":"e38c3e10d7"},{"n":2,"t":"tf","q":"In Russia, yellow flowers are good gifts because they bring good luck.","ko":"러시아에서 노란 꽃은 행운을 가져와서 좋은 선물이다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Never give yellow flowers as they are thought to be bad luck.","노란 꽃은 불운으로 여겨지므로 절대 주지 말아라."]],"w":"9번에서 노란 꽃은 불운(bad luck)으로 여겨지므로 절대 주지 말라고 해요. 행운이라는 말은 반대예요.","c":"F"},"h":"23e40bd564"},{"n":3,"t":"tf","q":"In Russia, even numbers of flowers are only given at funerals.","ko":"러시아에서 짝수의 꽃은 장례식에서만 주어진다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Even numbers of flowers are only given at funerals.","짝수의 꽃은 장례식에서만 주어진다."]],"w":"11번에 Even numbers of flowers are only given at funerals.가 그대로 있어요.","c":"T"},"h":"f6d2942a60"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For Vietnamese people, cups symbolize the end of a relationship.)","ko":"베트남 사람들에게, 컵은 관계의 끝을 ( ).","opts":["상징하다","깨뜨리다","숨기다","구입하다"],"word":"symbolize","r":{"a":"1) 상징하다","ev":"5번 문장","s":[[5,"For Vietnamese people, cups symbolize the end of a relationship since they often crack or break.","베트남 사람들에게, 컵은 자주 금이 가거나 깨지기 때문에 관계의 끝을 상징한다."]],"w":"컵이 자주 깨지니까 관계의 끝을 나타낸다는 뜻이에요. symbolize는 ‘상징하다’예요.","c":1},"h":"319a31bcd6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Handkerchiefs are not appropriate because they are used to dry a person’s tears.)","ko":"손수건은 사람의 눈물을 닦기 위해 쓰이기 때문에 ( ) 않다.","opts":["비싼","적절한","흔한","위험한"],"word":"appropriate","r":{"a":"2) 적절한","ev":"6번 문장","s":[[6,"Similarly, handkerchiefs are not appropriate because they are used to dry a person’s tears.","비슷하게, 손수건은 사람의 눈물을 닦기 위해 쓰이기 때문에 적절하지 않다."]],"w":"손수건은 눈물을 닦는 물건이라 선물로 알맞지 않다는 말이에요. not appropriate는 ‘적절하지 않은’이에요.","c":2},"h":"f51a719f76"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nNever give yellow flowers as they are thought to be bad luck.","ko":"밑줄 친 they가 가리키는 것은?","sko":"노란 꽃은 불운으로 여겨지므로 절대 주지 말아라.","opts":["러시아 사람들","꽃다발","장례식","노란 꽃"],"r":{"a":"4) 노란 꽃","ev":"8~9번 문장","s":[[8,"Meanwhile, in Russia, flowers are a favorite gift, but you must be careful when giving them.","한편, 러시아에서, 꽃은 가장 인기 있는 선물이지만, 그것을 줄 때 조심해야 한다."],[9,"Never give yellow flowers as they are thought to be bad luck.","노란 꽃은 불운으로 여겨지므로 절대 주지 말아라."]],"w":"불운으로 여겨지는 것은 사람이 아니라 노란 꽃(yellow flowers)이에요. 그래서 노란 꽃을 주지 말라고 해요.","c":4},"h":"178cae59e0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is especially true when he or she is from another country.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그 또는 그녀가 다른 나라 출신일 때 특히 그렇다.","opts":["선물을 고르는 것은 다른 나라 사람에게는 쉽다.","선물을 고르는 것은 같은 나라 사람일 때 특히 어렵다.","선물을 고르는 것은 상대가 다른 나라 출신일 때 특히 어렵다.","선물은 다른 나라 사람에게 줄 필요가 없다."],"r":{"a":"3) 선물을 고르는 것은 상대가 다른 나라 출신일 때 특히 어렵다.","ev":"1~2번 문장","s":[[1,"Getting a gift for a boyfriend or girlfriend can be difficult.","남자친구 또는 여자친구를 위해 선물을 마련하는 것은 어려울 수 있다."],[2,"This is especially true when he or she is from another country.","이것은 그 또는 그녀가 다른 나라 출신일 때 특히 그렇다."]],"w":"1번에서 선물을 마련하는 것이 어려울 수 있다고 하고, 2번의 This가 그 내용이에요. especially true는 ‘특히 그렇다’이고, 다른 나라 출신일 때 더 어렵다는 뜻이에요.","c":3},"h":"b0a5fcb686"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["러시아에서는 꽃을 선물로 주면 안 된다.","러시아에서는 꽃다발에 홀수의 꽃을 넣어야 한다.","베트남에서는 손수건이 가장 좋은 선물이다.","러시아에서 짝수의 꽃은 기쁜 날에 주어진다."],"opts":["In Russia, flowers should never be given as gifts.","In Russia, a bouquet should have an odd number of flowers.","In Vietnam, handkerchiefs are the best gifts.","In Russia, even numbers of flowers are given on happy days."],"r":{"a":"2) In Russia, a bouquet should have an odd number of flowers.","ev":"10번 문장","s":[[10,"In addition, always give bouquets with an odd number of flowers.","또한, 항상 홀수의 꽃으로 된 꽃다발을 줘라."]],"w":"10번에서 항상 홀수의 꽃으로 된 꽃다발을 주라고 해요. 러시아에서 꽃은 인기 있는 선물이고(8번), 베트남에서 손수건은 안 좋은 선물이며(4번), 짝수는 장례식에서만 줘요(11번).","c":2},"h":"b207ec4fd9"},{"n":9,"t":"sum","q":"In Vietnam, cups and handkerchiefs are (A) gifts because cups mean the end of a relationship and handkerchiefs represent (B) after a breakup.","ko":"베트남에서 컵과 손수건은 (A) 선물인데, 컵은 관계의 끝을, 손수건은 이별 후의 (B)을 나타내기 때문이다.","oko":["(A) 좋은 / (B) 기쁨","(A) 안 좋은 / (B) 행운","(A) 비싼 / (B) 슬픔","(A) 좋은 / (B) 슬픔","(A) 안 좋은 / (B) 슬픔"],"opts":["(A) good / (B) joy","(A) bad / (B) luck","(A) expensive / (B) sadness","(A) good / (B) sadness","(A) bad / (B) sadness"],"r":{"a":"5) (A) bad / (B) sadness","ev":"4~7번 문장","s":[[4,"In Vietnam, cups and handkerchiefs are very bad gifts.","베트남에서, 컵과 손수건은 매우 안 좋은 선물이다."],[5,"For Vietnamese people, cups symbolize the end of a relationship since they often crack or break.","베트남 사람들에게, 컵은 자주 금이 가거나 깨지기 때문에 관계의 끝을 상징한다."],[6,"Similarly, handkerchiefs are not appropriate because they are used to dry a person’s tears.","비슷하게, 손수건은 사람의 눈물을 닦기 위해 쓰이기 때문에 적절하지 않다."],[7,"In other words, they represent sadness after a breakup.","다시 말해서, 그것은 이별 후의 슬픔을 나타낸다."]],"w":"4번에서 베트남에서는 컵과 손수건이 매우 안 좋은(bad) 선물이라 하고, 5번에서 컵은 관계의 끝을, 7번에서 손수건은 이별 후의 슬픔(sadness)을 나타낸다고 해요.","c":5},"h":"e242e65d45"},{"n":10,"t":"fill","q":"In Russia, never give [A] flowers as they are thought to be bad luck, and give an [B] number of flowers because even numbers are only for funerals.","ko":"러시아에서는 [A] 꽃은 불운으로 여겨지므로 절대 주지 말고, 짝수의 꽃은 장례식에서만 주어지므로 [B] 개수의 꽃을 줘라.","bank":["yellow","odd","even","cups","tears","careful"],"bko":{"yellow":"노란색의","odd":"홀수의","even":"짝수의","cups":"컵들","tears":"눈물","careful":"조심하는"},"r":{"a":"[A] yellow, [B] odd","ev":"9~11번 문장","s":[[9,"Never give yellow flowers as they are thought to be bad luck.","노란 꽃은 불운으로 여겨지므로 절대 주지 말아라."],[10,"In addition, always give bouquets with an odd number of flowers.","또한, 항상 홀수의 꽃으로 된 꽃다발을 줘라."],[11,"Even numbers of flowers are only given at funerals.","짝수의 꽃은 장례식에서만 주어진다."]],"w":"9번에서 노란 꽃(yellow flowers)은 불운으로 여겨져 주면 안 되고, 10~11번에서 짝수는 장례식에서만 주니까 항상 홀수(odd)의 꽃을 줘야 해요.","c":null},"h":"e35be10e39"}]},{"u":2,"id":"hk3-02-4","no":4,"ko":"집 나와라 뚝딱!","items":[{"n":1,"t":"tf","q":"A single 3D-printed house takes only about a day to build.","ko":"3D 프린터로 만든 집 한 채는 짓는 데 겨우 약 하루가 걸린다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Surprisingly, a single 3D-printed house takes only about a day to build.","놀랍게도, 3D 프린터로 만든 집 한 채는 짓는 데 겨우 약 하루가 걸린다."]],"w":"2번에 a single 3D-printed house takes only about a day to build가 그대로 있어요.","c":"T"},"h":"b595543b81"},{"n":2,"t":"tf","q":"A lot of workers are needed to control the 3D printer.","ko":"3D 프린터를 제어하는 데 많은 작업자가 필요하다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"It doesn’t even require a lot of workers to construct it because the 3D printer is controlled by special software on a tablet.","3D 프린터는 태블릿의 특별한 소프트웨어로 제어되기 때문에 그것을 건설하는 데 많은 작업자들을 필요로 하지도 않는다."]],"w":"3번에서 3D 프린터는 태블릿의 특별한 소프트웨어로 제어되기 때문에 많은 작업자를 필요로 하지도 않는다고 해요. 많은 작업자가 필요하다는 말은 반대예요.","c":"F"},"h":"0d12aa41a5"},{"n":3,"t":"tf","q":"A 3D-printed house can remain standing through hurricanes and earthquakes.","ko":"3D 프린터로 만든 집은 폭풍과 지진 속에서도 서 있을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"It can even remain standing through hurricanes and earthquakes.","그것은 심지어 폭풍과 지진 속에서도 서 있을 수 있다."]],"w":"7번에 It can even remain standing through hurricanes and earthquakes.가 그대로 있어요.","c":"T"},"h":"2e26ebafe8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It doesn’t even require a lot of workers to construct it.)","ko":"그것을 건설하는 데 많은 작업자들을 ( ) 하지도 않는다.","opts":["판매하다","거절하다","필요로 하다","허락하다"],"word":"require","r":{"a":"3) 필요로 하다","ev":"3번 문장","s":[[3,"It doesn’t even require a lot of workers to construct it because the 3D printer is controlled by special software on a tablet.","3D 프린터는 태블릿의 특별한 소프트웨어로 제어되기 때문에 그것을 건설하는 데 많은 작업자들을 필요로 하지도 않는다."]],"w":"doesn’t require a lot of workers는 ‘많은 작업자들을 필요로 하지 않는다’예요. 소프트웨어가 프린터를 제어하기 때문에 사람이 많이 필요하지 않아요.","c":3},"h":"7d0407ff7c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In the future, we may be able to make entire cities with the push of a button.)","ko":"미래에, 우리는 버튼 한 번 누르는 것으로 도시 ( )를 만들 수 있을지도 모른다.","opts":["전체의","작은","오래된","새로운"],"word":"entire","r":{"a":"1) 전체의","ev":"10번 문장","s":[[10,"In the future, we may be able to make entire cities with the push of a button.","미래에, 우리는 버튼 한 번 누르는 것으로 도시 전체를 만들 수 있을지도 모른다."]],"w":"집 한 채가 아니라 도시 전체를 만든다는 뜻이에요. entire cities는 ‘도시 전체’예요.","c":1},"h":"b9d590fb39"},{"n":6,"t":"ref","q":"What does the underlined \"this program\" refer to?\nWith this program, it can be built by a small crew of four to six people in a day.","ko":"밑줄 친 this program이 가리키는 것은?","sko":"이 프로그램으로, 그것은 네 명에서 여섯 명으로 된 작은 무리에 의해 하루 안에 지어질 수 있다.","opts":["3D 프린터","태블릿의 특별한 소프트웨어","작은 작업팀","기초적인 구조물"],"r":{"a":"2) 태블릿의 특별한 소프트웨어","ev":"3~4번 문장","s":[[3,"It doesn’t even require a lot of workers to construct it because the 3D printer is controlled by special software on a tablet.","3D 프린터는 태블릿의 특별한 소프트웨어로 제어되기 때문에 그것을 건설하는 데 많은 작업자들을 필요로 하지도 않는다."],[4,"With this program, it can be built by a small crew of four to six people in a day.","이 프로그램으로, 그것은 네 명에서 여섯 명으로 된 작은 무리에 의해 하루 안에 지어질 수 있다."]],"w":"3번에서 3D 프린터가 태블릿의 특별한 소프트웨어로 제어된다고 했고, 4번의 this program은 그 소프트웨어를 가리켜요.","c":2},"h":"972ae61762"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The workers just have to watch the printer building the basic structure and make a few adjustments.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"작업자들은 프린터가 기초적인 구조물을 짓고 있는 것을 지켜보고 몇 가지를 조정하기만 하면 된다.","opts":["작업자들은 기초 구조물을 직접 모두 쌓아야 한다.","작업자들은 프린터를 지켜볼 수 없다.","작업자들은 프린터를 전혀 조정할 필요가 없다.","작업자들은 프린터가 기초 구조물을 짓는 것을 지켜보고 몇 가지를 조정하기만 하면 된다."],"r":{"a":"4) 작업자들은 프린터가 기초 구조물을 짓는 것을 지켜보고 몇 가지를 조정하기만 하면 된다.","ev":"5번 문장","s":[[5,"The workers just have to watch the printer building the basic structure and make a few adjustments.","작업자들은 프린터가 기초적인 구조물을 짓고 있는 것을 지켜보고 몇 가지를 조정하기만 하면 된다."]],"w":"just have to는 ‘~하기만 하면 된다’예요. watch the printer building은 ‘프린터가 짓고 있는 것을 지켜보다’이고, make a few adjustments는 ‘몇 가지를 조정하다’예요.","c":4},"h":"e49fa3925f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["3D 프린터로 만든 집은 짓는 데 약 1년이 걸린다.","3D 프린터로 만든 집은 앞으로 더 비싸질 것이다.","기술이 개선될수록 3D 프린터로 만든 집은 더 싸고 빠르게 지을 수 있을 것이다.","작업자들은 기초 구조물을 손으로 직접 만들어야 한다."],"opts":["A 3D-printed house takes about a year to build.","3D-printed houses will become more expensive in the future.","As technology improves, 3D-printed houses will become cheaper and faster to build.","The workers must make the basic structure by hand."],"r":{"a":"3) As technology improves, 3D-printed houses will become cheaper and faster to build.","ev":"9번 문장","s":[[9,"As technology improves, 3D-printed houses will become cheaper and faster to build, and their quality will increase.","기술이 개선될수록, 3D 프린터로 만든 집은 더 저렴하고 빠르게 지을 수 있을 것이고, 그것의 품질은 높아질 것이다."]],"w":"9번에서 기술이 개선될수록 더 저렴하고 빠르게 지을 수 있고 품질도 높아진다고 해요. 짓는 데 하루가 걸리고(2번), 기초 구조물은 프린터가 짓는다고 해요(5번).","c":3},"h":"09370f552e"},{"n":9,"t":"sum","q":"A 3D-printed house doesn’t need many workers because the printer is controlled by (A), and a small (B) of four to six people can build it in a day.","ko":"3D 프린터로 만든 집은 프린터가 (A)로 제어되기 때문에 많은 작업자가 필요 없고, 네 명에서 여섯 명의 작은 (B)이 하루 만에 지을 수 있다.","oko":["(A) 작업자 / (B) 팀","(A) 태블릿 / (B) 도시","(A) 소프트웨어 / (B) 비용","(A) 날씨 / (B) 팀","(A) 소프트웨어 / (B) 팀"],"opts":["(A) workers / (B) crew","(A) tablets / (B) city","(A) software / (B) cost","(A) weather / (B) crew","(A) software / (B) crew"],"r":{"a":"5) (A) software / (B) crew","ev":"3~4번 문장","s":[[3,"It doesn’t even require a lot of workers to construct it because the 3D printer is controlled by special software on a tablet.","3D 프린터는 태블릿의 특별한 소프트웨어로 제어되기 때문에 그것을 건설하는 데 많은 작업자들을 필요로 하지도 않는다."],[4,"With this program, it can be built by a small crew of four to six people in a day.","이 프로그램으로, 그것은 네 명에서 여섯 명으로 된 작은 무리에 의해 하루 안에 지어질 수 있다."]],"w":"3번에서 프린터가 태블릿의 특별한 소프트웨어(software)로 제어된다고 하고, 4번에서 네 명에서 여섯 명의 작은 팀(crew)이 하루 만에 지을 수 있다고 해요.","c":5},"h":"cae6c5de80"},{"n":10,"t":"fill","q":"This structure is so [A] that the house can [B] extreme weather.","ko":"이 구조물은 매우 [A] 그 집은 극심한 날씨를 [B] 수 있다.","bank":["strong","withstand","controlled","improve","earthquake","button"],"bko":{"strong":"튼튼한","withstand":"견디다","controlled":"제어된","improve":"개선되다","earthquake":"지진","button":"버튼"},"r":{"a":"[A] strong, [B] withstand","ev":"6번 문장","s":[[6,"This structure is so strong that the house can withstand extreme weather.","이 구조물은 매우 튼튼해서 그 집은 극심한 날씨를 견딜 수 있다."]],"w":"6번에서 구조물이 매우 튼튼해서(so strong) 집이 극심한 날씨를 견딜 수(withstand) 있다고 해요.","c":null},"h":"bca4bed73b"}]},{"u":3,"id":"hk3-03-1","no":1,"ko":"매일매일이 설레는 이유","items":[{"n":1,"t":"tf","q":"There is a different gift behind each door of an Advent calendar.","ko":"강림절 달력의 각각의 문 뒤에는 서로 다른 선물이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It has 24 little “doors,” and there is a different gift behind each one.","이것에는 24개의 작은 ‘문’이 있고, 각각의 문 뒤에는 다른 선물이 있다."]],"w":"3번 문장에 there is a different gift behind each one(각각의 문 뒤에는 다른 선물이 있다)이 그대로 나와요.","c":"T"},"h":"cb0b643201"},{"n":2,"t":"tf","q":"You open all the doors of an Advent calendar on December 1.","ko":"당신은 12월 1일에 강림절 달력의 모든 문을 연다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"From December 1, you open one door a day.","12월 1일부터, 당신은 하루에 하나의 문을 연다."]],"w":"4번 문장에서 12월 1일부터 하루에 문 하나씩(one door a day) 연다고 해요. 한꺼번에 모두 여는 것이 아니에요.","c":"F"},"h":"a3ad110d63"},{"n":3,"t":"tf","q":"Beauty product samples can be behind the doors of an Advent calendar.","ko":"화장품 샘플이 강림절 달력의 문 뒤에 있을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Beauty product samples or popular character figures can be behind the doors!","화장품 샘플이나 인기 있는 캐릭터 인형들이 문 뒤에 있을 수 있다!"]],"w":"8번 문장에 Beauty product samples ... can be behind the doors!(화장품 샘플 ... 이 문 뒤에 있을 수 있다)라고 나와요.","c":"T"},"h":"0320f53843"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Usually, Advent calendars contain chocolates, sweets, or Christmas decorations.)","ko":"보통, 강림절 달력에는 초콜릿, 사탕, 또는 크리스마스 장식이 ( ).","opts":["담고 있다","팔고 있다","버리고 있다","빌려 주고 있다"],"word":"contain","r":{"a":"1) 담고 있다","ev":"6번 문장","s":[[6,"Usually, Advent calendars contain chocolates, sweets, or Christmas decorations.","보통, 강림절 달력에는 초콜릿, 사탕, 또는 크리스마스 장식이 들어 있다."]],"w":"6번 문장은 달력 안에 무엇이 들어 있는지 말해요. contain(담고 있다)은 안에 넣고 있다는 뜻이라서 '초콜릿, 사탕, 장식이 들어 있다'가 돼요.","c":1},"h":"0b01f4ab6d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You can include whatever the receiver likes, so the handmade calendars are more personal.)","ko":"받는 사람이 좋아하는 무엇이든지 넣을 수 있어서, 수제 달력은 더 ( ) 느낌이다.","opts":["값비싼","평범한","개인적인","복잡한"],"word":"personal","r":{"a":"3) 개인적인","ev":"11번 문장","s":[[11,"You can include whatever the receiver likes, so the handmade calendars are more personal.","받는 사람이 좋아하는 무엇이든지 넣을 수 있어서, 수제 달력은 더 개인적이다."]],"w":"수제 달력에는 받는 사람이 좋아하는 것을 마음대로 넣을 수 있어요. 그래서 그 사람만을 위한 '개인적인' 달력이 되는 거예요.","c":3},"h":"367afc9177"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nYou can fill it with letters or photos and give it to your family or friends.","ko":"밑줄 친 it이 가리키는 것은?","sko":"당신은 그것을 편지나 사진으로 채워 가족이나 친구들에게 줄 수 있다.","opts":["24개의 작은 문","당신이 직접 만든 강림절 달력","크리스마스 장식","가족이나 친구들"],"r":{"a":"2) 당신이 직접 만든 강림절 달력","ev":"9~10번 문장","s":[[9,"You can also make your own Advent calendar.","당신은 또한 당신 자신의 강림절 달력을 만들 수 있다."],[10,"You can fill it with letters or photos and give it to your family or friends.","당신은 그것을 편지나 사진으로 채워 가족이나 친구들에게 줄 수 있다."]],"w":"편지나 사진으로 채워서 가족에게 주는 것은 9번에서 말한 '당신 자신의 강림절 달력'이에요. 10번의 it은 9번 문장의 own Advent calendar를 받은 말이에요.","c":2},"h":"b4f93b1605"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Advent calendars let you enjoy every day you spend waiting for Christmas.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"강림절 달력은 당신이 크리스마스를 기다리며 보내는 매일을 즐기게 해준다.","opts":["강림절 달력은 크리스마스를 기다리는 시간을 하루로 줄여 준다.","강림절 달력은 크리스마스 당일에만 열어 볼 수 있다.","강림절 달력은 크리스마스를 기다리는 일을 잊게 해준다.","강림절 달력은 크리스마스를 기다리는 날들을 매일 즐겁게 보내게 해준다."],"r":{"a":"4) 강림절 달력은 크리스마스를 기다리는 날들을 매일 즐겁게 보내게 해준다.","ev":"12번 문장","s":[[12,"Advent calendars let you enjoy every day you spend waiting for Christmas.","강림절 달력은 당신이 크리스마스를 기다리며 보내는 매일을 즐기게 해준다."]],"w":"let you enjoy는 '당신이 즐기게 해준다', every day you spend waiting for Christmas는 '크리스마스를 기다리며 보내는 매일'이에요. 기다리는 날들을 매일 즐겁게 해준다는 뜻이에요.","c":4},"h":"e7bcb60825"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["당신은 강림절 달력의 문을 크리스마스 당일에만 열 수 있다.","강림절 달력에는 초콜릿만 들어 있다.","직접 만든 강림절 달력을 가족이나 친구들에게 줄 수 있다.","직접 만든 강림절 달력에는 만든 사람이 좋아하는 것만 넣어야 한다."],"opts":["You can open the doors of an Advent calendar only on Christmas Day.","Advent calendars contain only chocolates.","You can give your own Advent calendar to your family or friends.","A handmade Advent calendar should include only what the maker likes."],"r":{"a":"3) You can give your own Advent calendar to your family or friends.","ev":"4번, 6~7번, 10~11번 문장","s":[[4,"From December 1, you open one door a day.","12월 1일부터, 당신은 하루에 하나의 문을 연다."],[6,"Usually, Advent calendars contain chocolates, sweets, or Christmas decorations.","보통, 강림절 달력에는 초콜릿, 사탕, 또는 크리스마스 장식이 들어 있다."],[7,"Sometimes, more special items are found inside them.","가끔은, 더 특별한 물건들이 그것 안에서 발견된다."],[10,"You can fill it with letters or photos and give it to your family or friends.","당신은 그것을 편지나 사진으로 채워 가족이나 친구들에게 줄 수 있다."],[11,"You can include whatever the receiver likes, so the handmade calendars are more personal.","받는 사람이 좋아하는 무엇이든지 넣을 수 있어서, 수제 달력은 더 개인적이다."]],"w":"10번에서 직접 만든 달력을 가족이나 친구들에게 줄 수 있다고 해요. 문은 12월 1일부터 하루에 하나씩 열고(4번), 달력에는 초콜릿 외에도 사탕·장식 등이 있으며(6번), 수제 달력에는 받는 사람이 좋아하는 것을 넣어요(11번).","c":3},"h":"9df3552b19"},{"n":9,"t":"sum","q":"An Advent calendar has 24 little doors. You (A) one door a day from December 1, and you get a (B) every day until Christmas.","ko":"강림절 달력에는 24개의 작은 문이 있다. 12월 1일부터 하루에 문 하나씩 (A)하고, 크리스마스까지 매일 (B)을 받는다.","oko":["(A) 닫는다 / (B) 깜짝 선물","(A) 연다 / (B) 깜짝 선물","(A) 연다 / (B) 문제","(A) 산다 / (B) 편지","(A) 부순다 / (B) 소원"],"opts":["(A) close / (B) surprise","(A) open / (B) surprise","(A) open / (B) problem","(A) buy / (B) letter","(A) break / (B) wish"],"r":{"a":"2) (A) open / (B) surprise","ev":"4~5번 문장","s":[[4,"From December 1, you open one door a day.","12월 1일부터, 당신은 하루에 하나의 문을 연다."],[5,"You receive a surprise every day until Christmas.","당신은 크리스마스까지 매일 깜짝 선물을 받는다."]],"w":"4번에서 하루에 문 하나를 여니까(A) open이고, 5번에서 크리스마스까지 매일 깜짝 선물(surprise)을 받아요(B).","c":2},"h":"41228d2f36"},{"n":10,"t":"fill","q":"A [A] Advent calendar is more [B] because you can include whatever the receiver likes.","ko":"[A] 강림절 달력은 받는 사람이 좋아하는 무엇이든지 넣을 수 있어서 더 [B] 달력이다.","bank":["handmade","personal","doors","waiting","December","receive"],"bko":{"handmade":"수제의","personal":"개인적인","doors":"문들","waiting":"기다리는 것","December":"12월","receive":"받다"},"r":{"a":"[A] handmade, [B] personal","ev":"11번 문장","s":[[11,"You can include whatever the receiver likes, so the handmade calendars are more personal.","받는 사람이 좋아하는 무엇이든지 넣을 수 있어서, 수제 달력은 더 개인적이다."]],"w":"11번에서 받는 사람이 좋아하는 것을 넣을 수 있어서 수제 달력(handmade)은 더 개인적(personal)이라고 해요.","c":null},"h":"e8ffb30ee1"}]},{"u":3,"id":"hk3-03-2","no":2,"ko":"씹어서 예방해요!","items":[{"n":1,"t":"tf","q":"The S. mutans bacteria mistake xylitol for sugar and eat it.","ko":"뮤탄스균은 자일리톨을 설탕으로 착각하고 먹는다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"For this reason, when you eat xylitol, the S. mutans bacteria mistake it for sugar and consume it.","이러한 이유 때문에, 당신이 자일리톨을 먹을 때, 뮤탄스균은 그것을 설탕으로 착각하고 먹는다."]],"w":"8번 문장에서 the S. mutans bacteria mistake it for sugar and consume it이라고 해요. 자일리톨을 설탕으로 착각해서 먹는다는 내용과 같아요.","c":"T"},"h":"75e0175dfc"},{"n":2,"t":"tf","q":"S. mutans can digest xylitol and get energy from it.","ko":"뮤탄스균은 자일리톨을 소화해서 그것으로부터 에너지를 얻을 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"But they cannot digest xylitol, so they get no energy from it.","하지만 그것들은 자일리톨을 소화하지 못해서, 자일리톨로부터 에너지를 얻지 못한다."]],"w":"9번 문장에서 they cannot digest xylitol, so they get no energy from it이라고 해요. 소화하지 못하고 에너지도 얻지 못하니 반대 내용이에요.","c":"F"},"h":"2dcd2d5c3a"},{"n":3,"t":"tf","q":"Some of the bacteria in your mouth cause tooth decay.","ko":"입안의 세균 중 일부는 충치를 일으킨다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"Many types of bacteria live in your mouth.","많은 종류의 세균이 당신의 입안에 산다."],[2,"Among them, there are harmful bacteria that cause tooth decay.","그것들 중에는, 충치를 유발하는해로운 세균이 있다."]],"w":"1번에서 입안에 많은 종류의 세균이 산다고 하고, 2번에서 그중에 충치를 일으키는 해로운 세균이 있다고 해요.","c":"T"},"h":"8adf0b95c4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Among them, there are harmful bacteria that cause tooth decay.)","ko":"그것들 중에는, 충치를 일으키는 ( ) 세균이 있다.","opts":["유용한","새로운","해로운","귀여운"],"word":"harmful","r":{"a":"3) 해로운","ev":"2번 문장","s":[[2,"Among them, there are harmful bacteria that cause tooth decay.","그것들 중에는, 충치를 유발하는해로운 세균이 있다."]],"w":"충치를 일으키는 세균이니 몸에 나쁜 세균이에요. harmful은 '해로운'이라는 뜻이에요.","c":3},"h":"96da45b3b8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the S. mutans bacteria mistake it for sugar and consume it.)","ko":"...뮤탄스균은 그것을 설탕으로 착각하고 그것을 ( ).","opts":["버린다","먹는다","만든다","숨긴다"],"word":"consume","r":{"a":"2) 먹는다","ev":"8번 문장","s":[[8,"For this reason, when you eat xylitol, the S. mutans bacteria mistake it for sugar and consume it.","이러한 이유 때문에, 당신이 자일리톨을 먹을 때, 뮤탄스균은 그것을 설탕으로 착각하고 먹는다."]],"w":"세균이 자일리톨을 설탕으로 착각하는 이유는 먹으려고 하기 때문이에요. consume은 여기서 '먹다'라는 뜻이고, 10번에서 먹으려는 시도(attempts to eat)로 이어져요.","c":2},"h":"8e79381460"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nBut they cannot digest xylitol, so they get no energy from it.","ko":"밑줄 친 they가 가리키는 것은?","sko":"하지만 그것들은 자일리톨을 소화하지 못해서, 자일리톨로부터 에너지를 얻지 못한다.","opts":["설탕","자일리톨","당신의 입","뮤탄스균"],"r":{"a":"4) 뮤탄스균","ev":"8~9번 문장","s":[[8,"For this reason, when you eat xylitol, the S. mutans bacteria mistake it for sugar and consume it.","이러한 이유 때문에, 당신이 자일리톨을 먹을 때, 뮤탄스균은 그것을 설탕으로 착각하고 먹는다."],[9,"But they cannot digest xylitol, so they get no energy from it.","하지만 그것들은 자일리톨을 소화하지 못해서, 자일리톨로부터 에너지를 얻지 못한다."]],"w":"자일리톨을 먹었다가 소화하지 못하는 쪽은 8번의 the S. mutans bacteria(뮤탄스균)예요. 9번의 they는 그 세균들을 받은 말이에요.","c":4},"h":"2ed5c7f2c7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In other words, xylitol causes them to starve to death!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다시 말해서, 자일리톨은 그것들이 굶어 죽도록 만든다!","opts":["자일리톨은 세균이 굶어 죽게 만든다.","자일리톨은 세균에게 더 많은 먹이를 준다.","자일리톨은 세균을 빠르게 자라게 한다.","자일리톨은 세균을 설탕으로 바꾼다."],"r":{"a":"1) 자일리톨은 세균이 굶어 죽게 만든다.","ev":"11번 문장","s":[[11,"In other words, xylitol causes them to starve to death!","다시 말해서, 자일리톨은 그것들이 굶어 죽도록 만든다!"]],"w":"「cause + 목적어 + to-v」는 '~가 …하도록 만들다'예요. xylitol causes them to starve to death는 '자일리톨이 세균을 굶어 죽게 만든다'예요.","c":1},"h":"ed0af2c70e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["자일리톨은 뮤탄스균이 쉽게 소화하는 설탕이다.","뮤탄스균은 자일리톨로부터 에너지를 얻는다.","세균은 자일리톨을 먹으려고 몇 번 시도한 뒤 에너지가 바닥난다.","해로운 세균은 입안에 전혀 살지 않는다."],"opts":["Xylitol is a sugar that S. mutans digests easily.","S. mutans gets energy from xylitol.","The bacteria run out of energy after a few attempts to eat xylitol.","Harmful bacteria never live in your mouth."],"r":{"a":"3) The bacteria run out of energy after a few attempts to eat xylitol.","ev":"2번, 9~10번 문장","s":[[2,"Among them, there are harmful bacteria that cause tooth decay.","그것들 중에는, 충치를 유발하는해로운 세균이 있다."],[9,"But they cannot digest xylitol, so they get no energy from it.","하지만 그것들은 자일리톨을 소화하지 못해서, 자일리톨로부터 에너지를 얻지 못한다."],[10,"After a few attempts to eat xylitol, the bacteria finally run out of energy, die, and fall out of your mouth.","자일리톨을 먹으려는 몇 차례 시도 후에, 그 세균은 마침내 에너지를 다 써버리고, 죽어서, 당신의 입에서 떨어져 나온다."]],"w":"10번에서 세균은 자일리톨을 먹으려는 몇 번의 시도 후에 에너지가 바닥나요. 소화하지 못해서 에너지도 못 얻고(9번), 해로운 세균은 입안에 있어요(2번).","c":3},"h":"2c49a73b96"},{"n":9,"t":"sum","q":"The S. mutans bacteria eat xylitol because they (A) it for sugar, but they cannot (B) it, so they get no energy.","ko":"뮤탄스균은 자일리톨을 설탕으로 (A)해서 먹지만, 그것을 (B)하지 못해서 에너지를 얻지 못한다.","oko":["(A) 숨겨서 / (B) 사지","(A) 착각해서 / (B) 숨기지","(A) 착각해서 / (B) 만들지","(A) 잊어서 / (B) 소화하지","(A) 착각해서 / (B) 소화하지"],"opts":["(A) hide / (B) buy","(A) mistake / (B) hide","(A) mistake / (B) make","(A) forget / (B) digest","(A) mistake / (B) digest"],"r":{"a":"5) (A) mistake / (B) digest","ev":"8~9번 문장","s":[[8,"For this reason, when you eat xylitol, the S. mutans bacteria mistake it for sugar and consume it.","이러한 이유 때문에, 당신이 자일리톨을 먹을 때, 뮤탄스균은 그것을 설탕으로 착각하고 먹는다."],[9,"But they cannot digest xylitol, so they get no energy from it.","하지만 그것들은 자일리톨을 소화하지 못해서, 자일리톨로부터 에너지를 얻지 못한다."]],"w":"8번에서 세균은 자일리톨을 설탕으로 착각하고(mistake) 먹어요. 하지만 9번에서 소화하지(digest) 못해서 에너지를 얻지 못해요.","c":5},"h":"1a355964c0"},{"n":10,"t":"fill","q":"After a few attempts to eat xylitol, the bacteria run out of [A] and die. In other words, xylitol causes them to [B] to death.","ko":"자일리톨을 먹으려는 몇 번의 시도 후에, 세균은 [A]을 다 써버리고 죽는다. 다시 말해서, 자일리톨은 그것들이 죽을 때까지 [B]하게 만든다.","bank":["energy","starve","mouth","harmful","digest","natural"],"bko":{"energy":"에너지","starve":"굶다","mouth":"입","harmful":"해로운","digest":"소화하다","natural":"천연의"},"r":{"a":"[A] energy, [B] starve","ev":"10~11번 문장","s":[[10,"After a few attempts to eat xylitol, the bacteria finally run out of energy, die, and fall out of your mouth.","자일리톨을 먹으려는 몇 차례 시도 후에, 그 세균은 마침내 에너지를 다 써버리고, 죽어서, 당신의 입에서 떨어져 나온다."],[11,"In other words, xylitol causes them to starve to death!","다시 말해서, 자일리톨은 그것들이 굶어 죽도록 만든다!"]],"w":"10번에서 세균은 에너지(energy)를 다 써버리고 죽어요. 11번에서 다시 말해 자일리톨은 그것들이 굶어(starve) 죽게 만든다고 정리해요.","c":null},"h":"f165768997"}]},{"u":3,"id":"hk3-03-3","no":3,"ko":"현금은 됐어요, 정말로요!","items":[{"n":1,"t":"tf","q":"In China, people can pay for things by scanning a QR code with their phones.","ko":"중국에서, 사람들은 휴대폰으로 QR 코드를 스캔해서 물건값을 지불할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"Instead, she scans a QR code with her phone, and the payment is made!","대신에, 그녀가 휴대폰으로 QR 코드를 스캔하면, 결제가 이루어진다!"],[4,"In China, this is a common method for buying things.","중국에서, 이것은 물건을 사는 흔한 방식이다."]],"w":"3번에서 휴대폰으로 QR 코드를 스캔하면 결제가 이루어지고, 4번에서 중국에서는 이것이 물건을 사는 흔한 방식이라고 해요.","c":"T"},"h":"f5617494e0"},{"n":2,"t":"tf","q":"After scanning a QR code, users must pay with cash.","ko":"QR 코드를 스캔한 뒤, 사용자들은 현금으로 지불해야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Apps such as AliPay and WeChat Pay are connected to users’ bank accounts, and their payments are automatically transferred when they scan the QR codes.","AliPay와 WeChat Pay 같은 앱들은 사용자들의 은행 계좌에 연결되어 있고, 그들의 결제 금액은 그들이 QR 코드를 스캔할 때 자동으로 옮겨진다."]],"w":"5번에서 QR 코드를 스캔하면 결제 금액이 자동으로 옮겨진다고 해요. 현금으로 따로 내야 한다는 말은 없어요.","c":"F"},"h":"b511f8fe8f"},{"n":3,"t":"tf","q":"Street performers and musicians in China also accept tips this way.","ko":"중국의 거리공연가들과 음악가들도 이 방식으로 팁을 받는다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Even street performers and musicians accept tips this way.","심지어 거리공연가들과 음악가들도 이 방식으로 팁을 받는다."]],"w":"8번에 Even street performers and musicians accept tips this way라고 나와요. this way는 QR 코드 결제 방식이에요.","c":"T"},"h":"8e231948c9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...their payments are automatically transferred when they scan the QR codes.)","ko":"...그들의 결제 금액은 그들이 QR 코드를 스캔할 때 ( ) 옮겨진다.","opts":["천천히","자동으로","직접","가끔"],"word":"automatically","r":{"a":"2) 자동으로","ev":"5번 문장","s":[[5,"Apps such as AliPay and WeChat Pay are connected to users’ bank accounts, and their payments are automatically transferred when they scan the QR codes.","AliPay와 WeChat Pay 같은 앱들은 사용자들의 은행 계좌에 연결되어 있고, 그들의 결제 금액은 그들이 QR 코드를 스캔할 때 자동으로 옮겨진다."]],"w":"스캔만 하면 앱이 은행 계좌와 연결되어 있어서 따로 하지 않아도 돈이 옮겨져요. automatically는 '자동으로'라는 뜻이에요.","c":2},"h":"e2f16e7506"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This not only makes it unnecessary to carry around cash or credit cards...)","ko":"이것은 현금이나 신용카드를 가지고 다니는 것을 ( ) 만들 뿐만 아니라...","opts":["위험한","어려운","귀찮은","불필요한"],"word":"unnecessary","r":{"a":"4) 불필요한","ev":"6번 문장","s":[[6,"This not only makes it unnecessary to carry around cash or credit cards but also makes processing payments much faster and simpler.","이것은 현금이나 신용카드를 가지고 다니는 것을 불필요하게 만들 뿐만 아니라 결제를 처리하는 것을 훨씬 더 빠르고 간편하게 만들기도 한다."]],"w":"QR 결제를 하면 현금이나 카드를 가지고 다닐 필요가 없어요. 그래서 unnecessary는 '불필요한(필요 없는)'이라는 뜻이에요.","c":4},"h":"349c7aadda"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nMany believe it will soon become the main form of payment in other parts of the world, too.","ko":"밑줄 친 it이 가리키는 것은?","sko":"많은 이들은 그것이 곧 세계의 다른 지역들에서도 주된 결제 형태가 될 것이라고 믿는다.","opts":["복숭아 바구니","QR 코드를 이용한 결제 기술","중국의 은행 계좌","거리공연가들의 팁"],"r":{"a":"2) QR 코드를 이용한 결제 기술","ev":"7, 9번 문장","s":[[7,"Now, the technology is so popular that it can be seen all across the country.","현재, 그 기술은 매우 인기 있어서 전국 곳곳에서 보일 수 있다."],[9,"Many believe it will soon become the main form of payment in other parts of the world, too.","많은 이들은 그것이 곧 세계의 다른 지역들에서도 주된 결제 형태가 될 것이라고 믿는다."]],"w":"7번에서 전국 곳곳에서 보이는 the technology는 QR 코드 결제 기술이에요. 9번의 it은 이 기술을 받아서 '세계 다른 곳에서도 주된 결제 형태가 될 것'이라는 뜻이에요.","c":2},"h":"3f83a199d5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now, the technology is so popular that it can be seen all across the country.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"현재, 그 기술은 매우 인기 있어서 전국 곳곳에서 보일 수 있다.","opts":["그 기술은 너무 인기가 없어서 거의 볼 수 없다.","그 기술은 매우 인기가 있어서 한 도시에서만 볼 수 있다.","그 기술은 매우 인기가 있어서 전국 곳곳에서 볼 수 있다.","그 기술은 인기가 있지만 전국 곳곳에서 볼 수는 없다."],"r":{"a":"3) 그 기술은 매우 인기가 있어서 전국 곳곳에서 볼 수 있다.","ev":"7번 문장","s":[[7,"Now, the technology is so popular that it can be seen all across the country.","현재, 그 기술은 매우 인기 있어서 전국 곳곳에서 보일 수 있다."]],"w":"「so + 형용사 + that절」은 '매우 ~해서 …하다'예요. 매우 인기 있어서 전국 곳곳(all across the country)에서 볼 수 있다는 뜻이에요.","c":3},"h":"e634c64a39"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["식료품점의 여성은 계산대에 가서 결제한다.","QR 코드 결제는 중국의 몇몇 가게에서만 쓰인다.","사람들은 QR 코드 결제가 다른 나라에는 퍼지지 않을 것이라고 생각한다.","AliPay와 WeChat Pay 같은 앱은 사용자들의 은행 계좌에 연결되어 있다."],"opts":["The woman in the story goes to a checkout counter to pay.","QR code payment is used only in a few stores in China.","People think QR code payment will never spread to other countries.","Apps such as AliPay and WeChat Pay are connected to users’ bank accounts."],"r":{"a":"4) Apps such as AliPay and WeChat Pay are connected to users’ bank accounts.","ev":"2, 5, 7, 9번 문장","s":[[2,"After selecting one of the fruits, she doesn’t go to a checkout counter to pay.","과일들 중 한 개를 고른 후, 그녀는 지불하기 위해 계산대로 가지 않는다."],[5,"Apps such as AliPay and WeChat Pay are connected to users’ bank accounts, and their payments are automatically transferred when they scan the QR codes.","AliPay와 WeChat Pay 같은 앱들은 사용자들의 은행 계좌에 연결되어 있고, 그들의 결제 금액은 그들이 QR 코드를 스캔할 때 자동으로 옮겨진다."],[7,"Now, the technology is so popular that it can be seen all across the country.","현재, 그 기술은 매우 인기 있어서 전국 곳곳에서 보일 수 있다."],[9,"Many believe it will soon become the main form of payment in other parts of the world, too.","많은 이들은 그것이 곧 세계의 다른 지역들에서도 주된 결제 형태가 될 것이라고 믿는다."]],"w":"5번에서 AliPay와 WeChat Pay 같은 앱은 은행 계좌에 연결되어 있다고 해요. 여성은 계산대에 가지 않고(2번), 전국 곳곳에서 쓰이며(7번), 다른 지역에서도 주된 결제 형태가 될 것이라 믿는 사람이 많아요(9번).","c":4},"h":"c5558b41fc"},{"n":9,"t":"sum","q":"After choosing a fruit, the woman doesn’t go to a checkout counter. Instead, she (A) a QR code with her phone, and the (B) is made.","ko":"과일을 고른 뒤, 여성은 계산대로 가지 않는다. 대신에, 그녀는 휴대폰으로 QR 코드를 (A)하고, (B)이 이루어진다.","oko":["(A) 스캔하고 / (B) 결제","(A) 그려서 / (B) 결제","(A) 스캔하고 / (B) 팁","(A) 사고 / (B) 바구니","(A) 던지고 / (B) 복숭아"],"opts":["(A) scans / (B) payment","(A) draws / (B) payment","(A) scans / (B) tip","(A) buys / (B) basket","(A) throws / (B) peach"],"r":{"a":"1) (A) scans / (B) payment","ev":"2~3번 문장","s":[[2,"After selecting one of the fruits, she doesn’t go to a checkout counter to pay.","과일들 중 한 개를 고른 후, 그녀는 지불하기 위해 계산대로 가지 않는다."],[3,"Instead, she scans a QR code with her phone, and the payment is made!","대신에, 그녀가 휴대폰으로 QR 코드를 스캔하면, 결제가 이루어진다!"]],"w":"2번에서 여성은 계산대에 가지 않고, 3번에서 휴대폰으로 QR 코드를 스캔(scan)하면 결제(payment)가 이루어져요.","c":1},"h":"8a06834b77"},{"n":10,"t":"fill","q":"QR code payment not only makes it [A] to carry around cash or credit cards but also makes processing payments much [B] and simpler.","ko":"QR 코드 결제는 현금이나 신용카드를 가지고 다니는 것을 [A] 만들 뿐만 아니라 결제를 처리하는 것을 훨씬 더 [B] 간편하게 만든다.","bank":["unnecessary","faster","automatically","connected","accept","nationwide"],"bko":{"unnecessary":"불필요한","faster":"더 빠른","automatically":"자동으로","connected":"연결된","accept":"받다","nationwide":"전국적으로"},"r":{"a":"[A] unnecessary, [B] faster","ev":"6번 문장","s":[[6,"This not only makes it unnecessary to carry around cash or credit cards but also makes processing payments much faster and simpler.","이것은 현금이나 신용카드를 가지고 다니는 것을 불필요하게 만들 뿐만 아니라 결제를 처리하는 것을 훨씬 더 빠르고 간편하게 만들기도 한다."]],"w":"6번에서 현금이나 카드를 가지고 다니는 것이 불필요(unnecessary)해지고, 결제 처리가 훨씬 더 빠르고(faster) 간편해진다고 해요.","c":null},"h":"74c1720817"}]},{"u":3,"id":"hk3-03-4","no":4,"ko":"한 땀 한 땀의 기적","items":[{"n":1,"t":"tf","q":"Most baseballs have exactly 108 red double stitches on their surface.","ko":"대부분의 야구공은 표면에 정확히 108개의 두 줄로 된 붉은 실밥을 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Most baseballs have exactly 108 red double stitches on their surface.","대부분의 야구공은 표면에 정확히 108개의 두 줄로 된 붉은 실밥을 가지고 있다."]],"w":"2번 문장에 Most baseballs have exactly 108 red double stitches on their surface가 그대로 나와요.","c":"T"},"h":"e5a497da29"},{"n":2,"t":"tf","q":"A ball without stitches flies faster because the airflow pushes it forward.","ko":"실밥이 없는 공은 기류가 앞으로 밀어서 더 빠르게 날아간다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"When a ball without stitches travels in the air, the opposing airflow moves along the surface of the ball.","실밥이 없는 공이 공중에서 이동할 때, 반대 방향의 기류가 공의 표면을 따라서 움직인다."],[8,"This pulls the ball backward and makes it fly slower.","이것은 공을 뒤로 잡아당기고 더 느리게 날아가게 만든다."]],"w":"7~8번에서 실밥이 없는 공은 반대 방향의 기류가 공을 뒤로 잡아당기고 더 느리게 날게 만들어요. 앞으로 밀어서 빨라진다는 말은 반대예요.","c":"F"},"h":"40a44e00da"},{"n":3,"t":"tf","q":"The stitches allow players to throw various types of pitches.","ko":"실밥은 선수들이 다양한 종류의 투구를 던질 수 있게 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"This design also allows players to throw various types of pitches, including fast balls, curve balls, and others.","이 디자인은 또한 선수들이 속구, 커브볼, 그리고 다른 것들을 포함하여 다양한 종류의 투구를 던질 수 있도록 한다."]],"w":"11번에서 This design also allows players to throw various types of pitches라고 해요. 이 디자인(실밥)이 다양한 투구를 가능하게 한다는 뜻이에요.","c":"T"},"h":"e9dd4e4691"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...the opposing airflow moves along the surface of the ball.)","ko":"...( ) 기류가 공의 표면을 따라서 움직인다.","opts":["빠른","부드러운","반대 방향의","차가운"],"word":"opposing","r":{"a":"3) 반대 방향의","ev":"7번 문장","s":[[7,"When a ball without stitches travels in the air, the opposing airflow moves along the surface of the ball.","실밥이 없는 공이 공중에서 이동할 때, 반대 방향의 기류가 공의 표면을 따라서 움직인다."]],"w":"공이 앞으로 날아가는데 기류는 공을 향해 마주 와요. 그래서 opposing은 '반대의(반대 방향의)'라는 뜻이에요.","c":3},"h":"327fcbde88"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...cause the air to change directions and bounce off the ball.)","ko":"...공기가 방향을 바꾸고 공에서 ( ) 나가도록 만든다.","opts":["가라앉아","튕겨","녹아","숨어"],"word":"bounce","r":{"a":"2) 튕겨","ev":"9번 문장","s":[[9,"But the stitches interrupt the airflow, which causes the air to change directions and bounce off the ball.","그러나 실밥은 그 기류를 방해하는데, 이는 공기가 방향을 바꿔 공에서 튕겨 나가도록 만든다."]],"w":"실밥 때문에 기류가 막히면 공기가 공에 붙지 않고 방향을 바꿔 공에서 튕겨 나가요. bounce(튕기다)는 부딪혀서 되튀는 모습이에요.","c":2},"h":"6d0916d40b"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis pulls the ball backward and makes it fly slower.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 공을 뒤로 잡아당기고 더 느리게 날아가게 만든다.","opts":["야구 경기","108개의 붉은 실밥","빠르게 날아가는 공","반대 방향의 기류가 공의 표면을 따라 움직이는 것"],"r":{"a":"4) 반대 방향의 기류가 공의 표면을 따라 움직이는 것","ev":"7~8번 문장","s":[[7,"When a ball without stitches travels in the air, the opposing airflow moves along the surface of the ball.","실밥이 없는 공이 공중에서 이동할 때, 반대 방향의 기류가 공의 표면을 따라서 움직인다."],[8,"This pulls the ball backward and makes it fly slower.","이것은 공을 뒤로 잡아당기고 더 느리게 날아가게 만든다."]],"w":"공을 뒤로 잡아당기는 것은 7번에서 말한 '반대 방향의 기류가 공의 표면을 따라 움직이는 것'이에요. 실밥은 오히려 이것을 막아요(9번).","c":4},"h":"cedf10646e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without them, the game of baseball wouldn’t be the same as it is now.\"","ko":"이 문장의 의미로 가장
