고, 배수 틀의 가운데에는 원래 모양이 와요.", "why": "Linda는 Ben만큼 나이가 많지 않으므로 not as, Ben은 아들의 세 배이므로 three times가 알맞아요. as와 as 사이에는 원급 old를 써요.", "opts": [], "pencil": "3배 비교: three times as ___ as", "pencilKey": "old", "page": 221, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "유형 01 비교급과 최상급의 형태", "type": "mc", "ans": "⑤", "concept": ["032"], "gap": "", "words": [["sounds", "~하게 들린다(원형 sound ~하게 들리다)"], ["important", "중요한"], ["happy", "행복한"]], "h1": "문장 전체를 보고 '더 ~한', '가장 ~한' 모양이 바르게 만들어졌는지 하나씩 확인해요. 특히 끝이 -y로 끝나는 단어를 살펴보세요.", "h2": "-y로 끝나는 단어는 y를 i로 바꾼 뒤 -er, -est를 붙여요. 보기에 -y로 끝나는 단어가 있다면 이 규칙을 지켰는지 대 보세요.", "why": "happy(행복한)의 최상급은 y를 i로 바꾼 happiest예요. happyest는 틀린 모양이에요.", "opts": [{"n": "①", "en": "You should study harder.", "ko": "너는 더 열심히 공부해야 한다.", "ok": false, "why": "harder(더 열심히)는 알맞은 비교급이에요."}, {"n": "②", "en": "I will get up earlier tomorrow.", "ko": "나는 내일 더 일찍 일어날 것이다.", "ok": false, "why": "earlier(더 일찍)는 y를 i로 바꾼 알맞은 모양이에요."}, {"n": "③", "en": "The movie sounds more interesting.", "ko": "그 영화는 더 흥미롭게 들린다.", "ok": false, "why": "긴 단어는 more를 붙이므로 알맞아요."}, {"n": "④", "en": "Health is the most important for me.", "ko": "건강이 나에게 가장 중요하다.", "ok": false, "why": "긴 단어는 most를 붙이므로 알맞아요."}, {"n": "⑤", "en": "I am the happyest person in the world.", "ko": "나는 세상에서 가장 행복한 사람이다.", "ok": true, "why": "y를 i로 바꾸지 않아 틀렸어요. happiest로 써야 해요."}], "pencil": "-y로 끝나는 단어는 y를 ___ 로 바꾸고 -est를 붙인다", "pencilKey": "i", "page": 222, "sec": "s2"}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "유형 01 비교급과 최상급의 형태", "type": "mc", "ans": "③", "concept": ["032"], "gap": "", "words": [["sneakers", "운동화"], ["big", "큰"], ["want", "원하다"]], "h1": "'더 큰'이니 비교급이 필요해요. big(큰)은 짧은 단어이고 '자음 + 모음 + 자음'으로 끝나요. 이런 단어의 끝 글자를 어떻게 처리하는지 떠올려 보세요.", "h2": "'모음 하나 + 자음 하나'로 끝나는 단어는 끝 자음을 한 번 더 쓰고 -er을 붙여요. 보기에서 이 규칙을 지키고 '더 큰'의 뜻이 되는 것을 찾아보세요.", "why": "big은 끝 자음 g를 한 번 더 써서 bigger(더 큰)가 돼요. 짧은 단어라서 more를 붙이지 않아요.", "opts": [{"n": "①", "en": "I want biger sneakers.", "ko": "나는 더 큰 운동화를 원한다.(철자 틀림)", "o s 틀의 가운데에는 어떤 모양의 단어가 오는지 먼저 정하세요.", "h2": "틀의 가운데에는 원래 모양만 올 수 있어요. 보기 중에서 '더 ~한'을 뜻하는 비교급이 있는지 찾아보세요.", "why": "not so ... as의 가운데에는 원급이 와야 해요. cheaper는 '더 싼'이라는 비교급이라서 들어갈 수 없어요.", "opts": [{"n": "①", "en": "famous", "ko": "유명한", "ok": false, "why": "원급이라서 들어갈 수 있어요."}, {"n": "②", "en": "cheaper", "ko": "더 싼", "ok": true, "why": "비교급이라서 들어갈 수 없어요."}, {"n": "③", "en": "popular", "ko": "인기 있는", "ok": false, "why": "원급이라서 들어갈 수 있어요."}, {"n": "④", "en": "delicious", "ko": "맛있는", "ok": false, "why": "원급이라서 들어갈 수 있어요."}, {"n": "⑤", "en": "expensive", "ko": "비싼", "ok": false, "why": "원급이라서 들어갈 수 있어요."}], "pencil": "not so ___ as 의 가운데에는 비교급을 쓰지 않는다", "pencilKey": "원급", "page": 222, "sec": "s2"}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "유형 02·03 원급 비교 / 부정", "type": "mc", "ans": "⑤", "concept": ["033"], "gap": "not as 원급 as 문장을 반대 뜻의 비교급 문장으로 바꿔 쓰는 방법(A is not as slow as B 는 B is slower than A 와 같은 뜻)", "words": [["slow", "느린"], ["fast", "빠른"], ["horse", "말"], ["sheep", "양"]], "h1": "The horse isn't as slow as the sheep.은 '말은 양만큼 느리지 않다'예요. 그러면 누가 더 빠른지 먼저 정리해 보세요.", "h2": "'A는 B만큼 느리지 않다'는 A가 B보다 빠르다는 뜻이에요. 같은 사실을 반대쪽 주어로 말하면 어떻게 될지 생각해 보세요.", "why": "말이 양보다 빨라요. 이것을 양을 주어로 말하면 '양은 말만큼 빠르지 않다'가 되므로 The sheep isn't as fast as the horse예요.", "opts": [{"n": "①", "en": "The horse is as slow as the sheep.", "ko": "말은 양만큼 느리다.", "ok": false, "why": "둘이 똑같이 느리다는 뜻이라서 달라요."}, {"n": "②", "en": "The horse is as fast as the sheep.", "ko": "말은 양만큼 빠르다.", "ok": false, "why": "둘이 똑같이 빠르다는 뜻이라서 달라요."}, {"n": "③", "en": "The horse isn't as fast as the sheep.", "ko": "말은 양만큼 빠르지 않다.", "ok": false, "why": "말이 더 느리다는 뜻이라서 반대예요."}, {"n": "④", "en": "The sheep isn't as slow as the horse.", "ko": "양은 말만큼 느리지 않다.", "ok": false, "why": "양이 더 빠르다는 뜻이라서 반대예요."}, {"n": "⑤", "en": "The sheep isn't as fast as the horse.", "ko": "양은 말만큼 빠르지 않다.", "ok": true, "why": "말이 더 빠르다는 뜻이라서 알맞아요."}], "pencil": "A가 B만큼 느리지 않다면 B는 A만큼 ___ 지 않다", "pencilKey": "빠르", "page": 222, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "유형 05 통합형", "type": "mc", "ans": "④", "concept": ["033", "034-H1"], "gap": "", "words": [["weight", "무게"], ["duck", "오리"], ["dog", "개"], ["cat", "고양이"], ["light", "가벼운"]], "h1": "표를 보고 오리 3kg, 개 6kg, 고양이 6kg이라는 사실을 정리하세요. 일치하지 않는 것을 찾는 문제예요.", "h2": "보기마다 누가 더 무겁고 누가 같은지 표와 비교하세요. twice(두 배)가 있는 보기는 숫자도 계산해 보세요.", "why": "개는 6kg, 오리는 3kg이라서 개가 오리보다 무거워요. 그래서 '개는 오리만큼 무겁지 않다'는 표와 맞지 않아요.", "opts": [{"n": "①", "en": "The dog is as heavy as the cat.", "ko": "개는 고양이만큼 무겁다.", "ok": false, "why": "둘 다 6kg이라서 표와 맞아요."}, {"n": "②", "en": "The cat isn't as light as the duck.", "ko": "고양이는 오리만큼 가볍지 않다.", "ok": false, "why": "고양이가 더 무거우므로 표와 맞아요."}, {"n": "③", "en": "The duck isn't as heavy as the cat.", "ko": "오리는 고양이만큼 무겁지 않다.", "ok": false, "why": "오리가 더 가벼우므로 표와 맞아요."}, {"n": "④", "en": "The dog isn't as heavy as the duck.", "ko": "개는 오리만큼 무겁지 않다.", "ok": true, "why": "개(6kg)가 오리(3kg)보다 무거워서 표와 맞지 않아요."}, {"n": "⑤", "en": "The cat is twice as heavy as the duck.", "ko": "고양이는 오리의 두 배만큼 무겁다.", "ok": false, "why": "6kg은 3kg의 두 배라서 표와 맞아요."}], "pencil": "6kg은 3kg의 ___ 배이다", "pencilKey": "두", "page": 222, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "유형 05 통합형", "type": "mc", "ans": "④", "concept": ["033"], "gap": "", "words": [["careful", "조심스러운"], ["poor", "가난한"], ["tail", "꼬리"], ["rain", "비가 오다"]], "h1": "as와 as 사이에 어떤 모양의 단어가 있는지 문장마다 확인해 보세요. 어색한 문장은 하나뿐이에요.", "h2": "원급 비교 틀의 가운데에는 원래 모양만 올 수 있어요. 가운데에 '더 ~한'을 뜻하는 단어가 낀 문장이 있는지 찾아보세요.", "why": "as와 as 사이에는 원급이 와야 해요. ④에는 비교급 shorter가 들어가서 틀렸고 short(짧은)로 고쳐야 해요.", "opts": [{"n": "①", "en": "Eric is as careful as Mary.", "ko": "에릭은 메리만큼 조심스럽다.", "ok": false, "why": "가운데가 원급이라서 알맞아요."}, {"n": "②", "en": "He wasn't so poor as his brother.", "ko": "그는 그의 형만큼 가난하지 않았다.", "ok": false, "why": "not so ... as 틀이 알맞게 쓰였어요."}, {"n": "③", "en": "My room is twice as big as my sister's.", "ko": "내 방은 내 여동생 방의 두 배만큼 크다.", "ok": false, "why": "배수 비교 틀이 알맞게 쓰였어요."}, {"n": "④", "en": "The dog's tail isn't as shorter as the cat's.", "ko": "개의 꼬리는 고양이 것만큼 더 짧지 않다.(잘못된 문장)", "ok": true, "why": "as와 as 사이에 비교급 shorter가 와서 틀렸어요."}, {"n": "⑤", "en": "It doesn't rain in Seoul as much as in Jeju.", "ko": "서울은 제주만큼 비가 많이 오지 않는다.", "ok": false, "why": "원급 much를 써서 알맞아요."}], "pencil": "as와 as 사이의 비교급은 ___ 로 고친다", "pencilKey": "원급", "page": 222, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "유형 01 비교급과 최상급의 형태", "type": "write", "ans": "(1) heavier (2) most intelligent", "concept": ["032"], "gap": "", "words": [["heavy", "무거운"], ["intelligent", "똑똑한"], ["class", "학급"]], "h1": "(1)은 '더 ~한'(비교급), (2)는 '가장 ~한'(최상급)으로 고쳐요. 밑줄 친 단어가 각각 어떤 단어인지 살펴보세요.", "h2": "heavy(무거운)는 -y로 끝나는 짧은 단어이고, intelligent(똑똑한)는 긴 단어예요. 단어 길이에 따라 방법이 달라요.", "why": "heavy는 y를 i로 바꿔 heavier가 돼요. intelligent는 긴 단어라서 앞에 most를 붙여 most intelligent(가장 똑똑한)가 돼요.", "opts": [], "pencil": "긴 단어의 최상급은 ___ + 원급", "pencilKey": "most", "page": 223, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "유형 01 비교급과 최상급의 형태", "type": "write", "ans": "more important", "concept": ["032", "034"], "gap": "", "words": [["important", "중요한"], ["time", "시간"], ["money", "돈"]], "h1": "'시간은 돈보다 더 중요하다'에서 '더 중요한'을 괄호 안 important(중요한)로 만들어요. important는 짧은 단어일까요, 긴 단어일까요?", "h2": "긴 단어는 단어 끝을 바꾸지 않고 앞에 한 단어를 더 붙여서 '더 ~한'을 만들어요.", "why": "important는 긴 단어라서 앞에 more를 붙인 more important(더 중요한)가 돼요. 뒤에는 than money(돈보다)가 이어져요.", "opts": [], "pencil": "긴 단어의 비교급은 ___ + 원급", "pencilKey": "more", "page": 223, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "유형 03 원급 비교 부정", "type": "write", "ans": "not so [또는 not as]", "concept": ["033"], "gap": "", "words": [["comfortable", "편안한"], ["sofa", "소파"]], "h1": "밑줄 친 so not이 비교 틀 안에서 제자리에 있는지 살펴보세요. 부정하는 말은 틀의 맨 앞에 와야 해요.", "h2": "원급 비교 부정은 「not + as(또는 so) + 원급 + as」예요. so와 not의 순서가 맞는지 확인하세요.", "why": "not은 so 앞에 와야 해서 so not을 not so로 고쳐요. not so comfortable as(~만큼 편안하지 않은)가 돼요.", "opts": [], "pencil": "not과 so의 순서는 ___ 먼저", "pencilKey": "not", "page": 223, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "유형 03 원급 비교 부정", "type": "write", "ans": "not watch, as [so] often", "concept": ["033"], "gap": "", "words": [["watches", "본다(원형 watch 보다)"], ["often", "자주"], ["once a week", "일주일에 한 번"], ["once a month", "한 달에 한 번"]], "h1": "Brian은 일주일에 한 번, Tim은 한 달에 한 번 영화를 봐요. 누가 더 자주 보는지 정리한 뒤 Tim을 주어로 부정문을 만들어 보세요.", "h2": "문장에 일반동사 watch(보다)가 쓰이므로 부정은 does not과 동사원형으로 만들어요. 빈칸에는 not과 동사원형, 그리고 비교 틀 앞부분이 순서대로 들어가요.", "why": "Tim은 Brian만큼 자주 보지 않아요. 그래서 Tim does not watch a movie as often as Brian이 돼요. 앞쪽 as 대신 so를 써도 돼요.", "opts": [], "pencil": "일반동사 부정은 does + not + ___", "pencilKey": "동사원형", "page": 223, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "유형 02·04 원급 / 배수 비교", "type": "write", "ans": "as expensive as", "concept": ["033"], "gap": "", "words": [["pencil case", "필통"], ["notebook", "공책"], ["expensive", "비싼"]], "h1": "그림에서 필통과 공책의 가격이 같다고 했어요. 가격이 같을 때 쓰는 비교 틀이 무엇인지 떠올려 보세요.", "h2": "'~만큼 …한'을 말하는 틀은 as, 원래 모양, as 순서예요. 괄호 안 expensive(비싼)는 모양을 바꾸지 않아요.", "why": "두 가격이 같으므로 as expensive as(~만큼 비싼)를 써요. 가운데 expensive는 원급 그대로예요.", "opts": [], "pencil": "가격이 같다: as + ___ + as", "pencilKey": "원급", "page": 223, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "유형 02·04 원급 / 배수 비교", "type": "write", "ans": "twice as tall as", "concept": ["034-H1"], "gap": "", "words": [["tree", "나무"], ["boy", "소년"], ["tall", "키가 큰"], ["twice", "두 배"]], "h1": "그림에서 나무가 소년보다 두 배 높아요. 배수를 나타내는 단어는 비교 틀의 맨 앞에 와요.", "h2": "배수 비교 틀은 「배수 표현 + as + 원급 + as」예요. 주어진 twice(두 배)와 tall(키가 큰)을 이 틀에 넣어 보세요.", "why": "'두 배만큼 키가 큰'은 twice as tall as예요. twice가 맨 앞에 오고 tall은 원급 그대로 써요.", "opts": [], "pencil": "배수 비교는 ___ + as + 원급 + as", "pencilKey": "배수 표현", "page": 223, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "유형 02·04 원급 / 배수 비교", "type": "write", "ans": "opens as late as the bank", "concept": ["033"], "gap": "", "words": [["bookstore", "서점"], ["opens", "문을 연다(원형 open 열다)"], ["late", "늦게"], ["bank", "은행"]], "h1": "'서점은 은행만큼 늦게 문을 연다'를 만들어요. 주어진 단어 중 than은 필요하지 않다는 점에 주의하세요.", "h2": "틀은 「A + 동사 + as + 원래 모양 + as + B」예요. than은 비교급과 함께 쓰는 말이라서 이 문장에는 쓰지 않아요.", "why": "The bookstore opens as late as the bank.가 돼요. 동사 opens 뒤에 as late as, 마지막에 비교 대상 the bank가 와요.", "opts": [], "pencil": "A + 동사 + as + 원급 + as + ___", "pencilKey": "B(비교 대상)", "page": 223, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "유형 02·04 원급 / 배수 비교", "type": "write", "ans": "sleeps three times as much as his mom", "concept": ["034-H1"], "gap": "", "words": [["sleeps", "잔다(원형 sleep 자다)"], ["much", "많이"], ["mom", "엄마"], ["three times", "세 배"]], "h1": "'엄마의 세 배만큼 많이 잔다'를 만들어요. 주어진 단어 중 time, third는 쓰지 않아요. 3배를 말하는 올바른 모양을 고르세요.", "h2": "틀은 「동사 + 배수 표현 + as + 원래 모양 + as + 비교 대상」이에요. 3배는 숫자 뒤에 times를 붙여요.", "why": "3배는 three times로 말해요. 그래서 sleeps three times as much as his mom이 돼요.", "opts": [], "pencil": "3배는 three + ___", "pencilKey": "times", "page": 223, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "유형 01 비교급과 최상급의 형태", "type": "mc", "ans": "①", "concept": ["032"], "gap": "", "words": [["scariest", "가장 무서운(원형 scary 무서운)"], ["loud", "큰 소리의"], ["speak", "말하다"]], "h1": "밑줄 친 두 단어를 따로 고쳐요. scaryest는 '가장 ~한', loudder는 '더 ~한'으로 쓰려던 말이에요. 각각 철자나 모양이 틀린 곳을 찾으세요.", "h2": "-y로 끝나는 단어는 y를 i로 바꾸고 -est를 붙여요. loud는 '모음 두 개 + 자음'으로 끝나서 끝 자음을 반복하지 않고 -er만 붙여요.", "why": "scary(무서운)는 y를 i로 바꿔 scariest(가장 무서운), loud는 -er만 붙여 louder(더 큰 소리로)가 돼요.", "opts": [{"n": "①", "en": "scariest - louder", "ko": "가장 무서운 - 더 큰 소리로", "ok": true, "why": "두 단어 모두 알맞은 모양이에요."}, {"n": "②", "en": "scariest - louderer", "ko": "가장 무서운 - (잘못된 모양)", "ok": false, "why": "louder에 -er을 또 붙이면 틀려요."}, {"n": "③", "en": "most scary - louder", "ko": "(잘못된 모양) - 더 큰 소리로", "ok": false, "why": "scary는 y를 i로 바꿔 -est를 붙여요. most를 쓰지 않아요."}, {"n": "④", "en": "most scary - more loud", "ko": "(잘못된 모양) - (잘못된 모양)", "ok": false, "why": "두 단어 모두 짧은 단어라서 more, most를 붙이지 않아요."}, {"n": "⑤", "en": "most scariest - more louder", "ko": "(잘못된 모양) - (잘못된 모양)", "ok": false, "why": "most와 -est, more와 -er을 겹쳐 쓰면 틀려요."}], "pencil": "-y로 끝나는 짧은 단어의 최상급은 y를 i로 바꾸고 ___", "pencilKey": "-est", "page": 224, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "유형 01 비교급과 최상급의 형태", "type": "mc", "ans": "①", "concept": ["032"], "gap": "old의 두 갈래(older/oldest와 가족 사이의 elder/eldest)와 far의 두 갈래(farther/farthest와 further/furthest) 구별", "words": [["eldest", "가장 손위의"], ["oldest", "가장 나이 든"], ["further", "더 멀리"], ["farthest", "가장 먼"], ["married", "결혼했다(원형 marry 결혼하다)"]], "h1": "비교급과 최상급이 두 갈래로 나뉘는 단어(old, far)가 들어 있어요. 보기에서 이런 단어가 쓰인 문장을 먼저 찾아보세요.", "h2": "elder, eldest는 가족 사이의 '손위의'를 뜻하고, 일반적인 '나이 든, 오래된'은 older, oldest를 써요. 친구를 말하는 문장에 어떤 쪽이 어울릴까요?", "why": "eldest는 가족 사이에서 '손위의'를 말할 때 써요. '가장 오래된 친구'는 oldest(가장 오래된)를 써야 해서 ①이 어색해요.", "opts": [{"n": "①", "en": "She was my eldest friend.", "ko": "그녀는 나의 가장 손위의 친구였다.", "ok": true, "why": "eldest는 가족 사이에서 쓰는 말이라서 친구에게는 oldest가 알맞아요."}, {"n": "②", "en": "I'm tired. I can't go further.", "ko": "나는 피곤하다. 더는 못 가겠다.", "ok": false, "why": "further(더 멀리)는 알맞게 쓰였어요."}, {"n": "③", "en": "She married John's elder brother.", "ko": "그녀는 존의 형과 결혼했다.", "ok": false, "why": "형은 가족이라서 elder(손위의)가 알맞아요."}, {"n": "④", "en": "Jake is the oldest of the members.", "ko": "제이크는 회원들 중 가장 나이가 많다.", "ok": false, "why": "oldest(가장 나이 든)가 알맞아요."}, {"n": "⑤", "en": "Pluto is the farthest planet from the Sun.", "ko": "명왕성은 태양에서 가장 먼 행성이다.", "ok": false, "why": "farthest(가장 먼)가 알맞아요."}], "pencil": "가족 사이의 '손위의'는 elder, 일반적인 '나이 든'은 ___", "pencilKey": "older", "page": 224, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "유형 02·03 원급 비교 / 부정", "type": "mc", "ans": "②", "concept": ["033"], "gap": "", "words": [["bee", "벌"], ["difficult", "어려운"], ["subway", "지하철"], ["cakes", "케이크들(원형 cake 케이크)"]], "h1": "'잘못 고쳐 쓴 것'을 찾는 문제예요. 괄호 안의 고침이 맞는지 하나씩 문장에 넣어 읽어 보세요.", "h2": "원급 비교 부정에서는 not이 as(또는 so) 앞에 와요. 괄호 안 고침의 순서가 이 규칙에 맞는지 확인해 보세요.", "why": "원급 비교 부정은 not as [so] ... as의 순서예요. 'so not'을 'as not'으로 고치면 여전히 not의 위치가 틀려서 not as(또는 not so)로 고쳐야 해요.", "opts": [{"n": "①", "en": "My father is so busy as a bee. (as)", "ko": "우리 아버지는 벌처럼 바쁘시다. (so를 as로 고침)", "ok": false, "why": "긍정문이라서 so ... as를 as ... as로 고치는 것이 맞아요."}, {"n": "②", "en": "It is so not difficult as you think. (as not)", "ko": "그것은 네 생각만큼 어렵지 않다. (so not을 as not으로 고침)", "ok": true, "why": "not은 as 앞에 와야 해서 as not은 틀려요. not as나 not so로 고쳐야 해요."}, {"n": "③", "en": "The bus isn't as fast so the subway. (as)", "ko": "버스는 지하철만큼 빠르지 않다. (so를 as로 고침)", "ok": false, "why": "뒤쪽 칸은 as가 와서 알맞게 고쳤어요."}, {"n": "④", "en": "He can swim as faster as I can. (fast)", "ko": "그는 나만큼 빠르게 수영할 수 있다. (faster를 fast로 고침)", "ok": false, "why": "as와 as 사이에는 원급이 와서 알맞게 고쳤어요."}, {"n": "⑤", "en": "She ate as more cakes as Mia. (many)", "ko": "그녀는 미아만큼 많은 케이크를 먹었다. (more를 many로 고침)", "ok": false, "why": "as와 as 사이에는 원급 many가 와서 알맞게 고쳤어요."}], "pencil": "원급 비교 부정: ___ + as + 원급 + as", "pencilKey": "not", "page": 224, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "유형 02·03 원급 비교 / 부정", "type": "mc", "ans": "④", "concept": ["033"], "gap": "not as 원급 as 문장을 반대 뜻의 비교급 문장으로 바꿔 쓰는 방법(A is not as slow as B 는 B is slower than A 와 같은 뜻)", "words": [["kicked", "찼다(원형 kick 차다)"], ["far", "멀리"], ["small", "작은"], ["slow", "느린"]], "h1": "각 보기는 같은 뜻이라고 짝지어 놓은 두 문장이에요. 뜻이 다른 짝을 찾으려면 두 문장 중 누가 더 ~한지 각각 정리해 보세요.", "h2": "A isn't as ~ as B는 A가 B보다 덜 ~하다는 뜻이에요. 두 문장의 주어가 서로 바뀌었는데도 같은 관계가 유지되는지 살펴보세요.", "why": "Lisa가 짐만큼 TV를 보지 않는다면 짐이 더 많이 봐요. 짝지은 문장은 짐이 리사만큼 보지 않는다고 해서 거꾸로 되어 뜻이 달라요.", "opts": [{"n": "①", "en": "Mom got up as early as me. = I got up as early as Mom.", "ko": "엄마는 나만큼 일찍 일어났다. = 나는 엄마만큼 일찍 일어났다.", "ok": false, "why": "둘이 같은 정도라서 서로 바꿔도 같은 뜻이에요."}, {"n": "②", "en": "Tom kicked the ball as far as Bob. = Bob kicked the ball as far as Tom.", "ko": "톰은 밥만큼 멀리 공을 찼다. = 밥은 톰만큼 멀리 공을 찼다.", "ok": false, "why": "둘이 같은 정도라서 서로 바꿔도 같은 뜻이에요."}, {"n": "③", "en": "My room isn't as small as your room. = Your room isn't as big as my room.", "ko": "내 방은 네 방만큼 작지 않다. = 네 방은 내 방만큼 크지 않다.", "ok": false, "why": "내 방이 더 크다는 같은 뜻이에요."}, {"n": "④", "en": "Lisa doesn't watch TV as much as Jim. = Jim doesn't watch TV as much as Lisa.", "ko": "리사는 짐만큼 TV를 많이 보지 않는다. = 짐은 리사만큼 TV를 많이 보지 않는다.", "ok": true, "why": "앞 문장은 짐이 더 많이, 뒤 문장은 리사가 더 많이 본다는 뜻이라서 서로 반대예요."}, {"n": "⑤", "en": "The desktop isn't so fast as the laptop. = The laptop isn't so slow as the desktop.", "ko": "데스크톱은 노트북만큼 빠르지 않다. = 노트북은 데스크톱만큼 느리지 않다.", "ok": false, "why": "노트북이 더 빠르다는 같은 뜻이에요."}], "pencil": "A가 B만큼 ~하지 않다는 B가 A보다 ___ 다는 뜻이다", "pencilKey": "더 ~하", "page": 224, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "유형 05 통합형", "type": "mc", "ans": "②", "concept": ["033", "034-H1"], "gap": "", "words": [["clean", "깨끗한"], ["lake", "호수"], ["clever", "영리한"], ["cousin", "사촌"], ["dictionary", "사전"], ["tunnel", "터널"]], "h1": "ⓐ~ⓔ를 하나씩 읽고 as ~ as 틀이 바르게 쓰였는지 확인하세요. 맞는 문장만 모아서 보기와 맞춰 보세요.", "h2": "as와 as 사이에는 원급이 와요. 부정문의 두 번째 칸에는 so가 아니라 as가 와요. 배수 표현은 틀의 맨 앞에 와요.", "why": "ⓐ와 ⓑ만 바른 문장이에요. ⓒ는 so safe so를 so safe as로, ⓓ는 thicker를 thick로, ⓔ는 as three times를 three times as로 고쳐야 해요.", "opts": [{"n": "①", "en": "ⓐ", "ko": "ⓐ 강은 호수만큼 깨끗하다.", "ok": false, "why": "ⓐ는 맞지만 ⓑ도 맞는 문장이라서 하나가 빠졌어요."}, {"n": "②", "en": "ⓐ, ⓑ", "ko": "ⓐ 강은 호수만큼 깨끗하다. ⓑ 민수는 그의 사촌만큼 영리하다.", "ok": true, "why": "두 문장 모두 as ~ as 틀이 알맞아서 정답이에요."}, {"n": "③", "en": "ⓑ, ⓔ", "ko": "ⓑ 민수는 그의 사촌만큼 영리하다. ⓔ 터널은 다리의 세 배만큼 길다.", "ok": false, "why": "ⓔ는 as three times long as로 순서가 틀려서 맞는 문장이 아니에요."}, {"n": "④", "en": "ⓑ, ⓒ, ⓓ", "ko": "ⓑ 민수는 그의 사촌만큼 영리하다. ⓒ 바위 타기는 수영만큼 안전하지 않다. ⓓ 사전은 벽돌만큼 두껍다.", "ok": false, "why": "ⓒ는 so safe so로 뒤쪽 칸이 틀렸고 ⓓ는 as와 as 사이에 thicker가 있어서 틀려요."}, {"n": "⑤", "en": "ⓒ, ⓓ, ⓔ", "ko": "ⓒ 바위 타기는 수영만큼 안전하지 않다. ⓓ 사전은 벽돌만큼 두껍다. ⓔ 터널은 다리의 세 배만큼 길다.", "ok": false, "why": "세 문장 모두 틀린 문장이라서 오답이에요."}], "pencil": "배수 표현은 as ~ as 틀의 ___ 에 놓는다", "pencilKey": "맨 앞", "page": 225, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "유형 05 통합형", "type": "mc", "ans": "①, ④", "concept": ["033", "034-H1"], "gap": "", "words": [["go to school", "학교에 가다"], ["watch TV", "TV를 보다"], ["hours", "시간"], ["late", "늦게"]], "h1": "표를 보고 세 사람의 등교 시각과 TV 시청 시간을 정리하세요. 일치하는 것을 모두 고르는 문제라서 보기를 하나씩 표와 대 보세요.", "h2": "as ~ as는 두 사람이 같을 때, not as ~ as는 한 쪽이 덜할 때 써요. twice(두 배)는 숫자로 계산해서 확인하세요. 답이 두 개예요.", "why": "Mina와 Hyemi는 둘 다 TV를 4시간 봐서 ①이 맞아요. Hyemi는 7시 40분, Mina는 8시에 가서 Hyemi가 더 일찍 가므로 ④도 맞아요.", "opts": [{"n": "①", "en": "Mina watches TV as long as Hyemi.", "ko": "미나는 혜미만큼 오래 TV를 본다.", "ok": true, "why": "둘 다 4시간이라서 표와 일치해요."}, {"n": "②", "en": "Sora goes to school as late as Hyemi.", "ko": "소라는 혜미만큼 늦게 학교에 간다.", "ok": false, "why": "Sora는 8시, Hyemi는 7시 40분이라서 같지 않아요."}, {"n": "③", "en": "Sora watches TV twice as long as Mina.", "ko": "소라는 미나의 두 배만큼 오래 TV를 본다.", "ok": false, "why": "Sora는 2시간, Mina는 4시간이라서 반대예요."}, {"n": "④", "en": "Hyemi doesn't go to school as late as Mina.", "ko": "혜미는 미나만큼 늦게 학교에 가지 않는다.", "ok": true, "why": "Hyemi가 20분 더 일찍 가서 표와 일치해요."}, {"n": "⑤", "en": "Hyemi doesn't watch TV twice as long as Sora.", "ko": "혜미는 소라의 두 배만큼 오래 TV를 보지 않는다.", "ok": false, "why": "Hyemi는 4시간, Sora는 2시간이라서 정확히 두 배예요. 표와 일치하지 않아요."}], "pencil": "4시간은 2시간의 ___ 배이다", "pencilKey": "두", "page": 225, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "유형 05 통합형", "type": "mc", "ans": "②", "concept": ["033"], "gap": "", "words": [["dragonfly", "잠자리"], ["spider", "거미"], ["legs", "다리들(원형 leg 다리)"]], "h1": "잠자리는 다리가 6개, 거미는 8개예요. 누가 더 많이 가졌는지 정리한 뒤 한 문장으로 맞게 합친 것을 찾으세요.", "h2": "as many ~ as는 같을 때, doesn't have as many ~ as는 덜 가졌을 때 써요. 주어가 누구인지도 확인하세요.", "why": "잠자리(6개)는 거미(8개)만큼 많은 다리를 갖고 있지 않아요. 그래서 A dragonfly doesn't have as many legs as a spider가 알맞아요.", "opts": [{"n": "①", "en": "A dragonfly has as many legs as a spider.", "ko": "잠자리는 거미만큼 많은 다리를 가지고 있다.", "ok": false, "why": "6개와 8개로 서로 달라서 같다는 문장은 틀려요."}, {"n": "②", "en": "A dragonfly doesn't have as many legs as a spider.", "ko": "잠자리는 거미만큼 많은 다리를 가지고 있지 않다.", "ok": true, "why": "6개가 8개보다 적어서 알맞아요."}, {"n": "③", "en": "A spider doesn't have as many legs as a dragonfly.", "ko": "거미는 잠자리만큼 많은 다리를 가지고 있지 않다.", "ok": false, "why": "거미가 더 많아서 반대예요."}, {"n": "④", "en": "A spider has as many legs as a dragonfly.", "ko": "거미는 잠자리만큼 많은 다리를 가지고 있다.", "ok": false, "why": "6개와 8개는 같지 않아서 틀려요."}, {"n": "⑤", "en": "A spider has twice as many legs as a dragonfly.", "ko": "거미는 잠자리의 두 배만큼 많은 다리를 가지고 있다.", "ok": false, "why": "8개는 6개의 두 배가 아니라서 틀려요."}], "pencil": "다리가 더 적은 쪽을 주어로 하면 doesn't have as ___ legs as", "pencilKey": "many", "page": 225, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "유형 01 비교급과 최상급의 형태", "type": "write", "ans": "more", "concept": ["034"], "gap": "", "words": [["vegetables", "채소들"], ["healthier", "더 건강한(원형 healthy 건강한)"], ["eat", "먹다"]], "h1": "'더 많은 채소'라는 뜻으로 쓰인 many(많은)가 문장 안에서 맞는 모양인지 보세요. 어색한 곳은 한 군데예요.", "h2": "many(많은)는 모양이 통째로 바뀌는 불규칙 단어예요. '더 많은'을 말할 때의 모양은 무엇이었는지 떠올려 보세요.", "why": "'더 많은'은 many의 비교급 more를 써서 나타내요. 그래서 many를 more로 고쳐요.", "opts": [], "pencil": "many의 비교급은 ___", "pencilKey": "more", "page": 225, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "유형 01 비교급과 최상급의 형태", "type": "write", "ans": "(1) thinner (2) most diligent", "concept": ["032"], "gap": "", "words": [["thin", "얇은"], ["smartphone", "스마트폰"], ["diligent", "부지런한"], ["sons", "아들들"]], "h1": "(1)은 '더 ~한'(비교급), (2)는 '가장 ~한'(최상급)으로 고쳐야 해요. 단어 길이와 끝 글자를 먼저 살펴보세요.", "h2": "thin(얇은)은 '모음 하나 + 자음 하나'로 끝나는 짧은 단어이고, diligent(부지런한)는 긴 단어예요. 각각의 규칙을 적용해 보세요.", "why": "thin은 끝 자음 n을 한 번 더 써서 thinner가 돼요. diligent는 긴 단어라서 most diligent(가장 부지런한)가 돼요.", "opts": [], "pencil": "'모음 + 자음'으로 끝나는 짧은 단어는 끝 자음을 ___ 쓰고 -er", "pencilKey": "한 번 더", "page": 225, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "유형 02·03 원급 비교 / 부정", "type": "write", "ans": "Soccer is not as popular as basketball in the U.S.", "concept": ["033"], "gap": "", "words": [["soccer", "축구"], ["popular", "인기 있는"], ["basketball", "농구"]], "h1": "문장은 'not as ... than(~보다)' 모양이에요. 비교 틀에서 앞쪽과 뒤쪽 단어의 짝이 맞는지 따져 보세요.", "h2": "원급 비교 부정은 「not as + 원급 + as」예요. than(~보다)은 어떤 모양의 단어와 함께 쓰는 말인지 떠올려 보세요.", "why": "원급 비교 부정에서 뒤쪽 칸은 as예요. 그래서 than을 as로 고쳐 문장 전체를 다시 써요.", "opts": [], "pencil": "not as ... ___ 의 마지막 칸은 as", "pencilKey": "as", "page": 225, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "유형 02·03 원급 비교 / 부정", "type": "write", "ans": "runs as fast as Fred", "concept": ["033"], "gap": "", "words": [["runs", "달린다(원형 run 달리다)"], ["fast", "빠르게"]], "h1": "그림에서 Alex와 Fred가 똑같이 결승선에 들어와요. 둘이 같은 정도일 때 쓰는 비교 틀이 무엇인지 떠올려 보세요.", "h2": "조건은 현재 시제이고 단어 run, fast를 써야 해요. 주어 Alex가 3인칭 단수라서 동사 끝 모양에도 주의하세요.", "why": "둘이 똑같이 빠르므로 as fast as(~만큼 빠르게)를 써요. 주어가 3인칭 단수라서 run(달리다)이 runs가 돼요.", "opts": [], "pencil": "3인칭 단수 현재 동사는 끝에 ___ 를 붙인다", "pencilKey": "-s", "page": 225, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "유형 02·03 원급 비교 / 부정", "type": "write", "ans": "is not as [so] dirty as Jinho's (jacket)", "concept": ["033"], "gap": "", "words": [["jacket", "재킷"], ["dirty", "더러운"]], "h1": "그림에서 민수의 재킷이 진호의 재킷보다 덜 더러워요. 덜하다는 것을 비교 틀로 말해 보세요. 조건은 be동사 현재형이에요.", "h2": "비교 대상은 사람이 아니라 진호의 재킷이에요. 같은 종류끼리 비교해야 한다는 점을 기억하세요.", "why": "민수의 재킷이 더 깨끗하므로 not as dirty as(~만큼 더럽지 않은)를 써요. 비교 대상은 같은 종류인 Jinho's jacket이에요.", "opts": [], "pencil": "비교 대상은 같은 ___ 끼리 맞춘다", "pencilKey": "종류", "page": 225, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "유형 02·03 원급 비교 / 부정", "type": "write", "ans": "He drives a car as carefully as his father.", "concept": ["033"], "gap": "", "words": [["drives", "운전한다(원형 drive 운전하다)"], ["carefully", "조심해서"], ["father", "아버지"]], "h1": "'아버지만큼 조심해서 운전한다'를 원급 비교로 써요. 9단어로 써야 하니 빠진 단어가 무엇인지 먼저 생각하세요.", "h2": "틀은 「주어 + 동사 + 목적어 + as + 원래 모양 + as + 비교 대상」이에요. 괄호 안 단어를 순서대로 놓아 보세요.", "why": "He drives a car as carefully as his father.처럼 써요. 부사 carefully(조심해서)를 as와 as 사이에 원급 그대로 넣어요.", "opts": [], "pencil": "주어 + 동사 ~ as + 부사 + as + ___", "pencilKey": "비교 대상", "page": 225, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "유형 04 배수 비교", "type": "write", "ans": "Jessy spent three times as much money as Pitt.", "concept": ["034-H1"], "gap": "", "words": [["spent", "썼다(원형 spend 쓰다)"], ["much", "많은"], ["money", "돈"]], "h1": "'3배만큼 많은 돈을 썼다'를 만들어요. 3배는 단어를 어떻게 말해야 하는지 보세요. 필요한 단어를 추가해도 돼요.", "h2": "배수 틀은 「배수 표현 + as + 원래 모양 + as」예요. much(많은)가 명사 money(돈)를 꾸미면 much money를 한 덩어리로 쓰는 점도 기억하세요.", "why": "3배는 three times예요. spent three times as much money as Pitt처럼 배수 표현이 맨 앞에 와요.", "opts": [], "pencil": "3배는 three + ___", "pencilKey": "times", "page": 225, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "유형 04 배수 비교", "type": "write", "ans": "is twice as expensive as a mango", "concept": ["034-H1"], "gap": "", "words": [["melon", "멜론"], ["mango", "망고"], ["expensive", "비싼"]], "h1": "멜론은 10달러, 망고는 5달러예요. 가격이 몇 배인지 먼저 계산해 보세요.", "h2": "배수 비교 틀은 「배수 표현 + as + 원래 모양 + as」예요. 2배는 숫자 two가 아닌 다른 단어로 말해요.", "why": "10달러는 5달러의 두 배라서 twice as expensive as(~의 두 배만큼 비싼)를 써요.", "opts": [], "pencil": "2배는 ___ 로 쓴다", "pencilKey": "twice", "page": 225, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "의미가 비슷한 문장 찾기", "type": "mc", "ans": "③", "concept": ["033"], "gap": "not as 원급 as 문장을 반대 뜻의 비교급 문장으로 바꿔 쓰는 방법(A is not as slow as B 는 B is slower than A 와 같은 뜻)", "words": [["goes to bed", "잠자리에 든다(원형 go 가다)"], ["latest", "가장 늦게"]], "h1": "ⓐ~ⓔ를 하나씩 읽고 누가 더 일찍 자고 누가 더 늦게 자는지 정리해 보세요. 그다음 같은 뜻끼리 짝을 찾아요.", "h2": "not as early as와 not as late as는 반대 방향이에요. 두 문장이 같은 사람을 더 일찍 잔다고 말하는지 확인해 보세요.", "why": "ⓒ(나는 수미만큼 일찍 자지 않는다)와 ⓓ(수미는 나만큼 늦게 자지 않는다)는 둘 다 수미가 더 일찍 잔다는 뜻이에요.", "opts": [{"n": "①", "en": "ⓐ, ⓑ", "ko": "ⓐ 수미가 가장 늦게 잔다. ⓑ 나는 수미만큼 일찍 잔다.", "ok": false, "why": "ⓐ는 수미가 가장 늦게 잔다는 뜻이라서 ⓑ와 달라요."}, {"n": "②", "en": "ⓑ, ⓒ", "ko": "ⓑ 나는 수미만큼 일찍 잔다. ⓒ 나는 수미만큼 일찍 자지 않는다.", "ok": false, "why": "ⓑ는 같은 정도, ⓒ는 수미가 더 일찍 잔다는 뜻이라서 달라요."}, {"n": "③", "en": "ⓒ, ⓓ", "ko": "ⓒ 나는 수미만큼 일찍 자지 않는다. ⓓ 수미는 나만큼 늦게 자지 않는다.", "ok": true, "why": "두 문장 모두 수미가 더 일찍 잔다는 뜻이라서 알맞아요."}, {"n": "④", "en": "ⓐ, ⓓ, ⓔ", "ko": "ⓐ 수미가 가장 늦게 잔다. ⓓ 수미는 나만큼 늦게 자지 않는다. ⓔ 수미는 나만큼 일찍 자지 않는다.", "ok": false, "why": "ⓐ는 수미가 가장 늦게, ⓓ는 더 일찍, ⓔ는 더 늦게 잔다는 뜻이라서 서로 달라요."}, {"n": "⑤", "en": "ⓑ, ⓒ, ⓓ", "ko": "ⓑ, ⓒ, ⓓ", "ok": false, "why": "ⓑ는 같은 정도라서 ⓒ, ⓓ와 뜻이 달라요."}], "pencil": "A not as late as B 는 A가 B보다 ___ 자는 뜻이다", "pencilKey": "일찍", "page": 226, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "어법상 어색한 문장의 개수", "type": "mc", "ans": "③", "concept": ["033", "032"], "gap": "", "words": [["better", "더 잘, 더 좋은"], ["well", "잘"], ["cheapest", "가장 싼"], ["hospital", "병원"], ["museum", "박물관"]], "h1": "ⓐ~ⓕ를 하나씩 읽고 어색한 문장에 표시한 뒤 개수를 세어 보세요. 의미 비교가 필요한 문장도 있어요.", "h2": "as와 as 사이의 비교급, 비교 대상이 서로 같은 종류인지, 최상급의 철자를 하나씩 확인하세요.", "why": "ⓐ는 as와 as 사이에 better가 있어서, ⓒ는 Jimin(사람)과 hair(머리카락)를 비교해서, ⓔ는 cheapest의 철자가 틀려서 어색해요. 모두 세 개예요.", "opts": [{"n": "①", "en": "1개", "ko": "한 개", "ok": false, "why": "틀린 문장이 세 개라서 오답이에요."}, {"n": "②", "en": "2개", "ko": "두 개", "ok": false, "why": "틀린 문장이 세 개라서 오답이에요."}, {"n": "③", "en": "3개", "ko": "세 개", "ok": true, "why": "ⓐ, ⓒ, ⓔ 세 개가 어색해서 알맞아요."}, {"n": "④", "en": "4개", "ko": "네 개", "ok": false, "why": "틀린 문장이 세 개라서 오답이에요."}, {"n": "⑤", "en": "5개", "ko": "다섯 개", "ok": false, "why": "틀린 문장이 세 개라서 오답이에요."}], "pencil": "as와 as 사이에는 비교급이 아니라 ___ 를 쓴다", "pencilKey": "원급", "page": 226, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "그림과 일치하지 않는 것", "type": "mc", "ans": "②, ④", "concept": ["033", "034-H1"], "gap": "", "words": [["heavy", "무거운"], ["light", "가벼운"], ["apple", "사과"], ["orange", "오렌지"], ["kiwi", "키위"]], "h1": "그림에서 사과, 오렌지, 키위의 무게를 먼저 정리하세요. 일치하지 않는 것을 모두 고르는 문제라서 답이 두 개예요.", "h2": "보기마다 누가 더 무겁고 누가 더 가벼운지 그림과 대 보세요. isn't as ~ as는 덜하다는 뜻이에요.", "why": "사과와 오렌지는 같은 무게이고 둘 다 키위보다 무거워요. 그래서 사과가 키위만큼 무겁지 않다는 ②와 키위가 오렌지만큼 가볍지 않다는 ④가 그림과 달라요.", "opts": [{"n": "①", "en": "The apple is as heavy as the orange.", "ko": "사과는 오렌지만큼 무겁다.", "ok": false, "why": "두 과일의 무게가 같아서 그림과 일치해요."}, {"n": "②", "en": "The apple isn't as heavy as the kiwi.", "ko": "사과는 키위만큼 무겁지 않다.",  ["expensive", "비싼"], ["yours", "너의 것"]], "h1": "비교하는 두 대상이 같은 종류인지 확인하세요. 내 배낭과 비교되는 것이 사람인지 물건인지 생각해 보세요.", "h2": "비교는 같은 종류끼리 해야 해요. '네 것'을 말하려면 you(너) 대신 소유를 나타내는 말이 필요해요.", "why": "내 배낭과 비교하는 것은 '네 배낭'이라서 yours(너의 것)를 써야 해요. you는 사람이라서 a는 틀려요.", "opts": [{"n": "a", "en": "My backpack is four times as expensive as you.", "ko": "(잘못된 문장)", "ok": false, "why": "배낭과 사람(you)을 비교해서 틀려요."}, {"n": "b", "en": "My backpack is four times as expensive as yours.", "ko": "내 배낭은 네 것의 네 배만큼 비싸다.", "ok": true, "why": "같은 종류인 배낭끼리 비교해서 알맞아요."}], "pencil": "비교 대상은 같은 ___ 끼리 맞춘다", "pencilKey": "종류", "page": 227, "sec": "q"}];

var CONCEPT_NAMES={"034": "'~보다 더 …하다'와 '훨씬 더 …하다'는 어떻게 말할까", "032": "'더 ~한', '가장 ~한'은 단어 모양을 어떻게 바꿀까", "033": "'~만큼 …하다'는 as를 어떻게 써서 말할까", "034-H1": "'세 배 크다'와 '점점 더 추워진다'는 영어로 어떻게 말할까"};
var SAVE="bpm2-"+UNIT;
var st={tab:0,idx:0,rec:{}};
function ld(){try{var s=localStorage.getItem(SAVE);if(s){var o=JSON.parse(s);if(o&&o.rec)st.rec=o.rec;if(o&&typeof o.tab==="number")st.tab=o.tab;if(o&&typeof o.idx==="number")st.idx=o.idx}}catch(e){}}
function sv(){try{localStorage.setItem(SAVE,JSON.stringify({rec:st.rec,tab:st.tab,idx:st.idx}))}catch(e){}}
function items(t){return DATA.filter(function(d){return d.sec===STEPS[t].key})}
function rec(id){return st.rec[id]||(st.rec[id]={})}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function hl(s){return esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="hl">$1</span>')}
var PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
function norm(s){return String(s||"").toLowerCase().replace(/[.\s]/g,"")}
function renderTabs(){
 var h="";STEPS.forEach(function(s,i){
  var its=items(i),done=its.filter(function(d){return rec(d.id).done}).length;
  h+='<div class="tab'+(i===st.tab?' on':'')+'" onclick="goTab('+i+')">'+esc(s.name)+'<small>'+done+'/'+its.length+'</small></div>'});
 document.getElementById("tabs").innerHTML=h;
 var all=DATA.filter(function(d){return rec(d.id).done}).length;
 document.getElementById("prog").textContent=all+"/"+DATA.length;
}
function goTab(i){st.tab=i;st.idx=0;sv();render()}
function goIdx(i){st.idx=i;sv();render()}
function render(){
 renderTabs();
 var its=items(st.tab),app=document.getElementById("app");
 if(st.tab>=STEPS.length){return}
 if(its.length===0){app.innerHTML='<div class="card">문항이 없어요.</div>';return}
 if(st.idx>=its.length){app.innerHTML=summary();return}
 var d=its[st.idx],r=rec(d.id);
 var h='<div class="nums">';
 its.forEach(function(x,i){var rr=rec(x.id);h+='<button class="nb'+(i===st.idx?' cur':'')+(rr.done?(rr.right?' ok':' ng'):'')+'" onclick="goIdx('+i+')">'+x.no+'</button>'});
 h+='<button class="nb" onclick="goIdx('+its.length+')" title="결과">결과</button></div>';
 h+='<div class="card"><span class="tag">'+esc(STEPS[st.tab].name)+' · '+d.no+'번</span><div class="qt">'+esc(d.qtype)+(d.page?' · 교재 '+d.page+'쪽':'')+'</div>';
 if(!r.done){
  h+='<button class="btn s" onclick="useHint(\''+d.id+'\',1)">'+(r.h>=1?'먼저 볼 것 (열려 있어요)':'먼저 볼 것 보기')+'</button>';
  if(r.h>=1){
   h+='<div class="hint">'+hl(d.h1)+'</div>';
   if(d.words&&d.words.length){h+='<div class="lab">단어 뜻</div><div class="chips">'+d.words.map(function(w){return '<span><b>'+esc(w[0])+'</b> '+esc(w[1])+'</span>'}).join("")+'</div>'}
   if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
   if(r.h<2)h+='<button class="btn g" onclick="useHint(\''+d.id+'\',2)">아직 막혀요 · 한 걸음 더</button>';
  }
  if(r.h>=2)h+='<div class="hint two">'+hl(d.h2)+'</div>';
  if(d.type==="mc"){
   var labs=d.opts.map(function(o){return o.n});
   var multi=d.ans.indexOf(",")>=0,sel=r.sel||[];
   h+='<div class="choices'+(labs.length===2?' two':'')+'">'+labs.map(function(l){return '<button class="ch" style="'+(multi&&sel.indexOf(l)>=0?'background:var(--soft);border-color:var(--a)':'')+'" onclick="'+(multi?'tog':'pick')+'(\''+d.id+'\',\''+l+'\')">'+esc(l)+'</button>'}).join("")+'</div>';
   h+=multi?'<div class="meter">정답이 두 개예요. 모두 누른 뒤 확인을 눌러요</div><button class="btn p" onclick="confirmMulti(\''+d.id+'\')">확인</button>':'<div class="meter">책의 답을 골라 누르면 바로 확인돼요</div>';
  }else{
   h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div>';
   h+='<button class="btn p" onclick="showW(\''+d.id+'\')">정답 확인</button>';
  }
 }else{
  h+=answerView(d,r);
 }
 h+='</div>';
 h+='<div class="nav">'+(st.idx>0?'<button class="btn g" onclick="goIdx('+(st.idx-1)+')">이전</button>':'')+'<button class="btn p" onclick="goIdx('+(st.idx+1)+')">'+(st.idx+1>=its.length?'결과 보기':'다음 문제')+'</button></div>';
 app.innerHTML=h;
}
function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
