 "may(허가) = can / may (~해도 된다)");
C("NS","N",5,"밑줄 친 부분이 어법상 옳지 않은 것을 고르시오.",["① You <u>need not</u> be ashamed.","② You <u>don’t need to</u> be in a rush.","③ You <u>should</u> take a vacation.","④ I <u>will can</u> able to afford the rent.","⑤ Mr. Patel <u>must</u> sign the contract by today."],"④ I <u>will can</u> able to afford the rent.","I will be able to afford the rent. (O)","나는 월세를 감당할 수 있을 것이다.",
 "본책 p.44 박스 ‘조동사는 두 개를 연달아 쓸 수 없다’를 보세요.",
 "1) 밑줄 친 부분 중 조동사가 두 개 연달아 있는 보기가 있어요.  2) 이런 경우 can을 be able to로 바꿔 will 뒤에 써요.",
 "네 번째 보기예요. will can ~ 부분이 틀렸어요.",
 "조동사 두 개 연달아 X → will be able to");
C("NS","N",6,"밑줄 친 부분이 어법상 옳지 않은 것을 고르시오.",["① Kelly <u>used to playing</u> badminton.","② I <u>can’t hang out</u> with you tonight.","③ I’<u>d like to</u> speak with Lydia, please.","④ <u>Did she use to take</u> ballet lessons?","⑤ I’<u>d better</u> run to the store before it closes."],"① Kelly <u>used to playing</u> badminton.","Kelly used to play badminton. (O)","Kelly는 배드민턴을 치곤 했다.",
 "본책 p.48 used to + 동사원형(과거의 습관) 줄을 보세요.",
 "1) 각 밑줄에서 조동사 뒤 동사가 어떤 모양인지 봐요.  2) used to, can’t, ’d like to, use to, ’d better 뒤에는 모두 동사원형이 와야 해요.  3) -ing가 붙은 곳이 있는지 찾아요.",
 "첫 번째 보기예요. playing을 play로 고쳐야 해요.",
 "used to + 동사원형 (-ing 안 됨)");
C("NS","N",7,"빈칸에 들어갈 말로 알맞지 않은 것은?<br>___ you carry this suitcase for me?",["① Can","② Could","③ Will","④ Would","⑤ Should"],"⑤ Should","Can[Could/Will/Would] you carry this suitcase for me?","이 여행 가방을 나 대신 들어 주시겠어요?",
 "본책 p.44 can의 ‘요청’ 줄과 will의 ‘요청’ 줄, would 설명을 보세요.",
 "1) ‘~해 주시겠어요?’는 부탁(요청)하는 말이에요.  2) 요청에는 Can/Could, Will/Would를 써요.  3) 다섯 개를 하나씩 빈칸에 넣어 ‘~해 주시겠어요?’가 되는지 확인해요.",
 "다섯 번째 보기가 알맞지 않아요.",
 "요청 = Can/Could/Will/Would you ~?");
C("NS","N",8,"밑줄 친 부분과 바꿔 쓸 수 있는 것을 고르시오.<br>You <u>don’t have to</u> come if you don’t want to.",["① will not","② must not","③ need not","④ should not","⑤ wouldn’t like to"],"③ need not","You need not come if you don’t want to.","원하지 않으면 너는 오지 않아도 된다.",
 "본책 p.46 아래 ‘don’t have to 불필요 ~할 필요가 없다 (= need not, don’t need to)’를 보세요.",
 "1) don’t have to는 ‘~할 필요가 없다’ 뜻이에요.  2) must not은 금지라서 뜻이 달라요.  3) ‘불필요’를 나타내는 다른 표현을 찾아요.",
 "n으로 시작하는 보기, 세 번째예요.",
 "don’t have to = need not = don’t need to");
C("NS","N",9,"밑줄 친 부분과 바꿔 쓸 수 있는 것을 고르시오.<br>The coach said Jin <u>must</u> join the national ski jumping team.",["① can","② may","③ will","④ has to","⑤ used to"],"④ has to","The coach said Jin has to join the national ski jumping team.","코치는 Jin이 국가대표 스키점프 팀에 들어가야 한다고 말했다.",
 "본책 p.46 must의 ‘의무 ~해야 한다 (= have/has to + 동사원형)’ 줄을 보세요.",
 "1) 코치가 ‘들어가야 한다’고 했으니 의무 의미예요.  2) must의 의무와 같은 뜻으로 쓰는 표현을 찾아요.  3) 주어가 Jin(3인칭 단수)이에요.",
 "네 번째 보기예요. h로 시작해요.",
 "must(의무) = have/has to");
C("NS","N",10,"빈칸에 공통으로 들어갈 말로 알맞은 것은?<br>• I ___ to pay extra for gift-wrapping.<br>• You ___ better go to bed now.",["① had","② would","③ must","④ could","⑤ should"],"① had","I had to pay extra for gift-wrapping. / You had better go to bed now.","나는 선물 포장에 추가 요금을 내야 했다. / 너는 지금 자러 가는 게 좋겠다.",
 "본책 p.46 박스 must의 과거형 ‘had to’와 p.48 ‘had better’를 보세요.",
 "1) 첫 문장은 ‘to’ 앞이라서 ‘~해야 했다’의 had to를 떠올려요.  2) 둘째 문장은 ‘better’ 앞이라서 ‘~하는 게 좋겠다’의 표현이에요.  3) 둘 다에 들어가는 단어를 찾아요.",
 "h로 시작하는 세 글자, 첫 번째 보기예요.",
 "had to = 해야 했다 / had better = ~하는 게 좋겠다");
C("NS","N",11,"다음은 각자 해야 할 집안일을 써 놓은 메모이다. 메모의 내용과 일치하는 것을 고르시오.<br>(메모: Dad - throw out the garbage, make dinner / Mom - do laundry, make dinner / Yeonjae - walk the dog, water the plants)",["① Dad should do the laundry.","② Mom doesn’t need to make dinner.","③ Yeonjae must walk the dog.","④ Yeonjae doesn’t have to water the plants.","⑤ Mom and Dad have to walk the dog."],"③ Yeonjae must walk the dog.","Yeonjae must walk the dog.","연재는 개를 산책시켜야 한다.",
 "본책 p.46 must(의무)와 should, have to 설명을 보세요.",
 "1) 메모는 각자 해야 할 일 목록이에요.  2) 보기의 이름과 일을 메모와 하나씩 맞춰 봐요.  3) Dad는 laundry(빨래)가 없고, Mom은 make dinner가 있어요. Yeonjae의 일은?",
 "세 번째 보기예요. Yeonjae는 walk the dog가 목록에 있어요.",
 "메모에 있는 일 → must/have to/should");
W("NS","N",12,"우리말과 일치하도록 빈칸에 알맞은 말을 쓰시오.<br>우리 학교 근처에는 공원이 있었다.<br>There ___ a park near my school.","used to be","There used to be a park near my school.","우리 학교 근처에는 공원이 있었다.",
 "본책 p.48 used to의 ‘과거의 상태 (예전에는) ~이었다’ 줄을 보세요.",
 "1) ‘있었다’는 예전의 상태예요.  2) 과거의 상태는 would로 쓸 수 없어요.  3) There 뒤에 쓰고 be 동사원형으로 끝나요.",
 "세 칸이에요. u, t, b로 시작하는 단어를 차례로 써요.",
 "과거의 상태 There used to be ~");
W("NS","N",13,"우리말과 일치하도록 빈칸에 알맞은 말을 쓰시오.<br>Mike는 오늘 점심으로 파스타를 먹고 싶다.<br>Mike ___ eat pasta for lunch today.","would like to","Mike would like to eat pasta for lunch today.","Mike는 오늘 점심으로 파스타를 먹고 싶다.",
 "본책 p.48 would like to ‘희망 ~하고 싶다’ 줄을 보세요.",
 "1) ‘먹고 싶다’는 희망이에요.  2) 빈칸 세 칸에 맞게 세 단어를 써요.  3) 뒤에 eat이 바로 오니 to까지 포함해요.",
 "세 칸이에요. w, l, t로 시작하고, 마지막 칸은 두 글자예요.",
 "would like to + 동사원형 = ~하고 싶다");
W("NS","N",14,"우리말과 일치하도록 빈칸에 알맞은 말을 쓰시오.<br>그의 모든 소지품은 비싸 보인다. 그는 부자인 것이 틀림없다.<br>All his belongings look expensive. He ___ rich.","must be","All his belongings look expensive. He must be rich.","그의 모든 소지품은 비싸 보인다. 그는 부자임이 틀림없다.",
 "본책 p.46 must의 ‘강한 추측’ 줄을 보세요.",
 "1) 소지품이 비싸 보이는 것이 근거예요.  2) ‘부자인 것이 틀림없다’는 강한 추측이에요.  3) 빈칸이 두 칸이라 조동사 + be예요.",
 "두 칸이에요. 첫 칸은 m으로 시작하는 네 글자, 둘째 칸은 be동사 원형(두 글자)이에요.",
 "강한 추측 = must be");
C("NS","N",15,"밑줄 친 부분의 의미가 나머지 넷과 다른 것을 고르시오.",["① I <u>used to</u> walk to school.","② We <u>used to</u> ride bikes on the weekends.","③ I <u>used to</u> go hiking every morning.","④ Nick and I <u>used to</u> study English together.","⑤ There <u>used to</u> be a mailbox on the corner."],"⑤ There <u>used to</u> be a mailbox on the corner.","There used to be a mailbox on the corner. (과거의 상태)","모퉁이에 우체통이 있었다. (예전에는 ~이었다)",
 "본책 p.48 used to의 ‘과거의 습관’과 ‘과거의 상태’ 두 줄을 비교해 보세요.",
 "1) 네 개는 반복해서 하던 행동(걷다, 타다, 가다, 공부하다)이에요.  2) 나머지 하나는 반복 행동이 아니라 ‘있었다’는 상태예요.  3) 뜻이 다른 하나를 찾아요.",
 "마지막인 다섯 번째 보기예요. There used to be ~ 모양이에요.",
 "습관(~하곤 했다) vs 상태(~이었다)");
C("NS","N",16,"밑줄 친 부분의 의미가 나머지 넷과 다른 것을 고르시오.",["① You <u>must</u> be home before dark.","② You <u>must not</u> talk loudly on the train.","③ Gina <u>must</u> attend every class to pass.","④ You <u>must</u> be hungry after skipping lunch.","⑤ Max <u>must</u> brush his teeth before he goes to bed."],"④ You <u>must</u> be hungry after skipping lunch.","You must be hungry after skipping lunch. (강한 추측)","점심을 걸렀으니 너는 배가 고픈 게 틀림없다.",
 "본책 p.46 must의 ‘의무’와 ‘강한 추측’ 두 줄을 비교해 보세요.",
 "1) 각 문장이 ‘해야 할 일·하면 안 되는 일’을 말하는지, 누군가의 상태를 ‘짐작’하는지 봐요.  2) before dark, to pass, after skipping lunch 같은 앞뒤 단서를 살펴요.  3) 짐작하는 문장은 ‘~임이 틀림없다’로 풀려요.",
 "네 번째 보기예요. ‘배고픈 게 틀림없다’ 뜻이에요.",
 "must + be + 형용사 = 강한 추측");
M("NS","N",17,"어법상 옳은 것을 모두 고르시오.",["① Will you be home by eight o’clock?","② Grace not will be at the party.","③ She used to coming to our house.","④ This store may be open on Sundays.","⑤ Rana couldn’t finish her homework on time."],["① Will you be home by eight o’clock?","④ This store may be open on Sundays.","⑤ Rana couldn’t finish her homework on time."],"① Will you be home by eight o’clock? / ④ This store may be open on Sundays. / ⑤ Rana couldn’t finish her homework on time.","① 8시까지 집에 있을 거니? ④ 이 가게는 일요일에 문을 열지도 모른다. ⑤ Rana는 숙제를 제시간에 끝낼 수 없었다.",
 "본책 p.44 will 부정(will not[won’t])과 p.48 used to + 동사원형을 보세요.",
 "1) 조동사 문장의 부정에서 not이 조동사 앞에 오는지 뒤에 오는지 봐요.  2) used to, may, couldn’t 같은 조동사 뒤에 동사원형이 왔는지 하나씩 확인해요.  3) 틀린 곳이 있는 보기를 지워 나가요.",
 "②는 not의 자리, ③은 used to 뒤 coming(원형 come: 오다)이 틀렸어요. 나머지는 모두 옳아요.",
 "조동사 부정은 조동사 뒤에 not");
C("NS","N",18,"우리말과 일치하도록 ( ) 안에 주어진 말을 배열할 때 다섯 번째 오는 것은?<br>너는 아침마다 테니스를 치곤 했니?<br>(you / to / in / mornings / did / use / tennis / the / play)",["① you","② use","③ to","④ play","⑤ tennis"],"④ play","Did you use to play tennis in the mornings?","너는 아침마다 테니스를 치곤 했니?",
 "본책 p.48 박스 ‘used to의 의문형은 「Did + 주어 + use to ~?」’를 보세요.",
 "1) 먼저 문장을 완성해 봐요. Did로 시작해요.  2) Did + 주어(you) + use to 다음에 동사원형을 써요.  3) 앞에서부터 단어를 하나씩 세어 다섯 번째를 찾아요.",
 "Did(1) you(2) use(3) to(4) ___(5) 순서예요. ‘치다’를 뜻하는 동사예요.",
 "배열: Did - 주어 - use - to - 동사원형 순서로 세기");
M("NS","N",19,"빈칸에 들어갈 말로 알맞은 것을 모두 고르시오.<br>May I have your attention, please? The fasten seat belt sign is off now. So you ___ unfasten your seat belt. However, we recommend that you keep your seat belt fastened during the entire flight. Thank you for your cooperation.",["① may","② may not","③ can","④ will","⑤ will not"],["① may","③ can"],"So you may[can] unfasten your seat belt.","주목해 주시겠습니까? 안전벨트 착용 표시가 이제 꺼졌습니다. 따라서 안전벨트를 푸셔도 됩니다. 하지만 전체 비행 동안 안전벨트를 매고 계실 것을 권고드립니다.",
 "본책 p.44 may의 ‘허가’ 줄과 can의 ‘허가’ 줄을 보세요.",
 "1) 벨트 표시등이 꺼졌어요.  2) 그래서 벨트를 풀어도 되는 상황이에요.  3) ‘~해도 된다’ 허가를 뜻하는 두 조동사를 모두 골라요.",
 "②, ④, ⑤는 빼요. ‘~해도 된다’ 뜻은 두 개예요.",
 "허가 may = can (~해도 된다)");
C("NS","N",20,"빈칸에 들어갈 말이 순서대로 짝지어진 것은?<br>• I ___ pack my lunch today.<br>• You ___ be careful when touching a hot pot.<br>• There ___ be a department store here, but there is one now.",["① need not — should not — used to","② need not — should — used not to","③ used to — had better — must","④ used to — had better not — used not to","⑤ don’t need to — must — would like to"],"② need not — should — used not to","I need not pack my lunch today. You should be careful when touching a hot pot. There used not to be a department store here, but there is one now.","나는 오늘 도시락을 쌀 필요가 없다. 너는 뜨거운 냄비를 만질 때 조심해야 한다. 여기에는 예전에 백화점이 없었지만 지금은 하나 있다.",
 "본책 p.46 need not(불필요), should(충고)와 p.48 used to의 부정형(used not to)을 보세요.",
 "1) 첫 문장: 빈칸 뒤에 동사원형 pack이 있고 ‘쌀 필요 없다’가 어울려요.  2) 둘째 문장: 뜨거운 냄비를 조심하라는 충고예요.  3) 셋째 문장: but there is one now(하지만 지금은 하나 있다)로 보아 예전에는 없었다는 과거 상태의 부정이에요.",
 "need not은 필요 없음, should는 해야 함, used not to는 예전에 ~이 아니었음이에요. 두 번째 보기예요.",
 "need not / should / used not to");
W("NS","N",21,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>Katie couldn’t eat anymore because she was so full.<br>= Katie ___ anymore because she was so full.","wasn’t able to eat","Katie wasn’t able to eat anymore because she was so full.","Katie는 너무 배불러서 더 이상 먹을 수 없었다.",
 "본책 p.44 박스 ‘can이 능력을 나타낼 때, 과거형은 could 또는 was/were able to’를 보세요.",
 "1) couldn’t는 과거의 ‘~할 수 없었다’예요.  2) 같은 뜻을 be able to로 나타내요.  3) 주어가 Katie(3인칭 단수)라서 be동사가 정해져요.",
 "네 칸이에요. 첫 칸은 Katie에 맞춘 be동사 과거 부정 줄임말(w로 시작), 가운데 두 칸은 a, t로 시작하고, 마지막 칸은 couldn’t 뒤의 동사 그대로예요.",
 "couldn’t = wasn’t[weren’t] able to");
C("NS","N",22,"우리말을 영어로 잘못 옮긴 것은?",["① 너는 이 수업을 들어야만 한다. - You must attend this class.","② 그는 지금 지쳐 있을지도 모른다. - He might be tired now.","③ 너는 오늘 집에 일찍 가는 게 좋겠다. - You would like to go home early today.","④ Janice는 고등학교 때 댄스팀에 속해 있었다. - Janice used to be on the dancing team when she was in high school.","⑤ 당신이 좋아하는 가수의 영상을 보여 주시겠어요? - Could you show me some videos of your favorite singer?"],"③ 너는 오늘 집에 일찍 가는 게 좋겠다. - You would like to go home early today.","You had better go home early today. (O)","너는 오늘 집에 일찍 가는 게 좋겠다.",
 "본책 p.48 had better(충고, 권고)와 would like to(희망) 줄을 비교하세요.",
 "1) 우리말이 ‘~하는 게 좋겠다’(충고)인 보기를 찾아요.  2) would like to는 ‘~하고 싶다’ 뜻이에요.  3) 충고에는 어떤 표현이 맞을까요?",
 "세 번째 보기예요. would like to를 had better로 바꿔야 해요.",
 "충고 = had better (would like to는 희망)");
C("NS","N",23,"밑줄 친 부분의 의미가 같은 것끼리 바르게 짝지어진 것은?<br>ⓐ My dad <u>can</u> repair cars.<br>ⓑ <u>Can</u> I borrow your cell phone?<br>ⓒ You <u>can</u> use these pictures for commercial purposes.<br>ⓓ Tim <u>could</u> read the newspaper when he was four.<br>ⓔ You <u>can’t</u> swim here without a swim suit.<br>ⓕ This answer <u>can’t</u> be correct.",["① ⓐ, ⓑ, ⓒ","② ⓐ, ⓒ, ⓕ","③ ⓑ, ⓒ, ⓔ","④ ⓑ, ⓓ, ⓕ","⑤ ⓓ, ⓔ, ⓕ"],"③ ⓑ, ⓒ, ⓔ","ⓑ, ⓒ, ⓔ는 허가(~해도 된다 / ~하면 안 된다)를 나타낸다.","ⓑ 제가 당신의 휴대폰을 빌려도 될까요? ⓒ 이 사진들을 상업적 목적으로 사용해도 된다. ⓔ 수영복 없이 여기서 수영하면 안 된다.",
 "본책 p.44 can의 ‘능력·허가·요청’ 줄과 p.46 박스(can’t = 강한 추측의 부정)를 보세요.",
 "1) can은 능력·허가·요청, can’t는 ‘~일 리가 없다’로도 쓰여요.  2) 각 문장을 ‘~할 수 있다 / ~해도 된다 / ~일 리가 없다’에 넣어 보고 자연스러운 뜻을 골라요.  3) 같은 뜻 세 개를 묶은 보기를 찾아요.",
 "ⓐ, ⓓ는 능력, ⓕ는 ‘~일 리가 없다’예요. 이 셋이 하나도 없는 보기를 골라요.",
 "can = 능력 / 허가 / can’t = 일 리 없다");
W("NS","N",24,"대화의 ⓐ~ⓒ에 들어갈 말로 알맞은 것을 골라 쓰시오.<br>A ⓐ (Should / May) I take your order?<br>B I would like ⓑ (have / to have) a slice of apple pie. ⓒ (Can / May) you add a scoop of ice cream with that?<br>A Sure. Please wait a moment.<br>(ⓐ, ⓑ, ⓒ를 순서대로 쓰시오)","May / to have / Can","A May I take your order? B I would like to have a slice of apple pie. Can you add a scoop of ice cream with that?","A: 주문하시겠습니까? B: 사과 파이 한 조각 주세요. 거기에 아이스크림 한 스쿱 얹어 주시겠어요? A: 알겠습니다. 잠시만 기다려 주세요.",
 "본책 p.44 may의 ‘허가’(May I ~?)와 can ‘요청’, p.48 would like to + 동사원형을 보세요.",
 "1) ⓐ 가게 직원이 ‘주문 받아도 될까요?’ 하고 허락을 구해요.  2) ⓑ would like 뒤에는 to + 동사원형이에요.  3) ⓒ ‘~해 주시겠어요?’ 요청은 you가 주어일 때 Can/May 중 어느 쪽일까요?",
 "ⓐ M으로 시작, ⓑ to로 시작, ⓒ C로 시작해요.",
 "May I ~? / would like to + V / Can you ~?",["Should","May","have","to have","Can"]);
C("NS","N",25,"어법상 옳은 것의 개수는?<br>• There used to being a library here.<br>• I would like stay longer, but it’s too late.<br>• They may have dessert after lunch.<br>• He not used to drink coffee at all.<br>• You not must look directly at the sun.<br>• You shouldn’t park your car there.",["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],"② 2개","옳은 문장: They may have dessert after lunch. / You shouldn’t park your car there.","(옳은 것) 그들은 점심 후에 디저트를 먹어도 된다. / 너는 거기에 차를 주차하면 안 된다.",
 "본책 p.48 used to, would like to와 p.44, p.46의 부정문 예문(조동사 뒤에 not)을 보세요.",
 "1) 여섯 문장마다 조동사 뒤가 동사원형인지 봐요.  2) would like 뒤에 빠진 것이 없는지 봐요.  3) not이 조동사 앞에 있는지 뒤에 있는지 확인해요.",
 "첫째 문장 being, 둘째 문장 like 뒤, 넷째·다섯째 문장의 not 위치가 틀렸어요. 남은 문장 수를 세어요.",
 "부정은 조동사 + not, used to + 동사원형");
W("NS","N",26,"그림을 보고 주어진 조건에 맞게 문장을 완성하시오.<br>(그림: 운전자가 손에 스마트폰을 들고 운전하고 있고, 차 앞에서 사람이 길을 건너고 있다.)<br>[조건] • He’d로 시작할 것  • 충고의 의미를 나타내는 조동사를 사용할 것  • ( ) 안의 말을 이용할 것<br>___ while driving. (use one’s smartphone)","He’d better not use his smartphone","He’d better not use his smartphone while driving.","그는 운전하는 동안 스마트폰을 사용하지 않는 게 좋겠다.",
 "본책 p.48 had better의 축약형 ’d better와 부정형 had better not을 보세요.",
 "1) 운전 중 스마트폰은 위험해요. 그래서 하지 않는 게 좋다는 충고가 어울려요.  2) He’d는 He had의 줄임말이에요.  3) one’s는 주어에 맞춰 his로 바꿔요.",
 "He’d 다음에 b로 시작하는 단어, 부정어, ( ) 안의 동사를 쓰고, one’s는 He에 맞는 소유격으로 바꿔요.",
 "He’d better not + 동사원형");
W("NS","N",27,"우리말과 일치하도록 주어진 조건에 맞게 영작하시오.<br>David는 그녀 때문에 속상할지도 모른다.<br>[조건] • 알맞은 조동사를 사용할 것  • upset, with를 사용할 것","David may[might] be upset with her","David may[might] be upset with her.","David는 그녀 때문에 속상할지도 모른다.",
 "본책 p.44 may의 ‘불확실한 추측 ~일지도 모른다’ 줄을 보세요.",
 "1) ‘~일지도 모른다’는 추측의 조동사예요.  2) 조동사 뒤에 동사원형 be를 쓰고 upset(속상한)을 이어요.  3) ‘그녀 때문에’는 with her로 써요.",
 "David 다음에 m으로 시작하는 추측 조동사, be동사 원형, upset with를 쓰고, ‘그녀’는 목적격으로 써요.",
 "주어 + may[might] + be + 형용사");
C("NS","N",28,"밑줄 친 부분을 잘못 고친 것은?",["① Kevin was <u>able to not</u> stop laughing. → not able to","② Joe must <u>happy</u> these days. → be happy","③ She <u>will must</u> go to bed early. → will should","④ Helen may <u>stays up</u> until 10:00 p.m. → stay up","⑤ They <u>was able to</u> go skating on the lake. → were able to"],"③ She <u>will must</u> go to bed early. → will should","She will have to go to bed early. (O)","그녀는 일찍 자러 가야 할 것이다.",
 "본책 p.44 박스 ‘조동사는 두 개를 연달아 쓸 수 없다’와 p.46 must의 미래형(will have to)을 보세요.",
 "1) 보기마다 고친 모양이 맞는지 하나씩 확인해요.  2) 조동사 두 개를 연달아 쓰면 안 된다는 규칙을 떠올려요.  3) 고친 결과에도 조동사가 두 개 남아 있는 보기가 있는지 봐요.",
 "세 번째 보기예요. must의 미래형(h로 시작하는 표현)을 will 뒤에 써야 해요.",
 "will must X, will should X → will have to");
C("NS","N",29,"두 문장의 의미가 서로 다른 것은?",["① May I see your old pictures? = Can I see your old pictures?","② You must not drive too fast. = You don’t have to drive too fast.","③ You don’t need to stay here with me. = You need not stay here with me.","④ Lions are able to find their own food. = Lions can find their own food.","⑤ Mozart could compose music when he was five. = Mozart was able to compose music when he was five."],"② You must not drive too fast. = You don’t have to drive too fast.","You must not drive too fast. (너무 빠르게 운전해서는 안 된다) ≠ You don’t have to drive too fast. (너무 빠르게 운전할 필요가 없다)","너무 빠르게 운전해서는 안 된다 / 너무 빠르게 운전할 필요가 없다.",
 "본책 p.46 박스 ‘must not 강한 금지’와 ‘don’t have to 불필요’ 비교표를 보세요.",
 "1) 각 보기의 양쪽 문장이 같은 뜻인지 하나씩 봐요.  2) may·can(허가), need not·don’t need to(불필요), be able to·can(능력)은 같은 뜻 짝이에요.  3) ‘금지’와 ‘불필요’처럼 뜻이 다른 두 표현이 묶인 보기를 찾아요.",
 "두 번째 보기예요.",
 "must not(금지) ≠ don’t have to(불필요)");
W("NS","N",30,"어법상 틀린 부분을 두 곳 찾아 바르게 고치시오.<br>There would be a convenience store on the corner of this street. I used to go there all the time with my friends. However, a huge grocery store will open soon. We will can buy all our favorite snacks there.","would → used to / can → be able to","There used to be a convenience store on the corner of this street. … We will be able to buy all our favorite snacks there.","이 길모퉁이에 편의점이 있었다. 나는 항상 친구들과 그곳에 가곤 했다. 하지만 큰 식료품점이 곧 문을 열 것이다. 우리는 그곳에서 좋아하는 모든 간식을 살 수 있을 것이다.",
 "본책 p.48 박스 ‘과거의 상태를 나타낼 때는 would를 쓸 수 없다’와 p.44 박스 ‘조동사는 두 개를 연달아 쓸 수 없다’를 보세요.",
 "1) 첫 문장 There would be ~는 ‘예전에 ~이 있었다’는 과거의 상태예요. 상태에는 would를 쓸 수 없어요.  2) 마지막 문장 will can은 조동사 두 개가 연달아 있어요.  3) 두 곳을 각각 고쳐요.",
 "첫째는 would를 ‘u’로 시작하는 두 단어로, 둘째는 can을 ‘b’로 시작하는 be able to로 고쳐요.",
 "과거 상태 would X → used to / will can X → will be able to");
// ===== 문법정리노트 (p.56) =====
W("GN","G",1,"I can(= ___ ) ski. 나는 스키를 탈 수 있다.","am able to","I can(= am able to) ski.","나는 스키를 탈 수 있다.",
 "본책 p.44 can의 ‘능력’ 줄 오른쪽 ‘(= be able to + 동사원형)’을 보세요.",
 "1) can의 능력과 같은 뜻의 표현이에요.  2) 주어가 I라서 be동사는 정해져 있어요.",
 "세 칸이에요. 첫 칸은 I에 맞는 be동사(a로 시작하는 두 글자), 나머지 두 칸은 a, t로 시작해요.",
 "can(능력) = am/is/are able to");
W("GN","G",2,"조동사는 두 개를 연달아 쓸 수 없다.<br>I will ___ (can / be able to) pass the exam.","be able to","I will be able to pass the exam.","나는 시험에 합격할 수 있을 것이다.",
 "본책 p.44 박스 ‘조동사는 두 개를 연달아 쓸 수 없다’ 부분을 보세요.",
 "1) will 뒤에 can을 또 쓸 수 없어요.  2) 괄호 안 두 선택지 중 조동사가 아닌 쪽을 골라요.",
 "괄호 속 두 선택지 중 조동사가 아닌 두 번째 선택지예요.",
 "will can X → will be able to");
W("GN","G",3,"Can[ ___ ] you pass me the salt? 소금 좀 건네 줄래[주시겠어요]?","Could","Can[Could] you pass me the salt?","소금 좀 건네 줄래[주시겠어요]?",
 "본책 p.44 can의 ‘요청 ~해 주시겠어요?’ 줄과 박스 ‘could는 can의 과거형으로… 좀 더 공손한 표현’을 보세요.",
 "1) 대괄호 안에는 Can보다 더 공손한 표현이 와요.  2) can의 과거형 모양이에요.",
 "C로 시작하는 다섯 글자예요.",
 "Can[Could] you ~? = 요청");
W("GN","G",4,"It ___ [might] snow this weekend. 이번 주말에 눈이 올지도 모른다.","may","It may[might] snow this weekend.","이번 주말에 눈이 올지도 모른다.",
 "본책 p.44 may의 ‘불확실한 추측 ~일지도[할지도] 모른다’ 줄을 보세요.",
 "1) ‘눈이 올지도 모른다’는 불확실한 추측이에요.  2) might와 짝을 이루는 조동사예요.",
 "m으로 시작하는 세 글자예요.",
 "불확실한 추측 = may[might]");
W("GN","G",5,"You ___ my car. 너는 내 차를 운전해도 된다.","may drive","You may drive my car.","너는 내 차를 운전해도 된다.",
 "본책 p.44 may의 ‘허가 ~해도 된다 (= can)’ 줄의 예문을 보세요.",
 "1) ‘~해도 된다’ 허가예요.  2) 조동사 뒤에 drive(운전하다)를 써요.  3) 빈칸이 두 칸이에요.",
 "두 칸이에요. 첫 칸은 m으로 시작하는 세 글자, 둘째 칸은 d로 시작하는 ‘운전하다’예요.",
 "may + 동사원형 = ~해도 된다");
W("GN","G",6,"Sarah ___ a letter to her grandmother. Sarah는 그녀의 할머니에게 편지를 쓸 것이다.","will write","Sarah will write a letter to her grandmother.","Sarah는 그녀의 할머니에게 편지를 쓸 것이다.",
 "본책 p.44 will의 ‘예정, 의지 ~할 것이다’ 줄을 보세요.",
 "1) ‘~할 것이다’ 예정이에요.  2) 조동사 뒤에는 write(쓰다) 동사원형이에요.  3) 빈칸이 두 칸이에요.",
 "두 칸이에요. 첫 칸은 w로 시작하는 네 글자 조동사, 둘째 칸은 ‘쓰다’ 동사원형(w로 시작하는 다섯 글자)이에요.",
 "will + 동사원형 = ~할 것이다");
W("GN","G",7,"Will[ ___ ] you close the door? 문 좀 닫아 줄래[주시겠어요]?","Would","Will[Would] you close the door?","문 좀 닫아 줄래[주시겠어요]?",
 "본책 p.44 will의 ‘요청’ 줄 아래 설명 ‘will이 요청을 나타낼 때, would를 사용해서 더 정중하게’를 보세요.",
 "1) will의 요청 표현이에요.  2) 더 정중하게 말할 때 쓰는 모양을 떠올려요.  3) will의 과거형 모양이에요.",
 "W로 시작하는 다섯 글자예요.",
 "Will[Would] you ~? = 요청 (would가 더 정중)");
W("GN","G",8,"All employees must(= ___ ) wear this uniform. 모든 직원은 이 유니폼을 입어야 한다.","have to","All employees must(= have to) wear this uniform.","모든 직원은 이 유니폼을 입어야 한다.",
 "본책 p.46 must의 ‘의무 ~해야 한다 (= have/has to + 동사원형)’ 줄을 보세요.",
 "1) must(의무)와 같은 뜻의 표현을 써요.  2) 주어가 All employees(복수)예요.",
 "두 칸이에요. h로 시작하는 네 글자 + t로 시작하는 두 글자예요. 주어가 복수라서 has가 아니에요.",
 "must = have to (복수 주어), has to (3인칭 단수)");
W("GN","G",9,"Andy must ___. Andy는 피곤한 게 틀림없다.","be tired","Andy must be tired.","Andy는 피곤한 게 틀림없다.",
 "본책 p.46 must의 ‘강한 추측 ~임이 틀림없다’ 줄 예문을 보세요.",
 "1) ‘피곤한 게 틀림없다’는 강한 추측이에요.  2) must 뒤는 동사원형이라 be를 써요.  3) 그 뒤에 tired(피곤한)가 와요.",
 "두 칸이에요. 첫 칸은 be동사 원형(두 글자), 둘째 칸은 t로 시작하는 ‘피곤한’(다섯 글자)이에요.",
 "must + be + 형용사 = ~임이 틀림없다");
W("GN","G",10,"I ___ borrow this book. 나는 이 책을 빌리고 싶다.","would like to","I would like to borrow this book.","나는 이 책을 빌리고 싶다.",
 "본책 p.48 would like to ‘희망 ~하고 싶다’ 줄을 보세요.",
 "1) ‘~하고 싶다’ 희망이에요.  2) 빈칸이 세 칸이에요.  3) 뒤에 동사원형 borrow(빌리다)가 와요.",
 "세 칸이에요. w로 시작하는 다섯 글자, l로 시작하는 네 글자, t로 시작하는 두 글자예요.",
 "희망 I would like to = I’d like to");
W("GN","G",11,"I used to(= ___ ) ___ ___ ___ to school. 나는 학교 갈 때 버스를 타곤 했다.","would take the bus","I used to(= would) take the bus to school.","나는 학교 갈 때 버스를 타곤 했다.",
 "본책 p.48 used to의 ‘과거의 습관 ~하곤 했다 (= would + 동사원형)’ 줄을 보세요.",
 "1) used to(과거의 습관)와 바꿔 쓸 수 있는 조동사를 떠올려요.  2) 그 뒤에 동사원형 take(타다)와 the bus를 써요.",
 "첫 칸은 w로 시작하는 다섯 글자 조동사예요. 나머지 세 칸에는 ‘버스를 타다’를 t, t, b로 시작하는 세 단어로 써요.",
 "used to(과거의 습관) = would + 동사원형");

W(4,"D",1,"(우리말과 일치하도록 ( ) 안의 말을 이용) 그렇게 비싼 차를 사다니 그는 어리석었다. (buy)<br>It was foolish ___ such an expensive car.","of him to buy","It was foolish of him to buy such an expensive car.","그렇게 비싼 차를 사다니 그는 어리석었다.",d1+" 아래 ‘of + 목적격’ 설명의 형용사 목록을 보세요.","1) foolish(어리석은)는 사람의 성격을 나타내는 형용사예요.  2) 그래서 의미상의 주어는 ‘of + 목적격’이에요. ‘그’는 목적격으로 바꿔요.","o로 시작해서 buy(사다)로 끝나요. 네 단어예요.","성격 형용사 뒤 의미상의 주어 = of + 목적격");

W(4,"D",3,"(우리말과 일치하도록 ( ) 안의 말을 이용) 내가 일찍 일어나는 것은 어렵다. (wake up)<br>It is difficult ___ early.","for me to wake up","It is difficult for me to wake up early.","내가 일찍 일어나는 것은 어렵다.",d1+"를 보세요. 가주어 It과 의미상의 주어가 함께 나오는 예문이 있어요.","1) 일찍 일어나는 사람이 ‘나’예요. 의미상의 주어가 필요해요.  2) difficult(어려운)는 일의 상태를 말하니까 ‘for + 목적격’이에요. 나의 목적격을 써요.","다섯 단어예요. 첫 단어는 f로 시작하는 전치사이고, 마지막 두 칸은 wake up이에요.","difficult → for + 목적격 + to V");

[["기숙사에서 사는 것은 재미있다. (fun, live)<br>___ in a dormitory.","It is fun to live","It is fun to live in a dormitory.","기숙사에서 사는 것은 재미있다.","본책 p.58 POINT 1 ‘주어 역할’의 가주어 it 설명을 보세요.","1) ‘사는 것은’이 주어인데 아주 길어요. 그럴 땐 가주어 it을 써요.  2) 순서는 It → be동사 → 형용사 fun(재미있는) → 진주어 to live(살다)예요.","네 단어예요. It으로 시작하고, 넷째 칸은 l로 시작하는 동사예요.","It is 형용사 to V (가주어 구문)"],
 ["그녀는 다음 주에 내려야 할 결정이 있다. (a decision, make)<br>She ___ next week.","has a decision to make","She has a decision to make next week.","그녀는 다음 주에 내려야 할 결정이 있다.","본책 p.60 POINT 1 ‘(대)명사 + to부정사’를 보세요.","1) ‘~이 있다’ → have(가지다)의 현재형이에요. 주어가 She라서 모양이 바뀌어요.  2) ‘내려야 할 결정’은 명사 a decision 뒤에 to make(내리다)를 붙여요.","네 단어예요. 첫 단어는 h로 시작하는 세 글자 동사, 네 번째 단어가 to예요.","명사 + to V (~할 …): a decision to make"],
 ["나는 선거에서 John에게 투표하지 않기로 결정했다. (decide, vote)<br>I ___ for John in the election.","decided not to vote","I decided not to vote for John in the election.","나는 선거에서 John에게 투표하지 않기로 결정했다.","본책 p.58 POINT 2 ‘목적어 역할’의 decide(결정하다)와 부정 설명을 보세요.","1) ‘결정했다’는 과거라서 decide(결정하다)를 과거형으로 써요.  2) 부정은 to 앞에 not을 놓아요.","d로 시작하고 vote(투표하다)로 끝나요. 중간 두 단어는 not to예요.","decide + not to V (~하지 않기로 결정하다)"],
 ["내 뒷담화를 하다니 그는 무례했다. (rude, talk)<br>It was ___ behind my back.","rude of him to talk","It was rude of him to talk behind my back.","내 뒷담화를 하다니 그는 무례했다.","본책 p.64 POINT 1 ‘of + 목적격’ 설명의 형용사 목록을 보세요.","1) rude(무례한)는 사람의 성격을 나타내는 형용사예요.  2) 그래서 rude 뒤에 ‘of + 목적격’을 쓰고, 그다음에 to talk(말하다)를 이어요.","다섯 단어예요. rude로 시작하고, 둘째 칸은 o로 시작하는 두 글자 전치사예요.","성격 형용사 → of him to V"],
 ["그 약사는 나에게 언제 약을 먹어야 하는지 말해주었다. (take, the medicine)<br>The pharmacist told me ___.","when to take the medicine","The pharmacist told me when to take the medicine. / The pharmacist told me when I should take the medicine.","그 약사는 나에게 언제 약을 먹어야 하는지 말해 주었다.","본책 p.58 POINT 4 ‘의문사 + to부정사’의 when을 보세요.","1) ‘언제 ~해야 하는지’는 when + to부정사로 써요.  2) ‘약을 먹다’는 take(먹다) the medicine(약)이에요. 「when + 주어 + should + 동사원형」으로도 바꿔 쓸 수 있어요.","다섯 단어예요. 첫 칸은 w로 시작하는 의문사, 마지막 두 칸은 the medicine이에요.","when + to V = 언제 ~할지"],
 ["그 소녀는 자라서 유명한 과학자가 되었다. (grow up, become)<br>The girl ___ a famous scientist.","grew up to become","The girl grew up to become a famous scientist.","그 소녀는 자라서 유명한 과학자가 되었다.","본책 p.62 POINT 3 ‘결과: (~해서) …하다’를 보세요. ‘자라서 엔지니어가 되었다’ 예문이 있어요.","1) ‘자라서 …가 되었다’는 어떤 일의 ‘결과’를 뜻해요.  2) ‘자랐다’는 과거형으로 쓰고, ‘~가 되다’는 to부정사로 이어요. 과거형 형태를 정확히 써요.","g로 시작해서 become으로 끝나요. 네 단어예요.","grow up + to V = 자라서 …가 되다 (결과)"],
 ["그의 손 글씨는 읽기 어렵다. (handwriting, difficult, read)<br>His ___.","handwriting is difficult to read","His handwriting is difficult to read.","그의 손 글씨는 읽기 어렵다.","본책 p.62 POINT 4 ‘형용사 수식: ~하기에’를 보세요.","1) 주어는 His handwriting(그의 손 글씨)이에요.  2) ‘읽기 어렵다’는 형용사 difficult(어려운) 뒤에 to read(읽다)를 붙여요. be동사도 필요해요.","handwriting으로 시작해서 read로 끝나요. 다섯 단어예요.","형용사 + to V = ~하기에 …한"]
].forEach((r,i)=>W("SW","B",i+1,"(우리말과 일치하도록 ( ) 안의 말을 이용) "+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["(그림: 키 재는 판 옆에 서 있는 두 아이. 한 아이는 키가 작다.) 단어 short(키가 작은), ride the roller coaster(롤러코스터를 타다)<br>They are ___.","too short to ride the roller coaster","They are too short to ride the roller coaster.","그들은 너무 키가 작아서 롤러코스터를 탈 수 없다.","본책 p.64 POINT 2 ‘too + 형용사/부사 + to부정사’를 보세요.","1) 그림에서 아이들은 키가 모자라서 못 타는 상황이에요.  2) ‘너무 ~해서 …할 수 없다’ 구문을 써요. 주어진 짧은 말 short와 ride the roller coaster를 넣어요.","too로 시작해서 coaster로 끝나요. 총 일곱 단어예요.","too + 형용사 + to V = 너무 ~해서 …할 수 없다"],
 ["(그림: 멋진 스포츠카 옆에 서 있는 선글라스 낀 여자.) 단어 rich(부유한), buy a nice car(좋은 차를 사다)<br>The woman is ___.","rich enough to buy a nice car","The woman is rich enough to buy a nice car.","그 여자는 좋은 차를 살 만큼 충분히 부유하다.","본책 p.64 POINT 3 ‘형용사/부사 + enough + to부정사’를 보세요.","1) 그림에서 여자는 멋진 차 옆에 서 있어요. 차를 살 수 있는 상황이에요.  2) ‘~할 만큼 충분히 …하다’ 구문이에요. 형용사 rich(부유한) 뒤에 enough를 붙여요.","rich로 시작해서 car로 끝나요. enough가 두 번째 단어예요.","형용사 + enough + to V = ~할 만큼 충분히 …한"],
 ["(그림: 접시들이 쌓인 식탁 앞에서 배불러 하는 남자.) 단어 full(배부른), eat any more food(음식을 더 먹다)<br>The man is ___.","too full to eat any more food","The man is too full to eat any more food.","그 남자는 너무 배불러서 음식을 더 먹을 수 없다.","본책 p.64 POINT 2 ‘too + 형용사/부사 + to부정사’를 보세요.","1) 그림에서 남자는 너무 배불러서 더 먹기 힘들어 보여요.  2) ‘너무 ~해서 …할 수 없다’ 구문을 써요. full(배부른)에 too를 붙여요.","too로 시작해서 food로 끝나요. 총 일곱 단어예요.","too full to V = 너무 배불러서 …할 수 없다"]
].forEach((r,i)=>W("SW","C",i+1,"(그림을 보고 too ~ to부정사 또는 ~ enough to부정사 구문을 이용해 문장을 완성하시오) "+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
[["‘저는 키가 너무 작아서 그의 머리 너머로 볼 수 없어요.’ (too, short, see)<br>(대화: A The guy in front of me is too tall. 1 … 2 … / B Oh, let’s switch seats.)<br>___ over his head.","I am too short to see","I am too short to see over his head.","저는 키가 너무 작아서 그의 머리 너머로 볼 수 없어요.","본책 p.64 POINT 2 ‘too + 형용사/부사 + to부정사’를 보세요.","1) ‘너무 ~해서 …할 수 없다’ 구문이에요.  2) 주어진 단어 too, short(키가 작은), see(보다)를 순서대로 놓고 앞에 주어와 be동사를 붙여요. 말하는 사람은 ‘나’예요.","I am으로 시작해요. 다섯 단어이고 too가 세 번째예요.","I am too + 형용사 + to V"],
 ["‘무엇을 해야 할지 모르겠어요.’ (what, do)<br>I don’t know ___.","what to do","I don’t know what to do. / I don’t know what I should do.","무엇을 해야 할지 모르겠어요.","본책 p.58 POINT 4 ‘의문사 + to부정사’의 what을 보세요.","1) ‘무엇을 ~할지’는 what + to부정사로 써요.  2) 「what + 주어 + should + 동사원형」으로 바꿔 써도 같은 뜻이에요.","세 단어예요. 첫 칸은 w로 시작하는 의문사, 마지막 칸은 do(하다)예요.","what + to V = 무엇을 ~할지"],
 ["‘당신을 귀찮게 하고 싶지 않아요.’ (not, want, bother)<br>___ you.","I do not want to bother","I do not[don’t] want to bother you.","당신을 귀찮게 하고 싶지 않아요.","본책 p.58 POINT 2 ‘목적어 역할’ want(원하다) 설명을 보세요.","1) ‘~하고 싶지 않아요’는 do not + want + to부정사예요.  2) 주어는 ‘나’이고, bother(귀찮게 하다) 앞에 to가 필요해요.","I로 시작해서 bother로 끝나요. 여섯 단어(don’t로 줄이면 다섯 단어)예요.","do not want + to V = ~하고 싶지 않다"],
 ["‘제안해 주시다니 정말 친절하시군요.’ (nice, offer)<br>That’s really ___.","nice of you to offer","That’s really nice of you to offer.","제안해 주시다니 정말 친절하시군요.","본책 p.64 POINT 1 ‘of + 목적격’ 설명의 형용사 목록(nice)을 보세요.","1) 친절하다고 사람의 성격을 칭찬하는 말이에요.  2) 성격 형용사 뒤에는 ‘of + 목적격’을 쓰고, 그 뒤에 to offer(제안하다)를 이어요. ‘당신’의 목적격은 you예요.","nice로 시작해서 offer로 끝나요. 다섯 단어예요.","nice of you to V = ~하다니 친절하군요"]
].forEach((r,i)=>W("SW","D",i+1,"(대화를 읽고 밑줄 친 우리말과 일치하도록 ( ) 안의 말을 이용) "+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));

// ===== 내신 대비 실전문제 (pp.68-71) =====
C("NS","N",1,"(빈칸에 들어갈 알맞은 말) It is unhealthy ___ fast food all the time.",["① eat","② ate","③ to eat","④ eats","⑤ is eating"],"③ to eat","It is unhealthy to eat fast food all the time.","항상 패스트푸드를 먹는 것은 건강에 좋지 않다.",
 "본책 p.58 POINT 1 ‘주어 역할’의 가주어 it 박스를 보세요.","1) 문장이 It is unhealthy(건강에 좋지 않다)로 시작해요.  2) 진짜 주어(먹는 것)가 뒤로 갔어요. 가주어 it의 짝은 어떤 모양일까요?","‘to + 동사원형’ 모양이에요. 세 번째 보기예요.","It is 형용사 + to V (가주어-진주어)");
C("NS","N",2,"(빈칸에 들어갈 알맞은 말) Do you need somebody ___?",["① talk","② talks","③ is talking","④ to talk","⑤ to talk to"],"⑤ to talk to","Do you need somebody to talk to?","너는 이야기할 누군가가 필요하니?",
 b2+" 아래 표에서 ‘말할 누군가’ 줄을 보세요.","1) somebody(누군가)를 뒤에서 to부정사가 꾸며요.  2) ‘누군가에게 말하다’는 talk 뒤에 전치사가 필요한 동사예요. 문장 끝에 전치사가 있어야 해요.","to talk 뒤에 한 단어가 더 있는 보기예요. 마지막 보기예요.","someone to talk to (전치사 to 필요)");
C("NS","N",3,"(빈칸에 들어갈 알맞은 말) It was easy ___ to make pancakes.",["① me","② for me","③ for I","④ of me","⑤ of my"],"② for me","It was easy for me to make pancakes.","내가 팬케이크를 만드는 것은 쉬웠다.",
 d1+"를 보세요. for와 of 중 어느 쪽을 쓰는지 정해져 있어요.","1) easy(쉬운)는 일이 어떤지 말하는 형용사예요.  2) 그럼 의미상의 주어는 ‘for + 목적격’이에요. 보기에서 ‘I’(주격)가 아닌 모양을 찾아요.","for me가 들어 있는 보기예요. 두 번째 보기예요.","easy → for + 목적격 + to V");
C("NS","N",4,"(빈칸에 들어갈 알맞은 말) The truck is ___ to drive.",["① to damaged","② so damaged","③ too damaged","④ enough damaged","⑤ damaged enough"],"③ too damaged","The truck is too damaged to drive.","그 트럭은 너무 손상되어서 운전할 수 없다.",
 d2+"을 보세요.","1) 트럭이 망가졌고(damaged) 뒤에 to drive(운전하다)가 있어요.  2) ‘너무 ~해서 …할 수 없다’는 too + 형용사 + to V예요. enough는 형용사 뒤에 쓰는데 뜻이 달라요.","too가 형용사 앞에 오는 보기예요. 세 번째 보기예요.","too + 형용사 + to V (할 수 없다)");
C("NS","N",5,"(빈칸에 들어갈 알맞은 말) I will show you ___ this program.",["① use","② to use","③ how use","④ how to use","⑤ how to using"],"④ how to use","I will show you how to use this program.","내가 너에게 이 프로그램을 어떻게 사용하는지 보여 줄게.",
 a4+" 표의 how를 보세요.","1) show you 다음에 ‘어떻게 사용하는지’라는 내용이 와요.  2) ‘어떻게 ~할지’는 how + to부정사예요. to 뒤는 동사원형이에요.","how와 to와 동사원형이 순서대로 있는 보기예요. 네 번째 보기예요.","how + to V = 어떻게 ~할지");
C("NS","N",6,"(밑줄 친 부분의 쓰임이 나머지 넷과 다른 것) ① I have some books <u>to read</u>.<br>② Megan likes <u>to lift</u> weights.<br>③ Find something warm <u>to wear</u>.<br>④ We need someone <u>to babysit</u> our son.<br>⑤ He has some errands <u>to complete</u> today.",["① I have some books to read.","② Megan likes to lift weights.","③ Find something warm to wear.","④ We need someone to babysit our son.","⑤ He has some errands to complete today."],"② Megan likes to lift weights.","Megan likes to lift weights.","메건은 역기를 드는 것을 좋아한다.",
 "본책 p.58 POINT 2 ‘목적어 역할’과 본책 p.60 POINT 1 ‘(대)명사 + to부정사’를 비교해 보세요.","1) 각 to부정사가 어디에 붙어 있는지 봐요. 앞의 명사(books, something 등)를 꾸미는 건 ‘형용사’처럼 쓰인 것이에요.  2) 동사(likes) 바로 뒤에서 ‘~하는 것을’이 되는 건 다른 용법이에요.","네 개는 앞의 명사를 꾸며 줘요. 나머지 하나는 likes(좋아하다)의 목적어예요. 두 번째 보기예요.","명사 + to V = 형용사적 / like + to V = 명사적");
C("NS","N",7,"(밑줄 친 부분의 쓰임이 나머지 넷과 다른 것) ① Its first instinct is <u>to catch</u> prey.<br>② Aiden called 119 <u>to report</u> a fire.<br>③ They moved here <u>to be</u> closer to family.<br>④ The thief ran down the stairs <u>to escape</u>.<br>⑤ I met them <u>to find</u> a solution to the problem.",["① Its first instinct is to catch prey.","② Aiden called 119 to report a fire.","③ They moved here to be closer to family.","④ The thief ran down the stairs to escape.","⑤ I met them to find a solution to the problem."],"① Its first instinct is to catch prey.","Its first instinct is to catch prey.","그것의 첫 번째 본능은 먹이를 잡는 것이다.",
 "본책 p.58 POINT 3 ‘보어 역할’과 본책 p.62 POINT 1 ‘목적: ~하기 위해서’를 비교해 보세요.","1) 각 문장에서 to부정사 앞에 어떤 말이 있는지 봐요.  2) ‘~하기 위해서’로 해석되는 문장이 네 개예요. be동사 is 뒤에서 ‘~하는 것이다’가 되는 문장은 다른 용법이에요.","be동사(is) 바로 뒤에 to부정사가 있는 문장이에요. 첫 번째 보기예요.","be동사 + to V = 보어(명사적) / 행동 + to V = 목적(부사적)");
C("NS","N",8,"(빈칸에 들어갈 말이 순서대로 짝지어진 것)<br>• It will be ___ for me to get an A in math.<br>• It is ___ of you to help abandoned animals.",["① hard — nice","② kind — rude","③ easy — difficult","④ tough — dangerous","⑤ foolish — generous"],"① hard — nice","It will be hard for me to get an A in math. / It is nice of you to help abandoned animals.","내가 수학에서 A를 받는 것은 어려울 것이다. / 버려진 동물들을 도와주다니 너는 친절하다.",
 d1+"를 보세요. for를 쓰는 형용사와 of를 쓰는 형용사가 구분돼 있어요.","1) 첫 문장은 for me이니 일의 상태를 말하는 형용사예요.  2) 둘째 문장은 of you이니 사람의 성격을 말하는 형용사예요. 보기를 하나씩 소거해요.","첫 번째 칸에 성격 형용사가 오는 보기(kind, foolish)와 둘째 칸에 일의 상태 형용사(difficult, dangerous)가 오는 보기를 지워요. 첫 번째 보기가 남아요.","for → 일의 상태(hard) / of → 성격(nice)");
C("NS","N",9,"(빈칸에 들어갈 말이 순서대로 짝지어진 것)<br>• The child needs a fork to eat ___.<br>• My family has five pets to take care ___ at home.",["① of — on","② of — to","③ on — of","④ with — of","⑤ with — with"],"④ with — of","The child needs a fork to eat with. / My family has five pets to take care of at home.","그 아이는 가지고 먹을 포크가 필요하다. / 우리 가족은 집에서 돌볼 반려동물 다섯 마리가 있다.",
 b2+" 아래 표를 펴세요. ‘(가지고) 먹을 포크’와 ‘돌볼 개들’ 줄을 찾아요.","1) 포크는 ‘가지고’ 먹는 도구예요.  2) 반려동물을 ‘돌보다’는 take care 뒤에 붙는 전치사가 정해져 있어요. 표에서 두 표현을 찾아요.","첫 칸은 with, 둘째 칸은 of예요. 네 번째 보기예요.","eat with (도구) / take care of (돌보다)");
C("NS","N",10,"(밑줄 친 부분과 쓰임이 같은 것)<br>We are pleased <u>to tell</u> you the news.",["① Her name is easy to remember.","② He was careless to leave the door open.","③ She worked hard to become a lawyer.","④ The dog lived to be seventeen years old.","⑤ I was embarrassed to dance in front of everyone."],"⑤ I was embarrassed to dance in front of everyone.","I was embarrassed to dance in front of everyone.","나는 모두의 앞에서 춤을 춰서 창피했다.",
 c2+"를 보세요. 감정 형용사 뒤 to부정사의 쓰임이에요.","1) pleased(기쁜)는 감정을 나타내는 형용사예요. to tell you the news는 기쁜 ‘이유’예요.  2) 보기에서 감정 형용사 뒤에 to부정사가 온 문장을 찾아요.","embarrassed(창피한)가 감정 형용사예요. 마지막 보기예요.","감정 형용사 + to V = ~해서 (감정의 원인)");
C("NS","N",11,"(밑줄 친 부분이 어법상 옳지 않은 것)",["① They agreed to go back home.","② I need someone strong to help me.","③ This situation is difficult to explain.","④ They decided not move to this year.","⑤ I’m not sure when to go to the doctor."],"④ They decided not move to this year.","They decided not to move this year.","그들은 올해 이사하지 않기로 결정했다.",
 a2+" 아래 ‘not[never] to’ 부정 설명을 보세요.","1) 각 보기의 to부정사 모양을 하나씩 확인해요.  2) to부정사의 부정은 to 앞에 not을 놓는 규칙이에요. 어색한 곳은 not과 to의 순서예요.","decided(원형 decide: 결정하다) 뒤 not move to를 보세요. 네 번째 보기예요.","to부정사 부정 = not + to + V");
W("NS","N",12,"(우리말을 영어로 옮길 때 어법상 틀린 부분을 찾아 바르게 고치시오) 나는 무언가 새로운 것을 시도하고 싶다.<br>I want to try new something.","something new","I want to try something new.","나는 무언가 새로운 것을 시도하고 싶다.",
 "본책 p.60 POINT 1 아래 ‘내신 적중’ 박스의 ‘-thing + 형용사 + to부정사’를 보세요.","1) something(무언가)은 -thing으로 끝나는 대명사예요.  2) 이런 말은 형용사 new(새로운)를 어느 쪽에 쓰는지 규칙이 있어요.","new something의 순서를 바꿔요. 정답은 s로 시작해요.","-thing + 형용사 (something new)");
W("NS","N",13,"(우리말을 영어로 옮길 때 어법상 틀린 부분을 찾아 바르게 고치시오) 그 고추들은 내가 먹기에 너무 매웠다.<br>The chili peppers were too spicy me to eat.","for me","The chili peppers were too spicy for me to eat.","그 고추들은 내가 먹기에 너무 매웠다.",
 d2+" 아래 ‘The bag was too expensive for her to buy.’ 예문을 보세요.","1) to eat의 행동을 하는 사람은 ‘나’예요.  2) 의미상의 주어는 to부정사 바로 앞에 ‘전치사 + 목적격’으로 써요. 그런데 me 앞에 빠진 것이 있어요.","me 앞에 f로 시작하는 세 글자를 넣어요.","too ~ for + 목적격 + to V");
W("NS","N",14,"(우리말을 영어로 옮길 때 어법상 틀린 부분을 찾아 바르게 고치시오) 그 무대는 백 명이 설 수 있을 만큼 충분히 크다.<br>The stage is enough big for a hundred people to stand on.","big enough","The stage is big enough for a hundred people to stand on.","그 무대는 백 명이 설 수 있을 만큼 충분히 크다.",
 d3+"을 보세요. enough의 위치가 정해져 있어요.","1) ‘충분히 크다’에서 형용사는 big(큰)이에요.  2) enough는 형용사 앞일까요, 뒤일까요? 문장 속 순서를 점검해요.","enough big의 순서를 바꿔요. 정답은 big으로 시작해요.","형용사 + enough (뒤에 붙인다)");
C("NS","N",15,"(빈칸에 들어갈 말로 알맞지 않은 것) It was ___ for them to talk about the accident.",["① painful","② polite","③ necessary","④ impossible","⑤ difficult"],"② polite","It was painful for them to talk about the accident.","그들이 그 사고에 대해 이야기하는 것은 고통스러웠다.",
 d1+"를 보세요. 문장에 ‘for them’이 쓰였어요.","1) for + 목적격은 일의 상태를 말하는 형용사와 함께 써요.  2) 사람의 성격을 나타내는 형용사는 of + 목적격을 써서 이 문장에 안 맞아요. 보기 중 성격 형용사를 찾아요.","polite(공손한)는 사람의 성격을 말해요. 두 번째 보기예요.","for them → 성격 형용사(polite)는 안 됨");
M("NS","N",16,"(우리말을 영어로 바르게 옮긴 것을 모두 고르시오) 내 남동생은 그 게임을 하기에는 나이가 너무 많다.",["① My brother is to play that game.","② My brother is too old to play that game.","③ My brother is enough old to play that game.","④ My brother is old enough to play that game.","⑤ My brother is so old that he can’t play that game."],["② My brother is too old to play that game.","⑤ My brother is so old that he can’t play that game."],"My brother is too old to play that game. / My brother is so old that he can’t play that game.","내 남동생은 그 게임을 하기에는 나이가 너무 많다.",
 d2+"을 보세요. 같은 뜻의 「so ~ that 주어 can’t」도 나와 있어요.","1) ‘너무 ~해서 …할 수 없다’ 뜻의 문장을 찾아요.  2) too + 형용사 + to V와 so + 형용사 + that + 주어 + can’t가 같은 뜻이에요. 나머지는 뜻이 반대이거나 틀린 모양이에요.","답은 두 개예요. 하나는 too가 있는 보기, 하나는 so ~ that ~ can’t가 있는 보기예요.","too ~ to V = so ~ that 주어 can’t");
M("NS","N",17,"(우리말을 영어로 바르게 옮긴 것을 모두 고르시오) 그녀는 나에게 어떻게 목도리를 뜨개질하는지 가르쳐 주었다.",["① She taught me how to knit a scarf.","② She taught me what to knit a scarf.","③ She taught me when to knit a scarf.","④ She taught me how I should knit a scarf.","⑤ She taught me how should I knit a scarf."],["① She taught me how to knit a scarf.","④ She taught me how I should knit a scarf."],"She taught me how to knit a scarf. / She taught me how I should knit a scarf.","그녀는 나에게 어떻게 목도리를 뜨개질하는지 가르쳐 주었다.",
 a4+"을 보세요. 「의문사 + to부정사」와 「의문사 + 주어 + should + 동사원형」이 같은 뜻으로 나와 있어요.","1) ‘어떻게 ~하는지’ → how를 써요. 그다음 to부정사 또는 주어 + should + 동사원형이에요.  2) what, when은 뜻이 달라서 안 돼요. 간접의문문은 ‘주어 + should’ 어순이라 how should I는 틀려요.","답은 두 개예요. 첫 번째 보기와 네 번째 보기예요.","how + to V = how + 주어 + should + V");
W("NS","N",18,"(주어진 조건에 맞게 두 문장을 한 문장으로 연결하시오) This computer is very slow. You can’t use it.<br>조건: too를 사용할 것 / 의미상의 주어를 포함하여 쓸 것 / 총 9단어의 완전한 문장","This computer is too slow for you to use.","This computer is too slow for you to use.","이 컴퓨터는 너무 느려서 네가 사용할 수 없다.",
 d2+" 아래 ‘The bag was too expensive for her to buy.’ 예문을 보세요.","1) ‘너무 ~해서 …할 수 없다’는 too + 형용사 + to V예요.  2) You can’t use it에서 You를 의미상의 주어 for you로 쓰고, 목적어 it은 주어와 같아서 빼요.","This computer is too slow로 시작해요. 그 뒤 네 단어는 ‘f로 시작하는 전치사 + 너의 목적격 + to + 동사원형’이에요.","too ~ for + 목적격 + to V (목적어 it 생략)");
C("NS","N",19,"(밑줄 친 부분의 쓰임이 같은 것끼리 바르게 짝지어진 것)<br>ⓐ They decided <u>to break up</u>.<br>ⓑ This novel is fun <u>to read</u>.<br>ⓒ It is dangerous <u>to swim</u> in this river.<br>ⓓ This movie is hard <u>to understand</u>.<br>ⓔ I have a picture <u>to show</u> you.",["① ⓐ, ⓑ","② ⓑ, ⓓ","③ ⓐ, ⓔ","④ ⓑ, ⓒ","⑤ ⓓ, ⓔ"],"② ⓑ, ⓓ","This novel is fun to read. / This movie is hard to understand.","이 소설은 읽기에 재미있다. / 이 영화는 이해하기 어렵다.",
 "본책 p.62 POINT 4 ‘형용사 수식: ~하기에’와 본책 p.58 POINT 1·2, 본책 p.60 POINT 1을 비교해 보세요.","1) ⓐ는 decide(결정하다)의 목적어, ⓒ는 가주어 it의 진주어, ⓔ는 명사 picture를 꾸며요.  2) 형용사(fun, hard) 뒤에서 ‘~하기에’가 되는 것을 찾아요.","ⓑ와 ⓓ는 둘 다 ‘형용사 + to V(~하기에)’예요. 두 번째 보기예요.","형용사 + to V = ~하기에 (부사적)");
C("NS","N",20,"(밑줄 친 부분의 우리말 해석이 바르지 않은 것)<br>① To use chopsticks is easy. → 사용하는 것은<br>② I was pleased to meet you. → 만나서<br>③ My friend is coming to visit me. → 방문하다니<br>④ Her recipe is easy to follow. → 따라 하기에<br>⑤ I opened the window to look outside. → 보기 위해서",["① To use chopsticks is easy. → 사용하는 것은","② I was pleased to meet you. → 만나서","③ My friend is coming to visit me. → 방문하다니","④ Her recipe is easy to follow. → 따라 하기에","⑤ I opened the window to look outside. → 보기 위해서"],"③ My friend is coming to visit me. → 방문하다니","My friend is coming to visit me. (방문하기 위해)","내 친구가 나를 방문하기 위해 오고 있다.",
 "본책 p.62 POINT 1 ‘목적: ~하기 위해서’와 POINT 2 ‘감정의 원인’을 보세요.","1) ③은 is coming(오고 있다)이라는 행동 뒤에 to visit me가 왔어요.  2) 감정 형용사가 없으니 ‘~하다니’(감정/판단)가 아니라 ‘왜 오는지’ 이유를 말해요.","③의 to부정사는 ‘~하기 위해’(목적)로 해석해야 해요. 세 번째 보기예요.","행동 + to V = ~하기 위해서 (감정 형용사 없을 때)");
C("NS","N",21,"(우리말과 일치하도록 ( ) 안에 주어진 말을 배열할 때 네 번째 오는 것) 너의 충고를 무시하다니 Jane은 어리석은 게 틀림없다.<br>(must / Jane / silly / be / ignore / advice / to / your)",["① must","② be","③ ignore","④ to","⑤ silly"],"⑤ silly","Jane must be silly to ignore your advice.","너의 충고를 무시하다니 Jane은 어리석은 게 틀림없다.",
 c5+"를 보세요. must be + 형용사 + to V 예문이 있어요.","1) ‘~하다니 …임에 틀림없다’는 판단의 근거를 to부정사로 말해요.  2) 순서는 주어 → must be → 형용사 → to V → 목적어예요.","Jane → must → be → ? 순서로 놓으면 네 번째는 형용사 자리예요.","주어 + must be + 형용사 + to V");
W("NS","N",22,"(글의 밑줄 친 ⓐ~ⓔ 중 어법상 틀린 부분을 두 곳 찾아 기호를 쓰고 바르게 고치시오)<br>내 친구들과 나는 이번 주 토요일에 강변으로 소풍을 가기로 결정했다. Helen will bring a cake. Arnold will bring a mat ⓐ<u>to sit</u>. I don’t know ⓑ<u>what to bring</u> yet. I could make kimbap, sandwiches, or a salad. It’s too hard ⓒ<u>to me</u> to choose. When I get home, I will get on my computer ⓓ<u>to look up</u> some recipes. This picnic will be so fun. I can’t wait ⓔ<u>to go</u> on it!","ⓐ to sit on / ⓒ for me","ⓐ to sit → to sit on / ⓒ to me → for me","(해석) 내 친구들과 나는 이번 주 토요일에 강변으로 소풍을 가기로 결정했다. 헬렌은 케이크를 가져올 것이다. 아놀드는 앉을 돗자리를 가져올 것이다. 나는 아직 무엇을 가져갈지 모르겠다. 나는 김밥, 샌드위치, 또는 샐러드를 만들 수 있다. 나에게는 선택하는 것이 너무 어렵다. 집에 도착하면, 컴퓨터로 요리법을 찾아볼 것이다. 이 소풍은 매우 재미있을 것이다. 빨리 가고 싶다!",
 "본책 p.60 POINT 2 ‘명사 + to부정사 + 전치사’와 본책 p.64 POINT 1 ‘의미상의 주어’를 보세요.","1) ⓐ는 a mat to sit이에요. ‘매트 위에 앉다’이니 sit(앉다)에 전치사가 필요한지 봐요.  2) ⓒ는 It’s too hard ___ to choose(선택하다)예요. 의미상의 주어를 쓰는 전치사가 맞는지 봐요.","ⓐ는 sit 뒤에 on 한 단어를 붙여요. ⓒ는 to를 다른 전치사 f로 시작하는 세 글자로 바꿔요.","mat to sit on / too hard for me to V");
W("NS","N",23,"(밑줄 친 우리말과 일치하도록 ( ) 안의 말을 이용) 내 친구들과 나는 이번 주 토요일에 강변으로 소풍을 가기로 결정했다. (decide, go on a picnic)<br>My friends and I ___ by the river this Saturday.","decided to go on a picnic","My friends and I decided to go on a picnic by the river this Saturday.","내 친구들과 나는 이번 주 토요일에 강변으로 소풍을 가기로 결정했다.",
 a2+"을 보세요. decide(결정하다)의 목적어로 to부정사가 와요.","1) ‘결정했다’는 과거라서 decide(결정하다)의 과거형을 써요.  2) ‘소풍을 가기로’는 to + go on a picnic(소풍을 가다)이에요.","총 여섯 단어예요. 첫 단어는 d로 시작하는 과거형, 둘째 칸은 to예요.","decide + to V = ~하기로 결정하다");
C("NS","N",24,"(두 문장의 의미가 서로 다른 것)",["① To win the lottery is difficult. = It is difficult to win the lottery.","② He was old enough to drive a car. = He was so old that he could drive a car.","③ They are thinking of when to tell her. = They are thinking of when they shouldn’t tell her.","④ I went to the store to buy some groceries. = I went to the store so as to buy some groceries.","⑤ She is strong enough to carry all this luggage at once. = She is so strong that she can carry all this luggage at once."],"③ They are thinking of when to tell her. = They are thinking of when they shouldn’t tell her.","They are thinking of when to tell her. = They are thinking of when they should tell her.","그들은 그녀에게 언제 말할지 생각하고 있다.",
 a4+"을 보세요. ‘의문사 + to부정사’는 ‘의문사 + 주어 + should’로 바꿔요.","1) 보기마다 = 앞뒤가 같은 뜻인지 하나씩 봐요.  2) ①은 가주어 it, ②·⑤는 enough ↔ so ~ that can, ④는 to ↔ so as to예요. 부정(shouldn’t)이 들어 있는 보기가 의심돼요.","when to tell은 ‘언제 말할지’인데 shouldn’t는 반대 뜻이에요. 세 번째 보기예요.","의문사 + to V = 의문사 + 주어 + should + V (부정 X)");
C("NS","N",25,"(어법상 옳은 것의 개수는?)<br>• To learn foreign languages are difficult.<br>• Their mission is to save the earth.<br>• They bought some seeds in order plant them.<br>• He must be foolish to turn down that great deal.<br>• It is generous for her to pay for our dinner.<br>• I was too tired to stay up late last night.<br>• This puzzle is simple enough of everyone to solve.",["① 2개","② 3개","③ 4개","④ 5개","⑤ 6개"],"② 3개","옳은 문장: Their mission is to save the earth. / He must be foolish to turn down that great deal. / I was too tired to stay up late last night.","옳은 문장은 3개이다. (임무는 지구를 구하는 것이다 / 그 좋은 거래를 거절하다니 그는 어리석은 게 틀림없다 / 나는 너무 피곤해서 어젯밤에 늦게까지 깨어 있을 수 없었다.)",
 "본책 p.58 POINT 1, 본책 p.62 POINT 1·5, 본책 p.64 POINT 1·2·3을 하나씩 확인해요.","1) 문장마다 어법 규칙 하나를 확인해요. 주어로 쓰인 to부정사는 단수 취급이에요. in order 뒤에는 to가 필요해요.  2) generous는 사람의 성격이라 의미상의 주어가 of예요. simple은 일의 상태라 for예요.","틀린 문장은 4개(1, 3, 5, 7번째)예요. 7개 중에서 빼면 몇 개가 남을까요?","문장별 규칙 점검: 단수 취급, in order to, of/for");
W("NS","N",26,"(우리말과 일치하도록 보기에서 필요한 말을 골라 문장을 완성하시오) Amy는 앉을 의자가 필요하다.<br>보기: a, needs, chair, sit, with, to, on, in<br>Amy ___.","needs a chair to sit on","Amy needs a chair to sit on.","Amy는 앉을 의자가 필요하다.",
 b2+" 아래 표에서 ‘앉을 의자’ 줄을 보세요.","1) ‘~가 필요하다’ → needs(필요하다)예요. 주어가 Amy라서 s가 붙었어요.  2) ‘앉을 의자’는 명사 a chair 뒤에 to sit을 붙이고, 의자 위에 앉으니 전치사가 필요해요.","needs로 시작하고 on으로 끝나요. 여섯 단어예요.","a chair to sit on (전치사 on)",["a","needs","chair","sit","with","to","on","in"]);
W("NS","N",27,"(두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오) Rebecca was too lazy to clean her room.<br>Rebecca was ___ her room.","so lazy that she couldn’t clean","Rebecca was so lazy that she couldn’t clean her room.","레베카는 너무 게을러서 자기 방을 청소할 수 없었다.",
 d2+" 아래 ‘= so + 형용사 + that + 주어 + can’t’ 설명을 보세요.","1) too + 형용사 + to V는 so + 형용사 + that + 주어 + can’t + 동사원형과 같아요.  2) 문장이 과거(was)이니 can’t도 과거로 바꿔야 해요. 주어 Rebecca는 she로 받아요.","여섯 단어예요. so로 시작하고, 넷째 칸은 주어 Rebecca를 받는 대명사, 다섯째 칸은 c로 시작하는 과거 부정 조동사예요.","too ~ to V = so ~ that 주어 couldn’t (과거)");
W("NS","N",28,"(두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오) The lights were so bright that we could see everything.<br>The lights were ___ everything.","bright enough for us to see","The lights were bright enough for us to see everything.","불빛이 매우 밝아서 우리는 모든 것을 볼 수 있었다.",
 d3+"을 보세요. ‘= so + 형용사 + that + 주어 + can’ 바꿔 쓰기가 있어요.","1) ‘so + 형용사 + that + 주어 + could’는 ‘형용사 + enough + to부정사’로 바꿔요.  2) that절의 주어 we는 의미상의 주어로 for us가 돼요.","여섯 단어예요. bright로 시작하고, 넷째 칸은 we의 목적격이에요.","so ~ that 주어 could = 형용사 enough for 목적격 to V");
W("NS","N",29,"(두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오) She showed me where I should hang my jacket.<br>She showed me ___ my jacket.","where to hang","She showed me where to hang my jacket.","그녀는 나에게 내 재킷을 어디에 걸어야 하는지 보여 주었다.",
 a4+" 아래 ‘= I don’t know what I should do’ 예문을 보세요.","1) where I should hang(내가 어디에 걸어야 하는지)에서 I should를 줄여요.  2) 「의문사 + 주어 + should + 동사원형」은 「의문사 + to부정사」와 같아요.","세 단어예요. 첫 칸은 where 그대로, 마지막 칸은 h로 시작하는 동사원형이에요.","의문사 + 주어 + should + V = 의문사 + to V");
M("NS","N",30,"(대화의 빈칸에 들어갈 말로 알맞은 것을 모두 고르시오)<br>A Why don’t we play badminton together?<br>B I’d like to, but it’s too sunny today. ___.<br>A Then how about going to the gym?<br>B That’s a great idea. Let’s go!",["① It’s too hot for me to play outside","② It’s too hot of me to play outside","③ It’s so hot that I can play outside","④ It’s so hot that I can’t play outside","⑤ It’s hot enough for me to play outside"],["① It’s too hot for me to play outside","④ It’s so hot that I can’t play outside"],"It’s too hot for me to play outside. / It’s so hot that I can’t play outside.","너무 더워서 나는 밖에서 놀 수 없어.",
 d2+"을 보세요.","1) 앞뒤 대화에서 B는 배드민턴을 거절하고 체육관을 제안해요. ‘밖에서 할 수 없다’는 뜻의 문장이 들어가야 해요.  2) 할 수 없다는 too ~ to V 또는 so ~ that can’t예요. of me는 일의 상태에는 쓰지 않아요.","답은 두 개예요. 첫 번째 보기와 네 번째 보기예요.","too ~ for 목적격 to V = so ~ that 주어 can’t");
W("NS","N",31,"(대화의 밑줄 친 우리말과 일치하도록 ( ) 안의 말을 이용) A Are you busy? What are you doing now? B Yes. 나는 살 집을 찾고 있어.<br>I’m looking for a ___. (house, live)","house to live in","I’m looking for a house to live in.","나는 살 집을 찾고 있어.",
 b2+" 아래 표에서 ‘(안에) 살 집’ 줄을 보세요.","1) ‘살 집’은 명사 a house 뒤에 to live(살다)를 붙여요.  2) ‘집에서 살다’이니 live 뒤에 전치사가 필요해요.","house로 시작해서 in으로 끝나요. 네 단어예요.","a house to live in (전치사 in)");

// ===== 문법정리노트 (p.72) =====
const g="본책 p.72 문법정리노트에서 해당 칸 오른쪽의 해석을 보세요. ";
W("GN","G",1,"(주어) ___ this game is fun. 이 게임을 하는 것은 재미있다.","To play","To play this game is fun.","이 게임을 하는 것은 재미있다.",
 a1+"을 보세요. 첫 예문이 이 문장이에요.","1) ‘~하는 것은’으로 시작하는 주어 자리예요.  2) 문장 맨 앞에는 to + 동사원형을 써요. 동사는 play(하다, 놀다)예요.","대문자로 시작하는 두 단어예요. To로 시작해요.","주어로 쓰인 to V = ~하는 것은");
W("GN","G",2,"(보어) Her dream is ___ a famous pop star. 그녀의 꿈은 유명한 팝스타가 되는 것이다.","to become","Her dream is to become a famous pop star.","그녀의 꿈은 유명한 팝스타가 되는 것이다.",
 a3+"을 보세요. 이 예문이 그대로 있어요.","1) is(~이다) 뒤에서 ‘꿈 = 되는 것’이라고 설명해 주는 자리예요.  2) 보어 자리의 to부정사는 ‘to + 동사원형’이에요. ‘되다’는 become이에요.","to로 시작하는 두 단어예요. 두 번째는 b로 시작하는 여섯 글자 동사예요.","be + to V = ~하는 것이다 (보어)");
W("GN","G",3,"(의문사 + to부정사) I don’t know what ___ with the money. 나는 이 돈으로 무엇을 해야 할지 모르겠다.","to do","I don’t know what to do with the money.","나는 이 돈으로 무엇을 해야 할지 모르겠다.",
 a4+" 맨 아래 예문을 보세요.","1) what(무엇을) 뒤에 ‘~할지’를 만들어요.  2) 의문사 뒤에는 to + 동사원형이에요. 동사는 do(하다)예요.","to로 시작하는 두 단어예요.","what + to V = 무엇을 ~할지");
W("GN","G",4,"(의문사 + to부정사) I don’t know ___ with the money. (= what to do)","what I should do","I don’t know what I should do with the money.","나는 이 돈으로 무엇을 해야 할지 모르겠다.",
 a4+" 표 아래 맨 마지막 줄(= I don’t know …)을 보세요.","1) 같은 뜻을 ‘의문사 + 주어 + should + 동사원형’으로 바꿔요.  2) 주어는 ‘나’(I)이고 what은 그대로예요.","what으로 시작해서 do로 끝나요. 네 단어예요.","what to V = what + 주어 + should + V");
W("GN","G",5,"(형용사적 용법) He brought snacks ___. 그는 먹을 간식을 가져왔다.","to eat","He brought snacks to eat.","그는 먹을 간식을 가져왔다.",
 b1+"를 보세요. 이 예문이 첫 줄에 있어요.","1) snacks(간식)를 뒤에서 ‘먹을’로 꾸며 줘요.  2) 꾸미는 말은 to + 동사원형이에요. 동사는 eat(먹다)이에요.","to로 시작하는 두 단어예요.","명사 + to V = ~할 (형용사적)");
W("GN","G",6,"(부사적 용법) I am glad ___ you again. 나는 너를 다시 봐서 기쁘다.","to see","I am glad to see you again.","나는 너를 다시 봐서 기쁘다.",
 c2+"를 보세요. 이 예문이 그대로 있어요.","1) glad(기쁜)는 감정 형용사예요.  2) 기쁜 이유를 to + 동사원형으로 써요. 동사는 see(보다)예요.","to로 시작하는 두 단어예요.","감정 형용사 + to V = ~해서 (원인)");
W("GN","G",7,"(부사적 용법) The jar is ___. 그 병은 열기에 어렵다.","hard to open","The jar is hard to open.","그 병은 열기에 어렵다.",
 c4+"를 보세요. 이 예문이 그대로 있어요.","1) be동사 뒤에 형용사가 오고, ‘열기에’는 그 뒤에 와요.  2) 형용사는 hard(어려운)이고 동사는 open(열다)이에요.","세 단어예요. 첫 칸은 h로 시작하는 형용사, 마지막 칸은 o로 시작하는 동사원형이에요.","형용사 + to V = ~하기에 (hard to open)");
W("GN","G",8,"(의미상의 주어) It was difficult ___ to understand the book. 그가 그 책을 이해하는 것은 어려웠다.","for him","It was difficult for him to understand the book.","그가 그 책을 이해하는 것은 어려웠다.",
 d1+"를 보세요. 이 예문이 첫 줄에 있어요.","1) 일의 상태(difficult)를 말하는 형용사예요.  2) 그래서 ‘for + 목적격’을 써요. ‘그’의 목적격이에요.","f로 시작하는 세 글자 뒤에 him이 와요.","difficult → for + 목적격 + to V");
W("GN","G",9,"(의미상의 주어) It was ___ to help me. 나를 도와주다니 너는 친절했다.","kind of you","It was kind of you to help me.","나를 도와주다니 너는 친절했다.",
 d1+" 아래쪽 ‘of + 목적격’ 설명을 보세요. 마지막 예문이에요.","1) 친절하다는 사람의 성격을 나타내는 말이에요.  2) 그래서 형용사 뒤에 ‘of + 목적격’을 써요. ‘너’의 목적격은 you예요.","k로 시작하는 형용사로 시작하고 of you로 끝나요. 세 단어예요.","성격 형용사 + of you + to V");
W("GN","G",10,"(to부정사 구문) He is too busy to watch TV. = He is ___ watch TV.","so busy that he can’t","He is so busy that he can’t watch TV.","그는 너무 바빠서 TV를 볼 수 없다.",
 d2+"를 보세요. 이 예문이 그대로 있어요.","1) too + 형용사 + to V는 so + 형용사 + that + 주어 + can’t + 동사원형과 같아요.  2) 주어는 He(그)이고 현재라서 can’t를 써요.","다섯 단어예요. so로 시작하고, 넷째 칸은 He를 받는 대명사, 마지막 칸은 c로 시작하는 부정 조동사예요.","too ~ to V = so ~ that 주어 can’t");

C(1,"Q",1,"밑줄 친 부분의 의미로 적절한 것은?<br>Janet finished <u>reading those books</u> yesterday.",["저 책들을 읽는 것이다","저 책들을 읽는 것을"],"저 책들을 읽는 것을","Janet finished reading those books yesterday.","Janet은 어제 저 책들을 읽는 것을 끝냈다.",
 "본책 p.74 POINT 2 ‘목적어 역할’ 설명을 읽어 보세요.",
 "1) finished(원형 finish: 끝내다) 뒤에 reading those books가 와요.  2) 이 부분은 동사 finish가 ‘무엇을’ 끝냈는지 알려 주는 말이에요. 문장에서 어떤 자리인지 생각해 봐요.",
 "동사의 목적어 자리에 온 동명사예요. 그래서 끝이 ‘~을’로 끝나는 쪽이에요. 두 번째 보기예요.",
 "동사 뒤 동명사 = 목적어 (~하는 것을)");

C(1,"A",1,"밑줄 친 동명사의 역할을 고르시오.<br><u>Studying every day</u> is hard.",["주어","목적어","보어"],"주어","Studying every day is hard.","매일 공부하는 것은 어렵다.",
 "본책 p.74 POINT 1 ‘주어 역할’ 을 보세요.",
 "1) 밑줄 친 말이 문장 맨 앞에 있어요.  2) 뒤에 is(원형 be: ~이다)가 나오니, 밑줄 친 말이 ‘~은/는’에 해당하는 자리인지 따져 봐요.",
 "문장 맨 앞 + is 앞에 있으니 ‘~하는 것은’으로 해석되는 역할이에요. 첫 번째 보기예요.",
 "문장 맨 앞 동명사 = 주어 (~하는 것은)");
C(1,"A",2,"밑줄 친 동명사의 역할을 고르시오.<br>He left without <u>saying a word</u>.",["주어","목적어","보어"],"목적어","He left without saying a word.","그는 한마디도 하지 않고 떠났다.",
 "본책 p.74 POINT 2 ‘목적어 역할’ 의 두 번째 예문(전치사의 목적어)을 보세요.",
 "1) 밑줄 친 말 바로 앞에 without(~없이)이 있어요.  2) without 같은 전치사 뒤에 오는 말은 무슨 역할일까요? 주어도 보어도 아니에요.",
 "전치사 뒤에 나온 동명사는 ‘전치사의 목적어’예요. 두 번째 보기예요.",
 "전치사 뒤 동명사 = 전치사의 목적어");
C(1,"A",3,"밑줄 친 동명사의 역할을 고르시오.<br>She finished <u>doing the dishes</u>.",["주어","목적어","보어"],"목적어","She finished doing the dishes.","그녀는 설거지하는 것을 끝냈다.",
 "본책 p.74 POINT 2 ‘목적어 역할’ 의 첫 번째 예문을 보세요.",
 "1) finished(원형 finish: 끝내다)는 동사예요.  2) 동사 바로 뒤에서 ‘~을 끝냈다’의 ‘~을’에 해당하는 말이에요.",
 "동사 뒤에 나온 동명사는 ‘동사의 목적어’예요. 두 번째 보기예요.",

 "1) ‘동의했다’ 는 agree(동의하다)의 과거형이에요.  2) agree는 to부정사만 목적어로 받아요. 뒤에 이미 studying이 있으니 ‘시작하다’를 어떻게 쓸지 생각해요.",

W(2,"D",3,"나는 열기구를 타고 날았던 것을 잊지 못할 것이다. (forget, fly)<br>I will never ___ in a hot air balloon.","forget flying","I will never forget flying in a hot air balloon.","나는 열기구를 타고 날았던 것을 잊지 못할 것이다.",

 "본책 p.76 파란 박스 ‘stop + 동명사 / stop + to부정사’ 의 예문 Gloria stopped to watch…를 보세요.",
 "1) ‘~하기 위해 멈췄다’ 이니 멈춘 뒤에 하려는 행동이에요.  2) 목적(~하기 위해)을 나타낼 때는 stop 뒤에 어떤 모양을 쓰는지 박스에서 찾아요.",
 "stop의 과거형(p를 한 번 더 쓰는 s로 시작하는 7글자) 뒤에 watch(보다)를 -ing가 아닌 모양으로 이어요.",

 "본책 p.76 POINT 3 ‘의미 차이가 없는 경우’ 목록에서 love를 찾아보세요.",

 "첫 단어는 l로 시작하는 5글자예요. 그 뒤 study(공부하다)는 -ing를 붙여도, 앞에 to를 붙여도 모두 정답이에요.",

[["Getting regular health checkups <u>are</u> necessary.","X, is","Getting regular health checkups is necessary.","정기적인 건강검진을 받는 것은 필수적이다.","본책 p.74 POINT 1 오른쪽 박스 ‘주어로 쓰인 동명사(구)는 단수 취급한다’ 를 보세요.","1) 문장의 주어는 Getting regular health checkups(정기적으로 건강검진을 받는 것)예요.  2) 주어가 동명사구이면 단수일까요, 복수일까요? 그에 맞는 be동사를 찾아요.","are가 틀렸어요. 단수 주어에 맞는 i로 시작하는 2글자 be동사로 고쳐요.","주어 동명사(구)는 단수 → is"],
 ["My parents talked about <u>moving</u> to San Francisco.","O","My parents talked about moving to San Francisco.","내 부모님은 샌프란시스코로 이사하는 것에 대해 이야기하셨다.","본책 p.74 POINT 2 ‘전치사의 목적어’ 예문을 보세요.","1) about(~에 대해)은 전치사예요.  2) 전치사 뒤에 moving(원형 move: 이사하다)이 어떤 모양인지 확인해요.","전치사 뒤 동명사는 맞아요. 고칠 곳이 없어서 O예요.","전치사 뒤 v-ing → 맞음 (O)"],
 ["Fred likes <u>to watch</u> horror movies.","O","Fred likes to watch horror movies.","Fred는 공포 영화를 보는 것을 좋아한다.","본책 p.76 POINT 3 ‘의미 차이가 없는 경우’ 목록을 보세요.","1) likes(원형 like: 좋아하다)가 동사예요.  2) like 뒤에는 to부정사도 올 수 있는지 POINT 3 목록으로 확인해요.","like는 동명사와 to부정사 둘 다 가능해요. 고칠 곳이 없어요.","like + to V / v-ing 둘 다 가능 (O)"],
 ["I <u>am busy to do</u> the math homework.","X, am busy doing","I am busy doing the math homework.","나는 수학 숙제를 하느라 바쁘다.","본책 p.74 POINT 4 표의 ‘be busy + v-ing’ 를 보세요.","1) ‘~하느라 바쁘다’ 라는 표현이에요.  2) be busy 뒤에 to부정사가 오는지 동명사가 오는지 표에서 확인해요.","to do를 do(하다)의 -ing 꼴로 바꿔요. am busy d로 시작하는 말이에요.","am busy to do (X) / am busy doing (O)"],
 ["Kelly’s hobby is <u>making</u> bracelets.","O","Kelly’s hobby is making bracelets.","Kelly의 취미는 팔찌를 만드는 것이다.","본책 p.74 POINT 3 ‘보어 역할’ 을 보세요.","1) is 뒤에서 취미가 무엇인지 설명하고 있어요.  2) making(원형 make: 만들다)이 보어 자리에 맞는 모양인지 봐요.","동명사가 보어로 쓰인 맞는 문장이에요. 고칠 곳이 없어요.","be동사 + v-ing = 보어 (O)"],
 ["I <u>feel like to take</u> a nap right now.","X, feel like taking","I feel like taking a nap right now.","나는 지금 당장 낮잠을 자고 싶다.","본책 p.74 POINT 4 표의 ‘feel like + v-ing’ 를 보세요.","1) ‘~하고 싶다’ 라는 표현이에요.  2) feel like 뒤에 오는 모양이 표에 어떻게 적혀 있는지 확인해요.","to take(take: 가지다, 취하다)를 -ing 꼴로 바꿔요. feel like t로 시작하는 말이에요.","feel like + v-ing (~하고 싶다)"],
 ["<u>On to see</u> her mom’s face, Jenny felt relieved.","X, On seeing","On seeing her mom’s face, Jenny felt relieved.","엄마의 얼굴을 보자마자, Jenny는 안심했다.","본책 p.74 POINT 4 표의 ‘on[upon] + v-ing’ 를 보세요.","1) ‘~하자마자’ 라는 표현이에요.  2) on은 전치사예요. 전치사 뒤에 to부정사를 쓸 수 없다는 점을 기억해요.","to see(보다)를 -ing 꼴로 바꿔요. On s로 시작하는 말이에요.","On to see (X) / On seeing (O): 전치사 뒤 v-ing"],
 ["Tom refused <u>letting</u> his little sister use his phone.","X, to let","Tom refused to let his little sister use his phone.","Tom은 여동생이 자신의 휴대폰을 쓰게 하는 것을 거절했다.","본책 p.76 POINT 2 ‘to부정사만을 목적어로 취하는 동사’ 목록을 보세요.","1) refused(원형 refuse: 거절하다)가 동사예요.  2) refuse가 어느 목록(동명사만 / to부정사만)에 있는지 찾아요.","letting(원형 let: 허락하다)을 to가 붙은 모양으로 고쳐요. to l로 시작하는 두 단어예요.","refuse + to V (거절하다)"],
 ["I decided <u>starting</u> keeping a diary every day.","X, to start","I decided to start keeping a diary every day.","나는 매일 일기를 쓰기 시작하기로 결심했다.","본책 p.76 POINT 2 ‘to부정사만을 목적어로 취하는 동사’ 목록을 보세요.","1) decided(원형 decide: 결심하다)가 동사예요.  2) decide가 어느 목록에 있는지 찾고, starting이 맞는 모양인지 따져요.","starting(원형 start: 시작하다)을 to가 붙은 모양으로 고쳐요. to s로 시작하는 두 단어예요.","decide + to V (~하기로 결심하다)"],
 ["Nancy is looking forward <u>go</u> to the party next week.","X, to going","Nancy is looking forward to going to the party next week.","Nancy는 다음 주에 파티에 가기를 기대하고 있다.","본책 p.74 POINT 4 표와 아래 파란 박스(look forward to + v-ing)를 보세요.","1) ‘~하기를 기대하다’ 는 look forward to + 동명사예요.  2) 문장에서 forward 뒤에 빠진 단어가 있어요. 그 뒤에 go(가다)를 어떻게 바꿀지 생각해요.","go 앞에 to를 넣고, go는 -ing 꼴로 바꿔요. to g로 시작하는 두 단어예요.","forward 뒤 to 빠뜨리지 말기: forward to v-ing"]

 "본책 p.74 POINT 3 ‘보어 역할’ 을 보세요.",

 "본책 p.74 POINT 4 표의 ‘be worth + v-ing’ 를 보세요.",
 "1) ‘~할 가치가 있다’ 는 be worth + 동명사예요.  2) listen to(~을 듣다)에서 to가 listening 뒤에 남아요. 마지막에 ‘여러 번’ 을 붙여요.",

 "본책 p.76 POINT 4 표의 remember 부분을 보세요.",
 "1) ‘물을 줄 것을 기억했다’ 는 앞으로 할 일을 기억한 거예요.  2) 이럴 때 remember 뒤에는 to부정사를 써요. water(물을 주다) 뒤에 the plants를 이어요.",
 "remembered 바로 뒤에 to가 와요. the는 plants(식물들) 앞에 붙여요.",

W("SW","B",5,"우리말과 일치하도록 (   ) 안에 주어진 말을 바르게 배열하시오.<br>Harry는 그 사고에 대해 말하는 것을 피한다. (accident / talking / avoids / about / the)<br>Harry ___.","avoids talking about the accident","Harry avoids talking about the accident.","Harry는 그 사고에 대해 말하는 것을 피한다.",
 "본책 p.76 POINT 1 ‘동명사만을 목적어로 취하는 동사’ 목록에서 avoid(피하다)를 보세요.",
 "1) 주어 Harry는 한 사람이고 현재라서 avoids예요.  2) avoid 뒤에는 동명사(talking)가 오고, 그 뒤에 ‘그 사고에 대해’ 를 이어요.",

W("SW","B",6,"우리말과 일치하도록 (   ) 안에 주어진 말을 바르게 배열하시오.<br>Martha는 그녀의 가족과 여행하는 것을 즐긴다. (traveling / her / enjoys / with / family)<br>Martha ___.","enjoys traveling with her family","Martha enjoys traveling with her family.","Martha는 그녀의 가족과 여행하는 것을 즐긴다.",
 "본책 p.76 POINT 1 ‘동명사만을 목적어로 취하는 동사’ 목록에서 enjoy(즐기다)를 보세요.",
 "1) 주어 Martha는 한 사람이고 현재라서 enjoys예요.  2) enjoy 뒤에 동명사(traveling)가 오고, 이어서 ‘그녀의 가족과’ 를 붙여요.",
 "enjoys 바로 뒤에 -ing 단어가 와요. her(그녀의)는 family 앞에 붙여요.",
 "enjoy + v-ing (~하는 것을 즐기다)",["traveling","her","enjoys","with","family"]);
W("SW","B",7,"우리말과 일치하도록 (   ) 안에 주어진 말을 바르게 배열하시오.<br>그녀는 그녀의 태블릿 PC를 가져왔던 것을 기억하고 그것을 꺼냈다. (her / bringing / remembered / tablet)<br>She ___ and took it out.","remembered bringing her tablet","She remembered bringing her tablet and took it out.","그녀는 그녀의 태블릿 PC를 가져왔던 것을 기억하고 그것을 꺼냈다.",
 "본책 p.76 POINT 4 표의 remember 부분을 보세요.",
 "1) ‘가져왔던 것’ 은 이미 지난 일이에요.  2) 과거에 한 일을 기억할 때 remember 뒤에는 동명사를 써요. 그 뒤에 ‘그녀의 태블릿’ 을 이어요.",
 "remembered 바로 뒤에 -ing 단어를 써요. her는 tablet 앞에 붙여요.",
 "remember + v-ing (과거에 ~했던 것을 기억)",["her","bringing","remembered","tablet"]);

W("SW","C",1,"다음 그림을 보고 보기와 (   ) 안의 말을 이용하여 문장을 완성하시오.<br>(그림: 빈 밥그릇 앞에서 강아지가 배고파 떨고 있다.)<br>보기: enjoy / forget / spend<br>The owner ___. (feed, the dog)","forgot to feed the dog","The owner forgot to feed the dog.","주인은 개에게 먹이를 줄 것을 잊어버렸다.",
 "본책 p.76 POINT 4 표의 forget 부분을 보세요.",
 "1) 그림에서 강아지가 빈 밥그릇 앞에 있어요. 주인이 밥 주는 걸 어떻게 했을까요?  2) 보기 세 동사 중 그림에 맞는 동사를 고르고, 과거형으로 바꿔요. 먹이를 주는 것은 주인이 해야 했던 일이에요.",
 "forget의 과거형(f로 시작하는 6글자) 뒤에 feed(먹이를 주다)를 -ing가 아닌 모양으로 이어요.",
 "밥을 안 줬다 = forgot to feed (해야 할 일)",["enjoy","forget","spend"]);
W("SW","C",2,"다음 그림을 보고 보기와 (   ) 안의 말을 이용하여 문장을 완성하시오.<br>(그림: 두 아이가 탁구를 치며 즐거워하고 있다.)<br>보기: enjoy / forget / spend<br>Bill ___ with Cathy yesterday. (play, table tennis)","enjoyed playing table tennis","Bill enjoyed playing table tennis with Cathy yesterday.","Bill은 어제 Cathy와 탁구 치는 것을 즐겼다.",
 "본책 p.76 POINT 1 ‘동명사만을 목적어로 취하는 동사’ 목록에서 enjoy(즐기다)를 보세요.",
 "1) 그림 속 아이들이 즐겁게 탁구를 치고 있어요.  2) yesterday(어제)가 있으니 보기 동사를 과거형으로 쓰고, 그 뒤에 동명사를 이어요.",
 "enjoy의 과거형(e로 시작하는 7글자) 뒤에 play(치다)를 바꾼 말과 table tennis를 이어요.",
 "즐긴 일은 enjoyed + v-ing (enjoyed playing)",["enjoy","forget","spend"]);
W("SW","C",3,"다음 그림을 보고 보기와 (   ) 안의 말을 이용하여 문장을 완성하시오.<br>(그림: 3:00 p.m.에 소녀가 책을 읽기 시작하고, 5:00 p.m.에도 같은 소녀가 책을 읽고 있다.)<br>보기: enjoy / forget / spend<br>The girl ___. (two hours, read, a book)","spent two hours reading a book","The girl spent two hours reading a book.","그 소녀는 책을 읽는 데 두 시간을 썼다.",
 "본책 p.74 POINT 4 표의 ‘spend + 시간/돈 + v-ing’ 를 보세요.",
 "1) 그림에서 3시부터 5시까지 두 시간이 지났어요.  2) ‘~하는 데 시간을 쓰다’ 는 spend + 시간 + 동명사예요. 보기 동사를 과거형으로 써요.",
 "spend의 과거형(s로 시작하는 5글자), 그다음 시간, 그다음 read(읽다)를 바꾼 말, 마지막에 a book 순서예요.",
 "spend + 시간 + v-ing (~하는 데 쓰다)",["enjoy","forget","spend"]);

W("SW","D",1,"다음 대화를 읽고 보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오.<br>보기: work / bring / add / go / make<br>A: No… I forgot ___ my laptop. How are we going to work on the project?<br>B: Oh no. All our data is on your laptop. Do you mind <b>2</b> back home to get it?<br>A: Of course not. My house isn’t too far from here. I’ll be right back.<br>B: Okay, thanks. I’ll keep <b>3</b> on the poster while you’re gone.<br>[Twenty minutes later]<br>A: Hey, Brian. I got my laptop. Sorry for <b>4</b> you wait.<br>B: No problem. What do you think of the poster so far?<br>A: It looks good, but I think we need <b>5</b> more information here.<br>B: Yeah, that’s a good idea. I’ll add it now.<br>(밑줄 부분: 1번 빈칸)","to bring","A: No… I forgot to bring my laptop.","A: 아니… 내 노트북을 가져올 것을 잊어버렸어.",
 "본책 p.76 POINT 4 표의 forget 부분을 보세요.",
 "1) 노트북을 안 가져와서 지금 프로젝트를 못 하고 있어요.  2) 해야 할 일을 하지 못한 거예요. 이럴 때 forget 뒤에 쓰는 모양을 표에서 찾아요.",
 "보기 동사 중 b로 시작하는 것을 골라, 앞에 한 단어를 붙여 두 단어로 써요.",
 "노트북을 안 가져옴 = forgot to bring",["work","bring","add","go","make"]);
W("SW","D",2,"다음 대화를 읽고 보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오.<br>보기: work / bring / add / go / make<br>A: No… I forgot <b>1</b> my laptop. How are we going to work on the project?<br>B: Oh no. All our data is on your laptop. Do you mind ___ back home to get it?<br>A: Of course not. My house isn’t too far from here. I’ll be right back.<br>(밑줄 부분: 2번 빈칸)","going","B: Do you mind going back home to get it?","B: 그것을 가지러 집에 다시 갔다 와 줄 수 있어?",
 "본책 p.76 POINT 1 ‘동명사만을 목적어로 취하는 동사’ 목록에서 mind(꺼리다)를 보세요.",
 "1) Do you mind ...? 는 ‘~하는 걸 꺼리니?’ 라는 부탁의 표현이에요.  2) mind 뒤에는 동명사만 와요. 보기에서 ‘집에 다시 가다’ 에 맞는 동사를 골라 바꿔요.",
 "g로 시작하는 5글자예요. go에 ing를 붙여요.",
 "mind + v-ing (~해 줄래? 라는 부탁)",["work","bring","add","go","make"]);
W("SW","D",3,"다음 대화를 읽고 보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오.<br>보기: work / bring / add / go / make<br>B: Okay, thanks. I’ll keep ___ on the poster while you’re gone.<br>[Twenty minutes later]<br>(밑줄 부분: 3번 빈칸)","working","B: I’ll keep working on the poster while you’re gone.","B: 네가 없는 동안 나는 포스터 작업을 계속하고 있을게.",
 "본책 p.76 POINT 1 ‘동명사만을 목적어로 취하는 동사’ 목록에서 keep(계속하다)을 보세요.",
 "1) A가 노트북을 가지러 간 동안 B는 포스터 작업을 해요.  2) keep 뒤에는 동명사만 와요. 보기 중 ‘작업하다’ 동사를 -ing로 바꿔요.",
 "w로 시작하는 7글자예요. work에 ing를 붙여요.",
 "I’ll keep working: keep(계속하다) 뒤 동사는 -ing",["work","bring","add","go","make"]);
W("SW","D",4,"다음 대화를 읽고 보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오.<br>보기: work / bring / add / go / make<br>A: Hey, Brian. I got my laptop. Sorry for ___ you wait.<br>B: No problem. What do you think of the poster so far?<br>(밑줄 부분: 4번 빈칸)","making","A: Sorry for making you wait.","A: 너를 기다리게 해서 미안해.",
 "본책 p.74 POINT 2 ‘전치사의 목적어’ 를 보세요.",
 "1) Sorry for(~에 대해 미안해) 뒤의 for는 전치사예요.  2) 전치사 뒤에는 동명사가 와요. 보기에서 ‘~하게 만들다’ 에 맞는 동사를 -ing로 바꿔요(you wait는 그대로).",
 "m으로 시작하는 6글자예요. make의 e를 빼고 ing를 붙여요.",
 "전치사 for 뒤에는 v-ing",["work","bring","add","go","make"]);
W("SW","D",5,"다음 대화를 읽고 보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오.<br>보기: work / bring / add / go / make<br>A: It looks good, but I think we need ___ more information here.<br>B: Yeah, that’s a good idea. I’ll add it now.<br>(밑줄 부분: 5번 빈칸)","to add","A: I think we need to add more information here.","A: 내 생각에 여기에 정보를 더 추가해야 할 것 같아.",
 "본책 p.76 POINT 2 ‘to부정사만을 목적어로 취하는 동사’ 목록에서 need(필요하다)를 보세요.",
 "1) need(필요하다) 뒤에 ‘정보를 더 추가하는 것’ 이 이어져요.  2) need는 to부정사만 목적어로 받아요. B가 I’ll add it now라고 한 것도 힌트예요.",
 "보기 동사 중 a로 시작하는 것을 골라, 앞에 한 단어를 붙여 두 단어로 써요.",
 "need + to V (~할 필요가 있다)",["work","bring","add","go","make"]);

 "1) 보기마다 앞의 동사나 전치사를 먼저 찾아요.  2) expect(기대하다)는 to부정사만 받고, enjoy(즐기다)는 동명사만 받아요. 전치사 뒤는 어떤 모양일까요?",
 "good at의 at이 전치사인데 뒤에 동사원형이 왔어요. 두 번째 보기예요.",
 "전치사 뒤에는 v-ing (good at composing)");
C("NS","N",7,"[6-7] 밑줄 친 부분이 어법상 옳지 않은 것을 고르시오.<br>① He promised <u>to vote</u> for me.<br>② Oscar hopes <u>to change</u> their minds.<br>③ My favorite activity is <u>recording</u> vlogs.<br>④ Simon agreed <u>helping</u> out at the festival.<br>⑤ <u>Walking</u> home alone at night can be scary.",["① to vote","② to change","③ recording","④ helping","⑤ Walking"],"④ helping","Simon agreed to help out at the festival.","Simon은 축제에서 돕기로 동의했다.",
 "본책 p.76 POINT 2 ‘to부정사만을 목적어로 취하는 동사’ 목록을 보세요.",
 "1) promise(약속하다), hope(희망하다), agree(동의하다)가 어느 목록에 있는지 확인해요.  2) 그 뒤 모양이 목록의 설명과 맞는지 하나씩 따져요.",
 "agree 뒤에 -ing가 왔어요. 네 번째 보기예요.",
 "agreed helping (X) / agreed to help (O)");
C("NS","N",8,"[8-9] 빈칸에 들어갈 말이 순서대로 짝지어진 것을 고르시오.<br>• I want ___ some pizza today.<br>• You can practice ___ with me after school.",["① eat — coding","② to eat — to code","③ to eat — coding","④ eating — code","⑤ eating — to code"],"③ to eat — coding","I want to eat some pizza today. / You can practice coding with me after school.","나는 오늘 피자를 좀 먹고 싶다. / 방과 후에 나와 코딩을 연습할 수 있다.",
 "본책 p.76 POINT 1·2 목록에서 want(원하다)와 practice(연습하다)를 각각 찾아보세요.",
 "1) want는 to부정사만, practice는 동명사만 목적어로 받아요.  2) 첫 빈칸, 둘째 빈칸에 각각 맞는 모양을 순서대로 찾아요.",
 "첫째는 to가 붙고 둘째는 -ing 꼴이에요. 세 번째 보기예요.",
 "want + to V / practice + v-ing");
C("NS","N",9,"[8-9] 빈칸에 들어갈 말이 순서대로 짝지어진 것을 고르시오.<br>• George hates ___ his parents argue.<br>• Maria chose ___ the train instead of the bus.",["① see — take","② seeing — take","③ seeing — taking","④ to see — taking","⑤ to see — to take"],"⑤ to see — to take","George hates to see his parents argue. / Maria chose to take the train instead of the bus.","George는 부모님이 다투는 것을 보는 것을 싫어한다. / Maria는 버스 대신 기차를 타기로 선택했다.",
 "본책 p.76 POINT 3(hate)와 POINT 2(choose) 목록을 보세요.",
 "1) 첫 문장은 hate(몹시 싫어하다) 뒤에 ‘see 부모님이 다투는 것’ 이 이어져요. 빈칸 뒤에 his parents argue가 이어지는 모양을 보세요.  2) choose(선택하다)는 to부정사만 받아요.",
 "둘째 빈칸이 to take인 보기를 먼저 찾고, 첫째 빈칸과 맞는지 보세요. 마지막 보기예요.",
 "hate는 둘 다 OK, choose(선택하다)는 to V만");
M("NS","N",10,"빈칸에 들어갈 말로 알맞은 것을 모두 고르시오.<br>My phone started ___ during the movie.",["① ring","② rang","③ to ring","④ ringing","⑤ to ringing"],["③ to ring","④ ringing"],"My phone started to ring[ringing] during the movie.","내 휴대폰이 영화 상영 중에 울리기 시작했다.",
 "본책 p.76 POINT 3 ‘의미 차이가 없는 경우’ 목록을 보세요.",
 "1) started(원형 start: 시작하다)가 동사예요.  2) POINT 3 목록에 start가 있어요. 그렇다면 어떤 두 가지 모양이 가능할까요?",
 "to가 붙은 보기 하나와 -ing가 붙은 보기 하나예요. 세 번째와 네 번째 보기예요.",
 "start + v-ing / to V");
W("NS","N",11,"[11-13] 우리말을 영어로 옮길 때 어법상 틀린 부분을 찾아 바르게 고치시오.<br>나는 어렸을 때 일본에 갔던 것을 기억하지 못한다.<br>→ I don’t remember to visit Japan when I was young.","to visit → visiting","I don’t remember visiting Japan when I was young.","나는 어렸을 때 일본에 갔던 것을 기억하지 못한다.",
 "본책 p.76 POINT 4 표의 remember 부분을 보세요.",
 "1) ‘갔던 것’ 은 어렸을 때, 즉 이미 지난 일이에요.  2) ‘(과거에) ~한 것을 기억하다’ 에 쓰는 모양과 문장 속 to visit을 비교해요.",
 "to visit을 v로 시작하는 -ing 꼴 한 단어로 바꿔요.",
 "remember + v-ing (과거에 ~한 것)");
W("NS","N",12,"[11-13] 우리말을 영어로 옮길 때 어법상 틀린 부분을 찾아 바르게 고치시오.<br>Robert는 자전거 타는 것을 멈췄다.<br>→ Robert stopped to ride his bike.","to ride → riding","Robert stopped riding his bike.","Robert는 자전거 타는 것을 멈췄다.",
 "본책 p.76 파란 박스 ‘stop + 동명사 / stop + to부정사’ 를 보세요.",
 "1) 우리말은 ‘타는 것을 멈췄다’ 예요. 타기 위해 멈춘 게 아니에요.  2) 이 뜻일 때 stop 뒤에 쓰는 모양과 문장 속 to ride를 비교해요.",
 "to ride를 r로 시작하는 -ing 꼴 한 단어로 바꿔요.",
 "멈춘 행동 자체 = stop v-ing / 목적 = stop to V");
W("NS","N",13,"[11-13] 우리말을 영어로 옮길 때 어법상 틀린 부분을 찾아 바르게 고치시오.<br>나는 이번 학기에 좋은 성적을 받을 것을 기대한다.<br>→ I expect getting good grades this semester.","getting → to get","I expect to get good grades this semester.","나는 이번 학기에 좋은 성적을 받을 것을 기대한다.",
 "본책 p.76 POINT 2 ‘to부정사만을 목적어로 취하는 동사’ 목록에서 expect(기대하다)를 찾아보세요.",
 "1) expect(기대하다, 예상하다)가 동사예요.  2) expect가 어느 목록에 있는지 찾고, getting이 맞는 모양인지 따져요.",
 "getting을 to가 붙은 두 단어로 바꿔요. to g로 시작해요.",
 "expect + to V (~하기를 기대하다)");
C("NS","N",14,"빈칸에 들어갈 말로 알맞지 않은 것은?<br>Helen ___ reading the newspaper.",["① quit","② liked","③ avoided","④ stopped","⑤ refused"],"⑤ refused","Helen refused to read the newspaper. (refused 뒤에는 to부정사만 가능)","Helen은 신문 읽는 것을 거절했다. (refused는 reading 앞에 올 수 없다)",
 "본책 p.76 POINT 1·2·3 목록에서 보기 동사들을 각각 찾아보세요.",
 "1) 빈칸 뒤에 reading(동명사)이 이미 있어요.  2) 보기 동사 중 동명사를 목적어로 받을 수 없는 것, 즉 to부정사만 받는 동사를 찾아요.",
 "refuse(거절하다)는 to부정사만 받아요. 마지막 보기예요.",
 "refuse + to V (동명사 안 됨)");
C("NS","N",15,"밑줄 친 부분의 쓰임이 나머지 넷과 다른 것은?<br>① My father quit <u>smoking</u>.<br>② Evan finished <u>talking</u> and sat down.<br>③ <u>Getting</u> enough sleep is important.<br>④ She admitted <u>lying</u> to me.<br>⑤ Daniel fell asleep without <u>brushing</u> his teeth.",["① smoking","② talking","③ Getting","④ lying","⑤ brushing"],"③ Getting","Getting enough sleep is important.","충분한 수면을 취하는 것은 중요하다.",
 "본책 p.74 POINT 1 ‘주어 역할’ 과 POINT 2 ‘목적어 역할’ 을 비교해 보세요.",
 "1) 밑줄 친 동명사가 문장 어디에 있는지 보세요.  2) 동사 뒤인지, 전치사 뒤인지, 문장 맨 앞인지 나눠서 비교해요.",
 "하나만 문장 맨 앞에서 주어로 쓰였고 나머지는 모두 목적어예요. 세 번째 보기예요.",
 "문장 맨 앞 = 주어 / 동사·전치사 뒤 = 목적어");
C("NS","N",16,"우리말을 영어로 바르게 옮긴 것은?<br>그 의사는 더 이상 약을 먹지 않을 것을 제안했다.<br>① The doctor suggested taking the medicine anymore.<br>② The doctor suggested not taking the medicine anymore.<br>③ The doctor suggested taking not the medicine anymore.<br>④ The doctor suggested not to take the medicine anymore.<br>⑤ The doctor suggested to take not the medicine anymore.",["① The doctor suggested taking the medicine anymore.","② The doctor suggested not taking the medicine anymore.","③ The doctor suggested taking not the medicine anymore.","④ The doctor suggested not to take the medicine anymore.","⑤ The doctor suggested to take not the medicine anymore."],"② The doctor suggested not taking the medicine anymore.","The doctor suggested not taking the medicine anymore.","그 의사는 더 이상 약을 먹지 않을 것을 제안했다.",
 "본책 p.74 POINT 2 ‘동명사의 부정’ 과 p.76 POINT 1 목록의 suggest(제안하다)를 보세요.",
 "1) suggest(제안하다)는 동명사만 목적어로 받아요. to부정사가 들어간 보기는 빼요.  2) 동명사의 부정은 not이나 never를 어디에 쓰는지 생각해요.",
 "not은 동명사 바로 앞에 써요. 두 번째 보기예요.",
 "suggest + not + v-ing");
W("NS","N",17,"표의 내용과 일치하도록 빈칸에 알맞은 말을 쓰시오.<br>(표: Name - Jisoo / Hobby - listen to music / Talent - play softball / Vacation Plan - visit her sister in New York)<br>Jisoo’s hobby is ___ to music. She is good at ___ softball. She plans ___ her sister in New York.","listening, playing, to visit","Jisoo’s hobby is listening to music. She is good at playing softball. She plans to visit her sister in New York.","지수의 취미는 음악을 듣는 것이다. 그녀는 소프트볼을 잘한다. 그녀는 뉴욕에 있는 언니를 방문할 계획이다.",
 "본책 p.74 POINT 3(보어)와 POINT 4(be good at), p.76 POINT 2(plan)를 함께 보세요.",
 "1) 첫째 빈칸은 be동사 is 뒤 보어 자리, 둘째는 전치사 at 뒤, 셋째는 plan(계획하다) 뒤예요.  2) 각각 동명사, 동명사, to부정사 중 어느 모양인지 정해요.",
 "첫째·둘째 빈칸은 표의 동사에 -ing를 붙이고, 셋째 빈칸은 표의 동사 앞에 한 단어를 붙인 두 단어예요.",
 "보어·전치사 뒤는 v-ing / plan + to V");
C("NS","N",18,"어법상 옳은 것끼리 바르게 짝지어진 것은?<br>ⓐ He goes hiking every Sunday.<br>ⓑ He quit acting a long time ago.<br>ⓒ Being on time for appointments is respectful.<br>ⓓ I feel like to have lobster for dinner tonight.<br>ⓔ Lisa enjoys to volunteer at the animal shelter.",["① ⓐ, ⓑ, ⓒ","② ⓑ, ⓒ, ⓓ","③ ⓐ, ⓓ, ⓔ","④ ⓑ, ⓒ, ⓔ","⑤ ⓒ, ⓓ, ⓔ"],"① ⓐ, ⓑ, ⓒ","He goes hiking every Sunday. / He quit acting a long time ago. / Being on time for appointments is respectful.","그는 일요일마다 하이킹을 간다. / 그는 오래전에 연기를 그만뒀다. / 약속에 시간을 지키는 것은 존중하는 태도이다.",
 "본책 p.74 POINT 4 표(go + v-ing, feel like + v-ing)와 p.76 POINT 1 목록을 보세요.",
 "1) ⓐ~ⓔ를 하나씩 읽으며 동사 뒤 모양을 확인해요.  2) feel like 뒤 모양, enjoy(즐기다) 뒤 모양이 규칙과 맞는지 따져요.",
 "ⓓ와 ⓔ가 들어간 보기는 모두 빼요. 남는 것은 첫 번째 보기예요.",
 "feel like + v-ing / enjoy + v-ing");
C("NS","N",19,"밑줄 친 부분과 쓰임이 같은 것은?<br>Her job is <u>treating</u> sick animals.<br>① Jake imagined <u>riding</u> in a submarine.<br>② Laura’s favorite thing is <u>drawing</u> cartoons.<br>③ <u>Getting</u> a haircut made him look younger.<br>④ They stopped <u>filming</u> the movie last week.<br>⑤ <u>Drinking</u> water is important for your health.",["① riding","② drawing","③ Getting","④ filming","⑤ Drinking"],"② drawing","Laura’s favorite thing is drawing cartoons.","Laura가 가장 좋아하는 일은 만화를 그리는 것이다.",
 "본책 p.74 POINT 1·2·3 중에서 문제의 밑줄 친 동명사가 어느 역할인지 먼저 정해 보세요.",
 "1) Her job is treating ... 에서 treating은 is 뒤에서 job(직업)을 설명해요.  2) 보기에서 같은 자리에 쓰인 동명사를 찾아요.",
 "be동사 is 뒤에 있는 보기가 같은 쓰임이에요. 두 번째 보기예요.",
 "be동사 뒤 v-ing = 보어");
C("NS","N",20,"우리말 해석이 바르지 않은 것은?<br>① Dave stopped to buy some milk.<br>→ Dave는 우유를 사기 위해 멈췄다.<br>② Emily forgot to send her resume to the company.<br>→ Emily는 그 회사에 이력서를 보낼 것을 잊어버렸다.<br>③ Do you remember going to the exhibit?<br>→ 너는 그 전시회에 갔던 것을 기억하니?<br>④ Jessie tried using the new coffee machine.<br>→ Jessie는 새 커피 머신을 사용하려고 노력했다.<br>⑤ Josh isn’t used to eating spicy food.<br>→ Josh는 매운 음식을 먹는 것에 익숙하지 않다.",["① stopped to buy","② forgot to send","③ remember going","④ tried using","⑤ used to eating"],"④ tried using","Jessie tried using the new coffee machine. (Jessie는 새 커피 머신을 (시험 삼아) 사용해 봤다.)","Jessie는 새 커피 머신을 사용해 보았다.",
 "본책 p.76 POINT 4 표와 파란 박스(stop, forget, remember, try)를 보세요.",
 "1) 보기마다 동사 뒤 모양(to V / v-ing)을 보고 뜻이 맞게 쓰였는지 표와 비교해요.  2) try 뒤에 -ing가 오면 어떤 뜻일까요?",
 "‘노력했다’ 는 뜻은 try 뒤에 to부정사가 올 때예요. 네 번째 보기예요.",
 "try + v-ing = 시험 삼아 ~해 보다");
M("NS","N",21,"[21-22] 다음 글을 읽고 질문에 답하시오.<br>My cousins Alyssa and Jordan are coming over to my house this weekend. The last time I saw them was last year. We will spend our time ⓐ<u>doing</u> many fun things. When we hang out, we like ⓑ<u>watch</u> movies and enjoy ⓒ<u>playing</u> board games. This year, I feel like ⓓ<u>to go</u> to the amusement park when they’re here too. 나는 그들을 보기를 정말로 기대하고 있다. We can’t help ⓔ<u>having</u> fun when we’re together.<br>위 글의 밑줄 친 ⓐ~ⓔ 중 어법상 옳은 것을 모두 고르시오.",["① ⓐ","② ⓑ","③ ⓒ","④ ⓓ","⑤ ⓔ"],["① ⓐ","③ ⓒ","⑤ ⓔ"],"We will spend our time doing many fun things. ... we like to watch[watching] movies and enjoy playing board games. ... I feel like going to the amusement park ... We can’t help having fun ...","우리는 재미있는 많은 것들을 하며 시간을 보낼 것이다. 우리가 놀 때, 우리는 영화를 보는 것을 좋아하고 보드 게임 하는 것을 즐긴다. 나는 놀이공원에 가고 싶다. 우리는 함께 있을 때 즐거울 수밖에 없다.",
 "본책 p.74 POINT 4 표(spend, feel like)와 p.76 POINT 3(like)를 보세요.",
 "1) ⓐ는 spend + 시간 + 동명사, ⓓ는 feel like 뒤, ⓑ는 like 뒤, ⓒ는 enjoy 뒤, ⓔ는 can’t help 뒤예요.  2) 각 표현 뒤에 오는 모양이 맞는지 하나씩 확인해요.",
 "ⓑ(원형 watch를 그대로 씀)와 ⓓ(to go)가 틀렸어요. 나머지 세 개가 옳아요.",
 "spend ~ v-ing / enjoy v-ing / feel like v-ing");
W("NS","N",22,"[21-22] (위 글 읽고) 밑줄 친 우리말과 일치하도록 (   ) 안의 말을 이용하여 문장을 완성하시오.<br>나는 그들을 보기를 정말로 기대하고 있다.<br>→ I am really ___ them. (look forward to, see)","looking forward to seeing","I am really looking forward to seeing them.","나는 그들을 보기를 정말로 기대하고 있다.",
 "본책 p.74 POINT 4 표와 아래 파란 박스(look forward to + v-ing)를 보세요.",
 "1) I am really 뒤에 -ing 모양이 와야 해요(am ... ing = 진행하는 중).  2) look forward to의 to는 전치사라서 뒤의 see(보다)를 어떻게 바꿀지 생각해요.",
 "looking forward to 다음에 s로 시작하는 6글자(see + ing)를 써요.",
 "am looking forward to seeing (진행형 + 전치사 to)");
C("NS","N",23,"대화의 밑줄 친 우리말을 영어로 옮길 때 어법상 옳지 않은 것은?<br>A: It’s such a beautiful day!<br>B: I know! It’s too nice outside. Let’s not just stay indoors.<br>A: Yes, I totally agree. 나는 공원에서 산책하고 싶어.<br>→ I ⓐ<u>feel</u> ⓑ<u>like</u> ⓒ<u>to take</u> ⓓ<u>a walk</u> ⓔ<u>in</u> the park.",["① ⓐ","② ⓑ","③ ⓒ","④ ⓓ","⑤ ⓔ"],"③ ⓒ","I feel like taking a walk in the park.","나는 공원에서 산책하고 싶다.",
 "본책 p.74 POINT 4 표의 ‘feel like + v-ing’ 를 보세요.",
 "1) ‘~하고 싶다’ 는 feel like 뒤에 어떤 모양을 쓰는지 표에서 확인해요.  2) ⓐ~ⓔ 중 이 규칙과 어긋나는 부분을 찾아요.",
 "like 바로 뒤에 온 부분이에요. 세 번째 보기예요.",
 "feel like + v-ing (to V 안 됨)");
C("NS","N",24,"어법상 옳지 않은 것의 개수는?<br>• Making macarons is difficult.<br>• We avoid to watch too much TV.<br>• Elena was afraid of speaking in front of many people.<br>• On to take the medicine, I felt better immediately.<br>• Isaac hopes going to New Zealand someday.<br>• They are interested in learning more about Pluto.<br>• I forgot giving Jessie her gift yesterday, so I took it home with me.",["① 2개","② 3개","③ 4개","④ 5개","⑤ 6개"],"③ 4개","틀린 문장: We avoid watching too much TV. / On taking the medicine, I felt better immediately. / Isaac hopes to go to New Zealand someday. / I forgot to give Jessie her gift yesterday, so I took it home with me.","마카롱을 만드는 것은 어렵다. 우리는 TV를 너무 많이 보는 것을 피한다. Elena는 많은 사람 앞에서 말하는 것을 두려워했다. 약을 먹자마자 나는 곧바로 나아졌다. Isaac은 언젠가 뉴질랜드에 가기를 희망한다. 그들은 명왕성에 대해 더 배우는 데 관심이 있다. 나는 어제 Jessie에게 선물 주는 것을 잊어서 그것을 집에 가져갔다.",
 "본책 p.74 POINT 1·2·4와 p.76 POINT 1·2·4를 보세요.",
 "1) 문장을 하나씩 읽고 동사나 전치사 뒤 모양을 확인해요.  2) avoid(피하다)는 동명사만, hope(희망하다)는 to부정사만, on은 전치사, forget은 ‘~할 것을 잊다’ 인지 ‘~했던 것을 잊다’ 인지 따져요.",
 "틀린 문장은 avoid 문장, On 문장, hope 문장, forget 문장이에요. 이 개수와 맞는 보기를 고르세요.",
 "avoid v-ing / on v-ing / hope to V / forget to V");
W("NS","N",25,"[25-26] 동명사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>• They were busy.<br>• They planned the event.<br>→ They ___.","were busy planning the event","They were busy planning the event.","그들은 행사를 계획하느라 바빴다.",
 "본책 p.74 POINT 4 표의 ‘be busy + v-ing’ 를 보세요.",
 "1) 두 문장을 이으면 ‘행사를 계획하느라 바빴다’ 가 돼요.  2) were busy 뒤에 planned(원형 plan: 계획하다)를 어떤 모양으로 바꿔 이을지 생각해요.",
 "were busy 다음에 p로 시작하는 -ing 한 단어와 the event를 써요.",
 "두 문장 잇기: were busy + v-ing (~하느라 바빴다)");
W("NS","N",26,"[25-26] 동명사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>• I ran in the park from 5:00 p.m. to 6:00 p.m.<br>• I spent an hour there.<br>→ I ___ in the park.","spent an hour running","I spent an hour running in the park.","나는 공원에서 달리는 데 한 시간을 썼다.",
 "본책 p.74 POINT 4 표의 ‘spend + 시간/돈 + v-ing’ 를 보세요.",
 "1) 5시부터 6시까지 달렸으니 한 시간을 쓴 거예요.  2) spend 뒤에 시간을 쓰고 그 뒤에 ‘~하는 데’ 를 이어요. 시제는 과거예요.",
 "spend의 과거형(s로 시작하는 5글자), 그다음 시간, 그 뒤에 run(달리다)을 바꾼 r로 시작하는 7글자(n을 한 번 더 써요)예요.",
 "spend + 시간 + v-ing");
C("NS","N",27,"밑줄 친 부분에 to부정사가 쓰일 수 없는 것은?<br>① John loves <u>listening</u> to rock music.<br>② They started <u>calling</u> me by my nickname.<br>③ My sister likes <u>taking</u> pictures of flowers.<br>④ Tony hates <u>walking</u> on hot summer days.<br>⑤ Sam finished <u>eating</u> his meal in thirty minutes.",["① listening","② calling","③ taking","④ walking","⑤ eating"],"⑤ eating","Sam finished eating his meal in thirty minutes.","Sam은 30분 만에 식사를 끝냈다.",
 "본책 p.76 POINT 1 목록과 POINT 3 목록을 비교해 보세요.",
 "1) 보기마다 앞 동사(love, start, like, hate, finish)를 찾아요.  2) 어느 동사가 ‘동명사만’ 받는 목록에 있고, 어느 동사가 ‘둘 다’ 받는 목록에 있는지 나눠요.",
 "finish(끝내다)는 동명사만 받아요. 마지막 보기예요.",
 "finish + v-ing만 (to V 안 됨)");
C("NS","N",28,"우리말과 일치하도록 (   ) 안에 주어진 말을 배열할 때 여섯 번째 오는 것은?<br>기업들은 그들의 제품을 광고하는 데 많은 돈을 쓴다.<br>(lots / their / advertising / money / spend / products / of / companies)",["① spend","② their","③ advertising","④ lots","⑤ money"],"③ advertising","Companies spend lots of money advertising their products.","기업들은 그들의 제품을 광고하는 데 많은 돈을 쓴다.",
 "본책 p.74 POINT 4 표의 ‘spend + 시간/돈 + v-ing’ 를 보세요.",
 "1) 문장은 Companies(기업들) 뒤에 spend(쓰다)가 와요.  2) spend 뒤에 돈(lots of money), 그 뒤에 ‘~하는 데’ 에 해당하는 동명사를 이어요.",
 "순서는 Companies → spend → lots → of → money → ? → their → products 예요. 여섯 번째 자리에 ‘광고하는 데’ 가 와요.",
 "spend + 돈 + v-ing");
W("NS","N",29,"그림의 상황과 일치하도록 (   ) 안의 말을 이용하여 문장을 완성하시오.<br>(그림: 한 소년이 침대에서 자고 있고 시계는 이미 늦은 시간을 가리킨다. 소년이 “I didn’t set the alarm last night.” 하고 말한다.)<br>The boy ___ last night. (forget)","forgot to set the alarm","The boy forgot to set the alarm last night.","그 소년은 어젯밤 알람을 맞출 것을 잊어버렸다.",
 "본책 p.76 POINT 4 표의 forget 부분을 보세요.",
 "1) 그림 속 말풍선이 “I didn’t set the alarm last night.”(어젯밤 알람을 맞추지 않았다)예요.  2) 알람 맞추는 건 해야 했던 일이에요. forget 뒤에 쓰는 모양을 표에서 찾아요.",
 "forget의 과거형(f로 시작하는 6글자) 뒤에 set(맞추다)을 -ing가 아닌 모양으로 쓰고 the alarm을 이어요.",
 "알람을 안 맞춤 = forgot to set (못 한 일)");
C("NS","N",30,"빈칸 (A)~(C)에 들어갈 말이 바르게 짝지어진 것은?<br>• Mia will start (A) ___ again in June.<br>• Henry decided (B) ___ some bread on his way home.<br>• Walking in the forest (C) ___ refreshing.<br>(A) / (B) / (C)",["① exercising — to buy — is","② to exercise — buying — are","③ exercising — buying — is","④ to exercise — to buy — are","⑤ exercising — buying — are"],"① exercising — to buy — is","Mia will start exercising[to exercise] again in June. / Henry decided to buy some bread on his way home. / Walking in the forest is refreshing.","Mia는 6월에 다시 운동하기 시작할 것이다. / Henry는 집에 가는 길에 빵을 사기로 결심했다. / 숲속을 걷는 것은 상쾌하다.",
 "본책 p.76 POINT 3(start), POINT 2(decide)와 p.74 POINT 1 박스(주어 동명사는 단수)를 보세요.",
 "1) start는 둘 다 가능, decide(결심하다)는 to부정사만이에요.  2) (C)의 주어는 Walking in the forest인데, 동명사(구) 주어는 단수일까요 복수일까요?",
 "(B)는 to buy, (C)는 단수형 be동사예요. 이 둘이 맞는 보기를 찾으면 첫 번째 보기가 남아요.",
 "start 둘 다 / decide to V / 동명사 주어 단수");
