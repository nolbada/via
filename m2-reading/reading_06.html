ice";var PASS_EN=["Looking for Advice","Which club should I choose?jumping_cat","↳ Re: Stay with your friends.dancing_cow","↳ Re: Try something different!coding_bear","How can I get a dog?cute_puppy","↳ Re: Dogs are so cute!sweet_fox","↳ Re: Be responsible.wise_owl","Which club should I choose?","I can't decide on a school club. Last year, I was on the dance team. This year, I want to try something new. Actually, I'm interested in coding. However, all of my friends will stay on the dance team. What should I do?","↳ Re: Stay with your friends.","Club activities are all about spending time with your friends. You'll have so much fun with your friends on the dance team. Imagine dancing together at the school festival! Those moments will make good memories.","↳ Re: Try something different!","You should try something that interests you. Who knows? You might learn coding and create a fun app. Maybe your friends will use your app. Just follow your heart, and don't worry about anything else.","How can I get a dog?","Yesterday, I ran into a friend who was walking her dog. The dog's name is Gamja, and she's so cute! I want a dog, too, but my parents won't allow it. What should I do?"];var PASS_KO=["조언이 필요해","어느 동아리를 선택해야 할까?jumping_cat","↳ 답변: 친구들과 함께 있어.dancing_cow","↳ 답변: 다른 것을 시도해 봐!coding_bear","어떻게 하면 개를 키울 수 있을까?cute_puppy","↳ 답변: 개들은 정말 귀여워!sweet_fox","↳ 답변: 책임을 져야 해.wise_owl","어느 동아리를 선택해야 할까?","나는 학교 동아리를 결정할 수가 없어. 작년에 나는 댄스 팀에 있었어. 올해엔 뭔가 새로운 것을 시도해 보고 싶어. 사실, 나는 코딩에 관심이 있어. 그렇지만 내 친구들은 모두 댄스 팀에 계속 남아 있을 거야. 나는 어떻게 해야 할까?","↳ 답변: 친구들과 함께 있어.","동아리 활동은 친구들과 시간을 보내는 것이 전부야. 너는 댄스 팀에서 친구들과 정말 재미있는 시간을 보낼 거야. 학교 축제에서 함께 춤추는 것을 상상해 봐! 그러한 순간들은 좋은 추억이 될 거야.","↳ 답변: 다른 것을 시도해 봐!","너는 네가 관심 있는 것을 시도해야 해. 혹시 알아? 네가 코딩을 배워서 재미있는 앱을 만들 수도 있지. 아마 네 친구들이 너의 앱을 사용할 수도 있고. 그저 마음 가는 대로 하고, 그 외 다른 건 걱정하지 마.","어떻게 하면 개를 키울 수 있을까?","어제 나는 자신의 개를 산책시키는 친구와 우연히 만났어. 그 개의 이름은 감자이고, 정말 귀여워! 나도 개를 키우고 싶지만, 나의 부모님은 그것을 허락하지 않으실 거야. 나는 어떻게 해야 할까?"];var DG=[{"qs":[{"n":1,"q":"What is the boy' : 개가 계속 몸을 긁는다.","근거: My dog keeps scratching himself.(우리 개가 계속 몸을 긁어.)","함정: 아픈지는 'He might be sick.'(아픈 걸 수도 있어.)로 소년이 추측한 것이다."],"why":"Sarah의 고민은 개가 계속 몸을 긁는 것이다."}],"dlg":[["B","Sarah, you look worried. What's wrong?","Sarah, 너 걱정스러워 보여. 무슨 일이야?"],["G","My dog keeps scratching himself.","우리 개가 계속 몸을 긁어."],["B","Oh, I'm sorry to hear that. Is it serious?","아, 그것참 안됐다. 심각하니?"],["G","I think so. He won't stop. What should I do?","그런 것 같아. 멈추질 않아. 나 어떻게 해야 할까?"],["B","You should take him to the vet as soon as possible. He might be sick.","가능한 한 빨리 그를 수의사에게 데려가 봐. 아픈 걸 수도 있어."],["G","Okay, I will. Thank you so much.","알겠어, 그렇게 할게. 정말 고마워."]]},{"qs":[{"n":3,"q":"위 대화의 주제로 알맞은 것은?","o":["introducing places at school","finding the lost and found","looking for lost earphones","asking for earphone repair","buying new earphones"],"a":2,"ans":"looking for lost earphones","evs":[["G: Henry, what are you looking for?","Henry, 뭘 찾고 있니?"],["B: I'm looking for my earphones. I lost them.","내 이어폰을 찾고 있어. 잃어버렸거든."]],"ev":["G: Henry, what are you looking for?","Henry, 뭘 찾고 있니?"],"ow":["오답 ✕ — 학교 안 장소를 소개하는 대화가 아니다. 분실물 보관소 위치는 'It's on the second floor of the school.'(학교 2층에 있어.)라는 일부 내용일 뿐이다.","오답 ✕ — 'You should go to the lost and found.'(분실물 보관소에 가 봐.)는 해결책 중 하나이고, 대화 전체는 이어폰을 잃어버린 일이 중심이라 너무 좁다.","정답 ○ — 'I'm looking for my earphones. I lost them.'(내 이어폰을 찾고 있어. 잃어버렸거든.)으로 시작해, 사물함 확인과 분실물 보관소를 이야기하므로 잃어버린 이어폰을 찾는 것이 주제이다.","오답 ✕ — 수리에 대한 언급은 없다. Henry는 'I lost them.'(잃어버렸어.)이라고 했다.","오답 ✕ — 새 이어폰을 산다는 말은 없다. 소녀는 'I hope you find them soon.'(곧 찾길 바라.)라고 했다."],"memo":["정답 ③: 잃어버린 이어폰 찾기","근거: I'm looking for my earphones. I lost them.(내 이어폰을 찾고 있어. 잃어버렸거든.)","함정: ② 분실물 보관소는 해결 방법 중 하나일 뿐이다 ✕"],"why":"Henry가 잃어버린 이어폰을 찾는 이야기이다."},{"n":4,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["Henry는 이어폰을 잃어 버렸다.","Henry는 이미 사물함을 확인했다.","소녀는 분실물 보관소에 가 볼 것을 제안한다.","Henry는 분실물 보관소 위치를 알고 있다.","소녀는 Henry가 이어폰을 금방 찾길 바란다."],"a":3,"ans":"Henry는 분실물 보관소 위치를 알고 있다.","evs":[["B: Oh, I didn't think of that. Wh
