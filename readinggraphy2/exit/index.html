의적인 방법이에요."]],"w":"1번에서 위에 그림이 있는 커피 이야기를 하고, 2번에서 우유로 그림을 만든다고 함. decorate = 장식하다.","c":1},"h":"23cf817941"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Interestingly, something similar was happening thousands of years ago in China!)","ko":"흥미롭게도, 수천 년 전 중국에서도 ＿＿＿＿ 일이 일어나고 있었다!","opts":["위험한","새로운","비슷한","어려운"],"word":"similar","r":{"a":"3) 비슷한","ev":"2~4번 문장","s":[[2,"It is known as “latte art.” It’s a creative way to decorate coffee using milk.","그것은 ‘라테 아트’라고 알려져 있어요. 그것은 우유를 사용해 커피를 장식하는 창의적인 방법이에요."],[3,"Interestingly, something similar was happening thousands of years ago in China!","흥미롭게도, 수천 년 전 중국에서도 비슷한 일이 일어나고 있었어요!"],[4,"The ancient Chinese tea art was called Chabaixi.","고대 중국의 차 예술은 Chabaixi라고 불렸어요."]],"w":"2번의 라테 아트와 4번의 Chabaixi가 모두 음료 위에 그림을 그리는 예술. 3번의 similar는 ‘비슷한’.","c":3},"h":"d6c0de38f9"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAfter that, they used a special spoon to draw pictures, like bamboo and mountains.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그 후, 그들은 대나무와 산과 같은 그림을 그리기 위해 특별한 숟가락을 사용했어요.","opts":["커피 가게의 손님들","고대 중국의 예술가들","찻잎들","두 개의 숟가락"],"r":{"a":"2) 고대 중국의 예술가들","ev":"5~7번 문장","s":[[5,"It means “a hundred tricks with tea.” To make Chabaixi, artists first turned tea leaves into powder.","그것은 ‘차를 이용한 백 가지 묘기’라는 뜻이에요. Chabaixi를 만들기 위해, 예술가들은 먼저 찻잎을 가루로 만들었어요."],[6,"Then, they mixed water with the powder until it became foamy.","그다음에, 그들은 거품이 생길 때까지 물과 가루를 섞었어요."],[7,"After that, they used a special spoon to draw pictures, like bamboo and mountains.","그 후, 그들은 대나무와 산과 같은 그림을 그리기 위해 특별한 숟가락을 사용했어요."]],"w":"5번에서 Chabaixi를 만드는 사람은 artists(예술가들)이고, 6번과 7번의 they도 같은 사람들. 가루를 만들고, 섞고, 그림을 그리는 것은 예술가들임.","c":2},"h":"90312b5065"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Chabaixi is a little different from modern latte art.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Chabaixi는 현대의 라테 아트와는 약간 달라요.","opts":["Chabaixi는 현대의 라테 아트와 조금 다르다.","Chabaixi는 현대의 라테 아트와 완전히 똑같다.","Chabaixi는 현대의 라테 아트보다 훨씬 나중에 생겼다.","Chabaixi는 현대의 라테 아트를 보고 만들어졌다."],"r":{"a":"1) Chabaixi는 현대의 라테 아트와 조금 다르다.","ev":"8번 문장","s":[[8,"Chabaixi is a little different from modern latte art.","Chabaixi는 현대의 라테 아트와는 약간 달라요."]],"w":"8번의 a little different from은 ~와 조금 다르다는 뜻. 완전히 똑같다는 보기는 반대이고, 나중에 생겼다거나 라테 아트를 보고 만들어졌다는 내용은 본문에 없음(오히려 수천 년 전 중국에서 시작, 3번).","c":1},"h":"a093bb3e93"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Chabaixi는 몇 해 전에 중국에서 시작되었다.","Chabaixi를 만들 때 예술가들은 먼저 찻잎을 가루로 만든다.","Chabaixi의 그림은 하루 종일 남아 있다.","라테 아트는 찻잎 가루로 만든다."],"opts":["Chabaixi began in China a few years ago.","In Chabaixi, artists first turn tea leaves into powder.","The picture in Chabaixi stays for a whole day.","Latte art is made with tea powder."],"r":{"a":"2) In Chabaixi, artists first turn tea leaves into powder.","ev":"2~3번, 5번, 11번 문장","s":[[2,"It is known as “latte art.” It’s a creative way to decorate coffee using milk.","그것은 ‘라테 아트’라고 알려져 있어요. 그것은 우유를 사용해 커피를 장식하는 창의적인 방법이에요."],[3,"Interestingly, something similar was happening thousands of years ago in China!","흥미롭게도, 수천 년 전 중국에서도 비슷한 일이 일어나고 있었어요!"],[5,"It means “a hundred tricks with tea.” To make Chabaixi, artists first turned tea leaves into powder.","그것은 ‘차를 이용한 백 가지 묘기’라는 뜻이에요. Chabaixi를 만들기 위해, 예술가들은 먼저 찻잎을 가루로 만들었어요."],[11,"Although the picture disappears in just 20 minutes, that’s enough time to enjoy the beautiful designs!","비록 그 그림은 20분 만에 사라지지만, 그것은 아름다운 디자인을 즐기기에 충분한 시간이에요."]],"w":"5번에서 예술가들이 먼저 찻잎을 가루로 만든다고 함. Chabaixi는 수천 년 전(3번), 그림은 20분 만에 사라지고(11번), 라테 아트는 우유로 만듦(2번)이라 나머지는 틀림.","c":2},"h":"ec63ed27f1"},{"n":9,"t":"sum","q":"When the water (A) the tea, it turns (B).","ko":"물이 차에 (A) 때, 그것은 (B)(으)로 변한다.","opts":["(A) touches / (B) white","(A) touches / (B) green","(A) leaves / (B) white","(A) leaves / (B) green","(A) smells / (B) loud"],"oko":["(A) 닿을 / (B) 흰색","(A) 닿을 / (B) 초록색","(A) 떠날 / (B) 흰색","(A) 떠날 / (B) 초록색","(A) 냄새 맡을 / (B) 시끄러운"],"r":{"a":"1) (A) touches / (B) white ((A) 닿을 / (B) 흰색)","ev":"10번 문장","s":[[10,"When the water touches the tea, it turns white.","물이 차에 닿으면, 그것은 흰색으로 변해요."]],"w":"10번에서 물이 차에 닿으면 그것은 흰색으로 변함(When the water touches the tea, it turns white). touch는 닿다, turn white는 흰색으로 변하다. leaves(떠나다)·smells나 green·loud는 본문과 맞지 않음.","c":1},"h":"529aaa5b1b"},{"n":10,"t":"fill","q":"Have you [A] coffee with a picture on [B]?","ko":"여러분은 [B]에 그림이 있는 커피를 [A] 적이 있나요?","bank":["seen","tiny","top","creative","ancient","foamy"],"bko":{"seen":"본(see의 과거분사)","tiny":"아주 작은","top":"위, 꼭대기","creative":"창의적인","ancient":"고대의","foamy":"거품이 생기는"},"r":{"a":"[A] seen (본(see의 과거분사)), [B] top (위, 꼭대기)","ev":"1번 문장","s":[[1,"Have you seen coffee with a picture on top?","여러분은 위에 그림이 그려진 커피를 본 적이 있나요?"]],"w":"1번에서 위에 그림이 있는 커피를 본 적이 있느냐고 물음(Have you seen coffee with a picture on top?). Have you seen은 본 적이 있나요, seen은 see(보다)의 과거분사, top은 위. tiny·creative·ancient·foamy는 꾸며 주는 말이라 이 자리에 맞지 않음.","c":null},"h":"add648f7ac"}]},{"u":6,"id":"rg2-06-3","no":3,"ko":"식물이 팝콘처럼 톡톡 소리를 낸다고?","items":[{"n":1,"t":"tf","q":"Tomato plants made popping sounds only when they were not stressed.","ko":"토마토 식물들은 스트레스를 받지 않았을 때만 톡 하고 터지는 소리를 냈다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"When the plants were stressed — such as when their stems were cut — they made 30 to 50 popping sounds in an hour!","그 식물들이 스트레스를 받았을 때 — 예를 들어 줄기가 잘렸을 때 — 한 시간에 30에서 50번의 톡 하고 터지는 소리를 냈어요!"]],"w":"7번에서 식물들이 스트레스를 받았을 때(줄기가 잘렸을 때 등) 한 시간에 30~50번 소리를 냈다고 함. 스트레스를 받지 않았을 때만이라는 말은 반대임.","c":"F"},"h":"b235a09f7a"},{"n":2,"t":"tf","q":"Some plants can make sounds like popping popcorn.","ko":"몇몇 식물들은 톡 하고 터지는 팝콘과 같은 소리를 낼 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"Some plants have a surprising secret.","몇몇 식물들은 놀라운 비밀을 가지고 있어요."],[2,"They can actually make sounds like popping popcorn!","그것들은 사실 톡 하고 터지는 팝콘과 같은 소리를 낼 수 있어요!"]],"w":"2번 문장에서 식물들이 popping popcorn 같은 소리를 낼 수 있다고 함.","c":"T"},"h":"97b938140b"},{"n":3,"t":"tf","q":"The sounds of plants are loud, so people can usually hear them.","ko":"식물의 소리는 커서 사람들이 보통 들을 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"But these sounds are very quiet, so we can’t usually hear them.","그러나 이 소리는 매우 조용해서, 우리는 보통 그것들을 들을 수 없어요."]],"w":"3번에서 이 소리들은 매우 조용해서(very quiet) 우리가 보통 들을 수 없다고 함.","c":"F"},"h":"12513ce069"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This shows that plants react to stress, just like we do.)","ko":"이는 식물들이 우리처럼 스트레스에 ＿＿＿＿＿ 것을 보여 준다.","opts":["반응하다","도망가다","잊다","끝내다"],"word":"react","r":{"a":"1) 반응하다","ev":"7~8번 문장","s":[[7,"When the plants were stressed — such as when their stems were cut — they made 30 to 50 popping sounds in an hour!","그 식물들이 스트레스를 받았을 때 — 예를 들어 줄기가 잘렸을 때 — 한 시간에 30에서 50번의 톡 하고 터지는 소리를 냈어요!"],[8,"This shows that plants react to stress, just like we do.","이는 식물들이 우리처럼 스트레스에 반응한다는 것을 보여 줘요."]],"w":"7번에서 스트레스를 받으면 소리를 더 많이 냈고, 8번에서 그것이 스트레스에 react하는 것이라고 함. react = 반응하다.","c":1},"h":"df14c1ebaa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Making sounds is just their unique way of reacting to stress.)","ko":"소리를 내는 것은 단지 스트레스에 반응하는 그들만의 ＿＿＿ 방법이다.","opts":["흔한","독특한","시끄러운","작은"],"word":"unique","r":{"a":"2) 독특한","ev":"9~10번 문장","s":[[9,"But this reaction doesn’t mean that plants communicate with each other by making sounds.","하지만 이 반응이 식물들이 소리를 내어 서로 의사소통한다는 의미는 아니에요."],[10,"Making sounds is just their unique way of reacting to stress.","소리를 내는 것은 단지 스트레스에 반응하는 그들만의 독특한 방법이에요."]],"w":"10번의 unique way는 ‘그들만의 특별한 방법’. 9번에서 서로 의사소통하는 것이 아니라 식물 나름의 반응 방법이라고 하므로 unique = 독특한.","c":2},"h":"3a1fd68201"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey studied tomato plants with special microphones that can hear the quietest sounds.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 가장 작은 소리도 들을 수 있는 특별한 마이크로 토마토 식물을 연구했어요.","opts":["토마토 식물들","마이크들","과학자들","소리들"],"r":{"a":"3) 과학자들","ev":"5~6번 문장","s":[[5,"However, scientists discovered something interesting.","하지만, 과학자들이 흥미로운 점을 발견했어요."],[6,"They studied tomato plants with special microphones that can hear the quietest sounds.","그들은 가장 작은 소리도 들을 수 있는 특별한 마이크로 토마토 식물을 연구했어요."]],"w":"5번에서 scientists(과학자들)가 흥미로운 점을 발견했다고 하고, 6번의 They가 토마토 식물을 연구한 사람들임. 연구 대상은 tomato plants.","c":3},"h":"3231f9b86e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even though you can’t hear anything, they might be shouting for help!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 여러분은 아무것도 들을 수 없지만, 그것들은 도와달라고 외치고 있을지도 몰라요!","opts":["아무것도 들을 수 없으니 식물은 도움이 필요 없다.","아무것도 들을 수 없어서 식물은 소리를 지르지 않는다.","식물이 도와달라고 외치는 소리를 우리는 분명히 듣는다.","비록 아무것도 들을 수 없어도, 식물들은 도와달라고 외치고 있을지도 모른다."],"r":{"a":"4) 비록 아무것도 들을 수 없어도, 식물들은 도와달라고 외치고 있을지도 모른다.","ev":"12번 문장","s":[[12,"Even though you can’t hear anything, they might be shouting for help!","비록 여러분은 아무것도 들을 수 없지만, 그것들은 도와달라고 외치고 있을지도 몰라요!"]],"w":"Even though는 ‘비록 ~이지만’, might be shouting for help는 ‘도와달라고 외치고 있을지도 모른다’. 우리가 듣지 못해도 식물이 신호를 보내고 있을 수 있다는 뜻.","c":4},"h":"957da39d4e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["The plants normally make one tiny popping sound each hour.","Tomato plants made sounds only when they were happy.","Plants normally make 30 to 50 sounds every hour.","Scientists found that plants talk to each other."],"oko":["그 식물들은 보통 한 시간에 한 번씩 아주 작은 소리를 낸다.","토마토 식물은 기분이 좋을 때만 소리를 냈다.","식물은 평소에 한 시간에 30~50번 소리를 낸다.","과학자들은 식물이 서로 대화한다는 것을 발견했다."],"r":{"a":"1) The plants normally make one tiny popping sound each hour. (그 식물들은 보통 한 시간에 한 번씩 아주 작은 소리를 낸다.)","ev":"4번, 7번, 9번 문장","s":[[4,"The plants normally make one tiny popping sound each hour.","그 식물들은 보통 한 시간에 한 번씩 아주 작은 톡 하고 터지는 소리를 내요."],[7,"When the plants were stressed — such as when their stems were cut — they made 30 to 50 popping sounds in an hour!","그 식물들이 스트레스를 받았을 때 — 예를 들어 줄기가 잘렸을 때 — 한 시간에 30에서 50번의 톡 하고 터지는 소리를 냈어요!"],[9,"But this reaction doesn’t mean that plants communicate with each other by making sounds.","하지만 이 반응이 식물들이 소리를 내어 서로 의사소통한다는 의미는 아니에요."]],"w":"4번에서 식물들은 보통 한 시간에 한 번씩 아주 작은 소리를 냄. 스트레스를 받았을 때는 30~50번 소리를 냈음(7번)이라 평소에 30~50번은 아님. 소리를 내는 것이 서로 의사소통한다는 뜻은 아님(9번).","c":1},"h":"e87588fb1f"},{"n":9,"t":"sum","q":"If you’re taking (A) of plants, don’t forget to give them (B).","ko":"식물을 (A) 있다면, 그것들에게 (B)을(를) 주는 것을 잊지 마세요.","opts":["(A) care / (B) water","(A) care / (B) shoes","(A) fun / (B) water","(A) fun / (B) shoes","(A) time / (B) toys"],"oko":["(A) 돌보고 / (B) 물","(A) 돌보고 / (B) 신발","(A) 놀리고 / (B) 물","(A) 놀리고 / (B) 신발","(A) 시간 보내고 / (B) 장난감"],"r":{"a":"1) (A) care / (B) water ((A) 돌보고 / (B) 물)","ev":"11번 문장","s":[[11,"So, if you’re taking care of plants, don’t forget to give them water.","따라서 여러분이 식물을 돌보고 있다면, 물 주는 것을 잊지 마세요."]],"w":"11번에서 식물을 돌보고 있다면 물 주는 것을 잊지 말라고 함(taking care of plants, don’t forget to give them water). take care of는 ~을 돌보다. shoes(신발)·toys(장난감)는 식물에게 주는 것이 아님.","c":1},"h":"5468d51c60"},{"n":10,"t":"fill","q":"However, scientists [A] something [B].","ko":"하지만, 과학자들이 [B] 점을 [A].","bank":["discovered","hour","interesting","stem","popcorn","microphones"],"bko":{"discovered":"발견했다","hour":"시간","interesting":"흥미로운","stem":"줄기","popcorn":"팝콘","microphones":"마이크들"},"r":{"a":"[A] discovered (발견했다), [B] interesting (흥미로운)","ev":"5번 문장","s":[[5,"However, scientists discovered something interesting.","하지만, 과학자들이 흥미로운 점을 발견했어요."]],"w":"5번에서 과학자들이 흥미로운 점을 발견했음(scientists discovered something interesting). discovered는 discover(발견하다)의 과거형, interesting은 흥미로운. hour·stem·popcorn·microphones는 이름을 나타내는 말이라 동사 자리와 something 뒤에 맞지 않음.","c":null},"h":"f87678d12d"}]},{"u":7,"id":"rg2-07-1","no":1,"ko":"얼음이 녹자 집이 흔들린다? 마을이 이사 가는 이유","items":[{"n":1,"t":"tf","q":"Permafrost is a kind of soil that stays frozen all the time.","ko":"영구 동토층은 항상 얼어붙은 상태로 유지되는 토양의 한 종류이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","w":"5번 문장 It’s a kind of soil that stays frozen all the time이 그대로 나옴. It은 4번의 permafrost.","c":"T","s":[[5,"It’s a kind of soil that stays frozen all the time.","그것은 항상 얼어붙은 상태로 유지되는 토양의 한 종류이다."]]},"h":"d17b13cb88"},{"n":2,"t":"tf","q":"Newtok is on the east coast of Alaska.","ko":"Newtok은 알래스카의 동해안에 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","w":"2번 문장에서 Newtok은 on the west coast(서해안)라고 함. 동해안이 아니라 서해안이라 틀림.","c":"F","s":[[2,"It is on the west coast of Alaska, U.S.","그곳은 미국 알래스카의 서해안에 있다."]]},"h":"fb08a146cb"},{"n":3,"t":"tf","q":"Houses in Newtok shake when people walk inside them.","ko":"Newtok의 집들은 사람들이 그 안에서 걸을 때 흔들린다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","w":"10번 문장 In fact, houses in Newtok shake when people walk inside them. 그대로 나옴. 영구 동토층이 녹아서 땅이 약해졌기 때문.","c":"T","s":[[10,"In fact, houses in Newtok shake when people walk inside them.","사실, Newtok의 집들은 사람들이 그 안에서 걸어 다닐 때 흔들린다."]]},"h":"972df8ebc2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is making the ice inside the permafrost melt.)","ko":"(이것이 영구 동토층 안의 얼음을 ... 만들고 있다.)","opts":["얼다","녹다","흔들리다","이사하다"],"word":"melt","r":{"ev":"8번 문장","w":"8번 문장에서 얼음(ice)이 melt하게 만든다는 내용. 따뜻해지는 날씨(7번) 때문에 얼음이 녹는 것. 얼다(freeze)는 반대 뜻.","c":2,"s":[[8,"This is making the ice inside the permafrost melt.","이것이 영구 동토층 안에 있는 얼음을 녹게 만들고 있다."]],"a":"2) 녹다"},"h":"29535c9dcb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The people of Newtok feel both sad and relieved about it.)","ko":"(Newtok의 사람들은 그것에 대해 슬프면서도 ... 느낀다.)","opts":["화난","지루한","놀란","안도하는"],"word":"relieved","r":{"ev":"12번 문장","w":"12번 문장에서 both sad and relieved. 슬프기도 하지만 위험한 집에서 벗어나 마음이 놓인다는 뜻이라 relieved = 안도하는. sad와 함께 쓰여 서로 다른 두 감정을 말함.","c":4,"s":[[12,"The people of Newtok feel both sad and relieved about it.","Newtok의 사람들은 그것에 대해 슬프면서도 안도감을 느낀다."]],"a":"4) 안도하는"},"h":"4253a9750e"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nWhen permafrost melts, this can break buildings and roads.","ko":"밑줄 친 \"this\"가 가리키는 것은?","sko":"영구 동토층이 녹으면, 이것은 건물과 도로를 부술 수 있다.","pron":"this","opts":["영구 동토층이 녹는 것","건물","도로","추운 날씨"],"r":{"a":"1) 영구 동토층이 녹는 것","ev":"9번 문장","s":[[9,"When permafrost melts, this can break buildings and roads.","영구 동토층이 녹으면, 이것은 건물과 도로를 부술 수 있다."]],"w":"9번에서 When permafrost melts, this can break buildings and roads(영구 동토층이 녹으면, 이것이 건물과 도로를 부술 수 있다). this는 앞의 영구 동토층이 녹는 일을 가리킴.","c":1,"k":"this = 영구 동토층이 녹는 것"},"h":"531e4a0986"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why Newtok has to move to a safer place.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 Newtok이 더 안전한 곳으로 이사해야 하는 이유이다.","opts":["앞에서 말한 일들 때문에 Newtok은 더 안전한 곳으로 이사해야 한다.","Newtok이 더 안전한 곳이 되어서 사람들이 이사 오고 있다.","Newtok은 안전한 곳으로 이사해서 문제가 모두 해결되었다.","Newtok 사람들은 이사하고 싶어서 집을 일부러 부수었다."],"r":{"ev":"9~11번 문장","w":"That’s why는 ‘그것이 ~한 이유이다’. 앞의 원인(9~10번: 건물이 부서지고 집이 흔들림) 때문에 이사해야 한다는 결과를 말함. 문제가 해결되었다거나 집을 부쉈다는 말은 없음.","c":1,"s":[[9,"When permafrost melts, this can break buildings and roads.","영구 동토층이 녹으면, 이것은 건물과 도로를 부술 수 있다."],[10,"In fact, houses in Newtok shake when people walk inside them.","사실, Newtok의 집들은 사람들이 그 안에서 걸어 다닐 때 흔들린다."],[11,"That’s why Newtok has to move to a safer place.","그것이 Newtok이 더 안전한 곳으로 이사해야 하는 이유이다."]],"a":"1) 앞에서 말한 일들 때문에 Newtok은 더 안전한 곳으로 이사해야 한다."},"h":"cc1f84253f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Newtok is a large city in Alaska.","The ground in Newtok has never been frozen.","People in Newtok are happy to stay in their old houses forever.","Newtok is facing a big problem because of climate change."],"oko":["Newtok은 알래스카에 있는 큰 도시이다.","Newtok의 땅은 한 번도 얼어 있었던 적이 없다.","Newtok 사람들은 오래된 집에 영원히 머무르는 것을 기뻐한다.","Newtok은 기후 변화 때문에 큰 문제에 직면해 있다."],"r":{"a":"4) Newtok is facing a big problem because of climate change. (Newtok은 기후 변화 때문에 큰 문제에 직면해 있다.)","ev":"1번, 3번, 5번, 11번 문장","s":[[1,"Newtok is a small village in the Arctic area.","Newtok은 북극 지방의 작은 마을이다."],[3,"Because of climate change, Newtok is facing a big problem.","기후 변화 때문에, Newtok은 큰 문제에 직면해 있다."],[5,"It’s a kind of soil that stays frozen all the time.","그것은 항상 얼어붙은 상태로 유지되는 토양의 한 종류이다."],[11,"That’s why Newtok has to move to a safer place.","그것이 Newtok이 더 안전한 곳으로 이사해야 하는 이유이다."]],"w":"3번에서 Newtok은 기후 변화 때문에 큰 문제에 직면해 있음(is facing은 직면해 있다). Newtok은 큰 도시가 아니라 작은 마을(1번), 땅은 항상 얼어 있던 영구 동토층(5번), 사람들은 이사해야 함(11번).","c":4},"h":"23cf140680"},{"n":9,"t":"sum","q":"The weather is getting (A) very (B).","ko":"날씨가 매우 (B) (A) 있다.","opts":["(A) warmer / (B) fast","(A) warmer / (B) slowly","(A) colder / (B) fast","(A) colder / (B) slowly","(A) wetter / (B) quietly"],"oko":["(A) 따뜻해지고 / (B) 빠르게","(A) 따뜻해지고 / (B) 느리게","(A) 추워지고 / (B) 빠르게","(A) 추워지고 / (B) 느리게","(A) 습해지고 / (B) 조용히"],"r":{"a":"1) (A) warmer / (B) fast ((A) 따뜻해지고 / (B) 빠르게)","ev":"7번 문장","s":[[7,"But, the weather is getting warmer very fast.","그러나, 날씨가 매우 빠르게 따뜻해지고 있다."]],"w":"7번에서 날씨가 매우 빠르게 따뜻해지고 있음(the weather is getting warmer very fast). warmer는 더 따뜻한, fast는 빠르게. colder·wetter나 slowly·quietly는 본문과 맞지 않음.","c":1},"h":"c33febc3c5"},{"n":10,"t":"fill","q":"Sadly, more [A] might be like Newtok in the [B].","ko":"안타깝게도, [B]에는 더 많은 [A]이(가) Newtok처럼 될지도 모른다.","bank":["frozen","villages","safer","future","tired","shake"],"bko":{"frozen":"얼어붙은","villages":"마을들","safer":"더 안전한","future":"미래","tired":"피곤한","shake":"흔들리다"},"r":{"a":"[A] villages (마을들), [B] future (미래)","ev":"14번 문장","s":[[14,"Sadly, more villages might be like Newtok in the future.","안타깝게도, 미래에는 더 많은 마을들이 Newtok처럼 될지도 모른다."]],"w":"14번에서 안타깝게도 미래에는 더 많은 마을들이 Newtok처럼 될지도 모른다고 함(more villages might be like Newtok in the future). villages는 village(마을)의 복수형, future는 미래. frozen·safer·tired는 꾸며 주는 말이고 shake는 동사라 more 뒤와 the 뒤의 이름 자리에 맞지 않음.","c":null},"h":"9acf145911"}]},{"u":7,"id":"rg2-07-2","no":2,"ko":"사진으로 노래를 만든다고? 반려동물 작곡가","items":[{"n":1,"t":"tf","q":"Noam uses pet photos to create beautiful songs.","ko":"Noam은 아름다운 노래를 만들기 위해 반려동물의 사진을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","w":"6번 문장 He uses pet photos to create beautiful songs. 그대로 나옴.","c":"T","s":[[6,"He uses pet photos to create beautiful songs.","그는 아름다운 노래를 만들기 위해 반려동물의 사진을 사용한다."]]},"h":"5a16ead569"},{"n":2,"t":"tf","q":"If the pet is calm, Noam makes happy music.","ko":"반려동물이 차분하면, Noam은 행복한 음악을 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","w":"11번 문장에서 반려동물이 calm(차분한)이면 gentle music(온화한 음악)을 만든다고 함. 행복한 음악은 활발한(lively) 반려동물의 경우(10번).","c":"F","s":[[11,"If the pet is calm, he makes gentle music.","만약 반려동물이 차분하면, 그는 온화한 음악을 만든다."]]},"h":"e70a5e2bfa"},{"n":3,"t":"tf","q":"Noam learns about the pets from their owners before composing.","ko":"Noam은 작곡하기 전에 주인으로부터 반려동물에 대해 알아본다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","w":"9번 문장 Before composing, he learns about the pets from their owners. 주인에게서 알아본 뒤에 작곡함.","c":"T","s":[[9,"Before composing, he learns about the pets from their owners.","작곡을 하기 전에, 그는 주인으로부터 반려동물에 대해 알아본다."]]},"h":"53ffc7ae62"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...a project that combines the words “symphony” and “paw.”)","ko":"(... ‘symphony’와 ‘paw’라는 단어를 ... 프로젝트)","opts":["나누다","지우다","결합하다","던지다"],"word":"combines","r":{"ev":"5번 문장","w":"5번에서 Sympawnies는 symphony(교향곡)와 paw(발) 두 단어를 합쳐 만든 이름. combine = 결합하다, 합치다. 나누다는 반대 방향.","c":3,"s":[[5,"So, he started “Sympawnies,” a project that combines the words “symphony” and “paw.”","그래서 그는 ‘symphony(교향곡)’와 ‘paw(동물의 발)’라는 단어를 결합한 프로젝트인 ‘Sympawnies’를 시작했다."]],"a":"3) 결합하다"},"h":"0843010333"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If the pet is lively, he makes happy music.)","ko":"(만약 반려동물이 ...하면, 그는 행복한 음악을 만든다.)","opts":["활발한","슬픈","조용한","뚱뚱한"],"word":"lively","r":{"ev":"10번 문장","w":"10번에서 lively한 반려동물에게 happy music을 만든다고 함. 11번 calm(차분한)과 대비되므로 lively = 활발한, 명랑한.","c":1,"s":[[10,"If the pet is lively, he makes happy music.","만약 반려동물이 활발하면, 그는 행복한 음악을 만든다."]],"a":"1) 활발한"},"h":"dfbe788ec8"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nHis music makes people feel less sad when they miss their lost pets.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그의 음악은 사람들이 잃은 반려동물을 그리워할 때 슬픔을 덜 느끼게 해 준다.","pron":"they","opts":["반려동물을 잃은 사람들","반려동물들","Noam","다른 작곡가들"],"r":{"a":"1) 반려동물을 잃은 사람들","ev":"2번 문장","s":[[2,"His music makes people feel less sad when they miss their lost pets.","그의 음악은 사람들이 잃은 반려동물을 그리워할 때 슬픔을 덜 느끼게 해 준다."]],"w":"2번에서 His music makes people feel less sad when they miss their lost pets(그의 음악은 사람들이 반려동물을 그리워할 때 슬픔을 덜 느끼게 해 준다). 반려동물을 그리워하는 쪽이 사람들이므로 they = people.","c":1,"k":"they = 반려동물을 잃은 사람들"},"h":"9ff8daae61"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The results are fun for both the eyes and the ears.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 결과물은 눈과 귀 모두를 즐겁게 해 준다.","opts":["결과물은 눈으로 볼 때만 재미있다.","결과물은 귀로 들을 때만 재미있다.","눈과 귀가 불편한 사람들을 위한 결과물이다.","결과물은 눈으로 보는 것도, 귀로 듣는 것도 모두 즐겁다."],"r":{"ev":"7~8번 문장","w":"both A and B는 ‘A와 B 둘 다’. 7번에서 악보가 반려동물과 똑같이 생겼으니 눈이 즐겁고, 노래는 귀가 즐거움. 한쪽만 즐겁다는 선지는 both와 맞지 않음.","c":4,"s":[[7,"Surprisingly, the scores look exactly like the pets.","놀랍게도, 그 악보들은 반려동물들과 똑같이 생겼다."],[8,"The results are fun for both the eyes and the ears.","그 결과물은 눈과 귀 모두를 즐겁게 해 준다."]],"a":"4) 결과물은 눈으로 보는 것도, 귀로 듣는 것도 모두 즐겁다."},"h":"7e31f4d589"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Noam uses only the names of pets to make songs.","Noam learns about the pets after he makes the songs.","Noam makes the same song for every pet.","Noam thought Chubby Cat was sweet and playful."],"oko":["Noam은 노래를 만들 때 반려동물의 이름만 사용한다.","Noam은 노래를 만든 뒤에 주인에게서 반려동물에 대해 알아본다.","Noam은 모든 반려동물에게 똑같은 노래를 만들어 준다.","Noam은 Chubby Cat이 상냥하고 장난기가 많다고 생각했다."],"r":{"a":"4) Noam thought Chubby Cat was sweet and playful. (Noam은 Chubby Cat이 상냥하고 장난기가 많다고 생각했다.)","ev":"6번, 9번, 12번 문장","s":[[6,"He uses pet photos to create beautiful songs.","그는 아름다운 노래를 만들기 위해 반려동물의 사진을 사용한다."],[9,"Before composing, he learns about the pets from their owners.","작곡을 하기 전에, 그는 주인으로부터 반려동물에 대해 알아본다."],[12,"For example, he thought a cat named Chubby Cat was sweet and playful.","예를 들어, 그는 Chubby Cat이라는 이름의 고양이가 상냥하고 장난기가 많다고 생각했다."]],"w":"12번에서 Noam은 Chubby Cat이 상냥하고 장난기가 많다고 생각했음(thought는 think의 과거형). 노래는 이름만이 아니라 사진으로 만들고(6번), 반려동물에 대해 알아보는 것은 작곡하기 전(9번)이며, 반려동물마다 다른 음악을 만듦.","c":4},"h":"7220353e49"},{"n":9,"t":"sum","q":"He (A) animals, music, and (B).","ko":"그는 동물, 음악, 그리고 (B)을(를) (A).","opts":["(A) loved / (B) drawings","(A) loved / (B) homework","(A) hated / (B) drawings","(A) hated / (B) homework","(A) forgot / (B) cooking"],"oko":["(A) 좋아했다 / (B) 그림","(A) 좋아했다 / (B) 숙제","(A) 싫어했다 / (B) 그림","(A) 싫어했다 / (B) 숙제","(A) 잊었다 / (B) 요리"],"r":{"a":"1) (A) loved / (B) drawings ((A) 좋아했다 / (B) 그림)","ev":"4번 문장","s":[[4,"He loved animals, music, and drawings.","그는 동물, 음악, 그리고 그림을 좋아했다."]],"w":"4번에서 그는 동물, 음악, 그리고 그림을 좋아했음(He loved animals, music, and drawings). loved는 love(좋아하다)의 과거형, drawings는 그림들. hated·forgot이나 homework·cooking은 본문과 맞지 않음.","c":1},"h":"023bd53ca8"},{"n":10,"t":"fill","q":"After [A] school, Noam wanted to use his [B] in a special way.","ko":"학교를 [A] 후, Noam은 자신의 [B]을(를) 특별한 방법으로 사용하고 싶어 했다.","bank":["quickly","finishing","exactly","talents","learns","simply"],"bko":{"quickly":"재빨리","finishing":"마친(finish의 -ing형)","exactly":"정확히","talents":"재능들","learns":"알아본다","simply":"단순히"},"r":{"a":"[A] finishing (마친(finish의 -ing형)), [B] talents (재능들)","ev":"3번 문장","s":[[3,"After finishing school, Noam wanted to use his talents in a special way.","학교를 졸업한 후, Noam은 자신의 재능을 특별한 방법으로 사용하고 싶어 했다."]],"w":"3번에서 학교를 마친 후 Noam은 자신의 재능을 특별한 방법으로 사용하고 싶어 했음(After finishing school, … use his talents). finishing은 finish(마치다)의 -ing형, talents는 talent(재능)의 복수형. quickly·exactly·simply는 부사이고 learns는 동사라 이 자리에 맞지 않음.","c":null},"h":"1ea501c936"}]},{"u":7,"id":"rg2-07-3","no":3,"ko":"영국 왕이 빼앗아 간 돌, 700년 만에 돌아오다","items":[{"n":1,"t":"tf","q":"The Stone of Destiny weighs about 125 kilograms.","ko":"운명의 돌은 무게가 약 125킬로그램이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장 It’s a large, rectangular rock and weighs about 125 kilograms. 그대로 나옴.","c":"T","s":[[2,"It’s a large, rectangular rock and weighs about 125 kilograms.","그것은 직사각형의 큰 바위이고 무게는 약 125킬로그램이다."]]},"h":"5473d259a5"},{"n":2,"t":"tf","q":"The Scottish people were sad when the stone came back to Scotland.","ko":"스코틀랜드 사람들은 돌이 스코틀랜드로 돌아왔을 때 슬펐다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","w":"9번에서 1996년에 돌이 스코틀랜드에 돌아오고, 10번에서 스코틀랜드 사람들은 행복했다(happy)고 함. 슬펐던 때는 돌을 빼앗겼을 때(7번).","c":"F","s":[[9,"Finally, in 1996, the British government officially returned the stone to Scotland.","마침내, 1996년에 영국 정부는 공식적으로 그 돌을 스코틀랜드에 돌려주었다."],[10,"The Scottish people were happy.","스코틀랜드 사람들은 행복했다."]]},"h":"32fe6132bc"},{"n":3,"t":"tf","q":"An English king took the Stone of Destiny from Scotland in 1296.","ko":"한 영국 왕이 1296년에 스코틀랜드에서 운명의 돌을 가져갔다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","w":"5번 문장 However, in 1296, an English king named Edward I took the stone from Scotland. 그대로 나옴.","c":"T","s":[[5,"However, in 1296, an English king named Edward I took the stone from Scotland.","하지만, 1296년에 영국의 왕인 에드워드 1세가 스코틀랜드에서 그 돌을 가져갔다."]]},"h":"bc29987854"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...the Stone of Destiny was used to crown Scottish kings.)","ko":"(운명의 돌은 스코틀랜드 왕들을 ...하는 데 사용되었다.)","opts":["왕위에 앉히다","그림을 그리다","돌려주다","부수다"],"word":"crown","r":{"ev":"4번 문장","w":"4번에서 돌은 새 왕을 정하는 의식(3번)에서 쓰였음. crown은 왕관을 씌워 왕위에 앉히다. 돌려주다(return)는 9번에 나오는 다른 단어.","c":1,"s":[[4,"Originally, the Stone of Destiny was used to crown Scottish kings.","원래, 운명의 돌은 스코틀랜드 왕들을 왕위에 앉히는 데 사용되었다."]],"a":"1) 왕위에 앉히다"},"h":"75e924bfa5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the British government officially returned the stone to Scotland.)","ko":"(영국 정부는 ... 그 돌을 스코틀랜드에 돌려주었다.)","opts":["우연히","몰래","공식적으로","천천히"],"word":"officially","r":{"ev":"9번 문장","w":"9번에서 영국 정부(government)가 돌을 돌려주었다는 내용. 정부가 하는 일이므로 officially = 공식적으로. 몰래(secretly)는 맞지 않음.","c":3,"s":[[9,"Finally, in 1996, the British government officially returned the stone to Scotland.","마침내, 1996년에 영국 정부는 공식적으로 그 돌을 스코틀랜드에 돌려주었다."]],"a":"3) 공식적으로"},"h":"59d1f6b8b6"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe wanted to show off his power and control over the Scottish people.","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 자신의 권력과 스코틀랜드 사람들에 대한 통제력을 과시하고 싶어 했다.","opts":["스코틀랜드의 왕","영국 왕 에드워드 1세","영국 정부","스코틀랜드 사람"],"r":{"ev":"5~6번 문장","w":"5번에서 영국 왕 에드워드 1세가 돌을 가져갔고, 6번 He는 그 왕. 권력을 과시하고 싶어 돌을 가져간 사람.","c":2,"s":[[5,"However, in 1296, an English king named Edward I took the stone from Scotland.","하지만, 1296년에 영국의 왕인 에드워드 1세가 스코틀랜드에서 그 돌을 가져갔다."],[6,"He wanted to show off his power and control over the Scottish people.","그는 자신의 권력과 스코틀랜드 사람들에 대한 통제력을 과시하고 싶어 했다."]],"a":"2) 영국 왕 에드워드 1세"},"h":"6b0db5649f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They felt like a missing part of their history was finally back!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 자신들의 역사 중 잃어버린 부분이 마침내 돌아온 것처럼 느꼈다!","opts":["그들은 자신들의 역사가 완전히 사라졌다고 느꼈다.","그들은 새로운 역사를 만들 수 있다고 느꼈다.","그들은 역사 시간에 빠진 부분을 배웠다고 느꼈다.","잃어버렸던 역사의 한 부분이 마침내 돌아온 것 같았다."],"r":{"ev":"10~11번 문장","w":"10번에서 스코틀랜드 사람들이 행복했고, 11번은 그 이유. 오래 빼앗겼던 돌이 돌아와서 역사의 빠진 조각이 돌아온 느낌이라는 뜻.","c":4,"s":[[10,"The Scottish people were happy.","스코틀랜드 사람들은 행복했다."],[11,"They felt like a missing part of their history was finally back!","그들은 자신들의 역사 중 잃어버린 부분이 마침내 돌아온 것처럼 느꼈다!"]],"a":"4) 잃어버렸던 역사의 한 부분이 마침내 돌아온 것 같았다."},"h":"0028f729e0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["스코틀랜드 사람들은 돌을 되찾고 싶어 하지 않았다.","스코틀랜드 사람들은 오랫동안 그 돌을 되찾기를 원했다.","돌은 처음부터 영국 왕들을 위해 사용되었다.","돌은 현재 영국 런던에 있다."],"opts":["The Scottish people did not want the stone back.","The Scottish people wanted the stone back for a long time.","The stone was used for English kings from the beginning.","The stone is now in London, England."],"r":{"ev":"8번 문장","w":"8번 문장에서 스코틀랜드 사람들은 오랫동안 돌을 되찾기를 원했다고 함.","c":2,"s":[[8,"So, the Scottish people wanted the Stone of Destiny back for a long time.","그래서, 스코틀랜드 사람들은 오랫동안 운명의 돌을 되찾기를 원했다."]],"a":"2) The Scottish people wanted the stone back for a long time. (스코틀랜드 사람들은 오랫동안 그 돌을 되찾기를 원했다.)"},"h":"15161743fe"},{"n":9,"t":"sum","q":"Now, you can (A) the stone at (B) Castle in Scotland.","ko":"이제 여러분은 스코틀랜드의 (B) 성에서 그 돌을 (A) 수 있다.","oko":["(A) 볼 / (B) 윈저","(A) 팔 / (B) 에든버러","(A) 볼 / (B) 에든버러","(A) 가져갈 / (B) 에든버러","(A) 숨길 / (B) 에든버러"],"opts":["(A) see / (B) Windsor","(A) sell / (B) Edinburgh","(A) see / (B) Edinburgh","(A) take / (B) Edinburgh","(A) hide / (B) Edinburgh"],"r":{"ev":"12번 문장","w":"12번 문장에서 스코틀랜드의 에든버러 성에서 돌을 볼 수 있다고 함.","c":3,"s":[[12,"Now, you can see the stone at Edinburgh Castle in Scotland.","이제, 여러분은 스코틀랜드의 에든버러 성에서 그 돌을 볼 수 있다."]],"a":"3) (A) see / (B) Edinburgh ((A) 볼 / (B) 에든버러)"},"h":"ee80fde05d"},{"n":10,"t":"fill","q":"For many years, this stone played an important [A] in the [B] for new kings and queens of the U.K.","ko":"수년간, 이 돌은 영국의 새로운 왕과 여왕을 위한 [B]에서 중요한 [A]을(를) 했다.","bank":["role","ceremonies","castle","kilograms","history","government"],"bko":{"role":"역할","ceremonies":"의식(복수형)","castle":"성","kilograms":"킬로그램","history":"역사","government":"정부"},"r":{"a":"[A] role (역할), [B] ceremonies (의식(복수형))","ev":"3번 문장","w":"3번 문장: played an important role in the ceremonies.","c":null,"s":[[3,"For many years, this stone played an important role in the ceremonies for new kings and queens of the U.K.","수년간, 이 돌은 영국의 새로운 왕과 여왕을 위한 의식에서 중요한 역할을 했다."]]},"h":"eb671b3aa1"}]},{"u":8,"id":"rg2-08-1","no":1,"ko":"방학에 새로운 도전? 음식을 구하는 자원봉사","items":[{"n":1,"t":"tf","q":"412 Food Rescue gives the food to people who really need it.","ko":"412 Food Rescue는 그 음식을 정말로 필요로 하는 사람들에게 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","w":"8번 문장 Then, we give this food to people who really need it. 모은 음식을 필요한 사람들에게 전해 준다.","c":"T","s":[[8,"Then, we give this food to people who really need it.","그 후, 우리는 이 음식을 정말로 필요로 하는 사람들에게 전해 줘요."]]},"h":"f43a9541ea"},{"n":2,"t":"tf","q":"412 Food Rescue collects leftover food only from farms.","ko":"412 Food Rescue는 오직 농장에서만 남은 음식을 수거한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번 문장에서 stores, restaurants, and farms 같은 곳(places like)에서 모은다고 함. 농장 하나만이 아니라 가게, 식당, 농장 모두.","c":"F","s":[[7,"At 412 Food Rescue, we collect leftover food from places like stores, restaurants, and farms.","412 Food Rescue에서 우리는 가게, 식당, 그리고 농장과 같은 곳에서 남은 음식을 수거해요."]]},"h":"54d29911b0"},{"n":3,"t":"tf","q":"412 Food Rescue is a group of people working together to prevent food waste.","ko":"412 Food Rescue는 음식물 쓰레기를 막기 위해 함께 일하는 사람들의 단체이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","w":"5번 문장 We’re a group of people working together to prevent food waste. 그대로 나옴.","c":"T","s":[[5,"We’re a group of people working together to prevent food waste.","우리는 음식물 쓰레기를 막기 위해 함께 일하는 한 단체의 사람들이에요."]]},"h":"af2407dd3b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...working together to prevent food waste.)","ko":"(음식물 쓰레기를 ... 위해 함께 일하는)","opts":["막다","만들다","팔다","모으다"],"word":"prevent","r":{"ev":"5번 문장","w":"5번에서 음식물 쓰레기(food waste)를 prevent하려고 일하는 단체. 쓰레기가 생기지 않게 막는다는 뜻이므로 prevent = 막다, 예방하다. 모으다(collect)는 7번의 다른 단어.","c":1,"s":[[5,"We’re a group of people working together to prevent food waste.","우리는 음식물 쓰레기를 막기 위해 함께 일하는 한 단체의 사람들이에요."]],"a":"1) 막다"},"h":"71739a3a72"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...we collect leftover food from places like stores, restaurants, and farms.)","ko":"(... 가게, 식당, 농장 같은 곳에서 ... 음식을 수거한다.)","opts":["신선한","남은","비싼","맛있는"],"word":"leftover","r":{"ev":"7번 문장","w":"7번에서 가게·식당·농장에서 모으는 음식이고, 8번에서 필요한 사람에게 전해 줌. 먹고 남거나 팔고 남은 음식이라는 뜻이므로 leftover = 남은.","c":2,"s":[[7,"At 412 Food Rescue, we collect leftover food from places like stores, restaurants, and farms.","412 Food Rescue에서 우리는 가게, 식당, 그리고 농장과 같은 곳에서 남은 음식을 수거해요."]],"a":"2) 남은"},"h":"d97f5f7308"},{"n":6,"t":"ref","q":"What does the underlined \"so\" refer to?\nIf so, 412 Food Rescue is the right place for you!","ko":"밑줄 친 \"so\"가 가리키는 것은?","sko":"만약 그렇다면, 412 Food Rescue는 여러분에게 딱 맞는 곳이에요!","opts":["음식을 팔아 돈을 벌고 싶다면","다른 사람들을 돕는 데 관심이 있고 새로운 것을 시도하고 싶다면","농장에서 일해 보고 싶다면","배가 고프다면"],"r":{"ev":"2~4번 문장","w":"2~3번에서 다른 사람을 돕는 데 관심이 있는지, 방학에 새로운 것을 해 보고 싶은지 물었고, 4번 If so가 그 질문들을 받음.","c":2,"s":[[2,"Are you interested in helping other people?","여러분은 다른 사람들을 돕는 것에 관심이 있나요?"],[3,"Do you want to try something new during your summer vacation?","여름 방학 동안 무언가 새로운 것을 시도해 보고 싶으신가요?"],[4,"If so, 412 Food Rescue is the right place for you!","만약 그렇다면, 412 Food Rescue는 여러분에게 딱 맞는 곳이에요!"]],"a":"2) 다른 사람들을 돕는 데 관심이 있고 새로운 것을 시도하고 싶다면","k":"so = 다른 사람들을 돕는 데 관심이 있고 새로운 것을 시도하고 싶다면"},"pron":"so","h":"fcf41c2d40"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Our goal is to make sure food goes to people who are hungry.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리의 목표는 배고픈 사람들에게 음식이 제대로 전달되게 하는 것이죠.","opts":["우리의 목표는 배고픈 사람들에게 음식을 파는 것이다.","우리의 목표는 음식을 더 맛있게 만드는 것이다.","우리의 목표는 음식이 배고픈 사람들에게 확실히 전달되게 하는 것이다.","우리의 목표는 배고픈 사람들이 직접 음식을 만들게 하는 것이다."],"r":{"ev":"6번 문장","w":"make sure는 ‘확실히 ~하게 하다’. 음식이 배고픈 사람들에게 꼭 가게 하는 것이 목표. 음식을 판다거나 맛있게 만든다는 말은 본문에 없음.","c":3,"s":[[6,"Our goal is to make sure food goes to people who are hungry.","우리의 목표는 배고픈 사람들에게 음식이 제대로 전달되게 하는 것이죠."]],"a":"3) 우리의 목표는 음식이 배고픈 사람들에게 확실히 전달되게 하는 것이다."},"h":"6bbb65d2ba"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["412 Food Rescue는 남은 음식을 가게와 농장에 나눠 준다.","사람들은 412 Food Rescue에서 도움이 필요한 사람들을 도울 수 있다.","412 Food Rescue는 남은 음식을 사람들에게 판다.","일꾼들은 배고픈 사람들을 위해 음식을 요리한다."],"opts":["412 Food Rescue gives leftover food to stores and farms.","People can help others in need at 412 Food Rescue.","412 Food Rescue sells leftover food to people.","Workers cook the food for hungry people."],"r":{"ev":"12번 문장","w":"12번 문장: 도움이 필요한 사람들을 도울 수 있다.","c":2,"s":[[12,"You will also be able to help people in need!","여러분도 도움이 필요한 사람들을 도울 수 있을 거예요!"]],"a":"2) People can help others in need at 412 Food Rescue. (사람들은 412 Food Rescue에서 도움이 필요한 사람들을 도울 수 있다.)"},"h":"41ae57e4bc"},{"n":9,"t":"sum","q":"412 Food Rescue needs (A) to do its work, so it asks people to (B) and join the group.","ko":"412 Food Rescue는 일을 하려면 (A)이(가) 필요해서, 사람들에게 (B) 함께해 달라고 한다.","oko":["(A) 돈 / (B) 와서","(A) 가게들 / (B) 와서","(A) 자원봉사자들 / (B) 와서","(A) 자원봉사자들 / (B) 떠나","(A) 자원봉사자들 / (B) 기다려"],"opts":["(A) money / (B) come","(A) stores / (B) come","(A) volunteers / (B) come","(A) volunteers / (B) leave","(A) volunteers / (B) wait"],"r":{"ev":"9번, 11번 문장","w":"9번에서 자원봉사자들 없이는 일을 할 수 없다고 하고, 11번에서 와서 함께하라고 함.","c":3,"s":[[9,"But without our amazing volunteers, we can’t do this work.","하지만 우리의 놀라운 자원봉사자들 없이는, 우리는 이 일을 할 수 없어요."],[11,"So come and join 412 Food Rescue.","그러니 412 Food Rescue에 와서 함께해 보세요."]],"a":"3) (A) volunteers / (B) come ((A) 자원봉사자들 / (B) 와서)"},"h":"92caa892eb"},{"n":10,"t":"fill","q":"Join us in the [A] against [B]!","ko":"[B]에 맞선 [A]에 우리와 함께해 보세요!","bank":["fight","hunger","summer","stores","farms","leftover"],"bko":{"fight":"싸움","hunger":"굶주림","summer":"여름","stores":"가게들","farms":"농장들","leftover":"남은"},"r":{"a":"[A] fight (싸움), [B] hunger (굶주림)","ev":"1번 문장","w":"1번 문장: Join us in the fight against hunger!","c":null,"s":[[1,"Join us in the fight against hunger!","굶주림과의 싸움에 우리와 함께해 보세요!"]]},"h":"273df77ccc"}]},{"u":8,"id":"rg2-08-2","no":2,"ko":"하늘에서 초콜릿 눈이? 스위스 마을의 달콤한 사건","items":[{"n":1,"t":"tf","q":"Cocoa powder began to fall from the sky like snow in Olten.","ko":"코코아 가루가 Olten에서 눈처럼 하늘에서 떨어지기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에서 Cocoa powder began to fall from the sky like snow라고 나옴. 떨어진 것은 진짜 눈이 아니라 코코아 가루.","c":"T","s":[[2,"Cocoa powder — the main ingredient in chocolate — began to fall from the sky like snow!","초콜릿의 주재료인 코코아 가루가 눈처럼 하늘에서 떨어지기 시작한 것이다!"]]},"h":"937ae72343"},{"n":2,"t":"tf","q":"The factory said that the chocolate snow was very harmful.","ko":"공장은 초콜릿 눈이 매우 해롭다고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","w":"8번 문장에서 공장은 this chocolate snow wasn’t harmful at all(전혀 해롭지 않다)이라고 말함. 해롭다는 것과 반대.","c":"F","s":[[8,"The factory told everyone that this chocolate snow wasn’t harmful at all.","그 공장은 모두에게 이 초콜릿 눈은 전혀 해롭지 않다고 말했다."]]},"h":"e48b166df8"},{"n":3,"t":"tf","q":"A strong wind helped spread the cocoa powder all over the town.","ko":"강한 바람이 코코아 가루를 마을 곳곳에 퍼뜨리는 것을 도왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","w":"6번 문장 a strong wind was blowing, so it spread the cocoa powder all over the town. 바람 때문에 마을 곳곳으로 퍼짐.","c":"T","s":[[6,"On that day, a strong wind was blowing, so it spread the cocoa powder all over the town.","그날, 강한 바람이 불고 있었기에 그것이 마을 곳곳에 코코아 가루를 퍼뜨렸다."]]},"h":"dab12beb48"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...a strong wind was blowing, so it spread the cocoa powder all over the town.)","ko":"(... 강한 바람이 불고 있어서 그것이 코코아 가루를 마을 곳곳에 ... .)","opts":["퍼뜨렸다","모았다","먹었다","숨겼다"],"word":"spread","r":{"ev":"6번 문장","w":"6번에서 바람이 코코아 가루를 all over the town(마을 곳곳)에 날렸다는 내용. 그 결과 7번처럼 자동차·집·거리가 뒤덮임. spread = 퍼뜨리다.","c":1,"s":[[6,"On that day, a strong wind was blowing, so it spread the cocoa powder all over the town.","그날, 강한 바람이 불고 있었기에 그것이 마을 곳곳에 코코아 가루를 퍼뜨렸다."]],"a":"1) 퍼뜨렸다"},"h":"18c0e9f22b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The factory told everyone that this chocolate snow wasn’t harmful at all.)","ko":"(그 공장은 이 초콜릿 눈이 전혀 ...하지 않다고 모두에게 말했다.)","opts":["즐거운","해로운","맛있는","시끄러운"],"word":"harmful","r":{"ev":"8번 문장","w":"8번에서 공장이 사람들을 안심시키려 한 말. 초콜릿 눈이 wasn’t harmful at all = 몸에 해롭지 않다. harmful = 해로운.","c":2,"s":[[8,"The factory told everyone that this chocolate snow wasn’t harmful at all.","그 공장은 모두에게 이 초콜릿 눈은 전혀 해롭지 않다고 말했다."]],"a":"2) 해로운"},"h":"d862d89622"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat’s why cocoa flew out of the factory into the sky.","ko":"밑줄 친 That이 가리키는 것은?","sko":"그것이 코코아가 공장 밖으로 나와 하늘로 날아가게 된 이유이다.","opts":["마을에 눈이 내린 것","강한 바람이 분 것","공장의 공기 시스템에 문제가 있었던 것","마을 사람들이 이 일을 좋아한 것"],"r":{"ev":"4~5번 문장","w":"That’s why 앞에는 원인이 온다. 바로 앞 4번 The factory had a problem with its air system이 코코아가 하늘로 날아간 이유.","c":3,"s":[[4,"The factory had a problem with its air system.","그 공장은 공기 시스템에 문제가 있었다."],[5,"That’s why cocoa flew out of the factory into the sky.","그것이 코코아가 공장 밖으로 나와 하늘로 날아가게 된 이유이다."]],"a":"3) 공장의 공기 시스템에 문제가 있었던 것"},"pron":"That","h":"79a596ef0a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They fixed the air system and offered to clean up the cocoa powder.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 공기 시스템을 수리했고 코코아 가루를 청소해 주겠다고 했다.","opts":["그들은 공기 시스템을 고치지 않고 코코아 가루를 그대로 두었다.","그들은 공기 시스템을 고쳤지만, 코코아 가루는 치우지 않겠다고 했다.","그들은 코코아 가루만 치우고 공기 시스템은 고치지 않았다.","그들은 공기 시스템을 고쳤고, 코코아 가루를 청소해 주겠다고 제안했다."],"r":{"ev":"9번 문장","w":"fixed는 고쳤다, offered to clean up은 청소해 주겠다고 제안했다는 뜻. 두 가지를 모두 한 것이 정답이고 나머지는 하나를 빼먹거나 반대로 말함.","c":4,"s":[[9,"They fixed the air system and offered to clean up the cocoa powder.","그들은 공기 시스템을 수리했고 코코아 가루를 청소해 주겠다고 했다."]],"a":"4) 그들은 공기 시스템을 고쳤고, 코코아 가루를 청소해 주겠다고 제안했다."},"h":"2a72933fb5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["공장은 초콜릿 눈이 해롭다고 경고했다.","자동차, 집, 거리가 코코아 가루로 뒤덮였다.","비가 와서 코코아 가루가 마을 곳곳에 퍼졌다.","마을 사람들은 초콜릿 눈에 화를 냈다."],"opts":["The factory warned that the chocolate snow was harmful.","Cars, houses, and streets were covered in cocoa powder.","Rain spread the cocoa powder all over the town.","The people in the town were angry about the chocolate snow."],"r":{"ev":"7번 문장","w":"7번 문장: 자동차, 집, 거리가 모두 코코아 가루로 뒤덮임.","c":2,"s":[[7,"Cars, houses, and streets all got covered in cocoa powder.","자동차, 집, 그리고 거리들이 모두 코코아 가루로 뒤덮였다."]],"a":"2) Cars, houses, and streets were covered in cocoa powder. (자동차, 집, 거리가 코코아 가루로 뒤덮였다.)"},"h":"6a23b7d137"},{"n":9,"t":"sum","q":"Something (A) happened in the town of Olten when cocoa powder fell from the sky, and the people there (B) it.","ko":"코코아 가루가 하늘에서 떨어졌을 때 Olten 마을에서 (A) 일이 일어났고, 그곳 사람들은 그것을 (B).","oko":["(A) 재미있는 / (B) 아주 좋아했다","(A) 슬픈 / (B) 아주 좋아했다","(A) 재미있는 / (B) 싫어했다","(A) 지루한 / (B) 아주 좋아했다","(A) 재미있는 / (B) 무서워했다"],"opts":["(A) funny / (B) loved","(A) sad / (B) loved","(A) funny / (B) hated","(A) boring / (B) loved","(A) funny / (B) feared"],"r":{"ev":"1번, 10번 문장","w":"1번에서 재미있는 일이 일어났다고 하고, 10번에서 마을 사람들이 이 일을 매우 좋아했다고 함.","c":1,"s":[[1,"One day, something funny happened in the town of Olten, Switzerland.","어느 날, 스위스의 Olten이라는 마을에서 재미있는 일이 일어났다."],[10,"But the people in the town loved this happening.","그러나 마을 사람들은 이 일을 매우 좋아했다."]],"a":"1) (A) funny / (B) loved ((A) 재미있는 / (B) 아주 좋아했다)"},"h":"f0c5f715b1"},{"n":10,"t":"fill","q":"One person even said, “Chocolate [A] falling from the sky! Dreams come [B]!”","ko":"한 사람은 심지어 “하늘에서 떨어지는 초콜릿 [A]! 꿈이 [B] 이루어지네요!”라고 말했다.","bank":["snowflakes","true","harmful","fixed","happening","strong"],"bko":{"snowflakes":"눈송이","true":"진짜로","harmful":"해로운","fixed":"고쳤다(fix의 과거)","happening":"일어난 일","strong":"강한"},"r":{"a":"[A] snowflakes (눈송이), [B] true (진짜로)","ev":"11번 문장","w":"11번 문장: Chocolate snowflakes falling from the sky! Dreams come true!","c":null,"s":[[11,"One person even said, “Chocolate snowflakes falling from the sky! Dreams come true!”","한 사람은 심지어 “하늘에서 떨어지는 초콜릿 눈송이라니! 꿈은 이루어지네요!”라고 말했다."]]},"h":"119917e679"}]},{"u":8,"id":"rg2-08-3","no":3,"ko":"달에만 있는 줄 알았다고? 지구의 숨은 구덩이","items":[{"n":1,"t":"tf","q":"The Earth has a thick atmosphere that protects it from space rocks.","ko":"지구는 운석으로부터 지구를 보호해 주는 두꺼운 대기를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장 The Earth has a thick atmosphere that protects it from space rocks. 그대로 나옴.","c":"T","s":[[3,"The Earth has a thick atmosphere that protects it from space rocks.","지구는 운석으로부터 스스로를 보호해 주는 두꺼운 대기를 가지고 있다."]]},"h":"f0759c6d46"},{"n":2,"t":"tf","q":"The Moon has weather and plants that help erase craters.","ko":"달에는 구덩이를 지우는 것을 돕는 날씨와 식물이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","w":"6번에서 구덩이를 지우는 것은 지구의 비·바람·식물이고, 7번에서 달에는 날씨나 식물이 없다(doesn’t have weather or plants)고 함.","c":"F","s":[[6,"Additionally, on Earth, things like rain, wind, and even plants help to slowly erase craters.","게다가, 지구에서는 비, 바람, 그리고 심지어 식물과 같은 것들이 운석 구덩이를 서서히 지우는 것을 돕는다."],[7,"But the Moon doesn’t have weather or plants.","하지만 달에는 날씨나 식물이 존재하지 않는다."]]},"h":"9888f357ce"},{"n":3,"t":"tf","q":"In 2022, scientists found huge craters in Wyoming, U.S.","ko":"2022년에 과학자들은 미국 와이오밍주에서 거대한 운석 구덩이들을 찾았다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","w":"9번 문장 In 2022, scientists found huge craters in Wyoming, U.S. 그대로 나옴.","c":"T","s":[[9,"In 2022, scientists found huge craters in Wyoming, U.S.","2022년에 과학자들은 미국 와이오밍주에서 거대한 운석 구덩이들을 찾았다."]]},"h":"a30a457351"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...things like rain, wind, and even plants help to slowly erase craters.)","ko":"(... 비, 바람, 심지어 식물이 구덩이를 서서히 ... 것을 돕는다.)","opts":["지우다","만들다","던지다","세다"],"word":"erase","r":{"ev":"6~7번 문장","w":"6번에서 지구에는 비·바람·식물이 있어 구덩이가 서서히 없어지고, 7번에서 달에는 그런 것이 없어서 구덩이가 남음(8번). erase = 지우다, 없애다.","c":1,"s":[[6,"Additionally, on Earth, things like rain, wind, and even plants help to slowly erase craters.","게다가, 지구에서는 비, 바람, 그리고 심지어 식물과 같은 것들이 운석 구덩이를 서서히 지우는 것을 돕는다."],[7,"But the Moon doesn’t have weather or plants.","하지만 달에는 날씨나 식물이 존재하지 않는다."]],"a":"1) 지우다"},"h":"ec49ef6668"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The Earth has a thick atmosphere that protects it from space rocks.)","ko":"(지구는 운석으로부터 지구를 보호하는 두꺼운 ...를 가지고 있다.)","opts":["바다","대기","화산","공룡"],"word":"atmosphere","r":{"ev":"3~4번 문장","w":"3번에서 지구는 atmosphere 덕분에 운석에서 보호되고, 4번에서 달에는 atmosphere가 없어 운석이 더 자주 부딪힘(5번). 지구를 둘러싼 공기층 = 대기.","c":2,"s":[[3,"The Earth has a thick atmosphere that protects it from space rocks.","지구는 운석으로부터 스스로를 보호해 주는 두꺼운 대기를 가지고 있다."],[4,"The Moon, on the other hand, doesn’t have an atmosphere.","반면에, 달에는 대기가 없다."]],"a":"2) 대기"},"h":"6e30eb996a"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis means space rocks can hit the Moon more often.","ko":"밑줄 친 \"This\"가 가리키는 것은?","sko":"이는 운석들이 달에 더 자주 충돌할 수 있다는 것을 의미한다.","opts":["지구에 두꺼운 대기가 있다는 것","달에 날씨가 있다는 것","운석이 지구에 떨어진 것","달에는 대기가 없다는 것"],"r":{"ev":"4~5번 문장","w":"5번 This는 바로 앞 4번의 내용(달에는 대기가 없다)을 가리킴. 대기가 없으니 운석을 막아 주지 못해 더 자주 부딪힌다는 흐름.","c":4,"s":[[4,"The Moon, on the other hand, doesn’t have an atmosphere.","반면에, 달에는 대기가 없다."],[5,"This means space rocks can hit the Moon more often.","이는 운석들이 달에 더 자주 충돌할 수 있다는 것을 의미한다."]],"a":"4) 달에는 대기가 없다는 것"},"h":"42a10ce2a2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When a space rock makes a crater, it stays there for a very long time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"운석 하나가 운석 구덩이를 만들면, 그것은 아주 오랜 시간 동안 그곳에 그대로 있다.","opts":["운석이 구덩이를 만들면, 그 운석은 곧바로 사라진다.","운석이 구덩이를 만들면, 구덩이는 오래지 않아 지워진다.","운석이 구덩이를 만들면, 그 구덩이는 아주 오랫동안 그대로 남아 있다.","운석이 구덩이를 만들면, 구덩이는 점점 더 커진다."],"r":{"ev":"7~8번 문장","w":"7번에서 달에는 날씨나 식물이 없다고 했고, 8번은 그 결과: 구덩이가 아주 오래 남아 있다(stays there for a very long time, stay = 그대로 있다). 지워지거나 커진다는 말은 없음.","c":3,"s":[[7,"But the Moon doesn’t have weather or plants.","하지만 달에는 날씨나 식물이 존재하지 않는다."],[8,"When a space rock makes a crater, it stays there for a very long time.","운석 하나가 운석 구덩이를 만들면, 그것은 아주 오랜 시간 동안 그곳에 그대로 있다."]],"a":"3) 운석이 구덩이를 만들면, 그 구덩이는 아주 오랫동안 그대로 남아 있다."},"h":"bd74ac1311"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["와이오밍의 구덩이들은 매우 젊다.","달의 구덩이들은 비와 바람에 의해 지워진다.","달과 지구에는 모두 운석 구덩이가 있다.","구덩이는 달에만 있고 지구에는 없다."],"opts":["The craters in Wyoming are very young.","Craters on the Moon are erased by rain and wind.","Both the Moon and the Earth have craters.","Only the Moon has craters."],"r":{"ev":"1번 문장","w":"1번 문장: 지구에도 운석 구덩이가 있다.","c":3,"s":[[1,"Some people may believe that only the Moon has craters, but actually, the Earth has them as well.","몇몇 사람들은 달에만 운석 구덩이들이 있다고 믿을지도 모르지만, 사실 지구에도 있다."]],"a":"3) Both the Moon and the Earth have craters. (달과 지구에는 모두 운석 구덩이가 있다.)"},"h":"44e374a079"},{"n":9,"t":"sum","q":"On Earth, craters usually (A) because the ground (B) a lot, so finding old craters is amazing.","ko":"지구에서는 땅이 많이 (B) 때문에 운석 구덩이가 보통 (A). 그래서 오래된 구덩이를 찾는 것은 정말 놀랍다.","ok ale blows snot out into the air, SnotBot is there to collect it.","고래가 공기 중으로 콧물을 내뿜을 때, SnotBot은 그것을 수집하기 위해 그곳에 있다."],[5,"The snot helps scientists learn about the whale’s health.","콧물은 과학자들이 고래의 건강에 대해 알아보는 데 도움이 된다."]],"a":"2) 수집하다"},"h":"d51e9d8de1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...monkeys hidden deep in the jungle.)","ko":"(정글 속 깊은 곳에 ... 원숭이들)","opts":["큰","화난","숨어 있는","빠른"],"word":"hidden","r":{"ev":"7~8번 문장","w":"7번 monkeys hidden deep in the jungle, 8번에서 그래서 원숭이를 찾기 어려웠음(드론 덕에 쉬워짐). hidden = 숨겨진, 숨어 있는.","c":3,"s":[[7,"It takes pictures of monkeys hidden deep in the jungle.","그것은 정글 속 깊은 곳에 숨어 있는 원숭이들의 사진을 찍는다."],[8,"This makes finding these monkeys much easier for scientists.","이는 과학자들이 이 원숭이들을 찾는 것을 훨씬 더 쉽게 해 준다."]],"a":"3) 숨어 있는"},"h":"edd57cc922"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are important helpers to save animals that might disappear from our planet.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 지구에서 사라질지도 모르는 동물들을 구하는 중요한 조력자들이다.","opts":["드론들","사라질지도 모르는 동물들","과학자들","원숭이들"],"r":{"ev":"11~12번 문장","w":"11번에서 drones를 말하고, 12번 They는 그 드론들.","c":1,"s":[[11,"As you see, drones are not just for fun.","여러분이 보다시피, 드론은 재미를 위한 것만은 아니다."],[12,"They are important helpers to save animals that might disappear from our planet.","그것들은 지구에서 사라질지도 모르는 동물들을 구하는 중요한 조력자들이다."]],"a":"1) 드론들","k":"They = 드론들"},"pron":"They","h":"808f5860f5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This drone helps us know how many penguins are left there.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 드론은 우리에게 얼마나 많은 펭귄이 남아 있는지 알게 해 준다.","opts":["이 드론은 그곳에 펭귄이 몇 마리 남아 있는지 알게 도와준다.","이 드론은 펭귄들이 그곳을 떠나도록 도와준다.","이 드론은 펭귄에게 먹이를 얼마나 줄지 알려 준다.","이 드론은 펭귄이 몇 살인지 알려 준다."],"r":{"ev":"9~10번 문장","w":"how many penguins are left there는 ‘그곳에 펭귄이 몇 마리 남아 있는지’. 9번에서 드론이 펭귄 수를 세고 있으니, 그 결과 남은 수를 알게 되는 것. 떠나게 하거나 먹이·나이는 본문에 없음.","c":1,"s":[[9,"Far away in the South Atlantic, a different drone is busy counting the number of penguins.","남대서양의 멀리 떨어진 곳에서, 다른 드론은 펭귄의 수를 세느라 바쁘다."],[10,"This drone helps us know how many penguins are left there.","이 드론은 우리에게 얼마나 많은 펭귄이 남아 있는지 알게 해 준다."]],"a":"1) 이 드론은 그곳에 펭귄이 몇 마리 남아 있는지 알게 도와준다."},"h":"5c07af0b2a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["SnotBot은 원숭이 사진을 찍는 드론이다.","남대서양의 드론은 고래의 수를 센다.","콧물은 과학자들이 고래의 건강에 대해 알아보는 데 도움이 된다.","드론은 바다에서만 사용된다."],"opts":["SnotBot takes pictures of monkeys.","The drone in the South Atlantic counts whales.","Snot helps scientists learn about a whale’s health.","Drones are only used in the ocean."],"r":{"ev":"5번 문장","w":"5번 문장: 콧물은 과학자들이 고래의 건강에 대해 알아보는 데 도움이 된다.","c":3,"s":[[5,"The snot helps scientists learn about the whale’s health.","콧물은 과학자들이 고래의 건강에 대해 알아보는 데 도움이 된다."]],"a":"3) Snot helps scientists learn about a whale’s health. (콧물은 과학자들이 고래의 건강에 대해 알아보는 데 도움이 된다.)"},"h":"7790d89024"},{"n":9,"t":"sum","q":"Drones are amazing flying (A) that help us protect animals, and they make finding monkeys in the jungle much (B).","ko":"드론은 우리가 동물을 보호하도록 돕는 놀라운 비행 (A)이며, 정글에서 원숭이를 찾는 것을 훨씬 (B) 만들어 준다.","oko":["(A) 로봇들 / (B) 쉽게","(A) 로봇들 / (B) 어렵게","(A) 사진들 / (B) 쉽게","(A) 동물들 / (B) 쉽게","(A) 로봇들 / (B) 느리게"],"opts":["(A) robots / (B) easier","(A) robots / (B) harder","(A) pictures / (B) easier","(A) animals / (B) easier","(A) robots / (B) slower"],"r":{"ev":"1번, 8번 문장","w":"1번에서 드론은 놀라운 비행 로봇, 8번에서 원숭이 찾기가 훨씬 쉬워짐.","c":1,"s":[[1,"Drones are amazing flying robots that are helping us protect endangered animals.","드론은 우리가 멸종 위기에 처한 동물들을 보호하도록 도와주는 놀라운 비행 로봇이다."],[8,"This makes finding these monkeys much easier for scientists.","이는 과학자들이 이 원숭이들을 찾는 것을 훨씬 더 쉽게 해 준다."]],"a":"1) (A) robots / (B) easier ((A) 로봇들 / (B) 쉽게)"},"h":"e792f863a8"},{"n":10,"t":"fill","q":"As you [A], drones are not just for [B].","ko":"[A], 드론은 [B]을(를) 위한 것만은 아니다.","bank":["see","fun","snot","jungle","left","number"],"bko":{"see":"여러분이 보다시피","fun":"재미","snot":"콧물","jungle":"정글","left":"남은","number":"수"},"r":{"a":"[A] see (여러분이 보다시피), [B] fun (재미)","ev":"11번 문장","w":"11번 문장: As you see, drones are not just for fun.","c":null,"s":[[11,"As you see, drones are not just for fun.","여러분이 보다시피, 드론은 재미를 위한 것만은 아니다."]]},"h":"1c23f7641f"}]},{"u":10,"id":"rg2-10-1","no":1,"ko":"아기 때만 많은 지방, 몸을 따뜻하게 하는 갈색 지방","items":[{"n":1,"t":"tf","q":"Brown fat is usually found in newborn babies’ necks and shoulders.","ko":"갈색 지방은 보통 신생아의 목과 어깨에서 발견된다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It’s usually found in newborn babies’ necks and shoulders.","그것은 보통 신생아의 목과 어깨에서 발견된다."]],"w":"4번 문장에 It’s usually found in newborn babies’ necks and shoulders라고 나옴. It은 3번의 갈색 지방이라 T.","c":"T"},"h":"5dd3e4f539"},{"n":2,"t":"tf","q":"As we grow up, we lose most of our white fat and gain more brown fat.","ko":"우리는 자라면서 흰색 지방의 대부분을 잃고 갈색 지방을 더 많이 얻는다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"As we grow up, we lose most of our brown fat and gain more white fat instead.","우리는 자라는 동안, 갈색 지방의 대부분을 잃고 대신 흰색 지방을 더 많이 얻게 된다."]],"w":"6번에서는 자라면서 갈색 지방(brown fat)의 대부분을 잃고 흰색 지방(white fat)을 더 얻는다고 함. 두 지방이 서로 바뀐 진술이라 F. lose는 ‘잃다’, gain은 ‘얻다’.","c":"F"},"h":"eb899287b4"},{"n":3,"t":"tf","q":"Brown fat keeps our body warm because it burns lots of calories.","ko":"갈색 지방은 열량을 많이 태우기 때문에 우리 몸을 따뜻하게 유지해 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Brown fat is important for our body because it burns lots of calories and keeps us warm.","갈색 지방은 열량을 많이 태우고 우리를 따뜻하게 유지해 주기 때문에 우리 몸에 중요하다."]],"w":"5번에서 갈색 지방이 열량을 많이 태우고(burns lots of calories) 우리를 따뜻하게 유지해 준다(keeps us warm)고 함. burns는 burn(태우다)의 형태. T.","c":"T"},"h":"08d71776cf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But scientists found a way to increase brown fat in the body.)","ko":"하지만 과학자들은 몸속의 갈색 지방을 ‘늘리는’ 방법을 찾았다.","opts":["줄이다","늘리다, 증가시키다","없애다","바꾸다"],"word":"increase","r":{"a":"2) 늘리다, 증가시키다","ev":"7~8번 문장","s":[[7,"This can sometimes cause problems for our health.","이는 때때로 우리의 건강에 문제를 일으킬 수 있다."],[8,"But scientists found a way to increase brown fat in the body.","하지만 과학자들은 몸속의 갈색 지방을 늘리는 방법을 찾아냈다."]],"w":"7번에서 자라면서 갈색 지방이 줄어들어 문제가 생긴다고 했고, 8번 But 뒤에서 그 갈색 지방을 ‘늘리는’ 방법을 찾았음. 그래서 increase는 늘리다. found는 find(찾다)의 과거형.","c":2},"h":"18fd3b4547"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (With this information, the scientists hope to develop a similar medicine for humans.)","ko":"이 정보를 가지고, 과학자들은 사람을 위해 ‘비슷한’ 약을 개발하기를 바란다.","opts":["위험한","다른","비슷한","값비싼"],"word":"similar","r":{"a":"3) 비슷한","ev":"9~11번 문장","s":[[9,"They did an experiment on fat sheep by injecting them with brown fat.","그들은 살찐 양에게 갈색 지방을 주입하는 실험을 했다."],[10,"It helped the sheep to lose weight and become healthier.","그것은 양이 체중을 줄이고 더 건강해지도록 도와주었다."],[11,"With this information, the scientists hope to develop a similar medicine for humans.","이 정보를 가지고, 과학자들은 사람들을 위해 비슷한 약을 개발하기를 바란다."]],"w":"9~10번에서 양에게 갈색 지방을 주입하자 체중이 줄고 건강해졌음. 11번은 이 정보로 사람에게도 ‘비슷한’ 약을 만들고 싶다는 것. similar는 비슷한(the same처럼 닮은). 다른(different)과는 반대.","c":3},"h":"ad1735677b"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt helped the sheep to lose weight and become healthier.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 양이 체중을 줄이고 더 건강해지도록 도와주었다.","opts":["양에게 갈색 지방을 주입한 것","신생아의 목과 어깨","흰색 지방이 늘어나는 것","사람을 위해 개발할 약"],"r":{"a":"1) 양에게 갈색 지방을 주입한 것","ev":"9~10번 문장","s":[[9,"They did an experiment on fat sheep by injecting them with brown fat.","그들은 살찐 양에게 갈색 지방을 주입하는 실험을 했다."],[10,"It helped the sheep to lose weight and become healthier.","그것은 양이 체중을 줄이고 더 건강해지도록 도와주었다."]],"w":"10번의 It helped the sheep… 바로 앞 9번에서 살찐 양에게 갈색 지방을 주입하는 실험을 했음. 그렇게 갈색 지방을 주입한 것이 양이 체중을 줄이고 더 건강해지게 도왔다는 말. 약은 11번에서 앞으로 개발하길 바라는 것이라 아직 아님. helped는 help(돕다)의 과거형.","c":1,"k":"It = 양에게 갈색 지방을 주입한 것"},"h":"5a17014435"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the future, this could help people with weight problems and diabetes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"미래에, 이것이 체중 문제나 당뇨병을 가진 사람들을 도와줄 수 있다.","opts":["당뇨병이 있는 사람들은 체중을 줄일 수 없다.","체중 문제가 있는 사람들은 이미 약을 먹고 있다.","양에게서 나온 연구는 사람에게 쓸 수 없다.","이 연구는 앞으로 체중 문제나 당뇨병이 있는 사람들에게 도움이 될 수 있다."],"r":{"a":"4) 이 연구는 앞으로 체중 문제나 당뇨병이 있는 사람들에게 도움이 될 수 있다.","ev":"11~12번 문장","s":[[11,"With this information, the scientists hope to develop a similar medicine for humans.","이 정보를 가지고, 과학자들은 사람들을 위해 비슷한 약을 개발하기를 바란다."],[12,"In the future, this could help people with weight problems and diabetes.","미래에, 이것이 체중 문제나 당뇨병을 가진 사람들을 도와줄 수 있다."]],"w":"12번의 In the future(미래에)와 could help(도울 수 있다)로 보아 아직 약이 나온 것이 아니라 앞으로 도움이 될 가능성을 말함. this는 11번의 비슷한 약. 약을 이미 먹고 있다거나 쓸 수 없다는 말은 나오지 않음.","c":4},"h":"3f8f8d52e6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["흰색 지방은 보통 신생아의 목과 어깨에서 발견된다.","갈색 지방은 열량을 많이 태워서 우리 몸을 더 춥게 만든다.","흰색 지방은 우리 피부 아래에서 희거나 노르스름하게 보인다.","우리는 자라면서 갈색 지방을 더 많이 얻는다."],"opts":["White fat is usually found in newborn babies’ necks and shoulders.","Brown fat makes our body colder because it burns lots of calories.","White fat looks white or yellowish under our skin.","We gain more brown fat as we grow up."],"r":{"a":"3) White fat looks white or yellowish under our skin. (흰색 지방은 우리 피부 아래에서 희거나 노르스름하게 보인다.)","ev":"2번 문장","s":[[2,"One type is called white fat, and it looks white or yellowish under our skin.","한 종류는 흰색 지방이라고 불리며, 우리 피부 아래에서 희거나 노르스름하게 보인다."]],"w":"2번 문장: 흰색 지방은 피부 아래에서 희거나 노르스름하게 보임.","c":3},"h":"aaaacb697d"},{"n":9,"t":"sum","q":"Losing most of our brown fat can (A) cause problems for our (B).","ko":"갈색 지방의 대부분을 잃는 것은 우리의 (B)에 (A) 문제를 일으킬 수 있다.","oko":["(A) 결코 / (B) 건강","(A) 때때로 / (B) 건강","(A) 항상 / (B) 건강","(A) 때때로 / (B) 머리카락","(A) 때때로 / (B) 숙제"],"opts":["(A) never / (B) health","(A) sometimes / (B) health","(A) always / (B) health","(A) sometimes / (B) hair","(A) sometimes / (B) homework"],"r":{"a":"2) (A) sometimes / (B) health ((A) 때때로 / (B) 건강)","ev":"6~7번 문장","s":[[6,"As we grow up, we lose most of our brown fat and gain more white fat instead.","우리는 자라는 동안, 갈색 지방의 대부분을 잃고 대신 흰색 지방을 더 많이 얻게 된다."],[7,"This can sometimes cause problems for our health.","이는 때때로 우리의 건강에 문제를 일으킬 수 있다."]],"w":"6번에서 갈색 지방을 잃고, 7번에서 때때로 건강에 문제를 일으킬 수 있다고 함.","c":2},"h":"e21410678f"},{"n":10,"t":"fill","q":"Our [A] have different [B] of fat.","ko":"우리 [A]에는 여러 [B]의 지방이 있다.","bko":{"bodies":"몸(복수형)","types":"종류(복수형)","skin":"피부","heart":"심장","medicine":"약","calories":"열량"},"bank":["bodies","types","skin","heart","medicine","calories"],"r":{"a":"[A] bodies (몸(복수형)), [B] types (종류(복수형))","ev":"1번 문장","s":[[1,"Our bodies have different types of fat.","우리 몸에는 여러 종류의 지방이 있다."]],"w":"1번 문장: Our bodies have different types of fat.","c":null},"h":"e778cdfb7d"}]},{"u":10,"id":"rg2-10-2","no":2,"ko":"에펠탑 꼭대기에 아무도 모르게 숨겨 둔 방","items":[{"n":1,"t":"tf","q":"There is a secret apartment at the top of the Eiffel Tower.","ko":"에펠탑 꼭대기에는 비밀 아파트가 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"There is a secret apartment at the top of the tower!","그 탑 꼭대기에는 비밀 아파트가 있다!"]],"w":"3번 문장에 There is a secret apartment at the top of the tower!라고 나옴. 같은 내용이라 T.","c":"T"},"h":"91ad56a678"},{"n":2,"t":"tf","q":"Many people offered Eiffel lots of money, and he accepted it.","ko":"많은 사람들이 에펠에게 많은 돈을 제안했고, 그는 그것을 받아들였다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"They offered him lots of money, but he said no.","그들은 그에게 많은 돈을 제안했지만, 그는 거절했다."]],"w":"8번에서 사람들이 많은 돈을 제안했지만(offered him lots of money) 에펠은 거절했음(he said no). 받아들였다는 진술은 반대라 F. offered는 offer(제안하다)의 과거형.","c":"F"},"h":"645e39d292"},{"n":3,"t":"tf","q":"Visitors today can go inside the secret apartment.","ko":"오늘날 방문객들은 비밀 아파트 안에 들어갈 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Unfortunately, you can’t go inside, but you can look at it through a special window.","유감스럽게도, 여러분은 안에 들어갈 수는 없지만, 특별한 창문을 통해 그것을 바라볼 수 있다."]],"w":"11번에서 Unfortunately, you can’t go inside라고 함. 안에는 들어갈 수 없고 특별한 창문으로 바라볼 수만 있음. 그래서 F.","c":"F"},"h":"2f43c5c22f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Secretly, he kept an apartment on the top floor.)","ko":"비밀스럽게, 그는 꼭대기 층에 아파트를 가지고 있었다.","opts":["큰 소리로","비밀스럽게","빠르게","우연히"],"word":"Secretly","r":{"a":"2) 비밀스럽게","ev":"3번, 5번 문장","s":[[3,"There is a secret apartment at the top of the tower!","그 탑 꼭대기에는 비밀 아파트가 있다!"],[5,"Secretly, he kept an apartment on the top floor.","비밀스럽게, 그는 꼭대기 층에 아파트를 가지고 있었다."]],"w":"3번에서 탑 꼭대기에 ‘비밀스러운(secret)’ 방이 있다고 했고, 5번의 Secretly는 그 방을 몰래 가지고 있었다는 말. 그래서 비밀스럽게.","c":2},"h":"eee52fa06a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The apartment still remains at the top floor today.)","ko":"그 아파트는 오늘날에도 여전히 꼭대기 층에 남아 있다.","opts":["팔리다","사라지다","무너지다","남아 있다"],"word":"remains","r":{"a":"4) 남아 있다","ev":"10번 문장","s":[[10,"The apartment still remains at the top floor today.","그 아파트는 오늘날에도 여전히 꼭대기 층에 남아 있다."]],"w":"10번에 still(여전히)과 today(오늘날에도)가 함께 나옴. 아직도 꼭대기 층에 ‘남아 있다’는 뜻이라 remain은 남아 있다. 사라지다는 반대 뜻.","c":4},"h":"a10109d4bf"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIn 1889, Gustave Eiffel built a tower and named it after himself.","ko":"밑줄 친 it이 가리키는 것은?","sko":"1889년에 귀스타브 에펠(Gustave Eiffel)은 탑을 지었고 그것에 자신의 이름을 따서 붙였다.","opts":["귀스타브 에펠","그가 지은 탑","1889년","파리"],"r":{"a":"2) 그가 지은 탑","ev":"4번 문장","s":[[4,"In 1889, Gustave Eiffel built a tower and named it after himself.","1889년에 귀스타브 에펠(Gustave Eiffel)은 탑을 지었고 그것에 자신의 이름을 따서 붙였다."]],"w":"4번 문장: 에펠이 탑을 짓고 그 탑에 자기 이름을 붙임.","c":2,"k":"it = 그가 지은 탑"},"pron":"it","h":"cb03ca1acb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This secret place makes the Eiffel Tower even more interesting to visit!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 비밀스러운 장소가 에펠탑을 방문하기에 훨씬 더 흥미롭게 만든다!","opts":["에펠탑을 방문하는 사람이 너무 많아서 더 시끄러워졌다.","이 비밀 장소를 방문하는 것은 에펠탑보다 덜 흥미롭다.","이 비밀 방 때문에 에펠탑은 방문하기에 훨씬 더 흥미로운 곳이 된다.","에펠탑에는 흥미로운 장소가 하나도 없다."],"r":{"a":"3) 이 비밀 방 때문에 에펠탑은 방문하기에 훨씬 더 흥미로운 곳이 된다.","ev":"12번 문장","s":[[12,"This secret place makes the Eiffel Tower even more interesting to visit!","이 비밀스러운 장소가 에펠탑을 방문하기에 훨씬 더 흥미롭게 만든다!"]],"w":"12번의 makes the Eiffel Tower even more interesting에서 make A 형용사는 ‘A를 ~하게 만든다’. 비밀 방이 에펠탑을 더 흥미롭게 만든다는 뜻. 시끄럽다거나 덜 흥미롭다는 말은 없음.","c":3},"h":"1ec711432d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["귀스타브 에펠은 자신의 아파트를 친구에게 주었다.","비밀 아파트는 탑의 1층에 있다.","방문객들은 특별한 창문을 통해 아파트 안으로 들어갈 수 있다.","많은 사람들이 에펠탑에 있는 에펠의 아파트를 빌리고 싶어 했다."],"opts":["Gustave Eiffel gave his apartment to a friend.","The secret apartment is on the first floor of the tower.","Visitors can go inside the apartment through a special window.","Many people wanted to rent Eiffel’s apartment in the Eiffel Tower."],"r":{"a":"4) Many people wanted to rent Eiffel’s apartment in the Eiffel Tower. (많은 사람들이 에펠탑에 있는 에펠의 아파트를 빌리고 싶어 했다.)","ev":"7번 문장","s":[[7,"Many people wanted to rent his apartment in the Eiffel Tower.","많은 사람들이 에펠탑에 있는 그의 아파트를 빌리고 싶어 했다."]],"w":"7번 문장: 많은 사람들이 그의 방을 빌리고 싶어 함.","c":4},"h":"367654c40f"},{"n":9,"t":"sum","q":"Every year, many (A) go to see the (B) Eiffel Tower in Paris, France.","ko":"매년, 많은 (A)이(가) 프랑스 파리에 있는 (B) 에펠탑을 보러 간다.","oko":["(A) 학생들 / (B) 유명한","(A) 관광객들 / (B) 유명한","(A) 관광객들 / (B) 아주 작은","(A) 농부들 / (B) 유명한","(A) 관광객들 / (B) 못생긴"],"opts":["(A) students / (B) famous","(A) tourists / (B) famous","(A) tourists / (B) tiny","(A) farmers / (B) famous","(A) tourists / (B) ugly"],"r":{"a":"2) (A) tourists / (B) famous ((A) 관광객들 / (B) 유명한)","ev":"1번 문장","s":[[1,"Every year, many tourists go to see the famous Eiffel Tower in Paris, France.","매년, 많은 관광객들이 프랑스 파리에 있는 유명한 에펠탑을 보러 간다."]],"w":"1번 문장: 매년 많은 관광객들이 유명한 에펠탑을 보러 감.","c":2},"h":"28b567bbca"},{"n":10,"t":"fill","q":"It was very [A] up, so it had a wonderful [B] of Paris.","ko":"그곳은 매우 [A] 곳에 있어서 파리의 멋진 [B]을(를) 가지고 있었다.","bko":{"high":"높은","view":"전망, 경치","rent":"빌리다","money":"돈","window":"창문","floor":"층"},"bank":["high","view","rent","money","window","floor"],"r":{"a":"[A] high (높은), [B] view (전망, 경치)","ev":"6번 문장","s":[[6,"It was very high up, so it had a wonderful view of Paris.","그곳은 매우 높은 곳에 있어서 파리의 멋진 전망을 가지고 있었다."]],"w":"6번에서 very high up(매우 높은 곳에 있어서) 파리의 멋진 view(전망)를 가졌다고 함. famous(유명한), window(창문), floor(층)는 본문에 나오는 말이지만 이 문장의 빈칸에는 뜻이 맞지 않음.","c":null},"h":"9bbe9fd6e3"}]},{"u":10,"id":"rg2-10-3","no":3,"ko":"귀여운 걸 보면 왜 깨물어 주고 싶을까?","items":[{"n":1,"t":"tf","q":"When we see something very cute, we usually want to care for it, but we might also feel a bit aggressive.","ko":"우리는 아주 귀여운 것을 보면 보통 돌보고 싶어지지만, 약간 공격적으로 느낄 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"When we see something very cute, we usually want to care for it.","우리는 아주 귀여운 무언가를 볼 때, 보통 그것을 돌보고 싶어진다."],[3,"But, we might also feel a bit aggressive.","하지만, 우리는 약간 공격적으로 느낄 수도 있다."]],"w":"2번에서 아주 귀여운 것을 보면 보통 돌보고 싶다고 했고, 3번 But 뒤에서 약간 공격적으로 느낄 수도 있다고 함. 둘 다 본문과 같아서 T.","c":"T"},"h":"2d538b9624"},{"n":2,"t":"tf","q":"Cute aggression means you really want to hurt someone.","ko":"귀여운 공격성은 여러분이 정말로 누군가를 다치게 하고 싶다는 뜻이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Cute aggression doesn’t mean you actually want to hurt anyone.","귀여운 공격성은 여러분이 실제로 누군가를 다치게 하고 싶다는 뜻이 아니다."]],"w":"5번에서 Cute aggression doesn’t mean you actually want to hurt anyone이라고 함. 실제로 다치게 하고 싶다는 뜻이 아니므로 F.","c":"F"},"h":"4fdc8b0c9c"},{"n":3,"t":"tf","q":"Cute aggression makes our strong positive feelings even stronger.","ko":"귀여운 공격성은 우리의 강한 긍정적인 감정을 훨씬 더 강하게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Sometimes, when it’s too much, cute aggression helps us handle these strong positive feelings.","때때로, 그 기쁨이 너무 많을 때, 귀여운 공격성은 우리가 이런 강한 긍정적인 감정들을 다루도록 도와준다."]],"w":"7번에서 귀여운 공격성은 우리가 강한 긍정적인 감정들을 ‘다루도록 도와준다(helps us handle)’고 함. 더 강하게 만드는 것이 아니라 감정을 다루게 도와주므로 F.","c":"F"},"h":"0be898c5e9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But, we might also feel a bit aggressive.)","ko":"하지만, 우리는 약간 ‘공격적으로’ 느낄 수도 있다.","opts":["공격적인","졸린","부끄러운","행복한"],"word":"aggressive","r":{"a":"1) 공격적인","ev":"3~4번 문장","s":[[3,"But, we might also feel a bit aggressive.","하지만, 우리는 약간 공격적으로 느낄 수도 있다."],[4,"This feeling is called “cute aggression” in psychology.","이러한 감정은 심리학에서 ‘귀여운 공격성’이라고 불린다."]],"w":"3번에서 귀여운 것을 보고 돌보고 싶다가 But 뒤에서 ‘약간 aggressive’하게 느낀다고 함. 4번에서 이 감정을 ‘cute aggression’이라고 부름. aggressive는 공격적인. 졸리거나 부끄럽거나 행복하다는 뜻이 아님.","c":1},"h":"54fa3b7e4d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Our brain tries to balance out strong feeling with the opposite.)","ko":"우리의 뇌는 강한 감정의 균형을 ‘정반대의 것’으로 맞추려고 노력한다.","opts":["비슷한 것","같은 것","정반대의 것","작은 것"],"word":"opposite","r":{"a":"3) 정반대의 것","ev":"8~9번 문장","s":[[8,"Our brain tries to balance out strong feeling with the opposite.","우리의 뇌는 강한 감정의 균형을 정반대의 감정으로 맞추려고 노력한다."],[9,"So, playful aggression can be seen as the opposite of cuteness.","그래서, 장난스러운 공격성은 귀여움의 정반대로 보여질 수 있다."]],"w":"8번에서 강한 감정을 opposite로 균형을 맞춘다고 하고, 9번에서 장난스러운 공격성이 귀여움의 opposite로 보여진다고 함. 귀여움과 반대되는 공격성이므로 opposite는 정반대의 것.","c":3},"h":"d112b3d913"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHave you ever seen a cute puppy or a baby and thought, “I want to squeeze it,” or “I want to bite it”?","ko":"밑줄 친 it이 가리키는 것은?","sko":"여러분은 귀여운 강아지나 아기를 보고 “꼭 쥐어 보고 싶다.” 또는 “물어 보고 싶다.”라고 생각해 본 적이 있는가?","opts":["귀여운 강아지나 아기","귀여운 공격성","우리의 뇌","큰 기쁨"],"r":{"a":"1) 귀여운 강아지나 아기","ev":"1번 문장","s":[[1,"Have you ever seen a cute puppy or a baby and thought, “I want to squeeze it,” or “I want to bite it”?","여러분은 귀여운 강아지나 아기를 보고 “꼭 쥐어 보고 싶다.” 또는 “물어 보고 싶다.”라고 생각해 본 적이 있는가?"]],"w":"1번 문장: 귀여운 강아지나 아기를 보고 쥐어 보고 싶다, 물어 보고 싶다고 생각함.","c":1,"k":"it = 귀여운 강아지나 아기"},"pron":"it","h":"4e363a66c3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, playful aggression can be seen as the opposite of cuteness.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서, 장난스러운 공격성은 귀여움의 정반대로 보여질 수 있다.","opts":["장난스러운 공격성은 귀여움을 더 크게 만든다.","장난스러운 공격성은 귀여움의 정반대로 보여질 수 있다.","장난스러운 공격성은 귀여움과 아무 관계가 없다.","장난스러운 공격성은 귀여운 강아지만 느낄 수 있다."],"r":{"a":"2) 장난스러운 공격성은 귀여움의 정반대로 보여질 수 있다.","ev":"8~9번 문장","s":[[8,"Our brain tries to balance out strong feeling with the opposite.","우리의 뇌는 강한 감정의 균형을 정반대의 감정으로 맞추려고 노력한다."],[9,"So, playful aggression can be seen as the opposite of cuteness.","그래서, 장난스러운 공격성은 귀여움의 정반대로 보여질 수 있다."]],"w":"9번의 So(그래서)는 8번 결과를 정리함. 뇌가 강한 감정(귀여움)을 정반대 감정으로 맞추려 하니 장난스러운 공격성은 the opposite of cuteness(귀여움의 정반대)로 보임. can be seen as는 ‘~로 보여질 수 있다’.","c":2},"h":"ff0f94f5dd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["그 감정은 심리학에서 ‘귀여운 공격성’이라고 불린다.","귀여운 공격성은 우리가 귀여운 동물을 정말로 다치게 하고 싶다는 뜻이다.","우리는 귀여운 것을 볼 때 공격적으로 느끼는 일이 절대 없다.","뇌는 같은 감정으로 강한 감정을 더 크게 만든다."],"opts":["The feeling is called “cute aggression” in psychology.","Cute aggression means we really want to hurt a cute animal.","We never feel aggressive when we see something cute.","The brain makes the strong feeling bigger with the same feeling."],"r":{"a":"1) The feeling is called “cute aggression” in psychology. (그 감정은 심리학에서 ‘귀여운 공격성’이라고 불린다.)","ev":"4번 문장","s":[[4,"This feeling is called “cute aggression” in psychology.","이러한 감정은 심리학에서 ‘귀여운 공격성’이라고 불린다."]],"w":"4번 문장: 이 감정은 심리학에서 cute aggression이라고 불림.","c":1},"h":"a5b9323d1d"},{"n":9,"t":"sum","q":"Your brain is just (A) with lots of (B).","ko":"여러분의 뇌는 단지 많은 (B)을(를) (A) 있을 뿐이다.","oko":["(A) 다루고 / (B) 기쁨","(A) 놀고 / (B) 기쁨","(A) 다루고 / (B) 슬픔","(A) 싸우고 / (B) 기쁨","(A) 다루고 / (B) 숙제"],"opts":["(A) dealing / (B) joy","(A) playing / (B) joy","(A) dealing / (B) sadness","(A) fighting / (B) joy","(A) dealing / (B) homework"],"r":{"a":"1) (A) dealing / (B) joy ((A) 다루고 / (B) 기쁨)","ev":"6번 문장","s":[[6,"Your brain is just dealing with lots of joy.","여러분의 뇌는 단지 큰 기쁨을 다루고 있을 뿐이다."]],"w":"6번 문장: Your brain is just dealing with lots of joy.","c":1},"h":"8842c6f6e3"},{"n":10,"t":"fill","q":"The next time you feel cute aggression, remember this: Your brain is just helping you [A] down after you have too many [B] feelings!","ko":"다음번에 여러분이 귀여운 공격성을 느낄 때, 이것을 기억하라: 여러분의 뇌는 여러분이 너무 많은 [B] 감정을 가진 후에 [A] 것을 도와주고 있을 뿐이다!","bko":{"calm":"
