.","인도네시아의 유명한 면 요리는 미고렝입니다.",1],["It means \"fried noodles.\"","이것은 '볶은 국수'를 의미합니다.",0],["People enjoy adding different toppings to this dish.","사람들은 이 요리에 여러 가지 토핑을 추가하는 것을 즐깁니다.",0],["You can add vegetables, seafood, and fried eggs.","당신은 채소, 해산물, 그리고 달걀 프라이를 추가할 수 있습니다.",0],["With some chili sauce, you can make spicy mie goreng.","약간의 칠리소스로 당신은 매운 미고렝을 만들 수 있습니다.",0],["Try making your own mie goreng.","당신만의 미고렝을 만들어 보세요.",0],["What's your choice for the first match?","첫 번째 경기에 대한 당신의 선택은 무엇인가요?",1],["My choice is ____________________!","저의 선택은 ____________________입니다!",1],["Let's keep moving to the next match.","다음 경기로 넘어가 봅시다.",1],["Two rice dishes are waiting for us.","두 가지 쌀 요리가 우리를 기다리고 있습니다.",0],["Paella has rice, meat, and seafood in it.","파에야에는 쌀, 고기, 그리고 해산물이 들어 있습니다.",1],["People cook paella in a large, flat pan.","사람들은 파에야를 크고 납작한 팬에 요리합니다.",0],["The food's name comes from a word for this pan.","그 음식의 이름은 이 팬을 일컫는 단어에서 유래합니다.",0],["Spanish people love paella.","스페인 사람들은 파에야를 정말 좋아합니다.",0],["They even celebrate National Paella Day on March 27!","그들은 심지어 3월 27일에 국가 파에야의 날을 기념합니다!",0]];var RNUM=11;var TITLE_EN="Come and Enjoy the Food World Cup!";var PASS_EN=["Come and Enjoy the Food World Cup!","Hello, everyone. I'm at the Food World Cup right now! People are tasting different foods from all around the world. The matches between delicious foods begin now!","I'm watching the first match! It is between two noodle dishes.","Italy has about 350 different pasta dishes. Among them, spaghetti aglio e olio is really popular. Aglio e olio means \"garlic and oil\" in Italian. With just noodles, garlic, and olive oil, you can make a delicious dish!","Indonesia's famous noodle dish is mie goreng. It means \"fried noodles.\" People enjoy adding different toppings to this dish. You can add vegetables, seafood, and fried eggs. With some chili sauce, you can make spicy mie goreng. Try making your own mie goreng.","What's your choice for the first match?","My choice is ____________________!","Let's keep moving to the next match. Two rice dishes are waiting for us.","Paella has rice, meat, and seafood in it. People cook paella in a large, flat pan. The food's name comes from a word for this pan. Spanish people love paella. They even celebrate National Paella Day on March 27!"];var PASS_KO=["오셔서 음식 월드컵을 즐기세요!","안녕하세요, 여러분. 저는 지금 음식 월드컵에 와 있습니다! 사람들은 전 세계의 여러 가지 음식들을 맛보고 있습니다. 맛있는 음식들 간의 경기가 지금 시작됩니다!","저는 첫 번째 경기를 보고 있습니다! 이것은 두 개의 면 요리 사이의 경기입니다.","이탈리아에는 약 350가지의 다양한 파스타 요리가 있습니다. 그중에서, 스파게티 알리오 올리오는 정말 인기 있습니다. 알리오 올리오는 이탈리아어로 '마늘과 오일'을 의미합니다. 면, 마늘, 그리고 올리브 오일만으로 당신은 맛있는 요리를 만들 수 있습니다!","인도네시아의 유명한 면 요리는 미고렝입니다. 이것은 '볶은 국수'를 의미합니다. 사람들은 이 요리에 여러 가지 토핑을 추가하는 것을 즐깁니다. 당신은 채소, 해산물, 그리고 달걀 프라이를 추가할 수 있습니다. 약간의 칠리소스로 당신은 매운 미고렝을 만들 수 있습니다. 당신만의 미고렝을 만들어 보세요.","첫 번째 경기에 대한 당신의 선택은 무엇인가요?","저의 선택은 ____________________입니다!","다음 경기로 넘어가 봅시다. 두 가지 쌀 요리가 우리를 기다리고 있습니다.","파에야에는 쌀, 고기, 그리고 해산물이 들어 있습니다. 사람들은 파에야를 크고 납작한 팬에 요리합니다. 그 음식의 이름은 이 팬을 일컫는 단어에서 유래합니다. 스페인 사람들은 파에야를 정말 좋아합니다. 그들은 심지어 3월 27일에 국가 파에야의 날을 기념합니다!"];var DG=[{"qs":[{"n":1,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["The original cost of shoes is fifty dollars.","The girl is looking for shoes for exercise.","The girl gets a thirty percent discount.","The girl asks for a discount.","The girl pays $40 after the discount."],"a":2,"ans":"The girl gets a thirty percent discount.","evs":[["M: Yes. You can have a twenty percent discount. So, the total price is forty dollars.","네. 20퍼센트 할인을 받으실 수 있어요. 그래서 총 가격은 40달러예요."],["M: They are fifty dollars.","50달러예요."]],"ev":["M: Yes. You can have a twenty percent discount. So, the total price is forty dollars.","네. 20퍼센트 할인을 받으실 수 있어요. 그래서 총 가격은 40달러예요."],"ow":["오답 ✕ — 'They are fifty dollars.'(50달러예요.)라고 했으므로 신발의 원래 가격이 50달러라는 보기는 대화와 일치한다. 일치하는 내용이라 '일치하지 않는 것'이 될 수 없다.","오답 ✕ — 'I'm looking for shoes. I'm going to wear them for exercise.'(저는 신발을 찾고 있어요. 운동할 때 신을 거예요.)라고 했으므로 운동용 신발을 찾는다는 보기는 일치한다.","정답 ○ — 점원은 'You can have a twenty percent discount.'(20퍼센트 할인을 받으실 수 있어요.)라고 했는데, 이 보기는 30퍼센트 할인이라고 해서 대화와 일치하지 않는다. 그래서 정답이다.","오답 ✕ — 소녀가 'Can I have a discount?'(할인받을 수 있나요?)라고 물었으므로 할인을 요청했다는 보기는 일치한다.","오답 ✕ — 'So, the total price is forty dollars.'(그래서 총 가격은 40달러예요.)라고 했으므로 할인 후 40달러를 낸다는 보기는 일치한다. 50달러에서 20퍼센트(10달러)를 깎으면 40달러이다."],"memo":["정답 ③: 소녀는 30퍼센트가 아니라 20퍼센트 할인을 받는다.","근거: You can have a twenty percent discount.(20퍼센트 할인을 받으실 수 있어요.)","함정: ⑤는 50달러에서 10달러를 깎은 40달러라서 맞는 말(○)"],"why":"소녀가 받는 할인은 30퍼센트가 아니라 20퍼센트이다."}],"dlg":[["M","May I help you?","도와드릴까요?"],["G","Yes, please. I'm looking for shoes. I'm going to wear them for exercise.","네, 부탁드려요. 저는 신발을 찾고 있어요. 운동할 때 신을 거예요."],["M","What about these shoes? They are light and soft.","이 신발은 어떠세요? 가볍고 부드러워요."],["G","I like them. How much are they?","마음에 들어요. 얼마예요?"],["M","They are fifty dollars.","50달러예요."],["G","Great. I'll buy them. Can I have a discount?","좋아요. 그걸 살게요. 할인받을 수 있나요?"],["M","Yes. You can have a twenty percent discount. So, the total price is forty dollars.","네. 20퍼센트 할인을 받으실 수 있어요. 그래서 총 가격은 40달러예요."],["G","Here you go. Thank you.","여기 있어요. 감사합니다."]]},{"qs":[{"n":2,"q":"위 대화의 주제로 알맞은 것은?","o":["finding a shop","a fashion trend","returning an item","a friend's birthday","buying a gift at a store"],"a":4,"ans":"buying a gift at a store","evs":[["B: Yes, please. I'm looking for a gift. I'm going to give it to my friend.","네, 부탁드려요. 저는 선물을 찾고 있어요. 제 친구에게 줄 거예요."],["W: Okay. What about this purse? It is popular with tourists.","알겠어요. 이 지갑은 어떠세요? 관광객들에게 인기가 있어요."]],"ev":["B: Yes, please. I'm looking for a gift. I'm going to give it to my friend.","네, 부탁드려요. 저는 선물을 찾고 있어요. 제 친구에게 줄 거예요."],"ow":["오답 ✕ — 'I'm looking for a gift.'(저는 선물을 찾고 있어요.)라고 했을 뿐 가게를 찾는(finding a shop) 대화가 아니다. 이미 가게 안에서 점원과 이야기하고 있다.","오답 ✕ — 점원이 'It is popular with tourists.'(관광객들에게 인기가 있어요.)라고 말하긴 했지만 패션 유행(a fashion trend)에 대한 이야기는 아니다. 지갑을 추천하는 말일 뿐이다.","오답 ✕ — 대화에 물건을 돌려주는(returning an item) 내용은 없다. 'I'm looking for a gift.'(저는 선물을 찾고 있어요.)라고 하며 사려고 하는 상황이다.","오답 ✕  habits)과 관련이 없다. 건강이나 식습관 얘기는 나오지 않는다."],"memo":["정답 ③: buying snacks as a gift (선물로 줄 간식 사기)","근거: I'm going to give them to my parents as a gift.(부모님께 선물로 드릴 거예요.)","함정: ④는 바나나칩을 '만든다'는 말이 없어서 ✕"],"why":"소녀가 부모님께 드릴 선물용 간식(바나나칩)을 사는 대화이다."},{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["The banana chips are ten dollars per bag.","The girl is buying snacks for herself.","The man does not give the girl a discount.","The girl is going to buy five bags of banana chips.","The girl gets a twenty percent discount."],"a":3,"ans":"The girl is going to buy five bags of banana chips.","evs":[["G: Can I have a discount? I'll buy five bags.","할인받을 수 있나요? 다섯 봉지를 살게요."],["M: They are two dollars per bag.","한 봉지에 2달러예요."]],"ev":["G: Can I have a discount? I'll buy five bags.","할인받을 수 있나요? 다섯 봉지를 살게요."],"ow":["오답 ✕ — 'They are two dollars per bag.'(한 봉지에 2달러예요.)라고 했는데 이 보기는 한 봉지에 10달러라고 해서 틀림. 10달러는 다섯 봉지의 가격이다.","오답 ✕ — 'I'm going to give them to my parents as a gift.'(부모님께 선물로 드릴 거예요.)라고 했는데 이 보기는 자신을 위해 산다고 해서 틀림.","오답 ✕ — 점원이 'you can have a ten percent discount'(10퍼센트 할인을 받으실 수 있어요)라고 했는데 이 보기는 할인을 해 주지 않는다고 해서 틀림.","정답 ○ — 소녀가 'I'll buy five bags.'(다섯 봉지를 살게요.)라고 했으므로 바나나칩 다섯 봉지를 살 것이라는 보기가 일치한다.","오답 ✕ — 'you can have a ten percent discount'(10퍼센트 할인을 받으실 수 있어요)라고 했는데 이 보기는 20퍼센트라고 해서 틀림. 20퍼센트는 신발 가게 대화에 나온 숫자이다."],"memo":["정답 ④: 소녀는 바나나칩 다섯 봉지를 살 것이다.","근거: I'll buy five bags.(다섯 봉지를 살게요.)","함정: ①은 한 봉지가 2달러라서 ✕ (10달러는 다섯 봉지 값)"],"why":"소녀는 다섯 봉지를 사고 10퍼센트 할인을 받는다."}],"dlg":[["M","Hi. Can I help you?","안녕하세요. 도와드릴까요?"],["G","Yes. I'm looking for some delicious snacks. I'm going to give them to my parents as a gift.","네. 저는 맛있는 간식을 찾고 있어요. 부모님께 선물로 드릴 거예요."],["M","How about these banana chips? They are really popular here.","이 바나나칩은 어떠세요? 여기서 정말 인기가 많아요."],["G","Okay! How much are they?","좋아요! 얼마예요?"],["M","They are two dollars per bag.","한 봉지에 2달러예요."],["G","Can I have a discount? I'll buy five bags.","할인받을 수 있나요? 다섯 봉지를 살게요."],["M","Sure. It's ten dollars, but you can have a ten percent discount.","물론이죠. 10달러인데, 10퍼센트 할인을 받으실 수 있어요."],["G","Great!","좋아요!"]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["A lot of people like MJ Restaurant.","The woman is talking with the chef.","MJ Restaurant has delicious bulgogi pizza.","MJ Restaurant's best dish costs ten dollars.","The woman is planning to try MJ Restaurant's best dish."],"a":2,"ans":"MJ Restaurant has delicious bulgogi pizza.","evs":[["M: Many people like the bulgogi pasta.","많은 사람들이 불고기 파스타를 좋아해요."],["M: We have a lot of delicious dishes, and our prices are good.","저희는 맛있는 요리가 많고, 가격도 좋아요."]],"ev":["M: Many people like the bulgogi pasta.","많은 사람들이 불고기 파스타를 좋아해요."],"ow":["오답 ✕ — 'MJ Restaurant is very popular in this city.'(MJ 레스토랑은 이 도시에서 매우 인기가 많아요.)라고 했으므로 많은 사람이 좋아한다는 보기는 일치한다.","오답 ✕ — 'He is a chef at MJ Restaurant.'(그는 MJ 레스토랑의 요리사입니다.)라고 했으므로 여자가 요리사와 이야기 중이라는 보기는 일치한다.","정답 ○ — 'Many people like the bulgogi pasta.'(많은 사람들이 불고기 파스타를 좋아해요.)라고 했는데 이 보기는 불고기 '피자'라고 해서 일치하지 않는다. 그래서 정답이다.","오답 ✕ — 가장 인기 있는 요리인 불고기 파스타에 대해 'It is ten dollars.'(10달러예요.)라고 했으므로 일치한다.","오답 ✕ — 'I'm going to try it today.'(저는 오늘 그걸 먹어볼 거예요.)라고 했고 it은 가장 인기 있는 불고기 파스타이므로 일치한다."],"memo":["정답 ③: 불고기 '피자'가 아니라 불고기 '파스타'이다.","근거: Many people like the bulgogi pasta.(많은 사람들이 불고기 파스타를 좋아해요.)","함정: ④는 불고기 파스타가 10달러라서 맞는 말(○)"],"why":"MJ 레스토랑의 대표 메뉴는 불고기 피자가 아니라 불고기 파스타이다."}],"dlg":[["W","Today, I'm talking with Matt Jones. He is a chef at MJ Restaurant. Hi, Matt.","오늘은 Matt Jones 씨와 이야기를 나눕니다. 그는 MJ 레스토랑의 요리사입니다. 안녕하세요, Matt."],["M","Hello, and welcome to our restaurant.","안녕하세요, 저희 레스토랑에 오신 것을 환영합니다."],["W","MJ Restaurant is very popular in this city. Why do people like your restaurant?","MJ 레스토랑은 이 도시에서 매우 인기가 많아요. 사람들은 왜 이 레스토랑을 좋아하나요?"],["M","We have a lot of delicious dishes, and our prices are good.","저희는 맛있는 요리가 많고, 가격도 좋아요."],["W","I see. What is the best dish here?","그렇군요. 여기서 가장 인기 있는 요리는 무엇인가요?"],["M","Many people like the bulgogi pasta.","많은 사람들이 불고기 파스타를 좋아해요."],["W","That sounds delicious! How mu
