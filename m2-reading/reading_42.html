<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 42</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}
.sec{margin:26px 0 8px;font-weight:700;color:var(--pri);font-size:15px;border-left:4px solid var(--pri);padding-left:8px}
.sent{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;gap:10px;align-items:flex-start}.n{min-width:24px;color:var(--mut);font-size:13px;padding-top:3px}
.txt{font-size:18px;line-height:2}
.wd{cursor:pointer;border-radius:5px;padding:1px 2px;margin:0 1px;-webkit-tap-highlight-color:transparent}
.wd:hover{background:#eef3f8}.wd.on{background:var(--sel);box-shadow:inset 0 -2px 0 var(--selb)}
.locked .wd{cursor:default}.locked .wd:hover{background:none}
.wd.hit{background:var(--okbg);box-shadow:inset 0 -2px 0 var(--ok)}.wd.miss{background:var(--badbg);box-shadow:inset 0 -2px 0 var(--bad)}.wd.x{text-decoration:line-through;color:var(--mut)}
.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}
.note{margin:10px 0 0 34px;padding:10px 12px;border-radius:8px;font-size:14.5px}
.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}
button{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Words have power. They can makes us feel good or bad.","ko":"말에는 힘이 있습니다. 말은 우리를 기분 좋거나 나쁘게 만들 수 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"makes","right":"make","partial":false,"at":[5],"point":"조동사 뒤 동사원형: 조동사 can 뒤에는 동사원형: make (makes 아님)","topic":"조동사 뒤 동사원형","memo":"조동사 can 뒤에는 동사원형: make (makes 아님)"}]},{"n":2,"tag":null,"en":"The words which we choose can influence our thoughts, emotions, and friendships.","ko":"우리가 선택하는 말은 우리의 생각, 감정, 그리고 우정에 영향을 미칠 수 있습니다.","ok":true,"foot":[],"fixes":[]},{"n":3,"tag":null,"en":"Let's explore some common problems that student usually face. You will understands the amazing power of words.","ko":"학생들이 흔히 겪는 일반적인 문제들을 함께 살펴봅시다. 여러분은 말의 놀라운 힘을 이해하게 될 것입니다.","ok":false,"foot":[],"fixes":[{"wrong":"student","right":"students","partial":false,"at":[6],"point":"명사의 복수형: 주어가 복수(students)인 일반 표현 사용","topic":"명사의 복수형","memo":"주어가 복수(students)인 일반 표현 사용"},{"wrong":"understands","right":"understand","partial":false,"at":[11],"point":"조동사 뒤 동사원형: 조동사 will 뒤에는 동사원형: understand","topic":"조동사 뒤 동사원형","memo":"조동사 will 뒤에는 동사원형: understand"}]},{"n":4,"tag":null,"en":"\"I didn't did well during dance practice. I always mess up.\"","ko":"\"나는 춤 연습을 잘 못했어. 난 항상 망쳐.\"","ok":false,"foot":[],"fixes":[{"wrong":"did","right":"do","partial":false,"at":[2],"point":"일반동사의 부정문: didn't 뒤에는 동사원형 do 사용","topic":"일반동사의 부정문","memo":"didn't 뒤에는 동사원형 do 사용"}]},{"n":5,"tag":null,"en":"Negatively words like \"I always mess up\" can make you feel down and want to stop try.","ko":"\"난 항상 망쳐\"와 같은 부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만들 수 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"Negatively","right":"Negative","partial":false,"at":[0],"point":"형용사와 부사: 명사 words를 꾸미는 형용사 Negative 사용","topic":"형용사와 부사","memo":"명사 words를 꾸미는 형용사 Negative 사용"},{"wrong":"try","right":"trying","partial":false,"at":[16],"point":"동명사: stop 뒤에는 동명사 trying 사용","topic":"동명사","memo":"stop 뒤에는 동명사 trying 사용"}]},{"n":6,"tag":null,"en":"Instead, encourage yourself with positive words.","ko":"대신 긍정적인 말로 자신을 격려해 보세요.","ok":true,"foot":[],"fixes":[]},{"n":7,"tag":null,"en":"When you think positively, you can learn from you mistakes and improve your skills.","ko":"긍정적인 사고를 할 때, 실수에서 배우고 실력을 향상할 수 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[8],"point":"인칭대명사의 소유격: 명사 mistakes 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"명사 mistakes 앞에는 소유격 your 사용"}]},{"n":8,"tag":null,"en":"Say It! \"I didn't dance well this time, but I'll keep practicing and get more better.\"","ko":"말해 보세요! \"이번에는 춤을 잘 못 췄지만, 계속 연습해서 더 잘할 거야.\"","ok":false,"foot":[],"fixes":[{"wrong":"more better","right":"better","partial":false,"at":[14],"point":"비교급: better 자체가 비교급이라 more 불필요","topic":"비교급","memo":"better 자체가 비교급이라 more 불필요"}]},{"n":9,"tag":null,"en":"\"Seongjun winned first place in the contest? He's just too lucky.\"","ko":"\"성준이가 대회에서 1등을 했다고? 그냥 운이 너무 좋네.\"","ok":false,"foot":[],"fixes":[{"wrong":"winned","right":"won","partial":false,"at":[1],"point":"불규칙 과거형: win의 과거형은 won (winned 아님)","topic":"불규칙 과거형","memo":"win의 과거형은 won (winned 아님)"}]},{"n":10,"tag":null,"en":"We easily says negative things about others when we feel jealous.","ko":"우리는 질투를 느낄 때 다른 사람에 대해 부정적인 말을 쉽게 합니다.","ok":false,"foot":[],"fixes":[{"wrong":"says","right":"say","partial":false,"at":[2],"point":"일반동사의 현재형: 주어 We는 복수: say (says 아님)","topic":"일반동사의 현재형","memo":"주어 We는 복수: say (says 아님)"}]},{"n":11,"tag":null,"en":"But using negative words like \"He's just too lucky\" doesn't let you grow.","ko":"그러나 \"그냥 운이 너무 좋네\"와 같은 부정적인 말을 하는 건 여러분이 성장하지 못하게 합니다.","ok":true,"foot":[],"fixes":[]},{"n":12,"tag":null,"en":"Instead, try to be happy of others and respect their efforts.","ko":"대신 다른 사람을 위해 기뻐하고 그들의 노력을 존중해 보세요.","ok":false,"foot":[],"fixes":[{"wrong":"of","right":"for","partial":false,"at":[5],"point":"기본전치사: '~를 기뻐하는'은 happy for 사용","topic":"기본전치사","memo":"'~를 기뻐하는'은 happy for 사용"}]},{"n":13,"tag":null,"en":"With positive word, you can learn from your friends, get along better, and focus in your own growth.","ko":"긍정적인 말을 통해 여러분은 친구에게서 배우고, 더 잘 지내며, 자신의 성장에 집중할 수 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"word","right":"words","partial":false,"at":[2],"point":"명사의 복수형: 일반적인 '말'은 복수 words 사용","topic":"명사의 복수형","memo":"일반적인 '말'은 복수 words 사용"},{"wrong":"in","right":"on","partial":false,"at":[14],"point":"기본전치사: '~에 집중하다'는 focus on 사용","topic":"기본전치사","memo":"'~에 집중하다'는 focus on 사용"}]},{"n":14,"tag":null,"en":"Say It! \"He did an great job.","ko":"말해 보세요! \"그가 정말 잘했어.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[4],"point":"관사 a/an: 자음 소리 great 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 great 앞에는 a 사용"}]},{"n":15,"tag":null,"en":"Good for him! I'll try hard, too!\"","ko":"잘됐다! 나도 열심히 할 거야!\"","ok":true,"foot":[],"fixes":[]},{"n":16,"tag":null,"en":"\"We lost the game because your mistake. It's your fault.\"","ko":"\"우리는 네 실수 때문에 게임에서 졌어. 네 잘못이야.\"","ok":false,"foot":[],"fixes":[{"wrong":"your","right":"of your","partial":false,"at":[5],"point":"전치사와 접속사: 명사구 앞에는 because of 사용","topic":"전치사와 접속사","memo":"명사구 앞에는 because of 사용","alt":[4]}]},{"n":17,"tag":null,"en":"When things goes wrong, we sometimes blame others.","ko":"일이 잘못되었을 때 우리는 가끔 다른 사람을 비난하기도 합니다.","ok":false,"foot":[],"fixes":[{"wrong":"goes","right":"go","partial":false,"at":[2],"point":"주어와 동사의 수일치: 주어 things는 복수: go (goes 아님)","topic":"주어와 동사의 수일치","memo":"주어 things는 복수: go (goes 아님)"}]},{"n":18,"tag":null,"en":"However, negative words like \"It's your fault\" can hurt they feelings and damage your friendship.","ko":"하지만 \"네 잘못이야\"와 같은 부정적인 말은 상대방의 감정을 상하게 하고 우정을 해칠 수 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"they","right":"their","partial":false,"at":[9],"point":"인칭대명사의 소유격: 명사 feelings 앞에는 소유격 their 사용","topic":"인칭대명사의 소유격","memo":"명사 feelings 앞에는 소유격 their 사용"}]},{"n":19,"tag":null,"en":"Instead, show your support and cheer them up.","ko":"대신 지지를 보내고 그들을 응원해 주세요.","ok":true,"foot":[],"fixes":[ ve words like \"I always mess up\" can make you feel down and want to stop trying. Instead, encourage yourself with positive words. When you think positively, you can learn from your mistakes and improve your skills.","Say It! \"I didn't dance well this time, but I'll keep practicing and get better.\"","\"Seongjun won first place in the contest? He's just too lucky.\"","We easily say negative things about others when we feel jealous. But using negative words like \"He's just too lucky\" doesn't let you grow. Instead, try to be happy for others and respect their efforts. With positive words, you can learn from your friends, get along better, and focus on your own growth.","Say It! \"He did a great job. Good for him! I'll try hard, too!\"","\"We lost the game because of your mistake. It's your fault.\"","When things go wrong, we sometimes blame others. However, negative words like \"It's your fault\" can hurt their feelings and damage your friendship. Instead, show your support and cheer them up. Positive words will make your team develop strong teamwork and perform better next time.","Say It! \"You're a team member whom I trust. Let's keep doing our best together, and we'll win the next game.\""];var PASS_KO=["말의 힘","말에는 힘이 있습니다. 말은 우리를 기분 좋거나 나쁘게 만들 수 있습니다. 우리가 선택하는 말은 우리의 생각, 감정, 그리고 우정에 영향을 미칠 수 있습니다. 학생들이 흔히 겪는 일반적인 문제들을 함께 살펴봅시다. 여러분은 말의 놀라운 힘을 이해하게 될 것입니다.","\"나는 춤 연습을 잘 못했어. 난 항상 망쳐.\"","\"난 항상 망쳐\"와 같은 부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만들 수 있습니다. 대신 긍정적인 말로 자신을 격려해 보세요. 긍정적인 사고를 할 때, 실수에서 배우고 실력을 향상할 수 있습니다.","말해 보세요! \"이번에는 춤을 잘 못 췄지만, 계속 연습해서 더 잘할 거야.\"","\"성준이가 대회에서 1등을 했다고? 그냥 운이 너무 좋네.\"","우리는 질투를 느낄 때 다른 사람에 대해 부정적인 말을 쉽게 합니다. 그러나 \"그냥 운이 너무 좋네\"와 같은 부정적인 말을 하는 건 여러분이 성장하지 못하게 합니다. 대신 다른 사람을 위해 기뻐하고 그들의 노력을 존중해 보세요. 긍정적인 말을 통해 여러분은 친구에게서 배우고, 더 잘 지내며, 자신의 성장에 집중할 수 있습니다.","말해 보세요! \"그가 정말 잘했어. 잘됐다! 나도 열심히 할 거야!\"","\"우리는 네 실수 때문에 게임에서 졌어. 네 잘못이야.\"","일이 잘못되었을 때 우리는 가끔 다른 사람을 비난하기도 합니다. 하지만 \"네 잘못이야\"와 같은 부정적인 말은 상대방의 감정을 상하게 하고 우정을 해칠 수 있습니다. 대신 지지를 보내고 그들을 응원해 주세요. 긍정적인 말은 여러분의 팀이 강한 팀워크를 키우고 다음에는 더 잘할 수 있게 할 것입니다.","말해 보세요! \"너는 내가 믿는 팀원이야. 함께 계속 최선을 다하면 다음 게임에서 이길 수 있을 거야.\""];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["Mina's reason for being upset","how to become a good friend","a popular band among teenagers","advice on apologizing to a friend","how to avoid hurting a friend's feelings"],"a":3,"ans":"advice on apologizing to a friend","evs":[["Did you say sorry to her?","미나에게 사과했니?"],["I think you should tell her you're sorry and you didn't mean to hurt her feelings.","미안하다고, 그리고 상처 줄 생각은 아니었다고 말해야 한다고 생각해."]],"ev":["Did you say sorry to her?","미나에게 사과했니?"],"ow":["오답 ✕ — 미나가 화난 이유는 'I said terrible things about her favorite band'(미나가 가장 좋아하는 밴드에 대해 끔찍한 말을 했어)로 한 줄에 나올 뿐이다. 대화의 중심은 이유가 아니라 어떻게 사과할지에 대한 조언이라서 틀림.","오답 ✕ — 좋은 친구가 되는 방법 전반을 말하는 대화는 아니다. 한 가지 상황, 즉 미나에게 사과하는 방법에 한정되어 있어서 너무 넓고 틀림.","오답 ✕ — 'she's really into them'(그 밴드를 정말 좋아한다)이라는 말이 있지만 밴드 이야기가 아니라 사과하는 이야기가 주제라서 틀림.","정답 ○ — 준수가 'What should I do?'(어떻게 해야 할까?)라고 묻자 신디가 'tell her you're sorry'(미안하다고 말해)라고 조언한다. 친구에게 사과하는 방법에 대한 조언이 주제이다.","오답 ✕ — 이미 'I said terrible things'(끔찍한 말을 했어)로 상처를 준 뒤의 상황이라서 앞으로 상처 주지 않는 방법이 아니라 사과하는 방법이 주제이다. 따라서 틀림."],"memo":["정답: ④ advice on apologizing to a friend (친구에게 사과하는 것에 대한 조언)","근거: Did you say sorry to her?(미나에게 사과했니?) / you should tell her you're sorry(미안하다고 말해야 해)","함정: ⑤ 이미 상처를 준 뒤이므로 '피하는 법'이 아니라 '사과하는 법'"],"why":"상처 준 친구에게 어떻게 사과할지 조언하는 대화이다."},{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Junsu is worried because Mina is upset.","Cindy is happy to help Junsu.","Junsu said bad things about Mina's favorite band.","Cindy doesn't think Mina will accept Junsu's apology.","Junsu will take Cindy's advice."],"a":3,"ans":"Cindy doesn't think Mina will accept Junsu's apology.","evs":[["Of course. Don't worry.","물론이지. 걱정하지 마."],["Okay, I'll do that. Thanks, Cindy.","알겠어, 그렇게 할게. 고마워, Cindy."]],"ev":["Of course. Don't worry.","물론이지. 걱정하지 마."],"ow":["오답 ✕ — 준수가 'Mina's upset and not talking to me.'(미나가 화가 나서 나랑 말을 안 해.)라고 하며 걱정하는 모습이므로 일치하는 내용이다. 일치하지 않는 것을 찾는 문제라서 답이 아니다.","오답 ✕ — 신디가 'Okay. Let me help you.'(그래. 내가 도와줄게.)라고 했으므로 기꺼이 도와준다. 일치하는 내용이다.","오답 ✕ — 'I said terrible things about her favorite band in front of everyone.'(모두가 보는 앞에서 미나가 가장 좋아하는 밴드에 대해 끔찍한 말을 했어.)라고 했으므로 일치하는 내용이다.","정답 ○ — 준수가 'Do you think she'll feel better?'(미나가 기분이 나아질 것 같니?)라고 묻자 신디는 'Of course. Don't worry.'(물론이지. 걱정하지 마.)라고 답했다. 신디가 사과를 받아 주지 않을 것이라 생각한다는 보기는 일치하지 않는다.","오답 ✕ — 준수가 'Okay, I'll do that.'(알겠어, 그렇게 할게.)이라고 했으므로 신디의 조언을 따를 것이다. 일치하는 내용이다."],"memo":["정답: ④ 신디는 미나가 사과를 받아 주지 않을 거라고 생각한다 (✕)","근거: Of course. Don't worry.(물론이지. 걱정하지 마.)","함정: 신디는 미나의 기분이 나아질 것이라고 낙관한다"],"why":"신디는 'Of course. Don't worry.'라며 미나가 기분이 나아질 것이라고 했다."},{"n":3,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["band - thanks","song - sorry","band - sorry","team - sorry","movie - hello"],"a":2,"ans":"band - sorry","evs":[["I said terrible things about her favorite band in front of everyone.","모두가 보는 앞에서 미나가 가장 좋아하는 밴드에 대해 끔찍한 말을 했어."],["I think you should tell her you're sorry","미안하다고 말해야 한다고 생각해"]],"ev":["I said terrible things about her favorite band in front of everyone.","모두가 보는 앞에서 미나가 가장 좋아하는 밴드에 대해 끔찍한 말을 했어."],"ow":["오답 ✕ — (A) band는 맞지만, 신디는 'tell her you're sorry'(미안하다고 말해)라고 했지 고맙다고 말하라는 말이 아니라서 (B)가 틀림.","오답 ✕ — 준수가 나쁘게 말한 대상은 노래가 아니라 'her favorite band'(미나가 가장 좋아하는 밴드)라서 (A)가 틀림.","정답 ○ — 'terrible things about her favorite band'(가장 좋아하는 밴드에 대한 끔찍한 말)를 했으므로 (A)=band이고, 신디가 'tell her you're sorry'(미안하다고 말해)라고 했으므로 (B)=sorry이다.","오답 ✕ — (B) sorry는 맞지만, 준수가 나쁘게 말한 것은 팀이 아니라 미나가 좋아하는 밴드라서 (A)가 틀림.","오답 ✕ — 영화나 인사(hello)는 대화에 나오지 않는다. 밴드에 대해 말한 일과 사과하라는 조언이 핵심이라서 둘 다 틀림."],"memo":["정답: ③ band - sorry","근거: terrible things about her favorite band(가장 좋아하는 밴드에 대한 끔찍한 말) / tell her you're sorry(미안하다고 말해)","함정: be sorry / say sorry = 사과하다"],"why":"준수는 미나가 좋아하는 밴드를 나쁘게 말했고, 신디는 미안하다고 말하라고 조언한다.","sum":"Junsu said terrible things about Mina's favorite (A) , so Cindy advises him to tell her he is (B) .","lab":"완성된 요약문 : "}],"dlg":[["G","Junsu. You look worried. What's the matter?","준수야. 걱정스러워 보여. 무슨 일이니?"],["B","Mina's upset and not talking to me. Can you give me some advice?","미나가 화가 나서 나랑 말을 안 해. 조언 좀 해 줄래?"],["G","Okay. Let me help you. What happened?","그래. 내가 도와줄게. 무슨 일이 있었니?"],["B","I said terrible things about her favorite band in front of everyone.","모두가 보는 앞에서 미나가 가장 좋아하는 밴드에 대해 끔찍한 말을 했어."],["G","Oh, no! You know she's really into them. Did you say sorry to her?","아, 이런! 미나가 그 밴드를 정말 좋아하는 거 알잖아. 미나에게 사과했니?"],["B","No, but I want to. What should I do?","아니, 하지만 하고 싶어. 어떻게 해야 할까?"],["G","I think you should tell her you're sorry and you didn't mean to hurt her feelings.","미안하다고, 그리고 상처 줄 생각은 아니었다고 말해야 한다고 생각해."],["B","Do you think she'll feel better?","미나가 기분이 나아질 것 같니?"],["G","Of course. Don't worry.","물론이지. 걱정하지 마."],["B","Okay, I'll do that. Thanks, Cindy.","알겠어, 그렇게 할게. 고마워, Cindy."]]},{"qs":[{"n":4,"q":"What is the girl's problem?","o":["She doesn't want to talk to Minji.","She argued with her best friend yesterday.","She doesn't know how to make Minji smile.","She doesn't know how to say sorry to Minji.","She doesn't know the reason for Minji's anger."],"a":4,"ans":"She doesn't know the reason for Minji's anger.","evs":[["Minji is mad at me, but I don't know why.","민지가 나한테 화가 났는데, 왜 그런지 모르겠어."]],"ev":["Minji is mad at me, but I don't know why.","민지가 나한테 화가 났는데, 왜 그런지 모르겠어."],"ow":["오답 ✕ — 소녀는 소년이 'I think you should talk to her.'(민지랑 이야기해 봐야 할 것 같아.)라고 하자 'Okay, I will.'(알겠어, 그럴게.)이라고 답했다. 이야기하기 싫은 것이 아니라서 틀림.","오답 ✕ — 어제 단짝 친구와 다퉜다는 말은 대화에 없다. 소녀의 고민은 'Minji is mad at me'(민지가 나한테 화가 났다)는 것이라서 틀림.","오답 ✕ — 민지를 웃게 하는 방법에 대한 말은 없다. 소녀는 화난 이유를 모른다고 했으므로 틀림.","오답 ✕ — 사과하는 방법을 모른다는 말은 없다. 'I don't know why'(왜 그런지 모르겠어)는 화난 이유를 모른다는 뜻이라서 틀림.","정답 ○ — 소녀는 'Minji is mad at me, but I don't know why.'(민지가 나한테 화가 났는데, 왜 그런지 모르겠어.)라고 했다. 소녀의 문제는 민지가 화난 이유를 모른다는 것이다."],"memo":["정답: ⑤ 민지가 화난 이유를 모른다","근거: Minji is mad at me, but I don't know why.(민지가 나한테 화가 났는데, 왜 그런지 모르겠어.)","함정: 'why'는 '왜(이유)'를 뜻한다"],"why":"소녀는 민지가 왜 화가 났는지 이유를 모르는 것이 문제이다."}],"dlg":[["B","You look down today. What's the matter?","오늘 기운이 없어 보여. 무슨 일이야?"],["G","Minji is mad at me, but I don't know why.","민지가 나한테 화가 났는데, 왜 그런지 모르겠어."],["B","Hmm. I think you should talk to her.","음. 민지랑 이야기해 봐야 할 것 같아."],["G","Okay, I will.","알겠어, 그럴게."]]},{"qs":[{"n":5,"q":"다음 담화의 내용과 일치하지 않는 것은?","o":["Jiwoo is the host of Boram Middle School Radio.","Boram Middle School Radio has a social media account.","Jiwoo tells the students to share their worries.","Students should send their messages by this Friday.","Some guests will give students advice on Worry Free Wednesday."],"a":4,"ans":"Some guests will give students advice on Worry Free Wednesday.","evs":[["I'll talk about them and try to give you some advice on Wednesday.","수요일에 그것들에 대해 이야기하고 조언을 해 드리려고 노력할게요."],["I am your host, DJ Jiwoo.","저는 진행자 DJ 지우입니다."]],"ev":["I'll talk about them and try to give you some advice on Wednesday.","수요일에 그것들에 대해 이야기하고 조언을 해 드리려고 노력할게요."],"ow":["오답 ✕ — 'I am your host, DJ Jiwoo.'(저는 진행자 DJ 지우입니다.)라고 했으므로 일치하는 내용이다. 일치하지 않는 것을 찾는 문제라서 답이 아니다.","오답 ✕ — 'through our social media account'(우리 소셜 미디어 계정을 통해)라고 했으므로 소셜 미디어 계정이 있다. 일치하는 내용이다.","오답 ✕ — 'Please share your worries with me'(여러분의 걱정을 저와 나눠 주세요)라고 했으므로 일치하는 내용이다.","오답 ✕ — 'Send your messages by this Friday.'(이번 주 금요일까지 메시지를 보내 주세요.)라고 했으므로 일치하는 내용이다.","정답 ○ — 수요일에 조언을 하는 사람은 손님들이 아니라 지우이다. 'I'll talk about them and try to give you some advice on Wednesday.'(수요일에 이야기하고 조언을 해 드리려고 노력할게요.)라고 했고 손님 이야기는 없어서 일치하지 않는다."],"memo":["정답: ⑤ 손님들이 조언해 줄 것이다 (✕ — 지우가 직접 조언한다)","근거: I'll talk about them and try to give you some advice on Wednesday.(수요일에 이야기하고 조언을 해 드리려고 노력할게요.)","함정: I'll = 말하는 사람(지우) 자신이 하겠다는 뜻"],"why":"수요일에 조언하는 사람은 손님이 아니라 진행자 지우이다."}],"dlg":[["B","Hello, everyone!","여러분, 안녕하세요!"],["B","Welcome to Boram Middle School Radio.","보람중학교 라디오에 오신 것을 환영합니다."],["B","I am your host, DJ Jiwoo.","저는 진행자 DJ 지우입니다."],["B","Next Wednesday is \"Worry Free Wednesday.\"","다음 주 수요일은 '걱정 없는 수요일'입니다."],["B","Do you have any worries on your mind?","마음속에 걱정이 있나요?"],["B","Let me help you.","제가 도와드릴게요."],["B","Please share your worries with me through our social media account.","우리 소셜 미디어 계정을 통해 여러분의 걱정을 저와 나눠 주세요."],["B","Send your messages by this Friday.","이번 주 금요일까지 메시지를 보내 주세요."],["B","I'll talk about them and try to give you some advice on Wednesday.","수요일에 그것들에 대해 이야기하고 조언을 해 드리려고 노력할게요."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Words can change our feelings.","Some words have an effect on our friendships.","“I always mess up” is an example of negative words.","Negative words may make you focus on correcting mistakes.","Positive thinking will make you improve your skill."],"a":3,"ans":"Negative words may make you focus on correcting mistakes.","evs":[["Negative words like \"I always mess up\" can make you feel down and want to stop trying.","\"난 항상 망쳐\"와 같은 부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만들 수 있습니다."]],"ev":["Negative words like \"I always mess up\" can make you feel down and want to stop trying.","\"난 항상 망쳐\"와 같은 부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만들 수 있습니다."],"ow":["오답 ✕ — 'They can make us feel good or bad.'(말은 우리를 기분 좋거나 나쁘게 만들 수 있습니다.)라고 했으므로 일치하는 내용이다. 일치하지 않는 것을 찾는 문제라서 답이 아니다.","오답 ✕ — 'The words which we choose can influence our thoughts, emotions, and friendships.'(우리가 선택하는 말은 생각, 감정, 우정에 영향을 미칠 수 있습니다.)라고 했으므로 일치하는 내용이다.","오답 ✕ — 'Negative words like \"I always mess up\"'(\"난 항상 망쳐\"와 같은 부정적인 말)라고 예를 들었으므로 일치하는 내용이다.","정답 ○ — 부정적인 말은 'make you feel down and want to stop trying'(기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만든다)고 했다. 실수를 고치는 데 집중하게 한다는 보기는 일치하지 않는다.","오답 ✕ — 'When you think positively, you can learn from your mistakes and improve your skills.'(긍정적인 사고를 할 때, 실수에서 배우고 실력을 향상할 수 있습니다.)라고 했으므로 일치하는 내용이다."],"memo":["정답: ④ 부정적인 말은 실수를 고치는 데 집중하게 한다 (✕)","근거: Negative words ... can make you feel down and want to stop trying.(부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만든다.)","함정: 부정적인 말 → 포기하고 싶어진다 (고치기 ✕)"],"why":"부정적인 말은 기분을 우울하게 하고 시도를 멈추고 싶게 만든다."},{"n":7,"q":"윗글의 주제로 알맞은 것은?","o":["the best way to dance well","the value of making mistakes","how to encourage friends in trouble","the importance of talking to oneself positively","the difference between positive and negative words"],"a":3,"ans":"the importance of talking to oneself positively","evs":[["Instead, encourage yourself with positive words.","대신 긍정적인 말로 자신을 격려해 보세요."],["Say It!","말해 보세요!"]],"ev":["Instead, encourage yourself with positive words.","대신 긍정적인 말로 자신을 격려해 보세요."],"ow":["오답 ✕ — 춤 연습은 'I didn't do well during dance practice.'(나는 춤 연습을 잘 못했어.)라는 예시 상황일 뿐이다. 춤을 잘 추는 방법을 알려 주는 글은 아니라서 틀림.","오답 ✕ — 'you can learn from your mistakes'(실수에서 배울 수 있다)는 말이 나오지만 세부 내용이다. 핵심은 실수의 가치가 아니라 긍정적인 말로 자신을 격려하는 것이라서 틀림.","오답 ✕ — 격려하는 대상은 친구가 아니라 자기 자신이다. 'encourage yourself with positive words'(긍정적인 말로 자신을 격려해 보세요)라고 했으므로 틀림.","정답 ○ — 'I always mess up'(난 항상 망쳐) 같은 부정적인 혼잣말 대신 'Instead, encourage yourself with positive words.'(대신 긍정적인 말로 자신을 격려해 보세요.)라고 했다. 자신에게 긍정적으로 말하는 것의 중요성이 주제이다.","오답 ✕ — 부정적인 말의 나쁜 점과 긍정적인 말을 모두 말하지만, 두 말의 차이를 비교하는 글이 아니다. 자신을 격려하라는 조언이 중심이라서 틀림."],"memo":["정답: ④ 자신에게 긍정적으로 말하는 것의 중요성","근거: Instead, encourage yourself with positive words.(대신 긍정적인 말로 자신을 격려해 보세요.)","함정: ③ 격려할 대상은 친구가 아니라 자기 자신(yourself)"],"why":"부정적인 혼잣말 대신 긍정적인 말로 자신을 격려하라는 글이다."}],"pp":[["Words have power.","말에는 힘이 있습니다."],["They can make us feel good or bad.","말은 우리를 기분 좋거나 나쁘게 만들 수 있습니다."],["The words which we choose can influence our thoughts, emotions, and friendships.","우리가 선택하는 말은 우리의 생각, 감정, 그리고 우정에 영향을 미칠 수 있습니다."],["Let's explore some common problems that students usually face.","학생들이 흔히 겪는 일반적인 문제들을 함께 살펴봅시다."],["You will understand the amazing power of words.","여러분은 말의 놀라운 힘을 이해하게 될 것입니다."],["\"I didn't do well during dance practice.","\"나는 춤 연습을 잘 못했어."],["I always mess up.\"","난 항상 망쳐.\""],["Negative words like \"I always mess up\" can make you feel down and want to stop trying.","\"난 항상 망쳐\"와 같은 부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만들 수 있습니다."],["Instead, encourage yourself with positive words.","대신 긍정적인 말로 자신을 격려해 보세요."],["When you think positively, you can learn from your mistakes and improve your skills.","긍정적인 사고를 할 때, 실수에서 배우고 실력을 향상할 수 있습니다."],["Say It!","말해 보세요!"],["\"I didn't dance well this time, but I'll keep practicing and get better.\"","\"이번에는 춤을 잘 못 췄지만, 계속 연습해서 더 잘할 거야.\""]]},{"qs":[{"n":8,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["lonely - respect","jealous - ignore","jealous - respect","proud - respect","jealous - copy"],"a":2,"ans":"jealous - respect","evs":[["We easily say negative things about others when we feel jealous.","우리는 질투를 느낄 때 다른 사람에 대해 부정적인 말을 쉽게 합니다."],["Instead, try to be happy for others and respect their efforts.","대신 다른 사람을 위해 기뻐하고 그들의 노력을 존중해 보세요."]],"ev":["We easily say negative things about others when we feel jealous.","우리는 질투를 느낄 때 다른 사람에 대해 부정적인 말을 쉽게 합니다."],"ow":["오답 ✕ — 부정적인 말을 하게 되는 때는 외로울(lonely) 때가 아니라 'when we feel jealous'(질투를 느낄 때)라서 (A)가 틀림.","오답 ✕ — (A) jealous는 맞지만, 'respect their efforts'(그들의 노력을 존중해 보세요)라고 했지 무시(ignore)하라는 말이 아니라서 (B)가 틀림.","정답 ○ — 'when we feel jealous'(질투를 느낄 때)와 'respect their efforts'(그들의 노력을 존중해 보세요)에 맞게 (A)=jealous, (B)=respect이다.","오답 ✕ — 부정적인 말은 자랑스러울(proud) 때가 아니라 'jealous'(질투할 때) 쉽게 나온다고 했으므로 (A)가 틀림.","오답 ✕ — (A) jealous는 맞지만, 다른 사람의 노력을 따라 하라(copy)는 말은 없다. 'respect their efforts'(존중해 보세요)라서 (B)가 틀림."],"memo":["정답: ③ jealous - respect","근거: when we feel jealous(질투를 느낄 때) / respect their efforts(그들의 노력을 존중해 보세요)","함정: jealous = 질투하는, respect = 존중하다"],"why":"질투를 느낄 때 부정적인 말을 하기 쉬우니 대신 다른 사람의 노력을 존중하라는 내용이다.","sum":"We easily say negative things about others when we feel (A) , but we should instead (B) their efforts.","lab":"완성된 요약문 : "}],"pp":[["\"Seongjun won first place in the contest?","\"성준이가 대회에서 1등을 했다고?"],["He's just too lucky.\"","그냥 운이 너무 좋네.\""],["We easily say negative things about others when we feel jealous.","우리는 질투를 느낄 때 다른 사람에 대해 부정적인 말을 쉽게 합니다."],["But using negative words like \"He's just too lucky\" doesn't let you grow.","그러나 \"그냥 운이 너무 좋네\"와 같은 부정적인 말을 하는 건 여러분이 성장하지 못하게 합니다."],["Instead, try to be happy for others and respect their efforts.","대신 다른 사람을 위해 기뻐하고 그들의 노력을 존중해 보세요."],["With positive words, you can learn from your friends, get along better, and focus on your own growth.","긍정적인 말을 통해 여러분은 친구에게서 배우고, 더 잘 지내며, 자신의 성장에 집중할 수 있습니다."],["Say It!","말해 보세요!"],["\"He did a great job.","\"그가 정말 잘했어."],["Good for him!","잘됐다!"],["I'll try hard, too!\"","나도 열심히 할 거야!\""]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하지 않는 것은?","o":["다른 사람 탓을 하는 것은 상대방의 기분을 망치게 한다.","부정적인 말은 우정에 좋지 않다.","팀워크를 위해 긍정적인 말이 필요하다.","말은 우리의 관계에도 영향을 미친다.","주변 사람의 말 때문에 화가 날 때, 그들과 똑같은 말을 써야 한다."],"a":4,"ans":"주변 사람의 말 때문에 화가 날 때, 그들과 똑같은 말을 써야 한다.","evs":[["Instead, show your support and cheer them up.","대신 지지를 보내고 그들을 응원해 주세요."],["However, negative words like \"It's your fault\" can hurt their feelings and damage your friendship.","하지만 \"네 잘못이야\"와 같은 부정적인 말은 상대방의 감정을 상하게 하고 우정을 해칠 수 있습니다."]],"ev":["Instead, show your support and cheer them up.","대신 지지를 보내고 그들을 응원해 주세요."],"ow":["오답 ✕ — 'negative words like \"It's your fault\" can hurt their feelings'(\"네 잘못이야\"와 같은 부정적인 말은 상대방의 감정을 상하게 할 수 있습니다)라고 했으므로 일치하는 내용이다. 일치하지 않는 것을 찾는 문제라서 답이 아니다.","오답 ✕ — '... and damage your friendship'(우정을 해칠 수 있습니다)이라고 했으므로 부정적인 말은 우정에 좋지 않다. 일치하는 내용이다.","오답 ✕ — 'Positive words will make your team develop strong teamwork'(긍정적인 말은 팀이 강한 팀워크를 키우게 할 것입니다)라고 했으므로 일치하는 내용이다.","오답 ✕ — 부정적인 말이 'damage your friendship'(우정을 해칠 수 있다)이고 긍정적인 말은 팀워크를 키운다고 했으므로, 말이 관계에 영향을 미친다는 보기는 일치하는 내용이다.","정답 ○ — 화가 나거나 일이 잘못되었을 때 똑같이 부정적인 말을 쓰라는 내용은 없다. 오히려 'Instead, show your support and cheer them up.'(대신 지지를 보내고 그들을 응원해 주세요.)라고 했으므로 일치하지 않는다."],"memo":["정답: ⑤ 화가 날 때 똑같은 말을 써야 한다 (✕ — 지지하고 응원하기)","근거: Instead, show your support and cheer them up.(대신 지지를 보내고 그들을 응원해 주세요.)","함정: Instead = 부정적인 말 '대신' 긍정적으로"],"why":"부정적인 말 대신 지지와 응원을 하라는 글이므로 똑같은 말을 써야 한다는 보기는 틀리다."},{"n":10,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["fault - teamwork","support - competition","support - teamwork","blame - friendship","support - mistakes"],"a":2,"ans":"support - teamwork","evs":[["Instead, show your support and cheer them up.","대신 지지를 보내고 그들을 응원해 주세요."],["Positive words will make your team develop strong teamwork and perform better next time.","긍정적인 말은 여러분의 팀이 강한 팀워크를 키우고 다음에는 더 잘할 수 있게 할 것입니다."]],"ev":["Instead, show your support and cheer them up.","대신 지지를 보내고 그들을 응원해 주세요."],"ow":["오답 ✕ — 'Instead, show your support'(대신 지지를 보내고)라고 했으므로 (A)는 fault(잘못)가 아니라 support이다. 'It's your fault'는 쓰지 말아야 할 말의 예라서 틀림.","오답 ✕ — (A) support는 맞지만, 긍정적인 말이 키워 주는 것은 경쟁(competition)이 아니라 'strong teamwork'(강한 팀워크)라서 (B)가 틀림.","정답 ○ — 'show your support and cheer them up'(지지를 보내고 응원해 주세요)이고, 'Positive words will make your team develop strong teamwork'(긍정적인 말은 팀이 강한 팀워크를 키우게 할 것입니다)이므로 (A)=support, (B)=teamwork이다.","오답 ✕ — 비난(blame)은 'we sometimes blame others'(가끔 다른 사람을 비난하기도 합니다)처럼 하지 말아야 할 행동이다. 보내야 하는 것은 support라서 (A)가 틀림.","오답 ✕ — (A) support는 맞지만, 긍정적인 말로 키우는 것은 실수가 아니라 팀워크라서 (B)가 틀림."],"memo":["정답: ③ support - teamwork","근거: show your support and cheer them up(지지를 보내고 응원해 주세요) / develop strong teamwork(강한 팀워크를 키운다)","함정: blame(비난하다)은 하지 말아야 할 행동"],"why":"비난 대신 지지와 응원을 보내면 팀워크가 강해진다.","sum":"Instead of blaming others, we should show our (A) and cheer them up, so the team can develop strong (B) .","lab":"완성된 요약문 : "}],"pp":[["\"We lost the game because of your mistake.","\"우리는 네 실수 때문에 게임에서 졌어."],["It's your fault.\"","네 잘못이야.\""],["When things go wrong, we sometimes blame others.","일이 잘못되었을 때 우리는 가끔 다른 사람을 비난하기도 합니다."],["However, negative words like \"It's your fault\" can hurt their feelings and damage your friendship.","하지만 \"네 잘못이야\"와 같은 부정적인 말은 상대방의 감정을 상하게 하고 우정을 해칠 수 있습니다."],["Instead, show your support and cheer them up.","대신 지지를 보내고 그들을 응원해 주세요."],["Positive words will make your team develop strong teamwork and perform better next time.","긍정적인 말은 여러분의 팀이 강한 팀워크를 키우고 다음에는 더 잘할 수 있게 할 것입니다."]
