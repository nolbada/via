<!doctype html>
<html lang="ko">
<head>

<title>해커스 리딩스마트 스타터 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.gl{margin:2px 0 10px;color:var(--muted);font-size:14px}.gl2{color:var(--muted);font-weight:400;font-size:.92em}.sq{margin:0 0 2px;font-size:16px}.sq u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}.rw{margin:6px 0;font-weight:700}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>

<script>
var P=[{"u":1,"id":"hs1-01-1","no":1,"ko":"왜 ‘돼지’ 저금통일까?","items":[{"n":1,"t":"tf","q":"In the 15th century, people in Europe kept their money in pots.","ko":"15세기에 유럽 사람들은 돈을 항아리에 보관했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","w":"4번 문장에 people kept(keep 보관하다의 과거형) their money in pots가 그대로 있어요. 돈을 항아리에 보관했다는 내용과 같아요.","c":"T","s":[[4,"In the 15th century in Europe, people kept their money in pots.","15세기에 유럽에서, 사람들은 그들의 돈을 항아리들에 보관했다."]]},"h":"21ef65d6dd"},{"n":2,"t":"tf","q":"In the 15th century, “pygg” sounded like “pig.”","ko":"15세기에 ‘pygg’는 ‘피그’처럼 들렸다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번 문장에서 그 당시 ‘pygg’는 ‘pug(퍼그)’처럼 들렸어요. ‘pig’처럼 말하기 시작한 건 시간이 흐른 뒤예요(9번).","c":"F","s":[[7,"At that time, “pygg” sounded like “pug.”","그 당시에, ‘pygg’는 ‘퍼그’처럼 들렸다."]]},"h":"aef5285498"},{"n":3,"t":"tf","q":"Piggy banks are used today because of a play on words.","ko":"돼지 저금통은 말장난 때문에 오늘날 사용된다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","w":"12번 문장에 because of a play on words(말장난 때문에)가 있어요. 소리가 비슷해서 돼지 저금통이 생겼다는 결론이에요.","c":"T","s":[[12,"So we use piggy banks today because of a play on words!","그래서 우리는 말장난 때문에 오늘날 돼지 저금통을 사용한다!"]]},"h":"c3aeb29925"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (English people had a clever idea.)","ko":"영국 사람들은 clever한 생각이 떠올랐다.","opts":["지루한","기발한","위험한","오래된"],"word":"clever","r":{"a":"2) 기발한","ev":"10~11번 문장","w":"영국 사람들이 떠올린 '기발한 생각'은 돈 항아리를 귀여운 작은 돼지처럼 만들자는 것이에요(11번). 그래서 clever는 '기발한'이에요.","c":2,"s":[[10,"In the 19th century, English people had a clever idea.","19세기에, 영국 사람들은 기발한 생각이 떠올랐다."],[11,"They asked potters to make money jars look like cute little pigs.","그들은 도예가들에게 돈 항아리를 귀여운 작은 돼지처럼 보이게 만들 것을 부탁했다."]]},"h":"e76a082fb7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Maybe you collect coins in your piggy bank.)","ko":"어쩌면 당신은 돼지 저금통에 동전을 collect할지도 모른다.","opts":["버리다","세다","숨기다","모으다"],"word":"collect","r":{"a":"4) 모으다","ev":"2번 문장","w":"돼지 저금통에는 동전을 모아요. collect는 '모으다'예요. 버리거나 숨기는 건 저금통의 쓰임이 아니에요.","c":4,"s":[[2,"Maybe you collect coins in your piggy bank.","어쩌면 당신은 돼지 저금통에 동전을 모을지도 모른다."]]},"h":"3257164ca0"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhy is it a pig and not a cat or dog?","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것은 왜 고양이나 개가 아니라 돼지인가?","opts":["돼지 저금통","동전","항아리","영어 단어"],"r":{"a":"1) 돼지 저금통","ev":"1~3번 문장","c":1,"s":[[1,"Do you have a piggy bank?","당신은 돼지 저금통을 가지고 있는가?"],[2,"Maybe you collect coins in your piggy bank.","어쩌면 당신은 돼지 저금통에 동전을 모을지도 모른다."],[3,"Why is it a pig and not a cat or dog?","그것은 왜 고양이나 개가 아니라 돼지인가?"]],"k":"it = 돼지 저금통"},"h":"6fbef59bb1","pron":"it"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Over time, the language changed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시간이 흐르며, 언어가 변했다.","opts":["시간이 지나자 사람들이 말하기를 멈췄다.","시간이 오래 걸려서 언어를 배웠다.","시간이 흐르면서 말이 달라졌다.","언어는 시간이 지나도 변하지 않았다."],"r":{"a":"3) 시간이 흐르면서 말이 달라졌다.","ev":"8번 문장","c":3,"s":[[8,"Over time, the language changed.","시간이 흐르며, 언어가 변했다."]]},"h":"f8e7906a28"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["15세기에 유럽 사람들은 돈을 나무 상자에 보관했다.","시간이 흐르며 사람들은 ‘pygg’를 ‘피그’처럼 말하기 시작했다.","15세기에 도예가들이 돼지 모양 항아리를 만들었다.","영국 사람들은 돼지 저금통을 처음부터 돼지 모양으로 만들었다."],"opts":["In the 15th century, people in Europe kept their money in wooden boxes.","Over time, people started saying “pygg” like “pig.”","Potters made pig-shaped jars in the 15th century.","English people made piggy banks in the shape of pigs from the start."],"r":{"a":"2) Over time, people started saying “pygg” like “pig.” (시간이 흐르며 사람들은 ‘pygg’를 ‘피그’처럼 말하기 시작했다.)","ev":"8~9번 문장","c":2,"s":[[8,"Over time, the language changed.","시간이 흐르며, 언어가 변했다."],[9,"People started saying “pygg” like “pig.”","사람들은 ‘pygg’를 ‘피그’처럼 말하기 시작했다."]]},"h":"04668e1355"},{"n":9,"t":"sum","q":"The money jars were made of orange (A) called “pygg,” and at that time “pygg” sounded like (B) .","ko":"돈 항아리는 ‘pygg’라고 불리는 주황색 (A)(으)로 만들어졌고, 그 당시에 ‘pygg’는 (B)처럼 들렸다.","opts":["(A) glass / (B) pig","(A) clay / (B) pig","(A) wood / (B) pug","(A) glass / (B) pug","(A) clay / (B) pug"],"oko":["A 유리 / B 피그","A 점토 / B 피그","A 나무 / B 퍼그","A 유리 / B 퍼그","A 점토 / B 퍼그"],"r":{"a":"5) (A) clay / (B) pug (A 점토 / B 퍼그)","ev":"5번, 7번 문장","s":[[5,"They were made of an orange clay called “pygg.”","그것들은 ‘pygg’라고 불리는 주황색 점토로 만들어졌었다."],[7,"At that time, “pygg” sounded like “pug.”","그 당시에, ‘pygg’는 ‘퍼그’처럼 들렸다."]],"c":5},"h":"efce2fd4b5"},{"n":10,"t":"fill","q":"They [A] potters to make money jars look like [B] little pigs.","ko":"그들은 도예가들에게 돈 항아리를 [B] 작은 돼지처럼 보이게 만들어 달라고 [A].","bank":["asked","cute","century","language","coins","pots"],"bko":{"asked":"부탁했다(ask의 과거)","cute":"귀여운","century":"세기","language":"언어","coins":"동전들","pots":"항아리들"},"r":{"a":"[A] asked (부탁했다(ask의 과거)), [B] cute (귀여운)","ev":"11번 문장","s":[[11,"They asked potters to make money jars look like cute little pigs.","그들은 도예가들에게 돈 항아리를 귀여운 작은 돼지처럼 보이게 만들 것을 부탁했다."]],"c":null},"h":"d6a5954718"}]},{"u":1,"id":"hs1-01-2","no":2,"ko":"멋을 위한 게 아니에요","items":[{"n":1,"t":"tf","q":"Remy the rat hides under the chef’s hat when he cooks.","ko":"생쥐 래미는 요리할 때 요리사의 모자 아래에 숨는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","w":"2번에서 래미가 요리할 때 어디에 숨는지 묻고, 3번에서 요리사의 높은 하얀 모자 아래라고 답해요.","c":"T","s":[[2,"Where does the rat, Remy, hide when he cooks?","생쥐인 래미는 요리할 때 어디에 숨는가?"],[3,"Under the chef’s tall white hat!","요리사의 높은 하얀 모자 아래이다!"]]},"h":"1cf9dd0ecf"},{"n":2,"t":"tf","q":"The chef with the shortest hat was the most skilled person in the kitchen.","ko":"가장 낮은 모자를 쓴 요리사가 주방에서 가장 숙련된 사람이었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번에서 가장 숙련된 사람은 가장 높은(tallest) 모자를 쓴 요리사예요. 낮은(shortest) 모자는 반대예요.","c":"F","s":[[7,"So the chef with the tallest hat was the most skilled person in the kitchen.","그래서 가장 높은 모자를 쓴 요리사는 주방에서 가장 숙련된 사람이었다."]]},"h":"b61cb9a173"},{"n":3,"t":"tf","q":"A hat with 100 folds meant the chef could cook 100 eggs.","ko":"100개의 주름을 가진 모자는 요리사가 계란 100개를 요리할 수 있다는 뜻이었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","w":"10번에서 100개의 주름은 계란을 100가지 방법(100 ways)으로 요리할 수 있다는 뜻이에요. 계란 100개가 아니에요.","c":"F","s":[[10,"For example, a hat with 100 folds meant the chef could cook an egg in 100 ways!","예를 들어, 100개의 주름을 가진 모자는 요리사가 100가지 방법으로 계란을 요리할 수 있었다는 것을 의미했다!"]]},"h":"e3d4143628"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A tall hat meant the chef had lots of experience.)","ko":"높은 모자는 요리사가 많은 experience를 가지고 있다는 것을 의미했다.","opts":["실수","기억","경험","재료"],"word":"experience","r":{"a":"3) 경험","ev":"6~7번 문장","w":"높은 모자는 요리사가 많은 경험을 가지고 있다는 뜻이고(6번), 그래서 가장 높은 모자를 쓴 요리사가 가장 숙련된 사람이에요(7번). experience는 '경험'이에요.","c":3,"s":[[6,"A tall hat meant the chef had lots of experience.","높은 모자는 요리사가 많은 경험을 가지고 있다는 것을 의미했다."],[7,"So the chef with the tallest hat was the most skilled person in the kitchen.","그래서 가장 높은 모자를 쓴 요리사는 주방에서 가장 숙련된 사람이었다."]]},"h":"30b6cd34af"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This traditional chef’s hat once told a lot about the chef.)","ko":"이 traditional한 요리사 모자는 한때 요리사에 대해 많은 것을 말해주었다.","opts":["현대적인","전통적인","특별한","비싼"],"word":"traditional","r":{"a":"2) 전통적인","ev":"4번 문장","w":"4번의 this traditional chef’s hat은 옛날부터 이어 온 전통 방식의 요리사 모자를 말해요. 그래서 traditional은 '전통적인'이에요.","c":2,"s":[[4,"This traditional chef’s hat once told a lot about the chef.","이 전통적인 요리사 모자는 한때 요리사에 대해 많은 것을 말해주었다."]]},"h":"d3e2efc96b"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nWhere does the rat, Remy, hide when he cooks?","ko":"밑줄 친 he가 가리키는 것은?","sko":"생쥐인 래미는 요리할 때 어디에 숨는가?","opts":["영화 <라따뚜이>","요리사","모자","생쥐 래미"],"r":{"a":"4) 생쥐 래미","ev":"2번 문장","c":4,"s":[[2,"Where does the rat, Remy, hide when he cooks?","생쥐인 래미는 요리할 때 어디에 숨는가?"]],"k":"he = 생쥐 래미"},"h":"df331fccd0","pron":"he"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The height of the hat showed the chef’s rank in the kitchen.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"모자의 높이는 주방에서 요리사의 지위를 보여주었다.","opts":["모자의 높이를 보면 주방에서 요리사의 지위를 알 수 있었다.","모자가 높을수록 요리사의 키가 컸다.","주방의 높이에 따라 모자 모양이 달랐다.","모든 요리사는 같은 높이의 모자를 썼다."],"r":{"a":"1) 모자의 높이를 보면 주방에서 요리사의 지위를 알 수 있었다.","ev":"5번 문장","c":1,"s":[[5,"The height of the hat showed the chef’s rank in the kitchen.","모자의 높이는 주방에서 요리사의 지위를 보여주었다."]]},"h":"626ef6aa0b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["가장 낮은 모자가 가장 높은 지위를 보여주었다.","래미는 요리사의 높은 모자 위에 앉아 있다.","요리사 모자의 주름에도 의미가 있었다.","모자의 높이는 요리사의 나이를 보여주었다."],"opts":["The shortest hat showed the highest rank.","Remy sits on top of the chef’s tall hat.","The folds in a chef’s hat had meaning, too.","The height of the hat showed the chef’s age."],"r":{"a":"3) The folds in a chef’s hat had meaning, too. (요리사 모자의 주름에도 의미가 있었다.)","ev":"8번 문장","c":3,"s":[[8,"The folds in the hat also had meaning.","모자의 주름들 또한 의미를 갖고 있었다."]]},"h":"e4d247d3ce"},{"n":9,"t":"sum","q":"Each fold in the hat (A) a chef’s (B) recipe.","ko":"모자의 각 주름은 요리사의 (B) 요리법을 (A).","opts":["(A) hid / (B) mastered","(A) represented / (B) forgotten","(A) cooked / (B) new","(A) represented / (B) mastered","(A) hid / (B) forgotten"],"oko":["A 숨겼다 / B 숙달된","A 나타냈다 / B 잊어버린","A 요리했다 / B 새로운","A 나타냈다 / B 숙달된","A 숨겼다 / B 잊어버린"],"r":{"a":"4) (A) represented / (B) mastered (A 나타냈다 / B 숙달된)","ev":"9번 문장","s":[[9,"Each fold represented a chef’s mastered recipe.","각각의 주름은 요리사의 숙달된 요리법을 나타냈다."]],"c":4},"h":"149696a41f"},{"n":10,"t":"fill","q":"For [A], a hat with 100 folds meant the chef could cook an egg in 100 [B] !","ko":"[A]: 100개의 주름을 가진 모자는 요리사가 계란을 100가지 [B](으)로 요리할 수 있다는 뜻이었다!","bank":["example","ways","height","kitchen","tall","rank"],"bko":{"example":"예시","ways":"방법들","height":"높이","kitchen":"주방","tall":"높은","rank":"지위"},"r":{"a":"[A] example (예시), [B] ways (방법들)","ev":"10번 문장","s":[[10,"For example, a hat with 100 folds meant the chef could cook an egg in 100 ways!","예를 들어, 100개의 주름을 가진 모자는 요리사가 100가지 방법으로 계란을 요리할 수 있었다는 것을 의미했다!"]],"c":null},"h":"d300c97ff8"}]},{"u":1,"id":"hs1-01-3","no":3,"ko":"누구나 안전하게~","items":[{"n":1,"t":"tf","q":"The card reader is on the ground of the crosswalk.","ko":"카드 판독기는 횡단보도 바닥에 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번에서 카드 판독기는 신호등 기둥(traffic light pole)에 있어요. 바닥이 아니에요.","c":"F","s":[[7,"At crosswalks, there is a card reader on the traffic light pole.","횡단보도에는, 신호등 기둥에 카드판독기가 있다."]]},"h":"b23312d2e6"},{"n":2,"t":"tf","q":"Many elderly people cannot cross the street in time.","ko":"연세가 드신 많은 분들은 제시간에 길을 건널 수 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장에 many elderly people ... cannot cross the street in time이 그대로 있어요. 그래서 이 문제를 해결할 제도가 필요해요.","c":"T","s":[[3,"But many elderly people and people with disabilities cannot cross the street in time.","하지만 연세가 드신 분들과 장애를 가진 많은 사람들은 제시간에 길을 건널 수 없다."]]},"h":"1496fc524d"},{"n":3,"t":"tf","q":"Green Man Plus is a system in Japan.","ko":"Green Man Plus는 일본에 있는 제도이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","w":"4번에서 이 제도가 있는 나라는 싱가포르(Singapore)예요. 일본이 아니에요.","c":"F","s":[[4,"In Singapore, there is a system to solve this problem.","싱가포르에는, 이 문제를 해결할 제도가 있다."]]},"h":"f442e4ddc7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But many elderly people and people with disabilities cannot cross the street in time.)","ko":"하지만 elderly한 많은 분들과 장애를 가진 사람들은 제시간에 길을 건널 수 없다.","opts":["어린","연세가 드신","키가 큰","힘이 센"],"word":"elderly","r":{"a":"2) 연세가 드신","ev":"3번, 6번 문장","w":"3번에서 elderly people은 길을 제시간에 건너기 힘든 사람들이고, 6번에서 60세 이상의 사람들이 특별한 카드를 가져요. 그래서 elderly는 '연세가 드신'이에요.","c":2,"s":[[3,"But many elderly people and people with disabilities cannot cross the street in time.","하지만 연세가 드신 분들과 장애를 가진 많은 사람들은 제시간에 길을 건널 수 없다."],[6,"People over 60 years old and people with disabilities have special cards.","60세 이상의 사람들과 장애가 있는 사람들은 특별한 카드를 가지고 있다."]]},"h":"3432451097"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In Singapore, there is a system to solve this problem.)","ko":"싱가포르에는, 이 문제를 solve할 제도가 있다.","opts":["만들다","설명하다","발견하다","해결하다"],"word":"solve","r":{"a":  명의 강한 신이 있었다."],[12,"They each pulled one side of the rock.","그들은 각자 바위의 한쪽을 잡아당겼다."],[14,"It broke apart.","그것은 갈라졌다."]],"w":"신들이 바위를 잡아당겨 갈라지게 했으니(12, 14번) powerful은 '강한'이에요.","c":2},"h":"9c11a8e552"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey each pulled one side of the rock.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 각자 바위의 한쪽을 잡아당겼다.","opts":["과학자들","바위의 두 조각","바다의 파도","두 명의 강한 신"],"r":{"a":"4) 두 명의 강한 신","ev":"10~12번 문장","s":[[10,"There were two powerful gods.","두 명의 강한 신이 있었다."],[11,"They fought over the rock.","그들은 바위를 두고 싸웠다."],[12,"They each pulled one side of the rock.","그들은 각자 바위의 한쪽을 잡아당겼다."]],"c":4,"k":"They = 두 명의 강한 신"},"pron":"They","h":"68002e1c56"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The frozen water broke the rock in half.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"언 물이 바위를 반으로 갈랐다.","opts":["언 물이 바위를 반으로 갈랐다.","바위가 언 물을 반으로 나누었다.","언 물이 바위를 녹여 없앴다.","바위의 반쪽이 언 물에 덮였다."],"r":{"a":"1) 언 물이 바위를 반으로 갈랐다.","ev":"8번 문장","s":[[8,"The frozen water broke the rock in half.","언 물이 바위를 반으로 갈랐다."]],"c":1},"h":"eb5d4be7d1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Split Apple Rock은 오렌지처럼 보인다.","과학자들은 거센 파도가 바위를 갈랐다고 말한다.","Split Apple Rock은 사과처럼 보인다.","전설에서는 한 과학자가 바위를 갈랐다."],"opts":["The Split Apple Rock looks like an orange.","Scientists say strong waves broke the rock.","The Split Apple Rock looks like an apple.","In the legend, a scientist broke the rock."],"r":{"a":"3) The Split Apple Rock looks like an apple. (Split Apple Rock은 사과처럼 보인다.)","ev":"2번, 4번 문장","s":[[2,"It looks like an apple.","그것은 사과처럼 보인다."],[4,"It is called the Split Apple Rock!","그것은 Split Apple Rock(갈라진 사과 바위)이라고 불린다!"]],"c":3},"h":"5839ca60f0"},{"n":9,"t":"sum","q":"Two gods (A) over the rock, and then it broke (B) .","ko":"두 신은 바위를 두고 (A), 바위는 (B) 갈라졌다.","opts":["(A) played / (B) slowly","(A) fought / (B) quietly","(A) danced / (B) apart","(A) fought / (B) apart","(A) played / (B) qu ,"t":"tf","q":"The teddy bear doctor will wear gloves and a mask.","ko":"곰 인형 의사는 장갑과 마스크를 착용할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"I will wear doctor’s gloves and a mask.","저는 의사 장갑과 마스크를 착용할 거예요."]],"w":"14번 문장에서 I will wear doctor’s gloves and a mask라고 해요. 의사가 장갑과 마스크를 착용한다는 내용과 일치해요.","c":"T"},"h":"af4f9b805d"},{"n":3,"t":"tf","q":"Emily will receive photos of Ted before the surgery.","ko":"Emily는 수술 전에 Ted의 사진을 받을 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"16번 문장","s":[[16,"After the surgery, you will receive progress photos of Ted’s recovery.","수술 후에, 당신은 Ted의 회복 경과 사진들을 받을 거예요."]],"w":"16번 문장에서 After the surgery(수술 후에) 회복 경과 사진을 받는다고 해요. 수술 전이 아니에요.","c":"F"},"h":"7d06bd979c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But my dog, Bailey, ripped him yesterday.)","ko":"하지만 제 강아지 Bailey가 어제 그를 rip했어요.","opts":["씻겼다","안았다","숨겼다","찢었다"],"word":"ripped","r":{"a":"4) 찢었다","ev":"5~6번 문장","s":[[5,"But my dog, Bailey, ripped him yesterday.","하지만 제 강아지 Bailey가 어제 그를 찢어버렸어요."],[6,"Can you fix him?","그를 고쳐 주실 수 있나요?"]],"w":"5번에서 강아지가 Ted에게 한 일 때문에 6번에서 Emily가 '고쳐 주실 수 있나요?'라고 물어요. 고쳐야 할 만큼 망가졌다는 뜻이니 '찢었다'가 알맞아요. rip = 찢다.","c":4},"h":"060cbee89a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (First, I’m going to ask you about his appearance when you first met him.)","ko":"우선, 저는 당신에게 그를 처음 만났을 때의 그의 appearance에 대해 물어볼 거예요.","opts":["나이","생김새","주소","가격"],"word":"appearance","r":{"a":"2) 생김새","ev":"11~12번 문장","s":[[11,"First, I’m going to ask you about his appearance when you first met him.","우선, 저는 당신에게 그를 처음 만났을 때의 그의 생김새에 대해 물어볼 거예요."],[12,"I want to make him look like that again.","저는 그가 다시 그렇게 보이도록 만들고 싶어요."]],"w":"11번에서 처음 만났을 때의 appearance를 묻고, 12번에서 그가 다시 그렇게 보이게 만들고 싶다고 해요. 어떻게 '보이는지'를 묻는 것이니 '생김새'예요.","c":2},"h":"81500e23a2"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nI want to make him look like that again.","ko":"밑줄 친 him이 가리키는 것은?","opts":["Bailey(강아지)","Emily","곰 인형 의사","Ted(곰 인형)"],"sko":"저는 그가 다시 그렇게 보이도록 만들고 싶어요.","r":{"a":"4) Ted(곰 인형)","ev":"11~12번 문장","s":[[11,"First, I’m going to ask you about his appearance when you first met him.","우선, 저는 당신에게 그를 처음 만났을 때의 그의 생김새에 대해 물어볼 거예요."],[12,"I want to make him look like that again.","저는 그가 다시 그렇게 보이도록 만들고 싶어요."]],"c":4,"k":"him = Ted(곰 인형)"},"h":"1d7d610da9","pron":"him"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You must be sad.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["당신은 슬픈 것 같아 보이지 않아요.","당신은 슬프겠네요.","당신은 슬퍼해서는 안 돼요.","당신은 슬픈 척을 하고 있어요."],"sko":"당신은 슬플 것이 틀림없어요(슬프겠네요).","r":{"a":"2) 당신은 슬프겠네요.","ev":"8번 문장","s":[[8,"You must be sad.","당신은 슬플 것이 틀림없어요(슬프겠네요)."]],"c":2},"h":"abdc895b95"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Emily will be able to play with Ted soon.","Emily will do the surgery for Ted herself.","Emily will not be able to play with Ted again.","The doctor already fixed Ted yesterday."],"oko":["Emily는 곧 Ted와 놀 수 있을 것이다.","Emily가 직접 Ted의 수술을 할 것이다.","Emily는 다시는 Ted와 놀 수 없을 것이다.","의사는 어제 이미 Ted를 고쳤다."],"r":{"a":"1) Emily will be able to play with Ted soon. (Emily는 곧 Ted와 놀 수 있을 것이다.)","ev":"18번 문장","s":[[18,"And you will be able to play with him soon!","그리고 당신은 곧 그와 함께 놀 수 있을 거예요!"]],"c":1},"h":"64b7f4a3a8"},{"n":9,"t":"sum","q":"Don’t (A) ! I have a (B) !","ko":"(A) 말아요! 저는 (B)이/가 있어요!","opts":["(A) forget / (B) plan","(A) worry / (B) dog","(A) forget / (B) dog","(A) run / (B) plan","(A) worry / (B) plan"],"oko":["A 잊지 / B 계획","A 걱정하지 / B 강아지","A 잊지 / B 강아지","A 뛰지 / B 계획","A 걱정하지 / B 계획"],"r":{"a":"5) (A) worry / (B) plan (A 걱정하지 / B 계획)","ev":"9~10번 문장","s":[[9,"But don’t worry.","하지만 걱정하지 말아요."],[10,"I have a plan!","저는 계획이 있어요!"]],"c":5},"h":"37b3014c10"},{"n":10,"t":"fill","q":"The doctor will [A] special tools like thread and [B] .","ko":"의사는 실과 [B] 같은 특별한 도구들을 [A].","bank":["use","needles","recovery","appearance","surgery","strong"],"bko":{"use":"사용한다","needles":"바늘","recovery":"회복","appearance":"생김새","surgery":"수술","strong":"튼튼한"},"r":{"a":"[A] use (사용한다), [B] needles (바늘)","ev":"15번 문장","s":[[15,"I will use special tools like thread and needles.","저는 실과 바늘과 같은 특별한 도구들을 사용할 거예요."]],"c":null},"h":"00a2589113"}]},{"u":4,"id":"hs1-04-3","no":3,"ko":"알레그로, 크레셴도!","items":[{"n":1,"t":"tf","q":"The words orchestra and opera came from Italian.","ko":"orchestra와 opera라는 단어는 이탈리아어에서 유래했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But they actually came from Italian!","하지만 그것들은 사실 이탈리아어에서 유래했다!"]],"w":"3번 문장에서 they(orchestra와 opera)는 사실 이탈리아어에서 유래했다고 해요. 영어 단어라는 생각(2번)은 틀린 생각이에요.","c":"T"},"h":"8f51258f5c"},{"n":2,"t":"tf","q":"Italians used English words on music scores.","ko":"이탈리아인들은 음악 악보에 영어 단어를 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"They used Italian words on music scores to describe the changes in speed and volume of music.","그들은 음악의 속도와 음량의 변화를 묘사하기 위해 음악 악보에 이탈리아어 단어들을 사용했다."]],"w":"8번 문장에서 이탈리아인들은 악보에 Italian words(이탈리아어 단어들)를 사용했다고 해요. 영어 단어가 아니에요.","c":"F"},"h":"4c203e2615"},{"n":3,"t":"tf","q":"Concerto and sonata are Italian names.","ko":"콘체르토와 소나타는 이탈리아어 이름이다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"They gave them Italian names, such as concerto and sonata.","그들은 그것들에 ‘콘체르토’와 ‘소나타’와 같은 이탈리아어 이름을 주었다."]],"w":"11번 문장에서 작곡가들은 악곡들에 이탈리아어 이름을 주었고, 그 예가 concerto와 sonata예요.","c":"T"},"h":"c6350f54ff"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They used Italian words on music scores to describe the changes in speed and volume of music.)","ko":"그들은 음악의 속도와 음량의 변화를 describe하기 위해 음악 악보에 이탈리아어 단어들을 사용했다.","opts":["숨기다","묘사하다","잊다","팔다"],"word":"describe","r":{"a":"2) 묘사하다","ev":"8~9번 문장","s":[[8,"They used Italian words on music scores to describe the changes in speed and volume of music.","그들은 음악의 속도와 음량의 변화를 묘사하기 위해 음악 악보에 이탈리아어 단어들을 사용했다."],[9,"For example, they used allegro (fast) and crescendo (louder).","예를 들어, 그들은 ‘알레그로(빠르게)’와 ‘크레셴도(더 크게)’를 사용했다."]],"w":"악보에 쓴 allegro(빠르게), crescendo(더 크게) 같은 단어는 속도와 음량의 변화를 '나타내는' 말이에요. 그래서 describe는 '묘사하다'예요.","c":2},"h":"0dc0d0d4fa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He created the modern system of writing down music around 1026.)","ko":"그는 1026년쯤 음악을 기록하는 modern 시스템을 만들었다.","opts":["오래된","작은","비싼","현대의"],"word":"modern","r":{"a":"4) 현대의","ev":"5~6번 문장","s":[[5,"It all started with the Italian monk Guido d’Arezzo.","그것은 모두 이탈리아의 수도승 Guido d’Arezzo로부터 시작했다."],[6,"He created the modern system of writing down music around 1026.","그는 1026년쯤 음악을 기록하는 현대의 시스템을 만들었다."]],"w":"6번은 Guido가 만든 시스템을 the modern system(현대의 시스템)이라고 소개해요. old(오래된)와 반대 방향의 말이에요. modern = 현대의.","c":4},"h":"bdb1b4a9e2"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey gave them Italian names, such as concerto and sonata.","ko":"밑줄 친 them이 가리키는 것은?","opts":["이탈리아어 단어들","이탈리아 작곡가들","새로운 유형의 악곡들","음악 악보들"],"sko":"그들은 그것들에 ‘콘체르토’와 ‘소나타’와 같은 이탈리아어 이름을 주었다.","r":{"a":"3) 새로운 유형의 악곡들","ev":"10~11번 문장","s":[[10,"Also, Italian composers created new types of compositions.","또한, 이탈리아 작곡가들은 새로운 유형의 악곡들을 창작했다."],[11,"They gave them Italian names, such as concerto and sonata.","그들은 그것들에 ‘콘체르토’와 ‘소나타’와 같은 이탈리아어 이름을 주었다."]],"c":3,"k":"them = 새로운 유형의 악곡들"},"h":"384f547e20","pron":"them"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Later, other Italians used this system, too.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["나중에 다른 이탈리아인들도 이 시스템을 사용했다.","나중에 다른 이탈리아인들은 이 시스템을 거부했다.","나중에 이탈리아인들이 새로운 시스템을 만들었다.","나중에 이 시스템은 영어를 쓰는 나라에서만 사용되었다."],"sko":"나중에, 다른 이탈리아인들 또한 이 시스템을 사용했다.","r":{"a":"1) 나중에 다른 이탈리아인들도 이 시스템을 사용했다.","ev":"7번 문장","s":[[7,"Later, other Italians used this system, too.","나중에, 다른 이탈리아인들 또한 이 시스템을 사용했다."]],"c":1},"h":"2ed87246f6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Guido d’Arezzo created the modern system around 1926.","Allegro means fast and crescendo means louder.","Allegro means slow and crescendo means quieter.","Composers gave English names to concerto and sonata."],"oko":["Guido d’Arezzo는 1926년쯤 현대의 시스템을 만들었다.","알레그로는 빠르게, 크레셴도는 더 크게라는 뜻이다.","알레그로는 느리게, 크레셴도는 더 작게라는 뜻이다.","작곡가들은 콘체르토와 소나타에 영어 이름을 주었다."],"r":{"a":"2) Allegro means fast and crescendo means louder. (알레그로는 빠르게, 크레셴도는 더 크게라는 뜻이다.)","ev":"9번 문장","s":[[9,"For example, they used allegro (fast) and crescendo (louder).","예를 들어, 그들은 ‘알레그로(빠르게)’와 ‘크레셴도(더 크게)’를 사용했다."]],"c":2},"h":"a372c48d9d"},{"n":9,"t":"sum","q":"Now, we call Italian the (A) of (B) !","ko":"오늘날, 우리는 이탈리아어를 (B)의 (A)(이)라고 부른다!","opts":["(A) price / (B) sports","(A) language / (B) sports","(A) color / (B) music","(A) language / (B) music","(A) color / (B) sports"],"oko":["A 가격 / B 스포츠","A 언어 / B 스포츠","A 색깔 / B 음악","A 언어 / B 음악","A 색깔 / B 스포츠"],"r":{"a":"4) (A) language / (B) music (A 언어 / B 음악)","ev":"12번 문장","s":[[12,"Now, we call Italian the language of music!","오늘날, 우리는 이탈리아어를 음악의 언어라고 부른다!"]],"c":4},"h":"99c7059923"},{"n":10,"t":"fill","q":"Like these words, many other musical [A] are from Italian. It all started with the Italian [B] Guido d’Arezzo.","ko":"이 단어들처럼, 다른 많은 음악 [A]이(가) 이탈리아어에서 왔다. 그것은 모두 이탈리아의 [B] Guido d’Arezzo로부터 시작했다.","bank":["terms","monk","history","fast","opera","sonata"],"bko":{"terms":"용어들","monk":"수도승","history":"역사","opera":"오페라","sonata":"소나타","fast":"빠른"},"r":{"a":"[A] terms (용어들), [B] monk (수도승)","ev":"4~5번 문장","s":[[4,"Like these words, many other musical terms are from Italian.","이 단어들처럼, 다른 많은 음악 용어들이 이탈리아어에서 왔다."],[5,"It all started with the Italian monk Guido d’Arezzo.","그것은 모두 이탈리아의 수도승 Guido d’Arezzo로부터 시작했다."]],"c":null},"h":"0e05c98007"}]},{"u":5,"id":"hs1-05-1","no":1,"ko":"또 낚였네, 낚였어!","items":[{"n":1,"t":"tf","q":"Many websites use clickbait to get more visitors and make more money.","ko":"많은 웹사이트들은 더 많은 방문자와 더 많은 돈을 얻으려고 낚시성 링크를 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6~7번 문장","s":[[6,"Many websites use clickbait.","많은 웹사이트들이 낚시성 링크를 사용한다."],[7,"They use it to attract more visitors and make more money.","그들은 더 많은 방문자를 끌어들이고 더 많은 돈을 벌기 위해 그것을 사용한다."]],"w":"6번에서 많은 웹사이트가 clickbait를 쓴다고 하고, 7번에서 더 많은 방문자를 끌어들이고 더 많은 돈을 벌기 위해서라고 해요.","c":"T"},"h":"f06f43d659"},{"n":2,"t":"tf","q":"After you click a clickbait link, the content is always related to the title.","ko":"낚시성 링크를 클릭하면, 내용은 항상 제목과 관련이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"When you click the link, you’ll see that the content is not related to the title.","그 링크를 클릭하면, 당신은 내용이 제목과 관련이 없다는 것을 알게 될 것이다."]],"w":"9번에서 클릭하면 내용이 제목과 관련이 없다는 것을 알게 될 것이라고 해요. '항상 관련이 있다'는 반대 내용이에요.","c":"F"},"h":"9abc76ce27"},{"n":3,"t":"tf","q":"A virus could be installed on your computer after you click a clickbait link.","ko":"낚시성 링크를 클릭한 뒤 당신의 컴퓨터에 바이러스가 설치될 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"A virus could even be installed on your computer.","심지어 당신의 컴퓨터에 바이러스가 설치될 수도 있다."]],"w":"11번에 A virus could even be installed on your computer가 있어요. 심지어 컴퓨터에 바이러스가 설치될 수도 있다는 뜻이에요.","c":"T"},"h":"c01fe75670"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They use it to attract more visitors ...)","ko":"그들은 더 많은 방문자를 attract하려고 그것을 사용한다.","opts":["쫓아내다","숨기다","끌어들이다","잃다"],"word":"attract","r":{"a":"3) 끌어들이다","ev":"7번 문장","s":[[7,"They use it to attract more visitors and make more money.","그들은 더 많은 방문자를 끌어들이고 더 많은 돈을 벌기 위해 그것을 사용한다."]],"w":"웹사이트가 낚시성 링크를 쓰는 이유가 더 많은 방문자와 돈이에요. 그러니 방문자를 '끌어들이다'가 맞아요. attract = 끌어들이다.","c":3},"h":"95f89090e3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (And unwanted advertisements might pop up.)","ko":"그리고 unwanted 광고들이 나타날 수 있다.","opts":["값비싼","원치 않는","재미있는","새로운"],"word":"unwanted","r":{"a":"2) 원치 않는","ev":"10번 문장","s":[[10,"And unwanted advertisements might pop up.","그리고 원치 않는 광고들이 나타날 수 있다."]],"w":"클릭했을 때 생기는 나쁜 일을 말하는 문장이에요. want(원하다)에 un-이 붙어서 unwanted는 '원치 않는'이에요.","c":2},"h":"94f99b59a2"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey use it to attract more visitors and make more money.","ko":"밑줄 친 They가 가리키는 것은?"," ined word? (Then, the fifth needle sucks up the blood.)","ko":"그러고 나서, 다섯 번째 바늘은 피를 suck up한다.","opts":["뿜어낸다","던진다","빨아 먹는다","자른다"],"word":"sucks","r":{"a":"3) 빨아 먹는다","ev":"8~9번 문장","s":[[8,"Then, the fifth needle sucks up the blood.","그러고 나서, 다섯 번째 바늘은 피를 빨아 먹는다."],[9,"It is just like a straw!","그것은 마치 빨대 같다!"]],"w":"바로 뒤 9번에서 빨대(straw) 같다고 했어요. 빨대로 하는 일이니 피를 '빨아 먹는다'가 맞아요. suck = 빨아 먹다.","c":3},"h":"65f5b01fac"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It also makes the bite so itchy!)","ko":"그것은 또한 물린 상처를 매우 itchy하게 만든다.","opts":["간지러운","차가운","딱딱한","시끄러운"],"word":"itchy","r":{"a":"1) 간지러운","ev":"12번 문장","s":[[12,"It also makes the bite so itchy!","그것은 또한 물린 상처를 매우 간지럽게 만든다!"]],"w":"모기에 물린 곳은 간질간질해요. 물린 상처를 itchy하게 만든다는 말이니 '간지러운'이에요.","c":1},"h":"8a78cd30f5"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nThe last one puts the mosquito’s saliva into your body.","ko":"밑줄 친 one이 가리키는 것은?","sko":"마지막 것은 모기의 타액을 당신의 몸에 넣는다.","opts":["모기","바늘","피","구멍"],"r":{"a":"2) 바늘","ev":"4번, 10번 문장","s":[[4,"Each needle has a special purpose.","각각의 바늘은 특별한 용도를 가지고 있다."],[10,"The last one puts the mosquito’s saliva into your body.","마지막 것은 모기의 타액을 당신의 몸에 넣는다."]],"c":2,"k":"one = 바늘"},"h":"92711e9a21","pron":"one"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Another pair keeps this hole open.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다른 한 쌍은 이 구멍을 계속 열려 있게 한다.","opts":["두 쌍의 바늘이 구멍을 파고 있다.","다른 한 쌍이 이 구멍을 닫아 버린다.","다른 한 쌍이 새 구멍을 하나 더 만든다.","다른 한 쌍이 이 구멍을 계속 열려 있게 한다."],"r":{"a":"4) 다른 한 쌍이 이 구멍을 계속 열려 있게 한다.","ev":"7번 문장","s":[[7,"Another pair keeps this hole open.","다른 한 쌍은 이 구멍을 계속 열려 있게 한다."]],"c":4},"h":"f815abf6a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["타액은 당신의 피부에 혹을 만든다.","두 개의 바늘은 빨대 같다.","여섯 개의 바늘 모두가 혈관을 찾는 데 쓰인다.","타액은 물린 곳을 덜 간지럽게 만든다."],"opts":["The saliva makes a bump on your skin.","Two needles are like straws.","All six needles are used to find blood vessels.","The saliva makes the bite less itchy."],"r":{"a":"1) The saliva makes a bump on your skin. (타액은 당신의 피부에 혹을 만든다.)","ev":"11번 문장","s":[[11,"The mosquito’s saliva makes a bump on your skin.","모기의 타액은 당신의 피부에 혹을 만든다."]],"c":1},"h":"cdf920da35"},{"n":9,"t":"sum","q":"A mosquito can bite you on a (A) night, and you might (B) it used one long needle.","ko":"모기는 (A) 밤에 당신을 물 수 있고, 당신은 그것이 긴 바늘 한 개를 사용했다고 (B)지도 모른다.","opts":["(A) winter / (B) think","(A) summer / (B) forget","(A) rainy / (B) think","(A) winter / (B) forget","(A) summer / (B) think"],"oko":["A 겨울 / B 생각할","A 여름 / B 잊을","A 비 오는 / B 생각할","A 겨울 / B 잊을","A 여름 / B 생각할"],"r":{"a":"5) (A) summer / (B) think (A 여름 / B 생각할)","ev":"1~2번 문장","s":[[1,"Have you ever been bitten by a mosquito on a summer night?","당신은 여름밤에 모기에 물려본 적 있는가?"],[2,"You might think it used one long needle to bite you.","당신은 그것이 당신을 물기 위해 한 개의 긴 바늘을 사용했다고 생각할지도 모른다."]],"c":5},"h":"a889a1ee39"},{"n":10,"t":"fill","q":"Each needle has a [A] [B] .","ko":"각각의 바늘은 [A] [B]을(를) 가지고 있다.","bank":["special","purpose","keeps","sucks","drills","puts"],"bko":{"special":"특별한","purpose":"용도","keeps":"계속 유지한다(keep의 3인칭 단수형)","sucks":"빨아 먹는다(suck의 3인칭 단수형)","drills":"드릴들(drill의 복수형)","puts":"넣는다(put의 3인칭 단수형)"},"r":{"a":"[A] special (특별한), [B] purpose (용도)","ev":"4번 문장","s":[[4,"Each needle has a special purpose.","각각의 바늘은 특별한 용도를 가지고 있다."]],"c":null},"h":"7a0f6e388e"}]},{"u":5,"id":"hs1-05-3","no":3,"ko":"간질간질, 찌릿찌릿!","items":[{"n":1,"t":"tf","q":"The “funny bone” is actually a nerve, not a bone.","ko":"‘funny bone’은 뼈가 아니라 사실 신경이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6~7번 문장","s":[[6,"It is not a bone.","그것은 뼈가 아니다."],[7,"It is actually a nerve.","그것은 사실 신경이다."]],"w":"6번에서 뼈가 아니라고 하고, 7번에서 사실은 신경이라고 해요.","c":"T"},"h":"ceb5810951"},{"n":2,"t":"tf","q":"Most nerves in the body are not protected by anything.","ko":"신체의 대부분의 신경은 그 어떤 것에 의해서도 보호받지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Most nerves in the body are protected by fat or muscle.","신체의 대부분의 신경은 지방이나 근육에 의해 보호받는다."]],"w":"10번에서 대부분의 신경은 지방이나 근육에 의해 보호받는다고 해요. 아무것에도 보호받지 않는 것은 자신경이에요(11번).","c":"F"},"h":"a36292b8ec"},{"n":3,"t":"tf","q":"When you hit the spot, the ulnar nerve is pressed against the bone near it.","ko":"그곳을 부딪치면, 자신경이 근처의 뼈에 눌린다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"So when you hit this spot, the nerve is directly pressed against the nearby bone.","그래서 당신이 이곳을 부딪치면, 그 신경이 근처의 뼈에 직접적으로 눌린다."]],"w":"12번에서 이곳을 부딪치면 신경이 근처의 뼈에 직접적으로 눌린다고 해요.","c":"T"},"h":"1438028d1b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It controls the movement of your hands.)","ko":"그것은 당신의 손의 움직임을 control한다.","opts":["만든다","통제한다","느낀다","부러뜨린다"],"word":"controls","r":{"a":"2) 통제한다","ev":"9번 문장","s":[[9,"It controls the movement of your hands.","그것은 당신의 손의 움직임을 통제한다."]],"w":"자신경이 손의 움직임에 대해 하는 일이에요. 움직임을 다스리고 조절하니 '통제한다'가 맞아요. control = 통제하다.","c":2},"h":"adb98b1c85"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But the nerve pain usually disappears quickly!)","ko":"하지만 그 신경통은 보통 빨리 disappear한다.","opts":["나타난다","커진다","변한다","사라진다"],"word":"disappears","r":{"a":"4) 사라진다","ev":"14번 문장","s":[[14,"But the nerve pain usually disappears quickly!","하지만 그 신경통은 보통 빨리 사라진다!"]],"w":"13번에서 아플 수 있다고 한 뒤 But으로 반대 이야기를 해요. 통증이 빨리 '사라진다'는 뜻이에요. disappear = 사라지다.","c":4},"h":"88aa77f019"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt controls the movement of your hands.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 당신의 손의 움직임을 통제한다.","opts":["자신경","팔꿈치","책상 가장자리","전기 충격"],"r":{"a":"1) 자신경","ev":"8~9번 문장","s":[[8,"It’s called the ulnar nerve.","그것은 자신경이라고 불린다."],[9,"It controls the movement of your hands.","그것은 당신의 손의 움직임을 통제한다."]],"c":1,"k":"It = 자신경"},"h":"aee851a029","pron":"It"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, the ulnar nerve is not protected by anything.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 자신경은 그 어떤 것에 의해서도 보호받지 않는다.","opts":["자신경은 지방과 근육이 모두 ined \"they\" refer to?\nSo they started wearing a wedding ring on the left fourth finger.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그래서 그들은 왼손의 네 번째 손가락에 결혼 반지를 끼기 시작했다.","opts":["결혼한 부부들","의사들","손가락들","고대 이집트 사람들"],"r":{"a":"4) 고대 이집트 사람들","ev":"3번, 5번 문장","s":[[3,"In ancient Egypt, people believed that a vein from the left fourth finger led directly to the heart.","고대 이집트에서, 사람들은 왼손의 네 번째 손가락의 정맥이 심장으로 곧장 이어진다고 믿었다."],[5,"So they started wearing a wedding ring on the left fourth finger.","그래서 그들은 왼손의 네 번째 손가락에 결혼 반지를 끼기 시작했다."]],"c":4,"k":"they = 고대 이집트 사람들"},"pron":"they","h":"75fe15b750"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This gave the finger its name, the ring finger.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그 손가락에 반지 손가락이라는 이름을 주었다.","opts":["이 일로 그 손가락에 반지 손가락이라는 이름이 붙었다.","이 일 때문에 그 손가락은 이름을 잃었다.","이 손가락이 처음으로 반지를 만들었다.","이 일은 반지에게 손가락이라는 이름을 주었다."],"r":{"a":"1) 이 일로 그 손가락에 반지 손가락이라는 이름이 붙었다.","ev":"6번 문장","s":[[6,"This gave the finger its name, the ring finger.","이것은 그 손가락에 반지 손가락이라는 이름을 주었다."]],"c":1},"h":"fa9c30c4fa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고대 이집트 사람들은 오른손에 결혼 반지를 꼈다.","의사들이 네 번째 손가락에서 심장으로 가는 특별한 신경을 찾았다.","고대 이집트 사람들은 심장이 따뜻함과 사랑의 상징이라고 생각했다.","오늘날 결혼한 부부들은 네 번째 손가락에 결혼 반지를 거의 끼지 않는다."],"opts":["In ancient Egypt, people wore wedding rings on the right hand.","Doctors found a special nerve from the fourth finger to the heart.","The ancient Egyptians thought the heart was a symbol of warmth and love.","Few married couples wear wedding rings on the fourth finger now."],"r":{"a":"3) The ancient Egyptians thought the heart was a symbol of warmth and love. (고대 이집트 사람들은 심장이 따뜻함과 사랑의 상징이라고 생각했다.)","ev":"4번, 5번, 7번, 9번 문장","s":[[4,"They thought the heart was a symbol of warmth and love, and these were important for a happy marriage.","그들은 심장이 따뜻함과 사랑의 상징이라고 생각했고, 이것들은 행복한 결혼생활을 위해 중요했다."],[5,"So they started wearing a wedding ring on the left fourth finger.","그래서 그들은
