 I were not a physicist, I would probably be a musician.”","아인슈타인은 음악을 너무나 사랑해서 그는 한때 “내가 물리학자가 아니었다면, 나는 아마도 음악가였을 것이다”라고 말하기도 했다."]],"w":"「so much that」은 '너무 ~해서 …하다'이고, If I were not a physicist, I would probably be a musician은 '물리학자가 아니었다면 아마 음악가였을 것'이라는 가정이에요. 실제로 음악가로 일했다거나 음악을 그만두었다는 말은 없어요.","c":4},"h":"ae6abd3e4d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["앤더슨은 공연이 끝난 뒤 호텔에서 환영을 받았다.","아인슈타인은 인종차별을 흑인들의 질병이라고 불렀다.","앤더슨과 아인슈타인은 음악 학교에서 처음 만났다.","앤더슨과 아인슈타인은 음악에 대한 강한 관심을 공유했다."],"opts":["Anderson was welcomed by the hotel after her performance.","Einstein called racism a disease of Black people.","Anderson and Einstein first met at a music school.","Anderson and Einstein shared a strong interest in music."],"r":{"a":"4) Anderson and Einstein shared a strong interest in music.","ev":"8번 문장","s":[[8,"They shared a strong interest in music.","그들은 음악에 대한 강한 관심을 공유했다."]],"w":"8번에서 두 사람은 음악에 대한 강한 관심을 공유했다고 해요. 앤더슨은 호텔에서 거절당했고(3번), 아인슈타인은 인종차별을 '백인들의 질병'이라고 불렀으며(12번), 두 사람은 공연장에서 만난 것이지 음악 학교에서 만난 것이 아니에요(5번).","c":4},"h":"7b3a84f492"},{"n":9,"t":"sum","q":"Anderson and Einstein became (A) friends from that special night, and their bond went beyond (B).","ko":"앤더슨과 아인슈타인은 그 특별한 밤부터 (A) 친구로 지냈고, 그들의 유대감은 (B)을(를) 넘어섰다.","oko":["(A) 먼 / (B) 나이","(A) 가까운 / (B) 나이","(A) 먼 / (B) 인종","(A) 가까운 / (B) 음악","(A) 가까운 / (B) 인종"],"opts":["(A) distant / (B) age","(A) close / (B) age","(A) distant / (B) race","(A) close / (B) music","(A) close / (B) race"],"r":{"a":"5) (A) close / (B) race (가까운 / 인종)","ev":"13번 문장","s":[[13,"From that special night, they stayed close friends, exemplifying a profound bond that went beyond race!","그 특별한 밤부터, 그들은 인종을 초월한 깊은 유대감을 보여주며, 가까운 친구로 지냈다!"]],"w":"13번에서 그 특별한 밤부터 둘은 가까운(close) 친구로 지냈고, 인종(race)을 초월한 깊은 유대감을 보여 주었다고 해요. 먼, 나이, 음악은 본문과 맞지 않아요.","c":5},"h":"d8c65e323f"},{"n":10,"t":"fill","q":"One night in 1937, Marian Anderson, a talented singer who [A] the [B] of opera, gave a performance at McCarter Theatre, New Jersey.","ko":"1937년 어느 날 밤, 오페라의 [B]을(를) [A] 재능 있는 가수 마리안 앤더슨이 뉴저지의 맥카터 극장에서 공연을 했다.","bank":["transformed","landscape","outstanding","profound","nearby","unique"],"bko":{"transformed":"바꾼(transform의 과거)","landscape":"판도","outstanding":"뛰어난","profound":"깊은","nearby":"근처의","unique":"독특한"},"r":{"a":"[A] transformed (바꾼), [B] landscape (판도)","ev":"1번 문장","s":[[1,"One night in 1937, Marian Anderson, a talented singer who transformed the landscape of opera, gave a performance at McCarter Theatre, New Jersey.","1937년 어느 날 밤, 오페라의 판도를 바꾼 재능 있는 가수인 마리안 앤더슨이 뉴저지의 맥카터 극장에서 공연을 했다."]],"w":"1번에서 앤더슨은 오페라의 판도(landscape)를 바꾼(transformed) 재능 있는 가수라고 소개돼요. outstanding, profound, nearby, unique는 형용사라서 이 자리에 들어갈 수 없어요.","c":null},"h":"6ad66d4ab8"}]},{"u":9,"id":"ms1-09-3","no":3,"ko":"흘렸으면 치우셔야죠!","items":[{"n":1,"t":"tf","q":"A person sheds about 500 million skin cells in one day.","ko":"사람은 하루에 약 5억 개의 피부 세포를 떨어뜨린다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In fact, you shed about 500 million skin cells each day.","사실, 당신은 매일 약 5억 개의 피부 세포를 떨어뜨린다."]],"w":"6번에서 당신은 매일(each day) 약 5억 개의 피부 세포를 떨어뜨린다고 해요.","c":"T"},"h":"6ab2b44554"},{"n":2,"t":"tf","q":"The passage says most of the dust under the bed comes from fine dust in the air outside.","ko":"이 글은 침대 밑 먼지의 대부분이 바깥 공기 속 미세먼지에서 온다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"Could it be because of all the fine dust in the air outside?","그것이 전부 외부 공기에 있는 미세먼지 때문일 수 있을까?"],[4,"Actually, much of the dust under your bed is made up of tiny pieces of your skin!","사실, 침대 밑의 먼지 중 대부분은 피부의 작은 조각들로 이루어져 있다!"]],"w":"3번은 바깥 미세먼지 때문일까 하고 짐작해 본 질문일 뿐이고, 4번 Actually 뒤에서 먼지의 대부분은 피부의 작은 조각으로 이루어져 있다고 해요.","c":"F"},"h":"62d5f5c50b"},{"n":3,"t":"tf","q":"Johanna van Bronswijk is a Dutch biologist whose research shows that household dust comes only from outside the house.","ko":"요한나 판 브론스베이크는 집 안 먼지가 오직 집 밖에서만 온다는 것을 보여 준 네덜란드 생물학자이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"According to research by Dutch biologist Johanna van Bronswijk, up to 50 percent of household dust comes from the human body.","네덜란드 생물학자 요한나 판 브론스베이크의 연구에 따르면, 집 안 먼지의 최대 50퍼센트가 사람의 몸에서 나온다."]],"w":"5번에서 그녀는 네덜란드 생물학자가 맞지만, 연구 결과는 집 안 먼지의 최대 50퍼센트가 사람의 몸에서 나온다는 것이에요. 오직 집 밖에서만 온다는 말은 본문과 달라요.","c":"F"},"h":"952cd7346f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… as you crouch to pick up your phone from under the bed)","ko":"… 당신은 휴대폰을 침대 밑으로부터 줍기 위해 몸을 숙이다가","opts":["뛰어오르다","몸을 숙이다","소리를 지르다","돌아서다"],"word":"crouch","r":{"a":"2) 몸을 숙이다","ev":"1번 문장","s":[[1,"“No way!” you shout loudly as you crouch to pick up your phone from under the bed.","“말도 안 돼!” 당신은 휴대폰을 침대 밑으로부터 줍기 위해 몸을 숙이다가 큰 소리로 외친다."]],"w":"휴대폰이 침대 밑에 있어서 줍기 위해 낮게 몸을 숙이는 모습이에요. crouch는 '몸을 숙이다, 웅크리다'예요. 소리를 지르는 것은 같은 문장의 shout예요.","c":2},"h":"57bdc39613"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… it also allows unwanted bugs to hide.)","ko":"… 원치 않는 벌레들이 숨을 수 있게 한다.","opts":["반가운","귀여운","희귀한","원치 않는"],"word":"unwanted","r":{"a":"4) 원치 않는","ev":"9번 문장","s":[[9,"The problem is that this buildup of dust not only negatively affects your breathing, but it also allows unwanted bugs to hide.","문제는, 이 먼지의 축적이 당신의 호흡에 부정적으로 영향을 미칠 뿐만 아니라, 원치 않는 벌레들이 숨을 수 있게 한다는 것이다."]],"w":"9번은 먼지가 쌓이면 생기는 '문제'를 말하는 문장이에요. 벌레가 숨는 것은 반가운 일이 아니므로 unwanted는 '원치 않는'이에요.","c":4},"h":"b31818fd05"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSome of them find their way under the bed.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그것들 중 일부는 침대 밑으로 도달한다.","opts":["피부 세포들","침대 다리들","꽃가루들","옷들"],"r":{"a":"1) 피부 세포들","ev":"6~7번 문장","s":[[6,"In fact, you shed about 500 million skin cells each day.","사실, 당신은 매일 약 5억 개의 피부 세포를 떨어뜨린다."],[7,"Some of them find their way under the bed.","그것들 중 일부는 침대 밑으로 도달한다."]],"w":"6번에서 매일 약 5억 개의 skin cells(피부 세포)를 떨어뜨린다고 했고, 7번의 them은 그중 일부가 침대 밑으로 간다는 뜻이에요. 꽃가루와 옷은 8번에서 처음 나와요.","c":1},"h":"7f275bf382"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why it’s important to sweep under your bed regularly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 당신의 침대 밑을 정기적으로 쓸어주는 것이 중요한 이유이다.","opts":["그래서 침대 밑을 정기적으로 쓸어 주는 것이 중요하다.","그래서 침대 밑은 전혀 쓸 필요가 없다.","그래서 침대 밑은 한 번만 쓸면 평생 깨끗하다.","그래서 침대 밑 청소는 중요하지 않아 가끔만 하면 된다."],"r":{"a":"1) 그래서 침대 밑을 정기적으로 쓸어 주는 것이 중요하다.","ev":"10번 문장","s":[[10,"That’s why it’s important to sweep under your bed regularly.","그것이 당신의 침대 밑을 정기적으로 쓸어주는 것이 중요한 이유이다."]],"w":"10번은 앞에서 말한 문제들 때문에 침대 밑을 정기적으로(regularly) 쓸어 주는 것이 중요하다는 뜻이에요. 쓸 필요가 없다거나 한 번이면 충분하다거나 가끔만 하면 된다는 말은 아니에요.","c":1},"h":"9d357b7c87"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["침대 밑에는 먼지가 많다.","침대 밑은 완벽하게 깨끗하다.","침대 밑에는 먼지가 조금밖에 없다.","먼지는 천장에서만 발견된다."],"opts":["There is a lot of dust under the bed.","The area under the bed is perfectly clean.","There is only a little dust under the bed.","Dust is found only on the ceiling."],"r":{"a":"1) There is a lot of dust under the bed. (침대 밑에는 먼지가 많다.)","ev":"2번 문장","s":[[2,"There’s so much dust down there!","아래에는 먼지가 너무 많다!"]],"w":"2번에서 침대 밑에는 먼지가 너무 많다(so much dust)고 해요. 완벽하게 깨끗하다거나 조금밖에 없다거나 천장에서만 발견된다는 말은 본문에 없어요.","c":1},"h":"31443bbd12"},{"n":9,"t":"sum","q":"Over time, skin cells under the bed (A) with other dust particles from sources such as (B) and clothes.","ko":"시간이 지나면서 침대 밑의 피부 세포는 (B), 옷 같은 출처에서 온 다른 먼지 입자와 (A).","oko":["(A) 섞인다 / (B) 꽃가루","(A) 섞인다 / (B) 금속","(A) 분리된다 / (B) 꽃가루","(A) 분리된다 / (B) 금속","(A) 싸운다 / (B) 모래"],"opts":["(A) mix / (B) pollen","(A) mix / (B) metal","(A) separate / (B) pollen","(A) separate / (B) metal","(A) fight / (B) sand"],"r":{"a":"1) (A) mix / (B) pollen (섞인다 / 꽃가루)","ev":"8번 문장","s":[[8,"Over time, they mix with other dust particles from various sources like pollen and clothes.","시간이 지남에 따라, 그것들은 꽃가루나 옷과 같은 다양한 출처에서 온 다른 먼지 입자들과 섞인다."]],"w":"8번에서 시간이 지나면 피부 세포는 꽃가루(pollen)나 옷 같은 출처의 다른 먼지 입자와 섞인다(mix)고 해요. 분리된다, 싸운다, 금속, 모래는 본문과 맞지 않아요.","c":1},"h":"65965ee9b5"},{"n":10,"t":"fill","q":"Get a [A] and start [B]!","ko":"[A]을(를) 가져와서 [B]을(를) 시작하라!","bank":["broom","cleaning","regularly","negatively","loudly","actually"],"bko":{"broom":"빗자루","cleaning":"청소","regularly":"정기적으로","negatively":"부정적으로","loudly":"큰 소리로","actually":"사실"},"r":{"a":"[A] broom (빗자루), [B] cleaning (청소)","ev":"12번 문장","s":[[12,"Get a broom and start cleaning!","빗자루를 가져와서 청소를 시작하라!"]],"w":"12번에서 빗자루(broom)를 가져와서 청소(cleaning)를 시작하라고 해요. regularly, negatively, loudly, actually는 부사라서 이 자리에 들어갈 수 없어요.","c":null},"h":"fc593980ba"}]},{"u":9,"id":"ms1-09-4","no":4,"ko":"Boss, This Is Not a Waste of Time!","items":[{"n":1,"t":"tf","q":"The water cooler effect can also happen around a coffee machine or a printer.","ko":"워터쿨러 효과는 커피 머신이나 프린터 주변에서도 일어날 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The effect can occur around other shared devices, such as a coffee machine or printer.","이 효과는 커피 머신이나 프린트기와 같이, 다른 공용 기기들 주변에서도 발생할 수 있다."]],"w":"6번에서 이 효과는 커피 머신이나 프린터 같은 다른 공용 기기 주변에서도 발생할 수 있다고 해요.","c":"T"},"h":"c9814e49e2"},{"n":2,"t":"tf","q":"The water cooler effect is named after a machine that sells coffee to employees.","ko":"워터쿨러 효과는 직원들에게 커피를 파는 기계의 이름을 따서 지어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"This is due to the water cooler effect, which is named after the machine that dispenses drinking water.","이는 워터쿨러 효과 때문인데, 이것은 식수를 공급하는 기계의 이름을 따서 이름 지어졌다."]],"w":"4번에서 워터쿨러 효과는 식수를 공급하는(dispenses drinking water) 기계의 이름을 따서 지어졌어요. 커피를 파는 기계가 아니에요.","c":"F"},"h":"7fd259ad1a"},{"n":3,"t":"tf","q":"According to researchers at MIT, social interactions like the one in the lounge may reduce productivity at work.","ko":"MIT 연구진에 따르면, 휴게실에서와 같은 사회적 상호작용은 직장에서 생산성을 떨어뜨릴 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"According to researchers at MIT’s Human Dynamics Lab, social interactions like this can benefit the company, increasing productivity among workers!","MIT의 인간 역학 연구소 연구진에 따르면, 이러한 사회적 상호작용은 회사에 이익을 줄 수 있으며, 직원들 간의 생산성을 높일 수 있다!"]],"w":"3번에서 연구진은 이런 사회적 상호작용이 회사에 이익이 되고 직원들 사이의 생산성을 높일 수 있다고 해요. 생산성을 떨어뜨린다는 말은 반대예요.","c":"F"},"h":"25b09f0045"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… the machine that dispenses drinking water)","ko":"… 식수를 공급하는 기계","opts":["검사하다","공급하다","보관하다","판매를 금지하다"],"word":"dispenses","r":{"a":"2) 공급하다","ev":"4번 문장","s":[[4,"This is due to the water cooler effect, which is named after the machine that dispenses drinking water.","이는 워터쿨러 효과 때문인데, 이것은 식수를 공급하는 기계의 이름을 따서 이름 지어졌다."]],"w":"워터쿨러는 마시는 물이 나오는 기계예요. dispense는 '(필요한 것을) 내주다, 공급하다'라서 machine that dispenses drinking water는 '식수를 공급하는 기계'예요.","c":2},"h":"00056b92b5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… when their boss walks in, frowning at the employees.)","ko":"… 상사가 들어와 직원들에게 눈살을 찌푸린다.","opts":["손뼉을 치며","미소를 지으며","고개를 숙이며","눈살을 찌푸리며"],"word":"frowning","r":{"a":"4) 눈살을 찌푸리며","ev":"1~2번 문장","s":[[1,"Some office workers are gathered in the lounge, laughing over a joke when their boss walks in, frowning at the employees.","몇몇 사무실 직원들이 휴게실에 모여 농담을 하며 웃고 있는데, 상사가 들어와 직원들에게 눈살을 찌푸린다."],[2,"But actually, he shouldn’t be too concerned.","하지만 사실, 상사는 너무 걱정하지 않아도 된다."]],"w":"1번에서 상사가 웃고 있는 직원들을 보고 있고, 2번에서 But actually로 상사가 너무 걱정할 필요가 없다고 해요. 상사가 못마땅해하는 표정이므로 frowning은 '눈살을 찌푸리며'예요.","c":4},"h":"fdc1ccdb04"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAnd as they become more comfortable with one another, it becomes more natural to talk about the challenges they face at work!","ko":"밑줄 친 they가 가리키는 것은?","sko":"그리고 그들이 서로에 대해 더 편해지면서, 그들이 직장에서 직면하는 어려움들에 관해 이야기하는 것이 더 자연스러워진다!","opts":["공통 관심사를 가진 사람들","직장 상사들","온라인 플랫폼들","MIT의 연구원들"],"r":{"a":"1) 공통 관심사를 가진 사람들","ev":"7~8번 문장","s":[[7,"Those with common interests can form bonds while chatting.","공통 관심사를 가진 사람들은 잡담하면서 유대 관계를 형성할 수 있다."],[8,"And as they become more comfortable with one another, it becomes more natural to talk about the challenges they face at work!","그리고 그들이 서로에 대해 더 편해지면서, 그들이 직장에서 직면하는 어려움들에 관해 이야기하는 것이 더 자연스러워진다!"]],"w":"8번의 they는 앞 7번에서 잡담하며 유대 관계를 형성하는 공통 관심사를 가진 사람들을 가리켜요. 서로 더 편해지는 쪽은 잡담을 나누는 사람들이지 상사나 연구원, 온라인 플랫폼이 아니에요.","c":1,"k":"they = 공통 관심사를 가진 사람들"},"pron":"they","h":"3205392ed3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This can lead to more efficient problem solving and even collaboration on projects.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 더 효율적인 문제 해결과 심지어는 프로젝트 협력으로도 이어질 수 있다.","opts":["이는 더 효율적인 문제 해결로, 나아가 프로젝트 협력으로도 이어질 수 있다.","이는 문제 해결을 더 느리게 하고 프로젝트 협력을 막을 수 있다.","이는 문제 해결을 위해 협력을 중단하게 만들 수 있다.","이는 프로젝트가 끝난 뒤에야 문제 해결로 이어진다."],"r":{"a":"1) 이는 더 효율적인 문제 해결로, 나아가 프로젝트 협력으로도 이어질 수 있다.","ev":"9번 문장","s":[[9,"This can lead to more efficient problem solving and even collaboration on projects.","이는 더 효율적인 문제 해결과 심지어는 프로젝트 협력으로도 이어질 수 있다."]],"w":"9번은 이것이 더 효율적인 문제 해결(problem solving)과 심지어 프로젝트 협력(collaboration)으로도 이어질 수 있다는 뜻이에요. 문제 해결을 느리게 한다거나 협력을 중단시킨다는 말은 본문에 없어요.","c":1},"h":"8f79854307"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["직원들은 엔터테인먼트나 스포츠처럼 업무와 무관한 주제로 대화를 나누곤 한다.","직원들은 엔터테인먼트나 스포츠 이야기를 하는 것이 금지되어 있다.","직원들은 워터쿨러 주변에서 오직 업무 이야기만 한다.","직원들은 공용 기기 주변에 절대 모이지 않는다."],"opts":["Employees often chat about topics unrelated to work, such as entertainment or sports.","Employees are not allowed to talk about entertainment or sports.","Employees only talk about their work around the water cooler.","Employees never gather around shared devices."],"r":{"a":"1) Employees often chat about topics unrelated to work, such as entertainment or sports. (직원들은 엔터테인먼트나 스포츠처럼 업무와 무관한 주제로 대화를 나누곤 한다.)","ev":"5번 문장","s":[[5,"Employees typically gather around it and have casual conversations on subjects unrelated to work, such as entertainment or sports.","직원들은 일반적으로 그것 주변에 모여서 엔터테인먼트나 스포츠 등 업무와 무관한 주제들에 관한 일상적인 대화를 나눈다."]],"w":"5번에서 직원들은 모여서 엔터테인먼트나 스포츠 같은 업무와 무관한 주제로 일상적인 대화를 나눈다고 해요. 금지되어 있다거나 업무 이야기만 한다거나 절대 모이지 않는다는 말은 본문에 없어요.","c":1},"h":"8e77e1e5fc"},{"n":9,"t":"sum","q":"Chatting at work is not simply (A) time, because it strengthens relationships through mutual (B).","ko":"직장에서의 잡담은 단순히 시간을 (A) 것이 아닌데, 상호 (B)을(를) 통해 관계를 강화하기 때문이다.","oko":["(A) 아끼는 / (B) 이해","(A) 낭비하는 / (B) 이해","(A) 낭비하는 / (B) 경쟁","(A) 아끼는 / (B) 경쟁","(A) 즐기는 / (B) 침묵"],"opts":["(A) saving / (B) understanding","(A) wasting / (B) understanding","(A) wasting / (B) competition","(A) saving / (B) competition","(A) enjoying / (B) silence"],"r":{"a":"2) (A) wasting / (B) understanding (낭비하는 / 이해)","ev":"11번 문장","s":[[11,"They’re not simply wasting their time; they’re strengthening relationships through mutual understanding.","그들은 단순히 시간을 낭비하는 것이 아니라, 상호 이해를 통해 관계를 강화하고 있는 것이다."]],"w":"11번에서 그들은 단순히 시간을 낭비하는(wasting) 것이 아니라 상호 이해(understanding)를 통해 관계를 강화하고 있다고 해요. 아끼는, 즐기는, 경쟁, 침묵은 본문과 맞지 않아요.","c":2},"h":"c8003bff78"},{"n":10,"t":"fill","q":"Recently, with the rise of [A] work, the water cooler is being [B] by online platforms.","ko":"최근에, [A] 근무의 증가와 함께, 워터쿨러는 온라인 플랫폼으로 [B] 있다.","bank":["remote","replaced","gather","dispenses","engage","frowning"],"bko":{"remote":"원격의","replaced":"대체되고","gather":"모이다","dispenses":"공급하다","engage":"참여하다","frowning":"눈살을 찌푸리는"},"r":{"a":"[A] remote, [B] replaced","ev":"10번 문장","s":[[10,"Recently, with the rise of remote work, the water cooler is being replaced by online platforms where people can engage in casual conversations through instant messaging.","최근에, 원격 근무의 증가와 함께, 워터쿨러는 사람들이 인스턴트 메시지를 통해 일상적인 대화에 참여할 수 있는 온라인 플랫폼으로 대체되고 있다."]],"w":"10번은 remote work(원격 근무)가 늘면서 워터쿨러가 온라인 플랫폼으로 대체되고 있다는 문장이에요. is being replaced는 수동태의 현재진행형이라 p.p.인 replaced가 들어가요. 나머지 단어는 다른 문장에 나오는 말이거나 이 자리의 문법에 맞지 않아요.","c":null},"h":"db9f264f5a"}]},{"u":10,"id":"ms1-10-1","no":1,"ko":"상심도 병원비가 나옵니다","items":[{"n":1,"t":"tf","q":"Having a broken heart is more than just an expression.","ko":"심장이 찢어진다는 것은 단순한 하나의 표현 이상이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"But having a broken heart is more than just an expression.","그러나 심장이 찢어진다는 것은 단순한 하나의 표현 이상이다."],[3,"As it turns out, intense sadness or stress can actually affect the human heart negatively, resulting in a real condition called broken-heart syndrome.","밝혀지기로는, 격렬한 슬픔이나 스트레스는 실제로 인간의 심장에 부정적으로 영향을 미칠 수 있으며, 상심 증후군이라 불리는 실제 질환을 초래할 수 있다."]],"w":"2번에서 But 뒤에 more than just an expression(단순한 표현 이상)이라고 하고, 3번에서 실제 질환인 상심 증후군을 설명해요. 그래서 맞는 내용이에요.","c":"T"},"h":"a56eedd9af"},{"n":2,"t":"tf","q":"When our body faces emotional trauma, it releases a hormone that calms the heart.","ko":"몸이 정서적 트라우마에 직면하면, 심장을 진정시키는 호르몬을 방출한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"When faced with emotional trauma, our body responds by releasing a stress hormone called adrenaline.","정서적 트라우마에 직면할 때, 우리의 몸은 아드레날린이라 불리는 스트레스 호르몬을 방출함으로써 반응한다."]],"w":"4번에서 몸이 방출하는 것은 아드레날린이라는 '스트레스 호르몬'이에요. 심장을 진정시키는 호르몬이라는 말은 본문과 달라요.","c":"F"},"h":"627c92f96d"},{"n":3,"t":"tf","q":"In extreme cases, the heart permanently changes shape.","ko":"극단적인 경우, 심장은 영구적으로 형태를 바꾼다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"In extreme cases, the heart temporarily changes shape, with part of it increasing in size and becoming less effective at pumping blood.","극단적인 경우, 심장은 그 일부가 크기가 커지고 혈액을 펌프질하는 데 덜 효과적이게 되면서, 일시적으로 형태를 바꾼다."]],"w":"7번에서 심장은 temporarily(일시적으로) 형태를 바꾼다고 해요. permanently(영구적으로)는 본문과 달라요.","c":"F"},"h":"aa627da506"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… intense sadness or stress can actually affect the human heart negatively …)","ko":"… 격렬한 슬픔이나 스트레스는 실제로 인간의 심장에 부정적으로 영향을 미칠 수 있다.","opts":["약한","짧은","격렬한","흔한"],"word":"intense","r":{"a":"3) 격렬한","ev":"3번 문장","s":[[3,"As it turns out, intense sadness or stress can actually affect the human heart negatively, resulting in a real condition called broken-heart syndrome.","밝혀지기로는, 격렬한 슬픔이나 스트레스는 실제로 인간의 심장에 부정적으로 영향을 미칠 수 있으며, 상심 증후군이라 불리는 실제 질환을 초래할 수 있다."]],"w":"3번에서 intense sadness or stress가 심장에 나쁜 영향을 줘서 상심 증후군이라는 실제 질환까지 일으킨다고 해요. 약하거나 짧은 슬픔이 아니라 매우 강한 슬픔이라서 '격렬한'이에요.","c":3},"h":"e465eae0ef"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The adrenaline may even attach directly to the heart cells, which can stop the heart from beating normally.)","ko":"아드레날린은 심지어 심장 세포에 직접 달라붙을 수도 있는데, 그것은 심장이 정상적으로 뛰는 것을 멈추게 할 수 있다.","opts":["달라붙다","떨어지다","녹다","사라지다"],"word":"attach","r":{"a":"1) 달라붙다","ev":"6번 문장","s":[[6,"The adrenaline may even attach directly to the heart cells, which can stop the heart from beating normally.","아드레날린은 심지어 심장 세포에 직접 달라붙을 수도 있는데, 그것은 심장이 정상적으로 뛰는 것을 멈추게 할 수 있다."]],"w":"6번에서 아드레날린이 심장 세포에 직접 붙어서 심장이 정상적으로 뛰는 것을 멈추게 할 수 있다고 해요. 그래서 attach는 '달라붙다'예요.","c":1},"h":"cb3da1fdf8"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThe end result is an experience similar to that of a heart attack, including chest pain, dizziness, and breathing difficulty.","ko":"밑줄 친 that이 가리키는 것은?","sko":"최종 결과는 가슴 통증, 어지러움, 그리고 호흡 곤란을 포함하여 심장 마비와 유사한 경험이다.","opts":["아드레날린","경험","혈류","동맥"],"r":{"a":"2) 경험","ev":"8번 문장","s":[[8,"The end result is an experience similar to that of a heart attack, including chest pain, dizziness, and breathing difficulty.","최종 결과는 가슴 통증, 어지러움, 그리고 호흡 곤란을 포함하여 심장 마비와 유사한 경험이다."]],"w":"that of a heart attack는 '심장 마비의 경험'이라는 뜻이에요. that은 바로 앞의 an experience(경험)를 대신해요.","c":2},"h":"8ed99c3898"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The release of adrenaline causes the small arteries that carry blood to the heart to get tighter, leading to a short-term drop in blood flow.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아드레날린의 방출은 심장으로 혈액을 운반하는 작은 동맥들이 더 좁아지게 만들어, 단기적인 혈류 감소로 이어진다.","opts":["아드레날린이 방출되면 심장의 작은 동맥이 넓어져 혈류가 잠깐 늘어난다.","아드레날린이 방출되면 혈액이 심장 세포에 달라붙어 동맥이 사라진다.","심장으로 혈액을 나르는 동맥이 좁아지면 아드레날린이 오랫동안 방출된다.","아드레날린이 방출되면 심장으로 혈액을 나르는 작은 동맥이 좁아져 혈류가 잠깐 줄어든다."],"r":{"a":"4) 아드레날린이 방출되면 심장으로 혈액을 나르는 작은 동맥이 좁아져 혈류가 잠깐 줄어든다.","ev":"5번 문장","s":[[5,"The release of adrenaline causes the small arteries that carry blood to the heart to get tighter, leading to a short-term drop in blood flow.","아드레날린의 방출은 심장으로 혈액을 운반하는 작은 동맥들이 더 좁아지게 만들어, 단기적인 혈류 감소로 이어진다."]],"w":"causes A to get tighter는 'A가 더 좁아지게 만든다', a short-term drop in blood flow는 '단기적인 혈류 감소'예요. 아드레날린이 원인이고 동맥이 좁아지는 것이 결과예요.","c":4},"h":"84a8fde37b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["의사들만 ‘심장이 찢어진다’는 말로 슬픔을 표현한다.","사람들은 심장 마비를 겪은 뒤에만 ‘심장이 찢어진다’고 말한다.","사람들은 힘든 시기를 겪을 때 종종 심장이 찢어진다고 말한다.","힘든 시기에는 사람들이 ‘심장이 찢어진다’는 말을 절대 쓰지 않는다."],"opts":["Only doctors use the word “heartbroken” to describe sadness.","People say they are heartbroken only after they have a heart attack.","People often say they are heartbroken when they go through tough times.","People never use the word “heartbroken” when times are tough."],"r":{"a":"3) People often say they are heartbroken when they go through tough times.","ev":"1번 문장","s":[[1,"When we go through tough times, we often say we are heartbroken.","우리가 힘든 시기를 겪을 때, 우리는 종종 심장이 찢어진다(가슴이 아프다)고 말한다."]],"w":"1번에서 우리는 힘든 시기를 겪을 때 종종 heartbroken이라고 말한다고 해요. 의사만 쓴다거나 심장 마비 뒤에만 쓴다는 말은 본문에 없어요.","c":3},"h":"09608f4352"},{"n":9,"t":"sum","q":"In most cases of broken-heart syndrome, patients are (A) to permanent heart (B).","ko":"상심 증후군의 대부분의 경우, 환자들은 영구적인 심장 (B)에 대해 (A).","oko":["(A) 안전하다 / (B) 운동","(A) 취약하다 / (B) 손상","(A) 안전하다 / (B) 손상","(A) 취약하다 / (B) 운동","(A) 약하다 / (B) 손상"],"opts":["(A) safe / (B) exercise","(A) vulnerable / (B) damage","(A) safe / (B) damage","(A) vulnerable / (B) exercise","(A) weak / (B) damage"],"r":{"a":"3) (A) safe / (B) damage (안전하다 / 손상)","ev":"9번 문장","s":[[9,"But unlike with a heart attack, patients are mostly safe from permanent heart damage.","그러나 심장 마비와 달리, 환자들은 대부분 영구적인 심장 손상으로부터 안전하다."]],"w":"9번에서 환자들은 대부분 영구적인 심장 손상(damage)으로부터 안전하다(safe)고 해요. 취약하다, 약하다, 운동은 본문과 맞지 않아요.","c":3},"h":"e43f7fb23e"},{"n":10,"t":"fill","q":"Therefore, they tend to make a full [A] within [B] or even a few days.","ko":"따라서, 그들은 [B] 또는 심지어 며칠 내에 완전한 [A]에 이르는 경향이 있다.","bank":["recovery","weeks","release","affect","carry","tighten"],"bko":{"recovery":"회복","weeks":"몇 주","release":"방출하다","affect":"영향을 미치다","carry":"운반하다","tighten":"좁아지다"},"r":{"a":"[A] recovery (회복), [B] weeks (몇 주)","ev":"10번 문장","s":[[10,"Therefore, they tend to make a full recovery within weeks or even a few days.","따라서, 그들은 몇 주 또는 심지어 며칠 내에 완전히 회복하는 경향이 있다."]],"w":"10번에서 환자들은 몇 주(weeks) 또는 심지어 며칠 내에 완전히 회복(recovery)하는 경향이 있다고 해요. release, affect, carry, tighten은 동사라서 이 자리에 들어갈 수 없어요.","c":null},"h":"939657c5b4"}]},{"u":10,"id":"ms1-10-2","no":2,"ko":"내 이름이 적힌 콜라가 있다?","items":[{"n":1,"t":"tf","q":"Some nations used job titles and terms of affection in their versions of the campaign.","ko":"일부 나라들은 캠페인에서 직업명과 애칭을 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Some nations added creative twists by using job titles like “teacher” or “police officer” as well as terms of affection like “friend,” while keeping the original concept.","일부 나라들은 기존의 콘셉트를 유지하면서도 ‘선생님’ 또는 ‘경찰관’과 같은 직업명이나 ‘친구’와 같은 애칭을 사용함으로써 창의적인 변형을 더했다."]],"w":"10번에서 일부 나라들이 ‘선생님’, ‘경찰관’ 같은 직업명과 ‘친구’ 같은 애칭을 사용해 변형을 더했다고 해요.","c":"T"},"h":"1f7c453b02"},{"n":2,"t":"tf","q":"In 2011, the Coca-Cola branch in Australia was enjoying growing sales.","ko":"2011년, 코카콜라의 호주 지사는 늘어나는 매출을 누리고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"In 2011, the Coca-Cola branch in Australia was experiencing decreasing sales.","2011년, 코카콜라의 호주 지사는 감소하는 매출을 경험하고 있었다."]],"w":"6번에서 호주 지사는 감소하는(decreasing) 매출을 겪고 있었다고 해요. 늘어나는 매출은 본문과 반대예요.","c":"F"},"h":"a90667b656"},{"n":3,"t":"tf","q":"Seeing their own names on the bottles did not create any connection with the product.","ko":"병에 있는 자신의 이름을 보는 것은 제품과 어떤 유대감도 만들지 못했다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Seeing their own names on the bottles created a strong connection with the product, making the consumers’ purchases feel special.","자신의 이름이 병에 있는 것을 보는 것은 제품과 강한 유대감을 만들어냈고, 소비자들의 구매가 특별하게 느껴지게 했다."]],"w":"12번에서 자신의 이름을 보는 것이 제품과 강한 유대감(a strong connection)을 만들었다고 해요.","c":"F"},"h":"d4df3e0d42"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The company launched the “Share a Coke” campaign to address this.)","ko":"회사는 이를 해결하기 위해 ‘코카콜라를 나누세요’ 캠페인을 시작했다.","opts":["해결하다","피하다","축소하다","발표하다"],"word":"address","r":{"a":"1) 해결하다","ev":"7번 문장","s":[[7,"The company launched the “Share a Coke” campaign to address this.","회사는 이를 해결하기 위해 ‘코카콜라를 나누세요’ 캠페인을 시작했다."]],"w":"6번의 매출 감소가 문제이고, 7번에서 이를 위해 캠페인을 시작했어요. 그래서 address는 '(문제를) 해결하다'예요.","c":1},"h":"728a746356"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… pick bottles with particular names so that they could present them as gifts to family and friends.)","ko":"… 가족과 친구들에게 선물하도록 특정 이름이 있는 병들을 고르는 것 …","opts":["흔한","특정한","오래된","짧은"],"word":"particular","r":{"a":"2) 특정한","ev":"13번 문장","s":[[13,"It was also common for buyers to pick bottles with particular names so that they could present them as gifts to family and friends.","그들이 가족과 친구들에게 그것들을 선물하도록 특정 이름이 있는 병들을 고르는 것도 흔했다."]],"w":"13번에서 구매자들은 선물할 사람의 이름이 적힌 병, 즉 '특정한' 이름의 병을 골랐어요.","c":2},"h":"24bcff52fe"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWould you buy it?","ko":"밑줄 친 it이 가리키는 것은?","sko":"당신은 그것을 살까?","opts":["편의점","음료 코너","당신의 이름이 적힌 음료","여름날"],"r":{"a":"3) 당신의 이름이 적힌 음료","ev":"2~3번 문장","s":[[2,"There, you see a drink with your name on it!","그곳에서, 당신은 당신의 이름이 적힌 음료를 본다!"],[3,"Would you buy it?","당신은 그것을 살까?"]],"w":"2번에서 당신의 이름이 적힌 음료(a drink with your name on it)를 보았고, 3번에서 그것을 살지 물어요. it은 그 음료예요.","c":3},"h":"271858b3a8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This emotional appeal is a psychological strategy that Coca-Cola wisely used in its product marketing.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 감성적 호소는 코카콜라가 자사 제품 마케팅에서 현명하게 사용한 심리 전략이다.","opts":["코카콜라는 감정에 호소하는 마케팅을 시도했지만 심리 전략이 부족해 실패했다.","코카콜라는 심리 전략을 배우려고 다른 회사의 마케팅을 그대로 따라 했다.","이러한 심리 전략은 제품의 맛을 좋게 하려고 코카콜라가 쓴 방법이다.","코카콜라는 제품 마케팅에서 소비자의 감정에 호소하는 심리 전략을 현명하게 활용했다."],"r":{"a":"4) 코카콜라는 제품 마케팅에서 소비자의 감정에 호소하는 심리 전략을 현명하게 활용했다.","ev":"5번 문장","s":[[5,"This emotional appeal is a psychological strategy that Coca-Cola wisely used in its product marketing.","이러한 감성적 호소는 코카콜라가 자사 제품 마케팅에서 현명하게 사용한 심리 전략이다."]],"w":"5번은 앞 장면의 이름이 적힌 음료에 끌리는 마음을 emotional appeal(감성적 호소)이라 부르고, 코카콜라가 이를 마케팅에 현명하게(wisely) 썼다는 뜻이에요.","c":4},"h":"f74f7921fd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["호주 캠페인에는 15개의 이름만 선택되었다.","모든 나라가 병에 똑같은 이름을 사용했다.","David와 Lucy 같은 이름이 캠페인을 위해 병에 인쇄되었다.","캠페인은 다른 나라에 퍼지기 전에 호주에서 끝났다."],"opts":["Only 15 names were chosen for the campaign in Australia.","Every country used exactly the same names on the bottles.","Names such as David and Lucy were printed on bottles for the campaign.","The campaign ended in Australia before it reached other countries."],"r":{"a":"3) Names such as David and Lucy were printed on bottles for the campaign.","ev":"8번 문장","s":[[8,"For the campaign, 150 of the most common names in the nation, such as David and Lucy, were printed on bottles.","캠페인을 위해, David와 Lucy와 같이 그 나라에서 가장 흔한 이름 150개가 병에 인쇄되었다."]],"w":"8번에서 가장 흔한 이름 150개, 예를 들어 David와 Lucy가 병에 인쇄되었어요. 이름은 15개가 아니라 150개이고(8번), 캠페인은 70개 이상의 나라로 확장되었으며(9번), 나라마다 변형을 더했어요(10번).","c":3},"h":"e85e416655"},{"n":9,"t":"sum","q":"The (A) to the success of the “Share a Coke” campaign lies in (B).","ko":"‘코카콜라를 나누세요’ 캠페인 성공의 (A)은(는) (B)에 있다.","oko":["(A) 비결 / (B) 가격","(A) 걸림돌 / (B) 개인화","(A) 비결 / (B) 개인화","(A) 걸림돌 / (B) 가격","(A) 위험 / (B) 가격"],"opts":["(A) key / (B) price","(A) barrier / (B) personalization","(A) key / (B) personalization","(A) barrier / (B) price","(A) danger / (B) price"],"r":{"a":"3) (A) key / (B) personalization (비결 / 개인화)","ev":"11번 문장","s":[[11,"The key to the success of the “Share a Coke” campaign lies in personalization.","‘코카콜라를 나누세요’ 캠페인 성공의 비결은 개인화에 있다."]],"w":"11번에서 ‘Share a Coke’ 캠페인 성공의 비결(key)은 개인화(personalization)에 있다고 해요. 걸림돌, 위험, 가격은 본문과 맞지 않아요.","c":3},"h":"2e04fb7256"},{"n":10,"t":"fill","q":"Sales of Coca-Cola [A] by 4 percent, leading to the campaign’s [B] to over 70 other countries.","ko":"코카콜라의 매출은 4퍼센트 [A], 이는 70개 이상의 다른 나라들로 캠페인 [B]을(를) 이끌었다.","bank":["increased","expansion","printed","special","original","common"],"bko":{"increased":"증가했고(increase의 과거)","expansion":"확장","printed":"인쇄된","special":"특별한","original":"기존의","common":"흔한"},"r":{"a":"[A] increased, [B] expansion","ev":"9번 문장","s":[[9,"Remarkably, sales of Coca-Cola increased by 4 percent, leading to the campaign’s expansion to over 70 other countries.","놀랍게도, 코카콜라의 매출은 4퍼센트 증가했고, 이는 70개 이상의 다른 나라들로 캠페인의 확장을 이끌었다."]],"w":"9번에서 매출이 4퍼센트 늘었고(increased), 그 결과 캠페인이 70개 이상의 나라로 확장되었어요(expansion). printed, special, original, common은 다른 문장에 나온 단어라 이 자리에 맞지 않아요.","c":null},"h":"a88bc6b5a7"}]},{"u":10,"id":"ms1-10-3","no":3,"ko":"하늘로 솟구치는 온천","items":[{"n":1,"t":"tf","q":"Te Puia is located on the North Island of New Zealand.","ko":"테 푸이아는 뉴질랜드의 북섬에 위치해 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Anyone planning a trip to New Zealand should visit Te Puia, a natural wonderland located on the North Island.","뉴질랜드 여행을 계획하는 사람이라면 누구나 북섬에 위치한 자연의 낙원인 테 푸이아를 방문해야 한다."]],"w":"1번에서 테 푸이아는 북섬에 위치한(located on the North Island) 자연의 낙원이라고 해요.","c":"T"},"h":"8cd66c1df2"},{"n":2,"t":"tf","q":"The Pohutu Geyser erupts only once a day.","ko":"포후투 간헐천은 하루에 한 번만 분출한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Erupting up to 20 times a day, it produces columns of steam and water to a maximum of 30 meters in height.","하루에 최대 20번까지 분출하며, 그것은 최대 30미터 높이까지 증기와 물기둥을 만들어낸다."]],"w":"5번에서 하루에 최대 20번(up to 20 times a day)까지 분출한다고 해요. 하루에 한 번만이라는 말은 본문과 달라요.","c":"F"},"h":"45f9112521"},{"n":3,"t":"tf","q":"The Maori people built a cultural center to hide their history from visitors.","ko":"마오리족은 방문객들에게 자신들의 역사를 숨기기 위해 문화 센터를 세웠다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"To share their rich history, the Maori have established a cultural center at the site.","그들의 풍부한 역사를 공유하기 위해, 마오리족은 이 장소에 문화 센터를 세웠다."]],"w":"8번에서 마오리족은 풍부한 역사를 '공유하기(share)' 위해 문화 센터를 세웠다고 해요. 숨기기 위해서라는 말은 반대예요.","c":"F"},"h":"40122081e9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… geysers—natural vents that regularly erupt, shooting steam and water into the air.)","ko":"… 간헐천, 즉 정기적으로 분출하며 증기와 물을 공중으로 내뿜는 천연 분출구 …","opts":["가라앉다","얼어붙다","분출하다","사라지다"],"word":"erupt","r":{"a":"3) 분출하다","ev":"3번 문장","s":[[3,"Meaning “the hot spring” in Maori, Te Puia is famous for its geysers—natural vents that regularly erupt, shooting steam and water into the air.","마오리어로 ‘온천’을 의미하며, 테 푸이아는 정기적으로 분출하며 증기와 물을 공중으로 내뿜는 천연 분출구인 간헐천으로 유명하다."]],"w":"3번에서 간헐천은 증기와 물을 공중으로 내뿜는(shooting) 분출구예요. 그래서 erupt는 '분출하다'예요.","c":3},"h":"dc6a0bbd31"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Here, visitors can observe traditional weavers and carvers at work.)","ko":"이곳에서, 방문객들은 전통 직조공과 조각가들이 작업하는 것을 볼 수 있다.","opts":["지켜보다","돕다","비판하다","흉내 내다"],"word":"observe","r":{"a":"1) 지켜보다","ev":"9번 문장","s":[[9,"Here, visitors can observe traditional weavers and carvers at work.","이곳에서, 방문객들은 전통 직조공과 조각가들이 작업하는 것을 볼 수 있다."]],"w":"9번에서 방문객은 직조공과 조각가가 일하는 모습(at work)을 볼 수 있어요. 그래서 observe는 '지켜보다'예요.","c":1},"h":"3b2b46d173"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt expresses the strength and unity of the Maori people, so be sure not to miss this!","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 마오리족의 힘과 단결을 표현하므로, 이것을 놓치지 않도록 하라!","opts":["하카(전통적인 단체 춤)","문화 센터","간헐천","북섬"],"r":{"a":"1) 하카(전통적인 단체 춤)","ev":"10~11번 문장","s":[[10,"Another important cultural practice that is performed at the center is the haka, a traditional group dance.","센터에서 행해지는 또 다른 중요한 문화적 관행은 전통적인 단체 춤인 하카이다."],[11,"It expresses the strength and unity of the Maori people, so be sure not to miss this!","그것은 마오리족의 힘과 단결을 표현하므로, 이것을 놓치지 않도록 하라!"]],"w":"11번의 It은 바로 앞 10번에 나온 전통적인 단체 춤 하카를 가리켜요. 하카가 마오리족의 힘과 단결을 표현한다는 내용이에요. 문화 센터, 간헐천, 북섬은 힘과 단결을 표현하는 대상이 아니에요.","c":1,"k":"It = 하카(전통적인 단체 춤)"},"pron":"It","h":"430447f8b1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Te Puia offers more than natural wonders.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"테 푸이아는 자연의 경이로움 이상을 제공한다.","opts":["테 푸이아는 자연의 경이로움을 전혀 제공하지 않는다.","테 푸이아의 자연의 경이로움은 다른 곳보다 더 많은 사람을 놀라게 한다.","테 푸이아는 자연의 경이로움보다 적은 것을 제공한다.","테 푸이아는 자연의 경이로움 외에도 다른 것을 제공한다."],"r":{"a":"4) 테 푸이아는 자연의 경이로움 외에도 다른 것을 제공한다.","ev":"6번 문장","s":[[6,"Te Puia offers more than natural wonders.","테 푸이아는 자연의 경이로움 이상을 제공한다."]],"w":"more than natural wonders는 '자연의 경이로움 이상'이라서, 자연 말고도 다른 것이 있다는 뜻이에요. 그 다른 것이 7번부터 나오는 마오리 문화예요.","c":4},"h":"edf8c68dba"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["테 푸이아는 축구장 약 70개 크기이다.","테 푸이아는 축구장 약 7개 크기이다.","테 푸이아는 축구장 하나보다 작다.","테 푸이아는 도시 하나만큼 크다."],"opts":["Te Puia is about the size of 70 football fields.","Te Puia is about the size of 7 football fields.","Te Puia is smaller than one football field.","Te Puia is as big as a whole city."],"r":{"a":"1) Te Puia is about the size of 70 football fields. (테 푸이아는 축구장 약 70개 크기이다.)","ev":"2번 문장","s":[[2,"About the size of 70 football fields, it is sure to amaze you!","축구장 70개 정도의 크기로, 그것은 당신을 확실히 놀라게 할 것이다!"]],"w":"2번에서 테 푸이아는 축구장 70개 정도의 크기라고 해요. 7개, 하나보다 작다, 도시만큼 크다는 말은 본문에 없어요.","c":1},"h":"0c0834c034"},{"n":9,"t":"sum","q":"Te Puia holds great cultural (A) for the Maori people, who have called it home for (B).","ko":"테 푸이아는 마오리족에게 큰 문화적 (A)을(를) 지니며, 마오리족은 그곳을 수 (B) 동안 고향이라고 불러왔다.","oko":["(A) 위험 / (B) 분","(A) 중요성 / (B) 분","(A) 위험 / (B) 세기","(A) 중요성 / (B) 세기","(A) 공포 / (B) 분"],"opts":["(A) danger / (B) minutes","(A) significance / (B) minutes","(A) danger / (B) centuries","(A) significance / (B) centuries","(A) fear / (B) minutes"],"r":{"a":"4) (A) significance / (B) centuries (중요성 / 세기)","ev":"7번 문장","s":[[7,"This site also holds great cultural significance for the Maori people, who have called it home for centuries.","이 장소는 또한 수 세기 동안 그곳을 고향이라고 불러온 마오리족에게 큰 문화적 중요성을 지닌다."]],"w":"7번에서 테 푸이아는 마오리족에게 큰 문화적 중요성(significance)을 지니며, 마오리족은 수 세기(centuries) 동안 그곳을 고향이라고 불러왔다고 해요. 위험, 공포, 분은 본문과 맞지 않아요.","c":4},"h":"40a641aad2"},{"n":10,"t":"fill","q":"Te Puia is home to the Pohutu Geyser, the [A] active geyser in the Southern [B].","ko":"테 푸이아는 남[B]에서 [A] 활동적인 간헐천인 포후투 간헐천의 본거지이다.","bank":["largest","Hemisphere","steam","traditional","cultural","erupt"],"bko":{"largest":"가장 큰","Hemisphere":"반구","steam":"증기","traditional":"전통적인","cultural":"문화적인","erupt":"분출하다"},"r":{"a":"[A] largest, [B] Hemisphere","ev":"4번 문장","s":[[4,"It is home to the Pohutu Geyser, the largest active geyser in the Southern Hemisphere.","그것은 남반구에서 가장 큰 활동적인 간헐천인 포후투 간헐천의 본거지이다."]],"w":"4번에서 포후투 간헐천은 남반구(the Southern Hemisphere)에서 가장 큰(the largest) 활동적인 간헐천이에요. steam, traditional, cultural, erupt는 다른 문장에서 쓰인 말이라 이 자리에 맞지 않아요.","c":null},"h":"3b6df402dd"}]},{"u":10,"id":"ms1-10-4","no":4,"ko":"The Great Straw Debate","items":[{"n":1,"t":"tf","q":"A hole is defined by the path it forms, not by how many openings it has.","ko":"구멍은 트여 있는 부분의 개수가 아니라 그것이 형성하는 경로로 정의된다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"A hole isn’t defined by how many openings it has, but by the path it forms.","구멍은 트여 있는 부분의 개수에 따라 정의되는 것이 아니라 그것이 형성하는 경로에 의해 정의돼요."]],"w":"3번에서 구멍은 트여 있는 부분의 개수(how many openings it has)가 아니라 그것이 형성하는 경로(the path it forms)에 의해 정의된다고 해요.","c":"T"},"h":"cbea1e0678"},{"n":2,"t":"tf","q":"A doughnut has two circular holes in the center.","ko":"도넛의 중앙에는 두 개의 원형 구멍이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Think of a doughnut: there’s a single circular hole in the center, not two.","도넛을 생각해보면, 도넛의 중앙에는 두 개가 아닌 하나의 원형 구멍이 있죠."]],"w":"5번에서 도넛의 중앙에는 두 개가 아닌 하나의 원형 구멍(a single circular hole)이 있다고 해요.","c":"F"},"h":"b7acf35cf7"},{"n":3,"t":"tf","q":"If one end of a straw gets blocked, the other end vanishes.","ko":"빨대의 한쪽 끝이 막히면, 다른 쪽 끝은 사라진다.","r":{"a":"F (본문과 다른 내용)","ev":"17번 문장","s":[[17,"If one end gets blocked, the other is still there—it doesn’t vanish.","한쪽 끝이 막혀도 다른 쪽 끝은 여전히 있으며, 사라지지 않아요."]],"w":"17번에서 한쪽 끝이 막혀도 다른 쪽 끝은 여전히 있으며 사라지지 않는다(it doesn’t vanish)고 해요.","c":"F"},"h":"244d55313c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But they’re misunderstanding what a “hole” actually is.)","ko":"그러나 그들은 ‘구멍’이 실제로 무엇인지 잘못 이해하고 있다.","opts":["정확히 이해하고 있는","자세히 설명하고 있는","잘못 이해하고 있는","강하게 반대하고 있는"],"word":"misunderstanding","r":{"a":"3) 잘못 이해하고 있는","ev":"2번 문장","s":[[2,"But they’re misunderstanding what a “hole” actually is.","그러나 그들은 ‘구멍’이 실제로 무엇인지 잘못 이해하고 있어요."]],"w":"2번의 But 뒤에서 일부 사람들이 구멍이 무엇인지 알지 못한 채 두 개라고 주장한다고 말해요. mis-는 '잘못'이라서 misunderstand는 '잘못 이해하다'예요.","c":3},"h":"f6a779901f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (We acknowledge both ends because each one gives access in its own right.)","ko":"우리는 두 개의 끝을 모두 인정하는데 각 끝이 그 자체로 접근성을 제공하기 때문이다.","opts":["무시하다","인정하다","막다","없애다"],"word":"acknowledge","r":{"a":"2) 인정하다","ev":"16번 문장","s":[[16,"We acknowledge both ends because each one gives access in its own right.","우리는 두 개의 끝을 모두 인정하는데 각 끝이 그 자체로 접근성을 제공하기 때문이죠."]],"w":"16번에서 우리는 두 끝을 모두 acknowledge하는데, 이유가 각 끝이 그 자체로 접근을 제공하기 때문이라고 해요. 그래서 '인정하다'예요.","c":2},"h":"e29d460558"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAlso, if you poke a pencil through a piece of paper, you make one hole, even if it shows on both sides.","ko":"밑줄 친 it이 가리키는 것은?","sko":"또한, 만약 당신이 연필로 종이를 찌르면, 그것은 양쪽 면에서 다 보인다고 하더라도, 당신은 하나의 구멍을 만들게 된다.","opts":["연필","종이 한 장","하나의 구멍","양쪽 면"],"r":{"a":"3) 하나의 구멍","ev":"8번 문장","s":[[8,"Also, if you poke a pencil through a piece of paper, you make one hole, even if it shows on both sides.","또한, 만약 당신이 연필로 종이를 찌르면, 그것은 양쪽 면에서 다 보인다고 하더라도, 당신은 하나의 구멍을 만들게 됩니다."]],"w":"8번에서 연필로 종이를 찌르면 하나의 구멍(one hole)을 만들게 되고, 그 구멍이 양쪽 면에서 다 보여도 구멍은 하나라는 뜻이에요. it은 one hole이에요.","c":3},"h":"484f0bd100"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you asked someone to cover “the hole” in a straw, they’d have to ask, “Which one?”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 누군가에게 빨대의 ‘구멍’을 가려 달라고 요청하면 “어느 쪽이냐?”고 물어야 할 거예요.","opts":["누군가에게 빨대의 ‘구멍’을 가려 달라고 하면, 그 사람은 어느 구멍을 말하는지 되물어야 할 것이다.","빨대의 구멍을 가려 달라고 하면, 누구나 곧바로 하나의 구멍을 가릴 것이다.","빨대의 구멍을 가려 달라고 하면, 그 사람은 빨대에는 구멍이 없다고 대답할 것이다.","빨대의 구멍을 가려 달라고 한 사람은 누구에게 부탁했는지 되물어야 할 것이다."],"r":{"a":"1) 누군가에게 빨대의 ‘구멍’을 가려 달라고 하면, 그 사람은 어느 구멍을 말하는지 되물어야 할 것이다.","ev":"13번 문장","s":[[13,"If you asked someone to cover “the hole” in a straw, they’d have to ask, “Which one?”","당신이 누군가에게 빨대의 ‘구멍’을 가려 달라고 요청하면 “어느 쪽이냐?”고 물어야 할 거예요."]],"w":"13번은 빨대의 ‘구멍’을 가려 달라고 하면 ‘Which one?(어느 쪽이냐?)’이라고 되물어야 할 것이라는 뜻이에요. 구멍이 두 개라서 어느 쪽인지 알 수 없기 때문이에요.","c":1},"h":"5ca0a98710"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["빨대에는 두 개의 구멍이 있는데, 양쪽 끝에 하나씩 있다.","빨대에는 가운데에 세 개의 구멍이 있다.","빨대에는 구멍이 전혀 없다.","빨대에는 위쪽에만 하나의 구멍이 있다."],"opts":["A straw has two holes, one at each end.","A straw has three holes in the middle.","A straw has no holes at all.","A straw has only one hole at the top."],"r":{"a":"1) A straw has two holes, one at each end. (빨대에는 두 개의 구멍이 있는데, 양쪽 끝에 하나씩 있다.)","ev":"10번 문장","s":[[10,"A straw has two holes, one at each end.","빨대에는 두 개의 구멍이 있는데, 양쪽 끝에 하나씩 있죠."]],"w":"10번에서 빨대에는 두 개의 구멍이 있는데 양쪽 끝에 하나씩 있다고 해요. 가운데 세 개, 구멍 없음, 위쪽에만 하나라는 말은 본문에 없어요.","c":1},"h":"d74e8bcf4c"},{"n":9,"t":"sum","q":"The hollow inside a straw is one unbroken (A) that (B) both ends.","ko":"빨대 속의 비어 있는 부분은 양쪽 끝을 (B) 끊어지지 않은 하나의 (A)이다.","oko":["(A) 벽 / (B) 막는","(A) 터널 / (B) 막는","(A) 벽 / (B) 연결하는","(A) 터널 / (B) 연결하는","(A) 원 / (B) 숨기는"],"opts":["(A) wall / (B) blocks","(A) tunnel / (B) blocks","(A) wall / (B) connects","(A) tunnel / (B) connects","(A) circle / (B) hides"],"r":{"a":"4) (A) tunnel / (B) connects (터널 / 연결하는)","ev":"7번 문장","s":[[7,"The hollow inside is one unbroken tunnel that connects both ends, and that tunnel is the hole.","속이 비어 있는 내부는 양쪽 끝을 연결하는 하나의 끊어지지 않은 터널이며, 그 터널이 바로 구멍인 것이죠."]],"w":"7번에서 속이 비어 있는 내부는 양쪽 끝을 연결하는(connects) 하나의 끊어지지 않은 터널(tunnel)이라고 해요. 벽, 원, 막는, 숨기는은 본문과 맞지 않아요.","c":4},"h":"f24d284401"},{"n":10,"t":"fill","q":"Some people look at a straw and [A] it has two holes, one at the top and one at the [B].","ko":"일부 사람들은 빨대를 보고 그것에 두 개의 구멍이 있다고 [A], 하나는 위쪽에 있고 하나는 [B]에 있다.","bank":["claim","bottom","continuous","independent","circular","hollow"],"bko":{"claim":"주장한다(claim의 현재형)","bottom":"아래","continuous":"이어지는","independent":"독립적인","circular":"원형의","hollow":"속이 빈"},"r":{"a":"[A] claim (주장한다), [B] bottom (아래)","ev":"1번 문장","s":[[1,"Some people look at a straw and claim it has two holes, one at the top and one at the bottom.","일부 사람들은 빨대를 보고, 그것에 두 개의 구멍이 있다고 주장하는데, 하나는 위쪽에 하나는 아래에 있다고 하죠."]],"w":"1번에서 일부 사람들은 빨대에 두 개의 구멍이 있다고 주장하는데(claim), 하나는 위쪽에, 하나는 아래(bottom)에 있다고 해요. continuous, independent, circular, hollow는 형용사라서 이 자리에 들어갈 수 없어요.","c":null},"h":"67b3320e1b"}]}];
