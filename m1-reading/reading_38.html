 you can have the front half, and I will have the back half.", "ko": "소는 앞쪽 반은 당신이 가져도 되고, 뒤쪽 반은 내가 가질게요.", "ok": true, "foot": [], "fixes": []}, {"n": 7, "tag": null, "en": "For the mango tree, you can have the bottom half, and I will have the top half.\"", "ko": "망고나무는 당신이 아래쪽 반을 가지고 내가 위쪽 반을 가질게요.\"라고 말했습니다.", "ok": true, "foot": [], "fixes": []}, {"n": 8, "tag": null, "en": "Boka agreed to all the rule. However, before long, she became very unhappy.", "ko": "Boka는 모든 규칙에 동의했습니다. 그러나 얼마 지나지 않아, 그녀는 매우 불행해졌습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "rule", "right": "rules", "partial": false, "at": [5], "point": "명사의 복수형: all the 뒤 '규칙들'은 복수 rules 사용", "topic": "명사의 복수형", "memo": "all the 뒤 '규칙들'은 복수 rules 사용"}]}, {"n": 9, "tag": null, "en": "She was cold during the night, but Tetan sleeped well under the warm blanket.", "ko": "그녀는 밤에 추웠지만, Tetan은 따뜻한 담요 아래에서 잘 잤습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "sleeped", "right": "slept", "partial": false, "at": [8], "point": "불규칙 과거형: sleep의 과거형은 slept (sleeped 아님)", "topic": "불규칙 과거형", "memo": "sleep의 과거형은 slept (sleeped 아님)"}]}, {"n": 10, "tag": null, "en": "She feeded the cow all day, but Tetan got milk from the back half.", "ko": "그녀는 하루 종일 소에게 먹이를 주었지만, Tetan은 소의 뒤쪽 반에서 우유를 얻었습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "feeded", "right": "fed", "partial": false, "at": [1], "point": "불규칙 과거형: feed의 과거형은 fed (feeded 아님)", "topic": "불규칙 과거형", "memo": "feed의 과거형은 fed (feeded 아님)"}]}, {"n": 11, "tag": null, "en": "She watered the tree every days, but Tetan ate all the mangoes from the top half.", "ko": "그녀는 매일 나무에 물을 주었지만, Tetan은 위쪽 반의 망고를 모두 먹었습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "days", "right": "day", "partial": false, "at": [5], "point": "명사의 단수형: every 뒤에는 단수명사 day 사용", "topic": "명사의 단수형", "memo": "every 뒤에는 단수명사 day 사용"}]}, {"n": 12, "tag": null, "en": "Boka got tired and hungry, so she goed to the village chief for help. He said, \"Soak the blanket and give it to Tetan.", 평하게 물건도 나눌게요.\"라고 말했습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "works", "right": "work", "partial": false, "at": [5], "point": "조동사 뒤 동사원형: will 뒤에는 동사원형 work (works 아님)", "topic": "조동사 뒤 동사원형", "memo": "will 뒤에는 동사원형 work (works 아님)"}, {"wrong": "your", "right": "you", "partial": false, "at": [14], "point": "인칭대명사의 목적격: 전치사 with 뒤에는 목적격 you 사용", "topic": "인칭대명사의 목적격", "memo": "전치사 with 뒤에는 목적격 you 사용"}]}];var PP=[["Tetan Buri and Boka Buri lived next to each other.", "Tetan Buri와 Boka Buri는 서로 이웃에 살았습니다.", 1], ["They were very poor.", "그들은 매우 가난했습니다.", 0], ["One day, Tetan said to Boka, \"Why don't we share things and live together?", "어느 날 Tetan이 Boka에게 \"우리 물건을 나누고 함께 살면 어떨까요?", 0], ["We will be happy.\"", "그럼 행복할 거예요.\"라고 말했습니다.", 0], ["\"Hmm, that's a good idea,\" said Boka.", "\"흠, 좋은 생각이네요.\"라고 Boka가 말했습니다.", 1], ["They had one blanket, one cow, and one mango tree.", "그들에게는 담요 한 장, 소 한 마리, 망고나무 한 그루가 있었습니다.", 1], ["Tetan set the sharing rules.", "Tetan이 공유 규칙을 정했습니다.", 0], ["She said to Boka, \"You can have the blanket during the day, and I will have it at night.", "그녀는 Boka에게 \"담요는 낮 동안에는 당신이 가져도 되고, 밤에는 내가 가질게요.", 0], ["For the cow, you can have the front half, and I will have the back half.", "소는 앞쪽 반은 당신이 가져도 되고, 뒤쪽 반은 내가 가질게요.", 0], ["For the mango tree, you can have the bottom half, and I will have the top half.\"", "망고나무는 당신이 아래쪽 반을 가지고 내가 위쪽 반을 가질게요.\"라고 말했습니다.", 0], ["Boka agreed to all the rules.", "Boka는 모든 규칙에 동의했습니다.", 1], ["However, before long, she became very unhappy.", "그러나 얼마 지나지 않아, 그녀는 매우 불행해졌습니다.", 0], ["She was cold during the night, but Tetan slept well under the warm blanket.", "그녀는 밤에 추웠지만, Tetan은 따뜻한 담요 아래에서 잘 잤습니다.", 0], ["She fed the cow all day, but Tetan got milk from the back half.", "그녀는 하루 종일 소에게 먹이를 주었지만, Tetan은 소의 뒤쪽 반에서 우유를 얻었습니다.", 0], ["She watered the tree every day, but Tetan ate all the mangoes from the top half.", "그녀는 매일 나무에 물을 주었지만, Tetan은 위쪽 반의 망고를 모두 먹었습니다.", 0], ["Boka got tired and hungry, so she went to the village chief for help.", "Boka는 피곤하고 배가 고파져서 도움을 청하러 마을 촌장에게 갔습니다.", 1], ["He said, \"Soak the blanket and give it to Tetan.", "그는 \"담요를 적셔서 Tetan에게 주게.", 0], ["Don't feed the cow.", "소에게는 먹이를 주지 말게.", 0], ["Then, cut the tree in half.\"", "그러고 나무를 반으로 자르게.\"라고 말했습니다.", 0], ["Boka listened to him.", "Boka는 그의 말을 들었습니다.", 1], ["Tetan couldn't sleep well during the night.", "Tetan은 밤에 잠을 잘 수 없었습니다.", 0], ["She also couldn't go near the angry cow.", "그녀는 성난 소 근처에도 갈 수 없었습니다.", 0], ["She couldn't eat mangoes anymore.", "망고도 더 이상 먹을 수 없었습니다.", 0], ["Tetan regretted everything and said to Boka, \"I am sorry.", "Tetan은 모든 것을 후회하며 Boka에게 \"미안해요.", 0], ["I was foolish.", "내가 어리석었어요.", 0], ["From now on, I will work hard, too.", "이제부터는 나도 열심히 일할게요.", 0], ["I will also share things with you fairly.\"", "그리고 당신과 공평하게 물건도 나눌게요.\"라고 말했습니다.", 0]];var RNUM=38;var TITLE_EN="Half and Half";var PASS_EN=["Half and Half", "Tetan Buri and Boka Buri lived next to each other. They were very poor. One day, Tetan said to Boka, \"Why don't we share things and live together? We will be happy.\"", "\"Hmm, that's a good idea,\" said Boka.", "They had one blanket, one cow, and one mango tree. Tetan set the sharing rules. She said to Boka, \"You can have the blanket during the day, and I will have it at night. For the cow, you can have the front half, and I will have the back half. For the mango tree, you can have the bottom half, and I will have the top half.\"", "Boka agreed to all the rules. However, before long, she became very unhappy. She was cold during the night, but Tetan slept well under the warm blanket. She fed the cow all day, but Tetan got milk from the back half. She watered the tree every day, but Tetan ate all the mangoes from the top half.", "Boka got tired and hungry, so she went to the village chief for help. He said, \"Soak the blanket and give it to Tetan. Don't feed the cow. Then, cut the tree in half.\"", "Boka listened to him. Tetan couldn't sleep well during the night. She also couldn't go near the angry cow. She couldn't eat mangoes anymore. Tetan regretted everything and said to Boka, \"I am sorry. I was foolish. From now on, I will work hard, too. I will also share things with you fairly.\""];var PASS_KO=["반반으로", "Tetan Buri와 Boka Buri는 서로 이웃에 살았습니다. 그들은 매우 가난했습니다. 어느 날 Tetan이 Boka에게 \"우리 물건을 나누고 함께 살면 어떨까요? 그럼 행복할 거예요.\"라고 말했습니다.", "\"흠, 좋은 생각이네요.\"라고 Boka가 말했습니다.", "그들에게는 담요 한 장, 소 한 마리, 망고나무 한 그루가 있었습니다. Tetan이 공유 규칙을 정했습니다. 그녀는 Boka에게 \"담요는 낮 동안에는 당신이 가져도 되고, 밤에는 내가 가질게요. 소는 앞쪽 반은 당신이 가져도 되고, 뒤쪽 반은 내가 가질게요. 망고나무는 당신이 아래쪽 반을 가지고 내가 위쪽 반을 가질게요.\"라고 말했습니다.", "Boka는 모든 규칙에 동의했습니다. 그러나 얼마 지나지 않아, 그녀는 매우 불행해졌습니다. 그녀는 밤에 추웠지만, Tetan은 따뜻한 담요 아래에서 잘 잤습니다. 그녀는 하루 종일 소에게 먹이를 주었지만, Tetan은 소의 뒤쪽 반에서 우유를 얻었습니다. 그녀는 매일 나무에 물을 주었지만, Tetan은 위쪽 반의 망고를 모두 먹었습니다.", "Boka는 피곤하고 배가 고파져서 도움을 청하러 마을 촌장에게 갔습니다. 그는 \"담요를 적셔서 Tetan에게 주게. 소에게는 먹이를 주지 말게. 그러고 나무를 반으로 자르게.\"라고 말했습니다.", "Boka는 그의 말을 들었습니다. Tetan은 밤에 잠을 잘 수 없었습니다. 그녀는 성난 소 근처에도 갈 수 없었습니다. 망고도 더 이상 먹을 수 없었습니다. Tetan은 모든 것을 후회하며 Boka에게 \"미안해요. 내가 어리석었어요. 이제부터는 나도 열심히 일할게요. 그리고 당신과 공평하게 물건도 나눌게요.\"라고 말했습니다."];
