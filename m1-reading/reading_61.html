 at saving water!","여러분은 물을 절약하는 것에 정말 뛰어나요!",0]];var RNUM=61;var TITLE_EN="You're an Environmental Superhero!";var PASS_EN=["You’re an Environmental Superhero!","Pollution is a big problem. Luckily, three superheroes are working to protect the environment. They want to make the world clean. Will you join them?","Hi! I’m Recycle Wizard.","People waste too many resources. But recycling can save them. For example, recycling 1,000 kilograms of paper can save about 19 trees and 29,000 liters of water. Do you want to be a wizard at recycling? Then you should recycle properly! Put plastic, paper, food waste, and glass in the correct bins.","Look at the waste below. Draw a line from each piece of waste to the right bin.","Good job!","I’m Fashion Clever.","People throw away clothes too often. They become waste and hurt the environment. Did you know that some clothes take over 200 years to break down? Don’t buy too many clothes. Wear your clothes for a long time. You can also create new items from your old clothes! Let’s make old clothes useful.","There are some items below. What can you make with these old clothes? Match the old clothes with the correct new items.","Now you can be clever at fashion too!","Water is very important. We can’t live without it. But people waste a lot of water. It makes me sad. How can we save water? Take quick showers. Turn off the water while you brush your teeth. Also, make sure that you turn off the tap completely.","Look at the pictures below. Which are ways to save water and which are not? Write an O or X on each picture.","I’m sure that you got the right answers. You are amazing at saving water!"];var PASS_KO=["당신은 환경 슈퍼히어로입니다!","오염은 큰 문제입니다. 다행히, 세 명의 슈퍼히어로가 환경을 보호하기 위해서 일하고 있습니다. 그들은 세상을 깨끗하게 만들고 싶어 합니다. 당신도 그들과 함께하시겠어요?","안녕하세요! 저는 재활용 마법사예요.","사람들은 너무 많은 자원을 낭비해요. 하지만 재활용은 그것들을 절약할 수 있어요. 예를 들어, 종이 1,000kg을 재활용하는 것은 약 19그루의 나무와 29,000리터의 물을 절약할 수 있어요. 여러분은 재활용 마법사가 되고 싶나요? 그렇다면 재활용을 제대로 해야 합니다! 플라스틱, 종이, 음식물 쓰레기, 그리고 유리를 알맞은 쓰레기통에 넣으세요. function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}

var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}

function partHtml(p){

  if(g.pp)h+=ppHtml(g.pp,lock);

 });

 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';

function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';

 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }

function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';

 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;

function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;

function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';

  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
