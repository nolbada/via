<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14303f">
<meta name="application-name" content="수업용 LEE">
<meta name="apple-mobile-web-app-title" content="수업용 LEE">
<title>수업용 LEE</title>
<style>
:root{--bg:#f4f6f8;--card:#ffffff;--ink:#14202b;--sub:#566474;--line:#d9e0e7;--g1:#14303f}
@media (prefers-color-scheme:dark){:root{--bg:#0c1f2b;--card:#14303f;--ink:#e8eef2;--sub:#9db0bd;--line:#24465a;--g1:#f79a85}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
a.app{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--g1);border-radius:10px;padding:20px 16px;margin-bottom:10px;color:var(--ink);text-decoration:none;font-size:18px;font-weight:700}
a.app:active{background:var(--line)}
.ns{border:2px solid #d6d6d6;background:#f6f6f6;border-radius:16px;padding:4px 12px 10px;margin:0 0 18px}
@media (prefers-color-scheme:dark){.ns{border-color:#444;background:#1a1a1a}}
.ns h2{display:block;text-align:center;font-size:24px;font-weight:900;letter-spacing:.06em;color:var(--ink);background:#e4e4e4;border-radius:12px;padding:12px 10px;margin:10px 0 12px}
@media (prefers-color-scheme:dark){.ns h2{background:#444}}
.ns h3{font-size:17px;font-weight:800;margin:16px 4px 8px;color:var(--ink)}
.ns .em{font-size:14px;color:var(--sub);margin:0 4px 6px}
</style>
</head>
<body>
<main>
<div class="ns">
<h2>수업용 LEE</h2>
<h3>문법</h3>
<p class="em">비어 있음</p>
</div>
</main>
</body>
</html>
