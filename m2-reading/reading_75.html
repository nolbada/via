var D=[{"n": 1, "tag": null, "en": "Hello! Welcome to the Quebec Winter Carnival. I am Bonhomme, the mascot of the carnival.", "ko": "안녕하세요! 퀘벡 윈터 카니발에 오신 것을 환영합니다. 저는 카니발의 마스코트인 Bonhomme이에요.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "I am a big snowman. As you can see, I'm wear a big red hat and a special belt.", "ko": "저는 커다란 눈사람이에요. 당신이 보는 것처럼, 저는 크고 빨간 모자를 쓰고 특별한 허리띠를 하고 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "wear", "right": "wearing", "partial": false, "at": [10], "point": "현재진행형: be동사 + 현재분사 wearing", "topic": "현재진행형", "memo": "be동사 + 현재분사 wearing"}]}, {"n": 3, "tag": null, "en": "Do you want take home an unforgettable memory from the carnival? Follow me, and I'll showing you what to do here.", "ko": "당신은 카니발에서 잊지 못할 추억을 집으로 가져가고 싶나요? 저를 따라오세요, 그러면 이곳에서 무엇을 해야 할지 보여 줄게요.", "ok": false, "foot": [], "fixes": [{"wrong": "take", "right": "to take", "partial": false, "at": [3], "point": "want + to부정사: want 뒤에는 to부정사 to take", "topic": "want + to부정사", "memo": "want 뒤에는 to부정사 to take"}, {"wrong": "showing", "right": "show", "partial": false, "at": [15], "point": "조동사 + 동사원형: 조동사 will 뒤에는 동사원형 show", "topic": "조동사 + 동사원형", "memo": "조동사 will 뒤에는 동사원형 show"}]}, {"n": 4, "tag": null, "en": "Bonhomme means “good man” in French. The Quebec Winter Carnival is usually holding for 10 days between January and February in Quebec, Canada.", "ko": "Bonhomme은 프랑스어로 ‘좋은 사람’을 의미해요. 퀘벡 윈터 카니발은 캐나다 퀘벡에서 보통 1월과 2월 사이에 10일 동안 열려요.", "ok": false, "foot": [], "fixes": [{"wrong": "holding", "right": "held", "partial": false, "at": [12], "point": "수동태: 카니발이 '열리는' 것이므로 수동태 is held", "topic": "수동태", "memo": "카니발이 '열리는' 것이므로 수동태 is held"}]}, {"n": 5, "tag": "얼음 궁전", "en": "This is my ice palace. Every year, a new ice palace build for the carnival. So, I have a new home each year!", "ko": "이것은 제 얼음 궁전이에요. 매년, 새로운 얼음 궁전이 카니발을 위해 지어져요. 그래서, 저는 매년 새로운 집을 가진답니다!", "ok": false, "foot": [], "fixes": [{"wrong": "build", "right": "is built", "partial": false, "at": [11], "point": "수동태: 궁전이 '지어지는' 것이므로 is built", "topic": "수동태", "memo": "궁전이 '지어지는' 것이므로 is built"}]}, {"n": 6, "tag": null, "en": "Because of the palace is made of ice and snow, it shines beautiful during the day.", "ko": "궁전이 얼음과 눈으로 만들어지기 때문에, 그것은 낮 동안 아름답게 빛나요.", "ok": false, "foot": [], "fixes": [{"wrong": "Because of", "right": "Because", "partial": false, "at": [0], "point": "접속사: 뒤에 절(주어+동사)이 오므로 접속사 Because", "topic": "접속사", "memo": "뒤에 절(주어+동사)이 오므로 접속사 Because"}, {"wrong": "beautiful", "right": "beautifully", "partial": false, "at": [12], "point": "부사: 동사 shines를 꾸미는 부사 beautifully", "topic": "부사", "memo": "동사 shines를 꾸미는 부사 beautifully"}]}, {"n": 7, "tag": null, "en": "At night, it is even most beautiful with many lights.", "ko": "밤에, 그것은 많은 불빛들로 훨씬 더 아름다워요.", "ok": false, "foot": [], "fixes": [{"wrong": "most", "right": "more", "partial": false, "at": [5], "point": "비교급 강조: even 뒤에는 비교급 more beautiful", "topic": "비교급 강조", "memo": "even 뒤에는 비교급 more beautiful"}]}, {"n": 8, "tag": null, "en": "Take a look at my fantastic ice garden. You can see amazing ice sculptures of trees, flowers, and animals here.", "ko": "제 환상적인 얼음 정원을 보세요. 당신은 여기서 나무들, 꽃들, 그리고 동물들의 놀라운 얼음 조각들을 볼 수 있어요.", "ok": true, "foot": [], "fixes": []}, {"n": 9, "tag": null, "en": "You can also enjoy excited concerts and performances. Do you like to dance? I can teach you how to dancing like me.", "ko": "당신은 또한 신나는 콘서트와 공연들을 즐길 수 있어요. 춤추는 것을 좋아하나요? 어떻게 저처럼 춤추는지 가르쳐 줄 수 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "excited", "right": "exciting", "partial": false, "at": [4], "point": "현재분사형 형용사: 콘서트가 '신나게 하는' 것이므로 exciting", "topic": "현재분사형 형용사", "memo": "콘서트가 '신나게 하는' 것이므로 exciting"}, {"wrong": "dancing", "right": "dance", "partial": false, "at": [19], "point": "의문사 + to부정사: how to 뒤에는 동사원형 dance", "topic": "의문사 + to부정사", "memo": "how to 뒤에는 동사원형 dance"}]}, {"n": 10, "tag": "터보건과 카누 경주", "en": "There is also so many interesting activities you can do at the carnival.", "ko": "카니발에서 당신이 할 수 있는 정말 많은 흥미로운 활동들도 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "are", "partial": false, "at": [1], "point": "There be 구문의 수일치: 뒤의 activities가 복수라 are", "topic": "There be 구문의 수일치", "memo": "뒤의 activities가 복수라 are"}]}, {"n": 11, "tag": null, "en": "The toboggan slide was built in 1884 and is 200 meters length. A toboggan is a long narrow sled.", "ko": "터보건 활강장은 1884년에 지어졌고 길이가 200미터예요. 터보건은 길고 좁은 썰매예요.", "ok": false, "foot": [], "fixes": [{"wrong": "length", "right": "long", "partial": false, "at": [11], "point": "형용사: be동사 뒤 보어이므로 형용사 long", "topic": "형용사", "memo": "be동사 뒤 보어이므로 형용사 long"}]}, {"n": 12, "tag": null, "en": "If you liking speed, get on the toboggan. It is so fast that you will feel like you are on a roller coaster.", "ko": "당신이 속도를 좋아한다면, 터보건을 타 보세요. 그것은 너무 빨라서 마치 당신이 롤러코스터에 탄 것처럼 느낄 거예요.", "ok": false, "foot": [], "fixes": [{"wrong": "liking", "right": "like", "partial": false, "at": [2], "point": "현재 시제: 조건절의 동사는 현재형 like", "topic": "현재 시제", "memo": "조건절의 동사는 현재형 like"}]}, {"n": 13, "tag": null, "en": "While you're slide down, you can enjoy amazed views of Quebec. You can see a huge famous castle on your left.", "ko": "당신이 미끄러져 내려가는 동안, 퀘벡의 놀라운 경관을 즐길 수 있어요. 당신의 왼쪽에서 거대한 유명한 성을 볼 수 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "slide", "right": "sliding", "partial": false, "at": [2], "point": "현재진행형: be동사 + 현재분사 sliding", "topic": "현재진행형", "memo": "be동사 + 현재분사 sliding"}, {"wrong": "amazed", "right": "amazing", "partial": false, "at": [7], "point": "현재분사형 형용사: 경관이 '놀라움을 주는' 것이므로 amazing", "topic": "현재분사형 형용사", "memo": "경관이 '놀라움을 주는' 것이므로 amazing"}]}, {"n": 14, "tag": null, "en": "On your right, you can see a beautiful icy river.", "ko": "당신의 오른쪽에서는, 얼음에 뒤덮인 아름다운 강을 볼 수 있어요.", "ok": true, "foot": [], "fixes": []}, {"n": 15, "tag": null, "en": "If you see a large crowd along the river, it's time watching the Ice Canoe Race. This race is one of the best part of the carnival, and you shouldn't miss it.", "ko": "강을 따라 있는 많은 군중이 보인다면, 아이스 카누 경주를 볼 시간이에요. 이 경주는 카니발의 최고의 부분 중 하나라서, 그것을 놓쳐서는 안 돼요.", "ok": false, "foot": [], "fixes": [{"wrong": "watching", "right": "to watch", "partial": false, "at": [11], "point": "명사를 꾸미는 to부정사: time을 꾸며 '볼 시간'이므로 to watch", "topic": "명사를 꾸미는 to부정사", "memo": "time을 꾸며 '볼 시간'이므로 to watch"}, {"wrong": "part", "right": "parts", "partial": false, "at": [23], "point": "one of + 복수명사: one of 뒤에는 복수명사 parts", "topic": "one of + 복수명사", "memo": "one of 뒤에는 복수명사 parts"}]}, {"n": 16, "tag": null, "en": "Canoe teams have to races through the icy river for about three kilometers. Teams are usually made up of five members, and both men and women can join the team.", "ko": "카누 팀들은 약 3킬로미터를 얼음에 뒤덮인 강을 거쳐 경주해야 해요. 팀들은 보통 다섯 명의 팀원으로 구성되고, 남성과 여성 모두 팀에 들어갈 수 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "races", "right": "race", "partial": false, "at": [4], "point": "have to + 동사원형: have to 뒤에는 동사원형 race", "topic": "have to + 동사원형", "memo": "have to 뒤에는 동사원형 race"}]}, {"n": 17, "tag": null, "en": "Look! One team is stuck in the ice and can't move! The members have to push their canoe on the ice to getting to the water.", "ko": "보세요! 한 팀이 얼음에 갇혀서 움직일 수 없어요! 팀원들은 강물 쪽에 도착하기 위해 얼음 위의 카누를 밀어야 해요.", "ok": false, "foot": [], "fixes": [{"wrong": "getting", "right": "get", "partial": false, "at": [22], "point": "목적의 to부정사: to 뒤에는 동사원형 get", "topic": "목적의 to부정사", "memo": "to 뒤에는 동사원형 get"}]}, {"n": 18, "tag": null, "en": "Phew! They are in the water again. I hope they can making it to the finish line.", "ko": "휴! 그들은 다시 강물 속에 있어요. 저는 그들이 결승선까지 도착할 수 있기를 바라요.", "ok": false, "foot": [], "fixes": [{"wrong": "making", "right": "make", "partial": false, "at": [11], "point": "조동사 + 동사원형: 조동사 can 뒤에는 동사원형 make", "topic": "조동사 + 동사원형", "memo": "조동사 can 뒤에는 동사원형 make"}]}, {"n": 19, "tag": null, "en": "The race is so exciting what you will forget about the cold.", "ko": "경주가 너무 흥미진진해서 당신은 추위를 잊게 될 거예요.", "ok": false, "foot": [], "fixes": [{"wrong": "what", "right": "that", "partial": false, "at": [5], "point": "so ~ that 구문: '너무 ~해서 …하다'는 so ~ that", "topic": "so ~ that 구문", "memo": "'너무 ~해서 …하다'는 so ~ that"}]}, {"n": 20, "tag": "맛있는 간식", "en": "After all these excited activities, I'm really hungry. There are many delicious treat to eat at the carnival.", "ko": "이 모든 흥미진진한 활동들 후, 저는 정말 배가 고파요. 카니발에는 먹을 맛있는 간식들이 많이 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "excited", "right": "exciting", "partial": false, "at": [3], "point": "현재분사형 형용사: 활동이 '흥미를 일으키는' 것이므로 exciting", "topic": "현재분사형 형용사", "memo": "활동이 '흥미를 일으키는' 것이므로 exciting"}, {"wrong": "treat", "right": "treats", "partial": false, "at": [12], "point": "명사의 수: many 뒤에는 복수명사 treats", "topic": "명사의 수", "memo": "many 뒤에는 복수명사 treats"}]}, {"n": 21, "tag": null, "en": "How about a cup of hot chocolate? It's always the perfect drink on cold weather.", "ko": "핫초코 한 잔 어때요? 그것은 추운 날씨에 항상 완벽한 음료예요.", "ok": false, "foot": [], "fixes": [{"wrong": "on", "right": "in", "partial": false, "at": [12], "point": "전치사: in cold weather: 추운 날씨에", "topic": "전치사", "memo": "in cold weather: 추운 날씨에"}]}, {"n": 22, "tag": null, "en": "You also have to try maple taffy. It's making in a special way here. Let's learn how to make it.", "ko": "당신은 메이플 태피도 맛봐야 해요. 그것은 여기서 특별한 방법으로 만들어져요. 그것을 어떻게 만드는지 배워봐요.", "ok": false, "foot": [], "fixes": [{"wrong": "making", "right": "made", "partial": false, "at": [8], "point": "수동태: 태피가 '만들어지는' 것이므로 is made", "topic": "수동태", "memo": "태피가 '만들어지는' 것이므로 is made"}]}, {"n": 23, "tag": null, "en": "Pour hot maple syrup on the snow. Then place a stick on the syrup and quick roll it around. Now, you has delicious maple taffy!", "ko": "눈 위에 뜨거운 메이플 시럽을 부어요. 그런 다음 그 시럽 위에 막대를 놓고 재빨리 돌돌 말아요. 이제, 당신에게 맛있는 메이플 태피가 있어요!", "ok": false, "foot": [], "fixes": [{"wrong": "quick", "right": "quickly", "partial": false, "at": [15], "point": "부사: 동사 roll을 꾸미는 부사 quickly", "topic": "부사", "memo": "동사 roll을 꾸미는 부사 quickly"}, {"wrong": "has", "right": "have", "partial": false, "at": [21], "point": "주어와 동사의 수일치: 주어 you에는 have", "topic": "주어와 동사의 수일치", "memo": "주어 you에는 have"}]}, {"n": 24, "tag": null, "en": "I hope you come and see me at the carnival. Oh, don't forget checking our website for more information. Bye!", "ko": "저는 당신이 카니발에 와서 저를 만나길 바라요. 오, 더 많은 정보를 원한다면 우리 웹사이트를 확인하는 것 잊지 마세요. 안녕!", "ok": false, "foot": [], "fixes": [{"wrong": "checking", "right": "to check", "partial": false, "at": [13], "point": "forget + to부정사: '~할 것을 잊다'는 forget to check", "topic": "forget + to부정사", "memo": "'~할 것을 잊다'는 forget to check"}]}];var PP=[["Hello! Welcome to the Quebec Winter Carnival.", "안녕하세요! 퀘벡 윈터 카니발에 오신 것을 환영합니다.", 1], ["I am Bonhomme, the mascot of the carnival.", "저는 카니발의 마스코트인 Bonhomme이에요.", 0], ["I am a big snowman.", "저는 커다란 눈사람이에요.", 0], ["As you can see, I'm wearing a big red hat and a special belt.", "당신이 보는 것처럼, 저는 크고 빨간 모자를 쓰고 특별한 허리띠를 하고 있어요.", 0], ["Do you want to take home an unforgettable memory from the carnival?", "당신은 카니발에서 잊지 못할 추억을 집으로 가져가고 싶나요?", 0], ["Follow me, and I'll show you what to do here.", "저를 따라오세요, 그러면 이곳에서 무엇을 해야 할지 보여 줄게요.", 0], ["Bonhomme means “good man” in French.", "Bonhomme은 프랑스어로 ‘좋은 사람’을 의미해요.", 0], ["The Quebec Winter Carnival is usually held for 10 days between January and February in Quebec, Canada.", "퀘벡 윈터 카니발은 캐나다 퀘벡에서 보통 1월과 2월 사이에 10일 동안 열려요.", 0], ["Bonhomme’s Ice Palace", "Bonhomme의 얼음 궁전", 1], ["This is my ice palace.", "이것은 제 얼음 궁전이에요.", 0], ["Every year, a new ice palace is built for the carnival.", "매년, 새로운 얼음 궁전이 카니발을 위해 지어져요.", 0], ["So, I have a new home each year!", "그래서, 저는 매년 새로운 집을 가진답니다!", 0], ["Because the palace is made of ice and snow, it shines beautifully during the day.", "궁전이 얼음과 눈으로 만들어지기 때문에, 그것은 낮 동안 아름답게 빛나요.", 0], ["At night, it is even more beautiful with many lights.", "밤에, 그것은 많은 불빛들로 훨씬 더 아름다워요.", 0], ["Take a look at my fantastic ice garden.", "제 환상적인 얼음 정원을 보세요.", 0], ["You can see amazing ice sculptures of trees, flowers, and animals here.", "당신은 여기서 나무들, 꽃들, 그리고 동물들의 놀라운 얼음 조각들을 볼 수 있어요.", 0], ["You can also enjoy exciting concerts and performances.", "당신은 또한 신나는 콘서트와 공연들을 즐길 수 있어요.", 0], ["Do you like to dance?", "춤추는 것을 좋아하나요?", 0], ["I can teach you how to dance like me.", "어떻게 저처럼 춤추는지 가르쳐 줄 수 있어요.", 0], ["Toboggan Slide and Ice Canoe Race", "터보건 활강장과 아이스 카누 경주", 1], ["There are also so many interesting activities you can do at the carnival.", "카니발에서 당신이 할 수 있는 정말 많은 흥미로운 활동들도 있어요.", 0], ["The toboggan slide was built in 1884 and is 200 meters long.", "터보건 활강장은 1884년에 지어졌고 길이가 200미터예요.", 0], ["A toboggan is a long narrow sled.", "터보건은 길고 좁은 썰매예요.", 0], ["If you like speed, get on the toboggan.", "당신이 속도를 좋아한다면, 터보건을 타 보세요.", 0], ["It is so fast that you will feel like you are on a roller coaster.", "그것은 너무 빨라서 마치 당신이 롤러코스터에 탄 것처럼 느낄 거예요.", 0], ["While you're sliding down, you can enjoy amazing views of Quebec.", "당신이 미끄러져 내려가는 동안, 퀘벡의 놀라운 경관을 즐길 수 있어요.", 0], ["You can see a huge famous castle on your left.", "당신의 왼쪽에서 거대한 유명한 성을 볼 수 있어요.", 0], ["On your right, you can see a beautiful icy river.", "당신의 오른쪽에서는, 얼음에 뒤덮인 아름다운 강을 볼 수 있어요.", 0], ["If you see a large crowd along the river, it's time to watch the Ice Canoe Race.", "강을 따라 있는 많은 군중이 보인다면, 아이스 카누 경주를 볼 시간이에요.", 0], ["This race is one of the best parts of the carnival, and you shouldn't miss it.", "이 경주는 카니발의 최고의 부분 중 하나라서, 그것을 놓쳐서는 안 돼요.", 0], ["Canoe teams have to race through the icy river for about three kilometers.", "카누 팀들은 약 3킬로미터를 얼음에 뒤덮인 강을 거쳐 경주해야 해요.", 0], ["Teams are usually made up of five members, and both men and women can join the team.", "팀들은 보통 다섯 명의 팀원으로 구성되고, 남성과 여성 모두 팀에 들어갈 수 있어요.", 0], ["Look! One team is stuck in the ice and can't move!", "보세요! 한 팀이 얼음에 갇혀서 움직일 수 없어요!", 0], ["The members have to push their canoe on the ice to get to the water.", "팀원들은 강물 쪽에 도착하기 위해 얼음 위의 카누를 밀어야 해요.", 0], ["Phew! They are in the water again.", "휴! 그들은 다시 강물 속에 있어요.", 0], ["I hope they can make it to the finish line.", "저는 그들이 결승선까지 도착할 수 있기를 바라요.", 0], ["The race is so exciting that you will forget about the cold.", "경주가 너무 흥미진진해서 당신은 추위를 잊게 될 거예요.", 0], ["Delicious Treats", "맛있는 간식거리", 1], ["After all these exciting activities, I'm really hungry.", "이 모든 흥미진진한 활동들 후, 저는 정말 배가 고파요.", 0], ["There are many delicious treats to eat at the carnival.", "카니발에는 먹을 맛있는 간식들이 많이 있어요.", 0], ["How about a cup of hot chocolate?", "핫초코 한 잔 어때요?", 0], ["It's always the perfect drink in cold weather.", "그것은 추운 날씨에 항상 완벽한 음료예요.", 0], ["You also have to try maple taffy.", "당신은 메이플 태피도 맛봐야 해요.", 0], ["It's made in a special way here.", "그것은 여기서 특별한 방법으로 만들어져요.", 0], ["Let's learn how to make it.", "그것을 어떻게 만드는지 배워봐요.", 0], ["Pour hot maple syrup on the snow.", "눈 위에 뜨거운 메이플 시럽을 부어요.", 0], ["Then place a stick on the syrup and quickly roll it around.", "그런 다음 그 시럽 위에 막대를 놓고 재빨리 돌돌 말아요.", 0], ["Now, you have delicious maple taffy!", "이제, 당신에게 맛있는 메이플 태피가 있어요!", 0], ["I hope you come and see me at the carnival.", "저는 당신이 카니발에 와서 저를 만나길 바라요.", 0], ["Oh, don't forget to check our website for more information.", "오, 더 많은 정보를 원한다면 우리 웹사이트를 확인하는 것 잊지 마세요.", 0], ["Bye!", "안녕!", 0]];var RNUM=75;var TITLE_EN="The Quebec Winter Carnival";var PASS_EN=["The Quebec Winter Carnival", "Hello! Welcome to the Quebec Winter Carnival. I am Bonhomme, the mascot of the carnival. I am a big snowman. As you can see, I'm wearing a big red hat and a special belt. Do you want to take home an unforgettable memory from the carnival? Follow me, and I'll show you what to do here. Bonhomme means “good man” in French. The Quebec Winter Carnival is usually held for 10 days between January and February in Quebec, Canada.", "Bonhomme’s Ice Palace", "This is my ice palace. Every year, a new ice palace is built for the carnival. So, I have a new home each year! Because the palace is made of ice and snow, it shines beautifully during the day. At night, it is even more beautiful with many lights. Take a look at my fantastic ice garden. You can see amazing ice sculptures of trees, flowers, and animals here. You can also enjoy exciting concerts and performances. Do you like to dance? I can teach you how to dance like me.", "Toboggan Slide and Ice Canoe Race", "There are also so many interesting activities you can do at the carnival. The toboggan slide was built in 1884 and is 200 meters long. A toboggan is a long narrow sled. If you like speed, get on the toboggan. It is so fast that you will feel like you are on a roller coaster. While you're sliding down, you can enjoy amazing views of Quebec. You can see a huge famous castle on your left. On your right, you can see a beautiful icy river. If you see a large crowd along the river, it's time to watch the Ice Canoe Race. This race is one of the best parts of the carnival, and you shouldn't miss it. Canoe teams have to race through the icy river for about three kilometers. Teams are usually made up of five members, and both men and women can join the team. Look! One team is stuck in the ice and can't move! The members have to push their canoe on the ice to get to the water. Phew! They are in the water again. I hope they can make it to the finish line. The race is so exciting that you will forget about the cold.", "Delicious Treats", "After all these exciting activities, I'm really hungry. There are many delicious treats to eat at the carnival. How about a cup of hot chocolate? It's always the perfect drink in cold weather. You also have to try maple taffy. It's made in a special way here. Let's learn how to make it. Pour hot maple syrup on the snow. Then place a stick on the syrup and quickly roll it around. Now, you have delicious maple taffy! I hope you come and see me at the carnival. Oh, don't forget to check our website for more information. Bye!"];var PASS_KO=["퀘벡 윈터 카니발", "안녕하세요! 퀘벡 윈터 카니발에 오신 것을 환영합니다. 저는 카니발의 마스코트인 Bonhomme이에요. 저는 커다란 눈사람이에요. 당신이 보는 것처럼, 저는 크고 빨간 모자를 쓰고 특별한 허리띠를 하고 있어요. 당신은 카니발에서 잊지 못할 추억을 집으로 가져가고 싶나요? 저를 따라오세요, 그러면 이곳에서 무엇을 해야 할지 보여 줄게요. Bonhomme은 프랑스어로 ‘좋은 사람’을 의미해요. 퀘벡 윈터 카니발은 캐나다 퀘벡에서 보통 1월과 2월 사이에 10일 동안 열려요.", "Bonhomme의 얼음 궁전", "이것은 제 얼음 궁전이에요. 매년, 새로운 얼음 궁전이 카니발을 위해 지어져요. 그래서, 저는 매년 새로운 집을 가진답니다! 궁전이 얼음과 눈으로 만들어지기 때문에, 그것은 낮 동안 아름답게 빛나요. 밤에, 그것은 많은 불빛들로 훨씬 더 아름다워요. 제 환상적인 얼음 정원을 보세요. 당신은 여기서 나무들, 꽃들, 그리고 동물들의 놀라운 얼음 조각들을 볼 수 있어요. 당신은 또한 신나는 콘서트와 공연들을 즐길 수 있어요. 춤추는 것을 좋아하나요? 어떻게 저처럼 춤추는지 가르쳐 줄 수 있어요.", "터보건 활강장과 아이스 카누 경주", "카니발에서 당신이 할 수 있는 정말 많은 흥미로운 활동들도 있어요. 터보건 활강장은 1884년에 지어졌고 길이가 200미터예요. 터보건은 길고 좁은 썰매예요. 당신이 속도를 좋아한다면, 터보건을 타 보세요. 그것은 너무 빨라서 마치 당신이 롤러코스터에 탄 것처럼 느낄 거예요. 당신이 미끄러져 내려가는 동안, 퀘벡의 놀라운 경관을 즐길 수 있어요. 당신의 왼쪽에서 거대한 유명한 성을 볼 수 있어요. 당신의 오른쪽에서는, 얼음에 뒤덮인 아름다운 강을 볼 수 있어요. 강을 따라 있는 많은 군중이 보인다면, 아이스 카누 경주를 볼 시간이에요. 이 경주는 카니발의 최고의 부분 중 하나라서, 그것을 놓쳐서는 안 돼요. 카누 팀들은 약 3킬로미터를 얼음에 뒤덮인 강을 거쳐 경주해야 해요. 팀들은 보통 다섯 명의 팀원으로 구성되고, 남성과 여성 모두 팀에 들어갈 수 있어요. 보세요! 한 팀이 얼음에 갇혀서 움직일 수 없어요! 팀원들은 강물 쪽에 도착하기 위해 얼음 위의 카누를 밀어야 해요. 휴! 그들은 다시 강물 속에 있어요. 저는 그들이 결승선까지 도착할 수 있기를 바라요. 경주가 너무 흥미진진해서 당신은 추위를 잊게 될 거예요.", "맛있는 간식거리", "이 모든 흥미진진한 활동들 후, 저는 정말 배가 고파요. 카니발에는 먹을 맛있는 간식들이 많이 있어요. 핫초코 한 잔 어때요? 그것은 추운 날씨에 항상 완벽한 음료예요. 당신은 메이플 태피도 맛봐야 해요. 그것은 여기서 특별한 방법으로 만들어져요. 그것을 어떻게 만드는지 배워봐요. 눈 위에 뜨거운 메이플 시럽을 부어요. 그런 다음 그 시럽 위에 막대를 놓고 재빨리 돌돌 말아요. 이제, 당신에게 맛있는 메이플 태피가 있어요! 저는 당신이 카니발에 와서 저를 만나길 바라요. 오, 더 많은 정보를 원한다면 우리 웹사이트를 확인하는 것 잊지 마세요. 안녕!"];var BG=[{"qs": [{"n": 6, "q": "윗글의 빈칸에 들어갈 말로 알맞은 것은?   ________ the palace is made of ice and snow, it shines beautifully during the day.", "o": ["Because", "Although", "When", "Due to", "Despite"], "a": 0, "ans": "Because", "ko": ["~ 때문에", "비록 ~이지만", "~할 때", "~ 때문에 (뒤에 명사구)", "~에도 불구하고"], "evs": [["Because the palace is made of ice and snow, it shines beautifully during the day.", "궁전이 얼음과 눈으로 만들어지기 때문에, 그것은 낮 동안 아름답게 빛나요."]], "ow": ["정답 ○ — 얼음과 눈으로 만들어졌기 때문에 빛난다는 이유를 나타내고, 뒤에 절(the palace is made ...)이 오므로 접속사 Because가 알맞다.", "오답 ✕ — Although(비록 ~이지만)는 양보를 나타내므로 이유와 결과인 이 문장과 맞지 않는다.", "오답 ✕ — When(~할 때)은 시간을 나타낸다. 얼음으로 만들어진 것은 빛나는 이유이다.", "오답 ✕ — Due to는 '~ 때문에'지만 뒤에 명사(구)가 와야 한다. 여기서는 절이 이어진다.", "오답 ✕ — Despite(~에도 불구하고)는 뒤에 명사(구)가 오고, 뜻도 맞지 않는다."], "memo": ["정답 ①: Because(~ 때문에, 접속사)", "근거: the palace is made of ice and snow → it shines (이유 → 결과)", "함정: Due to는 뜻은 같지만 뒤에 명사(구)가 와야 함 ✕"], "why": "이유를 나타내고 뒤에 절이 이어지므로 접속사 Because이다.", "ev": ["Because the palace is made of ice and snow, it shines beautifully during the day.", "궁전이 얼음과 눈으로 만들어지기 때문에, 그것은 낮 동안 아름답게 빛나요."]}, {"n": 7, "q": "윗글의 목적으로 알맞은 것은?", "o": ["to tell people about the reason for building a new ice palace every year", "to introduce amazing ice sculptures at the carnival", "to show people Bonhomme’s ice palace and garden", "to explain the way to build Bonhomme’s ice palace", "to invite visitors to performances at the carnival"], "a": 2, "ans": "to show people Bonhomme’s ice palace and garden", "ko": ["매년 새로운 얼음 궁전을 짓는 이유를 알려 주려고", "카니발의 놀라운 얼음 조각을 소개하려고", "사람들에게 Bonhomme의 얼음 궁전과 정원을 보여 주려고", "Bonhomme의 얼음 궁전을 짓는 방법을 설명하려고", "방문객을 카니발의 공연에 초대하려고"], "evs": [["This is my ice palace.", "이것은 제 얼음 궁전이에요."], ["Take a look at my fantastic ice garden.", "제 환상적인 얼음 정원을 보세요."]], "ow": ["오답 ✕ — 매년 새 궁전이 지어진다는 말은 있지만, 그 이유를 설명하는 글은 아니다.", "오답 ✕ — 얼음 조각은 정원에서 볼 수 있는 일부일 뿐, 글 전체의 목적은 아니다.", "정답 ○ — 'This is my ice palace.'와 'Take a look at my fantastic ice garden.'처럼 궁전과 정원을 소개하는 글이다.", "오답 ✕ — 궁전을 짓는 방법은 나오지 않는다.", "오답 ✕ — 공연은 일부 내용일 뿐 글 전체의 목적은 아니다."], "memo": ["정답 ③: Bonhomme의 얼음 궁전과 정원을 보여 주려는 글", "근거: This is my ice palace. / Take a look at my fantastic ice garden.(이것은 제 얼음 궁전이에요. / 제 환상적인 얼음 정원을 보세요.)", "함정: 얼음 조각, 공연은 글의 일부일 뿐 전체 목적 ✕"], "why": "얼음 궁전과 정원을 소개하는 글이다.", "ev": ["This is my ice palace.", "이것은 제 얼음 궁전이에요."]}], "pp": [["Bonhomme’s Ice Palace", "Bonhomme의 얼음 궁전"], ["This is my ice palace.", "이것은 제 얼음 궁전이에요."], ["Every year, a new ice palace is built for the carnival.", "매년, 새로운 얼음 궁전이 카니발을 위해 지어져요."], ["So, I have a new home each year!", "그래서, 저는 매년 새로운 집을 가진답니다!"], ["Because the palace is made of ice and snow, it shines beautifully during the day.", "궁전이 얼음과 눈으로 만들어지기 때문에, 그것은 낮 동안 아름답게 빛나요."], ["At night, it is even more
