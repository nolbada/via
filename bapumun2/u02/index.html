 "우리는", "ok": false, "why": "주어라서 문장 맨 앞에 와요."}, {"n": "④", "en": "will", "ko": "~할 것이다", "ok": false, "why": "조동사라서 주어 바로 뒤에 와요."}, {"n": "⑤", "en": "elect", "ko": "선출하다", "ok": false, "why": "동사원형이라서 will 바로 뒤에 와요."}], "pencil": "elect + 목적어 + ___ (~를 …로 선출하다)", "pencilKey": "목적격 보어", "page": 19, "sec": "s1"}, {"id": "S1-03", "step": 1, "no": 3, "qtype": "유형 01 문장의 형식", "type": "mc", "ans": "⑤", "concept": ["029-2", "030"], "gap": "", "words": [["made", "만들었다(원형 make 만들다)"], ["found", "알게 되었다(원형 find 알다)"], ["called", "불렀다(원형 call 부르다)"], ["bought", "사 주었다(원형 buy 사다)"], ["generous", "너그러운"]], "h1": "각 문장에서 him 뒤에 있는 말이 him을 설명하는 말(그는 ~하다)인지, him에게 주는 물건인지 살펴보세요.", "h2": "5형식은 목적어와 뒤의 말이 '목적어 = 보어' 관계예요. 4형식은 사람과 물건 두 가지를 나란히 써서 '~에게 …을 주다'가 돼요. him 뒤 말이 어느 쪽인지 구별해 보세요.", "why": "I bought him a hat.은 '그에게 모자를 사 주었다'로 him과 a hat이 같은 사람이 아니에요. 사람과 물건을 나란히 쓰는 4형식이에요. 나머지는 him을 설명하는 말이 있는 5형식이에요.", "opts": [{"n": "①", "en": "I made him angry.", "ko": "나는 그를 화나게 만들었다.", "ok": false, "why": "him = angry 관계라서 5형식이에요."}, {"n": "②", "en": "I had him come back.", "ko": "나는 그가 돌아오게 했다.", "ok": false, "why": "him이 돌아오는 관계라서 5형식이에요."}, {"n": "③", "en": "I found him generous.", "ko": "나는 그가 너그럽다고 생각했다.", "ok": false, "why": "him = generous 관계라서 5형식이에요."}, {"n": "④", "en": "I called him Mr. Dictionary.", "ko": "나는 그를 Dictionary 씨라고 불렀다.", "ok": false, "why": "him = Mr. Dictionary 관계라서 5형식이에요."}, {"n": "⑤", "en": "I bought him a hat.", "ko": "나는 그에게 모자를 사 주었다.", "ok": true, "why": "him(사람)과 a hat(물건)이 따로인 4형식이라 나머지와 달라요."}], "pencil": "5형식은 목적어 = ___ 의 관계예요", "pencilKey": "목적격 보어", "page": 19, "sec": "s1"}, {"id": "S1-04", "step": 1, "no": 4, "qtype": "유형 01 문장의 형식", "type": "mc", "ans": "④", "concept": ["030", "029-2"], "gap": "", "words": [["leave", "내버려 두다"], ["alone", "혼자인"], ["keep", "유지하다"], ["convenient", "편리한"], ["thoughtful", "사려 깊은"], ["loudly", "크게"]], "h1": "5형식이 '아닌' 문장을 찾는 문제예요. 목적어 바로 뒤에 목적어를 설명하는 말이 있는지 문장마다 확인해 보세요.", "h2": "very loudly(아주 크게)처럼 '어떻게'를 말해 주는 말은 동작을 꾸미는 말(부사)이에요. 목적어를 설명하는 말이 아니면 5형식이 아니에요. 꾸미는 말로 끝나는 문장을 찾아보세요.", "why": "We called their names very loudly.는 '그들의 이름을 아주 크게 불렀다'예요. very loudly는 동사를 꾸미는 말이라서 목적격 보어가 아니고, 3형식이에요.", "opts": [{"n": "①", "en": "Leave me alone.", "ko": "나를 혼자 내버려 둬.", "ok": false, "why": "me = alone 관계의 5형식이에요."}, {"n": "②", "en": "I can keep my desk clean.", "ko": "나는 내 책상을 깨끗하게 유지할 수 있다.", "ok": false, "why": "my desk = clean 관계의 5형식이에요."}, {"n": "③", "en": "Science makes our lives convenient.", "ko": "과학은 우리의 삶을 편리하게 만든다.", "ok": false, "why": "our lives = convenient 관계의 5형식이에요."}, {"n": "④", "en": "We called their names very loudly.", "ko": "우리는 그들의 이름을 아주 크게 불렀다.", "ok": true, "why": "very loudly는 꾸미는 말이라 3형식이에요. 5형식이 아닌 문장이에요."}, {"n": "⑤", "en": "At last I found the man very thoughtful.", "ko": "마침내 나는 그 남자가 매우 사려 깊다는 것을 알았다.", "ok": false, "why": "the man = very thoughtful 관계의 5형식이에요."}], "pencil": "목적어를 설명하는 말이 없으면 ___형식이 아니에요", "pencilKey": "5", "page": 19, "sec": "s1"}, {"id": "S1-05", "step": 1, "no": 5, "qtype": "유형 02 목적격 보어의 형태", "type": "mc", "ans": "②", "concept": ["030", "030-H1"], "gap": "", "words": [["experience", "경험"], ["made", "만들었다(원형 make 만들다)"]], "h1": "make(만들다) 뒤 me를 설명하는 말이 들어갈 자리예요. 이 자리에 어떤 종류의 말이 올 수 있는지 먼저 정해 보세요.", "h2": "보기에는 -ly로 끝나는 말이 여럿 있어요. -ly로 끝나는 말은 대부분 동작을 꾸미는 부사예요. 부사는 이 자리에 올 수 없으니, 목적어의 상태를 말하는 형용사를 찾아보세요.", "why": "5형식에서 목적격 보어 자리에는 부사를 쓸 수 없어요. careful(조심스러운)은 형용사라서 '지난 경험들이 나를 조심스럽게 만들었다'가 돼요.", "opts": [{"n": "①", "en": "sadly", "ko": "슬프게", "ok": false, "why": "부사라서 목적격 보어 자리에 올 수 없어요."}, {"n": "②", "en": "careful", "ko": "조심스러운", "ok": true, "why": "형용사라서 me를 설명할 수 있어요."}, {"n": "③", "en": "kindly", "ko": "친절하게", "ok": false, "why": "부사라서 올 수 없어요."}, {"n": "④", "en": "happily", "ko": "행복하게", "ok": false, "why": "부사라서 올 수 없어요."}, {"n": "⑤", "en": "angrily", "ko": "화나서", "ok": false, "why": "부사라서 올 수 없어요."}], "pencil": "목적격 보어 자리에는 부사 말고 ___ 를 써요", "pencilKey": "형용사", "page": 19, "sec": "s1"}, {"id": "S1-06", "step": 1, "no": 6, "qtype": "유형 02 목적격 보어의 형태", "type": "mc", "ans": "②", "concept": ["030", "030-H1"], "gap": "", "words": [["gift", "선물"], ["made", "만들었다(원형 make 만들다)"]], "h1": "빈칸은 선물이 Angela를 어떤 '상태'로 만들었는지 말하는 자리예요. 어떤 모양의 말이 필요할까요?", "h2": "보기 중 부사(~하게)를 먼저 지워 보세요. 남은 것 중에서 선물을 받은 사람의 기분에 어울리는 뜻을 고르세요.", "why": "make(만들다) 뒤 목적어를 설명하는 자리에는 형용사가 와요. happy(행복한)는 형용사이고 뜻도 선물과 어울려요.", "opts": [{"n": "①", "en": "sadly", "ko": "슬프게", "ok": false, "why": "부사라서 목적격 보어 자리에 올 수 없어요."}, {"n": "②", "en": "happy", "ko": "행복한", "ok": true, "why": "형용사라서 Angela의 상태를 설명할 수 있어요."}, {"n": "③", "en": "likely", "ko": "~할 것 같은", "ok": false, "why": "형용사지만 '~할 것 같은'이라는 뜻이라 Angela의 기분을 설명하지 못해요."}, {"n": "④", "en": "kindly", "ko": "친절하게", "ok": false, "why": "부사라서 올 수 없어요."}, {"n": "⑤", "en": "nicely", "ko": "멋지게", "ok": false, "why": "부사라서 올 수 없어요."}], "pencil": "make + 목적어 + ___ (부사는 안 돼요)", "pencilKey": "형용사", "page": 19, "sec": "s1"}, {"id": "S1-07", "step": 1, "no": 7, "qtype": "유형 02 목적격 보어의 형태", "type": "write", "ans": "nervous", "concept": ["030", "030-H1"], "gap": "", "words": [["speech", "연설"], ["nervous", "긴장한"], ["nervously", "긴장하여, 불안하게"]], "h1": "made the students 뒤에 오는 말은 students가 어떤 상태가 되었는지 알려 줘요. 괄호 안 두 단어 중 어느 것이 상태를 말할까요?", "h2": "'연설이 학생들을 긴장하게 만들었다'에서 '긴장한'은 학생들의 상태를 말해요. 상태를 설명하는 말은 형용사와 부사 중 무엇인지 떠올려 보세요.", "why": "make(만들다) 뒤 목적격 보어 자리에는 형용사가 와요. nervous(긴장한)가 students의 상태를 설명해요. nervously는 부사라서 쓸 수 없어요.", "opts": [], "pencil": "목적격 보어 자리에는 ___ 를 쓴다", "pencilKey": "형용사", "page": 19, "sec": "s1"}, {"id": "S1-08", "step": 1, "no": 8, "qtype": "유형 01 문장의 형식", "type": "write", "ans": "call me a fool", "concept": ["030", "030-H1"], "gap": "", "words": [["fool", "바보"], ["foolish", "어리석은"], ["call", "부르다"]], "h1": "Don't 뒤에는 동사원형이 와요. 주어진 표현 중 동사를 먼저 고르고, 그 뒤에 '누구를', '무엇이라고' 순서로 놓아 보세요.", "h2": "call은 「call + 목적어 + 명사」로 '~를 …라고 부르다'를 만들어요. 필요 없는 표현 하나는 이 자리에 쓸 수 없는 말이에요. 명사는 무엇인지 찾아보세요.", "why": "Don't call me a fool.(나를 바보라고 부르지 마.)이에요. call(부르다) 뒤에 목적어 me, 목적격 보어로 명사 a fool을 써요. foolish는 형용사라서 쓰지 않아요.", "opts": [], "pencil": "call + 목적어 + ___ (~를 …라고 부르다)", "pencilKey": "명사", "page": 19, "sec": "s1"}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 02 목적격 보어의 형태", "type": "mc", "ans": "③", "concept": ["030-H1", "030"], "gap": "", "words": [["allow", "허락하다"], ["behave", "행동하다"], ["like that", "그렇게"]], "h1": "allow(허락하다)는 you(너) 뒤에서 '너를 ~하도록 허락하다'로 이어져요. you 뒤 동사의 모양은 allow가 정해요.", "h2": "want, ask, tell, allow처럼 '시키거나 바라는' 동사는 목적격 보어의 모양이 정해져 있어요. 사역동사(make, have, let)와는 달라요. 어떤 모양일까요?", "why": "allow(허락하다)는 목적격 보어로 to부정사를 써요. I can't allow you to behave like that.(나는 네가 그렇게 행동하도록 허락할 수 없다.)이 돼요.", "opts": [{"n": "①", "en": "behave", "ko": "행동하다(동사원형)", "ok": false, "why": "동사원형은 사역동사·지각동사 뒤에 써요. allow 뒤에는 to가 필요해요."}, {"n": "②", "en": "behaving", "ko": "행동하는(-ing 형태)", "ok": false, "why": "-ing 모양은 allow 뒤 목적격 보어로 쓰지 않아요."}, {"n": "③", "en": "to behave", "ko": "행동하도록(to부정사)", "ok": true, "why": "allow + 목적어 + to부정사 모양이라 맞아요."}, {"n": "④", "en": "to behaving", "ko": "(to + -ing, 어색한 형태)", "ok": false, "why": "to 뒤에는 동사원형이 와요. -ing를 붙이면 틀려요."}, {"n": "⑤", "en": "to be behave", "ko": "(be와 behave가 겹친 형태)", "ok": false, "why": "동사 두 개를 겹쳐 쓸 수 없어요."}], "pencil": "allow + 목적어 + ___ 모양을 쓴다", "pencilKey": "to부정사", "page": 20, "sec": "s1"}, {"id": "S1-10", "step": 1, "no": 10, "qtype": "유형 02 목적격 보어의 형태", "type": "mc", "ans": "⑤", "concept": ["030", "030-H1"], "gap": "", "words": [["keep", "유지하다"], ["coolly", "시원하게(부사)"], ["cool", "시원한"]], "h1": "keep(유지하다)은 '~를 …한 상태로 두다'로 쓰여요. 밑줄 친 다섯 곳 중에서 품사가 맞지 않는 곳이 어디인지 찾아보세요.", "h2": "you 뒤에 있는 말이 you의 상태를 설명하는 자리예요. 이 자리에 부사가 와도 괜찮은지 떠올려 보세요.", "why": "keep + 목적어 뒤에는 목적격 보어로 형용사를 써요. coolly는 부사라서 틀렸고, cool(시원한)로 고쳐요.", "opts": [{"n": "①", "en": "The", "ko": "그", "ok": false, "why": "관사라서 문제가 없어요."}, {"n": "②", "en": "drink", "ko": "음료", "ok": false, "why": "주어가 되는 명사라서 문제가 없어요."}, {"n": "③", "en": "will keep", "ko": "~하게 유지해 줄 것이다", "ok": false, "why": "조동사 will 뒤에 동사원형 keep이 와서 맞아요."}, {"n": "④", "en": "you", "ko": "너를", "ok": false, "why": "keep의 목적어라서 맞아요."}, {"n": "⑤", "en": "coolly", "ko": "시원하게(부사)", "ok": true, "why": "목적격 보어 자리에는 부사를 쓸 수 없어요. cool로 고쳐야 해요."}], "pencil": "keep + 목적어 + ___ (부사는 안 돼요)", "pencilKey": "형용사", "page": 20, "sec": "s1"}, {"id": "S1-11", "step": 1, "no": 11, "qtype": "유형 02 목적격 보어의 형태", "type": "write", "ans": "easy", "concept": ["030", "030-H1", "051-H3"], "gap": "", "words": [["find", "알게 되다"], ["easily", "쉽게(부사)"], ["easy", "쉬운"]], "h1": "find(알게 되다, 생각하다)는 '목적어가 ~하다고 생각하다'로 쓰여요. 밑줄 친 말이 책(the book)을 설명하는 자리인지 살펴보세요.", "h2": "easily(쉽게)는 동작을 꾸미는 부사예요. 목적어의 상태를 설명할 때 쓰는 품사로 바꿔 보세요.", "why": "I found the book easy for children.(나는 그 책이 아이들에게 쉽다고 생각했다.)이에요. 목적격 보어 자리에는 형용사 easy가 와요.", "opts": [], "pencil": "find + 목적어 + ___ (부사는 안 돼요)", "pencilKey": "형용사", "page": 20, "sec": "s1"}, {"id": "S1-12", "step": 1, "no": 12, "qtype": "유형 02 목적격 보어의 형태", "type": "write", "ans": "read → to read", "concept": ["030-H1", "030"], "gap": "", "words": [["ask", "부탁하다"], ["read", "읽다"], ["story", "이야기"]], "h1": "ask(부탁하다)는 '~에게 …해 달라고 부탁하다'로 쓰여요. me 뒤에 온 동사 read(읽다)의 모양이 맞는지 보세요.", "h2": "ask, want, tell 같은 동사는 목적어 뒤에 올 동사의 모양을 정해 둬요. 사역동사처럼 동사원형을 쓰는지, 다른 모양을 쓰는지 떠올려 보세요.", "why": "ask(부탁하다)는 목적격 보어로 to부정사를 써요. asks me read를 asks me to read(나에게 읽어 달라고 부탁한다)로 고쳐요.", "opts": [], "pencil": "ask + 목적어 + ___ 모양을 쓴다", "pencilKey": "to부정사", "page": 20, "sec": "s1"}, {"id": "S1-13", "step": 1, "no": 13, "qtype": "유형 02 목적격 보어의 형태", "type": "write", "ans": "to stop", "concept": ["030-H1", "030"], "gap": "", "words": [["advise", "충고하다"], ["stop", "멈추다"], ["exercise", "운동하다"]], "h1": "advise(충고하다)는 him(그에게) 뒤에 '~하라고'가 이어져요. 괄호 안 동사를 어떤 모양으로 바꿀지 advise가 정해요.", "h2": "tell, ask, advise, want처럼 사람에게 '하라고 말하거나 바라는' 동사는 목적격 보어에 어떤 모양을 쓰는지 정리해 보세요.", "why": "advise(충고하다)는 목적격 보어로 to부정사를 써요. 그래서 stop(멈추다)을 to stop으로 바꿔 '그에게 너무 심하게 운동하는 것을 멈추라고 충고했다'가 돼요.", "opts": [], "pencil": "advise + 목적어 + ___ 모양을 쓴다", "pencilKey": "to부정사", "page": 20, "sec": "s1"}, {"id": "S1-14", "step": 1, "no": 14, "qtype": "유형 02 목적격 보어의 형태", "type": "mc", "ans": "③", "concept": ["030", "029-2", "029"], "gap": "", "words": [["name", "이름 짓다"], ["liar", "거짓말쟁이"], ["bracelet", "팔찌"], ["brilliant", "뛰어난"], ["programmer", "프로그래머"]], "h1": "밑줄 친 말이 바로 앞의 목적어와 같은 대상인지(목적어 = 밑줄 친 말) 하나씩 확인해 보세요.", "h2": "목적어와 같은 대상이면 목적격 보어이고, 목적어와 다른 물건이면(~에게 …을 해 준다) 두 번째 목적어(직접목적어)예요. 앞 말과 같은 대상이 아닌 문장을 찾아보세요.", "why": "Jenny made me a bracelet.(Jenny는 내게 팔찌를 만들어 주었다.)에서 a bracelet은 me와 다른 물건이라 4형식의 직접목적어예요. 나머지는 목적어를 설명하는 목적격 보어예요.", "opts": [{"n": "①", "en": "He named the cat Kitty.", "ko": "그는 그 고양이를 Kitty라고 이름 지었다.", "ok": false, "why": "the cat = Kitty 관계라서 Kitty는 목적격 보어예요."}, {"n": "②", "en": "Everybody calls him a liar.", "ko": "모두가 그를 거짓말쟁이라고 부른다.", "ok": false, "why": "him = a liar 관계라서 목적격 보어예요."}, {"n": "③", "en": "Jenny made me a bracelet.", "ko": "Jenny는 내게 팔찌를 만들어 주었다.", "ok": true, "why": "a bracelet은 me와 다른 물건이라 직접목적어예요. 나머지와 역할이 달라요."}, {"n": "④", "en": "I call my younger brother Little Prince.", "ko": "나는 내 남동생을 Little Prince라고 부른다.", "ok": false, "why": "my younger brother = Little Prince 관계라서 목적격 보어예요."}, {"n": "⑤", "en": "They thought her a brilliant programmer.", "ko": "그들은 그녀를 뛰어난 프로그래머라고 생각했다.", "ok": false, "why": "her = a brilliant programmer 관계라서 목적격 보어예요."}], "pencil": "목적어 = 밑줄 친 말이면 ___ 이다", "pencilKey": "목적격 보어", "page": 20, "sec": "s1"}, {"id": "S1-15", "step": 1, "no": 15, "qtype": "유형 03 사역동사와 지각동사의 5형식", "type": "mc", "ans": "①", "concept": ["030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["have", "시키다"], ["clean", "청소하다"], ["son", "아들"]], "h1": "had는 have(시키다)의 과거형이에요. '아들에게 방을 청소하게 시켰다'에서 my son 뒤 동사의 모양은 have가 정해요.", "h2": "make, have, let은 '~하게 하다'라는 뜻의 사역동사예요. 사역동사 뒤 목적격 보어에는 어떤 모양의 동사가 오는지 떠올려 보세요. to가 붙을까요, 안 붙을까요?", "why": "사역동사 have(~하도록 시키다) 뒤의 목적격 보어에는 동사원형을 써요. I had my son clean his room.(나는 아들에게 방을 청소하게 했다.)이 돼요.", "opts": [{"n": "①", "en": "clean", "ko": "청소하다(동사원형)", "ok": true, "why": "사역동사 have 이 가능한지 떠올려서 고쳐 쓰세요.", "why": "지각동사 listen to 뒤 목적격 보어에는 동사원형이나 -ing를 써요. 그래서 to sing을 sing 또는 singing으로 고쳐요.", "opts": [], "pencil": "지각동사 뒤 목적격 보어에는 to를 ___ ", "pencilKey": "붙이지 않는다", "page": 20, "sec": "s1"}, {"id": "S1-18", "step": 1, "no": 18, "qtype": "유형 03 사역동사와 지각동사의 5형식", "type": "write", "ans": "touch", "concept": ["031"], "gap": "", "words": [["feel", "느끼다"], ["touch", "만지다"], ["shoulder", "어깨"]], "h1": "felt는 feel(느끼다)의 과거형이에요. 몸으로 느끼는 것을 말하는 지각동사 뒤에 올 동사의 모양을 정해 보세요.", "h2": "지각동사 뒤 목적격 보어에는 to가 붙을까요? 괄호 안 두 모양 중 지각동사 규칙에 맞는 것을 고르세요.", "why": "지각동사 feel(느끼다)의 목적격 보어에는 동사원형이나 -ing를 써요. 그래서 to touch가 아니라 touch를 골라요.", "opts": [], "pencil": "지각동사 + 목적어 + ___ 또는 -ing", "pencilKey": "동사원형", "page": 21, "sec": "s1"}, {"id": "S1-19", "step": 1, "no": 19, "qtype": "유형 03 사역동사와 지각동사의 5형식", "type": "mc", "ans": "④", "concept": ["030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["fix", "고치다"], ["bike", "자전거"], ["report", "보고서"]], "h1": "두 문장의 빈칸 뒤 모양이 달라요. 하나는 me to fix(to부정사), 하나는 me write(동사원형)예요. 두 모양을 모두 받을 수 있는 동사를 찾으세요.", "h2": "사역동사는 동사원형만, 지각동사는 동사원형이나 -ing만 받아요. 동사원형과 to부정사를 둘 다 받을 수 있는 특별한 동사는 무엇일까요?", "why": "help(돕다)는 목적격 보어로 동사원형과 to부정사를 둘 다 쓸 수 있어요. 그래서 두 문장에 모두 helped(원형 help 돕다)가 들어가요.", "opts": [{"n": "①", "en": "made", "ko": "시켰다(원형 make 만들다)", "ok": false, "why": "make 뒤에는 동사원형만 써서 'me to fix'에는 쓸 수 없어요."}, {"n": "②", "en": "let", "ko": "허락했다(원형 let 허락하다)", "ok": false, "why": "let 뒤에도 동사원형만 써서 'me to fix'에는 쓸 수 없어요."}, {"n": "③", "en": "saw", "ko": "보았다(원형 see 보다)", "ok": false, "why": "지각동사는 to부정사를 받지 않아서 'me to fix'에 쓸 수 없어요."}, {"n": "④", "en": "helped", "ko": "도왔다(원형 help 돕다)", "ok": true, "why": "help는 동사원형과 to부정사를 모두 받아서 두 문장에 다 들어가요."}, {"n": "⑤", "en": "had", "ko": "시켰다(원형 have 시키다)", "ok": false, "why": "have 뒤에도 동사원형만 써서 'me to fix'에는 쓸 수 없어요."}], "pencil": "help + 목적어 + 동사원형 또는 ___ ", "pencilKey": "to부정사", "page": 21, "sec": "s1"}, {"id": "S1-20", "step": 1, "no": 20, "qtype": "유형 03 사역동사와 지각동사의 5형식", "type": "write", "ans": "made him look better", "concept": ["030", "030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["glasses", "안경"], ["make", "만들다"], ["look better", "더 나아 보이다"]], "h1": "'안경이 그를 ~하게 했다'이니 주어는 The black glasses예요. 그 뒤에 올 동사(만들다의 과거형)를 먼저 정해 보세요.", "h2": "사역동사 made 뒤에는 「목적어 + 동사원형」이 와요. 마지막에 오는 look better(더 나아 보이다)는 동사원형 look과 형용사 better가 이어진 덩어리예요.", "why": "made(원형 make 만들다) + him(목적어) + look better(목적격 보어) 순서예요. 사역동사 뒤에는 동사원형 look을 써요. 그래서 '그를 더 나아 보이게 했다'가 돼요.", "opts": [], "pencil": "make + 목적어 + ___ (~하게 하다)", "pencilKey": "동사원형", "page": 21, "sec": "s1"}, {"id": "S1-21", "step": 1, "no": 21, "qtype": "유형 03 사역동사와 지각동사의 5형식", "type": "write", "ans": "felt something coming toward her", "concept": ["031"], "gap": "", "words": [["feel", "느끼다"], ["come toward", "~쪽으로 오다"], ["something", "무언가"]], "h1": "She 뒤에 동사 felt(원형 feel 느끼다)를 먼저 놓고, '무엇이'(something)와 '어떻게 하는 것을'(coming)을 이어 보세요.", "h2": "지각동사 + 목적어 + 목적격 보어(동사원형이나 -ing) 순서예요. 주어진 말 중 -ing 모양이 목적격 보어예요. toward her는 방향을 말해서 맨 뒤에 와요.", "why": "She felt something coming toward her.(그녀는 무언가가 자기 쪽으로 오는 것을 느꼈다.)이에요. 지각동사 feel 뒤에 목적어 something과 목적격 보어 coming이 차례로 와요.", "opts": [], "pencil": "지각동사 + 목적어 + ___ (동사원형이나 -ing)", "pencilKey": "목적격 보어", "page": 21, "sec": "s1"}, {"id": "S1-22", "step": 1, "no": 22, "qtype": "유형 03 사역동사와 지각동사의 5형식", "type": "write", "ans": "my brother play [playing]", "concept": ["031"], "gap": "", "words": [["saw", "보았다(원형 see 보다)"], ["baseball", "야구"], ["brother", "남동생, 형"]], "h1": "두 문장을 합치면 '나는 내 남동생이 야구하는 것을 보았다'예요. saw 뒤에 누구를, 어떤 모양으로 이어야 할지 정해 보세요.", "h2": "He was playing은 '그가 놀고 있었다'예요. 이것을 목적격 보어로 바꾸려면 지각동사 규칙에 맞는 모양이 필요해요. 가능한 모양이 두 가지예요.", "why": "지각동사 saw(원형 see 보다) 뒤 목적격 보어에는 동사원형이나 -ing를 써요. 그래서 I saw my brother play[playing] baseball.이 돼요.", "opts": [], "pencil": "지각동사 + 목적어 + 동사원형 또는 ___ ", "pencilKey": "-ing", "page": 21, "sec": "s1"}, {"id": "S1-23", "step": 1, "no": 23, "qtype": "유형 04 통합형", "type": "mc", "ans": "④", "concept": ["030-H1"], "gap": "", "words": [["get", "~하게 하다"], ["expect", "기대하다"], ["guest", "손님"], ["leave", "떠나다"]], "h1": "두 빈칸 앞의 동사가 서로 달라요. get(~하게 하다)과 expect(기대하다) 모두 뒤 목적격 보어의 모양을 정해요.", "h2": "get은 사역동사처럼 '~하게 하다'로 쓰이지만 모양이 달라요. get과 expect가 함께 받는 목적격 보어의 모양을 떠올려 보세요.", "why": "get(준사역동사)과 expect(기대하다)는 모두 목적격 보어로 to부정사를 써요. 그래서 둘 다 to leave가 들어가요.", "opts": [{"n": "①", "en": "leave", "ko": "떠나다(동사원형)", "ok": false, "why": "get과 expect 뒤에는 to부정사가 와서 동사원형만으로는 안 돼요."}, {"n": "②", "en": "leaves", "ko": "떠난다(현재형)", "ok": false, "why": "목적격 보어 자리에 시제가 있는 동사는 올 수 없어요."}, {"n": "③", "en": "left", "ko": "떠났다(과거형)", "ok": false, "why": "시제가 있는 동사는 올 수 없어요."}, {"n": "④", "en": "to leave", "ko": "떠나도록(to부정사)", "ok": true, "why": "get과 expect 모두 to부정사를 받아서 맞아요."}, {"n": "⑤", "en": "leaving", "ko": "떠나는(-ing)", "ok": false, "why": "get과 expect 뒤에 -ing 모양은 쓰지 않아요."}], "pencil": "get, expect + 목적어 + ___ ", "pencilKey": "to부정사", "page": 21, "sec": "s1"}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 03 사역동사와 지각동사의 5형식", "type": "mc", "ans": "⑤", "concept": ["030-H1", "031"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["see", "보다"], ["make", "시키다"], ["have", "시키다"], ["let", "허락하다"], ["want", "원하다"]], "h1": "'어색한 것'을 고르는 문제예요. 빈칸 뒤가 me come(동사원형)이에요. 동사원형을 받을 수 있는 동사를 하나씩 확인하세요.", "h2": "사역동사(make, have, let)와 지각동사(see 등)는 동사원형을 받아요. want는 어떤 모양을 받는지 떠올려 보세요.", "why": "want(원하다)는 목적격 보어로 to부정사를 써서 me come이 어색해요. 나머지는 사역동사나 지각동사라서 동사원형 come을 받을 수 있어요.", "opts": [{"n": "①", "en": "saw", "ko": "보았다(원형 see 보다)", "ok": false, "why": "지각동사라서 me come(동사원형)을 받을 수 있어요."}, {"n": "②", "en": "made", "ko": "시켰다(원형 make 만들다)", "ok": false, "why": "사역동사라서 동사원형을 받을 수 있어요."}, {"n": "③", "en": "had", "ko": "시켰다(원형 have 시키다)", "ok": false, "why": "사역동사라서 동사원형을 받을 수 있어요."}, {"n": "④", "en": "let", "ko": "허락했다(원형 let 허락하다)", "ok": false, "why": "사역동사라서 동사원형을 받을 수 있어요."}, {"n": "⑤", "en": "wanted", "ko": "원했다(원형 want 원하다)", "ok": true, "why": "want는 to부정사를 받아서 me come은 어색해요. me to come이어야 해요."}], "pencil": "want + 목적어 + ___ 모양을 쓴다", "pencilKey": "to부정사", "page": 21, "sec": "s1"}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 03 사역동사와 지각동사의 5형식", "type": "mc", "ans": "⑤", "concept": ["030-H1", "030"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["call", "부르다"], ["homework", "숙제"], ["finish", "끝내다"], ["enjoy", "즐기다"]], "h1": "'어색한 문장'을 고르는 문제예요. 각 문장에서 목적어 뒤 동사의 모양이 앞 동사에 맞는지 하나씩 확인해 보세요.", "h2": "help(돕다)는 동사원형이나 to부정사를 받아요. -ing 모양을 받을 수 있는지 생각해 보세요. 그리고 want는 to부정사를 받아요.", "why": "help(돕다) 뒤 목적격 보어에는 동사원형이나 to부정사를 써요. learning을 (to) learn으로 고쳐야 해요. 나머지 문장은 모두 맞아요.", "opts": [{"n": "①", "en": "We call him John.", "ko": "우리는 그를 John이라고 부른다.", "ok": false, "why": "call + 목적어 + 명사로 맞아요."}, {"n": "②", "en": "Mom had me do my homework.", "ko": "엄마는 내가 숙제를 하게 하셨다.", "ok": false, "why": "사역동사 have + 목적어 + 동사원형으로 맞아요."}, {"n": "③", "en": "His joke always makes me laugh.", "ko": "그의 농담은 항상 나를 웃게 한다.", "ok": false, "why": "사역동사 make + 목적어 + 동사원형으로 맞아요."}, {"n": "④", "en": "I want you to finish this work today.", "ko": "나는 네가 오늘 이 일을 끝내기를 바란다.", "ok": false, "why": "want + 목적어 + to부정사로 맞아요."}, {"n": "⑤", "en": "Parents help their children learning to enjoy life.", "ko": "부모는 아이들이 삶을 즐기는 법을 배우도록 돕는다.", "ok": true, "why": "help 뒤에는 동사원형이나 to부정사가 와요. learning은 (to) learn으로 고쳐야 해요."}], "pencil": "help + 목적어 + (to) ___ 을 쓴다", "pencilKey": "동사원형", "page": 21, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "문장의 형식", "type": "mc", "ans": "④", "concept": ["029-2", "030"], "gap": "", "words": [["believe", "믿다"], ["honest", "정직한"], ["musician", "음악가"], ["helpful", "도움이 되는"], ["entire", "전체의"]], "h1": "'나머지 넷과 다른 하나'를 찾는 문제예요. 각 문장에서 동사 뒤에 사람과 물건이 따로 나오는지, 아니면 목적어를 설명하는 말이 나오는지 살펴보세요.", "h2": "5형식은 '목적어 = 뒤의 말'이 성립해요(Sean = 정직한). 4형식은 사람과 물건이 따로여서 '~에게 …을'이 돼요. 이 구별이 안 되는 한 문장을 찾아보세요.", "why": "My teacher sent me a nice card.는 me(사람)와 a nice card(물건)가 따로인 4형식이에요. 나머지는 목적어를 설명하는 말이 이어지는 5형식이에요.", "opts": [{"n": "①", "en": "I believe Sean honest.", "ko": "나는 Sean이 정직하다고 믿는다.", "ok": false, "why": "Sean = honest 관계의 5형식이에요."}, {"n": "②", "en": "Jina made her son a musician.", "ko": "Jina는 아들을 음악가로 만들었다.", "ok": false, "why": "her son = a musician 관계의 5형식이에요."}, {"n": "③", "en": "I found her advice very helpful.", "ko": "나는 그녀의 조언이 매우 도움이 된다고 생각했다.", "ok": false, "why": "her advice = very helpful 관계의 5형식이에요."}, {"n": "④", "en": "My teacher sent me a nice card.", "ko": "선생님은 내게 멋진 카드를 보내 주셨다.", "ok": true, "why": "me와 a nice card가 따로인 4형식이라 나머지와 달라요."}, {"n": "⑤", "en": "He made her clean the entire house.", "ko": "그는 그녀가 집 전체를 청소하게 했다.", "ok": false, "why": "her가 청소하는 관계의 5형식이에요."}], "pencil": "5형식은 목적어와 뒤의 말이 ___ 관계예요", "pencilKey": "같은 대상이라는", "page": 22, "sec": "s2"}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "문장의 형식", "type": "mc", "ans": "③", "concept": ["029-2", "030"], "gap": "", "words": [["delicious", "맛있는"], ["final match", "결승전"], ["excited", "신이 난"], ["bring", "가져오다"]], "h1": "첫 문장은 사람(his mother)과 물건(a cake)이 이어지고, 둘째 문장은 me와 excited가 이어져요. 두 문장의 형식이 서로 어떻게 다른지 먼저 보세요.", "h2": "첫 문장은 '~에게 …을 만들어 주다', 둘째 문장은 '~를 …하게 만들다'예요. 두 가지 뜻을 모두 가질 수 있는 동사를 찾으세요. 실전 팁처럼 간접목적어와 직접목적어, 목적어와 목적격 보어를 구별하세요.", "why": "make(만들다)는 4형식('~에게 …을 만들어 주다')과 5형식('~를 …하게 만들다')을 모두 쓸 수 있어요. 그래서 두 문장에 모두 made(원형 make 만들다)가 들어가요.", "opts": [{"n": "①", "en": "sent", "ko": "보냈다(원형 send 보내다)", "ok": false, "why": "첫 문장에는 되지만 'sent me excited'는 5형식이 안 되어서 둘째 문장에 맞지 않아요."}, {"n": "②", "en": "wanted", "ko": "원했다(원형 want 원하다)", "ok": false, "why": "want는 4형식(사람 + 물건)으로 쓰지 않아서 첫 문장에 맞지 않아요."}, {"n": "③", "en": "made", "ko": "만들었다(원형 make 만들다)", "ok": true, "why": "4형식과 5형식을 모두 만들 수 있어서 두 문장 모두에 맞아요."}, {"n": "④", "en": "gave", "ko": "주었다(원형 give 주다)", "ok": false, "why": "첫 문장에는 되지만 'gave me excited'는 어색해서 둘째 문장에 맞지 않아요."}, {"n": "⑤", "en": "brought", "ko": "가져다주었다(원형 bring 가져오다)", "ok": false, "why": "첫 문장에는 되지만 둘째 문장에 쓰면 어색해요."}], "pencil": "make는 4형식과 ___ 형식을 모두 만들 수 있다", "pencilKey": "5", "page": 22, "sec": "s2"}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "목적격 보어의 형태", "type": "mc", "ans": "①", "concept": ["030", "029-2"], "gap": "", "words": [["elect", "선출하다"], ["chairperson", "의장, 회장"], ["become", "~이 되다"]], "h1": "They elected Jane Smith chairperson.의 뜻을 먼저 우리말로 풀어 보세요. 'Jane Smith를 무엇으로 선출했다'인지 찾으세요.", "h2": "실전 팁처럼 목적어와 명사인 목적격 보어는 '목적어 = 목적격 보어' 관계예요. 이 관계가 보기 중 어떤 문장으로 바뀌는지 따져 보세요.", "why": "elect(선출하다)는 「elect + 목적어 + 목적격 보어」라서 'Jane Smith = 회장'이에요. 선출되었으니 Jane Smith는 회장이 되었다는 뜻이에요.", "opts": [{"n": "①", "en": "Jane Smith became a chairperson.", "ko": "Jane Smith는 회장이 되었다.", "ok": true, "why": "선출된 사람이 회장이 되었다는 뜻이라 가장 비슷해요."}, {"n": "②", "en": "Jane Smith saw the chairperson.", "ko": "Jane Smith는 회장을 보았다.", "ok": false, "why": "'보았다'는 선출했다는 뜻이 없어요."}, {"n": "③", "en": "Jane Smith elected the chairperson.", "ko": "Jane Smith는 회장을 선출했다.", "ok": false, "why": "Jane Smith가 선출한 사람이 되어 뜻이 반대예요."}, {"n": "④", "en": "Jane Smith did not want to be a chairperson.", "ko": "Jane Smith는 회장이 되고 싶어 하지 않았다.", "ok": false, "why": "원하지 않았다는 내용은 주어진 문장에 없어요."}, {"n": "⑤", "en": "Jane Smith wanted to be a chairperson.", "ko": "Jane Smith는 회장이 되고 싶어 했다.", "ok": false, "why": "바랐다는 내용은 주어진 문장에 없어요."}], "pencil": "elect + 목적어 + 명사는 목적어 = ___ 관계예요", "pencilKey": "목적격 보어", "page": 22, "sec": "s2"}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "목적격 보어의 형태", "type": "mc", "ans": "④", "concept": ["030", "029-2"], "gap": "", "words": [["choose", "고르다"], ["member", "회원"], ["club", "동아리"]], "h1": "괄호 속 말을 배열해서 We chose ... 로 시작하는 5형식 문장을 만들어 보세요. 목적어는 누구이고, 그 목적어를 설명하는 말은 무엇일까요?", "h2": "5형식은 「주어 + 동사 + 목적어 + 목적격 보어」예요. Jack and Jenny는 사람이고, '우리 동아리의 ○○'이라는 설명이 필요해요. 설명하는 말이 되는 것을 찾으세요.", "why": "We chose Jack and Jenny the members of our club.(우리는 Jack과 Jenny를 동아리 회원으로 뽑았다.)이에요. 목적어 Jack and Jenny를 설명하는 말이 the members예요.", "opts": [{"n": "①", "en": "chose", "ko": "골랐다(원형 choose 고르다)", "ok": false, "why": "동사예요. 목적격 보어가 아니에요."}, {"n": "②", "en": "and Jenny", "ko": "그리고 Jenny", "ok": false, "why": "목적어 Jack과 함께 목적어를 이루는 말이에요."}, {"n": "③", "en": "Jack", "ko": "Jack", "ok": false, "why": "목적어의 일부예요."}, {"n": "④", "en": "the members", "ko": "회원들", "ok": true, "why": "목적어 Jack and Jenny를 설명하는 목적격 보어예요."}, {"n": "⑤", "en": "we", "ko": "우리는", "ok": false, "why": "주어예요."}], "pencil": "목적격 보어는 목적어를 ___ 하는 말이에요", "pencilKey": "설명", "page": 22, "sec": "s2"}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "목적격 보어의 형태", "type": "mc", "ans": "⑤", "concept": ["030", "030-H1"], "gap": "", "words": [["clown", "광대, 어릿광대"], ["surprised", "놀란"], ["leader", "지도자"], ["quietly", "조용히"]], "h1": "알맞지 않은 것을 고르는 문제예요. made him 뒤에는 him을 설명하는 말이 와요. 이 자리에 올 수 없는 모양을 찾으세요.", "h2": "make(만들다)의 목적격 보어에는 명사와 형용사는 올 수 있어요. 올 수 없는 품사 하나가 보기 안에 있어요. 단어 끝 모양도 힌트예요.", "why": "make(만들다)의 목적격 보어로 명사나 형용사는 쓸 수 있지만 부사는 쓸 수 없어요. quietly(조용히)는 부사예요.", "opts": [{"n": "①", "en": "a leader", "ko": "지도자", "ok": false, "why": "명사라서 him = a leader 관계가 돼요. 쓸 수 있어요."}, {"n": "②", "en": "a clown", "ko": "광대", "ok": false, "why": "명사라서 쓸 수 있어요."}, {"n": "③", "en": "surprised", "ko": "놀란", "ok": false, "why": "형용사라서 쓸 수 있어요."}, {"n": "④", "en": "happy", "ko": "행복한", "ok": false, "why": "형용사라서 쓸 수 있어요."}, {"n": "⑤", "en": "quietly", "ko": "조용히", "ok": true, "why": "부사라서 목적격 보어 자리에 쓸 수 없어요. 이것이 답이에요."}], "pencil": "make의 목적격 보어로 명사와 형용사는 되지만 ___ 는 안 된다", "pencilKey": "부사", "page": 22, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "목적격 보어의 형태", "type": "mc", "ans": "②", "concept": ["030-H1", "030"], "gap": "", "words": [["allow", "허락하다"], ["go shopping", "쇼핑하러 가다"], ["upset", "속상한"]], "h1": "대화에서 B는 쇼핑하러 가고 싶은데 엄마가 어떻게 한다는 내용이에요. won't allow(허락하지 않을 것이다) 뒤의 me와 빈칸을 보세요.", "h2": "allow(허락하다)는 want, ask처럼 목적어 뒤 동사의 모양을 정해요. 사역동사처럼 동사원형을 쓰는지, 다른 모양을 쓰는지 떠올려 보세요.", "why": "allow(허락하다) + 목적어 뒤에는 to부정사를 써요. 그래서 my mom won't allow me to go.(엄마가 내가 가는 것을 허락하지 않을 것이다.)가 돼요.", "opts": [{"n": "①", "en": "go", "ko": "가다(동사원형)", "ok": false, "why": "allow 뒤에는 to부정사가 와서 동사원형만으로는 안 돼요."}, {"n": "②", "en": "to go", "ko": "가도록(to부정사)", "ok": true, "why": "allow + 목적어 + to부정사 모양이라 맞아요."}, {"n": "③", "en": "going", "ko": "가는(-ing 형태)", "ok": false, "why": "allow 뒤에는 -ing가 아니라 to부정사를 써요."}, {"n": "④", "en": "gone", "ko": "가 버린(과거분사)", "ok": false, "why": "과거분사 모양은 이 자리에 맞지 않아요."}, {"n": "⑤", "en": "went", "ko": "갔다(과거형)", "ok": false, "why": "동사의 과거형은 목적격 보어로 쓸 수 없어요."}], "pencil": "allow + 목적어 + ___ 모양을 쓴다", "pencilKey": "to부정사", "page": 22, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "목적격 보어의 형태", "type": "mc", "ans": "②", "concept": ["030", "030-H1"], "gap": "", "words": [["find", "알게 되다"], ["interesting", "흥미로운, 재미있는"], ["interested", "흥미를 느끼는"]], "h1": "Justin이 영화가 어떻다는 것을 알았는지 말하는 자리예요. 영화(the movie)를 설명하는 말이 필요해요. 어떤 모양의 말이 올까요?", "h2": "find(알게 되다)는 목적어 뒤에 형용사를 써요. 그런데 영화는 재미를 '주는' 쪽이에요. -ing와 -ed 모양 형용사 중에서 영화에 어울리는 쪽을 고르세요.", "why": "find(알게 되다) + 목적어 뒤에는 형용사를 써요. 영화가 재미를 주는 쪽이라서 '재미있는'이라는 뜻의 interesting을 써요.", "opts": [{"n": "①", "en": "interest", "ko": "흥미", "ok": false, "why": "명사라서 the movie = interest가 되어 뜻이 이상해요."}, {"n": "②", "en": "interesting", "ko": "재미있는", "ok": true, "why": "형용사이고 영화가 재미를 주는 뜻이라 맞아요."}, {"n": "③", "en": "interestingly", "ko": "흥미롭게", "ok": false, "why": "부사라서 목적격 보어 자리에 올 수 없어요."}, {"n": "④", "en": "to interest", "ko": "흥미를 끌도록(to부정사)", "ok": false, "why": "find 뒤에는 to부정사를 쓰지 않아요."}, {"n": "⑤", "en": "to be interested", "ko": "흥미를 느끼도록(to부정사)", "ok": false, "why": "find 뒤에 to부정사를 쓰지 않고, 뜻도 영화에 어울리지 않아요."}], "pencil": "find + 목적어 + ___ (형용사)", "pencilKey": "형용사", "page": 22, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "사역동사와 지각동사의 5형식", "type": "write", "ans": "yell [yelling]", "concept": ["031"], "gap": "", "words": [["hear", "듣다"], ["opera singer", "오페라 가수"], ["yell", "소리치다"]], "h1": "heard는 hear(듣다)의 과거형이에요. 밑줄 친 yelled가 a famous opera singer를 설명하는 말 자리인지 확인해 보세요.", "h2": "지각동사 뒤 목적격 보어에는 과거형을 쓰지 않아요. 가능한 두 가지 모양을 떠올려서 고쳐 쓰세요.", "why": "지각동사 hear(듣다)의 목적격 보어에는 동사원형이나 -ing를 써요. 그래서 yelled를 yell 또는 yelling으로 고쳐요.", "opts": [], "pencil": "지각동사 뒤 목적격 보어는 동사원형 또는 ___", "pencilKey": "-ing", "page": 23, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "사역동사와 지각동사의 5형식", "type": "write", "ans": "My mother saw my brother crying. [또는 My mother heard my brother crying.]", "concept": ["031"], "gap": "", "words": [["see", "보다"], ["hear", "듣다"], ["cry", "울다"]], "h1": "My mother ___ my brother crying. 빈칸에는 '엄마가 남동생이 우는 것을 ~했다'에 맞는 동사가 들어가요. 보기 네 개의 뜻을 하나씩 넣어 보세요.", "h2": "목적격 보어 자리에 -ing(crying)가 쓰였어요. -ing를 받을 수 있는 동사는 어떤 종류일까요? 사역동사와 지각동사를 구별해 보세요.", "why": "crying처럼 -ing가 오는 목적격 보어는 지각동사와 함께 써요. saw(원형 see 보다)와 heard(원형 hear 듣다)가 들어가서 '남동생이 우는 것을 보았다/들었다'가 돼요.", "opts": [], "pencil": "-ing를 목적격 보어로 받는 동사는 ___ 동사", "pencilKey": "지각", "page": 23, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "사역동사와 지각동사의 5형식", "type": "write", "ans": "made Jamie water the plants [또는 had Jamie water the plants]", "concept": ["030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["tell", "말하다"], ["water", "물을 주다"], ["plant", "식물"], ["make", "시키다"], ["have", "시키다"]], "h1": "'Jamie의 엄마가 Jamie에게 식물에 물을 주라고 말했다'를 '~에게 …하게 했다'는 한 문장으로 바꾸는 문제예요. 사역동사를 이용하세요.", "h2": "사역동사에는 make, have, let이 있어요. '시켰다'는 뜻으로 쓸 수 있는 것 두 가지를 고르고, 목적어 뒤 동사는 어떤 모양일지 정하세요.", "why": "엄마가 시켜서 한 일이라서 사역동사 made(원형 make 시키다) 또는 had(원형 have 시키다)를 써요. 목적격 보어는 동사원형 water(원형 water 물을 주다)예요.", "opts": [], "pencil": "사역동사 make, have + 목적어 + ___", "pencilKey": "동사원형", "page": 23, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "사역동사와 지각동사의 5형식", "type": "write", "ans": "the boy (to) look for a bathroom", "concept": ["030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["look for", "~을 찾다"], ["bathroom", "화장실"], ["help", "돕다"]], "h1": "두 문장을 합치면 'Ed는 그 소년이 화장실을 찾는 것을 도왔다'예요. helped 뒤에 누구를, 어떤 모양으로 이을지 정해 보세요.", "h2": "help(돕다)는 특별해서 목적격 보어에 동사원형을 써도 되고 to부정사를 써도 돼요. The boy was looking for의 look for 부분을 목적격 보어로 바꿔 보세요.", "why": "help(돕다) + 목적어 + 목적격 보어 순서로 써요. 목적격 보어에는 동사원형이나 to부정사가 와서 the boy (to) look for a bathroom이 돼요.", "opts": [], "pencil": "help + 목적어 + (to) ___", "pencilKey": "동사원형", "page": 23, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "사역동사와 지각동사의 5형식", "type": "write", "ans": "I made him cross the street.", "concept": ["030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["cross", "건너다"], ["street", "길, 거리"], ["make", "시키다"]], "h1": "'나는 그가 길을 건너게 했다'에서 주어, 동사, 목적어, 목적격 보어를 하나씩 찾아 주어진 말에 대 보세요.", "h2": "made(원형 make 시키다)는 사역동사라서 목적어 뒤에 동사원형이 와요. 주어진 말에 cross(건너다)의 모양이 바뀌어 있는지 확인하세요.", "why": "I(주어) + made(동사) + him(목적어) + cross the street(목적격 보어) 순서예요. 사역동사 made 뒤에는 동사원형 cross를 써요.", "opts": [], "pencil": "사역동사 + 목적어 + ___ 순서", "pencilKey": "동사원형", "page": 23, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "사역동사와 지각동사의 5형식", "type": "write", "ans": "③, play [playing]", "concept": ["031"], "gap": "", "words": [["see", "보다"], ["badminton", "배드민턴"], ["play", "하다, 놀다"]], "h1": "밑줄 친 다섯 곳 중에서 saw(원형 see 보다) 뒤에 오는 말의 모양이 맞지 않는 곳을 찾아 번호를 쓰세요.", "h2": "saw는 눈으로 알아차리는 지각동사예요. my sister(목적어) 바로 뒤에 오는 말이 지각동사 규칙에 맞는지 확인하세요.", "why": "지각동사 saw 뒤 목적격 보어에는 동사원형이나 -ing를 써요. ③ to play에서 to를 빼서 play 또는 playing으로 고쳐요.", "opts": [], "pencil": "지각동사 뒤 목적격 보어에는 to를 ___", "pencilKey": "붙이지 않는다", "page": 23, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "통합형", "type": "write", "ans": "(1) flying (2) to talk (3) a chicken", "concept": ["030", "030-H1", "031"], "gap": "", "words": [["smile", "미소 짓다"], ["watch", "지켜보다"], ["police", "경찰"], ["chicken", "겁쟁이(닭)"]], "h1": "<보기> You always make me smile.에서 목적격 보어는 목적어 me를 설명하는 smile이에요. 각 문장에서 목적어와 그 뒤 설명하는 말을 찾아보세요.", "h2": "(1)은 지각동사, (2)는 want, (3)은 call이 쓰였어요. 각 동사 뒤에서 목적어 바로 다음에 나오는 말이 목적격 보어예요.", "why": "(1) the birds(목적어) 뒤의 flying, (2) me(목적어) 뒤의 to talk, (3) me(목적어) 뒤의 a chicken이 각각 목적격 보어예요.", "opts": [], "pencil": "목적격 보어는 ___ 바로 뒤에서 목적어를 설명하는 말", "pencilKey": "목적어", "page": 23, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "사역동사와 지각동사의 5형식", "type": "write", "ans": "made the workers move the furniture", "concept": ["030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["force", "강요하다"], ["worker", "일꾼"], ["furniture", "가구"], ["move", "옮기다"]], "h1": "수동 문장 The workers were forced to move the furniture by him.을 '그가 일꾼들에게 가구를 옮기게 했다'로 바꿔 보세요. 주어는 He예요.", "h2": "He 뒤에는 괄호 안의 make를 과거로 써요. 사역동사 뒤 목적격 보어의 모양과, 일꾼들이 목적어가 되는 순서를 정해 보세요.", "why": "He made the workers move the furniture.(그는 일꾼들이 가구를 옮기게 했다.)이에요. 사역동사 made(원형 make 시키다) 뒤 목적격 보어는 동사원형 move예요.", "opts": [], "pencil": "make + 목적어 + ___ (~하게 하다)", "pencilKey": "동사원형", "page": 23, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "문장의 형식", "type": "mc", "ans": "⑤", "concept": ["029-2", "030"], "gap": "", "words": [["parents", "부모님"], ["artist", "예술가"], ["pleased", "기쁜"], ["desk", "책상"]], "h1": "His parents made him ___. 빈칸에 보기를 하나씩 넣었을 때, him과 뒤의 말이 같은 대상인지 아니면 따로인 물건인지 보세요.", "h2": "5형식은 '그는 ~이다/~하다'가 성립해요(him = 예술가). 4형식은 '그에게 …을 만들어 주다'예요. 나머지 넷과 다른 한 개를 찾으세요.", "why": "made him a nice desk는 '그에게 멋진 책상을 만들어 주었다'는 4형식이에요. 나머지는 him을 설명하는 말이 와서 5형식이 돼요.", "opts": [{"n": "①", "en": "an artist", "ko": "예술가", "ok": false, "why": "him = an artist 관계라서 5형식이에요."}, {"n": "②", "en": "pleased", "ko": "기쁜", "ok": false, "why": "him이 기뻐진 상태라서 5형식이에요."}, {"n": "③", "en": "a good person", "ko": "좋은 사람", "ok": false, "why": "him = a good person 관계라서 5형식이에요."}, {"n": "④", "en": "study hard", "ko": "열심히 공부하다", "ok": false, "why": "him이 열심히 공부하게 하는 5형식이에요."}, {"n": "⑤", "en": "a nice desk", "ko": "멋진 책상", "ok": true, "why": "him과 다른 물건이라 4형식이에요. 나머지와 달라요."}], "pencil": "5형식은 '목적어 = ___'가 성립한다", "pencilKey": "목적격 보어", "page": 24, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "문장의 형식", "type": "mc", "ans": "④", "concept": ["029-2", "030"], "gap": "", "words": [["rude", "무례한"], ["behavior", "행동"], ["upset", "속상한"], ["Christmas cookie", "크리스마스 쿠키"]], "h1": "<보기> The movie made me cry.는 me(목적어)와 cry(목적격 보어)가 있는 5형식이에요. 네 문장이 각각 5형식인지 하나씩 확인해 보세요.", "h2": "문장마다 made나 makes 바로 뒤에 목적어가 있고, 그 뒤에 목적어를 설명하는 말이 오는지, 아니면 목적어 뒤에 따로 물건이 오는지 살펴보세요.", "why": "What made you so angry?, Music makes us feel happy., His rude behavior made me upset.의 세 문장이 5형식이에요. Eric made me some Christmas cookies.는 4형식이라 제외돼요.", "opts": [{"n": "①", "en": "없음", "ko": "없다", "ok": false, "why": "5형식 문장이 세 개 있으니 맞지 않아요."}, {"n": "②", "en": "1개", "ko": "1개", "ok": false, "why": "5형식이 세 개 있어서 맞지 않아요."}, {"n": "③", "en": "2개", "ko": "2개", "ok": false, "why": "5형식이 세 개 있어서 맞지 않아요."}, {"n": "④", "en": "3개", "ko": "3개", "ok": true, "why": "5형식 세 문장이 있어서 맞아요."}, {"n": "⑤", "en": "4개", "ko": "4개", "ok": false, "why": "마지막 문장이 4형식이라 네 개는 아니에요."}], "pencil": "make + 사람 + 물건은 ___ 형식이에요", "pencilKey": "4", "page": 24, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "목적격 보어의 형태", "type": "mc", "ans": "①, ⑤", "concept": ["030", "030-H1", "029-2"], "gap": "", "words": [["keep", "계속 ~하게 하다"], ["strong", "강한"], ["difficult", "어려운"], ["speechless", "말문이 막힌"], ["drawer", "서랍"]], "h1": "<보기>의 밑줄 친 strong은 목적어 her를 설명하는 말이에요. 각 문장의 밑줄 친 부분이 바로 앞 목적어를 설명하는 말인지 확인해 보세요.", "h2": "밑줄 친 말이 꾸미는 말(부사나 장소 표현)이거나, 목적어와 다른 물건(직접목적어)이면 역할이 달라요. 목적어와 같은 대상을 설명하는 것만 모두 고르세요.", "why": "<보기>의 strong은 목적격 보어예요. ① difficult는 English를, ⑤ speechless는 everybody를 설명하는 목적격 보어라서 역할이 같아요.", "opts": [{"n": "①", "en": "He found English difficult.", "ko": "그는 영어가 어렵다고 생각했다.", "ok": true, "why": "English = difficult 관계라서 목적격 보어예요. 정답이에요."}, {"n": "②", "en": "Tim kept this secret carefully.", "ko": "Tim은 이 비밀을 조심스럽게 지켰다.", "ok": false, "why": "carefully는 동사를 꾸미는 부사라서 역할이 달라요."}, {"n": "③", "en": "She will make him a special dinner.", "ko": "그녀는 그에게 특별한 저녁을 만들어 줄 것이다.", "ok": false, "why": "a special dinner는 직접목적어라서 역할이 달라요."}, {"n": "④", "en": "I found the book in the drawer.", "ko": "나는 그 책을 서랍 안에서 찾았다.", "ok": false, "why": "in the drawer는 장소를 말하는 꾸미는 말이라 역할이 달라요."}, {"n": "⑤", "en": "The news left everybody speechless.", "ko": "그 소식은 모두를 말문이 막히게 했다.", "ok": true, "why": "everybody = speechless 관계라서 목적격 보어예요. 정답이에요."}], "pencil": "목적격 보어는 ___ 를 설명하는 말이다", "pencilKey": "목적어", "page": 24, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "사역동사와 지각동사의 5형식", "type": "mc", "ans": "③", "concept": ["030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["toothache", "치통"], ["puzzle", "퍼즐"], ["cartoon", "만화"], ["laugh", "웃다"], ["hairstyle", "머리 모양"]], "h1": "밑줄 친 make(만들다) 뒤의 순서를 보세요. 사역동사는 '사역동사 + 목적어 + 동사원형' 순서예요. 이 순서가 깨진 문장이 있는지 찾아보세요.", "h2": "각 보기에서 make 바로 뒤에 목적어(me, some people 등)가 오고 그다음에 동사가 오는지 확인하세요. 동사가 목적어보다 앞에 나온 문장이 있어요.", "why": "make laugh me에서는 동사가 목적어보다 앞에 있어서 틀렸어요. make me laugh a lot처럼 목적어를 먼저 쓰고 동사원형을 뒤에 써요.", "opts": [{"n": "①", "en": "A toothache makes me feel bad.", "ko": "치통은 나를 기분 나쁘게 한다.", "ok": false, "why": "makes + me + feel 순서라서 맞아요."}, {"n": "②", "en": "Puzzles make me think a lot.", "ko": "퍼즐은 나를 많이 생각하게 한다.", "ok": false, "why": "make + me + think 순서라서 맞아요."}, {"n": "③", "en": "Funny cartoons make laugh me a lot.", "ko": "웃긴 만화는 나를 많이 웃게 한다.", "ok": true, "why": "동사 laugh가 목적어 me보다 앞에 와서 틀렸어요. make me laugh로 써야 해요."}, {"n": "④", "en": "The film will make some people cry.", "ko": "그 영화는 몇몇 사람을 울게 할 것이다.", "ok": false, "why": "make + some people + cry 순서라서 맞아요."}, {"n": "⑤", "en": "A new hairstyle makes my sister feel good.", "ko": "새 머리 모양은 내 여동생을 기분 좋게 한다.", "ok": false, "why": "makes + my sister + feel 순서라서 맞아요."}], "pencil": "make + ___ + 동사원형 순서", "pencilKey": "목적어", "page": 24, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "사역동사와 지각동사의 5형식", "type": "mc", "ans": "①", "concept": ["031"], "gap": "", "words": [["call", "전화하다"], ["help", "돕다"], ["potato", "감자"], ["burn", "타다"], ["playground", "운동장"]], "h1": "'쓰임이 어색한 것'을 고르는 문제예요. 밑줄 친 동사들이 지각동사나 사역동사인지 보고, 뒤에 오는 말의 모양이 맞는지 확인하세요.", "h2": "heard(원형 hear 듣다) 같은 지각동사의 목적격 보어에는 동사원형이나 -ing가 와요. to부정사가 붙은 문장이 있는지 찾아보세요.", "why": "hear(듣다)는 지각동사라서 목적격 보어로 동사원형이나 -ing를 써요. heard Ellen to call me의 to call은 call 또는 calling으로 고쳐야 해요.", "opts": [{"n": "①", "en": "I heard Ellen to call me.", "ko": "나는 Ellen이 나를 부르는 것을 들었다.", "ok": true, "why": "지각동사 뒤에 to부정사를 써서 어색해요. call 또는 calling이어야 해요."}, {"n": "②", "en": "He saw the girl helping an old woman.", "ko": "그는 그 소녀가 할머니를 돕는 것을 보았다.", "ok": false, "why": "지각동사 + 목적어 + -ing라서 맞아요."}, {"n": "③", "en": "She smelled potatoes burning in the oven.", "ko": "그녀는 오븐에서 감자가 타는 냄새를 맡았다.", "ok": false, "why": "지각동사 + 목적어 + -ing라서 맞아요."}, {"n": "④", "en": "Julie made him wait outside the store.", "ko": "Julie는 그가 가게 밖에서 기다리게 했다.", "ok": false, "why": "사역동사 + 목적어 + 동사원형이라 맞아요."}, {"n": "⑤", "en": "Matt watched some children running on the playground.", "ko": "Matt는 아이들이 운동장에서 뛰는 것을 지켜보았다.", "ok": false, "why": "지각동사 + 목적어 + -ing라서 맞아요."}], "pencil": "지각동사 + 목적어 + ___ 또는 -ing", "pencilKey": "동사원형", "page": 24, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "사역동사와 지각동사의 5형식", "type": "mc", "ans": "③", "concept": ["031", "030-H1"], "gap": "", "words": [["search", "검색하다, 찾다"], ["listen to", "~을 귀 기울여 듣다"], ["bird", "새"], ["loudly", "크게"]], "h1": "'어법상 어색한 것'을 고르는 문제예요. 각 문장에서 동사의 종류(사역동사, 지각동사)와 뒤에 온 동사의 모양이 맞는지 확인하세요.", "h2": "지각동사 listen to(~을 귀 기울여 듣다)의 목적격 보어에도 to부정사는 쓰지 않아요. to가 붙은 문장이 있는지 찾아보세요.", "why": "listen to는 지각동사 표현이라서 목적격 보어에 동사원형이나 -ing를 써요. I listen to the birds to sing은 sing 또는 singing으로 고쳐요.", "opts": [{"n": "①", "en": "I had him cut my hair.", "ko": "나는 그에게 내 머리를 자르게 했다.", "ok": false, "why": "사역동사 have + 목적어 + 동사원형이라 맞아요."}, {"n": "②", "en": "I saw Amy searching the Internet.", "ko": "나는 Amy가 인터넷을 검색하는 것을 보았다.", "ok": false, "why": "지각동사 + 목적어 + -ing라서 맞아요."}, {"n": "③", "en": "I listen to the birds to sing every morning.", "ko": "나는 매일 아침 새들이 노래하는 것을 듣는다.", "ok": true, "why": "지각동사 뒤에 to sing을 써서 어색해요. sing 또는 singing이어야 해요."}, {"n": "④", "en": "I let them take pictures of my dog.", "ko": "나는 그들이 내 강아지 사진을 찍게 해 주었다.", "ok": false, "why": "사역동사 let + 목적어 + 동사원형이라 맞아요."}, {"n": "⑤", "en": "I heard someone calling my name loudly.", "ko": "나는 누군가가 내 이름을 크게 부르는 것을 들었다.", "ok": false, "why": "지각동사 + 목적어 + -ing라서 맞아요."}], "pencil": "listen to도 지각동사처럼 뒤에 ___ 를 붙이지 않는다", "pencilKey": "to", "page": 24, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "사역동사와 지각동사의 5형식", "type": "mc", "ans": "③", "concept": ["030-H1", "031"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["wonderful", "멋진"], ["fall morning", "가을 아침"], ["want", "원하다"], ["take a walk", "산책하다"]], "h1": "빈칸이 두 개예요. 첫 빈칸은 The wonderful fall morning이 주어인 문장의 동사이고, 둘째 빈칸은 me 뒤 목적격 보어예요. 하나씩 따로 정하세요.", "h2": "make(만들다)는 목적격 보어로 동사원형을 쓰고, 그 동사원형(want) 뒤에 to take a walk가 이어져요. 주어가 3인칭 단수일 때 동사가 현재형이면 -s가 붙는 점도 확인하세요.", "why": "make(만들다) 뒤 목적격 보어에는 동사원형을 써서 made me want to take a walk(나를 산책하고 싶게 만들었다)가 돼요. 현재형이면 makes를 써야 해서 make는 3인칭 단수 주어에 맞지 않아요.", "opts": [{"n": "①", "en": "made - to want", "ko": "만들었다 - 원하도록(to부정사)", "ok": false, "why": "make 뒤에는 to 없이 동사원형을 써서 to want는 틀려요."}, {"n": "②", "en": "made - wanting", "ko": "만들었다 - 원하는(-ing)", "ok": false, "why": "make 뒤에는 -ing가 아니라 동사원형이 와요."}, {"n": "③", "en": "made - want", "ko": "만들었다 - 원하다(동사원형)", "ok": true, "why": "make 뒤 동사원형 want가 와서 맞아요."}, {"n": "④", "en": "makes - to want", "ko": "만든다 - 원하도록(to부정사)", "ok": false, "why": "makes는 가능하지만 make 뒤에 to want를 쓰는 것은 틀려요."}, {"n": "⑤", "en": "make - want", "ko": "만든다 - 원하다(동사원형)", "ok": false, "why": "주어가 3인칭 단수라서 현재형은 make가 아니라 makes여야 해요."}], "pencil": "make + 목적어 + ___ (to 없이)", "pencilKey": "동사원형", "page": 24, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "목적격 보어의 형태", "type": "write", "ans": "busily → busy", "concept": ["030", "030-H1"], "gap": "", "words": [["keep", "~하게 유지하다"], ["busily", "바쁘게(부사)"], ["busy", "바쁜"], ["all day", "하루 종일"]], "h1": "keep(~하게 유지하다) 뒤 us 다음에 오는 말이 us를 설명하는 자리인지 확인하세요. 밑줄 친 busily의 품사는 무엇일까요?", "h2": "목적격 보어 자리에는 부사가 올 수 없어요. 부사 busily의 -ily를 떼고 형용사 모양으로 바꿔 보세요.", "why": "keep + 목적어 뒤에는 목적격 보어로 형용사를 써요. busily는 부사라서 틀렸고, busy(바쁜)로 고쳐요.", "opts": [], "pencil": "keep + 목적어 + ___ (부사는 안 돼요)", "pencilKey": "형용사", "page": 25, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "목적격 보어의 형태", "type": "write", "ans": "put → to put", "concept": ["030-H1", "030"], "gap": "", "words": [["tell", "말하다"], ["put", "놓다"], ["cup", "컵"]], "h1": "tell(말하다)은 '~에게 …하라고 말하다'로 쓰여요. him 뒤에 온 동사 put(놓다)의 모양이 맞는지 보세요.", "h2": "tell, ask, advise, want 같은 동사는 목적격 보어로 어떤 모양을 쓰는지 떠올려 보세요. 사역동사와 같은 모양은 아니에요.", "why": "tell(말하다)은 목적격 보어로 to부정사를 써요. told him put을 told him to put(그에게 컵을 놓으라고 말했다)으로 고쳐요.", "opts": [], "pencil": "tell + 목적어 + ___ 모양을 쓴다", "pencilKey": "to부정사", "page": 25, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "목적격 보어의 형태", "type": "write", "ans": "This song makes me comfortable.", "concept": ["030", "030-H1"], "gap": "", "words": [["comfortably", "편안하게(부사)"], ["comfortable", "편안한"], ["make", "만들다"]], "h1": "먼저 동사(make)와 주어(this song)를 정하세요. 조건에 '현재 시제'와 '필요하면 형태 변형'이 있어요. 주어가 3인칭 단수인지도 확인하세요.", "h2": "make + 목적어 + 목적격 보어 순서예요. 주어진 말 중 목적격 보어로 쓸 수 없는 모양이 하나 있어요. 목적격 보어 자리에 맞는 품사로 바꿔 보세요.", "why": "This song makes me comfortable.(이 노래는 나를 편안하게 한다.)이에요. 3인칭 단수 주어라서 makes를 쓰고, 부사 comfortably는 형용사 comfortable로 바꿔요.", "opts": [], "pencil": "make + 목적어 + ___ (부사는 안 돼요)", "pencilKey": "형용사", "page": 25, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "통합형", "type": "write", "ans": "keep yourself warm", "concept": ["030", "030-H1", "046"], "gap": "", "words": [["keep", "~하게 유지하다"], ["warmly", "따뜻하게(부사)"], ["warm", "따뜻한"], ["yourself", "너 자신"]], "h1": "'몸을 따뜻하게 하세요'는 '너 자신을 따뜻한 상태로 유지하세요'라는 뜻이에요. Please 뒤에 동사부터 순서대로 놓아 보세요.", "h2": "명령문의 주어는 you예요. 목적어 자리에는 you가 아니라 '~ 자신'을 뜻하는 말을 써요. 그리고 목적격 보어 자리에는 부사가 올 수 없어요.", "why": "Please keep yourself warm.(몸을 따뜻하게 하세요.)이에요. 명령문의 실질적인 주어가 you라서 목적어는 재귀대명사 yourself를 쓰고, 목적격 보어는 warmly가 아니라 형용사 warm이에요.", "opts": [], "pencil": "keep + yourself + ___ (형용사)", "pencilKey": "형용사", "page": 25, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "목적격 보어의 형태", "type": "write", "ans": "want my mother to be healthy", "concept": ["030-H1", "030"], "gap": "", "words": [["want", "원하다"], ["healthy", "건강한"], ["mother", "어머니"]], "h1": "'나는 어머니가 건강하시기를 원한다'에서 I 다음에 동사 want를 쓰고, '어머니가'(목적어)와 '건강하시기를'(설명하는 말)을 이어 보세요.", "h2": "want(원하다)는 목적격 보어에 동사원형을 쓰지 않아요. be(~이다)를 어떤 모양으로 써야 할지 정해 보세요.", "why": "want(원하다)는 목적격 보어로 to부정사를 써서 I want my mother to be healthy.가 돼요.", "opts": [], "pencil": "want + 목적어 + ___ 모양을 쓴다", "pencilKey": "to부정사", "page": 25, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "목적격 보어의 형태", "type": "write", "ans": "They found the box empty.", "concept": ["030", "030-H1", "029-2"], "gap": "", "words": [["find", "알게 되다"], ["empty", "비어 있는"], ["box", "상자"]], "h1": "'그들은 그 상자가 비어 있는 것을 알았다'를 영어 순서로 놓아 보세요. 주어진 말 중 동사와 목적어, 설명하는 말을 먼저 정하세요.", "h2": "5형식 순서는 「주어 + 동사 + 목적어 + 목적격 보어」예요. find(알게 되다)는 목적격 보어에 형용사를 취해요. full, fully, emptied 같은 말은 모두 쓸 수 있을까요?", "why": "They found the box empty.(그들은 상자가 비어 있는 것을 알았다.)예요. find는 목적격 보어로 형용사를 쓰므로 empty(비어 있는)를 써요.", "opts": [], "pencil": "find + 목적어 + ___ (형용사)", "pencilKey": "형용사", "page": 25, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "통합형", "type": "write", "ans": "made", "concept": ["030-H1", "029"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["make", "만들다, 시키다"], ["visit", "방문하다"], ["model airplane", "모형 비행기"], ["allow", "허락하다"]], "h1": "두 문장 모두 빈칸 뒤에 사람(me / his son)이 와요. 첫 문장은 me visit(동사원형)이 이어지고, 둘째 문장은 his son 뒤에 물건이 이어져요. 두 문장의 형식을 먼저 알아보세요.", "h2": "첫 문장은 5형식(목적격 보어가 동사원형), 둘째 문장은 4형식('~에게 …을 만들어 주다')이에요. 두 문장 모두에 쓸 수 있는 동사는 보기 중 어느 것일까요? 어제 일이라서 모양을 바꿔야 해요.", "why": "make(만들다)는 5형식(me visit)과 4형식(his son a model airplane) 모두에 쓸 수 있어요. 둘 다 과거이므로 made로 써요.", "opts": [], "pencil": "make는 4형식과 ___ 형식 모두 만들 수 있다", "pencilKey": "5", "page": 25, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "사역동사와 지각동사의 5형식", "type": "write", "ans": "to solve → solve", "concept": ["030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["solve", "풀다"], ["on my own", "혼자 힘으로"], ["tell", "말하다"], ["let", "허락하다"]], "h1": "Let me ... solve의 let(허락하다)이 사역동사인지 확인하세요. 앞 문장의 want와 같은 모양으로 쓰면 되는지도 생각해 보세요.", "h2": "실전 팁처럼 목적격 보어로 to부정사가 오는 동사와, 동사원형이 오는 동사는 따로 정리해야 해요. let은 어느 쪽인지 떠올려 고쳐 보세요.", "why": "let(허락하다)은 사역동사라서 목적격 보어에 동사원형을 써요. Let me to solve에서 to를 빼고 Let me solve(내가 풀게 해 줘)로 고쳐요.", "opts": [], "pencil": "사역동사 let + 목적어 + ___ (to 없이)", "pencilKey": "동사원형", "page": 25, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "목적격 보어의 형태", "type": "mc", "ans": "⑤", "concept": ["030-H1", "029"], "gap": "", "words": [["ask", "부탁하다"], ["find", "찾다"], ["finding", "찾는 것"]], "h1": "I asked them ___. 먼저 ask(부탁하다) 뒤의 목적어 them 다음에 올 모양을 정하세요. 그리고 그 뒤에 이어지는 find the book ... 부분이 문장으로 말이 되는지도 보세요.", "h2": "ask는 목적격 보어로 to부정사를 써요. 또 find(찾다)는 뒤에 '무엇을'과 '누구를 위해'가 이어져요. '나를 위해'를 말할 때 전치사가 필요해요.", "why": "ask(부탁하다) + 목적어 + to부정사 순서예요. 그리고 책을 '나를 위해' 찾아 달라는 뜻이라서 find the book for me를 써요.", "opts": [{"n": "①", "en": "that find the book", "ko": "(that과 동사원형이 어색하게 이어진 형태)", "ok": false, "why": "that 뒤에는 주어가 필요하고, ask 뒤 목적격 보어 모양도 맞지 않아요."}, {"n": "②", "en": "finding the book", "ko": "그 책을 찾는 것", "ok": false, "why": "ask 뒤에는 -ing를 쓰지 않아요."}, {"n": "③", "en": "find the book for me", "ko": "나를 위해 그 책을 찾아라(동사원형)", "ok": false, "why": "ask 뒤에는 to부정사가 필요한데 to가 없어요."}, {"n": "④", "en": "to find the book me", "ko": "(전치사 없이 me가 붙은 형태)", "ok": false, "why": "book 뒤 me 앞에 for가 없어서 틀려요."}, {"n": "⑤", "en": "to find the book for me", "ko": "나를 위해 그 책을 찾아 달라고", "ok": true, "why": "ask + 목적어 + to부정사 + for me 순서로 모두 맞아요."}], "pencil": "ask + 목적어 + ___ 모양을 쓴다", "pencilKey": "to부정사", "page": 26, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "사역동사와 지각동사의 5형식", "type": "mc", "ans": "①", "concept": ["031", "030-H1"], "gap": "", "words": [["Maltese dog", "말티즈 개"], ["go for a walk", "산책하러 가다"], ["cute", "귀여운"], ["smile", "미소 짓다"]], "h1": "빈칸이 두 개예요. 첫 빈칸은 hear(듣다) 뒤 people 다음, 둘째 빈칸은 make(만들다) 뒤 me 다음이에요. 각각 어떤 동사 종류인지 먼저 정하세요.", "h2": "지각동사 hear 뒤 목적격 보어에는 동사원형이나 -ing를, 사역동사 make 뒤 목적격 보어에는 동사원형을 써요. 두 조건을 모두 만족하는 보기를 찾으세요.", "why": "hear(듣다) 뒤에는 동사원형이나 -ing, make(만들다) 뒤에는 동사원형이에요. 그래서 hear people say와 make me smile이 맞아요.", "opts": [{"n": "①", "en": "say - smile", "ko": "말하다 - 미소 짓다", "ok": true, "why": "지각동사 뒤와 사역동사 뒤에 모두 동사원형이라 맞아요."}, {"n": "②", "en": "to say - to smile", "ko": "말하도록 - 미소 짓도록", "ok": false, "why": "두 곳 모두 to부정사라서 틀려요."}, {"n": "③", "en": "say - smiled", "ko": "말하다 - 미소 지었다", "ok": false, "why": "make 뒤에 과거형을 쓸 수 없어요."}, {"n": "④", "en": "to say - smile", "ko": "말하도록 - 미소 짓다", "ok": false, "why": "hear 뒤에 to부정사를 쓸 수 없어요."}, {"n": "⑤", "en": "saying - smiling", "ko": "말하는 - 미소 짓는", "ok": false, "why": "hear 뒤의 saying은 가능하지만 make 뒤에 -ing는 쓸 수 없어요."}], "pencil": "hear + 목적어 + 동사원형 또는 ___", "pencilKey": "-ing", "page": 26, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "사역동사와 지각동사의 5형식", "type": "write", "ans": "help", "concept": ["030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["wanted to help", "돕고 싶었다"], ["classroom", "교실"], ["after school", "방과 후에"], ["have", "시키다"]], "h1": "빈칸은 'My teacher had me ___ her.'의 me 뒤 동사 자리예요. 글 앞에서 '무엇을 하고 싶었는지' 찾아서 같은 뜻의 동사를 고르세요.", "h2": "had(원형 have 시키다)는 사역동사라서 me 뒤에 동사원형이 와요. 글 속에서 동사원형 모양으로 쓰인 단어를 찾으세요. '돕고 싶었다'와 '도울 수 있는지 물어봤다'가 힌트예요.", "why": "선생님이 내가 Janet을 돕게 했다는 뜻이 자연스러워요. 사역동사 have(시키다) 뒤에는 동사원형을 쓰므로 help(돕다)를 써요.", "opts": [], "pencil": "사역동사 have + 목적어 + ___ (동사원형)", "pencilKey": "동사원형", "page": 26, "sec": "s4"}, {"id": "S4-04", "step": 4, "no": 4, "qtype": "목적격 보어의 형태", "type": "write", "ans": "help Sue (to) carry", "concept": ["030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["help", "돕다"], ["carry", "나르다"], ["box", "상자"], ["No problem.", "문제없어."]], "h1": "대화에서 Sue는 '도와줄래? 이 상자를 날라야 해'라고 하고 Dave는 '문제없어'라고 해요. 'Dave는 Sue가 상자를 나르는 것을 도울 것이다'를 영어로 바꿔 보세요.", "h2": "will 뒤에는 동사원형이 와요. help(돕다)는 목적격 보어로 동사원형이나 to부정사를 쓸 수 있어요. 어떤 순서로 이을지 정해 보세요.", "why": "Dave will help Sue (to) carry the box.예요. help(돕다) + 목적어(Sue) + 목적격 보어(동사원형 또는 to부정사) 순서로 써요.", "opts": [], "pencil": "help + 목적어 + (to) ___", "pencilKey": "동사원형", "page": 26, "sec": "s4"}, {"id": "S4-05", "step": 4, "no": 5, "qtype": "사역동사와 지각동사의 5형식", "type": "write", "ans": "(1) hear him snore [snoring] (2) saw some children play [playing]", "concept": ["031"], "gap": "", "words": [["snore", "코를 골다"], ["bedroom", "침실"], ["take a walk", "산책하다"], ["hear", "듣다"], ["see", "보다"]], "h1": "(1)은 소리를 듣고 알 수 있다는 뜻이라서 어떤 지각동사를 쓸지 정하고, (2)는 과거의 일이라서 동사의 시제도 정하세요.", "h2": "(1) can 뒤에는 동사원형이 와요. (2) '아이들이 야구하는 것을 보았다'를 지각동사 + 목적어 + 목적격 보어로 쓰세요. 목적격 보어는 동사원형이나 -ing예요.", "why": "(1) 소리를 귀로 알았으니 I can hear him snore [snoring]이에요. (2) 과거의 일이라서 I saw(원형 see 보다) some children play [playing] baseball이에요.", "opts": [], "pencil": "지각동사 + 목적어 + 동사원형 또는 ___", "pencilKey": "-ing", "page": 26, "sec": "s4"}, {"id": "S4-06", "step": 4, "no": 6, "qtype": "사역동사와 지각동사의 5형식", "type": "write", "ans": "[모범답] Do: My parents let me buy my clothes. Don't: My parents don't let me bring friends home.", "concept": ["030-H1"], "gap": "사역동사 make·have·let + 목적어 + 동사원형 (준사역동사 get·help 포함)", "words": [["let", "허락하다"], ["stay out late", "밤늦게까지 밖에 있다"], ["bring", "데려오다"], ["clothes", "옷"]], "h1": "<보기>처럼 허락하는 일은 My parents let me ...로, 허락하지 않는 일은 My parents don't let me ...로 시작해요. 표현 중 하나씩 골라 이어 보세요.", "h2": "let(허락하다)은 사역동사라서 목적어 me 뒤에 동사원형을 써요. 보기 표현은 모두 동사원형이라서 그대로 이어 쓰면 돼요. 부정은 don't를 let 앞에 써요.", "why": "사역동사 let(허락하다) + 목적어 + 동사원형 순서로 써요. 허락하는 일 한 가지(Do)와 허락하지 않는 일 한 가지(Don't)를 모두 써요. 모범답은 'My parents let me buy my clothes.'와 'My parents don't let me bring friends home.'이고, 다른 표현을 골라도 같은 규칙이면 정답이에요.", "opts": [], "pencil": "사역동사 let + 목적어 + ___ (to 없이)", "pencilKey": "동사원형", "page": 26, "sec": "s4"}, {"id": "Q-01", "step": 5, "no": 1, "qtype": "어법 function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
