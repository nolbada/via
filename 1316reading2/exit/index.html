바그다드로 날아갔다."],[6,"Anthony asked for aid, and both zookeepers and local people agreed to help.","Anthony는 도움을 요청했고 동물원 사육사와 지역 주민들 모두가 도와주기로 했다."],[10,"They volunteered as guards for the zoo and searched for animals that had escaped.","그들은 동물원의 경비로 자원했고 탈출했던 동물들을 찾았다."],[11,"International organizations around the world sent supplies and money to the zoo.","세계의 국제기구들이 동물원에 보급품과 돈을 보냈다."]],"w":"10번에서 군인들이 동물원의 경비로 자원했어요(volunteered as guards). Anthony는 날아갔고(3번), 사육사들은 도와주기로 했으며(6번), 국제기구는 보급품과 돈을 보냈어요(11번).","c":2},"h":"7afc1bb141"},{"n":9,"t":"sum","q":"Many people, including zookeepers, soldiers, and international organizations, (A) Anthony, and the zoo (B) six months later.","ko":"사육사, 군인, 국제기구를 포함한 많은 사람들이 Anthony를 (A), 동물원은 6개월 후에 (B).","oko":["(A) 막았고 / (B) 다시 열었다","(A) 도왔고 / (B) 문을 닫았다","(A) 도왔고 / (B) 탈출했다","(A) 싸웠고 / (B) 다시 열었다","(A) 도왔고 / (B) 다시 열었다"],"opts":["(A) stopped / (B) reopened","(A) helped / (B) closed","(A) helped / (B) escaped","(A) fought / (B) reopened","(A) helped / (B) reopened"],"r":{"a":"5) (A) helped / (B) reopened","ev":"6, 9, 11~12번 문장","s":[[6,"Anthony asked for aid, and both zookeepers and local people agreed to help.","Anthony는 도움을 요청했고 동물원 사육사와 지역 주민들 모두가 도와주기로 했다."],[9,"Iraqi and US soldiers worked together to help the animals, even though they had been fighting just weeks earlier.","비록 이라크군과 미군은 몇 주 전만 해도 싸우고 있었지만, 동물들을 돕기 위해 함께 일했다."],[11,"International organizations around the world sent supplies and money to the zoo.","세계의 국제기구들이 동물원에 보급품과 돈을 보냈다."],[12,"Thanks to everyone’s efforts, the Baghdad Zoo reopened to the public just six months later.","모두의 노력 덕택에, 바그다드 동물원은 6개월 만에 대중에게 다시 문을 열었다."]],"w":"6번(사육사), 9번(군인), 11번(국제기구)이 도왔고, 12번에서 6개월 만에 동물원이 다시 열었어요(reopened).","c":5},"h":"26b47512a4"},{"n":10,"t":"fill","q":"At the Baghdad Zoo, Anthony found many [A] cages, and others had [B] or dying animals in them.","ko":"바그다드 동물원에서 Anthony는 많은 [A] 우리를 발견했고, 다른 우리에는 [B] 또는 죽어 가는 동물들이 있었다.","bank":["empty","dead","healthy","happy","local","famous"],"bko":{"empty":"텅 빈","dead":"죽은","healthy":"건강한","happy":"행복한","local":"지역의","famous":"유명한"},"r":{"a":"[A] empty, [B] dead","ev":"4~5번 문장","s":[[4,"At the Baghdad Zoo, he found many empty cages.","바그다드 동물원에서 그는 수많은 텅 빈 우리를 발견했다."],[5,"Others had dead or dying animals in them.","다른 곳들은 그 안에서 죽었거나 죽어가는 동물들이 있었다."]],"w":"4번 many empty cages, 5번 dead or dying animals에서 가져왔어요. healthy나 happy는 죽어 가는 동물과 이어지지 않아요.","c":null},"h":"78b0ea1f76"}]},{"u":5,"id":"nl2-05-1","no":1,"ko":"아이디어 내고 싶은 사람 여기 모여라!","items":[{"n":1,"t":"tf","q":"Only LEGO workers can share ideas for new toys on LEGO Ideas.","ko":"레고 직원만 LEGO Ideas에서 새로운 장난감 아이디어를 공유할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Anyone can share ideas for new products on this site.","누구나 이 사이트에서 새로운 제품에 대한 아이디어를 공유할 수 있다."]],"w":"8번에서 Anyone can share ideas(누구나 아이디어를 공유할 수 있다)고 해요. 직원만 가능하다는 말은 본문과 달라요.","c":"F"},"h":"3a24ed2b81"},{"n":2,"t":"tf","q":"The person who created the product receives a little money from each sale.","ko":"그 제품을 만든 사람은 판매 한 건당 약간의 돈을 받는다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The person who created the product receives a little money from each sale.","그 제품을 만든 사람은 판매 한 건당 약간의 돈을 받는다."]],"w":"11번 문장 그대로예요. 제품을 만든 사람은 판매마다 약간의 돈을 받아요.","c":"T"},"h":"ba1a6155fc"},{"n":3,"t":"tf","q":"If an idea gets 10,000 votes, it always becomes a real toy.","ko":"어떤 아이디어가 일만 표를 받으면 항상 실제 장난감이 된다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"If 10,000 people vote for an idea, LEGO will consider it.","만약 어떤 아이디어에 일만 명의 사람들이 투표를 하면 LEGO는 그 아이디어를 검토한다."],[10,"If they choose it, it will become a real toy.","LEGO가 그 아이디어를 선정하면 그것은 실제 장난감이 된다."]],"w":"9번에서 일만 표를 받으면 LEGO가 그 아이디어를 검토할 뿐이에요. 10번에서 LEGO가 선정해야 실제 장난감이 돼요. 그래서 항상 된다는 말은 틀려요.","c":"F"},"h":"3fae77fd5a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If 10,000 people vote for an idea, LEGO will consider it.)","ko":"만약 어떤 아이디어에 일만 명의 사람들이 투표를 하면 LEGO는 그것을 consider한다.","opts":["거절한다","검토한다","판매한다","잊어버린다"],"word":"consider","r":{"a":"2) 검토한다","ev":"9번 문장","s":[[9,"If 10,000 people vote for an idea, LEGO will consider it.","만약 어떤 아이디어에 일만 명의 사람들이 투표를 하면 LEGO는 그 아이디어를 검토한다."]],"w":"일만 명이 투표한 아이디어를 LEGO가 살펴보고 판단한다는 흐름이에요. 이 다음 10번에서 선정하면 장난감이 되므로 consider = 검토하다예요.","c":2},"h":"cfeaaec532"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (And, of course, LEGO gets thousands of free ideas for new toys.)","ko":"그리고 물론 LEGO도 새로운 장난감에 대한 수천 개의 free 아이디어를 얻는다.","opts":["자유로운","공짜의","한가한","비어 있는"],"word":"free","r":{"a":"2) 공짜의","ev":"12번 문장","s":[[12,"And, of course, LEGO gets thousands of free ideas for new toys.","그리고 물론 LEGO도 새로운 장난감에 대한 수천 개의 공짜 아이디어를 얻는다."]],"w":"LEGO가 사이트에서 사람들이 낸 아이디어를 돈 들이지 않고 얻는다는 뜻이에요. 그래서 free ideas = 공짜 아이디어예요.","c":2},"h":"40a708fdfb"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIf they choose it, it will become a real toy.","ko":"밑줄 친 they가 가리키는 것은?","sko":"LEGO가 그 아이디어를 선정하면 그것은 실제 장난감이 된다.","opts":["일만 명의 사람들","LEGO","아이디어를 낸 사람","새로운 장난감"],"r":{"a":"2) LEGO","ev":"9~10번 문장","s":[[9,"If 10,000 people vote for an idea, LEGO will consider it.","만약 어떤 아이디어에 일만 명의 사람들이 투표를 하면 LEGO는 그 아이디어를 검토한다."],[10,"If they choose it, it will become a real toy.","LEGO가 그 아이디어를 선정하면 그것은 실제 장난감이 된다."]],"w":"9번에서 일만 명의 투표를 받은 아이디어를 LEGO가 검토하고, 10번에서 LEGO가 그것을 선택해요. 선택하는 쪽은 LEGO예요.","c":2},"h":"34963506f5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It’s a win-win situation!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 서로에게 득이 되는 상황인 것이다!","opts":["한쪽만 이득을 보는 상황이다.","서로 경쟁해야 하는 상황이다.","아무도 이득을 보지 못하는 상황이다.","양쪽 모두에게 이득이 되는 상황이다."],"r":{"a":"4) 양쪽 모두에게 이득이 되는 상황이다.","ev":"11~13번 문장","s":[[11,"The person who created the product receives a little money from each sale.","그 제품을 만든 사람은 판매 한 건당 약간의 돈을 받는다."],[12,"And, of course, LEGO gets thousands of free ideas for new toys.","그리고 물론 LEGO도 새로운 장난감에 대한 수천 개의 공짜 아이디어를 얻는다."],[13,"It’s a win-win situation!","이것은 서로에게 득이 되는 상황인 것이다!"]],"w":"11번에서 만든 사람은 돈을, 12번에서 LEGO는 공짜 아이디어를 얻어요. 둘 다 이득이라서 win-win이에요.","c":4},"h":"91a4f90d85"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["LEGO Ideas에서는 누구나 새로운 제품 아이디어를 공유할 수 있다.","LEGO는 투표 없이 모든 아이디어를 장난감으로 만든다.","크라우드소싱은 한 사람이 혼자 아이디어를 내는 방법이다.","LEGO는 아이디어를 얻으려고 많은 돈을 쓴다."],"opts":["Anyone can share ideas for new products on LEGO Ideas.","LEGO makes every idea into a toy without any votes.","Crowdsourcing is a way for one person to think of ideas alone.","LEGO spends a lot of money to get ideas."],"r":{"a":"1) Anyone can share ideas for new products on LEGO Ideas.","ev":"7~8번 문장","s":[[7,"They have a special website called LEGO Ideas.","그들은 LEGO Ideas(레고 아이디어스)라고 불리는 특별한 웹사이트를 갖고 있다."],[8,"Anyone can share ideas for new products on this site.","누구나 이 사이트에서 새로운 제품에 대한 아이디어를 공유할 수 있다."]],"w":"7~8번에서 LEGO Ideas에서 누구나 아이디어를 공유할 수 있다고 해요. 투표 없이 만든다는 말은 9~10번과 다르고, 크라우드소싱은 많은 사람이 하는 것(3~5번)이며, LEGO는 공짜 아이디어를 얻어요(12번).","c":1},"h":"86e24f84fd"},{"n":9,"t":"sum","q":"Crowdsourcing means getting ideas from (A) people. On LEGO Ideas, if 10,000 people (B) for an idea, LEGO will consider it.","ko":"크라우드소싱은 (A) 사람들에게서 아이디어를 얻는 것이다. LEGO Ideas에서 어떤 아이디어에 일만 명이 (B)하면 LEGO는 그것을 검토한다.","oko":["(A) 적은 / (B) 투표","(A) 많은 / (B) 판매","(A) 적은 / (B) 판매","(A) 많은 / (B) 거절","(A) 많은 / (B) 투표"],"opts":["(A) few / (B) vote","(A) many / (B) sell","(A) few / (B) sell","(A) many / (B) refuse","(A) many / (B) vote"],"r":{"a":"5) (A) many / (B) vote","ev":"3~4번, 9번 문장","s":[[3,"It means two people can think of twice as many ideas as one person can.","이는 두 사람이 한 사람이 할 수 있는 것보다 두 배 더 많은 아이디어를 생각해 낼 수 있다는 뜻이다."],[4,"Nowadays, companies use this concept with thousands of people.","최근에, 기업들은 수천 명의 사람들과 이 개념을 이용한다."],[9,"If 10,000 people vote for an idea, LEGO will consider it.","만약 어떤 아이디어에 일만 명의 사람들이 투표를 하면 LEGO는 그 아이디어를 검토한다."]],"w":"3~4번에서 두 사람, 수천 명처럼 많은 사람의 아이디어를 모으는 것이 크라우드소싱이고, 9번에서 일만 명이 투표(vote)하면 검토해요.","c":5},"h":"25205fb40c"},{"n":10,"t":"fill","q":"The person who created the product [A] a little money, and LEGO gets thousands of [B] ideas.","ko":"제품을 만든 사람은 약간의 돈을 [A], LEGO는 수천 개의 [B] 아이디어를 얻는다.","bank":["receives","free","sells","expensive","vote","share"],"bko":{"receives":"받는다","free":"공짜의","expensive":"비싼","vote":"투표하다","share":"공유하다","sells":"판매한다"},"r":{"a":"[A] receives, [B] free","ev":"11~12번 문장","s":[[11,"The person who created the product receives a little money from each sale.","그 제품을 만든 사람은 판매 한 건당 약간의 돈을 받는다."],[12,"And, of course, LEGO gets thousands of free ideas for new toys.","그리고 물론 LEGO도 새로운 장난감에 대한 수천 개의 공짜 아이디어를 얻는다."]],"w":"11번에서 만든 사람이 돈을 받고(receives), 12번에서 LEGO는 공짜(free) 아이디어를 얻어요. sells(판매하다)나 expensive(비싼)는 본문과 반대예요.","c":null},"h":"cc9e7705b6"}]},{"u":5,"id":"nl2-05-2","no":2,"ko":"미국이 깜깜해지는 이유","items":[{"n":1,"t":"tf","q":"Birds follow the stars to find their way at night.","ko":"새들은 밤에 별을 따라가며 길을 찾는다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They often fly at night and find their way by following the stars.","그들은 흔히 밤에 날아 별을 따라감으로써 자신의 길을 찾는다."]],"w":"6번에서 새들은 밤에 날며 별을 따라가서(by following the stars) 길을 찾는다고 해요.","c":"T"},"h":"caa8e29810"},{"n":2,"t":"tf","q":"Lights Out campaigns ask people to turn off unnecessary lights from 6:00 a.m. to 11:00 p.m.","ko":"소등 캠페인은 사람들에게 오전 6시부터 오후 11시까지 불필요한 전등을 끄라고 권한다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"People and companies are encouraged to turn off all unnecessary lights from 11:00 p.m. to 6:00 a.m.","사람들과 기업들은 오후 11시부터 오전 6시까지 모든 불필요한 전등을 끄도록 권장된다."]],"w":"11번에서는 오후 11시부터 오전 6시까지예요. 시간이 거꾸로라서 틀려요.","c":"F"},"h":"e0ec5aee19"},{"n":3,"t":"tf","q":"Lights used for security purposes must be turned off, too.","ko":"치안 목적으로 쓰는 전등도 반드시 꺼야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"If lights are used for security purposes, they can be covered to make them less bright.","전등이 치안 목적으로 사용된다면 덜 밝게 만들기 위해 (덮개가) 씌워질 수도 있다."]],"w":"12번에서 치안용 전등은 덮개를 씌워 덜 밝게 할 수 있다고 해요. 반드시 끄라는 말은 없어요.","c":"F"},"h":"cbe4016270"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, bright lights confuse them.)","ko":"하지만 밝은 불빛이 그들을 confuse한다.","opts":["도와준다","혼란스럽게 한다","부러워한다","떠나게 한다"],"word":"confuse","r":{"a":"2) 혼란스럽게 한다","ev":"7번 문장","s":[[7,"However, bright lights confuse them.","하지만 밝은 불빛이 그들을 혼란스럽게 한다."]],"w":"별을 보고 길을 찾던 새들이 밝은 불빛 때문에 방향을 헷갈려요. 그래서 8번에서 길을 잃거나 창문에 부딪혀요. confuse = 혼란스럽게 하다예요.","c":2},"h":"aadc5f2b7d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If lights are used for security purposes, they can be covered to make them less bright.)","ko":"전등이 치안 목적으로 사용된다면 덜 밝게 만들기 위해 covered될 수 있다.","opts":["치워진다","켜진다","팔린다","덮개가 씌워진다"],"word":"covered","r":{"a":"4) 덮개가 씌워진다","ev":"12번 문장","s":[[12,"If lights are used for security purposes, they can be covered to make them less bright.","전등이 치안 목적으로 사용된다면 덜 밝게 만들기 위해 (덮개가) 씌워질 수도 있다."]],"w":"to make them less bright, 즉 덜 밝게 만들려는 목적이에요. 그래서 전등에 덮개를 씌우는 것이라 covered = 덮개가 씌워진다예요.","c":4},"h":"1d627eb717"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nHowever, bright lights confuse them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"하지만 밝은 불빛이 그들을 혼란스럽게 한다.","opts":["도시들","별들","새들","사람들"],"r":{"a":"3) 새들","ev":"5~7번 문장","s":[[5,"During these times, billions of birds migrate across the country.","이 기간 동안, 수십억 마리의 새가 전국을 가로질러 이동한다."],[6,"They often fly at night and find their way by following the stars.","그들은 흔히 밤에 날아 별을 따라감으로써 자신의 길을 찾는다."],[7,"However, bright lights confuse them.","하지만 밝은 불빛이 그들을 혼란스럽게 한다."]],"w":"밝은 불빛 때문에 혼란스러워지는 쪽은 별을 따라 길을 찾는 새들이에요. 5번 billions of birds, 6번 They를 7번에서 them으로 받았어요.","c":3},"h":"cdb6dd9c48"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Going dark this way not only protects birds but also saves energy.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이런 식으로 어두워지는 것은 새들을 보호할 뿐만 아니라 에너지도 절약한다.","opts":["이렇게 어두워지면 새를 보호하고 에너지도 아낀다.","이렇게 어두워지면 새는 보호하지만 에너지는 낭비한다.","이렇게 어두워져도 새와 에너지에는 도움이 안 된다.","불을 계속 켜 두면 새를 보호하고 에너지도 아낀다."],"r":{"a":"1) 이렇게 어두워지면 새를 보호하고 에너지도 아낀다.","ev":"13번 문장","s":[[13,"Going dark this way not only protects birds but also saves energy.","이런 식으로 어두워지는 것은 새들을 보호할 뿐만 아니라 에너지도 절약한다."]],"w":"not only A but also B는 A뿐만 아니라 B도예요. A = 새 보호, B = 에너지 절약이에요.","c":1},"h":"bc1f8f9fde"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["새들은 낮에만 이동한다.","일부 새들은 밝은 불빛 때문에 건물 창문에 충돌한다.","도시들은 오직 에너지를 아끼려고 불을 끈다.","캠페인은 오전 11시부터 오후 6시까지 불을 끄라고 한다."],"opts":["Birds migrate across the country only during the day.","Some birds crash into the windows of buildings because of bright lights.","Cities turn off their lights only to save energy.","The campaigns ask people to turn off lights from 11:00 a.m. to 6:00 p.m."],"r":{"a":"2) Some birds crash into the windows of buildings because of bright lights.","ev":"7~8번 문장","s":[[7,"However, bright lights confuse them.","하지만 밝은 불빛이 그들을 혼란스럽게 한다."],[8,"Some get lost, while others crash into the windows of buildings.","어떤 새들은 길을 잃는 반면 다른 새들은 건물의 창문에 충돌하기도 한다."]],"w":"7~8번에서 밝은 불빛이 새들을 혼란스럽게 해서 일부는 창문에 충돌해요. 새들은 밤에 날고(6번), 에너지만이 이유가 아니며(2~4번), 시간은 오후 11시~오전 6시예요(11번).","c":2},"h":"15a67f6ec9"},{"n":9,"t":"sum","q":"During spring and fall, billions of birds (A) at night, but bright lights confuse them, and some (B) into the windows of buildings.","ko":"봄과 가을에 수십억 마리의 새가 밤에 (A)하지만, 밝은 불빛이 그들을 혼란스럽게 하고 일부는 건물 창문에 (B)한다.","oko":["(A) 잠자지만 / (B) 떨어진다","(A) 헤엄치지만 / (B) 충돌한다","(A) 날지만 / (B) 탈출한다","(A) 날지만 / (B) 충돌한다","(A) 잠자지만 / (B) 충돌한다"],"opts":["(A) sleep / (B) fall","(A) swim / (B) crash","(A) fly / (B) escape","(A) fly / (B) crash","(A) sleep / (B) crash"],"r":{"a":"4) (A) fly / (B) crash","ev":"5~6번, 8번 문장","s":[[5,"During these times, billions of birds migrate across the country.","이 기간 동안, 수십억 마리의 새가 전국을 가로질러 이동한다."],[6,"They often fly at night and find their way by following the stars.","그들은 흔히 밤에 날아 별을 따라감으로써 자신의 길을 찾는다."],[8,"Some get lost, while others crash into the windows of buildings.","어떤 새들은 길을 잃는 반면 다른 새들은 건물의 창문에 충돌하기도 한다."]],"w":"6번에서 새들은 밤에 날고(fly), 8번에서 일부 새들은 건물 창문에 충돌해요(crash into).","c":4},"h":"b83172ce9c"},{"n":10,"t":"fill","q":"Lights Out campaigns are [A] to help birds, and going dark also [B] energy.","ko":"소등 캠페인은 새들을 돕기 위해 [A], 어두워지는 것은 에너지도 [B].","bank":["designed","saves","migrate","wastes","security","covered"],"bko":{"designed":"고안된","saves":"절약한다","migrate":"이동하다","wastes":"낭비한다","security":"치안","covered":"덮개가 씌워진"},"r":{"a":"[A] designed, [B] saves","ev":"10번, 13번 문장","s":[[10,"Lights Out campaigns are designed to help these birds.","소등 캠페인은 이러한 새들을 돕기 위해 고안되었다."],[13,"Going dark this way not only protects birds but also saves energy.","이런 식으로 어두워지는 것은 새들을 보호할 뿐만 아니라 에너지도 절약한다."]],"w":"10번 be designed to help these birds(새들을 돕기 위해 고안되었다)와 13번 saves energy(에너지도 절약한다)에서 가져왔어요. wastes는 13번과 반대예요.","c":null},"h":"97282204ac"}]},{"u":5,"id":"nl2-05-3","no":3,"ko":"셜록 홈스처럼 되고 싶어!","items":[{"n":1,"t":"tf","q":"Holmes used small details to reach conclusions.","ko":"Holmes는 결론에 이르기 위해 작은 세부 사항들을 이용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He used small details to reach conclusions.","그는 결론에 이르기 위해 작은 세부 사항들을 이용했다."]],"w":"3번 문장 그대로예요. 홈스는 작은 세부 사항들을 이용해 결론에 이르렀어요.","c":"T"},"h":"96b9e18464"},{"n":2,"t":"tf","q":"The second suspect worked hard but did poorly in the subject.","ko":"두 번째 용의자는 열심히 공부했지만 그 과목을 잘하지 못했다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"The second one was smart but lazy.","두 번째 용의자는 똑똑했지만 게을렀다."],[8,"The third one worked hard but did poorly in the subject.","세 번째 용의자는 열심히 공부했지만 그 과목을 잘하지 못했다."]],"w":"열심히 했지만 과목을 못한 사람은 세 번째 용의자(8번)예요. 두 번째 용의자는 똑똑하지만 게을러요(7번).","c":"F"},"h":"e60ef275b3"},{"n":3,"t":"tf","q":"Holmes decided that the thief was the lazy student.","ko":"Holmes는 도둑이 게으른 학생이라고 판단했다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Based on these, he realized that the thief was the athlete.","이것들에 근거해 그는 (문제를 훔친) 도둑이 육상 선수라는 것을 알아차렸다."]],"w":"10번에서 홈스는 도둑이 육상 선수(the athlete)라는 것을 알아차렸어요. 게으른 학생이 아니에요.","c":"F"},"h":"5fb5976c57"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (At the scene of the crime, Holmes discovered two clues: scratches and dirt.)","ko":"범죄 현장에서 Holmes는 두 개의 clues를 발견했는데, 긁힌 자국과 흙이었다.","opts":["도둑","단서","소문","결론"],"word":"clues","r":{"a":"2) 단서","ev":"9번 문장","s":[[9,"At the scene of the crime, Holmes discovered two clues: scratches and dirt.","범죄 현장에서 Holmes는 두 개의 단서를 발견했는데, (그 단서는) 긁힌 자국과 흙이었다."]],"w":"현장에서 찾은 긁힌 자국과 흙이 clues예요. 홈스는 이것들에 근거해 10번에서 도둑을 알아냈으니 clues = 단서예요.","c":2},"h":"275023de9d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If you do, you’ll notice little but important things, just like Sherlock Holmes.)","ko":"그렇게 한다면, 당신은 마치 Sherlock Holmes처럼 작지만 중요한 것들을 notice할 것이다.","opts":["알아차리다","잊어버리다","만들어 내다","숨기다"],"word":"notice","r":{"a":"1) 알아차리다","ev":"15번 문장","s":[[15,"If you do, you’ll notice little but important things, just like Sherlock Holmes.","그렇게 한다면, 당신은 마치 Sherlock Holmes처럼 작지만 중요한 것들을 알아차릴 수 있을 것이다."]],"w":"속도를 늦추고 주변에 관심을 기울이면(14번) 작지만 중요한 것들이 눈에 들어와요. 그래서 notice = 알아차리다예요.","c":1},"h":"92b60ba020"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nThe second one was smart but lazy.","ko":"밑줄 친 one이 가리키는 것은?","sko":"두 번째 용의자는 똑똑했지만 게을렀다.","opts":["탐정","단서","용의자","시험 문제"],"r":{"a":"3) 용의자","ev":"5번, 7번 문장","s":[[5,"There were three suspects.","세 명의 용의자가 있었다."],[7,"The second one was smart but lazy.","두 번째 용의자는 똑똑했지만 게을렀다."]],"w":"5번에서 세 명의 용의자(suspects)가 있다고 하고, 7번 The second one은 그중 두 번째 용의자예요.","c":3},"h":"5be161d684"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So slow down and pay attention to the world around you.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러니 속도를 늦추고 당신 주변의 세상에 관심을 기울여라.","opts":["빨리 걸으며 세상을 돌아다녀라.","주변 세상은 무시하고 앞만 보아라.","속도를 높여 더 많은 일을 해라.","천천히 하며 주변 세상에 관심을 가져라."],"r":{"a":"4) 천천히 하며 주변 세상에 관심을 가져라.","ev":"14번 문장","s":[[14,"So slow down and pay attention to the world around you.","그러니 속도를 늦추고 당신 주변의 세상에 관심을 기울여라."]],"w":"slow down은 속도를 늦추라는 뜻이고, pay attention to는 ~에 관심을 기울이라는 뜻이에요. 정답은 천천히 하며 주변에 관심을 가지라는 말이에요.","c":4},"h":"f3933388d9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["첫 번째 용의자는 게으르고 공부를 못했다.","긁힌 자국은 연필이 만들었다.","흙은 육상 선수의 스파이크 사이에서 떨어져 나왔다.","Holmes는 단서를 보지 않고 사건을 해결했다."],"opts":["The first suspect was lazy and poor at the subject.","The scratches were made by a pencil.","The dirt fell out from between the spikes of the athlete’s shoes.","Holmes solved the case without looking at any clues."],"r":{"a":"3) The dirt fell out from between the spikes of the athlete’s shoes.","ev":"11~12번 문장","s":[[11,"Athletes wear spiked shoes.","육상 선수들은 스파이크가 박힌 운동화를 신는다."],[12,"The spikes caused the scratches, and the dirt fell out from between them!","그 스파이크가 긁힌 자국을 만들었고, 스파이크 사이에서 흙이 떨어져 나왔다!"]],"w":"11~12번에서 육상 선수는 스파이크가 박힌 신발을 신고, 스파이크 사이에서 흙이 떨어졌다고 해요. 첫 번째 용의자는 훌륭한 학생(6번)이고, 긁힌 자국은 스파이크가 만들었으며, 홈스는 단서로 결론을 냈어요(9~10번).","c":3},"h":"31beefda4f"},{"n":9,"t":"sum","q":"Sherlock Holmes solved cases by (A) small details. If we (B) attention to the world around us, we can be like him.","ko":"Sherlock Holmes는 작은 세부 사항들을 (A)해서 사건을 해결했다. 우리도 주변 세상에 관심을 (B)하면 그처럼 될 수 있다.","oko":["(A) 무시해서 / (B) 기울이면","(A) 알아차려서 / (B) 잃으면","(A) 잊어서 / (B) 기울이면","(A) 무시해서 / (B) 잃으면","(A) 알아차려서 / (B) 기울이면"],"opts":["(A) ignoring / (B) pay","(A) noticing / (B) lose","(A) forgetting / (B) pay","(A) ignoring / (B) lose","(A) noticing / (B) pay"],"r":{"a":"5) (A) noticing / (B) pay","ev":"2번, 13~14번 문장","s":[[2,"You can be like Sherlock Holmes if you use one important skill: observation.","만약 당신이 한 가지 중요한 기술을 사용한다면 당신도 Sherlock Holmes처럼 될 수 있는데, 그것은 바로 관찰이다."],[13,"Holmes solved the case by noticing small things!","Holmes는 작은 것들에 주목함으로써 그 사건을 해결했다."],[14,"So slow down and pay attention to the world around you.","그러니 속도를 늦추고 당신 주변의 세상에 관심을 기울여라."]],"w":"13번에서 홈스는 작은 것들에 주목함(noticing)으로써 사건을 해결했고, 14번에서 주변에 관심을 기울이라(pay attention)고 해요.","c":5},"h":"7f2d02f016"},{"n":10,"t":"fill","q":"Holmes found two [A], scratches and dirt, and realized that the [B] was the athlete.","ko":"Holmes는 긁힌 자국과 흙이라는 두 개의 [A]를 찾았고, [B]가 육상 선수라는 것을 알아차렸다.","bank":["clues","thief","subject","detective","spikes","skill"],"bko":{"clues":"단서","thief":"도둑","subject":"과목","detective":"탐정","spikes":"스파이크","skill":"기술"},"r":{"a":"[A] clues, [B] thief","ev":"9~10번 문장","s":[[9,"At the scene of the crime, Holmes discovered two clues: scratches and dirt.","범죄 현장에서 Holmes는 두 개의 단서를 발견했는데, (그 단서는) 긁힌 자국과 흙이었다."],[10,"Based on these, he realized that the thief was the athlete.","이것들에 근거해 그는 (문제를 훔친) 도둑이 육상 선수라는 것을 알아차렸다."]],"w":"9번 two clues(두 단서)와 10번 the thief was the athlete(도둑이 육상 선수)에서 가져왔어요. detective는 홈스 자신이라 육상 선수일 수 없어요.","c":null},"h":"a73bf39292"}]},{"u":5,"id":"nl2-05-4","no":4,"ko":"케첩은 어디에서 왔을까?","items":[{"n":1,"t":"tf","q":"The first ketchup was made in the US.","ko":"최초의 케첩은 미국에서 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"Ketchup, however, is not an American invention.","하지만 케첩은 미국의 발명품이 아니다."],[4,"The first ketchup was made in Vietnam and originally contained pickled fish.","최초의 케첩은 베트남에서 만들어졌고 원래는 절인 생선이 들어 있었다."]],"w":"3번에서 케첩은 미국의 발명품이 아니라고 하고, 4번에서 최초의 케첩은 베트남에서 만들어졌다고 해요.","c":"F"},"h":"16a1b657f2"},{"n":2,"t":"tf","q":"People believe that Vietnamese traders introduced the sauce to China.","ko":"베트남 상인들이 그 소스를 중국에 들여왔다고 여겨진다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"It is believed that Vietnamese traders introduced the sauce to China.","베트남 상인들이 그 소스를 중국에 들여왔다고 여겨진다."]],"w":"6번 문장 그대로예요. It is believed that ~은 ~라고 여겨진다는 뜻이에요.","c":"T"},"h":"2dfeef9103"},{"n":3,"t":"tf","q":"British merchants added tomatoes to ketchup in the 18th century.","ko":"영국 상인들이 18세기에 케첩에 토마토를 추가했다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번, 11번 문장","s":[[8,"Later, in the 18th century, British merchants brought it back to Europe.","후에, 18세기에 영국 상인들이 그것을 유럽으로 가지고 돌아갔다."],[9,"They adapted the sauce to their taste by adding local foods, including mushrooms, oysters, anchovies, and walnuts.","그들은 버섯, 굴, 멸치 그리고 호두를 포함한 현지 음식을 추가함으로써 그 소스를 자신들의 입맛에 맞췄다."],[11,"But in 1812, an American scientist added tomatoes to ketchup.","그러나 1812년에 한 미국 과학자가 토마토를 케첩에 추가했다."]],"w":"영국 상인들은 18세기에 버섯, 굴, 멸치, 호두 같은 현지 음식을 넣었어요(9번). 토마토를 넣은 사람은 1812년의 미국 과학자예요(11번).","c":"F"},"h":"ad77e204fe"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The first ketchup was made in Vietnam and originally contained pickled fish.)","ko":"최초의 케첩은 베트남에서 만들어졌고 원래는 pickled 생선이 들어 있었다.","opts":["말린","절인","얼린","구운"],"word":"pickled","r":{"a":"2) 절인","ev":"4번 문장","s":[[4,"The first ketchup was made in Vietnam and originally contained pickled fish.","최초의 케첩은 베트남에서 만들어졌고 원래는 절인 생선이 들어 있었다."]],"w":"5번에서 이 케첩은 간장과 비슷한 어둡고 묽은 소스였어요. 생선을 식초 같은 것에 담근 절인 생선이므로 pickled = 절인이에요.","c":2},"h":"fc49ea9ed3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It looked similar to soy sauce because it was dark and thin.)","ko":"그것은 색이 어둡고 thin해서 간장과 비슷해 보였다.","opts":["달콤한","걸쭉한","뜨거운","묽은"],"word":"thin","r":{"a":"4) 묽은","ev":"5번 문장","s":[[5,"It looked similar to soy sauce because it was dark and thin.","그것은 색이 어둡고 묽어서 간장과 비슷해 보였다."]],"w":"소스(액체)가 간장과 비슷해 보였다는 문맥이에요. 어둡고 물처럼 묽다는 뜻이 맞아서 thin = 묽은이에요. 걸쭉한은 반대 뜻이에요.","c":4},"h":"a987e0f8fb"},{"n":6,"t":"ref","q":"What does the underlined \"There\" refer to?\nThere, it was called “keh-jup,” which means “fish sauce.”","ko":"밑줄 친 There가 가리키는 것은?","sko":"그곳에서 그것은 ‘keh-jup’이라고 불렸는데, 그것은 ‘생선 소스’를 의미한다.","opts":["베트남","중국","유럽","미국"],"r":{"a":"2) 중국","ev":"6~7번 문장","s":[[6,"It is believed that Vietnamese traders introduced the sauce to China.","베트남 상인들이 그 소스를 중국에 들여왔다고 여겨진다."],[7,"There, it was called “keh-jup,” which means “fish sauce.”","그곳에서 그것은 ‘keh-jup(케접)’이라고 불렸는데, 그것은 ‘생선 소스’를 의미한다."]],"w":"6번에서 베트남 상인들이 소스를 중국에 들여왔다고 하고, 7번의 There는 바로 그곳, 중국이에요.","c":2},"h":"830c6b9d4d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Ketchup, however, is not an American invention.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 케첩은 미국의 발명품이 아니다.","opts":["케첩은 미국에서만 팔린다.","케첩은 미국에서 가장 유명한 발명품이다.","케첩은 미국에서 발명된 것이 아니다.","미국 사람들은 케첩을 좋아하지 않는다."],"r":{"a":"3) 케첩은 미국에서 발명된 것이 아니다.","ev":"3번 문장","s":[[3,"Ketchup, however, is not an American invention.","하지만 케첩은 미국의 발명품이 아니다."]],"w":"not an American invention은 미국의 발명품이 아니라는 뜻이에요. 1~2번에서 미국에서 많이 팔린다고 한 것과 반대로 흐르는 however 문장이에요.","c":3},"h":"e319ce9f40"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["식품 회사들이 한 과학자의 조리법에 설탕과 식초를 더했다.","토마토는 영국 상인들이 처음 케첩에 넣었다.","최초의 케첩에는 토마토와 설탕이 들어 있었다.","케첩은 미국에서 처음 만들어져 베트남으로 퍼졌다."],"opts":["Food companies added sugar and vinegar to a scientist’s recipe.","British merchants first added tomatoes to ketchup.","The first ketchup was made with tomatoes and sugar.","Ketchup was first made in the US and then spread to Vietnam."],"r":{"a":"1) Food companies added sugar and vinegar to a scientist’s recipe.","ev":"11~12번 문장","s":[[11,"But in 1812, an American scientist added tomatoes to ketchup.","그러나 1812년에 한 미국 과학자가 토마토를 케첩에 추가했다."],[12,"Food companies added sugar and vinegar to his recipe.","식품 회사들은 그의 조리법에 설탕과 식초를 추가했다."]],"w":"12번에서 식품 회사들이 그 과학자의 조리법에 설탕과 식초를 더했어요. 토마토는 11번의 미국 과학자가 넣었고, 최초의 케첩에는 절인 생선이 들어 있었어요(4번).","c":1},"h":"37e4ba1c9e"},{"n":9,"t":"sum","q":"Ketchup was first made in (A), then British merchants brought it to Europe, and an American scientist added (B) to it.","ko":"케첩은 처음에 (A)에서 만들어졌고, 영국 상인들이 유럽으로 가져갔으며, 한 미국 과학자가 거기에 (B)를 추가했다.","oko":["(A) 중국 / (B) 설탕","(A) 베트남 / (B) 식초","(A) 중국 / (B) 토마토","(A) 영국 / (B) 토마토","(A) 베트남 / (B) 토마토"],"opts":["(A) China / (B) sugar","(A) Vietnam / (B) vinegar","(A) China / (B) tomatoes","(A) Britain / (B) tomatoes","(A) Vietnam / (B) tomatoes"],"r":{"a":"5) (A) Vietnam / (B) tomatoes","ev":"4번, 8번, 11번 문장","s":[[4,"The first ketchup was made in Vietnam and originally contained pickled fish.","최초의 케첩은 베트남에서 만들어졌고 원래는 절인 생선이 들어 있었다."],[8,"Later, in the 18th century, British merchants brought it back to Europe.","후에, 18세기에 영국 상인들이 그것을 유럽으로 가지고 돌아갔다."],[11,"But in 1812, an American scientist added tomatoes to ketchup.","그러나 1812년에 한 미국 과학자가 토마토를 케첩에 추가했다."]],"w":"4번에서 최초의 케첩은 베트남에서 만들어졌고, 11번에서 미국 과학자가 토마토를 추가했어요. 식초는 식품 회사들이 더한 것(12번)이에요.","c":5},"h":"57e3be1f41"},{"n":10,"t":"fill","q":"British merchants [A] the sauce to their taste by [B] local foods like mushrooms and walnuts.","ko":"영국 상인들은 버섯과 호두 같은 현지 음식을 [B]함으로써 그 소스를 자신들의 입맛에 [A].","bank":["adapted","adding","brought","removing","introduced","selling"],"bko":{"adapted":"맞췄다","adding":"추가하는 것","brought":"가져왔다","removing":"제거하는 것","introduced":"들여왔다","selling":"파는 것"},"r":{"a":"[A] adapted, [B] adding","ev":"9번 문장","s":[[9,"They adapted the sauce to their taste by adding local foods, including mushrooms, oysters, anchovies, and walnuts.","그들은 버섯, 굴, 멸치 그리고 호두를 포함한 현지 음식을 추가함으로써 그 소스를 자신들의 입맛에 맞췄다."]],"w":"9번 They adapted the sauce to their taste by adding local foods에서 가져왔어요. removing(제거)은 현지 음식을 추가했다는 본문과 반대예요.","c":null},"h":"46f759b912"}]},{"u":6,"id":"nl2-06-1","no":1,"ko":"빨대는 누가 만들었을까?","items":[{"n":1,"t":"tf","q":"Marvin Stone invented the drinking straw.","ko":"Marvin Stone이 빨대를 발명했다.","r":{"a":"F (본문과 다른 내용)","ev":"1~2번 문장","s":[[1,"It is often said that Marvin Stone invented the drinking straw, but that’s not true.","흔히 Marvin Stone(마빈 스톤)이 빨대를 발명했다고 하지만, 이는 사실이 아니다."],[2,"He only improved it.","그는 단지 그것을 개선했을 뿐이다."]],"w":"1번에서 스톤이 빨대를 발명했다는 말은 사실이 아니라고 하고, 2번에서 그는 단지 개선했을 뿐이라고 해요.","c":"F"},"h":"0436a93a5b"},{"n":2,"t":"tf","q":"Babylonian royalty never used straws to drink beer.","ko":"바빌로니아 왕족은 맥주를 마시려고 빨대를 쓴 적이 없다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Babylonian royalty also drank beer this way, although they used straws made of gold!","바빌로니아 왕족도 이런 방법으로 맥주를 마시긴 했지만, 그들은 금으로 만든 빨대를 사용했다!"]],"w":"5번에서 바빌로니아 왕족도 이런 방법(빨대)으로 맥주를 마셨다고 해요. 금으로 만든 빨대를 썼어요.","c":"F"},"h":"60e97be33d"},{"n":3,"t":"tf","q":"Marvin Stone invented the first paper straw in 1888.","ko":"Marvin Stone은 1888년에 최초의 종이 빨대를 발명했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Much later, in 1888, Marvin Stone invented the first paper straw.","훨씬 뒤, 1888년에 Marvin Stone은 최초의 종이 빨대를 발명했다."]],"w":"7번 문장 그대로예요. 1888년에 스톤이 최초의 종이 빨대를 발명했어요.","c":"T"},"h":"287a6fbcf3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He only improved it.)","ko":"그는 단지 그것을 improved했을 뿐이다.","opts":["망가뜨렸다","팔았다","개선했다","없앴다"],"word":"improved","r":{"a":"3) 개선했다","ev":"2번 문장","s":[[2,"He only improved it.","그는 단지 그것을 개선했을 뿐이다."]],"w":"1번에서 스톤이 발명한 것은 아니라고 했으니, 이미 있던 빨대를 더 좋게 만든 거예요. improve = 개선하다예요.","c":3},"h":"93799c2ead"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Babylonian royalty also drank beer this way, although they used straws made of gold!)","ko":"바빌로니아 royalty도 이런 방법으로 맥주를 마시긴 했지만, 그들은 금으로 만든 빨대를 사용했다!","opts":["상인","왕족","농부","역사가"],"word":"royalty","r":{"a":"2) 왕족","ev":"5번 문장","s":[[5,"Babylonian royalty also drank beer this way, although they used straws made of gold!","바빌로니아 왕족도 이런 방법으로 맥주를 마시긴 했지만, 그들은 금으로 만든 빨대를 사용했다!"]],"w":"금으로 만든 빨대를 쓸 만큼 신분이 높은 사람들이에요. royalty = 왕족이에요.","c":2},"h":"26b157805c"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nHe wrapped pieces of paper around a pencil and then glued them together.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그는 연필 둘레에 종잇조각들을 싼 다음 그것들을 한데 붙였다.","opts":["종잇조각들","연필","왁스","맥주"],"r":{"a":"1) 종잇조각들","ev":"8번 문장","s":[[8,"He wrapped pieces of paper around a pencil and then glued them together.","그는 연필 둘레에 종잇조각들을 싼 다음 그것들을 한데 붙였다."]],"w":"연필에 싸서 한데 붙이는 대상은 종잇조각들이에요. 연필은 종이를 감는 기준이고 붙이는 것은 pieces of paper예요.","c":1},"h":"cb727b6c2f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They did so to avoid drinking material floating in the beer.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 맥주에 떠다니는 물질을 마시는 것을 피하기 위해 그렇게 했다.","opts":["그들은 맥주를 더 맛있게 마시려고 빨대를 버렸다.","그들은 맥주에 물질을 띄우려고 그렇게 했다.","그들은 맥주를 나누어 마시려고 그렇게 했다.","그들은 맥주에 떠 있는 물질을 마시지 않으려고 빨대를 사용했다."],"r":{"a":"4) 그들은 맥주에 떠 있는 물질을 마시지 않으려고 빨대를 사용했다.","ev":"3~4번 문장","s":[[3,"According to historians, ancient Egyptians used straws to drink beer.","역사가들에 따르면, 고대 이집트인들은 맥주를 마시기 위해 빨대를 사용했다."],[4,"They did so to avoid drinking material floating in the beer.","그들은 맥주에 떠다니는 물질을 마시는 것을 피하기 위해 그렇게 했다."]],"w":"4번의 did so는 3번의 빨대 사용이고, to avoid drinking은 마시는 것을 피하기 위해라는 목적이에요. floating in the beer는 맥주에 떠 있는 물질을 꾸며 줘요.","c":4},"h":"2edf3dedd6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이집트인들은 맥주를 빨대 없이 마셨다.","Marvin Stone이 세상에서 처음 빨대를 사용했다.","수메르인들은 때때로 빨대로 음료를 나누어 마셨다.","수메르인들은 금으로 만든 빨대를 사용했다."],"opts":["Egyptians drank beer without using straws.","Marvin Stone was the first person to use a straw.","Sumerians sometimes shared drinks by using straws.","Sumerians used straws made of gold."],"r":{"a":"3) Sumerians sometimes shared drinks by using straws.","ev":"6번 문장","s":[[6,"And according to a 6,000-year-old text, ancient Sumerians sometimes shared drinks by using straws made of reed.","그리고 6천 년 된 문서에 따르면, 고대 수메르인들은 때때로 갈대로 만든 빨대를 사용해서 음료를 나누어 마셨다."]],"w":"6번에서 수메르인들은 갈대 빨대로 음료를 나누어 마셨다고 해요. 이집트인들은 빨대를 썼고(3번), 스톤은 개선했을 뿐이며(2번), 금 빨대는 바빌로니아 왕족이 썼어요(5번).","c":3},"h":"4cb6263d56"},{"n":9,"t":"sum","q":"Straws were used long before Marvin Stone. Ancient (A) used them to drink beer, and Stone invented the first (B) straw in 1888.","ko":"빨대는 Marvin Stone보다 훨씬 전부터 쓰였다. 고대 (A)은 맥주를 마시려고 빨대를 썼고, Stone은 1888년에 최초의 (B) 빨대를 발명했다.","oko":["(A) 이집트인 / (B) 금","(A) 로마인 / (B) 종이","(A) 로마인 / (B) 플라스틱","(A) 이집트인 / (B) 플라스틱","(A) 이집트인 / (B) 종이"],"opts":["(A) Egyptians / (B) gold","(A) Romans / (B) paper","(A) Romans / (B) plastic","(A) Egyptians / (B) plastic","(A) Egyptians / (B) paper"],"r":{"a":"5) (A) Egyptians / (B) paper","ev":"1번, 3번, 7번 문장","s":[[1,"It is often said that Marvin Stone invented the drinking straw, but that’s not true.","흔히 Marvin Stone(마빈 스톤)이 빨대를 발명했다고 하지만, 이는 사실이 아니다."],[3,"According to historians, ancient Egyptians used straws to drink beer.","역사가들에 따르면, 고대 이집트인들은 맥주를 마시기 위해 빨대를 사용했다."],[7,"Much later, in 1888, Marvin Stone invented the first paper straw.","훨씬 뒤, 1888년에 Marvin Stone은 최초의 종이 빨대를 발명했다."]],"w":"1번에서 스톤이 처음 발명한 게 아니라고 하고, 3번에서 고대 이집트인이 빨대로 맥주를 마셨으며, 7번에서 스톤이 최초의 종이 빨대를 발명했어요.","c":5},"h":"7c6ee57695"},{"n":10,"t":"fill","q":"Stone [A] paper around a pencil, and later covered it in [B] so it wouldn’t get wet.","ko":"Stone은 연필 둘레에 종이를 [A], 나중에 종이가 젖지 않도록 [B]를 발랐다.","bank":["wrapped","wax","gold","reed","improved","floating"],"bko":{"wrapped":"쌌다","wax":"왁스","gold":"금","reed":"갈대","improved":"개선했다","floating":"떠다니는"},"r":{"a":"[A] wrapped, [B] wax","ev":"8~9번 문장","s":[[8,"He wrapped pieces of paper around a pencil and then glued them together.","그는 연필 둘레에 종잇조각들을 싼 다음 그것들을 한데 붙였다."],[9,"He later improved his design by covering the paper in wax so it wouldn’t get wet.","이후에 그는 종이가 젖지 않게끔 왁스를 발라서 디자인을 개선했다."]],"w":"8번 He wrapped pieces of paper around a pencil과 9번 covering the paper in wax에서 가져왔어요. gold와 reed는 다른 사람들이 쓴 빨대 재료예요.","c":null},"h":"61b5ad2bbf"}]},{"u":6,"id":"nl2-06-2","no":2,"ko":"즐거운 음식이 있는 장례식","items":[{"n":1,"t":"tf","q":"African Americans in New Orleans often celebrate at funerals.","ko":"뉴올리언스의 아프리카계 미국인들은 장례식에서 종종 축하 행사를 갖는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"This might seem strange, but African Americans in New Orleans often celebrate at funerals.","이것은 이상하게 보일지 모르지만, 뉴올리언스의 아프리카계 미국인들은 장례식에서 종종 축하 행사를 갖는다."]],"w":"2번 문장 그대로예요. 이상하게 보일 수 있지만 장례식에서 종종 축하해요.","c":"T"},"h":"dec3ab26ef"},{"n":2,"t":"tf","q":"The Africans who were brought to New Orleans had easy lives.","ko":"뉴올리언스로 건너온 아프리카인들은 편한 삶을 살았다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"When Africans were brought to New Orleans hundreds of years ago, they worked as slaves and had hard lives.","아프리카인들이 수백 년 전에 뉴올리언스로 건너오게 되었을 때, 그들은 노예로 일했으며 고된 삶을 살았다."]],"w":"4번에서 그들은 노예로 일했고 힘든 삶(hard lives)을 살았다고 해요. 편한 삶이 아니에요.","c":"F"},"h":"c34df484ca"},{"n":3,"t":"tf","q":"They believed that their souls would stay in New Orleans forever after death.","ko":"그들은 죽은 뒤 영혼이 뉴올리언스에 영원히 머무를 것이라고 믿었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"They believed that when they died, their souls would fly back to their homeland.","그들은 죽으면 영혼이 날아서 그들의 고국으로 돌아갈 것이라고 믿었다."]],"w":"6번에서 영혼이 날아서 그들의 고국(homeland)으로 돌아갈 것이라고 믿었어요. 뉴올리언스에 머문다는 말은 반대예요.","c":"F"},"h":"0afb5450db"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In their free time, they used music to express their feelings.)","ko":"여가 시간에 그들은 자신의 감정을 express하기 위해 음악을 이용했다.","opts":["숨기다","표현하다","팔다","배우다"],"word":"express","r":{"a":"2) 표현하다","ev":"5번 문장","s":[[5,"In their free time, they used music to express their feelings.","여가 시간에 그들은 자신의 감정을 표현하기 위해 음악을 이용했다."]],"w":"힘든 삶 속에서 음악으로 자신의 감정을 밖으로 드러냈다는 뜻이에요. express = 표현하다예요.","c":2},"h":"cca9bc42d2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In other words, death would free them from their hard lives.)","ko":"다시 말해서, 죽음은 그들의 힘든 삶으로부터 그들을 free해 주는 것이다.","opts":["무료로 주다","가두다","바쁘게 하다","자유롭게 해 주다"],"word":"free","r":{"a":"4) 자유롭게 해 주다","ev":"7번 문장","s":[[7,"In other words, death would free them from their hard lives.","다시 말해서, 죽음은 그들의 힘든 삶으로부터 그들을 자유롭게 해 주는 것이다."]],"w":"from their hard lives, 즉 힘든 삶에서 벗어난다는 뜻이에요. 그래서 free = 자유롭게 해 주다예요.","c":4},"h":"2fce8069b0"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey believed that when they died, their souls would fly back to their homeland.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 죽으면 영혼이 날아서 그들의 고국으로 돌아갈 것이라고 믿었다.","opts":["재즈 밴드","영혼","노예로 일한 아프리카인들","뉴올리언스의 관광객"],"r":{"a":"3) 노예로 일한 아프리카인들","ev":"4~6번 문장","s":[[4,"When Africans were brought to New Orleans hundreds of years ago, they worked as slaves and had hard lives.","아프리카인들이 수백 년 전에 뉴올리언스로 건너오게 되었을 때, 그들은 노예로 일했으며 고된 삶을 살았다."],[5,"In their free time, they used music to express their feelings.","여가 시간에 그들은 자신의 감정을 표현하기 위해 음악을 이용했다."],[6,"They believed that when they died, their souls would fly back to their homeland.","그들은 죽으면 영혼이 날아서 그들의 고국으로 돌아갈 것이라고 믿었다."]],"w":"4번에서 노예로 일하며 힘든 삶을 산 Africans가 나오고, 5번 they와 6번 They로 이어져요. 믿은 사람은 그 아프리카인들이에요.","c":3},"h":"9886ba3690"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In other words, death would free them from their hard lives.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다시 말해서, 죽음은 그들의 힘든 삶으로부터 그들을 자유롭게 해 주는 것이다.","opts":["죽음은 그들을 힘든 삶에서 벗어나게 해 줄 것이다.","죽음은 그들의 삶을 더 힘들게 만들 것이다.","죽음은 그들에게 새 노예 생활을 줄 것이다.","죽음은 그들을 뉴올리언스에 묶어 둘 것이다."],"r":{"a":"1) 죽음은 그들을 힘든 삶에서 벗어나게 해 줄 것이다.","ev":"7번 문장","s":[[7,"In other words, death would free them from their hard lives.","다시 말해서, 죽음은 그들의 힘든 삶으로부터 그들을 자유롭게 해 주는 것이다."]],"w":"free A from B는 A를 B에서 벗어나게 해 준다는 뜻이에요. 그래서 죽음이 힘든 삶에서 풀어 준다는 말이에요.","c":1},"h":"e6b39085e9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["뉴올리언스에는 지금도 노예 제도가 있다.","행진하는 재즈 밴드는 장례식에서 슬픈 음악을 연주한다.","아프리카인들은 음악으로 감정을 표현한 적이 없다.","노예 제도는 사라졌지만 사람들은 여전히 장례식에서 음악을 즐긴다."],"opts":["Slavery still exists in New Orleans today.","Marching jazz bands play sad music at funerals.","Africans never used music to express their feelings.","Though slavery has disappeared, people still enjoy music at funerals."],"r":{"a":"4) Though slavery has disappeared, people still enjoy music at funerals.","ev":"9번 문장","s":[[9,"Though slavery has disappeared from New Orleans, people still enjoy music at funerals, just like in the past.","뉴올리언스에서 노예 제도는 사라졌지만, 사람들은 여전히 예전처럼 장례식에서 음악을 즐긴다."]],"w":"9번 문장 그대로예요. 노예 제도는 사라졌고, 장례식에서 즐거운 음악을 연주하며(1번), 아프리카인들은 음악으로 감정을 표현했어요(5번).","c":4},"h":"5189644f56"},{"n":9,"t":"sum","q":"Africans in New Orleans lived hard lives as (A), and they believed that death would (B) them.","ko":"뉴올리언스의 아프리카인들은 (A)로서 힘든 삶을 살았고, 죽음이 자신들을 (B)할 것이라고 믿었다.","oko":["(A) 노예 / (B) 벌주다","(A) 병사 / (B) 자유롭게 하다","(A) 노예 / (B) 자유롭게 하다","(A) 병사 / (B) 벌주다","(A) 노예 / (B) 잃다"],"opts":["(A) slaves / (B) punish","(A) soldiers / (B) free","(A) slaves / (B) free","(A) soldiers / (B) punish","(A) slaves / (B) lose"],"r":{"a":"3) (A) slaves / (B) free","ev":"4번, 6~7번 문장","s":[[4,"When Africans were brought to New Orleans hundreds of years ago, they worked as slaves and had hard lives.","아프리카인들이 수백 년 전에 뉴올리언스로 건너오게 되었을 때, 그들은 노예로 일했으며 고된 삶을 살았다."],[6,"They believed that when they died, their souls would fly back to their homeland.","그들은 죽으면 영혼이 날아서 그들의 고국으로 돌아갈 것이라고 믿었다."],[7,"In other words, death would free them from their hard lives.","다시 말해서, 죽음은 그들의 힘든 삶으로부터 그들을 자유롭게 해 주는 것이다."]],"w":"4번에서 노예로 힘든 삶을 살았고, 7번에서 죽음은 그들을 힘든 삶에서 자유롭게 해 줄 것(free)이라고 해요.","c":3},"h":"6fcbae5a6b"},{"n":10,"t":"fill","q":"In their free time, they used [A] to express their [B].","ko":"여가 시간에 그들은 자신의 [B]을 표현하기 위해 [A]을 이용했다.","bank":["music","feelings","homeland","funerals","death","slaves"],"bko":{"music":"음악","feelings":"감정","homeland":"고국","funerals":"장례식","slaves":"노예","death":"죽음"},"r":{"a":"[A] music, [B] feelings","ev":"5번 문장","s":[[5,"In their free time, they used music to express their feelings.","여가 시간에 그들은 자신의 감정을 표현하기 위해 음악을 이용했다."]],"w":"5번 문장 In their free time, they used music to express their feelings에서 가져왔어요. 고국(homeland)이나 장례식(funerals)은 표현하는 대상이 아니에요.","c":null},"h":"f10313d2ad"}]},{"u":6,"id":"nl2-06-3","no":3,"ko":"감자는 악마의 열매?","items":[{"n":1,"t":"tf","q":"Europeans in the 16th century loved potatoes.","ko":"16세기 유럽인들은 감자를 아주 좋아했다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"But in the 16th century, Europeans did not like them.","하지만 16세기에 유럽인들은 그것을 좋아하지 않았다."]],"w":"2번에서 16세기에 유럽인들은 감자를 좋아하지 않았다고 해요.","c":"F"},"h":"97246d550b"},{"n":2,"t":"tf","q":"Some people ate raw potatoes because they did not know how to cook them.","ko":"어떤 사람들은 감자를 요리하는 방법을 몰라서 생감자를 먹었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In addition, people ate raw potatoes because they did not know how to cook them.","게다가 사람들은 감자를 요리하는 방법을 몰라서 생감자를 먹었다."]],"w":"5번 문장 그대로예요. 요리하는 방법(how to cook)을 몰라서 생감자를 먹었어요.","c":"T"},"h":"958ce77f1c"},{"n":3,"t":"tf","q":"The soldiers sold potatoes in markets.","ko":"병사들이 시장에서 감자를 팔았다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"So people started growing potatoes themselves and even sold them in markets.","그래서 사람들은 직접 감자를 재배하기 시작했고, 심지어 그것을 시장에서 팔았다."]],"w":"11번에서 시장에서 감자를 판 사람들은 직접 감자를 재배하기 시작한 사람들이에요. 병사들은 정원의 감자를 지키는 일(9번)을 했어요.","c":"F"},"h":"8a7259e82d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This made people think the potatoes were precious.)","ko":"이는 사람들이 감자가 precious하다고 생각하게 만들었다.","opts":["귀중한","위험한","흔한","맛없는"],"word":"precious","r":{"a":"1) 귀중한","ev":"9~10번 문장","s":[[9,"Then he ordered the soldiers to watch over them.","그러고 나서 그는 병사들에게 그것들을 지켜보라고 명령했다."],[10,"This made people think the potatoes were precious.","이는 사람들이 감자가 귀중하다고 생각하게 만들었다."]],"w":"왕이 병사들에게 감자를 지키게 하자(9번), 사람들은 감자가 소중한 물건이라고 생각했어요. precious = 귀중한이에요.","c":1},"h":"fe6efa7f22"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Potatoes are one of the world’s major sources of food.)","ko":"감자는 세계의 major 식량원들 중 하나이다.","opts":["작은","주요한","비싼","오래된"],"word":"major","r":{"a":"2) 주요한","ev":"1번 문장","s":[[1,"Potatoes are one of the world’s major sources of food.","감자는 세계 주요 식량원들 중 하나이다."]],"w":"세계에서 중요한 식량원 중 하나라는 말이에요. 그래서 2번에서 But(하지만) 예전엔 싫어했다고 반전이 와요. major = 주요한이에요.","c":2},"h":"658d0abb35"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThen he ordered the soldiers to watch over them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그러고 나서 그는 병사들에게 그것들을 지켜보라고 명령했다.","opts":["백성들","병사들","감자들","유럽인들"],"r":{"a":"3) 감자들","ev":"8~9번 문장","s":[[8,"So the king told his soldiers to plant potatoes in his garden.","그래서 왕은 병사들에게 자신의 정원에 감자를 심으라고 시켰다."],[9,"Then he ordered the soldiers to watch over them.","그러고 나서 그는 병사들에게 그것들을 지켜보라고 명령했다."]],"w":"8번에서 병사들에게 자신의 정원에 감자를 심으라고 했고, 9번에서 그 감자들을 지켜보라고 명령했어요. 지키는 대상은 감자예요.","c":3},"h":"087e48ef75"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s how Friedrich II got his nickname, the Potato King.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그렇게 Friedrich 2세는 ‘감자 왕’이라는 별명을 얻게 되었다.","opts":["Friedrich 2세는 감자를 팔아 왕이 되었다.","Friedrich 2세는 감자 왕이라는 별명을 싫어했다.","Friedrich 2세는 감자를 금지해서 별명이 생겼다.","이렇게 해서 Friedrich 2세는 감자 왕이라는 별명을 얻었다."],"r":{"a":"4) 이렇게 해서 Friedrich 2세는 감자 왕이라는 별명을 얻었다.","ev":"13번 문장","s":[[13,"That’s how Friedrich II got his nickname, the Potato King.","그렇게 Friedrich 2세는 ‘감자 왕’이라는 별명을 얻게 되었다."]],"w":"That’s how는 이런 과정을 거쳐 ~하게 되었다는 뜻이에요. 앞(8~12번)에서 감자를 퍼뜨린 과정 때문에 감자 왕이라는 별명이 생겼어요.","c":4},"h":"4691c1a157"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["유럽인들은 처음부터 감자를 아주 좋아했다.","감자는 유럽 전역에서 인기를 얻었다.","사람들은 감자를 시장에서 팔지 않았다.","Friedrich 2세의 별명은 악마의 왕이었다."],"opts":["Europeans loved potatoes from the very beginning.","Potatoes became popular across Europe.","People never sold potatoes in markets.","Friedrich II’s nickname was the Devil King."],"r":{"a":"2) Potatoes became popular across Europe.","ev":"12번 문장","s":[[12,"Soon, potatoes became popular across Europe.","곧, 감자는 유럽 전역에서 인기를 얻었다."]],"w":"12번에서 감자는 유럽 전역에서 인기를 얻었다고 해요. 처음엔 싫어했고(2번), 사람들은 시장에서 팔기도 했으며(11번), 별명은 감자 왕이에요(13번).","c":2},"h":"9943a715d9"},{"n":9,"t":"sum","q":"In the 16th century, some Europeans did not like potatoes because they grew (A) and had (B) flowers.","ko":"16세기에 일부 유럽인들은 감자가 (A) 자라고 (B) 꽃을 가졌기 때문에 감자를 좋아하지 않았다.","oko":["(A) 땅속에서 / (B) 아름다운","(A) 땅 위에서 / (B) 독이 있는","(A) 물속에서 / (B) 아름다운","(A) 땅 위에서 / (B) 빨간","(A) 땅속에서 / (B) 독이 있는"],"opts":["(A) underground / (B) beautiful","(A) above ground / (B) poisonous","(A) in water / (B) beautiful","(A) above ground / (B) red","(A) underground / (B) poisonous"],"r":{"a":"5) (A) underground / (B) poisonous","ev":"3~4번 문장","s":[[3,"Some Europeans called the potato the devil’s plant because it grows underground.","일부 유럽인들은 감자가 땅속에서 자라기 때문에 그것을 악마의 식물이라고 불렀다."],[4,"Other people were scared of the plant’s poisonous flowers.","다른 사람들은 그 식물의 독이 있는 꽃을 무서워했다."]],"w":"3번에서 감자가 땅속에서(underground) 자라서 악마의 식물이라고 불렀고, 4번에서 독이 있는(poisonous) 꽃을 무서워했어요.","c":5},"h":"7242fe969a"},{"n":10,"t":"fill","q":"The king’s plan made people think potatoes were [A], so they started [B] them themselves.","ko":"왕의 계획은 사람들이 감자가 [A]하다고 생각하게 했고, 그래서 사람들은 직접 감자를 [B] 시작했다.","bank":["precious","growing","poisonous","raw","hungry","scared"],"bko":{"precious":"귀중한","growing":"재배하는 것","poisonous":"독이 있는","raw":"날것의","hungry":"굶주린","scared":"무서워하는"},"r":{"a":"[A] precious, [B] growing","ev":"10~11번 문장","s":[[10,"This made people think the potatoes were precious.","이는 사람들이 감자가 귀중하다고 생각하게 만들었다."],[11,"So people started growing potatoes themselves and even sold them in markets.","그래서 사람들은 직접 감자를 재배하기 시작했고, 심지어 그것을 시장에서 팔았다."]],"w":"10번 potatoes were precious(감자가 귀중하다)와 11번 started growing potatoes themselves(직접 재배하기 시작했다)에서 가져왔어요. poisonous는 사람들이 감자를 싫어한 이유(4번)예요.","c":null},"h":"10db562dd1"}]},{"u":6,"id":"nl2-06-4","no":4,"ko":"바오밥 나무 이야기","items":[{"n":1,"t":"tf","q":"The baobab tree has leaves from the day it is born.","ko":"바오밥 나무는 태어난 날부터 잎을 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"It doesn’t have leaves until it is nine years old.","그 나무는 9살이 되어서야 비로소 잎사귀를 갖게 된다."]],"w":"2번에서 바오밥 나무는 9살이 되어서야 비로소 잎이 생긴다고 해요.","c":"F"},"h":"2d388745b3"},{"n":2,"t":"tf","q":"One legend says God created the baobab as the strongest tree in the world.","ko":"한 전설에 따르면 신은 바오밥 나무를 세상에서 가장 강한 나무로 창조했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"One legend says God created the baobab as the strongest tree in the world.","한 전설에 따르면 신은 바오밥 나무를 세상에서 가장 강한 나무로 창조했다."]],"w":"6번 문장 그대로예요. 첫 번째 전설에서 신은 가장 강한 나무로 바오밥을 창조했어요.","c":"T"},"h":"bb36154609"},{"n":3,"t":"tf","q":"In the second legend, the baobab was the last tree created in the world.","ko":"두 번째 전설에서 바오밥 나무는 세상에서 마지막으로 창조된 나무였다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"Another legend says the baobab was the first tree in the world.","또 다른 전설에 따르면 바오밥 나무는 이 세상 최초의 나무였다."],[11,"After the baobab was created, the palm tree, the flame tree, and the fig tree were created.","바오밥 나무가 창조된 이후 종려나무, 불꽃나무 그리고 무화과나무가 창조되었다."]],"w":"두 번째 전설에서 바오밥 나무는 세상 최초의 나무(the first tree)였고, 그다음에 다른 나무들이 창조되었어요.","c":"F"},"h":"718d7f0d28"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (God became angry, pulled it up, and then replanted it upside down to punish it.)","ko":"신은 화가 나서 바오밥 나무를 뽑아낸 다음, 그것을 punish하기 위해 다시 거꾸로 심어 버렸다.","opts":["도와주다","칭찬하다","부러워하다","벌주다"],"word":"punish","r":{"a":"4) 벌주다","ev":"14번 문장","s":[[14,"God became angry, pulled it up, and then replanted it upside down to punish it.","신은 화가 나서 바오밥 나무를 뽑아낸 다음, 그것을 벌주기 위해 다시 거꾸로 심어버렸다."]],"w":"신은 화가 났고, 그래서 바오밥 나무를 뽑아 거꾸로 심었어요. 이것은 상을 주는 게 아니라 잘못에 대한 벌이라서 punish = 벌주다예요.","c":4},"h":"669327d077"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So the baobab tree is known by the nickname “upside-down tree.”)","ko":"그래서 바오밥 나무는 ‘거꾸로 뒤집힌 나무’라는 nickname으로 알려져 있다.","opts":["나이","주소","별명","직업"],"word":"nickname","r":{"a":"3) 별명","ev":"4번 문장","s":[[4,"So the baobab tree is known by the nickname “upside-down tree.”","그래서 바오밥 나무는 ‘거꾸로 뒤집힌 나무’라는 별명으로 알려져 있다."]],"w":"‘거꾸로 뒤집힌 나무’는 진짜 이름이 아니라 사람들이 부르는 이름이에요. 그래서 nickname = 별명이에요.","c":3},"h":"d370521f8a"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThe other trees each had something the baobab didn’t have, so the baobab tree envied them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"다른 나무들은 각각 바오밥 나무에는 없는 것을 갖고 있었고, 그래서 바오밥 나무는 그 나무들을 부러워했다.","opts":["신","바오밥 나무","다른 나무들","전설들"],"r":{"a":"3) 다른 나무들","ev":"11~12번 문장","s":[[11,"After the baobab was created, the palm tree, the flame tree, and the fig tree were created.","바오밥 나무가 창조된 이후 종려나무, 불꽃나무 그리고 무화과나무가 창조되었다."],[12,"The other trees each had something the baobab didn’t have, so the baobab tree envied them.","다른 나무들은 각각 바오밥 나무에는 없는 것을 갖고 있었고, 그래서 바오밥 나무는 그 나무들을 부러워했다."]],"w":"11번에서 바오밥 다음에 창조된 종려나무, 불꽃나무, 무화과나무가 12번의 The other trees예요. 바오밥이 부러워한 대상이 them이에요.","c":3},"h":"cc8821098c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It doesn’t have leaves until it is nine years old.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 나무는 9살이 되어서야 비로소 잎사귀를 갖게 된다.","opts":["바오밥 나무는 9살이 되면 잎이 모두 떨어진다.","바오밥 나무는 태어나자마자 잎이 난다.","바오밥 나무는 9살이 되어서야 잎이 생긴다.","바오밥 나무는 9살에 잎이 가장 많다."],"r":{"a":"3) 바오밥 나무는 9살이 되어서야 잎이 생긴다.","ev":"2번 문장","s":[[2,"It doesn’t have leaves until it is nine years old.","그 나무는 9살이 되어서야 비로소 잎사귀를 갖게 된다."]],"w":"not ~ until …은 …가 되어서야 비로소 ~하다예요. 그래서 9살 전에는 잎이 없고, 9살부터 잎이 생겨요.","c":3},"h":"7716d1bd69"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["바오밥 나무는 유럽에서만 발견된다.","신은 바오밥 나무를 세상에서 가장 약한 나무로 창조했다.","바오밥 나무는 신에게 무화과나무의 열매만 달라고 청했다.","바오밥 나무는 아프리카와 호주에서 발견된다."],"opts":["The baobab tree is found only in Europe.","God created the baobab as the weakest tree in the world.","The baobab asked God to give it only the fig tree’s fruit.","The baobab tree is found in Africa and Australia."],"r":{"a":"4) The baobab tree is found in Africa and Australia.","ev":"1번 문장","s":[[1,"The baobab tree is a strange-looking tree found in Africa and Australia.","바오밥 나무는 아프리카와 호주에서 발견되는 이상하게 생긴 나무이다."]],"w":"1번에서 바오밥 나무는 아프리카와 호주에서 발견된다고 해요. 가장 강한 나무로 창조되었고(6번), 세 나무의 것을 모두 달라고 청했어요(13번).","c":4},"h":"b2d65b2102"},{"n":9,"t":"sum","q":"In the first legend, the baobab was very (A) because it was the strongest tree, so it showed off, and this made God (B).","ko":"첫 번째 전설에서 바오밥 나무는 가장 강한 나무여서 매우 (A)했고, 그래서 뽐냈으며, 이는 신을 (B)하게 만들었다.","oko":["(A) 수줍은 / (B) 기쁜","(A) 거만한 / (B) 행복한","(A) 두려운 / (B) 화가 난","(A) 두려운 / (B) 기쁜","(A) 거만한 / (B) 화가 난"],"opts":["(A) shy / (B) pleased","(A) proud / (B) happy","(A) afraid / (B) upset","(A) afraid / (B) pleased","(A) proud / (B) upset"],"r":{"a":"5) (A) proud / (B) upset","ev":"6~7번, 9번 문장","s":[[6,"One legend says God created the baobab as the strongest tree in the world.","한 전설에 따르면 신은 바오밥 나무를 세상에서 가장 강한 나무로 창조했다."],[7,"Because the baobab knew that, it was very proud.","바오밥 나무는 그 사실을 알고 있었기 때문에 매우 거만했다."],[9,"This made God upset, so God took the baobab out of the ground and planted it upside down.","이는 신을 화나게 했고, 신은 바오밥 나무를 땅에서 뽑아내어 거꾸로 심어 버렸다."]],"w":"7번에서 가장 강한 나무라는 걸 알고 매우 거만했고(proud), 9번에서 이것이 신을 화나게(upset) 했어요.","c":5},"h":"651fa1d309"},{"n":10,"t":"fill","q":"In the second legend, the baobab [A] the other trees and asked God for all they had, so God [B] it upside down.","ko":"두 번째 전설에서 바오밥 나무는 다른 나무들을 [A] 그 나무들이 가진 모든 것을 신에게 청했고, 그래서 신은 그것을 거꾸로 [B].","bank":["envied","replanted","created","wanted","forgot","showed"],"bko":{"envied":"부러워했다","replanted":"다시 심었다","created":"창조했다","showed":"보여 주었다","wanted":"원했다","forgot":"잊었다"},"r":{"a":"[A] envied, [B] replanted","ev":"12~14번 문장","s":[[12,"The other trees each had something the baobab didn’t have, so the baobab tree envied them.","다른 나무들은 각각 바오밥 나무에는 없는 것을 갖고 있었고, 그래서 바오밥 나무는 그 나무들을 부러워했다."],[13,"The baobab wanted to have the palm tree’s height, the flame tree’s beautiful flowers, and the fig tree’s fruit, so it asked God to have all of them.","바오밥 나무는 종려나무의 키와, 불꽃나무의 아름다운 꽃과, 무화과나무의 열매를 갖길 원했고, 그래서 신에게 그 모든 것을 갖게 해 달라고 청했다."],[14,"God became angry, pulled it up, and then replanted it upside down to punish it.","신은 화가 나서 바오밥 나무를 뽑아낸 다음, 그것을 벌주기 위해 다시 거꾸로 심어버렸다."]],"w":"12번 the baobab tree envied them(그 나무들을 부러워했다)과 14번 replanted it upside down(거꾸로 다시 심었다)에서 가져왔어요.","c":null},"h":"586c099db2"}]},{"u":7,"id":"nl2-07-1","no":1,"ko":"어, 너 신발 끈 풀렸어!","items":[{"n":1,"t":"tf","q":"The shoelaces were still tightly tied one hour later.","ko":"한 시간 후에도 신발 끈은 여전히 꽉 묶여 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"One hour later, however, they are untied.","그러나 한 시간 후에 신발 끈은 풀려 있다."]],"w":"3번 문장에서 한 시간 후에는 신발 끈이 풀려 있다(they are untied)고 해요. 아직 꽉 묶여 있다는 말은 반대예요.","c":"F"},"h":"f4d0e5d316"},{"n":2,"t":"tf","q":"Researchers used a high-speed camera to film the shoelaces.","ko":"연구자들은 신발 끈을 촬영하기 위해 고속 카메라를 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Researchers used a high-speed camera to film the shoelaces of a person running on a treadmill.","연구자들은 러닝머신에서 달리고 있는 사람의 신발 끈을 촬영하기 위해 고속 카메라를 사용했다."]],"w":"6번 문장에 used a high-speed camera to film the shoelaces of a person가 그대로 나와요. 러닝머신에서 달리는 사람의 신발 끈을 촬영했어요.","c":"T"},"h":"6ef48aa354"},{"n":3,"t":"tf","q":"The researchers say there are three reasons why shoelaces come untied.","ko":"연구자들은 신발 끈이 풀리는 데 세 가지 이유가 있다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"According to the researchers, there are two reasons for this.","연구자들에 따르면, 이에 대한 두 가지 이유가 있다."]],"w":"9번 문장에서 이유는 두 가지(two reasons)라고 해요. 세 가지가 아니에요.","c":"F"},"h":"b87940ef51"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It was a mystery until recently.)","ko":"그것은 최근까지 미스터리였다.","opts":["최근의 소식","수수께끼처럼 알 수 없는 일","재미있는 놀이","오래된 약속"],"word":"mystery","r":{"a":"2) 수수께끼처럼 알 수 없는 일","ev":"4~5번 문장","s":[[4,"Why does this happen?","왜 이런 일이 일어날까?"],[5,"It was a mystery until recently.","그것은 최근까지 미스터리였다."]],"w":"4번에서 신발 끈이 왜 풀리는지 물었고, 5번에서 최근까지는 그 이유를 몰랐다고 해요. 그러니 mystery는 아직 풀리지 않은 수수께끼예요.","c":2},"h":"c296bd0609"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This impact causes the knots in the shoelaces to stretch and loosen.)","ko":"이 충격은 신발 끈의 매듭이 늘어나서 느슨해지게 한다.","opts":["더 팽팽해지다","끊어지다","더 단단히 뭉치다","느슨해지다"],"word":"loosen","r":{"a":"4) 느슨해지다","ev":"11번 문장","s":[[11,"This impact causes the knots in the shoelaces to stretch and loosen.","이 충격은 신발 끈의 매듭이 늘어나서 느슨해지게 한다."]],"w":"신발 끈이 풀리는 이유를 설명하는 문장이에요. 매듭이 stretch(늘어나다)하고 loosen(느슨해지다)해야 끈이 풀려요.","c":4},"h":"35d8fcd1dd"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAs they shake, they pull on the knot, slowly untying it.","ko":"밑줄 친 it가 가리키는 것은?","sko":"그것들이 흔들리면서, 매듭을 잡아당겨 천천히 그것을 풀리게 한다.","opts":["매듭(the knot)","신발 끈 끝부분","달리는 사람","러닝머신"],"r":{"a":"1) 매듭(the knot)","ev":"13번 문장","s":[[13,"As they shake, they pull on the knot, slowly untying it.","그것들이 흔들리면서, 매듭을 잡아당겨 천천히 그것을 풀리게 한다."]],"w":"흔들리는 것은 끈 끝부분(they)이고, 끝부분이 당기는 대상이 the knot이에요. 천천히 풀리는 것(it)도 그 매듭이에요.","c":1},"h":"9013c56122"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This impact causes the knots in the shoelaces to stretch and loosen.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 충격은 신발 끈의 매듭이 늘어나서 느슨해지게 한다.","opts":["신발 끈이 매듭을 더 단단히 조이게 한다.","매듭이 충격을 막아 신발 끈을 지켜 준다.","충격 때문에 신발 끈의 매듭이 늘어나 느슨해진다.","충격 때문에 신발 끈이 끊어진다."],"r":{"a":"3) 충격 때문에 신발 끈의 매듭이 늘어나 느슨해진다.","ev":"11번 문장","s":[[11,"This impact causes the knots in the shoelaces to stretch and loosen.","이 충격은 신발 끈의 매듭이 늘어나서 느슨해지게 한다."]],"w":"cause A to-v는 'A가 …하게 하다'예요. 충격이 매듭을 늘어나고 느슨해지게 해요. 조여 주거나 끊어진다는 말은 없어요.","c":3},"h":"3e50e422c1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["신발 끈은 묶은 지 얼마 안 돼서 바로 풀렸다.","연구자들은 신발 끈이 풀리는 이유를 하나도 찾지 못했다.","발이 땅에 부딪히는 힘은 매듭을 더 단단하게 만든다.","신발 끈 끝부분이 흔들리면서 매듭을 잡아당겨 천천히 푼다."],"opts":["The shoelaces came untied right after they were tied.","The researchers could not find any reason for the untied shoelaces.","The force of a foot hitting the ground makes the knot tighter.","The shaking ends of the shoelaces pull on the knot and slowly untie it."],"r":{"a":"4) The shaking ends of the shoelaces pull on the knot and slowly untie it.","ev":"7, 8, 9, 11, 12, 13번 문장","s":[[7,"For a long time, the shoelaces stayed tightly tied.","오랜 시간 동안 신발 끈은 꽉 묶인 채로 있었다."],[8,"And then they suddenly untied!","그런 다음 갑자기 신발 끈이 풀렸다!"],[9,"According to the researchers, there are two reasons for this.","연구자들에 따르면, 이에 대한 두 가지 이유가 있다."],[11,"This impact causes the knots in the shoelaces to stretch and loosen.","이 충격은 신발 끈의 매듭이 늘어나서 느슨해지게 한다."],[12,"The second reason is the shaking of the ends of the shoelaces.","두 번째 이유는 신발 끈 끝부분의 흔들림이다."],[13,"As they shake, they pull on the knot, slowly untying it.","그것들이 흔들리면서, 매듭을 잡아당겨 천천히 그것을 풀리게 한다."]],"w":"7번에서 끈은 오랫동안 꽉 묶여 있었어요. 9번에서 연구자들은 이유 두 가지를 말해요. 11번에서 충격은 매듭을 느슨하게 해요. 맞는 것은 12~13번의 끈 끝 흔들림이에요.","c":4},"h":"6a19f5bf5d"},{"n":9,"t":"sum","q":"Shoelaces come untied for two reasons: the (A) of a foot hitting the ground loosens the knots, and the (B) of the ends pulls on the knot.","ko":"신발 끈은 두 가지 이유로 풀린다. 발이 땅에 부딪히는 (A)이 매듭을 느슨하게 하고, 끝부분의 (B)이 매듭을 잡아당긴다.","oko":["(A) 속도 / (B) 흔들림","(A) 힘 / (B) 색깔","(A) 힘 / (B) 흔들림","(A) 무게 / (B) 길이","(A) 열 / (B) 소리"],"opts":["(A) speed / (B) shaking","(A) force / (B) color","(A) force / (B) shaking","(A) weight / (B) length","(A) heat / (B) sound"],"r":{"a":"3) (A) force / (B) shaking","ev":"10~13번 문장","s":[[10,"The first reason is the force of a person’s foot hitting the ground when they walk.","첫 번째 이유는 사람이 걸을 때 발이 땅에 부딪히는 힘이다."],[11,"This impact causes the knots in the shoelaces to stretch and loosen.","이 충격은 신발 끈의 매듭이 늘어나서 느슨해지게 한다."],[12,"The second reason is the shaking of the ends of the shoelaces.","두 번째 이유는 신발 끈 끝부분의 흔들림이다."],[13,"As they shake, they pull on the knot, slowly untying it.","그것들이 흔들리면서, 매듭을 잡아당겨 천천히 그것을 풀리게 한다."]],"w":"10~11번에서 발이 땅에 부딪히는 힘(force)이 매듭을 느슨하게 하고, 12~13번에서 끈 끝의 흔들림(shaking)이 매듭을 당겨요.","c":3},"h":"29e4d30f39"},{"n":10,"t":"fill","q":"The shoelaces stayed [A] tied for a long time, and then they suddenly [B].","ko":"신발 끈은 오랫동안 [A] 묶인 채로 있었고, 그러다가 갑자기 [B].","bank":["tightly","untied","slowly","filmed","knot","tied"],"bko":{"tightly":"꽉","untied":"풀렸다","slowly":"천천히","filmed":"촬영했다","tied":"묶였다","knot":"매듭"},"r":{"a":"[A] tightly, [B] untied","ev":"7~8번 문장","s":[[7,"For a long time, the shoelaces stayed tightly tied.","오랜 시간 동안 신발 끈은 꽉 묶인 채로 있었다."],[8,"And then they suddenly untied!","그런 다음 갑자기 신발 끈이 풀렸다!"]],"w":"7번 stayed tightly tied(꽉 묶인 채로 있었다), 8번 suddenly untied(갑자기 풀렸다)에서 가져왔어요. slowly는 13번에서 매듭이 천천히 풀린다는 말이라 '갑자기'와 어울리지 않아요.","c":null},"h":"6a9b6a62d9"}]},{"u":7,"id":"nl2-07-2","no":2,"ko":"목성의 3인자, Io","items":[{"n":1,"t":"tf","q":"Io orbits farther from Jupiter than the two larger moons.","ko":"Io는 더 큰 두 위성보다 목성에서 더 멀리 떨어져 궤도를 돈다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It orbits the planet closer than the two larger moons.","그것은 두 개의 더 큰 위성보다 더 가까이 목성의 궤도를 돌고 있다."]],"w":"4번 문장에서 Io는 더 큰 두 위성보다 목성에 더 가까이(closer) 돈다고 해요. 더 멀다는 말은 반대예요.","c":"F"},"h":"2747ebd8f0"},{"n":2,"t":"tf","q":"The heat inside Io melts the rock inside it.","ko":"Io 내부의 열은 그 안의 암석을 녹인다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"This creates heat inside Io and melts the rock inside it.","이것은 Io 내부에 열을 만들어 내어 그 안에 있는 암석을 녹인다."]],"w":"6번 문장에 creates heat inside Io and melts the rock inside it이라고 나와요. 열이 생겨 암석을 녹여요.","c":"T"},"h":"0926ea5246"},{"n":3,"t":"tf","q":"Io is Jupiter's second largest moon.","ko":"Io는 목성의 두 번째로 큰 위성이다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"It is called Io, and it’s Jupiter’s third largest moon.","그것은 Io(이오)라고 불리며, 목성의 세 번째로 큰 위성이다."]],"w":"3번 문장에서 Io는 third largest(세 번째로 큰) 위성이라고 해요. 두 번째가 아니에요.","c":"F"},"h":"903457a920"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (one of these moons has lots of volcanoes on its surface)","ko":"이 위성 중 하나는 그 ___에 많은 화산을 가지고 있다.","opts":["속","궤도","표면","그림자"],"word":"surface","r":{"a":"3) 표면","ev":"2번 문장","s":[[2,"Interestingly, one of these moons has lots of volcanoes on its surface!","흥미롭게도, 이 위성 중 하나는 표면에 많은 화산을 가지고 있다!"]],"w":"2번 문장은 화산이 위성의 어디에 많은지 말해요. on its surface는 그 위성의 겉, 즉 표면이에요.","c":3},"h":"16965e582f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (the gravitational forces of Jupiter and the other moons pull on Io in opposite directions)","ko":"목성과 다른 위성의 중력은 Io를 ~ 방향으로 끌어당긴다.","opts":["정반대의","같은 쪽의","위쪽의","가까운"],"word":"opposite","r":{"a":"1) 정반대의","ev":"5번 문장","s":[[5,"As a result, the gravitational forces of Jupiter and the other moons pull on Io in opposite directions.","결과적으로, 목성과 다른 위성의 중력은 Io를 정반대 방향으로 끌어당긴다."]],"w":"목성과 다른 위성들이 서로 반대쪽에서 Io를 당겨요. opposite directions는 정반대 방향이라는 뜻이에요.","c":1},"h":"653158b45d"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis creates heat inside Io and melts the rock inside it.","ko":"밑줄 친 it가 가리키는 것은?","sko":"이것은 Io 내부에 열을 만들어 내어 그 안에 있는 암석을 녹인다.","opts":["목성","화산","암석","Io"],"r":{"a":"4) Io","ev":"3, 6번 문장","s":[[3,"It is called Io, and it’s Jupiter’s third largest moon.","그것은 Io(이오)라고 불리며, 목성의 세 번째로 큰 위성이다."],[6,"This creates heat inside Io and melts the rock inside it.","이것은 Io 내부에 열을 만들어 내어 그 안에 있는 암석을 녹인다."]],"w":"암석이 있는 곳은 Io의 안쪽이에요. 문장 앞에서 heat inside Io라고 했고, inside it의 it은 그 Io를 받아요.","c":4},"h":"c50f4fb117"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Over time, this process has created more and more volcanoes on Io.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시간이 지남에 따라, 이 과정은 Io에 점점 더 많은 화산을 만들어 왔다.","opts":["시간이 지나도 Io의 화산 수는 변하지 않았다.","시간이 지남에 따라 이 과정은 Io에 화산을 점점 더 많이 만들어 왔다.","이 과정은 Io의 화산을 하나씩 없애 왔다.","이 과정 때문에 Io에는 더 이상 화산이 생기지 않는다."],"r":{"a":"2) 시간이 지남에 따라 이 과정은 Io에 화산을 점점 더 많이 만들어 왔다.","ev":"8번 문장","s":[[8,"Over time, this process has created more and more volcanoes on Io.","시간이 지남에 따라, 이 과정은 Io에 점점 더 많은 화산을 만들어 왔다."]],"w":"more and more는 점점 더 많은이에요. 시간이 지나며 화산이 계속 늘어났다는 뜻이라 변하지 않았다, 없앴다, 더 이상 안 생긴다는 말은 모두 틀려요.","c":2},"h":"a513e08032"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Io는 너무 추워서 화산이 하나도 없다.","Io는 더 큰 두 위성보다 목성에서 더 멀다.","Io 내부의 열이 암석을 녹여 화산 폭발을 일으킨다.","목성에는 위성이 세 개뿐이다."],"opts":["Io has no volcanoes because it is too cold.","Io is farther from Jupiter than the two larger moons.","Heat inside Io melts rock and causes volcanic eruptions.","Jupiter has only three moons."],"r":{"a":"3) Heat inside Io melts rock and causes volcanic eruptions.","ev":"1, 2, 4, 6, 7번 문장","s":[[1,"The planet Jupiter has almost one hundred moons.","목성은 거의 100개의 위성을 가지고 있다."],[2,"Interestingly, one of these moons has lots of volcanoes on its surface!","흥미롭게도, 이 위성 중 하나는 표면에 많은 화산을 가지고 있다!"],[4,"It orbits the planet closer than the two larger moons.","그것은 두 개의 더 큰 위성보다 더 가까이 목성의 궤도를 돌고 있다."],[6,"This creates heat inside Io and melts the rock inside it.","이것은 Io 내부에 열을 만들어 내어 그 안에 있는 암석을 녹인다."],[7,"When the rock melts, it causes volcanic eruptions.","암석이 녹으면 그것은 화산 폭발을 일으킨다."]],"w":"6~7번에서 열이 암석을 녹이고 암석이 녹으면 화산이 폭발해요. 2번에서 화산이 많다고 했고, 4번에서 Io는 더 가깝다고 했고, 1번에서 목성의 위성은 거의 100개라고 해요.","c":3},"h":"753882359b"},{"n":9,"t":"sum","q":"Because Io is close to Jupiter, the (A) of Jupiter and the other moons pull on it, so Io now has (B) volcanoes.","ko":"Io는 목성에 가까워서 목성과 다른 위성의 (A)이 Io를 끌어당기고, 그래서 Io에는 지금 (B) 화산이 있다.","oko":["(A) 빛 / (B) 화산이 없는","(A) 중력 / (B) 화산이 없는","(A) 바람 / (B) 수백 개의","(A) 색깔 / (B) 몇 개 안 되는","(A) 중력 / (B) 수백 개의"],"opts":["(A) light / (B) no","(A) gravitational forces / (B) no","(A) winds / (B) hundreds of","(A) colors / (B) few","(A) gravitational forces / (B) hundreds of"],"r":{"a":"5) (A) gravitational forces / (B) hundreds of","ev":"4, 5, 9번 문장","s":[[4,"It orbits the planet closer than the two larger moons.","그것은 두 개의 더 큰 위성보다 더 가까이 목성의 궤도를 돌고 있다."],[5,"As a result, the gravitational forces of Jupiter and the other moons pull on Io in opposite directions.","결과적으로, 목성과 다른 위성의 중력은 Io를 정반대 방향으로 끌어당긴다."],[9,"In fact, there are hundreds of volcanoes now.","사실, 현재 (그곳에) 수백 개의 화산이 있다."]],"w":"4~5번에서 목성에 가까운 Io를 목성과 다른 위성의 중력(gravitational forces)이 끌어당겨요. 9번에서 지금 화산이 수백 개(hundreds of) 있다고 해요.","c":5},"h":"aeb9547934"},{"n":10,"t":"fill","q":"When the rock inside Io [A], it causes volcanic [B].","ko":"Io 내부의 암석이 [A] 때, 그것은 화산 [B]을 일으킨다.","bank":["melts","eruptions","orbit","surface","moons","pull"],"bko":{"melts":"녹다","eruptions":"폭발","surface":"표면","moons":"위성들","pull":"끌어당기다","orbit":"궤도를 돌다"},"r":{"a":"[A] melts, [B] eruptions","ev":"7번 문장","s":[[7,"When the rock melts, it causes volcanic eruptions.","암석이 녹으면 그것은 화산 폭발을 일으킨다."]],"w":"7번 문장 When the rock melts, it causes volcanic eruptions에서 가져왔어요. orbits와 pull은 중력 이야기(4~5번)에 나오는 말이라 암석에 일어나는 일과 맞지 않아요.","c":null},"h":"75ed7efe52"}]},{"u":7,"id":"nl2-07-3","no":3,"ko":"응급 처치 요령, 이것만 기억해!","items":[{"n":1,"t":"tf","q":"If a burn is small, you should run cold water over it.","ko":"화상 부위가 작다면 그 위로 찬물을 흐르게 해야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"If it is small, run cold water over the burn and cover it with a clean cloth.","화상 부위가 작다면, 화상 부위 위로 찬물을 흐르게 하고 깨끗한 천으로 감싸도록 한다."]],"w":"3번 문장에 If it is small, run cold water over the burn이라고 나와요. 작은 화상에는 찬물을 흐르게 해요.","c":"T"},"h":"ce13e0434c"},{"n":2,"t":"tf","q":"After a snake bite, the person should move around a lot.","ko":"뱀에게 물린 뒤에 그 사람은 많이 돌아다녀야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"After that, they should keep their body very still.","그 후, 환자는 몸을 가만히 두어야 한다."]],"w":"7번 문장에서 뱀에게 물린 사람은 몸을 가만히(very still) 두어야 한다고 해요. 많이 움직이라는 말은 반대예요.","c":"F"},"h":"99069558dd"},{"n":3,"t":"tf","q":"If a person has difficulty breathing after a bee sting, you should wait at home.","ko":"벌에게 쏘인 뒤에 숨 쉬기 어려워해도 집에서 기다려야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"If the person has difficulty breathing, take them to a doctor right away.","그 사람이 숨 쉬기 어려워하면, 즉시 의사에게 데리고 가라."]],"w":"14번 문장은 숨 쉬기 어려워하면 즉시(right away) 의사에게 데려가라고 해요. 집에서 기다리라는 말은 틀려요.","c":"F"},"h":"0cd158fd9a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Panic can cause their heart rate to increase.)","ko":"공황 상태는 심박동수를 증가하게 할 수 있다.","opts":["올라가다, 증가하다","줄어들다","멈추다","약해지다"],"word":"increase","r":{"a":"1) 올라가다, 증가하다","ev":"10~11번 문장","s":[[10,"Panic can cause their heart rate to increase.","공황 상태는 심박동수를 증가하게 할 수 있다."],[11,"It can speed up the spread of the venom as well.","이는 또한 독이 퍼지는 속도를 빠르게 한다."]],"w":"공황 상태가 되면 심박동수가 오르고, 11번에서 독이 퍼지는 속도도 빨라진다고 해요. 그래서 increase는 올라가다, 증가하다예요.","c":1},"h":"cec15ce889"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This will slow down the spread of the venom.)","ko":"이것은 ~이 퍼지는 것을 늦출 것이다.","opts":["꿀","약","독(독액)","피"],"word":"venom","r":{"a":"3) 독(독액)","ev":"6, 8번 문장","s":[[6,"Snake bites: First, get the person away from the snake to avoid additional bites.","뱀에게 물림: 먼저 더 물리는 것을 피하기 위해 그 사람을 뱀으로부터 떨어뜨려 놓는다."],[8,"This will slow down the spread of the venom.","이것은 독이 퍼지는 것을 늦출 것이다."]],"w":"6번에서 뱀에게 물린 사람 이야기이고, 8번은 몸을 가만히 두면 venom이 퍼지는 속도가 느려진다고 해요. 뱀에게 물렸을 때 퍼지는 것은 독이에요.","c":3},"h":"8f9bffd5d9"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis will slow down the spread of the venom.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 독이 퍼지는 것을 늦출 것이다.","opts":["뱀에게서 떨어지는 것","몸을 가만히 두는 것","환자를 병원에 데려가는 것","얼음을 대는 것"],"r":{"a":"2) 몸을 가만히 두는 것","ev":"7~8번 문장","s":[[7,"After that, they should keep their body very still.","그 후, 환자는 몸을 가만히 두어야 한다."],[8,"This will slow down the spread of the venom.","이것은 독이 퍼지는 것을 늦출 것이다."]],"w":"8번의 This는 바로 앞 7번 문장 내용이에요. 몸을 가만히 두면(keep their body very still) 독이 퍼지는 속도가 느려져요.","c":2},"h":"516d643c2d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Do not use any oils or creams on it, as they can cause further damage to the skin.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"피부에 추가적인 손상을 야기할 수 있으므로 그 위에 어떤 오일이나 크림도 사용하지 마라.","opts":["피부에 오일이나 크림을 바르면 상처가 빨리 낫는다.","크림은 발라도 되지만 오일은 바르면 안 된다.","오일이나 크림을 바른 다음에는 천으로 덮는다.","오일과 크림은 피부를 더 상하게 할 수 있으므로 바르지 않는다."],"r":{"a":"4) 오일과 크림은 피부를 더 상하게 할 수 있으므로 바르지 않는다.","ev":"5번 문장","s":[[5,"Do not use any oils or creams on it, as they can cause further damage to the skin.","피부에 추가적인 손상을 야기할 수 있으므로 그 위에 어떤 오일이나 크림도 사용하지 마라."]],"w":"Do not use any oils or creams는 어떤 오일도 크림도 쓰지 말라는 뜻이에요. as는 이유를 말하고, 피부에 추가 손상을 줄 수 있기 때문이에요.","c":4},"h":"d1308ee29a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["심한 화상은 집에서 오일을 바르면 된다.","벌에게 쏘이면 벌침을 한참 두었다가 뺀다.","뱀에게 물렸을 때 몸을 가만히 두면 독이 퍼지는 속도를 늦출 수 있다.","뱀에게 물린 사람은 공황 상태일 때 독이 더 천천히 퍼진다."],"opts":["For serious burns, you can use oil at home.","After a bee sting, you should leave the stinger in for a long time.","If a snake bites a person, keeping the body very still can slow down the spread of the venom.","Panic makes the venom spread more slowly."],"r":{"a":"3) If a snake bites a person, keeping the body very still can slow down the spread of the venom.","ev":"2, 5, 7, 8, 12번 문장","s":[[2,"Here are some tips for possible situations: Hot water burns: If the burn is serious, you should take the person to the hospital.","여기 가능한 상황들에 대한 몇 가지 조언이 있다. 온수 화상: 화상이 심하다면, 그 사람을 병원에 데리고 가야 한다."],[5,"Do not use any oils or creams on it, as they can cause further damage to the skin.","피부에 추가적인 손상을 야기할 수 있으므로 그 위에 어떤 오일이나 크림도 사용하지 마라."],[7,"After that, they should keep their body very still.","그 후, 환자는 몸을 가만히 두어야 한다."],[8,"This will slow down the spread of the venom.","이것은 독이 퍼지는 것을 늦출 것이다."],[12,"Bee stings: If someone is stung by a bee, you should remove the stinger immediately.","벌에게 쏘임: 누군가 벌에게 쏘이면, 바로 벌침을 제거해야 한다."]],"w":"7~8번에서 몸을 가만히 두면 독이 퍼지는 속도가 늦어진다고 해요. 2번 심한 화상은 병원, 5번 오일 금지, 12번 벌침은 바로 제거라서 나머지 선지는 틀려요. 공황 상태(Panic)는 오히려 독을 더 빨리 퍼지게 해요(11번).","c":3},"h":"915c3c3ba2"},{"n":9,"t":"sum","q":"To slow down the spread of the (A), a person bitten by a snake should keep their body (B) and stay calm.","ko":"(A)이 퍼지는 속도를 늦추려면 뱀에게 물린 사람은 몸을 (B) 두고 침착함을 유지해야 한다.","oko":["(A) 심장 / (B) 가만히","(A) 독 / (B) 움직이게","(A) 독 / (B) 활발하게","(A) 공기 / (B) 가만히","(A) 독 / (B) 가만히"],"opts":["(A) heart / (B) still","(A) venom / (B) moving","(A) venom / (B) active","(A) air / (B) still","(A) venom / (B) still"],"r":{"a":"5) (A) venom / (B) still","ev":"7~11번 문장","s":[[7,"After that, they should keep their body very still.","그 후, 환자는 몸을 가만히 두어야 한다."],[8,"This will slow down the spread of the venom.","이것은 독이 퍼지는 것을 늦출 것이다."],[9,"Make sure they stay calm.","환자는 반드시 침착함을 유지하도록 한다."],[10,"Panic can cause their heart rate to increase.","공황 상태는 심박동수를 증가하게 할 수 있다."],[11,"It can speed up the spread of the venom as well.","이는 또한 독이 퍼지는 속도를 빠르게 한다."]],"w":"7~8번에서 몸을 가만히(still) 두면 독(venom)이 퍼지는 속도가 늦어져요. 9~11번에서는 침착하지 못하면(Panic) 심박동수가 올라 독이 더 빨리 퍼진다고 해서, 침착함을 유지하라고 해요.","c":5},"h":"7db2cfeed5"},{"n":10,"t":"fill","q":"After a bee sting, remove the [A] right away, wash the area with soap and water, and apply [B] to reduce the swelling and pain.","ko":"벌에게 쏘이면 바로 [A]을 제거하고 비누와 물로 씻은 뒤 부기와 고통을 줄이기 위해 [B]을 댄다.","bank":["stinger","ice","hospital","snake","venom","soap"],"bko":{"stinger":"벌침","ice":"얼음","hospital":"병원","snake":"뱀","soap":"비누","venom":"독"},"r":{"a":"[A] stinger, [B] ice","ev":"12~13번 문장","s":[[12,"Bee stings: If someone is stung by a bee, you should remove the stinger immediately.","벌에게 쏘임: 누군가 벌에게 쏘이면, 바로 벌침을 제거해야 한다."],[13,"Next, wash the affected area with soap and water, and then apply ice to reduce the swelling and pain.","그다음에 상처 부위를 비누와 물로 씻고, 그러고 나서 부기와 고통을 줄이기 위해 얼음을 댄다."]],"w":"12번 remove the stinger, 13번 apply ice to reduce the swelling and pain에서 가져왔어요. soap(비누)은 이미 문장 속에서 씻을 때 쓰는 것이고, venom(독)은 뱀에게 물렸을 때 나오는 말이라 벌침 이야기와 맞지 않아요.","c":null},"h":"812056c1b9"}]},{"u":7,"id":"nl2-07-4","no":4,"ko":"나도 혹시 포모 증후군?","items":[{"n":1,"t":"tf","q":"People with FOMO constantly check their phones.","ko":"FOMO를 겪는 사람들은 끊임없이 자신의 전화기를 확인한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This causes people with FOMO to constantly check their phones.","이것은 FOMO를 겪는 사람들이 끊임없이 자신의 전화기를 확인하게 한다."]],"w":"3번 문장에 constantly check their phones가 그대로 나와요. 소외되는 불안감 때문에 전화기를 계속 확인해요.","c":"T"},"h":"597d1d577a"},{"n":2,"t":"tf","q":"JOMO means the pleasure of joining as many social activities as possible.","ko":"JOMO는 가능한 한 많은 사교 활동에 참여하는 즐거움을 의미한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"It refers to the pleasure of spending time alone instead of joining social activities.","그것은 사교적인 활동에 참여하는 대신에 혼자서 시간을 보내는 즐거움을 말한다."]],"w":"6번 문장에서 JOMO는 사교 활동에 참여하는 대신(instead of joining) 혼자 시간을 보내는 즐거움이에요. 참여한다는 말은 반대예요.","c":"F"},"h":"0300329036"},{"n":3,"t":"tf","q":"You must attend every social event to start JOMO.","ko":"JOMO를 시작하려면 모든 사교 모임에 참석해야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"You don’t need to attend every social event.","당신이 모든 사교 모임에 참석할 필요는 없다."]],"w":"13번 문장은 모든 사교 모임에 참석할 필요가 없다(don't need to attend)고 해요. 반드시 참석해야 한다는 말은 틀려요.","c":"F"},"h":"3f3c1e50d9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It refers to the anxiety of feeling like you're missing out on a social event.)","ko":"그것은 당신이
