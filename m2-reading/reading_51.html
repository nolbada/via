var D=[{"n": 1, "tag": "8월 1일 · 하와이 도착", "en": "After a nine-hours flight, my family finally arrived at the international airport in Honolulu.", "ko": "아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다.", "ok": false, "foot": [], "fixes": [{"wrong": "nine-hours", "right": "nine-hour", "partial": false, "at": [2], "point": "복합 형용사: 하이픈 복합 형용사의 명사는 단수 hour 사용", "topic": "복합 형용사", "memo": "하이픈 복합 형용사의 명사는 단수 hour 사용"}]}, {"n": 2, "tag": null, "en": "When we came through the gate, I heard someone calling me name. My cousin Soobin and her family were waiting for us.", "ko": "우리가 게이트를 통과했을 때, 나는 누군가 내 이름을 부르는 소리를 들었다. 내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "me", "right": "my", "partial": false, "at": [10], "point": "인칭대명사의 소유격: name 앞에는 소유격 my 사용", "topic": "인칭대명사의 소유격", "memo": "name 앞에는 소유격 my 사용"}]}, {"n": 3, "tag": null, "en": "When we saw each others, we hugged and jumped together in a circles. Then Soobin putted a pretty flower necklace around my neck.", "ko": "우리가 서로를 보았을 때, 우리는 껴안고 함께 원을 그리며 뛰었다. 그때 수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다.", "ok": false, "foot": [], "fixes": [{"wrong": "others", "right": "other", "partial": false, "at": [4], "point": "each other: each other는 항상 other 단수형 사용", "topic": "each other", "memo": "each other는 항상 other 단수형 사용"}, {"wrong": "circles", "right": "circle", "partial": false, "at": [12], "point": "명사의 복수형: a 뒤에는 단수명사 circle 사용", "topic": "명사의 복수형", "memo": "a 뒤에는 단수명사 circle 사용"}, {"wrong": "putted", "right": "put", "partial": false, "at": [15], "point": "불규칙 과거형: put의 과거형은 put (putted 아님)", "topic": "불규칙 과거형", "memo": "put의 과거형은 put (putted 아님)"}]}, {"n": 4, "tag": null, "en": "She called it a lei and said that \"lei\" means \"warm welcome.\"", "ko": "그녀는 그것을 '레이(lei)'라고 불렀고 \"lei\"는 '따뜻한 환영'을 의미한다고 말했다.", "ok": true, "foot": [], "fixes": []}, {"n": 5, "tag": null, "en": "We visited Diamond Head first. It is a famously hiking place.", "ko": "우리는 먼저 다이아몬드 헤드를 방문했다. 그곳은 유명한 하이킹 장소이다.", "ok": false, "foot": [], "fixes": [{"wrong": "famously", "right": "famous", "partial": false, "at": [8], "point": "형용사와 부사: 명사 hiking place 앞에는 형용사 famous 사용", "topic": "형용사와 부사", "memo": "명사 hiking place 앞에는 형용사 famous 사용"}]}, {"n": 6, "tag": null, "en": "My uncle told us how it got its name. On the past, people mistook its shiny rocks for diamonds.", "ko": "삼촌이 우리에게 그것이 어떻게 그런 이름을 갖게 되었는지 말해 주셨다. 과거에, 사람들은 그것의 반짝이는 돌들을 다이아몬드로 착각했다.", "ok": false, "foot": [], "fixes": [{"wrong": "On", "right": "In", "partial": false, "at": [9], "point": "기본전치사: '과거에'는 In the past 사용", "topic": "기본전치사", "memo": "'과거에'는 In the past 사용"}]}, {"n": 7, "tag": null, "en": "So, they named the place Diamond Head. How interesting!", "ko": "그래서 그들은 그 장소를 다이아몬드 헤드라고 이름 붙였다. 정말 흥미로웠다!", "ok": true, "foot": [], "fixes": []}, {"n": 8, "tag": null, "en": "The view from the top were amazing. Soobin and I took much pictures there!", "ko": "정상에서 바라본 경치는 정말 놀라웠다. 수빈이와 나는 거기서 많은 사진을 찍었다!", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [5], "point": "be동사의 수일치: 주어 The view(단수)에는 was 사용", "topic": "be동사의 수일치", "memo": "주어 The view(단수)에는 was 사용"}, {"wrong": "much", "right": "many", "partial": false, "at": [11], "point": "수량 형용사: 셀 수 있는 pictures 앞에는 many 사용", "topic": "수량 형용사", "memo": "셀 수 있는 pictures 앞에는 many 사용"}]}, {"n": 9, "tag": "8월 2일 · 문화 센터", "en": "Today we goed to a culture center. We learned about traditional Hawaiian culture there.", "ko": "오늘 우리는 문화 센터에 갔다. 우리는 거기에서 하와이 전통문화에 대해 배웠다.", "ok": false, "foot": [], "fixes": [{"wrong": "goed", "right": "went", "partial": false, "at": [2], "point": "불규칙 과거형: go의 과거형은 went (goed 아님)", "topic": "불규칙 과거형", "memo": "go의 과거형은 went (goed 아님)"}]}, {"n": 10, "tag": null, "en": "First, we learned what some Hawaiian words means. \"Aloha\" is used to say \"hello\" or \"goodbye,\" and \"mahalo\" means \"thank you.\"", "ko": "먼저, 우리는 몇몇 하와이 단어들이 무엇을 의미하는지 배웠다. \"Aloha\"는 '안녕' 또는 '잘 가'라는 인사를 하는 데 사용되고, \"mahalo\"는 '고마워'를 의미한다.", "ok": false, "foot": [], "fixes": [{"wrong": "means", "right": "mean", "partial": false, "at": [7], "point": "주어와 동사의 수일치: 주어 words(복수)는 동사원형: mean (means 아님)", "topic": "주어와 동사의 수일치", "memo": "주어 words(복수)는 동사원형: mean (means 아님)"}]}, {"n": 11, "tag": null, "en": "Then it was hula dance time! Surprisingly, many of the movement stood for things in nature.", "ko": "그 다음은 훌라 춤 시간이었다! 놀랍게도, 많은 동작들이 자연의 것들을 상징했다.", "ok": false, "foot": [], "fixes": [{"wrong": "movement", "right": "movements", "partial": false, "at": [10], "point": "명사의 복수형: many of the 뒤에는 복수명사 movements 사용", "topic": "명사의 복수형", "memo": "many of the 뒤에는 복수명사 movements 사용"}]}, {"n": 12, "tag": null, "en": "For example, if you raise you arms above your head in a circle, it stand for the moon.", "ko": "예를 들어, 팔을 머리 위로 원을 그리며 들면, 그것은 달을 의미한다.", "ok": false, "foot": [], "fixes": [{"wrong": "you", "right": "your", "partial": false, "at": [5], "point": "인칭대명사의 소유격: arms 앞에는 소유격 your 사용", "topic": "인칭대명사의 소유격", "memo": "arms 앞에는 소유격 your 사용"}, {"wrong": "stand", "right": "stands", "partial": false, "at": [14], "point": "3인칭 단수 현재형: 주어 it에는 stands 사용", "topic": "3인칭 단수 현재형", "memo": "주어 it에는 stands 사용"}]}, {"n": 13, "tag": null, "en": "When I danced hula, I could felt the Hawaiian people's love for nature.", "ko": "훌라 춤을 출 때, 나는 하와이 사람들의 자연에 대한 사랑을 느낄 수 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "felt", "right": "feel", "partial": false, "at": [6], "point": "조동사 뒤 동사원형: 조동사 could 뒤에는 동사원형: feel (felt 아님)", "topic": "조동사 뒤 동사원형", "memo": "조동사 could 뒤에는 동사원형: feel (felt 아님)"}]}, {"n": 14, "tag": null, "en": "On the way back to Soobin's house, we saw a big, beautiful rainbow. Soobin explained, \"You can see often rainbows in Hawaii.", "ko": "수빈이네 집으로 돌아가는 길에, 우리는 크고 아름다운 무지개를 보았다. 수빈이는 \"하와이에서는 무지개를 자주 볼 수 있어.", "ok": false, "foot": [], "fixes": [{"wrong": "see often", "right": "often see", "partial": false, "at": [17], "point": "빈도부사의 위치: 빈도부사 often은 일반동사 see 앞에 위치", "topic": "빈도부사의 위치", "memo": "빈도부사 often은 일반동사 see 앞에 위치"}]}, {"n": 15, "tag": null, "en": "So, Hawaii is called the Rainbow State.\"", "ko": "그래서 하와이는 '무지개 주'라고 불려.\"라고 설명해 주었다.", "ok": true, "foot": [], "fixes": []}];var PP=[["Monday, August 1", "8월 1일 월요일", 1], ["After a nine-hour flight, my family finally arrived at the international airport in Honolulu.", "아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다.", 1], ["When we came through the gate, I heard someone calling my name.", "우리가 게이트를 통과했을 때, 나는 누군가 내 이름을 부르는 소리를 들었다.", 0], ["My cousin Soobin and her family were waiting for us.", "내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다.", 0], ["When we saw each other, we hugged and jumped together in a circle.", "우리가 서로를 보았을 때, 우리는 껴안고 함께 원을 그리며 뛰었다.", 0], ["Then Soobin put a pretty flower necklace around my neck.", "그때 수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다.", 0], ["She called it a lei and said that \"lei\" means \"warm welcome.\"", "그녀는 그것을 '레이(lei)'라고 불렀고 \"lei\"는 '따뜻한 환영'을 의미한다고 말했다.", 0], ["We visited Diamond Head first.", "우리는 먼저 다이아몬드 헤드를 방문했다.", 1], ["It is a famous hiking place.", "그곳은 유명한 하이킹 장소이다.", 0], ["My uncle told us how it got its name.", "삼촌이 우리에게 그것이 어떻게 그런 이름을 갖게 되었는지 말해 주셨다.", 0], ["In the past, people mistook its shiny rocks for diamonds.", "과거에, 사람들은 그것의 반짝이는 돌들을 다이아몬드로 착각했다.", 0], ["So, they named the place Diamond Head.", "그래서 그들은 그 장소를 다이아몬드 헤드라고 이름 붙였다.", 0], ["How interesting!", "정말 흥미로웠다!", 0], ["The view from the top was amazing.", "정상에서 바라본 경치는 정말 놀라웠다.", 0], ["Soobin and I took many pictures there!", "수빈이와 나는 거기서 많은 사진을 찍었다!", 0], ["Tuesday, August 2", "8월 2일 화요일", 1], ["Today we went to a culture center.", "오늘 우리는 문화 센터에 갔다.", 1], ["We learned about traditional Hawaiian culture there.", "우리는 거기에서 하와이 전통문화에 대해 배웠다.", 0], ["First, we learned what some Hawaiian words mean.", "먼저, 우리는 몇몇 하와이 단어들이 무엇을 의미하는지 배웠다.", 1], ["\"Aloha\" is used to say \"hello\" or \"goodbye,\" and \"mahalo\" means \"thank you.\"", "\"Aloha\"는 '안녕' 또는 '잘 가'라는 인사를 하는 데 사용되고, \"mahalo\"는 '고마워'를 의미한다.", 0], ["Then it was hula dance time!", "그 다음은 훌라 춤 시간이었다!", 1], ["Surprisingly, many of the movements stood for things in nature.", "놀랍게도, 많은 동작들이 자연의 것들을 상징했다.", 0], ["For example, if you raise your arms above your head in a circle, it stands for the moon.", "예를 들어, 팔을 머리 위로 원을 그리며 들면, 그것은 달을 의미한다.", 0], ["When I danced hula, I could feel the Hawaiian people's love for nature.", "훌라 춤을 출 때, 나는 하와이 사람들의 자연에 대한 사랑을 느낄 수 있었다.", 0], ["On the way back to Soobin's house, we saw a big, beautiful rainbow.", "수빈이네 집으로 돌아가는 길에, 우리는 크고 아름다운 무지개를 보았다.", 1], ["Soobin explained, \"You can often see rainbows in Hawaii.", "수빈이는 \"하와이에서는 무지개를 자주 볼 수 있어.", 0], ["So, Hawaii is called the Rainbow State.\"", "그래서 하와이는 '무지개 주'라고 불려.\"라고 설명해 주었다.", 0]];var RNUM=51;var TITLE_EN="Yeji's Family Trip to the Rainbow State";var PASS_EN=["Yeji's Family Trip to the Rainbow State", "Monday, August 1", "After a nine-hour flight, my family finally arrived at the international airport in Honolulu. When we came through the gate, I heard someone calling my name. My cousin Soobin and her family were waiting for us. When we saw each other, we hugged and jumped together in a circle. Then Soobin put a pretty flower necklace around my neck. She called it a lei and said that \"lei\" means \"warm welcome.\"", "We visited Diamond Head first. It is a famous hiking place. My uncle told us how it got its name. In the past, people mistook its shiny rocks for diamonds. So, they named the place Diamond Head. How interesting! The view from the top was amazing. Soobin and I took many pictures there!", "Tuesday, August 2", "Today we went to a culture center. We learned about traditional Hawaiian culture there.", "First, we learned what some Hawaiian words mean. \"Aloha\" is used to say \"hello\" or \"goodbye,\" and \"mahalo\" means \"thank you.\"", "Then it was hula dance time! Surprisingly, many of the movements stood for things in nature. For example, if you raise your arms above your head in a circle, it stands for the moon. When I danced hula, I could feel the Hawaiian people's love for nature.", "On the way back to Soobin's house, we saw a big, beautiful rainbow. Soobin explained, \"You can often see rainbows in Hawaii. So, Hawaii is called the Rainbow State.\""];var PASS_KO=["예지의 무지개 주 가족 여행", "8월 1일 월요일", "아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다. 우리가 게이트를 통과했을 때, 나는 누군가 내 이름을 부르는 소리를 들었다. 내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다. 우리가 서로를 보았을 때, 우리는 껴안고 함께 원을 그리며 뛰었다. 그때 수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다. 그녀는 그것을 '레이(lei)'라고 불렀고 \"lei\"는 '따뜻한 환영'을 의미한다고 말했다.", "우리는 먼저 다이아몬드 헤드를 방문했다. 그곳은 유명한 하이킹 장소이다. 삼촌이 우리에게 그것이 어떻게 그런 이름을 갖게 되었는지 말해 주셨다. 과거에, 사람들은 그것의 반짝이는 돌들을 다이아몬드로 착각했다. 그래서 그들은 그 장소를 다이아몬드 헤드라고 이름 붙였다. 정말 흥미로웠다! 정상에서 바라본 경치는 정말 놀라웠다. 수빈이와 나는 거기서 많은 사진을 찍었다!", "8월 2일 화요일", "오늘 우리는 문화 센터에 갔다. 우리는 거기에서 하와이 전통문화에 대해 배웠다.", "먼저, 우리는 몇몇 하와이 단어들이 무엇을 의미하는지 배웠다. \"Aloha\"는 '안녕' 또는 '잘 가'라는 인사를 하는 데 사용되고, \"mahalo\"는 '고마워'를 의미한다.", "그 다음은 훌라 춤 시간이었다! 놀랍게도, 많은 동작들이 자연의 것들을 상징했다. 예를 들어, 팔을 머리 위로 원을 그리며 들면, 그것은 달을 의미한다. 훌라 춤을 출 때, 나는 하와이 사람들의 자연에 대한 사랑을 느낄 수 있었다.", "수빈이네 집으로 돌아가는 길에, 우리는 크고 아름다운 무지개를 보았다. 수빈이는 \"하와이에서는 무지개를 자주 볼 수 있어. 그래서 하와이는 '무지개 주'라고 불려.\"라고 설명해 주었다."];
