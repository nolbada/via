brary is called Biblioburro.","ko":"루이스 소리아노의 이동 도서관은 비블리오부로라고 불린다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장에서 He called it Biblioburro라고 함. 이동 도서관의 이름이 Biblioburro라는 내용과 일치.","c":"T","ev":"4번 문장","s":[[4,"He called it Biblioburro, which means “donkey library” in Spanish.","그는 그것을 '비블리오부로'라고 불렀는데, 이는 스페인어로 '당나귀 도서관'을 뜻한다."]]},"h":"20922cf843"},{"n":2,"t":"tf","q":"Biblioburro still has only 70 books.","ko":"비블리오부로는 아직도 책이 70권뿐이다.","r":{"a":"F (본문과 다른 내용)","w":"70권은 5번에서 처음 시작할 때의 책 수. 10번 문장에서 지금은 more than 4,000 books(4,000권 이상)라고 함. 그래서 틀린 내용.","c":"F","ev":"5번, 10번 문장","s":[[5,"With two donkeys and just 70 books, Luis began visiting small villages.","당나귀 두 마리와 겨우 70권의 책을 가지고, 루이스는 작은 마을들을 방문하기 시작했다."],[10,"Now, Biblioburro has more than 4,000 books.","이제 비블리오부로는 4,000권이 넘는 책을 가지고 있다."]]},"h":"2f68af4ab7"},{"n":3,"t":"tf","q":"A small library has also opened in Luis’s town.","ko":"루이스의 마을에는 작은 도서관도 문을 열었다.","r":{"a":"T (본문과 맞는 내용)","w":"11번 문장에 A small library has also opened in Luis’s town이라고 그대로 나옴. 루이스의 마을에 작은 도서관도 생겼다는 내용과 같음.","c":"T","ev":"11번 문장","s":[[11,"A small library has also opened in Luis’s town.","루이스의 마을에는 작은 도서관도 문을 열었다."]]},"h":"676d5c2ba4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Children gather when the donkeys arrive.)","ko":"아이들은 당나귀들이 도착하면 ( ).","opts":["흩어지다","모이다","도망치다","잠자다"],"word":"gather","r":{"a":"2) 모이다","w":"8번 문장에서 당나귀가 오면 아이들이 어떻게 되는지 생각하면 됨. gather = 모이다. 9번에서 루이스가 그 아이들(them)에게 책을 읽어 주니 흩어지는 것은 아님.","c":2,"ev":"8~9번 문장","s":[[8,"Children gather when the donkeys arrive.","당나귀들이 도착하면 아이들이 모인다."],[9,"Luis reads to them and lets them borrow books to take home.","루이스는 아이들에게 책을 읽어 주고, 집에 가져가도록 책을 빌려 가게 해 준다."]]},"h":"d5a54bd633"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They cross rivers and climb narrow trails.)","ko":"그들은 강을 건너고 ( ) 길을 오른다.","opts":["넓은","위험한","좁은","긴"],"word":"narrow","r":{"a":"3) 좁은","w":"7번 문장에서 길(trails)을 꾸미는 말. 작은 마을까지 가는 산길이므로 narrow = 좁은. 넓은은 반대 뜻.","c":3,"ev":"7번 문장","s":[[7,"They cross rivers and climb narrow trails.","그들은 강을 건너고 좁은 길을 오른다."]]},"h":"a091b5aacc"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHe called it Biblioburro, which means “donkey library” in Spanish.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그는 그것을 '비블리오부로'라고 불렀는데, 이는 스페인어로 '당나귀 도서관'을 뜻한다.","opts":["루이스가 시작한 이동 도서관","콜롬비아의 외딴 마을","스페인어 단어","루이스의 당나귀"],"r":{"a":"1) 루이스가 시작한 이동 도서관","w":"3번 문장에서 루이스가 시작한 것이 a traveling library. 4번에서 그것(it)을 Biblioburro라고 불렀다는 뜻. 당나귀는 도서관 이름 속에 들어 있는 말일 뿐.","c":1,"ev":"3~4번 문장","s":[[3,"So Luis Soriano, a teacher in one of these areas, started a traveling library.","그래서 그런 지역 중 한 곳의 교사인 루이스 소리아노는 이동 도서관을 시작했다."],[4,"He called it Biblioburro, which means “donkey library” in Spanish.","그는 그것을 '비블리오부로'라고 불렀는데, 이는 스페인어로 '당나귀 도서관'을 뜻한다."]]},"h":"cae49c443f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This means children don’t have access to books.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 아이들이 책을 접할 수 없다는 뜻이다.","opts":["아이들이 책을 마음껏 고를 수 있다는 뜻이다.","아이들이 책 읽기를 싫어한다는 뜻이다.","아이들이 책을 접할 수 없다는 뜻이다.","아이들이 책을 너무 많이 갖고 있다는 뜻이다."],"r":{"a":"3) 아이들이 책을 접할 수 없다는 뜻이다.","w":"don’t have access to는 '~을 접할 수 없다'는 뜻. 1번에서 외딴 마을에 학교와 도서관이 없다고 했으니, 아이들이 책을 접할 수 없다는 3번.","c":3,"ev":"2번 문장","s":[[2,"This means children don’t have access to books.","이것은 아이들이 책을 접할 수 없다는 뜻이다."]]},"h":"66dee1bb4f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["루이스의 마을에는 이미 도서관이 많아서 루이스가 도서관을 시작했다.","루이스와 당나귀들은 강을 건너고 좁은 길을 오른다.","비블리오부로는 1년에 한 번만 마을을 방문한다.","비블리오부로는 지금 책이 100권도 안 된다."],"opts":["Luis started the library because his town already had many libraries.","Luis and his donkeys cross rivers and climb narrow trails.","Biblioburro visits villages only once a year.","Biblioburro has fewer than 100 books now."],"r":{"a":"2) Luis and his donkeys cross rivers and climb narrow trails.","w":"7번 문장에서 루이스와 당나귀가 강을 건너고 좁은 길을 오른다고 함. ①은 1~3번에서 도서관이 없어서 시작했다고 해서 반대, ③은 6번에서 매주 이동한다고 해서 반대, ④는 10번에서 4,000권 이상이라고 해서 반대.","c":2,"ev":"1번, 3번, 6번, 7번, 10번 문장","s":[[1,"Many remote villages in Colombia do not have schools or libraries.","콜롬비아의 많은 외딴 마을에는 학교나 도서관이 없다."],[3,"So Luis Soriano, a teacher in one of these areas, started a traveling library.","그래서 그런 지역 중 한 곳의 교사인 루이스 소리아노는 이동 도서관을 시작했다."],[6,"Each week, Luis and his donkeys travel up to 10 kilometers.","매주 루이스와 그의 당나귀들은 최대 10킬로미터를 이동한다."],[7,"They cross rivers and climb narrow trails.","그들은 강을 건너고 좁은 길을 오른다."],[10,"Now, Biblioburro has more than 4,000 books.","이제 비블리오부로는 4,000권이 넘는 책을 가지고 있다."]]},"h":"d4b1835505"},{"n":9,"t":"sum","q":"Luis Soriano takes books to remote villages on (A) ______ so that children can (B) ______ them and take them home.","ko":"루이스 소리아노는 (A) 위에 책을 싣고 외딴 마을에 가서, 아이들이 책을 (B) 집에 가져갈 수 있게 한다.","oko":["(A) 트럭 / (B) 빌리다","(A) 당나귀 / (B) 팔다","(A) 배 / (B) 쓰다","(A) 당나귀 / (B) 빌리다","(A) 자전거 / (B) 빌리다"],"opts":["(A) trucks / (B) borrow","(A) donkeys / (B) sell","(A) boats / (B) write","(A) donkeys / (B) borrow","(A) bicycles / (B) borrow"],"r":{"a":"4) (A) donkeys / (B) borrow","w":"5번에서 루이스는 당나귀 두 마리(donkeys)와 책을 가지고 마을을 방문하기 시작했고, 9번에서 아이들이 책을 빌려(borrow) 집에 가져가게 해 줌. 트럭·배·자전거는 본문에 없고, 책을 팔거나 쓰는 내용도 없음.","c":4,"ev":"5번, 9번 문장","s":[[5,"With two donkeys and just 70 books, Luis began visiting small villages.","당나귀 두 마리와 겨우 70권의 책을 가지고, 루이스는 작은 마을들을 방문하기 시작했다."],[9,"Luis reads to them and lets them borrow books to take home.","루이스는 아이들에게 책을 읽어 주고, 집에 가져가도록 책을 빌려 가게 해 준다."]]},"h":"6412e99c1d"},{"n":10,"t":"fill","q":"Luis’s idea has [A] other people to start mobile libraries and has helped many children [B] reading.","ko":"루이스의 아이디어는 다른 사람들이 이동 도서관을 시작하도록 [A] 많은 아이들이 독서를 [B] 도왔다.","bank":["inspired","enjoy","borrow","gather","climb","cross"],"bko":{"inspired":"영감을 주었다","enjoy":"즐기다","borrow":"빌리다","gather":"모이다","climb":"오르다","cross":"건너다"},"r":{"a":"[A] inspired, [B] enjoy","w":"12번 문장 His idea has helped many children enjoy reading and inspired others to start mobile libraries에서 가져옴. borrow·gather·climb·cross는 본문에 나오지만 이 빈칸에는 뜻이 맞지 않음.","c":null,"ev":"12번 문장","s":[[12,"His idea has helped many children enjoy reading and inspired others to start mobile libraries.","그의 아이디어는 많은 아이들이 독서를 즐기도록 도왔고 다른 사람들이 이동 도서관을 시작하도록 영감을 주었다."]]},"h":"fe850be81a"}]},{"u":7,"id":"b2-07-2","no":2,"ko":"교실이 바다 위에 있다면?","items":[{"n":1,"t":"tf","q":"Semester at Sea is a college program where students travel and study on a ship.","ko":"세메스터 앳 시는 학생들이 배를 타고 여행하며 공부하는 대학 프로그램이다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장이 그대로 이 설명임. 배 위에서 여행하며 공부한다는 내용과 일치.","c":"T","ev":"3번 문장","s":[[3,"It’s a college program where students travel and study on a ship.","그것은 학생들이 배를 타고 여행하며 공부하는 대학 프로그램이다."]]},"h":"e0f474756c"},{"n":2,"t":"tf","q":"The journey lasts about 100 days and stops in only 3 countries.","ko":"그 여정은 약 100일 동안 이어지며 단 3개의 나라에만 들른다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 100일은 맞지만 stops in more than 10 countries(10개가 넘는 나라)라고 함. 3개 나라라는 부분이 틀림.","c":"F","ev":"4번 문장","s":[[4,"The journey lasts about 100 days and stops in more than 10 countries.","그 여정은 약 100일 동안 이어지며 10개가 넘는 나라에 들른다."]]},"h":"4e424afd21"},{"n":3,"t":"tf","q":"Students continue learning through real experiences when the ship arrives at a port.","ko":"배가 항구에 도착하면 학생들은 실제 경험을 통해 계속 배운다.","r":{"a":"T (본문과 맞는 내용)","w":"8번 문장이 같은 내용. 항구에 도착한 뒤에도 실제 경험으로 배움을 이어간다는 뜻.","c":"T","ev":"8번 문장","s":[[8,"When the ship arrives at a port, students continue learning through real experiences.","배가 항구에 도착하면, 학생들은 실제 경험을 통해 계속 배운다."]]},"h":"56104060ae"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The journey lasts about 100 days and stops in more than 10 countries.)","ko":"( )은 약 100일 동안 이어지며 10개가 넘는 나라에 들른다.","opts":["여행","시험","휴식","경기"],"word":"journey","r":{"a":"1) 여행","w":"4번 문장에서 100일 동안 이어지고 여러 나라에 들른다고 했으므로 journey = 여정, 긴 여행. 3번에서 배를 타고 여행(travel)한다는 말과도 이어짐.","c":1,"ev":"4번 문장","s":[[4,"The journey lasts about 100 days and stops in more than 10 countries.","그 여정은 약 100일 동안 이어지며 10개가 넘는 나라에 들른다."]]},"h":"6fd244756e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A history student might explore ancient ruins.)","ko":"역사학과 학생은 ( ) 유적을 탐험할지도 모른다.","opts":["작은","현대의","유명한","고대의"],"word":"ancient","r":{"a":"4) 고대의","w":"10번 문장에서 역사학과 학생이 탐험하는 유적(ruins)을 꾸미는 말. 역사학과 학생이 가는 곳이므로 ancient = 고대의. 현대의는 반대 뜻.","c":4,"ev":"10번 문장","s":[[10,"A history student might explore ancient ruins.","역사학과 학생은 고대 유적을 탐험할지도 모른다."]]},"h":"83bff7e81f"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSome lessons also introduce the culture or history of the next country they will visit.","ko":"밑줄 친 they가 가리키는 것은?","sko":"일부 수업은 그들이 다음에 방문할 나라의 문화나 역사도 소개한다.","opts":["수업들","학생들","나라들","선생님들"],"r":{"a":"2) 학생들","w":"5번에서 배가 항해하는 동안 수업을 듣는 사람은 학생들(students). 7번의 they는 다음 나라를 방문할 학생들. 수업은 소개하는 쪽이고, 방문하는 쪽이 아님.","c":2,"ev":"5번, 7번 문장","s":[[5,"While the ship is sailing, students take classes such as world history and international business.","배가 항해하는 동안, 학생들은 세계사와 국제 경영 같은 수업을 듣는다."],[7,"Some lessons also introduce the culture or history of the next country they will visit.","일부 수업은 그들이 다음에 방문할 나라의 문화나 역사도 소개한다."]]},"h":"e9c592a232"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For these students, the ocean is a campus, and every country is a classroom.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 학생들에게 바다는 캠퍼스이고 모든 나라는 교실이다.","opts":["학생들은 바다에서 수영하는 법을 배우는 데 대부분의 시간을 쓴다.","학생들은 모든 나라에 학교 건물을 새로 짓는다.","학생들은 바다 위와 방문하는 모든 나라에서 배움을 얻는다.","학생들은 교실 없이 놀기만 한다."],"r":{"a":"3) 학생들은 바다 위와 방문하는 모든 나라에서 배움을 얻는다.","w":"12번은 비유. 바다(배 위)는 캠퍼스, 방문하는 나라는 교실이라는 말은 배 위에서도 나라에서도 배운다는 뜻. 5번 수업과 8번 이후 실제 경험이 이어지는 내용임.","c":3,"ev":"12번 문장","s":[[12,"For these students, the ocean is a campus, and every country is a classroom.","이 학생들에게 바다는 캠퍼스이고 모든 나라는 교실이다."]]},"h":"cf0b5d4910"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["학생들은 배가 항구에 도착한 뒤에만 수업을 듣는다.","모든 학생이 각 항구에서 똑같은 활동을 한다.","프로그램은 5개 미만의 나라에 들른다.","일부 수업은 다음에 갈 나라의 문화나 역사를 소개한다."],"opts":["Students take classes only after the ship arrives at a port.","Every student joins the same activity at each port.","The program stops in fewer than five countries.","Some lessons introduce the culture or history of the next country."],"r":{"a":"4) Some lessons introduce the culture or history of the next country.","w":"7번 문장에서 일부 수업이 다음 나라의 문화나 역사를 소개한다고 함. ①은 5번에서 배가 항해하는 동안에도 수업을 듣는다고 해서 틀리고, ②는 9번에서 학생마다 다른 활동을 한다고 해서 틀리고, ③은 4번에서 10개가 넘는 나라에 들른다고 해서 틀림.","c":4,"ev":"4번, 5번, 7번, 9번 문장","s":[[4,"The journey lasts about 100 days and stops in more than 10 countries.","그 여정은 약 100일 동안 이어지며 10개가 넘는 나라에 들른다."],[5,"While the ship is sailing, students take classes such as world history and international business.","배가 항해하는 동안, 학생들은 세계사와 국제 경영 같은 수업을 듣는다."],[7,"Some lessons also introduce the culture or history of the next country they will visit.","일부 수업은 그들이 다음에 방문할 나라의 문화나 역사도 소개한다."],[9,"Each student joins different activities related to their classes.","각 학생은 자신의 수업과 관련된 서로 다른 활동에 참여한다."]]},"h":"8992e72d6a"},{"n":9,"t":"sum","q":"In Semester at Sea, students take (A) ______ on the ship, and the subjects they study depend on their (B) ______.","ko":"세메스터 앳 시에서 학생들은 배 위에서 (A)을 듣고, 공부하는 과목은 자신의 (B)에 따라 달라진다.","oko":["(A) 게임 / (B) 전공","(A) 수업 / (B) 나라","(A) 수업 / (B) 전공","(A) 시험 / (B) 선생님","(A) 식사 / (B) 친구"],"opts":["(A) games / (B) majors","(A) classes / (B) countries","(A) classes / (B) majors","(A) tests / (B) teachers","(A) meals / (B) friends"],"r":{"a":"3) (A) classes / (B) majors","w":"5번에서 배가 항해하는 동안 학생들은 세계사 같은 수업(classes)을 듣고, 6번에서 과목은 전공(majors)이나 관심사에 따라 달라짐. 나라에 따라 과목이 달라진다는 말은 없음.","c":3,"ev":"5~6번 문장","s":[[5,"While the ship is sailing, students take classes such as world history and international business.","배가 항해하는 동안, 학생들은 세계사와 국제 경영 같은 수업을 듣는다."],[6,"The subjects they study depend on their majors or interests.","그들이 공부하는 과목은 전공이나 관심사에 따라 달라진다."]]},"h":"96ad1d5743"},{"n":10,"t":"fill","q":"A history student might explore ancient [A], while a business student could visit a local [B].","ko":"역사학과 학생은 고대 [A]을 탐험할지도 모르고, 경영학과 학생은 현지 [B]를 방문할 수도 있다.","bank":["ruins","company","journey","subject","major","classes"],"bko":{"ruins":"유적","company":"회사","journey":"여정","subject":"과목","major":"전공","classes":"수업"},"r":{"a":"[A] ruins, [B] company","w":"10번에서 역사학과 학생은 고대 유적(ancient ruins)을 탐험하고, 11번에서 경영학과 학생은 현지 회사(local company)를 방문함. 나머지 단어는 본문에 나오지만 이 빈칸에는 뜻이 맞지 않음.","c":null,"ev":"10~11번 문장","s":[[10,"A history student might explore ancient ruins.","역사학과 학생은 고대 유적을 탐험할지도 모른다."],[11,"On the other hand, a business student could visit a local company.","반면에, 경영학과 학생은 현지 회사를 방문할 수도 있다."]]},"h":"f216787468"}]},{"u":7,"id":"b2-07-3","no":3,"ko":"토마토 타이머가 집중력을 살려 준다고?","items":[{"n":1,"t":"tf","q":"Francesco Cirillo had trouble focusing while studying.","ko":"프란체스코 시릴로는 공부하는 동안 집중하는 데 어려움을 겪었다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장 had trouble focusing while studying과 같은 내용.","c":"T","ev":"1번 문장","s":[[1,"In the 1980s, an Italian student named Francesco Cirillo had trouble focusing while studying.","1980년대에 이탈리아 학생 프란체스코 시릴로는 공부하는 동안 집중하는 데 어려움을 겪었다."]]},"h":"a76ef7b0b0"},{"n":2,"t":"tf","q":"Francesco first challenged himself to study for two hours.","ko":"프란체스코는 처음에 두 시간 동안 공부하겠다고 스스로에게 도전했다.","r":{"a":"F (본문과 다른 내용)","w":"2번 문장에서 처음 도전한 시간은 just two minutes(단 2분). 두 시간이 아님.","c":"F","ev":"2번 문장","s":[[2,"One day, he grabbed a tomato-shaped timer and challenged himself to study for just two minutes.","어느 날 그는 토마토 모양의 타이머를 집어 들고 단 2분 동안만 공부해 보겠다고 스스로에게 도전했다."]]},"h":"74ce6b795b"},{"n":3,"t":"tf","q":"The idea Francesco found became the Pomodoro Technique.","ko":"프란체스코가 찾은 아이디어는 포모도로 기법이 되었다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장 This idea became the Pomodoro Technique와 같은 내용. This idea는 4~5번의 25분 공부 + 5분 휴식 방법.","c":"T","ev":"6번 문장","s":[[6,"This idea became the Pomodoro Technique.","이 아이디어는 포모도로 기법이 되었다."]]},"h":"444f5b1b0c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day, he grabbed a tomato-shaped timer and challenged himself…)","ko":"어느 날 그는 토마토 모양의 타이머를 ( ) 스스로에게 도전했다.","opts":["던졌다","집어 들었다","깨뜨렸다","주문했다"],"word":"grabbed","r":{"a":"2) 집어 들었다","w":"2번 문장에서 타이머를 잡아서 바로 공부에 쓰는 장면. grab = 붙잡다, 집어 들다. 던지거나 깨뜨리면 타이머로 공부할 수 없음.","c":2,"ev":"2번 문장","s":[[2,"One day, he grabbed a tomato-shaped timer and challenged himself to study for just two minutes.","어느 날 그는 토마토 모양의 타이머를 집어 들고 단 2분 동안만 공부해 보겠다고 스스로에게 도전했다."]]},"h":"5f1b27f4b2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You also stay motivated as you finish each session.)","ko":"각 시간을 끝낼 때마다 계속 ( ) 상태가 된다.","opts":["피곤한","지루한","의욕이 있는","바쁜"],"word":"motivated","r":{"a":"3) 의욕이 있는","w":"11번 문장에서 각 시간을 끝낼 때마다 어떤 마음이 유지되는지 묻는 것. 10번의 without getting tired(지치지 않고)와 이어지는 좋은 점이라 motivated = 의욕이 있는.","c":3,"ev":"11번 문장","s":[[11,"You also stay motivated as you finish each session.","또한 각 시간을 끝낼 때마다 의욕이 계속 유지된다."]]},"h":"02d77e01aa"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSurprisingly, it worked!","ko":"밑줄 친 it이 가리키는 것은?","sko":"놀랍게도, 그것은 효과가 있었다!","opts":["토마토 모양 타이머로 2분 동안 공부해 보는 것","프란체스코가 다니던 이탈리아 학교","25분 동안 쉬는 것","포모도로라는 단어"],"r":{"a":"1) 토마토 모양 타이머로 2분 동안 공부해 보는 것","w":"3번 it은 바로 앞 2번에서 프란체스코가 도전한 일, 타이머를 들고 2분 동안 공부해 보기. 25분 휴식과 포모도로라는 단어는 4~5번에서 나중에 나옴.","c":1,"ev":"2~3번 문장","s":[[2,"One day, he grabbed a tomato-shaped timer and challenged himself to study for just two minutes.","어느 날 그는 토마토 모양의 타이머를 집어 들고 단 2분 동안만 공부해 보겠다고 스스로에게 도전했다."],[3,"Surprisingly, it worked!","놀랍게도, 그것은 효과가 있었다!"]]},"h":"38bea81f29"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"All you need is a timer!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"필요한 것은 타이머뿐이다!","opts":["타이머가 있으면 다른 준비물도 모두 필요하다.","필요한 것은 타이머 하나뿐이다.","타이머는 전혀 필요하지 않다.","타이머는 가장 마지막에 사야 한다."],"r":{"a":"2) 필요한 것은 타이머 하나뿐이다.","w":"All you need is ~는 '네게 필요한 것은 ~뿐이다'라는 뜻. 12번에서 한번 해 보라고 권한 뒤, 필요한 준비물은 타이머 하나라고 알려 줌. 그래서 2번.","c":2,"ev":"13번 문장","s":[[13,"All you need is a timer!","필요한 것은 타이머뿐이다!"]]},"h":"4232964985"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["프란체스코는 처음부터 25분씩 공부했다.","한 번 공부한 뒤에는 매번 15분을 쉰다.","포모도로는 25분의 각 공부 시간을 부르는 이름이다.","포모도로 기법에서는 25분 동안 쉬고 5분 동안 공부한다."],"opts":["Francesco studied for 25 minutes from the start.","You rest for 15 minutes after every study session.","Pomodoro is the name for each 25-minute study period.","In the Pomodoro Technique, you rest for 25 minutes and study for 5 minutes."],"r":{"a":"3) Pomodoro is the name for each 25-minute study period.","w":"5번에서 25분의 각 공부 시간을 pomodoro라고 부른다고 함. ①은 2번에서 처음엔 2분 공부했다고 해서 틀리고, ②는 8~9번에서 5분 쉬고 네 번 뒤에 15~30분 쉰다고 해서 틀리고, ④는 8번에서 25분 공부하고 5분 쉰다고 해서 반대.","c":3,"ev":"2번, 5번, 8번, 9번 문장","s":[[2,"One day, he grabbed a tomato-shaped timer and challenged himself to study for just two minutes.","어느 날 그는 토마토 모양의 타이머를 집어 들고 단 2분 동안만 공부해 보겠다고 스스로에게 도전했다."],[5,"He called each 25-minute study period a pomodoro, the Italian word for tomato.","그는 25분의 각 공부 시간을 토마토를 뜻하는 이탈리아어인 '포모도로'라고 불렀다."],[8,"Study for 25 minutes, then rest for 5 minutes, and repeat.","25분 동안 공부하고, 5분 동안 쉬고, 이를 반복하라."],[9,"After four of these sessions, take a longer break of 15 to 30 minutes.","이런 시간을 네 번 한 뒤에는 15분에서 30분의 더 긴 휴식을 취하라."]]},"h":"7ac2705297"},{"n":9,"t":"sum","q":"Francesco Cirillo found that studying for (A) ______ minutes followed by a (B) ______-minute break worked best.","ko":"프란체스코 시릴로는 (A)분 공부한 뒤 (B)분 쉬는 것이 가장 효과가 좋다는 것을 알게 되었다.","oko":["(A) 2 / (B) 5","(A) 5 / (B) 25","(A) 25 / (B) 15","(A) 25 / (B) 5","(A) 15 / (B) 30"],"opts":["(A) 2 / (B) 5","(A) 5 / (B) 25","(A) 25 / (B) 15","(A) 25 / (B) 5","(A) 15 / (B) 30"],"r":{"a":"4) (A) 25 / (B) 5","w":"4번 문장에서 25 minutes of study followed by a 5-minute break가 가장 좋았다고 함. 2분은 처음 도전한 시간(2번), 15~30분은 네 번 뒤의 긴 휴식(9번).","c":4,"ev":"4번 문장","s":[[4,"He slowly increased the time and found that 25 minutes of study followed by a 5-minute break worked best.","그는 시간을 천천히 늘렸고, 25분 공부한 뒤 5분 쉬는 것이 가장 효과가 좋다는 것을 알게 되었다."]]},"h":"290a955a4f"},{"n":10,"t":"fill","q":"After four sessions, take a longer [A] of 15 to 30 minutes. This rhythm helps your brain stay [B] without getting tired.","ko":"네 번의 시간 뒤에는 15~30분의 더 긴 [A]을 취하라. 이 리듬은 지치지 않고 뇌가 [B] 상태를 유지하도록 돕는다.","bank":["break","focused","timer","tomato","pattern","technique"],"bko":{"break":"휴식","focused":"집중한","timer":"타이머","tomato":"토마토","pattern":"패턴","technique":"기법"},"r":{"a":"[A] break, [B] focused","w":"9번 문장 take a longer break of 15 to 30 minutes와 10번 문장 stay focused without getting tired에서 가져옴. 나머지 단어는 본문에 나오지만 이 빈칸에는 뜻이 맞지 않음.","c":null,"ev":"9~10번 문장","s":[[9,"After four of these sessions, take a longer break of 15 to 30 minutes.","이런 시간을 네 번 한 뒤에는 15분에서 30분의 더 긴 휴식을 취하라."],[10,"This rhythm helps your brain stay focused without getting tired.","이 리듬은 지치지 않고 뇌가 집중을 유지하도록 돕는다."]]},"h":"f3cc9bb973"}]},{"u":7,"id":"b2-07-4","no":4,"ko":"지루한 공부를 게임처럼 만드는 비밀","items":[{"n":1,"t":"tf","q":"Gamification adds game-like features to everyday tasks.","ko":"게임화는 게임 같은 요소를 일상적인 일에 더한다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장이 그대로 게임화의 뜻임. 일상적인 일에 게임 같은 요소를 더한다는 내용과 일치.","c":"T","ev":"1번 문장","s":[[1,"Gamification adds game-like features to everyday tasks.","게임화는 게임 같은 요소를 일상적인 일에 더한다."]]},"h":"a097f1d0ca"},{"n":2,"t":"tf","q":"Duolingo learners cannot compete with other users.","ko":"듀오링고 학습자들은 다른 사용자들과 경쟁할 수 없다.","r":{"a":"F (본문과 다른 내용)","w":"6번 문장에서 They can also compete with other users라고 함. 경쟁할 수 있다는 내용이라 cannot은 틀림.","c":"F","ev":"6번 문장","s":[[6,"They can also compete with other users to see who studies the most.","그들은 또한 누가 가장 많이 공부하는지 보기 위해 다른 사용자들과 경쟁할 수 있다."]]},"h":"214bdc8b27"},{"n":3,"t":"tf","q":"Many schools now use gamification in subjects such as math and science.","ko":"많은 학교가 이제 수학과 과학 같은 과목에서 게임화를 사용한다.","r":{"a":"T (본문과 맞는 내용)","w":"11번 문장 Many schools now use it in subjects such as math and science와 같은 내용. it은 게임화.","c":"T","ev":"11번 문장","s":[[11,"Many schools now use it in subjects such as math and science.","많은 학교가 이제 수학과 과학 같은 과목에서 그것을 사용한다."]]},"h":"4396153ce1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Learners earn points and badges when they learn new words or grammar.)","ko":"학습자들은 새로운 단어나 문법을 배울 때 점수와 배지를 ( ).","opts":["잃는다","산다","얻는다","빌려준다"],"word":"earn","r":{"a":"3) 얻는다","w":"5번 문장에서 단어나 문법을 배우면 점수와 배지가 생긴다는 뜻. 7번의 보상(rewards)과 이어지므로 earn = 얻다. 잃는다는 반대 뜻.","c":3,"ev":"5번 문장","s":[[5,"Learners earn points and badges when they learn new words or grammar.","학습자들은 새로운 단어나 문법을 배울 때 점수와 배지를 얻는다."]]},"h":"7aa658a7f4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They can also compete with other users to see who studies the most.)","ko":"그들은 누가 가장 많이 공부하는지 보기 위해 다른 사용자들과 ( ) 수 있다.","opts":["경쟁할","도울","포기할","섞일"],"word":"compete","r":{"a":"1) 경쟁할","w":"6번 문장에서 목적이 누가 가장 많이 공부하는지 보는 것. 다른 사용자와 순위를 겨루는 것이므로 compete = 경쟁하다.","c":1,"ev":"6번 문장","s":[[6,"They can also compete with other users to see who studies the most.","그들은 또한 누가 가장 많이 공부하는지 보기 위해 다른 사용자들과 경쟁할 수 있다."]]},"h":"f609d0ffb9"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nMany schools now use it in subjects such as math and science.","ko":"밑줄 친 it이 가리키는 것은?","sko":"많은 학교가 이제 수학과 과학 같은 과목에서 그것을 사용한다.","opts":["듀오링고","게임화","수학","학교들"],"r":{"a":"2) 게임화","w":"10번 문장에서 gamification is spreading beyond apps(게임화가 앱을 넘어 퍼지고 있다)고 했고, 11번에서 학교들이 그것(it)을 사용함. 듀오링고는 3번의 앱 하나일 뿐.","c":2,"ev":"10~11번 문장","s":[[10,"Because of these benefits, gamification is spreading beyond apps.","이러한 이점 때문에 게임화는 앱을 넘어 퍼지고 있다."],[11,"Many schools now use it in subjects such as math and science.","많은 학교가 이제 수학과 과학 같은 과목에서 그것을 사용한다."]]},"h":"0bcbb98865"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This way keeps students interested in learning and helps them learn better.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 방식은 학생들이 학습에 계속 흥미를 갖게 하고 더 잘 배우도록 돕는다.","opts":["이 방식은 학생들이 학습에 흥미를 잃지만 빨리 끝내게 한다.","이 방식은 학생들이 혼자서만 공부하도록 만든다.","이 방식은 학생들이 흥미를 유지하고 더 잘 배우도록 돕는다.","이 방식은 학생들이 시험을 더 쉽게 통과하게 한다."],"r":{"a":"3) 이 방식은 학생들이 흥미를 유지하고 더 잘 배우도록 돕는다.","w":"12번은 결과 두 가지. 하나는 keeps students interested(학생들이 계속 흥미를 가짐), 다른 하나는 helps them learn better(더 잘 배움). ③만 이 두 가지가 모두 들어 있음. ④의 시험 이야기는 본문에 없음.","c":3,"ev":"12번 문장","s":[[12,"This way keeps students interested in learning and helps them learn better.","이 방식은 학생들이 학습에 계속 흥미를 갖게 하고 더 잘 배우도록 돕는다."]]},"h":"dabf4de964"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["게임화는 학생들이 새로운 정보를 더 쉽게 기억하도록 도울 수 있다.","듀오링고는 몇 시간짜리 긴 수업을 사용한다.","학습자들은 새로운 단어를 배우면 점수를 잃는다.","많은 학교가 미술 수업에서만 게임화를 사용한다."],"opts":["Gamification can help students remember new information more easily.","Duolingo uses long lessons that take hours.","Learners lose points when they learn new words.","Many schools use gamification only in art classes."],"r":{"a":"1) Gamification can help students remember new information more easily.","w":"9번 문장에서 연구들이 학생들이 새로운 정보를 더 쉽게 기억한다고 보여 줌. ②는 4번에서 짧고 재미있는 수업이라고 해서 틀리고, ③은 5번에서 점수를 얻는다고 해서 틀리고, ④는 11번에서 수학과 과학 같은 과목에 쓴다고 해서 틀림.","c":1,"ev":"4번, 5번, 9번, 11번 문장","s":[[4,"It uses short and fun lessons, like quick rounds in a game.","그것은 게임의 빠른 라운드처럼 짧고 재미있는 수업을 사용한다."],[5,"Learners earn points and badges when they learn new words or grammar.","학습자들은 새로운 단어나 문법을 배울 때 점수와 배지를 얻는다."],[9,"They also show that students remember new information more easily.","연구들은 또한 학생들이 새로운 정보를 더 쉽게 기억한다는 것을 보여 준다."],[11,"Many schools now use it in subjects such as math and science.","많은 학교가 이제 수학과 과학 같은 과목에서 그것을 사용한다."]]},"h":"fed4899b50"},{"n":9,"t":"sum","q":"On Duolingo, learners earn (A) ______ and badges, and these fun challenges and rewards make them want to (B) ______ more.","ko":"듀오링고에서 학습자들은 (A)와 배지를 얻고, 이런 재미있는 도전과 보상은 그들이 더 (B)하고 싶게 만든다.","oko":["(A) 돈 / (B) 잠자다","(A) 점수 / (B) 잠자다","(A) 돈 / (B) 공부하다","(A) 티켓 / (B) 쉬다","(A) 점수 / (B) 공부하다"],"opts":["(A) money / (B) sleep","(A) points / (B) sleep","(A) money / (B) study","(A) tickets / (B) rest","(A) points / (B) study"],"r":{"a":"5) (A) points / (B) study","w":"5번 문장에서 학습자들은 점수(points)와 배지를 얻고, 7번 문장에서 이런 도전과 보상이 더 공부하고(study) 싶게 만듦. 돈, 티켓, 잠, 휴식은 본문에 없음.","c":5,"ev":"5번, 7번 문장","s":[[5,"Learners earn points and badges when they learn new words or grammar.","학습자들은 새로운 단어나 문법을 배울 때 점수와 배지를 얻는다."],[7,"These fun challenges and rewards make learners want to study more.","이런 재미있는 도전과 보상은 학습자들이 더 공부하고 싶게 만든다."]]},"h":"24c3d29a04"},{"n":10,"t":"fill","q":"Studies show that gamification helps students stay [A] and remember new information more [B].","ko":"연구들은 게임화가 학생들이 [A] 상태를 유지하고 새로운 정보를 더 [B] 기억하도록 돕는다는 것을 보여 준다.","bank":["motivated","easily","badges","compete","points","beyond"],"bko":{"motivated":"의욕이 있는","easily":"쉽게","badges":"배지","compete":"경쟁하다","points":"점수","beyond":"~을 넘어"},"r":{"a":"[A] motivated, [B] easily","w":"8번 gamification helps students stay motivated와 9번 remember new information more easily에서 가져옴. 나머지 단어는 본문에 나오지만 이 빈칸에는 뜻이나 문법이 맞지 않음.","c":null,"ev":"8~9번 문장","s":[[8,"Studies show that gamification helps students stay motivated.","연구들은 게임화가 학생들이 의욕을 유지하도록 돕는다는 것을 보여 준다."],[9,"They also show that students remember new information more easily.","연구들은 또한 학생들이 새로운 정보를 더 쉽게 기억한다는 것을 보여 준다."]]},"h":"9e2997b552"}]},{"u":8,"id":"b2-08-1","no":1,"ko":"산에 가면 마음이 편해지는 진짜 이유","items":[{"n":1,"t":"tf","q":"Serotonin helps us feel calm and happy.","ko":"세로토닌은 우리가 차분하고 행복하게 느끼도록 돕는다.","r":{"a":"T (본문과 맞는 내용)","w":"5번 문장에 It can also increase serotonin, which helps us feel calm and happy라고 나옴. 세로토닌은 차분하고 행복하게 느끼게 돕는 호르몬이라는 내용과 같음.","c":"T","ev":"5번 문장","s":[[5,"It can also increase serotonin, which helps us feel calm and happy.","그것은 또한 우리가 차분하고 행복하게 느끼도록 돕는 세로토닌을 늘릴 수 있다."]]},"h":"50022e9432"},{"n":2,"t":"tf","q":"Spending time in nature can increase cortisol, the stress hormone.","ko":"자연에서 시간을 보내는 것은 스트레스 호르몬인 코티솔을 늘릴 수 있다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 자연은 코티솔을 lower(낮추다)할 수 있다고 함. 늘린다는 말은 반대.","c":"F","ev":"4번 문장","s":[[4,"It can lower cortisol, the hormone related to stress.","그것은 스트레스와 관련된 호르몬인 코티솔을 낮출 수 있다."]]},"h":"e69c2ba967"},{"n":3,"t":"tf","q":"The writer says that people who feel stressed should take a moment to go outside.","ko":"글쓴이는 스트레스를 받으면 잠시 밖으로 나가 보라고 말한다.","r":{"a":"T (본문과 맞는 내용)","w":"12번 문장에 So if you’re feeling stressed, take a moment to go outside라고 나옴. 스트레스를 받으면 잠깐 밖으로 나가라는 내용과 같음.","c":"T","ev":"12번 문장","s":[[12,"So if you’re feeling stressed, take a moment to go outside.","그러니 스트레스를 받고 있다면, 잠시 밖으로 나가 보라."]]},"h":"d4b921ae5b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the fresh air and trees help your mind relax.)","ko":"... 맑은 공기와 나무는 당신의 마음이 ( ) 도와준다.","opts":["긴장하다","편안해지다","피곤해지다","화나다"],"word":"relax","r":{"a":"2) 편안해지다","w":"1번 문장에서 산의 맑은 공기와 나무가 마음에 주는 효과. 2번에서 단지 기분만이 아니라고 하고, 4~6번에서 코티솔이 낮아지고 편안해진다고 함. relax = 편안해지다.","c":2,"ev":"1번 문장","s":[[1,"When you visit the mountains, the fresh air and trees help your mind relax.","산에 가면, 맑은 공기와 나무가 당신의 마음이 편안해지도록 돕는다."]]},"h":"31c108a06f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These places increased their chance of survival.)","ko":"이런 장소들은 그들의 ( ) 가능성을 높였다.","opts":["생존","여행","수확","발견"],"word":"survival","r":{"a":"1) 생존","w":"8번에서 초기 인류가 음식, 물, 쉴 곳을 찾아 숲과 초원으로 갔고, 9번에서 이곳들이 chance of survival(살아남을 가능성)을 높였다고 함. survival = 생존.","c":1,"ev":"8~9번 문장","s":[[8,"Long ago, early humans searched for forests and grasslands to find food, water, and shelter.","아주 오래전, 초기 인류는 음식, 물, 쉴 곳을 찾으려고 숲과 초원을 찾아다녔다."],[9,"These places increased their chance of survival.","이런 장소들은 그들의 생존 가능성을 높였다."]]},"h":"1eb34b4a54"},{"n":6,"t":"ref","q":"What does the underlined \"this reaction\" refer to?\nScientists believe this reaction comes from our past.","ko":"밑줄 친 this reaction이 가리키는 것은?","sko":"과학자들은 이 반응이 우리의 과거에서 비롯된다고 믿는다.","opts":["과학자들의 연구 방법","산으로 가는 여행","자연 속에서 몸과 마음이 편안해지는 반응","초기 인류가 음식을 찾는 일"],"r":{"a":"3) 자연 속에서 몸과 마음이 편안해지는 반응","w":"6번에서 코티솔과 세로토닌의 변화로 심장 박동이 느려지고 더 편안해짐. 7번의 this reaction은 이렇게 자연에서 편안해지는 반응이고, 그 원인이 과거에 있다고 설명함.","c":3,"ev":"6번, 7번 문장","s":[[6,"These changes slow our heart rate and make us feel more comfortable.","이런 변화들은 우리의 심장 박동을 느리게 하고 우리가 더 편안하게 느끼도록 만든다."],[7,"Scientists believe this reaction comes from our past.","과학자들은 이 반응이 우리의 과거에서 비롯된다고 믿는다."]]},"h":"37cd80bb03"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Over time, humans began to connect green spaces with comfort and safety.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시간이 지나면서, 인류는 푸른 공간을 편안함 및 안전과 연결 짓기 시작했다.","opts":["인류는 시간이 지나면서 푸른 공간을 피하게 되었다.","인류는 푸른 공간에 새 집을 짓기 시작했다.","인류는 편안함과 안전을 포기하고 푸른 공간을 떠났다.","인류는 시간이 지나면서 푸른 공간을 편안하고 안전한 곳으로 여기게 되었다."],"r":{"a":"4) 인류는 시간이 지나면서 푸른 공간을 편안하고 안전한 곳으로 여기게 되었다.","w":"10번의 connect A with B는 A를 B와 연결 짓다. 푸른 공간(숲, 초원)을 편안함과 안전에 연결하게 되었다는 뜻. 9번에서 이곳이 생존에 도움이 되었기 때문임.","c":4,"ev":"9~10번 문장","s":[[9,"These places increased their chance of survival.","이런 장소들은 그들의 생존 가능성을 높였다."],[10,"Over time, humans began to connect green spaces with comfort and safety.","시간이 지나면서, 인류는 푸른 공간을 편안함 및 안전과 연결 짓기 시작했다."]]},"h":"e4da7eacd7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["초기 인류는 숲과 초원을 피했다.","자연에서 시간을 보내면 우리 몸의 화학 물질이 바뀐다.","코티솔은 우리가 차분하고 행복하게 느끼도록 돕는다.","자연에서는 우리의 심장 박동이 더 빨라진다."],"opts":["Early humans avoided forests and grasslands.","Spending time in nature changes the chemicals in our bodies.","Cortisol helps us feel calm and happy.","Our heart rate gets faster in nature."],"r":{"a":"2) Spending time in nature changes the chemicals in our bodies.","w":"3번 문장에서 자연에서 시간을 보내면 몸의 화학 물질이 바뀐다고 함. ①은 8번에서 초기 인류가 숲과 초원을 찾았다고 해서 틀리고, ③은 4~5번에서 차분하고 행복하게 하는 것은 세로토닌이라고 해서 틀리고, ④는 6번에서 심장 박동이 느려진다고 해서 반대.","c":2,"ev":"3번, 4번, 5번, 6번, 8번 문장","s":[[3,"Studies show that spending time in nature changes the chemicals in our bodies.","연구들은 자연에서 시간을 보내는 것이 우리 몸의 화학 물질을 바꾼다는 것을 보여 준다."],[4,"It can lower cortisol, the hormone related to stress.","그것은 스트레스와 관련된 호르몬인 코티솔을 낮출 수 있다."],[5,"It can also increase serotonin, which helps us feel calm and happy.","그것은 또한 우리가 차분하고 행복하게 느끼도록 돕는 세로토닌을 늘릴 수 있다."],[6,"These changes slow our heart rate and make us feel more comfortable.","이런 변화들은 우리의 심장 박동을 느리게 하고 우리가 더 편안하게 느끼도록 만든다."],[8,"Long ago, early humans searched for forests and grasslands to find food, water, and shelter.","아주 오래전, 초기 인류는 음식, 물, 쉴 곳을 찾으려고 숲과 초원을 찾아다녔다."]]},"h":"ea61a9dcb3"},{"n":9,"t":"sum","q":"Spending time in nature slows our (A) ______ and makes us feel more (B) ______.","ko":"자연에서 시간을 보내면 우리의 (A)이 느려지고 우리는 더 (B)하게 느낀다.","oko":["(A) 심장 박동 / (B) 초조","(A) 호흡 / (B) 편안","(A) 심장 박동 / (B) 배고픔","(A) 잠 / (B) 스트레스","(A) 심장 박동 / (B) 편안"],"opts":["(A) heart rate / (B) nervous","(A) breathing / (B) comfortable","(A) heart rate / (B) hungry","(A) sleep / (B) stressed","(A) heart rate / (B) comfortable"],"r":{"a":"5) (A) heart rate / (B) comfortable","w":"6번 문장에서 These changes slow our heart rate(심장 박동수)하고 make us feel more comfortable(더 편안하게 느끼게 함). 호흡, 잠, 배고픔은 본문에 없음.","c":5,"ev":"6번 문장","s":[[6,"These changes slow our heart rate and make us feel more comfortable.","이런 변화들은 우리의 심장 박동을 느리게 하고 우리가 더 편안하게 느끼도록 만든다."]]},"h":"ff6733e28c"},{"n":10,"t":"fill","q":"Early humans searched for [A] and grasslands to find food, water, and shelter, so we still [B] positively to nature today.","ko":"초기 인류는 음식, 물, 쉴 곳을 찾으려고 [A]과 초원을 찾아다녔고, 그래서 우리는 오늘날에도 자연에 긍정적으로 [B].","bank":["forests","respond","lower","increase","stress","comfort"],"bko":{"forests":"숲","respond":"반응하다","lower":"낮추다","increase":"늘리다","stress":"스트레스","comfort":"편안함"},"r":{"a":"[A] forests, [B] respond","w":"8번 early humans searched for forests and grasslands와 11번 we still respond positively to nature today에서 가져옴. 나머지 단어는 본문에 나오지만 이 빈칸에는 뜻이 맞지 않음.","c":null,"ev":"8번, 11번 문장","s":[[8,"Long ago, early humans searched for forests and grasslands to find food, water, and shelter.","아주 오래전, 초기 인류는 음식, 물, 쉴 곳을 찾으려고 숲과 초원을 찾아다녔다."],[11,"Because of this, we still respond positively to nature today.","이 때문에, 우리는 오늘날에도 여전히 자연에 긍정적으로 반응한다."]]},"h":"4c2eb9b6b2"}]},{"u":8,"id":"b2-08-2","no":2,"ko":"피처럼 붉은 액체가 나오는 소코트라의 나무","items":[{"n":1,"t":"tf","q":"Socotra is an island off the coast of Yemen.","ko":"소코트라는 예멘 해안에서 떨어진 곳에 있는 섬이다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장 On the island of Socotra, off the coast of Yemen에서 소코트라는 예멘 해안에서 떨어진 섬임.","c":"T","ev":"1번 문장","s":[[1,"On the island of Socotra, off the coast of Yemen, there is a very unusual tree.","예멘 해안에서 떨어진 소코트라 섬에는 아주 특이한 나무가 있다."]]},"h":"595d8e0481"},{"n":2,"t":"tf","q":"The tree has a narrow top like a pencil.","ko":"그 나무는 연필처럼 좁은 윗부분을 가지고 있다.","r":{"a":"F (본문과 다른 내용)","w":"2번 문장에서 이 나무는 wide top(넓은 윗부분)이고 뒤집힌 우산처럼 생겼다고 함. 좁다는 말은 반대.","c":"F","ev":"2번 문장","s":[[2,"It has a wide top that looks like a huge upside-down umbrella.","그것은 거대한 뒤집힌 우산처럼 보이는 넓은 윗부분을 가지고 있다."]]},"h":"89828f312c"},{"n":3,"t":"tf","q":"Dragon’s Blood Trees stand as living symbols of Socotra’s ancient past.","ko":"용혈수는 소코트라의 고대 과거를 보여 주는 살아 있는 상징이다.","r":{"a":"T (본문과 맞는 내용)","w":"12번 문장에 They stand as living symbols of Socotra’s ancient past라고 나옴. They는 앞 문장의 많은 용혈수이고, 소코트라의 고대 과거를 보여 주는 살아 있는 상징이라는 내용과 같음.","c":"T","ev":"12번 문장","s":[[12,"They stand as living symbols of Socotra’s ancient past.","그것들은 소코트라의 고대 과거를 보여 주는 살아 있는 상징으로 서 있다."]]},"h":"1a2c364a4d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…there is a very unusual tree.)","ko":"... 아주 ( ) 나무가 있다.","opts":["흔한","특이한","거대한","오래된"],"word":"unusual","r":{"a":"2) 특이한","w":"1번 문장에서 이 나무를 소개하는 말. 2~4번에서 뒤집힌 우산 같은 모양이라고 하고, 3번에서 strange shape(이상한 모양)라고 함. unusual = 특이한, 흔치 않은.","c":2,"ev":"1번, 3번 문장","s":[[1,"On the island of Socotra, off the coast of Yemen, there is a very unusual tree.","예멘 해안에서 떨어진 소코트라 섬에는 아주 특이한 나무가 있다."],[3,"This strange shape is a clever survival trick in the dry climate.","이 이상한 모양은 건조한 기후에서 살아남기 위한 영리한 요령이다."]]},"h":"c9363365ac"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If its bark is cut, thick red liquid comes out.)","ko":"( )이 베이면 걸쭉한 붉은 액체가 나온다.","opts":["잎","뿌리","열매","나무껍질"],"word":"bark","r":{"a":"4) 나무껍질","w":"6번 문장에서 베이면 액체가 나오는 곳. 8번에서 수액이 굳어 wounds on the bark(나무껍질의 상처)를 보호함. bark = 나무껍질.","c":4,"ev":"6번, 8번 문장","s":[[6,"If its bark is cut, thick red liquid comes out.","나무껍질이 베이면, 걸쭉한 붉은 액체가 나온다."],[8,"The red sap hardens and protects wounds on the bark.","붉은 수액은 굳어서 나무껍질의 상처를 보호한다."]]},"h":"a4a1e1f90a"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt helps the tree catch water from rain and fog and carry it to the roots.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 나무가 비와 안개에서 물을 모아 뿌리로 운반하도록 돕는다.","opts":["넓은 윗부분의 이상한 모양","소코트라 섬","건조한 기후","붉은 수액"],"r":{"a":"1) 넓은 윗부분의 이상한 모양","w":"3번에서 넓은 윗부분의 This strange shape가 영리한 요령이라고 함. 4번의 It은 그 모양이고, 비와 안개에서 물을 모아 뿌리로 보내는 일을 함. 붉은 수액은 5번 이후에 나옴.","c":1,"ev":"3~4번 문장","s":[[3,"This strange shape is a clever survival trick in the dry climate.","이 이상한 모양은 건조한 기후에서 살아남기 위한 영리한 요령이다."],[4,"It helps the tree catch water from rain and fog and carry it to the roots.","그것은 나무가 비와 안개에서 물을 모아 뿌리로 운반하도록 돕는다."]]},"h":"29448b0c93"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This strange shape is a clever survival trick in the dry climate.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 이상한 모양은 건조한 기후에서 살아남기 위한 영리한 요령이다.","opts":["이 이상한 모양은 습한 기후에서 자라려고 생긴 것이다.","이 이상한 모양 때문에 나무가 더 건조해진다.","이 이상한 모양은 건조한 기후에서 나무가 살아남도록 돕는 영리한 방법이다.","이 이상한 모양은 사람들의 눈길을 끌려는 것이다."],"r":{"a":"3) 이 이상한 모양은 건조한 기후에서 나무가 살아남도록 돕는 영리한 방법이다.","w":"3번의 clever survival trick은 살아남기 위한 영리한 요령. 4번에서 그 모양이 비와 안개의 물을 모아 뿌리로 보낸다고 설명함. 습한 기후나 눈길 끌기는 본문에 없음.","c":3,"ev":"3~4번 문장","s":[[3,"This strange shape is a clever survival trick in the dry climate.","이 이상한 모양은 건조한 기후에서 살아남기 위한 영리한 요령이다."],[4,"It helps the tree catch water from rain and fog and carry it to the roots.","그것은 나무가 비와 안개에서 물을 모아 뿌리로 운반하도록 돕는다."]]},"h":"1d44787d57"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["이 나무의 이름은 하얀 꽃에서 왔다.","나무의 넓은 윗부분은 비와 안개에서 물을 모으게 돕는다.","많은 용혈수는 겨우 몇 년밖에 안 되었다.","나무의 수액은 곤충을 가까이 오게 한다."],"opts":["The tree gets its name from its white flowers.","The tree’s wide top helps it catch water from rain and fog.","Many Dragon’s Blood Trees are only a few years old.","The sap of the tree makes insects come closer."],"r":{"a":"2) The tree’s wide top helps it catch water from rain and fog.","w":"2번에서 넓은 윗부분이 있고, 4번에서 그것이 비와 안개에서 물을 모아 뿌리로 보낸다고 함. ①은 7번에서 수액이 피처럼 보여서 이름이 붙었다고 해서 틀리고, ③은 11번에서 수백 년 되었다고 해서 틀리고, ④는 9번에서 곤충을 쫓아낸다고 해서 틀림.","c":2,"ev":"2번, 4번, 7번, 9번, 11번 문장","s":[[2,"It has a wide top that looks like a huge upside-down umbrella.","그것은 거대한 뒤집힌 우산처럼 보이는 넓은 윗부분을 가지고 있다."],[4,"It helps the tree catch water from rain and fog and carry it to the roots.","그것은 나무가 비와 안개에서 물을 모아 뿌리로 운반하도록 돕는다."],[7,"Because this sap looks like blood, people named it the Dragon’s Blood Tree.","이 수액이 피처럼 보이기 때문에, 사람들은 그것을 '용혈수'라고 이름 붙였다."],[9,"It also has special chemicals that help the tree fight germs and keep insects away.","그것은 또한 나무가 세균과 싸우고 곤충을 쫓아내도록 돕는 특별한 화학 물질도 가지고 있다."],[11,"Many Dragon’s Blood Trees are hundreds of years old.","많은 용혈수는 수백 년이 되었다."]]},"h":"742875a5da"},{"n":9,"t":"sum","q":"Because the red sap looks like (A) ______, the tree is called the Dragon’s Blood Tree, and the sap (B) ______ and protects wounds on the bark.","ko":"붉은 수액이 (A)처럼 보여서 이 나무는 용혈수라고 불리고, 수액은 (B) 나무껍질의 상처를 보호한다.","oko":["(A) 물 / (B) 굳어서","(A) 피 / (B) 녹아서","(A) 불 / (B) 굳어서","(A) 피 / (B) 굳어서","(A) 불 / (B) 사라져서"],"opts":["(A) water / (B) hardens","(A) blood / (B) melts","(A) fire / (B) hardens","(A) blood / (B) hardens","(A) fire / (B) disappears"],"r":{"a":"4) (A) blood / (B) hardens","w":"7번에서 수액이 피(blood)처럼 보여서 Dragon’s Blood Tree라는 이름이 붙었고, 8번에서 붉은 수액이 굳어서(hardens) 나무껍질의 상처를 보호함. 물, 불, 녹음, 사라짐은 본문에 없음.","c":4,"ev":"7~8번 문장","s":[[7,"Because this sap looks like blood, people named it the Dragon’s Blood Tree.","이 수액이 피처럼 보이기 때문에, 사람들은 그것을 '용혈수'라고 이름 붙였다."],[8,"The red sap hardens and protects wounds on the bark.","붉은 수액은 굳어서 나무껍질의 상처를 보호한다."]]},"h":"5c0333d923"},{"n":10,"t":"fill","q":"This tree is also known for its incredible [A]. Many Dragon’s Blood Trees are hundreds of years [B].","ko":"이 나무는 놀라운 [A]로도 알려져 있다. 많은 용혈수는 수백 년 [B].","bank":["age","old","tall","wide","dry","red"],"bko":{"age":"나이","old":"된","tall":"키가 큰","wide":"넓은","dry":"건조한","red":"붉은"},"r":{"a":"[A] age, [B] old","w":"10번 known for its incredible age와 11번 hundreds of years old에서 가져옴. tall, wide, dry, red는 본문에 나오지만 이 빈칸에는 뜻이나 문법이 맞지 않음.","c":null,"ev":"10~11번 문장","s":[[10,"This tree is also known for its incredible age.","이 나무는 놀라운 나이로도 알려져 있다."],[11,"Many Dragon’s Blood Trees are hundreds of years old.","많은 용혈수는 수백 년이 되었다."]]},"h":"6d06a66152"}]},{"u":8,"id":"b2-08-3","no":3,"ko":"숲속에 숨은 인터넷, 우드 와이드 웹","items":[{"n":1,"t":"tf","q":"Scientists call the underground fungi network the “wood wide web.”","ko":"과학자들은 땅속 곰팡이 네트워크를 '우드 와이드 웹'이라고 부른다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장 Scientists call it the “wood wide web.”와 같은 내용. it은 2번의 곰팡이 네트워크.","c":"T","ev":"3번 문장","s":[[3,"Scientists call it the “wood wide web.”","과학자들은 그것을 '우드 와이드 웹'이라고 부른다."]]},"h":"8f06964172"},{"n":2,"t":"tf","q":"We can easily see this network with our eyes.","ko":"우리는 이 네트워크를 눈으로 쉽게 볼 수 있다.","r":{"a":"F (본문과 다른 내용)","w":"12번 문장에서 We cannot see this network with our eyes라고 함. 볼 수 없다는 내용이라 틀림.","c":"F","ev":"12번 문장","s":[[12,"We cannot see this network with our eyes.","우리는 이 네트워크를 눈으로 볼 수 없다."]]},"h":"ede6bc8546"},{"n":3,"t":"tf","q":"If bugs attack a tree, it sends chemical signals through its roots.","ko":"벌레가 나무를 공격하면, 그 나무는 뿌리를 통해 화학 신호를 보낸다.","r":{"a":"T (본문과 맞는 내용)","w":"5번 문장 if bugs attack one tree, it sends chemical signals through its roots와 같은 내용.","c":"T","ev":"5번 문장","s":[[5,"For example, if bugs attack one tree, it sends chemical signals through its roots.","예를 들어, 벌레가 한 나무를 공격하면 그 나무는 뿌리를 통해 화학 신호를 보낸다."]]},"h":"2b69e83aff"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Other trees detect these signals…)","ko":"다른 나무들은 이 신호를 ( ) …","opts":["보낸다","감지한다","숨긴다","만든다"],"word":"detect","r":{"a":"2) 감지한다","w":"6번 문장은 5번에서 한 나무가 보낸 신호를 다른 나무들이 받는 장면. 받은 뒤에 맛이 나쁜 화학 물질을 만들기 시작하므로 detect = 알아채다, 감지하다.","c":2,"ev":"5~6번 문장","s":[[5,"For example, if bugs attack one tree, it sends chemical signals through its roots.","예를 들어, 벌레가 한 나무를 공격하면 그 나무는 뿌리를 통해 화학 신호를 보낸다."],[6,"Other trees detect these signals and start making bad-tasting chemicals in their leaves.","다른 나무들은 이 신호를 감지하고 잎에서 맛이 나쁜 화학 물질을 만들기 시작한다."]]},"h":"c9c26f7796"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Older trees send them nutrients through the network.)","ko":"더 나이 든 나무들이 네트워크를 통해 그들에게 ( )을 보내 준다.","opts":["그림자","벌레","영양분","소리"],"word":"nutrients","r":{"a":"3) 영양분","w":"9번에서 어린 나무들이 충분한 양분(food)을 만들지 못한다고 했고, 10번에서 나이 든 나무들이 그 부족을 채워 줌. nutrients = 영양분.","c":3,"ev":"9~10번 문장","s":[[9,"In shady places, young trees cannot make enough food from sunlight.","그늘진 곳에서는 어린 나무들이 햇빛으로 충분한 양분을 만들 수 없다."],[10,"Older trees send them nutrients through the network.","더 나이 든 나무들이 네트워크를 통해 그들에게 영양분을 보내 준다."]]},"h":"9161aeb89f"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nOlder trees send them nutrients through the network.","ko":"밑줄 친 them이 가리키는 것은?","sko":"더 나이 든 나무들이 네트워크를 통해 그들에게 영양분을 보내 준다.","opts":["더 나이 든 나무들","그늘진 곳의 어린 나무들","벌레들","곰팡이들"],"r":{"a":"2) 그늘진 곳의 어린 나무들","w":"9번에서 그늘진 곳의 어린 나무들이 양분을 충분히 만들지 못한다고 함. 10번의 them은 그 어린 나무들이고, 보내 주는 쪽은 나이 든 나무들.","c":2,"ev":"9~10번 문장","s":[[9,"In shady places, young trees cannot make enough food from sunlight.","그늘진 곳에서는 어린 나무들이 햇빛으로 충분한 양분을 만들 수 없다."],[10,"Older trees send them nutrients through the network.","더 나이 든 나무들이 네트워크를 통해 그들에게 영양분을 보내 준다."]]},"h":"fcde708fa0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without this help, many young trees would not survive.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 도움이 없다면, 많은 어린 나무들은 살아남지 못할 것이다.","opts":["이 도움 덕분에 어린 나무들은 훨씬 빨리 자란다.","어린 나무들은 도움을 거절해서 오히려 살아남는다.","많은 어린 나무는 이 도움 때문에 죽는다.","이 도움이 없다면 많은 어린 나무는 살아남지 못할 것이다."],"r":{"a":"4) 이 도움이 없다면 많은 어린 나무는 살아남지 못할 것이다.","w":"11번의 Without this help는 이 도움이 없다면. this help는 10번에서 나이 든 나무가 영양분을 보내 주는 도움. 그 도움이 없으면 어린 나무가 못 산다는 뜻.","c":4,"ev":"10~11번 문장","s":[[10,"Older trees send them nutrients through the network.","더 나이 든 나무들이 네트워크를 통해 그들에게 영양분을 보내 준다."],[11,"Without this help, many young trees would not survive.","이 도움이 없다면, 많은 어린 나무들은 살아남지 못할 것이다."]]},"h":"ee128ea7a0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["곰팡이 네트워크는 서로 다른 나무의 뿌리를 연결한다.","나무들은 서로 아무것도 나눌 수 없다.","큰 나무가 작은 나무의 영양분을 가져간다.","그늘진 곳의 어린 나무들은 양분을 충분히 만든다."],"opts":["The network of fungi connects the roots of different trees.","Trees cannot share anything with each other.","Big trees take nutrients from small trees.","Young trees in shady places make plenty of food."],"r":{"a":"1) The network of fungi connects the roots of different trees.","w":"2번에서 곰팡이 네트워크가 나무 뿌리를 연결한다고 했으므로 1번 선지가 맞음. 2번 선지는 4번(물, 양분, 메시지를 나눔)과 반대, 3번 선지는 10번(나이 든 나무가 영양분을 보내 줌)과 반대, 4번 선지는 9번(충분히 만들지 못함)과 반대.","c":1,"ev":"2, 4, 9, 10번 문장","s":[[2,"There is a network of fungi underground that connects tree roots and allows them to communicate.","땅속에는 나무 뿌리를 연결하고 나무들이 서로 소통할 수 있게 해 주는 곰팡이 네트워크가 있다."],[4,"Through this network, trees can share water, food, and messages.","이 네트워크를 통해 나무들은 물, 양분, 메시지를 나눌 수 있다."],[9,"In shady places, young trees cannot make enough food from sunlight.","그늘진 곳에서는 어린 나무들이 햇빛으로 충분한 양분을 만들 수 없다."],[10,"Older trees send them nutrients through the network.","더 나이 든 나무들이 네트워크를 통해 그들에게 영양분을 보내 준다."]]},"h":"74650df037"},{"n":9,"t":"sum","q":"In shady places, young trees cannot make enough (A) ______ from sunlight, so older trees send them (B) ______ through the network.","ko":"그늘진 곳에서는 어린 나무들이 햇빛으로 충분한 (A)을 만들 수 없어서, 더 나이 든 나무들이 네트워크를 통해 그들에게 (B)을 보내 준다.","oko":["(A) 물 / (B) 벌레","(A) 빛 / (B) 영양분","(A) 양분 / (B) 영양분","(A) 양분 / (B) 벌레","(A) 공기 / (B) 신호"],"opts":["(A) water / (B) bugs","(A) light / (B) nutrients","(A) food / (B) nutrients","(A) food / (B) bugs","(A) air / (B) signals"],"r":{"a":"3) (A) food / (B) nutrients","w":"9번에서 어린 나무들이 햇빛으로 충분한 양분(food)을 만들 수 없고, 10번에서 나이 든 나무들이 영양분(nutrients)을 보내 줌. 벌레와 신호는 5~7번 이야기라 이 문장과 어긋남.","c":3,"ev":"9~10번 문장","s":[[9,"In shady places, young trees cannot make enough food from sunlight.","그늘진 곳에서는 어린 나무들이 햇빛으로 충분한 양분을 만들 수 없다."],[10,"Older trees send them nutrients through the network.","더 나이 든 나무들이 네트워크를 통해 그들에게 영양분을 보내 준다."]]},"h":"0f7fab167b"},{"n":10,"t":"fill","q":"Other trees detect these signals and start making bad-tasting [A] in their leaves. This helps keep the [B] away.","ko":"다른 나무들은 이 신호를 감지하고 잎에서 맛이 나쁜 [A]을 만들기 시작한다. 이것은 [B]을 쫓아내는 데 도움이 된다.","bank":["chemicals","bugs","roots","leaves","networks","sunlight"],"bko":{"chemicals":"화학 물질","bugs":"벌레들","roots":"뿌리","leaves":"잎","networks":"네트워크","sunlight":"햇빛"},"r":{"a":"[A] chemicals, [B] bugs","w":"6번 start making bad-tasting chemicals in their leaves와 7번 This helps keep the bugs away에서 가져옴. 나머지 단어는 본문에 나오지만 이 빈칸에는 뜻이 맞지 않음.","c":null,"ev":"6~7번 문장","s":[[6,"Other trees detect these signals and start making bad-tasting chemicals in their leaves.","다른 나무들은 이 신호를 감지하고 잎에서 맛이 나쁜 화학 물질을 만들기 시작한다."],[7,"This helps keep the bugs away.","이것은 벌레들을 쫓아내는 데 도움이 된다."]]},"h":"fe133ec1ae"}]},{"u":8,"id":"b2-08-4","no":4,"ko":"초콜릿이 사라질지도 모른다고?","items":[{"n":1,"t":"tf","q":"Cacao trees grow in hot, rainy regions like West Africa.","ko":"카카오나무는 서아프리카 같은 덥고 비가 많이 오는 지역에서 자란다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장 cacao trees, which grow in hot, rainy regions like West Africa와 같은 내용.","c":"T","ev":"3번 문장","s":[[3,"Chocolate comes from cacao trees, which grow in hot, rainy regions like West Africa.","초콜릿은 서아프리카 같은 덥고 비가 많이 오는 지역에서 자라는 카카오나무에서 나온다."]]},"h":"b2c600ff27"},{"n":2,"t":"tf","q":"West Africa has never had steady rainfall.","ko":"서아프리카는 꾸준한 강우량을 가진 적이 한 번도 없다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 These regions once had steady rainfall and stable temperatures라고 함. 한때는 꾸준한 강우량이 있었으므로 never는 틀림.","c":"F","ev":"4번 문장","s":[[4,"These regions once had steady rainfall and stable temperatures.","이 지역들은 한때 꾸준한 강우량과 안정적인 기온을 가지고 있었다."]]},"h":"d08f9e696e"},{"n":3,"t":"tf","q":"Some farmers are moving their crops to cooler hillsides.","ko":"일부 농부들은 작물을 더 시원한 언덕 비탈로 옮기고 있다.","r":{"a":"T (본문과 맞는 내용)","w":"14번 문장 some farmers are moving their crops to cooler hillsides와 같은 내용.","c":"T","ev":"14번 문장","s":[[14,"Also, some farmers are moving their crops to cooler hillsides with more stable conditions.","또한 일부 농부들은 더 안정적인 조건을 가진 더 시원한 언덕 비탈로 작물을 옮기고 있다."]]},"h":"0b6e9183c7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These regions once had steady rainfall and stable temperatures.)","ko":"이 지역들은 한때 꾸준한 강우량과 ( ) 기온을 가지고 있었다.","opts":["불규칙한","안정적인","높은","낮은"],"word":"stable","r":{"a":"2) 안정적인","w":"4번에서 once(한때)의 좋았던 상태를 말하고, 5~6번에서 But now 비가 덜 규칙적이고 기온이 오른다고 함. 그 반대라 stable = 안정적인.","c":2,"ev":"4~6번 문장","s":[[4,"These regions once had steady rainfall and stable temperatures.","이 지역들은 한때 꾸준한 강우량과 안정적인 기온을 가지고 있었다."],[5,"But now, the climate is changing.","하지만 이제 기후가 변하고 있다."],[6,"Rainfall is less regular and temperatures are rising.","강우량은 덜 규칙적이고 기온은 오르고 있다."]]},"h":"8c8b5b2e5c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the farmers who rely on cacao for their income.)","ko":"... 카카오로 소득을 얻는 데 ( ) 농부들","opts":["의지하는","반대하는","잊어버린","섞어 놓은"],"word":"rely","r":{"a":"1) 의지하는","w":"11번에서 농부들은 카카오로 소득을 얻음. 그래서 카카오 생산이 줄면 농부들의 소득도 영향을 받음. rely on = ~에 의지하다.","c":1,"ev":"11번 문장","s":[[11,"This affects both chocolate production and the farmers who rely on cacao for their income.","이것은 초콜릿 생산과 카카오로 소득을 얻는 농부들 모두에게 영향을 준다."]]},"h":"5b8143f809"},{"n":6,"t":"ref","q":"What does the underlined \"These trees\" refer to?\nThese trees can grow well in this changing weather.","ko":"밑줄 친 These trees가 가리키는 것은?","sko":"이 나무들은 이렇게 변하는 날씨에서도 잘 자랄 수 있다.","opts":["서아프리카의 오래된 나무들","열  scientists are developing stronger cacao trees.","돕기 위해, 과학자들은 더 강한 카카오나무를 개발하고 있다."],[14,"Also, some farmers are moving their crops to cooler hillsides with more stable conditions.","또한 일부 농부들은 더 안정적인 조건을 가진 더 시원한 언덕 비탈로 작물을 옮기고 있다."]]},"h":"d495b0fb09"},{"n":9,"t":"sum","q":"Too little rain (A) ______ the trees, and too much rain damages the roots and spreads (B) ______.","ko":"비가 너무 적으면 나무를 (A), 비가 너무 많으면 뿌리가 손상되고 (B)이 퍼진다.","oko":["(A) 키운다 / (B) 감염","(A) 말라 버리게 한다 / (B) 꽃","(A) 말라 버리게 한다 / (B) 감염","(A) 키운다 / (B) 물","(A) 식힌다 / (B) 꽃"],"opts":["(A) feeds / (B) infection","(A) dries out / (B) flowers","(A) dries out / (B) infection","(A) feeds / (B) water","(A) cools / (B) flowers"],"r":{"a":"3) (A) dries out / (B) infection","w":"7번에서 비가 너무 적으면 나무가 말라 버리고(dries out), 8번에서 비가 너무 많으면 뿌리가 손상되고 감염(infection)이 퍼짐. 꽃은 9번의 기온 이야기라 이 문장과 맞지 않음.","c":3,"ev":"7~8번 문장","s":[[7,"Too little rain dries out the trees.","비가 너무 적으면 나무가 말라 버린다."],[8,"Too much damages the roots and spreads infection.","비가 너무 많으면 뿌리가 손상되고 감염이 퍼진다."]]},"h":"dea207286b"},{"n":10,"t":"fill","q":"A temperature rise of just 2 [A] can stop cacao flowers from growing. As a result, many trees are producing fewer cacao [B].","ko":"단 2[A]의 기온 상승이 카카오 꽃이 자라는 것을 막을 수 있다. 그 결과, 많은 나무가 더 적은 카카오 [B]를 생산하고 있다.","bank":["degrees","pods","rainfall","income","farmers","hillsides"],"bko":{"degrees":"도(온도)","pods":"열매 꼬투리","rainfall":"강우량","income":"소득","farmers":"농부들","hillsides":"언덕 비탈"},"r":{"a":"[A] degrees, [B] pods","w":"9번 a temperature rise of just 2 degrees와 10번 producing fewer cacao pods에서 가져옴. 나머지 단어는 본문에 나오지만 이 빈칸에는 뜻이 맞지 않음.","c":null,"ev":"9~10번 문장","s":[[9,"A temperature rise of just 2 degrees can stop cacao flowers from growing.","단 2도의 기온 상승이 카카오 꽃이 자라는 것을 막을 수 있다."],[10,"As a result, many trees are producing fewer cacao pods.","그 결과, 많은 나무가 더 적은 카카오 열매 꼬투리를 생산하고 있다."]]},"h":"eba974a3db"}]},{"u":9,"id":"b2-09-1","no":1,"ko":"뱀파이어는 어떻게 진짜가 되었을까?","items":[{"n":1,"t":"tf","q":"In the 1700s, people in Eastern Europe knew the cause of the terrible diseases.","ko":"1700년대 동유럽 사람들은 무서운 질병의 원인을 알고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"In Eastern Europe in the 1700s, terrible diseases spread, but no one knew why.","1700년대 동유럽에서는 무서운 질병이 퍼졌지만, 아무도 그 이유를 알지 못했다."]],"w":"3번 문장에 no one knew why(아무도 이유를 몰랐다)가 있음. 원인을 알고 있었다는 말은 반대임.","c":"F"},"h":"8678727a03"},{"n":2,"t":"tf","q":"The villagers dug up graves to look for proof.","ko":"마을 사람들은 증거를 찾으려고 무덤을 파헤쳤다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"So they dug up graves to look for proof.","그래서 그들은 증거를 찾으려고 무덤을 파헤쳤다."]],"w":"6번 문장에 So they dug up graves to look for proof가 그대로 있음. dig up(파내다)은 땅속의 것을 꺼내는 것.","c":"T"},"h":"1706a17418"},{"n":3,"t":"tf","q":"To stop vampires, villagers burned the bodies or put stakes into their hearts.","ko":"뱀파이어를 막으려고 마을 사람들은 시체를 불태우거나 심장에 말뚝을 박았다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"To stop them, villagers burned the bodies or put stakes into their hearts.","그것들을 막으려고, 마을 사람들은 시체를 불태우거나 심장에 말뚝을 박았다."]],"w":"11번 문장에 To stop them, villagers burned the bodies or put stakes into their hearts가 있음. them은 10번의 뱀파이어를 가리킴.","c":"T"},"h":"b489402693"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The villagers suspected the dead could return and harm the living.)","ko":"마을 사람들은 죽은 사람이 돌아와 산 사람을 해칠 수 있다고 ( ).","opts":["확인했다","의심했다","잊어버렸다","기뻐했다"],"word":"suspected","r":{"a":"2) 의심했다","ev":"5번 문장","s":[[5,"The villagers suspected the dead could return and harm the living.","마을 사람들은 죽은 사람이 돌아와 산 사람을 해칠 수도 있다고 의심했다."]],"w":"5번 문장의 suspect(의심하다)는 '아직 확실하지 않지만 그럴지도 모른다고 생각하다'. 이 의심 때문에 6번에서 증거를 찾으러 무덤을 팠음.","c":2},"h":"4efb51a9ca"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But even today, the idea of vampires still fascinates us.)","ko":"하지만 오늘날에도 뱀파이어라는 생각은 여전히 우리를 ( ).","opts":["두렵게 한다","지루하게 한다","속인다","매료시킨다"],"word":"fascinates","r":{"a":"4) 매료시킨다","ev":"14번 문장","s":[[14,"But even today, the idea of vampires still fascinates us.","하지만 오늘날에도 뱀파이어라는 생각은 여전히 우리를 매료시킨다."]],"w":"14번 문장의 fascinate(매료시키다)는 마음을 확 끌어당긴다는 뜻. But 뒤에 오늘날에도 여전하다고 했으니 관심이 이어진다는 방향이라, 지루하게 한다는 반대임.","c":4},"h":"c13faac667"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nTo stop them, villagers burned the bodies or put stakes into their hearts.","ko":"밑줄 친 them이(가) 가리키는 것은?","sko":"그것들을 막으려고, 마을 사람들은 시체를 불태우거나 심장에 말뚝을 박았다.","opts":["마을 사람들","시체의 머리카락과 손톱","뱀파이어(살아 있는 시체)","질병"],"r":{"a":"3) 뱀파이어(살아 있는 시체)","ev":"10~11번 문장","s":[[10,"The villagers called these “living dead” vampires.","마을 사람들은 이 “살아 있는 시체”를 뱀파이어라고 불렀다."],[11,"To stop them, villagers burned the bodies or put stakes into their hearts.","그것들을 막으려고, 마을 사람들은 시체를 불태우거나 심장에 말뚝을 박았다."]],"w":"11번 To stop them에서 them은 막으려는 대상. 바로 앞 10번에서 마을 사람들이 “살아 있는 시체”를 뱀파이어라고 불렀으니 them은 뱀파이어.","c":3},"h":"d877979c34"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The villagers suspected the dead could return and harm the living.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마을 사람들은 죽은 사람이 돌아와 산 사람을 해칠 수도 있다고 의심했다.","opts":["마을 사람들은 죽은 사람이 돌아와 산 사람을 해칠지도 모른다고 생각했다.","마을 사람들은 산 사람이 죽은 사람을 도울 수 있다고 믿었다.","마을 사람들은 죽은 사람이 다시 살아난 것을 직접 보았다.","마을 사람들은 죽은 사람을 위해 새 무덤을 만들었다."],"r":{"a":"1) 마을 사람들은 죽은 사람이 돌아와 산 사람을 해칠지도 모른다고 생각했다.","ev":"5번 문장","s":[[5,"The villagers suspected the dead could return and harm the living.","마을 사람들은 죽은 사람이 돌아와 산 사람을 해칠 수도 있다고 의심했다."]],"w":"5번의 suspected(의심했다) 뒤에 죽은 사람이 돌아와 산 사람을 해칠 수 있다는 내용이 이어짐. 2번 선지는 반대 방향이고, 3번 선지는 직접 보았다는 말이 본문에 없음(7번은 피와 머리카락, 손톱을 본 것). 4번 선지의 새 무덤 이야기는 본문에 없음.","c":1},"h":"71a7feee8e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["마을 사람들은 머리카락과 손톱이 길어지는 것이 정상적인 변화라는 것을 알고 있었다.","마을 사람들은 죽은 사람의 입 근처에서 피를 보고 죽은 사람이 다시 살아났다고 생각했다.","뱀파이어 이야기는 동유럽의 한 마을에만 머물렀다.","과학이 진실을 설명한 뒤에도 사람들은 뱀파이어가 실제라고 계속 믿었다."],"opts":["Villagers knew that hair and nails growing longer was a normal change.","Villagers saw blood near a dead person’s mouth and thought the dead had come back to life.","Vampire stories stayed only in one village in Eastern Europe.","After science explained the truth, people still believed vampires were real."],"r":{"a":"2) Villagers saw blood near a dead person’s mouth and thought the dead had come back to life.","ev":"7, 8, 9, 12, 13번 문장","s":[[7,"The villagers often saw blood near a dead person’s mouth or hair and nails that looked longer.","마을 사람들은 죽은 사람의 입 근처에 있는 피나 더 길어 보이는 머리카락과 손톱을 자주 보았다."],[8,"They didn’t know these were normal changes after death.","그들은 이것이 죽은 뒤에 나타나는 정상적인 변화라는 것을 알지 못했다."],[9,"Instead, they thought the dead had come back to life.","그 대신, 그들은 죽은 사람이 다시 살아났다고 생각했다."],[12,"These stories about vampires soon spread across Europe.","뱀파이어에 관한 이 이야기들은 곧 유럽 전역으로 퍼졌다."],[13,"Later, science explained what really happened, and people realized vampires weren’t real.","나중에 과학이 실제로 무슨 일이 있었는지 설명해 주었고, 사람들은 뱀파이어가 실제가 아니라는 것을 깨달았다."]],"w":"7번에서 입 근처의 피를 보았고, 9번에서 죽은 사람이 다시 살아났다고 생각함. 1번 선지는 8번(정상적인 변화인 줄 몰랐음)과 반대, 3번 선지는 12번(유럽 전역으로 퍼짐)과 반대, 4번 선지는 13번(과학이 설명한 뒤 가짜라는 걸 깨달음)과 반대.","c":2},"h":"001a4a1e42"},{"n":9,"t":"sum","q":"The villagers misunderstood (A) changes after death and believed that the dead had come back to (B).","ko":"마을 사람들은 죽은 뒤의 (A) 변화를 잘못 이해해서 죽은 사람이 다시 (B)했다고 믿었다.","oko":["(A) 이상한 / (B) 죽어","(A) 정상적인 / (B) 죽어","(A) 해로운 / (B) 살아나","(A) 드문 / (B) 죽어","(A) 정상적인 / (B) 살아나"],"opts":["(A) strange / (B) death","(A) normal / (B) death","(A) harmful / (B) life","(A) rare / (B) death","(A) normal / (B) life"],"r":{"a":"5) (A) normal / (B) life","ev":"7~9번 문장","s":[[7,"The villagers often saw blood near a dead person’s mouth or hair and nails that looked longer.","마을 사람들은 죽은 사람의 입 근처에 있는 피나 더 길어 보이는 머리카락과 손톱을 자주 보았다."],[8,"They didn’t know these were normal changes after death.","그들은 이것이 죽은 뒤에 나타나는 정상적인 변화라는 것을 알지 못했다."],[9,"Instead, they thought the dead had come back to life.","그 대신, 그들은 죽은 사람이 다시 살아났다고 생각했다."]],"w":"8번에서 이것들은 normal changes(정상적인 변화)였고, 9번에서 죽은 사람이 come back to life(다시 살아났다)고 생각함. 그래서 (A)는 normal, (B)는 life. (A)가 strange인 것은 8번과 반대.","c":5},"h":"b2223d27bd"},{"n":10,"t":"fill","q":"Vampire stories soon [A] across Europe, and later [B] explained what really happened.","ko":"뱀파이어 이야기는 곧 유럽 전역으로 [A]했고, 나중에 [B]이(가) 실제로 무슨 일이 있었는지 설명했다.","bko":{"fear":"두려움","spread":"퍼지다","burned":"불태웠다","science":"과학","proof":"증거","stakes":"말뚝"},"bank":["fear","spread","burned","science","proof","stakes"],"r":{"a":"[A] spread, [B] science","ev":"12~13번 문장","s":[[12,"These stories about vampires soon spread across Europe.","뱀파이어에 관한 이 이야기들은 곧 유럽 전역으로 퍼졌다."],[13,"Later, science explained what really happened, and people realized vampires weren’t real.","나중에 과학이 실제로 무슨 일이 있었는지 설명해 주었고, 사람들은 뱀파이어가 실제가 아니라는 것을 깨달았다."]],"w":"12번의 stories soon spread across Europe, 13번의 Later, science explained what really happened에서 가져옴. fear, proof, stakes는 본문 단어지만 [B]에 넣으면 '두려움이 설명했다'처럼 어색하고, burned는 이야기가 불탄다는 뜻이 되어 맞지 않음.","c":null},"h":"58174f0834"}]},{"u":9,"id":"b2-09-2","no":2,"ko":"괴물이 된 아름다운 여인, 메두사의 진짜 이야기","items":[{"n":1,"t":"tf","q":"Medusa was once a beautiful woman in Greek mythology.","ko":"그리스 신화에서 메두사는 한때 아름다운 여인이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In Greek mythology, however, she was once a beautiful woman.","그러나 그리스 신화에서 그녀는 한때 아름다운 여인이었다."]],"w":"2번 문장에 she was once a beautiful woman이 있음. 1번에서는 무서운 괴물로 알려졌지만, however 뒤에서 이야기가 반전됨.","c":"T"},"h":"ba4aa8d807"},{"n":2,"t":"tf","q":"Perseus killed Medusa by looking at her directly.","ko":"페르세우스는 메두사를 직접 쳐다보면서 죽였다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"This way, he could move close and kill her without looking at her directly.","이렇게 해서 그는 그녀를 직접 쳐다보지 않고도 가까이 다가가 그녀를 죽일 수 있었다."]],"w":"8번 문장에 he could move close and kill her without looking at her directly가 있음. 직접 쳐다보지 않고 죽였다는 내용이라 반대임.","c":"F"},"h":"e20d9af9dc"},{"n":3,"t":"tf","q":"Athena placed Medusa’s head on her shield for protection.","ko":"아테나는 보호를 위해 메두사의 머리를 자신의 방패에 달았다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Later, he gave the head to Athena, and she placed it on her shield for protection.","나중에 그는 그 머리를 아테나에게 주었고, 아테나는 그것을 보호를 위해 자신의 방패에 달았다."]],"w":"11번 문장에 she placed it on her shield for protection이 있음. it은 앞에 나온 메두사의 머리(the head).","c":"T"},"h":"c019713e66"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Athena turned her hair into snakes and gave her a deadly gaze.)","ko":"아테나는 그녀의 머리카락을 뱀으로 바꾸고 ( ) 시선을 주었다.","opts":["부드러운","슬픈","치명적인","아름다운"],"word":"deadly","r":{"a":"3) 치명적인","ev":"4~5번 문장","s":[[4,"As punishment, Athena turned her hair into snakes and gave her a deadly gaze.","벌로 아테나는 그녀의 머리카락을 뱀으로 바꾸고 치명적인 시선을 주었다."],[5,"Anyone who looked at Medusa would turn into stone.","메두사를 쳐다본 사람은 누구든 돌로 변했다."]],"w":"4번의 deadly gaze(치명적인 시선)가 무슨 뜻인지는 5번이 알려 줌. 쳐다본 사람은 누구든 돌로 변하니 목숨을 위협하는 '치명적인' 시선.","c":3},"h":"a41125a990"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He used his shiny shield like a mirror and watched her reflection.)","ko":"그는 반짝이는 방패를 거울처럼 사용해 그녀의 ( )을 지켜보았다.","opts":["비친 모습","그림자","깊은 생각","목소리"],"word":"reflection","r":{"a":"1) 비친 모습","ev":"7번 문장","s":[[7,"He used his shiny shield like a mirror and watched her reflection.","그는 반짝이는 방패를 거울처럼 사용해 그녀의 비친 모습을 지켜보았다."]],"w":"7번에서 방패를 거울처럼 썼다고 했으니 reflection은 방패 면에 비친 모습. 8번에서 직접 쳐다보지 않았다는 말과 이어짐.","c":1},"h":"18d43fb59c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nLater, he gave the head to Athena, and she placed it on her shield for protection.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"나중에 그는 그 머리를 아테나에게 주었고, 아테나는 그것을 보호를 위해 자신의 방패에 달았다.","opts":["아테나의 방패","메두사의 머리","페르세우스의 거울","아테나 여신"],"r":{"a":"2) 메두사의 머리","ev":"10~11번 문장","s":[[10,"Perseus used her head to turn enemies into stone.","페르세우스는 그녀의 머리를 이용해 적들을 돌로 변하게 했다."],[11,"Later, he gave the head to Athena, and she placed it on her shield for protection.","나중에 그는 그 머리를 아테나에게 주었고, 아테나는 그것을 보호를 위해 자신의 방패에 달았다."]],"w":"11번에서 he gave the head to Athena, and she placed it on her shield 에서 it은 앞의 the head. 10번에서 말한 메두사의 머리를 가리킴. 방패는 머리를 올려 둔 곳이라 it이 아님.","c":2},"h":"de410676c7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"From then on, Medusa’s image changed from a symbol of fear into one of strength and protection.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그때부터 메두사의 모습은 두려움의 상징에서 힘과 보호의 상징으로 바뀌었다.","opts":["그때부터 메두사는 힘의 상징에서 두려움의 상징으로 바뀌었다.","그때부터 메두사는 다시 아름다운 여인의 모습으로 돌아갔다.","그때부터 아테나는 두려움을 이기고 힘을 얻게 되었다.","그때부터 메두사는 두려움의 상징이 아니라 힘과 보호의 상징이 되었다."],"r":{"a":"4) 그때부터 메두사는 두려움의 상징이 아니라 힘과 보호의 상징이 되었다.","ev":"12번 문장","s":[[12,"From then on, Medusa’s image changed from a symbol of fear into one of strength and protection.","그때부터 메두사의 모습은 두려움의 상징에서 힘과 보호의 상징으로 바뀌었다."]],"w":"12번은 from a symbol of fear(두려움의 상징에서) into one of strength and protection(힘과 보호의 상징으로)임. 방향이 두려움 → 힘과 보호. 반대로 쓴 선지는 오답.","c":4},"h":"b72ca0980d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["페르세우스는 메두사의 시선을 피하려고 방패에 비친 메두사의 모습을 지켜보았다.","페르세우스는 칼을 사용해 메두사를 직접 쳐다보았다.","아테나는 선물로 메두사의 머리카락을 금으로 바꾸었다.","메두사의 머리는 그녀가 죽은 뒤 힘을 잃었다."],"opts":["Perseus watched Medusa’s reflection in his shield to avoid her gaze.","Perseus used a sword to look at Medusa directly.","Athena turned Medusa’s hair into gold as a gift.","Medusa’s head lost its power after she died."],"r":{"a":"1) Perseus watched Medusa’s reflection in his shield to avoid her gaze.","ev":"4, 7, 8, 9번 문장","s":[[4,"As punishment, Athena turned her hair into snakes and gave her a deadly gaze.","벌로 아테나는 그녀의 머리카락을 뱀으로 바꾸고 치명적인 시선을 주었다."],[7,"He used his shiny shield like a mirror and watched her reflection.","그는 반짝이는 방패를 거울처럼 사용해 그녀의 비친 모습을 지켜보았다."],[8,"This way, he could move close and kill her without looking at her directly.","이렇게 해서 그는 그녀를 직접 쳐다보지 않고도 가까이 다가가 그녀를 죽일 수 있었다."],[9,"Even after her death, Medusa’s power remained strong.","그녀가 죽은 뒤에도 메두사의 힘은 여전히 강했다."]],"w":"7번에서 방패를 거울처럼 써서 비친 모습을 지켜봤고, 8번에서 직접 쳐다보지 않았으니 정답. 칼로 직접 쳐다본 것(8번과 반대), 머리카락을 금으로 바꾼 것(4번은 뱀), 죽은 뒤 힘을 잃은 것(9번은 여전히 강함)은 모두 본문과 다름.","c":1},"h":"252bf152d6"},{"n":9,"t":"sum","q":"Medusa angered Athena, and as (A), Athena turned her hair into snakes and gave her a gaze that could turn people into (B).","ko":"메두사는 아테나를 화나게 했고, (A)로 아테나는 그녀의 머리카락을 뱀으로 바꾸고 사람들을 (B)로 변하게 하는 시선을 주었다.","oko":["(A) 상 / (B) 돌","(A) 벌 / (B) 뱀","(A) 벌 / (B) 돌","(A) 선물 / (B) 빛","(A) 상 / (B) 뱀"],"opts":["(A) reward / (B) stone","(A) punishment / (B) snakes","(A) punishment / (B) stone","(A) gift / (B) light","(A) reward / (B) snakes"],"r":{"a":"3) (A) punishment / (B) stone","ev":"3~5번 문장","s":[[3,"One day, she angered the goddess Athena, and everything changed.","어느 날 그녀는 여신 아테나를 화나게 했고, 모든 것이 바뀌었다."],[4,"As punishment, Athena turned her hair into snakes and gave her a deadly gaze.","벌로 아테나는 그녀의 머리카락을 뱀으로 바꾸고 치명적인 시선을 주었다."],[5,"Anyone who looked at Medusa would turn into stone.","메두사를 쳐다본 사람은 누구든 돌로 변했다."]],"w":"3번에서 메두사가 아테나를 화나게 했고, 4번 As punishment(벌로)에서 머리카락이 뱀이 됨. 5번에서 쳐다본 사람은 stone(돌)로 변함. 뱀은 머리카락이 바뀐 것이고, 사람이 변하는 것은 돌.","c":3},"h":"cfd43bb0c8"},{"n":10,"t":"fill","q":"Perseus used Medusa’s head to turn enemies into [A], and Athena placed it on her shield for [B].","ko":"페르세우스는 메두사의 머리로 적들을 [A]로 변하게 했고, 아테나는 그것을 [B]를 위해 자신의 방패에 달았다.","bko":{"gaze":"시선","protection":"보호","reflection":"비친 모습","stone":"돌","shiny":"반짝이는","directly":"직접"},"bank":["gaze","protection","reflection","stone","shiny","directly"],"r":{"a":"[A] stone, [B] protection","ev":"10~11번 문장","s":[[10,"Perseus used her head to turn enemies into stone.","페르세우스는 그녀의 머리를 이용해 적들을 돌로 변하게 했다."],[11,"Later, he gave the head to Athena, and she placed it on her shield for protection.","나중에 그는 그 머리를 아테나에게 주었고, 아테나는 그것을 보호를 위해 자신의 방패에 달았다."]],"w":"10번 Perseus used her head to turn enemies into stone, 11번 she placed it on her shield for protection에서 가져옴. gaze, reflection은 [A]나 [B]에 넣으면 뜻이 맞지 않고, shiny와 directly는 문장 구조에 맞지 않음.","c":null},"h":"1620ec065e"}]},{"u":9,"id":"b2-09-3","no":3,"ko":"발자국 하나가 만든 전설, 빅풋","items":[{"n":1,"t":"tf","q":"Bigfoot stories were known to the general public before the 1950s.","ko":"빅풋 이야기는 1950년대 이전에 일반 대중에게 알려져 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Until the 1950s, these stories stayed mostly within Native American communities.","1950년대까지 이 이야기들은 대부분 아메리카 원주민 공동체 안에만 머물렀다."]],"w":"3번 문장에 Until the 1950s, these stories stayed mostly within Native American communities가 있음. 1950년대까지는 원주민 공동체 안에만 머물렀으니 일반 대중에게 알려졌다는 말은 반대임.","c":"F"},"h":"835f0e7bcc"},{"n":2,"t":"tf","q":"A road worker in California found huge footprints in 1958.","ko":"1958년에 캘리포니아의 한 도로 공사 인부가 거대한 발자국을 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Then public interest grew sharply in 1958, when a road worker in California discovered huge footprints about 40 centimeters long.","그러다 1958년에 캘리포니아의 한 도로 공사 인부가 길이 약 40센티미터의 거대한 발자국을 발견하면서 대중의 관심이 급격히 커졌다."]],"w":"4번 문장에 in 1958, when a road worker in California discovered huge footprints가 있음. discover(발견하다)는 처음으로 찾아낸다는 뜻.","c":"T"},"h":"cfa8c91beb"},{"n":3,"t":"tf","q":"Clear evidence of Bigfoot has been found.","ko":"빅풋의 분명한 증거가 발견되었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"No clear evidence has been found yet.","아직까지 분명한 증거는 발견되지 않았다."]],"w":"11번 문장에 No clear evidence has been found yet이 있음. No가 앞에 붙어 증거가 없다는 말이므로 본문과 반대임.","c":"F"},"h":"6edfc1ab7c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But people still venture into forests to discover the truth behind the legend.)","ko":"하지만 사람들은 전설 뒤의 진실을 알아내려고 여전히 숲속으로 ( ).","opts":["위험을 무릅쓰고 들어가다","서둘러 도망치다","조용히 숨다","천천히 구경하다"],"word":"venture","r":{"a":"1) 위험을 무릅쓰고 들어가다","ev":"12번 문장","s":[[12,"But people still venture into forests to discover the truth behind the legend.","그래도 사람들은 그 전설 뒤의 진실을 알아내려고 여전히 숲속으로 모험을 떠난다."]],"w":"12번에서 증거가 없어도 사람들은 여전히 숲으로 간다고 함. venture into는 위험이나 불확실함을 무릅쓰고 들어간다는 뜻. 도망치거나 숨는다면 진실을 알아내려는 목적과 맞지 않음.","c":1},"h":"ca91e5bdbf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then public interest grew sharply in 1958.)","ko":"그러다 1958년에 대중의 관심이 ( ) 커졌다.","opts":["서서히","조금","급격하게","부드럽게"],"word":"sharply","r":{"a":"3) 급격하게","ev":"4번 문장","s":[[4,"Then public interest grew sharply in 1958, when a road worker in California discovered huge footprints about 40 centimeters long.","그러다 1958년에 캘리포니아의 한 도로 공사 인부가 길이 약 40센티미터의 거대한 발자국을 발견하면서 대중의 관심이 급격히 커졌다."]],"w":"4번에서 3번의 '1950년대까지는 원주민 공동체 안에만'과 달리 Then 1958년에 관심이 확 커졌다고 함. sharply는 갑자기 크게. 서서히나 조금은 반대 느낌.","c":3},"h":"0435c66ef4"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nPeople believed they were from a giant creature.","ko":"밑줄 친 they가 가리키는 것은?","sko":"사람들은 그 발자국이 거대한 생명체의 것이라고 믿었다.","opts":["도로 공사 인부들","거대한 발자국","산의 악마들","캘리포니아의 사람들"],"r":{"a":"2) 거대한 발자국","ev":"4~5번 문장","s":[[4,"Then public interest grew sharply in 1958, when a road worker in California discovered huge footprints about 40 centimeters long.","그러다 1958년에 캘리포니아의 한 도로 공사 인부가 길이 약 40센티미터의 거대한 발자국을 발견하면서 대중의 관심이 급격히 커졌다."],[5,"People believed they were from a giant creature.","사람들은 그 발자국이 거대한 생명체의 것이라고 믿었다."]],"w":"5번 People believed they were from a giant creature에서 they는 4번에서 인부가 발견한 huge footprints(거대한 발자국). 사람들은 그 발자국이 거대한 생명체의 것이라고 믿음.","c":2},"h":"3f6e3ad989"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But people still venture into forests to discover the truth behind the legend.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래도 사람들은 그 전설 뒤의 진실을 알아내려고 여전히 숲속으로 모험을 떠난다.","opts":["그래서 사람들은 전설이 거짓임을 알고 더 이상 숲에 가지 않는다.","사람들은 전설 속 숲을 지키려고 숲으로 들어간다.","사람들은 숲속에서 새로운 전설을 직접 만들어 내려고 한다.","그런데도 사람들은 그 전설 속에 숨은 진실을 알아내려고 여전히 숲으로 들어간다."],"r":{"a":"4) 그런데도 사람들은 그 전설 속에 숨은 진실을 알아내려고 여전히 숲으로 들어간다.","ev":"12번 문장","s":[[12,"But people still venture into forests to discover the truth behind the legend.","그래도 사람들은 그 전설 뒤의 진실을 알아내려고 여전히 숲속으로 모험을 떠난다."]],"w":"12번은 But으로 11번의 '증거가 없다'와 대조됨. 증거가 없어도 사람들은 still(여전히) 진실을 discover(알아내다)하려고 숲으로 감. 더 이상 가지 않는다는 선지는 still과 반대.","c":4},"h":"3834b18554"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["어떤 사람들은 빅풋을 보았다고 말했지만 아무도 빅풋을 잡은 적은 없다.","빅풋이라는 이름은 아메리카 원주민의 이야기에서 나왔다.","과학자들은 특수 카메라로 빅풋의 분명한 증거를 찾았다.","사람들은 빅풋을 짧은 흰 털을 가진 작은 형체로 묘사했다."],"opts":["Nobody has ever caught a Bigfoot, though some people said they saw one.","The name Bigfoot came from Native American stories.","Scientists have found clear evidence of Bigfoot with special cameras.","People described Bigfoot as a small figure with short white hair."],"r":{"a":"1) Nobody has ever caught a Bigfoot, though some people said they saw one.","ev":"6, 7, 8, 11번 문장","s":[[6,"That’s how the name “Bigfoot” was born.","그렇게 해서 “빅풋”이라는 이름이 생겨났다."],[7,"Later, some said that they saw a tall, smelly figure covered in long brown hair.","나중에 어떤 사람들은 긴 갈색 털로 덮인 키가 크고 냄새 나는 형체를 보았다고 말했다."],[8,"But no one ever caught it.","하지만 아무도 그것을 잡지는 못했다."],[11,"No clear evidence has been found yet.","아직까지 분명한 증거는 발견되지 않았다."]],"w":"7번에서 보았다고 말한 사람들이 있었고, 8번에서 아무도 그것을 잡지 못했다고 함. 2번 선지는 6번(이름은 발자국 이야기에서 생김), 3번 선지는 11번(분명한 증거는 아직 없음), 4번 선지는 7번(키가 크고 긴 갈색 털)과 어긋남.","c":1},"h":"797caccc85"},{"n":9,"t":"sum","q":"In 1958, a road worker found huge (A) in California, and people believed they were from a giant (B), so the name “Bigfoot” was born.","ko":"1958년에 한 도로 공사 인부가 캘리포니아에서 거대한 (A)을 발견했고, 사람들은 그것이 거대한 (B)의 것이라고 믿어서 “빅풋”이라는 이름이 생겼다.","oko":["(A) 카메라 / (B) 생명체","(A) 발자국 / (B) 도로","(A) 도구 / (B) 산","(A) 카메라 / (B) 인부","(A) 발자국 / (B) 생명체"],"opts":["(A) cameras / (B) creature","(A) footprints / (B) road","(A) tools / (B) mountain","(A) cameras / (B) worker","(A) footprints / (B) creature"],"r":{"a":"5) (A) footprints / (B) creature","ev":"4~6번 문장","s":[[4,"Then public interest grew sharply in 1958, when a road worker in California discovered huge footprints about 40 centimeters long.","그러다 1958년에 캘리포니아의 한 도로 공사 인부가 길이 약 40센티미터의 거대한 발자국을 발견하면서 대중의 관심이 급격히 커졌다."],[5,"People believed they were from a giant creature.","사람들은 그 발자국이 거대한 생명체의 것이라고 믿었다."],[6,"That’s how the name “Bigfoot” was born.","그렇게 해서 “빅풋”이
