<style>

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":"Amélie · 마티스의 아내","en":"Hello, everyone. My name is Amélie.","ko":"안녕하세요, 여러분. 제 이름은 Amélie입니다.","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"Welcomes to my husband’s gallery.","ko":"제 남편의 미술관에 오신 것을 환영합니다.","ok":false,"foot":["1gallery 미술관, 화랑"],"fixes":[{"wrong":"Welcomes","right":"Welcome","partial":false,"at":[0],"point":"명령문: 동사원형 Welcome으로 시작해야 함","topic":"명령문","memo":"동사원형 Welcome으로 시작해야 함"}]},{"n":3,"tag":null,"en":"Looks at me. Do you think that I’m strangely?","ko":"저를 보세요. 여러분은 제가 이상하다고 생각하세요?","ok":false,"foot":[],"fixes":[{"wrong":"Looks","right":"Look","partial":false,"at":[0],"point":"명령문은 동사원형 Look으로 시작","topic":"명령문은 동사원형 Look으로 시작","memo":""},{"wrong":"strangely","right":"strange","partial":false,"at":[8],"point":"보어 자리에는 형용사 strange 사용(부사 strangely 아님)","topic":"보어 자리에는 형용사 strange 사용(부사 strangely 아님)","memo":""}]},{"n":4,"tag":null,"en":"My husband, Henri Matisse, color my face in green.","ko":"제 남편, 앙리 마티스가 제 얼굴을 녹색으로 색칠했어요.","ok":false,"foot":[],"fixes":[{"wrong":"color","right":"colored","partial":false,"at":[4],"point":"과거시제: 문맥상 과거 사건이므로 colored 사용","topic":"과거시제","memo":"문맥상 과거 사건이므로 colored 사용"}]},{"n":5,"tag":null,"en":"Don’t worry. My face isn’t actually green.","ko":"걱정하지 마세요. 제 얼굴은 실제로 녹색이 아니에요.","ok":true,"foot":[],"fixes":[]},{"n":6,"tag":null,"en":"Why did he painted me this way then?","ko":"그러면 왜 그는 저를 이런 식으로 칠했을까요?","ok":false,"foot":[],"fixes":[{"wrong":"painted","right":"paint","partial":false,"at":[3],"point":"조동사 did 뒤에는 동사원형 paint 사용","topic":"조동사 did 뒤에는 동사원형 paint 사용","memo":""}]},{"n":7,"tag":null,"en":"He wanted expressing his emotions with bright and wild colors.","ko":"그는 밝고 거친 색으로 그의 감정을 표현하기를 원했거든요.","ok":false,"foot":[],"fixes":[{"wrong":"expressing","right":"to express","partial":false,"at":[2],"point":"to부정사의 명사적 용법: wanted의 목적어로 to express 사용(동명사 아님)","topic":"to부정사의 명사적 용법","memo":"wanted의 목적어로 to express 사용"}]},{"n":8,"tag":null,"en":"People doesn’t like these painting style at fi 을 녹색으로 색칠했어요.",0],["Don’t worry.","걱정하지 마세요.",0],["My face isn’t actually green.","제 얼굴은 실제로 녹색이 아니에요.",0],["Why did he paint me this way then?","그러면 왜 그는 저를 이런 식으로 칠했을까요?",0],["He wanted to express his emotions with bright and wild colors.","그는 밝고 거친 색으로 그의 감정을 표현하기를 원했거든요.",0],["People didn’t like this painting style at first.","사람들은 처음에 이 그림 스타일을 좋아하지 않았어요.",0],["Some people thought that a beast painted me.","어떤 사람들은 야수가 저를 그렸다고 생각했죠.",0],["So, he got the nickname Wild Beast.","그래서 그는 ‘야수’라는 별명을 얻었어요.",0],["He kept his own style and finally became famous.","그는 자신만의 스타일을 지켰고 마침내 유명해졌어요.",0],["Hi, there.","안녕하세요.",1],["Can you find me in the picture?","여러분은 그림에서 저를 찾을 수 있나요?",0],["Actually, I’m an animal.","사실, 저는 동물이에요.",0],["Start from the green shape in the middle.","가운데에 있는 녹색 모양부터 시작하세요.",0],["Then trace the other shapes with your finger.","그런 다음, 여러분의 손가락으로 다른 모양들을 따라가세요.",0],["They look like a snail shell.","그것들은 달팽이 껍데기처럼 생겼어요.",0],["Yes, I’m a snail!","네, 저는 달팽이예요!",0],["Matisse created me in a unique way.","마티스는 저를 독특한 방식으로 창조했어요.",0],["He painted paper and cut out shapes with scissors.","그는 종이를 색칠하고 가위로 모양들을 오려 냈어요.",0],["Then he put the shapes together and made me.","그런 다음, 그는 그 모양들을 합쳐서 저를 만들었어요.",0],["At the age of 70, Matisse got very sick.","70세의 나이에, 마티스는 매우 아팠어요.",0],["However, he never gave up art.","하지만 그는 예술을 결코 포기하지 않았어요.",0],["He created a new art form.","그는 새로운 예술 형식을 만들었어요.",0],["It’s cut-outs.","그것은 종이 오리기(cut-outs)예요.",0],["Do you want to find more artworks like me?","여러분은 저와 같은 예술 작품을 더 찾아보고 싶으신가요?",0],["Look around the gallery and explore Henri Matisse’s world of art!","미술관을 둘러보며 앙리 마티스의 예술 세계를 탐험해 보세요!",0]];var RNUM=60;var TITLE_EN="Pictures Talk About the Artist!";var PASS_EN=["Pictures Talk About the Artist!","Hello, everyone. My name is Amélie. Welcome to my husband’s gallery. Look at me. Do you think that I’m strange? My husband, Henri Matisse, colored my face in green. Don’t worry. My face isn’t actually green. Why did he paint me function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}

   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
