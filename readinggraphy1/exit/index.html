 어느 지점까지 달려갔다가, 다음 사람을 위해 의상을 벗었어요."]],"w":"5번 문장의 silly costumes는 웃기고 바보 같아 보이는 의상. 뒤에 나오는 치킨 의상(6번)과 이어서 생각하면 쉬움.","c":2},"h":"c3a2f9a4e1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (I tripped over the chicken feet.)","ko":"저는 치킨 발에 (   ).","opts":["~을 닦았다","~을 던졌다","~을 벗었다","~에 발이 걸려 넘어졌다"],"word":"tripped","r":{"a":"4) ~에 발이 걸려 넘어졌다","ev":"7번 문장","s":[[7,"As I started running, I tripped over the chicken feet.","제가 달리기 시작했을 때, 저는 치킨 발에 걸려 넘어졌어요."]],"w":"tripped는 trip(발이 걸려 넘어지다)의 과거형. 바로 뒤 8번에서 진흙 웅덩이에 빠졌으니 ‘넘어졌다’가 맞음. 벗었다는 take off(5번)와 구별.","c":4},"h":"7bbd152cca"},{"n":6,"t":"ref","q":"What does the underlined \"you\" refer to?\nDear Mom and Dad, I hope you’re doing well.","ko":"밑줄 친 you가 가리키는 것은?","sko":"사랑하는 엄마 아빠께, 두 분이 잘 지내고 계시길 바라요.","opts":["엄마와 아빠","친구들","캠프 선생님","글쓴이 자신"],"pron":"you","r":{"a":"1) 엄마와 아빠","ev":"1번 문장","s":[[1,"Dear Mom and Dad, I hope you’re doing well.","사랑하는 엄마 아빠께, 두 분이 잘 지내고 계시길 바라요."]],"w":"1번은 Dear Mom and Dad로 시작하는 편지이고, you는 편지를 받는 사람인 엄마와 아빠를 가리킨다.","c":1,"k":"you = 엄마와 아빠"},"h":"f7dee0ec58"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"I miss you both and can’t wait to tell you more fun stories when I get home.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"두 분 모두 보고 싶고, 집에 돌아가서 더 많은 재미있는 이야기들을 들려드릴 것이 기대돼요.","opts":["두 분이 캠프에 오셔서 이야기를 들려주시면 좋겠다.","집에 돌아가도 두 분께 재미있는 이야기는 하지 않을 것이다.","두 분이 보고 싶고, 집에 가서 더 많은 재미있는 이야기를 들려드릴 날이 기다려진다.","두 분이 보고 싶지만, 집에 가면 할 이야기가 없을까 봐 걱정된다."],"r":{"a":"3) 두 분이 보고 싶고, 집에 가서 더 많은 재미있는 이야기를 들려드릴 날이 기다려진다.","ev":"14번 문장","s":[[14,"I miss you both and can’t wait to tell you more fun stories when I get home.","두 분 모두 보고 싶고, 집에 돌아가서 더 많은 재미있는 이야기들을 들려드릴 것이 기대돼요."]],"w":"miss는 ‘그리워하다’, can’t wait to는 ‘몹시 기다려진다’. 이야기를 들려줄 사람은 Lisa이고, 하고 싶은 마음이 크다는 뜻.","c":3},"h":"cc061b4d1f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["The writer’s camp had a costume relay race.","The writer’s camp had a swimming contest.","The writer’s camp had a singing contest.","The writer’s camp had a cooking class."],"oko":["글쓴이의 캠프에서는 코스튬 릴레이 경주가 있었다.","글쓴이의 캠프에서는 수영 대회가 있었다.","글쓴이의 캠프에서는 노래 대회가 있었다.","글쓴이의 캠프에서는 요리 수업이 있었다."],"r":{"a":"1) The writer’s camp had a costume relay race. (글쓴이의 캠프에서는 코스튬 릴레이 경주가 있었다.)","ev":"4번 문장","s":[[4,"We had a costume relay race.","우리는 코스튬 릴레이 경주를 했어요."]],"w":"4번 We had a costume relay race(우리는 코스튬 릴레이 경주를 했어요)에서 가져옴. 나머지는 본문에 없는 활동이다.","c":1},"h":"89408d5cdc"},{"n":9,"t":"sum","q":"Camp has been really (A), and the writer made lots of (B) friends.","ko":"캠프는 정말 (A)고, 글쓴이는 (B) 친구들을 많이 사귀었다.","opts":["(A) great / (B) new","(A) great / (B) old","(A) boring / (B) new","(A) boring / (B) old","(A) scary / (B) new"],"oko":["(A) 좋 / (B) 새로운","(A) 좋 / (B) 오래된","(A) 지루 / (B) 새로운","(A) 지루 / (B) 오래된","(A) 무서 / (B) 새로운"],"r":{"a":"1) (A) great / (B) new ((A) 좋 / (B) 새로운)","ev":"13번 문장","s":[[13,"Camp has been really great, and I made lots of new friends.","캠프는 정말 좋았고, 저는 새로운 친구들을 많이 사귀었어요."]],"w":"13번 Camp has been really great, and I made lots of new friends(캠프는 정말 좋았고 새로운 친구들을 많이 사귀었다)에서 가져옴.","c":1},"h":"0cfd7bbb60"},{"n":10,"t":"fill","q":"I fell into a [A] mud puddle! Everyone [B] a lot, including me.","ko":"저는 [A] 진흙 웅덩이에 빠졌어요! 모두들 저를 포함해서 많이 [B].","bank":["big","laughed","chicken","camp","joke","letter"],"bko":{"big":"큰","laughed":"웃었다 (laugh의 과거)","chicken":"치킨, 닭","camp":"캠프","joke":"농담","letter":"편지"},"r":{"a":"[A] big (큰), [B] laughed (웃었다 (laugh의 과거))","ev":"8~9번 문장","s":[[8,"I fell into a big mud puddle!","저는 큰 진흙 웅덩이에 빠졌어요!"],[9,"Everyone laughed a lot, including me.","모두들 저를 포함해서 많이 웃었어요."]],"w":"8~9번 I fell into a big mud puddle! Everyone laughed a lot, including me(큰 진흙 웅덩이에 빠졌고, 모두들 많이 웃었다)에서 가져옴. 나머지는 명사라 mud puddle을 꾸미는 말이나 동사 자리에 맞지 않는다.","c":null},"h":"db31cbb491"}]},{"u":7,"id":"rg1-07-3","no":3,"ko":"고대 이집트 사람들은 왜 눈 주위를 까맣게 칠했을까?","items":[{"n":1,"t":"tf","q":"Both men and women in Ancient Egypt drew thick black lines around their eyes.","ko":"고대 이집트의 남자와 여자는 모두 눈 주위에 두꺼운 검은 선을 그렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Both men and women drew thick black lines around their eyes.","남녀 모두 눈 주위에 두꺼운 검은 선을 그렸다."]],"w":"3번 문장에 Both men and women drew thick black lines around their eyes가 그대로 나옴. drew는 draw(그리다)의 과거형.","c":"T"},"h":"07a84f7e6c"},{"n":2,"t":"tf","q":"People in Ancient Egypt used kohl only to look good.","ko":"고대 이집트 사람들은 오직 멋져 보이기 위해서만 kohl을 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"They didn’t do this just to look good.","그들은 단지 멋져 보이기 위해 이렇게 한 것이 아니었다."],[5,"It was mostly for their eye health.","그것은 주로 그들의 눈 건강을 위한 것이었다."]],"w":"4번에서 They didn’t do this just to look good(단지 멋져 보이려고 한 것이 아님), 5번에서 주로 눈 건강을 위한 것이라고 함. ‘오직 멋 때문’이라는 말은 본문과 반대.","c":"F"},"h":"6083c2c2d3"},{"n":3,"t":"tf","q":"Zinc oxide in kohl is a powerful natural sunblock.","ko":"kohl에 든 산화아연은 강력한 천연 자외선 차단제이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"One is zinc oxide, a powerful natural sunblock.","하나는 강력한 천연 자외선 차단제인 산화아연이다."]],"w":"10번 문장에 One is zinc oxide, a powerful natural sunblock이 나옴. One은 9번의 special ingredients(특별한 성분) 중 하나.","c":"T"},"h":"a67178c42b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the bright sun and the dusty desert wind.)","ko":"…밝은 햇빛과 dusty 사막 바람.","opts":["얼음처럼 찬","먼지투성이의","촉촉한","어두운"],"word":"dusty","r":{"a":"2) 먼지투성이의","ev":"6번 문장","s":[[6,"The makeup protected their eyes from the bright sun and the dusty desert wind.","그 화장품은 밝은 햇빛과 먼지투성이의 사막 바람으로부터 그들의 눈을 보호해 주었다."]],"w":"dusty는 dust(먼지)에서 온 말로 ‘먼지가 많은’. 사막 바람이 눈에 해롭다는 7번 내용과 이어짐.","c":2},"h":"094900aed6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It helps fight harmful germs.)","ko":"그것은 harmful 세균과 싸우는 데 도움을 준다.","opts":["도움이 되는","귀중한","해로운","특별한"],"word":"harmful","r":{"a":"3) 해로운","ev":"12번 문장","s":[[12,"It helps fight harmful germs.","그것은 유해한 세균과 싸우는 데 도움을 준다."]],"w":"harmful은 ‘해로운’. 세균(germs)은 몸에 해로우니 neem이 그것과 싸운다는 문맥. 도움이 되는 것은 neem 쪽 설명.","c":3},"h":"b2fa332c34"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nNow we know it really helped!","ko":"밑줄 친 it이 가리키는 것은?","sko":"이제 우리는 그것이 정말 도움이 되었다는 것을 안다!","opts":["kohl","눈병","사막 바람","고대 이집트 사람들"],"r":{"a":"1) kohl","ev":"13~14번 문장","s":[[13,"People back then believed kohl was magical.","그 당시 사람들은 kohl이 마법 같다고 믿었다."],[14,"Now we know it really helped!","이제 우리는 그것이 정말 도움이 되었다는 것을 안다!"]],"w":"13번에서 사람들이 kohl이 마법 같다고 믿었다고 했고, 14번에서 이제 그것(kohl)이 정말 도움이 되었다는 것을 안다고 함.","c":1,"k":"it = kohl"},"pron":"it","h":"90991879a0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"People back then believed kohl was magical.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 당시 사람들은 kohl이 마법 같다고 믿었다.","opts":["그 당시 사람들은 kohl에 신비한 힘이 있다고 믿었다.","그 당시 사람들은 kohl이 위험하다고 믿었다.","그 당시 사람들은 kohl을 만드는 방법을 몰랐다.","그 당시 사람들은 kohl이 값싸다고 믿었다."],"r":{"a":"1) 그 당시 사람들은 kohl에 신비한 힘이 있다고 믿었다.","ev":"13번 문장","s":[[13,"People back then believed kohl was magical.","그 당시 사람들은 kohl이 마법 같다고 믿었다."]],"w":"believed kohl was magical은 ‘kohl이 마법 같다고 믿었다’는 뜻이라 신비한 힘이 있다고 믿었다는 선지가 맞음.","c":1},"h":"ebfe1f125e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Kohl은 고대 이집트의 음식의 한 종류였다.","Kohl은 고대 이집트의 화장품의 한 종류였다.","Kohl은 몇 년 전에 처음 사용되었다.","Kohl은 고대 이집트의 음료의 한 종류였다."],"opts":["Kohl was a kind of food in Ancient Egypt.","Kohl was a kind of makeup in Ancient Egypt.","Kohl was first used a few years ago.","Kohl was a kind of drink in Ancient Egypt."],"r":{"a":"2) Kohl was a kind of makeup in Ancient Egypt. (Kohl은 고대 이집트의 화장품의 한 종류였다.)","ev":"1~2번 문장","s":[[1,"Did you know that people used eyeliner a long time ago?","여러분은 사람들이 아주 오래 전부터 아이라이너를 사용했다는 것을 알고 있었는가?"],[2,"In Ancient Egypt, people used makeup called kohl.","고대 이집트에서 사람들은 kohl이라고 불리는 화장품을 사용했다."]],"w":"2번에서 고대 이집트 사람들이 kohl이라고 불리는 화장품(makeup)을 사용했다고 함. 1번에서 아주 오래 전부터 사용했다고 했으므로 몇 년 전이 아님.","c":2},"h":"a580ebdc83"},{"n":9,"t":"sum","q":"Kohl had special (A) that kept the eyes safe from the sun, the wind, and eye (B).","ko":"kohl에는 햇빛과 바람, 그리고 눈 (B)으로부터 눈을 지켜 주는 특별한 (A)이(가) 있었다.","oko":["(A) 성분 / (B) 질병","(A) 성분 / (B) 선","(A) 색 / (B) 질병","(A) 색 / (B) 선","(A) 이름 / (B) 질병"],"opts":["(A) ingredients / (B) diseases","(A) ingredients / (B) lines","(A) colors / (B) diseases","(A) colors / (B) lines","(A) names / (B) diseases"],"r":{"a":"1) (A) ingredients / (B) diseases","ev":"6~7번, 9번 문장","s":[[6,"The makeup protected their eyes from the bright sun and the dusty desert wind.","그 화장품은 밝은 햇빛과 먼지투성이의 사막 바람으로부터 그들의 눈을 보호해 주었다."],[7,"These things could hurt their eyes or give them eye diseases.","이런 것들은 그들의 눈을 아프게 하거나 눈병을 일으킬 수 있었다."],[9,"Recent studies showed that kohl had special ingredients.","최근의 연구에서 kohl에는 특별한 성분이 있었다는 것이 밝혀졌다."]],"w":"9번에서 kohl에는 특별한 성분(ingredients)이 있었고, 6~7번에서 kohl이 햇빛과 사막 바람으로부터 눈을 보호해 눈병(eye diseases)을 막아 준다고 함.","c":1},"h":"0462608482"},{"n":10,"t":"fill","q":"The Egyptians used kohl mainly for their eye [A], because it [B] their eyes from the bright sun and the dusty wind.","ko":"이집트 사람들은 주로 눈 [A]을(를) 위해 kohl을 사용했는데, 그것이 밝은 햇빛과 먼지투성이 바람으로부터 눈을 [B] 때문이다.","bko":{"health":"건강","protected":"보호했다","culture":"문화","fashion":"패션","hurt":"아프게 했다","dusty":"먼지투성이의"},"bank":["health","protected","culture","fashion","hurt","dusty"],"r":{"a":"[A] health, [B] protected","ev":"5~6번 문장","s":[[5,"It was mostly for their eye health.","그것은 주로 그들의 눈 건강을 위한 것이었다."],[6,"The makeup protected their eyes from the bright sun and the dusty desert wind.","그 화장품은 밝은 햇빛과 먼지투성이의 사막 바람으로부터 그들의 눈을 보호해 주었다."]],"w":"5번 It was mostly for their eye health, 6번 The makeup protected their eyes from the bright sun…에서 가져옴. hurt는 눈을 아프게 하는 것이 햇빛·바람(7번)이라 kohl의 일이 아님.","c":null},"h":"27e1522eb7"}]},{"u":8,"id":"rg1-08-1","no":1,"ko":"앞다리가 구부러진 아기 기린, 다시 걸을 수 있을까?","items":[{"n":1,"t":"tf","q":"Msituni’s front legs were bending the wrong way.","ko":"Msituni의 앞다리는 잘못된 방향으로 구부러져 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Her front legs were bending the wrong way.","그녀의 앞다리가 잘못된 방향으로 구부러져 있었다."]],"w":"3번 문장에 Her front legs were bending the wrong way가 그대로 나옴. Her는 1번의 baby giraffe Msituni.","c":"T"},"h":"2f65d3e70d"},{"n":2,"t":"tf","q":"Dr. Ara had worked with giraffes before.","ko":"Ara 박사는 전에 기린과 일해 본 적이 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"But he never worked with a giraffe before.","하지만 그는 이전에 기린과 작업해 본 적이 한 번도 없었다."]],"w":"7번에서 he never worked with a giraffe before(기린과 일한 적이 한 번도 없다)고 함. 경험이 많았던 것은 사람용 교정기(6번).","c":"F"},"h":"7bb00e6a37"},{"n":3,"t":"tf","q":"After two months, Msituni still needed the braces to walk.","ko":"두 달 후에도 Msituni는 걷기 위해 여전히 교정기가 필요했다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"But after two months, she could walk by herself without them.","그러나 두 달 후에, 그녀는 그것 없이 혼자서 걸을 수 있었다."]],"w":"13번에서 after two months, she could walk by herself without them(교정기 없이 혼자 걸을 수 있었다)이라고 함. 두 달 뒤에는 교정기가 필요 없어졌다.","c":"F"},"h":"b7f009610f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Dr. Ara had lots of experience in making braces for people.)","ko":"Ara 박사는 사람들을 위한 교정기를 만드는 데 많은 experience가 있었다.","opts":["실수","경험","용기","시간"],"word":"experience","r":{"a":"2) 경험","ev":"6번 문장","s":[[6,"Dr. Ara had lots of experience in making braces for people.","Ara 박사는 사람들을 위한 교정기를 만드는 데 많은 경험이 있었다."]],"w":"lots of experience in making braces는 교정기를 많이 만들어 본 경험이 있다는 뜻. 바로 뒤 7번 But he never worked with a giraffe와 대조됨.","c":2},"h":"cef54f9b21"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Dr. Ara studied all about giraffes.)","ko":"Ara 박사는 기린에 대한 모든 것을 (   ).","opts":["그렸다","무시했다","조사했다, 공부했다","팔았다"],"word":"studied","r":{"a":"3) 조사했다, 공부했다","ev":"10번 문장","s":[[10,"To help Msituni, Dr. Ara studied all about giraffes.","Msituni를 돕기 위해, Ara 박사는 기린에 대한 모든 것을 조사했다."]],"w":"studied는 study(조사하다, 공부하다)의 과거형. 기린은 처음이라(7번) 먼저 기린에 대해 알아본 것. 그다음 11번에서 교정기를 만듦.","c":3},"h":"b7706a1243"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nNow, she loves to run and play with her giraffe friends.","ko":"밑줄 친 she가 가리키는 것은?","sko":"이제 그녀는 기린 친구들과 함께 뛰고 노는 것을 아주 좋아한다.","opts":["Msituni","Ara 박사","사육사","Msituni의 엄마"],"r":{"a":"1) Msituni","ev":"14번 문장","s":[[14,"Now, she loves to run and play with her giraffe friends.","이제 그녀는 기린 친구들과 함께 뛰고 노는 것을 아주 좋아한다."]],"w":"이 이야기에서 기린은 Msituni이고, 14번에서 그녀(she)가 기린 친구들과 뛰고 논다고 함. Ara 박사는 남자(he)로 나옴.","c":1,"k":"she = Msituni"},"pron":"she","h":"4f65bcb48a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So making her braces was a big job for Dr. Ara.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 그녀의 교정기를 만드는 것은 Ara 박사에게 힘든 작업이었다.","opts":["그녀의 교정기를 만드는 일은 Ara 박사에게 쉬운 일이었다.","Ara 박사는 더 큰 일을 맡겨 달라고 부탁했다.","Ara 박사가 만든 교정기는 아주 컸다.","그래서 그녀의 교정기를 만드는 일은 Ara 박사에게 힘든 작업이었다."],"r":{"a":"4) 그래서 그녀의 교정기를 만드는 일은 Ara 박사에게 힘든 작업이었다.","ev":"8~9번 문장","s":[[8,"Msituni was getting taller every day.","Msituni는 매일 키가 점점 더 커지고 있었다."],[9,"So making her braces was a big job for Dr. Ara.","그래서 그녀의 교정기를 만드는 것은 Ara 박사에게 힘든 작업이었다."]],"w":"a big job은 ‘큰 일, 힘든 작업’. 8번에서 Msituni가 매일 자라고 있었고 7번에서 기린 작업이 처음이라 힘들었다는 흐름. 쉬운 일이라는 선지는 정반대.","c":4},"h":"6d819793d3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Msituni는 처음에 다른 기린들처럼 걸을 수 있었다.","Msituni는 다른 기린들처럼 서거나 걸을 수 없었다.","Msituni는 다른 기린들보다 더 빨리 달릴 수 있었다.","Msituni는 설 수는 있었지만 먹을 수는 없었다."],"opts":["Msituni could walk like other giraffes at first.","Msituni could not stand or walk like other giraffes.","Msituni could run faster than other giraffes.","Msituni could stand but could not eat."],"r":{"a":"2) Msituni could not stand or walk like other giraffes. (Msituni는 다른 기린들처럼 서거나 걸을 수 없었다.)","ev":"4번 문장","s":[[4,"This meant she couldn’t stand or walk like other giraffes.","이는 그녀가 다른 기린들처럼 서거나 걷지 못한다는 것을 의미했다."]],"w":"4번에서 이는 그녀가 다른 기린들처럼 서거나 걷지 못한다는 것을 의미했다(couldn’t stand or walk like other giraffes)고 함.","c":2},"h":"9d1839ea54"},{"n":9,"t":"sum","q":"Msituni had a big (A), so the (B) asked Dr. Ara for help.","ko":"Msituni에게는 큰 (A)이(가) 있었고, 그래서 (B)이(가) Ara 박사에게 도움을 요청했다.","oko":["(A) 문제 / (B) 사육사들","(A) 문제 / (B) 가수들","(A) 선물 / (B) 사육사들","(A) 선물 / (B) 가수들","(A) 파티 / (B) 가수들"],"opts":["(A) problem / (B) zookeepers","(A) problem / (B) singers","(A) present / (B) zookeepers","(A) present / (B) singers","(A) party / (B) singers"],"r":{"a":"1) (A) problem / (B) zookeepers","ev":"2번, 5번 문장","s":[[2,"But she had a big problem.","하지만 그녀에게는 큰 문제가 있었다."],[5,"So the zookeepers asked Dr. Ara to make special braces for Msituni.","그래서 사육사들은 Ara 박사에게 Msituni를 위해 특별한 교정기를 만들어 달라고 부탁했다."]],"w":"2번에서 Msituni에게 큰 문제(a big problem)가 있었고, 5번에서 사육사들(zookeepers)이 Ara 박사에게 특별한 교정기를 만들어 달라고 부탁했음.","c":1},"h":"77e94e7032"},{"n":10,"t":"fill","q":"There was a [A] giraffe named Msituni at the San Diego [B] Safari Park.","ko":"샌디에이고 [B] 사파리 파크에는 Msituni라는 이름의 [A] 기린이 있었다.","bko":{"baby":"아기","Zoo":"동물원","braces":"교정기","legs":"다리들","job":"일, 작업","walk":"걷다"},"bank":["baby","Zoo","braces","legs","job","walk"],"r":{"a":"[A] baby (아기), [B] Zoo (동물원)","ev":"1번 문장","s":[[1,"There was a baby giraffe named Msituni at the San Diego Zoo Safari Park.","샌디에이고 동물원 사파리 파크에는 Msituni라는 이름의 아기 기린이 있었다."]],"w":"1번 문장에서 가져옴. braces(교정기)·legs(다리들)·job(일)은 명사지만 이 자리에 맞지 않고, walk(걷다)는 동사라 들어갈 수 없음.","c":null},"h":"163a18b647"}]},{"u":8,"id":"rg1-08-2","no":2,"ko":"두 번의 큰 불, 그런데 오히려 기회가 됐다고?","items":[{"n":1,"t":"tf","q":"Ole opened his own shop in 1916.","ko":"Ole은 1916년에 자신의 가게를 열었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"He loved making things out of wood, so he opened his own shop in 1916.","그는 나무로 물건을 만드는 것을 아주 좋아해서 1916년에 자신의 가게를 열었다."]],"w":"2번 문장에 he opened his own shop in 1916이 그대로 나옴. opened는 open(열다)의 과거형.","c":"T"},"h":"ab447df752"},{"n":2,"t":"tf","q":"Ole gave up making toys after the second fire.","ko":"Ole은 두 번째 화재 후에 장난감 만들기를 포기했다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"In 1942, another fire burned down his factory.","1942년에, 또 다른 화재가 그의 공장을 태워 버렸다."],[10,"But Ole didn’t let this stop him.","하지만 Ole은 이것이 그를 멈추게 두지 않았다."]],"w":"9번에서 두 번째 화재가 났지만, 10번에서 But Ole didn’t let this stop him(이것이 그를 멈추게 두지 않았다)이라고 함. 포기했다는 말은 본문과 반대.","c":"F"},"h":"47759e0fe5"},{"n":3,"t":"tf","q":"Ole bought a machine to make plastic toys because plastic was less expensive.","ko":"플라스틱이 덜 비쌌기 때문에 Ole은 플라스틱 장난감을 만들 기계를 샀다.","r":{"a":"T (본문과 맞는 내용)","ev":"11~12번 문장","s":[[11,"Around this time, people started using plastic because it was less expensive.","이 시기쯤, 사람들은 플라스틱이 덜 비싸서 그것을 사용하기 시작했다."],[12,"So in 1946, Ole bought a machine to make toys out of plastic.","그래서 1946년에, Ole은 플라스틱으로 장난감을 만들기 위해 기계를 구입했다."]],"w":"11번에서 플라스틱이 less expensive(덜 비싼)여서 사람들이 쓰기 시작했고, 12번에서 So(그래서) Ole이 플라스틱 장난감을 만들 기계를 샀다고 이어짐.","c":"T"},"h":"d3fa8a82b6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 1924, a big fire destroyed his shop.)","ko":"1924년에, 큰 화재가 그의 가게를 destroyed.","opts":["지었다","파괴했다","칠했다","팔았다"],"word":"destroyed","r":{"a":"2) 파괴했다","ev":"4번 문장","s":[[4,"In 1924, a big fire destroyed his shop.","1924년에, 큰 화재가 그의 가게를 파괴했다."]],"w":"destroyed는 destroy(파괴하다)의 과거형. 4번에서 가게가 불에 파괴됐고, 5번 But 뒤에서 Ole이 더 큰 작업실을 지은 것과 대조됨.","c":2},"h":"4807bd1a81"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…because it was less expensive.)","ko":"…그것이 덜 (   ) 때문에.","opts":["유명한","가벼운","오래된","비싼"],"word":"expensive","r":{"a":"4) 비싼","ev":"11번 문장","s":[[11,"Around this time, people started using plastic because it was less expensive.","이 시기쯤, 사람들은 플라스틱이 덜 비싸서 그것을 사용하기 시작했다."]],"w":"less expensive는 ‘덜 비싼’. 사람들이 플라스틱을 쓰기 시작한 이유가 값이 덜 비싸서라는 문맥. 가볍다는 말은 본문에 없음.","c":4},"h":"72a7184ab8"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt looked a lot like a modern LEGO brick.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 현대의 레고 블록과 매우 비슷해 보였다.","opts":["Ole의 첫 번째 플라스틱 장난감","Ole의 새 기계","Ole의 가게","덴마크의 가구"],"r":{"a":"1) Ole의 첫 번째 플라스틱 장난감","ev":"13~14번 문장","s":[[13,"He made his first plastic toy in 1949.","그는 1949년에 첫 번째 플라스틱 장난감을 만들었다."],[14,"It looked a lot like a modern LEGO brick.","그것은 현대의 레고 블록과 매우 비슷해 보였다."]],"w":"13번에서 Ole이 1949년에 첫 번째 플라스틱 장난감을 만들었고, 14번의 It은 그 장난감이 현대 레고 블록과 비슷해 보였다는 뜻.","c":1,"k":"It = Ole의 첫 번째 플라스틱 장난감"},"pron":"It","h":"8df0baa77d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s how the famous LEGO bricks started!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그렇게 그 유명한 레고 블록이 시작된 것이다!","opts":["이런 과정을 거쳐 그 유명한 레고 블록이 생겨났다.","그 후로 레고 블록은 사라지고 말았다.","레고 블록은 그 이전부터 이미 유명했다.","이것은 레고 블록을 파는 방법이다."],"r":{"a":"1) 이런 과정을 거쳐 그 유명한 레고 블록이 생겨났다.","ev":"15번 문장","s":[[15,"That’s how the famous LEGO bricks started!","그렇게 그 유명한 레고 블록이 시작된 것이다!"]],"w":"That’s how ~는 ‘그렇게 해서 ~가 (시작)된 것이다’라는 뜻. 앞의 이야기가 레고 블록의 시작이었다는 마무리 문장.","c":1},"h":"399dc0cf3a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Ole은 1924년에 자신의 가게를 열었다.","Ole은 첫 번째 화재 전에 플라스틱 장난감을 만들었다.","Ole은 1946년에 첫 번째 플라스틱 장난감을 만들었다.","Ole이 나무 장난감을 만들기 시작한 뒤 그의 장난감은 큰 성공을 거두었다."],"opts":["Ole opened his shop in 1924.","Ole made plastic toys before the first fire.","Ole made his first plastic toy in 1946.","Ole’s toys became a big hit after he began making wooden toys."],"r":{"a":"4) Ole’s toys became a big hit after he began making wooden toys.","ev":"2번, 6번, 8번, 12~13번 문장","s":[[2,"He loved making things out of wood, so he opened his own shop in 1916.","그는 나무로 물건을 만드는 것을 아주 좋아해서 1916년에 자신의 가게를 열었다."],[6,"He built a bigger workshop and began making wooden toys.","그는 더 큰 작업실을 짓고 나무로 된 장난감을 만들기 시작했다."],[8,"Soon, his toys were a big hit.","곧, 그의 장난감은 큰 성공을 거두었다."],[12,"So in 1946, Ole bought a machine to make toys out of plastic.","그래서 1946년에, Ole은 플라스틱으로 장난감을 만들기 위해 기계를 구입했다."],[13,"He made his first plastic toy in 1949.","그는 1949년에 첫 번째 플라스틱 장난감을 만들었다."]],"w":"6번 나무 장난감을 만들기 시작하고 8번에서 곧 큰 성공을 거두었다는 내용과 일치. 가게는 1916년(2번)에 열었고, 기계를 산 것은 1946년이며 첫 플라스틱 장난감은 1949년(12~13번).","c":4},"h":"c45afd8134"},{"n":9,"t":"sum","q":"Ole saw the fire as a new (A), and he built a bigger (B).","ko":"Ole은 화재를 새로운 (A)(으)로 보았고, 더 큰 (B) n":"it","h":"3efca24771"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He learned that things might break, but they can be fixed and become even better.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 물건이 깨질 수도 있지만, 그것들은 고쳐질 수 있고 훨씬 더 나아질 수도 있다는 것을 배웠다.","opts":["물건은 한번 깨지면 다시 쓸 수 없다는 것을 배웠다.","물건이 깨지지 않도록 조심해야 한다는 것을 배웠다.","새 물건을 사는 것이 고치는 것보다 낫다는 것을 배웠다.","물건은 깨질 수 있지만 고쳐서 더 좋아질 수도 있다는 것을 배웠다."],"r":{"a":"4) 물건은 깨질 수 있지만 고쳐서 더 좋아질 수도 있다는 것을 배웠다.","ev":"12번 문장","s":[[12,"He learned that things might break, but they can be fixed and become even better.","그는 물건이 깨질 수도 있지만, 그것들은 고쳐질 수 있고 훨씬 더 나아질 수도 있다는 것을 배웠다."]],"w":"might break는 ‘깨질 수도 있다’, but 뒤의 can be fixed and become even better는 ‘고쳐질 수 있고 훨씬 더 나아질 수 있다’. 한번 깨지면 끝이라는 선지는 정반대.","c":4},"h":"a710304317"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Noah와 그의 아빠는 새로운 도시로 이사 갔다.","Noah와 그의 엄마는 새로운 도시로 이사 갔다.","Noah와 그의 엄마는 오래된 집으로 이사 갔다.","Noah와 그의 친구는 바다로 이사 갔다."],"opts":["Noah and his dad moved to a new city.","Noah and his mom moved to a new city.","Noah and his mom moved to an old house.","Noah and his friend moved to the sea."],"r":{"a":"2) Noah and his mom moved to a new city. (Noah와 그의 엄마는 새로운 도시로 이사 갔다.)","ev":"1번 문장","s":[[1,"Noah and his mom moved to a new city, but he felt sad and missed his old life.","Noah와 그의 엄마는 새로운 도시로 이사 갔지만, 그는 슬펐고 예전의 삶을 그리워했다."]],"w":"1번에서 Noah와 그의 엄마(his mom)가 새로운 도시로 이사 갔다고 함.","c":2},"h":"d214649038"},{"n":9,"t":"sum","q":"Noah felt really (A) about the broken bowl, but after the repair it felt like a new (B) for him.","ko":"Noah는 깨진 그릇 때문에 정말 (A) 기분이었지만, 수리 후에는 그에게 새로운 (B)처럼 느껴졌다.","oko":["(A) 속상한 / (B) 시작","(A) 속상한 / (B) 끝","(A) 좋은 / (B) 시작","(A) 좋은 / (B) 끝","(A) 행복한 / (B) 끝"],"opts":["(A) bad / (B) start","(A) bad / (B) end","(A) good / (B) start","(A) good / (B) end","(A) happy / (B) end"],"r":{"a":"1) (A) bad / (B) start","ev":"3번, 11번 문장","s":[[3,"He felt really bad about it.","그는 그 일에 대해 정말 속상했다."],[11,"It felt like a new start for Noah.","그것은 Noah에게 새로운 시작처럼 느껴졌다."]],"w":"3번에서 Noah가 그 일에 정말 속상했다(felt really bad)고 했고, 11번에서 수리된 그릇이 Noah에게 새로운 시작(a new start)처럼 느껴졌다고 함.","c":1},"h":"6f11aba959"},{"n":10,"t":"fill","q":"Mr. Sato [A] the broken [B] together.","ko":"Sato 씨는 깨진 [B]을(를) 함께 [A].","bko":{"glued":"붙였다(glue의 과거)","pieces":"조각들","besides":"게다가","without":"~없이","learned":"배웠다(learn의 과거)","happen":"일어나다"},"bank":["glued","pieces","besides","without","learned","happen"],"r":{"a":"[A] glued (붙였다), [B] pieces (조각들)","ev":"7번 문장","s":[[7,"Mr. Sato showed him how to fix the bowl: Mr. Sato glued the broken pieces together.","Sato 씨는 그에게 그릇을 고치는 방법을 보여주었다. Sato 씨는 깨진 조각들을 붙였다."]],"w":"7번 문장 Mr. Sato glued the broken pieces together에서 가져옴. glued는 glue(붙이다)의 과거형, pieces는 piece(조각)의 복수형.","c":null},"h":"865840740c"}]},{"u":9,"id":"rg1-09-1","no":1,"ko":"냄새는 지독해도 맛있다는 아이슬란드의 국민 음식","items":[{"n":1,"t":"tf","q":"Hákarl is made from the Greenland shark.","ko":"하우카르는 그린란드 상어로 만들어진다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It’s made from the Greenland shark.","그것은 그린란드 상어로 만들어진다."]],"w":"2번 문장에 It’s made from the Greenland shark가 나옴. It은 1번의 Hákarl.","c":"T"},"h":"82710065f4"},{"n":2,"t":"tf","q":"People can eat the shark meat right away without any problem.","ko":"사람들은 상어 고기를 아무 문제 없이 바로 먹을 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"But if you eat the shark meat right away, it can make you feel sick.","하지만 상어 고기를 바로 먹으면, 그것은 여러분을 아프게 만들 수 있다."],[4,"The shark has harmful things in its body.","그 상어의 몸에는 해로운 것들이 있다."]],"w":"3번에서 바로 먹으면 아프게 만들 수 있다고 하고, 4번에서 상어 몸에 해로운 것들이 있다고 함. 그래서 바로 먹지 않는다.","c":"F"},"h":"737f9343ef"},{"n":3,"t":"tf","q":"Some people love Hákarl, and some people don’t.","ko":"어떤 사람들은 하우카르를 아주 좋아하고, 어떤 사람들은 그렇지 않다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Because of this, some people love it, and some don’t.","이 때문에, 어떤 사람들은 그것을 아주 좋아하고, 어떤 사람들은 그렇지 않다."]],"w":"11번 문장에 some people love it, and some don’t가 그대로 나옴. 냄새가 강한 것(10번) 때문에 호불호가 갈림.","c":"T"},"h":"077feb11c9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The shark has harmful things in its body.)","ko":"그 상어의 몸에는 harmful 것들이 있다.","opts":["귀한","해로운","맛있는","차가운"],"word":"harmful","r":{"a":"2) 해로운","ev":"4번 문장","s":[[4,"The shark has harmful things in its body.","그 상어의 몸에는 해로운 것들이 있다."]],"w":"3번에서 바로 먹으면 아프게 만든다고 했으니, 4번의 harmful things는 몸에 해로운 것들. 6번에서 그것을 없앤다고 함.","c":2},"h":"ac3c96e121"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This helps remove the harmful things.)","ko":"이것은 해로운 것들을 remove 데 도움이 된다.","opts":["섞다","기르다","모으다","없애다"],"word":"remove","r":{"a":"4) 없애다","ev":"6번 문장","s":[[6,"This helps remove the harmful things.","이것은 해로운 것들을 없애는 데 도움이 된다."]],"w":"remove는 ‘없애다, 제거하다’. 5번의 발효하고 말리는 방법이 해로운 것을 없앤다는 흐름. 해로운 것을 모으거나 기른다면 문장이 맞지 않음.","c":4},"h":"5e5cfce634"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThey’re proud of it and love their tradition.","ko":"밑줄 친 \"it\"이 가리키는 것은?","sko":"그들은 그것을 자랑스러워하고 그들의 전통을 사랑한다.","opts":["그린란드 상어","아이슬란드","하우카르","아이슬란드의 전통 놀이"],"r":{"a":"3) 하우카르","ev":"12~13번 문장","s":[[12,"Although it smells strong, Hákarl is a very special food for Icelanders.","비록 그것이 냄새가 강하긴 하지만, 하우카르는 아이슬란드 사람들에게 매우 특별한 음식이다."],[13,"They’re proud of it and love their tradition.","그들은 그것을 자랑스러워하고 그들의 전통을 사랑한다."]],"w":"12번에서 하우카르가 아이슬란드 사람들에게 아주 특별한 음식이라고 했고, 13번에서 그들이 그것(it = Hákarl)을 자랑스러워한다고 이어짐.","c":3,"k":"it = 하우카르"},"pron":"it","h":"98ff63558f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Some people say Hákarl smells like ammonia.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"어떤 사람들은 하우카르가 암모니아 같은 냄새가 난다고 말한다.","opts":["어떤 사람들은 하우카르에서 암모니아 같은 냄새가 난다고 말한다.","모든 사람이 하우카르가 암모니아로 만들어진다고 말한다.","어떤 사람들은 암모니아 때문에 하우카르를 먹지 않는다고 말한다.","어떤 사람들은 하우카르에서 꽃 냄새가 난다고 말한다."],"r":{"a":"1) 어떤 사람들은 하우카르에서 암모니아 같은 냄새가 난다고 말한다.","ev":"10번 문장","s":[[10,"Some people say Hákarl smells like ammonia.","어떤 사람들은 하우카르가 암모니아 같은 냄새가 난다고 말한다."]],"w":"smells like  day while they are in the sea.","ko":"코끼리바다물범은 바다에 있는 동안 하루에 약 2시간만 잔다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"But they sleep only about two hours a day during this time.","하지만 그들은 이 기간 동안 하루에 약 2시간만 잠을 잔다."]],"w":"2번 문장에 they sleep only about two hours a day during this time이 나옴. this time은 1번의 바다에서 보내는 약 7개월.","c":"T"},"h":"47fd4fbc8c"},{"n":2,"t":"tf","q":"Elephant seals take their dive naps near the surface of the sea.","ko":"코끼리바다물범은 바다 수면 근처에서 다이빙 낮잠을 잔다.","r":{"a":"F (본문과 다른 내용)","ev":"5번, 8번 문장","s":[[5,"They close their eyes and dive deep into the ocean.","그들은 눈을 감고 바닷속 깊이 잠수한다."],[8,"That’s because sharks and killer whales usually stay near the surface.","그것은 상어와 범고래가 보통 수면 근처에 머무르기 때문이다."]],"w":"5번에서 바닷속 깊이 잠수해서 잔다고 하고, 8번에서 수면 근처에 머무는 것은 상어와 범고래라고 함. 그래서 수면 근처에서 자는 것이 아님.","c":"F"},"h":"d915a15fc1"},{"n":3,"t":"tf","q":"Elephant seals begin to sink in a spiral in the second stage of sleep.","ko":"코끼리바다물범은 수면의 두 번째 단계에서 나선형으로 가라앉기 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10~11번 문장","s":[[10,"They then turn upside down as they go into the second stage of sleep.","그러고 나서 그들은 수면의 두 번째 단계에 들어갈 때 몸을 거꾸로 뒤집는다."],[11,"In this stage, they can’t move and begin to sink down in a spiral.","이 단계에서, 그들은 움직일 수 없고 나선형으로 가라앉기 시작한다."]],"w":"10번에서 두 번째 단계에 들어가며 거꾸로 뒤집히고, 11번에서 이 단계에 움직일 수 없고 나선형으로 가라앉기 시작한다고 함.","c":"T"},"h":"a46e851d5d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They close their eyes and dive deep into the ocean.)","ko":"그들은 눈을 감고 바닷속 깊이 dive 한다.","opts":["올라가다","잠수하다","도망치다","날다"],"word":"dive","r":{"a":"2) 잠수하다","ev":"5번 문장","s":[[5,"They close their eyes and dive deep into the ocean.","그들은 눈을 감고 바닷속 깊이 잠수한다."]],"w":"dive deep into the ocean은 ‘바닷속 깊이 들어가다’. 4번의 dive naps도 잠수해서 자는 낮잠. 올라가는 것은 12번의 swim to the surface.","c":2},"h":"33292b6906"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…sharks and killer whales usually stay near the surface.)","ko":"…상어와 범고래가 보통 surface 근처에 머무른다.","opts":["바닥","동굴","그림자","수면, 표면"],"word":"surface","r":{"a":"4) 수면, 표면","ev":"8번 문장","s":[[8,"That’s because sharks and killer whales usually stay near the surface.","그것은 상어와 범고래가 보통 수면 근처에 머무르기 때문이다."]],"w":"상어와 범고래는 수면 근처에 있어서, 깊이 잠수한 코끼리바다물범은 안전하다는 흐름. 12번에서도 먹이를 찾으러 the surface로 올라감.","c":4},"h":"f8f82cc147"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThese dive naps keep them safe.","ko":"밑줄 친 \"them\"이 가리키는 것은?","sko":"이 다이빙 낮잠은 그들을 안전하게 지켜 준다.","opts":["코끼리바다물범","상어와 범고래","다이빙 낮잠","먹이"],"r":{"a":"1) 코끼리바다물범","ev":"4번, 7번 문장","s":[[4,"To rest, they take “dive naps.”","쉬기 위해, 그들은 ‘다이빙 낮잠’을 잔다."],[7,"These dive naps keep them safe.","이 다이빙 낮잠은 그들을 안전하게 지켜 준다."]],"w":"4번에서 다이빙 낮잠을 자는 주체는 코끼리바다물범(they)이고, 7번은 그 낮잠이 코끼리바다물범을 안전하게 지켜 준다는 내용. 상어와 범고래는 8번에서 위험 요소로 나옴.","c":1,"k":"them = 코끼리바다물범"},"pron":"them","h":"8895c94592"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"And they don’t sleep all at once.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그리고 그들은 한꺼번에 잠을 자지 않는다.","opts":["그들은 잠을 한꺼번에 몰아서 자지 않는다.","그들은 잠을 한꺼번에 몰아서 잔다.","그들은 전혀 잠을 자지 않는다.","그들은 한꺼번에 많이 먹지 않는다."],"r":{"a":"1) 그들은 잠을 한꺼번에 몰아서 자지 않는다.","ev":"3번 문장","s":[[3,"And they don’t sleep all at once.","그리고 그들은 한꺼번에 잠을 자지 않는다."]],"w":"all at once는 ‘한꺼번에’라는 뜻이라 don’t sleep all at once는 한꺼번에 몰아서 자지 않는다는 뜻. 2번 문장에서 하루에 약 2시간만 자므로 전혀 안 자는 것은 아님.","c":1},"h":"7d2480b24f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["코끼리바다물범은 한꺼번에 몇 시간 동안 잠을 잔다.","짧은 낮잠 후에 코끼리바다물범은 먹이를 찾으러 수면으로 헤엄쳐 간다.","코끼리바다물범은 한 시간이 넘는 낮잠을 잔다.","코끼리바다물범은 1년에 약 2개월을 바다에서 보낸다."],"opts":["Elephant seals sleep for several hours all at once.","After a short nap, elephant seals swim to the surface to find food.","Elephant seals take naps for more than an hour.","Elephant seals stay in the sea for about two months a year."],"r":{"a":"2) After a short nap, elephant seals swim to the surface to find food.","ev":"1번, 3번, 6번, 12번 문장","s":[[1,"Elephant seals spend about 7 months of the year in the sea.","코끼리바다물범은 1년 중 약 7개월을 바다에서 보낸다."],[3,"And they don’t sleep all at once.","그리고 그들은 한꺼번에 잠을 자지 않는다."],[6,"There, they take short naps for less than 20 minutes.","그곳에서, 그들은 20분 미만의 짧은 낮잠을 잔다."],[12,"After their short nap, they swim to the surface to find food.","짧은 낮잠 후에, 그들은 먹이를 찾기 위해 수면으로 헤엄쳐 간다."]],"w":"12번에서 짧은 낮잠 후 먹이를 찾으러 수면으로 헤엄친다고 함. 한꺼번에 자지 않고(3번), 낮잠은 20분 미만이며(6번), 바다에서 약 7개월을 보낸다(1번).","c":2},"h":"f781c5ee50"},{"n":9,"t":"sum","q":"To (A), elephant seals take dive naps for (B) than 20 minutes.","ko":"코끼리바다물범은 (A) 위해 20분 (B) 다이빙 낮잠을 잔다.","oko":["(A) 쉬기 / (B) 미만","(A) 쉬기 / (B) 이상","(A) 놀기 / (B) 미만","(A) 놀기 / (B) 이상","(A) 먹기 / (B) 이상"],"opts":["(A) rest / (B) less","(A) rest / (B) more","(A) play / (B) less","(A) play / (B) more","(A) eat / (B) more"],"r":{"a":"1) (A) rest / (B) less","ev":"4번, 6번 문장","s":[[4,"To rest, they take “dive naps.”","쉬기 위해, 그들은 ‘다이빙 낮잠’을 잔다."],[6,"There, they take short naps for less than 20 minutes.","그곳에서, 그들은 20분 미만의 짧은 낮잠을 잔다."]],"w":"4번에서 쉬기 위해(To rest) ‘다이빙 낮잠’을 잔다고 했고, 6번에서 20분 미만(less than 20 minutes)의 짧은 낮잠이라고 함.","c":1},"h":"1af095b7c8"},{"n":10,"t":"fill","q":"During their dive naps, elephant seals [A] a deep sleep with their bodies [B] up.","ko":"다이빙 낮잠 중에, 코끼리바다물범은 몸을 [B] 세운 채 깊은 잠에 [A].","bko":{"enter":"들어가다","straight":"똑바로, 수직으로","usually":"보통","only":"오직","turn":"돌다, 뒤집다","sink":"가라앉다"},"bank":["enter","straight","usually","only","turn","sink"],"r":{"a":"[A] enter (들어가다), [B] straight (똑바로, 수직으로)","ev":"9번 문장","s":[[9,"During their dive naps, elephant seals enter a deep sleep with their bodies straight up.","다이빙 낮잠 중에, 코끼리바다물범들은 몸을 수직으로 세운 채 깊은 잠에 들어간다."]],"w":"9번 문장 elephant seals enter a deep sleep with their bodies straight up에서 가져옴. turn·sink도 동사지만 a deep sleep 앞에 쓰면 뜻이 맞지 않고, usually·only는 부사라 이 자리에 맞지 않음.","c":null},"h":"77e4480d08"}]},{"u":10,"id":"rg1-10-1","no":1,"ko":"실패한 제품만 모아 둔 박물관이 있다고?","items":[{"n":1,"t":"tf","q":"The Museum of Failure started in Sweden in 2017.","ko":"실패 박물관은 2017년 스웨덴에서 시작되었다.","r":{"ev":"3번 문장","s":[[3,"The museum started in Sweden in 2017 and traveled around the world.","그 박물관은 2017년 스웨덴에서 시작되어 전 세계를 돌아다녔다."]],"w":"3번 문장에 The museum started in Sweden in 2017이 그대로 나온다. 스웨덴, 2017년 모두 본문과 같다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"c76a1ab7a1"},{"n":2,"t":"tf","q":"Big companies like Coca-Cola and Pepsi never made mistakes.","ko":"코카콜라와 펩시 같은 대기업들은 절대 실수를 하지 않았다.","r":{"ev":"8~9번 문장","s":[[8,"He says that even big companies like Coca-Cola and Pepsi made mistakes.","그는 코카콜라와 펩시 같은 대기업조차도 실수를 했다고 말한다."],[9,"But they learned and improved.","하지만 그들은 배우고 개선했다."]],"w":"8번 문장에서 대기업조차도 실수를 했다(made mistakes)고 하고, 9번에서 그들은 배우고 개선했다고 한다. never made mistakes는 본문과 반대이다.","c":"F","a":"F (본문과 다른 내용)"},"h":"500e035970"},{"n":3,"t":"tf","q":"Samuel West thinks we learn from our mistakes.","ko":"Samuel West는 우리가 실수로부터 배운다고 생각한다.","r":{"ev":"7번 문장","s":[[7,"He thinks we learn from our mistakes.","그는 우리가 실수로부터 배운다고 생각한다."]],"w":"7번 문장 He thinks we learn from our mistakes와 같은 내용이다. He는 6번의 Samuel West이다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"7bb737d069"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But they learned and improved.)","ko":"밑줄 친 단어의 뜻은? (하지만 그들은 배웠고 ...)","opts":["더 나빠졌다","나아졌다","사라졌다","포기했다"],"word":"improved","r":{"ev":"9번 문장","s":[[9,"But they learned and improved.","하지만 그들은 배우고 개선했다."]],"w":"9번에서 대기업들이 실수를 하고도 배웠으니(learned) 그 결과 나아졌다는 뜻이다. improve = 나아지다, 개선하다. 12번의 become better와 같은 뜻.","c":2,"a":"2) 나아졌다"},"h":"20e49e5d88"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Samuel’s message is clear.)","ko":"밑줄 친 단어의 뜻은? (Samuel의 메시지는 ...)","opts":["비밀의","재미있는","명확한","위험한"],"word":"clear","r":{"ev":"12번 문장","s":[[12,"Samuel’s message is clear: making mistakes is just a way to become better.","Samuel의 메시지는 명확하다. 실수를 하는 것은 더 나아지게 되는 하나의 방법일 뿐이다."]],"w":"12번에서 clear 뒤 콜론(:)으로 메시지의 내용이 바로 이어진다. 분명하게 말한 메시지라는 뜻이므로 clear = 명확한, 분명한.","c":3,"a":"3) 명확한"},"h":"d1b11363ce"},{"n":6,"t":"ref","opts":[ function navBar(){var d=document.createElement("div");d.className="nav";d.appendChild(lnk("홈으로","../",true));d.appendChild(lnk("Exit test 목록","./"));return d}
function testHead(p){var d=document.createElement("div");d.className="top";
  var k=document.createElement("span");k.className="tk";k.textContent="EXIT TEST";d.appendChild(k);
  var h=document.createElement("h1");h.textContent=secName(p.u)+" · "+readName(p);d.appendChild(h);
  var s=document.createElement("p");s.className="sub";s.textContent=p.ko;d.appendChild(s);return d}

var cur=null,ans={},done={};
var LAB={tf:"T / F",vocab:"어휘",ref:"지칭",sense:"문장 이해",match:"내용 일치",sum:"요약문 (A)(B)",fill:"요약문 완성"};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function pr(){return P.filter(function(p){return p.id===cur})[0]}
function answered(p,it){var a=(ans[p.id]||{})[it.n];if(it.t==="fill")return a&&a[0]&&a[1];return a!=null&&a!==""}
function setAns(p,it,v){ans[p.id]=ans[p.id]||{};ans[p.id][it.n]=v}
function view(){var p=pr(),v=document.getElementById("view");v.innerHTML="";var fin=!!done[p.id];v.appendChild(testHead(p));
 if(fin){var d0=done[p.id],pass=d0.s*10>=70,wr0=p.items.filter(function(it){return !d0.ok[it.n]}).map(function(it){return it.n});var bn=el("div","banner "+(pass?"pass":"fail"));bn.id="bn";bn.appendChild(el("span","vd",pass?"PASS":"FAIL"));bn.appendChild(el("span","sc",(d0.s*10)+"점 ("+d0.s+" / 10)"));bn.appendChild(el("span","wr",wr0.length?"틀린 문항: "+wr0.join(", ")+"번":"전 문항 정답"));bn.appendChild(el("span","rule",pass?"70점 이상 통과":"70점 미만: 클래스카드 추가학습을 하세요."));bn.appendChild(navBar());v.appendChild(bn)}
 var box=el("div",fin?"locked":"");
 p.items.forEach(function(it){
  var q=el("section","q");var h=el("div","qh");h.appendChild(el("span","qn",it.n));h.appendChild(el("span",null,LAB[it.t]));var okm=fin?done[p.id].ok[it.n]:null;if(fin){h.appendChild(el("span","mk "+(okm?"o1":"x1"),okm?"O":"X"));if(!okm)q.className+=" wrong"}q.appendChild(h);
  var qt=el("p","qt");
  if(it.t==="fill"){var parts=it.q.split(/(\[A\]|\[B\])/);parts.forEach(function(s){if(s==="[A]"||s==="[B]"){var k=s==="[A]"?0:1;var sel=el("select");var o0=el("option",null,s);o0.value="";sel.appendChild(o0);it.bank.forEach(function(w){var o=el("option",null,w);o.value=w;sel.appendChild(o)});var cu=(ans[p.id]||{})[it.n];if(cu&&cu[k])sel.value=cu[k];sel.onchange=function(){var c=((ans[p.id]||{})[it.n]||["",""]).slice();c[k]=sel.value;setAns(p,it,c);foot()};qt.appendChild(sel)}else qt.appendChild(document.createTextNode(s))});q.appendChild(qt)}
  else{if(it.t==="vocab"&&it.word){qt.innerHTML=esc(it.q).replace(esc(it.word),"<b>"+esc(it.word)+"</b>")}else qt.textContent=it.q;q.appendChild(qt)}
  if(it.t==="tf"){var g=el("div","tf");["T","F"].forEach(function(x){var b=el("button","o",x);b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===x));b.onclick=function(){setAns(p,it,x);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.opts){var g=el("div","opts");it.opts.forEach(function(t,i){var b=el("button","o");b.innerHTML="<i>"+(i+1)+"</i><span></span>";b.lastChild.textContent=t;b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===i+1));b.onclick=function(){setAns(p,it,i+1);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.t==="fill"){q.appendChild(el("p","bank","보기: "+it.bank.join(" / ")))}
  if(fin){var pk=(ans[p.id]||{})[it.n];if(it.t==="tf"){Array.prototype.forEach.call(q.querySelector(".tf").children,function(b){var v=b.textContent;if(v===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(v===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}else if(it.opts){Array.prototype.forEach.call(q.querySelector(".opts").children,function(b,i){if(i+1===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(i+1===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}}
  if(fin&&it.r){var rv=el("div","rv");
   var z1=el("div","zone z-tr");z1.appendChild(el("h4",null,"한글 해석"));
   function ln(l,t){var p2=el("p","ln");p2.appendChild(el("b",null,l));p2.appendChild(document.createTextNode(t));z1.appendChild(p2)}
   if(it.ko)ln("문제",it.ko);if(it.sko)ln("문장",it.sko);
   if(it.oko){var ol=el("ol");it.oko.forEach(function(x){ol.appendChild(el("li",null,x))});var lb=el("p","ln");lb.appendChild(el("b",null,"선택지"));z1.appendChild(lb);z1.appendChild(ol)}
   if(it.bko){var bl=el("p","ln");bl.appendChild(el("b",null,"보기 단어"));bl.appendChild(document.createTextNode(it.bank.map(function(w){return w+" "+(it.bko[w]||"")}).join(" / ")));z1.appendChild(bl)}
   if(z1.children.length>1)rv.appendChild(z1);
   var z2=el("div","zone z-an");z2.appendChild(el("h4",null,"정답 · 해설"));z2.appendChild(el("p","ra","정답: "+it.r.a));z2.appendChild(el("div","rl","교재 근거 ("+it.r.ev+")"));it.r.s.forEach(function(x){var d=el("div","rs");var e=el("span","en");e.appendChild(el("span","sn",x[0]+"번"));e.appendChild(document.createTextNode(x[1]));d.appendChild(e);d.appendChild(el("span","ko",x[2]));z2.appendChild(d)});z2.appendChild(el("div","rl","정리"));z2.appendChild(el("p","rw",it.r.w));rv.appendChild(z2);if(okm){rv.style.display="none";var tg=el("button","tgl","해설 보기");tg.onclick=function(){var s=rv.style.display==="none";rv.style.display=s?"block":"none";tg.textContent=s?"해설 닫기":"해설 보기"};q.appendChild(tg)}q.appendChild(rv)}
  box.appendChild(q)});
 v.appendChild(box);
 var sb=el("div","sbar");sb.id="sbar";v.appendChild(sb);foot();
 if(fin)showScore(p)}
function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
function showScore(p){var sb=document.getElementById("sbar");sb.innerHTML="";var d=done[p.id];var c=el("div","score");c.appendChild(el("span",null,readName(p)+" 점수"));c.appendChild(el("b",null,(d.s*10)+"점"));c.appendChild(el("span",null,d.s+" / 10 문항"));sb.style.display="block";sb.appendChild(c);sb.appendChild(navBar())}
boot();

function picker(){var v=document.getElementById("view");v.innerHTML="";
  var t=document.createElement("div");t.className="top";
  t.innerHTML='<span class="tk">EXIT TEST</span><h1></h1><p class="sub">Reading별 10문항</p>';t.querySelector("h1").textContent=document.title.replace(/ Exit Test$/,"");v.appendChild(t);
  var last=null;
  P.forEach(function(p){
    if(p.u!==last){last=p.u;var g=document.createElement("div");g.className="grp";g.textContent=secName(p.u);v.appendChild(g)}
    var ok=ready(p.id);
    var r=document.createElement(ok?"a":"div");r.className="pk"+(ok?"":" lk");if(ok)r.href="?r="+encodeURIComponent(p.id);
    var l=document.createElement("div");var b=document.createElement("b");b.textContent=readName(p);var s=document.createElement("span");s.className="t";s.textContent=p.ko;l.appendChild(b);l.appendChild(s);r.appendChild(l);
    if(!ok){var st=document.createElement("span");st.className="st";st.textContent="잠김";r.appendChild(st)}v.appendChild(r)});
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("홈으로","../",true));v.appendChild(n)}
function gate(p){var v=document.getElementById("view");v.innerHTML="";v.appendChild(testHead(p));
  var g=document.createElement("div");g.className="gate";g.innerHTML="<b>아직 응시할 수 없어요</b><p>지문 읽기와 문제 선지를 모두 마친 뒤에 열려요.</p>";v.appendChild(g);
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("이 Reading으로 돌아가기","../?r="+encodeURIComponent(p.id),true));n.appendChild(lnk("Exit test 목록","./"));v.appendChild(n)}
function boot(){var m=/[?&]r=([^&]+)/.exec(location.search);
  if(m){var id=decodeURIComponent(m[1]);var p=P.filter(function(x){return x.id===id})[0];
    if(p){cur=id;if(!ready(id)){gate(p);return}view();return}}
  picker()}

</script>
