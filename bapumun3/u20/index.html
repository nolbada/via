11", "step": 3, "no": 11, "qtype": "유형 02 원급과 비교급을 이용한 최상급 표현", "type": "write", "ans": "(A) the most important (B) more important than any other", "concept": ["036-4", "036", "034"], "gap": "", "words": [["important", "중요한"], ["friendship", "우정"]], "h1": "(A)는 '가장 중요한 것'이라는 최상급을 쓰고, (B)는 '다른 어떤 것보다 더 중요한'이라는 비교급을 이용한 최상급 표현을 써요. 두 곳 모두 important를 사용하세요.", "h2": "important는 긴 단어라서 최상급은 the most, 비교급은 more를 붙여요. (B)는 뒤에 단수 명사 thing이 있으니 any other를 쓰는 틀이에요.", "why": "(A) the most important thing(가장 중요한 것), (B) more important than any other thing(다른 어떤 것보다 더 중요한)이에요. (B)는 비교급 + than any other + 단수 명사 틀이에요.", "opts": [], "pencil": "(A) the ___ important, (B) more important than any other thing", "pencilKey": "most", "page": 205, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "유형 02 원급과 비교급을 이용한 최상급 표현", "type": "write", "ans": "Is he the best singer? [또는 Does he sing best?]", "concept": ["036-2", "036", "006"], "gap": "", "words": [["singer", "가수"], ["best", "가장 잘"]], "h1": "B의 대답이 Yes, nobody can sing better than him.이에요. '아무도 그보다 노래를 더 잘할 수 없다'는 그가 가장 잘한다는 뜻이니 알맞은 질문을 만들어 보세요.", "h2": "<보기>처럼 Is she the best cook?의 형태를 따라 써 보세요. 부사의 최상급 best로도 질문할 수 있어요. 주어는 he예요.", "why": "Is he the best singer?(그가 가장 노래를 잘하는 가수니?) 또는 Does he sing best?(그가 노래를 가장 잘하니?)가 알맞아요. 대답의 nobody can sing better than him은 '그가 가장 잘한다'는 뜻이에요.", "opts": [], "pencil": "'가장 ~한 사람이니?'는 Is he the ___ + 명사 ?", "pencilKey": "best", "page": 205, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "유형 02 원급과 비교급을 이용한 최상급 표현", "type": "write", "ans": "Is water the most necessary for them?", "concept": ["036-3", "036", "034"], "gap": "", "words": [["necessary", "필요한"], ["water", "물"]], "h1": "B의 대답이 Yes, nothing is more necessary for them than water.예요. '그들에게 물보다 더 필요한 것은 없다'는 물이 가장 필요하다는 뜻이에요.", "h2": "질문은 be동사 의문문으로 만들어요. necessary(필요한)는 긴 단어라서 최상급은 the most를 앞에 붙여요.", "why": "Is water the most necessary for them?(그들에게 물이 가장 필요하니?)예요. 대답의 nothing is more necessary than water가 물이 가장 필요하다는 뜻이에요.", "opts": [], "pencil": "긴 단어의 최상급은 the ___ + 원급", "pencilKey": "most", "page": 205, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "유형 02 원급과 비교급을 이용한 최상급 표현", "type": "write", "ans": "Nothing can please her as much as this song.", "concept": ["036-2", "036", "033"], "gap": "", "words": [["please", "기쁘게 하다"], ["song", "노래"], ["much", "많이"]], "h1": "'아무것도 이 노래만큼 그녀를 기쁘게 할 수는 없다'에서 주어는 Nothing이에요. 주어진 말로 부정주어 문장을 만드세요.", "h2": "「Nothing + can + 동사원형 + 목적어 + as + 원급 + as ~」 순서예요. please(기쁘게 하다) 뒤에 her, 그다음 as much as를 써요.", "why": "Nothing can please her as much as this song.(아무것도 이 노래만큼 그녀를 기쁘게 할 수 없다.)예요. 부정주어 + as + 원급(much) + as가 최상급 뜻이에요.", "opts": [], "pencil": "Nothing can + 동사원형 ~ as + 원급 + ___", "pencilKey": "as", "page": 205, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "유형 02 원급과 비교급을 이용한 최상급 표현", "type": "write", "ans": "He is kinder than any other boy at school.", "concept": ["036-4", "036", "034"], "gap": "", "words": [["kind", "친절한"], ["boy", "소년"], ["at school", "학교에서"]], "h1": "'그는 학교에서 다른 어떤 소년보다 더 친절하다'는 문장이에요. 앞 글에서 Harry가 학교에서 가장 인기 있다고 했어요. kind와 at school을 이용하세요.", "h2": "「비교급 + than any other + 단수 명사」 틀이에요. kind(친절한)는 짧은 단어라서 -er을 붙이고, any other 뒤의 명사는 단수예요.", "why": "He is kinder than any other boy at school.(그는 학교에서 다른 어떤 소년보다 더 친절하다.)예요. 비교급 kinder + than any other + 단수 명사 boy예요.", "opts": [], "pencil": "비교급 than any other + ___ 명사", "pencilKey": "단수", "page": 205, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "유형 01 최상급 비교", "type": "mc", "ans": "⑤", "concept": ["036", "032", "057"], "gap": "", "words": [["miserable", "비참한"], ["terrible", "끔찍한"], ["happen", "일어나다"]], "h1": "'나는 의사에게서 ___ 소식을 들었다. 그것은 나에게 일어났던 가장 ___ 일이었다'라는 흐름이에요. 이야기 분위기가 좋은 쪽인지 나쁜 쪽인지 먼저 정하세요.", "h2": "ⓒ는 that 뒤에서 '지금까지 일어났던 것 중'을 말해요. 이야기가 과거(was)로 시작하니, 그보다 먼저 일어난 일을 말하는 시제가 어울려요.", "why": "I got the worst news from the doctor.(나는 의사에게서 최악의 소식을 들었다.) That was the most miserable thing that had ever happened to me.(그것은 나   h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
