<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비단챌 보충</title>
<style>
:root{--bg:#f1efe9;--panel:#fff;--ink:#1f1d1a;--mute:#5d584f;--soft:#8a847a;--line:#e0dbd0;--accent:#2f4858;--bad:#c0392b;--good:#2e7d32;
--S:#fff08a;--V:#ffb3ae;--O:#a9e6a4;--C:#9fd3f2;--MA:#d5bbff;--MB:#ffcf8f;--CJ:#dcdcdc;--font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding:18px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer}
.shell{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;font-weight:900;margin:0}h2{font-size:15px;font-weight:800;margin:6px 0 0;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{background:var(--panel);border:0;border-radius:14px;padding:18px 14px;text-align:left;font-weight:800;font-size:17px;border-left:6px solid var(--c,#888)}
.big small{display:block;font-weight:500;font-size:12px;color:var(--soft);margin-top:2px}
.wide{grid-column:1/-1}
.card{background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.no{font-size:12px;font-weight:800;color:var(--soft)}
.sent{font-size:19px;line-height:1.5;font-weight:600;overflow-wrap:anywhere}
.ch{display:inline-block;margin:0 3px 8px 0;text-align:center;vertical-align:top;max-width:100%}
.ch .t{display:inline-block;padding:2px 6px;border-radius:4px;background:#ecebe6}
.ch .l{display:block;margin-top:2px;line-height:1.25}
.ch .g{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.ch .r{display:block;font-size:11.5px;color:var(--mute)}
.ch .r small{font-size:10px;color:var(--soft);opacity:.8}
.k-S{background:var(--S)!important}.k-V{background:var(--V)!important}.k-O{background:var(--O)!important}.k-C{background:var(--C)!important}.k-MA{background:var(--MA)!important}.k-MB{background:var(--MB)!important}.k-CJ{background:var(--CJ)!important}
.ko{color:var(--mute);font-size:14px}
.wm{font-size:12.5px;color:var(--soft)}
.note{font-size:13px;background:#f4efe3;border-radius:8px;padding:8px 10px}
.sub{font-size:13px;color:var(--mute);border-left:3px solid var(--line);padding-left:8px}
.anc{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.anc b{font-weight:800;color:var(--ink)}
.anc .x{padding:1px 6px;border-radius:4px;color:#2a2a2a}
.legend{display:flex;gap:6px;flex-wrap:wrap}.legend span{font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px;color:#2a2a2a}
.nav,.btnrow{display:flex;gap:10px}
.pri{flex:1;border:0;border-radius:999px;padding:14px;font-weight:800;background:var(--accent);color:#fff;font-size:15px}
.pri.warn{background:#b3541e}
.back{border:0;background:var(--panel);border-radius:999px;padding:14px;font-weight:800;font-size:15px;width:100%}
.rows{display:flex;flex-direction:column}
.qr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line)}
.qr:first-child{border-top:0}
.qr .t{font-size:18px;font-weight:600;background:#ecebe6;border-radius:4px;padding:2px 8px}
.opt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opt button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.opt button.bad{border-color:var(--bad);color:var(--bad)}
.ok{color:var(--good);font-weight:800;font-size:14px}
.prog{font-size:13px;font-weight:800;color:var(--soft)}
.sum{font-size:15px}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<script>
const DATA={"sets":[{"id":"gibon","label":"기본","group":"book","color":"#81cc46","sub":"","items":[{"no":"0001","en":"The students like history class.","ko":"학생들은 역사 수업을 좋아한다.","pattern":"3형식","pt":"SVO","chunks":[{"t":"The students","role":"S","pos":["명사"],"k":"학생들은"},{"t":"like","role":"V","pos":null,"k":"좋아한다"},{"t":"history class","role":"O","pos":["명사"],"k":"역사 수업을"}],"words":[{"w":"The","pos":"관사","mean":"그 (정해진 대상 앞에 붙임)","note":""},{"w":"students","pos":"명사","mean":"학생","note":"명사 student의 복수형 (여러 명이라 -s)"},{"w":"like","pos":"동사","mean":"좋아하다","note":""},{"w":"history","pos":"명사","mean":"역사","note":""},{"w":"class","pos":"명사","mean":"수업","note":""}],"memo":null},{"no":"0002","en":"Do you have time to help?","ko":"도와줄 시간 있어요?","pattern":"3형식(의문문)","pt":"SVO","chunks":[{"t":"Do","role":"V","pos":null,"k":"~하니"},{"t":"you","role":"S","pos":["대명사"],"k":"너는"},{"t":"have","role":"V","pos":null,"k":"가지고 있니"},{"t":"time","role":"O","pos":["명사"],"k":"시간을"},{"t":"to help","role":"M","kind":"to부정사(형용사적 용법)","to":"time","pos":null,"k":"도울"}],"words":[{"w":"Do","pos":"조동사","mean":"(의문문을 만드는 말, 해석 안 함)","note":""},{"w":"you","pos":"대명사","mean":"너, 당신","note":""},{"w":"have","pos":"동사","mean":"가지다","note":""},{"w":"time","pos":"명사","mean":"시간","note":""},{"w":"to","pos":"to(부정사)","mean":"~할","note":""},{"w":"help","pos":"동사","mean":"돕다","note":""}],"memo":{"basis":"기준: 의문문의 Do는 have와 함께 V로 묶어 표시, to help는 time을 꾸미는 형용사적 용법","text":"시간을 '도울 (시간)'으로 보면 형용사적 용법. '돕기 위해 시간을 가지다'로 보면 부사적 용법으로도 읽히나, time 바로 뒤라 형용사적 용법으로 확정."}},{"no":"0003","en":"Look at that man on the bus.","ko":"저 버스에 탄 남자를 보세요.","pattern":"3형식(명령문)","pt":"SVO","chunks":[{"t":"Look at","role":"V","pos":null,"k":"보세요"},{"t":"that man","role":"O","pos":["명사"],"k":"저 남자를"},{"t":"on the bus","role":"M","kind":"형용사구","to":"man","pos":null,"k":"버스에 탄"}],"words":[{"w":"Look","pos":"동사","mean":"(~을) 보다","note":""},{"w":"at","pos":"전치사","mean":"(Look at의 일부)","note":""},{"w":"that","pos":"형용사","mean":"저","note":""},{"w":"man","pos":"명사","mean":"남자","note":""},{"w":"on","pos":"전치사","mean":"~에 (타고 있는)","note":""},{"w":"the","pos":"관사","mean":"그","note":""},{"w":"bus","pos":"명사","mean":"버스","note":""}],"memo":{"basis":"기준: look at은 구동사로 보아 V 한 덩어리, 목적어를 취하는 3형식","text":"on the bus는 바로 앞 man을 꾸미는 형용사구(버스에 탄 남자)로 처리. 주어 You는 생략."}},{"no":"0004","en":"Please put the bag over there.","ko":"저기에 가방을 놓아 주세요.","pattern":"3형식(명령문)","pt":"SVO","chunks":[{"t":"Please","role":"M","kind":"부사","to":"put","pos":null,"k":"제발"},{"t":"put","role":"V","pos":null,"k":"놓아 주세요"},{"t":"the bag","role":"O","pos":["명사"],"k":"가방을"},{"t":"over there","role":"M","kind":"부사구","to":"put","pos":null,"k":"저기에"}],"words":[{"w":"Please","pos":"부사","mean":"제발, 부디(부탁하는 말)","note":""},{"w":"put","pos":"동사","mean":"놓다, 두다","note":""},{"w":"the","pos":"관사","mean":"그","note":""},{"w":"bag","pos":"명사","mean":"가방","note":""},{"w":"over","pos":"부사","mean":"저기에","note":""},{"w":"there","pos":"부사","mean":"(over there의 일부)","note":""}],"memo":{"basis":"기준: 거의 필수에 가까운 부사구는 수식어로 처리","text":"put은 놓을 장소가 거의 꼭 필요하지만, 엄밀한 기준대로 over there는 수식어(M)로 표시. 주어 You는 생략."}},{"no":"0005","en":"Do you see a house?","ko":"집이 보이니?","pattern":"3형식(의문문)","pt":"SVO","chunks":[{"t":"Do","role":"V","pos":null,"k":"~하니"},{"t":"you","role":"S","pos":["대명사"],"k":"너는"},{"t":"see","role":"V","pos":null,"k":"보니"},{"t":"a house","role":"O","pos":["명사"],"k":"집을"}],"words":[{"w":"Do","pos":"조동사","mean":"(의문문을 만드는 말, 해석 안 함)","note":""},{"w":"you","pos":"대명사","mean":"너, 당신","note":""},{"w":"see","pos":"동사","mean":"보다","note":""},{"w":"a","pos":"관사","mean":"하나의, 어떤","note":""},{"w":"house","pos":"명사","mean":"집","note":""}],"memo":null},{"no":"0006","en":"My dad let me go to the party.","ko":"아빠는 내가 파티에 가게 해 주셨다.","pattern":"5형식","pt":"SVOC","chunks":[{"t":"My dad","role":"S","pos":["명사"],"k":"아빠는"},{"t":"let","role":"V","pos":null,"k":"하게 해 주셨다"},{"t":"me","role":"O","pos":["대명사"],"k":"내가"},{"t":"go","role":"OC","pos":null,"k":"가도록"},{"t":"to the party","role":"M","kind":"부사구","to":"go","pos":null,"k":"파티에"}],"words":[{"w":"My","pos":"대명사","mean":"나의","note":"I의 소유격 (뒤 명사가 '나의 것'임을 나타냄)"},{"w":"dad","pos":"명사","mean":"아빠","note":""},{"w":"let","pos":"동사","mean":"허락하다, ~하게 하다","note":"동사 let의 과거형 (let-let-let으로 현재형과 모양이 같음)"},{"w":"me","pos":"대명사","mean":"나","note":"I의 목적격 (동사의 목적어 자리라 me)"},{"w":"go","pos":"동사","mean":"가다","note":"동사원형 (let + 목적어 뒤에는 to 없는 원형이 옴)"},{"w":"to","pos":"전치사","mean":"~로, ~에","note":""},{"w":"the","pos":"관사","mean":"그","note":""},{"w":"party","pos":"명사","mean":"파티","note":""}],"memo":{"basis":"기준: let + 목적어 + 동사원형은 5형식(OC = 원형부정사 go)","text":"let이 과거형인지 현재형인지는 모양이 같아 문맥으로 판단(과거로 해석). to the party는 go를 꾸미는 부사구."}},{"no":"0007","en":"Amy wrote a great story.","ko":"에이미는 멋진 이야기를 썼다.","pattern":"3형식","pt":"SVO","chunks":[{"t":"Amy","role":"S","pos":["명사"],"k":"에이미는"},{"t":"wrote","role":"V","pos":null,"k":"썼다"},{"t":"a great story","role":"O","pos":["명사"],"k":"멋진 이야기를"}],"words":[{"w":"Amy","pos":"명사","mean":"에이미(사람 이름)","note":""},{"w":"wrote","pos":"동사","mean":"쓰다","note":"동사 write의 과거형 (불규칙: write-wrote-written)"},{"w":"a","pos":"관사","mean":"하나의, 어떤","note":""},{"w":"great","pos":"형용사","mean":"훌륭한, 멋진","note":""},{"w":"story","pos":"명사","mean":"이야기","note":""}],"memo":null},{"no":"0008","en":"This watch is really nice.","ko":"이 시계는 정말 멋지다.","pattern":"2형식","pt":"SVC","chunks":[{"t":"This watch","role":"S","pos":["명사"],"k":"이 시계는"},{"t":"is","role":"V","pos":null,"k":"이다"},{"t":"really","role":"M","kind":"부사","to":"nice","pos":null,"k":"정말"},{"t":"nice","role":"C","pos":["형용사"],"k":"멋진"}],"words":[{"w":"This","pos":"형용사","mean":"이","note":""},{"w":"watch","pos":"명사","mean":"시계","note":""},{"w":"is","pos":"동사","mean":"이다","note":"be동사 am/is/are 중 주어가 3인칭 단수라 is"},{"w":"really","pos":"부사","mean":"아주, 진짜","note":""},{"w":"nice","pos":"형용사","mean":"근사한, 좋은","note":""}],"memo":null},{"no":"0009","en":"I got a gift today.","ko":"나는 오늘 선물을 받았다.","pattern":"3형식","pt":"SVO","chunks":[{"t":"I","role":"S","pos function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>'}
function ck(c){if(c.role==='M'){if(c.kind==='접속사')return 'CJ';return /형용사/.test(c.kind||'')?'MA':'MB'}return BASE[c.role]}
function qbase(c){if(c.role==='M')return c.kind==='접속사'?'CJ':'M';return BASE[c.role]}
function sp(c,i){return (i>0&&!/^['’.,?!;:]/.test(c.t))?' ':''}
function mpos(p){return p.join(' + ')}
function label(c){
  const rn=NAME[c.role==='M'&&c.kind==='접속사'?'CJ':c.role];
  let sm='';
  if(c.pos&&c.role!=='V')sm=mpos(c.pos);
  else if(c.role==='M'&&c.kind)sm=c.kind;
  else if(c.sub)sm='절·구';
  return (c.k?'<span class="g">'+esc(c.k)+'</span>':'')+'<span class="r">'+rn+(sm?' <small>('+esc(sm)+')</small>':'')+'</span>';
}
let cur=null,round=0;
function home(){
  cur=null;
  const bc=DATA.sets.filter(s=>s.group==='book'),tx=DATA.sets.filter(s=>s.group==='text');
  app.innerHTML='<h1>보충</h1><h2>비단챌</h2><div class="grid">'+bc.map(s=>'<button class="big" style="--c:'+s.color+'" data-id="'+s.id+'">'+esc(s.label)+'<small>'+s.items.length+'문장</small></button>').join('')+'</div><h2>교과서</h2><div class="grid">'+tx.map(s=>'<button class="big wide" style="--c:'+s.color+'" data-id="'+s.id+'">'+esc(s.label)+'<small>'+esc(s.sub)+' · '+s.items.length+'문장</small></button>').join('')+'</div>';
  app.querySelectorAll('.big').forEach(b=>b.onclick=()=>rounds(b.dataset.id));
  window.scrollTo(0,0);
}
function nr(){return Math.ceil(cur.items.length/10)}
function rounds(id){
  cur=DATA.sets.find(s=>s.id===id);
  let h='<h1>'+esc(cur.label)+'</h1><div class="grid">';
  for(let r=0;r<nr();r++){const a=r*10+1,b=Math.min(cur.items.length,(r+1)*10);h+='<button class="big" style="--c:'+cur.color+'" data-r="'+r+'">'+a+' – '+b+'<small>'+(b-a+1)+'문장</small></button>'}
  app.innerHTML=h+'</div><button class="back" id="bk">처음으로</button>';
  app.querySelectorAll('.big').forEach(b=>b.onclick=()=>copyView(+b.dataset.r));
  document.getElementById('bk').onclick=home;window.scrollTo(0,0);
}
function chunkSpans(chs,labelOn){
  return chs.map((c,i)=>sp(c,i)+'<span class="ch"><span class="t k-'+ck(c)+'">'+esc(c.t)+'</span>'+(labelOn?'<span class="l">'+label(c)+'</span>':'')+'</span>').join('');
}
function subHTML(chs){
  return chs.map(c=>'<div class="sub"><b>'+NAME[c.role]+'</b> '+en(c.t)+(c.role==='M'&&c.kind?' <span class="wm">'+esc(c.kind)+'</span>':'')+(c.sub?subHTML(c.sub):'')+'</div>').join('');
}
function anchHTML(code){
  const a=ANCH[code];
  return '<div class="anc"><b>'+a[0]+'</b>'+a[2].map(e=>'<span class="x k-'+e[1]+'" lang="en" translate="no">'+esc(e[0])+'</span>').join('')+'<span>와 같은 구조</span></div>';
}
function items(){return cur.items.slice(round*10,round*10+10)}
function copyView(r){
  round=r;const its=items();
  let h='<h1>'+esc(cur.label)+' '+(r*10+1)+' – '+(r*10+its.length)+'</h1><div class="legend"><span class="k-S">주어</span><span class="k-V">동사</span><span class="k-O">목적어</span><span class="k-C">보어</span><span class="k-MA">형용사 수식어</span><span class="k-MB">그 밖의 수식어</span></div>';
  its.forEach((it,i)=>{
    const wm=it.words.filter(w=>w.pos!=='관사').map(w=>en(w.w)+' '+esc(w.mean)).join(' · ');
    const subs=it.chunks.filter(c=>c.sub).map(c=>subHTML(c.sub)).join('');
    h+='<div class="card"><div class="no">'+esc(it.no)+(it.pt?'':' · '+esc(it.pattern))+'</div><div class="sent" lang="en" translate="no">'+chunkSpans(it.chunks,true)+'</div>'+(it.pt?anchHTML(it.pt):'')+subs+'<div class="ko">'+esc(it.ko)+'</div><div class="wm">'+wm+'</div>'+(it.memo?'<div class="note"><b>'+esc(it.memo.basis)+'</b> '+esc(it.memo.text||'')+'</div>':'')+'</div>';
  });
  h+='<div class="btnrow"><button class="pri" id="go">다 칠했음</button></div><button class="back" id="bk">목록으로</button>';
  app.innerHTML=h;
  const go=document.getElementById('go');
  go.onclick=()=>{if(!go.classList.contains('warn')){go.classList.add('warn');go.textContent='이 화면은 다시 볼 수 없음. 시작';return}quiz(0,0)};
  document.getElementById('bk').onclick=()=>rounds(cur.id);window.scrollTo(0,0);
}
function quiz(i,wrong){
  const its=items();
  if(i>=its.length){
    app.innerHTML='<h1>'+esc(cur.label)+' '+(round*10+1)+' – '+(round*10+its.length)+' 완료</h1><div class="card sum">오답 '+wrong+'번</div>'+(round+1<nr()?'<button class="pri" id="nx">다음 10문장</button>':'')+'<button class="back" id="bk">목록으로</button>';
    const nx=document.getElementById('nx');if(nx)nx.onclick=()=>copyView(round+1);
    document.getElementById('bk').onclick=()=>rounds(cur.id);window.scrollTo(0,0);return;
  }
  const it=its[i];
  app.innerHTML='<div class="prog">'+(i+1)+' / '+its.length+'</div><div class="card"><div class="sent" lang="en" translate="no" id="sent">'+it.chunks.map((c,k)=>sp(c,k)+'<span class="t" data-k="'+k+'">'+esc(c.t)+'</span>').join('')+'</div><div class="rows" id="rows"></div></div><div class="btnrow"><button class="pri" id="nx" style="display:none">'+(i+1<its.length?'다음 문장':'끝')+'</button></div>';
  let left=it.chunks.length+(it.pt?1:0);
  const nx=document.getElementById('nx');
  nx.onclick=()=>quiz(i+1,wrong);
  function fin(){left--;if(left===0)nx.style.display='block'}
  function bump(){wrong++}
  const rows=document.getElementById('rows');
  it.chunks.forEach((c,k)=>{
    const r=document.createElement('div');r.className='qr';
    r.innerHTML='<span class="t" lang="en" translate="no">'+esc(c.t)+'</span><span class="opt"></span>';
    const o=r.querySelector('.opt'),span=document.querySelector('#sent .t[data-k="'+k+'"]');
    function roleStep(){
      o.innerHTML='';
      ROLEOPT.forEach(([key,nm])=>{
        const b=document.createElement('button');b.textContent=nm;
        b.onclick=()=>{
          if(key!==qbase(c)){b.classList.add('bad');bump();return}
          const cls='k-'+ck(c);r.querySelector('.t').classList.add(cls);span.classList.add(cls);
          if(c.pos&&c.pos.length)posStep(0,[]);else{o.innerHTML='<span class="ok">'+NAME[c.role==='M'&&c.kind==='접속사'?'CJ':BASE[c.role]||'M']+'</span>';fin()}
        };
        o.appendChild(b)});
    }
    function posStep(j,got){
      const nm=NAME[BASE[c.role]];
      const words=c.t.split(' ');
      o.innerHTML='<span class="ok" style="margin-right:6px">'+nm+(got.length?' · '+got.join(' + '):'')+'</span>'+(c.pos.length>1?'<span class="wm" lang="en" translate="no">'+esc(wordFor(c,j))+'</span>':'');
      POSOPT.forEach(p=>{
        const b=document.createElement('button');b.textContent=p;
        b.onclick=()=>{
          if(p!==c.pos[j]){b.classList.add('bad');bump();return}
          const g=got.concat([p]);
          if(j+1<c.pos.length){posStep(j+1,g);return}
          o.innerHTML='<span class="ok">'+nm+' · '+g.join(' + ')+'</span>';fin();
        };
        o.appendChild(b)});
    }
    roleStep();rows.appendChild(r);
  });
  if(it.pt){
    const r=document.createElement('div');r.className='qr';
    r.innerHTML='<span class="t" style="background:transparent;padding-left:0">문형</span><span class="opt"></span>';
    const o=r.querySelector('.opt');
    Object.keys(ANCH).forEach(code=>{
      const b=document.createElement('button');b.textContent=code;
      b.onclick=()=>{
        if(code!==it.pt){b.classList.add('bad');bump();return}
        o.innerHTML='<span class="ok">'+code+' · '+ANCH[code][1]+'</span>';
        r.insertAdjacentHTML('beforeend',anchHTML(code));fin();
      };
      o.appendChild(b)});
    rows.appendChild(r);
  }
  window.scrollTo(0,0);
}
function wordFor(c,j){
  const ws=c.t.split(' ').filter(Boolean);
  const vp=c.vw||ws;
  return vp[j]||ws[j]||'';
}
home();
</script>
</body>
</html>
