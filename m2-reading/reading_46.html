rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "Yujin의 블로그 · Happy Yujin!", "en": "Welcome to my blog, \"Happy Yujin!\" Hi, my name is Yujin, and I'm writing a blog to introduce my hometown, Chuncheon.", "ko": "제 블로그인 ‘행복한 유진!’에 오신 것을 환영합니다. 안녕하세요, 제 이름은 유진이고, 저는 제 고향인 춘천을 소개하기 위해서 블로그를 쓰고 있어요.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "Have you ever visit Chuncheon?", "ko": "당신은 춘천을 방문해 본 적이 있나요?", "ok": false, "foot": [], "fixes": [{"wrong": "visit", "right": "visited", "partial": false, "at": [3], "point": "현재완료: have + 과거분사 형태로 경험을 나타내므로 visited 사용", "topic": "현재완료", "memo": "have + 과거분사 형태로 경험을 나타내므로 visited 사용"}]}, {"n": 3, "tag": null, "en": "It's famous for their beautiful mountains and lakes.", "ko": "춘천은 아름다운 산과 호수로 유명해요.", "ok": false, "foot": [], "fixes": [{"wrong": "their", "right": "its", "partial": false, "at": [3], "point": "소유격: 단수 명사 Chuncheon을 가리키므로 its 사용 (their는 복수를 가리킴)", "topic": "소유격", "memo": "단수 명사 Chuncheon을 가리키므로 its 사용 (their는 복수를 가리킴)"}]}, {"n": 4, "tag": null, "en": "There are so many things to do and so many things seeing.", "ko": "할 것이 정말 많고, 볼 것도 정말 많답니다.", "ok": false, "foot": [], "fixes": [{"wrong": "seeing", "right": "to see", "partial": false, "at": [11], "point": "병렬구조: to do와 병렬을 이루므로 to see 사용", "topic": "병렬구조", "memo": "to do와 병렬을 이루므로 to see 사용"}]}, {"n": 5, "tag": null, "en": "Nowadays, the number of foreign tourists who visit Chuncheon are growing.", "ko": "요즘에는 춘천을 방문하는 외국인 관광객들의 수가 늘고 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "are", "right": "is", "partial": false, "at": [9], "point": "수일치: the number of + 복수명사는 단수 취급하므로 동사 is 사용", "topic": "수일치", "memo": "the number of + 복수명사는 단수 취급하므로 동사 is 사용"}]}, {"n": 6, "tag": null, "en": "I want sharing the history of Chuncheon and tips for visitors from around the world.", "ko": "저는 춘천의 역사와 전 세계 방문객들을 위한 조언을 공유하고 싶어요.", "ok": false, "foot": [], "fixes": [{"wrong": "sharing", "right": "to share", "partial": false, "at": [2], "point": "동명사 vs to부정사: want는 목적어로 to부정사를 취 huncheon was built in 2006.", "춘천에 있는 기념관은 2006년에 지어졌다.", 0], ["It looks like a traditional Ethiopian house.", "그것은 에티오피아의 전통 가옥처럼 생겼다.", 0], ["It has three round roofs.", "세 개의 둥근 지붕이 있다.", 0], ["Here, you can feel the strong friendship between the two countries.", "이곳에서 여러분은 두 나라 사이의 굳건한 우정을 느낄 수 있다.", 0], ["In the next story, I will introduce Soyanggang Skywalk and share some useful tips for traveling there.", "다음 이야기에서는, 소양강 스카이워크를 소개하고 그곳을 여행하는 데 유용한 정보를 공유할게요.", 0], ["You don't want to miss it!", "놓치면 안 돼요!", 0]];var RNUM=46;var TITLE_EN="My Hometown, Chuncheon";var PASS_EN=["My Hometown, Chuncheon", "Welcome to my blog, \"Happy Yujin!\" Hi, my name is Yujin, and I'm writing a blog to introduce my hometown, Chuncheon. Have you ever visited Chuncheon? It's famous for its beautiful mountains and lakes. There are so many things to do and so many things to see. Nowadays, the number of foreign tourists who visit Chuncheon is growing. I want to share the history of Chuncheon and tips for visitors from around the world. So, I started this blog. Today's focus is the Memorial Hall for Ethiopian Soldiers in the Korean War. On the first floor of the hall, visitors can see the names and pictures of the brave soldiers. On the second floor, Ethiopian cultural items are displayed. If you want to know about the special history between Korea and Ethiopia, please click on the link below.", "Ethiopia and Korea are far apart on the map, but they have had strong ties for many years. Ethiopia was the only African country to send soldiers during the Korean War. Ethiopian soldiers fought many battles in Chuncheon and never lost. During the war, some Korean children lost their parents. Ethiopian soldiers used their own money to help them. In the 2000s, Chuncheon became the sister city of Addis Ababa, the capital city of Ethiopia. Each city built a memorial hall to honor the Ethiopian soldiers who fought in the Korean War. The Memorial Hall in Chuncheon was built in 2006. It looks like a traditional Ethiopian house. It has three round roofs. Here, you can feel the strong friendship between the two countries. In the next story, I will introduce Soyanggang Skywalk and share some useful tips for traveling there. You don't want to miss it!"];var PASS_KO=["나의 고향, 춘천", "제 블로그인 ‘행복한 유진!’에 오신 것을 환영합니다. 안녕하세요, 제 이름은 유진이고, 저는 제 고향인 춘천을 소개하기 위해서 블로그를 쓰고 있어요. 당신은 춘천을 방문해 본 적이 있나요? 춘천은 아름다운 산과 호수로 유명해요. 할 것이 정말 많고, 볼 것도 정말 많답니다. 요즘에는 춘천을 방문하는 외국인 관광객들의 수가 늘고 있어요. 저는 춘천의 역사와 전 세계 방문객들을 위한 조언을 공유하고 싶어요. 그래서 저는 이 블로그를 시작했답니다. 오늘 중점적으로 소개할 곳은 에티오피아군의 한국전 참전 기념관이에요. 기념관 1층에서 방문객들은 용감한 군인들의 이름과 사진을 볼 수 있어요. 2층에는 에티오피아의 문화 유물들이 전시되어 있어요. 한국과 에티오피아 사이의 특별한 역사에 대해 알고 싶으면, 아래 링크를 클릭해 주세요.", "에티오피아와 한국은 지도상으로는 멀리 떨어져 있지만, 오랜 세월 동안 강한 유대 관계를 맺어 왔다. 에티오피아는 한국 전쟁 중 군인들을 보낸 유일한 아프리카 국가였다. 에티오피아 군인들은 춘천에서 많은 전투를 치렀고 결코 진 적이 없었다. 전쟁 중, 일부 한국 어린이들이 부모를 잃었다. 에티오피아 군인들은 그들을 돕기 위해 자신들의 돈을 썼다. 2000년대에 춘천은 에티오피아의 수도인 아디스아바바의 자매 도시가 되었다. 각 도시는 한국 전쟁에서 싸운 에티오피아 군인들을 기리기 위해 기념관을 세웠다. 춘천에 있는 기념관은 2006년에 지어졌다. 그것은 에티오피아의 전통 가옥처럼 생겼다. 세 개의 둥근 지붕이 있다. 이곳에서 여러분은 두 나라 사이의 굳건한 우정을 느낄 수 있다. 다음 이야기에서는, 소양강 스카이워크를 소개하고 그곳을 여행하는 데 유용한 정보를 공유할게요. 놓치면 안 돼요!"];var DG=[{"dlg": [["G", "You look great in this photo. Where was it taken, Henry?", "이 사진에서 너 멋져 보인다. 이거 어디서 찍은 거야, Henry?"], ["B", "In Busan. I went there during summer vacation. Have you visited Busan before?", "부산에서. 여름 방학 동안 거기 갔었어. 너는 부산에 가 본 적 있어?"], ["G", "No, I haven’t. How did you like it?", "아니, 없어. 거기 어땠어?"], ["B", "It was amazing. I liked the beach and the food.", "정말 멋졌어. 해변이랑 음식이 좋았어."], ["G", "Did you try some activities there?", "거기서 어떤 활동을 해 봤어?"], ["B", "Yeah. I learned to surf at Songjeong Beach. It was exciting.", "응. 송정 해수욕장에서 서핑을 배웠어. 신났어."], ["G", "Wow. Did you eat anything special?", "와. 특별한 거 먹었어?"], ["B", "Sure. I ate milmyeon. It was a bit cold but tasted really great.", "물론이지. 밀면을 먹었어. 조금 차가웠지만 정말 맛있었어."], ["G", "That sounds like a perfect trip!", "완벽한 여행이었던 것 같다!"]], "qs": [{"n": 1, "q": "위 대화의 주제로 알맞은 것은?", "o": [
