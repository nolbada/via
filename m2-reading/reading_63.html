<script>
var D=[{"n": 1, "tag": null, "en": "Do you know about taxes? Building roads or running schools need a lot of money, and that money comes from taxes.", "ko": "세금에 대해 알고 있는가? 도로를 건설하거나 학교를 운영하는 데는 많은 돈이 필요하고 그 돈은 세금에서 나온다.", "ok": false, "foot": [], "fixes": [{"wrong": "need", "right": "needs", "partial": false, "at": [10], "point": "주어와 동사의 수일치: 동명사구 주어(Building ... or running ...)는 단수 취급이라 needs 사용", "topic": "주어와 동사의 수일치", "memo": "동명사구 주어(Building ... or running ...)는 단수 취급이라 needs 사용"}]}, {"n": 2, "tag": null, "en": "You may think, 'I don't care about taxes. I don't pay them. I'm just a teen!' But here's a surprising secret: you pay taxes too! Let's learned more about taxes.", "ko": "여러분은 아마 ‘난 세금이랑 상관없어. 난 세금을 내지 않아. 나는 십 대일 뿐이야!’라고 생각할지도 모른다. 하지만 여기 놀라운 비밀이 있다: 여러분도 세금을 내고 있다! 세금에 대해 더 알아보자.", "ok": false, "foot": [], "fixes": [{"wrong": "learned", "right": "learn", "partial": false, "at": [26], "point": "Let's + 동사원형: Let's 뒤에는 동사원형 learn 사용", "topic": "Let's + 동사원형", "memo": "Let's 뒤에는 동사원형 learn 사용"}]}, {"n": 3, "tag": "왜 세금을 걷을까", "en": "Your family need money to run your home. In just the same way, countries need money, too.", "ko": "여러분의 가족은 집을 운영하는 데 돈이 필요하다. 마찬가지로, 국가도 돈이 필요하다.", "ok": false, "foot": [], "fixes": [{"wrong": "need", "right": "needs", "partial": false, "at": [2], "point": "주어와 동사의 수일치: family는 단수 취급이라 needs 사용", "topic": "주어와 동사의 수일치", "memo": "family는 단수 취급이라 needs 사용"}]}, {"n": 4, "tag": null, "en": "Taxes are like money in a piggy bank for a country. Everyone puts a little money into them, and then that money used for public things like roads and schools.", "ko": "세금은 국가를 위한 돼지 저금통 속 돈과 같다. 모든 사람이 조금씩 돈을 저금통에 넣고, 그 돈은 도로와 학교 같은 공공 서비스에 사용된다.", "ok": false, "foot": [], "fixes": [{"wrong": "them", "right": "it", "partial": false, "at": [17], "point": "대명사의 일치: 앞의 단수명사 a piggy bank를 가리키므로 it 사용", "topic": "대명사의 일치", "memo": "앞의 단수명사 a piggy bank를 가리키므로 it 사용"}, {"wrong": "used", "right": "is used", "partial": false, "at": [22], "point": "수동태: 돈은 '사용되는' 것이라 수동태 is used 사용", "topic": "수동태", "memo": "돈은 '사용되는' 것이라 수동태 is used 사용"}]}, {"n": 5, "tag": null, "en": "Taxes have a long history. Even in the old days, countries collected them to keep their people safely and manage their land.", "ko": "세금은 오랜 역사를 가지고 있다. 옛날에도 국가들은 국민들을 안전하게 보호하고, 땅을 관리하기 위해 세금을 걷었다.", "ok": false, "foot": [], "fixes": [{"wrong": "safely", "right": "safe", "partial": false, "at": [17], "point": "5형식의 목적격보어: keep + 목적어 + 형용사: '~를 …한 상태로 유지하다'", "topic": "5형식의 목적격보어", "memo": "keep + 목적어 + 형용사: '~를 …한 상태로 유지하다'"}]}, {"n": 6, "tag": null, "en": "In 1696, after a long war with France, England needed a lot of money. England wanted rich people paying more taxes.", "ko": "1696년, 영국은 프랑스와의 긴 전쟁 후에 많은 돈이 필요했다. 영국은 부유한 사람들이 더 많은 세금을 지불하기를 원했다.", "ok": false, "foot": [], "fixes": [{"wrong": "paying", "right": "to pay", "partial": false, "at": [18], "point": "want + 목적어 + to부정사: want는 목적어 뒤에 to부정사를 씀", "topic": "want + 목적어 + to부정사", "memo": "want는 목적어 뒤에 to부정사를 씀"}]}, {"n": 7, "tag": null, "en": "So, it made a window tax. Rich people usually lived in large houses with many windows. More windows meant more taxes.", "ko": "그래서 창문세를 만들었다. 부자들은 일반적으로 창문이 많은 큰 집에 살았다. 많은 창문은 많은 세금을 의미했다.", "ok": true, "foot": [], "fixes": []}, {"n": 8, "tag": "세금의 종류", "en": "People pay different kind of taxes. Here are the main ones.", "ko": "사람들은 여러 종류의 세금을 낸다. 다음은 대표적인 세금들이다.", "ok": false, "foot": [], "fixes": [{"wrong": "kind", "right": "kinds", "partial": false, "at": [3], "point": "명사의 수: different 뒤에는 복수명사가 오므로 kinds 사용", "topic": "명사의 수", "memo": "different 뒤에는 복수명사가 오므로 kinds 사용"}]}, {"n": 9, "tag": null, "en": "Income tax: People whose earn money from their jobs pay income tax.", "ko": "소득세: 직장에서 돈을 버는 사람들은 소득세를 낸다.", "ok": false, "foot": [], "fixes": [{"wrong": "whose", "right": "who", "partial": false, "at": [3], "point": "주격 관계대명사: 동사 earn의 주어 역할이므로 who 사용", "topic": "주격 관계대명사", "memo": "동사 earn의 주어 역할이므로 who 사용"}]}, {"n": 10, "tag": null, "en": "Sales tax: All people pay sales tax on the things what they buy. For example, when you will buy bread, you pay sales tax.", "ko": "판매세: 모든 사람들은 구입한 물건에 대해 판매세를 낸다. 예를 들어, 빵을 살 때 판매세를 낸다.", "ok": false, "foot": [], "fixes": [{"wrong": "what", "right": "that", "partial": false, "at": [10], "point": "목적격 관계대명사: 선행사 the things가 있어 what이 아닌 that 사용", "topic": "목적격 관계대명사", "memo": "선행사 the things가 있어 what이 아닌 that 사용"}, {"wrong": "will buy", "right": "buy", "partial": false, "at": [17], "point": "시간 부사절의 시제: 시간 부사절에서는 미래를 현재형으로 씀", "topic": "시간 부사절의 시제", "memo": "시간 부사절에서는 미래를 현재형으로 씀"}]}, {"n": 11, "tag": null, "en": "Property tax: People who own houses or land has to pay property tax.", "ko": "재산세: 집이나 땅을 소유한 사람들은 재산세를 내야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "has", "right": "have", "partial": false, "at": [8], "point": "주어와 동사의 수일치: 주어 People은 복수라 have to 사용", "topic": "주어와 동사의 수일치", "memo": "주어 People은 복수라 have to 사용"}]}, {"n": 12, "tag": "세금이 하는 일", "en": "Taxes does a lot of good things for us! Thanks to taxes, we get free education at middle school.", "ko": "세금은 우리를 위해 많은 좋은 일을 한다! 세금 덕분에 우리는 중학교에서 무료 교육을 받을 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "does", "right": "do", "partial": false, "at": [1], "point": "주어와 동사의 수일치: 주어 Taxes가 복수라 do 사용", "topic": "주어와 동사의 수일치", "memo": "주어 Taxes가 복수라 do 사용"}]}, {"n": 13, "tag": null, "en": "Taxes are use for our environment. They pay for the clean air and water what we need.", "ko": "세금은 환경을 위해서도 사용된다. 세금은 우리가 필요한 깨끗한 공기와 물을 위해 쓰인다.", "ok": false, "foot": [], "fixes": [{"wrong": "use", "right": "used", "partial": false, "at": [2], "point": "수동태: 세금은 '사용되는' 것이라 are used", "topic": "수동태", "memo": "세금은 '사용되는' 것이라 are used"}, {"wrong": "what", "right": "which", "partial": false, "at": [14], "point": "목적격 관계대명사: 선행사 the clean air and water가 있어 which 사용", "topic": "목적격 관계대명사", "memo": "선행사 the clean air and water가 있어 which 사용"}]}, {"n": 14, "tag": null, "en": "Taxes also pay for our safety, like streetlights by roads. So, you can ask the country put more streetlights in dark places.", "ko": "또한, 도로 옆 가로등 같은 안전을 위해서도 사용된다. 그래서 여러분은 어두운 곳에 더 많은 가로등을 설치해 달라고 국가에 요청할 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "put", "right": "to put", "partial": false, "at": [16], "point": "ask + 목적어 + to부정사: ask는 목적어 뒤에 to부정사를 씀", "topic": "ask + 목적어 + to부정사", "memo": "ask는 목적어 뒤에 to부정사를 씀"}]}, {"n": 15, "tag": null, "en": "Taxes are all around us. They pay for things that we use every day. They can make our lives better.", "ko": "세금은 우리 주변 어디에나 있다. 세금은 우리가 매일 사용하는 것들을 위해 쓰인다. 세금은 우리의 삶을 더 좋게 만들 수 있다.", "ok": true, "foot": [], "fixes": []}, {"n": 16, "tag": null, "en": "But if they wasted, we can't get the services that we need. So, taxes must use wisely.", "ko": "하지만 만약 세금이 낭비된다면, 우리는 필요한 서비스를 받을 수 없다. 그러므로 세금은 현명하게 사용되어야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "wasted", "right": "are wasted", "partial": false, "at": [3], "point": "수동태: 세금이 '낭비되는' 것이라 are wasted", "topic": "수동태", "memo": "세금이 '낭비되는' 것이라 are wasted"}, {"wrong": "use", "right": "be used", "partial": false, "at": [15], "point": "조동사 + 수동태: must 뒤 수동태는 be used", "topic": "조동사 + 수동태", "memo": "must 뒤 수동태는 be used"}]}, {"n": 17, "tag": null, "en": "We need seeing that taxes are used the right way.", "ko": "우리는 세금이 올바른 방식으로 사용되는지 확인할 필요가 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "seeing", "right": "to see", "partial": false, "at": [2], "point": "need + to부정사: need는 목적어로 to부정사를 씀", "topic": "need + to부정사", "memo": "need는 목적어로 to부정사를 씀"}]}];var PP=[["Do you know about taxes?", "세금에 대해 알고 있는가?", 1], ["Building roads or running schools needs a lot of money, and that money comes from taxes.", "도로를 건설하거나 학교를 운영하는 데는 많은 돈이 필요하고 그 돈은 세금에서 나온다.", 0], ["You may think, 'I don't care about taxes.", "여러분은 아마 ‘난 세금이랑 상관없어.", 0], ["I don't pay them.", "난 세금을 내지 않아.", 0], ["I'm just a teen!'", "나는 십 대일 뿐이야!’라고 생각할지도 모른다.", 0], ["But here's a surprising secret: you pay taxes too!", "하지만 여기 놀라운 비밀이 있다: 여러분도 세금을 내고 있  are used for our environment.", "세금은 환경을 위해서도 사용된다.", 0], ["They pay for the clean air and water which we need.", "세금은 우리가 필요한 깨끗한 공기와 물을 위해 쓰인다.", 0], ["Taxes also pay for our safety, like streetlights by roads.", "또한, 도로 옆 가로등 같은 안전을 위해서도 사용된다.", 0], ["So, you can ask the country to put more streetlights in dark places.", "그래서 여러분은 어두운 곳에 더 많은 가로등을 설치해 달라고 국가에 요청할 수 있다.", 0], ["Taxes are all around us.", "세금은 우리 주변 어디에나 있다.", 0], ["They pay for things that we use every day.", "세금은 우리가 매일 사용하는 것들을 위해 쓰인다.", 0], ["They can make our lives better.", "세금은 우리의 삶을 더 좋게 만들 수 있다.", 0], ["But if they are wasted, we can't get the services that we need.", "하지만 만약 세금이 낭비된다면, 우리는 필요한 서비스를 받을 수 없다.", 0], ["So, taxes must be used wisely.", "그러므로 세금은 현명하게 사용되어야 한다.", 0], ["We need to see that taxes are used the right way.", "우리는 세금이 올바른 방식으로 사용되는지 확인할 필요가 있다.", 0]];var RNUM=63;var TITLE_EN="Taxes Are All Around Us";var PASS_EN=["Taxes Are All Around Us", "Do you know about taxes? Building roads or running schools needs a lot of money, and that money comes from taxes. You may think, 'I don't care about taxes. I don't pay them. I'm just a teen!' But here's a surprising secret: you pay taxes too! Let's learn more about taxes.", "Why Do Countries Collect Taxes?", "Your family needs money to run your home. In just the same way, countries need money, too. Taxes are like money in a piggy bank for a country. Everyone puts a little money into it, and then that money is used for public things like roads and schools. Taxes have a long history. Even in the old days, countries collected them to keep their people safe and manage their land. In 1696, after a long war with France, England needed a lot of money. England wanted rich people to pay more taxes. So, it made a window tax. Rich people usually lived in large houses with many windows. More windows meant more taxes.", "What Kinds of Taxes Do People Pay?", "People pay different kinds of taxes. Here are the main ones. Income tax: People who earn money from their jobs pay income tax. Sales tax: All people pay sales tax on the things that they buy. For example, when you buy bread, you pay sales tax. Property tax: People who own houses or land have to pay property tax.", "What Do Taxes Do?", "Taxes do a lot of good things for us! Thanks to taxes, we get free education at middle school. Taxes are used for our environment. They pay for the clean air and water which we need. Taxes also pay for our safety, like streetlights by roads. So, you can ask the country to put more streetlights in dark places. Taxes are all around us. They pay for things that we use every day. They can make our lives better. But if they are wasted, we can't get the services that we need. So, taxes must be used wisely. We need to see that taxes are used the right way."];var PASS_KO=["세금은 우리 주변 어디에나 있다", "세금에 대해 알고 있는가? 도로를 건설하거나 학교를 운영하는 데는 많은 돈이 필요하고 그 돈은 세금에서 나온다. 여러분은 아마 ‘난 세금이랑 상관없어. 난 세금을 내지 않아. 나는 십 대일 뿐이야!’라고 생각할지도 모른다. 하지만 여기 놀라운 비밀이 있다: 여러분도 세금을 내고 있다! 세금에 대해 더 알아보자.", "왜 국가는 세금을 걷을까?", "여러분의 가족은 집을 운영하는 데 돈이 필요하다. 마찬가지로, 국가도 돈이 필요하다. 세금은 국가를 위한 돼지 저금통 속 돈과 같다. 모든 사람이 조금씩 돈을 저금통에 넣고, 그 돈은 도로와 학교 같은 공공 서비스에 사용된다. 세금은 오랜 역사를 가지고 있다. 옛날에도 국가들은 국민들을 안전하게 보호하고, 땅을 관리하기 위해 세금을 걷었다. 1696년, 영국은 프랑스와의 긴 전쟁 후에 많은 돈이 필요했다. 영국은 부유한 사람들이 더 많은 세금을 지불하기를 원했다. 그래서 창문세를 만들었다. 부자들은 일반적으로 창문이 많은 큰 집에 살았다. 많은 창문은 많은 세금을 의미했다.", "사람들은 어떤 종류의 세금을 내나?", "사람들은 여러 종류의 세금을 낸다. 다음은 대표적인 세금들이다. 소득세: 직장에서 돈을 버는 사람들은 소득세를 낸다. 판매세: 모든 사람들은 구입한 물건에 대해 판매세를 낸다. 예를 들어, 빵을 살 때 판매세를 낸다. 재산세: 집이나 땅을 소유한 사람들은 재산세를 내야 한다.", "세금은 무엇을 할까?", "세금은 우리를 위해 많은 좋은 일을 한다! 세금 덕분에 우리는 중학교에서 무료 교육을 받을 수 있다. 세금은 환경을 위해서도 사용된다. 세금은 우리가 필요한 깨끗한 공기와 물을 위해 쓰인다. 또한, 도로 옆 가로등 같은 안전을 위해서도 사용된다. 그래서 여러분은 어두운 곳에 더 많은 가로등을 설치해 달라고 국가에 요청할 수 있다. 세금은 우리 주변 어디에나 있다. 세금은 우리가 매일 사용하는 것들을 위해 쓰인다. 세금은 우리의 삶을 더 좋게 만들 수 있다. 하지만 만약 세금이 낭비된다면, 우리는 필요한 서비스를 받을 수 없다. 그러므로 세금은 현명하게 사용되어야 한다. 우리는 세금이 올바른 방식으로 사용되는지 확인할 필요가 있다."];var BG=[{"qs": [{"n": 6, "q": "윗글의 내용과 일치하지 않는 것은?", "o": ["Running a home function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function fixedHtml(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0001'+f.right+'\u0002');return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+'\u0001'+f.right+'\u0002'+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return esc(tk.join(' ').replace(/ ?\u0000/g,'')).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>')}
function noteHtml(i){
 var it=D[i],wp=wrongPicks(i);
 if(it.ok){return '<div class="ac s1"><div class="ac-top fine"><b>맞는 문장</b><span class="ac-a">어법 오류 없음</span>'+(wp?'<span class="ac-x">고른 곳은 틀린 곳이 아니에요</span>':'')+'</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 var h='<div class="ac s1"><div class="ac-top'+(all?' g':'')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+'</b>'+(wp?'<span class="ac-x">틀리게 고른 곳 '+wp+'개</span>':'')+'</div>';
 h+='<div class="fixs-l">고친 문장</div><div class="fixs" lang="en">'+fixedHtml(it)+'</div>';
 it.fixes.forEach(function(f,k){var ok=foundFix(i,k);
  h+='<div class="fc '+(ok?'f':'m')+'"><div><span class="tg2">'+(ok?'찾음':'놓침')+'</span>'+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr" lang="en">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt" lang="en">'+esc(f.right)+'</span></div><div class="fcb">'+pointHtml(f)+'</div></div>'});
 return h+'<div style="height:12px"></div></div>';
}
function critHtml(f){var w=f.wrong.split(/\s+/),r=f.right.split(/\s+/);
 if(f.alt&&f.alt.length)return '<div class="crit">빠진 말 문제 : 빠진 자리 양옆 어느 단어를 눌러도 정답으로 인정</div>';
 if(w.length==2&&r.length==2&&w.slice().sort().join()==r.slice().sort().join()&&w.join()!=r.join())return '<div class="crit">어순 문제 : 옮겨진 말과 짝이 되는 단어, 어느 쪽을 눌러도 정답으로 인정</div>';return ''}
function pointHtml(f){var p=f.point,ix=p.indexOf(':');return (ix>0&&ix<24?'<b>'+esc(p.slice(0,ix))+'</b> : '+esc(p.slice(ix+1).trim()):'<b>'+esc(f.topic)+'</b> : '+esc(p))+critHtml(f)}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 return '<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
}
function load(){try{var v=localStorage.getItem(BK);return v==null?null:+v}catch(e){return null}}
function save(n){try{var b=load();if(b==null||n>b)localStorage.setItem(BK,n)}catch(e){}}
function ppHtml(pp){
 return '<div class="dlg"><div class="who">'+en(TITLE_EN)+' &middot; '+en(pp[0][0])+'</div><div class="ln"><div class="en" lang="en">'+esc(pp.slice(1).map(function(p){return p[0]}).join(' '))+'</div></div></div>';
}
function qVisible(i){if(!aDone())return false;for(var j=0;j<i;j++){var s=qst[QL[j].n];if(!(s&&s.adv))return false}return true}
function stepQHtml(){
 if(!aDone())return '';
 var h='<div class="stage">2 · 본문 '+QL.length+'문제</div>',lastG=null;
 for(var i=0;i<QL.length;i++){
  if(!qVisible(i))break;
  var q=QL[i];
  if(q.g!==lastG){if(q.g.pp)h+=ppHtml(q.g.pp);lastG=q.g}
  h+=qCard(i);
 }
 if(allAdv())h+=resultHtml();
 return h;
}
function optText(q,j){return q.ko?en(q.o[j]):esc(q.o[j])}
function doneRow(q){return '<div class="qd" id="q'+q.n+'"><span class="qn">'+q.dn+'</span><span>정답 '+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<span class="qk">'+esc(q.ko[q.a])+'</span>':'')+'</div>'}
function postHtml(q,st){var n=q.note;
 return '<div class="post"><div class="ph">노트에 쓰기 &middot; 요약문 완성</div><div class="pl" lang="en">'+esc(n.en)+'</div><div class="pk">'+esc(n.ko)+'</div><div class="pw">'+n.words.map(function(w){return '<span lang="en">'+esc(w[0])+'</span> = '+esc(w[1])}).join(' &nbsp;&middot;&nbsp; ')+'</div>'+(st.wrote?'<div class="pd">작성 완료</div>':'<button type="button" data-wrote="'+q.n+'">노트에 썼어요</button>')+'</div>';
}
function qCard(i){
 var q=QL[i],st=qst[q.n]||(qst[q.n]={w:[],ok:0,adv:0,t0:Date.now(),t1:0,wrote:0});
 if(st.adv&&!q.note&&!st.w.length)return doneRow(q);
 var h='<div class="q" id="q'+q.n+'"><div class="qt"><span class="lbl">'+LABEL+'</span><span class="qn">'+q.dn+'</span>'+neg(q.q)+'</div>';
 if(q.sum)h+='<div class="sumbox" lang="en">'+esc(q.sum)+'</div>';
 if(!st.w.length){
  q.o.forEach(function(t,j){
   h+='<div class="opt'+(st.ok&&j===q.a?' good':'')+'"'+(st.ok?'':' data-q="'+q.n+'" data-o="'+j+'"')+'><span class="cn">'+CN[j]+'</span><span>'+(q.ko?en(t):esc(t))+'</span></div>';
  });
  if(st.ok&&q.note)h+=postHtml(q,st);
  return h+'</div>';
 }
 return h+'</div>'+wrongCard(q,st);
}
function wrongCard(q,st){
 var h='<div class="ac"><div class="ac-top"><b>오답</b><span class="ac-a">정답 '+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<div class="ac-k">'+esc(q.ko[q.a])+'</div>':'')+'</div>';
 var isEv=function(t){return q.evs.some(function(e){return t===e[0]||(t.length>8&&t.indexOf(e[0])>=0)})};
 if(q.g.pp){
  h+='<div class="ac-sec">본문</div><div class="pass">';
  q.g.pp.forEach(function(p,ix){if(ix===0)return;h+='<div class="pl1"><div class="e" lang="en">'+(isEv(p[0])?'<mark>'+esc(p[0])+'</mark>':esc(p[0]))+'</div><div class="k">'+esc(p[1])+'</div></div>'});
  h+='</div>';
 } else {
  h+='<div class="ac-sec">본문 근거</div><div class="pass">';
  q.evs.forEach(function(e){h+='<div class="pl1"><div class="e" lang="en"><mark>'+esc(e[0])+'</mark></div><div class="k">'+esc(e[1])+'</div></div>'});
  h+='</div>';
 }
 h+='<div class="ac-sec">보기 풀이</div>';
 q.o.forEach(function(t,j){var isA=j===q.a,isW=st.w.indexOf(j)>=0;
  h+='<div class="oc'+(isA?' g':isW?' r':'')+'"><div class="oh"><span class="cn">'+CN[j]+'</span><div class="ot">'+(q.ko?en(t):esc(t))+(q.ko?'<div class="okr">'+esc(q.ko[j])+'</div>':'')+'</div>'+(isA?'<span class="tg">정답</span>':isW?'<span class="tg">내가 고름</span>':'')+'</div><div class="why">'+reasonHtml(q.ow[j])+'</div></div>';
 });
 var tr=(q.memo||[]).filter(function(l){return /^함정/.test(l)})[0];
 if(tr)h+='<div class="trap"><b>함정</b> '+esc(tr.replace(/^함정\s*:\s*/,'').replace(/\s*✕/g,''))+'</div>';
 if(!st.ok){
  h+='<div class="fix"><div class="fh">고쳐 보기</div>';
  q.o.forEach(function(t,j){var xx=st.w.indexOf(j)>=0;h+='<div class="opt'+(xx?' xx':'')+'" data-q="'+q.n+'" data-o="'+j+'"><span class="cn">'+CN[j]+'</span><span>'+(q.ko?en(t):esc(t))+'</span></div>'});
  h+='</div>';
 } else {
  h+='<div class="fixed">정답 '+CN[q.a]+'</div>';
  if(q.note)h+=postHtml(q,st);
  else if(!st.adv)h+='<div class="nx"><button type="button" data-next="'+q.n+'">다음 문제</button></div>';
 }
 return h+'</div>';
}
function fcount(){return QL.filter(function(q){var s=qst[q.n];return s&&s.ok&&!s.w.length}).length}
function fastInfo(){
 var s1=[];secs.forEach(function(S,si){if(s1t[si]!=null&&s1t[si]<1500*S.items.length)s1.push(S.name||('구간 '+(si+1)))});
 var q2=[];QL.forEach(function(q){var s=qst[q.n];if(s&&s.t1&&s.t1-s.t0<2500)q2.push(q.dn)});
 return{s1:s1,q2:q2};
}
function resultHtml(){
 var f=fcount(),fx=QL.reduce(function(a,q){return a+qst[q.n].w.length},0),fi=fastInfo();
 var h='<div class="stage">완료</div><div class="res"><div class="rl">처음에 맞힌 문제</div><div class="rpct">'+f+'<small> / '+QL.length+'</small></div>';
 h+='<table class="rtb">'+QL.map(function(q){var s=qst[q.n];return '<tr><td>'+q.dn+'번</td><td>'+(s.w.length?'틀림':'처음에 맞힘')+'</td></tr>'}).join('')+'</table>';
 h+='<div class="rl">총 학습 시간 '+fmtT(TM.act)+'</div>';
 h+='<div class="chip'+(chk?' on':'')+'">'+(chk?'선생님 확인 완료':'선생님 확인 대기')+'</div>';
 if(TEACH){
  h+='<div class="tp"><b>선생님용</b><div>빠른 제출 : '+((fi.s1.length||fi.q2.length)?'<span class="fl">'+(fi.s1.length?'오류 찾기 '+fi.s1.join(', ')+' ':'')+(fi.q2.length?'문제 '+fi.q2.join(', ')+'번':'')+'</span>':'없음')+'</div><div>첫 시도 정답 '+f+'/'+QL.length+'· 틀린 횟수 '+fx+'</div><div style="margin-top:8px"><button type="button" data-chk="1">'+(chk?'확인 취소':'노트 확인 완료')+'</button></div></div>';
 }
 h+='<div style="margin-top:14px"><a href="./" style="display:inline-block;background:var(--pri);color:#fff;text-decoration:none;font-weight:700;padding:9px 20px;border-radius:8px">M1 Reading 목록으로</a></div>';
 return h+'</div>';
}
function lognote(q){var n=q.note;wlog('s','2단계 · 요약문 완성',[{n:q.dn,a:'정답 '+CN[q.a]+' '+q.ans,m:[n.en,n.ko].concat(n.words.map(function(w){return w[0]+' = '+w[1]}))}])}
function pickOpt(n,j){var q=qById(n),st=qst[n];if(!st||st.ok)return;if(!st.t1)st.t1=Date.now();
 if(j===q.a){st.ok=1;if(q.note)lognote(q);if(!st.w.length&&!q.note){setTimeout(function(){advQ(n)},700)}}
 else if(st.w.indexOf(j)<0){st.w.push(j);st.ok=1;if(q.note)lognote(q)}
 var y=window.scrollY;render();window.scrollTo(0,y);
}
function advQ(n){var st=qst[n];if(!st||st.adv)return;st.adv=1;if(allAdv()){tmFlush();TM.done=1}
 render();var ix=QL.indexOf(qById(n)),nx=ix<QL.length-1?QL[ix+1]:null,el=nx?document.getElementById('q'+nx.n):document.querySelector('.res');
 if(el){var ty=el.getBoundingClientRect().top+window.pageYOffset-8;window.scrollTo(0,ty);setTimeout(function(){window.scrollTo(0,el.getBoundingClientRect().top+window.pageYOffset-8)},60)}
}
document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){var sb=+b.dataset.sub;s1t[sb]=Date.now()-mark;mark=Date.now();done[sb]=true;render();
  var fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(aDone())save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'});return}
 var o=e.target.closest('.opt[data-q]');if(o){pickOpt(+o.dataset.q,+o.dataset.o);return}
 var nx=e.target.closest('button[data-next]');if(nx){advQ(+nx.dataset.next);return}
 var wr=e.target.closest('button[data-wrote]');if(wr){var qn=+wr.dataset.wrote;qst[qn].wrote=1;advQ(qn);return}
 var ck=e.target.closest('button[data-chk]');if(ck){chk=chk?0:1;var y2=window.scrollY;render();window.scrollTo(0,y2);return}
});
function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){if(window.__bsR)return;try{var any=Object.keys(sel).length||Object.keys(qst).length||Object.keys(done).length;
 if(any)localStorage.setItem(PK,JSON.stringify({v:2,sel:sel,done:done,qst:qst,chk:chk,s1t:s1t,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+(allAdv()?1:0);var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');
 if(n>=2){rs[RNUM]={p:Math.round(fcount()*100/QL.length),ok:1,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}
 localStorage.setItem('m2-res',JSON.stringify(rs));
 if(any){st[RNUM]=(n>=2?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none';
 try{if(any)BSYNC(RNUM,JSON.parse(localStorage.getItem(PK)),n>=2?3:n,n>=2)}catch(e){}}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv&&sv.v===2){sel=sv.sel||{};done=sv.done||{};qst=sv.qst||{};chk=sv.chk||0;s1t=sv.s1t||{};if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}}}catch(e){}
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}try{BSYNC(RNUM,null,0,true)}catch(x){}sel={};done={};qst={};chk=0;s1t={};mark=Date.now();TM={act:0,lv:0,lt:0,done:0};_last=Date.now();render();window.scrollTo(0,0)}}});
render();

</script></body></html>
