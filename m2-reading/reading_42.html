<!doctype html>

<title>M2 Reading 42</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}

.sent{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;gap:10px;align-items:flex-start}.n{min-width:24px;color:var(--mut);font-size:13px;padding-top:3px}

.wd.hit{background:var(--okbg);box-shadow:inset 0 -2px 0 var(--ok)}.wd.miss{background:var(--badbg);box-shadow:inset 0 -2px 0 var(--bad)}.wd.x{text-decoration:line-through;color:var(--mut)}
.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}
.note{margin:10px 0 0 34px;padding:10px 12px;border-radius:8px;font-size:14.5px}
.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}
button{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Words have power.", "ko": "말에는 힘이 있습니다.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "They can make us to feel good or bad.", "ko": "말은 우리를 기분 좋거나 나쁘게 만들 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "to feel", "right": "feel", "partial": false, "at": [4], "point": "5형식 사역동사: make + 목적어 + 동사원형(feel) 사용 (to부정사 to feel 불가)", "topic": "5형식 사역동사", "memo": "make + 목적어 + 동사원형(feel) 사용 (to부정사 to feel 불가)"}]}, {"n": 3, "tag": null, "en": "The words who we choose can influence our thoughts, emotions, and friendly.", "ko": "우리가 선택하는 말은 우리의 생각, 감정, 그리고 우정에 영향을 미칠 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "who", "right": "which", "partial": false, "at": [2], "point": "목적격 관계대명사: 선행사가 사물(words)이므로 who가 아닌 which(또는 that) 사용", "topic": "목적격 관계대명사", "memo": "선행사가 사물(words)이므로 who가 아닌 which(또는 that) 사용"}, {"wrong": "friendly", "right": "friendships", "partial": false, "at": [11], "point": "병렬구조: 명사 thoughts, emotions와 병렬을 이루도록 명사 friendships 사용 (형용사 friendly 불가)", "topic": "병렬구조", "memo": "명사 thoughts, emotions와 병렬을 이루도록 명사 friendships 사용 (형용사 friendly 불가)"}]}, {"n": 4, "tag": null, "en": "Let's explore some common problems that students usual face.", "ko": "학생들이 흔히 겪는 일반적인 문제들을 함께 살펴봅시다.", "ok": false, "foot": [], "fixes": [{"wrong": "usual", "right": "usually", "partial": false, "at": [7], "point": "어법: 동사 face를 수식하므로 부사 usually 사용 (형용사 usual 불가)", "topic": "어법", "memo": "동사 face를 수식하므로 부사 usually 사용 (형용사 usual 불가)"}]}, {"n": 5, "tag": null, "en": "You will understand the amazed power of words.", "ko": "여러분은 말의 놀라운 힘을 이해하게 될 것입니다.", "ok": false, "foot": [], "fixes": [{"wrong": "amazed", "right": "amazing", "partial": false, "at": [4], "point": "어휘: 감정을 일으키는 대상(power)을 수식하므로 현재분사 amazing 사용 (감정을 느끼는 대상에 쓰는 amazed 불가)", "topic": "어휘", "memo": "감정을 일으키는 대상(power)을 수식하므로 현재분사 amazing 사용 (감정을 느끼는 대상에 쓰는 amazed 불가)"}]}, {"n": 6, "tag": null, "en": "“I didn’t do well during dance practice. I always messes up.”", "ko": "“나는 춤 연습을 잘 못했어. 난 항상 망쳐.”", "ok": false, "foot": ["1mess up 엉망으로 만들다, 실수하다"], "fixes": [{"wrong": "messes up", "right": "mess up", "partial": false, "at": [9], "point": "수일치: 주어 I에는 동사원형 mess 사용 (3인칭 단수 -s 불필요)", "topic": "수일치", "memo": "주어 I에는 동사원형 mess 사용 (3인칭 단수 -s 불필요)"}]}, {"n": 7, "tag": null, "en": "Negative words like “I always mess up” can make you feeling down and want to stop to try.", "ko": "“난 항상 망쳐”와 같은 부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만들 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "feeling", "right": "feel", "partial": false, "at": [10], "point": "5형식 사역동사: make + 목적어 + 동사원형(feel) 사용 (feeling 불가)", "topic": "5형식 사역동사", "memo": "make + 목적어 + 동사원형(feel) 사용 (feeling 불가)"}, {"wrong": "to try", "right": "trying", "partial": false, "at": [16], "point": "동명사: stop + v-ing는 “~을 그만두다”라는 뜻으로 문맥에 맞음 (stop to try는 “~하기 위해 멈추다”라는 다른 의미)", "topic": "동명사", "memo": "stop + v-ing는 “~을 그만두다”라는 뜻으로 문맥에 맞음 (stop to try는 “~하기 위해 멈추다”라는 다른 의미)"}]}, {"n": 8, "tag": null, "en": "Instead, encourage you with positive words.", "ko": "대신 긍정적인 말로 자신을 격려해 보세요.", "ok": false, "foot": [], "fixes": [{"wrong": "you", "right": "yourself", "partial": false, "at": [2], "point": "재귀대명사: 주어(생략된 you)와 목적어가 동일 대상이므로 재귀대명사 yourself 사용", "topic": "재귀대명사", "memo": "주어(생략된 you)와 목적어가 동일 대상이므로 재귀대명사 yourself 사용"}]}, {"n": 9, "tag": null, "en": "When you think positive, you can learn from your mistakes and improve your skills.", "ko": "긍정적인 사고를 할 때, 실수에서 배우고 실력을 향상할 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "positive", "right": "positively", "partial": false, "at": [3], "point": "어법: 동사 think를 수식하므로 부사 positively 사용 (형용사 positive 불가)", "topic": "어법", "memo": "동사 think를 수식하므로 부사 positively 사용 (형용사 positive 불가)"}]}, {"n": 10, "tag": null, "en": "Say It! “I didn’t dance well this time, but I’ll keep to practice and get gooder.”", "ko": "말해 보세요! “이번에는 춤을 잘 못 췄지만, 계속 연습해서 더 잘할 거야.”", "ok": false, "foot": [], "fixes": [{"wrong": "to practice", "right": "practicing", "partial": false, "at": [11], "point": "동명사: keep + v-ing “계속 ~하다” (to부정사 to practice 불가)", "topic": "동명사", "memo": "keep + v-ing “계속 ~하다” (to부정사 to practice 불가)"}, {"wrong": "gooder", "right": "better", "partial": false, "at": [15], "point": "비교급: good의 비교급은 불규칙 변화형 better 사용 (gooder는 잘못된 형태)", "topic": "비교급", "memo": "good의 비교급은 불규칙 변화형 better 사용 (gooder는 잘못된 형태)"}]}, {"n": 11, "tag": null, "en": "“Seongjun winned first place in the contest? He’s just too lucky.”", "ko": "“성준이가 대회에서 1등을 했다고? 그냥 운이 너무 좋네.”", "ok": false, "foot": [], "fixes": [{"wrong": "winned", "right": "won", "partial": false, "at": [1], "point": "어법: win의 과거형은 불규칙 변화형 won 사용 (winned는 잘못된 형태)", "topic": "어법", "memo": "win의 과거형은 불규칙 변화형 won 사용 (winned는 잘못된 형태)"}]}, {"n": 12, "tag": null, "en": "We easily say negative things about other when we feel jealous.", "ko": "우리는 질투를 느낄 때 다른 사람에 대해 부정적인 말을 쉽게 합니다.", "ok": false, "foot": ["1jealous 질투하는"], "fixes": [{"wrong": "other", "right": "others", "partial": false, "at": [6], "point": "어휘: 전치사 about 뒤에는 대명사 others 사용 (형용사 other는 뒤에 명사가 필요)", "topic": "어휘", "memo": "전치사 about 뒤에는 대명사 others 사용 (형용사 other는 뒤에 명사가 필요)"}]}, {"n": 13, "tag": null, "en": "But using negative words like “He’s just too lucky” doesn’t let you to grow.", "ko": "그러나 “그냥 운이 너무 좋네”와 같은 부정적인 말을 하는 건 여러분이 성장하지 못하게 합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "let you to grow", "right": "let you grow", "partial": false, "at": [10], "point": "5형식 사역동사: let + 목적어 + 동사원형(grow) 사용 (to부정사 to grow 불가)", "topic": "5형식 사역동사", "memo": "let + 목적어 + 동사원형(grow) 사용 (to부정사 to grow 불가)"}]}, {"n": 14, "tag": null, "en": "Instead, try to be happy for others and respecting their efforts.", "ko": "대신 다른 사람을 위해 기뻐하고 그들의 노력을 존중해 보세요.", "ok": false, "foot": [], "fixes": [{"wrong": "respecting", "right": "respect", "partial": false, "at": [8], "point": "병렬구조: to 다음의 두 동사원형 be와 respect가 병렬을 이루어야 함 (respecting 불가)", "topic": "병렬구조", "memo": "to 다음의 두 동사원형 be와 respect가 병렬을 이루어야 함 (respecting 불가)"}]}, {"n": 15, "tag": null, "en": "With positive words, you can learn from your friends, get along better, and focusing on you own growth.", "ko": "긍정적인 말을 통해 여러분은 친구에게서 배우고, 더 잘 지내며, 자신의 성장에 집중할 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "focusing", "right": "focus", "partial": false, "at": [13], "point": "병렬구조: 조동사 can 뒤 동사원형 learn, get, focus가 병렬을 이루어야 함 (focusing 불가)", "topic": "병렬구조", "memo": "조동사 can 뒤 동사원형 learn, get, focus가 병렬을 이루어야 함 (focusing 불가)"}, {"wrong": "you", "right": "your", "partial": false, "at": [15], "point": "인칭대명사 격: 명사 growth를 수식하므로 소유격 your 사용 (주격 you 불가)", "topic": "인칭대명사 격", "memo": "명사 growth를 수식하므로 소유격 your 사용 (주격 you 불가)"}]}, {"n": 16, "tag": null, "en": "Say It! “He did a great job. Good for him! I’ll try hardly, too!”", "ko": "말해 보세요! “그가 정말 잘했어. 잘됐다! 나도 열심히 할 거야!”", "ok": false, "foot": [], "fixes": [{"wrong": "hardly", "right": "hard", "partial": false, "at": [12], "point": "어휘: “열심히”라는 뜻의 부사는 hard 사용 (hardly는 “거의 ~않다”라는 뜻의 부사)", "topic": "어휘", "memo": "“열심히”라는 뜻의 부사는 hard 사용 (hardly는 “거의 ~않다”라는 뜻의 부사)"}]}, {"n": 17, "tag": null, "en": "“We lost the game because of your mistake. Its your fault.”", "ko": "“우리는 네 실수 때문에 게임에서 졌어. 네 잘못이야.”", "ok": false, "foot": ["1fault 잘못, 책임"], "fixes": [{"wrong": "Its", "right": "It’s", "partial": false, "at": [8], "point": "어휘: It is의 축약형은 It’s 사용 (Its는 소유격 대명사)", "topic": "어휘", "memo": "It is의 축약형은 It’s 사용 (Its는 소유격 대명사)"}]}, {"n": 18, "tag": null, "en": "When things go wrongly, we sometimes blame others.", "ko": "일이 잘못되었을 때 우리는 가끔 다른 사람을 비난하기도 합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "wrongly", "right": "wrong", "partial": false, "at": [3], "point": "어법: go는 상태를 나타내는 연결동사로 형용사 보어 wrong 사용 (부사 wrongly 불가)", "topic": "어법", "memo": "go는 상태를 나타내는 연결동사로 형용사 보어 wrong 사용 (부사 wrongly 불가)"}]}, {"n": 19, "tag": null, "en": "However, negative words like “It’s your fault” can hurts there feelings and damage your friendship.", "ko": "하지만 “네 잘못이야”와 같은 부정적인 말은 상대방의 감정을 상하게 하고 우정을 해칠 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "hurts", "right": "hurt", "partial": false, "at": [8], "point": "어법: 조동사 can 뒤에는 동사원형 hurt 사용", "topic": "어법", "memo": "조동사 can 뒤에는 동사원형 hurt 사용"}, {"wrong": "there", "right": "their", "partial": false, "at": [9], "point": "어휘: 소유격 their와 장소를 나타내는 there를 혼동하지 않도록 주의 — 여기서는 소유격 their 필요", "topic": "어휘", "memo": "소유격 their와 장소를 나타내는 there를 혼동하지 않도록 주의 — 여기서는 소유격 their 필요"}]}, {"n": 20, "tag": null, "en": "Instead, show your support and cheer up them.", "ko": "대신 지지를 보내고 그들을 응원해 주세요.", "ok": false, "foot": [], "fixes": [{"wrong": "cheer up them", "right": "cheer them up", "partial": false, "at": [5], "point": "어법: 목적어가 대명사(them)일 때는 구동사 사이에 위치 — cheer them up (cheer up them 불가)", "topic": "어법", "memo": "목적어가 대명사(them)일 때는 구동사 사이에 위치 — cheer them up (cheer up them 불가)"}]}, {"n": 21, "tag": null, "en": "Positive words will make your team developing strong teamwork and perform more better next time.", "ko": "긍정적인 말은 여러분의 팀이 강한 팀워크를 키우고 다음에는 더 잘할 수 있게 할 것입니다.", "ok": false, "foot": ["1teamwork 팀워크, 협동"], "fixes": [{"wrong": "developing", "right": "develop", "partial": false, "at": [6], "point": "5형식 사역동사: make + 목적어 + 동사원형(develop) 사용 (developing 불가)", "topic": "5형식 사역동사", "memo": "make + 목적어 + 동사원형(develop) 사용 (developing 불가)"}, {"wrong": "more better", "right": "better", "partial": false, "at": [11], "point": "비교급: good/well의 비교급 better에는 more를 중복해서 쓰지 않음 (more better 불가)", "topic": "비교급", "memo": "good/well의 비교급 better에는 more를 중복해서 쓰지 않음 (more better 불가)"}]}, {"n": 22, "tag": null, "en": "Say It! “You’re a team member which I trust. Let’s keep do our best together, and we’ll win the next game.”", "ko": "말해 보세요! “너는 내가 믿는 팀원이야. 함께 계속 최선을 다하면 다음 게임에서 이길 수 있을 거야.”", "ok": false, "foot": [], "fixes": [{"wrong": "which", "right": "whom", "partial": false, "at": [6], "point": "목적격 관계대명사: 선행사가 사람(team member)이므로 which가 아닌 whom(또는 who) 사용", "topic": "목적격 관계대명사", "memo": "선행사가 사람(team member)이므로 which가 아닌 whom(또는 who) 사용"}, {"wrong": "do", "right": "doing", "partial": false, "at": [11], "point": "동명사: keep + v-ing “계속 ~하다” (동사원형 do 불가)", "topic": "동명사", "memo": "keep + v-ing “계속 ~하다” (동사원형 do 불가)"}]}, {"n": 23, "tag": null, "en": "In the end, words have the power changing our opinions, actions, and relationships.", "ko": "결국, 말은 우리의 의견, 행동, 그리고 관계를 바꿀 수 있는 힘을 가지고 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "changing", "right": "to change", "partial": false, "at": [7], "point": "to부정사의 형용사적 용법: 명사 power를 수식하는 to부정사 to change 사용 (동명사 changing 불가)", "topic": "to부정사의 형용사적 용법", "memo": "명사 power를 수식하는 to부정사 to change 사용 (동명사 changing 불가)"}]}, {"n": 24, "tag": null, "en": "When you feel upsetting about yourself or the people around you, use positive words.", "ko": "자신이나 주변 사람들 때문에 기분이 상할 때, 긍정적인 말을 사용하세요.", "ok": false, "foot": [], "fixes": [{"wrong": "upsetting", "right": "upset", "partial": false, "at": [3], "point": "어휘: 감정을 “느끼는” 주체(you)를 설명하므로 과거분사형 upset 사용 (감정을 일으키는 대상에 쓰는 upsetting 불가)", "topic": "어휘", "memo": "감정을 “느끼는” 주체(you)를 설명하므로 과거분사형 upset 사용 (감정을 일으키는 대상에 쓰는 upsetting 불가)"}]}, {"n": 25, "tag": null, "en": "You can learn, growth, and understand better.", "ko": "여러분은 배우고, 성장하고, 더 잘 이해할 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "growth", "right": "grow", "partial": false, "at": [3], "point": "어법: 조동사 can 뒤에는 동사원형 grow가 와야 함 (명사 growth 불가) — learn, grow, understand의 병렬구조", "topic": "어법", "memo": "조동사 can 뒤에는 동사원형 grow가 와야 함 (명사 growth 불가) — learn, grow, understand의 병렬구조"}]}, {"n": 26, "tag": null, "en": "Your words shape your world.", "ko": "여러분의 말이 여러분의 세상을 만듭니다.", "ok": true, "foot": ["1shape (모양·성격 등을) 형성하다"], "fixes": []}];var PP=[["Words have power.", "말에는 힘이 있습니다.", 0], ["They can make us feel good or bad.", "말은 우리를 기분 좋거나 나쁘게 만들 수 있습니다.", 0], ["The words which we choose can influence our thoughts, emotions, and friendships.", "우리가 선택하는 말은 우리의 생각, 감정, 그리고 우정에 영향을 미칠 수 있습니다.", 0], ["Let's explore some common problems that students usually face.", "학생들이 흔히 겪는 일반적인 문제들을 함께 살펴봅시다.", 0], ["You will understand the amazing power of words.", "여러분은 말의 놀라운 힘을 이해하게 될 것입니다.", 0], ["“I didn’t do well during dance practice. I always mess up.”", "“나는 춤 연습을 잘 못했어. 난 항상 망쳐.”", 0], ["Negative words like “I always mess up” can make you feel down and want to stop trying.", "“난 항상 망쳐”와 같은 부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만들 수 있습니다.", 0], ["Instead, encourage yourself with positive words.", "대신 긍정적인 말로 자신을 격려해 보세요.", 0], ["When you think positively, you can learn from your mistakes and improve your skills.", "긍정적인 사고를 할 때, 실수에서 배우고 실력을 향상할 수 있습니다.", 0], ["Say It! “I didn’t dance well this time, but I’ll keep practicing and get better.”", "말해 보세요! “이번에는 춤을 잘 못 췄지만, 계속 연습해서 더 잘할 거야.”", 0], ["“Seongjun won first place in the contest? He’s just too lucky.”", "“성준이가 대회에서 1등을 했다고? 그냥 운이 너무 좋네.”", 0], ["We easily say negative things about others when we feel jealous.", "우리는 질투를 느낄 때 다른 사람에 대해 부정적인 말을 쉽게 합니다.", 0], ["But using negative words like “He’s just too lucky” doesn’t let you grow.", "그러나 “그냥 운이 너무 좋네”와 같은 부정적인 말을 하는 건 여러분이 성장하지 못하게 합니다.", 0], ["Instead, try to be happy for others and respect their efforts.", "대신 다른 사람을 위해 기뻐하고 그들의 노력을 존중해 보세요.", 0], ["With positive words, you can learn from your friends, get along better, and focus on your own growth.", "긍정적인 말을 통해 여러분은 친구에게서 배우고, 더 잘 지내며, 자신의 성장에 집중할 수 있습니다.", 0], ["Say It! “He did a great job. Good for him! I’ll try hard, too!”", "말해 보세요! “그가 정말 잘했어. 잘됐다! 나도 열심히 할 거야!”", 0], ["“We lost the game because of your mistake. It’s your fault.”", "“우리는 네 실수 때문에 게임에서 졌어. 네 잘못이야.”", 0], ["When things go wrong, we sometimes blame others.", "일이 잘못되었을 때 우리는 가끔 다른 사람을 비난하기도 합니다.", 0], ["However, negative words like “It’s your fault” can hurt their feelings and damage your friendship.", "하지만 “네 잘못이야”와 같은 부정적인 말은 상대방의 감정을 상하게 하고 우정을 해칠 수 있습니다.", 0], ["Instead, show your support and cheer them up.", "대신 지지를 보내고 그들을 응원해 주세요.", 0], ["Positive words will make your team develop strong teamwork and perform better next time.", "긍정적인 말은 여러분의 팀이 강한 팀워크를 키우고 다음에는 더 잘할 수 있게 할 것입니다.", 0], ["Say It! “You’re a team member whom I trust. Let’s keep doing our best together, and we’ll win the next game.”", "말해 보세요! “너는 내가 믿는 팀원이야. 함께 계속 최선을 다하면 다음 게임에서 이길 수 있을 거야.”", 0], ["In the end, words have the power to change our opinions, actions, and relationships.", "결국, 말은 우리의 의견, 행동, 그리고 관계를 바꿀 수 있는 힘을 가지고 있습니다.", 0], ["When you feel upset about yourself or the people around you, use positive words.", "자신이나 주변 사람들 때문에 기분이 상할 때, 긍정적인 말을 사용하세요.", 0], ["You can learn, grow, and understand better.", "여러분은 배우고, 성장하고, 더 잘 이해할 수 있습니다.", 0], ["Your words shape your world.", "여러분의 말이 여러분의 세상을 만듭니다.", 0]];var RNUM=42;var TITLE_EN="The Power of Words";var PASS_EN=["The Power of Words", "Words have power. They can make us feel good or bad. The words which we choose can influence our thoughts, emotions, and friendships. Let's explore some common problems that students usually face. You will understand the amazing power of words. “I didn’t do well during dance practice. I always mess up.” Negative words like “I always mess up” can make you feel down and want to stop trying. Instead, encourage yourself with positive words. When you think positively, you can learn from your mistakes and improve your skills. Say It! “I didn’t dance well this time, but I’ll keep practicing and get better.” “Seongjun won first place in the contest? He’s just too lucky.” We easily say negative things about others when we feel jealous. But using negative words like “He’s just too lucky” doesn’t let you grow. Instead, try to be happy for others and respect their efforts. With positive words, you can learn from your friends, get along better, and focus on your own growth. Say It! “He did a great job. Good for him! I’ll try hard, too!” “We lost the game because of your mistake. It’s your fault.” When things go wrong, we sometimes blame others. However, negative words like “It’s your fault” can hurt their feelings and damage your friendship. Instead, show your support and cheer them up. Positive words will make your team develop strong teamwork and perform better next time. Say It! “You’re a team member whom I trust. Let’s keep doing our best together, and we’ll win the next game.” In the end, words have the power to change our opinions, actions, and relationships. When you feel upset about yourself or the people around you, use positive words. You can learn, grow, and understand better. Your words shape your world."];var PASS_KO=["말의 힘", "말에는 힘이 있습니다. 말은 우리를 기분 좋거나 나쁘게 만들 수 있습니다. 우리가 선택하는 말은 우리의 생각, 감정, 그리고 우정에 영향을 미칠 수 있습니다. 학생들이 흔히 겪는 일반적인 문제들을 함께 살펴봅시다. 여러분은 말의 놀라운 힘을 이해하게 될 것입니다. “나는 춤 연습을 잘 못했어. 난 항상 망쳐.” “난 항상 망쳐”와 같은 부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만들 수 있습니다. 대신 긍정적인 말로 자신을 격려해 보세요. 긍정적인 사고를 할 때, 실수에서 배우고 실력을 향상할 수 있습니다. 말해 보세요! “이번에는 춤을 잘 못 췄지만, 계속 연습해서 더 잘할 거야.” “성준이가 대회에서 1등을 했다고? 그냥 운이 너무 좋네.” 우리는 질투를 느낄 때 다른 사람에 대해 부정적인 말을 쉽게 합니다. 그러나 “그냥 운이 너무 좋네”와 같은 부정적인 말을 하는 건 여러분이 성장하지 못하게 합니다. 대신 다른 사람을 위해 기뻐하고 그들의 노력을 존중해 보세요. 긍정적인 말을 통해 여러분은 친구에게서 배우고, 더 잘 지내며, 자신의 성장에 집중할 수 있습니다. 말해 보세요! “그가 정말 잘했어. 잘됐다! 나도 열심히 할 거야!” “우리는 네 실수 때문에 게임에서 졌어. 네 잘못이야.” 일이 잘못되었을 때 우리는 가끔 다른 사람을 비난하기도 합니다. 하지만 “네 잘못이야”와 같은 부정적인 말은 상대방의 감정을 상하게 하고 우정을 해칠 수 있습니다. 대신 지지를 보내고 그들을 응원해 주세요. 긍정적인 말은 여러분의 팀이 강한 팀워크를 키우고 다음에는 더 잘할 수 있게 할 것입니다. 말해 보세요! “너는 내가 믿는 팀원이야. 함께 계속 최선을 다하면 다음 게임에서 이길 수 있을 거야.” 결국, 말은 우리의 의견, 행동, 그리고 관계를 바꿀 수 있는 힘을 가지고 있습니다. 자신이나 주변 사람들 때문에 기분이 상할 때, 긍정적인 말을 사용하세요. 여러분은 배우고, 성장하고, 더 잘 이해할 수 있습니다. 여러분의 말이 여러분의 세상을 만듭니다."];var DG=[{"dlg": [["G", "Junsu. You look worried. What’s the matter?", "준수야. 너 걱정이 있어 보여. 무슨 일이야?"], ["B", "Mina’s upset and not talking to me. Can you give me some advice?", "미나가 화가 나서 나랑 말을 안 해. 조언 좀 해 줄 수 있어?"], ["G", "Okay. Let me help you. What happened?", "그래. 내가 도와줄게. 무슨 일이 있었는데?"], ["B", "I said terrible things about her favorite band in front of everyone.", "내가 모두 앞에서 미나가 가장 좋아하는 밴드에 대해 심한 말을 했어."], ["G", "Oh, no! You know she’s really into them. Did you say sorry to her?", "오, 이런! 미나가 그 밴드를 정말 좋아하는 거 알잖아. 미나한테 사과했어?"], ["B", "No, but I want to. What should I do?", "아니, 하지만 사과하고 싶어. 어떻게 해야 할까?"], ["G", "I think you should tell her you’re sorry and you didn’t mean to hurt her feelings.", "미나한테 미안하다고, 그리고 기분을 상하게 하려던 게 아니었다고 말해야 할 것 같아."], ["B", "Do you think she’ll feel better?", "그러면 미나 기분이 나아질까?"], ["G", "Of course. Don’t worry.", "물론이지. 걱정하지 마."], ["B", "Okay, I’ll do that. Thanks, Cindy.", "알겠어, 그렇게 할게. 고마워, Cindy."]], "qs": [{"n": 1, "q": "위 대화의 주제로 알맞은 것은?", "o": ["Mina’s reason for being upset", "how to become a good friend", "a popular band among teenagers", "advice on apologizing to a friend", "how to avoid hurting a friend’s feelings"], "a": 3, "evs": [["B: No, but I want to. What should I do?", "아니, 하지만 사과하고 싶어. 어떻게 해야 할까?"], ["G: I think you should tell her you’re sorry and you didn’t mean to hurt her feelings.", "미나한테 미안하다고, 그리고 기분을 상하게 하려던 게 아니었다고 말해야 할 것 같아."]], "ev": ["B: No, but I want to. What should I do?", "아니, 하지만 사과하고 싶어. 어떻게 해야 할까?"], "memo": ["B: No, but I want to. What should I do?  (아니, 하지만 사과하고 싶어. 어떻게 해야 할까?)", "G: I think you should tell her you’re sorry and you didn’t mean to hurt her feelings.  (미나한테 미안하다고, 그리고 기분을 상하게 하려던 게 아니었다고 말해야 할 것 같아.)"], "ans": "advice on apologizing to a friend"}]}, {"dlg": [["B", "You look down today. What’s the matter?", "너 오늘 기운이 없어 보여. 무슨 일이야?"], ["G", "Minji is mad at me, but I don’t know why.", "민지가 나한테 화가 났는데, 왜 그런지 모르겠어."], ["B", "Hmm. I think you should talk to her.", "음. 민지랑 이야기해 봐야 할 것 같아."], ["G", "Okay, I will.", "알겠어, 그럴게."]], "qs": [{"n": 2, "q": "What is the girl’s problem?", "o": ["She doesn’t want to talk to Minji.", "She argued with her best friend yesterday.", "She doesn’t know how to make Minji smile.", "She doesn’t know how to say sorry to Minji.", "She doesn’t know the reason for Minji’s anger."], "a": 4, "evs": [["G: Minji is mad at me, but I don’t know why.", "민지가 나한테 화가 났는데, 왜 그런지 모르겠어."]], "ev": ["G: Minji is mad at me, but I don’t know why.", " function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})}

 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';

function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}

var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
