<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}

.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":"지원 · 한국","en":"Welcome! I'm Jiwon from Korea.","ko":"어서 와! 나는 한국의 지원이야.","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"Me favorite food is tteokguk. It is an traditional food that we eat in New Year's Day.","ko":"내가 가장 좋아하는 음식은 떡국이야. 그것은 우리가 설날에 먹는 전통 음식이지.","ok":false,"foot":[],"fixes":[{"wrong":"Me","right":"My","partial":false,"at":[0],"point":"인칭대명사의 소유격: favorite food 앞에는 소유격 My 사용","topic":"인칭대명사의 소유격","memo":"favorite food 앞에는 소유격 My 사용"},{"wrong":"an","right":"a","partial":false,"at":[7],"point":"관사 a/an: 자음 소리 traditional 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 traditional 앞에는 a 사용"},{"wrong":"in","right":"on","partial":false,"at":[13],"point":"기본전치사: 특정한 날 앞에는 전치사 on 사용","topic":"기본전치사","memo":"특정한 날 앞에는 전치사 on 사용"}]},{"n":3,"tag":null,"en":"While people are eating it, they wish for a good, long life. Can you share some special dishes from a festival in you country?","ko":"사람들은 떡국을 먹으면서 건강하게 오래 살기를 기원해. 너희 나라 축제에서 먹는 특별한 음식 몇 가지를 알려 줄래?","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[22],"point":"인칭대명사의 소유격: country 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"country 앞에는 소유격 your 사용"}]},{"n":4,"tag":"Olivia · 캐나다","en":"Hi, I'm Olivia. I live in Quebec, Canada.","ko":"안녕, 나는 Olivia야. 나는 캐나다의 퀘벡에 살아.","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":null,"en":"Every spring, we holds maple syrup festivals. People gets *sap from maple trees and boil it to make maple syrup.","ko":"매년 봄에 우리는 메이플시럽 축제를 열어. 사람들은 단풍나무에서 수액을 채취하여 메이플시럽을 만들기 위해 그것을 끓여.","ok":false,"foot":[],"fixes":[{"wrong":"holds","right":"hold","partial":false,"at":[3],"point":"주어와 동사의 수일치: 주어 we는 hold (holds 아님)","topic":"주어와 동사의 수일치","memo":"주어 we는 hold (holds 아님)"},{"wrong":"gets","right":"get","partial":false,"at":[8],"point":"주어와 동사의 수일치: 주어 People(복수)는 get (gets 아님)","topic":"주어와 동사의 수일치","memo":"주어 People(복수)는 get (gets 아님)"}]},{"n":6,"tag":null,"en":"While the festivals, we enjoy pancakes with the syrup. Some people even drink it by itselves!","ko":"축제 동안, 시럽을 곁들인 팬케이크를 즐겨 먹어. 어떤 사람들은 시럽만 마시기도 해!","ok":false,"foot":[],"fixes":[{"wrong":"While","right":"During","partial":false,"at":[0],"point":"전치사와 접속사: 명사(구)가 오면 전치사 During 사용","topic":"전치사와 접속사","memo":"명사(구)가 오면 전치사 During 사용"},{"wrong":"itselves","right":"itself","partial":false,"at":[15],"point":"재귀대명사: 단수 it의 재귀대명사는 itself 사용","topic":"재귀대명사","memo":"단수 it의 재귀대명사는 itself 사용"}]},{"n":7,"tag":null,"en":"We enjoy maple candy, too. People also calls it \"sugar on snow.\"","ko":"우리는 메이플 사탕도 즐겨 먹어. 사람들은 그 사탕을 '눈 위의 설탕'이라고도 불러.","ok":false,"foot":[],"fixes":[{"wrong":"calls","right":"call","partial":false,"at":[7],"point":"3인칭 단수 현재형: 주어 People(복수)에는 call 사용","topic":"3인칭 단수 현재형","memo":"주어 People(복수)에는 call 사용"}]},{"n":8,"tag":null,"en":"To make it, just pour hotly syrup onto snow and wrap it around an stick. It's sweet and softly!","ko":"그것을 만들려면 눈 위에 뜨거운 시럽을 붓고 막대에 감기만 하면 돼. 그것은 달콤하고 부드러워!","ok":false,"foot":[],"fixes":[{"wrong":"hotly","right":"hot","partial":false,"at":[5],"point":"형용사와 부사: 명사 syrup 앞에는 형용사 hot 사용","topic":"형용사와 부사","memo":"명사 syrup 앞에는 형용사 hot 사용"},{"wrong":"an","right":"a","partial":false,"at":[13],"point":"관사 a/an: 자음 소리 stick 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 stick 앞에는 a 사용"},{"wrong":"softly","right":"soft","partial":false,"at":[18],"point":"형용사와 부사: be동사 뒤 보어 자리에는 형용사 soft 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어 자리에는 형용사 soft 사용"}]},{"n":9,"tag":"Ahmed · 이집트","en":"Hello. My name is Ahmed.","ko":"안녕. 내 이름은 Ahmed야.","ok":true,"foot":[],"fixes":[]},{"n":10,"tag":null,"en":"I lives in Cairo, Egypt. I will introduces my country's oldest festival, Sham El-Nessim.","ko":"나는 이집트의 카이로에 살아. 나는 우리나라의 가장 오래된 축제인 샴 엘 네심(Sham El-Nessim)을 소개할게.","ok":false,"foot":[],"fixes":[{"wrong":"lives","right":"live","partial":false,"at":[1],"point":"3인칭 단수 현재형: 주어 I에는 live 사용","topic":"3인칭 단수 현재형","memo":"주어 I에는 live 사용"},{"wrong":"introduces","right":"introduce","partial":false,"at":[7],"point":"조동사 뒤 동사원형: will 뒤에는 introdu :[]}];var PP=[["Jiwon","지원",1],["Welcome!","어서 와!",1],["I'm Jiwon from Korea.","나는 한국의 지원이야.",0],["My favorite food is tteokguk.","내가 가장 좋아하는 음식은 떡국이야.",0],["It is a traditional food that we eat on New Year's Day.","그것은 우리가 설날에 먹는 전통 음식이지.",0],["While people are eating it, they wish for a good, long life.","사람들은 떡국을 먹으면서 건강하게 오래 살기를 기원해.",0],["Can you share some special dishes from a festival in your country?","너희 나라 축제에서 먹는 특별한 음식 몇 가지를 알려 줄래?",0],["Sugar on Snow","눈 위의 설탕",1],["Hi, I'm Olivia.","안녕, 나는 Olivia야.",1],["I live in Quebec, Canada.","나는 캐나다의 퀘벡에 살아.",0],["Every spring, we hold maple syrup festivals.","매년 봄에 우리는 메이플시럽 축제를 열어.",0],["People get *sap from maple trees and boil it to make maple syrup.","사람들은 단풍나무에서 수액을 채취하여 메이플시럽을 만들기 위해 그것을 끓여.",0],["During the festivals, we enjoy pancakes with the syrup.","축제 동안, 시럽을 곁들인 팬케이크를 즐겨 먹어.",0],["Some people even drink it by itself!","어떤 사람들은 시럽만 마시기도 해!",0],["We enjoy maple candy, too.","우리는 메이플 사탕도 즐겨 먹어.",0],["People also call it \"sugar on snow.\"","사람들은 그 사탕을 '눈 위의 설탕'이라고도 불러.",0],["To make it, just pour hot syrup onto snow and wrap it around a stick.","그것을 만들려면 눈 위에 뜨거운 시럽을 붓고 막대에 감기만 하면 돼.",0],["It's sweet and soft!","그것은 달콤하고 부드러워!",0],["Smelling the Spring Wind","봄바람의 향기 맡기",1],["Hello.","안녕.",1],["My name is Ahmed.","내 이름은 Ahmed야.",0],["I live in Cairo, Egypt.","나는 이집트의 카이로에 살아.",0],["I will introduce my country's oldest festival, Sham El-Nessim.","나는 우리나라의 가장 오래된 축제인 샴 엘 네심(Sham El-Nessim)을 소개할게.",0],["It means \"smelling the spring wind.\"","이는 '봄바람의 향기 맡기'라는 뜻이야.",0],["The Egyptians whom you can see in our old paintings also enjoyed this festival.","우리의 옛 그림에서 볼 수 있는 이집트 사람들 또한 이 축제를 즐겼어.",0],["To celebrate the beginning of spring, we spend all day outside.","봄의 시작을 기념하기 위해서, 우리는 하루 종일 밖에서 시간을 보내.",0],["We go on picnics and enjoy our traditional meals.","우리는 소풍을 가서 전통 음식을 맛있게 먹어.",0],["The most important food is fesikh, a kind of fish dish that many Egyptians love.","가장 중요한 음식은 페시크(fesikh)인데, 많은 이집트 사람들이 아주 좋아하는 생선 요리의 한 종류야.",0],["My favorite food is colorful eggs.","내가 가장 좋아하는 음식은 알록달록한 달걀이야.",0],["I like the rainbow ones!","나는 무지개색 달걀을 좋아해!",0]];var RNUM=16;var TITLE_EN="Food Brings the World Together";var PASS_EN=["Food Brings the World Together","Jiwon","Welcome! I'm Jiwon from Korea. My favorite food is tteokguk. It is a traditional food that we eat on New Year's Day. While people are eating it, they wish for a good, long life. Can you share some special dishes from a festival in your country?","Sugar on Snow","Hi, I'm Olivia. I live in Quebec, Canada. Every spring, we hold maple syrup festivals. People get *sap from maple trees and boil it to make maple syrup. During the festivals, we enjoy pancakes with the syrup. Some people even drink it by itself! We enjoy maple candy, too. People also call it \"sugar on snow.\" To make it, just pour hot syrup onto snow and wrap it around a stick. It's sweet and soft!","Smelling the Spring Wind","Hello. My name is Ahmed. I live in Cairo, Egypt. I will introduce my country's oldest festival, Sham El-Nessim. It means \"smelling the spring wind.\" The Egyptians whom you can see in our old paintings also enjoyed this festival. To celebrate the beginning of spring, we spend all day outside. We go on picnics and enjoy our traditional meals. The most important food is fesikh, a kind of fish dish that many Egyptians love. My favorite food is colorful eggs. I like the rainbow ones!"];var PASS_KO=["음식은 전 세계 사람들을 하나로 이어 줘","지원","어서 와! 나는 한국의 지원이야. 내가 가장 좋아하는 음식은 떡국이야. 그것은 우리가 설날에 먹는 전통 음식이지. 사람들은 떡국을 먹으면서 건강하게 오래 살기를 기원해. 너희 나라 축제에서 먹는 특별한 음식 몇 가지를 알려 줄래?","눈 위의 설탕","안녕, 나는 Olivia야. 나는 캐나다의 퀘벡에 살아. 매년 봄에 우리는 메이플시럽 축제를 열어. 사람들은 단풍나무에서 수액을 채취하여 메이플시럽을 만들기 위해 그것을 끓여. 축제 동안, 시럽을 곁들인 팬케이크를 즐겨 먹어. 어떤 사람들은 시럽만 마시기도 해! 우리는 메이플 사탕도 즐겨 먹어. 사람들은 그 사탕을 '눈 위의 설탕'이라고도 불러. 그것을 만들려면 눈 위에 뜨거운 시럽을 붓고 막대에 감기만 하면 돼. 그것은 달콤하고 부드러워!","봄바람의 향기 맡기","안녕. 내 이름은 Ahmed야. 나는 이집트의 카이로에 살아. 나는 우리나라의 가장 오래된 축제인 샴 엘 네심(Sham El-Nessim)을 소개할게. 이는 '봄바람의 향기 맡기'라는 뜻이야. 우리의 옛 그림에서 볼 수 있는 이집트 사람들 또한 이 축제를 즐겼어. 봄의 시작을 기념하기 위해서, 우리는 하루 종일 밖에서 시간을 보내. 우리는 소풍을 가서 전통 음식을 맛있게 먹어. 가장 중요한 음식은 페시크(fesikh)인데, 많은 이집트 사람들이 아주 좋아하는 생선 요리의 한 종류야. 내가 가장 좋아하는 음식은 알록달록한 달걀이야. 나는 무지개색 달걀을 좋아해!"];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["여자아이는 올해 시드니로 여행을 갔다.","시드니는 호주에서 가장 작은 도시이다.","남자아이는 시드니가 호주의 수도라고 생각했다.","호주의 수도는 시드니이다.","남자아이는 호주의 수도가 캔버라라는 것을 이미 알고 있었다."],"a":2,"ans":"남자아이는 시드니가 호주의 수도라고 생각했다.","evs":[["Then Sydney must be the capital city of Australia.","그럼 시드니가 호주의 수도겠구나."],["I’m afraid that’s not right. It’s Canberra.","유감이지만 그건 맞지 않아. 수도는 캔버라야."]],"ev":["Then Sydney must be the capital city of Australia.","그럼 시드니가 호주의 수도겠구나."],"ow":["오답 ✕ — 여자아이는 'I went on a trip to Sydney last year.'(나는 작년에 시드니로 여행을 갔어.)라고 했는데, 이 보기는 올해라고 해서 틀림.","오답 ✕ — 남자아이가 'Sydney is the biggest city in Australia, right?'(시드니는 호주에서 가장 큰 도시지, 그렇지?)라고 묻자 여자아이가 'Yes, it is.'(응, 맞아.)라고 했으므로 가장 작은 도시라는 말은 틀림.","정답 ○ — 남자아이는 'Then Sydney must be the capital city of Australia.'(그럼 시드니가 호주의 수도겠구나.)라고 말했으므로 시드니가 수도라고 생각한 것이 맞음.","오답 ✕ — 여자아이가 'I’m afraid that’s not right. It’s Canberra.'(유감이지만 그건 맞지 않아. 수도는 캔버라야.)라고 바로잡았으므로 수도는 시드니가 아니라 캔버라이다.","오답 ✕ — 남자아이는 'Oh, I see! I didn’t know that.'(아, 그렇구나! 나는 그걸 몰랐어.)라고 했으므로 이미 알고 있었다는 말은 틀림."],"memo":["정답 ③: 남자아이는 시드니가 호주의 수도라고 생각했다.","근거: Then Sydney must be the capital city of Australia.(그럼 시드니가 호주의 수도겠구나.)","함정: ④ 수도는 시드니가 아니라 캔버라(Canberra)이다. ✕"],"why":"남자아이는 시드니를 수도로 착각했고, 여자아이가 캔버라라고 바로잡아 준다."}],"dlg":[["G","I went on a trip to Sydney last year. It’s a beautiful city.","나는 작년에 시드니로 여행을 갔어. 아름다운 도시야."],["B","Sydney is the biggest city in Australia, right?","시드니는 호주에서 가장 큰 도시지, 그렇지?"],["G","Yes, it is. It’s also one of the most famous cities in the world.","응, 맞아. 그곳은 세계에서 가장 유명한 도시 중 하나이기도 해."],["B","Then Sydney must be the capital city of Australia.","그럼 시드니가 호주의 수도겠구나."],["G","I’m afraid that’s not right. It’s Canberra.","유감이지만 그건 맞지 않아. 수도는 캔버라야."],["B","Oh, I see! I didn’t know that.","아, 그렇구나! 나는 그걸 몰랐어."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하는 것은?","o":["Tom은 오늘 아침을 먹었다.","오늘 점심 메뉴는 프라이드치킨이다.","점심 메뉴가 피자로 바뀌었다.","수진이는 점심 메뉴를 듣고 실망했다.","점심에는 딸기 주스가 나오지 않는다."],"a":2,"ans":"점심 메뉴가 피자로 바뀌었다.","evs":[["I don’t think so. They changed the menu to pizza.","아닌 것 같아. 메뉴가 피자로 바뀌었어."],["Don’t be. It’s chicken pizza. It also comes with strawberry juice!","실망하지 마. 치킨 피자야. 딸기 주스도 같이 나와!"]],"ev":["I don’t think so. They changed the menu to pizza.","아닌 것 같아. 메뉴가 피자로 바뀌었어."],"ow":["오답 ✕ — Tom은 'I didn’t have breakfast today.'(오늘 아침을 안 먹었어.)라고 했는데, 이 보기는 아침을 먹었다고 해서 틀림.","오답 ✕ — Tom이 들은 소문은 프라이드치킨이었지만, 수진이가 'They changed the menu to pizza.'(메뉴가 피자로 바뀌었어.)라고 했으므로 틀림.","정답 ○ — 수진이가 'They changed the menu to pizza.'(메뉴가 피자로 바뀌었어.)라고 말했으므로 맞음.","오답 ✕ — 'Really? I’m so disappointed.'(정말? 너무 실망이다.)라고 한 사람은 Tom이다. 수진이는 오히려 'Don’t be.'(실망하지 마.)라고 달랬으므로 틀림.","오답 ✕ — 수진이가 'It also comes with strawberry juice!'(딸기 주스도 같이 나와!)라고 했으므로 딸기 주스가 나온다. 이 보기는 반대라서 틀림."],"memo":["정답 ③: 점심 메뉴가 프라이드치킨에서 피자로 바뀌었다.","근거: They changed the menu to pizza.(메뉴가 피자로 바뀌었어.)","함정: ④ 실망한 사람은 수진이가 아니라 Tom이다. ✕"],"why":"점심 메뉴가 프라이드치킨에서 (치킨) 피자로 바뀌었다는 내용이다."}],"dlg":[["B","Sujin, I’m so hungry. I didn’t have breakfast today.","수진아, 나 너무 배고파. 오늘 아침을 안 먹었어."],["G","It’s already 12. We’re having lunch soon, Tom.","벌써 12시야. 우리 곧 점심 먹을 거야, Tom."],["B","I heard we’re having fried chicken for lunch today. Is that true?","오늘 점심으로 프라이드치킨이 나온다고 들었어. 그게 사실이야?"],["G","I don’t think so. They changed the menu to pizza.","아닌 것 같아. 메뉴가 피자로 바뀌었어."],["B","Really? I’m so disappointed.","정말? 너무 실망이다."],["G","Don’t be. It’s chicken pizza. It also comes with strawberry juice!","실망하지 마. 치킨 피자야. 딸기 주스도 같이 나와!"]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Lucy는 주말에 가족과 함께 태국 음식점에 갔다.","그 음식점은 이미 아주 인기가 많다.","Lucy는 음식점에서 한 시간 정도 기다렸다.","Lucy는 팟타이를 먹었다.","똠얌꿍은 새우가 들어간 맵고 신 수프이다."],"a":3,"ans":"Lucy는 팟타이를 먹었다.","evs":[["It was good. I ate tom yum goong.","맛있었어. 나는 똠얌꿍을 먹었어."],["I’m afraid that’s not right. That’s pad Thai. Tom yum goong is a hot and sour soup with shrimp.","유감이지만 그건 맞지 않아. 그건 팟타이야. 똠얌꿍은 새우가 들어간 맵고 신 수프야."]],"ev":["It was good. I ate tom yum goong.","맛있었어. 나는 똠얌꿍을 먹었어."],"ow":["오답 ✕ — 이 보기는 대화와 일치한다. 'I went to a new Thai restaurant near the park with my family.'(가족과 함께 새로 생긴 태국 음식점에 갔어.)라고 했다.","오답 ✕ — 이 보기는 대화와 일치한다. 'I heard the restaurant is already very popular.'(그 음식점이 벌써 아주 인기가 많다고 들었어.)에 Lucy가 'Yes, it is.'(응, 맞아.)라고 답했다.","오답 ✕ — 이 보기는 대화와 일치한다. Lucy가 'We waited for about an hour.'(우리는 한 시간 정도 기다렸어.)라고 했다.","정답 ○ — Lucy가 먹은 것은 'I ate tom yum goong.'(나는 똠얌꿍을 먹었어.)이다. 팟타이는 Tom이 똠얌꿍이라고 착각해서 말한 요리라 일치하지 않는 보기이다.","오답 ✕ — 이 보기는 대화와 일치한다. 'Tom yum goong is a hot and sour soup with shrimp.'(똠얌꿍은 새우가 들어간 맵고 신 수프야.)라고 했다."],"memo":["정답 ④: Lucy가 먹은 것은 팟타이가 아니라 똠얌꿍이다.","근거: I ate tom yum goong.(나는 똠얌꿍을 먹었어.)","함정: pad Thai는 볶음면 요리, tom yum goong은 맵고 신 수프!"],"why":"Lucy는 똠얌꿍을 먹었고, 팟타이는 새우가 들어간 볶음면 요리라고 바로잡는다."},{"n":4,"q":"위 대화의 내용을 요약한 문장의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["soup - shrimp","soup - eggs","noodle - shrimp","salad - shrimp","rice - pork"],"a":0,"ans":"soup - shrimp","evs":[["I’m afraid that’s not right. That’s pad Thai. Tom yum goong is a hot and sour soup with shrimp.","유감이지만 그건 맞지 않아. 그건 팟타이야. 똠얌꿍은 새우가 들어간 맵고 신 수프야."],["I’ve heard of it. It’s a fried noodle dish with shrimp, right?","그거 들어 봤어. 새우가 들어간 볶음면 요리지, 그렇지?"]],"ev":["I’m afraid that’s not right. That’s pad Thai. Tom yum goong is a hot and sour soup with shrimp.","유감이지만 그건 맞지 않아. 그건 팟타이야. 똠얌꿍은 새우가 들어간 맵고 신 수프야."],"ow":["정답 ○ — 'Tom yum goong is a hot and sour soup with shrimp.'(똠얌꿍은 새우가 들어간 맵고 신 수프야.)이므로 soup과 shrimp가 맞음.","오답 ✕ — soup은 맞지만 'a hot and sour soup with shrimp'(새우가 들어간 맵고 신 수프)라고 했으므로 재료는 eggs(달걀)가 아니라 shrimp이다.","오답 ✕ — 'It’s a fried noodle dish with shrimp'(새우가 들어간 볶음면 요리)는 Tom이 잘못 말한 것이고, 여자아이는 'That’s pad Thai.'(그건 팟타이야.)라고 바로잡았다. 똠얌꿍은 noodle(면)이 아니라 soup이다.","오답 ✕ — 재료 shrimp는 맞지만 똠얌꿍은 'a hot and sour soup'(맵고 신 수프)이지 샐러드가 아니다.","오답 ✕ — 똠얌꿍은 'soup with shrimp'(새우가 들어간 수프)이므로 rice(밥)와 pork(돼지고기)는 모두 대화에 나오지 않아 틀림."],"memo":["정답 soup - shrimp: 똠얌꿍은 새우가 들어간 맵고 신 수프이다.","근거: Tom yum goong is a hot and sour soup with shrimp.(똠얌꿍은 새우가 들어간 맵고 신 수프야.)","함정: 볶음면(fried noodle) 요리는 똠얌꿍이 아니라 팟타이!"],"why":"똠얌꿍은 볶음면이 아니라 새우가 들어간 수프라는 핵심을 묻는다.","sum":"Tom yum goong is not a fried noodle dish but a hot and sour (A)______ with (B)______.","lab":"완성된 요약문 : "}],"dlg":[["B","Lucy, how was your weekend?","Lucy, 주말 어땠어?"],["G","I went to a new Thai restaurant near the park with my family.","나는 가족과 함께 공원 근처에 새로 생긴 태국 음식점에 갔어."],["B","Oh, I heard the restaurant is already very popular. Is that true?","오, 그 음식점이 벌써 아주 인기가 많다고 들었어. 그게 사실이야?"],["G","Yes, it is. We waited for about an hour.","응, 맞아. 우리는 한 시간 정도 기다렸어."],["B","Really? How was the food?","정말? 음식은 어땠어?"],["G","It was good. I ate tom yum goong.","맛있었어. 나는 똠얌꿍을 먹었어."],["B","I’ve heard of it. It’s a fried noodle dish with shrimp, right?","그거 들어 봤어. 새우가 들어간 볶음면 요리지, 그렇지?"],["G","I’m afraid that’s not right. That’s pad Thai. Tom yum goong is a hot and sour soup with shrimp.","유감이지만 그건 맞지 않아. 그건 팟타이야. 똠얌꿍은 새우가 들어간 맵고 신 수프야."],["B","Oh, I see. Their names are confusing.","아, 그렇구나. 이름들이 헷갈리네."]]},{"qs":[{"n":5,"q":"위 대화의 내용으로 알 수 있는 것은?","o":["멕시코는 메이플 시럽으로 유명하다.","캐나다는 메이플 시럽으로 유명하다.","여자아이의 이모는 캐나다에 산다.","여자아이는 메이플 시럽을 직접 만들었다.","남자아이는 이모에게 메이플 시럽을 선물로 받았다."],"a":1,"ans":"캐나다는 메이플 시럽으로 유명하다.","evs":[["I’m afraid that’s not right. Canada is famous for maple syrup.","유감이지만 그건 맞지 않아. 캐나다가 메이플 시럽으로 유명해."],["Look! This is maple syrup from my aunt. Mexico is famous for it.","봐! 이건 우리 이모가 준 메이플 시럽이야. 멕시코는 이걸로 유명해."]],"ev":["I’m afraid that’s not right. Canada is famous for maple syrup.","유감이지만 그건 맞지 않아. 캐나다가 메이플 시럽으로 유명해."],"ow":["오답 ✕ — 여자아이가 'Mexico is famous for it.'(멕시코는 이걸로 유명해.)라고 했지만 남자아이가 'I’m afraid that’s not right.'(유감이지만 그건 맞지 않아.)라고 바로잡았으므로 틀림.","정답 ○ — 남자아이가 'Canada is famous for maple syrup.'(캐나다가 메이플 시럽으로 유명해.)라고 말했으므로 맞음.","오답 ✕ — 'This is maple syrup from my aunt.'(이건 우리 이모가 준 메이플 시럽이야.)라고만 했고 이모가 캐나다에 산다는 말은 대화에 없음.","오답 ✕ — 'This is maple syrup from my aunt.'(이모가 준 메이플 시럽)라고 했으므로 이모에게 받은 것이지 직접 만든 것이 아니다.","오답 ✕ — 시럽을 이모에게 받은 사람은 여자아이이다. 'Look! This is maple syrup from my aunt.'(이건 우리 이모가 준 메이플 시럽이야.)라고 말한 것은 여자아이이므로 틀림."],"memo":["정답 ②: 메이플 시럽으로 유명한 나라는 캐나다이다.","근거: Canada is famous for maple syrup.(캐나다가 메이플 시럽으로 유명해.)","함정: 멕시코는 여자아이가 착각한 나라! ① ✕"],"why":"메이플 시럽으로 유명한 나라는 멕시코가 아니라 캐나다이다."}],"dlg":[["G","Look! This is maple syrup from my aunt. Mexico is famous for it.","봐! 이건 우리 이모가 준 메이플 시럽이야. 멕시코는 이걸로 유명해."],["B","I’m afraid that’s not right. Canada is famous for maple syrup.","유감이지만 그건 맞지 않아. 캐나다가 메이플 시럽으로 유명해."],["G","Oh, I got it. Thanks for telling me.","아, 알겠어. 알려 줘서 고마워."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하지 않는 것은?","o":["지원이가 가장 좋아하는 음식은 설날에 먹는 떡국이다.","떡국을 먹는 것은 건강과 장수를 기원하는 것이다.","Olivia는 매년 가을에 열리는 메이플 시럽 축제를 소개한다.","메이플 시럽은 단풍나무의 수액으로 만들어진다.","메이플 사탕은 눈 위에서 만들어진다."],"a":2,"ans":"Olivia는 매년 가을에 열리는 메이플 시럽 축제를 소개한다.","evs":[["Every spring, we hold maple syrup festivals.","매년 봄에 우리는 메이플시럽 축제를 열어."],["It is a traditional food that we eat on New Year's Day.","그것은 우리가 설날에 먹는 전통 음식이지."]],"ev":["Every spring, we hold maple syrup festivals.","매년 봄에 우리는 메이플시럽 축제를 열어."],"ow":["오답 ✕ — 이 보기는 글과 일치한다. 'My favorite food is tteokguk.'(내가 가장 좋아하는 음식은 떡국이야.)와 'a traditional food that we eat on New Year's Day'(설날에 먹는 전통 음식)라고 했다.","오답 ✕ — 이 보기는 글과 일치한다. 'While people are eating it, they wish for a good, long life.'(떡국을 먹으면서 건강하게 오래 살기를 기원해.)라고 했다.","정답 ○ — Olivia는 'Every spring, we hold maple syrup festivals.'(매년 봄에 메이플시럽 축제를 열어.)라고 했는데 보기는 가을이라고 해서 일치하지 않음.","오답 ✕ — 이 보기는 글과 일치한다. 'People get sap from maple trees and boil it to make maple syrup.'(단풍나무에서 수액을 채취해 끓여서 메이플시럽을 만들어.)라고 했다.","오답 ✕ — 이 보기는 글과 일치한다. 'just pour hot syrup onto snow and wrap it around a stick'(눈 위에 뜨거운 시럽을 붓고 막대에 감아)라고 했으므로 눈 위에서 만든다."],"memo":["정답 ③: Olivia의 메이플시럽 축제는 가을이 아니라 봄에 열린다.","근거: Every spring, we hold maple syrup festivals.(매년 봄에 메이플시럽 축제를 열어.)","함정: 계절 바꿔치기(spring → 가을) ✕"],"why":"메이플시럽 축제는 매년 봄에 열린다."},{"n":7,"q":"윗글의 내용을 요약한 문장의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["festivals - snow","festivals - water","parties - snow","markets - ice","classes - sugar"],"a":0,"ans":"festivals - snow","evs":[["Every spring, we hold maple syrup festivals.","매년 봄에 우리는 메이플시럽 축제를 열어."],["To make it, just pour hot syrup onto snow and wrap it around a stick.","그것을 만들려면 눈 위에 뜨거운 시럽을 붓고 막대에 감기만 하면 돼."]],"ev":["Every spring, we hold maple syrup festivals.","매년 봄에 우리는 메이플시럽 축제를 열어."],"ow":["정답 ○ — 'we hold maple syrup festivals'(메이플시럽 축제를 열어)와 'pour hot syrup onto snow'(눈 위에 뜨거운 시럽을 부어)에 맞는 festivals와 snow이다.","오답 ✕ — festivals는 맞지만 'pour hot syrup onto snow'(눈 위에 뜨거운 시럽을 부어)라고 했으므로 water(물)는 틀림.","오답 ✕ — snow는 맞지만 글에는 'we hold maple syrup festivals'(메이플시럽 축제를 열어)라고 했지 파티(parties)를 연다는 말이 없음.","오답 ✕ — 글에 시장(markets)은 나오지 않고 'onto snow'(눈 위에)라고 했으므로 ice(얼음)도 틀림.","오답 ✕ — 글에 수업(classes)은 나오지 않고, sugar는 'sugar on snow'라는 사탕 이름의 일부일 뿐 시럽을 붓는 곳은 snow(눈)이다."],"memo":["정답 festivals - snow: 봄에 메이플시럽 축제를 열고, 눈 위에 시럽을 부어 사탕을 만든다.","근거: To make it, just pour hot syrup onto snow(그것을 만들려면 눈 위에 뜨거운 시럽을 부어)","함정: sugar on snow는 사탕 이름! 붓는 곳은 snow"],"why":"메이플시럽 축제와 눈 위에 시럽을 부어 만드는 사탕 'sugar on snow'가 핵심이다.","sum":"In Quebec, people hold maple syrup (A)______ every spring, and they make maple candy by pouring hot syrup onto (B)______.","lab":"완성된 요약문 : "}],"pp":[["Jiwon","지원"],["Welcome!","어서 와!"],["I'm Jiwon from Korea.","나는 한국의 지원이야."],["My favorite food is tteokguk.","내가 가장 좋아하는 음식은 떡국이야."],["It is a traditional food that we eat on New Year's Day.","그것은 우리가 설날에 먹는 전통 음식이지."],["While people are eating it, they wish for a good, long life.","사람들은 떡국을 먹으면서 건강하게 오래 살기를 기원해."],["Can you share some special dishes from a festival in your country?","너희 나라 축제에서 먹는 특별한 음식 몇 가지를 알려 줄래?"],["Sugar on Snow","눈 위의 설탕"],["Hi, I'm Olivia.","안녕, 나는 Olivia야."],["I live in Quebec, Canada.","나는 캐나다의 퀘벡에 살아."],["Every spring, we hold maple syrup festivals.","매년 봄에 우리는 메이플시럽 축제를 열어."],["People get *sap from maple trees and boil it to make maple syrup.","사람들은 단풍나무에서 수액을 채취하여 메이플시럽을 만들기 위해 그것을 끓여."],["During the festivals, we enjoy pancakes with the syrup.","축제 동안, 시럽을 곁들인 팬케이크를 즐겨 먹어."],["Some people even drink it by itself!","어떤 사람들은 시럽만 마시기도 해!"],["We enjoy maple candy, too.","우리는 메이플 사탕도 즐겨 먹어."],["People also call it \"sugar on snow.\"","사람들은 그 사탕을 '눈 위의 설탕'이라고도 불러."],["To make it, just pour hot syrup onto snow and wrap it around a stick.","그것을 만들려면 눈 위에 뜨거운 시럽을 붓고 막대에 감기만 하면 돼."],["It's sweet and soft!","그것은 달콤하고 부드러워!"]]},{"qs":[{"n":8,"q":"윗글의 목적으로 알맞은 것은?","o":["to introduce my favorite dishes","to promote the spring festival in Egypt","to set up the date for the spring picnic","to talk about the oldest festival in Egypt","to inform others of the beginning of the festival"],"a":3,"ans":"to talk about the oldest festival in Egypt","evs":[["I will introduce my country's oldest festival, Sham El-Nessim.","나는 우리나라의 가장 오래된 축제인 샴 엘 네심(Sham El-Nessim)을 소개할게."],["It means \"smelling the spring wind.\"","이는 '봄바람의 향기 맡기'라는 뜻이야."]],"ev":["I will introduce my country's oldest festival, Sham El-Nessim.","나는 우리나라의 가장 오래된 축제인 샴 엘 네심(Sham El-Nessim)을 소개할게."],"ow":["오답 ✕ — Ahmed가 좋아하는 음식('My favorite food is colorful eggs.')이 나오긴 하지만 글의 목적은 가장 오래된 축제를 소개하는 것이다. 음식 소개는 일부일 뿐.","오답 ✕ — Ahmed는 축제를 소개할 뿐 홍보하려는 것이 아니다. 'I will introduce my country's oldest festival'(우리나라의 가장 오래된 축제를 소개할게)이라고 했다.","오답 ✕ — 'We go on picnics'(우리는 소풍을 가)는 있지만 소풍 날짜를 정하는 글이 아님.","정답 ○ — 'I will introduce my country's oldest festival, Sham El-Nessim.'(우리나라의 가장 오래된 축제인 샴 엘 네심을 소개할게.)이므로 이집트의 가장 오래된 축제를 이야기하는 것이 목적임.","오답 ✕ — 'To celebrate the beginning of spring'(봄의 시작을 기념하기 위해서)은 축제의 이유일 뿐, 축제가 시작되었음을 알리려는 글이 아님."],"memo":["정답 ④: 이집트에서 가장 오래된 축제에 대해 이야기하려는 글이다.","근거: I will introduce my country's oldest festival, Sham El-Nessim.(우리나라의 가장 오래된 축제를 소개할게.)","함정: ①은 음식, ③은 소풍 날짜 — 글의 일부일 뿐 ✕"],"why":"Ahmed가 이집트에서 가장 오래된 축제 샴 엘 네심을 소개하는 글이다."},{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["샴 엘 네심은 가을이 시작됨을 기념하는 축제이다.","옛 이집트 사람들은 이
