사람들 중 다수는 알려지지 않았다."]],"w":"2번 문장에서 우주 비행사 본인들은 금세 유명해졌지만 프로젝트에 참여한 다른 사람들 중 다수는 알려지지 않았어요. 선택지 1)은 존슨이 먼저 유명해졌다고 하고, 2)는 모든 사람이 알려지지 않았다고 하며, 3)은 다른 참여자가 거의 없었다고 해서 모두 틀려요.","c":4},"h":"282874a01e"},{"n":9,"t":"sum","q":"Due to her (A) work, she was (B) the Presidential Medal of Freedom in 2015.","ko":"(A) 업적 덕분에, 그녀는 2015년에 대통령 훈장을 (B).","oko":["(A) 놀라운 / (B) 거절당했다","(A) 단순한 / (B) 받았다","(A) 비밀스러운 / (B) 거절당했다","(A) 비밀스러운 / (B) 받았다","(A) 놀라운 / (B) 받았다"],"opts":["(A) amazing / (B) refused","(A) simple / (B) awarded","(A) secret / (B) refused","(A) secret / (B) awarded","(A) amazing / (B) awarded"],"r":{"a":"5) (A) amazing / (B) awarded ((A) 놀라운 / (B) 받았다)","ev":"15번 문장","s":[[15,"Due to her amazing work, she was awarded the Presidential Medal of Freedom in 2015.","놀라운 업적 덕분에, 그녀는 2015년에 대통령 훈장을 받았다."]],"c":5,"k":null},"h":"e5566ff2b5"},{"n":10,"t":"fill","q":"After [A] from college, she [B] NASA’s West Area Computing Unit.","ko":"대학을 [A] 후, 그녀는 NASA의 West Area Computing Unit에 [B].","bank":["graduating","joined","graduate","join","left","solved"],"bko":{"graduating":"졸업하는","joined":"합류했다","graduate":"졸업하다","join":"합류하다","left":"떠났다","solved":"풀었다"},"r":{"a":"[A] graduating, [B] joined","ev":"7번 문장","s":[[7,"After graduating from college, she joined NASA’s West Area Computing Unit.","대학을 졸업한 후, 그녀는 NASA의 West Area Computing Unit에 합류했다."]],"w":"[A]는 전치사 After 뒤라서 동명사 graduating이 와요. [B]는 과거의 일이므로 과거형 joined가 알맞아요. graduate와 join은 형태가 맞지 않고, left와 attended는 ‘합류했다’는 뜻이 아니에요.","c":null},"h":"877e4a0bbb"}]},{"u":9,"id":"ch1-09-4","no":4,"ko":"수능:ON 긴 어구 빈칸 추론","items":[{"n":1,"t":"tf","q":"The V-sign is one of the most common hand gestures in selfies.","ko":"V사인은 셀카에서 가장 흔한 손동작 중 하나이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The V-sign, or the peace sign, is one of the most common hand gestures in selfies.","V사인, 또는 평화 사인은 셀카에서 가장 흔한 손동작 중 하나이다."]],"w":"3번 문장 그대로예요. one of the most common ~는 '가장 흔한 ~ 중 하나'라는 뜻이에요.","c":"T"},"h":"f94b55eb6d"},{"n":2,"t":"tf","q":"Fingerprints can be extracted only from close-up photos of fingertips.","ko":"지문은 손가락 끝을 근접 촬영한 사진에서만 추출될 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Although close-up photos of people’s fingertips are an obvious source, fingerprints can surprisingly be extracted from photos taken from a distance of up to three meters.","비록 사람들의 손가락 끝을 근접 촬영한 사진들이 확실한 출처이지만, 놀랍게도 최대 3미터 거리에서 찍힌 사진들에서도 지문은 추출될 수 있다."]],"w":"6번에서 근접 촬영 사진은 확실한 출처이지만, 최대 3미터 거리에서 찍은 사진에서도 지문을 추출할 수 있다고 해요. only가 틀렸어요.","c":"F"},"h":"dc08409eb2"},{"n":3,"t":"tf","q":"The writer suggests turning your hand around while making a V-sign.","ko":"필자는 V사인을 만드는 동안 손을 뒤집을 것을 제안한다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"It would be wise to make small changes, such as turning your hand around while making a V-sign.","V사인을 만드는 동안 손을 뒤집는 것과 같이 작은 변화를 주는 것이 현명할 것이다."]],"w":"14번에서 작은 변화의 예로 V사인을 만드는 동안 손을 뒤집는 것을 들어요. It would be wise to ~는 ~하는 것이 현명하다는 조언이에요.","c":"T"},"h":"a697e64dca"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, cybersecurity experts warn people against using it.)","ko":"하지만, 사이버 보안 전문가들은 그것을 사용하지 말라고 경고한다.","opts":["초대하다","칭찬하다","경고하다","돕다"],"word":"warn","r":{"a":"3) 경고하다","ev":"4번 문장","s":[[4,"However, cybersecurity experts warn people against using it.","하지만, 사이버 보안 전문가들은 그것을 사용하지 말라고 경고한다."]],"w":"흔한 포즈라고 하다가 However로 뒤집히는 문장이에요. 전문가들이 쓰지 말라고 ‘경고한다’는 뜻이고, warn A against -ing는 'A에게 ~하지 말라고 경고하다'예요.","c":3},"h":"4b65697008"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Sensitive data on a smartphone that is unlocked by fingerprints, such as banking applications, would be at risk.)","ko":"지문으로 잠금을 해제하는 은행 응용 프로그램과 같은 스마트폰에 있는 민감한 정보는 위험에 노출될 수 있다.","opts":["민감한","유명한","값싼","오래된"],"word":"Sensitive","r":{"a":"1) 민감한","ev":"8번 문장","s":[[8,"Sensitive data on a smartphone that is unlocked by fingerprints, such as banking applications, would be at risk.","지문으로 잠금을 해제하는 은행 응용 프로그램과 같은 스마트폰에 있는 민감한 정보는 위험에 노출될 수 있다."]],"w":"은행 앱처럼 새어 나가면 위험한 정보를 말하고, 뒤에 at risk(위험에 처한)가 이어져요. sensitive data는 '민감한 정보'예요.","c":1},"h":"baa6adfdb9"},{"n":6,"t":"ref","q":"What does the underlined \"Some\" refer to?\nSome even use AI to make clear fingerprints as though someone were pressing their finger on the phone sensor.","ko":"밑줄 친 Some이(가) 가리키는 것은?","sko":"어떤 것들은 마치 누군가가 휴대전화 센서에 손가락을 누르는 것처럼 지문을 선명하게 만들기 위해 심지어 AI를 사용한다.","opts":["일부 지문 사진들","일부 특수한 소프트웨어","일부 스마트폰 사용자들","일부 전문가들"],"r":{"a":"2) 일부 특수한 소프트웨어","ev":"10~11번 문장","s":[[10,"Specialized software would be needed to analyze images of fingertips.","손가락 끝의 이미지들을 분석하기 위해서는 특수한 소프트웨어가 필요할 것이다."],[11,"Some even use AI to make clear fingerprints as though someone were pressing their finger on the phone sensor.","어떤 것들은 마치 누군가가 휴대전화 센서에 손가락을 누르는 것처럼 지문을 선명하게 만들기 위해 심지어 AI를 사용한다."]],"w":"10번에서 지문 이미지를 분석하는 데 필요한 것은 specialized software예요. 11번의 Some 뒤에는 그 말이 생략되어 있어서, 일부 소프트웨어는 AI까지 쓴다는 뜻이에요.","c":2},"h":"6826e42a97"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That means a hacker only needs a photo from social media to steal personal data.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 해커가 개인 정보를 훔치기 위해 소셜 미디어에 있는 사진 한 장만 필요하다는 것을 의미한다.","opts":["해커는 개인 정보를 훔친 다음에야 소셜 미디어에 사진을 올린다는 뜻이다.","소셜 미디어에 개인 정보를 올리면 해커가 돈을 번다는 뜻이다.","소셜 미디어에 있는 사진은 해커가 쓸 수 없도록 자동으로 보호된다는 뜻이다.","해커가 개인 정보를 훔치는 데에는 소셜 미디어에 올라온 사진 한 장이면 충분하다는 뜻이다."],"r":{"a":"4) 해커가 개인 정보를 훔치는 데에는 소셜 미디어에 올라온 사진 한 장이면 충분하다는 뜻이다.","ev":"7번 문장","s":[[7,"That means a hacker only needs a photo from social media to steal personal data.","그것은 해커가 개인 정보를 훔치기 위해 소셜 미디어에 있는 사진 한 장만 필요하다는 것을 의미한다."]],"w":"That means는 앞 문장(6번)을 정리하는 말이고, 뒤에 that이 생략되어 있어요. only needs a photo는 '사진 한 장만 필요하다'이고, to steal은 '훔치기 위해'라는 목적이에요.","c":4},"h":"2d461c3dfa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["해커들은 지문을 분석하는 소프트웨어를 쉽게 구할 수 있다.","AI 소프트웨어는 사용자를 보호하려고 지문을 흐릿하게 만든다.","해커들은 이런 종류의 소프트웨어가 널리 사용되지 않아서 구하기 쉽지 않다.","지문을 훔치는 소프트웨어는 사이버 보안 전문가만 사용할 수 있다."],"opts":["Hackers can easily get the software that analyzes fingertip images.","AI software makes fingerprints blurry to protect users.","Hackers find it hard to get this kind of software because it is not widely available.","Only cybersecurity experts can use software that steals fingerprints."],"r":{"a":"3) Hackers find it hard to get this kind of software because it is not widely available.","ev":"12번 문장","s":[[12,"This kind of software is not widely available, so it’s not easy for hackers to get.","이런 종류의 소프트웨어는 널리 사용되지 않아서, 해커들이 구하기가 쉽지 않다."]],"w":"12번에서 이런 종류의 소프트웨어는 널리 사용되지 않아서 해커들이 구하기 쉽지 않다고 해요. 선택지 1)은 쉽게 구한다고 해서 반대이고, 2)는 11번에서 AI가 지문을 선명하게 만든다고 해서 틀리며, 4)는 본문에 없어요.","c":3},"h":"1f74c6a132"},{"n":9,"t":"sum","q":"Stealing fingerprints from photos is (A) because it requires special software, but people should still be (B) about sharing high-quality photos online.","ko":"사진에서 지문을 훔치는 것은 특수한 소프트웨어가 필요해서 (A), 그래도 사람들은 고화질 사진을 온라인에 공유하는 데 (B).","oko":["(A) 간단한 / (B) 조심하는","(A) 간단한 / (B) 부주의한","(A) 불가능한 / (B) 조심하는","(A) 어려운 / (B) 부주의한","(A) 어려운 / (B) 조심하는"],"opts":["(A) simple / (B) cautious","(A) simple / (B) careless","(A) impossible / (B) cautious","(A) difficult / (B) careless","(A) difficult / (B) cautious"],"r":{"a":"5) (A) difficult / (B) cautious","ev":"9번, 13번 문장","s":[[9,"However, stealing fingerprints is not simple.","하지만, 지문을 훔치는 것은 간단하지 않다."],[13,"Even so, people should be cautious of sharing high-quality photos of themselves online.","그렇기는 하지만, 사람들은 온라인에서 자신들의 고화질 사진들을 공유하는 데 주의해야 한다."]],"w":"9번에서 지문을 훔치는 것은 간단하지 않다고(어렵다고) 했고, 13번 Even so 뒤에서 그래도 고화질 사진을 공유할 때 조심해야 한다고 해요. 본문은 ‘불가능하다’가 아니라 ‘간단하지 않다’이고, 부주의해도 된다는 말은 없어요.","c":5},"h":"27f329d005"},{"n":10,"t":"fill","q":"Let’s [A] a selfie! What [B] will you make?","ko":"셀카를 [A]자! 당신은 어떤 [B]을(를) 취하겠는가?","bank":["take","pose","hackers","distance","sensors","unlocked"],"bko":{"take":"찍다","pose":"포즈","hackers":"해커들","distance":"거리","sensors":"센서들","unlocked":"잠금이 해제된"},"r":{"a":"[A] take (찍다), [B] pose (포즈)","ev":"1~2번 문장","s":[[1,"Let’s take a selfie!","셀카를 찍자!"],[2,"What pose will you make?","당신은 어떤 포즈를 취하겠는가?"]],"c":null,"k":null},"h":"e12fc39a4b"}]},{"u":10,"id":"ch1-10-1","no":1,"ko":"달의 특별한 변신","items":[{"n":1,"t":"tf","q":"We can always see the whole Moon from the Earth.","ko":"우리는 지구에서 달 전체를 항상 볼 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"As a result, we can sometimes see the whole Moon and other times see only part of it.","그 결과, 우리는 때로는 달 전체를 보고 다른 때에는 달의 일부만을 볼 수 있다."]],"w":"5번 문장에서 달 전체를 볼 때도 있고 일부만 볼 때도 있다고 해요. 항상 전체를 보는 것은 아니에요.","c":"F"},"h":"53fe2d3690"},{"n":2,"t":"tf","q":"A supermoon can look about 30 percent brighter than a normal full moon.","ko":"슈퍼문은 보통의 보름달보다 약 30% 더 밝아 보일 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"A supermoon can appear to be 14 percent bigger and 30 percent brighter than a normal full moon.","슈퍼문은 보통의 보름달보다 14% 더 크고 30% 더 밝아 보일 수 있다."]],"w":"10번 문장에서 슈퍼문은 14% 더 크고 30% 더 밝아 보일 수 있다고 해요.","c":"T"},"h":"3d57293921"},{"n":3,"t":"tf","q":"Most full moons are supermoons.","ko":"대부분의 보름달은 슈퍼문이다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Only about one out of every 14 full moons is a supermoon.","열네 번의 보름달 중에서 대략 한 번만이 슈퍼문이다."]],"w":"11번 문장에서 열네 번의 보름달 중 약 한 번만 슈퍼문이라고 해요. 대부분이 아니라 아주 드물어요.","c":"F"},"h":"5c3dd20628"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The Moon goes through phases.)","ko":"달은 여러 모습을 거친다.","opts":["속도","모습, 상","무게","온도"],"word":"phases","r":{"a":"2) 모습, 상","ev":"3번, 5번 문장","s":[[3,"The Moon goes through phases.","달은 여러 모습을 거친다."],[5,"As a result, we can sometimes see the whole Moon and other times see only part of it.","그 결과, 우리는 때로는 달 전체를 보고 다른 때에는 달의 일부만을 볼 수 있다."]],"w":"5번에서 달 전체가 보이기도 하고 일부만 보이기도 한다고 풀어 줘요. 그러니 phases는 달이 바뀌어 보이는 모습(상)이에요.","c":2},"h":"8cb45691b2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…if you have a chance to see one, don’t miss it!)","ko":"…슈퍼문을 볼 기회가 있다면 놓치지 마라!","opts":["위험","이유","걱정","기회"],"word":"chance","r":{"a":"4) 기회","ev":"12번 문장","s":[[12,"So, if you have a chance to see one, don’t miss it!","따라서 만약 당신이 슈퍼문을 볼 기회가 있다면, 놓치지 마라!"]],"w":"슈퍼문을 볼 chance가 있으면 놓치지 말라는 흐름이니 chance는 '기회'예요.","c":4},"h":"936f5cc6c8"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis means that the Moon’s distance from the Earth is constantly changing.","ko":"밑줄 친 This이(가) 가리키는 것은?","sko":"이것은 달의 지구로부터의 거리가 끊임없이 바뀌고 있음을 의미한다.","opts":["달이 완벽한 원이 아니라 타원에 가까운 모양으로 지구를 돈다는 것","우리가 때로는 달 전체를 본다는 것","태양과 달이 지구 반대편에 있다는 것","열네 번 중 한 번만 슈퍼문이 뜬다는 것"],"r":{"a":"1) 달이 완벽한 원이 아니라 타원에 가까운 모양으로 지구를 돈다는 것","ev":"7~8번 문장","s":[[7,"However, the Moon doesn’t move around the Earth in a perfect circle—the shape is more like an oval.","그러나 달은 완벽한 원으로 지구 주변을 돌지 않는다. 그 모양은 타원형에 더 가깝다."],[8,"This means that the Moon’s distance from the Earth is constantly changing.","이것은 달의 지구로부터의 거리가 끊임없이 바뀌고 있음을 의미한다."]],"c":1,"k":"This = 달이 타원에 가까운 모양으로 지구를 도는 것"},"pron":"This","h":"821be7420d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you have ever seen a full moon that seemed brighter and larger than normal, you probably saw a supermoon.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 당신이 평소보다 더 밝고 크게 보이는 보름달을 본 적이 있다면, 당신은 아마도 슈퍼문을 봤을 것이다.","opts":["평소보다 밝고 커 보이는 보름달을 본 적이 있다면, 아마 슈퍼문을 본 것이다.","평소보다 밝고 커 보이는 보름달은 언제나 슈퍼문이다.","평소보다 어둡고 작아 보이는 보름달을 보았다면, 슈퍼문을 본 것이다.","슈퍼문을 보려면 평소보다 밝고 큰 보름달이 뜰 때까지 기다려야 한다."],"r":{"a":"1) 평소보다 밝고 커 보이는 보름달을 본 적이 있다면, 아마 슈퍼문을 본 것이다.","ev":"1번 문장","s":[[1,"If you have ever seen a full moon that seemed brighter and larger than normal, you probably saw a supermoon.","만약 당신이 평소보다 더 밝고 크게 보이는 보름달을 본 적이 있다면, 당신은 아마도 슈퍼문을 봤을 것이다."]],"c":1,"k":null},"h":"0e80c6669e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["달의 지구로부터의 거리는 변하지 않는다.","보름달은 태양과 달이 지구 반대편에 있을 때 보인다.","달이 지구에서 가장 멀 때 보름달이 뜨면 슈퍼문이다.","슈퍼문은 보통의 보름달보다 14% 더 작아 보인다."],"opts":["The Moon’s distance from the Earth never changes.","A full moon appears when the Sun and the Moon are on opposite sides of the Earth.","If a full moon appears when the Moon is farthest from the Earth, it is a supermoon.","A supermoon looks 14 percent smaller than a normal full moon."],"r":{"a":"2) A full moon appears when the Sun and the Moon are on opposite sides of the Earth.","ev":"6번 문장","s":[[6,"We see a full moon when the Sun and the Moon are on opposite sides of the Earth.","태양과 달이 지구 반대편에 있을 때 우리는 보름달을 본다."]],"w":"6번 문장과 같은 내용이에요. 거리는 계속 바뀌고(8번), 슈퍼문은 가장 가까울 때 나타나며(9번), 14% 더 크게 보여요(10번).","c":2},"h":"e7c9130a5f"},{"n":9,"t":"sum","q":"If there is a full moon when the Moon is as (A) to the Earth as possible, it is (B) a supermoon.","ko":"달이 가능한 한 지구에 (A) 있을 때 보름달이 뜨면, 그것은 슈퍼문이라고 (B).","oko":["(A) 멀리 / (B) 불린다","(A) 가까이 / (B) 팔린다","(A) 가까이 / (B) 불린다","(A) 멀리 / (B) 팔린다","(A) 열려 / (B) 불린다"],"opts":["(A) far / (B) called","(A) close / (B) sold","(A) close / (B) called","(A) far / (B) sold","(A) open / (B) called"],"r":{"a":"3) (A) close / (B) called ((A) 가까이 / (B) 불린다)","ev":"9번 문장","s":[[9,"If there is a full moon when the Moon is as close to the Earth as possible, it is called a supermoon.","달이 가능한 한 지구에 가까울 때 보름달이 뜨면, 그것은 슈퍼문이라 불린다."]],"c":3,"k":null},"h":"d4e9aa3f03"},{"n":10,"t":"fill","q":"These [A] because the Moon [B] the Earth.","ko":"이들은 달이 지구를 [B]은(는) 이유로 [A].","bank":["occur","orbits","miss","seemed","changing","saw"],"bko":{"occur":"일어난다","orbits":"공전한다","miss":"놓치다","seemed":"~처럼 보였다","changing":"바뀌는","saw":"보았다"},"r":{"a":"[A] occur (일어난다), [B] orbits (공전한다)","ev":"4번 문장","s":[[4,"These occur because the Moon orbits the Earth.","이들은 달이 지구를 공전하기 때문에 일어난다."]],"c":null,"k":null},"h":"655c3be3b7"}]},{"u":10,"id":"ch1-10-2","no":2,"ko":"군중 속의 온기","items":[{"n":1,"t":"tf","q":"More than 200,000 people use the Mall of America every day.","ko":"20만 명이 넘는 사람들이 매일 몰 오브 아메리카를 이용한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In Sweden, more than 200,000 people use Stockholm’s main train station every day.","스웨덴에서는 매일 20만 명 이상의 사람들이 스톡홀름의 중앙역을 이용한다."]],"w":"4번 문장에서 매일 20만 명 넘게 이용하는 곳은 스톡홀름 중앙역이에요. 몰 오브 아메리카가 아니에요.","c":"F"},"h":"5b7285e79b"},{"n":2,"t":"tf","q":"The mall uses body heat from shoppers to help heat water.","ko":"그 쇼핑몰은 쇼핑객의 체온을 이용해 물을 데우는 데 도움을 얻는다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The mall recycles body heat from shoppers and uses it to help heat water that keeps the huge building warm.","이 쇼핑몰은 쇼핑객들에게서 나오는 체온을 재활용하여 그것을 대형 건물을 따뜻하게 유지하는 물을 데우는 데 도움이 되도록 사용한다."]],"w":"8번 문장에서 쇼핑객의 체온을 재활용해 물을 데우는 데 쓴다고 해요.","c":"T"},"h":"4d80996c8e"},{"n":3,"t":"tf","q":"Energy is cheap in places that have cold climates.","ko":"추운 기후의 지역에서 에너지는 저렴하다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Energy is expensive in places that have cold climates.","추운 기후의 지역에서 에너지는 비싸다."]],"w":"12번 문장에서 추운 기후의 지역에서는 에너지가 비싸다고 해요. 저렴하다는 것은 반대예요.","c":"F"},"h":"faa15f2a25"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…use crowds for a good purpose.)","ko":"…군중을 좋은 용도로 사용하는…","opts":["비용","거리","용도","시간"],"word":"purpose","r":{"a":"3) 용도","ev":"2번 문장","s":[[2,"But Swedish engineers have found a way to use crowds for a good purpose.","그런데 스웨덴 기술자들이 군중을 좋은 용도로 사용하는 방법을 알아냈다."]],"w":"군중이 불편하다는 말 뒤에 But으로 '좋은 purpose'라고 이어지니, 군중을 어떻게 쓸지 정하는 '용도'라는 뜻이에요.","c":3},"h":"01b2964035"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A similar system is used in the Mall of America…)","ko":"비슷한 시스템이 몰 오브 아메리카에서 사용된다…","opts":["비슷한","다른","새로운","큰"],"word":"similar","r":{"a":"1) 비슷한","ev":"7번 문장","s":[[7,"A similar system is used in the Mall of America in Minnesota.","비슷한 시스템이 미네소타에 있는 몰 오브 아메리카(Mall of America)에서 사용된다."]],"w":"스톡홀름 역의 시스템 이야기 다음에 몰에서도 사용된다고 하니 similar는 '비슷한'이에요.","c":1},"h":"c71fc39a55"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThere, it is reused by the building’s main heating system.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그곳에서, 그 물은 건물의 주요 난방 시스템에 의해 재사용된다.","opts":["사무용 건물","가열된 물","지하 탱크","쇼핑몰의 난방비"],"r":{"a":"2) 가열된 물","ev":"9번, 10번 문장","s":[[9,"After being stored in large underground tanks, the heated water is pumped through pipes to a new office building nearby.","커다란 지하 탱크에 저장된 후에, 가열된 물은 관을 통해 인근의 새 사무용 건물로 퍼 올려진다."],[10,"There, it is reused by the building’s main heating system.","그곳에서, 그 물은 건물의 주요 난방 시스템에 의해 재사용된다."]],"w":"10번의 There는 9번의 새 사무용 건물이고, 그곳의 난방 시스템이 다시 쓰는 것은 9번에서 관을 통해 퍼 올려진 가열된 물이에요.","c":2},"h":"39e75dface"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The heat in this water can then be used as a heat source.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 물의 열은 이후에 열 원료로 사용될 수 있다.","opts":["이 물은 열을 모두 잃은 뒤에야 쓸 수 있다.","이 물은 사람들의 체온을 식히는 데 쓰인다.","이 물에 담긴 열은 이후에 열 원료로 쓰일 수 있다.","이 물은 열을 만드는 기계를 움직이는 데 쓰인다."],"r":{"a":"3) 이 물에 담긴 열은 이후에 열 원료로 쓰일 수 있다.","ev":"6번 문장","s":[[6,"The heat in this water can then be used as a heat source.","이 물의 열은 이후에 열 원료로 사용될 수 있다."]],"w":"can then be used는 '그다음에 쓰일 수 있다'이고 as a heat source는 '열 원료로'예요. 물에 모인 열을 난방에 쓴다는 뜻이에요.","c":3},"h":"0bc7303469"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["몰 오브 아메리카는 스웨덴에 있다.","스톡홀름 중앙역을 이용하는 사람은 하루에 2만 명이 안 된다.","이 시스템은 사무용 건물의 난방비를 20% 줄여 준다.","가열된 물은 한 번 쓰고 버려진다."],"opts":["The Mall of America is located in Sweden.","Fewer than 20,000 people use Stockholm’s main train station every day.","The system reduces the cost of heating the office building by 20 percent.","The heated water is thrown away after one use."],"r":{"a":"3) The system reduces the cost of heating the office building by 20 percent. (이 시스템은 사무용 건물의 난방비를 20% 줄여 준다.)","ev":"11번 문장","s":[[11,"This reduces the cost of heating the office building by 20 percent.","이것은 사무용 건물의 난방비를 20% 정도 줄여 준다."]],"c":3,"k":null},"h":"a7f7f3ed63"},{"n":9,"t":"sum","q":"Being in a big crowd is often (A) and (B), but Swedish engineers have found a good way to use crowds.","ko":"군중 속에 있는 것은 흔히 (A) 그리고 (B) 일이지만, 스웨덴 기술자들은 군중을 좋은 용도로 쓸 방법을 찾아냈다.","oko":["(A) 편안한 / (B) 편리한","(A) 거북한 / (B) 편리한","(A) 거북한 / (B) 불편한","(A) 편안한 / (B) 불편한","(A) 신나는 / (B) 값싼"],"opts":["(A) comfortable / (B) convenient","(A) uncomfortable / (B) convenient","(A) uncomfortable / (B) inconvenient","(A) comfortable / (B) inconvenient","(A) exciting / (B) cheap"],"r":{"a":"3) (A) uncomfortable / (B) inconvenient ((A) 거북한 / (B) 불편한)","ev":"1~2번 문장","s":[[1,"Being in a big crowd of people is often uncomfortable and inconvenient.","많은 군중 속에 있는 것은 보통 거북하고 불편하다."],[2,"But Swedish engineers have found a way to use crowds for a good purpose.","그런데 스웨덴 기술자들이 군중을 좋은 용도로 사용하는 방법을 알아냈다."]],"c":3,"k":null},"h":"e73125b17d"},{"n":10,"t":"fill","q":"The station’s ventilation system [A] body heat and [B] it to large underground tanks of water.","ko":"역의 통풍 시스템은 체온을 [A] 그것을 커다란 지하 물탱크로 [B].","bank":["captures","moves","pays","invents","costs","expects"],"bko":{"captures":"붙잡다, 담아내다","moves":"옮기다","pays":"지불하다","invents":"발명하다","costs":"비용이 들다","expects":"기대하다"},"r":{"a":"[A] captures, [B] moves","ev":"5번 문장","s":[[5,"The station’s ventilation system captures body heat and moves it to large underground tanks of water.","이 역의 통풍 시스템은 체온을 담아서 그것을 커다란 지하 물탱크로 옮긴다."]],"w":"5번 문장 그대로 captures body heat and moves it to…예요. 주어가 단수(system)라서 동사에 -s가 붙은 captures, moves가 와요.","c":null},"h":"5de99fedea"}]},{"u":10,"id":"ch1-10-3","no":3,"ko":"달걀 속 숨겨진 과학","items":[{"n":1,"t":"tf","q":"A dark gray ring in a hard-boiled egg means that the egg is spoiled and unsafe to eat.","ko":"삶은 달걀의 어두운 회색 고리는 그 달걀이 상했고 먹기에 안전하지 않다는 뜻이다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"But you don’t have to throw it away, it is perfectly safe to consume.","하지만 그것은 먹기에 완전히 안전하므로 버릴 필요는 없다."]],"w":"3번 문장에서 버릴 필요가 없고 먹기에 완전히 안전하다고 해요.","c":"F"},"h":"ee21755ae1"},{"n":2,"t":"tf","q":"Egg yolks contain iron.","ko":"달걀노른자에는 철분이 들어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Egg yolks, on the other hand, contain many vitamins and minerals, including iron.","반면, 달걀노른자는 철분을 포함한 많은 비타민과 미네랄이 있다."]],"w":"7번 문장에서 노른자는 철분을 포함한 많은 비타민과 미네랄이 있다고 해요.","c":"T"},"h":"86fa2c1494"},{"n":3,"t":"tf","q":"The heat from boiling breaks the iron bonds in the egg white.","ko":"삶을 때의 열은 달걀흰자의 철 결합을 깨뜨린다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"When an egg is boiled, the heat causes the sulfur bonds in the egg white to break.","달걀이 삶아질 때, 열이 달걀흰자의 황 결합이 깨지는 것을 야기한다."]],"w":"8번 문장에서 열이 깨뜨리는 것은 흰자의 '황' 결합이에요. 철 결합이라는 말은 없어요.","c":"F"},"h":"e0cabb22b2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Although the color is harmless, you can prevent…)","ko":"비록 이 색깔은 해롭지 않지만, 당신은 …을 방지할 수 있다.","opts":["해로운","해롭지 않은","값비싼","불가능한"],"word":"harmless","r":{"a":"2) 해롭지 않은","ev":"3번, 10번 문장","s":[[3,"But you don’t have to throw it away, it is perfectly safe to consume.","하지만 그것은 먹기에 완전히 안전하므로 버릴 필요는 없다."],[10,"Although the color is harmless, you can prevent your eggs from turning gray.","비록 이 색깔은 해롭지 않지만, 당신은 달걀이 회색으로 변하는 것을 방지할 수 있다."]],"w":"3번에서 먹기에 안전하다고 했고, 10번 Although 뒤에서 그래도 막을 수 있다고 하니 harmless는 '해롭지 않은'이에요.","c":2},"h":"616885bd77"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If the egg is exposed to a high temperature for an extended period…)","ko":"만약 달걀이 높은 온도에 오랫동안 …","opts":["저장된","제거된","섞인","노출된"],"word":"exposed","r":{"a":"4) 노출된","ev":"9번 문장","s":[[9,"If the egg is exposed to a high temperature for an extended period, the sulfur reacts with the iron in the yolk, which turns the egg a greenish-gray color.","만약 달걀이 높은 온도에 오랫동안 노출되면, 황은 노른자에 있는 철분과 반응하는데, 이는 그 달걀을 녹회색으로 만든다."]],"w":"달걀이 높은 온도에 오랫동안 있게 된다는 흐름이에요. be exposed to는 '~에 노출되다'예요.","c":4},"h":"27b10aeb1b"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAvoid overcooking your eggs and immediately run them under cold water once they’re finished cooking.","ko":"밑줄 친 them이 가리키는 것은?","sko":"달걀을 너무 오래 삶는 것을 피하고, 조리되고 나면 즉시 찬물에 헹궈라.","opts":["황과 철","달걀흰자의 단백질","달걀들","찬물"],"r":{"a":"3) 달걀들","ev":"13번 문장","s":[[13,"Avoid overcooking your eggs and immediately run them under cold water once they’re finished cooking.","달걀을 너무 오래 삶는 것을 피하고, 조리되고 나면 즉시 찬물에 헹궈라."]],"w":"찬물에 헹구는 대상은 바로 앞의 your eggs(달걀)예요.","c":3},"h":"d4bfdc5f9a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The longer the egg remains hot, the more likely it is to turn gray.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"달걀이 더 오래 뜨거운 상태로 남아 있을수록, 회색으로 변할 가능성이 더 높다.","opts":["달걀이 뜨거운 상태로 오래 있을수록 회색으로 변할 가능성이 커진다.","달걀이 차가울수록 회색으로 변할 가능성이 커진다.","달걀이 회색으로 변할수록 더 오래 뜨거워진다.","달걀을 오래 두면 반드시 회색으로 변한다."],"r":{"a":"1) 달걀이 뜨거운 상태로 오래 있을수록 회색으로 변할 가능성이 커진다.","ev":"12번 문장","s":[[12,"The longer the egg remains hot, the more likely it is to turn gray.","달걀이 더 오래 뜨거운 상태로 남아 있을수록, 회색으로 변할 가능성이 더 높다."]],"w":"「the + 비교급, the + 비교급」은 '~할수록 더 …하다'예요. 뜨거운 시간이 길수록 회색으로 변할 가능성이 커져요.","c":1},"h":"46d6436c69"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["회색 고리는 달걀이 상했기 때문에 생긴다.","회색 고리는 황과 철 사이의 화학 반응 때문에 생긴다.","달걀을 찬물에 헹구면 회색 고리가 생긴다.","회색 고리는 달걀을 짧게 삶을 때만 생긴다."],"opts":["The gray ring appears because the egg has gone bad.","The gray ring is caused by a chemical reaction between sulfur and iron.","Running eggs under cold water makes the gray ring appear.","The gray ring appears only when an egg is boiled for a short time."],"r":{"a":"2) The gray ring is caused by a chemical reaction between sulfur and iron.","ev":"5번 문장","s":[[5,"The gray ring is the result of a chemical reaction between sulfur and iron.","그 회색 고리는 황과 철 사이의 화학 반응의 결과이다."]],"w":"5번 문장과 같은 내용이에요. 황은 흰자, 철은 노른자에 있고(6~7번), 찬물은 회색을 막는 방법이며(13번), 짧게 삶을 때가 아니라 오래 뜨거울 때 변해요(12번).","c":2},"h":"9412d451eb"},{"n":9,"t":"sum","q":"Egg whites are (A) of proteins, which are (B) by sulfur bonds.","ko":"달걀흰자는 단백질로 (A) 것이고, 그 단백질들은 황 결합으로 (B) 것이다.","oko":["(A) 없는 / (B) 연결된","(A) 구성된 / (B) 분리된","(A) 없는 / (B) 분리된","(A) 구성된 / (B) 연결된","(A) 없는 / (B) 덮인"],"opts":["(A) free / (B) connected","(A) composed / (B) separated","(A) free / (B) separated","(A) composed / (B) connected","(A) free / (B) covered"],"r":{"a":"4) (A) composed / (B) connected ((A) 구성된 / (B) 연결된)","ev":"6번 문장","s":[[6,"Egg whites are composed of proteins, which are connected by sulfur bonds.","달걀흰자는 황 결합으로 연결된 단백질로 구성되어 있다."]],"c":4,"k":null},"h":"9cab3b2d90"},{"n":10,"t":"fill","q":"Have you ever [A] open a hard-boiled egg and [B] a dark gray ring around the yolk?","ko":"삶은 달걀을 [A] 열고 노른자 주위에 어두운 회색 고리를 [B] 적이 있는가?","bank":["sliced","discovered","slice","discover","ring","factor"],"bko":{"sliced":"잘라(slice의 과거분사)","discovered":"발견한(discover의 과거분사)","slice":"자르다","discover":"발견하다","ring":"고리","factor":"요인"},"r":{"a":"[A] sliced (잘라(slice의 과거분사)), [B] discovered (발견한(discover의 과거분사))","ev":"1번 문장","s":[[1,"Have you ever sliced open a hard-boiled egg and discovered a dark gray ring around the yolk?","삶은 달걀을 자르고 열어 노른자 주위에 어두운 회색 고리를 발견한 적이 있는가?"]],"c":null,"k":null},"h":"d19133d5ba"}]},{"u":10,"id":"ch1-10-4","no":4,"ko":"수능:ON 요약문","items":[{"n":1,"t":"tf","q":"Any kind of corn can pop.","ko":"어떤 종류의 옥수수든 펑 하고 터질 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"If you use other varieties, they won’t pop.","만약 당신이 다른 품종을 사용한다면, 그것은 터지지 않을 것이다."]],"w":"5번 문장에서 다른 품종을 쓰면 터지지 않는다고 해요. 팝콘은 특별한 품종의 옥수수로 만들어요.","c":"F"},"h":"062f0dd6bf"},{"n":2,"t":"tf","q":"Each popcorn kernel has a little water inside.","ko":"각각의 팝콘 알맹이 안에는 물이 조금 들어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"There is a little water inside each kernel, and when the kernels are heated up, this water eventually turns into steam.","각 알맹이 안에는 물이 조금 있는데, 알맹이가 가열되면 이 물은 결국 증기로 변한다."]],"w":"7번 문장에서 각 알맹이 안에 물이 조금 있다고 해요.","c":"T"},"h":"9eeac4fa9e"},{"n":3,"t":"tf","q":"Scientists have found that the cracking of the kernels causes the popping sound.","ko":"과학자들은 알맹이의 균열이 터지는 소리를 일으킨다는 것을 밝혀냈다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Scientists used to think that the popping sound came from the cracking of the kernels, but it has been found that it’s actually caused by the sudden release of the steam.","과학자들은 이 터지는 소리가 알맹이의 균열로 인한 것으로 생각했지만, 실제로는 갑작스러운 증기의 방출로 인해 발생하는 것으로 밝혀졌다."]],"w":"10번 문장에서 균열이 원인이라는 것은 과학자들이 예전에 생각한 것이고, 실제로는 증기가 갑자기 방출되어 소리가 난다고 밝혀졌어요.","c":"F"},"h":"050ae16d04"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Corn may seem like an ordinary vegetable…)","ko":"옥수수가 평범한 채소처럼 보일지 모르지만…","opts":["특별한","평범한","위험한","비싼"],"word":"ordinary","r":{"a":"2) 평범한","ev":"1번 문장","s":[[1,"Corn may seem like an ordinary vegetable, but some corn has a secret superpower:","옥수수가 평범한 채소처럼 보일지 모르겠지만, 일부 옥수수에는 비밀의 슈퍼파워가 있다."]],"w":"but 뒤에서 '비밀의 슈퍼파워'가 있다고 하니 앞은 그와 반대인 '평범한' 채소라는 뜻이에요.","c":2},"h":"0a9e4fa012"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the kernels explode with a popping sound…)","ko":"…알맹이는 터지는 소리와 함께 …","opts":["식다","녹다","사라지다","폭발하다"],"word":"explode","r":{"a":"4) 폭발하다","ev":"9번 문장","s":[[9,"Finally, when the temperature and pressure get to a certain point, the kernels explode with a popping sound, turning themselves inside out.","마지막으로, 온도와 압력이 특정 지점에 도달할 때, 알맹이는 터지는 소리와 함께 폭발하여 스스로 뒤집힌다."]],"w":"온도와 압력이 한계에 이르면 터지는 소리와 함께 일어나는 일이니 explode는 '폭발하다'예요.","c":4},"h":"abdaf7e389"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nHave you ever wondered why corn does this?","ko":"밑줄 친 this가 가리키는 것은?","sko":"당신은 왜 옥수수가 이렇게 하는지 궁금해한 적이 있는가?","opts":["펑 하고 터지는 것","평범한 채소처럼 보이는 것","옥수수 알맹이를 가열하는 것","단단한 껍질을 만드는 것"],"r":{"a":"1) 펑 하고 터지는 것","ev":"2번, 3번 문장","s":[[2,"It can pop!","그것은 펑 하고 터질 수 있다!"],[3,"Have you ever wondered why corn does this?","당신은 왜 옥수수가 이렇게 하는지 궁금해한 적이 있는가?"]],"w":"3번의 this는 바로 앞 2번에서 말한 It can pop!, 즉 펑 하고 터지는 것이에요.","c":1},"h":"6f342d2bf0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It will be the most delicious science experiment you ever try!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 당신이 지금껏 시도한 것 중에서 가장 맛있는 과학 실험일 것이다.","opts":["당신이 하는 과학 실험은 모두 맛있을 것이다.","이것은 당신이 해 본 것 중 가장 어려운 과학 실험일 것이다.","이것은 당신이 해 본 것 중 가장 맛있는 과학 실험일 것이다.","맛있는 과학 실험은 다시는 할 수 없을 것이다."],"r":{
