ITLE_EN="Exploring Greatness";var PASS_EN=["Exploring Greatness","One day, Emily received an invitation from a museum. This museum wasn't any ordinary museum. It had rooms that celebrated great people. She was excited to begin her exploration.","Her first stop was a room that looked like an old airplane garage. Model airplanes were hanging from the ceiling. A leather pilot jacket and goggles were displayed. When Emily put them on, she could hear the sounds of airplane engines. She looked around the room in surprise.","On the wall, there was a picture of a woman. She looked brave and strong. Her name was Kwon Ki-ok. She was the first female pilot in Korea. Emily also found an old newspaper on the desk. It read, \"At that time, women couldn't enter flight schools. However, Kwon Ki-ok didn't give up and worked hard to achieve her dream.\" Kwon Ki-ok did not just fly airplanes. She also fought against Japan for Korea's independence. Emily was moved by the great life story of Kwon Ki-ok.","Emily stepped into the next room. The room was filled with many books and drawings of insects and plants. It looked like a small forest. When she closed the door, drawings on the desk suddenly started to fly around the room. She caught one of them. It was a drawing of a honeybee. It was so detailed that the honeybee looked alive."];var PASS_KO=["위대함을 탐험하기","어느 날, Emily는 박물관에서 초대장을 받았습니다. 이 박물관은 평범한 박물관이 아니었습니다. 그곳에는 위대한 인물들을 기념하는 방들이 있었습니다. 그녀는 그녀의 탐험을 시작하게 되어 들떠 있었습니다.","그녀의 첫 번째 방문지는 오래된 비행기 격납고처럼 보이는 방이었습니다. 모형 비행기들이 천장에 매달려 있었습니다. 가죽 비행사 재킷과 고글이 전시되어 있었습니다. Emily가 그것들을 입었을 때, 그녀는 비행기 엔진 소리를 들을 수 있었습니다. 그녀는 놀라서 방을 둘러보았습니다.","벽에는 한 여성의 사진이 있었습니다. 그녀는 용감하고 강해 보였습니다. 그녀의 이름은 권기옥이었습니다. 그녀는 한국 최초의 여성 비행사였습니다. Emily는 책상 위에서 오래된 신문도 발견했습니다. 그것에는 \"당시에 여성들은 비행 학교에 입학할 수 없었다. 하지만 권기옥은 포기하지 않고 꿈을 이루기 위해 열심히 노력했다.\"라고 적혀 있었습니다. 권기옥은 단순히 비행기만 조종한 것이 아니었습니다. 그녀는 한국의 독립을 위해 일본에 맞서서 싸우기도 했습니다. Emily는 권기옥의 위대한 인생 이야기에 감동을 받았습니다.","Emily는 다음 방으로 들어갔습니다. 그 방은 많은 책들과 곤충과 식물의 그림들로 가득 차 있었습니다. 그곳은 작은 숲처
