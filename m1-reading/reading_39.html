about the history of this food. Chungmu is an old name for Tongyeong. Long ago, fishermen in this town started to eat chungmugimbap because it did not go bad quickly.","August 2","Jeju-do is a beautiful island in Korea. We went there on a very hot day, and we became tired. However, we got our energy back thanks to dombegogi. It surprised me in two ways. First, it was pork on a cutting board, not on a plate. Second, the meat was so soft! I had it with a special fish sauce, and the sauce was great, too. Later, I learned about the meaning of dombe. It means a cutting board in Jeju’s language."];var PASS_KO=["나의 한국 음식 일기","여름 방학 동안, William은 가족과 함께 한국 여기저기를 여행했다. 이것은 그의 음식 일기이다.","7월 25일","우리는 담양에 갔고 유명한 대나무 정원인 죽녹원을 방문했다. 우리는 정원에서 걷는 것을 즐겼다. 주변을 둘러본 후에, 우리는 두 가지 지역 음식인 대통밥과 떡갈비를 먹었다. 대통밥은 대나무 그릇에 담긴 밥이다. 나는 그것의 독특한 대나무 향이 매우 좋았다. 한국의 소고기 요리인 떡갈비는 부드럽고 달콤했다. 그 요리들은 함께 정말 잘 어울렸다.","7월 30일","우리는 통영을 방문했고 케이블카를 타고 산에 올라갔다. 파란 바다와 녹색의 섬들을 보는 것은 환상적이었다! 바다 근처에서 우리는 현지 식당을 찾았고 충무김밥을 먹었다. 그것은 다른 종류의 김밥과는 달랐다. 김 안에는 오직 밥만 있었다. 김치와 매운 오징어가 옆에 있었다. 그것은 매웠지만 정말 맛있었다. 나는 이 음식의 역사에 관해 들었다. 충무는 통영의 옛 이름이다. 오래전에, 이 마을의 어부들은 이 음식이 빨리 상하지 않았기 때문에 충무김밥을 먹기 시작했다.","8월 2일","제주도는 한국의 아름다운 섬이다. 우리는 매우 더운 날에 거기에 갔고 피곤해졌다. 그러나 돔베고기 덕분에 우리는 기운을 되찾았다. 그것은 두 가지 면으로 나를 놀라게 했다. 첫째로, 그것은 접시 위가 아닌 도마 위의 돼지고기였다. 둘째로, 고기가 아주 부드러웠다! 나는 그것을 특별한 생선 소스와 함께 먹었는데, 그 소스도 훌륭했다. 나중에 나는 돔베의 의미에 대해 배웠다. 그것은 제주 말로 도마를 의미한다."];var DLG=[["Mina","How was your weekend, Jason?","주말은 어땠어, Jason?"],["Jason","It was good. I went to a baking class on Saturday.","좋았어. 나는 토요일에 제빵 수업에 갔어."],["Mina","Oh, what did you make?","오, 뭘 만들었니?"],["Jason","I made apple pies and chocolate cookies.","나는 사과 파이와 초콜릿 쿠키를 만들었어."],["Mina","Sounds delicious!","맛있겠다!"],["Jason","I brought some of them with me. Would you like some, Mina?","그중 몇 개를 가져왔어. 좀 먹을래, Mina?"],["Mina","Sure. Wow, they’re so good.","그래. 와, 정말 맛있다."]];var BQ=[{"n":1,"q":"Jason은 토요일에 어디에 갔나요?","o":["요리 대회","제빵 수업","미술관","도서관","수영장"],"a":1,"ev":["I went to a baking class on
