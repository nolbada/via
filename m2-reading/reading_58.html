var D=[{"n":1,"tag":"유럽에 온 감자","en":"Thousand of years ago, potatoes was first grown by people in the Andes mountains region.","ko":"수천 년 전에 감자는 안데스산맥 지역의 사람들에 의해 처음 재배되었다.","ok":false,"foot":[],"fixes":[{"wrong":"Thousand","right":"Thousands","partial":false,"at":[0],"point":"수량 표현: '수천 년'은 Thousands of 사용","topic":"수량 표현","memo":"'수천 년'은 Thousands of 사용"},{"wrong":"was","right":"were","partial":false,"at":[5],"point":"be동사의 과거형: 주어 potatoes(복수)에는 were 사용","topic":"be동사의 과거형","memo":"주어 potatoes(복수)에는 were 사용"}]},{"n":2,"tag":null,"en":"When Spanish people took over this region on the 16th century, them first learned about potatoes.","ko":"스페인 사람들이 16세기에 이 지역을 장악했을 때 그들은 처음 감자에 대해 알게 되었다.","ok":false,"foot":[],"fixes":[{"wrong":"on","right":"in","partial":false,"at":[7],"point":"기본전치사: '~세기에'는 전치사 in 사용","topic":"기본전치사","memo":"'~세기에'는 전치사 in 사용"},{"wrong":"them","right":"they","partial":false,"at":[11],"point":"인칭대명사의 주격: 주어 자리에는 주격 they 사용","topic":"인칭대명사의 주격","memo":"주어 자리에는 주격 they 사용"}]},{"n":3,"tag":null,"en":"They brought them to Europe because they were a good food source. However, potatoes was not welcomed at first.","ko":"감자가 좋은 식량원이었기 때문에 그들은 감자를 유럽으로 가져왔다. 하지만 감자는 처음에 환영받지 못했다.","ok":false,"foot":[],"fixes":[{"wrong":"was","right":"were","partial":false,"at":[14],"point":"be동사의 과거형: 주어 potatoes(복수)에는 were 사용","topic":"be동사의 과거형","memo":"주어 potatoes(복수)에는 were 사용"}]},{"n":4,"tag":null,"en":"People did not try to grow and eat them because they looked strangely.","ko":"사람들은 감자가 이상하게 생겼기 때문에 그것을 재배해 먹으려고 하지 않았다.","ok":false,"foot":[],"fixes":[{"wrong":"strangely","right":"strange","partial":false,"at":[12],"point":"형용사와 부사: looked 뒤 보어 자리에는 형용사 strange 사용","topic":"형용사와 부사","memo":"looked 뒤 보어 자리에는 형용사 strange 사용"}]},{"n":5,"tag":null,"en":"They also thought potatoes brought diseases, so they gave them to pigs.","ko":"그들은 또한 감자가 병을 가져온다고 생각해서 그것을 돼지에게 주었다.","ok":true,"foot":[],"fixes":[]},{"n":6,"tag":"감자 왕","en":"A great food shortages happened in Prussia  they as well.","ko":"감자가 처음 프랑스에 들어왔을 때 프랑스 사람들도 감자를 좋아하지 않았다.","ok":false,"foot":[],"fixes":[{"wrong":"was","right":"were","partial":false,"at":[2],"point":"be동사의 과거형: 주어 potatoes(복수)에는 were 사용","topic":"be동사의 과거형","memo":"주어 potatoes(복수)에는 were 사용"},{"wrong":"they","right":"them","partial":false,"at":[12],"point":"인칭대명사의 목적격: 동사 like의 목적어는 목적격 them 사용","topic":"인칭대명사의 목적격","memo":"동사 like의 목적어는 목적격 them 사용"}]},{"n":13,"tag":null,"en":"Because of France also had food shortages, one government officials told King Louis XVI about the successful case in Prussia.","ko":"프랑스도 식량 부족을 겪었기 때문에, 한 정부 관료는 루이 16세 왕에게 프로이센의 성공적인 사례에 대해 말했다.","ok":false,"foot":[],"fixes":[{"wrong":"of France","right":"France","partial":false,"at":[1],"point":"접속사와 전치사: 뒤에 주어+동사가 오므로 접속사 Because 사용","topic":"접속사와 전치사","memo":"뒤에 주어+동사가 오므로 접속사 Because 사용"},{"wrong":"officials","right":"official","partial":false,"at":[9],"point":"one+단수명사: one 뒤에는 단수명사 official 사용","topic":"one+단수명사","memo":"one 뒤에는 단수명사 official 사용"}]},{"n":14,"tag":null,"en":"He advised the king to wear potato flowers on his jacket. The king taked his advice, and the queen also wore some in her hair.","ko":"그는 왕에게 재킷에 감자꽃을 꽂으라고 조언했다. 왕은 그의 조언을 받아들였고 왕비도 머리에 감자꽃을 꽂았다.","ok":false,"foot":[],"fixes":[{"wrong":"taked","right":"took","partial":false,"at":[13],"point":"불규칙 과거형: take의 과거형은 took (taked 아님)","topic":"불규칙 과거형","memo":"take의 과거형은 took (taked 아님)"}]},{"n":15,"tag":null,"en":"People started to follow this royal fashion. As a result, people began to like potatoes and started to grow and eat they.","ko":"사람들은 이러한 왕실의 패션을 따라 하기 시작했다. 그 결과 사람들은 감자를 좋아하기 시작했고 그것을 재배해 먹기 시작했다.","ok":false,"foot":[],"fixes":[{"wrong":"they","right":"them","partial":false,"at":[21],"point":"인칭대명사의 목적격: 동사 eat의 목적어는 목적격 them 사용","topic":"인칭대명사의 목적격","memo":"동사 eat의 목적어는 목적격 them 사용"}]},{"n":16,"tag":null,"en":"Thanks to such efforts, potatoes were finally accepted in Europe and began to spread worldwide.","ko":"그러한 노력 덕분에 감자는 마침내 유럽에서 받아들여졌고 전 세계로 퍼져 나가기 시작했다.","ok":true,"foot":[],"fixes":[]},{"n":17,"tag":null,"en":"They have now become one of the most popular vegetable in the world.","ko":"그것은 이제 세계에서 가장 인기 있는 채소 중 하나가 되었다.","ok":false,"foot":[],"fixes":[{"wrong":"vegetable","right":"vegetables","partial":false,"at":[9],"point":"명사의 복수형: one of the 뒤에는 복수명사 vegetables 사용","topic":"명사의 복수형","memo":"one of the 뒤에는 복수명사 vegetables 사용"}]}];var PP=[["Potatoes Come to Europe","감자가 유럽에 오다",1],["Thousands of years ago, potatoes were first grown by people in the Andes mountains region.","수천 년 전에 감자는 안데스산맥 지역의 사람들에 의해 처음 재배되었다.",1],["When Spanish people took over this region in the 16th century, they first learned about potatoes.","스페인 사람들이 16세기에 이 지역을 장악했을 때 그들은 처음 감자에 대해 알게 되었다.",0],["They brought them to Europe because they were a good food source.","감자가 좋은 식량원이었기 때문에 그들은 감자를 유럽으로 가져왔다.",0],["However, potatoes were not welcomed at first.","하지만 감자는 처음에 환영받지 못했다.",0],["People did not try to grow and eat them because they looked strange.","사람들은 감자가 이상하게 생겼기 때문에 그것을 재배해 먹으려고 하지 않았다.",0],["They also thought potatoes brought diseases, so they gave them to pigs.","그들은 또한 감자가 병을 가져온다고 생각해서 그것을 돼지에게 주었다.",0],["The Potato King","감자 왕",1],["A great food shortage happened in Prussia in 1744. People did not have enough food to eat.","1744년에 프로이센에서 대기근이 발생했다. 사람들은 먹을 식량이 충분치 않았다.",1],["Frederick the Great wanted his people to grow and eat potatoes.","Frederick 대왕은 백성들이 감자를 재배해 먹기를 원했다.",0],["He planted a large field of potatoes, but nobody was interested.","그는 커다란 감자밭을 일궜지만, 아무도 관심이 없었다.",0],["The king did not give up, and he came up with an idea.","왕은 포기하지 않았고, 한 가지 아이디어를 생각해 냈다.",0],["He named potatoes a royal vegetable and ordered his soldiers to guard the potato field.","그는 감자를 왕실의 채소라고 이름 짓고 자신의 병사들에게 감자밭을 지키라고 명령했다.",0],["This made people curious, and some even tried to steal potatoes at night.","이것은 사람들에게 호기심을 유발했고, 몇몇 사람들은 심지어 밤에 감자를 훔치려고 했다.",0],["Soon, more and more people started to grow and eat potatoes.","곧 점점 더 많은 사람들이 감자를 재배해 먹기 시작했다.",0],["Potato Flowers, a Royal Fashion","감자꽃, 왕가의 패션",1],["When potatoes were first introduced in France, French people did not like them as well.","감자가 처음 프랑스에 들어왔을 때 프랑스 사람들도 감자를 좋아하지 않았다.",1],["Because France also had food shortages, one government official told King Louis XVI about the successful case in Prussia.","프랑스도 식량 부족을 겪었기 때문에, 한 정부 관료는 루이 16세 왕에게 프로이센의 성공적인 사례에 대해 말했다.",0],["He advised the king to wear potato flowers on his jacket.","그는 왕에게 재킷에 감자꽃을 꽂으라고 조언했다.",0],["The king took his advice, and the queen also wore some in her hair.","왕은 그의 조언을 받아들였고 왕비도 머리에 감자꽃을 꽂았다.",0],["People started to follow this royal fashion.","사람들은 이러한 왕실의 패션을 따라 하기 시작했다.",0],["As a result, people began to like potatoes and started to grow and eat them.","그 결과 사람들은 감자를 좋아하기 시작했고 그것을 재배해 먹기 시작했다.",0],["Thanks to such efforts, potatoes were finally accepted in Europe and began to spread worldwide.","그러한 노력 덕분에 감자는 마침내 유럽에서 받아들여졌고 전 세계로 퍼져 나가기 시작했다.",1],["They have now become one of the most popular vegetables in the world.","그것은 이제 세계에서 가장 인기 있는 채소 중 하나가 되었다.",0]];var RNUM=58;var TITLE_EN="Potatoes: Once an Unpopular Vegetable";var PASS_EN=["Potatoes: Once an Unpopular Vegetable","Potatoes Come to Europe","Thousands of years ago, potatoes were first grown by people in the Andes mountains region. When Spanish people took over this region in the 16th century, they first learned about potatoes. They brought them to Europe because they were a good food source. However, potatoes were not welcomed at first. People did not try to grow and eat them because they looked strange. They also thought potatoes brought diseases, so they gave them to pigs.","The Potato King","A great food shortage happened in Prussia in 1744. People did not have enough food to eat. Frederick the Great wanted his people to grow and eat potatoes. He planted a large field of potatoes, but nobody was interested. The king did not give up, and he came up with an idea. He named potatoes a royal vegetable and ordered his soldiers to guard the potato field. This made people curious, and some even tried to steal potatoes at night. Soon, more and more people started to grow and eat potatoes.","Potato Flowers, a Royal Fashion","When potatoes were first introduced in France, French people did not like them as well. Because France also had food shortages, one government official told King Louis XVI about the successful case in Prussia. He advised the king to wear potato flowers on his jacket. The king took his advice, and the queen also wore some in her hair. People started to follow this royal fashion. As a result, people began to like potatoes and started to grow and eat them.","Thanks to such efforts, potatoes were finally accepted in Europe and began to spread worldwide. They have now become one of the most popular vegetables in the world."];var PASS_KO=["감자: 한때 인기 없었던 채소","감자가 유럽에 오다","수천 년 전에 감자는 안데스산맥 지역의 사람들에 의해 처음 재배되었다. 스페인 사람들이 16세기에 이 지역을 장악했을 때 그들은 처음 감자에 대해 알게 되었다. 감자가 좋은 식량원이었기 때문에 그들은 감자를 유럽으로 가져왔다. 하지만 감자는 처음에 환영받지 못했다. 사람들은 감자가 이상하게 생겼기 때문에 그것을 재배해 먹으려고 하지 않았다. 그들은 또한 감자가 병을 가져온다고 생각해서 그것을 돼지에게 주었다.","감자 왕","1744년에 프로이센에서 대기근이 발생했다. 사람들은 먹을 식량이 충분치 않았다. Frederick 대왕은 백성들이 감자를 재배해 먹기를 원했다. 그는 커다란 감자밭을 일궜지만, 아무도 관심이 없었다. 왕은 포기하지 않았고, 한 가지 아이디어를 생각해 냈다. 그는 감자를 왕실의 채소라고 이름 짓고 자신의 병사들에게 감자밭을 지키라고 명령했다. 이것은 사람들에게 호기심을 유발했고, 몇몇 사람들은 심지어 밤에 감자를 훔치려고 했다. 곧 점점 더 많은 사람들이 감자를 재배해 먹기 시작했다.","감자꽃, 왕가의 패션","감자가 처음 프랑스에 들어왔을 때 프랑스 사람들도 감자를 좋아하지 않았다. 프랑스도 식량 부족을 겪었기 때문에, 한 정부 관료는 루이 16세 왕에게 프로이센의 성공적인 사례에 대해 말했다. 그는 왕에게 재킷에 감자꽃을 꽂으라고 조언했다. 왕은 그의 조언을 받아들였고 왕비도 머리에 감자꽃을 꽂았다. 사람들은 이러한 왕실의 패션을 따라 하기 시작했다. 그 결과 사람들은 감자를 좋아하기 시작했고 그것을 재배해 먹기 시작했다.","그러한 노력 덕분에 감자는 마침내 유럽에서 받아들여졌고 전 세계로 퍼져 나가기 시작했다. 그것은 이제 세계에서 가장 인기 있는 채소 중 하나가 되었다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["여자는 사과잼을 만들 예정이다.","여자는 사과 두 상자를 구매했다.","여자가 내야 하는 돈은 20달러였다.","남자는 사과 상자를 여자의 차까지 옮겨주었다.","여자는 카트를 사용한 후 제자리에 갖다 놓겠다고 했다."],"a":3,"ans":"남자는 사과 상자를 여자의 차까지 옮겨주었다.","evs":[["I can't l e he is sick in bed.","Because he has to bake cookies.","Because his grandma is already there.","Because he doesn't know how to clean."],"a":0,"ans":"Because he is not at home now.","evs":[["Sorry, Mom. I'm not at home now.","죄송해요, 엄마. 저는 지금 집에 없어요."]],"ev":["Sorry, Mom. I'm not at home now.","죄송해요, 엄마. 저는 지금 집에 없어요."],"ow":["정답 ○ — Henry는 'Sorry, Mom. I'm not at home now.'(죄송해요, 엄마. 저는 지금 집에 없어요.)라고 했으므로 집에 없어서 청소할 수 없음.","오답 ✕ — 아프다는 말은 지문에 없음. 이유는 'I'm not at home now.'(지금 집에 없어요.)임.","오답 ✕ — 쿠키를 굽겠다고 한 사람은 엄마('I want to bake some cookies for her.')이고, Henry는 밀가루를 사 오는 부탁을 받았음.","오답 ✕ — 'Your grandma is coming tonight.'(오늘 밤에 할머니가 오실 거야.)라고 했으므로 할머니는 아직 도착하지 않았음.","오답 ✕ — 청소 방법을 모른다는 말은 지문에 없음. 이유는 집에 없다는 것임."],"memo":["정답 ①: 지금 집에 없기 때문이다.","근거: I'm not at home now.(저는 지금 집에 없어요.)","함정: 쿠키를 굽는 사람은 엄마이므로 ③은 ✕"],"why":"Henry는 지금 집에 없어서 청소를 할 수 없다."}],"dlg":[["W","Henry, can you do me a favor?","Henry, 부탁 좀 들어줄래?"],["B","What is it, Mom?","뭔데요, 엄마?"],["W","Your grandma is coming tonight. We need to clean the house. Could you do it for me?","오늘 밤에 할머니가 오실 거야. 우리는 집을 청소해야 해. 네가 대신 해 줄 수 있니?"],["B","Sorry, Mom. I'm not at home now.","죄송해요, 엄마. 저는 지금 집에 없어요."],["W","Alright. Then, could you buy some flour on your way home? I want to bake some cookies for her.","알겠다. 그럼 집에 오는 길에 밀가루 좀 사다 줄 수 있니? 할머니께 쿠키를 구워 드리고 싶어서."]]},{"qs":[{"n":5,"q":"What will Natalie do to help the man?","o":["to clean up the living room","to finish her homework","to buy some groceries","to dig up potatoes","to cut the grass"],"a":4,"ans":"to cut the grass","evs":[["I'm busy digging up potatoes now, so could you cut the grass for me?","지금 감자를 캐느라 바쁜데, 나 대신 잔디를 깎아 줄 수 있겠니?"],["Sure. Just give me a second.","그럼요. 잠깐만 기다려 주세요."]],"ev":["I'm busy digging up potatoes now, so could you cut the grass for me?","지금 감자를 캐느라 바쁜데, 나 대신 잔디를 깎아 줄 수 있겠니?"],"ow":["오답 ✕ — 거실을 청소한다는 말은 지문에 없음. 남자가 부탁한 일은 'cut the grass'(잔디 깎기)임.","오답 ✕ — Natalie는 'Yes, I'm done.'(네, 다 했어요.)라고 했으므로 숙제는 이미 끝났음.","오답 ✕ — 장을 보는 일은 지문에 없음. 부탁받은 일은 잔디를 깎는 것임.","오답 ✕ — 감자를 캐는 사람은 남자이다('I'm busy digging up potatoes now'). Natalie는 그가 바빠서 대신 도와주는 입장임.","정답 ○ — 남자가 'could you cut the grass for me?'(잔디를 깎아 줄 수 있겠니?)라고 부탁했고 Natalie는 'Sure.'(그럼요.)라고 답했으므로 잔디를 깎아 줄 것임."],"memo":["정답 ⑤: to cut the grass(잔디를 깎기)","근거: could you cut the grass for me?(나 대신 잔디를 깎아 줄 수 있겠니?) — Sure.(그럼요.)","함정: 감자를 캐는 사람은 남자라서 ④는 ✕"],"why":"Natalie는 감자를 캐느라 바쁜 남자를 위해 잔디를 깎아 주기로 한다."}],"dlg":[["M","Natalie, are you done with your homework?","Natalie, 숙제 다 했니?"],["G","Yes, I'm done. Why?","네, 다 했어요. 왜요?"],["M","Can you do me a favor then? I'm busy digging up potatoes now, so could you cut the grass for me?","그럼 부탁 하나 들어줄래? 지금 감자를 캐느라 바쁜데, 나 대신 잔디를 깎아 줄 수 있겠니?"],["G","Sure. Just give me a second.","그럼요. 잠깐만 기다려 주세요."]]}];var BG=[{"qs":[{"n":6,"q":"윗글을 읽고 감자에 대해 알 수 없는 것은?","o":["where potatoes were first grown","when the Spanish first learned about potatoes","why the Spanish brought potatoes to Europe","why Europeans did not try to eat potatoes","when potatoes became popular as food in Europe"],"a":4,"ans":"when potatoes became popular as food in Europe","evs":[["Thousands of years ago, potatoes were first grown by people in the Andes mountains region.","수천 년 전에 감자는 안데스산맥 지역의 사람들에 의해 처음 재배되었다."],["People did not try to grow and eat them because they looked strange.","사람들은 감자가 이상하게 생겼기 때문에 그것을 재배해 먹으려고 하지 않았다."]],"ev":["Thousands of years ago, potatoes were first grown by people in the Andes mountains region.","수천 년 전에 감자는 안데스산맥 지역의 사람들에 의해 처음 재배되었다."],"ow":["오답 ✕ — 'potatoes were first grown by people in the Andes mountains region'(감자는 안데스산맥 지역의 사람들에 의해 처음 재배되었다)라고 했으므로 알 수 있음.","오답 ✕ — 'When Spanish people took over this region in the 16th century, they first learned about potatoes.'(스페인 사람들이 16세기에 이 지역을 장악했을 때 처음 감자에 대해 알게 되었다.)라고 했으므로 알 수 있음.","오답 ✕ — 'They brought them to Europe because they were a good food source.'(감자가 좋은 식량원이었기 때문에 유럽으로 가져왔다.)라고 했으므로 알 수 있음.","오답 ✕ — 'they looked strange'(이상하게 생겼기 때문에), 'potatoes brought diseases'(감자가 병을 가져온다고 생각해서)라고 했으므로 알 수 있음.","정답 ○ — 이 글은 'potatoes were not welcomed at first'(감자는 처음에 환영받지 못했다)까지만 말하고 있어, 감자가 유럽에서 언제 음식으로 인기를 얻었는지는 나오지 않으므로 알 수 없음."],"memo":["정답 ⑤: 감자가 유럽에서 언제 인기를 얻었는지는 알 수 없다.","근거: potatoes were not welcomed at first(감자는 처음에 환영받지 못했다)","함정: 16세기는 스페인이 감자를 '알게 된' 때이지 '인기를 얻은' 때가 아니라 ②와 헷갈림"],"why":"첫 문단에는 감자의 시작과 처음의 푸대접만 나오고, 인기를 얻은 시기는 나오지 않는다."}],"pp":[["Thousands of years ago, potatoes were first grown by people in the Andes mountains region.","수천 년 전에 감자는 안데스산맥 지역의 사람들에 의해 처음 재배되었다."],["When Spanish people took over this region in the 16th century, they first learned about potatoes.","스페인 사람들이 16세기에 이 지역을 장악했을 때 그들은 처음 감자에 대해 알게 되었다."],["They brought them to Europe because they were a good food source.","감자가 좋은 식량원이었기 때문에 그들은 감자를 유럽으로 가져왔다."],["However, potatoes were not welcomed at first.","하지만 감자는 처음에 환영받지 못했다."],["People did not try to grow and eat them because they looked strange.","사람들은 감자가 이상하게 생겼기 때문에 그것을 재배해 먹으려고 하지 않았다."],["They also thought potatoes brought diseases, so they gave them to pigs.","그들은 또한 감자가 병을 가져온다고 생각해서 그것을 돼지에게 주었다."]]},{"qs":[{"n":7,"q":"윗글의 내용과 일치하지 않는 것은?","o":["1744년 프로이센은 심각한 식량난을 겪었다.","Frederick 대왕이 감자를 심자 백성들은 감자밭으로 몰려들었다.","Frederick 대왕은 감자를 왕실의 채소라고 이름 붙였다.","일부 백성들은 밤에 감자를 훔치려고 시도했다.","시간이 흐르면서 감자를 재배해 먹는 사람들이 늘어났다."],"a":1,"ans":"Frederick 대왕이 감자를 심자 백성들은 감자밭으로 몰려들었다.","evs":[["He planted a large field of potatoes, but nobody was interested.","그는 커다란 감자밭을 일궜지만, 아무도 관심이 없었다."],["Soon, more and more people started to grow and eat potatoes.","곧 점점 더 많은 사람들이 감자를 재배해 먹기 시작했다."]],"ev":["He planted a large field of potatoes, but nobody was interested.","그는 커다란 감자밭을 일궜지만, 아무도 관심이 없었다."],"ow":["오답 ✕ — 'A great food shortage happened in Prussia in 1744.'(1744년에 프로이센에서 대기근이 발생했다.)와 일치하므로 답이 아님.","정답 ○ — 'He planted a large field of potatoes, but nobody was interested.'(그는 커다란 감자밭을 일궜지만, 아무도 관심이 없었다.)라고 했다. 백성들이 몰려든 것이 아니라 관심이 없었으므로 일치하지 않음.","오답 ✕ — 'He named potatoes a royal vegetable'(그는 감자를 왕실의 채소라고 이름 지었다)과 일치함.","오답 ✕ — 'some even tried to steal potatoes at night'(몇몇 사람들은 심지어 밤에 감자를 훔치려고 했다)와 일치함.","오답 ✕ — 'Soon, more and more people started to grow and eat potatoes.'(곧 점점 더 많은 사람들이 감자를 재배해 먹기 시작했다.)와 일치함."],"memo":["정답 ②: 처음에는 아무도 감자밭에 관심이 없었다.","근거: He planted a large field of potatoes, but nobody was interested.(커다란 감자밭을 일궜지만 아무도 관심이 없었다.)","함정: 몰려든 것은 병사가 지키라고 한 '뒤'의 일이라 ②는 순서를 바꾼 함정 ✕"],"why":"왕이 감자밭을 일궜을 때 처음에는 아무도 관심이 없었다."},{"n":8,"q":"윗글의 제목으로 알맞은 것은?","o":["A New Vegetable in Prussia","The Danger of a Great Food Shortage","How to Grow Potatoes in a Large Field","The History of Potato Farming in Europe","A King's Clever Plan to Make Potatoes Popular"],"a":4,"ans":"A King's Clever Plan to Make Potatoes Popular","evs":[["The king did not give up, and he came up with an idea.","왕은 포기하지 않았고, 한 가지 아이디어를 생각해 냈다."],["He named potatoes a royal vegetable and ordered his soldiers to guard the potato field.","그는 감자를 왕실의 채소라고 이름 짓고 자신의 병사들에게 감자밭을 지키라고 명령했다."]],"ev":["The king did not give up, and he came up with an idea.","왕은 포기하지 않았고, 한 가지 아이디어를 생각해 냈다."],"ow":["오답 ✕ — 감자는 이미 있던 작물이고 'He named potatoes a royal vegetable'(감자를 왕실의 채소라고 이름 지었다)처럼 왕이 쓴 계획이 핵심이라, 새 채소가 소개된 이야기가 아님.","오답 ✕ — 'A great food shortage happened in Prussia in 1744.'(1744년에 프로이센에서 대기근이 발생했다.)처럼 식량난은 배경일 뿐, 글은 위험을 설명하는 내용이 아님.","오답 ✕ — 'He planted a large field of potatoes'(커다란 감자밭을 일궜다)가 나오지만 감자 재배법을 알려 주는 글이 아님.","오답 ✕ — 1744년 프로이센 왕의 한 사건만 다루므로 'Soon, more and more people started to grow and eat potatoes.'(곧 점점 더 많은 사람들이 감자를 재배해 먹기 시작했다.)를 유럽 전체 역사로 넓힌 보기라 틀림.","정답 ○ — 왕이 'came up with an idea'(아이디어를 생각해 냈다)하여 감자를 왕실의 채소로 이름 짓고 병사에게 지키게 해 사람들이 감자를 키워 먹게 했으므로 제목으로 알맞음."],"memo":["정답 ⑤: A King's Clever Plan to Make Potatoes Popular(감자를 유명하게 만든 왕의 영리한 계획)","근거: The king did not give up, and he came up with an idea.(왕은 포기하지 않았고 아이디어를 생각해 냈다.)","함정: ②는 식량난이 배경일 뿐 글의 중심이 아니라 ✕"],"why":"프로이센의 왕이 영리한 계획으로 감자를 인기 있게 만든 이야기이다."}],"pp":[["A great food shortage happened in Prussia in 1744. People did not have enough food to eat.","1744년에 프로이센에서 대기근이 발생했다. 사람들은 먹을 식량이 충분치 않았다."],["Frederick the Great wanted his people to grow and eat potatoes.","Frederick 대왕은 백성들이 감자를 재배해 먹기를 원했다."],["He planted a large field of potatoes, but nobody was interested.","그는 커다란 감자밭을 일궜지만, 아무도 관심이 없었다."],["The king did not give up, and he came up with an idea.","왕은 포기하지 않았고, 한 가지 아이디어를 생각해 냈다."],["He named potatoes a royal vegetable and ordered his soldiers to guard the potato field.","그는 감자를 왕실의 채소라고 이름 짓고 자신의 병사들에게 감자밭을 지키라고 명령했다."],["This made people curious, and some even tried to steal potatoes at night.","이것은 사람들에게 호기심을 유발했고, 몇몇 사람들은 심지어 밤에 감자를 훔치려고 했다."],["Soon, more and more people started to grow and eat potatoes.","곧 점점 더 많은 사람들이 감자를 재배해 먹기 시작했다."]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["프랑스 사람들은 감자가 처음 들어왔을 때 매우 반겼다.","루이 16세 왕은 감자 재배의 성공 사례를 직접 조사했다.","루이 16세 왕은 감자꽃을 꽂으라는 관료의 조언을 듣지 않았다.","프랑스의 왕비는 감자꽃을 재킷에 꽂아서 왕실 패션을 만들어 냈다.","왕실 패션의 영향으로 사람들은 감자를 좋아하게 되었다."],"a":4,"ans":"왕실 패션의 영향으로 사람들은 감자를 좋아하게 되었다.","evs":[["People started to follow this royal fashion.","사람들은 이러한 왕실의 패션을 따라 하기 시작했다."],["As a result, people began to like potatoes and started to grow and eat them.","그 결과 사람들은 감자를 좋아하기 시작했고 그것을 재배해 먹기 시작했다."]],"ev":["People started to follow this royal fashion.","사람들은 이러한 왕실의 패션을 따라 하기 시작했다."],"ow":["오답 ✕ — 'French people did not like them as well.'(프랑스 사람들도 감자를 좋아하지 않았다.)라고 했으므로 매우 반겼다는 말은 반대임.","오답 ✕ — 'one government official told King Louis XVI about the successful case in Prussia'(한 정부 관료가 루이 16세 왕에게 프로이센의 성공적인 사례에 대해 말했다)이므로 왕이 직접 조사한 것이 아님.","오답 ✕ — 'The king took his advice'(왕은 그의 조언을 받아들였다)라고 했으므로 듣지 않았다는 말은 틀림.","오답 ✕ — 'the queen also wore some in her hair'(왕비도 머리에 감자꽃을 꽂았다)이므로 재킷이 아니라 머리에 꽂았고, 패션을 만든 것은 관료의 조언을 따른 왕임.","정답 ○ — 'People started to follow this royal fashion. As a result, people began to like potatoes'(사람들이 왕실의 패션을 따라 하기 시작했고, 그 결과 감자를 좋아하기 시작했다)와 일치함."],"memo":["정답 ⑤: 왕실 패션의 영향으로 사람들은 감자를 좋아하게 되었다.","근거: As a result, people began to like potatoes(그 결과 사람들은 감자를 좋아하기 시작했다)","함정: ④는 왕비가 꽂은 곳이 재킷이 아니라 머리라서 ✕"],"why":"왕과 왕비의 감자꽃 패션을 따라 하면서 프랑스 사람들이 감자를 좋아하게 되었다."},{"n":10,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["flowers - like","leaves - like","flowers - avoid","jackets - like","leaves - dislike"],"a":0,"ans":"flowers - like","evs":[["He advised the king to wear potato flowers on his jacket.","그는 왕에게 재킷에 감자꽃을 꽂으라고 조언했다."],["As a result, people began to like potatoes and started to grow and eat them.","그 결과 사람들은 감자를 좋아하기 시작했고 그것을 재배해 먹기 시작했다."]],"ev":["He advised the king to wear potato flowers on his jacket.","그는 왕에게 재킷에 감자꽃을 꽂으라고 조언했다."],"ow":["정답 ○ — 'wear potato flowers on his jacket'(재킷에 감자꽃을 꽂으라)이므로 (A)는 flowers, 'people began to like potatoes'(사람들은 감자를 좋아하기 시작했다)이므로 (B)는 like가 맞음.","오답 ✕ — (B) like는 맞지만, 왕이 꽂은 것은 'potato flowers'(감자꽃)이지 잎(leaves)이 아님.","오답 ✕ — (A) flowers는 맞지만, 'people began to like potatoes'(감자를 좋아하기 시작했다)이므로 avoid는 반대임.","오답 ✕ — 'potato flowers on his jacket'에서 jacket은 꽃을 꽂은 곳이지 꽂은 것이 아니므로 (A)가 틀림.","오답 ✕ — 왕이 꽂은 것은 'potato flowers'이지 잎이 아니고, 사람들은 'began to like potatoes'(좋아하기 시작)했으므로 dislike도 반대라 틀림."],"memo":["정답 ①: flowers - like","근거: wear potato flowers on his jacket(재킷에 감자꽃) / people began to like potatoes(감자를 좋아하기 시작)","함정: 꽃을 꽂은 곳(jacket)과 꽂은 것(flowers)을 구분"],"why":"왕이 감자꽃을 꽂자 사람들이 따라 하며 감자를 좋아하게 되었다.","sum":"French people did not like potatoes at first, but after the king wore potato (A)______ on his jacket, people followed the royal fashion and began to (B)______ potatoes.","lab":"완성된 요약문 : "}],"pp":[["When potatoes were first introduced in France, French people did not like them as well.","감자가 처음 프랑스에 들어왔을 때 프랑스 사람들도 감자를 좋아하지 않았다."],["Because France also had food shortages, one government official told King Louis XVI about the successful case in Prussia.","프랑스도 식량 부족을 겪었기 때문에, 한 정부 관료는 루이 16세 왕에게 프로이센의 성공적인 사례에 대해 말했다."],["He advised the king to wear potato flowers on his jacket.","그는 왕에게 재킷에 감자꽃을 꽂으라고 조언했다."],["The king took his advice, and the queen also wore some in her hair.","왕은 그의 조언을 받아들였고 왕비도 머리에 감자꽃을 꽂았다."],["People started to follow this royal fashion.","사람들은 이러한 왕실의 패션을 따라 하기 시작했다."],["As a result, people began to like potatoes and started to grow and eat them.","그 결과 사람들은 감자를 좋아하기 시작했고 그것을 재배해 먹기 시작했다."],["Thanks to such efforts, potatoes were finally accepted in Europe and began to spread worldwide.","그러한 노력 덕분에 감자는 마침내 유럽에서 받아들여졌고 전 세계로 퍼져 나가기 시작했다."],["They have now become one of the most popular vegetables in the world.","그것은 이제 세계에서 가장 인기 있는 채소 중 하나가 되었다."]]}];

var secs=[],cur=null;
D.forEach(function(it,i){if(it.tag||!cur){cur={name:it.tag||'',items:[]};secs.push(cur)}cur.items.push(i)});
var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=partsHtml();
 document.getElementById('app').innerHTML=h;relayUp();if(typeof persist==='function')persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}

var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});

}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
