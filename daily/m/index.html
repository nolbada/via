<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>데일리보카 M</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1f2a24;--sub:#6b766f;--line:#dfe4de;--pri:#2f7d5b;--priInk:#fff;--ok:#2f7d5b;--okBg:#e4f3ea;--ng:#c0392b;--ngBg:#fbe9e6;--hi:#fff3cf;--star:#d9a400}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d231f;--ink:#e8eee9;--sub:#97a39b;--line:#2f3832;--pri:#4fb98a;--priInk:#0e1612;--ok:#58c28f;--okBg:#183024;--ng:#ec7a6c;--ngBg:#3a1f1b;--hi:#3a3216;--star:#f0c030}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.55}
#app{max-width:680px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:22px;margin:8px 0 0}
.subt{color:var(--sub);margin:2px 0 14px;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-weight:600}
.btn.pri{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row .btn{flex:1;min-width:130px}
.prog{font-size:14px;color:var(--sub);margin:4px 0 10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pri)}
.wk{margin:14px 0 4px;font-size:13px;color:var(--sub);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 2px;min-height:62px;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px}
.day b{font-size:13px}
.day.done{border-color:var(--pri);background:var(--okBg)}
.day.next{border:2px solid var(--pri);box-shadow:0 0 0 3px var(--okBg)}
.stamp{width:34px;height:34px;border-radius:50%;border:2px solid var(--pri);color:var(--pri);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.day small{color:var(--sub);font-size:10px;line-height:1.1}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .t{flex:1;font-size:14px;color:var(--sub)}
.sbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:14px}
.sbtn.on{color:var(--star);border-color:var(--star);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 0}
.tag{display:inline-block;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-bottom:8px}
.prompt{font-weight:700;margin:0 0 10px}
.stem{font-size:17px;margin:0 0 12px;padding:10px 12px;background:var(--bg);border-radius:10px;word-break:keep-all;overflow-wrap:anywhere}
u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.ch{display:flex;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin:7px 0;font-size:16px;align-items:flex-start}
.ch .n{font-weight:700;color:var(--sub);min-width:20px}
.ch.sel{border-color:var(--pri);background:var(--okBg)}
.ch.ok{border-color:var(--ok);background:var(--okBg)}
.ch.ng{border-color:var(--ng);background:var(--ngBg)}
.ch:disabled{opacity:1;color:inherit}
input.tx{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input.tx.ok{border-color:var(--ok);background:var(--okBg)}input.tx.ng{border-color:var(--ng);background:var(--ngBg)}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--okBg)}.fb.ng{background:var(--ngBg)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb .x{white-space:pre-wrap;margin:6px 0 0}
.fb .l{font-size:12px;color:var(--sub);margin-top:8px}
.nb{width:100%;margin-top:12px}
.score{font-size:40px;font-weight:800;margin:8px 0}
.wl{margin:0;padding:0;list-style:none}
.wl li{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.empty{color:var(--sub);text-align:center;padding:28px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(!n||busy||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;return true},function(){busy=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },gate:gate,flush:flush,name:name};
  flush();
})(window);

const D={"level":"M","sets":[{"day":1,"q":[{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"pleasant","a":"2","e":"pleasant (형) 즐거운, 기분 좋은 - please (동) 기쁘게 하다\n② useful (형) 유용한, 쓸모 있는 - use (동) 사용하다","w":"① apology (명) 사과 - apologize (동) 사과하다\n③ entrance (명) 입구 - enter (동) 들어가다\n④ memory (명) 기억 - memorize (동) 암기하다","m":0,"s":"pleasant - please","c":["apology - apologize","useful - use","entrance - enter","memory - memorize"],"mn":"즐거운, 기분 좋은"},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"signature","a":"3","e":"③ signature: 서명","w":"① receipt: 영수증\n② stamp: 우표, 도장\n④ label: 상표, 라벨","m":0,"s":"\"서명\"","c":["receipt","stamp","signature","label"],"mn":"서명"},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"safe","a":"1","e":"① dangerous: 위험한 (그 낡은 나무 다리는 무거운 트럭에게는 안전하지 않다.) / safe(안전한)의 반의어.","w":"② secure: 안전한, 안심되는\n③ protected: 보호받는\n④ harmless: 해롭지 않은","k":"그 낡은 나무 다리는 무거운 트럭에게는 안전하지 않다.","m":0,"s":"The old wooden bridge is not safe for heavy trucks.","h":"safe","c":["dangerous","secure","protected","harmless"],"mn":"안전한"},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"magnet","a":"3","e":"③ magnet: (금속 조각 / 철과 강철을 자기 쪽으로 끌어당길 수 있는) 자석","w":"① engine: 엔진\n② wheel: 바퀴\n④ battery: 건전지, 배터리","k":"금속 조각 / 철과 강철을 자기 쪽으로 끌어당길 수 있는","m":0,"s":"\"a piece of metal that can pull iron and steel toward itself\"","c":["engine","wheel","magnet","battery"],"mn":"자석"},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"weapon","a":"weapon","e":"weapon 무기","k":"경찰관은 그 남자에게 무기를 내려놓고 천천히 물러서라고 말했다.","m":0,"s":"The police officer told the man to put down his w______ and step back slowly.","mn":"무기"},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"normal","a":"3,4","e":"③ regular: 규칙적인, 정기적인\n④ usual: 평소의, 보통의 (그 아침 기차는 폭설 속에서도 평소 시간에 출발했다.) / normal(보통의, 평범한)의 유의어.","w":"① strange: 이상한\n② rare   let i=0,res=[];
  if(S.cur&&S.cur.day===d){i=S.cur.i;res=S.cur.res}
  R={mode:'day',day:d,list:set.q.slice(),i:i,res:res,round:1};
  if(i>=set.q.length){result();return}
  quiz();
}
function startList(m){
  const ids=Object.keys(m==='wrong'?S.wrong:S.star).sort((a,b)=>{const [d1,n1]=a.split('-').map(Number),[d2,n2]=b.split('-').map(Number);return d1-d2||n1-n2});
  const list=ids.map(id=>QS[id]).filter(Boolean);
  if(!list.length){home();return}
  R={mode:m,list:list,i:0,res:[],round:1};
  quiz();
}
function title(){
  if(R.mode==='day')return R.day+'일'+(R.round===2?' · 다시 풀기':'');
  return R.mode==='wrong'?'오답노트':'별표 모음';
}
function quiz(){
  const q=R.list[R.i];
  const multi=q.m>1,sub=q.f==='주관식';
  let h='<div class="top"><button class="sbtn" id="bh">홈</button><div class="t">'+title()+' · '+(R.i+1)+' / '+R.list.length+'</div><button class="sbtn'+(S.star[q.id]?' on':'')+'" id="bst">별표</button></div>';
  h+='<div class="card"><span class="tag">'+esc(q.tn)+'</span><p class="prompt">'+esc(q.p)+'</p>';
  if(q.s)h+='<div class="stem">'+hl(q.s,q.h)+'</div>';
  if(sub){h+='<input class="tx" id="tx" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><div id="fbk"></div><button class="btn pri nb" id="ok">확인</button>'}
  else{
    const hs=q.hc?q.hc.split('|'):[];
    q.c.forEach((c,k)=>{h+='<button class="ch" data-k="'+(k+1)+'"><span class="n">'+CN[k]+'</span><span>'+hl(c,hs[k])+'</span></button>'});
    h+='<div id="fbk"></div>';
    if(multi)h+='<button class="btn pri nb" id="ok" disabled>확인</button>';
  }
  h+='</div>';
  $.innerHTML=h;
  window.scrollTo(0,0);
  document.getElementById('bh').onclick=home;
  document.getElementById('bst').onclick=e=>{if(S.star[q.id])delete S.star[q.id];else S.star[q.id]=1;save();e.target.classList.toggle('on',!!S.star[q.id])};
  if(sub){
    const tx=document.getElementById('tx'),ok=document.getElementById('ok');
    const go=()=>{if(!tx.value.trim())return;const n=s=>s.trim().toLowerCase().replace(/\s+/g,' ');const v=n(tx.value);const accept=[q.a].concat(q.al?q.al.split('|'):[]).map(n);const r=accept.indexOf(v)>=0;tx.disabled=true;tx.classList.add(r?'ok':'ng');ok.style.display='none';judged(q,r,q.a)};
    ok.onclick=go;tx.onkeydown=e=>{if(e.key==='Enter')go()};
  } else if(multi){
    const sel=new Set(),ok=document.getElementById('ok');
    $.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(sel.has(k))sel.delete(k);else sel.add(k);b.classList.toggle('sel',sel.has(k));ok.disabled=!sel.size});
    ok.onclick=()=>{const ans=q.a.split(',').map(Number);const r=ans.length===sel.size&&ans.every(a=>sel.has(a));$.querySelectorAll('.ch').forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove('sel');if(ans.indexOf(k)>=0)b.classList.add('ok');else if(sel.has(k))b.classList.add('ng')});ok.style.display='none';judged(q,r)};
  } else {
    $.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,a=+q.a;$.querySelectorAll('.ch').forEach(x=>{x.disabled=true;if(+x.dataset.k===a)x.classList.add('ok')});if(k!==a)b.classList.add('ng');judged(q,k===a)});
  }
  if(sub)document.getElementById('tx').focus();
}
function judged(q,r,showAns){
  if(R.round===1){
    R.res[R.i]=r?1:0;
    if(R.mode==='day'){S.cur={day:R.day,i:R.i+1,res:R.res.slice()}}
    if(r){const w=S.wrong[q.id];if(w){w.s=(w.s||0)+1;if(w.s>=2)delete S.wrong[q.id]}}
    else{S.wrong[q.id]={s:0};if(q.mn)WN.add([{w:q.wb||q.wd,m:q.mn,src:'데일리보카',how:'문제 오답',ask:false}])}
    save();
  } else R.res[R.i]=r?1:0;
  let h='<div class="fb '+(r?'ok':'ng')+'"><h3>'+(r?'정답':'오답')+(!r&&showAns?' · 정답: '+esc(showAns):'')+'</h3>';
  if(q.e)h+='<div class="x">'+esc(q.e)+'</div>';
  if(q.w)h+='<div class="x" style="margin-top:8px">'+esc(q.w)+'</div>';
  if(q.k&&(!q.e||q.e.indexOf(q.k)<0))h+='<div class="l">해석</div><div class="x">'+esc(q.k)+'</div>';
  h+='</div><button class="btn pri nb" id="nx">'+(R.i+1>=R.list.length?'결과 보기':'다음')+'</button>';
  document.getElementById('fbk').innerHTML=h;
  document.getElementById('nx').onclick=()=>{R.i++;if(R.i>=R.list.length)result();else quiz()};
  document.getElementById('nx').scrollIntoView({block:'nearest'});
}
function result(){
  const tot=R.list.length,ok=R.res.reduce((a,b)=>a+b,0);
  const wrongQ=R.list.filter((q,i)=>!R.res[i]);
  let h='<h1>'+title()+'</h1><div class="score">'+ok+' / '+tot+'</div>';
  if(R.mode==='day'){
    if(R.round===1){R.first=ok;}
    if(R.round===1&&wrongQ.length){
      h+=wlist(wrongQ)+'<button class="btn pri nb" id="rt">틀린 문제 다시 풀기</button><button class="btn nb" id="hm">홈으로</button>';
      save();$.innerHTML=h;
      document.getElementById('rt').onclick=()=>{R.list=wrongQ;R.i=0;R.res=[];R.round=2;quiz()};
      document.getElementById('hm').onclick=home;return;
    }
    S.done[R.day]={s:R.first+'/15',t:Date.now()};S.cur=null;
    save();WN.hw(D.level,R.day,R.first+'/15');
    if(wrongQ.length)h+=wlist(wrongQ);
    h+='<button class="btn pri nb" id="hm">홈으로</button>';
  } else {
    if(wrongQ.length)h+=wlist(wrongQ);
    h+='<button class="btn pri nb" id="hm">홈으로</button>';
  }
  $.innerHTML=h;document.getElementById('hm').onclick=home;
}
function wlist(l){return '<div class="card"><ul class="wl">'+l.map(q=>'<li><b>'+esc(q.wd)+'</b> · '+esc(q.tn)+'</li>').join('')+'</ul></div>'}
WN.gate(function(){KEY='dv_'+D.level+'_'+WN.name();try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}S.done=S.done||{};S.wrong=S.wrong||{};S.star=S.star||{};home()});
</script>
</body>
