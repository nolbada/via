opts":["끝난다","달라진다","멈춘다","지속된다"],"word":"lasts","r":{"a":"4) 지속된다","ev":"7~8번 문장","s":[[7,"Their breathing as well as their brain and heart activity stops completely.","뇌와 심장 활동뿐만 아니라 호흡도 완전히 멈춘다."],[8,"This lasts for months, so they seem dead.","이것은 몇 달 동안 지속되어서, 그것들은 죽은 것처럼 보인다."]],"w":"7번에서 호흡과 심장이 멈춘 상태가 몇 달 동안 이어져서 죽은 것처럼 보여요. last는 '지속되다'예요.","c":4},"h":"027713dcb4"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIf their bodies weren’t able to produce it, they would freeze to death.","ko":"밑줄 친 it이 가리키는 것은?","sko":"만약 그것들의 몸이 그것을 만들어내지 못한다면, 그것들은 얼어 죽을 것이다.","opts":["겨울의 추위","몸에 있는 물","특수한 동결 방지 물질","얼음 덩어리"],"r":{"a":"3) 특수한 동결 방지 물질","ev":"10번, 12번 문장","s":[[10,"When wood frogs start to freeze, their bodies produce a special antifreeze substance.","송장 개구리가 얼기 시작할 때, 그것들의 몸은 특수한 동결 방지 물질을 만들어낸다."],[12,"If their bodies weren’t able to produce it, they would freeze to death.","만약 그것들의 몸이 그것을 만들어내지 못한다면, 그것들은 얼어 죽을 것이다."]],"w":"몸이 '만들어내는' 것은 10번의 special antifreeze substance(특수한 동결 방지 물질)예요. 12번은 이 물질을 만들지 못하면 얼어 죽는다는 내용이에요.","c":3,"k":"it = 특수한 동결 방지 물질"},"h":"bc3a8d2f7d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Someday, they may find a way to freeze and unfreeze a person!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"언젠가는, 그들이 사람을 얼리고 녹이는 방법을 찾을지도 모른다!","opts":["그들은 이미 사람을 얼리고 녹이는 방법을 널리 쓰고 있다!","언젠가, 그들은 사람이 개구리로 변하는 방법을 찾을지도 모른다!","그들은 사람을 얼리는 일이 불가능하다는 것을 확인했다!","언젠가, 그들은 사람을 얼리고 녹이는 방법을 찾을지도 모른다!"],"r":{"a":"4) 언젠가, 그들은 사람을 얼리고 녹이는 방법을 찾을지도 모른다!","ev":"14번 문장","s":[[14,"Someday, they may find a way to freeze and unfreeze a person!","언젠가는, 그들이 사람을 얼리고 녹이는 방법을 찾을지도 모른다!"]],"w":"Someday는 '언젠가', may find는 '찾을지도 모른다', a way to freeze and unfreeze a person은 '사람을 얼리고 녹이는 방법'이에요. 지금은 아직 못 찾았다는 뜻이에요.","c":4},"h":"dbeadcb7e4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["송장 개구리는 북아메리카 전역에서 발견되고 북극에도 산다.","송장 개구리는 얼어 있는 동안에도 계속 숨을 쉰다.","송장 개구리는 따뜻한 곳에서만 산다.","송장 개구리는 봄이 오면 얼어 죽는다."],"opts":["Wood frogs are found across North America and even live in the Arctic.","Wood frogs keep breathing while they are frozen.","Wood frogs live only in warm places.","Wood frogs freeze to death when spring comes."],"r":{"a":"1) Wood frogs are found across North America and even live in the Arctic.","ev":"4번, 7번, 9번 문장","s":[[4,"Wood frogs, which are found across North America, even live in the Arctic.","송장 개구리는, 북아메리카 전역에서 발견되는데, 심지어 북극에도 산다."],[7,"Their breathing as well as their brain and heart activity stops completely.","뇌와 심장 활동뿐만 아니라 호흡도 완전히 멈춘다."],[9,"However, when spring comes, they revive!","하지만, 봄이 오면, 그것들은 되살아난다!"]],"w":"4번에서 송장 개구리는 북아메리카 전역에서 발견되고 심지어 북극에도 산다고 해요. 얼면 호흡이 멈추고(7번), 봄에는 되살아나요(9번).","c":1},"h":"ca62aec7b0"},{"n":9,"t":"sum","q":"Most people think of polar (A), seals, and (B) when they think of the Arctic.","ko":"대부분의 사람들은 북극을 떠올릴 때 북극 (A), 물개, 그리고 (B)을(를) 떠올린다.","oko":["(A) 곰 / (B) 순록","(A) 곰 / (B) 토끼","(A) 새 / (B) 순록","(A) 늑대 / (B) 토끼","(A) 새 / (B) 토끼"],"opts":["(A) bears / (B) reindeer","(A) bears / (B) rabbits","(A) birds / (B) reindeer","(A) wolves / (B) rabbits","(A) birds / (B) rabbits"],"r":{"a":"1) (A) bears / (B) reindeer ((A) 곰 / (B) 순록)","ev":"2번 문장","s":[[2,"Most people think of polar bears, seals, and reindeer.","대부분의 사람들은 북극곰, 물개, 그리고 순록을 떠올린다."]],"w":"2번에서 대부분의 사람들은 북극곰(polar bears), 물개, 그리고 순록(reindeer)을 떠올린다고 해요.","c":1},"h":"fe4deca72b"},{"n":10,"t":"fill","q":"This is possible because they can [A] the freezing [B] there.","ko":"이것은 그것들이 그곳의 꽁꽁 얼게 추운 [B]을(를) [A] 수 있기 때문에 가능하다.","bank":["survive","stops","temperatures","prevents","lasts","seems"],"bko":{"survive":"견뎌내다","stops":"멈춘다(stop의 3인칭 단수)","temperatures":"온도","prevents":"막는다(prevent의 3인칭 단수)","lasts":"지속된다(last의 3인칭 단수)","seems":"~처럼 보인다(seem의 3인칭 단수)"},"r":{"a":"[A] survive (견뎌내다), [B] temperatures (온도)","ev":"5번 문장","s":[[5,"This is possible because they can survive the freezing temperatures there.","이것은 그것들이 그곳의 꽁꽁 얼게 추운 온도를 견뎌낼 수 있기 때문에 가능하다."]],"w":"5번에서 송장 개구리는 그곳의 꽁꽁 얼게 추운 온도(temperatures)를 견뎌낼(survive) 수 있어서 북극에서 살 수 있다고 해요.","c":null},"h":"4e410b21e4"}]},{"u":8,"id":"hk2-08-1","no":1,"ko":"단순하지만 매력 있어","items":[{"n":1,"t":"tf","q":"All the brand logos above use the same typeface.","ko":"위의 브랜드 로고들은 모두 같은 서체를 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They all use the same typeface—Helvetica!","그것들은 모두 헬베티카라는 같은 서체를 사용한다!"]],"w":"3번 문장에서 로고들이 모두 같은 서체인 헬베티카를 쓴다고 해요. 본문과 맞아요.","c":"T"},"h":"86c28e65a0"},{"n":2,"t":"tf","q":"Helvetica is rarely used in corporate logos or websites.","ko":"헬베티카는 기업 로고나 웹사이트에 거의 쓰이지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Though you may not have noticed, Helvetica is used in many corporate logos, posters, and websites.","비록 알아차리지 못했을 수도 있지만, 헬베티카는 많은 기업 로고, 포스터, 그리고 웹사이트에 사용된다."]],"w":"4번 문장에서 헬베티카는 많은 기업 로고, 포스터, 웹사이트에 쓰인다고 해요. 거의 쓰이지 않는다는 말은 반대예요.","c":"F"},"h":"d6942dad7f"},{"n":3,"t":"tf","q":"Each letter of Helvetica is almost the same width and height.","ko":"헬베티카의 각 글자는 폭과 높이가 거의 같다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Each letter is almost the same width and height.","각각의 글자는 폭과 높이가 거의 같다."]],"w":"7번 문장에 each letter is almost the same width and height가 그대로 나와요.","c":"T"},"h":"93535525bd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Helvetica has a uniform appearance.)","ko":"헬베티카는 ( ) 모양을 가지고 있다.","opts":["복잡한","불규칙한","균일한","화려한"],"word":"uniform","r":{"a":"3) 균일한","ev":"6~7번 문장","s":[[6,"Helvetica has a uniform appearance.","헬베티카는 균일한 모양을 가지고 있다."],[7,"Each letter is almost the same width and height.","각각의 글자는 폭과 높이가 거의 같다."]],"w":"6번의 uniform appearance를 7번이 풀어 줘요. 각 글자의 폭과 높이가 거의 같다는 것이니 uniform은 '균일한'이에요.","c":3},"h":"36d4c76d79"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In addition, Helvetica is neutral and simple.)","ko":"게다가, 헬베티카는 ( )이고 단순하다.","opts":["화려한","중성적인","자극적인","값비싼"],"word":"neutral","r":{"a":"2) 중성적인","ev":"9~11번 문장","s":[[9,"In addition, Helvetica is neutral and simple.","게다가, 헬베티카는 중성적이고 단순하다."],[10,"Most other fonts are designed to give you a certain feeling about the text.","대부분의 다른 서체들은 글자에 대한 특정한 느낌을 주도록 디자인되어 있다."],[11,"However, Helvetica is not supposed to stand out or call attention to itself.","하지만, 헬베티카는 눈에 띄거나 그것 자체에 주의를 끌도록 되어 있지 않다."]],"w":"10~11번에서 다른 서체는 특정한 느낌을 주지만 헬베티카는 눈에 띄지 않는다고 해요. 한쪽으로 치우치지 않는다는 뜻이라 neutral은 '중성적인'이에요.","c":2},"h":"69617fdf00"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHowever, Helvetica is not supposed to stand out or call attention to itself. So, designers can use it in a variety of creative ways.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그래서, 디자이너들은 그것을 다양한 창의적인 방식으로 사용할 수 있다.","opts":["헬베티카","디자이너","로고","서체의 느낌"],"r":{"a":"1) 헬베티카","ev":"11~12번 문장","s":[[11,"However, Helvetica is not supposed to stand out or call attention to itself.","하지만, 헬베티카는 눈에 띄거나 그것 자체에 주의를 끌도록 되어 있지 않다."],[12,"So, designers can use it in a variety of creative ways.","그래서, 디자이너들은 그것을 다양한 창의적인 방식으로 사용할 수 있다."]],"k":"it = 헬베티카","w":"11번에서 헬베티카는 눈에 띄거나 주의를 끌도록 되어 있지 않다고 했어요. 12번의 it은 그 헬베티카를 가리켜요. 그래서 디자이너들이 헬베티카를 다양한 방식으로 쓸 수 있어요.","c":1},"pron":"it","h":"f7281ba160"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"No matter what they do, it fits right in!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들이 무엇을 하더라도, 그것은 딱 들어맞는다!","opts":["그들이 무엇을 하더라도, 그것은 딱 들어맞는다!","그들이 무엇을 하는지 때문에, 그것은 눈에 띈다!","그들이 아무것도 하지 않으면, 그것은 어울리지 않는다!","그들이 무엇을 하든, 그것은 점점 사라진다!"],"r":{"a":"1) 그들이 무엇을 하더라도, 그것은 딱 들어맞는다!","ev":"13번 문장","s":[[13,"No matter what they do, it fits right in!","그들이 무엇을 하더라도, 그것은 딱 들어맞는다!"]],"w":"No matter what ~은 '무엇을 ~하더라도'이고 fit in은 '어울리다, 들어맞다'예요. 디자이너가 어떻게 쓰든 헬베티카는 잘 어울린다는 뜻이에요.","c":1},"h":"3d056cd517"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["헬베티카는 다른 서체들보다 눈에 띄도록 만들어졌다.","많은 디자이너들이 헬베티카를 사용하기를 좋아한다.","헬베티카는 글자 크기가 달라서 읽기 어렵다.","헬베티카는 로고에 처음으로 쓰인 서체이다."],"opts":["Helvetica was made to stand out from other fonts.","Many designers love to use Helvetica.","Helvetica is hard to read because its letters are different sizes.","Helvetica was the first typeface used in logos."],"r":{"a":"2) Many designers love to use Helvetica. (많은 디자이너들이 헬베티카를 사용하기를 좋아한다.)","ev":"14번 문장","s":[[14,"For these reasons, many designers love to use Helvetica.","이러한 이유들로, 많은 디자이너들은 헬베티카를 사용하기를 좋아한다."]],"w":"14번에서 이러한 이유들로 많은 디자이너들이 헬베티카를 사용하기를 좋아한다고 해요.","c":2},"h":"4b5cb78695"},{"n":9,"t":"sum","q":"Helvetica is also known as the (A)’s most (B) font.","ko":"헬베티카는 (A)에서 가장 (B) 서체로도 알려져 있다.","oko":["(A) 세계 / (B) 인기 있는","(A) 세계 / (B) 비싼","(A) 도시 / (B) 인기 있는","(A) 도시 / (B) 비싼","(A) 나라 / (B) 오래된"],"opts":["(A) world / (B) popular","(A) world / (B) expensive","(A) city / (B) popular","(A) city / (B) expensive","(A) country / (B) old"],"r":{"a":"1) (A) world / (B) popular ((A) 세계 / (B) 인기 있는)","ev":"5번 문장","s":[[5,"That’s why it is also known as the world’s most popular font.","그것이 헬베티카가 세계에서 가장 인기 있는 서체로도 알려진 이유이다."]],"w":"5번에서 헬베티카는 세계(world)에서 가장 인기 있는(popular) 서체로도 알려져 있다고 해요.","c":1},"h":"6a86a91a2c"},{"n":10,"t":"fill","q":"Most other fonts are [A] to give you a certain [B] about the text.","ko":"대부분의 다른 서체들은 글자에 대한 특정한 [B]을(를) 주도록 [A].","bank":["designed","feeling","almost","completely","stand","itself"],"bko":{"designed":"디자인되어 있다(design의 과거분사)","feeling":"느낌","almost":"거의","completely":"완전히","stand":"서다","itself":"그것 자체"},"r":{"a":"[A] designed (디자인되어 있다(design의 과거분사)), [B] feeling (느낌)","ev":"10번 문장","s":[[10,"Most other fonts are designed to give you a certain feeling about the text.","대부분의 다른 서체들은 글자에 대한 특정한 느낌을 주도록 디자인되어 있다."]],"w":"10번에서 대부분의 다른 서체들은 글자에 대한 특정한 느낌(feeling)을 주도록 디자인되어 있다(designed)고 해요.","c":null},"h":"8612b9adb2"}]},{"u":8,"id":"hk2-08-2","no":2,"ko":"3, 2, 1... 해피 뉴 이어!","items":[{"n":1,"t":"tf","q":"In Denmark, everyone jumps down when the clock strikes 12.","ko":"덴마크에서는 시계가 12시를 알리면 모든 사람이 뛰어내린다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"When the clock strikes 12, everyone jumps down!","시계가 12시를 알리면, 모든 사람은 뛰어내린다!"]],"w":"4번 문장에서 시계가 12시를 알리면 모든 사람이 뛰어내린다고 해요. 본문과 맞아요.","c":"T"},"h":"96287579ec"},{"n":2,"t":"tf","q":"In the Philippines, square things are symbols of fortune.","ko":"필리핀에서는 네모난 것이 행운의 상징이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Coins represent wealth in the coming year because round things are symbols of fortune in the Philippines.","동전은 다가오는 해의 부를 상징하는데, 왜냐하면 필리핀에서 둥근 것은 행운의 상징이기 때문이다."]],"w":"7번 문장에서 필리핀에서 행운의 상징은 둥근(round) 것이에요. 네모난 것이라는 말은 틀려요.","c":"F"},"h":"a39a4049f0"},{"n":3,"t":"tf","q":"In the Philippines, children pick up the coins that were scattered in homes.","ko":"필리핀에서는 아이들이 집 안에 뿌려진 동전을 줍는다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"These are later picked up by children, who put them in their pockets.","이 동전은 나중에 아이들에 의해 주워지는데, 그들은 그것들을 주머니에 넣는다."]],"w":"9번 문장에서 뿌려진 동전을 나중에 아이들이 주워 주머니에 넣는다고 해요.","c":"T"},"h":"ff56e2ee3a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (On December 31, people scatter coins inside their homes.)","ko":"12월 31일에, 사람들은 집 안에 동전을 ( ).","opts":["모은다","뿌린다","숨긴다","센다"],"word":"scatter","r":{"a":"2) 뿌린다","ev":"8~9번 문장","s":[[8,"On December 31, people scatter coins inside their homes.","12월 31일에, 사람들은 그들의 집 안에 동전을 뿌린다."],[9,"These are later picked up by children, who put them in their pockets.","이 동전은 나중에 아이들에 의해 주워지는데, 그들은 그것들을 주머니에 넣는다."]],"w":"8번 뒤 9번에서 아이들이 그 동전을 주워서 주머니에 넣어요. 동전이 집 안 여기저기 널려 있어야 줍는 일이 생기니, scatter는 '뿌리다'예요.","c":2},"h":"7632a14894"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This is because the loud noise scares bad luck away.)","ko":"이것은 큰 소음이 불운을 ( ) 때문이다.","opts":["가져오기","기록하기","부르기","쫓아버리기"],"word":"scares","r":{"a":"4) 쫓아버리기","ev":"10~11번 문장","s":[[10,"Then, at midnight, the children shake their pockets filled with the coins.","그러고 나서, 자정에, 아이들은 동전으로 가득 찬 주머니를 흔든다."],[11,"This is because the loud noise scares bad luck away.","이것은 큰 소음이 불운을 쫓아버리기 때문이다."]],"w":"10번에서 아이들이 동전이 든 주머니를 흔들어 큰 소리를 내요. 11번은 그 이유로 소음이 불운을 겁주어 쫓아버린다는 뜻의 scare away(쫓아버리다)를 써요.","c":4},"h":"f01dc34093"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nIn Denmark, people get ready to jump right after the countdown. They stand on chairs, sofas, or tables.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 의자, 소파, 또는 탁자 위에 선다.","opts":["덴마크 사람들","의자들","카운트다운","시계"],"r":{"a":"1) 덴마크 사람들","ev":"2~3번 문장","s":[[2,"In Denmark, people get ready to jump right after the countdown.","덴마크에서는, 사람들이 카운트다운 직후에 뛸 준비를 한다."],[3,"They stand on chairs, sofas, or tables.","그들은 의자, 소파, 또는 탁자 위에 선다."]],"k":"They = 덴마크 사람들","w":"2번에서 덴마크에서는 사람들이 카운트다운 직후에 뛸 준비를 한다고 했어요. 3번의 They는 바로 앞 문장의 사람들을 가리켜요. 사람들이 의자, 소파, 또는 탁자 위에 서요.","c":1},"pron":"They","h":"151ec14334"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The more coins they shake, the louder the noise is and the better their year will be.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들이 더 많은 동전을 흔들수록, 소음이 더 커지고 그들의 한 해가 더 좋아질 것이다.","opts":["동전을 더 많이 흔들수록, 소음이 더 커지고 한 해도 더 좋아질 것이다.","동전을 더 많이 흔들수록, 소음이 작아지고 한 해는 나빠질 것이다.","소음이 커질수록, 동전은 더 적어지고 한 해는 좋아질 것이다.","동전을 얼마나 흔드는지는 소음이나 한 해와 관계가 없다."],"r":{"a":"1) 동전을 더 많이 흔들수록, 소음이 더 커지고 한 해도 더 좋아질 것이다.","ev":"12번 문장","s":[[12,"The more coins they shake, the louder the noise is and the better their year will be.","그들이 더 많은 동전을 흔들수록, 소음이 더 커지고 그들의 한 해가 더 좋아질 것이다."]],"w":"「The+비교급 ~, the+비교급 …」은 '~할수록 더 …하다'예요. 동전을 많이 흔들수록 소음이 커지고 한 해가 좋아진다는 뜻이에요.","c":1},"h":"40c210ecfd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["필리핀에서 동전은 불운을 상징한다.","새해의 시작은 보통 카운트다운과 함께 기념된다.","덴마크에서는 사람들이 카운트다운 후에 조용히 침대에 머무른다.","덴마크에서는 사람들이 뛴 다음에 카운트다운을 한다."],"opts":["In the Philippines, coins stand for bad luck.","The start of the new year is usually celebrated with a countdown.","In Denmark, people stay quietly in bed after the countdown.","In Denmark, people count down after they jump."],"r":{"a":"2) The start of the new year is usually celebrated with a countdown. (새해의 시작은 보통 카운트다운과 함께 기념된다.)","ev":"1번 문장","s":[[1,"The start of the new year is usually celebrated with a countdown, but some countries do more to celebrate.","새해의 시작은 보통 카운트다운과 함께 기념되지만, 몇몇 나라들은 기념하기 위해 더 많은 것을 한다."]],"w":"1번에서 새해의 시작은 보통 카운트다운과 함께 기념된다고 해요.","c":2},"h":"cc8b113c42"},{"n":9,"t":"sum","q":"The Philippines also has a (A) New Year’s (B) with coins.","ko":"필리핀 또한 동전과 관련된 (A) 새해 (B)을(를) 가지고 있다.","oko":["(A) 독특한 / (B) 전통","(A) 지루한 / (B) 전통","(A) 독특한 / (B) 문제","(A) 흔한 / (B) 문제","(A) 지루한 / (B) 문제"],"opts":["(A) unique / (B) tradition","(A) boring / (B) tradition","(A) unique / (B) problem","(A) common / (B) problem","(A) boring / (B) problem"],"r":{"a":"1) (A) unique / (B) tradition ((A) 독특한 / (B) 전통)","ev":"6번 문장","s":[[6,"The Philippines also has a unique New Year’s tradition with coins.","필리핀 또한 동전과 관련된 독특한 새해 전통을 가지고 있다."]],"w":"6번에서 필리핀 또한 동전과 관련된 독특한(unique) 새해 전통(tradition)을 가지고 있다고 해요.","c":1},"h":"759fae1417"},{"n":10,"t":"fill","q":"Then, at [A], the children shake their [B] filled with the coins.","ko":"그러고 나서, [A]에, 아이들은 동전으로 가득 찬 [B]을(를) 흔든다.","bank":["midnight","loud","pockets","round","jumps","scatter"],"bko":{"midnight":"자정","loud":"큰","pockets":"주머니","round":"둥근","jumps":"뛴다(jump의 3인칭 단수)","scatter":"뿌리다"},"r":{"a":"[A] midnight (자정), [B] pockets (주머니)","ev":"10번 문장","s":[[10,"Then, at midnight, the children shake their pockets filled with the coins.","그러고 나서, 자정에, 아이들은 동전으로 가득 찬 주머니를 흔든다."]],"w":"10번에서 자정(midnight)에 아이들은 동전으로 가득 찬 주머니(pockets)를 흔든다고 해요.","c":null},"h":"ecfeb85266"}]},{"u":8,"id":"hk2-08-3","no":3,"ko":"슬기로운 호흡 생활","items":[{"n":1,"t":"tf","q":"The tiny hairs in your nose keep dust and dirt from entering the lungs.","ko":"콧속의 작은 털들은 티끌과 먼지가 폐에 들어가는 것을 막는다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"First of all, the tiny hairs in your nose trap dust and dirt, so they don’t enter the lungs.","우선, 콧속의 작은 털들은 티끌과 먼지를 가둬서, 그것들이 폐에 들어가지 않는다."]],"w":"4번 문장에서 콧속의 작은 털들이 티끌과 먼지를 가두어서 폐에 들어가지 않는다고 해요. 본문과 맞아요.","c":"T"},"h":"6ebf6dd008"},{"n":2,"t":"tf","q":"Breathing through your mouth makes the inside of the mouth very wet.","ko":"입으로 숨 쉬면 입 안이 매우 축축해진다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Mainly, it makes the inside of the mouth very dry.","주로, 그것은 입 안을 매우 건조하게 만든다."]],"w":"9번 문장에서 입으로 숨 쉬면 입 안이 매우 '건조해진다(dry)'고 해요. 축축해진다는 말은 반대예요.","c":"F"},"h":"4a2fa0fb10"},{"n":3,"t":"tf","q":"Breathing through your nose helps you think and exercise better.","ko":"코로 숨 쉬는 것은 생각과 운동을 더 잘하도록 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"As a result, you can think and exercise better, since the brain and muscles are well supplied with oxygen.","결과적으로, 당신은 생각과 운동을 더 잘할 수 있는데, 왜냐하면 뇌와 근육이 산소를 잘 공급받기 때문이다."]],"w":"7번 문장에서 코로 숨 쉬면 뇌와 근육이 산소를 잘 공급받아서 생각과 운동을 더 잘할 수 있다고 해요.","c":"T"},"h":"ac430f9182"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the tiny hairs in your nose trap dust and dirt, so they don’t enter the lungs.)","ko":"…콧속의 작은 털들은 티끌과 먼지를 ( ), 그래서 그것들이 폐에 들어가지 않는다.","opts":["퍼뜨려서","가둬서","먹어서","키워서"],"word":"trap","r":{"a":"2) 가둬서","ev":"4번 문장","s":[[4,"First of all, the tiny hairs in your nose trap dust and dirt, so they don’t enter the lungs.","우선, 콧속의 작은 털들은 티끌과 먼지를 가둬서, 그것들이 폐에 들어가지 않는다."]],"w":"먼지가 폐에 들어가지 않으려면 콧털이 먼지를 붙잡아 두어야 해요. 그래서 trap은 '가두다'예요.","c":2},"h":"9f170cde6a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This allows the blood to absorb more oxygen.)","ko":"이것은 혈액이 더 많은 산소를 ( )하도록 한다.","opts":["내보내도록","만들도록","흡수하도록","멈추도록"],"word":"absorb","r":{"a":"3) 흡수하도록","ev":"5~6번 문장","s":[[5,"In addition, a special chemical produced in the nose kills viruses and expands blood vessels.","게다가, 콧속에서 분비되는 특별한 화학 물질은 바이러스를 죽이고 혈관을 팽창시킨다."],[6,"This allows the blood to absorb more oxygen.","이것은 혈액이 더 많은 산소를 흡수하도록 한다."]],"w":"5번에서 혈관이 넓어지고, 6번에서 그 결과 혈액이 산소를 더 많이 받아들여요. absorb는 '흡수하다'예요.","c":3},"h":"ea9872fe1b"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis can produce bad breath and cavities.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 입 냄새와 충치를 만들어낼 수 있다.","opts":["입 안이 매우 건조해지는 것","코로 숨 쉬는 것","콧속의 작은 털","숨을 오래 참는 것"],"r":{"a":"1) 입 안이 매우 건조해지는 것","ev":"9~10번 문장","s":[[9,"Mainly, it makes the inside of the mouth very dry.","주로, 그것은 입 안을 매우 건조하게 만든다."],[10,"This can produce bad breath and cavities.","이것은 입 냄새와 충치를 만들어낼 수 있다."]],"w":"입 냄새와 충치의 원인은 바로 앞 9번에서 말한 '입 안이 매우 건조해지는 것'이에요.","c":1,"k":"This = 입 안이 매우 건조해지는 것"},"h":"968d41168e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"On the other hand, when you use your mouth to breathe, a lot of issues arise.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"반면에, 당신이 숨 쉬기 위해 입을 사용하면, 많은 문제들이 발생한다.","opts":["반면에, 입으로 숨 쉬면 문제가 하나도 생기지 않는다.","반면에, 숨 쉬기 위해 입을 쓰면 코가 많은 문제를 겪는다.","반면에, 입을 사용하는 사람들은 많은 문제를 해결한다.","반면에, 숨 쉬기 위해 입을 사용하면, 많은 문제들이 생긴다."],"r":{"a":"4) 반면에, 숨 쉬기 위해 입을 사용하면, 많은 문제들이 생긴다.","ev":"8번 문장","s":[[8,"On the other hand, when you use your mouth to breathe, a lot of issues arise.","반면에, 당신이 숨 쉬기 위해 입을 사용하면, 많은 문제들이 발생한다."]],"w":"On the other hand는 '반면에'예요. arise는 '생기다'라서 입으로 숨 쉬면 문제가 많이 생긴다는 뜻이에요.","c":4},"h":"9fd71172ea"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["코로 숨 쉬면 입 안이 건조해진다.","입으로 숨 쉬면 혈액이 산소를 더 많이 흡수한다.","어린 시절에 입으로 숨 쉬면 얼굴이 더 길어질 수 있다.","코로 숨 쉬면 충치가 생긴다."],"opts":["Breathing through the nose makes the inside of the mouth dry.","Mouth breathing helps the blood absorb more oxygen.","Mouth breathing during childhood can make the face longer.","Breathing through the nose causes cavities."],"r":{"a":"3) Mouth breathing during childhood can make the face longer.","ev":"11번 문장","s":[[11,"Furthermore, mouth breathing during childhood can result in uneven teeth and a longer face.","게다가, 어린 시절 동안 입으로 숨 쉬는 것은 고르지 않은 치열과 더 긴 얼굴형을 야기할 수 있다."]],"w":"11번 문장에서 어린 시절에 입으로 숨 쉬면 고르지 않은 치아와 더 긴 얼굴형이 될 수 있다고 해요. 나머지는 입 안 건조(9번), 산소 흡수(5~6번), 충치(10번)와 어긋나요.","c":3},"h":"f16cae4cde"},{"n":9,"t":"sum","q":"Breathing through your nose is (A) more (B) than breathing through your mouth.","ko":"코로 숨 쉬는 것은 입으로 숨 쉬는 것보다 (A) 더 (B).","oko":["(A) 훨씬 / (B) 유익하다","(A) 조금 / (B) 유익하다","(A) 훨씬 / (B) 해롭다","(A) 조금 / (B) 해롭다","(A) 훨씬 / (B) 위험하다"],"opts":["(A) much / (B) beneficial","(A) little / (B) beneficial","(A) much / (B) harmful","(A) little / (B) harmful","(A) much / (B) dangerous"],"r":{"a":"1) (A) much / (B) beneficial ((A) 훨씬 / (B) 유익하다)","ev":"3번 문장","s":[[3,"Breathing through your nose is much more beneficial than through your mouth.","코로 숨 쉬는 것은 입으로 숨 쉬는 것보다 훨씬 더 유익하다."]],"w":"3번에서 코로 숨 쉬는 것은 입으로 숨 쉬는 것보다 훨씬(much) 더 유익하다(beneficial)고 해요.","c":1},"h":"7768a852f6"},{"n":10,"t":"fill","q":"A special chemical in the nose kills [A] and expands blood [B].","ko":"콧속의 특별한 화학 물질은 [A]을(를) 죽이고 [B]을(를) 팽창시킨다.","bank":["viruses","vessels","childhood","lungs","cavities","muscles"],"bko":{"viruses":"바이러스","vessels":"혈관","childhood":"어린 시절","lungs":"폐","cavities":"충치","muscles":"근육"},"r":{"a":"[A] viruses, [B] vessels","ev":"5번 문장","s":[[5,"In addition, a special chemical produced in the nose kills viruses and expands blood vessels.","게다가, 콧속에서 분비되는 특별한 화학 물질은 바이러스를 죽이고 혈관을 팽창시킨다."]],"w":"5번에서 콧속의 특별한 화학 물질은 바이러스(viruses)를 죽이고 혈관(blood vessels)을 팽창시킨다고 해요.","c":null},"h":"e562aa77b5"}]},{"u":8,"id":"hk2-08-4","no":4,"ko":"쓱싹쓱싹, 얼음을 문질러요","items":[{"n":1,"t":"tf","q":"Every curling team has two sweepers.","ko":"모든 컬링팀에는 두 명의 스위퍼가 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Every curling team has two players who are called sweepers.","모든 컬링팀에는 스위퍼라고 불리는 두 명의 선수가 있다."]],"w":"4번 문장에서 모든 컬링팀에는 스위퍼라고 불리는 두 명의 선수가 있다고 해요. 본문과 맞아요.","c":"T"},"h":"aa1b33ef72"},{"n":2,"t":"tf","q":"If sweepers don’t sweep at all, the stone moves faster.","ko":"스위퍼들이 전혀 쓸어내지 않으면 스톤은 더 빠르게 움직인다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"On the other hand, if they sweep softly or don’t sweep at all, the stone will slow down and curve more.","반면에, 만약 그들이 살살 쓸어내거나 전혀 쓸어내지 않는다면, 스톤은 느려지고 더 휠 것이다."]],"w":"8번 문장에서 전혀 쓸어내지 않으면 스톤은 느려지고 더 휜다고 해요. 더 빠르다는 말은 반대예요.","c":"F"},"h":"298318871d"},{"n":3,"t":"tf","q":"When the captain says “Whoa!”, the sweepers have to sweep more.","ko":"주장이 “Whoa!”라고 말하면 스위퍼들은 더 쓸어내야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"If it needs less, the captain says “Whoa!”","만약 그것이 덜 필요하다면, 주장은 “Whoa!”라고 말한다."]],"w":"11번 문장에서 얼음이 덜 필요할 때 주장이 “Whoa!”라고 말해요. 즉 덜 쓸어내라는 신호이고, 더 쓸라는 신호는 “Hard!”예요(10번).","c":"F"},"h":"946e542d95"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…to heat up the ice and reduce friction.)","ko":"얼음을 데우고 ( )을 줄이기 위해…","opts":["속도","온도","마찰","소리"],"word":"friction","r":{"a":"3) 마찰","ev":"5번 문장","s":[[5,"They sweep in front of the curling stone to heat up the ice and reduce friction.","그들은 얼음을 데우고 마찰을 줄이기 위해서 컬링 스톤의 앞을 쓸어낸다."]],"w":"스톤 앞을 쓸어서 얼음을 데우면 스톤이 더 잘 미끄러져요. 그래서 줄이려는 것은 마찰(friction)이에요.","c":3},"h":"1a6b459c4f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the stone will slow down and curve more.)","ko":"…스톤은 느려지고 더 ( ).","opts":["빨라진다","휜다","멈춘다","뜨거워진다"],"word":"curve","r":{"a":"2) 휜다","ev":"7~8번 문장","s":[[7,"If they sweep hard, the stone moves faster and straighter.","만약 그들이 세게 쓸어내면, 스톤은 더 빠르고 곧게 움직인다."],[8,"On the other hand, if they sweep softly or don’t sweep at all, the stone will slow down and curve more.","반면에, 만약 그들이 살살 쓸어내거나 전혀 쓸어내지 않는다면, 스톤은 느려지고 더 휠 것이다."]],"w":"7번에서 세게 쓸면 스톤이 곧게 가요. 8번은 그 반대라서 느려지고 더 휜다(curve)는 뜻이에요.","c":2},"h":"d73fcbd4f2"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSome people are diligently brushing the ice with brooms. Are they janitors?","ko":"밑줄 친 they가 가리키는 것은?","sko":"그들은 청소부일까?","opts":["빗자루로 얼음을 닦는 사람들","컬링 스톤들","컬링팀의 주장","구경하는 관중들"],"r":{"a":"1) 빗자루로 얼음을 닦는 사람들","ev":"1~2번 문장","s":[[1,"Some people are diligently brushing the ice with brooms.","몇몇 사람들이 빗자루로 부지런히 얼음을 닦고 있다."],[2,"Are they janitors?","그들은 청소부일까?"]],"k":"they = 빗자루로 얼음을 닦는 사람들","w":"1번에서 몇몇 사람들이 빗자루로 부지런히 얼음을 닦고 있다고 했어요. 2번의 they는 그 사람들을 가리켜요. 3번에서 그들은 청소부가 아니라 컬링팀의 선수들이라고 밝혀요.","c":1},"pron":"they","h":"696df9f4d4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If the ice needs more sweeping, the captain will yell “Hard!”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 얼음을 더 쓸어낼 필요가 있다면, 주장은 “Hard!”라고 소리칠 것이다.","opts":["만약 얼음을 덜 쓸어도 된다면, 주장은 “Hard!”라고 소리칠 것이다.","만약 얼음을 더 쓸어낼 필요가 있다면, 주장은 “Whoa!”라고 소리칠 것이다.","만약 얼음을 더 쓸어낼 필요가 있다면, 주장은 “Hard!”라고 소리칠 것이다.","만약 주장이 소리치면, 얼음은 더 이상 쓸어낼 필요가 없다."],"r":{"a":"3) 만약 얼음을 더 쓸어낼 필요가 있다면, 주장은 “Hard!”라고 소리칠 것이다.","ev":"10번 문장","s":[[10,"If the ice needs more sweeping, the captain will yell “Hard!”","만약 얼음을 더 쓸어낼 필요가 있다면, 주장은 “Hard!”라고 소리칠 것이다."]],"w":"needs more sweeping은 '더 쓸어낼 필요가 있다'이고 yell은 '소리치다'예요. 더 쓸어야 할 때의 신호는 “Hard!”예요.","c":3},"h":"95e04bdfcb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["스위퍼들이 세게 쓸어내면 스톤은 더 빠르고 곧게 움직인다.","스위퍼들이 세게 쓸어내면 스톤은 느려진다.","스위퍼들은 스톤의 뒤를 쓸어낸다.","팀의 주장이 스톤을 던진다."],"opts":["If sweepers sweep hard, the stone moves faster and straighter.","If sweepers sweep hard, the stone slows down.","Sweepers sweep behind the stone.","The captain of the team throws the stone."],"r":{"a":"1) If sweepers sweep hard, the stone moves faster and straighter. (스위퍼들이 세게 쓸어내면 스톤은 더 빠르고 곧게 움직인다.)","ev":"7번 문장","s":[[7,"If they sweep hard, the stone moves faster and straighter.","만약 그들이 세게 쓸어내면, 스톤은 더 빠르고 곧게 움직인다."]],"w":"7번에서 스위퍼들이 세게 쓸어내면 스톤은 더 빠르고 곧게 움직인다고 해요.","c":1},"h":"10f3b12723"},{"n":9,"t":"sum","q":"The captain of the team (A) the (B).","ko":"팀의 주장은 (B)을(를) (A).","oko":["(A) 지도한다 / (B) 스위퍼들","(A) 지도한다 / (B) 스톤들","(A) 친다 / (B) 스위퍼들","(A) 친다 / (B) 빗자루들","(A) 따른다 / (B) 스톤들"],"opts":["(A) guides / (B) sweepers","(A) guides / (B) stones","(A) hits / (B) sweepers","(A) hits / (B) brooms","(A) follows / (B) stones"],"r":{"a":"1) (A) guides / (B) sweepers ((A) 지도한다 / (B) 스위퍼들)","ev":"9번 문장","s":[[9,"The captain of the team guides the sweepers.","팀의 주장은 스위퍼들을 지도한다."]],"w":"9번에서 팀의 주장은 스위퍼들을 지도한다(guides)고 해요.","c":1},"h":"e79efe1416"},{"n":10,"t":"fill","q":"By following the captain’s [A], the team tries to place the stone as close to the [B] as possible and win the game.","ko":"주장의 [A]을(를) 따름으로써, 팀은 스톤을 [B]에 가능한 한 가깝게 놓아서 경기에서 이기려고 노력한다.","bank":["directions","softly","target","straighter","reduce","yell"],"bko":{"directions":"지시","softly":"살살","target":"목표물","straighter":"더 곧게","reduce":"줄이다","yell":"소리치다"},"r":{"a":"[A] directions (지시), [B] target (목표물)","ev":"12번 문장","s":[[12,"By following the captain’s directions, the team tries to place the stone as close to the target as possible and win the game.","주장의 지시를 따름으로써, 팀은 스톤을 목표물에 가능한 한 가깝게 놓아서 경기에서 이기려고 노력한다."]],"w":"12번에서 주장의 지시(directions)를 따라 스톤을 목표물(target)에 가능한 한 가깝게 놓으려 한다고 해요.","c":null},"h":"d3f692cf33"}]},{"u":9,"id":"hk2-09-1","no":1,"ko":"우주의 골칫덩어리","items":[{"n":1,"t":"tf","q":"About 500,000 pieces of junk are floating around in space.","ko":"약 50만 개의 쓰레기 조각들이 우주에 떠다니고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"There are about 500,000 pieces of junk floating around in space.","약 50만 개의 쓰레기 조각들이 우주에 떠다니고 있다."]],"w":"5번 문장에 about 500,000 pieces of junk floating around in space가 그대로 나와요.","c":"T"},"h":"2ebc56ed02"},{"n":2,"t":"tf","q":"A piece of junk as tiny as a pea is too small to hurt a spacecraft.","ko":"완두콩만큼 작은 쓰레기 조각은 우주선을 해치기에는 너무 작다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"At this speed, a piece that is as tiny as a pea can completely destroy a satellite or a spacecraft.","이 속도에서는, 완두콩만큼 작은 조각 하나가 위성이나 우주선을 완전히 파괴할 수 있다."]],"w":"7번에서 완두콩만큼 작은 조각 하나가 위성이나 우주선을 완전히 파괴할 수 있다고 해요. 너무 작아서 못 해친다는 말은 반대예요.","c":"F"},"h":"5887e09d3c"},{"n":3,"t":"tf","q":"Five sailors were injured when space junk hit a Japanese ship.","ko":"우주 쓰레기가 일본 선박을 쳤을 때 다섯 명의 선원이 부상을 입었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"It crashed into a Japanese ship, and five sailors were injured.","그것은 일본 선박과 충돌했고, 다섯 명의 선원이 부상을 입었다."]],"w":"11번에서 우주 쓰레기가 일본 선박과 충돌했고 다섯 명의 선원이 부상을 입었다고 해요.","c":"T"},"h":"7013fdce3e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (At this speed, a piece that is as tiny as a pea can completely destroy a satellite or a spacecraft.)","ko":"이 속도에서는, 완두콩만큼 작은 조각 하나가 위성이나 우주선을 완전히 ( ) 수 있다.","opts":["수리할","파괴할","발사할","발견할"],"word":"destroy","r":{"a":"2) 파괴할","ev":"7번 문장","s":[[7,"At this speed, a piece that is as tiny as a pea can completely destroy a satellite or a spacecraft.","이 속도에서는, 완두콩만큼 작은 조각 하나가 위성이나 우주선을 완전히 파괴할 수 있다."]],"w":"완두콩만큼 작은 조각이 엄청난 속도로 날아와 부딪치면 위성이 망가져요. 그래서 destroy는 '파괴하다'예요.","c":2},"h":"2250dc65f7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When satellites are damaged, the Internet and broadcasting services may not work.)","ko":"위성이 ( ) 인터넷과 방송 서비스가 기능을 못 할 수도 있다.","opts":["손상되면","수리되면","발사되면","팔리면"],"word":"damaged","r":{"a":"1) 손상되면","ev":"8번 문장","s":[[8,"When satellites are damaged, the Internet and broadcasting services may not work.","위성이 손상되면, 인터넷과 방송 서비스가 기능을 못 할 수도 있다."]],"w":"위성이 망가지면 그 결과 인터넷과 방송이 멈출 수 있다는 내용이에요. are damaged는 '손상되다'예요. (damage = 손상을 입히다)","c":1},"h":"6b92e1e5da"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nAll of a sudden, the astronauts are thrown from the spacecraft and float away in space. Unfortunately, this is really possible.","ko":"밑줄 친 this가 가리키는 것은?","sko":"불행히도, 이것은 실제로 일어날 수 있다.","opts":["우주 비행사들이 우주선에서 내던져져 우주에 떠다니는 일","오래된 위성의 부품을 수리하는 일","우주선이 안전하게 지구로 돌아오는 일","인터넷과 방송이 갑자기 끊기는 일"],"r":{"a":"1) 우주 비행사들이 우주선에서 내던져져 우주에 떠다니는 일","ev":"3~4번 문장","s":[[3,"All of a sudden, the astronauts are thrown from the spacecraft and float away in space.","갑자기, 우주 비행사들은 우주선으로부터 내던져지고 우주에 떠다닌다."],[4,"Unfortunately, this is really possible.","불행히도, 이것은 실제로 일어날 수 있다."]],"k":"this = 우주 비행사들이 우주선에서 내던져져 우주에 떠다니는 일","w":"3번에서 우주 비행사들이 우주선에서 내던져져 우주에 떠다닌다고 했어요. 4번의 this는 바로 앞 문장의 이 상황을 가리켜요. 이런 일이 실제로 일어날 수 있다는 뜻이에요.","c":1},"pron":"this","h":"c8a221b2ca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Clearly, space junk is not just a problem in space.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","s aning of the underlined word? (They swing the babies or make loud noises and scary faces.)","ko":"그들은 아기를 ( ) 큰소리를 내며 무서운 얼굴을 한다.","opts":["던지거나","씻기거나","흔들거나","재우거나"],"word":"swing","r":{"a":"3) 흔들거나","ev":"10번 문장","s":[[10,"They swing the babies or make loud noises and scary faces.","그들은 아기를 흔들거나 큰소리를 내며 무서운 얼굴을 한다."]],"w":"선수들이 아기를 울리려고 하는 행동이라서 swing은 '흔들다'예요. 큰 소리를 내고 무서운 얼굴을 하는 것과 같은 종류의 방법이에요.","c":3},"h":"f91971e819"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nAt that time, people thought the sound of crying babies chased away evil spirits. They also believed the ceremony brought good fortune and health.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 또한 그 의식이 행운과 건강을 가져다준다고 믿었다.","opts":["그 당시의 사람들","우는 아기들","스모 선수들","악령들"],"r":{"a":"1) 그 당시의 사람들","ev":"6~7번 문장","s":[[6,"At that time, people thought the sound of crying babies chased away evil spirits.","그 당시에, 사람들은 우는 아기들의 소리가 악령을 쫓아낸다고 생각했다."],[7,"They also believed the ceremony brought good fortune and health.","그들은 또한 그 의식이 행운과 건강을 가져다준다고 믿었다."]],"k":"They = 그 당시의 사람들","w":"6번에서 그 당시에 사람들은 우는 아기들의 소리가 악령을 쫓아낸다고 생각했어요. 7번의 They는 바로 앞 문장의 사람들을 가리켜요. 사람들은 그 의식이 행운과 건강을 가져다준다고도 믿었어요.","c":1},"pron":"They","h":"825484fc8b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Two sumo wrestlers help the babies compete by trying to make them cry.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"두 명의 스모 선수는 아기를 울게 만들려고 노력함으로써 그들이 경쟁하도록 돕는다.","opts":["스모 선수들은 아기들이 울음을 참도록 돕는다.","스모 선수들은 아기를 울리려고 노력해서 아기들이 경쟁하도록 돕는다.","아기들은 스모 선수들을 울게 만들며 경쟁한다.","스모 선수들은 아기들과 경쟁하며 우는 법을 배운다."],"r":{"a":"2) 스모 선수들은 아기를 울리려고 노력해서 아기들이 경쟁하도록 돕는다.","ev":"4번 문장","s":[[4,"Two sumo wrestlers help the babies compete by trying to make them cry.","두 명의 스모 선수는 아기를 울게 만들려고 노력함으로써 그들이 경쟁하도록 돕는다."]],"w":"help the babies compete는 '아기들이 경쟁하도록 돕다'이고, by trying to make them cry는 '아기들을 울게 만들려고 노력함으로써'예요.","c":2},"h":"f9466d9025"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Naki Sumo는 . They created instruments that can be played underwater and planned to put on a concert.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 물속에서 연주될 수 있는 악기를 만들었고 콘서트 공연을 계획했다.","opts":["객석의 관객들","물속의 악기들","Laila와 네 명의 다른 음악가들","유리 수조 속의 물고기들"],"r":{"a":"3) Laila와 네 명의 다른 음악가들","ev":"6~7번 문장","s":[[6,"Laila also formed a band with four other musicians.","Laila는 또한 네 명의 다른 음악가들과 함께 밴드를 결성했다."],[7,"They created instruments that can be played underwater and planned to put on a concert.","그들은 물속에서 연주될 수 있는 악기를 만들었고 콘서트 공연을 계획했다."]],"k":"They = Laila와 네 명의 다른 음악가들","w":"6번에서 Laila가 네 명의 다른 음악가들과 함께 밴드를 결성했다고 했어요. 7번의 They는 바로 앞 문장의 Laila와 그 음악가들을 가리켜요. 그들이 물속에서 연주할 수 있는 악기를 만들었어요.","c":3},"pron":"They","h":"892f8eb558"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The music may sound strange at first, but it’s fascinating!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 음악은 처음에 이상하게 들릴 수도 있지만, 매력적이다!","opts":["그 음악은 처음에 이상하게 들릴 수 있지만 매력적이다.","그 음악은 처음에는 매력적이지만 나중에는 이상해진다.","그 음악은 이상하게 들려서 아무도 좋아하지 않는다.","그 음악은 처음부터 끝까지 일반 음악과 똑같다."],"r":{"a":"1) 그 음악은 처음에 이상하게 들릴 수 있지만 매력적이다.","ev":"13번 문장","s":[[13,"The music may sound strange at first, but it’s fascinating!","그 음악은 처음에 이상하게 들릴 수도 있지만, 매력적이다!"]],"w":"may sound strange at first는 '처음에 이상하게 들릴 수도 있다', but it's fascinating은 '하지만 매력적이다'예요.","c":1},"h":"28a9d522e5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Laila는 물속에서 숨을 쉬면서 노래한다.","물속에서 노래를 하는 것은 거의 불가능하다.","Laila는 너무 어려워서 노래를 그만두었다.","밴드는 숲속에서 공연을 했다."],"opts":["Laila sings by breathing in the water.","It is almost impossible to sing underwater.","Laila stopped singing because it was too difficult.","The band gave a performance in a forest."],"r":{"a":"2) It is almost impossible to sing underwater. (물속에서 노래를 하는 것은 거의 불가능하다.)","ev":"1번 문장","s":[[1,"It’s almost impossible to sing underwater.","물속에서 노래를 하는 것은 거의 불가능하다."]],"w":"1번에서 물속에서 노래를 하는 것은 거의 불가능하다고 해요.","c":2},"h":"30f79572b8"},{"n":9,"t":"sum","q":"However, musician 가는 새에게 있어서, 다운은 몸을 따뜻하게 유지하기 위해 필요하다."]],"w":"9번에서 오리와 거위는 물속에 들어가는 새라고 해요. 물에 거의 안 들어가는 쪽은 닭이에요(11번).","c":"F"},"h":"38d927fa3a"},{"n":3,"t":"tf","q":"Chickens need down because they often go in the water.","ko":"닭은 물속에 자주 들어가기 때문에 다운이 필요하다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"On the other hand, chickens rarely go in the water, so they don’t need down.","반면에, 닭은 물속에 거의 들어가지 않아서, 다운이 필요 없다."]],"w":"11번에서 닭은 물속에 거의 들어가지 않아서 다운이 필요 없다고 해요.","c":"F"},"h":"12a451d65e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It traps air, preventing heat from escaping and blocking cold air from entering.)","ko":"그것은 열이 빠져나가는 것을 막고 차가운 공기가 들어오는 것을 막으면서, 공기를 ( ).","opts":["내보낸다","가둔다","만든다","식힌다"],"word":"traps","r":{"a":"2) 가둔다","ev":"7번 문장","s":[[7,"It traps air, preventing heat from escaping and blocking cold air from entering.","이것은 열이 빠져나가는 것을 막고 차가운 공기가 들어오는 것을 막으면서, 공기를 가둔다."]],"w":"다운이 공기를 안에 붙잡아 두어서 열이 나가지 못하고 찬 공기가 못 들어와요. 그래서 trap은 '가두다'예요.","c":2},"h":"0d40f3f34f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Instead, they only have strong, tough feathers.)","ko":"대신에, 그것들은 질기고, ( ) 깃털만을 가지고 있다.","opts":["화려한","얇은","부드러운","억센"],"word":"tough","r":{"a":"4) 억센","ev":"12번 문장","s":[[12,"Instead, they only have strong, tough feathers.","대신에, 그것들은 질기고, 억센 깃털만을 가지고 있다."]],"w":"strong(질긴)과 나란히 쓰여 닭의 깃털이 단단하다는 뜻이에요. 6번의 얇고 가벼운 다운과 대조돼요. tough = 억센.","c":4},"h":"9598acecbd"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWithout it, their body temperature would drop while they’re in cold ponds.","ko":"밑줄 친 it가 가리키는 것은?","sko":"그것이 없다면, 그것들의 체온은 차가운 연못에 있는 동안 떨어질 것이다.","opts":["연못","다운","체온","닭"],"r":{"a":"2) 다운","ev":"9~10번 문장","s":[[9,"For birds that go in the water like ducks and geese, down is necessary to keep their bodies warm.","오리와 거위 같이 물속에 들어가는 새에게 있어서, 다운은 몸을 따뜻하게 유지하기 위해 필요하다."],[10,"Without it, their body temperature would drop while they’re in cold ponds.","다운이 없다면, 그것들이 차가운 연못에 있는 동안 체온이 떨 .”","놀랍게도, 정답은 ‘그렇다’이다."]],"w":"7번에서 Surprisingly, the answer is \"yes.\"라고 해요. 'no'는 반대예요.","c":"F"},"h":"a4ad8001bd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In fact, the fist bump is even recommended by some doctors.)","ko":"사실, 피스트 범프는 심지어 몇몇 의사들에 의해 ( ).","opts":["금지된다","권장된다","발명된다","비난받는다"],"word":"recommended","r":{"a":"2) 권장된다","ev":"8번 문장","s":[[8,"In fact, the fist bump is even recommended by some doctors.","사실, 피스트 범프는 심지어 몇몇 의사들에 의해 권장되기도 한다."]],"w":"의사들이 피스트 범프를 좋게 본다는 뜻이고, 뒤 9~10번에서 그 이유를 설명해요. recommend = 권장하다(권하다).","c":2},"h":"5cc8da99c7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In an experiment, it was found that fist bumps transferred 20 times fewer germs than handshakes.)","ko":"한 실험에서는, 피스트 범프가 악수보다 20배 더 적은 세균을 ( ) 것이 밝혀졌다.","opts":["닦았다는","없앴다는","옮겼다는","키웠다는"],"word":"transferred","r":{"a":"3) 옮겼다는","ev":"9번 문장","s":[[9,"In an experiment, it was found that fist bumps transferred 20 times fewer germs than handshakes because the hands have less contact.","한 실험에서는, 손이 접촉을 덜 하기 때문에 피스트 범프가 악수보다 20배 더 적은 세균을 옮겼다는 것이 밝혀졌다."]],"w":"손끼리 닿으면 세균이 옮겨 가는데, 피스트 범프는 그 양이 더 적다는 실험이에요. transfer = 옮기다.","c":3},"h":"5bc0da486f"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nThis greeting is called a fist bump. It became popular because of one baseball player in the 1950s.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 1950년대에 한 야구 선수 때문에 대중화되었다.","opts":["야구 선수","피스트 범프","1950년대","악수"],"r":{"a":"2) 피스트 범프","ev":"2~3번 문장","s":[[2,"This greeting is called a fist bump.","이 인사는 피스트 범프라고 불린다."],[3,"It became popular because of one baseball player in the 1950s.","그것은 1950년대에 한 야구 선수 때문에 대중화되었다."]],"k":"It = 피스트 범프","w":"2번에서 이 인사는 피스트 범프라고 불린다고 했어요. 3번의 It은 바로 앞 문장의 피스트 범프를 가리켜요. 한 야구 선수 때문에 대중화되었어요.","c":2},"pron":"It","h":"50b8730240"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Maybe one day, everyone will be greeting each other with fist bumps!\"","ko":"이 문장의 의미로 가장 알맞은 l in the bathroom.","Worry dolls can only be made by children."],"r":{"a":"2) Some people let dolls get rid of their worries. (어떤 사람들은 인형이 그들의 걱정을 없애도록 둔다.)","ev":"3번 문장","s":[[3,"Some people let dolls get rid of their worries.","어떤 사람들은 인형이 그들의 걱정을 없애도록 둔다."]],"w":"3번에서 어떤 사람들은 인형이 그들의 걱정을 없애도록 둔다고 해요.","c":2},"h":"02aa7b72af"},{"n":9,"t":"sum","q":"Stick toothpicks to the paper to make its (A) and (B).","ko":"종이에 이쑤시개를 붙여서 인형의 (A)과(와) (B)을(를) 만들어라.","oko":["(A) 팔 / (B) 다리","(A) 팔 / (B) 머리카락","(A) 귀 / (B) 다리","(A) 귀 / (B) 머리카락","(A) 날개 / (B) 꼬리"],"opts":["(A) arms / (B) legs","(A) arms / (B) hair","(A) ears / (B) legs","(A) ears / (B) hair","(A) wings / (B) tails"],"r":{"a":"1) (A) arms / (B) legs ((A) 팔 / (B) 다리)","ev":"8번 문장","s":[[8,"Stick toothpicks to the paper to make its arms and legs.","팔과 다리를 만들기 위해 종이에 이쑤시개를 붙여라."]],"w":"8번에서 팔(arms)과 다리(legs)를 만들기 위해 종이에 이쑤시개를 붙이라고 해요.","c":1},"h":"2e03c5f2a9"},{"n":10,"t":"fill","q":"[A] the doll with colorful [B].","ko":"인형에게 알록달록한 [B](으)로 옷을 [A].","bank":["Dress","threads","during","easily","worry-free","rectangular"],"bko":{"Dress":"입혀라(dress, 명령)","threads":"실","during":"~ 동안","easily":"쉽게","worry-free":"걱정이 없는","rectangular":"직사각형의"},"r":{"a":"[A] Dress (입혀라(dress, 명령)), [B] threads (실)","ev":"9번 문장","s":[[9,"Dress the doll with colorful threads.","인형에게 알록달록한 실로 옷을 입혀라."]],"w":"9번에서 인형에게 알록달록한 실(threads)로 옷을 입히라(Dress)고 해요.","c":null},"h":"1170b31cf0"}]},{"u":10,"id":"hk2-10-3","no":3,"ko":"두 얼굴의 아보카도","items":[{"n":1,"t":"tf","q":"Avocados contain healthy fats and lots of vitamins.","ko":"아보카도는 건강에 좋은 지방과 많은 비타민을 함유하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Avocados contain healthy fats and lots of vitamins, so they are good for your body.","아보카도는 건강에 좋은 지방과 많은 비타민을 함유하고 있어서, 몸에 좋다."]],"w":"2번 문장에 그대로 나와요.","c":"T"},"h":"917b2b4482"},{"n":2,"t":"tf","q":"Avocado roots can absorb water very well.","ko":"아보카도의 뿌리는 물을 매우 잘 흡수할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"These roots cannot absorb water very well.","이 뿌리는 물을 매우 잘 흡수하지 못한다."]],"w":"6번에서 이 뿌리는 물을 매우 잘 흡수하지 못한다(cannot absorb water very well)고 해요. 반대예요.","c":"F"},"h":"96a2b57509"},{"n":3,"t":"tf","q":"Producing a single avocado usually requires about 70 liters of water.","ko":"아보카도 한 개를 생산하는 데는 보통 약 70리터의 물이 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"So, producing a single avocado usually requires a lot of water—about 70 liters.","그래서, 한 개의 아보카도를 생산하는 데 보통 약 70리터의 많은 물이 필요하다."]],"w":"7번 문장에 그대로 나와요.","c":"T"},"h":"427c94d3d0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These roots cannot absorb water very well.)","ko":"이 뿌리는 물을 매우 잘 ( ) 못한다.","opts":["흡수하지","만들지","운반하지","얼리지"],"word":"absorb","r":{"a":"1) 흡수하지","ev":"6번 문장","s":[[6,"These roots cannot absorb water very well.","이 뿌리는 물을 매우 잘 흡수하지 못한다."]],"w":"5번에서 뿌리가 덜 발달하고 털이 없다고 했어요. 그래서 물을 빨아들이지 못해요. absorb = 흡수하다.","c":1},"h":"911d90e72a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In fact, residents have to get water from water trucks.)","ko":"실제로, ( )들은 급수 트럭에서 물을 얻어야 한다.","opts":["농장주","주민","판매원","관광객"],"word":"residents","r":{"a":"2) 주민","ev":"10~11번 문장","s":[[10,"In fact, in Chile’s Petorca region, one of the country’s largest producers of avocados, residents have to get water from water trucks.","실제로, 칠레의 가장 큰 아보카도 생산지 중 하나인 페토르카 지역에서는, 주민들이 급수 트럭에서 물을 얻어야 한다."],[11,"Avocado farms use so much water that there isn’t enough water left for homes!","아보카도 농장들이 너무 많은 물을 사용해서 가정용으로 남겨진 물이 충분하지 않은 것이다!"]],"w":"10번에서 물을 구하러 급수 트럭을 쓰는 사람들이고, 11번에서 가정용 물이 모자란다고 해요. 그래서 resident는 '주민'이에요.","c":2},"h":"60a07c05a4"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAvocados need much more water to grow than other crops. This is because they have underdeveloped, hairless roots.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이것은 그것들이 덜 발달된, 털이 없는 뿌리를 가졌기 때문이다.","opts":["다른 작물들","아보카도","오렌지","농장들"],"r":{"a":"2) 아보카도","ev":"4~5번 문장","s":[[4,"Avocados need much more water to grow than other crops.","아보카도가 자라기 위해서는 다른 작물들보다 훨씬 더 많은 물을 필요로 한다."],[5,"This is because they have underdeveloped, hairless roots.","이것은 그것들이 덜 발달된, 털이 없는 뿌리를 가졌기 때문이다."]],"k":"they = 아보카도","w":"4번에서 아보카도가 자라려면 다른 작물보다 훨씬 더 많은 물이 필요하다고 했어요. 5번의 they는 바로 앞 문장의 아보카도를 가리켜요. 아보카도의 뿌리는 덜 발달했고 털이 없다는 뜻이에요.","c":2},"pron":"they","h":"b0ff0ec450"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Avocado farms use so much water that there isn’t enough water left for homes!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아보카도 농장들이 너무 많은 물을 사용해서 가정용으로 남겨진 물이 충분하지 않은 것이다!","opts":["아보카도 농장이 물을 너무 많이 써서 가정에서 쓸 물이 충분하지 않다.","아보카도 농장이 가정에 물을 나눠 주어서 물이 충분하다.","아보카도 농장은 물이 너무 부족해서 농사를 못 짓는다.","가정에서 물을 너무 많이 써서 농장에 쓸 물이 부족하다."],"r":{"a":"1) 아보카도 농장이 물을 너무 많이 써서 가정에서 쓸 물이 충분하지 않다.","ev":"11번 문장","s":[[11,"Avocado farms use so much water that there isn’t enough water left for homes!","아보카도 농장들이 너무 많은 물을 사용해서 가정용으로 남겨진 물이 충분하지 않은 것이다!"]],"w":"so much water that ~은 '너무 많은 물을 써서 ~하다'이고, 뒤에서 가정용으로 남은 물이 충분하지 않다고 해요.","c":1},"h":"a2329e580e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아보카도는 다른 작물보다 물이 덜 필요하다.","오렌지는 22리터의 물이 필요하고 토마토는 5리터 정도가 필요하다.","페토르카 주민들은 집 근처 강에서 물을 얻는다.","아보카도는 매우 건조한 지역에서 가장 잘 자란다."],"opts":["Avocados need less water than other crops.","Oranges need 22 liters of water, and tomatoes need around 5 liters.","Residents in Petorca get water from rivers near their homes.","Avocados grow best in very dry areas."],"r":{"a":"2) Oranges need 22 liters of water, and tomatoes need around 5 liters. (오렌지는 22리터의 물이 필요하고 토마토는 5리터 정도가 필요하다.)","ev":"8번 문장","s":[[8,"In comparison, oranges need 22 liters and tomatoes only need around 5 liters.","그에 비해, 오렌지는 (물이) 22리터가 필요하고 토마토는 5리터 정도만 필요하다."]],"w":"8번에서 오렌지는 22리터, 토마토는 5리터 정도의 물이 필요하다고 해요.","c":2},"h":"c4eaa9cffe"},{"n":9,"t":"sum","q":"People often enjoy avocados in many foods like (A) and (B).","ko":"오늘날, 사람들은 (A)와(과) (B) 같은 많은 음식에서 종종 아보카도를 즐긴다.","oko":["(A) 샐러드 / (B) 샌드위치","(A) 샐러드 / (B) 신발","(A) 비누 / (B) 샌드위치","(A) 비누 / (B) 신발","(A) 신발 / (B) 양초"],"opts":["(A) salads / (B) sandwiches","(A) salads / (B) shoes","(A) soaps / (B) sandwiches","(A) soaps / (B) shoes","(A) shoes / (B) candles"],"r":{"a":"1) (A) salads / (B) sandwiches ((A) 샐러드 / (B) 샌드위치)","ev":"1번 문장","s":[[1,"These days, people often enjoy avocados in many foods like salads and sandwiches.","오늘날, 사람들은 샐러드와 샌드위치 같은 많은 음식에서 종종 아보카도를 즐긴다."]],"w":"1번에서 사람들은 샐러드(salads)와 샌드위치(sandwiches) 같은 많은 음식에서 종종 아보카도를 즐긴다고 해요.","c":1},"h":"394d8f89b9"},{"n":10,"t":"fill","q":"As a result, avocados have caused a [A] of water in many [B].","ko":"결과적으로, 아보카도는 많은 [B]에서 물 [A]을(를) 초래했다.","bank":["lack","ironically","places","enough","hairless","usually"],"bko":{"lack":"부족","ironically":"역설적으로","places":"곳","enough":"충분한","hairless":"털이 없는","usually":"보통"},"r":{"a":"[A] lack (부족), [B] places (곳)","ev":"9번 문장","s":[[9,"As a result, avocados have caused a lack of water in many places.","결과적으로, 아보카도는 많은 곳에서 물 부족을 초래했다."]],"w":"9번에서 결과적으로 아보카도는 많은 곳(places)에서 물 부족(lack)을 초래했다고 해요.","c":null},"h":"73c49b4fe9"}]},{"u":10,"id":"hk2-10-4","no":4,"ko":"왕관을 쓰려는 자, 그 무게를 견뎌라","items":[{"n":1,"t":"tf","q":"Queen Clever ruled the kingdom called Wise West.","ko":"Clever 여왕은 Wise West라고 불리는 왕국을 다스렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Once upon a time, there was a kingdom called Wise West, which was ruled by Queen Clever.","옛날 옛적에, Wise West라고 불리는 왕국이 있었는데, 그곳은 Clever 여왕에 의해 다스려졌다."]],"w":"1번에서 Wise West라는 왕국은 Clever 여왕에 의해 다스려졌다고 해요.","c":"T"},"h":"d0953e55bd"},{"n":2,"t":"tf","q":"Elizabeth was already a queen when the story began.","ko":"이야기가 시작될 때 Elizabeth는 이미 여왕이었다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"She had a daughter, Elizabeth, who would become queen someday.","그녀는 Elizabeth라는 딸이 있었고, 그녀는 언젠가 여왕이 될 것이었다."]],"w":"2번에서 Elizabeth는 언젠가 여왕이 될(would become queen someday) 딸이라고 해요. 이미 여왕이라는 말은 반대예요.","c":"F"},"h":"666acec1db"},{"n":3,"t":"tf","q":"The princess answered the riddle confidently.","ko":"공주는 수수께끼에 자신 있게 답했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The princess answered confidently.","공주는 자신 있게 답했다."]],"w":"7번에서 공주는 자신 있게(confidently) 답했다고 해요.","c":"T"},"h":"f6197eff95"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But we actually become humble when we know more, as we learn there is no end to learning.)","ko":"하지만 우리는 배움에는 끝이 없다는 것을 알게 되기 때문에, 더 많이 알면 사실 ( ) 된다.","opts":["거만하게","겸손하게","화나게","슬프게"],"word":"humble","r":{"a":"2) 겸손하게","ev":"9번 문장","s":[[9,"But we actually become humble when we know more, as we learn there is no end to learning.","하지만 우리는 배움에는 끝이 없다는 것을 알게 되기 때문에, 더 많이 알면 사실 겸손해집니다."]],"w":"더 많이 알수록 배움에는 끝이 없다는 것을 알게 되니, 잘난 척하기보다 낮은 자세가 돼요. humble = 겸손한.","c":2},"h":"614c451df0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Everyone wants to be smarter than others, so we seek this.)","ko":"모든 사람이 다른 사람들보다 더 똑똑해지기를 원해서, 우리는 이것을 ( ).","opts":["버린다","추구한다","숨긴다","두려워한다"],"word":"seek","r":{"a":"2) 추구한다","ev":"8번 문장","s":[[8,"“Everyone wants to be smarter than others, so we seek this.","“모든 사람이 다른 사람들보다 더 똑똑해지기를 원해서, 우리는 이것을 추구합니다."]],"w":"똑똑해지고 싶어서 이것(지식)을 얻으려고 노력한다는 흐름이라 seek는 '추구하다, 찾다'예요.","c":2},"h":"f1ee7e37b7"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nSo, the Queen gave her a riddle.","ko":"밑줄 친 her가 가리키는 것은?","sko":"그래서, 여왕은 그녀에게 수수께끼를 냈다.","opts":["Elizabeth","Clever 여왕","Wise West의 시민들","여왕의 친구"],"r":{"a":"1) Elizabeth","ev":"3~4번 문장","s":[[3,"But first, the Queen had to be sure Elizabeth could rule the kingdom as wisely as her.","하지만 먼저, 여왕은 Elizabeth가 왕국을 그녀만큼 현명하게 다스릴 수 있다는 것을 확신해야 했다."],[4,"So, the Queen gave her a riddle.","그래서, 여왕은 그녀에게 수수께끼를 냈다."]],"k":"her = Elizabeth","w":"3번에서 여왕은 Elizabeth가 왕국을 현명하게 다스릴 수 있는지 확인해야 했어요. 그래서 4번에서 여왕이 수수께끼를 낸 상대(her)는 Elizabeth예요.","c":1},"pron":"her","h":"aece0e5d7b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Therefore, the answer must be knowledge.\"","ko":"이 문장의 의미로 가장 알맞은 것은
