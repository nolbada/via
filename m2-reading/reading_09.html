our body clock and sleep regularly. You will feel healthier.","Be careful about caffeine.","Caffeine can cause sleep problems. Do you know that even chocolate has caffeine? Caffeine hides in many foods and drinks such as chocolate, coffee, tea, soda, and energy drinks. So, be careful!"];var PASS_KO=["더 나은 수면, 더 나은 삶","학교에 다시 온 걸 환영해요. 오늘 기분은 어떤가요? 어젯밤에 잘 잤나요? 잘 자는 것은 당신에게 새 학년을 위한 에너지를 줄 수 있어요. 이제, 목록을 보면서 당신의 수면 습관을 확인해 보세요.","나는 …","□ 다른 시각에 잠자리에 든다","□ 에너지 음료를 많이 마신다","□ 자기 전에 스마트폰을 사용한다","□ 하루에 8시간보다 적게 잔다","□ 취침 시간 전에 음식을 먹는다","□ 긴 낮잠을 잔다","몇 개의 습관에 체크했나요? 이 습관들은 수면 문제를 일으킬 수 있습니다. 변화가 필요하다고 생각하나요? 무엇을 해야 할지 알아봅시다.","규칙적인 수면 패턴을 가지세요.","당신의 몸은 '시계'를 가지고 있어요. 그 생체 시계는 당신에게 언제 일어나고 자야 할지 말해 줍니다. 예를 들어, 아침에 당신의 몸은 활기가 돌기 시작해요. 밤에 당신의 몸은 졸리기 시작해요. 당신의 생체 시계의 말을 듣고 규칙적으로 자도록 해요. 당신은 더 건강하게 느낄 거예요.","카페인에 주의하세요.","카페인은 수면 문제를 유발할 수 있어요. 심지어 초콜릿에도 카페인이 있다는 것을 알고 있나요? 카페인은 초콜릿, 커피, 차, 탄산음료, 그리고 에너지 음료 같은 많은 음식과 음료에 숨어 있어요. 그러니 조심하세요!"];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["my good habits","my future dream","my club activities","my role in the class","my goal for this year"],"a":4,"ans":"my goal for this year","evs":[["Nicole, what are your goals for this year?","Nicole, 올해 너의 목표는 뭐야?"],["What are your goals, Jinsu?","너의 목표는 뭐야, 진수야?"]],"ev":["Nicole, what are your goals for this year?","Nicole, 올해 너의 목표는 뭐야?"],"ow":["오답 ✕ — 'Just read a little every day.'(매일 조금씩만 읽어 봐.)처럼 독서 이야기가 나오지만 습관 자체가 중심은 아니다. 두 사람이 올해 목표를 묻고 답하는 대화라서 틀림.","오답 ✕ — 'I want to become class president.'(반장이 되고 싶어.)처럼 장래 모습이 나오지만, 먼 미래의 꿈이 아니라 '올해'의 목표(goals for this year)를 이야기하므로 틀림.","오답 ✕ — 동아리 활동에 대한 언급이 전혀 없다. 'what are your goals for this year?'(올해 너의 목표는 뭐야?)가 중심이라서 틀림.","오답 ✕ — 'I want to become class president.'(반장이 되고 싶어.)가 나오지만 이는 진수의 목표 한 가지일 뿐이고, 반에서의 역할 전반이 주제는 아니라서 틀림.","정답 ○ — 'Nicole, what are your goals for this year?'(올해 너의 목표는 뭐야?)로 시작해 책 30권 읽기, 반장 되기 같은 올해의 목표를 서로 이야기하므로 'my goal for this year'가 알맞다."],"memo":["정답: my goal for this year (올해의 내 목표)","근거: what are your goals for this year?(올해 너의 목표는 뭐야?)","함정: 반장이 되고 싶다는 말은 '올해' 목표의 하나일 뿐이다."],"why":"두 사람이 올해의 목표를 서로 이야기하는 대화이다."},{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Nicole은 올해 30권의 책을 읽을 계획이다.","Nicole은 작년 목표를 달성하지 못했다.","진수는 반장이 되고 싶어 한다.","Nicole은 진수가 말을 잘 한다고 생각한다.","Nicole은 진수가 훌륭한 리더가 될 것이라고 생각한다."],"a":3,"ans":"Nicole은 진수가 말을 잘 한다고 생각한다.","evs":[["You're good at listening to people.","너는 사람들의 말을 잘 들어 주잖아."]],"ev":["You're good at listening to people.","너는 사람들의 말을 잘 들어 주잖아."],"ow":["오답 ✕ — Nicole은 'I'm planning to read 30 books.'(나는 책을 30권 읽을 계획이야.)라고 했으므로 이 설명은 일치한다.","오답 ✕ — Nicole은 'I tried last year but didn't make it.'(작년에도 시도했는데 해내지 못했어.)라고 했으므로 일치한다.","오답 ✕ — 진수는 'I want to become class president.'(반장이 되고 싶어.)라고 했으므로 일치한다.","정답 ○ — Nicole은 'You're good at listening to people.'(너는 사람들의 말을 잘 들어 주잖아.)라고 했다. 말을 잘 한다가 아니라 잘 '들어 준다'는 뜻이라서 일치하지 않는다.","오답 ✕ — Nicole은 'You'll be a great leader.'(너는 훌륭한 리더가 될 거야.)라고 했으므로 일치한다."],"memo":["정답: ④ Nicole은 진수가 말을 잘 한다고 생각한다 (✕ 일치하지 않음)","근거: You're good at listening to people.(너는 사람들의 말을 잘 들어 주잖아.)","함정: listening(듣기) ≠ speaking(말하기)"],"why":"Nicole이 칭찬한 것은 말을 잘하는 것이 아니라 잘 들어 주는 것이다."}],"dlg":[["Jinsu","Nicole, what are your goals for this year?","Nicole, 올해 너의 목표는 뭐야?"],["Nicole","I'm planning to read 30 books. I tried last year but didn't make it.","나는 책을 30권 읽을 계획이야. 작년에도 시도했는데 해내지 못했어."],["Jinsu","That's a big goal.","그거 큰 목표구나."],["Nicole","Yes, I really want to do it this time.","응, 이번에는 정말 해내고 싶어."],["Jinsu","You can do it! Just read a little every day.","넌 할 수 있어! 매일 조금씩만 읽어 봐."],["Nicole","Okay, I will. What are your goals, Jinsu?","알겠어, 그렇게 할게. 너의 목표는 뭐야, 진수야?"],["Jinsu","I'm planning to run for the election. I want to become class president.","나는 선거에 출마할 계획이야. 반장이 되고 싶어."],["Nicole","You're good at listening to people. You'll be a great leader.","너는 사람들의 말을 잘 들어 주잖아. 너는 훌륭한 리더가 될 거야."],["Jinsu","Thank you for saying so.","그렇게 말해 줘서 고마워."],["Nicole","You're welcome. I hope we can reach our goals.","천만에. 우리가 목표를 이룰 수 있으면 좋겠다."]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하는 것은?","o":["Leo는 올해 운동을 더 많이 할 계획이다.","소녀는 배드민턴을 좋아하지 않는다.","Leo는 축구를 하고 싶어 한다.","Leo는 소녀의 제안을 거절했다.","소녀는 올해 운동을 더 많이 할 계획이다."],"a":0,"ans":"Leo는 올해 운동을 더 많이 할 계획이다.","evs":[["Yes, I'm planning to exercise more.","응, 나는 운동을 더 많이 할 계획이야."]],"ev":["Yes, I'm planning to exercise more.","응, 나는 운동을 더 많이 할 계획이야."],"ow":["정답 ○ — Leo가 'I'm planning to exercise more.'(나는 운동을 더 많이 할 계획이야.)라고 했으므로 맞다.","오답 ✕ — 소녀는 'Yes, I love it.'(응, 정말 좋아해.)이라고 했다. 좋아하지 않는 것이 아니라 아주 좋아하므로 틀림.","오답 ✕ — Leo는 'I want to play badminton.'(나는 배드민턴을 치고 싶어.)라고 했다. 축구가 아니라 배드민턴이라서 틀림.","오답 ✕ — 소녀가 'Let's play together sometime.'(언젠가 같이 치자.)이라고 하자 Leo는 'Sure!'(좋아!)라고 답했다. 거절이 아니라 수락이므로 틀림.","오답 ✕ — 운동을 더 하겠다는 계획은 소녀가 아니라 Leo의 것이다. 소녀는 'do you have any special goals for this year?'(올해 특별한 목표가 있니?)라고 물었을 뿐이라서 틀림."],"memo":["정답: Leo는 올해 운동을 더 많이 할 계획이다.","근거: I'm planning to exercise more.(운동을 더 많이 할 계획이야.)","함정: be planning to ~ = ~할 계획이다"],"why":"Leo의 올해 목표는 운동을 더 많이 하는 것이다."}],"dlg":[["G","Leo, do you have any special goals for this year?","Leo, 올해 특별한 목표가 있니?"],["B","Yes, I'm planning to exercise more.","응, 나는 운동을 더 많이 할 계획이야."],["G","Good for you! What kind of exercise do you want to do?","잘됐다! 어떤 운동을 하고 싶어?"],["B","I want to play badminton. Do you like badminton?","나는 배드민턴을 치고 싶어. 너는 배드민턴 좋아하니?"],["G","Yes, I love it. Let's play together sometime.","응, 정말 좋아해. 언젠가 같이 치자."],["B","Sure!","좋아!"]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["Emma는 이번 토요일에 특별한 계획이 없다.","소년은 콘서트에 혼자 갈 계획이다.","Emma는 콘서트에 가고 싶지 않다.","콘서트는 오후 6시에 끝난다.","소년은 이번 토요일에 농구 경기에 갈 계획이다."],"a":0,"ans":"Emma는 이번 토요일에 특별한 계획이 없다.","evs":[["Nothing special. Why?","특별한 건 없어. 왜?"]],"ev":["Nothing special. Why?","특별한 건 없어. 왜?"],"ow":["정답 ○ — 소년이 토요일에 뭐 하느냐고 묻자 Emma는 'Nothing special.'(특별한 건 없어.)이라고 했으므로 특별한 계획이 없다는 설명이 맞다.","오답 ✕ — 소년은 'Do you want to join me?'(나랑 같이 갈래?)라고 물었다. 혼자가 아니라 Emma와 함께 가려는 것이므로 틀림.","오답 ✕ — Emma는 'Wow, I'd love to!'(와, 정말 가고 싶어!)라고 했다. 가고 싶지 않은 것이 아니라 가고 싶어 하므로 틀림.","오답 ✕ — 소년은 'It starts at 6 p.m.'(오후 6시에 시작해.)라고 했다. 끝나는 시각이 아니라 시작하는 시각이라서 틀림.","오답 ✕ — 소년은 'I'm planning to go to a K-pop concert.'(나는 케이팝 콘서트에 갈 계획이야.)라고 했다. 농구 경기가 아니라 콘서트라서 틀림."],"memo":["정답: Emma는 이번 토요일에 특별한 계획이 없다.","근거: Nothing special.(특별한 건 없어.)","함정: ④ 'It starts at 6 p.m.' 시작 시각이다 (끝 ✕)"],"why":"Emma는 토요일에 특별한 계획이 없어서 콘서트에 같이 가기로 한다."}],"dlg":[["B","Emma, what are you going to do this Saturday?","Emma, 너 이번 토요일에 뭐 할 거니?"],["G","Nothing special. Why?","특별한 건 없어. 왜?"],["B","I'm planning to go to a K-pop concert. Do you want to join me?","나는 케이팝 콘서트에 갈 계획이야. 나랑 같이 갈래?"],["G","Wow, I'd love to! What time is the concert?","와, 정말 가고 싶어! 콘서트는 몇 시야?"],["B","It starts at 6 p.m.","오후 6시에 시작해."],["G","Okay. I can't wait.","알겠어. 너무 기대된다."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["소녀는 요즘 기타를 배우고 있다.","민지는 학교 밴드의 기타 연주자이다.","민지가 소녀에게 기타를 가르쳐 주고 있다.","소녀는 학교 축제에서 공연하고 싶어 한다.","소년은 소녀가 공연하는 것에 반대한다."],"a":4,"ans":"소년은 소녀가 공연하는 것에 반대한다.","evs":[["Sounds great. You can do it!","좋은 생각이야. 넌 할 수 있어!"]],"ev":["Sounds great. You can do it!","좋은 생각이야. 넌 할 수 있어!"],"ow":["오답 ✕ — 소녀가 'I'm learning to play the guitar these days.'(나 요즘 기타 치는 걸 배우고 있어.)라고 했으므로 일치하는 설명이다.","오답 ✕ — 'She is the guitarist in the school band.'(그녀는 학교 밴드의 기타 연주자야.)라고 했으므로 일치하는 설명이다.","오답 ✕ — 'My friend Minji is teaching me.'(내 친구 민지가 가르쳐 주고 있어.)라고 했으므로 일치하는 설명이다.","오답 ✕ — 소녀는 'I want to perform at the school festival.'(나는 학교 축제에서 공연하고 싶어.)라고 했으므로 일치하는 설명이다.","정답 ○ — 소년은 'Sounds great. You can do it!'(좋은 생각이야. 넌 할 수 있어!)이라며 응원했다. 반대한다는 설명은 일치하지 않는다."],"memo":["정답: ⑤ 소년은 소녀가 공연하는 것에 반대한다 (✕ 일치하지 않음)","근거: Sounds great. You can do it!(좋은 생각이야. 넌 할 수 있어!)","함정: 소년은 반대가 아니라 응원했다."],"why":"소년은 소녀의 공연 계획을 응원한다."}],"dlg":[["G","I'm learning to play the guitar these days. My friend Minji is teaching me.","나 요즘 기타 치는 걸 배우고 있어. 내 친구 민지가 가르쳐 주고 있어."],["B","Who is Minji?","민지가 누구야?"],["G","She is the guitarist in the school band.","그녀는 학교 밴드의 기타 연주자야."],["B","Cool! Maybe you can perform in the future.","멋
