<style>

var SENT=[{"id": "1-3", "src": "❶-3", "en": "Today, you're going to meet three amazing artists who never gave up on their art, despite challenges in their lives.", "nat": "오늘 여러분은 인생의 역경에도 불구하고 자신의 예술을 결코 포기하지 않은 세 명의 놀라운 예술가를 만나게 될 것이다.", "chunks": [{"t": "Today,", "r": "ADV", "ko": "오늘", "g": 0}, {"t": "you", "r": "S", "ko": "여러분은", "g": 1}, {"t": "’re going to meet", "r": "V", "ko": "만나게 될 것이다", "g": 0}, {"t": "three amazing artists", "r": "O", "ko": "세 명의 놀라운 예술가들을", "g": 0}, {"t": "who never gave up on their art,", "r": "ADJ", "ko": "자신의 예술을 결코 포기하지 않은", "g": 0}, {"t": "despite challenges in their lives", "r": "ADV", "ko": "인생의 역경에도 불구하고", "g": 0}], "steps": [{"t": "verb", "q": "동사를 모두 누르세요", "ans": [1, 2, 4, 10, 11], "nv": {"6": "amazing은 artists를 꾸미는 형용사 역할(놀라운)이라 동사가 아니에요.", "8": "who는 artists를 설명하는 절을 이끄는 말(관계대명사)이에요.", "12": "on은 gave up 뒤에 붙는 전치사예요(give up on = ~을 포기하다).", "15": "despite는 '~에도 불구하고'라는 전치사예요."}, "good": "<b>you're going to meet</b>(만나게 될 것이다)와 <b>gave up</b>(포기했다)이에요. be going to는 한 덩어리 조동사처럼 쓰여서 you're, going, meet을 모두 표시해요. gave up은 숙어라 두 단어가 한 동사예요.", "hint": "조동사, be동사, 완료의 have까지 동사예요. to부정사·-ing·꾸며 주는 분사는 동사가 아니에요."}, {"t": "role", "q": "노란 덧붙는 말을 빼고, 뼈대 덩어리의 역할을 정하세요", "rows": [["you", "S"], ["’re going to meet", "V"], ["three amazing artists", "O"]], "opts": ["S", "V", "O", "C", "덧붙는 말"], "good": "<b>you = 주어, ’re going to meet = 동사, three amazing artists = 목적어</b>예요. 누구를 만나나? → 예술가들을. 그래서 목적어예요.", "hint": "동사 뒤에 '누구를/무엇을'에 해당하는 말이 와요."}, {"t": "pat", "q": "노란 덩어리를 빼고 남은 뼈대는 누구와 닮은꼴?", "ans": 3, "good": "<b>3형식</b> I like apples와 닮은꼴이에요. you = I, ’re going to meet = like, three amazing artists = apples.", "hint": "동사 뒤에 무엇이 오는지 보세요."}, {"t": "choice", "q": "who never gave up on their art는 누구를 설명해 줄까요?", "opts": ["you", "three amazing artists", "their art", "Today"], "ans": 1, "hint": "who 바로 앞의 사람 명사를 보세요.", "good": "<b>artists</b>를 설명해요: '자신의 예술을 결코 포기하지 않은 예술가들'. who는 artists를 가리키는 관계대명사이고, 절 안의 동사는 gave up이에요.", "hl": 4}, {"t": "choice", "q": "despite challenges in their lives의 뜻은?", "opts": ["인생의 역경 때문에", "인생의 역경에도 불구하고", "인생의 역경이 있은 후에", "인생의 역경을 위해서"], "ans": 1, "hint": "despite = in spite of", "good": "<b>~에도 불구하고</b>(양보)예요. 포기하지 않은 이유가 아니라 '역경이 있었는데도'라는 반전을 덧붙여요.", "hl": 5}]}, {"id": "1-4", "src": "❶-4", "en": "Each artist has a unique painting style and story that has made their work highly valued.", "nat": "예술가마다 독특한 화풍과 이야기가 있고, 그 덕분에 작품이 높이 평가받아 왔다.", "chunks": [{"t": "Each artist", "r": "S", "ko": "각 예술가는", "g": 0}, {"t": "has", "r": "V", "ko": "가지고 있다", "g": 0}, {"t": "a unique painting style and story", "r": "O", "ko": "독특한 화풍과 이야기를", "g": 0}, {"t": "that has made their work highly valued", "r": "ADJ", "ko": "그것이 그들의 작품을 높이 평가받게 만들어 왔다", "g": 0}], "steps": [{"t": "verb", "q": "동사를 모두 누르세요", "ans": [2, 10, 11], "nv": {"5": "painting은 style을 꾸미는 말(그림 그리는 방식 = 화풍)이라 동사가 아니에요.", "9": "that은 뒤의 절을 이끌어 앞 명사를 설명하는 말(관계대명사)이에요.", "15": "valued는 their work가 어떤 상태인지 설명하는 말(5형식의 목적격보어)이라 동사로 세지 않아요."}, "good": "<b>has</b>(가지고 있다)와 <b>has made</b>(만들어 왔다)예요. 같은 has라도 앞의 has는 본동사, 뒤의 has는 현재완료를 만드는 조동사예요.", "hint": "조동사, be동사, 완료의 have까지 동사예요. to부정사·-ing·꾸며 주는 분사는 동사가 아니에요."}, {"t": "role", "q": "노란 덧붙는 말을 빼고, 뼈대 덩어리의 역할을 정하세요", "rows": [["Each artist", "S"], ["has", "V"], ["a unique painting style and story", "O"]], "opts": ["S", "V", "O", "C", "덧붙는 말"], "good": "<b>Each artist = 주어, has = 동사, a unique painting style and story = 목적어</b>예요.", "hint": "has 뒤에 '무엇을 가지고 있나'가 와요."}, {"t": "pat", "q": "노란 덩어리를 빼고 남은 뼈대는 누구와 닮은꼴?", "ans": 3, "good": "<b>3형식</b> I like apples와 닮은꼴이에요. Each artist = I, has = like, style and story = apples.", "hint": "동사 뒤에 무엇이 오는지 보세요."}, {"t": "choice", "q": "that has made their work highly valued는 무엇을 설명할까요?", "opts": ["Each artist", "a unique painting style and story", "their work", "has"], "ans": 1, "hint": "that 바로 앞 명사를 보세요.", "good": "<b>style and story</b>를 설명해요. '작품이 높이 평가받게 만들어 온 (화풍과 이야기)'.", "hl": 3}, {"t": "pat", "q": "that절 안의 뼈대는 누구와 닮은꼴?", "ans": 5,
