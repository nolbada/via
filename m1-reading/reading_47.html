],["We worked together as a team.","우리는 팀으로서 함께 일했어.",0],["STEP 1 Story-making","[1단계] 이야기 만들기",1],["First, I wrote a story.","우선, 나는 이야기를 썼어.",1],["The story begins like this:","이야기는 이와 같이 시작돼:",0],["One day you wake up on an island.","어느 날 당신은 섬에서 깨어납니다.",1],["There are many monsters on the island.","그 섬에는 많은 괴물들이 있습니다.",0],["You go through a high mountain, a long river, and a giant tower.","당신은 높은 산, 긴 강, 그리고 거대한 탑을 거쳐 갑니다.",0],["Choose five items and get off the island.","다섯 가지 아이템을 골라서 그 섬을 탈출해 보세요.",0],["STEP 2 Building","[2단계] 제작하기",1],["Sujin made the background music and monster sounds.","수진이는 배경 음악과 괴물 소리들을 만들었어.",1],["Jean drew the main character and NPCs.","Jean은 주인공과 NPC들을 그렸지.",0],["Every character looked real.","모든 캐릭터는 진짜처럼 보였어.",0],["Minwoo coded the game.","민우는 게임을 코딩했어.",0],["He put all the parts together.","그는 모든 부분들을 합쳤어.",0],["Sounds, characters, and a story were in the game.","소리, 캐릭터들, 그리고 이야기가 게임 안에 있었어.",0],["Our game looked and sounded good.","우리들의 게임은 좋아 보였고, 좋게 들렸어.",0],["STEP 3 Testing","[3단계] 시험해 보기",1],["Sumin played the game many times.","수민이는 게임을 여러 번 했어.",1],["Then she shared her ideas.","그러고 나서 그녀는 자기 생각을 공유했지.",0],["She said, \"I enjoyed playing the game.","그녀는 \"나는 그 게임을 하는 것을 즐겼어.",0],["But it ends too soon.","하지만 그건 너무 빨리 끝나.",0],["It needs one more stage.","하나의 단계가 더 필요해.",0],["And add more items like a life jacket.\"","그리고 구명조끼와 같은 더 많은 아이템을 추가해.\"라고 말했어.",0],["So we added an ice lake stage and more useful items.","그래서 우리는 얼음 호수 단계와 좀 더 유용한 아이템들을 추가했어.",0],["Now our game looked great.","이제 우리 게임은 멋져 보였어.",0],["STEP 4 Publishing","[4단계] 출시하기",1],["We finally published the game on the app market.","우리는 마침내 그 게임을 앱 시장에 출시했어.",1],["We got a lot of reviews!","우리는 많은 후기도 받았어!",0],["Making a game was hard, but we did it together as a team.","게임을 만드는 것은 힘들었지만, 우리는 팀으로서 함께 해냈지.",0]];var RNUM=47;var TITLE_EN="Give LIKEs to Our Game";var PASS_EN=["Give LIKEs to Our Game","Hi! I'm Hyunsu. Last summer, my friends and I made our own adventure game, \"The Lost Island.\" We worked together as a team.","STEP 1 Story-making","First, I wrote a story. The story begins like this:","One day you wake up on an island. There are many monsters on the island. You go through a high mountain, a long river, and a giant tower. Choose five items and get off the island.","STEP 2 Building","Sujin made the background music and monster sounds. Jean drew the main character and NPCs. Every character looked real. Minwoo coded the game. He put all the parts together. Sounds, characters, and a story were in the game. Our game looked and sounded good.","STEP 3 Testing","Sumin played the game many times. Then she shared her ideas. She said, \"I enjoyed playing the game. But it ends too soon. It needs one more stage. And add more items like a life jacket.\" So we added an ice lake stage and more useful items. Now our game looked great.","STEP 4 Publishing","We finally published the game on the app market. We got a lot of reviews! Making a game was hard, but we did it together as a team."];var PASS_KO=["우리 게임에 '좋아요'를 눌러 주세요","안녕! 나는 현수야. 지난여름, 내 친구들과 나는 우리만의 모험 게임인 '잃어버린 섬'을 만들었어. 우리는 팀으로서 함께 일했어.","[1단계] 이야기 만들기","우선, 나는 이야기를 썼어. 이야기는 이와 같이 시작돼:","어느 날 당신은 섬에서 깨어납니다. 그 섬에는 많은 괴물들이 있습니다. 당신은 높은 산, 긴 강, 그리고 거대한 탑을 거쳐 갑니다. 다섯 가지 아이템을 골라서 그 섬을 탈출해 보세요.","[2단계] 제작하기","수진이는 배경 음악과 괴물 소리들을 만들었어. Jean은 주인공과 NPC들을 그렸지. 모든 캐릭터는 진짜처럼 보였어. 민우는 게임을 코딩했어. 그는 모든 부분들을 합쳤어. 소리, 캐릭터들, 그리고 이야기가 게임 안에 있었어. 우리들의 게임은 좋아 보였고, 좋게 들렸어.","[3단계] 시험해 보기","수민이는 게임을 여러 번 했어. 그러고 나서 그녀는 자기 생각을 공유했지. 그녀는 \"나는 그 게임을 하는 것을 즐겼어. 하지만 그건 너무 빨리 끝나. 하나의 단계가 더 필요해. 그리고 구명조끼와 같은 더 많은 아이템을 추가해.\"라고 말했어. 그래서 우리는 얼음 호수 단계와 좀 더 유용한 아이템들을 추가했어. 이제 우리 게임은 멋져 보였어.","[4단계] 출시하기","우리는 마침내 그 게임을 앱 시장에 출시했어. 우리는 많은 후기도 받았어! 게임을 만드는 것은 힘들었지만, 우리는 팀으로서 함께 해냈지."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["여자는 James Sweeney에 대한 TV프로그램을 봤다.","여자는 James Sweeney처럼 되고 싶다.","여자는 미래에 모험 게임을 만들고 싶다.","남자는 여자의 아이디어가 지루하다고 생각한다.","남자는 언젠가 여자의 게임을 하고 싶어 한다."],"a":3,"ans":"남자는 여자의 아이디어가 지루하다고 생각한다.","evs":[["M: Sounds cool. I want to play your game someday.","멋지게 들리네요. 나는 언젠가 당신의 게임을 해 보고 싶어요."],["W: I want to make adventure games.","저는 모험 게임을 만들고 싶어요."]],"ev":["M: Sounds cool. I want to play your game someday.","멋지게 들리네요. 나는 언젠가 당신의 게임을 해 보고 싶어요."],"ow":["오답 ✕ — 여자가 'I watched a TV program about James Sweeney.'(나는 James Sweeney에 대한 TV 프로그램을 봤어요.)라고 했으므로 대화와 일치하는 내용이라 답이 아님.","오답 ✕ — 여자가 'I want to be someone like him.'(저는 그와 같은 사람이 되고 싶어요.)라고 했으므로 대화와 일치하는 내용이라 답이 아님.","오답 ✕ — 여자가 'I want to make adventure games.'(저는 모험 게임을 만들고 싶어요.)라고 했으므로 대화와 일치하는 내용이라 답이 아님.","정답 ○ — 남자는 'Sounds cool.'(멋지게 들리네요.)이라고 했다. 지루하다고 생각한다는 말은 반대 내용이므로 대화와 일치하지 않음.","오답 ✕ — 남자가 'I want to play your game someday.'(나는 언젠가 당신의 게임을 해 보고 싶어요.)라고 했으므로 대화와 일치하는 내용이라 답이 아님."],"memo":["정답 ④: 남자는 여자의 아이디어를 지루하다고 생각하지 않는다(일치하지 않음).","근거: Sounds cool.(멋지게 들리네요.)","함정: ⑤ 'I want to play your game someday.'는 남자가 한 말이라 일치 ✕"],"why":"남자는 여자의 모험 게임 아이디어를 '멋지다'고 했으므로 지루하다는 보기는 일치하지 않는다."},{"n":2,"q":"위 대화의 주제로 알맞은 것은?","o":["the man's role model","the woman's favorite TV program","the woman's dream in the future","popular games of James Sweeney","the man's hobby of playing adventure games"],"a":2,"ans":"the woman's dream in the future","evs":[["W: He is a famous game maker. I want to be someone like him. He is my role model.","그는 유명한 게임 제작자예요. 저는 그와 같은 사람이 되고 싶어요. 그는 제 롤모델이에요."],["W: I want to make adventure games.","저는 모험 게임을 만들고 싶어요."]],"ev":["W: He is a famous game maker. I want to be someone like him. He is my role model.","그는 유명한 게임 제작자예요. 저는 그와 같은 사람이 되고 싶어요. 그는 제 롤모델이에요."],"ow":["오답 ✕ — 'He is my role model.'(그는 제 롤모델이에요.)은 여자의 롤모델이다. 남자의 롤모델이 아니라서 틀림.","오답 ✕ — 여자는 'I watched a TV program about James Sweeney.'(James Sweeney에 대한 TV 프로그램을 봤어요.)라고 했을 뿐, 가장 좋아하는 프로그램이라는 말은 없고 대화의 중심도 아니라서 틀림.","정답 ○ — 여자는 'I want to be someone like him.'(그와 같은 사람이 되고 싶어요.)과 'I want to make adventure games.'(모험 게임을 만들고 싶어요.)라고 하며 자신의 미래 꿈을 이야기하므로 주제로 알맞음.","오답 ✕ — 'He is a famous game maker.'(그는  if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){

 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';

function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';

function dlgHtml(d,lock){

 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});

function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}

  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}

});

var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;

 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
