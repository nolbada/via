afely.","사람들의 도움으로 게들은 바다로 안전하게 이동한다.",0],["Golden Jellyfish in Jellyfish Lake, Palau","팔라우의 젤리피시 호수에 사는 황금해파리",1],["Jellyfish Lake in Palau is home to golden jellyfish.","팔라우의 젤리피시 호수는 황금해파리의 집이다.",1],["Every day, they move across the lake and then swim back.","매일 그들은 호수를 가로질러 이동한 뒤에 다시 헤엄쳐 돌아온다.",0],["Why do they travel every day?","왜 그들은 매일 여행을 할까?",0],["They follow the sun to get energy from it.","그들은 태양으로부터 에너지를 얻기 위해 태양을 따라간다.",0],["When the sun rises in the morning, the jellyfish begin to swim toward the sun.","아침에 태양이 뜨면, 황금해파리들은 태양 쪽으로 헤엄치기 시작한다.",0],["In the afternoon, they travel back and wait for the next morning.","오후에는 다시 돌아와 다음 날 아침을 기다린다.",0]];var RNUM=68;var TITLE_EN="Why Do Animals Travel?";var PASS_EN=["Why Do Animals Travel?","Do you know animals also leave their homes and travel? Many animals travel for different reasons. Let’s find out more!","Fruit Bats in Africa","From October to December, millions of fruit bats fly to Zambia’s Kasanka National Park. These bats come from all over Africa. Why do they travel to the park? They go there to eat wild fruit. They are big eaters. They eat more than their weight in a night.","Red Crabs on Christmas Island","On Christmas Island, red crabs live in forests, not in the water. However, when the rainy season begins in October, millions of red crabs march toward the ocean to lay eggs. During this period, they are all over the place, and the whole island turns red. People close some roads and build bridges to protect them. With their help, the crabs move to the ocean safely.","Golden Jellyfish in Jellyfish Lake, Palau","Jellyfish Lake in Palau is home to golden jellyfish. Every day, they move across the lake and then swim back. Why do they travel every day? They follow the sun to get energy from it. When the sun rises in the morning, the jellyfish begin to swim toward the sun. In the afternoon, they travel back and wait for the next morning."];var PASS_KO=["왜 동물들이 여행을 할까?","동물들도 자신의 집을 떠나 여행한다는 것을 알고 있는가? 많은 동물이 다양한 이유로 여행한다. 더 알아보도록 하자!","아프리카에 사는 과일박쥐","10월부터 12월 사이에 수백만 마리의 과일박쥐들이 잠비아의 카산카 국립공원으로 날아간다. 이 박쥐들은 아프리카의 전 지역에서 온다. 왜 그들이 그 공원으로 여행을 하는 것일까? 그들은 야생 과일을 먹기 위해 그곳에 간다. 그들은 대식가이다. 그들은 하룻밤에 자신의 몸무게보다 더 많은 양을 먹는다.","크리스마스섬의 붉은게","크리스마스섬에서 붉은게는 물속이 아니라 숲에서 산다. 하지만 10월에 우기가 시작되면, 수백만 마리의 붉은게들이 알을 낳기 위해 바다 쪽으로 행진한다. 이 기간 동안에는 그들이 모든 곳에 걸쳐 있어서 섬 전체가 붉게 변한다. 사람들은 그들을 보호하기 위해 일부 도로를 폐쇄하고 다리를 놓는다. 사람들의 도움으로 게들은 바다로 안전하게 이동한다.","팔라우의 젤리피시 호수에 사는 황금해파리","팔라우의 젤리피시 호수는 황금해파리의 집이다. 매일 그들은 호수를 가로질러 이동한 뒤에 다시 헤엄쳐 돌아온다. 왜 그들은 매일 여행을 할까? 그들은 태양으로부터 에너지를 얻기 위해 태양을 따라간다. 아침에 태양이 뜨면, 황금해파리들은 태양 쪽으로 헤엄치기 시작한다. 오후에는 다시 돌아와 다음 날 아침을 기다린다."];var DG=[{"dlg":[["G","What are you watching?","뭐 보고 있어?"],["B","I’m watching a video of a fox. A woman is playing with the fox, and it’s so cute!","여우 영상을 보고 있어. 한 여자가 여우랑 놀고 있는데 정말 귀여워!"],["G","Did you know that foxes can make around 40 different sounds?","여우가 약 40가지의 다른 소리를 낼 수 있다는 걸 알고 있었니?"],["B","Oh, I didn’t know that.","오, 그건 몰랐어."],["G","They can even make laughing sounds.","웃음소리도 낼 수 있어."],["B","I can’t believe it! I want to hear all those sounds.","믿을 수가 없어! 그 소리들을 다 들어 보고 싶다."]],"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["The boy is looking at a video of a fox.","The boy thinks the fox in the video is cute.","The girl says that foxes can make many sounds.","Foxes can create laughing sounds.","The boy is not interested in the sounds of foxes."],"a":4,"ans":"The boy is not interested in the sounds of foxes.","evs":[["B: I can’t believe it! I want to hear all those sounds.","믿을 수가 없어! 그 소리들을 다 들어 보고 싶다."]],"ev":["B: I can’t believe it! I want to hear all those sounds.","믿을 수가 없어! 그 소리들을 다 들어 보고 싶다."],"memo":["B: I can’t believe it! I want to hear all those sounds.  (믿을 수가 없어! 그 소리들을 다 들어 보고 싶다.)"]}]},{"dlg":[["B","Hey, look at this video! Did you know that mice can sing like birds?","얘, 이 영상 좀 봐! 쥐가 새처럼 노래할 수 있다는 걸 알고 있었니?"],["G","Are they singing? I can’t hear anything.","노래하고 있는 거야? 아무것도 안 들려."],["B","Humans can’t hear their songs.","사
