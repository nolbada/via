rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"Every country have its own culture. Culture shows way of living and thinking.","ko":"모든 나라는 고유의 문화를 가지고 있다. 문화는 삶과 사고의 방식을 보여 준다.","ok":false,"foot":[],"fixes":[{"wrong":"have","right":"has","partial":false,"at":[2],"point":"주어와 동사의 수일치: Every country(단수)는 has (have 아님)","topic":"주어와 동사의 수일치","memo":"Every country(단수)는 has (have 아님)"},{"wrong":"way","right":"ways","partial":false,"at":[8],"point":"명사의 복수형: 여러 방식이므로 복수형 ways 사용","topic":"명사의 복수형","memo":"여러 방식이므로 복수형 ways 사용"}]},{"n":2,"tag":null,"en":"In each culture, there are rules that don't allow certain things. So, we need to know how to act in different countries.","ko":"각 문화마다 특정한 것들을 허용하지 않는 규칙이 있다. 그래서 우리는 다른 나라에서 어떻게 행동해야 할지 알아야 한다.","ok":true,"foot":[],"fixes":[]},{"n":3,"tag":null,"en":"Here are some unique and interest rules from around the world.","ko":"여기 세계의 독특하고 흥미로운 규칙들이 있다.","ok":false,"foot":[],"fixes":[{"wrong":"interest","right":"interesting","partial":false,"at":[5],"point":"품사 구별: 명사 rules를 꾸미는 형용사 interesting 사용","topic":"품사 구별","memo":"명사 rules를 꾸미는 형용사 interesting 사용"}]},{"n":4,"tag":"스위스 · 반려동물","en":"In Switzerland, people real care about animals. Swiss law say that people cannot have just one hamster or one parrot in home.","ko":"스위스에서, 사람들은 동물을 정말로 아낀다. 스위스 법은 사람들이 집에서 햄스터나 앵무새를 한 마리만 키울 수 없다고 말한다.","ok":false,"foot":[],"fixes":[{"wrong":"real","right":"really","partial":false,"at":[3],"point":"형용사와 부사: 동사 care를 꾸미는 부사 really 사용","topic":"형용사와 부사","memo":"동사 care를 꾸미는 부사 really 사용"},{"wrong":"say","right":"says","partial":false,"at":[9],"point":"3인칭 단수 현재형: 주어 Swiss law(단수)에는 says 사용","topic":"3인칭 단수 현재형","memo":"주어 Swiss law(단수)에는 says 사용"},{"wrong":"in","right":"at","partial":false,"at":[20],"point":"기본전치사: '집에'는 at home 사용","topic":"기본전치사","memo":"'집에'는 at home 사용"}]},{"n":5,"tag":null,"en":"They must have at least two. These pets feels lonely when they are alone.","ko":"최소 두 마리를 키워야 한다. 이런 동물들은 혼자 있으면 외로움을 느낀다.","ok":false,"foot":[],"fixes":[{"wrong": 람들은 자신들의 음식을 매우 자랑스러워한다.",0],["They believe that ketchup hides the real taste of their food.","그들은 케첩이 음식의 진짜 맛을 숨긴다고 믿는다.",0],["They really hope that their children can taste and enjoy the flavors of French cooking.","그들은 자녀들이 프랑스 요리의 맛을 보고 즐길 수 있기를 진심으로 바란다.",0],["That way, French children can learn to love their food culture.","그런 방법으로, 프랑스 어린이들은 음식 문화를 사랑하는 법을 배울 수 있다.",0],["Which rule is most surprising?","어떤 규칙이 가장 놀라운가?",1],["Maybe some rules sound strange to you, but they show different lifestyles around the world.","일부 규칙은 이상하게 들릴 수도 있지만, 그것들은 전 세계의 다양한 생활방식을 보여 준다.",0],["Understanding different rules from different countries helps us live together more happily.","다른 나라의 다른 규칙을 이해하는 것은 우리가 더 행복하게 더불어 살아가는 데 도움을 준다.",0]];var RNUM=23;var TITLE_EN="Unique Rules Around the World";var PASS_EN=["Unique Rules Around the World","Every country has its own culture. Culture shows ways of living and thinking. In each culture, there are rules that don't allow certain things. So, we need to know how to act in different countries. Here are some unique and interesting rules from around the world.","Switzerland: Let's Care for Pets","In Switzerland, people really care about animals. Swiss law says that people cannot have just one hamster or one parrot at home. They must have at least two. These pets feel lonely when they are alone. They need a friend that can be with them. Also, people who have dogs or cats must spend enough time with their pets. Those who have dogs must take them outside for exercise too. Pets are very happy in Switzerland.","Singapore: Let's Keep the City Clean","Singapore is a very clean city. Here, people cannot eat or drink on buses or the subway. They also cannot sell or import chewing gum. Those actions can make the city dirty and messy. People who break the rules must pay a fine. In Singapore, everyone knows where to eat and where to throw away their trash. Thanks to these rules, Singapore remains very clean.","France: Let French Children Love Their Food","In France, children can't have ketchup in school cafeterias. This sounds surprising, but there's a good reason. France is famous for its delicious food. French people are very proud of their food. They believe that ketchup hides the real taste of their food. They really hope that their children can taste and enjoy the flavors of French cooking. That way, French children can learn to love their food culture.","Which rule is most surprising? Maybe some rules sound strange to you, but they show different lifestyles around the world. Understanding different rules from different countries helps us live together more happily."];var PASS_KO=["세계의 독특한 규칙","모든 나라는 고유의 문화를 가지고 있다. 문화는 삶과 사고의 방식을 보여 준다. 각 문화마다 특정한 것들을 허용하지 않는 규칙이 있다. 그래서 우리는 다른 나라에서 어떻게 행동해야 할지 알아야 한다. 여기 세계의 독특하고 흥미로운 규칙들이 있다.","스위스: 반려동물을 돌보자","스위스에서, 사람들은 동물을 정말로 아낀다. 스위스 법은 사람들이 집에서 햄스터나 앵무새를 한 마리만 키울 수 없다고 말한다. 최소 두 마리를 키워야 한다. 이런 동물들은 혼자 있으면 외로움을 느낀다. 이들은 함께 있을 수 있는 친구가 필요하다. 또한, 강아지나 고양이를 키우는 사람들은 충분한 시간을 반려동물과 함께 보내야 한다. 강아지를 키우는 사람들은 강아지를 운동시키기 위해 밖으로 데리고 나가야 한다. 스위스의 반려동물들은 정말 행복하다.","싱가포르: 도시를 깨끗하게 유지하자","싱가포르는 매우 깨끗한 도시이다. 이곳에서, 사람들은 버스나 지하철에서 먹거나 마실 수 없다. 사람들은 또한 껌을 팔거나 수입할 수도 없다. 이런 행동들은 도시를 더럽고 지저분하게 만들 수 있다. 규칙을 어기는 사람들은 벌금을 내야 한다. 싱가포르에서는 모두가 어디에서 먹고 어디에 자신의 쓰레기를 버려야 하는지 알고 있다. 이러한 규칙 덕분에, 싱가포르는 매우 깨끗한 상태를 유지한다.","프랑스: 프랑스 어린이들이 음식을 사랑하게 하자","프랑스에서는 어린이들이 학교 식당에서 케첩을 먹을 수 없다. 이는 놀라운 일처럼 들리지만, 타당한 이유가 있다. 프랑스는 맛있는 음식으로 유명하다. 프랑스 사람들은 자신들의 음식을 매우 자랑스러워한다. 그들은 케첩이 음식의 진짜 맛을 숨긴다고 믿는다. 그들은 자녀들이 프랑스 요리의 맛을 보고 즐길 수 있기를 진심으로 바란다. 그런 방법으로, 프랑스 어린이들은 음식 문화를 사랑하는 법을 배울 수 있다.","어떤 규칙이 가장 놀라운가? 일부 규칙은 이상하게 들릴 수도 있지만, 그것들은 전 세계의 다양한 생활방식을 보여 준다. 다른 나라의 다른 규칙을 이해하는 것은 우리가 더 행복하게 더불어 살아가는 데 도움을 준다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["Sydney Zoo는 호주에서 가장 작은 동물원이다.","소녀는 시드니에서 방문할 곳을 묻고 있다.","Sydney Zoo에서는 코알라와 캥거루를 볼 수 없다.","남자는 동물들에게 먹이를 주지 말라고 했다.","소녀는 동물원에 가지 않겠다고 했다."],"a":1,"ans":"소녀는 시드니에서 방문할 곳을 묻고 있다.","evs":[["Excuse me. What should I visit in Sydney?","실례합니다. 시드니에서 어디를 가 보면 좋을까요?"],["I recommend Sydney Zoo. It's the largest zoo in Australia.","시드니 동물원을 추천해요. 호주에서 가장 큰 동물원이에요."]],"ev":["Excuse me. What should I visit in Sydney?","실례합니다. 시드니에서 어디를 가 보면 좋을까요?"],"ow":["오답 ✕ — 남자는 'It's the largest zoo in Australia.'(호주에서 가장 큰 동물원이에요.)라고 했는데, 이 보기는 가장 작다고 해서 틀림.","정답 ○ — 소녀가 'What should I visit in Sydney?'(시드니에서 어디를 가 보면 좋을까요?)라고 물었으므로 방문할 곳을 묻고 있다는 말이 맞음.","오답 ✕ — 남자는 'You can see koalas and kangaroos there.'(거기서 코알라와 캥거루를 볼 수 있어요.)라고 했는데, 이 보기는 볼 수 없다고 해서 틀림.","오답 ✕ — 남자는 'Don't forget to feed them!'(그 동물들에게 먹이 주는 것을 잊지 마세요!)이라고 했으므로 먹이를 주라는 뜻이라서 틀림.","오답 ✕ — 소녀는 'That sounds fun!'(재미있겠네요!)이라고 반응했으므로 가지 않겠다는 보기는 틀림."],"memo":["정답 ②: 소녀는 시드니에서 방문할 곳을 묻고 있다.","근거: What should I visit in Sydney?(시드니에서 어디를 가 보면 좋을까요?)","함정: ④ Don't forget to ~는 '~하는 것을 잊지 마라'라서 먹이를 '주라'는 뜻 ✕"],"why":"소녀가 시드니에서 방문할 곳을 묻고 남자가 동물원을 추천한다."}],"dlg":[["G","Excuse me. What should I visit in Sydney?","실례합니다. 시드니에서 어디를 가 보면 좋을까요?"],["M","I recommend Sydney Zoo. It's the largest zoo in Australia. You can see koalas and kangaroos there.","시드니 동물원을 추천해요. 호주에서 가장 큰 동물원이에요. 거기서 코알라와 캥거루를 볼 수 있어요."],["G","That sounds fun!","재미있겠네요!"],["M","Don't forget to feed them!","그 동물들에게 먹이 주는 것을 잊지 마세요!"],["G","Okay, I won't.","네, 잊지 않을게요."]]},{"qs":[{"n":2,"q":"위 대화를 읽고 답할 수 없는 질문은?","o":["What place is the woman going to visit?","What does the man think about Da Nang?","What does the woman want to enjoy during the trip?","How can the woman get to Hoi An?","Where can we see the old town in Vietnam?"],"a":3,"ans":"How can the woman get to Hoi An?","evs":[["Hi! I'm planning to go to Da Nang.","안녕하세요! 저는 다낭에 갈 계획이에요."],["Then why don't you visit Hoi An? It's close to Da Nang, and you can see the old town there.","그럼 호이안에 가 보는 게 어때요? 다낭에서 가깝고, 거기서 옛 도시를 볼 수 있어요."]],"ev":["Hi! I'm planning to go to Da Nang.","안녕하세요! 저는 다낭에 갈 계획이에요."],"ow":["오답 ✕ — 여자가 'I'm planning to go to Da Nang.'(저는 다낭에 갈 계획이에요.)라고 했으므로 방문할 장소는 대화로 답할 수 있음.","오답 ✕ — 남자가 'It has beautiful beaches. It's a great place to relax.'(그곳에는 아름다운 해변이 있어요. 쉬기에 좋은 곳이죠.)라고 했으므로 다낭에 대한 생각은 대화로 답할 수 있음.","오답 ✕ — 여자가 'I also want to enjoy Vietnamese traditions.'(저는 베트남의 전통도 즐기고 싶어요.)라고 했으므로 대화로 답할 수 있음.","정답 ○ — 호이안이 'close to Da Nang'(다낭에서 가깝다)이라고만 했고 어떻게 가는지 교통수단은 나오지 않으므로 대화로 답할 수 없음.","오답 ✕ — 남자가 'you can see the old town there'(거기서 옛 도시를 볼 수 있어요)라며 호이안을 말했으므로 옛 도시를 볼 수 있는 곳은 호이안이라고 답할 수 있음."],"memo":["정답 ④: How can the woman get to Hoi An? (답할 수 없는 질문)","근거: It's close to Da Nang, and you can see the old town there.(다낭에서 가깝고, 거기서 옛 도시를 볼 수 있어요.)","함정: 호이안이 '가깝다'는 말만 있고 가는 '방법'은 없다"],"why":"호이안에 가는 방법은 대화에 나오지 않는다."}],"dlg":[["W","Hi! I'm planning to go to Da Nang.","안녕하세요! 저는 다낭에 갈 계획이에요."],["M","It has beautiful beaches. It's a great place to relax.","그곳에는 아름다운 해변이 있어요. 쉬기에 좋은 곳이죠."],["W","Sounds good. I also want to enjoy Vietnamese traditions.","좋네요. 저는 베트남의 전통도 즐기고 싶어요."],["M","Then why don't you visit Hoi An? It's close to Da Nang, and you can see the old town there.","그럼 호이안에 가 보는 게 어때요? 다낭에서 가깝고, 거기서 옛 도시를 볼 수 있어요."],["W","That sounds perfect!","아주 좋네요!"]]},{"qs":[{"n":3,"q":"위 대화의 주제로 알맞은 것은?","o":["tips for traveling abroad","must-eat foods in London","tips for a family trip to London","the man's advice on a red bus tour in London","how to visit the Tower of London and Big Ben"],"a":2,"ans":"tips for a family trip to London","evs":[["My family is planning to visit London.","저희 가족은 런던에 갈 계획이에요."],["Why don't you take a red bus tour?","빨간 버스 투어를 해 보는 게 어때요?"],["You should try fish and chips.","피시 앤 칩스를 드셔 보세요."]],"ev":["My family is planning to visit London.","저희 가족은 런던에 갈 계획이에요."],"ow":["오답 ✕ — 대화는 해외여행 전반이 아니라 'My family is planning to visit London.'(저희 가족은 런던에 갈 계획이에요.)처럼 런던 여행에 대한 것이라 너무 넓음.","오답 ✕ — 'You should try fish and chips.'(피시 앤 칩스를 드셔 보세요.)처럼 음식 추천도 나오지만, 버스 투어와 명소도 함께 다루므로 음식만으로는 너무 좁음.","정답 ○ — 런던 여행을 계획하는 가족에게 'Why don't you take a red bus tour?'(빨간 버스 투어를 해 보는 게 어때요?), 'You should try fish and chips.'(피시 앤 칩스를 드셔 보세요.) 같은 팁을 주므로 런던 가족 여행 팁이 주제임.","오답 ✕ — 조언하는 사람은 남자가 아니라 여자(W)이고, 버스 투어는 일부일 뿐이라서 틀림.","오답 ✕ — 런던 탑과 빅벤은 'We're going to see the Tower of London and Big Ben.'(런던 탑과 빅벤을 볼 거예요.)처럼 가려는 곳일 뿐 가는 방법을 묻는 대화가 아니라서 틀림."],"memo":["정답 ③: tips for a family trip to London (런던 가족 여행 팁)","근거: My family is planning to visit London.(저희 가족은 런던에 갈 계획이에요.)","함정: ②는 음식만 말해서 버스 투어가 빠져 너무 좁아 ✕"],"why":"런던 여행을 가는 가족이 버스 투어와 음식 추천을 받는 대화이다."}],"dlg":[["W","Hello! How may I help you?","안녕하세요! 무엇을 도와드릴까요?"],["B","My family is planning to visit London. We're going to see the Tower of London and Big Ben.","저희 가족은 런던에 갈 계획이에요. 런던 탑과 빅벤을 볼 거예요."],["W","Why don't you take a red bus tour? It's a great way to see all the sights.","빨간 버스 투어를 해 보는 게 어때요? 모든 명소를 보기에 좋은 방법이에요."],["B","That sounds good. Can you recommend any must-eat foods in London?","좋아요. 런던에서 꼭 먹어야 하는 음식을 추천해 주실 수 있나요?"],["W","Sure. You should try fish and chips. It's a classic English dish.","물론이죠. 피시 앤 칩스를 드셔 보세요. 대표적인 영국 요리예요."],["B","I see.","알겠어요."],["W","And don't forget to try some delicious tea and scones.","그리고 맛있는 차와 스콘도 꼭 드셔 보세요."],["B","Thanks for the tips!","조언 감사합니다!"]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["The man plans to see the Eiffel Tower.","The woman thinks that the Eiffel Tower is a must-see place in France.","The woman suggests taking fun photographs at the Eiffel Tower.","The woman thinks the city view from the Eiffel Tower is amazing.","The man would like to enjoy the night view of the Eiffel Tower."],"a":3,"ans":"The woman thinks the city view from the Eiffel Tower is amazing.","evs":[["And you should see the night view of the tower. It's fantastic!","그리고 탑의 야경을 꼭 보세요. 환상적이에요!"],["I'd love to. Thanks!","꼭 보고 싶어요. 고마워요!"]],"ev":["And you should see the night view of the tower. It's fantastic!","그리고 탑의 야경을 꼭 보세요. 환상적이에요!"],"ow":["오답 ✕ — 남자가 'I'm going to see the Eiffel Tower.'(에펠탑을 볼 거예요.)라고 했으므로 일치하는 내용이라 답이 아님.","오답 ✕ — 여자가 'That's a must-see in France.'(그건 프랑스에서 꼭 봐야 하는 곳이죠.)라고 했으므로 일치하는 내용이라 답이 아님.","오답 ✕ — 여자가 'You can take some fun photos'( }],"dlg":[["B","What are you planning to do for the weekend, Emily?","에밀리, 주말에 뭐 할 계획이니?"],["G","I'm going to go skating.","나는 스케이트를 타러 갈 거야."],["B","Wow, that sounds cool! Do you skate often?","와, 멋지다! 스케이트를 자주 타니?"],["G","Yes. My parents and I go skating once or twice a month.","응. 부모님과 나는 한 달에 한두 번 스케이트를 타러 가."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하지 않는 것은?","o":["모든 나라들은 그 나라만의 삶과 사고방식을 보여주는 고유한 문화를 갖는다.","각 문화마다 허용하지 않는 규칙이 다양하게 있다.","스위스는 법적으로 햄스터와 앵무새를 키울 수 없다.","스위스에는 혼자 있으면 외로움을 느끼는 동물들을 보호하는 법이 있다.","스위스에서 강아지를 키우는 사람들은 강아지를 운동시키기 위해 밖으로 데리고 나가야 한다."],"a":2,"ans":"스위스는 법적으로 햄스터와 앵무새를 키울 수 없다.","evs":[["Swiss law says that people cannot have just one hamster or one parrot at home.","스위스 법은 사람들이 집에서 햄스터나 앵무새를 한 마리만 키울 수 없다고 말한다."],["They must have at least two.","최소 두 마리를 키워야 한다."]],"ev":["Swiss law says that people cannot have just one hamster or one parrot at home.","스위스 법은 사람들이 집에서 햄스터나 앵무새를 한 마리만 키울 수 없다고 말한다."],"ow":["오답 ✕ — 'Every country has its own culture.'(모든 나라는 고유의 문화를 가지고 있다.)와 'Culture shows ways of living and thinking.'(문화는 삶과 사고의 방식을 보여 준다.)라고 했으므로 일치함. 답이 아님.","오답 ✕ — 'In each culture, there are rules that don't allow certain things.'(각 문화마다 특정한 것들을 허용하지 않는 규칙이 있다.)라고 했으므로 일치함. 답이 아님.","정답 ○ — 'Swiss law says that people cannot have just one hamster or one parrot at home.'(스위스 법은 한 마리만 키울 수 없다고 말한다.)이고 'They must have at least two.'(최소 두 마리를 키워야 한다.)이므로 아예 키울 수 없다는 보기는 일치하지 않음.","오답 ✕ — 'These pets feel lonely when they are alone.'(이런 동물들은 혼자 있으면 외로움을 느낀다.)라고 했으므로 외로운 동물을 위한 규칙이 있다는 보기는 일치함. 답이 아님.","오답 ✕ — 'Those who have dogs must take them outside for exercise too.'(강아지를 키우는 사람들은 강아지를 운동시키기 위해 밖으로 데리고 나가야 한다.)라고 했으므로 일치함. 답이 아님."],"memo":["정답 ③: 스위스는 햄스터와 앵무새를 키울 수 없다. (✕ 불일치)","근거: people cannot have just one hamster or one parrot(한 마리만 키울 수는 없다) / They must have at least two.(최소 두 마리를 키워야 한다.)","함정: '키울 수 없다'가 아니라 '한 마리만 키울 수 없다'이다"],"why":"스위스에서는 햄스터와 앵무새를 한 마리만 키울 수 없고 최소 두 마리를 키워야 한다."},{"n":7,"q":"다음 글의 제목으로 가장 알맞은 것은?","o":["How to Take Good Care of Pets","The Most Popular Pets in Switzerland","The Law on Caring for Pets in Switzerland","The Importance of Spending Time with Your Pet","Laws for Protecting Wild Animals Around the World"],"a":2,"ans":"The Law on Caring for Pets in Switzerland","evs":[["In Switzerland, people really care about animals.","스위스에서, 사람들은 동물을 정말로 아낀다."],["Swiss law says that people cannot have just one hamster or one parrot at home.","스위스 법은 사람들이 집에서 햄스터나 앵무새를 한 마리만 키울 수 없다고 말한다."]],"ev":["In Switzerland, people really care about animals.","스위스에서, 사람들은 동물을 정말로 아낀다."],"ow":["오답 ✕ — 반려동물을 잘 돌보는 방법을 가르쳐 주는 글이 아니다. 'Swiss law says ...'(스위스 법은 ...)처럼 법을 소개하는 글이라서 틀림.","오답 ✕ — 'cannot have just one hamster or one parrot'(햄스터나 앵무새를 한 마리만 키울 수 없다)라는 법이 나오지만 가장 인기 있는 반려동물을 소개하는 글은 아니라서 틀림.","정답 ○ — 'Swiss law says that people cannot have just one hamster or one parrot at home.'(스위스 법은 한 마리만 키울 수 없다고 말한다.)처럼 스위스의 반려동물 돌봄 법을 설명하므로 맞음.","오답 ✕ — 'people who have dogs or cats must spend enough time with their pets'(강아지나 고양이를 키우는 사람들은 충분한 시간을 보내야 한다)는 법 중 한 가지일 뿐이라 너무 좁음.","오답 ✕ — 야생 동물이 아니라 집에서 키우는 반려동물('at home')에 대한 스위스의 법이라서 틀림."],"memo":["정답 ③: The Law on Caring for Pets in Switzerland","근거: Swiss law says that people cannot have just one hamster or one parrot at home.(스위스 법은 한 마리만 키울 수 없다고 말한다.)","함정: ④ 반려동물과 보내는 시간은 법 중 한 가지라서 너무 좁아 ✕"],"why":"스위스에서 반려동물을 돌보도록 정한 법을 소개하는 글이다."}],"pp":[["Every country has its own culture.","모든 나라는 고유의 문화를 가지고 있다."],["Culture shows ways of living and thinking.","문화는 삶과 사고의 방식을 보여 준다."],["In each culture, there are rules that don't allow certain things.","각 문화마다 특정한 것들을 허용하지 않는 규칙이 있다."],["So, we need to know how to act in different countries.","그래서 우리는 다른 나라에서 어떻게 행동해야 할지 알아야 한다."],["Here are some unique and interesting rules from around the world.","여기 세계의 독특하고 흥미로운 규칙들이 있다."],["Switzerland: Let's Care for Pets","스위스: 반려동물을 돌보자"],["In Switzerland, people really care about animals.","스위스에서, 사람들은 동물을 정말로 아낀다."],["Swiss law says that people cannot have just one hamster or one parrot at home.","스위스 법은 사람들이 집에서 햄스터나 앵무새를 한 마리만 키울 수 없다고 말한다."],["They must have at least two.","최소 두 마리를 키워야 한다."],["These pets feel lonely when they are alone.","이런 동물들은 혼자 있으면 외로움을 느낀다."],["They need a friend that can be with them.","이들은 함께 있을 수 있는 친구가 필요하다."],["Also, people who have dogs or cats must spend enough time with their pets.","또한, 강아지나 고양이를 키우는 사람들은 충분한 시간을 반려동물과 함께 보내야 한다."],["Those who have dogs must take them outside for exercise too.","강아지를 키우는 사람들은 강아지를 운동시키기 위해 밖으로 데리고 나가야 한다."],["Pets are very happy in Switzerland.","스위스의 반려동물들은 정말 행복하다."]]},{"qs":[{"n":8,"q":"윗글(싱가포르)의 내용과 일치하는 것은?","o":["싱가포르에서는 버스에서 음식을 먹을 수 있다.","싱가포르에서는 껌을 팔 수 있다.","규칙을 어기면 벌금을 내야 한다.","싱가포르는 규칙 때문에 지저분한 도시가 되었다.","싱가포르 사람들은 쓰레기를 어디에 버려야 하는지 모른다."],"a":2,"ans":"규칙을 어기면 벌금을 내야 한다.","evs":[["People who break the rules must pay a fine.","규칙을 어기는 사람들은 벌금을 내야 한다."],["Thanks to these rules, Singapore remains very clean.","이러한 규칙 덕분에, 싱가포르는 매우 깨끗한 상태를 유지한다."]],"ev":["People who break the rules must pay a fine.","규칙을 어기는 사람들은 벌금을 내야 한다."],"ow":["오답 ✕ — 'people cannot eat or drink on buses or the subway'(사람들은 버스나 지하철에서 먹거나 마실 수 없다)라고 했는데, 이 보기는 먹을 수 있다고 해서 틀림.","오답 ✕ — 'They also cannot sell or import chewing gum.'(사람들은 또한 껌을 팔거나 수입할 수도 없다.)라고 했는데, 이 보기는 팔 수 있다고 해서 틀림.","정답 ○ — 'People who break the rules must pay a fine.'(규칙을 어기는 사람들은 벌금을 내야 한다.)라고 했으므로 맞음.","오답 ✕ — 'Thanks to these rules, Singapore remains very clean.'(이러한 규칙 덕분에, 싱가포르는 매우 깨끗한 상태를 유지한다.)라고 했는데, 이 보기는 지저분해졌다고 해서 틀림.","오답 ✕ — 'everyone knows where to eat and where to throw away their trash'(모두가 어디에서 먹고 어디에 쓰레기를 버려야 하는지 알고 있다)라고 했는데, 이 보기는 모른다고 해서 틀림."],"memo":["정답 ③: 규칙을 어기면 벌금을 내야 한다.","근거: People who break the rules must pay a fine.(규칙을 어기는 사람들은 벌금을 내야 한다.)","함정: ④ 규칙 '덕분에' 깨끗해진 것이라 ✕"],"why":"싱가포르는 규칙을 어기면 벌금을 내서 도시를 깨끗하게 유지한다."}],"pp":[["Singapore: Let's Keep the City Clean","싱가포르: 도시를 깨끗하게 유지하자"],["Singapore is a very clean city.","싱가포르는 매우 깨끗한 도시이다."],["Here, people cannot eat or drink on buses or the subway.","이곳에서, 사람들은 버스나 지하철에서 먹거나 마실 수 없다."],["They also cannot sell or import chewing gum.","사람들은 또한 껌을 팔거나 수입할 수도 없다."],["Those actions can make the city dirty and messy.","이런 행동들은 도시를 더럽고 지저분하게 만들 수 있다."],["People who break the rules must pay a fine.","규칙을 어기는 사람들은 벌금을 내야 한다."],["In Singapore, everyone knows where to eat and where to throw away their trash.","싱가포르에서는 모두가 어디에서 먹고 어디에 자신의 쓰레기를 버려야 하는지 알고 있다."],["Thanks to these rules, Singapore remains very clean.","이러한 규칙 덕분에, 싱가포르는 매우 깨끗한 상태를 유지한다."]]},{"qs":[{"n":9,"q":"윗글의 내용을 한 문장으로 요약하려 한다. 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["ketchup - hides","ketchup - shows","sugar - hides","salt - shows","milk - improves"],"a":0,"ans":"ketchup - hides","evs":[["In France, children can't have ketchup in school cafeterias.","프랑스에서는 어린이들이 학교 식당에서 케첩을 먹을 수 없다."],["They believe that ketchup hides the real taste of their food.","그들은 케첩이 음식의 진짜 맛을 숨긴다고 믿는다."]],"ev":["In France, children can't have ketchup in school cafeterias.","프랑스에서는 어린이들이 학교 식당에서 케첩을 먹을 수 없다."],"ow":["정답 ○ — 'children can't have ketchup in school cafeterias'(어린이들이 학교 식당에서 케첩을 먹을 수 없다)와 'ketchup hides the real taste of their food'(케첩이 음식의 진짜 맛을 숨긴다)에 모두 맞으므로 ketchup - hides가 알맞음.","오답 ✕ — ketchup은 맞지만 본문은 케첩이 맛을 'hides'(숨긴다)라고 했지 shows(보여 준다)라고 하지 않아서 틀림.","오답 ✕ — hides는 맞지만 금지된 것은 'ketchup'(케첩)이지 sugar(설탕)가 아니라서 틀림.","오답 ✕ — 금지된 것은 케첩이고('children can't have ketchup'), 맛을 숨긴다는 내용이므로 salt와 shows 둘 다 틀림.","오답 ✕ — 금지된 것은 milk(우유)가 아니라 ketchup(케첩)이고, 맛을 '더 좋게 한다(improves)'는 말도 본문에 없어서 틀림."],"memo":["정답 ①: (A) ketchup, (B) hides","근거: They believe that ketchup hides the real taste of their food.(그들은 케첩이 음식의 진짜 맛을 숨긴다고 믿는다.)","함정: 케첩이 맛을 '보여 주는(shows)' 게 아니라 '숨기는(hides)' 것"],"why":"프랑스는 케첩이 음식 본연의 맛을 숨긴다고 믿어 학교 식당에서 금지한다.","sum":"In France, children can't have (A)________ in school cafeterias because French people believe it (B)________ the real taste of their food.","lab":"완성된 요약문 : "}],"pp":[["France: Let French Children Love Their Food","프랑스: 프랑스 어린이들이 음식을 사랑하게 하자"],["In France, children can't have ketchup in school cafeterias.","프랑스에서는 어린이들이 학교 식당에서 케첩을 먹을 수 없다."],["This sounds surprising, but there's a good reason.","이는 놀라운 일처럼 들리지만, 타당한 이유가 있다."],["France is famous for its delicious food.","프랑스는 맛있는 음식으로 유명하다."],["French people are very proud of their food.","프랑스 사람들은 자신들의 음식을 매우 자랑스러워한다."],["They believe that ketchup hides the real taste of their food.","그들은 케첩이 음식의 진짜 맛을 숨긴다고 믿는다."],["They really hope that their children can taste and enjoy the flavors of French cooking.","그들은 자녀들이 프랑스 요리의 맛을 보고 즐길 수 있기를 진심으로 바란다."],["That way, French children can learn to love their food culture.","그런 방법으로, 프랑스 어린이들은 음식 문화를 사랑하는 법을 배울 수 있다."]]},{"qs":[{"n":10,"q":"윗글에서 필자가 말하고자 하는 바로 알맞은 것은?","o":["이상한 규칙은 따르지 않아도 된다.","다른 나라의 규칙을 이해하면 더 행복하게 더불어 살 수 있다.","전 세계의 규칙은 모두 같아야 한다.","외국 여행은 위험하므로 피해야 한다.","우리나라의 규칙이 가장 훌륭하다."],"a":1,"ans":"다른 나라의 규칙을 이해하면 더 행복하게 더불어 살 수 있다.","evs":[["Understanding different rules from different countries helps us live together more happily.","다른 나라의 다른 규칙을 이해하는 것은 우리가 더 행복하게 더불어 살아가는 데 도움을 준다."],["Maybe some rules sound strange to you, but they show different lifestyles around the world.","일부 규칙은 이상하게 들릴 수도 있지만, 그것들은 전 세계의 다양한 생활방식을 보여 준다."]],"ev":["Understanding different rules from different countries helps us live together more happily.","다른 나라의 다른 규칙을 이해하는 것은 우리가 더 행복하게 더불어 살아가는 데 도움을 준다."],"ow":["오답 ✕ — 'some rules sound strange to you, but they show different lifestyles'(일부 규칙은 이상하게 들릴 수도 있지만 다양한 생활방식을 보여 준다)라고 했으므로 따르지 않아도 된다는 말은 없고 오히려 이해하자는 뜻이라 틀림.","정답 ○ — 'Understanding different rules from different countries helps us live together more happily.'(다른 나라의 다른 규칙을 이해하는 것은 우리가 더 행복하게 더불어 살아가는 데 도움을 준다.)라고 했으므로 맞음.","오답 ✕ — 규칙이 모두 같아야 한다는 말은 없고, 'they show different lifestyles around the world'(전 세계의 다양한 생활방식을 보여 준다)처럼 다양함을 인정하는 글이라서 틀림.","오답 ✕ — 여행이 위험하다는 내용은 없다. 글의 요지는 다른 나라의 규칙을 이해하는 것('Understanding different rules')이라서 틀림.","오답 ✕ — 우리나라 규칙이 최고라는 말은 없다. 'different lifestyles around the world'(전 세계의 다양한 생활방식)를 존중하자는 글이라서 틀림."],"memo":["정답 ②: 다른 나라의 규칙을 이해하면 더 행복하게 더불어 살 수 있다.","근거: Understanding different rules from different countries helps us live together more happily.(다른 나라의 규칙을 이해하는 것은 더불어 살아가는 데 도움을 준다.)","함정: ①은 '따르지 않아도 된다'가 아니라 '이해하자'는 내용이라 ✕"],"why":"서로 다른 나라의 규칙을 이해하면 함께 더 행복하게 살 수 있다는 결론이다."}],"pp":[["Which rule is most surprising?","어떤 규칙이 가장 놀라운가?"],["Maybe some rules sound strange to you, but they show different lifestyles around the world.","일부 규칙은 이상하게 들릴 수도 있지만, 그것들은 전 세계의 다양한 생활방식을 보여 준다."],["Understanding different rules from different countries helps us live together more happily.","다른 나라의 다른 규칙을 이해하는 것은 우리가 더 행복하게 더불어 살아가는 데 도움을 준다."]]}];

document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
