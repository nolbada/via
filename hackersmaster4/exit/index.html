 habitats were clearly separated, communities in this region shared daily living space with elephants, lions, and antelopes.","농경지와 야생 동물 서식지가 명확하게 분리된 사회들과 달리, 이 지역의 공동체들은 코끼리, 사자, 영양들과 일상적인 생활 공간을 공유했다."]],"w":"2번 문장은 농경지와 야생 동물 서식지가 분리된(separated) 사회들과 달리, 이 지역은 코끼리(elephants), 사자, 영양과 생활 공간을 공유했다는 내용이에요. were clearly 뒤에는 과거분사가, with 뒤에는 lions, antelopes와 나란히 놓일 동물 이름이 와요.","c":null},"h":"6213e517e6"}]},{"u":3,"id":"ms4-03-2","no":2,"ko":"100세 시대의 비밀을 쥔 유전자","items":[{"n":1,"t":"tf","q":"Experts say genes may decide about half of how long we live.","ko":"전문가들은 유전자가 우리가 얼마나 오래 사는지의 약 절반을 결정할 수 있다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"While this is attributed in part to medical advances and better nutrition, experts estimate that genes may determine about half of how long we live.","이는 부분적으로 의학의 발전과 더 나은 영양 섭취 덕분이지만, 전문가들은 유전자가 우리가 얼마나 오래 사는지의 약 절반을 결정할 수 있다고 추정한다."]],"w":"2번 문장에서 전문가들은 유전자가 우리가 얼마나 오래 사는지의 약 절반을 결정할 수 있다고 추정해요. 진술문과 같은 내용이에요.","c":"T"},"h":"9f2bb62d5a"},{"n":2,"t":"tf","q":"The first longevity gene was identified in humans in 1998.","ko":"최초의 장수 유전자는 1998년에 인간에게서 확인되었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In 1998, the first longevity gene was identified in fruit flies, with studies showing that flies carrying the gene lived 35 percent longer than those without it.","1998년에 초파리에서 최초의 장수 유전자가 확인되었는데, 연구에 따르면 그 유전자를 지닌 파리들은 그렇지 않은 파리들보다 35퍼센트 더 오래 살았다."]],"w":"4번 문장에서 1998년에 최초의 장수 유전자가 확인된 곳은 인간이 아니라 초파리(fruit flies)예요. 인간에게서 비슷한 유전자를 확인한 것은 2010년이에요(6번).","c":"F"},"h":"bca69faac9"},{"n":3,"t":"tf","q":"The FOXO3 gene exists only in people who are over 100 years old.","ko":"FOXO3 유전자는 100세가 넘은 사람들에게만 존재한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"While everyone has this gene, certain variants of it have been found in long-lived individuals worldwide, especially those over 100 years old.","모든 사람이 이 유전자를 가지고 있지만, 전 세계적으로 장수하는 사람들, 특히 100세가 넘은 사람들에게서 이 유전자의 특정 변이체가 발견되었다."]],"w":"7번 문장에서 모든 사람이 이 유전자를 가지고 있고(everyone has this gene), 장수하는 사람들에게서 발견된 것은 이 유전자의 특정 변이체예요.","c":"F"},"h":"954d3773f6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These flies also exhibited remarkable resilience to environmental stressors…)","ko":"이 파리들은 또한 환경적 스트레스 요인에 대해 놀라운 회복력을 보였다. (exhibit은 보이다)","word":"exhibited","opts":["숨겼다","보였다","잃었다","피했다"],"r":{"a":"2) 보였다","ev":"5번 문장","s":[[5,"These flies also exhibited remarkable resilience to environmental stressors, such as extreme heat and food scarcity.","이 파리들은 또한 극심한 더위와 식량 부족과 같은 환경적 스트레스 요인에 대해 놀라운 회복력을 보였다."]],"w":"5번에서 장수 유전자를 가진 파리가 극심한 더위와 식량 부족을 견디는 놀라운 회복력을 겉으로 드러냈다는 말이에요. exhibit = 보이다, 나타내다예요.","c":2},"h":"6cbdd116d3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…therapies that foster healthy aging and reduce the impact of age-related diseases.)","ko":"…건강한 노화를 촉진하고 노화 관련 질병의 영향을 줄이는 치료법… (foster는 촉진하다)","word":"foster","opts":["방해하다","멈추다","촉진하다","의심하다"],"r":{"a":"3) 촉진하다","ev":"10번 문장","s":[[10,"This discovery offers hope for the development of therapies that foster healthy aging and reduce the impact of age-related diseases.","이 발견은 건강한 노화를 촉진하고 노화 관련 질병의 영향을 줄이는 치료법 개발에 대한 희망을 제공한다."]],"w":"10번의 치료법은 and로 이어진 두 가지 일을 해요. 질병의 영향을 줄이는(reduce) 일과 함께 건강한 노화를 돕는(foster) 일이에요. foster = 촉진하다예요.","c":3},"h":"56023eb49b"},{"n":6,"t":"ref","q":"What does the underlined \"who\" refer to?\nThis has sparked a growing interest in the search for longevity genes, or Methuselah genes, named after the biblical figure who was said to have lived for 969 years.","ko":"밑줄 친 who가 가리키는 것은?","sko":"이것은 969세까지 살았다고 전해지는 성경 인물의 이름을 딴 장수 유전자, 즉 므두셀라 유전자의 탐색에 대한 커지는 관심을 불러일으켰다.","opts":["장수 유전자","성경 속 인물","초파리","연구자들"],"r":{"a":"2) 성경 속 인물","ev":"3번 문장","s":[[3,"This has sparked a growing interest in the search for longevity genes, or Methuselah genes, named after the biblical figure who was said to have lived for 969 years.","이것은 969세까지 살았다고 전해지는 성경 인물의 이름을 딴 장수 유전자, 즉 므두셀라 유전자의 탐색에 대한 커지는 관심을 불러일으켰다."]],"w":"who는 바로 앞의 the biblical figure(성경 속 인물)를 가리켜요. 969년을 살았다고 전해지는 사람은 유전자가 아니라 그 성경 인물이에요. 유전자는 그 인물의 이름을 따서 이름이 붙은 것이에요.","c":2,"k":"who = 성경 속 인물"},"pron":"who","h":"f14c6598e7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The average global lifespan has doubled in the past century, with people now expected to live over 70 years.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"지난 세기 동안 전 세계 평균 수명은 두 배로 늘어났으며, 이제 사람들은 70년 넘게 살 것으로 예상된다.","opts":["지난 100년 동안 전 세계 평균 수명이 두 배가 되어, 이제 사람들은 70년 넘게 살 것으로 기대된다.","전 세계 평균 수명이 지난 100년간 절반으로 줄어, 이제 70년을 넘기기 어렵다.","지난 100년 동안 평균 수명은 그대로이고, 70년을 넘겨 사는 사람은 거의 없다.","앞으로 100년 뒤에는 평균 수명이 70년의 두 배가 될 것으로 예상된다."],"r":{"a":"1) 지난 100년 동안 전 세계 평균 수명이 두 배가 되어, 이제 사람들은 70년 넘게 살 것으로 기대된다.","ev":"1번 문장","s":[[1,"The average global lifespan has doubled in the past century, with people now expected to live over 70 years.","지난 세기 동안 전 세계 평균 수명은 두 배로 늘어났으며, 이제 사람들은 70년 넘게 살 것으로 예상된다."]],"w":"has doubled in the past century는 '지난 100년 동안 두 배가 되었다'는 뜻이고, 지금 사람들은 70년 넘게 살 것으로 예상된다는 말이에요. 줄었다거나 그대로라는 말, 미래의 일이라는 말은 본문과 달라요.","c":1},"h":"bc9fbf8b03"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 단백질은 면역 체계를 약하게 만든다.","독일 연구자들은 2010년에 초파리에서 최초의 장수 유전자를 찾았다.","그 단백질은 심하게 손상된 세포를 없애고 덜 손상된 세포를 고친다.","의학 발전과 더 나은 영양이 수명 증가를 모두 설명한다."],"opts":["The protein weakens the immune system.","German researchers found the first longevity gene in fruit flies in 2010.","The protein removes severely damaged cells and repairs less damaged ones.","Medical advances and better nutrition explain all of the increase in lifespan."],"r":{"a":"3) The protein removes severely damaged cells and repairs less damaged ones.","ev":"8번 문장","s":[[8,"These human gene variants trigger the release of a protein that promotes cell health by eliminating severely damaged cells and repairing less damaged ones, which strengthens the immune system.","이러한 인간 유전자 변이체는 심하게 손상된 세포를 제거하고 덜 손상된 세포를 복구함으로써 세포 건강을 증진하는 단백질의 방출을 유발하며, 이는 면역 체계를 강화한다."]],"w":"8번에서 변이체가 내보내는 단백질은 심하게 손상된 세포를 제거하고 덜 손상된 세포를 복구하며, 그 결과 면역 체계가 강화돼요. 초파리 유전자는 1998년(4번), 독일 연구자들은 2010년에 인간에게서 확인했고(6번), 수명 증가는 의학·영양이 부분적인 이유(2번)예요.","c":3},"h":"447c318ca6"},{"n":9,"t":"sum","q":"In 2010, German researchers (A) the existence of a (B) longevity gene in humans called FOXO3.","ko":"2010년에 독일 연구자들은 FOXO3라고 불리는 (B) 장수 유전자가 인간에게 존재함을 (A).","oko":["(A) 확인했다 / (B) 유사한","(A) 부인했다 / (B) 유사한","(A) 확인했다 / (B) 다른","(A) 부인했다 / (B) 다른","(A) 의심했다 / (B) 유사한"],"opts":["(A) confirmed / (B) similar","(A) denied / (B) similar","(A) confirmed / (B) different","(A) denied / (B) different","(A) doubted / (B) similar"],"r":{"a":"1) (A) confirmed / (B) similar (A) 확인했다 / (B) 유사한","ev":"6번 문장","s":[[6,"In 2010, German researchers confirmed the existence of a similar longevity gene in humans called FOXO3.","2010년에 독일 연구자들은 인간에게서 FOXO3라고 불리는 유사한 장수 유전자의 존재를 확인했다."]],"w":"6번 문장에서 2010년 독일 연구자들은 인간에게서 비슷한(similar) 장수 유전자 FOXO3의 존재를 확인했다(confirmed)고 해요. 부인하거나 의심했다는 내용은 없고, 초파리의 유전자와 다른 유전자라는 말도 없어요.","c":1},"h":"7176064f1e"},{"n":10,"t":"fill","q":"Their presence has also been [A] with increased resistance to heart disease, [B], and cancer.","ko":"그것들의 존재는 또한 심장병, [B], 암에 대한 저항력 증가와 [A].","bank":["protein","scarcity","associated","variants","therapies","stroke"],"bko":{"protein":"단백질","scarcity":"부족","associated":"관련되었다(associate의 과거분사)","variants":"변이체들","therapies":"치료법들","stroke":"뇌졸중"},"r":{"a":"[A] associated (관련되었다(associate의 과거분사)), [B] stroke (뇌졸중)","ev":"9번 문장","s":[[9,"Their presence has also been associated with increased resistance to heart disease, stroke, and cancer.","그것들의 존재는 또한 심장병, 뇌졸중, 암에 대한 저항력 증가와 관련이 있다."]],"w":"9번 문장은 변이체의 존재가 심장병, 뇌졸중(stroke), 암에 대한 저항력 증가와 관련이 있다(has been associated with)는 내용이에요. has been 뒤에는 과거분사 associated가 오고, heart disease, stroke, and cancer처럼 질병 이름이 나란히 나열돼요.","c":null},"h":"795c4eeb80"}]},{"u":3,"id":"ms4-03-3","no":3,"ko":"파리 올림픽 마스코트의 정체","items":[{"n":1,"t":"tf","q":"Paris chose an animal as its Olympic mascot, just like other host cities often did.","ko":"파리는 다른 개최 도시들이 종종 그랬듯이 동물을 올림픽 마스코트로 골랐다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"However, Paris, the host of the 2024 Olympics, selected a hat as the mascot for the Games!","그러나 2024년 올림픽 개최지인 파리는 대회의 마스코트로 모자를 선택했다!"]],"w":"2번 문장 However 뒤에서 파리는 동물이 아니라 모자(a hat)를 마스코트로 골랐다고 해요. 동물을 고르는 것은 1번에 나온 다른 도시들의 이야기예요.","c":"F"},"h":"60f04795e1"},{"n":2,"t":"tf","q":"The mascot Phryge has lively eyes, a friendly smile, and colorful athletic shoes.","ko":"마스코트 프리주는 생기 있는 눈, 친근한 미소, 화려한 운동화를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The mascot, Phryge, is a cone-shaped character with lively eyes, a friendly smile, and colorful athletic shoes.","마스코트인 프리주(Phryge)는 생기 있는 눈, 친근한 미소, 그리고 화려한 운동화를 신은 원뿔 모양의 캐릭터이다."]],"w":"3번 문장에서 프리주는 생기 있는 눈, 친근한 미소, 화려한 운동화를 가진 원뿔 모양 캐릭터라고 해요. 진술문과 같은 내용이에요.","c":"T"},"h":"748ede4329"},{"n":3,"t":"tf","q":"The Olympic Phryge wears a visible prosthetic leg.","ko":"올림픽 프리주는 눈에 띄는 의족을 착용하고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Paris 2024 actually features two Phryges: the Olympic Phryge and the Paralympic Phryge, with the latter wearing a visible prosthetic leg.","2024 파리 올림픽은 사실 두 개의 프리주 캐릭터를 특징으로 하는데, 올림픽 프리주와 패럴림픽 프리주이며, 후자는 눈에 띄는 의족을 착용하고 있다."]],"w":"6번 문장에서 눈에 띄는 의족을 착용한 것은 후자(the latter), 즉 패럴림픽 프리주예요. 올림픽 프리주가 아니에요.","c":"F"},"h":"58f00c5bc4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It depicts the iconic Phrygian cap…)","ko":"그것은 상징적인 프리기아 모자를 묘사한다. (depict는 묘사하다)","word":"depicts","opts":["비판한다","묘사한다","숨긴다","팔아 치운다"],"r":{"a":"2) 묘사한다","ev":"4번 문장","s":[[4,"It depicts the iconic Phrygian cap, which is a soft, cone-shaped hat that has been a powerful symbol of freedom in French history since the Revolution.","그것은 (프랑스) 혁명 이후 프랑스 역사에서 자유의 강력한 상징이 되어 온 부드러운 원뿔 모양의 모자인 프리기아 모자를 묘사한다."]],"w":"4번에서 프리주(마스코트)가 프리기아 모자를 본뜬 모습을 보여 준다는 말이에요. depict = 그려 내다, 묘사하다예요.","c":2},"h":"ba961b30eb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…promote a world where differences are embraced and valued.)","ko":"…차이가 포용되고 가치 있게 여겨지는 세상을 장려한다. (embrace는 포용하다)","word":"embraced","opts":["포용되는","감춰지는","무시되는","금지되는"],"r":{"a":"1) 포용되는","ev":"8번 문장","s":[[8,"The Paralympic Phryge serves as a powerful reminder that the Games celebrate all athletes and promote a world where differences are embraced and valued.","패럴림픽 프리주는 올림픽이 모든 선수를 기념하고 차이가 포용되고 가치 있게 여겨지는 세상을 장려한다는 강력히 상기시키는 역할을 한다."]],"w":"8번에서 and valued(가치 있게 여겨지는)와 짝을 이루는 말이에요. 차이를 감추거나 무시하는 세상이 아니라 받아들이는 세상이라서 embraced = 포용되는이에요.","c":1},"h":"d791019741"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nThe red cap once worn by revolutionaries in the streets has now taken its place on the Olympic stage before a global audience.","ko":"밑줄 친 its가 가리키는 것은?","sko":"한때 혁명가들이 거리에서 쓰고 다니던 붉은 모자는 이제 전 세계인의 시선이 모이는 올림픽 무대에서 자신의 자리를 차지하게 되었다.","opts":["붉은 모자","거리","올림픽 무대","혁명가들"],"r":{"a":"1) 붉은 모자","ev":"9번 문장","s":[[9,"The red cap once worn by revolutionaries in the streets has now taken its place on the Olympic stage before a global audience.","한때 혁명가들이 거리에서 쓰고 다니던 붉은 모자는 이제 전 세계인의 시선이 모이는 올림픽 무대에서 자신의 자리를 차지하게 되었다."]],"w":"its place에서 its는 문장의 주어 The red cap once worn by revolutionaries in the streets(한때 혁명가들이 거리에서 쓰던 붉은 모자)를 가리켜요. 올림픽 무대에서 자리를 차지하게 된 것은 모자예요. 혁명가들은 모자를 쓰던 사람들이라 its가 아니에요.","c":1,"k":"its = 붉은 모자"},"pron":"its","h":"74b03bae89"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This inclusive design choice reflects the Olympic spirit that no one should be excluded based on race, gender, or ability.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 포용적인 디자인 선택은 인종, 성별, 또는 능력에 근거하여 누구도 배제되어서는 안 된다는 올림픽 정신을 반영한다.","opts":["이러한 포용적인 디자인 선택은 인종, 성별, 능력을 이유로 누구도 배제되어서는 안 된다는 올림픽 정신을 반영한다.","이러한 디자인 선택은 능력이 뛰어난 선수만 올림픽에 참가해야 한다는 뜻을 담고 있다.","이러한 디자인 선택은 인종과 성별에 따라 선수를 나누어야 한다는 올림픽 정신을 반영한다.","이러한 디자인 선택은 올림픽 정신과 상관없이 개인의 취향에 따라 정해졌다."],"r":{"a":"1) 이러한 포용적인 디자인 선택은 인종, 성별, 능력을 이유로 누구도 배제되어서는 안 된다는 올림픽 정신을 반영한다.","ev":"7번 문장","s":[[7,"This inclusive design choice reflects the Olympic spirit that no one should be excluded based on race, gender, or ability.","이러한 포용적인 디자인 선택은 인종, 성별, 또는 능력에 근거하여 누구도 배제되어서는 안 된다는 올림픽 정신을 반영한다."]],"w":"reflects는 '반영한다'는 뜻이고, the Olympic spirit that no one should be excluded는 '누구도 배제되어서는 안 된다는 올림픽 정신'이에요. 포용적인(inclusive) 디자인이 이 정신을 보여 준다는 뜻이라 1번이 맞아요.","c":1},"h":"3d1789c5bc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["개최 도시들은 종종 자신의 도시나 나라를 상징하는 동물을 골라 왔다.","개최 도시들은 1968년 이후 대부분 모자를 마스코트로 골라 왔다.","2024 파리 올림픽의 마스코트는 올림픽 프리주 하나뿐이다.","사람들은 인종, 성별, 능력을 이유로 배제될 수 있다."],"opts":["Host cities have often chosen animals that symbolize their city or country.","Host cities have mostly picked hats as their mascots since 1968.","Paris 2024 has only one mascot, the Olympic Phryge.","People can be excluded based on their race, gender, or ability."],"r":{"a":"1) Host cities have often chosen animals that symbolize their city or country.","ev":"1번 문장","s":[[1,"Since 1968, cities hosting the Olympic Games have introduced mascots to represent them, often choosing animals that symbolize the host city or country in a fun and engaging way.","1968년부터 올림픽 개최 도시들은 자신들을 대표하기 위해 마스코트를 도입해 왔으며, 종종 재미있고 흥미로운 방식으로 개최 도시나 국가를 상징하는 동물을 선택했다."]],"w":"1번에서 개최 도시들은 종종 도시나 국가를 상징하는 동물을 골랐다고 해요. 모자는 파리가 처음 고른 특별한 선택이고(2번), 프리주는 두 개이며(6번), 올림픽 정신은 누구도 배제하면 안 된다는 것이에요(7번).","c":1},"h":"a09183f42d"},{"n":9,"t":"sum","q":"The red cap worn by revolutionaries during many (A) moments in French history stands for liberty, equality, and (B).","ko":"혁명가들이 프랑스 역사의 많은 (A) 순간에 썼던 붉은 모자는 자유, 평등, 그리고 (B)을(를) 나타낸다.","oko":["(A) 중대한 / (B) 박애","(A) 지루한 / (B) 박애","(A) 중대한 / (B) 경쟁","(A) 행복한 / (B) 박애","(A) 중대한 / (B) 부"],"opts":["(A) critical / (B) fraternity","(A) boring / (B) fraternity","(A) critical / (B) competition","(A) happy / (B) fraternity","(A) critical / (B) wealth"],"r":{"a":"1) (A) critical / (B) fraternity (A) 중대한 / (B) 박애","ev":"5번 문장","s":[[5,"This red cap was worn by revolutionaries during many critical moments in French history and represents liberty, equality, and fraternity—the core values of the French Republic.","이 붉은 모자는 프랑스 역사의 많은 중대한 순간 동안 혁명가들에 의해 착용되었으며, 프랑스 공화국의 핵심 가치인 자유, 평등, 박애를 나타낸다."]],"w":"5번 문장에서 붉은 모자는 프랑스 역사의 많은 중대한(critical) 순간에 혁명가들이 썼고, 자유, 평등, 박애(fraternity)를 나타낸다고 해요. 박애는 프랑스 공화국의 핵심 가치 세 가지 중 하나예요. 경쟁이나 부는 본문에 나오지 않아요.","c":1},"h":"4b4b718b68"},{"n":10,"t":"fill","q":"And the ideals of liberty and equality they once fought for became [A] into the spirit of the Games, helping define the [B] of Paris 2024.","ko":"그리고 그들이 한때 쟁취하고자 했던 자유와 평등의 이상은 올림픽 정신 속에 [A] 상태가 되었고, 2024년 파리의 [B]을(를) 규정하는 데 도움을 주었다.","bank":["colorful","woven","lively","atmosphere","inclusive","soft"],"bko":{"colorful":"화려한","woven":"스며든(weave의 과거분사)","lively":"생기 있는","atmosphere":"분위기","inclusive":"포용적인","soft":"부드러운"},"r":{"a":"[A] woven (스며든(weave의 과거분사)), [B] atmosphere (분위기)","ev":"10번 문장","s":[[10,"And the ideals of liberty and equality they once fought for became woven into the spirit of the Games, helping define the atmosphere of Paris 2024.","그리고 그들이 한때 쟁취하고자 했던 자유와 평등의 이상은 올림픽 정신 속에 스며들어, 2024년 파리의 분위기를 만들어 냈다."]],"w":"10번 문장은 혁명가들이 쟁취하려 했던 자유와 평등의 이상이 올림픽 정신 속에 스며들어(woven into) 파리 2024의 분위기(atmosphere)를 만드는 데 도움을 주었다는 내용이에요. became 뒤에는 과거분사 woven이 오고, the 뒤에는 명사 atmosphere가 와요.","c":null},"h":"28012e7252"}]},{"u":3,"id":"ms4-03-4","no":4,"ko":"Even the Camera Giant Forgot to Run","items":[{"n":1,"t":"tf","q":"The Red Queen scene appears in Lewis Carroll’s novel Alice Through the Looking-Glass.","ko":"붉은 여왕이 나오는 장면은 루이스 캐럴의 소설 <거울 나라의 앨리스>에 나온다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In Lewis Carroll’s novel Alice Through the Looking-Glass, there is a famous scene involving the Red Queen.","루이스 캐럴의 소설 <거울 나라의 앨리스>에는 붉은 여왕이 등장하는 유명한 장면이 있다."]],"w":"1번 문장에서 루이스 캐럴의 소설 Alice Through the Looking-Glass에 붉은 여왕이 등장하는 유명한 장면이 있다고 해요.","c":"T"},"h":"8a5b8e25b9"},{"n":2,"t":"tf","q":"According to the passage, a company that is already successful does not need to upgrade its goods and services.","ko":"글에 따르면, 이미 성공한 기업은 상품과 서비스를 업그레이드할 필요가 없다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"In other words, a company that does not try to adapt to changing market conditions by upgrading its goods and services, regardless of how successful it is, will eventually fail.","다시 말해, 아무리 성공적이라 할지라도, 상품과 서비스를 업그레이드함으로써 변화하는 시장 상황에 적응하려고 노력하지 않는 기업은 결국 실패할 것이다."]],"w":"5번 문장에서 아무리 성공적이라도(regardless of how successful it is), 상품과 서비스를 업그레이드해 변화에 적응하려 하지 않는 기업은 결국 실패한다고 해요.","c":"F"},"h":"4a89ffa6f8"},{"n":3,"t":"tf","q":"Other companies soon developed and released their own digital cameras.","ko":"다른 회사들은 곧 자신들의 디지털카메라를 개발하고 출시했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"On the other hand, other companies soon developed and released their own digital cameras.","반면에, 다른 회사들은 곧 그들만의 디지털카메라를 개발하고 출시했다."]],"w":"10번 문장에서 다른 회사들이 곧 그들만의 디지털카메라를 개발하고 출시했다고 해요. 코닥이 출시하지 않은 것과 대비되는 내용이에요.","c":"T"},"h":"a92bf50e09"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…Kodak, a company that was founded in 1888 and dominated the camera industry as well as the film industry for years.)","ko":"…1888년에 설립되어 수년 동안 필름 산업뿐만 아니라 카메라 산업도 지배한 회사… (dominate는 지배하다)","word":"dominated","opts":["지배했다","포기했다","광고했다","수리했다"],"r":{"a":"1) 지배했다","ev":"7번 문장","s":[[7,"A famous example of the Red Queen effect is Kodak, a company that was founded in 1888 and dominated the camera industry as well as the film industry for years.","붉은 여왕 효과의 유명한 예는 코닥인데, 이 회사는 1888년에 설립되어 수년 동안 필름 산업뿐만 아니라 카메라 산업도 지배했다."]],"w":"7번에서 코닥은 오랫동안 카메라와 필름 산업에서 가장 힘이 센 회사였어요. 그래서 dominate = 지배하다예요.","c":1},"h":"0e5f3db018"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These new products gained tremendous popularity among the public…)","ko":"이 새로운 제품들은 대중들 사이에서 엄청난 인기를 얻었고… (tremendous는 엄청난)","word":"tremendous","opts":["사소한","불확실한","엄청난","오래된"],"r":{"a":"3) 엄청난","ev":"11번 문장","s":[[11,"These new products gained tremendous popularity among the public, to such an extent that digital cameras came to dominate the camera market.","이 새로운 제품들은 대중들 사이에서 엄청난 인기를 얻었고, 디지털카메라가 카메라 시장을 지배하게 될 정도였다."]],"w":"11번에서 인기가 아주 커서 디지털카메라가 카메라 시장을 지배하게 될 정도였다고 해요. 그래서 tremendous popularity = 엄청난 인기예요.","c":3},"h":"82b875c402"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAs a result, Kodak’s misguided decision led it to declare bankruptcy in 2012.","ko":"밑줄 친 it이 가리키는 것은?","sko":"결과적으로, 코닥의 잘못된 결정은 2012년에 코닥이 파산을 선언하게 했다.","opts":["필름 산업","코닥","디지털카메라","다른 경쟁 회사들"],"r":{"a":"2) 코닥","ev":"12번 문장","s":[[12,"As a result, Kodak’s misguided decision led it to declare bankruptcy in 2012.","결과적으로, 코닥의 잘못된 결정은 2012년에 코닥이 파산을 선언하게 했다."]],"w":"「led + 목적어 + to부정사」에서 it은 파산을 선언하게 된 대상이에요. 잘못된 결정을 한 Kodak이므로 it = Kodak이에요.","c":2},"h":"ebdd2ed7b8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When Alice expresses surprise about remaining in the same spot while running her fastest, the Red Queen tells her that she must run twice as fast to get somewhere else.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"앨리스가 전력 질주를 하는 동안에도 같은 장소에 머물러 있는 것에 대해 놀라움을 표현할 때, 붉은 여왕은 다른 곳으로 가기 위해서는 두 배로 빨리 달려야 한다고 그녀에게 말한다.","opts":["앨리스는 붉은 여왕보다 두 배로 빨리 달려서 다른 곳에 도착한다.","붉은 여왕은 앨리스에게 같은 장소에 머물려면 천천히 달리라고 말한다.","앨리스는 제자리에 있는 것이 놀랍지 않다며 여왕에게 달리는 법을 가르친다.","앨리스가 전력으로 달리는데도 제자리라는 데 놀라자, 붉은 여왕은 다른 곳에 가려면 두 배로 빨리 달려야 한다고 말한다."],"r":{"a":"4) 앨리스가 전력으로 달리는데도 제자리라는 데 놀라자, 붉은 여왕은 다른 곳에 가려면 두 배로 빨리 달려야 한다고 말한다.","ev":"2번 문장","s":[[2,"When Alice expresses surprise about remaining in the same spot while running her fastest, the Red Queen tells her that she must run twice as fast to get somewhere else.","앨리스가 전력 질주를 하는 동안에도 같은 장소에 머물러 있는 것에 대해 놀라움을 표현할 때, 붉은 여왕은 다른 곳으로 가기 위해서는 두 배로 빨리 달려야 한다고 그녀에게 말한다."]],"w":"앨리스는 가장 빨리 달리는데도 같은 곳에 있어서 놀라요(surprise). 여왕은 다른 곳에 가려면 twice as fast, 즉 두 배로 빨리 달리라고 말해요.","c":4},"h":"804493c33b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["한때 성공한 기업은 적응할 필요가 전혀 없다.","의욕 넘치는 경쟁자들은 제품을 계속 개선한다.","코닥의 임원들은 디지털카메라를 시장에 출시하기로 결정했다.","다른 회사들은 자신들의 디지털카메라를 출시하기를 거부했다."],"opts":["A company that was successful once never needs to adapt.","Highly motivated competitors keep improving their products.","Kodak’s executives decided to release the digital camera to the market.","Other companies refused to release their own digital cameras."],"r":{"a":"2) Highly motivated competitors keep improving their products.","ev":"5~6번 문장","s":[[5,"In other words, a company that does not try to adapt to changing market conditions by upgrading its goods and services, regardless of how successful it is, will eventually fail.","다시 말해, 아무리 성공적이라 할지라도, 상품과 서비스를 업그레이드함으로써 변화하는 시장 상황에 적응하려고 노력하지 않는 기업은 결국 실패할 것이다."],[6,"This is because there are highly motivated competitors that are constantly improving their products.","이는 끊임없이 제품을 개선하는 의욕 넘치는 경쟁자들이 있기 때문이다."]],"w":"6번에서 의욕 넘치는 경쟁자들이 끊임없이 제품을 개선한다고 해요. 한때 성공한 기업도 적응하지 않으면 실패하고(5번), 코닥은 출시하지 않기로 했으며(9번), 다른 회사들은 출시했어요(10번).","c":2},"h":"430b49566b"},{"n":9,"t":"sum","q":"Kodak’s executives were (A) that digital cameras might (B) film sales, so they did not bring their invention to the market.","ko":"코닥의 임원들은 디지털카메라가 필름 판매를 (B) 수 있다는 점을 (A), 그래서 그 발명품을 시장에 내놓지 않았다.","oko":["(A) 우려했다 / (B) 줄일","(A) 기뻐했다 / (B) 줄일","(A) 우려했다 / (B) 늘릴","(A) 기뻐했다 / (B) 늘릴","(A) 불확실해했다 / (B) 줄일"],"opts":["(A) concerned / (B) reduce","(A) pleased / (B) reduce","(A) concerned / (B) increase","(A) pleased / (B) increase","(A) uncertain / (B) reduce"],"r":{"a":"1) (A) concerned / (B) reduce (A) 우려했다 / (B) 줄일","ev":"9번 문장","s":[[9,"However, Kodak’s executives were concerned that digital cameras might reduce its film sales, so they ultimately decided not to release its invention to the market.","그러나, 코닥의 임원들은 디지털카메라가 필름 판매를 줄일지도 모른다고 우려했고, 그래서 그들은 결국 그 발명품을 시장에 출시하지 않기로 결정했다."]],"w":"9번 문장에서 코닥의 임원들은 디지털카메라가 필름 판매를 줄일지도(might reduce) 모른다고 우려했고(were concerned), 그래서 발명품을 시장에 출시하지 않기로 했어요. 기뻐했다거나 판매가 늘어난다고 본 것이 아니에요.","c":1},"h":"6996088037"},{"n":10,"t":"fill","q":"In the business world, the Red Queen effect is a phenomenon in which companies must [A] improve just to survive, and they must make even [B] improvements to achieve further success.","ko":"비즈니스 세계에서, 붉은 여왕 효과는 기업들이 단지 생존하기 위해서 [A] 개선해야 하며, 더 큰 성공을 거두기 위해서는 훨씬 더 [B] 개선을 해야 한다는 현상이다.","bank":["motivated","constantly","famous","greater","digital","market"],"bko":{"motivated":"의욕 넘치는","constantly":"끊임없이","famous":"유명한","greater":"더 큰","digital":"디지털의","market":"시장"},"r":{"a":"[A] constantly (끊임없이), [B] greater (더 큰)","ev":"4번 문장","s":[[4,"In the business world, the Red Queen effect is a phenomenon in which companies must constantly improve just to survive, and they must make even greater improvements to achieve further success.","비즈니스 세계에서, 붉은 여왕 효과는 기업들이 단지 생존하기 위해서 끊임없이 개선해야 하며, 더 큰 성공을 거두기 위해서는 훨씬 더 큰 개선을 해야 한다는 현상이다."]],"w":"4번 문장은 기업이 단지 생존하기 위해서도 끊임없이(constantly) 개선해야 하고, 더 큰 성공을 위해서는 훨씬 더 큰(greater) 개선을 해야 한다는 내용이에요. must와 improve 사이에는 동사를 꾸미는 부사가, even 뒤 improvements 앞에는 형용사가 와요.","c":null},"h":"a2f66db1e5"}]},{"u":4,"id":"ms4-04-1","no":1,"ko":"쉿, 근데 다 알잖아~","items":[{"n":1,"t":"tf","q":"The expression “elephant in the room” refers to a serious problem that everyone knows about but no one wants to discuss.","ko":"‘방 안의 코끼리’라는 표현은 모두가 알지만 아무도 이야기하고 싶어 하지 않는 심각한 문제를 가리킨다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The expression “elephant in the room” is used to refer to a serious problem that everyone is aware of but no one wants to talk about because it makes them uncomfortable.","“방 안의 코끼리”라는 표현은 모두가 알고 있지만 그것이 그들을 불편하게 만들기 때문에 아무도 이야기하고 싶어 하지 않는 심각한 문제를 가리키는 데 사용된다."]],"w":"5번 문장에서 모두가 알고 있지만 아무도 이야기하고 싶어 하지 않는 심각한 문제라고 풀이해요. 그대로 일치해요.","c":"T"},"h":"f42eba5cd1"},{"n":2,"t":"tf","q":"According to the passage, ignoring the elephant usually builds more trust in leadership.","ko":"글에 따르면, 코끼리를 무시하는 것은 보통 리더십에 대한 신뢰를 더 쌓는다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"When this happens, some managers choose to take the easy path, that is, ignoring the elephant.","이런 일이 발생할 때, 어떤 관리자들은 쉬운 길, 즉 코끼리를 무시하는 것을 선택한다."],[8,"But it often causes adverse consequences, such as leading to low employee morale and a lack of trust in leadership.","그러나 그것은 종종 낮은 직원 사기와 리더십에 대한 신뢰 부족으로 이어지는 것과 같은 부정적인 결과들을 초래한다."]],"w":"7번에서 코끼리를 무시하는 것은 관리자들이 고르는 쉬운 길이에요. 8번에서 그 결과로 낮은 직원 사기와 리더십에 대한 신뢰 부족이 생긴다고 해요. 신뢰가 쌓이는 것이 아니라 부족해져요.","c":"F"},"h":"af8abe1402"},{"n":3,"t":"tf","q":"The first step in dealing with the elephant is to gather opinions.","ko":"코끼리를 다루는 첫 번째 단계는 의견을 모으는 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"The first step is to acknowledge the issue and raise it with staff members to create an atmosphere in which people feel free to talk openly without fear of criticism.","첫 번째 단계는 사람들이 비판의 두려움 없이 솔직하게 이야기할 수 있는 자유를 느끼는 분위기를 조성하기 위해 그 문제를 인정하고 직원들에게 그것을 제기하는 것이다."],[11,"Next, gather opinions.","다음으로, 의견을 모아라."]],"w":"첫 번째 단계는 10번에서 문제를 인정하고 직원들에게 제기하는 것이에요. 의견을 모으는 것은 11번에서 Next(다음으로)라고 했으니 두 번째 단계예요.","c":"F"},"h":"76d59c2695"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The first step is to acknowledge the issue and raise it with staff members.)","ko":"첫 번째 단계는 그 문제를 인정하고 직원들에게 제기하는 것이다. (acknowledge는 인정하다)","opts":["운반하다","인정하다","반대하다","피하다"],"word":"acknowledge","r":{"a":"2) 인정하다","ev":"10번 문장","s":[[10,"The first step is to acknowledge the issue and raise it with staff members to create an atmosphere in which people feel free to talk openly without fear of criticism.","첫 번째 단계는 사람들이 비판의 두려움 없이 솔직하게 이야기할 수 있는 자유를 느끼는 분위기를 조성하기 위해 그 문제를 인정하고 직원들에게 그것을 제기하는 것이다."]],"w":"10번에서 첫 단계는 문제를 acknowledge한 뒤 직원들에게 꺼내 놓는 것이에요. 문제를 피하거나 반대하면 꺼내 놓을 수 없어요. acknowledge = 인정하다.","c":2},"h":"6fbbe3e4a8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But it often causes adverse consequences, such as leading to low employee morale…)","ko":"그러나 그것은 종종 낮은 직원 사기로 이어지는 것과 같은 부정적인 결과들을 초래한다.","opts":["즉각적인","예상된","부정적인","다양한"],"word":"adverse","r":{"a":"3) 부정적인","ev":"8번 문장","s":[[8,"But it often causes adverse consequences, such as leading to low employee morale and a lack of trust in leadership.","그러나 그것은 종종 낮은 직원 사기와 리더십에 대한 신뢰 부족으로 이어지는 것과 같은 부정적인 결과들을 초래한다."]],"w":"8번의 adverse consequences 뒤에 low employee morale(낮은 직원 사기), a lack of trust(신뢰 부족)가 예로 나와요. 모두 나쁜 결과라서 adverse = 부정적인, 해로운이에요.","c":3},"h":"38967e02ee"},{"n":6,"t":"ref","q":"What does the underlined “their” refer to?\nAffected individuals need to know that their voices are being heard when it comes to finding a resolution.","ko":"밑줄 친 their가 가리키는 것은?","sko":"영향을 받는 개인들은 해결책을 찾는 데 있어 그들의 목소리가 경청되고 있다는 것을 알 필요가 있다.","opts":["어떤 관리자들","주요 고객들","리더십을 맡은 사람들","영향을 받는 개인들"],"r":{"a":"4) 영향을 받는 개인들","ev":"12번 문장","s":[[12,"Affected individuals need to know that their voices are being heard when it comes to finding a resolution.","영향을 받는 개인들은 해결책을 찾는 데 있어 그들의 목소리가 경청되고 있다는 것을 알 필요가 있다."]],"w":"12번의 주어 Affected individuals(영향을 받는 개인들)가 need to know의 주어이고, know의 목적어 안의 their voices도 그 사람들의 목소리예요. 자기 목소리가 경청되고 있음을 알아야 하는 사람들이에요.","c":4},"h":"413f72b714"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n“Instead, it is best to deal with the elephant as soon as it makes an appearance.”","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"대신에, 코끼리가 나타나자마자 그것을 다루는 것이 최선이다.","opts":["문제가 커진 뒤에 한꺼번에 다루는 것이 가장 낫다.","문제가 모습을 드러내자마자 바로 다루는 것이 가장 좋다.","코끼리가 나타나면 그 자리를 피하는 것이 가장 좋다.","문제가 저절로 사라질 때까지 기다리는 것이 가장 좋다."],"r":{"a":"2) 문제가 모습을 드러내자마자 바로 다루는 것이 가장 좋다.","ev":"9번 문장","s":[[9,"Instead, it is best to deal with the elephant as soon as it makes an appearance.","대신에, 코끼리가 나타나자마자 그것을 다루는 것이 최선이다."]],"w":"as soon as는 ‘~하자마자’, makes an appearance는 ‘나타나다’예요. 문제가 나타나는 즉시 다루라는 뜻이라 ②가 맞아요. 7번의 무시하기와 반대 방향의 권고예요.","c":2},"h":"40d88eaee1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["‘방 안의 코끼리’는 직원들을 겁주는 진짜 동물이다.","첫 번째 단계는 일정을 넣은 세부 계획을 세우는 것이다.","마지막 단계에서는 해결책이 어떻게 실행될지 자세히 설명한다.","직원들의 목소리는 이미 들리고 있으니 의견 수집은 건너뛰어도 된다."],"opts":["The elephant in the room is a real animal that scares employees.","The first step is to make a detailed plan with a timeline.","In the last step, the manager explains in detail how the solution will be carried out.","Gathering opinions can be skipped because staff voices are already heard."],"r":{"a":"3) In the last step, the manager explains in detail how the solution will be carried out.","ev":"10번, 13번 문장","s":[[10,"The first step is to acknowledge the issue and raise it with staff members to create an atmosphere in which people feel free to talk openly without fear of criticism.","첫 번째 단계는 사람들이 비판의 두려움 없이 솔직하게 이야기할 수 있는 자유를 느끼는 분위기를 조성하기 위해 그 문제를 인정하고 직원들에게 그것을 제기하는 것이다."],[13,"Finally, instill confidence by providing a detailed explanation of how the solution will be implemented, making sure to specify the timeline, the intended outcome, and the role of staff members.","마지막으로, 일정, 의도된 결과, 그리고 직원들의 역할을 분명히 명시하면서, 해결책이 어떻게 실행될지에 대한 자세한 설명을 제공함으로써 신뢰를 심어주어라."]],"w":"13번에서 마지막으로 해결책이 어떻게 실행될지 자세히 설명하라고 해요(③). ①은 4번에서 진짜 코끼리가 아니라고 했고, ②의 일정은 첫 단계(10번)가 아니라 마지막 단계(13번)에서 밝히는 내용이에요. ④는 11~12번에서 의견을 모아 목소리가 들리고 있다는 것을 알리라고 했으니 틀려요.","c":3},"h":"e7699e5460"},{"n":9,"t":"sum","q":"In the office, everyone seems (A) and stressed out, because they are (B) about the elephant in the room.","ko":"사무실에서 모두가 (A) 모습이며 스트레스를 받은 것처럼 보이는데, 이는 방 안의 코끼리에 대해 (B) 있기 때문이다.","oko":["(A) 산만한 / (B) 걱정하고","(A) 들뜬 / (B) 걱정하고","(A) 산만한 / (B) 기뻐하고","(A) 느긋한 / (B) 기뻐하고","(A) 들뜬 / (B) 자랑스러워하고"],"opts":["(A) distracted / (B) worried","(A) excited / (B) worried","(A) distracted / (B) pleased","(A) relaxed / (B) pleased","(A) excited / (B) proud"],"r":{"a":"1) (A) distracted / (B) worried (A) 산만한 / (B) 걱정하고","ev":"1번, 3번 문장","s":[[1,"Employees in an office have gathered for a meeting, but everyone seems distracted and stressed out.","사무실의 직원들이 회의를 위해 모였지만, 모두가 산만하고 스트레스를 받은 것처럼 보인다."],[3,"They must be worried about the elephant in the room.","그들은 분명 방 안의 코끼리에 대해 걱정하고 있을 것이다."]],"w":"1번 문장에서 직원들은 산만하고(distracted) 스트레스를 받은 것처럼 보인다고 해요. 3번 문장에서 그들은 방 안의 코끼리에 대해 걱정하고(worried) 있을 것이라고 해요. 들뜨거나 기뻐한다는 말은 본문에 없어요.","c":1},"h":"32ac435aaf"},{"n":10,"t":"fill","q":"In the business world, for example, people may be avoiding mentioning the company’s poor [A] or the loss of a major [B].","ko":"예를 들어, 비즈니스 세계에서, 사람들은 회사의 저조한 [A] 또는 주요 [B] 상실을 언급하는 것을 피하고 있을지도 모른다.","bank":["uncomfortable","performance","openly","easy","client","aware"],"bko":{"uncomfortable":"불편한","performance":"실적","openly":"솔직하게","easy":"쉬운","client":"고객","aware":"알고 있는"},"r":{"a":"[A] performance (실적), [B] client (고객)","ev":"6번 문장","s":[[6,"In the business world, for example, people may be avoiding mentioning the company’s poor performance or the loss of a major client.","예를 들어, 비즈니스 세계에서, 사람들은 회사의 저조한 실적이나 주요 고객의 상실을 언급하는 것을 피하고 있을지도 모른다."]],"w":"6번 문장은 회사의 저조한 실적(performance)이나 주요 고객(client)의 상실을 말하지 않으려는 예를 들고 있어요. poor와 major 뒤에는 명사가 와야 하고, 부사(openly)나 형용사(easy, aware)는 들어갈 수 없어요.","c":null},"h":"18555cf123"}]},{"u":4,"id":"ms4-04-2","no":2,"ko":"따로 또 같이, 선집의 매력","items":[{"n":1,"t":"tf","q":"The word “anthology” comes from a Greek word that means “flower-gathering.”","ko":"‘anthology’라는 말은 ‘꽃 모으기’를 뜻하는 그리스어에서 왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The term comes from the Greek word anthológos, which means “flower-gathering,” a metaphorical reference to the gathering of small poetry verses like flowers in a bouquet.","이 용어는 “꽃 모으기”를 의미하는 그리스어 anthológos에서 유래했는데, 이는 꽃다발 속의 꽃처럼 짧은 시구들을 모으는 것을 은유적으로 가리키는 것이다."]],"w":"4번 문장에서 그리스어 anthológos가 ‘꽃 모으기’를 뜻한다고 해요. 그대로 일치해요.","c":"T"},"h":"27c7dbb788"},{"n":2,"t":"tf","q":"At first, the term “anthology” was used in both the literary world and broadcast media.","ko":"처음에 ‘anthology’라는 용어는 문학계와 방송 매체 모두에서 쓰였다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"It was used only in the literary world to describe a group of written works published together in a single volume.","그것은 문학계에서만 단일 권으로 함께 출판된 글 모음을 묘사하는 데 사용되었다."],[6,"Now, however, it applies to fields such as the visual arts and broadcast media.","그러나 이제 그것은 시각 예술과 방송 매체와 같은 분야에 적용된다."]],"w":"5번에서 처음에는 문학계에서만(only) 쓰였다고 해요. 6번에서 ‘이제’ 시각 예술과 방송 매체까지 넓어졌다고 했으니 처음부터 두 곳에서 쓰인 것이 아니에요.","c":"F"},"h":"a76185f795"},{"n":3,"t":"tf","q":"Directors hesitate to try unusual styles in anthology series because viewers might not return.","ko":"감독들은 시청자가 돌아오지 않을 수 있어서 선집 시리즈에서 독특한 스타일을 시도하기를 망설인다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"They can take greater risks because they know that viewers who do not care for one episode may come back for another one.","그들은 한 에피소드를 좋아하지 않는 시청자들이 다른 에피소드를 위해 돌아올 수 있다는 것을 알기 때문에 더 큰 위험을 감수할 수 있다."],[12,"As a result, directors can try out different storytelling and filming techniques in each episode, and they are free to experiment with unusual styles.","그 결과, 감독들은 각 에피소드에서 색다른 스토리텔링과 촬영 기법을 시도해 볼 수 있고, 독특한 스타일을 자유롭게 실험할 수 있다."]],"w":"11번에서 한 에피소드가 마음에 안 들어도 시청자가 다른 에피소드를 보러 돌아올 수 있다고 알기 때문에 더 큰 위험을 감수할 수 있어요. 12번에서 독특한 스타일을 자유롭게 실험한다고 해요. 망설이는 것이 아니에요.","c":"F"},"h":"241013137d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (a voyage to a literal star in space)","ko":"우주에 있는 실제 별로의 여행 (literal은 문자 그대로의)","opts":["실제의","상상 속의","거대한","차가운"],"word":"literal","r":{"a":"1) 실제의","ev":"2번 문장","s":[[2,"Each person might take a dramatically different approach depending on their interpretation of the topic, focusing alternately on a girl dreaming of pop stardom, a voyage to a literal star in space, or the discovery of a mysterious star-shaped object.","각 사람은 주제에 대한 자신의 해석에 따라 극적으로 다른 접근 방식을 취할 수 있는데, 팝 스타를 꿈꾸는 소녀, 우주에 있는 실제 별로의 여행, 또는 신비한 별 모양 물체의 발견에 번갈아 초점을 맞출 수 있다."]],"w":"2번에서 literal star in space는 팝 스타(pop star)와 달리 우주에 진짜로 있는 별이에요. 그래서 literal = 문자 그대로의, 실제의예요.","c":1},"h":"6a68e3c666"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If the diverse works created by the members of this group were brought together…)","ko":"이 그룹의 구성원들이 만든 다양한 작품들이 합쳐진다면…","opts":["비슷한","오래된","짧은","다양한"],"word":"diverse","r":{"a":"4) 다양한","ev":"2~3번 문장","s":[[2,"Each person might take a dramatically different approach depending on their interpretation of the topic, focusing alternately on a girl dreaming of pop stardom, a voyage to a literal star in space, or the discovery of a mysterious star-shaped object.","각 사람은 주제에 대한 자신의 해석에 따라 극적으로 다른 접근 방식을 취할 수 있는데, 팝 스타를 꿈꾸는 소녀, 우주에 있는 실제 별로의 여행, 또는 신비한 별 모양 물체의 발견에 번갈아 초점을 맞출 수 있다."],[3,"If the diverse works created by the members of this group were brought together into a collection, it would be called an anthology.","만약 이 그룹의 구성원들이 만든 다양한 작품들이 하나의 모음집으로 합쳐진다면, 그것은 선집이라고 불릴 것이다."]],"w":"2번에서 별이라는 같은 주제로도 소녀, 우주 여행, 별 모양 물체처럼 서로 다른 작품이 나와요. 그래서 3번의 diverse works는 ‘다양한 작품들’이에요.","c":4},"h":"4085a11d78"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nIn some cases, the episodes might be from different genres—one might be a comedy, the next a thriller, and so on.","ko":"밑줄 친 one이 가리키는 것은?","sko":"어떤 경우에는, 에피소드들이 다른 장르일 수도 있는데, 하나는 코미디, 다음은 스릴러 등등일 수 있다.","opts":["하나의 에피소드","하나의 장르","하나의 시리즈","한 명의 감독"],"r":{"a":"1) 하나의 에피소드","ev":"8번 문장","s":[[8,"In some cases, the episodes might be from different genres—one might be a comedy, the next a thriller, and so on.","어떤 경우에는, 에피소드들이 다른 장르일 수도 있는데, 하나는 코미디, 다음은 스릴러 등등일 수 있다."]],"w":"one might be a comedy, the next a thriller에서 one은 바로 앞의 the episodes(에피소드들) 중 하나를 가리켜요. 에피소드마다 장르가 다를 수 있다는 예시예요. 코미디나 스릴러는 에피소드의 장르이지 one이 가리키는 대상이 아니에요.","c":1,"k":"one = 하나의 에피소드"},"pron":"one","h":"0425aea064"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n“With such variety, an anthology series usually attracts a wide audience.”","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러한 다양성으로, 선집 시리즈는 보통 폭넓은 시청자를 끌어들인다.","opts":["그런 다양성 때문에, 선집 시리즈는 보통 시청자 수가 크게 줄어든다.","그런 다양성 때문에, 선집 시리즈는 보통 한 가지 취향의 시청자만 끌어들인다.","그런 다양성으로, 선집 시리즈는 보통 폭넓은 시청자를 끌어들인다.","그런 다양성이 없어서, 선집 시리즈는 한 장르만 다룬다."],"r":{"a":"3) 그런 다양성으로, 선집 시리즈는 보통 폭넓은 시청자를 끌어들인다.","ev":"8~9번 문장","s":[[8,"In some cases, the episodes might be from different genres—one might be a comedy, the next a thriller, and so on.","어떤 경우에는, 에피소드들이 다른 장르일 수도 있는데, 하나는 코미디, 다음은 스릴러 등등일 수 있다."],[9,"With such variety, an anthology series usually attracts a wide audience.","그러한 다양성으로, 선집 시리즈는 보통 폭넓은 시청자를 끌어들인다."]],"w":"attract는 ‘끌어들이다’, wide audience는 ‘폭넓은 시청자’예요. 8번의 장르가 다양하기 때문에 다양한 시청자를 끌어들인다는 뜻이에요.","c":3},"h":"b0ef0857f8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["‘선집’이라는 용어는 처음에 텔레비전 시리즈를 위해 쓰였다.","선집 시리즈의 모든 에피소드는 같은 이야기와 같은 등장인물을 다룬다.","감독들은 자유가 제한되어 선집 시리즈를 피한다.","텔레비전 선집 시리즈의 에피소드들은 공통된 주제로 연결된다."],"opts":["The term “anthology” was first used for television series.","Every episode of an anthology series tells the same story with the same characters.","Directors avoid anthology series because their freedom is limited.","The episodes of an anthology television series are connected by a common theme."],"r":{"a":"4) The episodes of an anthology television series are connected by a common theme.","ev":"7번 문장","s":[[7,"In media, one of the most interesting features of an anthology television series is that each episode presents a distinctive story and unique characters that are all connected by a common theme.","미디어에서, 텔레비전 선집 시리즈의 가장 흥미로운 특징 중 하나는 각 에피소드가 공통된 주제로 모두 연결된 독특한 이야기와 고유한 등장인물들을 제시한다는 것이다."]],"w":"7번에서 각 에피소드는 독특한 이야기와 고유한 등장인물을 보여 주지만 모두 공통된 주제로 연결된다고 해요. ①은 5번에서 처음에는 문학계에서만 쓰였고, ②는 에피소드마다 이야기가 다르며, ③은 10번에서 감독들이 창작 자유를 좋아한다고 해서 틀려요.","c":4},"h":"89ebf214ef"},{"n":9,"t":"sum","q":"Many directors like anthology series because they provide (A) freedom and allow directors to (B) with unusual styles.","ko":"많은 감독들은 선집 시리즈가 (A) 자유를 주고 독특한 스타일을 (B) 수 있게 해 주기 때문에 이를 좋아한다.","oko":["(A) 창의적인 / (B) 실험할","(A) 제한된 / (B) 실험할","(A) 창의적인 / (B) 숨길","(A) 제한된 / (B) 숨길","(A) 금전적인 / (B) 실험할"],"opts":["(A) creative / (B) experiment","(A) limited / (B) experiment","(A) creative / (B) hide","(A) limited / (B) hide","(A) financial / (B) experiment"],"r":{"a":"1) (A) creative / (B) experiment (A) 창의적인 / (B) 실험할","ev":"10번, 12번 문장","s":[[10,"Also, many directors like the creative freedom this type of series provides.","또한, 많은 감독은 이런 유형의 시리즈가 제공하는 창의적 자유를 좋아한다."],[12,"As a result, directors can try out different storytelling and filming techniques in each episode, and they are free to experiment with unusual styles.","그 결과, 감독들은 각 에피소드에서 색다른 스토리텔링과 촬영 기법을 시도해 볼 수 있고, 독특한 스타일을 자유롭게 실험할 수 있다."]],"w":"10번 문장에서 감독들은 이런 시리즈가 주는 창의적인(creative) 자유를 좋아한다고 해요. 12번 문장에서 감독들은 독특한 스타일을 자유롭게 실험할(experiment) 수 있다고 해요. 제한된 자유나 금전적인 자유는 본문에 없어요.","c":1},"h":"fee48c799f"},{"n":10,"t":"fill","q":"Let’s say a group of people decided to produce [A] exploring the [B] of stars.","ko":"한 무리의 사람들이 별이라는 [B]을(를) 탐구하는 [A]을(를) 제작하기로 했다고 가정해 보자.","bank":["mysterious","topic","unusual","distinctive","content","colorful"],"bko":{"mysterious":"신비한","topic":"주제","unusual":"특이한","distinctive":"독특한","content":"콘텐츠","colorful":"화려한"},"r":{"a":"[A] content (콘텐츠), [B] topic (주제)","ev":"1번 문장","s":[[1,"Let’s say a group of people decided to produce content exploring the topic of stars.","한 무리의 사람들이 별이라는 주제를 탐구하는 콘텐츠를 제작하기로 했다고 가정해 보자."]],"w":"1번 문장은 사람들이 별이라는 주제(topic)를 탐구하는 콘텐츠(content)를 제작하기로 했다고 가정하는 내용이에요. produce의 목적어와 the 뒤의 명사 자리라서 형용사(mysterious, unusual 등)는 들어갈 수 없어요.","c":null},"h":"18ddbb62b1"}]},{"u":4,"id":"ms4-04-3","no":3,"ko":"어둠 속에서도 세상을 꿰뚫어 보는 눈","items":[{"n":1,"t":"tf","q":"LiDAR measures how long each laser pulse takes to bounce back.","ko":"LiDAR는 각 레이저 펄스가 되돌아오는 데 걸리는 시간을 측정한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It does this by emitting rapid pulses of laser light and timing how long each pulse takes to bounce back.","그것은 레이저 빛의 빠른 펄스를 방출하고 각 펄스가 되돌아오는 데 걸리는 시간을 측정함으로써 이것을 수행한다."]],"w":"2번 문장에서 레이저 빛의 펄스를 쏘고 각 펄스가 되돌아오는 데 걸리는 시간을 잰다고 해요. 그대로 일치해요.","c":"T"},"h":"13cc6a18a9"},{"n":2,"t":"tf","q":"LiDAR sensors work well only in bright sunlight.","ko":"LiDAR 센서는 밝은 햇빛 아래에서만 잘 작동한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"LiDAR sensors operate as effectively in bright sunlight as in total darkness, and in large, cluttered, or constantly changing environments.","LiDAR 센서들은 완전한 어둠 속에서만큼이나 밝은 햇빛 아래에서도, 그리고 크고 어수선하거나 끊임없이 변화하는 환경에서도 효과적으로 작동한다."]],"w":"6번에서 LiDAR 센서는 완전한 어둠 속에서만큼이나 밝은 햇빛 아래에서도 효과적으로 작동한다고 해요. 햇빛에서만 잘 된다는 말은 틀려요.","c":"F"},"h":"301bc36448"},{"n":3,"t":"tf","q":"Airborne LiDAR can detect the shape of the ground even through leaf cover.","ko":"항공 LiDAR는 잎 덮개를 통과해서도 지면의 윤곽을 감지할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Airborne LiDAR maps landscapes from above, detecting contours through leaf cover and supporting practical work in forestry, flood-risk modeling, and archaeology, where hidden patterns can appear after the “noise” of plants is digitally removed.","항공 LiDAR는 상공에서 지형을 지도로 나타내며, 잎 덮개를 투과하여 윤곽을 감지하고, 임업, 홍수 위험 모델링, 고고학 분야의 실무를 지원하는데, 그 분야들에서는 식물의 ‘노이즈’가 디지털 방식으로 제거된 후 숨겨진 패턴이 드러날 수 있다."]],"w":"9번에서 항공 LiDAR가 상공에서 지형을 지도로 나타내며 잎 덮개를 통해 윤곽을 감지한다고 해요. 일치해요.","c":"T"},"h":"ed7933d6bf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…in large, cluttered, or constantly changing environments.)","ko":"크고, 어수선하거나, 끊임없이 변화하는 환경에서도…","opts":["텅 빈","어수선한","밝은","차가운"],"word":"cluttered","r":{"a":"2) 어수선한","ev":"6번 문장","s":[[6,"LiDAR sensors operate as effectively in bright sunlight as in total darkness, and in large, cluttered, or constantly changing environments.","LiDAR 센서들은 완전한 어둠 속에서만큼이나 밝은 햇빛 아래에서도, 그리고 크고 어수선하거나 끊임없이 변화하는 환경에서도 효과적으로 작동한다."]],"w":"6번에서 cluttered는 large(큰), constantly changing(끊임없이 변하는)과 나란히 나오는, 다루기 까다로운 환경이에요. 물건이 많이 널려 있어 정돈되지 않은 모습이라 cluttered = 어수선한이에요.","c":2},"h":"5ae9eeb349"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In recent years, LiDAR has also been deployed on autonomous vehicles…)","ko":"최근 몇 년 동안, LiDAR는 또한 자율 주행 차량에 배치되었다.","opts":["수리된","금지된","배치된","수출된"],"word":"deployed","r":{"a":"3) 배치된","ev":"10번 문장","s":[[10,"In recent years, LiDAR has also been deployed on autonomous vehicles to scan for objects and estimate distances in real time.","최근 몇 년 동안, LiDAR는 또한 물체를 탐색하고 실시간으로 거리를 추정하기 위해 자율 주행 차량에 배치되었다."]],"w":"10번에서 LiDAR를 자율 주행 차량에 달아 물체를 탐색하고 거리를 재요. 쓰이도록 자리 잡아 둔다는 뜻이라 deploy = 배치하다예요.","c":3},"h":"4887bd1e2f"},{"n":6,"t":"ref","q":"What does the underlined “their” refer to?\nPerformance can drop in heavy rain, fog, or snow because the laser pulses can scatter before reaching their target.","ko":"밑줄 친 their가 가리키는 것은?","sko":"레이저 펄스가 목표물에 도달하기 전에 흩어질 수 있기 때문에 폭우, 안개, 또는 눈 속에서는 성능이 떨어질 수 있다.","opts":["레이저 펄스들","폭우와 안개","연구자들","스마트폰 센서들"],"r":{"a":"1) 레이저 펄스들","ev":"13번 문장","s":[[13,"Performance can drop in heavy rain, fog, or snow because the laser pulses can scatter before reaching their target.","레이저 펄스가 목표물에 도달하기 전에 흩어질 수 있기 때문에 폭우, 안개, 또는 눈 속에서는 성능이 떨어질 수 있다."]],"w":"reaching의 주체는 바로 앞의 the laser pulses(레이저 펄스들)이고, their target은 그 펄스들이 도달하려는 목표물이에요. 그래서 their = 레이저 펄스들이에요.","c":1},"h":"23d8410846"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n“Still, LiDAR is not without drawbacks.”","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래도, LiDAR에 결점이 없는 것은 아니다.","opts":["그래도 LiDAR는 아무 결점도 없는 완벽한 기술이다.","그래도 LiDAR는 결점 때문에 더는 쓰이지 않는다.","그래도 LiDAR는 결점을 모두 해결했다.","그래도 LiDAR에 결점이 없는 것은 아니다."],"r":{"a":"4) 그래도 LiDAR에 결점이 없는 것은 아니다.","ev":"12번 문장","s":[[12,"Still, LiDAR is not without drawbacks.","여전히, LiDAR에 결점이 없는 것은 아니다."]],"w":"not without drawbacks는 ‘결점이 없지 않다’, 즉 ‘결점이 있다’는 이중 부정이에요. 12번 뒤 13~14번에서 실제로 약점이 나와요.","c":4},"h":"3c03c2f1ce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["LiDAR는 레이저가 발명되기 전에 만들어졌다.","LiDAR는 스마트폰에 쓰일 수 없다.","LiDAR는 지구 및 환경 과학과 밀접하게 관련되게 되었다.","LiDAR는 최근에서야 대기 연구에 쓰이기 시작했다."],"opts":["LiDAR was invented before lasers existed.","LiDAR cannot be used in smartphones.","LiDAR has become closely tied to earth and environmental sciences.","LiDAR was used for atmospheric research only recently."],"r":{"a":"3) LiDAR has become closely tied to earth and environmental sciences. (LiDAR는 지구 및 환경 과학과 밀접하게 관련되게 되었다.)","ev":"8번 문장","s":[[8,"Over time, it became closely tied to earth and environmental sciences because it is ideal for measuring terrain and vegetation.","시간이 지나면서, 그것은 지형과 식생을 측정하는 데 이상적이기 때문에 지구 및 환경 과학과 밀접하게 관련되었다."]],"w":"8번 문장에서 LiDAR는 지형과 식생을 측정하는 데 이상적이어서 지구 및 환경 과학과 밀접하게 관련되었다고 해요. 7번 문장에서 처음에는 목표물 추적과 대기 연구에 쓰였다고 했으니 '최근에서야' 쓰였다는 말은 틀려요. 레이저보다 먼저 만들어졌다는 말(4번)과 스마트폰에 쓸 수 없다는 말(11번)도 본문과 달라요.","c":3},"h":"35b2d15133"},{"n":9,"t":"sum","q":"LiDAR’s main strength is its (A) across (B) that challenge ordinary cameras.","ko":"일반 카메라를 애먹이는 (B) 전반에 걸친 (A), 이것이 LiDAR의 주요 강점이다.","oko":["(A) 신뢰성 / (B) 환경","(A) 약점 / (B) 환경","(A) 신뢰성 / (B) 가격","(A) 인기 / (B) 가격","(A) 인기 / (B) 환경"],"opts":["(A) reliability / (B) conditions","(A) weakness / (B) conditions","(A) reliability / (B) prices","(A) popularity / (B) prices","(A) popularity / (B) conditions"],"r":{"a":"1) (A) reliability / (B) conditions (A) 신뢰성 / (B) 환경","ev":"5번 문장","s":[[5,"Its main strength is its reliability across conditions that challenge ordinary cameras.","그것의 주요 강점은 일반 카메라를 애먹이는 조건 전반에 걸친 신뢰성이다."]],"w":"5번 문장에서 LiDAR의 주요 강점은 일반 카메라를 애먹이는 조건(conditions) 전반에 걸친 신뢰성(reliability)이라고 해요. 약점이나 인기, 가격에 대한 말은 이 문장에 나오지 않아요.","c":1},"h":"aa90d6f738"},{"n":10,"t":"fill","q":"As LiDAR becomes smaller and [A], researchers expect it to [B] smarter navigation, precise mapping, and 3D perception.","ko":"LiDAR가 더 작아지고 [A]해짐에 따라, 연구자들은 그것이 더 스마트한 내비게이션, 정밀한 지도 제작, 3차원 인식을 [B]하기를 기대한다.","bank":["cheaper","enable","huge","scan","estimate","track"],"bko":{"cheaper":"더 저렴한","enable":"가능하게 하다","huge":"방대한","scan":"탐색하다","estimate":"추정하다","track":"추적하다"},"r":{"a":"[A] cheaper, [B] enable","ev":"15번 문장","s":[[15,"As LiDAR becomes smaller and cheaper, researchers expect it to enable smarter navigation, precise mapping, and 3D perception.","LiDAR가 더 작아지고 저렴해짐에 따라, 연구자들은 그것이 더 스마트한 내비게이션, 정밀한 지도 제작, 그리고 3차원 인식을 가능하게 하기를 기대한다."]],"w":"15번에서 smaller and cheaper(더 작고 저렴해짐), expect it to enable(가능하게 하기를 기대한다)로 나와요. huge는 14번의 데이터양 설명이라 smaller와 어울리지 않고, scan·estimate·track은 뒤의 navigation, mapping, perception과 이어지는 동사로 맞지 않아요.","c":null},"h":"3c0ede19e9"}]},{"u":4,"id":"ms4-04-4","no":4,"ko":"Once Trapped, Now Wrapped","items":[{"n":1,"t":"tf","q":"Over 650,000 marine animals are killed by ghost gear each year.","ko":"매년 65만 마리 이상의 해양 동물이 유령 장비로 인해 죽임을 당한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Over 650,000 marine animals are killed by this form of pollution each year.","매년 65만 마리 이상의 해양 동물이 이러한 형태의 오염으로 인해 죽임을 당한다."]],"w":"2번에서 this form of pollution(유령 장비라는 오염의 한 형태)으로 해마다 65만 마리 이상의 해양 동물이 죽는다고 해요. 일치해요.","c":"T"},"h":"f0d82d7f62"},{"n":2,"t":"tf","q":"Bureo turns old nets into NetPlus at a facility in Argentina.","ko":"Bureo는 아르헨티나에 있는 시설에서 낡은 그물을 NetPlus로 바꾼다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"The processed materials are then transported to a facility in Chile.","가공된 재료들은 그다음에 칠레에 있는 시설로 운송된다."],[9,"There, they are transformed into NetPlus, the 100 percent recycled plastic that is used to make Bureo merchandise.","그곳에서, 그것들은 Bureo 상품을 만드는 데 사용되는 100% 재활용 플라스틱인 NetPlus로 변형된다."]],"w":"8번에서 가공된 재료는 칠레(Chile)에 있는 시설로 운송되고, 9번에서 거기서 NetPlus로 바뀐다고 해요. 아르헨티나가 아니에요.","c":"F"},"h":"9084c5026d"},{"n":3,"t":"tf","q":"Bureo was founded by three surfers.","ko":"Bureo는 세 명의 서퍼에 의해 설립되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Founded by three surfers—Ben Kneppers, David Stover, and Kevin Ahearn—Bureo produces skateboards, sunglasses, and clothing from recycled fishing gear.","세 명의 서퍼 Ben Kneppers, David Stover, Kevin Ahearn에 의해 설립된 Bureo는 재활용된 낚시 장비로 스케이트보드, 선글라스, 그리고 의류를 생산한다."]],"w":"6번에서 Bureo는 세 명의 서퍼 Ben Kneppers, David Stover, Kevin Ahearn에 의해 설립되었다고 해요. 일치해요.","c":"T"},"h":"d91c252070"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…local workers are employed to sort and sanitize them.)","ko":"현지 노동자들이 그것들을 분류하고 세척하기 위해 고용된다.","opts":["운반하다","세척하다","판매하다","폐기하다"],"word":"sanitize","r":{"a":"2) 세척하다","ev":"7번 문장","s":[[7,"The production process goes as follows: initially, the old nets are purchased directly from fishers in countries throughout Central and South America, and local workers are employed to sort and sanitize them.","생산 과정은 다음과 같은데, 처음에, 낡은 그물들은 중남미 전역의 국가들에 있는 어부들로부터 직접 구매되며, 현지 노동자들이 그것들을 분류하고 세척하기 위해 고용된다."]],"w":"7번에서 어부들에게서 산 낡은 그물을 분류(sort)하고 sanitize해요. 그 뒤 8번에서 가공된 재료(processed materials)로 운송되니, 그물을 깨끗이 처리하는 단계예요. sanitize = 세척하다.","c":2},"h":"8f53e4432e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…a company called Bureo has developed an innovative solution.)","ko":"Bureo라고 불리는 회사는 혁신적인 해결책을 개발했다.","opts":["오래된","위험한","혁신적인","불필요한"],"word":"innovative","r":{"a":"3) 혁신적인","ev":"5번 문장","s":[[5,"To help address this ecological crisis, a company called Bureo has developed an innovative solution.","이러한 생태학적 위기를 해결하는 것을 돕기 위해, Bureo라고 불리는 회사는 혁신적인 해결책을 개발했다."]],"w":"5번은 생태학적 위기를 해결하려고 Bureo가 새로 개발한 해결책이에요. 새로운 방법으로 문제를 푼다는 뜻이라 innovative = 혁신적인이에요.","c":3},"h":"97ca7129f3"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nAny sea creature that becomes caught in a discarded fishing net faces a slow and painful death.","ko":"밑줄 친 that이 가리키는 것은?","sko":"버려진 그물에 걸린 어떤 바다 생물이라도 느리고 고통스러운 죽음에 직면한다.","opts":["바다 생물","버려진 그물","느리고 고통스러운 죽음","유령 장비"],"r":{"a":"1) 바다 생물","ev":"4번 문장","s":[[4,"Any sea creature that becomes caught in a discarded fishing net faces a slow and painful death.","버려진 그물에 걸린 어떤 바다 생물이라도 느리고 고통스러운 죽음에 직면한다."]],"w":"that은 관계대명사로, 바로 앞의 Any sea creature(어떤 바다 생물)를 가리켜요. '버려진 그물에 걸리게 되는 바다 생물'이라는 뜻이에요. 그물에 걸리는 것은 그물이 아니라 바다 생물이에요.","c":1,"k":"that = 바다 생물"},"pron":"that","h":"4fd34eddc6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n“It goes without saying that many marine animals have been saved from mortal danger!”","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"많은 해양 동물이 치명적인 위험으로부터 구해졌다는 것은 말할 필요도 없다!","opts":["많은 해양 동물이 구조될 수 없다는 것은 말할 필요도 없다.","해양 동물을 구하는 일은 말로만 가능하다.","해양 동물이 치명적인 위험에 빠졌다는 이야기는 하지 않아도 된다.","많은 해양 동물이 치명적인 위험에서 구해졌다는 것은 말할 필요도 없다."],"r":{"a":"4) 많은 해양 동물이 치명적인 위험에서 구해졌다는 것은 말할 필요도 없다.","ev":"10~11번 문장","s":[[10,"Thanks to Bureo’s efforts, over 6,000 tonnes of abandoned fishing nets have been transformed into eco-friendly products since 2015.","Bureo의 노력 덕분에, 2015년 이후로 6,000톤 이상의 버려진 그물들이 친환경 제품으로 바뀌었다."],[11,"It goes without saying that many marine animals have been saved from mortal danger!","많은 해양 동물이 치명적인 위험으로부터 구해졌다는 것은 말할 필요도 없다!"]],"w":"It goes without saying that ~은 ‘~은 말할 필요도 없다’예요. have been saved는 ‘구해졌다’는 현재완료 수동이고, 10번에서 6,000톤이 넘는 그물이 친환경 제품이 되었으니 많은 동물이 구해졌다는 뜻이에요.","c":4},"h":"ac0289dbca"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Bureo는 중남미의 어부들에게 낡은 그물을 판매한다.","Bureo의 제품은 100% 재활용 플라스틱인 NetPlus로 만든다.","모든 유령 장비는 해양 동물에게 똑같이 해가 없다.","Bureo는 2015년 이후 600톤보다 적은 그물을 재활용했다."],"opts":["Bureo sells old nets to fishers in Central and South America.","Bureo’s merchandise is made from NetPlus, which is 100 percent recycled plastic.","All ghost gear is equally harmless to sea animals.","Bureo has recycled fewer than 600 tonnes of nets since 2015."],"r":{"a":"2) Bureo’s merchandise is made from NetPlus, which is 100 percent recycled plastic.","ev":"3번, 7번, 9번, 10번 문장","s":[[3,"Among various types of ghost gear, discarded fishing nets are particularly dangerous.","다양한 종류의 유령 장비 중에서, 버려진 그물은 특히 위험하다."],[7,"The production process goes as follows: initially, the old nets are purchased directly from fishers in countries throughout Central and South America, and local workers are employed to sort and sanitize them.","생산 과정은 다음과 같은데, 처음에, 낡은 그물들은 중남미 전역의 국가들에 있는 어부들로부터 직접 구매되며, 현지 노동자들이 그것들을 분류하고 세척하기 위해 고용된다."],[9,"There, they are transformed into NetPlus, the 100 percent recycled plastic that is used to make Bureo merchandise.","그곳에서, 그것들은 Bureo 상품을 만드는 데 사용되는 100% 재활용 플라스틱인 NetPlus로 변형된다."],[10,"Thanks to Bureo’s efforts, over 6,000 tonnes of abandoned fishing nets have been transformed into eco-friendly products since 2015.","Bureo의 노력 덕분에, 2015년 이후로 6,000톤 이상의 버려진 그물들이 친환경 제품으로 바뀌었다."]],"w":"9번에서 NetPlus는 Bureo 상품을 만드는 데 쓰이는 100% 재활용 플라스틱이라고 해요. ①은 7번에서 Bureo가 어부들에게서 그물을 사요. ③은 3번에서 버려진 그물이 특히 위험하다고 하고, ④는 10번에서 6,000톤이 넘는다고 해서 틀려요.","c":2},"h":"68c05d2e1f"},{"n":9,"t":"sum","q":"Bureo (A) discarded fishing nets from fishers and turns them into NetPlus, a recycled plastic used for (B) products.","ko":"Bureo는 어부들에게서 버려진 그물을 (A)하고 이를 재활용 플라스틱인 NetPlus로 바꿔 (B) 제품을 만든다.","oko":["(A) 판매 / (B) 해로운","(A) 소각 / (B) 친환경","(A) 구매 / (B) 해로운","(A) 판매 / (B) 친환경","(A) 구매 / (B) 친환경"],"opts":["(A) sells / (B) harmful","(A) burns / (B) eco-friendly","(A) buys / (B) harmful","(A) sells / (B) eco-friendly","(A) buys / (B) eco-friendly"],"r":{"a":"5) (A) buys / (B) eco-friendly","ev":"7번, 9번, 10번 문장","s":[[7,"The production process goes as follows: initially, the old nets are purchased directly from fishers in countries throughout Central and South America, and local workers are employed to sort and sanitize them.","생산 과정은 다음과 같은데, 처음에, 낡은 그물들은 중남미 전역의 국가들에 있는 어부들로부터 직접 구매되며, 현지 노동자들이 그것들을 분류하고 세척하기 위해 고용된다."],[9,"There, they are transformed into NetPlus, the 100 percent recycled plastic that is used to make Bureo merchandise.","그곳에서, 그것들은 Bureo 상품을 만드는 데 사용되는 100% 재활용 플라스틱인 NetPlus로 변형된다."],[10,"Thanks to Bureo’s efforts, over 6,000 tonnes of abandoned fishing nets have been transformed into eco-friendly products since 2015.","Bureo의 노력 덕분에, 2015년 이후로 6,000톤 이상의 버려진 그물들이 친환경 제품으로 바뀌었다."]],"w":"7번에서 낡은 그물은 어부들에게서 직접 구매(buy)되고, 9번에서 NetPlus로 변형되어 10번에서 친환경(eco-friendly) 제품이 돼요. 판매하거나 태워 없애거나 해로운 제품이라는 말은 글에 없어요.","c":5},"h":"2178b28390"},{"n":10,"t":"fill","q":"Among [A] types of ghost gear, discarded fishing nets are [B] dangerous.","ko":"[A] 종류의 유령 장비 중에서, 버려진 그물은 [B] 위험하다.","bank":["workers","various","facility","pollution","particularly","skateboards"],"bko":{"workers":"노동자들","various":"다양한","facility":"시설","pollution":"오염","particularly":"특히","skateboards":"스케이트보드들"},"r":{"a":"[A] various (다양한), [B] particularly (특히)","ev":"3번 문장","s":[[3,"Among various types of ghost gear, discarded fishing nets are particularly dangerous.","다양한 종류의 유령 장비 중에서, 버려진 그물은 특히 위험하다."]],"w":"3번 문장은 다양한(various) 종류의 유령 장비 중에서 버려진 그물이 특히(particularly) 위험하다는 내용이에요. types 앞에는 형용사가, dangerous 앞에는 부사가 와서 자리가 바뀌면 말이 되지 않아요.","c":null},"h":"052c56079c"}]},{"u":5,"id":"ms4-05-1","no":1,"ko":"웃는 게 웃는 게 아니야","items":[{"n":1,"t":"tf","q":"People with Chronic Laughter Syndrome laugh only when something funny happens.","ko":"만성 웃음 증후군 환자는 웃긴 일이 생길 때만 웃는다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Chronic Laughter Syndrome, medically referred to as Pseudobulbar Affect (PBA), is a neurological condition characterized by uncontrollable episodes of laughter without appropriate stimuli or context.","의학적으로 감정실금이라고 불리는 만성 웃음 증후군은 적절한 자극이나 맥락 없이 통제할 수 없는 웃음 발작이 특징인 신경학적 질환이다."]],"w":"3번 문장에서 이 병의 웃음은 적절한 자극이나 맥락이 없는데도 통제할 수 없이 터지는 발작이라고 해요. 웃긴 일이 있을 때만 웃는다는 말은 반대예요.","c":"F"},"h":"b4c0244230"},{"n":2,"t":"tf","q":"Patients may change rapidly between laughter and crying.","ko":"환자들은 웃음과 울음 사이를 빠르게 오갈 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"These episodes are often exaggerated in intensity and duration, with patients frequently reporting rapid transitions between laughter and crying.","이러한 발작은 종종 강도와 지속 시간이 과장되어 나타나며, 환자들은 웃음과 울음 사이의 급격한 전환을 자주 보고한다."]],"w":"4번 문장에서 환자들이 웃음과 울음 사이의 급격한 전환(rapid transitions)을 자주 보고한다고 해요.","c":"T"},"h":"4a2dc5f507"},{"n":3,"t":"tf","q":"Experts have found the exact cause of PBA.","ko":"전문가들은 PBA의 정확한 원인을 밝혀냈다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"While the exact cause of PBA is still unknown, experts believe the disorder represents a disruption in emotional regulation that stems from damage to the neural pathways between the cerebral cortex and cerebellum.","PBA의 정확한 원인은 아직 알려지지 않았지만, 전문가들은 이 장애가 대뇌 피질과 소뇌 사이의 신경 경로 손상에서 기인하는 감정 조절의 붕괴를 나타낸다고 믿는다."]],"w":"6번 문장에서 PBA의 정확한 원인은 아직 알려지지 않았다(still unknown)고 하고, 전문가들은 신경 경로 손상 때문이라고 '믿을' 뿐이에요.","c":"F"},"h":"5e048ef5c2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These episodes are often exaggerated in intensity and duration, ...)","ko":"이러한 발작은 종종 강도와 지속 시간이 과장되어 나타나며, ... (exaggerate는 과장하다)","opts":["사라진","예측된","과장된","줄어든"],"word":"exaggerated","r":{"a":"3) 과장된","ev":"4번 문장","s":[[4,"These episodes are often exaggerated in intensity and duration, with patients frequently reporting rapid transitions between laughter and crying.","이러한 발작은 종종 강도와 지속 시간이 과장되어 나타나며, 환자들은 웃음과 울음 사이의 급격한 전환을 자주 보고한다."]],"w":"4번 문장은 발작의 세기와 지속 시간이 실제보다 크게 나타난다는 내용이에요. exaggerate = 과장하다, exaggerated = 과장된.","c":3},"h":"ec11b8101e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (..., clinicians were able to prescribe a medication specifically designed to help manage the condition.)","ko":"... 임상의들은 이 질환을 관리하는 데 도움이 되도록 특별히 고안된 약물을 처방할 수 있게 되었다.","opts":["처방하다","발견하다","거부하다","광고하다"],"word":"prescribe","r":{"a":"1) 처방하다","ev":"9번 문장","s":[[9,"However, with the FDA approval of Nuedexta in 2010, clinicians were able to prescribe a medication specifically designed to help manage the condition.","그러나, 2010년 뉴덱스타가 FDA 승인을 받으면서, 임상의들은 이 질환을 관리하는 데 도움이 되도록 특별히 고안된 약물을 처방할 수 있게 되었다."]],"w":"9번 문장에서 의사들이 이 병을 위해 특별히 만든 약(a medication)을 환자에게 줄 수 있게 되었다는 뜻이에요. prescribe = 처방하다.","c":1},"h":"5fb434c787"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIndividuals experiencing the syndrome often face emotional distress and isolation, as they avoid social situations due to their condition.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이 증후군을 겪는 개인들은 자신의 상태로 인해 사회적 상황을 피하기 때문에 종종 정서적 고통과 고립에 직면한다.","opts":["이 증후군을 겪는 개인들","사회적 상황들","정서적 고통과 고립","치료 옵션들"],"r":{"a":"1) 이 증후군을 겪는 개인들","ev":"5번 문장","s":[[5,"Individuals experiencing the syndrome often face emotional distress and isolation, as they avoid social situations due to their condition.","이 증후군을 겪는 개인들은 자신의 상태로 인해 사회적 상황을 피하기 때문에 종종 정서적 고통과 고립에 직면한다."]],"w":"as they avoid social situations에서 they는 문장의 주어 Individuals experiencing the syndrome(이 증후군을 겪는 개인들)을 가리켜요. 사회적 상황을 피하는 것은 이 사람들이에요. 사회적 상황은 피함을 당하는 대상이라 they가 아니에요.","c":1,"k":"they = 이 증후군을 겪는 개인들"},"pron":"they","h":"af939c6166"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The saying “Laughter is the best medicine” doesn’t hold true for everyone.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"“웃음이 최고의 명약이다”라는 속담이 모든 사람에게 적용되는 것은 아니다.","opts":["웃음은 누구에게도 약이 되지 못한다.","웃음이 건강에 좋다는 것이 의학적으로 증명되었다.","모든 사람은 같은 방식으로 웃음에서 도움을 얻는다.","웃음이 최고의 약이라는 말이 모든 사람에게 맞는 것은 아니다."],"r":{"a":"4) 웃음이 최고의 약이라는 말이 모든 사람에게 맞는 것은 아니다.","ev":"1번 문장","s":[[1,"The saying “Laughter is the best medicine” doesn’t hold true for everyone.","“웃음이 최고의 명약이다”라는 속담이 모든 사람에게 적용되는 것은 아니다."]],"w":"doesn't hold true for everyone은 '모든 사람에게 들어맞지는 않는다'는 부분 부정이에요. 어떤 사람에게는 맞고 어떤 사람에게는 맞지 않는다는 뜻이라, '누구에게도' 아니라는 말과는 달라요.","c":4},"h":"15bc00b920"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["뉴덱스타는 2010년 이전부터 PBA 환자에게 쓸 수 있었다.","PBA 환자는 웃긴 상황에서만 웃는다.","PBA는 뇌졸중을 겪었거나 치매가 있는 환자에게 가장 흔하다.","의사들은 2010년 이후 PBA를 완전히 치료해 왔다."],"opts":["Nuedexta was available for PBA patients before 2010.","PBA patients laugh only in funny situations.","PBA is most common in patients who have had a stroke or have dementia.","Doctors have completely cured PBA since 2010."],"r":{"a":"3) PBA is most common in patients who have had a stroke or have dementia.","ev":"7번 문장","s":[[7,"The condition is most common in patients who have suffered a stroke or in those experiencing cognitive decline due to dementia.","이 질환은 뇌졸중을 겪은 환자나 치매로 인한 인지 기능 저하를 겪는 환자에게서 가장 흔하다."]],"w":"7번 문장에서 이 질환은 뇌졸중을 겪은 환자나 치매로 인지 기능이 떨어진 환자에게서 가장 흔하다고 해요. 뉴덱스타는 2010년에 승인되었고(9번), 약은 발작을 50퍼센트 줄였을 뿐 완전히 고친 것이 아니에요(10번).","c":3},"h":"00a900f2b6"},{"n":9,"t":"sum","q":"For people with PBA, laughter becomes a (A) rather than a pleasure, but a drug approved in 2010 has (B) their episodes.","ko":"PBA 환자에게 웃음은 즐거움이 아니라 (A)이(가) 되지만, 2010년에 승인된 약은 발작을 (B).","oko":["(A) 선물 / (B) 줄였다","(A) 선물 / (B) 늘렸다","(A) 문제 / (B) 늘렸다","(A) 문제 / (B) 일으켰다","(A) 문제 / (B) 줄였다"],"opts":["(A) gift / (B) reduced","(A) gift / (B) increased","(A) problem / (B) increased","(A) problem / (B) caused","(A) problem / (B) reduced"],"r":{"a":"5) (A) problem / (B) reduced","ev":"2·10번 문장","s":[[2,"For those with Chronic Laughter Syndrome, laughter can be a source of distress and social difficulty rather than healing.","만성 웃음 증후군을 앓는 사람들에게 웃음은 치유라기보다는 고통과 사회적 어려움의 원인이 될 수 있다."],[10,"This led to a reported 50 percent reduction in episodes, improving patients’ quality of life and social functioning.","이는 보고된 바에 따르면 발작을 50퍼센트 감소시켜 환자의 삶의 질과 사회적 기능을 향상시켰다."]],"w":"2번에서 웃음은 치유가 아니라 고통과 사회적 어려움의 원인이 된다고 하니 (A)는 problem이에요. 10번에서 약이 발작을 50퍼센트 줄였으니(reduction) (B)는 reduced예요.","c":5},"h":"2c83b20cb8"},{"n":10,"t":"fill","q":"In the past, treatment options for PBA were highly [A] due to its [B] of targeted therapies.","ko":"과거에는 표적 치료법의 [B] 때문에 PBA에 대한 치료 옵션이 매우 [A] 상태였다.","bank":["episodes","limited","medication","intensity","lack","clinicians"],"bko":{"episodes":"발작들","limited":"제한적인","medication":"약물","intensity":"강도","lack":"부재, 부족","clinicians":"임상의들"},"r":{"a":"[A] limited (제한적인), [B] lack (부재, 부족)","ev":"8번 문장","s":[[8,"In the past, treatment options for PBA were highly limited due to its lack of targeted therapies.","과거에는 표적 치료법이 부재하여 PBA에 대한 치료 옵션이 매우 제한적이었다."]],"w":"8번 문장은 과거에는 표적 치료법이 없어서(lack of targeted therapies) 치료 옵션이 매우 제한적이었다(highly limited)는 내용이에요. highly 뒤에는 형용사 limited가, its 뒤에는 명사 lack이 와서 자리가 바뀌면 말이 되지 않아요.","c":null},"h":"707e0c718e"}]},{"u":5,"id":"ms4-05-2","no":2,"ko":"피자가 친절하고 사장님이 맛있어요!","items":[{"n":1,"t":"tf","q":"Speakers are expected to be truthful and to stay relevant in conversation.","ko":"화자들은 대화에서 진실하고 관련성을 유지할 것으로 기대된다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Speakers are expected to provide appropriate amounts of information (Quantity), be truthful (Quality), stay relevant (Relation), and communicate clearly (Manner).","화자들은 적절한 양의 정보를 제공하고(Quantity), 진실하며(Quality), 관련성을 유지하고(Relation), 명확하게 의사소통할 것(Manner)으로 기대된다."]],"w":"2번 문장에서 화자들은 진실하고(Quality) 관련성을 유지할(Relation) 것으로 기대된다고 해요.","c":"T"},"h":"8fab87cf18"},{"n":2,"t":"tf","q":"Communication always fails when a conversational maxim is intentionally violated.","ko":"대화의 규율이 의도적으로 위반되면 의사소통은 항상 실패한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It may seem that conversation succeeds only when these maxims are followed, yet in everyday life communication often remains effective even when a maxim is intentionally violated.","대화는 이러한 규율들이 지켜질 때만 성공하는 것처럼 보일 수 있지만, 일상생활에서 의사소통은 규율이 의도적으로 위반될 때조차도 종종 효과적으로 이루어진다."]],"w":"4번 문장에서 일상생활의 의사소통은 규율이 의도적으로 위반될 때조차 종종 효과적으로 이루어진다고 해요. '항상 실패한다'는 반대예요.","c":"F"},"h":"1e14ef30e9"},{"n":3,"t":"tf","q":"In the fast-food example, the child infers the speaker’s intention.","ko":"패스트푸드 예에서 아이가 화자의 의도를 추론한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Both speakers share the intention of preventing the child from recognizing the word, and the listener infers this intention.","두 화자 모두 아이가 그 단어를 알아차리는 것을 막으려는 의도를 공유하고 있으며, 청자는 이 의도를 추론한다."]],"w":"9번 문장에서 의도를 추론하는 사람은 아이가 아니라 듣는 사람(the listener)이에요. 두 화자는 오히려 아이가 그 단어를 알아차리지 못하게 하려고 해요.","c":"F"},"h":"d43cf98b62"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (..., yet in everyday life communication often remains effective even when a maxim is intentionally violated.)","ko":"... 일상생활에서 의사소통은 규율이 의도적으로 위반될 때조차도 종종 효과적으로 이루어진다.","opts":["위반된","허락된","설명된","반복된"],"word":"violated","r":{"a":"1) 위반된","ev":"4번 문장","s":[[4,"It may seem that conversation succeeds only when these maxims are followed, yet in everyday life communication often remains effective even when a maxim is intentionally violated.","대화는 이러한 규율들이 지켜질 때만 성공하는 것처럼 보일 수 있지만, 일상생활에서 의사소통은 규율이 의도적으로 위반될 때조차도 종종 효과적으로 이루어진다."]],"w":"yet 뒤에서 규율을 일부러 '어긴' 경우에도 의사소통이 된다고 말해요. violate = 위반하다, violated = 위반된.","c":1},"h":"53c7eb2f5e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Conversation, therefore, is not a rigid system that rewards rule-following alone, ...)","ko":"그러므로 대화는 규칙 준수만을 보상하는 경직된 체계가 아니라, ...","opts":["융통성 있는","복잡한","경직된","새로운"],"word":"rigid","r":{"a":"3) 경직된","ev":"16번 문장","s":[[16,"Conversation, therefore, is not a rigid system that rewards rule-following alone, but a cooperative activity grounded in shared context and interpretation.","그러므로 대화는 규칙 준수만을 보상하는 경직된 체계가 아니라, 공유된 맥락과 해석에 기반을 둔 협력적인 활동이다."]],"w":"not a rigid system but a cooperative activity에서 rigid는 협력적이고 유연한 활동과 반대되는 '딱딱하고 경직된'이라는 뜻이에요.","c":3},"h":"c27dd8a030"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nA similar pattern appears when a wife, just waking up, asks, “What time is it?” and her husband replies, “Your alarm hasn’t gone off yet.”","ko":"밑줄 친 her가 가리키는 것은?","sko":"아내가 막 잠에서 깨어 “지금 몇 시예요?”라고 묻고 남편이 “당신 알람이 아직 울리지 않았어.”라고 대답할 때도 비슷한 양상이 나타난다.","opts":["남편","아내","어린아이","언어학자"],"r":{"a":"2) 아내","ev":"10번 문장","s":[[10,"A similar pattern appears when a wife, just waking up, asks, “What time is it?” and her husband replies, “Your alarm hasn’t gone off yet.”","아내가 막 잠에서 깨어 “지금 몇 시예요?”라고 묻고 남편이 “당신 알람이 아직 울리지 않았어.”라고 대답할 때도 비슷한 양상이 나타난다."]],"w":"her husband에서 her는 같은 문장 앞쪽의 a wife(아내)를 가리켜요. 막 잠에서 깨어 시간을 물은 사람이 아내이고, 그 아내의 남편이 대답하는 상황이에요.","c":2,"k":"her = 아내"},"pron":"her","h":"98bc5a2853"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In such cases, meaning does not arise from strict obedience to conversational rules.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러한 경우들에서, 의미는 대화 규칙에 대한 엄격한 준수에서 생겨나지 않는다.","opts":["그러한 경우에 의미는 대화 규칙을 엄격히 따를 때 생겨난다.","그러한 경우에 대화 규칙은 의미를 이해하는 데 가장 중요하다.","그러한 경우에 의미는 대화 규칙을 가르치는 데서 생겨난다.","그러한 경우에 의미는 대화 규칙을 엄격히 지키는 데서 비롯되지 않는다."],"r":{"a":"4) 그러한 경우에 의미는 대화 규칙을 엄격히 지키는 데서 비롯되지 않는다.","ev":"14번 문장","s":[[14,"In such cases, meaning does not arise from strict obedience to conversational rules.","그러한 경우들에서, 의미는 대화 규칙에 대한 엄격한 준수에서 생겨나지 않는다."]],"w":"does not arise from은 '~에서 생겨나지 않는다'예요. strict obedience to rules(규칙의 엄격한 준수)가 의미의 원천이 아니라는 뜻이에요.","c":4},"h":"fd59353057"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Grice의 규율은 규율이 위반될 때마다 왜 의사소통이 무너지는지 설명한다.","남편의 대답은 아내에게 아직 이른 아침이라는 것을 알려 준다.","아내가 시간을 추정하려면 정확한 시간을 알아야 한다.","단어를 철자로 말하는 것은 명확하고 간결한 말하기 방식이다."],"opts":["Grice’s maxims explain why communication breaks down whenever they are violated.","The husband’s reply tells the wife that it is still early in the morning.","The wife needs to know the exact time to estimate it.","Spelling out a word is a clear and concise way of speaking."],"r":{"a":"2) The husband’s reply tells the wife that it is still early in the morning.","ev":"12~13번 문장","s":[[12,"However, the husband is actively signaling that it is still early in the morning.","하지만, 남편은 아직 아침 이른 시간이라는 신호를 적극적으로 보내고 있는 것이다."],[13,"Even without knowing the exact time, the wife can infer a reasonable estimate based on their shared knowledge of when her alarm usually rings.","정확한 시간을 알지 못하더라도, 아내는 그녀의 알람이 보통 언제 울리는지에 대한 그들의 공유된 지식에 근거하여 합리적인 추정을 추론할 수 있다."]],"w":"12번에서 남편은 아직 아침 이른 시간이라는 신호를 보내고 있어요. 13번에서 아내는 정확한 시간을 몰라도 추정할 수 있고(③ 오답), 철자로 말한 대답은 명확하지도 간결하지도 않으며(7번, ④ 오답), 규율이 위반되어도 의사소통은 단절되지 않아요(8번, ① 오답).","c":2},"h":"9b6b22fdd7"},{"n":9,"t":"sum","q":"The reply is (A) and unclear, so it seems to violate a maxim. (B), communication does not fail.","ko":"그 대답은 (A) 불명확해서 대화의 규율을 위반하는 것처럼 보인다. (B) 의사소통은 실패하지 않는다.","oko":["(A) 비효율적이고 / (B) 그럼에도 불구하고","(A) 비효율적이고 / (B) 그러므로","(A) 효율적이고 / (B) 그럼에도 불구하고","(A) 효율적이고 / (B) 그러므로","(A) 정중하고 / (B) 그럼에도 불구하고"],"opts":["(A) inefficient / (B) Nevertheless","(A) inefficient / (B) Therefore","(A) efficient / (B) Nevertheless","(A) efficient / (B) Therefore","(A) polite / (B) Nevertheless"],"r":{"a":"1) (A) inefficient / (B) Nevertheless (A) 비효율적이고 / (B) 그럼에도 불구하고","ev":"7~8번 문장","s":[[7,"The inefficient reply is neither clear nor concise, and it therefore seems to violate a conversational maxim.","그 비효율적인 대답은 명확하지도 간결하지도 않으며, 따라서 대화의 규율을 위반하는 것처럼 보인다."],[8,"Nevertheless, communication does not break down.","그럼에도 불구하고, 의사소통은 단절되지 않는다."]],"w":"7번 문장에서 철자로 말한 대답은 비효율적이고(inefficient) 명확하지도 간결하지도 않아서 규율을 위반하는 것처럼 보여요. 8번 문장은 Nevertheless(그럼에도 불구하고)로 시작해서 의사소통은 단절되지 않는다고 해요. Therefore(그러므로)는 앞뒤 내용이 반대라서 어울리지 않아요.","c":1},"h":"d979709592"},{"n":10,"t":"fill","q":"Linguist H. P. Grice [A] these expectations into four conversational maxims, which describe how [B] communication works.","ko":"언어학자 H. P. Grice는 이러한 기대들을 네 가지 대화의 규율(격률)로 [A]. 이 규율들은 [B] 의사소통이 어떻게 작동하는지를 설명한다.","bank":["nearby","cooperative","spelling","organized","young","restaurant"],"bko":{"nearby":"근처의","cooperative":"협력적인","spelling":"철자 말하기","organized":"정리했다(organize의 과거)","young":"어린","restaurant":"식당"},"r":{"a":"[A] organized (정리했다(organize의 과거)), [B] cooperative (협력적인)","ev":"3번 문장","s":[[3,"Linguist H. P. Grice organized these expectations into four conversational maxims, which describe how cooperative communication works.","언어학자 H. P. Grice는 이러한 기대들을 네 가지 대화의 규율(격률)로 정리했는데, 이는 협력적인 의사소통이 어떻게 작동하는지를 설명한다."]],"w":"3번 문장은 Grice가 이러한 기대들을 네 가지 대화의 규율로 정리했다(organized)는 내용이고, 이 규율들은 협력적인(cooperative) 의사소통이 어떻게 작동하는지 설명해요. 동사 자리에는 organized가, communication 앞에는 형용사 cooperative가 와요.","c":null},"h":"e5ac70b0e0"}]},{"u":5,"id":"ms4-05-3","no":3,"ko":"터치도 하이, 테크도 하이~","items":[{"n":1,"t":"tf","q":"In a high-touch classroom, teachers and students interact personally.","ko":"하이터치 교실에서는 교사와 학생이 개인적으로 상호작용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This exemplifies a high-touch learning environment—one that emphasizes personal interaction and emotional engagement between students and teachers.","이것은 하이터치(high-touch) 학습 환경의 전형적인 예인데, 이는 학생과 교사 간의 개인적인 상호작용과 정서적 관여를 강조하는 환경이다."]],"w":"3번 문장에서 하이터치 학습 환경은 학생과 교사 사이의 개인적인 상호작용(personal interaction)과 정서적 관여를 강조한다고 해요.","c":"T"},"h":"0283e062fe"},{"n":2,"t":"tf","q":"High-tech education focuses on face-to-face communication.","ko":"하이테크 교육은 대면 의사소통에 초점을 맞춘다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"While high tech prioritizes efficiency through the use of digital platforms that provide easy and instant access to information, an excessive reliance on devices may result in social isolation and decreased engagement for students.","하이테크는 정보에 쉽고 즉각적인 접근을 제공하는 디지털 플랫폼의 사용을 통해 효율성을 우선시하지만, 기기에 대한 과도한 의존은 학생들에게 사회적 고립과 참여도 감소를 초래할 수 있다."],[6,"On the other hand, high-touch classrooms counteract this by immersing students in hands-on activities that promote collaboration and face-to-face communication.","반면에, 하이터치 교실은 협력과 대면 의사소통을 촉진하는 체험 활동에 학생들을 몰입시킴으로써 이에 대응한다."]],"w":"5번 문장에서 하이테크는 디지털 플랫폼을 통한 효율성을 우선시해요. 대면(face-to-face) 의사소통을 촉진하는 쪽은 6번의 하이터치 교실이에요.","c":"F"},"h":"398137ba55"},{"n":3,"t":"tf","q":"Technology teaches basic skills while students lead the class discussions.","ko":"기술이 기초 기술을 가르치는 동안 학생들이 학급 토론을 이끈다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"This would allow students to learn basic skills through technology, while freeing up teachers to focus on guiding problem-solving activities and leading classroom discussions.","이것은 학생들이 기술을 통해 기초 기술을 배우게 하는 한편, 교사들이 문제 해결 활동을 지도하고 학급 토론을 주도하는 데 집중할 수 있도록 시간을 마련해 줄 것이다."]],"w":"9번 문장에서 학급 토론을 이끄는 쪽은 학생이 아니라 교사예요. 기술이 기초 기술 학습을 돕는 동안 교사들이 문제 해결 활동 지도와 토론 주도에 집중해요.","c":"F"},"h":"aabac220eb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (..., high-touch classrooms counteract this by immersing students in hands-on activities...)","ko":"... 하이터치 교실은 체험 활동에 학생들을 몰입시킴으로써 이에 대응한다.","opts":["따라 한다","대응한다","무시한다","악화시킨다"],"word":"counteract","r":{"a":"2) 대응한다","ev":"6번 문장","s":[[6,"On the other hand, high-touch classrooms counteract this by immersing students in hands-on activities that promote collaboration and face-to-face communication.","반면에, 하이터치 교실은 협력과 대면 의사소통을 촉진하는 체험 활동에 학생들을 몰입시킴으로써 이에 대응한다."]],"w":"this는 5번의 문제(고립과 참여도 감소)예요. 하이터치 교실은 그 문제에 맞서 해결하려는 활동을 하니 counteract = 대응하다, 맞서다예요.","c":2},"h":"25281b2713"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A high-touch, high-tech classroom could also offer a more personalized and comprehensive educational experience, ...)","ko":"하이터치 및 하이테크 교실은 또한 더 개인화되고 포괄적인 교육 경험을 제공할 수 있다.","opts":["제한된","일시적인","포괄적인","값비싼"],"word":"comprehensive","r":{"a":"3) 포괄적인","ev":"10번 문장","s":[[10,"A high-touch, high-tech classroom could also offer a more personalized and comprehensive educational experience, with technology adapting to each student’s progress and teachers responding to emotional needs.","하이터치 및 하이테크 교실은 또한 기술이 각 학생의 진척도에 적응하고 교사가 정서적 필요에 부응함으로써, 더 개인화되고 포괄적인 교육 경험을 제공할 수 있다."]],"w":"personalized(개인화된)와 함께 쓰여 여러 면을 두루 아우르는 교육 경험을 뜻해요. comprehensive = 포괄적인.","c":3},"h":"c593194cf1"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nIn these classrooms, teachers play a crucial role in fostering interpersonal connections, using real-time interactions to gauge student understanding and adjust their instruction accordingly.","ko":"밑줄 친 their가 가리키는 것은?","sko":"이러한 교실에서, 교사는 대인 관계를 조성하는 데 중요한 역할을 하며, 학생의 이해도를 측정하기 위해 실시간 상호작용을 사용하고 그에 따라 수업을 조정한다.","opts":["교사들","학생들","상호작용들","교실들"],"r":{"a":"1) 교사들","ev":"7번 문장","s":[[7,"In these classrooms, teachers play a crucial role in fostering interpersonal connections, using real-time interactions to gauge student understanding and adjust their instruction accordingly.","이러한 교실에서, 교사는 대인 관계를 조성하는 데 중요한 역할을 하며, 학생의 이해도를 측정하기 위해 실시간 상호작용을 사용하고 그에 따라 수업을 조정한다."]],"w":"adjust their instruction에서 their는 이 문장의 주어 teachers(교사들)를 가리켜요. 교사가 실시간 상호작용으로 학생의 이해도를 파악하고, 자신들의 수업(instruction)을 그에 맞게 조정한다는 뜻이에요. 학생의 이해도는 교사가 측정하는 대상이지 수업을 조정하는 주체가 아니에요.","c":1,"k":"their = 교사들"},"pron":"their","h":"52d12fc483"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"According to experts, the ideal educational approach would be to combine high-touch and high-tech strategies.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"전문가들에 따르면, 이상적인 교육 접근 방식은 하이터치와 하이테크 전략을 결합하는 것이다.","opts":["전문가들은 하이터치 전략만 쓰는 것이 이상적이라고 말한다.","전문가들은 하이테크 전략을 하이터치로 바꿔야 한다고 말한다.","전문가들은 두 전략 중 비용이 낮은 쪽을 고르라고 말한다.","전문가들은 하이터치와 하이테크를 결합하는 것이 이상적이라고 말한다."],"r":{"a":"4) 전문가들은 하이터치와 하이테크를 결합하는 것이 이상적이라고 말한다.","ev":"8번 문장","s":[[8,"According to experts, the ideal educational approach would be to combine high-touch and high-tech strategies.","전문가들에 따르면, 이상적인 교육 접근 방식은 하이터치와 하이테크 전략을 결합하는 것이다."]],"w":"combine A and B는 'A와 B를 결합하다'예요. 한쪽만 쓰거나 한쪽을 다른 쪽으로 바꾸는 것이 아니라 둘을 합치는 방식이 이상적이라는 뜻이에요.","c":4},"h":"2cfcf792c8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["교사가 사고를 자극하는 질문을 하면 학생들은 흥미를 잃는다.","하이터치 교실은 주로 디지털 기기에 의존한다.","교사는 교실을 돌아다니며 사고를 자극하는 질문으로 학생들의 생각에 이의를 제기한다.","하이테크 플랫폼은 하이터치보다 개인적 상호작용을 더 쉽게 만든다."],"opts":["Students lose interest when teachers ask thought-provoking questions.","High-touch classrooms depend mainly on digital devices.","The teacher moves around the classroom and challenges students’ assumptions with thought-provoking questions.","High-tech platforms make personal interaction easier than high touch."],"r":{"a":"3) The teacher moves around the classroom and challenges students’ assumptions with thought-provoking questions. (교사는 교실을 돌아다니며 사고를 자극하는 질문으로 학생들의 생각에 이의를 제기한다.)","ev":"2번 문장","s":[[2,"Meanwhile, the teacher moves around the classroom, challenging students’ assumptions with thought-provoking questions.","한편, 교사는 교실을 돌아다니며, 사고를 자극하는 질문으로 학생들의 생각에 이의를 제기한다."]],"w":"2번 문장에서 교사는 교실을 돌아다니며(moves around) 사고를 자극하는 질문으로 학생들의 생각에 이의를 제기한다(challenging)고 해요. 질문 때문에 학생들이 흥미를 잃는다는 말은 본문에 없고, 하이터치 교실은 기기가 아니라 개인적 상호작용을 강조해요.","c":3},"h":"880dcd47e6"},{"n":9,"t":"sum","q":"In a high-touch classroom, students do active science (A) and work together in (B).","ko":"하이터치 교실에서 학생들은 활발한 과학 (A)을(를) 하고 (B)에서 함께 작업한다.","oko":["(A) 실험 / (B) 조","(A) 실험 / (B) 기기","(A) 시험 / (B) 조","(A) 시험 / (B) 기기","(A) 강의 / (B) 조"],"opts":["(A) experiments / (B) groups","(A) experiments / (B) devices","(A) tests / (B) groups","(A) tests / (B) devices","(A) lectures / (B) groups"],"r":{"a":"1) (A) experiments / (B) groups (A) 실험 / (B) 조","ev":"1번 문장","s":[[1,"Picture this: a classroom filled with active science experiments, students working together in groups on new projects.","활발한 과학 실험과 새로운 프로젝트에 대해 조별로 함께 작업하는 학생들로 가득 찬 교실을 상상해 보라."]],"w":"1번 문장은 활발한 과학 실험(experiments)으로 가득 찬 교실에서 학생들이 조별로(in groups) 함께 작업하는 모습을 그려요. 시험이나 강의, 기기를 중심으로 한다는 말은 본문에 없어요.","c":1},"h":"1439661b8e"},{"n":10,"t":"fill","q":"The [A] of high touch is often [B] with high-tech education.","ko":"하이터치의 [A]은(는) 종종 하이테크 교육과 [B].","bank":["strategies","compared","devices","concept","assumptions","platforms"],"bko":{"strategies":"전략들","compared":"비교된다(compare의 과거분사)","devices":"기기들","concept":"개념","assumptions":"생각, 가정들","platforms":"플랫폼들"},"r":{"a":"[A] concept (개념), [B] compared (비교된다(compare의 과거분사))","ev":"4번 문장","s":[[4,"The concept of high touch is often compared with high-tech education.","하이터치의 개념은 종종 하이테크(high-tech) 교육과 비교된다."]],"w":"4번 문장은 하이터치의 개념(concept)이 종종 하이테크 교육과 비교된다(is compared)는 내용이에요. 주어 The ... of high touch 뒤의 동사가 is라서 주어는 단수 명사 concept이어야 하고, is often 뒤에는 과거분사 compared가 와요.","c":null},"h":"956d19e2ed"}]},{"u":5,"id":"ms4-05-4","no":4,"ko":"From Runway to Ruin","items":[{"n":1,"t":"tf","q":"Models in the Atacama Desert fashion show wear brand-new clothes made in Chile.","ko":"아타카마 사막 패션쇼의 모델들은 칠레에서 만든 새 옷을 입는다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Models wearing discarded clothes from Europe, Asia, and North America parade through piles of trash.","유럽, 아시아, 북미에서 버려진 옷을 입은 모델들이 쓰레기 더미 사이를 행진한다."]],"w":"2번 문장에서 모델들은 유럽, 아시아, 북미에서 버려진 옷(discarded clothes)을 입고 쓰레기 더미 사이를 행진해요.","c":"F"},"h":"f39e420bcf"},{"n":2,"t":"tf","q":"Estimates say that about 39,000 tons of clothing are added to the desert every year.","ko":"추정치에 따르면 매년 약 39,000톤의 의류가 사막에 추가된다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"However, estimates suggest that around 39,000 tons are added annually, forming rubbish mounds so massive that they can be seen from space.","그러나 추정치에 따르면 매년 약 39,000톤이 추가되어, 우주에서도 볼 수 있을 만큼 거대한 쓰레기 언덕을 형성한다고 한다."]],"w":"5번 문장에서 추정치로는 매년 약 39,000톤이 추가된다(around 39,000 tons are added annually)고 해요.","c":"T"},"h":"f7d5449ee9"},{"n":3,"t":"tf","q":"The Chilean government’s efforts will stop similar sites from appearing around the world.","ko":"칠레 정부의 노력은 전 세계에 비슷한 장소가 생기는 것을 막을 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Although the Chilean government is taking steps to clean up the Atacama Desert, its efforts will have no impact on similar sites sprouting up around the planet.","비록 칠레 정부가 아타카마 사막을 정화하기 위한 조치를 취하고 있지만, 그 노력은 지구 곳곳에 생겨나고 있는 유사한 장소들에는 아무런 영향을 미치지 못할 것이다."]],"w":"12번 문장에서 정부의 노력은 지구 곳곳에 생겨나는 비슷한 장소에는 아무런 영향을 미치지 못할 것(will have no impact)이라고 해요.","c":"F"},"h":"e903a631cf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (..., illegally dumped in the desert when they cannot be resold.)","ko":"... 다시 팔리지 않으면 사막에 불법으로 투기된다.","opts":["수출된","투기된, 버려진","판매된","보관된"],"word":"dumped","r":{"a":"2) 투기된, 버려진","ev":"7번 문장","s":[[7,"Out-of-style garments are imported into Chile and then illegally dumped in the desert when they cannot be resold.","유행이 지난 의류들은 칠레로 수입된 후 다시 팔리지 않으면 사막에 불법으로 투기된다."]],"w":"옷이 다시 팔릴 수 없을 때 사막에 불법으로 처리되는 상황이에요. dump = 버리다, dumped = 버려진, 투기된.","c":2},"h":"b9905106f4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Toxic chemicals from polyester and other synthetic materials seep into the soil and groundwater.)","ko":"폴리에스터와 다른 합성 소재에서 나온 독성 화학 물질이 토양과 지하수로 스며든다.","opts":["스며든다","증발한다","쌓인다","얼어붙는다"],"word":"seep","r":{"a":"1) 스며든다","ev":"9번 문장","s":[[9,"Toxic chemicals from polyester and other synthetic materials seep into the soil and groundwater.","폴리에스터와 다른 합성 소재에서 나온 독성 화학 물질이 토양과 지하수로 스며든다."]],"w":"독성 화학 물질이 토양과 지하수 속으로 'seep into', 즉 서서히 흘러 들어가는 뜻이에요. seep = 스며들다.","c":1},"h":"8389a67bc8"},{
