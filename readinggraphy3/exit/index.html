지판을 설치하려고 노력하고 있다."],[4,"They cost about 25% more than land panels.","그것들은 육지 전지판들보다 약 25퍼센트 더 비용이 든다."],[11,"The scientists say it’s important to study how these panels will affect each lake’s water.","과학자들은 이 전지판들이 각 호수의 물에 어떻게 영향을 미칠지 연구하는 것이 중요하다고 말한다."]]},"h":"f3dc4a3a98"},{"n":9,"t":"sum","q":"Floating solar panels can also save water by (A) (B) from lakes.","ko":"물 위에 뜨는 태양 전지판은 호수의 (B)을(를) (A) 물을 절약할 수 있다.","opts":["(A) adding / (B) electricity","(A) reducing / (B) evaporation","(A) reducing / (B) electricity","(A) adding / (B) evaporation","(A) adding / (B) plants"],"oko":["(A) 더함으로써 / (B) 전기","(A) 줄임으로써 / (B) 증발","(A) 줄임으로써 / (B) 전기","(A) 더함으로써 / (B) 증발","(A) 더함으로써 / (B) 식물"],"r":{"a":"2) (A) reducing / (B) evaporation ((A) 줄임으로써 / (B) 증발)","w":"7번에서 물 위에 뜨는 태양 전지판은 호수의 증발(evaporation)을 줄임(reducing)으로써 물을 절약할 수 있다고 함.","c":2,"ev":"7번 문장","s":[[7,"They can also save water by reducing evaporation from lakes.","그것들은 또한 호수의 증발을 줄임으로써 물을 절약할 수 있다."]]},"h":"18b42fd192"},{"n":10,"t":"fill","q":"If 30% of lakes are covered with floating solar panels, they could make [A] times as much energy as current solar power and save the water that [B] people would use in a year.","ko":"호수의 30%가 물 위에 뜨는 태양 전지판으로 덮이면, 현재 태양열 에너지의 [A]배 에너지를 만들고 [B]명이 일 년 동안 사용할 물을 절약할 수 있다.","bank":["10","300000","25","30","18","100"],"bko":{"10":"10(배)","300000":"30만(명)","25":"25(퍼센트)","30":"30(퍼센트)","18":"18","100":"100"},"r":{"a":"[A] 10, [B] 300000","w":"6번: 호수의 30%에 설치하면 현재 모든 태양열의 10배 에너지, 8번: 30%만 덮어도 300,000명이 일 년에 쓸 물을 절약. 25는 비용이 더 드는 비율(4번), 30은 이미 문장에 있는 호수 비율.","c":null,"ev":"6, 8번 문장","s":[[6,"By putting these solar panels on 30% of lakes, they could make 10 times as much energy as all current solar power.","호수의 30퍼센트에 이 태양 전지판들을 설치함으로써, 그것들은 현재의 모든 태양열 에너지보다 10배 더 많은 에너지를 만들어 낼 수 있다."],[8,"Covering just 30% of lakes with solar panels could save as much water as 300,000 people would use in a year.","고작 호수의 30퍼센트만 태양 전지판으로 덮어도 30만 명의 사람들이 일 년에 사용할 만큼의 물을 절약할 수 있다."]]},"h":"ee8192fccf"}]},{"u":11,"id":"rg3-11-1","no":1,"ko":"2,000년 넘게 버티는 로마 콘크리트의 비밀","items":[{"n":1,"t":"tf","q":"Roman concrete buildings have survived for over 2,000 years.","ko":"로마의 콘크리트 건물들은 2,000년 이상 견뎌 왔다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장 Their concrete buildings have survived for over 2,000 years와 같은 내용. survive는 '살아남다, 견뎌 내다'.","c":"T","ev":"2번 문장","s":[[2,"Their concrete buildings have survived for over 2,000 years.","그들의 콘크리트 건물들은 2,000년 이상 견뎌 왔다."]]},"h":"939fc8b83e"},{"n":2,"t":"tf","q":"Researchers have never tried to figure out the mystery of Roman concrete.","ko":"연구원들은 로마 콘크리트의 미스터리를 알아내려고 한 적이 한 번도 없다.","r":{"a":"F (본문과 다른 내용)","w":"3번에서 연구원들은 수년 동안 그 미스터리를 알아내려고 노력해 왔다(have tried). never(한 번도 ~않다)가 들어간 반대 진술이라 F.","c":"F","ev":"3번 문장","s":[[3,"For many years, researchers have tried to figure out the mystery of strong Roman concrete.","수년 동안, 연구원들은 튼튼한 로마 콘크리트의 미스터리를 알아내기 위해 노력해 왔다."]]},"h":"2bee2c33a5"},{"n":3,"t":"tf","q":"Researchers found small white chunks called lime clasts in Roman concrete.","ko":"연구원들은 로마 콘크리트에서 석회 쇄설암이라고 불리는 작고 하얀 덩어리들을 발견했다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장과 같은 내용. noticed(알아차렸다)를 found(발견했다)로 바꿔 쓴 것.","c":"T","ev":"6번 문장","s":[[6,"Researchers noticed small white chunks called “lime clasts” in Roman concrete.","연구원들은 로마 콘크리트에서 ‘석회 쇄설암’이라고 불리는 작고 하얀 덩어리들을 발견했다."]]},"h":"10e5ed175d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The ancient Romans were great engineers and builders, so they created many impressive structures.)","ko":"고대 로마인들은 훌륭한 기술자이자 건축가여서 ( ) 건축물들을 많이 만들었다.","opts":["지루한","위험한","인상적인","평범한"],"word":"impressive","r":{"a":"3) 인상적인","w":"1번에서 로마인들이 great engineers(훌륭한 기술자)여서 만든 건축물이라고 했고, 2번에서 2,000년을 버텼다고 함. 그래서 impressive는 인상적인(감명 깊은). 지루하거나 평범하면 앞의 great와 어울리지 않음.","c":3,"ev":"1번 문장","s":[[1,"The ancient Romans were great engineers and builders, so they created many impressive structures.","고대 로마인들은 훌륭한 기술자이자 건축가여서 인상적인 건축물들을 많이 만들었다."]]},"h":"aec0bfdf65"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They fill tiny cracks and repair damage.)","ko":"그것들은 작은 틈을 메우고 손상을 ( ).","opts":["부수다","수리하다","던지다","씻다"],"word":"repair","r":{"a":"2) 수리하다","w":"10번에서 석회 쇄설암이 틈을 메우고(fill) 손상을 repair한다고 함. 11번에서 틈이 커지기 전에 '고친다(fixes)'고 같은 뜻으로 다시 말함. 그래서 repair는 수리하다.","c":2,"ev":"10번 문장","s":[[10,"They fill tiny cracks and repair damage.","그것들은 작은 틈을 메우고 손상을 복구한다."]]},"h":"250ed5a8b7"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThis reaction happens naturally and quickly fixes the cracks before they get bigger.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이 반응은 자연스럽게 일어나며 갈라진 틈이 더 커지기 전에 그것들을 빠르게 수리한다.","opts":["로마인들","연구원들","갈라진 틈들","석회 쇄설암들"],"r":{"a":"3) 갈라진 틈들","w":"11번에서 before they get bigger는 \"틈들이 더 커지기 전에\"라는 뜻임. they는 앞의 the cracks를 가리킴.","c":3,"ev":"11번 문장","s":[[11,"This reaction happens naturally and quickly fixes the cracks before they get bigger.","이 반응은 자연스럽게 일어나며 갈라진 틈이 더 커지기 전에 그것들을 빠르게 수리한다."]],"k":"they = 갈라진 틈들"},"pron":"they","h":"bbdd029fa6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In fact, this hot mixing process was what gave the ancient concrete a “self-healing ability.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사실, 이 고온 혼합 과정은 고대 콘크리트에 ‘자가 치유 능력’을 준 것이었다.","opts":["이 혼합 과정은 콘크리트의 자가 치유 능력을 없애 버렸다.","자가 치유 능력 덕분에 로마인들이 고온 혼합 과정을 생각해 냈다.","사실, 이 뜨거운 혼합 과정이 고대 콘크리트에 자가 치유 능력을 갖게 해 준 것이었다.","이 혼합 과정은 콘크리트의 자가 치유 능력과 아무 관계가 없었다."],"r":{"a":"3) 사실, 이 뜨거운 혼합 과정이 고대 콘크리트에 자가 치유 능력을 갖게 해 준 것이었다.","w":"8번의 what gave A B는 'A에게 B를 준 것'. 고온 혼합 과정(5번)이 자가 치유 능력을 준 원인이다. 능력을 없앴다(1), 능력이 과정의 원인이다(2), 관계없다(4)는 모두 본문과 반대.","c":3,"ev":"8번 문장","s":[[8,"In fact, this hot mixing process was what gave the ancient concrete a “self-healing ability.”","사실, 이 고온 혼합 과정은 고대 콘크리트에 ‘자가 치유 능력’을 준 것이었다."]]},"h":"53d5fd0ee3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["로마인들은 석회, 화산재, 물을 고온에서 섞었다.","연구원들은 로마 콘크리트에 비밀이 없다고 생각한다.","석회 쇄설암은 물을 만나면 틈을 더 크게 만든다.","로마 콘크리트 건물들은 겨우 200년 동안만 좋은 상태로 있었다."],"opts":["Romans mixed lime, volcanic ash, and water at high temperatures.","Researchers think Roman concrete has no secret.","Lime clasts make cracks bigger when they meet water.","Roman concrete buildings stayed in good shape for only 200 years."],"r":{"a":"1) Romans mixed lime, volcanic ash, and water at high temperatures.","w":"5번에서 로마인들은 석회, 화산재, 물을 고온에서 섞음. 연구원들은 비밀(자가 치유 콘크리트)을 찾았다고 믿고(4번), 석회 쇄설암은 틈을 메우고(10번), 건물은 2,000년 이상 버텼음(2번).","c":1,"ev":"2, 4~5, 10~11번 문장","s":[[2,"Their concrete buildings have survived for over 2,000 years.","그들의 콘크리트 건물들은 2,000년 이상 견뎌 왔다."],[4,"Now, they believe they have finally found the secret: self-healing concrete!","이제, 그들은 마침내 비밀을 발견했다고 믿는다: 바로 자가 치유 콘크리트다!"],[5,"To make their concrete, Romans mixed lime, volcanic ash, and water at high temperatures.","그들의 콘크리트를 만들기 위해, 로마인들은 석회, 화산재, 그리고 물을 고온에서 섞었다."],[10,"They fill tiny cracks and repair damage.","그것들은 작은 틈을 메우고 손상을 복구한다."],[11,"This reaction happens naturally and quickly fixes the cracks before they get bigger.","이 반응은 자연스럽게 일어나며 갈라진 틈이 더 커지기 전에 그것들을 빠르게 수리한다."]]},"h":"46e35e1f1d"},{"n":9,"t":"sum","q":"Self-healing concrete explains why ancient Roman buildings are still in good (A), and researchers hope it can (B) modern concrete.","ko":"자가 치유 콘크리트는 고대 로마 건물들이 오늘날에도 좋은 (A)인 이유를 설명해 주며, 연구원들은 그것이 현대 콘크리트를 (B)하는 데 도움이 되기를 바란다.","opts":["(A) condition / (B) damage","(A) shape / (B) hide","(A) weather / (B) improve","(A) price / (B) sell","(A) condition / (B) improve"],"oko":["(A) 상태 / (B) 손상시키다","(A) 모양 / (B) 숨기다","(A) 날씨 / (B) 개선하다","(A) 가격 / (B) 팔다","(A) 상태 / (B) 개선하다"],"r":{"a":"5) (A) condition / (B) improve","w":"12번: 로마 건물들이 오늘날에도 좋은 상태(good condition)인 이유를 설명, 13번: 연구원들은 발견이 현대 콘크리트를 개선(improve)하는 데 도움이 되기를 바람. (A)와 (B)가 둘 다 맞는 것은 5번뿐.","c":5,"ev":"12~13번 문장","s":[[12,"This explains why ancient Roman buildings remain in good condition today.","이것은 고대 로마의 건물들이 왜 오늘날에도 좋은 상태를 유지하는지 설명해 준다."],[13,"Researchers hope their findings could help improve modern concrete.","연구원들은 그들의 발견이 현대의 콘크리트를 개선하는 데 도움이 될 수 있기를 바란다."]]},"h":"cfbab51047"},{"n":10,"t":"fill","q":"Now, they [A] they have [B] found the secret: self-healing concrete!","ko":"이제, 그들은 비밀을 [B] 발견했다고 [A]: 바로 자가 치유 콘크리트다!","bank":["believe","finally","ancient","tiny","volcanic","damage"],"bko":{"believe":"믿다","finally":"마침내","ancient":"고대의","tiny":"아주 작은","volcanic":"화산의","damage":"손상"},"r":{"a":"[A] believe (믿다), [B] finally (마침내)","w":"4번에서 이제 그들은 마침내(finally) 비밀을 발견했다고 믿는다(believe)고 함.","c":null,"ev":"4번 문장","s":[[4,"Now, they believe they have finally found the secret: self-healing concrete!","이제, 그들은 마침내 비밀을 발견했다고 믿는다: 바로 자가 치유 콘크리트다!"]]},"h":"88037f48b7"}]},{"u":11,"id":"rg3-11-2","no":2,"ko":"바게트 한 개에도 국가 비상이 걸린 이유","items":[{"n":1,"t":"tf","q":"Six billion baguettes are sold in France every year.","ko":"프랑스에서는 매년 60억 개의 바게트가 팔린다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장 six billion baguettes are sold in France every year와 같은 내용. sold는 sell(팔다)의 과거분사.","c":"T","ev":"3번 문장","s":[[3,"It’s surprising to know that six billion baguettes are sold in France every year!","프랑스에서 매년 60억 개의 바게트가 팔린다는 사실은 놀랍다!"]]},"h":"c37e7e444d"},{"n":2,"t":"tf","q":"Most of the small bakeries that closed were in big cities.","ko":"문을 닫은 소규모 빵집들 대부분은 대도시에 있었다.","r":{"a":"F (본문과 다른 내용)","w":"7번에서 문을 닫은 작은 빵집 대부분은 시골 지역(the countryside)에 있었음. 대도시로 바꾼 진술이라 F.","c":"F","ev":"7번 문장","s":[[7,"Most of these small bakeries that closed were in the countryside.","문을 닫은 이러한 소규모 빵집 대부분은 시골 지역에 있었다."]]},"h":"07606047c1"},{"n":3,"t":"tf","q":"Early in the morning, people buy fresh baguettes from bakeries in France.","ko":"프랑스에서는 아침 일찍 사람들이 빵집에서 신선한 바게트를 산다.","r":{"a":"T (본문과 맞는 내용)","w":"4번에서 아침 일찍 사람들이 빵집에서 신선한 바게트를 사는 모습을 쉽게 볼 수 있다고 함. buying은 buy(사다)에서 온 말.","c":"T","ev":"4번 문장","s":[[4,"Early in the morning, you can easily see people buying fresh baguettes from bakeries.","아침 일찍, 당신은 사람들이 빵집에서 신선한 바게트를 사는 모습을 쉽게 볼 수 있다."]]},"h":"851cf8818d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the past, there were many traditional bakeries in France and each of them had unique baguette-baking skills.)","ko":"과거에는 프랑스에 전통 빵집이 많이 있었고 각각 ( ) 바게트 제빵 기술을 가지고 있었다.","opts":["평범한","값비싼","독특한, 고유의","오래된"],"word":"unique","r":{"a":"3) 독특한, 고유의","w":"5번은 빵집마다 each of them(각각)이 unique skills를 가졌다는 내용. 빵집마다 다른 '고유의' 기술이라는 뜻이라 평범한은 반대. 6번의 however로 이 빵집들이 사라지는 문제가 시작됨.","c":3,"ev":"5번 문장","s":[[5,"In the past, there were many traditional bakeries in France and each of them had unique baguette-baking skills.","과거에는 프랑스에 전통 빵집이 많이 있었고 각각 고유의 바게트 제빵 기술을 가지고 있었다."]]},"h":"3945f0939f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most of these small bakeries that closed were in the countryside.)","ko":"문을 닫은 이러한 소규모 빵집 대부분은 ( )에 있었다.","opts":["시골 지역","바다","도시","공항"],"word":"countryside","r":{"a":"1) 시골 지역","w":"7번은 문을 닫은 작은 빵집 대부분이 어디에 있었는지 말하는 문장이고, in the countryside는 '시골 지역에'라는 뜻이다. 바다, 도시, 공항은 본문에 나오지 않는다.","c":1,"ev":"7번 문장","s":[[7,"Most of these small bakeries that closed were in the countryside.","문을 닫은 이러한 소규모 빵집 대부분은 시골 지역에 있었다."]]},"h":"51137b2b24"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey added the traditional know-how and culture of baguette bread to their list of “Intangible Cultural Heritage.”","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 바게트 빵의 전통적인 제조 기술과 문화를 ‘무형문화유산’ 목록에 추가했다.","opts":["프랑스 사람들","유네스코","작은 빵집들","대형 슈퍼마켓들"],"r":{"a":"2) 유네스코","w":"10번 They는 바로 앞 9번의 주어 UNESCO(유네스코). 9번에서 유네스코가 전통 제빵 방식을 보호하려고 했고, 10번이 그 구체적인 일(무형문화유산 목록에 추가)임. 빵집이나 슈퍼마켓이 목록에 추가한 것은 아님.","c":2,"ev":"9~10번 문장","s":[[9,"UNESCO tried to protect the traditional baguette-baking methods for the future.","유네스코는 미래를 위해 바게트의 전통 제빵 방식을 보호하려고 노력했다."],[10,"They added the traditional know-how and culture of baguette bread to their list of “Intangible Cultural Heritage.”","그들은 바게트 빵의 전통적인 제조 기술과 문화를 ‘무형문화유산’ 목록에 추가했다."]]},"h":"938859b85a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Small bakeries found it hard to stay open because of big supermarkets and stores.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"작은 빵집들은 대형 슈퍼마켓과 상점들 때문에 영업을 유지하기 어렵다는 것을 깨달았다.","opts":["큰 슈퍼마켓들이 작은 빵집들을 도와서 문을 열어 둘 수 있었다.","작은 빵집들은 문을 열어 두는 것이 쉽다는 것을 알게 되었다.","작은 빵집들은 큰 상점들과 합쳐져 큰 빵집이 되었다.","작은 빵집들은 대형 슈퍼마켓과 상점들 때문에 문을 열어 두기가 어렵다고 느꼈다."],"r":{"a":"4) 작은 빵집들은 대형 슈퍼마켓과 상점들 때문에 문을 열어 두기가 어렵다고 느꼈다.","w":"8번의 found it hard to stay open은 '문을 열어 두기가 어렵다고 느꼈다(깨달았다)'. because of 뒤의 big supermarkets and stores가 어려움의 원인. 도움이 되었다(1)거나 쉽다(2)는 반대 뜻이고, 합쳐졌다(3)는 내용은 없음.","c":4,"ev":"8번 문장","s":[[8,"Small bakeries found it hard to stay open because of big supermarkets and stores.","작은 빵집들은 대형 슈퍼마켓과 상점들 때문에 영업을 유지하기 어렵다는 것을 깨달았다."]]},"h":"fe8f72d41a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["프랑스 사람들은 바게트를 거의 먹지 않는다.","프랑스는 1970년 이후 매년 400개의 새 빵집을 얻었다.","1970년 이후, 프랑스는 매년 400개의 전통 빵집을 잃었다.","유네스코는 바게트 제빵 방식을 보호하려고 하지 않았다."],"opts":["French people rarely eat baguettes.","France has gained 400 new bakeries each year since 1970.","Since 1970, France has lost 400 traditional bakeries each year.","UNESCO did not try to protect baguette-baking methods."],"r":{"a":"3) Since 1970, France has lost 400 traditional bakeries each year.","w":"6번에서 1970년 이후 매년 400개의 전통 빵집을 잃었다고 함. 바게트는 식사 때마다 먹을 만큼 흔하고(2번), 유네스코는 전통 제빵 방식을 보호하려고 했음(9번).","c":3,"ev":"2, 6, 9번 문장","s":[[2,"It is very common for the French to eat this bread during every meal.","프랑스 사람들이 식사 때마다 이 빵을 먹는 것은 매우 흔하다."],[6,"However, since 1970, France has lost 400 traditional bakeries each year.","그러나, 1970년 이후로, 프랑스는 매년 400개의 전통 빵집을 잃었다."],[9,"UNESCO tried to protect the traditional baguette-baking methods for the future.","유네스코는 미래를 위해 바게트의 전통 제빵 방식을 보호하려고 노력했다."]]},"h":"6f01d39abd"},{"n":9,"t":"sum","q":"It is very (A) for the French to eat this bread during every (B).","ko":"프랑스 사람들이 (B)마다 이 빵을 먹는 것은 매우 (A).","opts":["(A) rare / (B) year","(A) common / (B) meal","(A) rare / (B) meal","(A) common / (B) year","(A) strange / (B) meal"],"oko":["(A) 드물다 / (B) 해","(A) 흔하다 / (B) 식사","(A) 드물다 / (B) 식사","(A) 흔하다 / (B) 해","(A) 이상하다 / (B) 식사"],"r":{"a":"2) (A) common / (B) meal ((A) 흔하다 / (B) 식사)","w":"2번에서 프랑스 사람들이 식사(meal) 때마다 이 빵을 먹는 것은 매우 흔하다(common)고 함.","c":2,"ev":"2번 문장","s":[[2,"It is very common for the French to eat this bread during every meal.","프랑스 사람들이 식사 때마다 이 빵을 먹는 것은 매우 흔하다."]]},"h":"d85222b46b"},{"n":10,"t":"fill","q":"This will help [A] such traditions and knowledge [B] for a long time.","ko":"이것은 그러한 전통과 지식을 오랫동안 [B] 상태로 [A]은(는) 데 도움이 될 것이다.","bank":["keep","alive","bakeries","countryside","price","supermarkets"],"bko":{"keep":"유지하다","alive":"살아 있는","bakeries":"빵집들","countryside":"시골 지역","price":"가격","supermarkets":"슈퍼마켓들"},"r":{"a":"[A] keep (유지하다), [B] alive (살아 있는)","w":"11번에서 이것은 그러한 전통과 지식을 오랫동안 살아 있게(alive) 유지하는(keep) 데 도움이 될 것이라고 함.","c":null,"ev":"11번 문장","s":[[11,"This will help keep such traditions and knowledge alive for a long time.","이것은 그러한 전통과 지식을 오랫동안 존속시키는 데 도움이 될 것이다."]]},"h":"b72337ab6a"}]},{"u":11,"id":"rg3-11-3","no":3,"ko":"극장에 팝콘이 없던 시절이 있었다고?","items":[{"n":1,"t":"tf","q":"Before 1927, movie theaters were luxurious places for only high-class customers.","ko":"1927년 이전에 영화관은 상류층 손님만을 위한 호화로운 장소였다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장과 같은 내용. luxurious는 '호화로운', high-class는 '상류층의'.","c":"T","ev":"2번 문장","s":[[2,"This was because movie theaters were luxurious places for only high-class customers before 1927.","이것은 1927년 이전에 영화관이 상류층 손님만을 위한 호화로운 장소였기 때문이었다."]]},"h":"5af0b07ac7"},{"n":2,"t":"tf","q":"The theater owners wanted people to make noise while they were eating popcorn.","ko":"극장 소유주들은 사람들이 팝콘을 먹는 동안 소음을 내기를 원했다.","r":{"a":"F (본문과 다른 내용)","w":"3번에서 극장 소유주들은 사람들이 팝콘을 먹으며 소음을 내는 것을 원하지 않았음(didn't want). 반대로 쓴 진술이라 F.","c":"F","ev":"3번 문장","s":[[3,"The theater owners didn’t want people to make noise while they were eating popcorn at the movies.","극장 소유주들은 사람들이 영화관에서 팝콘을 먹는 동안 소음을 내는 것을 원하지 않았다."]]},"h":"ef0e6547e2"},{"n":3,"t":"tf","q":"During the Great Depression, going to a movie was cheaper than other activities.","ko":"대공황 동안 영화를 보러 가는 것은 다른 활동들보다 더 저렴했다.","r":{"a":"T (본문과 맞는 내용)","w":"7번 문장 going to a movie was cheaper than other activities와 같은 내용. cheaper는 cheap(저렴한)의 비교급.","c":"T","ev":"7번 문장","s":[[7,"At that time, going to a movie was cheaper than other activities.","그 당시, 영화를 보러 가는 것은 다른 활동들보다 더 저렴했다."]]},"h":"293326c191"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This was because movie theaters were luxurious places for only high-class customers before 1927.)","ko":"이것은 1927년 이전에 영화관이 상류층 손님만을 위한 ( ) 장소였기 때문이었다.","opts":["좁은","오래된","호화로운","위험한"],"word":"luxurious","r":{"a":"3) 호화로운","w":"2번에서 영화관은 high-class(상류층) 손님만을 위한 곳이었음. 그래서 luxurious는 호화로운. 5~8번에서 돈이 적은 사람들이 갈 만큼 싸졌다는 것과 대조됨.","c":3,"ev":"2번 문장","s":[[2,"This was because movie theaters were luxurious places for only high-class customers before 1927.","이것은 1927년 이전에 영화관이 상류층 손님만을 위한 호화로운 장소였기 때문이었다."]]},"h":"910109a6fe"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As more and more people went to movie theaters, owners finally started selling popcorn.)","ko":"점점 더 많은 사람들이 영화관에 가면서, 영화관 ( )은 마침내 팝콘을 팔기 시작했다.","opts":["영화 팬들","주인(소유주)들","배우들","직원들"],"word":"owners","r":{"a":"2) 주인(소유주)들","w":"9번의 owners는 3번의 The theater owners(극장 소유주들)와 같은 사람들. 처음에 팝콘을 망설이던 주인들이 마침내 팔기 시작했다는 이야기라서 주인(소유주)들. 영화 팬들은 12번의 moviegoers.","c":2,"ev":"9번 문장","s":[[9,"As more and more people went to movie theaters, owners finally started selling popcorn.","점점 더 많은 사람들이 영화관에 가면서, 영화관 주인들은 마침내 팝콘을 팔기 시작했다."]]},"h":"2dd051da2a"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey needed a place to have fun with less money, and that was the theater.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 더 적은 돈으로 즐길 장소가 필요했는데, 그것이 바로 극장이었다.","opts":["극장 소유주들","영화배우들","상류층 손님들","직장을 잃고 힘든 시간을 보낸 많은 사람들"],"r":{"a":"4) 직장을 잃고 힘든 시간을 보낸 많은 사람들","w":"6번 They는 바로 앞 5번의 many people(많은 사람들) 중 대공황 때 직장을 잃고 힘든 시간을 보낸 사람들. 이들이 적은 돈으로 즐길 곳(극장)을 필요로 했음. 상류층 손님은 1927년 이전 이야기(2번).","c":4,"ev":"5~6번 문장","s":[[5,"However, during the Great Depression, many people lost their jobs and had a hard time.","그러나, 대공황 동안, 많은 사람들이 직장을 잃었고 힘든 시간을 보냈다."],[6,"They needed a place to have fun with less money, and that was the theater.","그들은 더 적은 돈으로 즐길 장소가 필요했는데, 그것이 바로 극장이었다."]]},"h":"fc310b121e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, movie theaters became popular places!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로, 영화관은 인기 있는 장소가 되었다!","opts":["결과적으로, 영화관은 사람들이 가지 않는 곳이 되었다.","결과적으로, 영화관은 상류층만 갈 수 있는 곳이 되었다.","결과적으로, 영화관은 인기 있는 장소가 되었다.","결과적으로, 영화관은 문을 닫게 되었다."],"r":{"a":"3) 결과적으로, 영화관은 인기 있는 장소가 되었다.","w":"As a result는 \"결과적으로\", popular places는 \"인기 있는 장소\"라는 뜻임.","c":3,"ev":"8번 문장","s":[[8,"As a result, movie theaters became popular places!","결과적으로, 영화관은 인기 있는 장소가 되었다!"]]},"h":"ccdd5983d6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["팝콘은 1927년 이전에 모든 미국 영화관에서 팔렸다.","오늘날 팝콘은 대부분의 영화관에서 돈을 버는 데 큰 부분이다.","영화를 보러 가는 것이 더 비쌌기 때문에 영화관은 인기 있어졌다.","오늘날에는 상류층 손님만 영화관에 간다."],"opts":["Popcorn was sold in every American movie theater before 1927.","Today, popcorn is a big part of making money for most movie theaters.","Movie theaters became popular because going to a movie was more expensive.","Only high-class customers go to movie theaters today."],"r":{"a":"2) Today, popcorn is a big part of making money for most movie theaters. (오늘날 팝콘은 대부분의 영화관에서 돈을 버는 데 큰 부분이다.)","w":"11번에서 오늘날 대부분의 영화관에서 팝콘은 돈을 버는 데 큰 부분을 차지한다고 함.","c":2,"ev":"2번, 7~8번, 11번 문장","s":[[2,"This was because movie theaters were luxurious places for only high-class customers before 1927.","이것은 1927년 이전에 영화관이 상류층 손님만을 위한 호화로운 장소였기 때문이었다."],[7,"At that time, going to a movie was cheaper than other activities.","그 당시, 영화를 보러 가는 것은 다른 활동들보다 더 저렴했다."],[8,"As a result, movie theaters became popular places!","결과적으로, 영화관은 인기 있는 장소가 되었다!"],[11,"Today, for s faster than using undersea cables.","ko":"인터넷에 인공위성을 사용하는 것이 해저 케이블을 사용하는 것보다 더 빠르다.","r":{"a":"F (본문과 다른 내용)","w":"9번에서 인공위성은 지연(delays)이 있을 수 있고, 10번에서 해저 케이블이 거의 빛만큼 빠르다고 함. 빠르기가 반대로 쓰인 진술이라 F.","c":"F","ev":"9~10번 문장","s":[[9,"Using satellites can have delays.","인공위성을 사용하는 것은 지연이 있을 수 있다."],[10,"But, the undersea cables are very fast because they use optical fibers that send data almost as fast as light!","하지만, 해저 케이블들은 거의 빛만큼 빠르게 데이터를 전송하는 광섬유를 사용하기 때문에 매우 빠르다!"]]},"h":"80bc24854a"},{"n":3,"t":"tf","q":"Workers use special ships to place cables.","ko":"작업자들은 케이블을 설치하기 위해 특별한 배를 사용한다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장 Workers use special ships to place cables와 같은 내용. place는 '놓다, 설치하다'.","c":"T","ev":"6번 문장","s":[[6,"Workers use special ships to place cables and must choose the best path for the cables, avoiding fishing areas or military zones.","작업자들은 케이블을 설치하기 위해 특별한 배를 사용하며, 어업 구역이나 군사 지역을 피해 케이블을 위한 최적의 경로를 선택해야 한다."]]},"h":"2cffff4478"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Workers use special ships to place cables and must choose the best path for the cables, avoiding fishing areas or military zones.)","ko":"작업자들은 케이블을 설치하기 위해 특별한 배를 사용하며, 어업 구역이나 군사 지역을 ( ) 케이블을 위한 최적의 경로를 선택해야 한다.","opts":["따르다","청소하다","피하다","팔다"],"word":"avoiding","r":{"a":"3) 피하다","w":"6번에서 케이블은 어업 구역이나 군사 지역을 '피해서' 놓아야 최적의 길이 됨. 그래서 avoid는 피하다. 앞의 best path(최적의 경로)와 연결해 읽으면 이해됨.","c":3,"ev":"6번 문장","s":[[6,"Workers use special ships to place cables and must choose the best path for the cables, avoiding fishing areas or military zones.","작업자들은 케이블을 설치하기 위해 특별한 배를 사용하며, 어업 구역이나 군사 지역을 피해 케이블을 위한 최적의 경로를 선택해야 한다."]]},"h":"2a3b6d0a0b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, if your internet is slow sometimes, just be more patient.)","ko":"그러니, 여러분의 인터넷이 가끔 느리다면, 좀 더 ( ).","opts":["화난","게으른","바쁜","인내심 있는"],"word":"patient","r":{"a":"4) 인내심 있는","w":"12번은 인터넷이 가끔 느릴 때 어떻게 하라는 당부이고, 13번 이유는 작업자들이 최선을 다하고 있다는 것. 그래서 patient는
