 I trust my club members.","그 동아리의 회장인 지나는 말했습니다, \"나는 동아리 멤버들을 믿기 때문에 공중에서 돌 수 있어요.",1],["When I see the crowd cheering and screaming, I feel proud.","관중들이 응원하고 소리치는 것을 볼 때, 나는 자랑스럽습니다.",0],["Fly High is the best part of my middle school life!\"","Fly High는 나의 중학교 생활 중 최고의 부분입니다!\"",0],["You can watch Fly High doing their performance at the school festival next week.","다음 주 학교 축제에서 Fly High가 공연하는 것을 볼 수 있습니다.",1],["Come and feel their energy!","오셔서 그들의 에너지를 느껴 보세요!",0],["Student Survey","학생 설문 조사",1],["Are You a Saver or a Spender?","당신은 저축하는 사람인가요 아니면 소비하는 사람인가요?",1],["by Lee Semi","이세미 작성",1],["September 8th, 20XX","20XX년 9월 8일",1],["What do you do with your money?","당신은 당신의 돈으로 무엇을 하나요?",1],["Do you save it or spend it?","그것을 저축하나요 아니면 소비하나요?",0],["We asked the following questions to 100 students from our school.","우리는 우리 학교 학생 100명에게 다음의 질문을 했습니다.",0],["Let's look at the results.","그 결과를 살펴봅시다.",0]];var RNUM=55;var TITLE_EN="Voice of Teens";var PASS_EN=["Voice of Teens","Club News","Spreading Cheer Everywhere","by Kim Jinho","September 8th, 20XX","Let's meet Fly High, our school's cheerleading club. The club started from an idea of one student two years ago. Now, there are 10 girls and 6 boys in the club. Each member has a special energy.","Do you remember the recent school basketball game? After two quarters, our team was losing by 20 points. During halftime, Fly High came on the court. They performed wonderfully. They flipped in the air and made a human pyramid. Then they shouted, \"Never give up!\" And guess what? Our team won the game in the end.","Jina, the captain of the club, said, \"I can flip in the air because I trust my club members. When I see the crowd cheering and screaming, I feel proud. Fly High is the best part of my middle school life!\"","You can watch Fly High doing their performance at the school festival next week. Come and feel their energy!","Student Survey","Are You a Saver or a Spender?","by Lee Semi","September 8th, 20XX","What do you do with your money? Do you save it or spend it? We asked the following questions to 100 students from our school. Let's look at the results."];var PASS_KO=["십 대들의 목소리","동아리 소식","응원을 여기저기 퍼뜨림","김진호 작성","20XX년 9월 8일","우리 학교의 응원 동아리 Fly High를 만나봅시다. 그 동아리는 2년 전에 한 학생의 아이디어에서 시작되었습니다. 이제는, 그 동아리에 10명의 소녀와 6명의 소년이 있습니다. 각 멤버는 특별한 에너지를 가지고 있습니다.","여러분은 최근 학교 농구 경기를 기억하나요? 2쿼터 후에, 우리 팀은 20점 차이로 지고 있었습니다. 하프 타임 동안, Fly High가 코트에 나왔습니다. 그들은 멋지게 공연했습니다. 그들은 공중에서 돌았고 인간 피라미드를 만들었습니다. 그러고 나서 그들은 \"절대 포기하지 마!\"라고 외쳤습니다. 그리고 어떻게 되었을까요? 결국에는 우리 팀이 그 경기에서 이겼습니다.","그 동아리의 회장인 지나는 말했습니다, \"나는 동아리 멤버들을 믿기 때문에 공중에서 돌 수 있어요. 관중들이 응원하고 소리치는 것을 볼 때, 나는 자랑스럽습니다. Fly High는 나의 중학교 생활 중 최고의 부분입니다!\"","다음 주 학교 축제에서 Fly High가 공연하는 것을 볼 수 있습니다. 오셔서 그들의 에너지를 느껴 보세요!","학생 설문 조사","당신은 저축하는 사람인가요 아니면 소비하는 사람인가요?","이세미 작성","20XX년 9월 8일","당신은 당신의 돈으로 무엇을 하나요? 그것을 저축하나요 아니면 소비하나요? 우리는 우리 학교 학생 100명에게 다음의 질문을 했습니다. 그 결과를 살펴봅시다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["benefits of taking a walk","tips for getting good grades","how to manage stress about exams","worry about a bad grade this semester","recommendations on good stretching videos"],"a":2,"ans":"how to manage stress about exams","evs":[["I feel stressed about the exams next week.","다음 주 시험 때문에 스트레스를 받아요."],["It's important to manage your stress during exams.","시험 기간에는 스트레스를 관리하는 것이 중요하단다."]],"ev":["I feel stressed about the exams next week.","다음 주 시험 때문에 스트레스를 받아요."],"ow":["오답 ✕ — 'You can take a walk and get some fresh air.'(산책을 하면서 신선한 공기를 쐴 수 있어.)처럼 산책이 나오지만 스트레스를 줄이는 여러 방법 중 하나일 뿐이다. 너무 좁아서 틀림.","오답 ✕ — 성적을 올리는 방법은 나오지 않는다. 시험 때문에 받는 스트레스를 다루는 방법이 중심이라서 틀림.","정답 ○ — Jake가 'I feel stressed about the exams next week.'(다음 주 시험 때문에 스트레스를 받아요.)라고 하자 선생님이 산책, 스트레칭, 친구와 공부하기 같은 'manage your stress'(스트레스를 관리하는) 방법을 알려 주므로 주제로 알맞다.","오답 ✕ — 시험 스트레스는 이야기하지만 이번 학기 나쁜 성적에 대한 걱정은 나오지 않는다. 'stressed about the exams next week'(다음 주 시험 때문에 스트레스)라고 했으므로 틀림.","오답 ✕ — 'you can do some stretching'(스트레칭을 좀 할 수도 있지)이 나오지만 스트레칭 영상을 추천하는 대화는 아니다. 틀림."],"memo":["정답: how to manage stress about exams (시험 스트레스를 관리하는 방법)","근거: It's important to manage your stress during exams.(시험 기간에는 스트레스를 관리하는 것이 중요하단다.)","함정: 산책·스트레칭은 방법의 일부일 뿐이다."],"why":"시험 스트레스를 관리하는 방법에 대한 상담 대화이다."}],"dlg":[["Jake","Ms. Hong, may I come in?","홍 선생님, 들어가도 될까요?"],["Ms. Hong","Sure, Jake. What's wrong?","물론이지, Jake. 무슨 일 있니?"],["Jake","I feel stressed about the exams next week.","다음 주 시험 때문에 스트레스를 받아요."],["Ms. Hong","Oh, no. How often do you feel this way?","저런. 얼마나 자주 그렇게 느끼니?"],["Jake","Almost every time I think about exams.","시험에 대해 생각할 때마다 거의 매번이요."],["Ms. Hong","I understand. It's important to manage your stress during exams.","이해해. 시험 기간에는 스트레스를 관리하는 것이 중요하단다."],["Jake","But I don't know how. What should I do?","하지만 방법을 모르겠어요. 어떻게 해야 하나요?"],["Ms. Hong","You can take a walk and get some fresh air. Also, you can do some stretching.","산책을 하면서 신선한 공기를 쐴 수 있어. 또 스트레칭을 좀 할 수도 있지."],["Jake","Those are great tips. I will try them.","좋은 방법들이네요. 해 볼게요."],["Ms. Hong","Studying with your friends can also lower your stress.","친구들과 함께 공부하는 것도 스트레스를 낮춰 줄 수 있어."],["Jake","Okay. Thank you for your advice!","알겠어요. 조언해 주셔서 감사합니다!"]]},{"qs":[{"n":2,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["The topic of the article is teens' selfie habits.","The girl's friends post their selfies on social media.","Teens should be careful when they share selfies online.","Personal information in selfies is protected safely.","It is important to think once more before sharing selfies online."],"a":3,"ans":"Personal information in selfies is protected safely.","evs":[["Right. Anyone can see that information.","맞아. 누구든 그 정보를 볼 수 있지."],["Because selfies can have personal information in them.","셀카에는 개인 정보가 담겨 있을 수 있기 때문이야."]],"ev":["Right. Anyone can see that information.","맞아. 누구든 그 정보를 볼 수 있지."],"ow":["오답 ✕ — Liam이 'I'm reading an article about teens' selfie habits.'(십 대들의 셀카 습관에 관한 기사를 읽고 있어.)라고 했으므로 일치한다.","오답 ✕ — 소녀가 'I often see my friends posting their selfies on social media.'(내 친구들이 소셜 미디어에 셀카를 올리는 걸 자주 봐.)라고 했으므로 일치한다.","오답 ✕ — 'it's important to be careful about sharing selfies online'(셀카를 온라인에 공유할 때 조심하는 것이 중요하다)이라고 했으므로 일치한다.","정답 ○ — 'Anyone can see that information.'(누구든 그 정보를 볼 수 있지.)이라고 했다. 개인 정보가 안전하게 보호되는 것이 아니라 누구나 볼 수 있어 위험하므로 일치하지 않는다.","오답 ✕ — 'We should think twice before posting selfies.'(셀카를 올리기 전에 한 번 더 생각해야 해.)라고 했으므로 일치한다."],"memo":["정답: ④ 셀카 속 개인 정보는 안전하게 보호된다 (✕ 일치하지 않음)","근거: Anyone can see that information.(누구든 그 정보를 볼 수 있지.)","함정: think twice = 한 번 더 생각하다"],"why":"셀카 속 개인 정보는 누구나 볼 수 있어서 조심해야 한다."}],"dlg":[["G","What are you reading, Liam?","뭐 읽고 있어, Liam?"],["B","I'm reading an article about teens' selfie habits.","십 대들의 셀카 습관에 관한 기사를 읽고 있어."],["G","That's interesting. How often do teens take selfies?","흥미롭다. 십 대들은 얼마나 자주 셀카를 찍어?"],["B","It says many teens take selfies every day.","많은 십 대들이 매일 셀카를 찍는대."],["G","Wow! I often see my friends posting their selfies on social media.","와! 내 친구들이 소셜 미디어에 셀카를 올리는 걸 자주 봐."],["B","The article also says it's important to be careful about sharing selfies online.","기사에는 셀카를 온라인에 공유할 때 조심하는 것이 중요하다는 내용도 있어."],["G","Why is that important?","그게 왜 중요해?"],["B","Because selfies can have personal information in them.","셀카에는 개인 정보가 담겨 있을 수 있기 때문이야."],["G","Right. Anyone can see that information.","맞아. 누구든 그 정보를 볼 수 있지."],["B","Yeah. We should think twice before posting selfies.","응. 셀카를 올리기 전에 한 번 더 생각해야 해."]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하는 것은?","o":["Eric은 한 달에 한 번 책상을 청소한다.","Eric의 책상은 깔끔하다.","소녀의 과학책은 소녀의 가방 안에 있다.","소녀는 책상을 정리하는 것이 중요하지 않다고 말한다.","Eric은 매주 책상을 청소한다."],"a":0,"ans":"Eric은 한 달에 한 번 책상을 청소한다.","evs":[["I clean it once a month.","한 달에 한 번 청소해."]],"ev":["I clean it once a month.","한 달에 한 번 청소해."],"ow":["정답 ○ — Eric이 'I clean it once a month.'(한 달에 한 번 청소해.)라고 했으므로 맞다.","오답 ✕ — 소녀가 'Your desk is so messy.'(네 책상 너무 지저분하다.)라고 했다. 깔끔한 것이 아니라 지저분하므로 틀림.","오답 ✕ — Eric이 'It's on my desk.'(내 책상 위에 있어.)라고 했다. 가방 안이 아니라 Eric의 책상 위라서 틀림.","오답 ✕ — 소녀는 'It's important to keep your desk tidy.'(책상을 깔끔하게 유지하는 것은 중요해.)라고 했다. 중요하지 않다는 말은 틀림.","오답 ✕ — Eric은 'once a month'(한 달에 한 번)라고 했다. 매주(every week)가 아니라서 틀림."],"memo":["정답: Eric은 한 달에 한 번 책상을 청소한다.","근거: I clean it once a month.(한 달에 한 번 청소해.)","함정: once a month(월 1회) ≠ every week(매주)"],"why":"Eric은 책상을 한 달에 한 번 청소한다."}],"dlg":[["G","Where's my science book, Eric?","내 과학책 어디 있어, Eric?"],["B","It's on my desk.","내 책상 위에 있어."],["G","Your desk is so messy. How often do you clean it?","네 책상 너무 지저분하다. 얼마나 자주 청소해?"],["B","I clean it once a month.","한 달에 한 번 청소해."],["G","Oh, no! It's important to keep your desk tidy.","오, 이런! 책상을 깔끔하게 유지하는 것은 중요해."]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["민호는 일주일에 두 번 가족과 저녁을 먹는다.","민호는 매일 가족과 저녁을 먹는다.","민호는 가족과 충분한 시간을 보내고 있다고 말한다.","소녀는 가족과 식사하는 것이 중요하지 않다고 말한다.","민호는 소녀의 조언을 따르지 않겠다고 말한다."],"a":0,"ans":"민호는 일주일에 두 번 가족과 저녁을 먹는다.","evs":[["I have dinner with my family twice a week.","일주일에 두 번 가족과 저녁을 먹어."]],"ev":["I have dinner with my family twice a week.","일주일에 두 번 가족과 저녁을 먹어."],"ow":["정답 ○ — 민호가 'I have dinner with my family twice a week.'(일주일에 두 번 가족과 저녁을 먹어.)라고 했으므로 맞다.","오답 ✕ — 민호는 'twice a week'(일주일에 두 번)라고 했다. 매일이 아니라서 틀림.","오답 ✕ — 민호는 'I don't spend enough time with my family these days.'(요즘 가족과 충분한 시간을 보내지 못하고 있어.)라고 했다. 충분히 보내지 못한다는 뜻이라서 틀림.","오답 ✕ — 소녀는 'It's important to eat with your family more often.'(가족과 더 자주 식사하는 것이 중요해.)라고 했다. 중요하지 않다는 말은 틀림.","오답 ✕ — 민호는 'Okay, I'll try.'(알겠어, 노력해 볼게.)라고 했다. 따르지 않겠다는 말이 아니라서 틀림."],"memo":["정답: 민호는 일주일에 두 번 가족과 저녁을 먹는다.","근거: I have dinner with my family twice a week.(일주일에 두 번 가족과 저녁을 먹어.)","함정: twice a week = 주 2회"],"why":"민호는 가족과 일주일에 두 번 저녁을 먹는다."}],"dlg":[["B","I don't spend enough time with my family these days.","요즘 가족과 충분한 시간을 보내지 못하고 있어."],["G","Hmm. How often do you have dinner with your family, Minho?","음. 가족과 얼마나 자주 저녁을 먹니, 민호야?"],["B","I have dinner with my family twice a week.","일주일에 두 번 가족과 저녁을 먹어."],["G","It's important to eat with your family more often.","가족과 더 자주 식사하는 것이 중요해."],["B","Okay,
