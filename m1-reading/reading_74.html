ocks jumped up in surprise.","\"You broke into our house and posted these pictures without our permission. Don't you know these things are wrong?\" said Father Bear.","\"Please forgive me. I'm so sorry, and I'll clean your house every day until the end of the summer,\" said Goldilocks."];var PASS_KO=["Goldilocks가 교훈을 배우다","작은 마을에 금발의 어린 소녀가 있었다. 그녀의 이름은 Goldilocks였다. 그녀는 소셜 미디어에 사진을 공유하는 것을 좋아했다. 처음에, 그녀는 일상적인 것들을 올렸지만, 사람들은 그녀에게 '좋아요'를 많이 주지 않았다.","\"어떻게 하면 더 많은 '좋아요'를 받을 수 있지?\" 그녀는 생각했다. \"알았다! 웃긴 사진들을 올려야겠어.\"","이제, 그녀의 게시물은 많은 '좋아요'를 받고 있었고, Goldilocks는 행복했다. 하지만, 그녀의 팔로워들은 곧 지루해졌다. 그래서, 그녀는 더 충격적인 사진들을 올리기로 결심했다.","어느 날, 그녀는 숲에서 산책을 하다가 한 오두막집을 발견했다. 그녀는 문을 두드렸지만, 아무 대답이 없었다. 날이 어두워지고 있었고, 비가 내리기 시작했다. 그녀는 문을 열고 안으로 걸어 들어갔다.","식탁 위에는 수프 세 그릇이 있었다. 그녀는 가장 작은 그릇의 수프를 먹었고 미소를 지으며 셀피를 찍었다. 의자도 세 개 있었다. 그녀는 가장 작은 의자 위에서 몇 번이고 뛰었다. 의자가 부서졌지만, 그녀는 신경 쓰지 않았다.","\"너무 재미있어!\"라고 Goldilocks가 외쳤다.","그녀는 다시 셀피를 찍었고 모든 셀피를 소셜 미디어에 올렸다. 그런 다음, 그녀는 위층으로 올라가 침대 세 개를 발견했다. 그녀는 피곤해서 가장 작은 침대에서 잠들었다.","약 한 시간 후에, 곰 세 마리가 집으로 돌아왔다.","\"누군가 내 수프를 먹고 내 의자를 부서뜨렸어요!\"라고 아기곰이 외쳤다.","그들은 위층으로 가서 Goldilocks를 봤다. 엄마곰이 Goldilocks 옆에서 휴대폰을 발견했다.","\"끔찍해! 우리 집에 관한 이 모든 게시물을 봐요.\"라고 엄마곰이 화가 나서 외쳤다.","Goldilocks는 놀라서 벌떡 일어났다.","\"너는 우리 집에 침입해서 우리의 허락 없이 이 사진들을 올렸어. 너는 이런 것들이 잘못이라는 것을 모르니?\"라고 아빠곰이 말했다.","\"용서해 주세요. 정말 죄송해요, 여름이 끝날 때까지 매일 여러분 집을 청소할게요.\" Goldilocks가 말했다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["The girl thinks the movie looks boring.","The boy agrees with the girl at first.","The actors in the movie are not famous.","They decide not to watch the movie.","They decide to watch the movie."],"a":4,"ans":"They decide to watch the movie.","evs":[["But look at these actors. They are all famous.","하지만 이 배우들을 봐. 모두 유명해."],["All right. Let's watch it.","좋아. 그걸 보자."]],"ev":["But look at these actors. They are all famous.","하지만 이 배우들을 봐. 모두 유명해."],"ow":["오답 ✕ — 'This movie looks really fun.'(이 영화 정말 재미있어 보여.)라고 한 사람이 소녀이다. 지루해 보인다고 말한 사람은 소년이라서 틀림.","오답 ✕ — 소년은 처음에 'I don't ag 's watch it.","좋아. 그걸 보자."]]},{"qs":[{"n":3,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["유나는 '블랙홀의 역사'가 어려울 것 같다고 생각한다.","Alex는 유나와 달리 책이 흥미롭다고 생각한다.","Alex는 휴대폰으로 '블랙홀의 역사'를 읽을 수 있다.","전자책은 종이책보다 비싸다.","Alex는 전자책을 살 것이다."],"a":3,"ans":"전자책은 종이책보다 비싸다.","evs":[["I don't agree. I think it'll be very interesting.","나는 동의하지 않아. 아주 흥미로울 것 같아."],["And it's also cheaper than the paper book.","그리고 종이책보다 더 싸기도 해."]],"ev":["I don't agree. I think it'll be very interesting.","나는 동의하지 않아. 아주 흥미로울 것 같아."],"ow":["오답 ✕ — 유나가 'I think it'll be difficult.'(어려울 것 같아.)라고 했으므로 일치하는 내용이다. 일치하지 않는 것을 찾는 문제라서 답이 아니다.","오답 ✕ — 유나는 어려울 것 같다고 했지만 Alex는 'I think it'll be very interesting.'(아주 흥미로울 것 같아.)라고 했으므로 일치하는 내용이다.","오답 ✕ — 'You can read it on your phone.'(휴대폰으로 읽을 수 있어.)라고 했고, Alex가 전자책을 사기로 했으므로 휴대폰으로 읽을 수 있다. 일치하는 내용이다.","정답 ○ — 유나가 'it's also cheaper than the paper book'(종이책보다 더 싸기도 해)이라고 했다. 전자책이 더 싸다는 뜻인데 이 보기는 더 비싸다고 해서 일치하지 않는다.","오답 ✕ — 'Then, I'll buy the e-book.'(그럼 전자책을 살게.)이라고 했으므로 일치하는 내용이다."],"memo":["정답: ④ 전자책은 종이책보다 비싸다 (✕ — 더 싸다)","근거: it's also cheaper than the paper book(종이책보다 더 싸기도 해)","함정: cheaper(더 싼) ↔ 비싼, 반대로 읽지 않기"],"why":"전자책은 종이책보다 더 싸므로 '더 비싸다'는 보기가 일치하지 않는다."},{"n":4,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["light - e-book","boring - e-book","heavy - paper book","heavy - e-book","difficult - e-book"],"a":3,"ans":"heavy - e-book","evs":[["I'd love to, but it's too thick and heavy.","그러고 싶지만, 너무 두껍고 무거워."],["Then, I'll buy the e-book.","그럼 전자책을 살게."]],"ev":["I'd love to, but it's too thick and heavy.","그러고 싶지만, 너무 두껍고 무거워."],"ow":["오답 ✕ — Alex가 책을 사지 않으려는 이유는 'too thick and heavy'(너무 두껍고 무겁다)이다. 가볍다(light)는 반대 뜻이라서 (A)가 틀림.","오답 ✕ — Alex는 'I think it'll be very interesting.'(아주 흥미로울 것 같아.)라고 했으므로 지루해서(boring)가 아니다. (A)가 틀림.","오답 ✕ — (A) heavy는 맞지만, Alex가 사기로 한 것은 종이책이 아니라 'I'll buy the e-book.'(전자책을 살게.)이라서 (B)가 틀림.","정답 ○ — 'it's too thick and heavy'(너무 두껍고 무거워)가 종이책을 사기 어려운 이유이고, 'I'll buy the e-book.'(전자책을 살게.)이라고 했으므로 (A)=heavy, (B)=e-book이다.","오답 ✕ — 'it'll be difficult'(어려울 것 같아)는 유나의 의견이다. Alex가 사지 않으려는 이유는 두껍고 무거워서라서 (A)가 틀림."],"memo":["정답: ④ heavy - e-book","근거: it's too thick and heavy(너무 두껍고 무거워) / I'll buy the e-book.(전자책을 살게.)","함정: difficult(어렵다)는 유나의 생각이지 Alex의 이유가 아님"],"why":"Alex는 종이책이 너무 두껍고 무거워서 전자책을 사기로 했다.","sum":"Alex doesn't want the paper book because it is too thick and (A) , so he will buy the (B) .","lab":"완성된 요약문 : "}],"dlg":[["B","What do you think about this book, Yuna?","이 책 어떻게 생각해, 유나야?"],["G","A History of Black Holes? I think it'll be difficult.","'블랙홀의 역사'? 어려울 것 같아."],["B","I don't agree. I think it'll be very interesting.","나는 동의하지 않아. 아주 흥미로울 것 같아."],["G","Hmm ... I didn't know you were interested in black holes. So, are you going to buy the book, Alex?","음... 네가 블랙홀에 관심이 있는 줄 몰랐어. 그래서 그 책을 살 거니, Alex?"],["B","I'd love to, but it's too thick and heavy.","그러고 싶지만, 너무 두껍고 무거워."],["G","Why don't you buy the e-book then? You can read it on your phone.","그럼 전자책을 사는 게 어때? 휴대폰으로 읽을 수 있어."],["B","That's a good idea!","좋은 생각이야!"],["G","And it's also cheaper than the paper book.","그리고 종이책보다 더 싸기도 해."],["B","Really? Then, I'll buy the e-book.","정말? 그럼 전자책을 살게."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["The boy thinks cleaning robots are useless.","The boy already has a cleaning robot at home.","The girl likes to clean her room.","The girl also needs a cleaning robot.","They are talking about buying a robot online."],"a":3,"ans":"The girl also needs a cleaning robot.","evs":[["I think they are very helpful. I really need one at home.","나는 매우 도움이 된다고 생각해. 집에 정말 하나 필요해."],["Me, too. I don't like to clean my room.","나도 그래. 나는 내 방 청소하는 걸 좋아하지 않아."]],"ev":["I think they are very helpful. I really need one at home.","나는 매우 도움이 된다고 생각해. 집에 정말 하나 필요해."],"ow":["오답 ✕ — 소년은 'I think they are very helpful.'(나는 매우 도움이 된다고 생각해.)라고 했다. 쓸모없다(useless)는 반대 뜻이라서 틀림.","오답 ✕ — 소년은 'I really need one at home.'(집에 정말 하나 필요해.)라고 했다. 이미 있다면 필요하다고 하지 않을 것이므로 틀림.","오답 ✕ — 소녀는 'I don't like to clean my room.'(나는 내 방 청소하는 걸 좋아하지 않아.)라고 했다. 청소를 좋아한다는 말은 반대라서 틀림.","정답 ○ — 소년이 'I really need one at home.'(집에 정말 하나 필요해.)이라고 하자 소녀가 'Me, too.'(나도 그래.)라고 했다. 소녀도 청소 로봇이 필요하다.","오답 ✕ — 온라인으로 로봇을 산다는 말은 없다. 'There's one over there.'(저기 하나 있어.)처럼 눈앞의 로봇을 보며 이야기하는 상황이라서 틀림."],"memo":["정답: ④ 소녀도 청소 로봇이 필요하다","근거: Me, too. I don't like to clean my room.(나도 그래. 나는 내 방 청소하는 걸 좋아하지 않아.)","함정: 'Me, too.'는 앞 사람의 말에 '나도'라고 동의하는 말"],"why":"소년의 'I really need one'에 소녀가 'Me, too'라고 동의했다."}],"dlg":[["G","What do you think about cleaning robots? There's one over there.","청소 로봇에 대해 어떻게 생각해? 저기 하나 있어."],["B","I think they are very helpful. I really need one at home.","나는 매우 도움이 된다고 생각해. 집에 정말 하나 필요해."],["G","Me, too. I don't like to clean my room.","나도 그래. 나는 내 방 청소하는 걸 좋아하지 않아."],["B","Who does? Cleaning robots are perfect for people like us.","누가 좋아하겠어? 청소 로봇은 우리 같은 사람들에게 딱이야."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["Goldilocks의 머리는 갈색이었다.","Goldilocks는 소셜 미디어에 관심이 없었다.","Goldilocks의 웃긴 사진들도 인기를 얻지 못했다.","Goldilocks는 많은 '좋아요'를 받고 행복했다.","Goldilocks는 더 감동적인 사진을 올리기로 결심했다."],"a":3,"ans":"Goldilocks는 많은 '좋아요'를 받고 행복했다.","evs":[["Now, her posts were getting a lot of likes, and Goldilocks was happy.","이제, 그녀의 게시물은 많은 '좋아요'를 받고 있었고, Goldilocks는 행복했다."]],"ev":["Now, her posts were getting a lot of likes, and Goldilocks was happy.","이제, 그녀의 게시물은 많은 '좋아요'를 받고 있었고, Goldilocks는 행복했다."],"ow":["오답 ✕ — 본문에는 'a little girl with golden hair'(금발의 어린 소녀)라고 했다. 금발이지 갈색 머리가 아니라서 틀림.","오답 ✕ — 'She liked to share photos on social media.'(그녀는 소셜 미디어에 사진을 공유하는 것을 좋아했다.)라고 했다. 관심이 없었다는 말은 반대라서 틀림.","오답 ✕ — 'I should post funny pictures.'(웃긴 사진들을 올려야겠어.)라고 한 뒤 'her posts were getting a lot of likes'(게시물이 많은 '좋아요'를 받고 있었다)고 했다. 웃긴 사진도 인기를 얻지 못했다는 말은 틀림.","정답 ○ — 'Now, her posts were getting a lot of likes, and Goldilocks was happy.'(이제, 그녀의 게시물은 많은 '좋아요'를 받고 있었고, Goldilocks는 행복했다.)라고 했으므로 본문과 일치한다.","오답 ✕ — 'she decided to post more shocking pictures'(더 충격적인 사진들을 올리기로 결심했다)라고 했다. 감동적인(touching) 사진이 아니라 충격적인(shocking) 사진이라서 틀림."],"memo":["정답: ④ Goldilocks는 많은 '좋아요'를 받고 행복했다","근거: her posts were getting a lot of likes, and Goldilocks was happy.(게시물이 많은 '좋아요'를 받았고 그녀는 행복했다.)","함정: ⑤ 감동적인이 아니라 충격적인(shocking) 사진"],"why":"웃긴 사진을 올리자 '좋아요'를 많이 받아 Goldilocks는 행복했다."},{"n":7,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["funny - bored","everyday - excited","shocking - bored","funny - scared","sad - angry"],"a":0,"ans":"funny - bored","evs":[["I should post funny pictures.","웃긴 사진들을 올려야겠어."],["Her followers, however, soon got bored.","하지만, 그녀의 팔로워들은 곧 지루해졌다."]],"ev":["I should post funny pictures.","웃긴 사진들을 올려야겠어."],"ow":["정답 ○ — 'I should post funny pictures.'(웃긴 사진들을 올려야겠어.)라고 해서 올렸고, 'Her followers, however, soon got bored.'(하지만 팔로워들은 곧 지루해졌다.)라고 했으므로 (A)=funny, (B)=bored이다.","오답 ✕ — 일상적인 사진(everyday things)은 '좋아요'를 많이 못 받았던 처음의 사진이다. 또 팔로워들은 신난 것이 아니라 'soon got bored'(곧 지루해졌다)라서 둘 다 틀림.","오답 ✕ — (B) bored는 맞지만, 팔로워들이 지루해진 것은 웃긴 사진을 올린 뒤이다. 충격적인 사진은 그 뒤에 올리기로 결심한 것이라서 (A)가 틀림.","오답 ✕ — (A) funny는 맞지만, 팔로워들이 무서워했다는 말은 없다. 'soon got bored'(곧 지루해졌다)라서 (B)가 틀림.","오답 ✕ — 슬픈 사진이나 화난 팔로워는 본문에 나오지 않는다. 웃긴 사진을 올렸고 팔로워들은 지루해졌으므로 틀림."],"memo":["정답: ① funny - bored","근거: I should post funny pictures.(웃긴 사진들을 올려야겠어.) / Her followers, however, soon got bored.(팔로워들은 곧 지루해졌다.)","함정: shocking(충격적인) 사진은 팔로워가 지루해진 '뒤'에 올리기로 한 것"],"why":"웃긴 사진으로 '좋아요'를 받았지만 팔로워들은 곧 지루해졌다.","sum":"To get more likes, Goldilocks posted (A) pictures, but her followers soon got (B) .","lab":"완성된 요약문 : "}],"pp":[["There was a little girl with golden hair in a small town.","작은 마을에 금발의 어린 소녀가 있었다."],["Her name was Goldilocks.","그녀의 이름은 Goldilocks였다."],["She liked to share photos on social media.","그녀는 소셜 미디어에 사진을 공유하는 것을 좋아했다."],["At first, she posted everyday things, but people didn't give her many likes.","처음에, 그녀는 일상적인 것들을 올렸지만, 사람들은 그녀에게 '좋아요'를 많이 주지 않았다."],["\"What should I do to get more likes?\" she thought.","\"어떻게 하면 더 많은 '좋아요'를 받을 수 있지?\" 그녀는 생각했다."],["\"I know!","\"알았다!"],["I should post funny pictures.\"","웃긴 사진들을 올려야겠어.\""],["Now, her posts were getting a lot of likes, and Goldilocks was happy.","이제, 그녀의 게시물은 많은 '좋아요'를 받고 있었고, Goldilocks는 행복했다."],["Her followers, however, soon got bored.","하지만, 그녀의 팔로워들은 곧 지루해졌다."],["So, she decided to post more shocking pictures.","그래서, 그녀는 더 충격적인 사진들을 올리기로 결심했다."]]},{"qs":[{"n":8,"q":"윗글의 제목으로 알맞은 것은?","o":["Why Is Taking Selfies Fun?","Goldilocks' Careful Behaviors","A Warm Welcome on a Rainy Day","The Invitation from the Bear Family","Goldilocks' Rude Actions in the Cottage"],"a":4,"ans":"Goldilocks' Rude Actions in the Cottage","evs":[["She opened the door and walked inside.","그녀는 문을 열고 안으로 걸어 들어갔다."],["It broke, but she didn't care.","의자가 부서졌지만, 그녀는 신경 쓰지 않았다."]],"ev":["She opened the door and walked inside.","그녀는 문을 열고 안으로 걸어 들어갔다."],"ow":["오답 ✕ — 셀피를 찍는 장면은 있지만 'She ate the smallest one and took selfies'(가장 작은 그릇의 수프를 먹었고 셀피를 찍었다)처럼 남의 집에서 한 행동 중 일부일 뿐이다. 글 전체는 남의 집에서 한 무례한 행동이라서 틀림.","오답 ✕ — 'It broke, but she didn't care.'(의자가 부서졌지만, 그녀는 신경 쓰지 않았다.)처럼 조심스럽지 않은 행동을 한다. Careful(조심스러운)은 반대라서 틀림.","오답 ✕ — 'She knocked on the door, but there was no answer.'(문을 두드렸지만, 아무 대답이 없었다.)고 했다. 환영해 준 사람이 없으므로 틀림.","오답 ✕ — 곰 가족이 초대했다는 말은 없다. 'there was no answer'(아무 대답이 없었다)인데도 그녀가 스스로 들어갔으므로 틀림.","정답 ○ — 아무 대답이 없는데도 'She opened the door and walked inside.'(문을 열고 안으로 걸어 들어갔다.), 수프를 먹고 의자를 부수고도 'she didn't care'(신경 쓰지 않았다)였다. 오두막에서의 무례한 행동이 글의 중심이다."],"memo":["정답: ⑤ Goldilocks' Rude Actions in the Cottage (오두막에서의 무례한 행동)","근거: She opened the door and walked inside.(문을 열고 안으로 걸어 들어갔다.) / It broke, but she didn't care.(의자가 부서졌지만 신경 쓰지 않았다.)","함정: ① 셀피는 세부 내용일 뿐"],"why":"허락 없이 들어가 수프를 먹고 의자를 부순 무례한 행동이 중심 내용이다."},{"n":9,"q":"Goldilocks에 대한 설명으로 일치하지 않는 것은?","o":["She found a cottage in the forest.","There was no answer when she knocked on the door.","She ate the smallest bowl of soup.","She cared a lot when the smallest chair broke.","She fell asleep in the smallest bed."],"a":3,"ans":"She cared a lot when the smallest chair broke.","evs":[["It
