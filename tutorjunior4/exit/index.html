ht / (B) engineer","(A) light / (B) microphone","(A) rope / (B) engineer","(A) pipe / (B) screen"],"r":{"a":"3) (A) light / (B) microphone (조명 / 마이크)","ev":"10번 문장","s":[[10,"It has a light on its head, as well as a camera, a speaker, and a microphone.","그것은 머리에 카메라와 스피커, 마이크뿐만 아니라 조명도 가지고 있다."]],"w":"1번에서 지진 후 건물이 붕괴되었고(collapsed), 2번에서 안에 갇힌(trapped) 사람이 있는지 묻고, 4번에서 그 일은 로봇 뱀의 일이라고 해요.","c":3},"h":"69b3d45b17"},{"n":10,"t":"fill","q":"Therefore, it can gather [A] [B] about the situation inside.","ko":"그러므로, 그것은 내부 상황에 대한 [A] [B]을(를) 모을 수 있다.","bank":["important","information","rope","engineer","twisting","speaker"],"bko":{"important":"중요한","information":"정보","rope":"밧줄","engineer":"기술자","twisting":"구부리기","speaker":"스피커"},"r":{"a":"[A] important (중요한), [B] information (정보)","ev":"11번 문장","s":[[11,"Therefore, it can gather important information about the situation inside.","그러므로, 그것은 내부 상황에 대한 중요한 정보를 모을 수 있다."]],"w":"10번에서 로봇 뱀이 카메라와 스피커, 마이크를 가지고 있고, 11번에서 내부 상황에 대한 중요한 정보를 모을 수 있다(gather important information about the situation inside)고 해요. rope와 engineer는 정보를 모으는 말이 아니에요.","c":null},"h":"21364751cd"}]},{"u":5,"id":"rj4-05-3","no":3,"ko":"연기만 잘하는 게 아니었어!","items":[{"n":1,"t":"tf","q":"In her free time, Lamarr worked on a variety of inventions.","ko":"여가 시간에 Lamarr는 다양한 발명품에 공을 들였다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"So in her free time, she worked on a variety of inventions, including an improved traffic light and a tablet that changed water into a soft drink.","그래서 여가 시간에, 그녀는 개선된 신호등과 물을 청량음료로 바꾸는 알약을 포함하여 다양한 발명품에 공을 들였다."]],"w":"3번에서 So in her free time, she worked on a variety of inventions라고 해요. 본문과 일치해요.","c":"T"},"h":"8bc07b6a7b"},{"n":2,"t":"tf","q":"The U.S. Navy used Lamarr's invention during World War II.","ko":"미국 해군은 제2차 세계대전 동안 Lamarr의 발명품을 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Although it was never used during World War II, the U.S. Navy began using it 20 years later.","그것은 제2차 세계대전 동안 한 번도 사용되지 않았지만, 미국 해군이 20년 후에 그것을 사용하기 시작했다."]],"w":"8번에서 그 발명은 제2차 세계대전 동안 never used(한 번도 사용되지 않았다)이고, 미국 해군은 20년 후에 사용하기 시작했다고 해요.","c":"F"},"h":"9b5609a816"},{"n":3,"t":"tf","q":"During World War II, Lamarr wanted to help America and its allies.","ko":"제2차 세계대전 동안 Lamarr는 미국과 그 연합국을 돕고 싶었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"During World War II, Lamarr wanted to help America and its allies.","제2차 세계대전 동안, Lamarr는 미국과 그 연합국을 돕고 싶었다."]],"w":"4번에 During World War II, Lamarr wanted to help America and its allies가 그대로 있어요. 본문과 일치해요.","c":"T"},"h":"d5c7931ff2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It could be used to stop the enemy from blocking messages.)","ko":"그것은 적이 메시지를 ( ) 것을 막는 데 사용될 수 있었다.","opts":["꾸미는","차단하는","번역하는","그리는"],"word":"blocking","r":{"a":"2) 차단하는","ev":"7번 문장","s":[[7,"It could be used to stop the enemy from blocking messages.","그것은 적이 메시지를 차단하는 것을 막는 데 사용될 수 있었다."]],"w":"7번은 발명한 방법이 무엇에 쓰이는지 설명해요. 적이 메시지를 못 쓰게 막는 것이므로 blocking은 '차단하는'이에요.","c":2},"h":"190c038619"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...including an improved traffic light and a tablet that changed water into a soft drink.)","ko":"그녀가 만든 것에는 ( ) 신호등과 물을 청량음료로 바꾸는 알약이 포함되어 있었다.","opts":["개선된","고장 난","오래된","값싼"],"word":"improved","r":{"a":"1) 개선된","ev":"3번 문장","s":[[3,"So in her free time, she worked on a variety of inventions, including an improved traffic light and a tablet that changed water into a soft drink.","그래서 여가 시간에, 그녀는 개선된 신호등과 물을 청량음료로 바꾸는 알약을 포함하여 다양한 발명품에 공을 들였다."]],"w":"발명품 가운데 하나로 나온 신호등이라서, 더 나아지게 고친 신호등이라는 뜻이에요. 그래서 improved는 '개선된'이에요.","c":1},"h":"f724588111"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nShe decided to invent new technology that could be used to win battles.","ko":"밑줄 친 \"that\"이 가리키는 것은?","sko":"그녀는 전투에서 이기는 데 사용될 수 있는 새로운 기술을 발명하기로 결심했다.","opts":["새로운 기술","전투","미국","연합국"],"r":{"a":"1) 새로운 기술","ev":"5번 문장","s":[[5,"She decided to invent new technology that could be used to win battles.","그녀는 전투에서 이기는 데 사용될 수 있는 새로운 기술을 발명하기로 결심했다."]],"w":"6번에서 Lamarr가 발명한 것은 a way of quickly switching between radio frequencies예요. 7번의 It은 바로 앞에 나온 이 방법이에요.","c":1,"k":"that = 새로운 기술"},"pron":"that","h":"ac945cbfc2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In 1997, Lamarr and Antheil were honored for their work.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"1997년에, Lamarr와 Antheil은 그들의 노고로 상을 받았다.","opts":["1997년에 Lamarr와 Antheil은 일을 그만두었다.","1997년에 Lamarr와 Antheil은 다른 사람들의 업적을 칭찬했다.","1997년에 Lamarr와 Antheil은 자신들의 업적으로 상을 받았다.","1997년에 Lamarr와 Antheil은 처음 만나 함께 일하기 시작했다."],"r":{"a":"3) 1997년에 Lamarr와 Antheil은 자신들의 업적으로 상을 받았다.","ev":"9번 문장","s":[[9,"In 1997, Lamarr and Antheil were honored for their work.","1997년에, Lamarr와 Antheil은 그들의 노고로 상을 받았다."]],"w":"were honored for their work는 자신들의 일(업적) 때문에 상을 받았다는 뜻이에요. 칭찬한 쪽이 아니라 받은 쪽이에요.","c":3},"h":"6bb6d2cd21"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Lamarr는 여배우로서 유명하지 않았다.","Lamarr는 여배우가 된 뒤 발명을 그만두었다.","Lamarr는 여가 시간에 발명을 전혀 하지 않았다.","Lamarr는 유명했지만 연기가 지루하다고 생각했다."],"opts":["Lamarr was not famous as an actress.","Lamarr stopped inventing after she became an actress.","Lamarr never worked on any inventions in her free time.","Lamarr was famous, but she found acting boring."],"r":{"a":"4) Lamarr was famous, but she found acting boring. (Lamarr는 유명했지만 연기가 지루하다고 생각했다.)","ev":"1~3번 문장","s":[[1,"Hedy Lamarr was a Hollywood actress.","Hedy Lamarr는 할리우드 여배우였다."],[2,"She was very famous, but she found acting boring.","그녀는 매우 유명했지만, 연기가 지루하다고 생각했다."],[3,"So in her free time, she worked on a variety of inventions, including an improved traffic light and a tablet that changed water into a soft drink.","그래서 여가 시간에, 그녀는 개선된 신호등과 물을 청량음료로 바꾸는 알약을 포함하여 다양한 발명품에 공을 들였다."]],"w":"3번에서 물을 청량음료로 바꾸는 알약을 발명했다고 해요. 연기는 지루하다고 생각했고(2번), 그 발명은 전쟁 동안 한 번도 사용되지 않았으며(8번), 여가 시간에 다양한 발명을 했어요(3번).","c":4},"h":"0f3287f13e"},{"n":9,"t":"sum","q":"Working together with a (A) named George Antheil, Lamarr invented a way of (B) switching between radio frequencies.","ko":"George Antheil이라는 이름의 한 (A)와(과) 함께 작업하며, Lamarr는 무선 주파수를 (B) 전환하는 방법을 발명했다.","oko":["(A) 가수 / (B) 빠르게","(A) 작곡가 / (B) 느리게","(A) 가수 / (B) 느리게","(A) 작곡가 / (B) 빠르게","(A) 의사 / (B) 드물게"],"opts":["(A) singer / (B) quickly","(A) composer / (B) slowly","(A) singer / (B) slowly","(A) composer / (B) quickly","(A) doctor / (B) rarely"],"r":{"a":"4) (A) composer / (B) quickly (작곡가 / 빠르게)","ev":"6번 문장","s":[[6,"Working together with a composer named George Antheil, Lamarr invented a way of quickly switching between radio frequencies.","George Antheil이라는 이름의 한 작곡가와 함께 작업하며, Lamarr는 무선 주파수를 빠르게 전환하는 방법을 발명했다."]],"w":"6번에서 발명한 것은 주파수를 빠르게 전환하는(switching) 방법이고, 7번에서 그것으로 적이 메시지를 차단하는(blocking) 것을 막을 수 있다고 해요. (A)와 (B)를 바꾸면 말이 되지 않아요.","c":4},"h":"7d49c6cd11"},{"n":10,"t":"fill","q":"Their invention helped others [A] [B] new technology, including Bluetooth, Wi-Fi, and GPS.","ko":"그들의 발명은 다른 사람들이 블루투스와 와이파이, GPS를 포함하여 [B] 신기술을 [A] 것을 도왔다.","bank":["develop","important","messages","allies","enemy","frequencies"],"bko":{"develop":"개발하는(develop의 원형)","important":"중요한","allies":"연합국들","enemy":"적","frequencies":"주파수들","messages":"메시지들"},"r":{"a":"[A] develop (개발하는(develop의 원형)), [B] important (중요한)","ev":"10번 문장","s":[[10,"Their invention helped others develop important new technology, including Bluetooth, Wi-Fi, and GPS.","그들의 발명은 다른 사람들이 블루투스와 와이파이, GPS를 포함하여 중요한 신기술을 개발하는 것을 도왔다."]],"w":"10번에서 그 발명이 다른 사람들이 신기술을 개발하는(develop) 것을 도왔고, 11번에서 refer to Lamarr as ~(Lamarr를 ~라고 부르다)라고 해요. block, win, switch는 이 두 자리에 맞지 않아요.","c":null},"h":"73e08c0e9b"}]},{"u":5,"id":"rj4-05-4","no":4,"ko":"액체지만 강력해!","items":[{"n":1,"t":"tf","q":"Speed bumps make drivers slow down to a safer speed.","ko":"과속 방지턱은 운전자들이 더 안전한 속도로 감속하게 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They force drivers to slow down to a safer speed.","그것들은 운전자들이 더 안전한 속도로 감속하게 한다."]],"w":"2번에서 They force drivers to slow down to a safer speed라고 해요. 본문과 일치해요.","c":"T"},"h":"ea16c14b21"},{"n":2,"t":"tf","q":"Drivers can drive over speed bumps at any speed without damaging their cars.","ko":"운전자들은 어떤 속도로든 자동차를 손상시키지 않고 과속 방지턱을 넘을 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"If they don’t, they risk damaging their car as they drive over the speed bump.","만약 그렇게 하지 않으면, 그들은 과속 방지턱을 넘을 때 자동차를 손상시킬 위험이 있다."]],"w":"3번에서 감속하지 않으면 과속 방지턱을 넘을 때 자동차를 손상시킬 위험이 있다고 해요. 어떤 속도로든 괜찮다는 말은 반대예요.","c":"F"},"h":"d0cc1595fc"},{"n":3,"t":"tf","q":"The company says the liquid is dangerous for the environment.","ko":"그 회사는 그 액체가 환경에 위험하다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"And more importantly, the company says the liquid is safe and won’t harm the environment.","그리고 더 중요한 것은, 그 회사는 그 액체가 안전하고 환경을 해치지 않을 것이라고 말한다."]],"w":"12번에서 회사는 액체가 안전하고 환경을 해치지 않을 것(won't harm the environment)이라고 말해요. 위험하다는 말은 반대예요.","c":"F"},"h":"664fa26893"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The strong impact causes the liquid to harden and become an obstacle.)","ko":"그 강한 ( )은 그 액체가 굳어지도록 하고 장애물이 된다.","opts":["충격","소리","온도","색깔"],"word":"impact","r":{"a":"1) 충격","ev":"9번 문장","s":[[9,"The strong impact causes the liquid to harden and become an obstacle.","그 강한 충격은 그 액체가 굳어지도록 하고 장애물이 된다."]],"w":"빠른 속도로 방지턱을 넘으면 액체가 굳는다는 흐름이에요. 자동차가 세게 부딪치는 힘이므로 impact는 '충격'이에요.","c":1},"h":"8eaf83dd6e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Liquid speed bumps are easy to install.)","ko":"액체 과속 방지턱은 ( ) 쉽다.","opts":["수리하기","팔기","설치하기","버리기"],"word":"install","r":{"a":"3) 설치하기","ev":"11번 문장","s":[[11,"Liquid speed bumps are easy to install.","액체 과속 방지턱은 설치하기 쉽다."]],"w":"12번에서 이어서 더 중요한 장점을 말하는 것으로 보아, 11번은 장점 중 하나예요. 방지턱을 도로에 놓는 일이므로 install은 '설치하다'예요.","c":3},"h":"e026055602"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are made of strong plastic and contain a special liquid.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 강한 플라스틱으로 만들어졌고 특별한 액체가 들어있다.","opts":["운전자들","액체 과속 방지턱","이웃 사람들","회사들"],"r":{"a":"2) 액체 과속 방지턱","ev":"5~6번 문장","s":[[5,"To deal with this problem, a company has created liquid speed bumps.","이 문제를 해결하기 위해 한 회사는 액체 과속 방지턱을 만들었다."],[6,"They are made of strong plastic and contain a special liquid.","그것들은 강한 플라스틱으로 만들어졌고 특별한 액체가 들어있다."]],"w":"5번에서 회사가 만든 것이 액체 과속 방지턱(liquid speed bumps)이고, 6번의 They는 그 방지턱들이에요.","c":2},"h":"f8c2188dbf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Speed bumps are everywhere, and they have an important purpose.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"과속 방지턱은 어디에나 있고, 그것들은 중요한 목적을 가지고 있다.","opts":["과속 방지턱은 어디에나 있고, 중요한 목적을 가지고 있다.","과속 방지턱은 어디에도 없지만, 중요한 목적을 가지고 있다.","과속 방지턱은 어디에나 있지만, 아무 목적도 없다.","과속 방지턱은 중요한 목적 때문에 모두 없어졌다."],"r":{"a":"1) 과속 방지턱은 어디에나 있고, 중요한 목적을 가지고 있다.","ev":"1번 문장","s":[[1,"Speed bumps are everywhere, and they have an important purpose.","과속 방지턱은 어디에나 있고, 그것들은 중요한 목적을 가지고 있다."]],"w":"1번 문장은 과속 방지턱이 어디에나 있고(everywhere) 중요한 목적(important purpose)이 있다는 뜻이에요.","c":1},"h":"30ba91e46e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["액체 과속 방지턱은 금속으로만 만들어진다.","과속 방지턱 안의 액체는 항상 단단해진다.","액체 과속 방지턱은 도로를 깨끗하게 유지하려고 만들어졌다.","자동차가 액체 과속 방지턱을 천천히 넘을 때 액체는 액체로 남아 있다."],"opts":["Liquid speed bumps are made only of metal.","The liquid in a speed bump always turns hard.","Liquid speed bumps were created to keep the road clean.","When a car drives slowly over a liquid speed bump, the liquid stays a liquid."],"r":{"a":"4) When a car drives slowly over a liquid speed bump, the liquid stays a liquid. (자동차가 액체 과속 방지턱을 천천히 넘을 때 액체는 액체로 남아 있다.)","ev":"4번, 6~7번, 9번 문장","s":[[4,"However, speed bumps sometimes damage cars even when they’re moving at slow speeds.","그러나 자동차들이 느린 속도로 이동할 때도 과속 방지턱은 때때로 그것들을 손상시킨다."],[6,"They are made of strong plastic and contain a special liquid.","그것들은 강한 플라스틱으로 만들어졌고 특별한 액체가 들어있다."],[7,"When a car drives slowly over one of these speed bumps, the liquid remains a liquid.","자동차가 이러한 과속 방지턱 중 하나를 천천히 넘을 때, 그 액체는 액체로 남아있다."],[9,"The strong impact causes the liquid to harden and become an obstacle.","그 강한 충격은 그 액체가 굳어지도록 하고 장애물이 된다."]],"w":"6번에서 강한 플라스틱으로 만들어지고 특별한 액체가 들어 있다고 해요. 설치하기 쉽고(11번) 환경을 해치지 않아요(12번).","c":4},"h":"215015b812"},{"n":9,"t":"sum","q":"If a car drives over a liquid speed bump at (A) speeds, something (B) happens.","ko":"자동차가 액체 과속 방지턱을 (A) 속도로 넘으면, (B) 일이 일어난다.","oko":["(A) 느린 / (B) 놀라운","(A) 빠른 / (B) 지루한","(A) 느린 / (B) 지루한","(A) 빠른 / (B) 놀라운","(A) 속도가 없는 / (B) 슬픈"],"opts":["(A) low / (B) amazing","(A) high / (B) boring","(A) low / (B) boring","(A) high / (B) amazing","(A) zero / (B) sad"],"r":{"a":"4) (A) high / (B) amazing (빠른 / 놀라운)","ev":"8번 문장","s":[[8,"But if a car drives over one at high speeds, something amazing happens.","하지만 만약 자동차가 빠른 속도로 과속 방지턱을 넘으면, 놀라운 일이 일어난다."]],"w":"7번에서 자동차가 천천히(slowly) 넘으면 액체는 액체로 남고, 8~9번에서 빠른 속도(high speeds)로 넘으면 액체가 굳는다고 해요.","c":4},"h":"7c9dbd253b"},{"n":10,"t":"fill","q":"Therefore, these new speed bumps cause problems only for [A] drivers and don't [B] slow drivers.","ko":"그러므로 이 새로운 과속 방지턱은 [A] 운전자에게만 문제를 일으키고 느린 운전자에게는 [B] 않는다.","bank":["fast","affect","liquid","harden","obstacle","plastic"],"bko":{"fast":"빠른","affect":"영향을 미치지(affect의 부정 표현)","harden":"굳다","obstacle":"장애물","plastic":"플라스틱","liquid":"액체"},"r":{"a":"[A] fast (빠른), [B] affect (영향을 미치지(affect의 부정 표현))","ev":"10번 문장","s":[[10,"Therefore, these new speed bumps cause problems only for fast drivers and don’t affect slow drivers.","그러므로 이 새로운 과속 방지턱은 빠른 운전자에게만 문제를 일으키고 느린 운전자에게는 영향을 미치지 않는다."]],"w":"10번 Therefore, these new speed bumps cause problems only for fast drivers and don't affect slow drivers에서 가져왔어요. install, harden은 이 문장 자리에 맞지 않고 obstacle, plastic은 명사라 들어갈 수 없어요.","c":null},"h":"07d388bd2b"}]},{"u":6,"id":"rj4-06-1","no":1,"ko":"이거 내 얘기잖아?","items":[{"n":1,"t":"tf","q":"People might feel that a personality test describes them personally, even though the information is true for lots of people.","ko":"성격 검사의 정보가 많은 사람에게 사실일 수 있는데도, 사람들은 그 검사가 자신을 개인적으로 설명한다고 느낄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Even though the information it provides could be true for lots of people, you might feel like it describes you personally.","비록 그것이 제공하는 정보가 많은 사람들에게 사실일 수 있지만, 당신은 그것이 당신을 개인적으로 설명하는 것처럼 느낄지도 모른다."]],"w":"2번에서 정보가 많은 사람에게 사실일 수 있어도 그것이 나를 개인적으로 설명하는 것처럼 느낄지도 모른다고 해요. 본문과 일치해요.","c":"T"},"h":"90f6ef039d"},{"n":2,"t":"tf","q":"Most personality tests give very clear and detailed descriptions of a person.","ko":"대부분의 성격 검사는 사람에 대해 매우 분명하고 자세한 설명을 준다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Many personality tests, such as the MBTI, tend to provide a rather vague description of one’s personality.","MBTI 같은 많은 성격 검사들은 사람의 성격에 대해 다소 모호한 설명을 제공하는 경향이 있다."]],"w":"6번에서 많은 성격 검사는 사람의 성격에 대해 다소 모호한(vague) 설명을 제공하는 경향이 있다고 해요. 분명하고 자세하다는 말은 반대예요.","c":"F"},"h":"580713c8f5"},{"n":3,"t":"tf","q":"The writer says broad statements may not show your true self.","ko":"글쓴이는 광범위한 진술이 당신의 진정한 모습을 보여주지 않을 수 있다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"To avoid falling for the Barnum effect, remember that broad statements can apply to lots of people and may not show your true self.","바넘 효과에 빠지지 않으려면 광범위한 진술이 많은 사람들에게 적용될 수 있고 당신의 진정한 모습을 보여주지 않을 수 있음을 기억해라."]],"w":"9번에서 광범위한 진술은 많은 사람에게 적용될 수 있고 당신의 진정한 모습을 보여주지 않을 수 있다(may not show your true self)고 해요. 본문과 일치해요.","c":"T"},"h":"21dfb1d6b6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Many personality tests tend to provide a rather vague description of one's personality.)","ko":"MBTI 같은 많은 성격 검사들은 사람의 성격에 대해 다소 ( ) 설명을 제공하는 경향이 있다.","opts":["모호한","정확한","자세한","재미있는"],"word":"vague","r":{"a":"1) 모호한","ev":"6번 문장","s":[[6,"Many personality tests, such as the MBTI, tend to provide a rather vague description of one’s personality.","MBTI 같은 많은 성격 검사들은 사람의 성격에 대해 다소 모호한 설명을 제공하는 경향이 있다."]],"w":"7번에서 그 설명은 널리 마음을 끌도록 일부러 설계되었다고 해요. 누구에게나 맞게 만든 설명이라 분명하지 않고 애매하다는 뜻이므로 vague는 '모호한'이에요.","c":1},"h":"44d90fc4d1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...those descriptions are designed to be broadly appealing on purpose.)","ko":"...그러한 설명은 의도적으로 광범위하게 ( ) 설계되었다.","opts":["지루한","마음을 끄는","무서운","낯선"],"word":"appealing","r":{"a":"2) 마음을 끄는","ev":"7번 문장","s":[[7,"In fact, those descriptions are designed to be broadly appealing on purpose.","사실, 그러한 설명은 광범위하게 마음을 끌도록 의도적으로 설계되었다."]],"w":"누구에게나 해당하는 설명을 일부러 만든 이유는 많은 사람이 자기 얘기라고 느끼게 하기 위해서예요. 그래서 appealing은 '마음을 끄는'이에요.","c":2},"h":"55f670ebd9"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nYet individuals often think of them as their own unique personality traits.","ko":"밑줄 친 them이 가리키는 것은?","sko":"하지만 개인들은 흔히 그것들을 자신들만의 고유한 성격 특성으로 여긴다.","opts":["점성술들","성격 검사 회사들","그러한 성격 설명들","개인들"],"r":{"a":"3) 그러한 성격 설명들","ev":"7~8번 문장","s":[[7,"In fact, those descriptions are designed to be broadly appealing on purpose.","사실, 그러한 설명은 광범위하게 마음을 끌도록 의도적으로 설계되었다."],[8,"Yet individuals often think of them as their own unique personality traits.","하지만 개인들은 흔히 그것들을 자신들만의 고유한 성격 특성으로 여긴다."]],"w":"7번에서 널리 마음을 끌도록 설계된 those descriptions(그러한 설명들)가 나오고, 8번의 them은 그 설명들이에요. 개인들(individuals)은 여기서 생각하는 쪽이에요.","c":3},"h":"a63ac601b6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It has been found in individuals responding to horoscopes, fortune-telling, and various personality tests.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 점성술, 점 보기, 그리고 다양한 성격 검사에 응답하는 개인에게서 발견된다.","opts":["그것은 점성술가들과 점쟁이들에게서만 발견된다.","그것은 다양한 성격 검사를 만드는 사람들에게서 발견된다.","그것은 점성술에 응답하는 사람에게서는 발견되지 않고 성격 검사에서만 발견된다.","그것은 점성술, 점 보기, 다양한 성격 검사에 응답하는 개인에게서 발견된다."],"r":{"a":"4) 그것은 점성술, 점 보기, 다양한 성격 검사에 응답하는 개인에게서 발견된다.","ev":"5번 문장","s":[[5,"It has been found in individuals responding to horoscopes, fortune-telling, and various personality tests.","그것은 점성술, 점 보기, 그리고 다양한 성격 검사에 응답하는 개인에게서 발견된다."]],"w":"individuals responding to ...는 '~에 응답하는 개인들'이에요. 검사를 만드는 사람이 아니라 응답하는 사람에게서 나타나는 효과예요.","c":4},"h":"145653f37d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["바넘 효과는 일종의 성격 검사이다.","바넘 효과는 일종의 인지적 편향이다.","바넘 효과는 일종의 점성술이다.","바넘 효과는 MBTI의 새로운 이름이다."],"opts":["The Barnum effect is a kind of personality test.","The Barnum effect is a kind of cognitive bias.","The Barnum effect is a kind of horoscope.","The Barnum effect is a new name for the MBTI."],"r":{"a":"2) The Barnum effect is a kind of cognitive bias. (바넘 효과는 일종의 인지적 편향이다.)","ev":"4번 문장","s":[[4,"The Barnum effect is a cognitive bias that leads people to believe that general personality descriptions accurately represent them as individuals.","바넘 효과는 사람들이 일반적인 성격 묘사가 그들을 개개인으로 정확하게 나타낸다고 믿게 하는 인지적 편향이다."]],"w":"4번에서 바넘 효과는 cognitive bias(인지적 편향)라고 해요. 성격 검사나 점성술은 바넘 효과가 나타나는 상황일 뿐, 바넘 효과 자체가 아니에요.","c":2},"h":"af9b526068"},{"n":9,"t":"sum","q":"To (A) falling for the Barnum effect, remember that broad statements can (B) to lots of people.","ko":"바넘 효과에 빠지는 것을 (A) 위해, 광범위한 진술이 많은 사람들에게 (B) 수 있음을 기억해라.","oko":["(A) 즐기기 / (B) 숨길","(A) 즐기기 / (B) 적용될","(A) 피하기 / (B) 적용될","(A) 피하기 / (B) 숨길","(A) 잊기 / (B) 적용될"],"opts":["(A) enjoy / (B) hide","(A) enjoy / (B) apply","(A) avoid / (B) apply","(A) avoid / (B) hide","(A) forget / (B) apply"],"r":{"a":"3) (A) avoid / (B) apply (피하기 / 적용될)","ev":"9번 문장","s":[[9,"To avoid falling for the Barnum effect, remember that broad statements can apply to lots of people and may not show your true self.","바넘 효과에 빠지지 않으려면 광범위한 진술이 많은 사람들에게 적용될 수 있고 당신의 진정한 모습을 보여주지 않을 수 있음을 기억해라."]],"w":"9번 문장에서 바넘 효과에 빠지지 않으려면(To avoid falling for the Barnum effect), 광범위한 진술이 많은 사람들에게 적용될 수 있다(can apply to lots of people)는 점을 기억하라고 해요.","c":3},"h":"341f715696"},{"n":10,"t":"fill","q":"This [A] is [B] the Barnum effect.","ko":"이 [A]은(는) 바넘 효과라고 [B].","bank":["phenomenon","called","individuals","horoscopes","designed","found"],"bko":{"phenomenon":"현상","called":"불리는(call의 과거분사)","individuals":"개인들","horoscopes":"점성술","designed":"설계된(design의 과거분사)","found":"발견된(find의 과거분사)"},"r":{"a":"[A] phenomenon (현상), [B] called (불리는(call의 과거분사))","ev":"3번 문장","s":[[3,"This phenomenon is called the Barnum effect.","이 현상은 바넘 효과라고 불린다."]],"w":"3번 This phenomenon is called the Barnum effect.에서 가져왔어요. 'A is called B'는 'A는 B라고 불린다'는 뜻이라 called가 알맞고, 앞의 This가 가리키는 말이 phenomenon(현상)이에요. 나머지 단어는 이 두 자리에 문법이나 의미가 맞지 않아요.","c":null},"h":"1f2d2f1b65"}]},{"u":6,"id":"rj4-06-2","no":2,"ko":"7,600km를 이어준 위성 사진","items":[{"n":1,"t":"tf","q":"An Australian family adopted Saroo, and he had a happy life.","ko":"한 호주 가정이 Saroo를 가족으로 받아들였고, 그는 행복한 삶을 살았다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Saroo was adopted by an Australian family and had a happy life.","Saroo는 한 호주 가정에 의해 입양되었고 행복한 삶을 살았다."]],"w":"2번에서 Saroo는 호주 가정에 입양되었고 행복한 삶을 살았다고 해요. 본문과 일치해요.","c":"T"},"h":"2d137d99b3"},{"n":2,"t":"tf","q":"In college, Saroo began to search satellite images of Australia to find his hometown.","ko":"대학에서 Saroo는 고향을 찾기 위해 호주의 위성 사진을 찾아보기 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In college, Saroo began to search satellite images of India to find his hometown.","대학에서, Saroo는 그의 고향을 찾기 위해 인도의 위성 사진을 찾아보기 시작했다."]],"w":"4번에서 Saroo가 찾아본 것은 호주가 아니라 인도(India)의 위성 사진이에요. 고향이 인도에 있기 때문이에요.","c":"F"},"h":"74d7e2ab9f"},{"n":3,"t":"tf","q":"Saroo traveled to India one year after he found Ganesh Talai.","ko":"Saroo는 Ganesh Talai를 찾은 지 일 년 후에 인도로 갔다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번, 9번 문장","s":[[7,"After many years, Saroo accidently found a familiar-looking small town called Ganesh Talai.","수년 후, Saroo는 Ganesh Talai라고 불리는 눈에 익은 작은 마을을 우연히 찾았다."],[9,"One year later, Saroo traveled to India to find his family.","일 년 후, Saroo는 그의 가족을 찾기 위해 인도로 갔다."]],"w":"9번에서 One year later(일 년 후) Saroo가 가족을 찾으러 인도로 갔다고 하고, 그 앞 7번에서 Ganesh Talai를 찾았다고 해요. 본문과 일치해요.","c":"T"},"h":"1315efc1fc"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Saroo was adopted by an Australian family and had a happy life.)","ko":"Saroo는 한 호주 가정에 의해 ( ) 행복한 삶을 살았다.","opts":["입양되었고","해고되었고","초대되었고","기억되었고"],"word":"adopted","r":{"a":"1) 입양되었고","ev":"2번 문장","s":[[2,"Saroo was adopted by an Australian family and had a happy life.","Saroo는 한 호주 가정에 의해 입양되었고 행복한 삶을 살았다."]],"w":"1번에서 길을 잃은 아이가 호주 가정에서 행복하게 살았다는 흐름이에요. 새 가정의 아이가 되었다는 뜻이므로 adopted는 '입양되었다'예요.","c":1},"h":"881e1303aa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Saroo repeatedly stopped and restarted his search.)","ko":"Saroo는 찾는 것을 ( ) 멈췄다가 다시 시작했다.","opts":["처음으로","반복적으로","영원히","우연히"],"word":"repeatedly","r":{"a":"2) 반복적으로","ev":"6번 문장","s":[[6,"Saroo repeatedly stopped and restarted his search.","Saroo는 찾는 것을 반복적으로 멈췄다가 다시 시작했다."]],"w":"찾는 일이 쉽지 않아서(5번) 멈췄다가 다시 시작하기를 되풀이했다는 뜻이에요. 그래서 repeatedly는 '반복적으로'예요.","c":2},"h":"64d92bae15"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis was the name that Saroo mispronounced as \"Ginestlay!\"","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 Saroo가 ‘Ginestlay’로 잘못 발음한 그 이름이었다!","opts":["Kolkata의 거리","호주의 가정","Ganesh Talai라는 마을의 이름","어린 시절 집 근처의 랜드마크"],"r":{"a":"3) Ganesh Talai라는 마을의 이름","ev":"7~8번 문장","s":[[7,"After many years, Saroo accidently found a familiar-looking small town called Ganesh Talai.","수년 후, Saroo는 Ganesh Talai라고 불리는 눈에 익은 작은 마을을 우연히 찾았다."],[8,"This was the name that Saroo mispronounced as “Ginestlay!”","이것은 Saroo가 ‘Ginestlay’로 잘못 발음한 그 이름이었다!"]],"w":"7번에서 Saroo가 우연히 찾은 눈에 익은 마을이 Ganesh Talai예요. 8번의 This는 그 마을의 이름이고, 5번의 Ginestlay와 이어져요.","c":3},"h":"13a518a004"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, he never stopped hoping to find his family in India.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 그는 인도에 있는 그의 가족을 찾기를 바라는 것을 절대 멈추지 않았다.","opts":["하지만 그는 인도에 있는 가족을 찾기 위해 잠시 멈춰 섰다.","하지만 그는 인도에 있는 가족을 찾을 수 있다는 희망을 버렸다.","하지만 그는 인도에서 가족을 찾기를 바라는 사람을 도왔다.","하지만 그는 인도에 있는 가족을 찾기를 바라는 것을 한 번도 멈추지 않았다."],"r":{"a":"4) 하지만 그는 인도에 있는 가족을 찾기를 바라는 것을 한 번도 멈추지 않았다.","ev":"3번 문장","s":[[3,"However, he never stopped hoping to find his family in India.","하지만, 그는 인도에 있는 그의 가족을 찾기를 바라는 것을 절대 멈추지 않았다."]],"w":"never stopped hoping to find는 '찾기를 바라는 것을 절대 멈추지 않았다'예요. 「stop+v-ing」는 '~하던 것을 멈추다'이고, 앞에 never가 있어서 계속 바랐다는 뜻이에요.","c":4},"h":"14e72405ea"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Saroo는 어린 시절 집 근처의 랜드마크를 많이 기억했다.","Saroo는 현지 사람들의 도움으로 가족을 만났다.","Saroo는 호주에서 가족을 찾았다.","Saroo는 고향을 아주 빨리 찾았다."],"opts":["Saroo remembered many landmarks near his childhood home.","Saroo met his family with the help of local people.","Saroo found his family in Australia.","Saroo found his hometown very quickly."],"r":{"a":"2) Saroo met his family with the help of local people. (Saroo는 현지 사람들의 도움으로 가족을 만났다.)","ev":"5, 7, 10번 문장","s":[[5,"It seemed like a good idea, but it was not easy because he only remembered the name “Ginestlay” and a few landmarks near his childhood home.","그것은 좋은 생각처럼 보였지만, 그는 단지 ‘Ginestlay’라는 이름과 자신의 어린 시절 집 근처의 몇몇 랜드마크만을 기억했기 때문에 그것은 쉽지 않았다."],[7,"After many years, Saroo accidently found a familiar-looking small town called Ganesh Talai.","수년 후, Saroo는 Ganesh Talai라고 불리는 눈에 익은 작은 마을을 우연히 찾았다."],[10,"With the help of local people, he finally met his mother, brother, and sister, still living in Ganesh Talai.","현지 사람들의 도움으로, 그는 마침내 여전히 Ganesh Talai에 살고 있던 그의 어머니와 형, 그리고 여동생을 만났다."]],"w":"10번에서 현지 사람들의 도움으로 가족을 만났다고 해요. 랜드마크는 몇 개만 기억했고(5번), 가족은 인도의 Ganesh Talai에 살고 있었고(10번), 고향은 수년 후에야 찾았어요(7번).","c":2},"h":"bcbea3b7e0"},{"n":9,"t":"sum","q":"Saroo's search was (A) because he only remembered the name \"Ginestlay\" and (B) landmarks near his childhood home.","ko":"Saroo의 찾기는 ‘Ginestlay’라는 이름과 어린 시절 집 근처의 (B) 랜드마크만 기억했기 때문에 (A).","oko":["(A) 쉬웠다 / (B) 많은","(A) 어려웠다 / (B) 많은","(A) 쉬웠다 / (B) 몇몇","(A) 지루했다 / (B) 하나도 없는","(A) 어려웠다 / (B) 몇몇"],"opts":["(A) easy / (B) many","(A) difficult / (B) many","(A) easy / (B) a few","(A) boring / (B) no","(A) difficult / (B) a few"],"r":{"a":"5) (A) difficult / (B) a few (어려웠다 / 몇몇)","ev":"5번 문장","s":[[5,"It seemed like a good idea, but it was not easy because he only remembered the name “Ginestlay” and a few landmarks near his childhood home.","그것은 좋은 생각처럼 보였지만, 그는 단지 ‘Ginestlay’라는 이름과 자신의 어린 시절 집 근처의 몇몇 랜드마크만을 기억했기 때문에 그것은 쉽지 않았다."]],"w":"5번에서 기억한 것이 이름 하나와 a few(몇몇) 랜드마크뿐이라 it was not easy(쉽지 않았다)고 해요. 쉬웠다거나 많이 기억했다는 말은 본문과 반대예요.","c":5},"h":"c99ae98548"},{"n":10,"t":"fill","q":"When he was a small boy, Saroo Brierley became [A] on the streets of Kolkata, far from his hometown in [B] India.","ko":"어린 소년이었을 때, Saroo Brierley는 인도의 [B] 고향에서 멀리 떨어진 Kolkata의 길거리에서 [A] 상태가 되었다.","bank":["lost","rural","satellite","restarted","mispronounced","family"],"bko":{"lost":"길을 잃은","rural":"시골의","satellite":"위성","restarted":"다시 시작했다(restart의 과거)","mispronounced":"잘못 발음했다(mispronounce의 과거)","family":"가족"},"r":{"a":"[A] lost (길을 잃은), [B] rural (시골의)","ev":"1번 문장","s":[[1,"When he was a small boy, Saroo Brierley became lost on the streets of Kolkata, far from his hometown in rural India.","어린 소년이었을 때, Saroo Brierley는 인도의 시골에 있는 자신의 고향에서 멀리 떨어진 Kolkata의 길거리에서 길을 잃었다."]],"w":"1번에서 Saroo는 어린 소년일 때 Kolkata의 길거리에서 길을 잃었고(became lost), 고향은 인도의 시골(rural India)에 있었어요. became 뒤에는 상태를 나타내는 lost가, India 앞에는 India를 꾸미는 rural이 알맞아요.","c":null},"h":"1c92cadf23"}]},{"u":6,"id":"rj4-06-3","no":3,"ko":"‘이것’을 잠깐 내려놓아요","items":[{"n":1,"t":"tf","q":"Lena checks her messages even when she is on vacation with her family.","ko":"Lena는 가족과 함께 휴가 중일 때에도 메시지를 확인한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Lena constantly surfs the Internet and checks her messages on her cell phone, even when she is on vacation with her family.","Lena는 심지어 그녀의 가족과 함께 휴가 중일 때에도 끊임없이 그녀의 휴대전화로 인터넷을 검색하고 그녀의 메시지를 확인한다."]],"w":"1번에서 Lena는 가족과 함께 휴가 중일 때에도 휴대전화로 메시지를 확인한다고 해요. 본문과 일치해요.","c":"T"},"h":"2052b2294d"},{"n":2,"t":"tf","q":"Popcorn brain is a good effect of recent developments in technology.","ko":"팝콘 브레인은 최근의 기술 발전의 좋은 결과이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Popcorn brain is a negative effect of recent developments in technology.","팝콘 브레인은 최근의 기술 발전의 부정적인 결과이다."]],"w":"4번에서 팝콘 브레인은 최근 기술 발전의 negative effect(부정적인 결과)라고 해요. 좋은 결과라는 말은 반대예요.","c":"F"},"h":"88cf8566be"},{"n":3,"t":"tf","q":"Apps that track and limit your phone usage can help you.","ko":"당신의 전화 사용을 추적하고 제한하는 앱이 당신을 도울 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Apps that track and limit your phone usage can help you.","당신의 전화 사용을 추적하고 제한하는 앱이 당신을 도울 수 있다."]],"w":"11번에서 전화 사용을 추적하고 제한하는 앱이 도움이 될 수 있다고 해요. 본문과 일치해요.","c":"T"},"h":"2aa0e26a3b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Lena constantly surfs the Internet and checks her messages on her cell phone...)","ko":"Lena는 ( ) 그녀의 휴대전화로 인터넷을 검색하고 메시지를 확인한다.","opts":["끊임없이","가끔","조용히","처음으로"],"word":"constantly","r":{"a":"1) 끊임없이","ev":"1번 문장","s":[[1,"Lena constantly surfs the Internet and checks her messages on her cell phone, even when she is on vacation with her family.","Lena는 심지어 그녀의 가족과 함께 휴가 중일 때에도 끊임없이 그녀의 휴대전화로 인터넷을 검색하고 그녀의 메시지를 확인한다."]],"w":"휴가 중에도 폰을 놓지 못한다는 내용이라 가끔이 아니라 계속 한다는 뜻이에요. 그래서 constantly는 '끊임없이'예요.","c":1},"h":"f799fc5ed7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...using the Internet excessively for a long time causes the part of the brain used for thought to become smaller.)","ko":"오랫동안 ( ) 인터넷을 사용하는 것은 사고에 이용되는 뇌의 부분이 더 작아지게 한다.","opts":["적당히","과도하게","가끔","빠르게"],"word":"excessively","r":{"a":"2) 과도하게","ev":"7번 문장","s":[[7,"Also, using the Internet excessively for a long time causes the part of the brain used for thought to become smaller.","또한, 오랫동안 과도하게 인터넷을 사용하는 것은 사고에 이용되는 뇌의 부분이 더 작아지게 한다."]],"w":"뇌의 부분이 작아지는 나쁜 결과가 나오는 문장이에요. 그래서 오랫동안 지나치게 쓴다는 뜻이고, excessively는 '과도하게'예요.","c":2},"h":"5fa1019aa7"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nShe knows she should spend time with them, but she cannot stop using her phone.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그녀는 그녀가 그들과 함께 시간을 보내야 한다는 것을 알지만, 그녀는 그녀의 전화를 사용하는 것을 멈출 수 없다.","opts":["Lena의 선생님들","휴대전화 앱들","Lena의 가족","인터넷 사용자들"],"r":{"a":"3) Lena의 가족","ev":"1~2번 문장","s":[[1,"Lena constantly surfs the Internet and checks her messages on her cell phone, even when she is on vacation with her family.","Lena는 심지어 그녀의 가족과 함께 휴가 중일 때에도 끊임없이 그녀의 휴대전화로 인터넷을 검색하고 그녀의 메시지를 확인한다."],[2,"She knows she should spend time with them, but she cannot stop using her phone.","그녀는 그녀가 그들과 함께 시간을 보내야 한다는 것을 알지만, 그녀는 그녀의 전화를 사용하는 것을 멈출 수 없다."]],"w":"1번에서 Lena는 her family와 함께 휴가를 가 있어요. 2번의 them은 함께 시간을 보내야 하는 그 가족이에요.","c":3},"h":"2545a2de96"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There are ways to keep popcorn brain from developing.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"팝콘 브레인이 생기는 것을 막는 방법들이 있다.","opts":["팝콘 브레인을 더 빨리 생기게 하는 방법들이 있다.","팝콘 브레인이 생길 때까지 기다리는 방법들이 있다.","팝콘 브레인이 있는 사람을 막는 방법들이 있다.","팝콘 브레인이 생기는 것을 막는 방법들이 있다."],"r":{"a":"4) 팝콘 브레인이 생기는 것을 막는 방법들이 있다.","ev":"9번 문장","s":[[9,"There are ways to keep popcorn brain from developing.","팝콘 브레인이 생기는 것을 막는 방법들이 있다."]],"w":"「keep+목적어+from+v-ing」는 '~가 …하는 것을 막다'예요. ways to keep popcorn brain from developing은 팝콘 브레인이 생기지 않게 막는 방법들이에요.","c":4},"h":"b95828eda4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Lena는 가족과 함께 있을 때 전화 사용을 멈춘다.","팝콘 브레인은 항상 온라인상에 있으려는 욕구이다.","팝콘 브레인은 인터넷을 멀리하려는 욕구이다.","Lena는 팝콘 브레인이 없다."],"opts":["Lena stops using her phone when she is with her family.","Popcorn brain is the need to be online all the time.","Popcorn brain is the need to stay away from the Internet.","Lena does not have popcorn brain."],"r":{"a":"2) Popcorn brain is the need to be online all the time. (팝콘 브레인은 항상 온라인상에 있으려는 욕구이다.)","ev":"2~3번 문장","s":[[2,"She knows she should spend time with them, but she cannot stop using her phone.","그녀는 그녀가 그들과 함께 시간을 보내야 한다는 것을 알지만, 그녀는 그녀의 전화를 사용하는 것을 멈출 수 없다."],[3,"Lena has something called “popcorn brain,” which is the need to be online all the time.","Lena는 ‘팝콘 브레인’이라고 불리는 것을 가지고 있는데, 그것은 항상 온라인상에 있으려는 욕구이다."]],"w":"3번에서 팝콘 브레인은 항상 온라인상에 있으려는 욕구(the need to be online all the time)라고 해요. 2번에서 Lena는 휴대전화를 멈출 수 없다고 했으니 가족과 있을 때 멈춘다는 말도 틀려요.","c":2},"h":"4416ab1b5d"},{"n":9,"t":"sum","q":"People with popcorn brain have (A) reading human emotions, and popcorn brain even affects their ability to (B).","ko":"팝콘 브레인을 가진 사람들은 사람들의 감정을 읽는 데 (A) 겪고, 팝콘 브레인은 심지어 (B) 능력에도 영향을 미친다.","oko":["(A) 어려움 없이 / (B) 망각하는","(A) 흥미를 / (B) 휴식하는","(A) 어려움을 / (B) 수면하는","(A) 아무 문제도 / (B) 집중하는","(A) 어려움을 / (B) 집중하는"],"opts":["(A) no difficulty / (B) forget","(A) interest / (B) relax","(A) difficulty / (B) sleep","(A) no trouble / (B) focus","(A) difficulty / (B) focus"],"r":{"a":"5) (A) difficulty / (B) focus","ev":"5~6번 문장","s":[[5,"People with popcorn brain have difficulty reading human emotions.","팝콘 브레인을 가진 사람들은 사람들의 감정을 읽는 데 어려움을 겪는다."],[6,"Popcorn brain even affects their ability to focus.","팝콘 브레인은 심지어 그들의 집중하는 능력에도 영향을 미친다."]],"w":"5번에서 감정을 읽는 데 어려움(difficulty)을 겪고, 6번에서 집중하는(focus) 능력에 영향을 미친다고 해요.","c":5},"h":"be028be7a0"},{"n":10,"t":"fill","q":"To keep popcorn brain from developing, [A] limits on how long you use the Internet and [B] up your time with other fun activities.","ko":"팝콘 브레인이 생기는 것을 막으려면, 인터넷을 얼마나 오래 쓰는지에 제한을 [A], 시간을 다른 재미있는 활동으로 [B].","bank":["put","fill","track","spend","surf","develop"],"bko":{"put":"두다","fill":"채우다","track":"추적하다","spend":"보내다","surf":"검색하다","develop":"생기다, 발달하다"},"r":{"a":"[A] put (두다), [B] fill (채우다)","ev":"10번, 12번 문장","s":[[10,"First, put limits on how long you use the Internet.","우선, 당신이 얼마나 오랫동안 인터넷을 사용하는지에 제한을 두어라."],[12,"Second, fill up your time with other fun activities.","두 번째로, 당신의 시간을 다른 재미있는 활동들로 채워라."]],"w":"10번 First, put limits on how long you use the Internet와 12번 Second, fill up your time with other fun activities에서 가져왔어요. 「put limits on」은 '~에 제한을 두다', 「fill up ~ with」는 '~로 채우다'예요. 다른 단어는 이 표현에 맞지 않아요.","c":null},"h":"c21ae83055"}]},{"u":6,"id":"rj4-06-4","no":4,"ko":"우리의 장기는 주인을 기억한다","items":[{"n":1,"t":"tf","q":"Linda had always disliked spicy foods, but after the transplant she started to crave them.","ko":"Linda는 항상 매운 음식을 싫어했지만 이식 후에는 그것이 몹시 먹고 싶어지기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Although she had always disliked spicy foods, she started to crave them.","그녀는 항상 매운 음식을 싫어했었는데, 그녀는 그것을 갈망하기 시작했다."]],"w":"2번에서 Although she had always disliked spicy foods, she started to crave them이라고 해요. 본문과 일치해요.","c":"T"},"h":"bff0b35bee"},{"n":2,"t":"tf","q":"After the transplant, Linda enjoyed her pottery class even more.","ko":"이식 후에 Linda는 도예 수업을 훨씬 더 즐겼다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"She also stopped enjoying her pottery class, which had been her favorite activity.","그녀는 또한 도예 수업을 즐기던 것을 그만두었는데, 그것은 그녀가 매우 좋아하는 활동이었다."]],"w":"3번에서 Linda는 가장 좋아하던 도예 수업을 즐기는 것을 그만두었다(stopped enjoying)고 해요. 더 즐겼다는 말은 반대예요.","c":"F"},"h":"22af6df60c"},{"n":3,"t":"tf","q":"Linda told her doctor, and the doctor said something shocking.","ko":"Linda는 그녀의 의사에게 말했고, 의사는 충격적인 것을 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Linda told her doctor, who said something shocking.","Linda는 그녀의 의사에게 말했는데, 그는 충격적인 것을 말했다."]],"w":"5번에서 Linda told her doctor, who said something shocking이라고 해요. 본문과 일치해요.","c":"T"},"h":"7305f72525"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Although she had always disliked spicy foods, she started to crave them.)","ko":"그녀는 항상 매운 음식을 싫어했었는데, 그녀는 그것을 ( ) 시작했다.","opts":["갈망하기","잊기","피하기","요리하기"],"word":"crave","r":{"a":"1) 갈망하기","ev":"2번 문장","s":[[2,"Although she had always disliked spicy foods, she started to crave them.","그녀는 항상 매운 음식을 싫어했었는데, 그녀는 그것을 갈망하기 시작했다."]],"w":"Although(~이지만)가 있으니 앞의 '싫어했다'와 반대되는 내용이 와요. 그래서 crave는 '갈망하다'예요.","c":1},"h":"a78eb4fbcb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then she started becoming forgetful.)","ko":"게다가 그녀는 ( ) 상태가 되기 시작했다.","opts":["아주 기억을 잘하는","잘 잊어버리는","매우 용감한","매우 조용한"],"word":"forgetful","r":{"a":"2) 잘 잊어버리는","ev":"4번 문장","s":[[4,"Then she started becoming forgetful.","게다가 그녀는 잘 잊어버리기 시작했다."]],"w":"2~3번에서 Linda의 이상한 변화가 계속 이어지는 흐름이에요. forgetful은 forget(잊다)에서 나온 말로, '잘 잊어버리는'이에요.","c":2},"h":"a48c6d4863"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis could make it possible for someone to form new habits or thoughts after receiving an organ transplant.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 누군가가 장기 이식을 받은 후에 새로운 습관이나 생각을 형성하는 것을 가능하게 할 수도 있다.","opts":["기증자의 신장","Linda의 의사","장기가 옮겨질 때마다 기억들이 함께 가는 것","새로운 습관"],"r":{"a":"3) 장기가 옮겨질 때마다 기억들이 함께 가는 것","ev":"10~11번 문장","s":[[10,"Whenever the organs are moved, the memories go with them.","그 장기들이 옮겨질 때마다, 기억들이 그것들과 함께 간다."],[11,"This could make it possible for someone to form new habits or thoughts after receiving an organ transplant.","이는 누군가가 장기 이식을 받은 후에 새로운 습관이나 생각을 형성하는 것을 가능하게 할 수도 있다."]],"w":"10번에서 장기가 옮겨질 때마다 기억들이 함께 간다고 하고, 11번의 This는 그 내용이에요. 그래서 이식을 받은 사람이 새로운 습관이나 생각을 형성할 수 있어요.","c":3},"h":"b21646c97e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He said that Linda's donor may have been someone with these same traits!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 Linda의 기증자가 이러한 동일한 특성들을 가진 사람이었을지도 모른다고 말했다!","opts":["그는 Linda가 기증자와 같은 특성을 가진 사람이 되어야 한다고 말했다.","그는 Linda의 기증자가 이런 특성을 가진 사람이 결코 아니었다고 말했다.","그는 Linda 자신이 기증자였을지도 모른다고 말했다.","그는 Linda의 기증자가 이러한 동일한 특성들을 가진 사람이었을지도 모른다고 말했다."],"r":{"a":"4) 그는 Linda의 기증자가 이러한 동일한 특성들을 가진 사람이었을지도 모른다고 말했다.","ev":"6번 문장","s":[[6,"He said that Linda’s donor may have been someone with these same traits!","그는 Linda의 기증자가 이러한 동일한 특성들을 가진 사람이었을지도 모른다고 말했다!"]],"w":"「may have+p.p.」는 '~였을지도 모른다'는 과거에 대한 추측이에요. 의사는 기증자가 Linda와 같은 특성을 가졌을지도 모른다고 추측한 거예요.","c":4},"h":"4deefc9f41"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Linda는 항상 매운 음식을 좋아했다.","몇몇 보고는 기억이 뇌뿐만 아니라 다른 장기들에도 저장될 수 있다고 말한다.","보고에 따르면 기억은 뇌에만 저장된다.","Linda는 이식 후에 도예 수업을 아주 잘하게 되었다."],"opts":["Linda has always loved spicy foods.","Some reports say that memory can be stored in other organs, not only in the brain.","According to the reports, memory is stored only in the brain.","Linda became very good at her pottery class after the transplant."],"r":{"a":"2) Some reports say that memory can be stored in other organs, not only in the brain. (몇몇 보고는 기억이 뇌뿐만 아니라 다른 장기들에도 저장될 수 있다고 말한다.)","ev":"2~3, 7번 문장","s":[[2,"Although she had always disliked spicy foods, she started to crave them.","그녀는 항상 매운 음식을 싫어했었는데, 그녀는 그것을 갈망하기 시작했다."],[3,"She also stopped enjoying her pottery class, which had been her favorite activity.","그녀는 또한 도예 수업을 즐기던 것을 그만두었는데, 그것은 그녀가 매우 좋아하는 활동이었다."],[7,"He explained that some reports suggest memory is not only stored in the brain but also in other organs, such as the kidneys and the heart.","그는 몇몇 보고가 기억이 뇌뿐만 아니라 신장과 심장 같은 다른 장기들에도 저장된다는 것을 시사한다고 설명했다."]],"w":"7번에서 몇몇 보고는 기억이 뇌뿐만 아니라 신장과 심장 같은 다른 장기들에도 저장된다고 해요. 항상 매운 음식을 싫어했고(2번), 도예 수업을 즐기지 않게 됐다(3번)는 내용과 기억이 뇌에만 저장된다는 말은 본문과 달라요.","c":2},"h":"c12aae696b"},{"n":9,"t":"sum","q":"Linda's changes may have been (A) by her new kidney, which was (B) as if it were still inside the donor.","ko":"Linda의 변화들은 그녀의 새 신장에 의해 (A)었을지도 모르는데, 그것은 마치 여전히 기증자 안에 있는 것처럼 (B)고 있었다.","oko":["(A) 막아졌 / (B) 행동하","(A) 야기되 / (B) 요리하","(A) 치료되 / (B) 그림 그리","(A) 해결되 / (B) 노래하","(A) 야기되 / (B) 행동하"],"opts":["(A) prevented / (B) acting","(A) caused / (B) cooking","(A) cured / (B) painting","(A) solved / (B) singing","(A) caused / (B) acting"],"r":{"a":"5) (A) caused / (B) acting (야기되 / 행동하)","ev":"12번 문장","s":[[12,"Thus, Linda’s changes may have been caused by her new kidney, which was acting as if it were still inside the donor.","그러므로, Linda의 변화들은 그녀의 새 신장에 의해 야기되었을지도 모르는데, 그것은 마치 그것이 여전히 기증자 안에 있는 것처럼 행동하고 있었기 때문이다."]],"w":"12번에서 Linda의 변화들은 새 신장에 의해 야기되었을지도(may have been caused) 모른다고 하고, 그 신장이 마치 기증자 안에 있는 것처럼 행동하고(acting as if) 있었다고 해요. 나머지 단어는 이 흐름과 맞지 않아요.","c":5},"h":"f9cfc6d429"},{"n":10,"t":"fill","q":"According to those reports, living [A] in these organs store [B] about a person.","ko":"그 보고들에 의하면, 이러한 장기들 안에 살아 있는 [A]은(는) 사람에 대한 [B]을(를) 저장한다.","bank":["cells","information","pottery","spicy","brain","transplant"],"bko":{"cells":"세포","information":"정보","pottery":"도예","spicy":"매운","brain":"뇌","transplant":"이식"},"r":{"a":"[A] cells (세포), [B] information (정보)","ev":"8~9번 문장","s":[[8,"According to those reports, living cells in these organs store information about a person.","그 보고들에 의하면, 이러한 장기들 안에 살아 있는 세포들은 사람에 대한 정보를 저장한다."],[9,"This information includes parts of the person’s emotional, mental, and physical memories.","이 정보는 사람의 감정적이고 정신적이며 신체적인 기억들의 일부를 포함한다."]],"w":"8번 living cells in these organs store information about a person에서 가져왔어요. 장기 안에 살아 있는 것은 세포(cells)이고, 그 세포가 저장하는 것이 정보(information)예요. 나머지 단어는 이 두 자리에 의미가 맞지 않아요.","c":null},"h":"dfba22e56b"}]},{"u":7,"id":"rj4-07-1","no":1,"ko":"복잡할수록 재밌어","items":[{"n":1,"t":"tf","q":"A Rube Goldberg machine does a simple task in a very complicated way.","ko":"루브 골드버그 장치는 단순한 일을 매우 복잡한 방식으로 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"A Rube Goldberg machine is a device that carries out a simple task in a very complicated way.","루브 골드버그 장치는 단순한 일을 매우 복잡한 방식으로 수행하는 기구이다."]],"w":"1번 문장에 a simple task in a very complicated way가 그대로 나와요. 단순한 일을 아주 복잡하게 하는 장치가 맞아요.","c":"T"},"h":"c5f8a0bace"},{"n":2,"t":"tf","q":"The marble hits a toy car first, and then it hits a line of dominoes.","ko":"구슬은 먼저 장난감 자동차에 부딪히고, 그다음에 도미노 줄에 부딪힌다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"The marble passes through the tube, rolls down to the table, and hits a line of dominoes.","그 구슬은 관을 통과하여 테이블로 굴러떨어지고 도미노 줄에 부딪힌다."],[7,"The dominoes knock each other down and the last one hits a toy car.","도미노는 서로를 넘어뜨리고 마지막 하나는 장난감 자동차에 부딪힌다."]],"w":"6번에서 구슬은 관을 지나 도미노 줄에 부딪혀요. 7번에서 도미노가 넘어지고 마지막 도미노가 장난감 자동차에 부딪혀요. 순서가 반대예요.","c":"F"},"h":"497f7a3478"},{"n":3,"t":"tf","q":"Rube Goldberg machines can be found in science classes.","ko":"루브 골드버그 장치는 과학 수업에서 찾아볼 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"You can find these machines in TV shows, movies, or even science classes.","당신은 TV 쇼, 영화 또는 심지어 과학 수업에서도 이 장치를 찾을 수 있다."]],"w":"12번에서 TV 쇼, 영화, 심지어 과학 수업에서도 이 장치를 찾을 수 있다고 해요.","c":"T"},"h":"0a983c0416"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Once one process ends, the next one begins immediately.)","ko":"일단 한 과정이 끝나면, 다음 과정이 ( ) 시작된다.","opts":["천천히","즉시","가끔","나중에"],"word":"immediately","r":{"a":"2) 즉시","ev":"3번 문장","s":[[3,"Once one process ends, the next one begins immediately.","일단 한 과정이 끝나면, 다음 과정이 즉시 시작된다."]],"w":"3번은 한 과정이 끝나면 다음 과정이 바로 시작된다는 말이에요. 작업이 차례로 끊기지 않고 이어지니까 immediately는 '즉시'예요.","c":2},"h":"42cf161722"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Now the dog can reach it.)","ko":"이제 강아지는 그것에 ( ) 수 있다.","opts":["만들","던질","닿을","잊을"],"word":"reach","r":{"a":"3) 닿을","ev":"8~9번 문장","s":[[8,"As the toy car rolls, it pushes the treat off the table and onto the floor.","장난감 자동차가 굴러가면서 간식을 테이블에서 바닥으로 밀어낸다."],[9,"Now the dog can reach it.","이제 강아지는 그것에 닿을 수 있다."]],"w":"8번에서 간식이 바닥으로 떨어졌고, 9번에서 이제 강아지가 간식에 닿을 수 있어요. reach는 '닿다, 도착하다'예요.","c":3},"h":"51516a0106"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAs the toy car rolls, it pushes the treat off the table and onto the floor.","ko":"밑줄 친 it이 가리키는 것은?","sko":"장난감 자동차가 굴러가면서, 그것은 간식을 테이블에서 바닥으로 밀어낸다.","opts":["간식","장난감 자동차","테이블","도미노"],"r":{"a":"2) 장난감 자동차","ev":"7~8번 문장","s":[[7,"The dominoes knock each other down and the last one hits a toy car.","도미노는 서로를 넘어뜨리고 마지막 하나는 장난감 자동차에 부딪힌다."],[8,"As the toy car rolls, it pushes the treat off the table and onto the floor.","장난감 자동차가 굴러가면서 간식을 테이블에서 바닥으로 밀어낸다."]],"w":"it은 간식을 미는 쪽이에요. 앞에서 도미노가 쳐서 굴러가는 것은 장난감 자동차(7번)이고, 8번에서 the treat는 밀리는 대상이라 it이 아니에요.","c":2},"h":"aef34c9927"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The machine uses a series of simple tasks, one right after another.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 장치는 간단한 일련의 작업을 차례로 수행한다.","opts":["그 장치는 어려운 작업 하나를 오랫동안 한다.","그 장치는 여러 작업을 한꺼번에 동시에 한다.","그 장치는 간단한 작업 하나만 하고 멈춘다.","그 장치는 간단한 작업을 하나씩 이어서 차례로 한다."],"r":{"a":"4) 그 장치는 간단한 작업을 하나씩 이어서 차례로 한다.","ev":"2번 문장","s":[[2,"The machine uses a series of simple tasks, one right after another.","그 장치는 간단한 일련의 작업을 차례로 수행한다."]],"w":"a series of는 '일련의', one right after another는 '차례로'예요. 간단한 작업들이 하나 끝나면 다음으로 이어진다는 뜻이에요.","c":4},"h":"6fa8a6b288"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["예시 장치는 고양이에게 장난감 자동차를 준다.","예시 장치는 강아지에게 맛있는 간식을 준다.","예시 장치는 강아지를 씻기기 위해 만들어졌다.","예시 장치는 소년에게 음료를 준다."],"opts":["The example machine gives a cat a toy car.","The example machine gives a dog a tasty treat.","The example machine is made to wash a dog.","The example machine gives a boy a drink."],"r":{"a":"2) The example machine gives a dog a tasty treat. (예시 장치는 강아지에게 맛있는 간식을 준다.)","ev":"4번 문장","s":[[4,"For example, here is a Rube Goldberg machine that gives a dog a tasty treat.","예를 들어, 여기에 강아지에게 맛있는 간식을 주는 루브 골드버그 장치가 있다."]],"w":"4번에서 예시 장치는 강아지에게 맛있는 간식을 주는 루브 골드버그 장치예요(a Rube Goldberg machine that gives a dog a tasty treat).","c":2},"h":"ab3694de00"},{"n":9,"t":"sum","q":"You (A) the machine by dropping a marble into a paper (B).","ko":"당신은 구슬을 종이 (B)에 떨어뜨림으로써 장치를 (A).","oko":["(A) 멈춘다 / (B) 관","(A) 시작한다 / (B) 상자","(A) 멈춘다 / (B) 상자","(A) 청소한다 / (B) 관","(A) 시작한다 / (B) 관"],"opts":["(A) stop / (B) tube","(A) start / (B) box","(A) stop / (B) box","(A) clean / (B) tube","(A) start / (B) tube"],"r":{"a":"5) (A) start / (B) tube (시작한다 / 관)","ev":"5번 문장","s":[[5,"You start the machine by dropping a marble into a paper tube.","당신은 종이 관에 구슬을 떨어뜨림으로써 장치를 시작한다."]],"w":"5번에서 당신은 종이 관(paper tube)에 구슬을 떨어뜨림으로써 장치를 시작한다(start)고 해요.","c":5},"h":"3eb90d0ba8"},{"n":10,"t":"fill","q":"This kind of machine was named after Rube Goldberg, an American [A] and inventor who lived from 1883 to 1970. He [B] these complex machines in his cartoons.","ko":"이런 종류의 장치는 1883년부터 1970년까지 살았던 미국의 [A]이자 발명가인 루브 골드버그의 이름을 따서 이름 지어졌다. 그는 그의 만화에 이 복잡한 장치를 [B].","bank":["cartoonist","drew","dominoes","marble","paper","treat"],"bko":{"cartoonist":"만화가","drew":"그렸다(draw의 과거)","dominoes":"도미노(domino의 복수형)","marble":"구슬","paper":"종이","treat":"간식"},"r":{"a":"[A] cartoonist (만화가), [B] drew (그렸다(draw의 과거))","ev":"10~11번 문장","s":[[10,"This kind of machine was named after Rube Goldberg, an American cartoonist and inventor who lived from 1883 to 1970.","이런 종류의 장치는 1883년부터 1970년까지 살았던 미국의 만화가이자 발명가인 루브 골드버그의 이름을 따서 이름 지어졌다."],[11,"He drew these complex machines in his cartoons.","그는 그의 만화에 이 복잡한 장치를 그렸다."]],"w":"10번 an American cartoonist and inventor와 11번 He drew these complex machines in his cartoons에서 가져왔어요. 만화(cartoons)를 그리는 사람이 cartoonist(만화가)이고, 과거에 그렸으니 drew(draw의 과거형)예요. 나머지 단어는 이 두 자리에 문법이나 의미가 맞지 않아요.","c":null},"h":"9a24a5075f"}]},{"u":7,"id":"rj4-07-2","no":2,"ko":"자동판매기가 왜 거기에?","items":[{"n":1,"t":"tf","q":"In ancient Egypt, people bought holy water to wash themselves before entering a temple.","ko":"고대 이집트에서 사람들은 신전에 들어가기 전에 자신을 씻으려고 성수를 샀다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In ancient Egypt, people bought holy water to wash themselves before entering a temple.","고대 이집트에서, 사람들은 신전에 들어가기 전에 자신들을 씻기 위해 성수를 샀다."]],"w":"3번 문장 그대로예요. 신전에 들어가기 전에(before entering a temple) 씻으려고 성수를 샀어요.","c":"T"},"h":"949de004e0"},{"n":2,"t":"tf","q":"Hero of Alexandria was an Egyptian priest who made holy water.","ko":"Hero of Alexandria는 성수를 만든 이집트 사제였다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"A Greek engineer named Hero of Alexandria solved these problems by inventing the first vending machine in 215 BC.","Hero of Alexandria라는 이름의 한 그리스 기술자가 기원전 215년에 최초의 자동판매기를 발명함으로써 이 문제들을 해결했다."]],"w":"6번에서 Hero of Alexandria는 그리스 기술자(A Greek engineer)였어요. 성수를 만든 이집트 사제가 아니라 자동판매기를 발명한 사람이에요.","c":"F"},"h":"bdf7c96cd9"},{"n":3,"t":"tf","q":"After the coin slid off the tray, no more water came out.","ko":"동전이 쟁반에서 미끄러져 떨어진 뒤, 더 이상 물이 나오지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"When the coin slid off the tray, the pipe closed and no more water came out.","그 동전이 쟁반에서 미끄러져 떨어지면, 그 파이프가 닫히고 더 이상의 물이 나오지 않았다."]],"w":"11번에서 동전이 쟁반에서 미끄러지면 파이프가 닫히고 더 이상 물이 나오지 않는다고 해요.","c":"T"},"h":"2038b3393b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Priests often distributed holy water, but this took a long time.)","ko":"사제들이 대개 성수를 ( ), 하지만 이것은 시간이 오래 걸렸다.","opts":["나누어 주었다","만들었다","숨겼다","버렸다"],"word":"distributed","r":{"a":"1) 나누어 주었다","ev":"4번 문장","s":[[4,"Priests often distributed holy water, but this took a long time.","사제들이 대개 성수를 나누어 주었는데, 이것은 시간이 오래 걸렸다."]],"w":"4번의 사제들은 신전에 오는 사람들에게 성수를 하나하나 주었어요. 그래서 시간이 오래 걸렸다고 해요. distribute는 '나누어 주다'예요.","c":1},"h":"f0f1843d6a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Its weight caused the tray to tilt, which opened a pipe at the bottom of the machine.)","ko":"그것의 무게는 그 쟁반이 ( ) 했고, 그것은 기계 바닥의 파이프를 열었다.","opts":["떨어지게","닫히게","빛나게","기울게"],"word":"tilt","r":{"a":"4) 기울게","ev":"9번 문장","s":[[9,"Its weight caused the tray to tilt, which opened a pipe at the bottom of the machine.","그것의 무게는 그 쟁반이 기울게 했고, 그것은 그 기계의 바닥에 있는 파이프를 열었다."]],"w":"동전이 쟁반 한쪽에 떨어지면 그쪽이 무거워져서 쟁반이 한쪽으로 기울어요. 그 움직임이 파이프를 열어요. tilt는 '기울다'예요.","c":4},"h":"d0475ecda8"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis allowed the holy water to flow out.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 성수가 흘러나오도록 했다.","opts":["동전이 쟁반에서 미끄러진 것","기계 바닥의 파이프가 열린 것","사제가 성수를 직접 가져다준 것","사람들이 신전에 들어간 것"],"r":{"a":"2) 기계 바닥의 파이프가 열린 것","ev":"9~10번 문장","s":[[9,"Its weight caused the tray to tilt, which opened a pipe at the bottom of the machine.","그것의 무게는 그 쟁반이 기울게 했고, 그것은 그 기계의 바닥에 있는 파이프를 열었다."],[10,"This allowed the holy water to flow out.","이것은 성수가 흘러나오도록 했다."]],"w":"9번 문장에서 동전의 무게 때문에 기계 바닥의 파이프가 열렸어요. 10번의 This는 그렇게 파이프가 열린 것을 가리키고, 그 덕분에 성수가 흘러나와요.","c":2,"k":"This = 기계 바닥의 파이프가 열린 것"},"h":"c7cc8a54e0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Thanks to Hero’s automatic water dispenser, many ancient priests were able to save time and holy water!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Hero의 자동 물 분배기 덕분에, 많은 고대의 사제들은 시간과 성수를 절약할 수 있었다!","opts":["Hero의 기계 때문에 사제들이 성수를 잃었다.","Hero의 기계는 사제들에게 더 많은 일을 시켰다.","Hero의 기계 덕분에 사제들은 시간과 성수를 아낄 수 있었다.","사제들이 Hero를 도와서 성수를 아꼈다."],"r":{"a":"3) Hero의 기계 덕분에 사제들은 시간과 성수를 아낄 수 있었다.","ev":"12번 문장","s":[[12,"Thanks to Hero’s automatic water dispenser, many ancient priests were able to save time and holy water!","Hero의 자동 물 분배기 덕분에, 많은 고대의 사제들은 시간과 성수를 절약할 수 있었다!"]],"w":"Thanks to는 '~ 덕분에'이고 save는 '아끼다'예요. 기계가 사제 대신 성수를 나누어 주니 사제들이 시간과 성수를 아낄 수 있었어요.","c":3},"h":"ef0e5fae4f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["현대인이 자동판매기를 이용한 최초의 사람들이다.","오늘날 많은 사람이 자동판매기를 이용한다.","자동판매기는 현대에 처음 발명되었다.","고대에는 자동판매기를 사용한 사람이 아무도 없었다."],"opts":["Modern people were the first to use vending machines.","Many people use vending machines today.","Vending machines were invented for the first time in modern days.","Nobody in ancient times used vending machines."],"r":{"a":"2) Many people use vending machines today.","ev":"1~2번 문장","s":[[1,"Vending machines are a modern convenience that many people use.","자동판매기는 많은 사람이 이용하는 현대의 편의 시설이다."],[2,"Surprisingly, however, modern people were not the first to use them.","하지만 놀랍게도, 현대인이 그것들을 이용한 최초는 아니었다."]],"w":"1번에서 자동판매기는 많은 사람이 이용하는 현대의 편의 시설이라고 해요. 하지만 2번에서 현대인이 처음 이용한 것은 아니라고 해서 나머지는 모두 본문과 달라요.","c":2},"h":"ed83157d2a"},{"n":9,"t":"sum","q":"However, without the priests, people could (A) more water than they (B) for.","ko":"하지만 사제들이 없으면, 사람들은 그들이 (B) 것보다 더 많은 물을 (A) 수 있었다.","oko":["(A) 줄 / (B) 지불한","(A) 가져갈 / (B) 판","(A) 줄 / (B) 판","(A) 잃을 / (B) 지불한","(A) 가져갈 / (B) 지불한"],"opts":["(A) give / (B) paid","(A) take / (B) sold","(A) give / (B) sold","(A) lose / (B) paid","(A) take / (B) paid"],"r":{"a":"5) (A) take / (B) paid (가져갈 / 지불한)","ev":"5번 문장","s":[[5,"However, without the priests, people could take more water than they paid for.","하지만, 사제들이 없으면, 사람들은 그들이 지불한 것보다 더 많은 물을 가져갈 수 있었다."]],"w":"5번에서 사제들이 없으면 사람들은 지불한 것(paid)보다 더 많은 물을 가져갈(take) 수 있었다고 해요.","c":5},"h":"53008f8781"},{"n":10,"t":"fill","q":"When a [A] put a coin in the machine, it fell onto one [B] of a long tray.","ko":"[A]이(가) 그 기계에 동전을 넣으면, 그것은 긴 쟁반의 한 [B] 위로 떨어졌다.","bank":["visitor","side","ancient","holy","closed","wash"],"bko":{"visitor":"방문객","side":"쪽","ancient":"고대의","holy":"신성한","closed":"닫혔다(close의 과거)","wash":"씻다"},"r":{"a":"[A] visitor (방문객), [B] side (쪽)","ev":"8번 문장","s":[[8,"When a visitor put a coin in the machine, it fell onto one side of a long tray.","방문객이 그 기계에 동전을 넣으면, 그것은 긴 쟁반의 한 쪽 위로 떨어졌다."]],"w":"8번 When a visitor put a coin in the machine, it fell onto one side of a long tray에서 가져왔어요. 동전을 넣는 사람은 visitor(방문객)이고, one side of는 '~의 한 쪽'이에요. 나머지 단어는 이 두 자리에 문법이나 의미가 맞지 않아요.","c":null},"h":"cd815f8b45"}]},{"u":7,"id":"rj4-07-3","no":3,"ko":"아까는 농구장, 지금은 배구장","items":[{"n":1,"t":"tf","q":"Every game requires its own lines and markings.","ko":"모든 경기는 자기만의 선과 표시를 필요로 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"A different court is used for each different sport because every game requires its own lines and markings.","모든 경기는 그것 자신만의 선들과 표시들을 필요로 하기 때문에 각각의 다른 스포츠에는 각기 다른 코트가 사용된다."]],"w":"1번 문장에서 모든 경기(every game)가 자기만의 선과 표시(its own lines and markings)를 필요로 한다고 해요.","c":"T"},"h":"88ceb7556b"},{"n":2,"t":"tf","q":"It would take only a little time and money to repaint the gym floor.","ko":"체육관 바닥을 다시 칠하는 데는 시간과 돈이 조금만 들 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"It would take a lot of time and money to repaint the gym floor.","체육관 바닥을 다시 칠하는 데 많은 시간과 돈이 들 것이다."]],"w":"3번에서 바닥을 다시 칠하는 데는 많은 시간과 돈(a lot of time and money)이 든다고 해요. 조금만 든다는 말은 반대예요.","c":"F"},"h":"999a656be1"},{"n":3,"t":"tf","q":"The special glass of the floor does not reflect the light.","ko":"이 바닥의 특별한 유리는 빛을 반사하지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Moreover, its special glass does not reflect the light.","게다가, 그것의 특별한 유리는 빛을 반사하지 않는다."]],"w":"9번 문장에 its special glass does not reflect the light가 그대로 있어요.","c":"T"},"h":"1bd7a7e5d2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, a German company came up with a brilliant idea.)","ko":"하지만, 한 독일 회사가 ( ) 생각을 떠올렸다.","opts":["어리석은","위험한","멋진","오래된"],"word":"brilliant","r":{"a":"3) 멋진","ev":"4번 문장","s":[[4,"However, a German company came up with a brilliant idea.","하지만, 한 독일 회사가 멋진 생각을 떠올렸다."]],"w":"4번은 코트를 다시 칠해야 하는 문제(3번)에 대한 해결책이 나오는 문장이에요. 그 해결책이 글 전체에서 칭찬받는 좋은 생각이니까 brilliant는 '멋진, 훌륭한'이에요.","c":3},"h":"108cc46c99"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, an aluminum frame protects the floor, so it is strong enough to bounce balls on.)","ko":"또한, 알루미늄 틀이 바닥을 보호하므로, 그것은 그 위에서 공을 ( ) 만큼 충분히 강하다.","opts":["굴릴","튀길","던질","잡을"],"word":"bounce","r":{"a":"2) 튀길","ev":"8번 문장","s":[[8,"Also, an aluminum frame protects the floor, so it is strong enough to bounce balls on.","또한, 알루미늄 틀이 바닥을 보호하므로, 그것은 그것 위에서 공을 튀길 만큼 충분히 강하다."]],"w":"8번은 바닥이 튼튼하다는 장점이에요. 농구공처럼 바닥에 튀기는 상황이라서 bounce는 '튀기다'예요.","c":2},"h":"cc24aaa320"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey show the lines and markings for different sports and can be changed in a second.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 각기 다른 스포츠를 위한 선들과 표시들을 보여 주고 순식간에 바뀔 수 있다.","opts":["선수들","서로 다른 스포츠들","독일 회사들","LED 조명"],"r":{"a":"4) LED 조명","ev":"6~7번 문장","s":[[6,"The gym floor has LED lights beneath a surface of hard glass.","그 체육관 바닥은 강화 유리의 표면 아래에 LED 조명이 있다."],[7,"They show the lines and markings for different sports and can be changed in a second.","그것들은 각기 다른 스포츠를 위한 선들과 표시들을 보여 주고 순식간에 바뀔 수 있다."]],"w":"선과 표시를 보여 주고 순식간에 바뀔 수 있는 것은 6번에서 소개한 LED 조명(LED lights)이에요.","c":4},"h":"0eefd60da0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the near future, this multipurpose floor could change the way sports are played.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"가까운 미래에, 이 다목적 바닥은 스포츠가 경기되는 방식을 바꿀 수도 있다.","opts":["이 다목적 바닥은 스포츠를 하는 방식을 바꿀 수도 있다.","이 다목적 바닥은 스포츠를 할 수 없게 만들 것이다.","이 다목적 바닥은 모든 스포츠의 규칙을 없앨 것이다.","이 다목적 바닥은 선수들이 직접 만들게 된다."],"r":{"a":"1) 이 다목적 바닥은 스포츠를 하는 방식을 바꿀 수도 있다.","ev":"11번 문장","s":[[11,"In the near future, this multipurpose floor could change the way sports are played.","가까운 미래에, 이 다목적 바닥은 스포츠가 경기되는 방식을 바꿀 수도 있다."]],"w":"the way sports are played는 '스포츠가 경기되는 방식'이에요. 한 바닥으로 여러 스포츠를 할 수 있어서 그 방식을 바꿀 수도 있다는 마무리 문장이에요.","c":1},"h":"3d21ecafe6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["한 프랑스 회사가 체육관 바닥을 만들었다.","체육관 바닥에는 플라스틱으로 만든 틀이 있다.","버튼을 눌러서 코트를 바꿀 수 있다.","이 바닥에서는 농구만 할 수 있다."],"opts":["A French company made the gym floor.","The gym floor has a frame made of plastic.","A court can be switched by pressing a button.","Only basketball can be played on this floor."],"r":{"a":"3) A court can be switched by pressing a button. (버튼을 눌러서 코트를 바꿀 수 있다.)","ev":"4~5, 8번 문장","s":[[4,"However, a German company came up with a brilliant idea.","하지만, 한 독일 회사가 멋진 생각을 떠올렸다."],[5,"By simply pressing a button, a court can be switched, for example, from a basketball court to a volleyball court.","간단히 버튼을 누름으로써, 코트는 예를 들어, 농구 코트에서 배구 코트로 바뀔 수 있다."],[8,"Also, an aluminum frame protects the floor, so it is strong enough to bounce balls on.","또한, 알루미늄 틀이 바닥을 보호하므로, 그것은 그것 위에서 공을 튀길 만큼 충분히 강하다."]],"w":"5번에서 버튼을 누르면 코트가 바뀔 수 있다고 해요(By simply pressing a button, a court can be switched). 바닥의 틀은 플라스틱이 아니라 알루미늄이고(8번), 회사는 프랑스가 아니라 독일 회사예요(4번).","c":3},"h":"2622f61756"},{"n":9,"t":"sum","q":"With balls that have sensors, referees can see (A) landing spots and quickly make better (B).","ko":"센서가 있는 공으로 심판들은 (A) 낙하지점을 보고 더 나은 (B)을 빠르게 할 수 있다.","oko":["(A) 숨겨진 / (B) 실수","(A) 페인트로 칠한 / (B) 규칙","(A) 디지털로 표시된 / (B) 판단","(A) 숨겨진 / (B) 판단","(A) 디지털로 표시된 / (B) 실수"],"opts":["(A) hidden / (B) mistakes","(A) painted / (B) rules","(A) digitally marked / (B) judgments","(A) hidden / (B) judgments","(A) digitally marked / (B) mistakes"],"r":{"a":"3) (A) digitally marked / (B) judgments","ev":"10번 문장","s":[[10,"Plus, with balls that have sensors, referees can see digitally marked landing spots so that they can quickly make better judgments.","더욱이, 센서가 있는 공들로 심판들은 더 나은 판단을 빠르게 하기 위해 디지털로 표시된 낙하지점들을 볼 수 있다."]],"w":"10번에서 센서가 있는 공 덕분에 심판들은 디지털로 표시된 낙하지점(digitally marked landing spots)을 볼 수 있고, 더 나은 판단(better judgments)을 빠르게 할 수 있어요. 숨겨져 있거나 페인트로 칠한 것이 아니고, 실수나 규칙 이야기도 없어요.","c":3},"h":"1960e33b7d"},{"n":10,"t":"fill","q":"The gym floor has LED lights [A] a [B] of hard glass.","ko":"그 체육관 바닥은 강화 유리의 [B] [A] LED 조명이 있다.","bank":["beneath","surface","referees","sensors","German","volleyball"],"bko":{"beneath":"~ 아래에","surface":"표면","referees":"심판들","sensors":"센서들","German":"독일의","volleyball":"배구"},"r":{"a":"[A] beneath (~ 아래에), [B] surface (표면)","ev":"6번 문장","s":[[6,"The gym floor has LED lights beneath a surface of hard glass.","그 체육관 바닥은 강화 유리의 표면 아래에 LED 조명이 있다."]],"w":"6번 The gym floor has LED lights beneath a surface of hard glass에서 가져왔어요. beneath는 '~ 아래에', surface는 '표면'이에요. a 뒤에는 단수 명사가 와야 하고 나머지 단어는 이 문장의 뜻과 맞지 않아요.","c":null},"h":"0aa3228a6a"}]},{"u":7,"id":"rj4-07-4","no":4,"ko":"전쟁 중에도 지켜야 할 것","items":[{"n":1,"t":"tf","q":"Dunant saw at least 40,000 soldiers lying dead or hurt on the ground.","ko":"Dunant은 적어도 4만 명의 군인이 죽었거나 상처를 입은 채 땅 위에 누워 있는 것을 보았다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"He saw at least 40,000 soldiers lying dead or hurt on the ground.","그는 적어도 4만 명의 군인들이 죽거나 다쳐 땅 위에 누워 있는 것을 보았다."]],"w":"2번 문장 그대로예요. 적어도 4만 명(at least 40,000)의 군인이 죽거나 다쳐서 누워 있었어요.","c":"T"},"h":"d6fa63c3c5"},{"n":2,"t":"tf","q":"When Dunant saw the battlefield, many doctors were there to help the wounded soldiers.","ko":"Dunant이 전장을 보았을 때, 많은 의사들이 부상을 입은 군인들을 도우러 그곳에 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Sadly, nobody was there to offer them any medical help.","불행히도, 그곳에는 그들에게 의료적 도움을 제공할 사람이 아무도 없었다."]],"w":"3번에서 군인들에게 의료적 도움을 줄 사람이 아무도 없었다(nobody was there)고 해요. 의사가 많았다는 말과 반대예요.","c":"F"},"h":"0a58769c22"},{"n":3,"t":"tf","q":"The 1864 Geneva Convention is an agreement about proper behavior on the battlefield.","ko":"1864년 제네바 협약은 전장에서의 적절한 행위에 대한 협약이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"This inspired an important international agreement about proper behavior on the battlefield, known as the 1864 Geneva Convention.","이것은 1864년 제네바 협약으로 알려진 전장에서의 적절한 행위에 대한 중요한 국제 협약을 고무했다."]],"w":"10번에서 전장에서의 적절한 행위에 대한 중요한 국제 협약이 1864년 제네바 협약으로 알려져 있다고 해요.","c":"T"},"h":"d3bd70186f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Dunant called for a national organization of volunteers who would aid soldiers wounded in combat.)","ko":"Dunant은 전투에서 ( ) 군인들을 도울 국가적인 자원봉사자들의 단체를 요구했다.","opts":["지친","다친","용감한","도착한"],"word":"wounded","r":{"a":"2) 다친","ev":"6번 문장","s":[[6,"In the book, Dunant called for a national organization of volunteers who would aid soldiers wounded in combat.","그 책에서, Dunant은 전투에서 다친 군인들을 도울 국가적인 자원봉사자들의 단체를 요구했다."]],"w":"자원봉사자 단체가 필요한 이유는 전투에서 다친 군인들을 돕기 위해서예요(2~3번에서 군인들이 다쳐 누워 있었어요). wounded는 '다친'이에요.","c":2},"h":"1fb6e3e033"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He wanted them to be able to treat every wounded soldier, regardless of nationality.)","ko":"그는 그들이 모든 다친 군인을 국적( ) 치료할 수 있기를 원했다.","opts":["~ 때문에","~에 따라","~에 상관없이","~ 대신에"],"word":"regardless of","r":{"a":"3) ~에 상관없이","ev":"9번 문장","s":[[9,"He wanted them to be able to treat every wounded soldier, regardless of nationality.","그는 그들이 모든 다친 군인을 국적에 상관없이 치료할 수 있기를 원했다."]],"w":"9번은 의사와 간호사가 모든 다친 군인을 치료하기를 원했다는 말이에요. 모든 군인이라는 말과 이어지려면 국적이 달라도 상관없다는 뜻이어야 해서 regardless of는 '~에 상관없이'예요.","c":3},"h":"58509f6f1f"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis led to the creation of the International Committee of the Red Cross.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 국제 적십자 위원회의 창설로 이어졌다.","opts":["솔페리노 전투가 끝난 것","Dunant이 전장을 본 것","Dunant이 자원봉사자 단체를 요구한 것","전장에서 의사와 간호사가 일한 것"],"r":{"a":"3) Dunant이 자원봉사자 단체를 요구한 것","ev":"6~7번 문장","s":[[6,"In the book, Dunant called for a national organization of volunteers who would aid soldiers wounded in combat.","그 책에서, Dunant은 전투에서 다친 군인들을 도울 국가적인 자원봉사자들의 단체를 요구했다."],[7,"This led to the creation of the International Committee of the Red Cross.","이것은 국제 적십자 위원회의 창설로 이어졌다."]],"w":"7번의 This는 바로 앞 6번의 내용이에요. 책에서 Dunant이 다친 군인을 도울 자원봉사자 단체를 요구했고, 그것이 국제 적십자 위원회 창설로 이어졌어요.","c":3},"h":"69a2bf00e1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It was just one book, but it helped make the terrible battlefield less tragic.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 단지 한 권의 책이었지만, 끔찍한 전장을 덜 비극적으로 만드는 것을 도왔다.","opts":["그것은 책 한 권이었고, 전장을 더 비극적으로 만들었다.","한 권의 책으로는 전장에 아무 도움도 되지 못했다.","전장이 끔찍하지 않아서 책이 필요 없었다.","책은 한 권뿐이었지만, 전장을 덜 비극적으로 만드는 데 도움이 되었다."],"r":{"a":"4) 책은 한 권뿐이었지만, 전장을 덜 비극적으로 만드는 데 도움이 되었다.","ev":"11번 문장","s":[[11,"It was just one book, but it helped make the terrible battlefield less tragic.","그것은 단지 한 권의 책이었지만, 끔찍한 전장을 덜 비극적으로 만드는 것을 도왔다."]],"w":"just one book, but ~은 '한 권뿐이지만 ~했다'는 뜻이에요. helped make ~ less tragic은 '덜 비극적으로 만드는 것을 도왔다'예요.","c":4},"h":"54c10ae570"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Dunant은 병원에서 군인들을 도운 의사였다.","Dunant은 전투 직후에 본 것을 곧 잊었다.","Dunant은 스위스 사업가였다.","1864년 제네바 협약은 Dunant이 전장을 보기 전에 만들어졌다."],"opts":["Dunant was a doctor who helped soldiers in a hospital.","Dunant soon forgot what he had seen after the battle.","Dunant was a Swiss businessman.","The 1864 Geneva Convention was made before Dunant saw the battlefield."],"r":{"a":"3) Dunant was a Swiss businessman. (Dunant은 스위스 사업가였다.)","ev":"1, 10번 문장","s":[[1,"In 1859, Henry Dunant, a Swiss businessman, happened to see the battlefield after the Battle of Solferino had finished.","1859년, 스위스 사업가인 Henry Dunant은 솔페리노 전투가 끝난 후에 우연히 전장을 보았다."],[10,"This inspired an important international agreement about proper behavior on the battlefield, known as the 1864 Geneva Convention.","이것은 1864년 제네바 협약으로 알려진 전장에서의 적절한 행위에 대한 중요한 국제 협약을 고무했다."]],"w":"1번에서 Dunant는 스위스 사업가(a Swiss businessman)라고 해요. 의사가 아니었고, 본 것을 잊지 못했으며(4번), 제네바 협약은 그의 책 뒤에 나왔어요(10번).","c":3},"h":"5e650b0842"},{"n":9,"t":"sum","q":"To tell the (A) about the tragedy, Dunant (B) a book titled A Memory of Solferino.","ko":"Dunant은 그 비극을 (A) 알리기 위해 <솔페리노의 회고>라는 제목의 책을 (B).","oko":["(A) 왕에게 / (B) 썼다","(A) 세상에 / (B) 팔았다","(A) 왕에게 / (B) 팔았다","(A) 세상에 / (B) 읽었다","(A) 세상에 / (B) 썼다"],"opts":["(A) king / (B) wrote","(A) world / (B) sold","(A) king / (B) sold","(A) world / (B) read","(A) world / (B) wrote"],"r":{"a":"5) (A) world / (B) wrote (세상에 / 썼다)","ev":"5번 문장","s":[[5,"To tell the world about the tragedy, he wrote a book titled A Memory of Solferino.","그 비극을 세상에 알리기 위해, 그는 <솔페리노의 회고>라는 제목의 책을 썼다."]],"w":"5번에서 그 비극을 세상에(to tell the world) 알리기 위해 책을 썼다(wrote)고 해요.","c":5},"h":"238cbf8e9a"},{"n":10,"t":"fill","q":"He also [A] that doctors and nurses working on the battlefield should not be [B].","ko":"그는 또한 전장에서 일하는 의사와 간호사들이 [B] 안 된다고 [A].","bank":["insisted","harmed","tragedy","creation","agreement","committee"],"bko":{"insisted":"주장했다(insist의 과거)","harmed":"해를 입은(harm의 과거분사)","tragedy":"비극","creation":"창설","agreement":"협약","committee":"위원회"},"r":{"a":"[A] insisted (주장했다(insist의 과거)), [B] harmed (해를 입은(harm의 과거분사))","ev":"8번 문장","s":[[8,"He also insisted that doctors and nurses working on the battlefield should not be harmed.","그는 또한 전장에서 일하는 의사와 간호사들이 다쳐서는 안 된다고 주장했다."]],"w":"8번 He also insisted that doctors and nurses working on the battlefield should not be harmed에서 가져왔어요. insisted that ...은 '~라고 주장했다'이고, should not be harmed는 '해를 입어서는 안 된다'(be+과거분사, 수동)예요. 나머지 단어는 이 두 자리에 문법이나 의미가 맞지 않아요.","c":null},"h":"0d8fadbb26"}]},{"u":8,"id":"rj4-08-1","no":1,"ko":"모여라, 벌들아!","items":[{"n":1,"t":"tf","q":"Bees help us grow plants by moving pollen from flower to flower.","ko":"벌은 꽃가루를 꽃에서 꽃으로 옮겨서 우리가 식물을 기르도록 도와준다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They help us grow plants by transferring pollen from flower to flower.","그들은 꽃가루를 꽃에서 꽃으로 옮겨 우리가 식물을 기르도록 도와준다."]],"w":"2번 문장에 by transferring pollen from flower to flower가 있어요. 꽃가루를 꽃에서 꽃으로 옮겨서 식물을 기르게 도와줘요.","c":"T"},"h":"e885270073"},{"n":2,"t":"tf","q":"Bee bus stops are found in all countries of the world.","ko":"벌 버스 정류장은 세계의 모든 나라에서 발견된다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Bee bus stops are found in some European countries, including the Netherlands and the UK.","벌 버스 정류장은 네덜란드와 영국을 포함한 일부 유럽 국가에서 발견된다."]],"w":"6번에서 벌 버스 정류장은 네덜란드와 영국을 포함한 일부 유럽 국가(some European countries)에서 발견된다고 해요. 세계의 모든 나라는 아니에요.","c":"F"},"h":"425ba5969f"},{"n":3,"t":"tf","q":"The flowers in the gardens are favorites of bees and other pollinators.","ko":"정원의 꽃들은 벌과 다른 꽃가루 매개자들이 가장 좋아하는 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"They are favorites of bees and other pollinators.","그것들은 벌과 다른 꽃가루 매개자들이 가장 좋아하는 것이다."]],"w":"9번에서 They(정원의 꽃들)는 벌과 다른 꽃가루 매개자들이 가장 좋아하는 것(favorites)이라고 해요.","c":"T"},"h":"826a355575"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (As cities and towns expand, natural areas are disappearing.)","ko":"도시와 마을이 ( ) 자연 지역이 사라지고 있다.","opts":["줄어들면서","확장되면서","사라지면서","멈추면서"],"word":"expand","r":{"a":"2) 확장되면서","ev":"4번 문장","s":[[4,"As cities and towns expand, natural areas are disappearing.","도시와 마을이 확장되면서, 자연 지역이 사라지고 있다."]],"w":"도시와 마을이 넓어지는 만큼 자연 지역이 사라지고 있다는 내용이에요. expand는 '확장되다'예요.","c":2},"h":"4764e02052"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These eco-friendly bus stops will help both bees and humans by creating a sustainable environment.)","ko":"이러한 친환경 버스 정류장은 ( ) 환경을 조성함으로써 벌과 인간 모두를 도울 것이다.","opts":["위험한","시끄러운","지속 가능한","값비싼"],"word":"sustainable","r":{"a":"3) 지속 가능한","ev":"14번 문장","s":[[14,"These eco-friendly bus stops will help both bees and humans by creating a sustainable environment.","이러한 친환경 버스 정류장은 지속 가능한 환경을 조성함으로써 벌과 인간 모두를 도울 것이다."]],"w":"버스 정류장이 벌과 인간 모두를 돕는 환경이라고 했어요. 그래서 sustainable은 환경을 망치지 않고 계속 유지할 수 있는 '지속 가능한'이에요.","c":3},"h":"eac9ea4ef3"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are similar to normal bus stops, except for the small gardens on their roofs.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 지붕에 있는 작은 정원을 제외하고는 일반 버스 정류장과 비슷하다.","opts":["유럽 국가들","꽃가루 매개자들","전문가들","벌 버스 정류장"],"r":{"a":"4) 벌 버스 정류장","ev":"6~7번 문장","s":[[6,"Bee bus stops are found in some European countries, including the Netherlands and the UK.","벌 버스 정류장은 네덜란드와 영국을 포함한 일부 유럽 국가에서 발견된다."],[7,"They are similar to normal bus stops, except for the small gardens on their roofs.","그들은 지붕에 있는 작은 정원을 제외하고는 일반 버스 정류장과 비슷하다."]],"w":"7번에서 일반 버스 정류장과 비슷하다고 비교하는 대상은 6번의 벌 버스 정류장이에요. 6번의 유럽 국가들은 정류장이 발견되는 곳이에요.","c":4},"h":"1e30f529ff"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is why bee bus stops were created.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것이 벌 버스 정류장이 만들어진 이유이다.","opts":["이것이 벌 버스 정류장이 만들어진 이유이다.","이것은 벌 버스 정류장이 만들어진 뒤에 생긴 결과이다.","이것이 벌들이 정류장을 떠난 이유이다.","이것 때문에 벌 버스 정류장이 없어졌다."],"r":{"a":"1) 이것이 벌 버스 정류장이 만들어진 이유이다.","ev":"3~5번 문장","s":[[3,"Their population, however, has been decreasing due to habitat loss.","그러나 그들의 개체수는 서식지 감소로 인해 줄어들고 있다."],[4,"As cities and towns expand, natural areas are disappearing.","도시와 마을이 확장되면서, 자연 지역이 사라지고 있다."],[5,"This is why bee bus stops were created.","이것이 벌 버스 정류장이 만들어진 이유이다."]],"w":"This is why ~는 '이것이 ~한 이유이다'예요. This는 서식지가 줄어 벌이 줄고 자연 지역이 사라지는 상황(3~4번)이고, 그것이 벌 버스 정류장을 만든 이유라는 뜻이에요.","c":1},"h":"893f77ea36"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["벌들이 정원의 꽃을 스스로 골랐다.","전문가들이 정원의 꽃을 골랐다.","벌 버스 정류장은 새 재료로만 만들어진다.","벌 버스 정류장은 아시아에서만 발견된다."],"opts":["The bees selected the flowers in the gardens themselves.","Experts selected the flowers in the gardens.","Bee bus stops are made only from new materials.","Bee bus stops are found only in Asia."],"r":{"a":"2) Experts selected the flowers in the gardens. (전문가들이 정원의 꽃을 골랐다.)","ev":"8번 문장","s":[[8,"The flowers in these gardens were specially selected by experts.","이 정원의 꽃들은 전문가들에 의해 특별히 선택되었다."]],"w":"8번에서 정원의 꽃들은 전문가들에 의해 특별히 선택되었다(selected by experts)고 해요. 벌이 스스로 골랐다는 말은 본문에 없어요.","c":2},"h":"8a4465da57"},{"n":9,"t":"sum","q":"Bee bus stops help (A) the city in summer by absorbing light and heat, and they are made from (B) materials.","ko":"벌 버스 정류장은 빛과 열을 흡수함으로써 여름에 도시를 (A) 도와주고, (B) 재료로 만들어진다.","oko":["(A) 데우는 것을 / (B) 재활용된","(A) 시원하게 하는 것을 / (B) 새로운","(A) 데우는 것을 / (B) 새로운","(A) 시원하게 하는 것을 / (B) 값비싼","(A) 시원하게 하는 것을 / (B) 재활용된"],"opts":["(A) heat / (B) recycled","(A) cool / (B) new","(A) heat / (B) new","(A) cool / (B) expensive","(A) cool / (B) recycled"],"r":{"a":"5) (A) cool / (B) recycled","ev":"12~13번 문장","s":[[12,"In summer, their plants help cool the city by absorbing extra light and heat.","여름에 그것들의 식물은 추가적인 빛과 열을 흡수함으로써 도시를 시원하게 하는 것을 돕는다."],[13,"They are also made from materials that were either recycled or upcycled.","그것들은 또한 재활용되거나 업사이클링 된 재료로 만들어진다."]],"w":"12번에서 식물이 빛과 열을 흡수해서 도시를 시원하게(cool) 한다고 했고, 13번에서 재활용되거나 업사이클링된(recycled or upcycled) 재료로 만든다고 했어요. 새로운 재료나 값비싼 재료라는 말은 없어요.","c":5},"h":"f1a86206b9"},{"n":10,"t":"fill","q":"Their [A], however, has been [B] due to habitat loss.","ko":"그러나 그들의 [A]은(는) 서식지 감소로 인해 [B].","bank":["population","decreasing","pollinators","gardens","flowers","experts"],"bko":{"population":"개체수","decreasing":"줄어들고 있는","pollinators":"꽃가루 매개자들","gardens":"정원들","flowers":"꽃들","experts":"전문가들"},"r":{"a":"[A] population (개체수), [B] decreasing (줄어들고 있는)","ev":"3번 문장","s":[[3,"Their population, however, has been decreasing due to habitat loss.","그러나 그들의 개체수는 서식지 감소로 인해 줄어들고 있다."]],"w":"3번 Their population, however, has been decreasing due to habitat loss에서 가져왔어요. 서식지가 줄어서 벌들의 개체수(population)가 줄어들고 있다(has been decreasing)는 내용이에요. has been 뒤에는 -ing형이, Their 뒤에는 단수 명사가 와야 해서 나머지 단어는 맞지 않아요.","c":null},"h":"9374540911"}]},{"u":8,"id":"rj4-08-2","no":2,"ko":"잃어버린 5,798m","items":[{"n":1,"t":"tf","q":"Mt. Everest’s peak is 8,848 meters above sea level.","ko":"에베레스트산의 꼭대기는 해발
