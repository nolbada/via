 afford this dye.)","ko":"(왕족과 같은 부유한 사람들만이 이 염료를 살 수 있었다.)","opts":["살 형편이 되다","만들어 내다","빌려주다","발견하다"],"word":"afford","r":{"a":"1) 살 형편이 되다","ev":"8번 문장","s":[[8,"Only wealthy people, like royalty, could afford this dye.","왕족과 같은 부유한 사람들만이 이 염료를 살 수 있었다."]],"w":"염료가 매우 비싸서(7번) 부자만 어떻게 했다는 흐름이에요. afford는 '살 여유가 되다'예요.","c":1},"h":"28161379d7"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSo it was not used for objects as common as national flags.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"그래서 그것은 국기처럼 일반적인 물건에는 사용되지 않았다.","opts":["보라색 염료","지중해의 달팽이","왕족","국기"],"r":{"a":"1) 보라색 염료","ev":"8~9번 문장","s":[[8,"Only wealthy people, like royalty, could afford this dye.","왕족과 같은 부유한 사람들만이 이 염료를 살 수 있었다."],[9,"So it was not used for objects as common as national flags.","그래서 그것은 국기처럼 일반적인 물건에는 사용되지 않았다."]],"c":1,"k":"it = 보라색 염료"},"pron":"it","h":"5e2a1cc0ee"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This made purple dye difficult to produce and therefore extremely expensive.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 보라색 염료를 생산하기 어렵게 만들었고 그 결과 보라색 염료를 매우 비싸게 만들었다.","opts":["그 때문에 보라색 염료는 만들기 쉬워졌고 값도 아주 싸졌다.","그 때문에 보라색 염료는 만들기 어려웠고 그 결과 값이 아주 비쌌다.","보라색 염료는 값이 아주 비쌌기 때문에 만들기 어려웠다.","그 때문에 보라색 염료는 만들기 어려웠지만 값은 보통이었다."],"r":{"a":"2) 그 때문에 보라색 염료는 만들기 어려웠고 그 결과 값이 아주 비쌌다.","ev":"7번 문장","s":[[7,"This made purple dye difficult to produce and therefore extremely expensive.","이것은 보라색 염료를 생산하기 어렵게 만들었고 그 결과 보라색 염료를 매우 비싸게 만들었다."]],"c":2,"k":null},"h":"4bf581873c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["윌리엄 퍼킨은 1856년에 처음으로 달팽이로 염료를 만들었다.","왕족은 보라색 염료를 살 수 없었다.","대부분의 국기는 보라색이 대중화된 뒤에 만들어졌다.","보라색이 인기를 얻을 때쯤 대부분의 국기는 이미 보라색 없이 만들어져 있었다."],"opts":["William Henry Perkin first made dye from snails in 1856.","Royalty could not afford purple dye.","Most national flags were created after purple became popular.","By the time purple became popular, most national flags had already been created without it."],"r":{"a":"4) By the time purple became popular, most national flags had already been created without it.","ev":"13번 문장","s":[[13,"However, by that time, most national flags had already been created without using purple in their designs.","그러나 그때쯤에는 대부분 국기가 디자인에 보라색을 사용하지 않고 이미 만들어져 있었다."]],"w":"13번과 같아요. 퍼킨은 달팽이 없이 만드는 방법을 발견했고(10번), 왕족과 부자는 살 수 있었고(8번), 국기는 대부분 그 전에 만들어졌어요.","c":4},"h":"611a0a8006"},{"n":9,"t":"sum","q":"Purple is (A) seen in national flags, and this is related to how much purple dye used to (B).","ko":"보라색은 국기에서 (A) 볼 수 있고, 이것은 보라색 염료가 과거에 얼마나 (B)와 관련이 있다.","oko":["(A) 자주 / (B) 비용이 들었는지","(A) 거의 / (B) 맛이 났는지","(A) 거의 / (B) 비용이 들었는지","(A) 자주 / (B) 맛이 났는지","(A) 거의 / (B) 색이 변했는지"],"opts":["(A) often / (B) cost","(A) rarely / (B) taste","(A) rarely / (B) cost","(A) often / (B) taste","(A) rarely / (B) change"],"r":{"a":"3) (A) rarely / (B) cost","ev":"2번, 4번 문장","s":[[2,"But you’ll rarely see the color purple in any of the flags.","그러나 당신은 어떤 국기에서도 보라색을 거의 볼 수 없을 것이다."],[4,"It is related to how much purple dye used to cost.","그것은 보라색 염료가 얼마나 비용이 들었는지와 관련이 있다."]],"w":"2번에서 보라색은 국기에서 거의 볼 수 없다고 하고, 4번에서 그것이 보라색 염료가 과거에 얼마나 비용이 들었는지와 관련 있다고 해요.","c":3},"h":"0fb71a4096"},{"n":10,"t":"fill","q":"Because of Perkin’s discovery, large [A] of purple dye could be made [B].","ko":"퍼킨의 발견 덕분에, 많은 [A]의 보라색 염료가 [B] 만들어질 수 있었다.","bank":["amounts","cheaply","snails","wealthy","royalty","flags"],"bko":{"amounts":"양","cheaply":"저렴하게","snails":"달팽이","wealthy":"부유한","royalty":"왕족","flags":"국기"},"r":{"a":"[A] amounts, [B] cheaply","ev":"11번 문장","s":[[11,"Because of this discovery, large amounts of purple dye could be made cheaply.","이 발견으로 인해, 많은 양의 보라색 염료가 저렴하게 만들어질 수 있었다."]],"w":"11번의 large amounts of(다량의)와 made cheaply(저렴하게 만들어졌다)를 그대로 써요. [A]는 large 뒤 of 앞이라 amounts, [B]는 made 뒤라 방법을 나타내는 cheaply예요.","c":null},"h":"d6ad072a84"}]},{"u":7,"id":"ch1-07-3","no":3,"ko":"춤인가, 싸움인가","items":[{"n":1,"t":"tf","q":"At first, people may assume that two people standing face to face are fighting.","ko":"처음에는 사람들이 서로 얼굴을 맞대고 서 있는 두 사람이 싸우고 있다고 추측할지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"If you see two people standing face to face, you might initially assume they are fighting.","만약 당신이 서로 얼굴을 맞대고 서 있는 두 사람을 본다면, 당신은 처음에 그들이 싸우고 있다고 추측할지도 모른다."]],"w":"1번 문장과 같은 내용이에요. 처음에는 싸우고 있다고 추측할 수 있어요.","c":"T"},"h":"5b140141dd"},{"n":2,"t":"tf","q":"On second glance, the writer thinks the two people are still fighting.","ko":"다시 보면, 글쓴이는 두 사람이 여전히 싸우고 있다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"But on second glance, it looks like they are dancing instead.","하지만 다시 보면, 그들은 대신에 춤을 추는 것처럼 보인다."]],"w":"2번 문장에서 다시 보면 그들이 '대신에 춤을 추는 것처럼' 보인다고 해요. 여전히 싸우는 것이 아니에요.","c":"F"},"h":"13e762f128"},{"n":3,"t":"tf","q":"Today, people all over the world practice capoeira.","ko":"오늘날 전 세계의 사람들이 카포에이라를 연습한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Today, lots of people practice capoeira all over the world, saying it gives them power and flexibility.","오늘날에는 전 세계 수많은 사람들이 카포에이라를 연습하고 있으며, 이것이 자신에게 힘과 유연성을 준다고 말한다."]],"w":"10번 문장과 같은 내용이에요. 오늘날 전 세계 많은 사람들이 연습해요.","c":"T"},"h":"ecc18efd3b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…they started training to protect themselves.)","ko":"(…그들은 자신을 보호하기 위해 훈련을 시작했다.)","opts":["보호하다","공격하다","훈련하다","숨기다"],"word":"protect","r":{"a":"1) 보호하다","ev":"7번 문장","s":[[7,"Taken from their homes and forced to work on farms, they started training to protect themselves.","그들은 고향에서 끌려와 농장에서 강제로 일하게 되었기 때문에, 자신을 보호하기 위해 훈련을 시작했다."]],"w":"노예들이 고향에서 끌려와 농장에서 강제로 일하게 되었기 때문에, 자신을 어떻게 하려고 훈련을 시작했다는 흐름이에요. protect는 '보호하다'예요.","c":1},"h":"1ce6fc2308"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…so they disguised it as a dance.)","ko":"(…그래서 그들은 그것을 춤처럼 위장했다.)","opts":["거절했다","설명했다","위장했다","자랑했다"],"word":"disguised","r":{"a":"3) 위장했다","ev":"8번 문장","s":[[8,"However, they had to keep their training a secret from their owners, so they disguised it as a dance.","하지만 그들은 주인으로부터 그들의 훈련을 비밀로 해야 해서, 훈련을 춤처럼 위장했다."]],"w":"훈련을 주인에게 비밀로 해야 해서(so) 훈련을 춤인 것처럼 보이게 했다는 흐름이에요. disguise는 '위장하다'예요.","c":3},"h":"1162fd8b74"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nParticipants look like they are communicating with their movements, which include kicks, spins, and flips.","ko":"밑줄 친 which가 가리키는 것은?","sko":"참가자들은 발차기, 회전, 공중제비를 포함한 움직임으로 소통하는 것처럼 보인다.","opts":["참가자들","그들의 움직임","카포에이라","두 사람"],"r":{"a":"2) 그들의 움직임","ev":"5번 문장","s":[[5,"Participants look like they are communicating with their movements, which include kicks, spins, and flips.","참가자들은 발차기, 회전, 공중제비를 포함한 움직임으로 소통하는 것처럼 보인다."]],"w":"which 앞의 their movements를 가리켜요. 그 움직임에 kicks, spins, flips가 포함된다는 설명이에요.","c":2},"h":"9d7044b264"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Well, both of your assumptions are correct, because they are practicing capoeira.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사실, 당신의 두 가지 추측 모두 맞다. 왜냐하면 그들은 카포에이라를 연습하고 있기 때문이다.","opts":["두 사람이 싸우고 있다는 추측만 맞다.","두 사람이 춤을 추고 있다는 추측만 맞다.","두 사람이 카포에이라를 하고 있어서 두 추측이 모두 틀렸다.","두 추측이 모두 맞는데, 두 사람이 카포에이라를 하고 있기 때문이다."],"r":{"a":"4) 두 추측이 모두 맞는데, 두 사람이 카포에이라를 하고 있기 때문이다.","ev":"3번 문장","s":[[3,"Well, both of your assumptions are correct, because they are practicing capoeira.","사실, 당신의 두 가지 추측 모두 맞다. 왜냐하면 그들은 카포에이라를 연습하고 있기 때문이다."]],"w":"both of your assumptions are correct는 '두 가지 추측 모두 맞다'예요. 이유는 because 뒤의 '카포에이라를 하고 있기 때문'이에요.","c":4},"h":"d0b3a3d885"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["카포에이라는 아메리카 원주민의 농부들이 브라질에서 만들었다.","카포에이라는 노예들이 브라질에 오기 전에 아프리카에서 만들어졌다.","카포에이라는 약 500년 전 브라질에서 아프리카 노예들이 만들었다.","카포에이라는 농장 주인들이 만들어 노예들에게 가르쳤다."],"opts":["Capoeira was created by Native American farmers in Brazil.","Capoeira was created in Africa before slaves came to Brazil.","Capoeira was created in Brazil about 500 years ago by African slaves.","Capoeira was created by farm owners and taught to slaves."],"r":{"a":"3) Capoeira was created in Brazil about 500 years ago by African slaves.","ev":"6번 문장","s":[[6,"According to history, capoeira was created in Brazil about 500 years ago by African slaves.","역사에 따르면, 카포에이라는 약 500년 전 아프리카 노예들에 의해 브라질에서 만들어졌다."]],"w":"6번 문장과 같아요. 만든 곳은 브라질이고, 만든 사람은 아프리카 노예들이에요.","c":3},"h":"e0790f1707"},{"n":9,"t":"sum","q":"Capoeira is a Brazilian art that (A) fighting, dance, and acrobatics, and it was developed by slaves who wanted to practice (B).","ko":"카포에이라는 싸움, 춤, 곡예를 (A) 브라질의 예술이며, 노예들이 (B)을 연습하고자 발전시켰다.","oko":["(A) 나누는 / (B) 수영","(A) 결합한 / (B) 농사","(A) 나누는 / (B) 자기방어","(A) 피하는 / (B) 자기방어","(A) 결합한 / (B) 자기방어"],"opts":["(A) divides / (B) swimming","(A) combines / (B) farming","(A) divides / (B) self-defense","(A) avoids / (B) self-defense","(A) combines / (B) self-defense"],"r":{"a":"5) (A) combines / (B) self-defense","ev":"4번, 9번 문장","s":[[4,"Capoeira is a Brazilian art form traditionally performed by two people that combines fighting, dance, and acrobatics.","카포에이라는 전통적으로 두 사람에 의해 수행되는 무술과 춤, 곡예를 결합한 브라질의 예술 형태이다."],[9,"They added their traditional music, singing, and rhythm, and continued to develop their art until it became useful not only for learning fighting skills but also for practicing self-defense.","그들은 그들의 전통적인 음악, 노래, 리듬을 가미했고, 싸움 기술을 배우는 데뿐만 아니라 자기방어를 연습하기 위해서도 유용해질 때까지 그들의 예술을 계속 발전시켰다."]],"w":"4번에서 카포에이라는 싸움, 춤, 곡예를 결합한 예술이라 하고, 9번에서 자기방어를 연습하는 데에도 유용해질 때까지 발전시켰다고 해요.","c":5},"h":"1cd4caba83"},{"n":10,"t":"fill","q":"Moreover, capoeira gives people more self-confidence, [A] (the ability to concentrate), and [B] (bravery).","ko":"게다가 카포에이라는 사람들에게 더 많은 자신감, [A](집중하는 능력), 그리고 [B](용감함)를 준다.","bank":["focus","courage","kicks","owners","farms","flips"],"bko":{"focus":"집중력","courage":"용기","kicks":"발차기","owners":"주인","farms":"농장","flips":"공중제비"},"r":{"a":"[A] focus, [B] courage","ev":"11번 문장","s":[[11,"Moreover, it gives them more self-confidence, focus, and courage.","게다가 카포에이라는 그들에게 자신감, 집중력, 그리고 용기를 더 심어 준다."]],"w":"11번 문장 그대로예요. self-confidence, focus, courage가 나열돼요. kicks와 flips는 5번의 움직임이고, owners와 farms는 7~8번에 나오는 말이라 이 자리에 맞지 않아요.","c":null},"h":"2a6d93a04f"}]},{"u":7,"id":"ch1-07-4","no":4,"ko":"수능:ON 글의 순서","items":[{"n":1,"t":"tf","q":"The earliest known use of perfume was in ancient Egypt.","ko":"향수가 최초로 사용된 것으로 알려진 시기는 고대 이집트에서였다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The earliest known use of perfume was in ancient Egypt.","향수가 최초로 사용된 것으로 알려진 시기는 고대 이집트에서였다."]],"w":"4번 문장과 같은 내용이에요. 최초로 알려진 향수 사용은 고대 이집트였어요.","c":"T"},"h":"bb00e1b1a6"},{"n":2,"t":"tf","q":"Ancient Egyptian perfumes were liquids that people put on their skin.","ko":"고대 이집트의 향수는 사람들이 피부에 바르는 액체였다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"These perfumes were sticks that were burned to give off a pleasant smell.","이 향수는 기분 좋은 향을 내뿜기 위해 태워지는 막대기였다."]],"w":"5번 문장에서 이집트의 향수는 태워서 좋은 향을 내뿜는 '막대기'였다고 해요. 피부에 바르는 액체가 아니에요.","c":"F"},"h":"1a0ae06be0"},{"n":3,"t":"tf","q":"The perfumes in Tutankhamen’s tomb had lost their smell completely.","ko":"투탕카멘 무덤의 향수는 향이 완전히 사라져 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"Surprisingly, their fragrances could still be smelled nearly 3,300 years after the tomb was created.","놀랍게도, 그 무덤이 만들어진 지 거의 3,300년이 지났지만 여전히 그것들의 향기를 맡을 수 있었다."]],"w":"14번 문장에서 무덤이 만들어진 지 거의 3,300년이 지났지만 여전히 향기를 맡을 수 있었다고 해요.","c":"F"},"h":"1f40ba5bcd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It was thought the nice smell would attract the favor of the gods.)","ko":"(좋은 향은 신의 은혜를 불러올 것이라고 여겨졌다.)","opts":["쫓아내다","끌어당기다","잊게 하다","나누어 주다"],"word":"attract","r":{"a":"2) 끌어당기다","ev":"7번 문장","s":[[7,"It was thought the nice smell would attract the favor of the gods.","좋은 향은 신의 은혜를 불러올 것이라고 여겨졌다."]],"w":"좋은 향이 신의 은혜를 어떻게 한다고 여겼는지가 핵심이에요. 향이 좋으면 신의 은혜를 얻는다는 뜻이라 attract는 '끌어당기다, 불러오다'예요.","c":2},"h":"3b0732a7c6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…having lots of perfumes, especially strong ones, would increase their chances of going to heaven.)","ko":"(…많은 향수, 특히 진한 향수를 가지고 있으면 천국에 갈 확률을 높일 것이다.)","opts":["줄이다","유지하다","높이다","막다"],"word":"increase","r":{"a":"3) 높이다","ev":"11번 문장","s":[[11,"According to evidence found in ancient tombs, they believed that having lots of perfumes, especially strong ones, would increase their chances of going to heaven.","고대 무덤에서 발견된 증거에 따르면, 그들은 많은 향수, 특히 진한 (향의) 향수를 가지고 있으면 천국에 갈 확률을 높일 것이라고 믿었다."]],"w":"향수를 많이 가지면 천국에 갈 확률이 어떻게 된다고 믿었는지를 묻는 문장이에요. 믿음의 이유라서 확률이 커진다는 뜻이고, increase는 '높이다'예요.","c":3},"h":"e524ff98a6"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAmazingly, they even thought that perfume would help them after they died.","ko":"밑줄 친 them이 가리키는 것은?","sko":"놀랍게도, 그들은 심지어 향수가 그들이 죽은 후에도 그들을 도울 것이라고 생각했다.","opts":["신들","고대 이집트인들","향수들","무덤의 발견자들"],"r":{"a":"2) 고대 이집트인들","ev":"10번 문장","s":[[10,"Amazingly, they even thought that perfume would help them after they died.","놀랍게도, 그들은 심지어 향수가 그들이 죽은 후에도 그들을 도울 것이라고 생각했다."]],"w":"10번에서 주어 they는 이집트인들이에요. '향수가 그들(them)을 도울 것'이라고 했으니 them도 같은 이집트인들이에요.","c":2},"h":"0ad332e07b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But this wasn’t always what perfume was used for.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그런데 항상 이것이 향수가 사용된 목적은 아니었다.","opts":["향수는 이런 목적으로 쓰인 적이 전혀 없었다.","향수는 늘 이런 목적으로만 쓰였다.","향수가 항상 이런 목적으로 쓰인 것은 아니었다.","향수는 더 이상 이런 목적으로 쓰이지 않는다."],"r":{"a":"3) 향수가 항상 이런 목적으로 쓰인 것은 아니었다.","ev":"3번 문장","s":[[3,"But this wasn’t always what perfume was used for.","그런데 항상 이것이 향수가 사용된 목적은 아니었다."]],"w":"not always는 '항상 ~인 것은 아니다'라는 부분 부정이에요. what perfume was used for는 '향수가 사용된 목적'이라서, 요즘의 목적(2번)만이 전부는 아니었다는 뜻이에요. '전혀 없었다'와는 달라요.","c":3},"h":"ef195ca9f9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이집트인들은 향수를 특별한 날에만 사용했다.","투탕카멘의 무덤에서 발견된 향수는 아무 냄새도 나지 않았다.","이집트인들은 신들이 향수를 쓰지 않는 사람들을 좋아한다고 믿었다.","이집트인들은 일상생활에서 많은 향수를 사용했다."],"opts":["The Egyptians used perfume only on special days.","The perfumes found in Tutankhamen’s tomb had no smell.","The Egyptians believed the gods favored people who did not wear perfume.","The Egyptians used a lot of perfume in their daily lives."],"r":{"a":"4) The Egyptians used a lot of perfume in their daily lives.","ev":"9번 문장","s":[[9,"So they used a lot of perfume in their daily lives.","그래서 그들은 일상생활에서 많은 향수를 사용했다."]],"w":"9번 문장과 같아요. 일상생활에서 많은 향수를 썼어요. 8번에서 신들은 좋은 향이 나는 사람들을 더 친절하게 대한다고 믿었고, 14번에서 3,300년 후에도 향기를 맡을 수 있었어요.","c":4},"h":"afcf6e5ff7"},{"n":9,"t":"sum","q":"Perfume has always been an important part of human (A), and these days we use it to feel more (B).","ko":"향수는 항상 인류 (A)의 중요한 부분이었고, 요즘 우리는 더 (B) 느끼기 위해 향수를 사용한다.","oko":["(A) 과학 / (B) 피곤한","(A) 문화 / (B) 피곤한","(A) 과학 / (B) 매력적인","(A) 음식 / (B) 매력적인","(A) 문화 / (B) 매력적인"],"opts":["(A) science / (B) tired","(A) culture / (B) tired","(A) science / (B) attractive","(A) food / (B) attractive","(A) culture / (B) attractive"],"r":{"a":"5) (A) culture / (B) attractive ((A) 문화 / (B) 매력적인)","ev":"1~2번 문장","s":[[1,"Perfume has always been an important part of human culture.","향수는 항상 인류 문화의 중요한 부분이었다."],[2,"These days, of course, we use perfume to make ourselves smell nicer and feel more attractive.","물론, 요즘에 우리는 우리 자신을 더 좋은 향이 나게 하고 더 매력적으로 느끼게 하기 위해 향수를 사용한다."]],"c":5,"k":null},"h":"2e28041800"},{"n":10,"t":"fill","q":"The tomb of the pharaoh Tutankhamen is a good [A] of this belief, because its discoverers found [B] of perfumes and oils around the body.","ko":"파라오 투탕카멘의 무덤은 이 믿음의 좋은 [A]이며, 발견자들이 시체 주위에서 향수와 기름이 담긴 [B]를 발견했기 때문이다.","bank":["example","jars","chances","fragrance","heaven","ritual"],"bko":{"example":"예","jars":"단지들","chances":"확률","fragrance":"향기","heaven":"천국","ritual":"의식"},"r":{"a":"[A] example, [B] jars","ev":"12~13번 문장","s":[[12,"The ancient Egyptian pharaoh Tutankhamen’s tomb provides a good example of this.","고대 이집트의 파라오인 투탕카멘의 무덤이 이것의 좋은 예를 제시한다."],[13,"The tomb’s discoverers found jars of perfumes and oils surrounding the body.","그 무덤의 발견자들은 시체를 둘러싸고 있는 향수와 기름단지를 발견했다."]],"w":"12번에서 투탕카멘의 무덤이 this(11번의 믿음)의 a good example을 제공한다고 하고, 13번에서 발견자들이 jars of perfumes and oils를 발견했다고 해요. a good 뒤와 found 뒤의 of 앞에 맞는 말은 example과 jars예요.","c":null},"h":"d8b2758da9"}]},{"u":8,"id":"ch1-08-1","no":1,"ko":"달리면 무지개가 된다!","items":[{"n":1,"t":"tf","q":"At the end of the race, everyone gets to join a party called the “finish festival.”","ko":"경주의 마지막에는 모두가 ‘마무리 축제’라는 파티에 참가하게 된다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"At the end of the race, everyone gets to participate in the “finish festival,” a wild party with music, dancing, and more colored powder!","경주의 마지막에는, 모두가 음악과 춤, 더 많은 색의 가루가 있는 열광적인 파티인 ‘마무리 축제’에 참가하게 된다!"]],"w":"13번 문장에서 everyone gets to participate in the “finish festival”이라고 해요. 모두가 참가하니 맞는 내용이에요.","c":"T"},"h":"8b35cb0d10"},{"n":2,"t":"tf","q":"Runners are told to wear a dark T-shirt for the Color Run.","ko":"주자들은 컬러 런에 어두운 색 티셔츠를 입도록 안내받는다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Just be sure to wear a white T-shirt.","그저 반드시 흰색 티셔츠만 입어라."]],"w":"6번 문장에서 반드시 흰색(white) 티셔츠를 입으라고 해요. 어두운 색이라는 말은 없고 흰색과는 반대예요.","c":"F"},"h":"cd7debf8cf"},{"n":3,"t":"tf","q":"Taking part in the Color Run is very complicated.","ko":"컬러 런에 참가하는 것은 매우 복잡하다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Taking part is quite simple.","참가하는 것은 아주 간단하다."]],"w":"5번 문장에서 참가하는 것은 아주 간단하다(quite simple)고 해요. 복잡하다는 말은 반대예요.","c":"F"},"h":"92972a0b76"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If that sounds more exciting, you should sign up for the Color Run.)","ko":"그것이 더 흥미 있게 들린다면, 당신은 컬러 런을 신청해야 한다.","opts":["취소하다","추천하다","신청하다","포기하다"],"word":"sign up for","r":{"a":"3) 신청하다","ev":"4번 문장","s":[[4,"If that sounds more exciting, you should sign up for the Color Run, a race known as the “Happiest 5k on the Planet.”","만약 그것이 더 흥미 있게 들린다면, 당신은 ‘세상에서 가장 행복한 5킬로미터’라고 알려진 경주인 컬러 런(Color Run)을 신청해야 한다."]],"w":"4번은 더 흥미롭게 들리면 컬러 런을 어떻게 하라는 말일까요? 참가하려면 먼저 신청해야 해요. sign up for = ~을 신청하다.","c":3},"h":"fb0b2fdce4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The race brings people together, promoting health and happiness in the community.)","ko":"그 경주는 지역 사회에서 건강과 행복을 증진하면서 사람들을 화합하게 한다.","opts":["증진하는","줄이는","기록하는","방해하는"],"word":"promoting","r":{"a":"1) 증진하는","ev":"12번 문장","s":[[12,"The race brings people together, promoting health and happiness in the community.","그 경주는 지역 사회에서 건강과 행복을 증진하면서 사람들을 화합하게 한다."]],"w":"12번은 경주가 사람들을 화합하게 하면서 건강과 행복을 어떻게 한다는 말일까요? 키워 준다는 뜻이라 promote(증진하다)가 맞아요. 줄이거나 방해한다면 사람들을 화합하게 한다는 앞 내용과 어긋나요.","c":1},"h":"c388691280"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nDoes that sound a little boring?","ko":"밑줄 친 that이 가리키는 것은?","sko":"그것이 좀 지루하게 들리는가?","opts":["흰색 티셔츠를 입는 것","결승선을 통과하는 것","음악에 맞춰 춤추는 것","경주에서 달리는 것"],"r":{"a":"4) 경주에서 달리는 것","ev":"1~2번 문장","s":[[1,"Are you interested in running in a race?","당신은 경주에서 달리는 것에 관심 있는가?"],[2,"Does that sound a little boring?","그것이 좀 지루하게 들리는가?"]],"w":"2번의 that은 바로 앞 1번 문장에서 물은 '경주에서 달리는 것(running in a race)'을 가리켜요. 흰색 티셔츠나 춤은 뒤에서 처음 나오는 내용이라 that이 될 수 없어요.","c":4},"h":"198f81d1bf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Then, as you pass through each zone of the five-kilometer race, powder of a different color will be thrown on you.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러면, 당신이 5킬로미터 경주의 각 구간을 통과할 때, 다양한 색의 가루가 당신에게 뿌려질 것이다.","opts":["경주가 끝난 뒤에 모든 색의 가루를 한꺼번에 맞게 된다.","5킬로미터 경주에서 구간을 지날 때마다 서로 다른 색의 가루가 몸에 뿌려진다.","각 구간에서 당신이 다른 사람들에게 색 가루를 던져야 한다.","5킬로미터 경주 내내 한 가지 색의 가루만 뿌려진다."],"r":{"a":"2) 5킬로미터 경주에서 구간을 지날 때마다 서로 다른 색의 가루가 몸에 뿌려진다.","ev":"7번 문장","s":[[7,"Then, as you pass through each zone of the five-kilometer race, powder of a different color will be thrown on you.","그러면, 당신이 5킬로미터 경주의 각 구간을 통과할 때, 다양한 색의 가루가 당신에게 뿌려질 것이다."]],"w":"as you pass through each zone은 구간을 지날 때마다라는 뜻이고, powder of a different color는 구간마다 다른 색의 가루예요. will be thrown on you는 당신이 가루를 맞는다는 수동이라서 던지는 쪽이 아니에요.","c":2},"h":"6fe1073762"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["주자들은 우사인 볼트만큼 빠르게 달려야 한다.","각 주자의 완주 시간이 기록된다.","아무도 당신이 완주하는 데 걸리는 시간을 기록하지 않는다.","느리게 달리는 사람은 마무리 축제에 참가할 수 없다."],"opts":["Runners have to run as fast as Usain Bolt.","Each runner’s finishing time is recorded.","No one keeps a record of how long you take to finish.","Slow runners cannot join the finish festival."],"r":{"a":"3) No one keeps a record of how long you take to finish.","ev":"11번 문장","s":[[11,"You don’t have to run like Usain Bolt—no one will keep track of how long it takes you to finish.","당신은 우사인 볼트처럼 달리지 않아도 된다. 아무도 당신이 완주하는 데 얼마나 오래 걸리는지 기록하지 않을 것이다."]],"w":"11번에서 우사인 볼트처럼 달리지 않아도 되고 아무도 완주 시간을 기록하지 않는다고 해요. 그래서 1번과 2번은 반대예요. 4번은 13번에서 모두가(everyone) 마무리 축제에 참가한다고 했으므로 틀려요.","c":3},"h":"7a661c9843"},{"n":9,"t":"sum","q":"In the Color Run, runners are (A) in colored powder, so they look like a (B) when they finish.","ko":"컬러 런에서 주자들은 색 가루에 (A)해서, 완주할 때쯤이면 (B)처럼 보인다.","oko":["(A) 잃어버려서 / (B) 무지개","(A) 뒤덮여서 / (B) 축제","(A) 던져져서 / (B) 무지개","(A) 뒤덮여서 / (B) 티셔츠","(A) 뒤덮여서 / (B) 무지개"],"opts":["(A) lost / (B) rainbow","(A) covered / (B) festival","(A) thrown / (B) rainbow","(A) covered / (B) T-shirt","(A) covered / (B) rainbow"],"r":{"a":"5) (A) covered / (B) rainbow","ev":"3·8번 문장","s":[[3,"How about one in which the runners are covered in yellow, red, blue, and green when they cross the finish line?","주자들이 결승선을 통과할 때 노란색, 빨간색, 파란색, 그리고 녹색으로 뒤덮이는 경주는 어떤가?"],[8,"By the time you finish, you will look like a rainbow!","당신이 완주할 때쯤이면, 당신은 무지개처럼 보일 것이다!"]],"w":"3번에서 주자들은 여러 색으로 뒤덮이고(covered), 8번에서 완주할 때쯤이면 무지개(rainbow)처럼 보인다고 해요. 던져지는 것은 주자가 아니라 가루이고, 축제와 티셔츠는 주자의 모습을 나타내는 말이 아니에요.","c":5},"h":"5a2d11b8f9"},{"n":10,"t":"fill","q":"The Color Run was first held in [A] in 2012, and it has since spread to many other [B] around the world.","ko":"컬러 런은 2012년에 [A]에서 처음 열렸고, 그 이후로 전 세계의 다른 많은 [B](으)로 퍼졌다.","bank":["Phoenix","cities","zone","powder","festival","T-shirt"],"bko":{"Phoenix":"피닉스","cities":"도시들","zone":"구간","powder":"가루","festival":"축제","T-shirt":"티셔츠"},"r":{"a":"[A] Phoenix, [B] cities","ev":"9~10번 문장","s":[[9,"The race was first run in the American city of Phoenix in January of 2012.","이 경주는 2012년 1월에 미국의 피닉스시에서 처음으로 시행되었다."],[10,"Since then, it has taken place in many other cities around the world, including Seoul, South Korea.","그때 이후로, 그것은 한국의 서울을 포함하여 전 세계의 많은 다른 도시들에서 개최되어 왔다."]],"w":"9번에서 미국 피닉스시에서 처음 시행되었고, 10번에서 그 이후로 서울을 포함한 세계의 많은 다른 도시들에서 열렸다고 해요. rainbow, powder, festival, T-shirt는 장소로 쓸 수 없어요.","c":null},"h":"c4631f695a"}]},{"u":8,"id":"ch1-08-2","no":2,"ko":"휘게, 행복하게","items":[{"n":1,"t":"tf","q":"In Denmark, people like to stay inside their warm homes because the winters are long and cold.","ko":"덴마크에서는 겨울이 길고 춥기 때문에 사람들이 따뜻한 집 안에 머무르는 것을 좋아한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Denmark’s winters are long and cold, so people like to stay inside their warm homes and eat their favorite foods.","덴마크의 겨울은 길고 추워서, 사람들은 따뜻한 집 안에 있으면서 그들이 가장 좋아하는 음식을 먹는 것을 좋아한다."]],"w":"7번 문장에서 덴마크의 겨울은 길고 춥고(long and cold), so 뒤에 사람들이 따뜻한 집 안에 있는 것을 좋아한다고 해요. 원인과 결과가 본문과 같아요.","c":"T"},"h":"73dcbadfea"},{"n":2,"t":"tf","q":"The passage says it is best to enjoy hygge alone.","ko":"이 글은 휘게를 혼자서 즐기는 것이 가장 좋다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Although there’s nothing wrong with doing things alone, it is best to enjoy hygge with good friends.","혼자서 무언가를 하는 데 아무런 문제가 없긴 하지만, 좋은 친구들과 함께 휘게를 즐기는 것이 가장 좋다."]],"w":"10번 문장은 혼자 하는 것도 문제는 없지만(Although), 좋은 친구들과 함께 휘게를 즐기는 것이 가장 좋다고 해요. 혼자가 가장 좋다는 말은 반대예요.","c":"F"},"h":"70e463ce88"},{"n":3,"t":"tf","q":"Comfort is an unimportant part of hygge.","ko":"안락은 휘게에서 중요하지 않은 부분이다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Comfort is an important part of hygge.","안락은 휘게의 중요한 부분이다."]],"w":"6번 문장에서 Comfort는 an important part of hygge, 즉 휘게의 중요한 부분이라고 해요. unimportant는 반대 뜻이에요.","c":"F"},"h":"f8502bdea5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is a difficult word to define because it refers to a general feeling.)","ko":"그것은 일반적인 느낌을 나타내기 때문에 정의하기 어려운 단어이다.","opts":["번역하다","발음하다","정의하다","기억하다"],"word":"define","r":{"a":"3) 정의하다","ev":"4번 문장","s":[[4,"It is a difficult word to define because it refers to a general feeling.","그것은 일반적인 느낌을 나타내기 때문에 정의하기 어려운 단어이다."]],"w":"4번은 휘게가 일반적인 느낌을 나타내서 어려운 단어라고 해요. 어려운 이유가 되려면 뜻을 딱 잘라 말하기 어렵다는 것이라서 define(정의하다)이 맞아요. 번역, 발음, 기억은 '일반적인 느낌' 때문에 어려운 일과 이어지지 않아요.","c":3},"h":"51f361d0ae"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The word appeared in Danish writing for the first time during the 18th century.)","ko":"이 단어는 18세기에 처음으로 덴마크 글에 등장했다.","opts":["나타났다","사라졌다","바뀌었다","번역되었다"],"word":"appeared","r":{"a":"1) 나타났다","ev":"3번 문장","s":[[3,"The word appeared in Danish writing for the first time during the 18th century, and hygge soon became a big part of Danish culture.","이 단어는 18세기에 처음으로 덴마크 글에 등장했으며, 휘게는 곧 덴마크 문화의 큰 부분이 되었다."]],"w":"3번은 단어가 덴마크 글에서 처음(for the first time) 어떻게 되었다는 말일까요? 처음 보였다는 뜻이라 appear(나타나다)의 과거형 appeared가 맞아요. 사라졌다면 first time과 맞지 않아요.","c":1},"h":"1143596efc"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nOne of the reasons for this is something called hygge.","ko":"밑줄 친 this가 가리키는 것은?","sko":"이것에 대한 이유 중 하나는 휘게라고 불리는 것에 있다.","opts":["덴마크의 겨울이 길고 춥다는 것","덴마크가 세계에서 가장 행복한 나라 중 하나로 여겨진다는 것","휘게가 18세기에 처음 글에 나왔다는 것","좋은 친구들과 함께 지낸다는 것"],"r":{"a":"2) 덴마크가 세계에서 가장 행복한 나라 중 하나로 여겨진다는 것","ev":"1~2번 문장","s":[[1,"Denmark is considered one of the happiest countries in the world.","덴마크는 세계에서 가장 행복한 국가 중 하나로 여겨진다."],[2,"One of the reasons for this is something called hygge.","이것에 대한 이유 중 하나는 휘게라고 불리는 것에 있다."]],"w":"2번의 this는 바로 앞 1번 문장의 내용을 받아요. 덴마크가 세계에서 가장 행복한 나라 중 하나로 여겨지는 것이 this이고, 그 이유 중 하나가 휘게예요. 나머지는 휘게의 이유가 아니라 뒤에서 따로 나오는 내용이에요.","c":2},"h":"41ee3cda76"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For instance, taking a walk is a perfect way to spend an afternoon.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"예를 들어, 산책하는 것은 오후를 보내는 완벽한 방법이다.","opts":["오후에는 산책을 하지 않는 편이 가장 좋다.","완벽한 오후를 보내려면 먼 곳까지 걸어가야 한다.","산책은 오후에만 할 수 있는 활동이다.","산책은 오후 시간을 보내기에 완벽한 방법이다."],"r":{"a":"4) 산책은 오후 시간을 보내기에 완벽한 방법이다.","ev":"9번 문장","s":[[9,"For instance, taking a walk is a perfect way to spend an afternoon.","예를 들어, 산책하는 것은 오후를 보내는 완벽한 방법이다."]],"w":"taking a walk은 산책하는 것, a perfect way to spend an afternoon은 오후를 보내는 완벽한 방법이에요. 산책이 오후를 보내기에 알맞은 방법이라는 말이지, 먼 곳까지 가야 하거나 오후에만 할 수 있다는 말은 아니에요.","c":4},"h":"4ff4a747a7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["휘게는 20세기에 덴마크에서 인기를 얻기 시작했다.","덴마크 사람들은 겨울에 집 안에 머무르는 것을 싫어한다.","휘게 생활방식은 단순하고 편안한 활동을 자주 포함한다.","휘게는 혼자서 즐기는 것이 가장 좋다."],"opts":["Hygge began to be popular in Denmark in the 20th century.","Danish people dislike staying inside during the winter.","A hygge lifestyle often includes simple and relaxing activities.","It is best to enjoy hygge alone."],"r":{"a":"3) A hygge lifestyle often includes simple and relaxing activities.","ev":"8번 문장","s":[[8,"Also, this lifestyle often includes simple and relaxing activities.","또한, 이러한 생활방식은 종종 단순하고 편안한 활동을 포함한다."]],"w":"8번에서 휘게 생활방식은 종종 단순하고 편안한 활동을 포함한다고 해요. 1번은 3번에서 18세기에 처음 글에 나왔다고 한 것과 다르고, 2번은 7번에서 집 안에 있는 것을 좋아한다고 한 것과 반대예요. 4번은 10번에서 친구들과 함께가 가장 좋다고 한 것과 반대예요.","c":3},"h":"522ce966d7"},{"n":9,"t":"sum","q":"The Danish hygge lifestyle is about enjoying (A) moments instead of looking for (B).","ko":"덴마크의 휘게 생활방식은 (B)를 찾는 대신 (A)한 순간을 즐기는 것이다.","oko":["(A) 바쁜 / (B) 신나는 일","(A) 조용한 / (B) 안락","(A) 외로운 / (B) 친구들","(A) 신나는 / (B) 안락","(A) 조용한 / (B) 신나는 일"],"opts":["(A) busy / (B) excitement","(A) quiet / (B) comfort","(A) lonely / (B) friends","(A) exciting / (B) comfort","(A) quiet / (B) excitement"],"r":{"a":"5) (A) quiet / (B) excitement","ev":"5번 문장","s":[[5,"The goal of a hygge lifestyle is not to seek out excitement, but to enjoy life’s quiet moments.","휘게 생활방식의 목표는 신나는 일을 찾아내는 것이 아니라, 인생의 조용한 순간을 즐기는 것이다."]],"w":"5번에서 휘게의 목표는 신나는 일(excitement)을 찾는 것이 아니라 인생의 조용한(quiet) 순간을 즐기는 것이에요. comfort는 6번에서 휘게의 중요한 부분이라 찾지 않는 대상이 아니고, 외로움은 10번에서 친구들과 함께가 좋다는 내용과 맞지 않아요.","c":5},"h":"098e2d5d33"},{"n":10,"t":"fill","q":"If you [A] to [B] a hygge lifestyle, take some time every day to do nothing but relax and be happy.","ko":"만약 당신이 휘게 생활방식으로 [B] 것을 [A] 경우, 매일 그저 쉬기만 하면서 행복해지는 시간을 가져라.","bank":["want","live","afternoon","friends","culture","winters"],"bko":{"want":"원하다","live":"살다","afternoon":"오후","friends":"친구들","culture":"문화","winters":"겨울들"},"r":{"a":"[A] want (원하다), [B] live (살다)","ev":"11번 문장","s":[[11,"If you want to live a hygge lifestyle, take some time every day to do nothing but relax and be happy.","만약 당신이 휘게 생활방식으로 살고 싶다면, 매일 그저 쉬기만 하면서 행복해지는 시간을 갖도록 하라."]],"c":null,"k":null},"h":"ac3a677a47"}]},{"u":8,"id":"ch1-08-3","no":3,"ko":"소원을 던져봐!","items":[{"n":1,"t":"tf","q":"Many people visit Hong Kong’s Tin Hau Temple at the start of the Lunar New Year.","ko":"많은 사람들이 음력 설날 초에 홍콩의 틴하우 사원을 방문한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"At the start of every Lunar New Year, many people visit Hong Kong’s Tin Hau Temple.","매해 음력 설날 초에, 많은 사람들이 홍콩의 틴하우 사원을 방문한다."]],"w":"1번 문장 그대로예요. 매해 음력 설날 초에 많은 사람이 틴하우 사원을 찾는다고 해요.","c":"T"},"h":"d5c4b67ba8"},{"n":2,"t":"tf","q":"In the past, people tied an orange to their wishes to protect the trees.","ko":"과거에는 나무를 보호하기 위해 소원(종이)에 오렌지를 묶었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"In the past, people would tie an orange to their wishes to make it easier to throw them.","과거에는 그것들을 던지는 것을 더 쉽게 하기 위해 소원(종이)에 오렌지를 묶곤 했다."]],"w":"7번 문장에서 오렌지를 묶은 이유는 소원을 던지는 것을 더 쉽게 하기 위해서였어요. 나무를 보호하려는 이유는 그 뒤에 플라스틱 오렌지로 바꾼 일(9번)에 나와요.","c":"F"},"h":"1ff3c4fc02"},{"n":3,"t":"tf","q":"People roll up the joss paper on which they have written their wish.","ko":"사람들은 소원을 적은 신상 앞에서 태우는 종이를 돌돌 만다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"To make a wish, people write their desire on a piece of joss paper, roll it up, and secure it with a piece of string.","소원을 빌기 위해, 사람들은 신상 앞에서 태우는 종이에 소원을 적고, 그것을 돌돌 말고, 끈으로 고정시킨다."]],"w":"4번 문장에서 사람들은 종이에 소원을 적고, 그것을 돌돌 말고(roll it up), 끈으로 고정시킨다고 해요.","c":"T"},"h":"cfcb16b328"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Once the wish is prepared, they launch it into the trees, attempting to get it caught on the highest branch.)","ko":"소원(종이)이 준비되면, 그들은 가장 높은 나뭇가지에 그것이 걸리기를 시도하며 그것을 나무에 던진다.","opts":["묻다","던지다","숨기다","태우다"],"word":"launch","r":{"a":"2) 던지다","ev":"5번 문장","s":[[5,"Once the wish is prepared, they launch it into the trees, attempting to get it caught on the highest branch.","소원(종이)이 준비되면, 그들은 가장 높은 나뭇가지에 그것이 걸리기를 시도하며 그것을 나무에 던진다."]],"w":"5번은 소원이 준비된 다음 나무의 가장 높은 가지에 걸리게 하려고 시도한다고 해요. 가지에 걸려면 나무 쪽으로 던져야 하니 launch는 '던지다'예요. 묻거나 숨기면 가지에 걸 수 없어요.","c":2},"h":"45ac8d6529"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Since then, countless people have journeyed to the temple in hopes of having their wishes fulfilled.)","ko":"그 이후로, 무수히 많은 사람들이 자신들의 소원이 이루어지길 바라며 그 사원으로 찾아왔다.","opts":["소수의","외국의","무수히 많은","어린"],"word":"countless","r":{"a":"3) 무수히 많은","ev":"3번 문장","s":[[3,"Since then, countless people have journeyed to the temple in hopes of having their wishes fulfilled.","그 이후로, 무수히 많은 사람들이 자신들의 소원이 이루어지길 바라며 그 사원으로 찾아왔다."]],"w":"3번은 2번의 회복 이야기 이후로(Since then) 사람들이 소원이 이루어지길 바라며 계속 사원을 찾아왔다는 내용이에요. 해마다 많은 사람이 찾는다는 1번과 이어지니 countless는 '무수히 많은'이 맞아요.","c":3},"h":"fc08d38bc4"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nTo protect them, people switched to plastic oranges and threw them onto artificial trees instead.","ko":"첫 번째 them(To protect them)이 가리키는 것은?","sko":"그것들을 보호하기 위하여, 사람들은 플라스틱 오렌지로 바꾸었고 대신에 인공 나무에 그것들을 던졌다.","opts":["나무들","플라스틱 오렌지들","사람들","소원(종이)들"],"r":{"a":"1) 나무들","ev":"8~9번 문장","s":[[8,"Unfortunately, the weight began damaging the trees.","불행히도, 그 무게가 나무를 훼손하기 시작했다."],[9,"To protect them, people switched to plastic oranges and threw them onto artificial trees instead.","그것들을 보호하기 위하여, 사람들은 플라스틱 오렌지로 바꾸었고 대신에 인공 나무에 그것들을 던졌다."]],"w":"9번의 To protect them은 보호할 대상을 말해요. 바로 앞 8번에서 오렌지의 무게가 훼손하기 시작한 것이 the trees(나무들)이므로 them은 나무들이에요. 플라스틱 오렌지는 같은 문장에서 새로 바꾼 것이라 보호할 대상이 아니에요.","c":1},"h":"7a4b8f3de5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"With these changes, the tradition has remained both environmentally friendly and popular today.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 변화로 인해, 오늘날에도 그 전통은 환경 친화적이고 인기가 있다.","opts":["이런 변화 덕분에 전통은 환경에는 해롭지만 인기는 있다.","이런 변화로 전통이 사라져서 오늘날에는 인기가 없다.","이런 변화로 인해 오늘날에도 그 전통은 환경 친화적이고 인기가 있다.","이런 변화가 있기 전에는 전통이 환경 친화적이었다."],"r":{"a":"3) 이런 변화로 인해 오늘날에도 그 전통은 환경 친화적이고 인기가 있다.","ev":"10번 문장","s":[[10,"With these changes, the tradition has remained both environmentally friendly and popular today.","이러한 변화로 인해, 오늘날에도 그 전통은 환경 친화적이고 인기가 있다."]],"w":"both A and B는 둘 다라는 뜻이라 environmentally friendly(환경 친화적인)와 popular(인기 있는)가 모두 맞아요. has remained는 오늘날까지 그렇게 유지되고 있다는 뜻이라 사라졌다는 말은 틀려요.","c":3},"h":"b79a208371"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["소원은 사원 근처의 강에 던져진다.","오늘날에도 진짜 오렌지를 소원에 묶는다.","사원은 여름에만 방문할 수 있다.","한 아픈 여자가 나뭇가지에 종이를 던진 뒤 회복했다."],"opts":["Wishes are thrown into a river near the temple.","Real oranges are still tied to wishes today.","The temple can be visited only in summer.","A sick woman recovered after throwing paper into the branches of a tree."],"r":{"a":"4) A sick woman recovered after throwing paper into the branches of a tree.","ev":"2번 문장","s":[[2,"According to legend, a sick woman once experienced a miraculous recovery after throwing a piece of joss paper into the branches of a tree there.","전설에 따르면, 한 아픈 여자가 그곳에 있는 나뭇가지에 신상 앞에서 태우는 종이를 던진 후 기적적인 회복을 경험했다."]],"w":"2번에서 전설에 따르면 아픈 여자가 나뭇가지에 신상 앞에서 태우는 종이를 던진 뒤 기적적으로 회복했다고 해요. 소원은 강이 아니라 나무에 던지고(5번), 오렌지는 9번에서 플라스틱으로 바뀌었고, 사원은 해마다 음력 설날 초에 방문해요(1번).","c":4},"h":"2c9e9d8bf2"},{"n":9,"t":"sum","q":"Wishes that fall back to the (A) mean that the person was overly (B).","ko":"(A)에 다시 떨어지는 소원(종이)은 그 사람이 지나치게 (B) 사람이었다는 뜻이다.","oko":["(A) 땅 / (B) 친절한","(A) 나무 / (B) 욕심 많은","(A) 땅 / (B) 욕심 많은","(A) 나무 / (B) 친절한","(A) 강 / (B) 욕심 많은"],"opts":["(A) ground / (B) kind","(A) tree / (B) greedy","(A) ground / (B) greedy","(A) tree / (B) kind","(A) river / (B) greedy"],"r":{"a":"3) (A) ground / (B) greedy ((A) 땅 / (B) 욕심 많은)","ev":"6번 문장","s":[[6,"The higher a wish lands, the greater the likelihood it will be granted, but wishes that fall back to the ground signify that the person was overly greedy.","소원(종이)이 더 높이 착지할수록, 그것이 이루어질 가능성이 더 커지지만, 땅에 떨어지는 소원(종이)은 그 사람이 지나치게 욕심이 많았다는 것을 의미한다."]],"c":3,"k":null},"h":"07e70041ea"},{"n":10,"t":"fill","q":"Unfortunately, the [A] of the oranges began [B] the trees.","ko":"불행히도, 오렌지의 [A]이(가) 나무를 [B] 시작했다.","bank":["weight","damaging","popular","sick","caught","artificial"],"bko":{"weight":"무게","damaging":"훼손하기","popular":"인기 있는","sick":"아픈","caught":"걸린","artificial":"인공의"},"r":{"a":"[A] weight (무게), [B] damaging (훼손하기)","ev":"8번 문장","s":[[8,"Unfortunately, the weight began damaging the trees.","불행히도, 그 무게가 나무를 훼손하기 시작했다."]],"c":null,"k":null},"h":"ef48beff63"}]},{"u":8,"id":"ch1-08-4","no":4,"ko":"수능:ON 문장 삽입","items":[{"n":1,"t":"tf","q":"The origins of the festival go back to the 12th century.","ko":"이 축제의 기원은 12세기로 거슬러 올라간다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The origins of the festival are from the 12th century.","이 축제의 기원은 12세기부터이다."]],"w":"6번 문장에서 축제의 기원은 12세기부터(are from the 12th century)라고 해요.","c":"T"},"h":"6366ffc65b"},{"n":2,"t":"tf","q":"The rotten oranges used in the festival are hard and dangerous.","ko":"축제에 쓰이는 썩은 오렌지는 단단하고 위험하다.","r":{"a":"F (본문과 다른 내용)","ev":"15번 문장","s":[[15,"It may sound dangerous, but because the oranges are rotten, they are quite soft.","위험하게 들릴지도 모르지만, 오렌지가 썩었기 때문에 매우 부드럽다."]],"w":"15번 문장에서 위험하게 들릴 수는 있지만 오렌지가 썩었기 때문에 매우 부드럽다(quite soft)고 해요. 단단하고 위험하다는 말은 반대예요.","c":"F"},"h":"a5089f7997"},{"n":3,"t":"tf","q":"The same two teams battle every day of the festival.","ko":"축제 동안 매일 똑같은 두 팀이 싸운다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"Each day of the festival, different teams battle.","축제 동안 매일, 서로 다른 팀들이 전투를 벌인다."]],"w":"14번 문장에서 축제 동안 매일 서로 다른(different) 팀들이 싸운다고 해요. 똑같은 두 팀이라는 말은 본문과 달라요.","c":"F"},"h":"35def8fea7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This fight is recreated annually, with oranges replacing the rocks.)","ko":"이 전투는 돌을 오렌지로 대체해서 매년 재현된다.","opts":["가끔","하루에","처음으로","매년"],"word":"annually","r":{"a":"4) 매년","ev":"9번 문장","s":[[9,"This fight is recreated annually, with oranges replacing the rocks.","이 전투는 돌을 오렌지로 대체해서 매년 재현된다."]],"w":"9번은 돌을 던지던 옛 전투를 지금은 오렌지로 다시 보여 준다는 내용이에요. 4번에서 해마다 2월에 열린다고 했으니 annually는 '매년'이에요. 가끔이나 하루에, 처음으로라면 해마다 이어지는 축제의 모습과 맞지 않아요.","c":4},"h":"9db2a15a5a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (More than 50,000 crates of rotten oranges are shipped to the town from Sicily.)","ko":"시칠리아에서부터 5만 상자가 넘는 썩은 오렌지가 마을로 운송된다.","opts":["상자","병","마차","성"],"word":"crates","r":{"a":"1) 상자","ev":"10번 문장","s":[[10,"More than 50,000 crates of rotten oranges are shipped to the town from Sicily.","시칠리아에서부터 5만 상자가 넘는 썩은 오렌지가 마을로 운송된다."]],"w":"10번은 5만이 넘는 무엇의 썩은 오렌지가 시칠리아에서 마을로 운송된다는 문장이에요. 오렌지를 담아 나르는 단위이니 crate는 '상자'예요. 마차(carriage)와 성(castle)은 다른 문장에 나오는 말이에요.","c":1},"h":"adbda115e0"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nThe other villagers came to her aid, throwing rocks at the lord’s castle.","ko":"밑줄 친 her가 가리키는 것은?","sko":"마을의 다른 사람들이 그녀를 도우러 와서 영주의 성에 돌을 던졌다.","opts":["사악한 영주","마을의 다른 사람들","방앗간 주인의 딸","영주의 경비대"],"r":{"a":"3) 방앗간 주인의 딸","ev":"7~8번 문장","s":[[7,"According to legend, an evil lord wanted to marry a miller’s daughter, but she resisted.","전설에 따르면, 한 사악한 영주가 방앗간 주인의 딸과 결혼하기를 원했지만, 그녀는 저항했다."],[8,"The other villagers came to her aid, throwing rocks at the lord’s castle.","마을의 다른 사람들이 그녀를 도우러 와서 영주의 성에 돌을 던졌다."]],"w":"마을 사람들이 도우러 온 사람은 영주의 결혼 요구에 저항한 방앗간 주인의 딸이에요(7번). 영주는 마을 사람들이 돌을 던진 성의 주인이고, 마을의 다른 사람들은 주어(The other villagers)라서 her가 될 수 없어요.","c":3},"h":"5d708bbe02"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The worst injury anyone has ever suffered was a black eye.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"지금까지 누군가가 겪은 최악의 부상은 멍든 눈이었다.","opts":["이 축제에서 아무도 다친 적이 없다.","지금까지 누군가가 겪은 최악의 부상은 멍든 눈이었다.","멍든 눈은 이 축제에서 가장 흔한 부상이다.","누군가가 겪은 최악의 부상은 멍든 눈보다 훨씬 심했다."],"r":{"a":"2) 지금까지 누군가가 겪은 최악의 부상은 멍든 눈이었다.","ev":"16번 문장","s":[[16,"The worst injury anyone has ever suffered was a black eye.","지금까지 누군가가 겪은 최악의 부상은 멍든 눈이었다."]],"w":"The worst injury 뒤의 anyone has ever suffered는 지금까지 누군가가 겪은 이라는 뜻이에요. 그 가운데 가장 심한 부상이 멍든 눈이었다는 말이라서, 아무도 다치지 않았다거나 더 심했다는 말은 틀려요. '가장 흔한'이라는 말도 없어요.","c":2},"h":"889aade54b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사람들은 영주의 경비대와 마을 사람들로 나뉜다.","영주의 경비대만 썩은 오렌지를 던진다.","이 축제는 이탈리아 남부의 한 마을에서 열린다.","이브레아에서 나온 신선한 오렌지를 사용한다."],"opts":["People are divided into the lord’s guards and villagers.","Only the lord’s guards throw rotten oranges.","The festival is held in a town in southern Italy.","Fresh oranges from Ivrea are used in the festival."],"r":{"a":"1) People are divided into the lord’s guards and villagers.","ev":"11번 문장","s":[[11,"People are then divided into different teams—some are the lord’s guards and others are villagers.","그런 다음 사람들은 서로 다른 팀으로 나뉘는데, 일부는 영주의 경비대이고, 다른 사람들은 마을 사람들이다."]],"w":"11번에서 사람들이 다른 팀으로 나뉘는데 일부는 영주의 경비대, 나머지는 마을 사람들이에요. 13번에서 모두(they all)가 던지고, 2번에서 마을은 이탈리아 북부이고, 4번과 10번에서 오렌지는 썩은 것이고 시칠리아에서 와요.","c":1},"h":"ddc78bf710"},{"n":9,"t":"sum","q":"The “guards” (A) around in horse-drawn carriages, and the “villagers” are on (B).","ko":"‘경비대’는 말이 끄는 마차를 (A) 다니고, ‘마을 사람들’은 (B)(으)로 이동한다.","oko":["(A) 걸어 / (B) 도보","(A) 타고 / (B) 말","(A) 타고 / (B) 도보","(A) 걸어 / (B) 말","(A) 헤엄쳐 / (B) 도보"],"opts":["(A) walk / (B) foot","(A) ride / (B) horses","(A) ride / (B) foot","(A) walk / (B) horses","(A) swim / (B) foot"],"r":{"a":"3) (A) ride / (B) foot ((A) 타고 / (B) 도보)","ev":"12번 문장","s":[[12,"The “guards” ride around in horse-drawn carriages and the “villagers” are on foot.","‘경비대’는 말이 끄는 마차를 타고 다니며, ‘마을 사람들’은 걷는다."]],"c":3,"k":null},"h":"3622dd2aab"},{"n":10,"t":"fill","q":"Then you should [A] the northern Italian town of Ivrea. The people there have a very [B] tradition.","ko":"그렇다면 당신은 이탈리아 북부의 이브레아 마을을 [A] 것이 좋다. 그곳 사람들은 매우 [B] 전통을 가지고 있다.","bank":["visit","strange","castle","teams","injury","legend"],"bko":{"visit":"방문하다","strange":"색다른","castle":"성","teams":"팀들","injury":"부상","legend":"전설"},"r":{"a":"[A] visit (방문하다), [B] strange (색다른)","ev":"2~3번 문장","s":[[2,"Then you should visit the northern Italian town of Ivrea.","그렇다면 당신은 이탈리아 북부의 이브레아 마을을 방문해야 한다."],[3,"The people there have a very strange tradition.","그곳 사람들은 매우 색다른 전통을 가지고 있다."]],"c":null,"k":null},"h":"753d72349c"}]},{"u":9,"id":"ch1-09-1","no":1,"ko":"소녀의 목소리, 세계를 바꾸다","items":[{"n":1,"t":"tf","q":"As a young girl, Malala enjoyed reading and learning.","ko":"어린 소녀로서, 말랄라는 읽고 배우는 것을 즐겼다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"As a young girl, Malala loved to read and learn.","어린 소녀로서, 말랄라는 읽고 배우는 것을 매우 좋아했다."]],"w":"2번 문장에서 Malala loved to read and learn이라고 해요. love(매우 좋아하다)는 enjoy(즐기다)와 비슷한 뜻이에요.","c":"T"},"h":"994e490b7c"},{"n":2,"t":"tf","q":"The BBC wrote a letter to Malala about the unfair situation in her region.","ko":"BBC는 말랄라에게 그녀의 지역의 부당한 상황에 관한 편지를 썼다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"She wrote a letter to the BBC that explained this unfair situation in her region.","그녀는 BBC에 자신의 지역에서의 이 부당한 상황을 설명하는 편지를 썼다."]],"w":"6번 문장에서 편지를 쓴 사람은 말랄라이고, 편지를 받은 곳이 BBC예요. 쓴 쪽과 받은 쪽이 뒤바뀌었어요.","c":"F"},"h":"325c55497a"},{"n":3,"t":"tf","q":"The U.N. named Malala’s birthday Malala Day.","ko":"UN은 말랄라의 생일을 말랄라의 날로 지정했다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"In 2013, the U.N. named July 12—her birthday—Malala Day in her honor.","2013년에 UN은 그녀에게 경의를 표하기 위해 그녀의 생일인 7월 12일을 말랄라의 날로 지정했다."]],"w":"12번 문장에서 July 12—her birthday—를 Malala Day로 지정했다고 해요. name A B는 'A를 B라고 이름 짓다'예요.","c":"T"},"h":"d93ce07761"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, Malala’s education was threatened when a group named the Taliban took over the Swat Valley.)","ko":"그러나 탈레반이라는 이름의 단체가 스와트 밸리를 장악했을 때 말랄라의 교육은 위협을 받았다.","opts":["도움을 받았다","위협을 받았다","칭찬을 받았다","허락을 받았다"],"word":"threatened","r":{"a":"2) 위협을 받았다","ev":"3번 문장","s":[[3,"However, Malala’s education was threatened when a group named the Taliban took over the Swat Valley.","그러나 탈레반이라는 이름의 단체가 스와트 밸리를 장악했을 때 말랄라의 교육은 위협을 받았다."]],"w":"탈레반이 스와트 밸리를 장악했다는 뒤의 내용은 배움에 좋을 리 없죠. threaten은 '위협하다'이고, was threatened는 '위협받았다'예요.","c":2},"h":"cbe6a04519"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (She gave a powerful speech at the United Nations (U.N.) headquarters about the need for girls’ education.)","ko":"그녀는 국제연합(UN) 본부에서 여성 교육의 필요성에 관해 강력한 연설을 했다.","opts":["지부","박물관","본부","기숙사"],"word":"headquarters","r":{"a":"3) 본부","ev":"11번 문장","s":[[11,"She gave a powerful speech at the United Nations (U.N.) headquarters about the need for girls’ education.","그녀는 국제연합(UN) 본부에서 여성 교육의 필요성에 관해 강력한 연설을 했다."]],"w":"UN 본부에서 연설했다는 뜻이에요. headquarters는 s로 끝나지만 조직의 중심인 '본부' 한 곳을 가리킬 수 있어요.","c":3},"h":"fe758dc0e3"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThe Taliban heard about Malala’s actions, and they sent men to shoot her.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"탈레반은 말랄라의 행동에 대해 듣게 되었고, 그들은 그녀를 (총으로) 쏠 사람들을 보냈다.","opts":["탈레반","BBC","말랄라","UN"],"r":{"a":"1) 탈레반","ev":"8번 문장","s":[[8,"The Taliban heard about Malala’s actions, and they sent men to shoot her.","탈레반은 말랄라의 행동에 대해 듣게 되었고, 그들은 그녀를 (총으로) 쏠 사람들을 보냈다."]],"w":"and 앞의 주어가 The Taliban이고, 같은 주어가 이어져요. 그녀(her = 말랄라)를 쏠 사람들을 보낸 쪽은 탈레반이에요.","c":1},"h":"718ff382fb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Malala has let nothing stop her, and she continues to promote girls’ education as a U.N. Messenger of Peace.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"말랄라는 어떠한 것도 그녀를 막게 두지 않았고, UN 평화 메신저로서 계속해서 여성 교육을 증진하고 있다.","opts":["말랄라는 아무것도 하지 않고 멈춰 있었고, UN 평화 메신저를 그만두었다.","말랄라는 사람들이 그녀를 막도록 허락했고, 그래서 여성 교육을 그만두었다.","말랄라는 자신을 막는 모든 것을 멈추게 해 달라고 UN에 도움을 청했다.","말랄라는 어떤 것도 자신을 막지 못하게 했고, UN 평화 메신저로서 여성 교육을 계속 증진하고 있다."],"r":{"a":"4) 말랄라는 어떤 것도 자신을 막지 못하게 했고, UN 평화 메신저로서 여성 교육을 계속 증진하고 있다.","ev":"14번 문장","s":[[14,"Malala has let nothing stop her, and she continues to promote girls’ education as a U.N. Messenger of Peace.","말랄라는 어떠한 것도 그녀를 막게 두지 않았고, UN 평화 메신저로서 계속해서 여성 교육을 증진하고 있다."]],"w":"let+목적어+동사원형은 '~가 …하게 두다'예요. let nothing stop her는 '아무것도 그녀를 막지 못하게 하다'이고, 그 뒤에 계속 활동하는 모습이 이어져요.","c":4},"h":"795d5cb44e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["말랄라는 탈레반 정부에 편지를 썼다.","BBC가 말랄라의 이야기를 보도한 뒤 세계는 탈레반의 행동을 알게 되었다.","UN은 탈레반이 새 정부를 세운 해와 같은 해에 말랄라의 날을 지정했다.","말랄라는 탈레반이 스와트 밸리를 장악하기 전에 학교에 다니는 것을 그만두었다."],"opts":["Malala wrote her letter to the Taliban’s government.","The world learned of the Taliban’s actions after the BBC reported Malala’s story.","The U.N. named Malala Day in the same year that the Taliban set up a new government.","Malala stopped going to school before the Taliban took over the Swat Valley."],"r":{"a":"2) The world learned of the Taliban’s actions after the BBC reported Malala’s story.","ev":"7번 문장","s":[[7,"The BBC reported Malala’s story, and the world learned of the Taliban’s actions.","BBC는 말랄라의 이야기를 보도했고, 세계는 탈레반의 행동을 알게 되었다."]],"w":"7번 문장에서 BBC가 보도했고 세계가 알게 되었어요. 선택지 1)은 편지를 받은 곳이 BBC(6번), 3)은 말랄라의 날 1년 후가 노벨평화상(12~13번), 4)는 공격에서 살아남은 뒤에 알리기 시작(9~10번)이라 틀려요.","c":2},"h":"4c391db3ba"},{"n":9,"t":"sum","q":"Malala (A) the Taliban, and after that she began to (B) out to the world about the importance of education.","ko":"말랄라는 탈레반에 (A) 그 뒤 교육의 중요성에 대해 세계에 (B) 시작했다.","oko":["(A) 굴복하고 / (B) 말하기","(A) 맞서고 / (B) 듣기","(A) 동의하고 / (B) 말하기","(A) 굴복하고 / (B) 움직이기","(A) 맞서고 / (B) 말하기"],"opts":["(A) gave in to / (B) speak","(A) stood up to / (B) listen","(A) agreed with / (B) speak","(A) gave in to / (B) move","(A) stood up to / (B) speak"],"r":{"a":"5) (A) stood up to / (B) speak ((A) 맞서고 / (B) 말하기)","ev":"5번, 10번 문장","s":[[5,"But 12-year-old Malala stood up to the Taliban.","그러나 12세의 말랄라는 탈레반에 맞섰다."],[10,"After that, she began to speak out to the world about the importance of education.","그 이후로, 그녀는 교육의 중요성에 대해 세계에 알리기 시작했다."]],"c":5,"k":null},"h":"117dae38fd"},{"n":10,"t":"fill","q":"Malala became the [A] person in history to [B] the Nobel Peace Prize.","ko":"말랄라는 역사상 노벨평화상을 [B] 가장 [A] 인물이 되었다.","bank":["youngest","win","survive","promoted","lose","education"],"bko":{"youngest":"가장 어린","win":"받다, 이기다","survive":"살아남다","promoted":"증진했다","lose":"잃다","education":"교육"},"r":{"a":"[A] youngest, [B] win","ev":"13번 문장","s":[[13,"One year later, Malala became the youngest person in history to win the Nobel Peace Prize.","1년 후, 말랄라는 역사상 노벨평화상을 받은 가장 어린 인물이 되었다."]],"w":"[A]는 the와 person 사이라서 '가장 ~한'을 뜻하는 최상급 형용사 youngest가 알맞아요. [B]는 앞의 the youngest person을 꾸미는 to부정사 to win이에요. 나머지는 형용사 자리나 동사원형 자리에 맞지 않거나 뜻이 달라요.","c":null},"h":"b63f5e6eb2"}]},{"u":9,"id":"ch1-09-2","no":2,"ko":"팀워크의 함정","items":[{"n":1,"t":"tf","q":"In Ringelmann’s experiment, people pulled a rope both alone and in a group.","ko":"링겔만의 실험에서 사람들은 밧줄을 혼자서도, 집단으로도 당겼다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"He asked participants to pull a rope, first individually and then as a group.","그는 참가자들에게 밧줄을 당기라고 요청했으며, 처음에는 개인적으로, 그다음에는 집단으로 당기도록 했다."]],"w":"2번 문장에서 참가자들이 처음에는 개인적으로(individually), 그다음에는 집단으로(as a group) 밧줄을 당겼어요.","c":"T"},"h":"2fd8fc6e45"},{"n":2,"t":"tf","q":"People used more effort when they pulled the rope in a group.","ko":"사람들은 밧줄을 집단으로 당길 때 더 많은 노력을 들였다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"But when people pulled the rope in a group, they used less effort.","그러나 사람들이 집단으로 밧줄을 당길 때 그들은 더 적은 노력을 들였다."]],"w":"4번 문장에서 집단으로 당길 때는 less effort(더 적은 노력)를 들였어요. more와 less가 뒤바뀌었어요.","c":"F"},"h":"5e4e3fbc45"},{"n":3,"t":"tf","q":"Understanding the Ringelmann effect lowers team efficiency.","ko":"링겔만 효과를 이해하면 팀의 효율성이 낮아진다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"Understanding this psychological effect enhances team efficiency and produces more successful outcomes.","이 심리적 효과를 이해하는 것은 팀의 효율성을 높이고 더 성공적인 결과를 만들어낸다."]],"w":"13번 문장에서 이 효과를 이해하면 팀의 효율성을 높인다(enhances)고 해요. 낮아지는 것은 링겔만 효과 자체가 일어날 때예요.","c":"F"},"h":"cf3b4ccd87"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When people pulled the rope alone, they utilized considerable effort.)","ko":"사람들이 혼자서 밧줄을 당길 때, 그들은 상당한 노력을 들였다.","opts":["상당한","사소한","불필요한","위험한"],"word":"considerable","r":{"a":"1) 상당한","ev":"3번 문장","s":[[3,"When people pulled the rope alone, they utilized considerable effort.","사람들이 혼자서 밧줄을 당길 때, 그들은 상당한 노력을 들였다."]],"w":"혼자 당길 때는 노력을 많이 들였고, 4번에서 집단일 때는 less effort(더 적은 노력)라고 비교해요. 그래서 considerable effort는 상당한 노력이에요.","c":1},"h":"64f6577d7d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Fortunately, there’s a way to overcome the Ringelmann effect.)","ko":"다행히, 링겔만 효과를 극복할 방법이 있다.","opts":["경험하다","설명하다","극복하다","무시하다"],"word":"overcome","r":{"a":"3) 극복하다","ev":"10번 문장","s":[[10,"Fortunately, there’s a way to overcome the Ringelmann effect.","다행히, 링겔만 효과를 극복할 방법이 있다."]],"w":"Fortunately(다행히) 다음에 나오므로 문제를 해결하는 말이 알맞아요. a way to overcome the Ringelmann effect는 링겔만 효과를 극복할 방법이에요.","c":3},"h":"b9d8407a28"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThen they should be given constructive feedback to improve the quality of their work.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"그 후 그들은 그들의 작업 품질을 향상시키기 위한 건설적인 피드백을 제공받아야 한다.","opts":["링겔만과 참가자들","각 팀원들","팀의 리더들","실험 참가자들"],"r":{"a":"2) 각 팀원들","ev":"11~12번 문장","s":[[11,"Each team member should be assigned a specific task that reflects their skills and strengths.","각 팀원들은 그들의 기술과 강점을 반영하는 특정한 작업을 배정받아야 한다."],[12,"Then they should be given constructive feedback to improve the quality of their work.","그 후 그들은 그들의 작업 품질을 향상시키기 위한 건설적인 피드백을 제공받아야 한다."]],"w":"12번의 앞 문장(11번)에서 주어가 Each team member(각 팀원)예요. 특정한 작업을 배정받은 그 팀원들이 이어서 건설적인 피드백을 받아야 한다는 흐름이에요. 실험 참가자(2번)와는 다른 이야기예요.","c":2},"h":"a64ae45057"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The main idea is that as team size grows, individual effort within the team becomes less noticeable, which reduces participant motivation.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"주요 아이디어는 팀의 크기가 커질수록 팀 내에서 개인의 노력은 덜 눈에 띄는데, 이것은 참가자들의 동기를 줄인다.","opts":["팀이 작을수록 개인의 노력이 눈에 덜 띄어서 구성원의 동기가 줄어든다.","구성원의 동기가 줄어들기 때문에 팀의 규모가 점점 커진다.","팀이 커질수록 개인의 노력이 더 눈에 띄어서 구성원의 동기가 높아진다.","팀이 커질수록 개인의 노력이 눈에 덜 띄게 되고, 그 결과 구성원의 동기가 줄어든다."],"r":{"a":"4) 팀이 커질수록 개인의 노력이 눈에 덜 띄게 되고, 그 결과 구성원의 동기가 줄어든다.","ev":"8번 문장","s":[[8,"The main idea is that as team size grows, individual effort within the team becomes less noticeable, which reduces participant motivation.","주요 아이디어는 팀의 크기가 커질수록 팀 내에서 개인의 노력은 덜 눈에 띄는데, 이것은 참가자들의 동기를 줄인다."]],"w":"as team size grows는 '팀의 규모가 커질수록'이에요. 뒤의 which reduces participant motivation에서 which는 앞 내용 전체를 받아서, 노력이 덜 눈에 띄는 것이 원인이고 동기 감소가 결과예요.","c":4},"h":"9a31e6515b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["팀이 성과를 공유하기 때문에 팀원들은 더 열심히 일한다.","개인의 노력이 높이 평가받을수록 팀원들은 기여를 덜 한다.","팀이 성과를 공유하면 개인의 노력은 그만큼 높이 평가받지 못한다.","좋지 않은 결과가 나오면 팀원들은 기여를 더 많이 하게 된다."],"opts":["Team members work harder because the team shares the achievement.","Members contribute less when their effort is highly valued.","When a team shares the achievement, personal effort is not valued as highly.","A poor result makes team members contribute more."],"r":{"a":"3) When a team shares the achievement, personal effort is not valued as highly.","ev":"9번 문장","s":[[9,"Additionally, the team shares the achievement, so personal effort is not as highly valued, leading members to contribute less and produce a poor result.","추가적으로, 팀이 성과를 공유하기 때문에 개인의 노력은 그만큼 가치 있게 여겨지지 않아, 팀원들이 기여를 덜하고 좋지 않은 결과물을 만들어 내도록 이끈다."]],"w":"9번에서 팀이 성과를 공유해서 개인의 노력이 덜 인정받고, 그 결과 팀원들이 기여를 덜 해요. 나머지는 이 원인과 결과를 거꾸로 말했어요.","c":3},"h":"63f6bc9e49"},{"n":9,"t":"sum","q":"As the size of a group (A), each person’s productivity (B), which is called the Ringelmann effect.","ko":"집단의 크기가 (A) 각 개인의 생산성은 (B), 이를 링겔만 효과라고 한다.","oko":["(A) 커지면 / (B) 증가한다","(A) 줄어들면 / (B) 사라진다","(A) 바뀌면 / (B) 그대로이다","(A) 커지면 / (B) 감소한다","(A) 줄어들면 / (B) 감소한다"],"opts":["(A) increases / (B) increases","(A) decreases / (B) disappears","(A) changes / (B) stays the same","(A) increases / (B) decreases","(A) decreases / (B) decreases"],"r":{"a":"4) (A) increases / (B) decreases ((A) 커지면 / (B) 감소한다)","ev":"6번 문장","s":[[6,"The Ringelmann effect describes how individual productivity decreases as the size of a group increases.","링겔만 효과는 집단의 크기가 커질수록 어떻게 개인의 생산성이 감소하는지를 설명한다."]],"c":4,"k":null},"h":"04308106ff"},{"n":10,"t":"fill","q":"This [A] is [B] as “the Ringelmann effect.”","ko":"이 [A]은(는) ‘링겔만 효과’로 [B] 있다.","bank":["phenomenon","known","reduces","shares","enhances","produces"],"bko":{"phenomenon":"현상","known":"알려져","reduces":"줄이다","shares":"공유하다","enhances":"높이다","produces":"만들어 내다"},"r":{"a":"[A] phenomenon (현상), [B] known (알려져)","ev":"5번 문장","s":[[5,"This phenomenon is known as “the Ringelmann effect.”","이 현상은 ‘링겔만 효과’로 알려져 있다."]],"c":null,"k":null},"h":"2259d170e0"}]},{"u":9,"id":"ch1-09-3","no":3,"ko":"숫자로 편견을 넘어서다","items":[{"n":1,"t":"tf","q":"Katherine Johnson started high school when she was only 10.","ko":"캐서린 존슨은 겨우 10살 때 고등학교에 다니기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When she was just 10, she began attending high school.","겨우 10살이었을 때, 그녀는 고등학교에 다니기 시작했다."]],"w":"6번 문장에서 When she was just 10, she began attending high school이라고 해요.","c":"T"},"h":"9ea61942c3"},{"n":2,"t":"tf","q":"Johnson was able to put her name on the reports she worked on.","ko":"존슨은 자신이 작업한 보고서에 자신의 이름을 올릴 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"She couldn’t even put her name on the reports she worked on.","그녀가 작성한 보고서에 자신의 이름조차 올릴 수 없었다."]],"w":"12번 문장에서 She couldn’t even put her name on the reports라고 해요. 이름조차 올릴 수 없었다는 뜻이라 반대예요.","c":"F"},"h":"bc813eafc8"},{"n":3,"t":"tf","q":"Johnson was not allowed to attend meetings with male engineers and scientists.","ko":"존슨은 남성 엔지니어와 과학자들과의 회의에 참석하는 것이 허용되지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"And because she was a woman, she was not allowed to attend meetings with male engineers and scientists.","그리고 그녀는 여자였기 때문에, 남성 엔지니어와 과학자들과의 회의에 참석하는 것이 허용되지 않았다."]],"w":"11번 문장에서 여자였기 때문에 남성 엔지니어·과학자들과의 회의에 참석하는 것이 허용되지 않았다고 해요.","c":"T"},"h":"15f9220f13"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It was a group of African American women who solved complicated math problems for the program’s engineers.)","ko":"그것은 프로그램 엔지니어들을 위해 복잡한 수학 문제를 풀었던 아프리카계 미국인 여성 집단이었다.","opts":["복잡한","간단한","재미있는","오래된"],"word":"complicated","r":{"a":"1) 복잡한","ev":"8번 문장","s":[[8,"It was a group of African American women who solved complicated math problems for the program’s engineers.","그것은 프로그램 엔지니어들을 위해 복잡한 수학 문제를 풀었던 아프리카계 미국인 여성 집단이었다."]],"w":"엔지니어들을 위해 풀었던 수학 문제이니 쉽지 않은 문제예요. complicated는 '복잡한'이라는 뜻이에요.","c":1},"h":"af5e1a1c2a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Because she was African American, she was required to work and eat separately from her white coworkers.)","ko":"그녀는 아프리카계 미국인이었기 때문에, 백인 동료들과 따로따로 일하고 식사를 하도록 요구받았다.","opts":["빠르게","따로따로","함께","조용히"],"word":"separately","r":{"a":"2) 따로따로","ev":"10번 문장","s":[[10,"Because she was African American, she was required to work and eat separately from her white coworkers.","그녀는 아프리카계 미국인이었기 때문에, 백인 동료들과 따로따로 일하고 식사를 하도록 요구받았다."]],"w":"백인 동료들과 ‘따로’ 일하고 식사하도록 요구받았다는 차별을 말하는 문장이에요. separately는 따로따로라는 뜻이고, 함께와는 반대예요.","c":2},"h":"2ccba42a40"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nShe performed difficult calculations for Apollo 11, which was the first manned mission to the Moon.","ko":"밑줄 친 which이(가) 가리키는 것은?","sko":"그녀는 아폴로 11호에 대해 어려운 계산을 수행했는데, 아폴로 11호는 최초의 달 유인 탐사였다.",
