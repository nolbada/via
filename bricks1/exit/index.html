,"(A) 미끼 / (B) 공짜"],"opts":["(A) value / (B) expensive","(A) value / (B) cheap","(A) price / (B) cheap","(A) size / (B) small","(A) decoy / (B) free"],"r":{"a":"1) (A) value / (B) expensive","ev":"9~10번 문장","s":[[9,"This makes the large seem like clearly the best value.","이것은 큰 것이 분명히 가장 좋은 가치로 보이게 만든다."],[10,"Companies use this to guide your decisions toward the more expensive items.","회사들은 이것을 이용해 당신의 결정을 더 비싼 상품 쪽으로 이끈다."]],"w":"9번에서 큰 것이 clearly the best value로 보이게 한다고 했고, 10번에서 더 비싼 상품 쪽으로 이끈다고 함. 따라서 value(가치)와 expensive(비싼).","c":1},"h":"d1395ec505"},{"n":10,"t":"fill","q":"The medium is the [A], so it makes the large look much more [B].","ko":"중간 크기는 [A]이므로, 큰 것이 훨씬 더 [B]하게 보이게 한다.","bko":{"decoy":"미끼","value":"가치","attractive":"매력적인","cheap":"싼","small":"작은","choice":"선택지"},"bank":["decoy","value","attractive","choice","cheap","small"],"r":{"a":"[A] decoy, [B] attractive","ev":"7~8번 문장","s":[[7,"The medium is the decoy.","중간 크기가 미끼이다."],[8,"Its job is not to be bought, but to make the nearby option, the large, look much more attractive.","그것의 역할은 구매되는 것이 아니라, 근처의 선택지인 큰 것을 훨씬 더 매력적으로 보이게 하는 것이다."]],"w":"7번 The medium is the decoy와 8번 make the nearby option, the large, look much more attractive에서 가져옴. choice, value, cheap, small은 7~8번의 빈칸 자리에 들어가면 뜻이 맞지 않음.","c":null},"h":"12e02564de"}]},{"u":10,"id":"b1-10-4","no":4,"ko":"'친환경' 표시, 다 믿어도 될까?","items":[{"n":1,"t":"tf","q":"Greenwashing is a trick that makes a company look greener than it really is.","ko":"그린워싱은 회사가 실제보다 더 친환경적으로 보이게 하는 속임수이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"Some companies use them to appear more green than they actually are.","어떤 회사들은 실제보다 더 친환경적으로 보이려고 그것들을 사용한다."],[5,"This trick is called greenwashing.","이 속임수는 그린워싱이라고 불린다."]],"w":"4번에서 회사들이 실제보다 더 친환경적으로 보이려고 말을 쓴다고 하고, 5번에서 이 속임수를 greenwashing이라고 함. 일치하는 내용.","c":"T"},"h":"bfdb964245"},{"n":2,"t":"tf","q":"Companies use nature-related words and pictures on their packaging.","ko":"회사들은 포장에 자연과 관련된 말과 그림을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"They use nature-related words and pictures on their packaging.","그들은 포장에 자연과 관련된 말과 그림을 사용한다."]],"w":"7번 문장에 They use nature-related words and pictures on their packaging이 있음. 일치하는 내용.","c":"T"},"h":"35e086d5ee"},{"n":3,"t":"tf","q":"Greenwashing helps small eco-friendly companies compete.","ko":"그린워싱은 작은 친환경 회사들이 경쟁하는 것을 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"It also makes it harder for small, truly eco-friendly companies to compete.","그것은 또한 작고 진정으로 친환경적인 회사들이 경쟁하기 더 어렵게 만든다."]],"w":"11번 문장에서 greenwashing은 작고 진정으로 친환경적인 회사들이 경쟁하기 더 어렵게 만든다고 함. 돕는 것이 아니라 방해하므로 틀린 진술.","c":"F"},"h":"42919f622e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? Companies use this trick to attract people who care about the environment.","ko":"회사들은 환경에 관심이 있는 사람들을 attract하기 위해 이 속임수를 사용한다.","opts":["피하다","끌어들이다","잊다","팔다"],"word":"attract","r":{"a":"2) 끌어들이다","ev":"6~7번 문장","s":[[6,"Companies use this trick to attract people who care about the environment.","회사들은 환경에 관심이 있는 사람들을 끌어들이기 위해 이 속임수를 사용한다."],[7,"They use nature-related words and pictures on their packaging.","그들은 포장에 자연과 관련된 말과 그림을 사용한다."]],"w":"회사가 친환경인 척하는 말과 그림을 써서 환경에 관심 있는 사람들이 오도록 하는 것. attract = 끌어들이다.","c":2},"h":"b03eb39c1c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? It also makes it harder for small, truly eco-friendly companies to compete.","ko":"그것은 또한 작고 진정으로 친환경적인 회사들이 compete하기 더 어렵게 만든다.","opts":["협력하다","포기하다","광고하다","경쟁하다"],"word":"compete","r":{"a":"4) 경쟁하다","ev":"10~11번 문장","s":[[10,"It tricks customers and wastes their money.","그것은 소비자를 속이고 그들의 돈을 낭비하게 한다."],[11,"It also makes it harder for small, truly eco-friendly companies to compete.","그것은 또한 작고 진정으로 친환경적인 회사들이 경쟁하기 더 어렵게 만든다."]],"w":"가짜 친환경 회사와 진짜 친환경 작은 회사가 시장에서 맞서는 상황이라, 서로 겨루는 것. compete = 경쟁하다.","c":4},"h":"27463a9365"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSome companies use them to appear more green than they actually function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
function showScore(p){var sb=document.getElementById("sbar");sb.innerHTML="";var d=done[p.id];var c=el("div","score");c.appendChild(el("span",null,"Reading "+p.no+" 점수"));c.appendChild(el("b",null,(d.s*10)+"점"));c.appendChild(el("span",null,d.s+" / 10 문항"));sb.style.display="block";sb.appendChild(c);var rb=el("button","rs-btn","처음부터 다시 (다음 학생)");var armed=false;rb.onclick=function(){if(!armed){armed=true;rb.textContent="한 번 더 누르면 모든 Reading 기록이 지워집니다";rb.className+=" arm";return}ans={};done={};unit=UNITS[0];cur=null;units();tabs();view();window.scrollTo(0,0)};sb.appendChild(rb)}
