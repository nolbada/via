는 많은 것을 시도해 봤어. 우리는 큰 소리를 냈어.", "ok": false, "foot": [], "fixes": [{"wrong": "thing", "right": "things", "partial": false, "at": [3], "point": "수량 형용사 many/much: many 뒤에는 복수명사 things 사용", "topic": "수량 형용사 many/much", "memo": "many 뒤에는 복수명사 things 사용"}]}, {"n": 7, "tag": null, "en": "But the elephants was not scared. We used fire.", "ko": "그러나 코끼리들은 무서워하지 않았어. 우리는 불을 사용했어.", "ok": false, "foot": [], "fixes": [{"wrong": "was", "right": "were", "partial": false, "at": [3], "point": "be동사의 과거형: 복수 주어 the elephants에는 were 사용", "topic": "be동사의 과거형", "memo": "복수 주어 the elephants에는 were 사용"}]}, {"n": 8, "tag": null, "en": "But it was dangerous for we. The elephants always came back.", "ko": "그러나 그것은 우리에게 위험했어. 코끼리들은 항상 돌아왔어.", "ok": false, "foot": [], "fixes": [{"wrong": "we", "right": "us", "partial": false, "at": [5], "point": "인칭대명사의 목적격: 전치사 for 뒤에는 목적격 us 사용", "topic": "인칭대명사의 목적격", "memo": "전치사 for 뒤에는 목적격 us 사용"}]}, {"n": 9, "tag": null, "en": "One day, I said, \"Doesn't hurt the elephants! They're just hungrily.\"", "ko": "어느 날, 나는 \"코끼리들을 다치게 하지 마세요! 그들은 그저 배가 고픈 거예요.\"라고 말했어.", "ok": false, "foot": [], "fixes": [{"wrong": "Doesn't", "right": "Don't", "partial": false, "at": [4], "point": "부정 명령문: '~하지 마라'는 Don't + 동사원형 사용", "topic": "부정 명령문", "memo": "'~하지 마라'는 Don't + 동사원형 사용"}, {"wrong": "hungrily", "right": "hungry", "partial": false, "at": [10], "point": "형용사와 부사: be동사 뒤 보어 자리에는 형용사 hungry 사용", "topic": "형용사와 부사", "memo": "be동사 뒤 보어 자리에는 형용사 hungry 사용"}]}, {"n": 10, "tag": null, "en": "My father said, \"You're right. We can plant some food for they.\"", "ko": "나의 아버지는 \"네 말이 맞아. 우리는 그들을 위한 음식을 좀 심을 수 있어.\"라고 말씀하셨어.", "ok": false, "foot": [], "fixes": [{"wrong": "they", "right": "them", "partial": false, "at": [11], "point": "인칭대명사의 목적격: 전치사 for 뒤에는 목적격 them 사용", "topic": "인칭대명사의 목적격", "memo": "전치사 for 뒤에는 목적격 them 사용"}]}, {"n": 11, "tag": null, "en": "The people in my village planted rice and bananas near the forest. They growed quickly.", "ko": "우리 마을의 사람들은 숲 근처에 벼와 바나나를 심었어. 그것들은 빨리 자랐어.", "ok": false, "foot": [], "fixes": [{"wrong": "growed", "right": "grew", "partial": false, "at": [13], "point": "불규칙 과거형: grow의 과거형은 growed가 아니라 grew", "topic": "불규칙 과거형", "memo": "grow의 과거형은 growed가 아니라 grew"}]}, {"n": 12, "tag": null, "en": "The elephants loved us presents.", "ko": "코끼리들은 우리의 선물을 아주 좋아했어.", "ok": false, "foot": [], "fixes": [{"wrong": "us", "right": "our", "partial": false, "at": [3], "point": "인칭대명사의 소유격: 명사 presents 앞에는 소유격 our 사용", "topic": "인칭대명사의 소유격", "memo": "명사 presents 앞에는 소유격 our 사용"}]}, {"n": 13, "tag": null, "en": "Now, the elephants don't come to our village anymore. They are happily.", "ko": "이제, 코끼리들은 더 이상 우리 마을에 오지 않아. 그들은 행복해.", "ok": false, "foot": [], "fixes": [{"wrong": "happily", "right": "happy", "partial": false, "at": [11], "point": "형용사와 부사: be동사 뒤 보어 자리에는 형용사 happy 사용", "topic": "형용사와 부사", "memo": "be동사 뒤 보어 자리에는 형용사 happy 사용"}]}, {"n": 14, "tag": null, "en": "We are happy, too. Elephants and people can be good neighbor.", "ko": "우리도 행복해. 코끼리와 사람은 좋은 이웃이 될 수 있어.", "ok": false, "foot": [], "fixes": [{"wrong": "neighbor", "right": "neighbors", "partial": false, "at": [10], "point": "명사의 복수형: 주어가 복수이므로 보어도 neighbors 사용", "topic": "명사의 복수형", "memo": "주어가 복수이므로 보어도 neighbors 사용"}]}];var PP=[["My name is Reena.", "내 이름은 Reena야.", 1], ["I live in a small village in Assam, India.", "나는 인도 아삼(Assam)에 있는 작은 마을에 살아.", 0], ["There is a big forest near my village.", "우리 마을 근처에는 큰 숲이 있어.", 0], ["There are many animals in the forest.", "그 숲에는 많은 동물이 있어.", 0], ["One morning, three elephants came to my village.", "어느 날 아침, 코끼리 세 마리가 우리 마을에 왔어.", 1], ["They could not find food in the forest.", "그들은 숲에서 음식을 찾을 수 없었어.", 0], ["So they ate the fruit and vegetables on our farms.", "그래서 그들은 우리의 농장에 있는 과일과 채소를 먹었어.", 0], ["Every day, more elephants came and ate our food.", "매일, 더 많은 코끼리들이 와서 우리의 음식을 먹었어.", 0], ["My father told everyone, \"We have to stop the elephants.\"", "나의 아버지는 모두에게 \"우리는 코끼리들을 저지해야만 해요.\"라고 말씀  h+='<table class="rtb">'+QL.map(function(q){var s=qst[q.n];return '<tr><td>'+q.dn+'번</td><td>'+(s.w.length?'틀림':'처음에 맞힘')+'</td></tr>'}).join('')+'</table>';
 h+='<div class="rl">총 학습 시간 '+fmtT(TM.act)+'</div>';
 h+='<div class="chip'+(chk?' on':'')+'">'+(chk?'선생님 확인 완료':'선생님 확인 대기')+'</div>';
 if(TEACH){
  h+='<div class="tp"><b>선생님용</b><div>빠른 제출 : '+((fi.s1.length||fi.q2.length)?'<span class="fl">'+(fi.s1.length?'오류 찾기 '+fi.s1.join(', ')+' ':'')+(fi.q2.length?'문제 '+fi.q2.join(', ')+'번':'')+'</span>':'없음')+'</div><div>첫 시도 정답 '+f+'/'+QL.length+'· 틀린 횟수 '+fx+'</div><div style="margin-top:8px"><button type="button" data-chk="1">'+(chk?'확인 취소':'노트 확인 완료')+'</button></div></div>';
 }
 h+='<div style="margin-top:14px"><a href="./" style="display:inline-block;background:var(--pri);color:#fff;text-decoration:none;font-weight:700;padding:9px 20px;border-radius:8px">M1 Reading 목록으로</a></div>';
 return h+'</div>';
}
function lognote(q){var n=q.note;wlog('s','2단계 · 요약문 완성',[{n:q.dn,a:'정답 '+CN[q.a]+' '+q.ans,m:[n.en,n.ko].concat(n.words.map(function(w){return w[0]+' = '+w[1]}))}])}
function pickOpt(n,j){var q=qById(n),st=qst[n];if(!st||st.ok)return;if(!st.t1)st.t1=Date.now();
 if(j===q.a){st.ok=1;if(q.note)lognote(q);}
 else if(st.w.indexOf(j)<0){st.w.push(j);st.ok=1;if(q.note)lognote(q)}
 var y=window.scrollY;render();window.scrollTo(0,y);
}
function advQ(n){var st=qst[n];if(!st||st.adv)return;st.adv=1;if(allAdv()){tmFlush();TM.done=1}
 render();var ix=QL.indexOf(qById(n)),nx=ix<QL.length-1?QL[ix+1]:null,el=nx?document.getElementById('q'+nx.n):document.querySelector('.res');
 if(el){var ty=el.getBoundingClientRect().top+window.pageYOffset-8;window.scrollTo(0,ty);setTimeout(function(){window.scrollTo(0,el.getBoundingClientRect().top+window.pageYOffset-8)},60)}
}
document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){var sb=+b.dataset.sub;s1t[sb]=Date.now()-mark;mark=Date.now();done[sb]=true;render();
  var fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(aDone())save(fo);
  var gs=document.querySelectorAll('section.grp');if(gs[sb])gs[sb].scrollIntoView({behavior:'smooth',block:'start'});return}
 var jb=e.target.closest('button[data-jump]');if(jb){var jt=document.getElementById(jb.dataset.jump);if(jt)jt.scrollIntoView({behavior:'smooth',block:'start'});return}
 var gb=e.target.closest('button[data-go]');if(gb){qgo=1;render();var sts=document.querySelectorAll('.stage');if(sts[1])sts[1].scrollIntoView({behavior:'smooth',block:'start'});return}
 var o=e.target.closest('.opt[data-q]');if(o){pickOpt(+o.dataset.q,+o.dataset.o);return}
 var nx=e.target.closest('button[data-next]');if(nx){advQ(+nx.dataset.next);return}
 var wr=e.target.closest('button[data-wrote]');if(wr){var qn=+wr.dataset.wrote;qst[qn].wrote=1;advQ(qn);return}
 var ck=e.target.closest('button[data-chk]');if(ck){chk=chk?0:1;var y2=window.scrollY;render();window.scrollTo(0,y2);return}
});
function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){if(window.__bsR)return;try{var any=Object.keys(sel).length||Object.keys(qst).length||Object.keys(done).length;
 if(any)localStorage.setItem(PK,JSON.stringify({v:2,sel:sel,done:done,qst:qst,chk:chk,s1t:s1t,tm:TM,go:qgo}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+(allAdv()?1:0);var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');
 if(n>=2){rs[RNUM]={p:Math.round(fcount()*100/QL.length),ok:1,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}
 localStorage.setItem('m1-res',JSON.stringify(rs));
 if(any){st[RNUM]=(n>=2?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none';
 try{if(any)BSYNC(RNUM,JSON.parse(localStorage.getItem(PK)),n>=2?3:n,n>=2)}catch(e){}}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv&&sv.v===2){sel=sv.sel||{};done=sv.done||{};qst=sv.qst||{};qgo=sv.go||0;if(!qgo&&Object.keys(qst).length)qgo=1;chk=sv.chk||0;s1t=sv.s1t||{};if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}}}catch(e){}
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}try{BSYNC(RNUM,null,0,true)}catch(x){}sel={};done={};qst={};chk=0;s1t={};qgo=0;mark=Date.now();TM={act:0,lv:0,lt:0,done:0};_last=Date.now();render();window.scrollTo(0,0)}}});
var GLX=[[9, 1, ["hungry = 배고픈", "hungrily = 게걸스럽게"]], [13, 0, ["happy = 행복한", "happily = 행복하게"]]];GLX.forEach(function(g){D.forEach(function(it){if(it.n===g[0]&&it.fixes[g[1]])it.fixes[g[1]].gl=g[2]})});
render();
