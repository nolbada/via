<script>
var D=[{"n": 1, "tag": "1919년 2월 28일", "en": "On February 28, 1919, a man came to Dr. Schofield's house.", "ko": "1919년 2월 28일, 한 남자가 Schofield 박사의 집에 왔다.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": "남자", "en": "Dr. Schofield, I has an special favor to ask you.", "ko": "Schofield 박사님, 특별한 부탁이 있습니다.", "ok": false, "foot": ["1favor 부탁, 호의"], "fixes": [{"wrong": "has", "right": "have", "partial": false, "at": [3], "point": "수일치: 주어 I에는 동사원형 have 사용 (has는 3인칭 단수 주어에 사용)", "topic": "수일치", "memo": "주어 I에는 동사원형 have 사용 (has는 3인칭 단수 주어에 사용)"}, {"wrong": "an", "right": "a", "partial": false, "at": [4], "point": "관사: special은 자음 발음[s]으로 시작하므로 부정관사 a 사용", "topic": "관사", "memo": "special은 자음 발음[s]으로 시작하므로 부정관사 a 사용"}]}, {"n": 3, "tag": "Schofield 박사", "en": "What can I do to you?", "ko": "제가 무엇을 해 드릴까요?", "ok": false, "foot": [], "fixes": [{"wrong": "to", "right": "for", "partial": false, "at": [4], "point": "어휘/전치사: '~을 위해 해 주다'라는 의미는 do something for you 사용 (to you는 문맥상 위협적으로 들림)", "topic": "어휘/전치사", "memo": "'~을 위해 해 주다'라는 의미는 do something for you 사용 (to you는 문맥상 위협적으로 들림)"}]}, {"n": 4, "tag": "남자", "en": "Many people is going to gather tomorrow for the independence of Korea.", "ko": "내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다.", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "are", "partial": false, "at": [2], "point": "수일치: 주어 people(복수)에 맞춰 be동사 are 사용", "topic": "수일치", "memo": "주어 people(복수)에 맞춰 be동사 are 사용"}]}, {"n": 5, "tag": null, "en": "Could you take pictures of the event and sharing them with the world?", "ko": "그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?", "ok": false, "foot": [], "fixes": [{"wrong": "sharing", "right": "share", "partial": false, "at": [8], "point": "병렬구조: could you 뒤에 오는 동사원형 take와 병렬을 이루도록 share 사용", "topic": "병렬구조", "memo": "could you 뒤에 오는 동사원형 take와 병렬을 이루도록 share 사용"}]}, {"n": 6, "tag": "1919년 3월 1일 오후 2시", "en": "At 2 p.m. on March 1, Dr. Schofield was hiding in a building and saw a large group of people to gather outside.", "ko": "3월 1일 오후 2시, Schofield 박사는 한 건물에 숨어 있으면서 밖에 많은 사람들이 모여드는 것을 보았다.", "ok": false, "foot": [], "fixes": [{"wrong": "to gather", "right": "gathering", "partial": false, "at": [20], "point": "5형식 지각동사: see+목적어+현재분사(v-ing)로 '~가 …하는 것을 보다' 표현", "topic": "5형식 지각동사", "memo": "see+목적어+현재분사(v-ing)로 '~가 …하는 것을 보다' 표현"}]}, {"n": 7, "tag": null, "en": "He began to take pictures.", "ko": "그는 사진을 찍기 시작했다.", "ok": true, "foot": [], "fixes": []}, {"n": 8, "tag": "Schofield 박사", "en": "Unbelievable! There are so much people here.", "ko": "믿을 수 없어! 여기엔 정말 많은 사람들이 있어.", "ok": false, "foot": [], "fixes": [{"wrong": "much", "right": "many", "partial": false, "at": [4], "point": "가산/불가산명사: people은 셀 수 있는 명사(복수)이므로 many 사용 (much는 불가산명사에 사용)", "topic": "가산/불가산명사", "memo": "people은 셀 수 있는 명사(복수)이므로 many 사용 (much는 불가산명사에 사용)"}]}, {"n": 9, "tag": null, "en": "I hope the world will learns about this importantly event through my pictures.", "ko": "내 사진을 통해 세계가 이 중요한 사건에 대해 알게 되기를 바라.", "ok": false, "foot": [], "fixes": [{"wrong": "learns", "right": "learn", "partial": false, "at": [5], "point": "조동사 뒤 동사원형: 조동사 will 뒤에는 동사원형 learn 사용", "topic": "조동사 뒤 동사원형", "memo": "조동사 will 뒤에는 동사원형 learn 사용"}, {"wrong": "importantly", "right": "important", "partial": false, "at": [8], "point": "어법: 명사 event를 수식하므로 형용사 important 사용 (부사 importantly 불가)", "topic": "어법", "memo": "명사 event를 수식하므로 형용사 important 사용 (부사 importantly 불가)"}]}, {"n": 10, "tag": "석호필 이야기", "en": "Are you know Seok Hopil?", "ko": "당신은 석호필을 아는가?", "ok": false, "foot": [], "fixes": [{"wrong": "Are", "right": "Do", "partial": false, "at": [0], "point": "어법: 일반동사 know의 의문문은 조동사 Do로 시작 (be동사 Are 사용 불가)", "topic": "어법", "memo": "일반동사 know의 의문문은 조동사 Do로 시작 (be동사 Are 사용 불가)"}]}, {"n": 11, "tag": null, "en": "His English name was Frank W. Schofield, but he loved his Korean name, who sound similar to his real name and also had a good meaning.", "ko": "그의 영어 이름은 Frank W. Schofield였지만, 그는 자신의 한국 이름을 사랑했는데, 그 이름은 그의 본명과 비슷하게 들렸고 좋은 의미도 담고 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "who", "right": "which", "partial": false, "at": [13], "point": "관계대명사: 선행사 name(사물)을 받으므로 which 사용 (who는 사람 선행사에 사용)", "topic": "관계대명사", "memo": "선행사 name(사물)을 받으므로 which 사용 (who는 사람 선행사에 사용)"}, {"wrong": "sound", "right": "sounded", "partial": false, "at": [14], "point": "수일치·시제: 관계대명사절의 동사는 선행사(단수) 및 과거 시제 문맥에 맞춰 sounded 사용", "topic": "수일치·시제", "memo": "관계대명사절의 동사는 선행사(단수) 및 과거 시제 문맥에 맞춰 sounded 사용"}]}, {"n": 12, "tag": null, "en": "Dr. Schofield was a Canadian doctor, and he first came to Korea in 1916 for teach medicine.", "ko": "Schofield 박사는 캐나다 의사였고, 의학을 가르치기 위해 1916년에 한국에 처음 왔다.", "ok": false, "foot": [], "fixes": [{"wrong": "for teach", "right": "to teach", "partial": false, "at": [14], "point": "to부정사(부사적 용법-목적): '~하기 위해'는 to+동사원형 사용 (for+동사원형 불가)", "topic": "to부정사(부사적 용법-목적)", "memo": "'~하기 위해'는 to+동사원형 사용 (for+동사원형 불가)"}]}, {"n": 13, "tag": null, "en": "He wanted teaching in Korean, so he began to learn Korean right away.", "ko": "그는 한국어로 가르치고 싶어서, 곧바로 한국어를 배우기 시작했다.", "ok": false, "foot": [], "fixes": [{"wrong": "teaching", "right": "to teach", "partial": false, "at": [2], "point": "동명사 vs to부정사: want는 목적어로 to부정사를 취함 (동명사 불가)", "topic": "동명사 vs to부정사", "memo": "want는 목적어로 to부정사를 취함 (동명사 불가)"}]}, {"n": 14, "tag": null, "en": "He studied too hard that he was able to teach in Korean after only a few years.", "ko": "그는 매우 열심히 공부해서 몇 년 만에 한국어로 가르칠 수 있게 되었다.", "ok": false, "foot": [], "fixes": [{"wrong": "too", "right": "so", "partial": false, "at": [2], "point": "so~that 구문: '매우 ~해서 …하다'는 so+형용사/부사+that (too는 다른 구문에 사용)", "topic": "so~that 구문", "memo": "'매우 ~해서 …하다'는 so+형용사/부사+that (too는 다른 구문에 사용)"}]}, {"n": 15, "tag": null, "en": "He believed that every country have the right to be independent, so he helped the Korean independent movement.", "ko": "그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다.", "ok": false, "foot": [], "fixes": [{"wrong": "have", "right": "has", "partial": false, "at": [5], "point": "수일치: 주어 every country(단수취급)에 맞춰 has 사용", "topic": "수일치", "memo": "주어 every country(단수취급)에 맞춰 has 사용"}, {"wrong": "independent", "right": "independence", "partial": false, "at": [16], "point": "어휘/품사: 명사를 수식하는 명사형 independence movement('독립운동') 사용 (independent는 형용사)", "topic": "어휘/품사", "memo": "명사를 수식하는 명사형 independence movement('독립운동') 사용 (independent는 형용사)"}]}, {"n": 16, "tag": "탑골 공원 · 3·1운동", "en": "On March 1, 1919, Dr. Schofield heard people to shout for Korean independence in Tapgol Park.", "ko": "1919년 3월 1일, Schofield 박사는 탑골 공원에서 사람들이 한국의 독립을 외치는 소리를 들었다.", "ok": false, "foot": [], "fixes": [{"wrong": "to shout", "right": "shouting", "partial": false, "at": [8], "point": "5형식 지각동사: hear+목적어+현재분사(v-ing)로 '~가 …하는 것을 듣다' 표현", "topic": "5형식 지각동사", "memo": "hear+목적어+현재분사(v-ing)로 '~가 …하는 것을 듣다' 표현"}]}, {"n": 17, "tag": null, "en": "He took pictures of the event by his camera.", "ko": "그는 카메라로 그 사건의 사진을 찍었다.", "ok": false, "foot": [], "fixes": [{"wrong": "by", "right": "with", "partial": false, "at": [6], "point": "어휘/전치사: 도구를 나타낼 때는 with 사용 (by는 수동태에서 행위자를 나타낼 때 사용)", "topic": "어휘/전치사", "memo": "도구를 나타낼 때는 with 사용 (by는 수동태에서 행위자를 나타낼 때 사용)"}]}, {"n": 18, "tag": null, "en": "He then wrote a article about the historical event and sent it to foreign newspapers with his pictures.", "ko": "그 후 그는 이 역사적인 사건에 대한 기사를 써서 사진과 함께 외국 신문사에 보냈다.", "ok": false, "foot": [], "fixes": [{"wrong": "a", "right": "an", "partial": false, "at": [3], "point": "관사: 모음으로 시작하는 article 앞에는 부정관사 an 사용", "topic": "관사", "memo": "모음으로 시작하는 article 앞에는 부정관사 an 사용"}, {"wrong": "historical", "right": "historic", "partial": false, "at": [7], "point": "어휘: historic(역사적으로 중요한) vs historical(역사와 관련된) — 이 문맥은 historic이 적절", "topic": "어휘", "memo": "historic(역사적으로 중요한) vs historical(역사와 관련된) — 이 문맥은 historic이 적절"}]}, {"n": 19, "tag": "3·1운동 이후", "en": "Despite the March 1st Movement was over, Dr. Schofield's fight for Korean independence didn't stop.", "ko": "3·1운동이 끝났지만, 한국 독립을 위한 Schofield 박사의 투쟁은 멈추지 않았다.", "ok": false, "foot": ["1Movement 운동"], "fixes": [{"wrong": "Despite", "right": "Although", "partial": false, "at": [0], "point": "접속사 vs 전치사: although(접속사)는 뒤에 '주어+동사' 절이 옴 (despite는 전치사로 뒤에 명사(구) 사용)", "topic": "접속사 vs 전치사", "memo": "although(접속사)는 뒤에 '주어+동사' 절이 옴 (despite는 전치사로 뒤에 명사(구) 사용)"}]}, {"n": 20, "tag": null, "en": "He continued to write about the terribly situation in Korea for foreign newspapers.", "ko": "그는 외국 신문에 한국의 참혹한 상황에 대해 계속해서 글을 썼다.", "ok": false, "foot": [], "fixes": [{"wrong": "terribly", "right": "terrible", "partial": false, "at": [6], "point": "어법: 명사 situation을 수식하므로 형용사 terrible 사용 (부사 terribly 불가)", "topic": "어법", "memo": "명사 situation을 수식하므로 형용사 terrible 사용 (부사 terribly 불가)"}]}, {"n": 21, "tag": null, "en": "Because he was under the watching eye of the Japanese police, it was necessary for him going back to Canada in 1920.", "ko": "그는 일본 경찰의 감시를 받고 있었기 때문에, 1920년에 캐나다로 돌아가야만 했다.", "ok": false, "foot": [], "fixes": [{"wrong": "watching", "right": "watchful", "partial": false, "at": [5], "point": "어휘: '감시하는'이라는 뜻의 형용사 watchful 사용 (watching은 문맥상 어색)", "topic": "어휘", "memo": "'감시하는'이라는 뜻의 형용사 watchful 사용 (watching은 문맥상 어색)"}, {"wrong": "going back", "right": "to go back", "partial": false, "at": [16], "point": "가주어 it, 진주어 to부정사: It is necessary for A to부정사 구문 (동명사 불가)", "topic": "가주어 it, 진주어 to부정사", "memo": "It is necessary for A to부정사 구문 (동명사 불가)"}]}, {"n": 22, "tag": "그 이후", "en": "In 1958, he return to Korea at the invitation of the Korean government and never left again.", "ko": "1958년, 그는 한국 정부의 초청으로 한국으로 돌아와서 다시는 떠나지 않았다.", "ok": false, "foot": ["1invitation 초청"], "fixes": [{"wrong": "return", "right": "returned", "partial": false, "at": [3], "point": "시제: 1958년의 과거 사실이므로 과거시제 returned 사용", "topic": "시제", "memo": "1958년의 과거 사실이므로 과거시제 returned 사용"}]}, {"n": 23, "tag": null, "en": "For the rest of his life, he worked as harder as he could to help Koreans, especially poor students.", "ko": "그는 여생 동안 한국인들, 특히 가난한 학생들을 돕기 위해 최선을 다해 열심히 일했다.", "ok": false, "fo , 의학을 가르치기 위해 1916년에 한국에 처음 왔다.", 0], ["He wanted to teach in Korean, so he began to learn Korean right away.", "그는 한국어로 가르치고 싶어서, 곧바로 한국어를 배우기 시작했다.", 0], ["He studied so hard that he was able to teach in Korean after only a few years.", "그는 매우 열심히 공부해서 몇 년 만에 한국어로 가르칠 수 있게 되었다.", 0], ["He believed that every country has the right to be independent, so he helped the Korean independence movement.", "그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다.", 0], ["On March 1, 1919, Dr. Schofield heard people shouting for Korean independence in Tapgol Park.", "1919년 3월 1일, Schofield 박사는 탑골 공원에서 사람들이 한국의 독립을 외치는 소리를 들었다.", 0], ["He took pictures of the event with his camera.", "그는 카메라로 그 사건의 사진을 찍었다.", 0], ["He then wrote an article about the historic event and sent it to foreign newspapers with his pictures.", "그 후 그는 이 역사적인 사건에 대한 기사를 써서 사진과 함께 외국 신문사에 보냈다.", 0], ["Although the March 1st Movement was over, Dr. Schofield's fight for Korean independence didn't stop.", "3·1운동이 끝났지만, 한국 독립을 위한 Schofield 박사의 투쟁은 멈추지 않았다.", 0], ["He continued to write about the terrible situation in Korea for foreign newspapers.", "그는 외국 신문에 한국의 참혹한 상황에 대해 계속해서 글을 썼다.", 0], ["Because he was under the watchful eye of the Japanese police, it was necessary for him to go back to Canada in 1920.", "그는 일본 경찰의 감시를 받고 있었기 때문에, 1920년에 캐나다로 돌아가야만 했다.", 0], ["In 1958, he returned to Korea at the invitation of the Korean government and never left again.", "1958년, 그는 한국 정부의 초청으로 한국으로 돌아와서 다시는 떠나지 않았다.", 0], ["For the rest of his life, he worked as hard as he could to help Koreans, especially poor students.", "그는 여생 동안 한국인들, 특히 가난한 학생들을 돕기 위해 최선을 다해 열심히 일했다.", 0], ["Dr. Schofield died in April 1970, and he was buried in Seoul National Cemetery.", "Schofield 박사는 1970년 4월에 세상을 떠났고, 국립서울현충원에 안장되었다.", 0]];var RNUM=54;var TITLE_EN="Dr. Schofield, a Foreigner Who Loved Korea";var PASS_EN=["Dr. Schofield, a Foreigner Who Loved Korea", "On February 28, 1919, a man came to Dr. Schofield's house.", "Dr. Schofield, I have a special favor to ask you.", "What can I do for you?", "Many people are going to gather tomorrow for the independence of Korea. Could you take pictures of the event and share them with the world?", "At 2 p.m. on March 1, Dr. Schofield was hiding in a building and saw a large group of people gathering outside. He began to take pictures.", "Unbelievable! There are so many people here. I hope the world will learn about this important event through my pictures.", "Do you know Seok Hopil? His English name was Frank W. Schofield, but he loved his Korean name, which sounded similar to his real name and also had a good meaning. Dr. Schofield was a Canadian doctor, and he first came to Korea in 1916 to teach medicine. He wanted to teach in Korean, so he began to learn Korean right away. He studied so hard that he was able to teach in Korean after only a few years. He believed that every country has the right to be independent, so he helped the Korean independence movement.", "On March 1, 1919, Dr. Schofield heard people shouting for Korean independence in Tapgol Park. He took pictures of the event with his camera. He then wrote an article about the historic event and sent it to foreign newspapers with his pictures.", "Although the March 1st Movement was over, Dr. Schofield's fight for Korean independence didn't stop. He continued to write about the terrible situation in Korea for foreign newspapers. Because he was under the watchful eye of the Japanese police, it was necessary for him to go back to Canada in 1920.", "In 1958, he returned to Korea at the invitation of the Korean government and never left again. For the rest of his life, he worked as hard as he could to help Koreans, especially poor students. Dr. Schofield died in April 1970, and he was buried in Seoul National Cemetery."];var PASS_KO=["Schofield 박사, 한국을 사랑한 외국인", "1919년 2월 28일, 한 남자가 Schofield 박사의 집에 왔다.", "Schofield 박사님, 특별한 부탁이 있습니다.", "제가 무엇을 해 드릴까요?", "내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다. 그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?", "3월 1일 오후 2시, Schofield 박사는 한 건물에 숨어 있으면서 밖에 많은 사람들이 모여드는 것을 보았다. 그는 사진을 찍기 시작했다.", "믿을 수 없어! 여기엔 정말 많은 사람들이 있어. 내 사진을 통해 세계가 이 중요한 사건에 대해 알게 되기를 바라.", "당신은 석호필을 아는가? 그의 영어 이름은 Frank W. Schofield였지만, 그는 자신의 한국 이름을 사랑했는데, 그 이름은 그의 본명과 비슷하게 들렸고 좋은 의미도 담고 있었다. Schofield 박사는 캐나다 의사였고, 의학을 가르치기 위해 1916년에 한국에 처음 왔다. 그는 한국어로 가르치고 싶어서, 곧바로 한국어를 배우기 시작했다. 그는 매우 열심히 공부해서 몇 년 만에 한국어로 가르칠 수 있게 되었다. 그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다.", "1919년 3월 1일, Schofield 박사는 탑골 공원에서 사람들이 한국의 독립을 외치는 소리를 들었다. 그는 카메라로 그 사건의 사진을 찍었다. 그 후 그는 이 역사적인 사건에 대한 기사를 써서 사진과 함께 외국 신문사에 보냈다.", "3·1운동이 끝났지만, 한국 독립을 위한 Schofield 박사의 투쟁은 멈추지 않았다. 그는 외국 신문에 한국의 참혹한 상황에 대해 계속해서 글을 썼다. 그는 일본 경찰의 감시를 받고 있었기 때문에, 1920년에 캐나다로 돌아가야만 했다.", "1958년, 그는 한국 정부의 초청으로 한국으로 돌아와서 다시는 떠나지 않았다. 그는 여생 동안 한국인들, 특히 가난한 학생들을 돕기 위해 최선을 다해 열심히 일했다. Schofield 박사는 1970년 4월에 세상을 떠났고, 국립서울현충원에 안장되었다."];var DG=[{"dlg": [["G", "Liam, can you please help me? I need to find some books for my homework.", "Liam, 나 좀 도와줄 수 있어? 숙제 때문에 책을 좀 찾아야 하거든."], ["B", "What kinds of books are you looking for, Somi?", "어떤 종류의 책을 찾고 있니, 소미야?"], ["G", "I'm looking for books on famous people who helped others. I need to write an essay.", "다른 사람들을 도운 유명한 사람들에 관한 책을 찾고 있어. 에세이를 써야 하거든."], ["B", "Who do you want to write about?", "누구에 대해 쓰고 싶은데?"], ["G", "I was thinking about Dr. Schweitzer, but can you recommend someone else for me?", "슈바이처 박사를 생각하고 있었는데, 다른 사람을 추천해 줄 수 있어?"], ["B", "What about Audrey Hepburn?", "오드리 헵번은 어때?"], ["G", "I know she was a famous actor, but what did she do to help others?", "그녀가 유명한 배우였다는 건 알지만, 다른 사람들을 돕기 위해 무엇을 했어?"], ["B", "She did a lot of volunteer work, especially for children.", "그녀는 특히 아이들을 위해 많은 자원봉사를 했어."], ["G", "Really? Then, I can write about her. Thank you!", "정말? 그럼 그녀에 대해 쓰면 되겠다. 고마워!"]], "qs": [{"n": 1, "q": "위 대화를 읽고 답할 수 없는 질문은?", "o": ["Why does Somi need Liam's help?", "Whom was Somi thinking about as the subject of her essay?", "When does Somi have to hand in her essay?", "What was Audrey Hepbu
