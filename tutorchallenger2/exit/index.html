What is the meaning of the underlined word? (Patients need proper treatments and medications, but they also need compassion.)","ko":"환자들은 적절한 치료와 약물이 필요하지만, 또한 연민도 필요하다.","opts":["연민, 동정심","경쟁심","최신 장비","여가 시간"],"word":"compassion","r":{"a":"1) 연민, 동정심","ev":"11~12번 문장","s":[[11,"Of course, there is a downside in that AI cannot show concern or care like humans can.","물론, AI는 인간이 할 수 있는 것처럼 배려나 보살핌을 보여줄 수 없다는 점에서 불리한 면이 있다."],[12,"Patients need proper treatments and medications, but they also need compassion.","환자들은 적절한 치료와 약물이 필요하지만, 또한 연민도 필요하다."]],"w":"12번에서 치료와 약물에 ‘but they also need(하지만 또한 필요하다)’로 이어져요. 11번에서 AI가 못 하는 것이 concern or care(배려, 보살핌)였으니, compassion은 같은 방향의 말로 ‘연민, 동정심’이에요.","c":1},"h":"f3c0693205"},{"n":6,"t":"ref","q":"What does the underlined \"these details\" refer to?\nAI, on the other hand, has the ability to analyze and comprehend every medical paper ever written, and all of these details can be stored in a database and recalled instantly.","ko":"밑줄 친 these details이(가) 가리키는 것은?","sko":"반면에, AI는 지금까지 쓰인 모든 의학 논문을 분석하고 이해하는 능력이 있고, 이 모든 세부 사항은 데이터베이스에 저장될 수 있고 즉시 불러와질 수 있다.","opts":["AI가 분석하고 이해한 의학 논문의 내용","의사들이 한 달에 논문을 읽는 데 쓰는 시간","의사들이 저지르는 약물 실수의 횟수","환자들이 필요로 하는 연민"],"r":{"a":"1) AI가 분석하고 이해한 의학 논문의 내용","ev":"9번 문장","s":[[9,"AI, on the other hand, has the ability to analyze and comprehend every medical paper ever written, and all of these details can be stored in a database and recalled instantly.","반면에, AI는 지금까지 쓰인 모든 의학 논문을 분석하고 이해하는 능력이 있고, 이 모든 세부 사항은 데이터베이스에 저장될 수 있고 즉시 불러와질 수 있다."]],"w":"9번에서 AI는 지금까지 쓰인 모든 의학 논문을 분석하고 이해하는 능력이 있고, 그 모든 세부 사항(these details)이 데이터베이스에 저장될 수 있다고 해요. 즉 논문 속 내용이에요.","c":1,"k":"these details = AI가 분석하고 이해한 의학 논문의 내용"},"pron":"these details","h":"94e7f9ee5c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This isn’t always the doctor’s fault.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 항상 의사의 잘못만은 아니다.","opts":["이것은 언제나 의사의 잘못이다.","이것은 의사의 잘못이 전혀 아니다.","이것은 의사만이 해결할 수 있는 문제이다.","이것은 전부 의사의 잘못인 것은 아니다."],"r":{"a":"4) 이것은 전부 의사의 잘못인 것은 아니다.","ev":"6번 문장","s":[[6,"This isn’t always the doctor’s fault.","이것은 항상 의사의 잘못만은 아니다."]],"w":"not always는 ‘항상 ~인 것은 아니다’라는 부분 부정이에요. 의사의 잘못일 때도 있지만 늘 그런 것은 아니라는 뜻이라 ‘전부 의사의 잘못인 것은 아니다’가 맞아요. ‘전혀 아니다’는 never일 때의 뜻이에요.","c":4},"h":"59cdbe5d7a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["AI는 특히 의료 분야에서 많은 중요한 역할을 한다.","AI는 의학 논문을 쓰는 데에만 쓰인다.","AI는 의료 분야에서 일하는 것이 허용되지 않는다.","AI는 모든 인간의 두뇌를 대체하기 위해 만들어졌다."],"opts":["AI plays many crucial roles, especially in the field of healthcare.","AI is used only for writing medical papers.","AI is not allowed to work in the field of healthcare.","AI was made to replace every human brain."],"r":{"a":"1) AI plays many crucial roles, especially in the field of healthcare. (AI는 특히 의료 분야에서 많은 중요한 역할을 한다.)","ev":"3번 문장","s":[[3,"That’s why artificial intelligence, also known as AI, plays many crucial roles, especially in the field of healthcare.","그것이 AI라고도 알려진 인공 지능이 특히 의료 분야에서 많은 중요한 역할들을 하는 이유이다."]],"w":"3번에서 인공 지능(AI)이 특히 의료 분야에서 많은 중요한 역할들을 한다고 해요.","c":1},"h":"954a3e749d"},{"n":9,"t":"sum","q":"AI will never (A) replace human doctors, but we should still use AI to (B) errors in the healthcare system.","ko":"AI는 인간 의사를 결코 (A) 대체하지는 못하겠지만, 우리는 의료 시스템 안에서 실수를 (B) 위해 여전히 AI를 활용해야 한다.","oko":["(A) 몰래 / (B) 줄이다","(A) 완전히 / (B) 숨기다","(A) 갑자기 / (B) 늘리다","(A) 완전히 / (B) 줄이다","(A) 몰래 / (B) 숨기다"],"opts":["(A) secretly / (B) reduce","(A) completely / (B) hide","(A) suddenly / (B) increase","(A) completely / (B) reduce","(A) secretly / (B) hide"],"r":{"a":"4) (A) completely / (B) reduce (완전히 / 줄이다)","ev":"13번 문장","s":[[13,"For this reason, AI will never completely replace human doctors, though we should still take advantage of AI to reduce errors within the healthcare system.","이러한 이유로, AI는 인간 의사들을 결코 완전하게 대체할 수 없을 것이지만, 우리는 의료 시스템 내에서 실수들을 줄이기 위해 여전히 AI를 활용해야 할 것이다."]],"w":"13번에서 AI는 인간 의사를 결코 완전하게(completely) 대체할 수 없지만, 의료 시스템 내에서 실수를 줄이기(reduce) 위해 여전히 AI를 활용해야 한다고 해요.","c":4},"h":"06e4c82079"},{"n":10,"t":"fill","q":"Using this information, it can [A] medications and treatments just as well as the [B] doctors, and it is less likely to make errors.","ko":"이러한 정보를 사용하여, AI는 [B] 의사들만큼 약물과 치료법을 [A] 수 있고, 실수할 가능성이 더 낮다.","bank":["recommend","best","papers","equipment","database","concern"],"bko":{"recommend":"추천하다","best":"최고의","papers":"논문들","equipment":"장비","database":"데이터베이스","concern":"걱정"},"r":{"a":"[A] recommend (추천하다), [B] best (최고의)","ev":"10번 문장","s":[[10,"Using this information, it can recommend medications and treatments just as well as the best doctors, and it is less likely to make errors.","이러한 정보를 사용하여, AI는 최고의 의사들만큼 약물과 치료법을 추천할 수 있고, 실수할 가능성이 더 낮다."]],"w":"10번에서 AI는 이 정보를 사용해 최고의(best) 의사들만큼 약물과 치료법을 추천할(recommend) 수 있다고 해요.","c":null},"h":"d91ba00255"}]},{"u":7,"id":"ch2-07-2","no":2,"ko":"도심 속 작은 오아시스","items":[{"n":1,"t":"tf","q":"The tracks of the High Line were raised onto a structure to reduce accidents.","ko":"하이라인의 철로는 사고를 줄이기 위해 구조물 위로 올려졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"To minimize accidents, the tracks were elevated onto a structure that was ten meters high.","사고를 최소화하기 위해, 철로는 10미터 높이에 있는 구조물 위로 올려졌다."]],"w":"4번에 To minimize accidents(사고를 최소화하기 위해) the tracks were elevated onto a structure라고 있어요. 사고를 줄이려고 철로를 높이 올렸다는 뜻이니 맞는 말이에요.","c":"T"},"h":"f8dcb73652"},{"n":2,"t":"tf","q":"Trains stopped using the High Line in 1980 because the city tore the structure down.","ko":"뉴욕시가 구조물을 철거했기 때문에 1980년에 기차는 하이라인 사용을 멈췄다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"However, the line experienced a decline in usage over time, and in 1980, trains stopped using the line altogether.","그러나 시간이 지나면서 철로의 사용은 줄어들었고, 1980년에 기차는 이 철로를 사용하는 것을 완전히 중단했다."],[6,"With concerns regarding the abandoned structure, the city proposed to tear it down.","이 버려진 구조물에 관련된 우려로, 뉴욕시는 그것을 철거할 것을 제안했다."]],"w":"5번에서 기차가 멈춘 것은 시간이 지나며 철로 사용이 줄었기 때문이에요. 철거는 그 뒤 6번에서 시가 ‘제안’했을 뿐(proposed to tear it down)이고, 실제로 철거하지 않았어요.","c":"F"},"h":"4270f3580b"},{"n":3,"t":"tf","q":"At first, Hammond’s idea of building a park was opposed because of its cost.","ko":"처음에 공원을 만들자는 해먼드의 아이디어는 비용 때문에 반대에 부딪혔다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Initially, his idea was opposed due to the significant cost of converting the space into a park.","처음에 그의 아이디어는 그 장소를 공원으로 바꾸는 데 드는 막대한 비용 때문에 반대에 부딪혔다."]],"w":"10번에 his idea was opposed due to the significant cost라고 있어요. 막대한 비용 때문에 반대에 부딪혔다는 말과 같아요.","c":"T"},"h":"1e8e056abb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (With concerns regarding the abandoned structure, the city proposed to tear it down.)","ko":"이 버려진 구조물에 관련된 우려로, 뉴욕시는 그것을 철거할 것을 제안했다.","opts":["새로 지어진","버려진","유명한","안전한"],"word":"abandoned","r":{"a":"2) 버려진","ev":"5~6번 문장","s":[[5,"However, the line experienced a decline in usage over time, and in 1980, trains stopped using the line altogether.","그러나 시간이 지나면서 철로의 사용은 줄어들었고, 1980년에 기차는 이 철로를 사용하는 것을 완전히 중단했다."],[6,"With concerns regarding the abandoned structure, the city proposed to tear it down.","이 버려진 구조물에 관련된 우려로, 뉴욕시는 그것을 철거할 것을 제안했다."]],"w":"5번에서 기차가 철로 사용을 완전히 멈췄고, 6번에서 시가 철거를 제안해요. 쓰이지 않고 방치된 구조물이라는 뜻이니 abandon(버리다)의 과거분사 abandoned는 ‘버려진’이에요.","c":2},"h":"af42bab527"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (With a little imagination and some hard effort, an old railway line was turned into a distinctive public space.)","ko":"약간의 상상력과 노고로, 오래된 철로는 독특한 공공장소로 탈바꿈되었다.","opts":["흔한","위험한","불편한","독특한"],"word":"distinctive","r":{"a":"4) 독특한","ev":"14번 문장","s":[[14,"With a little imagination and some hard effort, an old railway line was turned into a distinctive public space.","약간의 상상력과 노고로, 오래된 철로는 독특한 공공장소로 탈바꿈되었다."]],"w":"14번은 오래된 철로가 공공장소로 바뀌었다는 칭찬 섞인 결론이에요. 앞에 imagination and effort(상상력과 노력)가 있고 1~2번에서 다른 공원과 다르다고 했으니, distinctive는 ‘독특한’이에요.","c":4},"h":"b8ce9ef493"},{"n":6,"t":"ref","q":"What does the underlined \"where\" refer to?\nOriginally constructed as a train line, the High Line replaced a street that was once known as “Death Avenue,” where a number of people were involved in train-related accidents.","ko":"밑줄 친 where이(가) 가리키는 것은?","sko":"원래 철로로 건설된 하이라인은 많은 사람들이 기차 관련 사고에 연루되었던, 한때 ‘죽음의 거리’로 알려진 거리를 대체한 것이다.","opts":["하이라인","철로를 지탱하는 구조물","한때 ‘죽음의 거리’로 알려진 거리","맨해튼의 건물들"],"r":{"a":"3) 한때 ‘죽음의 거리’로 알려진 거리","ev":"3번 문장","s":[[3,"Originally constructed as a train line, the High Line replaced a street that was once known as “Death Avenue,” where a number of people were involved in train-related accidents.","원래 철로로 건설된 하이라인은 많은 사람들이 기차 관련 사고에 연루되었던, 한때 ‘죽음의 거리’로 알려진 거리를 대체한 것이다."]],"w":"3번에서 where 앞의 a street that was once known as “Death Avenue”(한때 ‘죽음의 거리’로 알려진 거리)를 설명해요. 그 거리에서 많은 사람들이 기차 관련 사고에 연루되었어요.","c":3,"k":"where = 한때 ‘죽음의 거리’로 알려진 거리"},"pron":"where","h":"b9d4f317c4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, Hammond emphasized the benefits the park could offer the community, and eventually, the city government approved of the project.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나, 해먼드는 그 공원이 지역사회에 줄 수 있는 이점을 강조했고, 결국 뉴욕시 정부는 이 프로젝트를 승인했다.","opts":["해먼드는 공원이 지역사회에 줄 수 있는 이점을 강조했고, 결국 시 정부는 프로젝트를 승인했다.","해먼드는 공원 건설 비용이 너무 크다고 인정했고, 결국 시 정부는 프로젝트를 취소했다.","시 정부는 공원이 지역사회에 줄 이점을 강조했고, 결국 해먼드가 프로젝트를 포기했다.","해먼드는 공원의 이점을 숨겼지만, 시 정부는 프로젝트를 승인했다."],"r":{"a":"1) 해먼드는 공원이 지역사회에 줄 수 있는 이점을 강조했고, 결국 시 정부는 프로젝트를 승인했다.","ev":"11번 문장","s":[[11,"However, Hammond emphasized the benefits the park could offer the community, and eventually, the city government approved of the project.","그러나, 해먼드는 그 공원이 지역사회에 줄 수 있는 이점을 강조했고, 결국 뉴욕시 정부는 이 프로젝트를 승인했다."]],"w":"emphasized the benefits는 ‘이점을 강조했다’이고 approved of the project는 ‘프로젝트를 승인했다’예요. 강조한 사람은 해먼드이고 승인한 쪽은 시 정부예요. 주어를 바꾸거나 승인을 취소·포기로 바꾼 선지는 틀려요.","c":1},"h":"979d6fbeeb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["하이라인은 맨해튼의 길과 같은 높이에 만들어진 공원이다.","하이라인은 길 위 높은 곳에 있고 운동장이나 놀이터가 없다.","하이라인은 원래 자동차가 다니는 도로로 만들어졌다.","하이라인은 1980년에 대중에게 공원으로 개방되었다."],"opts":["The High Line is a park built at the street level of Manhattan.","The High Line is high above the streets and has no sports fields or playgrounds.","The High Line was originally built as a road for cars.","The High Line was opened to the public as a park in 1980."],"r":{"a":"2) The High Line is high above the streets and has no sports fields or playgrounds.","ev":"1~2번 문장","s":[[1,"Unlike most parks, the High Line in New York City does not feature sports fields, playgrounds, or a running track.","대부분의 공원과 달리, 뉴욕시의 하이라인은 운동장도, 놀이터도, 달리기 트랙도 갖추고 있지 않다."],[2,"It is not even found at street level; rather, it is located high above the streets, weaving through buildings in Manhattan.","그것은 심지어 거리와 같은 높이에 있지도 않다. 오히려, 맨해튼의 건물들 사이를 누비며, 길 위에 높이 위치해 있다."]],"w":"1번에서 운동장·놀이터·달리기 트랙이 없고, 2번에서 거리와 같은 높이가 아니라 길 위 높은 곳에 있다고 해요. 3번에서 원래는 철로였고, 1980년(5번)은 기차가 멈춘 해이며 공원은 2009년(12번)에 열렸어요.","c":2},"h":"b8b9f9f78e"},{"n":9,"t":"sum","q":"Hammond was (A) by the wildflowers on the abandoned railway, and he decided to (B) the structure into a park.","ko":"해먼드는 버려진 철로 위의 야생화에서 (A) 그 구조물을 공원으로 (B) 결심을 했다.","oko":["(A) 짜증이 난 / (B) 숨기다","(A) 영감을 받은 / (B) 팔다","(A) 겁먹은 / (B) 변형시키다","(A) 영감을 받은 / (B) 변형시키다","(A) 낙담한 / (B) 무시하다"],"opts":["(A) annoyed / (B) hide","(A) inspired / (B) sell","(A) frightened / (B) transform","(A) inspired / (B) transform","(A) discouraged / (B) ignore"],"r":{"a":"4) (A) inspired / (B) transform (영감을 받은 / 변형시키다)","ev":"9번 문장","s":[[9,"Upon visiting the tracks, Hammond discovered the structure was covered in beautiful wildflowers, inspiring him to transform it into a park.","철로를 방문했을 때, 해먼드는 이 구조물이 아름다운 야생화들로 덮여 있는 것을 발견했고, 이는 그에게 그 구조물을 공원으로 바꿀 영감을 주었다."]],"w":"9번에서 해먼드는 구조물이 아름다운 야생화로 덮여 있는 것을 발견했고, 이것이 그에게 구조물을 공원으로 바꿀(transform) 영감을 주었다(inspiring)고 해요.","c":4},"h":"50fb7ad9d9"},{"n":10,"t":"fill","q":"The park’s first section opened in 2009, and in the [A] year it [B] more than two million visitors.","ko":"공원의 첫 번째 구간은 2009년에 개방되었고, [A] 해에 공원은 200만 명 이상의 방문객을 [B].","bank":["subsequent","attracted","previous","avoided","opened","proposed"],"bko":{"subsequent":"그다음의","attracted":"끌어들였다","previous":"이전의","avoided":"피했다","opened":"열었다","proposed":"제안했다"},"r":{"a":"[A] subsequent, [B] attracted","ev":"12~13번 문장","s":[[12,"The park’s first section opened to the public in 2009.","그 공원의 첫 번째 구간은 2009년에 대중에게 개방되었다."],[13,"In the subsequent year, it attracted more than two million visitors.","그 다음 해에 그 공원은 200만 명 이상의 방문객을 끌어들였다."]],"w":"12번에서 2009년에 첫 구간이 열렸고, 13번은 그다음 해(subsequent)에 200만 명 이상의 방문객을 끌어들였다(attracted)는 내용이에요. previous(이전의)는 개방보다 앞선 해가 되어 맞지 않고, avoided·opened·proposed는 방문객을 ‘끌어들였다’는 뜻이 아니에요.","c":null},"h":"94d4a8243c"}]},{"u":7,"id":"ch2-07-3","no":3,"ko":"앙카라의 헌책 도서관","items":[{"n":1,"t":"tf","q":"Sanitation workers in Ankara began to rescue books that were thrown into the trash.","ko":"앙카라의 환경미화원들은 쓰레기통에 버려진 책들을 구하기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"Sadly, many of them are tossed into the trash.","슬프게도, 그것들 중 많은 것들이 쓰레기통으로 던져진다."],[3,"Sanitation workers in Ankara, Turkey, noticed this, so they began to rescue the books and bring them back to the sanitation department’s headquarters.","터키 앙카라의 환경미화원들은 이것을 알아차리고, 책을 구해내서 공중 위생부 본부로 가져가기 시작했다."]],"w":"2번에서 많은 책이 쓰레기통에 던져진다고 하고, 3번에서 앙카라의 환경미화원들이 이것을 알아차리고 책을 구해 내기 시작했다고 해요.","c":"T"},"h":"0eee2df109"},{"n":2,"t":"tf","q":"The library was open to the public from the very beginning.","ko":"그 도서관은 처음부터 대중에게 열려 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"At first it was only used by their friends and families, but soon they opened it to the public.","처음에 그곳은 단지 그들의 친구와 가족에 의해서만 사용되었지만, 곧 그들은 그곳을 대중에게 공개했다."]],"w":"6번에서 처음에는 환경미화원들의 친구와 가족만 이용했고, 곧 대중에게 공개했다고 해요. 처음부터 공개된 것은 아니에요.","c":"F"},"h":"e71cb04715"},{"n":3,"t":"tf","q":"There is a plan to make a mobile library from an old garbage truck.","ko":"낡은 쓰레기 트럭으로 이동 도서관을 만들 계획이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"There are even plans to convert an old garbage truck into a mobile library, which will be driven around the city and to nearby villages, bringing books to people who need them.","낡은 쓰레기 트럭을 이동 도서관으로 개조할 계획도 있는데, 이것은 시내와 근처 마을로 운행되어, 책이 필요한 사람들에게 책을 가져다 줄 것이다."]],"w":"11번에 There are even plans to convert an old garbage truck into a mobile library라고 있어요. 아직은 ‘계획’이라는 점도 본문과 같아요.","c":"T"},"h":"93686ad08d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (As their collection grew larger and larger, these thoughtful workers decided to put the books to good use.)","ko":"그들의 수집품이 점점 더 방대해짐에 따라, 이 사려 깊은 환경미화원들은 그 책들을 뜻있게 사용하기로 결정했다.","opts":["게으른","화가 난","사려 깊은","유명한"],"word":"thoughtful","r":{"a":"3) 사려 깊은","ev":"3~4번 문장","s":[[3,"Sanitation workers in Ankara, Turkey, noticed this, so they began to rescue the books and bring them back to the sanitation department’s headquarters.","터키 앙카라의 환경미화원들은 이것을 알아차리고, 책을 구해내서 공중 위생부 본부로 가져가기 시작했다."],[4,"As their collection grew larger and larger, these thoughtful workers decided to put the books to good use.","그들의 수집품이 점점 더 방대해짐에 따라, 이 사려 깊은 환경미화원들은 그 책들을 뜻있게 사용하기로 결정했다."]],"w":"3번에서 버려지는 책을 알아차리고 구해 오고, 4번에서 그 책을 뜻있게 쓰기로 했어요. 책의 가치를 생각해 행동한 사람들이니 thoughtful은 ‘사려 깊은’이에요.","c":3},"h":"d109aa49c1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Today, the library continues to expand and has become an essential part of the local community.)","ko":"오늘날, 이 도서관은 계속해서 커지고 있고, 그곳은 지역 사회의 필수적인 부분이 되었다.","opts":["작은","필수적인","임시의","낯선"],"word":"essential","r":{"a":"2) 필수적인","ev":"9번 문장","s":[[9,"Today, the library continues to expand and has become an essential part of the local community.","오늘날, 이 도서관은 계속해서 커지고 있고, 그곳은 지역 사회의 필수적인 부분이 되었다."]],"w":"9번에서 도서관은 계속 커지고 있고 지역 사회의 일부가 되었다고 해요. 10번의 기증과 전임 사서처럼 지역 사회가 함께 키우는 곳이니, 없어서는 안 될 부분이라는 뜻의 essential은 ‘필수적인’이에요.","c":2},"h":"02e4d9580b"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nPeople now donate their unwanted books directly to the library, and thanks to the local government, it also has a full-time librarian now.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"사람들은 이제 그들이 원하지 않는 책들을 도서관에 직접 기증하며, 지역 정부 덕분에, 그곳은 현재 전임 사서도 있다.","opts":["지역 정부","도서관","원하지 않는 책들","환경미화원들"],"r":{"a":"2) 도서관","ev":"9~10번 문장","s":[[9,"Today, the library continues to expand and has become an essential part of the local community.","오늘날, 이 도서관은 계속해서 커지고 있고, 그곳은 지역 사회의 필수적인 부분이 되었다."],[10,"People now donate their unwanted books directly to the library, and thanks to the local government, it also has a full-time librarian now.","사람들은 이제 그들이 원하지 않는 책들을 도서관에 직접 기증하며, 지역 정부 덕분에, 그곳은 현재 전임 사서도 있다."]],"w":"사서가 있는 곳은 도서관이에요. 바로 앞에 the local government가 있어서 헷갈리기 쉽지만, 앞 절의 the library를 받아요. 9번에서도 주어가 the library예요.","c":2},"h":"43c6b6d9a4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"All of this began with some sanitation workers who didn’t want to see books go to waste.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 모든 것은 책이 쓰레기가 되는 것을 보고 싶지 않았던 몇 명의 환경미화원들로 시작되었다.","opts":["이 모든 일은 환경미화원들이 책을 팔아 돈을 벌려고 시작한 것이다.","이 모든 일은 책이 쓰레기가 되는 것을 지켜보게 만든 환경미화원들 때문에 생겼다.","이 모든 일은 책을 읽고 싶어 하지 않았던 환경미화원들로 시작되었다.","이 모든 일은 책이 쓰레기가 되는 것을 보고 싶지 않았던 몇몇 환경미화원들로 시작되었다."],"r":{"a":"4) 이 모든 일은 책이 쓰레기가 되는 것을 보고 싶지 않았던 몇몇 환경미화원들로 시작되었다.","ev":"12번 문장","s":[[12,"All of this began with some sanitation workers who didn’t want to see books go to waste.","이 모든 것은 책이 쓰레기가 되는 것을 보고 싶지 않았던 몇 명의 환경미화원들로 시작되었다."]],"w":"who didn’t want to see books go to waste는 ‘책이 헛되이 버려지는 것을 보고 싶지 않았던’이라는 뜻으로 some sanitation workers를 꾸며요. 시작은 책을 아끼는 마음이었어요. 돈을 벌려는 것이나 책을 읽기 싫어한 것이 아니에요.","c":4},"h":"1a81e67666"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["환경미화원들은 누구든지 행동을 취해 지역 사회를 더 낫게 만들 수 있다는 것을 보여 주었다.","환경미화원들은 오직 정부만이 지역 사회를 개선할 수 있다고 말했다.","환경미화원들은 한 사람이 지역 사회를 바꿀 수 없다고 믿었다.","환경미화원들은 사람들에게 책 기증을 그만하라고 요청했다."],"opts":["The workers showed that anyone can take action to make a community better.","The workers said that only the government can improve a community.","The workers believed that one person cannot change a community.","The workers asked people to stop donating books."],"r":{"a":"1) The workers showed that anyone can take action to make a community better. (환경미화원들은 누구든지 행동을 취해 지역 사회를 더 낫게 만들 수 있다는 것을 보여 주었다.)","ev":"13번 문장","s":[[13,"Together, they showed the world that anyone can take action and make their community a better place.","함께, 그들은 누구든지 행동을 취할 수 있고 그들의 지역 사회를 더 나은 곳으로 만들 수 있다는 것을 세상에 보여주었다."]],"w":"13번에서 환경미화원들은 누구든지 행동을 취할 수 있고 지역 사회를 더 나은 곳으로 만들 수 있다는 것을 세상에 보여 주었다고 해요.","c":1},"h":"2dd4e6fdc4"},{"n":9,"t":"sum","q":"The sanitation workers (A) their own library by working (B).","ko":"환경미화원들은 (B) 일하면서 그들만의 도서관을 (A).","oko":["(A) 태웠다 / (B) 함께","(A) 만들었다 / (B) 혼자","(A) 팔았다 / (B) 몰래","(A) 만들었다 / (B) 함께","(A) 태웠다 / (B) 혼자"],"opts":["(A) burned / (B) together","(A) created / (B) alone","(A) sold / (B) secretly","(A) created / (B) together","(A) burned / (B) alone"],"r":{"a":"4) (A) created / (B) together (만들었다 / 함께)","ev":"5번 문장","s":[[5,"Working together, they created their own library.","그들은 함께 일하면서, 그들만의 도서관을 만들었다."]],"w":"5번에서 환경미화원들은 함께 일하면서(Working together) 그들만의 도서관을 만들었다(created)고 해요.","c":4},"h":"83f6b11c86"},{"n":10,"t":"fill","q":"The library [A] more than 50,000 books and even has a [B] where local people can drink tea.","ko":"도서관은 5만 권이 넘는 책을 [A]. 또 지역 사람들이 차를 마실 수 있는 [B]도 있다.","bank":["includes","lounge","donates","expands","librarian","garbage"],"bko":{"includes":"포함하다","lounge":"휴게실","donates":"기증하다","expands":"확장되다","librarian":"사서","garbage":"쓰레기"},"r":{"a":"[A] includes, [B] lounge","ev":"7~8번 문장","s":[[7,"Located in their headquarters, the library includes more than 50,000 books, including textbooks, comic books, children’s books, science fiction novels, and more!","도서관은 그들의 본부에 위치해 있고, 교과서, 만화책, 아동 도서, 공상 과학 소설 등을 포함해 그 밖에도 많은 50,000권이 넘는 책을 소장하고 있다!"],[8,"The library even includes a lounge, where local people can drink tea, play chess, or just sit back and enjoy a good book.","도서관에는 심지어 휴게실도 있는데, 그곳에서 지역 사람들은 차를 마시고, 체스를 두거나, 그냥 뒤로 기대앉아 좋은 책을 즐길 수 있다."]],"w":"7번에서 도서관은 5만 권이 넘는 책을 포함하고(includes), 8번에서 차를 마시고 체스를 둘 수 있는 휴게실(lounge)도 있다고 해요. librarian(사서)은 10번에 나오지만 차를 마시는 장소가 아니고, donates·expands는 5만 권 문장에 어울리지 않으며, garbage는 11번의 트럭 이야기예요.","c":null},"h":"119b973027"}]},{"u":7,"id":"ch2-07-4","no":4,"ko":"수능:ON 문장 삽입","items":[{"n":1,"t":"tf","q":"A grateful man thanked Lichtman for a sandwich and then told her that winter was coming.","ko":"고마워하는 한 남자가 릭트먼에게 샌드위치에 대해 고마워한 뒤 겨울이 오고 있다고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"One grateful man thanked her for the sandwich, but then he mentioned that winter was coming.","고마움을 느낀 한 남자가 샌드위치에 대해 그녀에게 고마워했지만, 그러고 나서 그는 겨울이 오고 있다고 말했다."]],"w":"5번에 One grateful man thanked her for the sandwich, but then he mentioned that winter was coming이라고 있어요. 샌드위치에 고마워한 뒤 겨울이 오고 있다고 말했다는 내용과 같아요.","c":"T"},"h":"49a66d62d1"},{"n":2,"t":"tf","q":"Lichtman collected 40 pairs of socks in a week.","ko":"릭트먼은 일주일 만에 양말 40켤레를 모았다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"That night, after deciding to take action, Lichtman started knocking on doors in her dormitory, asking her classmates to donate one pair of socks.","그날 밤, 릭트먼은 행동을 하기로 결심한 후에, 그녀의 기숙사의 문들을 두드리기 시작해서, 그녀의 학과 친구들에게 양말 한 켤레를 기부해 달라고 요청했다."],[8,"By the next morning, she had collected 40 pairs.","다음 날 아침까지, 그녀는 양말 40켤레를 모았다."]],"w":"8번에서 By the next morning(다음 날 아침까지) 40켤레를 모았다고 해요. 7번의 That night(그날 밤)에 시작했으니 일주일이 아니라 하룻밤이에요.","c":"F"},"h":"ca1dcf787b"},{"n":3,"t":"tf","q":"Lichtman says that most clothing donors have already donated socks, too.","ko":"릭트먼은 대부분의 옷 기부자들이 이미 양말도 기부했다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"There are numerous organizations that work to help the homeless, but Lichtman explains why KKGS is special: “While many people donate clothing, nine out of every ten clothing donors have never donated socks.”","노숙자들을 돕기 위해 일하는 수많은 단체들이 있지만, 릭트먼은 왜 KKGS가 특별한지 설명한다. “많은 사람들이 옷을 기부하지만, 옷을 기부하는 사람 열 명 중 아홉 명이 양말을 기부한 적은 없어요.”"]],"w":"10번에서 옷 기부자 열 명 중 아홉 명은 양말을 기부한 적이 없다(have never donated socks)고 해요. 대부분이 양말을 기부해 본 적이 없다는 말이라 반대예요.","c":"F"},"h":"b824304677"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When the weather turns frigid, he told her, homeless people need socks more than anything else.)","ko":"날씨가 몹시 추워지면, 노숙자들은 다른 어떤 것보다 양말이 필요하다고 그가 그녀에게 말했다.","opts":["무더운","몹시 추운","비가 오는","바람이 센"],"word":"frigid","r":{"a":"2) 몹시 추운","ev":"5~6번 문장","s":[[5,"One grateful man thanked her for the sandwich, but then he mentioned that winter was coming.","고마움을 느낀 한 남자가 샌드위치에 대해 그녀에게 고마워했지만, 그러고 나서 그는 겨울이 오고 있다고 말했다."],[6,"When the weather turns frigid, he told her, homeless people need socks more than anything else.","날씨가 몹시 추워지면, 노숙자들은 다른 어떤 것보다 양말이 필요하다고 그가 그녀에게 말했다."]],"w":"5번에서 겨울이 오고 있다고 했고, 6번은 날씨가 frigid해지면 노숙자에게 양말이 가장 필요하다는 말이에요. 발을 따뜻하게 하는 양말이 필요한 날씨이므로 frigid는 ‘몹시 추운’이에요.","c":2},"h":"53a362b9ed"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That night, after deciding to take action, Lichtman started knocking on doors in her dormitory, asking her classmates to donate one pair of socks.)","ko":"그날 밤, 릭트먼은 행동을 하기로 결심한 후에, 그녀의 기숙사의 문들을 두드리기 시작해서, 그녀의 학과 친구들에게 양말 한 켤레를 기부해 달라고 요청했다.","opts":["도서관","체육관","식당","기숙사"],"word":"dormitory","r":{"a":"4) 기숙사","ev":"7번 문장","s":[[7,"That night, after deciding to take action, Lichtman started knocking on doors in her dormitory, asking her classmates to donate one pair of socks.","그날 밤, 릭트먼은 행동을 하기로 결심한 후에, 그녀의 기숙사의 문들을 두드리기 시작해서, 그녀의 학과 친구들에게 양말 한 켤레를 기부해 달라고 요청했다."]],"w":"릭트먼은 같은 학과 친구들(classmates)의 문을 두드리며 양말을 부탁했어요. 대학생들이 함께 살고 있는 건물의 문이므로 dormitory는 ‘기숙사’예요.","c":4},"h":"7d36bf071e"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nToday she runs a nonprofit organization, called Knock Knock, Give a Sock (KKGS), that has donated more than 3,000,000 pairs of socks to homeless people all across America.","ko":"밑줄 친 that이(가) 가리키는 것은?","sko":"현재 그녀는 미국 전역에서 노숙자들에게 3백만 켤레 이상의 양말을 기부해 온 Knock Knock, Give a Sock(KKGS)이라고 불리는 비영리 단체를 운영하고 있다.","opts":["아디나 릭트먼","Knock Knock, Give a Sock이라는 비영리 단체","양말 3백만 켤레","미국 전역의 노숙자들"],"r":{"a":"2) Knock Knock, Give a Sock이라는 비영리 단체","ev":"9번 문장","s":[[9,"Today she runs a nonprofit organization, called Knock Knock, Give a Sock (KKGS), that has donated more than 3,000,000 pairs of socks to homeless people all across America.","현재 그녀는 미국 전역에서 노숙자들에게 3백만 켤레 이상의 양말을 기부해 온 Knock Knock, Give a Sock(KKGS)이라고 불리는 비영리 단체를 운영하고 있다."]],"w":"9번에서 that has donated 앞의 a nonprofit organization, called Knock Knock, Give a Sock(KKGS)을 설명해요. 노숙자들에게 3백만 켤레 이상의 양말을 기부해 온 단체예요.","c":2,"k":"that = Knock Knock, Give a Sock이라는 비영리 단체"},"pron":"that","h":"f3c73b495c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Lichtman discovered an important need and found a way to fill it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"릭트먼은 중요한 필요성을 찾아냈고 그것을 충족시킬 방법을 찾았다.","opts":["릭트먼은 중요한 필요를 찾아냈고 그것을 채울 방법을 찾았다.","릭트먼은 중요한 필요를 찾아냈지만 그것을 채울 방법을 찾지 못했다.","릭트먼은 가득 찬 상자를 발견했고 그것을 비울 방법을 찾았다.","릭트먼은 사람들이 필요 없다고 한 물건을 찾아내 새로 팔 방법을 찾았다."],"r":{"a":"1) 릭트먼은 중요한 필요를 찾아냈고 그것을 채울 방법을 찾았다.","ev":"11번 문장","s":[[11,"Lichtman discovered an important need and found a way to fill it.","릭트먼은 중요한 필요성을 찾아냈고 그것을 충족시킬 방법을 찾았다."]],"w":"found a way to fill it에서 to fill은 a way를 꾸미고, it은 an important need(중요한 필요)예요. 그래서 ‘필요를 채울 방법’이라는 뜻이에요. 방법을 찾지 못했다거나 물건을 파는 이야기가 아니에요.","c":1},"h":"d646e7e381"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["릭트먼은 뉴욕시 거리에서 노숙자들에게 무료 샌드위치를 나눠 주었다.","릭트먼은 가게에 양말 40켤레를 기부해 달라고 부탁했다.","KKGS는 주로 뉴욕시의 노숙자들에게 샌드위치를 나눠 준다.","릭트먼은 노숙자를 돕기 시작했을 때 의사였다."],"opts":["Lichtman gave out free sandwiches to homeless people on the street in New York City.","Lichtman asked a store to donate 40 pairs of socks.","KKGS mainly gives sandwiches to homeless people in New York City.","Lichtman was a doctor when she started helping homeless people."],"r":{"a":"1) Lichtman gave out free sandwiches to homeless people on the street in New York City. (릭트먼은 뉴욕시 거리에서 노숙자들에게 무료 샌드위치를 나눠 주었다.)","ev":"4번 문장","s":[[4,"She had decided to help homeless people in New York City and was distributing free sandwiches on the street.","그녀는 뉴욕시의 노숙자들을 돕기로 결심했고 거리에서 무료 샌드위치를 나눠주고 있었다."]],"w":"4번에서 릭트먼은 뉴욕시의 노숙자들을 돕기로 결심했고 거리에서 무료 샌드위치를 나눠 주고 있었다고 해요.","c":1},"h":"2fffe0eb36"},{"n":9,"t":"sum","q":"Because of Lichtman’s (A) thinking, thousands of people will have (B) feet this winter.","ko":"릭트먼의 (A) 생각 덕분에, 올겨울 수천 명의 사람들의 발이 (B).","oko":["(A) 부주의한 / (B) 따뜻할 것이다","(A) 혁신적인 / (B) 차가울 것이다","(A) 부주의한 / (B) 차가울 것이다","(A) 혁신적인 / (B) 따뜻할 것이다","(A) 지루한 / (B) 젖을 것이다"],"opts":["(A) careless / (B) warm","(A) innovative / (B) cold","(A) careless / (B) cold","(A) innovative / (B) warm","(A) boring / (B) wet"],"r":{"a":"4) (A) innovative / (B) warm (혁신적인 / 따뜻할 것이다)","ev":"12번 문장","s":[[12,"Thanks to her innovative thinking, thousands of people will have warm feet this winter.","그녀의 혁신적인 생각 덕분에, 수천 명의 사람들이 올겨울에 발이 따뜻할 것이다."]],"w":"12번에서 그녀의 혁신적인(innovative) 생각 덕분에 수천 명의 사람들이 올겨울에 발이 따뜻할(warm) 것이라고 해요.","c":4},"h":"96bf2bb30d"},{"n":10,"t":"fill","q":"But they can make a huge [A] in the [B] of some people.","ko":"하지만 양말은 어떤 사람들의 [B]에 커다란 [A]을(를) 만들어 낼 수 있다.","bank":["difference","lives","sandwich","weather","winter","pair"],"bko":{"difference":"차이","lives":"삶(life의 복수형)","sandwich":"샌드위치","weather":"날씨","winter":"겨울","pair":"한 켤레"},"r":{"a":"[A] difference (차이), [B] lives (삶)","ev":"2번 문장","s":[[2,"But they can make a huge difference in the lives of some people.","하지만 양말은 어떤 사람들의 인생에는 커다란 영향을 미칠 수 있다."]],"w":"2번에서 양말은 어떤 사람들의 삶(lives)에 커다란 차이(difference)를 만들 수 있다고 해요. life의 복수형이 lives예요.","c":null},"h":"6db9a0ce13"}]},{"u":8,"id":"ch2-08-1","no":1,"ko":"입 안에서 자라는 생명","items":[{"n":1,"t":"tf","q":"Cichlids are freshwater fish that hold their offspring in their mouths.","ko":"시클리드는 새끼를 입에 물고 있는 민물고기다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Cichlids, which are a type of freshwater fish, hold their offspring in their mouths —they are mouthbrooders!","민물고기의 일종인 시클리드는 새끼들을 입에 물고 있는데, 그들은 마우스브리더(mouthbrooders)다!"]],"w":"3번 문장에서 시클리드는 민물고기의 일종(a type of freshwater fish)이고 새끼를 입에 물고 있다(hold their offspring in their mouths)고 해요. 진술과 같아요.","c":"T"},"h":"7ad0a2967e"},{"n":2,"t":"tf","q":"The male cichlid gathers the fertilized eggs in his mouth.","ko":"수컷 시클리드가 수정된 알을 자기 입에 모은다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"Once the eggs are laid, the male fertilizes them.","알이 낳아지면, 수컷은 그것을 수정시킨다."],[6,"Subsequently, she carefully gathers them in her mouth.","그 후, 암컷은 알을 조심스럽게 입에 모은다."]],"w":"5번에서 수컷은 알을 수정시키기만 해요. 알을 입에 모으는 쪽은 6번의 she, 즉 암컷이에요.","c":"F"},"h":"f2b1852fe9"},{"n":3,"t":"tf","q":"The female cichlid stops holding the young in her mouth as soon as the eggs hatch.","ko":"알이 부화하자마자 암컷 시클리드는 새끼를 입에 물고 있기를 멈춘다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"After hatching, she will continue to hold them in her mouth for up to two additional weeks.","부화한 후, 암컷은 최대 추가적인 2주 동안 새끼들을 입에 계속 물고 있는다."]],"w":"8번에서 암컷은 부화한 뒤에도 최대 2주 동안 새끼를 계속 입에 물고 있어요(continue to hold). 부화하자마자 멈춘다는 말은 반대예요.","c":"F"},"h":"d40108b680"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…to provide a suitable place for the female to lay her eggs.)","ko":"…암컷이 알을 낳도록 적합한 장소를 마련하기 위해… (suitable)","opts":["위험한","알맞은, 적합한","불필요한","거대한"],"word":"suitable","r":{"a":"2) 알맞은, 적합한","ev":"4번 문장","s":[[4,"Male cichlids begin by digging a pit or nest in the ground to provide a suitable place for the female to lay her eggs.","수컷 시클리드는 암컷이 알을 낳도록 적합한 장소를 마련하기 위해 땅에 구멍이나 둥지를 파는 것부터 시작한다."]],"w":"수컷이 구덩이나 둥지를 파는 이유는 암컷이 알을 낳기에 알맞은 장소를 마련하려는 거예요. suitable = 알맞은, 적합한.","c":2},"h":"dff88cb7c5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…cichlids can significantly enhance their offspring’s chances for survival.)","ko":"시클리드는 새끼의 생존 가능성을 크게 높일 수 있다. (enhance)","opts":["높이다","줄이다","막다","바꾸다"],"word":"enhance","r":{"a":"1) 높이다","ev":"13번 문장","s":[[13,"By nurturing their offspring in their mouths, cichlids can significantly enhance their offspring’s chances for survival.","입에서 그들의 새끼들을 기름으로써, 시클리드는 새끼들의 생존 가능성을 크게 높일 수 있다."]],"w":"입에서 새끼를 기르면 생존 가능성이 커진다는 문장이에요. enhance = 높이다, 향상시키다. '줄이다'는 반대 뜻이에요.","c":1},"h":"e342bd3762"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nShe only releases them so they can feed, but she will grab them if she detects danger.","ko":"밑줄 친 them이 가리키는 것은?","sko":"암컷은 오직 새끼들이 먹을 수 있도록 할 때만 풀어 주고, 위험을 감지하면 다시 물어 들인다.","opts":["수컷 시클리드들","포식자들","부화한 새끼들","암컷이 판 구덩이들"],"r":{"a":"3) 부화한 새끼들","ev":"8~9번 문장","s":[[8,"After hatching, she will continue to hold them in her mouth for up to two additional weeks.","부화한 후, 암컷은 최대 추가적인 2주 동안 새끼들을 입에 계속 물고 있는다."],[9,"She only releases them so they can feed, but she will grab them if she detects danger.","암컷은 오직 새끼들이 먹을 수 있도록 할 때만 풀어 주고, 위험을 감지하면 다시 물어 들인다."]],"w":"8번에서 암컷은 부화한 새끼를 입에 물고 있어요. 9번에서 그 새끼들을 먹일 때만 풀어 주고(releases them), 위험하면 다시 물어요(grab them). 포식자를 입에 무는 것이 아니에요.","c":3},"h":"73fc79a8f7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Cichlids have evolved to raise their offspring effectively and safely.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시클리드는 효과적이고 안전하게 새끼를 기를 수 있도록 진화해 왔다.","opts":["시클리드는 새끼를 안전하게 두고 떠나도록 진화해 왔다.","시클리드는 새끼를 효과적으로 기르려고 둥지를 더 크게 만들어 왔다.","시클리드는 새끼를 길러 낸 뒤에야 안전하게 진화할 수 있었다.","시클리드는 새끼를 효과적이고 안전하게 기르는 방향으로 진화해 왔다."],"r":{"a":"4) 시클리드는 새끼를 효과적이고 안전하게 기르는 방향으로 진화해 왔다.","ev":"14번 문장","s":[[14,"Cichlids have evolved to raise their offspring effectively and safely.","시클리드는 효과적이고 안전하게 새끼를 기를 수 있도록 진화해 왔다."]],"w":"have evolved to raise는 '기르기 위해 진화해 왔다'는 뜻이에요. 목적은 새끼를 효과적이고 안전하게 기르는 것이고, 새끼를 두고 떠난다(①)거나 둥지(②)는 본문에 없어요.","c":4},"h":"5d21b29ae5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["갓 부화한 시클리드는 작아서 포식자에게 쉽게 표적이 된다.","갓 부화한 시클리드는 크고 포식자로부터 안전하다.","포식자들은 갓 부화한 시클리드가 작아서 피한다.","갓 부화한 시클리드는 다른 물고기와 쉽게 싸울 수 있다."],"opts":["Newly hatched cichlids are small and easily targeted by predators.","Newly hatched cichlids are large and safe from predators.","Predators avoid newly hatched cichlids because they are small.","Newly hatched cichlids can easily fight other fish."],"r":{"a":"1) Newly hatched cichlids are small and easily targeted by predators. (갓 부화한 시클리드는 작아서 포식자에게 쉽게 표적이 된다.)","ev":"11번 문장","s":[[11,"Newly hatched cichlids, being small and vulnerable, are easily targeted by predators.","갓 부화한 시클리드는 작고 연약해서 포식자에 의해 쉽게 겨냥된다."]],"w":"11번에서 갓 부화한 시클리드는 작고 연약해서 포식자에게 쉽게 겨냥된다고 해요.","c":1},"h":"ccf1ecf548"},{"n":9,"t":"sum","q":"Mouthbrooding (A) (B) from predators, such as other cichlids.","ko":"입으로 새끼를 기르는 방식은 다른 시클리드와 같은 포식자들로부터 (B)을(를) (A).","oko":["(A) 없앤다 / (B) 보호","(A) 제공한다 / (B) 먹이","(A) 일으킨다 / (B) 위험","(A) 제공한다 / (B) 보호","(A) 없앤다 / (B) 위험"],"opts":["(A) removes / (B) protection","(A) offers / (B) food","(A) causes / (B) danger","(A) offers / (B) protection","(A) removes / (B) danger"],"r":{"a":"4) (A) offers / (B) protection (제공한다 / 보호)","ev":"12번 문장","s":[[12,"Mouthbrooding offers protection from predators, such as other cichlids.","입으로 새끼를 기르는 방식은 다른 시클리드와 같은 포식자들로부터 보호를 제공한다."]],"w":"12번에서 입으로 새끼를 기르는 방식(Mouthbrooding)은 다른 시클리드와 같은 포식자들로부터 보호(protection)를 제공한다(offers)고 해요.","c":4},"h":"057a2af678"},{"n":10,"t":"fill","q":"This parental strategy shows the [A] sense of their maternal [B].","ko":"이 양육 전략은 그들의 [A] 모성 [B]을(를) 보여 준다.","bank":["strong","instinct","nest","starvation","predator","mouth"],"bko":{"strong":"강한","instinct":"본능","nest":"둥지","starvation":"굶주림","predator":"포식자","mouth":"입"},"r":{"a":"[A] strong (강한), [B] instinct (본능)","ev":"15번 문장","s":[[15,"This parental strategy shows the strong sense of their maternal instinct.","이 양육 전략은 그들의 강한 모성 본능을 보여 준다."]],"w":"15번에서 이 양육 전략(입에서 새끼를 기르는 방식)은 그들의 강한(strong) 모성 본능(instinct)을 보여 준다고 해요.","c":null},"h":"1ed9d828f0"}]},{"u":8,"id":"ch2-08-2","no":2,"ko":"숫자를 세는 식물","items":[{"n":1,"t":"tf","q":"A Venus flytrap’s trap snaps shut when at least two of the three trigger hairs on a lobe are touched.","ko":"파리지옥의 덫은 엽의 감각털 세 개 중 최소 두 개가 접촉되면 닫힌다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When at least two of the three trigger hairs are touched, the trap snaps shut.","이 세 개의 감각털 중 최소 두 개가 접촉되면(자극을 받으면), 덫이 닫힌다."]],"w":"3번 문장에 When at least two of the three trigger hairs are touched, the trap snaps shut이라고 나와요. 진술과 같아요.","c":"T"},"h":"bd22236097"},{"n":2,"t":"tf","q":"The first touch on a trigger hair makes the trap close at once.","ko":"감각털에 첫 번째 접촉이 일어나면 덫이 곧바로 닫힌다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"On the first touch, the trigger hairs transmit a bio-electrical signal that serves as an indicator —it doesn’t cause the trap to close.","첫 번째 접촉에서, 감각털은 지표로서의 역할을 하는 생체 전기 신호를 전달하는데, 이것은 덫이 닫히도록 하진 않는다."]],"w":"5번에서 첫 번째 접촉의 신호는 지표 역할만 하고 덫이 닫히게 하지는 않아요(it doesn’t cause the trap to close). 곧바로 닫힌다는 말은 반대예요.","c":"F"},"h":"b169bab57b"},{"n":3,"t":"tf","q":"Each lobe has two trigger hairs that detect movement in the trap.","ko":"각 엽에는 덫 속 움직임을 감지하는 감각털이 두 개 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"This is possible because three trigger hairs on each lobe detect movement in the trap.","이것은 각 엽에 위치한 세 개의 감각털이 덫 속 움직임을 감지하기 때문에 가능하다."]],"w":"2번에서 각 엽에 있는 감각털은 두 개가 아니라 세 개(three trigger hairs)예요. '두 개'는 3번에서 닫히는 데 필요한 최소 접촉 수예요.","c":"F"},"h":"4c34747ddd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The plant will instead wait to confirm if it was a valid trigger.)","ko":"대신에 이 식물은 그것이 유효한 자극인지 확인하기 위해 기다릴 것이다. (confirm)","opts":["포기하다","숨기다","확인하다","설명하다"],"word":"confirm","r":{"a":"3) 확인하다","ev":"6번 문장","s":[[6,"The plant will instead wait to confirm if it was a valid trigger.","대신에 이 식물은 그것이 유효한 자극인지 확인하기 위해 기다릴 것이다."]],"w":"식물은 닫는 대신 기다리면서 그 접촉이 진짜 자극인지 알아보려는 거예요. confirm = 확인하다.","c":3},"h":"f9974e268a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…activate transport molecules to absorb the digested insects.)","ko":"…소화된 곤충을 흡수하는 운반 분자들을 활성화한다. (absorb)","opts":["내뿜다","흡수하다","저장하다","분해하다"],"word":"absorb","r":{"a":"2) 흡수하다","ev":"8번 문장","s":[[8,"Five or more signals boost enzyme production in the plant’s 37,000 glands and activate transport molecules to absorb the digested insects.","다섯 번 이상의 신호는 식물의 37,000개 분비샘에서 효소 생산을 증가시키고, 소화된 곤충을 흡수하는 운반 분자들을 활성화한다."]],"w":"운반 분자들은 이미 소화된 곤충의 영양분을 받아들이는 일을 해요. absorb = 흡수하다. 소화시키는 일(분해)은 효소가 해요.","c":2},"h":"ed514139db"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe bigger the prey, the more fiercely it struggles, which further stimulates the trigger hairs, increasing digestive enzyme production.","ko":"밑줄 친 it이 가리키는 것은?","sko":"먹잇감이 클수록 그것은 더 격렬하게 몸부림치며, 이는 감각털을 더욱 자극하여 소화 효소 생산을 증가시킨다.","opts":["덫","감각털","먹잇감","소화 효소"],"r":{"a":"3) 먹잇감","ev":"9번 문장","s":[[9,"The bigger the prey, the more fiercely it struggles, which further stimulates the trigger hairs, increasing digestive enzyme production.","먹잇감이 클수록 그것은 더 격렬하게 몸부림치며, 이는 감각털을 더욱 자극하여 소화 효소 생산을 증가시킨다."]],"w":"몸부림치는(struggles) 것은 덫에 잡힌 먹잇감이에요. 앞에 나온 the prey를 it으로 받았고, 그 몸부림이 감각털을 더 자극해요.","c":3},"h":"748ac2e099"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The Venus flytrap is well-known for catching insects by shutting its jaw-like lobes in the blink of an eye.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"파리지옥은 턱처럼 생긴 엽을 순식간에 닫음으로써 곤충을 잡는 것으로 잘 알려져 있다.","opts":["파리지옥은 곤충을 잡은 뒤 턱 같은 엽을 순식간에 여는 것으로 알려져 있다.","파리지옥은 턱 같은 엽을 천천히 닫아 곤충이 스스로 들어오게 하는 것으로 알려져 있다.","파리지옥은 곤충을 쫓아내려고 턱 같은 엽을 흔드는 것으로 알려져 있다.","파리지옥은 턱 같은 엽을 눈 깜박할 사이에 닫아 곤충을 잡는 것으로 알려져 있다."],"r":{"a":"4) 파리지옥은 턱 같은 엽을 눈 깜박할 사이에 닫아 곤충을 잡는 것으로 알려져 있다.","ev":"1번 문장","s":[[1,"The Venus flytrap is well-known for catching insects by shutting its jaw-like lobes in the blink of an eye.","파리지옥은 턱처럼 생긴 엽을 순식간에 닫음으로써 곤충을 잡는 것으로 잘 알려져 있다."]],"w":"in the blink of an eye는 '눈 깜박할 사이에'예요. by shutting은 '닫음으로써'라서, 엽을 순식간에 닫아 곤충을 잡는다는 뜻이에요. 여는 것(①)이나 천천히 닫는 것(②)은 본문과 달라요.","c":4},"h":"36d5240de5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파리지옥이 덫을 닫는 방식은 세는 능력에 기반한다.","파리지옥은 엽을 천천히 닫아서 곤충을 잡는다.","다섯 번 이상의 신호는 식물의 분비샘에서 효소 생산을 줄인다.","파리지옥은 첫 번째 자극을 기억하지 못한다."],"opts":["The Venus flytrap’s way of closing its trap is based on its ability to count.","The Venus flytrap catches insects by slowly closing its lobes.","Five or more signals reduce enzyme production in the plant’s glands.","The Venus flytrap cannot remember the first stimulus."],"r":{"a":"1) The Venus flytrap’s way of closing its trap is based on its ability to count.","ev":"1번, 4번, 8번, 11번 문장","s":[[1,"The Venus flytrap is well-known for catching insects by shutting its jaw-like lobes in the blink of an eye.","파리지옥은 턱처럼 생긴 엽을 순식간에 닫음으로써 곤충을 잡는 것으로 잘 알려져 있다."],[4,"But did you know this process is based on the Venus flytrap’s ability to count?","그런데 당신은 이 과정이 파리지옥의 세는 능력에 기반하고 있다는 것을 알았는가?"],[8,"Five or more signals boost enzyme production in the plant’s 37,000 glands and activate transport molecules to absorb the digested insects.","다섯 번 이상의 신호는 식물의 37,000개 분비샘에서 효소 생산을 증가시키고, 소화된 곤충을 흡수하는 운반 분자들을 활성화한다."],[11,"In essence, the plant must remember the first stimulus until the second stimulus is triggered, demonstrating its remarkable ability to count the number of stimuli.","본질적으로, 이 식물은 두 번째 자극이 발생할 때까지 첫 번째 자극을 기억해야 하며, 이는 자극의 횟수를 세는 그 식물의 놀라운 능력을 보여 준다."]],"w":"4번에서 이 과정이 세는 능력에 기반한다고 해요. 1번은 순식간에 닫는다는 내용이고, 8번은 효소 생산이 늘어난다(boost)는 내용이에요. 11번에서 식물은 첫 번째 자극을 기억해야 한다고 해요.","c":1},"h":"ced86c0b63"},{"n":9,"t":"sum","q":"After the second stimulus, the plant (A) a (B) called jasmonate.","ko":"두 번째 자극 뒤에 식물은 자스모네이트라고 불리는 (B)을(를) (A).","oko":["(A) 분비한다 / (B) 곤충","(A) 확인한다 / (B) 호르몬","(A) 숨긴다 / (B) 엽","(A) 분비한다 / (B) 호르몬","(A) 확인한다 / (B) 곤충"],"opts":["(A) releases / (B) insect","(A) confirms / (B) hormone","(A) hides / (B) lobe","(A) releases / (B) hormone","(A) confirms / (B) insect"],"r":{"a":"4) (A) releases / (B) hormone (분비한다 / 호르몬)","ev":"7번 문장","s":[[7,"The second stimulus activates the trap and snaps it shut in under a second, subsequently releasing the hormone jasmonate, which activates digestive enzymes.","두 번째 자극은 그 덫을 활성화시키고, 1초 이내에 그것을 닫히게 하며, 이후 자스모네이트 호르몬을 분비하는데, 이것이 소화 효소를 활성화한다."]],"w":"7번에서 두 번째 자극이 덫을 닫히게 한 뒤 자스모네이트라는 호르몬(hormone)을 분비한다(releasing)고 해요.","c":4},"h":"6e2628cc3d"},{"n":10,"t":"fill","q":"This process [A] how Venus flytraps utilize a short-term memory [B].","ko":"이 과정은 파리지옥이 단기 기억 [B]을(를) 어떻게 활용하는지 [A].","bank":["exhibits","mechanism","absorbs","digests","insect","prey"],"bko":{"exhibits":"보여 주다","mechanism":"메커니즘, 작용 방식","absorbs":"흡수하다","digests":"소화하다","insect":"곤충","prey":"먹잇감"},"r":{"a":"[A] exhibits (보여 주다), [B] mechanism (메커니즘, 작용 방식)","ev":"10번 문장","s":[[10,"This process exhibits how Venus flytraps utilize a short-term memory mechanism.","이 과정은 어떻게 파리지옥이 단기 기억 메커니즘을 활용하는지를 보여 준다."]],"w":"10번에서 이 과정은 파리지옥이 단기 기억 메커니즘(mechanism)을 활용하는 방식을 보여 준다(exhibits)고 해요.","c":null},"h":"fdc1adbd31"}]},{"u":8,"id":"ch2-08-3","no":3,"ko":"사마귀 귀의 비밀","items":[{"n":1,"t":"tf","q":"A mantis’s ear is on its chest between its back legs.","ko":"사마귀의 귀는 뒷다리 사이의 가슴에 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"What’s more surprising is that they have only one ear, which can be found on their chest between their back legs!","더 놀라운 것은 사마귀가 귀가 하나밖에 없다는 것인데, 그 귀는 그들의 뒷다리 사이의 가슴에서 발견될 수 있다!"]],"w":"4번에서 사마귀의 하나뿐인 귀는 뒷다리 사이의 가슴(on their chest between their back legs)에서 발견된다고 해요.","c":"T"},"h":"a2ab193b2f"},{"n":2,"t":"tf","q":"With its single ear, a mantis can estimate the direction and distance of a sound.","ko":"사마귀는 하나뿐인 귀로 소리의 방향과 거리를 추정할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"This information is used to estimate the direction and distance of the sounds.","이 정보는 소리의 방향과 거리를 추정하는 데 사용된다."],[7,"With only one ear, mantises don’t have this capability.","하나뿐인 귀를 가진 사마귀는 이런 능력이 없다."]],"w":"6번에서 방향과 거리의 추정은 두 귀가 있어야 가능한 능력이고, 7번에서 귀가 하나뿐인 사마귀는 이 능력이 없다(don’t have this capability)고 해요.","c":"F"},"h":"8f6308aecc"},{"n":3,"t":"tf","q":"When a mantis senses a bat, it flies up into the air to avoid capture.","ko":"사마귀는 박쥐를 감지하면 포획을 피하려고 공중으로 날아오른다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"As soon as a mantis senses a bat, which it can do from up to 10 meters away, it immediately dives toward the ground to avoid capture.","사마귀는 박쥐의 존재를 최대 10미터 거리에서 감지할 수 있으며, 감지하자마자 포획을 피하기 위해 즉시 땅 쪽으로 급강하한다."]],"w":"11번에서 사마귀는 박쥐를 감지하면 땅 쪽으로 급강하해요(dives toward the ground). 공중으로 날아오른다는 말은 반대 방향이에요.","c":"F"},"h":"683f4407c7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Praying mantises are elusive creatures.)","ko":"사마귀는 찾기 힘든 생물이다. (elusive)","opts":["흔한","느린","찾기 힘든","사나운"],"word":"elusive","r":{"a":"3) 찾기 힘든","ev":"1~2번 문장","s":[[1,"Praying mantises are elusive creatures.","사마귀는 찾기 힘든 생물이다."],[2,"But if you look carefully, you may find one hidden in your garden, though they are nearly invisible amongst plant leaves and stems.","하지만 만약 당신이 주의 깊게 본다면, 비록 그들이 식물의 잎과 줄기 사이에서 거의 보이지 않을지라도, 당신의 정원에 숨겨진 한 마리를 발견할지도 모른다."]],"w":"1번에서 elusive라고 하고, 2번에서 주의 깊게 봐야 겨우 찾고 식물 사이에서 거의 보이지 않는다고 설명해요. elusive = 찾기 힘든.","c":3},"h":"90124b27e7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the ear plays a vital role in detecting life threatening situations.)","ko":"그 귀는 생명을 위협하는 상황을 감지하는 데 중요한 역할을 한다. (vital)","opts":["사소한","필수적인","위험한","우연한"],"word":"vital","r":{"a":"2) 필수적인","ev":"9번 문장","s":[[9,"Despite its limitations, the ear plays a vital role in detecting life threatening situations.","한계에도 불구하고, 그 귀는 생명을 위협하는 상황을 감지하는 데 중요한 역할을 한다."]],"w":"앞에 Despite its limitations(한계에도 불구하고)가 있어서, 귀가 작은 역할이 아니라 꼭 필요한 역할을 한다는 흐름이에요. vital = 매우 중요한, 필수적인.","c":2},"h":"e9f22413cd"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt has the ability to detect ultrasonic waves such as the sounds emitted by bats, one of the mantis’ primary predators.","ko":"밑줄 친 It이 가리키는 것은?","sko":"이것은 사마귀의 주요 포식자 중 하나인 박쥐가 내는 소리와 같은 초음파를 감지하는 능력이 있다.","opts":["사마귀의 귀","박쥐","사마귀의 뒷다리","초음파"],"r":{"a":"1) 사마귀의 귀","ev":"9~10번 문장","s":[[9,"Despite its limitations, the ear plays a vital role in detecting life threatening situations.","한계에도 불구하고, 그 귀는 생명을 위협하는 상황을 감지하는 데 중요한 역할을 한다."],[10,"It has the ability to detect ultrasonic waves such as the sounds emitted by bats, one of the mantis’ primary predators.","이것은 사마귀의 주요 포식자 중 하나인 박쥐가 내는 소리와 같은 초음파를 감지하는 능력이 있다."]],"w":"9번에서 the ear가 중요한 역할을 한다고 했고, 10번에서 그 귀가 초음파를 감지하는 능력이 있다고 이어져요. 박쥐는 초음파를 내는 쪽이에요.","c":1},"h":"3971361754"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The unique position of the mantis’ ear allows the mantis to quickly detect sound vibrations and react to danger.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사마귀 귀의 독특한 위치는 사마귀가 소리의 진동을 빠르게 감지하고 위험에 반응하도록 한다.","opts":["사마귀 귀의 독특한 위치 때문에 사마귀는 소리를 듣지 못하고 위험에도 반응하지 못한다.","사마귀가 위험에 빠르게 반응하기 때문에 귀의 위치가 독특해졌다.","사마귀는 귀의 위치를 자주 바꿔 가며 소리의 진동을 감지한다.","사마귀 귀의 독특한 위치 덕분에 사마귀는 소리의 진동을 빠르게 감지하고 위험에 반응할 수 있다."],"r":{"a":"4) 사마귀 귀의 독특한 위치 덕분에 사마귀는 소리의 진동을 빠르게 감지하고 위험에 반응할 수 있다.","ev":"12번 문장","s":[[12,"The unique position of the mantis’ ear allows the mantis to quickly detect sound vibrations and react to danger.","사마귀 귀의 독특한 위치는 사마귀가 소리의 진동을 빠르게 감지하고 위험에 반응하도록 한다."]],"w":"allow + 목적어 + to-v는 '(목적어)가 ~할 수 있게 해 준다'예요. 귀의 위치가 원인이고, 빠른 감지와 반응이 결과예요. 원인과 결과를 뒤집거나(②) 본문에 없는 내용(③)은 맞지 않아요.","c":4},"h":"901c914109"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사마귀는 눈이 다섯 개이고, 모두 큰 겹눈이다.","귀가 두 개인 동물은 소리가 어디서 오는지 알 수 없다.","사마귀는 잎 사이에서 눈에 잘 띄어서 정원에서 쉽게 찾을 수 있다.","사마귀는 눈이 다섯 개이고, 그중 두 개는 큰 겹눈이다."],"opts":["Mantises have five eyes, and all of them are large compound eyes.","Animals with two ears cannot tell where a sound comes from.","Mantises are easy to find in a garden because they stand out among the leaves.","Mantises have five eyes, and two of them are large compound eyes."],"r":{"a":"4) Mantises have five eyes, and two of them are large compound eyes. (사마귀는 눈이 다섯 개이고, 그중 두 개는 큰 겹눈이다.)","ev":"3번 문장","s":[[3,"Interestingly, mantises have five eyes, including three small, simple eyes and two large compound eyes.","흥미롭게도, 사마귀는 세 개의 작고 단순한 눈과 두 개의 큰 겹눈을 포함하여, 다섯 개의 눈을 가지고 있다."]],"w":"3번에서 사마귀는 세 개의 작고 단순한 눈과 두 개의 큰 겹눈을 포함해 모두 다섯 개의 눈을 가지고 있다고 해요.","c":4},"h":"5a412311ef"},{"n":9,"t":"sum","q":"Mantises are nearly (A) amongst plant leaves and (B).","ko":"사마귀는 식물의 잎과 (B) 사이에서 거의 (A).","oko":["(A) 보인다 / (B) 줄기","(A) 보이지 않는다 / (B) 귀","(A) 시끄럽다 / (B) 날개","(A) 보이지 않는다 / (B) 줄기","(A) 보인다 / (B) 날개"],"opts":["(A) visible / (B) stems","(A) invisible / (B) ears","(A) noisy / (B) wings","(A) invisible / (B) stems","(A) visible / (B) wings"],"r":{"a":"4) (A) invisible / (B) stems (보이지 않는다 / 줄기)","ev":"2번 문장","s":[[2,"But if you look carefully, you may find one hidden in your garden, though they are nearly invisible amongst plant leaves and stems.","하지만 만약 당신이 주의 깊게 본다면, 비록 그들이 식물의 잎과 줄기 사이에서 거의 보이지 않을지라도, 당신의 정원에 숨겨진 한 마리를 발견할지도 모른다."]],"w":"2번에서 사마귀는 식물의 잎과 줄기(stems) 사이에서 거의 보이지 않는다(invisible)고 해요.","c":4},"h":"c57b6a91c1"},{"n":10,"t":"fill","q":"Though the mantis’ single ear may seem [A], it is [B] to their survival.","ko":"사마귀의 하나뿐인 귀는 [A] 모습일지라도, 그들의 생존에 [B] 것이다.","bank":["strange","crucial","bright","noisy","hidden","ultrasonic"],"bko":{"strange":"이상한","crucial":"매우 중요한","bright":"밝은","noisy":"시끄러운","hidden":"숨겨진","ultrasonic":"초음파의"},"r":{"a":"[A] strange, [B] crucial","ev":"13번 문장","s":[[13,"Though the mantis’ single ear may seem strange, it is crucial to their survival.","비록 사마귀의 단 하나뿐인 귀가 이상해 보일지라도, 그것은 그들의 생존에 중요하다."]],"w":"13번에서 Though(비록 ~일지라도) 앞에는 이상해 보일 수 있다(strange), 뒤에는 그래도 생존에 중요하다(crucial)고 해요. 나머지 단어는 이 문장의 대비 내용과 맞지 않아요.","c":null},"h":"a5103fc063"}]},{"u":8,"id":"ch2-08-4","no":4,"ko":"수능:ON 긴 어구 빈칸 추론","items":[{"n":1,"t":"tf","q":"Scientists discovered the bones of ancient camels in the Arctic region of Canada.","ko":"과학자들은 캐나다의 북극 지방에서 고대 낙타의 뼈를 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Scientists recently discovered the bones of ancient camels in the Arctic region of Canada.","과학자들은 최근에 고대 낙타의 뼈를 캐나다의 북극 지방에서 발견했다."]],"w":"3번 문장에 discovered the bones of ancient camels in the Arctic region of Canada가 그대로 나와요.","c":"T"},"h":"5738ac4ed9"},{"n":2,"t":"tf","q":"The camels never reached desert regions after their long journey.","ko":"낙타들은 긴 여정 끝에도 결코 사막 지역에 도착하지 못했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"After a long journey, they eventually made their way to desert regions.","긴 여정 끝에, 낙타들은 마침내 사막 지역까지 오게 되었다."]],"w":"7번에서 긴 여정 끝에 낙타들은 마침내 사막 지역까지 오게 되었다(they eventually made their way to desert regions)고 해요. 도착하지 못했다는 말은 반대예요.","c":"F"},"h":"4ad554f5c1"},{"n":3,"t":"tf","q":"Similar camel bones were found about 1,200 kilometers to the north of the Arctic bones.","ko":"비슷한 낙타 뼈가 북극의 뼈에서 북쪽으로 약 1,200km 떨어진 곳에서 발견되었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Interestingly, similar camel bones have been found about 1,200 kilometers to the south, indicating that these remarkable mammals migrated south.","흥미롭게도, 비슷한 낙타 뼈가 남쪽으로 약 1,200km 떨어진 곳에서 발견되었고, 이 놀라운 포유류들이 남쪽으로 이동했다는 것을 나타낸다."]],"w":"5번에서 비슷한 낙타 뼈는 남쪽으로 약 1,200km 떨어진 곳(to the south)에서 발견되었다고 해요. 북쪽이 아니라 남쪽이고, 그래서 낙타가 남쪽으로 이동했다는 결론이 나와요.","c":"F"},"h":"5590d9f8af"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Can you imagine camels roaming across vast snow-covered landscapes?)","ko":"낙타가 광활한 눈 덮인 풍경을 돌아다니는 것을 상상할 수 있는가? (roaming)","opts":["싸우는","돌아다니는","잠자는","달리기 경주를 하는"],"word":"roaming","r":{"a":"2) 돌아다니는","ev":"1번 문장","s":[[1,"Can you imagine camels roaming across vast snow-covered landscapes?","당신은 낙타가 광활한 눈 덮인 풍경을 돌아다니는 것을 상상할 수 있는가?"]],"w":"낙타가 눈 덮인 넓은 땅 위를 여기저기 다니는 모습이에요. roam = 돌아다니다.","c":2},"h":"d4319dbda1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…to walk across the snow without sinking in.)","ko":"…눈에 빠지지 않고 눈 위를 가로지르는 것… (sinking)","opts":["미끄러지는","어는","넘어지는","빠지는, 가라앉는"],"word":"sinking","r":{"a":"4) 빠지는, 가라앉는","ev":"9번 문장","s":[[9,"Its hump would have allowed it to store food during the dark, frozen winter months, and its broad feet would have made it easier to walk across the snow without sinking in.","낙타의 혹은 어둡고 추운 겨울 동안 영양분을 저장할 수 있도록 해 주었을 것이고 낙타의 넓은 발은 눈에 빠지지 않고 눈 위를 가로지르는 것을 더 쉽게 해 주었을 것이다."]],"w":"넓은 발은 눈 위를 걸을 때 발이 눈속으로 푹 들어가지 않게 해 줘요. sink = 빠지다, 가라앉다.","c":4},"h":"9ea4a5b589"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nThe fact that the camel migrated suggests that its evolution may have been influenced more by the Arctic than by the desert.","ko":"밑줄 친 its이(가) 가리키는 것은?","sko":"낙타가 이주했다는 사실은 낙타의 진화가 사막보다는 북극에 의해서 더욱 영향을 받았을지도 모른다는 점을 암시한다.","opts":["낙타","북극","사막","과학자들"],"r":{"a":"1) 낙타","ev":"8번 문장","s":[[8,"The fact that the camel migrated suggests that its evolution may have been influenced more by the Arctic than by the desert.","낙타가 이주했다는 사실은 낙타의 진화가 사막보다는 북극에 의해서 더욱 영향을 받았을지도 모른다는 점을 암시한다."]],"w":"8번에서 its evolution은 앞에 나온 the camel(낙타)의 진화를 말해요. 낙타가 이주했다는 사실은 낙타의 진화가 사막보다 북극의 영향을 더 받았을지도 모른다는 뜻이에요.","c":1,"k":"its = 낙타"},"pron":"its","h":"c70860cf89"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It sounds strange, but this occurrence was likely normal millions of years ago.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 이상하게 들리지만, 수백만 년 전에 이것은 평범한 현상이었을 것이다.","opts":["이상하게 들리지만, 수백만 년 전에는 이런 일이 평범했을 가능성이 크다.","이상하게 들리지만, 이런 일은 앞으로 수백만 년 뒤에 평범해질 것이다.","이상하게 들리기 때문에, 이런 일은 수백만 년 전에도 일어나지 않았을 것이다.","이런 일은 수백만 년 전에도 이상하게 여겨졌을 것이다."],"r":{"a":"1) 이상하게 들리지만, 수백만 년 전에는 이런 일이 평범했을 가능성이 크다.","ev":"2번 문장","s":[[2,"It sounds strange, but this occurrence was likely normal millions of years ago.","그것은 이상하게 들리지만, 수백만 년 전에 이것은 평범한 현상이었을 것이다."]],"w":"2번에서 이상하게 들리지만(sounds strange) 수백만 년 전에는 이런 일이 평범했을 것(likely normal)이라고 해요.","c":1},"h":"6fc066a515"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["낙타는 북극에 살기 전에 사막에서 살았다.","낙타의 혹은 낙타가 사막으로 옮겨 간 뒤에만 도움이 되었다.","고대 낙타는 아주 오래전에 북극 지방에서 살았다.","북아메리카와 아시아는 넓은 바다로 갈라져 있었다."],"opts":["Camels lived in deserts before they lived in the Arctic.","A camel’s hump helped it only after the camel moved to the desert.","Ancient camels lived in the Arctic region long ago.","North America and Asia were separated by a wide ocean."],"r":{"a":"3) Ancient camels lived in the Arctic region long ago. (고대 낙타는 아주 오래전에 북극 지방에서 살았다.)","ev":"4번 문장","s":[[4,"Apparently, this is where they lived long, long ago.","분명, 그곳이 낙타들이 아주 오래전에 살았던 곳이다."]],"w":"4번에서 그곳(북극 지방)이 낙타들이 아주 오래전에 살았던 곳이라고 해요.","c":3},"h":"c4e19dab4e"},{"n":9,"t":"sum","q":"Because North America and Asia were (A), the camels could simply walk from one (B) to the other.","ko":"북아메리카와 아시아가 (A) 있어서, 낙타들은 한 (B)에서 다른 쪽으로 그냥 걸어갈 수 있었다.","oko":["(A) 분리되어 / (B) 대륙","(A) 연결되어 / (B) 바다","(A) 나뉘어 / (B) 숲","(A) 연결되어 / (B) 대륙","(A) 분리되어 / (B) 바다"],"opts":["(A) separated / (B) continent","(A) connected / (B) ocean","(A) divided / (B) forest","(A) connected / (B) continent","(A) separated / (B) ocean"],"r":{"a":"4) (A) connected / (B) continent (연결되어 / 대륙)","ev":"6번 문장","s":[[6,"About seven or eight million years ago, North America and Asia were connected, so the camels could simply walk from one continent to the other.","약 7, 8백만 년 전쯤, 북아메리카와 아시아가 연결되어 있어서, 낙타들은 한 대륙에서 다른 대륙으로 그냥 걸어갈 수 있었다."]],"w":"6번에서 약 7, 8백만 년 전에 북아메리카와 아시아가 연결되어(connected) 있어서 낙타들이 한 대륙(continent)에서 다른 대륙으로 그냥 걸어갈 수 있었다고 해요.","c":4},"h":"d1be8187e9"},{"n":10,"t":"fill","q":"Of course, these features were extremely [A] when the camel switched to a desert [B].","ko":"물론, 이런 특징들은 낙타가 사막 [B](으)로 바꿨을 때 매우 [A] 것이었다.","bank":["useful","habitat","vast","ancient","frozen","broad"],"bko":{"useful":"유용한","habitat":"서식지","vast":"광활한","ancient":"고대의","frozen":"얼어붙은","broad":"넓은"},"r":{"a":"[A] useful, [B] habitat","ev":"10번 문장","s":[[10,"Of course, these features were extremely useful when the camel switched to a desert habitat.","물론, 이런 특징들은 낙타가 사막 지방의 서식지로 바꿨을 때 매우 유용했다."]],"w":"10번에서 these features were extremely useful when the camel switched to a desert habitat이라고 해요. 혹과 넓은 발이 북극에서 생긴 특징이지만 사막 서식지에서도 매우 유용했다는 뜻이에요. 나머지 단어는 이 빈칸에 들어가면 뜻이 맞지 않아요.","c":null},"h":"f50f219986"}]},{"u":9,"id":"ch2-09-1","no":1,"ko":"첫인상의 오류","items":[{"n":1,"t":"tf","q":"The halo effect is the tendency to judge something as a whole based on just one characteristic.","ko":"후광효과는 한 가지 특징만으로 전체를 판단하는 경향이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The halo effect is the tendency to make an overall judgment—either positive or negative—based on a single characteristic.","후광효과는 한 가지 특징을 바탕으로 전체적인 판단(긍정적이든 부정적이든)을 내리는 경향이다."]],"w":"6번 문장에 an overall judgment based on a single characteristic이 그대로 나와요.","c":"T"},"h":"874da46a05"},{"n":2,"t":"tf","q":"Making decisions faster always protects you from making the wrong choice.","ko":"결정을 더 빨리 내리면 항상 잘못된 선택을 피할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"It might seem beneficial to make decisions faster, but it also puts you at risk of making the wrong choice.","결정을 더 빨리 내리는 것이 이로워 보일 수도 있지만, 당신이 잘못된 결정을 만들 위험에 빠뜨릴 수 있다."]],"w":"8번에서 빨리 결정하는 것이 이로워 보여도 잘못된 선택을 할 위험이 있다고 했어요. 항상 피할 수 있다는 내용은 정반대예요.","c":"F"},"h":"6eecdd84f1"},{"n":3,"t":"tf","q":"The halo effect can influence your decisions even when you don’t realize it.","ko":"후광효과는 당신이 깨닫지 못할 때도 결정에 영향을 줄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"This exemplifies how the halo effect is unconscious, meaning it influences your decision-making when you don’t realize it.","이것은 어떻게 후광효과가 무의식적으로 작동하는지의 전형적인 예가 되며, 이는 당신이 그것을 깨닫지 못할 때 당신의 의사 결정에 영향을 미친다는 것을 의미한다."]],"w":"13번에서 후광효과는 무의식적이어서 깨닫지 못할 때 의사 결정에 영향을 준다고 했어요.","c":"T"},"h":"61b4405507"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You will probably be inclined to choose the organic granola bar.)","ko":"당신은 아마도 유기농 그래놀라 바를 선택하게 될 것이다.","opts":["~하도록 강요받는","~하는 경향이 있는","~하기를 거부하는","~하는 것을 두려워하는"],"word":"inclined","r":{"a":"2) ~하는 경향이 있는","ev":"3번 문장","s":[[3,"You will probably be inclined to choose the organic granola bar, assuming it’s a better choice.","당신은 아마도 더 좋은 선택이라고 추정하기 때문에 유기농 그래놀라 바를 선택하게 될 것이다."]],"w":"3번에서 유기농이 더 좋은 선택일 거라 추정하며 그쪽을 고르게 된다는 흐름이에요. be inclined to-v = ~하는 경향이 있다.","c":2},"h":"c1b688e172"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...because they graduated from a prestigious university.)","ko":"…그들이 명문 대학을 졸업했기 때문에.","opts":["평범한","낯선","저렴한","명문의"],"word":"prestigious","r":{"a":"4) 명문의","ev":"10번 문장","s":[[10,"For instance, you might believe that your coworker is a respected leader because they graduated from a prestigious university.","예를 들어, 당신은 당신의 동료가 명문 대학을 졸업했기 때문에 존경받는 리더라고 믿을지도 모른다."]],"w":"10번에서 그 대학 졸업 때문에 동료를 존경받는 리더라고 믿는다는 흐름이므로 ‘명문의, 일류의’가 알맞아요.","c":4},"h":"a2e9ce3080"},{"n":6,"t":"ref","q":"What does the underlined \"the other\" refer to?\nYou see two granola bars: one is labeled “organic,” and the other is not.","ko":"밑줄 친 the other이(가) 가리키는 것은?","sko":"당신은 두 개의 그래놀라 바를 보는데, 하나는 ‘유기농’이라고 표시되어 있고, 다른 하나는 그렇지 않다.","opts":["유기농이라고 표시되지 않은 그래놀라 바","유기농이라고 표시된 그래놀라 바","슈퍼마켓의 영양가 있는 음식","당신이 찾고 있는 건강식품"],"r":{"a":"1) 유기농이라고 표시되지 않은 그래놀라 바","ev":"2번 문장","s":[[2,"You see two granola bars: one is labeled “organic,” and the other is not.","당신은 두 개의 그래놀라 바를 보는데, 하나는 ‘유기농’이라고 표시되어 있고, 다른 하나는 그렇지 않다."]],"w":"2번에서 두 개의 그래놀라 바 중 하나(one)는 ‘유기농’이라고 표시되어 있고, 나머지 하나(the other)는 그렇지 않다고 해요.","c":1,"k":"the other = 유기농이라고 표시되지 않은 그래놀라 바"},"pron":"the other","h":"d70ce62e0e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, an impressive college degree doesn’t guarantee good leadership.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 인상적인 대학 학위가 훌륭한 리더십을 보장하는 것은 아니다.","opts":["인상적인 학위가 있으면 반드시 훌륭한 리더가 된다.","훌륭한 리더는 대학에 갈 필요가 없다.","인상적인 학위가 있어도 훌륭한 리더가 된다고 장담할 수는 없다.","대학 학위는 리더십과 아무 관련이 없다."],"r":{"a":"3) 인상적인 학위가 있어도 훌륭한 리더가 된다고 장담할 수는 없다.","ev":"11번 문장","s":[[11,"However, an impressive college degree doesn’t guarantee good leadership.","그러나 인상적인 대학 학위가 훌륭한 리더십을 보장하는 것은 아니다."]],"w":"guarantee는 ‘보장하다’예요. 학위가 리더십을 보장하지는 않는다는 뜻이지, 관련이 전혀 없다거나 대학이 필요 없다는 뜻은 아니에요.","c":3},"h":"4fec3f3d51"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["유기농 그래놀라 바는 다른 그래놀라 바보다 항상 설탕이 적다.","후광효과는 중요한 정보를 무시한 채 빠른 결정을 하게 만드는 인지적 편향이다.","후광효과는 긍정적인 판단에서만 나타난다.","첫인상에 많이 의존할수록 판단이 더 정확해진다."],"opts":["Organic granola bars always contain less sugar than other granola bars.","The halo effect is a cognitive bias that leads to quick decisions while key information is ignored.","The halo effect appears only in positive judgments.","The more you rely on first impressions, the more accurate your judgment becomes."],"r":{"a":"2) The halo effect is a cognitive bias that leads to quick decisions while key information is ignored.","ev":"4, 6~7, 9번 문장","s":[[4,"However, many of these “health foods” still contain excessive amounts of sugar, contradicting your expectations.","그러나 이러한 많은 ‘건강식품’은 여전히 지나치게 많은 양의 설탕을 포함하고 있어 당신의 기대와 모순된다."],[6,"The halo effect is the tendency to make an overall judgment—either positive or negative—based on a single characteristic.","후광효과는 한 가지 특징을 바탕으로 전체적인 판단(긍정적이든 부정적이든)을 내리는 경향이다."],[7,"It is a form of cognitive bias that causes you to make quick decisions while ignoring key information.","이는 당신이 중요한 정보를 무시하는 반면 빠른 결정을 만들도록 하는 인지적 편향의 한 형태이다."],[9,"Relying too much on first impressions can interfere with your judgment.","첫인상에 너무 의존하는 것은 당신의 판단에 방해가 될 수 있다."]],"w":"7번이 정답의 근거예요. 유기농에도 설탕이 많다(4번), 후광효과는 긍정·부정 모두 해당한다(6번), 첫인상 의존은 판단에 방해가 된다(9번)고 했으니 나머지는 틀려요.","c":2},"h":"59bd57823c"},{"n":9,"t":"sum","q":"We should be (A) about judging anything without considering all the (B) information.","ko":"우리는 (B) 모든 정보를 고려하지 않고 무언가를 판단하는 것에 대해 (A) 태도를 가져야 한다.","oko":["(A) 부주의한 / (B) 이용 가능한","(A) 신중한 / (B) 비밀의","(A) 들뜬 / (B) 거짓된","(A) 신중한 / (B) 이용 가능한","(A) 부주의한 / (B) 거짓된"],"opts":["(A) careless / (B) available","(A) cautious / (B) secret","(A) excited / (B) false","(A) cautious / (B) available","(A) careless / (B) false"],"r":{"a":"4) (A) cautious / (B) available (신중한 / 이용 가능한)","ev":"14번 문장","s":[[14,"Therefore, you should be cautious about judging anything without considering all the available information.","따라서, 모든 이용 가능한 정보를 고려하지 않고 무언가를 판단하는 데 주의해야 한다."]],"w":"14번에서 모든 이용 가능한(available) 정보를 고려하지 않고 무언가를 판단하는 데 주의해야(cautious) 한다고 해요.","c":4},"h":"d0b8a8d811"},{"n":10,"t":"fill","q":"However, many of these “health foods” still contain [A] amounts of sugar, [B] your expectations.","ko":"그러나 이러한 많은 ‘건강식품’은 여전히 [A] 양의 설탕을 포함하고 있고, 이것은 당신의 기대와 [B] 것이다.","bank":["excessive","contradicting","organic","prestigious","leader","granola"],"bko":{"excessive":"지나친","contradicting":"모순되는","organic":"유기농의","prestigious":"명문의","leader":"리더","granola":"그래놀라"},"r":{"a":"[A] excessive (지나친), [B] contradicting (모순되는)","ev":"4번 문장","s":[[4,"However, many of these “health foods” still contain excessive amounts of sugar, contradicting your expectations.","그러나 이러한 많은 ‘건강식품’은 여전히 지나치게 많은 양의 설탕을 포함하고 있어 당신의 기대와 모순된다."]],"w":"4번에서 많은 ‘건강식품’이 여전히 지나치게 많은(excessive) 양의 설탕을 포함하고 있어 당신의 기대와 모순된다(contradicting)고 해요.","c":null},"h":"c40a0746eb"}]},{"u":9,"id":"ch2-09-2","no":2,"ko":"꿈을 꾸고 있어요","items":[{"n":1,"t":"tf","q":"During lucid dreams, people can control what happens in their dreams.","ko":"자각몽을 꾸는 동안 사람들은 꿈에서 일어나는 일을 통제할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Not only do we realize that we are dreaming, but we can also control what happens!","우리는 우리가 꿈을 꾸는 중이라는 것을 깨달을 뿐만 아니라, (꿈속에서) 일어나는 일을 통제할 수도 있다!"]],"w":"3번 문장에서 꿈을 꾸는 중임을 깨닫고 일어나는 일을 통제할 수도 있다고 했어요. 이것이 자각몽(4번)이에요.","c":"T"},"h":"a50e1c3a05"},{"n":2,"t":"tf","q":"Ordinary dreams usually stay vivid in our memory for a long time after we wake up.","ko":"일반적인 꿈은 보통 잠에서 깬 뒤에도 오랫동안 기억에 선명하게 남는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Additionally, while ordinary dreams usually fade after waking and stay in our memory for only a short time, lucid dreams often remain vivid and memorable after we have awakened.","게다가, 일반적인 꿈은 보통 잠에서 깬 이후 사라지고 짧은 시간 동안만 기억에 남는 반면, 자각몽은 종종 잠에서 깬 후에도 선명하고 기억에 남는 상태가 된다."]],"w":"7번에서 일반적인 꿈은 깬 뒤 사라지고 짧은 시간만 기억에 남는다고 했어요. 선명하게 남는 쪽은 자각몽이에요.","c":"F"},"h":"963b8d2a70"},{"n":3,"t":"tf","q":"Lucid dreaming may become a habit that people find hard to resist.","ko":"자각몽은 사람들이 저항하기 어려운 습관이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Furthermore, lucid dreaming has the potential to become a habitual behavior, one that people find difficult to resist.","더욱이, 자각몽은 사람들이 저항하기 어렵다고 생각하는 습관적 행동이 될 가능성이 있다."]],"w":"10번에서 자각몽은 사람들이 저항하기 어렵다고 생각하는 습관적 행동이 될 가능성이 있다고 했어요.","c":"T"},"h":"b4e4a55763"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Lucid dreams often remain vivid and memorable after we have awakened.)","ko":"자각몽은 종종 잠에서 깬 후에도 선명하고 기억에 남는다.","opts":["희미한","짧은","선명한","불편한"],"word":"vivid","r":{"a":"3) 선명한","ev":"7번 문장","s":[[7,"Additionally, while ordinary dreams usually fade after waking and stay in our memory for only a short time, lucid dreams often remain vivid and memorable after we have awakened.","게다가, 일반적인 꿈은 보통 잠에서 깬 이후 사라지고 짧은 시간 동안만 기억에 남는 반면, 자각몽은 종종 잠에서 깬 후에도 선명하고 기억에 남는 상태가 된다."]],"w":"7번에서 일반적인 꿈이 깬 뒤 사라지는 것과 대조해, 자각몽은 깬 뒤에도 vivid하고 기억에 남는다고 해요. 그래서 ‘선명한’이 알맞아요.","c":3},"h":"669445a6cf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...a person who is hesitant to attempt something in real life...)","ko":"실제 삶에서 어떤 것을 시도하기 주저하는 사람.","opts":["주저하는","용감한","피곤한","궁금한"],"word":"hesitant","r":{"a":"1) 주저하는","ev":"12번 문장","s":[[12,"Individuals might be able to use them to gain confidence and overcome their fears, so a person who is hesitant to attempt something in real life can confront it first in their dreams!","사람들은 자신감을 얻고 두려움을 극복하기 위해 자각몽을 이용할 수 있을지도 모르고, 그래서 실제 삶에서 어떤 것을 시도하기 주저하는 사람은 꿈에서 그것을 먼저 마주할 수 있다!"]],"w":"12번에서 현실에서는 시도하기 망설이는 사람이 꿈에서 먼저 마주해 볼 수 있다는 흐름이므로 ‘주저하는’이 알맞아요.","c":1},"h":"f068c4c830"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nDreams can be captivating, exciting, or even scary, and most of the time, they occur without conscious control.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"꿈은 매혹적이거나, 흥미롭거나, 심지어 무서울 수도 있고 대부분의 경우, 그것들은 의식적인 통제 없이 일어난다.","opts":["의식적인 통제","꿈","무서운 일들","대부분의 시간"],"r":{"a":"2) 꿈","ev":"1번 문장","s":[[1,"Dreams can be captivating, exciting, or even scary, and most of the time, they occur without conscious control.","꿈은 매혹적이거나, 흥미롭거나, 심지어 무서울 수도 있고 대부분의 경우, 그것들은 의식적인 통제 없이 일어난다."]],"w":"1번에서 Dreams(꿈)가 매혹적이거나 흥미롭거나 무서울 수 있고, 대부분 그것들(they)은 의식적인 통제 없이 일어난다고 해요.","c":2,"k":"they = 꿈"},"pron":"they","h":"320c3a392a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In this heightened state of consciousness, we can navigate our dream environment, as if completely awake.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 높아진 의식 상태에서 우리는 마치 완전히 깨어 있는 것처럼 꿈속 환경을 탐색할 수 있다.","opts":["꿈에서 깨어나 현실 세계를 돌아다닐 수 있다.","의식이 높아진 상태에서는 마치 완전히 깨어 있는 것처럼 꿈속 환경을 탐색할 수 있다.","완전히 깨어 있는 사람만 꿈을 탐색할 수 있다.","의식이 낮아진 상태에서는 꿈속 환경이 저절로 바뀐다."],"r":{"a":"2) 의식이 높아진 상태에서는 마치 완전히 깨어 있는 것처럼 꿈속 환경을 탐색할 수 있다.","ev":"6번 문장","s":[[6,"In this heightened state of consciousness, we can navigate our dream environment, as if completely awake.","이러한 높아진 의식 상태에서 우리는 마치 완전히 깨어 있는 것처럼 꿈속 환경을 탐색할 수 있다."]],"w":"heightened는 ‘높아진’, navigate는 ‘탐색하다’, as if completely awake는 ‘마치 완전히 깨어 있는 것처럼’이에요. 실제로 깨어난다는 뜻이 아니에요.","c":2},"h":"e3baeaf976"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["자각몽은 정상적인 수면 주기를 개선해 더 나은 휴식을 준다.","일반적인 꿈에서는 뇌가 깨어 있을 때와 관련된 활동을 보인다.","어떤 사람들은 자각몽이 개인의 성장으로 이어질 수 있다고 믿는다.","자각몽을 꾸는 사람은 꿈에서 일어나는 일을 전혀 통제하지 못한다."],"opts":["Lucid dreams improve normal sleep cycles and give us better rest.","During ordinary dreams, the brain shows activity associated with being awake.","Some people believe that lucid dreams can lead to personal development.","People having lucid dreams can never control what happens in them."],"r":{"a":"3) Some people believe that lucid dreams can lead to personal development. (어떤 사람들은 자각몽이 개인의 성장으로 이어질 수 있다고 믿는다.)","ev":"11번 문장","s":[[11,"There are those who believe that lucid dreams are more than just an interesting experience and say that these dreams can lead to personal development.","자각몽이 단순히 흥미로운 경험 그 이상이라고 믿고 이런 꿈이 개인의 성장으로 이어질 수 있다고 말하는 사람들이 있다."]],"w":"11번에서 자각몽이 단순히 흥미로운 경험 그 이상이라고 믿고 개인의 성장으로 이어질 수 있다고 말하는 사람들이 있다고 해요.","c":3},"h":"e7bb375a4d"},{"n":9,"t":"sum","q":"Lucid dreams can be (A) because they (B) normal sleep cycles.","ko":"자각몽은 정상적인 수면 주기를 (B) 때문에 (A) 수 있다.","oko":["(A) 편안하게 하는 / (B) 방해하다","(A) 기진맥진하게 만드는 / (B) 개선하다","(A) 기진맥진하게 만드는 / (B) 방해하다","(A) 편안하게 하는 / (B) 개선하다","(A) 흥미진진한 / (B) 보호하다"],"opts":["(A) relaxing / (B) disrupt","(A) exhausting / (B) improve","(A) exhausting / (B) disrupt","(A) relaxing / (B) improve","(A) exciting / (B) protect"],"r":{"a":"3) (A) exhausting / (B) disrupt (기진맥진하게 만드는 / 방해하다)","ev":"9번 문장","s":[[9,"First, they can be exhausting, as they disrupt normal sleep cycles, preventing us from getting adequate rest.","첫째, 자각몽은 정상적인 수면 주기를 방해하기 때문에 기진맥진하게 만들 수 있고, 충분한 휴식을 취하는 것을 막는다."]],"w":"9번에서 자각몽은 정상적인 수면 주기를 방해해서(disrupt) 기진맥진하게 만들(exhausting) 수 있다고 해요.","c":3},"h":"c1fc5a8f2d"},{"n":10,"t":"fill","q":"In typical dreams, [A] is generally [B], whereas during lucid dreams, the brain seems to show activity associated with being awake.","ko":"일반적인 꿈에서는 [A]이(가) 대체로 [B] 상태인 반면, 자각몽을 꾸는 동안에는 뇌가 깨어 있을 때와 관련된 활동을 보여 주는 것처럼 보인다.","bank":["self-awareness","absent","vivid","memorable","adequate","extraordinary"],"bko":{"self-awareness":"자기 인식","absent":"없는, 부재한","vivid":"선명한","memorable":"기억에 남는","adequate":"충분한","extraordinary":"특별한"},"r":{"a":"[A] self-awareness (자기 인식), [B] absent (없는, 부재한)","ev":"5번 문장","s":[[5,"In typical dreams, self-awareness is generally absent, whereas during lucid dreams, the brain seems to show activity associated with being awake.","일반적인 꿈에서는 대체로 자기 인식이 없는 반면, 자각몽을 꾸는 동안에는 뇌가 깨어 있을 때와 관련된 활동을 보여주는 것처럼 보인다."]],"w":"5번에서 일반적인 꿈에서는 자기 인식(self-awareness)이 대체로 없다(absent)고 해요. 자각몽에서는 뇌가 깨어 있을 때와 관련된 활동을 보인다는 점과 대비돼요.","c":null},"h":"42e7b4ab09"}]},{"u":9,"id":"ch2-09-3","no":3,"ko":"메기가 나타나면","items":[{"n":1,"t":"tf","q":"The sardines kept swimming around to avoid the catfish.","ko":"정어리들은 메기를 피하려고 계속 헤엄쳐 다녔다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"To avoid this predator, they were forced to keep swimming around, and this constant movement kept them alive longer.","이 포식자를 피하기 위해, 정어리들은 계속해서 주위를 헤엄쳐야 했고, 이 끊임없는 움직임이 정어리들을 더 오래 살아 있게 했다."]],"w":"4번에서 이 포식자를 피하려고 계속 헤엄쳐야 했고, 그 움직임이 정어리를 더 오래 살게 했다고 해요.","c":"T"},"h":"27a2cc3690"},{"n":2,"t":"tf","q":"The catfish effect can be applied only to the fishing industry.","ko":"메기 효과는 어업에만 적용될 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"This phenomenon, called the catfish effect can be applied to situations in various fields.","‘메기 효과’라고 불리는 이러한 현상은 여러 분야의 상황에 적용될 수 있다."]],"w":"5번에서 메기 효과는 여러 분야의 상황에 적용될 수 있다고 했어요. 어업에만 적용된다는 말은 틀려요.","c":"F"},"h":"279097e8e5"},{"n":3,"t":"tf","q":"Bringing a new, talented player onto a team can improve the other players’ performance.","ko":"새로운 유능한 선수를 팀에 영입하면 다른 선수들의 경기력이 향상될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In sports, for example, coaches understand that bringing a new, talented player onto a team enhances the performance of the other players.","예를 들어, 스포츠에서는 감독들이 새로운 유능한 선수를 팀에 영입하는 것은 다른 선수들의 경기력을 향상시킨다는 것을 안다."]],"w":"6번에서 감독들은 새로운 유능한 선수를 영입하면 다른 선수들의 경기력이 향상된다는 것을 안다고 했어요.","c":"T"},"h":"9e1a7a0e5f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...this constant movement kept them alive longer.)","ko":"이 끊임없는 움직임이 정어리들을 더 오래 살아 있게 했다.","opts":["짧은","끊임없는","느린","불규칙한"],"word":"constant","r":{"a":"2) 끊임없는","ev":"4번 문장","s":[[4,"To avoid this predator, they were forced to keep swimming around, and this constant movement kept them alive longer.","이 포식자를 피하기 위해, 정어리들은 계속해서 주위를 헤엄쳐야 했고, 이 끊임없는 움직임이 정어리들을 더 오래 살아 있게 했다."]],"w":"메기를 피하려고 계속 헤엄쳐 다녔으므로(keep swimming) 그 움직임은 ‘끊임없는’ 것이에요.","c":2},"h":"b6c018ddb8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...pressures other companies to become more adaptable to survive...)","ko":"살아남기 위해 더 적응할 수 있도록 다른 기업들을 압박한다.","opts":["고정된","약한","비싼","적응할 수 있는"],"word":"adaptable","r":{"a":"4) 적응할 수 있는","ev":"10번 문장","s":[[10,"The entering of strong competitors in the market pressures other companies to become more adaptable to survive, causing the entire economy to become stronger.","시장으로의 강력한 경쟁자의 진입은 살아남기 위해 더 적응할 수 있도록 다른 기업들을 압박하고, 전체 경제를 더 강해지게 만든다."]],"w":"10번에서 경쟁자가 들어오면 기업들은 살아남기 위해 변화에 맞춰 바뀌어야 하므로 ‘적응할 수 있는’이 알맞아요.","c":4},"h":"2e3aa48217"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nThis happens because players start playing harder to avoid losing their position on the team.","ko":"밑줄 친 their이(가) 가리키는 것은?","sko":"이는 선수들이 팀 내에서 자신의 자리를 잃지 않기 위해 더 열심히 경기하게 되기 때문에 발생한다.","opts":["선수들","감독들","기업들","정어리들"],"r":{"a":"1) 선수들","ev":"7번 문장","s":[[7,"This happens because players start playing harder to avoid losing their position on the team.","이는 선수들이 팀 내에서 자신의 자리를 잃지 않기 위해 더 열심히 경기하게 되기 때문에 발생한다."]],"w":"7번에서 players(선수들)가 자신들(their)의 팀 내 자리를 잃지 않으려고 더 열심히 경기한다고 해요.","c":1,"k":"their = 선수들"},"pron":"their","h":"c35044f793"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Similarly, businesses utilize this effect to motivate their employees.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비슷하게, 기업들도 직원들에게 동기를 부여하기 위해 이 효과를 활용한다.","opts":["기업들은 직원 수를 줄이려고 이 효과를 이용한다.","기업들은 이 효과를 막으려고 직원들을 훈련시킨다.","기업들은 직원들이 경쟁하지 못하게 하려고 이 효과를 이용한다.","기업들도 직원들에게 동기를 부여하려고 이 효과를 활용한다."],"r":{"a":"4) 기업들도 직원들에게 동기를 부여하려고 이 효과를 활용한다.","ev":"8번 문장","s":[[8,"Similarly, businesses utilize this effect to motivate their employees.","비슷하게, 기업들도 직원들에게 동기를 부여하기 위해 이 효과를 활용한다."]],"w":"utilize는 ‘활용하다’, motivate는 ‘동기를 부여하다’예요. to motivate their employees는 ‘직원들에게 동기를 부여하기 위해’라는 목적이에요.","c":4},"h":"93fcbf2179"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["살아 있는 정어리는 죽은 정어리보다 더 낮은 가격에 팔렸다.","어부는 잡은 정어리 통마다 메기를 한 마리씩 넣었다.","감독들은 새 선수를 영입하면 팀 경기력이 떨어진다고 안다.","강력한 경쟁자의 진입은 경제 전체를 더 약하게 만든다."],"opts":["Live sardines were sold at a lower price than dead ones.","The fisherman put a catfish into each container of captured sardines.","Coaches know that a new talented player lowers the team’s performance.","The entering of strong competitors makes the entire economy weaker."],"r":{"a":"2) The fisherman put a catfish into each container of captured sardines.","ev":"1, 3, 6, 10번 문장","s":[[1,"Sardine fishermen encountered a dilemma: sardines were dying quickly after being caught, but live sardines could be sold at a higher price.","정어리 어부들은 딜레마에 직면했다: 정어리들이 잡힌 후에 빠르게 죽어버렸는데, 살아 있는 정어리가 더 높은 가격에 팔릴 수 있는 것이었다."],[3,"He introduced a catfish into each container of captured sardines.","그는 각각의 잡힌 정어리 통에 메기 한 마리를 넣었다."],[6,"In sports, for example, coaches understand that bringing a new, talented player onto a team enhances the performance of the other players.","예를 들어, 스포츠에서는 감독들이 새로운 유능한 선수를 팀에 영입하는 것은 다른 선수들의 경기력을 향상시킨다는 것을 안다."],[10,"The entering of strong competitors in the market pressures other companies to become more adaptable to survive, causing the entire economy to become stronger.","시장으로의 강력한 경쟁자의 진입은 살아남기 위해 더 적응할 수 있도록 다른 기업들을 압박하고, 전체 경제를 더 강해지게 만든다."]],"w":"3번이 정답의 근거예요. 살아 있는 정어리가 더 높은 가격에 팔렸고(1번), 새 선수는 경기력을 높이며(6번), 강력한 경쟁자는 경제를 더 강하게 만들어요(10번).","c":2},"h":"542a746f26"},{"n":9,"t":"sum","q":"In economics, the effect explains how companies can (A) creativity and (B).","ko":"경제학에서 이 효과는 기업들이 창의성과 (B)을(를) 어떻게 (A) 수 있는지 설명한다.","oko":["(A) 파괴하다 / (B) 혁신","(A) 촉진하다 / (B) 실패","(A) 무시하다 / (B) 오염","(A) 촉진하다 / (B) 혁신","(A) 파괴하다 / (B) 실패"],"opts":["(A) destroy / (B) innovation","(A) foster / (B) failure","(A) ignore / (B) pollution","(A) foster / (B) innovation","(A) destroy / (B) failure"],"r":{"a":"4) (A) foster / (B) innovation (촉진하다 / 혁신)","ev":"9번 문장","s":[[9,"In economics, the effect explains how companies can foster creativity and innovation.","경제학에서는, 이 효과가 기업들이 어떻게 창의성과 혁신을 촉진할 수 있는지를 설명한다."]],"w":"9번에서 경제학에서는 이 효과가 기업들이 어떻게 창의성과 혁신(innovation)을 촉진할(foster) 수 있는지를 설명한다고 해요.","c":4},"h":"ec4968d263"},{"n":10,"t":"fill","q":"Sardine fishermen encountered a [A]: sardines were dying [B] after being caught, but live sardines could be sold at a higher price.","ko":"정어리 어부들은 [A]에 직면했다. 정어리들은 잡힌 후에 [B] 죽어 갔지만, 살아 있는 정어리는 더 높은 가격에 팔릴 수 있었다.","bank":["dilemma","quickly","adaptable","constant","higher","caught"],"bko":{"dilemma":"딜레마, 곤경","quickly":"빠르게","adaptable":"적응할 수 있는","constant":"끊임없는","higher":"더 높은","caught":"잡힌(catch의 과거분사)"},"r":{"a":"[A] dilemma (딜레마, 곤경), [B] quickly (빠르게)","ev":"1번 문장","s":[[1,"Sardine fishermen encountered a dilemma: sardines were dying quickly after being caught, but live sardines could be sold at a higher price.","정어리 어부들은 딜레마에 직면했다: 정어리들이 잡힌 후에 빠르게 죽어버렸는데, 살아 있는 정어리가 더 높은 가격에 팔릴 수 있는 것이었다."]],"w":"1번에서 정어리 어부들은 딜레마(dilemma)에 직면했어요. 정어리들이 잡힌 후에 빠르게(quickly) 죽었지만, 살아 있는 정어리는 더 높은 가격에 팔릴 수 있었기 때문이에요.","c":null},"h":"92e41be392"}]},{"u":9,"id":"ch2-09-4","no":4,"ko":"수능:ON 함의 추론","items":[{"n":1,"t":"tf","q":"Shakespeare compared the world to a stage and people to players.","ko":"셰익스피어는 세상을 무대에, 사람들을 배우에 비유했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The most famous quote expressing this comes from Shakespeare: “All the world’s a stage, And all the men and women merely players; They have their exits and their entrances, And one man in his time plays many parts.”","이것을 표현하는 가장 유명한 명언은 셰익스피어에게서 비롯된다. “모든 세상은 연극 무대이고, 모든 남성과 여성은 단지 배우일 뿐이다. 그들은 그들의 출구와 그들의 입구를 가진다. 그리고 일생동안 한 인간은 다양한 역할을 연기한다.”"]],"w":"2번 인용문에 All the world’s a stage, And all the men and women merely players가 나와요.","c":"T"},"h":"2c21f10edc"},{"n":2,"t":"tf","q":"Iago in Othello shows his hostile intentions openly to others.","ko":"<오셀로>의 이아고는 자신의 적대적 의도를 다른 사람들에게 공개적으로 드러낸다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Evil types such as Iago in the play Othello are able to conceal their hostile intentions behind a friendly smile.","연극 <오셀로> 속 이아고와 같은 악역들은 그들의 적대적 의도를 친근한 미소 뒤에 숨길 수 있다."]],"w":"5번에서 이아고 같은 악역은 적대적인 의도를 친근한 미소 뒤에 숨긴다고 했어요. 공개적으로 드러낸다는 말은 정반대예요.","c":"F"},"h":"8cbcc93a5f"},{"n":3,"t":"tf","q":"Writers and thinkers have never noticed any theatrical quality in social life.","ko":"작가와 사상가들은 사회적 삶의 연극적 속성을 전혀 알아차리지 못했다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Over the centuries, various writers and thinkers, looking at humans from an outside perspective, have been struck by the theatrical quality of social life.","수 세기에 걸쳐 다양한 작가와 사상가들은 외부의 관점에서 인간들을 바라보며 사회적 삶의 연극적 속성과 마주해왔다."]],"w":"1번에서 수 세기에 걸쳐 다양한 작가와 사상가들이 사회적 삶의 연극적 속성과 마주해 왔다고 했어요.","c":"F"},"h":"ca45f85eab"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...are able to conceal their hostile intentions behind a friendly smile.)","ko":"악역들은 그들의 적대적 의도를 친근한 미소 뒤에 숨길 수 있다.","opts":["드러내다","숨기다","바꾸다","돕다"],"word":"conceal","r":{"a":"2) 숨기다","ev":"5번 문장","s":[[5,"Evil types such as Iago in the play Othello are able to conceal their hostile intentions behind a friendly smile.","연극 <오셀로> 속 이아고와 같은 악역들은 그들의 적대적 의도를 친근한 미소 뒤에 숨길 수 있다."]],"w":"친근한 미소 ‘뒤에’ 적대적 의도가 있다는 흐름이므로 conceal은 ‘숨기다’예요.","c":2},"h":"050190c8c9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (People with excellent acting skills can better navigate our complex social environments...)","ko":"훌륭한 연기력을 지닌 사람들은 복잡한 사회적 환경을 더 잘 헤쳐 나갈 수 있다.","opts":["무시하다","설명하다","피하다","헤쳐 나가다"],"word":"navigate","r":{"a":"4) 헤쳐 나가다","ev":"7번 문장","s":[[7,"People with excellent acting skills can better navigate our complex social environments and get ahead.","훌륭한 연기력을 지닌 사람들은 우리의 복잡한 사회적 환경을 더 잘 헤쳐 나갈 수 있고 앞서갈 수 있다."]],"w":"복잡한 사회적 환경 속에서 길을 찾아 앞서간다는 흐름(and get ahead)이므로 ‘헤쳐 나가다’가 알맞아요.","c":4},"h":"7cedf41ba3"},{"n":6,"t":"ref","q":"What does the underlined \"our\" refer to?\nPeople with excellent acting skills can better navigate our complex social environments and get ahead.","ko":"밑줄 친 our이(가) 가리키는 것은?","sko":"훌륭한 연기력을 지닌 사람들은 우리의 복잡한 사회적 환경을 더 잘 헤쳐 나갈 수 있고 앞서갈 수 있다.","opts":["글쓴이와 독자를 포함한 우리 모두","셰익스피어와 작가들","이아고 같은 악역들","연기력이 뛰어난 사람들"],"r":{"a":"1) 글쓴이와 독자를 포함한 우리 모두","ev":"7번 문장","s":[[7,"People with excellent acting skills can better navigate our complex social environments and get ahead.","훌륭한 연기력을 지닌 사람들은 우리의 복잡한 사회적 환경을 더 잘 헤쳐 나갈 수 있고 앞서갈 수 있다."]],"w":"7번의 our complex social environments는 글쓴이와 독자를 포함한 우리 모두(사람들)가 살아가는 복잡한 사회적 환경을 뜻해요.","c":1,"k":"our = 글쓴이와 독자를 포함한 우리 모두"},"pron":"our","h":"e2100d44c6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If the theater and actors were traditionally represented by the image of masks, writers such as Shakespeare are implying that all of us are constantly wearing masks.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 연극과 배우들이 전통적으로 가면의 이미지에 의해 표현된다면, 셰익스피어와 같은 작가들은 우리 모두는 끊임없이 가면을 쓰고 있다는 것을 암시하고 있는 것이다.","opts":["연극과 배우가 가면으로 표현된다면, 셰익스피어 같은 작가들은 우리 모두가 늘 가면을 쓰고 있다고 암시한다.","셰익스피어는 배우들이 실제로 가면을 쓰고 연기해야 한다고 주장한다.","셰익스피어 같은 작가들은 가면을 쓰지 않는 사람이 가장 훌륭한 배우라고 말한다.","연극에서 가면이 사라졌기 때문에 우리는 더 이상 가면을 쓰지 않는다."],"r":{"a":"1) 연극과 배우가 가면으로 표현된다면, 셰익스피어 같은 작가들은 우리 모두가 늘 가면을 쓰고 있다고 암시한다.","ev":"3번 문장","s":[[3,"If the theater and actors were traditionally represented by the image of masks, writers such as Shakespeare are implying that all of us are constantly wearing masks.","만약 연극과 배우들이 전통적으로 가면의 이미지에 의해 표현된다면, 셰익스피어와 같은 작가들은 우리 모두는 끊임없이 가면을 쓰고 있다는 것을 암시하고 있는 것이다."]],"w":"If 절이 조건이고, implying 뒤가 작가들이 암시하는 내용이에요. 가면은 연기의 비유이며, 무대 위 가면에 관한 주장이 아니에요.","c":1},"h":"de859c6294"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["모든 사람은 연기하는 능력이 똑같다.","이아고 같은 악역은 자신의 의도를 숨기지 못한다.","셰익스피어의 인용문은 널리 알려지지 않았다.","어떤 사람들은 다른 사람들보다 연기를 더 잘한다."],"opts":["Everyone is equally good at acting.","Evil types such as Iago are unable to conceal their intentions.","Shakespeare’s quote is not widely known.","Some people are better at acting than others."],"r":{"a":"4) Some people are better at acting than
