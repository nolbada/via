": "But she didn't. \"That was close!\" she thought.", "ko": "하지만 그녀는 그러지 않았다. '아슬아슬했어!'라고 그녀는 생각했다.", "ok": true, "foot": [], "fixes": []}, {"n": 11, "tag": null, "en": "She almost made a mistakes. Because of this, she began to feel nervously.", "ko": "그녀는 거의 실수할 뻔했다. 이것 때문에, 그녀는 불안을 느끼기 시작했다.", "ok": false, "foot": [], "fixes": [{"wrong": "mistakes", "right": "mistake", "partial": false, "at": [4], "point": "명사의 단수형: a 뒤에는 단수명사 mistake 사용", "topic": "명사의 단수형", "memo": "a 뒤에는 단수명사 mistake 사용"}, {"wrong": "nervously", "right": "nervous", "partial": false, "at": [12], "point": "형용사와 부사: feel 뒤 보어 자리에는 형용사 nervous 사용", "topic": "형용사와 부사", "memo": "feel 뒤 보어 자리에는 형용사 nervous 사용"}]}, {"n": 12, "tag": null, "en": "It was time to the talent show. The school gym was full in people.", "ko": "장기 자랑 시간이 되었다. 학교 체육관은 사람들로 가득 찼다.", "ok": false, "foot": [], "fixes": [{"wrong": "to", "right": "for", "partial": false, "at": [3], "point": "기본전치사: '~할 시간(행사)'은 time for the talent show", "topic": "기본전치사", "memo": "'~할 시간(행사)'은 time for the talent show"}, {"wrong": "in", "right": "of", "partial": false, "at": [12], "point": "관용 표현 be full of: '~로 가득 찬'은 full of 사용", "topic": "관용 표현 be full of", "memo": "'~로 가득 찬'은 full of 사용"}]}, {"n": 13, "tag": null, "en": "They said, \"Look! That's Perfect Girl!\"", "ko": "그들은 \"저기 봐! 저기 완벽한 소녀야!\"라고 말했다.", "ok": true, "foot": [], "fixes": []}, {"n": 14, "tag": null, "en": "Beatrice had butterflies in she stomach. \"Will I mess up?", "ko": "Beatrice는 마음이 편치 않았다. '내가 망칠까?", "ok": false, "foot": [], "fixes": [{"wrong": "she", "right": "her", "partial": false, "at": [4], "point": "인칭대명사의 소유격: stomach 앞에는 소유격 her 사용", "topic": "인칭대명사의 소유격", "memo": "stomach 앞에는 소유격 her 사용"}]}, {"n": 15, "tag": null, "en": "I'm worried,\" she thought.", "ko": "난 걱정돼.'라고 그녀는 생각했다.", "ok": true, "foot": [], "fixes": []}, {"n": 16, "tag": null, "en": "Beatrice throwed an egg into the air. Next, she added a salt shaker.", "ko": "Beatrice는 공중으로 달걀을 던졌다. 다음으로, 그녀는 소금 통을 추가했다. ];var RNUM=71;var TITLE_EN="The Story of a Perfect Girl";var PASS_EN=["The Story of a Perfect Girl", "For Beatrice, Friday began like any other day. She wore the same white socks on both of her feet. Then she made a sandwich. She put exactly the same amount of peanut butter on each piece of bread.", "On her way to school, her neighbor said, \"Good morning, Perfect Girl.\" People called Beatrice \"Perfect Girl\" because she never made mistakes. \"Are you ready for tonight's talent show?\" her neighbor asked. Beatrice just smiled. She was a juggling champion. She won the talent show every year. How wonderful she was!", "At school, Beatrice had a cooking class. To make a cake, she carefully took some eggs out of the refrigerator. When she turned around, she stepped on something slippery. She was about to fall! But she didn't. \"That was close!\" she thought. She almost made a mistake. Because of this, she began to feel nervous.", "It was time for the talent show. The school gym was full of people. They said, \"Look! That's Perfect Girl!\" Beatrice had butterflies in her stomach. \"Will I mess up? I'm worried,\" she thought.", "Beatrice threw an egg into the air. Next, she added a salt shaker. Finally, she added a water balloon. What a good start! But then she felt something strange… Uh-oh! Beatrice's nose started to itch. The salt shaker was full of… pepper! \"ACHOO!\" Beatrice missed the water balloon, and it fell to the floor. Then… OOPS! The egg broke on top of her head.", "For the first time ever, Beatrice made a mistake. What a surprise! She thought, \"What should I do? Cry? Run off the stage?\" Suddenly, she began to laugh loudly. The people looked at each other. Then everyone started to laugh together.", "That night, Beatrice had a deep sleep. The next morning, she woke up with a smile. She put a white sock on her left foot… and a green sock on her right foot!", "Now, people no longer call her \"Perfect Girl.\" They just call her Beatrice."];var PASS_KO=["어느 완벽한 소녀의 이야기", "Beatrice에게 금요일은 어느 다른 날처럼 시작되었다. 그녀는 그녀의 양쪽 발에 똑같은 흰 양말을 신었다. 그러고 나서 그녀는 샌드위치를 만들었다. 그녀는 각 빵 조각에 정확히 같은 양의 땅콩버터를 발랐다.", "학교에 가는 길에, 그녀의 이웃이 \"좋은 아침이야, 완벽한 소녀.\"라고 말했다. Beatrice는 한 번도 실수를 하지 않았기 때문에 사람들은 그녀를 '완벽한 소녀'라고 불렀다. \"오늘 밤 장기 자랑 준비됐니?\"라고 그녀의 이웃이 물었다. Beatrice는 그저 미소를 지었다. 그녀는 저글링 챔피언이었다. 그녀는 매년 장기 자랑에서 우승했다. 그녀는 참 멋졌다!", "학교에서 Beatrice는 요리 수업을 들었다. 케이크를 만들기 위해, 그녀는 조심스럽게 냉장고에서 달걀 몇 개를 꺼냈다. 그녀가 뒤돌아보았을 때, 그녀는 미끄러운 무언가를 밟았다. 그녀는 막 넘어지려고 했다! 하지만 그녀는 그러지 않았다. '아슬아슬했어!'라고 그녀는 생각했다. 그녀는 거의 실수할 뻔했다. 이것 때문에, 그녀는 불안을 느끼기 시작했다.", "장기 자랑 시간이 되었다. 학교 체육관은 사람들로 가득 찼다. 그들은 \"저기 봐! 저기 완벽한 소녀야!\"라고 말했다. Beatrice는 마음이 편치 않았다. '내가 망칠까? 난 걱정돼.'라고 그녀는 생각했다.", "Beatrice는 공중으로 달걀을 던졌다. 다음으로, 그녀는 소금 통을 추가했다. 마지막으로, 그녀는 물풍선을 추가했다. 참 좋은 시작이었다! 하지만 그다음에 그녀는 무언가 이상함을 느꼈다… 이런! Beatrice의 코가 간지럽기 시작했다. 그 소금 통은 가득 차 있었다… 후추로! \"에취!\" Beatrice는 물풍선을 놓쳤고, 그것은 바닥으로 떨어졌다. 그러고 나서… 어이쿠! 달걀이 그녀의 머리 위에서 깨졌다.", "난생처음으로, Beatrice는 실수를 했다. 정말 놀라운 일이었다! 그녀는 '내가 무엇을 해야 하지? 울까? 무대에서 도망칠까?'라고 생각했다. 갑자기, 그녀는 큰 소리로 웃기 시작했다. 사람들은 서로를 바라보았다. 그러더니 모두 함께 웃기 시작했다.", "그날 밤, Beatrice는 깊은 잠을 잤다. 다음 날 아침, 그녀는 미소를 지으며 일어났다. 그녀는 왼발에 흰 양말을 신었다… 그리고 오른발에는 초록색 양말을 신었다!", "이제, 사람들은 더 이상 그녀를 '완벽한 소녀'라고 부르지 않는다. 그들은 그녀를 그저 Beatrice라고 부른다."];
var BG=[{"qs": [{"n": 6, "q": "윗글의 내용과 일치하는 것은?", "o": ["Beatrice에게 금요일은 여느 다른 날들과 달랐다.", "Beatrice는 땅콩버터가 들어간 햄버거를 만들었다.", "Beatrice는 이웃들이 자신을 '완벽한 소녀'라고 불러 주기를 바랐다.", "Beatrice는 실수를 한 번도 하지 않은 저글링 챔피언이었다.", "Beatrice는 올해 장기 자랑에는 참여하지 않을 것이다."], "a": 3, "ans": "Beatrice는 실수를 한 번도 하지 않은 저글링 챔피언이었다.", "evs": [["People called Beatrice \"Perfect Girl\" because she never made mistakes.", "Beatrice는 한 번도 실수를 하지 않았기 때문에 사람들은 그녀를 '완벽한 소녀'라고 불렀다."], ["She was a juggling champion.", "그녀는 저글링 챔피언이었다."]], "ev": ["People called Beatrice \"Perfect Girl\" because she never made mistakes.", "Beatrice는 한 번도 실수를 하지 않았기 때문에 사람들은 그녀를 '완벽한 소녀'라고 불렀다."], "ow": ["오답 ✕ — 본문에는 \"For Beatrice, Friday began like any other day.\"(Beatrice에게 금요일은 어느 다른 날처럼 시작되었다.)라고 했는데 이 보기는 다른 날들과 달랐다고 해서 틀림.", "오답 ✕ — 본문에는 \"Then she made a sandwich.\"(그러고 나서 그녀는 샌드위치를 만들었다.)라고 했는데 이 보기는 땅콩버터가 들어간 햄버거라고 해서 틀림. 땅콩버터는 샌드위치에 발랐다.", "오답 ✕ — 이웃이 \"Good morning, Perfect Girl.\"이라고 부른 것은 있지만, Beatrice가 그렇게 불러 주기를 '바랐다'는 말은 본문에 없어서 틀림.", "정답 ○ — \"People called Beatrice 'Perfect Girl' because she never made mistakes.\"(그녀는 한 번도 실수를 하지 않았기 때문에 '완벽한 소녀'라고 불렸다.)와 \"She was a juggling champion.\"(그녀는 저글링 챔피언이었다.)에 맞음.", "오답 ✕ — 이웃이 \"Are you ready for tonight's talent show?\"(오늘 밤 장기 자랑 준비됐니?)라고 묻자 Beatrice는 미소를 지었고 \"She won the talent show every year.\"(그녀는 매년 장기 자랑에서 우승했다.)이므로 올해도 참여하는 것이라서 틀림."], "memo": ["정답 ④: Beatrice는 실수를 한 번도 하지 않은 저글링 챔피언이었다.", "근거: she never made mistakes / She was a juggling champion.(한 번도 실수하지 않았다 / 저글링 챔피언이었다)", "함정: ① 금요일은 'like any other day', 즉 다른 날과 같게 시작했다 ✕"], "why": "Beatrice는 한 번도 실수하지 않아 '완벽한 소녀'로 불리는 저글링 챔피언이다.", "ko": ["Beatrice에게 금요일은 여느 다른 날들과 달랐다.", "Beatrice는 땅콩버터가 들어간 햄버거를 만들었다.", "Beatrice는 이웃들이 자신을 '완벽한 소녀'라고 불러 주기를 바랐다.", "Beatrice는 실수를 한 번도 하지 않은 저글링 챔피언이었다.", "Beatrice는 올해 장기 자랑에는 참여하지 않을 것이다."]}, {"n": 7, "q": "윗글의 제목으로 알맞은 것은?", "o": ["Beatrice Introduces Herself", "What Makes Beatrice Perfect", "The Secret to Being a Juggling Champion", "Beatrice's Hidden Efforts f
