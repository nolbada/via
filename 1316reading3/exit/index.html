t(만나다)예요.","c":1},"h":"3bb0c6cb57"},{"n":10,"t":"fill","q":"I like that your show is [A] from [B] music shows.","ko":"저는 당신의 프로그램이 [B] 음악 프로그램과 [A] 점이 좋아요.","bank":["different","other","grow","talk","watch","sing"],"bko":{"different":"다른, 서로 다른","other":"그 밖의, 다른","grow":"자라다","talk":"이야기하다","watch":"시청하다","sing":"노래하다"},"r":{"a":"[A] different (다른, 서로 다른), [B] other (그 밖의, 다른)","ev":"4번 문장","s":[[4,"I like that your show is different from other music shows.","저는 당신의 프로그램이 다른 음악 프로그램과 다르다는 점이 좋아요."]],"w":"4번 문장은 “당신의 프로그램이 다른 음악 프로그램과 다르다는 점이 좋다”는 뜻이에요. is different from ~은 “~와 다르다”이고, other music shows는 “다른 음악 프로그램들”이에요.","c":null},"h":"6b006c3531"}]},{"u":6,"id":"nl3-06-2","no":2,"ko":"맛있는 오케스트라 연주","items":[{"n":1,"t":"tf","q":"The orchestra makes music with fresh vegetables.","ko":"이 오케스트라는 신선한 채소로 음악을 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The orchestra makes music with fresh vegetables.","이 오케스트라는 신선한 채소로 음악을 만든다."]],"w":"3번 문장에서 오케스트라는 신선한 채소(fresh vegetables)로 음악을 만든다고 해요.","c":"T"},"h":"26267fd7dd"},{"n":2,"t":"tf","q":"They make bass drums out of carrots and recorders out of pumpkins.","ko":"그들은 당근으로 베이스 드럼을 만들고 호박으로 리코더를 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"For example, they make bass drums out of pumpkins and recorders out of carrots.","예를 들어, 그들은 호박으로 베이스 드럼을 만들고, 당근으로 리코더를 만든다."]],"w":"5번 문장에서 호박(pumpkins)으로 베이스 드럼을, 당근(carrots)으로 리코더를 만든다고 해요. 재료가 서로 바뀌었어요.","c":"F"},"h":"0dc770c185"},{"n":3,"t":"tf","q":"New sounds come from the edible instruments.","ko":"새로운 소리가 먹을 수 있는 악기에서 나온다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"New sounds come from these edible instruments.","이러한 먹을 수 있는 악기로부터 새로운 소리가 나온다."]],"w":"6번 문장에서 이러한 먹을 수 있는 악기에서 새로운 소리가 나온다고 해요.","c":"T"},"h":"9ae7f9a900"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They use drills and knives to make vegetables into extraordinary instruments.)","ko":"그들은 채소를 ( ? ) 악기로 만들기 위해 드릴과 칼을 사용한다. (extraordinary의 뜻은?)","word":"extraordinary","opts":["평범한","색다른, 놀라운","오래된","값싼"],"r":{"a":"2) 색다른, 놀라운","ev":"4번 문장","s":[[4,"They use drills and knives to make vegetables into extraordinary instruments.","그들은 채소를 색다른 악기로 만들기 위해 드릴과 칼을 사용한다."]],"w":"4번 문장은 채소를 드릴과 칼로 악기로 바꾼다는 내용이고, 5번에서 호박 드럼, 당근 리코더 같은 예가 나와요. 평범하지 않은 색다른 악기라는 뜻이에요.","c":2},"h":"be23cc41ba"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Even their mouths and stomachs get a chance to participate!)","ko":"심지어 그들의 입과 위까지도 ( ? ) 기회를 얻는다! (participate의 뜻은?)","word":"participate","opts":["참여하다","잠들다","도망치다","거절하다"],"r":{"a":"1) 참여하다","ev":"9번 문장","s":[[9,"Even their mouths and stomachs get a chance to participate!","심지어 그들의 입과 위까지도 참여할 기회를 얻는다!"]],"w":"9번 문장은 눈, 코, 귀뿐 아니라 입과 위도 기회를 얻는다는 내용이에요. 입과 위가 수프를 먹으며 함께하는 것이니 participate = 참여하다예요.","c":1},"h":"bb9fdb5426"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nMany parents tell their children not to play with their food.","ko":"밑줄 친 their가 가리키는 것은?","sko":"많은 부모들이 아이들에게 음식을 가지고 장난하지 말라고 말한다.","pron":"their","opts":["부모들","채소들","연주자들","청중들"],"r":{"a":"1) 부모들","ev":"1번 문장","s":[[1,"Many parents tell their children not to play with their food.","많은 부모들이 아이들에게 음식을 가지고 장난하지 말라고 말한다."]],"w":"their children은 “그들의 아이들”이에요. 이 문장에서 아이들에게 말하는 사람은 Many parents이므로 their = Many parents(많은 부모들)예요.","c":1,"k":"their = 부모들"},"h":"f4a049eb41"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But at Vienna Vegetable Orchestra concerts, playing with food has helped create musical masterpieces.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 Vienna Vegetable Orchestra 연주회에서는 음식을 가지고 노는 것이 뛰어난 음악 작품을 만드는 데 도움이 되어 왔다.","opts":["이 연주회에서는 음식을 가지고 노는 것이 금지되어 왔다.","이 연주회에서는 음식을 가지고 놀다가 음악 작품을 망쳐 왔다.","이 연주회에서는 음식을 가지고 노는 것이 멋진 음악 작품을 만드는 데 도움이 되어 왔다.","이 연주회에서는 음식을 먹는 것이 연주자의 건강에 도움이 되어 왔다."],"r":{"a":"3) 이 연주회에서는 음식을 가지고 노는 것이 멋진 음악 작품을 만드는 데 도움이 되어 왔다.","ev":"2번 문장","s":[[2,"But at Vienna Vegetable Orchestra concerts, playing with food has helped create musical masterpieces.","하지만 Vienna Vegetable Orchestra(비엔나 채소 오케스트라) 연주회에서는 음식을 가지고 노는 것이 뛰어난 음악 작품을 만드는 데 도움이 되어 왔다."]],"w":"has helped create는 ‘만드는 데 도움이 되어 왔다’는 뜻이에요. 1번 문장의 ‘음식으로 놀지 마라’와 달리, 이 연주회에서는 음식으로 놀아서 걸작이 만들어졌다는 말이에요.","c":3},"h":"4a5ccfd1bb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The orchestra uses plastic instruments.","The audience can smell fresh vegetables at the concert.","The audience can only listen to the music.","The musicians throw away all the vegetables."],"oko":["오케스트라는 플라스틱 악기를 사용한다.","청중은 연주회에서 신선한 채소의 냄새를 맡을 수 있다.","청중은 음악을 듣기만 할 수 있다.","연주자들은 모든 채소를 버린다."],"r":{"a":"2) The audience can smell fresh vegetables at the concert. (청중은 연주회에서 신선한 채소의 냄새를 맡을 수 있다.)","ev":"7~8번 문장","s":[[7,"In addition to the unique instruments, the audience can also enjoy a full sensory experience.","청중들은 독특한 악기뿐만 아니라, 풍부한 감각적 경험도 즐길 수 있다."],[8,"Their eyes focus on the colorful vegetables, their noses take in the fresh smells, and their ears listen to the melodies.","그들의 눈은 색색의 채소에 집중하고, 코는 신선한 냄새를 들이마시고, 귀는 멜로디를 듣는다."]],"w":"8번 문장에서 청중의 코가 신선한 냄새를 들이마신다고 했어요. 7번 문장에서 청중이 풍부한 감각적 경험을 즐길 수 있다고 했으니 듣기만 하는 것은 아니에요.","c":2},"h":"8ed9b99296"},{"n":9,"t":"sum","q":"A Vienna Vegetable Orchestra concert is (A) than a normal concert because the audience can enjoy a full (B) experience.","ko":"Vienna Vegetable Orchestra의 연주회는 청중이 풍성한 (B) 경험을 즐길 수 있기 때문에 일반적인 연주회보다 (A).","opts":["(A) more fun / (B) sensory","(A) more fun / (B) silent","(A) less fun / (B) sensory","(A) less fun / (B) silent","(A) more expensive / (B) sensory"],"oko":["(A) 더 재미있다 / (B) 감각적인","(A) 더 재미있다 / (B) 조용한","(A) 덜 재미있다 / (B) 감각적인","(A) 덜 재미있다 / (B) 조용한","(A) 더 비싸다 / (B) 감각적인"],"r":{"a":"1) (A) more fun / (B) sensory ((A) 더 재미있다 / (B) 감각적인)","ev":"7번, 12번 문장","s":[[7,"In addition to the unique instruments, the audience can also enjoy a full sensory experience.","청중들은 독특한 악기뿐만 아니라, 풍부한 감각적 경험도 즐길 수 있다."],[12,"Isn’t that more fun than a normal concert?","일반적인 음악회보다 더 재미있지 않은가?"]],"w":"7번 문장에서 청중이 풍부한 감각적(sensory) 경험을 즐길 수 있다고 했고, 12번 문장에서 일반적인 연주회보다 더 재미있지 않은가?라고 물었으니 (A)는 more fun이에요.","c":1},"h":"d4bdb81832"},{"n":10,"t":"fill","q":"Before the concert, the musicians use the [A] vegetables to make soup. The audience can eat the soup after the [B].","ko":"연주회 전에 연주자들은 수프를 만들기 위해 [A] 채소를 사용한다. 청중들은 [B] 이후에 이 수프를 먹을 수 있다.","bank":["leftover","performance","instruments","drills","pumpkins","masterpieces"],"bko":{"leftover":"남은","performance":"공연","instruments":"악기","drills":"드릴","pumpkins":"호박들","masterpieces":"걸작들"},"r":{"a":"[A] leftover, [B] performance","ev":"10~11번 문장","s":[[10,"Before the concert, the musicians use the leftover vegetables to make soup.","연주회 전에 연주자들은 수프를 만들기 위해 남은 채소를 사용한다."],[11,"The audience can eat the soup after the performance.","연주회 이후에 청중들은 이 수프를 먹을 수 있다."]],"w":"10번에서 연주자들이 남은(leftover) 채소로 수프를 만든다고 하고, 11번에서 청중이 공연(performance) 후에 수프를 먹는다고 해요.","c":null},"h":"4935005b19"}]},{"u":6,"id":"nl3-06-3","no":3,"ko":"숨 쉬는데 돈을 더 내라고?","items":[{"n":1,"t":"tf","q":"In some countries, a fat tax is added to foods such as pizza and hamburgers.","ko":"어떤 나라에서는 피자와 햄버거 같은 음식에 비만세를 부과한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In some countries, a “fat tax” is added to unhealthy foods, such as pizza and hamburgers.","어떤 나라에서는 피자와 햄버거와 같은 건강에 좋지 않은 음식에 ‘비만세’를 부과한다."]],"w":"6번 문장에서 어떤 나라에서는 피자와 햄버거 같은 건강에 좋지 않은 음식에 비만세를 부과한다고 해요.","c":"T"},"h":"5eb9d9fc6c"},{"n":2,"t":"tf","q":"The breathing tax is collected from all passengers who arrive at the airport.","ko":"호흡세는 그 공항에 도착하는 모든 승객들에게 징수된다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"It is collected from all passengers who depart from the airport.","그것은 그 공항에서 출국하는 모든 승객들에게 징수된다."]],"w":"9번 문장에서 호흡세는 공항에서 출발하는(depart from) 승객들에게 징수된다고 해요. 도착하는(arrive) 승객이 아니에요.","c":"F"},"h":"74012530b7"},{"n":3,"t":"tf","q":"Farmers must pay the fart tax for methane gas emissions.","ko":"농부들은 메탄가스 배출물에 대한 방귀세를 내야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Farmers must pay the tax for methane gas emissions.","농부들은 메탄가스 배출물에 대한 세금을 지불해야 한다."]],"w":"12번 문장에서 농부들이 메탄가스 배출물에 대해 방귀세를 내야 한다(must pay)고 해요.","c":"T"},"h":"4d50f36e28"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The aim of it is to decrease obesity rates and to encourage people to eat healthier foods.)","ko":"비만세의 목적은 비만율을 ( ? )고 사람들이 더 건강한 음식을 먹도록 권장하는 것이다. (decrease의 뜻은?)","word":"decrease","opts":["늘리다","줄이다","보내다","섞다"],"r":{"a":"2) 줄이다","ev":"7번 문장","s":[[7,"The aim of it is to decrease obesity rates and to encourage people to eat healthier foods.","비만세의 목적은 비만율을 낮추고 사람들이 더 건강한 음식을 먹도록 권장하는 것이다."]],"w":"7번 문장에서 비만세의 목적은 비만율을 decrease하고 건강한 음식을 먹게 하는 것이에요. 비만율을 높이려는 것이 아니니 ‘줄이다’예요.","c":2},"h":"66a45baced"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is collected from all passengers who depart from the airport.)","ko":"그것은 그 공항에서 출국하는 모든 승객들에게 ( ? ). (collected의 뜻은?)","word":"collected","opts":["섞인다","나뉜다","징수된다","금지된다"],"r":{"a":"3) 징수된다","ev":"9번 문장","s":[[9,"It is collected from all passengers who depart from the airport.","그것은 그 공항에서 출국하는 모든 승객들에게 징수된다."]],"w":"9번 문장은 호흡세가 공항을 떠나는 승객에게 걷힌다는 내용이에요. 세금(tax)에 쓰인 collect는 ‘징수하다’이고, is collected는 ‘징수된다’예요.","c":3},"h":"157ccc0f33"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThere are many different kinds of taxes. Some of them, however, are unusual.","ko":"밑줄 친 them이 가리키는 것은?","sko":"많은 다양한 종류의 세금이 있다. 하지만 그것들 중 일부는 특이하다.","pron":"them","opts":["세금들","정부들","공공 서비스들","나라들"],"r":{"a":"1) 세금들","ev":"4~5번 문장","s":[[4,"There are many different kinds of taxes.","많은 다양한 종류의 세금이 있다."],[5,"Some of them, however, are unusual.","하지만 그것들 중 일부는 특이하다."]],"w":"4번 문장에 many different kinds of taxes(많은 종류의 세금)가 나와요. 5번 문장의 Some of them(그것들 중 일부)은 그 세금들 중 일부를 말해요. 그래서 them = taxes예요.","c":1,"k":"them = 세금들"},"h":"7d4114875f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Its purpose is to pay for the airport’s air conditioning system.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것의 목적은 공항의 냉방 시스템 비용을 지불하는 것이다.","opts":["그것의 목적은 공항의 냉방 시스템 비용을 지불하는 것이다.","그것의 목적은 공항의 승객 수를 늘리는 것이다.","그것의 목적은 공항의 냉방 시스템을 팔아서 돈을 버는 것이다.","그것의 목적은 승객들에게 냉방 시스템을 무료로 제공하는 것이다."],"r":{"a":"1) 그것의 목적은 공항의 냉방 시스템 비용을 지불하는 것이다.","ev":"10번 문장","s":[[10,"Its purpose is to pay for the airport’s air conditioning system.","그것의 목적은 공항의 냉방 시스템 비용을 지불하는 것이다."]],"w":"Its purpose는 “그것의 목적”이고, pay for the airport’s air conditioning system은 공항의 냉방 시스템 비용을 지불한다는 뜻이에요.","c":1},"h":"0437128f68"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The fat tax is paid at Simón Bolívar International Airport.","Burps and farts of farm animals produce methane gas emissions.","The breathing tax is paid by farmers.","A fat tax is added to healthy foods."],"oko":["비만세는 Simón Bolívar 국제 공항에서 납부된다.","가축의 트림과 방귀가 메탄가스 배출물을 만든다.","호흡세는 농부들이 낸다.","비만세는 건강한 음식에 부과된다."],"r":{"a":"2) Burps and farts of farm animals produce methane gas emissions.","ev":"6번, 9번, 12번, 13번 문장","s":[[6,"In some countries, a “fat tax” is added to unhealthy foods, such as pizza and hamburgers.","어떤 나라에서는 피자와 햄버거와 같은 건강에 좋지 않은 음식에 ‘비만세’를 부과한다."],[9,"It is collected from all passengers who depart from the airport.","그것은 그 공항에서 출국하는 모든 승객들에게 징수된다."],[12,"Farmers must pay the tax for methane gas emissions.","농부들은 메탄가스 배출물에 대한 세금을 지불해야 한다."],[13,"These emissions come from the burps and farts of farm animals.","이 배출물은 가축의 트림과 방귀에서 나온다."]],"w":"13번 문장에서 메탄가스 배출물은 가축의 트림과 방귀에서 나온다고 해요. 6번 비만세는 건강에 좋지 않은 음식에, 9번 호흡세는 공항 출발 승객에게, 12번 농부는 방귀세를 내므로 나머지는 틀려요.","c":2},"h":"fdf6998ef1"},{"n":9,"t":"sum","q":"Governments need money in order to (A) public (B).","ko":"정부는 공공 (B)을(를) (A) 위해 돈이 필요하다.","opts":["(A) provide / (B) services","(A) provide / (B) obesity","(A) avoid / (B) services","(A) avoid / (B) obesity","(A) provide / (B) airports"],"oko":["(A) 제공하기 / (B) 서비스","(A) 제공하기 / (B) 비만","(A) 피하기 / (B) 서비스","(A) 피하기 / (B) 비만","(A) 제공하기 / (B) 공항"],"r":{"a":"1) (A) provide / (B) services ((A) 제공하기 / (B) 서비스)","ev":"1번 문장","s":[[1,"Governments need money in order to provide public services.","정부는 공공 서비스를 제공하기 위해 돈이 필요하다."]],"w":"1번 문장은 “정부는 공공 서비스를 제공하기 위해 돈이 필요하다”는 뜻이에요. in order to provide는 “제공하기 위해”, public services는 “공공 서비스”예요.","c":1},"h":"fc341d9884"},{"n":10,"t":"fill","q":"Methane gas contributes to global [A]. So the fart tax is designed to protect the [B].","ko":"메탄가스는 지구 [A]의 한 원인이다. 그래서 방귀세는 [B]을(를) 보호하기 위해 고안되었다.","bank":["warming","environment","encourage","discuss","burps","depart"],"bko":{"warming":"온난화","environment":"환경","encourage":"권장하다","discuss":"논의하다","burps":"트림들","depart":"출발하다"},"r":{"a":"[A] warming (온난화), [B] environment (환경)","ev":"14~15번 문장","s":[[14,"Methane gas contributes to global warming.","메탄가스는 지구 온난화의 한 원인이다."],[15,"So the fart tax is designed to protect the environment.","그래서 방귀세는 환경을 보호하기 위해 고안되었다."]],"w":"14번에서 메탄가스는 지구 온난화(global warming)의 한 원인이라고 하고, 15번에서 그래서 방귀세는 환경(environment)을 보호하기 위해 고안되었다고 해요.","c":null},"h":"b0a2978c56"}]},{"u":6,"id":"nl3-06-4","no":4,"ko":"깨진 유리창의 법칙","items":[{"n":1,"t":"tf","q":"The writer says you should keep your house clean and tidy to keep thieves away.","ko":"글쓴이는 도둑을 막으려면 집을 깨끗하고 단정하게 유지해야 한다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"If you don’t want thieves to enter your house, what do you need to do?","도둑이 당신의 집에 들어오는 것을 원하지 않는다면, 무엇을 해야 할까?"],[2,"You should lock your door, stay home at night, and ... keep your house clean and tidy.","당신은 문을 잠그고, 밤에는 집에 머물며, 그리고 … 집을 깨끗하고 단정하게 유지해야 한다."]],"w":"1번에서 도둑이 들어오지 않게 하려면 무엇을 해야 하는지 묻고, 2번에서 집을 깨끗하고 단정하게 유지해야 한다(keep your house clean and tidy)는 것을 포함해 답해요.","c":"T"},"h":"d22e77ac2b"},{"n":2,"t":"tf","q":"Criminals think clean and tidy houses are easier to steal from.","ko":"범죄자들은 깨끗하고 단정한 집일수록 도둑질하기 더 쉽다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"According to experts, however, criminals think that clean and tidy houses are more difficult to steal from.","하지만 전문가들에 의하면, 범죄자들은 깨끗하고 단정한 집일수록 도둑질하기가 더 어렵다고 생각한다."]],"w":"4번 문장에서 범죄자들은 깨끗하고 단정한 집일수록 도둑질하기 더 어렵다(more difficult)고 생각한다고 해요. 쉽다는 말은 반대예요.","c":"F"},"h":"8916e66b2e"},{"n":3,"t":"tf","q":"Rudolph Giuliani used the broken windows theory to decrease crime on the subway.","ko":"Rudolph Giuliani는 지하철 범죄를 줄이기 위해 깨진 유리창 이론을 활용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Former New York mayor Rudolph Giuliani used this theory to decrease crime on the subway.","전 뉴욕 시장인 Rudolph Giuliani(루돌프 줄리아니)는 지하철에서 일어나는 범죄를 줄이기 위해 이 이론을 활용했다."]],"w":"9번 문장에서 전 뉴욕 시장 Giuliani가 지하철 범죄를 줄이기 위해 이 이론(깨진 유리창 이론)을 활용했다고 해요.","c":"T"},"h":"9a6b06a462"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (On the other hand, if your house has a broken window, thieves will think it is an easy target.)","ko":"반면에, 만약 당신의 집에 깨진 유리창이 있다면 도둑들은 그 집이 쉬운 ( ? )이라고 생각할 것이다. (target의 뜻은?)","word":"target","opts":["목표물","주인","이웃","도구"],"r":{"a":"1) 목표물","ev":"5번 문장","s":[[5,"On the other hand, if your house has a broken window, thieves will think it is an easy target.","반면에, 만약 당신의 집에 깨진 유리창이 있다면 도둑들은 그 집이 쉬운 목표물이라고 생각할 것이다."]],"w":"5번 문장은 깨진 유리창이 있는 집을 도둑이 쉽게 노릴 수 있는 곳으로 본다는 뜻이에요. 도둑이 노리는 대상이니 target = 목표물이에요.","c":1},"h":"bed96b5e05"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (On the other hand, if a house isn’t well taken care of, it will attract more thieves because they will think the owners are careless.)","ko":"반면에, 만약 집이 잘 관리되어 있지 않으면, 도둑들은 그 주인이 ( ? ) 생각할 것이므로 더 많은 도둑을 끌어들일 것이다. (careless의 뜻은?)","word":"careless","opts":["조심스러운","부주의한","친절한","정직한"],"r":{"a":"2) 부주의한","ev":"8번 문장","s":[[8,"On the other hand, if a house isn’t well taken care of, it will attract more thieves because they will think the owners are careless.","반면에, 만약 집이 잘 관리되어 있지 않으면, 도둑들은 그 주인이 부주의하다고 생각할 것이므로 더 많은 도둑을 끌어들일 것이다."]],"w":"8번 문장은 집이 잘 관리되지 않아서 도둑이 모이는 이유를 말해요. 7번에서 ‘잘 관리한다(take good care)’의 반대이므로 careless = 부주의한이에요.","c":2},"h":"8e32d172ff"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nClean and tidy houses make thieves think their owners take good care of them, so thieves avoid breaking into those houses.","ko":"밑줄 친 them이 가리키는 것은?","sko":"깨끗하고 단정한 집들은 도둑들로 하여금 그 주인들이 집 관리를 잘한다고 생각하게 해서, 도둑들은 그런 집을 침입하는 것을 피한다.","pron":"them","opts":["깨끗하고 단정한 집들","도둑들","주인들","범죄들"],"r":{"a":"1) 깨끗하고 단정한 집들","ev":"7번 문장","s":[[7,"Clean and tidy houses make thieves think their owners take good care of them, so thieves avoid breaking into those houses.","깨끗하고 단정한 집들은 도둑들로 하여금 그 주인들이 집 관리를 잘한다고 생각하게 해서, 도둑들은 그런 집을 침입하는 것을 피한다."]],"w":"take good care of them은 “그것들을 잘 관리하다”라는 뜻이에요. 잘 관리되는 것은 문장 맨 앞의 Clean and tidy houses(깨끗하고 단정한 집들)예요. 그래서 them = houses예요.","c":1,"k":"them = 깨끗하고 단정한 집들"},"h":"6fa4de4641"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He felt a messy subway both attracted crime and made people think it was a dangerous place.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 지저분한 지하철은 범죄를 부추길 뿐만 아니라 사람들이 그곳은 위험한 장소라고 생각하게 만든다고 여겼다.","opts":["그는 지저분한 지하철이 범죄를 줄이고 사람들이 안전하다고 생각하게 만든다고 여겼다.","그는 깨끗한 지하철이 범죄를 부추기고 사람들이 위험하다고 생각하게 만든다고 여겼다.","그는 지하철이 위험해서 사람들이 지저분하게 만든다고 여겼다.","그는 지저분한 지하철이 범죄를 부추길 뿐 아니라 사람들이 그곳을 위험한 장소라고 생각하게 만든다고 여겼다."],"r":{"a":"4) 그는 지저분한 지하철이 범죄를 부추길 뿐 아니라 사람들이 그곳을 위험한 장소라고 생각하게 만든다고 여겼다.","ev":"10번 문장","s":[[10,"He felt a messy subway both attracted crime and made people think it was a dangerous place.","그는 지저분한 지하철은 범죄를 부추길 뿐만 아니라 사람들이 그곳은 위험한 장소라고 생각하게 만든다고 여겼다."]],"w":"both A and B는 ‘A와 B 둘 다’예요. 지저분한 지하철이 범죄를 끌어들이고(A), 사람들이 위험한 곳이라고 생각하게 만든다(B)는 뜻이에요.","c":4},"h":"5261adbab2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Giuliani ordered the police to clean all the subway cars and stations.","Giuliani used this theory to build new subway stations.","Subway crimes increased after the subway was cleaned.","Giuliani thought a messy subway made people feel safe."],"oko":["Giuliani는 경찰에게 모든 지하철과 역을 청소하라고 지시했다.","Giuliani는 새로운 지하철 역을 짓기 위해 이 이론을 활용했다.","지하철을 청소한 뒤 지하철 범죄가 늘었다.","Giuliani는 지저분한 지하철이 사람들을 안전하게 느끼게 한다고 생각했다."],"r":{"a":"1) Giuliani ordered the police to clean all the subway cars and stations.","ev":"9~12번 문장","s":[[9,"Former New York mayor Rudolph Giuliani used this theory to decrease crime on the subway.","전 뉴욕 시장인 Rudolph Giuliani(루돌프 줄리아니)는 지하철에서 일어나는 범죄를 줄이기 위해 이 이론을 활용했다."],[10,"He felt a messy subway both attracted crime and made people think it was a dangerous place.","그는 지저분한 지하철은 범죄를 부추길 뿐만 아니라 사람들이 그곳은 위험한 장소라고 생각하게 만든다고 여겼다."],[11,"Giuliani ordered the police to clean all the subway cars and stations.","Giuliani는 경찰들에게 모든 지하철과 역을 청소하라고 지시했다."],[12,"Within a few years, subway crimes dropped sharply.","몇 년 이내에 지하철 범죄는 급격하게 감소했다."]],"w":"11번 문장에서 Giuliani가 경찰에게 모든 지하철 칸과 역을 청소하라고 지시했다고 해요. 9번은 범죄를 줄이려는 목적, 10번은 지저분한 지하철이 위험하다고 생각하게 한다, 12번은 범죄가 급격히 줄었다고 해서 나머지는 틀려요.","c":1},"h":"74c708ff62"},{"n":9,"t":"sum","q":"According to (A), criminals think clean and tidy houses are more (B) to steal from.","ko":"(A)에 의하면, 범죄자들은 깨끗하고 단정한 집일수록 도둑질하기가 더 (B) 것으로 생각한다.","opts":["(A) experts / (B) difficult","(A) experts / (B) easy","(A) neighbors / (B) difficult","(A) neighbors / (B) easy","(A) experts / (B) dangerous"],"oko":["(A) 전문가들 / (B) 어려운","(A) 전문가들 / (B) 쉬운","(A) 이웃들 / (B) 어려운","(A) 이웃들 / (B) 쉬운","(A) 전문가들 / (B) 위험한"],"r":{"a":"1) (A) experts / (B) difficult ((A) 전문가들 / (B) 어려운)","ev":"4번 문장","s":[[4,"According to experts, however, criminals think that clean and tidy houses are more difficult to steal from.","하지만 전문가들에 의하면, 범죄자들은 깨끗하고 단정한 집일수록 도둑질하기가 더 어렵다고 생각한다."]],"w":"4번 문장은 According to experts(전문가들에 의하면)로 시작하고, 범죄자들은 깨끗하고 단정한 집이 도둑질하기 더 어렵다(more difficult)고 생각한다고 해요.","c":1},"h":"f67852d151"},{"n":10,"t":"fill","q":"Within a few [A], subway crimes [B] sharply.","ko":"몇 [A] 이내에 지하철 범죄는 급격하게 [B].","bank":["years","dropped","theory","mayor","order","broken"],"bko":{"years":"해, 년(year의 복수형)","dropped":"감소했다(drop의 과거)","theory":"이론","mayor":"시장","order":"명령하다","broken":"깨진"},"r":{"a":"[A] years (해, 년(year의 복수형)), [B] dropped (감소했다(drop의 과거))","ev":"12번 문장","s":[[12,"Within a few years, subway crimes dropped sharply.","몇 년 이내에 지하철 범죄는 급격하게 감소했다."]],"w":"12번 문장은 “몇 년 이내에 지하철 범죄는 급격하게 감소했다”는 뜻이에요. a few 뒤에는 복수형 years가 오고, 과거의 일이라 drop의 과거형 dropped를 써요.","c":null},"h":"379b777336"}]},{"u":7,"id":"nl3-07-1","no":1,"ko":"잠꾸러기를 깨우는 특별한 시계","items":[{"n":1,"t":"tf","q":"Nanda said Clocky is kind of like a hide-and-seek game.","ko":"Nanda는 Clocky가 약간 숨바꼭질 놀이 같다고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"“It’s kind of like a hide-and-seek game,” Nanda said.","Nanda는 “그것은 약간 숨바꼭질 놀이 같아요.”라고 말했다."]],"w":"8번 문장에서 Nanda가 직접 '약간 숨바꼭질 놀이 같다(kind of like a hide-and-seek game)'고 말해요.","c":"T"},"h":"8543b06f6b"},{"n":2,"t":"tf","q":"Clocky stays in the same place every morning.","ko":"Clocky는 매일 아침 같은 곳에 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"So the clock can be in a different place every morning.","그래서 매일 아침 시계가 다른 곳에 있을 수 있다."]],"w":"7번 문장에서 시계는 매일 아침 다른 곳에 있을 수 있다(in a different place every morning)고 해요. 같은 곳에 있는 게 아니에요.","c":"F"},"h":"77136752c5"},{"n":3,"t":"tf","q":"When the alarm goes off, Clocky rolls around the floor.","ko":"알람이 울리면 Clocky는 바닥을 굴러다닌다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"When the alarm goes off, the clock rolls around the floor of the room.","알람이 울리면 그 시계는 방바닥을 굴러다닌다."]],"w":"4번 문장 그대로예요. 알람이 울리면(goes off) 시계가 방바닥을 굴러다녀요.","c":"T"},"h":"565dac4593"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When the alarm goes off, the clock rolls around the floor of the room.)","ko":"알람이 ( … ) 그 시계는 방바닥을 굴러다닌다.","opts":["꺼진다","울린다","멈춘다","떨어진다"],"word":"goes off","r":{"a":"2) 울린다","ev":"4번 문장","s":[[4,"When the alarm goes off, the clock rolls around the floor of the room.","알람이 울리면 그 시계는 방바닥을 굴러다닌다."]],"w":"알람이 울리면 시계가 굴러다니기 시작해요. 그래서 go off는 '(알람이) 울리다'예요. 알람이 꺼지면 굴러다닐 이유가 없어요.","c":2},"h":"df40a8b886"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The clock’s programming makes the motors move the clock at various speeds and in different directions.)","ko":"시계의 프로그래밍은 모터가 시계를 다양한 속도와 다른 ( … )(으)로 움직이게 한다.","opts":["소리","무게","방향","색깔"],"word":"directions","r":{"a":"3) 방향","ev":"6번 문장","s":[[6,"The clock’s programming makes the motors move the clock at various speeds and in different directions.","그 시계의 프로그래밍은 모터가 시계를 다양한 속도와 다른 방향으로 움직이게 한다."]],"w":"at various speeds(다양한 속도로)와 짝으로 in different directions(다른 방향으로)가 나와요. 속도와 같이 움직임을 말하니 '방향'이에요.","c":3},"h":"6b8378abc4"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIf you want to turn it off, you have to catch it.","ko":"밑줄 친 마지막 it이 가리키는 것은?","sko":"만약 당신이 알람을 끄고 싶다면 그것을 잡아야만 한다.","pron":"it","opts":["대학원생","방바닥","모터","시계(Clocky)"],"r":{"a":"4) 시계(Clocky)","ev":"5번 문장","s":[[5,"If you want to turn it off, you have to catch it.","만약 당신이 알람을 끄고 싶다면 그것을 잡아야만 한다."]],"w":"turn it off는 “그것을 끄다”, catch it은 “그것을 잡다”예요. 알람이 울리면 굴러다니는 것은 시계(the clock)이므로, 잡아야 하는 마지막 it은 Clocky 시계예요.","c":4,"k":"it = 시계(Clocky)"},"h":"b51ca9b21d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you use Clocky, it will be easy for you to wake up too!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 당신이 Clocky를 사용한다면, 당신도 일어나기가 쉬워질 것이다!","opts":["Clocky를 쓰면 당신도 잠들기가 쉬워질 것이다.","Clocky는 쓰기가 쉬워서 많은 사람들이 좋아한다.","당신도 Clocky를 직접 만들기가 쉬워질 것이다.","Clocky를 쓰면 당신도 일어나기가 쉬워질 것이다."],"r":{"a":"4) Clocky를 쓰면 당신도 일어나기가 쉬워질 것이다.","ev":"10번 문장","s":[[10,"If you use Clocky, it will be easy for you to wake up too!","만약 당신이 Clocky를 사용한다면, 당신도 일어나기가 쉬워질 것이다!"]],"w":"it은 가주어이고 to wake up(일어나는 것)이 진짜 주어예요. 그래서 '일어나기가 쉬워질 것'이에요. 잠드는 것, 만드는 것, 쓰기 쉬운 것을 말하는 게 아니에요.","c":4},"h":"cd0d93d4ca"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Gauri Nanda is a graduate student at MIT.","Gauri Nanda is a middle school teacher.","Gauri Nanda made a cooking robot.","Gauri Nanda has never had trouble getting up."],"oko":["Gauri Nanda는 MIT의 대학원생이다.","Gauri Nanda는 중학교 선생님이다.","Gauri Nanda는 는다면 랜섬웨어에 감염되었을 수 있다.","새 키보드를 쓰면 랜섬웨어를 쉽게 막을 수 있다.","랜섬웨어는 웹사이트를 통해서는 퍼지지 않는다."],"r":{"a":"2) You may have ransomware if you receive emails asking you to pay money. (돈을 내라고 요구하는 이메일을 받는다면 랜섬웨어에 감염되었을 수 있다.)","ev":"2~3번 문장","s":[[2,"Are you receiving emails that ask you to pay money if you want to unlock the files?","(잠긴) 파일들을 풀고 싶으면 돈을 내라고 요구하는 메일을 받고 있는가?"],[3,"If so, your computer may have ransomware.","그렇다면, 당신의 컴퓨터는 랜섬웨어에 감염되었을지도 모른다."]],"w":"2~3번 문장에서 돈을 내라고 요구하는 이메일을 받고 있다면 컴퓨터에 랜섬웨어가 있을지도 모른다고 해요. 5번 문장에서 웹사이트를 통해서도 퍼진다고 했으니 4번은 틀려요.","c":2},"h":"564b3d5b5e"},{"n":9,"t":"sum","q":"Ransomware (A) the files on a computer and asks users to pay money. If they don’t pay, the files will be (B) forever.","ko":"랜섬웨어는 컴퓨터의 파일을 (A) 사용자에게 돈을 내라고 요구한다. 돈을 내지 않으면 파일은 영원히 (B) 것이다.","opts":["(A) cleans / (B) lost","(A) opens / (B) found","(A) sells / (B) saved","(A) locks / (B) found","(A) locks / (B) lost"],"oko":["(A) 지운다 / (B) 잃게 될","(A) 열어 준다 / (B) 찾게 될","(A) 판다 / (B) 안전해질","(A) 잠근다 / (B) 찾게 될","(A) 잠근다 / (B) 잃게 될"],"r":{"a":"5) (A) locks / (B) lost ((A) 잠근다 / (B) 잃게 될)","ev":"2번, 7번 문장","s":[[2,"Are you receiving emails that ask you to pay money if you want to unlock the files?","(잠긴) 파일들을 풀고 싶으면 돈을 내라고 요구하는 메일을 받고 있는가?"],[7,"If they don’t pay, the decryption key will be destroyed and the files will be lost forever.","만약 피해자가 돈을 내지 않으면, 암호 해독 키가 파괴되고 파일들을 영원히 잃게 될 것이다."]],"w":"2번 문장에서 돈을 내야 파일을 풀 수(unlock) 있다고 하니 랜섬웨어가 파일을 잠근다(locks)는 뜻이에요. 7번 문장에서 돈을 내지 않으면 파일들을 영원히 잃게 된다(lost)고 해요.","c":5},"h":"9b62edec86"},{"n":10,"t":"fill","q":"Are you [A] to open [B] files?","ko":"당신은 [B] 파일들을 열 수 [A]?","bank":["unable","important","regularly","forever","pay","discover"],"bko":{"unable":"~할 수 없는","important":"중요한","regularly":"정기적으로","forever":"영원히","pay":"내다, 지불하다","discover":"알게 되다"},"r":{"a":"[A] unable (~할 수 없는), [B] important (중요한)","ev":"1번 문장","s":[[1,"Are you unable to open important files?","당신은 중요한 파일들을 열 수 없는가?"]],"w":"1번 문장은 “당신은 중요한 파일들을 열 수 없는가?”라는 뜻이에요. be unable to ~는 “~할 수 없다”이고, important files는 “중요한 파일들”이에요.","c":null},"h":"0ab334e002"}]},{"u":7,"id":"nl3-07-3","no":3,"ko":"사막에서 익사를?","items":[{"n":1,"t":"tf","q":"More people drown in the Sahara than die of thirst.","ko":"사하라 사막에서는 갈증으로 죽는 사람보다 물에 빠져 죽는 사람이 더 많다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But did you know that more people drown in the Sahara than die of thirst?","그런데 사하라 사막에서 갈증으로 죽는 것보다 더 많은 사람들이 물에 빠져 죽는다는 것을 알고 있었는가?"]],"w":"3번 문장 그대로예요. more people drown ~ than die of thirst라고 해요.","c":"T"},"h":"850be7ea0e"},{"n":2,"t":"tf","q":"Flash floods are easy to predict.","ko":"돌발 홍수는 예측하기 쉽다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"They are hard to predict because the downpours happen in small areas, and people far away from those areas have no idea what is happening there.","돌발 홍수는 예측하기가 어려운데, 왜냐하면 폭우가 협소한 지역에서 일어나고 그 지역에서 멀리 떨어져 있는 사람들은 거기서 무슨 일이 일어나고 있는지 모르기 때문이다."]],"w":"11번 문장에서 돌발 홍수(They)는 예측하기 어렵다(hard to predict)고 해요. 쉽다는 말은 반대예요.","c":"F"},"h":"7a8e7f9bf1"},{"n":3,"t":"tf","q":"Floods happen suddenly in the Sahara because the sand cannot soak up water quickly.","ko":"사하라 사막에서는 모래가 물을 빨리 흡수하지 못하기 때문에 홍수가 갑자기 일어난다.","r":{"a":"T (본문과 맞는 내용)","ev":"8~9번 문장","s":[[8,"And the desert sand can’t soak up the water as quickly as soil can.","그리고 사막의 모래는 (일반) 토양만큼 빠르게 물을 흡수하지 못한다."],[9,"This causes floods to happen suddenly.","이것은 홍수가 갑자기 발생하게 한다."]],"w":"8번에서 모래가 물을 빠르게 흡수하지 못하고, 9번에서 이것이 홍수가 갑자기 일어나게 한다고 해요.","c":"T"},"h":"cbb2c42f56"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But did you know that more people drown in the Sahara than die of thirst?)","ko":"그런데 사하라 사막에서 갈증으로 죽는 것보다 더 많은 사람들이 ( … )는 것을 알고 있었는가?","opts":["물을 마시다","물에 빠져 죽다","목이 마르다","수영을 하다"],"word":"drown","r":{"a":"2) 물에 빠져 죽다","ev":"3번 문장","s":[[3,"But did you know that more people drown in the Sahara than die of thirst?","그런데 사하라 사막에서 갈증으로 죽는 것보다 더 많은 사람들이 물에 빠져 죽는다는 것을 알고 있었는가?"]],"w":"갈증으로 죽는 것(die of thirst)과 비교하며 놀라운 사실을 말해요. 5번에서도 수백 명이 하룻밤에 죽었다는 사례가 나오니 drown은 '물에 빠져 죽다'예요.","c":2},"h":"d9d17678d2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (And the desert sand can’t soak up the water as quickly as soil can.)","ko":"그리고 사막의 모래는 토양만큼 빠르게 물을 ( … ) 못한다.","opts":["빨아들이다","말리다","밀어내다","얼리다"],"word":"soak up","r":{"a":"1) 빨아들이다","ev":"8번 문장","s":[[8,"And the desert sand can’t soak up the water as quickly as soil can.","그리고 사막의 모래는 (일반) 토양만큼 빠르게 물을 흡수하지 못한다."]],"w":"모래가 물을 빠르게 soak up하지 못해서 9번처럼 홍수가 갑자기 생겨요. 물이 땅속으로 스며들지 못한다는 뜻이니 '빨아들이다, 흡수하다'예요.","c":1},"h":"e7ebd6965b"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nWhen water suddenly begins flowing through valleys, people are seldom prepared. They don’t expect floods in a place where there is hardly any water.","ko":"밑줄 친 They가 가리키는 것은?","sko":"물이 골짜기를 따라 갑자기 흐르기 시작할 때, 사람들은 거의 준비가 되어 있지 않다. 그들은 물이 거의 없는 곳에서의 홍수를 예상하지 못한다.","pron":"They","opts":["사람들","홍수들","골짜기들","모래들"],"r":{"a":"1) 사람들","ev":"12~13번 문장","s":[[12,"When water suddenly begins flowing through valleys, people are seldom prepared.","물이 골짜기를 따라 갑자기 흐르기 시작할 때, 사람들은 거의 준비가 되어 있지 않다."],[13,"They don’t expect floods in a place where there is hardly any water.","그들은 물이 거의 없는 곳에서의 홍수를 예상하지 못한다."]],"w":"13번 문장의 They don’t expect floods는 “그들은 홍수를 예상하지 못한다”는 뜻이에요. 바로 앞 12번 문장에서 물이 갑자기 흐를 때 준비되어 있지 않은 것은 people(사람들)이에요. 그래서 They = people이에요.","c":1,"k":"They = 사람들"},"h":"224926ab44"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So be careful if you plan to travel across the Sahara!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러니 사하라 사막을 여행할 계획이라면 주의하라!","opts":["그러니 사하라 사막을 여행할 계획이라면 조심하라!","그러니 사하라 사막을 여행할 계획이라면 물을 많이 마셔라!","그러니 사하라 사막을 여행할 계획을 세우지 마라!","그러니 사하라 사막 여행은 안전하니 걱정하지 마라!"],"r":{"a":"1) 그러니 사하라 사막을 여행할 계획이라면 조심하라!","ev":"15번 문장","s":[[15,"So be careful if you plan to travel across the Sahara!","그러니 사하라 사막을 여행할 계획이라면 주의하라!"]],"w":"be careful은 “조심하라”, if you plan to travel across the Sahara는 “사하라 사막을 여행할 계획이라면”이라는 뜻이에요.","c":1},"h":"cff7874050"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The Sahara has a lot of water all year.","People do not expect floods in a place where there is hardly any water.","Most people in the Sahara live near big rivers.","The Sahara is a safe desert to travel across."],"oko":["사하라 사막에는 일년 내내 물이 많다.","사람들은 물이 거의 없는 곳에서의 홍수를 예상하지 못한다.","사하라 사막의 대부분의 사람들은 큰 강 근처에 산다.","사하라 사막은 여행하기에 안전한 사막이다."],"r":{"a":"2) People do not expect floods in a place where there is hardly any water. (사람들은 물이 거의 없는 곳에서의 홍수를 예상하지 못한다.)","ev":"13번 문장","s":[[13,"They don’t expect floods in a place where there is hardly any water.","그들은 물이 거의 없는 곳에서의 홍수를 예상하지 못한다."]],"w":"13번 문장에서 사람들은 물이 거의 없는 곳에서의 홍수를 예상하지 못한다고 해요. 1~2번 문장에서 사하라는 위험한 사막이고 물이 거의 없다고 했으니 1번과 4번은 틀려요.","c":2},"h":"d966ea6d35"},{"n":9,"t":"sum","q":"The Sahara is a (A) desert. It can get very (B), and there is little water.","ko":"사하라 사막은 (A) 사막이다. 그곳은 매우 (B) 수 있고 물은 거의 없다.","opts":["(A) dangerous / (B) hot","(A) dangerous / (B) cold","(A) safe / (B) hot","(A) safe / (B) cold","(A) dangerous / (B) wet"],"oko":["(A) 위험한 / (B) 뜨거워질","(A) 위험한 / (B) 차가워질","(A) 안전한 / (B) 뜨거워질","(A) 안전한 / (B) 차가워질","(A) 위험한 / (B) 젖을"],"r":{"a":"1) (A) dangerous / (B) hot ((A) 위험한 / (B) 뜨거워질)","ev":"1~2번 문장","s":[[1,"The Sahara is a dangerous desert.","사하라 사막은 위험한 사막이다."],[2,"It can get very hot, and there is little water.","그곳은 매우 뜨거워질 수 있고 물은 거의 없다."]],"w":"1번 문장에서 사하라는 위험한(dangerous) 사막이라고 해요. 2번 문장에서 매우 뜨거워질(hot) 수 있고 물은 거의 없다고 해요.","c":1},"h":"bc0fda3e80"},{"n":10,"t":"fill","q":"It [A] rains in the Sahara. But when it does, it rains very [B].","ko":"사하라 사막에는 비가 [A] 온다. 그런데 비가 오면 아주 [B] 온다.","bank":["rarely","hard","thirst","desert","soil","valleys"],"bko":{"rarely":"드물게","hard":"세게, 심하게","thirst":"갈증","desert":"사막","soil":"토양","valleys":"골짜기들"},"r":{"a":"[A] rarely (드물게), [B] hard (세게, 심하게)","ev":"6~7번 문장","s":[[6,"It rarely rains in the Sahara.","사하라 사막에는 비가 거의 오지 않는다."],[7,"But when it does, it rains very hard.","그런데 비가 오면 아주 심하게 온다."]],"w":"6번 문장은 사하라에는 비가 드물게(rarely) 온다는 뜻이에요. 7번 문장은 그런데 비가 오면 아주 심하게(hard) 온다는 뜻이에요.","c":null},"h":"5335213a00"}]},{"u":7,"id":"nl3-07-4","no":4,"ko":"이상하게 가운데가 끌려","items":[{"n":1,"t":"tf","q":"In the story, the first bed is very hard.","ko":"이야기에서 첫 번째 침대는 매우 딱딱하다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The first bed is very hard, and the second bed is very soft.","첫 번째 침대는 매우 딱딱하고, 두 번째 침대는 매우 부드럽다."]],"w":"2번 문장에서 첫 번째 침대는 매우 딱딱하고(very hard), 두 번째 침대는 매우 부드러워요.","c":"T"},"h":"5e531ae305"},{"n":2,"t":"tf","q":"Shoppers think cheaper products are high-quality.","ko":"쇼핑객들은 더 저렴한 제품이 품질이 좋다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"And they see cheaper products as low-quality and risky.","그리고 그들은 더 저렴한 제품은 품질이 나쁘고 위험 부담이 큰 것으로 본다."]],"w":"7번 문장에서 쇼핑객들은 더 저렴한 제품을 품질이 나쁘고(low-quality) 위험하다고(risky) 봐요.","c":"F"},"h":"52647ad1be"},{"n":3,"t":"tf","q":"Companies use Goldilocks pricing when they want to increase their sales of a certain product.","ko":"기업들은 특정 제품의 판매량을 늘리고 싶을 때 골디락스 가격을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Companies use this strategy when they want to increase their sales of a certain product.","기업들은 특정 제품의 판매량을 늘리고 싶을 때 이 전략을 이용한다."]],"w":"11번 문장에서 기업들은 특정 제품의 판매량을 늘리고 싶을 때 이 전략을 써요.","c":"T"},"h":"923364932c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They view more expensive products as wasteful and unnecessary.)","ko":"그들은 더 비싼 제품은 낭비이고 불필요하다고 ( … ).","opts":["경치","견해, 의견","여기다, 생각하다","방문하다"],"word":"view","r":{"a":"3) 여기다, 생각하다","ev":"6번 문장","s":[[6,"They view more expensive products as wasteful and unnecessary.","그들은 더 비싼 제품은 낭비이고 불필요하다고 여긴다."]],"w":"view A as B는 'A를 B라고 여기다'예요. 비싼 제품을 낭비(wasteful)라고 여긴다는 뜻이니, 경치나 의견이 아니에요.","c":3},"h":"159a92a439"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (And they see cheaper products as low-quality and risky.)","ko":"그리고 그들은 더 저렴한 제품은 품질이 나쁘고 ( … ) 것으로 본다.","opts":["안전한","위험 부담이 큰","값비싼","고급스러운"],"word":"risky","r":{"a":"2) 위험 부담이 큰","ev":"7번 문장","s":[[7,"And they see cheaper products as low-quality and risky.","그리고 그들은 더 저렴한 제품은 품질이 나쁘고 위험 부담이 큰 것으로 본다."]],"w":"싼 제품은 품질이 낮다(low-quality)고 보고 and로 이어져요. 그래서 risky는 '위험 부담이 큰'이에요. 그래서 중간 제품을 사게 돼요(8번).","c":2},"h":"14f1af9a61"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nCompanies are aware of this behavior, and they often use it when they market their products.","ko":"밑줄 친 it이 가리키는 것은?","sko":"기업들은 이러한 행동을 알고, 자신들의 제품을 시장에 내놓을 때 흔히 이것을 이용한다.","opts":["세 번째 침대","골디락스 가격이라는 이름","쇼핑객들이 중간에 있는 것을 사는 행동","더 저렴한 제품"],"r":{"a":"3) 쇼핑객들이 중간에 있는 것을 사는 행동","ev":"8~9번 문장","s":[[8,"So they usually end up buying the one in the middle.","그래서 그들은 대개 결국 중간에 있는 것을 사게 된다."],[9,"Companies are aware of this behavior, and they often use it when they market their products.","기업들은 이러한 행동을 알고, 자신들의 제품을 시장에 내놓을 때 흔히 이것을 이용한다."]],"w":"8번에서 쇼핑객들이 결국 중간에 있는 것을 사게 된다고 해요. 기업이 알고 이용하는 this behavior, 즉 it이 바로 그 행동이에요.","c":3},"h":"a3095abcf7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So they usually end up buying the one in the middle.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 그들은 대개 결국 중간에 있는 것을 사게 된다.","opts":["그래서 그들은 대개 가장 싼 것을 사려고 한다.","그래서 그들은 대개 가장 비싼 것을 사려고 한다.","그래서 그들은 중간에 있는 것을 사려다가 포기한다.","그래서 그들은 대개 결국 중간 가격의 것을 사게 된다."],"r":{"a":"4) 그래서 그들은 대개 결국 중간 가격의 것을 사게 된다.","ev":"8번 문장","s":[[8,"So they usually end up buying the one in the middle.","그래서 그들은 대개 결국 중간에 있는 것을 사게 된다."]],"w":"end up v-ing는 '결국 ~하게 되다'예요. the one in the middle은 중간에 있는 제품이에요. 가장 싼 것이나 비싼 것을 산다는 말은 없어요.","c":4},"h":"d093d2b443"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["골디락스는 가장 딱딱한 침대를 골랐다.","원래 제품의 가격은 비싼 것과 싼 것의 딱 중간이다.","쇼핑객들은 대개 가장 비싼 제품을 산다.","비싼 제품과 싼 제품은 원래 제품과 기능이 다르다."],"opts":["Goldilocks chooses the hardest bed.","The price of the original product is right in the middle of the two versions.","Shoppers usually buy the most expensive product.","The expensive and cheap versions have different functions from the original product."],"r":{"a":"2) The price of the original product is right in the middle of the two versions.","ev":"3, 8, 12, 13번 문장","s":[[3,"But the third one is in the middle—neither too hard nor too soft.","그러나 세 번째 침대는 그 중간으로, 너무 딱딱하지도 너무 부드럽지도 않다."],[8,"So they usually end up buying the one in the middle.","그래서 그들은 대개 결국 중간에 있는 것을 사게 된다."],[12,"They simply introduce a more expensive version and a cheaper version of the product with the same function.","그들은 단지 (판매량을 늘리고 싶은 제품과) 동일한 기능을 가진 더 비싼 형태의 제품과 더 저렴한 형태의 제품을 소개한다."],[13,"This encourages more shoppers to buy the original product—the one whose price is right in the middle!","이것은 더 많은 쇼핑객들이 가격이 딱 중간인 원래 제품을 사도록 부추긴다!"]],"w":"3번에서 골디락스는 가운데 침대를 골랐어요. 8번에서 쇼핑객들은 중간에 있는 것을 사요. 12번에서 두 제품은 같은 기능을 가졌어요. 13번에서 원래 제품은 가격이 딱 중간이에요.","c":2},"h":"7e161ab9f1"},{"n":9,"t":"sum","q":"Companies introduce two versions with the (A) function, and this (B) more shoppers to buy the original product.","ko":"기업들은 (A) 기능을 가진 두 가지 형태의 제품을 소개하고, 이것은 더 많은 쇼핑객들이 원래 제품을 사도록 (B).","opts":["(A) same / (B) encourages","(A) same / (B) stops","(A) different / (B) encourages","(A) different / (B) stops","(A) same / (B) forgets"],"oko":["(A) 동일한 / (B) 부추긴다","(A) 동일한 / (B) 막는다","(A) 서로 다른 / (B) 부추긴다","(A) 서로 다른 / (B) 막는다","(A) 동일한 / (B) 잊게 한다"],"r":{"a":"1) (A) same / (B) encourages ((A) 동일한 / (B) 부추긴다)","ev":"12~13번 문장","s":[[12,"They simply introduce a more expensive version and a cheaper version of the product with the same function.","그들은 단지 (판매량을 늘리고 싶은 제품과) 동일한 기능을 가진 더 비싼 형태의 제품과 더 저렴한 형태의 제품을 소개한다."],[13,"This encourages more shoppers to buy the original product—the one whose price is right in the middle!","이것은 더 많은 쇼핑객들이 가격이 딱 중간인 원래 제품을 사도록 부추긴다!"]],"w":"12번 문장에서 동일한 기능(the same function)을 가진 더 비싼 형태와 더 저렴한 형태를 소개한다고 해요. 13번 문장에서 이것이 더 많은 쇼핑객들이 원래 제품을 사도록 부추긴다(encourages)고 해요.","c":1},"h":"a985d3fe89"},{"n":10,"t":"fill","q":"But the third one is in the middle—neither too hard nor too [A]. So that’s the one she [B] to sleep in.","ko":"그러나 세 번째 침대는 그 중간으로, 너무 딱딱하지도 너무 [A] 것도 아니다. 그래서 그녀가 잠을 자기로 [B] 것이 바로 그 침대이다.","bank":["soft","decides","sales","version","strategy","introduce"],"bko":{"soft":"부드러운","decides":"결정하다(주어가 3인칭 단수라 -s)","sales":"판매량","version":"(약간 다른) 형태","strategy":"전략","introduce":"소개하다"},"r":{"a":"[A] soft (부드러운), [B] decides (결정하다(주어가 3인칭 단수라 -s))","ev":"3~4번 문장","s":[[3,"But the third one is in the middle—neither too hard nor too soft.","그러나 세 번째 침대는 그 중간으로, 너무 딱딱하지도 너무 부드럽지도 않다."],[4,"So that’s the one she decides to sleep in.","그래서 그녀가 잠을 자기로 결정한 것이 바로 그 침대이다."]],"w":"3번 문장은 세 번째 침대가 너무 딱딱하지도 너무 부드럽지도 않다는 뜻이에요. 4번 문장은 그래서 그녀가 그 침대에서 자기로 결정한다(decides)는 뜻이고, 주어 she가 3인칭 단수라 decides로 써요.","c":null},"h":"fff4118b66"}]},{"u":8,"id":"nl3-08-1","no":1,"ko":"우주 비행사들의 식사","items":[{"n":1,"t":"tf","q":"In the early days of the space program, astronauts squeezed their food out of tubes.","ko":"우주 탐사 초창기에 우주 비행사들은 튜브에서 음식을 짜냈다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In the early days of the space program, astronauts had to squeeze their food out of tubes.","우주 탐사 초창기에 우주 비행사들은 튜브에서 음식을 짜내야 했다."]],"w":"1번 문장에서 우주 비행사들은 튜브에서 음식을 짜내야 했어요(had to squeeze).","c":"T"},"h":"7b3db5a024"},{"n":2,"t":"tf","q":"Today astronauts can choose from about 15 kinds of food and drinks.","ko":"오늘날 우주 비행사들은 약 15가지의 음식과 음료 중에서 선택할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Today they can choose from about 150 different kinds of food and drinks.","오늘날 그들은 약 150가지의 다양한 종류의 음식과 음료에서 선택할 수 있다."]],"w":"4번 문장에서 약 150가지(about 150)예요. 15가지가 아니에요.","c":"F"},"h":"47f8717460"},{"n":3,"t":"tf","q":"Astronauts try to eat nutritionally balanced meals in order to stay healthy.","ko":"우주 비행사들은 건강하게 지내기 위해 영양상으로 균형 잡힌 식사를 하려고 노력한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"So, astronauts try to eat nutritionally balanced meals in order to stay healthy.","그래서, 우주 비행사들은 건강하게 지내기 위해서 영양상으로 균형 잡힌 식사를 하려고 노력한다."]],"w":"10번 문장 그대로예요. 건강하게 지내기 위해(in order to stay healthy) 균형 잡힌 식사를 하려고 해요.","c":"T"},"h":"5dad7f9500"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the early days of the space program, astronauts had to squeeze their food out of tubes.)","ko":"우주 탐사 초창기에 우주 비행사들은 튜브에서 음식을 ( … ) 했다.","opts":["짜내다","던지다","얼리다","자르다"],"word":"squeeze","r":{"a":"1) 짜내다","ev":"1번 문장","s":[[1,"In the early days of the space program, astronauts had to squeeze their food out of tubes.","우주 탐사 초창기에 우주 비행사들은 튜브에서 음식을 짜내야 했다."]],"w":"음식이 튜브 안에 들어 있어서 밖으로 눌러서 꺼내야 해요. 그래서 squeeze는 '짜내다'예요.","c":1},"h":"9d025cc4fb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In zero gravity, astronauts feel full easily because the food they eat floats inside their stomach.)","ko":"무중력 상태에서는 우주 비행사가 먹는 음식이 위 속에서 ( … ) 때문에 그들은 쉽게 배부름을 느낀다.","opts":["가라앉다","떠다니다","녹다","부서지다"],"word":"floats","r":{"a":"2) 떠다니다","ev":"8번 문장","s":[[8,"In zero gravity, astronauts feel full easily because the food they eat floats inside their stomach.","무중력 상태에서는 우주 비행사가 먹는 음식이 위 속에서 떠다니기 때문에 그들은 쉽게 배부름을 느낀다."]],"w":"zero gravity(무중력)에서는 물건이 아래로 가라앉지 않아요. 그래서 음식이 위 속에서 floats, 즉 '떠다니다'예요.","c":2},"h":"adeddc255c"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSince the meals are prepared by excellent cooks on Earth, they are delicious and healthy.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그 음식들은 지구에서 훌륭한 요리사들에 의해 준비되기 때문에 맛있고 건강에 좋다.","pron":"they","opts":["우주 비행사들","음식들(the meals)","요리사들","튜브들"],"r":{"a":"2) 음식들(the meals)","ev":"6번 문장","s":[[6,"Since the meals are prepared by excellent cooks on Earth, they are delicious and healthy.","그 음식들은 지구에서 훌륭한 요리사들에 의해 준비되기 때문에 맛있고 건강에 좋다."]],"w":"they are delicious and healthy는 “그것들은 맛있고 건강에 좋다”는 뜻이에요. 맛있고 건강에 좋은 것은 앞에 나온 the meals(음식들)이에요. 그래서 they = the meals예요.","c":2,"k":"they = 음식들(the meals)"},"h":"74c87e8fba"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The food that astronauts eat today is much better than before.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오늘날 우주 비행사들이 먹는 음식은 예전보다 훨씬 더 좋다.","opts":["오늘날 우주 비행사들이 먹는 음식은 예전보다 훨씬 맛이 없다.","예전 우주 비행사들의 음식이 지금보다 훨씬 더 좋았다.","오늘날 우주 비행사들은 예전보다 훨씬 많이 먹는다.","오늘날 우주 비행사들이 먹는 음식은 예전보다 훨씬 더 좋다."],"r":{"a":"4) 오늘날 우주 비행사들이 먹는 음식은 예전보다 훨씬 더 좋다.","ev":"3번 문장","s":[[3,"The food that astronauts eat today is much better than before.","오늘날 우주 비행사들이 먹는 음식은 예전보다 훨씬 더 좋다."]],"w":"much better than before는 '예전보다 훨씬 더 좋다'예요. 예전에는 튜브 음식이라 맛이 별로였다는 2번과 이어져요.","c":4},"h":"23a16f16ac"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["오늘날 우주 비행사들은 튜브에 든 음식만 먹을 수 있다.","오늘날 우주 비행사들은 닭고기덮밥, 애플파이, 레모네이드 같은 것을 먹을 수 있다.","우주 비행사들의 음식은 우주에 있는 요리사들이 만든다.","우주 비행사들은 무중력 상태에서 절대 배부름을 느끼지 못한다."],"opts":["Astronauts today can only eat food from tubes.","Astronauts today can eat things like chicken and rice, apple pie, and lemonade.","Astronauts’ food is made by cooks in space.","Astronauts never feel full in zero gravity."],"r":{"a":"2) Astronauts today can eat things like chicken and rice, apple pie, and lemonade.","ev":"1, 4, 5, 6, 8번 문장","s":[[1,"In the early days of the space program, astronauts had to squeeze their food out of tubes.","우주 탐사 초창기에 우주 비행사들은 튜브에서 음식을 짜내야 했다."],[4,"Today they can choose from about 150 different kinds of food and drinks.","오늘날 그들은 약 150가지의 다양한 종류의 음식과 음료에서 선택할 수 있다."],[5,"These include chicken and rice, strawberry yogurt, apple pie, lemonade, and other tasty things.","여기에는 닭고기덮밥, 딸기 요거트, 애플파이, 레모네이드, 그리고 다른 맛있는 것들이 포함되어 있다."],[6,"Since the meals are prepared by excellent cooks on Earth, they are delicious and healthy.","그 음식들은 지구에서 훌륭한 요리사들에 의해 준비되기 때문에 맛있고 건강에 좋다."],[8,"In zero gravity, astronauts feel full easily because the food they eat floats inside their stomach.","무중력 상태에서는 우주 비행사가 먹는 음식이 위 속에서 떠다니기 때문에 그들은 쉽게 배부름을 느낀다."]],"w":"1번의 튜브 음식은 초창기 이야기예요. 5번에서 닭고기덮밥, 애플파이, 레모네이드가 나와요. 6번에서 요리사들은 지구에 있고, 8번에서 오히려 쉽게 배부름을 느껴요.","c":2},"h":"ea1ab34654"},{"n":9,"t":"sum","q":"In zero gravity, the food in the stomach (A) the brain, so astronauts think they (B) enough.","ko":"무중력 상태에서 위 속의 음식이 뇌를 (A), 그래서 우주 비행사들은 충분히 (B) 생각한다.","opts":["(A) tricks / (B) ate","(A) tricks / (B) forgot","(A) helps / (B) ate","(A) helps / (B) forgot","(A) tricks / (B) cooked"],"oko":["(A) 속이고 / (B) 먹었다고","(A) 속이고 / (B) 잊었다고","(A) 도와주고 / (B) 먹었다고","(A) 도와주고 / (B) 잊었다고","(A) 속이고 / (B) 요리했다고"],"r":{"a":"1) (A) tricks / (B) ate ((A) 속이고 / (B) 먹었다고)","ev":"8~9번 문장","s":[[8,"In zero gravity, astronauts feel full easily because the food they eat floats inside their stomach.","무중력 상태에서는 우주 비행사가 먹는 음식이 위 속에서 떠다니기 때문에 그들은 쉽게 배부름을 느낀다."],[9,"This tricks their brain and makes them think they ate enough.","이것은 그들의 뇌를 속이고 그들이 충분히 먹었다고 생각하게 한다."]],"w":"8번 문장에서 무중력 상태에서는 음식이 위 속에서 떠다녀 쉽게 배부름을 느낀다고 해요. 9번 문장에서 이것이 뇌를 속여서(tricks) 충분히 먹었다(ate)고 생각하게 한다고 해요.","c":1},"h":"aa0df92c38"},{"n":10,"t":"fill","q":"There is [A] one small [B], though.","ko":"그러나 [A] 한 가지 작은 [B]이(가) 있다.","bank":["still","problem","delicious","enough","nutritionally","excellent"],"bko":{"still":"아직도","problem":"문제","delicious":"맛있는","enough":"충분한","nutritionally":"영양상으로","excellent":"훌륭한"},"r":{"a":"[A] still (아직도), [B] problem (문제)","ev":"7번 문장","s":[[7,"There is still one small problem, though.","그러나 아직도 한 가지 작은 문제점이 있다."]],"w":"7번 문장은 “그러나 아직도 한 가지 작은 문제가 있다”는 뜻이에요. still은 “아직도”, problem은 “문제”예요.","c":null},"h":"8601b7837d"}]},{"u":8,"id":"nl3-08-2","no":2,"ko":"교장 선생님이 왜 머리를 밀었을까?","items":[{"n":1,"t":"tf","q":"Jackson shaved the head of his principal.","ko":"Jackson은 자신의 교장 선생님의 머리를 밀었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"A student named Jackson shaved his principal’s head!","Jackson(잭슨)이라는 한 학생이 그의 교장 선생님의 머리카락을 밀어 버린 것이다!"]],"w":"2번 문장 그대로예요. A student named Jackson shaved his principal's head.","c":"T"},"h":"f7dd977c13"},{"n":2,"t":"tf","q":"Jackson’s grandfather had a cold and lost his hair.","ko":"Jackson의 할아버지는 감기에 걸려 머리카락이 빠졌다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"His grandfather had been suffering from cancer, and all of his hair had fallen out.","그의 할아버지는 암을 계속 앓아 왔었고, 머리카락이 모두 빠져 버렸다."]],"w":"5번 문장에서 할아버지는 암(cancer)을 앓았고 머리카락이 모두 빠졌어요. 감기가 아니에요.","c":"F"},"h":"d219c496de"},{"n":3,"t":"tf","q":"Jackson’s classmates bullied him when he arrived at school with a shaved head.","ko":"Jackson이 삭발한 채로 학교에 도착했을 때 반 친구들은 그를 괴롭혔다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"When he arrived at school with a shaved head, his classmates bullied him.","그가 삭발한 채로 학교에 도착했을 때, 반 친구들은 그를 괴롭혔다."]],"w":"7번 문장 그대로예요. 삭발하고 오자 반 친구들이 괴롭혔어요.","c":"T"},"h":"5b1562841c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day at Pekin Middle School in Iowa, a shocking event happened.)","ko":"어느 날, Iowa에 있는 Pekin 중학교에서 ( … ) 사건이 일어났다.","opts":["평범한","즐거운","충격적인","조용한"],"word":"shocking","r":{"a":"3) 충격적인","ev":"1번 문장","s":[[1,"One day at Pekin Middle School in Iowa, a shocking event happened.","어느 날, Iowa(아이오와)에 있는 Pekin(페킨) 중학교에서 충격적인 사건이 일어났다."]],"w":"학생이 교장 선생님의 머리를 밀어 버린 사건(2번)이에요. 깜짝 놀랄 일이니 shocking은 '충격적인'이에요.","c":3},"h":"6b0c8304b1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Principal Hadley was very upset that Jackson was teased for supporting his grandfather.)","ko":"Hadley 교장은 Jackson이 할아버지를 응원한 것으로 놀림 받은 것에 무척 ( … ).","opts":["기쁜","화가 난","지루한","자랑스러운"],"word":"upset","r":{"a":"2) 화가 난","ev":"9번 문장","s":[[9,"Principal Hadley was very upset that Jackson was teased for supporting his grandfather.","Hadley 교장은 그가 할아버지를 응원한 것으로 놀림 받은 것에 무척 화가 났다."]],"w":"할아버지를 응원한 Jackson이 놀림을 받았어요. 그래서 교장이 10번처럼 행동한 거예요. upset은 '화가 난'이에요.","c":2},"h":"bc0b147cce"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nPrincipal Hadley wanted to send a strong message to the students who teased Jackson. He was hoping to show them the importance of treating others with kindness and respect.","ko":"밑줄 친 them이 가리키는 것은?","sko":"Hadley 교장은 Jackson을 놀린 학생들에게 강한 메시지를 전달하고 싶었다. 그는 학생들에게 다른 사람들을 친절과 존중으로 대하는 것의 중요성을 보여 주길 바라고 있었던 것이다.","pron":"them","opts":["Jackson의 가족","Hadley 교장과 Jackson","Jackson을 놀린 학생들","Jackson의 할아버지와 엄마"],"r":{"a":"3) Jackson을 놀린 학생들","ev":"11~12번 문장","s":[[11,"Principal Hadley wanted to send a strong message to the students who teased Jackson.","Hadley 교장은 Jackson을 놀린 학생들에게 강한 메시지를 전달하고 싶었다."],[12,"He was hoping to show them the importance of treating others with kindness and respect.","그는 학생들에게 다른 사람들을 친절과 존중으로 대하는 것의 중요성을 보여 주길 바라고 있었던 것이다."]],"w":"11번 문장에서 Hadley 교장이 강한 메시지를 전하려는 대상은 Jackson을 놀린 학생들이에요. 12번 문장의 show them은 “그들에게 보여 주다”이므로 them = 그 학생들이에요.","c":3,"k":"them = Jackson을 놀린 학생들"},"h":"03e567f323"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So he asked Jackson to shave his head!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 그는 Jackson에게 자신의 머리를 밀어달라고 부탁했다!","opts":["그래서 그는 Jackson에게 자신의 머리를 밀어 달라고 부탁했다!","그래서 그는 Jackson에게 머리를 기르라고 말했다!","그래서 그는 Jackson의 머리를 직접 밀어 주었다!","그래서 Jackson은 그에게 머리를 밀어 달라고 부탁했다!"],"r":{"a":"1) 그래서 그는 Jackson에게 자신의 머리를 밀어 달라고 부탁했다!","ev":"10번 문장","s":[[10,"So he asked Jackson to shave his head!","그래서 그는 Jackson에게 자신의 머리를 밀어달라고 부탁했다!"]],"w":"So he asked Jackson to shave his head!에서 he는 Hadley 교장이에요. ask A to B는 “A에게 B해 달라고 부탁하다”라서 “Jackson에게 자신의 머리를 밀어 달라고 부탁했다”는 뜻이에요.","c":1},"h":"ed8376f065"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Jackson shaved his head a few days before the event.","Jackson shaved his head to join a sports team.","Principal Hadley asked Jackson’s classmates to shave their heads.","Jackson’s grandfather first shaved Jackson’s head."],"oko":["Jackson은 그 사건이 있기 며칠 전에 머리를 밀었다.","Jackson은 운동부에 들어가려고 머리를 밀었다.","Hadley 교장은 반 친구들에게 머리를 밀라고 부탁했다.","Jackson의 할아버지가 먼저 Jackson의 머리를 밀어 주었다."],"r":{"a":"1) Jackson shaved his head a few days before the event. (Jackson은 그 사건이 있기 며칠 전에 머리를 밀었다.)","ev":"4번 문장","s":[[4,"A few days before the event, he shaved his own head.","그 사건이 있기 며칠 전에, Jackson은 자신의 머리를 밀었다."]],"w":"4번 문장에서 사건이 있기 며칠 전에 Jackson이 자신의 머리를 밀었다고 해요. 6번 문장에서 할아버지를 응원하려고 민 것이라고 했으니 운동부에 들어가려는 것이 아니에요.","c":1},"h":"98aaa5d054"},{"n":9,"t":"sum","q":"Jackson shaved his (A) head to (B) his grandfather up.","ko":"Jackson은 할아버지를 (B) 위해 (A) 머리를 밀었다.","opts":["(A) own / (B) cheer","(A) own / (B) scare","(A) friend’s / (B) cheer","(A) friend’s / (B) scare","(A) principal’s / (B) cheer"],"oko":["(A) 자신의 / (B) 기운 나게 하기","(A) 자신의 / (B) 놀라게 하기","(A) 친구의 / (B) 기운 나게 하기","(A) 친구의 / (B) 놀라게 하기","(A) 교장 선생님의 / (B) 기운 나게 하기"],"r":{"a":"1) (A) own / (B) cheer ((A) 자신의 / (B) 기운 나게 하기)","ev":"6번 문장","s":[[6,"So Jackson shaved his own head to cheer him up.","그래서 Jackson은 그에게 기운을 북돋아 드리기 위해 자신의 머리를 밀었다."]],"w":"6번 문장에서 Jackson은 할아버지의 기운을 북돋아 드리기 위해(to cheer him up) 자신의 머리(his own head)를 밀었다고 해요.","c":1},"h":"875a007c4b"},{"n":10,"t":"fill","q":"Jackson’s [B] called the school and [A] Principal Hadley what had happened.","ko":"Jackson의 [B]은(는) 학교에 전화하여 Hadley 교장에게 무슨 일이 있었는지 [A].","bank":["told","mom","shaved","teased","smiled","arrived"],"bko":{"told":"이야기했다(tell의 과거)","mom":"엄마","shaved":"밀었다","teased":"놀렸다","smiled":"미소 지었다","arrived":"도착했다"},"r":{"a":"[A] told (이야기했다(tell의 과거)), [B] mom (엄마)","ev":"8번 문장","s":[[8,"Jackson’s mom called the school and told Principal Hadley what had happened.","Jackson의 엄마는 학교에 전화하여 Hadley(하들리) 교장에게 무슨 일이 있었는지 이야기했다."]],"w":"8번 문장은 “Jackson의 엄마는 학교에 전화했고 Hadley 교장에게 무슨 일이 있었는지 이야기했다”는 뜻이에요. tell의 과거형은 told예요.","c":null},"h":"04d8d35780"}]},{"u":8,"id":"nl3-08-3","no":3,"ko":"세계에서 가장 높은 폭포는?","items":[{"n":1,"t":"tf","q":"Angel Falls is located in southeastern Venezuela.","ko":"Angel 폭포는 베네수엘라 남동부에 위치해 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It’s Angel Falls, which is located on the Churun River in southeastern Venezuela.","그것은 Angel(엔젤) 폭포로, 베네수엘라 남동부의 Churun(추룬) 강에 위치해 있다."]],"w":"4번 문장 그대로예요. 베네수엘라 남동부의 Churun 강에 있어요.","c":"T"},"h":"7807dd77e8"},{"n":2,"t":"tf","q":"Jimmie Angel first saw the falls from a boat.","ko":"Jimmie Angel은 폭포를 처음에 배에서 보았다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"He first saw the falls from his plane while searching for gold in 1933.","그는 1933년에 금을 찾던 도중 비행기에서 폭포를 처음으로 보았다."]],"w":"7번 문장에서 Angel은 비행기에서(from his plane) 처음 보았어요. 금을 찾던 도중이었어요.","c":"F"},"h":"8ab8935e0d"},{"n":3,"t":"tf","q":"Angel Falls is surrounded by tall mountains and thick jungle.","ko":"Angel 폭포는 높은 산과 울창한 밀림으로 둘러싸여 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Angel Falls is surrounded by tall mountains and thick jungle.","Angel 폭포는 높은 산과 울창한 밀림으로 둘러싸여 있다."]],"w":"12번 문장 그대로예요. 그래서 가는 길이 어려워요.","c":"T"},"h":"97f92d69d9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (After the crash, Angel struggled to survive for eleven days before he was rescued.)","ko":"추락 후, Angel은 구조되기 전 11일 동안 살아남기 위해 ( … ).","opts":["포기했다","분투했다","도착했다","잠들었다"],"word":"struggled","r":{"a":"2) 분투했다","ev":"9번 문장","s":[[9,"After the crash, Angel struggled to survive for eleven days before he was rescued.","추락 후, Angel은 구조되기 전 11일 동안 살아남기 위해 고군분투했다."]],"w":"사고 후 11일 동안 살아남으려고 했고 결국 구조되었어요. 그래서 struggled to survive는 '살아남기 위해 분투했다'예요.","c":2},"h":"2a5f026acf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Angel Falls is surrounded by tall mountains and thick jungle.)","ko":"Angel 폭포는 높은 산과 ( … ) 밀림으로 둘러싸여 있다.","opts":["얇은","건조한","울창한","어두운"],"word":"thick","r":{"a":"3) 울창한","ev":"12번 문장","s":[[12,"Angel Falls is surrounded by tall mountains and thick jungle.","Angel 폭포는 높은 산과 울창한 밀림으로 둘러싸여 있다."]],"w":"jungle(밀림)을 꾸미는 말이에요. 나무가 빽빽한 밀림이라서 가기 힘들다고 이어져요(13~16번). 그래서 thick은 '울창한'이에요.","c":3},"h":"827c49c3e2"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nOne of them is from the air in a small airplane, and the other one is by boat.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그중 하나는 경비행기를 타고 공중으로 가는 것이고, 나머지 하나는 배를 타는 것이다.","opts":["높은 산과 울창한 밀림","Angel 폭포와 Churun 강","전 세계의 관광객들","폭포에 이르는 두 가지 방법"],"r":{"a":"4) 폭포에 이르는 두 가지 방법","ev":"13~14번 문장","s":[[13,"There are only two ways to reach it.","그곳에 이르는 단 두 가지의 방법이 있다."],[14,"One of them is from the air in a small airplane, and the other one is by boat.","그중 하나는 경비행기를 타고 공중으로 가는 것이고, 나머지 하나는 배를 타는 것이다."]],"w":"13번 There are only two ways to reach it에서 이어져요. 그중 하나는 비행기, 나머지는 배이니 them은 폭포에 이르는 두 가지 방법이에요.","c":4},"h":"f483c61d11"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without the crash, this amazing natural site might have never been known to the outside world.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"추락 사고가 없었다면, 이 놀라운 자연 명소는 바깥세상에 알려지지 않았을지도 모른다.","opts":["추락 사고 때문에 이 명소는 바깥세상에 알려지지 않았다.","추락 사고가 없었다면 이 명소는 바깥세상에 알려지지 않았을지도 모른다.","추락 사고가 없었다면 이 명소는 훨씬 일찍 바깥세상에 알려졌을 것이다.","Angel은 추락 사고 후에도 이 명소를 세상에 알리지 않았다."],"r":{"a":"2) 추락 사고가 없었다면 이 명소는 바깥세상에 알려지지 않았을지도 모른다.","ev":"10~11번 문장","s":[[10,"His accident was bad for him, but good for the world.","그의 사고는 그에게는 나쁜 일이었지만 세상을 위해서는 좋은 일이었다."],[11,"Without the crash, this amazing natural site might have never been known to the outside world.","추락 사고가 없었다면, 이 놀라운 자연 명소는 바깥세상에 알려지지 않았을지도 모른다."]],"w":"Without the crash는 '추락 사고가 없었다면'이에요. 사고 덕분에 폭포가 알려졌다는 10번의 good for the world와 이어져요.","c":2},"h":"731389ee2d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Angel Falls is on a river in northern Brazil.","Many tourists from around the world visit Angel Falls each year.","Angel Falls is lower than Niagara Falls.","Jimmie Angel was rescued a day after the crash."],"oko":["Angel 폭포는 브라질 북부의 강에 있다.","전 세계의 많은 관광객들이 매년 Angel 폭포를 방문한다.","Angel 폭포는 나이아가라 폭포보다 낮다.","Jimmie Angel은 비행기 사고 후 하루 만에 구조되었다."],"r":{"a":"2) Many tourists from around the world visit Angel Falls each year. (전 세계의 많은 관광객들이 매년 Angel 폭포를 방문한다.)","ev":"17번 문장","s":[[17,"Despite this, many tourists from all around the world visit the waterfall each year.","그럼에도, 전 세계의 많은 관광객들이 매년 이 폭포를 방문한다."]],"w":"17번 문장에서 전 세계의 많은 관광객들이 매년 이 폭포를 방문한다고 해요. 4번 문장에서 베네수엘라에 있다고 했으니 브라질이라는 1번은 틀려요.","c":2},"h":"86fa86067e"},{"n":9,"t":"sum","q":"Angel Falls is 979 (A) high, and it was (B) after pilot Jimmie Angel.","ko":"Angel 폭포는 높이가 979 (A)이고, 비행사 Jimmie Angel의 이름을 따서 (B).","opts":["(A) meters / (B) named","(A) meters / (B) sold","(A) miles / (B) named","(A) miles / (B) sold","(A) meters / (B) built"],"oko":["(A) 미터 / (B) 이름 붙여졌다","(A) 미터 / (B) 팔렸다","(A) 마일 / (B) 이름 붙여졌다","(A) 마일 / (B) 팔렸다","(A) 미터 / (B) 지어졌다"],"r":{"a":"1) (A) meters / (B) named ((A) 미터 / (B) 이름 붙여졌다)","ev":"5~6번 문장","s":[[5,"Angel Falls is 979 meters high.","Angel 폭포는 979미터 높이이다."],[6,"It was named after pilot Jimmie Angel.","그것은 비행사인 Jimmie Angel(지미 엔젤)의 이름을 따서 이름 붙여졌다."]],"w":"5번 문장에서 Angel 폭포는 979미터(meters) 높이라고 해요. 6번 문장에서 비행사 Jimmie Angel의 이름을 따서 이름 붙여졌다(was named)고 해요.","c":1},"h":"793e4a3b34"},{"n":10,"t":"fill","q":"Do you [A] what the [B] waterfall in the world is?","ko":"당신은 세계에서 [B] 폭포가 무엇인지 [A]?","bank":["know","highest","plane","boat","rescued","jungle"],"bko":{"know":"알다","highest":"가장 높은","plane":"비행기","boat":"배","rescued":"구조된","jungle":"밀림, 정글"},"r":{"a":"[A] know (알다), [B] highest (가장 높은)","ev":"1번 문장","s":[[1,"Do you know what the highest waterfall in the world is?","세계에서 가장 높은 폭포가 무엇인지 아는가?"]],"w":"1번 문장은 “세계에서 가장 높은 폭포가 무엇인지 아는가?”라는 뜻이에요. Do you know ~?는 “~을 아는가?”이고, the highest는 “가장 높은”이라는 최상급이에요.","c":null},"h":"5e8030bd8e"}]},{"u":8,"id":"nl3-08-4","no":4,"ko":"이럴 땐 내가 아닌 것 같아!","items":[{"n":1,"t":"tf","q":"When Jisoo speaks English, she feels outgoing and confident.","ko":"지수는 영어를 말할 때 외향적이고 자신감이 넘친다고 느낀다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"However, when she speaks English, she feels outgoing and confident.","그러나 그녀가 영어를 말할 때면, 그녀는 외향적이고 자신감이 넘친다."]],"w":"4번 문장 그대로예요. However 뒤에 영어를 말할 때의 느낌이 나와요.","c":"T"},"h":"56a874564a"},{"n":2,"t":"tf","q":"The Mexican Americans took the personality test first in Spanish and then in English.","ko":"멕시코계 미국인들은 성격 검사를 먼저 스페인어로, 그다음 영어로 받았다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"First they took it in English, and then they took it in Spanish.","우선 그들은 영어로 검사를 받았고 그 다음 스페인어로 검사를 받았다."]],"w"
