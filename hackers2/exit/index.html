ll},"h":"97f1d59491"}]},{"u":3,"id":"hk2-03-4","no":4,"ko":"바다 괴물이 나타났다?!","items":[{"n":1,"t":"tf","q":"In the film series, a huge sea creature destroys ships with its long tentacles.","ko":"그 영화 시리즈에서 거대한 바다 생물이 긴 촉수로 배들을 파괴한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In the famous film series, Pirates of the Caribbean, a huge sea creature destroys ships with its long tentacles.","<캐리비안의 해적>이라는 유명한 영화 시리즈에서, 거대한 바다 생물이 긴 촉수로 배들을 파괴한다."]],"w":"1번에서 <캐리비안의 해적> 영화 시리즈에 긴 촉수로 배를 파괴하는 거대한 바다 생물이 나와요.","c":"T"},"h":"3a7d398dd0"},{"n":2,"t":"tf","q":"Scientists know exactly how big the giant squid can grow.","ko":"과학자들은 대왕오징어가 얼마나 크게 자랄 수 있는지 정확히 안다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"But no one knows how big the giant squid can grow.","그러나 대왕오징어가 얼마나 크게 자랄 수 있는지는 아무도 모른다."]],"w":"8번에서 대왕오징어가 얼마나 크게 자랄 수 있는지는 아무도 모른다(no one knows)고 해요.","c":"F"},"h":"c9fa1a5d72"},{"n":3,"t":"tf","q":"Some sailors said the Kraken had attacked them.","ko":"몇몇 선원들은 크라켄이 그들을 공격했다고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Some of them even said it had attacked them!","그들 중 몇몇은 심지어 그것이 그들을 공격했다고 말했다!"]],"w":"5번에서 그들 중 몇몇은 심지어 그것(크라켄)이 그들을 공격했다고 말했다고 해요.","c":"T"},"h":"180873e13c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But many sailors in the past insisted they had seen the real Kraken.)","ko":"그러나 과거에 많은 선원들은 그들이 진짜 크라켄을 봤다고 ( ).","word":"insisted","opts":["부인했다","주장했다","궁금해했다","숨겼다"],"r":{"a":"2) 주장했다","ev":"4번 문장","s":[[4,"But many sailors in the past insisted they had seen the real Kraken.","그러나 과거에 많은 선원들은 그들이 진짜 크라켄을 봤다고 주장했다."]],"w":"신화로만 알려졌던 크라켄을 많은 선원들이 직접 봤다고 말했어요. insist는 자기 생각을 강하게 말하는 '주장하다'예요.","c":2},"h":"4ef81f0ed7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is a legendary monster called the Kraken.)","ko":"그것은 크라켄이라고 불리는 ( ) 괴물이다.","word":"legendary","opts":["평범한","새로운","전설 속의","위험한"],"r":{"a":"3) 전설 속의","ev":"2번 문장","s":[[2,"It is a legendary monster called the Kraken.","그것은 크라켄이라고 불리는 전설 속의 괴물이다."]],"w":"3번에서 크라켄이 고대 신화에서 시작되었다고 해요. 그러니 legendary는 신화나 전설로 전해지는 '전설 속의'라는 뜻이에요.","c":3},"h":"bcfe78b199"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSome of them even said it had attacked them!","ko":"밑줄 친 it이 가리키는 것은?","sko":"그들 중 몇몇은 심지어 그것이 그들을 공격했다고 말했다!","opts":["진짜 크라켄","선원들의 배","대왕오징어","영화 시리즈"],"r":{"a":"1) 진짜 크라켄","ev":"4~5번 문장","s":[[4,"But many sailors in the past insisted they had seen the real Kraken.","그러나 과거에 많은 선원들은 그들이 진짜 크라켄을 봤다고 주장했다."],[5,"Some of them even said it had attacked them!","그들 중 몇몇은 심지어 그것이 그들을 공격했다고 말했다!"]],"w":"4번에서 선원들은 진짜 크라켄을 봤다고 주장했어요. 5번의 it은 그 진짜 크라켄이고, 일부 선원들은 그것이 자신들을 공격했다고 말했어요.","c":1},"h":"feb8ad9f19"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, what many people know as the Kraken may be this monster-like creature.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서, 많은 사람들이 크라켄이라고 아는 것은 이 괴물 같은 생물일지도 모른다.","opts":["크라켄을 아는 사람은 이 괴물 같은 생물밖에 없다.","이 괴물 같은 생물은 크라켄 때문에 유명해졌다.","많은 사람들은 이 괴물 같은 생물을 크라켄이라고 부르지 못하게 했다.","많은 사람들이 크라켄이라고 아는 것은 이 괴물 같은 생물일지도 모른다."],"r":{"a":"4) 많은 사람들이 크라켄이라고 아는 것은 이 괴물 같은 생물일지도 모른다.","ev":"11번 문장","s":[[11,"So, what many people know as the Kraken may be this monster-like creature.","그래서, 많은 사람들이 크라켄이라고 아는 것은 이 괴물 같은 생물일지도 모른다."]],"w":"11번은 사람들이 크라켄이라고 알고 있는 것이 대왕오징어 같은 괴물 같은 생물일지도 모른다는 결론이에요. what ~ Kraken이 문장의 주어, may be는 '~일지도 모른다'예요.","c":4},"h":"f7de710537"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["크라켄은 영화 시리즈에서 처음 목격되었다.","대왕오징어는 때때로 가까이 오는 배를 공격한다.","대왕오징어는 수면 가까이에 산다.","어떤 선원도 크라켄이 자신들을 공격했다고 말한 적이 없다."],"opts":["The Kraken was first seen in a film series.","Giant squid sometimes attack ships that come near them.","Giant squid live near the surface of the water.","No sailor ever said the Kraken attacked them."],"r":{"a":"2) Giant squid sometimes attack ships that come near them.","ev":"10번 문장","s":[[10,"However, they sometimes attack ships that come near them.","하지만, 그것들은 때때로 그것들 가까이에 오는 배를 공격한다."]],"w":"10번에서 대왕오징어가 때때로 가까이 오는 배를 공격한다고 해요. 크라켄은 신화에서 시작했고(3번), 대왕오징어는 300~600미터 깊이에 살며(9번), 일부 선원은 공격받았다고 말했어요(5번).","c":2},"h":"7da0f714ae"},{"n":9,"t":"sum","q":"The Kraken comes from ancient (A), but a similar animal, the giant squid, actually (B).","ko":"크라켄은 고대 (A)에서 나왔지만, 비슷한 동물인 대왕오징어는 실제로 (B).","oko":["(A) 영화 / (B) 사라졌다","(A) 배 / (B) 존재한다","(A) 영화 / (B) 존재한다","(A) 신화 / (B) 사라졌다","(A) 신화 / (B) 존재한다"],"opts":["(A) films / (B) disappeared","(A) ships / (B) exists","(A) films / (B) exists","(A) myths / (B) disappeared","(A) myths / (B) exists"],"r":{"a":"5) (A) myths / (B) exists","ev":"3번, 6번 문장","s":[[3,"The Kraken originated from ancient myths about the ocean.","크라켄은 바다에 관한 고대 신화에서 기원했다."],[6,"In fact, a similar animal actually exists —the giant squid.","사실, 대왕오징어라는 비슷한 동물이 실제로 존재한다."]],"w":"3번에서 크라켄은 고대 신화(myths)에서 기원했고, 6번에서 비슷한 동물인 대왕오징어가 실제로 존재한다(exists)고 해요.","c":5},"h":"8f4d76e3ce"},{"n":10,"t":"fill","q":"Giant squid live [A] at depths of 300 to 600 meters, so they are [B] seen.","ko":"대왕오징어는 300미터에서 600미터 깊이의 [A] 살아서 [B] 보인다.","bank":["underwater","rarely","huge","ancient","similar","legendary"],"bko":{"underwater":"물속에","rarely":"드물게","huge":"거대한","ancient":"고대의","similar":"비슷한","legendary":"전설 속의"},"r":{"a":"[A] underwater, [B] rarely","ev":"9번 문장","s":[[9,"These squid live underwater at depths between 300 and 600 meters, so they are rarely seen.","이 오징어들은 300미터에서 600미터 깊이의 물속에 살아서, 드물게 모습을 보인다."]],"w":"9번에서 대왕오징어는 깊은 물속에(underwater) 살기 때문에 드물게(rarely) 보인다고 해요. huge, ancient, similar, legendary는 형용사라서 이 두 자리에 들어갈 수 없어요.","c":null},"h":"ee63760c5e"}]},{"u":4,"id":"hk2-04-1","no":1,"ko":"“메두사” 호수를 아시나요?","items":[{"n":1,"t":"tf","q":"Lake Natron is known as the lake of Medusa.","ko":"나트론 호수는 메두사의 호수라고 알려져 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Lake Natron is known as the lake of Medusa.","나트론 호수는 메두사의 호수라고 알려져 있다."]],"w":"1번에 Lake Natron is known as the lake of Medusa가 그대로 나와요.","c":"T"},"h":"3d2b1f5daf"},{"n":2,"t":"tf","q":"The dead animals by the lake looked soft like typical dead animals.","ko":"호숫가의 죽은 동물들은 일반적인 죽은 동물들처럼 부드러워 보였다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"However, they did not seem like typical dead animals.","하지만, 그것들은 일반적인 죽은 동물들처럼 보이지 않았다."],[6,"Their bodies were dried up and as hard as rocks, so they looked like stone sculptures!","그것들의 몸은 메말라 있었고 바위만큼 딱딱해서, 마치 돌 조각처럼 보였다!"]],"w":"5번에서 일반적인 죽은 동물들처럼 보이지 않았다고 하고, 6번에서 몸이 바싹 말라 바위만큼 딱딱했다고 해요.","c":"F"},"h":"5d534ffe31"},{"n":3,"t":"tf","q":"A photographer saw dead bats and birds along the shore of the lake.","ko":"한 사진사는 호숫가를 따라 죽은 박쥐와 새를 보았다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"One day, a photographer traveling in Africa saw this unusual lake.","어느 날, 아프리카를 여행하던 사진사가 이 독특한 호수를 봤다."],[4,"There were all kinds of dead bats and birds along the shore.","호숫가를 따라 온갖 종류의 죽은 박쥐와 새가 있었다."]],"w":"3번에서 사진사가 호수를 봤고, 4번에서 호숫가를 따라 온갖 종류의 죽은 박쥐와 새가 있었다고 해요.","c":"T"},"h":"2db029d5e4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, they did not seem like typical dead animals.)","ko":"하지만, 그것들은 ( ) 죽은 동물들처럼 보이지 않았다.","word":"typical","opts":["일반적인","특별한","새로운","작은"],"r":{"a":"1) 일반적인","ev":"5번 문장","s":[[5,"However, they did not seem like typical dead animals.","하지만, 그것들은 일반적인 죽은 동물들처럼 보이지 않았다."]],"w":"5번의 However 뒤에서 이 동물들이 6번처럼 돌 조각 같다고 해요. 보통의 죽은 동물과 달랐다는 뜻이니 typical은 '일반적인'이에요.","c":1},"h":"04c4e52c42"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, the saltwater absorbs the moisture from the dead bodies of animals.)","ko":"그래서, 염수는 죽은 동물들의 몸에서 수분을 ( ).","word":"absorbs","opts":["더한다","빨아들인다","얼린다","씻어낸다"],"r":{"a":"2) 빨아들인다","ev":"11번 문장","s":[[11,"So, the saltwater absorbs the moisture from the dead bodies of animals.","그래서, 그 염수는 죽은 동물들의 몸에서 수분을 빨아들인다."]],"w":"11번의 결과로 12번에서 사체가 꼭 미라처럼 남아요. 몸에서 수분이 빠져나가야 마르므로 absorb는 '빨아들이다'예요.","c":2},"h":"3fb4eee24d"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is high enough to cause burns and eventually kill animals.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 화상을 야기해서 결국 동물들을 죽일 만큼 충분히 높다.","opts":["나트론 호수의 pH 농도","죽은 박쥐와 새","호숫가","메두사"],"r":{"a":"1) 나트론 호수의 pH 농도","ev":"8~9번 문장","s":[[8,"This is because Lake Natron has a pH level of 10.5.","이것은 나트론 호수가 10.5의 pH 농도를 가지고 있기 때문이다."],[9,"It is high enough to cause burns and eventually kill animals.","그것은 화상을 야기해서 결국 동물들을 죽일 만큼 충분히 높다."]],"w":"8번에서 호수가 pH 농도 10.5를 가졌다고 했어요. 9번의 It은 그 pH 농도이고, 화상을 일으켜 동물을 죽일 만큼 높다는 말이에요.","c":1},"h":"9001e997b0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This causes them to remain in the same condition, exactly like a mummy!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 꼭 미라처럼, 동물의 사체를 똑같은 상태로 남아있게 만든다!","opts":["이것은 동물들이 미라를 피해 같은 곳에 머물게 한다.","이것은 동물들의 사체가 빨리 썩어 사라지게 한다.","이것은 동물들의 사체가 꼭 미라처럼 똑같은 상태로 남아 있게 한다.","이것은 미라가 동물들처럼 살아 움직이게 한다."],"r":{"a":"3) 이것은 동물들의 사체가 꼭 미라처럼 똑같은 상태로 남아 있게 한다.","ev":"12번 문장","s":[[12,"This causes them to remain in the same condition, exactly like a mummy!","이것은 꼭 미라처럼, 동물의 사체를 똑같은 상태로 남아있게 만든다!"]],"w":"12번은 염수가 수분을 빨아들인 결과, 사체가 변하지 않고 미라처럼 남는다는 뜻이에요. 썩어 사라진다는 말은 반대예요.","c":3},"h":"a75a274968"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["호수의 pH 농도는 5.5이다.","호숫가의 동물들은 추운 날씨 때문에 죽었다.","죽은 동물들의 몸은 부드럽고 축축했다.","호수에는 많은 양의 염분이 있다."],"opts":["The lake has a pH level of 5.5.","The animals near the lake died because of cold weather.","The bodies of the dead animals were soft and wet.","The lake has a high amount of salt."],"r":{"a":"4) The lake has a high amount of salt.","ev":"10번 문장","s":[[10,"In addition, the lake has a high amount of salt.","게다가, 호수에는 많은 양의 염분이 있다."]],"w":"10번에서 호수에 많은 양의 염분이 있다고 해요. pH 농도는 10.5이고(8번), 동물들은 호수 때문에 죽었으며(7번), 몸은 바싹 마르고 딱딱했어요(6번).","c":4},"h":"9952228697"},{"n":9,"t":"sum","q":"Lake Natron has a very high (A) level, which can cause (B) and kill animals.","ko":"나트론 호수는 매우 높은 (A) 농도를 가지고 있고, 이것은 (B)을 일으켜 동물들을 죽일 수 있다.","oko":["(A) 온도 / (B) 화상","(A) pH / (B) 화상","(A) pH / (B) 색깔","(A) 소리 / (B) 화상","(A) 염분 / (B) 비"],"opts":["(A) temperature / (B) burns","(A) pH / (B) burns","(A) pH / (B) colors","(A) sound / (B) burns","(A) salt / (B) rain"],"r":{"a":"2) (A) pH / (B) burns","ev":"8~9번 문장","s":[[8,"This is because Lake Natron has a pH level of 10.5.","이것은 나트론 호수가 10.5의 pH 농도를 가지고 있기 때문이다."],[9,"It is high enough to cause burns and eventually kill animals.","그것은 화상을 야기해서 결국 동물들을 죽일 만큼 충분히 높다."]],"w":"8번에서 호수의 pH 농도가 10.5이고, 9번에서 그것이 화상(burns)을 일으켜 결국 동물을 죽일 만큼 높다고 해요.","c":2},"h":"d0f4ca7d72"},{"n":10,"t":"fill","q":"The [A] absorbs moisture from dead animals, so their bodies remain in the same condition, exactly like a [B].","ko":"[A]는 죽은 동물들에게서 수분을 빨아들여서, 그들의 몸은 꼭 [B]처럼 똑같은 상태로 남는다.","bank":["saltwater","mummy","typical","unusual","dried","hard"],"bko":{"saltwater":"염수","mummy":"미라","typical":"일반적인","unusual":"독특한","dried":"마른","hard":"딱딱한"},"r":{"a":"[A] saltwater, [B] mummy","ev":"11~12번 문장","s":[[11,"So, the saltwater absorbs the moisture from the dead bodies of animals.","그래서, 그 염수는 죽은 동물들의 몸에서 수분을 빨아들인다."],[12,"This causes them to remain in the same condition, exactly like a mummy!","이것은 꼭 미라처럼, 동물의 사체를 똑같은 상태로 남아있게 만든다!"]],"w":"11번에서 염수(saltwater)가 사체의 수분을 빨아들이고, 12번에서 꼭 미라(mummy)처럼 남는다고 해요. typical, unusual, dried, hard는 형용사라서 이 빈칸에 들어갈 수 없어요.","c":null},"h":"ba68b23fc9"}]},{"u":4,"id":"hk2-04-2","no":2,"ko":"니들이 금메달 맛을 알아?","items":[{"n":1,"t":"tf","q":"Olympic champions often bite their gold medals when they pose for photos.","ko":"올림픽 챔피언들은 사진을 위해 자세를 취할 때 종종 금메달을 깨문다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"When Olympic champions pose for photos, they often do one thing: bite their gold medals!","올림픽 챔피언들이 사진을 위해 자세를 취할 때, 그들은 종종 한 가지를 하는데, 금메달을 깨무는 것이다!"]],"w":"1번에서 올림픽 챔피언들이 사진을 위해 자세를 취할 때 종종 금메달을 깨문다고 해요.","c":"T"},"h":"fb19779e84"},{"n":2,"t":"tf","q":"People still use gold coins as money today.","ko":"사람들은 오늘날에도 여전히 금화를 돈으로 사용한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Although people don’t use gold coins anymore, the tradition continues with gold medals.","비록 사람들이 더 이상 금화를 사용하지는 않지만, 그 전통은 금메달과 함께 계속되고 있다."]],"w":"8번에서 사람들은 더 이상(anymore) 금화를 사용하지 않는다고 해요. 전통만 금메달로 이어져요.","c":"F"},"h":"b61be1cb29"},{"n":3,"t":"tf","q":"If you bite an Olympic gold medal, it won’t get marked easily.","ko":"올림픽 금메달을 깨물면 쉽게 자국이 남지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"So when you bite it, it won’t get marked easily.","그래서 그것을 깨물면, 쉽게 자국이 남지 않을 것이다."]],"w":"10번에서 올림픽 금메달을 깨물어도 쉽게 자국이 남지 않을 것이라고 해요.","c":"T"},"h":"d5fcc5a256"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the past, gold coins were commonly used.)","ko":"과거에, 금화는 ( ) 쓰였다.","word":"commonly","opts":["흔히","거의 안","몰래","처음으로"],"r":{"a":"1) 흔히","ev":"3번 문장","s":[[3,"In the past, gold coins were commonly used.","과거에, 금화는 흔히 쓰였다."]],"w":"3번은 과거에 금화가 널리 쓰였다는 말이에요. 다음 4번의 But 앞이므로 널리 쓰였다는 뜻이고, commonly는 '흔히'예요.","c":1},"h":"e867fca0f9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Therefore, to find out if a coin was pure gold or not, the merchant would bite it.)","ko":"그러므로, 동전이 ( ) 금인지 아닌지 알아내기 위해, 상인이 그것을 깨물고는 했다.","word":"pure","opts":["가짜의","순수한","오래된","무거운"],"r":{"a":"2) 순수한","ev":"5번 문장","s":[[5,"Therefore, to find out if a coin was pure gold or not, the merchant would bite it.","그러므로, 동전이 순금인지 아닌지 알아내기 위해, 상인이 그것을 깨물고는 했다."]],"w":"4번에서 다른 금속을 섞은 가짜 금화가 있었어요. 그래서 5번은 다른 금속이 섞이지 않은 '순수한' 금인지 확인하려고 깨문 거예요.","c":2},"h":"c9caf1561d"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nTherefore, to find out if a coin was pure gold or not, the merchant would bite it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그러므로, 동전이 순금인지 아닌지 알아내기 위해, 상인이 그것을 깨물고는 했다.","opts":["동전","상인","구리","금메달"],"r":{"a":"1) 동전","ev":"5번 문장","s":[[5,"Therefore, to find out if a coin was pure gold or not, the merchant would bite it.","그러므로, 동전이 순금인지 아닌지 알아내기 위해, 상인이 그것을 깨물고는 했다."]],"w":"5번에서 상인이 순금인지 아닌지 알아내려고 깨무는 대상은 a coin(동전)이에요.","c":1},"h":"7de68a2ef5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, Olympic gold medals haven’t been made of pure gold since 1912.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 올림픽 금메달은 1912년 이후로 순금으로 만들어지지 않고 있다.","opts":["올림픽 금메달은 1912년에 처음 순금으로 만들어졌다.","올림픽 금메달은 순금으로 만들어져서 1912년 이후 사라졌다.","올림픽 금메달은 1912년 이후로 순금으로 만들어지지 않고 있다.","올림픽 금메달은 1912년 이전에는 순금이 아니었다."],"r":{"a":"3) 올림픽 금메달은 1912년 이후로 순금으로 만들어지지 않고 있다.","ev":"9번 문장","s":[[9,"However, Olympic gold medals haven’t been made of pure gold since 1912.","하지만, 올림픽 금메달은 1912년 이후로 순금으로 만들어지지 않고 있다."]],"w":"haven’t been made of는 '만들어지지 않고 있다'이고 since 1912는 '1912년 이후로'예요. 지금까지 계속 순금이 아니라는 뜻이에요.","c":3},"h":"a0a6b6dfc7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["금은 단단한 금속이라서 잇자국이 남지 않는다.","다른 금속이 든 동전은 뚜렷한 잇자국이 남는다.","상인들은 가짜 금화를 만들려고 동전을 깨물었다.","동전에 다른 금속이 들어 있다면 잇자국이 보이지 않을 것이다."],"opts":["Gold is a hard metal, so teeth marks cannot be left on it.","A coin with other metals leaves clear teeth marks.","Merchants bit coins to make fake gold coins.","If a coin contained other metals, no teeth marks would be seen."],"r":{"a":"4) If a coin contained other metals, no teeth marks would be seen.","ev":"7번 문장","s":[[7,"On the other hand, if the coin contained other metals, no teeth marks would be seen.","반면에, 만약 동전에 다른 금속들이 들어 있다면, 아무런 잇자국도 보이지 않았을 것이다."]],"w":"7번에서 다른 금속이 들어 있는 동전은 잇자국이 보이지 않을 것이라고 해요. 금은 무르고(6번), 상인은 순금인지 알아내려고 깨물었어요(5번).","c":4},"h":"42dab8068a"},{"n":9,"t":"sum","q":"In the past, some bad people added other (A) to gold to make (B) gold coins.","ko":"과거에, 몇몇 못된 사람들은 가짜 금화를 만들기 위해 금에 다른 (A)을 첨가했다.","oko":["(A) 금속 / (B) 순금","(A) 금속 / (B) 가짜","(A) 메달 / (B) 가짜","(A) 이빨 / (B) 순금","(A) 자국 / (B) 가짜"],"opts":["(A) metals / (B) pure","(A) metals / (B) fake","(A) medals / (B) fake","(A) teeth / (B) pure","(A) marks / (B) fake"],"r":{"a":"2) (A) metals / (B) fake","ev":"3~4번 문장","s":[[3,"In the past, gold coins were commonly used.","과거에, 금화는 흔히 쓰였다."],[4,"But some bad people added other metals, such as copper, to make fake gold coins.","그러나 몇몇 못된 사람들은 가짜 금화를 만들기 위해 구리 같은 다른 금속들을 첨가했다."]],"w":"4번에서 못된 사람들이 가짜(fake) 금화를 만들려고 구리 같은 다른 금속(metals)을 첨가했다고 해요.","c":2},"h":"2c951d1afd"},{"n":10,"t":"fill","q":"Since gold is a very [A] metal, biting the coin would leave teeth [B].","ko":"금은 매우 [A] 금속이기 때문에, 동전을 깨무는 것은 이빨 [B]을 남겼을 것이다.","bank":["soft","marks","easily","commonly","therefore","anymore"],"bko":{"soft":"무른","marks":"자국","easily":"쉽게","commonly":"흔히","therefore":"그러므로","anymore":"더 이상"},"r":{"a":"[A] soft, [B] marks","ev":"6번 문장","s":[[6,"Since gold is a very soft metal, biting the coin would leave teeth marks.","금은 매우 무른 금속이기 때문에, 동전을 깨무는 것은 잇자국을 남겼을 것이다."]],"w":"6번에서 금은 매우 무른(soft) 금속이라서 깨물면 잇자국(teeth marks)이 남는다고 해요. easily, commonly, therefore, anymore는 부사라서 금속 앞이나 teeth 뒤에 들어갈 수 없어요.","c":null},"h":"adeebd5bc8"}]},{"u":4,"id":"hk2-04-3","no":3,"ko":"이날만을 기다렸다","items":[{"n":1,"t":"tf","q":"On cheat days, people can eat anything that they want.","ko":"치팅 데이에는 사람들이 원하는 어떤 것이든 먹을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But they can eat anything that they want on cheat days.","그러나 치팅 데이에는 원하는 어떤 것이든 먹을 수 있다."]],"w":"3번에서 치팅 데이에는 원하는 어떤 것이든 먹을 수 있다고 해요.","c":"T"},"h":"588317b677"},{"n":2,"t":"tf","q":"Only athletes have cheat days these days.","ko":"요즘에는 운동선수들만 치팅 데이를 갖는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Now, many people who want to lose weight by dieting have cheat days, too.","이제는, 다이어트로 살을 빼길 원하는 많은 사람들도 치팅 데이를 갖는다."]],"w":"8번에서 이제는 다이어트로 살을 빼길 원하는 많은 사람들도 치팅 데이를 갖는다고 해요.","c":"F"},"h":"9c34918cac"},{"n":3,"t":"tf","q":"A cheat day acts as a reward after following a strict diet for several days.","ko":"치팅 데이는 며칠 동안 엄격한 식단을 따른 후의 보상 역할을 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"A cheat day acts as a reward after following a strict diet for several days.","치팅 데이는 며칠 동안 엄격한 식단을 따른 후의 보상 역할을 한다."]],"w":"9번에 이 문장이 그대로 나와요. 엄격한 식단을 며칠 따른 뒤의 보상이에요.","c":"T"},"h":"b51f5355a0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They usually maintain high-protein diets that help build and repair muscles.)","ko":"그들은 보통 근육을 키우고 회복하는 것을 돕는 고단백 식단을 ( ).","word":"maintain","opts":["유지한다","버린다","바꾼다","구한다"],"r":{"a":"1) 유지한다","ev":"5번 문장","s":[[5,"They usually maintain high-protein diets that help build and repair muscles.","그들은 보통 근육을 키우고 회복하는 것을 돕는 고단백 식단을 유지한다."]],"w":"5번은 선수들이 평소에 하는 식단 이야기이고, 6번 However에서 가끔은 다르게 먹는다고 해요. 그러니 maintain은 평소에 '유지하다'예요.","c":1},"h":"d2a5a9c822"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, it helps relieve stress and gives dieters extra motivation to do well.)","ko":"그래서, 그것은 스트레스를 ( ) 것을 돕고 다이어트 중인 사람들에게 잘하려는 추가적인 동기를 준다.","word":"relieve","opts":["늘리는","완화하는","만드는","기억하는"],"r":{"a":"2) 완화하는","ev":"10번 문장","s":[[10,"So, it helps relieve stress and gives dieters extra motivation to do well.","그래서, 그것은 스트레스 완화를 돕고 다이어트 중인 사람들에게 잘하려는 추가적인 동기를 준다."]],"w":"치팅 데이는 보상이라서(9번) 스트레스를 줄여 주는 방향이에요. relieve는 stress를 '덜어 주다, 완화하다'예요.","c":2},"h":"208bf48447"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nIt also helps them overcome the temptation to eat too much on other days.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그것은 또한 그들이 다른 날에 너무 많이 먹으려는 유혹을 극복하도록 돕는다.","opts":["운동선수들","다이어트 중인 사람들","치팅 데이들","근육들"],"r":{"a":"2) 다이어트 중인 사람들","ev":"10~11번 문장","s":[[10,"So, it helps relieve stress and gives dieters extra motivation to do well.","그래서, 그것은 스트레스 완화를 돕고 다이어트 중인 사람들에게 잘하려는 추가적인 동기를 준다."],[11,"It also helps them overcome the temptation to eat too much on other days.","그것은 또한 그들이 다른 날에 너무 많이 먹으려는 유혹을 극복하도록 돕는다."]],"w":"10번에서 치팅 데이가 gives dieters(다이어트 중인 사람들)에게 동기를 준다고 했어요. 11번의 them은 그 dieters이고, 그들이 과식의 유혹을 이기도록 돕는다는 말이에요.","c":2},"h":"04549f6add"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As long as it is used wisely, a cheat day can help dieters lose weight.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"치팅 데이는 현명하게 쓰이기만 하면, 다이어트 중인 사람들이 살을 빼는 것을 도울 수 있다.","opts":["치팅 데이를 쓰는 한 다이어트 중인 사람들은 살이 찔 수밖에 없다.","치팅 데이를 오래 쓸수록 다이어트 중인 사람들은 더 현명해진다.","현명한 사람들은 치팅 데이 없이도 살을 뺄 수 있다.","치팅 데이는 현명하게 쓰기만 하면 다이어트 중인 사람들이 살을 빼는 데 도움이 될 수 있다."],"r":{"a":"4) 치팅 데이는 현명하게 쓰기만 하면 다이어트 중인 사람들이 살을 빼는 데 도움이 될 수 있다.","ev":"12번 문장","s":[[12,"As long as it is used wisely, a cheat day can help dieters lose weight.","치팅 데이는 현명하게 쓰이기만 하면, 다이어트 중인 사람들이 살을 빼는 것을 도울 수 있다."]],"w":"As long as는 '~하기만 하면'이에요. 치팅 데이를 현명하게 쓴다는 조건 아래에서 살 빼는 것을 도울 수 있다는 뜻이에요.","c":4},"h":"80598d4c81"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["운동선수들은 예외 없이 건강에 좋은 음식만 먹는다.","치팅 데이는 살을 빼려는 사람들을 위해 만들어졌다.","운동선수들은 때때로 지방과 탄수화물이 많은 음식을 먹는다.","치팅 데이는 다이어트 중인 사람들을 살이 더 찌게 한다."],"opts":["Athletes eat only healthy foods without any exceptions.","Cheat days were invented for people who want to lose weight.","Athletes sometimes eat foods with lots of fats and carbohydrates.","A cheat day makes dieters gain more weight."],"r":{"a":"3) Athletes sometimes eat foods with lots of fats and carbohydrates.","ev":"6번 문장","s":[[6,"However, they sometimes eat the foods they want, including those with lots of fats and carbohydrates.","하지만, 그들은 때때로 지방과 탄수화물이 많은 음식을 포함해 원하는 음식을 먹는다."]],"w":"6번에서 선수들은 때때로 지방과 탄수화물이 많은 음식을 포함해 원하는 음식을 먹는다고 해요. 선수들은 예외가 있고(6번), 치팅 데이는 원래 선수들을 위한 것이었어요(4번).","c":3},"h":"828ae63bcb"},{"n":9,"t":"sum","q":"Cheat days were originally for (A), who usually maintain diets high in (B).","ko":"치팅 데이는 원래 (A)를 위한 것이었고, 이들은 보통 (B)가 많은 식단을 유지한다.","oko":["(A) 다이어트 중인 사람 / (B) 단백질","(A) 운동선수 / (B) 지방","(A) 다이어트 중인 사람 / (B) 지방","(A) 어린이 / (B) 탄수화물","(A) 운동선수 / (B) 단백질"],"opts":["(A) dieters / (B) protein","(A) athletes / (B) fat","(A) dieters / (B) fat","(A) children / (B) carbohydrate","(A) athletes / (B) protein"],"r":{"a":"5) (A) athletes / (B) protein","ev":"4~5번 문장","s":[[4,"Originally, cheat days were for athletes.","원래, 치팅 데이는 운동선수들을 위한 것이었다."],[5,"They usually maintain high-protein diets that help build and repair muscles.","그들은 보통 근육을 키우고 회복하는 것을 돕는 고단백 식단을 유지한다."]],"w":"4번에서 치팅 데이는 원래 운동선수들(athletes)을 위한 것이었고, 5번에서 선수들은 보통 고단백(high-protein) 식단을 유지한다고 해요.","c":5},"h":"8ba59fd9cf"},{"n":10,"t":"fill","q":"A cheat day helps dieters [A] stress and [B] the temptation to eat too much.","ko":"치팅 데이는 다이어트 중인 사람들이 스트레스를 [A] 너무 많이 먹으려는 유혹을 [B] 돕는다.","bank":["relieve","overcome","strict","extra","regular","healthy"],"bko":{"relieve":"완화하다","overcome":"극복하다","strict":"엄격한","extra":"추가적인","regular":"평상시의","healthy":"건강에 좋은"},"r":{"a":"[A] relieve, [B] overcome","ev":"10~11번 문장","s":[[10,"So, it helps relieve stress and gives dieters extra motivation to do well.","그래서, 그것은 스트레스 완화를 돕고 다이어트 중인 사람들에게 잘하려는 추가적인 동기를 준다."],[11,"It also helps them overcome the temptation to eat too much on other days.","그것은 또한 그들이 다른 날에 너무 많이 먹으려는 유혹을 극복하도록 돕는다."]],"w":"10번에서 치팅 데이는 스트레스를 완화하고(relieve), 11번에서 과식의 유혹을 극복하도록(overcome) 돕는다고 해요. strict, extra, regular, healthy는 형용사라서 동사 자리에 들어갈 수 없어요.","c":null},"h":"6350e9c79e"}]},{"u":4,"id":"hk2-04-4","no":4,"ko":"그 사람이 바로 나예요...","items":[{"n":1,"t":"tf","q":"Most artists sign all of their artwork.","ko":"대부분의 예술가들은 그들의 모든 예술 작품에 서명을 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Most artists sign all of their artwork.","대부분의 예술가들은 그들의 모든 예술 작품에 서명을 한다."]],"w":"1번에 Most artists sign all of their artwork가 그대로 나와요.","c":"T"},"h":"65bc690b44"},{"n":2,"t":"tf","q":"Michelangelo was already famous when he sculpted the Pietà.","ko":"미켈란젤로는 <피에타>를 조각했을 때 이미 유명했다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"Michelangelo sculpted the Pietà in 1499.","미켈란젤로는 1499년에 <피에타>를 조각했다."],[6,"He was only 24 years old, and not many people knew about him or his work at the time.","그는 겨우 24살이었고, 그 당시 그나 그의 작품에 대해 알고 있는 사람은 많지 않았다."]],"w":"6번에서 그는 겨우 24살이었고 그 당시 그나 그의 작품을 아는 사람이 많지 않았다고 해요.","c":"F"},"h":"8ae1774c9b"},{"n":3,"t":"tf","q":"The words on Mary’s strap say that Gobbo made the Pietà.","ko":"마리아의 띠에 있는 말은 Gobbo가 <피에타>를 만들었다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"On Mary’s shoulder, there is a strap with the words “Michelangelo from Florence made this.”","마리아의 어깨에는, “피렌체 출신의 미켈란젤로가 이것을 만들었다.”라는 말이 있는 띠가 있다."]],"w":"4번에서 띠에는 '피렌체 출신의 미켈란젤로가 이것을 만들었다'라고 쓰여 있어요. Gobbo는 8번에서 누군가가 잘못 말한 이름이에요.","c":"F"},"h":"cfec98a79f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He secretly carved his name upon the statue one night.)","ko":"어느 날 밤 그는 ( ) 조각상에 그의 이름을 새겼다.","word":"secretly","opts":["몰래","크게","천천히","갑자기"],"r":{"a":"1) 몰래","ev":"10번 문장","s":[[10,"He secretly carved his name upon the statue one night.","어느 날 밤 그는 몰래 조각상에 그의 이름을 새겼다."]],"w":"10번은 밤에 이름을 새기는 장면이에요. 아무도 모르게 새겼다는 뜻이라 secretly는 '몰래'예요.","c":1},"h":"89dbed67f9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This made his reputation grow.)","ko":"이것은 그의 ( )이 높아지도록 만들었다.","word":"reputation","opts":["후회","명성","나이","재산"],"r":{"a":"2) 명성","ev":"11번 문장","s":[[11,"This made his reputation grow.","이것은 그의 명성이 높아지도록 만들었다."]],"w":"10번에서 자기 이름을 새겨 사람들이 그가 만든 것을 알게 됐어요. 그래서 11번에서 높아지는 것은 사람들 사이의 평판, 즉 명성이에요.","c":2},"h":"c7533d4243"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nHe was only 24 years old, and not many people knew about him or his work at the time.","ko":"밑줄 친 him이 가리키는 것은?","sko":"그는 겨우 24살이었고, 그 당시 그나 그의 작품에 대해 알고 있는 사람은 많지 않았다.","opts":["미켈란젤로","Gobbo","예수","구경꾼들"],"r":{"a":"1) 미켈란젤로","ev":"5~6번 문장","s":[[5,"Michelangelo sculpted the Pietà in 1499.","미켈란젤로는 1499년에 <피에타>를 조각했다."],[6,"He was only 24 years old, and not many people knew about him or his work at the time.","그는 겨우 24살이었고, 그 당시 그나 그의 작품에 대해 알고 있는 사람은 많지 않았다."]],"w":"5번에서 <피에타>를 조각한 사람은 Michelangelo예요. 6번의 He와 him은 모두 그 미켈란젤로예요.","c":1},"h":"d441009ce8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"God, creator of the world, did not even leave a signature on his creatures, but I did!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"세상의 창조자인 하느님조차도 그의 창조물에 서명을 남기지 않았건만, 내가 서명을 남겼구나!","opts":["하느님은 창조물에 서명을 남겼지만 나는 남기지 않았다.","하느님은 내게 창조물에 서명을 남기라고 말했다.","하느님은 내가 서명을 남긴 것을 칭찬했다.","세상의 창조자인 하느님조차 창조물에 서명을 남기지 않았는데, 나는 남겼다."],"r":{"a":"4) 세상의 창조자인 하느님조차 창조물에 서명을 남기지 않았는데, 나는 남겼다.","ev":"13번 문장","s":[[13,"He said, “God, creator of the world, did not even leave a signature on his creatures, but I did!”","그는 말했다. “세상의 창조자인 하느님조차도 그의 창조물에 서명을 남기지 않았건만, 내가 서명을 남겼구나!”"]],"w":"13번의 did는 앞의 did leave a signature를 대신하는 말이에요. 하느님도 서명을 남기지 않았는데 자신은 남겼다고 후회하는 말이에요.","c":4},"h":"128381605a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["미켈란젤로는 그의 모든 작품에 서명을 했다.","미켈란젤로는 그의 작품 어느 것에도 서명하지 않았다.","미켈란젤로는 그의 작품들 중 <피에타> 하나에만 서명을 했다.","<피에타>는 미켈란젤로와 그의 어머니의 조각상이다."],"opts":["Michelangelo signed all of his works.","Michelangelo did not sign any of his works.","Michelangelo signed only one of his works, the Pietà.","The Pietà is a statue of Michelangelo and his mother."],"r":{"a":"3) Michelangelo signed only one of his works, the Pietà.","ev":"2번 문장","s":[[2,"However, Michelangelo only signed one of his works —the Pietà.","하지만, 미켈란젤로는 그의 작품들 중 <피에타> 하나에만 서명을 했다."]],"w":"2번에서 미켈란젤로는 작품들 중 <피에타> 하나에만 서명을 했다고 해요. 3번에서 <피에타>는 예수와 그의 어머니 마리아의 조각상이에요.","c":3},"h":"41483f8707"},{"n":9,"t":"sum","q":"Michelangelo was (A) when people said another artist made the Pietà, so he (B) carved his name on it one night.","ko":"사람들이 다른 예술가가 <피에타>를 만들었다고 말하자 미켈란젤로는 (A) 어느 날 밤 몰래 (B) 그것에 이름을 새겼다.","oko":["(A) 기뻐서 / (B) 몰래","(A) 기쁘지 않아서 / (B) 공개적으로","(A) 기쁘지 않아서 / (B) 몰래","(A) 자랑스러워서 / (B) 천천히","(A) 기쁘지 않아서 / (B) 천천히"],"opts":["(A) happy / (B) secretly","(A) unhappy / (B) openly","(A) unhappy / (B) secretly","(A) proud / (B) slowly","(A) unhappy / (B) slowly"],"r":{"a":"3) (A) unhappy / (B) secretly","ev":"8~10번 문장","s":[[8,"One of them asked who had made it, and someone answered, “Gobbo, the artist from the city of Milan, carved it.”","그들 중 한 사람이 누가 그것을 만들었는지 물었고, 누군가 “밀라노 출신의 예술가인 Gobbo가 조각했다는군.”이라고 대답했다."],[9,"Michelangelo, of course, was unhappy.","물론, 미켈란젤로는 기쁘지 않았다."],[10,"He secretly carved his name upon the statue one night.","어느 날 밤 그는 몰래 조각상에 그의 이름을 새겼다."]],"w":"8번에서 누군가 Gobbo가 만들었다고 말했고, 9번에서 미켈란젤로는 기쁘지 않았으며(unhappy), 10번에서 몰래(secretly) 이름을 새겼어요.","c":3},"h":"d963c8dc6d"},{"n":10,"t":"fill","q":"Michelangelo [A] signing the Pietà, because even God did not [B] a signature on his creatures.","ko":"미켈란젤로는 하느님조차 그의 창조물에 서명을 [B] 않았기 때문에 <피에타>에 서명한 것을 [A].","bank":["regretted","leave","famous","secretly","unhappy","reputation"],"bko":{"regretted":"후회했다","leave":"남기다","famous":"유명한","secretly":"몰래","unhappy":"기쁘지 않은","reputation":"명성"},"r":{"a":"[A] regretted, [B] leave","ev":"12~13번 문장","s":[[12,"But eventually, Michelangelo regretted signing it.","그러나 결국, 미켈란젤로는 그것에 서명한 것을 후회했다."],[13,"He said, “God, creator of the world, did not even leave a signature on his creatures, but I did!”","그는 말했다. “세상의 창조자인 하느님조차도 그의 창조물에 서명을 남기지 않았건만, 내가 서명을 남겼구나!”"]],"w":"12번에서 미켈란젤로는 서명한 것을 후회했고(regretted), 13번에서 하느님조차 서명을 남기지(leave) 않았다고 말해요. famous, secretly, unhappy, reputation은 이 두 빈칸의 문장 구조에 맞지 않아요.","c":null},"h":"6eddcd3a6f"}]},{"u":5,"id":"hk2-05-1","no":1,"ko":"죽었니, 살았니?","items":[{"n":1,"t":"tf","q":"You should hold the battery with the negative end facing down.","ko":"건전지를 음극이 아래를 향하게 한 채로 잡아야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"To find out, hold the battery with the negative end facing down.","알아내기 위해서는, 건전지를 음극이 아래를 향하게 한 채로 잡아라."]],"w":"4번 문장에 hold the battery with the negative end facing down이 그대로 있어요. 음극이 아래로 가게 잡으라는 내용과 일치해요.","c":"T"},"h":"ce200b5600"},{"n":2,"t":"tf","q":"You should drop the battery from fifty centimeters above the ground.","ko":"건전지를 바닥에서 50센티미터 위에서 떨어뜨려야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Drop it from five centimeters above the ground.","그것을 바닥에서 5센티미터 위에서 떨어뜨려라."]],"w":"5번 문장은 from five centimeters, 즉 5센티미터 위에서 떨어뜨리라고 해요. 50센티미터가 아니에요.","c":"F"},"h":"52617c9539"},{"n":3,"t":"tf","q":"Both old and new batteries are on the floor after you drop them.","ko":"건전지를 떨어뜨린 뒤 바닥에는 오래된 건전지와 새 건전지가 모두 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"But you drop them by mistake, and now there are both old and new batteries on the floor.","하지만 당신은 실수로 그것들을 떨어뜨리고, 이제 오래된 건전지와 새 건전지들 모두 바닥에 있다."]],"w":"2번 문장에 now there are both old and new batteries on the floor가 있어요. 새것과 헌것이 섞여 있다는 내용이에요.","c":"T"},"h":"966484aace"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The remote control stops working, and you take out the batteries to replace them.)","ko":"리모컨이 작동하는 것을 멈추자, 당신은 건전지를 ( ) 위해 꺼낸다.","opts":["충전하기","버리기","교체하기","구입하기"],"word":"replace","r":{"a":"3) 교체하기","ev":"1번 문장","s":[[1,"The remote control stops working, and you take out the batteries to replace them.","리모컨이 작동하는 것을 멈추자, 당신은 건전지를 교체하기 위해 꺼낸다."]],"w":"리모컨이 멈춰서 건전지를 꺼내는 상황이에요. 꺼낸 건전지 대신 다른 것을 끼우려는 거니까 replace는 '교체하다'예요.","c":3},"h":"d4dd79034a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A dead battery, however, will bounce and fall over.)","ko":"다 쓴 건전지는, 그러나, ( ) 넘어질 것이다.","opts":["튕기고","녹고","빛나고","가라앉고"],"word":"bounce","r":{"a":"1) 튕기고","ev":"6~7번 문장","s":[[6,"If the battery is new, it won’t bounce and it might even stand up.","만약 건전지가 새것이라면, 튕기지 않을 것이고 심지어 설 수도 있다."],[7,"A dead battery, however, will bounce and fall over.","다 쓴 건전지는, 그러나, 튕기고 넘어질 것이다."]],"w":"6번에서 새 건전지는 won't bounce(튕기지 않는다), 7번은 반대(however)로 다 쓴 건전지가 bounce 한다고 해요. 떨어뜨리면 통통 되돌아오니까 '튕기다'예요.","c":1},"h":"977e709697"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes the battery bounce easily.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 건전지가 쉽게 튕기도록 만든다.","opts":["건전지를 바닥에서 5센티미터 위에서 떨어뜨리는 것","건전지 안쪽이 변해 아연이 용수철 조직 같은 물질이 되는 것","젤이 튕기지 않는 것","리모컨이 작동을 멈추는 것"],"r":{"a":"2) 건전지 안쪽이 변해 아연이 용수철 조직 같은 물질이 되는 것","ev":"11~12번 문장","s":[[11,"However, as you use batteries, the chemistry inside changes, and the zinc becomes a material that is like a network of springs.","하지만, 건전지를 사용함에 따라, 내부의 화학적 성질이 변하고, 아연은 용수철 조직과 같은 물질이 된다."],[12,"This makes the battery bounce easily.","이것이 건전지가 쉽게 튕기도록 만든다."]],"w":"12번 This는 바로 앞 11번 내용, 즉 사용하면서 아연이 용수철 조직 같은 물질로 변하는 것이에요. 젤이 안 튕기는 건 10번의 새 건전지 이야기라서 반대예요.","c":2},"h":"6cfe25f622"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If the battery is new, it won’t bounce and it might even stand up.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 건전지가 새것이라면, 튕기지 않을 것이고 심지어 설 수도 있다.","opts":["새 건전지는 튕기고 넘어질 것이다.","새 건전지는 높이 튕기지만 서 있지는 못한다.","새 건전지는 떨어뜨리면 깨져서 쓸 수 없게 된다.","새 건전지는 튕기지 않고 심지어 서 있을 수도 있다."],"r":{"a":"4) 새 건전지는 튕기지 않고 심지어 서 있을 수도 있다.","ev":"6번 문장","s":[[6,"If the battery is new, it won’t bounce and it might even stand up.","만약 건전지가 새것이라면, 튕기지 않을 것이고 심지어 설 수도 있다."]],"w":"won't bounce는 '튕기지 않을 것이다', might even stand up은 '심지어 설 수도 있다'예요. 튕기고 넘어지는 것은 7번의 다 쓴 건전지예요.","c":4},"h":"dddcb42715"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["새 건전지는 젤이 들어 있어서 잘 튕긴다.","새 건전지는 젤 형태의 아연이 들어 있어서 튕기지 않는다.","다 쓴 건전지는 아연이 젤이라서 튕기지 않는다.","이 실험은 건전지가 처음부터 용수철로 만들어졌기 때문에 된다."],"opts":["A new battery bounces well because it contains a gel.","A new battery doesn’t bounce because it contains zinc in the form of a gel.","A dead battery doesn’t bounce because its zinc is a gel.","The test works because batteries are made of springs from the start."],"r":{"a":"2) A new battery doesn’t bounce because it contains zinc in the form of a gel.","ev":"9~10번 문장","s":[[9,"This test works because batteries usually contain zinc in the form of a gel.","건전지는 보통 젤 형태의 아연을 함유하고 있기 때문에 이 실험이 가능하다."],[10,"Gels don’t bounce, so a fresh battery doesn’t bounce as well.","젤은 튕기지 않고, 그래서 새 건전지 또한 튕기지 않는다."]],"w":"9번에서 건전지에는 보통 젤 형태의 아연이 들어 있고, 10번에서 젤은 튕기지 않으니 새 건전지도 튕기지 않는다고 해요. 튕기는 것은 아연이 용수철 같은 물질로 바뀐 다 쓴 건전지예요.","c":2},"h":"4b51e1b40e"},{"n":9,"t":"sum","q":"When you drop a battery, a new one (A) and may even stand up, but a dead one (B) and falls over.","ko":"건전지를 떨어뜨리면, 새것은 (A)하고 심지어 설 수도 있지만, 다 쓴 것은 (B)하고 넘어진다.","oko":["(A) 튕기고 / (B) 멈추고","(A) 녹고 / (B) 튕기고","(A) 튕기지 않고 / (B) 튕기고","(A) 튕기지 않고 / (B) 녹고","(A) 튕기고 / (B) 튕기지 않고"],"opts":["(A) bounces / (B) stops","(A) melts / (B) bounces","(A) doesn’t bounce / (B) bounces","(A) doesn’t bounce / (B) melts","(A) bounces / (B) doesn’t bounce"],"r":{"a":"3) (A) doesn’t bounce / (B) bounces","ev":"6~7번 문장","s":[[6,"If the battery is new, it won’t bounce and it might even stand up.","만약 건전지가 새것이라면, 튕기지 않을 것이고 심지어 설 수도 있다."],[7,"A dead battery, however, will bounce and fall over.","다 쓴 건전지는, 그러나, 튕기고 넘어질 것이다."]],"w":"6번에서 새 건전지는 튕기지 않고 설 수도 있고, 7번에서 다 쓴 건전지는 튕기고 넘어진다고 해요. 그래서 (A)는 doesn't bounce, (B)는 bounces예요.","c":3},"h":"da7f0a30cd"},{"n":10,"t":"fill","q":"As you use a battery, its [A] changes, and the zinc turns into a network of [B].","ko":"건전지를 사용하면, 그 [A]이 변하고, 아연은 [B] 조직으로 바뀐다.","bank":["chemistry","springs","floor","centimeters","remote","negative"],"bko":{"chemistry":"화학적 성질","springs":"용수철","floor":"바닥","centimeters":"센티미터","remote":"리모컨","negative":"음극"},"r":{"a":"[A] chemistry, [B] springs","ev":"11~12번 문장","s":[[11,"However, as you use batteries, the chemistry inside changes, and the zinc becomes a material that is like a network of springs.","하지만, 건전지를 사용함에 따라, 내부의 화학적 성질이 변하고, 아연은 용수철 조직과 같은 물질이 된다."],[12,"This makes the battery bounce easily.","이것이 건전지가 쉽게 튕기도록 만든다."]],"w":"11번에서 건전지를 사용하면 안쪽의 chemistry(화학적 성질)가 변하고, 아연이 a network of springs(용수철 조직) 같은 물질이 된다고 해요. 그 결과 12번에서 쉽게 튕겨요.","c":null},"h":"7d290ca802"}]},{"u":5,"id":"hk2-05-2","no":2,"ko":"이집트인의 치명적인 화장법","items":[{"n":1,"t":"tf","q":"Ancient Egyptians put on a white substance to make smoky eyes.","ko":"고대 이집트인들은 스모키한 눈을 만들기 위해 하얀 물질을 발랐다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"In ancient Egypt, people put on a black substance, kohl, to make smoky eyes.","고대 이집트에서, 사람들은 스모키한 눈을 만들기 위해 콜이라는 검은 물질을 발랐다."]],"w":"5번 문장은 a black substance, kohl, 즉 검은 물질인 콜을 발랐다고 해요. 하얀 물질이 아니에요.","c":"F"},"h":"6394792650"},{"n":2,"t":"tf","q":"The kohl kept mosquitoes and flies away from the Egyptians.","ko":"콜은 모기와 파리가 이집트인들에게 가까이 오지 못하게 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The kohl kept away mosquitoes and flies.","콜은 모기와 파리가 가까이 오지 못하게 했다."]],"w":"8번 문장에 The kohl kept away mosquitoes and flies가 있어요. 모기와 파리를 가까이 못 오게 했다는 내용과 일치해요.","c":"T"},"h":"c5e37fc306"},{"n":3,"t":"tf","q":"Kohl contains lead, which is a toxic substance.","ko":"콜은 유독한 물질인 납을 함유하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Kohl contains a very toxic substance, lead.","콜은 납이라는 매우 유독한 물질을 함유하고 있다."]],"w":"11번 문장에 Kohl contains a very toxic substance, lead가 있어요. 콜에 유독한 납이 들어 있다는 내용과 일치해요.","c":"T"},"h":"d4d8ea0582"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Kohl contains a very toxic substance, lead.)","ko":"콜은 납이라는 매우 ( ) 물질을 함유하고 있다.","opts":["유독한","향기로운","값비싼","투명한"],"word":"toxic","r":{"a":"1) 유독한","ev":"11~12번 문장","s":[[11,"Kohl contains a very toxic substance, lead.","콜은 납이라는 매우 유독한 물질을 함유하고 있다."],[12,"When this builds up in the body, it can affect almost every organ.","이것이 몸속에 쌓이면, 거의 모든 장기에 영향을 끼칠 수 있다."]],"w":"12번에서 이 물질이 몸속에 쌓이면 거의 모든 장기에 영향을 끼칠 수 있다고 해요. 몸에 해로운 물질이니까 toxic은 '유독한'이에요.","c":1},"h":"037a3b2c22"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, the Egyptians could avoid getting the infectious diseases that were carried by these insects.)","ko":"그래서, 이집트인들은 이 벌레들에 의해 옮겨지는 전염병을 얻는 것을 ( ) 수 있었다.","opts":["퍼뜨릴","치료할","피할","연구할"],"word":"avoid","r":{"a":"3) 피할","ev":"8~9번 문장","s":[[8,"The kohl kept away mosquitoes and flies.","콜은 모기와 파리가 가까이 오지 못하게 했다."],[9,"So, the Egyptians could avoid getting the infectious diseases that were carried by these insects.","그래서, 이집트인들은 이 벌레들에 의해 옮겨지는 전염병을 얻는 것을 피할 수 있었다."]],"w":"8번에서 콜이 벌레를 가까이 못 오게 했어요. 그래서 벌레가 옮기는 전염병을 얻는 일을 '피할' 수 있었다는 흐름이에요. avoid = 피하다.","c":3},"h":"95f070d65f"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nWhen this builds up in the body, it can affect almost every organ.","ko":"밑줄 친 this가 가리키는 것은?","sko":"이것이 몸속에 쌓이면, 거의 모든 장기에 영향을 끼칠 수 있다.","opts":["벌레들","납","이집트인들","전염병"],"r":{"a":"2) 납","ev":"11~12번 문장","s":[[11,"Kohl contains a very toxic substance, lead.","콜은 납이라는 매우 유독한 물질을 함유하고 있다."],[12,"When this builds up in the body, it can affect almost every organ.","이것이 몸속에 쌓이면, 거의 모든 장기에 영향을 끼칠 수 있다."]],"w":"11번에서 콜이 매우 유독한 물질인 납(lead)을 함유한다고 했고, 12번 this는 그 납이에요. 몸속에 쌓이는 것은 독성이 있는 납이에요.","c":2},"h":"36e4c74e9d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, they did not do this just for beauty.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 그들은 미용을 위해서만 이것을 하지는 않았다.","opts":["그들은 오직 미용을 위해서 이것을 했다.","그들은 미용 때문에 이것을 전혀 하지 않았다.","그들은 이것을 미용 대신 종교를 위해서 했다.","그들은 미용만을 위해서 이것을 한 것은 아니었다."],"r":{"a":"4) 그들은 미용만을 위해서 이것을 한 것은 아니었다.","ev":"3~4번 문장","s":[[3,"It is believed that ancient Egyptians first used makeup to create smoky eyes.","고대 이집트인들은 스모키한 눈을 만들기 위해 최초로 화장을 이용했다고 믿어진다."],[4,"However, they did not do this just for beauty.","하지만, 그들은 미용을 위해서만 이것을 하지는 않았다."]],"w":"not just for beauty는 '미용만을 위해서가 아닌'이에요. 미용도 이유 중 하나이지만 그것만은 아니었다는 뜻이라서 벌레를 막는 효과 같은 다른 이유가 뒤따라요.","c":4},"h":"db3a2da125"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["콜 덕분에 모기가 이집트인들에게 더 쉽게 다가왔다.","이집트인들은 처음부터 콜의 납 문제를 알고 있었다.","콜에서 나온 납은 몸속에 쌓여 거의 모든 장기에 영향을 끼칠 수 있다.","전염병은 콜 때문에 옮겨졌다."],"opts":["The kohl made it easier for mosquitoes to come near the Egyptians.","The Egyptians knew about the lead problem from the beginning.","Lead from kohl can build up in the body and affect almost every organ.","The infectious diseases were carried by the kohl."],"r":{"a":"3) Lead from kohl can build up in the body and affect almost every organ.","ev":"10~12번 문장","s":[[10,"But there was one big problem that the Egyptians didn’t know about.","그러나 이집트인들이 알지 못했던 한 가지 큰 문제가 있었다."],[11,"Kohl contains a very toxic substance, lead.","콜은 납이라는 매우 유독한 물질을 함유하고 있다."],[12,"When this builds up in the body, it can affect almost every organ.","이것이 몸속에 쌓이면, 거의 모든 장기에 영향을 끼칠 수 있다."]],"w":"11~12번에서 콜 속의 납이 몸에 쌓이면 거의 모든 장기에 영향을 끼칠 수 있다고 해요. 10번에서 이집트인들은 이 문제를 몰랐고, 전염병은 콜이 아니라 벌레가 옮겼어요(9번).","c":3},"h":"a34f6fd64b"},{"n":9,"t":"sum","q":"Kohl (A) mosquitoes and flies, so the Egyptians could avoid getting (B).","ko":"콜은 모기와 파리를 (A)했고, 그래서 이집트인들은 (B)을 얻는 것을 피할 수 있었다.","oko":["(A) 끌어들였고 / (B) 전염병","(A) 막았고 / (B) 햇빛","(A) 먹였고 / (B) 음식","(A) 다치게 했고 / (B) 아름다움","(A) 가까이 오지 못하게 했고 / (B) 전염병"],"opts":["(A) attracted / (B) diseases","(A) kept away / (B) sunlight","(A) fed / (B) food","(A) hurt / (B) beauty","(A) kept away / (B) diseases"],"r":{"a":"5) (A) kept away / (B) diseases","ev":"8~9번 문장","s":[[8,"The kohl kept away mosquitoes and flies.","콜은 모기와 파리가 가까이 오지 못하게 했다."],[9,"So, the Egyptians could avoid getting the infectious diseases that were carried by these insects.","그래서, 이집트인들은 이 벌레들에 의해 옮겨지는 전염병을 얻는 것을 피할 수 있었다."]],"w":"8번에서 콜이 모기와 파리를 가까이 오지 못하게 했고(kept away), 9번에서 그 덕분에 벌레가 옮기는 전염병(diseases)을 피할 수 있었다고 해요.","c":5},"h":"d4c0b82ac1"},{"n":10,"t":"fill","q":"The toxic substance, [A], in kohl can build up in the body and cause serious [B] problems.","ko":"콜 속의 유독한 물질인 [A]이 몸속에 쌓여 심각한 [B] 문제를 일으킬 수 있다.","bank":["lead","health","affect","trend","ancient","avoid"],"bko":{"lead":"납","health":"건강","affect":"영향을 끼치다","trend":"유행","ancient":"고대의","avoid":"피하다"},"r":{"a":"[A] lead, [B] health","ev":"11~13번 문장","s":[[11,"Kohl contains a very toxic substance, lead.","콜은 납이라는 매우 유독한 물질을 함유하고 있다."],[12,"When this builds up in the body, it can affect almost every organ.","이것이 몸속에 쌓이면, 거의 모든 장기에 영향을 끼칠 수 있다."],[13,"As a result, the Egyptians probably had some serious health problems in the end.","결과적으로, 이집트인들은 아마 결국 심각한 건강 문제를 가지고 있었을 것이다."]],"w":"11번에서 콜에는 유독한 물질인 lead(납)가 있고, 12번에서 몸속에 쌓이면 장기에 영향을 끼친다고 해요. 13번에서 그 결과 심각한 health(건강) 문제가 생겼을 거라고 해요.","c":null},"h":"1b52f05588"}]},{"u":5,"id":"hk2-05-3","no":3,"ko":"온도야 부탁해","items":[{"n":1,"t":"tf","q":"For most animals, DNA alone decides whether a baby is a boy or a girl.","ko":"대부분의 동물에게는 DNA만이 아기가 남자아이인지 여자아이인지를 결정한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"For most animals, it is DNA alone.","대부분의 동물들의 경우, DNA뿐이다."]],"w":"2번 문장에 For most animals, it is DNA alone이 있어요. 대부분의 동물은 DNA만으로 성별이 정해진다는 내용과 일치해요.","c":"T"},"h":"a620ceaa21"},{"n":2,"t":"tf","q":"Most alligators and turtles lay eggs in the sand.","ko":"대부분의 악어와 거북이는 모래에 알을 낳는다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Most alligators and turtles lay eggs in the sand.","대부분의 악어와 거북이는 모래에 알을 낳는다."]],"w":"5번 문장에 Most alligators and turtles lay eggs in the sand가 그대로 있어요. 모래에 알을 낳는다는 내용과 일치해요.","c":"T"},"h":"e1d3e4ec7a"},{"n":3,"t":"tf","q":"The hotter it is, the more male turtles will be born.","ko":"더울수록, 더 많은 수컷 거북이가 태어날 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"The hotter it is, the more female babies will be born.","더 뜨거울수록, 더 많은 새끼 암컷들이 태어날 것이다."]],"w":"11번 문장은 The hotter it is, the more female babies will be born이에요. 거북이는 더울수록 수컷이 아니라 암컷이 더 많이 태어나요.","c":"F"},"h":"304f46959b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The gender of the babies is determined by the temperature around the eggs.)","ko":"새끼의 성별은 알 주변의 온도에 의해 ( ).","opts":["바뀌어 버린다","결정된다","숨겨진다","낳아진다"],"word":"determined","r":{"a":"2) 결정된다","ev":"6번 문장","s":[[6,"The gender of the babies is determined by the temperature around the eggs.","새끼의 성별은 알 주변의 온도에 의해 결정된다."]],"w":"6번은 새끼의 성별이 알 주변의 온도에 달려 있다는 말이에요. is determined by는 '~에 의해 결정된다'예요.","c":2},"h":"09ce3ed8cc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most alligators and turtles lay eggs in the sand.)","ko":"대부분의 악어와 거북이는 모래에 알을 ( ).","opts":["먹는다","깨뜨린다","옮긴다","낳는다"],"word":"lay","r":{"a":"4) 낳는다","ev":"5~6번 문장","s":[[5,"Most alligators and turtles lay eggs in the sand.","대부분의 악어와 거북이는 모래에 알을 낳는다."],[6,"The gender of the babies is determined by the temperature around the eggs.","새끼의 성별은 알 주변의 온도에 의해 결정된다."]],"w":"악어와 거북이가 모래에 알을 두고 새끼가 태어나는 내용이에요. lay eggs는 '알을 낳다'예요.","c":4},"h":"ed3b072c8c"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nBut this is not true for some reptiles like alligators and turtles.","ko":"밑줄 친 this가 가리키는 것은?","sko":"하지만 이것은 악어와 거북이 같은 몇몇 파충류에게는 사실이 아니다.","opts":["대부분의 동물이 알을 낳는 것","온도가 성별을 결정하는 것","DNA만으로 성별이 정해지는 것","악어가 파충류라는 것"],"r":{"a":"3) DNA만으로 성별이 정해지는 것","ev":"2~3번 문장","s":[[2,"For most animals, it is DNA alone.","대부분의 동물들의 경우, DNA뿐이다."],[3,"But this is not true for some reptiles like alligators and turtles.","하지만 이것은 악어와 거북이 같은 몇몇 파충류에게는 사실이 아니다."]],"w":"3번 this는 바로 앞 2번의 내용, 즉 DNA만으로 성별이 정해진다는 것이에요. 파충류는 그렇지 않고 온도도 영향을 줘요(4번).","c":3},"h":"c0d1014f36"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"On the other hand, the opposite is true for turtles.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"반면에, 거북이의 경우 반대다.","opts":["반면에, 거북이에게는 악어와 똑같은 일이 일어난다.","반면에, 거북이의 경우에는 그 반대가 사실이다.","반면에, 거북이는 악어보다 더 따뜻한 곳에 알을 낳는다.","반면에, 거북이의 성별은 온도와 관계없이 정해진다."],"r":{"a":"2) 반면에, 거북이의 경우에는 그 반대가 사실이다.","ev":"10번 문장","s":[[10,"On the other hand, the opposite is true for turtles.","반면에, 거북이의 경우 반대다."]],"w":"On the other hand는 '반면에', the opposite is true는 '반대가 사실이다'예요. 악어와 같다는 뜻이 아니라 악어와 반대 결과가 나온다는 뜻이에요(11번).","c":2},"h":"33162b3c11"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["미국악어의 둥지가 34도보다 높으면 대부분 암컷이다.","온도가 높으면 거북이는 대부분 수컷이다.","모든 동물의 성별은 알 주변의 온도에 의해 정해진다.","미국악어의 둥지 온도가 30도보다 낮으면 대부분 암컷이다."],"opts":["American alligators are mostly females when the nest is hotter than 34°C.","Turtles are mostly male when the temperature is high.","The gender of all animals depends on the temperature around the eggs.","If the nest of the American alligator is lower than 30°C, most babies will be females."],"r":{"a":"4) If the nest of the American alligator is lower than 30°C, most babies will be females.","ev":"9번 문장","s":[[9,"And if the temperature is lower than 30°C, most will be females.","그리고 만약 온도가 30도보다 낮으면, 대부분은 암컷일 것이다."]],"w":"9번에서 둥지 온도가 30도보다 낮으면 대부분 암컷이라고 해요. 34도보다 높으면 수컷이고(8번), 거북이는 더울수록 암컷이며(11번), 온도로 성별이 정해지는 것은 일부 파충류예요(3번).","c":4},"h":"4e967607bf"},{"n":9,"t":"sum","q":"For alligators and turtles, (A) around the eggs decides the babies’ (B).","ko":"악어와 거북이의 경우, 알 주변의 (A)이 새끼의 (B)을 결정한다.","oko":["(A) 온도 / (B) 성별","(A) 먹이 / (B) 성별","(A) 온도 / (B) 크기","(A) DNA / (B) 색깔","(A) 모래 / (B) 개수"],"opts":["(A) temperature / (B) gender","(A) food / (B) gender","(A) temperature / (B) size","(A) DNA / (B) color","(A) sand / (B) number"],"r":{"a":"1) (A) temperature / (B) gender","ev":"4, 6번 문장","s":[[4,"In addition to DNA, temperature decides their gender!","DNA에 더해, 온도가 그것들의 성별을 결정한다!"],[6,"The gender of the babies is determined by the temperature around the eggs.","새끼의 성별은 알 주변의 온도에 의해 결정된다."]],"w":"4번과 6번에서 악어와 거북이는 DNA에 더해 알 주변의 온도(temperature)가 새끼의 성별(gender)을 결정한다고 해요.","c":1},"h":"dd82227eb1"},{"n":10,"t":"fill","q":"If the Earth keeps getting [A], maybe there will only be male [B] and female turtles.","ko":"지구가 계속 [A]지면, 아마도 수컷 [B]와 암컷 거북이만 있게 될 것이다.","bank":["hotter","alligators","sand","eggs","nest","temperature"],"bko":{"hotter":"더 더운","alligators":"악어","sand":"모래","eggs":"알","nest":"둥지","temperature":"온도"},"r":{"a":"[A] hotter, [B] alligators","ev":"12~13번 문장","s":[[12,"So what happens if the Earth keeps getting hotter?","그래서 만약 지구가 계속해서 더워진다면 무슨 일이 일어날까?"],[13,"Then maybe there will only be male alligators and female turtles!","그러면 아마도 수컷 악어와 암컷 거북이만 있게 될 것이다!"]],"w":"12번에서 지구가 계속 hotter(더 더워진다면)라고 가정해요. 13번에서 그러면 male alligators(수컷 악어)와 female turtles(암컷 거북이)만 있을 수도 있다고 해요.","c":null},"h":"91ceabf8c1"}]},{"u":5,"id":"hk2-05-4","no":4,"ko":"말이 필요 없어","items":[{"n":1,"t":"tf","q":"Emojis let us deliver our thoughts and feelings without typing words.","ko":"이모지는 우리가 단어를 입력하지 않고도 생각과 감정을 전달하게 해준다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They let us deliver our thoughts and feelings without typing words.","그것들은 우리가 단어를 입력하지 않고도 생각과 감정을 전달하게 해준다."]],"w":"3번 문장에 They let us deliver our thoughts and feelings without typing words가 그대로 있어요. 이모지 이야기와 일치해요.","c":"T"},"h":"625edeae3a"},{"n":2,"t":"tf","q":"People from the Middle East understand the LOL emoji in the same way as people in Western countries.","ko":"중동 출신의 사람들은 LOL 이모지를 서구권 사람들과 같은 방식으로 이해한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"But people from the Middle East understand the same emoji very differently.","그러나 중동 출신의 사람들은 같은 이모지를 매우 다르게 이해한다."]],"w":"8번 문장에서 중동 출신의 사람들은 같은 이모지를 매우 다르게(very differently) 이해한다고 해요. 서구권과 같지 않아요.","c":"F"},"h":"14675d6a1e"},{"n":3,"t":"tf","q":"Emoji translators study how people use each emoji based on their cultural background.","ko":"이모지 번역가들은 문화적 배경에 근거해 사람들이 각각의 이모지를 어떻게 사용하는지 연구한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"These translators research how people use each emoji based on their cultural background.","이 번역가들은 문화적 배경에 근거해 사람들이 어떻게 각각의 이모지를 사용하는지 연구한다."]],"w":"12번 문장에 These translators research how people use each emoji based on their cultural background가 있어요. 문화적 배경을 바탕으로 연구한다는 내용과 일치해요.","c":"T"},"h":"83896335bf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If so, you probably understand how convenient emojis are.)","ko":"만약 그렇다면, 당신은 아마 이모지가 얼마나 ( ) 이해할 것이다.","opts":["위험한지","편리한지","복잡한지","값비싼지"],"word":"convenient","r":{"a":"2) 편리한지","ev":"2~3번 문장","s":[[2,"If so, you probably understand how convenient emojis are.","만약 그렇다면, 당신은 아마 이모지가 얼마나 편리한지 이해할 것이다."],[3,"They let us deliver our thoughts and feelings without typing words.","그것들은 우리가 단어를 입력하지 않고도 생각과 감정을 전달하게 해준다."]],"w":"바로 뒤 3번에서 이모지는 단어를 입력하지 않고도 생각과 감정을 전달하게 해준다고 해요. 쓰기 쉽고 도움이 되니까 convenient는 '편리한'이에요.","c":2},"h":"b60b97cc16"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Some people study the various meanings emojis have in different cultures.)","ko":"어떤 사람들은 다른 문화에서 이모지가 갖는 ( ) 의미를 연구한다.","opts":["단순한","정확한","다양한","유일한"],"word":"various","r":{"a":"3) 다양한","ev":"6, 8, 10번 문장","s":[[6,"For example, a smiling face with tears is called a LOL (Laugh Out Loud) emoji in Western countries.","예를 들어, 눈물이 맺힌 웃는 얼굴은 서구권에서 LOL(큰 소리로 웃다) 이모지라고 불린다."],[8,"But people from the Middle East understand the same emoji very differently.","그러나 중동 출신의 사람들은 같은 이모지를 매우 다르게 이해한다."],[10,"To understand these differences, some people study the various meanings emojis have in different cultures.","이러한 차이점들을 이해하기 위해, 어떤 사람들은 다른 문화에서 이모지가 갖는 다양한 의미를 연구한다."]],"w":"6~9번에서 같은 이모지가 서양과 중동에서 서로 다른 의미로 쓰인다고 해요. 문화마다 여러 가지 뜻이 있으니 various는 '다양한'이에요.","c":3},"h":"9260852cf1"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey see it as a face filled with sadness!","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 그것을 슬픔으로 가득 찬 얼굴로 본다!","opts":["중동 출신의 사람들","서구권의 사람들","이모지 번역가들","다른 언어를 말하는 사람들"],"r":{"a":"1) 중동 출신의 사람들","ev":"8~9번 문장","s":[[8,"But people from the Middle East understand the same emoji very differently.","그러나 중동 출신의 사람들은 같은 이모지를 매우 다르게 이해한다."],[9,"They see it as a face filled with sadness!","그들은 그것을 슬픔으로 가득 찬 얼굴로 본다!"]],"w":"9번 They는 바로 앞 8번의 people from the Middle East(중동 출신의 사람들)예요. 서구권에서는 같은 이모지가 너무 웃어서 눈물이 난다는 뜻이에요(7번).","c":1},"h":"0ba0324cb9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, not every emoji has the same meaning to everyone.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 모든 이모지가 모두에게 같은 의미를 갖는 것은 아니다.","opts":["어떤 이모지도 누구에게도 같은 의미를 갖지 않는다.","모든 이모지는 모두에게 똑같은 의미를 갖는다.","모든 사람이 이모지를 사용하는 것은 아니다.","모든 이모지가 모두에게 같은 의미를 갖는 것은 아니다."],"r":{"a":"4) 모든 이모지가 모두에게 같은 의미를 갖는 것은 아니다.","ev":"5번 문장","s":[[5,"However, not every emoji has the same meaning to everyone.","하지만, 모든 이모지가 모두에게 같은 의미를 갖는 것은 아니다."]],"w":"not every는 '모든 ~가 …한 것은 아니다'라는 부분 부정이에요. 같은 의미인 이모지도 있을 수 있지만, 사람에 따라 다르게 이해하는 이모지도 있다는 뜻이에요.","c":4},"h":"af476a0c1f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이모지는 다른 언어를 말하는 사람들에게 도움이 되지 않는다.","서구권에서 LOL 이모지는 너무 심하게 웃어서 눈물이 난다는 뜻이다.","이모지 번역가들은 문화를 고려하지 않고 이모지를 연구한다.","서구권 사람들은 LOL 이모지를 슬픔으로 가득 찬 얼굴로 본다."],"opts":["Emojis cannot help people who speak different languages.","In Western countries, the LOL emoji means you are laughing so hard that you cry.","Emoji translators ignore culture when they study emojis.","People in Western countries see the LOL emoji as a face filled with sadness."],"r":{"a":"2) In Western countries, the LOL emoji means you are laughing so hard that you cry.","ev":"6~7번 문장","s":[[6,"For example, a smiling face with tears is called a LOL (Laugh Out Loud) emoji in Western countries.","예를 들어, 눈물이 맺힌 웃는 얼굴은 서구권에서 LOL(큰 소리로 웃다) 이모지라고 불린다."],[7,"It means you’re laughing so hard that you eventually cry.","그것은 너무 심하게 웃어서 결국 눈물을 흘린다는 것을 의미한다."]],"w":"7번에서 서구권의 LOL 이모지는 너무 심하게 웃어서 결국 눈물을 흘린다는 뜻이라고 해요. 이모지는 의사소통을 도와주고(4번), 번역가는 문화적 배경을 근거로 연구하며(12번), 슬픔으로 보는 것은 중동 사람들이에요(9번).","c":2},"h":"e6111dc33d"},{"n":9,"t":"sum","q":"A LOL emoji means (A) in Western countries, but people from the Middle East see it as a face filled with (B).","ko":"LOL 이모지는 서구권에서는 (A)를 의미하지만, 중동 출신의 사람들은 그것을 (B)으로 가득 찬 얼굴로 본다.","oko":["(A) 슬픔 / (B) 웃음","(A) 너무 심하게 웃어서 우는 것 / (B) 기쁨","(A) 너무 심하게 웃어서 우는 것 / (B) 슬픔","(A) 웃긴 농담 / (B) 분노","(A) 단어 입력 / (B) 슬픔"],"opts":["(A) sadness / (B) laughter","(A) laughing so hard that you cry / (B) joy","(A) laughing so hard that you cry / (B) sadness","(A) a funny joke / (B) anger","(A) typing words / (B) sadness"],"r":{"a":"3) (A) laughing so hard that you cry / (B) sadness","ev":"6~9번 문장","s":[[6,"For example, a smiling face with tears is called a LOL (Laugh Out Loud) emoji in Western countries.","예를 들어, 눈물이 맺힌 웃는 얼굴은 서구권에서 LOL(큰 소리로 웃다) 이모지라고 불린다."],[7,"It means you’re laughing so hard that you eventually cry.","그것은 너무 심하게 웃어서 결국 눈물을 흘린다는 것을 의미한다."],[8,"But people from the Middle East understand the same emoji very differently.","그러나 중동 출신의 사람들은 같은 이모지를 매우 다르게 이해한다."],[9,"They see it as a face filled with sadness!","그들은 그것을 슬픔으로 가득 찬 얼굴로 본다!"]],"w":"7번에서 서구권의 LOL 이모지는 너무 심하게 웃어서 눈물이 난다는 뜻이고, 9번에서 중동 사람들은 같은 이모지를 슬픔(sadness)으로 가득 찬 얼굴로 본다고 해요.","c":3},"h":"68c4983ec9"},{"n":10,"t":"fill","q":"Emoji [A] research how people use each emoji based on their cultural [B].","ko":"이모지 [A]들은 문화적 [B]에 근거해 사람들이 각각의 이모지를 어떻게 사용하는지 연구한다.","bank":["translators","background","sadness","tears","various","laugh"],"bko":{"translators":"번역가","background":"배경","sadness":"슬픔","tears":"눈물","laugh":"웃다","various":"다양한"},"r":{"a":"[A] translators, [B] background","ev":"11~12번 문장","s":[[11,"They are emoji translators!","그들은 이모지 번역가들이다!"],[12,"These translators research how people use each emoji based on their cultural background.","이 번역가들은 문화적 배경에 근거해 사람들이 어떻게 각각의 이모지를 사용하는지 연구한다."]],"w":"11번에서 이모지의 다양한 의미를 연구하는 사람들을 emoji translators(이모지 번역가들)라고 불러요. 12번에서 이들은 cultural background(문화적 배경)에 근거해 사람들이 이모지를 어떻게 쓰는지 연구해요.","c":null},"h":"616d327d6b"}]},{"u":6,"id":"hk2-06-1","no":1,"ko":"무한 번개 지옥에 오신 걸 환영합니다","items":[{"n":1,"t":"tf","q":"The Catatumbo River is in Venezuela.","ko":"카타툼보강은 베네수엘라에 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It is the Catatumbo River of Venezuela.","그곳은 베네수엘라의 카타툼보강이다."]],"w":"2번 문장에 It is the Catatumbo River of Venezuela가 있어요. 카타툼보강이 베네수엘라에 있다는 내용과 일치해요.","c":"T"},"h":"fb9e52cbe0"},{"n":2,"t":"tf","q":"Along the Catatumbo River, lightning occurs about 26 days a year.","ko":"카타툼보강을 따라서, 번개는 1년에 약 26일 발생한다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Along the Catatumbo River, lightning occurs 260 days a year on average.","카타툼보강을 따라서, 평균적으로 1년에 260일 번개가 발생한다."]],"w":"3번 문장은 lightning occurs 260 days a year on average예요. 26일이 아니라 260일이에요.","c":"F"},"h":"3b9ad66c74"},{"n":3,"t":"tf","q":"The Catatumbo River is surrounded by the Andes Mountains.","ko":"카타툼보강은 안데스 산맥으로 둘러싸여 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"The river is surrounded by the Andes Mountains.","그 강은 안데스 산맥으로 둘러싸여 있다."]],"w":"12번 문장에 The river is surrounded by the Andes Mountains가 있어요. 안데스 산맥으로 둘러싸여 있다는 내용과 일치해요.","c":"T"},"h":"3cd3ab1a4d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Along the Catatumbo River, lightning occurs 260 days a year on average.)","ko":"카타툼보강을 따라서, 평균적으로 1년에 260일 번개가 ( ).","opts":["사라진다","발생한다","멈춘다","떨어져 나간다"],"word":"occurs","r":{"a":"2) 발생한다","ev":"3~4번 문장","s":[[3,"Along the Catatumbo River, lightning occurs 260 days a year on average.","카타툼보강을 따라서, 평균적으로 1년에 260일 번개가 발생한다."],[4,"During the rainy season, around October, it strikes up to 28 times per minute.","우기 동안인 10월쯤에는, 1분당 28회까지 번개가 친다."]],"w":"1~2번에서 거의 매일 번개가 치는 곳이라고 했고, 3번은 1년에 260일 번개가 친다는 숫자예요. occur는 '일어나다, 발생하다'예요.","c":2},"h":"e6675fd2eb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…used it as a lighthouse to guide their boats.)","ko":"선원들은 그것을 그들의 배를 ( ) 등대로 이용했다.","opts":["수리해 줄","숨겨 줄","빌려 줄","안내해 줄"],"word":"guide","r":{"a":"4) 안내해 줄","ev":"7번 문장","s":[[7,"In fact, sailors who traveled along the nearby lake —Lake Maracaibo— used it as a lighthouse to guide their boats.","실제로, 마라카이보 호수라는 근처의 호수를 따라 항해했던 선원들은 그것을 그들의 배를 안내해 줄 등대로 이용했다."]],"w":"등대는 밤바다에서 배가 갈 길을 알려 주는 것이에요. 번개를 등대로 이용했으니 guide는 '안내하다'예요.","c":4},"h":"c2fb120599"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIn fact, sailors who traveled along the nearby lake — Lake Maracaibo — used it as a lighthouse to guide their boats.","ko":"밑줄 친 it이 가리키는 것은?","sko":"실제로, 마라카이보 호수라는 근처의 호수를 따라 항해했던 선원들은 그것을 그들의 배를 안내해 줄 등대로 이용했다.","opts":["마라카이보 호수","선원들의 배","카타툼보 번개","안데스 산맥"],"r":{"a":"3) 카타툼보 번개","ev":"6~7번 문장","s":[[6,"The lightning is so intense that it can be seen from 400 kilometers away.","그 번개는 너무 강렬해서 400킬로미터 떨어진 곳에서 보일 수 있다."],[7,"In fact, sailors who traveled along the nearby lake —Lake Maracaibo— used it as a lighthouse to guide their boats.","실제로, 마라카이보 호수라는 근처의 호수를 따라 항해했던 선원들은 그것을 그들의 배를 안내해 줄 등대로 이용했다."]],"w":"6번에서 번개가 400킬로미터 밖에서도 보일 만큼 강렬하다고 했어요. 그래서 7번에서 선원들이 등대처럼 이용한 것은 호수가 아니라 번개예요. 8번에서도 번개가 '마라카이보의 등대'라고 불린다고 해요.","c":3},"h":"1109db656d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why Catatumbo lightning is also known as ‘Maracaibo’s Lighthouse!’\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 카타툼보 번개가 ‘마라카이보의 등대’라고도 알려진 이유이다!","opts":["그래서 카타툼보 번개는 ‘마라카이보의 등대’라고도 알려져 있다.","카타툼보 번개는 ‘마라카이보의 등대’에서 처음 시작되었다.","카타툼보 번개는 ‘마라카이보의 등대’를 무너뜨렸다.","카타툼보 번개는 ‘마라카이보의 등대’와 아무 관계가 없다."],"r":{"a":"1) 그래서 카타툼보 번개는 ‘마라카이보의 등대’라고도 알려져 있다.","ev":"7~8번 문장","s":[[7,"In fact, sailors who traveled along the nearby lake —Lake Maracaibo— used it as a lighthouse to guide their boats.","실제로, 마라카이보 호수라는 근처의 호수를 따라 항해했던 선원들은 그것을 그들의 배를 안내해 줄 등대로 이용했다."],[8,"That’s why Catatumbo lightning is also known as “Maracaibo’s Lighthouse!”","그것이 카타툼보 번개가 ‘마라카이보의 등대’라고도 알려진 이유이다!"]],"w":"That's why는 '그것이 ~한 이유이다'예요. 7번에서 선원들이 번개를 등대로 이용했고, 그래서 번개가 '마라카이보의 등대'라는 별명을 얻었다는 뜻이에요.","c":1},"h":"9bc9d05eab"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["카타툼보강에는 1년에 28일만 번개가 친다.","밤에 강의 따뜻한 공기가 산맥의 차가운 공기와 만난다.","과학자들은 번개가 많은 정확한 이유를 이미 알아냈다.","번개는 4킬로미터 이내에서만 볼 수 있다."],"opts":["Lightning strikes the Catatumbo River only 28 days a year.","At night, warm air from the river meets cold air from the mountains.","Scientists have found the exact reason for the lightning.","The lightning can only be seen from less than 4 kilometers away."],"r":{"a":"2) At night, warm air from the river meets cold air from the mountains.","ev":"13번 문장","s":[[13,"At night, the warm air from the river meets the cold air from the mountains.","밤에, 그 강에서 온 따뜻한 공기는 산맥의 차가운 공기와 만난다."]],"w":"13번에서 밤에 강에서 온 따뜻한 공기가 산맥에서 온 차가운 공기와 만난다고 해요. 번개는 1년에 평균 260일 치고(3번), 이유는 아직 알려지지 않았으며(10번), 400킬로미터 밖에서도 보여요(6번).","c":2},"h":"7181e6f008"},{"n":9,"t":"sum","q":"Along the Catatumbo River, lightning occurs (A) days a year, and in the rainy season it can strike up to (B) times per minute.","ko":"카타툼보강을 따라서, 번개는 1년에 (A)일 발생하고, 우기에는 1분당 (B)번까지 칠 수 있다.","oko":["(A) 26 / (B) 28","(A) 260 / (B) 10","(A) 400 / (B) 28","(A) 28 / (B) 260","(A) 260 / (B) 28"],"opts":["(A) 26 / (B) 28","(A) 260 / (B) 10","(A) 400 / (B) 28","(A) 28 / (B) 260","(A) 260 / (B) 28"],"r":{"a":"5) (A) 260 / (B) 28","ev":"3~4번 문장","s":[[3,"Along the Catatumbo River, lightning occurs 260 days a year on average.","카타툼보강을 따라서, 평균적으로 1년에 260일 번개가 발생한다."],[4,"During the rainy season, around October, it strikes up to 28 times per minute.","우기 동안인 10월쯤에는, 1분당 28회까지 번개가 친다."]],"w":"3번에서 1년에 평균 260일, 4번에서 우기인 10월쯤에는 1분에 28번까지 번개가 친다고 해요. 10시간은 하루 지속 시간(5번), 400킬로미터는 보이는 거리(6번)예요.","c":5},"h":"01041eeac4"},{"n":10,"t":"fill","q":"Scientists believe the [A] of the river may be the reason: at night, warm air meets cold [B] from the mountains.","ko":"과학자들은 그 강의 [A]이 이유일 수 있다고 믿는다. 밤에, 따뜻한 공기가 산맥에서 온 차가운 [B]와 만난다.","bank":["location","air","sailors","lighthouse","seconds","kilometers"],"bko":{"location":"위치","air":"공기","sailors":"선원들","lighthouse":"등대","seconds":"초","kilometers":"킬로미터"},"r":{"a":"[A] location, [B] air","ev":"11~13번 문장","s":[[11,"However, scientists believe one reason may be the location.","하지만, 과학자들은 한 가지 이유가 위치일 수 있다고 믿는다."],[12,"The river is surrounded by the Andes Mountains.","그 강은 안데스 산맥으로 둘러싸여 있다."],[13,"At night, the warm air from the river meets the cold air from the mountains.","밤에, 그 강에서 온 따뜻한 공기는 산맥의 차가운 공기와 만난다."]],"w":"11번에서 과학자들은 location(위치)이 한 가지 이유일 수 있다고 믿어요. 12~13번에서 그 위치 때문에 밤에 강의 따뜻한 공기가 산맥의 차가운 air(공기)와 만난다고 해요.","c":null},"h":"b21fe839ab"}]},{"u":6,"id":"hk2-06-2","no":2,"ko":"진짜 보물찾기","items":[{"n":1,"t":"tf","q":"Adam and Lisa like to look for valuable things buried underground.","ko":"Adam과 Lisa는 땅속에 묻힌 귀중한 물건들을 찾는 것을 좋아한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They go looking for valuable things buried underground.","그들은 땅속에 묻힌 귀중한 물건들을 찾아다닌다."]],"w":"2번 문장에 They go looking for valuable things buried underground가 있어요. 땅속에 묻힌 귀중한 물건을 찾아다닌다는 내용과 일치해요.","c":"T"},"h":"c51c0c516e"},{"n":2,"t":"tf","q":"The first thing Adam and Lisa found was a gold coin.","ko":"Adam과 Lisa가 처음 발견한 것은 금화였다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It was a silver coin.","그것은 은화였다."]],"w":"7번 문장은 It was a silver coin이에요. 금화가 아니라 은화예요.","c":"F"},"h":"8a50f8d4b0"},{"n":3,"t":"tf","q":"The coins were more than 1,000 years old.","ko":"그 동전들은 1,000년이 넘은 것들이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Surprisingly, the coins were more than 1,000 years old.","놀랍게도, 그 동전들은 1,000년이 넘은 것들이었다."]],"w":"12번 문장에 the coins were more than 1,000 years old가 있어요. 1,000년이 넘었다는 내용과 일치해요.","c":"T"},"h":"088dea30c2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Adam was investigating the field with his metal detector.)","ko":"Adam은 금속 탐지기로 들판을 ( ) 있었다.","opts":["심고","청소하고","살피고","팔고"],"word":"investigating","r":{"a":"3) 살피고","ev":"4~5번 문장","s":[[4,"Adam was investigating the field with his metal detector.","Adam은 금속 탐지기로 들판을 살피고 있었다."],[5,"Suddenly, it started beeping.","갑자기, 그것은 삐 소리를 내기 시작했다."]],"w":"금속 탐지기로 들판을 훑는 상황이고, 곧 탐지기가 삐 소리를 내요(5번). 땅속에 무엇이 있는지 알아보는 것이니까 investigate는 '살피다, 조사하다'예요.","c":3},"h":"39b5fcded6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The expert said they were worth seven million dollars!)","ko":"전문가는 그것들이 700만 달러( )라고 말했다!","opts":["가 부족하다","의 가치가 있다","를 빌렸다","에 묻혀 있다"],"word":"worth","r":{"a":"2) 의 가치가 있다","ev":"13~14번 문장","s":[[13,"And there was even better news.","그리고 훨씬 더 좋은 소식이 있었다."],[14,"The expert said they were worth seven million dollars!","전문가는 그것들이 700만 달러의 가치가 있다고 말했다!"]],"w":"전문가가 동전의 가치를 말해 주는 장면이에요. 13번에서 훨씬 더 좋은 소식이라고 했으니 be worth는 '~의 가치가 있다'예요.","c":2},"h":"4f1116dfe6"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSuddenly, it started beeping.","ko":"밑줄 친 it이 가리키는 것은?","sko":"갑자기, 그것은 삐 소리를 내기 시작했다.","opts":["들판","은화","농장","금속 탐지기"],"r":{"a":"4) 금속 탐지기","ev":"4~5번 문장","s":[[4,"Adam was investigating the field with his metal detector.","Adam은 금속 탐지기로 들판을 살피고 있었다."],[5,"Suddenly, it started beeping.","갑자기, 그것은 삐 소리를 내기 시작했다."]],"w":"4번에서 Adam이 금속 탐지기(metal detector)로 들판을 살피고 있었어요. 삐 소리를 낸 것은 그 탐지기예요. 은화는 소리를 내지 않고, 탐지기가 반응해서 발견된 것(7번)이에요.","c":4},"h":"8e0e3d818a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"After digging around for ho "},"h":"537247de03"},{"n":3,"t":"tf","q":"It was reported in 2017 that more than 80% of Americans throw away perfectly good food.","ko":"2017년에 80퍼센트가 넘는 미국인들이 완전히 괜찮은 음식을 버린다고 보고되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"In fact, it was reported in 2017 that more than 80% of Americans throw away perfectly good food.","실제로, 2017년에 80퍼센트가 넘는 미국인들이 완전히 괜찮은 음식을 버린다고 보고되었다."]],"w":"13번 문장에 it was reported in 2017 that more than 80% of Americans throw away perfectly good food가 그대로 있어요. 내용과 일치해요.","c":"T"},"h":"938a74dbb1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The sell-by date tells stores how long they can display the product for sale.)","ko":"유통기한은 가게에 얼마나 오래 제품을 판매하기 위해 ( ) 수 있는지를 알려준다.","opts":["포장할","버릴","진열할","반품할"],"word":"display","r":{"a":"3) 진열할","ev":"6번 문장","s":[[6,"The sell-by date tells stores how long they can display the product for sale.","유통기한은 가게에 얼마나 오래 제품을 판매하기 위해 진열할 수 있는지를 알려준다."]],"w":"가게가 제품을 판매하기 위해 매장에 내놓는 기간을 말해요. 판매(for sale)를 위해 내놓는 것이니 display는 '진열하다'예요.","c":3},"h":"616cf674fc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As a result, people often waste food.)","ko":"결과적으로, 사람들은 종종 음식을 ( ).","opts":["요리한다","낭비한다","기부한다","저장한다"],"word":"waste","r":{"a":"2) 낭비한다","ev":"12~14번 문장","s":[[12,"As a result, people often waste food.","결과적으로, 사람들은 종종 음식을 낭비한다."],[13,"In fact, it was reported in 2017 that more than 80% of Americans throw away perfectly good food.","실제로, 2017년에 80퍼센트가 넘는 미국인들이 완전히 괜찮은 음식을 버린다고 보고되었다."],[14,"What a waste!","얼마나 낭비인가!"]],"w":"13번에서 사람들이 완전히 괜찮은 음식을 버린다고 하고, 14번은 What a waste!(얼마나 낭비인가!)예요. 그래서 waste는 '낭비하다'예요.","c":2},"h":"1414ecb8e8"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is the last day you can safely eat the food.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 음식을 안전하게 먹을 수 있는 마지막 날이다.","opts":["4월 2일","유통기한","냉장고 안의 우유","소비기한"],"r":{"a":"4) 소비기한","ev":"7~8번 문장","s":[[7,"What you really need to check is the use-by date.","진짜로 확인해야 하는 것은 소비기한이다."],[8,"This is the last day you can safely eat the food.","이것은 음식을 안전하게 먹을 수 있는 마지막 날이다."]],"w":"7번에서 진짜로 확인해야 하는 것은 use-by date(소비기한)라고 했고, 8번 This는 바로 그 소비기한이에요. 유통기한(sell-by date)은 가게가 진열하는 기한이에요(6번).","c":4},"h":"266d052aa5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So you can still eat food that is past its sell-by date, as long as it is before the use-by date.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 당신은 음식이 소비기한 이전인 한, 그것의 유통기한이 지난 음식을 여전히 먹을 수 있다.","opts":["소비기한 이전이기만 하면, 유통기한이 지난 음식도 여전히 먹을 수 있다.","유통기한이 지나면 음식은 어떤 경우에도 먹을 수 없다.","유통기한 전이기만 하면, 소비기한이 지난 음식도 먹을 수 있다.","유통기한이 지난 음식은 소비기한과 관계없이 먹어도 된다."],"r":{"a":"1) 소비기한 이전이기만 하면, 유통기한이 지난 음식도 여전히 먹을 수 있다.","ev":"10번 문장","s":[[10,"So you can still eat food that is past its sell-by date, as long as it is before the use-by date.","그래서 당신은 음식이 소비기한 이전인 한, 그것의 유통기한이 지난 음식을 여전히 먹을 수 있다."]],"w":"as long as it is before the use-by date는 '소비기한 전인 한'이에요. 유통기한이 지나도 소비기한이 지나지 않았을 때만 먹을 수 있다는 뜻이라서, 소비기한이 지난 음식까지 먹어도 된다는 말은 아니에요.","c":1},"h":"99d2a3cad8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["소비기한은 가게가 음식 판매를 시작하는 날이다.","두 기한을 구분하는 것은 항상 쉽지만은 않다.","유통기한이 4월 2일인 우유는 4월 10일에 마시면 안전하지 않다.","대부분의 미국인은 괜찮은 음식을 절대 버리지 않는다."],"opts":["The use-by date is the day when stores start selling the food.","It is not always easy to distinguish the sell-by date and the use-by date.","Milk with a sell-by date of April 2 is not safe to drink on April 10.","Most Americans never throw away good food."],"r":{"a":"2) It is not always easy to distinguish the sell-by date and the use-by date.","ev":"11번 문장","s":[[11,"Unfortunately, it’s not always easy to distinguish these dates.","불행히도, 이 기한들을 구분하는 것이 항상 쉽지만은 않다."]],"w":"11번에서 이 기한들을 구분하는 것이 항상 쉽지만은 않다고 해요. 소비기한은 먹을 수 있는 마지막 날이고(8번), 4월 10일에도 소비기한 전이면 마실 수 있으며(5번, 10번), 80%가 넘는 미국인이 괜찮은 음식을 버려요(13번).","c":2},"h":"10791b500e"},{"n":9,"t":"sum","q":"The (A) date is the last day you can safely eat food, and it is usually a few days or weeks (B) the sell-by date.","ko":"(A)은 음식을 안전하게 먹을 수 있는 마지막 날이며, 보통 유통기한보다 며칠 또는 몇 주 (B).","oko":["(A) 유통기한 / (B) 더 늦다","(A) 소비기한 / (B) 더 이르다","(A) 유통기한 / (B) 더 이르다","(A) 소비기한 / (B) 같다","(A) 소비기한 / (B) 더 늦다"],"opts":["(A) sell-by / (B) later than","(A) use-by / (B) earlier than","(A) sell-by / (B) earlier than","(A) use-by / (B) the same as","(A) use-by / (B) later than"],"r":{"a":"5) (A) use-by / (B) later than","ev":"8~9번 문장","s":[[8,"This is the last day you can safely eat the food.","이것은 음식을 안전하게 먹을 수 있는 마지막 날이다."],[9,"Usually, the use-by date is a few days or weeks later than the sell-by date.","보통, 소비기한은 유통기한보다 며칠 또는 몇 주 더 늦다."]],"w":"8번에서 use-by date(소비기한)가 음식을 안전하게 먹을 수 있는 마지막 날이라고 하고, 9번에서 소비기한은 유통기한보다 며칠 또는 몇 주 더 늦다(later than)고 해요.","c":5},"h":"cb7bb4661d"},{"n":10,"t":"fill","q":"It is not always easy to [A] the two dates, so people often [B] food.","ko":"두 기한을 [A]하는 것이 항상 쉬운 것은 아니라서, 사람들은 종종 음식을 [B]한다.","bank":["distinguish","waste","display","safely","sell","report"],"bko":{"distinguish":"구분하다","waste":"낭비하다","display":"진열하다","safely":"안전하게","sell":"판매하다","report":"보고하다"},"r":{"a":"[A] distinguish, [B] waste","ev":"11~12번 문장","s":[[11,"Unfortunately, it’s not always easy to distinguish these dates.","불행히도, 이 기한들을 구분하는 것이 항상 쉽지만은 않다."],[12,"As a result, people often waste food.","결과적으로, 사람들은 종종 음식을 낭비한다."]],"w":"11번에서 이 기한들을 distinguish(구분하다)하는 것이 항상 쉽지만은 않다고 해요. 12번에서 그 결과 사람들이 종종 음식을 waste(낭비하다)한다고 해요.","c":null},"h":"2cef4b90e4"}]},{"u":7,"id":"hk2-07-1","no":1,"ko":"Hot 뜨거 Hot 뜨거","items":[{"n":1,"t":"tf","q":"The iron in a hand warmer starts to rust when the package is opened.","ko":"포장을 열면 손난로 안의 철이 녹슬기 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"If you open the package, the iron in the packet is exposed to air and begins to rust.","만약 포장을 열면, 봉지 안에 있는 철이 공기에 노출되고 녹슬기 시작한다."]],"w":"6번 문장에서 포장을 열면 철이 공기에 노출되어 녹슬기 시작한다고 해요. 그대로 맞는 내용이에요.","c":"T"},"h":"cf46dfb008"},{"n":2,"t":"tf","q":"Shaking a hand warmer makes the reaction slower.","ko":"손난로를 흔들면 반응이 더 느려진다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"If you shake the hand warmer, the reaction occurs faster.","만약 손난로를 흔들면, 반응은 더 빠르게 일어난다."]],"w":"8번 문장에서 흔들면 반응이 더 빠르게(faster) 일어난다고 해요. 느려진다는 말은 반대예요.","c":"F"},"h":"a942bc2d6d"},{"n":3,"t":"tf","q":"A hand warmer starts to cool down after all of its iron is rusted.","ko":"철이 모두 녹슬고 나면 손난로는 식기 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"When all of the iron is rusted, the hand warmer no longer gives off heat and begins to cool down.","모든 철이 녹슬면, 손난로는 더 이상 열을 방출하지 않고 식기 시작한다."]],"w":"9번 문장에서 철이 모두 녹슬면 열을 내지 않고 식기 시작한다고 해요. 본문과 맞아요.","c":"T"},"h":"b964b46615"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is usually sealed in a plastic package.)","ko":"그것은 보통 비닐 포장 안에 ( ) 있다.","opts":["던져져","구겨져","밀봉되어","녹여져"],"word":"sealed","r":{"a":"3) 밀봉되어","ev":"5번 문장","s":[[5,"It is usually sealed in a plastic package.","그것은 보통 비닐 포장 안에 밀봉되어 있다."]],"w":"5번 문장은 손난로 봉지가 비닐 포장 안에 들어 있다는 설명이에요. 공기가 안 들어가게 막아 둔 상태라 is sealed는 '밀봉되어 있다'예요.","c":3},"h":"549b3c0ff1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This reaction releases heat energy.)","ko":"이 반응은 열에너지를 ( ).","opts":["방출한다","흡수한다","막는다","저장한다"],"word":"releases","r":{"a":"1) 방출한다","ev":"6~7번 문장","s":[[6,"If you open the package, the iron in the packet is exposed to air and begins to rust.","만약 포장을 열면, 봉지 안에 있는 철이 공기에 노출되고 녹슬기 시작한다."],[7,"This reaction releases heat energy.","이 반응은 열에너지를 방출한다."]],"w":"철이 녹스는 반응(6번)이 열을 내보내서 손난로가 따뜻해져요(7번). release(방출하다)는 '내보내다'라는 뜻이에요.","c":1},"h":"4f4adba219"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is usually sealed in a plastic package.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 보통 비닐 포장 안에 밀봉되어 있다.","opts":["철 가루","손난로(작은 봉지)","비닐 포장","공기"],"r":{"a":"2) 손난로(작은 봉지)","ev":"4~5번 문장","s":[[4,"A hand warmer is a small packet that is filled with iron powder.","손난로는 철 가루로 채워진 작은 봉지이다."],[5,"It is usually sealed in a plastic package.","그것은 보통 비닐 포장 안에 밀봉되어 있다."]],"w":"4번에서 손난로는 철 가루로 채워진 작은 봉지라고 했고, 5번의 It은 그 손난로(봉지)예요. 철 가루는 봉지 안에 든 것이고 비닐 포장은 봉지를 싸는 거예요.","c":2},"h":"37aa0bbaec"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Otherwise, the reaction won’t stop until all of the iron becomes rusted.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그렇지 않으면, 그 반응은 모든 철이 녹슬게 될 때까지 멈추지 않을 것이다.","opts":["그렇지 않으면, 철이 녹슬기 전에 반응이 멈출 것이다.","그렇지 않으면, 반응은 공기가 모두 빠져나갈 때까지 계속된다.","그러므로, 철이 녹슬면 반응은 곧바로 멈춘다.","그렇지 않으면, 반응은 철이 전부 녹슬 때까지 멈추지 않는다."],"r":{"a":"4) 그렇지 않으면, 반응은 철이 전부 녹슬 때까지 멈추지 않는다.","ev":"13번 문장","s":[[13,"Otherwise, the reaction won’t stop until all of the iron becomes rusted.","그렇지 않으면, 그 반응은 모든 철이 녹슬게 될 때까지 멈추지 않을 것이다."]],"w":"until은 '~할 때까지'예요. 용기에 공기가 들어가면 철이 다 녹슬 때까지 반응이 계속돼요. Otherwise는 '그렇지 않으면'이에요.","c":4},"h":"bdd65d4b66"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["손난로는 철 대신 물로 채워져 있다.","손난로의 반응은 흔들면 더 느려진다.","용기 안에 공기가 들어가야 반응이 멈춘다.","열기가 사라지기 전에 용기에 넣으면 반응을 잠시 멈출 수 있다."],"opts":["A hand warmer is filled with water instead of iron powder.","The reaction of a hand warmer becomes slower when you shake it.","Air has to get inside the container to stop the reaction.","Putting a hand warmer in a container before the heat goes away can stop the reaction for a while."],"r":{"a":"4) Putting a hand warmer in a container before the heat goes away can stop the reaction for a while.","ev":"10~12번 문장","s":[[10,"If you want to use the hand warmer again later, there’s a way to stop the reaction for a while.","만약 손난로를 나중에 다시 사용하고 싶다면, 잠시 동안 그 반응을 멈출 방법이 있다."],[11,"Just put it in a container before the heat goes away.","열기가 사라지기 전에 그냥 그것을 용기 안에 넣어라."],[12,"However, make sure that no air gets inside.","그러나, 어떠한 공기도 안에 들어가지 않도록 확실히 해라."]],"w":"10~11번에서 열기가 사라지기 전에 용기에 넣으면 반응을 잠시 멈출 수 있다고 해요. 철 가루(4번), 흔들면 더 빠름(8번), 공기가 못 들어가게(12번)와 다른 선지는 모두 어긋나요.","c":4},"h":"2b0be07f06"},{"n":9,"t":"sum","q":"A hand warmer is a packet filled with (A) powder. When it is exposed to air, the powder (B) and releases heat.","ko":"손난로는 (A) 가루로 채워진 봉지이다. 공기에 노출되면, 그 가루는 (B)하고 열을 방출한다.","oko":["(A) 모래 / (B) 녹슨다","(A) 철 / (B) 얼어붙는다","(A) 물 / (B) 녹는다","(A) 철 / (B) 불탄다","(A) 철 / (B) 녹슨다"],"opts":["(A) sand / (B) rusts","(A) iron / (B) freezes","(A) water / (B) melts","(A) iron / (B) burns","(A) iron / (B) rusts"],"r":{"a":"5) (A) iron / (B) rusts","ev":"4번, 6번, 7번 문장","s":[[4,"A hand warmer is a small packet that is filled with iron powder.","손난로는 철 가루로 채워진 작은 봉지이다."],[6,"If you open the package, the iron in the packet is exposed to air and begins to rust.","만약 포장을 열면, 봉지 안에 있는 철이 공기에 노출되고 녹슬기 시작한다."],[7,"This reaction releases heat energy.","이 반응은 열에너지를 방출한다."]],"w":"4번에서 철(iron) 가루로 채워져 있고, 6번에서 공기에 노출되면 녹슬기(rust) 시작해요. 7번에서 그 반응이 열을 내요.","c":5},"h":"77bb89a08d"},{"n":10,"t":"fill","q":"To use a hand warmer again, put it in a [A] before the heat goes away, and make sure no [B] gets inside.","ko":"손난로를 다시 쓰려면, 열기가 사라지기 전에 [A] 안에 넣고, [B]이(가) 안에 들어가지 않도록 확실히 하라.","bank":["container","air","shake","powder","rusted","reaction"],"bko":{"container":"용기","air":"공기","shake":"흔들다","rusted":"녹슨","reaction":"반응","powder":"가루"},"r":{"a":"[A] container, [B] air","ev":"11~12번 문장","s":[[11,"Just put it in a container before the heat goes away.","열기가 사라지기 전에 그냥 그것을 용기 안에 넣어라."],[12,"However, make sure that no air gets inside.","그러나, 어떠한 공기도 안에 들어가지 않도록 확실히 해라."]],"w":"11번에서 열기가 사라지기 전에 용기(container)에 넣으라고 하고, 12번에서 공기(air)가 못 들어가게 하라고 해요.","c":null},"h":"c14e03019b"}]},{"u":7,"id":"hk2-07-2","no":2,"ko":"자꾸만 버리고 싶네?","items":[{"n":1,"t":"tf","q":"Everyone can see the votes because the bins are clear containers.","ko":"쓰레기통이 투명한 용기여서 모든 사람이 투표 결과를 볼 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The bins are clear containers, so everyone can see how many other people voted for each option.","그 쓰레기통은 투명한 용기여서, 모든 사람이 각 선택지에 다른 사람들이 얼마나 많이 투표했는지 볼 수 있다."]],"w":"8번 문장에서 쓰레기통이 투명한 용기여서 모두가 각 선택지에 몇 명이 투표했는지 볼 수 있다고 해요. 본문과 맞아요.","c":"T"},"h":"ba4dc46369"},{"n":2,"t":"tf","q":"The two trash cans at an event show the same answer.","ko":"행사의 두 쓰레기통은 같은 답을 보여 준다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"For example, two trash cans are placed at an event, and each represents a different answer to one question.","예를 들어, 행사에 두 개의 쓰레기통이 설치되어 있고, 각각은 하나의 질문에 대한 다른 답변을 나타내고 있다."]],"w":"4번 문장에서 두 쓰레기통은 각각 하나의 질문에 대한 '다른' 답을 나타낸다고 해요. 같은 답이라는 말은 반대예요.","c":"F"},"h":"97f1b22130"},{"n":3,"t":"tf","q":"More than 30,000 people voted at a festival in the Netherlands.","ko":"네덜란드의 한 축제에서 3만 명이 넘는 사람들이 투표했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"At one festival held in the Netherlands, more than 30,000 people picked up trash and voted.","네덜란드에서 열린 한 축제에서는, 3만 명이 넘는 사람들이 쓰레기를 주워서 투표했다."]],"w":"10번 문장에 네덜란드에서 열린 한 축제에서 3만 명이 넘는 사람들이 쓰레기를 주워 투표했다고 나와요.","c":"T"},"h":"c04bc469a9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…each represents a different answer to one question.)","ko":"각각은 하나의 질문에 대한 다른 답변을 ( ).","opts":["숨긴다","나타낸다","지운다","묻는다"],"word":"represents","r":{"a":"2) 나타낸다","ev":"4번 문장","s":[[4,"For example, two trash cans are placed at an event, and each represents a different answer to one question.","예를 들어, 행사에 두 개의 쓰레기통이 설치되어 있고, 각각은 하나의 질문에 대한 다른 답변을 나타내고 있다."]],"w":"4번은 쓰레기통 두 개가 각각 서로 다른 답을 보여 준다는 뜻이에요. represent(나타내다, 대표하다)가 알맞아요.","c":2},"h":"774c11d64a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…how many other people voted for each option.)","ko":"…각 ( )에 다른 사람들이 얼마나 많이 투표했는지…","opts":["후보자","날짜","장소","선택지"],"word":"option","r":{"a":"4) 선택지","ev":"5번, 6번, 8번 문장","s":[[5,"If the question is “What is the best superpower?”, one trash can could say “Invisibility.”","만약 그 질문이 ‘최고의 초능력은 무엇인가?’라면, 한 쓰레기통에는 ‘투명인간’이라고 쓰여 있을 수 있다."],[6,"And the other could say “Flying.”","그리고 나머지 하나에는 ‘날기’라고 쓰여 있을 수 있다."],[8,"The bins are clear containers, so everyone can see how many other people voted for each option.","그 쓰레기통은 투명한 용기여서, 모든 사람이 각 선택지에 다른 사람들이 얼마나 많이 투표했는지 볼 수 있다."]],"w":"5~6번에서 쓰레기통마다 ‘투명인간’, ‘날기’ 같은 답이 쓰여 있어요. 그 하나하나가 선택지(option)이고, 8번에서 각 선택지의 투표 수를 볼 수 있어요.","c":4},"h":"6b7e9831d8"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nThen, people can vote by throwing their trash into the bin they agree with.","ko":"밑줄 친 their가 가리키는 것은?","sko":"그러면, 사람들은 그들이 동의하는 쓰레기통 안에 쓰레기를 버려서 투표할 수 있다.","opts":["사람들","쓰레기통들","질문들","행사 직원들"],"r":{"a":"1) 사람들","ev":"7번 문장","s":[[7,"Then, people can vote by throwing their trash into the bin they agree with.","그러면, 사람들은 그들이 동의하는 쓰레기통 안에 쓰레기를 버려서 투표할 수 있다."]],"w":"쓰레기를 던져 투표하는 사람은 앞에 나온 people이에요. their trash는 '그 사람들의 쓰레기'예요.","c":1},"h":"7aefac6e37"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These voting trash cans actually work well.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 투표용 쓰레기통은 실제로 효과가 좋다.","opts":["이 투표용 쓰레기통은 실제로는 작동하지 않는다.","이 투표용 쓰레기통은 아직 만들어지지 않았다.","이 투표용 쓰레기통은 실제로 효과가 좋다.","이 투표용 쓰레기통은 너무 비싸서 쓰기 어렵다."],"r":{"a":"3) 이 투표용 쓰레기통은 실제로 효과가 좋다.","ev":"9~10번 문장","s":[[9,"These voting trash cans actually work well.","이 투표용 쓰레기통은 실제로 효과가 좋다."],[10,"At one festival held in the Netherlands, more than 30,000 people picked up trash and voted.","네덜란드에서 열린 한 축제에서는, 3만 명이 넘는 사람들이 쓰레기를 주워서 투표했다."]],"w":"work well은 '잘 작동하다, 효과가 좋다'예요. 바로 뒤 10번에서 3만 명이 넘게 참여했다는 사례가 나와요.","c":3},"h":"f486897b8a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["두 쓰레기통에는 반드시 같은 단어가 쓰여야 한다.","한 쓰레기통에는 ‘투명인간’, 나머지 하나에는 ‘날기’라고 쓰일 수 있다.","사람들은 종이에 이름을 써서 투표한다.","쓰레기통이 어두워서 아무도 투표 수를 볼 수 없다."],"opts":["Both trash cans must say the same word.","One trash can may say “Invisibility” and the other “Flying.”","People vote by writing their names on paper.","The bins are dark, so nobody can see the number of votes."],"r":{"a":"2) One trash can may say “Invisibility” and the other “Flying.”","ev":"5~6번 문장","s":[[5,"If the question is “What is the best superpower?”, one trash can could say “Invisibility.”"
