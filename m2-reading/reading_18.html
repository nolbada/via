rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

var D=[{"n": 1, "tag": null, "en": "Accidents can happen anytime, anywhere.", "ko": "사고는 언제 어디서든 일어날 수 있다.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "However, knowing first aid can stop situations from get worse.", "ko": "하지만 응급 처치를 아는 것은 상황이 더 나빠지는 것을 막을 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "get", "right": "getting", "partial": false, "at": [8], "point": "동명사: 전치사 from 뒤에는 동명사 getting 사용", "topic": "동명사", "memo": "전치사 from 뒤에는 동명사 getting 사용"}]}, {"n": 3, "tag": null, "en": "If you have basic first aid skills, you can help yourself and others which are in need.", "ko": "만약 여러분이 기본적인 응급 처치법을 알고 있다면 여러분 자신과 도움이 필요한 다른 사람들을 도울 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "which", "right": "who", "partial": false, "at": [13], "point": "관계대명사: 선행사가 사람(others)이므로 관계대명사 who 사용", "topic": "관계대명사", "memo": "선행사가 사람(others)이므로 관계대명사 who 사용"}]}, {"n": 4, "tag": "Burns", "en": "This morning, Katie were making a apple pie for her family.", "ko": "오늘 아침 Katie는 식구들을 위해 애플파이를 만들고 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [3], "point": "수일치: 주어 Katie(단수)에 맞춰 was 사용", "topic": "수일치", "memo": "주어 Katie(단수)에 맞춰 was 사용"}, {"wrong": "a", "right": "an", "partial": false, "at": [5], "point": "관사: 모음 발음으로 시작하는 apple 앞에는 부정관사 an 사용", "topic": "관사", "memo": "모음 발음으로 시작하는 apple 앞에는 부정관사 an 사용"}]}, {"n": 5, "tag": null, "en": "When she opened the oven, a deliciously smell filled the kitchen.", "ko": "그녀가 오븐을 열었을 때 맛있는 냄새가 부엌을 가득 채웠다.", "ok": false, "foot": [], "fixes": [{"wrong": "deliciously", "right": "delicious", "partial": false, "at": [6], "point": "형용사/부사: 명사 smell을 꾸미는 자리이므로 형용사 delicious 사용", "topic": "형용사/부사", "memo": "명사 smell을 꾸미는 자리이므로 형용사 delicious 사용"}]}, {"n": 6, "tag": null, "en": "In excitement, she grabbed the pan with her bare hand.", "ko": "흥분한 나머지 그녀는 맨손으로 팬을 잡았다.", "ok": false, "foot": ["1bare 맨, 아무것도 걸치지 않은"], "fixes": [{"wrong": "hand", "right": "hands", "partial" are hands.", "흥분한 나머지 그녀는 맨손으로 팬을 잡았다.", 0], ["Ouch! Her fingers that touched the hot pan turned red and started to hurt.", "아야! 뜨거운 팬에 닿은 그녀의 손가락들은 붉어졌고 아프기 시작했다.", 0], ["Cool the burn under running water for more than 10 minutes.", "데인 곳을 10분 이상 동안 흐르는 물 아래에서 식혀라.", 0], ["Do not use ice.", "얼음을 사용하지 마라.", 0], ["It can damage the skin.", "그것은 피부를 손상시킬 수 있다.", 0], ["One sunny afternoon, Yunho and his classmates were watering the plants in the school garden.", "어느 맑은 날 오후, 윤호와 그의 반 친구들은 학교 정원에서 화초에 물을 주고 있었다.", 0], ["Suddenly, someone shouted, \"Look at the bees!\"", "갑자기 누군가 소리쳤다. \"저 벌들 좀 봐!\"", 0], ["The students ran and screamed, and the peaceful garden turned into chaos.", "학생들은 뛰어다니며 소리쳤고, 고요했던 정원은 아수라장으로 바뀌었다.", 0], ["Ouch! A bee stung Yunho on the forehead.", "아야! 벌 한 마리가 윤호의 이마를 쏘았다.", 0], ["He tried to remove the stinger with his fingers, but he could not.", "그는 손가락으로 벌침을 제거하려고 했지만 할 수 없었다.", 0], ["The area swelled quickly.", "쏘인 곳은 빠르게 부어올랐다.", 0], ["Look for something that looks like a black dot.", "검은 점처럼 보이는 것을 찾아라.", 0], ["That is the stinger.", "그것이 벌침이다.", 0], ["Remove it with a flat object like a student ID card.", "학생증과 같이 납작한 물건으로 그것을 제거하라.", 0], ["Wash the area with soap and cool water.", "쏘인 곳을 비누와 찬물로 씻어라.", 0], ["Seojun was talking with Leah when the bell rang.", "서준은 수업 종이 울렸을 때 Leah와 이야기하고 있었다.", 0], ["\"It's time for music class. Mr. Kim will be angry if we are late,\" said Seojun.", "\"음악 시간이다. 우리가 늦으면 김 선생님이 화내실 거야.\"라고 서준이가 말했다.", 0], ["They hurried to the music room.", "그들은 서둘러서 음악실로 갔다.", 0], ["At the top of the stairs, Seojun started jumping down.", "계단 꼭대기에서 서준이가 뛰어내리기 시작했다.", 0], ["\"Watch out!\" shouted Leah.", "\"조심해!\"라고 Leah가 소리쳤다.", 0], ["Seojun jumped down five steps at once.", "서준이는 다섯 개의 계단을 한 번에 뛰어내렸다.", 0], ["When he landed, he felt a sharp pain in his leg.", "그가 착지했을 때 다리에 강한 통증을 느꼈다.", 0], ["\"Arrrrrgh! I think I broke my leg!\"", "\"아! 내 다리가 부러진 것 같아!\"", 0], ["Do not move the leg.", "다리를 움직이지 마라.", 0], ["This can cause more damage.", "그것은 더 많은 손상을 야기할 수 있다.", 0], ["Support the leg with something, such as a bag or a stick.", "가방이나 막대기 같은 것으로 다리를 지지해라.", 0]];var RNUM=18;var TITLE_EN="Let's Learn First Aid";var PASS_EN=["Let's Learn First Aid", "Accidents can happen anytime, anywhere. However, knowing first aid can stop situations from getting worse. If you have basic first aid skills, you can help yourself and others who are in need.", "This morning, Katie was making an apple pie for her family. When she opened the oven, a delicious smell filled the kitchen. In excitement, she grabbed the pan with her bare hands. Ouch! Her fingers that touched the hot pan turned red and started to hurt.", "Cool the burn under running water for more than 10 minutes. Do not use ice. It can damage the skin.", "One sunny afternoon, Yunho and his classmates were watering the plants in the school garden. Suddenly, someone shouted, \"Look at the bees!\" The students ran and screamed, and the peaceful garden turned into chaos. Ouch! A bee stung Yunho on the forehead. He tried to remove the stinger with his fingers, but he could not. The area swelled quickly.", "Look for something that looks like a black dot. That is the stinger. Remove it with a flat object like a student ID card. Wash the area with soap and cool water.", "Seojun was talking with Leah when the bell rang. \"It's time for music class. Mr. Kim will be angry if we are late,\" said Seojun. They hurried to the music room. At the top of the stairs, Seojun started jumping down. \"Watch out!\" shouted Leah. Seojun jumped down five steps at once. When he landed, he felt a sharp pain in his leg. \"Arrrrrgh! I think I broke my leg!\"", "Do not move the leg. This can cause more damage. Support the leg with something, such as a bag or a stick."];var PASS_KO=["응급 처치를 배워 봅시다", "사고는 언제 어디서든 일어날 수 있다. 하지만 응급 처치를 아는 것은 상황이 더 나빠지는 것을 막을 수 있다. 만약 여러분이 기본적인 응급 처치법을 알고 있다면 여러분 자신과 도움이 필요한 다른 사람들을 도울 수 있다.", "오늘 아침 Katie는 식구들을 위해 애플파이를 만들고 있었다. 그녀가 오븐을 열었을 때 맛있는
