<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211f;--sub:#5b6b67;--line:#dbe3e0;--a:#1f6f5c;--soft:#e3f2ee;--good:#16a34a;--bad:#dc2626;--hl:#fff1a8;--pen:#d97706}

지 않을 것이다.", "ex": ["make a speech = 연설하다", "upset = 속상한"]}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "시간·이유의 접속사", "type": "mc", "ans": "①", "concept": ["041", "093-H1"], "gap": "", "words": [["prefer", "더 좋아하다"], ["travel", "여행하다"], ["wait", "기다리다"], ["reach", "연락하다"]], "h1": "밑줄 친 while을 모두 우리말로 풀어 보세요. 다섯 개 중 네 개는 같은 뜻이고 하나만 달라요.", "h2": "while은 '~하는 동안'이라는 시간의 뜻과 '~인 반면'이라는 대조의 뜻이 있어요. 두 사람이나 두 가지를 맞대어 비교하는 문장을 찾으세요.", "why": "①은 '스포츠를 좋아하는 반면 여동생은 책을 더 좋아한다'라는 대조예요. 나머지는 모두 '~하는 동안'이라는 시간이에요.", "opts": [{"n": "①", "en": "Regina loves sports while her sister prefers to read a book.", "ko": "Regina는 스포츠를 좋아하는 반면 그녀의 여동생은 책 읽기를 더 좋아한다.", "ok": true, "why": "두 사람을 대조해서 '~인 반면'이라는 뜻이라 달라요."}, {"n": "②", "en": "Glen took a lot of pictures while he traveled.", "ko": "Glen은 여행하는 동안 사진을 많이 찍었다.", "ok": false, "why": "'~하는 동안'이라는 시간이에요."}, {"n": "③", "en": "I texted Mom while I was waiting for the bus.", "ko": "나는 버스를 기다리는 동안 엄마에게 문자를 보냈다.", "ok": false, "why": "'~하는 동안'이라는 시간이에요."}, {"n": "④", "en": "While we were watching the movie, we ate popcorn.", "ko": "영화를 보는 동안 우리는 팝콘을 먹었다.", "ok": false, "why": "'~하는 동안'이라는 시간이에요."}, {"n": "⑤", "en": "While you were out, she was trying to reach you on the phone.", "ko": "네가 나가 있는 동안 그녀가 너에게 전화하려고 했다.", "ok": false, "why": "'~하는 동안'이라는 시간이에요."}], "pencil": "while은 '~하는 동안' 말고 '~인 ___ '이라는 대조의 뜻도 있다", "pencilKey": "반면", "page": 172, "sec": "s2", "k": "pick", "tr": "① Regina는 스포츠를 좋아한다 ___ 그녀의 여동생은 책 읽는 것을 더 좋아한다. ② Glen은 여행하는 ___ 사진을 많이 찍었다. ③ 나는 버스를 기다리는 ___ 엄마에게 문자를 보냈다. ④ 우리가 영화를 보는 ___ 팝콘을 먹었다. ⑤ 네가 나가 있는 ___ 그녀가 너에게 전화하려고 했다.", "ex": ["prefers(원형 prefer) = 더 좋아한다", "reach = ~와 연락하다", "texted(원형 text) = 문자를 보냈다"]}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "시간·이유의 접속사", "type": "mc", "ans": "④", "concept": ["093-H1", "041"], "gap": "", "words": [["prefer", "더 좋아하다"], ["cheap", "값싼"], ["pass out", "기절하다"], ["flight", "비행"]], "h1": "밑줄이 없는 문제예요. 다섯 문장에서 접속사나 전치사 바로 뒤에 무엇이 오는지 하나씩 확인해 보세요.", "h2": "접속사 뒤에는 '주어 + 동사'가, 전치사  "내가 마실 수 있을 만큼 충분히 뜨거운", "ok": false, "why": "'마실 수 있다'는 뜻이라서 반대예요."}], "pencil": "'너무 ~해서 …할 수 없다'는 ___ ~ to부정사로도 쓴다", "pencilKey": "too", "page": 172, "sec": "s2", "k": "pick", "tr": "우리말 문제예요. 보기의 뜻은 ① 내가 마시기에는 너무 뜨거웠다 ② 너무 뜨거워서 나는 그것을 마실 수 없었다 ③ 너무 뜨거워서 못 마셨다(그런 뜻으로 쓴 문장) ④ 너무 뜨거워서 마실 수 없었다(그런 뜻으로 쓴 문장) ⑤ 내가 마시기에 충분히 뜨거웠다 예요.", "ex": []}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "목적·결과의 접속사", "type": "mc", "ans": "①, ④", "concept": ["025-2", "064"], "gap": "", "words": [["ad", "광고"], ["paper", "신문"], ["roommate", "룸메이트"], ["find", "찾다"]], "h1": "밑줄 친 to find는 '새 룸메이트를 찾기 위해'라는 목적이에요. 보기 중 같은 뜻으로 바꿔 쓴 것을 모두 찾으세요.", "h2": "목적을 나타내는 to부정사는 in order to로 쓸 수 있고, 절로는 so that + 주어 + could로 쓸 수 있어요.", "why": "in order to find와 so that she could find는 모두 '찾기 위해서'라는 목적의 뜻이라서 맞아요.", "opts": [{"n": "①", "en": "in order to find a new roommate", "ko": "새 룸메이트를 찾기 위해서", "ok": true, "why": "to find와 같은 목적의 뜻이라서 맞아요."}, {"n": "②", "en": "once she found a new roommate", "ko": "일단 그녀가 새 룸메이트를 찾으면", "ok": false, "why": "'일단 ~하면'이라는 뜻이라 목적이 아니에요."}, {"n": "③", "en": "that she has found a new roommate", "ko": "그녀가 새 룸메이트를 찾았다는 것", "ok": false, "why": "that절은 명사절이라 목적의 뜻이 아니에요."}, {"n": "④", "en": "so that she could find a new roommate", "ko": "그녀가 새 룸메이트를 찾을 수 있도록", "ok": true, "why": "so that + 주어 + could는 목적이라서 맞아요."}, {"n": "⑤", "en": "such that she could find a new roommate", "ko": "그녀가 새 룸메이트를 찾을 수 있을 정도로", "ok": false, "why": "such that은 목적이 아니라서 틀려요."}], "pencil": "to부정사의 목적은 in order to 또는 so ___ + 주어 + could로 쓴다", "pencilKey": "that", "page": 172, "sec": "s2", "k": "pick", "tr": "그녀는 새 룸메이트를 ___ 신문에 광고를 냈다. 보기의 뜻은 ① 새 룸메이트를 찾기 위해 ② 새 룸메이트를 찾으면 곧바로 ③ 그녀가 새 룸메이트를 찾았다는 것 ④ 그녀가 새 룸메이트를 찾을 수 있도록 ⑤ 그녀가 새 룸메이트를 찾을 수 있을 정도로 예요.", "ex": ["ad = 광고", "paper = 신문", "roommate = 룸메이트"]}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "통합형", "type": "mc", "ans": "⑤", "concept": ["041", "093-H1", "042"], "gap": "", "words": [["strange", "이상한"], ["speeding ticket", "속도위반 딱지"], ["slow down
