명사의 소유격: 명사 앞 소유격은 our 사용", "topic": "인칭대명사의 소유격", "memo": "명사 앞 소유격은 our 사용"}]}, {"n": 6, "tag": null, "en": "All of a sudden, they jumped up high and made huge splashes. Watching whales never get boring.", "ko": "갑자기, 그들이 높이 뛰어올라 거대한 물보라를 만들었다. 고래들을 보는 것은 절대로 지루해지지 않는다.", "ok": false, "foot": [], "fixes": [{"wrong": "get", "right": "gets", "partial": false, "at": [15], "point": "3인칭 단수 현재형: 동명사 주어에는 단수동사 gets 사용", "topic": "3인칭 단수 현재형", "memo": "동명사 주어에는 단수동사 gets 사용"}]}, {"n": 7, "tag": "Nikau · 7월 17일", "en": "Today, I flew a drone to tag humpback whales. I followed them closely and dropped tags careful onto their backs.", "ko": "오늘, 나는 혹등고래에 태그를 달기 위해 드론을 날렸다. 나는 그들을 가까이 따라갔고 그들의 등에 태그를 조심스럽게 떨어뜨렸다.", "ok": false, "foot": [], "fixes": [{"wrong": "careful", "right": "carefully", "partial": false, "at": [16], "point": "형용사와 부사: 동사 dropped를 꾸미는 부사 carefully 사용", "topic": "형용사와 부사", "memo": "동사 dropped를 꾸미는 부사 carefully 사용"}]}, {"n": 8, "tag": null, "en": "We get a lot of informations about them from the tags.", "ko": "우리는 그 태그로부터 그들에 대한 많은 정보를 얻는다.", "ok": false, "foot": [], "fixes": [{"wrong": "informations", "right": "information", "partial": false, "at": [5], "point": "셀 수 없는 명사: information은 불가산이라 복수형 없음", "topic": "셀 수 없는 명사", "memo": "information은 불가산이라 복수형 없음"}]}, {"n": 9, "tag": null, "en": "I am particularly interested on their songs, and the tags have recorded them for several year.", "ko": "나는 특히 그들의 노래에 관심을 가지고 있고, 그 태그들은 그것들을 몇 년 동안 녹음해 오고 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "on", "right": "in", "partial": false, "at": [4], "point": "기본전치사: '~에 관심 있는'은 interested in 사용", "topic": "기본전치사", "memo": "'~에 관심 있는'은 interested in 사용"}, {"wrong": "year", "right": "years", "partial": false, "at": [15], "point": "명사의 복수형: several 뒤에는 복수명사 years 사용", "topic": "명사의 복수형", "memo": "several 뒤에는 복수명사 years 사용"}]}, {"n": 10, "tag": null, "en": "Their songs last up to 30 minute and can travels thousands of kilometers underwater!", "ko": "그들의 노래는 30분까지 지속되며, 물속에서 수천 킬로미터를 이동할 수 있다!", "ok": false, "foot": [], "fixes": [{"wrong": "minute", "right": "minutes", "partial": false, "at": [6], "point": "명사의 복수형: 30 뒤에는 복수명사 minutes 사용", "topic": "명사의 복수형", "memo": "30 뒤에는 복수명사 minutes 사용"}, {"wrong": "travels", "right": "travel", "partial": false, "at": [9], "point": "조동사: 조동사 can 뒤에는 동사원형 travel 사용", "topic": "조동사", "memo": "조동사 can 뒤에는 동사원형 travel 사용"}]}, {"n": 11, "tag": null, "en": "The songs are beautiful, but we still don't know much about them.", "ko": "그 노래들은 아름답지만, 우리는 여전히 그것들에 대해 많이 알지 못한다.", "ok": true, "foot": [], "fixes": []}, {"n": 12, "tag": "Nikau · 8월 2일", "en": "I was filming some humpback whales underwater. Suddenly, one whales came close and pushed me hard.", "ko": "나는 물속에서 몇몇 혹등고래를 찍고 있었다. 갑자기, 고래 한 마리가 가까이 와서 나를 세게 밀었다.", "ok": false, "foot": [], "fixes": [{"wrong": "whales", "right": "whale", "partial": false, "at": [9], "point": "수량 형용사: one 뒤에는 단수명사 whale 사용", "topic": "수량 형용사", "memo": "one 뒤에는 단수명사 whale 사용"}]}, {"n": 13, "tag": null, "en": "I tried to swim away, but it kept pushing my out of the water. I was so surprised.", "ko": "나는 헤엄쳐 가려고 노력했지만, 그것은 계속해서 나를 물 밖으로 밀어냈다. 나는 정말 놀랐다.", "ok": false, "foot": [], "fixes": [{"wrong": "my", "right": "me", "partial": false, "at": [9], "point": "인칭대명사의 목적격: 동사 pushing의 목적어는 목적격 me 사용", "topic": "인칭대명사의 목적격", "memo": "동사 pushing의 목적어는 목적격 me 사용"}]}, {"n": 14, "tag": null, "en": "Then somebody shouted from the boat, \"A tiger shark are coming!\" I safely got on the boat.", "ko": "그때 누군가 배에서 소리쳤다. \"뱀상어가 오고 있다!\" 나는 안전하게 배 위에 탔다.", "ok": false, "foot": [], "fixes": [{"wrong": "are", "right": "is", "partial": false, "at": [9], "point": "현재진행형: 주어 A tiger shark에는 is 사용", "topic": "현재진행형", "memo": "주어 A tiger shark에는 is 사용"}]}, {"n": 15, "tag": null, "en": "I realized that the whale were trying to save me.", "ko": "나는 그 고래가 나를 구하려고 애썼다는 것을 깨달았다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [5], "point": "be동사의 긍정문: 주어 the whale에는 was 사용", "topic": "be동사의 긍정문", "memo": "주어 the whale에는 was 사용"}]}, {"n": 16, "tag": null, "en": "Humpback whales sometimes help others sea animals, but I never expected they to save my life.", "ko": "혹등고래는 때때로 다른 동물들을 돕지만, 나는 그들이 내 생명을 살리리라고 전혀 예상하지 못했다.", "ok": false, "foot": [], "fixes": [{"wrong": "others", "right": "other", "partial": false, "at": [4], "point": "형용사 other/others: 명사 앞에는 형용사 other 사용", "topic": "형용사 other/others", "memo": "명사 앞에는 형용사 other 사용"}, {"wrong": "they", "right": "them", "partial": false, "at": [11], "point": "인칭대명사의 목적격: expect의 목적어는 목적격 them 사용", "topic": "인칭대명사의 목적격", "memo": "expect의 목적어는 목적격 them 사용"}]}];var PP=[["Kia Orana!", "안녕하세요!", 1], ["I'm Nikau from New Zealand.", "저는 뉴질랜드에서 온 Nikau입니다.", 0], ["I'm working at a whale research center in the Cook Islands.", "저는 쿡 제도에 있는 고래 연구소에서 일하고 있어요.", 0], ["I think humpback whales are the most amazing animals in the ocean.", "저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요.", 0], ["I have kept a diary about them to record my work and thoughts.", "저는 제 일과 생각들을 기록하기 위해서 그들에 대한 일기를 써 오고 있습니다.", 0], ["July 1st", "7월 1일", 1], ["Finally, the humpback whales are back!", "마침내, 혹등고래들이 돌아왔다!", 1], ["They have traveled about 6,500 km from the Southern Ocean to give birth.", "그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다.", 0], ["The big and friendly giants came close to our boat and played for a while.", "그 크고 친근한 거대한 동물들이 우리의 보트에 가까이 왔고 잠시 동안 놀았다.", 0], ["All of a sudden, they jumped up high and made huge splashes.", "갑자기, 그들이 높이 뛰어올라 거대한 물보라를 만들었다.", 0], ["Watching whales never gets boring.", "고래들을 보는 것은 절대로 지루해지지 않는다.", 0], ["July 17th", "7월 17일", 1], ["Today, I flew a drone to tag humpback whales.", "오늘, 나는 혹등고래에 태그를 달기 위해 드론을 날렸다.", 1], ["I followed them closely and dropped tags carefully onto their backs.", "나는 그들을 가까이 따라갔고 그들의 등에 태그를 조심스럽게 떨어뜨렸다.", 0], ["We get a lot of information about them from the tags.", "우리는 그 태그로부터 그들에 대한 많은 정보를 얻는다.", 0], ["I am particularly interested in their songs, and the tags have recorded them for several years.", "나는 특히 그들의 노래에 관심을 가지고 있고, 그 태그들은 그것들을 몇 년 동안 녹음해 오고 있다.", 0], ["Their songs last up to 30 minutes and can travel thousands of kilometers underwater!", "그들의 노래는 30분까지 지속되며, 물속에서 수천 킬로미터를 이동할 수 있다!", 0], ["The songs are beautiful, but we still don't know much about them.", "그 노래들은 아름답지만, 우리는 여전히 그것들에 대해 많이 알지 못한다.", 0], ["August 2nd", "8월 2일", 1], ["I was filming some humpback whales underwater.", "나는 물속에서 몇몇 혹등고래를 찍고 있었다.", 1], ["Suddenly, one whale came close and pushed me hard.", "갑자기, 고래 한 마리가 가까이 와서 나를 세게 밀었다.", 0], ["I tried to swim away, but it kept pushing me out of the water.", "나는 헤엄쳐 가려고 노력했지만, 그것은 계속해서 나를 물 밖으로 밀어냈다.", 0], ["I was so surprised.", "나는 정말 놀랐다.", 0], ["Then somebody shouted from the boat, \"A tiger shark is coming!\"", "그때 누군가 배에서 소리쳤다. \"뱀상어가 오고 있다!\"", 0], ["I safely got on the boat.", "나는 안전하게 배 위에 탔다.", 0], ["I realized that the whale was trying to save me.", "나는 그 고래가 나를 구하려고 애썼다는 것을 깨달았다.", 0], ["Humpback whales sometimes help other sea animals, but I never expected them to save my life.", "혹등고래는 때때로 다른 동물들을 돕지만, 나는 그들이 내 생명을 살리리라고 전혀 예상하지 못했다.", 0]];var RNUM=40;var TITLE_EN="I Love Humpback Whales";var PASS_EN=["I Love Humpback Whales", "Kia Orana! I'm Nikau from New Zealand. I'm working at a whale research center in the Cook Islands. I think humpback whales are the most amazing animals in the ocean. I have kept a diary about them to record my work and thoughts.", "July 1st", "Finally, the humpback whales are back! They have traveled about 6,500 km from the Southern Ocean to give birth. The big and friendly giants came close to our boat and played for a while. All of a sudden, they jumped up high and made huge splashes. Watching whales never gets boring.", "July 17th", "Today, I flew a drone to tag humpback whales. I followed them closely and dropped tags carefully onto their backs. We get a lot of information about them from the tags. I am particularly interested in their songs, and the tags have recorded them for several years. Their songs last up to 30 minutes and can travel thousands of kilometers underwater! The songs are beautiful, but we still don't know much about them.", "August 2nd", "I was filming some humpback whales underwater. Suddenly, one whale came close and pushed me hard. I tried to swim away, but it kept pushing me out of the water. I was so surprised. Then somebody shouted from the boat, \"A tiger shark is coming!\" I safely got on the boat. I realized that the whale was trying to save me. Humpback whales sometimes help other sea animals, but I never expected them to save my life."];var PASS_KO=["나는 혹등고래를 사랑해", "안녕하세요! 저는 뉴질랜드에서 온 Nikau입니다. 저는 쿡 제도에 있는 고래 연구소에서 일하고 있어요. 저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요. 저는 제 일과 생각들을 기록하기 위해서 그들에 대한 일기를 써 오고 있습니다.", "7월 1일", "마침내, 혹등고래들이 돌아왔다! 그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다. 그 크고 친근한 거대한 동물들이 우리의 보트에 가까이 왔고 잠시 동안 놀았다. 갑자기, 그들이 높이 뛰어올라 거대한 물보라를 만들었다. 고래들을 보는 것은 절대로 지루해지지 않는다.", "7월 17일", "오늘, 나는 혹등고래에 태그를 달기 위해 드론을 날렸다. 나는 그들을 가까이 따라갔고 그들의 등에 태그를 조심스럽게 떨어뜨렸다. 우리는 그 태그로부터 그들에 대한 많은 정보를 얻는다. 나는 특히 그들의 노래에 관심을 가지고 있고, 그 태그들은 그것들을 몇 년 동안 녹음해 오고 있다. 그들의 노래는 30분까지 지속되며, 물속에서 수천 킬로미터를 이동할 수 있다! 그 노래들은 아름답지만, 우리는 여전히 그것들에 대해 많이 알지 못한다.", "8월 2일", "나는 물속에서 몇몇 혹등고래를 찍고 있었다. 갑자기, 고래 한 마리가 가까이 와서 나를 세게 밀었다. 나는 헤엄쳐 가려고 노력했지만, 그것은 계속해서 나를 물 밖으로 밀어냈다. 나는 정말 놀랐다. 그때 누군가 배에서 소리쳤다. \"뱀상어가 오고 있다!\" 나는 안전하게 배 위에 탔다. 나는 그 고래가 나를 구하려고 애썼다는 것을 깨달았다. 혹등고래는 때때로 다른 동물들을 돕지만, 나는 그들이 내 생명을 살리리라고 전혀 예상하지 못했다."];
