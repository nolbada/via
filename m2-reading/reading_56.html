<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 56</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}
.sec{margin:26px 0 8px;font-weight:700;color:var(--pri);font-size:15px;border-left:4px solid var(--pri);padding-left:8px}

.row{display:flex;gap:10px;align-items:flex-start}.n{min-width:24px;color:var(--mut);font-size:13px;padding-top:3px}

.wd.hit{background:var(--okbg);box-shadow:inset 0 -2px 0 var(--ok)}.wd.miss{background:var(--badbg);box-shadow:inset 0 -2px 0 var(--bad)}.wd.x{text-decoration:line-through;color:var(--mut)}
.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}
.note{margin:10px 0 0 34px;padding:10px 12px;border-radius:8px;font-size:14.5px}
.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}
button{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"When did you last try something new? I have always wanted to learning skateboarding.","ko":"너는 언제 마지막으로 새로운 것을 시도했니? 나는 항상 스케이트보드 타기를 배우고 싶어 했어.","ok":false,"foot":[],"fixes":[{"wrong":"learning","right":"learn","partial":false,"at":[12],"point":"to부정사: want 뒤에는 to + 동사원형 learn 사용","topic":"to부정사","memo":"want 뒤에는 to + 동사원형 learn 사용"}]},{"n":2,"tag":null,"en":"Today, I took the first step toward becoming a cool skater boy. I joined a one-day skateboarding class.","ko":"오늘, 나는 멋진 스케이터 소년 되기를 향하여 첫걸음을 내디뎠어. 일일 스케이트보드 타기 수업에 참여했거든.","ok":true,"foot":[],"fixes":[]},{"n":3,"tag":null,"en":"When I got to the skatepark, I saw an guy skateboarding in a big bowl. He was Eric, me skateboarding teacher.","ko":"스케이트파크에 도착했을 때, 나는 한 남자가 큰 볼(깊고 둥근 형태의 구조물)에서 스케이트보드를 타고 있는 것을 보았어. 그는 나의 스케이트보드 타기 선생님인 Eric이었어.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[8],"point":"관사 a/an: 자음 소리로 시작하는 guy 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리로 시작하는 guy 앞에는 a 사용"},{"wrong":"me","right":"my","partial":false,"at":[18],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 my 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 my 사용"}]},{"n":4,"tag":null,"en":"He jumped into the air and flip the board. He landed clean.","ko":"그는 공중으로 뛰어올라 보드를 휙 뒤집었어. 그는 깔끔하게 착지했지.","ok":false,"foot":[],"fixes":[{"wrong":"flip","right":"flipped","partial":false,"at":[6],"point":"시제의 일치: jumped와 같은 과거형 flipped 사용","topic":"시제의 일치","memo":"jumped와 같은 과거형 flipped 사용"},{"wrong":"clean","right":"cleanly","partial":false,"at":[11],"point":"형용사와 부사: 동사 landed를 꾸미는 부사 cleanly 사용","topic":"형용사와 부사","memo":"동사 landed를 꾸미는 부사 cleanly 사용"}]},{"n":5,"tag":null,"en":"He reminded me of a surfer on a big wave. I learned from a blog that skateboarding began with surfers at California.","ko":"그는 큰 파도를 타는 서퍼를 떠올리게 했어. 나는 한 블로그에서 스케이트보드 타기가 캘리포니아의 서퍼들로부터 시작되었다는 것을 알게 되었어.","ok":false,"foot":[],"fixes":[{"wrong":"at","right":"in","partial":false,"at":[20],"point":"기본전치사: 주(州) 이름 앞에는 전치사 in 사용","topic":"기본전치사","memo":"주(州) 이름 앞에는 전치사 in 사용"}]},{"n":6,"tag":null,"en":"They wanted to surf on land, too, so they put wheels on wooden boards.","ko":"그들은 땅에서도 서핑을 하고 싶어서 나무판자에 바퀴를 달았어.","ok":true,"foot":[],"fixes":[]},{"n":7,"tag":null,"en":"When there was few rain in California, skateboarders used empty swimming pools as them skateparks.","ko":"캘리포니아에 비가 거의 오지 않았을 때, 스케이트보드 타는 사람들은 빈 수영장을 그들의 스케이트파크로 이용했어.","ok":false,"foot":[],"fixes":[{"wrong":"few","right":"little","partial":false,"at":[3],"point":"수량 형용사 few/little: 셀 수 없는 rain에는 little 사용","topic":"수량 형용사 few/little","memo":"셀 수 없는 rain에는 little 사용"},{"wrong":"them","right":"their","partial":false,"at":[13],"point":"인칭대명사의 소유격: 명사 skateparks 앞에는 소유격 their 사용","topic":"인칭대명사의 소유격","memo":"명사 skateparks 앞에는 소유격 their 사용"}]},{"n":8,"tag":null,"en":"Before the lesson, Eric and I did a warm-up exercise. Eric told me, \"Safe is the most important thing, Ian!\"","ko":"수업 전에, Eric과 나는 준비 운동을 했어. Eric은 나에게 \"안전이 가장 중요한 거야, Ian!\"이라고 말했어.","ok":false,"foot":[],"fixes":[{"wrong":"Safe","right":"Safety","partial":false,"at":[13],"point":"명사와 형용사: 주어 자리에는 명사 Safety 사용","topic":"명사와 형용사","memo":"주어 자리에는 명사 Safety 사용"}]},{"n":9,"tag":null,"en":"Then, he made me to wear a helmet and pads to stay safely during the class.","ko":"그런 다음 그는 수업 중에 안전하게 있기 위해 나에게 헬멧과 보호대를 착용하게 했어.","ok":false,"foot":[],"fixes":[{"wrong":"to wear","right":"wear","partial":false,"at":[4],"point":"사역동사 make: make + 목적어 뒤에는 동사원형 wear 사용","topic":"사역동사 make","memo":"make + 목적어 뒤에는 동사원형 wear 사용"},{"wrong":"safely","right":"safe","partial":false,"at":[12],"point":"형용사와 부사: stay 뒤 보어 자리에는 형용사 safe 사용","topic":"형용사와 부사","memo":"stay 뒤 보어 자리에는 형용사 safe 사용"}]},{"n":10,"tag":null,"en":"The lesson finally began. Eric taught me the basicest skill, the \"push-off.\"","ko":"수업이 마침내 시작되었어. Eric은 나에게 가장 기초적인 기술인 '푸시 오프'를 가르쳐 주었어.","ok":false,"foot":[],"fixes":[{"wrong":"basicest","right":"most basic","partial":false,"at":[8],"point":"최상급: 긴 형용사 basic은 the most basic 사용","topic":"최상급","memo":"긴 형용사 basic은 the most basic 사용"}]},{"n":11,"tag":null,"en":"To push off on the skateboard, I put one feet on the board and push against the ground with the other foot. Tada!","ko":"스케이트보드 위에서 푸시 오프를 하기 위해서, 나는 한 발을 보드에 올리고 다른 발로 땅을 밀었어. 짜잔!","ok":false,"foot":[],"fixes":[{"wrong":"feet","right":"foot","partial":false,"at":[9],"point":"불규칙 복수형: one 뒤에는 단수 foot 사용","topic":"불규칙 복수형","memo":"one 뒤에는 단수 foot 사용"},{"wrong":"push","right":"pushed","partial":false,"at":[14],"point":"시제의 일치: 앞의 put과 같은 과거형 pushed 사용","topic":"시제의 일치","memo":"앞의 put과 같은 과거형 pushed 사용"}]},{"n":12,"tag":null,"en":"I moved forward! This skill looked simple, but I fell down much times.","ko":"나는 앞으로 나아갔어! 이 기술은 간단해 보였지만, 나는 여러 번 넘어졌어.","ok":false,"foot":[],"fixes":[{"wrong":"much","right":"many","partial":false,"at":[11],"point":"수량 형용사 many/much: 셀 수 있는 times 앞에는 many 사용","topic":"수량 형용사 many/much","memo":"셀 수 있는 times 앞에는 many 사용"}]},{"n":13,"tag":null,"en":"With practice, I was able to keeping my balance and ride. I heard Eric cheering of me.","ko":"연습을 통해 나는 균형을 잡고 탈 수 있었어. 나는 Eric이 나를 응원하는 소리를 들었어.","ok":false,"foot":[],"fixes":[{"wrong":"keeping","right":"keep","partial":false,"at":[6],"point":"to부정사: be able to 뒤는 동사원형: keep (keeping 아님)","topic":"to부정사","memo":"be able to 뒤는 동사원형: keep (keeping 아님)"},{"wrong":"of","right":"for","partial":false,"at":[15],"point":"기본전치사: \"~를 응원하다\"는 cheer for 사용","topic":"기본전치사","memo":"\"~를 응원하다\"는 cheer for 사용"}]},{"n":14,"tag":null,"en":"After the lesson, I realized skateboarding are more than just a cool-looking sport. It makes me feel freely.","ko":"수업 후에, 나는 스케이트보드 타기가 단지 멋져 보이는 스포츠 그 이상이라는 것을 깨달았어. 그것은 나에게 자유를 느끼게 해 줘.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[6],"point":"be동사의 수일치: 주어 skateboarding(동명사, 단수)은 is (are 아님)","topic":"be동사의 수일치","memo":"주어 skateboarding(동명사, 단수)은 is (are 아님)"},{"wrong":"freely","right":"free","partial":false,"at":[17],"point":"형용사와 부사: feel 뒤 보어 자리에는 형용사 free t skatepark!","일단 가장 가까운 스케이트파크를 방문해 봐!",0]];var RNUM=56;var TITLE_EN="My First Skateboarding Lesson";var PASS_EN=["My First Skateboarding Lesson","When did you last try something new? I have always wanted to learn skateboarding. Today, I took the first step toward becoming a cool skater boy. I joined a one-day skateboarding class.","When I got to the skatepark, I saw a guy skateboarding in a big bowl. He was Eric, my skateboarding teacher. He jumped into the air and flipped the board. He landed cleanly. He reminded me of a surfer on a big wave. I learned from a blog that skateboarding began with surfers in California. They wanted to surf on land, too, so they put wheels on wooden boards. When there was little rain in California, skateboarders used empty swimming pools as their skateparks.","Before the lesson, Eric and I did a warm-up exercise. Eric told me, \"Safety is the most important thing, Ian!\" Then, he made me wear a helmet and pads to stay safe during the class.","The lesson finally began. Eric taught me the most basic skill, the \"push-off.\" To push off on the skateboard, I put one foot on the board and pushed against the ground with the other foot. Tada! I moved forward! This skill looked simple, but I fell down many times. With practice, I was able to keep my balance and ride. I heard Eric cheering for me.","After the lesson, I realized skateboarding is more than just a cool-looking sport. It makes me feel free. I am glad that I started my skateboarding journey today. My shoes and jeans got dirty, but I felt great. It shows I practiced really hard. I hope to skate better and more freely someday. Do you want to try skateboarding, too? Just visit the nearest skatepark!"];var PASS_KO=["나의 첫 스케이트보드 타기 수업","너는 언제 마지막으로 새로운 것을 시도했니? 나는 항상 스케이트보드 타기를 배우고 싶어 했어. 오늘, 나는 멋진 스케이터 소년 되기를 향하여 첫걸음을 내디뎠어. 일일 스케이트보드 타기 수업에 참여했거든.","스케이트파크에 도착했을 때, 나는 한 남자가 큰 볼(깊고 둥근 형태의 구조물)에서 스케이트보드를 타고 있는 것을 보았어. 그는 나의 스케이트보드 타기 선생님인 Eric이었어. 그는 공중으로 뛰어올라 보드를 휙 뒤집었어. 그는 깔끔하게 착지했지. 그는 큰 파도를 타는 서퍼를 떠올리게 했어. 나는 한 블로그에서 스케이트보드 타기가 캘리포니아의 서퍼들로부터 시작되었다는 것을 알게 되었어. 그들은 땅에서도 서핑을 하고 싶어서 나무판자에 바퀴를 달았어. 캘리포니아에 비가 거의 오지 않았을 때, 스케이트보드 타는 사람들은 빈 수영장을 그들의 스케이트파크로 이용했어.","수업 전에, Eric과 나는 준비 운동을 했어. Eric은 나에게 \"안전이 가장 중요한 거야, Ian!\"이라고 말했어. 그런 다음 그는 수업 중에 안전하게 있기 위해 나에게 헬멧과 보호대를 착용하게 했어.","수업이 마침내 시작되었어. Eric은 나에게 가장 기초적인 기술인 '푸시 오프'를 가르쳐 주었어. 스케이트보드 위에서 푸시 오프를 하기 위해서, 나는 한 발을 보드에 올리고 다른 발로 땅을 밀었어. 짜잔! 나는 앞으로 나아갔어! 이 기술은 간단해 보였지만, 나는 여러 번 넘어졌어. 연습을 통해 나는 균형을 잡고 탈 수 있었어. 나는 Eric이 나를 응원하는 소리를 들었어.","수업 후에, 나는 스케이트보드 타기가 단지 멋져 보이는 스포츠 그 이상이라는 것을 깨달았어. 그것은 나에게 자유를 느끼게 해 줘. 내가 오늘 스케이트보드 타기 여정을 시작해서 기뻐. 내 신발과 청바지는 더러워졌지만, 나는 기분이 아주 좋았어. 그것은 내가 정말 열심히 연습했다는 것을 보여 주는 것이니까. 나는 언젠가는 더 잘, 그리고 더 자유롭게 스케이트보드를 탈 수 있으면 좋겠어. 너도 스케이트보드 타기를 해 보고 싶니? 일단 가장 가까운 스케이트파크를 방문해 봐!"];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["my favorite sport","tips for swimming well","how to make your own website","various classes at the sports center","how to sign up for classes at the sports center"],"a":4,"ans":"how to sign up for classes at the sports center","evs":[["B: Swimming. Do you know how to sign up for a class here?","수영이야. 여기서 수업을 신청하는 방법을 아니?"],["G: Yes, it's easy. First, log in to the website.","응, 쉬워. 먼저 웹사이트에 로그인해."]],"ev":["B: Swimming. Do you know how to sign up for a class here?","수영이야. 여기서 수업을 신청하는 방법을 아니?"],"ow":["오답 ✕ — 지민이는 수영 수업을 신청하려는 것이고 자신이 좋아하는 운동을 말하는 대화가 아님. 'Do you know how to sign up for a class here?'(여기서 수업을 신청하는 방법을 아니?)가 핵심임.","오답 ✕ — 수영을 잘하는 방법을 알려 주는 대화가 아니다. 수영은 신청하려는 수업의 종류일 뿐임.","오답 ✕ — 웹사이트에 로그인하는 단계가 나오지만, 웹사이트를 만드는 방법이 아니라 수업을 신청하는 방법을 설명하는 것임.","오답 ✕ — 'There's one swimming class.'(수영 수업이 하나 있네.)에서 보듯 여러 수업을 소개하는 대화가 아니라 하나의 수업을 신청하는 과정임.","정답 ○ — 지민이가 'how to sign up for a class'(수업을 신청하는 방법)를 묻고, 소녀가 로그인, 수업 찾기, 'click on the sign-up button'(신청 버튼 누르기) 순서로 알려 주므로 주제는 스포츠 센터 수업 신청 방법임."],"memo":["정답 ⑤: 주제는 how to sign up for classes at the sports center(스포츠 센터 수업 신청 방법)이다.","근거: Do you know how to sign up for a class here?(여기서 수업을 신청하는 방법을 아니?) 다고 한 것은 speed(속도)가 아니라 'Safety'(안전)임.","오답 ✕ — (A)의 safety는 맞지만, 첫 기술은 'the most basic skill, the \"push-off\"'(가장 기초적인 기술 푸시 오프)이고 flip(뒤집기)은 Eric이 보여 준 묘기('flipped the board')일 뿐임.","오답 ✕ — (B)의 push-off는 맞지만 가장 중요하다고 한 것은 balance(균형)가 아님. 균형은 'keep my balance'(균형을 잡다)로 연습 후에 나오는 말임.","오답 ✕ — 'Safety is the most important thing'이므로 fun(재미)은 틀리고, 첫 기술도 landing(착지)이 아니라 push-off임."],"memo":["정답 ①: 가장 중요한 것은 safety(안전), 첫 기술은 push-off(푸시 오프)이다.","근거: Safety is the most important thing, Ian!(안전이 가장 중요한 거야, Ian!)","함정: flip과 landing은 Eric이 보여 준 묘기이지 글쓴이가 처음 배운 기술이 아니다."],"why":"Eric은 안전이 가장 중요하다고 했고, 글쓴이는 가장 기초인 푸시 오프를 먼저 배웠다.","sum":"Eric told Ian that (A) is the most important thing, and the first skill Ian learned was the (B).","lab":"완성된 요약문 : "},{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["Ian은 한 번도 넘어지지 않았다.","Ian은 두 발을 모두 땅에 대고 밀었다.","Ian은 헬멧 없이 수업을 들었다.","수업은 준비 운동 없이 시작되었다.","Ian은 연습을 통해 균형을 잡고 탈 수 있었다."],"a":4,"ans":"Ian은 연습을 통해 균형을 잡고 탈 수 있었다.","evs":[["This skill looked simple, but I fell down many times.","이 기술은 간단해 보였지만, 나는 여러 번 넘어졌어."],["With practice, I was able to keep my balance and ride.","연습을 통해 나는 균형을 잡고 탈 수 있었어."],["To push off on the skateboard, I put one foot on the board and pushed against the ground with the other foot.","스케이트보드 위에서 푸시 오프를 하기 위해서, 나는 한 발을 보드에 올리고 다른 발로 땅을 밀었어."]],"ev":["This skill looked simple, but I fell down many times.","이 기술은 간단해 보였지만, 나는 여러 번 넘어졌어."],"ow":["오답 ✕ — 'I fell down many times.'(나는 여러 번 넘어졌어.)라고 했으므로 한 번도 넘어지지 않았다는 보기는 틀림.","오답 ✕ — 'I put one foot on the board and pushed against the ground with the other foot.'(한 발을 보드에 올리고 다른 발로 땅을 밀었어.)라고 했으므로 두 발을 땅에 댄 것이 아님.","오답 ✕ — 'he made me wear a helmet and pads'(그는 나에게 헬멧과 보호대를 착용하게 했어)라고 했으므로 헬멧 없이 수업을 들은 것이 아님.","오답 ✕ — 'Before the lesson, Eric and I did a warm-up exercise.'(수업 전에 Eric과 나는 준비 운동을 했어.)라고 했으므로 준비 운동을 했음.","정답 ○ — 'With practice, I was able to keep my balance and ride.'(연습을 통해 나는 균형을 잡고 탈 수 있었어.)라고 했으므로 맞음."],"memo":["정답 ⑤: Ian은 연습을 통해 균형을 잡고 탈 수 있었다.","근거: With practice, I was able to keep my balance and ride.(연습을 통해 균형을 잡고 탈 수 있었어.)","함정: 처음에는 여러 번 넘어졌고(fell down many times), 연습 후에야 균형을 잡았다."],"why":"처음엔 넘어졌지만 연습을 통해 균형을 잡고 탈 수 있게 되었다."}],"pp":[["Before the lesson, Eric and I did a warm-up exercise.","수업 전에, Eric과 나는 준비 운동을 했어."],["Eric told me, \"Safety is the most important thing, Ian!\"","Eric은 나에게 \"안전이 가장 중요한 거야, Ian!\"이라고 말했어."],["Then, he made me wear a helmet and pads to stay safe during the class.","그런 다음 그는 수업 중에 안전하게 있기 위해 나에게 헬멧과 보호대를 착용하게 했어."],["The lesson finally began.","수업이 마침내 시작되었어."],["Eric taught me the most basic skill, the \"push-off.\"","Eric은 나에게 가장 기초적인 기술인 '푸시 오프'를 가르쳐 주었어."],["To push off on the skateboard, I put one foot on the board and pushed against the ground with the other foot.","스케이트보드 위에서 푸시 오프를 하기 위해서, 나는 한 발을 보드에 올리고 다른 발로 땅을 밀었어."],["Tada!","짜잔!"],["I moved forward!","나는 앞으로 나아갔어!"],["This skill looked simple, but I fell down many times.","이 기술은 간단해 보였지만, 나는 여러 번 넘어졌어."],["With practice, I was able to keep my balance and ride.","연습을 통해 나는 균형을 잡고 탈 수 있었어."],["I heard Eric cheering for me.","나는 Eric이 나를 응원하는 소리를 들었어."]]},{"qs":[{"n":10,"q":"윗글의 주제로 알맞은 것은?","o":["rules for skateboarding","choosing good skateparks","benefits of riding a skateboard","feelings after a skateboarding lesson","tips for learning to skateboard quickly"],"a":3,"ans":"feelings after a skateboarding lesson","evs":[["After the lesson, I realized skateboarding is more than just a cool-looking sport.","수업 후에, 나는 스케이트보드 타기가 단지 멋져 보이는 스포츠 그 이상이라는 것을 깨달았어."],["It makes me feel free.","그것은 나에게 자유를 느끼게 해 줘."],["My shoes and jeans got dirty, but I felt great.","내 신발과 청바지는 더러워졌지만, 나는 기분이 아주 좋았어."]],"ev":["After the lesson, I realized skateboarding is more than just a cool-looking sport.","수업 후에, 나는 스케이트보드 타기가 단지 멋져 보이는 스포츠 그 이상이라는 것을 깨달았어."],"ow":["오답 ✕ — 스케이트보드의 규칙에 대한 언급이 없다. 글쓴이는 수업 후의 느낌을 말함('It makes me feel free.', 그것은 나에게 자유를 느끼게 해 줘).","오답 ✕ — 'Just visit the nearest skatepark!'(일단 가장 가까운 스케이트파크를 방문해 봐!)가 있지만
