<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>

<script>
var P=[{"u":1,"id":"hk1-01-1","no":1,"ko":"민트와 초코는 환상의 짝꿍","items":[{"n":1,"t":"tf","q":"Marilyn studied music at South Devon College.","ko":"Marilyn은 South Devon 대학에서 음악을 공부했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"She was studying cooking at South Devon College.","그녀는 South Devon 대학에서 요리를 공부하고 있었다."]],"w":"5번 문장에서 Marilyn은 South Devon 대학에서 요리(cooking)를 공부하고 있었다고 해요. 음악이 아니에요.","c":"F"},"h":"6f6bde42c2"},{"n":2,"t":"tf","q":"The royal family held a competition to find the best dessert.","ko":"영국 왕실은 최고의 디저트를 찾기 위해 대회를 열었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The family wanted to provide the best dessert for the celebration, so they held a competition.","왕실은 축하 행사를 위한 최고의 디저트를 제공하기를 원해서, 대회를 열었다."]],"w":"3번 문장에서 왕실은 축하 행사를 위한 최고의 디저트를 원해서 대회를 열었어요.","c":"T"},"h":"9433a423c9"},{"n":3,"t":"tf","q":"Mint Royale lost the contest, but it became popular later.","ko":"Mint Royale은 대회에서 졌지만, 나중에 인기를 얻었다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Marilyn eventually won the contest with Mint Royale, and it became the main dessert for the wedding.","Marilyn은 마침내 Mint Royale로 대회에서 우승했고, 그것은 결혼식의 주요 디저트가 되었다."]],"w":"9번 문장에서 Marilyn은 Mint Royale로 대회에서 우승했고, 그것은 결혼식의 주요 디저트가 되었어요. 졌다는 말은 반대예요.","c":"F"},"h":"b292154a1e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The family wanted to provide the best dessert ...)","ko":"왕실은 최고의 디저트를 제공하기를 원했다.","opts":["숨기다","제공하다","거절하다","주문하다"],"word":"provide","r":{"a":"2) 제공하다","ev":"3번 문장","s":[[3,"The family wanted to provide the best dessert for the celebration, so they held a competition.","왕실은 축하 행사를 위한 최고의 디저트를 제공하기를 원해서, 대회를 열었다."]],"w":"왕실은 축하 행사에 쓸 최고의 디저트를 마련하고 싶어 했어요. provide는 '제공하다'예요.","c":2},"h":"d71ea45231"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Marilyn eventually won the contest ...)","ko":"Marilyn은 마침내 대회에서 우승했다.","opts":["갑자기","가끔","거의","마침내"],"word":"eventually","r":{"a":"4) 마침내","ev":"9번 문장","s":[[9,"Marilyn eventually won the contest with Mint Royale, and it became the main dessert for the wedding.","Marilyn은 마침내 Mint Royale로 대회에서 우승했고, 그것은 결혼식의 주요 디저트가 되었다."]],"w":"새로운 디저트를 고민하던 Marilyn이 결국 대회에서 우승했다는 흐름이에요. eventually는 '마침내, 결국'이에요.","c":4},"h":"d05cd28d6e"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nSo she created an ice cream called Mint Royale.","ko":"밑줄 친 she이(가) 가리키는 것은?","sko":"그래서 그녀는 Mint Royale이라고 불리는 아이스크림을 만들어 냈다.","opts":["Marilyn Ricketts","Anne 공주","왕실 가족","대학 선생님"],"r":{"a":"1) Marilyn Ricketts","ev":"6~7번 문장","s":[[6,"Marilyn tried to think of something new for the dessert.","Marilyn은 디저트에 대해 무언가 새로운 것을 떠올리기 위해 노력했다."],[7,"So she created an ice cream called Mint Royale.","그래서 그녀는 Mint Royale이라고 불리는 아이스크림을 만들어 냈다."]],"w":"Marilyn이 디저트에 대해 무언가 새로운 것을 떠올리려고 노력했고(6번), 그래서 그녀(she)가 Mint Royale 아이스크림을 만들어 냈어요(7번). she는 Marilyn Ricketts예요.","c":1,"k":"she = Marilyn Ricketts"},"pron":"she","h":"3a0bbadd9e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now, mint chocolate is one of the most popular flavors.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오늘날, 민트 초콜릿은 가장 인기 있는 맛 중 하나이다.","opts":["민트 초콜릿은 한 가지 맛만 있는 아이스크림이다.","민트 초콜릿은 요즘 거의 팔리지 않는 맛이다.","민트 초콜릿은 가장 인기 있는 맛들 중 하나이다.","민트 초콜릿은 가장 인기 있는 단 하나의 맛이다."],"r":{"a":"3) 민트 초콜릿은 가장 인기 있는 맛들 중 하나이다.","ev":"10번 문장","s":[[10,"Now, mint chocolate is one of the most popular flavors.","오늘날, 민트 초콜릿은 가장 인기 있는 맛 중 하나이다."]],"w":"one of the most popular flavors는 '가장 인기 있는 맛들 중 하나'예요. 4번처럼 '단 하나'라는 뜻이 아니에요.","c":3},"h":"e26b29dfe5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Anne 공주의 결혼식은 1983년에 열렸다.","1973년 왕실의 중요한 행사는 Anne 공주의 결혼식이었다.","Marilyn Ricketts는 South Devon 대학의 유명한 요리사였다.","왕실은 1973년에 중요한 행사가 없었다."],"opts":["Princess Anne's wedding was held in 1983.","The important event of the royal family in 1973 was Princess Anne's wedding.","Marilyn Ricketts was a famous cook at South Devon College.","The royal family had no important event in 1973."],"r":{"a":"2) The important event of the royal family in 1973 was Princess Anne's wedding. (1973년 왕실의 중요한 행사는 Anne 공주의 결혼식이었다.)","ev":"1~2번 문장","s":[[1,"The royal family of England had an important event in 1973.","영국 왕실은 1973년에 중요한 행사를 가졌다."],[2,"It was Princess Anne’s wedding.","그것은 Anne 공주의 결혼식이었다."]],"w":"1번 문장에서 영국 왕실이 1973년에 중요한 행사를 가졌다고 했고, 2번 문장에서 그것이 Anne 공주의 결혼식이었다고 했어요.","c":2},"h":"2fe57f15b2"},{"n":9,"t":"sum","q":"Marilyn Ricketts, a young (A), joined the contest held by the royal family. She tried to think of something (B) for the dessert.","ko":"젊은 (A)인 Marilyn Ricketts는 왕실이 연 대회에 참가했다. 그녀는 디저트에 대해 (B) 것을 떠올리려고 노력했다.","oko":["(A) 선생님 / (B) 새로운","(A) 학생 / (B) 오래된","(A) 공주 / (B) 새로운","(A) 선생님 / (B) 뜨거운","(A) 학생 / (B) 새로운"],"opts":["(A) teacher / (B) new","(A) student / (B) old","(A) princess / (B) new","(A) teacher / (B) hot","(A) student / (B) new"],"r":{"a":"5) (A) student / (B) new ((A) 학생 / (B) 새로운)","ev":"4번, 6번 문장","s":[[4,"In this contest, a young student named Marilyn Ricketts participated.","이 대회에는, Marilyn Ricketts라는 한 젊은 학생이 참가했다."],[6,"Marilyn tried to think of something new for the dessert.","Marilyn은 디저트에 대해 무언가 새로운 것을 떠올리기 위해 노력했다."]],"w":"4번 문장에서 대회에 참가한 사람은 젊은 학생(student)이었고, 6번 문장에서 디저트에 대해 새로운(new) 것을 떠올리려고 했어요.","c":5},"h":"5ea25a4cf6"},{"n":10,"t":"fill","q":"It was the [A] ice cream with a [B] of mint and chocolate.","ko":"그것은 민트와 초콜릿의 [B](으)로 된 [A] 아이스크림이었다.","bank":["first","mix","think","participated","called","became"],"bko":{"first":"최초의","mix":"혼합(물)","think":"생각하다","participated":"참가했다(participate의 과거)","called":"불렸다(call의 과거분사)","became":"되었다(become의 과거)"},"r":{"a":"[A] first (최초의), [B] mix (혼합(물))","ev":"8번 문장","s":[[8,"It was the first ice cream with a mix of mint and chocolate.","그것은 민트와 초콜릿의 혼합물로 된 최초의 아이스크림이었다."]],"w":"8번 문장에서 민트와 초콜릿의 혼합물(a mix of mint and chocolate)로 된 최초의(first) 아이스크림이라고 했어요. 나머지 단어는 [A] 형용사 자리와 [B] 명사 자리에 맞지 않아요.","c":null},"h":"1da4913c8e"}]},{"u":1,"id":"hk1-01-2","no":2,"ko":"마음을 어루만지는 손짓","items":[{"n":1,"t":"tf","q":"You can put your hands on each shoulder if you want.","ko":"원한다면 손을 각 어깨에 둘 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"You can also place them on each shoulder if you want.","당신이 원한다면 손을 각 어깨에 둘 수도 있다."]],"w":"6번 문장에서 You can also place them on each shoulder if you want라고 해요. 흉부 말고 어깨에 둘 수도 있어요.","c":"T"},"h":"8a49a71bcf"},{"n":2,"t":"tf","q":"You should hold your breath while you do the Butterfly Hug.","ko":"버터플라이 허그를 하는 동안 숨을 참아야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"While you are doing this, take some deep breaths.","이것을 하고 있는 동안, 심호흡을 해라."]],"w":"9번 문장에서 동작을 하는 동안 심호흡(take some deep breaths)을 하라고 해요. 숨을 참는 것과 반대예요.","c":"F"},"h":"4280f32d9a"},{"n":3,"t":"tf","q":"The Butterfly Hug can help with your anxiety.","ko":"버터플라이 허그는 당신의 불안감에 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It is an easy and effective technique which can help with your anxiety.","그것은 당신의 불안감에 도움이 될 수 있는 쉽고 효과적인 기법이다."]],"w":"2번 문장에서 쉽고 효과적인 기법이며 불안감에 도움이 될 수 있다고 해요.","c":"T"},"h":"280c7e467f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then, gently tap the left side and then the right.)","ko":"그 다음, 왼편과 오른편을 부드럽게 두드려라.","opts":["세게","빠르게","부드럽게","크게"],"word":"gently","r":{"a":"3) 부드럽게","ev":"7번 문장","s":[[7,"Then, gently tap the left side and then the right.","그 다음, (흉부나 어깨의) 왼편과 오른편을 부드럽게 두드려라."]],"w":"마음을 달래는 동작이니 세게 치지 않아요. gently는 '부드럽게'예요.","c":3},"h":"11bc76b6cb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You can stop and relax when you start to feel some relief.)","ko":"안도감을 느끼기 시작할 때 멈추고 휴식을 취하면 된다.","opts":["걱정","안도감","피곤함","화남"],"word":"relief","r":{"a":"2) 안도감","ev":"10번 문장","s":[[10,"You can stop and relax when you start to feel some relief.","당신이 안도감을 느끼기 시작할 때 멈추고 휴식을 취하면 된다."]],"w":"허그의 목적은 불안을 줄이는 것이에요. 그래서 편안해지는 느낌, 즉 relief는 '안도감'이에요.","c":2},"h":"ff1218858d"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nFirst, cross your hands and place them on your chest.","ko":"밑줄 친 them이(가) 가리키는 것은?","sko":"먼저, 당신의 손을 교차시켜서 흉부에 두어라.","opts":["당신의 손","어깨","나비의 날개","가슴"],"r":{"a":"1) 당신의 손","ev":"5번 문장","s":[[5,"First, cross your hands and place them on your chest.","먼저, 당신의 손을 교차시켜서 흉부에 두어라."]],"w":"5번 문장에서 먼저 당신의 손(your hands)을 교차시켜 가슴에 두라고 했어요. 그 손을 가리키는 them이에요.","c":1,"k":"them = 당신의 손"},"pron":"them","h":"62422120e2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This simple self-hug will make your stress go away in just a few minutes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 간단한 셀프 허그는 단 몇 분 만에 당신의 스트레스가 사라지도록 만들 것이다.","opts":["이 간단한 셀프 허그는 단 몇 분 만에 스트레스를 사라지게 해 줄 것이다.","이 셀프 허그는 몇 시간을 해야 스트레스가 사라진다.","이 간단한 허그는 다른 사람과 함께 할 때만 스트레스를 없애 준다.","이 허그는 몇 분 동안 스트레스를 더 키울 것이다."],"r":{"a":"1) 이 간단한 셀프 허그는 단 몇 분 만에 스트레스를 사라지게 해 줄 것이다.","ev":"11번 문장","s":[[11,"This simple self-hug will make your stress go away in just a few minutes.","이 간단한 셀프 허그는 단 몇 분 만에 당신의 스트레스가 사라지도록 만들 것이다."]],"w":"make your stress go away는 스트레스가 사라지게 만든다는 뜻이고, in just a few minutes는 단 몇 분 안에라는 뜻이에요. self-hug는 혼자 하는 허그예요.","c":1},"h":"fe0592a080"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["버터플라이 허그는 나비와 함께 하는 게임에서 이름을 따왔다.","버터플라이 허그는 손을 움직이는 방식에서 이름을 얻었다.","버터플라이 허그를 하려면 진짜 나비를 써야 한다.","버터플라이 허그는 그것을 만든 사람의 이름을 따왔다."],"opts":["The Butterfly Hug is named after a game played with butterflies.","The Butterfly Hug got its name from the way you move your hands.","You must use a real butterfly to do the Butterfly Hug.","The Butterfly Hug is named after the person who made it."],"r":{"a":"2) The Butterfly Hug got its name from the way you move your hands. (버터플라이 허그는 손을 움직이는 방식에서 이름을 얻었다.)","ev":"3~4번 문장","s":[[3,"To do it, you move your hands like the wings of a butterfly.","그것을 하기 위해, 당신은 손을 나비의 날개처럼 움직인다."],[4,"This is why it is named the Butterfly Hug.","이것이 버터플라이 허그라고 이름이 지어진 이유이다."]],"w":"3번 문장에서 손을 나비의 날개처럼 움직인다고 했고, 4번 문장에서 이것이 버터플라이 허그라는 이름의 이유라고 했어요.","c":2},"h":"fb16ce97ec"},{"n":9,"t":"sum","q":"The Butterfly Hug is named so because you move your hands like the (A) of a butterfly. Then you (B) this movement.","ko":"버터플라이 허그는 손을 나비의 (A)처럼 움직이기 때문에 그렇게 이름 지어졌다. 그리고 이 동작을 (B).","oko":["(A) 다리 / (B) 반복한다","(A) 날개 / (B) 멈춘다","(A) 꼬리 / (B) 반복한다","(A) 다리 / (B) 멈춘다","(A) 날개 / (B) 반복한다"],"opts":["(A) legs / (B) repeat","(A) wings / (B) stop","(A) tail / (B) repeat","(A) legs / (B) stop","(A) wings / (B) repeat"],"r":{"a":"5) (A) wings / (B) repeat ((A) 날개 / (B) 반복한다)","ev":"3~4번, 8번 문장","s":[[3,"To do it, you move your hands like the wings of a butterfly.","그것을 하기 위해, 당신은 손을 나비의 날개처럼 움직인다."],[4,"This is why it is named the Butterfly Hug.","이것이 버터플라이 허그라고 이름이 지어진 이유이다."],[8,"Repeat this movement.","이 동작을 반복해라."]],"w":"3~4번 문장에서 손을 나비의 날개(wings)처럼 움직여서 이름이 지어졌다고 했고, 8번 문장에서 이 동작을 반복하라(Repeat)고 했어요.","c":5},"h":"0beaf828c4"},{"n":10,"t":"fill","q":"If you are feeling [A] or stressed, [B] the Butterfly Hug.","ko":"만약 당신이 [A] 또는 스트레스를 받는다고 느끼고 있다면, 버터플라이 허그를 [B].","bank":["upset","try","chest","minutes","side","hands"],"bko":{"upset":"속상한","try":"시도하다","chest":"가슴","minutes":"분(minute의 복수형)","side":"쪽, 편","hands":"손(hand의 복수형)"},"r":{"a":"[A] upset (속상한), [B] try (시도하다)","ev":"1번 문장","s":[[1,"If you are feeling upset or stressed, try the Butterfly Hug.","만약 당신이 속상하거나 스트레스를 받는다고 느끼고 있다면, 버터플라이 허그를 시도해 봐라."]],"w":"1번 문장에서 속상하거나(upset) 스트레스를 받는다면 버터플라이 허그를 시도해(try) 보라고 했어요. 나머지는 형용사 자리와 동사 자리에 맞지 않아요.","c":null},"h":"01f5fb7b6c"}]},{"u":1,"id":"hk1-01-3","no":3,"ko":"숨겨왔던 나의...","items":[{"n":1,"t":"tf","q":"A penguin's legs are about half of its body length.","ko":"펭귄의 다리는 몸길이의 약 절반이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In fact, their legs are about half of their body length!","사실, 그것들의 다리는 몸길이의 약 절반이다!"]],"w":"5번 문장에서 their legs are about half of their body length라고 해요. 겉으로 짧아 보여도 실제로는 길어요.","c":"T"},"h":"f42bf3b2b4"},{"n":2,"t":"tf","q":"Penguins' leg bones are straight, so their legs look short.","ko":"펭귄의 다리뼈는 곧게 뻗어 있어서 다리가 짧아 보인다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Their legs look short because the leg bones are folded at a 90-degree angle.","그것들의 다리는 다리뼈가 90도로 접혀 있기 때문에 짧아 보인다."]],"w":"6번 문장에서 다리뼈가 90도로 접혀 있기(folded) 때문에 짧아 보인다고 해요. 곧게 뻗은 것이 아니에요.","c":"F"},"h":"605e91b168"},{"n":3,"t":"tf","q":"Walking with bent legs helps penguins keep their balance on ice.","ko":"구부러진 다리로 걷는 것은 펭귄이 얼음 위에서 균형을 유지하는 데 도움이 된다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"When penguins walk with their bent legs, they can move only a little with each step.","펭귄은 구부러진 다리로 걸을 때, 걸음마다 조금씩만 움직일 수 있다."],[10,"But on the ice, this is actually helpful for maintaining balance.","하지만 얼음 위에서, 이것은 사실 균형을 유지하는 데 도움이 된다."]],"w":"9번에서 구부러진 다리로 걸음마다 조금씩 움직인다고 했고, 10번에서 얼음 위에서는 이것이 균형을 유지하는 데 도움이 된다고 해요.","c":"T"},"h":"b593b8b34b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... because the leg bones are folded at a 90-degree angle.)","ko":"다리뼈가 90도로 접혀 있기 때문이다.","opts":["부러진","접힌","늘어난","자란"],"word":"folded","r":{"a":"2) 접힌","ev":"6번 문장","s":[[6,"Their legs look short because the leg bones are folded at a 90-degree angle.","그것들의 다리는 다리뼈가 90도로 접혀 있기 때문에 짧아 보인다."]],"w":"다리뼈가 90도로 꺾여 있어서 다리가 짧아 보인다는 흐름이에요. folded는 fold(접다)의 과거분사로 '접힌'이에요.","c":2},"h":"2b2108eabf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That's why penguins don't slip on ice easily.)","ko":"그것이 펭귄이 얼음 위에서 쉽게 미끄러지지 않는 이유이다.","opts":["점프하다","얼다","헤엄치다","미끄러지다"],"word":"slip","r":{"a":"4) 미끄러지다","ev":"11번 문장","s":[[11,"That’s why penguins don’t slip on ice easily.","그것이 펭귄이 얼음 위에서 쉽게 미끄러지지 않는 이유이다."]],"w":"얼음 위에서 균형을 유지하면 넘어지지 않아요. don't slip은 '미끄러지지 않는다'예요.","c":4},"h":"75999398aa"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nYou may think of it walking around on its short legs.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"당신은 짧은 다리로 걸어 다니는 그것을 떠올릴지도 모른다.","opts":["펭귄","당신","다리","얼음"],"r":{"a":"1) 펭귄","ev":"1번, 3번 문장","s":[[1,"Think about a penguin.","펭귄에 대해서 생각해 보아라."],[3,"You may think of it walking around on its short legs.","당신은 짧은 다리로 걸어 다니는 그것을 떠올릴지도 모른다."]],"w":"1번 문장에서 펭귄(a penguin)에 대해 생각해 보라고 했고, 3번 문장의 it은 짧은 다리로 걸어 다니는 펭귄을 가리켜요.","c":1,"k":"it = 펭귄"},"pron":"it","h":"0597237a91"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, penguins have quite long legs.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 펭귄은 꽤 긴 다리를 가지고 있다.","opts":["그러나 펭귄의 다리는 생각보다 꽤 길다.","그러나 펭귄은 다리가 아주 짧다.","그러나 펭귄은 다리가 없다.","그러나 펭귄은 긴 다리 덕분에 빨리 달린다."],"r":{"a":"1) 그러나 펭귄의 다리는 생각보다 꽤 길다.","ev":"4번 문장","s":[[4,"However, penguins have quite long legs.","하지만, 펭귄은 꽤 긴 다리를 가지고 있다."]],"w":"4번 문장은 펭귄이 꽤 긴(quite long) 다리를 가지고 있다는 뜻이에요. 앞 문장의 짧은 다리라는 생각과 반대로 말하고 있어요.","c":1},"h":"52ed1f05ee"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["펭귄의 다리 길이는 몸길이의 10분의 1밖에 되지 않는다.","펭귄의 다리는 대부분 몸 안에 숨겨져 있다.","펭귄은 다리가 구부러져 있어서 얼음 위에서 걸을 수 없다.","펭귄은 걸음마다 아주 멀리 움직일 수 있다."],"opts":["Penguins' legs are only one-tenth of their body length.","Most of a penguin's legs are hidden inside its body.","Penguins cannot walk on ice because their legs are bent.","Penguins can move very far with each step."],"r":{"a":"2) Most of a penguin's legs are hidden inside its body. (펭귄의 다리는 대부분 몸 안에 숨겨져 있다.)","ev":"7번 문장","s":[[7,"Their legs are mostly hidden within their bodies.","그것들의 다리는 주로 몸 안에 숨겨져 있다."]],"w":"7번 문장에서 펭귄의 다리는 대부분 몸 안에 숨겨져 있다고 했어요.","c":2},"h":"07610e35eb"},{"n":9,"t":"sum","q":"A penguin's legs look short because we can only (A) the (B) part of them.","ko":"펭귄의 다리는 우리가 그것들의 (B) 부분만 (A) 수 있어서 짧아 보인다.","oko":["(A) 볼 / (B) 윗","(A) 숨길 / (B) 아랫","(A) 볼 / (B) 아랫","(A) 덮을 / (B) 윗","(A) 숨길 / (B) 가운데"],"opts":["(A) see / (B) top","(A) hide / (B) bottom","(A) see / (B) bottom","(A) cover / (B) top","(A) hide / (B) middle"],"r":{"a":"3) (A) see / (B) bottom ((A) 볼 / (B) 아랫)","ev":"7~8번 문장","s":[[7,"Their legs are mostly hidden within their bodies.","그것들의 다리는 주로 몸 안에 숨겨져 있다."],[8,"Therefore, we can only see the bottom part of them.","따라서, 우리는 다리의 아랫부분만 볼 수 있다."]],"w":"7번 문장에서 다리가 대부분 몸 안에 숨겨져 있다고 했고, 8번 문장에서 그래서 다리의 아랫부분(bottom part)만 볼(see) 수 있다고 했어요.","c":3},"h":"49f3b67445"},{"n":10,"t":"fill","q":"Think about a penguin. What [A] to your [B] first?","ko":"펭귄에 대해서 생각해 보아라. 가장 먼저 무엇이 당신의 [B]에 [A]?","bank":["comes","mind","quite","long","walking","mostly"],"bko":{"comes":"떠오르다(come의 3인칭 단수형)","mind":"마음, 생각","quite":"꽤","long":"긴","walking":"걷는(walk의 -ing형)","mostly":"주로"},"r":{"a":"[A] comes (떠오르다(come의 3인칭 단수형)), [B] mind (마음, 생각)","ev":"1~2번 문장","s":[[1,"Think about a penguin.","펭귄에 대해서 생각해 보아라."],[2,"What comes to your mind first?","가장 먼저 무슨 생각이 떠오르는가?"]],"w":"2번 문장은 가장 먼저 무엇이 마음(mind)에 떠오르는지(comes) 묻고 있어요. What 뒤에는 동사가, to your 뒤에는 명사가 와요.","c":null},"h":"f0449556aa"}]},{"u":1,"id":"hk1-01-4","no":4,"ko":"베개 휘날리며~","items":[{"n":1,"t":"tf","q":"International Pillow Fight Day is held on the first Saturday of April.","ko":"국제 베개 싸움의 날은 4월의 첫째 주 토요일에 개최된다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"It takes place on the first Saturday of April.","그것은 4월의 첫째 주 토요일에 개최된다."]],"w":"5번 문장에서 It takes place on the first Saturday of April라고 해요. It은 4번의 International Pillow Fight Day예요.","c":"T"},"h":"a1d8541c28"},{"n":2,"t":"tf","q":"You have to pay money to join the event.","ko":"행사에 참가하려면 돈을 내야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Participating in this event is free, but you should bring your own pillow.","이 행사에 참가하는 것은 무료이나, 자신의 베개를 가져와야 한다."]],"w":"6번 문장에서 이 행사에 참가하는 것은 무료(free)라고 해요. 필요한 것은 돈이 아니라 자기 베개예요.","c":"F"},"h":"b368f46450"},{"n":3,"t":"tf","q":"You should not hit people who don't have a pillow.","ko":"베개를 갖고 있지 않은 사람들은 치면 안 된다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"But don’t hit people who don’t have a pillow.","하지만 베개를 갖고 있지 않은 사람들은 치지 말아라."]],"w":"9번 문장에서 But don't hit people who don't have a pillow라고 해요.","c":"T"},"h":"c4d7c98338"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... so that it won't harm others.)","ko":"그것이 다른 사람들을 해치지 않도록 ...","opts":["돕다","웃기다","해치다","가르치다"],"word":"harm","r":{"a":"3) 해치다","ev":"7번 문장","s":[[7,"And it should be filled with soft feathers or cotton so that it won’t harm others.","그리고 그것은 다른 사람들을 해치지 않도록 부드러운 깃털이나 솜으로 채워져 있어야 한다."]],"w":"부드러운 깃털이나 솜 베개를 쓰는 이유는 다른 사람이 다치지 않게 하려는 거예요. harm은 '해치다'예요.","c":3},"h":"dd24ec059a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Participating in this event is free, ...)","ko":"이 행사에 참가하는 것은 무료이나, ...","opts":["무료의","어려운","위험한","오래된"],"word":"free","r":{"a":"1) 무료의","ev":"6번 문장","s":[[6,"Participating in this event is free, but you should bring your own pillow.","이 행사에 참가하는 것은 무료이나, 자신의 베개를 가져와야 한다."]],"w":"뒤에 but you should bring your own pillow(하지만 자기 베개를 가져와야 한다)가 이어져요. 참가에 돈이 들지 않는다는 뜻이라서 free는 '무료의'예요.","c":1},"h":"68bf51acbf"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThere were many people around her, and they were holding their pillows, too.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"그녀의 주위에는 많은 사람들이 있었고, 그들 또한 그들의 베개를 들고 있었다.","opts":["Emily의 베개들","그녀의 주위에 있던 많은 사람들","Emily와 그녀의 친구들","거리의 자동차들"],"r":{"a":"2) 그녀의 주위에 있던 많은 사람들","ev":"2번 문장","s":[[2,"There were many people around her, and they were holding their pillows, too.","그녀의 주위에는 많은 사람들이 있었고, 그들 또한 그들의 베개를 들고 있었다."]],"w":"2번 문장에서 그녀의 주위에 많은 사람들이 있었고(many people), 그들(they)도 베개를 들고 있었어요.","c":2,"k":"they = 그녀의 주위에 있던 많은 사람들"},"pron":"they","h":"dc4dca2868"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Finally, don't forget to clean up the streets after the fight is over.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마지막으로, 싸움이 끝난 후에 거리를 치우는 것을 잊지 말아라.","opts":["마지막으로, 싸움을 시작하기 전에 거리를 청소해라.","마지막으로, 싸움이 끝난 후에 거리를 치우는 것을 잊지 말아라.","마지막으로, 싸움이 끝나면 거리에서 바로 집에 가라.","마지막으로, 거리를 청소한 것을 잊어버려라."],"r":{"a":"2) 마지막으로, 싸움이 끝난 후에 거리를 치우는 것을 잊지 말아라.","ev":"11번 문장","s":[[11,"Finally, don’t forget to clean up the streets after the fight is over.","마지막으로, 싸움이 끝난 후에 거리를 치우는 것을 잊지 말아라."]],"w":"don't forget to clean up은 '치우는 것을 잊지 말라'이고, after the fight is over는 '싸움이 끝난 후에'예요. 시작 전이 아니라 끝난 뒤예요.","c":2},"h":"379635fb35"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이 행사는 4월의 마지막 금요일에 열린다.","참가자는 딱딱한 베개를 가져와야 한다.","3시 정각에 사이렌이 울리자 사람들이 베개로 서로를 쳤다.","베개가 없는 사람만 싸움에 참가할 수 있다."],"opts":["The event is held on the last Friday of April.","Participants should bring a hard pillow.","When the siren rang at three o'clock, people hit each other with pillows.","Only people without pillows can join the fight."],"r":{"a":"3) When the siren rang at three o'clock, people hit each other with pillows.","ev":"3번, 4번 문장","s":[[3,"Then, at three o’clock, the siren rang, and people suddenly started hitting each other!","그때, 3시 정각에, 사이렌이 울렸고, 사람들이 갑자기 서로를 치기 시작했다!"],[4,"On International Pillow Fight Day, people have a big fight with pillows.","국제 베개 싸움의 날에, 사람들은 베개로 큰 싸움을 한다."]],"w":"3번에서 3시 정각에 사이렌이 울리자 사람들이 서로를 치기 시작했고, 4번에서 베개로 싸운다고 해요. 날짜는 첫째 주 토요일(5번), 베개는 부드러운 것(7번)이에요.","c":3},"h":"8542691b19"},{"n":9,"t":"sum","q":"People without a pillow are probably just (A) the (B) fight.","ko":"베개가 없는 사람들은 아마 그 (B) 싸움을 (A) 있을 뿐이다.","oko":["(A) 하고 / (B) 즐거운","(A) 보고 / (B) 화난","(A) 보고 / (B) 즐거운","(A) 떠나고 / (B) 즐거운","(A) 하고 / (B) 무서운"],"opts":["(A) joining / (B) fun","(A) watching / (B) angry","(A) watching / (B) fun","(A) leaving / (B) fun","(A) joining / (B) scary"],"r":{"a":"3) (A) watching / (B) fun ((A) 보고 / (B) 즐거운)","ev":"10번 문장","s":[[10,"This is because they are probably just watching the fun fight.","이것은 그들이 아마 그 즐거운 싸움을 보고 있을 뿐이기 때문이다."]],"w":"10번 문장에서 베개가 없는 사람들은 아마 그 즐거운(fun) 싸움을 보고(watching) 있을 뿐이라고 했어요.","c":3},"h":"7d7cd1b048"},{"n":10,"t":"fill","q":"One [A], Emily [B] out on the street with her pillow.","ko":"어느 날 [A], Emily는 그녀의 베개를 가지고 거리에 [B].","bank":["afternoon","went","soft","big","own","feathers"],"bko":{"afternoon":"오후","went":"갔다(go의 과거)","soft":"부드러운","big":"큰","own":"자신의","feathers":"깃털(feather의 복수형)"},"r":{"a":"[A] afternoon (오후), [B] went (갔다(go의 과거))","ev":"1번 문장","s":[[1,"One afternoon, Emily went out on the street with her pillow.","어느 날 오후, Emily는 그녀의 베개를 가지고 거리로 나갔다."]],"w":"1번 문장에서 어느 날 오후(afternoon)에 Emily가 베개를 들고 거리로 나갔다(went out)고 했어요. One 뒤에는 시간 명사, Emily 뒤에는 과거 동사가 와요.","c":null},"h":"53cbb5de53"}]},{"u":2,"id":"hk1-02-1","no":1,"ko":"화려한 복면이 나를 감싸네","items":[{"n":1,"t":"tf","q":"Facekinis cover the entire head except for the eyes, nose, and mouth.","ko":"페이스키니는 눈, 코, 입을 제외하고 머리 전체를 덮는다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They cover the entire head except for the eyes, nose, and mouth, so you look like a robber or a wrestler.","그것들은 눈, 코, 입을 제외하고 머리 전체를 덮어서, 당신은 강도나 레슬링선수처럼 보인다."]],"w":"6번 문장에 They cover the entire head except for the eyes, nose, and mouth가 그대로 있어요. except for는 '~을 제외하고'예요.","c":"T"},"h":"516bc4bd03"},{"n":2,"t":"tf","q":"Facekinis are made in only one color.","ko":"페이스키니는 한 가지 색으로만 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"They are made in many different colors and patterns.","그것들은 여러 다양한 색깔과 무늬로 만들어진다."]],"w":"10번 문장에서 페이스키니는 many different colors and patterns, 즉 여러 다양한 색깔과 무늬로 만들어진다고 해요. 한 가지 색이라는 말은 반대예요.","c":"F"},"h":"f6028d42c3"},{"n":3,"t":"tf","q":"Facekinis can help prevent jellyfish stings.","ko":"페이스키니는 해파리에게 쏘이는 것을 막는 데 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Facekinis can also prevent stings from jellyfish.","페이스키니는 해파리로부터 쏘이는 것도 방지할 수 있다."]],"w":"8번 문장에 Facekinis can also prevent stings from jellyfish가 나와요. prevent는 '막다'이고 sting은 '쏘임'이에요.","c":"T"},"h":"2d17e9ee8b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They cover the entire head except for the eyes, nose, and mouth.)","ko":"그것들은 눈, 코, 입을 제외하고 머리 전체를 덮는다.","opts":["작은","전체의","뒤쪽의","둥근"],"word":"entire","r":{"a":"2) 전체의","ev":"6번 문장","s":[[6,"They cover the entire head except for the eyes, nose, and mouth, so you look like a robber or a wrestler.","그것들은 눈, 코, 입을 제외하고 머리 전체를 덮어서, 당신은 강도나 레슬링선수처럼 보인다."]],"w":"눈, 코, 입만 빼고 덮는다고 했으니 머리 '전체'를 덮는 거예요. entire head = 머리 전체.","c":2},"h":"2c48ff49e9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, they fully protect your face from the sun’s harmful rays.)","ko":"하지만, 그것들은 태양의 해로운 광선으로부터 당신의 얼굴을 완전히 보호한다.","opts":["따뜻한","약한","해로운","눈부신"],"word":"harmful","r":{"a":"3) 해로운","ev":"7번 문장","s":[[7,"However, they fully protect your face from the sun’s harmful rays.","하지만, 그것들은 태양의 해로운 광선으로부터 당신의 얼굴을 완전히 보호한다."]],"w":"페이스키니가 얼굴을 '보호'하는 대상이니 얼굴에 나쁜, 즉 해로운 광선이에요. harmful = 해로운.","c":3},"h":"5b53ac5736"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIn addition, they can be a great fashion item.","ko":"밑줄 친 they가 가리키는 것은?","sko":"게다가, 그것들은 훌륭한 패션 소품이 될 수 있다.","opts":["페이스키니","해파리","중국 사람들","햇볕 광선"],"r":{"a":"1) 페이스키니","ev":"8~9번 문장","s":[[8,"Facekinis can also prevent stings from jellyfish.","페이스키니는 해파리로부터 쏘이는 것도 방지할 수 있다."],[9,"In addition, they can be a great fashion item.","게다가, 그것들은 훌륭한 패션 소품이 될 수 있다."]],"w":"패션 소품이 되는 것은 8번에서 계속 이야기하던 facekinis예요. 해파리나 햇볕 광선이 패션 소품이 될 수는 없어요.","c":1},"h":"d3a4cf4614","pron":"they"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, some people like to match their facekinis with their swimsuits to show off their styles!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서, 어떤 사람들은 스타일을 뽐내기 위해 그들의 페이스키니를 수영복과 맞추는 것을 좋아한다!","opts":["어떤 사람들은 수영복을 사지 않으려고 페이스키니만 쓴다.","어떤 사람들은 친구의 수영복과 자신의 페이스키니를 바꿔 쓴다.","어떤 사람들은 페이스키니가 싫어서 수영복에 색을 칠한다.","어떤 사람들은 스타일을 뽐내려고 페이스키니를 수영복과 어울리게 맞춘다."],"r":{"a":"4) 어떤 사람들은 스타일을 뽐내려고 페이스키니를 수영복과 어울리게 맞춘다.","ev":"11번 문장","s":[[11,"So, some people like to match their facekinis with their swimsuits to show off their styles!","그래서, 어떤 사람들은 스타일을 뽐내기 위해 그들의 페이스키니를 수영복과 맞추는 것을 좋아한다!"]],"w":"match A with B는 'A를 B와 맞추다', to show off their styles는 '스타일을 뽐내기 위해'예요. 수영복을 사지 않는다거나 바꿔 쓴다는 말은 없어요.","c":4},"h":"7d110ec4e0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["페이스키니는 얼굴이 햇볕에 타는 것을 좋아하는 사람들을 위해 만들어졌다.","얼굴이 햇볕에 타는 것을 싫어하는 사람들은 페이스키니에 관심이 있을지도 모른다.","페이스키니는 밖에 전혀 나가지 않는 사람들에게 주로 팔린다.","페이스키니는 발을 따뜻하게 하는 데 쓰인다."],"opts":["Facekinis are made for people who like sunburns on their faces.","People who hate sunburns on their faces may be interested in facekinis.","Facekinis are mostly sold to people who never go outside.","Facekinis are used to keep the feet warm."],"r":{"a":"2) People who hate sunburns on their faces may be interested in facekinis. (얼굴이 햇볕에 타는 것을 싫어하는 사람들은 페이스키니에 관심이 있을지도 모른다.)","ev":"1~2번 문장","s":[[1,"Do you enjoy playing at the beach but hate sunburns, especially on your face?","당신은 해변에서 노는 것을 즐기지만, 특히 당신의 얼굴이 햇볕에 타는 것은 싫어하는가?"],[2,"If you do, you may be interested in a “facekini.”","만약 그렇다면, 당신은 ‘페이스키니’에 관심이 있을지도 모른다."]],"w":"1~2번 문장에서 특히 얼굴이 햇볕에 타는 것을 싫어한다면 페이스키니에 관심이 있을지도 모른다고 했어요.","c":2},"h":"91721fdac5"},{"n":9,"t":"sum","q":"A facekini is a kind of (A) for your face. It may look (B) at first.","ko":"페이스키니는 얼굴을 위한 일종의 (A)이다. 그것은 처음에는 (B) 보일 수도 있다.","oko":["(A) 수건 / (B) 이상하게","(A) 비키니 / (B) 지루하게","(A) 모자 / (B) 사랑스럽게","(A) 비키니 / (B) 이상하게","(A) 수건 / (B) 작게"],"opts":["(A) towel / (B) strange","(A) bikini / (B) boring","(A) hat / (B) lovely","(A) bikini / (B) strange","(A) towel / (B) small"],"r":{"a":"4) (A) bikini / (B) strange ((A) 비키니 / (B) 이상하게)","ev":"3번, 5번 문장","s":[[3,"Basically, it is a bikini that can be worn on your face!","기본적으로, 그것은 당신의 얼굴에 착용될 수 있는 비키니이다!"],[5,"They may appear strange and funny at first.","그것들은 처음에는 이상하고 웃기게 보일지도 모른다."]],"w":"3번 문장에서 페이스키니는 얼굴에 착용하는 비키니(bikini)라고 했고, 5번 문장에서 처음에는 이상하고(strange) 웃기게 보일지도 모른다고 했어요.","c":4},"h":"5bf03768c0"},{"n":10,"t":"fill","q":"In [A], many people wear facekinis at the [B].","ko":"[A]에서는, 많은 사람들이 [B]에서 페이스키니를 착용한다.","bank":["China","beach","cover","prevent","different","show"],"bko":{"China":"중국","beach":"해변","cover":"덮다","prevent":"막다, 방지하다","different":"다른, 다양한","show":"보여 주다"},"r":{"a":"[A] China (중국), [B] beach (해변)","ev":"4번 문장","s":[[4,"In China, many people wear facekinis at the beach.","중국에서는, 많은 사람들이 해변에서 페이스키니를 착용한다."]],"w":"4번 문장에서 중국(China)에서는 많은 사람들이 해변(beach)에서 페이스키니를 착용한다고 했어요.","c":null},"h":"141b28708b"}]},{"u":2,"id":"hk1-02-2","no":2,"ko":"나는 가끔 눈물을 흘려...","items":[{"n":1,"t":"tf","q":"People thought crocodiles were pretending to feel sorry for their prey.","ko":"사람들은 악어가 먹이를 안쓰러워하는 척을 하고 있다고 생각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They thought crocodiles were pretending to feel sorry for their prey, so the tears seemed fake.","그들은 악어가 먹이를 안쓰러워하는 척을 하고 있다고 생각했고, 그래서 그 눈물은 거짓되게 보였다."]],"w":"4번 문장에 They thought crocodiles were pretending to feel sorry for their prey가 나와요. 여기서 They는 사람들이에요.","c":"T"},"h":"f9c2cff5db"},{"n":2,"t":"tf","q":"Crocodiles cry only when they are very sad.","ko":"악어는 매우 슬플 때만 운다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"In fact, crocodiles do cry when they are not sad at all.","사실, 악어는 전혀 슬프지 않을 때 정말 운다."],[6,"However, this is not a trick and doesn’t have any meaning.","하지만, 이것은 속임수가 아니고 어떠한 의미도 없다."]],"w":"5번에서 악어는 전혀 슬프지 않을 때도 운다고 하고, 6번에서 그것은 속임수도 아니고 의미도 없다고 해요. 슬플 때만 운다는 말은 반대예요.","c":"F"},"h":"0f433e3b23"},{"n":3,"t":"tf","q":"Crocodiles open their mouths wide to chew their prey.","ko":"악어는 먹이를 씹기 위해 입을 크게 벌린다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"To chew their prey, crocodiles open their mouths wide.","먹이를 씹기 위해서, 악어는 입을 크게 벌린다."]],"w":"8번 문장의 To chew their prey, crocodiles open their mouths wide와 같아요. To chew ~는 '씹기 위해'라는 목적이에요.","c":"T"},"h":"b16516281a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is used to describe a person who cries fake tears to look sad or sorry.)","ko":"이것은 슬프거나 미안해하는 것처럼 보이기 위해 거짓된 눈물을 흘리는 사람을 묘사하기 위해 사용된다.","opts":["진짜의","거짓된","따뜻한","많은"],"word":"fake","r":{"a":"2) 거짓된","ev":"2번 문장","s":[[2,"It is used to describe a person who cries fake tears to look sad or sorry.","이것은 슬프거나 미안해하는 것처럼 보이기 위해 거짓된 눈물을 흘리는 사람을 묘사하기 위해 사용된다."]],"w":"슬프거나 미안해 '보이기' 위해 흘리는 눈물이라고 했으니 진짜가 아닌 거짓 눈물이에요. fake = 거짓된.","c":2},"h":"145459e01c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To chew their prey, crocodiles open their mouths wide.)","ko":"먹이를 씹기 위해서, 악어는 입을 크게 벌린다.","opts":["친구","알","먹이","장난감"],"word":"prey","r":{"a":"3) 먹이","ev":"8번 문장","s":[[8,"To chew their prey, crocodiles open their mouths wide.","먹이를 씹기 위해서, 악어는 입을 크게 벌린다."]],"w":"악어가 씹는 대상이니 먹이예요. 4번 문장의 feel sorry for their prey(먹이를 안쓰러워하다)에서도 같은 단어가 나와요.","c":3},"h":"7bf4760fa8"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nA long time ago, people observed crocodiles crying while they ate.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"오래 전에, 사람들은 악어가 먹는 동안 울고 있는 것을 목격했다.","opts":["악어들","사람들","먹이들","눈물들"],"r":{"a":"1) 악어들","ev":"3번 문장","s":[[3,"A long time ago, people observed crocodiles crying while they ate.","오래 전에, 사람들은 악어가 먹는 동안 울고 있는 것을 목격했다."]],"w":"3번 문장은 사람들이 악어가 먹는 동안 우는 것을 보았다는 뜻이에요. 먹는(ate) 것은 악어이므로 they는 악어들이에요.","c":1,"k":"they = 악어들"},"pron":"they","h":"2604650f13"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is just a natural physical reaction.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 그냥 자연스러운 신체 반응이다.","opts":["그것은 몸에서 저절로 나타나는 반응일 뿐이다.","그것은 악어가 일부러 하는 행동이다.","그것은 먹이를 속이기 위한 방법이다.","그것은 악어가 아플 때만 나타나는 증상이다."],"r":{"a":"1) 그것은 몸에서 저절로 나타나는 반응일 뿐이다.","ev":"7번 문장","s":[[7,"It is just a natural physical reaction.","그것은 그냥 자연스러운 신체 반응이다."]],"w":"natural physical reaction은 '자연스러운 신체 반응'이에요. 6번에서 속임수가 아니라고 했으니 일부러 하거나 먹이를 속이는 것이 아니에요.","c":1},"h":"885ecb840e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["악어는 슬플 때만 눈물을 흘린다.","악어의 턱 근육이 눈물샘을 누르면 눈물이 저절로 나온다.","악어는 먹이를 씹을 때 입을 꼭 다문다.","사람들은 악어가 자는 동안 우는 것을 처음 보았다."],"opts":["Crocodiles cry only when they feel sad.","Crocodile tears automatically come out when jaw muscles press the tear ducts.","Crocodiles close their mouths tightly to chew their prey.","People first saw crocodiles crying while they were sleeping."],"r":{"a":"2) Crocodile tears automatically come out when jaw muscles press the tear ducts.","ev":"9~10번 문장","s":[[9,"This causes their jaw muscles to move a lot and put pressure on their tear ducts.","이것은 그들의 턱 근육이 많이 움직여 눈물샘에 압박을 가하도록 한다."],[10,"Then, the tears automatically come out of their tear ducts and start to fall!","그러면, 눈물이 그들의 눈물샘에서 저절로 나와 떨어지기 시작한다!"]],"w":"9번에서 턱 근육이 눈물샘을 누르고, 10번에서 눈물이 저절로 나와요. 슬플 때만 우는 게 아니고(5번), 입은 크게 벌리며(8번), 사람들이 본 것은 먹는 동안이에요(3번).","c":2},"h":"7adfcc32e0"},{"n":9,"t":"sum","q":"Crocodile tears are not a (A), and the tears just start to (B).","ko":"악어의 눈물은 (A)이(가) 아니고, 눈물은 그냥 (B) 시작한다.","oko":["(A) 게임 / (B) 떨어지기","(A) 속임수 / (B) 올라가기","(A) 노래 / (B) 떨어지기","(A) 속임수 / (B) 떨어지기","(A) 게임 / (B) 올라가기"],"opts":["(A) game / (B) fall","(A) trick / (B) rise","(A) song / (B) fall","(A) trick / (B) fall","(A) game / (B) rise"],"r":{"a":"4) (A) trick / (B) fall ((A) 속임수 / (B) 떨어지기)","ev":"6번, 10번 문장","s":[[6,"However, this is not a trick and doesn’t have any meaning.","하지만, 이것은 속임수가 아니고 어떠한 의미도 없다."],[10,"Then, the tears automatically come out of their tear ducts and start to fall!","그러면, 눈물이 그들의 눈물샘에서 저절로 나와 떨어지기 시작한다!"]],"w":"6번 문장에서 이것은 속임수(trick)가 아니라고 했고, 10번 문장에서 눈물이 나와서 떨어지기(fall) 시작한다고 했어요.","c":4},"h":"6e916189b4"},{"n":10,"t":"fill","q":"Have you [A] the [B] crocodile tears?","ko":"당신은 ‘악어의 눈물’이라는 [B]을(를) [A] 적이 있는가?","bank":["heard","term","swim","laugh","wide","ate"],"bko":{"heard":"들었다(hear의 과거분사)","term":"용어","swim":"수영하다","laugh":"웃다","wide":"넓게","ate":"먹었다(eat의 과거)"},"r":{"a":"[A] heard (들었다(hear의 과거분사)), [B] term (용어)","ev":"1번 문장","s":[[1,"Have you heard the term crocodile tears?","당신은 ‘악어의 눈물’이라는 용어를 들어본 적이 있는가?"]],"w":"1번 문장은 악어의 눈물이라는 용어(term)를 들어 본(heard) 적이 있는지 묻고 있어요. Have you 뒤에는 과거분사, the 뒤에는 명사가 와요.","c":null},"h":"ca2d31b799"}]},{"u":2,"id":"hk1-02-3","no":3,"ko":"자, 깨워줬지?","items":[{"n":1,"t":"tf","q":"The girl wrote a message on a sticky note.","ko":"소녀는 포스트잇에 메시지를 적었다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"After much thought, she wrote a message on a sticky note.","많은 생각 후에, 그녀는 포스트잇에 메시지를 적었다."]],"w":"8번 문장에 she wrote a message on a sticky note가 그대로 있어요. sticky note는 포스트잇이에요.","c":"T"},"h":"f3eb8458d1"},{"n":2,"t":"tf","q":"The girl woke up at 8 a.m. the next day.","ko":"소녀는 다음 날 오전 8시에 일어났다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"The next day, she woke up at 11 a.m.!","다음 날, 그녀는 오전 11시에 일어났다!"]],"w":"11번 문장에서 소녀는 오전 11시에 일어났어요. 8시는 쪽지에 적은 깨워 달라는 시간이에요.","c":"F"},"h":"2f618fb411"},{"n":3,"t":"tf","q":"The girl didn’t want to talk to her mother first.","ko":"소녀는 엄마에게 먼저 말하기를 원하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"However, she didn’t want to talk first.","하지만, 그녀는 먼저 말하기를 원하지 않았다."]],"w":"6번 문장 she didn’t want to talk first가 그대로예요. 그래서 말 대신 쪽지를 썼어요.","c":"T"},"h":"be8e055c31"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She was going to meet her friend early in the morning, but she was a heavy sleeper.)","ko":"그녀는 아침 일찍 친구를 만날 계획이었지만, 그녀는 잠이 많은 사람이었다.","opts":["잠이 많은 사람","일찍 일어나는 사람","잠을 못 자는 사람","몸이 무거운 사람"],"word":"heavy sleeper","r":{"a":"1) 잠이 많은 사람","ev":"4번 문장","s":[[4,"She was going to meet her friend early in the morning, but she was a heavy sleeper.","그녀는 아침 일찍 친구를 만날 계획이었지만, 그녀는 잠이 많은 사람이었다."]],"w":"아침 일찍 만나야 하는데 but으로 문제를 말하고, 다음 문장에서 엄마의 도움이 있어야 일어난다고 했으니 잠이 깊이 들어 잘 못 일어나는 사람이에요.","c":1},"h":"37f67c454c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Instead, she found a note.)","ko":"대신에, 그녀는 쪽지를 발견했다.","opts":["그리고","대신에","마침내","항상"],"word":"Instead","r":{"a":"2) 대신에","ev":"12~13번 문장","s":[[12,"She looked for her mother, but she wasn’t home.","그녀는 엄마를 찾았지만, 엄마는 집에 없었다."],[13,"Instead, she found a note.","대신에, 그녀는 쪽지를 발견했다."]],"w":"엄마를 찾았지만 없었어요(12번). 엄마 '대신' 쪽지를 발견한 거예요(13번).","c":2},"h":"daa179bfe0"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nThen, that night, the girl remembered that she had an appointment the next day.","ko":"밑줄 친 she이(가) 가리키는 것은?","sko":"그리고, 그날 밤, 그 소녀는 다음 날 약속이 있다는 것이 기억났다.","opts":["그 소녀","소녀의 엄마","소녀의 친구","소녀의 선생님"],"r":{"a":"1) 그 소녀","ev":"3번 문장","s":[[3,"Then, that night, the girl remembered that she had an appointment the next day.","그리고, 그날 밤, 그 소녀는 다음 날 약속이 있다는 것이 기억났다."]],"w":"3번 문장은 그 소녀(the girl)가 자신에게 다음 날 약속이 있다는 것을 기억했다는 뜻이에요. 기억한 사람과 약속이 있는 사람(she)은 같은 소녀예요.","c":1,"k":"she = 그 소녀"},"pron":"she","h":"db29a35e72"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n“Please wake me up at 8 a.m.”","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"“오전 8시에 저를 깨워주세요.”","opts":["오전 8시에 나를 깨워 달라는 부탁이다.","오전 8시에 엄마를 깨우겠다는 약속이다.","오후 8시에 나를 깨워 달라는 부탁이다.","오전 8시에 학교에 가겠다는 다짐이다."],"r":{"a":"1) 오전 8시에 나를 깨워 달라는 부탁이다.","ev":"9번 문장","s":[[9,"“Please wake me up at 8 a.m.”","“오전 8시에 저를 깨워 주세요.”"]],"w":"“Please wake me up at 8 a.m.”은 오전 8시에 나를 깨워 달라고 부탁하는 말이에요. wake up은 깨우다, Please는 부탁할 때 쓰는 말이에요.","c":1},"h":"66c335834f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["소녀는 가장 친한 친구와 싸웠다.","소녀와 엄마는 온종일 많은 이야기를 나눴다.","소녀는 엄마와 싸웠다.","소녀의 엄마는 학교에서 소녀를 기다리고 있었다."],"opts":["The girl had a fight with her best friend.","The girl and her mother talked a lot all day.","The girl had a fight with her mother.","The girl’s mother was waiting for her at school."],"r":{"a":"3) The girl had a fight with her mother. (소녀는 엄마와 싸웠다.)","ev":"1~2번 문장","s":[[1,"A girl had a fight with her mother.","한 소녀가 엄마와 싸웠다."],[2,"They didn’t speak to each other all day.","그들은 온종일 서로에게 말을 하지 않았다."]],"w":"1번 문장에서 한 소녀가 엄마와 싸웠다고 했고, 2번 문장에서 그들은 온종일 서로에게 말을 하지 않았다고 했어요.","c":3},"h":"0fa3fff6fe"},{"n":9,"t":"sum","q":"The girl put a sticky note on her mother’s (A). The next day, her mother was not at (B).","ko":"소녀는 엄마의 (A)에 포스트잇을 붙였다. 다음 날, 엄마는 (B)에 없었다.","oko":["(A) 문 / (B) 학교","(A) 휴대폰 / (B) 학교","(A) 침대 / (B) 집","(A) 휴대폰 / (B) 집","(A) 문 / (B) 집"],"opts":["(A) door / (B) school","(A) phone / (B) school","(A) bed / (B) home","(A) phone / (B) home","(A) door / (B) home"],"r":{"a":"4) (A) phone / (B) home ((A) 휴대폰 / (B) 집)","ev":"10번, 12번 문장","s":[[10,"She put it on her mother’s phone and went to sleep.","그녀는 그것을 엄마의 휴대폰 위에 붙이고 잠이 들었다."],[12,"She looked for her mother, but she wasn’t home.","그녀는 엄마를 찾았지만, 엄마는 집에 없었다."]],"w":"10번 문장에서 소녀는 포스트잇을 엄마의 휴대폰(phone) 위에 붙였고, 12번 문장에서 다음 날 엄마는 집(home)에 없었어요.","c":4},"h":"3b1720a60a"},{"n":10,"t":"fill","q":"She [A] her mother’s [B] to get up.","ko":"그녀는 일어나기 위해 엄마의 [B]을(를) [A].","bank":["needed","help","early","heavy","first","much"],"bko":{"needed":"필요로 했다(need의 과거)","help":"도움","early":"일찍","heavy":"무거운, 깊은","first":"먼저","much":"많은"},"r":{"a":"[A] needed (필요로 했다(need의 과거)), [B] help (도움)","ev":"5번 문장","s":[[5,"She needed her mother’s help to get up.","그녀는 일어나기 위해 엄마의 도움이 필요했다."]],"w":"5번 문장에서 그녀는 일어나기 위해 엄마의 도움(help)이 필요했다(needed)고 했어요. her mother’s 뒤에는 명사가, 앞에는 동사가 와요.","c":null},"h":"d496061495"}]},{"u":2,"id":"hk1-02-4","no":4,"ko":"오, 마이 베이비!","items":[{"n":1,"t":"tf","q":"Group A looked at pictures of baby animals after the first task.","ko":"A그룹은 첫 번째 과제 이후에 새끼 동물 사진을 보았다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Afterwards, Group A looked at pictures of baby animals, and Group B looked at images of food.","이후, A그룹은 새끼 동물 사진을 보았고, B그룹은 음식 사진을 보았다."]],"w":"6번 문장에 Afterwards, Group A looked at pictures of baby animals가 나와요. Afterwards는 '과제 이후'라는 뜻이에요.","c":"T"},"h":"a755b929f9"},{"n":2,"t":"tf","q":"The groups counted how many times a certain letter appeared.","ko":"그룹들은 특정 글자가 몇 번 나타났는지 세었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"They counted how many times a certain number appeared among 40 numbers.","그들은 40개의 숫자들 중에서 특정 숫자가 얼마나 많이 나타났는지 세었다."]],"w":"5번 문장에서 센 것은 letter(글자)가 아니라 40개의 숫자(numbers) 중 특정 숫자예요.","c":"F"},"h":"43efce1b1e"},{"n":3,"t":"tf","q":"Looking at pictures of babies can have a similar effect.","ko":"아기 사진을 보는 것도 유사한 효과를 가질 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Even just looking at them in pictures has a similar effect.","심지어 그들을 사진에서 보기만 하는 것도 유사한 효과를 가진다."]],"w":"12번 문장에서 사진으로만 봐도 비슷한 효과가 있다(has a similar effect)고 해요.","c":"T"}, ance had almost no change.","B그룹의 성과는 거의 변화가 없었다."]],"w":"8번 문장에서 B그룹의 성과(performance)는 거의(almost) 변화가 없었다고 했어요. 소유격 뒤에는 명사가, had 뒤 no 앞에는 부사가 와요.","c":null},"h":"e485da3f4f"}]},{"u":3,"id":"hk1-03-1","no":1,"ko":"쓴맛은 싫어!","items":[{"n":1,"t":"tf","q":"The American soldiers did not like espresso because it was too bitter.","ko":"미국 군인들은 에스프레소가 너무 써서 좋아하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"However, they did not like the Italian coffee called espresso.","하지만, 그들은 에스프레소라고 불리는 이탈리아의 커피를 좋아하지 않았다."],[5,"It was too bitter for the American soldiers.","에스프레소는 미국 군인들에게는 너무 썼다."]],"w":"4번에서 군인들이 에스프레소를 좋아하지 않았다고 하고, 5번에서 그 이유가 군인들에게 너무 썼기(too bitter) 때문이라고 해요.","c":"T"},"h":"ddba15ae94"},{"n":2,"t":"tf","q":"The barista poured cold water into the espresso.","ko":"바리스타는 에스프레소에 차가운 물을 부었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Then, he poured hot water into it.","그러고 나서, 그는 그 안에 뜨거운 물을 부었다."]],"w":"8번 문장에서 바리스타가 부은 것은 뜨거운 물(hot water)이에요. 차가운 물이 아니에요.","c":"F"},"h":"7171ad0429"},{"n":3,"t":"tf","q":"Italians began to call the mild coffee “Americano.”","ko":"이탈리아인들은 그 순한 커피를 ‘아메리카노’라고 부르기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Italians started to call this mild coffee “Americano.”","이탈리아인들은 이 순한 커피를 ‘아메리카노’라고 부르기 시작했다."]],"w":"10번 문장에 Italians started to call this mild coffee “Americano.”라고 나와요. start to call = 부르기 시작하다.","c":"T"},"h":"a04d24a0f6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It was too bitter for the American soldiers.)","ko":"그것은 미국 군인들에게는 너무 썼다.","opts":["단","짠","쓴","매운"],"word":"bitter","r":{"a":"3) 쓴","ev":"5번 문장","s":[[5,"It was too bitter for the American soldiers.","에스프레소는 미국 군인들에게는 너무 썼다."]],"w":"에스프레소가 군인들에게 맞지 않은 이유예요. 뜨거운 물을 넣어 less bitter(덜 쓴)가 되었다고 하니 bitter = 쓴이에요.","c":3},"h":"ccf06272fd"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Fortunately, one barista found a solution.)","ko":"다행히, 한 바리스타가 해결책을 찾았다.","opts":["질문","해결책","손님","가격"],"word":"solution 거인들(the giants)을 직접 볼 수 있다고 해요.","c":"T"},"h":"7715754480"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Eventually, the hungry animals asked the god Coyote to punish the giants.)","ko":"결국, 굶주린 동물들은 Coyote 신에게 거인들을 벌해달라고 부탁했다.","opts":["가끔","결국","어제","거의"],"word":"Eventually","r":{"a":"2) 결국","ev":"3~4번 문장","s":[[3,"They drank all the water and took every nut and fruit they saw.","그들은 모든 물을 마시고 그들이 본 모든 견과류와 과일을 먹어버렸다."],[4,"Eventually, the hungry animals asked the god Coyote to punish the giants.","결국, 굶주린 동물들은 Coyote 신에게 거인들을 벌해줄 것을 부탁했다."]],"w":"3번에서 거인들이 물과 열매를 모두 차지했고, 그 끝에 동물들이 부탁하게 돼요. 이어지는 결과를 말하는 eventually = 결국이에요.","c":2},"h":"250dee23d6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The legend is about the park’s huge stone pillars that stand like humans.)","ko":"그 전설은 사람처럼 서 있는 공원의 거대한 돌기둥들에 관한 것이다.","opts":["작은","오래된","거대한","무서운"],"word":"huge","r":{"a":"3) 거대한","ev":"11번 문장","s":[[11,"The legend is about the park’s huge stone pillars that stand like humans.","그 전설은 사람처럼 서 있는 공원의 거대한 돌기둥들에 관한 것이다."]],"w":"거인들이 변한 돌기둥이 사람처럼 서 있다고 했으니 아주 큰 돌기둥이에요. 그래서 huge = 거대한이에요.","c":3},"h":"09840a81e0"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAs soon as the giants arrived, they started to eat like pigs.","ko":"밑줄 친 they이(가) 가리키는 것은?","opts":["거인들","동물들","Coyote","돼지들"],"sko":"거인들은 도착하자마자, 돼지처럼 먹기 시작했다.","r":{"a":"1) 거인들","ev":"6번 문장","s":[[6,"As soon as the giants arrived, they started to eat like pigs.","거인들은 도착하자마자, 돼지처럼 먹기 시작했다."]],"w":"6번 문장은 거인들(the giants)이 도착하자마자 그들(they)이 돼지처럼 먹기 시작했다는 뜻이에요.","c":1,"k":"they = 거인들"},"pron":"they","h":"5970041abd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since that day, they have stood there under the spell.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["그날 이후로 거인들은 그곳을 떠나 다른 곳으로 갔다.","그날 이후로 거인들은 주문을 풀고 자유로워졌다.","그날 이후로 주문은 한 번도 쓰이지 않았다.","그날 이후로 거인들은 주문에 걸린 채 계속 그곳에 서 있다."],"sko":"그날 이후로, 그들은 주문에 걸린 채 그곳에 서 있어 왔다.","r":{"a":"4) 그날 이후로 거인들은 주문에 걸린 채 계속 그곳에 서 있다.","ev":"8~9번 문장","s":[[8,"Suddenly, every giant turned into stone!","갑자기, 모든 거인이 돌로 변했다!"],[9,"Since that day, they have stood there under the spell.","그날 이후로, 그들은 주문에 걸린 채 그곳에 서 있어 왔다."]],"w":"have stood는 그날부터 지금까지 계속 서 있다는 뜻이고, under the spell은 '주문에 걸린 채'예요. 8번에서 거인들이 돌로 변했으니 떠나거나 풀려난 것이 아니에요.","c":4},"h":"963141c956"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The giants shared their water with the animals.","The giants drank all the water and took every nut and fruit.","The animals took all the nuts and fruit from the giants.","The giants planted nuts and fruit trees for the animals."],"oko":["거인들은 동물들과 물을 나눠 마셨다.","거인들은 모든 물을 마시고 모든 견과류와 과일을 가져갔다.","동물들이 거인들에게서 모든 견과류와 과일을 가져갔다.","거인들은 동물들을 위해 견과류와 과일나무를 심었다."],"r":{"a":"2) The giants drank all the water and took every nut and fruit. (거인들은 모든 물을 마시고 모든 견과류와 과일을 가져갔다.)","ev":"3번 문장","s":[[3,"They drank all the water and took every nut and fruit they saw.","그들은 모든 물을 마시고 그들이 본 모든 견과류와 과일을 먹어버렸다."]],"w":"3번 문장에서 거인들은 모든 물을 마시고 그들이 본 모든 견과류와 과일을 가져갔다고 했어요.","c":2},"h":"d353cf14c4"},{"n":9,"t":"sum","q":"The giants were (A), so Coyote used a (B) spell.","ko":"거인들은 (A), 그래서 Coyote는 (B) 주문을 사용했다.","opts":["(A) kind / (B) magical","(A) greedy / (B) funny","(A) greedy / (B) magical","(A) lonely / (B) funny","(A) kind / (B) angry"],"oko":["(A) 친절했고 / (B) 마법의","(A) 욕심이 많았고 / (B) 웃기는","(A) 욕심이 많았고 / (B) 마법의","(A) 외로웠고 / (B) 웃기는","(A) 친절했고 / (B) 화난"],"r":{"a":"3) (A) greedy / (B) magical ((A) 욕심이 많았고 / (B) 마법의)","ev":"1번, 7번 문장","s":[[1,"A long time ago, there were greedy giants.","먼 옛날에, 욕심 많은 거인들이 있었다."],[7,"At that moment, Coyote used a magical spell.","그 순간, Coyote가 마법의 주문을 사용했다."]],"w":"1번 문장에서 거인들은 욕심이 많았고(greedy), 7번 문장에서 Coyote가 마법의(magical) 주문을 사용했어요.","c":3},"h":"b4c3feeac8"},{"n":10,"t":"fill","q":"They were [A] with animals, but they didn’t [B] about them.","ko":"그들은 동물들과 함께 [A] 있었지만, 동물들에 대해 신경 쓰지 [B].","bank":["living","care","water","nut","fruit","pigs"],"bko":{"living":"살고(live의 -ing형)","care":"신경 쓰다","water":"물","nut":"견과류","fruit":"과일","pigs":"돼지들"},"r":{"a":"[A] living (살고(live의 -ing형)), [B] care (신경 쓰다)","ev":"2번 문장","s":[[2,"They were living with animals, but they didn’t care about them.","그들은 동물들과 함께 살고 있었지만, 동물들에 대해 신경 쓰지 않았다."]],"w":"2번 문장은 그들이 동물들과 함께 살고(living) 있었지만 동물들에 대해 신경 쓰지(care) 않았다는 뜻이에요. were 뒤에는 -ing, didn’t 뒤에는 동사원형이 와요.","c":null},"h":"49bfde9a06"}]},{"u":3,"id":"hk1-03-4","no":4,"ko":"발레도 힙하게","items":[{"n":1,"t":"tf","q":"Hiplet was created by Homer Bryant.","ko":"힙레는 Homer Bryant에 의해 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Hiplet was created by Homer Bryant.","힙레는 Homer Bryant에 의해 만들어졌다."]],"w":"7번 문장에 Hiplet was created by Homer Bryant.가 그대로 나와요.","c":"T"},"h":"c430b32d56"},{"n":2,"t":"tf","q":"Hip-hop uses planned movements and precise postures.","ko":"힙합은 계획된 동작과 정확한 자세를 활용한다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"Ballet uses planned movements and precise postures.","발레는 계획된 동작과 정확한 자세를 활용한다."],[11,"On the other hand, hip-hop is free-form.","반면에, 힙합은 자유로운 형태이다."]],"w":"계획된 동작과 정확한 자세를 쓰는 것은 발레예요(10번). 힙합은 자유로운 형태(free-form)예요(11번).","c":"F"},"h":"7e1097b3b9"},{"n":3,"t":"tf","q":"Dancers use ballet motions and postures in hiplet.","ko":"힙레에서 무용수들은 발레 동작과 자세를 활용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Dancers use ballet motions and postures.","무용수들은 발레 동작과 자세를 활용한다."]],"w":"5번 문장에 Dancers use ballet motions and postures.가 나와요.","c":"T"},"h":"58e5597629"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (they bounce their bodies, shake their legs, and wave their arms)","ko":"그들은 몸을 튕기고, 다리를 떨고, 팔을 흔든다.","opts":["멈추다","숨기다","튕기다","눕다"],"word":"bounce","r":{"a":"3) 튕기다","ev":"6번 문장","s":[[6,"At the same time, they bounce their bodies, shake their legs, and wave their arms to current popular songs.","그와 동시에, 그들은 최신 인기곡들에 맞춰 몸을 튕기고, 다리를 떨고, 팔을 흔든다."]],"w":"bounce, shake, wave는 모두 춤출 때 몸을 움직이는 동작이에요. 최신 인기곡에 맞춰 몸을 위아래로 튕기는 동작이니 bounce = 튕기다예요.","c":3},"h":"65f6fb783c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Ballet uses planned movements and precise postures.)","ko":"발레는 계획된 동작과 정확한 자세를 활용한다.","opts":["정확한","느린","어두운","시끄러운"],"word":"precise","r":{"a":"1) 정확한","ev":"10번 문장","s":[[10,"Ballet uses planned movements and precise postures.","발레는 계획된 동작과 정확한 자세를 활용한다."]],"w":"발레는 정해 둔 대로 하는 춤이고, 힙합은 자유로운 형태라고 대조돼요(11번). 그래서 precise = 정확한이에요.","c":1},"h":"a1645a0334"},{"n":6,"t":"ref","q":"What does the underlined \"themselves\" refer to?\nHiplet ballerinas use the techniques of ballet, and they also move and express themselves freely with hip-hop motions.","ko":"밑줄 친 themselves가 가리키는 것은?","opts":["발레의 기술들","힙합 동작들","관객들","힙레 발레리나들"],"sko":"힙레 발레리나들은 발레의 기술을 활용하면서, 힙합 동작들로 자유롭게 움직이고 스스로를 표현하기도 한다.","r":{"a":"4) 힙레 발레리나들","ev":"13번 문장","s":[[13,"Hiplet ballerinas use the techniques of ballet, and they also move and express themselves freely with hip-hop motions.","힙레 발레리나들은 발레의 기술을 활용하면서, 힙합 동작들로 자유롭게 움직이고 스스로를 표현하기도 한다."]],"w":"express themselves는 '스스로를 표현하다'예요. 표현하는 사람과 표현되는 대상이 같으므로 주어 they, 즉 힙레 발레리나들을 가리켜요.","c":4},"h":"70210f984d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"And this is what makes hiplet interesting.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["그리고 이것은 힙레를 지루하게 만든다.","그리고 힙레는 이것을 흥미롭게 만든다.","그리고 이것이 힙레를 흥미롭게 만드는 점이다.","그리고 이것은 힙레가 흥미롭지 않다는 뜻이다."],"sko":"그리고 이것이 힙레를 흥미롭게 만든다.","r":{"a":"3) 그리고 이것이 힙레를 흥미롭게 만드는 점이다.","ev":"12번 문장","s":[[12,"And this is what makes hiplet interesting.","그리고 이것이 힙레를 흥미롭게 만든다."]],"w":"what makes hiplet interesting은 '힙레를 흥미롭게 만드는 것'이에요. 주어는 what(~하는 것)이고, 흥미롭게 되는 대상은 힙레예요.","c":3},"h":"1cb5ab18e7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Hiplet is danced only to old classical music.","Hiplet now interests people who did not care about classical ballet before.","Homer Bryant created hip-hop dance.","Ballet and hip-hop are very similar dance forms."],"oko":["힙레는 오래된 클래식 음악에만 맞춰 춘다.","힙레는 이제 이전에 고전 발레에 관심이 없던 사람들의 관심을 끈다.","Homer Bryant는 힙합 춤을 만들었다.","발레와 힙합은 매우 비슷한 춤 형태이다."],"r":{"a":"2) Hiplet now interests people who did not care about classical ballet before.","ev":"15번 문장","s":[[15,"Hiplet now attracts people who were not interested in classical ballet before.","힙레는 이제 이전에 고전 발레에는 관심이 없던 사람들의 마음을 끈다."]],"w":"15번에서 힙레가 이전에 고전 발레에 관심이 없던 사람들의 마음을 끈다고 해요. 힙레는 최신 인기곡에 맞춰 추고(6번), Homer Bryant가 만든 것은 힙레이며(7번), 두 춤은 매우 달라요(9번).","c":2},"h":"c5259a2f52"},{"n":9,"t":"sum","q":"Hiplet is the perfect (A) of both ballet and hip-hop, and many people say it is new and (B).","ko":"힙레는 발레와 힙합 양쪽의 완벽한 (A)이며, 많은 사람들은 그것이 새롭고 (B) 말한다.","opts":["(A) fight / (B) boring","(A) mix / (B) boring","(A) mix / (B) eye-catching","(A) fight / (B) eye-catching","(A) list / (B) old"],"oko":["(A) 싸움 / (B) 지루하다고","(A) 조합 / (B) 지루하다고","(A) 조합 / (B) 눈길을 끈다고","(A) 싸움 / (B) 눈길을 끈다고","(A) 목록 / (B) 낡았다고"],"r":{"a":"3) (A) mix / (B) eye-catching ((A) 조합 / (B) 눈길을 끈다고)","ev":"14번, 17번 문장","s":[[14,"It is the perfect mix of both!","그것은 양쪽의 완벽한 조합이다!"],[17,"It’s new and eye-catching.”","그것은 새롭고 눈길을 끈다.”라고 말한다."]],"w":"14번 문장에서 힙레는 양쪽의 완벽한 조합(mix)이라고 했고, 17번 문장에서 새롭고 눈길을 끈다(eye-catching)고 했어요.","c":3},"h":"298770f052"},{"n":10,"t":"fill","q":"You [A] the [B] bass of hip-hop.","ko":"당신은 힙합의 [B] 베이스 소리를 [A].","bank":["hear","heavy","freely","also","now","before"],"bko":{"hear":"듣다","heavy":"묵직한, 무거운","freely":"자유롭게","also":"또한","now":"이제","before":"이전에"},"r":{"a":"[A] hear (듣다), [B] heavy (묵직한, 무거운)","ev":"2번 문장","s":[[2,"You hear the heavy bass of hip-hop.","당신은 힙합의 묵직한 베이스 소리를 듣는다."]],"w":"2번 문장은 힙합의 묵직한(heavy) 베이스 소리를 듣는다(hear)는 뜻이에요. 주어 You 뒤에는 동사가, the와 bass 사이에는 형용사가 와요.","c":null},"h":"b8fbb6fd59"}]},{"u":4,"id":"hk1-04-1","no":1,"ko":"도넛이 전부가 아니야","items":[{"n":1,"t":"tf","q":"The Munchkins in Oz are excellent farmers.","ko":"오즈의 먼치킨들은 훌륭한 농부들이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They are excellent farmers, but they are much smaller than other people.","그들은 훌륭한 농부들이지만, 다른 사람들보다 훨씬 더 작다."]],"w":"3번 문장에 They are excellent farmers가 있어요. 먼치킨들은 훌륭한 농부이고 다른 사람들보다 훨씬 작아요.","c":"T"},"h":"aaf6ddb673"},{"n":2,"t":"tf","q":"Dorothy’s house is taken to Munchkin Country by a tornado.","ko":"도로시의 집은 회오리바람에 의해 먼치킨 나라로 옮겨진다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In The Wonderful Wizard of Oz, a tornado picks up Dorothy’s house and takes it to a strange place named Munchkin Country.","<오즈의 마법사>에서, 회오리바람은 도로시의 집을 들어 올려 그것을 먼치킨 나라라는 이름의 낯선 곳으로 데려간다."]],"w":"1번 문장에서 회오리바람이 도로시의 집을 들어 올려 먼치킨 나라로 데려간다고 해요.","c":"T"},"h":"498dcea057"},{"n":3,"t":"tf","q":"Someone threw away the extra dough from the hole.","ko":"누군가 구멍에서 나온 여분의 반죽을 버렸다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Instead of throwing away the extra dough from the hole, someone decided to use it.","그 구멍에서 나온 여분의 반죽을 버리는 것 대신, 누군가 그것을 사용하기로 결심했다."]],"w":"9번 문장에서 누군가 여분의 반죽을 버리는 대신(Instead of throwing away) 쓰기로 결심했다고 해요. 버렸다는 말은 반대예요.","c":"F"},"h":"eb009fc513"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They are excellent farmers, but they are much smaller than other people.)","ko":"그들은 훌륭한 농부들이지만, 다른 사람들보다 훨씬 더 작다.","opts":["게으른","낯선","훌륭한","유명한"],"word":"excellent","r":{"a":"3) 훌륭한","ev":"3번 문장","s":[[3,"They are excellent farmers, but they are much smaller than other people.","그들은 훌륭한 농부들이지만, 다른 사람들보다 훨씬 더 작다."]],"w":"3번 문장에서 but 뒤에 '훨씬 작다'가 나와요. but은 앞뒤가 반대일 때 쓰므로, 앞은 좋은 내용이에요. excellent = 훌륭한.","c":3},"h":"a16661e932"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Instead of throwing away the extra dough from the hole, ...)","ko":"그 구멍에서 나온 여분의 반죽을 버리는 대신, ...","opts":["여분의","끈적한","따뜻한","부드러운"],"word":"extra","r":{"a":"1) 여분의","ev":"9번 문장","s":[[9,"Instead of throwing away the extra dough from the hole, someone decided to use it.","그 구멍에서 나온 여분의 반죽을 버리는 것 대신, 누군가 그것을 사용하기로 결심했다."]],"w":"구멍을 낸 뒤 남은 반죽이라서 extra는 '여분의'예요. 이 남은 반죽을 버리는 대신 쓰기로 했다는 흐름이에요.","c":1},"h":"1e721383dc"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSince then, when people see something small, they call it a “munchkin.”","ko":"밑줄 친 it이(가) 가리키는 것은?","opts":["무언가 작은 것","도로시","오즈의 마법사","회오리바람"],"sko":"그 이후로, 사람들은 무언가 작은 것을 볼 때, 그것을 ‘먼치킨’이라고 부른다.","r":{"a":"1) 무언가 작은 것","ev":"4번 문장","s":[[4,"Since then, when people see something small, they call it a “munchkin.”","그 이후로, 사람들은 무언가 작은 것을 볼 때, 그것을 ‘먼치킨’이라고 부른다."]],"w":"4번 문장은 사람들이 무언가 작은 것(something small)을 볼 때 그것(it)을 먼치킨이라고 부른다는 뜻이에요.","c":1,"k":"it = 무언가 작은 것"},"pron":"it","h":"60e71cbccc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, the most famous munchkin is probably a donut.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["아마도 가장 잘 알려진 먼치킨은 도넛일 것이다.","가장 유명한 먼치킨은 분명 고양이다.","도넛은 먼치킨 중에서 가장 인기가 없다.","먼치킨은 도넛 가게의 이름일 것이다."],"sko":"하지만, 가장 유명한 먼치킨은 아마 도넛일 것이다.","r":{"a":"1) 아마도 가장 잘 알려진 먼치킨은 도넛일 것이다.","ev":"7번 문장","s":[[7,"However, the most famous munchkin is probably a donut.","하지만, 가장 유명한 먼치킨은 아마 도넛일 것이다."]],"w":"7번 문장은 가장 유명한(the most famous) 먼치킨이 아마(probably) 도넛이라는 뜻이에요. probably는 확실하지는 않지만 그럴 것이라는 뜻이에요.","c":1},"h":"fb4e9f9187"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Cats with very long legs are called munchkins.","Cats with very short legs are called munchkins.","Dogs with very short legs are called munchkins.","Cats with very short legs are called donuts."],"oko":["아주 긴 다리를 가진 고양이들은 먼치킨이라고 불린다.","아주 짧은 다리를 가진 고양이들은 먼치킨이라고 불린다.","아주 짧은 다리를 가진 개들은 먼치킨이라고 불린다.","아주 짧은 다리를 가진 고양이들은 도넛이라고 불린다."],"r":{"a":"2) Cats with very short legs are called munchkins. (아주 짧은 다리를 가진 고양이들은 먼치킨이라고 불린다.)","ev":"5번 문장","s":[[5,"For example, cats that have very short legs are called munchkins.","예를 들어, 아주 짧은 다리를 가진 고양이들은 먼치킨이라고 불린다."]],"w":"5번 문장에서 아주 짧은 다리를 가진 고양이들을 먼치킨이라고 부른다고 했어요.","c":2},"h":"a9d3838b9f"},{"n":9,"t":"sum","q":"The word munchkin is sometimes used as a (A) for (B).","ko":"먼치킨이라는 말은 가끔 (B)에 대한 (A)(으)로 쓰인다.","opts":["(A) song / (B) kids","(A) nickname / (B) adults","(A) nickname / (B) kids","(A) song / (B) adults","(A) joke / (B) kids"],"oko":["(A) 노래 / (B) 아이들","(A) 별명 / (B) 어른들","(A) 별명 / (B) 아이들","(A) 노래 / (B) 어른들","(A) 농담 / (B) 아이들"],"r":{"a":"3) (A) nickname / (B) kids ((A) 별명 / (B) 아이들)","ev":"6번 문장","s":[[6,"It is also sometimes used as a nickname for kids.","그것은 가끔 아이들에 대한 별명으로도 쓰인다."]],"w":"6번 문장에서 먼치킨은 가끔 아이들(kids)에 대한 별명(nickname)으로도 쓰인다고 했어요.","c":3},"h":"08153b6b02"},{"n":10,"t":"fill","q":"This [A] became a tiny dessert ball and was [B] the Munchkin.","ko":"이것은 [A] 작은 디저트 볼이 되었고 먼치킨이라고 [B].","bank":["eventually","named","famous","strange","short","other"],"bko":{"eventually":"결국","named":"이름 지어졌다(name의 과거분사)","famous":"유명한","strange":"낯선, 이상한","short":"짧은","other":"다른"},"r":{"a":"[A] eventually (결국), [B] named (이름 지어졌다(name의 과거분사))","ev":"10번 문장","s":[[10,"This eventually became a tiny dessert ball and was named the Munchkin.","여분의 반죽은 결국 작은 디저트 볼이 되었고 먼치킨이라고 이름 지어졌다."]],"w":"10번 문장에서 여분의 반죽은 결국(eventually) 작은 디저트 볼이 되었고 먼치킨이라고 이름 지어졌다(named)고 했어요. became 앞에는 부사가, was 뒤에는 과거분사가 와요.","c":null},"h":"690b92d377"}]},{"u":4,"id":"hk1-04-2","no":2,"ko":"영화에선 히어로, 현실에선?","items":[{"n":1,"t":"tf","q":"Wolverines are only 70 centimeters long, but they are very strong for their size.","ko":"울버린은 길이가 70센티미터밖에 되지 않지만, 크기에 비해 매우 강하다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They are only 70 centimeters long, but they are extremely strong for their size.","그것들은 길이가 70센티미터밖에 되지 않지만, 크기에 비해 매우 강하다."]],"w":"6번 문장에 only 70 centimeters long, but extremely strong for their size가 나와요.","c":"T"},"h":"1c7a850e87"},{"n":2,"t":"tf","q":"Wolverines are afraid of bears and wolves and walk away from them.","ko":"울버린은 곰과 늑대를 무서워하여 그것들에게서 떠나 버린다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"When they come near, even bears and wolves stop eating and walk away!","그것들이 가까이 오면, 곰과 늑대조차 먹기를 멈추고 떠나 버린다!"]],"w":"11번 문장에서 울버린이 가까이 오면 곰과 늑대가 먹기를 멈추고 떠나 버려요. 떠나는 쪽은 울버린이 아니에요.","c":"F"},"h":"30eb156528"},{"n":3,"t":"tf","q":"Wolverines often attack large animals such as reindeer and sheep.","ko":"울버린은 종종 순록과 양 같은 큰 동물들을 공격한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"They often attack and kill large animals, such as reindeer and sheep.","그것들은 종종 순록과 양과 같은 큰 동물들을 공격하고 죽인다."]],"w":"8번 문장에서 They often attack and kill large animals, such as reindeer and sheep라고 해요.","c":"T"},"h":"d6aef7f038"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Fierce wolverines even threaten other predators to steal their prey.)","ko":"사나운 울버린은 심지어 다른 포식 동물들의 먹이를 빼앗기 위해 그것들을 위협하기도 한다.","opts":["온순한","사나운","느린","겁 많은"],"word":"Fierce","r":{"a":"2) 사나운","ev":"10번 문장","s":[[10,"Fierce wolverines even threaten other predators to steal their prey.","사나운 울버린은 심지어 다른 포식 동물들의 먹이를 빼앗기 위해 그것들을 위협하기도 한다."]],"w":"다른 포식 동물을 위협하고 먹이를 빼앗을 정도니 fierce는 '사나운'이에요. 온순하거나 겁이 많다면 위협하지 못해요.","c":2},"h":"774011b6a7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Fierce wolverines even threaten other predators to steal their prey.)","ko":"사나운 울버린은 심지어 다른 포식 동물들의 먹이를 빼앗기 위해 그것들을 위협하기도 한다.","opts":["빼앗다","나누어 주다","길러 주다","돌려주다"],"word":"steal","r":{"a":"1) 빼앗다","ev":"10번 문장","s":[[10,"Fierce wolverines even threaten other predators to steal their prey.","사나운 울버린은 심지어 다른 포식 동물들의 먹이를 빼앗기 위해 그것들을 위협하기도 한다."]],"w":"to steal their prey는 다른 동물의 먹이를 빼앗으려고 한다는 뜻이에요. 위협하는 이유라서 '나누어 주다, 돌려주다'는 맞지 않아요. steal = 빼앗다, 훔치다.","c":1},"h":"1f13406e81"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nLike the character Wolverine, they use their powerful claws to hunt.","ko":"밑줄 친 they가 가리키는 것은?","opts":["캐릭터 울버린","순록과 양","곰과 늑대","실제 동물인 울버린들"],"sko":"캐릭터 울버린처럼, 그것들은 사냥하기 위해 강력한 발톱을 사용한다.","r":{"a":"4) 실제 동물인 울버린들","ev":"5, 7번 문장","s":[[5,"Wolverines look like little bears.","울버린은 작은 곰처럼 보인다."],[7,"Like the character Wolverine, they use their powerful claws to hunt.","캐릭터 울버린처럼, 그것들은 사냥하기 위해 강력한 발톱을 사용한다."]],"w":"7번은 'Like the character Wolverine(캐릭터 울버린처럼)'이라고 했으니 캐릭터가 아니라 실제 동물이에요. 5~6번의 Wolverines(실제 동물 울버린들)를 they로 받았어요.","c":4},"h":"85b0f30ce6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Their teeth and jaws are also so strong that they can crush bones.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["이빨과 턱이 약해서 뼈를 부술 수 없다.","이빨과 턱이 매우 강해서 뼈도 부술 수 있다.","이빨과 턱이 뼈로 되어 있어서 매우 강하다.","뼈가 매우 강해서 이빨과 턱을 부술 수 있다."],"sko":"그것들의 이빨과 턱 또한 매우 강해서 뼈도 부술 수 있다.","r":{"a":"2) 이빨과 턱이 매우 강해서 뼈도 부술 수 있다.","ev":"9번 문장","s":[[9,"Their teeth and jaws are also so strong that they can crush bones.","그것들의 이빨과 턱 또한 매우 강해서 뼈도 부술 수 있다."]],"w":"'so strong that ~'은 '매우 강해서 ~하다'예요. 이빨과 턱이 강해서 뼈를 부술 수 있다는 뜻이고, 뼈가 이빨을 부수는 게 아니에요.","c":2},"h":"5fa9e9e2fb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Wolverines look like big wolves.","Wolverines look like little bears.","Wolverines look like small birds.","Wolverines look like tall horses."],"oko":["울버린은 큰 늑대처럼 보인다.","울버린은 작은 곰처럼 보인다.","울버린은 작은 새처럼 보인다.","울버린은 키 큰 말처럼 보인다."],"r":{"a":"2) Wolverines look like little bears. (울버린은 작은 곰처럼 보인다.)","ev":"5번 문장","s":[[5,"Wolverines look like little bears.","울버린은 작은 곰처럼 보인다."]],"w":"5번 문장에서 울버린은 작은 곰(little bears)처럼 보인다고 했어요.","c":2},"h":"037e05bdfb"},{"n":9,"t":"sum","q":"His sharp claws are great (A) that are strong enough to (B) anything.","ko":"그의 날카로운 발톱은 어떤 것이든 (B) 만큼 충분히 강한 훌륭한 (A)이다.","opts":["(A) toys / (B) cut","(A) weapons / (B) draw","(A) weapons / (B) cut","(A) gifts / (B) paint","(A) toys / (B) draw"],"oko":["(A) 장난감 / (B) 자를","(A) 무기 / (B) 그릴","(A) 무기 / (B) 자를","(A) 선물 / (B) 칠할","(A) 장난감 / (B) 그릴"],"r":{"a":"3) (A) weapons / (B) cut ((A) 무기 / (B) 자를)","ev":"2번 문장","s":[[2,"His sharp claws are great weapons that are strong enough to cut anything.","그의 날카로운 발톱은 어떤 것이든 자를 만큼 충분히 강한 훌륭한 무기이다."]],"w":"2번 문장에서 그의 날카로운 발톱은 어떤 것이든 자를(cut) 만큼 강한 훌륭한 무기(weapons)라고 했어요.","c":3},"h":"de59a37e18"},{"n":10,"t":"fill","q":"It’s [A] a wolverine, [B]!","ko":"그것은 [B] 울버린이라고 [A]!","bank":["called","too","based","sharp","great","little"],"bko":{"called":"불린다(call의 과거분사)","too":"또한","based":"바탕으로 한(base의 과거분사)","sharp":"날카로운","great":"훌륭한","little":"작은"},"r":{"a":"[A] called (불린다(call의 과거분사)), [B] too (또한)","ev":"4번 문장","s":[[4,"It’s called a wolverine, too!","그것 또한 울버린이라고 불린다!"]],"w":"4번 문장은 그것 또한(too) 울버린이라고 불린다(called)는 뜻이에요. It’s 뒤에는 과거분사가, 문장 끝에는 부사가 와요.","c":null},"h":"56f896c1c5"}]},{"u":4,"id":"hk1-04-3","no":3,"ko":"주문하신 산소 나왔습니다~","items":[{"n":1,"t":"tf","q":"Rahul heard that it costs four to seven dollars.","ko":"Rahul은 그것이 4달러에서 7달러가 든다고 들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"I heard it costs four to seven dollars.","나는 4달러에서 7달러까지의 비용이 든다고 들었어."]],"w":"12번 문장에 I heard it costs four to seven dollars가 있어요.","c":"T"},"h":"e57ca2bbb0"},{"n":2,"t":"tf","q":"Rahul says air pollution is not a problem in India.","ko":"Rahul은 대기 오염이 인도에서는 문제가 아니라고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Air pollution is a big problem in India, too.","대기 오염은 인도에서도 큰 문제야."]],"w":"5번 문장에서 Rahul은 대기 오염이 인도에서도 큰 문제(a big problem)라고 해요. 문제가 아니라는 말은 반대예요.","c":"F"},"h":"01e007585b"},{"n":3,"t":"tf","q":"A diffuser in the café adds scents like lavender and orange.","ko":"카페의 디퓨저는 라벤더와 오렌지 같은 향을 더해 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"The machines are also connected to a diffuser that adds a few different scents, like lavender and orange.","기계들은 또한 라벤더와 오렌지 같은 몇 가지 다른 향들을 더해주는 디퓨저에 연결되어 있지."]],"w":"10번 문장에서 기계들이 디퓨저에 연결되어 있고, 디퓨저가 라벤더와 오렌지 같은 향을 더한다고 해요.","c":"T"},"h":"d192936279"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Well, it has machines that filter the air and produce 99% pure oxygen.)","ko":"음, 그곳은 공기를 여과해서 99퍼센트의 순수한 산소를 만들어내는 기계들을 가지고 있어.","opts":["끄다","나누다","여과하다","팔다"],"word":"filter","r":{"a":"3) 여과하다","ev":"9번 문장","s":[[9,"Rahul: Well, it has machines that filter the air and produce 99% pure oxygen.","음, 그곳은 공기를 여과해서 99퍼센트의 순수한 산소를 만들어내는 기계들을 가지고 있어."]],"w":"기계가 공기에서 순수한 산소를 만들어 내는 내용이에요. 공기를 깨끗하게 걸러 내는 일이니 filter = 여과하다(걸러 내다)예요.","c":3},"h":"1cd6f81088"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They say they feel refreshed and relaxed!)","ko":"그들은 상쾌하고 편안한 기분을 느낀다고 이야기해!","opts":["피곤한","상쾌한","지루한","화난"],"word":"refreshed","r":{"a":"2) 상쾌한","ev":"11, 17번 문장","s":[[11,"Customers can breathe the pure air for 15 minutes.","손님들은 그 순수한 공기를 15분 동안 들이마실 수 있어."],[17,"They say they feel refreshed and relaxed!","그들은 상쾌하고 편안한 기분을 느낀다고 이야기해!"]],"w":"순수한 공기를 마신 사람들이 느끼는 기분이고, relaxed(편안한)와 함께 쓰여 좋은 기분이에요. refreshed = 상쾌한.","c":2},"h":"36b9c034c1"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is called Oxy Pure.","ko":"밑줄 친 It이(가) 가리키는 것은?","opts":["산소를 파는 카페","미세먼지","Rahul의 친구","인도"],"sko":"그곳은 Oxy Pure라고 불려.","r":{"a":"1) 산소를 파는 카페","ev":"6~7번 문장","s":[[6,"There is even a café that sells oxygen in my town now!","우리 동네에는 이제 산소를 판매하는 카페도 있어!"],[7,"It is called Oxy Pure.","그곳은 Oxy Pure라고 불려."]],"w":"6번 문장에서 산소를 판매하는 카페가 있다고 했고, 7번 문장의 It은 그 카페를 가리켜요.","c":1,"k":"It = 산소를 파는 카페"},"pron":"It","h":"297fda22f6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There is even a café that sells oxygen in my town now!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["우리 동네에는 이제 산소를 파는 카페까지 있어!","우리 동네의 카페는 이제 산소를 사 간다!","우리 동네에는 산소 때문에 문을 닫은 카페가 있어!","우리 동네에는 산소를 만드는 큰 공장이 있어!"],"sko":"우리 동네에는 이제 산소를 판매하는 카페도 있어!","r":{"a":"1) 우리 동네에는 이제 산소를 파는 카페까지 있어!","ev":"6번 문장","s":[[6,"There is even a café that sells oxygen in my town now!","우리 동네에는 이제 산소를 판매하는 카페도 있어!"]],"w":"a café that sells oxygen은 '산소를 파는 카페'예요. even은 '~까지도'라는 놀라움을 나타내요. 카페가 사 가는 것도, 문을 닫은 것도, 공장도 아니에요.","c":1},"h":"e24ef27a04"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Rahul stayed home because of the fine dust.","Minji had to stay home because of the fine dust.","Minji had a good weekend at the beach.","Rahul had to stay home because of the rain."],"oko":["Rahul은 미세먼지 때문에 집에 있었다.","Minji는 미세먼지 때문에 집에 있어야 했다.","Minji는 해변에서 즐거운 주말을 보냈다.","Rahul은 비 때문에 집에 있어야 했다."],"r":{"a":"2) Minji had to stay home because of the fine dust. (Minji는 미세먼지 때문에 집에 있어야 했다.)","ev":"1~3번 문장","s":[[1,"Minji: How was your weekend, Rahul?","주말 어떻게 보냈니, Rahul?"],[2,"Mine was bad!","내 주말은 안 좋았어!"],[3,"I had to stay home because of the fine dust.","미세먼지 때문에 집에 있어야 했거든."]],"w":"1번 문장에서 Minji가 주말이 어땠는지 물었고, Rahul의 질문에 이어 2~3번 문장에서 Minji가 자기 주말은 안 좋았고 미세먼지 때문에 집에 있어야 했다고 말했어요.","c":2},"h":"82b2e94ccd"},{"n":9,"t":"sum","q":"Minji says it sounds (A), and asks if the café is (B).","ko":"Minji는 그것이 (A) 들린다고 말하며, 그 카페가 (B) 곳인지 묻는다.","opts":["(A) boring / (B) popular","(A) interesting / (B) cheap","(A) interesting / (B) popular","(A) strange / (B) cheap","(A) boring / (B) crowded"],"oko":["(A) 지루하게 / (B) 인기 있는","(A) 흥미롭게 / (B) 값싼","(A) 흥미롭게 / (B) 인기 있는","(A) 이상하게 / (B) 값싼","(A) 지루하게 / (B) 붐비는"],"r":{"a":"3) (A) interesting / (B) popular ((A) 흥미롭게 / (B) 인기 있는)","ev":"13~14번 문장","s":[[13,"Minji: That sounds interesting!","그거 흥미롭게 들린다!"],[14,"Is the café popular?","그 카페는 인기가 있니?"]],"w":"13번 문장에서 Minji는 흥미롭게(interesting) 들린다고 했고, 14번 문장에서 그 카페가 인기 있는지(popular) 물었어요.","c":3},"h":"d7eb038bab"},{"n":10,"t":"fill","q":"Customers can [A] the pure air for 15 [B].","ko":"손님들은 순수한 공기를 15 [B] 동안 [A] 수 있다.","bank":["breathe","minutes","terrible","sure","few","different"],"bko":{"breathe":"들이마시다","minutes":"분(minute의 복수형)","terrible":"끔찍한","sure":"물론, 확실한","few":"소수의","different":"다른"},"r":{"a":"[A] breathe (들이마시다), [B] minutes (분(minute의 복수형))","ev":"11번 문장","s":[[11,"Customers can breathe the pure air for 15 minutes.","손님들은 그 순수한 공기를 15분 동안 들이마실 수 있어."]],"w":"11번 문장에서 손님들은 그 순수한 공기를 15분(minutes) 동안 들이마실(breathe) 수 있다고 했어요. can 뒤에는 동사원형이, 숫자 15 뒤에는 단위 명사가 와요.","c":null},"h":"4532c0c8f8"}]},{"u":4,"id":"hk1-04-4","no":4,"ko":"더 이상 병원이 두렵지 않아!","items":[{"n":1,"t":"tf","q":"The Medi Teddy has a pouch in the back and covers the IV bag.","ko":"Medi Teddy는 뒤에 주머니가 있고 링거 주머니를 가려 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8
