. My best friend, Lucy, and I share playlists and talk about our favorite singers. My favorite singer is Gina and this is her album. She is the most famous singer in Korea. I always listen to her songs during lunch time. I also like the sounds of nature. When I need to relax before tests, I listen to raindrops.", "Seho: This is my soccer bag. My lucky soccer shoes are in the bag. When I wear these shoes, I always win. So, I have them with me all the time and I keep them clean. I also have this soccer diary in my bag. All the greatest soccer players write about their training. I write about my strong and weak points in my diary. My dream is to become a world-famous soccer player. Soccer is my life!", "Hazel: I have this cute pouch in my bag. It's my snack pouch. I put candies, jellies, and snack bars in it. I like to try out the newest snacks. These are ramyeon jellies. They look like ramyeon but taste sweet. My friends are also interested in my snacks. So, I bring extra snacks for them. I share chocolate bars with Kate for some energy before P.E. class. Are you worried about my teeth? Don't worry. I don't forget to brush them. I always have a toothbrush in my bag."];var PASS_KO=["나의 가방, 나의 학교생활", "학교로 돌아온 걸 환영해요, 친구들! 우리 가방을 열어서 서로를 알아 가는 시간을 가져보는 것이 어떨까요?", "보라: 저는 항상 제 가방에 헤드폰을 가지고 다녀요. 저는 음악을 듣는 걸 좋아하는데 그건 저를 행복하게 하기 때문이에요. 저의 가장 친한 친구, Lucy와 저는 재생 목록을 공유하고 저희가 가장 좋아하는 가수들에 관해 이야기해요. 제가 가장 좋아하는 가수는 Gina이고 이것은 그녀의 앨범이에요. 그녀는 한국에서 가장 유명한 가수예요. 저는 점심시간 동안 항상 그녀의 노래를 들어요. 저는 또한 자연의 소리도 좋아해요. 시험 전에 휴식을 취해야 할 때, 저는 빗방울 소리를 들어요.", "세호: 이것은 저의 축구 가방이에요. 제 행운의 축구화가 가방 안에 들어 있어요. 이 신발을 신을 때, 저는 항상 이겨요. 그래서, 저는 그것을 항상 가지고 다니고 그것을 깨끗하게 유지해요. 또 제 가방 안에 이 축구 일기도 있어요. 모든 최고의 축구 선수들은 자신의 훈련에 대해 기록해요. 저도 저의 강점과 약점을 일기에 적어요. 제 꿈은 세계적으로 유명한 축구 선수가 되는 거예요. 축구는 제 삶이에요!", "Hazel: 제 가방에는 이 귀여운 주머니가 있어요. 그것은 제 간식 주머니예요. 저는 사탕, 젤리, 그리고 스낵 바를 그곳에 넣어요. 저는 최신 간식을 먹어 보는 걸 좋아해요. 이것들은 라면 젤리예요. 그것들은 라면처럼 생겼지만 맛은 달콤해요. 제 친구들도 저의 간식에 관심이 있어요. 그래서 저는 그들을 위해 추가 간식을 가져와요. 저는 체육 수업 전에 에너지를 내기 위해 Kate
