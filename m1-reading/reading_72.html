var D=[{"n":1,"tag":null,"en":"Seojun are a middle school student. One day, him watched a video about polar bears in danger.","ko":"서준이는 중학생입니다. 어느 날, 그는 위험에 처한 북극곰에 관한 영상을 보았습니다.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[1],"point":"be동사의 현재형: 주어 Seojun 단수: is (are 아님)","topic":"be동사의 현재형","memo":"주어 Seojun 단수: is (are 아님)"},{"wrong":"him","right":"he","partial":false,"at":[8],"point":"인칭대명사의 주격: 주어 자리에는 주격 he 사용","topic":"인칭대명사의 주격","memo":"주어 자리에는 주격 he 사용"}]},{"n":2,"tag":null,"en":"He felt sorry for them, so he decided to do something. Now he does a lot of thing to help the Earth.","ko":"그는 그들이 안타까웠고, 그래서 무언가를 하기로 결심했습니다. 이제 그는 지구를 돕기 위해 많은 것들을 해요.","ok":false,"foot":[],"fixes":[{"wrong":"thing","right":"things","partial":false,"at":[17],"point":"명사의 복수형: a lot of 뒤에는 복수명사 things 사용","topic":"명사의 복수형","memo":"a lot of 뒤에는 복수명사 things 사용"}]},{"n":3,"tag":null,"en":"Let's learn about Seojun's green life.","ko":"서준이의 친환경 생활에 대해 알아봅시다.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":"친환경 선택","en":"Seojun always carries his bottle with him to drink waters. He doesn't use paper cups.","ko":"서준이는 물을 마시기 위해 항상 물병을 가지고 다닙니다. 그는 종이컵을 사용하지 않아요.","ok":false,"foot":[],"fixes":[{"wrong":"waters","right":"water","partial":false,"at":[9],"point":"셀 수 없는 명사: water는 셀 수 없는 명사라 복수형 불가","topic":"셀 수 없는 명사","memo":"water는 셀 수 없는 명사라 복수형 불가"}]},{"n":5,"tag":null,"en":"Also, Seojun don't use paper towels when he dries his hands on restrooms. He uses his own handkerchief.","ko":"또한, 서준이는 화장실에서 손을 말릴 때 종이 타월을 사용하지 않습니다. 그는 자신의 손수건을 사용해요.","ok":false,"foot":[],"fixes":[{"wrong":"don't","right":"doesn't","partial":false,"at":[2],"point":"일반동사의 부정문: 3인칭 단수 주어 Seojun에는 doesn't 사용","topic":"일반동사의 부정문","memo":"3인칭 단수 주어 Seojun에는 doesn't 사용"},{"wrong":"on","right":"in","partial":false,"at":[11],"point":"기본전치사: '화장실에서'는 전치사 in 사용","topic":"기본전치사","memo":"'화장실에서'는 전치사 in 사용"}]},{"n":6,"tag":"친환경 식사","en":"Every weekend, Seojun's family have special meatless n't travel far.","그 음식들은 지역 농장에서 오는 것들이라, 멀리 이동하지 않습니다.",0],["Green Shopping","환경 친화적인 물건 구매",1],["On Fridays, Seojun takes plastic bottles and cans to a zero waste shop.","금요일마다, 서준이는 플라스틱 병과 캔을 제로 웨이스트 가게로 가지고 갑니다.",1],["Then, he gets green points.","그러고 나서, 그는 친환경 포인트를 받습니다.",0],["With these points, Seojun buys green products like eco-bags and bamboo toothbrushes.","서준이는 이 포인트로 에코백이나 대나무 칫솔과 같은 친환경 제품을 구매합니다.",0],["He gives his family and friends these products as gifts.","그는 그의 가족과 친구들에게 이러한 제품을 선물로 줍니다.",0],["Seojun's green life teaches us a good lesson.","서준이의 친환경 생활은 우리에게 좋은 교훈을 가르쳐 줍니다.",1],["Like Seojun, we can make some simple changes in our everyday life.","서준이처럼, 우리는 우리의 일상생활에서 몇 가지 간단한 변화를 만들 수 있어요.",0],["Our small actions can make a big difference.","우리의 작은 행동이 큰 변화를 만들 수 있습니다.",0],["Let's do something to help the Earth now!","지구를 돕기 위해 지금 무언가를 합시다!",0]];var RNUM=72;var TITLE_EN="A Green Life for the World";var PASS_EN=["A Green Life for the World","Seojun is a middle school student. One day, he watched a video about polar bears in danger. He felt sorry for them, so he decided to do something. Now he does a lot of things to help the Earth. Let's learn about Seojun's green life.","Green Choices","Seojun always carries his bottle with him to drink water. He doesn't use paper cups. Also, Seojun doesn't use paper towels when he dries his hands in restrooms. He uses his own handkerchief.","Green Meals","Every weekend, Seojun's family has special meatless meals. Seojun's parents make him fresh salads with fruits and vegetables. He also enjoys delicious beans and mushrooms. The food comes from local farms, so it doesn't travel far.","Green Shopping","On Fridays, Seojun takes plastic bottles and cans to a zero waste shop. Then, he gets green points. With these points, Seojun buys green products like eco-bags and bamboo toothbrushes. He gives his family and friends these products as gifts.","Seojun's green life teaches us a good lesson. Like Seojun, we can make some simple changes in our everyday life. Our small actions can make a big difference. Let's do something to help the Earth now!"];var PASS_KO=["세상을 위한 친환경 생활","서준이는 중학생입니다. 어느 날, 그는 위험에 처한 북극곰에 관한 영상을 보았습니다. 그는 그들이 안타까웠고, 그래서 무언가를 하기로 결심했습니다. 이제 그는 지구를 돕기 위해 많은 것들을 해요. 서준이의 친환경 생활에 대해 알아봅시다.","환경 친화적인 선택","서준이는 물을 마시기 위해 항상 물병을 가지고 다닙니다. 그는 종이컵을 사용하지 않아요. 또한, 서준이는 화장실에서 손을 말릴 때 종이 타월을 사용하지 않습니다. 그는 자신의 손수건을 사용해요.","환경 친화적인 식사","매주 주말, 서준이의 가족은 고기 없는 특별한 식사를 합니다. 서준이의 부모님은 그에게 과일과 야채가 든 신선한 샐러드를 만들어 줍니다. 그는 또한 맛있는 콩과 버섯도 즐겨 먹어요. 그 음식들은 지역 농장에서 오는 것들이라, 멀리 이동하지 않습니다.","환경 친화적인 물건 구매","금요일마다, 서준이는 플라스틱 병과 캔을 제로 웨이스트 가게로 가지고 갑니다. 그러고 나서, 그는 친환경 포인트를 받습니다. 서준이는 이 포인트로 에코백이나 대나무 칫솔과 같은 친환경 제품을 구매합니다. 그는 그의 가족과 친구들에게 이러한 제품을 선물로 줍니다.","서준이의 친환경 생활은 우리에게 좋은 교훈을 가르쳐 줍니다. 서준이처럼, 우리는 우리의 일상생활에서 몇 가지 간단한 변화를 만들 수 있어요. 우리의 작은 행동이 큰 변화를 만들 수 있습니다. 지구를 돕기 위해 지금 무언가를 합시다!"];var DG=[{"qs":[{"n":1,"q":"위 대화를 읽고 답할 수 없는 질문을 고르면?","o":["When is the campaign?","Where will the campaign take place?","What will you do during the campaign?","What do you need for the campaign?","What can your small actions make?"],"a":3,"ans":"What do you need for the campaign?","evs":[["This weekend, there is a \"Go Green Campaign\" at the park.","이번 주말에 공원에서 \"Go Green 캠페인\"이 있습니다."],["Your small actions can make a great difference.","여러분의 작은 행동이 큰 변화를 만들 수 있습니다."]],"ev":["This weekend, there is a \"Go Green Campaign\" at the park.","이번 주말에 공원에서 \"Go Green 캠페인\"이 있습니다."],"ow":["답할 수 있음 ✕ — 'This weekend, there is a \"Go Green Campaign\"'(이번 주말에 \"Go Green 캠페인\"이 있습니다)라고 했으므로 캠페인이 언제인지(이번 주말)는 알 수 있어서 정답이 아님.","답할 수 있음 ✕ — 'at the park'(공원에서)라고 했으므로 캠페인 장소는 알 수 있어서 정답이 아님.","답할 수 있음 ✕ — 'We are going to pick up trash. Also, we're going to plant trees and flowers.'(쓰레기를 줍고 나무와 꽃을 심을 예정입니다.)라고 했으므로 할 일을 알 수 있어서 정답이 아님.","정답 ○(답할 수 없음) — 담화에는 준비물에 대한 언급이 전혀 없다. 'Join this campaign.'(이 캠페인에 참여하세요.)이라고만 해서 캠페인에 무엇이 필요한지는 알 수 없다.","답할 수 있음 ✕ — 'Your small actions can make a great difference.'(여러분의 작은 행동이 큰 변화를 rettier and more colorful.","Because digital invitations don't need paper.","Because more people can receive them.","Because they are cheaper."],"a":2,"ans":"Because digital invitations don't need paper.","evs":[["You can also send digital invitations to save paper.","종이를 아끼려고 디지털 초대장을 보내도 돼."]],"ev":["You can also send digital invitations to save paper.","종이를 아끼려고 디지털 초대장을 보내도 돼."],"ow":["오답 ✕ — 지호는 'send digital invitations to save paper'(종이를 아끼려고 디지털 초대장을 보내도 돼)라고 했는데, Jenny가 컴퓨터를 잘 쓴다는 말은 없어서 틀림.","오답 ✕ — 지호가 제안한 이유는 'to save paper'(종이를 아끼려고)이지, 더 예쁘고 화려해서가 아니라서 틀림.","정답 ○ — 'You can also send digital invitations to save paper.'(종이를 아끼려고 디지털 초대장을 보내도 돼.)라고 했으므로 디지털 초대장은 종이가 필요 없기 때문이다.","오답 ✕ — 'to save paper'(종이를 아끼려고)가 이유인데, 더 많은 사람이 받을 수 있다는 말은 대화에 없어서 틀림.","오답 ✕ — 'to save paper'(종이를 아끼려고)가 이유인데, 가격이 더 싸다는 말은 대화에 없어서 틀림."],"memo":["정답: 디지털 초대장은 종이가 필요 없기 때문이다.","근거: You can also send digital invitations to save paper.(종이를 아끼려고 디지털 초대장을 보내도 돼.)","함정: save paper가 이유이고, 가격이나 예쁨은 언급이 없다."],"why":"종이를 아끼려고 디지털 초대장을 제안했다."},{"n":4,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Jenny는 친환경 생일 파티를 열고자 한다.","Jenny의 생일 파티는 다음 주 토요일에 열린다.","지호는 플라스틱보다 유리 접시가 더 낫다고 생각한다.","Jenny는 친구들이 유리 접시와 자신의 병을 가져오는 게 좋겠다고 생각한다.","Jenny는 지호의 아이디어를 마음에 들어 한다."],"a":3,"ans":"Jenny는 친구들이 유리 접시와 자신의 병을 가져오는 게 좋겠다고 생각한다.","evs":[["Maybe my friends can prepare their own bottles.","어쩌면 친구들이 자기 물병을 준비할 수 있겠다."],["Well, you can use glass plates.","음, 유리 접시를 쓰면 돼."]],"ev":["Maybe my friends can prepare their own bottles.","어쩌면 친구들이 자기 물병을 준비할 수 있겠다."],"ow":["일치 ○ — Jenny가 'I'm going to have a green birthday party'(나 친환경 생일 파티를 할 거야)라고 했으므로 맞는 설명이다.","일치 ○ — Jenny가 'next Saturday'(다음 주 토요일)에 파티를 한다고 했으므로 맞는 설명이다.","일치 ○ — 지호가 'Those are better than plastic ones.'(그게 플라스틱 접시보다 더 좋아.)라고 했으므로 맞는 설명이다.","정답 ○(일치하지 않음) — 유리 접시는 지호가 제안한 것이고, Jenny는 'Maybe my friends can prepare their own bottles.'(어쩌면 친구들이 자기 물병을 준비할 수 있겠다.)라고만 했다. 친구들이 유리 접시를 가져온다는 말은 없어서 틀린 내용이다.","일치 ○ — Jenny가 'Good point! Thanks for the ideas.'(좋은 지적이야! 아이디어 고마워.)라고 했으므로 아이디어를 마음에 들어 한다."],"memo":["정답 ④: 친구들이 준비할 것은 유리 접시가 아니라 자기 물병뿐이다.","근거: Maybe my friends can prepare their own bottles.(어쩌면 친구들이 자기 물병을 준비할 수 있겠다.)","함정: 유리 접시는 지호의 제안이고, 친구들이 가져온다는 말은 없다."],"why":"친구들이 가져올 것은 물병뿐이므로 ④가 대화와 다르다."}],"dlg":[["G","Hey, Jiho. I'm going to have a green birthday party next Saturday. Can you give me some ideas?","안녕, 지호야. 나 다음 주 토요일에 친환경 생일 파티를 할 거야. 아이디어 좀 줄 수 있어?"],["B","Hi, Jenny. Well, you can use glass plates. Those are better than plastic ones.","안녕, Jenny. 음, 유리 접시를 쓰면 돼. 그게 플라스틱 접시보다 더 좋아."],["G","That's a good idea. Maybe my friends can prepare their own bottles.","좋은 생각이야. 어쩌면 친구들이 자기 물병을 준비할 수 있겠다."],["B","Yes! Then, you don't need any plastic cups.","맞아! 그러면 플라스틱 컵이 필요 없어."],["G","Sounds great!","좋은데!"],["B","You can also send digital invitations to save paper.","종이를 아끼려고 디지털 초대장을 보내도 돼."],["G","Good point! Thanks for the ideas.","좋은 지적이야! 아이디어 고마워."],["B","You're welcome. Have a great one!","천만에. 멋진 파티 해!"]]},{"qs":[{"n":5,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["The boy doesn't have his baseball glove.","The boy asks the girl for a baseball glove.","The girl helps the boy out.","The girl borrows a baseball glove.","The boy is thankful to the girl."],"a":3,"ans":"The girl borrows a baseball glove.","evs":[["Can you lend me yours?","네 것을 빌려줄 수 있어?"],["Sure. Here you go.","물론이지. 여기 있어."]],"ev":["Can you lend me yours?","네 것을 빌려줄 수 있어?"],"ow":["일치 ○ — 소년이 'I lost my baseball glove.'(내 야구 글러브를 잃어버렸어.)라고 했으므로 글러브가 없다는 설명이 맞다.","일치 ○ — 소년이 'Can you lend me yours?'(네 것을 빌려줄 수 있어?)라고 부탁했으므로 맞는 설명이다.","일치 ○ — 소녀가 'Sure. Here you go.'(물론이지. 여기 있어.)라며 글러브를 주었으므로 소년을 도와준 것이 맞다.","정답 ○(일치하지 않음) — 소녀는 글러브를 빌린 것이 아니라 'Can you lend me yours?'(네 것을 빌려줄 수 있어?)라는 부탁에 'Sure.'라고 하며 빌려준 것이다. lend(빌려주다)와 borrow(빌리다)를 바꿔서 틀린 내용이다.","일치 ○ — 소년이 'Thanks.'(고마워.)라고 했으므로 고마워한다는 설명이 맞다."],"memo":["정답 ④: 소녀가 글러브를 빌린 게 아니라 빌려준 것이다.","근거: Can you lend me yours? / Sure. Here you go.(네 것을 빌려줄 수 있어? / 물론이지. 여기 있어.)","함정: lend는 '빌려주다', borrow는 '빌리다'이다."],"why":"소녀는 글러브를 빌려준 사람이므로 ④가 틀린 내용이다."}],"dlg":[["B","Oh, I lost my baseball glove. Can you lend me yours?","아, 내 야구 글러브를 잃어버렸어. 네 것을 빌려줄 수 있어?"],["G","Sure. Here you go.","물론이지. 여기 있어."],["B","Thanks.","고마워."]]}];var BG=[{"qs":[{"n":6,"q":"서준이가 지구를 돕기 위해 무언가를 하기로 결심한 계기로 알맞은 것은?","o":["위험에 처한 북극곰에 관한 영상을 보았다.","환경 캠페인에 참가했다.","학교에서 환경 수업을 들었다.","친구에게 에코백을 선물 받았다.","부모님이 환경을 지키라고 부탁했다."],"a":0,"ans":"위험에 처한 북극곰에 관한 영상을 보았다.","evs":[["One day, he watched a video about polar bears in danger.","어느 날, 그는 위험에 처한 북극곰에 관한 영상을 보았습니다."],["He felt sorry for them, so he decided to do something.","그는 그들이 안타까웠고, 그래서 무언가를 하기로 결심했습니다."]],"ev":["One day, he watched a video about polar bears in danger.","어느 날, 그는 위험에 처한 북극곰에 관한 영상을 보았습니다."],"ow":["정답 ○ — 'One day, he watched a video about polar bears in danger.'(어느 날, 그는 위험에 처한 북극곰에 관한 영상을 보았습니다.)에 이어 'He felt sorry for them, so he decided to do something.'(그들이 안타까워 무언가를 하기로 결심했습니다.)이라고 했으므로 영상이 계기이다.","오답 ✕ — 본문에는 'he watched a video'(영상을 보았다)라고 했을 뿐, 캠페인에 참가했다는 언급이 없어서 틀림.","오답 ✕ — 본문에서 결심한 계기는 'a video about polar bears in danger'(위험에 처한 북극곰 영상)이고, 학교 수업 이야기는 없어서 틀림.","오답 ✕ — 에코백은 서준이가 나중에 포인트로 사는 제품일 뿐, 선물 받았다는 언급은 없어서 틀림. 계기는 'watched a video'(영상을 보았다)이다.","오답 ✕ — 'he decided to do something'(그는 무언가를 하기로 결심했습니다)이라고 했으므로 스스로 결심한 것이고, 부모님의 부탁은 언급이 없어서 틀림."],"memo":["정답: 위험에 처한 북극곰 영상을 보고 무언가를 하기로 결심했다.","근거: He felt sorry for them, so he decided to do something.(그는 그들이 안타까워 무언가를 하기로 결심했습니다.)","함정: in danger는 '위험에 처한'이라는 뜻이다."],"why":"북극곰 영상이 서준이가 친환경 생활을 시작한 계기이다."}],"pp":[["Seojun is a middle school student.","서준이는 중학생입니다."],["One day, he watched a video about polar bears in danger.","어느 날, 그는 위험에 처한 북극곰에 관한 영상을 보았습니다."],["He felt sorry for them, so he decided to do something.","그는 그들이 안타까웠고, 그래서 무언가를 하기로 결심했습니다."],["Now he does a lot of things to help the Earth.","이제 그는 지구를 돕기 위해 많은 것들을 해요."],["Let's learn about Seojun's green life.","서준이의 친환경 생활에 대해 알아봅시다."]]},{"qs":[{"n":7,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["bottle - handkerchief","bottle - towel","cup - handkerchief","bag - napkin","straw - tissue"],"a":0,"ans":"bottle - handkerchief","evs":[["Seojun always carries his bottle with him to drink water.","서준이는 물을 마시기 위해 항상 물병을 가지고 다닙니다."],["He uses his own handkerchief.","그는 자신의 손수건을 사용해요."]],"ev":["Seojun always carries his bottle with him to drink water.","서준이는 물을 마시기 위해 항상 물병을 가지고 다닙니다."],"ow":["정답 ○ — 'Seojun always carries his bottle with him to drink water.'(서준이는 물을 마시기 위해 항상 물병을 가지고 다닙니다.)와 'He uses his own handkerchief.'(그는 자신의 손수건을 사용해요.)이므로 bottle과 handkerchief가 맞다.","오답 ✕ — bottle은 맞지만, 본문에는 'Seojun doesn't use paper towels'(종이 타월을 쓰지 않는다)라고 하고 'his own handkerchief'(자신의 손수건)를 쓴다고 했으므로 towel은 틀림.","오답 ✕ — 본문에는 'carries his bottle'(물병을 가지고 다닌다)이라고 했는데 cup은 종이컵을 쓰지 않는다는 'He doesn't use paper cups.'(종이컵을 사용하지 않아요.)와 맞지 않아 틀림.","오답 ✕ — 본문에는 'carries his bottle'(물병을 가지고 다닌다)이라고 했는데 가방(bag)은 나오지 않고, napkin도 언급이 없어서 틀림. 가방은 에코백을 구매하는 장면에만 나온다.","오답 ✕ — 본문에는 'carries his bottle'(물병을 가지고 다닌다)과 'his own handkerchief'(자신의 손수건)라고 했는데 straw와 tissue는 언급이 없어 틀림."],"memo":["정답: 서준이는 자기 bottle과 handkerchief를 쓴다.","근거: He uses his own handkerchief.(그는 자신의 손수건을 사용해요.)","함정: paper towels를 쓰지 않는 대신 handkerchief를 쓴다."],"why":"서준이는 종이컵 대신 물병, 종이 타월 대신 손수건을 쓴다.","sum":"Instead of paper cups and paper towels, Seojun carries his own (A) and uses his own (B).","lab":"완성된 요약문 : "},{"n":8,"q":"Green Meals에 대한 설명으로 일치하지 않는 것은?","o":["서준이의 가족은 주말마다 고기 없는 식사를 한다.","부모님은 서준이에게 과일과 야채가 든 샐러드를 만들어 준다.","서준이는 콩과 버섯도 즐겨 먹는다.","음식들은 지역 농장에서 온다.","음식들은 먼 나라에서 배로 들어온다."],"a":4,"ans":"음식들은 먼 나라에서 배로 들어온다.","evs":[["The food comes from local farms, so it doesn't travel far.","그 음식들은 지역 농장에서 오는 것들이라, 멀리 이동하지 않습니다."]],"ev":["The food comes from local farms, so it doesn't travel far.","그 음식들은 지역 농장에서 오는 것들이라, 멀리 이동하지 않습니다."],"ow":["일치 ○ — 'Every weekend, Seojun's family has special meatless meals.'(매주 주말, 서준이의 가족은 고기 없는 특별한 식사를 합니다.)라고 했으므로 맞는 설명이다.","일치 ○ — 'Seojun's parents make him fresh s  if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){

 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';

function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';

function dlgHtml(d,lock){

 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});

function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}

  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}

});

var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;

 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
