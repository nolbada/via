var D=[{"n":1,"tag":null,"en":"Last weekend, I taked a day trip to Ganghwado with me family. Ganghwado is a island with a rich history and beautiful nature.","ko":"지난 주말에 나는 가족들과 강화도에 당일치기 여행을 갔다. 강화도는 풍부한 역사와 아름다운 자연을 지닌 섬이다.","ok":false,"foot":[],"fixes":[{"wrong":"taked","right":"took","partial":false,"at":[3],"point":"불규칙 과거형: take의 과거형은 took 사용","topic":"불규칙 과거형","memo":"take의 과거형은 took 사용"},{"wrong":"me","right":"my","partial":false,"at":[10],"point":"인칭대명사의 소유격: 명사 family 앞에는 소유격 my 사용","topic":"인칭대명사의 소유격","memo":"명사 family 앞에는 소유격 my 사용"},{"wrong":"a","right":"an","partial":false,"at":[14],"point":"관사 a/an: island는 모음 소리라 an 사용","topic":"관사 a/an","memo":"island는 모음 소리라 an 사용"}]},{"n":2,"tag":"초지진","en":"Our first stop was Chojijin. In the 19th century, Joseon have battles against France, the U.S., and Japan here.","ko":"우리가 처음으로 들른 곳은 초지진이었다. 19세기에 조선은 이곳에서 프랑스, 미국, 일본에 대항하여 전투를 벌였다.","ok":false,"foot":[],"fixes":[{"wrong":"have","right":"had","partial":false,"at":[10],"point":"과거 시제: 19세기는 과거 시점: had (have 아님)","topic":"과거 시제","memo":"19세기는 과거 시점: had (have 아님)"}]},{"n":3,"tag":null,"en":"The cannon in the picture is from the old days. There were even cannon ball marks on the stone walls and trees.","ko":"사진 속의 대포는 그 시절의 것이다. 석벽과 나무에는 대포알 자국도 있었다.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"What a historic places it is!","ko":"이곳은 얼마나 역사적인 장소인가!","ok":false,"foot":[],"fixes":[{"wrong":"places","right":"place","partial":false,"at":[3],"point":"감탄문: What a 뒤에는 단수명사 place 사용","topic":"감탄문","memo":"What a 뒤에는 단수명사 place 사용"}]},{"n":5,"tag":"강화 고인돌","en":"Next, we visited Ganghwa Bugeunri Goindol. It is the most large stone tomb on Ganghwado.","ko":"다음으로 우리는 강화 부근리 고인돌에 갔다. 그것은 강화도에서 가장 큰 돌무덤이다.","ok":false,"foot":[],"fixes":[{"wrong":"most large","right":"largest","partial":false,"at":[9],"point":"최상급: large의 최상급은 the largest 사용","topic":"최상급","memo":"large의 최상급은 the largest 사용"}]},{"n":6,"tag":null,"en":"It are about 3,000 years old. It looks lik  trip came to an end with a beautiful sunset. I think I will never forgot this trip.","ko":"우리의 여행은 아름다운 일몰과 함께 끝이 났다. 나는 이 여행을 잊지 못할 것 같다.","ok":false,"foot":[],"fixes":[{"wrong":"forgot","right":"forget","partial":false,"at":[15],"point":"조동사: 조동사 will 뒤에는 동사원형: forget (forgot 아님)","topic":"조동사","memo":"조동사 will 뒤에는 동사원형: forget (forgot 아님)"}]}];var PP=[["Last weekend, I took a day trip to Ganghwado with my family.","지난 주말에 나는 가족들과 강화도에 당일치기 여행을 갔다.",1],["Ganghwado is an island with a rich history and beautiful nature.","강화도는 풍부한 역사와 아름다운 자연을 지닌 섬이다.",0],["Chojijin","초지진",1],["Our first stop was Chojijin.","우리가 처음으로 들른 곳은 초지진이었다.",1],["In the 19th century, Joseon had battles against France, the U.S., and Japan here.","19세기에 조선은 이곳에서 프랑스, 미국, 일본에 대항하여 전투를 벌였다.",0],["The cannon in the picture is from the old days.","사진 속의 대포는 그 시절의 것이다.",0],["There were even cannon ball marks on the stone walls and trees.","석벽과 나무에는 대포알 자국도 있었다.",0],["What a historic place it is!","이곳은 얼마나 역사적인 장소인가!",0],["Ganghwa Bugeunri Goindol","강화 부근리 고인돌",1],["Next, we visited Ganghwa Bugeunri Goindol.","다음으로 우리는 강화 부근리 고인돌에 갔다.",1],["It is the largest stone tomb on Ganghwado.","그것은 강화도에서 가장 큰 돌무덤이다.",0],["It is about 3,000 years old.","그것은 약 3,000년이 되었다.",0],["It looks like a big table.","그것은 큰 탁자처럼 생겼다.",0],["The cover stone is heavier than 50 cars!","고인돌의 덮개돌은 자동차 50대보다도 더 무겁다!",0],["How could people move such a big stone so long ago?","그렇게 오래전에 사람들은 어떻게 그렇게 큰 돌을 옮길 수 있었을까?",0],["Dongmak Beach","동막 해변",1],["Our last stop was Dongmak Beach.","우리가 마지막으로 들른 곳은 동막 해변이었다.",1],["I heard that this beach has one of the largest mud flats in the world.","내가 듣기로 이 해변은 세계에서 가장 넓은 갯벌 중 하나를 갖고 있다.",0],["Luckily, we saw a wide mud flat that day.","운 좋게도 우리는 그날 넓은 갯벌을 보았다.",0],["I took off my shoes and felt the mud.","나는 신발을 벗고 갯벌을 느껴 보았다.",0],["A few small crabs walked by my feet.","작은 게 몇 마리가 내 발 옆을 걸어갔다.",0],["Our trip came to an end with a beautiful sunset.","우리의 여행은 아름다운 일몰과 함께 끝이 났다.",1],["I think I will never forget this trip.","나는 이 여행을 잊지 못할 것 같다.",0]];var RNUM=48;var TITLE_EN="My Trip to Ganghwado";var PASS_EN=["My Trip to Ganghwado","Last weekend, I took a day trip to Ganghwado with my family. Ganghwado is an island with a rich history and beautiful nature.","Chojijin","Our first stop was Chojijin. In the 19th century, Joseon had battles against France, the U.S., and Japan here. The cannon in the picture is from the old days. There were even cannon ball marks on the stone walls and trees. What a historic place it is!","Ganghwa Bugeunri Goindol","Next, we visited Ganghwa Bugeunri Goindol. It is the largest stone tomb on Ganghwado. It is about 3,000 years old. It looks like a big table. The cover stone is heavier than 50 cars! How could people move such a big stone so long ago?","Dongmak Beach","Our last stop was Dongmak Beach. I heard that this beach has one of the largest mud flats in the world. Luckily, we saw a wide mud flat that day. I took off my shoes and felt the mud. A few small crabs walked by my feet.","Our trip came to an end with a beautiful sunset. I think I will never forget this trip."];var PASS_KO=["나의 강화도 여행","지난 주말에 나는 가족들과 강화도에 당일치기 여행을 갔다. 강화도는 풍부한 역사와 아름다운 자연을 지닌 섬이다.","초지진","우리가 처음으로 들른 곳은 초지진이었다. 19세기에 조선은 이곳에서 프랑스, 미국, 일본에 대항하여 전투를 벌였다. 사진 속의 대포는 그 시절의 것이다. 석벽과 나무에는 대포알 자국도 있었다. 이곳은 얼마나 역사적인 장소인가!","강화 부근리 고인돌","다음으로 우리는 강화 부근리 고인돌에 갔다. 그것은 강화도에서 가장 큰 돌무덤이다. 그것은 약 3,000년이 되었다. 그것은 큰 탁자처럼 생겼다. 고인돌의 덮개돌은 자동차 50대보다도 더 무겁다! 그렇게 오래전에 사람들은 어떻게 그렇게 큰 돌을 옮길 수 있었을까?","동막 해변","우리가 마지막으로 들른 곳은 동막 해변이었다. 내가 듣기로 이 해변은 세계에서 가장 넓은 갯벌 중 하나를 갖고 있다. 운 좋게도 우리는 그날 넓은 갯벌을 보았다. 나는 신발을 벗고 갯벌을 느껴 보았다. 작은 게 몇 마리가 내 발 옆을 걸어갔다.","우리의 여행은 아름다운 일몰과 함께 끝이 났다. 나는 이 여행을 잊지 못할 것 같다."];var DG=[{"qs":[{"n":1,"q":"다음 대화의 주제로 알맞은 것은?","o":["sales of local food","the beauty of Sokcho","the girl's weekend trip","the boy's favorite local foods","famous tourist sites in Sokcho"],"a":2,"ans":"the girl's weekend trip","evs":[["I'm going to go to Sokcho this weekend.","나는 이번 주 arks\"(대포알 자국)라고 했는데 이 보기는 그림(paintings)이라고 해서 틀림.","오답 ✕ — 본문에는 \"Joseon had battles against France, the U.S., and Japan\"(조선은 프랑스, 미국, 일본과 전투를 벌였다)이라고 했는데 이 보기는 대화(talks)라고 하고, 벽에 있는 것도 대포알 자국이지 대포가 아니라서 둘 다 틀림.","오답 ✕ — 본문에는 \"Joseon had battles\"(조선은 전투를 벌였다)이라고 했는데 이 보기는 무역(trades)이라고 하고, 벽과 나무에 있는 것도 뿌리(roots)가 아니라 대포알 자국이라서 둘 다 틀림."],"memo":["정답 ①: battles(전투) - marks(자국)","근거: Joseon had battles against France, the U.S., and Japan here. / cannon ball marks(조선은 이곳에서 전투를 벌였다. / 대포알 자국)","함정: (A)만 맞고 (B)가 틀린 ③ paintings에 주의 ✕"],"why":"초지진은 조선이 외국과 전투를 벌인 곳으로, 대포알 자국이 남아 있다.","sum":"At Chojijin, Joseon had (A)________ against France, the U.S., and Japan, and there are still cannon ball (B)________ on the stone walls and trees.","lab":"완성된 요약문 : "},{"n":8,"q":"윗글의 동막 해변(Dongmak Beach)에 관한 내용과 일치하는 것은?","o":["동막 해변은 여행의 첫 번째 방문지였다.","동막 해변에는 세계에서 가장 작은 갯벌이 있다고 한다.","글쓴이는 신발을 신은 채로 갯벌을 걸었다.","작은 게 몇 마리가 글쓴이의 발 옆을 걸어갔다.","글쓴이는 해변에서 일몰을 보지 못했다."],"a":3,"ans":"작은 게 몇 마리가 글쓴이의 발 옆을 걸어갔다.","evs":[["A few small crabs walked by my feet.","작은 게 몇 마리가 내 발 옆을 걸어갔다."]],"ev":["A few small crabs walked by my feet.","작은 게 몇 마리가 내 발 옆을 걸어갔다."],"ow":["오답 ✕ — 본문에는 \"Our last stop was Dongmak Beach.\"(우리가 마지막으로 들른 곳은 동막 해변이었다.)라고 했는데 이 보기는 첫 번째 방문지라고 해서 틀림.","오답 ✕ — 본문에는 \"this beach has one of the largest mud flats in the world\"(이 해변은 세계에서 가장 넓은 갯벌 중 하나를 갖고 있다)라고 했는데 이 보기는 가장 작은 갯벌이라고 해서 틀림.","오답 ✕ — 본문에는 \"I took off my shoes and felt the mud.\"(나는 신발을 벗고 갯벌을 느껴 보았다.)라고 했는데 이 보기는 신발을 신은 채라고 해서 틀림.","정답 ○ — \"A few small crabs walked by my feet.\"(작은 게 몇 마리가 내 발 옆을 걸어갔다.)라고 했으므로 맞음.","오답 ✕ — 본문에는 \"Our trip came to an end with a beautiful sunset.\"(우리의 여행은 아름다운 일몰과 함께 끝이 났다.)라고 했는데 이 보기는 일몰을 보지 못했다고 해서 틀림."],"memo":["정답 ④: 작은 게 몇 마리가 글쓴이의 발 옆을 걸어갔다.","근거: A few small crabs walked by my feet.(작은 게 몇 마리가 내 발 옆을 걸어갔다.)","함정: ① 동막 해변은 첫 번째가 아니라 '마지막'(last) 방문지 ✕"],"why":"동막 해변은 마지막 방문지로, 갯벌에서 작은 게들을 만났다."},{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["글쓴이는 초지진에서 대포를 쏘았다.","글쓴이는 동막 해변을 먼저 방문했다." document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
