<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩그라피 4 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"rg4-01-1","no":1,"ko":"벌에게는 주사 대신 이걸 먹인다고?","items":[{"n":1,"t":"tf","q":"Honeybees are important because they help plants produce fruits and seeds.","ko":"꿀벌들은 식물이 열매와 씨앗을 만들도록 돕기 때문에 중요하다.","r":{"ev":"1번 문장","s":[[1,"Honeybees are important insects because they help plants produce fruits and seeds.","꿀벌들은 식물이 열매와 씨앗을 생산하도록 돕기 때문에 중요한 곤충이다."]],"w":"1번 문장에 because they help plants produce fruits and seeds가 그대로 나옴. 식물이 열매와 씨앗을 만들도록 돕는다는 것이 꿀벌이 중요한 이유라서 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"61b7f9fc53"},{"n":2,"t":"tf","q":"Bees get a shot to protect themselves from the disease.","ko":"벌들은 그 질병으로부터 자신들을 보호하기 위해 주사를 맞는다.","r":{"ev":"6번 문장","s":[[6,"Instead of giving the bees a shot, the medicine is mixed into the queen bee’s food.","벌들에게 주사를 놓는 대신에, 약이 여왕벌의 먹이에 섞인다."]],"w":"6번 문장은 Instead of giving the bees a shot(벌들에게 주사를 놓는 대신에)이라고 함. 주사를 놓지 않고 약을 여왕벌의 먹이에 섞는 방식이라서 틀린 내용.","a":"F (본문과 다른 내용)","c":"F"},"h":"c58527ddec"},{"n":3,"t":"tf","q":"Bees are disappearing only because of a bacterial disease.","ko":"벌들은 오직 박테리아 질병 때문에 사라지고 있다.","r":{"ev":"9번 문장","s":[[9,"The bees are very important for the world’s food production, but they are disappearing due to losing their homes, climate change, and pesticides, in addition to a bacterial disease.","벌들은 세계의 식량 생산에 매우 중요하지만, 박테리아 질병뿐만 아니라 서식지를 잃는 것, 기후 변화, 그리고 살충제 때문에 사라지고 있다."]],"w":"9번 문장에서 벌들은 서식지를 잃는 것, 기후 변화, 살충제 때문에 사라지고 있고 박테리아 질병은 in addition to(~에 더하여)로 덧붙은 이유임. '오직(only)'이 틀림.","a":"F (본문과 다른 내용)","c":"F"},"h":"59ac76c5dd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In fact, honeybees are responsible for about one-third of the food crops in the U.S.)","ko":"(실제로, 꿀벌들은 미국에서 식량작물의 약 3분의 1에 responsible하다.)","opts":["책임이 있는","관계없는","두려운","자랑스러운"],"word":"responsible","r":{"ev":"2번 문장","s":[[2,"In fact, honeybees are responsible for about one-third of the food crops in the U.S.","실제로, 꿀벌들은 미국에서 식량작물의 약 3분의 1을 책임진다."]],"w":"2번 문장은 꿀벌이 식량작물의 약 3분의 1을 맡고 있다는 뜻. be responsible for = ~에 책임이 있다. 관계없는은 반대 방향이라 틀림.","a":"1) 책임이 있는","c":1},"h":"243624d50a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…but they are disappearing due to losing their homes, climate change, and pesticides…)","ko":"(…하지만 그것들은 서식지를 잃는 것, 기후 변화, 살충제 때문에 disappearing하고 있다…)","opts":["늘어나고 있는","도착하고 있는","사라지고 있는","자라고 있는"],"word":"disappearing","r":{"ev":"9번 문장","s":[[9,"The bees are very important for the world’s food production, but they are disappearing due to losing their homes, climate change, and pesticides, in addition to a bacterial disease.","벌들은 세계의 식량 생산에 매우 중요하지만, 박테리아 질병뿐만 아니라 서식지를 잃는 것, 기후 변화, 그리고 살충제 때문에 사라지고 있다."]],"w":"9번 문장은 집을 잃고, 기후가 변하고, 살충제 때문에 벌이 점점 없어진다는 내용. disappear = 사라지다. 늘어나거나 자란다면 이유가 나쁜 일들과 맞지 않음.","a":"3) 사라지고 있는","c":3},"h":"98dd0bf124"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nWhen the queen eats it, the medicine goes into her eggs, and helps to protect other bees from the disease.","ko":"밑줄 친 her가 가리키는 것은?","sko":"여왕벌이 그것을 먹으면, 약이 그녀의 알들에 들어가고, 다른 벌들을 그 질병으로부터 보호하는 것을 돕는다.","opts":["한 회사","여왕벌","다른 벌들","식물들"],"r":{"ev":"6~7번 문장","s":[[6,"Instead of giving the bees a shot, the medicine is mixed into the queen bee’s food.","벌들에게 주사를 놓는 대신에, 약이 여왕벌의 먹이에 섞인다."],[7,"When the queen eats it, the medicine goes into her eggs, and helps to protect other bees from the disease.","여왕벌이 그것을 먹으면, 약이 그녀의 알들에 들어가고, 다른 벌들을 그 질병으로부터 보호하는 것을 돕는다."]],"w":"6번에서 약은 여왕벌(the queen bee)의 먹이에 섞임. 7번 When the queen eats it에서 먹는 주체가 여왕벌이고, 약이 들어가는 her eggs는 그 여왕벌의 알임.","a":"2) 여왕벌","c":2},"h":"57dc1615e4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The vaccine was introduced at the right moment for honeybees.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 백신은 꿀벌들을 위해 제때 도입되었다.","opts":["그 백신은 꿀벌들에게 딱 알맞은 때에 도입되었다.","그 백신은 꿀벌들이 모두 사라진 뒤에 도입되었다.","그 백신은 꿀벌들에게 너무 늦게 도입되었다.","그 백신은 꿀벌이 아닌 다른 곤충을 위해 도입되었다."],"r":{"ev":"8번 문장","s":[[8,"The vaccine was introduced at the right moment for honeybees.","그 백신은 꿀벌들을 위해 제때 도입되었다."]],"w":"at the right moment는 '딱 알맞은 때에'라는 뜻. 백신이 꿀벌들에게 제때 도입되었다는 말임. 사라진 뒤나 너무 늦게, 다른 곤충을 위해서라는 말은 본문에 없음.","a":"1) 그 백신은 꿀벌들에게 딱 알맞은 때에 도입되었다.","c":1},"h":"55dcdf4c52"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["한 학교가 벌들을 지키기 위해 백신을 개발했다.","한 회사가 벌들을 지키기 위해 백신을 개발했다.","한 회사가 벌들을 위한 백신 만드는 것을 멈췄다.","한 회사가 식물들을 지키기 위해 백신을 개발했다."],"opts":["A school developed a vaccine to protect the bees.","A company developed a vaccine to protect the bees.","A company stopped making the vaccine for the bees.","A company developed a vaccine to protect the plants."],"r":{"ev":"5번 문장","s":[[5,"So, a company developed a vaccine to protect the bees!","그래서 한 회사는 벌들을 지키기 위해 백신을 개발했다!"]],"w":"5번 문장에 a company developed a vaccine to protect the bees가 나옴. 개발한 곳은 회사이고 지키려는 대상은 벌들이라서 ②가 맞음.","a":"2) A company developed a vaccine to protect the bees. (한 회사가 벌들을 지키기 위해 백신을 개발했다.)","c":2},"h":"1a458251f6"},{"n":9,"t":"sum","q":"Many bees are (A) from a bacterial disease, and the disease can (B) large bee families.","ko":"많은 벌이 박테리아 질병으로 (A), 그 질병은 큰 벌 집단을 (B) 수 있다.","oko":["(A) 즐기고 있다 / (B) 파괴하다","(A) 시달리고 있다 / (B) 보호하다","(A) 즐기고 있다 / (B) 보호하다","(A) 벗어나고 있다 / (B) 먹이를 주다","(A) 시달리고 있다 / (B) 파괴하다"],"opts":["(A) enjoying / (B) destroy","(A) suffering / (B) protect","(A) enjoying / (B) protect","(A) escaping / (B) feed","(A) suffering / (B) destroy"],"r":{"ev":"3~4번 문장","s":[[3,"However, many bees are suffering from a bacterial disease.","그러나, 많은 벌이 박테리아 질병으로 시달리고 있다."],[4,"This disease can destroy large bee families with about 60,000 bees.","이 질병은 약 6만 마리의 대형 벌 집단을 파괴할 수 있다."]],"w":"3번 문장 many bees are suffering from a bacterial disease에서 (A)는 suffering(시달리다). 4번 문장 This disease can destroy large bee families에서 (B)는 destroy(파괴하다). 즐기거나 벗어난다는 말은 본문과 반대임.","a":"5) (A) suffering / (B) destroy ((A) 시달리고 있다 / (B) 파괴하다)","c":5},"h":"8b7b30e594"},{"n":10,"t":"fill","q":"Thanks to the vaccine, more bees can [A] their important work of spreading pollen and producing [B].","ko":"백신 덕분에, 더 많은 벌이 꽃가루를 퍼뜨리고 [B]을(를) 만들어 내는 중요한 일을 [A] 수 있다.","bank":["continue","honey","large","bacterial","mixed","introduced"],"bko":{"continue":"계속하다","honey":"꿀","large":"큰","bacterial":"박테리아의","mixed":"섞인(mix의 과거분사)","introduced":"도입된(introduce의 과거분사)"},"r":{"ev":"10번 문장","s":[[10,"Thanks to the vaccine, more bees can continue their important work of spreading pollen and producing honey.","백신 덕분에, 더 많은 벌이 꽃가루를 퍼뜨리고 꿀을 만들어 내는 중요한 일을 계속할 수 있다."]],"w":"10번 문장 more bees can continue their important work of spreading pollen and producing honey에서 [A]는 continue, [B]는 honey. 나머지는 형용사나 과거분사라서 can 뒤나 producing 뒤에 들어갈 수 없음.","a":"[A] continue (계속하다), [B] honey (꿀)","c":null},"h":"5fee66e78d"}]},{"u":1,"id":"rg4-01-2","no":2,"ko":"색맹인 사람도 가을 단풍을 볼 수 있게!","items":[{"n":1,"t":"tf","q":"Tennessee installed special viewfinders in 12 places in 2017.","ko":"테네시주는 2017년에 12곳에 특별한 뷰파인더를 설치했다.","r":{"ev":"6번 문장","s":[[6,"In 2017, the state installed special viewfinders in 12 places.","2017년, 그 주(州)는 12곳에 특별한 뷰파인더들을 설치했다."]],"w":"6번 문장에 In 2017, the state installed special viewfinders in 12 places가 그대로 나옴. 연도, 설치한 것, 장소 수가 모두 맞음.","a":"T (본문과 맞는 내용)","c":"T"},"h":"46b1de097e"},{"n":2,"t":"tf","q":"Van Lew became colorblind when she was a teenager.","ko":"Van Lew는 십 대 때 색맹이 되었다.","r":{"ev":"8번 문장","s":[[8,"Van Lew, who has been colorblind her whole life, looked through one of these special viewfinders.","Van Lew는 평생 색맹이었는데, 그녀는 이 특별한 뷰파인더 중 하나를 통해 바라보았다."]],"w":"8번 문장에서 Van Lew는 has been colorblind her whole life, 즉 평생 색맹이었음. 십 대에 색맹이 되었다는 말은 본문에 없음.","a":"F (본문과 다른 내용)","c":"F"},"h":"80f4fa4f3d"},{"n":3,"t":"tf","q":"Tennessee hopes that more viewfinders will be available across the country.","ko":"테네시주는 전국에서 더 많은 뷰파인더를 이용할 수 있게 되기를 바란다.","r":{"ev":"12번 문장","s":[[12,"Tennessee hopes that more viewfinders will be available across the country.","테네시주는 전국에 걸쳐 더 많은 뷰파인더가 이용할 수 있게 되기를 바란다."]],"w":"12번 문장에 Tennessee hopes that more viewfinders will be available across the country가 그대로 나옴. 전국에 퍼지기를 바란다는 뜻이라서 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"99115d0411"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 2017, the state installed special viewfinders in 12 places.)","ko":"(2017년, 그 주는 12곳에 특별한 뷰파인더들을 installed했다.)","opts":["없앴다","설치했다","빌렸다","팔았다"],"word":"installed","r":{"ev":"6번 문장","s":[[6,"In 2017, the state installed special viewfinders in 12 places.","2017년, 그 주(州)는 12곳에 특별한 뷰파인더들을 설치했다."]],"w":"6번 문장은 특별한 뷰파인더를 12곳에 놓았다는 내용. install = 설치하다. 11번의 was installed(설치되었다)와 같은 단어임.","a":"2) 설치했다","c":2},"h":"fb11a5b10f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Tennessee hopes that more viewfinders will be available across the country.)","ko":"(테네시주는 전국에 걸쳐 더 많은 뷰파인더가 available하기를 바란다.)","opts":["위험한","비싼","특별한","이용할 수 있는"],"word":"available","r":{"ev":"12번 문장","s":[[12,"Tennessee hopes that more viewfinders will be available across the country.","테네시주는 전국에 걸쳐 더 많은 뷰파인더가 이용할 수 있게 되기를 바란다."]],"w":"12번 문장은 뷰파인더가 전국으로 늘어나 누구나 쓸 수 있게 되기를 바란다는 뜻. available = 이용할 수 있는. 비싼이나 위험한은 문맥에 맞지 않음.","a":"4) 이용할 수 있는","c":4},"h":"79f5ac777c"},{"n":6,"t":"ref","q":"What does the underlined \"these colors\" refer to?\nRed-green color blindness is the most common type, and these viewfinders help people see the difference between these colors more clearly.","ko":"밑줄 친 these colors가 가리키는 것은?","sko":"적록색맹은 가장 흔한 유형인데, 이 뷰파인더들은 사람들이 이 색들의 차이를 더 분명하게 보도록 도와준다.","pron":"these colors","opts":["빨간색과 초록색","노란색과 주황색","가을 잎들과 하늘","12곳의 장소"],"r":{"ev":"7번 문장","s":[[7,"Red-green color blindness is the most common type, and these viewfinders help people see the difference between these colors more clearly.","적록색맹은 가장 흔한 유형인데, 이 뷰파인더들은 사람들이 이 색들의 차이를 더 분명하게 보도록 도와준다."]],"w":"7번 문장 맨 앞 Red-green color blindness(적록색맹)에서 Red-green은 빨간색과 초록색. 뒤의 these colors는 바로 그 색들을 가리킴.","a":"1) 빨간색과 초록색","c":1,"k":"these colors = 빨간색과 초록색"},"h":"29511cd5e8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Imagine that they saw these colors for the first time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들이 처음으로 이 색들을 본다고 상상해 보라.","opts":["그들이 이 색들을 처음으로 볼 수 있게 된다면 어떨지 상상해 보라.","그들이 이 색들을 처음 보았던 때를 떠올려 보라.","그들이 이 색들을 이미 여러 번 보았다고 상상해 보라.","그들이 이 색들을 처음 본 뒤 크게 실망했다고 상상해 보라."],"r":{"ev":"1~2번 문장","s":[[1,"People with color blindness cannot experience the beautiful colors of fall leaves.","색맹이 있는 사람들은 가을 잎들의 아름다운 색들을 경험할 수 없다."],[2,"Imagine that they saw these colors for the first time.","그들이 처음으로 이 색들을 본다고 상상해 보라."]],"w":"1번에서 색맹인 사람들은 가을 색을 경험할 수 없다고 했으므로, 2번의 saw는 실제 과거가 아니라 '본다면 어떨까' 하는 상상임. 이미 보았다거나 실망했다는 말은 없음.","a":"1) 그들이 이 색들을 처음으로 볼 수 있게 된다면 어떨지 상상해 보라.","c":1},"h":"9547ce021e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Van Lew는 짧은 기간 동안만 색맹이었다.","테네시주는 2023년에 특별한 뷰파인더를 마련했다.","적록색맹은 흔한 유형이 아니다.","2023년에 버지니아주의 한 공원에도 뷰파인더가 마련되었다."],"opts":["Van Lew was colorblind only for a short time.","Tennessee set up special viewfinders in 2023.","Red-green color blindness is not a common type.","A viewfinder was also set up at a park in Virginia in 2023."],"r":{"ev":"6, 7, 8, 11번 문장","s":[[6,"In 2017, the state installed special viewfinders in 12 places.","2017년, 그 주(州)는 12곳에 특별한 뷰파인더들을 설치했다."],[7,"Red-green color blindness is the most common type, and these viewfinders help people see the difference between these colors more clearly.","적록색맹은 가장 흔한 유형인데, 이 뷰파인더들은 사람들이 이 색들의 차이를 더 분명하게 보도록 도와준다."],[8,"Van Lew, who has been colorblind her whole life, looked through one of these special viewfinders.","Van Lew는 평생 색맹이었는데, 그녀는 이 특별한 뷰파인더 중 하나를 통해 바라보았다."],[11,"Tennessee was the only state with colorblind viewfinders, but in 2023, a viewfinder was also installed at a park in Virginia.","테네시주는 색맹을 위한 뷰파인더들이 있는 유일한 주였지만, 2023년에는 버지니아주의 한 공원에도 뷰파인더가 설치되었다."]],"w":"11번 문장에 in 2023, a viewfinder was also installed at a park in Virginia가 나옴(보기에서는 set up으로 바꿔 씀). ①은 8번(평생), ②는 6번(2017년), ③은 7번(가장 흔한 유형)과 어긋남.","a":"4) A viewfinder was also set up at a park in Virginia in 2023. (2023년에 버지니아주의 한 공원에도 뷰파인더가 마련되었다.)","c":4},"h":"9c78443f46"},{"n":9,"t":"sum","q":"The state of Tennessee (A) to help colorblind people see the beautiful (B) colors.","ko":"테네시주는 색맹인 사람들이 아름다운 (B) 색을 보도록 돕기를 (A).","oko":["(A) 거부했다 / (B) 가을","(A) 원했다 / (B) 겨울","(A) 잊었다 / (B) 여름","(A) 원했다 / (B) 가을","(A) 거부했다 / (B) 겨울"],"opts":["(A) refused / (B) fall","(A) wanted / (B) winter","(A) forgot / (B) summer","(A) wanted / (B) fall","(A) refused / (B) winter"],"r":{"ev":"5번 문장","s":[[5,"The state of Tennessee wanted to help them see the beautiful fall colors.","테네시주는 그들이 아름다운 가을 색들을 보도록 돕고 싶었다."]],"w":"5번 문장 The state of Tennessee wanted to help them see the beautiful fall colors에서 (A)는 wanted(원했다), (B)는 fall(가을). 거부했다거나 잊었다는 말은 본문에 없고, 계절도 가을임.","a":"4) (A) wanted / (B) fall ((A) 원했다 / (B) 가을)","c":4},"h":"22bee1fa8d"},{"n":10,"t":"fill","q":"She [A], “It’s the most beautiful thing I’ve ever [B] in my life.”","ko":"그녀는 “그것은 제 인생에서 [B] 것 중 가장 아름다운 것이에요.”라고 [A].","bank":["said","seen","Americans","special","park","Tennessee"],"bko":{"said":"말했다(say의 과거)","seen":"본(see의 과거분사)","Americans":"미국인들","special":"특별한","park":"공원","Tennessee":"테네시주"},"r":{"ev":"10번 문장","s":[[10,"She said, “It’s the most beautiful thing I’ve ever seen in my life.”","그녀는 “그것은 제 인생에서 본 것 중 가장 아름다운 것이에요.”라고 말했다."]],"w":"10번 문장 She said, “It’s the most beautiful thing I’ve ever seen in my life.”에서 [A]는 said(say의 과거형), [B]는 seen(I’ve ever 뒤에는 과거분사). 나머지는 명사나 형용사라서 들어갈 수 없음.","a":"[A] said (말했다(say의 과거)), [B] seen (본(see의 과거분사))","c":null},"h":"7c9488ac3f"}]},{"u":1,"id":"rg4-01-3","no":3,"ko":"깨져 버린 풍선 개, 그 작가는 누구?","items":[{"n":1,"t":"tf","q":"Jeff Koons has inspired many young artists.","ko":"Jeff Koons는 많은 젊은 예술가들에게 영감을 주었다.","r":{"ev":"3번 문장","s":[[3,"The artist behind this sculpture is Jeff Koons, who has inspired many young artists.","이 조각상의 작가는 Jeff Koons이며, 그는 많은 젊은 예술가들에게 영감을 주었다."]],"w":"3번 문장에 who has inspired many young artists가 나옴. who는 Jeff Koons를 가리키므로 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"f252f8a6e7"},{"n":2,"t":"tf","q":"Koons made a stainless steel rabbit in the 1970s.","ko":"Koons는 1970년대에 스테인리스 토끼를 만들었다.","r":{"ev":"8번 문장","s":[[8,"Koons also made a stainless steel rabbit, which is one of his most famous sculptures from the 1980s.","Koons는 또한 스테인리스로 된 토끼를 만들었는데, 그것은 1980년대 그의 가장 유명한 조각품 중 하나이다."]],"w":"8번 문장은 스테인리스 토끼가 1980년대의 가장 유명한 조각품 중 하나라고 함. 1970년대가 아니라 1980년대라서 틀린 내용.","a":"F (본문과 다른 내용)","c":"F"},"h":"59b9cd65d2"},{"n":3,"t":"tf","q":"After finishing art school, Koons worked at the Museum of Modern Art.","ko":"예술학교를 마친 후, Koons는 현대 미술관에서 일했다.","r":{"ev":"5번 문장","s":[[5,"After finishing art school in 1976, he moved to New York and worked at the Museum of Modern Art.","1976년 예술학교를 졸업한 후, 그는 뉴욕으로 이사하여 현대 미술관에서 일했다."]],"w":"5번 문장에 After finishing art school in 1976, he moved to New York and worked at the Museum of Modern Art가 나옴. 졸업 후 일했다는 순서가 맞음.","a":"T (본문과 맞는 내용)","c":"T"},"h":"fc7c929372"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A famous sculpture … was accidentally broken by a visitor.)","ko":"(유명한 조각상이 방문객에 의해 accidentally 깨졌다.)","opts":["일부러","실수로","천천히","조용히"],"word":"accidentally","r":{"ev":"1번 문장","s":[[1,"A famous sculpture titled “Balloon Dog (Blue)” was accidentally broken by a visitor.","‘Balloon Dog (Blue)’라는 제목의 유명한 조각상이 방문객에 의해 실수로 깨졌다."]],"w":"1번 문장에서 방문객이 조각상을 깨뜨렸는데, 2번에서 풍선이 아니라고 놀라는 분위기임. 일부러 깬 것이 아니라 실수로 깬 것이라서 accidentally = 실수로.","a":"2) 실수로","c":2},"h":"742cbc3ac9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…this makes people see their reflection and think about themselves.)","ko":"(…이는 사람들이 자신의 reflection을 보고 스스로에 대해 생각하게 한다.)","opts":["높이","가격","거울에 비친 모습","재료"],"word":"reflection","r":{"ev":"10번 문장","s":[[10,"The shiny surface of his “Rabbit” acts like a mirror, so this makes people see their reflection and think about themselves.","그의 작품 ‘Rabbit’의 반짝이는 표면은 거울처럼 작용해서, 이는 사람들이 자신의 모습을 보고 스스로에 대해 생각하게 한다."]],"w":"10번 문장에서 Rabbit의 표면이 acts like a mirror(거울처럼 작용한다)라고 했으니 사람들이 보게 되는 것은 거울에 비친 모습. reflection = (거울에 비친) 모습.","a":"3) 거울에 비친 모습","c":3},"h":"a6864c035b"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nHe believed that art should make people happy and bring them together.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그는 예술은 사람들을 행복하게 만들어야 하고 또 그들을 하나로 모아야 한다고 믿었다.","pron":"them","opts":["사람들","예술가들","방문객들","장난감들"],"r":{"ev":"7번 문장","s":[[7,"He believed that art should make people happy and bring them together.","그는 예술은 사람들을 행복하게 만들어야 하고 또 그들을 하나로 모아야 한다고 믿었다."]],"w":"7번 문장에서 예술은 make people happy(사람들을 행복하게 만들어야 한다)하고 bring them together(그들을 하나로 모아야 한다)고 함. them은 앞의 people.","a":"1) 사람들","c":1,"k":"them = 사람들"},"h":"8bff55f818"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This sculpture that stands 104 centimeters tall might look like a toy, but is much more than that.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"104센티미터 높이의 이 조각품은 장난감처럼 보일지도 모르지만, 훨씬 그 이상이다.","opts":["높이 104센티미터의 이 조각품은 장난감처럼 보일 수 있지만, 그보다 훨씬 더 큰 의미가 있다.","104센티미터 높이의 이 조각품은 진짜 장난감이라서 아이들만 가지고 놀 수 있다.","이 조각품은 104센티미터밖에 안 되어서 장난감보다 작아 보인다.","이 조각품은 장난감처럼 보이지 않지만 사실은 장난감이다."],"r":{"ev":"9번 문장","s":[[9,"This sculpture that stands 104 centimeters tall might look like a toy, but is much more than that.","104센티미터 높이의 이 조각품은 장난감처럼 보일지도 모르지만, 훨씬 그 이상이다."]],"w":"might look like a toy는 '장난감처럼 보일지도 모른다', but is much more than that은 '하지만 그보다 훨씬 더 대단하다'는 뜻. 아이들만 가지고 논다거나 장난감이 맞다는 말은 본문에 없음.","a":"1) 높이 104센티미터의 이 조각품은 장난감처럼 보일 수 있지만, 그보다 훨씬 더 큰 의미가 있다.","c":1},"h":"4817e12e59"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Koons는 작품에 값비싼 것들만 사용하는 것을 좋아한다.","Koons는 장난감과 진공청소기 같은 일상적인 것들을 작품에 사용하는 것을 좋아한다.","Koons는 작품에 장난감을 절대 사용하지 않는다.","Koons는 자연에서 온 것들을 작품에 사용하는 것을 좋아한다."],"opts":["Koons likes to use only expensive things in his art.","Koons likes to use everyday things like toys and vacuum cleaners in his art.","Koons never uses toys in his art.","Koons likes to use things from nature in his art."],"r":{"ev":"4번 문장","s":[[4,"He likes to use everyday things in his art, such as toys and vacuum cleaners.","그는 장난감과 진공청소기와 같은 일상적인 것들을 그의 작품에 사용하는 것을 좋아한다."]],"w":"4번 문장에 He likes to use everyday things in his art, such as toys and vacuum cleaners가 나옴. 장난감과 진공청소기 같은 일상적인 것을 쓴다는 ②가 맞고, 값비싼 것이나 자연의 것이라는 말은 없음.","a":"2) Koons likes to use everyday things like toys and vacuum cleaners in his art. (Koons는 장난감과 진공청소기 같은 일상적인 것들을 작품에 사용하는 것을 좋아한다.)","c":2},"h":"504023f00a"},{"n":9,"t":"sum","q":"Koons's art during this time was (A) and used things like (B).","ko":"이 시기 Koons의 작품은 (A) (B) 같은 것들을 사용했다.","oko":["(A) 지루했고 / (B) 풍선","(A) 재미있었고 / (B) 돌","(A) 지루했고 / (B) 돌","(A) 슬펐고 / (B) 풍선","(A) 재미있었고 / (B) 풍선"],"opts":["(A) boring / (B) balloons","(A) fun / (B) rocks","(A) boring / (B) rocks","(A) sad / (B) balloons","(A) fun / (B) balloons"],"r":{"ev":"6번 문장","s":[[6,"His art during this time was fun and used things like balloons.","이 시기의 그의 작품은 재미있었고 풍선과 같은 것들을 사용했다."]],"w":"6번 문장 His art during this time was fun and used things like balloons에서 (A)는 fun(재미있는), (B)는 balloons(풍선들). 지루하거나 슬프다는 말, 돌을 썼다는 말은 본문에 없음.","a":"5) (A) fun / (B) balloons ((A) 재미있었고 / (B) 풍선)","c":5},"h":"0a4e4e7432"},{"n":10,"t":"fill","q":"It has [A] one of the most famous works of 20th-century art, and was [B] for $91.1 million!","ko":"그것은 20세기 예술의 가장 유명한 작품들 중 하나가 [A], 9천110만 달러에 [B]!","bank":["become","sold","toys","mirror","steel","artist"],"bko":{"become":"되다(become의 과거분사)","sold":"팔린(sell의 과거분사)","toys":"장난감들","mirror":"거울","steel":"강철","artist":"예술가"},"r":{"ev":"11번 문장","s":[[11,"It has become one of the most famous works of 20th-century art, and was sold for $91.1 million!","그것은 20세기 예술의 가장 유명한 작품들 중 하나가 되었고, 9천110만 달러에 팔렸다!"]],"w":"11번 문장 It has become one of the most famous works와 was sold for $91.1 million에서 [A]는 become, [B]는 sold. has 뒤와 was 뒤에는 과거분사가 와야 해서 명사들은 들어갈 수 없음.","a":"[A] become (되다(become의 과거분사)), [B] sold (팔린(sell의 과거분사))","c":null},"h":"3c9c173d0f"}]},{"u":2,"id":"rg4-02-1","no":1,"ko":"쓰레기통 닭이 호주를 구한다고?","items":[{"n":1,"t":"tf","q":"People nicknamed the white ibis the “bin chicken.”","ko":"사람들은 흰따오기에게 ‘쓰레기통 닭’이라는 별명을 붙였다.","r":{"ev":"2번 문장","s":[[2,"People nicknamed them the “bin chicken,” because they search trash cans for food or even snatch food from people’s hands.","사람들은 그 새들이 쓰레기통을 뒤져 음식을 찾거나 심지어 사람들의 손에서 음식을 채 가기 때문에 ‘쓰레기통 닭’이라는 별명을 붙였다."]],"w":"2번 문장에 People nicknamed them the “bin chicken”이 나옴. them은 1번의 흰따오기들이라서 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"60657a98fc"},{"n":2,"t":"tf","q":"Cane toads were introduced to Australia in the 1950s.","ko":"수수두꺼비는 1950년대에 호주로 들여왔다.","r":{"ev":"4번 문장","s":[[4,"Cane toads were introduced to Australia in the 1930s.","수수두꺼비는 1930년대에 호주로 들여왔다."]],"w":"4번 문장은 수수두꺼비가 in the 1930s(1930년대)에 들어왔다고 함. 1950년대는 틀림.","a":"F (본문과 다른 내용)","c":"F"},"h":"915f801076"},{"n":3,"t":"tf","q":"Cane toads had no natural enemies in Australia.","ko":"수수두꺼비는 호주에 천적이 없었다.","r":{"ev":"8번 문장","s":[[8,"They became a threat to native wildlife because they had no natural enemies in Australia.","그것들은 호주에 천적이 없었기 때문에 토착 야생 생물에 위협이 되었다."]],"w":"8번 문장 because they had no natural enemies in Australia가 그대로 나옴. 천적이 없어서 토종 생물에게 위협이 되었다는 내용과 맞음.","a":"T (본문과 맞는 내용)","c":"T"},"h":"e697bfbed5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…their strong poison could kill most native animals that eat frogs and toads.)","ko":"(…그것들의 강한 독은 개구리와 두꺼비를 먹는 대부분의 native 동물을 죽일 수 있었다.)","opts":["토종의","외국의","작은","귀여운"],"word":"native","r":{"ev":"7번 문장","s":[[7,"Moreover, their strong poison could kill most native animals that eat frogs and toads.","게다가, 그것들의 강한 독은 개구리와 두꺼비를 잡아먹는 대부분의 토착 동물을 죽일 수 있었다."]],"w":"7번 문장에서 두꺼비의 독은 개구리와 두꺼비를 잡아먹는 native 동물을 죽일 수 있다고 함. 원래 호주에 살던 동물들이라서 native = 토종의. 외국에서 들어온 쪽은 수수두꺼비임.","a":"1) 토종의","c":1},"h":"473b63e602"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…causing the toads to release their poison.)","ko":"(…두꺼비가 독을 release하게 한다.)","opts":["삼키다","내보내다","만들다","숨기다"],"word":"release","r":{"ev":"10번 문장","s":[[10,"The ibises flip the toads into the air, causing the toads to release their poison.","흰따오기는 두꺼비를 공중으로 툭 던져 뒤집어, 두꺼비가 독을 내보내게 한다."]],"w":"10번 문장은 두꺼비를 공중으로 던져 뒤집으면 두꺼비가 독을 몸 밖으로 내보낸다는 내용. release = 내보내다, 방출하다. 그래야 11번에서 안전하게 씻어 먹을 수 있음.","a":"2) 내보내다","c":2},"h":"e371be6d5d"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nFarmers thought they would help control beetles damaging their crops.","ko":"밑줄 친 their가 가리키는 것은?","sko":"농부들은 농작물에 피해를 주는 딱정벌레를 통제하는 데 그것들이 도움이 될 것으로 생각했다.","pron":"their","opts":["농부들","딱정벌레들","수수두꺼비들","흰따오기들"],"r":{"ev":"5번 문장","s":[[5,"Farmers thought they would help control beetles damaging their crops.","농부들은 농작물에 피해를 주는 딱정벌레를 통제하는 데 그것들이 도움이 될 것으로 생각했다."]],"w":"5번 문장은 Farmers thought ...(농부들은 ~라고 생각했다)로 시작함. 딱정벌레가 해를 입히는 농작물(crops)은 농부들의 것이라서 their는 Farmers를 가리킴.","a":"1) 농부들","c":1,"k":"their = 농부들"},"h":"66e16aff0c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In fact, each cane toad that a white ibis eats prevents the birth of about 70,000 new toads in a year!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사실, 흰따오기가 잡아먹는 각각의 수수두꺼비는 일 년에 약 7만 마리의 새로운 두꺼비가 태어나는 것을 막는다!","opts":["흰따오기는 하루에 약 7만 마리의 두꺼비를 잡아먹는다.","두꺼비 한 마리가 일 년에 약 7만 마리의 새끼를 낳아 흰따오기가 줄었다.","약 7만 마리의 흰따오기가 두꺼비를 먹어서 두꺼비가 사라졌다.","흰따오기가 잡아먹는 두꺼비 한 마리마다 일 년에 약 7만 마리의 새로운 두꺼비가 태어나는 것을 막는다."],"r":{"ev":"13번 문장","s":[[13,"In fact, each cane toad that a white ibis eats prevents the birth of about 70,000 new toads in a year!","사실, 흰따오기가 잡아먹는 각각의 수수두꺼비는 일 년에 약 7만 마리의 새로운 두꺼비가 태어나는 것을 막는다!"]],"w":"each cane toad that a white ibis eats는 흰따오기가 먹는 각각의 두꺼비, prevents the birth of about 70,000 new toads in a year는 일 년에 약 7만 마리의 새 두꺼비가 태어나는 것을 막는다는 뜻.","a":"4) 흰따오기가 잡아먹는 두꺼비 한 마리마다 일 년에 약 7만 마리의 새로운 두꺼비가 태어나는 것을 막는다.","c":4},"h":"dda56e3d37"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["흰따오기는 수수두꺼비를 무서워한다.","흰따오기는 수수두꺼비를 안전하게 잡아먹는 방법을 터득했다.","오직 농부들만 수수두꺼비를 안전하게 먹을 수 있다.","흰따오기는 수수두꺼비를 먹지만 매번 병이 난다."],"opts":["The white ibis is afraid of cane toads.","The white ibis learned a way to eat cane toads safely.","Only farmers can eat cane toads safely.","The white ibis eats cane toads, but it gets sick every time."],"r":{"ev":"9번 문장","s":[[9,"Fortunately, the white ibis learned a way to eat them safely.","다행스럽게도, 흰따오기는 그것들을 안전하게 잡아먹는 방법을 터득했다."]],"w":"9번 문장에 the white ibis learned a way to eat them safely가 나옴(them은 수수두꺼비). 안전하게 먹는 방법을 터득했다는 ②가 맞음.","a":"2) The white ibis learned a way to eat cane toads safely. (흰따오기는 수수두꺼비를 안전하게 잡아먹는 방법을 터득했다.)","c":2},"h":"c733b7bc6f"},{"n":9,"t":"sum","q":"The cane toads (A) rapidly and (B) many insects.","ko":"수수두꺼비들은 빠르게 (A) 많은 곤충을 (B).","oko":["(A) 사라졌고 / (B) 먹어 치웠다","(A) 퍼졌고 / (B) 구해 주었다","(A) 사라졌고 / (B) 구해 주었다","(A) 잠들었고 / (B) 먹어 치웠다","(A) 퍼졌고 / (B) 먹어 치웠다"],"opts":["(A) disappeared / (B) consumed","(A) spread / (B) saved","(A) disappeared / (B) saved","(A) slept / (B) consumed","(A) spread / (B) consumed"],"r":{"ev":"6번 문장","s":[[6,"However, these toads spread rapidly, consuming many insects.","그러나, 이 두꺼비들은 빠르게 퍼져 나가며 많은 곤충들을 먹어 치웠다."]],"w":"6번 문장 these toads spread rapidly, consuming many insects에서 (A)는 spread(퍼졌다), (B)는 consume(먹어 치우다)의 과거형 consumed(먹어 치웠다). 사라지거나 곤충을 구한다는 말은 본문과 반대임.","a":"5) (A) spread / (B) consumed ((A) 퍼졌고 / (B) 먹어 치웠다)","c":5},"h":"a8332ce6c4"},{"n":10,"t":"fill","q":"They then [A] them in water before eating. This way, they’re helping control the [B] of cane toads.","ko":"그다음 흰따오기는 먹기 전에 그것들을 물에 [A]. 이런 방식으로, 그들은 수수두꺼비의 [B]을(를) 조절하는 데 도움을 주고 있다.","bank":["wash","number","strong","rapidly","safely","damaging"],"bko":{"wash":"씻다","number":"수(숫자)","strong":"강한","rapidly":"빠르게","safely":"안전하게","damaging":"피해를 주는"},"r":{"ev":"11~12번 문장","s":[[11,"They then wash them in water before eating.","그다음 흰따오기는 먹기 전에 그것들을 물에 씻어낸다."],[12,"This way, they’re helping control the number of cane toads.","이런 방식으로, 그들은 수수두꺼비의 수를 조절하는 데 도움을 주고 있다."]],"w":"11번 문장 They then wash them in water에서 [A]는 wash, 12번 문장 control the number of cane toads에서 [B]는 number. 나머지는 형용사나 부사라서 동사 자리와 the 뒤 명사 자리에 들어갈 수 없음.","a":"[A] wash (씻다), [B] number (수(숫자))","c":null},"h":"3ed29ac3c1"}]},{"u":2,"id":"rg4-02-2","no":2,"ko":"16세기 여성들은 왜 가면을 썼을까?","items":[{"n":1,"t":"tf","q":"In 16th century Europe, wealthy women wore masks to protect their skin from the sun.","ko":"16세기 유럽에서 부유한 여성들은 태양으로부터 피부를 보호하기 위해 가면을 썼다.","r":{"ev":"3번 문장","s":[[3,"For example, in 16th century Europe, wealthy women wore masks to protect their skin from the sun.","예를 들어, 16세기 유럽에서는 부유한 여성들이 태양으로부터 그들의 피부를 보호하기 위해 가면을 썼다."]],"w":"3번 문장에 in 16th century Europe, wealthy women wore masks to protect their skin from the sun이 그대로 나옴. 시대, 사람, 이유가 모두 맞음.","a":"T (본문과 맞는 내용)","c":"T"},"h":"b28d5a0564"},{"n":2,"t":"tf","q":"The first masks were made of black velvet and covered the whole face.","ko":"최초의 가면은 검은색 벨벳으로 만들어졌고 얼굴 전체를 가렸다.","r":{"ev":"7번 문장","s":[[7,"The first masks were made of black velvet and covered the top half of the face.","최초의 가면은 검은색 벨벳으로 만들어졌고 얼굴 윗부분 반을 가렸다."]],"w":"7번 문장에서 최초의 가면은 검은색 벨벳이고 covered the top half of the face(얼굴 윗부분 반)를 가렸음. 얼굴 전체를 가린 것은 8번의 vizard임.","a":"F (본문과 다른 내용)","c":"F"},"h":"61793e96b4"},{"n":3,"t":"tf","q":"Masks allowed women to visit places like the market or church without a man.","ko":"가면은 여성들이 시장이나 교회 같은 장소에 남자 없이 방문하도록 해 주었다.","r":{"ev":"10번 문장","s":[[10,"Masks also allowed women to visit places like the market or church without a man.","가면은 또한 여성들이 시장이나 교회 같은 장소에 남자 없이 방문하도록 해 주었다."]],"w":"10번 문장에 Masks also allowed women to visit places like the market or church without a man이 그대로 나옴. 남자 없이 다닐 수 있게 해 주었다는 내용과 일치.","a":"T (본문과 맞는 내용)","c":"T"},"h":"558fc30099"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It showed that one didn't work outside like a commoner.)","ko":"(그것은 그 사람이 commoner처럼 밖에서 일하지 않는다는 것을 보여 주었다.)","opts":["왕족","평민","귀족","군인"],"word":"commoner","r":{"ev":"5번 문장","s":[[5,"It showed that one didn’t work outside like a commoner.","그것은 그 사람이 평민처럼 밖에서 일하지 않는다는 것을 보여주었다."]],"w":"4번에서 창백한 피부는 높은 지위의 상징이었고, 5번은 높은 지위의 사람은 밖에서 일하지 않는다는 뜻. 그러니 밖에서 일하는 commoner는 높은 지위가 아닌 평민임.","a":"2) 평민","c":2},"h":"1743c59f58"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In London and Paris, stylish women started wearing masks.)","ko":"(런던과 파리에서, stylish한 여성들이 가면을 쓰기 시작했다.)","opts":["게으른","가난한","수줍은","유행을 따르는"],"word":"stylish","r":{"ev":"6번 문장","s":[[6,"In London and Paris, stylish women started wearing masks.","런던과 파리에서, 유행을 따르는 여성들이 가면을 쓰기 시작했다."]],"w":"2번에서 가면 쓰기가 유행이 되었다고 했고, 6번에서 가면을 쓰기 시작한 여성들이 stylish. 멋과 유행을 따르는 여성들이라서 stylish = 유행을 따르는, 멋진.","a":"4) 유행을 따르는","c":4},"h":"e1b96b4ef1"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWomen wore these masks while they were traveling on horseback.","ko":"밑줄 친 they가 가리키는 것은?","sko":"여성들은 말을 타고 이동하는 동안 이 가면들을 썼다.","pron":"they","opts":["말들","가면들","여성들","남자들"],"r":{"ev":"9번 문장","s":[[9,"Women wore these masks while they were traveling on horseback.","여성들은 말을 타고 이동하는 동안 이 가면들을 썼다."]],"w":"9번 문장은 Women wore these masks while they were traveling on horseback. 말을 타고 이동하는 주체이자 가면을 쓴 주체는 문장 앞의 Women이므로 they는 여성들.","a":"3) 여성들","c":3,"k":"they = 여성들"},"h":"bbf16e43ec"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without a mask, a woman going out alone might have caused rumors.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"가면이 없었다면, 혼자 외출하는 여성은 소문을 일으켰을지도 모른다.","opts":["가면 없이 혼자 외출하는 여성은 소문의 대상이 되었을지도 모른다.","가면을 쓴 여성이 혼자 외출해서 소문을 퍼뜨렸다.","가면이 없던 여성들은 소문 때문에 외출하지 않았다.","혼자 외출하는 여성들이 소문을 일으켜서 가면이 생겨났다."],"r":{"ev":"10~11번 문장","s":[[10,"Masks also allowed women to visit places like the market or church without a man.","가면은 또한 여성들이 시장이나 교회 같은 장소에 남자 없이 방문하도록 해 주었다."],[11,"Without a mask, a woman going out alone might have caused rumors.","가면이 없었다면, 혼자 외출하는 여성은 소문을 일으켰을지도 모른다."]],"w":"Without a mask는 '가면이 없었다면', might have caused rumors는 '소문을 일으켰을지도 모른다'는 추측. 10번에서 가면 덕분에 남자 없이 다녔다고 했으니, 가면 없이 혼자 다니면 소문이 났을 수 있다는 뜻.","a":"1) 가면 없이 혼자 외출하는 여성은 소문의 대상이 되었을지도 모른다.","c":1},"h":"b85f0804be"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["vizard는 검은색 벨벳으로 만들어졌다.","vizard는 코를 위한 공간을 두고 얼굴 전체를 덮었다.","vizard는 입을 위한 큰 구멍이 있었다.","vizard는 얼굴의 윗부분 반만 덮었다."],"opts":["The vizard was made of black velvet.","The vizard covered the whole face with a space for the nose.","The vizard had big holes for the mouth.","The vizard covered only the top half of the face."],"r":{"ev":"7~8번 문장","s":[[7,"The first masks were made of black velvet and covered the top half of the face.","최초의 가면은 검은색 벨벳으로 만들어졌고 얼굴 윗부분 반을 가렸다."],[8,"Another mask, which was called a vizard, covered the whole face with a space for the nose and small holes for the eyes.","또 다른 가면은 vizard라고 불렸는데, 그것은 코를 위한 공간과 눈을 위한 작은 구멍이 있으면서 얼굴 전체를 덮었다."]],"w":"8번 문장에 a vizard, covered the whole face with a space for the nose and small holes for the eyes가 나옴. ①과 ④는 7번의 '최초의 가면'(벨벳, 윗부분 반) 설명이라 틀리고, ③은 눈을 위한 작은 구멍이라고 했으므로 틀림.","a":"2) The vizard covered the whole face with a space for the nose. (vizard는 코를 위한 공간을 두고 얼굴 전체를 덮었다.)","c":2},"h":"afbd43d826"},{"n":9,"t":"sum","q":"During this period, having (A) skin was a symbol of high (B).","ko":"이 시대에는 (A) 피부를 지닌 것이 높은 (B)의 상징이었다.","oko":["(A) 어두운 / (B) 지위","(A) 창백한 / (B) 유행","(A) 어두운 / (B) 유행","(A) 거친 / (B) 지위","(A) 창백한 / (B) 지위"],"opts":["(A) dark / (B) status","(A) pale / (B) trend","(A) dark / (B) trend","(A) rough / (B) status","(A) pale / (B) status"],"r":{"ev":"4번 문장","s":[[4,"During this period, having pale skin was a symbol of high status.","이 시대에는 창백한 피부를 지닌 것이 높은 지위의 상징이었다."]],"w":"4번 문장 having pale skin was a symbol of high status에서 (A)는 pale(창백한), (B)는 status(지위). 어둡거나 거친 피부, 유행의 상징이라는 말은 본문에 없음.","a":"5) (A) pale / (B) status ((A) 창백한 / (B) 지위)","c":5},"h":"0df7a3b0eb"},{"n":10,"t":"fill","q":"Masks not only gave women more [A] but also made them [B] by hiding their faces.","ko":"가면은 여성에게 더 많은 [A]을(를) 주었을 뿐만 아니라 얼굴을 숨김으로써 그들을 [B] 만들었다.","bank":["freedom","mysterious","wore","visit","protect","cover"],"bko":{"freedom":"자유","mysterious":"신비로운","wore":"썼다(wear 입다·쓰다)","visit":"방문하다","protect":"보호하다","cover":"덮다"},"r":{"ev":"12번 문장","s":[[12,"Masks not only gave women more freedom but also made them mysterious by hiding their faces.","가면은 여성에게 더 많은 자유를 주었을 뿐만 아니라 얼굴을 숨김으로써 그들을 신비롭게 만들었다."]],"w":"12번 문장 Masks not only gave women more freedom but also made them mysterious에서 [A]는 freedom, [B]는 mysterious. wore(wear 쓰다), visit(방문하다), protect(보호하다), cover(덮다)는 동사라서 'more ___'나 'made them ___' 자리에 들어갈 수 없음.","a":"[A] freedom (자유), [B] mysterious (신비로운)","c":null},"h":"b290645f06"}]},{"u":2,"id":"rg4-02-3","no":3,"ko":"모네의 몽환적인 그림, 비밀은 대기오염?","items":[{"n":1,"t":"tf","q":"The study looked at over 100 paintings by Monet and William Turner.","ko":"그 연구는 모네와 윌리엄 터너의 그림 100점 이상을 살펴보았다.","r":{"ev":"2번 문장","s":[[2,"The study looked at over 100 paintings by Monet and another painter named William Turner.","그 연구는 모네와 윌리엄 터너라는 이름의 또 다른 화가가 그린 100점 이상의 그림을 살펴보았다."]],"w":"2번 문장에 The study looked at over 100 paintings by Monet and another painter named William Turner가 나옴. 그림 수와 화가가 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"fe4b02f0f9"},{"n":2,"t":"tf","q":"Monet and Turner painted when the air was very clean.","ko":"모네와 터너는 공기가 매우 깨끗했을 때 그림을 그렸다.","r":{"ev":"3번 문장","s":[[3,"They painted during a time when factories released a lot of smoke.","그들은 공장들이 많은 매연을 방출했던 시기에 그림을 그렸다."]],"w":"3번 문장은 They painted during a time when factories released a lot of smoke, 즉 공장이 연기를 많이 내뿜던 시기에 그렸다고 함. 깨끗한 공기와 반대.","a":"F (본문과 다른 내용)","c":"F"},"h":"a5c1c36396"},{"n":3,"t":"tf","q":"Monet wrote a letter to his wife about the sky in London.","ko":"모네는 아내에게 런던의 하늘에 대한 편지를 썼다.","r":{"ev":"8번 문장","s":[[8,"In a letter to his wife, Monet wrote, “I was very worried in the morning because I saw no fog, just clear blue sky in London.","그의 아내에게 보낸 편지에서 모네는 이렇게 썼다. “런던에 안개는 보이지 않고 맑고 푸른 하늘만 보여서 아침에 매우 걱정이 되었어요."]],"w":"8번 문장 In a letter to his wife, Monet wrote에 이어, 런던에 안개가 없고 맑은 하늘만 보여 걱정된다는 하늘 이야기가 나옴.","a":"T (본문과 맞는 내용)","c":"T"},"h":"657b7cdb38"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…to make their beautiful, dreamy paintings.)","ko":"(…그들의 아름답고 dreamy한 그림을 그리려고.)","opts":["차가운","몽환적인","시끄러운","단순한"],"word":"dreamy","r":{"ev":"1, 4번 문장","s":[[1,"A new study says that air pollution might have inspired famous painters like Claude Monet to make their beautiful, dreamy paintings.","한 새로운 연구는 대기오염이 클로드 모네와 같은 유명한 화가들이 그들의 아름답고 몽환적인 그림을 그리도록 영감을 주었을지도 모른다고 말한다."],[4,"Researchers thought that the dirty air inspired their paintings to look foggy and dreamy.","연구원들은 더러운 공기가 그들의 그림이 안개가 끼고 몽환적으로 보이도록 영감을 주었다고 생각했다."]],"w":"4번에서 더러운 공기 때문에 그림이 foggy and dreamy(안개가 끼고 몽환적으로) 보인다고 함. 안개 낀 듯 꿈속 같은 느낌이라서 dreamy = 몽환적인.","a":"2) 몽환적인","c":2},"h":"0a1f6d82f6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This suggests that the dirty air might have influenced the special look of these famous paintings.)","ko":"(이것은 더러운 공기가 이 유명한 그림들의 특별한 모습에 influenced했을지도 모른다는 것을 시사한다.)","opts":["지웠다","가렸다","영향을 미쳤다","팔았다"],"word":"influenced","r":{"ev":"6번 문장","s":[[6,"This suggests that the dirty air might have influenced the special look of these famous paintings.","이것은 더러운 공기가 이 유명한 그림들의 특별한 모습에 영향을 미쳤을지도 모른다는 것을 시사한다."]],"w":"5번에서 그림이 대기오염 수준과 일치한다고 발견했고, 6번은 그래서 공기가 그림의 모습에 영향을 주었을지도 모른다는 시사. influence = 영향을 주다.","a":"3) 영향을 미쳤다","c":3},"h":"1863d95843"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nResearchers thought that the dirty air inspired their paintings to look foggy and dreamy. They found that the paintings matched the air pollution levels at the time.","ko":"밑줄 친 They가 가리키는 것은?","sko":"연구원들은 더러운 공기가 그들의 그림이 안개가 끼고 몽환적으로 보이도록 영감을 주었다고 생각했다. 그들은 그림들이 그 당시 대기오염 수준과 일치한다는 것을 발견했다.","opts":["공장들","모네와 터너","화가의 아내","연구원들"],"r":{"ev":"4~5번 문장","s":[[4,"Researchers thought that the dirty air inspired their paintings to look foggy and dreamy.","연구원들은 더러운 공기가 그들의 그림이 안개가 끼고 몽환적으로 보이도록 영감을 주었다고 생각했다."],[5,"They found that the paintings matched the air pollution levels at the time.","그들은 그림들이 그 당시 대기오염 수준과 일치한다는 것을 발견했다."]],"w":"4번에서 Researchers thought라고 했고, 5번 They found는 그 연구원들이 발견했다는 뜻. 3번의 They는 모네와 터너지만 5번의 They는 연구원들임.","a":"4) 연구원들","c":4},"h":"5a25413344"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Then, his work continued.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러고 나서, 그의 작품은 계속되었다.","opts":["그러고 나서, 그의 작업은 이어졌다.","그러고 나서, 그의 작품은 완전히 끝났다.","그러고 나서, 그는 작품을 팔기 시작했다.","그러고 나서, 그의 작품은 처음으로 시작되었다."],"r":{"ev":"11번 문장","s":[[11,"Then, his work continued.","그러고 나서, 그의 작품은 계속되었다."]],"w":"Then, his work continued는 '그러고 나서 그의 작품은 계속되었다'는 뜻. 안개와 연기가 돌아온 뒤에 모네가 작업을 이어 갔다는 말임. 끝났다거나 팔았다는 말은 본문에 없음.","a":"1) 그러고 나서, 그의 작업은 이어졌다.","c":1},"h":"db9efb4490"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["모네는 자신이 그 어느 때보다 더 그림을 그릴 수 있다고 생각했다.","모네는 자신이 더 이상 그림을 그릴 수 없다고 생각했다.","모네는 런던의 하늘이 매우 더럽다고 생각했다.","모네는 그의 아내가 더 이상 그림을 그릴 수 없다고 생각했다."],"opts":["Monet thought that he could paint more than ever.","Monet thought that he couldn’t paint anymore.","Monet thought that the sky in London was very dirty.","Monet thought that his wife couldn’t paint anymore."],"r":{"ev":"9번 문장","s":[[9,"I thought that I couldn’t paint anymore.","내가 더 이상 그림을 그릴 수 없다고 생각했어요."]],"w":"9번 문장에 I thought that I couldn’t paint anymore가 나옴(편지를 쓴 모네의 말). 더 이상 그림을 그릴 수 없다고 생각한 사람은 모네 자신이라서 ②가 맞음.","a":"2) Monet thought that he couldn’t paint anymore. (모네는 자신이 더 이상 그림을 그릴 수 없다고 생각했다.)","c":2},"h":"8c5e0adc49"},{"n":9,"t":"sum","q":"The researchers looked at other (A) to check if Monet was (B) by air pollution.","ko":"연구원들은 모네가 대기오염에 (B)는지 확인하기 위해 다른 (A)을(를) 살펴보았다.","oko":["(A) 가게들 / (B) 지루해했","(A) 출처들 / (B) 영감을 받았","(A) 도로들 / (B) 영감을 받았","(A) 출처들 / (B) 지루해했","(A) 가게들 / (B) 다쳤"],"opts":["(A) shops / (B) bored","(A) sources / (B) inspired","(A) roads / (B) inspired","(A) sources / (B) bored","(A) shops / (B) hurt"],"r":{"ev":"7번 문장","s":[[7,"The researchers looked at other sources to check if Monet was inspired by air pollution.","연구원들은 모네가 대기오염에 영감을 받았는지를 확인하기 위해 다른 출처들을 살펴보았다."]],"w":"7번 문장 The researchers looked at other sources to check if Monet was inspired by air pollution에서 (A)는 sources(출처들), (B)는 inspired(영감을 받은). 가게나 도로를 살펴봤다는 말, 지루해했다는 말은 본문에 없음.","a":"2) (A) sources / (B) inspired ((A) 출처들 / (B) 영감을 받았)","c":2},"h":"34296bedaf"},{"n":10,"t":"fill","q":"But soon, [A] and fog from pollution [B] to the sky.”","ko":"하지만 곧, 오염으로 인한 [A]와(과) 안개가 하늘로 [B].”","bank":["smoke","returned","clear","blue","worried","soon"],"bko":{"smoke":"연기","returned":"돌아왔다(return의 과거)","clear":"맑은","blue":"푸른","worried":"걱정하는","soon":"곧"},"r":{"ev":"10번 문장","s":[[10,"But soon, smoke and fog from pollution returned to the sky.”","그런데 곧, 오염으로 인한 연기와 안개가 하늘로 돌아왔어요.”"]],"w":"10번 문장 smoke and fog from pollution returned to the sky에서 [A]는 smoke, [B]는 returned. 나머지는 형용사나 부사라서 명사 자리와 동사 자리에 들어갈 수 없음.","a":"[A] smoke (연기), [B] returned (돌아왔다(return의 과거))","c":null},"h":"2e2ee80829"}]},{"u":3,"id":"rg4-03-1","no":1,"ko":"나이가 들수록 좋아지는 이것","items":[{"n":1,"t":"tf","q":"Susan Turk Charles has been studying emotions for the past 20 years.","ko":"Susan Turk Charles는 지난 20년간 감정을 연구해 오고 있다.","r":{"ev":"5번 문장","s":[[5,"For the past 20 years, Susan Turk Charles, a psychologist, has been studying emotions in people of all ages.","지난 20년간, 심리학자인 Susan Turk Charles는 모든 연령대의 사람들의 감정을 연구해 왔다."]],"w":"5번 문장 For the past 20 years, Susan Turk Charles, a psychologist, has been studying emotions가 그대로 나옴. 20년 동안 계속 연구해 온 것이 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"32c9cc0e5a"},{"n":2,"t":"tf","q":"Older people tend to have more social connections that are less satisfying.","ko":"나이 든 사람들은 덜 만족스러운 사회적 관계를 더 많이 가지는 경향이 있다.","r":{"ev":"6번 문장","s":[[6,"She has discovered that older people tend to have fewer but more satisfying social connections and experience higher emotional well-being.","그녀는 나이 든 사람들이 더 적지만 더 만족스러운 사회적 관계를 가지는 경향이 있고 더 높은 감정적 행복감을 경험한다는 것을 발견했다."]],"w":"6번 문장은 older people tend to have fewer but more satisfying social connections, 즉 관계는 더 적지만 더 만족스럽다고 함. 많고 덜 만족스럽다는 말은 반대임.","a":"F (본문과 다른 내용)","c":"F"},"h":"38d30f4272"},{"n":3,"t":"tf","q":"Older people usually focus on positive things.","ko":"나이 든 사람들은 보통 긍정적인 것들에 집중한다.","r":{"ev":"11번 문장","s":[[11,"Also, older people usually focus on positive things.","또한, 나이 든 사람들은 보통 긍정적인 것들에 집중한다."]],"w":"11번 문장 Also, older people usually focus on positive things가 그대로 나옴. 감정 통제를 잘하는 이유 중 하나로 긍정적인 것에 집중한다고 설명함.","a":"T (본문과 맞는 내용)","c":"T"},"h":"3178b4d150"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, there's one important exception: older people are better at controlling their emotions.)","ko":"(하지만, 한 가지 중요한 exception이 있다: 나이 든 사람들이 자신의 감정을 더 잘 통제한다는 것이다.)","opts":["원인","약속","예외","결과"],"word":"exception","r":{"ev":"3~4번 문장","s":[[3,"We might forget things more, react a little slower, and have less energy.","우리는 무언가를 더 잘 잊어버리고, 좀 더 느리게 반응하고, 기운이 더 없을지도 모른다."],[4,"However, there’s one important exception: older people are better at controlling their emotions.","하지만, 한 가지 중요한 예외가 있다: 나이 든 사람들이 자신의 감정을 더 잘 통제한다는 것이다."]],"w":"3번에서 나이가 들면 잊고 느려지고 기운이 준다는 단점을 말했는데, 4번 However 뒤에서 감정 통제만은 다르다고 함. 단점 목록에서 벗어나는 한 가지이므로 exception = 예외.","a":"3) 예외","c":3},"h":"dfb0426827"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…older people tend to have fewer but more satisfying social connections…)","ko":"(…나이 든 사람들은 더 적지만 더 satisfying한 사회적 관계를 가지는 경향이 있다…)","opts":["만족스러운","지루한","불필요한","위험한"],"word":"satisfying","r":{"ev":"6번 문장","s":[[6,"She has discovered that older people tend to have fewer but more satisfying social connections and experience higher emotional well-being.","그녀는 나이 든 사람들이 더 적지만 더 만족스러운 사회적 관계를 가지는 경향이 있고 더 높은 감정적 행복감을 경험한다는 것을 발견했다."]],"w":"6번은 관계의 수는 적어도 오히려 더 좋은 쪽이라는 b a":"2) 제공했다","c":2},"h":"b57f9b9d57"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…because of its extreme conditions, including space radiation.)","ko":"(…우주 방사선을 포함한 extreme한 환경 때문에.)","opts":["평범한","아늑한","짧은","극심한"],"word":"extreme","r":{"ev":"8번 문장","s":[[8,"Professor David Goukassian said, “Space can cause changes in astronauts’ DNA because of its extreme conditions, including space radiation.","David Goukassian 교수는 말했다. “우주는 우주 방사선을 포함한 극한의 환경 때문에 우주 비행사들의 DNA에 변화를 일으킬 수 있습니다."]],"w":"8번은 우주의 환경이 우주 비행사의 DNA를 변하게 할 만큼 혹독하다는 내용. 우주 방사선까지 포함되므로 extreme = 극도의, 극심한.","a":"4) 극심한","c":4},"h":"1e6a446d97"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThe researchers found changes in all 14 astronauts they studied.","ko":"밑줄 친 they가 가리키는 것은?","sko":"연구원들은 그들이 연구했던 14명의 우주 비행사 모두에게서 변화를 발견했다.","pron":"they","opts":["연구원들","14명의 우주 비행사들","암 환자들","우주 방사선"],"r":{"ev":"7번 문장","s":[[7,"The researchers found changes in all 14 astronauts they studied.","연구원들은 그들이 연구했던 14명의 우주 비행사 모두에게서 변화를 발견했다."]],"w":"7번 문장은 The researchers found changes in all 14 astronauts they studied. 'they studied(연구했던)'의 주어는 연구한 사람들인 The researchers임.","a":"1) 연구원들","c":1,"k":"they = 연구원들"},"h":"bad590e8ed"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Goukassian said that more research is necessary to study the harmful effects of space travel on the body.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Goukassian은 우주여행이 신체에 미치는 해로운 영향을 연구하기 위해서는 더 많은 조사가 필요하다고 말했다.","opts":["Goukassian은 우주여행이 몸에 이로운 영향만 준다는 연구가 충분하다고 말했다.","Goukassian은 더 많은 연구를 위해 우주여행을 중단해야 한다고 말했다.","Goukassian은 우주여행이 신체에 미치는 해로운 영향을 연구하려면 더 많은 연구가 필요하다고 말했다.","Goukassian은 우주여행을 하려면 몸에 해로운 영향부터 없애야 한다고 말했다."],"r":{"ev":"12번 문장","s":[[12,"Goukassian said that more research is necessary to study the harmful effects of space travel on the body.","Goukassian은 우주여행이 신체에 미치는 해로운 영향을 연구하기 위해서는 더 많은 조사가 필요하다고 말했다."]],"w":"more research is necessary는 더 많은 연구가 필요하다, to study the harmful effects of space travel on the body는 우주여행이 몸에 미치는 해로운 영향을 연구하기 위해서라는 뜻. 우주여행을 중단하라는 말은 없음.","a":"3) Goukassian은 우주여행이 신체에 미치는 해로운 영향을 연구하려면 더 많은 연구가 필요하다고 말했다.","c":3},"h":"c49a2510ae"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["연구원들은 우주 비행사 중 일부에게서만 변화를 발견했다.","혈액 표본은 임무 후에만 수집되었다.","우주는 우주 비행사들의 DNA에 어떤 변화도 일으킬 수 없다.","다른 국가들은 달에 기지를 건설할 준비를 하고 있다."],"opts":["The researchers found changes in only some of the astronauts.","The blood samples were collected only after the missions.","Space cannot cause any changes in astronauts' DNA.","Other countries are preparing to build bases on the moon."],"r":{"ev":"5, 7~8, 11번 문장","s":[[5,"The astronauts provided blood samples before and after their missions.","우주 비행사들은 임무 전후에 혈액 표본을 제공했다."],[7,"The researchers found changes in all 14 astronauts they studied.","연구원들은 그들이 연구했던 14명의 우주 비행사 모두에게서 변화를 발견했다."],[8,"Professor David Goukassian said, “Space can cause changes in astronauts’ DNA because of its extreme conditions, including space radiation.","David Goukassian 교수는 말했다. “우주는 우주 방사선을 포함한 극한의 환경 때문에 우주 비행사들의 DNA에 변화를 일으킬 수 있습니다."],[11,"Several nations are working on sending astronauts to Mars, and other countries are preparing to build bases on the moon.","몇몇 국가들은 우주 비행사들을 화성에 보내는 데 착수 중이며, 다른 국가들은 달에 기지를 건설하는 것을 준비 중이다."]],"w":"11번 문장에 other countries are preparing to build bases on the moon이 나옴. ①은 7번(14명 모두), ②는 5번(임무 전후), ③은 8번(변화를 일으킬 수 있음)과 어긋남.","a":"4) Other countries are preparing to build bases on the moon.","c":4},"h":"7572b8ad87"},{"n":9,"t":"sum","q":"Space travel might (A) the (B) of getting cancer.","ko":"우주여행은 암에 걸릴 (B)을(를) (A)시킬지도 모른다.","oko":["(A) 감소 / (B) 가능성","(A) 증가 / (B) 규칙","(A) 얼리다 / (B) 가능성","(A) 감소 / (B) 규칙","(A) 증가 / (B) 가능성"],"opts":["(A) decrease / (B) chances","(A) increase / (B) rules","(A) freeze / (B) chances","(A) decrease / (B) rules","(A) increase / (B) chances"],"r":{"ev":"3번 문장","s":[[3,"This might increase the chances of getting canc s didn’t like certain Japanese dishes such as raw fish.","그들은 일본 식당을 열고 싶었지만, 많은 미국인들이 생선회와 같은 특정한 일본 요리를 좋아하지 않았다."],[9,"So, they started Chinese restaurants and offered fortune cookies as a dessert.","그래서 그들은 중국 식당을 시작하였고 디저트로 포춘 쿠키를 제공하였다."]],"w":"8번에서 일본 식당을 열고 싶었지만 많은 미국인이 일본 요리를 좋아하지 않았다고 하고, 9번 So(그래서) they started Chinese restaurants로 이어짐. 이유와 결과가 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"d17930eccf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Fortune cookies are treats with hidden messages inside.)","ko":"(포춘 쿠키는 안쪽에 hidden 메시지가 있는 간식이다.)","opts":["차가운","숨겨진","비싼","오래된"],"word":"hidden","r":{"ev":"1번 문장","s":[[1,"Fortune cookies are treats with hidden messages inside.","포춘 쿠키는 안쪽에 숨겨진 메시지가 있는 간식이다."]],"w":"1번 문장은 포춘 쿠키 안쪽(inside)에 메시지가 겉에서 보이지 않게 들어 있다는 뜻. hidden = 숨겨진.","a":"2) 숨겨진","c":2},"h":"e9552bfd92"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As the cookies became more popular, the recipe changed to suit American tastes.)","ko":"(쿠키가 더 인기를 얻게 되면서, 조리법은 미국인의 입맛에 suit하도록 바뀌었다.)","opts":["피하다","자르다","맞추다","잊다"],"word":"suit","r":{"ev":"10번 문장","s":[[10,"As the cookies became more popular, the recipe changed to suit American tastes.","그 쿠키가 더 인기를 얻게 되면서, 미국인의 입맛에 맞춰 조리법이 바뀌었다."]],"w":"10번은 쿠키가 인기를 얻자 조리법을 미국인의 입맛에 맞게 바꿨다는 뜻. 바로 뒤 11번에서 바닐라와 버터로 더 달콤해졌다고 함. suit = ~에 맞추다.","a":"3) 맞추다","c":3},"h":"de301a3c1c"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhen Japanese people moved to the U.S. in the 1900s, they introduced these cookies.","ko":"밑줄 친 they가 가리키는 것은?","sko":"1900년대에 일본 사람들이 미국으로 이주했을 때, 그들은 이 쿠키를 들여왔다.","pron":"they","opts":["일본 사람들","미국인들","중국 식당 손님들","포춘 쿠키들"],"r":{"ev":"7번 문장","s":[[7,"When Japanese people moved to the U.S. in the 1900s, they introduced these cookies.","1900년대에 일본 사람들이 미국으로 이주했을 때, 그들은 이 쿠키를 들여왔다."]],"w":"7번 문장은 When Japanese people moved to the U.S. in the 1900s, they introduced these cookies. 쿠키를 들여온 주체 they는 앞의 Japanese people임.","a":"1) 일본 사람들",  받는다는 말, 수업 후라는 말은 본문에 없음.","a":"5) (A) diners / (B) meals ((A) 손님들 / (B) 식사)","c":5},"h":"c3291253b9"},{"n":10,"t":"fill","q":"The cookies became sweeter with [A] and butter, and today billions of fortune cookies are [B] every year.","ko":"쿠키는 [A]과(와) 버터를 넣어 더 달콤해졌고, 오늘날 수십억 개의 포춘 쿠키가 매년 [B].","bank":["vanilla","produced","introduce","remain","receive","became"],"bko":{"vanilla":"바닐라","produced":"생산된다","introduce":"들여오다","remain":"계속 ~이다","receive":"받다","became":"~이 되었다"},"r":{"ev":"11~12번 문장","s":[[11,"They became sweeter with vanilla and butter.","그것들은 바닐라와 버터를 넣어 더 달콤해졌다."],[12,"Today, billions of fortune cookies are produced every year.","오늘날, 수십억 개의 포춘 쿠키가 매년 생산된다."]],"w":"11번 They became sweeter with vanilla and butter에서 [A]는 vanilla, 12번 billions of fortune cookies are produced every year에서 [B]는 produced. introduce(들여오다), remain(계속 ~이다), receive(받다), became(~이 되었다)은 동사라서 'with ___ and butter'나 'are ___ every year' 자리에 맞지 않음.","a":"[A] vanilla, [B] produced","c":null},"h":"8f2a99b5ed"}]},{"u":4,"id":"rg4-04-1","no":1,"ko":"바위 밑에 산다고? 진짜로 사는 마을이 있다!","items":[{"n":1,"t":"tf","q":"The houses in Setenil de las Bodegas were made by the Moors.","ko":"Setenil de las Bodegas의 집들은 무어인들이 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"These special houses were made by the Moors, who invaded Spain and founded the town in the 12th century.","이 특별한 집들은 12세기에 스페인을 침략해 이 마을을 세운 무어인들이 만들었다."]],"w":"3번 문장에 These special houses were made by the Moors라고 나옴. 같은 내용이라 T.","c":"T"},"h":"783ef78c02"},{"n":2,"t":"tf","q":"The Moors built new houses instead of making the natural caves bigger.","ko":"무어인들은 자연 동굴을 더 크게 만드는 대신 새 집을 지었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Instead of building new houses, they made the natural caves bigger to stay cool during the hot summer months.","그들은 새 집을 짓는 대신, 더운 여름 동안 시원하게 지내려고 자연 동굴을 더 크게 만들었다."]],"w":"4번 문장은 Instead of building new houses(새 집을 짓는 대신), they made the natural caves bigger(자연 동굴을 더 크게 만들었다)임. 새 집을 지은 것이 아니라 동굴을 넓힌 것
