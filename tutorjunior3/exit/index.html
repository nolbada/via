,"Your brain is just helping you out!","당신의 뇌가 그저 당신을 돕고 있을 뿐이다!"]],"w":"13번에서 당신의 뇌는 그저 당신을 돕고 있을 뿐이라고 해요. 귀여운 공격성은 뇌가 감정의 균형을 잡는 과정이고(10~11번), 뇌가 우리를 해치는 것이 아니에요.","c":2},"h":"f5ff5e5a56"},{"n":9,"t":"sum","q":"Our brain wants to (A) our emotions balanced at all (B).","ko":"우리의 뇌는 우리의 감정이 모든 (B) 균형 잡히게 (A)기를 원한다.","oko":["(A) 유지하 / (B) 곳에","(A) 잃 / (B) 때에","(A) 유지하 / (B) 때에","(A) 바꾸 / (B) 곳에","(A) 잃 / (B) 곳에"],"opts":["(A) keep / (B) places","(A) lose / (B) times","(A) keep / (B) times","(A) change / (B) places","(A) lose / (B) places"],"r":{"a":"3) (A) keep / (B) times ((A) 유지하 / (B) 때에)","ev":"7번 문장","s":[[7,"Our brain wants to keep our emotions balanced at all times.","우리의 뇌는 항상 우리의 감정이 균형 잡히게 유지하기를 원한다."]],"w":"7번 문장에서 우리의 뇌는 감정이 항상(at all times) 균형 잡힌 채로 유지되기(keep ~ balanced)를 원한다고 해요. 감정을 잃거나 바꾸려는 것이 아니고, 장소(places)와도 관련이 없어요.","c":3},"h":"d87b575ec9"},{"n":10,"t":"fill","q":"Don’t be [A] if you feel like [B] a cute puppy’s cheek.","ko":"귀여운 강아지의 볼을 [B] 기분이 들더라도 [A] 마라.","bank":["surprised","pinching","paws","puppies","joy","cuteness"],"bko":{"surprised":"놀라지","pinching":"꼬집는","paws":"발들","puppies":"강아지들","joy":"기쁨","cuteness":"귀여움"},"r":{"a":"[A] surprised (놀라지), [B] pinching (꼬집는)","ev":"12번 문장","s":[[12,"Don’t be surprised if you feel like pinching a cute puppy’s cheek.","귀여운 강아지의 볼을 꼬집고 싶은 마음이 들더라도 놀라지 마라."]],"w":"12번 Don’t be surprised if you feel like pinching a cute puppy’s cheek에서 가져왔어요. be 뒤에는 surprised, feel like 뒤에는 -ing형 pinching이 와요. 나머지는 명사라 두 자리에 들어갈 수 없어요.","c":null},"h":"ac603aafd0"}]},{"u":7,"id":"rj3-07-2","no":2,"ko":"내 둥지를 받아줘!","items":[{"n":1,"t":"tf","q":"A male bowerbird chews berries or charcoal and mixes them with saliva.","ko":"수컷 바우어새는 딸기류 열매나 숯을 씹어서 침과 섞는다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Next, it chews berries or charcoal, mixing them with saliva.","다음으로, 그것은 딸기류 열매나 숯을 침과 섞으면서 씹는다."]],"w":"6번 문장에 chews berries or charcoal, mixing them with saliva가 그대로 나와요. 딸기류 열매나 숯을 씹어 침과 섞는다는 내용과 일치해요.","c":"T"},"h":"ecaf4807bc"},{"n":2,"t":"tf","q":"The male bowerbird uses only natural things to decorate its bower.","ko":"수컷 바우어새는 바우어를 장식하는 데 자연물만 사용한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Some will even gather small pieces of colorful plastic or glass.","몇몇은 심지어 형형색색의 플라스틱이나 유리의 작은 조각들을 모으기도 할 것이다."]],"w":"10번에서 일부 수컷은 형형색색의 플라스틱이나 유리 조각까지 모은다고 해요. 자연물만 쓴다는 말은 본문과 달라요.","c":"F"},"h":"ac07db5a10"},{"n":3,"t":"tf","q":"Female bowerbirds stay in one bower and wait for the male.","ko":"암컷 바우어새들은 한 바우어에 머물며 수컷을 기다린다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Female bowerbirds then wander around from bower to bower.","그러고 나서 암컷 바우어새들은 바우어에서 바우어로 이리저리 돌아다닌다."]],"w":"11번에서 암컷 바우어새들은 바우어에서 바우어로 이리저리 돌아다닌다(wander around from bower to bower)고 해요. 한곳에 머문다는 말은 반대예요.","c":"F"},"h":"93e9dc7531"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It then arranges them into a bower.)","ko":"그러고 나서 그것은 그것들을 배열하여 바우어로 ( ).","opts":["던지다","배열하다","먹다","부수다"],"word":"arranges","r":{"a":"2) 배열하다","ev":"5번 문장","s":[[5,"It then arranges them into a bower and sometimes even makes a path leading up to it.","그러고 나서 그것은 그것들을 배열하여 바우어로 만들고 심지어 때때로 그것으로 이어지는 길을 만든다."]],"w":"수컷은 나뭇가지들(them)을 모아 바우어 모양으로 놓아요. 그래서 arrange는 '배열하다'예요.","c":2},"h":"f32719f031"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Female bowerbirds then wander around from bower to bower.)","ko":"그러고 나서 암컷 바우어새들은 바우어에서 바우어로 ( ).","opts":["잠을 자다","숨다","날아오르다","이리저리 돌아다니다"],"word":"wander","r":{"a":"4) 이리저리 돌아다니다","ev":"11~12번 문장","s":[[11,"Female bowerbirds then wander around from bower to bower.","그러고 나서 암컷 바우어새들은 바우어에서 바우어로 이리저리 돌아다닌다."],[12,"They look at the decorations and taste the paint.","그것들은 장식을 보고 페인트를 맛본다."]],"w":"암컷이 바우어를 하나씩 옮겨 가며 장식을 보고 페인트를 맛봐요(12번). 그래서 wander around는 '이리저리 돌아다니다'예요.","c":4},"h":"6d37dbde46"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nWhen they find a bower that they like, they choose that male to be their mate!","ko":"밑줄 친 their가 가리키는 것은?","sko":"그것들이 자신이 좋아하는 바우어를 발견하면, 그것들은 그 수컷을 그것들의 짝으로 선택한다!","opts":["암컷 바우어새들","수컷 바우어새","바우어","나뭇가지들"],"r":{"a":"1) 암컷 바우어새들","ev":"11~13번 문장","s":[[11,"Female bowerbirds then wander around from bower to bower.","그러고 나서 암컷 바우어새들은 바우어에서 바우어로 이리저리 돌아다닌다."],[12,"They look at the decorations and taste the paint.","그것들은 장식을 보고 페인트를 맛본다."],[13,"When they find a bower that they like, they choose that male to be their mate!","그것들이 자신이 좋아하는 바우어를 발견하면, 그것들은 그 수컷을 그것들의 짝으로 선택한다!"]],"w":"11번에서 암컷 바우어새들(Female bowerbirds)이 바우어를 돌아다니며 살펴본다고 했고, 13번에서 그들(they)이 좋아하는 바우어를 찾으면 그 수컷을 their mate(그들의 짝)로 고른다고 해요. 짝을 고르는 쪽은 암컷 바우어새들이에요.","c":1,"k":"their = 암컷 바우어새들"},"pron":"their","h":"ec75cd7eb2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Most birds attract mates with their beautiful feathers or songs.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"대부분의 새들은 그것들의 아름다운 깃털이나 노래로 짝의 마음을 끈다.","opts":["대부분의 새는 짝에게서 아름다운 깃털과 노래를 빼앗는다.","몇몇 새만이 깃털이나 노래로 짝의 마음을 끈다.","대부분의 새는 아름다운 깃털이나 노래로 짝의 마음을 끈다.","대부분의 새는 깃털과 노래 없이 짝을 찾는다."],"r":{"a":"3) 대부분의 새는 아름다운 깃털이나 노래로 짝의 마음을 끈다.","ev":"1번 문장","s":[[1,"Most birds attract mates with their beautiful feathers or songs.","대부분의 새들은 그것들의 아름다운 깃털이나 노래로 짝의 마음을 끈다."]],"w":"Most birds는 '대부분의 새', attract mates는 '짝의 마음을 끌다'예요. 깃털이나 노래가 그 방법이라는 뜻이고, 이어지는 2번에서 바우어새는 이와 다르다고 해요.","c":3},"h":"01cf21b8ad"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["암컷 바우어새는 알을 숨기기 위해 바우어를 짓는다.","바우어새는 바우어라고 불리는 특별한 구조물을 짓고 장식한다.","바우어새는 물고기를 잡기 위해 바우어를 사용한다.","대부분의 새는 짝의 마음을 끌기 위해 바우어를 짓는다."],"opts":["The female bowerbird builds a bower to hide her eggs.","The bowerbird builds and decorates a special structure called a bower.","The bowerbird uses a bower to catch fish.","Most birds build a bower to attract mates."],"r":{"a":"2) The bowerbird builds and decorates a special structure called a bower. (바우어새는 바우어라고 불리는 특별한 구조물을 짓고 장식한다.)","ev":"1~3번 문장","s":[[1,"Most birds attract mates with their beautiful feathers or songs.","대부분의 새들은 그것들의 아름다운 깃털이나 노래로 짝의 마음을 끈다."],[2,"However, the bowerbird does something very different.","하지만, 바우어새는 아주 색다른 것을 한다."],[3,"It builds and decorates a special structure called a bower.","그것은 바우어라고 불리는 특별한 구조물을 짓고 장식한다."]],"w":"3번에서 바우어새가 바우어라고 불리는 특별한 구조물을 짓고 장식한다고 해요. 대부분의 새는 깃털이나 노래로 짝의 마음을 끌고(1번), 바우어새는 아주 다른 방법을 써요(2번).","c":2},"h":"30ee805cd8"},{"n":9,"t":"sum","q":"At the start of mating season, the male bowerbird begins to (A) small (B).","ko":"짝짓기 철이 시작될 때, 수컷 바우어새는 작은 (B)을(를) (A)기 시작한다.","oko":["(A) 모으 / (B) 노래들","(A) 먹 / (B) 나뭇가지들","(A) 모으 / (B) 나뭇가지들","(A) 부러뜨리 / (B) 깃털들","(A) 먹 / (B) 물고기들"],"opts":["(A) gather / (B) songs","(A) eat / (B) sticks","(A) gather / (B) sticks","(A) break / (B) feathers","(A) eat / (B) fish"],"r":{"a":"3) (A) gather / (B) sticks ((A) 모으 / (B) 나뭇가지들)","ev":"4번 문장","s":[[4,"At the start of mating season, the male bowerbird begins to gather small sticks.","짝짓기 철의 시작에, 수컷 바우어새는 작은 나뭇가지들을 모으기 시작한다."]],"w":"4번 문장에서 짝짓기 철의 시작에 수컷 바우어새가 작은 나뭇가지들(small sticks)을 모으기(gather) 시작한다고 해요. 나뭇가지를 먹거나 노래·깃털·물고기를 모은다는 말은 없어요.","c":3},"h":"e668120f12"},{"n":10,"t":"fill","q":"Then, this mixture is used as [A] for the bower’s walls. Finally, it begins to decorate its bower with brightly [B] objects.","ko":"그러고 나서, 이 혼합물은 바우어의 벽을 위한 [A](으)로 사용된다. 마지막으로, 그것은 밝은 [B] 물건들로 그것의 바우어를 장식하기 시작한다.","bank":["paint","colored","songs","mate","path","season"],"bko":{"paint":"페인트","colored":"빛깔의, 색이 칠해진","songs":"노래들","mate":"짝","path":"길","season":"철"},"r":{"a":"[A] paint (페인트), [B] colored (빛깔의, 색이 칠해진)","ev":"7~8번 문장","s":[[7,"Then, this mixture is used as paint for the bower’s walls.","그러고 나서, 이 혼합물은 바우어의 벽을 위한 페인트로 사용된다."],[8,"Finally, it begins to decorate its bower with brightly colored objects.","마지막으로, 그것은 밝은 빛깔의 물건들로 그것의 바우어를 장식하기 시작한다."]],"w":"7번 this mixture is used as paint for the bower’s walls, 8번 decorate its bower with brightly colored objects에서 가져왔어요. [B]는 objects를 꾸미는 말이라 brightly와 함께 쓰는 colored가 맞아요.","c":null},"h":"430fa71df5"}]},{"u":7,"id":"rj3-07-3","no":3,"ko":"4kg을 먹어 치우는 0.1cm의 그들","items":[{"n":1,"t":"tf","q":"Beetles have been around for over 200 million years.","ko":"딱정벌레는 2억 년 이상 동안 있어 왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Beetles are natural cleaners that have been around for over 200 million years.","딱정벌레는 2억 년 이상 동안 있어 온 타고난 청소부들이다."]],"w":"6번 문장에서 딱정벌레는 2억 년 이상 동안 있어 온 타고난 청소부들이라고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"a0b4bee49d"},{"n":2,"t":"tf","q":"Scientists can get bones with some damage thanks to the beetles.","ko":"과학자들은 딱정벌레 덕분에 어느 정도 손상된 뼈를 얻을 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"Thanks to these new workers, scientists can get clean and undamaged bones.","이 새로운 일꾼들 덕분에, 과학자들은 깨끗하고 손상되지 않은 뼈들을 얻을 수 있다."]],"w":"14번에서 딱정벌레 덕분에 과학자들은 깨끗하고 손상되지 않은(undamaged) 뼈를 얻을 수 있다고 해요. 손상된 뼈라는 말은 반대예요.","c":"F"},"h":"94aee8bb24"},{"n":3,"t":"tf","q":"The beetles eat the bones of dead animals only.","ko":"딱정벌레는 죽은 동물의 뼈만 먹는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Moreover, they eat the dead bodies of animals, except for the bones.","게다가, 그들은 뼈들을 제외하고 동물의 사체를 먹는다."]],"w":"8번에서 딱정벌레는 뼈를 제외하고(except for the bones) 동물의 사체를 먹는다고 해요. 뼈만 먹는다는 말은 반대예요.","c":"F"},"h":"d814d25bb0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They eat animal waste.)","ko":"그들은 동물 ( )을 먹는다.","opts":["낭비","배설물","뼈","가죽"],"word":"waste","r":{"a":"2) 배설물","ev":"6~7번 문장","s":[[6,"Beetles are natural cleaners that have been around for over 200 million years.","딱정벌레는 2억 년 이상 동안 있어 온 타고난 청소부들이다."],[7,"They eat animal waste.","그들은 동물 배설물을 먹는다."]],"w":"6번에서 딱정벌레는 청소부라고 했어요. 청소부가 먹는 waste는 '낭비'가 아니라 동물이 남긴 '배설물'이에요.","c":2},"h":"be0683abe9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The beetles eat all the other body parts and leave the bones untouched.)","ko":"딱정벌레들은 사체의 모든 다른 부분을 먹고 뼈들을 ( ) 상태로 둔다.","opts":["훼손되지 않은","사라진","더러운","부러진"],"word":"untouched","r":{"a":"1) 훼손되지 않은","ev":"13~14번 문장","s":[[13,"However, the beetles eat all the other body parts and leave the bones untouched.","하지만, 딱정벌레들은 사체의 모든 다른 부분을 먹고 뼈들을 훼손되지 않은 상태로 둔다."],[14,"Thanks to these new workers, scientists can get clean and undamaged bones.","이 새로운 일꾼들 덕분에, 과학자들은 깨끗하고 손상되지 않은 뼈들을 얻을 수 있다."]],"w":"14번에서 과학자들은 손상되지 않은(undamaged) 뼈를 얻는다고 해요. 그래서 untouched는 '훼손되지 않은'이에요.","c":1},"h":"f4291e9b7e"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThe beetles used by the museum are only about 10 mm long, but surprisingly they can eat about 4 kg a week!","ko":"밑줄 친 they가 가리키는 것은?","sko":"그 박물관에 의해 사용되는 딱정벌레들은 길이가 겨우 10mm 정도이지만, 놀랍게도 그들은 일주일에 4kg 가량을 먹을 수 있다!","opts":["딱정벌레들","박물관","과학자들","동물들"],"r":{"a":"1) 딱정벌레들","ev":"9번 문장","s":[[9,"The beetles used by the museum are only about 10 mm long, but surprisingly they can eat about 4 kg a week!","그 박물관에 의해 사용되는 딱정벌레들은 길이가 겨우 10mm 정도이지만, 놀랍게도 그들은 일주일에 4kg 가량을 먹을 수 있다!"]],"w":"9번 문장은 ‘박물관이 쓰는 딱정벌레들은 길이가 겨우 10mm 정도이지만, they는 일주일에 4kg을 먹을 수 있다’는 뜻이에요. 크기는 작지만 많이 먹는 주인공은 앞의 The beetles(딱정벌레들)예요.","c":1,"k":"they = 딱정벌레들"},"pron":"they","h":"422cd798ec"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In addition to working at museums, these beetles also work for scientists.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"박물관에서 일하는 것뿐만 아니라, 이 딱정벌레들은 또한 과학자들을 위해서도 일한다.","opts":["이 딱정벌레들은 박물관에서 일하는 대신 과학자들을 위해서만 일한다.","박물관에서 일하는 과학자들이 이 딱정벌레들을 돕는다.","이 딱정벌레들은 과학자들이 일하는 박물관에서 길러진다.","이 딱정벌레들은 박물관에서 일할 뿐 아니라 과학자들을 위해서도 일한다."],"r":{"a":"4) 이 딱정벌레들은 박물관에서 일할 뿐 아니라 과학자들을 위해서도 일한다.","ev":"10번 문장","s":[[10,"In addition to working at museums, these beetles also work for scientists.","박물관에서 일하는 것뿐만 아니라, 이 딱정벌레들은 또한 과학자들을 위해서도 일한다."]],"w":"In addition to ~는 '~뿐만 아니라, ~ 외에도'예요. 박물관에서 일하는 것에 더해 과학자들을 위해서도 일한다는 뜻이에요. '대신'이나 '~만'이 아니에요.","c":4},"h":"5b0236159c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["과거에 과학자들은 뼈에서 가죽과 근육을 제거하기 위해 딱정벌레를 사용했다.","과거에 과학자들은 동물의 뼈에서 가죽과 근육을 제거하기 위해 강한 화학 물질을 사용했다.","과거에 과학자들은 뼈를 더 튼튼하게 만들기 위해 강한 화학 물질을 사용했다.","과거에 과학자들은 동물을 전혀 연구하지 않았다."],"opts":["In the past, scientists used beetles to remove the skin and muscle from bones.","In the past, scientists used strong chemicals to remove the skin and muscle from animal bones.","In the past, scientists used strong chemicals to make bones stronger.","In the past, scientists did not study animals at all."],"r":{"a":"2) In the past, scientists used strong chemicals to remove the skin and muscle from animal bones. (과거에 과학자들은 동물의 뼈에서 가죽과 근육을 제거하기 위해 강한 화학 물질을 사용했다.)","ev":"11번, 13번 문장","s":[[11,"In the past, scientists used strong chemicals to remove the skin and muscle from the bones of animals they wanted to study.","과거에, 과학자들은 그들이 연구하기를 원하는 동물의 뼈들에서 가죽과 근육을 제거하기 위해 강한 화학 물질들을 사용했다."],[13,"However, the beetles eat all the other body parts and leave the bones untouched.","하지만, 딱정벌레들은 사체의 모든 다른 부분을 먹고 뼈들을 훼손되지 않은 상태로 둔다."]],"w":"11번에서 과거에 과학자들은 동물의 뼈에서 가죽과 근육을 제거하기 위해 강한 화학 물질을 사용했다고 해요. 딱정벌레는 지금 하는 일꾼이고(13~14번), 과학자들은 연구하고 싶은 동물이 있었어요(11번).","c":2},"h":"6c37717188"},{"n":9,"t":"sum","q":"Britain’s Natural History Museum has some (A) workers, and their (B) is eating animals’ dead bodies.","ko":"영국 자연사 박물관에는 몇몇 (A) 일꾼들이 있고, 그들의 (B)은(는) 동물의 사체를 먹는 것이다.","oko":["(A) 독특한 / (B) 취미","(A) 지루한 / (B) 일","(A) 독특한 / (B) 일","(A) 게으른 / (B) 일","(A) 게으른 / (B) 취미"],"opts":["(A) unique / (B) hobby","(A) boring / (B) job","(A) unique / (B) job","(A) lazy / (B) job","(A) lazy / (B) hobby"],"r":{"a":"3) (A) unique / (B) job ((A) 독특한 / (B) 일)","ev":"1~3번 문장","s":[[1,"Britain’s Natural History Museum has some unique workers.","영국 자연사 박물관에는 몇몇 독특한 일꾼들이 있다."],[2,"What is their job?","그들의 일은 무엇일까?"],[3,"It is eating animals’ dead bodies!","그것은 동물의 사체를 먹는 것이다!"]],"w":"1번에서 영국 자연사 박물관에 독특한(unique) 일꾼들이 있다고 하고, 2~3번에서 그들의 일(job)이 동물의 사체를 먹는 것이라고 해요. 지루하거나 게으르다는 말은 없고, 취미가 아니라 일이에요.","c":3},"h":"5a93f0fc4c"},{"n":10,"t":"fill","q":"It sounds [A], but the workers never [B].","ko":"그것은 [A] 들리지만, 그 일꾼들은 절대 [B] 않는다.","bank":["scary","complain","bones","scientists","museum","beetles"],"bko":{"scary":"무섭게","complain":"불평하지","bones":"뼈들","scientists":"과학자들","museum":"박물관","beetles":"딱정벌레들"},"r":{"a":"[A] scary (무섭게), [B] complain (불평하지)","ev":"4번 문장","s":[[4,"It sounds scary, but the workers never complain.","그것은 무섭게 들리지만, 그 일꾼들은 절대 불평하지 않는다."]],"w":"4번 It sounds scary, but the workers never complain에서 가져왔어요. sounds 뒤에는 형용사 scary가, never 뒤에는 동사 complain이 와요. 나머지는 모두 명사라 두 자리에 들어갈 수 없어요.","c":null},"h":"fa2e5e0e3d"}]},{"u":7,"id":"rj3-07-4","no":4,"ko":"변신 완료! 정말 감쪽같죠?","items":[{"n":1,"t":"tf","q":"The mimic octopus lives in the sea near Indonesia.","ko":"흉내 문어는 인도네시아 근처의 바다에 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This animal is the mimic octopus, and it lives in the sea near Indonesia.","이 동물은 흉내 문어이고, 그것은 인도네시아 근처의 바다에 산다."]],"w":"3번 문장에서 흉내 문어는 인도네시아 근처의 바다에 산다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"a81d822939"},{"n":2,"t":"tf","q":"The mimic octopus has a hard shell and strong bones.","ko":"흉내 문어는 단단한 껍데기와 튼튼한 뼈를 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The mimic octopus does not have a shell or bones.","흉내 문어는 껍질이나 뼈를 가지고 있지 않다."]],"w":"4번에서 흉내 문어는 껍데기나 뼈를 가지고 있지 않다고 해요. 가지고 있다는 말은 반대예요.","c":"F"},"h":"5b43cf26a2"},{"n":3,"t":"tf","q":"The damselfish swim away because they like sea snakes.","ko":"자리돔은 바다뱀을 좋아해서 헤엄쳐 가 버린다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"The damselfish swim away because they are often eaten by sea snakes.","자리돔은 자주 바다뱀에 의해 먹히기 때문에 헤엄쳐 가 버린다."]],"w":"9번에서 자리돔이 헤엄쳐 가는 이유는 바다뱀에게 자주 먹히기 때문이에요. 좋아해서가 아니에요.","c":"F"},"h":"572e94d1d7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is one reason why it has developed a unique way of protecting itself.)","ko":"이는 그것이 스스로를 보호하는 ( ) 방법을 발달시킨 한 가지 이유이다.","opts":["평범한","독특한","위험한","오래된"],"word":"unique","r":{"a":"2) 독특한","ev":"5번 문장","s":[[5,"This is one reason why it has developed a unique way of protecting itself; it tries to look like other sea animals.","이는 그것이 스스로를 보호하는 독특한 방법을 발달시킨 한 가지 이유인데, 그것은 다른 바다 동물들처럼 보이려고 노력한다."]],"w":"껍데기도 뼈도 없어서 다른 바다 동물처럼 보이려는 방법이라고 해요. 흔한 방법이 아니라 이 문어만의 방법이라서 unique는 '독특한'이에요.","c":2},"h":"1e1f022c42"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It takes the shape of a poisonous flatfish to avoid any sudden attacks.)","ko":"그것은 어떤 갑작스런 공격이든 피하기 위해 ( ) 넙치류 물고기의 형태를 취한다.","opts":["맛있는","느린","아주 큰","독이 있는"],"word":"poisonous","r":{"a":"4) 독이 있는","ev":"7번 문장","s":[[7,"For example, when it wants to move around quickly, it takes the shape of a poisonous flatfish to avoid any sudden attacks.","예를 들어, 그것이 빠르게 돌아다니고 싶을 때, 그것은 어떤 갑작스런 공격이든 피하기 위해 독이 있는 넙치류 물고기의 형태를 취한다."]],"w":"공격을 피하려고 취하는 형태이므로 건드리기 무서운 물고기여야 해요. poisonous는 '독이 있는'이에요.","c":4},"h":"6dbfb9638d"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nAlso, when a damselfish comes near, it will change its shape into that of a sea snake.","ko":"밑줄 친 that이 가리키는 것은?","sko":"또한, 자리돔이 가까이 오면 그것은 자신의 형태를 바다뱀의 그것으로 바꿀 것이다.","opts":["색깔","형태","자리돔","바다"],"r":{"a":"2) 형태","ev":"8번 문장","s":[[8,"Also, when a damselfish comes near, it will change its shape into that of a sea snake.","또한, 자리돔이 가까이 오면 그것은 자신의 형태를 바다뱀의 그것(형태)으로 바꿀 것이다."]],"w":"8번 문장은 ‘자신의 형태를 바다뱀의 that으로 바꾼다’는 뜻이에요. 비교 대상이 되는 that은 앞에 나온 its shape(형태)를 대신해요. 바다뱀의 형태와 같은 것으로 바뀐다는 말이에요.","c":2,"k":"that = 형태"},"pron":"that","h":"061fb3d852"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Many animals change color to hide from predators.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"많은 동물들은 포식자들로부터 숨기 위해 색을 바꾼다.","opts":["포식자들은 숨기 위해 색을 바꾼다.","많은 동물들은 색을 바꾸기 위해 포식자로부터 숨는다.","많은 동물들은 포식자들로부터 숨기 위해 색을 바꾼다.","몇몇 동물만 포식자에게 보이려고 색을 바꾼다."],"r":{"a":"3) 많은 동물들은 포식자들로부터 숨기 위해 색을 바꾼다.","ev":"1번 문장","s":[[1,"Many animals change color to hide from predators.","많은 동물들은 포식자들로부터 숨기 위해 색을 바꾼다."]],"w":"to hide from predators는 '포식자들로부터 숨기 위해'라는 목적이에요. 색을 바꾸는 것이 방법이고, 숨는 것이 목적이에요.","c":3},"h":"2704c0a511"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["흉내 문어는 다른 동물들보다 덜 극적으로 변한다.","흉내 문어는 다른 많은 동물들보다 더 극적으로 변한다.","흉내 문어는 색이나 형태를 절대 바꾸지 않는다.","흉내 문어는 포식자로부터 숨는 유일한 동물이다."],"opts":["The mimic octopus changes less dramatically than other animals do.","The mimic octopus changes more dramatically than many other animals.","The mimic octopus never changes its color or shape.","The mimic octopus is the only animal that hides from predators."],"r":{"a":"2) The mimic octopus changes more dramatically than many other animals. (흉내 문어는 다른 많은 동물들보다 더 극적으로 변한다.)","ev":"1~3번 문장","s":[[1,"Many animals change color to hide from predators.","많은 동물들은 포식자들로부터 숨기 위해 색을 바꾼다."],[2,"However, there is one animal that changes more dramatically.","하지만, 더 극적으로 변하는 한 동물이 있다."],[3,"This animal is the mimic octopus, and it lives in the sea near Indonesia.","이 동물은 흉내 문어이고, 그것은 인도네시아 근처의 바다에 산다."]],"w":"2~3번에서 더 극적으로 변하는 한 동물이 있는데, 그 동물이 흉내 문어라고 해요. 색을 바꿔 숨는 동물은 많아요(1번).","c":2},"h":"69ef2cb32c"},{"n":9,"t":"sum","q":"The mimic octopus mimics different (A) in different (B) by changing its color and shape.","ko":"흉내 문어는 색과 형태를 바꿈으로써 각기 다른 (B)에서 다른 (A)을(를) 흉내 낸다.","oko":["(A) 생명체들 / (B) 계절들","(A) 바위들 / (B) 상황들","(A) 생명체들 / (B) 상황들","(A) 바위들 / (B) 계절들","(A) 식물들 / (B) 상황들"],"opts":["(A) creatures / (B) seasons","(A) rocks / (B) situations","(A) creatures / (B) situations","(A) rocks / (B) seasons","(A) plants / (B) situations"],"r":{"a":"3) (A) creatures / (B) situations ((A) 생명체들 / (B) 상황들)","ev":"6번 문장","s":[[6,"It mimics different creatures in different situations by changing not only its color but also its shape.","그것은 그것의 색뿐만 아니라 형태도 바꿈으로써, 각기 다른 상황들에서 다른 생명체들을 흉내 낸다."]],"w":"6번 문장에서 흉내 문어는 각기 다른 상황들(different situations)에서 다른 생명체들(different creatures)을 흉내 낸다고 해요. 바위나 식물, 계절을 흉내 낸다는 말은 없어요.","c":3},"h":"b3add15e25"},{"n":10,"t":"fill","q":"In this way, the mimic octopus can [A] safe from predators, and “master of [B]” is a great nickname for it.","ko":"이런 식으로, 흉내 문어는 포식자들로부터 안전하게 [A] 수 있고, ‘[B]의 달인’은 그것에게 훌륭한 별명이다.","bank":["stay","transformation","mimic","flatfish","damselfish","nickname"],"bko":{"stay":"계속 ~하게 있다","transformation":"변신, 변화","mimic":"흉내 내다","flatfish":"넙치류 물고기","damselfish":"자리돔","nickname":"별명"},"r":{"a":"[A] stay, [B] transformation","ev":"10~11번 문장","s":[[10,"In this way, the mimic octopus can stay safe from predators.","이런 식으로, 흉내 문어는 포식자들로부터 계속 안전할 수 있다."],[11,"Surely “master of transformation” is a great nickname for it.","확실히 ‘변신의 달인’은 그것에게 훌륭한 별명이다."]],"w":"10번에서 흉내 문어는 포식자로부터 안전하게 계속 있을 수 있다(can stay safe)고 하고, 11번에서 ‘변신의 달인(master of transformation)’이 훌륭한 별명이라고 해요. mimic은 can 뒤에 와도 safe와 이어지지 않고, flatfish·poisonous·nickname은 [A], [B] 자리에 뜻이 맞지 않아요.","c":null},"h":"e26851731f"}]},{"u":8,"id":"rj3-08-1","no":1,"ko":"말을 타는 어부들?","items":[{"n":1,"t":"tf","q":"Horseback shrimp fishing is now practiced by only about 15 to 20 people.","ko":"승마 새우잡이는 지금은 약 15명에서 20명의 사람들에 의해서만 행해진다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"However, it is now practiced by about 15 to 20 people.","그러나, 지금은 약 15명에서 20명의 사람들에 의해서만 행해진다."]],"w":"3번 문장에서 지금은 약 15명에서 20명의 사람들에 의해 행해진다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"276b1e2d75"},{"n":2,"t":"tf","q":"The shrimp fishers wear bright red clothing.","ko":"새우잡이들은 밝은 빨간색 옷을 입는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"They wear rubber boots and bright yellow waterproof clothing.","그들은 고무 부츠와 밝은 노란색 방수 옷을 입는다."]],"w":"5번에서 새우잡이들은 고무 부츠와 밝은 노란색(bright yellow) 방수 옷을 입는다고 해요. 빨간색이라는 말은 달라요.","c":"F"},"h":"1b6f40589c"},{"n":3,"t":"tf","q":"The fishing takes place only at high tide.","ko":"낚시는 만조 때에만 이루어진다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"The fishing takes place 90 minutes before and after low tide.","낚시는 썰물 전후 90분 동안 일어난다."]],"w":"9번에서 낚시는 썰물(low tide) 전후 90분 동안 이루어진다고 해요. 만조 때에만 한다는 말은 달라요.","c":"F"},"h":"351ffc6d46"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They are ideal for this job because they are strong and calm.)","ko":"그들은 힘이 세고 침착해서 이 일에 ( )이다.","opts":["위험한","어울리지 않는","이상적인","느린"],"word":"ideal","r":{"a":"3) 이상적인","ev":"7번 문장","s":[[7,"They are ideal for this job because they are strong and calm.","그들은 힘이 세고 침착해서 이 일에 이상적이다."]],"w":"말이 힘이 세고 침착하다는 것은 이 일에 알맞다는 이유예요. 그래서 ideal은 '이상적인'이에요.","c":3},"h":"f234806034"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The participant who catches the most shrimp gets to lead the next day’s parade!)","ko":"새우를 가장 많이 잡는 ( )은 다음 날의 퍼레이드를 이끌게 된다!","opts":["참가자","심판","관객","주최자"],"word":"participant","r":{"a":"1) 참가자","ev":"11~12번 문장","s":[[11,"On the first day, there is a shrimp-catching competition.","첫째 날에는 새우 잡기 대회가 있다."],[12,"The participant who catches the most shrimp gets to lead the next day’s parade!","새우를 가장 많이 잡는 참가자가 다음 날의 퍼레이드를 이끌게 된다!"]],"w":"11번에서 새우 잡기 대회가 있다고 했어요. 그 대회에서 새우를 잡는 사람이므로 participant는 '참가자'예요.","c":1},"h":"890dcbe3ae"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThey ride Brabant horses into water that goes up to the horses’ chest.","ko":"밑줄 친 that이 가리키는 것은?","sko":"그들은 Brabant 말들을 타고 말들의 가슴까지 오는 물속으로 들어간다.","opts":["말들","새우잡이들","그물","물"],"r":{"a":"4) 물","ev":"6번 문장","s":[[6,"They ride Brabant horses into water that goes up to the horses’ chest.","그들은 Brabant 말들을 타고 말들의 가슴까지 오는 물속으로 들어간다."]],"w":"that goes up to the horses' chest는 '말들의 가슴까지 오는'이라는 뜻이에요. 가슴까지 오는 것은 물이므로 that은 바로 앞의 water를 받아요.","c":4},"h":"a135b8a5bc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This used to be a common practice along the coast of the North Sea.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 북해의 해안을 따라 흔한 관습이었다.","opts":["이것은 예전에 북해의 해안을 따라 흔한 관습이었다.","이것은 지금도 북해의 해안을 따라 흔한 관습이다.","이것은 북해의 해안을 따라 처음 생긴 관습이다.","이것은 앞으로 북해의 해안을 따라 흔해질 관습이다."],"r":{"a":"1) 이것은 예전에 북해의 해안을 따라 흔한 관습이었다.","ev":"2번 문장","s":[[2,"This used to be a common practice along the coast of the North Sea.","이것은 북해의 해안을 따라 흔한 관습이었다."]],"w":"used to + 동사원형은 '예전에는 ~였다'라는 뜻이에요. 3번 However가 이어져서 지금은 15~20명만 한다고 말하므로 지금은 흔하지 않아요.","c":1},"h":"4e53bac0a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["지역 새우잡이들은 매일 겨울에 모인다.","지역 새우잡이들은 6월 말부터 9월 초까지 일주일에 두 번 모인다.","지역 새우잡이들은 6월 말에 일 년에 한 번만 모인다.","지역 새우잡이들은 봄에 한 달에 두 번 모인다."],"opts":["Local shrimp fishers gather every day in winter.","Local shrimp fishers gather twice a week from late June to early September.","Local shrimp fishers gather only once a year in late June.","Local shrimp fishers gather twice a month in spring."],"r":{"a":"2) Local shrimp fishers gather twice a week from late June to early September.","ev":"4번 문장","s":[[4,"From late June to early September, local shrimp fishers gather twice a week.","6월 말부터 9월 초까지, 지역 새우잡이들은 일주일에 두 번씩 모인다."]],"w":"4번에서 6월 말부터 9월 초까지 일주일에 두 번 모인다고 해요. 매일도, 일 년에 한 번도, 한 달에 두 번도 아니에요. 겨울이나 봄이 아니라 여름 무렵이에요.","c":2},"h":"5efa5c8cb3"},{"n":9,"t":"sum","q":"On the (A) Belgian coast, you can find a 500-year-old (B) called horseback shrimp fishing.","ko":"벨기에 (A) 해안에서, 당신은 승마 새우잡이라고 불리는 500년 된 (B)을(를) 발견할 수 있다.","oko":["(A) 남서부 / (B) 전통","(A) 북서부 / (B) 축제","(A) 북서부 / (B) 전통","(A) 남동부 / (B) 축제","(A) 남동부 / (B) 전통"],"opts":["(A) southwest / (B) tradition","(A) northwest / (B) festival","(A) northwest / (B) tradition","(A) southeast / (B) festival","(A) southeast / (B) tradition"],"r":{"a":"3) (A) northwest / (B) tradition ((A) 북서부 / (B) 전통)","ev":"1번 문장","s":[[1,"On the northwest Belgian coast, you can find a 500-year-old tradition called horseback shrimp fishing.","벨기에 북서부 해안에서, 당신은 승마 새우잡이라고 불리는 500년의 전통을 발견할 수 있다."]],"w":"1번 문장에서 벨기에 북서부(northwest) 해안에서 승마 새우잡이라고 불리는 500년 된 전통(tradition)을 발견할 수 있다고 해요. 방향이 다른 보기와, 축제라고 한 보기는 본문과 달라요.","c":3},"h":"52cb47e987"},{"n":10,"t":"fill","q":"They [A] [B] through the water to catch the shrimp.","ko":"그들은 새우를 잡기 위해 물속으로 [B]을(를) [A].","bank":["pull","nets","festival","parade","competition","tide"],"bko":{"pull":"당긴다","nets":"그물들","festival":"축제","parade":"퍼레이드","competition":"대회","tide":"조수, 물때"},"r":{"a":"[A] pull (당긴다), [B] nets (그물들)","ev":"8번 문장","s":[[8,"They pull nets through the water to catch the shrimp.","그들은 새우를 잡기 위해 물속으로 그물을 당긴다."]],"w":"8번 They pull nets through the water to catch the shrimp에서 가져왔어요. [A]는 주어 They 뒤의 동사, [B]는 그 동사의 목적어인 명사 자리예요. 나머지는 모두 명사라 동사 자리에 들어갈 수 없어요.","c":null},"h":"9151a2efe0"}]},{"u":8,"id":"rj3-08-2","no":2,"ko":"일 년에 한 번, 영혼과 만나자","items":[{"n":1,"t":"tf","q":"The Day of the Dead is actually a joyful holiday for remembering dead relatives.","ko":"망자의 날은 사실 고인이 된 친척들을 기리는 기쁨 가득한 명절이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"However, it is actually a joyful Mexican holiday for remembering dead relatives.","하지만, 그것은 사실 고인이 된 친척들을 추모하기 위한 즐거운 멕시코 명절이다."]],"w":"2번에서 However 뒤에 사실은 고인이 된 친척들을 추모하기 위한 즐거운 멕시코 명절이라고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"a7e1ee34c4"},{"n":2,"t":"tf","q":"Families place food and drink on the tables for themselves to eat and drink.","ko":"가족들은 자신들이 먹고 마시도록 탁자 위에 음식과 음료를 둔다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"They place food and drink on these tables for the spirits of their loved ones to eat and drink.","그들은 이 탁자 위에 사랑하는 친척들의 영혼이 먹고 마실 음식과 음료를 둔다."]],"w":"5번에서 음식과 음료는 사랑하는 친척들의 영혼(spirits)이 먹고 마시도록 두는 거예요. 가족들 자신을 위한 것이라는 말은 달라요.","c":"F"},"h":"ba80c9f039"},{"n":3,"t":"tf","q":"The Day of the Dead is a holiday with very little food.","ko":"망자의 날은 음식이 아주 적은 명절이다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Like other holidays, it is full of food.","다른 명절과 마찬가지로, 그것은 음식으로 가득하다."]],"w":"3번에서 다른 명절처럼 음식으로 가득하다(full of food)고 해요. 음식이 적다는 말은 반대예요.","c":"F"},"h":"0f37c575ba"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, it is actually a joyful Mexican holiday for remembering dead relatives.)","ko":"하지만, 그것은 사실 고인이 된 친척들을 기리기 위한 ( ) 멕시코 명절이다.","opts":["슬픈","즐거운","조용한","무서운"],"word":"joyful","r":{"a":"2) 즐거운","ev":"1~2번 문장","s":[[1,"The Day of the Dead sounds scary.","망자의 날은 무섭게 들린다."],[2,"However, it is actually a joyful Mexican holiday for remembering dead relatives.","하지만, 그것은 사실 고인이 된 친척들을 추모하기 위한 즐거운 멕시코 명절이다."]],"w":"1번에서 무섭게 들린다고 했지만 However로 반대 내용이 이어져요. 그래서 joyful은 '즐거운'이에요.","c":2},"h":"ddbf414d35"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Nearly everyone eats this bread during the holiday to remember their dead relatives.)","ko":"거의 모든 사람이 그들의 고인이 된 친척들을 ( )하기 위해 그 명절 동안 이 빵을 먹는다.","opts":["잊어버리다","만나다","추모하다","놀리다"],"word":"remember","r":{"a":"3) 추모하다","ev":"2번, 11번 문장","s":[[2,"However, it is actually a joyful Mexican holiday for remembering dead relatives.","하지만, 그것은 사실 고인이 된 친척들을 추모하기 위한 즐거운 멕시코 명절이다."],[11,"Nearly everyone eats this bread during the holiday to remember their dead relatives.","거의 모든 사람이 그들의 고인이 된 친척들을 추모하기 위해 그 명절 동안 이 빵을 먹는다."]],"w":"이 명절은 돌아가신 친척들을 기리는 날이에요(2번). 그래서 remember는 '기억하다'를 넘어 '추모하다'예요.","c":3},"h":"b574d29656"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nFamilies celebrate this holiday by setting up small tables for their dead relatives.","ko":"밑줄 친 their가 가리키는 것은?","sko":"가족들은 고인이 된 친척들을 위한 작은 탁자를 마련함으로써 이 명절을 기념한다.","opts":["가족들","고인이 된 친척들","아이들","영혼들"],"r":{"a":"1) 가족들","ev":"4번 문장","s":[[4,"Families celebrate this holiday by setting up small tables for their dead relatives.","가족들은 고인이 된 친척들을 위한 작은 탁자를 마련함으로써 이 명절을 기념한다."]],"w":"4번 문장은 ‘가족들은 그들의 고인이 된 친척들을 위한 작은 탁자를 마련함으로써 명절을 기념한다’는 뜻이에요. 친척들이 ‘그들의’ 친척이라고 할 때 their는 주어인 Families(가족들)를 가리켜요.","c":1,"k":"their = 가족들"},"pron":"their","h":"4bd044b68c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These sugar skulls are not always meant to be eaten.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 설탕 해골들이 항상 먹히려고 의도되는 것은 아니다.","opts":["이 설탕 해골은 항상 먹도록 만들어진다.","이 설탕 해골은 절대 먹을 수 없다.","이 설탕 해골은 가끔만 탁자 위에 놓인다.","이 설탕 해골은 항상 먹으려고 만드는 것은 아니다."],"r":{"a":"4) 이 설탕 해골은 항상 먹으려고 만드는 것은 아니다.","ev":"7~8번 문장","s":[[7,"These sugar skulls are not always meant to be eaten.","이 설탕 해골들이 항상 먹히려고 의도되는 것은 아니다."],[8,"However, children are often allowed to enjoy this sweet candy.","하지만, 아이들은 흔히 이 달콤한 사탕을 먹도록 허락된다."]],"w":"not always는 '항상 ~인 것은 아니다'라는 les is Day of the Dead bread.","이 탁자에서 가장 흔히 발견되는 음식은 망자의 날 빵이다."],[10,"These round, sweet loaves are baked with the shapes of bones on top.","이 둥글고 달콤한 빵 덩이는 위에 뼈 모양(의 반죽)을 얹은 채로 구워진다."]],"w":"9번에서 탁자에서 가장 흔히(commonly) 발견되는 음식이 망자의 날 빵이라고 하고, 10번에서 이 빵이 뼈 모양을 얹어 구워진다(baked)고 해요. joyful·sugar·celebrate·spirits는 most 뒤에 오는 부사도, are 뒤에 오는 과거분사도 아니에요.","c":null},"h":"9af975f9da"}]},{"u":8,"id":"rj3-08-3","no":3,"ko":"문만 여는 것이 아니야","items":[{"n":1,"t":"tf","q":"In ancient Greece and Rome, people believed that keys unlocked the door between heaven and earth.","ko":"고대 그리스와 로마에서 사람들은 열쇠가 하늘과 땅 사이의 문을 연다고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They believed that keys unlocked the door between heaven and earth.","그들은 열쇠가 하늘과 땅 사이의 문을 연다고 믿었다."]],"w":"4번 문장에서 그들은 열쇠가 하늘과 땅 사이의 문을 연다고 믿었다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"61c4df1e78"},{"n":2,"t":"tf","q":"In Japan, people believed that tying two keys together created a lucky charm.","ko":"일본에서 사람들은 두 개의 열쇠를 한데 매어 두는 것이 행운의 부적을 만든다고 믿었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"In Japan, people believed that tying three keys together created a lucky charm.","일본에서, 사람들은 세 개의 열쇠를 함께 묶는 것이 행운의 부적을 만드는 것이라고 믿었다."]],"w":"6번에서 일본에서는 세 개(three)의 열쇠를 함께 묶는 것이 행운의 부적을 만든다고 믿었어요. 두 개라는 말은 달라요.","c":"F"},"h":"55787c7b2f"},{"n":3,"t":"tf","q":"Some Romany people think that a door key over their bed gives them nightmares.","ko":"몇몇 집시들은 침대 위의 문 열쇠가 그들에게 악몽을 준다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"They also think that this keeps people from having nightmares.","그들은 또한 이것이 사람들이 악몽을 꾸는 것을 막아 준다고 생각한다."]],"w":"10번에서 그들은 이것이 사람들이 악몽을 꾸는 것을 막아 준다(keeps people from having nightmares)고 생각해요. 악몽을 준다는 말은 반대예요.","c":"F"},"h":"0fe3531578"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In Japan, people believed that tying three keys together created a lucky charm.)","ko":"일본에서, 사람들은 세 개의 열쇠를 함께 ( )가 행운의 부적을 만든다고 믿었다.","opts":["풀기","자르기","묶기","던지기"],"word":"tying","r":{"a":"3) 묶기","ev":"6번 문장","s":[[6,"In Japan, people believed that tying three keys together created a lucky charm.","일본에서, 사람들은 세 개의 열쇠를 함께 묶는 것이 행운의 부적을 만드는 것이라고 믿었다."]],"w":"세 개의 열쇠를 한데 모아 행운의 부적으로 만든다는 이야기예요. 그래서 tying은 '묶는 것'이에요.","c":3},"h":"e9dfe8e0de"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The three keys were said to unlock the doors to love, money, and well-being.)","ko":"그 세 개의 열쇠들은 사랑과 돈, ( )으로 가는 문을 연다고 전해졌다.","opts":["질병","행복","가난","여행"],"word":"well-being","r":{"a":"2) 행복","ev":"7번 문장","s":[[7,"The three keys were said to unlock the doors to love, money, and well-being.","그 세 개의 열쇠들은 사랑과 돈, 행복으로 가는 문을 연다고 전해졌다."]],"w":"사랑과 돈과 함께 나오는 좋은 것이에요. 열쇠가 열어 주는 좋은 문이므로 well-being은 '행복'이에요.","c":2},"h":"342668e91c"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nSome Romany people in Eastern Europe hang a door key with a metal ring over their bed.","ko":"밑줄 친 their가 가리키는 것은?","sko":"동유럽의 몇몇 집시들은 금속 고리를 가진 문 열쇠를 그들의 침대 위에 걸어 둔다.","opts":["집시들","동유럽","금속 고리","문 열쇠"],"r":{"a":"1) 집시들","ev":"8번 문장","s":[[8,"Some Romany people in Eastern Europe hang a door key with a metal ring over their bed.","동유럽의 몇몇 집시들은 금속 고리를 가진 문 열쇠를 그들의 침대 위에 걸어 둔다."]],"w":"8번 문장은 ‘동유럽의 몇몇 집시들은 금속 고리를 가진 문 열쇠를 그들의 침대 위에 걸어 둔다’는 뜻이에요. 침대의 주인인 their는 주어인 Some Romany people(집시들)을 가리켜요.","c":1,"k":"their = 집시들"},"pron":"their","h":"a936545fec"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They also saw them as symbols for remembering the past and looking forward to the future.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 또한 그것들을 과거를 기억하고 미래를 고대하는 상징으로 보았다.","opts":["그들은 열쇠를 과거를 잊고 미래를 걱정하는 상징으로 보았다.","그들은 열쇠를 미래만 고대하는 상징으로 보았다.","그들은 열쇠를 과거에 일어난 일을 숨기는 도구로 보았다.","그들은 열쇠를 과거를 기억하고 미래를 고대하는 상징으로 보았다."],"r":{"a":"4) 그들은 열쇠를 과거를 기억하고 미래를 고대하는 상징으로 보았다.","ev":"5번 문장","s":[[5,"They also saw them as symbols for remembering the past and looking forward to the future.","그들은 또한 그것들을 과거를 기억하고 미래를 고대하는 상징으로 보았다."]],"w":"see A as B는 'A를 B로 보다'예요. remembering the past는 '과거를 기억하는 것', looking forward to the future는 '미래를 고대하는 것'이에요.","c":4},"h":"eb569f2029"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대부분의 사람들은 열쇠를 특별한 문화에서만 쓰는 이상한 도구로 생각한다.","대부분의 사람들은 열쇠를 문을 열거나 시동을 거는 데 쓴다.","열쇠는 문을 잠그거나 비행기를 모는 데 쓰인다.","열쇠로는 자동차에 시동을 걸 수 없다."],"opts":["Most people think that keys are strange tools used only in special cultures.","Most people use keys to unlock doors or start cars.","Keys are used to lock doors or fly airplanes.","Keys cannot be used to start cars."],"r":{"a":"2) Most people use keys to unlock doors or start cars.","ev":"1번 문장","s":[[1,"To most people, keys are common tools that are used to unlock doors or start cars.","대부분의 사람들에게, 열쇠는 문을 열거나 자동차 시동을 거는 데 사용되는 흔한 도구이다."]],"w":"1번에서 대부분의 사람들에게 열쇠는 문을 열거나 자동차 시동을 거는 데 쓰이는 흔한 도구라고 해요. 이상한 도구도 아니고, 비행기와도 상관없으며, 자동차 시동도 걸 수 있어요.","c":2},"h":"efa71898ab"},{"n":9,"t":"sum","q":"You may be (A) by the special (B) of keys in some cultures.","ko":"당신은 몇몇 문화들에서 열쇠의 특별한 (B)에 (A)지도 모른다.","oko":["(A) 놀랄 / (B) 가격들","(A) 지루해할 / (B) 의미들","(A) 놀랄 / (B) 의미들","(A) 무서워할 / (B) 색깔들","(A) 지루해할 / (B) 가격들"],"opts":["(A) surprised / (B) prices","(A) bored / (B) meanings","(A) surprised / (B) meanings","(A) scared / (B) colors","(A) bored / (B) prices"],"r":{"a":"3) (A) surprised / (B) meanings ((A) 놀랄 / (B) 의미들)","ev":"2번 문장","s":[[2,"However, you may be surprised by the special meanings of keys in some cultures.","하지만, 당신은 몇몇 문화들에서의 열쇠의 특별한 의미들에 놀랄지도 모른다."]],"w":"2번 문장에서 몇몇 문화들에서의 열쇠의 특별한 의미들(special meanings)에 놀랄지도(may be surprised) 모른다고 해요. 가격이나 색깔 이야기는 없고, 지루해하거나 무서워한다는 말도 없어요.","c":3},"h":"9a211fd748"},{"n":10,"t":"fill","q":"In ancient Greece and Rome, people thought that keys allowed their [A] to reach the [B].","ko":"고대 그리스와 로마에서, 사람들은 열쇠들이 그들의 [A]이(가) [B]에게 도달하게 한다고 생각했다.","bank":["prayers","gods","doors","cars","tools","nightmares"],"bko":{"prayers":"기도들","gods":"신들","doors":"문들","cars":"자동차들","tools":"도구들","nightmares":"악몽들"},"r":{"a":"[A] prayers (기도들), [B] gods (신들)","ev":"3번 문장","s":[[3,"In ancient Greece and Rome, people thought that keys allowed their prayers to reach the gods.","고대 그리스와 로마에서, 사람들은 열쇠들이 그들의 기도가 신에게 도달하게 한다고 생각했다."]],"w":"3번 In ancient Greece and Rome, people thought that keys allowed their prayers to reach the gods에서 가져왔어요. 열쇠 덕분에 사람들의 기도가 신들에게 도달한다는 내용이라 [A]는 기도들, [B]는 신들이에요.","c":null},"h":"248daafb6b"}]},{"u":8,"id":"rj3-08-4","no":4,"ko":"물 맞으면 복이 와요","items":[{"n":1,"t":"tf","q":"People wash statues of the Buddha during Songkran.","ko":"사람들은 송끄란 동안 불상을 닦는다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"People clean their homes and wash statues of the Buddha.","사람들은 그들의 집을 청소하고 불상을 닦는다."]],"w":"6번 문장에서 사람들은 그들의 집을 청소하고 불상(statues of the Buddha)을 닦는다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"8787d58214"},{"n":2,"t":"tf","q":"Only Thai people come to watch and join the action.","ko":"오직 태국 사람들만 그 행동을 구경하고 참여하러 온다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"People from all around the world head to Thailand to watch and participate in the action.","전 세계의 사람들이 그 행동을 구경하고 참여하기 위해 태국으로 향한다."]],"w":"9번에서 전 세계(all around the world)의 사람들이 구경하고 참여하러 태국으로 향한다고 해요. 태국 사람들만이라는 말은 달라요.","c":"F"},"h":"7f727e0a89"},{"n":3,"t":"tf","q":"People pour water on the hands of children as a sign of respect.","ko":"사람들은 존경의 표시로 아이들의 손에 물을 붓는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"They also pour water on the hands of the elderly as a sign of respect.","그들은 또한 존경의 표시로서 어르신들의 손에 물을 붓는다."]],"w":"7번에서 존경의 표시로 물을 붓는 대상은 어르신들(the elderly)이에요. 아이들이 아니에요.","c":"F"},"h":"1636bb0b66"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Over time, this has evolved into a giant water fight where people splash strangers with water.)","ko":"시간이 지나면서, 이것은 사람들이 낯선 사람들에게 물을 ( ) 거대한 물싸움으로 발전했다.","opts":["닦는","끼얹는","마시는","얼리는"],"word":"splash","r":{"a":"2) 끼얹는","ev":"8번 문장","s":[[8,"Over time, this has evolved into a giant water fight where people splash strangers with water.","시간이 지나면서, 이것은 사람들이 낯선 사람들에게 물을 끼얹는 거대한 물싸움으로 발전했다."]],"w":"물싸움이 되었다고 했으니 물을 던지듯 끼얹는 동작이에요. 그래서 splash는 '(물을) 끼얹다'예요.","c":2},"h":"5feff62ac4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (People from all around the world head to Thailand to watch and participate in the action.)","ko":"전 세계의 사람들이 그 행동을 구경하고 참여하기 위해 태국으로 ( ).","opts":["숨는다","돌아온다","도망친다","향한다"],"word":"head","r":{"a":"4) 향한다","ev":"9번 문장","s":[[9,"People from all around the world head to Thailand to watch and participate in the action.","전 세계의 사람들이 그 행동을 구경하고 참여하기 위해 태국으로 향한다."]],"w":"구경하고 참여하기 위해 태국으로 간다는 뜻이에요. 여기서 head는 '머리'가 아니라 '향하다'예요.","c":4},"h":"7d755f795a"},{"n":6,"t":"ref","q":"What does the underlined \"when\" refer to?\nThis exciting festival takes place in April, when the new year starts based on the Thai calendar.","ko":"밑줄 친 when이 가리키는 것은?","sko":"이 신나는 축제는 4월에 개최되는데, 그때 태국 달력에 근거하여 새해가 시작된다.","opts":["4월","태국","축제","달력"],"r":{"a":"1) 4월","ev":"4번 문장","s":[[4,"This exciting festival takes place in April, when the new year starts based on the Thai calendar.","이 신나는 축제는 4월에 개최되는데, 그때 태국 달력에 근거하여 새해가 시작된다."]],"w":"4번 문장은 ‘이 축제는 4월에 열리는데, when(그때) 태국 달력에 근거해 새해가 시작된다’는 뜻이에요. when은 바로 앞의 April(4월)을 가리켜요.","c":1,"k":"when = 4월"},"pron":"when","h":"600d43b274"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You are walking down a crowded street in Bangkok.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신은 방콕에서 붐비는 거리를 걷고 있다.","opts":["당신은 방콕의 붐비는 거리를 걷고 있다.","당신은 방콕의 한적한 거리를 걷고 있다.","당신은 방콕의 거리를 뛰어가고 있다.","당신은 방콕에서 붐비는 시장을 구경했다."],"r":{"a":"1) 당신은 방콕의 붐비는 거리를 걷고 있다.","ev":"1번 문장","s":[[1,"You are walking down a crowded street in Bangkok.","당신은 방콕에서 붐비는 거리를 걷고 있다."]],"w":"You are walking down a crowded street in Bangkok은 ‘당신은 방콕의 붐비는 거리를 걷고 있다’는 뜻이에요. crowded는 ‘붐비는’이고 walking down은 ‘~을 따라 걷고 있다’예요.","c":1},"h":"45bc6f992e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["송끄란은 낯선 사람들과 싸우기만 하는 축제이다.","송끄란은 음식을 많이 먹는 축제이다.","송끄란은 물 없이 즐기는 축제이다.","송끄란은 깨끗이 하고 새로 시작하는 것에 관한 축제이다."],"opts":["Songkran is a festival only for fighting with strangers.","Songkran is a festival about eating a lot of food.","Songkran is a festival enjoyed without any water.","Songkran is a festival about cleaning and making a new start."],"r":{"a":"4) Songkran is a festival about cleaning and making a new start.","ev":"5번 문장","s":[[5,"The festival is about cleaning and making a new start.","그 축제는 깨끗이 하고 새로운 시작을 하는 것에 관한 것이다."]],"w":"5번에서 송끄란은 깨끗이 하고 새로운 시작을 하는 것에 관한 축제라고 해요. 싸우기만 하는 축제도 아니고(6~7번), 음식 이야기는 없으며, 물이 중심이에요(2번).","c":4},"h":"0de2823d42"},{"n":9,"t":"sum","q":"Suddenly, people (A) buckets of water on you and (B) water into the crowd!","ko":"갑자기, 사람들이 당신에게 양동이째 물을 (A) 군중에게 물을 (B)!","oko":["(A) 마시고 / (B) 쏜다","(A) 퍼붓고 / (B) 숨긴다","(A) 퍼붓고 / (B) 쏜다","(A) 마시고 / (B) 숨긴다","(A) 숨기고 / (B) 쏜다"],"opts":["(A) drink / (B) shoot","(A) throw / (B) hide","(A) throw / (B) shoot","(A) drink / (B) hide","(A) hide / (B) shoot"],"r":{"a":"3) (A) throw / (B) shoot ((A) 퍼붓고 / (B) 쏜다)","ev":"2번 문장","s":[[2,"Suddenly, people throw buckets of water on you and shoot water into the crowd!","갑자기, 사람들이 양동이째 물을 당신에게 퍼붓고 군중에게 물을 쏜다!"]],"w":"2번 문장에서 사람들이 당신에게 양동이째 물을 퍼붓고(throw) 군중에게 물을 쏜다(shoot)고 해요. 물을 마시거나 숨긴다는 말은 없어요.","c":3},"h":"69d52956ca"},{"n":10,"t":"fill","q":"It is supposed to [A] away bad things. It also [B] good things to come during the new year!","ko":"그것은 나쁜 것들을 [A] 것으로 여겨진다. 그것은 또한 새해 동안 좋은 것들이 오게 [B]!","bank":["chase","allows","buckets","statues","strangers","respect"],"bko":{"chase":"쫓아내는","allows":"한다(allow의 3인칭 단수 현재)","buckets":"양동이들","statues":"조각상들","strangers":"낯선 사람들","respect":"존경"},"r":{"a":"[A] chase (쫓아내는), [B] allows (한다(allow의 3인칭 단수 현재))","ev":"11~12번 문장","s":[[11,"It is supposed to chase away bad things.","그것은 나쁜 것들을 쫓아내는 것으로 여겨진다."],[12,"It also allows good things to come during the new year!","그것은 또한 새해 동안 좋은 것들이 오게 한다!"]],"w":"11번 It is supposed to chase away bad things, 12번 It also allows good things to come during the new year에서 가져왔어요. [A]는 to 뒤의 동사원형 chase, [B]는 주어 It에 맞춘 allows예요. 나머지는 명사라 동사 자리에 들어갈 수 없어요.","c":null},"h":"d0cffc9e74"}]},{"u":9,"id":"rj3-09-1","no":1,"ko":"기저귀의 대변신!","items":[{"n":1,"t":"tf","q":"Scientists added used diapers to concrete to replace some of the sand.","ko":"과학자들은 모래 일부를 대체하기 위해 콘크리트에 사용한 기저귀를 넣었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They added used diapers to replace some of the sand in concrete.","그들은 콘크리트의 모래 일부를 대체하기 위해 사용한 기저귀를 넣었다."]],"w":"6번 문장에 They added used diapers to replace some of the sand in concrete가 그대로 나와요. 모래 일부를 사용한 기저귀로 바꿔 넣었다는 내용과 일치해요.","c":"T"},"h":"6cb202dfab"},{"n":2,"t":"tf","q":"Used diapers were put into concrete without being cleaned.","ko":"사용한 기저귀는 세탁되지 않은 채로 콘크리트에 넣어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Used diapers were collected, cleaned, and cut into small pieces.","사용한 기저귀를 모으고, 세탁하고, 작은 조각들로 잘랐다."]],"w":"7번 문장에서 사용한 기저귀는 모으고(collected), 세탁하고(cleaned), 작은 조각으로 잘랐다(cut)고 해요. 세탁하지 않았다는 말은 본문과 달라요.","c":"F"},"h":"d889fb9043"},{"n":3,"t":"tf","q":"Researchers are also trying to find out how well the new concrete can block out heat and sound.","ko":"연구원들은 또한 새 콘크리트가 열과 소리를 얼마나 잘 차단하는지 알아내려고 노력하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Researchers are also trying to find out how well the new concrete can block out heat and sound.","연구원들은 또한 그 새로운 콘크리트가 얼마나 열과 소리를 잘 차단할 수 있는지 알아내기 위해 노력하고 있다."]],"w":"12번 문장에 그대로 나와요. 연구원들은 새 콘크리트의 열·소리 차단 능력을 알아내려고 노력 중이에요.","c":"T"},"h":"4190a609ba"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, there is a limited amount of sand on earth.)","ko":"하지만, 지구에는 ( ) 양의 모래가 있다.","opts":["무한한","제한된","깨끗한","흔한"],"word":"limited","r":{"a":"2) 제한된","ev":"3번 문장","s":[[3,"However, there is a limited amount of sand on earth.","하지만, 지구에는 제한된 양의 모래가 있다."]],"w":"3번에서 However(하지만)로 문제가 시작돼요. 지구의 모래가 한정되어 있다는 뜻이라 limited는 '제한된, 한정된'이에요. 4번의 채굴 문제와 이어져요.","c":2},"h":"e7d0cbc2d8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists had a creative solution to this problem.)","ko":"과학자들은 이 문제에 대한 ( ) 해결책을 가지고 있었다.","opts":["위험한","평범한","느린","창의적인"],"word":"creative","r":{"a":"4) 창의적인","ev":"5번 문장","s":[[5,"Scientists had a creative solution to this problem.","과학자들은 이 문제에 대한 창의적인 해결책을 가지고 있었다."]],"w":"5번은 기저귀를 콘크리트에 넣는다는 새로운 아이디어를 소개하는 문장이에요. 그래서 creative는 '창의적인'이에요. '평범한'은 오히려 반대 뜻이에요.","c":4},"h":"6dba0ac61b"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAfter all, there are too many used diapers, and they are basically free.","ko":"밑줄 친 they가 가리키는 것은?","sko":"무엇보다 사용한 기저귀들은 너무 많고, 그것들은 기본적으로 공짜이다.","opts":["과학자들","새 콘크리트","사용한 기저귀들","지구의 모래"],"r":{"a":"3) 사용한 기저귀들","ev":"11번 문장","s":[[11,"After all, there are too many used diapers, and they are basically free.","무엇보다 사용한 기저귀들은 너무 많고, 그것들은 기본적으로 공짜이다."]],"w":"11번 문장은 사용한 기저귀가 너무 많고 '그것들이' 기본적으로 공짜라는 내용이에요. 같은 문장 앞쪽의 복수 명사 used diapers를 가리켜요. concrete는 단수라서 they가 될 수 없어요.","c":3},"h":"f52fd5cc22"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Adding diapers and reducing sand in concrete could make it cheaper to build houses.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"기저귀를 넣어 콘크리트의 모래를 줄이는 것은 집을 짓는 것을 더 저렴하게 만들 수 있다.","opts":["기저귀를 넣고 모래를 줄이면 집을 짓는 것이 더 저렴해질 수 있다.","기저귀를 넣고 모래를 줄이면 집을 짓는 것이 더 비싸질 수 있다.","모래를 더 넣으면 기저귀를 만드는 것이 더 저렴해질 수 있다.","집을 지으면 콘크리트에 기저귀를 넣는 것이 더 쉬워질 수 있다."],"r":{"a":"1) 기저귀를 넣고 모래를 줄이면 집을 짓는 것이 더 저렴해질 수 있다.","ev":"10번 문장","s":[[10,"Adding diapers and reducing sand in concrete could make it cheaper to build houses.","기저귀를 넣어 콘크리트의 모래를 줄이는 것은 집을 짓는 것을 더 저렴하게 만들 수 있다."]],"w":"Adding diapers and reducing sand in concrete could make it cheaper to build houses는 ‘콘크리트에 기저귀를 넣고 모래를 줄이면 집을 짓는 것이 더 저렴해질 수 있다’는 뜻이에요. cheaper는 ‘더 저렴한’이고, could는 ‘~할 수도 있다’예요.","c":1},"h":"4a5ce40ffc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["연구원들은 기저귀 콘크리트가 기존 콘크리트보다 더 약하다는 것을 발견했다.","과학자들은 콘크리트의 모래를 전부 기저귀로 바꿨다.","연구원들은 모래와 기저귀 조각을 다르게 섞어 실험했다.","기저귀 콘크리트는 이미 대부분의 집을 짓는 데 쓰인다."],"opts":["Researchers found that diaper concrete was weaker than traditional concrete.","Scientists replaced all of the sand in concrete with diapers.","Researchers tested different mixes of sand and diaper pieces.","Diaper concrete is already used to build most houses."],"r":{"a":"3) Researchers tested different mixes of sand and diaper pieces. (연구원들은 모래와 기저귀 조각을 다르게 섞어 실험했다.)","ev":"6번, 8~10번 문장","s":[[6,"They added used diapers to replace some of the sand in concrete.","그들은 콘크리트의 모래 일부를 대체하기 위해 사용한 기저귀를 넣었다."],[8,"The researchers tested different mixes of sand and diaper pieces.","연구원들은 모래와 기저귀 조각들의 다른 혼합물들을 실험했다."],[9,"They discovered that the safety and strength of the new concrete were as good as traditional concrete.","그들은 새로운 콘크리트의 안전성과 강도가 기존의 콘크리트만큼 좋다는 것을 발견했다."],[10,"Adding diapers and reducing sand in concrete could make it cheaper to build houses.","기저귀를 넣어 콘크리트의 모래를 줄이는 것은 집을 짓는 것을 더 저렴하게 만들 수 있다."]],"w":"8번에서 연구원들은 모래와 기저귀 조각의 다른 혼합물들을 실험했다고 해요. 모래의 ‘일부’만 대체했고(6번), 새 콘크리트는 기존 콘크리트만큼 좋았으며(9번), 이미 대부분의 집에 쓰인다는 말은 없어요(10번).","c":3},"h":"4057cc05f9"},{"n":9,"t":"sum","q":"Mining sand is (A) for the environment and can lead to the loss of animals’ (B).","ko":"모래를 채굴하는 것은 환경에 (A)고 동물들의 (B) 손실로 이어질 수 있다.","oko":["(A) 무해하 / (B) 서식지","(A) 해롭 / (B) 먹이","(A) 해롭 / (B) 서식지","(A) 유용하 / (B) 먹이","(A) 유용하 / (B) 서식지"],"opts":["(A) harmless / (B) habitat","(A) bad / (B) food","(A) bad / (B) habitat","(A) useful / (B) food","(A) useful / (B) habitat"],"r":{"a":"3) (A) bad / (B) habitat ((A) 해롭 / (B) 서식지)","ev":"4번 문장","s":[[4,"Also, mining sand is bad for the environment and can lead to the loss of animals’ habitat.","또한, 모래를 채굴하는 것은 환경에 해롭고 동물들의 서식지 손실로 이어질 수 있다."]],"w":"4번 문장에서 모래를 채굴하는 것은 환경에 해롭고(bad) 동물들의 서식지(habitat) 손실로 이어질 수 있다고 해요. 무해하거나 유용하다는 말은 없고, 먹이 이야기도 없어요.","c":3},"h":"eed1aeb965"},{"n":10,"t":"fill","q":"They discovered that the [A] and strength of the new concrete were as [B] as traditional concrete.","ko":"그들은 새로운 콘크리트의 [A]과(와) 강도가 기존의 콘크리트만큼 [B] 것을 발견했다.","bank":["safety","good","sand","pieces","houses","heat"],"bko":{"safety":"안전성","good":"좋다는","sand":"모래","pieces":"조각들","houses":"집들","heat":"열"},"r":{"a":"[A] safety (안전성), [B] good (좋다는)","ev":"9번 문장","s":[[9,"They discovered that the safety and strength of the new concrete were as good as traditional concrete.","그들은 새로운 콘크리트의 안전성과 강도가 기존의 콘크리트만큼 좋다는 것을 발견했다."]],"w":"9번 They discovered that the safety and strength of the new concrete were as good as traditional concrete에서 가져왔어요. strength와 함께 쓰인 명사 safety, as ~ as 사이의 형용사 good이 정답이에요. 나머지는 모두 명사라 [B] 자리에 들어갈 수 없어요.","c":null},"h":"b153adbfe6"}]},{"u":9,"id":"rj3-09-2","no":2,"ko":"지구를 살릴 조그만 영웅","items":[{"n":1,"t":"tf","q":"A beekeeper found that waxworms had eaten holes in a plastic bag.","ko":"양봉가는 벌집 나방 애벌레가 비닐봉지를 갉아 먹어 구멍을 낸 것을 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"After putting them in a plastic bag, she found that they had eaten holes in the bag!","그것들을 비닐봉지에 넣은 뒤에, 그녀는 그것들이 봉지를 갉아 먹어 구멍을 낸 것을 발견했다!"]],"w":"6번 문장에서 양봉가가 애벌레를 비닐봉지에 넣은 뒤, 애벌레들이 봉지를 갉아 구멍을 낸 것(had eaten holes)을 발견했어요.","c":"T"},"h":"6bb7a86c36"},{"n":2,"t":"tf","q":"Waxworms usually eat plastic in beehives.","ko":"벌집 나방 애벌레는 보통 벌집에서 플라스틱을 먹는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Waxworms usually eat the wax in beehives.","벌집 나방 애벌레는 보통 벌집의 밀랍을 먹는다."]],"w":"5번 문장에서 애벌레가 보통 먹는 것은 벌집의 밀랍(wax)이에요. 플라스틱을 먹는다는 말은 본문과 달라요.","c":"F"},"h":"309e1f7e54"},{"n":3,"t":"tf","q":"Scientists have already made sprays that work like waxworm saliva.","ko":"과학자들은 이미 벌집 나방 애벌레의 타액처럼 작용하는 스프레이를 만들었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Scientists hope to create sprays that work like waxworm saliva.","과학자들은 벌집 나방 애벌레의 타액처럼 작용하는 스프레이를 만들길 희망한다."]],"w":"11번 문장에서 과학자들은 그런 스프레이를 만들기를 '희망한다'(hope to create)고 해요. 이미 만들었다는 말은 틀려요.","c":"F"},"h":"e0ca670f83"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A solution to these problems, however, may have been discovered by accident.)","ko":"하지만, 이런 문제들에 대한 한 해결책이 ( ) 발견되었을지도 모른다.","opts":["계획","우연","노력","허락"],"word":"accident","r":{"a":"2) 우연","ev":"3번 문장","s":[[3,"A solution to these problems, however, may have been discovered by accident.","하지만, 이런 문제들에 대한 한 해결책이 우연히 발견되었을지도 모른다."]],"w":"3번은 해결책이 계획해서 찾은 것이 아니라 뜻밖에 발견되었을지도 모른다는 말이에요. 그래서 by accident는 '우연히'예요. 4~6번에서 양봉가가 우연히 이 사실을 알게 돼요.","c":2},"h":"eeabfdde94"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To find out more, scientists conducted an experiment.)","ko":"더 알아내기 위해서, 과학자들은 실험을 ( ).","opts":["취소했다","구경했다","실시했다","상상했다"],"word":"conducted","r":{"a":"3) 실시했다","ev":"7번 문장","s":[[7,"To find out more, scientists conducted an experiment.","더 알아내기 위해서, 과학자들은 실험을 했다."]],"w":"7번에서 과학자들은 더 알아내려고 실험을 했어요. 8번에서 실험 내용(애벌레 100마리를 비닐봉지에 넣음)이 이어지므로 conduct는 '(실험을) 하다, 실시하다'예요.","c":3},"h":"faeaab2834"},{"n":6,"t":"ref","q":"What does the underlined \"who\" refer to?\nOne day, a beekeeper who is also a scientist removed some waxworms from her beehives.","ko":"밑줄 친 who가 가리키는 것은?","sko":"어느 날, 과학자이기도 한 한 양봉가가 그녀의 벌집에서 몇 마리의 벌집 나방 애벌레를 제거했다.","opts":["양봉가","과학자들","벌집 나방 애벌레","벌집"],"r":{"a":"1) 양봉가","ev":"4번 문장","s":[[4,"One day, a beekeeper who is also a scientist removed some waxworms from her beehives.","어느 날, 과학자이기도 한 한 양봉가가 그녀의 벌집에서 몇 마리의 벌집 나방 애벌레를 제거했다."]],"w":"4번 문장은 ‘과학자이기도 한 양봉가가 벌집에서 벌집 나방 애벌레를 제거했다’는 뜻이에요. who 뒤의 is also a scientist(과학자이기도 한)는 바로 앞의 a beekeeper(양봉가)를 설명해요.","c":1,"k":"who = 양봉가"},"pron":"who","h":"c174ded23e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The waxworms ate 92 milligrams of plastic in 12 hours, which is more than 1,000 times faster than any other creature.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 벌집 나방 애벌레들은 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 이상 더 빠르다.","opts":["벌집 나방 애벌레 1,000마리가 12시간 동안 플라스틱 92밀리그램을 먹었다.","벌집 나방 애벌레는 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 넘게 느리다.","벌집 나방 애벌레는 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 넘게 빠르다.","벌집 나방 애벌레는 92시간 동안 12밀리그램의 플라스틱을 먹었다."],"r":{"a":"3) 벌집 나방 애벌레는 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 넘게 빠르다.","ev":"8~9번 문장","s":[[8,"They put 100 waxworms in a plastic bag.","그들은 비닐봉지 하나에 벌집 나방 애벌레 100마리를 넣었다."],[9,"The waxworms ate 92 milligrams of plastic in 12 hours, which is more than 1,000 times faster than any other creature.","그 벌집 나방 애벌레들은 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 이상 더 빠르다."]],"w":"which 앞은 12시간 동안 92밀리그램의 플라스틱을 먹었다는 내용이고, which 뒤는 다른 생물보다 1,000배 넘게 '빠르다'예요. 8번에서 애벌레는 100마리를 썼고, 숫자 12와 92의 자리도 바뀌면 안 돼요.","c":3},"h":"2f40d1bb40"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 양봉가는 과학자가 아니었다.","벌집 나방 애벌레는 유리병에 구멍을 냈다.","과학자들은 실험을 위해 벌집 나방 애벌레 100마리를 비닐봉지에 넣었다.","벌집 나방 애벌레는 다른 생물처럼 플라스틱을 천천히 먹었다."],"opts":["The beekeeper was not a scientist.","Waxworms ate holes in a glass jar.","Scientists put 100 waxworms in a plastic bag for an experiment.","Waxworms ate plastic slowly, like other creatures."],"r":{"a":"3) Scientists put 100 waxworms in a plastic bag for an experiment.","ev":"4, 6, 7~9번 문장","s":[[4,"One day, a beekeeper who is also a scientist removed some waxworms from her beehives.","어느 날, 과학자이기도 한 한 양봉가가 그녀의 벌집에서 몇 마리의 벌집 나방 애벌레를 제거했다."],[6,"After putting them in a plastic bag, she found that they had eaten holes in the bag!","그것들을 비닐봉지에 넣은 뒤에, 그녀는 그것들이 봉지를 갉아 먹어 구멍을 낸 것을 발견했다!"],[7,"To find out more, scientists conducted an experiment.","더 알아내기 위해서, 과학자들은 실험을 했다."],[8,"They put 100 waxworms in a plastic bag.","그들은 비닐봉지 하나에 벌집 나방 애벌레 100마리를 넣었다."],[9,"The waxworms ate 92 milligrams of plastic in 12 hours, which is more than 1,000 times faster than any other creature.","그 벌집 나방 애벌레들은 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 이상 더 빠르다."]],"w":"7번에서 과학자들이 더 알아내려고 실험을 했고, 8번에서 그 실험을 위해 애벌레 100마리를 비닐봉지에 넣었어요. 양봉가는 과학자이기도 했고(4번), 구멍이 난 것은 비닐봉지이고(6번), 애벌레는 다른 생물보다 훨씬 빨랐어요(9번).","c":3},"h":"ee6a01baa3"},{"n":9,"t":"sum","q":"This plastic waste stays in landfills for too (A) before (B) down.","ko":"이 플라스틱 쓰레기는 (B) 전에 너무 (A) 쓰레기 매립지에 남는다.","oko":["(A) 짧게 / (B) 분해되기","(A) 오래 / (B) 지어지기","(A) 오래 / (B) 분해되기","(A) 짧게 / (B) 지어지기","(A) 늦게 / (B) 분해되기"],"opts":["(A) short / (B) breaking","(A) long / (B) building","(A) long / (B) breaking","(A) short / (B) building","(A) late / (B) breaking"],"r":{"a":"3) (A) long / (B) breaking ((A) 오래 / (B) 분해되기)","ev":"2번 문장","s":[[2,"Moreover, this plastic waste stays in landfills, for too long before breaking down.","게다가, 이 플라스틱 쓰레기는 분해되기 전에 너무 오래 쓰레기 매립지에 남는다."]],"w":"2번 문장에서 이 플라스틱 쓰레기는 분해되기(breaking down) 전에 너무 오래(too long) 쓰레기 매립지에 남는다고 해요. 짧게 남는다는 말은 없고, 지어진다는 말도 없어요.","c":3},"h":"c827948975"},{"n":10,"t":"fill","q":"If they are [A], it will help us get [B] of our plastic waste!","ko":"만약 그들이 [A] 그것은 우리가 우리의 플라스틱 쓰레기를 [B] 것을 도울 것이다!","bank":["successful","rid","wax","holes","bags","experiment"],"bko":{"successful":"성공한다면","rid":"없애는(get rid of: ~을 없애다)","wax":"밀랍","holes":"구멍","bags":"봉지","experiment":"실험"},"r":{"a":"[A] successful (성공한다면), [B] rid (없애는(get rid of: ~을 없애다))","ev":"12번 문장","s":[[12,"If they are successful, it will help us get rid of our plastic waste!","만약 그들이 성공한다면, 그것은 우리가 플라스틱 쓰레기를 처리하는 것을 도울 것이다!"]],"w":"12번 If they are successful, it will help us get rid of our plastic waste!에서 가져왔어요. be동사 뒤에는 형용사 successful, get ~ of 사이에는 rid가 와서 ‘~을 없애다(get rid of)’가 돼요. 나머지는 명사라 두 자리에 들어갈 수 없어요.","c":null},"h":"6c10edddff"}]},{"u":9,"id":"rj3-09-3","no":3,"ko":"결국, 되돌아온다","items":[{"n":1,"t":"tf","q":"The Soviet government changed the direction of two rivers to send water to cotton fields.","ko":"소련 정부는 목화밭에 물을 보내기 위해 두 강의 방향을 바꾸었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"They changed the direction of two rivers flowing into the Aral Sea, a salt lake.","그들은 소금 호수인 아랄 해로 흐르는 두 강의 방향을 바꾸었다."],[3,"They did this in order to make water flow into nearby cotton fields.","그들은 물이 근처의 목화밭으로 흘러가도록 하기 위해 이렇게 했다."]],"w":"2번에서 두 강의 방향을 바꾸었고, 3번에서 물이 근처 목화밭으로 흘러가게 하려고 했다고 해요.","c":"T"},"h":"11e1a5be5b"},{"n":2,"t":"tf","q":"The Aral Sea is now bigger than its original size.","ko":"아랄 해는 지금 원래 크기보다 더 크다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The sea has shrunk to 10% of its original size in the past 60 years, and the region has been destroyed.","그 바다는 과거 60년 동안 원래 크기의 10%로 줄어들었고, 그 지역은 파괴되었다."]],"w":"6번 문장에서 바다는 원래 크기의 10%로 줄어들었다(has shrunk to 10%)고 해요. 더 커졌다는 말은 반대예요.","c":"F"},"h":"e114b0ab00"},{"n":3,"t":"tf","q":"The wind carried salty sand across the land.","ko":"바람이 소금기 있는 모래를 육지 전역으로 옮겼다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"It was picked up by the wind and carried across the land.","그것은 바람에 의해 집어 올려져 육지 전역으로 옮겨졌다."]],"w":"8번 문장에서 소금기 있는 모래가 바람에 의해 집어 올려져 육지 전역으로 옮겨졌다(carried across the land)고 해요.","c":"T"},"h":"3441997432"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the 1960s, the Soviet government made a terrible decision.)","ko":"1960년대에, 소련 정부는 끔찍한 ( )을 내렸다.","opts":["결정","경고","발표","실수"],"word":"decision","r":{"a":"1) 결정","ev":"1번 문장","s":[[1,"In the 1960s, the Soviet government made a terrible decision.","1960년대에, 소련 정부는 끔찍한 결정을 내렸다."]],"w":"1번 문장의 made a terrible decision은 '끔찍한 결정을 내렸다'예요. 2번에서 그 결정이 강의 방향을 바꾼 것이라고 알려 줘요.","c":1},"h":"9c7de6ea24"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This ruined farmers’ fields and made people sick.)","ko":"이는 농부들의 밭을 ( ) 사람들을 병들게 만들었다.","opts":["가꾸었고","넓혔고","망쳤고","팔았고"],"word":"ruined","r":{"a":"3) 망쳤고","ev":"9번 문장","s":[[9,"This ruined farmers’ fields and made people sick.","이는 농부들의 밭을 망쳤고 사람들을 병들게 만들었다."]],"w":"9번에서 소금기 있는 모래가 퍼져 농부들의 밭이 못 쓰게 되고 사람들이 병들었어요. 병들게 한 것과 이어지는 말이라 ruined는 '망쳤다'예요.","c":3},"h":"c03ee685b3"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAs the sea dried up, it left behind salty sand.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그 바다가 마르면서, 그것은 소금기 있는 모래를 남겼다.","opts":["바다","모래","바람","밭"],"r":{"a":"1) 바다","ev":"7번 문장","s":[[7,"As the sea dried up, it left behind salty sand.","그 바다가 마르면서, 그것은 소금기 있는 모래를 남겼다."]],"w":"7번 문장은 ‘그 바다가 마르면서, it이 소금기 있는 모래를 남겼다’는 뜻이에요. 마르면서 모래를 남긴 것은 같은 문장 앞부분의 the sea(바다)예요.","c":1,"k":"it = 바다"},"pron":"it","h":"cbbb8decdc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The results were shocking!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 결과는 충격적이었다!","opts":["그 결과는 충격적이었다.","그 결과는 기대한 대로였다.","그 결과는 아무도 알지 못했다.","그 결과는 매우 만족스러웠다."],"r":{"a":"1) 그 결과는 충격적이었다.","ev":"4번 문장","s":[[4,"The results were shocking!","그 결과는 충격적이었다!"]],"w":"The results were shocking!은 ‘그 결과는 충격적이었다!’라는 뜻이에요. shocking은 ‘충격적인’이라는 뜻이라 기대한 대로이거나 만족스러웠다는 말과 달라요.","c":1},"h":"38eb1c4f95"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아랄 해는 더 커지기 시작했다.","아랄 해는 마르기 시작했다.","아랄 해는 얼기 시작했다.","아랄 해는 다른 나라로 옮겨 가기 시작했다."],"opts":["The Aral Sea began to grow bigger.","The Aral Sea began to dry up.","The Aral Sea began to freeze.","The Aral Sea began to move to another country."],"r":{"a":"2) The Aral Sea began to dry up. (아랄 해는 마르기 시작했다.)","ev":"5번 문장","s":[[5,"The Aral Sea began to dry up.","아랄 해는 마르기 시작했다."]],"w":"5번에서 아랄 해는 마르기 시작했다고 해요. 커지거나 얼거나 다른 나라로 옮겨 갔다는 말은 없어요.","c":2},"h":"5eeb8ae030"},{"n":9,"t":"sum","q":"Today, the destruction of the Aral Sea is considered one of the most (A) environmental disasters in human (B).","ko":"오늘날, 아랄 해의 파괴는 인류 (B)에서 가장 (A) 환경 재해들 중 하나로 여겨진다.","oko":["(A) 비극적인 / (B) 미래","(A) 웃기는 / (B) 역사","(A) 비극적인 / (B) 역사","(A) 웃기는 / (B) 미래","(A) 운 좋은 / (B) 역사"],"opts":["(A) tragic / (B) future","(A) funny / (B) history","(A) tragic / (B) history","(A) funny / (B) future","(A) lucky / (B) history"],"r":{"a":"3) (A) tragic / (B) history ((A) 비극적인 / (B) 역사)","ev":"10번 문장","s":[[10,"Today, the destruction of the Aral Sea is considered one of the most tragic environmental disasters in human history.","오늘날, 아랄 해의 파괴는 인류 역사에서 가장 비극적인 환경 재해들 중 하나로 여겨진다."]],"w":"10번 문장에서 아랄 해의 파괴는 인류 역사(human history)에서 가장 비극적인(tragic) 환경 재해들 중 하나로 여겨진다고 해요. 웃기거나 운이 좋다는 말은 없고, 미래 이야기도 아니에요.","c":3},"h":"1b2ae9b475"},{"n":10,"t":"fill","q":"It [A] us that we should never destroy nature for human [B].","ko":"그것은 우리에게 우리가 인간의 [B]을(를) 위해 자연을 파괴하면 절대 안 된다는 것을 [A].","bank":["reminds","gain","salty","dried","carried","huge"],"bko":{"reminds":"상기시킨다","gain":"이득","salty":"소금기 있는","dried":"말랐다(dry의 과거)","carried":"옮겼다(carry의 과거)","huge":"거대한"},"r":{"a":"[A] reminds (상기시킨다), [B] gain (이득)","ev":"11번 문장","s":[[11,"It reminds us that we should never destroy nature for human gain.","그것은 우리에게 우리가 인간의 이득을 위해 자연을 파괴하면 절대 안 된다는 것을 상기시킨다."]],"w":"11번 It reminds us that we should never destroy nature for human gain에서 가져왔어요. [A]는 주어 It에 맞춘 동사 reminds, [B]는 for human 뒤의 명사 gain이에요. 나머지는 형용사나 과거형이라 두 자리에 들어갈 수 없어요.","c":null},"h":"1da274b44d"}]},{"u":9,"id":"rj3-09-4","no":4,"ko":"인류의 미래가 바로 이곳에","items":[{"n":1,"t":"tf","q":"The Svalbard Global Seed Vault used to be an old mine.","ko":"스발바르 국제 종자 저장고는 예전에 오래된 광산이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The vault used to be an old mine in an icy mountain in Norway.","그 저장고는 노르웨이에 있는 얼음으로 뒤덮인 산에 있는 오래된 광산이었다."]],"w":"7번 문장에서 저장고는 노르웨이의 얼음으로 뒤덮인 산에 있는 오래된 광산(an old mine)이었다고 해요.","c":"T"},"h":"7bf9071471"},{"n":2,"t":"tf","q":"The seeds in the vault are kept in ordinary paper bags.","ko":"저장고의 씨앗들은 평범한 종이봉투에 보관된다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"They are put into special bags that are free of moisture and air.","그것들은 습기와 공기가 없는 특별한 봉투 안에 넣어진다."]],"w":"10번 문장에서 씨앗은 습기와 공기가 없는 '특별한' 봉투(special bags)에 넣어진다고 해요. 평범한 종이봉투라는 말은 본문과 달라요.","c":"F"},"h":"161dbbcc70"},{"n":3,"t":"tf","q":"Scientists can use seeds to create new crops that may solve problems of the future.","ko":"과학자들은 씨앗을 이용해 미래의 문제들을 해결할지도 모르는 새로운 작물을 만들 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Using them, scientists can create new crops that may solve problems of the future, like unknown plant diseases or a lack of food.","그것들을 이용하여, 과학자들은 알려지지 않은 식물 병이나 식량 부족과 같은 미래의 문제들을 해결할지도 모르는 새로운 작물들을 만들어 낼 수 있다."]],"w":"2번 문장에서 씨앗을 이용해 미래의 문제(식물 병이나 식량 부족)를 해결할지도 모르는 새 작물을 만들 수 있다고 해요.","c":"T"},"h":"f382743b5d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The mine was renovated into a vault that can withstand extreme climate change and nuclear explosions.)","ko":"그 광산은 극심한 기후 변화와 핵폭발을 ( ) 수 있는 저장고로 개조되었다.","opts":["일으킬","예측할","견뎌낼","피할"],"word":"withstand","r":{"a":"3) 견뎌낼","ev":"8번 문장","s":[[8,"The mine was renovated into a vault that can withstand extreme climate change and nuclear explosions.","그 광산은 극심한 기후 변화와 핵폭발을 견뎌낼 수 있는 저장고로 개조되었다."]],"w":"8번은 광산을 극심한 기후 변화와 핵폭발에도 끄떡없는 저장고로 개조했다는 말이에요. 그래서 withstand는 '견뎌내다'예요. 피하는 것이 아니라 그 안에서 버티는 거예요.","c":3},"h":"9ab31aebb7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Using them, scientists can create new crops that may solve problems of the future, like unknown plant diseases or a lack of food.)","ko":"그것들을 이용하여, 과학자들은 알려지지 않은 식물 병이나 식량 ( )과 같은 미래의 문제들을 해결할지도 모르는 새로운 작물들을 만들어 낼 수 있다.","opts":["부족","맛","풍부함","선택"],"word":"lack","r":{"a":"1) 부족","ev":"2번 문장","s":[[2,"Using them, scientists can create new crops that may solve problems of the future, like unknown plant diseases or a lack of food.","그것들을 이용하여, 과학자들은 알려지지 않은 식물 병이나 식량 부족과 같은 미래의 문제들을 해결할지도 모르는 새로운 작물들을 만들어 낼 수 있다."]],"w":"2번은 미래에 생길 수 있는 문제 두 가지를 말해요. 식물 병과 'a lack of food'예요. 새 작물이 해결해야 할 문제이므로 lack은 '부족'이에요. '풍부함'은 문제가 아니라서 반대예요.","c":1},"h":"361f9229bd"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nScientists do the same thing with seeds —they put them in the Svalbard Global Seed Vault.","ko":"밑줄 친 they가 가리키는 것은?","sko":"과학자들은 씨앗들을 가지고 같은 일을 하는데, 그들은 그것들을 스발바르 국제 종자 저장고에 넣어 둔다.","opts":["과학자들","씨앗들","저장고들","광산들"],"r":{"a":"1) 과학자들","ev":"6번 문장","s":[[6,"Scientists do the same thing with seeds —they put them in the Svalbard Global Seed Vault.","과학자들은 씨앗들을 가지고 같은 일을 하는데, 그들은 그것들을 스발바르 국제 종자 저장고에 넣어 둔다."]],"w":"6번 문장은 ‘과학자들은 씨앗을 가지고 같은 일을 하는데, they는 그것들을 저장고에 넣어 둔다’는 뜻이에요. 씨앗을 넣어 두는 they는 문장 앞의 Scientists(과학자들)를 가리켜요.","c":1,"k":"they = 과학자들"},"pron":"they","h":"9143df905d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Deep inside the vault, seeds from around the world are kept.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 저장고의 안쪽 깊숙이, 전 세계에서 온 씨앗들이 보관되어 있다.","opts":["그 저장고 깊숙한 곳에 전 세계에서 온 씨앗들이 보관되어 있다.","그 저장고 입구에 전 세계의 씨앗들이 버려져 있다.","전 세계의 저장고에 이 씨앗들이 나뉘어 보관되어 있다.","그 저장고 깊숙한 곳에서 씨앗들이 새로 자라고 있다."],"r":{"a":"1) 그 저장고 깊숙한 곳에 전 세계에서 온 씨앗들이 보관되어 있다.","ev":"9번 문장","s":[[9,"Deep inside the vault, seeds from around the world are kept.","그 저장고의 안쪽 깊숙이, 전 세계에서 온 씨앗들이 보관되어 있다."]],"w":"Deep inside the vault, seeds from around the world are kept는 ‘저장고 깊숙한 곳에 전 세계에서 온 씨앗들이 보관되어 있다’는 뜻이에요. are kept는 ‘보관되어 있다’예요.","c":1},"h":"8eeb84abd4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 저장고는 그것을 지은 과학자의 이름을 따서 이름 지어졌다.","그 저장고는 ‘최후의 날 저장고’라는 별명이 붙여졌다.","그 저장고는 ‘씨앗 은행’이라는 별명이 붙여졌다.","그 저장고는 오래된 책을 보관하기 위해 지어졌다."],"opts":["The vault was named after the scientist who built it.","The vault was nicknamed the “doomsday vault.”","The vault was nicknamed the “seed bank.”","The vault was built to store old books."],"r":{"a":"2) The vault was nicknamed the “doomsday vault.” (그 저장고는 ‘최후의 날 저장고’라는 별명이 붙여졌다.)","ev":"12번 문장","s":[[12,"For this reason, the vault was nicknamed the “doomsday vault.”","이러한 이유로, 그 저장고는 ‘최후의 날 저장고’라는 별명이 붙여졌다."]],"w":"12번에서 그 저장고는 ‘최후의 날 저장고(doomsday vault)’라는 별명이 붙여졌다고 해요. 과학자의 이름이나 ‘씨앗 은행’이라는 말은 없고, 책을 보관하려고 지은 것도 아니에요.","c":2},"h":"164d26a8de"},{"n":9,"t":"sum","q":"Seeds are (A) resources, but they are (B). So scientists store them in a special vault.","ko":"씨앗은 (A) 자원이지만 (B). 그래서 과학자들은 씨앗을 특별한 저장고에 보관한다.","oko":["(A) 값싼 / (B) 늘어나고 있다","(A) 귀중한 / (B) 사라지고 있다","(A) 귀중한 / (B) 늘어나고 있다","(A) 위험한 / (B) 사라지고 있다","(A) 흔한 / (B) 자라고 있다"],"opts":["(A) cheap / (B) increasing","(A) valuable / (B) disappearing","(A) valuable / (B) increasing","(A) dangerous / (B) disappearing","(A) common / (B) growing"],"r":{"a":"2) (A) valuable / (B) disappearing","ev":"1, 3번 문장","s":[[1,"Seeds are one of our earth’s most valuable resources.","씨앗들은 우리 지구의 가장 귀중한 자원들 중 하나이다."],[3,"Sadly, this resource is disappearing.","애석하게도, 이 자원이 사라지고 있다."]],"w":"1번에서 씨앗은 가장 귀중한 자원들 중 하나(valuable)라고 하고, 3번에서 이 자원이 사라지고 있다(disappearing)고 해요. 그래서 4~6번에서 어떻게 보호할지 이야기하고 저장고가 나와요.","c":2},"h":"b5fc7152a3"},{"n":10,"t":"fill","q":"Therefore, all of the seeds will be [A] no matter what [B].","ko":"그러므로, 무슨 일이 [B] 모든 씨앗은 [A] 것이다.","bank":["safe","happens","bank","mine","bags","climate"],"bko":{"safe":"안전할","happens":"일어나더라도","bank":"은행","mine":"광산","bags":"봉투들","climate":"기후"},"r":{"a":"[A] safe (안전할), [B] happens (일어나더라도)","ev":"11번 문장","s":[[11,"Therefore, all of the seeds will be safe no matter what happens.","그러므로, 무슨 일이 일어나더라도 모든 씨앗은 안전할 것이다."]],"w":"11번 Therefore, all of the seeds will be safe no matter what happens에서 가져왔어요. will be 뒤에는 형용사 safe, no matter what 뒤에는 동사 happens가 와요. 나머지는 명사라 두 자리에 들어갈 수 없어요.","c":null},"h":"7fc7f93fc7"}]},{"u":10,"id":"rj3-10-1","no":1,"ko":"스페인의 특별한 마을","items":[{"n":1,"t":"tf","q":"About 3,000 people live in Setenil de las Bodegas.","ko":"약 3,000명이 Setenil de las Bodegas에 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Setenil de las Bodegas is a Spanish town with about 3,000 residents.","Setenil de las Bodegas는 약 3,000명의 주민이 사는 스페인의 마을이다."]],"w":"1번 문장에서 이 마을에는 약 3,000명의 주민(residents)이 있다고 해요.","c":"T"},"h":"2d3130a2f5"},{"n":2,"t":"tf","q":"The Moors built complete new homes instead of using natural caves.","ko":"무어인들은 자연 동굴을 이용하는 대신 완전히 새로운 집을 지었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Instead of building complete homes, they simply added walls to natural caves.","완전한 집을 짓는 대신, 그들은 그저 자연 동굴에 벽을 추가했다."]],"w":"6번 문장은 Instead of building complete homes로 시작해요. 무어인들은 완전한 집을 짓는 대신 자연 동굴에 벽만 더했어요. 새 집을 지었다는 말은 반대예요.","c":"F"},"h":"f0fcef4b6f"},{"n":3,"t":"tf","q":"The rock hanging over the streets of the town gives shade.","ko":"마을 거리 위에 걸쳐 있는 바위는 그늘을 만들어 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The rock hanging over the town’s streets even provides shade.","마을의 거리에 걸쳐 있는 바위는 심지어 그늘을 제공한다."]],"w":"11번 문장에서 마을의 거리에 걸쳐 있는 바위가 심지어 그늘(shade)까지 제공한다고 해요.","c":"T"},"h":"8f00b75af2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They were likely created by the Moors, who established the town in the 12th century.)","ko":"그것들은 아마 12세기에 그 마을을 ( ) 무어인들에 의해 만들어졌을 것이다.","opts":["허물었다","방문했다","설립했다","잊어버렸다"],"word":"established","r":{"a":"3) 설립했다","ev":"5번 문장","s":[[5,"They were likely created by the Moors, who established the town in the 12th century.","그것들은 아마 12세기에 그 마을을 설립한 무어인들에 의해 만들어졌을 것이다."]],"w":"5번에서 무어인들은 12세기에 마을을 세운 사람들이에요. 그래서 establish는 '설립하다, 세우다'예요. 마을이 만들어진 이야기이므로 '허물었다'는 맞지 않아요.","c":3},"h":"7febb62825"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These days, Setenil de las Bodegas attracts many tourists who want to take photos of this amazing town.)","ko":"요즘, Setenil de las Bodegas는 이 놀라운 마을의 사진을 찍고 싶어 하는 많은 관광객들을 ( ).","opts":["쫓아낸다","걱정시킨다","가르친다","끌어들인다"],"word":"attracts","r":{"a":"4) 끌어들인다","ev":"12번 문장","s":[[12,"These days, Setenil de las Bodegas attracts many tourists who want to take photos of this amazing town.","요즘, Setenil de las Bodegas는 이 놀라운 마을의 사진을 찍고 싶어 하는 많은 관광객들을 유치한다."]],"w":"12번에서 관광객들은 이 놀라운 마을의 사진을 찍고 싶어서 와요. 마을이 관광객을 끌어당기는 거라 attract는 '끌어들이다'예요.","c":4},"h":"f93ea4344b"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is located inside a narrow river valley.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 좁은 강 계곡 안에 위치해 있다.","opts":["마을","강","계곡","바위"],"r":{"a":"1) 마을","ev":"2번 문장","s":[[2,"It is located inside a narrow river valley.","그것은 좁은 강 계곡 안에 위치해 있다."]],"w":"2번 문장은 ‘It은 좁은 강 계곡 안에 위치해 있다’는 뜻이에요. 계곡 안에 위치한 것은 1번에서 소개한 스페인의 마을(Setenil de las Bodegas)이에요.","c":1,"k":"It = 마을"},"pron":"It","h":"b4f879c24e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Its homes were built inside the rock walls.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","s
