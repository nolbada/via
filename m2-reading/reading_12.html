ol has introduced a Food Diary Project.","지난주부터 우리 학교에서 식사 일기 프로젝트를 도입했어요.",1],["Our slogan?","우리의 슬로건은?",0],["\"Low sugar, low salt, and low fat.\"","'저당, 저염, 저지방'이에요.",0],["Do you want to join this project?","이 프로젝트에 참여하고 싶나요?",0],["Follow these steps.","다음 단계를 따라보세요.",0],["Choose healthy foods for your meals, take photos, and share them with us.","식사로 건강한 음식을 고르고, 사진을 찍어서 우리와 공유해 주세요.",0],["Don't forget to leave friendly comments on your friends' posts.","그리고 친구들의 게시물에 따뜻한 댓글 남기는 것도 잊지 마세요.",0],["Ready to join?","참여할 준비됐나요?",1],["Have fun sharing!","즐겁게 공유하세요!",0],["Sugar Free_Maya","무가당_Maya",1],["After a soccer game, I wanted to drink a cold soft drink.","축구 경기를 마친 후, 차가운 탄산음료를 마시고 싶었어요.",1],["But when I checked the ingredients, I realized that it has about 10 teaspoons of sugar.","하지만 재료를 확인해 보니 탄산음료에는 약 10티스푼의 설탕이 들어 있다는 것을 알게 되었어요.",0],["So, I decided to choose a cold herbal tea instead.","그래서 대신 차가운 허브차를 마시기로 했어요.",0],["It has far less sugar than a soft drink.","허브차는 탄산음료보다 설탕이 훨씬 적어요.",0],["I felt a lot healthier with the tea.","차 덕분에 훨씬 건강해진 느낌이었어요.",0],["↳ Wow, 10 teaspoons of sugar in a soft drink?","↳ 와, 탄산음료 하나에 설탕이 10티스푼이나 들어 있다고?",1],["Thanks for sharing this!","공유해 줘서 고마워!",0],["↳ I've never tried herbal tea after an exercise!","↳ 나는 운동 후에 허브차를 마셔 본 적은 없어!",1],["I'll give it a try next time.","다음에 한번 시도해 볼게.",0],["Salt Checker_Eunho","염분 측정기_은호",1],["This afternoon, my friends and I had malatang.","오늘 오후, 친구들과 저는 마라탕을 먹었어요.",1],["I thought it was a good choice because it had meat, vegetables, and noodles.","고기, 채소, 국수가 들어 있어서 좋은 선택인 줄 알았죠.",0],["But when I got home, I felt really thirsty.","하지만 집에 가서 너무 목이 말랐어요.",0],["I drank a lot of water, but it didn't help.","물을 많이 마셨는데도 도움이 되지 않았어요.",0],["I think malatang was too salty for me.","마라탕이 저한테는 너무 짰던 것 같아요.",0],["I've decided to eat less salty foods from now on.","이제부터 짠 음식을 덜 먹기로 결심했어요.",0],["↳ You know what?","↳ 그거 알아?",1],["Bananas can reduce the negative effects of salt in your body!","바나나가 체내 염분의 부정적인 영향을 줄여 준대!",0],["↳ That's a great tip!","↳ 정말 좋은 팁이네!",1],["I'll remember that!","기억할게!",0]];var RNUM=12;var TITLE_EN="Join Our Food Diary Project";var PASS_EN=["Join Our Food Diary Project","Hello, my awesome classmates!","Since last week, our school has introduced a Food Diary Project. Our slogan? \"Low sugar, low salt, and low fat.\" Do you want to join this project? Follow these steps. Choose healthy foods for your meals, take photos, and share them with us. Don't forget to leave friendly comments on your friends' posts.","Ready to join? Have fun sharing!","Sugar Free_Maya","After a soccer game, I wanted to drink a cold soft drink. But when I checked the ingredients, I realized that it has about 10 teaspoons of sugar. So, I decided to choose a cold herbal tea instead. It has far less sugar than a soft drink. I felt a lot healthier with the tea.","↳ Wow, 10 teaspoons of sugar in a soft drink? Thanks for sharing this!","↳ I've never tried herbal tea after an exercise! I'll give it a try next time.","Salt Checker_Eunho","This afternoon, my friends and I had malatang. I thought it was a good choice because it had meat, vegetables, and noodles. But when I got home, I felt really thirsty. I drank a lot of water, but it didn't help. I think malatang was too salty for me. I've decided to eat less salty foods from now on.","↳ You know what? Bananas can reduce the negative effects of salt in your body!","↳ That's a great tip! I'll remember that!"];var PASS_KO=["식사 일기 프로젝트에 참여하세요","안녕하세요, 우리 반 멋진 친구들!","지난주부터 우리 학교에서 식사 일기 프로젝트를 도입했어요. 우리의 슬로건은? '저당, 저염, 저지방'이에요. 이 프로젝트에 참여하고 싶나요? 다음 단계를 따라보세요. 식사로 건강한 음식을 고르고, 사진을 찍어서 우리와 공유해 주세요. 그리고 친구들의 게시물에 따뜻한 댓글 남기는 것도 잊지 마세요.","참여할 준비됐나요? 즐겁게 공유하세요!","무가당_Maya","축구 경기를 마친 후, 차가운 탄산음료를 마시고 싶었어요. 하지만 재료를 확인해 보니 탄산음료에는 약 10티스푼의 설탕이 들어 있다는 것을 알게 되었어요. 그래서 대신 차가운 허브차를 마시기로 했어요. 허브차는 탄산음료보다 설탕이 훨씬 적어요. 차 덕분에 훨씬 건강해진 느낌이었어요.","↳ 와, 탄산음료 하나에 설탕이 10티스푼이나 들어 있다고? 공유해 줘서 고마워!","↳ 나는 운동 후에 허브차를 마셔 본 적은 없어! 다음에 한번 시도해 볼게.","염분 측정기_은호"," function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}

  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });

function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}

  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
