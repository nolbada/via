<script>
var D=[{"n": 1, "tag": null, "en": "Welcome back to school. How does you feel today?", "ko": "학교에 다시 온 걸 환영해요. 오늘 기분은 어떤가요?", "ok": false, "foot": [], "fixes": [{"wrong": "does", "right": "do", "partial": false, "at": [5], "point": "의문문의 do/does: 주어 you에는 do 사용", "topic": "의문문의 do/does", "memo": "주어 you에는 do 사용"}]}, {"n": 2, "tag": null, "en": "Did you sleep good last night? Sleeping well can give you energy for the new school year.", "ko": "어젯밤에 잘 잤나요? 잘 자는 것은 당신에게 새 학년을 위한 에너지를 줄 수 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "good", "right": "well", "partial": false, "at": [3], "point": "형용사와 부사: 동사 sleep을 꾸미는 부사 well 사용", "topic": "형용사와 부사", "memo": "동사 sleep을 꾸미는 부사 well 사용"}]}, {"n": 3, "tag": null, "en": "Now, check you sleep habits with the list.", "ko": "이제, 목록을 보면서 당신의 수면 습관을 확인해 보세요.", "ok": false, "foot": [], "fixes": [{"wrong": "you", "right": "your", "partial": false, "at": [2], "point": "인칭대명사의 소유격: 명사 habits 앞에는 소유격 your 사용", "topic": "인칭대명사의 소유격", "memo": "명사 habits 앞에는 소유격 your 사용"}]}, {"n": 4, "tag": null, "en": "I ...", "ko": "나는 …", "ok": true, "foot": [], "fixes": []}, {"n": 5, "tag": null, "en": "□ go to bed at different time", "ko": "□ 다른 시각에 잠자리에 든다", "ok": false, "foot": [], "fixes": [{"wrong": "time", "right": "times", "partial": false, "at": [6], "point": "명사의 복수형: different 뒤에는 복수명사 times 사용", "topic": "명사의 복수형", "memo": "different 뒤에는 복수명사 times 사용"}]}, {"n": 6, "tag": null, "en": "□ drink a lots of energy drinks", "ko": "□ 에너지 음료를 많이 마신다", "ok": false, "foot": [], "fixes": [{"wrong": "lots", "right": "lot", "partial": false, "at": [3], "point": "수량 표현: '많은'은 a lot of 사용 (a lots of 아님)", "topic": "수량 표현", "memo": "'많은'은 a lot of 사용 (a lots of 아님)"}]}, {"n": 7, "tag": null, "en": "□ use my smartphone before sleeping", "ko": "□ 자기 전에 스마트폰을 사용한다", "ok": true, "foot": [], "fixes": []}, {"n": 8, "tag": null, "en": "□ sleep less than 8 hours a day", "ko": "□ 하루에 8시간보다 적게 잔다", "ok": true, "foot": [], "fixes": []}, {"n": 9, "tag": "추가 수면
