rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Today, people enjoy taking selfies. We can captures special moments with them.","ko":"오늘날, 사람들은 셀피 찍는 것을 즐깁니다. 우리는 그것들로 특별한 순간을 포착할 수 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"captures","right":"capture","partial":false,"at":[7],"point":"조동사: 조동사 can 뒤에는 동사원형: capture (captures 아님)","topic":"조동사","memo":"조동사 can 뒤에는 동사원형: capture (captures 아님)"}]},{"n":2,"tag":null,"en":"Long ago, people captured them own image in a different way. They painted pictures of themselves.","ko":"오래전, 사람들은 다른 방식으로 그들 자신의 모습을 포착했습니다. 그들은 그들 자신의 그림을 그렸습니다.","ok":false,"foot":[],"fixes":[{"wrong":"them","right":"their","partial":false,"at":[4],"point":"인칭대명사의 격: 명사 앞 소유격 their 사용 (them 아님)","topic":"인칭대명사의 격","memo":"명사 앞 소유격 their 사용 (them 아님)"}]},{"n":3,"tag":null,"en":"These pictures is self-portraits.","ko":"이 그림들이 자화상입니다.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[2],"point":"be동사 수일치·과거: 주어 These pictures(복수): are (is 아님)","topic":"be동사 수일치·과거","memo":"주어 These pictures(복수): are (is 아님)"}]},{"n":4,"tag":null,"en":"Selfies and self-portraits are similar.","ko":"셀피와 자화상은 비슷합니다.","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":null,"en":"Both show our image on a certain time. When we look at them, we can remember ourselves from that time.","ko":"둘 다 특정한 시간의 우리 모습을 보여 줍니다. 우리가 그것들을 볼 때, 우리는 그때의 우리 자신을 기억할 수 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"on","right":"at","partial":false,"at":[4],"point":"기본전치사: '어느 시점에'는 전치사 at 사용","topic":"기본전치사","memo":"'어느 시점에'는 전치사 at 사용"}]},{"n":6,"tag":null,"en":"They are like an diary.","ko":"그것들은 일기와 같습니다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[3],"point":"관사 a/an: 자음 소리 diary 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 diary 앞에는 a 사용"}]},{"n":7,"tag":null,"en":"We take selfies to remembering happy moments. Selfies capture the expressions on our faces at those times.","ko":"우리는 행복한 순간을 기억하기 위해 셀피를 찍습니다. 셀피는 그런 때의 우리 얼굴 표정을 포착합니다.","ok":false,"foot":[],"fixes":[{"wrong":"remembering","right":"remember","partial":false,"at":[4],"point":"to부정사: 목적을 나타내는 to부정사: to remember (remembering 아님)","topic":"to부정사","memo":"목적을 나타내는 to부정사: to remember (remembering 아님)"}]},{"n":8,"tag":null,"en":"We often look at selfie with our family and friends to bringing back those joyful feelings.","ko":"우리는 그런 즐거운 감정을 되살리기 위해 우리의 가족과 친구들과 함께 셀피를 자주 봅니다.","ok":false,"foot":[],"fixes":[{"wrong":"selfie","right":"selfies","partial":false,"at":[4],"point":"명사의 복수형: 복수 selfies 사용","topic":"명사의 복수형","memo":"복수 selfies 사용"},{"wrong":"bringing","right":"bring","partial":false,"at":[11],"point":"to부정사: to 뒤에는 동사원형 bring 사용","topic":"to부정사","memo":"to 뒤에는 동사원형 bring 사용"}]},{"n":9,"tag":null,"en":"Similarly, some painter made self-portraits to capture different times in their lives.","ko":"마찬가지로, 몇몇 화가들은 그들의 삶에서 다른 시기를 포착하기 위해 자화상을 만들었습니다.","ok":false,"foot":[],"fixes":[{"wrong":"painter","right":"painters","partial":false,"at":[2],"point":"명사의 복수형: some 뒤에는 복수명사 painters 사용","topic":"명사의 복수형","memo":"some 뒤에는 복수명사 painters 사용"}]},{"n":10,"tag":null,"en":"Rembrandt looked in the mirror and painted himself many times. He painted around 90 self-portraits in him life.","ko":"렘브란트는 거울을 보고 자기 자신을 여러 번 그렸습니다. 그는 그의 일생에서 약 90점의 자화상을 그렸습니다.","ok":false,"foot":[],"fixes":[{"wrong":"him","right":"his","partial":false,"at":[16],"point":"인칭대명사의 격: 명사 앞 소유격 his 사용 (him 아님)","topic":"인칭대명사의 격","memo":"명사 앞 소유격 his 사용 (him 아님)"}]},{"n":11,"tag":null,"en":"They show his face from youth to old age.","ko":"그것들은 젊은 시절부터 노년까지 그의 얼굴을 보여 줍니다.","ok":true,"foot":[],"fixes":[]},{"n":12,"tag":null,"en":"Selfies and self-portraits also has differences.","ko":"셀피와 자화상에는 차이점도 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"has","right":"have","partial":false,"at":[4],"point":"be동사/일반동사 수일치: 복수 주어에는 동사 have 사용","topic":"be동사/일반동사 수일치","memo":"복수 주어에는 동사 have 사용"}]},{"n":13,"tag":null,"en":"Taking a selfie is easily. We can do it quickly with our camera at any time.","ko":"셀피를 찍는 것은 쉽습니다. 우리는 언제든지 우리의 카메라로 그것을 빨리 할 수 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"easily","right":"easy","partial":false,"at":[4],"point":"형용사와 부사: be동사 뒤 보어 자리에는 형용사 easy 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어 자리에는 형용사 easy 사용"}]},{"n":14,"tag":null,"en":"However, painting a self-portrait takes some time. Also, a self-portrait shows an painter's personal painting style.","ko":"그러나, 자화상을 그리는 것은 시간이 조금 걸립니다. 또한, 자화상은 화가 개인의 화풍을 보여 줍니다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[11],"point":"관사 a/an: 자음 소리 painter's 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 painter's 앞에는 a 사용"}]},{"n":15,"tag":null,"en":"To paint a person, a painter need a model. Vincent van Gogh didn't have enough money to a model.","ko":"인물을 그리기 위해, 화가는 모델이 필요합니다. 빈센트 반 고흐는 모델을 위한 충분한 돈이 없었습니다.","ok":false,"foot":[],"fixes":[{"wrong":"need","right":"needs","partial":false,"at":[6],"point":"3인칭 단수 현재형: 3인칭 단수 주어 a painter에는 needs 사용","topic":"3인칭 단수 현재형","memo":"3인칭 단수 주어 a painter에는 needs 사용"},{"wrong":"to","right":"for","partial":false,"at":[16],"point":"기본전치사: '모델을 위한'은 전치사 for 사용","topic":"기본전치사","memo":"'모델을 위한'은 전치사 for 사용"}]},{"n":16,"tag":null,"en":"So he painted himself! When he painted his self-portraits, he chose brightly colors and applied many paint.","ko":"그래서 그는 자기 자신을 그렸습니다! 그가 자화상을 그릴 때, 그는 밝은색을 고르고 많은 물감을 발랐습니다.","ok":false,"foot":[],"fixes":[{"wrong":"brightly","right":"bright","partial":false,"at":[11],"point":"형용사와 부사: 명사 colors 앞에는 형용사 bright 사용","topic":"형용사와 부사","memo":"명사 colors 앞에는 형용사 bright 사용"},{"wrong":"many","right":"a lot of","partial":false,"at":[15],"point":"수량 형용사: 셀 수 없는 paint 앞에는 a lot of 사용","topic":"수량 형용사","memo":"셀 수 없는 paint 앞에는 a lot of 사용"}]},{"n":17,"tag":null,"en":"This became his unique style. We can see it in his others paintings too.","ko":"이것은 그의 독특한 스타일이 되었습니다. 우리는 이것을 그의 다른 그림들에서도 볼 수 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"others","right":"other","partial":false,"at":[11],"point":"형용사 other:  얼굴을 보여 줍니다.",0],["Selfies and self-portraits also have differences.","셀피와 자화상에는 차이점도 있습니다.",1],["Taking a selfie is easy.","셀피를 찍는 것은 쉽습니다.",1],["We can do it quickly with our camera at any time.","우리는 언제든지 우리의 카메라로 그것을 빨리 할 수 있습니다.",0],["However, painting a self-portrait takes some time.","그러나, 자화상을 그리는 것은 시간이 조금 걸립니다.",0],["Also, a self-portrait shows a painter's personal painting style.","또한, 자화상은 화가 개인의 화풍을 보여 줍니다.",0],["To paint a person, a painter needs a model.","인물을 그리기 위해, 화가는 모델이 필요합니다.",1],["Vincent van Gogh didn't have enough money for a model.","빈센트 반 고흐는 모델을 위한 충분한 돈이 없었습니다.",0],["So he painted himself!","그래서 그는 자기 자신을 그렸습니다!",0],["When he painted his self-portraits, he chose bright colors and applied a lot of paint.","그가 자화상을 그릴 때, 그는 밝은색을 고르고 많은 물감을 발랐습니다.",0],["This became his unique style.","이것은 그의 독특한 스타일이 되었습니다.",0],["We can see it in his other paintings too.","우리는 이것을 그의 다른 그림들에서도 볼 수 있습니다.",0],["We can express ourselves with selfies and self-portraits.","우리는 셀피와 자화상으로 우리 자신을 표현할 수 있습니다.",1],["Do you want to try?","한번 해 보실래요?",0]];var RNUM=41;var TITLE_EN="From the Self-Portrait to the Selfie";var PASS_EN=["From the Self-Portrait to the Selfie","Today, people enjoy taking selfies. We can capture special moments with them.","Long ago, people captured their own image in a different way. They painted pictures of themselves. These pictures are self-portraits.","Selfies and self-portraits are similar.","Both show our image at a certain time. When we look at them, we can remember ourselves from that time. They are like a diary.","We take selfies to remember happy moments. Selfies capture the expressions on our faces at those times. We often look at selfies with our family and friends to bring back those joyful feelings.","Similarly, some painters made self-portraits to capture different times in their lives. Rembrandt looked in the mirror and painted himself many times. He painted around 90 self-portraits in his life. They show his face from youth to old age.","Selfies and self-portraits also have differences.","Taking a selfie is easy. We can do it quickly with our camera at any time. However, painting a self-portrait takes some time. Also, a self-portrait shows a painter's personal painting style.","To paint a person, a painter needs a model. Vincent van Gogh didn't have enough money for a model. So he painted himself! When he painted his self-portraits, he chose bright colors and applied a lot of paint. This became his unique style. We can see it in his other paintings too.","We can express ourselves with selfies and self-portraits. Do you want to try?"];var PASS_KO=["자화상에서 자가 촬영까지","오늘날, 사람들은 셀피 찍는 것을 즐깁니다. 우리는 그것들로 특별한 순간을 포착할 수 있습니다.","오래전, 사람들은 다른 방식으로 그들 자신의 모습을 포착했습니다. 그들은 그들 자신의 그림을 그렸습니다. 이 그림들이 자화상입니다.","셀피와 자화상은 비슷합니다.","둘 다 특정한 시간의 우리 모습을 보여 줍니다. 우리가 그것들을 볼 때, 우리는 그때의 우리 자신을 기억할 수 있습니다. 그것들은 일기와 같습니다.","우리는 행복한 순간을 기억하기 위해 셀피를 찍습니다. 셀피는 그런 때의 우리 얼굴 표정을 포착합니다. 우리는 그런 즐거운 감정을 되살리기 위해 우리의 가족과 친구들과 함께 셀피를 자주 봅니다.","마찬가지로, 몇몇 화가들은 그들의 삶에서 다른 시기를 포착하기 위해 자화상을 만들었습니다. 렘브란트는 거울을 보고 자기 자신을 여러 번 그렸습니다. 그는 그의 일생에서 약 90점의 자화상을 그렸습니다. 그것들은 젊은 시절부터 노년까지 그의 얼굴을 보여 줍니다.","셀피와 자화상에는 차이점도 있습니다.","셀피를 찍는 것은 쉽습니다. 우리는 언제든지 우리의 카메라로 그것을 빨리 할 수 있습니다. 그러나, 자화상을 그리는 것은 시간이 조금 걸립니다. 또한, 자화상은 화가 개인의 화풍을 보여 줍니다.","인물을 그리기 위해, 화가는 모델이 필요합니다. 빈센트 반 고흐는 모델을 위한 충분한 돈이 없었습니다. 그래서 그는 자기 자신을 그렸습니다! 그가 자화상을 그릴 때, 그는 밝은색을 고르고 많은 물감을 발랐습니다. 이것은 그의 독특한 스타일이 되었습니다. 우리는 이것을 그의 다른 그림들에서도 볼 수 있습니다.","우리는 셀피와 자화상으로 우리 자신을 표현할 수 있습니다. 한번 해 보실래요?"];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["B는 반지가 오래된 것이라고 말한다.","A는 반지가 못생겼다고 생각한다.","B는 반지가 새것이라고 말한다.","A가 B에게 반지에 대한 의견을 묻는다.","두 사람은 반지의 가격에 대해 이야기한다."],"a":0,"ans":"B는 반지가 오래된 것이라고 말한다.","evs":[["Wow, it's an old ring.","와, 오래된 반지네."]],"ev":["Wow, it's an old ring.","와, 오래된 반지네."],"ow":["정답 ○ — B가 'Wow, it's an old ring.'(와, 오래된 반지네.)이라고 했으므로 맞다.","오답 ✕ — A는 'I think it's pretty.'(나는 예쁘다고 생각해.)라고 했다. 못생겼다가 아니라 예쁘다고 했으므로 틀림.","오답 ✕ — B는 'it's an old ring'(오래된 반지네)이라고 했다. 새것(new)이 아니라 오래된(old) 것이라서 틀림.","오답 ✕ — 'What do you think of it?'(이거 어떻게 생각해?)은 B가 A에게 한 말이다. 의견을 묻는 사람이 A가 아니라 B라서 틀림.","오답 ✕ — 대화에는 반지의 가격에 대한 언급이 없다. 가장 가까운 문장 'I think it's pretty.'(나는 예쁘다고 생각해.)는 느낌을 말한 것일 뿐이라서 틀림."],"memo":["정답: B는 반지가 오래된 것이라고 말한다.","근거: Wow, it's an old ring.(와, 오래된 반지네.)","함정: ④ 'What do you think of it?'은 B가 A에게 묻는 말이므로 ✕"],"why":"B가 반지를 보고 오래된 반지라고 말했다."}],"dlg":[["A","Look at this ring.","이 반지를 봐."],["B","Wow, it's an old ring. What do you think of it?","와, 오래된 반지네. 이거 어떻게 생각해?"],["A","I think it's pretty.","나는 예쁘다고 생각해."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하는 것은?","o":["소년은 그림이 이상하다고 생각하지만 마음에 들어 한다.","소녀는 소년의 의견에 반대한다.","소년이 그림 속 여자의 얼굴이 퍼즐처럼 보인다고 말한다.","소년은 그림의 색이 흐릿하다고 말한다.","소년은 그림이 마음에 들지 않는다고 말한다."],"a":0,"ans":"소년은 그림이 이상하다고 생각하지만 마음에 들어 한다.","evs":[["I think it's strange.","나는 이상하다고 생각해."],["Yes. But I like it. It's very colorful.","응. 그래도 나는 마음에 들어. 아주 다채로워."]],"ev":["I think it's strange.","나는 이상하다고 생각해."],"ow":["정답 ○ — 소년은 'I think it's strange.'(나는 이상하다고 생각해.)라고 했고, 이어서 'But I like it.'(그래도 나는 마음에 들어.)이라고 했으므로 맞다.","오답 ✕ — 소녀는 'I agree.'(나도 동의해.)라고 했다. 반대한 것이 아니라 동의했으므로 틀림.","오답 ✕ — 'The woman's face looks like a puzzle.'(그 여자의 얼굴이 퍼즐처럼 보여.)은 소녀가 한 말이다. 소년이 아니라서 틀림.","오답 ✕ — 소년은 'It's very colorful.'(아주 다채로워.)이라고 했다. 흐릿한 것이 아니라 색이 다채롭다는 뜻이라서 틀림.","오답 ✕ — 소년은 'But I like it.'(그래도 나는 마음에 들어.)이라고 했다. 마음에 들지 않는다는 말은 틀림."],"memo":["정답: 소년은 그림이 이상하다고 생각하지만 마음에 들어 한다.","근거: I think it's strange. / But I like it.(이상하지만 마음에 들어.)","함정: ② 소녀는 'I agree.'라고 했으므로 반대가 아님 ✕"],"why":"소년은 그림이 이상하지만 다채로워서 마음에 든다고 했다."}],"dlg":[["G","What do you think of this painting?","이 그림 어떻게 생각해?"],["B","I think it's strange.","나는 이상하다고 생각해."],["G","I agree. The woman's face looks like a puzzle.","나도 동의해. 그 여자의 얼굴이 퍼즐처럼 보여."],["B","Yes. But I like it. It's very colorful.","응. 그래도 나는 마음에 들어. 아주 다채로워."]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하는 것은?","o":["B는 그림이 조금 지루하다고 생각한다.","A는 그림이 지루하다고 생각한다.","B는 A의 의견에 동의한다.","A는 물 위의 꽃이 마음에 들지 않는다.","두 사람은 이 미술관에 처음 왔다."],"a":0,"ans": vorite painting here?'(여기서 가장 좋아하는 그림은 뭐니?)가 나오지만 화가에 대한 이야기는 없다. 틀림.","오답 ✕ — 'I'm so excited to see all these paintings.'(이 그림들을 다 보게 되어 신나.)에서 그림을 보러 온 상황일 뿐 미술 동호회 활동은 언급이 없다. 틀림."],"memo":["정답: 그림 속 여성에 대한 의견","근거: I think the woman is happy.(행복해.) vs I think she is sad.(슬퍼.)","함정: 유명한 그림이라는 말은 있지만 여성의 정체는 이야기하지 않는다."],"why":"한 그림 속 여성이 행복한지 슬픈지에 대해 서로 다른 의견을 말한다."}],"dlg":[["G","I'm so excited to see all these paintings.","나는 이 그림들을 다 보게 되어 정말 신나."],["B","Me too. What is your favorite painting here?","나도 그래. 여기서 네가 가장 좋아하는 그림은 뭐니?"],["G","I like this painting of a woman.","나는 이 여자 그림이 좋아."],["B","Oh, that is a very famous painting. What do you think of it?","오, 그건 아주 유명한 그림이야. 너는 그걸 어떻게 생각해?"],["G","I think the woman is happy. She is with her monkeys.","나는 그 여자가 행복하다고 생각해. 그녀는 원숭이들과 함께 있어."],["B","Hmm, I don't agree. I think she is sad.","음, 나는 동의하지 않아. 나는 그녀가 슬프다고 생각해."],["G","Why do you think so?","왜 그렇게 생각해?"],["B","She has sad eyes. Look, she is not smiling.","그녀는 슬픈 눈을 하고 있어. 봐, 웃고 있지 않잖아."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["소녀는 서준이와 함께 사진 전시회에 가길 원한다.","사진 전시회는 학교 강당에서 열린다.","전시회에는 학교생활을 담은 사진들이 있다.","전시회에는 서준이 반의 소풍 사진도 전시되어 있다.","서준이와 소녀는 소풍 갔던 날에 대해 같은 의견을 가지고 있다."],"a":1,"ans":"사진 전시회는 학교 강당에서 열린다.","evs":[["There's a photo exhibition in the school library.","학교 도서관에서 사진 전시회를 해."]],"ev":["There's a photo exhibition in the school library.","학교 도서관에서 사진 전시회를 해."],"ow":["오답 ✕ — 소녀가 'Do you want to come with me?'(나랑 같이 갈래?)라고 물었다. 서준이와 함께 가길 원하므로 이 설명은 일치한다.","정답 ○ — 'There's a photo exhibition in the school library.'(학교 도서관에서 사진 전시회를 해.)라고 했다. 강당이 아니라 도서관이므로 일치하지 않는다.","오답 ✕ — 'There are so many photos of our school life here.'(여기에는 우리 학교생활 사진이 정말 많아.)라고 했으므로 이 설명은 일치한다.","오답 ✕ — 서준이가 'It's from our class picnic!'(우리 반 소풍 때 찍은 거야!)이라고 했으므로 이 설명은 일치한다.","오답 ✕ — 소녀는 'I think it is great.'(멋지다고 생각해.)와 'I agree. That was a really fun day.'(나도 동의해. 정말 재미있는 날이었어.)라고 했으므로 둘이 같은 의견이다. 일치하는 설명이다."],"memo":["정답: ② 전시회는 학교 강당에서 열린다 (✕ 일치하지 않음)","근거   var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}

var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}

 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'

function qHtml(q,lock){

function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
