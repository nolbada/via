"궁금해했다","숨겼다"],"r":{"a":"2) 주장했다","ev":"4번 문장","s":[[4,"But many sailors in the past insisted they had seen the real Kraken.","그러나 과거에 많은 선원들은 그들이 진짜 크라켄을 봤다고 주장했다."]],"w":"신화로만 알려졌던 크라켄을 많은 선원들이 직접 봤다고 말했어요. insist는 자기 생각을 강하게 말하는 '주장하다'예요.","c":2},"h":"4ef81f0ed7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is a legendary monster called the Kraken.)","ko":"그것은 크라켄이라고 불리는 ( ) 괴물이다.","word":"legendary","opts":["평범한","새로운","전설 속의","위험한"],"r":{"a":"3) 전설 속의","ev":"2번 문장","s":[[2,"It is a legendary monster called the Kraken.","그것은 크라켄이라고 불리는 전설 속의 괴물이다."]],"w":"3번에서 크라켄이 고대 신화에서 시작되었다고 해요. 그러니 legendary는 신화나 전설로 전해지는 '전설 속의'라는 뜻이에요.","c":3},"h":"bcfe78b199"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nThe largest one in history had an 18-meter-long body and weighed a ton.","ko":"밑줄 친 one이 가리키는 것은?","sko":"역사상 가장 큰 것은 18미터 길이의 몸을 가졌고 무게가 1톤이 나갔다.","opts":["대왕오징어","크라켄","선원들","배들"],"r":{"a":"1) 대왕오징어","ev":"6, 7번 문장","s":[[6,"In fact, a similar animal actually exists —the giant squid.","사실, 대왕오징어라는 비슷한 동물이 실제로 존재한다."],[7,"The largest one in history had an 18-meter-long body and weighed a ton.","역사상 가장 큰 것은 18미터 길이의 몸을 가졌고 무게가 1톤이 나갔다."]],"w":"6번 문장에서 비슷한 동물로 대왕오징어(the giant squid)가 소개되고, 7번 문장 The largest one의 one은 그 대왕오징어를 가리켜요. 가장 큰 대왕오징어는 몸길이가 18미터였다는 뜻이에요.","c":1,"k":"one = 대왕오징어"},"pron":"one","h":"feb8ad9f19"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, what many people know as the Kraken may be this monster-like creature.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서, 많은 사람들이 크라켄이라고 아는 것은 이 괴물 같은 생물일지도 모른다.","opts":["크라켄을 아는 사람은 이 괴물 같은 생물밖에 없다.","이 괴물 같은 생물은 크라켄 때문에 유명해졌다.","많은 사람들은 이 괴물 같은 생물을 크라켄이라고 부르지 못하게 했다.","많은 사람들이 크라켄이라고 아는 것은 이 괴물 같은 생물일지도 모른다."],"r":{"a":"4) 많은 사람들이 크라켄이라고 아는 것은 이 괴물 같은 생물일지도 모른다.","ev":"11번 문장","s":[[11,"So, what many people know as the Kraken may be this monster-like creature.","그래서, 많은 사람들이 크라켄이라고 아는 것은 이 괴물 같은 생물일지도 모른다."]],"w":"11번은 사람들이 크라켄이라고 알고 있는 것이 대왕오징어 같은 괴물 같은 생물일지도 모른다는 결론이에요. what ~ Kraken이 문장의 주어, may be는 '~일지도 모른다'예요.","c":4},"h":"f7de710537"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["크라켄은 영화 시리즈에서 처음 목격되었다.","대왕오징어는 때때로 가까이 오는 배를 공격한다.","대왕오징어는 수면 가까이에 산다.","어떤 선원도 크라켄이 자신들을 공격했다고 말한 적이 없다."],"opts":["The Kraken was first seen in a film series.","Giant squid sometimes attack ships that come near them.","Giant squid live near the surface of the water.","No sailor ever said the Kraken attacked them."],"r":{"a":"2) Giant squid sometimes attack ships that come near them.","ev":"10번 문장","s":[[10,"However, they sometimes attack ships that come near them.","하지만, 그것들은 때때로 그것들 가까이에 오는 배를 공격한다."]],"w":"10번에서 대왕오징어가 때때로 가까이 오는 배를 공격한다고 해요. 크라켄은 신화에서 시작했고(3번), 대왕오징어는 300~600미터 깊이에 살며(9번), 일부 선원은 공격받았다고 말했어요(5번).","c":2},"h":"7da0f714ae"},{"n":9,"t":"sum","q":"The Kraken comes from ancient (A), but a similar animal, the giant squid, actually (B).","ko":"크라켄은 고대 (A)에서 나왔지만, 비슷한 동물인 대왕오징어는 실제로 (B).","oko":["(A) 영화 / (B) 사라졌다","(A) 배 / (B) 존재한다","(A) 영화 / (B) 존재한다","(A) 신화 / (B) 사라졌다","(A) 신화 / (B) 존재한다"],"opts":["(A) films / (B) disappeared","(A) ships / (B) exists","(A) films / (B) exists","(A) myths / (B) disappeared","(A) myths / (B) exists"],"r":{"a":"5) (A) myths / (B) exists","ev":"3번, 6번 문장","s":[[3,"The Kraken originated from ancient myths about the ocean.","크라켄은 바다에 관한 고대 신화에서 기원했다."],[6,"In fact, a similar animal actually exists —the giant squid.","사실, 대왕오징어라는 비슷한 동물이 실제로 존재한다."]],"w":"3번에서 크라켄은 고대 신화(myths)에서 기원했고, 6번에서 비슷한 동물인 대왕오징어가 실제로 존재한다(exists)고 해요.","c":5},"h":"8f4d76e3ce"},{"n":10,"t":"fill","q":"Giant squid live [A] at depths of 300 to 600 meters, so they are [B] seen.","ko":"대왕오징어는 300미터에서 600미터 깊이의 [A] 살아서 [B] 보인다.","bank":["underwater","rarely","huge","ancient","similar","legendary"],"bko":{"underwater":"물속에","rarely":"드물게","huge":"거대한","ancient":"고대의","similar":"비슷한","legendary":"전설 속의"},"r":{"a":"[A] underwater, [B] rarely","ev":"9번 문장","s":[[9,"These squid live underwater at depths between 300 and 600 meters, so they are rarely seen.","이 오징어들은 300미터에서 600미터 깊이의 물속에 살아서, 드물게 모습을 보인다."]],"w":"9번에서 대왕오징어는 깊은 물속에(underwater) 살기 때문에 드물게(rarely) 보인다고 해요. huge, ancient, similar, legendary는 형용사라서 이 두 자리에 들어갈 수 없어요.","c":null},"h":"ee63760c5e"}]},{"u":4,"id":"hk2-04-1","no":1,"ko":"“메두사” 호수를 아시나요?","items":[{"n":1,"t":"tf","q":"Lake Natron is known as the lake of Medusa.","ko":"나트론 호수는 메두사의 호수라고 알려져 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Lake Natron is known as the lake of Medusa.","나트론 호수는 메두사의 호수라고 알려져 있다."]],"w":"1번에 Lake Natron is known as the lake of Medusa가 그대로 나와요.","c":"T"},"h":"3d2b1f5daf"},{"n":2,"t":"tf","q":"The dead animals by the lake looked soft like typical dead animals.","ko":"호숫가의 죽은 동물들은 일반적인 죽은 동물들처럼 부드러워 보였다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"However, they did not seem like typical dead animals.","하지만, 그것들은 일반적인 죽은 동물들처럼 보이지 않았다."],[6,"Their bodies were dried up and as hard as rocks, so they looked like stone sculptures!","그것들의 몸은 메말라 있었고 바위만큼 딱딱해서, 마치 돌 조각처럼 보였다!"]],"w":"5번에서 일반적인 죽은 동물들처럼 보이지 않았다고 하고, 6번에서 몸이 바싹 말라 바위만큼 딱딱했다고 해요.","c":"F"},"h":"5d534ffe31"},{"n":3,"t":"tf","q":"A photographer saw dead bats and birds along the shore of the lake.","ko":"한 사진사는 호숫가를 따라 죽은 박쥐와 새를 보았다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"One day, a photographer traveling in Africa saw this unusual lake.","어느 날, 아프리카를 여행하던 사진사가 이 독특한 호수를 봤다."],[4,"There were all kinds of dead bats and birds along the shore.","호숫가를 따라 온갖 종류의 죽은 박쥐와 새가 있었다."]],"w":"3번에서 사진사가 호수를 봤고, 4번에서 호숫가를 따라 온갖 종류의 죽은 박쥐와 새가 있었다고 해요.","c":"T"},"h":"2db029d5e4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, they did not seem like typical dead animals.)","ko":"하지만, 그것들은 ( ) 죽은 동물들처럼 보이지 않았다.","word":"typical","opts":["일반적인","특별한","새로운","작은"],"r":{"a":"1) 일반적인","ev":"5번 문장","s":[[5,"However, they did not seem like typical dead animals.","하지만, 그것들은 일반적인 죽은 동물들처럼 보이지 않았다."]],"w":"5번의 However 뒤에서 이 동물들이 6번처럼 돌 조각 같다고 해요. 보통의 죽은 동물과 달랐다는 뜻이니 typical은 '일반적인'이에요.","c":1},"h":"04c4e52c42"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, the saltwater absorbs the moisture from the dead bodies of animals.)","ko":"그래서, 염수는 죽은 동물들의 몸에서 수분을 ( ).","word":"absorbs","opts":["더한다","빨아들인다","얼린다","씻어낸다"],"r":{"a":"2) 빨아들인다","ev":"11번 문장","s":[[11,"So, the saltwater absorbs the moisture from the dead bodies of animals.","그래서, 그 염수는 죽은 동물들의 몸에서 수분을 빨아들인다."]],"w":"11번의 결과로 12번에서 사체가 꼭 미라처럼 남아요. 몸에서 수분이 빠져나가야 마르므로 absorb는 '빨아들이다'예요.","c":2},"h":"3fb4eee24d"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is high enough to cause burns and eventually kill animals.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 화상을 야기해서 결국 동물들을 죽일 만큼 충분히 높다.","opts":["나트론 호수의 pH 농도","죽은 박쥐와 새","호숫가","메두사"],"r":{"a":"1) 나트론 호수의 pH 농도","ev":"8~9번 문장","s":[[8,"This is because Lake Natron has a pH level of 10.5.","이것은 나트론 호수가 10.5의 pH 농도를 가지고 있기 때문이다."],[9,"It is high enough to cause burns and eventually kill animals.","그것은 화상을 야기해서 결국 동물들을 죽일 만큼 충분히 높다."]],"w":"8번에서 호수가 pH 농도 10.5를 가졌다고 했어요. 9번의 It은 그 pH 농도이고, 화상을 일으켜 동물을 죽일 만큼 높다는 말이에요.","c":1},"h":"9001e997b0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This causes them to remain in the same condition, exactly like a mummy!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 꼭 미라처럼, 동물의 사체를 똑같은 상태로 남아있게 만든다!","opts":["이것은 동물들이 미라를 피해 같은 곳에 머물게 한다.","이것은 동물들의 사체가 빨리 썩어 사라지게 한다.","이것은 동물들의 사체가 꼭 미라처럼 똑같은 상태로 남아 있게 한다.","이것은 미라가 동물들처럼 살아 움직이게 한다."],"r":{"a":"3) 이것은 동물들의 사체가 꼭 미라처럼 똑같은 상태로 남아 있게 한다.","ev":"12번 문장","s":[[12,"This causes them to remain in the same condition, exactly like a mummy!","이것은 꼭 미라처럼, 동물의 사체를 똑같은 상태로 남아있게 만든다!"]],"w":"12번은 염수가 수분을 빨아들인 결과, 사체가 변하지 않고 미라처럼 남는다는 뜻이에요. 썩어 사라진다는 말은 반대예요.","c":3},"h":"a75a274968"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["호수의 pH 농도는 5.5이다.","호숫가의 동물들은 추운 날씨 때문에 죽었다.","죽은 동물들의 몸은 부드럽고 축축했다.","호수에는 많은 양의 염분이 있다."],"opts":["The lake has a pH level of 5.5.","The animals near the lake died because of cold weather.","The bodies of the dead animals were soft and wet.","The lake has a high amount of salt."],"r":{"a":"4) The lake has a high amount of salt.","ev":"10번 문장","s":[[10,"In addition, the lake has a high amount of salt.","게다가, 호수에는 많은 양의 염분이 있다."]],"w":"10번에서 호수에 많은 양의 염분이 있다고 해요. pH 농도는 10.5이고(8번), 동물들은 호수 때문에 죽었으며(7번), 몸은 바싹 마르고 딱딱했어요(6번).","c":4},"h":"9952228697"},{"n":9,"t":"sum","q":"One day, a photographer (A) in Africa saw this (B) lake.","ko":"어느 날, 아프리카를 (A)하던 사진사가 이 (B) 호수를 봤다.","oko":["(A) 여행 / (B) 아름다운","(A) 거주 / (B) 독특한","(A) 여행 / (B) 독특한","(A) 거주 / (B) 아름다운","(A) 일 / (B) 유명한"],"opts":["(A) traveling / (B) beautiful","(A) living / (B) unusual","(A) traveling / (B) unusual","(A) living / (B) beautiful","(A) working / (B) famous"],"r":{"a":"3) (A) traveling / (B) unusual ((A) 여행 / (B) 독특한)","ev":"3번 문장","s":[[3,"One day, a photographer traveling in Africa saw this unusual lake.","어느 날, 아프리카를 여행하던 사진사가 이 독특한 호수를 봤다."]],"w":"3번 문장 a photographer traveling in Africa saw this unusual lake(아프리카를 여행하던 사진사가 이 독특한 호수를 봤다)에서 가져왔어요.","c":3},"h":"d432fb2d5a"},{"n":10,"t":"fill","q":"As Medusa turned living things into [A], the lake [B] to do the same.","ko":"메두사가 살아있는 것을 [A](으)로 바꿔 버렸듯이, 그 호수도 같은 일을 하는 것처럼 [B].","bank":["stone","seems","typical","dried","hard","along"],"bko":{"stone":"돌","seems":"보인다","typical":"일반적인","dried":"마른","hard":"딱딱한","along":"~을 따라"},"r":{"a":"[A] stone (돌), [B] seems (보인다)","ev":"2번 문장","s":[[2,"As Medusa turned living things into stone, the lake seems to do the same.","메두사가 살아있는 것을 돌로 바꿔 버렸듯이, 그 호수도 메두사와 같은 것을 하는 것처럼 보인다."]],"w":"2번 문장 turned living things into stone(살아있는 것을 돌로 바꿨다), the lake seems to do the same(그 호수도 같은 일을 하는 것처럼 보인다)에서 가져왔어요. 주어 the lake가 3인칭 단수라서 seem에 s가 붙은 seems예요.","c":null},"h":"b6b98af01d"}]},{"u":4,"id":"hk2-04-2","no":2,"ko":"니들이 금메달 맛을 알아?","items":[{"n":1,"t":"tf","q":"Olympic champions often bite their gold medals when they pose for photos.","ko":"올림픽 챔피언들은 사진을 위해 자세를 취할 때 종종 금메달을 깨문다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"When Olympic champions pose for photos, they often do one thing: bite their gold medals!","올림픽 챔피언들이 사진을 위해 자세를 취할 때, 그들은 종종 한 가지를 하는데, 금메달을 깨무는 것이다!"]],"w":"1번에서 올림픽 챔피언들이 사진을 위해 자세를 취할 때 종종 금메달을 깨문다고 해요.","c":"T"},"h":"fb19779e84"},{"n":2,"t":"tf","q":"People still use gold coins as money today.","ko":"사람들은 오늘날에도 여전히 금화를 돈으로 사용한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Although people don’t use gold coins anymore, the tradition continues with gold medals.","비록 사람들이 더 이상 금화를 사용하지는 않지만, 그 전통은 금메달과 함께 계속되고 있다."]],"w":"8번에서 사람들은 더 이상(anymore) 금화를 사용하지 않는다고 해요. 전통만 금메달로 이어져요.","c":"F"},"h":"b61be1cb29"},{"n":3,"t":"tf","q":"If you bite an Olympic gold medal, it won’t get marked easily.","ko":"올림픽 금메달을 깨물면 쉽게 자국이 남지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"So when you bite it, it won’t get marked easily.","그래서 그것을 깨물면, 쉽게 자국이 남지 않을 것이다."]],"w":"10번에서 올림픽 금메달을 깨물어도 쉽게 자국이 남지 않을 것이라고 해요.","c":"T"},"h":"d5fcc5a256"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the past, gold coins were commonly used.)","ko":"과거에, 금화는 ( ) 쓰였다.","word":"commonly","opts":["흔히","거의 안","몰래","처음으로"],"r":{"a":"1) 흔히","ev":"3번 문장","s":[[3,"In the past, gold coins were commonly used.","과거에, 금화는 흔히 쓰였다."]],"w":"3번은 과거에 금화가 널리 쓰였다는 말이에요. 다음 4번의 But 앞이므로 널리 쓰였다는 뜻이고, commonly는 '흔히'예요.","c":1},"h":"e867fca0f9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Therefore, to find out if a coin was pure gold or not, the merchant would bite it.)","ko":"그러므로, 동전이 ( ) 금인지 아닌지 알아내기 위해, 상인이 그것을 깨물고는 했다.","word":"pure","opts":["가짜의","순수한","오래된","무거운"],"r":{"a":"2) 순수한","ev":"5번 문장","s":[[5,"Therefore, to find out if a coin was pure gold or not, the merchant would bite it.","그러므로, 동전이 순금인지 아닌지 알아내기 위해, 상인이 그것을 깨물고는 했다."]],"w":"4번에서 다른 금속을 섞은 가짜 금화가 있었어요. 그래서 5번은 다른 금속이 섞이지 않은 '순수한' 금인지 확인하려고 깨문 거예요.","c":2},"h":"c9caf1561d"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhy do they do this?","ko":"밑줄 친 they가 가리키는 것은?","sko":"그들은 왜 이것을 할까?","opts":["올림픽 챔피언들","상인들","못된 사람들","사진사들"],"r":{"a":"1) 올림픽 챔피언들","ev":"2번 문장","s":[[2,"Why do they do this?","그들은 왜 이것을 할까?"]],"w":"1번 문장에서 사진을 위해 자세를 취하며 금메달을 깨무는 사람들은 올림픽 챔피언들(Olympic champions)이에요. 2번 문장 Why do they do this?의 they가 그 챔피언들이에요.","c":1,"k":"they = 올림픽 챔피언들"},"pron":"they","h":"7de68a2ef5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, Olympic gold medals haven’t been made of pure gold since 1912.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 올림픽 금메달은 1912년 이후로 순금으로 만들어지지 않고 있다.","opts":["올림픽 금메달은 1912년에 처음 순금으로 만들어졌다.","올림픽 금메달은 순금으로 만들어져서 1912년 이후 사라졌다.","올림픽 금메달은 1912년 이후로 순금으로 만들어지지 않고 있다.","올림픽 금메달은 1912년 이전에는 순금이 아니었다."],"r":{"a":"3) 올림픽 금메달은 1912년 이후로 순금으로 만들어지지 않고 있다.","ev":"9번 문장","s":[[9,"However, Olympic gold medals haven’t been made of pure gold since 1912.","하지만, 올림픽 금메달은 1912년 이후로 순금으로 만들어지지 않고 있다."]],"w":"haven’t been made of는 '만들어지지 않고 있다'이고 since 1912는 '1912년 이후로'예요. 지금까지 계속 순금이 아니라는 뜻이에요.","c":3},"h":"a0a6b6dfc7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["금은 단단한 금속이라서 잇자국이 남지 않는다.","다른 금속이 든 동전은 뚜렷한 잇자국이 남는다.","상인들은 가짜 금화를 만들려고 동전을 깨물었다.","순금으로 만든 동전을 깨물면 잇자국이 남았을 것이다."],"opts":["Gold is a hard metal, so teeth marks cannot be left on it.","A coin with other metals leaves clear teeth marks.","Merchants bit coins to make fake gold coins.","Biting a coin made of pure gold would leave teeth marks."],"r":{"a":"4) Biting a coin made of pure gold would leave teeth marks. (순금으로 만든 동전을 깨물면 잇자국이 남았을 것이다.)","ev":"6번 문장","s":[[6,"Since gold is a very soft metal, biting the coin would leave teeth marks.","금은 매우 무른 금속이기 때문에, 동전을 깨무는 것은 잇자국을 남겼을 것이다."]],"w":"6번 문장 Since gold is a very soft metal, biting the coin would leave teeth marks(금은 매우 무른 금속이기 때문에 동전을 깨물면 잇자국이 남았을 것이다)에 나와요. 금은 무르기(soft) 때문에 자국이 남아요.","c":4},"h":"42dab8068a"},{"n":9,"t":"sum","q":"But some bad people (A) other metals, such as (B), to make fake gold coins.","ko":"그러나 몇몇 못된 사람들은 가짜 금화를 만들기 위해 (B) 같은 다른 금속들을 (A)했다.","oko":["(A) 제거 / (B) 구리","(A) 첨가 / (B) 설탕","(A) 제거 / (B) 종이","(A) 첨가 / (B) 종이","(A) 첨가 / (B) 구리"],"opts":["(A) removed / (B) copper","(A) added / (B) sugar","(A) removed / (B) paper","(A) added / (B) paper","(A) added / (B) copper"],"r":{"a":"5) (A) added / (B) copper ((A) 첨가 / (B) 구리)","ev":"4번 문장","s":[[4,"But some bad people added other metals, such as copper, to make fake gold coins.","그러나 몇몇 못된 사람들은 가짜 금화를 만들기 위해 구리 같은 다른 금속들을 첨가했다."]],"w":"4번 문장 added other metals, such as copper, to make fake gold coins(가짜 금화를 만들기 위해 구리 같은 다른 금속들을 첨가했다)에서 가져왔어요.","c":5},"h":"e5229331ea"},{"n":10,"t":"fill","q":"On the other hand, if the coin [A] other metals, no teeth marks would be [B].","ko":"반면에, 만약 동전에 다른 금속들이 [A], 아무런 잇자국도 [B] 것이다.","bank":["contained","seen","commonly","easily","therefore","anymore"],"bko":{"contained":"들어 있다면","seen":"보이지 않을","commonly":"흔히","easily":"쉽게","therefore":"그러므로","anymore":"더 이상"},"r":{"a":"[A] contained (들어 있다면), [B] seen (보이지 않을)","ev":"7번 문장","s":[[7,"On the other hand, if the coin contained other metals, no teeth marks would be seen.","반면에, 만약 동전에 다른 금속들이 들어 있다면, 아무런 잇자국도 보이지 않았을 것이다."]],"w":"7번 문장 if the coin contained other metals(동전에 다른 금속이 들어 있다면), no teeth marks would be seen(잇자국이 보이지 않을 것이다)에서 가져왔어요. would be 뒤에는 과거분사 seen이 와서 수동태(\"보여지다\")가 돼요.","c":null},"h":"fe178d67ef"}]},{"u":4,"id":"hk2-04-3","no":3,"ko":"이날만을 기다렸다","items":[{"n":1,"t":"tf","q":"On cheat days, people can eat anything that they want.","ko":"치팅 데이에는 사람들이 원하는 어떤 것이든 먹을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But they can eat anything that they want on cheat days.","그러나 치팅 데이에는 원하는 어떤 것이든 먹을 수 있다."]],"w":"3번에서 치팅 데이에는 원하는 어떤 것이든 먹을 수 있다고 해요.","c":"T"},"h":"588317b677"},{"n":2,"t":"tf","q":"Only athletes have cheat days these days.","ko":"요즘에는 운동선수들만 치팅 데이를 갖는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Now, many people who want to lose weight by dieting have cheat days, too.","이제는, 다이어트로 살을 빼길 원하는 많은 사람들도 치팅 데이를 갖는다."]],"w":"8번에서 이제는 다이어트로 살을 빼길 원하는 많은 사람들도 치팅 데이를 갖는다고 해요.","c":"F"},"h":"9c34918cac"},{"n":3,"t":"tf","q":"A cheat day acts as a reward after following a strict diet for several days.","ko":"치팅 데이는 며칠 동안 엄격한 식단을 따른 후의 보상 역할을 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"A cheat day acts as a reward after following a strict diet for several days.","치팅 데이는 며칠 동안 엄격한 식단을 따른 후의 보상 역할을 한다."]],"w":"9번에 이 문장이 그대로 나와요. 엄격한 식단을 며칠 따른 뒤의 보상이에요.","c":"T"},"h":"b51f5355a0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They usually maintain high-protein diets that help build and repair muscles.)","ko":"그들은 보통 근육을 키우고 회복하는 것을 돕는 고단백 식단을 ( ).","word":"maintain","opts":["유지한다","버린다","바꾼다","구한다"],"r":{"a":"1) 유지한다","ev":"5번 문장","s":[[5,"They usually maintain high-protein diets that help build and repair muscles.","그들은 보통 근육을 키우고 회복하는 것을 돕는 고단백 식단을 유지한다."]],"w":"5번은 선수들이 평소에 하는 식단 이야기이고, 6번 However에서 가끔은 다르게 먹는다고 해요. 그러니 maintain은 평소에 '유지하다'예요.","c":1},"h":"d2a5a9c822"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, it helps relieve stress and gives dieters extra motivation to do well.)","ko":"그래서, 그것은 스트레스를 ( ) 것을 돕고 다이어트 중인 사람들에게 잘하려는 추가적인 동기를 준다.","word":"relieve","opts":["늘리는","완화하는","만드는","기억하는"],"r":{"a":"2) 완화하는","ev":"10번 문장","s":[[10,"So, it helps relieve stress and gives dieters extra motivation to do well.","그래서, 그것은 스트레스 완화를 돕고 다이어트 중인 사람들에게 잘하려는 추가적인 동기를 준다."]],"w":"치팅 데이는 보상이라서(9번) 스트레스를 줄여 주는 방향이에요. relieve는 stress를 '덜어 주다, 완화하다'예요.","c":2},"h":"208bf48447"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nIt also helps them overcome the temptation to eat too much on other days.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그것은 또한 그들이 다른 날에 너무 많이 먹으려는 유혹을 극복하도록 돕는다.","opts":["운동선수들","다이어트 중인 사람들","치팅 데이들","근육들"],"r":{"a":"2) 다이어트 중인 사람들","ev":"10~11번 문장","s":[[10,"So, it helps relieve stress and gives dieters extra motivation to do well.","그래서, 그것은 스트레스 완화를 돕고 다이어트 중인 사람들에게 잘하려는 추가적인 동기를 준다."],[11,"It also helps them overcome the temptation to eat too much on other days.","그것은 또한 그들이 다른 날에 너무 많이 먹으려는 유혹을 극복하도록 돕는다."]],"w":"10번에서 치팅 데이가 gives dieters(다이어트 중인 사람들)에게 동기를 준다고 했어요. 11번의 them은 그 dieters이고, 그들이 과식의 유혹을 이기도록 돕는다는 말이에요.","c":2},"h":"04549f6add"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As long as it is used wisely, a cheat day can help dieters lose weight.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"치팅 데이는 현명하게 쓰이기만 하면, 다이어트 중인 사람들이 살을 빼는 것을 도울 수 있다.","opts":["치팅 데이를 쓰는 한 다이어트 중인 사람들은 살이 찔 수밖에 없다.","치팅 데이를 오래 쓸수록 다이어트 중인 사람들은 더 현명해진다.","현명한 사람들은 치팅 데이 없이도 살을 뺄 수 있다.","치팅 데이는 현명하게 쓰기만 하면 다이어트 중인 사람들이 살을 빼는 데 도움이 될 수 있다."],"r":{"a":"4) 치팅 데이는 현명하게 쓰기만 하면 다이어트 중인 사람들이 살을 빼는 데 도움이 될 수 있다.","ev":"12번 문장","s":[[12,"As long as it is used wisely, a cheat day can help dieters lose weight.","치팅 데이는 현명하게 쓰이기만 하면, 다이어트 중인 사람들이 살을 빼는 것을 도울 수 있다."]],"w":"As long as는 '~하기만 하면'이에요. 치팅 데이를 현명하게 쓴다는 조건 아래에서 살 빼는 것을 도울 수 있다는 뜻이에요.","c":4},"h":"80598d4c81"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["운동선수들은 예외 없이 채소만 먹는다.","치팅 데이는 살을 빼려는 사람들을 위해 만들어졌다.","운동선수들은 때때로 지방과 탄수화물이 많은 음식을 먹는다.","치팅 데이는 다이어트 중인 사람들을 살이 더 찌게 한다."],"opts":["Athletes eat only vegetables without any exceptions.","Cheat days were invented for people who want to lose weight.","Athletes sometimes eat foods with lots of fats and carbohydrates.","A cheat day makes dieters gain more weight."],"r":{"a":"3) Athletes sometimes eat foods with lots of fats and carbohydrates. (운동선수들은 때때로 지방과 탄수화물이 많은 음식을 먹는다.)","ev":"6번 문장","s":[[6,"However, they sometimes eat the foods they want, including those with lots of fats and carbohydrates.","하지만, 그들은 때때로 지방과 탄수화물이 많은 음식을 포함해 원하는 음식을 먹는다."]],"w":"6번에서 선수들은 때때로 지방과 탄수화물이 많은 음식을 포함해 원하는 음식을 먹는다고 해요. 선수들은 예외가 있고(6번), 치팅 데이는 원래 선수들을 위한 것이었어요(4번).","c":3},"h":"828ae63bcb"},{"n":9,"t":"sum","q":"When people are on a diet, a “cheat day” is like an (A) in the (B).","ko":"사람들이 다이어트 중일 때, ‘치팅 데이’는 (B)의 (A) 같다.","oko":["(A) 오아시스 / (B) 바다","(A) 섬 / (B) 사막","(A) 섬 / (B) 바다","(A) 오아시스 / (B) 숲","(A) 오아시스 / (B) 사막"],"opts":["(A) oasis / (B) ocean","(A) island / (B) desert","(A) island / (B) ocean","(A) oasis / (B) forest","(A) oasis / (B) desert"],"r":{"a":"5) (A) oasis / (B) desert ((A) 오아시스 / (B) 사막)","ev":"1번 문장","s":[[1,"When people are on a diet, a “cheat day” is like an oasis in the desert.","사람들이 다이어트 중일 때, ‘치팅 데이’는 사막의 오아시스 같다."]],"w":"1번 문장 a “cheat day” is like an oasis in the desert(‘치팅 데이’는 사막의 오아시스 같다)에서 가져왔어요. 다이어트가 힘든 사막이라면 치팅 데이는 쉬어 가는 오아시스라는 비유예요.","c":5},"h":"8ba59fd9cf"},{"n":10,"t":"fill","q":"On [A] days, they only eat [B] foods.","ko":"[A] 날에, 그들은 [B] 음식만 먹는다.","bank":["regular","healthy","relieve","overcome","maintain","repair"],"bko":{"regular":"평소의","healthy":"건강에 좋은","relieve":"완화하다","overcome":"극복하다","maintain":"유지하다","repair":"회복하다"},"r":{"a":"[A] regular (평소의), [B] healthy (건강에 좋은)","ev":"2번 문장","s":[[2,"On regular days, they only eat healthy foods.","평소에, 그들은 건강에 좋은 음식만 먹는다."]],"w":"2번 문장 On regular days, they only eat healthy foods(평소에 그들은 건강에 좋은 음식만 먹는다)에서 가져왔어요. days와 foods를 꾸며 주는 말이라 형용사가 와요.","c":null},"h":"c4fd4647e9"}]},{"u":4,"id":"hk2-04-4","no":4,"ko":"그 사람이 바로 나예요...","items":[{"n":1,"t":"tf","q":"Most artists sign all of their artwork.","ko":"대부분의 예술가들은 그들의 모든 예술 작품에 서명을 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Most artists sign all of their artwork.","대부분의 예술가들은 그들의 모든 예술 작품에 서명을 한다."]],"w":"1번에 Most artists sign all of their artwork가 그대로 나와요.","c":"T"},"h":"65bc690b44"},{"n":2,"t":"tf","q":"Michelangelo was already famous when he sculpted the Pietà.","ko":"미켈란젤로는 <피에타>를 조각했을 때 이미 유명했다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"Michelangelo sculpted the Pietà in 1499.","미켈란젤로는 1499년에 <피에타>를 조각했다."],[6,"He was only 24 years old, and not many people knew about him or his work at the time.","그는 겨우 24살이었고, 그 당시 그나 그의 작품에 대해 알고 있는 사람은 많지 않았다."]],"w":"6번에서 그는 겨우 24살이었고 그 당시 그나 그의 작품을 아는 사람이 많지 않았다고 해요.","c":"F"},"h":"8ae1774c9b"},{"n":3,"t":"tf","q":"The words on Mary’s strap say that Gobbo made the Pietà.","ko":"마리아의 띠에 있는 말은 Gobbo가 <피에타>를 만들었다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"On Mary’s shoulder, there is a strap with the words “Michelangelo from Florence made this.”","마리아의 어깨에는, “피렌체 출신의 미켈란젤로가 이것을 만들었다.”라는 말이 있는 띠가 있다."]],"w":"4번에서 띠에는 '피렌체 출신의 미켈란젤로가 이것을 만들었다'라고 쓰여 있어요. Gobbo는 8번에서 누군가가 잘못 말한 이름이에요.","c":"F"},"h":"cfec98a79f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He secretly carved his name upon the statue one night.)","ko":"어느 날 밤 그는 ( ) 조각상에 그의 이름을 새겼다.","word":"secretly","opts":["몰래","크게","천천히","갑자기"],"r":{"a":"1) 몰래","ev":"10번 문장","s":[[10,"He secretly carved his name upon the statue one night.","어느 날 밤 그는 몰래 조각상에 그의 이름을 새겼다."]],"w":"10번은 밤에 이름을 새기는 장면이에요. 아무도 모르게 새겼다는 뜻이라 secretly는 '몰래'예요.","c":1},"h":"89dbed67f9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This made his reputation grow.)","ko":"이것은 그의 ( )이 높아지도록 만들었다.","word":"reputation","opts":["후회","명성","나이","재산"],"r":{"a":"2) 명성","ev":"11번 문장","s":[[11,"This made his reputation grow.","이것은 그의 명성이 높아지도록 만들었다."]],"w":"10번에서 자기 이름을 새겨 사람들이 그가 만든 것을 알게 됐어요. 그래서 11번에서 높아지는 것은 사람들 사이의 평판, 즉 명성이에요.","c":2},"h":"c7533d4243"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nHe was only 24 years old, and not many people knew about him or his work at the time.","ko":"밑줄 친 him이 가리키는 것은?","sko":"그는 겨우 24살이었고, 그 당시 그나 그의 작품에 대해 알고 있는 사람은 많지 않았다.","opts":["미켈란젤로","Gobbo","예수","구경꾼들"],"r":{"a":"1) 미켈란젤로","ev":"5~6번 문장","s":[[5,"Michelangelo sculpted the Pietà in 1499.","미켈란젤로는 1499년에 <피에타>를 조각했다."],[6,"He was only 24 years old, and not many people knew about him or his work at the time.","그는 겨우 24살이었고, 그 당시 그나 그의 작품에 대해 알고 있는 사람은 많지 않았다."]],"w":"5번에서 <피에타>를 조각한 사람은 Michelangelo예요. 6번의 He와 him은 모두 그 미켈란젤로예요.","c":1},"h":"d441009ce8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"God, creator of the world, did not even leave a signature on his creatures, but I did!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"세상의 창조자인 하느님조차도 그의 창조물에 서명을 남기지 않았건만, 내가 서명을 남겼구나!","opts":["하느님은 창조물에 서명을 남겼지만 나는 남기지 않았다.","하느님은 내게 창조물에 서명을 남기라고 말했다.","하느님은 내가 서명을 남긴 것을 칭찬했다.","세상의 창조자인 하느님조차 창조물에 서명을 남기지 않았는데, 나는 남겼다."],"r":{"a":"4) 세상의 창조자인 하느님조차 창조물에 서명을 남기지 않았는데, 나는 남겼다.","ev":"13번 문장","s":[[13,"He said, “God, creator of the world, did not even leave a signature on his creatures, but I did!”","그는 말했다. “세상의 창조자인 하느님조차도 그의 창조물에 서명을 남기지 않았건만, 내가 서명을 남겼구나!”"]],"w":"13번의 did는 앞의 did leave a signature를 대신하는 말이에요. 하느님도 서명을 남기지 않았는데 자신은 남겼다고 후회하는 말이에요.","c":4},"h":"128381605a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["미켈란젤로는 그의 모든 작품에 서명을 했다.","미켈란젤로는 그의 작품 어느 것에도 서명하지 않았다.","미켈란젤로는 그의 작품들 중 <피에타> 하나에만 서명을 했다.","<피에타>는 미켈란젤로와 그의 어머니의 조각상이다."],"opts":["Michelangelo signed all of his works.","Michelangelo did not sign any of his works.","Michelangelo signed only one of his works, the Pietà.","The Pietà is a statue of Michelangelo and his mother."],"r":{"a":"3) Michelangelo signed only one of his works, the Pietà.","ev":"2번 문장","s":[[2,"However, Michelangelo only signed one of his works —the Pietà.","하지만, 미켈란젤로는 그의 작품들 중 <피에타> 하나에만 서명을 했다."]],"w":"2번에서 미켈란젤로는 작품들 중 <피에타> 하나에만 서명을 했다고 해요. 3번에서 <피에타>는 예수와 그의 어머니 마리아의 조각상이에요.","c":3},"h":"41483f8707"},{"n":9,"t":"sum","q":"One day, he (A) some (B) talking about the Pietà.","ko":"어느 날, 그는 몇몇 (B)이(가) <피에타>에 대해 말하고 있는 것을 (A).","oko":["(A) 잊어버렸다 / (B) 구경꾼들","(A) 들었다 / (B) 화가들","(A) 잊어버렸다 / (B) 화가들","(A) 읽었다 / (B) 구경꾼들","(A) 들었다 / (B) 구경꾼들"],"opts":["(A) forgot / (B) viewers","(A) heard / (B) painters","(A) forgot / (B) painters","(A) read / (B) viewers","(A) heard / (B) viewers"],"r":{"a":"5) (A) heard / (B) viewers ((A) 들었다 / (B) 구경꾼들)","ev":"7번 문장","s":[[7,"One day, he heard some viewers talking about the Pietà.","어느 날, 그는 몇몇 구경꾼들이 <피에타>에 대해 말하고 있는 것을 들었다."]],"w":"7번 문장 he heard some viewers talking about the Pietà(그는 몇몇 구경꾼들이 <피에타>에 대해 말하고 있는 것을 들었다)에서 가져왔어요. heard는 hear의 과거형이에요.","c":5},"h":"21c8e33ba7"},{"n":10,"t":"fill","q":"But [A], Michelangelo [B] signing it.","ko":"하지만 [A], 미켈란젤로는 그것에 서명한 것을 [B].","bank":["eventually","regretted","reputation","statue","signature","artists"],"bko":{"eventually":"결국","regretted":"후회했다","reputation":"명성","statue":"조각상","signature":"서명","artists":"예술가들"},"r":{"a":"[A] eventually (결국), [B] regretted (후회했다)","ev":"12번 문장","s":[[12,"But eventually, Michelangelo regretted signing it.","그러나 결국, 미켈란젤로는 그것에 서명한 것을 후회했다."]],"w":"12번 문장 But eventually, Michelangelo regretted signing it(그러나 결국, 미켈란젤로는 그것에 서명한 것을 후회했다)에서 가져왔어요. regretted는 regret의 과거형이고, 뒤에는 signing(서명한 것)이 와요.","c":null},"h":"b3e40bae1f"}]},{"u":5,"id":"hk2-05-1","no":1,"ko":"죽었니, 살았니?","items":[{"n":1,"t":"tf","q":"You should hold the battery with the negative end facing down.","ko":"건전지를 음극이 아래를 향하게 한 채로 잡아야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"To find out, hold the battery with the negative end facing down.","알아내기 위해서는, 건전지를 음극이 아래를 향하게 한 채로 잡아라."]],"w":"4번 문장에 hold the battery with the negative end facing down이 그대로 있어요. 음극이 아래로 가게 잡으라는 내용과 일치해요.","c":"T"},"h":"ce200b5600"},{"n":2,"t":"tf","q":"You should drop the battery from fifty centimeters above the ground.","ko":"건전지를 바닥에서 50센티미터 위에서 떨어뜨려야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Drop it from five centimeters above the ground.","그것을 바닥에서 5센티미터 위에서 떨어뜨려라."]],"w":"5번 문장은 from five centimeters, 즉 5센티미터 위에서 떨어뜨리라고 해요. 50센티미터가 아니에요.","c":"F"},"h":"52617c9539"},{"n":3,"t":"tf","q":"Both old and new batteries are on the floor after you drop them.","ko":"건전지를 떨어뜨린 뒤 바닥에는 오래된 건전지와 새 건전지가 모두 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"But you drop them by mistake, and now there are both old and new batteries on the floor.","하지만 당신은 실수로 그것들을 떨어뜨리고, 이제 오래된 건전지와 새 건전지들 모두 바닥에 있다."]],"w":"2번 문장에 now there are both old and new batteries on the floor가 있어요. 새것과 헌것이 섞여 있다는 내용이에요.","c":"T"},"h":"966484aace"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The remote control stops working, and you take out the batteries to replace them.)","ko":"리모컨이 작동하는 것을 멈추자, 당신은 건전지를 ( ) 위해 꺼낸다.","opts":["충전하기","버리기","교체하기","구입하기"],"word":"replace","r":{"a":"3) 교체하기","ev":"1번 문장","s":[[1,"The remote control stops working, and you take out the batteries to replace them.","리모컨이 작동하는 것을 멈추자, 당신은 건전지를 교체하기 위해 꺼낸다."]],"w":"리모컨이 멈춰서 건전지를 꺼내는 상황이에요. 꺼낸 건전지 대신 다른 것을 끼우려는 거니까 replace는 '교체하다'예요.","c":3},"h":"d4dd79034a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A dead battery, however, will bounce and fall over.)","ko":"다 쓴 건전지는, 그러나, ( ) 넘어질 것이다.","opts":["튕기고","녹고","빛나고","가라앉고"],"word":"bounce","r":{"a":"1) 튕기고","ev":"6~7번 문장","s":[[6,"If the battery is new, it won’t bounce and it might even stand up.","만약 건전지가 새것이라면, 튕기지 않을 것이고 심지어 설 수도 있다."],[7,"A dead battery, however, will bounce and fall over.","다 쓴 건전지는, 그러나, 튕기고 넘어질 것이다."]],"w":"6번에서 새 건전지는 won't bounce(튕기지 않는다), 7번은 반대(however)로 다 쓴 건전지가 bounce 한다고 해요. 떨어뜨리면 통통 되돌아오니까 '튕기다'예요.","c":1},"h":"977e709697"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt’s simple and easy, isn’t it?","ko":"밑줄 친 It이 가리키는 것은?","sko":"이것은 간단하고 쉽다, 그렇지 않은가?","opts":["건전지의 새것과 다 쓴 것을 구별하는 방법","리모컨을 고치는 일","바닥에 떨어진 건전지","건전지 안의 아연"],"r":{"a":"1) 건전지의 새것과 다 쓴 것을 구별하는 방법","ev":"7, 8번 문장","s":[[7,"A dead battery, however, will bounce and fall over.","다 쓴 건전지는, 그러나, 튕기고 넘어질 것이다."],[8,"It’s simple and easy, isn’t it?","이것은 간단하고 쉽다, 그렇지 않은가?"]],"w":"4~7번 문장에서 건전지를 떨어뜨려 새것인지 다 쓴 것인지 알아내는 방법을 설명했어요. 8번 문장 It’s simple and easy의 It은 그 방법이에요.","c":1,"k":"It = 건전지의 새것과 다 쓴 것을 구별하는 방법"},"pron":"It","h":"9a87175181"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If the battery is new, it won’t bounce and it might even stand up.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 건전지가 새것이라면, 튕기지 않을 것이고 심지어 설 수도 있다.","opts":["새 건전지는 튕기고 넘어질 것이다.","새 건전지는 높이 튕기지만 서 있지는 못한다.","새 건전지는 떨어뜨리면 깨져서 쓸 수 없게 된다.","새 건전지는 튕기지 않고 심지어 서 있을 수도 있다."],"r":{"a":"4) 새 건전지는 튕기지 않고 심지어 서 있을 수도 있다.","ev":"6번 문장","s":[[6,"If the battery is new, it won’t bounce and it might even stand up.","만약 건전지가 새것이라면, 튕기지 않을 것이고 심지어 설 수도 있다."]],"w":"won't bounce는 '튕기지 않을 것이다', might even stand up은 '심지어 설 수도 있다'예요. 튕기고 넘어지는 것은 7번의 다 쓴 건전지예요.","c":4},"h":"dddcb42715"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["새 건전지는 젤이 들어 있어서 잘 튕긴다.","새 건전지는 젤 형태의 아연이 들어 있어서 튕기지 않는다.","다 쓴 건전지는 아연이 젤이라서 튕기지 않는다.","이 실험은 건전지가 처음부터 용수철로 만들어졌기 때문에 된다."],"opts":["A new battery bounces well because it contains a gel.","A new battery doesn’t bounce because it contains zinc in the form of a gel.","A dead battery doesn’t bounce because its zinc is a gel.","The test works because batteries are made of springs from the start."],"r":{"a":"2) A new battery doesn’t bounce because it contains zinc in the form of a gel.","ev":"9~10번 문장","s":[[9,"This test works because batteries usually contain zinc in the form of a gel.","건전지는 보통 젤 형태의 아연을 함유하고 있기 때문에 이 실험이 가능하다."],[10,"Gels don’t bounce, so a fresh battery doesn’t bounce as well.","젤은 튕기지 않고, 그래서 새 건전지 또한 튕기지 않는다."]],"w":"9번에서 건전지에는 보통 젤 형태의 아연이 들어 있고, 10번에서 젤은 튕기지 않으니 새 건전지도 튕기지 않는다고 해요. 튕기는 것은 아연이 용수철 같은 물질로 바뀐 다 쓴 건전지예요.","c":2},"h":"4b51e1b40e"},{"n":9,"t":"sum","q":"As you use batteries, the (A) inside changes, and the zinc becomes a material that is like a network of (B).","ko":"건전지를 사용하면, 그 안의 (A)이(가) 변하고, 아연은 (B) 조직 같은 물질이 된다.","oko":["(A) 무게 / (B) 용수철","(A) 화학적 성질 / (B) 돌","(A) 무게 / (B) 돌","(A) 색 / (B) 고무","(A) 화학적 성질 / (B) 용수철"],"opts":["(A) weight / (B) springs","(A) chemistry / (B) stones","(A) weight / (B) stones","(A) color / (B) rubber","(A) chemistry / (B) springs"],"r":{"a":"5) (A) chemistry / (B) springs ((A) 화학적 성질 / (B) 용수철)","ev":"11번 문장","s":[[11,"However, as you use batteries, the chemistry inside changes, and the zinc becomes a material that is like a network of springs.","하지만, 건전지를 사용함에 따라, 내부의 화학적 성질이 변하고, 아연은 용수철 조직과 같은 물질이 된다."]],"w":"11번 문장 the chemistry inside changes(내부의 화학적 성질이 변한다), a network of springs(용수철 조직)에서 가져왔어요.","c":5},"h":"309f65adbd"},{"n":10,"t":"fill","q":"You have a [A]: which [B] are new and which ones are dead?","ko":"당신에겐 [A]이(가) 있다. 어떤 [B]이(가) 새것이고 어떤 것이 다 쓴 것인가?","bank":["problem","ones","bounce","replace","easily","usually"],"bko":{"problem":"문제","ones":"것들","bounce":"튕기다","replace":"교체하다","easily":"쉽게","usually":"보통"},"r":{"a":"[A] problem (문제), [B] ones (것들)","ev":"3번 문장","s":[[3,"You have a problem: which ones are new and which ones are dead?","당신에겐 문제가 있다. 어떤 것이 새것이고 어떤 것이 다 쓴 것인가?"]],"w":"3번 문장 You have a problem(당신에겐 문제가 있다), which ones are new(어떤 것이 새것인가)에서 가져왔어요. ones는 앞에 나온 batteries(건전지들)를 대신하는 말이에요.","c":null},"h":"673c02c736"}]},{"u":5,"id":"hk2-05-2","no":2,"ko":"이집트인의 치명적인 화장법","items":[{"n":1,"t":"tf","q":"Ancient Egyptians put on a white substance to make smoky eyes.","ko":"고대 이집트인들은 스모키한 눈을 만들기 위해 하얀 물질을 발랐다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"In ancient Egypt, people put on a black substance, kohl, to make smoky eyes.","고대 이집트에서, 사람들은 스모키한 눈을 만들기 위해 콜이라는 검은 물질을 발랐다."]],"w":"5번 문장은 a black substance, kohl, 즉 검은 물질인 콜을 발랐다고 해요. 하얀 물질이 아니에요.","c":"F"},"h":"6394792650"},{"n":2,"t":"tf","q":"The kohl kept mosquitoes and flies away from the Egyptians.","ko":"콜은 모기와 파리가 이집트인들에게 가까이 오지 못하게 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The kohl kept away mosquitoes and flies.","콜은 모기와 파리가 가까이 오지 못하게 했다."]],"w":"8번 문장에 The kohl kept away mosquitoes and flies가 있어요. 모기와 파리를 가까이 못 오게 했다는 내용과 일치해요.","c":"T"},"h":"c5e37fc306"},{"n":3,"t":"tf","q":"Kohl contains lead, which is a toxic substance.","ko":"콜은 유독한 물질인 납을 함유하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Kohl contains a very toxic substance, lead.","콜은 납이라는 매우 유독한 물질을 함유하고 있다."]],"w":"11번 문장에 Kohl contains a very toxic substance, lead가 있어요. 콜에 유독한 납이 들어 있다는 내용과 일치해요.","c":"T"},"h":"d4d8ea0582"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Kohl contains a very toxic substance, lead.)","ko":"콜은 납이라는 매우 ( ) 물질을 함유하고 있다.","opts":["유독한","향기로운","값비싼","투명한"],"word":"toxic","r":{"a":"1) 유독한","ev":"11~12번 문장","s":[[11,"Kohl contains a very toxic substance, lead.","콜은 납이라는 매우 유독한 물질을 함유하고 있다."],[12,"When this builds up in the body, it can affect almost every organ.","이것이 몸속에 쌓이면, 거의 모든 장기에 영향을 끼칠 수 있다."]],"w":"12번에서 이 물질이 몸속에 쌓이면 거의 모든 장기에 영향을 끼칠 수 있다고 해요. 몸에 해로운 물질이니까 toxic은 '유독한'이에요.","c":1},"h":"037a3b2c22"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, the Egyptians could avoid getting the infectious diseases that were carried by these insects.)","ko":"그래서, 이집트인들은 이 벌레들에 의해 옮겨지는 전염병을 얻는 것을 ( ) 수 있었다.","opts":["퍼뜨릴","치료할","피할","연구할"],"word":"avoid","r":{"a":"3) 피할","ev":"8~9번 문장","s":[[8,"The kohl kept away mosquitoes and flies.","콜은 모기와 파리가 가까이 오지 못하게 했다."],[9,"So, the Egyptians could avoid getting the infectious diseases that were carried by these insects.","그래서, 이집트인들은 이 벌레들에 의해 옮겨지는 전염병을 얻는 것을 피할 수 있었다."]],"w":"8번에서 콜이 벌레를 가까이 못 오게 했어요. 그래서 벌레가 옮기는 전염병을 얻는 일을 '피할' 수 있었다는 흐름이에요. avoid = 피하다.","c":3},"h":"95f070d65f"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey soon discovered something interesting about the substance.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 곧 그 물질에 관해 무언가 흥미로운 것을 발견했다.","opts":["고대 이집트 사람들","벌레들","미용 전문가들","관광객들"],"r":{"a":"1) 고대 이집트 사람들","ev":"5, 6번 문장","s":[[5,"In ancient Egypt, people put on a black substance, kohl, to make smoky eyes.","고대 이집트에서, 사람들은 스모키한 눈을 만들기 위해 콜이라는 검은 물질을 발랐다."],[6,"They soon discovered something interesting about the substance.","그들은 곧 그 물질에 관해 무언가 흥미로운 것을 발견했다."]],"w":"5번 문장 In ancient Egypt, people put on a black substance, kohl에서 콜을 바른 사람들이 고대 이집트 사람들이에요. 6번 문장 They soon discovered의 They가 그 사람들이에요.","c":1,"k":"They = 고대 이집트 사람들"},"pron":"They","h":"4d7abc1983"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, they did not do this just for beauty.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 그들은 미용을 위해서만 이것을 하지는 않았다.","opts":["그들은 오직 미용을 위해서 이것을 했다.","그들은 미용 때문에 이것을 전혀 하지 않았다.","그들은 이것을 미용 대신 종교를 위해서 했다.","그들은 미용만을 위해서 이것을 한 것은 아니었다."],"r":{"a":"4) 그들은 미용만을 위해서 이것을 한 것은 아니었다.","ev":"3~4번 문장","s":[[3,"It is believed that ancient Egyptians first used makeup to create smoky eyes.","고대 이집트인들은 스모키한 눈을 만들기 위해 최초로 화장을 이용했다고 믿어진다."],[4,"However, they did not do this just for beauty.","하지만, 그들은 미용을 위해서만 이것을 하지는 않았다."]],"w":"not just for beauty는 '미용만을 위해서가 아닌'이에요. 미용도 이유 중 하나이지만 그것만은 아니었다는 뜻이라서 벌레를 막는 효과 같은 다른 이유가 뒤따라요.","c":4},"h":"db3a2da125"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["콜 덕분에 모기가 이집트인들에게 더 쉽게 다가왔다.","이집트인들은 처음부터 콜의 납 문제를 알고 있었다.","이집트인들은 아마 결국 심각한 건강 문제를 가지고 있었을 것이다.","전염병은 콜 때문에 옮겨졌다."],"opts":["The kohl made it easier for mosquitoes to come near the Egyptians.","The Egyptians knew about the lead problem from the beginning.","The Egyptians probably had some serious health problems in the end.","The infectious diseases were carried by the kohl."],"r":{"a":"3) The Egyptians probably had some serious health problems in the end. (이집트인들은 아마 결국 심각한 건강 문제를 가지고 있었을 것이다.)","ev":"13번 문장","s":[[13,"As a result, the Egyptians probably had some serious health problems in the end.","결과적으로, 이집트인들은 아마 결국 심각한 건강 문제를 가지고 있었을 것이다."]],"w":"13번 문장 the Egyptians probably had some serious health problems in the end(이집트인들은 아마 결국 심각한 건강 문제를 가지고 있었을 것이다)에 나와요.","c":3},"h":"a34f6fd64b"},{"n":9,"t":"sum","q":"Smoky eyes are a (A) beauty trend, and the eyes look more (B) and mysterious.","ko":"스모키한 눈은 (A) 미용 유행이고, 눈이 더 (B) 신비로워 보인다.","oko":["(A) 이상한 / (B) 강렬하고","(A) 인기 있는 / (B) 지루하고","(A) 이상한 / (B) 지루하고","(A) 오래된 / (B) 강렬하고","(A) 인기 있는 / (B) 강렬하고"],"opts":["(A) strange / (B) intense","(A) popular / (B) boring","(A) strange / (B) boring","(A) old / (B) intense","(A) popular / (B) intense"],"r":{"a":"5) (A) popular / (B) intense ((A) 인기 있는 / (B) 강렬하고)","ev":"1, 2번 문장","s":[[1,"Smoky eyes are a popular beauty trend.","스모키한 눈은 인기 있는 미용 유행이다."],[2,"The eyes look more intense and mysterious.","눈이 더 강렬하고 신비로워 보인다."]],"w":"1번 문장 Smoky eyes are a popular beauty trend(스모키한 눈은 인기 있는 미용 유행이다), 2번 문장 more intense and mysterious(더 강렬하고 신비로워 보인다)에서 가져왔어요.","c":5},"h":"d4c0b82ac1"},{"n":10,"t":"fill","q":"It is [A] that ancient Egyptians first used [B] to create smoky eyes.","ko":"고대 이집트인들은 스모키한 눈을 만들기 위해 최초로 [B]을(를) 이용했다고 [A].","bank":["believed","makeup","ancient","avoid","affect","probably"],"bko":{"believed":"믿어진다","makeup":"화장","ancient":"고대의","avoid":"피하다","affect":"영향을 끼치다","probably":"아마"},"r":{"a":"[A] believed (믿어진다), [B] makeup (화장)","ev":"3번 문장","s":[[3,"It is believed that ancient Egyptians first used makeup to create smoky eyes.","고대 이집트인들은 스모키한 눈을 만들기 위해 최초로 화장을 이용했다고 믿어진다."]],"w":"3번 문장 It is believed that ... used makeup(화장을 이용했다고 믿어진다)에서 가져왔어요. It is believed that ...은 \"~라고 믿어진다\"라는 수동태 표현이에요.","c":null},"h":"49cebc8e5f"}]},{"u":5,"id":"hk2-05-3","no":3,"ko":"온도야 부탁해","items":[{"n":1,"t":"tf","q":"For most animals, DNA alone decides whether a baby is a boy or a girl.","ko":"대부분의 동물에게는 DNA만이 아기가 남자아이인지 여자아이인지를 결정한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"For most animals, it is DNA alone.","대부분의 동물들의 경우, DNA뿐이다."]],"w":"2번 문장에 For most animals, it is DNA alone이 있어요. 대부분의 동물은 DNA만으로 성별이 정해진다는 내용과 일치해요.","c":"T"},"h":"a620ceaa21"},{"n":2,"t":"tf","q":"Most alligators and turtles lay eggs in the sand.","ko":"대부분의 악어와 거북이는 모래에 알을 낳는다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Most alligators and turtles lay eggs in the sand.","대부분의 악어와 거북이는 모래에 알을 낳는다."]],"w":"5번 문장에 Most alligators and turtles lay eggs in the sand가 그대로 있어요. 모래에 알을 낳는다는 내용과 일치해요.","c":"T"},"h":"e1d3e4ec7a"},{"n":3,"t":"tf","q":"The hotter it is, the more male turtles will be born.","ko":"더울수록, 더 많은 수컷 거북이가 태어날 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"The hotter it is, the more female babies will be born.","더 뜨거울수록, 더 많은 새끼 암컷들이 태어날 것이다."]],"w":"11번 문장은 The hotter it is, the more female babies will be born이에요. 거북이는 더울수록 수컷이 아니라 암컷이 더 많이 태어나요.","c":"F"},"h":"304f46959b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The gender of the babies is determined by the temperature around the eggs.)","ko":"새끼의 성별은 알 주변의 온도에 의해 ( ).","opts":["바뀌어 버린다","결정된다","숨겨진다","낳아진다"],"word":"determined","r":{"a":"2) 결정된다","ev":"6번 문장","s":[[6,"The gender of the babies is determined by the temperature around the eggs.","새끼의 성별은 알 주변의 온도에 의해 결정된다."]],"w":"6번은 새끼의 성별이 알 주변의 온도에 달려 있다는 말이에요. is determined by는 '~에 의해 결정된다'예요.","c":2},"h":"09ce3ed8cc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most alligators and turtles lay eggs in the sand.)","ko":"대부분의 악어와 거북이는 모래에 알을 ( ).","opts":["먹는다","깨뜨린다","옮긴다","낳는다"],"word":"lay","r":{"a":"4) 낳는다","ev":"5~6번 문장","s":[[5,"Most alligators and turtles lay eggs in the sand.","대부분의 악어와 거북이는 모래에 알을 낳는다."],[6,"The gender of the babies is determined by the temperature around the eggs.","새끼의 성별은 알 주변의 온도에 의해 결정된다."]],"w":"악어와 거북이가 모래에 알을 두고 새끼가 태어나는 내용이에요. lay eggs는 '알을 낳다'예요.","c":4},"h":"ed3b072c8c"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nIn addition to DNA, temperature decides their gender!","ko":"밑줄 친 their가 가리키는 것은?","sko":"DNA에 더해, 온도가 그것들의 성별을 결정한다!","opts":["악어와 거북이 같은 몇몇 파충류","대부분의 동물","새끼들의 부모","모래 속의 알"],"r":{"a":"1) 악어와 거북이 같은 몇몇 파충류","ev":"3, 4번 문장","s":[[3,"But this is not true for some reptiles like alligators and turtles.","하지만 이것은 악어와 거북이 같은 몇몇 파충류에게는 사실이 아니다."],[4,"In addition to DNA, temperature decides their gender!","DNA에 더해, 온도가 그것들의 성별을 결정한다!"]],"w":"3번 문장에서 DNA만으로 성별이 정해지지 않는 동물은 악어와 거북이 같은 몇몇 파충류(some reptiles like alligators and turtles)예요. 4번 문장 temperature decides their gender의 their가 그 파충류들이에요.","c":1,"k":"their = 악어와 거북이 같은 몇몇 파충류"},"pron":"their","h":"1c818c8ad8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"On the other hand, the opposite is true for turtles.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"반면에, 거북이의 경우 반대다.","opts":["반면에, 거북이에게는 악어와 똑같은 일이 일어난다.","반면에, 거북이의 경우에는 그 반대가 사실이다.","반면에, 거북이는 악어보다 더 따뜻한 곳에 알을 낳는다.","반면에, 거북이의 성별은 온도와 관계없이 정해진다."],"r":{"a":"2) 반면에, 거북이의 경우에는 그 반대가 사실이다.","ev":"10번 문장","s":[[10,"On the other hand, the opposite is true for turtles.","반면에, 거북이의 경우 반대다."]],"w":"On the other hand는 '반면에', the opposite is true는 '반대가 사실이다'예요. 악어와 같다는 뜻이 아니라 악어와 반대 결과가 나온다는 뜻이에요(11번).","c":2},"h":"33162b3c11"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["미국악어의 둥지가 34도보다 높으면 대부분 암컷이다.","온도가 높으면 거북이는 대부분 수컷이다.","모든 동물의 성별은 알 주변의 온도에 의해 정해진다.","미국악어의 둥지 온도가 30도보다 낮으면 대부분 암컷이다."],"opts":["American alligators are mostly females when the nest is hotter than 34°C.","Turtles are mostly male when the temperature is high.","The gender of all animals depends on the temperature around the eggs.","If the nest of the American alligator is lower than 30°C, most babies will be females."],"r":{"a":"4) If the nest of the American alligator is lower than 30°C, most babies will be females.","ev":"9번 문장","s":[[9,"And if the temperature is lower than 30°C, most will be females.","그리고 만약 온도가 30도보다 낮으면, 대부분은 암컷일 것이다."]],"w":"9번에서 둥지 온도가 30도보다 낮으면 대부분 암컷이라고 해요. 34도보다 높으면 수컷이고(8번), 거북이는 더울수록 암컷이며(11번), 온도로 성별이 정해지는 것은 일부 파충류예요(3번).","c":4},"h":"4e967607bf"},{"n":9,"t":"sum","q":"When the temperature of the nest is (A) than 34°C, the babies will be (B) males.","ko":"둥지의 온도가 34도보다 (A) 새끼들은 (B) 수컷일 것이다.","oko":["(A) 낮으면 / (B) 대부분","(A) 높으면 / (B) 결코 ~않는","(A) 낮으면 / (B) 결코 ~않는","(A) 높으면 / (B) 거의 ~않는","(A) 높으면 / (B) 대부분"],"opts":["(A) lower / (B) mostly","(A) higher / (B) never","(A) lower / (B) never","(A) higher / (B) hardly","(A) higher / (B) mostly"],"r":{"a":"5) (A) higher / (B) mostly ((A) 높으면 / (B) 대부분)","ev":"8번 문장","s":[[8,"When the temperature of the nest is higher than 34°C, the babies will be mostly males.","둥지의 온도가 34도보다 높으면, 새끼들은 대부분 수컷일 것이다."]],"w":"8번 문장 When the temperature of the nest is higher than 34°C, the babies will be mostly males(둥지의 온도가 34도보다 높으면 새끼들은 대부분 수컷일 것이다)에서 가져왔어요.","c":5},"h":"e9e2eac892"},{"n":10,"t":"fill","q":"So what [A] if the Earth keeps getting hotter? Then [B] there will only be male alligators and female turtles!","ko":"그래서 만약 지구가 계속해서 더워진다면 무슨 일이 [A]? 그러면 [B] 수컷 악어와 암컷 거북이만 있게 될 것이다!","bank":["happens","maybe","sand","eggs","nest","opposite"],"bko":{"happens":"일어날까","maybe":"아마도","sand":"모래","eggs":"알","nest":"둥지","opposite":"반대"},"r":{"a":"[A] happens (일어날까), [B] maybe (아마도)","ev":"12, 13번 문장","s":[[12,"So what happens if the Earth keeps getting hotter?","그래서 만약 지구가 계속해서 더워진다면 무슨 일이 일어날까?"],[13,"Then maybe there will only be male alligators and female turtles!","그러면 아마도 수컷 악어와 암컷 거북이만 있게 될 것이다!"]],"w":"12번 문장 what happens if ...(무슨 일이 일어날까), 13번 문장 maybe there will only be ...(아마도 ~만 있게 될 것이다)에서 가져왔어요. what happens는 \"무슨 일이 일어나는지\"라는 뜻이에요.","c":null},"h":"4a2ec287c1"}]},{"u":5,"id":"hk2-05-4","no":4,"ko":"말이 필요 없어","items":[{"n":1,"t":"tf","q":"Emojis let us deliver our thoughts and feelings without typing words.","ko":"이모지는 우리가 단어를 입력하지 않고도 생각과 감정을 전달하게 해준다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They let us deliver our thoughts and feelings without typing words.","그것들은 우리가 단어를 입력하지 않고도 생각과 감정을 전달하게 해준다."]],"w":"3번 문장에 They let us deliver our thoughts and feelings without typing words가 그대로 있어요. 이모지 이야기와 일치해요.","c":"T"},"h":"625edeae3a"},{"n":2,"t":"tf","q":"People from the Middle East understand the LOL emoji in the same way as people in Western countries.","ko":"중동 출신의 사람들은 LOL 이모지를 서구권 사람들과 같은 방식으로 이해한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"But people from the Middle East understand the same emoji very differently.","그러나 중동 출신의 사람들은 같은 이모지를 매우 다르게 이해한다."]],"w":"8번 문장에서 중동 출신의 사람들은 같은 이모지를 매우 다르게(very differently) 이해한다고 해요. 서구권과 같지 않아요.","c":"F"},"h":"14675d6a1e"},{"n":3,"t":"tf","q":"Emoji translators study how people use each emoji based on their cultural background.","ko":"이모지 번역가들은 문화적 배경에 근거해 사람들이 각각의 이모지를 어떻게 사용하는지 연구한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"These translators research how people use each emoji based on their cultural background.","이 번역가들은 문화적 배경에 근거해 사람들이 어떻게 각각의 이모지를 사용하는지 연구한다."]],"w":"12번 문장에 These translators research how people use each emoji based on their cultural background가 있어요. 문화적 배경을 바탕으로 연구한다는 내용과 일치해요.","c":"T"},"h":"83896335bf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If so, you probably understand how convenient emojis are.)","ko":"만약 그렇다면, 당신은 아마 이모지가 얼마나 ( ) 이해할 것이다.","opts":["위험한지","편리한지","복잡한지","값비싼지"],"word":"convenient","r":{"a":"2) 편리한지","ev":"2~3번 문장","s":[[2,"If so, you probably understand how convenient emojis are.","만약 그렇다면, 당신은 아마 이모지가 얼마나 편리한지 이해할 것이다."],[3,"They let us deliver our thoughts and feelings without typing words.","그것들은 우리가 단어를 입력하지 않고도 생각과 감정을 전달하게 해준다."]],"w":"바로 뒤 3번에서 이모지는 단어를 입력하지 않고도 생각과 감정을 전달하게 해준다고 해요. 쓰기 쉽고 도움이 되니까 convenient는 '편리한'이에요.","c":2},"h":"b60b97cc16"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Some people study the various meanings emojis have in different cultures.)","ko":"어떤 사람들은 다른 문화에서 이모지가 갖는 ( ) 의미를 연구한다.","opts":["단순한","정확한","다양한","유일한"],"word":"various","r":{"a":"3) 다양한","ev":"6, 8, 10번 문장","s":[[6,"For example, a smiling face with tears is called a LOL (Laugh Out Loud) emoji in Western countries.","예를 들어, 눈물이 맺힌 웃는 얼굴은 서구권에서 LOL(큰 소리로 웃다) 이모지라고 불린다."],[8,"But people from the Middle East understand the same emoji very differently.","그러나 중동 출신의 사람들은 같은 이모지를 매우 다르게 이해한다."],[10,"To understand these differences, some people study the various meanings emojis have in different cultures.","이러한 차이점들을 이해하기 위해, 어떤 사람들은 다른 문화에서 이모지가 갖는 다양한 의미를 연구한다."]],"w":"6~9번에서 같은 이모지가 서양과 중동에서 서로 다른 의미로 쓰인다고 해요. 문화마다 여러 가지 뜻이 있으니 various는 '다양한'이에요.","c":3},"h":"9260852cf1"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are emoji translators!","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 이모지 번역가들이다!","opts":["다른 문화에서 이모지의 의미를 연구하는 사람들","중동 출신의 사람들","서구권의 사람들","이모지들"],"r":{"a":"1) 다른 문화에서 이모지의 의미를 연구하는 사람들","ev":"10, 11번 문장","s":[[10,"To understand these differences, some people study the various meanings emojis have in different cultures.","이러한 차이점들을 이해하기 위해, 어떤 사람들은 다른 문화에서 이모지가 갖는 다양한 의미를 연구한다."],[11,"They are emoji translators!","그들은 이모지 번역가들이다!"]],"w":"10번 문장에서 어떤 사람들(some people)이 다른 문화에서 이모지가 갖는 다양한 의미를 연구한다고 했고, 11번 문장 They are emoji translators!의 They가 그 사람들이에요.","c":1,"k":"They = 다른 문화에서 이모지의 의미를 연구하는 사람들"},"pron":"They","h":"0ba0324cb9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, not every emoji has the same meaning to everyone.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 모든 이모지가 모두에게 같은 의미를 갖는 것은 아니다.","opts":["어떤 이모지도 누구에게도 같은 의미를 갖지 않는다.","모든 이모지는 모두에게 똑같은 의미를 갖는다.","모든 사람이 이모지를 사용하는 것은 아니다.","모든 이모지가 모두에게 같은 의미를 갖는 것은 아니다."],"r":{"a":"4) 모든 이모지가 모두에게 같은 의미를 갖는 것은 아니다.","ev":"5번 문장","s":[[5,"However, not every emoji has the same meaning to everyone.","하지만, 모든 이모지가 모두에게 같은 의미를 갖는 것은 아니다."]],"w":"not every는 '모든 ~가 …한 것은 아니다'라는 부분 부정이에요. 같은 의미인 이모지도 있을 수 있지만, 사람에 따라 다르게 이해하는 이모지도 있다는 뜻이에요.","c":4},"h":"af476a0c1f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이모지는 서구권에서는 사용되지 않는다.","서구권에서 LOL 이모지는 너무 심하게 웃어서 눈물이 난다는 뜻이다.","이모지 번역가들은 문화를 고려하지 않고 이모지를 연구한다.","서구권 사람들은 LOL 이모지를 슬픔으로 가득 찬 얼굴로 본다."],"opts":["Emojis are not used in Western countries.","In Western countries, the LOL emoji means you are laughing so hard that you cry.","Emoji translators ignore culture when they study emojis.","People in Western countries see the LOL emoji as a face filled with sadness."],"r":{"a":"2) In Western countries, the LOL emoji means you are laughing so hard that you cry. (서구권에서 LOL 이모지는 너무 심하게 웃어서 눈물이 난다는 뜻이다.)","ev":"6~7번 문장","s":[[6,"For example, a smiling face with tears is called a LOL (Laugh Out Loud) emoji in Western countries.","예를 들어, 눈물이 맺힌 웃는 얼굴은 서구권에서 LOL(큰 소리로 웃다) 이모지라고 불린다."],[7,"It means you’re laughing so hard that you eventually cry.","그것은 너무 심하게 웃어서 결국 눈물을 흘린다는 것을 의미한다."]],"w":"7번에서 서구권의 LOL 이모지는 너무 심하게 웃어서 결국 눈물을 흘린다는 뜻이라고 해요. 이모지는 의사소통을 도와주고(4번), 번역가는 문화적 배경을 근거로 연구하며(12번), 슬픔으로 보는 것은 중동 사람들이에요(9번).","c":2},"h":"e6111dc33d"},{"n":9,"t":"sum","q":"Emojis can even (A) us communicate with people who speak a different (B).","ko":"이모지는 심지어 우리가 다른 (B)을(를) 말하는 사람들과 의사소통하도록 (A).","oko":["(A) 막을 수도 있다 / (B) 언어","(A) 도울 수 있다 / (B) 나라","(A) 막을 수도 있다 / (B) 나라","(A) 강요할 수도 있다 / (B) 언어","(A) 도울 수 있다 / (B) 언어"],"opts":["(A) stop / (B) language","(A) help / (B) country","(A) stop / (B) country","(A) force / (B) language","(A) help / (B) language"],"r":{"a":"5) (A) help / (B) language ((A) 도울 수 있다 / (B) 언어)","ev":"4번 문장","s":[[4,"They can even help us communicate with people who speak a different language.","그것들은 심지어 우리가 다른 언어를 말하는 사람들과 의사소통하도록 도울 수 있다."]],"w":"4번 문장 They can even help us communicate with people who speak a different language(그것들은 심지어 우리가 다른 언어를 말하는 사람들과 의사소통하도록 도울 수 있다)에서 가져왔어요. help + 목적어 + 동사원형은 \"~가 …하도록 돕다\"예요.","c":5},"h":"006afa403b"},{"n":10,"t":"fill","q":"Did you understand the [A] [B] right away?","ko":"당신은 [A] [B]을(를) 곧바로 이해했는가?","bank":["above","conversation","deliver","communicate","speak","let"],"bko":{"above":"위의","conversation":"대화","deliver":"전달하다","communicate":"의사소통하다","speak":"말하다","let":"~하게 해주다"},"r":{"a":"[A] above (위의), [B] conversation (대화)","ev":"1번 문장","s":[[1,"Did you understand the above conversation right away?","당신은 위의 대화를 곧바로 이해했는가?"]],"w":"1번 문장 Did you understand the above conversation right away?(위의 대화를 곧바로 이해했는가?)에서 가져왔어요. above는 \"위의\"라는 뜻으로 conversation을 꾸며 줘요.","c":null},"h":"ce5928027b"}]},{"u":6,"id":"hk2-06-1","no":1,"ko":"무한 번개 지옥에 오신 걸 환영합니다","items":[{"n":1,"t":"tf","q":"The Catatumbo River is in Venezuela.","ko":"카타툼보강은 베네수엘라에 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It is the C  1을 의미한다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"This is because love means “zero points” in tennis.","이것은 테니스에서 ‘러브’가 ‘0점’을 의미하기 때문이다."],[7,"So when a game begins, players start at love-love (0-0).","그래서 경기가 시작되면, 선수들은 러브 대 러브(0 대 0)에서 시작한다."]],"w":"6번에서 love는 0점이고, 7번에서 경기가 시작될 때 love-love(0 대 0)에서 시작한다고 해요. 1 대 1이 아니에요.","c":"F"},"h":"f98f5aa2d0"},{"n":3,"t":"tf","q":"People started to call a score of zero love after tennis became popular in England.","ko":"사람들은 영국에서 테니스가 인기 있게 된 후 0점을 ‘러브’라고 부르기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"Eventually, after tennis became popular in England, people started to call a score of zero love.","마침내, 영국에서 테니스가 인기 있게 된 후, 사람들은 0점을 ‘러브’라고 부르기 시작했다."]],"w":"13번 문장에 after tennis became popular in England, people started to call a score of zero love가 있어요. 내용과 일치해요.","c":"T"},"h":"a9a8b958af"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You might think of a complicated relationship between lovers.)","ko":"당신은 연인 사이의 ( ) 관계를 떠올릴지도 모른다.","opts":["간단한","복잡한","행복한","오래된"],"word":"complicated","r":{"a":"2) 복잡한","ev":"2~3번 문장","s":[[2,"You might think of a complicated relationship between lovers.","당신은 연인 사이의 복잡한 관계를 떠올릴지도 모른다."],[3,"But “love game” is a term in tennis.","하지만 ‘러브 게임’은 테니스 용어이다."]],"w":"2번은 ‘러브 게임’에서 연인 사이를 떠올린다는 말이고, 3번 But으로 그게 아니라고 바로잡아요. 연애 관계는 쉽지 않은 얽힌 관계이니 complicated는 ‘복잡한’이에요.","c":2},"h":"48acc55bae"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Some witty French people found that a zero on the board looked like an egg.)","ko":"몇몇 ( ) 프랑스 사람들은 점수판의 0점이 달걀처럼 보인다는 것을 발견했다.","opts":["무례한","부끄러운","가난한","재치 있는"],"word":"witty","r":{"a":"4) 재치 있는","ev":"10~11번 문장","s":[[10,"Some witty French people found that a zero on the board looked like an egg.","몇몇 재치 있는 프랑스 사람들은 점수판의 0점이 달걀처럼 보인다는 것을 발견했다."],[11,"So instead of zero, they called it l’oeuf, meaning “egg”.","그래서 0 대신에, 그들은 그것을 ‘달걀’을 의미하는 ‘뢰프’라고 불렀다."]],"w":"0을 달걀로 비유해 l’oeuf라고 부른 것은 말장난 같은 재미있는 생각이에요(11번). 그래서 witty는 ‘재치 있는’이에요.","c":4},"h":"0081e0c6d4"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nIn other words, the player who loses scores no points. This is because love means “zero points” in tennis.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 테니스에서 ‘러브’가 ‘0점’을 의미하기 때문이다.","opts":["패배한 선수가 한 점도 기록하지 못하는 것","승리한 선수가 점수를 많이 얻는 것","테니스가 프랑스에서 시작된 것","선수들이 연인 사이처럼 지내는 것"],"r":{"a":"1) 패배한 선수가 한 점도 기록하지 못하는 것","ev":"5~6번 문장","s":[[5,"In other words, the player who loses scores no points.","다시 말해서, 패배한 선수는 한 점도 기록하지 못한 것이다."],[6,"This is because love means “zero points” in tennis.","이것은 테니스에서 ‘러브’가 ‘0점’을 의미하기 때문이다."]],"k":"This = 패배한 선수가 한 점도 기록하지 못하는 것","w":"5번에서 패배한 선수는 한 점도 기록하지 못한 것이라고 했어요. 6번의 This는 바로 앞 문장의 이 내용을 가리켜요. 테니스에서 ‘러브’가 ‘0점’을 의미하기 때문이에요.","c":1},"pron":"This","h":"d43c4d4f5e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It means winning without giving a single point to the opponent.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 상대방에게 한 점도 주지 않고 이기는 것을 의미한다.","opts":["상대방에게 한 점도 주지 않고 이기는 것을 의미한다.","상대방에게 한 점을 주고 이기는 것을 의미한다.","상대방에게 점수를 많이 주고 지는 것을 의미한다.","상대방의 점수를 하나씩 세어 주는 것을 의미한다."],"r":{"a":"1) 상대방에게 한 점도 주지 않고 이기는 것을 의미한다.","ev":"4번 문장","s":[[4,"It means winning without giving a single point to the opponent.","그것은 상대방에게 한 점도 주지 않고 이기는 것을 의미한다."]],"w":"without giving a single point to the opponent는 ‘상대방에게 한 점도 주지 않고’예요. 그래서 5번에서 진 선수는 한 점도 기록하지 못한다고 다시 말해요.","c":1},"h":"0e7351fda3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["테니스는 한국에서 발명되었다.","테니스의 ‘러브’라는 단어가 어디에서 왔는지에 대한 흥미로운 이야기가 있다.","테니스에서 love는 10점을 의미한다.","아무도 ‘러브’라는 단어가 어디에서 왔는지 모른다."],"opts":["Tennis was invented in Korea.","There is an interesting story about where the word love in tennis came from.","Love means ten points in tennis.","Nobody knows where the word love came from."],"r":{"a":"2) There is an interesting story about where the word love in tennis came from. (테니스의 ‘러브’라는 단어가 어디에서 왔는지에 대한 흥미로운 이야기가 있다.)","ev":"8번 문장","s":[[8,"There is an interesting story about where the word love in tennis came from.","테니스의 ‘러브’라는 단어가 어디에서 왔는지에 대한 흥미로운 이야기가 있다."]],"w":"8번에서 테니스의 ‘러브’라는 단어가 어디에서 왔는지에 대한 흥미로운 이야기가 있다고 해요.","c":2},"h":"fe3c22415d"},{"n":9,"t":"sum","q":"What comes to (A) when you (B) “love game”?","ko":"당신이 ‘러브 게임’을 (B) 때 무엇이 (A)에 떠오르는가?","oko":["(A) 머릿속 / (B) 들을","(A) 머릿속 / (B) 볼","(A) 마음 / (B) 들을","(A) 마음 / (B) 볼","(A) 손 / (B) 먹을"],"opts":["(A) mind / (B) hear","(A) mind / (B) see","(A) heart / (B) hear","(A) heart / (B) see","(A) hand / (B) eat"],"r":{"a":"1) (A) mind / (B) hear ((A) 머릿속 / (B) 들을)","ev":"1번 문장","s":[[1,"What comes to mind when you hear “love game”?","‘러브 게임’을 들으면 무엇이 떠오르는가?"]],"w":"1번에서 ‘러브 게임’을 들을(hear) 때 무엇이 머릿속(mind)에 떠오르는지 물어요.","c":1},"h":"2874001bd1"},{"n":10,"t":"fill","q":"When tennis [A] started in France, scores were [B] on a scoreboard.","ko":"테니스가 프랑스에서 [A] 시작됐을 때, 점수는 점수판에 [B].","bank":["first","witty","written","complicated","popular","opponent"],"bko":{"first":"처음","witty":"재치 있는","written":"기록된(write의 과거분사)","complicated":"복잡한","popular":"인기 있는","opponent":"상대방"},"r":{"a":"[A] first (처음), [B] written (기록된(write의 과거분사))","ev":"9번 문장","s":[[9,"When tennis first started in France, scores were written on a scoreboard.","테니스가 프랑스에서 처음 시작됐을 때, 점수는 점수판에 기록되었다."]],"w":"9번에서 테니스가 프랑스에서 처음(first) 시작됐을 때, 점수는 점수판에 기록되었다(written)고 해요.","c":null},"h":"aedc538b98"}]},{"u":6,"id":"hk2-06-4","no":4,"ko":"먹어도 될까?","items":[{"n":1,"t":"tf","q":"The bottle of milk in the refrigerator is already opened.","ko":"냉장고 안의 우유병은 이미 개봉되어 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"You find an unopened bottle of milk in the refrigerator.","당신은 냉장고에서 개봉되지 않은 우유 한 병을 발견한다."]],"w":"2번 문장은 an unopened bottle of milk라고 해요. unopened는 '개봉되지 않은'이라는 뜻이라서 이미 열려 있다는 말은 틀려요.","c":"F"},"h":"be00479f93"},{"n":2,"t":"tf","q":"The use-by date is usually earlier than the sell-by date.","ko":"소비기한은 보통 유통기한보다 더 이르다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Usually, the use-by date is a few days or weeks later than the sell-by date.","보통, 소비기한은 유통기한보다 며칠 또는 몇 주 더 늦다."]],"w":"9번 문장은 the use-by date is a few days or weeks later than the sell-by date라고 해요. 소비기한이 더 늦지, 더 이르지 않아요.","c":"F"},"h":"537247de03"},{"n":3,"t":"tf","q":"It was reported in 2017 that more than 80% of Americans throw away perfectly good food.","ko":"2017년에 80퍼센트가 넘는 미국인들이 완전히 괜찮은 음식을 버린다고 보고되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"In fact, it was reported in 2017 that more than 80% of Americans throw away perfectly good food.","실제로, 2017년에 80퍼센트가 넘는 미국인들이 완전히 괜찮은 음식을 버린다고 보고되었다."]],"w":"13번 문장에 it was reported in 2017 that more than 80% of Americans throw away perfectly good food가 그대로 있어요. 내용과 일치해요.","c":"T"},"h":"938a74dbb1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The sell-by date tells stores how long they can display the product for sale.)","ko":"유통기한은 가게에 얼마나 오래 제품을 판매하기 위해 ( ) 수 있는지를 알려준다.","opts":["포장할","버릴","진열할","반품할"],"word":"display","r":{"a":"3) 진열할","ev":"6번 문장","s":[[6,"The sell-by date tells stores how long they can display the product for sale.","유통기한은 가게에 얼마나 오래 제품을 판매하기 위해 진열할 수 있는지를 알려준다."]],"w":"가게가 제품을 판매하기 위해 매장에 내놓는 기간을 말해요. 판매(for sale)를 위해 내놓는 것이니 display는 '진열하다'예요.","c":3},"h":"616cf674fc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As a result, people often waste food.)","ko":"결과적으로, 사람들은 종종 음식을 ( ).","opts":["요리한다","낭비한다","기부한다","저장한다"],"word":"waste","r":{"a":"2) 낭비한다","ev":"12~14번 문장","s":[[12,"As a result, people often waste food.","결과적으로, 사람들은 종종 음식을 낭비한다."],[13,"In fact, it was reported in 2017 that more than 80% of Americans throw away perfectly good food.","실제로, 2017년에 80퍼센트가 넘는 미국인들이 완전히 괜찮은 음식을 버린다고 보고되었다."],[14,"What a waste!","얼마나 낭비인가!"]],"w":"13번에서 사람들이 완전히 괜찮은 음식을 버린다고 하고, 14번은 What a waste!(얼마나 낭비인가!)예요. 그래서 waste는 '낭비하다'예요.","c":2},"h":"1414ecb8e8"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is the last day you can safely eat the food.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 음식을 안전하게 먹을 수 있는 마지막 날이다.","opts":["가게","유통기한","냉장고 안의 우유","소비기한"],"r":{"a":"4) 소비기한","ev":"7~8번 문장","s":[[7,"What you really need to check is the use-by date.","진짜로 확인해야 하는 것은 소비기한이다."],[8,"This is the last day you can safely eat the food.","이것은 음식을 안전하게 먹을 수 있는 마지막 날이다."]],"w":"7번에서 진짜로 확인해야 하는 것은 use-by date(소비기한)라고 했고, 8번 This는 바로 그 소비기한이에요. 유통기한(sell-by date)은 가게가 진열하는 기한이에요(6번).","c":4,"k":"This = 소비기한"},"h":"266d052aa5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So you can still eat food that is past its sell-by date, as long as it is before the use-by date.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 당신은 음식이 소비기한 이전인 한, 그것의 유통기한이 지난 음식을 여전히 먹을 수 있다.","opts":["소비기한 이전이기만 하면, 유통기한이 지난 음식도 여전히 먹을 수 있다.","유통기한이 지나면 음식은 어떤 경우에도 먹을 수 없다.","유통기한 전이기만 하면, 소비기한이 지난 음식도 먹을 수 있다.","유통기한이 지난 음식은 소비기한과 관계없이 먹어도 된다."],"r":{"a":"1) 소비기한 이전이기만 하면, 유통기한이 지난 음식도 여전히 먹을 수 있다.","ev":"10번 문장","s":[[10,"So you can still eat food that is past its sell-by date, as long as it is before the use-by date.","그래서 당신은 음식이 소비기한 이전인 한, 그것의 유통기한이 지난 음식을 여전히 먹을 수 있다."]],"w":"as long as it is before the use-by date는 '소비기한 전인 한'이에요. 유통기한이 지나도 소비기한이 지나지 않았을 때만 먹을 수 있다는 뜻이라서, 소비기한이 지난 음식까지 먹어도 된다는 말은 아니에요.","c":1},"h":"99d2a3cad8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["유통기한은 음식을 안전하게 먹을 수 있는 마지막 날이다.","진짜로 확인해야 하는 날짜는 소비기한이다.","유통기한이 지난 음식은 절대 먹으면 안 된다.","대부분의 미국인은 괜찮은 음식을 절대 버리지 않는다."],"opts":["The sell-by date is the last day you can safely eat food.","The date you really need to check is the use-by date.","You should never eat food after its sell-by date.","Most Americans never throw away good food."],"r":{"a":"2) The date you really need to check is the use-by date. (진짜로 확인해야 하는 날짜는 소비기한이다.)","ev":"7번 문장","s":[[7,"What you really need to check is the use-by date.","진짜로 확인해야 하는 것은 소비기한이다."]],"w":"7번에서 진짜로 확인해야 하는 것은 소비기한이라고 해요. 소비기한 이전이면 유통기한이 지난 음식도 먹을 수 있어요(10번).","c":2},"h":"10791b500e"},{"n":9,"t":"sum","q":"The bottle of milk says “Sell by April (A),” and today is April (B).","ko":"우유병에는 “4월 (A)일까지 판매”라고 쓰여 있고, 오늘은 4월 (B)일이다.","oko":["(A) 2 / (B) 10","(A) 10 / (B) 2","(A) 2 / (B) 20","(A) 12 / (B) 10","(A) 20 / (B) 2"],"opts":["(A) 2 / (B) 10","(A) 10 / (B) 2","(A) 2 / (B) 20","(A) 12 / (B) 10","(A) 20 / (B) 2"],"r":{"a":"1) (A) 2 / (B) 10 ((A) 2 / (B) 10)","ev":"1번, 3번 문장","s":[[1,"It’s April 10.","4월 10일이다."],[3,"On the bottle, it says “Sell by April 2.”","병 위에는 “4월 2일까지 판매”라고 쓰여 있다."]],"w":"1번에서 오늘은 4월 10일이고, 3번에서 우유병에는 4월 2일까지 판매라고 쓰여 있어요.","c":1},"h":"6a73bfb59f"},{"n":10,"t":"fill","q":"Unfortunately, it’s not always [A] to [B] these dates.","ko":"불행히도, 이 기한들을 [B]하는 것은 항상 [A] 일이 아니다.","bank":["easy","waste","distinguish","safely","product","perfectly"],"bko":{"easy":"쉬운","waste":"낭비하다","distinguish":"구분하다","safely":"안전하게","product":"제품","perfectly":"완벽하게"},"r":{"a":"[A] easy (쉬운), [B] distinguish (구분하다)","ev":"11번 문장","s":[[11,"Unfortunately, it’s not always easy to distinguish these dates.","불행히도, 이 기한들을 구분하는 것이 항상 쉽지만은 않다."]],"w":"11번에서 이 기한들을 구분하는(distinguish) 것이 항상 쉬운(easy) 것은 아니라고 해요.","c":null},"h":"54d689406f"}]},{"u":7,"id":"hk2-07-1","no":1,"ko":"Hot 뜨거 Hot 뜨거","items":[{"n":1,"t":"tf","q":"The iron in a hand warmer starts to rust when the package is opened.","ko":"포장을 열면 손난로 안의 철이 녹슬기 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"If you open the package, the iron in the packet is exposed to air and begins to rust.","만약 포장을 열면, 봉지 안에 있는 철이 공기에 노출되고 녹슬기 시작한다."]],"w":"6번 문장에서 포장을 열면 철이 공기에 노출되어 녹슬기 시작한다고 해요. 그대로 맞는 내용이에요.","c":"T"},"h":"cf46dfb008"},{"n":2,"t":"tf","q":"Shaking a hand warmer makes the reaction slower.","ko":"손난로를 흔들면 반응이 더 느려진다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"If you shake the hand warmer, the reaction occurs faster.","만약 손난로를 흔들면, 반응은 더 빠르게 일어난다."]],"w":"8번 문장에서 흔들면 반응이 더 빠르게(faster) 일어난다고 해요. 느려진다는 말은 반대예요.","c":"F"},"h":"a942bc2d6d"},{"n":3,"t":"tf","q":"A hand warmer starts to cool down after all of its iron is rusted.","ko":"철이 모두 녹슬고 나면 손난로는 식기 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"When all of the iron is rusted, the hand warmer no longer gives off heat and begins to cool down.","모든 철이 녹슬면, 손난로는 더 이상 열을 방출하지 않고 식기 시작한다."]],"w":"9번 문장에서 철이 모두 녹슬면 열을 내지 않고 식기 시작한다고 해요. 본문과 맞아요.","c":"T"},"h":"b964b46615"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is usually sealed in a plastic package.)","ko":"그것은 보통 비닐 포장 안에 ( ) 있다.","opts":["던져져","구겨져","밀봉되어","녹여져"],"word":"sealed","r":{"a":"3) 밀봉되어","ev":"5번 문장","s":[[5,"It is usually sealed in a plastic package.","그것은 보통 비닐 포장 안에 밀봉되어 있다."]],"w":"5번 문장은 손난로 봉지가 비닐 포장 안에 들어 있다는 설명이에요. 공기가 안 들어가게 막아 둔 상태라 is sealed는 '밀봉되어 있다'예요.","c":3},"h":"549b3c0ff1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This reaction releases heat energy.)","ko":"이 반응은 열에너지를 ( ).","opts":["방출한다","흡수한다","막는다","저장한다"],"word":"releases","r":{"a":"1) 방출한다","ev":"6~7번 문장","s":[[6,"If you open the package, the iron in the packet is exposed to air and begins to rust.","만약 포장을 열면, 봉지 안에 있는 철이 공기에 노출되고 녹슬기 시작한다."],[7,"This reaction releases heat energy.","이 반응은 열에너지를 방출한다."]],"w":"철이 녹스는 반응(6번)이 열을 내보내서 손난로가 따뜻해져요(7번). release(방출하다)는 '내보내다'라는 뜻이에요.","c":1},"h":"4f4adba219"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIf you shake them, they produce heat to keep you warm.","ko":"밑줄 친 they가 가리키는 것은?","sko":"만약 그것을 흔든다면, 그것은 당신을 따뜻하게 유지해 줄 열기를 만들어낸다.","opts":["손난로","추운 겨울날","철 가루","사람들"],"r":{"a":"1) 손난로","ev":"1~2번 문장","s":[[1,"Hand warmers are helpful on cold winter days.","추운 겨울날 손난로는 도움이 된다."],[2,"If you shake them, they produce heat to keep you warm.","만약 그것을 흔든다면, 그것은 당신을 따뜻하게 유지해 줄 열기를 만들어낸다."]],"k":"they = 손난로","w":"1번에서 손난로(Hand warmers)가 추운 겨울날 도움이 된다고 했어요. 2번의 they는 흔들면 열기를 만들어내는 손난로를 가리켜요.","c":1},"pron":"they","h":"6c48809f35"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\
