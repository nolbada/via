<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f766e">
<link rel="icon" type="image/png" href="../links/icon-192.png">
<title>틀린 곳 말하기 시험</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211f;--sub:#5b6b67;--line:#dbe3e0;--accent:#0f766e;--red:#d92d20;--redbg:#fee4e2;--green:#067647;--greenbg:#dcfae6;--gold:#f5b301}
@media (prefers-color-scheme:dark){:root{--bg:#10171a;--card:#182125;--ink:#e8eeec;--sub:#9db0ab;--line:#2a3639;--accent:#2fb5a8;--red:#ff7a70;--redbg:#4a1f1b;--green:#4ade80;--greenbg:#12331f}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:22px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--sub);margin:2px 0 14px}
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tabs button{flex:1;font:inherit;font-size:20px;font-weight:800;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lb{font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px;cursor:pointer;color:var(--ink);min-height:74px}
.lb:active{background:var(--line)}
.lb b{display:block;font-size:22px;color:var(--accent)}
.lb span{font-size:12.5px;color:var(--sub);line-height:1.3;display:block;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.btn{font:inherit;font-size:16px;font-weight:700;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.ttl{font-size:20px;font-weight:800;margin:0 8px 0 0}
.balls{display:flex;justify-content:center;gap:14px;padding:50px 0}
.ball{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#2b1d00;background:radial-gradient(circle at 30% 28%,#fff3b0,var(--gold) 60%,#c78c00);box-shadow:0 4px 10px rgba(0,0,0,.25);animation:roll .5s infinite}
.ball:nth-child(2){animation-delay:.08s}.ball:nth-child(3){animation-delay:.16s}.ball:nth-child(4){animation-delay:.24s}.ball:nth-child(5){animation-delay:.32s}
@keyframes roll{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.q.ok{border-color:var(--green);box-shadow:inset 6px 0 0 var(--green)}
.q.ng{border-color:var(--red);box-shadow:inset 6px 0 0 var(--red)}
.qh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.qn{font-size:15px;font-weight:800;color:#fff;background:var(--accent);border-radius:999px;padding:3px 12px}
.mk{display:flex;gap:6px}
.mk button{font:inherit;font-size:15px;font-weight:800;padding:8px 16px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.mk .o.on{background:var(--green);border-color:var(--green);color:#fff}
.mk .x.on{background:var(--red);border-color:var(--red);color:#fff}
.en{font-size:27px;line-height:1.65;font-weight:600;margin:4px 0}
.en .bad{color:var(--red);background:var(--redbg);border-bottom:4px solid var(--red);border-radius:4px;padding:0 3px;font-weight:800}
.ko{font-size:15px;color:var(--sub);margin:2px 0 10px}
.ans{border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.fx{font-size:20px;margin:6px 0;line-height:1.5}
.fx .w{color:var(--red);text-decoration:line-through;font-weight:700}
.fx .r{color:var(--green);font-weight:800}
.fx .tp{display:block;font-size:15px;color:var(--sub);margin-left:1.5em}
.pen{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;z-index:5}
.pen .cnt{font-size:18px;font-weight:700}
.pen .res{font-size:24px;font-weight:900;padding:6px 18px;border-radius:12px}
.res.p0{background:var(--greenbg);color:var(--green)}
.res.p3{background:#fff3cd;color:#8a5a00}.res.p4{background:#ffe0b2;color:#a04a00}.res.p5{background:var(--redbg);color:var(--red)}
.rule{font-size:13px;color:var(--sub);text-align:center}
.hide{display:none}
@media print{.pen,.bar,.tabs{display:none}}
</style></head><body>
<main>
<div class="top"><h1>틀린 곳 말하기 시험 <span style="font-size:14px;color:var(--sub);font-weight:600">· 선생님용 (정답 보임)</span></h1>
<a class="btn" href="./">← 시험 모음</a></div>
<p class="sub" id="sub">레슨을 누르면 이 레슨의 틀린 문장 5개가 뽑혀요. 학생은 빨간 줄이 그어진 곳이 왜 틀렸는지 말로 설명해요.</p>

<div id="pick">
 <div class="tabs"><button data-b="m1">M1 Reading</button><button data-b="m2">M2 Reading</button></div>
 <div class="grid" id="grid"></div>
</div>

<div id="test" class="hide">
 <div class="bar"><button class="btn" id="back">← 레슨 고르기</button><span class="ttl" id="ttl"></span><button class="btn pri" id="redraw">🎱 다시 뽑기</button></div>
 <div id="cards"></div>
 <div class="pen" id="pen"><span class="cnt" id="cnt"></span><span class="res p0" id="res"></span><span class="rule">0~2개 틀림 통과 · 3개 5문장 · 4개 10문장 · 5개 15문장 쓰기</span></div>
</div>
</main>
<script>
var DATA={"m1":[{"no":"01","t":"Me and My Three Emojis","q":[{"n":1,"en":"Hello! Me name is Jaeho.","ko":"안녕! 내 이름은 재호야.","fx":[{"w":"Me","r":"My","at":1,"t":"인칭대명사의 소유격","m":"name 앞에는 소유격 My 사용"}]},{"n":2,"en":"I from Korea. I'm on the first grade of middle school.","ko":"나는 한국에서 왔어. 나는 중학교 1학년이야.","fx":[{"w":"I","r":"I'm","at":0,"t":"be동사의 긍정문","m":"주어 I 뒤에는 be동사 am(I'm) 필요"},{"w":"on","r":"in","at":4,"t":"기본전치사","m":"'~학년에'는 전치사 in 사용 (on 아님)"}]},{"n":3,"en":"Look at my smile! I always smile, so much people like me.","ko":"내 미소를 봐! 나는 항상 웃어서, 많은 사람들이 나를 좋아해.","fx":[{"w":"much","r":"many","at":8,"t":"수량 형용사 many/much","m":"셀 수 있는 복수명사 people 앞에는 many 사용"}]},{"n":4,"en":"In my free time, I plays soccer with my friends. I love soccer.","ko":"여가 시간에, 나는 친구들과 축구를 해. 나는 축구를 아주 좋아해.","fx":[{"w":"plays","r":"play","at":5,"t":"일반동사의 현재형","m":"주어 I는 동사원형 play: plays 아님"}]},{"n":5,"en":"I'm in the school soccer club. I also love musics.","ko":"나는 학교 축구부에 속해 있어. 나는 음악도 아주 좋아해.","fx":[{"w":"musics","r":"music","at":9,"t":"셀 수 없는 명사","m":"music은 셀 수 없는 명사라 복수형 없이 music 사용"}]},{"n":6,"en":"I'm in the sing club too. Both clubs is fun!","ko":"나는 합창부에도 속해 있어. 두 동아리 모두 재미있어!","fx":[{"w":"sing","r":"singing","at":3,"t":"동명사","m":"명사 club을 꾸미는 말은 동명사 singing 사용"},{"w":"is","r":"are","at":8,"t":"be동사의 수일치","m":"주어 Both clubs(복수)는 are: is 아님"}]},{"n":8,"en":"messi10: I likes soccer too!","ko":"messi10: 나도 축구 좋아해!","fx":[{"w":"likes","r":"like","at":2,"t":"일반동사의 현재형","m":"주어 I에는 likes가 아닌 like 사용"}]},{"n":9,"en":"I'm Diego. I from Mexico.","ko":"나는 디에고야. 나는 멕시코에서 왔어.","fx":[{"w":"I","r":"I'm","at":2,"t":"be동사의 긍정문","m":"주어 I 뒤에는 be동사 am(I'm) 필요"}]},{"n":10,"en":"I have an cat. She name is Bella.","ko":"나는 고양이가 한 마리 있어. 그녀의 이름은 벨라야.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"자음 소리 cat 앞에는 a 사용"},{"w":"She","r":"Her","at":4,"t":"인칭대명사의 소유격","m":"name 앞에는 소유격 Her 사용"}]},{"n":11,"en":"(Meow!) She is so sweetly!","ko":"(야옹!) 그녀는 정말 사랑스러워!","fx":[{"w":"sweetly","r":"sweet","at":4,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 sweet 사용"}]},{"n":12,"en":"I often take a pictures of Bella and post them online. Also, I like a tacos.","ko":"나는 자주 벨라의 사진을 찍어서 온라인에 올려. 또한, 나는 타코를 좋아해.","fx":[{"w":"a pictures","r":"pictures","at":3,"t":"관사 a/an","m":"복수명사 pictures 앞에는 a를 쓰지 않음"},{"w":"a tacos","r":"tacos","at":14,"t":"관사 a/an","m":"복수명사 tacos 앞에는 a를 쓰지 않음"}]},{"n":13,"en":"I sometimes makes them with my mom.","ko":"나는 가끔 엄마와 함께 타코를 만들어.","fx":[{"w":"makes","r":"make","at":2,"t":"일반동사의 현재형","m":"주어 I에는 makes가 아닌 make 사용"}]},{"n":15,"en":"I'm Amara. I live on Thailand.","ko":"나는 아마라야. 나는 태국에 살아.","fx":[{"w":"on","r":"in","at":4,"t":"기본전치사","m":"'~(나라)에 살다'는 live in 사용"}]},{"n":16,"en":"I have a warmly heart. I often help other peoples and feel happy.","ko":"나는 따뜻한 마음을 가졌어. 나는 자주 다른 사람들을 도우며 행복함을 느껴.","fx":[{"w":"warmly","r":"warm","at":3,"t":"형용사와 부사","m":"명사 heart를 꾸미는 말은 형용사 warm 사용"},{"w":"peoples","r":"people","at":9,"t":"불규칙 복수형","m":"people은 이미 복수형이라 peoples 아님"}]},{"n":17,"en":"I like dancing and exercise. I practice dance moves every days.","ko":"나는 춤과 운동을 좋아해. 나는 매일 춤 동작을 연습해.","fx":[{"w":"days","r":"day","at":10,"t":"every + 단수명사","m":"every 뒤에는 단수명사 day 사용"}]},{"n":18,"en":"I also go to the gym for exercise. I feel so healthily!","ko":"나는 운동하러 체육관에도 가. 나는 정말 건강하다고 느껴!","fx":[{"w":"healthily","r":"healthy","at":11,"t":"형용사와 부사","m":"feel 뒤 보어 자리에는 형용사 healthy 사용"}]},{"n":19,"en":"p0wer: Great! Who do you do for exercise?","ko":"p0wer: 멋지다! 너는 운동으로 무엇을 하니?","fx":[{"w":"Who","r":"What","at":2,"t":"의문사","m":"'무엇을'을 묻는 의문사는 What 사용"}]},{"n":21,"en":"Can you guessed my country? You can sees the baguette.","ko":"내 나라가 어디인지 맞혀 볼래? 너는 바게트를 볼 수 있어.","fx":[{"w":"guessed","r":"guess","at":2,"t":"조동사 can","m":"Can you 뒤에는 동사원형 guess 사용"},{"w":"sees","r":"see","at":7,"t":"조동사 can","m":"조동사 can 뒤에는 동사원형 see 사용"}]},{"n":23,"en":"Enzo is my twin brothers. We are best friends!","ko":"엔조는 내 쌍둥이 남동생이야. 우리는 가장 친한 친구야!","fx":[{"w":"brothers","r":"brother","at":4,"t":"명사의 단수형" 보세요.","fx":[{"w":"spicily","r":"spicy","at":7,"t":"형용사와 부사","m":"명사 앞에는 형용사 spicy 사용"},{"w":"you","r":"your","at":12,"t":"인칭대명사의 소유격","m":"own 앞에는 소유격 your 사용"}]},{"n":11,"en":"Let's keep move to the next match. Two rice dishes is waiting for us.","ko":"다음 경기로 넘어가 봅시다. 두 가지 쌀 요리가 우리를 기다리고 있습니다.","fx":[{"w":"move","r":"moving","at":2,"t":"동명사","m":"keep 뒤에는 동명사 moving 사용"},{"w":"is","r":"are","at":10,"t":"be동사 수일치·과거","m":"주어 Two rice dishes(복수): are (is 아님)"}]},{"n":12,"en":"Paella has rice, meat, and seafood in it. People cook paella in a large, flat pans.","ko":"파에야에는 쌀, 고기, 그리고 해산물이 들어 있습니다. 사람들은 파에야를 크고 납작한 팬에 요리합니다.","fx":[{"w":"pans","r":"pan","at":15,"t":"명사의 단수형","m":"a 뒤에는 단수명사 pan 사용"}]},{"n":13,"en":"The food's name comes from an word for this pan. Spanish people loves paella.","ko":"그 음식의 이름은 이 팬을 일컫는 단어에서 유래합니다. 스페인 사람들은 파에야를 정말 좋아합니다.","fx":[{"w":"an","r":"a","at":5,"t":"관사 a/an","m":"자음 소리 word 앞에는 a 사용"},{"w":"loves","r":"love","at":12,"t":"수일치","m":"복수 취급하는 people에는 love 사용"}]},{"n":14,"en":"They even celebrate National Paella Day in March 27!","ko":"그들은 심지어 3월 27일에 국가 파에야의 날을 기념합니다!","fx":[{"w":"in","r":"on","at":6,"t":"기본전치사","m":"날짜 앞에는 전치사 on 사용"}]}]},{"no":"12","t":"Safety Quiz","q":[{"n":1,"en":"Does you know any safety rules? Answer the questions and be ready for emergencies.","ko":"여러분은 어떤 안전 수칙을 알고 있나요? 질문에 답하고 비상 상황에 대비하세요.","fx":[{"w":"Does","r":"Do","at":0,"t":"의문문 do/does","m":"주어 you에는 Do 사용"}]},{"n":2,"en":"My friend are running down the stairs. He fall and can't move.","ko":"제 친구가 계단을 뛰어 내려가고 있어요. 그는 넘어져서 움직일 수 없어요.","fx":[{"w":"are","r":"is","at":2,"t":"be동사의 긍정문","m":"주어 My friend(단수)에는 is 사용"},{"w":"fall","r":"falls","at":8,"t":"3인칭 단수 현재형","m":"주어 He(3인칭 단수)는 동사에 -s: falls (fall 아님)"}]},{"n":4,"en":"1. Take him to the doctor quick.","ko":"1. 친구를 의사에게 빨리 데려간다.","fx":[{"w":"quick","r":"quickly","at":6,"t":"형용사와 부사","m":"동사 Take를 꾸미는 부사 quickly 사용"}]},{"n":6,"en":"Tip: Do not move your friend. You can hurt he.","ko":"힌트: 친구를 움직이지 마세요. 여러분이 친구를 다치게 할 수 있어요.","fx":[{"w":"he","r":"him","at":9,"t":"인칭대명사의 목적격","m":"동사 hurt 뒤에는 목적격 him 사용"}]},{"n":7,"en":"Wait to the ambulance.","ko":"구급차를 기다리세요.","fx":[{"w":"to","r":"for","at":1,"t":"기본전치사","m":"\"~를 기다리다\"는 wait for 사용"}]},{"n":8,"en":"You are riding the elevator. Suddenly, it shakes a lots.","ko":"여러분은 엘리베이터를 타고 있습니다. 갑자기 엘리베이터가 많이 흔들립니다.","fx":[{"w":"lots","r":"lot","at":9,"t":"수량 표현","m":"\"많이\"는 a lot 사용 (a lots 아님)"}]},{"n":9,"en":"Are this an emergency? What do you do?","ko":"이건 비상 상황일까요? 여러분은 무엇을 해야 하죠?","fx":[{"w":"Are","r":"Is","at":0,"t":"be동사의 의문문","m":"주어 this(단수)는 Is로 시작: Is (Are 아님)"}]},{"n":10,"en":"1. Push the emergency button and wait for helps.","ko":"1. 비상 버튼을 누르고 도움을 기다린다.","fx":[{"w":"helps","r":"help","at":8,"t":"셀 수 없는 명사","m":"help는 셀 수 없는 명사라서 helps 쓰지 않음"}]},{"n":11,"en":"2. Push the buttons for all the floor and get off to the elevator right away.","ko":"2. 모든 층의 버튼을 누르고 엘리베이터에서 바로 내린다.","fx":[{"w":"floor","r":"floors","at":7,"t":"all the + 복수명사","m":"\"모든 층\"은 복수 floors 사용"},{"w":"to the","r":"the","at":11,"t":"동사구와 전치사","m":"get off 뒤에는 전치사 없이 the elevator 사용"}]},{"n":12,"en":"Tip: The elevator can stop anytime and become dangerously. Get off on the next floor.","ko":"힌트: 엘리베이터는 언제든지 멈춰서 위험해질 수 있어요. 다음 층에서 내리세요.","fx":[{"w":"dangerously","r":"dangerous","at":8,"t":"형용사와 부사","m":"become 뒤 보어 자리에는 형용사 dangerous 사용"}]},{"n":13,"en":"My brother is eat soup. Ouch!","ko":"제 남동생이 국을 먹고 있어요. 아야!","fx":[{"w":"eat","r":"eating","at":3,"t":"현재진행형","m":"현재진행형은 is + eating 형태"}]},{"n":14,"en":"It's too hotly! His hand hurts.","ko":"그건 너무 뜨거워요! 그의 손이 아파요.","fx":[{"w":"hotly","r":"hot","at":2,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 hot 사용"}]},{"n":16,"en":"1. Put ices on his hand.","ko":"1. 남동생 손에 얼음을 얹는다.","fx":[{"w":"ices","r":"ice","at":2,"t":"셀 수 없는 명사","m":"ice는 셀 수 없는 명사이므로 ice 사용"}]},{"n":18,"en":"Tip: Ice are too cold. It can hurt his skin.","ko":"힌트: 얼음은 너무 차가워요. 얼음은 그의 피부를 다치게 할 수 있어요.","fx":[{"w":"are","r":"is","at":2,"t":"be동사의 긍정문","m":"주어 Ice(셀 수 없는 명사)에는 is 사용"}]},{"n":20,"en":"Do you understand this safety rules now? Please remember them and stay safely!","ko":"여러분은 이제 이러한 안전 수칙을 이해하나요? 이 수칙을 기억하고 안전하게 지내세요!","fx":[{"w":"this","r":"these","at":3,"t":"지시형용사 this/these","m":"복수명사 rules 앞에는 these 사용"},{"w":"safely","r":"safe","at":12,"t":"형용사와 부사","m":"stay 뒤 보어 자리에는 형용사 safe 사용"}]}]},{"no":"13","t":"Fun School Events Around the World","q":[{"n":2,"en":"Today is Cross Country Race Day. It's an big sport event at our school.","ko":"오늘은 크로스컨트리 경주 날이야. 이것은 우리 학교의 큰 스포츠 행사야.","fx":[{"w":"an","r":"a","at":7,"t":"관사 a/an","m":"big는 자음 소리로 시작하므로 a big 사용"}]},{"n":3,"en":"We runs 4 kilometers in the woods. The course have small hills and lots of trees.","ko":"우리는 숲에서 4킬로미터를 달려. 코스에는 작은 언덕과 많은 나무들이 있어.","fx":[{"w":"runs","r":"run","at":1,"t":"일반동사 수일치","m":"주어 We → run (runs 아님)"},{"w":"have","r":"has","at":9,"t":"3인칭 단수 현재형","m":"주어 The course는 단수 → has (have 아님)"}]},{"n":4,"en":"It is a hard race, but we can finish it. Now, we waiting at the starting line!","ko":"힘든 경주이지만 우리는 그것을 끝낼 수 있어. 이제 우리는 출발선에서 기다리고 있어!","fx":[{"w":"we","r":"we're","at":11,"t":"현재진행형","m":"현재진행형은 be동사 필요: we're waiting"}]},{"n":5,"en":"How much languages do you have in your country? We has over 100 languages.","ko":"너희 나라에는 몇 개의 언어가 있니? 우리는 100개가 넘는 언어를 가지고 있어.","fx":[{"w":"much","r":"many","at":1,"t":"수량 형용사 many/much","m":"languages는 셀 수 있으므로 many 사용"},{"w":"has","r":"have","at":10,"t":"일반동사 수일치","m":"주어 We → have (has 아님)"}]},{"n":6,"en":"August is National Language Month. There is many events at schools.","ko":"8월은 국가 언어의 달이야. 학교에서는 많은 행사가 있어.","fx":[{"w":"is","r":"are","at":6,"t":"be동사의 수일치","m":"복수명사 events → are (is 아님)"}]},{"n":7,"en":"We have speech contests. We read poems and act in us languages.","ko":"우리는 말하기 대회를 해. 우리는 우리의 언어로 시를 읽고 연기를 해.","fx":[{"w":"us","r":"our","at":10,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 our 사용"}]},{"n":8,"en":"I'm proud for our languages!","ko":"나는 우리의 언어가 자랑스러워!","fx":[{"w":"for","r":"of","at":2,"t":"기본전치사","m":"be proud of: ~을 자랑스러워하다"}]},{"n":9,"en":"At my school, every students joins the orchestra, the chorus, or the music band. Soon, we will have an concert in the music hall.","ko":"우리 학교에서는 모든 학생이 오케스트라, 합창단, 또는 음악 밴드에 참여해. 곧, 우리는 음악 홀에서 연주회를 할 거야.","fx":[{"w":"students","r":"student","at":4,"t":"수량 형용사 every","m":"every 뒤에는 단수명사 student 사용"},{"w":"an","r":"a","at":18,"t":"관사 a/an","m":"concert는 자음 소리로 시작하므로 a 사용"}]},{"n":10,"en":"I will play the violin in the orchestra. Tom will sing on the chorus, and Annie will plays the guitar in the band.","ko":"나는 오케스트라에서 바이올린을 연주할 거야. Tom은 합창단에서 노래를 부를 것이고, Annie는 밴드에서 기타를 연주할 거야.","fx":[{"w":"on","r":"in","at":11,"t":"기본전치사","m":"합창단 안에서 노래한다는 뜻은 in the chorus"},{"w":"plays","r":"play","at":17,"t":"조동사 will","m":"조동사 will 뒤에는 동사원형 play 사용"}]},{"n":11,"en":"My parents are waiting for the concert. I'm nervously but excited!","ko":"나의 부모님은 연주회를 기다리고 계셔. 나는 긴장되지만 신나!","fx":[{"w":"nervously","r":"nervous","at":8,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 nervous 사용"}]},{"n":12,"en":"We have a digital writing contest today. We write stories and take picture with our smartphones.","ko":"우리는 오늘 디지털 글쓰기 대회를 해. 우리는 스마트폰으로 이야기를 쓰고 사진을 찍어.","fx":[{"w":"picture","r":"pictures","at":12,"t":"명사의 복수형","m":"여러 장의 사진은 복수형 pictures 사용"}]},{"n":14,"en":"I will write about the school garden and post pictures of the beautifully flowers. It will be fun!","ko":"나는 학교 정원에 관해 쓰고 아름다운 꽃 사진을 올릴 거야. 재미있을 거야!","fx":[{"w":"beautifully","r":"beautiful","at":12,"t":"형용사와 부사","m":"명사 flowers를 꾸미는 건 형용사 beautiful"}]}]},{"no":"14","t":"Healthy and Yummy Snacks for You","q":[{"n":2,"en":"Today, we have three teen chef on the show. They're making healthily and delicious snacks, and they will tell we about them.","ko":"오늘 세 명의 십 대 요리사들이 쇼에 나옵니다. 그들은 건강하고 맛있는 간식들을 만들고 있고, 우리에게 그것들에 대해 이야기해 줄 것입니다.","fx":[{"w":"chef","r":"chefs","at":5,"t":"명사의 복수형","m":"three 뒤에는 복수명사 chefs 사용"},{"w":"healthily","r":"healthy","at":11,"t":"형용사와 부사","m":"snacks를 꾸 imin and Sora couldn't see the stage. At that time, the show start, and the boys kind took off their hairbands.","ko":"슬프게도 지민이와 소라는 무대를 볼 수 없었다. 그때 쇼가 시작했고, 남학생들은 친절하게도 머리띠를 벗었다.","fx":[{"w":"start","r":"started","at":13,"t":"3인칭 단수 현재형·과거형","m":"주어 the show(단수)에는 started 사용"},{"w":"kind","r":"kindly","at":17,"t":"형용사와 부사","m":"동사 took off를 꾸미는 부사 kindly 사용"}]},{"n":19,"en":"\"Let's take off our hairbands, too,\" Sora said to Jimin. They smiled at each others.","ko":"\"우리도 머리띠를 벗자,\" 소라가 지민이에게 말했다. 그들은 서로에게 미소를 지었다.","fx":[{"w":"others","r":"other","at":14,"t":"상호대명사","m":"each other는 each others로 쓰지 않음"}]},{"n":20,"en":"On the subway ride back home, Jimin thought, \"Small acts have really power. Because them, we can be happy or unhappy.\"","ko":"집으로 돌아오는 지하철에서 지민이는 생각했다, \"작은 행동들은 진정한 힘을 가지고 있구나. 그 행동들로 인해 우리는 행복할 수도, 언짢을 수도 있어.\"","fx":[{"w":"really","r":"real","at":11,"t":"형용사와 부사","m":"명사 power 앞에는 형용사 real 사용"},{"w":"them","r":"of them","at":14,"t":"접속사와 전치사","m":"명사(대명사) 앞 '~ 때문에'는 Because of them 사용"}]}]},{"no":"24","t":"Different Attitudes, Different Results","q":[{"n":1,"en":"Every years, Yuna's school holds a dance contest. This year's contest are next month.","ko":"매년, 유나의 학교는 춤 경연 대회를 개최한다. 올해 대회는 다음 달에 있다.","fx":[{"w":"years","r":"year","at":1,"t":"every + 단수명사","m":"every 뒤에는 단수명사 year 사용"},{"w":"are","r":"is","at":11,"t":"be동사의 현재형","m":"주어 contest(단수)에는 is 사용"}]},{"n":2,"en":"Yuna: Let's make an team and enter the contest.","ko":"유나: 팀을 만들어서 대회에 참가하자.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"자음 소리 team 앞에는 a 사용"}]},{"n":3,"en":"Suho: Are you kidding? We're all terrible dancer.","ko":"수호: 농담하는 거지? 우리는 모두 춤을 정말 못 추잖아.","fx":[{"w":"dancer","r":"dancers","at":7,"t":"명사의 복수형","m":"all 뒤에는 복수명사 dancers 사용"}]},{"n":4,"en":"Bora: I know, but I'm interest.","ko":"보라: 알아, 하지만 나는 관심 있어.","fx":[{"w":"interest","r":"interested","at":5,"t":"형용사와 명사","m":"be동사 뒤 보어는 형용사 interested 사용"}]},{"n":6,"en":"Yuna: Let's does it. Sounds well, Suho?","ko":"유나: 해 보자. 괜찮지, 수호야?","fx":[{"w":"does","r":"do","at":2,"t":"Let's 구문","m":"Let's 뒤에는 동사원형 do 사용"},{"w":"well","r":"good","at":5,"t":"감각동사와 형용사","m":"sound 뒤 보어는 형용사 good 사용"}]},{"n":8,"en":"What will happen next? Read the following two different situation.","ko":"이후에 무슨 일이 일어날까? 다음 두 가지 다른 상황을 읽어 보자.","fx":[{"w":"situation","r":"situations","at":9,"t":"명사의 복수형","m":"two 뒤에는 복수명사 situations 사용"}]},{"n":9,"en":"D-14 Yuna and she teammates are in the practice room, but no one looks happily.","ko":"<대회 14일 전> 유나와 팀원들은 연습실에 있지만, 아무도 즐거워 보이지 않는다.","fx":[{"w":"she","r":"her","at":3,"t":"인칭대명사의 소유격","m":"teammates 앞에는 소유격 her 사용"},{"w":"happily","r":"happy","at":14,"t":"형용사와 부사","m":"look 뒤 보어는 형용사 happy 사용"}]},{"n":10,"en":"Suho: We're making too much mistakes.","ko":"수호: 우리는 실수를 너무 많이 하고 있어.","fx":[{"w":"much","r":"many","at":4,"t":"수량 형용사 many/much","m":"셀 수 있는 mistakes 앞에는 many 사용"}]},{"n":12,"en":"Suho: By the ways, where's Minsu?","ko":"수호: 그런데, 민수는 어디 있어?","fx":[{"w":"ways","r":"way","at":3,"t":"숙어 표현","m":"숙어 By the way는 단수 way 사용"}]},{"n":13,"en":"Yuna: Well, he's sick. He texted I.","ko":"유나: 음, 아프대. 나한테 문자했어.","fx":[{"w":"I","r":"me","at":6,"t":"인칭대명사의 목적격","m":"동사 뒤 목적어는 목적격 me 사용"}]},{"n":14,"en":"Bora: Really? I seen him last night, and he was all right.","ko":"보라: 정말? 내가 어젯밤에 민수를 봤는데, 괜찮았어.","fx":[{"w":"seen","r":"saw","at":3,"t":"불규칙 과거형","m":"last night 과거: saw (seen 아님)"}]},{"n":15,"en":"D-1 The contest is tomorrow, but Yuna and her teammates is not practicing.","ko":"<대회 1일 전> 대회는 내일이지만, 유나와 팀원들은 연습하지 않고 있다.","fx":[{"w":"is","r":"are","at":10,"t":"be동사의 현재진행형","m":"복수 주어에는 are 사용"}]},{"n":17,"en":"Minsu: Me, too. We're not get anywhere.","ko":"민수: 나도. 우리는 나아지지 않고 있어.","fx":[{"w":"get","r":"getting","at":5,"t":"현재진행형","m":"be동사+현재분사: getting (get 아님)"}]},{"n":19,"en":"Yuna: The dance contest were not a good idea.","ko":"유나: 춤 경연 대회는 좋은 생각이 아니었어.","fx":[{"w":"were","r":"was","at":4,"t":"be동사의 과거형","m":"주어 contest 단수: was (were 아님)"}]},{"n":20,"en":"Suho: I agrees, but it's not your fault.","ko":"수호: 동의해, 하지만 네 잘못은 아니야.","fx":[{"w":"agrees","r":"agree","at":2,"t":"일반동사의 현재형","m":"주어 I에는 agree (agrees 아님)"}]},{"n":21,"en":"Yuna: Why don't we just quitting?","ko":"유나: 우리 그냥 그만두는 게 어때?","fx":[{"w":"quitting","r":"quit","at":5,"t":"의문문","m":"Why don't we 뒤에는 동사원형 quit 사용"}]},{"n":22,"en":"After weeks of unhappy practices, they finally quits. They felt hopeless.","ko":"몇 주간의 불만스러운 연습 후에, 그들은 결국 그만두었다. 그들은 가망이 없다고 느꼈다.","fx":[{"w":"quits","r":"quit","at":7,"t":"일반동사의 과거형","m":"과거 시제: quit (quits 아님)"}]}]},{"no":"25","t":"Hidden Heroes","q":[{"n":1,"en":"Hello, I'm Miso from Boram Middle School. Let's meet some baseball hero.","ko":"안녕, 나는 보람 중학교에 다니는 미소야. 몇몇 야구 영웅들을 만나보자.","fx":[{"w":"hero","r":"heroes","at":11,"t":"명사의 복수형","m":"some 뒤에는 복수명사 heroes 사용"}]},{"n":2,"en":"They is not the players. Who are they?","ko":"그들은 선수가 아니야. 그들은 누굴까?","fx":[{"w":"is","r":"are","at":1,"t":"be동사의 수일치","m":"주어 They(복수)에는 are (is 아님)"}]},{"n":3,"en":"Jina: I watch everything very careful. I makes big decisions during baseball games.","ko":"Jina: 나는 모든 것을 매우 주의 깊게 지켜봐요. 나는 야구 경기 중에 큰 결정을 내려요.","fx":[{"w":"careful","r":"carefully","at":5,"t":"형용사와 부사","m":"동사 watch를 꾸미는 부사 carefully 사용"},{"w":"makes","r":"make","at":7,"t":"3인칭 단수 현재형","m":"주어 I에는 make (makes 아님)"}]},{"n":4,"en":"I use words like, \"ball,\" \"strike,\" \"safe,\" and \"out.\" Me voice is very loud.","ko":"나는 \"볼\", \"스트라이크\", \"세이프\", 그리고 \"아웃\"과 같은 단어들을 사용해요. 내 목소리는 매우 커요.","fx":[{"w":"Me","r":"My","at":9,"t":"인칭대명사의 소유격","m":"명사 voice 앞에는 소유격 My 사용"}]},{"n":5,"en":"Everyone can hear I. I'm always fair!","ko":"모두가 나를 들을 수 있어요. 나는 항상 공정해요!","fx":[{"w":"I","r":"me","at":3,"t":"인칭대명사의 목적격","m":"동사 hear 뒤 목적어는 me 사용"}]},{"n":6,"en":"Yogi: I doesn't play in baseball games. But pitcher need me.","ko":"Yogi: 나는 야구 경기를 하지 않아요. 하지만 투수들은 나를 필요로 해요.","fx":[{"w":"doesn't","r":"don't","at":2,"t":"do동사의 부정문","m":"주어 I에는 don't 사용"},{"w":"pitcher","r":"pitchers","at":8,"t":"명사의 복수형","m":"need와 어울리는 복수 주어 pitchers 사용"}]},{"n":8,"en":"An pitcher is throwing a baseball. I will catches it.","ko":"투수 한 명이 야구공을 던지고 있어요. 나는 그것을 잡을 거예요.","fx":[{"w":"An","r":"A","at":0,"t":"관사 a/an","m":"pitcher는 자음 소리라 A 사용"},{"w":"catches","r":"catch","at":8,"t":"조동사 will","m":"조동사 will 뒤에는 동사원형 catch 사용"}]},{"n":10,"en":"Teo: I collect datas about baseball games. I put the data into an computer.","ko":"Teo: 나는 야구 경기에 관한 자료를 수집해요. 나는 그 자료를 컴퓨터에 입력해요.","fx":[{"w":"datas","r":"data","at":3,"t":"셀 수 없는 명사","m":"data는 셀 수 없어 s 없이 data 사용"},{"w":"an","r":"a","at":12,"t":"관사 a/an","m":"computer는 자음 소리라 a 사용"}]},{"n":11,"en":"Then I can find usefully facts. Who will pitch good on cloudy days?","ko":"그러면 나는 유용한 사실을 찾을 수 있어요. 누가 흐린 날에 공을 잘 던질까?","fx":[{"w":"usefully","r":"useful","at":4,"t":"형용사와 부사","m":"명사 facts 앞에는 형용사 useful 사용"},{"w":"good","r":"well","at":9,"t":"형용사와 부사","m":"동사 pitch를 꾸미는 부사 well 사용"}]},{"n":12,"en":"Who will hit best in night games? I'm very good on math!","ko":"누가 야간 경기에서 공을 가장 잘 칠까? 나는 수학을 매우 잘해요!","fx":[{"w":"on","r":"at","at":10,"t":"기본전치사","m":"'~을 잘하는'은 good at 사용"}]},{"n":13,"en":"Wally: Cheese! I'm take a picture with a fan.","ko":"Wally: 치즈! 나는 팬과 사진을 찍고 있어요.","fx":[{"w":"take","r":"taking","at":3,"t":"현재진행형","m":"현재진행형은 be + 동사ing, taking 사용"}]},{"n":15,"en":"The suit are very heavy. But that's okay.","ko":"그 의상은 매우 무거워요. 하지만 괜찮아요.","fx":[{"w":"are","r":"is","at":2,"t":"be동사의 수일치","m":"단수 주어 The suit에는 is 사용"}]},{"n":16,"en":"Everyone love me!","ko":"모두가 나를 사랑해요!","fx":[{"w":"love","r":"loves","at":1,"t":"3인칭 단수 현재형","m":"Everyone은 단수 취급, loves 사용"}]}]},{"no":"26","t":"We Have a Cat on Our Team!","q":[{"n":2,"en":"\"I have an exciting news for you. We have an new member,\" Coach Biscuit said.","ko":"\"너희들에게 신나는 소식이 있단다. 새로운 멤버가 있어.\" Biscuit 코치가 말했다.","fx":[{"w":"an","r":"some","at":2,"t":"셀 수 없는 명사","m":"news는 불가산이므로 an 대신 some 사용"},{"w":"an","r":"a","at":9,"t":"관사 a/an","m":"자음 소리 n 앞에는 a 사용"}]},{"n":3,"en":"\"Everyone, let's welcome our friend new. Cathy, please come out.\"","ko":"\"모두, 새 친구를 환영합시다. Cathy, 나와 주세요.\"","fx":[{"w":"friend new","r":"new friend","at":4,"t":"형용사의 위치","m":"형용사 new는 명사 friend 앞에 사용"}]},{"n":4,"en":"\"Coach, is the new member an cat?\" Max shouted.","ko":"\"코치님, 새 멤버가 고양이인가요?\" Max가 외쳤다.","fx":[{"w":"an","r":"a","at":5,"t":"관사 a/an","m":"자음 소리 c 앞에는 a 사용"}]},{"n":6,"en":"\"Let's be nice to she!\" said Coach Biscuit. But the dogs looked nervously.","ko":"\"그녀에게 친절하게 대합시다!\" Biscuit 코치가 말했다. 그러나 개들은 긴장한 것처럼 보였다.","fx":[{"w":"she","r":"her","at":4,"t":"인칭대명사의 목적격","m":"전치사 to 뒤에는 목적격 her 사용"},{"w":"nervously","r":"nervous","at":12,"t":"형용사와 부사","m":"look 뒤 보어 자리에는 형용사 nervous 사용"}]},{"n":7,"en":"\"We never had a cat on our team!\" them said.","ko":"\"우리 팀에 고양이가 있던 적이 없잖아요!\" 그들은 말했다.","fx":[{"w":"them","r":"they","at":8,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 they 사용"}]},{"n":8,"en":"\"Maybe Cathy never have a dog on her team. Now, let's play a game,\" Coach Biscuit said.","ko":"\"아마 Cathy는 자신의 팀에 개가 있던 적이 없을 거야. 이제, 경기를 합시다.\" Biscuit 코치가 말했다.","fx":[{"w":"have","r":"had","at":3,"t":"시제와 수일치","m":"주어 Cathy(3인칭 단수)에는 has/had 사용"}]},{"n":9,"en":"\"But can she plays fetch? She's not a dog.","ko":"\"그렇지만 그녀가 페치(공 물어 오기 놀이)를 할 수 있을까요? 그녀는 개가 아니잖아요.","fx":[{"w":"plays","r":"play","at":3,"t":"조동사","m":"조동사 can 뒤에는 동사원형 play 사용"}]},{"n":10,"en":"Only dog can play fetch,\" Rusty said.","ko":"개들만 페치를 할 수 있어요.\" Rusty가 말했다.","fx":[{"w":"dog","r":"dogs","at":1,"t":"명사의 복수형","m":"일반적인 종류를 말할 때 복수 dogs 사용"}]},{"n":11,"en":"\"Be nice! We can teach her,\" another dogs said softly.","ko":"\"친절해야지! 우리가 그녀에게 가르쳐 줄 수 있잖아.\" 또 다른 개가 부드럽게 말했다.","fx":[{"w":"dogs","r":"dog","at":7,"t":"수량 형용사","m":"another 뒤에는 단수명사 dog 사용"}]},{"n":12,"en":"Coach Biscuit said, \"Cathy, this are your first day. So you can watch and join the game anytime.\"","ko":"Biscuit 코치가 말했다. \"Cathy, 오늘은 너의 첫날이구나. 그러니 너는 지켜보고 있다가 언제든지 경기에 참여할 수 있단다.\"","fx":[{"w":"are","r":"is","at":5,"t":"be동사의 긍정문","m":"주어 this에는 is 사용"}]},{"n":13,"en":"The game beginned. Cathy watched silently.","ko":"경기가 시작되었다. Cathy는 조용히 지켜보았다.","fx":[{"w":"beginned","r":"began","at":2,"t":"불규칙 과거형","m":"begin의 과거형은 began"}]},{"n":14,"en":"\"Can somebody get the ball? It's go over the fence!\"","ko":"\"누가 공 좀 잡아줄래? 공이 담장을 넘어가고 있어!\"","fx":[{"w":"go","r":"going","at":6,"t":"현재진행형","m":"현재진행형은 be + 동사ing, going 사용"}]},{"n":16,"en":"\"I'll get it!\" Everyone looked at the ball and runned toward it.","ko":"\"내가 잡을게!\" 모두가 공을 보면서 공을 향해 달렸다.","fx":[{"w":"runned","r":"ran","at":9,"t":"불규칙 과거형","m":"run의 과거형은 ran (runned 아님)"}]},{"n":17,"en":"They bumped into each other and falled down.","ko":"그들은 서로 부딪쳐서 넘어졌다.","fx":[{"w":"falled","r":"fell","at":6,"t":"불규칙 과거형","m":"fall의 과거형은 fell (falled 아님)"}]},{"n":18,"en":"Then, Cathy jumped into the air and got the ball. She quick passed it over.","ko":"그때, Cathy가 공중으로 뛰어올라서 공을 잡았다. 그녀는 재빨리 공을 넘겨주었다.","fx":[{"w":"quick","r":"quickly","at":11,"t":"형용사와 부사","m":"동사 passed를 꾸미는 부사 quickly 사용"}]},{"n":19,"en":"\"Wow, Cathy! What did you do that?\"","ko":"\"와, Cathy! 그것을 어떻게 했니?\"","fx":[{"w":"What","r":"How","at":2,"t":"의문사","m":"방법을 묻는 의문사 How 사용"}]},{"n":20,"en":"The dogs was surprised.","ko":"개들은 놀랐다.","fx":[{"w":"was","r":"were","at":2,"t":"be동사의 과거형","m":"주어 The dogs는 복수: were (was 아님)"}]}]},{"no":"27","t":"Tommy, My Hero","q":[{"n":1,"en":"Reporter: Hello, everyone! Today, we have a amazing story about a cat and his owner.","ko":"기자: 안녕하세요, 여러분! 오늘, 고양이와 그의 주인에 관한 놀라운 이야기가 있습니다.","fx":[{"w":"a","r":"an","at":6,"t":"관사 a/an","m":"amazing은 모음 소리이므로 an 사용"}]},{"n":2,"en":"Hi, Gary. Can you tell we about it?","ko":"안녕하세요, Gary. 우리에게 그것에 대해 말해 줄 수 있나요?","fx":[{"w":"we","r":"us","at":5,"t":"인칭대명사의 목적격","m":"tell 뒤 목적어 자리에는 us 사용"}]},{"n":3,"en":"Gary: Sure. I were sick for a long time, so I stayed home.","ko":"Gary: 물론이죠. 저는 오랫동안 아파서 집에 있었습니다.","fx":[{"w":"were","r":"was","at":3,"t":"be동사의 과거형","m":"주어 I는 was (were 아님)"}]},{"n":4,"en":"My cat, Tommy, stayed by my side. He was my only friends.","ko":"제 고양이 Tommy가 제 옆에 {"w":"knows","r":"know","at":2,"t":"일반동사의 의문문","m":"Do 뒤에는 동사원형 know 사용"},{"w":"us","r":"our","at":13,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 our 사용"}]},{"n":5,"en":"It follow four steps. First, we explore our community.","ko":"그것은 네 단계를 따릅니다. 첫째, 우리는 우리 지역사회를 답사해요.","fx":[{"w":"follow","r":"follows","at":1,"t":"3인칭 단수 현재형","m":"주어 It은 3인칭 단수: follows (follow 아님)"}]},{"n":6,"en":"Second, we find it problems. Third, we mark them on the map.","ko":"둘째, 우리는 지역사회의 문제를 찾아내죠. 셋째, 우리는 그 문제를 지도에 표시해요.","fx":[{"w":"it","r":"its","at":3,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 its 사용"}]},{"n":7,"en":"Final, we share solutions.","ko":"마지막으로, 우리는 해결책을 공유해요.","fx":[{"w":"Final","r":"Finally","at":0,"t":"형용사와 부사","m":"'마지막으로'는 부사 Finally 사용"}]},{"n":8,"en":"Siu: Exploring our school were our club's first project. We walked around the school for a weeks.","ko":"시우: 우리의 학교를 답사하는 것이 우리 동아리의 첫 번째 프로젝트였어요. 우리는 일주일 동안 학교를 걸어 다녀 보았죠.","fx":[{"w":"were","r":"was","at":4,"t":"be동사의 과거형","m":"동명사구 주어는 단수 취급하여 was 사용"},{"w":"weeks","r":"week","at":16,"t":"명사의 복수형","m":"a 뒤에는 단수명사 week 사용"}]},{"n":9,"en":"Jihyeon: Then, we found one big problem. There were a lot of trash in the hallways, on the stairs, and on the playground.","ko":"지현: 그러고 나서, 우리는 하나의 큰 문제를 발견했어요. 복도와 계단, 그리고 운동장에 많은 쓰레기가 있었어요.","fx":[{"w":"were","r":"was","at":8,"t":"There is/are 구문","m":"trash는 셀 수 없어 단수: was (were 아님)"}]},{"n":10,"en":"Ujin: Us put red stickers on the places of the map. In this way, we marked the problems in our school.","ko":"우진: 우리는 지도의 그 장소들에 빨간 스티커를 붙였어요. 이러한 방식으로, 우리는 우리 학교의 문제를 표시했죠.","fx":[{"w":"Us","r":"We","at":1,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 We 사용"}]},{"n":12,"en":"There is \"No Trash\" signs in the places with red stickers now.","ko":"이제 빨간 스티커가 붙여져 있던 장소에는 '쓰레기 투기 금지'라는 표지판이 있죠.","fx":[{"w":"is","r":"are","at":1,"t":"There is/are 구문","m":"복수명사 signs에는 There are 사용"}]},{"n":13,"en":"Jenny: We shared ours stories and photos on social media. Please check our posts.","ko":"제니: 우리는 우리의 이야기와 사진을 소셜 미디어에 공유했어요. 우리의 게시 글을 확인해 보세요.","fx":[{"w":"ours","r":"our","at":3,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 our 사용 (ours 아님)"}]},{"n":14,"en":"We also have another interesting projects. Join we.","ko":"우리는 또한 다른 흥미로운 프로젝트들을 가지고 있어요. 우리와 함께해 주세요.","fx":[{"w":"another","r":"other","at":3,"t":"수량 형용사 another/other","m":"another 뒤에는 단수명사만, 복수 projects엔 other 사용"},{"w":"we","r":"us","at":7,"t":"인칭대명사의 목적격","m":"동사 Join 뒤에는 목적격 us 사용"}]},{"n":16,"en":"Minu: Thank you. Community Mapping is amazingly!","ko":"민우: 감사합니다. 공동체 참여 지도 제작 활동은 굉장하네요!","fx":[{"w":"amazingly","r":"amazing","at":6,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 amazing 사용"}]},{"n":17,"en":"It is an great step for our community.","ko":"그것은 우리 지역사회를 위한 중요한 단계예요.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"great는 자음 소리로 시작하므로 a great step"}]}]},{"no":"33","t":"My Family Tradition","q":[{"n":1,"en":"My name is Yubin. My father and mother is computer engineers.","ko":"내 이름은 유빈이야. 나의 아빠와 엄마는 컴퓨터 엔지니어야.","fx":[{"w":"is","r":"are","at":8,"t":"주어와 동사의 수일치","m":"주어 My father and mother는 복수: are (is 아님)"}]},{"n":2,"en":"My mother fell in love with he when she worked in India. Yes, my father is Indian.","ko":"나의 엄마는 인도에서 일할 때 아빠와 사랑에 빠졌어. 맞아, 나의 아빠는 인도 사람이야.","fx":[{"w":"he","r":"him","at":6,"t":"인칭대명사의 목적격","m":"전치사 with 뒤에는 목적격 him 사용"}]},{"n":3,"en":"We're a family of three. We have much family traditions.","ko":"우리는 세 식구야. 우리에게는 두 가지 가족 전통이 있어.","fx":[{"w":"much","r":"two","at":7,"t":"수량 형용사 many/much","m":"traditions는 복수이므로 two(또는 many) 사용, much 아님"}]},{"n":4,"en":"Every spring, we visits the city's baseball park in the KBO's opening day. It's a exciting day.","ko":"매년 봄, 우리는 KBO 개막식 날에 시 야구장을 방문해. 신나는 날이지.","fx":[{"w":"visits","r":"visit","at":3,"t":"주어와 동사의 수일치","m":"주어 we에는 동사원형 visit 사용"},{"w":"in","r":"on","at":8,"t":"기본전치사","m":"특정한 날 앞에는 전치사 on 사용"},{"w":"a","r":"an","at":14,"t":"관사 a/an","m":"자음 소리 앞이 아니라 모음 소리 exciting 앞이므로 an 사용"}]},{"n":5,"en":"We wear our team's uniform and cheer for them loud. We like to take pictures at the gates.","ko":"우리는 우리 팀의 유니폼을 입고 큰 소리로 그들을 응원해. 우리는 입구에서 사진 찍는 것을 좋아해.","fx":[{"w":"loud","r":"loudly","at":9,"t":"형용사와 부사","m":"동사 cheer를 꾸미는 말은 부사 loudly 사용"}]},{"n":6,"en":"When we visited the park for the first time, I were four years old.","ko":"우리가 그 야구장을 처음으로 방문했을 때 나는 네 살이었어.","fx":[{"w":"were","r":"was","at":10,"t":"be동사의 과거형","m":"주어 I의 과거형: was (were 아님)"}]},{"n":7,"en":"My father's birthday is on the fall. We do special things on his birthday.","ko":"내 아빠의 생일은 가을에 있어. 우리는 그의 생일에 특별한 것들을 해.","fx":[{"w":"on","r":"in","at":4,"t":"기본전치사","m":"계절 앞에는 전치사 in 사용 (in the fall)"}]},{"n":8,"en":"In the evening, we cook India chicken curry together. It's his favorite dish.","ko":"저녁에 우리는 함께 인도식 치킨카레를 요리해. 그것은 그가 가장 좋아하는 요리야.","fx":[{"w":"India","r":"Indian","at":5,"t":"형용사와 명사의 품사","m":"curry를 꾸미는 형용사 Indian 사용 (India는 명사)"}]},{"n":9,"en":"We get specially curry powder from my grandmother in India. It has the real taste of India.","ko":"우리는 인도에 계신 할머니에게서 특별한 카레 파우더를 받아. 그것은 진짜 인도의 맛을 가지고 있어.","fx":[{"w":"specially","r":"special","at":2,"t":"형용사와 부사","m":"명사 curry powder 앞은 형용사 special 사용"}]},{"n":10,"en":"We all love an warm and tasty bowl of curry.","ko":"우리는 모두 따뜻하고 맛있는 카레 한 그릇을 사랑해.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"warm은 자음 소리로 시작하므로 a 사용"}]},{"n":11,"en":"After dinner, we play pachisi. It's a traditional board game at India.","ko":"저녁 식사 후에 우리는 파치시를 해. 그것은 인도의 전통 보드게임이야.","fx":[{"w":"at","r":"in","at":10,"t":"기본전치사","m":"나라 이름 앞 위치는 전치사 in 사용"}]},{"n":12,"en":"My father played it when he was young. Last year, I lose the game and did the dishes.","ko":"나의 아빠는 어렸을 때 그것을 했었어. 작년에 나는 게임에서 져서 설거지했어.","fx":[{"w":"lose","r":"lost","at":11,"t":"과거시제","m":"Last year가 있으므로 과거형 lost 사용"}]},{"n":13,"en":"I really wants to win this year!","ko":"나는 올해 정말로 이기고 싶어!","fx":[{"w":"wants","r":"want","at":2,"t":"일반동사의 현재형","m":"주어 I는 1인칭: want (wants 아님)"}]},{"n":14,"en":"Family traditions create wonderful memories. I love my family traditions and hope keeping them for a long times.","ko":"가족 전통은 훌륭한 추억을 만들어. 나는 나의 가족 전통을 사랑하고 그것들을 오랫동안 유지하면 좋겠어.","fx":[{"w":"keeping","r":"to keep","at":12,"t":"to부정사와 동명사","m":"hope 뒤에는 to부정사 to keep 사용"},{"w":"times","r":"time","at":17,"t":"명사의 단수/복수","m":"a 뒤에는 단수명사 time 사용"}]}]},{"no":"34","t":"The Colorful Villages of the World","q":[{"n":1,"en":"Yesterday, my family and I come to Ronda in Spain. Most building here are white, and they are so beautifully against the blue sky.","ko":"어제 우리 가족과 나는 스페인의 론다에 왔어. 이곳에 있는 대부분의 건물들은 흰색이고, 파란 하늘과 대비되어 너무 아름다워.","fx":[{"w":"come","r":"came","at":5,"t":"과거시제","m":"Yesterday는 과거: came (come 아님)"},{"w":"building","r":"buildings","at":11,"t":"명사의 복수형","m":"Most 뒤에는 복수명사 buildings 사용"},{"w":"beautifully","r":"beautiful","at":19,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 beautiful 사용"}]},{"n":2,"en":"And the views! Ronda is on cliffs, so the views is fantastic.","ko":"그리고 경치도! 론다는 절벽 위에 있어서 경치가 환상적이야.","fx":[{"w":"is","r":"are","at":10,"t":"수일치","m":"복수 주어 views에는 are 사용"}]},{"n":3,"en":"Now, we're eating lunch on the terrace of a restaurant. All the food here is great, but I especial like the churros.","ko":"지금 우리는 식당 테라스에서 점심을 먹고 있어. 여기 음식이 모두 훌륭하지만, 나는 특히 추로스가 좋아.","fx":[{"w":"especial","r":"especially","at":18,"t":"형용사와 부사","m":"동사 like를 꾸미는 부사 especially 사용"}]},{"n":4,"en":"After lunch, we're going to visit the Ernest Hemingway Walk. Hemingway loved Ronda and spend many summers here.","ko":"점심 식사 후에, 우리는 Ernest Hemingway 산책로를 방문할 거야. Hemingway는 론다를 매우 좋아했고 이곳에서 많은 여름을 보냈어.","fx":[{"w":"spend","r":"spent","at":14,"t":"과거시제","m":"loved와 병렬인 과거형: spent (spend 아님)"}]},{"n":6,"en":"I also enjoyed walking through the narrowly streets. They were full of interested shops, and I bought some souvenirs.","ko":"나는 또한 좁은 길 사이를 걷는 것도 즐겼어. 그곳은 흥미로운 가게들로 가득 차 있었고, 나는 기념품도 몇 개 샀어.","fx":[{"w":"narrowly","r":"narrow","at":6,"t":"형용사와 부사","m":"명사 streets 앞에는 형용사 narrow 사용"},{"w":"interested","r":"interesting","at":12,"t":"감정 분사","m":"사물 shops를 꾸밀 때는 interesting 사용"}]},{"n":7,"en":"Now, I'm drinking mint tea at a tea house, just like the locals. Chefchaouen is famous of its sunrises.","ko":"지금, 나는 현지인들처럼 찻집에서 민트 차를 마시고 있어. 쉐프샤우엔은 일출로 유명해.","fx":[{"w":"of","r":"for","at":16,"t":"관용 전치사구","m":"be famous for: ~로 유명하다"}]},{"n":8,"en":"Tomorrow, I'm going to get up early and enjoy an beautiful sunrise.","ko":"내일, 나는 일찍 일어나서 아름다운 일출을 즐기려고 해.","fx":[{"w":"an","r":"a","at":9,"t":"관사 a/an","m":"자음 소리 beautiful 앞에는 a 사용"}]},{"n":10,"en":"Purple is my favorite colors, so the island is just perfect for I. I didn't even pay the entrance fee to the island.","ko":"보라색은 제가 가장 좋아하는 색이라서, 이 섬은 저에게 딱 완벽한 곳이에요. 저는 심지어 섬의 입장료도 내지 않았어요.","fx":[{"w":"colors","r":"color","at":4,"t":"명사의 단수형","m":"my favorite color: 가장 좋아하는 색 하나이므로 단수 color 사용"},{"w":"I","r":"me","at":12,"t":"인칭대명사의 목적격","m":"전치사 for 뒤에는 목적격 me 사용"}]},{"n":11,"en":"Why? I were wearing a purple T-shirt.","ko":"왜냐고요? 제가 보라색 티셔츠를 입고 있었거든요.","fx":[{"w":"were","r":"was","at":2,"t":"be동사의 수일치","m":"주어 I의 과거진행형: was wearing (were 아님)"}]},{"n":12,"en":"Now, I'm on me way to a bike rental shop. The island is not big, so I'm going to exploring it by bicycle.","ko":"지금 저는 자전거 대여소로 가는 중이에요. 이 섬은 크지 않아서, 저는 자전거로 섬을 답사할 거예요.","fx":[{"w":"me","r":"my","at":3,"t":"인칭대명사의 소유격","m":"way 앞에는 소유격 my 사용"},{"w":"exploring","r":"explore","at":19,"t":"to부정사","m":"be going to 뒤 동사원형: explore (exploring 아님)"}]},{"n":13,"en":"I'm especially looking forward to visit the Lavender Garden.","ko":"저는 특히 라벤더 정원에 방문하는 것을 기대하고 있어요.","fx":[{"w":"visit","r":"visiting","at":5,"t":"동명사","m":"look forward to 뒤에는 동명사 visiting 사용"}]}]},{"no":"35","t":"My Neighbor, Elephants","q":[{"n":1,"en":"My name is Reena. I lives in a small village in Assam, India.","ko":"내 이름은 Reena야. 나는 인도 아삼(Assam)에 있는 작은 마을에 살아.","fx":[{"w":"lives","r":"live","at":5,"t":"일반동사의 현재형","m":"주어 I에는 lives가 아니라 live"}]},{"n":2,"en":"There is a big forest near me village. There are many animals in the forest.","ko":"우리 마을 근처에는 큰 숲이 있어. 그 숲에는 많은 동물이 있어.","fx":[{"w":"me","r":"my","at":6,"t":"인칭대명사의 소유격","m":"명사 village 앞에는 소유격 my 사용"}]},{"n":3,"en":"One morning, three elephants comes to my village. They could not found food in the forest.","ko":"어느 날 아침, 코끼리 세 마리가 우리 마을에 왔어. 그들은 숲에서 음식을 찾을 수 없었어.","fx":[{"w":"comes","r":"came","at":4,"t":"주어와 동사의 수일치","m":"주어 elephants는 복수: comes가 아니라 come(과거 came)"},{"w":"found","r":"find","at":11,"t":"조동사","m":"조동사 could not 뒤에는 동사원형 find 사용"}]},{"n":4,"en":"So they ate the fruit and vegetables on our farms. Every day, more elephants came and eated our food.","ko":"그래서 그들은 우리의 농장에 있는 과일과 채소를 먹었어. 매일, 더 많은 코끼리들이 와서 우리의 음식을 먹었어.","fx":[{"w":"eated","r":"ate","at":16,"t":"불규칙 과거형","m":"eat의 과거형은 eated가 아니라 ate"}]},{"n":6,"en":"We tried many thing. We made loud noises.","ko":"우리는 많은 것을 시도해 봤어. 우리는 큰 소리를 냈어.","fx":[{"w":"thing","r":"things","at":3,"t":"수량 형용사 many/much","m":"many 뒤에는 복수명사 things 사용"}]},{"n":7,"en":"But the elephants was not scared. We used fire.","ko":"그러나 코끼리들은 무서워하지 않았어. 우리는 불을 사용했어.","fx":[{"w":"was","r":"were","at":3,"t":"be동사의 과거형","m":"복수 주어 the elephants에는 were 사용"}]},{"n":8,"en":"But it was dangerous for we. The elephants always came back.","ko":"그러나 그것은 우리에게 위험했어. 코끼리들은 항상 돌아왔어.","fx":[{"w":"we","r":"us","at":5,"t":"인칭대명사의 목적격","m":"전치사 for 뒤에는 목적격 us 사용"}]},{"n":9,"en":"One day, I said, \"Doesn't hurt the elephants! They're just hungrily.\"","ko":"어느 날, 나는 \"코끼리들을 다치게 하지 마세요! 그들은 그저 배가 고픈 거예요.\"라고 말했어.","fx":[{"w":"Doesn't","r":"Don't","at":4,"t":"부정 명령문","m":"'~하지 마라'는 Don't + 동사원형 사용"},{"w":"hungrily","r":"hungry","at":10,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 hungry 사용"}]},{"n":10,"en":"My father said, \"You're right. We can plant some food for they.\"","ko":"나의 아버지는 \"네 말이 맞아. 우리는 그들을 위한 음식을 좀 심을 수 있어.\"라고 말씀하셨어.","fx":[{"w":"they","r":"them","at":11,"t":"인칭대명사의 목적격","m":"전치사 for 뒤에는 목적격 them 사용"}]},{"n":11,"en":"The people in my village planted rice and bananas near the forest. They growed quickly.","ko":"우리 마을의 사람들은 숲 근처에 벼와 바나나를 심었어. 그것들은 빨리 자랐어.","fx":[{"w":"growed","r":"grew","at":13,"t":"불규칙 과거형","m":"grow의 과거형은 growed가 아니라 grew"}]},{"n":12,"en":"The elephants loved us presents.","ko":"코끼리들은 우리의 선물을 아주 좋아했어.","fx":[{"w":"us","r":"our","at":3,"t":"인칭대명사의 소유격","m":"명사 presents 앞에는 소유격 our 사용"}]},{"n":13,"en":"Now, the elephants don't come to our village anymore. They are happily.","ko":"이제, 코끼리들은 더 이상 우리 마을에 오지 않아. 그들은 행복해.","fx":[{"w":"happily","r":"happy","at":11,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 happy 사용"}]},{"n":14,"en":"We are happy, too. Elephants and people can be good neighbor.","ko":"우리도 행복해. 코끼리와 사람은 좋은 이웃이 될 수 있어.","fx":[{"w":"neighbor","r":"neighbors","at":10,"t":"명사의 복수형","m":"주어가 복수이므로 보어도 neighbors 사용"}]}]},{"no":"36","t":"Plan B Was Great, Too!","q":[{"n":1,"en":"This Saturday is me grandma's birthday. Dad and I will visit she in Gunsan.","ko":"이번 토요일은 나의 할머니의 생신이다. 아빠와 나는 군산에 계신 할머니를 방문할 것이다.","fx":[{"w":"me","r":"my","at":3,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"},{"w":"she","r":"her","at":11,"t":"인칭대명사의 목적격","m":"동사 visit의 목적어는 목적격 her 사용"}]},{"n":2,"en":"Dad usually make plans for our family trips, but I will make a plans this time!","ko":"아빠가 보통 우리 가족여행의 계획을 세우시지만, 이번에는 내가 계획을 세울 것이다!","fx":[{"w":"make","r":"makes","at":2,"t":"3인칭 단수 현재형","m":"주어 Dad는 3인칭 단수이므로 makes 사용"},{"w":"plans","r":"plan","at":13,"t":"명사의 단수형","m":"a 뒤에는 단수명사 plan 사용"}]},{"n":3,"en":"First, I need bus tickets! I will buy ticket for the first bus from Suwon to Gunsan.","ko":"첫 번째, 나는 버스표가 필요하다! 나는 수원에서 군산으로 가는 첫 버스표를 살 것이다.","fx":[{"w":"ticket","r":"tickets","at":8,"t":"명사의 복수형","m":"관사 없는 셀 수 있는 명사는 복수 tickets 사용"}]},{"n":4,"en":"The streets will not be busily early in the morning.","ko":"이른 아침에는 길이 막히지 않을 것이다.","fx":[{"w":"busily","r":"busy","at":5,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 busy 사용"}]},{"n":5,"en":"Second, me will get a birthday cake! I will buy a strawberry cake at an famous bakery on Gunsan.","ko":"두 번째, 나는 생일 케이크를 살 것이다! 나는 군산에서 유명한 빵집에서 딸기 케이크를 살 것이다.","fx":[{"w":"me","r":"I","at":1,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 I 사용"},{"w":"an","r":"a","at":14,"t":"관사 a/an","m":"자음 소리 famous 앞에는 a 사용"},{"w":"on","r":"in","at":17,"t":"기본전치사","m":"도시 앞에는 전치사 in 사용"}]},{"n":7,"en":"Third, I will prepare of my grandma's birthday party! I will find an nice seafood restaurant.","ko":"세 번째, 나는 할머니의 생신 파티를 준비할 것이다! 나는 좋은 해산물 식당을 찾을 것이다.","fx":[{"w":"of","r":"for","at":4,"t":"기본전치사","m":"'~을 준비하다'는 prepare for 사용"},{"w":"an","r":"a","at":12,"t":"관사 a/an","m":"자음 소리 nice 앞에는 a 사용"}]},{"n":8,"en":"Fourth, we will take family pictures! Taking family photos in a studio will be greatly.","ko":"네 번째, 우리는 가족사진을 찍을 것이다! 사진관에서 가족사진을 찍는 것은 멋질 것이다.","fx":[{"w":"greatly","r":"great","at":14,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 great 사용"}]},{"n":10,"en":"My plan looked perfect. But Dad and I woke up late and miss the bus.","ko":"나의 계획은 완벽해 보였다. 그러나 아빠와 나는 늦게 일어나서 버스를 놓쳤다.","fx":[{"w":"miss","r":"missed","at":12,"t":"과거시제","m":"woke와 병렬이므로 과거형 missed: miss 아님"}]},{"n":11,"en":"I said, \"It's okay, Dad. We has a plan B.","ko":"나는 \"괜찮아요, 아빠. 우리는 차선책이 있어요.","fx":[{"w":"has","r":"have","at":6,"t":"3인칭 단수 현재형","m":"주어 We에는 have 사용"}]},{"n":13,"en":"You had another plans. Thanks to you, we can been there in time.\"","ko":"너는 또 다른 계획이 있었구나. 네 덕분에 그곳에 제시간에 갈 수 있겠다.\"라고 말씀하셨다.","fx":[{"w":"plans","r":"plan","at":3,"t":"수량 한정사","m":"another 뒤에는 단수명사 plan 사용"},{"w":"been","r":"be","at":9,"t":"조동사 뒤 동사원형","m":"can 뒤에는 동사원형 be 사용"}]},{"n":14,"en":"So we taked the train, and it even had an special ondol room! Dad and I really enjoyed to ride on the train.","ko":"그래서 우리는 기차를 탔는데, 그 기차는 특별한 온돌방까지 갖추고 있었다! 아빠와 나는 그 기차를 타는 것을 정말 즐겼다.","fx":[{"w":"taked","r":"took","at":2,"t":"불규칙 과거형","m":"take의 과거형은 took"},{"w":"an","r":"a","at":9,"t":"관사 a/an","m":"자음 소리 special 앞에는 a 사용"},{"w":"to ride","r":"riding","at":18,"t":"동명사","m":"enjoy는 동명사 목적어: riding (to ride 아님)"}]},{"n":15,"en":"We got there in times. Hooray!","ko":"우리는 그곳에 시간 안에 도착했다. 만세!","fx":[{"w":"times","r":"time","at":4,"t":"관용 표현","m":"'제시간에'는 in time 사용"}]},{"n":16,"en":"We had another problems. There were no strawberry cake at the bakery.","ko":"우리에게는 또 다른 문제가 있었다. 빵집에 딸기 케이크가 없었다.","fx":[{"w":"problems","r":"problem","at":3,"t":"수량 한정사","m":"another 뒤에는 단수명사 problem 사용"},{"w":"were","r":"was","at":5,"t":"be동사의 과거형","m":"단수 명사 cake에는 was: were 아님"}]},{"n":18,"en":"Her loved the food, even the carrot cake! Her birthday party were a big success.","ko":"할머니는 음식을 아주 좋아하셨고, 당근 케이크까지 좋아하셨다! 할머니의 생신 파티는 대성공이었다.","fx":[{"w":"Her","r":"She","at":0,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 She 사용"},{"w":"were","r":"was","at":11,"t":"be동사의 과거형","m":"주어 party는 단수이므로 was 사용"}]}]},{"no":"37","t":"Everything Can Be Art!","q":[{"n":1,"en":"Hello, everyone. I'm Artro, you A.I. art guide.","ko":"안녕하세요, 여러분. 저는 여러분의 인공 지능 예술 가이드 Artro입니다.","fx":[{"w":"you","r":"your","at":4,"t":"인칭대명사의 소유격","m":"명사구 앞에는 소유격 your 사용"}]},{"n":2,"en":"Look around you. Art are everywhere.","ko":"여러분 주위를 둘러보세요. 예술은 어디에나 있습니다.","fx":[{"w":"are","r":"is","at":4,"t":"be동사의 현재형","m":"주어 Art(단수)에는 is 사용"}]},{"n":3,"en":"Everything can be art. Follow I.","ko":"모든 것이 예술이 될 수 있습니다. 저를 따라오세요.","fx":[{"w":"I","r":"me","at":5,"t":"인칭대명사의 목적격","m":"동사 뒤 목적어는 목적격 me 사용"}]},{"n":4,"en":"I'll gives you some examples.","ko":"제가 여러분에게 몇 가지 예시를 드릴게요.","fx":[{"w":"gives","r":"give","at":1,"t":"조동사 뒤 동사원형","m":"will('ll) 뒤는 동사원형: give (gives 아님)"}]},{"n":6,"en":"The shadow of these cup makes an elephant. It's your turn.","ko":"이 컵의 그림자는 코끼리를 만듭니다. 여러분의 차례입니다.","fx":[{"w":"these","r":"this","at":3,"t":"지시형용사","m":"단수명사 cup 앞에는 this 사용"}]},{"n":7,"en":"Choose a shadow, and draw interested things around the shadow. Your shadow can be art.","ko":"그림자를 선택하고, 그림자 주위에 흥미로운 것들을 그려 보세요. 여러분의 그림자는 예술이 될 수 있습니다.","fx":[{"w":"interested","r":"interesting","at":5,"t":"현재분사와 과거분사","m":"things를 꾸미는 말은 interesting 사용"}]},{"n":8,"en":"Box tape can be an artwork, too. Artists put a piece of tape on glass and add another pieces of tape on it.","ko":"박스 테이프도 예술 작품이 될 수 있습니다. 예술가들은 유리 위에 한 조각의 테이프를 붙이고 그 위에 또 다른 조각의 테이프를 붙입니다.","fx":[{"w":"pieces","r":"piece","at":18,"t":"another + 단수명사","m":"another 뒤에는 단수명사 piece 사용"}]},{"n":9,"en":"This way, they can makes dark or bright colors. Look at the man's face.","ko":"이런 식으로, 그들은 어두운색이나 밝은색을 만들 수 있습니다. 남자의 얼굴을 보세요.","fx":[{"w":"makes","r":"make","at":4,"t":"조동사","m":"can 뒤에는 동사원형 make 사용"}]},{"n":10,"en":"Aren't it interesting? Give it an try.","ko":"흥미롭지 않나요? 한번 시도해 보세요.","fx":[{"w":"Aren't","r":"Isn't","at":0,"t":"be동사의 부정의문문","m":"주어 it에는 Isn't 사용"},{"w":"an","r":"a","at":5,"t":"관사 a/an","m":"자음 소리 try 앞에는 a 사용"}]},{"n":11,"en":"Lastly, your heartbeat can be art, too! At Pulse Park, your heartbeat makes a greatly art show.","ko":"마지막으로, 여러분의 심장 박동도 예술이 될 수 있습니다! Pulse Park에서, 여러분의 심장 박동은 멋진 예술 쇼를 만듭니다.","fx":[{"w":"greatly","r":"great","at":14,"t":"형용사와 부사","m":"명사 art show를 꾸미는 형용사 great 사용"}]},{"n":12,"en":"Hold the special sensors in the park. Then, your heartbeat change into lights.","ko":"공원에 있는 특수 센서를 잡으세요. 그러면, 여러분의 심장 박동은 빛으로 바뀝니다.","fx":[{"w":"change","r":"changes","at":10,"t":"3인칭 단수 현재형","m":"주어 heartbeat(단수)에는 changes 사용"}]},{"n":13,"en":"Like this, you can saw everyone's heartbeats on different lights. Look, the lights are dancing!","ko":"이처럼, 여러분은 모든 사람의 심장 박동을 다른 빛으로 볼 수 있습니다. 보세요, 불빛들이 춤을 추고 있습니다!","fx":[{"w":"saw","r":"see","at":4,"t":"조동사","m":"can 뒤에는 동사원형 see 사용"}]},{"n":14,"en":"Did you enjoy your visit? There is not end to art.","ko":"방문이 즐거우셨나요? 예술에는 끝이 없습니다.","fx":[{"w":"not","r":"no","at":7,"t":"부정어 no/not","m":"명사 end 앞에는 no 사용"}]},{"n":15,"en":"Just try new thing. Next time, I will show you an different art style.","ko":"그저 새로운 것을 시도해 보세요. 다음번에는 제가 여러분에게 다른 예술 스타일을 보여드릴게요.","fx":[{"w":"thing","r":"things","at":3,"t":"명사의 복수형","m":"new 뒤에는 복수명사 things 사용"},{"w":"an","r":"a","at":10,"t":"관사 a/an","m":"자음 소리 different 앞에는 a 사용"}]},{"n":16,"en":"See you next times.","ko":"다음에 또 만나요.","fx":[{"w":"times","r":"time","at":3,"t":"명사의 단수형","m":"'다음에'는 단수 next time 사용"}]}]},{"no":"38","t":"Half and Half","q":[{"n":1,"en":"Tetan Buri and Boka Buri lived next of each other. They was very poor.","ko":"Tetan Buri와 Boka Buri는 서로 이웃에 살았습니다. 그들은 매우 가난했습니다.","fx":[{"w":"of","r":"to","at":7,"t":"기본전치사","m":"'~ 옆에'는 next to 사용"},{"w":"was","r":"were","at":11,"t":"be동사의 수일치","m":"주어 They(복수)는 were (was 아님)"}]},{"n":3,"en":"\"Hmm, that's an good idea,\" said Boka.","ko":"\"흠, 좋은 생각이네요.\"라고 Boka가 말했습니다.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"자음 소리 good 앞에는 a 사용"}]},{"n":4,"en":"They had one blanket, one cows, and one mango tree. Tetan set the sharing rules.","ko":"그들에게는 담요 한 장, 소 한 마리, 망고나무 한 그루가 있었습니다. Tetan이 공유 규칙을 정했습니다.","fx":[{"w":"cows","r":"cow","at":5,"t":"명사의 복수형","m":"one 뒤에는 단수명사 cow 사용"}]},{"n":5,"en":"She said to Boka, \"You can have the blanket during the day, and me will have it in night.","ko":"그녀는 Boka에게 \"담요는 낮 동안에는 당신이 가져도 되고, 밤에는 내가 가질게요.","fx":[{"w":"me","r":"I","at":13,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 I 사용"},{"w":"in","r":"at","at":17,"t":"기본전치사","m":"'밤에'는 at night 사용"}]},{"n":8,"en":"Boka agreed to all the rule. However, before long, she became very unhappy.","ko":"Boka는 모든 규칙에 동의했습니다. 그러나 얼마 지나지 않아, 그녀는 매우 불행해졌습니다.","fx":[{"w":"rule","r":"rules","at":5,"t":"명사의 복수형","m":"all the 뒤 '규칙들'은 복수 rules 사용"}]},{"n":9,"en":"She was cold during the night, but Tetan sleeped well under the warm blanket.","ko":"그녀는 밤에 추웠지만, Tetan은 따뜻한 담요 아래에서 잘 잤습니다.","fx":[{"w":"sleeped","r":"slept","at":8,"t":"불규칙 과거형","m":"sleep의 과거형은 slept (sleeped 아님)"}]},{"n":10,"en":"She feeded the cow all day, but Tetan got milk from the back half.","ko":"그녀는 하루 종일 소에게 먹이를 주었지만, Tetan은 소의 뒤쪽 반에서 우유를 얻었습니다.","fx":[{"w":"feeded","r":"fed","at":1,"t":"불규칙 과거형","m":"feed의 과거형은 fed (feeded 아님)"}]},{"n":11,"en":"She watered the tree every days, but Tetan ate all the mangoes from the top half.","ko":"그녀는 매일 나무에 물을 주었지만, Tetan은 위쪽 반의 망고를 모두 먹었습니다.","fx":[{"w":"days","r":"day","at":5,"t":"명사의 단수형","m":"every 뒤에는 단수명사 day 사용"}]},{"n":12,"en":"Boka got tired and hungry, so she goed to the village chief for help. He said, \"Soak the blanket and give it to Tetan.","ko":"Boka는 피곤하고 배가 고파져서 도움을 청하러 마을 촌장에게 갔습니다. 그는 \"담요를 적셔서 Tetan에게 주게.","fx":[{"w":"goed","r":"went","at":7,"t":"불규칙 과거형","m":"go의 과거형은 went (goed 아님)"}]},{"n":13,"en":"Don't feed the cow. Then, cut the tree on half.\"","ko":"소에게는 먹이를 주지 말게. 그러고 나무를 반으로 자르게.\"라고 말했습니다.","fx":[{"w":"on","r":"in","at":8,"t":"기본전치사","m":"'반으로'는 in half 사용"}]},{"n":14,"en":"Boka listened to he. Tetan couldn't sleep well during the night.","ko":"Boka는 그의 말을 들었습니다. Tetan은 밤에 잠을 잘 수 없었습니다.","fx":[{"w":"he","r":"him","at":3,"t":"인칭대명사의 목적격","m":"전치사 to 뒤에는 목적격 him 사용"}]},{"n":15,"en":"She also couldn't went near the angry cow. She couldn't eat mangoes anymore.","ko":"그녀는 성난 소 근처에도 갈 수 없었습니다. 망고도 더 이상 먹을 수 없었습니다.","fx":[{"w":"went","r":"go","at":3,"t":"조동사 뒤 동사원형","m":"couldn't 뒤에는 동사원형 go (went 아님)"}]},{"n":16,"en":"Tetan regretted everything and said to Boka, \"I am sorrow. I were foolish.","ko":"Tetan은 모든 것을 후회하며 Boka에게 \"미안해요. 내가 어리석었어요.","fx":[{"w":"sorrow","r":"sorry","at":9,"t":"형용사와 명사","m":"be동사 뒤 보어 자리에는 형용사 sorry 사용"},{"w":"were","r":"was","at":11,"t":"be동사의 과거형","m":"주어 I에는 was 사용"}]},{"n":17,"en":"From now on, I will works hard, too. I will also share things with your fairly.\"","ko":"이제부터는 나도 열심히 일할게요. 그리고 당신과 공평하게 물건도 나눌게요.\"라고 말했습니다.","fx":[{"w":"works","r":"work","at":5,"t":"조동사 뒤 동사원형","m":"will 뒤에는 동사원형 work (works 아님)"},{"w":"your","r":"you","at":14,"t":"인칭대명사의 목적격","m":"전치사 with 뒤에는 목적격 you 사용"}]}]},{"no":"39","t":"My Korean Food Diary","q":[{"n":1,"en":"During the summer vacation, William traveled around Korea with him family. This is his food diary.","ko":"여름 방학 동안, William은 가족과 함께 한국 여기저기를 여행했다. 이것은 그의 음식 일기이다.","fx":[{"w":"him","r":"his","at":9,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 his 사용"}]},{"n":2,"en":"We went to Damyang and visited Jungnogwon, an famous bamboo garden. We enjoyed walking in the garden.","ko":"우리는 담양에 갔고 유명한 대나무 정원인 죽녹원을 방문했다. 우리는 정원에서 걷는 것을 즐겼다.","fx":[{"w":"an","r":"a","at":7,"t":"관사 a/an","m":"famous는 자음 소리라 a famous 사용"}]},{"n":3,"en":"After we looked around, we eated two local dishes, daetongbap and tteokgalbi. Daetongbap is rice in a bamboo bowl.","ko":"주변을 둘러본 후에, 우리는 두 가지 지역 음식인 대통밥과 떡갈비를 먹었다. 대통밥은 대나무 그릇에 담긴 밥이다.","fx":[{"w":"eated","r":"ate","at":5,"t":"불규칙 과거형","m":"eat의 과거형은 eated가 아니라 ate"}]},{"n":4,"en":"I loved it unique bamboo smell. Tteokgalbi, a Korean beef dish, was softly and sweet.","ko":"나는 그것의 독특한 대나무 향이 매우 좋았다. 한국의 소고기 요리인 떡갈비는 부드럽고 달콤했다.","fx":[{"w":"it","r":"its","at":2,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 its 사용"},{"w":"softly","r":"soft","at":12,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 soft 사용"}]},{"n":6,"en":"We visited Tongyeong and went up the mountain with cable car. Seeing the blue ocean and the green islands were fantastic!","ko":"우리는 통영을 방문했고 케이블카를 타고 산에 올라갔다. 파란 바다와 녹색의 섬들을 보는 것은 환상적이었다!","fx":[{"w":"with","r":"by","at":8,"t":"기본전치사","m":"교통수단은 전치사 by 사용"},{"w":"were","r":"was","at":19,"t":"be동사","m":"동명사 주어 Seeing은 단수라 was 사용"}]},{"n":7,"en":"Near the sea, we found a local restaurant and ate chungmugimbap. It wasn't like other type of gimbap.","ko":"바다 근처에서 우리는 현지 식당을 찾았고 충무김밥을 먹었다. 그것은 다른 종류의 김밥과는 달랐다.","fx":[{"w":"type","r":"types","at":15,"t":"명사의 복수형","m":"other 뒤에는 복수명사 types 사용"}]},{"n":8,"en":"There were only rice inside the seaweed. Kimchi and spicy squid were on the side.","ko":"김 안에는 오직 밥만 있었다. 김치와 매운 오징어가 옆에 있었다.","fx":[{"w":"were","r":"was","at":1,"t":"be동사","m":"only rice(단수) 앞에는 There was 사용"}]},{"n":9,"en":"It was spicy but really delicious. I heard about the history of these food.","ko":"그것은 매웠지만 정말 맛있었다. 나는 이 음식의 역사에 관해 들었다.","fx":[{"w":"these","r":"this","at":12,"t":"지시형용사","m":"food는 단수라 this food 사용"}]},{"n":11,"en":"Long ago, fishermans in this town started to eat chungmugimbap because it did not goes bad quickly.","ko":"오래전에, 이 마을의 어부들은 이 음식이 빨리 상하지 않았기 때문에 충무김밥을 먹기 시작했다.","fx":[{"w":"fishermans","r":"fishermen","at":2,"t":"불규칙 복수형","m":"fisherman의 복수는 fishermen"},{"w":"goes","r":"go","at":14,"t":"do 부정문","m":"did not 뒤에는 동사원형 go 사용"}]},{"n":12,"en":"Jeju-do is a beautifully island in Korea. We went there on a very hot day, and we becomed tired.","ko":"제주도는 한국의 아름다운 섬이다. 우리는 매우 더운 날에 거기에 갔고 피곤해졌다.","fx":[{"w":"beautifully","r":"beautiful","at":3,"t":"형용사와 부사","m":"명사 island 앞에는 형용사 beautiful 사용"},{"w":"becomed","r":"became","at":17,"t":"불규칙 과거형","m":"become의 과거형은 becomed가 아니라 became"}]},{"n":13,"en":"However, we got our energy back thanks to dombegogi. It surprised I in two ways.","ko":"그러나 돔베고기 덕분에 우리는 기운을 되찾았다. 그것은 두 가지 면으로 나를 놀라게 했다.","fx":[{"w":"I","r":"me","at":11,"t":"인칭대명사의 목적격","m":"동사 뒤 목적어는 목적격 me 사용"}]},{"n":14,"en":"First, it was pork on a cutting board, not at a plate. Second, the meat was so soft!","ko":"첫째로, 그것은 접시 위가 아닌 도마 위의 돼지고기였다. 둘째로, 고기가 아주 부드러웠다!","fx":[{"w":"at","r":"on","at":9,"t":"기본전치사","m":"'접시 위에'는 전치사 on 사용"}]},{"n":15,"en":"I had it with a special fish sauce, and the sauce were great, too. Later, I learned about the meaning of dombe.","ko":"나는 그것을 특별한 생선 소스와 함께 먹었는데, 그 소스도 훌륭했다. 나중에 나는 돔베의 의미에 대해 배웠다.","fx":[{"w":"were","r":"was","at":11,"t":"be동사","m":"단수 주어 the sauce에는 was 사용"}]},{"n":16,"en":"It mean a cutting board in Jeju's language.","ko":"그것은 제주 말로 도마를 의미한다.","fx":[{"w":"mean","r":"means","at":1,"t":"3인칭 단수 현재형","m":"주어 It에는 means 사용"}]}]},{"no":"40","t":"One Grain of Rice","q":[{"n":1,"en":"Long ago, there lived a greedily king. His people were hungry, but he didn't shared his rice with them.","ko":"옛날에 탐욕스러운 왕이 살았습니다. 그의 백성들은 굶주렸지만, 그는 그의 쌀을 그들과 나누지 않았습니다.","fx":[{"w":"greedily","r":"greedy","at":5,"t":"형용사와 부사","m":"명사 king을 꾸미는 말은 형용사 greedy 사용"},{"w":"shared","r":"share","at":14,"t":"일반동사의 부정문","m":"didn't 뒤에는 동사원형: share (shared 아님)"}]},{"n":2,"en":"One day, an elephant was carrying bags of rice to the king. Rice were falling from one of the bags.","ko":"어느 날, 코끼리 한 마리가 쌀자루들을 왕에게 운반하고 있었습니다. 쌀이 자루 중 하나에서 떨어지고 있었습니다.","fx":[{"w":"were","r":"was","at":13,"t":"be동사의 과거형","m":"Rice는 셀 수 없는 명사로 단수 취급: was (were 아님)"}]},{"n":4,"en":"Rani: I have a good ideas! (sits down and collects the rice)","ko":"Rani: 내게 좋은 생각이 있어! (앉아서 쌀을 모은다)","fx":[{"w":"ideas","r":"idea","at":5,"t":"부정관사와 단수명사","m":"a 뒤에는 단수명사 idea 사용"}]},{"n":5,"en":"Servant: What is you doing?","ko":"신하: 너는 무엇을 하고 있느냐?","fx":[{"w":"is","r":"are","at":2,"t":"be동사의 현재진행형","m":"주어 you에는 are 사용"}]},{"n":6,"en":"Rani: Oh, this rice isn't me. I'll gave it back to the king.","ko":"Rani: 오, 이 쌀은 제 것이 아닙니다. 저는 그것을 왕께 돌려드릴 것입니다.","fx":[{"w":"me","r":"mine","at":5,"t":"소유대명사","m":"'내 것'은 소유대명사 mine 사용"},{"w":"gave","r":"give","at":7,"t":"조동사 will 뒤 동사원형","m":"will 뒤에는 동사원형 give 사용"}]},{"n":8,"en":"King: What honest you are! I'll rewards you.","ko":"왕: 너는 매우 정직하구나! 내가 너에게 보상을 하겠다.","fx":[{"w":"What","r":"How","at":1,"t":"감탄문","m":"형용사 honest를 꾸미는 감탄문은 How 사용"},{"w":"rewards","r":"reward","at":6,"t":"조동사 will 뒤 동사원형","m":"will 뒤에는 동사원형: reward (rewards 아님)"}]},{"n":10,"en":"Rani: Your Highness, one grain of rice are enough.","ko":"Rani: 폐하, 쌀 한 톨이면 충분합니다.","fx":[{"w":"are","r":"is","at":7,"t":"be동사의 현재형","m":"주어 one grain은 단수: is (are 아님)"}]},{"n":12,"en":"Rani: Then I wants one grain today, two tomorrow, and four the next day. Double the rice each day for 30 day, please.","ko":"Rani: 그러면 저는 오늘은 한 톨, 내일은 두 톨, 그리고 그다음 날은 네 톨을 원합니다. 30일 동안 매일 쌀을 두 배로 늘려 주십시오.","fx":[{"w":"wants","r":"want","at":3,"t":"일반동사의 현재형","m":"주어 I는 3인칭 단수가 아니므로 want (wants 아님)"},{"w":"day","r":"days","at":21,"t":"명사의 복수형","m":"30처럼 둘 이상 수 뒤에는 복수명사 days 사용"}]},{"n":13,"en":"King: That's easily. (to the servant) Bring one grain of rice!","ko":"왕: 그것은 쉽군. (신하에게) 쌀 한 톨을 가져오너라!","fx":[{"w":"easily","r":"easy","at":2,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 easy 사용"}]},{"n":15,"en":"The king called the servant in day 10.","ko":"왕은 10일째에 신하를 불렀습니다.","fx":[{"w":"in","r":"on","at":5,"t":"기본전치사","m":"'~일째에'는 전치사 on day 10 사용"}]},{"n":16,"en":"King: How many rice will Rani get today?","ko":"왕: Rani는 오늘 얼마나 많은 쌀을 얻느냐?","fx":[{"w":"many","r":"much","at":2,"t":"수량 형용사 many/much","m":"셀 수 없는 rice에는 much 사용"}]},{"n":18,"en":"King: (laughs) That's just an handful. She's not wisely.","ko":"왕: (웃는다) 그것은 단지 한 줌이구나. 그녀는 현명하지 않아.","fx":[{"w":"an","r":"a","at":4,"t":"관사 a/an","m":"자음 소리 handful 앞에는 a 사용"},{"w":"wisely","r":"wise","at":8,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 wise 사용"}]}]},{"no":"41","t":"From the Self-Portrait to the Selfie","q":[{"n":1,"en":"Today, people enjoy taking selfies. We can captures special moments with them.","ko":"오늘날, 사람들은 셀피 찍는 것을 즐깁니다. 우리는 그것들로 특별한 순간을 포착할 수 있습니다.","fx":[{"w":"captures","r":"capture","at":7,"t":"조동사","m":"조동사 can 뒤에는 동사원형: capture (captures 아님)"}]},{"n":2,"en":"Long ago, people captured them own image in a different way. They painted pictures of themselves.","ko":"오래전, 사람들은 다른 방식으로 그들 자신의 모습을 포착했습니다. 그들은 그들 자신의 그림을 그렸습니다.","fx":[{"w":"them","r":"their","at":4,"t":"인칭대명사의 격","m":"명사 앞 소유격 their 사용 (them 아님)"}]},{"n":3,"en":"These pictures is self-portraits.","ko":"이 그림들이 자화상입니다.","fx":[{"w":"is","r":"are","at":2,"t":"be동사 수일치·과거","m":"주어 These pictures(복수): are (is 아님)"}]},{"n":5,"en":"Both show our image on a certain time. When we look at them, we can remember ourselves from that time.","ko":"둘 다 특정한 시간의 우리 모습을 보여 줍니다. 우리가 그것들을 볼 때, 우리는 그때의 우리 자신을 기억할 수 있습니다.","fx":[{"w":"on","r":"at","at":4,"t":"기본전치사","m":"'어느 시점에'는 전치사 at 사용"}]},{"n":6,"en":"They are like an diary.","ko":"그것들은 일기와 같습니다.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"자음 소리 diary 앞에는 a 사용"}]},{"n":7,"en":"We take selfies to remembering happy moments. Selfies capture the expressions on our faces at those times.","ko":"우리는 행복한 순간을 기억하기 위해 셀피를 찍습니다. 셀피는 그런 때의 우리 얼굴 표정을 포착합니다.","fx":[{"w":"remembering","r":"remember","at":4,"t":"to부정사","m":"목적을 나타내는 to부정사: to remember (remembering 아님)"}]},{"n":8,"en":"We often look at selfie with our family and friends to bringing back those joyful feelings.","ko":"우리는 그런 즐거운 감정을 되살리기 위해 우리의 가족과 친구들과 함께 셀피를 자주 봅니다.","fx":[{"w":"selfie","r":"selfies","at":4,"t":"명사의 복수형","m":"복수 selfies 사용"},{"w":"bringing","r":"bring","at":11,"t":"to부정사","m":"to 뒤에는 동사원형 bring 사용"}]},{"n":9,"en":"Similarly, some painter made self-portraits to capture different times in their lives.","ko":"마찬가지로, 몇몇 화가들은 그들의 삶에서 다른 시기를 포착하기 위해 자화상을 만들었습니다.","fx":[{"w":"painter","r":"painters","at":2,"t":"명사의 복수형","m":"some 뒤에는 복수명사 painters 사용"}]},{"n":10,"en":"Rembrandt looked in the mirror and painted himself many times. He painted around 90 self-portraits in him life.","ko":"렘브란트는 거울을 보고 자기 자신을 여러 번 그렸습니다. 그는 그의 일생에서 약 90점의 자화상을 그렸습니다.","fx":[{"w":"him","r":"his","at":16,"t":"인칭대명사의 격","m":"명사 앞 소유격 his 사용 (him 아님)"}]},{"n":12,"en":"Selfies and self-portraits also has differences.","ko":"셀피와 자화상에는 차이점도 있습니다.","fx":[{"w":"has","r":"have","at":4,"t":"be동사/일반동사 수일치","m":"복수 주어에는 동사 have 사용"}]},{"n":13,"en":"Taking a selfie is easily. We can do it quickly with our camera at any time.","ko":"셀피를 찍는 것은 쉽습니다. 우리는 언제든지 우리의 카메라로 그것을 빨리 할 수 있습니다.","fx":[{"w":"easily","r":"easy","at":4,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 easy 사용"}]},{"n":14,"en":"However, painting a self-portrait takes some time. Also, a self-portrait shows an painter's personal painting style.","ko":"그러나, 자화상을 그리는 것은 시간이 조금 걸립니다. 또한, 자화상은 화가 개인의 화풍을 보여 줍니다.","fx":[{"w":"an","r":"a","at":11,"t":"관사 a/an","m":"자음 소리 painter's 앞에는 a 사용"}]},{"n":15,"en":"To paint a person, a painter need a model. Vincent van Gogh didn't have enough money to a model.","ko":"인물을 그리기 위해, 화가는 모델이 필요합니다. 빈센트 반 고흐는 모델을 위한 충분한 돈이 없었습니다.","fx":[{"w":"need","r":"needs","at":6,"t":"3인칭 단수 현재형","m":"3인칭 단수 주어 a painter에는 needs 사용"},{"w":"to","r":"for","at":16,"t":"기본전치사","m":"'모델을 위한'은 전치사 for 사용"}]},{"n":16,"en":"So he painted himself! When he painted his self-portraits, he chose brightly colors and applied many paint.","ko":"그래서 그는 자기 자신을 그렸습니다! 그가 자화상을 그릴 때, 그는 밝은색을 고르고 많은 물감을 발랐습니다.","fx":[{"w":"brightly","r":"bright","at":11,"t":"형용사와 부사","m":"명사 colors 앞에는 형용사 bright 사용"},{"w":"many","r":"a lot of","at":15,"t":"수량 형용사","m":"셀 수 없는 paint 앞에는 a lot of 사용"}]},{"n":17,"en":"This became his unique style. We can see it in his others paintings too.","ko":"이것은 그의 독특한 스타일이 되었습니다. 우리는 이것을 그의 다른 그림들에서도 볼 수 있습니다.","fx":[{"w":"others","r":"other","at":11,"t":"형용사 other","m":"other는 형용사라 복수형 없이 other paintings 사용"}]},{"n":18,"en":"We can express ourself with selfies and self-portraits. Does you want to try?","ko":"우리는 셀피와 자화상으로 우리 자신을 표현할 수 있습니다. 한번 해 보실래요?","fx":[{"w":"ourself","r":"ourselves","at":3,"t":"재귀대명사","m":"we의 재귀대명사는 ourselves"},{"w":"Does","r":"Do","at":8,"t":"의문문 do/does","m":"주어 you에는 Do 사용"}]}]},{"no":"42","t":"The Cool Giraffe","q":[{"n":1,"en":"Giraffe: Being a giraffe aren't cool. I sticks out everywhere.","ko":"기린: 기린이라는 것은 멋지지 않아요. 전 어디에서나 눈에 띄어요.","fx":[{"w":"aren't","r":"isn't","at":4,"t":"be동사의 수일치","m":"동명사 주어 Being은 단수: isn't (aren't 아님)"},{"w":"sticks","r":"stick","at":7,"t":"일반동사의 수일치","m":"주어 I에는 stick 사용"}]},{"n":2,"en":"I want be cool like other animals. Monkeys are cool.","ko":"전 다른 동물들처럼 멋지고 싶어요. 원숭이는 멋져요.","fx":[{"w":"be","r":"to be","at":2,"t":"to부정사","m":"want 뒤는 to부정사: to be (be 아님)"}]},{"n":3,"en":"They can hangs from trees with their tails, but I can't. My neck is too longer.","ko":"그들은 꼬리로 나무에 매달릴 수 있죠. 하지만 전 못해요. 제 목이 너무 긴걸요.","fx":[{"w":"hangs","r":"hang","at":2,"t":"조동사 뒤 동사원형","m":"조동사 can 뒤는 동사원형: hang (hangs 아님)"},{"w":"longer","r":"long","at":15,"t":"비교급","m":"too 뒤에는 원급 long 사용"}]},{"n":5,"en":"I want to run like they, but I can't with my long neck. Flamingos can stands on one leg.","ko":"저도 그들처럼 빨리 달리고 싶지만, 제 목이 너무 길어서 그럴 수 없죠. 플라밍고는 한 다리로 서 있을 수 있어요.","fx":[{"w":"they","r":"them","at":5,"t":"인칭대명사의 목적격","m":"전치사 like 뒤에는 목적격 them 사용"},{"w":"stands","r":"stand","at":15,"t":"조동사 뒤 동사원형","m":"조동사 can 뒤는 동사원형: stand (stands 아님)"}]},{"n":6,"en":"They look coolly. I tried to stand like them, but I falled with me long neck.","ko":"그들은 정말 멋지죠. 저도 그들처럼 서 보려고 애썼지만, 제 목이 너무 길어서 넘어졌어요.","fx":[{"w":"coolly","r":"cool","at":2,"t":"형용사와 부사","m":"look 뒤 보어 자리에는 형용사 cool 사용"},{"w":"falled","r":"fell","at":11,"t":"불규칙 과거형","m":"fall의 과거형은 fell"},{"w":"me","r":"my","at":13,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"}]},{"n":7,"en":"Giraffe: Why can't I be cool like another animals? I hate my neck.","ko":"기린: 저는 왜 다른 동물처럼 멋지지 않을까요? 제 목이 싫어요.","fx":[{"w":"another","r":"other","at":7,"t":"수량 한정사","m":"복수명사 animals 앞에는 other 사용"}]},{"n":8,"en":"Gorilla: Do not copy other animals. You is a giraffe.","ko":"고릴라: 다른 동물들을 따라 하지 마세요. 당신은 기린이에요.","fx":[{"w":"is","r":"are","at":7,"t":"be동사의 현재형","m":"주어 You는 are: You are (is 아님)"}]},{"n":9,"en":"Just be himself, and you'll feel fine.","ko":"그냥 자기 자신이 되세요. 그러면 기분이 좋아질 거예요.","fx":[{"w":"himself","r":"yourself","at":2,"t":"재귀대명사","m":"주어 you에는 재귀대명사 yourself 사용"}]},{"n":10,"en":"Giraffe: But I am so different at them. Just look at my neck!","ko":"기린: 하지만 저는 그들과 너무 달라요. 제 목을 한번 보세요!","fx":[{"w":"at","r":"from","at":6,"t":"기본전치사","m":"'~와 다른'은 different from 사용"}]},{"n":11,"en":"Gorilla: To be different is to be specially. Look at your long neck with proud.","ko":"고릴라: 다르다는 것은 특별하다는 거예요. 당신의 긴 목을 자랑스럽게 바라보세요.","fx":[{"w":"specially","r":"special","at":7,"t":"형용사와 부사","m":"be 뒤 보어는 형용사 special 사용"},{"w":"proud","r":"pride","at":14,"t":"명사와 형용사","m":"전치사 with 뒤에는 명사 pride 사용"}]},{"n":12,"en":"Believe at yourself.","ko":"자신을 믿으세요.","fx":[{"w":"at","r":"in","at":1,"t":"기본전치사","m":"'~을 믿다'는 believe in 사용"}]},{"n":13,"en":"Giraffe: I will try. Thanks for your advices.","ko":"기린: 노력해 볼게요. 조언해 줘서 고마워요.","fx":[{"w":"advices","r":"advice","at":7,"t":"셀 수 없는 명사","m":"advice는 셀 수 없는 명사라 s를 붙이지 않음"}]},{"n":14,"en":"Gorilla: You are welcome. We has a big party tonight.","ko":"고릴라: 천만에요. 오늘 밤 큰 파티가 있어요.","fx":[{"w":"has","r":"have","at":5,"t":"일반동사의 수일치","m":"주어 We에는 have: have (has 아님)"}]},{"n":16,"en":"Giraffe: This party is so many fun!","ko":"기린: 이 파티는 정말 즐거워요!","fx":[{"w":"many","r":"much","at":5,"t":"수량 형용사 many/much","m":"셀 수 없는 fun 앞에는 much 사용"}]},{"n":17,"en":"Animals sing and dance lately into the night.","ko":"동물들은 밤 늦게까지 노래하고 춤춘다.","fx":[{"w":"lately","r":"late","at":4,"t":"형용사와 부사","m":"'밤늦게까지'는 late 사용"}]},{"n":18,"en":"Monkey: It's getting dark. I can't see good.","ko":"원숭이: 어두워지고 있어요. 잘 안 보여요.","fx":[{"w":"good","r":"well","at":7,"t":"형용사와 부사","m":"동사 see를 꾸미는 부사 well 사용"}]},{"n":19,"en":"Cheetah: Can anyone reach that branches up there? They are blocking the moonlight.","ko":"치타: 누군가 저기 위 나뭇가지에 손이 닿을 수 있나요? 가지가 달빛을 가리고 있어요.","fx":[{"w":"that","r":"those","at":4,"t":"지시형용사","m":"복수명사 branches 앞에는 those 사용"}]},{"n":20,"en":"Giraffe stands up and clear away the branches with his neck.","ko":"기린이 일어나 목으로 가지를 치운다.","fx":[{"w":"clear","r":"clears","at":4,"t":"3인칭 단수 현재형","m":"주어 Giraffe에 맞춰 clears 사용"}]},{"n":21,"en":"Animals: Now we have moonlights! Let's dance again!","ko":"동물들: 이제 우리에겐 달빛이 있어요! 다시 춤춰요!","fx":[{"w":"moonlights","r":"moonlight","at":4,"t":"셀 수 없는 명사","m":"moonlight는 셀 수 없는 명사라 s를 붙이지 않음"}]},{"n":22,"en":"Thanks, Giraffe. Your long neck are amazing!","ko":"고마워요, 기린. 당신의 긴 목은 놀랍네요!","fx":[{"w":"are","r":"is","at":5,"t":"be동사의 수일치","m":"단수 주어 neck에는 is 사용"}]},{"n":23,"en":"You is cool!","ko":"당신은 멋져요!","fx":[{"w":"is","r":"are","at":1,"t":"be동사의 긍정문","m":"주어 You에는 are 사용"}]},{"n":25,"en":"I'm proud for myself!","ko":"저는 제가 자랑스러워요!","fx":[{"w":"for","r":"of","at":2,"t":"기본전치사","m":"'~이 자랑스러운'은 proud of 사용"}]}]},{"no":"43","t":"Ice Cream in the World","q":[{"n":1,"en":"Hi, everyone! Welcome to me vlog.","ko":"여러분 안녕하세요! 제 브이로그에 오신 것을 환영해요.","fx":[{"w":"me","r":"my","at":4,"t":"인칭대명사의 소유격","m":"vlog 앞에는 소유격 my 사용"}]},{"n":2,"en":"I'm at a international ice cream festival. I love ice cream.","ko":"저는 국제 아이스크림 축제에 와 있어요. 저는 아이스크림을 사랑해요.","fx":[{"w":"a","r":"an","at":2,"t":"관사 a/an","m":"모음 소리 international 앞에는 an 사용"}]},{"n":3,"en":"How about you? Different countries has different types of ice cream.","ko":"여러분은 어떠신가요? 다양한 나라에는 각기 다른 종류의 아이스크림이 있어요.","fx":[{"w":"has","r":"have","at":5,"t":"주어와 동사의 수일치","m":"주어 countries(복수)는 have (has 아님)"}]},{"n":4,"en":"A gelato truck is over there. There are a long line.","ko":"젤라토 트럭이 저기에 있어요. 줄이 길어요.","fx":[{"w":"are","r":"is","at":7,"t":"There is/are","m":"단수 a long line에는 There is 사용"}]},{"n":6,"en":"There are many flavors of gelato. They all look deliciously.","ko":"다양한 맛의 젤라토가 있어요. 그것들은 모두 맛있어 보여요.","fx":[{"w":"deliciously","r":"delicious","at":9,"t":"형용사와 부사","m":"look 뒤 보어 자리에는 형용사 delicious 사용"}]},{"n":7,"en":"Hmm.... This time, I want try strawberry gelato.","ko":"음…. 이번에는 딸기 젤라토를 먹어 보고 싶어요.","fx":[{"w":"try","r":"to try","at":5,"t":"to부정사","m":"want 뒤에는 to try 사용"}]},{"n":8,"en":"Yummy! It is much creamy.","ko":"맛있어요! 이것은 정말 부드러워요.","fx":[{"w":"much","r":"very","at":3,"t":"정도부사 very/much","m":"형용사 creamy 앞에는 very 사용"}]},{"n":9,"en":"Italy is the home of gelato. Gelato are a very popular dessert there.","ko":"이탈리아는 젤라토의 본고장입니다. 젤라토는 그곳에서 매우 인기 있는 디저트입니다.","fx":[{"w":"are","r":"is","at":7,"t":"be동사의 수일치","m":"주어 Gelato(단수)는 is (are 아님)"}]},{"n":10,"en":"It first appear there in the 16th century, and some gelato shops has a long history.","ko":"그것은 그곳에 16세기에 처음 등장했고, 몇몇 젤라토 가게들은 긴 역사가 있답니다.","fx":[{"w":"appear","r":"appeared","at":2,"t":"과거시제","m":"과거 시점이므로 appeared (appear 아님)"},{"w":"has","r":"have","at":12,"t":"주어와 동사의 수일치","m":"주어 shops(복수)는 have (has 아님)"}]},{"n":11,"en":"Here is an dondurma truck. I choose chocolate dondurma.","ko":"여기는 돈두르마 트럭이에요. 저는 초콜릿 돈두르마를 골랐어요.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"자음 소리 dondurma 앞에는 a 사용"}]},{"n":12,"en":"Surprise! It's sticky and stretch.","ko":"놀라워요! 이것은 쫀득하고 잘 늘어나요.","fx":[{"w":"stretch","r":"stretchy","at":4,"t":"형용사와 동사의 품사","m":"and 뒤에도 형용사 stretchy 사용"}]},{"n":13,"en":"Look at the man. He is stretch some dondurma.","ko":"저 아저씨를 보세요. 그는 돈두르마를 늘리고 있어요.","fx":[{"w":"stretch","r":"stretching","at":6,"t":"현재진행형","m":"is 뒤에는 stretching (stretch 아님)"}]},{"n":14,"en":"It is more long than his arm. Now he is hand the dondurma to a boy, but then he are taking it back.","ko":"그것은 그의 팔보다 더 길어요. 이제 그는 한 남학생에게 돈두르마를 건네주고 있는데요, 아저씨가 그것을 다시 가져가네요.","fx":[{"w":"more long","r":"longer","at":2,"t":"비교급","m":"짧은 형용사는 -er: longer than"},{"w":"hand","r":"handing","at":10,"t":"현재진행형","m":"is 뒤에는 handing (hand 아님)"},{"w":"are","r":"is","at":19,"t":"be동사의 수일치","m":"주어 he는 is (are 아님)"}]},{"n":15,"en":"Huh? The man are doing the same thing again and again.","ko":"어? 아저씨가 같은 행동을 계속 해요.","fx":[{"w":"are","r":"is","at":3,"t":"be동사의 현재형","m":"단수 주어 The man에는 is 사용"}]},{"n":17,"en":"Dondurma is Turkey ice cream. It melts very slow.","ko":"돈두르마는 튀르키예 아이스크림입니다. 그것은 아주 천천히 녹습니다.","fx":[{"w":"Turkey","r":"Turkish","at":2,"t":"형용사와 명사의 품사","m":"ice cream 앞에는 형용사 Turkish 사용"},{"w":"slow","r":"slowly","at":8,"t":"형용사와 부사","m":"동사 melts를 꾸미는 부사 slowly 사용"}]},{"n":18,"en":"Turkish people eats dondurma in many ways. Some use a knife and fork, and other eat it like a sandwich.","ko":"튀르키예 사람들은 다양한 방법으로 돈두르마를 먹습니다. 어떤 사람들은 칼과 포크를 사용하고, 다른 사람들은 그것을 샌드위치처럼 먹습니다.","fx":[{"w":"eats","r":"eat","at":2,"t":"주어와 동사의 수일치","m":"people은 복수 취급: eat (eats 아님)"},{"w":"other","r":"others","at":14,"t":"부정대명사","m":"Some ~, others ~: 복수 others 사용"}]},{"n":19,"en":"This is a truck for Mexican ice cream, paleta. Paleta looks a popsicle.","ko":"이것은 멕시코 아이스크림인 팔레타 트럭이에요. 팔레타는 막대 아이스크림처럼 생겼어요.","fx":[{"w":"a","r":"like a","at":11,"t":"look like","m":"\"~처럼 보이다\"는 look like 사용"}]},{"n":20,"en":"Most paletas has natural fruits in them. I want this kiwi paletas.","ko":"팔레타 대부분은 안에 천연 과일이 들어 있어요. 저는 이 키위 팔레타를 먹고 싶어요.","fx":[{"w":"has","r":"have","at":2,"t":"주어와 동사의 수일치","m":"주어 paletas(복수)는 have (has 아님)"},{"w":"paletas","r":"paleta","at":11,"t":"this 뒤 단수명사","m":"this 뒤에는 단수명사 paleta 사용"}]},{"n":21,"en":"Oh, no! It tastes spicily!","ko":"오, 이런! 이것은 매운맛이 나요!","fx":[{"w":"spicily","r":"spicy","at":4,"t":"형용사와 부사","m":"taste 뒤 보어 자리에는 형용사 spicy 사용"}]},{"n":22,"en":"Mexicans love spicy food. They sometimes adds chili peppers to paletas.","ko":"멕시코 사람들은 매운 음식을 좋아합니다. 그들은 때때로 팔레타에 고추를 추가합니다.","fx":[{"w":"adds","r":"add","at":6,"t":"3인칭 단수 현재형","m":"주어 They(복수)에는 add 사용"}]},{"n":23,"en":"Almost paletas are sweet, but some are spicy. Some Mexicans make them at home.","ko":"팔레타 대부분은 달콤하지만, 어떤 것은 맵습니다. 어떤 멕시코 사람들은 그것을 집에서 만듭니다.","fx":[{"w":"Almost","r":"Most","at":0,"t":"수량 한정사","m":"명사 앞에서 \"대부분의\"는 Most 사용"}]},{"n":24,"en":"Today, I have a lot of ice cream. Gelato was my favorite.","ko":"오늘 저는 많은 아이스크림을 먹었어요. 젤라토는 제가 제일 좋아하는 것이었어요.","fx":[{"w":"have","r":"had","at":2,"t":"과거시제","m":"과거의 일이므로 had (have 아님)"}]},{"n":25,"en":"It was most delicious than dondurma and paleta. Who kind of ice cream do you want to try?","ko":"그것은 돈두르마와 팔레타보다 더 맛있었어요. 여러분은 어떤 종류의 아이스크림을 먹어 보고 싶나요?","fx":[{"w":"most","r":"more","at":2,"t":"비교급","m":"than과 함께 비교급 more delicious 사용"},{"w":"Who","r":"What","at":8,"t":"의문사","m":"종류를 묻는 What kind of ~ 사용"}]}]},{"no":"44","t":"Who Threw a Cake at the Monalisa?","q":[{"n":1,"en":"Last Saturday, someone threw an cake at the Monalisa in the Botero Museum in Bogota, Colombia. There was four eyewitnesses.","ko":"지난 토요일, 누군가 콜롬비아 보고타의 보테로 박물관에 있는 '모나리자'에 케이크를 던졌다. 네 명의 목격자가 있었다.","fx":[{"w":"an","r":"a","at":4,"t":"관사 a/an","m":"cake는 자음 소리라 a 사용"},{"w":"was","r":"were","at":17,"t":"be동사의 수일치","m":"복수 four eyewitnesses에는 were: was 아님"}]},{"n":2,"en":"What did they said? Read the following, and find the criminal.","ko":"그들은 뭐라고 말했을까? 다음을 읽고, 범인을 찾아보자.","fx":[{"w":"said","r":"say","at":3,"t":"did의 의문문","m":"did 뒤에는 동사원형 say 사용"}]},{"n":3,"en":"I was looking at the Monalisa, and someone threw a cake at the painting. I turned around and see an old man.","ko":"저는 '모나리자'를 보고 있었는데, 누군가 그 그림을 향해 케이크를 던졌어요. 저는 뒤로 돌았고 한 노인을 봤어요.","fx":[{"w":"see","r":"saw","at":18,"t":"과거시제","m":"turned와 병렬이므로 과거형 saw: see 아님"}]},{"n":4,"en":"He was stand in front of a wheelchair. I'm about 170 cm tall, and he was a little more tall than me.","ko":"그는 휠체어 앞에 서 있었어요. 저는 키가 170cm 정도인데, 그는 저보다 조금 더 컸어요.","fx":[{"w":"stand","r":"standing","at":2,"t":"과거진행형","m":"was 뒤에는 standing: stand 아님"},{"w":"more tall","r":"taller","at":18,"t":"비교급","m":"tall의 비교급은 taller 사용"}]},{"n":5,"en":"An old man with gray hair were running away, and something fell off him head. It was his wig.","ko":"회색 머리의 한 노인이 도망가고 있었는데, 그의 머리에서 무언가 떨어졌어요. 그것은 그의 가발이었어요.","fx":[{"w":"were","r":"was","at":6,"t":"be동사의 수일치","m":"단수 주어 An old man에는 was 사용"},{"w":"him","r":"his","at":13,"t":"인칭대명사의 소유격","m":"명사 head 앞에는 소유격 his 사용"}]},{"n":6,"en":"I ran after him, but I couldn't catch him. He was fastest than me.","ko":"저는 그를 뒤쫓았지만, 잡을 수 없었어요. 그는 저보다 더 빨랐거든요.","fx":[{"w":"fastest","r":"faster","at":11,"t":"비교급","m":"than 앞에는 비교급 faster 사용"}]},{"n":7,"en":"In fact, the old man was not old. He was a young men with long brown hair.","ko":"사실, 그 노인은 나이 든 사람이 아니었어요. 그는 긴 갈색 머리의 젊은 남자였어요.","fx":[{"w":"men","r":"man","at":12,"t":"명사의 복수형","m":"a 뒤에는 단수명사 man 사용"}]},{"n":8,"en":"I went at the crime scene, and there was pieces of cake all over the painting.","ko":"저는 범죄 현장에 갔는데, 그림 곳곳에 케이크 조각들이 있었어요.","fx":[{"w":"at","r":"to","at":2,"t":"기본전치사","m":"'~에 갔다'는 went to 사용"},{"w":"was","r":"were","at":8,"t":"There is/are 구문","m":"복수 pieces 앞에는 there were 사용"}]},{"n":9,"en":"There was also an wheelchair near the painting, and I found a cake box next of the wheelchair. The box was from Camila's Bakery.","ko":"그림 근처에 휠체어도 있었는데, 저는 휠체어 옆에서 케이크 상자를 발견했어요. 그 상자는 Camila 빵집의 것이었어요.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"wheelchair는 자음 소리라 a 사용"},{"w":"of","r":"to","at":15,"t":"기본전치사","m":"'~ 옆에'는 next to 사용"}]},{"n":11,"en":"Last Friday, a young man come in. I speaked to him in Spanish, but he didn't understand me.","ko":"지난 금요일, 한 젊은 남자가 들어왔어요. 저는 그에게 스페인어로 말했지만, 그는 제 말을 이해하지 못했어요.","fx":[{"w":"come","r":"came","at":5,"t":"불규칙 과거형","m":"Last Friday는 과거, come의 과거형 came 사용"},{"w":"speaked","r":"spoke","at":8,"t":"불규칙 과거형","m":"speak의 과거형은 spoke: speaked 아님"}]},{"n":12,"en":"He spoke only English. We had a lot of different cakes, but he just wanted the most small one.","ko":"그는 영어로만 말했어요. 우리 가게에는 다양한 케이크가 많이 있었지만, 그는 단지 가장 작은 것을 원했어요.","fx":[{"w":"most small","r":"smallest","at":16,"t":"최상급","m":"small의 최상급은 the smallest 사용"}]},{"n":13,"en":"We sold only one cakes that day, so I remember him clear. Oh, he had blue eyes.","ko":"우리는 그날 케이크를 한 개만 팔아서, 저는 그를 똑똑히 기억해요. 아, 그는 파란색 눈을 가지고 있었어요.","fx":[{"w":"cakes","r":"cake","at":4,"t":"명사의 복수형","m":"one 뒤에는 단수명사 cake 사용"},{"w":"clear","r":"clearly","at":11,"t":"형용사와 부사","m":"동사 remember를 꾸미는 부사 clearly 사용"}]}]},{"no":"45","t":"Fun in Sokcho!","q":[{"n":1,"en":"Amelia are from London. Last week, she goed to Sokcho with Subin's family.","ko":"Amelia는 런던 출신이다. 지난주에, 그녀는 수빈이의 가족과 함께 속초에 갔다.","fx":[{"w":"are","r":"is","at":1,"t":"be동사의 수일치","m":"주어 Amelia(3인칭 단수)는 is (are 아님)"},{"w":"goed","r":"went","at":7,"t":"불규칙 과거형","m":"go의 과거형은 went"}]},{"n":3,"en":"It was sunnily today. Subin's family and me hiked Seoraksan and saw an very big rock.","ko":"오늘은 날씨가 화창했다. 수빈이의 가족과 나는 설악산을 등산했고 아주 큰 바위를 보았다.","fx":[{"w":"sunnily","r":"sunny","at":2,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 sunny 사용"},{"w":"me","r":"I","at":7,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 I 사용"},{"w":"an","r":"a","at":12,"t":"관사 a/an","m":"자음 소리 v 앞에는 a 사용"}]},{"n":5,"en":"The rock shook a few. It was scary, but I had a lot of funs!","ko":"그 바위는 조금 흔들렸다. 그것은 무서웠지만, 나는 정말 즐거웠다!","fx":[{"w":"few","r":"little","at":4,"t":"수량 형용사 a little/a few","m":"셀 수 없는 동작 정도는 a little 사용"},{"w":"funs","r":"fun","at":14,"t":"셀 수 없는 명사","m":"fun은 셀 수 없는 명사라 복수형 없음"}]},{"n":6,"en":"Next, we went at Sokcho Beach. We puts up two tents near the beach.","ko":"그다음에, 우리는 속초 해수욕장으로 갔다. 우리는 해변 근처에 두 개의 텐트를 쳤다.","fx":[{"w":"at","r":"to","at":3,"t":"기본전치사","m":"'~에 가다'는 went to 사용"},{"w":"puts","r":"put","at":7,"t":"일반동사의 수일치","m":"주어 We는 복수: put (puts 아님)"}]},{"n":8,"en":"In our tent, Subin and I heared the waves. We talked and laughed a lot.","ko":"우리 텐트 안에서, 수빈이와 나는 파도 소리를 들었다. 우리는 많이 이야기하고 웃었다.","fx":[{"w":"heared","r":"heard","at":6,"t":"불규칙 과거형","m":"hear의 과거형은 heard (heared 아님)"}]},{"n":10,"en":"We woke up very earlier. It were dark outside.","ko":"우리는 아주 일찍 일어났다. 밖은 어두웠
