<script>
var D=[{"n":1,"tag":null,"en":"Minu: Are you all enjoy this school club event? Now, we will invites the Community Mapping Club to the stage.","ko":"민우: 여러분 모두 이 학교 동아리 행사를 즐기고 있나요? 이제, 공동체 참여 지도 제작 동아리를 무대로 초대하겠습니다.","ok":false,"foot":[],"fixes":[{"wrong":"enjoy","right":"enjoying","partial":false,"at":[4],"point":"현재진행형: be동사 뒤 진행형은 -ing: enjoying (enjoy 아님)","topic":"현재진행형","memo":"be동사 뒤 진행형은 -ing: enjoying (enjoy 아님)"},{"wrong":"invites","right":"invite","partial":false,"at":[12],"point":"조동사: 조동사 will 뒤에는 동사원형 invite 사용","topic":"조동사","memo":"조동사 will 뒤에는 동사원형 invite 사용"}]},{"n":2,"tag":null,"en":"Is you ready?","ko":"준비되셨나요?","ok":false,"foot":[],"fixes":[{"wrong":"Is","right":"Are","partial":false,"at":[0],"point":"be동사의 의문문: 주어 you에는 Are 사용","topic":"be동사의 의문문","memo":"주어 you에는 Are 사용"}]},{"n":3,"tag":null,"en":"Nari: Sure. Hello, everyone!","ko":"나리: 물론이죠. 안녕하세요, 여러분!","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"Do you knows about \"Community Mapping\"? In this activity, we make maps for us community.","ko":"여러분은 '공동체 참여 지도 제작'에 대해 아시나요? 이 활동에서 우리는 우리 지역사회를 위해 지도를 만듭니다.","ok":false,"foot":[],"fixes":[{"wrong":"knows","right":"know","partial":false,"at":[2],"point":"일반동사의 의문문: Do 뒤에는 동사원형 know 사용","topic":"일반동사의 의문문","memo":"Do 뒤에는 동사원형 know 사용"},{"wrong":"us","right":"our","partial":false,"at":[13],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 our 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 our 사용"}]},{"n":5,"tag":null,"en":"It follow four steps. First, we explore our community.","ko":"그것은 네 단계를 따릅니다. 첫째, 우리는 우리 지역사회를 답사해요.","ok":false,"foot":[],"fixes":[{"wrong":"follow","right":"follows","partial":false,"at":[1],"point":"3인칭 단수 현재형: 주어 It은 3인칭 단수: follows (follow 아님)","topic":"3인칭 단수 현재형","memo":"주어 It은 3인칭 단수: follows (follow 아님)"}]},{"n":6,"tag":null,"en":"Second, we find it problems. Third, we mark them on the map.","ko":"둘째, 우리는 지역사회의 문제를 찾아내죠. 셋째, 우리는 그 문제를 지도에 표시해요.","ok":false,"foot":[],"fixes":[{"wrong":"it","right":"its","partial":false,"at":[3],"p
