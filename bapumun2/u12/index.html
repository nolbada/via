 + by로 쓴다", "pencilKey": "was written", "page": 126, "sec": "s4"}, {"id": "S4-04", "step": 4, "no": 4, "qtype": "A, B, C를 짝지어 수동태 문장 쓰기", "type": "write", "ans": "Hamlet was written by Shakespeare. / The Statue of Liberty was made by a French man. / Mona Lisa was drawn by Leonardo da Vinci.", "concept": ["074", "053"], "gap": "", "words": [["Hamlet", "햄릿(희곡 제목)"], ["Statue of Liberty", "자유의 여신상"], ["Mona Lisa", "모나리자"], ["draw", "그리다(과거분사 drawn)"], ["write", "쓰다(과거분사 written)"]], "h1": "A는 만든 사람, B는 동사, C는 작품이에요. 서로 어울리는 것끼리 짝지어 보세요. 작품이 주어이고 사람이 by 뒤에 와요.", "h2": "과거 수동태 「작품 + was + 과거분사 + by 사람」으로 써요. 동사는 draw(그리다), make(만들다), write(쓰다)이고 각각 불규칙하게 변해요.", "why": "햄릿은 셰익스피어가 썼고, 자유의 여신상은 프랑스 사람이 만들었고, 모나리자는 다빈치가 그렸어요. 그래서 was written, was made, was drawn이 돼요.", "opts": [], "pencil": "작품이 주어이면 「was + 과거분사 + ___ + 만든 사람」으로 쓴다", "pencilKey": "by", "page": 126, "sec": "s4"}, {"id": "S4-05", "step": 4, "no": 5, "qtype": "단어를 배열해 수동태 쓰기", "type": "write", "ans": "a lot of people's lives were saved", "concept": ["073", "074"], "gap": "", "words": [["prediction", "예측"], ["life", "목숨(복수 lives)"], ["save", "구하다"], ["scientist", "과학자"]], "h1": "그 과학자의 예측 덕분에 '많은 사람들의 목숨이 구해졌다'는 문장이에요. 목숨은 구하는 쪽일까요, 구해지는 쪽일까요?", "h2": "주어진 말은 a lot of, lives, people's, saved예요. 이것으로 주어를 만들고, 필요한 단어 하나를 더해 과거 수동태로 완성하세요. 주어는 복수예요.", "why": "주어 a lot of people's lives는 복수이고 구해지는 쪽이라서 be동사의 과거형 were를 더해 were saved(원형 save 구하다)로 써요.", "opts": [], "pencil": "복수 주어의 과거 수동태는 「___ + 과거분사」이다", "pencilKey": "were", "page": 126, "sec": "s4"}, {"id": "S4-06", "step": 4, "no": 6, "qtype": "우리말을 수동태로 영작하기", "type": "write", "ans": "they were found by the police yesterday", "concept": ["074"], "gap": "", "words": [["traveler", "여행자"], ["be lost", "길을 잃다"], ["police", "경찰"], ["find", "찾다(과거분사 found)"]], "h1": "밑줄 친 우리말은 '그들은 어제 경찰에 의해 발견되었다'예요. 앞의 They were lost처럼 여행자들은 발견되는 쪽이에요.", "h2": "find(찾다)는 find - found - found로 변해요. 과거 복수 주어 they에 맞게 be동사와 과거분사를 쓰고, 경찰 앞에는 by를 붙이세요.", "why": "발견된 쪽이 주어 they이고 어제 일이라서   }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
