"n": "⑤", "en": "The river which runs through the city is beautiful.", "ko": "그 도시를 가로질러 흐르는 강은 아름답다.", "ok": false, "why": "앞의 The river를 꾸미는 관계대명사예요."}], "pencil": "'어느'라는 뜻으로 묻는 which는 ___", "pencilKey": "의문사", "page": 141, "sec": "s1"}, {"id": "S1-20", "step": 1, "no": 20, "qtype": "유형 04 관계대명사 vs. 의문사 / 지시사 / 접속사", "type": "mc", "ans": "④", "concept": ["084", "078"], "gap": "관계대명사 who·which·that과 의문사·지시형용사·접속사 that 구별", "words": [["bus stop", "버스 정류장"], ["puzzle", "당황하게 하다"], ["problem", "문제"]], "h1": "that이 다섯 문장에 있어요. 뒤의 명사를 가리키는 말(저)인지, 앞 명사를 꾸미는 말인지 구분해 봐요.", "h2": "that 바로 뒤에 명사가 와서 '저 ~'라는 뜻이면 지시형용사예요. that 앞에 선행사가 있고 뒤에 동사가 오면 관계대명사예요.", "why": "④의 that은 앞의 the problem을 꾸미고 뒤에 동사 puzzled가 오는 주격 관계대명사예요. 나머지는 모두 '저 ~'라는 뜻의 지시형용사예요.", "opts": [{"n": "①", "en": "We know that boy is your brother.", "ko": "우리는 저 소년이 네 남동생이라는 것을 안다.", "ok": false, "why": "that 뒤에 명사 boy가 와서 '저'라는 뜻의 지시형용사예요."}, {"n": "②", "en": "Did you want to hear that song?", "ko": "너는 저 노래를 듣고 싶었니?", "ok": false, "why": "that 뒤에 명사 song이 와서 지시형용사예요."}, {"n": "③", "en": "That man at the bus stop was Elliot.", "ko": "버스 정류장에 있던 저 남자는 Elliot이었다.", "ok": false, "why": "That 뒤에 명사 man이 와서 지시형용사예요."}, {"n": "④", "en": "This is the problem that puzzled me.", "ko": "이것은 나를 당황하게 한 문제이다.", "ok": true, "why": "앞의 the problem을 꾸미고 동사가 이어지는 주격 관계대명사예요."}, {"n": "⑤", "en": "Yuna called that cat \"Spider.\"", "ko": "유나는 저 고양이를 Spider라고 불렀다.", "ok": false, "why": "that 뒤에 명사 cat이 와서 지시형용사예요."}], "pencil": "that 뒤에 명사가 바로 오면 ___ 형용사", "pencilKey": "지시", "page": 141, "sec": "s1"}, {"id": "S1-21", "step": 1, "no": 21, "qtype": "유형 04 관계대명사 vs. 의문사 / 지시사 / 접속사", "type": "mc", "ans": "①", "concept": ["084", "078"], "gap": "", "words": [["brighten", "밝게 하다"], ["word", "단어"], ["day", "하루"]], "h1": "빈칸 앞에는 a word(단어), 뒤에는 동사 brightens가 와요. 앞 명사를 꾸미면서 동사의 주어가 되어 줄 말을 찾아요.", "h2": "사람이 아니라 말(단어)이 선행사예요. 보기에서 선행사 뒤에서 주어 역할을 할 수 있는 관계대명사를 골라요.", "why": "a word는 사물이고 뒤에 동사가 오니까 주격 관계대명사 that이 알맞아요.", "opts": [{"n": "① . 하나는 접속사 역할이에요.", "why": "<보기>와 ①~④의 빈칸은 선행사 뒤의 주격 관계대명사 자리이고, ⑤는 Do you know 뒤에 올 접속사(that)가 들어가요.", "opts": [{"n": "①", "en": "I have a friend ___ is from Ireland.", "ko": "나는 아일랜드 출신인 친구가 있다.", "ok": false, "why": "a friend를 꾸미는 관계대명사 자리라서 <보기>와 같아요."}, {"n": "②", "en": "The man ___ is jogging is my father.", "ko": "조깅하고 있는 그 남자는 우리 아버지이다.", "ok": false, "why": "The man을 꾸미는 관계대명사 자리라서 <보기>와 같아요."}, {"n": "③", "en": "He saw a garden ___ was full of flowers.", "ko": "그는 꽃이 가득한 정원을 보았다.", "ok": false, "why": "a garden을 꾸미는 관계대명사 자리라서 <보기>와 같아요."}, {"n": "④", "en": "The hat ___ is floating on the water is mine.", "ko": "물 위에 떠 있는 그 모자는 내 것이다.", "ok": false, "why": "The hat을 꾸미는 관계대명사 자리라서 <보기>와 같아요."}, {"n": "⑤", "en": "Do you know ___ he is going to move to Ulsan next week?", "ko": "너는 그가 다음 주에 울산으로 이사 갈 것을 아니?", "ok": true, "why": "know의 목적어절을 이끄는 접속사 자리라서 다른 보기와 달라요."}], "pencil": "know 뒤 문장 앞에는 접속사 ___ 가 온다", "pencilKey": "that", "page": 146, "sec": "s4"}, {"id": "S4-04", "step": 4, "no": 4, "qtype": "표에서 짝지어 문장 쓰기", "type": "write", "ans": "A dentist is a person who treats people's teeth. / A liar is a person who doesn't tell the truth.", "concept": ["078", "080"], "gap": "", "words": [["dentist", "치과 의사"], ["liar", "거짓말쟁이"], ["treat", "치료하다"], ["teeth", "치아"], ["tell the truth", "진실을 말하다"]], "h1": "A의 직업과 B의 설명이 뜻으로 어울리는 짝끼리 연결해요. 선생님 예시(a teacher)는 보기로 이미 나와 있어요. 남은 직업 두 개를 짝지어요.", "h2": "『A + is a person + 관계대명사 + 동사』 모양이에요. 조건에 that은 쓰지 말라고 했어요. 동사는 문장에 맞게 형태를 바꿔요.", "why": "dentist는 치아를 치료하는 사람이라 treats people's teeth, liar는 진실을 말하지 않는 사람이라 doesn't tell the truth를 써요. a person은 단수 3인칭이라 treats와 doesn't로 맞춰요.", "opts": [], "pencil": "a person 뒤 who 다음 동사는 ___ 단수형", "pencilKey": "3인칭", "page": 146, "sec": "s4"}, {"id": "S4-05", "step": 4, "no": 5, "qtype": "그림 보고 주격 관계대명사 문장 완성", "type": "write", "ans": "(1) who [that] bakes bread (2) who [that] drives a taxi", "concept": ["078", "080"], "gap": "", "words": [["baker", "제빵사"], ["bake", "굽다"], ["driver", "운전사 function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
