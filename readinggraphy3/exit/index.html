<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩그라피 3 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"rg3-01-1","no":1,"ko":"유화 물감에 달걀노른자를 섞은 이유는?","items":[{"n":1,"t":"tf","q":"Famous artists like Botticelli and Leonardo da Vinci used egg yolk in their paint.","ko":"보티첼리와 레오나르도 다빈치 같은 유명한 화가들은 물감에 달걀노른자를 사용했다.","r":{"a":"T (본문과 맞는 내용)","w":"2~3번 문장에서 보티첼리와 다빈치 같은 유명한 화가들이 물감에 달걀노른자를 사용했다고 함. 본문과 일치.","c":"T","ev":"2~3번 문장","s":[[2,"But, famous artists like Botticelli and Leonardo da Vinci used something different.","하지만, 보티첼리와 레오나르도 다빈치와 같은 유명한 화가들은 무언가 다른 것을 이용했다."],[3,"They used egg yolk in their paint.","그들은 그들의 물감에 달걀노른자를 사용했다."]]},"h":"5c86fea148"},{"n":2,"t":"tf","q":"Egg yolk made the oil paint thinner.","ko":"달걀노른자는 유화 물감을 더 묽게 만들었다.","r":{"a":"F (본문과 다른 내용)","w":"6번 문장에서 달걀노른자를 섞으면 the paint becomes thicker(더 걸쭉해진다)라고 함. 묽어진다는 말은 반대 내용.","c":"F","ev":"6번 문장","s":[[6,"But if we mix egg yolk with oil paints, the paint becomes thicker.","하지만 만약 우리가 달걀노른자를 유화 물감과 섞는다면, 물감은 더 걸쭉해진다."]]},"h":"1de1fe4775"},{"n":3,"t":"tf","q":"Egg yolk protected the paint from water.","ko":"달걀노른자는 물로부터 물감을 보호했다.","r":{"a":"T (본문과 맞는 내용)","w":"10번 문장 It protected the paint from water.와 같은 내용. It은 9번의 egg yolk.","c":"T","ev":"10번 문장","s":[[10,"It protected the paint from water.","그것은 물로부터 물감을 보호했다."]]},"h":"fa8c55dc5d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Oil paint by itself changes color and wrinkles as it dries.)","ko":"밑줄 친 단어의 뜻은? (유화 물감 자체로는 마르면서 색이 변하고 wrinkles.)","opts":["번지다","녹다","주름이 지다","굳어 버리다"],"word":"wrinkles","r":{"a":"3) 주름이 지다","w":"5번 문장에서 유화 물감은 마르면서 색이 변하고 wrinkles한다. 7번의 crack(금이 가다)과 함께 나오는 말로, wrinkle = 주름이 지다.","c":3,"ev":"5번 문장","s":[[5,"Oil paint by itself changes color and wrinkles as it dries.","유화 물감 자체로는 마르면서 색이 변하고 주름이 진다."]]},"h":"84f351a772"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, egg yolk acted as a guard for the paint.)","ko":"밑줄 친 단어의 뜻은? (또한, 달걀노른자는 물감의 guard로 작용했다.)","opts":["보호물","장식","재료","경쟁자"],"word":"guard","r":{"a":"1) 보호물","w":"9번 문장 acted as a guard 다음 10번에서 물로부터 물감을 protect(보호하다)했다고 함. 그래서 guard = 보호물.","c":1,"ev":"9~10번 문장","s":[[9,"Also, egg yolk acted as a guard for the paint.","또한, 달걀노른자는 물감의 보호물로써 작용했다."],[10,"It protected the paint from water.","그것은 물로부터 물감을 보호했다."]]},"h":"5f3aada328"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt protected the paint from water.","ko":"밑줄 친 It이 가리키는 것은?","opts":["유화 물감","물","그림","달걀노른자"],"sko":"그것은 물로부터 물감을 보호했다.","r":{"a":"4) 달걀노른자","w":"9번에서 egg yolk가 보호물 역할을 했고, 10번 It은 그 달걀노른자. 물감(paint)은 보호를 받은 쪽이라 It이 아님.","c":4,"ev":"9~10번 문장","s":[[9,"Also, egg yolk acted as a guard for the paint.","또한, 달걀노른자는 물감의 보호물로써 작용했다."],[10,"It protected the paint from water.","그것은 물로부터 물감을 보호했다."]]},"h":"b7d69f05e7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without it, we might not have the chance to see the famous artists’ great paintings today!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["달걀노른자 덕분에 화가들이 유명해질 기회를 얻었다.","달걀노른자가 없었다면 오늘날 유명한 화가들의 훌륭한 그림을 못 볼 수도 있었다.","오늘날 유명한 화가들은 달걀노른자 없이 그림을 그린다.","달걀노른자가 없어서 화가들이 그림을 그릴 기회가 없었다."],"sko":"그것 없이는, 우리는 오늘날 유명한 화가들의 위대한 작품들을 볼 기회가 없을지도 모른다!","r":{"a":"2) 달걀노른자가 없었다면 오늘날 유명한 화가들의 훌륭한 그림을 못 볼 수도 있었다.","w":"13번 Without it은 '그것(달걀노른자) 없이는'. 달걀노른자가 없었다면 유명한 화가들의 그림을 지금 볼 기회가 없을지도 모른다는 뜻.","c":2,"ev":"12~13번 문장","s":[[12,"This shows how important egg yolk was in art history.","이것은 미술사에서 달걀노른자가 얼마나 중요했는지를 보여준다."],[13,"Without it, we might not have the chance to see the famous artists’ great paintings today!","그것 없이는, 우리는 오늘날 유명한 화가들의 위대한 작품들을 볼 기회가 없을지도 모른다!"]]},"h":"ea57daa86c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Oil paint by itself does not change color when it dries.","Egg yolk made the paint crack and wrinkle more.","The paint mix with egg yolk turned yellow over time.","The art stayed in good condition because egg yolk was mixed with the paint."],"oko":["유화 물감 자체로는 마르면서 색이 변하지 않는다.","달걀노른자는 물감이 더 금이 가고 주름지게 만들었다.","달걀노른자를 섞은 물감은 시간이 지나면서 노랗게 변했다.","달걀노른자를 물감에 섞었기 때문에 예술품이 좋은 상태로 남았다."],"r":{"a":"4) The art stayed in good condition because egg yolk was mixed with the paint.","w":"6~8번에서 달걀노른자를 섞은 물감은 걸쭉해져 금이 가거나 주름지지 않았고 예술품이 좋은 상태로 남았다. ①은 5번과 반대, ②는 7번과 반대, ③은 11번과 반대.","c":4,"ev":"6~8번 문장","s":[[6,"But if we mix egg yolk with oil paints, the paint becomes thicker.","하지만 만약 우리가 달걀노른자를 유화 물감과 섞는다면, 물감은 더 걸쭉해진다."],[7,"This helped the paint not crack or wrinkle.","이것은 물감이 금이 가거나 주름지지 않도록 도와주었다."],[8,"As a result, the art stayed in good condition.","결과적으로, 예술품은 좋은 상태로 유지되었다."]]},"h":"6a517464b2"},{"n":9,"t":"sum","q":"Oil paint by itself (A) as it dries, but egg yolk makes the paint (B).","ko":"유화 물감은 마르면서 (A)하지만, 달걀노른자는 물감을 (B)하게 만든다.","opts":["(A) stays the same / (B) thicker","(A) changes color / (B) thinner","(A) changes color / (B) thicker","(A) stays the same / (B) thinner","(A) gets thicker / (B) clearer"],"oko":["(A) 그대로이다 / (B) 더 걸쭉한","(A) 색이 변한다 / (B) 더 묽은","(A) 색이 변한다 / (B) 더 걸쭉한","(A) 그대로이다 / (B) 더 묽은","(A) 더 걸쭉해진다 / (B) 더 맑은"],"r":{"a":"3) (A) changes color / (B) thicker","w":"5번 유화 물감만 쓰면 색이 변하고(changes color), 6번 달걀노른자를 섞으면 더 걸쭉해진다(thicker). thinner는 6번과 반대.","c":3,"ev":"5~6번 문장","s":[[5,"Oil paint by itself changes color and wrinkles as it dries.","유화 물감 자체로는 마르면서 색이 변하고 주름이 진다."],[6,"But if we mix egg yolk with oil paints, the paint becomes thicker.","하지만 만약 우리가 달걀노른자를 유화 물감과 섞는다면, 물감은 더 걸쭉해진다."]]},"h":"c489e4974c"},{"n":10,"t":"fill","q":"Egg yolk acted as a guard to [A] the paint from water, so the paintings could [B] a long time.","ko":"달걀노른자는 물감을 물로부터 [A]하는 보호물로 작용해서, 그림들이 오랫동안 [B]할 수 있었다.","bko":{"protect":"보호하다","last":"오래가다, 지속되다","crack":"금이 가다","wrinkle":"주름이 지다","mix":"섞다","turn":"변하다"},"bank":["protect","last","crack","wrinkle","mix","turn"],"r":{"a":"[A] protect, [B] last","w":"10번 protected the paint from water, 11번 the paintings lasted a long time에서 가져옴. crack, wrinkle은 물감에 생기는 문제, mix, turn은 문맥에 맞지 않음.","c":null,"ev":"9~11번 문장","s":[[9,"Also, egg yolk acted as a guard for the paint.","또한, 달걀노른자는 물감의 보호물로써 작용했다."],[10,"It protected the paint from water.","그것은 물로부터 물감을 보호했다."],[11,"So the paint mix didn’t turn yellow over time, and the paintings lasted a long time.","그래서 물감 혼합체는 시간이 지나면서 노란색으로 변하지 않았고, 그림들은 오랫동안 지속되었다."]]},"h":"1aff63832f"}]},{"u":1,"id":"rg3-01-2","no":2,"ko":"탁구도 테니스도 아닌 피클볼의 정체는?","items":[{"n":1,"t":"tf","q":"A pickleball court is only a quarter the size of a tennis court.","ko":"피클볼 코트는 테니스 코트 크기의 단지 4분의 1이다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장 only a quarter the size of a tennis court와 같은 내용.","c":"T","ev":"4번 문장","s":[[4,"Also, a pickleball court is only a quarter the size of a tennis court, so it doesn’t take up a lot of space.","또한, 피클볼 코트는 테니스 코트 크기의 단지 4분의 1 크기여서 많은 공간을 차지하지 않아요."]]},"h":"c4e9e8bfe0"},{"n":2,"t":"tf","q":"To play pickleball, you need a square paddle and a heavy metal ball.","ko":"피클볼을 하려면 정사각형 라켓과 무거운 금속 공이 필요하다.","r":{"a":"F (본문과 다른 내용)","w":"3번 문장에서 필요한 것은 square paddle과 light plastic ball(가벼운 플라스틱 공). 무거운 금속 공이 아님.","c":"F","ev":"3번 문장","s":[[3,"To play, you need a square paddle and a light plastic ball with holes in it.","경기를 하기 위해, 여러분은 정사각형의 라켓과 구멍이 나 있는 가벼운 플라스틱 공이 필요해요."]]},"h":"777f4b4d92"},{"n":3,"t":"tf","q":"In the past, pickleball was mostly enjoyed by the elderly.","ko":"과거에 피클볼은 주로 노인들이 즐겼다.","r":{"a":"T (본문과 맞는 내용)","w":"7번 문장 In the past, pickleball was mostly enjoyed by the elderly. 와 같음.","c":"T","ev":"7번 문장","s":[[7,"In the past, pickleball was mostly enjoyed by the elderly.","과거에, 피클볼은 주로 노인들에 의해 즐겨졌어요."]]},"h":"0936f6332f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Pickleball is popular in the U.S. because it is easy to learn and gentle on the body.)","ko":"밑줄 친 단어의 뜻은? (피클볼은 배우기 쉽고 몸에 gentle해서 미국에서 인기가 있다.)","opts":["위험한","(몸에) 무리가 없는, 순한","비싼","시끄러운"],"word":"gentle","r":{"a":"2) (몸에) 무리가 없는, 순한","w":"5번에서 easy to learn(배우기 쉬운)과 함께 나오고, 6번에서 관절이 약한 사람들에게 좋다고 함. 그래서 gentle on the body = 몸에 무리가 가지 않는.","c":2,"ev":"5~6번 문장","s":[[5,"Pickleball is popular in the U.S. because it is easy to learn and gentle on the body.","피클볼은 배우기 쉽고 몸에 무리가 가지 않기 때문에 미국에서 인기가 있어요."],[6,"This makes it great for people with weak joints, especially for older people.","이는 관절이 약한 사람들, 특히 노년층에게 좋아요."]]},"h":"1005b984f0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the number of players under the age of 24 is increasing fast.)","ko":"밑줄 친 단어의 뜻은? (24세 이하의 선수 수가 빠르게 increasing하고 있다.)","opts":["줄어드는","멈추는","사라지는","증가하는"],"word":"increasing","r":{"a":"4) 증가하는","w":"9번에서 젊은 선수가 늘고 있다는 흐름(8번 young people도 한다). increase = 증가하다. 반대말은 decrease(줄다).","c":4,"ev":"8~9번 문장","s":[[8,"But now, young people are picking up the paddle too!","하지만 이제, 젊은 사람들도 라켓을 집어 들고 있어요!"],[9,"Recently, almost half of the players were under 55, and the number of players under the age of 24 is increasing fast.","최근, 선수들의 거의 절반은 55세 이하였으며, 24세 이하의 선수 수가 빠르게 증가하고 있어요."]]},"h":"ad4da47421"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes it great for people with weak joints, especially for older people.","ko":"밑줄 친 This가 가리키는 것은?","opts":["피클볼이 배우기 쉽고 몸에 무리가 가지 않는 것","피클볼 코트가 작아서 공간을 적게 차지하는 것","피클볼이 탁구, 테니스, 배드민턴을 섞은 것","피클볼 공에 구멍이 나 있는 것"],"sko":"이는 관절이 약한 사람들, 특히 노년층에게 좋아요.","r":{"a":"1) 피클볼이 배우기 쉽고 몸에 무리가 가지 않는 것","w":"6번 This는 바로 앞 5번의 easy to learn and gentle on the body(배우기 쉽고 몸에 무리가 없음). 그래서 관절이 약한 사람들에게 좋다고 이어짐.","c":1,"ev":"5~6번 문장","s":[[5,"Pickleball is popular in the U.S. because it is easy to learn and gentle on the body.","피클볼은 배우기 쉽고 몸에 무리가 가지 않기 때문에 미국에서 인기가 있어요."],[6,"This makes it great for people with weak joints, especially for older people.","이는 관절이 약한 사람들, 특히 노년층에게 좋아요."]]},"h":"5133a96758"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You might enjoy this amazing sport for people of all ages.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["이 놀라운 스포츠는 나이 많은 사람들만 즐길 수 있다.","여러분은 모든 연령대를 위한 이 놀라운 스포츠를 즐길지도 모른다.","여러분은 이 놀라운 스포츠를 하기에는 이미 나이가 너무 많다.","모든 사람이 이 놀라운 스포츠를 이미 즐기고 있다."],"sko":"여러분은 모든 연령대의 사람들을 위한 이 놀라운 스포츠를 즐길지도 몰라요.","r":{"a":"2) 여러분은 모든 연령대를 위한 이 놀라운 스포츠를 즐길지도 모른다.","w":"11번 might enjoy는 '즐길지도 모른다', for people of all ages는 '모든 연령대의 사람들을 위한'. 나이 제한이 없는 스포츠라는 뜻.","c":2,"ev":"11번 문장","s":[[11,"You might enjoy this amazing sport for people of all ages.","여러분은 모든 연령대의 사람들을 위한 이 놀라운 스포츠를 즐길지도 몰라요."]]},"h":"6d0ac8008c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["A pickleball court is bigger than a tennis court.","In the past, pickleball was mostly enjoyed by young people.","Pickleball mixes ping-pong, tennis, and badminton.","Pickleball is hard on the body, so it is bad for people with weak joints."],"oko":["피클볼 코트는 테니스 코트보다 크다.","과거에 피클볼은 주로 젊은 사람들이 즐겼다.","피클볼은 탁구, 테니스, 배드민턴을 섞은 것이다.","피클볼은 몸에 무리가 가서 관절이 약한 사람에게 나쁘다."],"r":{"a":"3) Pickleball mixes ping-pong, tennis, and badminton.","w":"2번 문장 It is a fun game that mixes ping-pong, tennis, and badminton. ①은 4번과 반대(더 작음), ②는 7번과 반대(노인), ④는 5~6번과 반대(몸에 무리 없음).","c":3,"ev":"2번 문장","s":[[2,"It is a fun game that mixes ping-pong, tennis, and badminton.","그것은 탁구, 테니스, 그리고 배드민턴을 혼합한 재미있는 경기예요."]]},"h":"150c9dd4bc"},{"n":9,"t":"sum","q":"Pickleball is popular in the U.S. because it is (A) to learn and (B) on the body.","ko":"피클볼은 배우기 (A)하고 몸에 (B)하기 때문에 미국에서 인기가 있다.","opts":["(A) hard / (B) gentle","(A) hard / (B) rough","(A) easy / (B) rough","(A) easy / (B) heavy","(A) easy / (B) gentle"],"oko":["(A) 어려운 / (B) 무리가 없는","(A) 어려운 / (B) 거친","(A) 쉬운 / (B) 거친","(A) 쉬운 / (B) 무거운","(A) 쉬운 / (B) 무리가 없는"],"r":{"a":"5) (A) easy / (B) gentle","w":"5번 easy to learn and gentle on the body. 쉽고(easy) 몸에 무리가 없음(gentle). hard, rough, heavy는 본문과 반대되는 말.","c":5,"ev":"5번 문장","s":[[5,"Pickleball is popular in the U.S. because it is easy to learn and gentle on the body.","피클볼은 배우기 쉽고 몸에 무리가 가지 않기 때문에 미국에서 인기가 있어요."]]},"h":"f3a646c20b"},{"n":10,"t":"fill","q":"Recently, [A] half of the players were under 55, and now [B] people are also playing pickleball.","ko":"최근 선수들의 [A] 절반이 55세 이하였고, 이제 [B] 사람들도 피클볼을 하고 있다.","bko":{"almost":"거의","young":"젊은","plastic":"플라스틱의","mostly":"주로","square":"정사각형의","gentle":"순한"},"bank":["almost","young","plastic","mostly","square","gentle"],"r":{"a":"[A] almost, [B] young","w":"9번 almost half of the players were under 55, 8번 young people are picking up the paddle too에서 가져옴. mostly는 7번에서 '주로'라는 뜻으로 쓰인 말이고, plastic(플라스틱의)과 square(정사각형의)는 공과 라켓을 설명하는 말이라 빈칸에 맞지 않음.","c":null,"ev":"8~9번 문장","s":[[8,"But now, young people are picking up the paddle too!","하지만 이제, 젊은 사람들도 라켓을 집어 들고 있어요!"],[9,"Recently, almost half of the players were under 55, and the number of players under the age of 24 is increasing fast.","최근, 선수들의 거의 절반은 55세 이하였으며, 24세 이하의 선수 수가 빠르게 증가하고 있어요."]]},"h":"485cadf56f"}]},{"u":1,"id":"rg3-01-3","no":3,"ko":"예쁜 초록색 책 속에 숨은 위험은?","items":[{"n":1,"t":"tf","q":"Melissa Tedone and her team studied old green books from the 19th century.","ko":"Melissa Tedone과 그녀의 팀은 19세기의 오래된 초록색 책들을 연구했다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장 studied old green books from the 19th century와 같은 내용.","c":"T","ev":"4번 문장","s":[[4,"In 2019, Melissa Tedone and her team studied old green books from the 19th century.","2019년에, Melissa Tedone과 그녀의 팀은 19세기의 오래된 초록색 책들을 연구했다."]]},"h":"32a1489ca9"},{"n":2,"t":"tf","q":"Melissa’s team made only about 90 bookmarks.","ko":"Melissa의 팀은 책갈피를 약 90개만 만들었다.","r":{"a":"F (본문과 다른 내용)","w":"7번 문장에서 made over 900 bookmarks(900개 이상)라고 함. 90개가 아님.","c":"F","ev":"7번 문장","s":[[7,"Her team made over 900 bookmarks with pictures of the green book covers and safety tips.","그녀의 팀은 초록색 책 표지의 사진과 안전 팁이 담긴 책갈피를 900개 이상 만들었다."]]},"h":"bc1b210b5e"},{"n":3,"t":"tf","q":"Melissa says people don’t have to throw away the green books.","ko":"Melissa는 사람들이 초록색 책을 버릴 필요가 없다고 말한다.","r":{"a":"T (본문과 맞는 내용)","w":"11번 문장 You don’t have to throw away these books.와 같은 내용.","c":"T","ev":"11번 문장","s":[[11,"Melissa says, “You don’t have to throw away these books.","Melissa는 “당신은 이런 책들을 버릴 필요는 없어요."]]},"h":"32ab2c085d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But emerald green had a harmful chemical called arsenic in it.)","ko":"밑줄 친 단어의 뜻은? (에메랄드그린 색에는 비소라고 불리는 harmful 화학 물질이 들어 있었다.)","opts":["도움이 되는","해로운","흔한","아름다운"],"word":"harmful","r":{"a":"2) 해로운","w":"3번 But 뒤에서 색이 인기 있다는 앞 내용과 반대로 나쁜 이야기가 나옴. 그래서 harmful chemical = 해로운 화학 물질.","c":2,"ev":"3번 문장","s":[[3,"But emerald green had a harmful chemical called arsenic in it.","그러나 에메랄드그린 색에는 비소라고 불리는 해로운 화학 물질이 들어 있었다."]]},"h":"6e2ca2c929"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Just be careful and be aware of the danger.)","ko":"밑줄 친 단어의 뜻은? (단지 조심하고 그 위험을 aware 하세요.)","opts":["무서워하는","잊고 있는","알고 있는, 인식하는","자랑스러워하는"],"word":"aware","r":{"a":"3) 알고 있는, 인식하는","w":"12번에서 be careful(조심하다)과 함께 위험을 알고 있으라는 뜻. be aware of = ~을 알다, 인식하다.","c":3,"ev":"12번 문장","s":[[12,"Just be careful and be aware of the danger.”","단지 조심하시고 그 위험을 인식해 두세요.”라고 말한다."]]},"h":"8f75d21921"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBut emerald green had a harmful chemical called arsenic in it.","ko":"밑줄 친 it이 가리키는 것은?","opts":["비소","19세기","책 표지","에메랄드그린 색"],"sko":"그러나 에메랄드그린 색에는 비소라고 불리는 해로운 화학 물질이 들어 있었다.","r":{"a":"4) 에메랄드그린 색","w":"3번 문장의 주어가 emerald green이고, 그 색 안에 비소가 들어 있었다는 뜻. 비소(arsenic)는 들어 있는 물질이라 it이 아님.","c":4,"ev":"1번, 3번 문장","s":[[1,"In the 1800s, a color called emerald green was very popular.","1800년대에, 에메랄드그린이라고 불리는 색이 매우 인기가 있었다."],[3,"But emerald green had a harmful chemical called arsenic in it.","그러나 에메랄드그린 색에는 비소라고 불리는 해로운 화학 물질이 들어 있었다."]]},"h":"4dffe13891"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The books aren’t too dangerous, but touching them often could be bad.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["이 책들이 아주 위험하지는 않지만, 자주 만지는 것은 나쁠 수 있다.","이 책들은 매우 위험해서 절대 만지면 안 된다.","이 책들은 전혀 위험하지 않아서 얼마든지 만져도 된다.","이 책들은 위험하지 않지만 읽으면 나쁠 수 있다."],"sko":"그 책들은 아주 위험하지는 않지만, 그것들을 자주 만지는 것은 나쁠 수 있다.","r":{"a":"1) 이 책들이 아주 위험하지는 않지만, 자주 만지는 것은 나쁠 수 있다.","w":"aren’t too dangerous는 '너무(아주) 위험하지는 않다', but 뒤에 자주 만지는 것은 나쁠 수 있다는 내용. 읽는 것은 나오지 않음.","c":1,"ev":"10번 문장","s":[[10,"The books aren’t too dangerous, but touching them often could be bad.","그 책들은 아주 위험하지는 않지만, 그것들을 자주 만지는 것은 나쁠 수 있다."]]},"h":"836fc697ef"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Emerald green was popular in the 1900s.","The bookmarks were sent only to the U.S.","Books with arsenic were also found in other places.","Melissa Tedone studied old books from the 18th century."],"oko":["에메랄드그린은 1900년대에 인기 있었다.","책갈피는 미국에만 보내졌다.","비소가 있는 책들이 다른 장소에서도 발견되었다.","Melissa Tedone은 18세기의 오래된 책들을 연구했다."],"r":{"a":"3) Books with arsenic were also found in other places.","w":"9번 문장 books with arsenic were found in other places too와 같음. ①은 1번(1800년대), ②는 8번(미국과 18개 다른 나라), ④는 4번(19세기)과 다름.","c":3,"ev":"9번 문장","s":[[9,"As a result, books with arsenic were found in other places too.","그 결과, 다른 장소들에서도 비소가 있는 책들이 발견되었다."]]},"h":"2271eac46b"},{"n":9,"t":"sum","q":"Melissa’s team made (A) with pictures of green book covers and safety tips, and (B) them to many countries.","ko":"Melissa의 팀은 초록색 책 표지 사진과 안전 팁이 담긴 (A)를 만들었고, 그것들을 여러 나라에 (B).","opts":["(A) posters / (B) sent","(A) bookmarks / (B) sold","(A) paintings / (B) sent","(A) posters / (B) sold","(A) bookmarks / (B) sent"],"oko":["(A) 포스터 / (B) 보냈다","(A) 책갈피 / (B) 팔았다","(A) 그림 / (B) 보냈다","(A) 포스터 / (B) 팔았다","(A) 책갈피 / (B) 보냈다"],"r":{"a":"5) (A) bookmarks / (B) sent","w":"7번 made over 900 bookmarks with pictures … and safety tips, 8번 These bookmarks were sent … 책갈피를 만들어 보냈다(sent). 판매했다(sold)는 내용은 없음.","c":5,"ev":"7~8번 문장","s":[[7,"Her team made over 900 bookmarks with pictures of the green book covers and safety tips.","그녀의 팀은 초록색 책 표지의 사진과 안전 팁이 담긴 책갈피를 900개 이상 만들었다."],[8,"These bookmarks were sent throughout the U.S. and to 18 other countries.","이 책갈피들은 미국 전역과 18개의 다른 나라들로 보내졌다."]]},"h":"bb67e789cb"},{"n":10,"t":"fill","q":"In the 1800s, emerald green was very [A], but it had a harmful [B] called arsenic.","ko":"1800년대에 에메랄드그린은 매우 [A]했지만, 비소라고 불리는 해로운 [B]이 들어 있었다.","bko":{"popular":"인기 있는","chemical":"화학 물질","careful":"조심하는","aware":"알고 있는","safety":"안전","bookmark":"책갈피"},"bank":["popular","chemical","careful","aware","safety","bookmark"],"r":{"a":"[A] popular, [B] chemical","w":"1번 a color called emerald green was very popular, 3번 a harmful chemical called arsenic에서 가져옴. careful(조심하는)과 aware(알고 있는)는 12번 조언에 나오는 말이고, safety(안전)와 bookmark(책갈피)는 7번의 책갈피 이야기라 [A]와 [B] 문맥에 맞지 않음.","c":null,"ev":"1번, 3번 문장","s":[[1,"In the 1800s, a color called emerald green was very popular.","1800년대에, 에메랄드그린이라고 불리는 색이 매우 인기가 있었다."],[3,"But emerald green had a harmful chemical called arsenic in it.","그러나 에메랄드그린 색에는 비소라고 불리는 해로운 화학 물질이 들어 있었다."]]},"h":"352ea6f403"}]},{"u":2,"id":"rg3-02-1","no":1,"ko":"여름에도 모기가 없는 나라가 있다고?","items":[{"n":1,"t":"tf","q":"Mosquitoes can’t survive in Iceland.","ko":"모기는 아이슬란드에서 살아남을 수 없다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장 Mosquitoes can’t survive there.에서 there는 아이슬란드. 본문과 일치.","c":"T","ev":"6번 문장","s":[[6,"Mosquitoes can’t survive there.","모기는 그곳에서 살아남을 수 없어요."]]},"h":"7ed6405d40"},{"n":2,"t":"tf","q":"Mosquitoes can’t be found in Greenland and Norway.","ko":"그린란드와 노르웨이에서는 모기를 찾을 수 없다.","r":{"a":"F (본문과 다른 내용)","w":"8번 문장에서 mosquitoes can easily be found in other cold countries, like Greenland and Norway(쉽게 찾을 수 있다)라고 함. 찾을 수 없다는 말은 반대 내용.","c":"F","ev":"8번 문장","s":[[8,"However, mosquitoes can easily be found in other cold countries, like Greenland and Norway.","하지만, 모기는 그린란드나 노르웨이와 같은 다른 추운 나라들에서 쉽게 찾을 수 있어요."]]},"h":"5fdbb39046"},{"n":3,"t":"tf","q":"Mosquitoes kill about 725,000 people per year.","ko":"모기는 해마다 약 725,000명의 사람들을 죽음에 이르게 한다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장 They kill about 725,000 people per year.와 같은 내용. They는 3번의 mosquitoes.","c":"T","ev":"4번 문장","s":[[4,"They kill about 725,000 people per year.","그것들은 해마다 약 725,000명의 사람들을 죽음에 이르게 해요."]]},"h":"afe5f4e32b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Mosquitoes can’t survive there.)","ko":"밑줄 친 단어의 뜻은? (모기는 그곳에서 survive할 수 없다.)","opts":["도망치다","살아남다","퍼지다","숨다"],"word":"survive","r":{"a":"2) 살아남다","w":"5번에서 아이슬란드 사람들은 걱정 없다고 하고, 6번이 그 이유. 모기가 그곳에서 살아남을 수 없기 때문. survive = 살아남다.","c":2,"ev":"5~6번 문장","s":[[5,"But people in Iceland don’t have to worry about them!","하지만 아이슬란드의 사람들은 그것들에 대해 걱정할 필요가 없어요!"],[6,"Mosquitoes can’t survive there.","모기는 그곳에서 살아남을 수 없어요."]]},"h":"8b4705739a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If you want to escape from mosquitoes in summer, why don’t you visit Iceland?)","ko":"밑줄 친 단어의 뜻은? (여름에 모기로부터 escape하고 싶다면 아이슬란드를 방문하는 게 어때요?)","opts":["찾다","즐기다","방문하다","도망치다"],"word":"escape","r":{"a":"4) 도망치다","w":"12번에서 모기가 없는 아이슬란드를 방문하라고 권하고, 13번에서 모기에 물리지 않는다고 함. escape from mosquitoes = 모기로부터 도망치다.","c":4,"ev":"12~13번 문장","s":[[12,"If you want to escape from mosquitoes in summer, why don’t you visit Iceland?","만약 여러분이 여름에 모기로부터 도망치고 싶다면, 아이슬란드를 방문하는 것은 어떤가요?"],[13,"You can enjoy the beautiful nature and won’t get any mosquito bites.","여러분은 아름다운 자연을 즐길 수 있고 모기에 물린 상처는 하나도 얻지 않을 거예요."]]},"h":"fb06d79f8e"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nBut people in Iceland don’t have to worry about them!","ko":"밑줄 친 them이 가리키는 것은?","opts":["말라리아와 같은 병","아이슬란드 사람들","모기","과학자들"],"sko":"하지만 아이슬란드의 사람들은 그것들에 대해 걱정할 필요가 없어요!","r":{"a":"3) 모기","w":"3~4번에서 모기(mosquitoes)와 그것들(They)이 계속 이야기됨. 5번 them은 아이슬란드 사람들이 걱정하지 않아도 되는 모기들.","c":3,"ev":"3~5번 문장","s":[[3,"Mosquitoes are insects that can spread diseases, like malaria.","모기는 말라리아와 같은 병을 퍼트릴 수 있는 곤충이에요."],[4,"They kill about 725,000 people per year.","그것들은 해마다 약 725,000명의 사람들을 죽음에 이르게 해요."],[5,"But people in Iceland don’t have to worry about them!","하지만 아이슬란드의 사람들은 그것들에 대해 걱정할 필요가 없어요!"]]},"h":"8dbfe89172"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, for mosquitoes, the temperature in Iceland changes too quickly to hide from the cold.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["아이슬란드의 기온은 모기가 추위를 피해 숨기에는 너무 빨리 변한다.","아이슬란드의 기온은 너무 높아서 모기가 숨을 필요가 없다.","모기들은 너무 빨리 움직여서 추위로부터 숨을 수 있다.","아이슬란드의 기온은 느리게 변해서 모기가 숨기 쉽다."],"sko":"하지만 모기들에게, 아이슬란드의 기온은 너무 빨리 변해서 추위로부터 숨을 수 없어요.","r":{"a":"1) 아이슬란드의 기온은 모기가 추위를 피해 숨기에는 너무 빨리 변한다.","w":"too quickly to hide는 '너무 빨리 변해서 숨을 수 없다'. 10번의 다른 나라는 얼음 아래에 숨을 수 있지만 아이슬란드는 기온이 너무 빨리 변해 숨을 수 없다는 뜻.","c":1,"ev":"10~11번 문장","s":[[10,"In other countries, mosquitoes can hide under the ice in the winter and come out during the summer.","다른 나라에서, 모기들은 겨울철에는 빙판 아래에 숨었다가 여름에 나올 수 있어요."],[11,"However, for mosquitoes, the temperature in Iceland changes too quickly to hide from the cold.","하지만 모기들에게, 아이슬란드의 기온은 너무 빨리 변해서 추위로부터 숨을 수 없어요."]]},"h":"25cade2f97"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Scientists think Iceland is too hot for mosquitoes.","In Iceland, you won’t get any mosquito bites.","Mosquitoes are the safest animals in the world.","Mosquitoes in Iceland hide under the ice in the winter."],"oko":["과학자들은 아이슬란드가 모기에게 너무 덥다고 생각한다.","아이슬란드에서는 모기에 물린 상처를 하나도 얻지 않을 것이다.","모기는 세계에서 가장 안전한 동물이다.","아이슬란드의 모기는 겨울에 빙판 아래에 숨는다."],"r":{"a":"2) In Iceland, you won’t get any mosquito bites.","w":"13번 문장 won’t get any mosquito bites(모기에 물린 상처는 하나도 얻지 않을 것)와 같음. ①은 7번(너무 추움), ③은 1~2번(가장 위험한 동물), ④는 11번(아이슬란드에선 숨을 수 없음)과 다름.","c":2,"ev":"13번 문장","s":[[13,"You can enjoy the beautiful nature and won’t get any mosquito bites.","여러분은 아름다운 자연을 즐길 수 있고 모기에 물린 상처는 하나도 얻지 않을 거예요."]]},"h":"0817fec142"},{"n":9,"t":"sum","q":"In other cold countries, mosquitoes can (A) under the ice in winter, but in Iceland the temperature changes too (B) for them to do so.","ko":"다른 추운 나라에서 모기는 겨울에 빙판 아래에 (A)할 수 있지만, 아이슬란드에서는 기온이 너무 (B) 변해서 그렇게 할 수 없다.","opts":["(A) hide / (B) slowly","(A) fly / (B) quickly","(A) die / (B) slowly","(A) fly / (B) slowly","(A) hide / (B) quickly"],"oko":["(A) 숨다 / (B) 천천히","(A) 날다 / (B) 빠르게","(A) 죽다 / (B) 천천히","(A) 날다 / (B) 천천히","(A) 숨다 / (B) 빠르게"],"r":{"a":"5) (A) hide / (B) quickly","w":"10번 다른 나라의 모기는 얼음 아래에 hide(숨다), 11번 아이슬란드는 기온이 too quickly(너무 빨리) 변해 숨지 못함. slowly는 반대.","c":5,"ev":"10~11번 문장","s":[[10,"In other countries, mosquitoes can hide under the ice in the winter and come out during the summer.","다른 나라에서, 모기들은 겨울철에는 빙판 아래에 숨었다가 여름에 나올 수 있어요."],[11,"However, for mosquitoes, the temperature in Iceland changes too quickly to hide from the cold.","하지만 모기들에게, 아이슬란드의 기온은 너무 빨리 변해서 추위로부터 숨을 수 없어요."]]},"h":"e6a99cd6ef"},{"n":10,"t":"fill","q":"Mosquitoes are [A] that can [B] diseases, like malaria.","ko":"모기는 말라리아와 같은 병을 [B]할 수 있는 [A]이다.","bko":{"insects":"곤충","spread":"퍼트리다","hide":"숨다","visit":"방문하다","countries":"나라들","summer":"여름"},"bank":["insects","spread","hide","visit","countries","summer"],"r":{"a":"[A] insects, [B] spread","w":"3번 Mosquitoes are insects that can spread diseases, like malaria에서 가져옴. hide(숨다)와 visit(방문하다)는 병(diseases)을 어떻게 한다는 말과 어울리지 않고, countries(나라들)와 summer(여름)는 모기가 무엇인지 설명하는 [A] 자리에 맞지 않음.","c":null,"ev":"3번 문장","s":[[3,"Mosquitoes are insects that can spread diseases, like malaria.","모기는 말라리아와 같은 병을 퍼트릴 수 있는 곤충이에요."]]},"h":"fbe9c7e710"}]},{"u":2,"id":"rg3-02-2","no":2,"ko":"셀피 한 장에 목숨을 걸어도 될까?","items":[{"n":1,"t":"tf","q":"Signs for safety are everywhere, but they are often ignored.","ko":"안전을 위한 표지판은 어디에나 있지만 자주 무시된다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장 Signs for safety are everywhere, but they are often ignored.와 같은 내용.","c":"T","ev":"2번 문장","s":[[2,"Signs for safety are everywhere, but they are often ignored.","안전을 위한 표지판은 어디에나 있지만, 그것들은 자주 무시된다."]]},"h":"3d826d361b"},{"n":2,"t":"tf","q":"Seeing wild animals in zoos makes them look more real and dangerous.","ko":"동물원에서 야생 동물을 보면 동물들이 더 현실적이고 더 위험해 보인다.","r":{"a":"F (본문과 다른 내용)","w":"5번 문장에서 동물원 같은 곳에서 자주 봐서 less real and dangerous(덜 현실적이고 덜 위험해) 보인다고 함. more가 아니라 less라서 반대.","c":"F","ev":"5번 문장","s":[[5,"We often see wild animals in places like zoos, so the animals seem less real and dangerous.","우리는 동물원과 같은 장소에서 야생 동물들을 자주 봐서 동물들이 덜 현실적이고 덜 위험해 보인다."]]},"h":"792f369d5d"},{"n":3,"t":"tf","q":"Getting too close to animals also puts them in danger.","ko":"동물들에게 너무 가까이 가는 것은 동물들도 위험에 빠뜨린다.","r":{"a":"T (본문과 맞는 내용)","w":"11번 문장 Getting too close to animals also puts them in danger와 같음. them은 동물들.","c":"T","ev":"11번 문장","s":[[11,"Getting too close to animals also puts them in danger because they might be killed to protect people.","동물들에게 너무 가까이 가는 것은 사람을 보호하기 위해 동물들이 죽게 될지도 모르기 때문에 동물들도 위험에 빠뜨린다."]]},"h":"c2d17a45bd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Signs for safety are everywhere, but they are often ignored.)","ko":"밑줄 친 단어의 뜻은? (안전을 위한 표지판은 어디에나 있지만 자주 ignored된다.)","opts":["무시되다","지켜지다","설치되다","사라지다"],"word":"ignored","r":{"a":"1) 무시되다","w":"2번 but 뒤에서 표지판이 있는데도 3번에서 사람들이 위험에 빠질 수 있다고 함. 표지판이 지켜지지 않고 무시된다는 흐름. ignore = 무시하다.","c":1,"ev":"2~3번 문장","s":[[2,"Signs for safety are everywhere, but they are often ignored.","안전을 위한 표지판은 어디에나 있지만, 그것들은 자주 무시된다."],[3,"This can put people in serious danger.","이것은 사람들을 심각한 위험에 빠뜨릴 수 있다."]]},"h":"962f1ba306"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This makes people take bigger risks, such as entering animals’ space!)","ko":"밑줄 친 단어의 뜻은? (이것은 사람들이 동물들의 공간에 들어가는 것과 같은 더 큰 risks를 무릅쓰게 한다!)","opts":["기회","위험","선물","관심"],"word":"risks","r":{"a":"2) 위험","w":"9번 such as entering animals’ space(동물들의 공간에 들어가기)는 위험한 행동이고, 10번에서 매우 위험하다고 이어짐. take a risk = 위험을 감수하다.","c":2,"ev":"9~10번 문장","s":[[9,"This makes people take bigger risks, such as entering animals’ space!","이것은 사람들이 동물들의 공간에 들어가는 것과 같은 더 큰 위험을 무릅쓰게 한다!"],[10,"It’s very dangerous because some people were actually attacked or killed by animals.","그것은 몇몇 사람들이 실제로 동물들에게 공격받았거나 죽임을 당했기 때문에 매우 위험하다."]]},"h":"9e48d7f45e"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nPeople could think that getting closer to them is ok.","ko":"밑줄 친 them이 가리키는 것은?","opts":["표지판들","동물원들","야생 동물들","셀피를 찍는 사람들"],"sko":"사람들은 그것들에게 더 가까이 가는 것이 괜찮다고 생각할 수 있다.","r":{"a":"3) 야생 동물들","w":"5번에서 동물원 같은 곳에서 야생 동물을 자주 봐서 동물들이 덜 위험해 보인다고 함. 6번 them은 그 동물들.","c":3,"ev":"5~6번 문장","s":[[5,"We often see wild animals in places like zoos, so the animals seem less real and dangerous.","우리는 동물원과 같은 장소에서 야생 동물들을 자주 봐서 동물들이 덜 현실적이고 덜 위험해 보인다."],[6,"People could think that getting closer to them is ok.","사람들은 그것들에게 더 가까이 가는 것이 괜찮다고 생각할 수 있다."]]},"h":"9df4103095"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A selfie is never more important than our lives or the lives of wild animals.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["셀피는 우리의 생명보다 더 중요할 때도 있다.","셀피는 야생 동물의 생명보다 항상 더 중요하다.","우리의 생명과 야생 동물의 생명은 셀피만큼 중요하지 않다.","셀피보다 우리의 생명이나 야생 동물의 생명이 더 중요하다."],"sko":"셀피는 우리의 생명이나 야생 동물들의 생명보다 절대 더 중요하지 않다.","r":{"a":"4) 셀피보다 우리의 생명이나 야생 동물의 생명이 더 중요하다.","w":"never more important than ~은 '~보다 절대 더 중요하지 않다'. 셀피는 생명보다 중요하지 않으니, 생명이 더 중요하다는 뜻.","c":4,"ev":"12~13번 문장","s":[[12,"So, never get too close to animals for selfies.","그러므로 절대로 셀피를 위해 동물들에게 너무 가까이 가지 마라."],[13,"A selfie is never more important than our lives or the lives of wild animals.","셀피는 우리의 생명이나 야생 동물들의 생명보다 절대 더 중요하지 않다."]]},"h":"ca3d2e9272"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["No one has ever been attacked by animals for a selfie.","Posting selfies with dangerous animals can get lots of Likes and comments.","Animals are never in danger when people get too close to them.","Most people follow the safety signs near wild animals."],"oko":["셀피 때문에 동물에게 공격받은 사람은 한 명도 없다.","위험한 동물과 찍은 셀피를 올리면 ‘좋아요’와 댓글을 많이 받을 수 있다.","사람들이 동물에게 너무 가까이 가도 동물은 전혀 위험하지 않다.","대부분의 사람들은 야생 동물 근처의 안전 표지판을 잘 따른다."],"r":{"a":"2) Posting selfies with dangerous animals can get lots of Likes and comments.","w":"8번 문장 Posting selfies with dangerous animals can get lots of Likes and comments와 같음. ①은 10번(공격받은 사람도 있음), ③은 11번(동물도 위험), ④는 2번(표지판이 자주 무시됨)과 다름.","c":2,"ev":"8번 문장","s":[[8,"Posting selfies with dangerous animals can get lots of Likes and comments.","위험한 동물들과의 셀피를 올리는 것은 ‘좋아요’와 댓글을 많이 받을 수 있다."]]},"h":"f90b49cc47"},{"n":9,"t":"sum","q":"Posting selfies with dangerous animals can get lots of (A), so people take bigger (B).","ko":"위험한 동물과의 셀피를 올리면 (A)을 많이 받을 수 있어서, 사람들은 더 큰 (B)을 무릅쓴다.","opts":["(A) signs / (B) risks","(A) Likes / (B) pictures","(A) Likes / (B) risks","(A) signs / (B) pictures","(A) fears / (B) risks"],"oko":["(A) 표지판 / (B) 위험","(A) ‘좋아요’ / (B) 사진","(A) ‘좋아요’ / (B) 위험","(A) 표지판 / (B) 사진","(A) 두려움 / (B) 위험"],"r":{"a":"3) (A) Likes / (B) risks","w":"8번 get lots of Likes and comments, 9번 This makes people take bigger risks. 좋아요(Likes)를 많이 받으면 더 큰 위험(risks)을 감수함.","c":3,"ev":"8~9번 문장","s":[[8,"Posting selfies with dangerous animals can get lots of Likes and comments.","위험한 동물들과의 셀피를 올리는 것은 ‘좋아요’와 댓글을 많이 받을 수 있다."],[9,"This makes people take bigger risks, such as entering animals’ space!","이것은 사람들이 동물들의 공간에 들어가는 것과 같은 더 큰 위험을 무릅쓰게 한다!"]]},"h":"3aa7c26b6e"},{"n":10,"t":"fill","q":"Getting too close to animals is [A] for people because some were attacked, and it also puts animals in [B].","ko":"동물들에게 너무 가까이 가는 것은 몇몇 사람들이 공격받았기 때문에 사람들에게 [A]하고, 동물들도 [B]에 빠뜨린다.","bko":{"dangerous":"위험한","danger":"위험","friendly":"친숙한","real":"현실적인","ignored":"무시된","important":"중요한"},"bank":["dangerous","danger","friendly","real","ignored","important"],"r":{"a":"[A] dangerous, [B] danger","w":"10번 It’s very dangerous because some people were actually attacked, 11번 puts them in danger에서 가져옴. 형용사 자리 [A]에는 dangerous, 명사 자리 [B]에는 danger.","c":null,"ev":"10~11번 문장","s":[[10,"It’s very dangerous because some people were actually attacked or killed by animals.","그것은 몇몇 사람들이 실제로 동물들에게 공격받았거나 죽임을 당했기 때문에 매우 위험하다."],[11,"Getting too close to animals also puts them in danger because they might be killed to protect people.","동물들에게 너무 가까이 가는 것은 사람을 보호하기 위해 동물들이 죽게 될지도 모르기 때문에 동물들도 위험에 빠뜨린다."]]},"h":"b54d9c3352"}]},{"u":2,"id":"rg3-02-3","no":3,"ko":"샤워할 때 아이디어가 떠오르는 이유는?","items":[{"n":1,"t":"tf","q":"Some of our best ideas can happen when we’re doing everyday things like taking a shower.","ko":"우리의 가장 좋은 아이디어 중 일부는 샤워하는 것과 같은 일상적인 일을 할 때 생길 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장 They can happen when we’re doing everyday things like taking a shower.와 같은 내용.","c":"T","ev":"4번 문장","s":[[4,"They can happen when we’re doing everyday things like taking a shower.","그것들은 우리가 샤워하는 것과 같은 일상적인 일들을 하고 있을 때 일어날 수 있다."]]},"h":"05af0d20a3"},{"n":2,"t":"tf","q":"Most of the time, the writers and scientists got their ideas while washing dishes.","ko":"대부분의 경우, 작가들과 과학자들은 설거지를 하는 동안 아이디어를 얻었다.","r":{"a":"F (본문과 다른 내용)","w":"7번에서 대부분은 직장(at work)에서 아이디어를 얻었고, 8번에서 설거지 같은 일을 할 때는 20%뿐이라고 함. 대부분이 설거지 중은 아님.","c":"F","ev":"7~8번 문장","s":[[7,"Most of the time, they got ideas at work.","대부분의 경우, 그들은 직장에서 아이디어를 얻었다."],[8,"But 20% of their best ideas came while they were doing something else like washing dishes!","그러나 그들의 가장 좋은 아이디어 중 20%는 그들이 설거지를 하는 것과 같이 또 다른 무언가를 하고 있는 동안 떠올랐다!"]]},"h":"4fb36e5809"},{"n":3,"t":"tf","q":"About 200 writers and scientists recorded their most creative ideas every day.","ko":"약 200명의 작가들과 과학자들은 그들의 가장 창의적인 아이디어를 매일 기록했다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장 about 200 writers and scientists recorded their most creative ideas every day와 같음.","c":"T","ev":"6번 문장","s":[[6,"In a study, about 200 writers and scientists recorded their most creative ideas every day.","한 연구에서, 약 200명의 작가들과 과학자들은 그들의 가장 창의적인 아이디어들을 매일 기록했다."]]},"h":"aecf4fc73c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then, your mind starts to wander, and you might start dreaming and wondering about all kinds of things.)","ko":"밑줄 친 단어의 뜻은? (그러면 당신의 생각은 wander하기 시작하고, 온갖 것들에 대해 꿈꾸고 궁금해하기 시작할지도 모른다.)","opts":["(생각이) 다른 데로 흐르다","멈추다","집중하다","사라지다"],"word":"wander","r":{"a":"1) (생각이) 다른 데로 흐르다","w":"10번에서 주의를 일부만 쓰므로 생각이 한곳에만 묶이지 않음. 11번 wander = 생각이 다른 곳으로 흐르다(떠돌다). 집중하는 것과 반대.","c":1,"ev":"10~11번 문장","s":[[10,"Those activities take some of your attention, but not all of it.","그 활동들은 전부는 아니지만, 당신의 주의 중 일부분을 끈다."],[11,"Then, your mind starts to wander, and you might start dreaming and wondering about all kinds of things.","그러면, 당신의 생각은 다른 곳으로 떠돌기 시작하고, 당신은 온갖 종류의 것들에 대해 꿈꾸고 궁금해하기 시작할지도 모른다."]]},"h":"d9a9813af6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In a study, about 200 writers and scientists recorded their most creative ideas every day.)","ko":"밑줄 친 단어의 뜻은? (한 연구에서, 약 200명의 작가들과 과학자들은 가장 창의적인 아이디어를 매일 recorded했다.)","opts":["잊었다","기록했다","팔았다","바꿨다"],"word":"recorded","r":{"a":"2) 기록했다","w":"6번에서 연구에 참여한 사람들이 아이디어를 매일 recorded했고, 7~8번에서 그 기록에서 아이디어를 언제 얻었는지 나옴. record = 기록하다.","c":2,"ev":"6~7번 문장","s":[[6,"In a study, about 200 writers and scientists recorded their most creative ideas every day.","한 연구에서, 약 200명의 작가들과 과학자들은 그들의 가장 창의적인 아이디어들을 매일 기록했다."],[7,"Most of the time, they got ideas at work.","대부분의 경우, 그들은 직장에서 아이디어를 얻었다."]]},"h":"57f187e551"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThose activities take some of your attention, but not all of it.","ko":"밑줄 친 it이 가리키는 것은?","opts":["당신의 마음","샤워 효과","창의적인 아이디어","당신의 주의"],"sko":"그 활동들은 전부는 아니지만, 당신의 주의 중 일부분을 끈다.","r":{"a":"4) 당신의 주의","w":"some of your attention, but not all of it에서 ‘주의의 일부는 쓰지만 전부는 아니다’라는 뜻. it = 앞에 나온 your attention(당신의 주의).","c":4,"ev":"10번 문장","s":[[10,"Those activities take some of your attention, but not all of it.","그 활동들은 전부는 아니지만, 당신의 주의 중 일부분을 끈다."]]},"h":"352485f285"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Some of our best ideas don’t just happen at work or school.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["우리의 가장 좋은 아이디어는 직장이나 학교에서만 생긴다.","우리의 가장 좋은 아이디어는 모두 직장이나 학교 밖에서만 생긴다.","우리의 가장 좋은 아이디어 중 일부는 직장이나 학교에서만 생기는 것이 아니다.","직장이나 학교에서는 좋은 아이디어가 전혀 생기지 않는다."],"sko":"우리의 몇몇 가장 좋은 아이디어들은 단지 직장이나 학교에서만 생기는 것이 아니다.","r":{"a":"3) 우리의 가장 좋은 아이디어 중 일부는 직장이나 학교에서만 생기는 것이 아니다.","w":"don’t just happen at work or school은 ‘직장이나 학교에서만 생기는 것은 아니다’. 4번에서 샤워 같은 일상적인 일을 할 때도 생긴다고 이어짐. 직장·학교에서 아예 안 생긴다는 뜻은 아님.","c":3,"ev":"3~4번 문장","s":[[3,"Some of our best ideas don’t just happen at work or school.","우리의 몇몇 가장 좋은 아이디어들은 단지 직장이나 학교에서만 생기는 것이 아니다."],[4,"They can happen when we’re doing everyday things like taking a shower.","그것들은 우리가 샤워하는 것과 같은 일상적인 일들을 하고 있을 때 일어날 수 있다."]]},"h":"bcff4b53a3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["The shower effect can happen only in the shower.","About 20% of the best ideas came while the people were doing something else.","Those activities take all of your attention.","The best ideas never come when we are doing everyday things."],"oko":["샤워 효과는 샤워장에서만 일어날 수 있다.","가장 좋은 아이디어의 약 20%는 사람들이 다른 일을 하는 동안 떠올랐다.","그 활동들은 당신의 주의를 전부 차지한다.","가장 좋은 아이디어는 일상적인 일을 할 때는 절대 떠오르지 않는다."],"r":{"a":"2) About 20% of the best ideas came while the people were doing something else.","w":"8번 20% of their best ideas came while they were doing something else와 같음. ①은 5번(샤워장 밖에서도), ③은 10번(전부는 아님), ④는 4번(일상적인 일 할 때 생김)과 다름.","c":2,"ev":"5번, 8번, 10번 문장","s":[[5,"Scientists call this the “shower effect,” and research shows that it can also occur outside the shower.","과학자들은 이것을 ‘샤워 효과’라고 부르고, 연구는 그것이 샤워장 밖에서도 발생할 수 있다는 것을 보여준다."],[8,"But 20% of their best ideas came while they were doing something else like washing dishes!","그러나 그들의 가장 좋은 아이디어 중 20%는 그들이 설거지를 하는 것과 같이 또 다른 무언가를 하고 있는 동안 떠올랐다!"],[10,"Those activities take some of your attention, but not all of it.","그 활동들은 전부는 아니지만, 당신의 주의 중 일부분을 끈다."]]},"h":"ceb9888906"},{"n":9,"t":"sum","q":"Everyday activities take (A) of your attention, so your mind (B) and you can come up with creative ideas.","ko":"일상적인 활동은 당신의 주의 중 (A)를 끌어서, 당신의 생각이 (B)하고 창의적인 아이디어를 생각해 낼 수 있다.","opts":["(A) all / (B) wanders","(A) all / (B) stops","(A) some / (B) stops","(A) none / (B) wanders","(A) some / (B) wanders"],"oko":["(A) 전부 / (B) 떠돈다","(A) 전부 / (B) 멈춘다","(A) 일부 / (B) 멈춘다","(A) 하나도 / (B) 떠돈다","(A) 일부 / (B) 떠돈다"],"r":{"a":"5) (A) some / (B) wanders","w":"10번 take some of your attention, 11번 your mind starts to wander, 12번 you can come up with creative ideas. all(전부)은 10번 but not all과 반대.","c":5,"ev":"10~12번 문장","s":[[10,"Those activities take some of your attention, but not all of it.","그 활동들은 전부는 아니지만, 당신의 주의 중 일부분을 끈다."],[11,"Then, your mind starts to wander, and you might start dreaming and wondering about all kinds of things.","그러면, 당신의 생각은 다른 곳으로 떠돌기 시작하고, 당신은 온갖 종류의 것들에 대해 꿈꾸고 궁금해하기 시작할지도 모른다."],[12,"This way, you can come up with creative ideas without trying!","이 방법으로, 당신은 노력하지 않고도 창의적인 아이디어들을 생각해 낼 수 있다!"]]},"h":"1cb43dbe12"},{"n":10,"t":"fill","q":"In a study, about 200 writers and scientists [A] their most creative ideas every day, and 20% of the best ideas came [B] they were doing something else.","ko":"한 연구에서 약 200명의 작가들과 과학자들은 가장 창의적인 아이디어를 매일 [A]했고, 가장 좋은 아이디어의 20%는 그들이 다른 일을 [B] 떠올랐다.","bko":{"recorded":"기록했다","while":"~하는 동안","wander":"떠돌다","wonder":"궁금해하다","attention":"주의","effect":"효과"},"bank":["recorded","while","wander","wonder","attention","effect"],"r":{"a":"[A] recorded, [B] while","w":"6번 recorded their most creative ideas every day, 8번 20% of their best ideas came while they were doing something else에서 가져옴. wander, wonder는 11번에 나온 동사, attention, effect는 명사라 빈칸에 맞지 않음.","c":null,"ev":"6번, 8번 문장","s":[[6,"In a study, about 200 writers and scientists recorded their most creative ideas every day.","한 연구에서, 약 200명의 작가들과 과학자들은 그들의 가장 창의적인 아이디어들을 매일 기록했다."],[8,"But 20% of their best ideas came while they were doing something else like washing dishes!","그러나 그들의 가장 좋은 아이디어 중 20%는 그들이 설거지를 하는 것과 같이 또 다른 무언가를 하고 있는 동안 떠올랐다!"]]},"h":"80c615bd69"}]},{"u":3,"id":"rg3-03-1","no":1,"ko":"불타는 폭포를 놓치지 마세요!","items":[{"n":1,"t":"tf","q":"The Sun’s glow can make the waterfall look like fire.","ko":"태양의 불빛은 폭포를 불처럼 보이게 만들 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장 the Sun’s glow turns the waterfall into something that looks like fire와 같은 내용.","c":"T","ev":"2번 문장","s":[[2,"During the Firefall, the Sun’s glow turns the waterfall into something that looks like fire.","Firefall 동안, 태양의 불빛은 폭포를 불처럼 보이는 것으로 바꿔요."]]},"h":"3cc302b668"},{"n":2,"t":"tf","q":"The burning orange glow lasts for several hours before sunset.","ko":"타오르는 주황색 불빛은 일몰 전 몇 시간 동안 지속된다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 only lasts for a few minutes(단지 몇 분 동안만 지속됨)라고 함. 몇 시간이 아님.","c":"F","ev":"4번 문장","s":[[4,"But, this burning orange glow only lasts for a few minutes before sunset.","그러나, 이 타오르는 주황색 불빛은 일몰 전 몇 분 동안만 지속돼요."]]},"h":"120ff4fabe"},{"n":3,"t":"tf","q":"You need to make a reservation for entrance to the park.","ko":"공원에 입장하려면 예약해야 한다.","r":{"a":"T (본문과 맞는 내용)","w":"13번 문장 Make a reservation for entrance to the park와 같은 내용.","c":"T","ev":"13번 문장","s":[[13,"Requirements: Make a reservation for entrance to the park.","필요조건: 공원 입장을 위해 예약하세요."]]},"h":"06c9755bcd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (During the Firefall, the Sun’s glow turns the waterfall into something that looks like fire.)","ko":"밑줄 친 단어의 뜻은? (Firefall 동안, 태양의 glow는 폭포를 불처럼 보이는 것으로 바꾼다.)","opts":["그림자","불빛","소리","연기"],"word":"glow","r":{"a":"2) 불빛","w":"2번에서 폭포가 불처럼 보인다고 하고, 3번에서 burning orange glow(타오르는 주황색 불빛)라고 이어짐. glow = 은은한 불빛.","c":2,"ev":"2~3번 문장","s":[[2,"During the Firefall, the Sun’s glow turns the waterfall into something that looks like fire.","Firefall 동안, 태양의 불빛은 폭포를 불처럼 보이는 것으로 바꿔요."],[3,"In February, the Horsetail Fall turns into this beautiful Firefall, creating a burning orange glow.","2월에, Horsetail 폭포는 타오르는 주황색 불빛을 만들어 내면서 이러한 아름다운 Firefall로 변해요."]]},"h":"982542703b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The weather should be warm enough to melt the snow.)","ko":"밑줄 친 단어의 뜻은? (날씨는 눈을 melt할 만큼 충분히 따뜻해야 한다.)","opts":["쌓다","치우다","녹이다","얼리다"],"word":"melt","r":{"a":"3) 녹이다","w":"7번에서 눈이 충분히 있어야 하고, 8번에서 날씨가 따뜻해야 한다고 함. 따뜻해야 눈에게 하는 일 = 녹이다. melt = 녹다, 녹이다.","c":3,"ev":"7~8번 문장","s":[[7,"Snowfall: There must be enough snow.","강설량: 충분한 눈이 있어야만 해요."],[8,"Temperature: The weather should be warm enough to melt the snow.","기온: 눈을 녹일 만큼 날씨가 충분히 따뜻해야 해요."]]},"h":"0c596e16ec"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nSo, you need to be in the right spot at the right time to fully enjoy this.","ko":"밑줄 친 this가 가리키는 것은?","opts":["요세미티 국립공원","일몰 시간","적절한 장소","Firefall(불꽃처럼 보이는 폭포)"],"sko":"그래서, 여러분은 이것을 완전히 즐기기 위해서는 적절한 시간, 적절한 장소에 있어야 해요.","r":{"a":"4) Firefall(불꽃처럼 보이는 폭포)","w":"3~4번에서 몇 분만 지속되는 Firefall을 설명하고, 5번에서 그것을 완전히 즐기려면 적절한 시간과 장소에 있어야 한다고 함. this = 그 Firefall.","c":4,"ev":"3~5번 문장","s":[[3,"In February, the Horsetail Fall turns into this beautiful Firefall, creating a burning orange glow.","2월에, Horsetail 폭포는 타오르는 주황색 불빛을 만들어 내면서 이러한 아름다운 Firefall로 변해요."],[4,"But, this burning orange glow only lasts for a few minutes before sunset.","그러나, 이 타오르는 주황색 불빛은 일몰 전 몇 분 동안만 지속돼요."],[5,"So, you need to be in the right spot at the right time to fully enjoy this.","그래서, 여러분은 이것을 완전히 즐기기 위해서는 적절한 시간, 적절한 장소에 있어야 해요."]]},"h":"bb42dfb550"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Temperature: The weather should be warm enough to melt the snow.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["날씨가 눈을 녹일 만큼 충분히 따뜻해야 한다.","날씨가 너무 따뜻해서 눈이 녹으면 안 된다.","날씨가 눈이 올 만큼 충분히 추워야 한다.","눈이 녹을 때까지 날씨가 따뜻해질 필요는 없다."],"sko":"기온: 눈을 녹일 만큼 날씨가 충분히 따뜻해야 해요.","r":{"a":"1) 날씨가 눈을 녹일 만큼 충분히 따뜻해야 한다.","w":"warm enough to melt the snow는 ‘눈을 녹일 만큼 충분히 따뜻한’. 7번에서 눈이 충분히 있어야 한다고 하고, 8번에서 그 눈이 녹을 만큼 따뜻해야 한다고 함.","c":1,"ev":"8번 문장","s":[[8,"Temperature: The weather should be warm enough to melt the snow.","기온: 눈을 녹일 만큼 날씨가 충분히 따뜻해야 해요."]]},"h":"42c80a255c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["The Firefall can be seen all through the year.","People can see the Firefall at any time of day.","You can see the Firefall in the last two weeks of February.","Clouds are necessary to see the Firefall."],"oko":["Firefall은 일 년 내내 볼 수 있다.","사람들은 하루 중 아무 때나 Firefall을 볼 수 있다.","2월의 마지막 2주 동안 Firefall을 볼 수 있다.","Firefall을 보려면 구름이 필요하다."],"r":{"a":"3) You can see the Firefall in the last two weeks of February.","w":"11번 During the last two weeks of February와 같음. ①은 3번(2월), ②는 12번(일몰 5~15분 전), ④는 9번(구름 한 점 없는 하늘)과 다름.","c":3,"ev":"11번 문장","s":[[11,"When: During the last two weeks of February.","언제: 2월 마지막 2주 동안."]]},"h":"c647607028"},{"n":9,"t":"sum","q":"To see the Firefall, you need (A) skies, and the Sun has to hit the waterfall at the right (B).","ko":"Firefall을 보려면 (A) 하늘이 필요하고, 태양이 폭포에 적절한 (B)로 비춰야 한다.","opts":["(A) cloudy / (B) angle","(A) clear / (B) angle","(A) clear / (B) temperature","(A) cloudy / (B) temperature","(A) dark / (B) angle"],"oko":["(A) 흐린 / (B) 각도","(A) 맑은 / (B) 각도","(A) 맑은 / (B) 기온","(A) 흐린 / (B) 기온","(A) 어두운 / (B) 각도"],"r":{"a":"2) (A) clear / (B) angle","w":"9번 Clear and cloudless skies are necessary, 10번 The Sun has to hit the waterfall at the right angle. cloudy는 9번과 반대.","c":2,"ev":"9~10번 문장","s":[[9,"Sky conditions: Clear and cloudless skies are necessary.","하늘 상태: 맑고 구름 한 점 없는 하늘이 필요해요."],[10,"Sun angle: The Sun has to hit the waterfall at the right angle.","태양의 각도: 태양이 폭포에 적절한 각도로 비춰야 해요."]]},"h":"3eb8e57b8f"},{"n":10,"t":"fill","q":"To see the Firefall, you need to visit Yosemite National Park in [A] and make a [B] to enter the park.","ko":"Firefall을 보려면 [A]에 요세미티 국립공원을 방문해야 하고 공원에 들어가기 위해 [B]을 해야 한다.","bko":{"February":"2월","reservation":"예약","sunset":"일몰","waterfall":"폭포","angle":"각도","temperature":"기온"},"bank":["February","reservation","sunset","waterfall","angle","temperature"],"r":{"a":"[A] February, [B] reservation","w":"3번 In February, the Horsetail Fall turns into this beautiful Firefall, 13번 Make a reservation for entrance to the park에서 가져옴. sunset(일몰), waterfall(폭포), angle(각도), temperature(기온)는 본문에 나오는 말이지만 이 두 빈칸에는 뜻이 맞지 않음.","c":null,"ev":"3번, 13번 문장","s":[[3,"In February, the Horsetail Fall turns into this beautiful Firefall, creating a burning orange glow.","2월에, Horsetail 폭포는 타오르 ngly, what happened next accidentally led to the invention of tea bags!)","ko":"밑줄 친 단어의 뜻은? (흥미롭게도, 다음에 일어난 일은 accidentally 티백의 발명으로 이어졌다!)","opts":["일부러","빠르게","우연히","천천히"],"word":"accidentally","r":{"a":"3) 우연히","w":"10번에서 Thomas는 찻잎을 꺼낼 것이라고 예상했지만 11번에서 고객들이 다르게 해서 티백이 생김. 계획과 다른 일이라 accidentally = 우연히.","c":3,"ev":"9~11번 문장","s":[[9,"Interestingly, what happened next accidentally led to the invention of tea bags!","흥미롭게도, 다음에 일어난 일은 우연히 티백의 발명으로 이어졌다!"],[10,"Thomas thought people would take the tea leaves out of the silk bags and make tea with an infuser.","Thomas는 사람들이 실크 주머니에서 찻잎을 꺼내서 인퓨저로 차를 만들 것이라고 생각했다."],[11,"But instead, some customers put the whole silk bag in boiling water.","그러나 대신에, 어떤 고객들은 실크 주머니 전체를 끓는 물에 넣었다."]]},"h":"17df41eb0b"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nThey found this more convenient, and the tea still tasted great.","ko":"밑줄 친 this가 가리키는 것은?","opts":["실크 주머니가 더 저렴한 것","양철통을 사용하는 것","차 샘플을 고객들에게 보내는 것","실크 주머니째 끓는 물에 넣는 것"],"sko":"그들은 이것이 더 편리하다는 것을 알게 되었고, 차는 여전히 맛이 아주 좋았다.","r":{"a":"4) 실크 주머니째 끓는 물에 넣는 것","w":"12번 this는 바로 앞 11번의 some customers put the whole silk bag in boiling water(주머니째 끓는 물에 넣는 것). 그것이 더 편리하다고 느낌.","c":4,"ev":"11~12번 문장","s":[[11,"But instead, some customers put the whole silk bag in boiling water.","그러나 대신에, 어떤 고객들은 실크 주머니 전체를 끓는 물에 넣었다."],[12,"They found this more convenient, and the tea still tasted great.","그들은 이것이 더 편리하다는 것을 알게 되었고, 차는 여전히 맛이 아주 좋았다."]]},"h":"8e206c0f56"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Thomas thought people would take the tea leaves out of the silk bags and make tea with an infuser.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["Thomas는 사람들이 실크 주머니를 통째로 끓는 물에 넣을 것이라고 생각했다.","Thomas는 사람들이 실크 주머니에서 찻잎을 꺼내 인퓨저로 차를 만들 것이라고 생각했다.","Thomas는 사람들이 인퓨저 없이는 차를 만들 수 없다고 생각했다.","Thomas는 사람들이 찻잎을 주머니에 넣어 팔 것이라고 생각했다."],"sko":"Thomas는 사람들이 실크 주머니에서 찻잎을 꺼내서 인퓨저로 차를 만들 것이라고 생각했다.","r":{"a":"2) Thomas는 사람들이 실크 주머니에서 찻잎을 꺼내 인퓨저로 차를 만들 것이라고 생각했다.","w":"take the tea leaves out of the silk bags는 ‘실크 주머니에서 찻잎을 꺼내다’. 11번 But instead와 대비되는 Thomas의 예상. 주머니째 넣는 것은 실제 고객이 한 일.","c":2,"ev":"10~11번 문장","s":[[10,"Thomas thought people would take the tea leaves out of the silk bags and make tea with an infuser.","Thomas는 사람들이 실크 주머니에서 찻잎을 꺼내서 인퓨저로 차를 만들 것이라고 생각했다."],[11,"But instead, some customers put the whole silk bag in boiling water.","그러나 대신에, 어떤 고객들은 실크 주머니 전체를 끓는 물에 넣었다."]]},"h":"387a4e56ac"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Thomas wanted to stop sending samples to his customers.","All of Thomas’s customers took the tea leaves out of the silk bags.","Thomas used silk bags because tins were too cheap.","Thomas sent tea samples in silk bags instead of tins."],"oko":["Thomas는 고객들에게 샘플 보내는 것을 그만두고 싶어 했다.","Thomas의 모든 고객은 실크 주머니에서 찻잎을 꺼냈다.","Thomas는 양철통이 너무 싸서 실크 주머니를 사용했다.","Thomas는 양철통 대신 실크 주머니에 차 샘플을 담아 보냈다."],"r":{"a":"4) Thomas sent tea samples in silk bags instead of tins.","w":"7번 he decided to use silk bags for tea samples, instead of tins와 같음. ①은 5번(실망시키고 싶지 않았음), ②는 11번(어떤 고객들은 주머니째), ③은 3번(양철통이 너무 비쌈)과 다름.","c":4,"ev":"7번 문장","s":[[7,"In 1908, he decided to use silk bags for tea samples, instead of tins.","1908년, 그는 차 샘플을 위해 양철통 대신 실크 주머니를 사용하기로 결심했다."]]},"h":"8083d5b72c"},{"n":9,"t":"sum","q":"Some customers put the (A) silk bag in boiling water because they found it more (B).","ko":"어떤 고객들은 그것이 더 (B)하다는 것을 알게 되어 실크 주머니를 (A) 끓는 물에 넣었다.","opts":["(A) whole / (B) expensive","(A) half / (B) convenient","(A) whole / (B) fancy","(A) empty / (B) convenient","(A) whole / (B) convenient"],"oko":["(A) 전체 / (B) 비싼","(A) 절반 / (B) 편리한","(A) 전체 / (B) 고급스러운","(A) 빈 / (B) 편리한","(A) 전체 / (B) 편리한"],"r":{"a":"5) (A) whole / (B) convenient","w":"11번 put the whole silk bag in boiling water, 12번 found this more convenient. whole(전체의), convenient(편리한). expensive, fancy는 8번이나 3번에 나온 말로 이유가 아님.","c":5,"ev":"11~12번 문장","s":[[11,"But instead, some customers put the whole silk bag in boiling water.","그러나 대신에, 어떤 고객들은 실크 주머니 전체를 끓는 물에 넣었다."],[12,"They found this more convenient, and the tea still tasted great.","그들은 이것이 더 편리하다는 것을 알게 되었고, 차는 여전히 맛이 아주 좋았다."]]},"h":"6bdc7dd8ee"},{"n":10,"t":"fill","q":"Thomas needed a [A] solution, so he decided to use [B] bags instead of tins.","ko":"Thomas는 [A] 해결책이 필요해서, 양철통 대신 [B] 주머니를 사용하기로 결심했다.","bko":{"cheaper":"더 값싼","silk":"실크, 비단","expensive":"비싼","whole":"전체의","boiling":"끓는","accidentally":"우연히"},"bank":["cheaper","silk","expensive","whole","boiling","accidentally"],"r":{"a":"[A] cheaper, [B] silk","w":"4번 He needed a cheaper solution, 7번 he decided to use silk bags for tea samples, instead of tins에서 가져옴. expensive는 3번에서 양철통이 비싸진 문제라 반대이고, whole(전체의), boiling(끓는), accidentally(우연히)는 11번과 9번에 나온 말로 이 빈칸의 뜻에 맞지 않음.","c":null,"ev":"4번, 7번 문장","s":[[4,"He needed a cheaper solution.","그는 비용이 더 적게 들어갈 해결책이 필요했다."],[7,"In 1908, he decided to use silk bags for tea samples, instead of tins.","1908년, 그는 차 샘플을 위해 양철통 대신 실크 주머니를 사용하기로 결심했다."]]},"h":"4805bcf99d"}]},{"u":3,"id":"rg3-03-3","no":3,"ko":"일주일에 신용카드 한 장을 먹는다고?","items":[{"n":1,"t":"tf","q":"Clothes we wear are the biggest source of microplastic pollution.","ko":"우리가 입는 옷은 미세플라스틱 오염의 가장 큰 원천이다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장 Clothes we wear are the biggest source와 같은 내용.","c":"T","ev":"4번 문장","s":[[4,"Clothes we wear are the biggest source, making up about 35% of the microplastic pollution.","우리가 입는 옷이 가장 큰 원천으로, 미세플라스틱 오염의 약 35퍼센트를 이루고 있다."]]},"h":"7b545c1f59"},{"n":2,"t":"tf","q":"Microplastics are found only in a few kinds of food.","ko":"미세플라스틱은 몇 가지 음식에서만 발견된다.","r":{"a":"F (본문과 다른 내용)","w":"3번 문장에서 found in almost everything we eat and drink(거의 모든 것에서 발견)라고 함. 몇 가지에서만이 아님.","c":"F","ev":"3번 문장","s":[[3,"Microplastics are found in almost everything we eat and drink.","미세플라스틱은 우리가 먹고 마시는 거의 모든 것에서 발견된다."]]},"h":"49fdab3c70"},{"n":3,"t":"tf","q":"Washing your clothes at a lower temperature can help reduce fibers.","ko":"더 낮은 온도에서 옷을 세탁하면 섬유를 줄이는 데 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"11번 문장 Wash your clothes at a lower temperature … to reduce fibers와 같은 내용.","c":"T","ev":"11번 문장","s":[[11,"Wash your clothes at a lower temperature and for a shorter time to reduce fibers.","섬유를 줄이기 위해 더 낮은 온도에서 더 짧은 시간 동안 당신의 옷을 세탁해라."]]},"h":"10a773af67"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When we make, wash, wear, or dry clothes, they release little fibers that can travel very far.)","ko":"밑줄 친 단어의 뜻은? (우리가 옷을 만들거나 세탁하거나 입거나 말릴 때, 그것들은 매우 멀리 이동할 수 있는 작은 섬유를 release한다.)","opts":["방출하다","보관하다","씻다","줄이다"],"word":"release","r":{"a":"1) 방출하다","w":"5번에서 옷이 작은 섬유를 내보내고, 그 섬유가 멀리 이동한다고 함. release = 방출하다, 내뿜다. 줄이다(reduce)는 11번 조언에 나오는 말.","c":1,"ev":"5번 문장","s":[[5,"When we make, wash, wear, or dry clothes, they release little fibers that can travel very far.","우리가 옷을 만들거나, 세탁하거나, 입거나, 또는 말릴 때, 그것들은 매우 멀리 이동할 수 있는 작은 섬유를 방출한다."]]},"h":"0379e75239"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They can even make people have trouble breathing and damage their lungs.)","ko":"밑줄 친 단어의 뜻은? (그것들은 심지어 사람들이 숨 쉬는 데 어려움을 겪게 하고 폐를 damage할 수 있다.)","opts":["치료하다","손상시키다","강하게 하다","깨끗이 하다"],"word":"damage","r":{"a":"2) 손상시키다","w":"6번 even(심지어)으로 더 나쁜 영향을 말하고, have trouble breathing(숨 쉬는 데 어려움)과 함께 나옴. damage = 손상을 주다.","c":2,"ev":"6번 문장","s":[[6,"They can even make people have trouble breathing and damage their lungs.","그것들은 심지어 사람들이 숨 쉬는 데 어려움을 겪게 하고 폐를 손상시킬 수 있다."]]},"h":"96d66c41fb"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey can even make people have trouble breathing and damage their lungs.","ko":"밑줄 친 They가 가리키는 것은?","opts":["신용카드 크기의 플라스틱","친환경 재료들","옷에서 나오는 작은 섬유들","신선한 공기"],"sko":"그것들은 심지어 사람들이 숨 쉬는 데 어려움을 겪게 하고 폐를 손상시킬 수 있다.","r":{"a":"3) 옷에서 나오는 작은 섬유들","w":"5번에서 옷이 little fibers를 방출한다고 했고, 6번 They는 그 작은 섬유들. 그 섬유가 숨 쉬기 어렵게 하고 폐를 손상시킴.","c":3,"ev":"5~6번 문장","s":[[5,"When we make, wash, wear, or dry clothes, they release little fibers that can travel very far.","우리가 옷을 만들거나, 세탁하거나, 입거나, 또는 말릴 때, 그것들은 매우 멀리 이동할 수 있는 작은 섬유를 방출한다."],[6,"They can even make people have trouble breathing and damage their lungs.","그것들은 심지어 사람들이 숨 쉬는 데 어려움을 겪게 하고 폐를 손상시킬 수 있다."]]},"h":"762ad1d5a5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you do these things, you can keep some microplastics away from yourself.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["이것들을 하면 모든 미세플라스틱을 완전히 없앨 수 있다.","이것들을 해도 미세플라스틱을 피할 수 없다.","이것들을 하면 미세플라스틱이 더 늘어난다.","이것들을 하면 일부 미세플라스틱으로부터 스스로를 멀리할 수 있다."],"sko":"만약 당신이 이것들을 한다면, 스스로를 일부 미세플라스틱으로부터 멀리할 수 있다.","r":{"a":"4) 이것들을 하면 일부 미세플라스틱으로부터 스스로를 멀리할 수 있다.","w":"these things는 9~11번의 조언. keep some microplastics away는 ‘일부 미세플라스틱을 멀리하다’. 모두 없앤다는 뜻은 아님(some).","c":4,"ev":"9~12번 문장","s":[[9,"Choose clothes and items made from eco-friendly materials.","친환경적인 재료들로 만든 옷과 물건들을 골라라."],[10,"Clean your home often and let fresh air in to remove plastic fibers.","당신의 집을 자주 청소하고 플라스틱 섬유들을 제거하기 위해 신선한 공기를 안으로 들여라."],[11,"Wash your clothes at a lower temperature and for a shorter time to reduce fibers.","섬유를 줄이기 위해 더 낮은 온도에서 더 짧은 시간 동안 당신의 옷을 세탁해라."],[12,"If you do these things, you can keep some microplastics away from yourself.","만약 당신이 이것들을 한다면, 스스로를 일부 미세플라스틱으로부터 멀리할 수 있다."]]},"h":"a1fc4576b2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Microplastics are very large pieces of plastic.","We eat microplastics about the size of a plastic card in a week.","Wearing clothes does not release any fibers.","Washing your clothes at a higher temperature reduces fibers."],"oko":["미세플라스틱은 아주 큰 플라스틱 조각이다.","우리는 일주일에 신용카드 한 장 크기만큼의 미세플라스틱을 먹는다.","옷을 입는 것은 섬유를 전혀 방출하지 않는다.","더 높은 온도에서 옷을 세탁하면 섬유가 줄어든다."],"r":{"a":"2) We eat microplastics about the size of a plastic card in a week.","w":"2번 the microplastics we eat in a week add up to about the size of a plastic card와 같음. ①은 1번(아주 작은 조각), ③은 5번(입을 때도 방출), ④는 11번(낮은 온도)과 다름.","c":2,"ev":"1~2번, 5번, 11번 문장","s":[[1,"Microplastics are very small pieces of plastic from larger plastics that break down over time.","미세플라스틱은 시간이 지나면서 분해되는 더 큰 플라스틱에서 나온 아주 작은 플라스틱 조각이다."],[2,"Surprisingly, the microplastics we eat in a week add up to about the size of a plastic card!","놀랍게도, 우리가 일주일에 섭취하는 미세플라스틱의 양은 대략 신용카드 하나 정도의 크기가 된다!"],[5,"When we make, wash, wear, or dry clothes, they release little fibers that can travel very far.","우리가 옷을 만들거나, 세탁하거나, 입거나, 또는 말릴 때, 그것들은 매우 멀리 이동할 수 있는 작은 섬유를 방출한다."],[11,"Wash your clothes at a lower temperature and for a shorter time to reduce fibers.","섬유를 줄이기 위해 더 낮은 온도에서 더 짧은 시간 동안 당신의 옷을 세탁해라."]]},"h":"76c9f8f175"},{"n":9,"t":"sum","q":"To stay safe from microplastics, choose (A) materials, clean your home often, and wash your clothes at a (B) temperature.","ko":"미세플라스틱으로부터 안전하려면 (A) 재료를 고르고, 집을 자주 청소하고, 옷을 (B) 온도에서 세탁하라.","opts":["(A) harmful / (B) higher","(A) harmful / (B) lower","(A) expensive / (B) higher","(A) eco-friendly / (B) higher","(A) eco-friendly / (B) lower"],"oko":["(A) 해로운 / (B) 더 높은","(A) 해로운 / (B) 더 낮은","(A) 비싼 / (B) 더 높은","(A) 친환경적인 / (B) 더 높은","(A) 친환경적인 / (B) 더 낮은"],"r":{"a":"5) (A) eco-friendly / (B) lower","w":"9번 eco-friendly materials(친환경적인 재료), 11번 at a lower temperature(더 낮은 온도). harmful(해로운)이나 higher(더 높은)는 반대.","c":5,"ev":"9~11번 문장","s":[[9,"Choose clothes and items made from eco-friendly materials.","친환경적인 재료들로 만든 옷과 물건들을 골라라."],[10,"Clean your home often and let fresh air in to remove plastic fibers.","당신의 집을 자주 청소하고 플라스틱 섬유들을 제거하기 위해 신선한 공기를 안으로 들여라."],[11,"Wash your clothes at a lower temperature and for a shorter time to reduce fibers.","섬유를 줄이기 위해 더 낮은 온도에서 더 짧은 시간 동안 당신의 옷을 세탁해라."]]},"h":"2e7ad80730"},{"n":10,"t":"fill","q":"When we wash or wear clothes, they release little [A] that can [B] very far.","ko":"우리가 옷을 세탁하거나 입을 때, 그것들은 매우 멀리 [B]할 수 있는 작은 [A]를 방출한다.","bko":{"fibers":"섬유","travel":"이동하다","temperature":"기온","source":"원천","lungs":"폐","tips":"조언"},"bank":["fibers","travel","temperature","source","lungs","tips"],"r":{"a":"[A] fibers, [B] travel","w":"5번 they release little fibers that can travel very far에서 가져옴. temperature, source, lungs, tips는 11번, 4번, 6번, 8번에 나온 말이지만 이 문장 빈칸에는 뜻이 맞지 않음.","c":null,"ev":"5번 문장","s":[[5,"When we make, wash, wear, or dry clothes, they release little fibers that can travel very far.","우리가 옷을 만들거나, 세탁하거나, 입거나, 또는 말릴 때, 그것들은 매우 멀리 이동할 수 있는 작은 섬유를 방출한다."]]},"h":"a761d0645a"}]},{"u":4,"id":"rg3-04-1","no":1,"ko":"빙하 위를 떼 지어 달리는 ‘쥐’의 정체는?","items":[{"n":1,"t":"tf","q":"The moss balls on glaciers move because of the sun.","ko":"빙하 위의 이끼 공들은 태양 때문에 움직인다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"They wanted to know what makes them move, and it turns out that they move because of the sun.","그들은 무엇이 그것들을 움직이게 만드는지 알고 싶었고, 태양 때문에 그것들이 움직이는 것으로 밝혀졌어요."]],"w":"5번 문장에 they move because of the sun이 있음. 태양 때문에 움직인다는 내용과 일치.","c":"T"},"h":"1341e61cec"},{"n":2,"t":"tf","q":"Glacier mice are real mice that live on glaciers in Iceland and Alaska.","ko":"빙하 쥐는 아이슬란드와 알래스카의 빙하에 사는 진짜 쥐이다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"They are not real mice, but rather small balls of moss that grow on glaciers.","그것들은 진짜 쥐가 아니라 오히려 빙하에서 자라는 작은 이끼 공들이에요."]],"w":"2번 문장에서 They are not real mice라고 함. 빙하 쥐는 진짜 쥐가 아니라 작은 이끼 공이므로 틀린 진술.","c":"F"},"h":"dbf8333bc2"},{"n":3,"t":"tf","q":"In summer, the moss balls move about 2.5 meters per day.","ko":"여름에 이끼 공들은 하루에 약 2.5미터씩 움직인다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"In summer, when the sun melts the glacier around them, they move about 2.5 centimeters per day.","여름에, 태양이 그것들 주변의 빙하를 녹일 때, 그것들은 하루에 약 2.5센티미터씩 움직여요."]],"w":"6번 문장에서 하루에 움직이는 거리는 about 2.5 centimeters(약 2.5센티미터)임. meters(미터)가 아니라 centimeters.","c":"F"},"h":"eaac89c006"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists also found that the moss balls can survive on glaciers for six years or more.)","ko":"과학자들은 이끼 공들이 빙하 위에서 6년 또는 그 이상 ( ) 있다는 것도 알아냈다.","opts":["사라지다","살아남다","움직이다","변하다"],"word":"survive","r":{"a":"2) 살아남다","ev":"7번 문장","s":[[7,"Scientists also found that the moss balls can survive on glaciers for six years or more.","과학자들은 이끼 공들이 빙하 위에서 6년 또는 그 이상 살아남을 수 있다는 것도 알아냈어요."]],"w":"7번에서 이끼 공이 빙하 위에서 6년 또는 그 이상(six years or more) 지낼 수 있다고 함. 그래서 survive는 살아남다. 움직이다는 move의 뜻이라 다름.","c":2},"h":"1bd7e46a12"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But the researchers noticed something strange about the movement.)","ko":"그러나 연구원들은 그 움직임에 대해 무언가 ( ) 것을 알아차렸다.","opts":["분명한","빠른","이상한","차가운"],"word":"strange","r":{"a":"3) 이상한","ev":"8~9번 문장","s":[[8,"But the researchers noticed something strange about the movement.","그러나 연구원들은 그 움직임에 대해 무언가 이상한 것을 알아차렸어요."],[9,"The moss balls moved together, and even changed direction together, like a herd of animals!","그 이끼 공들은 함께 움직였고, 심지어 동물 떼처럼 방향도 함께 바꿨어요!"]],"w":"8번의 something strange는 ‘무언가 이상한 것’이고, 바로 다음 9번에서 이끼 공들이 떼처럼 함께 움직인다는 이상한 점이 나옴. clear(분명한)는 10번에 나오는 다른 단어.","c":3},"h":"dab83dce9b"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey wanted to know what makes them move, and it turns out that they move because of the sun.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그들은 무엇이 그것들을 움직이게 만드는지 알고 싶었고, 태양 때문에 그것들이 움직이는 것으로 밝혀졌어요.","opts":["이끼 공들","과학자들","태양","빙하"],"r":{"a":"1) 이끼 공들","ev":"4~5번 문장","s":[[4,"Scientists were surprised to learn that the moss balls move across the ice.","과학자들은 이끼 공들이 얼음을 가로질러 움직인다는 것을 알게 되어 놀랐어요."],[5,"They wanted to know what makes them move, and it turns out that they move because of the sun.","그들은 무엇이 그것들을 움직이게 만드는지 알고 싶었고, 태양 때문에 그것들이 움직이는 것으로 밝혀졌어요."]],"w":"4번에서 놀란 과학자들이 알게 된 것은 the moss balls가 얼음을 가로질러 움직인다는 것. 5번의 what makes them move는 ‘무엇이 이끼 공들을 움직이게 만드는지’. 과학자들은 They(알고 싶어 한 사람)라서 them이 될 수 없음.","c":1},"h":"704837105b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Scientists are still trying to find out why they move this way, but haven’t found a clear answer yet.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"과학자들은 왜 그것들이 이 방식으
