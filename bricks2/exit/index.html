<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>브릭스 중학독해 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"b2-01-1","no":1,"ko":"다리 둘 달린 당근, 먹어도 될까?","items":[{"n":1,"t":"tf","q":"Many people think ugly vegetables are not fresh or tasty because of how they look.","ko":"많은 사람들은 못난이 채소가 생김새 때문에 신선하지 않거나 맛이 없다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Many people think they’re not fresh or tasty because of how they look.","많은 사람들은 생김새 때문에 그것들이 신선하지 않거나 맛이 없다고 생각한다."]],"w":"4번 문장에 Many people think they’re not fresh or tasty because of how they look가 그대로 나옴. 생김새 때문에 맛없다고 생각한다는 내용과 일치.","c":"T"},"h":"5d9177bdac"},{"n":2,"t":"tf","q":"Rotting vegetables help stop climate change.","ko":"썩는 채소는 기후 변화를 막는 데 도움이 된다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"When vegetables rot, they release a greenhouse gas that causes climate change.","채소가 썩을 때, 그것들은 기후 변화를 일으키는 온실가스를 내뿜는다."]],"w":"8번 문장에서 채소가 썩을 때 기후 변화를 일으키는 온실가스를 내뿜는다고 함. 막는 게 아니라 일으키므로 반대 내용.","c":"F"},"h":"599160c3a3"},{"n":3,"t":"tf","q":"Online stores want people to learn that appearance does not change taste or nutrients.","ko":"온라인 상점은 사람들이 겉모습이 맛이나 영양소를 바꾸지 않는다는 것을 알기를 원한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"They want people to try them and see that appearance doesn’t affect taste or nutrients.","그들은 사람들이 그것들을 먹어 보고 겉모습이 맛이나 영양소에 영향을 주지 않는다는 것을 알기를 원한다."]],"w":"10번 문장에서 They want people to try them and see that appearance doesn’t affect taste or nutrients라고 함. 같은 뜻이라 맞는 내용.","c":"T"},"h":"e3e60e871e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When vegetables rot, they release a greenhouse gas that causes climate change.)","ko":"(채소가 썩을 때, 그것들은 기후 변화를 일으키는 온실가스를 ( ).)","opts":["흡수하다","내뿜다","모으다","판매하다"],"word":"release","r":{"a":"2) 내뿜다","ev":"8번 문장","s":[[8,"When vegetables rot, they release a greenhouse gas that causes climate change.","채소가 썩을 때, 그것들은 기후 변화를 일으키는 온실가스를 내뿜는다."]],"w":"8번에서 썩은 채소가 온실가스를 어떻게 한다는 말인지 보면, 기후 변화를 ‘일으키는’ 가스가 밖으로 나오는 것임. release = 내뿜다, 방출하다. 흡수하다는 반대 방향.","c":2},"h":"387d256314"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So stores refuse to sell them, and tons of food go to waste.)","ko":"(그래서 가게들은 그것들을 팔기를 ( )하고, 엄청난 양의 음식이 버려진다.)","opts":["허락하다","서두르다","부탁하다","거부하다"],"word":"refuse","r":{"a":"4) 거부하다","ev":"5번 문장","s":[[5,"So stores refuse to sell them, and tons of food go to waste.","그래서 가게들은 그것들을 팔기를 거부하고, 엄청난 양의 음식이 버려진다."]],"w":"5번에서 가게들이 못난이 채소를 팔지 않아서 음식이 버려짐. refuse to sell = 팔기를 거부하다. 허락하다는 뜻이 반대라 팔았다면 음식이 버려지지 않음.","c":4},"h":"a131eec878"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSo, next time you see a strange vegetable, give it a try.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그러니 다음에 이상하게 생긴 채소를 보면, 한번 먹어 보라.","opts":["이상하게 생긴 채소","다음번","가게","환경"],"r":{"a":"1) 이상하게 생긴 채소","ev":"12번 문장","s":[[12,"So, next time you see a strange vegetable, give it a try.","그러니 다음에 이상하게 생긴 채소를 보면, 한번 먹어 보라."]],"w":"12번 문장에서 “a strange vegetable”을 보면 한번 먹어 보라(give it a try)고 함. 여기서 it은 앞에 나온 이상하게 생긴 채소를 가리킴.","c":1,"k":"it = 이상하게 생긴 채소"},"pron":"it","h":"6f9904a8be"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This means farmers lose time, money, and valuable crops.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 농부들이 시간, 돈, 그리고 소중한 농작물을 잃는다는 뜻이다.","opts":["농부들이 농작물을 더 많이 얻게 된다는 뜻이다.","가게들이 시간과 돈을 잃게 된다는 뜻이다.","농부들이 시간, 돈, 그리고 소중한 농작물을 잃게 된다는 뜻이다.","농작물이 더 빨리 자라게 된다는 뜻이다."],"r":{"a":"3) 농부들이 시간, 돈, 그리고 소중한 농작물을 잃게 된다는 뜻이다.","ev":"6번 문장","s":[[6,"This means farmers lose time, money, and valuable crops.","이것은 농부들이 시간, 돈, 그리고 소중한 농작물을 잃는다는 뜻이다."]],"w":"This means는 5번의 가게들이 팔기를 거부한 결과를 받음. 잃는 사람은 가게가 아니라 farmers(농부들)이고, lose는 ‘잃다’라서 ‘더 얻는다’는 반대 뜻.","c":3},"h":"b303e966e2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["못난이 채소는 다른 채소보다 맛이 없다.","일부 온라인 상점은 못난이 채소를 더 높은 가격에 판다.","썩은 채소는 환경을 보호하는 데 도움이 된다.","일부 온라인 상점은 이제 못난이 채소를 더 낮은 가격에 판다."],"opts":["Ugly vegetables taste worse than other vegetables.","Some online stores sell ugly vegetables at higher prices.","Rotting vegetables help protect the environment.","Some online stores now sell ugly vegetables at lower prices."],"r":{"a":"4) Some online stores now sell ugly vegetables at lower prices. (일부 온라인 상점은 이제 못난이 채소를 더 낮은 가격에 판다.)","ev":"9번 문장","s":[[9,"To fix these problems, some online stores now sell ugly vegetables at lower prices.","이런 문제들을 해결하기 위해, 일부 온라인 상점은 이제 못난이 채소를 더 낮은 가격에 판다."]],"w":"9번 문장에서 일부 온라인 상점이 이제 못난이 채소를 lower prices(더 낮은 가격)에 판다고 함. ②는 가격이 반대(높은 가격), ①은 맛이 없다는 근거가 없고, ③은 썩은 채소가 환경에 도움이 된다는 근거가 없음.","c":4},"h":"f852c9e798"},{"n":9,"t":"sum","q":"People can help farmers and the environment by (A) ugly vegetables, and they can also (B) money.","ko":"사람들은 못난이 채소를 (A) 농부와 환경을 도울 수 있고, 돈도 (B) 수 있다.","oko":["(A) 사서 / (B) 아낄","(A) 사서 / (B) 잃을","(A) 버려서 / (B) 아낄","(A) 숨겨서 / (B) 잃을","(A) 버려서 / (B) 잃을"],"opts":["(A) buying / (B) save","(A) buying / (B) lose","(A) throwing away / (B) save","(A) hiding / (B) lose","(A) throwing away / (B) lose"],"r":{"a":"1) (A) buying / (B) save ((A) 사서 / (B) 아낄)","ev":"11번 문장","s":[[11,"By buying these vegetables, people can support farmers, save money, and help the environment.","이런 채소들을 사면, 사람들은 농부들을 돕고, 돈을 아끼고, 환경을 도울 수 있다."]],"w":"11번에서 By buying these vegetables, people can support farmers, save money, and help the environment라고 함. 채소를 사면(buying) 돈을 아낀다(save). 버리거나(throwing away) 숨기는 것은 농부를 돕는 길이 아님.","c":1},"h":"ee631172a4"},{"n":10,"t":"fill","q":"Have you ever seen a carrot with two [A]? Or a pumpkin covered in big [B]?","ko":"당근에 [A]이(가) 두 개 달린 것을 본 적이 있는가? 아니면 커다란 [B](으)로 뒤덮인 호박은?","bko":{"legs":"다리","warts":"사마귀 같은 혹","farmers":"농부들","prices":"가격","climate":"기후","stores":"가게들"},"bank":["legs","warts","farmers","prices","climate","stores"],"r":{"a":"[A] legs (다리), [B] warts (사마귀 같은 혹)","ev":"1~2번 문장","s":[[1,"Have you ever seen a carrot with two legs?","당근에 다리가 두 개 달린 것을 본 적이 있는가?"],[2,"Or a pumpkin covered in big warts?","아니면 커다란 사마귀 같은 혹으로 뒤덮인 호박은?"]],"w":"1번 문장은 a carrot with two legs(다리가 두 개 달린 당근), 2번 문장은 a pumpkin covered in big warts(커다란 혹으로 뒤덮인 호박). 두 칸을 바꾸면 말이 안 됨.","c":null},"h":"871d898802"}]},{"u":1,"id":"b2-01-2","no":2,"ko":"우유가 치즈로 변한 놀라운 사건","items":[{"n":1,"t":"tf","q":"Everyone knows exactly where cheese first came from.","ko":"모든 사람이 치즈가 처음에 어디에서 왔는지 정확히 안다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Cheese is a food enjoyed worldwide, but no one knows exactly where it first came from.","치즈는 전 세계에서 즐기는 음식이지만, 그것이 처음에 정확히 어디에서 왔는지는 아무도 모른다."]],"w":"1번 문장에서 no one knows exactly where it first came from(아무도 정확히 모른다)이라고 함. 모두가 안다는 말은 반대.","c":"F"},"h":"2471599436"},{"n":2,"t":"tf","q":"According to one story, early nomads found cheese by accident.","ko":"한 이야기에 따르면, 초기 유목민들은 우연히 치즈를 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"One story says that early nomads discovered it by accident.","한 이야기에 따르면 초기 유목민들이 우연히 그것을 발견했다."]],"w":"2번 문장에 One story says that early nomads discovered it by accident가 나옴. found는 discovered와 같은 뜻이라 맞는 내용.","c":"T"},"h":"4eade3c998"},{"n":3,"t":"tf","q":"The heat from the sun probably made the process happen faster.","ko":"태양의 열이 아마 그 과정을 더 빠르게 만들었을 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"And the heat from the sun probably made this process happen faster.","그리고 태양의 열이 아마 이 과정을 더 빠르게 만들었을 것이다."]],"w":"9번 문장에 the heat from the sun probably made this process happen faster가 나옴. 같은 내용이라 맞음.","c":"T"},"h":"7fa9222aaa"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The milk was no longer liquid, but thick and soft lumps.)","ko":"(우유는 더 이상 액체가 아니라, 걸쭉하고 부드러운 ( )가 되어 있었다.)","opts":["덩어리","거품","가루","얼음"],"word":"lumps","r":{"a":"1) 덩어리","ev":"5번 문장","s":[[5,"The milk was no longer liquid, but thick and soft lumps.","우유는 더 이상 액체가 아니라, 걸쭉하고 부드러운 덩어리가 되어 있었다."]],"w":"5번에서 우유가 액체가 아니라 thick and soft(걸쭉하고 부드러운) 무엇이 되었다는 말임. lumps = 덩어리. 가루나 거품은 걸쭉하고 부드럽다는 설명과 맞지 않음.","c":1},"h":"e50d305164"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The nomads found that the cheese tasted good and lasted longer than milk.)","ko":"(유목민들은 치즈가 맛이 좋고 우유보다 ( )는 것을 알게 되었다.)","opts":["더 빨리 상하다","더 달다","더 오래가다","더 무겁다"],"word":"lasted","r":{"a":"3) 더 오래가다","ev":"10번 문장","s":[[10,"The nomads found that the cheese tasted good and lasted longer than milk.","유목민들은 치즈가 맛이 좋고 우유보다 더 오래간다는 것을 알게 되었다."]],"w":"10번은 치즈의 좋은 점을 말하는 문장임. tasted good(맛이 좋았다)과 이어져 lasted longer than milk는 우유보다 더 오래갔다(오래 보관됐다)는 뜻. 더 빨리 상했다는 좋은 점이 아님.","c":3},"h":"b5b2685b1e"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt had turned into cheese!","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 치즈로 변해 있었다!","opts":["동물의 위","우유","유목민들","태양열"],"r":{"a":"2) 우유","ev":"5번, 6번 문장","s":[[5,"The milk was no longer liquid, but thick and soft lumps.","우유는 더 이상 액체가 아니라, 걸쭉하고 부드러운 덩어리가 되어 있었다."],[6,"It had turned into cheese!","그것은 치즈로 변해 있었다!"]],"w":"바로 앞 5번에서 The milk가 더 이상 액체가 아니라 걸쭉한 덩어리가 되었다고 함. 6번의 It은 그 우유가 치즈로 변했다는 뜻.","c":2},"h":"5ef3e81388"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Most likely, the milk changed due to a natural enzyme in the animal stomachs.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아마도 우유는 동물의 위에 들어 있는 천연 효소 때문에 변했을 것이다.","opts":["우유가 변한 이유는 전혀 알 수 없다.","유목민들이 우유에 효소를 일부러 넣었다.","우유가 햇볕 때문에만 변했을 것이다.","동물의 위 속 천연 효소가 우유를 변하게 했을 가능성이 크다."],"r":{"a":"4) 동물의 위 속 천연 효소가 우유를 변하게 했을 가능성이 크다.","ev":"8번 문장","s":[[8,"Most likely, the milk changed due to a natural enzyme in the animal stomachs.","아마도 우유는 동물의 위에 들어 있는 천연 효소 때문에 변했을 것이다."]],"w":"Most likely는 ‘아마도, 가능성이 가장 크다’는 뜻이고 due to는 ‘~ 때문에’. 효소는 동물의 위에 원래 들어 있는 것(natural)이라 유목민들이 넣은 게 아님. 햇볕은 9번에서 과정을 더 빠르게 한 두 번째 이유임.","c":4},"h":"267a04ddd9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["유목민들은 이미 치즈를 만드는 방법을 알고 있었다.","우유는 추운 날씨 때문에 치즈로 변했다.","초기 유목민들은 동물의 위로 만든 자루에 우유를 담아 다녔다.","치즈는 우유보다 더 빨리 상했다."],"opts":["The nomads already knew how to make cheese.","The milk turned into cheese because of the cold weather.","Early nomads carried milk in bags made from animal stomachs.","Cheese went bad faster than milk."],"r":{"a":"3) Early nomads carried milk in bags made from animal stomachs. (초기 유목민들은 동물의 위로 만든 자루에 우유를 담아 다녔다.)","ev":"3번 문장","s":[[3,"While they traveled under the hot sun, they carried milk in bags made from animal stomachs.","그들은 뜨거운 태양 아래를 이동하는 동안, 동물의 위로 만든 자루에 우유를 담아 가지고 다녔다."]],"w":"3번 문장에서 유목민들이 동물의 위로 만든 자루에 우유를 담아 다녔다고 함. ①은 우연히 발견했다는 내용과 반대, ②는 뜨거운 태양 아래라고 했으므로 틀림, ④는 치즈가 우유보다 더 오래간다고 했으므로 반대.","c":3},"h":"a429bd5f7a"},{"n":9,"t":"sum","q":"After a long (A), the nomads opened their bags and found something (B).","ko":"긴 (A) 끝에, 유목민들은 자루를 열어 (B) 것을 발견했다.","oko":["(A) 여행 / (B) 놀라운","(A) 여행 / (B) 지루한","(A) 휴식 / (B) 놀라운","(A) 휴식 / (B) 지루한","(A) 식사 / (B) 위험한"],"opts":["(A) journey / (B) surprising","(A) journey / (B) boring","(A) rest / (B) surprising","(A) rest / (B) boring","(A) meal / (B) dangerous"],"r":{"a":"1) (A) journey / (B) surprising ((A) 여행 / (B) 놀라운)","ev":"4번 문장","s":[[4,"After a long journey, the nomads opened the bags and found something surprising.","긴 여행 끝에, 유목민들은 자루를 열어 놀라운 것을 발견했다."]],"w":"4번 문장에서 After a long journey, the nomads opened the bags and found something surprising이라고 함. 긴 여행(journey) 끝에 놀라운(surprising) 것을 발견함.","c":1},"h":"743de1fe4e"},{"n":10,"t":"fill","q":"Soon, people everywhere began making cheese on [A]. This lucky [B] gave us one of our favorite foods.","ko":"곧, 사람들은 어디서나 [A] 치즈를 만들기 시작했다. 이 운 좋은 [B]이(가) 우리에게 가장 좋아하는 음식 중 하나를 주었다.","bko":{"purpose":"목적 (on purpose는 일부러)","discovery":"발견","lumps":"덩어리들","stomachs":"위들","nomads":"유목민들","liquid":"액체"},"bank":["purpose","discovery","lumps","stomachs","nomads","liquid"],"r":{"a":"[A] purpose (목적 (on purpose는 일부러)), [B] discovery (발견)","ev":"11~12번 문장","s":[[11,"Soon, people everywhere began making cheese on purpose.","곧, 사람들은 어디서나 일부러 치즈를 만들기 시작했다."],[12,"This lucky discovery gave us one of our favorite foods.","이 운 좋은 발견이 우리에게 가장 좋아하는 음식 중 하나를 주었다."]],"w":"11번 문장의 on purpose는 ‘일부러’라는 뜻이고, 12번 문장에서 This lucky discovery(이 운 좋은 발견)가 좋아하는 음식을 주었다고 함. 두 칸을 바꾸면 말이 안 됨.","c":null},"h":"5d99a89fd0"}]},{"u":1,"id":"b2-01-3","no":3,"ko":"동물을 죽이지 않고 만드는 고기","items":[{"n":1,"t":"tf","q":"Scientists make lab-grown meat by killing many animals.","ko":"과학자들은 많은 동물을 죽여서 배양육을 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"There is a way to make meat without killing animals.","동물을 죽이지 않고 고기를 만드는 방법이 있다."]],"w":"1번 문장에서 배양육은 make meat without killing animals(동물을 죽이지 않고 고기를 만드는 방법)라고 함. 많은 동물을 죽인다는 것은 반대 내용.","c":"F"},"h":"063b64f430"},{"n":2,"t":"tf","q":"Lab-grown meat is hard to make in large amounts because the cells need very controlled conditions.","ko":"세포가 매우 통제된 조건을 필요로 하기 때문에 배양육을 대량으로 만들기는 어렵다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"It is also challenging to make large amounts, as the cells need very controlled conditions to grow.","세포가 자라려면 매우 통제된 조건이 필요하기 때문에, 대량으로 만드는 것도 어렵다."]],"w":"11번 문장에 It is also challenging to make large amounts, as the cells need very controlled conditions to grow가 나옴. challenging은 hard와 같은 뜻이라 맞는 내용.","c":"T"},"h":"8d8e01561e"},{"n":3,"t":"tf","q":"The combined muscle pieces are made into products such as burger patties or chicken nuggets.","ko":"합쳐진 근육 조각들은 햄버거 패티나 치킨 너겟 같은 제품으로 만들어진다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Then, the combined pieces are processed into meat products such as burger patties or chicken nuggets.","그런 다음, 합쳐진 조각들은 햄버거 패티나 치킨 너겟 같은 고기 제품으로 가공된다."]],"w":"7번 문장에 the combined pieces are processed into meat products such as burger patties or chicken nuggets가 나옴. processed into는 ‘~로 가공되다’라서 made into와 같은 뜻.","c":"T"},"h":"423f5ec2d4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is also challenging to make large amounts, as the cells need very controlled conditions to grow.)","ko":"(세포가 자라려면 매우 ( ) 조건이 필요하기 때문에, 대량으로 만드는 것도 어렵다.)","opts":["자유로운","따뜻한","위험한","통제된"],"word":"controlled","r":{"a":"4) 통제된","ev":"11번 문장","s":[[11,"It is also challenging to make large amounts, as the cells need very controlled conditions to grow.","세포가 자라려면 매우 통제된 조건이 필요하기 때문에, 대량으로 만드는 것도 어렵다."]],"w":"11번에서 세포가 자라려면 아주 ‘정해진 대로 맞춰진’ 조건이 필요해서 대량으로 만들기 어렵다고 함. controlled conditions = 통제된(조절된) 조건. 자유로운은 반대 뜻이라 어렵다는 이유가 되지 않음.","c":4},"h":"77f8210c04"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In addition, some people feel uneasy about eating meat grown in a lab.)","ko":"(게다가, 일부 사람들은 실험실에서 키운 고기를 먹는 것을 ( ) 느낀다.)","opts":["불편하게","행복하게","자랑스럽게","궁금하게"],"word":"uneasy","r":{"a":"1) 불편하게","ev":"12번 문장","s":[[12,"In addition, some people feel uneasy about eating meat grown in a lab.","게다가, 일부 사람들은 실험실에서 키운 고기를 먹는 것을 꺼림칙하게 느낀다."]],"w":"12번은 In addition(게다가)으로 세 번째 문제를 덧붙이는 문장임. 문제이므로 좋은 감정이 아니라 불편하고 꺼림칙한 마음. uneasy = 불편한. 행복한, 자랑스러운은 문제가 될 수 없음.","c":1},"h":"21101f0b05"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nScientists collect these pieces of muscle and combine them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"과학자들은 이 근육 조각들을 모아서 합친다.","opts":["과학자들","근육 조각들","햄버거 패티","영양분"],"r":{"a":"2) 근육 조각들","ev":"6번 문장","s":[[6,"Scientists collect these pieces of muscle and combine them.","과학자들은 이 근육 조각들을 모아서 합친다."]],"w":"6번에서 과학자들이 모으고(collect) 합치는(combine) 대상이 these pieces of muscle(이 근육 조각들)임. them은 그 근육 조각들. 과학자들은 합치는 주체이고 패티는 7번에서 그 뒤에 만들어짐.","c":2},"h":"9c0d9fcff4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Their efforts could one day make lab-grown meat a common food on our tables.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들의 노력은 언젠가 배양육을 우리 식탁 위의 흔한 음식으로 만들 수도 있다.","opts":["과학자들의 노력은 배양육을 사라지게 만들 것이다.","배양육은 이미 모든 식탁에서 흔한 음식이다.","과학자와 기업들의 노력 덕분에 언젠가 배양육이 흔한 음식이 될 수도 있다.","사람들은 노력하지 않아도 배양육을 곧 먹게 될 것이다."],"r":{"a":"3) 과학자와 기업들의 노력 덕분에 언젠가 배양육이 흔한 음식이 될 수도 있다.","ev":"13~14번 문장","s":[[13,"Even so, many scientists and companies are working to improve the process.","그래도 많은 과학자와 기업들이 그 과정을 개선하려고 노력하고 있다."],[14,"Their efforts could one day make lab-grown meat a common food on our tables.","그들의 노력은 언젠가 배양육을 우리 식탁 위의 흔한 음식으로 만들 수도 있다."]],"w":"Their efforts는 13번의 과학자와 기업들의 노력이고, one day는 ‘언젠가’, could는 ‘~할 수도 있다’. 지금 이미 흔하다는 뜻이 아님.","c":3},"h":"9678072d68"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["과학자들은 동물 전체를 탱크에 넣는다.","배양육은 이미 우리 식탁 위의 흔한 음식이다.","모든 사람이 배양육을 먹는 것을 편안하게 느낀다.","과학자들은 동물에게서 얻은 세포 몇 개를 특별한 탱크에 넣는다."],"opts":["Scientists put whole animals in a tank.","Lab-grown meat is already a common food on our tables.","Everyone feels comfortable about eating lab-grown meat.","Scientists put a few cells from an animal in a special tank."],"r":{"a":"4) Scientists put a few cells from an animal in a special tank. (과학자들은 동물에게서 얻은 세포 몇 개를 특별한 탱크에 넣는다.)","ev":"3번 문장","s":[[3,"Scientists take a few cells from an animal and put them in a special tank.","과학자들은 동물에게서 세포 몇 개를 얻어 특별한 탱크에 넣는다."]],"w":"3번 문장에서 과학자들이 동물에게서 세포 몇 개를 얻어 특별한 탱크에 넣는다고 함. ①은 동물 전체가 아니라 세포 몇 개이므로 틀림, ②는 아직 흔하지 않고 언젠가 흔해질 수 있다고 했으며, ③은 불편해하는 사람들도 있다고 했음.","c":4},"h":"ac06058fb5"},{"n":9,"t":"sum","q":"Lab-grown meat could (A) the future of food, but there are still some (B) to solve.","ko":"배양육은 음식의 미래를 (A) 수 있지만, 아직 해결해야 할 (B)이(가) 몇 가지 있다.","oko":["(A) 바꿀 / (B) 문제","(A) 멈출 / (B) 문제","(A) 바꿀 / (B) 이점","(A) 멈출 / (B) 이점","(A) 망칠 / (B) 해결책"],"opts":["(A) change / (B) problems","(A) stop / (B) problems","(A) change / (B) benefits","(A) stop / (B) benefits","(A) ruin / (B) solutions"],"r":{"a":"1) (A) change / (B) problems ((A) 바꿀 / (B) 문제)","ev":"8~9번 문장","s":[[8,"Lab-grown meat could change the future of food.","배양육은 음식의 미래를 바꿀 수 있다."],[9,"However, there are still some problems to solve.","그러나 아직 해결해야 할 문제가 몇 가지 있다."]],"w":"8번 문장에서 Lab-grown meat could change the future of food(음식의 미래를 바꿀 수 있다), 9번 문장에서 there are still some problems to solve(아직 해결해야 할 문제가 있다)라고 함.","c":1},"h":"400e08af84"},{"n":10,"t":"fill","q":"Inside, the cells are given [A] that help them grow, just like in a [B] animal.","ko":"탱크 안에서 세포는 [B] 동물의 몸속에서처럼 자라도록 돕는 [A]을(를) 받는다.","bko":{"nutrients":"영양분","real":"진짜의, 실제의","burger":"햄버거","combine":"합치다","nuggets":"너겟","patties":"패티들"},"bank":["nutrients","real","burger","combine","nuggets","patties"],"r":{"a":"[A] nutrients (영양분), [B] real (진짜의, 실제의)","ev":"4번 문장","s":[[4,"Inside, the cells are given nutrients that help them grow, just like in a real animal.","탱크 안에서 세포는 실제 동물의 몸속에서처럼 자라도록 돕는 영양분을 받는다."]],"w":"4번 문장에서 세포는 자라도록 돕는 nutrients(영양분)를 받고, 이것은 just like in a real animal(실제 동물의 몸속에서처럼)이라고 함.","c":null},"h":"347b587993"}]},{"u":1,"id":"b2-01-4","no":4,"ko":"샌드위치가 우주 음식을 바꾼 이유","items":[{"n":1,"t":"tf","q":"In 1965, astronaut John Young brought a sandwich to space.","ko":"1965년에 우주비행사 존 영은 샌드위치를 우주로 가져갔다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In 1965, astronaut John Young brought a sandwich to space.","1965년에 우주비행사 존 영은 샌드위치 하나를 우주로 가져갔다."]],"w":"1번 문장 In 1965, astronaut John Young brought a sandwich to space가 그대로 나옴. 같은 내용이라 맞음.","c":"T"},"h":"5c63780f7a"},{"n":2,"t":"tf","q":"Crumbs sink to the floor in space.","ko":"우주에서 빵 부스러기는 바닥으로 가라앉는다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Without gravity, crumbs float through the air.","중력이 없으면, 빵 부스러기는 공중에 떠다닌다."]],"w":"4번 문장에서 중력이 없으면 crumbs float through the air(공중에 떠다닌다)고 함. 바닥으로 가라앉는다는 것은 반대 내용.","c":"F"},"h":"f71a55339b"},{"n":3,"t":"tf","q":"Salt and pepper are made into liquids and put in small bottles.","ko":"소금과 후추는 액체로 만들어져 작은 병에 담긴다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Salt and pepper are made into liquids and put in small bottles.","소금과 후추는 액체로 만들어져 작은 병에 담긴다."]],"w":"9번 문장에 Salt and pepper are made into liquids and put in small bottles가 그대로 나옴. 같은 내용이라 맞음.","c":"T"},"h":"d42b66f5b2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This incident helped NASA realize the danger of crumbs.)","ko":"(이 ( )은 NASA가 빵 부스러기의 위험을 깨닫는 데 도움이 되었다.)","opts":["실수","사건","발명","휴식"],"word":"incident","r":{"a":"2) 사건","ev":"3번 문장","s":[[3,"This incident helped NASA realize the danger of crumbs.","이 사건은 NASA가 빵 부스러기의 위험을 깨닫는 데 도움이 되었다."]],"w":"3번의 This incident는 바로 앞 1~2번에서 일어난 일(샌드위치를 한 입 먹자 부스러기가 사방으로 날아간 일)을 가리킴. incident = 사건. 발명이나 휴식이 NASA에게 위험을 깨닫게 한 것은 아님.","c":2},"h":"6779806736"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Foods such as rice and pasta are dried and packaged in sealed bags.)","ko":"(쌀과 파스타 같은 음식은 말려서 ( ) 봉지에 포장된다.)","opts":["열린","젖은","밀봉된","무거운"],"word":"sealed","r":{"a":"3) 밀봉된","ev":"7번 문장","s":[[7,"Foods such as rice and pasta are dried and packaged in sealed bags.","쌀과 파스타 같은 음식은 말려서 밀봉된 봉지에 포장된다."]],"w":"7번은 부스러기가 새어 나가지 않게 음식을 포장하는 방법임. sealed bags = 입구를 막아 닫은(밀봉된) 봉지. 열린 봉지라면 부스러기를 막을 수 없음.","c":3},"h":"534dac77bc"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAnd instead of bread, astronauts eat tortillas because they’re soft and don’t make crumbs.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그리고 빵 대신에, 우주비행사들은 부드럽고 부스러기를 만들지 않기 때문에 토르티야를 먹는다.","opts":["빵","우주비행사들","토르티야","빵 부스러기"],"r":{"a":"3) 토르티야","ev":"10번 문장","s":[[10,"And instead of bread, astronauts eat tortillas because they’re soft and don’t make crumbs.","그리고 빵 대신에, 우주비행사들은 부드럽고 부스러기를 만들지 않기 때문에 토르티야를 먹는다."]],"w":"because 뒤의 they’re soft and don’t make crumbs는 우주비행사들이 빵 대신 토르티야를 먹는 이유임. 부드럽고 부스러기를 만들지 않는 것은 tortillas. 빵은 대신 먹지 않는 것이라 아님.","c":3},"h":"19279e132f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why modern space food is made to stay in one piece.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 현대의 우주 음식은 한 덩어리를 유지하도록 만들어진다.","opts":["앞에서 말한 부스러기 문제 때문에 현대의 우주 음식은 한 덩어리로 유지되게 만들어진다.","우주 음식은 맛을 좋게 하려고 한 조각으로 만든다.","현대의 우주 음식은 쉽게 부서지도록 만들어진다.","우주비행사들은 음식을 한 조각만 먹도록 정해져 있다."],"r":{"a":"1) 앞에서 말한 부스러기 문제 때문에 현대의 우주 음식은 한 덩어리로 유지되게 만들어진다.","ev":"3번, 6번 문장","s":[[3,"This incident helped NASA realize the danger of crumbs.","이 사건은 NASA가 빵 부스러기의 위험을 깨닫는 데 도움이 되었다."],[6,"That’s why modern space food is made to stay in one piece.","그래서 현대의 우주 음식은 한 덩어리를 유지하도록 만들어진다."]],"w":"That’s why는 ‘그래서’라는 뜻으로 앞 내용이 이유임. 앞(3~5번)에서 부스러기가 위험하다고 했으므로 부서지지 않게 한 덩어리로 만든 것. 맛이나 먹는 양 이야기는 없음.","c":1},"h":"d3d373d5ff"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["우주비행사들은 빵이 부드러워서 빵을 먹는다.","우주에서 빵 부스러기는 바닥으로 빠르게 떨어진다.","샌드위치는 아무 문제 없이 먹혔다.","존 영이 한 입 베어 물자 빵 부스러기가 사방으로 날아갔다."],"opts":["Astronauts eat bread because it is soft.","Crumbs in space fall quickly to the floor.","The sandwich was eaten without any problem.","Crumbs flew everywhere after John Young took one bite."],"r":{"a":"4) 존 영이 한 입 베어 물자 빵 부스러기가 사방으로 날아갔다.","ev":"2번 문장","s":[[2,"After taking one bite, crumbs flew everywhere.","한 입 베어 물자, 빵 부스러기가 사방으로 날아갔다."]],"w":"2번에서 After taking one bite, crumbs flew everywhere라고 함. ①은 10번에서 빵 대신 토르티야를 먹는다는 내용과 반대, ②는 4번에서 공중에 떠다닌다는 내용과 반대, ③은 문제가 생겨 NASA가 위험을 깨달았다는 3번과 반대.","c":4},"h":"6631a89099"},{"n":9,"t":"sum","q":"Crumbs can get into (A) or an astronaut’s nose and cause (B) problems.","ko":"빵 부스러기는 (A)이나 우주비행사의 코 안으로 들어가 (B) 문제를 일으킬 수 있다.","oko":["(A) 기계 / (B) 심각한","(A) 기계 / (B) 재미있는","(A) 책 / (B) 심각한","(A) 책 / (B) 재미있는","(A) 토르티야 / (B) 도움이 되는"],"opts":["(A) machines / (B) serious","(A) machines / (B) funny","(A) books / (B) serious","(A) books / (B) funny","(A) tortillas / (B) helpful"],"r":{"a":"1) (A) machines / (B) serious ((A) 기계 / (B) 심각한)","ev":"5번 문장","s":[[5,"These tiny pieces can get into machines or an astronaut’s nose and cause serious problems.","이 작은 조각들은 기계나 우주비행사의 코 안으로 들어가 심각한 문제를 일으킬 수 있다."]],"w":"5번 문장에서 작은 조각들이 기계나 우주비행사의 코 안으로 들어가 serious problems(심각한 문제)를 일으킬 수 있다고 함.","c":1},"h":"1a88dd8c8a"},{"n":10,"t":"fill","q":"Astronauts [A] water to them before [B].","ko":"우주비행사들은 [B] 전에 거기에 물을 [A].","bko":{"add":"더하다, 넣다","eating":"먹기, 먹는 것","soft":"부드러운","tiny":"아주 작은","sealed":"밀봉된","heavy":"무거운"},"bank":["add","eating","soft","tiny","sealed","heavy"],"r":{"a":"[A] add (더하다, 넣다), [B] eating (먹기, 먹는 것)","ev":"8번 문장","s":[[8,"Astronauts add water to them before eating.","우주비행사들은 먹기 전에 거기에 물을 넣는다."]],"w":"8번 문장에서 Astronauts add water to them before eating(우주비행사들은 먹기 전에 거기에 물을 넣는다)이라고 함. 두 칸을 바꾸면 말이 안 됨.","c":null},"h":"f0fecdfa33"}]},{"u":2,"id":"b2-02-1","no":1,"ko":"중국이 판다를 다른 나라에 보내는 이유","items":[{"n":1,"t":"tf","q":"Pandas are rare and live only in China.","ko":"판다는 희귀하고 중국에서만 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Pandas are rare and live only in China.","판다는 희귀하고 중국에서만 산다."]],"w":"2번 문장 Pandas are rare and live only in China가 그대로 나옴. 같은 내용이라 맞음.","c":"T"},"h":"4d91171c2e"},{"n":2,"t":"tf","q":"Pandas take a long time to win people’s hearts in a new country.","ko":"판다는 새로운 나라에서 사람들의 마음을 얻는 데 오랜 시간이 걸린다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"When pandas arrive in a new country, they quickly win people’s hearts.","판다가 새로운 나라에 도착하면, 그들은 금세 사람들의 마음을 얻는다."]],"w":"5번 문장에서 they quickly win people’s hearts(금세 마음을 얻는다)라고 함. 오랜 시간이 걸린다는 것은 반대 내용.","c":"F"},"h":"05e3c9dc45"},{"n":3,"t":"tf","q":"Learning about pandas can also help people learn about China and its culture.","ko":"판다에 대해 배우는 것은 사람들이 중국과 그 문화에 대해 배우는 데도 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"As people learn more about pandas, they can also learn more about China and its culture.","사람들은 판다에 대해 더 많이 알게 되면서, 중국과 그 문화에 대해서도 더 많이 알게 될 수 있다."]],"w":"7번 문장에 As people learn more about pandas, they can also learn more about China and its culture가 나옴. 같은 내용이라 맞음.","c":"T"},"h":"646c57ca8b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Pandas are rare and live only in China.)","ko":"(판다는 ( ) 중국에서만 산다.)","opts":["흔하고","드물고","크고","위험하고"],"word":"rare","r":{"a":"2) 드물고","ev":"2번 문장","s":[[2,"Pandas are rare and live only in China.","판다는 희귀하고 중국에서만 산다."]],"w":"2번에서 판다는 중국에서만 산다고 함. 다른 곳에는 거의 없으니 ‘드물다’는 뜻이 맞음. rare = 드문, 희귀한. 흔한은 반대 뜻.","c":2},"h":"c20c502c5c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Many people fall in love with these gentle animals.)","ko":"(많은 사람들이 이 ( ) 동물들과 사랑에 빠진다.)","opts":["사나운","빠른","무거운","온순한"],"word":"gentle","r":{"a":"4) 온순한","ev":"6번 문장","s":[[6,"Many people fall in love with these gentle animals.","많은 사람들이 이 온순한 동물들과 사랑에 빠진다."]],"w":"6번에서 사람들이 이 동물들과 사랑에 빠진다고 함. 사랑에 빠질 만한 모습은 순하고 얌전한 것. gentle = 온순한. 사나운 동물이라면 사랑에 빠지기 어려움.","c":4},"h":"8111977700"},{"n":6,"t":"ref","q":"What does the underlined \"the country\" refer to?\nSo the country sends them to zoos in other nations as a sign of friendship.","ko":"밑줄 친 the country가 가리키는 것은?","sko":"그래서 중국은 우정의 표시로 판다를 다른 나라의 동물원에 보낸다.","opts":["다른 나라들","동물원","중국","판다"],"r":{"a":"3) 중국","ev":"2번, 3번 문장","s":[[2,"Pandas are rare and live only in China.","판다는 희귀하고 중국에서만 산다."],[3,"So the country sends them to zoos in other nations as a sign of friendship.","그래서 중국은 우정의 표시로 판다를 다른 나라의 동물원에 보낸다."]],"w":"2번에서 판다가 live only in China(중국에서만 산다)고 했고, 3번의 So 뒤에서 판다를 다른 나라에 보내는 the country가 바로 그 중국. other nations(다른 나라들)는 보내는 곳임.","c":3},"h":"cb30ac217d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Panda diplomacy also lets countries work closely with China.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"판다 외교는 또한 나라들이 중국과 긴밀하게 협력하게 해 준다.","opts":["판다 외교 덕분에 나라들이 중국과 가깝게 협력할 수 있게 된다.","판다 외교는 나라들이 중국과 일하지 못하게 막는다.","판다 외교는 나라들이 중국을 멀리하게 만든다.","판다 외교 때문에 중국에서만 판다를 키우게 된다."],"r":{"a":"1) 판다 외교 덕분에 나라들이 중국과 가깝게 협력할 수 있게 된다.","ev":"9번 문장","s":[[9,"Panda diplomacy also lets countries work closely with China.","판다 외교는 또한 나라들이 중국과 긴밀하게 협력하게 해 준다."]],"w":"lets countries work closely with China는 ‘나라들이 중국과 긴밀하게 협력하게 해 준다’는 뜻. also는 7~8번 효과에 이은 또 하나의 효과라는 뜻. 막는다·멀리한다는 반대 내용이고, 판다는 3번처럼 다른 나라로 보내짐.","c":1},"h":"1bc502554d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["판다는 야생에서 여러 나라에 살고 있다.","판다는 경쟁의 표시로 다른 나라에 보내진다.","중국은 판다를 다른 나라 동물원에 판다.","다른 나라의 동물원들은 판다를 돌보기 위해 중국 전문가들과 협력한다."],"opts":["Pandas live in the wild in many countries.","Pandas are sent to other countries as a sign of competition.","China sells pandas to zoos in other nations.","Zoos in other countries work with Chinese experts to care for pandas."],"r":{"a":"4) Zoos in other countries work with Chinese experts to care for pandas. (다른 나라의 동물원들은 판다를 돌보기 위해 중국 전문가들과 협력한다.)","ev":"10번 문장","s":[[10,"Zoos in other countries work with Chinese experts to care for the pandas.","다른 나라의 동물원들은 판다를 돌보기 위해 중국 전문가들과 협력한다."]],"w":"10번 문장에서 다른 나라의 동물원들이 판다를 돌보기 위해 중국 전문가들과 협력한다고 함. ①은 판다가 중국에서만 산다고 했으므로 틀리고, ②는 우정의 표시라고 했으므로 틀리며, ③은 판다를 파는 것이 아니라 보내는 것이므로 틀림.","c":4},"h":"67d75c16da"},{"n":9,"t":"sum","q":"By working together, countries build (A) and (B) between them.","ko":"함께 일함으로써, 나라들은 서로 사이에 (A)와(과) (B)을(를) 쌓는다.","oko":["(A) 신뢰 / (B) 이해","(A) 신뢰 / (B) 두려움","(A) 분노 / (B) 이해","(A) 두려움 / (B) 경쟁","(A) 분노 / (B) 두려움"],"opts":["(A) trust / (B) understanding","(A) trust / (B) fear","(A) anger / (B) understanding","(A) fear / (B) competition","(A) anger / (B) fear"],"r":{"a":"1) (A) trust / (B) understanding ((A) 신뢰 / (B) 이해)","ev":"11번 문장","s":[[11,"By working together, they build trust and understanding between their countries.","함께 일함으로써, 그들은 나라 사이의 신뢰와 이해를 쌓는다."]],"w":"11번 문장에서 By working together, they build trust and understanding between their countries라고 함. 함께 일하면서 신뢰(trust)와 이해(understanding)를 쌓음.","c":1},"h":"c014753d61"},{"n":10,"t":"fill","q":"This helps them [A] the country in a more [B] way.","ko":"이것은 사람들이 그 나라를 더 [B] 시각으로 [A] 돕는다.","bko":{"see":"보다","positive":"긍정적인","zoos":"동물원들","hearts":"마음","friendship":"우정","experts":"전문가들"},"bank":["see","positive","zoos","hearts","friendship","experts"],"r":{"a":"[A] see (보다), [B] positive (긍정적인)","ev":"8번 문장","s":[[8,"This helps them see the country in a more positive way.","이것은 사람들이 그 나라를 더 긍정적인 시각으로 보도록 돕는다."]],"w":"8번 문장에서 This helps them see the country in a more positive way(이것은 사람들이 그 나라를 더 긍정적인 시각으로 보도록 돕는다)라고 함. 나머지 단어는 이 자리에 들어갈 수 없음.","c":null},"h":"be09b4656a"}]},{"u":2,"id":"b2-02-2","no":2,"ko":"죽음 앞에서 코끼리는 어떻게 행동할까?","items":[{"n":1,"t":"tf","q":"When a herd member dies, elephants often stay beside the body for days.","ko":"무리의 일원이 죽으면 코끼리들은 흔히 며칠 동안 시신 곁에 머문다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When a herd member dies, elephants often stay beside the body for days.","무리의 일원이 죽으면, 코끼리들은 흔히 며칠 동안 시신 곁에 머문다."]],"w":"3번 문장에 When a herd member dies, elephants often stay beside the body for days가 그대로 나옴. 같은 내용이라 맞음.","c":"T"},"h":"dcd20eec0f"},{"n":2,"t":"tf","q":"A year later, the elephants in Kenya did not stop at the bones.","ko":"1년 뒤에, 케냐의 코끼리들은 뼈 앞에 멈춰 서지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Even a year later, they stopped and touched the bones gently with their trunks.","1년이 지난 뒤에도, 그들은 멈춰 서서 코로 뼈를 부드럽게 만졌다."]],"w":"7번 문장에서 Even a year later, they stopped and touched the bones gently(1년 뒤에도 멈춰 서서 뼈를 만졌다)라고 함. 멈춰 서지 않았다는 것은 반대 내용.","c":"F"},"h":"da39e504fb"},{"n":3,"t":"tf","q":"Elephants stop to smell and touch the bones of every kind of animal.","ko":"코끼리들은 모든 종류의 동물의 뼈 앞에 멈춰 서서 냄새를 맡고 만진다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"They stop to smell and touch them, while ignoring other animal bones.","그들은 멈춰 서서 그것들의 냄새를 맡고 만지지만, 다른 동물의 뼈는 무시한다."]],"w":"9번 문장에서 코끼리는 알지 못하는 코끼리의 뼈는 냄새 맡고 만지지만, 다른 동물의 뼈는 ignoring(무시한다)이라고 함. 모든 동물의 뼈라는 것은 틀림.","c":"F"},"h":"6ce0f26718"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Even a year later, they stopped and touched the bones gently with their trunks.)","ko":"(1년이 지난 뒤에도, 그들은 멈춰 서서 코로 뼈를 ( ) 만졌다.)","opts":["거칠게","빠르게","부드럽게","크게"],"word":"gently","r":{"a":"3) 부드럽게","ev":"7번 문장","s":[[7,"Even a year later, they stopped and touched the bones gently with their trunks.","1년이 지난 뒤에도, 그들은 멈춰 서서 코로 뼈를 부드럽게 만졌다."]],"w":"7번은 1년 뒤에도 코끼리들이 코로 뼈를 어떻게 만졌는지 말하는 문장임. 코로 뼈를 만지는 모습이니 조심스럽게, 부드럽게 만진 것. gently = 부드럽게. 거칠게는 반대 뜻.","c":3},"h":"be519db5d3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This suggests they can recognize death within their species.)","ko":"(이것은 그들이 자기 종 안에서 죽음을 ( ) 수 있음을 보여 준다.)","opts":["알아보다","잊어버리다","두려워하다","만들어 내다"],"word":"recognize","r":{"a":"1) 알아보다","ev":"10번 문장","s":[[10,"This suggests they can recognize death within their species.","이것은 그들이 자기 종 안에서 죽음을 알아볼 수 있음을 보여 준다."]],"w":"10번은 8~9번(알지 못하는 코끼리의 뼈에만 반응)을 근거로 한 결론임. 같은 종의 뼈를 구별해 ‘알아보는’ 것. recognize = 알아보다. 잊어버린다면 반응하지 못함.","c":1},"h":"3130eae1d6"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nBut elephants also react to the bones of elephants they never knew.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그러나 코끼리들은 자신들이 알지 못했던 코끼리의 뼈에도 반응한다.","opts":["코끼리들","죽은 코끼리들","연구자들","뼈"],"r":{"a":"1) 코끼리들","ev":"8번 문장","s":[[8,"But elephants also react to the bones of elephants they never knew.","그러나 코끼리들은 자신들이 알지 못했던 코끼리의 뼈에도 반응한다."]],"w":"8번 문장은 코끼리들이 자신들이 알지 못했던(they never knew) 코끼리의 뼈에도 반응한다는 내용. 알지 못한 주체인 they는 반응하는 코끼리들.","c":1,"k":"they = 코끼리들"},"pron":"they","h":"814fb681f0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It seems as if they are trying to bury it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 마치 시신을 묻으려고 하는 것처럼 보인다.","opts":["코끼리들이 시신을 정말로 땅에 묻었다.","코끼리들이 시신을 먹으려는 것처럼 보인다.","연구자들이 시신을 묻으려고 했다.","코끼리들이 시신을 묻으려는 것처럼 보인다."],"r":{"a":"4) 코끼리들이 시신을 묻으려는 것처럼 보인다.","ev":"4~5번 문장","s":[[4,"Sometimes they cover the body with leaves or dirt.","때로는 그들이 시신을 나뭇잎이나 흙으로 덮는다."],[5,"It seems as if they are trying to bury it.","그것은 마치 시신을 묻으려고 하는 것처럼 보인다."]],"w":"It seems as if ~는 ‘마치 ~인 것처럼 보인다’로 확실하지 않은 모습을 말함. 4번에서 시신을 나뭇잎이나 흙으로 덮는 행동을 보고 묻으려는 것 같다고 한 것. 정말 묻었다고 한 것이 아님.","c":4},"h":"c249327a83"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["코끼리들은 죽은 무리의 일원 곁에 절대 머물지 않는다.","코끼리들은 죽은 가족의 뼈를 새로운 장소로 옮긴다.","케냐의 연구자들은 코끼리들이 가족이 죽은 장소로 돌아오는 것을 보았다.","코끼리들은 죽음을 인간과 똑같이 이해한다."],"opts":["Elephants never stay beside a dead herd member.","Elephants carry the bones of dead family members to a new place.","Researchers in Kenya saw elephants return to the place where a family member had died.","Elephants understand death exactly the same way humans do."],"r":{"a":"3) Researchers in Kenya saw elephants return to the place where a family member had died. (케냐의 연구자들은 코끼리들이 가족이 죽 e85b"},{"n":2,"t":"tf","q":"A cat’s eyes can only glow green.","ko":"고양이의 눈은 초록색으로만 빛날 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"It can be green, yellow, or even blue.","그것은 초록색, 노란색, 또는 심지어 파란색일 수도 있다."]],"w":"9번 문장에서 It can be green, yellow, or even blue(초록색, 노란색, 심지어 파란색일 수도 있다)라고 함. 초록색으로만 빛난다는 말은 틀림.","c":"F"},"h":"b0a8418536"},{"n":3,"t":"tf","q":"Cats need much less light than humans to see.","ko":"고양이는 보기 위해 사람보다 훨씬 적은 빛이 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In fact, cats can see with only one-sixth the light humans need.","사실, 고양이는 사람이 필요로 하는 빛의 6분의 1만 있어도 볼 수 있다."]],"w":"6번 문장에서 cats can see with only one-sixth the light humans need(사람이 필요로 하는 빛의 6분의 1만 있어도 볼 수 있다)라고 함. 훨씬 적은 빛이 필요하다는 뜻이라 맞음.","c":"T"},"h":"ac2c3d37d0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When light enters the eye, the tapetum lucidum reflects it back through the retina.)","ko":"(빛이 눈에 들어오면, 휘판은 그것을 망막을 통해 다시 ( )한다.)","opts":["흡수하다","반사하다","만들다","끄다"],"word":"reflects","r":{"a":"2) 반사하다","ev":"4번 문장","s":[[4,"When light enters the eye, the tapetum lucidum reflects it back through the retina.","빛이 눈에 들어오면, 휘판은 그것을 망막을 통해 다시 반사한다."]],"w":"4번에서 빛이 들어오면 휘판이 그것을 back(다시) 망막을 통과시킴. 5번에서 그 덕분에 같은 빛을 두 번 쓴다고 하므로 빛을 되돌려 보내는 것. reflect = 반사하다. 흡수하면 빛을 두 번 쓸 수 없음.","c":2},"h":"b8db05ac61"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It inspired him to create “cat’s eye” road reflectors.)","ko":"(그것은 그가 ‘고양이 눈’ 도로 반사 장치를 만들도록 ( ).)","opts":["방해했다","놀라게 했다","영감을 주었다","숨겼다"],"word":"inspired","r":{"a":"3) 영감을 주었다","ev":"11번 문장","s":[[11,"It inspired him to create “cat’s eye” road reflectors.","그것은 그가 ‘고양이 눈’ 도로 반사 장치를 만들도록 영감을 주었다."]],"w":"11번은 고양이 눈을 보고 도로 반사 장치를 만들게 되었다는 내용임. inspire A to B = A가 B하도록 영감을 주다. 방해했다면 반사 장치를 만들 수 없음.","c":3},"h":"fef86e53cf"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis lets the cat use the same light twice, so it sees better in the dark.","ko":"밑줄 친 it이 가리키는 것은 y with special chemicals.","ko":"밑줄 친 its가 가리키는 것은?","sko":"겨울이 오기 전에, 송장 개구리는 몸속을 특별한 화학 물질로 채운다.","opts":["송장 개구리","겨울","특별한 화학 물질","봄"],"r":{"a":"1) 송장 개구리","ev":"8번 문장","s":[[8,"Before winter, the wood frog fills its body with special chemicals.","겨울이 오기 전에, 송장 개구리는 몸속을 특별한 화학 물질로 채운다."]],"w":"8번 문장은 겨울이 오기 전에 송장 개구리(the wood frog)가 its body, 즉 자기 몸속을 화학 물질로 채운다는 내용. its는 송장 개구리를 가리킴.","c":1,"k":"its = 송장 개구리"},"pron":"its","h":"62b5e8071e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"With this clever trick, the wood frog can survive the deep freeze that would kill most animals.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 영리한 방법 덕분에, 송장 개구리는 대부분의 동물을 죽게 할 심한 혹한을 견디고 살아남을 수 있다.","opts":["송장 개구리는 대부분의 동물을 죽이는 혹한을 만들어 낸다.","대부분의 동물은 이 방법으로 혹한에서 살아남는다.","송장 개구리는 이 방법을 써도 혹한에서 죽는다.","이 영리한 방법 덕분에 송장 개구리는 대부분의 동물이 죽는 혹한에서도 살아남을 수 있다."],"r":{"a":"4) 이 영리한 방법 덕분에 송장 개구리는 대부분의 동물이 죽는 혹한에서도 살아남을 수 있다.","ev":"11번 문장","s":[[11,"With this clever trick, the wood frog can survive the deep freeze that would kill most animals.","이 영리한 방법 덕분에, 송장 개구리는 대부분의 동물을 죽게 할 심한 혹한을 견디고 살아남을 수 있다."]],"w":"that would kill most animals는 the deep freeze를 꾸미는 말로 ‘대부분의 동물을 죽일 혹한’이라는 뜻. 그런 혹한을 이 방법으로 송장 개구리가 견딘다는 것. 대부분의 동물이 이 방법을 쓰는 것은 아님.","c":4},"h":"eec4ee9cb9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["송장 개구리는 겨울에 더 따뜻한 곳으로 이동한다.","봄이 오면 얼어 있던 송장 개구리는 천천히 녹아 다시 살아난다.","송장 개구리는 겨울이 끝난 뒤에 몸을 화학 물질로 채운다.","얼어 있는 송장 개구리는 돌아다니며 먹이를 먹는다."],"opts":["Wood frogs move to warmer places in winter.","In spring, the frozen wood frog slowly melts and comes back to life.","Wood frogs fill their bodies with chemicals after winter ends.","A frozen wood frog moves around and eats food."],"r":{"a":"2) In spring, the frozen wood frog slowly melts and comes back to life. (봄이 오면 얼어 있던 송장 개구리는 천천히 녹아 다시 살아난다.)","ev":"6번 문장","s":[[6,"Then spring arrives, and the frozen frog slowly melts and comes back to life!","그러다 봄이 오면, 얼어 있던 개구리는 천천히 녹아 다시 살아난 amazed by his high jumps and fast spins.","관객들은 그의 높은 점프와 빠른 회전에 감탄했다."]],"w":"3번 문장에 Audiences were amazed by his high jumps and fast spins가 그대로 나옴. 관객이 높은 점프와 빠른 회전에 감탄했다는 내용과 일치.","c":"T","ev":"3번 문장"},"h":"affe47f204"},{"n":2,"t":"tf","q":"Nijinsky was only a dancer and never created new ballets.","ko":"니진스키는 오직 무용수일 뿐 새로운 발레를 만든 적이 없다.","r":{"a":"F (본문과 다른 내용)","s":[[5,"Nijinsky was not just a dancer, though.","하지만 니진스키는 단지 무용수만은 아니었다."],[6,"He was also a choreographer who created new kinds of ballet.","그는 또한 새로운 종류의 발레를 만든 안무가이기도 했다."]],"w":"5번에서 단지 무용수만은 아니었다(not just a dancer)고 했고, 6번에서 새로운 종류의 발레를 만든 안무가(choreographer)라고 함. 새 발레를 만든 적이 없다는 말은 반대.","c":"F","ev":"5~6번 문장"},"h":"0170ae841c"},{"n":3,"t":"tf","q":"The Rite of Spring followed all the rules of traditional ballet.","ko":"〈봄의 제전〉은 전통 발레의 모든 규칙을 따랐다.","r":{"a":"F (본문과 다른 내용)","s":[[9,"But this piece broke all the rules.","하지만 이 작품은 모든 규칙을 깼다."]],"w":"9번 문장에서 this piece broke all the rules, 즉 이 작품은 모든 규칙을 깼다고 함. 규칙을 따랐다는 말은 반대.","c":"F","ev":"9번 문장"},"h":"eebbc7d23e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The dancers moved with heavy steps and rough, sudden movements.)","ko":"무용수들은 무거운 걸음과 거칠고 ( ) 동작으로 움직였다.","opts":["느린","갑작스러운","우아한","조용한"],"word":"sudden","r":{"a":"2) 갑작스러운","s":[[10,"The dancers moved with heavy steps and rough, sudden movements.","무용수들은 무거운 걸음과 거칠고 갑작스러운 동작으로 움직였다."]],"w":"10번 문장에서 〈봄의 제전〉의 동작은 거칠고 sudden했다고 함. 8번의 부드럽고 우아한 동작과 반대 분위기라서 '갑작스러운'이 맞음. 느린, 우아한, 조용한은 이 장면과 어울리지 않음.","c":2,"ev":"10번 문장"},"h":"801caca2a5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, his bold ideas later helped shape modern ballet.)","ko":"그러나 그의 ( ) 생각은 나중에 현대 발레를 만드는 데 도움이 되었다.","opts":["조용한","오래된","느린","대담한"],"word":"bold","r":{"a":"4) 대담한","s":[[13,"Many people did not understand Nijinsky's style at the time.","당시 많은 사람들은 니진스키의 스타일을 이해하지 못했다."],[14,"However, his bold ideas later helped shape modern ballet.","그러나 그의 대담한 생각은 나중에 현대 발레를 만드는 데 도움이 되었다."]],"w":"13번에서 사람들이 이해하지 못한 스타일이었고, 14번에서 However로 뒤집으며 그 생각이 현대 발레에 도움이 됐다고 함. 규칙을 깬 용감한 생각이므로 '대담한'. 조용한, 오래된, 느린은 어울리지 않음.","c":4,"ev":"13~14번 문장"},"h":"71abc25598"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nSome even said he looked like he was flying.","ko":"밑줄 친 he가 가리키는 것은?","sko":"어떤 사람들은 그가 날고 있는 것처럼 보였다고까지 말했다.","opts":["니진스키","관객들","안무가","어떤 사람들"],"r":{"a":"1) 니진스키","ev":"4번 문장","s":[[4,"Some even said he looked like he was flying.","어떤 사람들은 그가 날고 있는 것처럼 보였다고까지 말했다."]],"w":"4번 문장은 어떤 사람들이 그가 날고 있는 것처럼 보였다고 말했다는 내용. 날고 있는 것처럼 보인 he는 앞 문장들에서 높이 점프하고 빠르게 도는 무용수 니진스키.","c":1,"k":"he = 니진스키"},"pron":"he","h":"7ad3e2a598"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Many people did not understand Nijinsky's style at the time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당시 많은 사람들은 니진스키의 스타일을 이해하지 못했다.","opts":["당시 많은 사람들은 니진스키의 스타일을 이해하지 못했다.","당시 모든 사람이 니진스키의 스타일을 열렬히 응원했다.","니진스키는 당시 사람들의 스타일을 이해하지 못했다.","니진스키의 스타일은 당시에도 모두에게 인기를 끌었다."],"r":{"a":"1) 당시 많은 사람들은 니진스키의 스타일을 이해하지 못했다.","ev":"13번 문장","s":[[13,"Many people did not understand Nijinsky's style at the time.","당시 많은 사람들은 니진스키의 스타일을 이해하지 못했다."]],"w":"13번 문장은 당시(at the time) 많은 사람들이 니진스키의 스타일을 이해하지 못했다는 내용. ②·④는 반대 뜻이고, ③은 이해하지 못한 사람이 니진스키로 바뀐 오답.","c":1},"h":"b0691f3630"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Nijinsky was a famous ballet dancer from France.","Nijinsky became well known in the early 1900s for his great skill.","Nijinsky was a famous painter from Russia.","Most people understood Nijinsky's style right away."],"oko":["니진스키는 프랑스 출신의 유명한 발레 무용수였다.","니진스키는 1900년대 초에 뛰어난 실력으로 유명해졌다.","니진스키는 러시아 출신의 유명한 화가였다.","대부분의 사람들은 니진스키의 스타일을 바로 이해했다."],"r":{"a":"2) Nijinsky became well known in the early 1900s for his great skill. (니진스키는 1900년대 초에 뛰어난 실력으로 유명해졌다.)","s":[[2,"He became well known in the early 1900s for his great skill.","그는 뛰어난 실력으로 1900년대 초에 유명해졌다."]],"w":"2번 문장에서 니진스키는 뛰어난 실력으로 1900년대 초에 유명해졌다고 함. ①은 프랑스가 아니라 러시아 출신, ③은 화가가 아니라 발레 무용수, ④는 당시 많은 사람들이 이해하지 못했다고 했음.","c":2,"ev":"2번 문장"},"h":"7dbb5c9c98"},{"n":9,"t":"sum","q":"In The Rite of Spring, the music was (A) and full of (B) rhythms.","ko":"〈봄의 제전〉에서 음악은 (A) (B) 리듬으로 가득했다.","opts":["(A) loud / (B) strange","(A) loud / (B) familiar","(A) quiet / (B) strange","(A) quiet / (B) familiar","(A) slow / (B) boring"],"oko":["(A) 시끄럽고 / (B) 낯선","(A) 시끄럽고 / (B) 익숙한","(A) 조용하고 / (B) 낯선","(A) 조용하고 / (B) 익숙한","(A) 느리고 / (B) 지루한"],"r":{"a":"1) (A) loud / (B) strange ((A) 시끄럽고 / (B) 낯선)","ev":"11번 문장","s":[[11,"The music was loud and full of strange rhythms.","음악은 시끄럽고 낯선 리듬으로 가득했다."]],"w":"11번 문장에서 The music was loud and full of strange rhythms(음악은 시끄럽고 낯선 리듬으로 가득했다)라고 함.","c":1},"h":"1dd024bd64"},{"n":10,"t":"fill","q":"In traditional ballet, dancers moved [A] to [B], soft music.","ko":"전통 발레에서 무용수들은 [B] 잔잔한 음악에 맞춰 [A] 움직였다.","bank":["gracefully","smooth","audiences","rhythms","jumps","skill"],"bko":{"gracefully":"우아하게","smooth":"부드러운","audiences":"관객들","rhythms":"리듬들","jumps":"점프들","skill":"실력"},"r":{"a":"[A] gracefully (우아하게), [B] smooth (부드러운)","ev":"8번 문장","s":[[8,"In traditional ballet, dancers moved gracefully to smooth, soft music.","전통 발레에서 무용수들은 부드럽고 잔잔한 음악에 맞춰 우아하게 움직였다."]],"w":"8번 문장에서 In traditional ballet, dancers moved gracefully to smooth, soft music(전통 발레에서 무용수들은 부드럽고 잔잔한 음악에 맞춰 우아하게 움직였다)이라고 함.","c":null},"h":"69464e6651"}]},{"u":3,"id":"b2-03-2","no":2,"ko":"소리를 듣지 못한 작곡가는 왜 피아노 다리를 잘랐을까?","items":[{"n":1,"t":"tf","q":"Beethoven was completely deaf when he wrote his Ninth Symphony.","ko":"베토벤은 제9번 교향곡을 쓸 때 완전히 귀가 들리지 않았다.","r":{"a":"T (본문과 맞는 내용)","s":[[2,"Ludwig van Beethoven faced this challenge when he wrote his Ninth Symphony.","루트비히 판 베토벤은 제9번 교향곡을 작곡할 때 이런 어려움에 직면했다."],[3,"At that time, he was completely deaf.","그때 그는 완전히 귀가 들리지 않는 상태였다."]],"w":"2번에서 제9번 교향곡을 쓸 때 어려움에 직면했다고 하고, 3번에서 그때 완전히 귀가 들리지 않았다(completely deaf)고 함. 내용이 일치.","c":"T","ev":"2~3번 문장"},"h":"d7364dc56e"},{"n":2,"t":"tf","q":"Beethoven stopped writing music because he lost his hearing.","ko":"베토벤은 청력을 잃었기 때문에 작곡을 그만두었다.","r":{"a":"F (본문과 다른 내용)","s":[[4,"But instead of giving up, he found a way to feel the music.","그러나 그는 포기하는 대신 음악을 느낄 방법을 찾아냈다."],[7,"Despite his hearing loss, Beethoven created a symphony that changed music history.","청력을 잃었음에도 불구하고, 베토벤은 음악의 역사를 바꾼 교향곡을 만들어 냈다."]],"w":"4번에서 포기하는 대신(instead of giving up) 음악을 느낄 방법을 찾았고, 7번에서 청력을 잃었음에도 교향곡을 만들었다고 함. 작곡을 그만두었다는 말은 반대.","c":"F","ev":"4번, 7번 문장"},"h":"2499ee967f"},{"n":3,"t":"tf","q":"Today, the Ninth Symphony is still performed around the world.","ko":"오늘날에도 제9번 교향곡은 전 세계에서 연주되고 있다.","r":{"a":"T (본문과 맞는 내용)","s":[[12,"Today, the Ninth Symphony is performed across the world, and is still considered one of Beethoven's greatest works.","오늘날 제9번 교향곡은 전 세계에서 연주되고 있으며, 여전히 베토벤의 가장 위대한 작품 중 하나로 여겨진다."]],"w":"12번 문장에 Today, the Ninth Symphony is performed across the world가 나옴. 오늘날 전 세계에서 연주된다는 내용과 일치.","c":"T","ev":"12번 문장"},"h":"5e671b70fc"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Ludwig van Beethoven faced this challenge when he wrote his Ninth Symphony.)","ko":"루트비히 판 베토벤은 제9번 교향곡을 작곡할 때 이런 ( )에 직면했다.","opts":["선물","어려움","기회","약속"],"word":"challenge","r":{"a":"2) 어려움","s":[[1,"What would it be like if you couldn't hear music at all?","음악을 전혀 들을 수 없다면 어떤 느낌일까?"],[2,"Ludwig van Beethoven faced this challenge when he wrote his Ninth Symphony.","루트비히 판 베토벤은 제9번 교향곡을 작곡할 때 이런 어려움에 직면했다."]],"w":"1번에서 음악을 전혀 들을 수 없다면 어떨까 하고 묻고, 2번의 this challenge가 그 상황을 가리킴. 듣지 못하는 일은 '어려움'. 선물, 기회, 약속은 문맥과 맞지 않음.","c":2,"ev":"1~2번 문장"},"h":"9aaa34d75e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This way, he could feel the sound through vibrations from the floor.)","ko":"이렇게 하면 그는 바닥에서 오는 ( )을 통해 소리를 느낄 수 있었다.","opts":["속도","소음","진동","거리"],"word":"vibrations","r":{"a":"3) 진동","s":[[5,"He cut off the legs of his piano and placed it on the floor.","그는 피아노의 다리를 잘라 내고 피아노를 바닥에 놓았다."],[6,"This way, he could feel the sound through vibrations from the floor.","이렇게 하면 그는 바닥에서 오는 진동을 통해 소리를 느낄 수 있었다."]],"w":"5번에서 피아노를 바닥에 놓았고, 6번에서 귀가 아닌 바닥에서 오는 vibrations로 소리를 느꼈다고 함. 바닥을 타고 전해지는 떨림이므로 '진동'. 소음이나 속도는 느낄 수 있는 방법이 되지 못함.","c":3,"ev":"5~6번 문장"},"h":"a508c0a492"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt's also the first symphony to include singing.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 또한 노래를 포함한 최초의 교향곡이기도 하다.","opts":["제9번 교향곡","베토벤","합창단","피아노"],"r":{"a":"1) 제9번 교향곡","ev":"10번 문장","s":[[10,"It's also the first symphony to include singing.","그것은 또한 노래를 포함한 최초의 교향곡이기도 하다."]],"w":"10번 문장은 노래를 포함한 최초의 교향곡이라는 내용. symphony(교향곡)에 해당하는 것은 베토벤의 제9번 교향곡.","c":1,"k":"It = 제9번 교향곡"},"pron":"It","h":"26caed9384"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The Ninth is over an hour long.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"제9번은 한 시간이 넘는 길이이다.","opts":["제9번 교향곡은 길이가 한 시간이 넘는 곡이다.","제9번 교향곡은 한 시간도 채 되지 않는 짧은 곡이다.","제9번 교향곡은 한 시간마다 연주를 멈춘다.","제9번 교향곡은 연주하는 데 하루가 넘게 걸린다."],"r":{"a":"1) 제9번 교향곡은 길이가 한 시간이 넘는 곡이다.","ev":"8번 문장","s":[[8,"The Ninth is over an hour long.","제9번은 한 시간이 넘는 길이이다."]],"w":"8번 문장은 The Ninth(제9번)가 over an hour long(한 시간이 넘는 길이)이라는 내용.","c":1},"h":"1a36c9ebca"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["A choir sings alone without the orchestra in the final part.","Ode to Joy is a piece played at the beginning of the symphony.","In the final part, a choir joins the orchestra to sing Ode to Joy.","Only a piano plays in the final part."],"oko":["마지막 부분에서는 합창단이 오케스트라 없이 혼자 노래한다.","〈환희의 송가〉는 교향곡의 시작 부분에서 연주되는 곡이다.","마지막 부분에서는 합창단이 오케스트라에 합류하여 〈환희의 송가〉를 부른다.","마지막 부분에서는 피아노만 연주된다."],"r":{"a":"3) In the final part, a choir joins the orchestra to sing Ode to Joy. (마지막 부분에서는 합창단이 오케스트라에 합류하여 〈환희의 송가〉를 부른다.)","ev":"11번 문장","s":[[11,"In the final part, a choir joins the orchestra to sing a piece called Ode to Joy.","마지막 부분에서는 합창단이 오케스트라에 합류하여 〈환희의 송가〉라는 곡을 부른다."]],"w":"11번 문장에서 마지막 부분에 합창단이 오케스트라에 합류하여 〈환희의 송가〉를 부른다고 함. ①은 오케스트라 없이가 아니라 함께, ②는 시작이 아니라 마지막 부분, ④는 피아노만이 아니라 합창단과 오케스트라.","c":3},"h":"9193145d4a"},{"n":9,"t":"sum","q":"Beethoven (A) the legs of his piano and (B) it on the floor.","ko":"베토벤은 피아노의 다리를 (A) 피아노를 바닥에 (B).","opts":["(A) cut off / (B) placed","(A) cut off / (B) threw","(A) painted / (B) placed","(A) painted / (B) threw","(A) lifted / (B) hid"],"oko":["(A) 잘라 내고 / (B) 놓았다","(A) 잘라 내고 / (B) 던졌다","(A) 색칠하고 / (B) 놓았다","(A) 색칠하고 / (B) 던졌다","(A) 들어 올리고 / (B) 숨겼다"],"r":{"a":"1) (A) cut off / (B) placed ((A) 잘라 내고 / (B) 놓았다)","ev":"5번 문장","s":[[5,"He cut off the legs of his piano and placed it on the floor.","그는 피아노의 다리를 잘라 내고 피아노를 바닥에 놓았다."]],"w":"5번 문장에서 He cut off the legs of his piano and placed it on the floor(피아노의 다리를 잘라 내고 피아노를 바닥에 놓았다)라고 함.","c":1},"h":"940194d033"},{"n":10,"t":"fill","q":"That's [A] [B] as long as most symphonies of the time.","ko":"이는 당시 대부분의 교향곡보다 [A] [B] 긴 것이다.","bank":["nearly","twice","choir","floor","hearing","orchestra"],"bko":{"nearly":"거의","twice":"두 배","choir":"합창단","floor":"바닥","hearing":"청력","orchestra":"오케스트라"},"r":{"a":"[A] nearly (거의), [B] twice (두 배)","ev":"9번 문장","s":[[9,"That's nearly twice as long as most symphonies of the time.","이는 당시 대부분의 교향곡보다 거의 두 배나 긴 것이다."]],"w":"9번 문장에서 That’s nearly twice as long as most symphonies of the time(이는 당시 대부분의 교향곡보다 거의 두 배나 긴 것이다)이라고 함.","c":null},"h":"6db6bfa8af"}]},{"u":3,"id":"b2-03-3","no":3,"ko":"푸른빛 비밀을 품은 고려의 그릇","items":[{"n":1,"t":"tf","q":"Goryeo celadon was mainly made during the Goryeo Dynasty.","ko":"고려청자는 주로 고려 시대에 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","s":[[3,"It was mainly made between the late 10th and 14th centuries, during the Goryeo Dynasty.","그것은 주로 고려 시대인 10세기 말에서 14세기 사이에 만들어졌다."]],"w":"3번 문장에 It was mainly made between the late 10th and 14th centuries, during the Goryeo Dynasty가 나옴. 고려 시대에 주로 만들어졌다는 내용과 일치.","c":"T","ev":"3번 문장"},"h":"d97597ed56"},{"n":2,"t":"tf","q":"In the sanggam technique, potters drew patterns on the clay with paint.","ko":"상감 기법에서 도공들은 물감으로 점토에 무늬를 그렸다.","r":{"a":"F (본문과 다른 내용)","s":[[10,"Instead of drawing, potters carved patterns into the clay.","도공들은 그림을 그리는 대신 무늬를 점토에 새겼다."]],"w":"10번 문장에서 Instead of drawing, 즉 그리는 대신 무늬를 점토에 새겼다(carved)고 함. 물감으로 그렸다는 말은 반대.","c":"F","ev":"10번 문장"},"h":"03bebd66a6"},{"n":3,"t":"tf","q":"Goryeo celadon remains an important part of Korean tradition and culture.","ko":"고려청자는 여전히 한국 전통과 문화의 중요한 부분으로 남아 있다.","r":{"a":"T (본문과 맞는 내용)","s":[[14,"It remains an important part of Korean tradition and culture.","그것은 지금도 한국 전통과 문화의 중요한 한 부분으로 남아 있다."]],"w":"14번 문장에 It remains an important part of Korean tradition and culture가 나옴. remain(남아 있다)은 지금도 그렇다는 뜻이라 내용과 일치.","c":"T","ev":"14번 문장"},"h":"2fe8290141"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Goryeo potters mastered this technique and created a beautiful color.)","ko":"고려의 도공들은 이 기술을 ( ) 아름다운 색을 만들어 냈다.","opts":["가르쳤다","완전히 익혔다","잊어버렸다","팔았다"],"word":"mastered","r":{"a":"2) 완전히 익혔다","s":[[6,"This color was made by a special firing method using very little oxygen.","이 색은 산소를 아주 조금만 쓰는 특별한 굽기 방법으로 만들어졌다."],[7,"Goryeo potters mastered this technique and created a beautiful color.","고려의 도공들은 이 기술을 완전히 익혀서 아름다운 색을 만들어 냈다."]],"w":"6번에서 특별한 굽기 방법으로 색을 만들었다고 하고, 7번에서 도공들이 그 기술을 mastered(master, 완전히 익히다)하여 아름다운 색을 만들었다고 함. 기술을 익혀서 색이 나왔으므로 '완전히 익혔다'. 잊어버렸다면 색을 만들 수 없음.","c":2,"ev":"6~7번 문장"},"h":"718a78ba58"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It also used a decoration technique called sanggam.)","ko":"청자는 또한 상감이라고 불리는 ( ) 기법도 사용했다.","opts":["건축","운반","장식","포장"],"word":"decoration","r":{"a":"3) 장식","s":[[8,"But color was not the only special thing about celadon.","하지만 색만이 청자의 유일한 특별함은 아니었다."],[9,"It also used a decoration technique called sanggam.","청자는 또한 상감이라고 불리는 장식 기법도 사용했다."]],"w":"8번에서 색 말고도 또 다른 특별한 점이 있다고 하고, 9번이 상감이라는 기법을 소개함. 10~11번에서 무늬를 새기고 채우므로 decoration은 무늬로 꾸미는 '장식'.","c":3,"ev":"8~9번 문장"},"h":"5fd65c36c8"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThen they filled the patterns with colored clay before firing.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그런 다음 그들은 굽기 전에 그 무늬를 색이 있는 점토로 채웠다.","opts":["도공들","청자 제품","무늬","점토"],"r":{"a":"1) 도공들","s":[[10,"Instead of drawing, potters carved patterns into the clay.","도공들은 그림을 그리는 대신 무늬를 점토에 새겼다."],[11,"Then they filled the patterns with colored clay before firing.","그런 다음 굽기 전에 그 무늬를 색이 있는 점토로 채웠다."]],"w":"10번에서 무늬를 점토에 새긴 것은 potters(도공들)이고, 11번의 they는 같은 도공들이 무늬를 색 점토로 채운다는 뜻. 무늬나 점토는 채워지는 대상이지 채우는 주체가 아님.","c":1,"ev":"10~11번 문장"},"h":"74232d9f76"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But color was not the only special thing about celadon.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 색만이 청자의 유일한 특별함은 아니었다.","opts":["청자는 색 말고도 다른 특별한 점이 있었다.","청자는 색 때문에 특별하지 않았다.","청자는 오직 색만으로 만들어졌다.","색이 청자의 유일한 특별함이었다."],"r":{"a":"1) 청자는 색 말고도 다른 특별한 점이 있었다.","ev":"8번 문장","s":[[8,"But color was not the only special thing about celadon.","하지만 색만이 청자의 유일한 특별함은 아니었다."]],"w":"8번 문장은 색만이 청자의 유일한 특별함은 아니었다(not the only)는 내용. 다음 문장에서 상감 기법이 이어짐. ④는 정반대 뜻.","c":1},"h":"7204a4fa82"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Celadon items were only bowls and cups.","Celadon items included bowls, cups, and even roof tiles.","Sanggam is a firing method that uses very little oxygen.","Goryeo celadon was made in Japan."],"oko":["청자 제품은 그릇과 컵뿐이었다.","청자 제품에는 그릇, 컵, 심지어 지붕 기와까지 있었다.","상감은 산소를 아주 적게 쓰는 굽기 방법이다.","고려청자는 일본에서 만들어졌다."],"r":{"a":"2) Celadon items included bowls, cups, and even roof tiles. (청자 제품에는 그릇, 컵, 심지어 지붕 기와까지 있었다.)","s":[[4,"Celadon items included bowls, cups, and even roof tiles.","청자 제품에는 그릇, 컵, 심지어 지붕 기와까지 있었다."]],"w":"4번 문장에서 청자 제품에는 그릇, 컵, 심지어 지붕 기와까지 있었다고 함. ①은 그릇과 컵뿐이 아니라 지붕 기와도 있었고, ③은 상감이 장식 기법이며, ④는 일본이 아니라 한국의 도자기임.","c":2,"ev":"4번 문장"},"h":"73b0e4f4f3"},{"n":9,"t":"sum","q":"Goryeo potters were the (A) to use this technique on ceramics, and Goryeo celadon later (B) pottery across Asia.","ko":"고려의 도공들은 이 기법을 도자기에 (A) 사용한 사람들이었고, 고려청자는 나중에 아시아 전역의 도자기에 (B).","opts":["(A) first / (B) influenced","(A) first / (B) ignored","(A) last / (B) influenced","(A) last / (B) ignored","(A) second / (B) stopped"],"oko":["(A) 처음으로 / (B) 영향을 주었다","(A) 처음으로 / (B) 무시했다","(A) 마지막으로 / (B) 영향을 주었다","(A) 마지막으로 / (B) 무시했다","(A) 두 번째로 / (B) 멈추게 했다"],"r":{"a":"1) (A) first / (B) influenced ((A) 처음으로 / (B) 영향을 주었다)","ev":"12~13번 문장","s":[[12,"Goryeo potters were the first to use this technique on ceramics.","고려의 도공들은 이 기법을 도자기에 처음으로 사용한 사람들이었다."],[13,"Goryeo celadon later influenced pottery across Asia.","고려청자는 나중에 아시아 전역의 도자기에 영향을 주었다."]],"w":"12번 문장에서 고려의 도공들이 이 기법을 도자기에 the first(처음으로) 사용했다고 하고, 13번 문장에서 고려청자가 나중에 아시아 전역의 도자기에 influenced(영향을 주었다)라고 함.","c":1},"h":"ded278d3e4"},{"n":10,"t":"fill","q":"The most [A] feature is its [B] blue-green color.","ko":"가장 [A] 특징은 [B] 청록색이다.","bank":["famous","soft","clay","tiles","bowls","cups"],"bko":{"famous":"유명한","soft":"은은한, 부드러운","clay":"점토","tiles":"기와들","bowls":"그릇들","cups":"컵들"},"r":{"a":"[A] famous (유명한), [B] soft (은은한, 부드러운)","ev":"5번 문장","s":[[5,"The most famous feature is its soft blue-green color.","가장 유명한 특징은 은은한 청록색이다."]],"w":"5번 문장에서 The most famous feature is its soft blue-green color(가장 유명한 특징은 은은한 청록색이다)라고 함.","c":null},"h":"3d70da14cb"}]},{"u":3,"id":"b2-03-4","no":4,"ko":"오페라와 뮤지컬, 무엇이 다를까?","items":[{"n":1,"t":"tf","q":"Opera began in Europe hundreds of years ago.","ko":"오페라는 수백 년 전 유럽에서 시작되었다.","r":{"a":"T (본문과 맞는 내용)","s":[[4,"Opera began in Europe hundreds of years ago.","오페라는 수백 년 전 유럽에서 시작되었다."]],"w":"4번 문장에 Opera began in Europe hundreds of years ago가 그대로 나옴. 유럽에서 수백 년 전에 시작됐다는 내용과 일치.","c":"T","ev":"4번 문장"},"h":"1db8f5364e"},{"n":2,"t":"tf","q":"Opera singers usually use microphones to fill the theater.","ko":"오페라 가수들은 보통 극장을 채우기 위해 마이크를 사용한다.","r":{"a":"F (본문과 다른 내용)","s":[[6,"Singers use their powerful voices instead of microphones to fill the thea al isn't actually to catch the cheese.","그래서 목표는 사실 치즈를 잡는 것이 아니다."]],"w":"7번 문장에서 the goal isn't actually to catch the cheese, 즉 목표는 사실 치즈를 잡는 것이 아니라고 함. 반대 내용.","c":"F","ev":"7번 문장"},"h":"70be7b25ba"},{"n":3,"t":"tf","q":"The hill is so flat that participants can run easily down it.","ko":"언덕이 너무 평평해서 참가자들은 쉽게 달려 내려갈 수 있다.","r":{"a":"F (본문과 다른 내용)","s":[[5,"The hill is so steep that they usually end up tumbling and sliding down rather than running.","언덕이 너무 가팔라서 그들은 보통 달리기보다는 구르고 미끄러져 내려가게 된다."]],"w":"5번 문장에서 언덕은 so steep(너무 가파른)해서 참가자들이 달리기보다는 구르고 미끄러져 내려간다고 함. 평평하다는 말은 반대.","c":"F","ev":"5번 문장"},"h":"99e23e41cc"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The hill is so steep that they usually end up tumbling and sliding down rather than running.)","ko":"언덕이 너무 ( ) 그들은 보통 달리기보다는 구르고 미끄러져 내려가게 된다.","opts":["평평한","가파른","넓은","낮은"],"word":"steep","r":{"a":"2) 가파른","s":[[5,"The hill is so steep that they usually end up tumbling and sliding down rather than running.","언덕이 너무 가팔라서 그들은 보통 달리기보다는 구르고 미끄러져 내려가게 된다."]],"w":"5번에서 언덕 때문에 달리지 못하고 구르고 미끄러져 내려간다고 함. 그렇게 되려면 언덕이 '가파른' 것이 맞음. 평평하거나 낮은 언덕이면 달릴 수 있음.","c":2,"ev":"5번 문장"},"h":"7bc8abccdc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, it continues to be one of England's most unusual traditions.)","ko":"그러나 그것은 여전히 영국에서 가장 ( ) 전통 중 하나로 이어지고 있다.","opts":["평범한","오래된","흔한","특이한"],"word":"unusual","r":{"a":"4) 특이한","s":[[1,"Each spring near Gloucester, England, crowds gather for a strange and exciting race.","매년 봄 영국 글로스터 근처에서는 사람들이 모여 특이하고 흥미진진한 경주를 벌인다."],[12,"However, it continues to be one of England's most unusual traditions.","그러나 그것은 여전히 영국에서 가장 특이한 전통 중 하나로 이어지고 있다."]],"w":"1번에서 이 경주를 strange and exciting race(이상하고 흥미진진한 경주)라고 소개했고, 12번에서 가장 unusual한 전통 중 하나라고 함. 흔한 일이 아니라 '특이한' 것이라는 뜻. 평범한, 흔한은 반대.","c":4,"ev":"1번, 12번 문장"},"h":"ef40467b2f"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThen participants chase after it as fast as they can.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그러면 참가자들이 가능한 한 빨리 그것을 쫓아간다.","opts":["참가자들","치즈","관중","언덕"],"r":{"a":"1) 참가자들","ev":"4번 문장","s":[[4,"Then participants chase after it as fast as they can.","그러면 참가자들이 가능한 한 빨리 그것을 쫓아간다."]],"w":"4번 문장은 참가자들(participants)이 가능한 한 빨리 쫓아간다(as fast as they can)는 내용. 쫓아가는 주체는 they, 즉 참가자들.","c":1,"k":"they = 참가자들"},"pron":"they","h":"31b557bfca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"From the top of Cooper's Hill, a large round cheese is rolled down.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"쿠퍼스 힐의 꼭대기에서 크고 둥근 치즈가 아래로 굴려진다.","opts":["쿠퍼스 힐 꼭대기에서 크고 둥근 치즈를 아래로 굴린다.","쿠퍼스 힐 아래에서 치즈를 위로 던진다.","쿠퍼스 힐 꼭대기에서 작은 치즈 조각을 나눠 준다.","쿠퍼스 힐 꼭대기까지 치즈를 굴려 올린다."],"r":{"a":"1) 쿠퍼스 힐 꼭대기에서 크고 둥근 치즈를 아래로 굴린다.","ev":"3번 문장","s":[[3,"From the top of Cooper's Hill, a large round cheese is rolled down.","쿠퍼스 힐의 꼭대기에서 크고 둥근 치즈가 아래로 굴려진다."]],"w":"3번 문장은 From the top of Cooper’s Hill(쿠퍼스 힐 꼭대기에서) a large round cheese is rolled down(크고 둥근 치즈가 아래로 굴려진다)이라는 내용.","c":1},"h":"45231041a9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The last person to finish gets the cheese as a prize.","The winner receives a trophy as a prize.","The first person to cross the finish line gets the cheese as a prize.","The race is held in a big city stadium."],"oko":["가장 늦게 들어온 사람이 치즈를 상으로 받는다.","우승자는 상으로 트로피를 받는다.","결승선을 가장 먼저 통과한 사람이 치즈를 상으로 받는다.","이 경주는 대도시의 경기장에서 열린다."],"r":{"a":"3) The first person to cross the finish line gets the cheese as a prize. (결승선을 가장 먼저 통과한 사람이 치즈를 상으로 받는다.)","ev":"8번 문장","s":[[8,"Instead, the first person to cross the finish line is the winner and gets the cheese as a prize.","대신 결승선을 가장 먼저 통과하는 사람이 우승자가 되고, 상으로 그 치즈를 받는다."]],"w":"8번 문장에서 결승선을 가장 먼저 통과한 사람이 우승자가 되고 상으로 그 치즈를 받는다고 함. ①은 가장 늦게가 아니라 가장 먼저, ②는 트로피가 아니라 치즈, ④는 경기장이 아니라 언덕에서 열림.","c":3},"h":"1ec436d715"},{"n":9,"t":"sum","q":"Catching the cheese would be almost (A) and very (B).","ko":"치즈를 잡는 것은 거의 (A) 매우 (B).","opts": ow nature can create a very unusual place(사해는 자연이 얼마나 특이한 곳을 만들어 낼 수 있는지를 보여 준다)라고 함.","c":1},"h":"12ed5dc3e8"},{"n":10,"t":"fill","q":"The extra salt lets people [A] easily, so many [B] visit the Dead Sea to try this special experience.","ko":"여분의 소금은 사람들이 쉽게 [A] 해 주어서, 많은 [B]이 이 특별한 경험을 해 보러 사해를 방문한다.","bank":["float","tourists","outlet","climate","ocean","salt"],"bko":{"float":"뜨다","tourists":"관광객들","outlet":"출구","climate":"기후","ocean":"바다","salt":"소금"},"r":{"a":"[A] float, [B] tourists","s":[[11,"The extra salt also lets people float easily without any effort, so many tourists visit to try this special experience.","여분의 소금은 또한 사람들이 아무 노력 없이 쉽게 뜨게 해 주어서, 많은 관광객이 이 특별한 경험을 해 보러 방문한다."]],"w":"11번 The extra salt also lets people float easily without any effort, so many tourists visit에서 가져옴. outlet, climate, ocean, salt는 사람이 하는 행동이나 방문하는 사람을 나타내지 못함.","c":null,"ev":"11번 문장"},"h":"001a73421a"}]},{"u":4,"id":"b2-04-4","no":4,"ko":"하늘에 떠 있는 마을이 사라지고 있다고?","items":[{"n":1,"t":"tf","q":"To get to Civita, people must walk across a long bridge.","ko":"치비타에 가려면 사람들은 긴 다리를 걸어서 건너야 한다.","r":{"a":"T (본문과 맞는 내용)","s":[[3,"To get to Civita, you must walk across a long bridge.","치비타에 가려면 긴 다리를 걸어서 건너야 한다."]],"w":"3번 문장에 To get to Civita, you must walk across a long bridge가 나옴. 긴 다리를 걸어서 건너야 한다는 내용과 일치.","c":"T","ev":"3번 문장"},"h":"4d1eaabec2"},{"n":2,"t":"tf","q":"There are many roads into the village of Civita.","ko":"치비타 마을로 들어가는 길은 여러 개이다.","r":{"a":"F (본문과 다른 내용)","s":[[4,"It is the only way into the village.","그것이 마을로 들어가는 유일한 길이다."]],"w":"4번 문장에서 긴 다리가 마을로 들어가는 the only way(유일한 길)라고 함. 길이 여러 개라는 말은 반대.","c":"F","ev":"4번 문장"},"h":"5c9bb42457"},{"n":3,"t":"tf","q":"Parts of Civita are slowly disappearing.","ko":"치비타의 일부는 서서히 사라지고 있다.","r":{"a":"T (본문과 맞는 내용)","s":[[8,"As the land is slowly falling apart, parts of the village are disappearing bit by bit.","땅이 서서히 무너져 내리면서 마을의 일부가 조금씩 사라지고 있다."]],"w":"8번 문장에 parts of the village are disappearing bit by bit이 나옴. 마을의 일부가 조금씩 사라지고 있
