<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩튜터 스타터 3 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"rt3-01-1","no":1,"ko":"키보드 위의 내비게이션","items":[{"n":1,"t":"tf","q":"The bumps on the F and J keys are very small.","ko":"F와 J 키 위의 돌기는 매우 작다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"These bumps are very small.","이 돌기들은 매우 작다."]],"w":"3번 문장에 These bumps are very small이 그대로 있어요. 돌기는 아주 작다는 말이에요.","c":"T"},"h":"c111fcc8a5"},{"n":2,"t":"tf","q":"You have to look at the keyboard to find the rest of the keys.","ko":"나머지 키들을 찾으려면 키보드를 봐야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Then you can find the rest of the keys without looking at the keyboard.","그러면 당신은 키보드를 보지 않고 나머지 키들을 찾을 수 있다."]],"w":"7번 문장은 키보드를 보지 않고(without looking at the keyboard) 나머지 키들을 찾을 수 있다고 해요. 봐야 한다는 말은 반대예요.","c":"F"},"h":"c4d723ab31"},{"n":3,"t":"tf","q":"On many keyboards, the 5 key also has a small bump.","ko":"많은 키보드에서 5 키도 작은 돌기를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"On many keyboards, the 5 key also has a small bump on it.","많은 키보드에서 5 키 역시 그 위에 작은 돌기를 가지고 있다."]],"w":"8번 문장에서 많은 키보드의 5 키 역시 작은 돌기를 가지고 있다고 해요.","c":"T"},"h":"3b2dfa2683"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They help you put your hands in the correct position.)","ko":"그것들은 당신이 올바른 위치에 손을 놓을 수 있도록 도와준다. (correct는 올바른)","opts":["오래된","새로운","올바른","무거운"],"word":"correct","r":{"a":"3) 올바른","ev":"6번 문장","s":[[6,"They help you put your hands in the correct position.","그것들은 당신이 올바른 위치에 손을 놓을 수 있도록 도와준다."]],"w":"손을 놓을 위치가 어디인지 알려 주는 돌기예요. 그래서 correct position은 '올바른 위치'예요.","c":3},"h":"2a4db9d021"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They most likely have a bump on them.)","ko":"그것들은 아마도 그것들 위에 돌기를 가지고 있을 것이다. (bump는 돌기)","opts":["돌기","열쇠","화면","소리"],"word":"bump","r":{"a":"1) 돌기","ev":"2번 문장","s":[[2,"They most likely have a bump on them.","그것들은 아마도 그것들 위에 돌기를 가지고 있을 것이다."]],"w":"3번 문장에서 이 bump들은 매우 작다고 하고, 5번에서 중요한 목적이 있다고 해요. 키 위에 톡 튀어나온 작은 돌기예요.","c":1},"h":"37de36dbdb"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is used for a similar purpose.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 비슷한 목적으로 사용된다.","opts":["F와 J 키","5 키 위의 작은 돌기","나머지 숫자 키들","당신의 손"],"r":{"a":"2) 5 키 위의 작은 돌기","ev":"8~9번 문장","s":[[8,"On many keyboards, the 5 key also has a small bump on it.","많은 키보드에서 5 키 역시 그 위에 작은 돌기를 가지고 있다."],[9,"It is used for a similar purpose.","그것은 비슷한 목적으로 사용된다."]],"w":"8번에서 5 키에 작은 돌기가 있다고 하고, 바로 다음 9번에서 It이 그 돌기를 받아요. 비슷한 목적으로 쓰이는 것은 돌기예요.","c":2},"h":"37b63126f7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So you may not have noticed them before.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 당신은 전에 그것들을 알아채지 못했을 수도 있다.","opts":["그래서 당신은 전에 그것들을 분명히 알아챘다.","그래서 당신은 앞으로 그것들을 알아채지 않을 것이다.","그래서 당신은 전에 그것들을 알아챘을 수도 있다.","그래서 당신은 전에 그것들을 알아채지 못했을 수도 있다."],"r":{"a":"4) 그래서 당신은 전에 그것들을 알아채지 못했을 수도 있다.","ev":"4번 문장","s":[[4,"So you may not have noticed them before.","그래서 당신은 전에 그것들을 알아채지 못했을 수도 있다."]],"w":"may not have noticed는 지난 일을 짐작하는 말로 '알아채지 못했을지도 모른다'예요. ①은 '분명히 알아챘다', ②는 앞으로의 일, ③은 알아챘을 수도 있다라서 뜻이 달라요.","c":4},"h":"31068eed04"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["F와 J 키의 돌기는 크고 누구나 알아챈다.","돌기는 키보드를 예쁘게 보이게 하려고만 있다.","F와 J 키 위의 돌기는 중요한 목적을 가지고 있다.","F와 J 키에만 돌기가 있고 5 키에는 없다."],"opts":["The bumps on the F and J keys are big, so everyone notices them.","The bumps are only there to make the keyboard look nice.","The bumps on the F and J keys have an important purpose.","Only the F and J keys have a bump, and the 5 key has none."],"r":{"a":"3) The bumps on the F and J keys have an important purpose.","ev":"3~5번 문장","s":[[3,"These bumps are very small.","이 돌기들은 매우 작다."],[4,"So you may not have noticed them before.","그래서 당신은 전에 그것들을 알아채지 못했을 수도 있다."],[5,"However, they have an important purpose.","하지만, 그것들은 중요한 목적을 가지고 있다."]],"w":"5번에서 돌기는 중요한 목적을 가지고 있다고 해요. 돌기는 아주 작아서(3번) 못 알아챌 수 있고(4번), 5 키에도 돌기가 있어요(8번).","c":3},"h":"ad5f2f8804"},{"n":9,"t":"sum","q":"The bumps help you put your hands in the correct (A), so you can find the rest of the keys without (B) at the keyboard.","ko":"돌기는 손을 올바른 (A)에 놓도록 도와서, 키보드를 (B) 것 없이도 나머지 키들을 찾을 수 있다.","oko":["(A) 가격 / (B) 보는 것","(A) 위치 / (B) 타자 치는 것","(A) 크기 / (B) 보는 것","(A) 색깔 / (B) 타자 치는 것","(A) 위치 / (B) 보는 것"],"opts":["(A) price / (B) looking","(A) position / (B) typing","(A) size / (B) looking","(A) color / (B) typing","(A) position / (B) looking"],"r":{"a":"5) (A) position / (B) looking","ev":"6~7번 문장","s":[[6,"They help you put your hands in the correct position.","그것들은 당신이 올바른 위치에 손을 놓을 수 있도록 도와준다."],[7,"Then you can find the rest of the keys without looking at the keyboard.","그러면 당신은 키보드를 보지 않고 나머지 키들을 찾을 수 있다."]],"w":"6번에서 올바른 위치(position)에 손을 놓게 돕고, 7번에서 키보드를 보지 않고(without looking) 나머지 키를 찾는다고 해요.","c":5},"h":"89ebeabb3f"},{"n":10,"t":"fill","q":"Once you [A] the 5 key, you can easily find and type the rest of the [B] keys.","ko":"일단 5 키의 위치를 [A]하면, 나머지 [B] 키를 쉽게 찾아 입력할 수 있다.","bank":["locate","number","hands","purpose","looking","easily"],"bko":{"locate":"위치를 찾아내다","number":"숫자","purpose":"목적","looking":"보는 것","easily":"쉽게","hands":"손"},"r":{"a":"[A] locate, [B] number","ev":"10번 문장","s":[[10,"Once you locate it, you can easily find and type the rest of the number keys.","일단 당신이 그것의 위치를 찾기만 하면, 당신은 나머지 숫자 키를 쉽게 찾아 입력할 수 있다."]],"w":"10번 문장의 Once you locate it과 the rest of the number keys에서 가져왔어요. 5 키의 위치를 찾으면 나머지 숫자 키를 쉽게 찾아 입력해요.","c":null},"h":"700da2a5aa"}]},{"u":1,"id":"rt3-01-2","no":2,"ko":"이게 내 일이야!","items":[{"n":1,"t":"tf","q":"Paint watchers check how hard the paint becomes.","ko":"페인트 관찰자들은 페인트가 얼마나 딱딱해지는지 확인한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"They check how hard the paint becomes.","그들은 페인트가 얼마나 딱딱해지는지를 확인한다."]],"w":"9번 문장에 They check how hard the paint becomes가 그대로 있어요.","c":"T"},"h":"cb005a9167"},{"n":2,"t":"tf","q":"Paint watchers watch each paint dry only once.","ko":"페인트 관찰자들은 각 페인트가 마르는 것을 딱 한 번만 본다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"So they must watch it dry 10 to 15 times.","그래서 그들은 10번에서 15번 정도 그것이 마르는 것을 보아야 한다."]],"w":"12번 문장에서 그들은 10번에서 15번 정도 마르는 것을 보아야 한다고 해요. 한 번만 본다는 말은 달라요.","c":"F"},"h":"813d49a6b4"},{"n":3,"t":"tf","q":"The job of a paint watcher is not important.","ko":"페인트 관찰자의 일은 중요하지 않다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Their job is quite important.","그들의 일은 상당히 중요하다."]],"w":"5번 문장에서 그들의 일은 상당히 중요하다(quite important)고 해요. 중요하지 않다는 말은 반대예요.","c":"F"},"h":"de0f1e6627"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Paint watchers test many variations of each paint.)","ko":"페인트 관찰자들은 각 페인트의 많은 변화들을 시험한다. (variation은 변화)","opts":["이름들","변화들","주문들","크기들"],"word":"variations","r":{"a":"2) 변화들","ev":"11번 문장","s":[[11,"Paint watchers test many variations of each paint.","페인트 관찰자들은 각 페인트의 많은 변화들을 시험한다."]],"w":"각 페인트마다 조금씩 달라진 여러 경우를 시험한다는 뜻이에요. 그래서 variations는 '변화들'이에요.","c":2},"h":"3bc173377d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They observe how the color of the paint changes.)","ko":"그들은 페인트의 색깔이 어떻게 변하는지 관찰한다. (observe는 관찰하다)","opts":["칠하다","섞다","던지다","관찰하다"],"word":"observe","r":{"a":"4) 관찰하다","ev":"8번 문장","s":[[8,"They observe how the color of the paint changes.","그들은 페인트의 색깔이 어떻게 변하는지 관찰한다."]],"w":"페인트 관찰자는 색깔이 어떻게 변하는지 지켜봐요. 그래서 observe는 '관찰하다'예요.","c":4},"h":"51c32cb0a3"},{"n":6,"t":"ref","q":"What does the underlined \"all of this\" refer to?\nWhy do they do all of this?","ko":"밑줄 친 all of this가 가리키는 것은?","sko":"왜 그들은 이 모든 것을 할까?","opts":["페인트를 새로 칠하는 일","회사의 제품을 파는 일","색깔과 질감을 살피고 건조 시간을 기록하는 등의 일","페인트 가게를 청소하는 일"],"r":{"a":"3) 색깔과 질감을 살피고 건조 시간을 기록하는 등의 일","ev":"7~12번 문장","s":[[7,"They pay close attention to the paint’s color and texture.","그들은 페인트의 색깔과 질감에 세심한 주의를 기울인다."],[8,"They observe how the color of the paint changes.","그들은 페인트의 색깔이 어떻게 변하는지 관찰한다."],[9,"They check how hard the paint becomes.","그들은 페인트가 얼마나 딱딱해지는지를 확인한다."],[10,"And they record the drying time.","그리고 그들은 건조 시간을 기록한다."],[11,"Paint watchers test many variations of each paint.","페인트 관찰자들은 각 페인트의 많은 변화들을 시험한다."],[12,"So they must watch it dry 10 to 15 times.","그래서 그들은 10번에서 15번 정도 그것이 마르는 것을 보아야 한다."]],"w":"7~12번에서 페인트 관찰자가 하는 일들(색과 질감, 색 변화, 딱딱해짐, 건조 시간, 여러 번 시험)이 나와요. 13번의 all of this는 이 일들이에요.","c":3},"h":"9f8da23fd8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There’s more to it than just watching.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것에는 단순히 보는 것 이상의 것이 있다.","opts":["그것에는 단순히 보는 것 이상의 것이 있다.","그것은 보는 것보다 훨씬 쉬운 일이다.","그것에는 오직 보는 것만 있다.","그것은 보는 것을 전혀 하지 않는 일이다."],"r":{"a":"1) 그것에는 단순히 보는 것 이상의 것이 있다.","ev":"6번 문장","s":[[6,"There’s more to it than just watching.","그것에는 단순히 보는 것 이상의 것이 있다."]],"w":"more ~ than just watching은 '단순히 보는 것보다 더 많다'는 뜻이에요. 7~10번에서 색과 질감, 변화, 건조 시간까지 살펴요.","c":1},"h":"cdc01905ef"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["페인트 관찰자들은 페인트의 색깔을 전혀 보지 않는다.","페인트 관찰자들은 페인트가 마르는 시간을 기록한다.","페인트 관찰자들은 페인트가 얼마나 딱딱해지는지 확인하지 않는다.","페인트 관찰자들은 일이 아니라 재미로 페인트가 마르는 것을 본다."],"opts":["Paint watchers never look at the color of the paint.","Paint watchers record the drying time of the paint.","Paint watchers do not check how hard the paint becomes.","Paint watchers watch paint dry for fun, not for work."],"r":{"a":"2) Paint watchers record the drying time of the paint.","ev":"10번 문장","s":[[10,"And they record the drying time.","그리고 그들은 건조 시간을 기록한다."]],"w":"10번에서 건조 시간을 기록한다고 해요. 색깔은 7~8번에서 살피고, 딱딱해지는 정도는 9번에서 확인하며, 이것은 재미가 아니라 일이에요(5번).","c":2},"h":"a37ce7f112"},{"n":9,"t":"sum","q":"Paint watchers have a job that is (A). They check paint closely to (B) their company’s products.","ko":"페인트 관찰자는 (A) 일을 한다. 그들은 회사의 제품을 (B) 위해 페인트를 세심하게 확인한다.","oko":["(A) 쓸모없는 / (B) 개선하기","(A) 중요한 / (B) 무시하기","(A) 지루한 / (B) 팔기","(A) 쉬운 / (B) 칠하기","(A) 중요한 / (B) 개선하기"],"opts":["(A) useless / (B) improve","(A) important / (B) ignore","(A) boring / (B) sell","(A) easy / (B) paint","(A) important / (B) improve"],"r":{"a":"5) (A) important / (B) improve","ev":"5번, 14번 문장 기계를 과학 박람회에 가지고 갔다고 해요.","c":"T"},"h":"5a5ae41c1b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Well, the next time you visit your dentist because of cotton candy, you can blame William Morrison!)","ko":"자, 다음에 솜사탕 때문에 치과의사에게 가면 William Morrison을 탓할 수 있다! (blame은 탓하다)","opts":["고마워하다","돕다","탓하다","따라 하다"],"word":"blame","r":{"a":"3) 탓하다","ev":"14번 문장","s":[[14,"Well, the next time you visit your dentist because of cotton candy, you can blame William Morrison!","자, 다음에 당신이 솜사탕 때문에 치과의사에게 간다면, 당신은 William Morrison을 탓할 수 있다!"]],"w":"솜사탕 때문에 치과에 가야 한다면 솜사탕 기계를 만든 Morrison이 원망스럽겠죠. 그래서 blame은 '탓하다'예요.","c":3},"h":"ea46954314"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So many people, especially young children, love it.)","ko":"그래서 많은 사람들이, 특히 어린아이들이 그것을 아주 좋아한다. (especially는 특히)","opts":["특히","거의","가끔","절대"],"word":"especially","r":{"a":"1) 특히","ev":"2번 문장","s":[[2,"So many people, especially young children, love it.","그래서 많은 사람들이, 특히 어린아이들이 그것을 아주 좋아한다."]],"w":"많은 사람들 가운데 어린아이들을 콕 짚어 말해요. 그래서 especially는 '특히'예요.","c":1},"h":"ec5d80205b"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey called their creation “fairy floss.”","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 그들의 창작품을 ‘요정 솜’이라고 불렀다.","opts":["솜사탕을 좋아하는 사람들","William Morrison과 그의 친구","치과의사들","어린아이들"],"r":{"a":"2) William Morrison과 그의 친구","ev":"7번, 11번 문장","s":[[7,"In 1897, he created the first cotton candy machine with his friend.","1897년에 그는 친구와 함께 최초의 솜사탕 기계를 만들었다."],[11,"They called their creation “fairy floss.”","그들은 그들의 창작품을 ‘요정 솜’이라고 불렀다."]],"w":"7번에서 Morrison(he)이 친구와 함께 기계를 만들었어요. 11번의 They는 그 둘이고, 그들의 창작품(솜사탕)을 fairy floss라고 불렀어요.","c":2},"h":"125a53202e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Ironically, a dentist invented the first cotton candy machine.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"역설적이게도 한 치과의사가 최초의 솜사탕 기계를 발명했다.","opts":["최초의 솜사탕 기계는 치과의사의 치아를 치료하려고 발명되었다.","치과의사가 솜사탕 기계를 팔아서 사람들의 치아가 건강해졌다.","솜사탕 기계 때문에 치과의사가 일을 그만두었다.","치아에 나쁜 솜사탕의 기계를 뜻밖에도 치과의사가 발명했다."],"r":{"a":"4) 치아에 나쁜 솜사탕의 기계를 뜻밖에도 치과의사가 발명했다.","ev":"3~4번 문장","s":[[3,"However, it is bad for your teeth.","하지만, 그것은 치아에 좋지 않다."],[4,"Ironically, a dentist invented the first cotton candy machine.","역설적이게도 한 치과의사가 최초의 솜사탕 기계를 발명했다."]],"w":"3번에서 솜사탕은 치아에 좋지 않다고 했어요. 그런데 치아를 돌보는 치과의사가 그 기계를 발명했다는 뜻밖의 내용이라 Ironically가 쓰였어요.","c":4},"h":"54981bf038"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["솜사탕은 치아에 좋다.","그들은 자신들의 창작품을 ‘요정 솜’이라고 불렀다.","그들은 요정 솜을 1,000상자도 팔지 못했다.","그들은 1897년에 기계를 학교에 가지고 갔다."],"opts":["Cotton candy is good for your teeth.","They called their creation “fairy floss.”","They sold fewer than 1,000 boxes of fairy floss.","They took their machine to a school in 1897."],"r":{"a":"2) They called their creation “fairy floss.”","ev":"11번 문장","s":[[11,"They called their creation “fairy floss.”","그들은 그들의 창작품을 ‘요정 솜’이라고 불렀다."]],"w":"11번에서 그들은 자신들의 창작품을 fairy floss(요정 솜)라고 불렀어요. 솜사탕은 치아에 좋지 않고(3번), 6만 8천 상자 이상을 팔았고(13번), 기계는 1904년에 과학 박람회에 갔어요(12번).","c":2},"h":"ed8a8a0dd5"},{"n":9,"t":"sum","q":"First, the machine (A) sugar. Then it blew the sugar through tiny holes, and the sugar became (B) like cotton.","ko":"먼저 기계는 설탕을 (A). 그런 다음 설탕을 아주 작은 구멍으로 불어 날렸고, 설탕은 솜처럼 (B) 것이 되었다.","oko":["(A) 얼렸다 / (B) 솜털 같은","(A) 녹였다 / (B) 무거운","(A) 칠했다 / (B) 부드러운","(A) 팔았다 / (B) 딱딱한","(A) 녹였다 / (B) 솜털 같은"],"opts":["(A) froze / (B) fluffy","(A) melted / (B) heavy","(A) painted / (B) soft","(A) sold / (B) hard","(A) melted / (B) fluffy"],"r":{"a":"5) (A) melted / (B) fluffy","ev":"8~10번 문장","s":[[8,"First, the machine melted and spun sugar.","처음에, 그 기계는 설탕을 녹이고 회전시켰다."],[9,"Then it blew the melted sugar through tiny holes.","그런 다음 그것은 녹은 설탕을 아주 작은 구멍을 통해 불어 날렸다."],[10,"This made the sugar soft and fluffy like cotton.","이는 설탕을 솜처럼 부드럽고 솜털 같게 만들었다."]],"w":"8번에서 기계가 설탕을 녹이고(melted), 9번에서 작은 구멍으로 불어 날렸어요. 10번에서 설탕은 솜처럼 부드럽고 솜털 같게(fluffy) 되었어요.","c":5},"h":"14c5b75cbb"},{"n":10,"t":"fill","q":"At the science fair, they [A] over 68,000 [B] of fairy floss.","ko":"과학 박람회에서 그들은 요정 솜을 6만 8천 [B] 이상 [A].","bank":["sold","boxes","fluffy","tiny","dentist","young"],"bko":{"sold":"팔았다","boxes":"상자들","fluffy":"솜털 같은","tiny":"아주 작은","dentist":"치과의사","young":"어린"},"r":{"a":"[A] sold, [B] boxes","ev":"13번 문장","s":[[13,"They sold over 68,000 boxes of fairy floss.","그들은 6만 8천 상자 이상의 요정 솜을 판매했다."]],"w":"13번 문장 They sold over 68,000 boxes of fairy floss에서 가져왔어요. 박람회에서 요정 솜을 6만 8천 상자 이상 팔았어요.","c":null},"h":"a40c1a2f71"}]},{"u":2,"id":"rt3-02-1","no":1,"ko":"똑똑, 일어나세요!","items":[{"n":1,"t":"tf","q":"Customers of knocker-uppers wrote their wake-up time on slates outside the door.","ko":"노커 어퍼의 고객들은 문밖의 석판에 기상 시간을 적었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Their customers wrote their wake-up time on slates outside the door.","그들의 고객들은 기상 시간을 문밖의 석판에 적었다."]],"w":"5번 문장에 wrote their wake-up time on slates outside the door가 그대로 나와요. 석판은 문밖에 있었어요.","c":"T"},"h":"e873c73b44"},{"n":2,"t":"tf","q":"Knocker-uppers slept at night and worked during the day.","ko":"노커 어퍼는 밤에 자고 낮에 일했다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Knocker-uppers stayed up all night and then slept during the day.","노커 어퍼는 밤을 새운 다음 낮 동안 잤다."]],"w":"12번 문장에서 노커 어퍼는 밤을 새우고(stayed up all night) 낮 동안 잤다고 해요. 밤과 낮이 반대예요.","c":"F"},"h":"d1d7e3358f"},{"n":3,"t":"tf","q":"Some knocker-uppers shot peas at the windows of their customers.","ko":"몇몇 노커 어퍼는 고객들의 창문에 완두콩을 쏘았다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Some even shot peas at the windows with a rubber tube.","몇몇은 고무관으로 창문에 완두콩을 쏘기도 했다."]],"w":"10번 문장에서 Some even shot peas at the windows with a rubber tube라고 해요. 몇몇은 고무관으로 창문에 완두콩을 쏘았어요.","c":"T"},"h":"da44f80a2e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They tapped on their customers’ upstairs windows.)","ko":"그들은 고객들의 위층 창문을 두드렸다. (tap은 톡톡 두드리다)","opts":["창문을 열었다","가볍게 두드렸다","창문을 닦았다","창문을 깼다"],"word":"tapped","r":{"a":"2) 가볍게 두드렸다","ev":"9번 문장","s":[[9,"They tapped on their customers’ upstairs windows.","그들은 고객들의 위층 창문을 두드렸다."]],"w":"9번에서 노커 어퍼는 고객들을 깨우려고 위층 창문을 톡톡 두드렸어요. tap = 가볍게 두드리다. 소리가 크면 이웃이 깬다는 7~8번 내용과도 이어져요.","c":2},"h":"2b8a411c4b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Unfortunately, this woke up the neighbors too.)","ko":"유감스럽게도, 이것은 이웃들도 깨웠다. (neighbor는 가까이 사는 사람)","opts":["친구들","이웃들","손님들","가족들"],"word":"neighbors","r":{"a":"2) 이웃들","ev":"7번 문장","s":[[7,"Unfortunately, this woke up the neighbors too.","유감스럽게도, 이것은 이웃들도 깨웠다."]],"w":"7번에서 문을 두드리고 종을 울린 소리에 고객 말고도 근처에 사는 사람들이 깼어요. neighbor = 이웃.","c":2},"h":"af0db10a12"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey tapped on their customers’ upstairs windows.","ko":"밑줄 친 They가 가리키는 것은?","opts":["이웃들","고객들","노커 어퍼","긴 막대기들"],"sko":"이 문제를 해결하기 위해 노커 어퍼는 긴 막대기를 사용했다. 그들은 고객들의 위층 창문을 두드렸다.","r":{"a":"3) 노커 어퍼","ev":"8~9번 문장","s":[[8,"To solve this problem, knocker-uppers used long poles.","이 문제를 해결하기 위해 노커 어퍼는 긴 막대기를 사용했다."],[9,"They tapped on their customers’ upstairs windows.","그들은 고객들의 위층 창문을 두드렸다."]],"w":"8번에서 긴 막대기를 쓴 주어가 knocker-uppers이고, 9번 They는 그 노커 어퍼를 다시 부르는 말이에요. 창문을 두드린 것은 고객이나 이웃이 아니에요.","c":3},"h":"43e7711356"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You might wonder who woke up the knocker-uppers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["누가 노커 어퍼를 깨웠는지 궁금할 수도 있다.","노커 어퍼가 누구를 깨웠는지 알려 주겠다.","노커 어퍼는 누구든 깨울 수 있다.","노커 어퍼를 깨운 사람이 이미 밝혀졌다."],"sko":"당신은 누가 노커 어퍼를 깨웠는지 궁금해할지도 모른다.","r":{"a":"1) 누가 노커 어퍼를 깨웠는지 궁금할 수도 있다.","ev":"11번 문장","s":[[11,"You might wonder who woke up the knocker-uppers.","당신은 누가 노커 어퍼를 깨웠는지 궁금해할지도 모른다."]],"w":"might wonder는 ‘궁금해할지도 모른다’이고, who woke up the knocker-uppers는 ‘누가 노커 어퍼를 깨웠는지’예요. 누가 깨우는지 아직 모르는 상태예요.","c":1},"h":"477cf97523"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Knocker-uppers walked around town only late at night.","Knocker-uppers used long poles from the very beginning.","Customers handed their wake-up time to knocker-uppers on paper.","Knocker-uppers went around town early in the morning."],"oko":["노커 어퍼는 늦은 밤에만 마을을 돌아다녔다.","노커 어퍼는 처음부터 긴 막대기를 사용했다.","고객들은 기상 시간을 종이에 적어 노커 어퍼에게 건넸다.","노커 어퍼는 아침 일찍 마을을 돌아다녔다."],"r":{"a":"4) Knocker-uppers went around town early in the morning.","ev":"4번 문장","s":[[4,"The knocker-uppers went around town early in the morning and woke people up.","노커 어퍼는 아침 일찍 마을을 돌아다니며 사람들을 깨웠다."]],"w":"4번에서 노커 어퍼는 아침 일찍 마을을 돌아다니며 사람들을 깨웠어요. 처음에는 문을 두드리거나 종을 울렸고(6번) 긴 막대기는 나중에 썼어요(8번). 기상 시간은 문밖 석판에 적었어요(5번).","c":4},"h":"7f190a259a"},{"n":9,"t":"sum","q":"At first, knocker-uppers made a loud noise that woke up the neighbors, which was (A). So they used long (B) instead.","ko":"처음에 노커 어퍼는 이웃들도 깨우는 큰 소리를 냈는데, 그것은 (A)였다. 그래서 대신 긴 (B)를 사용했다.","opts":["(A) quiet / (B) poles","(A) a problem / (B) bells","(A) slow / (B) slates","(A) kind / (B) peas","(A) a problem / (B) poles"],"oko":["(A) 조용했다 / (B) 막대기","(A) 문제였다 / (B) 종","(A) 느렸다 / (B) 석판","(A) 친절했다 / (B) 완두콩","(A) 문제였다 / (B) 막대기"],"r":{"a":"5) (A) a problem / (B) poles","ev":"6~8번 문장","s":[[6,"At first, they knocked on the door or rang a bell loudly.","처음에 그들은 큰 소리로 문을 두드리거나 종을 울렸다."],[7,"Unfortunately, this woke up the neighbors too.","유감스럽게도, 이것은 이웃들도 깨웠다."],[8,"To solve this problem, knocker-uppers used long poles.","이 문제를 해결하기 위해 노커 어퍼는 긴 막대기를 사용했다."]],"w":"6~7번에서 큰 소리의 방법이 이웃도 깨우는 문제가 됐고, 8번에서 그 문제를 풀려고 긴 막대기(poles)를 썼어요. bells는 문제를 만든 방법이라 맞지 않아요.","c":5},"h":"dc5b596aef"},{"n":10,"t":"fill","q":"In [A], [B] played the role of alarm clocks.","ko":"[A]에서는 [B]이 알람 시계의 역할을 했다.","bank":["Britain","humans","slates","poles","peas","windows"],"bko":{"Britain":"영국","humans":"사람들","slates":"석판","poles":"막대기","peas":"완두콩","windows":"창문"},"r":{"a":"[A] Britain, [B] humans","ev":"2번 문장","s":[[2,"In Britain, humans played the role of alarm clocks.","영국에서는 사람들이 알람 시계의 역할을 했다."]],"w":"2번 문장 In Britain, humans played the role of alarm clocks에서 가져왔어요. slates, poles, peas, windows는 노커 어퍼가 쓰거나 일하던 대상이지 알람 시계 역할을 한 주체가 아니에요.","c":null},"h":"eba4375953"}]},{"u":2,"id":"rt3-02-2","no":2,"ko":"보이지 않아도 알아요","items":[{"n":1,"t":"tf","q":"The Mexican blind cavefish does not have eyes.","ko":"멕시코 장님 물고기는 눈이 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In fact, they don’t even have eyes!","사실, 그들은 눈이 있지도 않다!"]],"w":"5번 문장에서 they don’t even have eyes라고 해요. 눈이 아예 없는 물고기예요.","c":"T"},"h":"5475787d6c"},{"n":2,"t":"tf","q":"Eyes need only a little energy to grow.","ko":"눈은 자라는 데 에너지가 조금만 필요하다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Eyes need a lot of energy to grow.","눈은 자라는 데 많은 에너지를 필요로 한다."]],"w":"7번 문장은 눈이 자라는 데 a lot of energy(많은 에너지)가 필요하다고 해요. 조금만 필요하다는 말은 반대예요.","c":"F"},"h":"0e1c8f8d2a"},{"n":3,"t":"tf","q":"The cavefish live in a world of total darkness.","ko":"장님 물고기는 완전한 암흑 세상에서 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~3번 문장","s":[[1,"Imagine you live in a world of total darkness.","당신이 완전한 암흑 세상에 살고 있다고 상상해 보라."],[2,"You cannot see anything around you.","당신 주위에 있는 아무것도 볼 수 없다."],[3,"This is the Mexican blind cavefish’s everyday life.","이것이 멕시코 장님 물고기의 일상생활이다."]],"w":"1~2번의 완전한 어둠 속에서 아무것도 볼 수 없는 삶이 3번에서 장님 물고기의 일상생활이라고 해요.","c":"T"},"h":"4d8be759ae"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is because they slowly developed to fit their environment.)","ko":"그것은 그들이 그들의 환경에 맞도록 천천히 발달했기 때문이다. (environment는 둘러싼 곳)","opts":["시간","환경","에너지","감각"],"word":"environment","r":{"a":"2) 환경","ev":"6번 문장","s":[[6,"It is because they slowly developed to fit their environment.","그것은 그들이 그들의 환경에 맞도록 천천히 발달했기 때문이다."]],"w":"눈이 없는 까닭이 ‘그들이 사는 곳’에 맞게 발달했기 때문이에요. environment = 환경. 뒤 8번의 빛이 없는 동굴이 바로 그 환경이에요.","c":2},"h":"013e749349"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Instead, they developed another sense.)","ko":"대신에, 그들은 다른 감각을 발달시켰다. (sense는 느끼는 능력)","opts":["감각","속도","크기","색깔"],"word":"sense","r":{"a":"1) 감각","ev":"10번 문장","s":[[10,"Instead, they developed another sense.","대신에, 그들은 e of the most [B] artists in the Netherlands.","ko":"법정은 그가 [A] 않다는 데 동의했고, 그 후에 판 메이헤런은 네덜란드에서 가장 [B] 화가들 중 한 사람이 되었다.","bank":["guilty","famous","death","careful","angry","silent"],"bko":{"guilty":"유죄의","famous":"유명한","death":"죽음","careful":"조심스러운","angry":"화난","silent":"조용한"},"r":{"a":"[A] guilty, [B] famous","ev":"14~15번 문장","s":[[14,"The court agreed he was not guilty.","법정은 그가 죄가 없다는 것에 동의했다."],[15,"Afterward, van Meegeren became one of the most famous artists in the Netherlands.","그 후에 판 메이헤런은 네덜란드에서 가장 유명한 화가들 중 한 사람이 되었다."]],"w":"14번에서 법정은 그가 유죄가 아니라는(not guilty) 데 동의했고, 15번에서 그는 가장 유명한(famous) 화가들 중 한 사람이 되었어요.","c":null},"h":"53f21a985b"}]},{"u":4,"id":"rt3-04-1","no":1,"ko":"눈에 보이는 게 다가 아니야~","items":[{"n":1,"t":"tf","q":"You decide to make a sandwich.","ko":"당신은 샌드위치를 만들기로 결심한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에 you decide to make a sandwich가 그대로 있어요. decide to make는 '만들기로 결심하다'예요.","c":"T","s":[[2,"So, you decide to make a sandwich.","그래서 샌드위치를 만들기로 결심한다."]]},"h":"04f58edc3c"},{"n":2,"t":"tf","q":"Mold is only on the surface of the bread.","ko":"곰팡이는 빵의 표면에만 있다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","w":"13번 문장은 Mold is not only on the surface(곰팡이는 표면에만 있는 것이 아니다)예요. only가 아니라 not only라서 반대 내용이에요.","c":"F","s":[[13,"Mold is not only on the surface.","곰팡이는 표면에만 있는 것이 아니다."]]},"h":"49f7109ed7"},{"n":3,"t":"tf","q":"Mycotoxins grow in the roots of mold.","ko":"곰팡이 독은 곰팡이의 뿌리에서 자란다.","r":{"a":"T (본문과 맞는 내용)","ev":"15번 문장","w":"15번 문장에 Mycotoxins grow in the roots(곰팡이 독이 뿌리에서 자란다)라고 나와요. 14번에서 곰팡이가 빵 속으로 뿌리를 내린다고 했으니 맞는 내용이에요.","c":"T","s":[[15,"Mycotoxins grow in the roots.","곰팡이 독이 뿌리에서 자란다."]]},"h":"8d5ea86d48"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Sometimes molds produce mycotoxins. These are poisonous.)","ko":"때때로 곰팡이는 곰팡이 독을 만들어 낸다. 이것들은 독이 있다.","opts":["맛있는","값싼","독이 있는","부드러운"],"word":"poisonous","r":{"a":"3) 독이 있는","ev":"7~8번 문장","w":"7번에서 곰팡이가 만들어 내는 것이 곰팡이 독(mycotoxins)이고, 8번에서 These(그 곰팡이 독)가 poisonous라고 해요. 곰팡이 독이니까 poisonous = 독이 있는이에요.","c":3,"s":[[7,"Sometimes molds produce mycotoxins.","때때로 곰팡이는 곰팡이 독을 만들어 낸다."],[8,"These are poisonous.","이것들은 독이 있다."]]},"h":"8ccda2596e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (There is also invisible bacteria there.)","ko":"그곳에 보이지 않는 박테리아도 있다.","opts":["아주 맛있는","눈에 보이지 않는","눈에 잘 띄는","새로 생긴"],"word":"invisible","r":{"a":"2) 눈에 보이지 않는","ev":"16번 문장","w":"앞 문장들에서 곰팡이 뿌리가 빵 속으로 들어간다고 했어요. 속에 있는 박테리아는 겉으로 안 보이니까 invisible = 눈에 보이지 않는이에요.","c":2,"s":[[16,"There is also invisible bacteria there.","그곳에 보이지 않는 박테리아도 있다."]]},"h":"23be5b9d4d"},{"n":6,"t":"ref","q":"What does the underlined \"These two things\" refer to?\nThese two things are usually used in bread.","ko":"밑줄 친 These two things가 가리키는 것은?","sko":"이 두 가지는 보통 빵에 사용된다.","opts":["빵과 곰팡이","곡물과 견과류","알레르기와 호흡 문제","곰팡이와 곰팡이 독"],"r":{"a":"2) 곡물과 견과류","ev":"9~10번 문장","w":"10번의 These two things는 바로 앞 9번 문장에 나온 두 가지, 즉 grains and nuts(곡물과 견과류)예요. 곡물과 견과류가 보통 빵에 쓰여요.","c":2,"s":[[9,"One of the worst mycotoxins grows on grains and nuts.","최악의 곰팡이 독 중 하나가 곡물과 견과류에서 자란다."],[10,"These two things are usually used in bread.","이 두 가지는 보통 빵에 사용된다."]]},"h":"4513f3ab28"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Then why don’t we cut off the moldy part and eat the rest of the bread?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그렇다면 곰팡이가 핀 부분을 잘라내고 빵의 나머지를 먹는 게 어떨까?","opts":["그렇다면 곰팡이가 핀 부분을 잘라내고 빵의 나머지를 먹는 게 어떨까?","그렇다면 곰팡이가 핀 빵을 모두 버리고 새 빵을 사는 게 어떨까?","그렇다면 곰팡이가 핀 부분을 먹고 빵의 나머지를 잘라내는 게 어떨까?","그렇다면 빵의 나머지를 잘라내고 곰팡이를 키우는 게 어떨까?"],"r":{"a":"1) 그렇다면 곰팡이가 핀 부분을 잘라내고 빵의 나머지를 먹는 게 어떨까?","ev":"11번 문장","w":"why don’t we cut off ~ and eat ~?는 '~을 잘라내고 ~을 먹는 게 어때?'라는 제안이에요. 곰팡이가 핀 부분(the moldy part)을 자르고, 나머지(the rest)를 먹자는 뜻이에요.","c":1,"s":[[11,"Then why don’t we cut off the moldy part and eat the rest of the bread?","그렇다면 곰팡이가 핀 부분을 잘라내고 빵의 나머지를 먹는 게 어떨까?"]]},"h":"ee620c07e8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["곰팡이는 빵의 표면에만 있다.","곰팡이 독은 독이 없다.","곰팡이가 핀 빵의 나머지는 먹어도 안전하다.","곰팡이는 빵 속으로 뿌리를 내린다."],"opts":["Mold stays only on the surface of bread.","Mycotoxins are not poisonous.","It is safe to eat the rest of moldy bread.","Mold puts its roots down into the bread."],"r":{"a":"4) Mold puts its roots down into the bread.","ev":"13~14번 문장","w":"14번 문장에 It puts its roots down into the bread(곰팡이는 빵 속으로 뿌리를 내린다)가 나와요. 표면에만 있는 게 아니고(13번), 곰팡이 독은 독이 있고(8번), 나머지도 먹으면 안 돼요(17번).","c":4,"s":[[13,"Mold is not only on the surface.","곰팡이는 표면에만 있는 것이 아니다."],[14,"It puts its roots down into the bread.","곰팡이는 빵 속으로 뿌리를 내린다."]]},"h":"637cf19f89"},{"n":9,"t":"sum","q":"We should (A) moldy bread, because mold is not only on the (B) but also inside.","ko":"우리는 곰팡이가 핀 빵을 (A)해야 한다. 곰팡이는 (B)에만 있는 것이 아니라 안에도 있기 때문이다.","oko":["(A) 먹다 / (B) 표면","(A) 버리다 / (B) 뿌리","(A) 버리다 / (B) 표면","(A) 나누어 주다 / (B) 표면","(A) 보관하다 / (B) 박테리아"],"opts":["(A) eat / (B) surface","(A) throw away / (B) roots","(A) throw away / (B) surface","(A) share / (B) surface","(A) keep / (B) bacteria"],"r":{"a":"3) (A) throw away / (B) surface","ev":"13번, 17~18번 문장","w":"13번에서 곰팡이는 표면(surface)에만 있는 게 아니라고 했고, 17~18번에서 곰팡이 핀 빵은 먹지 말고 버리라고(throw away) 해요.","c":3,"s":[[13,"Mold is not only on the surface.","곰팡이는 표면에만 있는 것이 아니다."],[17,"Therefore, we should not eat any part of moldy bread.","그러므로, 곰팡이가 핀 빵의 어느 부분도 먹으면 안 된다."],[18,"Just throw it away!","그냥 그걸 버려라!"]]},"h":"a47e94e815"},{"n":10,"t":"fill","q":"Molds can [A] serious health issues, and some molds produce poisonous [B].","ko":"곰팡이는 심각한 건강 문제를 [A]할 수 있고, 어떤 곰팡이는 독이 있는 [B]를 만들어 낸다.","bank":["cause","mycotoxins","throw","nuts","surface","roots"],"bko":{"cause":"일으키다","mycotoxins":"곰팡이 독","throw":"던지다","nuts":"견과류","surface":"표면","roots":"뿌리"},"r":{"a":"[A] cause, [B] mycotoxins","ev":"6~8번 문장","w":"6번에서 곰팡이는 심각한 건강 문제를 일으킬 수 있다(can cause)고 하고, 7~8번에서 곰팡이가 만드는 독이 있는 것이 곰팡이 독(mycotoxins)이라고 해요.","c":null,"s":[[6,"Mold can cause serious health issues, such as allergies and breathing problems.","곰팡이는 알레르기와 호흡 문제와 같은 심각한 건강 문제를 일으킬 수 있다."],[7,"Sometimes molds produce mycotoxins.","때때로 곰팡이는 곰팡이 독을 만들어 낸다."],[8,"These are poisonous.","이것들은 독이 있다."]]},"h":"5e2d893c4a"}]},{"u":4,"id":"rt3-04-2","no":2,"ko":"나를 지켜줘!","items":[{"n":1,"t":"tf","q":"A whistling sound is made when the wind blows through the thorns.","ko":"바람이 가시 사이로 불 때 휘파람 소리가 난다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","w":"4번 문장에 When the wind blows through the thorns, it makes a whistling sound라고 나와요. 바람이 속 빈 가시 사이로 불 때 휘파람 소리가 난다는 내용과 같아요.","c":"T","s":[[4,"When the wind blows through the thorns, it makes a whistling sound.","가시 사이로 바람이 불 때, 그것은 휘파람 소리를 낸다."]]},"h":"80d571d568"},{"n":2,"t":"tf","q":"Elephants and giraffes do not like to eat these trees.","ko":"코끼리와 기린은 이 나무들을 먹는 것을 좋아하지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","w":"5번 문장은 Elephants and giraffes love to eat these trees(좋아한다)예요. 좋아하지 않는다는 말은 반대 내용이에요.","c":"F","s":[[5,"Elephants and giraffes love to eat these trees.","코끼리와 기린은 이 나무들을 먹는 것을 좋아한다."]]},"h":"7db61efed6"},{"n":3,"t":"tf","q":"The trees have evolved sharp thorns to protect themselves.","ko":"나무들은 스스로를 보호하기 위해 날카로운 가시를 진화시켰다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","w":"6번 문장에 the trees have evolved sharp thorns to protect themselves가 그대로 나와요. 가시는 나무가 스스로를 지키려고 진화시킨 거예요.","c":"T","s":[[6,"So the trees have evolved sharp thorns to protect themselves.","그래서 나무들이 그들 스스로를 보호하기 위해 날카로운 가시들을 진화시켰다."]]},"h":"0ce7a8b6f9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Its thorns are hollow.)","ko":"그것의 가시는 속이 비었다.","opts":["날카로운","속이 빈","아주 긴","붉은"],"word":"hollow","r":{"a":"2) 속이 빈","ev":"3~4번 문장","w":"바람이 가시 사이로 불면 휘파람 소리가 나요(4번). 소리가 나려면 가시의 속이 비어 있어야 해요. hollow = (속이) 빈이에요. 날카롭다는 말은 sharp예요(6번).","c":2,"s":[[3,"Its thorns are hollow.","그것의 가시는 속이 비었다."],[4,"When the wind blows through the thorns, it makes a whistling sound.","가시 사이로 바람이 불 때, 그것은 휘파람 소리를 낸다."]]},"h":"5cd159a356"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So the trees have evolved sharp thorns to protect themselves.)","ko":"그래서 나무들은 스스로를 보호하기 위해 날카로운 가시를 진화시켰다.","opts":["잃었다","팔았다","숨겼다","진화시켰다"],"word":"evolved","r":{"a":"4) 진화시켰다","ev":"6번 문장","w":"동물이 나무를 먹는 것을 좋아해서(5번) 나무가 날카로운 가시를 갖게 되었다는 흐름이에요. have evolved는 '진화시켰다'예요.","c":4,"s":[[6,"So the trees have evolved sharp thorns to protect themselves.","그래서 나무들이 그들 스스로를 보호하기 위해 날카로운 가시들을 진화시켰다."]]},"h":"523bea585f"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen elephants and giraffes try to eat the leaves, the ants bite them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"코끼리나 기린이 잎을 먹으려고 할 때, 개미들이 그것들을 문다.","opts":["개미들","코끼리와 기린","잎","가시"],"r":{"a":"2) 코끼리와 기린","ev":"10번 문장","w":"개미들은 잎을 먹으려고 다가오는 동물들을 물어서 쫓아내요. 그래서 them은 같은 문장 앞에 나온 코끼리와 기린이에요.","c":2,"s":[[10,"When elephants and giraffes try to eat the leaves, the ants bite them.","코끼리나 기린이 잎을 먹으려고 할 때, 개미들이 그것들을 문다."]]},"h":"e2596ce097"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But this is not the only way to keep animals away.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 이것이 동물들을 가까이 오지 못하게 하는 유일한 방법은 아니다.","opts":["이것은 동물들을 가까이 오지 못하게 하는 유일한 방법이다.","이것은 동물들을 불러 모으는 방법이다.","이것이 동물들을 가까이 오지 못하게 하는 유일한 방법은 아니다.","동물들은 이 방법 때문에 나무를 더 좋아하게 된다."],"r":{"a":"3) 이것이 동물들을 가까이 오지 못하게 하는 유일한 방법은 아니다.","ev":"7번 문장","w":"not the only way는 '유일한 방법은 아니다'라는 뜻이에요. 가시 말고도 동물을 가까이 오지 못하게 하는 다른 방법이 있다는 말이고, 그 방법이 바로 뒤에 나오는 개미예요.","c":3,"s":[[7,"But this is not the only way to keep animals away.","하지만 이것이 동물들을 가까이 오지 못하게 하는 유일한 방법은 아니다."]]},"h":"d7d2bb8bf5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["휘파람 가시나무는 동아시아에 있는 나무이다.","휘파람 소리는 가시 안에서 노래하는 개미들에게서 나온다.","개미들은 나무로부터 달콤한 꿀을 얻는다.","오직 기린만이 이 나무들을 먹는 것을 좋아한다."],"opts":["The whistling thorn is a tree in East Asia.","The whistling sound comes from ants singing inside the thorns.","The ants get sweet nectar from the tree.","Only giraffes love to eat these trees."],"r":{"a":"3) The ants get sweet nectar from the tree.","ev":"11번 문장","w":"11번에서 개미들은 나무로부터 달콤한 꿀을 얻어요. 나무는 동아프리카에 있고(1번), 소리는 바람이 가시 사이로 불 때 나며(4번), 코끼리와 기린 둘 다 나무를 먹는 것을 좋아해요(5번).","c":3,"s":[[11,"In return, the ants get sweet nectar from the tree.","그 대가로 개미들은 나무로부터 달콤한 꿀을 얻는다."]]},"h":"6f6e6bace3"},{"n":9,"t":"sum","q":"Ants live inside the thorns and (A) animals that try to eat the leaves. In return, the ants get (B) from the tree.","ko":"개미들은 가시 안에 살면서 잎을 먹으려는 동물들을 (A)한다. 그 대가로 개미들은 나무로부터 (B)를 얻는다.","oko":["(A) 먹이를 준다 / (B) 잎","(A) 아주 좋아한다 / (B) 가시","(A) 환영한다 / (B) 바람","(A) 문다 / (B) 잎","(A) 문다 / (B) 꿀"],"opts":["(A) feed / (B) leaves","(A) love / (B) thorns","(A) welcome / (B) wind","(A) bite / (B) leaves","(A) bite / (B) nectar"],"r":{"a":"5) (A) bite / (B) nectar","ev":"9~11번 문장","w":"10번에서 개미들은 잎을 먹으려는 동물들을 물고(bite), 11번에서 그 대가로 나무에게서 달콤한 꿀(nectar)을 얻어요. 잎을 얻는다는 말은 없어요.","c":5,"s":[[9,"The ants live inside the thorns.","개미들은 가시 안에서 산다."],[10,"When elephants and giraffes try to eat the leaves, the ants bite them.","코끼리나 기린이 잎을 먹으려고 할 때, 개미들이 그것들을 문다."],[11,"In return, the ants get sweet nectar from the tree.","그 대가로 개미들은 나무로부터 달콤한 꿀을 얻는다."]]},"h":"3712ffd468"},{"n":10,"t":"fill","q":"The trees have [A] sharp thorns to [B] themselves.","ko":"나무들은 스스로를 [B]하기 위해 날카로운 가시를 [A]했다.","bank":["evolved","protect","hollow","nectar","leaves","giraffes"],"bko":{"evolved":"진화시켰다","protect":"보호하다","hollow":"속이 빈","nectar":"꿀","leaves":"잎","giraffes":"기린"},"r":{"a":"[A] evolved, [B] protect","ev":"5~6번 문장","w":"6번 문장에 the trees have evolved sharp thorns to protect themselves가 나와요. 코끼리와 기린이 나무를 먹는 것을 좋아해서(5번), 나무가 스스로를 지키려고 날카로운 가시를 진화시킨 거예요.","c":null,"s":[[5,"Elephants and giraffes love to eat these trees.","코끼리와 기린은 이 나무들을 먹는 것을 좋아한다."],[6,"So the trees have evolved sharp thorns to protect themselves.","그래서 나무들이 그들 스스로를 보호하기 위해 날카로운 가시들을 진화시켰다."]]},"h":"08d571330f"}]},{"u":4,"id":"rt3-04-3","no":3,"ko":"어어, 거기 비켜 주세요!","items":[{"n":1,"t":"tf","q":"Birds could fly freely in the air
