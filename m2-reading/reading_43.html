<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 43</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}
.sec{margin:26px 0 8px;font-weight:700;color:var(--pri);font-size:15px;border-left:4px solid var(--pri);padding-left:8px}

.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}

.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}

button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Some of you have a dream job in mind, but others does not. It is not easy for you to find a future job.","ko":"여러분 중의 일부는 꿈의 직업을 염두에 두고 있지만 다른 사람들은 그렇지 않다. 여러분이 미래 직업을 찾는 것은 쉽지 않다.","ok":false,"foot":[],"fixes":[{"wrong":"does","right":"do","partial":false,"at":[11],"point":"do동사의 수일치: others는 복수: do not (does 아님)","topic":"do동사의 수일치","memo":"others는 복수: do not (does 아님)"}]},{"n":2,"tag":null,"en":"But us all need to answer the question, \"What do you want to be in the future?\"","ko":"그러나 우리는 모두 \"당신은 미래에 무엇이 되고 싶은가?\"라는 질문에 답해야 한다.","ok":false,"foot":[],"fixes":[{"wrong":"us","right":"we","partial":false,"at":[1],"point":"인칭대명사의 주격: 주어 자리에는 주격 we 사용","topic":"인칭대명사의 주격","memo":"주어 자리에는 주격 we 사용"}]},{"n":3,"tag":null,"en":"Think about the following questions, and you will find a path to you future job.","ko":"다음의 질문들을 생각해 보면 여러분의 미래 직업으로 가는 길을 찾게 될 것이다.","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[12],"point":"인칭대명사의 소유격: 명사 future job 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"명사 future job 앞에는 소유격 your 사용"}]},{"n":4,"tag":null,"en":"Why Do We Work?","ko":"왜 우리는 일을 할까?","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":null,"en":"First, we work to making money. Our jobs help us get paid so we can make an living.","ko":"첫째, 우리는 돈을 벌기 위해 일한다. 우리의 직업은 우리가 돈을 벌 수 있게 돕고 그래서 우리는 생계를 꾸릴 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"making","right":"make","partial":false,"at":[4],"point":"to부정사: 목적 to 뒤는 동사원형: to make","topic":"to부정사","memo":"목적 to 뒤는 동사원형: to make"},{"wrong":"an","right":"a","partial":false,"at":[16],"point":"관사 a/an: 자음 소리 living 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 living 앞에는 a 사용"}]},{"n":6,"tag":null,"en":"Second, we work to take on social roles.","ko":"둘째, 우리는 사회적 역할을 맡기 위해 일한다.","ok":true,"foot":[],"fixes":[]},{"n":7,"tag":null,"en":"For example, street cleaners keep us towns and cities clean, and police officers make our society safely.","ko":"예를 들어, 환경미화원은 우리 마을과 도시를 깨끗하게 유지하고, 경찰관은 우리 사회를 안전하게 만든다.","ok":false,"foot":[],"fixes":[{"wrong":"us","right":"our","partial":false,"at":[5],"point":"인칭대명사의 소유격: 명사 towns 앞에는 소유격 our 사용","topic":"인칭대명사의 소유격","memo":"명사 towns 앞에는 소유격 our 사용"},{"wrong":"safely","right":"safe","partial":false,"at":[16],"point":"형용사와 부사: make + 목적어 + 형용사 safe 사용","topic":"형용사와 부사","memo":"make + 목적어 + 형용사 safe 사용"}]},{"n":8,"tag":null,"en":"We rely in others to do these important job, and everyone has a special role to play. Third, we work to feel proud of our work.","ko":"우리는 이런 중요한 일을 하는 사람들에게 의존하며 모두가 맡은 특별한 역할이 있다. 셋째, 우리는 우리의 일에 대해 자부심을 느끼기 위해 일한다.","ok":false,"foot":[],"fixes":[{"wrong":"in","right":"on","partial":false,"at":[2],"point":"기본전치사: '~에 의존하다'는 rely on 사용","topic":"기본전치사","memo":"'~에 의존하다'는 rely on 사용"},{"wrong":"job","right":"jobs","partial":false,"at":[8],"point":"명사의 복수형: these 뒤에는 복수명사 jobs 사용","topic":"명사의 복수형","memo":"these 뒤에는 복수명사 jobs 사용"}]},{"n":9,"tag":null,"en":"By working, we can helps others and show our abilities. In the end, we work to find meaning in life.","ko":"일을 함으로써 우리는 다른 사람을 돕고 우리의 능력을 보여 줄 수 있다. 결국, 우리는 삶의 의미를 찾기 위해 일한다.","ok":false,"foot":[],"fixes":[{"wrong":"helps","right":"help","partial":false,"at":[4],"point":"조동사 can: can 뒤는 동사원형: help","topic":"조동사 can","memo":"can 뒤는 동사원형: help"}]},{"n":10,"tag":null,"en":"How Can I Find My Job?","ko":"어떻게 나의 직업을 찾을 수 있을까?","ok":true,"foot":[],"fixes":[]},{"n":11,"tag":null,"en":"Everyone have their own favorite activities. Try to connect them to a real job, and you will find your path.","ko":"모두가 자신만의 가장 좋아하는 활동이 있다. 그것을 실제 직업과 연결해 보라, 그러면 여러분의 길을 찾을 것이다.","ok":false,"foot":[],"fixes":[{"wrong":"have","right":"has","partial":false,"at":[1],"point":"3인칭 단수 현재형: Everyone은 단수 취급하여 has 사용","topic":"3인칭 단수 현재형","memo":"Everyone은 단수 취급하여 has 사용"}]},{"n":12,"tag":null,"en":"If you like watching TV shows, you can be a producer or an writer for those shows.","ko":"여러분이 TV 프로그램 보는 것을 좋아한다면, 그 프로그램들의 프로듀서나 작가가 될 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[12],"point":"관사 a/an: 자음 소리 writer 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 writer 앞에는 a 사용"}]},{"n":13,"tag":null,"en":"However, liking something and being well at it are not the same. Playing soccer as a job is different from playing it as a hobby.","ko":"하지만 무언가를 좋아하는 것과 그것을 잘하는 것은 같지 않다. 축구를 직업으로 하는 것은 취미로 하는 것과는 다르다.","ok":false,"foot":[],"fixes":[{"wrong":"well","right":"good","partial":false,"at":[5],"point":"형용사와 부사: be good at에서는 형용사 good 사용","topic":"형용사와 부사","memo":"be good at에서는 형용사 good 사용"}]},{"n":14,"tag":null,"en":"You love soccer but isn't good at it. Then you can look for other job in soccer.","ko":"축구를 정말 좋아하지만 잘하지 못한다. 그러면 축구에서 다른 직업들을 찾을 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"isn't","right":"aren't","partial":false,"at":[4],"point":"be동사의 부정문: 주어 You에는 aren't 사용","topic":"be동사의 부정문","memo":"주어 You에는 aren't 사용"},{"wrong":"job","right":"jobs","partial":false,"at":[14],"point":"명사의 복수형: other 뒤에는 복수명사 jobs 사용","topic":"명사의 복수형","memo":"other 뒤에는 복수명사 jobs 사용"}]},{"n":15,"tag":null,"en":"If you are good at take care of people, you can become a soccer player's manager.","ko":"사람을 돌보는 것을 잘한다면, 축구선수의 매니저가 될 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"take","right":"taking","partial":false,"at":[5],"point":"동명사: 전치사 at 뒤에는 동명사 taking 사용","topic":"동명사","memo":"전치사 at 뒤에는 동명사 taking 사용"}]},{"n":16,"tag":null,"en":"Or you can work as a marketers for a soccer team if you are good at thinking creatively.","ko":"또는 창의적으로 생각하는 것을 잘한다면, 축구팀의 마케터로 일할 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"marketers","right":"marketer","partial":false,"at":[6],"point":"명사의 단수형: a 뒤에는 단수명사 marketer 사용","topic":"명사의 단수형","memo":"a 뒤에는 단수명사 marketer 사용"}]},{"n":17,"tag":null,"en":"Look for jobs that match your favorite things and your abilities.","ko":"여러분이 가장 좋아하는 것과 능력에 맞는 직업을 찾아라.","ok":true,"foot":[],"fixes":[]}];var PP=[["Some of you have a dream job in mind, but others do not.","여러분 중의 일부는 꿈의 직업을 염두에 두고 king care of people, you can become a soccer player's manager.","사람을 돌보는 것을 잘한다면, 축구선수의 매니저가 될 수 있다.",0],["Or you can work as a marketer for a soccer team if you are good at thinking creatively.","또는 창의적으로 생각하는 것을 잘한다면, 축구팀의 마케터로 일할 수 있다.",0],["Look for jobs that match your favorite things and your abilities.","여러분이 가장 좋아하는 것과 능력에 맞는 직업을 찾아라.",0]];var RNUM=43;var TITLE_EN="A Journey to Find My Dream";var PASS_EN=["A Journey to Find My Dream","Some of you have a dream job in mind, but others do not. It is not easy for you to find a future job. But we all need to answer the question, \"What do you want to be in the future?\" Think about the following questions, and you will find a path to your future job.","Why Do We Work?","First, we work to make money. Our jobs help us get paid so we can make a living. Second, we work to take on social roles. For example, street cleaners keep our towns and cities clean, and police officers make our society safe. We rely on others to do these important jobs, and everyone has a special role to play. Third, we work to feel proud of our work. By working, we can help others and show our abilities. In the end, we work to find meaning in life.","How Can I Find My Job?","Everyone has their own favorite activities. Try to connect them to a real job, and you will find your path. If you like watching TV shows, you can be a producer or a writer for those shows.","However, liking something and being good at it are not the same. Playing soccer as a job is different from playing it as a hobby. You love soccer but aren't good at it. Then you can look for other jobs in soccer. If you are good at taking care of people, you can become a soccer player's manager. Or you can work as a marketer for a soccer team if you are good at thinking creatively. Look for jobs that match your favorite things and your abilities."];var PASS_KO=["나의 꿈을 찾기 위한 여정","여러분 중의 일부는 꿈의 직업을 염두에 두고 있지만 다른 사람들은 그렇지 않다. 여러분이 미래 직업을 찾는 것은 쉽지 않다. 그러나 우리는 모두 \"당신은 미래에 무엇이 되고 싶은가?\"라는 질문에 답해야 한다. 다음의 질문들을 생각해 보면 여러분의 미래 직업으로 가는 길을 찾게 될 것이다.","왜 우리는 일을 할까?","첫째, 우리는 돈을 벌기 위해 일한다. 우리의 직업은 우리가 돈을 벌 수 있게 돕고 그래서 우리는 생계를 꾸릴 수 있다. 둘째, 우리는 사회적 역할을 맡기 위해 일한다. 예를 들어, 환경미화원은 우리 마을과 도시를 깨끗하게 유지하고, 경찰관은 우리 사회를 안전하게 만든다. 우리는 이런 중요한 일을 하는 사람들에게 의존하며 모두가 맡은 특별한 역할이 있다. 셋째, 우리는 우리의 일에 대해 자부심을 느끼기 위해 일한다. 일을 함으로써 우리는 다른 사람을 돕고 우리의 능력을 보여 줄 수 있다. 결국, 우리는 삶의 의미를 찾기 위해 일한다.","어떻게 나의 직업을 찾을 수 있을까?","모두가 자신만의 가장 좋아하는 활동이 있다. 그것을 실제 직업과 연결해 보라, 그러면 여러분의 길을 찾을 것이다. 여러분이 TV 프로그램 보는 것을 좋아한다면, 그 프로그램들의 프로듀서나 작가가 될 수 있다.","하지만 무언가를 좋아하는 것과 그것을 잘하는 것은 같지 않다. 축구를 직업으로 하는 것은 취미로 하는 것과는 다르다. 축구를 정말 좋아하지만 잘하지 못한다. 그러면 축구에서 다른 직업들을 찾을 수 있다. 사람을 돌보는 것을 잘한다면, 축구선수의 매니저가 될 수 있다. 또는 창의적으로 생각하는 것을 잘한다면, 축구팀의 마케터로 일할 수 있다. 여러분이 가장 좋아하는 것과 능력에 맞는 직업을 찾아라."];var DG=[{"qs":[{"n":1,"q":"What is the girl going to do?","o":["She is going to practice soccer with the boy.","She is going to interview the famous soccer player.","She is going to visit the specific room to listen to Park Somin's talk.","She is going to watch the soccer game with  Park Somin.","She is going to go to classroom 2-3 and have a presentation."],"a":2,"ans":"She is going to visit the specific room to listen to Park Somin's talk.","evs":[["I'll visit room 2-3. I'm interested in soccer.","나는 2-3 교실에 갈 거야. 나는 축구에 관심이 있어."],["Oh, me too. The guest speaker is the famous soccer player, Park Somin! I'm so excited.","아, 나도야. 초청 연사가 유명한 축구 선수 Park Somin이야! 정말 신나."]],"ev":["I'll visit room 2-3. I'm interested in soccer.","나는 2-3 교실에 갈 거야. 나는 축구에 관심이 있어."],"ow":["오답 ✕ — 'Let's go and meet her.'(가서 그녀를 만나 보자.)라고 했을 뿐 소년과 함께 축구를 연습한다는 말은 없어서 틀림. 소녀는 'I'm interested in soccer.'(나는 축구에 관심이 있어.)라고만 했다.","오답 ✕ — 'Let's go and meet her.'(가서 그녀를 만나 보자.)라고 했을 뿐 인터뷰를 한다는 언급은 없어서 틀림.","정답 ○ — 소녀가 'I'll visit room 2-3.'(나는 2-3 교실에 갈 거야.)라고 했고 그곳의 초청 연사가 'the famous soccer player, Park Somin'(유명한 축구 선수 Park Somin)이므로, 그 교실에 가서 Park Somin의 이야기를 들을 것임.","오답 ✕ — 'The guest speaker is the famous soccer player'(초청 연사가 유명한 축구 선수야)라고 했을 뿐 함께 축구 경기를 본다는 r?","Reasons for Working","How to Make Money","What Is My Social Role?"],"a":2,"ans":"Reasons for Working","evs":[["First, we work to make money.","첫째, 우리는 돈을 벌기 위해 일한다."],["Second, we work to take on social roles.","둘째, 우리는 사회적 역할을 맡기 위해 일한다."],["Third, we work to feel proud of our work.","셋째, 우리는 우리의 일에 대해 자부심을 느끼기 위해 일한다."]],"ev":["First, we work to make money.","첫째, 우리는 돈을 벌기 위해 일한다."],"ow":["오답 ✕ — 'street cleaners'(환경미화원)와 'police officers'(경찰관)는 사회적 역할의 예시일 뿐이고, 글의 중심은 다양한 직업 소개가 아니라 일하는 이유라서 틀림.","오답 ✕ — 직업들을 서로 비교해 어느 것이 더 좋은지 말하는 내용은 없고, 'First, we work to make money.'(첫째, 우리는 돈을 벌기 위해 일한다.)처럼 일하는 이유를 설명해서 틀림.","정답 ○ — 'First, we work to make money.', 'Second, we work to take on social roles.', 'Third, we work to feel proud of our work.'와 'In the end, we work to find meaning in life.'(결국, 삶의 의미를 찾기 위해 일한다.)처럼 일하는 이유를 나열하므로 제목으로 알맞음.","오답 ✕ — 돈 버는 방법은 나오지 않고, 'we work to make money'(돈을 벌기 위해 일한다)는 일하는 이유 중 첫 번째일 뿐이라 틀림.","오답 ✕ — 'Second, we work to take on social roles.'(둘째, 우리는 사회적 역할을 맡기 위해 일한다.)는 이유 중 하나일 뿐이라 너무 좁아서 틀림."],"memo":["정답 ③: Reasons for Working (일하는 이유)","근거: First / Second / Third, we work to ... In the end, we work to find meaning in life.(첫째·둘째·셋째 ... 결국 삶의 의미를 찾기 위해 일한다.)","함정: ④⑤는 이유 중 하나(돈, 사회적 역할)만 다뤄서 너무 좁아 ✕"],"why":"돈, 사회적 역할, 자부심, 삶의 의미라는 일하는 이유를 설명하는 글이다."},{"n":8,"q":"윗글에서 언급된 우리가 일하는 이유가 아닌 것은?","o":["돈을 벌기 위해","사회적 역할을 맡기 위해","일에 대해 자부심을 느끼기 위해","삶의 의미를 찾기 위해","유명해지기 위해"],"a":4,"ans":"유명해지기 위해","evs":[["First, we work to make money.","첫째, 우리는 돈을 벌기 위해 일한다."],["Third, we work to feel proud of our work.","셋째, 우리는 우리의 일에 대해 자부심을 느끼기 위해 일한다."],["In the end, we work to find meaning in life.","결국, 우리는 삶의 의미를 찾기 위해 일한다."]],"ev":["First, we work to make money.","첫째, 우리는 돈을 벌기 위해 일한다."],"ow":["오답 ✕ — 'First, we work to make money.'(첫째, 우리는 돈을 벌기 위해 일한다.)라고 했으므로 본문에 언급된 이유임.","오답 ✕ — 'Second, we work to take on social roles.'(둘째, 우리는 사회적 역할을 맡기 위해 일한다.)라고 했으므로 본문에 언급된 이유임.","오답 ✕ — 'Third, we work to feel proud of our work.'(셋째, 우리는 우리의 일에 대해 자부심을 느끼기 위해 일한다.)라고 했으므로 본문에 언급된 이유임.","오답 ✕ — 'In the end, we work to find meaning in life.'(결국, 우리는 삶의 의미를 찾기 위해 일한다.)라고 했으므로 본문에 언급된 이유임.","정답 ○ — 유명해지기 위해 일한다는 언급은 본문에 없음. 가장 가까운 문장은 'we work to feel proud of our work'(우리의 일에 대해 자부심을 느끼기 위해 일한다)로 자부심이지 유명해지는 것이 아님."],"memo":["정답 ⑤: 유명해지기 위해 (본문에 없음)","근거: 돈 - to make money / 사회적 역할 - to take on social roles / 자부심 - to feel proud of our work / 삶의 의미 - to find meaning in life","핵심 어휘: make a living(생계를 꾸리다), take on social roles(사회적 역할을 맡다)"],"why":"일하는 이유는 돈, 사회적 역할, 자부심, 삶의 의미 네 가지이다."}],"pp":[["Why Do We Work?","왜 우리는 일을 할까?"],["First, we work to make money.","첫째, 우리는 돈을 벌기 위해 일한다."],["Our jobs help us get paid so we can make a living.","우리의 직업은 우리가 돈을 벌 수 있게 돕고 그래서 우리는 생계를 꾸릴 수 있다."],["Second, we work to take on social roles.","둘째, 우리는 사회적 역할을 맡기 위해 일한다."],["For example, street cleaners keep our towns and cities clean, and police officers make our society safe.","예를 들어, 환경미화원은 우리 마을과 도시를 깨끗하게 유지하고, 경찰관은 우리 사회를 안전하게 만든다."],["We rely on others to do these important jobs, and everyone has a special role to play.","우리는 이런 중요한 일을 하는 사람들에게 의존하며 모두가 맡은 특별한 역할이 있다."],["Third, we work to feel proud of our work.","셋째, 우리는 우리의 일에 대해 자부심을 느끼기 위해 일한다."],["By working, we can help others and show our abilities.","일을 함으로써 우리는 다른 사람을 돕고 우리의 능력을 보여 줄 수 있다."],["In the end, we work to find meaning in life.","결국, 우리는 삶의 의미를 찾기 위해 일한다."]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하지 않는 것은?","o":["누구나 자신이 가장 좋아하는 활동이 있다.","나의 직업을 찾기 위해 실제 직업과 잘하는 것을 연결할 것을 제안하고 있다.","당신이 좋아하는 것과 당신이 잘하는 것이 다를 수 있다.","직업으로 하는 축구와 취미로 하는 축구는 다르다.","축구를 좋아하고 창의적으로 생각하기를 잘한다면 축구팀 마케터로 일할 수 있다."],"a":1,"ans":"나의 직업을 찾기 위해 실제 직업과 잘하는 것을 연결할 것을 제안하고 있다.","evs":[["Everyone has their own favorite activities.","모두가 자신만의 가장 좋아하는 활동이 있다."],["Try to connect them to a real job, and you will find your path.","그것을 실제 직업과 연결해 보라, 그러면 여러분의 길을 찾을 것이다."]],"ev":["Everyone has their own favorite activities.","모두가 자신만의 가장 좋아하는 활동이 있다."],"ow":["오답 ✕ — 'Everyone has their own favorite activities.'(모두가 자신만의 가장 좋아하는 활동이 있다.)라고 했으므로 이 보기는 본문과 일치함.","정답 ○ — 본문은 'Try to connect them to a real job'(그것을 실제 직업과 연결해 보라)이라고 해서 가장 좋아하는 활동을 실제 직업과 연결하라고 했을 뿐 '잘하는 것'을 연결하라고는 하지 않아 일치하지 않음.","오답 ✕ — 'liking something and being good at it are not the same'(무언가를 좋아하는 것과 그것을 잘하는 것은 같지 않다)이라고 했으므로 이 보기는 본문과 일치함.","오답 ✕ — 'Playing soccer as a job is different from playing it as a hobby.'(축구를 직업으로 하는 것은 취미로 하는 것과는 다르다.)라고 했으므로 이 보기는 본문과 일치함.","오답 ✕ — 'Or you can work as a marketer for a soccer team if you are good at thinking creatively.'(창의적으로 생각하는 것을 잘한다면 축구팀의 마케터로 일할 수 있다.)라고 했으므로 이 보기는 본문과 일치함."],"memo":["정답 ②: 직업을 찾기 위해 실제 직업과 잘하는 것을 연결하라고 제안한다. (✕ 내용)","근거: Everyone has their own favorite activities. Try to connect them to a real job(모두 가장 좋아하는 활동이 있다. 그것을 실제 직업과 연결해 보라)","함정: 연결할 대상은 '잘하는 것'이 아니라 '가장 좋아하는 활동'"],"why":"실제 직업과 연결할 것은 잘하는 것이 아니라 가장 좋아하는 활동이다."},{"n":10,"q":"윗글을 읽고 다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["jobs - manager","hobbies - manager","jobs - doctor","hobbies - teacher","sports - doctor"],"a":0,"ans":"jobs - manager","evs":[["Then you can look for other jobs in soccer.","그러면 축구에서 다른 직업들을 찾을 수 있다."],["If you are good at taking care of people, you can become a soccer player's manager.","사람을 돌보는 것을 잘한다면, 축구선수의 매니저가 될 수 있다."]],"ev":["Then you can look for other jobs in soccer.","그러면 축구에서 다른 직업들을 찾을 수 있다."],"ow":["정답 ○ — 'Then you can look for other jobs in soccer.'(그러면 축구에서 다른 직업들을 찾을 수 있다.)이므로 (A)는 jobs, 'you can become a soccer player's manager'(축구선수의 매니저가 될 수 있다)이므로 (B)는 manager가 맞음.","오답 ✕ — (B) manager는 맞지만, 'you can look for other jobs in soccer'(축구에서 다른 직업들을 찾을 수 있다)이므로 (A)가 hobbies가 아니라 jobs라서 틀림.","오답 ✕ — (A) jobs는 맞지만, 본문에 나오는 축구 관련 직업은 manager와 marketer이고 doctor는 나오지 않아서 틀림.","오답 ✕ — 'other jobs in soccer'이므로 (A)가 hobbies가 아니고, 본문에 teacher도 나오지 않아서 둘 다 틀림.","오답 ✕ — 'look for other jobs'(다른 직업들을 찾다)이므로 (A)가 sports가 아니고, doctor는 본문에 나오지 않아서 둘 다 틀림."],"memo":["정답 ①: jobs - manager","근거: Then you can look for other jobs in soccer var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}

  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
