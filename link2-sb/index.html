// ===== 기본개념확인 A (p.173) =====
C("BC","A",1,"주어진 문장이 가정법 과거인지 가정법 과거완료인지 쓰시오.<br>If you studied harder, you would get better grades.",["가정법 과거","가정법 과거완료"],"가정법 과거","If you studied harder, you would get better grades.","네가 더 열심히 공부한다면, 너는 더 좋은 성적을 받을 텐데.",
 "본책 p.172 맨 위 표(가정법 과거 / 가정법 과거완료)에서 ‘if절의 동사’ 줄을 보세요.","1) if절의 동사 studied(원형 study: 공부하다)의 모양을 보세요.  2) 표에서 if절 동사가 ‘과거형’이면 한쪽, ‘과거완료형(had p.p.)’이면 다른 쪽이에요.  3) 주절 would get(얻을 텐데)도 단서예요.","studied는 had가 붙지 않은 그냥 과거형이에요. 두 보기 중 ‘완료’ 글자가 없는 쪽이에요.","if절 과거형 → 가정법 과거");
C("BC","A",2,"주어진 문장이 가정법 과거인지 가정법 과거완료인지 쓰시오.<br>If I liked hamburgers, I would go to that restaurant.",["가정법 과거","가정법 과거완료"],"가정법 과거","If I liked hamburgers, I would go to that restaurant.","내가 햄버거를 좋아한다면, 나는 그 식당에 갈 텐데.",
 "본책 p.172 표의 ‘if절의 동사’ 줄을 먼저 확인해요.","1) liked(원형 like: 좋아하다)는 어떤 모양인가요? had가 앞에 붙어 있나요?  2) 주절의 would go(갈 텐데)는 would 뒤에 동사원형이 왔어요.","if절 동사에 had가 없어요. 그래서 ‘과거완료’가 아닌 쪽을 골라요.","과거형 + would 원형 → 가정법 과거");
C("BC","A",3,"주어진 문장이 가정법 과거인지 가정법 과거완료인지 쓰시오.<br>If we had had money, we could have ordered a pizza.",["가정법 과거","가정법 과거완료"],"가정법 과거완료","If we had had money, we could have ordered a pizza.","우리에게 돈이 있었다면, 우리는 피자를 주문할 수 있었을 텐데.",
 "본책 p.172 표에서 ‘과거 사실과 반대’를 말하는 오른쪽 칸(가정법 과거완료)을 보세요.","1) if절에 had had가 보여요. 앞의 had는 도우미, 뒤의 had(원형 have: 가지다)는 p.p.예요.  2) 주절의 could have ordered(주문할 수 있었을 텐데)도 ‘have p.p.’ 모양이에요.","had + p.p.가 나오면 ‘완료’가 들어간 쪽이에요.","had p.p. + could have p.p. → 과거완료");
C("BC","A",4,"주어진 문장이 가정법 과거인지 가정법 과거완료인지 쓰시오.<br>If I won the lottery, I would travel the world.",["가정법 과거","가정법 과거완료"],"가정법 과거","If I won the lottery, I would travel the world.","내가 복권에 당첨된다면, 나는 세계를 여행할 텐데.",
 "본책 p.172 표에서 가정법 과거 칸의 ‘현재 사실과 반대’ 설명을 읽어 보세요.","1) won(원형 win: 이기다, 당첨되다)은 단순 과거형이에요. had won이 아니에요.  2) 주절 would travel(여행할 텐데)은 would + 동사원형이에요.","if절에 had가 없으니 ‘과거완료’가 아닌 쪽이에요.","won(과거형) + would 원형 → 가정법 과거");
C("BC","A",5,"주어진 문장이 가정법 과거인지 가정법 과거완료인지 쓰시오.<br>If you had said sorry, I would have forgiven you.",["가정법 과거","가정법 과거완료"],"가정법 과거완료","If you had said sorry, I would have forgiven you.","네가 미안하다고 말했다면, 나는 너를 용서했을 텐데.",
 "본책 p.172 표에서 ‘if절의 동사’가 과거완료형인 칸을 찾아보세요.","1) had said(원형 say: 말하다)는 had + p.p. 모양이에요.  2) 주절의 would have forgiven(원형 forgive: 용서하다)도 would have p.p. 모양이에요.","if절과 주절이 모두 ‘p.p.’ 모양이니 ‘완료’가 들어간 쪽이에요.","had p.p. + would have p.p. → 과거완료");
C("BC","A",6,"주어진 문장이 가정법 과거인지 가정법 과거완료인지 쓰시오.<br>If she wanted your help, she would ask you for it.",["가정법 과거","가정법 과거완료"],"가정법 과거","If she wanted your help, she would ask you for it.","그녀가 너의 도움을 원한다면, 그녀는 너에게 그것을 부탁할 텐데.",
 "본책 p.172 표의 ‘if절의 동사’ 줄(과거형 / 과거완료형)을 다시 봐요.","1) wanted(원형 want: 원하다)는 그냥 과거형이에요.  2) 주절 would ask(부탁할 텐데)는 would 뒤에 동사원형이 왔어요.","had p.p.가 없어요. 과거완료가 아닌 쪽이에요.","wanted(과거형) + would ask → 가정법 과거");
C("BC","A",7,"주어진 문장이 가정법 과거인지 가정법 과거완료인지 쓰시오.<br>If the baby had fallen asleep earlier, I could have read a book.",["가정법 과거","가정법 과거완료"],"가정법 과거완료","If the baby had fallen asleep earlier, I could have read a book.","아기가 더 일찍 잠들었다면, 나는 책을 읽을 수 있었을 텐데.",
 "본책 p.172 표에서 오른쪽 ‘가정법 과거완료’ 칸의 if절 동사를 보세요.","1) had fallen(원형 fall: 떨어지다, 여기서는 fall asleep 잠들다)은 had + p.p.예요.  2) 주절 could have read(원형 read: 읽다)도 have p.p. 모양이에요.","문장이 길어도 if 바로 뒤 동사 모양만 보면 돼요. had가 있어요.","had fallen + could have read → 가정법 과거완료");
// ===== B =====
C("BC","B",1,"( ) 안에서 알맞은 말을 고르시오.<br>As it is expensive, I can’t buy it.<br>If it (weren’t / were) expensive, I could buy it.",["weren’t","were"],"weren’t","If it weren’t expensive, I could buy it.","만약 그것이 비싸지 않다면, 나는 그것을 살 수 있을 텐데.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스를 펴세요. 긍정 ↔ 부정이 바뀌어요.","1) 위 문장은 As it is expensive(그것은 비싸다)로 ‘긍정’이에요.  2) 가정법으로 바꾸면 반대가 돼요. 긍정은 부정으로 바꿔요.  3) 주절 could buy(살 수 있을 텐데)는 가정법 과거예요.","비싸다의 반대는 ‘비싸지 않다’예요. were에 not이 붙은 줄임말(-n’t로 끝나는) 보기예요.","직설법 긍정 → 가정법 부정으로");
C("BC","B",2,"( ) 안에서 알맞은 말을 고르시오.<br>As I didn’t have time, I couldn’t go to Yumi’s birthday party.<br>If I (had / had had) time, I could have gone to Yumi’s birthday party.",["had","had had"],"had had","If I had had time, I could have gone to Yumi’s birthday party.","내가 시간이 있었다면, 나는 유미의 생일 파티에 갈 수 있었을 텐데.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스에서 ‘가정법 과거완료 ↔ 직설법 과거’ 예문 쌍을 보세요.","1) 첫 문장이 didn’t have(가지지 않았다)라서 과거 사실이에요.  2) 과거 사실의 반대이니 가정법 과거완료예요.  3) 주절 could have gone(갈 수 있었을 텐데)도 완료 모양이에요.","had + p.p.에서 have(가지다)의 p.p.는 had예요. 그래서 had가 두 번 나와요.","과거 사실 반대 → had + p.p.(had had)");
C("BC","B",3,"( ) 안에서 알맞은 말을 고르시오.<br>As Nikki doesn’t live by the beach, she doesn’t swim in the sea every day.<br>If Nikki (lives / lived) by the beach, she would swim in the sea every day.",["lives","lived"],"lived","If Nikki lived by the beach, she would swim in the sea every day.","니키가 해변가에 산다면, 그녀는 매일 바다에서 수영할 텐데.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스에서 ‘가정법 과거는 직설법 현재로’ 부분을 보세요.","1) 첫 문장이 doesn’t live(살지 않는다)로 현재 사실이에요.  2) 현재 사실의 반대는 가정법 과거예요.  3) 주절에 would swim(수영할 텐데)이 있어요.","if절 동사는 과거형이에요. l로 시작하는 보기 중 -ed로 끝나는 쪽이에요.","현재 사실 반대 → if절 과거형");
C("BC","B",4,"( ) 안에서 알맞은 말을 고르시오.<br>As I don’t know Japanese, I can’t read this book.<br>If I (didn’t know / knew) Japanese, I could read this book.",["didn’t know","knew"],"knew","If I knew Japanese, I could read this book.","내가 일본어를 안다면, 나는 이 책을 읽을 수 있을 텐데.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스에서 긍정 ↔ 부정이 바뀐다는 설명을 다시 읽어 보세요.","1) 첫 문장은 I don’t know(나는 모른다)로 부정이에요.  2) 가정법은 반대이니 긍정이 돼요.  3) 그러면 if절은 ‘안다’ 쪽이에요.","know(알다)의 과거형이에요. k로 시작하고 didn’t가 없는 보기예요.","부정 사실 → 가정법은 긍정 과거형");
// ===== C 가정법 vs 조건문 =====
C("BC","C",1,"주어진 문장이 가정법인지 단순 조건문인지 고르시오.<br>If I find your missing ring, I will contact you.",["가정법","조건문"],"조건문","If I find your missing ring, I will contact you.","내가 너의 잃어버린 반지를 찾으면, 나는 너에게 연락할게.",
 "본책 p.172 맨 아래 ‘가정법 vs. 단순 조건문’ 표를 보세요.","1) if절 동사 find(찾다)는 현재형이에요.  2) 주절은 will contact(연락할 것이다)로 will을 썼어요.  3) 표에서 will이 나오는 쪽이 어느 줄인지 봐요.","실제로 일어날 수 있는 일을 말해요. ‘가정법’이 아닌 쪽이에요.","if + 현재형, will → 단순 조건문");
C("BC","C",2,"주어진 문장이 가정법인지 단순 조건문인지 고르시오.<br>If you gave me more time, I would do a better job.",["가정법","조건문"],"가정법","If you gave me more time, I would do a better job.","네가 나에게 시간을 더 준다면, 나는 더 잘할 텐데.",
 "본책 p.172 ‘가정법 vs. 단순 조건문’ 표에서 would가 나오는 줄을 찾아보세요.","1) if절 gave(원형 give: 주다)는 과거형인데 뜻은 ‘지금’ 이야기예요.  2) 주절에 would do(할 텐데)가 있어요.  3) 과거형 + would는 표의 어느 줄일까요?","실제로 일어날 가능성이 거의 없다고 보는 말이에요. g로 시작하는 보기예요.","if 과거형 + would → 가정법");
C("BC","C",3,"주어진 문장이 가정법인지 단순 조건문인지 고르시오.<br>If you take a break now, you will feel better.",["가정법","조건문"],"조건문","If you take a break now, you will feel better.","네가 지금 휴식을 취하면, 너는 기분이 더 나아질 거야.",
 "본책 p.172 ‘가정법 vs. 단순 조건문’ 표의 두 줄을 비교해 보세요.","1) take(취하다)는 현재형이고 now(지금)가 있어요.  2) 주절은 will feel(느낄 것이다)이에요.  3) 실제로 휴식을 취할 수 있는 상황이에요.","현재형 + will은 ‘일어날 수 있는 일’을 말해요. 조로 시작하는 보기예요.","if 현재형 + will → 조건문");
C("BC","C",4,"주어진 문장이 가정법인지 단순 조건문인지 고르시오.<br>If it rains tomorrow, I will stay home.",["가정법","조건문"],"조건문","If it rains tomorrow, I will stay home.","내일 비가 오면, 나는 집에 있을 거야.",
 "본책 p.172 맨 아래 ‘가정법 vs. 단순 조건문’ 표의 아래 줄(조건문)과 비교해 보세요.","1) rains(원형 rain: 비가 오다)는 현재형이에요. 내일 일은 올 수도 있어요.  2) 주절은 will stay(머무를 것이다)예요.","표의 예문(If it snows, ... will)과 같은 모양이에요. ‘조건’이 들어간 쪽이에요.","if 현재형, will → 조건문");
C("BC","C",5,"주어진 문장이 가정법인지 단순 조건문인지 고르시오.<br>If you exercise more often, you will be healthier.",["가정법","조건문"],"조건문","If you exercise more often, you will be healthier.","네가 더 자주 운동하면, 너는 더 건강해질 거야.",
 "본책 p.172 ‘가정법 vs. 단순 조건문’ 표에서 will이 쓰인 줄을 보세요.","1) exercise(운동하다)는 현재형이에요.  2) 주절 will be(될 것이다)에 will이 있어요.  3) 운동은 실제로 할 수 있는 일이에요.","가정법이 아니에요. 실제로 일어날 수 있는 일을 말하는 쪽이에요.","현재형 + will → 가능성 있는 조건문");
C("BC","C",6,"주어진 문장이 가정법인지 단순 조건문인지 고르시오.<br>If she came here, I would be very happy.",["가정법","조건문"],"가정법","If she came here, I would be very happy.","그녀가 여기에 온다면, 나는 정말 행복할 텐데.",
 "본책 p.172 맨 아래 ‘가정법 vs. 단순 조건문’ 표의 위 줄(가정법)과 비교해 보세요.","1) came(원형 come: 오다)은 과거형이에요.  2) 주절에 would be(될 텐데)가 있어요.  3) 올 가능성이 거의 없다고 생각하는 말투예요.","과거형 + would 모양이에요. 첫 번째 보기, 가로 시작하는 쪽이에요.","came + would be → 일어나기 어려운 일(가정법)");
// ===== UNIT 1 Quiz =====
C(1,"Q",1,"다음 문장으로 알 수 있는 것은?<br>If the smartwatch were cheaper, I would buy it.",["나는 스마트워치를 샀다.","나는 스마트워치를 사지 않았다."],"나는 스마트워치를 사지 않았다.","If the smartwatch were cheaper, I would buy it.","스마트워치가 더 싸다면, 나는 그것을 살 텐데.",
 "본책 p.174 ‘가정법 과거’ 설명 첫 줄(현재 사실과 반대)을 읽어 보세요.","1) if절에 were(원형 be: ~이다)가 있고 주절에 would buy(살 텐데)가 있어요.  2) 가정법은 사실과 반대로 말하는 거예요.  3) ‘더 싸다면 살 텐데’의 사실은 무엇일까요?","지금 싸지 않아서 사지 않은 거예요. 두 번째 보기예요.","가정법은 사실의 반대를 말함");
// ===== UNIT 1 A =====
C(1,"A",1,"( ) 안에서 알맞은 말을 고르시오.<br>If Shelly (hears / heard) this story, she would cry.",["hears","heard"],"heard","If Shelly heard this story, she would cry.","셸리가 이 이야기를 듣는다면, 그녀는 울 텐데.",
 "본책 p.174 ‘가정법 과거’ 박스의 공식(If + 주어 + 동사의 과거형 ~, 주어 + would ...)을 보세요.","1) 주절에 would cry(울 텐데)가 있어요. would는 가정법 과거의 짝이에요.  2) 가정법 과거의 if절 동사는 어떤 형태일까요?","if절 동사는 과거형이에요. 끝이 -s가 아닌 보기, h로 시작해요.","would 짝 → if절 과거형(heard)");
C(1,"A",2,"( ) 안에서 알맞은 말을 고르시오.<br>If I had had time, I (would got / would have gotten) a haircut.",["would got","would have gotten"],"would have gotten","If I had had time, I would have gotten a haircut.","내가 시간이 있었다면, 나는 머리를 잘랐을 텐데.",
 "본책 p.174 ‘가정법 과거완료’ 박스의 공식(주어 + would + have p.p. ...)을 확인하세요.","1) if절이 had had(가졌었다면)라서 가정법 과거완료예요.  2) 주절은 would 뒤에 어떤 모양이 와야 할까요?  3) would 바로 뒤에 과거형은 올 수 없어요.","would + have + p.p. 모양이에요. 길이가 더 긴 보기예요. (get의 p.p.: gotten)","if절 had p.p. → 주절 would have p.p.");
C(1,"A",3,"( ) 안에서 알맞은 말을 고르시오.<br>If I (was / were) a superhero, I would save the world.",["was","were"],"were","If I were a superhero, I would save the world.","내가 슈퍼히어로라면, 나는 세상을 구할 텐데.",
 "본책 p.174 POINT 1 아래 ‘내신 적중’ 박스를 읽어 보세요.","1) 주절에 would save(구할 텐데)가 있어서 가정법 과거예요.  2) 주어가 I라도 be동사는 특별한 규칙이 있어요.  3) 박스의 규칙을 그대로 적용해요.","인칭·수에 상관없이 쓰는 be동사예요. w로 시작하고 -re로 끝나요.","가정법 과거의 be동사는 were");
C(1,"A",4,"( ) 안에서 알맞은 말을 고르시오.<br>If I (knew / had known) that the milk was expired, I wouldn’t have drunk it.",["knew","had known"],"had known","If I had known that the milk was expired, I wouldn’t have drunk it.","내가 그 우유가 상한 것을 알았다면, 나는 그것을 마시지 않았을 텐데.",
 "본책 p.174 ‘가정법 과거완료’ 박스에서 주절 모양(would + have p.p.)을 먼저 보세요.","1) 주절 wouldn’t have drunk(원형 drink: 마시다)가 ‘have p.p.’ 모양이에요.  2) 짝이 되는 if절은 한 단계 앞선 시제예요.","if절은 had + p.p.예요. know(알다)의 p.p.는 known이에요. 두 번째 보기예요.","주절 would have p.p. ← if절 had p.p.");
// ===== UNIT 1 B =====
W(1,"B",1,"밑줄 친 부분이 어법상 맞으면 O를, 틀리면 바르게 고치시오.<br>If I <u>lived</u> in Australia, I could see kangaroos.","O","If I lived in Australia, I could see kangaroos.","내가 호주에 산다면, 나는 캥거루를 볼 수 있을 텐데.",
 "본책 p.174 ‘가정법 과거’ 첫 번째 박스(if절 과거형 + could 동사원형)를 보세요.","1) 주절에 could see(볼 수 있을 텐데)가 있어요.  2) 그럼 if절은 어떤 시제여야 하는지 생각해요.  3) lived(원형 live: 살다)가 그 모양과 맞는지 확인해요.","lived는 과거형이에요. 과거형이 와야 할 자리에 과거형이 왔는지만 확인하면 돼요.","if 과거형 + could 원형 → 맞음(O)");
W(1,"B",2,"밑줄 친 부분이 어법상 맞으면 O를, 틀리면 바르게 고치시오.<br>If I <u>was</u> you, I would go to the concert.","were","If I were you, I would go to the concert.","내가 너라면, 나는 그 콘서트에 갈 텐데.",
 "본책 p.174 POINT 1 아래 ‘내신 적중’ 박스의 be동사 규칙을 읽어 보세요.","1) 주절에 would go(갈 텐데)가 있어서 가정법 과거예요.  2) 가정법 과거의 if절에서 be동사는 정해진 모양이 있어요.  3) was는 그 규칙에 맞을까요?","w로 시작하는 네 글자예요. 인칭에 상관없이 쓰는 be동사예요.","가정법 과거 if절 be동사 → were");
W(1,"B",3,"밑줄 친 부분이 어법상 맞으면 O를, 틀리면 바르게 고치시오.<br>If I <u>had had</u> a purple colored pencil, I could complete my rainbow drawing.","had","If I had a purple colored pencil, I could complete my rainbow drawing.","내게 보라색 색연필이 있다면, 나는 무지개 그림을 완성할 수 있을 텐데.",
 "본책 p.174 POINT 1 ‘가정법 과거’ 표와 POINT 2 ‘가정법 과거완료’ 표를 나란히 놓고, POINT 2 아래 ‘내신 적중’ 박스(if절과 주절의 시제에 유의)를 읽어 보세요.","1) 먼저 주절을 봐요. could complete(완성할 수 있을 텐데)는 could 뒤에 동사원형이 온 가정법 과거의 주절이에요.  2) 주절이 가정법 과거이면 if절도 가정법 과거, 즉 동사의 과거형이어야 해요.  3) 밑줄 had had는 had + p.p.(과거완료) 모양이라 주절과 짝이 안 맞아요.","have(가지다)의 과거형 한 단어로 고쳐요. h로 시작하는 세 글자예요.","주절 could 원형이면 if절은 과거형(had had X)");
W(1,"B",4,"밑줄 친 부분이 어법상 맞으면 O를, 틀리면 바르게 고치시오.<br>If there were a park in front of my house, I <u>would have exercised</u> there every day.","would exercise","If there were a park in front of my house, I would exercise there every day.","우리 집 앞에 공원이 있다면, 나는 매일 거기서 운동할 텐데.",
 "본책 p.174 ‘가정법 과거’와 ‘가정법 과거완료’ 박스의 주절 모양을 비교해 보세요.","1) if절이 were(원형 be: ~이다)라서 가정법 과거예요.  2) 가정법 과거의 주절은 would + 동사원형이에요.  3) 밑줄은 would have p.p. 모양이라 짝이 안 맞아요.","would 뒤를 동사원형으로 바꿔서 두 단어(would + 동사원형)로 고쳐 써요.","if절 과거형이면 주절은 would 원형");
// ===== UNIT 1 C =====
W(1,"C",1,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>As there isn’t Wi-Fi here, I can’t connect my laptop to the internet.<br>If there ___ Wi-Fi here, I ___ ___ my laptop to the internet.","were, could connect","If there were Wi-Fi here, I could connect my laptop to the internet.","여기에 와이파이가 있다면, 나는 내 노트북을 인터넷에 연결할 수 있을 텐데.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스와 p.174 가정법 과거 공식을 같이 보세요.","1) As there isn’t(없다)와 can’t connect(연결할 수 없다)는 현재 사실이에요.  2) 가정법 과거로 바꾸면 긍정으로 바뀌어요.  3) if절은 be동사 규칙, 주절은 could + 동사원형이에요.","첫 칸은 be동사 규칙대로 w로 시작하는 네 글자, 둘째·셋째 칸은 ‘~할 수 있을 텐데’의 조동사 + 위 문장의 동사원형이에요.","현재 사실 부정 → If 과거 + could 원형");
W(1,"C",2,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>As they didn’t take a different route, they didn’t arrive faster.<br>If they ___ ___ a different route, they ___ ___ ___ faster.","had taken, would have arrived","If they had taken a different route, they would have arrived faster.","그들이 다른 길로 갔다면, 그들은 더 빨리 도착했을 텐데.",
 "본책 p.174 ‘가정법 과거완료’ 박스의 공식(If + had p.p. ~, would have p.p.)을 보세요.","1) didn’t take(원형 take: 타다, 택하다), didn’t arrive(원형 arrive: 도착하다)는 모두 과거 사실이에요.  2) 과거 사실의 반대이니 가정법 과거완료예요.  3) 부정이 긍정으로 바뀌어요.","앞 2칸은 had + take의 p.p., 뒤 3칸은 would + have + arrive의 p.p.예요. take의 p.p.는 -en으로 끝나요.","과거 사실 반대 → had p.p., would have p.p.");
W(1,"C",3,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>As you left the house so late, you missed the train.<br>If you ___ ___ the house so late, you ___ ___ ___ the train.","hadn’t left, wouldn’t have missed","If you hadn’t left the house so late, you wouldn’t have missed the train.","네가 집을 그렇게 늦게 나서지 않았다면, 너는 기차를 놓치지 않았을 텐데.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스에서 긍정 ↔ 부정이 바뀐다는 줄과 p.174 가정법 과거완료 공식을 같이 보세요.","1) left(원형 leave: 떠나다), missed(원형 miss: 놓치다)는 둘 다 과거 사실이고 긍정이에요.  2) 가정법으로 바꾸면 부정이 돼요.  3) if절은 had + not + p.p., 주절은 would + not + have p.p.예요.","앞 2칸은 had not을 줄인 말(h로 시작) + leave의 p.p., 뒤 3칸은 would not을 줄인 말 + have + miss의 p.p.예요.","긍정 과거사실 → 가정법 과거완료 부정");
// ===== UNIT 1 D =====
W(1,"D",1,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>내가 쿠키 굽는 방법을 안다면, 그녀에게 알려줄 텐데. (know, will, teach)<br>If I ___ how to bake cookies, I ___ ___ her.","knew, would teach","If I knew how to bake cookies, I would teach her.","내가 쿠키 굽는 방법을 안다면, 나는 그녀에게 가르쳐 줄 텐데.",
 "본책 p.174 ‘가정법 과거’ 박스의 공식(If + 주어 + 동사의 과거형 ~, 주어 + would ...)을 보세요.","1) ‘안다면, 알려줄 텐데’는 현재 사실의 반대예요.  2) 그러면 가정법 과거예요.  3) 힌트 단어 will은 가정법 과거에서 과거형으로 바꿔 써요.","첫 칸은 know의 과거형(k로 시작하는 불규칙 네 글자), 둘째 칸은 will의 과거형, 셋째 칸은 teach(가르치다) 그대로예요.","가정법 과거: if 과거형, would 원형");
W(1,"D",2,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>만약 오늘 날씨가 좋았다면, 그들이 테니스를 쳤을지도 모를 텐데. (be, may, play)<br>If the weather ___ ___ nice today, they ___ ___ ___ tennis.","had been, might have played","If the weather had been nice today, they might have played tennis.","만약 오늘 날씨가 좋았다면, 그들은 테니스를 쳤을지도 모를 텐데.",
 "본책 p.174 POINT 2 ‘가정법 과거완료’ 표 오른쪽 설명 중 세 번째 줄(만약 ~였다면 ···했을지도 모를 텐데)을 보세요.","1) 우리말이 ‘좋았다면, 쳤을지도 모를 텐데’예요. today(오늘)가 있어도, 이미 지나간 오늘의 일(날씨가 좋지 않아서 테니스를 못 쳤다)을 거꾸로 상상하는 말이에요.  2) 지나간 일의 반대이니 가정법 과거완료로 써요.  3) 힌트 단어 may는 과거형으로 바꾸고, 그 뒤에 have p.p.를 붙여요.","앞 2칸은 had + be의 p.p.(b로 시작하는 네 글자), 뒤 3칸은 may의 과거형(m으로 시작) + have + play의 p.p.예요.","과거 반대 + 추측 → had p.p., might have p.p.");
W(1,"D",3,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>우리에게 농장이 있다면, 나는 당근을 키울 수 있을 텐데. (have, can, grow)<br>If we ___ a farm, I ___ ___ some carrots.","had, could grow","If we had a farm, I could grow some carrots.","우리에게 농장이 있다면, 나는 당근을 키울 수 있을 텐데.",
 "본책 p.174 POINT 1 ‘가정법 과거’ 표 오른쪽 설명 중 가운데 줄(만약 ~라면 ···할 수 있을 텐데)을 보세요.","1) 지금 농장이 없다는 사실의 반대예요. 가정법 과거예요.  2) have(가지다)는 if절에서 과거형으로 써요.  3) 힌트 단어 can은 가정법 과거에서 과거형으로 바꿔 써요.","첫 칸은 have의 과거형(h로 시작하는 세 글자), 둘째 칸은 can의 과거형, 셋째 칸은 grow(키우다) 그대로예요.","if 과거형, could 원형");
// ===== UNIT 2 Quiz =====
C(2,"Q",1,"다음 문장으로 알 수 있는 것은?<br>I wish I could play the guitar.",["나는 기타를 연주할 수 있다.","나는 기타를 연주할 수 없다."],"나는 기타를 연주할 수 없다.","I wish I could play the guitar.","내가 기타를 연주할 수 있다면 좋을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거’ 박스에서 괄호 속 I’m sorry that ... 문장을 보세요.","1) I wish는 ‘~라면 좋을 텐데’라는 아쉬운 소망이에요.  2) 소망은 현재 이루지 못한 일에 대해서 해요.  3) 그럼 실제로는 기타를 어떻게 할까요?","could play(연주할 수 있다면)가 소망이니 지금은 못 한다는 뜻이에요. 두 번째 보기예요.","I wish 가정법 = 지금은 못 하는 일");
// ===== UNIT 2 A =====
C(2,"A",1,"( ) 안에서 알맞은 말을 고르시오.<br>I wish I (had / had had) a dog right now.",["had","had had"],"had","I wish I had a dog right now.","내가 지금 개가 있다면 좋을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거’(POINT 1) 박스를 보세요.","1) 문장 끝에 right now(지금 당장)가 있어요.  2) 지금의 소망이면 가정법 과거예요.  3) 과거완료(had p.p.)는 지난 일에 쓰는 거예요.","have(가지다)의 단순 과거형 한 단어예요. had가 한 번만 나오는 보기예요.","현재 소망 → I wish + 과거형");
C(2,"A",2,"( ) 안에서 알맞은 말을 고르시오.<br>I wish I (were not / had not been) an only child. I always feel bored.",["were not","had not been"],"were not","I wish I were not an only child. I always feel bored.","내가 외동이 아니라면 좋을 텐데. 나는 항상 지루해.",
 "본책 p.176 ‘I wish + 가정법 과거’(POINT 1)의 were 설명을 보세요.","1) 뒤 문장 I always feel bored(나는 항상 지루하다)가 현재 이야기예요.  2) 그러면 소망도 현재 기준이에요.  3) 현재 소망이면 I wish 뒤에 be동사 과거형을 써요.","be동사 과거형 were를 쓴 보기예요. had가 안 들어가요.","현재 소망 → I wish + were");
C(2,"A",3,"( ) 안에서 알맞은 말을 고르시오.<br>I wish I (went / had gone) to bed earlier yesterday. I am so sleepy now.",["went","had gone"],"had gone","I wish I had gone to bed earlier yesterday. I am so sleepy now.","내가 어제 더 일찍 잤더라면 좋았을 텐데. 나는 지금 너무 졸려.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스를 보세요.","1) 문장에 yesterday(어제)가 있어요.  2) 어제 못 한 일에 대한 소망이니 과거 사실의 반대예요.  3) 이럴 때는 had p.p. 모양을 써요.","go(가다)의 p.p.는 gone이에요. had가 들어간 보기예요.","과거 소망 → I wish + had p.p.");
C(2,"A",4,"( ) 안에서 알맞은 말을 고르시오.<br>I got a disappointing score. I wish I (studied / had studied) harder for the test.",["studied","had studied"],"had studied","I got a disappointing score. I wish I had studied harder for the test.","나는 실망스러운 점수를 받았다. 내가 그 시험을 위해 더 열심히 공부했더라면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스의 첫 번째 예문 쌍을 보세요.","1) 앞 문장에서 이미 점수를 받았어요(got: 원형 get 받다). 지난 일이에요.  2) 이미 끝난 일을 후회하는 소망이에요.  3) 그러면 과거완료 모양이에요.","study(공부하다)의 p.p.는 studied이고 앞에 had가 붙어요.","지난 일 후회 → I wish + had p.p.");
// ===== UNIT 2 B =====
W(2,"B",1,"( ) 안의 말을 이용하여 문장을 완성하시오.<br>James looks as if he ___ sick now. (be)","were","James looks as if he were sick now.","제임스는 지금 아픈 것처럼 보인다.",
 "본책 p.176 ‘as if + 가정법 과거’(POINT 3) 박스를 보세요.","1) 문장 끝에 now(지금)가 있고 주절 looks(원형 look: ~해 보이다)도 현재예요.  2) 주절과 같은 시점의 사실 반대이니 가정법 과거예요.  3) be동사는 특별한 모양을 써요.","w로 시작하는 네 글자예요. 인칭과 수에 상관없이 쓰는 be동사 과거형이에요.","as if + 가정법 과거 → be는 were");
W(2,"B",2,"( ) 안의 말을 이용하여 문장을 완성하시오.<br>I feel as if I ___ lunch already. (eat)","had eaten","I feel as if I had eaten lunch already.","나는 이미 점심을 먹은 것처럼 느껴진다.",
 "본책 p.176 ‘as if + 가정법 과거완료’(POINT 4) 박스를 보세요.","1) already(이미)가 있어요. 주절 feel(느끼다)보다 먼저 일어난 일이에요.  2) 주절보다 앞선 시점이니 had p.p.를 써요.  3) eat(먹다)의 p.p.를 생각해요.","had 뒤에 eat의 p.p.를 써요. e로 시작하는 다섯 글자예요.","주절보다 앞선 일 → as if + had p.p.");
W(2,"B",3,"( ) 안의 말을 이용하여 문장을 완성하시오.<br>My sister wears my clothes as if she ___ them. (own)","owned","My sister wears my clothes as if she owned them.","내 여동생은 마치 자기가 내 옷의 주인인 것처럼 입는다.",
 "본책 p.176 ‘as if + 가정법 과거’(POINT 3) 박스의 공식(as if + 주어 + 동사의 과거형)을 보세요.","1) 주절 wears(원형 wear: 입다)는 현재예요.  2) 같은 시점의 사실과 반대로 말하는 거예요(실제로는 주인이 아니에요).  3) own(소유하다)을 어떤 모양으로 쓸까요?","own의 과거형으로 -ed를 붙여요. o로 시작하는 다섯 글자예요.","주절과 같은 시점 → as if + 과거형");
W(2,"B",4,"( ) 안의 말을 이용하여 문장을 완성하시오.<br>Gloria talks as if she ___ Brad at that time. (not, like)","hadn’t[had not] liked","Gloria talks as if she hadn’t liked Brad at that time.","글로리아는 마치 그때 브래드를 좋아하지 않았던 것처럼 말한다.",
 "본책 p.176 ‘as if + 가정법 과거완료’(POINT 4) 박스를 보세요.","1) at that time(그때)은 지금보다 앞선 때예요.  2) 주절 talks(원형 talk: 말하다)보다 앞선 시점이에요.  3) 따라서 had p.p.이고, not이 있으니 부정이에요.","had와 not 뒤에 like의 p.p.를 붙여요. had not은 줄임말(h로 시작)로 써도 돼요.","앞선 시점 + 부정 → as if + hadn’t p.p.");
// ===== UNIT 2 C =====
W(2,"C",1,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>I’m sorry that I have a peach allergy.<br>I wish I ___.","didn’t have a peach allergy","I wish I didn’t have a peach allergy.","내가 복숭아 알레르기가 없다면 좋을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거’(POINT 1) 박스의 괄호 속 I’m sorry that ... 문장을 보세요.","1) I’m sorry that I have(가지고 있다)는 현재 아쉬움이에요.  2) 현재 소망이니 I wish + 과거형이에요.  3) 긍정(have)이 부정으로 바뀌어요.","부정 조동사(d로 시작하는 줄임말) + 동사원형 + 위 문장의 알레르기 표현을 그대로 옮겨요. 모두 다섯 단어예요.","현재 아쉬움 → I wish + didn’t 원형");
W(2,"C",2,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>I’m sorry that I didn’t answer his calls earlier.<br>I wish I ___ earlier.","had answered his calls","I wish I had answered his calls earlier.","내가 그의 전화를 더 일찍 받았더라면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스에서 I’m sorry that I didn’t ... 예문을 보세요.","1) I’m sorry that I didn’t answer(원형 answer: 받다, 대답하다)는 과거의 아쉬움이에요.  2) 과거의 소망이니 had p.p.예요.  3) didn’t(부정)는 긍정으로 바뀌어요.","had + answer의 p.p.로 시작하고, 위 문장의 목적어를 그대로 이어요. 모두 네 단어예요.","과거 아쉬움 → I wish + had p.p.");
W(2,"C",3,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>In fact, Miranda isn’t a swimmer.<br>Miranda stretches her arms out as if she ___.","were a swimmer","Miranda stretches her arms out as if she were a swimmer.","미란다는 마치 수영선수인 것처럼 팔을 쭉 뻗는다.",
 "본책 p.176 ‘as if + 가정법 과거’(POINT 3) 박스의 두 번째 예문 쌍(In fact 문장과 짝)을 보세요.","1) In fact(사실은) isn’t(~이 아니다)가 현재 사실이에요.  2) stretches(원형 stretch: 뻗다)도 현재예요.  3) 같은 시점의 반대라서 가정법 과거이고, 부정이 긍정으로 바뀌어요.","be동사 과거(w로 시작) 뒤에 위 문장의 a swimmer(수영선수)를 이어요. 모두 세 단어예요.","같은 시점 사실 반대 → as if + were");
W(2,"C",4,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>In fact, Tommy has never met that famous actor.<br>Tommy speaks as if he ___.","had met that famous actor","Tommy speaks as if he had met that famous actor.","토미는 마치 그 유명한 배우를 만났던 것처럼 말한다.",
 "본책 p.176 ‘as if + 가정법 과거완료’(POINT 4) 박스를 보세요.","1) has never met(원형 meet: 만나다)은 ‘지금까지 만난 적 없다’라는 지난 경험의 부정이에요.  2) 말하는 지금보다 앞선 일을 만난 것처럼 꾸며 말하는 거예요.  3) 그래서 had p.p.를 써요. never(부정)는 긍정으로 바뀌어요.","had + meet의 p.p.로 시작하고, never는 빼고 위 문장의 목적어를 이어요. 모두 다섯 단어예요.","앞선 일처럼 말함 → as if + had p.p.");
// ===== UNIT 2 D =====
W(2,"D",1,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>내가 자전거를 탈 줄 안다면 좋을 텐데. (ride / could / I / a / bike / wish)<br>I ___.","wish I could ride a bike","I wish I could ride a bike.","내가 자전거를 탈 줄 안다면 좋을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거’(POINT 1) 박스의 공식(I wish + 주어 + 동사의 과거형)을 보세요.","1) 문장은 I로 시작하니 바로 뒤에 올 말을 찾아요.  2) ‘I wish’ 다음에는 주어(I)가 와요.  3) could(~할 수 있다) 뒤에는 동사원형 ride(타다)와 목적어 a bike(자전거)가 와요.","I 바로 뒤는 ‘바라다’ 동사, 조동사는 동사원형 바로 앞이에요. 빈칸에 여섯 단어가 들어가요.","I wish + 주어 + could + 동사원형");
W(2,"D",2,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그는 모든 문제의 답을 알고 있는 것처럼 말한다. (if / knew / speaks / answers / the / as / he)<br>He ___ to all the problems.","speaks as if he knew the answers","He speaks as if he knew the answers to all the problems.","그는 모든 문제의 답을 알고 있는 것처럼 말한다.",
 "본책 p.176 ‘as if + 가정법 과거’(POINT 3) 박스의 공식(as if + 주어 + 동사의 과거형)을 보세요.","1) He 다음에는 동사 speaks(원형 speak: 말하다)가 와요.  2) 그 뒤에 as if를 한 덩어리로 놓아요.  3) 이어서 주어 he, 동사 knew(원형 know: 알다), 마지막에 the answers(그 답들)가 와요.","as if는 붙여서 한 덩어리, the answers도 한 덩어리예요. 빈칸에 일곱 단어가 들어가요.","speaks + as if + 주어 + 과거형");
W(2,"D",3,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>내가 여벌 옷을 가져갔었더라면 좋았을 텐데. (wish / I / had / I / brought)<br>___ extra clothes.","I wish I had brought","I wish I had brought extra clothes.","내가 여벌 옷을 가져갔었더라면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스의 공식(I wish + 주어 + had p.p.)을 보세요.","1) 문장 맨 앞이 비어 있으니 I wish로 시작해요.  2) 그 뒤에 주어 I가 와요.  3) 이어서 had와 p.p.(brought: 원형 bring 가져오다)를 써요.","I가 두 번 쓰여요. 첫 I는 문장 주어, 둘째 I는 wish 뒤의 주어예요. 다섯 단어예요.","I wish + 주어 + had p.p.");
W(2,"D",4,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그 도둑은 마치 아무것도 훔치지 않았던 것처럼 행동한다. (had / stolen / acts / if / not / as / he)<br>The thief ___ anything.","acts as if he had not stolen","The thief acts as if he had not stolen anything.","그 도둑은 마치 아무것도 훔치지 않았던 것처럼 행동한다.",
 "본책 p.176 ‘as if + 가정법 과거완료’(POINT 4) 박스의 공식(as if + 주어 + had p.p.)을 보세요.","1) The thief 다음에는 동사 acts(원형 act: 행동하다)가 와요.  2) 그 뒤에 as if + 주어 he가 와요.  3) 마지막은 had + not + p.p.(stolen: 원형 steal 훔치다) 순서예요.","not은 had와 p.p.(stolen: 원형 steal 훔치다) 사이에 들어가요. 빈칸에 일곱 단어가 들어가요.","acts as if + 주어 + had not p.p.");
// ===== 서술형 대비 A =====
W("SW","A",1,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>내가 로스앤젤레스에 산다면 좋을 텐데. (lived / I / Los Angeles / wish / in)<br>I ___.","wish I lived in Los Angeles","I wish I lived in Los Angeles.","내가 로스앤젤레스에 산다면 좋을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거’(POINT 1) 박스를 보세요.","1) I 다음에 wish를 놓아요.  2) 그 뒤에 주어 I와 과거형 동사가 와요.  3) 마지막에 장소 표현 in Los Angeles(로스앤젤레스에)가 와요.","lived(원형 live: 살다)는 둘째 I 바로 뒤, 장소 표현은 맨 끝이에요. Los Angeles를 한 덩어리로 세면 다섯 덩어리예요.","I wish + 주어 + 과거형");
W("SW","A",2,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>내가 20대라면, 차를 운전할 수 있을 텐데. (if / I / in / my / twenties / were)<br>___, I could drive a car.","If I were in my twenties","If I were in my twenties, I could drive a car.","내가 20대라면, 나는 차를 운전할 수 있을 텐데.",
 "본책 p.174 POINT 1 ‘가정법 과거’ 공식과 그 아래 ‘내신 적중’ 박스(be동사 규칙)를 보세요.","1) 쉼표 뒤 I could drive(운전할 수 있을 텐데)가 가정법 과거의 주절이에요.  2) 그러니 빈칸은 If + 주어 + 과거형 모양이에요.  3) 주어가 I여도 be동사는 were예요.","If로 시작하고, in my twenties(20대에)는 한 덩어리로 맨 뒤에 놓아요. 여섯 단어예요.","If I were ~, I could 원형");
W("SW","A",3,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>마치 오늘이 일요일인 것처럼 느껴진다. (today / if / were / Sunday / as)<br>It feels ___.","as if today were Sunday","It feels as if today were Sunday.","마치 오늘이 일요일인 것처럼 느껴진다.",
 "본책 p.176 ‘as if + 가정법 과거’(POINT 3) 박스를 보세요.","1) It feels(느끼다) 뒤에 as if를 먼저 놓아요.  2) 이어서 주어 today(오늘)가 와요.  3) 마지막에 be동사 were와 Sunday(일요일)가 와요.","as if를 먼저 붙여 놓고, 주어 + be동사 + 요일 순서로 이어요. 다섯 단어예요.","as if + 주어 + were");
W("SW","A",4,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>내가 그를 안다면, 나는 그에게 인사할 텐데. (would / I / hello / say / him / to)<br>If I knew him, ___.","I would say hello to him","If I knew him, I would say hello to him.","내가 그를 안다면, 나는 그에게 인사할 텐데.",
 "본책 p.174 ‘가정법 과거’ 박스의 주절 공식(주어 + would + 동사원형)을 보세요.","1) if절의 knew(원형 know: 알다)가 과거형이라서 가정법 과거예요.  2) 주절은 I would + 동사원형이에요.  3) say hello to(~에게 인사하다)를 이어 써요.","주어 + would + 동사원형 뒤에 hello와 to him을 이어요. 여섯 단어예요.","주어 + would + 동사원형 ...");
W("SW","A",5,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>Jane은 마치 그녀가 전에 프랑스에 살았던 것처럼 말한다. (if / France / she / lived / as / had / in)<br>Jane talks ___ before.","as if she had lived in France","Jane talks as if she had lived in France before.","제인은 마치 전에 프랑스에 살았던 것처럼 말한다.",
 "본책 p.176 ‘as if + 가정법 과거완료’(POINT 4) 박스의 공식(as if + 주어 + had p.p.)을 보세요.","1) ‘전에’(before)는 말하는 때보다 앞선 시점이에요.  2) 그래서 as if 뒤에 had p.p.를 써요.  3) 장소 in France(프랑스에)는 마지막에 와요.","as if 뒤는 주어 + had + lived(원형 live: 살다), 장소 in France는 맨 뒤예요. 일곱 단어예요.","as if + 주어 + had p.p.");
W("SW","A",6,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그가 나를 초대했더라면, 나는 그 파티에 갔을 텐데. (invited / if / me / he / had)<br>___, I would have gone to the party.","If he had invited me","If he had invited me, I would have gone to the party.","그가 나를 초대했다면, 나는 그 파티에 갔을 텐데.",
 "본책 p.174 ‘가정법 과거완료’ 박스의 if절 공식(If + 주어 + had p.p.)을 보세요.","1) 주절 would have gone(갔을 텐데)이 ‘would have p.p.’라서 가정법 과거완료예요.  2) 그러니 if절은 If + 주어 + had p.p.예요.  3) 마지막에 목적어 me가 와요.","If로 시작해 주어, had, invited(원형 invite: 초대하다), 목적어 순서예요. 다섯 단어예요.","If + 주어 + had p.p., would have p.p.");
W("SW","A",7,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>내가 그 시험에 합격했더라면 좋았을 텐데. (I / had / that / wish / I / passed / exam)<br>___.","I wish I had passed that exam","I wish I had passed that exam.","내가 그 시험에 합격했더라면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스의 공식을 보세요.","1) ‘~했더라면 좋았을 텐데’는 지난 일에 대한 아쉬움이에요.  2) 틀은 I wish + 주어 + had p.p.예요.  3) 시험은 that exam(그 시험)으로 마지막에 와요.","I가 두 번 나와요(문장 주어, wish 뒤 주어). passed(원형 pass: 합격하다) 뒤에 that exam을 붙여요. 일곱 단어예요.","~했더라면 좋았을 텐데 = I wish 주어 had p.p.");
// ===== SW B =====
W("SW","B",1,"주어진 문장을 가정법 문장으로 바꿀 때 빈칸에 알맞은 말을 쓰시오.<br>As I don’t have medicine, I can’t take it right now.<br>If ___, I ___ it right now.","I had medicine, could take","If I had medicine, I could take it right now.","내게 약이 있다면, 나는 지금 그것을 먹을 수 있을 텐데.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스에서 가정법 과거 ↔ 직설법 현재를 보세요.","1) don’t have(가지고 있지 않다)와 can’t take(먹을 수 없다)는 현재 사실이에요.  2) 가정법 과거로 바꾸고 부정은 긍정으로 바꿔요.  3) if절은 과거형, 주절은 could + 동사원형이에요.","첫 빈칸은 주어 + have의 과거형 + 위 문장의 명사, 둘째 빈칸은 can의 과거형 + 위 문장의 동사원형이에요.","현재 사실 → If 과거형, could 원형");
W("SW","B",2,"주어진 문장을 가정법 문장으로 바꿀 때 빈칸에 알맞은 말을 쓰시오.<br>I’m sorry that I am not good at dancing.<br>I wish ___.","I were good at dancing","I wish I were good at dancing.","내가 춤을 잘 춘다면 좋을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거’(POINT 1) 박스의 I’m sorry that ... 문장 변환을 보세요.","1) I’m sorry that I am(~이다)은 현재의 아쉬움이에요.  2) 현재의 소망이니 I wish + 과거형이에요.  3) 부정(not)은 긍정으로 바뀌어요.","주어 I 뒤에 be동사 과거(w로 시작)를 쓰고, not은 빼고 good at dancing(춤을 잘 추는)을 이어요.","현재 아쉬움 → I wish + were");
W("SW","B",3,"주어진 문장을 가정법 문장으로 바꿀 때 빈칸에 알맞은 말을 쓰시오.<br>In fact, Charles isn’t shocked.<br>Charles stands there as if ___.","he were shocked","Charles stands there as if he were shocked.","찰스는 마치 충격받은 것처럼 거기에 서 있다.",
 "본책 p.176 ‘as if + 가정법 과거’(POINT 3) 박스의 In fact 예문을 보세요.","1) In fact(사실은) isn’t(~이 아니다)는 현재 사실이에요.  2) 주절 stands(원형 stand: 서 있다)와 같은 시점이니 가정법 과거예요.  3) 부정은 긍정으로 바뀌어요.","주어는 Charles를 대명사로 바꿔 써요. 그 뒤 be동사 과거(w로 시작) + 위 문장의 형용사 shocked(충격받은)예요.","주절과 같은 시점 → as if he were");
W("SW","B",4,"주어진 문장을 가정법 문장으로 바꿀 때 빈칸에 알맞은 말을 쓰시오.<br>In fact, the child didn’t lose his favorite toy.<br>The child cries as if ___.","he had lost his favorite toy","The child cries as if he had lost his favorite toy.","그 아이는 마치 가장 좋아하는 장난감을 잃어버린 것처럼 운다.",
 "본책 p.176 ‘as if + 가정법 과거완료’(POINT 4) 박스를 보세요.","1) In fact didn’t lose(원형 lose: 잃어버리다)는 과거 사실이에요.  2) 주절 cries(원형 cry: 울다)보다 앞선 일이에요.  3) as if 뒤에는 had p.p.를 쓰고, 부정은 긍정으로 바꿔요.","주어는 the child를 대명사로 바꾸고, had + lose의 p.p.(l로 시작하는 네 글자) 뒤에 위 문장의 목적어를 이어요.","앞선 사실 반대 → as if he had p.p.");
W("SW","B",5,"주어진 문장을 가정법 문장으로 바꿀 때 빈칸에 알맞은 말을 쓰시오.<br>I’m sorry that I said hurtful words to my mother.<br>I wish ___ to my mother.","I hadn’t[had not] said hurtful words","I wish I hadn’t said hurtful words to my mother.","내가 어머니께 상처 주는 말을 하지 않았더라면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스를 보세요.","1) I’m sorry that I said(원형 say: 말하다)는 과거에 한 일을 후회하는 말이에요.  2) 과거 후회는 I wish + had p.p.예요.  3) 긍정이 부정으로 바뀌어요.","주어 I 뒤에 had not(줄이면 h로 시작) + say의 p.p., 그다음 위 문장의 hurtful words(상처 주는 말)를 이어요.","과거 후회 → I wish + hadn’t p.p.");
W("SW","B",6,"주어진 문장을 가정법 문장으로 바꿀 때 빈칸에 알맞은 말을 쓰시오.<br>As Amy enjoyed the movie, she watched it again the next day.<br>If ___, she ___ the next day.","Amy hadn’t[had not] enjoyed the movie, wouldn’t[would not] have watched it again","If Amy hadn’t enjoyed the movie, she wouldn’t have watched it again the next day.","에이미가 그 영화를 즐기지 않았다면, 그녀는 다음 날 그것을 다시 보지 않았을 텐데.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스에서 가정법 과거완료 ↔ 직설법 과거를 보세요.","1) enjoyed(원형 enjoy: 즐기다), watched(원형 watch: 보다)는 둘 다 과거 사실이에요.  2) 과거 사실 반대니 가정법 과거완료예요.  3) 긍정은 부정으로 바뀌어요.","첫 빈칸은 Amy로 시작하는 if절(had not + p.p. + 목적어), 둘째 빈칸은 would not + have + p.p.로 시작해서 위 문장의 it again까지 옮겨요.","과거 사실 반대 → hadn’t p.p., wouldn’t have p.p.");
W("SW","B",7,"주어진 문장을 가정법 문장으로 바꿀 때 빈칸에 알맞은 말을 쓰시오.<br>As I am busy, I can’t go camping with you.<br>If ___, I ___ with you.","I weren’t[were not] busy, could go camping","If I weren’t busy, I could go camping with you.","내가 바쁘지 않다면, 나는 너와 캠핑하러 갈 수 있을 텐데.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스에서 가정법 과거 ↔ 직설법 현재를 보세요.","1) am(원형 be: ~이다)과 can’t go(갈 수 없다)는 현재 사실이에요.  2) 가정법 과거로 바꾸고 부정은 긍정으로 바꿔요.  3) 이번에는 if절이 부정(not)이 돼요. (busy의 반대)","첫 빈칸은 주어 + be동사 과거의 부정(w로 시작하는 줄임말) + busy, 둘째 빈칸은 can의 과거형 + go camping(캠핑 가다)이에요.","현재 사실 반대 → If I weren’t, I could");
// ===== SW C =====
W("SW","C",1,"다음 그림을 보고 ( ) 안의 말과 「I wish + 가정법」 구문을 이용하여 문장을 완성하시오.<br>(그림: 한 학생이 떠나는 버스를 쫓아 달려가는 모습)<br>I missed the bus this morning. I wish ___ faster. (run)","I had run","I missed the bus this morning. I wish I had run faster.","나는 오늘 아침에 버스를 놓쳤다. 내가 더 빨리 달렸더라면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스를 보세요.","1) missed(원형 miss: 놓치다)와 this morning은 이미 지난 일이에요.  2) 지난 일을 후회하는 소망이니 had p.p.를 써요.  3) 빈칸에는 주어 I도 같이 들어가요.","주어 + had + p.p. 세 단어예요. run(달리다)의 p.p.는 원형과 모양이 같아요.","지난 일 후회 → I wish I had p.p.");
W("SW","C",2,"다음 그림을 보고 ( ) 안의 말과 「I wish + 가정법」 구문을 이용하여 문장을 완성하시오.<br>(그림: 한 여자가 머리를 감싸 쥐고 서 있고 옆에서 어린 아이가 울고 있는 모습)<br>I wish ___ at my sister. Now she won’t stop crying. (not, yell)","I hadn’t[had not] yelled","I wish I hadn’t yelled at my sister. Now she won’t stop crying.","내가 여동생에게 소리치지 않았더라면 좋았을 텐데. 이제 그녀는 울음을 그치지 않을 거야.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스를 보세요.","1) Now she won’t stop crying(지금 울음을 그치지 않는다)은 이미 소리친 뒤의 결과예요.  2) 소리친 건 지난 일이라 had p.p.를 써요.  3) 힌트에 not이 있으니 부정이에요.","주어 I + had not(줄이면 h로 시작) + yell(소리치다)의 p.p.예요. 줄임말로 쓰면 세 단어예요.","후회 + 부정 → I wish I hadn’t p.p.");
W("SW","C",3,"다음 그림을 보고 ( ) 안의 말과 「I wish + 가정법」 구문을 이용하여 문장을 완성하시오.<br>(그림: 한 사람이 충치 때문에 뺨을 감싸 쥐고 아파하는 모습)<br>I wish ___ my teeth. I have so many cavities. (take better care of)","I had taken better care of","I wish I had taken better care of my teeth. I have so many cavities.","내가 이를 더 잘 관리했더라면 좋았을 텐데. 나는 충치가 너무 많아.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스를 보세요.","1) 충치(cavities)가 이미 많아요. 이를 못 돌본 건 과거예요.  2) 과거 후회이니 I wish + had p.p.예요.  3) take care of(~을 돌보다)에서 동사 take(취하다)만 p.p.로 바꿔요.","주어 I + had + take의 p.p.(t로 시작하는 다섯 글자) 뒤에 better care of를 그대로 이어요.","과거 후회 → had taken care of");
// ===== SW D =====
W("SW","D",1,"다음 대화를 읽고 밑줄 친 부분이 어법상 옳은지 판단한 후, 틀리면 바르게 고치시오.<br>A Arnold, are you okay? You look (1) <u>as if you had saw a ghost</u>.<br>B Hey, Beth. I’m okay. I thought I was going to be late for class.<br>A Oh, did you miss your usual bus?<br>B Yeah, I did. My alarm clock didn’t go off today, so I woke up late. If I had woken up at my usual time, (2) <u>I would have gotten here</u> earlier.<br>A Hmm… If I were you, (3) <u>I would checked your clock’s batteries</u>.<br>B That’s a good idea. I will do that when I get home.<br>A Good job on getting here on time though. If you had gotten here later, (4) <u>you would be in big trouble</u>.<br>B Yeah, I know!<br>→ 밑줄 친 (1)번","X, as if you had seen a ghost","You look as if you had seen a ghost.","너는 마치 유령을 본 것처럼 보여.",
 "본책 p.176 ‘as if + 가정법 과거완료’(POINT 4) 박스의 공식(as if + 주어 + had p.p.)을 보세요.","1) as if 뒤에 had가 있으니 had p.p. 모양이 맞아야 해요.  2) saw(원형 see: 보다)는 과거형이에요. p.p.가 아니에요.  3) had 뒤에는 p.p.를 써야 해요.","see(보다)의 p.p.로 고쳐요. s로 시작하는 네 글자(seen)예요.","had 뒤는 p.p. (see-saw-seen)");
W("SW","D",2,"다음 대화를 읽고 밑줄 친 부분이 어법상 옳은지 판단한 후, 틀리면 바르게 고치시오.<br>A Arnold, are you okay? You look (1) <u>as if you had saw a ghost</u>.<br>B Hey, Beth. I’m okay. I thought I was going to be late for class.<br>A Oh, did you miss your usual bus?<br>B Yeah, I did. My alarm clock didn’t go off today, so I woke up late. If I had woken up at my usual time, (2) <u>I would have gotten here</u> earlier.<br>A Hmm… If I were you, (3) <u>I would checked your clock’s batteries</u>.<br>B That’s a good idea. I will do that when I get home.<br>A Good job on getting here on time though. If you had gotten here later, (4) <u>you would be in big trouble</u>.<br>B Yeah, I know!<br>→ 밑줄 친 (2)번","O","If I had woken up at my usual time, I would have gotten here earlier.","내가 평소 시간에 일어났다면, 나는 여기에 더 일찍 도착했을 텐데.",
 "본책 p.174 ‘가정법 과거완료’ 박스의 공식(If + 주어 + had p.p. ~, 주어 + would have p.p.)을 보세요.","1) if절이 had woken(원형 wake: 일어나다)이라서 가정법 과거완료예요.  2) 주절은 would have p.p.여야 해요.  3) 밑줄이 그 모양인지 확인해요.","if절 had p.p.와 밑줄 would have p.p.의 짝이 맞는지 한 단어씩 대조해 보세요.","if had p.p. → would have p.p. (맞음)");
W("SW","D",3,"다음 대화를 읽고 밑줄 친 부분이 어법상 옳은지 판단한 후, 틀리면 바르게 고치시오.<br>A Arnold, are you okay? You look (1) <u>as if you had saw a ghost</u>.<br>B Hey, Beth. I’m okay. I thought I was going to be late for class.<br>A Oh, did you miss your usual bus?<br>B Yeah, I did. My alarm clock didn’t go off today, so I woke up late. If I had woken up at my usual time, (2) <u>I would have gotten here</u> earlier.<br>A Hmm… If I were you, (3) <u>I would checked your clock’s batteries</u>.<br>B That’s a good idea. I will do that when I get home.<br>A Good job on getting here on time though. If you had gotten here later, (4) <u>you would be in big trouble</u>.<br>B Yeah, I know!<br>→ 밑줄 친 (3)번","X, I would check your clock’s batteries","If I were you, I would check your clock’s batteries.","내가 너라면, 나는 네 시계의 건전지를 확인해 볼 텐데.",
 "본책 p.174 ‘가정법 과거’ 박스의 주절 공식(주어 + would + 동사원형)을 보세요.","1) if절이 If I were you라서 가정법 과거예요.  2) 가정법 과거의 주절은 would 뒤에 동사원형이에요.  3) checked(원형 check: 확인하다)는 원형일까요?","would 바로 뒤 동사에서 과거를 나타내는 -ed 꼬리를 떼어 내요.","would 바로 뒤는 동사원형");
W("SW","D",4,"다음 대화를 읽고 밑줄 친 부분이 어법상 옳은지 판단한 후, 틀리면 바르게 고치시오.<br>A Arnold, are you okay? You look (1) <u>as if you had saw a ghost</u>.<br>B Hey, Beth. I’m okay. I thought I was going to be late for class.<br>A Oh, did you miss your usual bus?<br>B Yeah, I did. My alarm clock didn’t go off today, so I woke up late. If I had woken up at my usual time, (2) <u>I would have gotten here</u> earlier.<br>A Hmm… If I were you, (3) <u>I would checked your clock’s batteries</u>.<br>B That’s a good idea. I will do that when I get home.<br>A Good job on getting here on time though. If you had gotten here later, (4) <u>you would be in big trouble</u>.<br>B Yeah, I know!<br>→ 밑줄 친 (4)번","X, you would have been in big trouble","If you had gotten here later, you would have been in big trouble.","네가 여기에 더 늦게 도착했다면, 너는 큰일 났을 텐데.",
 "본책 p.174 ‘가정법 과거완료’ 박스의 주절 공식(would have p.p.)을 보세요.","1) if절이 had gotten(원형 get: 도착하다)이라서 가정법 과거완료예요.  2) 그러면 주절은 would have p.p.여야 해요.  3) 밑줄은 would be 모양이라 틀려요.","would와 be 사이에 have를 넣고, be는 p.p.(b로 시작하는 네 글자)로 바꿔요.","if had p.p. → would have been");
// ===== 내신 =====
C("NS","N",1,"빈칸에 들어갈 알맞은 말을 고르시오.<br>If I were not sick, I ___ participate in the race.",["① will","② would","③ had","④ have","⑤ would have"],"② would","If I were not sick, I would participate in the race.","내가 아프지 않다면, 나는 그 경주에 참가할 텐데.",
 "본책 p.174 ‘가정법 과거’ 박스의 주절 공식(주어 + would/could/might + 동사원형)을 보세요.","1) if절 were not(~이 아니다)이 과거형이라 가정법 과거예요.  2) 주절 빈칸 뒤에 participate(참가하다)가 동사원형으로 있어요.  3) 가정법 과거 주절의 조동사를 골라요.","will은 가정법에서 안 쓰고, have가 들어가는 보기(④, ⑤)는 would 뒤에 have p.p.가 와야 해서 안 돼요.","가정법 과거 → would + 동사원형");
C("NS","N",2,"빈칸에 들어갈 알맞은 말을 고르시오.<br>If it ___ sunny, we would have gone on a picnic.",["① be","② was","③ were","④ has been","⑤ had been"],"⑤ had been","If it had been sunny, we would have gone on a picnic.","날씨가 화창했다면, 우리는 소풍을 갔을 텐데.",
 "본책 p.174 ‘가정법 과거완료’ 박스의 if절 공식(If + 주어 + had p.p.)을 보세요.","1) 주절 we would have gone(원형 go: 가다)이 would have p.p.예요.  2) 짝이 되는 if절은 어떤 모양일까요?  3) be동사의 p.p.도 같이 생각해요.","were는 가정법 과거용이에요. had + be의 p.p.(been)를 쓴 맨 뒤 보기예요.","would have p.p. ← if절 had p.p.");
C("NS","N",3,"빈칸에 들어갈 알맞은 말을 고르시오.<br>I wish I ___ how to solve that problem.",["① know","② knows","③ have known","④ had known","⑤ would known"],"④ had known","I wish I had known how to solve that problem.","내가 그 문제를 푸는 방법을 알았더라면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거’(POINT 1)와 ‘I wish + 가정법 과거완료’(POINT 2) 박스를 비교하세요.","1) I wish 뒤에는 현재 소망이면 과거형, 과거 소망이면 had p.p.를 써요.  2) 보기에 과거형(knew)은 없어요.  3) 그러니 남는 정답 후보는 had p.p. 모양이에요.","know(알다)의 p.p.는 known이에요. had가 앞에 붙은 보기예요.","I wish + had p.p.(had known)");
C("NS","N",4,"빈칸에 들어갈 알맞은 말을 고르시오.<br>The student acts as if he ___ at all, but he actually slept all through class.",["① slept","② hasn’t sleep","③ didn’t sleep","④ had slept","⑤ hadn’t slept"],"⑤ hadn’t slept","The student acts as if he hadn’t slept at all, but he actually slept all through class.","그 학생은 마치 전혀 자지 않았던 것처럼 행동하지만, 사실 그는 수업 시간 내내 잤다.",
 "본책 p.176 ‘as if + 가정법 과거완료’(POINT 4) 박스를 보세요.","1) but 뒤에 he actually slept(원형 sleep: 자다)가 있어요. 사실은 잤어요.  2) 사실의 반대이니 ‘자지 않았다’ 쪽이에요.  3) 주절보다 앞선 일이라 had p.p.예요.","had not의 줄임말 hadn’t + slept예요. 마지막 보기예요.","실제와 반대 + 앞선 일 → hadn’t p.p.");
C("NS","N",5,"빈칸에 공통으로 들어갈 말로 알맞은 것을 고르시오.<br>If I ___ you, I would drink some coffee.<br>I wish Jake ___ not so mean.",["① be","② was","③ were","④ have been","⑤ had been"],"③ were","If I were you, I would drink some coffee. / I wish Jake were not so mean.","내가 너라면, 나는 커피를 좀 마실 텐데. / 제이크가 그렇게 못되지 않다면 좋을 텐데.",
 "본책 p.174 POINT 1 아래 ‘내신 적중’ 박스(be동사 규칙)와 p.176 POINT 1 ‘I wish + 가정법 과거’ 박스를 같이 보세요.","1) 첫 문장은 would drink(마실 텐데)가 있는 가정법 과거예요.  2) 둘째 문장은 I wish + 현재 소망(가정법 과거)이에요.  3) 둘 다 현재 기준이면 같은 be동사 모양이에요.","w로 시작하는 were예요. 주어가 I나 Jake여도 같아요.","가정법 과거 be동사 → were");
C("NS","N",6,"빈칸에 공통으로 들어갈 말로 알맞은 것을 고르시오.<br>If I could play the piano well, I ___ participate in the competition.<br>If Diana had enough money, she ___ buy the hat.",["① will","② won’t","③ can","④ would","⑤ would have"],"④ would","If I could play the piano well, I would participate in the competition. / If Diana had enough money, she would buy the hat.","내가 피아노를 잘 칠 수 있다면, 나는 대회에 참가할 텐데. / 다이애나에게 돈이 충분히 있다면, 그녀는 그 모자를 살 텐데.",
 "본책 p.174 ‘가정법 과거’ 박스의 주절 모양(would/could/might + 동사원형)을 보세요.","1) 두 문장 모두 if절이 could play(칠 수 있다), had(가졌다)로 과거형이에요.  2) 그래서 가정법 과거예요.  3) 빈칸 뒤에 동사원형 participate(참가하다), buy(사다)가 와요.","won’t와 can, will은 가정법에 안 맞고, 뒤에 have p.p.가 필요한 보기도 안 돼요. 남는 건 w로 시작하는 짧은 조동사예요.","가정법 과거 주절 → would + 원형");
C("NS","N",7,"주어진 문장을 가정법 문장으로 바르게 바꿔 쓴 것은?<br>I’m sorry that I didn’t book the flight last month.",["① I wish I booked the flight last month.","② I wish I will book the flight last month.","③ I wish I had booked the flight last month.","④ I wish I did not book the flight last month.","⑤ I wish I had not booked the flight last month."],"③ I wish I had booked the flight last month.","I wish I had booked the flight last month.","내가 지난달에 그 비행기 표를 예약했더라면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스의 I’m sorry that I didn’t ... 변환 예문을 보세요.","1) didn’t book(원형 book: 예약하다)과 last month(지난달)는 과거예요.  2) 과거 후회는 I wish + had p.p.예요.  3) 부정(didn’t)은 가정법에서 긍정으로 바뀌어요.","had + booked가 있고 not이 없는 보기예요.","과거 아쉬움 부정 → I wish had p.p. 긍정");
C("NS","N",8,"밑줄 친 부분이 어법상 옳지 <u>않은</u> 것을 고르시오.",["① I wish I <u>had</u> more time to exercise.","② She treats me as if I <u>were</u> a little kid.","③ I wish I <u>had learned</u> another language.","④ If it were sunny, we <u>could hang</u> the laundry outside.","⑤ If you had asked me earlier, I <u>would go</u> to the café with you."],"⑤ If you had asked me earlier, I <u>would go</u> to the café with you.","If you had asked me earlier, I would have gone to the café with you.","네가 나에게 더 일찍 물어봤다면, 나는 너와 카페에 갔을 텐데.",
 "본책 p.174 ‘가정법 과거’와 ‘가정법 과거완료’ 공식에서 if절 모양과 주절 모양의 짝을 확인하세요.","1) 각 보기에서 if절(또는 I wish, as if)이 과거형인지 had p.p.인지 먼저 봐요.  2) if절이 had p.p.이면 주절은 would have p.p.예요.  3) 그 짝이 안 맞는 보기를 찾아요.","마지막 보기는 if절이 had asked인데 주절이 would go라서 짝이 안 맞아요.","if had p.p. 주절은 would have p.p.");
C("NS","N",9,"밑줄 친 부분이 어법상 옳지 <u>않은</u> 것을 고르시오.",["① He acts as if he <u>didn’t</u> care.","② Vicky acts as if we <u>had had a fight</u>.","③ I wish I <u>accepted</u> that job offer a month ago.","④ If you had a flashlight, you <u>could see</u> what was in the attic.","⑤ If I <u>had watered</u> the plants more often, they wouldn’t have died."],"③ I wish I <u>accepted</u> that job offer a month ago.","I wish I had accepted that job offer a month ago.","내가 한 달 전에 그 일자리 제안을 받아들였더라면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거’(POINT 1)와 ‘I wish + 가정법 과거완료’(POINT 2) 박스를 비교해 보세요.","1) 보기 중 a month ago(한 달 전)처럼 과거 시점을 알려 주는 말이 있는 문장을 찾아요.  2) 과거 시점의 소망에는 어떤 모양이 필요한지 생각해요.  3) 그 문장의 동사 모양을 확인해요.","I wish 뒤에 단순 과거형 accepted(원형 accept: 받아들이다)가 있는 보기예요. 세 번째예요.","과거 시점 소망 → I wish had p.p.");
C("NS","N",10,"우리말을 영어로 바르게 옮긴 것을 고르시오.<br>만약 내가 설거지를 미리 했더라면, 그 컵을 사용할 수 있었을 텐데.",["① If I do the dishes earlier, I can use that cup.","② If I did the dishes earlier, I could have used that cup.","③ If I had done the dishes earlier, I could use that cup.","④ If I had done the dishes earlier, I could have used that cup.","⑤ If I had not done the dishes earlier, I could have used that cup."],"④ If I had done the dishes earlier, I could have used that cup.","If I had done the dishes earlier, I could have used that cup.","만약 내가 설거지를 더 일찍 했더라면, 나는 그 컵을 사용할 수 있었을 텐데.",
 "본책 p.174 ‘가정법 과거완료’ 박스의 공식(If + 주어 + had p.p. ~, 주어 + could + have p.p.)을 보세요.","1) ‘했더라면, 사용할 수 있었을 텐데’는 과거 사실의 반대예요.  2) 그러니 if절은 had p.p., 주절은 could have p.p.예요.  3) 둘 다 이 모양인 보기를 찾고, 부정(not)이 없는지도 확인해요.","do(하다)의 p.p.는 done이에요. had done이 있고 not이 없으며 could have used가 있는 보기예요.","if had p.p., could have p.p.");
C("NS","N",11,"우리말을 영어로 바르게 옮긴 것을 고르시오.<br>Sarah가 이번 주말에 바쁘지 않으면 좋을 텐데.",["① I wish Sarah is busy this weekend.","② I wish Sarah isn’t busy this weekend.","③ I wish Sarah wasn’t busy this weekend.","④ I wish Sarah weren’t busy this weekend.","⑤ I wish Sarah hadn’t been busy this weekend."],"④ I wish Sarah weren’t busy this weekend.","I wish Sarah weren’t busy this weekend.","세라가 이번 주말에 바쁘지 않다면 좋을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거’(POINT 1) 박스의 두 번째 예문과 그 옆 작은 글씨 설명을 보세요.","1) this weekend(이번 주말)는 지금 기준 미래/현재의 소망이에요. 과거 일이 아니에요.  2) 현재 소망이면 I wish + 과거형이에요.  3) be동사는 인칭에 상관없이 정해진 모양을 써요.","were(not)을 줄여 쓴 weren’t가 있는 보기예요.","현재 소망 + be → weren’t");
C("NS","N",12,"두 문장의 의미가 서로 <u>다른</u> 것은?",["① I wish I had spent more time with my grandmother.<br>= I’m sorry that I don’t spend more time with my grandmother.","② If the restaurant had been open, I could have had lunch there.<br>= As the restaurant wasn’t open, I couldn’t have lunch there.","③ I wish I had bought new clothes before the weather got hotter.<br>= I’m sorry that I didn’t buy new clothes before the weather got hotter.","④ Katie acts as if she were a famous singer.<br>= In fact, she is not a famous singer.","⑤ If I spoke French, I could talk to him.<br>= As I don’t speak French, I can’t talk to him."],"① I wish I had spent more time with my grandmother.<br>= I’m sorry that I don’t spend more time with my grandmother.","I wish I had spent more time with my grandmother. = I’m sorry that I didn’t spend more time with my grandmother.","내가 할머니와 더 많은 시간을 보냈더라면 좋았을 텐데. = 내가 할머니와 더 많은 시간을 보내지 않았던 것이 유감이다.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스와 p.176 I wish 박스의 I’m sorry that ... 변환을 보세요.","1) 각 보기에서 위 문장의 시제(과거/현재)와 아래 문장의 시제를 짝지어 봐요.  2) had p.p. → didn’t(과거), 과거형 → don’t(현재)로 바꿔 쓰는 규칙이에요.  3) 시제가 어긋난 보기를 찾아요.","첫 번째 보기가 틀렸어요. 위는 had spent(과거완료)인데 아래는 don’t spend(현재)로 짝이 안 맞아요.","had p.p. → 직설법 과거(didn’t)");
W("NS","N",13,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>내가 핸드폰을 떨어트리지 않았었다면, 그것은 망가지지 않았을 텐데. (not, break)<br>If I hadn’t dropped my cell phone, it ___ ___ ___.","wouldn’t have broken","If I hadn’t dropped my cell phone, it wouldn’t have broken.","내가 핸드폰을 떨어트리지 않았었다면, 그것은 망가지지 않았을 텐데.",
 "본책 p.174 ‘가정법 과거완료’ 박스의 주절 공식(would/could/might + have p.p.)을 보세요.","1) if절이 hadn’t dropped(원형 drop: 떨어뜨리다)로 had p.p. 모양이에요.  2) 그러니 주절은 would have p.p.예요.  3) not이 힌트로 주어졌으니 wouldn’t로 줄여 써요.","would not을 줄인 말(w로 시작) + have + break의 p.p.(b로 시작하는 여섯 글자)예요. 칸이 3개예요.","if hadn’t p.p. → wouldn’t have p.p.");
W("NS","N",14,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>그녀가 나를 더 잘 이해해준다면 좋을 텐데. (understand)<br>I wish she ___ me better.","understood","I wish she understood me better.","그녀가 나를 더 잘 이해해준다면 좋을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거’(POINT 1) 박스(I wish + 주어 + 동사의 과거형)를 보세요.","1) ‘이해해준다면 좋을 텐데’는 지금 이루어지지 않는 소망이에요.  2) 현재 소망이니 I wish + 과거형이에요.  3) understand(이해하다)의 과거형을 써요.","understand는 불규칙 동사예요. u로 시작하고 -stood로 끝나요.","understand의 과거형은 understood (불규칙)");
W("NS","N",15,"그림의 상황과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>(그림: 소녀가 마술사 모자를 쓰고 지팡이를 휘두르고 있는 모습)<br>My sister acts ___. (as if, a magician)","as if she were a magician","My sister acts as if she were a magician.","내 여동생은 마치 마술사인 것처럼 행동한다.",
 "본책 p.176 ‘as if + 가정법 과거’(POINT 3) 박스를 보세요.","1) 그림 속 동생은 마술사인 척하지만 실제로는 마술사가 아니에요.  2) 주절 acts(원형 act: 행동하다)와 같은 시점의 사실 반대예요.  3) 그러니 as if + 주어 + 과거형(be동사는 were)이에요.","as if 뒤에 동생을 가리키는 대명사 주어 + be동사 과거(w로 시작) + a magician(마술사) 순서예요.","as if + 주어 + were + 명사");
C("NS","N",16,"주어진 문장과 의미가 같은 것은?<br>If I had made a reservation, I wouldn’t have had to wait for a table.",["① As I make a reservation, I won’t have to wait for a table.","② As I don’t make a reservation, I have to wait for a table.","③ As I didn’t make a reservation, I had to wait for a table.","④ As I have made a reservation, I have to wait for a table.","⑤ As I hadn’t made a reservation, I didn’t have to wait for a table."],"③ As I didn’t make a reservation, I had to wait for a table.","As I didn’t make a reservation, I had to wait for a table.","내가 예약을 하지 않았기 때문에, 나는 테이블을 기다려야 했다.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스에서 가정법 과거완료 ↔ 직설법 과거를 보세요.","1) 주어진 문장은 had made(원형 make: 하다)와 wouldn’t have had to가 있는 가정법 과거완료예요.  2) 직설법 과거로 바꾸고 긍정/부정을 서로 바꿔요.  3) 부정은 긍정(had to wait: 기다려야 했다)으로 바뀌어요.","As + 과거(didn’t make)의 형태이면서 뒤가 ‘had to wait’(기다려야 했다)인 보기예요.","가정법 과거완료 → 직설법 과거, 긍정 ↔ 부정");
C("NS","N",17,"「I wish + 가정법」 구문을 이용하여 우리말을 영어로 옮길 때 밑줄 친 부분의 올바른 형태는?<br>내가 오늘 아침에 나의 점심을 <u>쌌다면</u> 좋았을 텐데.",["① pack","② packs","③ packed","④ have packed","⑤ had packed"],"⑤ had packed","I wish I had packed my lunch this morning.","내가 오늘 아침에 점심을 쌌더라면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스를 보세요.","1) ‘쌌다면 좋았을 텐데’는 아침에 이미 끝난 일을 후회하는 말이에요.  2) 과거에 이루지 못한 소망은 어떤 모양이었는지 떠올려요.  3) 단순 과거(packed)와 헷갈리지 않게 주의해요.","had + pack(싸다)의 p.p.예요. 가장 긴 마지막 보기예요.","과거 후회 → I wish + had p.p.");
C("NS","N",18,"대화의 빈칸 (A), (B)에 들어갈 말이 바르게 짝지어진 것은?<br>A If I were rich, I (A) ___ around the world.<br>B Oh, which countries would you visit?<br>A I would go to China and Egypt.<br>B Cool! I wish I (B) ___ go with you.",["① will travel — can","② will travel — could","③ would travel — can","④ would travel — could","⑤ would have traveled — could have"],"④ would travel — could","(A) If I were rich, I would travel around the world. / (B) I wish I could go with you.","(A) 내가 부자라면, 나는 전 세계를 여행할 텐데. / (B) 나도 너와 함께 갈 수 있다면 좋을 텐데.",
 "본책 p.174 ‘가정법 과거’ 박스의 주절 공식과 p.176 ‘I wish + 가정법 과거’ 박스를 보세요.","1) (A)는 If I were rich(내가 부자라면)에 이어지는 주절이에요. 가정법 과거예요.  2) (B)는 I wish 뒤에 오는 말이에요. 현재 소망이니 과거형을 써요.  3) will과 can은 과거형이 아니에요.","(A)는 would + 동사원형, (B)는 can의 과거형이에요. ④번이에요.","(A) would 원형 / (B) I wish could");
C("NS","N",19,"밑줄 친 부분을 <u>잘못</u> 고친 것은?",["① I wish I <u>was</u> good at skating. → were","② If he had been free, he <u>could go</u> with us. → could have gone","③ I wish I <u>ate</u> breakfast this morning. → had eaten","④ Dan speaks as if he <u>is</u> good at acting. → was","⑤ If I didn’t have homework today, I would <u>gone</u> to the art gallery. → go"],"④ Dan speaks as if he <u>is</u> good at acting. → was","Dan speaks as if he were good at acting.","댄은 마치 연기를 잘하는 것처럼 말한다.",
 "본책 p.176 ‘as if + 가정법 과거’(POINT 3) 박스와 p.174 POINT 1 ‘내신 적중’ 박스(be동사 규칙)를 보세요.","1) 각 보기의 고친 모양이 규칙에 맞는지 하나씩 확인해요.  2) as if 뒤에는 현재 시점이면 과거형을 써요.  3) 이때 be동사의 모양을 다시 확인해요.","④번이에요. 가정법 과거의 be동사는 was가 아니라 were예요.","as if + 가정법 과거 be → were");
C("NS","N",20,"다음 대화를 읽고 질문에 답하시오.<br>A Oh no! I lost my wallet.<br>B Where do you think you lost it?<br>A I think I lost it on the subway.<br>B If I were you, I ___ the subway’s lost and found right now.<br>A Okay, I will do that now. If I had paid more attention, I ___ my wallet.<br>B It’s okay. These things happen all the time.<br>A Oh, they said they found my wallet. Can you go with me to the lost and found?<br>B That’s great news! <u>너와 함께 갈 수 있다면 좋을 텐데.</u> I just don’t have time right now.<br>→ 위 대화의 빈칸에 들어갈 말이 순서대로 짝지어진 것은?",["① called — didn’t lose","② called — wouldn’t lost","③ would call — wouldn’t lost","④ would call — wouldn’t have lost","⑤ would have call — wouldn’t have lost"],"④ would call — wouldn’t have lost","If I were you, I would call the subway’s lost and found right now. / If I had paid more attention, I wouldn’t have lost my wallet.","내가 너라면, 나는 지금 바로 지하철 분실물 센터에 전화할 텐데. / 내가 좀 더 주의를 기울였다면, 나는 지갑을 잃어버리지 않았을 텐데.",
 "본책 p.174 ‘가정법 과거’와 ‘가정법 과거완료’ 박스의 주절 공식을 모두 보세요.","1) 첫 빈칸은 If I were you(내가 너라면)에 이어져요. 가정법 과거라서 would + 동사원형이에요.  2) 둘째 빈칸은 If I had paid(원형 pay: 지불하다, 기울이다)에 이어져요. 가정법 과거완료예요.  3) 주절은 would have p.p.이고 부정(not)이에요.","첫째는 would call(전화하다), 둘째는 wouldn’t have lost(원형 lose: 잃어버리다)예요.","과거 주절: would 원형 / 과거완료: wouldn’t have p.p.");
W("NS","N",21,"다음 대화를 읽고 질문에 답하시오.<br>A Oh no! I lost my wallet.<br>B Where do you think you lost it?<br>A I think I lost it on the subway.<br>B If I were you, I ___ the subway’s lost and found right now.<br>A Okay, I will do that now. If I had paid more attention, I ___ my wallet.<br>B It’s okay. These things happen all the time.<br>A Oh, they said they found my wallet. Can you go with me to the lost and found?<br>B That’s great news! <u>너와 함께 갈 수 있다면 좋을 텐데.</u> I just don’t have time right now.<br>→ 위 대화의 밑줄 친 우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>___ with you. (wish, be able to, go)","I wish I were able to go","I wish I were able to go with you.","내가 너와 함께 갈 수 있다면 좋을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거’(POINT 1) 박스를 보세요. be able to는 can과 같은 뜻이에요.","1) 바로 뒤에 I just don’t have time right now(지금은 시간이 없어)가 나와요. 현재 못 가는 상황이에요.  2) 현재 소망이니 I wish + 과거형이에요.  3) be able to(~할 수 있다)의 be동사를 과거형으로 써요.","I wish + 주어 + be동사 과거(w로 시작) + able to + 동사원형 순서예요. 빈칸에 일곱 단어가 들어가요.","I wish I were able to + 동사원형");
C("NS","N",22,"어법상 옳은 것의 개수는?<br>• I wish I could work abroad.<br>• If I knew her email address, I sent it to her.<br>• My father acts as if he had quit smoking.<br>• I wish Bella traveled with me last winter.<br>• If I hadn’t eaten all those snacks, I would not have gotten a stomachache.",["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],"③ 3개","I wish I could work abroad. / My father acts as if he had quit smoking. / If I hadn’t eaten all those snacks, I would not have gotten a stomachache.","내가 해외에서 일할 수 있다면 좋을 텐데. / 우리 아버지는 마치 담배를 끊었던 것처럼 행동한다. / 내가 그 간식을 다 먹지 않았다면, 나는 배탈이 나지 않았을 텐데.",
 "본책 p.174 가정법 과거·과거완료 박스와 p.176 I wish / as if 박스를 모두 펴 보세요.","1) 다섯 문장을 하나씩 if절/I wish/as if 뒤 모양과 주절 모양이 짝이 맞는지 확인해요.  2) if절이 과거형이면 주절은 would/could/might + 원형이에요.  3) last winter(지난겨울)처럼 과거 시점이 있는 I wish 문장도 확인해요.","두 번째 문장(주절 sent)과 네 번째 문장(traveled + last winter)이 틀려요. 나머지 세 문장이 맞아요.","짝이 맞는 문장만 세기 (정답 3개)");
C("NS","N",23,"우리말과 일치하도록 ( ) 안에 주어진 말을 배열할 때 다섯 번째 오는 것은?<br>그가 그 소문을 퍼트리지 않았다면 좋았을 텐데. (spread / I / that / he / rumor / wish / hadn’t)",["① wish","② rumor","③ spread","④ hadn’t","⑤ he"],"③ spread","I wish he hadn’t spread that rumor.","그가 그 소문을 퍼트리지 않았다면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스의 공식(I wish + 주어 + had p.p.)을 보세요.","1) 문장은 I wish로 시작해요.  2) 이어서 주어 he, 그다음 부정 hadn’t, 동사 p.p., 명사구가 와요.  3) 순서대로 번호를 매기며 다섯 번째를 찾아요.","I(1) wish(2) he(3) hadn’t(4) 다음이 다섯 번째예요. 동사 p.p.(spread: 퍼뜨리다)예요.","I wish he hadn’t spread ... (5번째)");
W("NS","N",24,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그는 마치 우리의 기념일을 잊어버렸던 적이 없는 것처럼 행동한다. (forgotten / if / had / as / not / acts / he)<br>He ___ our anniversary.","acts as if he had not forgotten","He acts as if he had not forgotten our anniversary.","그는 마치 우리의 기념일을 잊어버린 적이 없는 것처럼 행동한다.",
 "본책 p.176 ‘as if + 가정법 과거완료’(POINT 4) 박스의 공식(as if + 주어 + had p.p.)을 보세요.","1) He 다음에는 동사 acts(원형 act: 행동하다)가 와요.  2) 그 뒤에 as if + 주어 he가 와요.  3) 마지막은 had + not + p.p. 순서예요.","He 뒤에 동사, 그다음 as if 덩어리예요. not은 had 바로 뒤, forgotten(원형 forget: 잊다)은 맨 끝이에요. 일곱 단어예요.","~한 적 없는 것처럼 = as if 주어 had not p.p.");
W("NS","N",25,"주어진 문장을 가정법 문장으로 바꿀 때 빈칸에 알맞은 말을 쓰시오.<br>As I didn’t train harder, I didn’t win the championship.<br>If I ___ ___ harder, I ___ ___ ___ the championship.","had trained, would have won","If I had trained harder, I would have won the championship.","내가 더 열심히 훈련했다면, 나는 우승했을 텐데.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스에서 가정법 과거완료 ↔ 직설법 과거를 보세요.","1) didn’t train(원형 train: 훈련하다), didn’t win(원형 win: 이기다)은 과거 사실이에요.  2) 가정법 과거완료로 바꾸고 부정은 긍정으로 바꿔요.  3) if절은 had p.p., 주절은 would have p.p.예요.","앞 2칸은 had + train의 p.p., 뒤 3칸은 would + have + win의 p.p.(w로 시작하는 세 글자)예요.","didn’t + didn’t → had p.p. + would have p.p. (긍정으로)");
W("NS","N",26,"주어진 문장을 가정법 문장으로 바꿀 때 빈칸에 알맞은 말을 쓰시오.<br>I’m sorry that I didn’t buy that outfit at that time.<br>I wish I ___ ___ that outfit at that time.","had bought","I wish I had bought that outfit at that time.","내가 그때 그 옷을 샀더라면 좋았을 텐데.",
 "본책 p.176 ‘I wish + 가정법 과거완료’(POINT 2) 박스를 보세요.","1) didn’t buy(원형 buy: 사다)는 과거에 하지 않은 일이에요.  2) 이미 지난 아쉬움이니 I wish + had p.p.예요.  3) 부정은 긍정으로 바뀌어요.","had + buy의 p.p.(b로 시작하는 여섯 글자)예요. 빈칸은 2칸이에요.","과거 아쉬움 → I wish had p.p.");
W("NS","N",27,"주어진 문장을 가정법 문장으로 바꿀 때 빈칸에 알맞은 말을 쓰시오.<br>As I am not tall, I can’t reach the shelf.<br>If I ___ ___, I ___ ___ the shelf.","were tall, could reach","If I were tall, I could reach the shelf.","내가 키가 크다면, 나는 그 선반에 손이 닿을 텐데.",
 "본책 p.172 ‘가정법의 직설법 전환’ 박스에서 가정법 과거 ↔ 직설법 현재를 보세요.","1) am not tall(키가 크지 않다), can’t reach(손이 닿지 않는다)는 현재 사실이에요.  2) 가정법 과거로 바꾸고 부정은 긍정으로 바꿔요.  3) be동사는 were를 써요.","앞 2칸은 be동사 과거(w로 시작) + 위 문장의 형용사, 뒤 2칸은 can의 과거형 + 위 문장의 동사원형이에요.","현재 사실 반대 → were, could 원형");
W("NS","N",28,"어법상 <u>틀린</u> 부분을 찾아 바르게 고치시오.<br>My friend David just came back from a hiking trip. He said it was fun, but it rained a lot. Though it rained a lot, he took so many pictures. The mountain and colorful leaves looked really beautiful. When I look at his pictures, it looks as if it were not rained at all. I wish I had been there. I hope I can join him on the next hike.","were → had","When I look at his pictures, it looks as if it had not rained at all.","그의 사진들을 보면, 마치 비가 전혀 오지 않았던 것처럼 보인다.",
 "본책 p.176 ‘as if + 가정법 과거완료’(POINT 4) 박스의 공식(as if + 주어 + had p.p.)을 보세요.","1) 앞 문장에서 it rained a lot(비가 많이 왔다)로 이미 비가 온 일이에요.  2) 사진을 보는 지금보다 앞선 일이라 had p.p.가 필요해요.  3) not rained(rain: 비가 오다)와 어울리는 도우미 말을 찾아요.","were 자리에 h로 시작하는 세 글자 말을 써요. 그러면 had not rained가 돼요.","as if 앞선 일 → had p.p. (were 아님)");
C("NS","N",29,"어법상 옳지 <u>않은</u> 것끼리 짝지어진 것은?<br>ⓐ I wish the world was always peaceful.<br>ⓑ Julie acts as if she weren’t afraid of roller coasters.<br>ⓒ If I had enough time, I will go to the park with you.<br>ⓓ If it had been stormy, the plane might not took off.<br>ⓔ If Harry heard about the news, he would be really surprised.",["① ⓐ, ⓑ, ⓒ","② ⓐ, ⓒ, ⓓ","③ ⓑ, ⓒ, ⓓ","④ ⓑ, ⓓ, ⓔ","⑤ ⓒ, ⓓ, ⓔ"],"② ⓐ, ⓒ, ⓓ","(ⓐ) I wish the world were always peaceful. (ⓒ) If I had enough time, I would go to the park with you. (ⓓ) If it had been stormy, the plane might not have taken off.","세상이 늘 평화롭다면 좋을 텐데. / 내게 충분한 시간이 있다면, 나는 너와 공원에 갈 텐데. / 폭풍이 불었다면, 그 비행기는 이륙하지 못했을지도 모를 텐데.",
 "본책 p.174 ‘가정법 과거’ 박스(be동사 were, would + 원형)와 ‘가정법 과거완료’ 박스(would/could/might + have p.p.)를 보세요.","1) 다섯 문장을 각각 if절/I wish/as if 뒤 모양과 주절 모양이 짝이 맞는지 확인해요.  2) ⓐ는 I wish 뒤 be동사의 모양, ⓒ는 주절의 will, ⓓ는 might not 뒤 모양을 살펴요.  3) 가정법인데 will이 나오거나 have p.p. 모양이 빠진 문장이 틀린 거예요.","틀린 문장은 ⓐ(was), ⓒ(will), ⓓ(might not took)예요. 이 세 개가 같이 들어간 보기를 골라요.","was/will/took → 가정법 규칙 위반");
W("NS","N",30,"우리말과 일치하도록 주어진 조건에 맞게 영작하시오.<br>내가 더 친절했었더라면, 그녀는 울지 않았을 텐데.<br>(조건: be, nicer, cry를 이용하여 가정법 문장으로 쓸 것 / 총 9단어의 완전한 문장으로 쓸 것)","If I had been nicer, she wouldn’t have cried.","If I had been nicer, she wouldn’t have cried.","내가 더 친절했었더라면, 그녀는 울지 않았을 텐데.",
 "본책 p.174 ‘가정법 과거완료’ 박스의 공식(If + 주어 + had p.p. ~, 주어 + would + have p.p.)을 보세요.","1) ‘친절했었더라면, 울지 않았을 텐데’는 과거 사실의 반대예요.  2) 그러니 가정법 과거완료로 써요.  3) if절은 If I had + be의 p.p. + nicer(더 친절한), 주절은 she + 부정 + have p.p.예요.","if절 다섯 단어 + 주절 네 단어로 맞춰요. 주절의 부정은 would not을 줄인 한 단어로 써야 모두 9단어가 돼요.","If 주어 had p.p., 주어 wouldn’t have p.p.");
// ===== 문법정리노트 =====
W("GN","G",1,"If we had a car, we ___ ___ on a road trip. (가정법 과거 예문)","could go","If we had a car, we could go on a road trip.","만약 우리가 차가 있다면 우리는 장거리 여행을 갈 수 있을 텐데.",
 "본책 p.184 맨 위 ‘가정법 과거’ 형태 식(If + 주어 + 동사의 과거형 ~, 주어 + would/could/might + 동사원형)을 보세요.","1) if절 had(원형 have: 가지다)가 과거형이라 가정법 과거예요.  2) 주절은 조동사 + 동사원형이에요.  3) 해석 ‘갈 수 있을 텐데’에서 조동사를 고르세요.","can의 과거형(c로 시작하는 다섯 글자) 뒤에 ‘가다’의 동사원형을 써요.","가정법 과거 주절 → could + 원형");
W("GN","G",2,"if절의 동사가 be동사인 경우 수와 인칭에 상관없이 ( was / were )를 쓴다.","were","if절의 동사가 be동사인 경우 수와 인칭에 상관없이 were를 쓴다.","if절의 동사가 be동사인 경우 수와 인칭에 상관없이 were를 쓴다.",
 "본책 p.184 가정법 과거 예문 아래 네모 박스를 보세요. (p.174 ‘내신 적중’ 박스에도 같은 설명이 있어요.)","1) 두 보기 중 어느 쪽이 모든 주어에 쓰는 형태인지 생각해요.  2) 주어가 I여도 같은 형태예요.","w로 시작하는 네 글자예요. 가정법 과거의 be동사예요.","if절 be동사는 주어가 I·he여도 were");
W("GN","G",3,"If ___, I would say sorry to him. (만약 내가 너라면, 나는 그에게 미안하다고 말할 텐데.)","I were you","If I were you, I would say sorry to him.","만약 내가 너라면, 나는 그에게 미안하다고 말할 텐데.",
 "본책 p.184 2번 빈칸이 있는 네모 박스의 be동사 설명을 보세요.","1) 한국어 ‘내가 너라면’을 영어로 옮겨 보세요.  2) 가정법 과거라서 if절 be동사는 were예요.  3) 순서는 주어 + be동사 + 보어예요.","주어 + be동사 과거(w로 시작) + 상대방(너)을 가리키는 말, 세 단어예요.","If I were you (내가 너라면)");
W("GN","G",4,"If I ___ ___ up at 7:00 a.m., I ___ ___ ___ breakfast. 중 1~2번째 빈칸 (가정법 과거완료 if절)","had woken","If I had woken up at 7:00 a.m., I would have eaten breakfast.","만약 내가 오전 7시에 일어났었다면, 나는 아침 식사를 했을 텐데.",
 "본책 p.184 ‘가정법 과거완료’ 형태 식(If + 주어 + had p.p. ~)을 보세요.","1) 바로 아래 괄호 속 As I didn’t wake up(일어나지 않았다)은 과거 사실이에요.  2) 과거 사실의 반대이니 if절은 had p.p.예요.  3) wake(깨다, 일어나다)의 p.p.를 써요.","had + wake의 p.p.(w로 시작하는 다섯 글자)예요. 두 칸이에요.","if절 → had p.p.(had woken)");
W("GN","G",5,"If I had woken up at 7:00 a.m., I ___ ___ ___ breakfast. (주절 빈칸 3칸)","would have eaten","If I had woken up at 7:00 a.m., I would have eaten breakfast.","만약 내가 오전 7시에 일어났었다면, 나는 아침 식사를 했을 텐데.",
 "본책 p.184 ‘가정법 과거완료’ 형태 식에서 주절(주어 + would/could/might + have p.p.)을 보세요.","1) if절이 had woken(had p.p.)이라서 주절은 would/could/might + have p.p.예요.  2) 해석 ‘했을 텐데’에 맞는 조동사를 골라요.  3) eat(먹다)의 p.p.를 써요.","would + have + eat의 p.p.(e로 시작하는 다섯 글자)예요. 세 칸이에요.","주절 → would have p.p.");
W("GN","G",6,"I wish I ___ not busy. (내가 바쁘지 않다면 좋을 텐데.)","were","I wish I were not busy.","내가 바쁘지 않다면 좋을 텐데.",
 "본책 p.184 ‘I wish 가정법’ 형태 식(I wish + 주어 + 동사의 과거형 ~)을 보세요.","1) ‘바쁘지 않다면 좋을 텐데’는 현재 소망이에요.  2) 현재 소망이면 I wish + 동사의 과거형이에요.  3) 뒤에 be동사가 오는 경우의 모양을 생각해요.","w로 시작하는 were예요. 가정법 과거의 be동사예요.","I wish I were not ~ = I’m sorry that I am ~");
W("GN","G",7,"I wish I ___ ___ the badminton club. (내가 배드민턴 클럽에 들어갔더라면 좋았을 텐데.)","had joined","I wish I had joined the badminton club.","내가 배드민턴 클럽에 들어갔더라면 좋았을 텐데.",
 "본책 p.184 ‘I wish + 가정법 과거완료’ 식(I wish + 주어 + had p.p. ~)을 보세요.","1) ‘들어갔더라면 좋았을 텐데’는 과거에 이루지 못한 소망이에요.  2) 그러니 I wish + had p.p.예요.  3) join(가입하다)의 p.p.를 써요.","had + join의 p.p.(-ed를 붙여요)예요. 두 칸이에요.","I wish I had p.p. = I’m sorry that I didn’t ~");
W("GN","G",8,"Brad talks as if he ___ ___ ___. (Brad는 자동차를 가진 것처럼 말한다.)","had a car","Brad talks as if he had a car.","브래드는 자동차를 가진 것처럼 말한다.",
 "본책 p.184 ‘as if + 가정법 과거’ 식(as if + 주어 + 동사의 과거형 ~)을 보세요.","1) 말하는 때와 같은 시점의 사실 반대예요(실제로는 차가 없어요).  2) as if 뒤에 주어 he와 과거형 동사를 써요.  3) ‘가진’은 have(가지다)의 과거형을 써요.","have의 과거형(h로 시작하는 세 글자) 뒤에 ‘자동차 한 대’를 써요. 세 칸이에요.","같은 시점 → as if + 과거형");
W("GN","G",9,"Alice looks as if she ___ ___ ___ ___. (Alice는 유령을 봤던 것처럼 보인다.)","had seen a ghost","Alice looks as if she had seen a ghost.","앨리스는 유령을 봤던 것처럼 보인다.",
 "본책 p.184 ‘as if + 가정법 과거완료’ 식(as if + 주어 + had p.p. ~)을 보세요.","1) 한국어가 ‘봤던 것처럼’으로 앞선 시점이에요.  2) 앞선 시점의 사실 반대는 had p.p.예요.  3) see(보다)의 p.p.와 a ghost(유령)를 이어 써요.","had + see의 p.p.(s로 시작하는 네 글자) 뒤에 ‘유령 하나’를 써요. 네 칸이에요.","앞선 시점 → as if + had p.p.");

}

const KEY="link2-sb-v1",PIN="7372";
const PEN='<svg class="pen" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8 19z"/><path d="M14.5 6.5l3 3"/></svg>';
function fresh(){return{it:{},last:0}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
let view="home",cur=null,curCh=0,sh=0,wrong=0,pinv="",tab="stuck";
const Z={h:0,tries:0,ok:null,rev:0,pen:0};function pe(id){return S.it[id]||Z}
function st(id){return S.it[id]||(S.it[id]={h:0,tries:0,ok:null,rev:0,pen:0})}
function IT(id){return ITEMS.find(x=>x.id==id)}
function R(h){document.getElementById("app").innerHTML=h;try{window.scrollTo(0,0)}catch(e){}}
function go(v){view=v;render()}
function render(){({home,chapter,item,answers,unitend,pin,teacher})[view]()}
const doneOf=L=>L.filter(x=>pe(x.id).pen).length;
const chItems=c=>ITEMS.filter(x=>x.ch==c),unItems=uk=>ITEMS.filter(x=>x.uk==uk);
const chList=()=>Object.keys(CHAPS).map(Number).sort((a,b)=>a-b);
function pad2(n){return(n<10?"0":"")+n}
function home(){
 let h='<div class="top"><div class="small">비타민 영어클리닉</div><h1>중학 영문법 Link 2</h1><div class="sub">본책 도우미</div></div>';
 h+='<div class="card"><b>답 대신 힌트</b><div class="small">막히면 힌트를 1 → 2 → 3 순서로 열어요. 맞혀도 연필 한 줄은 꼭 써요.</div></div>';
 chList().forEach(c=>{const L=chItems(c),d=doneOf(L);
  h+='<button class="row" onclick="openCh('+c+')"><span><b>CHAPTER '+pad2(c)+'</b> '+CHAPS[c].name+'</span><span class="pill '+(d==L.length?"on":"")+'">'+d+' / '+L.length+'</span></button>'});
 h+='<div class="foot"><a onclick="go(\'pin\')">선생님</a></div>';R(h)}
function openCh(c){curCh=c;go("chapter")}
function chapter(){const c=curCh;
 let h='<div class="bk"><a onclick="go(\'home\')">목록</a><span class="small">CHAPTER '+pad2(c)+'</span></div><h2>'+CHAPS[c].name+'</h2>';
 CHAPS[c].units.forEach(k=>{const uk=c+"-"+k,L=unItems(uk),U=UN[uk];if(!L.length)return;const d=doneOf(L);
  h+='<button class="row" onclick="start(\''+uk+'\')"><span><b>'+U.n+'</b> '+U.t+'<span class="small"> · '+(U.cp?"개념 "+U.cp+" · ":"")+"문제 "+U.pp+'</span></span><span class="pill '+(d==L.length?"on":"")+'">'+d+' / '+L.length+'</span></button>'});
 R(h)}
function strip(L,cid){const f=L.findIndex(x=>!pe(x.id).pen),lim=f<0?L.length:f;
 return '<div class="strip" id="strip">'+L.map((x,i)=>{const on=x.id==cid,d=pe(x.id).pen,ok=i<=lim;
  return '<button class="chip'+(on?' cur':d?' dn':'')+(ok?'':' lk')+'"'+(ok?' onclick="open_(\''+x.id+'\')"':' disabled')+'>'+(i+1)+'</button>'}).join("")+'</div>'}
function fixStrip(){try{const c=document.querySelector("#strip .cur");if(c)c.scrollIntoView({block:"nearest",inline:"center"})}catch(e){}}
function start(uk){const L=unItems(uk),n=L.find(x=>!pe(x.id).pen)||L[0];open_(n.id)}
function open_(id){cur=id;sh=pe(id).h||0;T0=Date.now();wrong=0;go("item")}
function item(){
 const it=IT(cur),s=pe(cur),U=UN[it.uk],L=unItems(it.uk),op=s.h>0,un=akOpen(L);
 let h='<div class="bk"><a onclick="openCh('+it.ch+')">목록</a><span class="small"><b>본책 p.'+(PG[it.id]||'')+'</b> · CH'+pad2(it.ch)+' · '+U.n+' · '+SECLAB(it)+'</span></div>'+strip(L,cur);
 h+='<div class="ak"><button class="btn mini" '+(un?'onclick="showAns()"':'disabled')+'>전체정답</button></div>';
 h+='<div class="q">'+it.q.replace(/___/g,'<span class="blank"></span>')+'</div>';
 if(it.bank)h+='<div class="small">보기 : '+it.bank.join(" · ")+' (한 번씩만)</div>';
 if(it.opts)h+='<div class="small">보기 : '+it.opts.join(" / ")+'</div>'+(it.kind=="m"?'<div class="small">정답이 여러 개일 수 있어요.</div>':'');
 if(!op){
  h+='<div class="small">본책에 먼저 풀어 보고, 막히면 힌트를 열어요.</div><button class="btn" onclick="openHints()">힌트 보기</button>';
 }else{
  h+='<div class="hint">'+[0,1,2].map(i=>'<div class="hp"><b>힌트 '+(i+1)+'</b> '+it.h[i]+'</div>').join("")+'</div>';
  h+='<div class="post"><div class="pt">'+PEN+' 책에 쓰기 · 본책 p.'+(PG[it.id]||'')+' 이 문제 옆 여백에 한 줄</div><div class="pl">답과 그 이유를 내 말로 한 줄 써요.</div><div class="pt2">맞혔어도 이 한 줄은 꼭 써요.</div></div>';
  if(!s.pen)h+='<button class="btn pencil" onclick="penDone()">'+PEN+' 다 썼어요</button>';
  else{const last=L[L.length-1].id==cur;h+='<div class="small ok">연필 한 줄 완료</div>'+(L[0].id==cur?'<button class="btn" onclick="nextItem()">'+(last?"이 파트 마무리":"다음 문제")+'</button>':'<div class="two"><button class="btn ghost" onclick="prevItem()">이전 문제</button><button class="btn" onclick="nextItem()">'+(last?"이 파트 마무리":"다음 문제")+'</button></div>')}
 }
 if(!s.pen&&L[0].id!=cur)h+='<button class="btn ghost" onclick="prevItem()">이전 문제</button>';
 R(h);fixStrip()}
function akOpen(L){return pe(L[L.length-1].id).h>0}
function showAns(){const it=IT(cur),L=unItems(it.uk);if(!akOpen(L))return;S.ak=S.ak||{};S.ak[it.uk]={t:Date.now(),d:tdy()};save();go("answers")}
function answers(){const it=IT(cur),L=unItems(it.uk),U=UN[it.uk];let sec="",rows="";
 L.forEach(x=>{const lb=SECLAB(x).replace(/ · \d+번$/,'');if(lb!=sec){sec=lb;rows+='<tr><td colspan="2" class="sh">'+lb+'</td></tr>'}
  rows+='<tr><td class="nb"><i>'+x.n+'</i></td><td><span class="chip2">'+(Array.isArray(x.ans)?x.ans.join(", "):x.ans)+'</span></td></tr>'});
 R('<div class="bk"><a onclick="go(\'item\')">문제로 돌아가기</a><a onclick="openCh('+it.ch+')">목록</a></div><h2>'+U.n+' 전체정답</h2><table class="at">'+rows+'</table><button class="btn" onclick="go(\'item\')">문제로 돌아가기</button>')}
function openHints(){const s=st(cur);if(!s.h){s.h=3;s.t1=Math.min(900,Math.round((Date.now()-T0)/1000))}save();render()}
function prevItem(){const it=IT(cur),L=unItems(it.uk),i=L.findIndex(x=>x.id==cur);if(i>0)open_(L[i-1].id)}
function penDone(){const s=st(cur);if(!s.pen){s.pen=1;s.pt=Date.now();s.pd=tdy();s.sec=Math.min(900,Math.round((Date.now()-T0)/1000))}save();render()}
let T0=Date.now();
function tdy(){const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function hmOf(t){const d=new Date(t);return pad2(d.getHours())+":"+pad2(d.getMinutes())}
window.__gi=function(){try{const td=tdy(),by={};
 ITEMS.forEach(x=>{const e=S.it[x.id];if(e&&e.pen&&e.pd==td)(by[x.uk]||(by[x.uk]=[])).push(x)});
 return Object.keys(by).map(uk=>{const L=unItems(uk),D=by[uk],U=UN[uk];let fast=0,t1=1e15,t2=0;const q=[];
  D.forEach(x=>{const e=S.it[x.id];if(e.sec!=null&&e.sec<8)fast++;if(e.t1!=null&&e.t1<5)q.push(SECSHORT(x));if(e.pt<t1)t1=e.pt;if(e.pt>t2)t2=e.pt});
  const all=L.filter(x=>pe(x.id).pen).length,ak=S.ak&&S.ak[uk]&&S.ak[uk].d==td?S.ak[uk].t:0;
  return{uk:uk,w:"Link2 본책 CH"+pad2(L[0].ch)+" "+U.n+" · 오늘 연필 "+D.length+"줄 (전체 "+all+"/"+L.length+")"+(q.length?" · 5초 안에 힌트 연 문제 "+q.length+"개 ("+q.slice(0,6).join(", ")+(q.length>6?" 외":"")+")":"")+(fast?" · 8초 안에 넘김 "+fast+"개":"")+(ak?" · 전체정답 "+hmOf(ak)+" 확인":" · 전체정답 아직")+" · "+hmOf(t1)+"~"+hmOf(t2)}})}catch(e){return[]}};
function nextItem(){const it=IT(cur),L=unItems(it.uk),i=L.findIndex(x=>x.id==cur);
 if(i==L.length-1){go("unitend");return}open_(L[i+1].id)}
function unitend(){const it=IT(cur),L=unItems(it.uk),U=UN[it.uk];
 R('<div class="bk"><a onclick="openCh('+it.ch+')">목록</a></div><h2>'+U.n+' 끝</h2>'+strip(L,null)+'<button class="btn" onclick="showAns()">전체정답 보기</button><div class="post"><div class="pt">'+PEN+' 오늘 쓴 줄 모아 보기</div>'+L.map(x=>'<div class="pl"><span class="small">'+SECSHORT(x)+'</span> '+x.pen+'</div>').join("")+'</div><button class="btn" onclick="openCh('+it.ch+')">목록으로</button>')}
function pin(){pinv="";pinui()}
function pinui(){R('<div class="bk"><a onclick="go(\'home\')">목록</a></div><h2>선생님 확인</h2><div class="dots">'+[0,1,2,3].map(i=>'<i class="'+(i<pinv.length?"f":"")+'"></i>').join("")+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9,"",0,"←"].map(k=>k===""?'<span></span>':'<button onclick="pk(\''+k+'\')">'+k+'</button>').join("")+'</div>')}
function pk(k){if(k=="←")pinv=pinv.slice(0,-1);else if(pinv.length<4)pinv+=k;if(pinv.length==4){if(pinv==PIN){tab="stuck";go("teacher");return}pinv=""}pinui()}
function teacher(){
 let h='<div class="bk"><a onclick="go(\'home\')">나가기</a><span class="small">선생님 화면</span></div><div class="tabs">'+[["stuck","바로 힌트 연 문제"],["ctl","관리"]].map(([k,n])=>'<button class="'+(tab==k?"on":"")+'" onclick="tab=\''+k+'\';render()">'+n+'</button>').join("")+'</div>';
 if(tab=="stuck"){
  const pen=ITEMS.filter(x=>pe(x.id).pen).length;
  h+='<div class="small">이 기기에서 쓴 기록입니다. 학생별 기록은 보드 선생님 화면에서 봐요.</div><div class="card"><b>연필 한 줄 완료</b> '+pen+' / '+ITEMS.length+'</div>';
  chList().forEach(c=>{const L=chItems(c);h+='<div class="small">CHAPTER '+pad2(c)+' '+CHAPS[c].name+' : '+doneOf(L)+' / '+L.length+'</div>'});
  const S2=ITEMS.filter(x=>pe(x.id).t1!=null&&pe(x.id).t1<5);
  h+='<div class="small" style="margin-top:10px">문제를 보고 5초 안에 힌트를 연 문제</div>';
  if(!S2.length)h+='<div class="card small">아직 없어요.</div>';
  S2.forEach(x=>{const s=pe(x.id);h+='<div class="card"><b>CH'+pad2(x.ch)+' · '+UN[x.uk].n+' · '+SECLAB(x)+'</b><div class="small">힌트까지 '+s.t1+'초</div></div>'});
 }else h+='<div class="card"><b>초기화</b><div class="small">이 기기의 기록을 지웁니다.</div><button class="btn ghost" onclick="S=fresh();save();go(\'home\')">지우기</button></div>';
 R(h)}
render();

</script><script src="https://nolbada.github.io/vita/nav.js"></script>
