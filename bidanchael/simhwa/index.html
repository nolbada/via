<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비단챌 심화</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5944a4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efecf6; --panel:#ffffff; --panel2:#eae4f4; --line:#ddd5ec;
  --ink:#20182e; --muted:#4f4666; --soft:#7c7391;
  --accent:#5944a4; --accent-ink:#ffffff; --hi:#4a3894;
  --paper:#ffffff; --paper-ink:#20182e; --paper-mute:#716a86; --paper-line:#ddd5ec;
  --c-eok:#1F5FA8; --c-ssu:#C2570C; --c-tteut:#6B3FA0; --c-hae:#B3235A; --c-byeon:#0F766E;
  --ok:#2e9d6b; --bad:#d6453d;
  --main:#c62828; --sub:#1565c0;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme: light;
}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.demo{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:12px;color:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.demo button{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--hi)}
h1{font-size:26px;font-weight:900;margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:18px;font-weight:900;margin:0}
.sub{font-size:13px;color:var(--muted)}
.top{display:flex;align-items:center;gap:10px}
.back{background:var(--panel);border:0;border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:0;border-radius:14px;padding:14px;text-align:left;width:100%;min-width:0}
.row[disabled]{opacity:.55;cursor:not-allowed}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;font-size:15px}
.row .d{font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.pill.done{background:var(--ok);color:#fff}
.banner{background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55}
.banner b{color:var(--hi)}
.card{background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:11px;min-width:0}
.chip{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;color:#fff;font-weight:700;font-size:13px}
.chip.eok,.chip.hae{border-radius:5px}.chip.ssu,.chip.tteut,.chip.byeon{border-radius:50%}
.eok{background:var(--c-eok)}.ssu{background:var(--c-ssu)}.tteut{background:var(--c-tteut)}.hae{background:var(--c-hae)}.byeon{background:var(--c-byeon)}
.tl{font-size:12px;font-weight:700}
.tl.eok{color:var(--c-eok);background:none}.tl.ssu{color:var(--c-ssu);background:none}.tl.tteut{color:var(--c-tteut);background:none}.tl.hae{color:var(--c-hae);background:none}.tl.byeon{color:var(--c-byeon);background:none}
.cardhead{display:flex;align-items:center;gap:10px}
.cardhead .no{margin-left:auto;font-size:12px;font-weight:700;color:var(--paper-mute);font-variant-numeric:tabular-nums}
.word{font-size:28px;font-weight:900;line-height:1.1}
.word small{font-size:14px;font-weight:500;color:var(--paper-mute);margin-left:6px}
.key{font-size:18px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.body{font-size:14px;line-height:1.6;color:#3f3858}
.todo{background:#fff;border:1.5px dashed var(--c-eok);border-radius:10px;padding:10px 12px}
.todo .l{font-size:11px;font-weight:700;margin-bottom:3px}
.todo p{margin:0;font-size:14px;line-height:1.5}
.src{font-size:11px;color:var(--paper-mute)}
.bar{display:flex;gap:4px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--accent)}
.nav{display:flex;gap:10px}
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:900;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.nav .btn{flex:1}
.q{background:#fff;border-radius:10px;padding:11px 12px;font-size:14.5px;line-height:1.6}
.q b.n{color:var(--c-tteut);margin-right:4px}
.q mark{background:#ffe9a8;color:inherit;padding:0 2px;border-radius:3px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:#fff;border:2px solid #cfc8e0;border-radius:10px;padding:12px;font-weight:700;font-size:15px;text-align:left;color:var(--paper-ink)}
.opt.right{border-color:var(--ok);background:#e5f6ee}
.opt.wrong{border-color:var(--bad);background:#fde9e7}
.opt[disabled]{cursor:default}
.fb{font-size:13px;line-height:1.55;border-radius:10px;padding:10px 12px}
.fb.ok{background:#e5f6ee;color:#14513a}.fb.no{background:#fde9e7;color:#7d2620}
.lock{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--panel2);border-radius:16px;padding:34px 20px;text-align:center}
.legend{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.6;color:var(--paper-ink)}
.vm{text-decoration:underline;text-decoration-color:var(--main);text-decoration-thickness:3px;text-underline-offset:4px;font-weight:700}
.vs{text-decoration:underline;text-decoration-color:var(--sub);text-decoration-thickness:2px;text-decoration-style:dashed;text-underline-offset:4px;font-weight:700}
.sent{background:#fff;border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:3px;color:var(--paper-ink)}
.sent .m{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:700;color:var(--paper-mute)}
.sent .tag{color:var(--sub);border:1px solid var(--sub);border-radius:4px;padding:0 4px;font-size:10px}
.sent .en{font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.sent .ko{font-size:13px;line-height:1.5;color:#3f3858}
.paperwrap{background:var(--paper);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px;color:var(--paper-ink)}
.wrongrow{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--paper-ink)}
.wrongrow b{min-width:44px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.card,.row,.sent{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
.copybox{position:relative;background:#fffbe6;border:2px dashed #b8a24a;border-radius:10px;padding:22px 14px 12px;display:flex;flex-direction:column;gap:7px;margin-top:6px}
.ctab{position:absolute;top:-11px;left:12px;background:#b8a24a;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px}
.ckey{font-size:19px;font-weight:900;line-height:1.35;overflow-wrap:anywhere}.ckey span{font-size:15px;font-weight:700;color:#3f3858}
.cex{font-size:14px;line-height:1.55}.cex span{color:#3f3858}
.cpt{font-size:13.5px;font-weight:700;color:var(--c-byeon)}
.cbad{font-size:14px;font-weight:900;color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.warn{position:relative;border:2px solid var(--bad);background:#fdeceb;border-radius:10px;padding:20px 12px 11px;font-size:14px;line-height:1.6;color:#6b1f1a;font-weight:700}
.wtab{position:absolute;top:-11px;left:12px;background:var(--bad);color:#fff;font-size:11px;font-weight:900;border-radius:6px;padding:2px 8px}
.trap{background:var(--bad);color:#fff;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.55}
.meanbox{border:1px solid var(--paper-line);background:#fff;border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:4px}
.meanbox .mt{font-size:11px;font-weight:700;color:var(--paper-mute)}
.mr{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.5}.mr span{color:#3f3858}.mr.me b{color:var(--ok)}
.note{display:inline-flex;gap:4px;align-items:baseline;font-size:12px;color:var(--sub);background:#eaf2fb;border-radius:6px;padding:3px 8px;align-self:flex-start;margin-top:3px}
.note span{color:#35506e}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--c-tteut);text-align:center;font-weight:900;color:var(--c-tteut)}
.qko{font-size:13px;color:var(--paper-mute);margin-top:4px}
.toks{display:flex;flex-wrap:wrap;gap:6px}
.tok{background:#fff;border:2px solid #cfc8e0;border-radius:8px;padding:7px 10px;font-size:15px;font-weight:700;color:var(--paper-ink)}
.tok.right{border-color:var(--ok);background:#e5f6ee}.tok.wrong{border-color:var(--bad);background:#fde9e7}
.tok[disabled]{cursor:default}
.tok.vm,.tok.vs{background:#fff}
.chunk{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4px 12px;padding:4px 0;border-top:1px dashed var(--paper-line)}
.chunk .en{font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.chunk .ko{font-size:13.5px;line-height:1.5;color:#3f3858}
@media (max-width:360px){.chunk{grid-template-columns:1fr}}
.cover{border-radius:16px;padding:16px 16px 14px;color:#fff;display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,var(--bk) 0%,var(--bk2) 100%);border:1px solid rgba(255,255,255,.18)}
.cover .ct{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.cover .cs{font-size:12px;font-weight:700;letter-spacing:.12em;opacity:.85}.cover .cb{font-size:28px;font-weight:900;line-height:1.1}.cover .cn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.pbar{position:relative;height:12px;border-radius:99px;background:rgba(0,0,0,.28);overflow:hidden}.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#fff}
.pmile{position:relative;height:6px}.pmile b{position:absolute;top:0;width:2px;height:6px;background:rgba(255,255,255,.7)}
.cover .cm{font-size:12px;opacity:.92}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:26px 16px;border-radius:16px;background:linear-gradient(135deg,var(--bk) 0%,var(--bk2) 100%);color:#fff}.fin h1{font-size:30px}.fin .big{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}

.tab{flex:1;background:var(--panel);border:0;border-radius:10px;padding:10px 0;font-weight:700;color:var(--muted)}
.tab.on{background:var(--accent);color:var(--accent-ink)}.tab[disabled]{opacity:.45;cursor:not-allowed}
.guide{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.guide li{display:flex;gap:12px;background:var(--panel);border-radius:12px;padding:12px 14px;min-width:0}
.gn{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px}
.guide b{display:block;font-size:14.5px}.guide .gd{display:block;font-size:12.5px;color:var(--muted);line-height:1.55}
.picker{background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:11px}
.plabel{font-size:12px;font-weight:700;color:var(--paper-mute)}
.prow{display:flex;gap:8px;align-items:center}
.arrow{flex:0 0 auto;width:46px;height:46px;border-radius:12px;border:2px solid #cfc8e0;background:#fff;display:flex;align-items:center;justify-content:center}
.arrow[disabled]{opacity:.35;cursor:not-allowed}
#rsel{flex:1;min-width:0;height:46px;border-radius:12px;border:2px solid var(--accent);background:#fff;color:var(--paper-ink);font:inherit;font-size:20px;font-weight:900;text-align:center;text-align-last:center;font-variant-numeric:tabular-nums}
.seg{display:flex;border:2px solid var(--accent);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:#fff;border:0;padding:9px 0;font-weight:700;color:var(--paper-ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stat{display:flex;gap:6px;flex-wrap:wrap}
.picker .pill{background:#ebe6f5;color:#3f3858}.picker .pill.done{background:var(--ok);color:#fff}.picker .pill.on{background:var(--accent);color:var(--accent-ink)}
.bigno{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}

.cover{color:var(--cink)}
.pbar i{background:var(--cink)}.pmile b{background:var(--cink);opacity:.7}
.pbar{background:rgba(0,0,0,.2)}
.stamps{display:flex;flex-wrap:wrap;gap:5px}
.stamps span{width:22px;height:22px;border-radius:50%;border:2px solid var(--cink);opacity:.5;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center}
.stamps span.on{opacity:1;background:var(--cink);color:var(--bk)}
.fin{color:var(--cink)}.fin .btn{background:var(--cink);color:var(--bk)}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.links a{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:700;text-decoration:none;color:#fff;font-size:12.5px}
.links a.cur{outline:3px solid var(--ink);outline-offset:1px}
.ldot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff}

.dn{margin-top:4px;font-size:12.5px;color:var(--paper-ink)}
.dn summary{cursor:pointer;color:var(--hi);font-weight:700;font-size:12px;list-style:none;display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.dn summary::-webkit-details-marker{display:none}
.dn ul{margin:6px 0 0;padding:8px 10px 8px 22px;background:#f7f7f9;border-radius:8px;line-height:1.55}
.dn li{margin:3px 0}.dn .dk{font-size:10.5px;font-weight:700;color:var(--sub);border:1px solid var(--sub);border-radius:4px;padding:0 4px;margin-left:4px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:-8px 0 0}
.top>div{flex:1;min-width:0}
.tophome{flex:0 0 auto;border:0;border-radius:999px;padding:10px 18px;font-weight:900;font-size:15px;background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 rgba(0,0,0,.18)}
</style>


</head>

<script>
(function(){
"use strict";
var D=window.BDC,BOOKNAME=D.book,BOOK=D.theme,NMAX=BOOK.max,LINKS=D.links||[];
var KEY='bdc_'+BOOKNAME+'_v1';

var V={s:'home',i:0,banner:''};
var R={size:10,start:1};
try{if(S.r&&(S.r.size===10||S.r.size===20)&&S.r.start>=1&&S.r.start<=NMAX){R.size=S.r.size;R.start=S.r.start;}}catch(e){}
var $app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pad(n){return ('000'+n).slice(-4);}

var ICON_BACK='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="#20182e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var ICON_L=ICON_BACK,ICON_R='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 3l6 6-6 6" fill="none" stroke="#20182e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* 현재 범위의 블록들 */
function blocks(){var a=[R.start];if(R.size===20&&R.start+10<=NMAX){a.push(R.start+10);}return a;}
function ready(){return blocks().every(function(b){return D.blocks[b];});}
function cur(){var o={cards:[],quiz:[],sent:[]};blocks().forEach(function(b){var x=D.blocks[b];if(x){o.cards=o.cards.concat(x.cards);o.quiz=o.quiz.concat(x.quiz);o.sent=o.sent.concat(x.sent);}});return o;}
function allDone(k){return blocks().every(function(b){return S[k][b];});}
function blockDone(st,size){var a=[st];if(size===20&&st+10<=NMAX){a.push(st+10);}return a.every(function(b){return S.m2[b];});}
function doneCount(){var n=0;Object.keys(S.m2).forEach(function(b){if(S.m2[b]){n+=Math.min(10,NMAX-Number(b)+1);}});return n;}

function opts(q,i){var a=q.o.slice();var k=i%3;return a.slice(k).concat(a.slice(0,k));}
function answered(q){var a=S.q[q.no];if(!a){return false;}return q.k==='b'?a.pick!==undefined:a.ok!==undefined;}
function nAns(){return cur().quiz.filter(answered).length;}
function wrongs(){return cur().quiz.filter(function(q){return answered(q)&&S.q[q.no].ok===false;});}
function go(s,i){V.s=s;V.i=i||0;try{history.pushState({s:V.s,i:V.i},'');}catch(e){}render();window.scrollTo(0,0);}
function persist(){S.r={size:R.size,start:R.start};S.v={s:V.s,i:V.i,t:Date.now()};save();try{history.replaceState({s:V.s,i:V.i},'');}catch(e){}}
function chip(t){return '<span class="chip '+TYPES[t].c+'" aria-hidden="true">'+t+'</span>';}
function rangeText(){var b=blocks();return pad(b[0])+' – '+pad(Math.min(b[b.length-1]+9,NMAX));}
function topbar(title,back){return '<div class="top"><button type="button" class="back" data-go="'+back+'" aria-label="뒤로">'+ICON_BACK+'</button><div><div class="eyebrow">비단챌 '+BOOKNAME+' · '+rangeText()+'</div><h1 style="font-size:21px">'+title+'</h1></div><button type="button" class="tophome" data-go="home">홈</button></div>';}
function bar(n,c){var h='<div class="bar" aria-hidden="true">';for(var k=0;k<n;k++){h+='<i class="'+(k<=c?'on':'')+'"></i>';}return h+'</div>';}

function mix(h,t){var n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,f=function(c){return Math.round(c+(255-c)*t);};return 'rgb('+f(r)+','+f(g)+','+f(b)+')';}
function lum(h){var n=parseInt(h.slice(1),16),c=[n>>16,(n>>8)&255,n&255].map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function theme(){var st=document.documentElement.style,ink=lum(BOOK.c1)>.3?'#1d2a12':'#ffffff';
  st.setProperty('--accent',BOOK.c1);st.setProperty('--accent-ink',ink);st.setProperty('--cink',ink);st.setProperty('--hi',BOOK.c2);
  st.setProperty('--bk',BOOK.c1);st.setProperty('--bk2',BOOK.c2);st.setProperty('--bg',mix(BOOK.c1,.9));st.setProperty('--line',mix(BOOK.c1,.75));st.setProperty('--panel2',mix(BOOK.c1,.82));}

function cover(){var d=doneCount(),p=Math.max(1.2,d/NMAX*100),ms='',st='',nx=Math.min(NMAX,(Math.floor(d/100)+1)*100),m;

   '<div class="stamps" aria-label="100번마다 찍히는 도장">'+st+'</div>'+
   '<div class="cm">'+(d>=NMAX?'이 책을 모두 뗐어요!':pad(nx)+'까지 '+(nx-d)+'문장 남았어요. 100번마다 도장이 찍혀요.')+'</div></div>';}
function fin(){return '<div class="fin"><div class="cs" style="font-size:12px;font-weight:700;letter-spacing:.12em">비단챌 '+BOOKNAME+'</div><h1>책거리!</h1><div class="big">'+pad(NMAX)+' / '+pad(NMAX)+'</div><div>'+NMAX+'문장을 모두 해석했어요.<br>이제 '+BOOKNAME+' 한 권을 뗐어요.</div>'+(BOOK.next?'<div class="sub" style="color:inherit;opacity:.9">다음 책 : 비단챌 '+BOOK.next+'</div>':'<div class="sub" style="color:inherit;opacity:.9">비단챌 시리즈를 모두 뗐어요. 정말 대단해요!</div>')+'<button type="button" class="btn" data-go="home">처음 화면으로</button></div>';}
function linksRow(){if(!LINKS.length){return '';}var h='<div class="links"><span>다른 책</span>';LINKS.forEach(function(l){h+='<a href="'+esc(l.url)+'" style="background:'+l.c+(lum(l.c)>.3?';color:#1d2a12':'')+'" '+(l.name===BOOKNAME?'class="cur" aria-current="page"':'')+'>'+esc(l.name)+'</a>';});return h+'</div>';}

function home(){
  var h=cover()+'<div><h1>비단챌 활용법</h1><div class="sub" style="margin-top:4px">이 순서대로 하면 숙제 한 번이 단어 공부가 돼요.</div></div>';
  var G=[['책에 내 해석 쓰기','오늘 번호 문장을 먼저 혼자 해석해서 책에 써요. 동사에도 밑줄을 쳐 봐요.'],['번호 고르기','앱에서 같은 번호를 골라요. 책 번호와 앱 번호는 같아요.'],['미션 1 · 이것만은 꼭','핵심 3개를 읽고, 박스 안 내용을 책에 옮겨 써요.'],['미션 2 · 문장 미션','빈칸 채우기와 동사 찾기를 풀어요. 틀린 번호는 책에 체크해요.'],['정답과 비교하기','미션을 마치면 해석 코너가 열려요. 내 해석이 맞았는지 비교하고, 특히 동사 밑줄을 제대로 쳤는지 꼼꼼히 확인해요. 틀린 곳은 다른 색 펜으로 고쳐요. 빨강은 주절 동사, 파랑은 딸린 절 동사예요.']];
  h+='<ol class="guide">';
  G.forEach(function(g,k){h+='<li><span class="gn">'+(k+1)+'</span><div><b>'+g[0]+'</b><span class="gd">'+g[1]+'</span></div></li>';});
  h+='</ol>';
  var starts=[];for(var x=1;x<=NMAX;x+=R.size){starts.push(x);}
  h+='<div class="picker"><div class="plabel">오늘 숙제 번호</div><div class="prow"><button type="button" class="arrow" data-act="prev" aria-label="이전 번호" '+(R.start<=1?'disabled':'')+'>'+ICON_L+'</button><select id="rsel" aria-label="번호 범위">';
  starts.forEach(function(st){var lab=pad(st)+' – '+pad(Math.min(st+R.size-1,NMAX));var rd=[st].concat(R.size===20&&st+10<=NMAX?[st+10]:[]).every(function(b){return D.blocks[b];});
    h+='<option value="'+st+'"'+(st===R.start?' selected':'')+'>'+(blockDone(st,R.size)?'✓ ':'')+lab+(rd?'':' (준비 중)')+'</option>';});
  h+='</select><button type="button" class="arrow" data-act="next" aria-label="다음 번호" '+(R.start+R.size>NMAX?'disabled':'')+'>'+ICON_R+'</button></div>';
  h+='<div class="seg" role="group" aria-label="한 번에 하는 문장 수"><button type="button" data-act="s10" aria-pressed="'+(R.size===10)+'">10개씩</button><button type="button" data-act="s20" aria-pressed="'+(R.size===20)+'">20개씩</button></div>';
  if(ready()){
    var n=cur().quiz.length,m1=allDone('m1'),m2=allDone('m2');
    h+='<div class="stat"><span class="pill'+(m1?' done':'')+'">미션 1 '+(m1?'완료':'전')+'</span><span class="pill'+(m2?' done':(nAns()?' on':''))+'">미션 2 '+(m2?'완료':nAns()+' / '+n)+'</span><span class="pill'+(m2?' done':'')+'">해석 '+(m2?'열림':'잠김')+'</span></div>';
    h+='<button type="button" class="btn" data-go="day">이 번호로 시작</button>';
  }else{
    h+='<div class="fb no" style="background:var(--panel2);color:var(--ink)">이 번호는 아직 준비 중이에요. 조금만 기다려 주세요.</div><button type="button" class="btn" disabled>이 번호로 시작</button>';
  }
  h+='</div>';
  if(doneCount()>=NMAX){h+='<button type="button" class="btn" data-go="fin">책거리 화면 보기</button>';}
  return h+linksRow();
}

function day(){
  var C=cur(),n=C.quiz.length,m1=allDone('m1'),m2=allDone('m2');
  var h=topbar(rangeText(),'home');
  if(V.banner){h+='<div class="banner">'+V.banner+'</div>';V.banner='';}
  h+='<div class="banner"><b>먼저 책에 내 해석을 써 두세요.</b> 그다음 미션을 시작해요.</div><div class="stack">';
  h+='<button type="button" class="row" data-go="m1"><div class="grow"><div class="t">미션 1 · 이것만은 꼭</div><div class="d">오늘의 핵심 '+C.cards.length+'개를 읽고 책에 옮겨 써요</div></div>'+(m1?'<span class="pill done">완료</span>':'<span class="pill on">시작</span>')+'</button>';
  h+='<button type="button" class="row" data-go="m2"><div class="grow"><div class="t">미션 2 · 문장 미션</div><div class="d">빈칸 채우기와 동사 찾기 '+n+'문제</div></div>'+(m2?'<span class="pill done">완료</span>':'<span class="pill'+(nAns()?' on':'')+'">'+nAns()+' / '+n+'</span>')+'</button>';
  h+='<button type="button" class="row" data-go="hae"><div class="grow"><div class="t">해석 코너</div><div class="d">'+(m2?'내 해석과 동사 표시를 확인해 봐요':'미션 1과 2를 마치면 열려요')+'</div></div>'+(m2?'<span class="pill done">열림</span>':'<span class="pill">잠김</span>')+'</button>';
  if(wrongs().length){h+='<button type="button" class="row" data-go="wr"><div class="grow"><div class="t">오답노트</div><div class="d">틀린 번호는 책에 체크하고 뜻만 적어요</div></div><span class="pill on">'+wrongs().length+'</span></button>';}
  return h+'</div>';
}

function m1(){
  var C=cur().cards,c=C[V.i],T=TYPES[c.t];
  var h=topbar('미션 1 · 이것만은 꼭','day')+bar(C.length,V.i);
  h+='<div class="card"><div class="cardhead"><span class="bigno">'+c.no+'</span>'+chip(c.t)+'<span class="tl '+T.c+'">'+T.n+'</span><span class="no">'+(V.i+1)+' / '+C.length+'</span></div>';
  h+='<div class="word">'+esc(c.w)+'<small>'+esc(c.m)+'</small></div>';
  h+='<div class="body"><b>언제 써요?</b><br>'+esc(c.when)+'</div>';
  if(c.warn){h+='<div class="warn"><div class="wtab">시험에 자주 나와요</div>'+esc(c.warn)+'</div>';}
  h+='<div class="body"><b>기억할 것</b><br>'+esc(c.watch)+'</div>';
  h+='<div class="copybox"><div class="ctab">책 '+c.no+'번 옆에 이대로 써요</div>';
  c.copy.forEach(function(r){
    if(r[0]==='key'){h+='<div class="ckey">'+esc(r[1])+'<span> '+esc(r[2])+'</span></div>';}
    else if(r[0]==='bad'){h+='<div class="cbad">'+esc(r[1])+'</div>';}
    else if(r[0]==='ex'){h+='<div class="cex">'+esc(r[1])+'<br><span>'+esc(r[2])+'</span></div>';}
    else{h+='<div class="cpt">'+esc(r[1])+'</div>';}
  });
  h+='</div></div>';
  h+='<div class="nav"><button type="button" class="btn ghost" id="prev" '+(V.i===0?'disabled':'')+'>이전</button>';
  h+=(V.i<C.length-1?'<button type="button" class="btn" id="next">다음 카드</button>':'<button type="button" class="btn" id="fin1">미션 1 마치기</button>')+'</div>';
  return h;
}

function grp(q,k){var g=q.toks[k][2],r=[];if(!q.toks[k][1]){return [k];}q.toks.forEach(function(t,j){if(t[1]&&t[2]===g){r.push(j);}});return r;}
function m2(){
  var Q=cur().quiz,n=Q.length,i=V.i,q=Q[i],a=S.q[q.no]||{};
  var h=topbar('미션 2 · 문장 미션','day')+bar(n,i);
  h+='<div class="card"><div class="cardhead"><span class="bigno">'+q.no+'</span><span class="word" style="font-size:20px">'+esc(q.w)+'</span><span class="no">'+(i+1)+' / '+n+'</span></div>';
  if(q.k==='b'){
    var done=a.pick!==undefined;
    var sent=esc(q.s).replace('____','<span class="blank">'+(done?esc(q.a):'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;')+'</span>');
    h+='<div class="q">'+sent+'<div class="qko">'+esc(q.ko)+'</div></div><div class="sub" style="color:var(--paper-mute)">빈칸에 알맞은 말을 골라요.</div><div class="opts">';
    opts(q,i).forEach(function(t,k){
      var cls='opt';if(done){if(t===q.a){cls+=' right';}else if(t===a.pick){cls+=' wrong';}}
      h+='<button type="button" class="'+cls+'" data-opt="'+k+'" '+(done?'disabled':'')+'>'+esc(t)+'</button>';
    });
    h+='</div>';
    if(done){
      var tr=(!a.ok&&q.trap&&q.trap[a.pick])?'<div class="trap">'+esc(q.trap[a.pick])+'</div>':'';
      h+=tr+(a.ok?'<div class="fb ok">정답이에요. '+esc(q.why)+'</div>':'<div class="fb no">정답은 <b>'+esc(q.a)+'</b>. '+esc(q.why)+' 책 '+q.no+'번에 체크하고 뜻만 적어요.</div>');
      if(q.om){h+='<div class="meanbox"><div class="mt">세 단어의 뜻</div>';q.o.forEach(function(t){h+='<div class="mr'+(t===q.a?' me':'')+'"><b>'+esc(t)+'</b><span>'+esc(q.om[t])+'</span></div>';});h+='</div>';}
    }
  }else{
    var hasSub=q.toks.some(function(t){return t[1]==='s';});var step=a.m===undefined?1:((hasSub&&a.s===undefined)?2:3);
    h+='<div class="sub" style="color:var(--paper-ink);font-weight:700">'+(step===1?'이 문장의 주인공(주절) 동사를 눌러요. 동사 한 곳만 눌러도 조동사까지 함께 선택돼요.':step===2?'뒤에 딸린 절의 동사를 눌러요. 여기도 한 곳만 누르면 돼요.':'확인해 봐요.')+'</div><div class="toks">';
    q.toks.forEach(function(t,k){
      var cls='tok';
      if(step===3){cls+=t[1]==='m'?' vm':t[1]==='s'?' vs':'';}
      else{if(a.m!==undefined&&grp(q,a.m).indexOf(k)>=0){cls+=a.mok?' right':' wrong';}if(a.s!==undefined&&grp(q,a.s).indexOf(k)>=0){cls+=a.sok?' right':' wrong';}}
      h+='<button type="button" class="'+cls+'" data-tok="'+k+'" '+(step===3?'disabled':'')+'>'+esc(t[0])+'</button>';
    });
    h+='</div><div class="qko" style="color:var(--paper-mute);font-size:13px">'+esc(q.ko)+'</div>';
    if(step===2){h+='<div class="fb '+(a.mok?'ok':'no')+'">주절 동사 : '+(a.mok?'맞아요.':'아니에요.')+'</div>';}
    if(step===3){h+=a.ok?'<div class="fb ok">모두 맞아요. '+esc(q.why)+'</div>':'<div class="fb no">'+esc(q.why)+' 책 '+q.no+'번에 체크해요.</div>';}
  }
  h+='</div><div class="nav"><button type="button" class="btn ghost" id="prev" '+(i===0?'disabled':'')+'>이전</button>';
  if(i<n-1){h+='<button type="button" class="btn" id="next" '+(answered(q)?'':'disabled')+'>다음 문제</button>';}
  else{h+='<button type="button" class="btn" id="fin2" '+(nAns()<n?'disabled':'')+'>미션 2 마치기</button>';}
  return h+'</div>';
}

function hae(){
  var h=topbar('해석 코너','day'),m2d=allDone('m2');
  if(!m2d){
    var n=cur().quiz.length;
    return h+'<div class="lock">'+ICON_LOCK+'<h2>미션 1과 미션 2를 마치면 열려요</h2><div class="sub">책에 내 해석과 동사 밑줄을 먼저 해 두었나요? 미션을 마치면 정답으로 확인할 수 있어요.</div></div>'+
      '<div class="stack"><div class="row" style="cursor:default"><div class="grow"><div class="t">미션 1 · 이것만은 꼭</div></div>'+(allDone('m1')?'<span class="pill done">완료</span>':'<span class="pill">전</span>')+'</div>'+
      '<div class="row" style="cursor:default"><div class="grow"><div class="t">미션 2 · 문장 미션</div></div><span class="pill">'+nAns()+' / '+n+'</span></div></div>';
  }
  h+='<div class="banner"><b>내 해석이 맞았는지 확인해요.</b> 특히 동사 밑줄을 제대로 쳤는지 꼼꼼히 봐요. 조동사까지 한 덩어리인지, 주절(빨강)과 딸린 절(파랑)을 구분했는지, 준동사와 부사는 뺐는지 확인하고, 틀린 곳은 다른 색 펜으로 고쳐요.</div><div class="legend"><span class="vm">빨강 굵은 밑줄</span> 이 문장의 주인공(주절) 동사예요. 조동사까지 한 덩어리예요.<br><span class="vs">파랑 점선 밑줄</span> 뒤에 딸린 절(명사절·부사절·형용사절)의 동사예요.<br><b>that · when</b> 같은 말 부터 절이 시작돼요. 그 절이 문장에서 맡은 자리도 적어 뒀어요.</div><div class="stack">';
  cur().sent.forEach(function(s){
    var tags=[];(s.notes||[]).forEach(function(n){if(tags.indexOf(n[1])<0){tags.push(n[1]);}});
    h+='<div class="sent"><div class="m"><span>'+s.no+'</span>'+tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>';
    s.chunks.forEach(function(c){
      h+='<div class="chunk"><div class="en">';
      c.en.forEach(function(p){h+=(p[1]==='m'?'<span class="vm">':p[1]==='s'?'<span class="vs">':'<span>')+esc(p[0])+'</span>';});
      h+='</div><div class="ko">'+esc(c.ko)+'</div></div>';
    });
    (s.notes||[]).forEach(function(n){h+='<div class="note"><b>'+esc(n[0])+'</b>부터 '+esc(n[1])+' <span>· '+esc(n[2])+'</span></div>';});
    if(s.dn&&s.dn.length){h+='<details class="dn"><summary>동사 표시 기준 보기</summary><ul>';s.dn.forEach(function(d){h+='<li><b>'+esc(d[1])+'</b> <span class="dk">'+esc(d[0])+'</span><br>'+esc(d[2])+'</li>';});h+='</ul></details>';}
    h+='</div>';
  });
  return h+'</div><div class="sub">한 번 열린 번호는 그 뒤로 언제나 열려 있어요.</div>';
}

function wr(){
  var h=topbar('오답노트','day'),w=wrongs();
  if(!w.length){return h+'<div class="banner">틀린 문제가 없어요.</div>';}
  h+='<div class="paperwrap">';
  w.forEach(function(q){h+='<div class="wrongrow"><b>'+q.no+'</b><span><b style="min-width:0">'+esc(q.w)+'</b> '+esc(q.mean)+'</span></div>';});
  return h+'</div><div class="banner"><b>책에 번호 체크 + 단어 뜻만</b><br>번호 옆에 체크하고 뜻만 적어 오면 돼요.</div>';
}

function render(){theme();var f={fin:fin,home:home,day:day,m1:m1,m2:m2,hae:hae,wr:wr}[V.s];$app.innerHTML=f();persist();}

$app.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t){return;}
  if(t.dataset.act){
    var ac=t.dataset.act;
    if(ac==='prev'){R.start=Math.max(1,R.start-R.size);}
    else if(ac==='next'){if(R.start+R.size<=NMAX){R.start+=R.size;}}
    else if(ac==='s10'||ac==='s20'){R.size=ac==='s10'?10:20;R.start=Math.floor((R.start-1)/R.size)*R.size+1;}
    render();return;
  }
  if(t.dataset.go){
    go(t.dataset.go,0);
    if(t.dataset.go==='m2'){var Q=cur().quiz,n=0;while(n<Q.length&&answered(Q[n])){n++;}V.i=n>=Q.length?0:n;render();}
    return;
  }
  var C=cur();
  if(t.id==='prev'){V.i=Math.max(0,V.i-1);render();return;}
  if(t.id==='next'){V.i=Math.min((V.s==='m1'?C.cards.length:C.quiz.length)-1,V.i+1);render();return;}
  if(t.id==='fin1'){blocks().forEach(function(b){S.m1[b]=true;});save();V.banner='<b>미션 1을 마쳤어요.</b> 이제 미션 2로 가요.';go('day');return;}
  if(t.id==='fin2'){blocks().forEach(function(b){S.m2[b]=true;});save();V.banner='<b>해석 코너가 열렸어요.</b> 한 번 열린 번호는 계속 열려 있어요.';go('day');return;}
  var q=C.quiz[V.i];
  if(t.dataset.opt!==undefined){var o=opts(q,V.i)[Number(t.dataset.opt)];S.q[q.no]={pick:o,ok:o===q.a};save();render();return;}
  if(t.dataset.tok!==undefined){
    var k=Number(t.dataset.tok),a=S.q[q.no]||{};
    if(a.m===undefined){a.m=k;a.mok=q.toks[k][1]==='m';if(!q.toks.some(function(x){return x[1]==='s';})){a.ok=a.mok;}}
    else if(a.s===undefined){a.s=k;a.sok=q.toks[k][1]==='s';a.ok=a.mok&&a.sok;}
    S.q[q.no]=a;save();render();
  }
});
$app.addEventListener('change',function(e){if(e.target.id==='rsel'){R.start=Number(e.target.value);render();}});
window.addEventListener('popstate',function(e){var st=e.state;if(st&&st.s){V.s=st.s;V.i=st.i||0;}else{V.s='home';V.i=0;}render();window.scrollTo(0,0);});
(function(){var v=S.v,ok=v&&{day:1,m1:1,m2:1,hae:1,wr:1,fin:1}[v.s]&&(Date.now()-v.t)<1800000&&ready();
  var hs=null;try{hs=history.state;}catch(e){}
  if(hs&&hs.s&&ok){var C0=cur(),m0=hs.s==='m1'?C0.cards.length:hs.s==='m2'?C0.quiz.length:1;V.s=hs.s;V.i=(hs.i<m0)?hs.i:0;}
  else if(ok){try{history.replaceState({s:'home',i:0},'');}catch(e){}var C=cur(),mx=v.s==='m1'?C.cards.length:v.s==='m2'?C.quiz.length:1;V.s=v.s;V.i=(v.i<mx)?v.i:0;try{history.pushState({s:V.s,i:V.i},'');}catch(e){}}
  else{try{history.replaceState({s:'home',i:0},'');}catch(e){}}
  render();})();
})();
</script>
</body>
</html>
