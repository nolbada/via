:"Final","r":"Finally","at":0,"t":"형용사와 부사","m":"문장 전체를 꾸미는 부사 Finally 사용"}]},{"n":5,"en":"The big and friendly giants came closely to ours boat and played for a while.","ko":"그 크고 친근한 거대한 동물들이 우리의 보트에 가까이 왔고 잠시 동안 놀았다.","fx":[{"w":"closely","r":"close","at":6,"t":"형용사와 부사","m":"came close to는 형용사 close 사용"},{"w":"ours","r":"our","at":8,"t":"인칭대명사의 소유격","m":"명사 앞 소유격은 our 사용"}]},{"n":6,"en":"All of a sudden, they jumped up high and made huge splashes. Watching whales never get boring.","ko":"갑자기, 그들이 높이 뛰어올라 거대한 물보라를 만들었다. 고래들을 보는 것은 절대로 지루해지지 않는다.","fx":[{"w":"get","r":"gets","at":15,"t":"3인칭 단수 현재형","m":"동명사 주어에는 단수동사 gets 사용"}]},{"n":7,"en":"Today, I flew a drone to tag humpback whales. I followed them closely and dropped tags careful onto their backs.","ko":"오늘, 나는 혹등고래에 태그를 달기 위해 드론을 날렸다. 나는 그들을 가까이 따라갔고 그들의 등에 태그를 조심스럽게 떨어뜨렸다.","fx":[{"w":"careful","r":"carefully","at":16,"t":"형용사와 부사","m":"동사 dropped를 꾸미는 부사 carefully 사용"}]},{"n":8,"en":"We get a lot of informations about them from the tags.","ko":"우리는 그 태그로부터 그들에 대한 많은 정보를 얻는다.","fx":[{"w":"informations","r":"information","at":5,"t":"셀 수 없는 명사","m":"information은 불가산이라 복수형 없음"}]},{"n":9,"en":"I am particularly interested on their songs, and the tags have recorded them for several year.","ko":"나는 특히 그들의 노래에 관심을 가지고 있고, 그 태그들은 그것들을 몇 년 동안 녹음해 오고 있다.","fx":[{"w":"on","r":"in","at":4,"t":"기본전치사","m":"'~에 관심 있는'은 interested in 사용"},{"w":"year","r":"years","at":15,"t":"명사의 복수형","m":"several 뒤에는 복수명사 years 사용"}]},{"n":10,"en":"Their songs last up to 30 minute and can travels thousands of kilometers underwater!","ko":"그들의 노래는 30분까지 지속되며, 물속에서 수천 킬로미터를 이동할 수 있다!","fx":[{"w":"minute","r":"minutes","at":6,"t":"명사의 복수형","m":"30 뒤에는 복수명사 minutes 사용"},{"w":"travels","r":"travel","at":9,"t":"조동사","m":"조동사 can 뒤에는 동사원형 travel 사용"}]},{"n":12,"en":"I was filming some humpback whales underwater. Suddenly, one whales came close and pushed me hard.","ko":"나는 물속에서 몇몇 혹등고래를 찍고 있었다. 갑자기, 고래 한 마리가 가까이 와서 나를 세게 밀었다.","fx":[{"w":"whales","r":"whale","at":9,"t":"수량 형용사","m":"one 뒤에는 단수명사 whale 사용"}]},{"n":13,"en":"I tried to swim away, but it kept pushing my out of the water. I was so surprised.","ko":"나는 헤엄쳐 가려고 노력했지만, 그것은 계속해서 나를 물 밖으로 밀어냈다. 나는 정말 놀랐다.","fx":[{"w":"my","r":"me","at":9,"t":"인칭대명사의 목적격","m":"동사 pushing의 목적어는 목적격 me 사용"}]},{"n":14,"en":"Then somebody shouted from the boat, \"A tiger shark are coming!\" I safely got on the boat.","ko":"그때 누군가 배에서 소리쳤다. \"뱀상어가 오고 있다!\" 나는 안전하게 배 위에 탔다.","fx":[{"w":"are","r":"is","at":9,"t":"현재진행형","m":"주어 A tiger shark에는 is 사용"}]},{"n":15,"en":"I realized that the whale were trying to save me.","ko":"나는 그 고래가 나를 구하려고 애썼다는 것을 깨달았다.","fx":[{"w":"were","r":"was","at":5,"t":"be동사의 긍정문","m":"주어 the whale에는 was 사용"}]},{"n":16,"en":"Humpback whales sometimes help others sea animals, but I never expected they to save my life.","ko":"혹등고래는 때때로 다른 동물들을 돕지만, 나는 그들이 내 생명을 살리리라고 전혀 예상하지 못했다.","fx":[{"w":"others","r":"other","at":4,"t":"형용사 other/others","m":"명사 앞에는 형용사 other 사용"},{"w":"they","r":"them","at":11,"t":"인칭대명사의 목적격","m":"expect의 목적어는 목적격 them 사용"}]}]},{"no":"41","t":"The Dot","q":[{"n":1,"en":"Art class were over, but Vashti still sat in her chair. Her paper was blankly.","ko":"미술 수업이 끝났지만, Vashti는 여전히 의자에 앉아 있었다. 그녀의 종이는 비어 있었다.","fx":[{"w":"were","r":"was","at":2,"t":"be동사의 과거형","m":"주어 class(단수)에는 was 사용"},{"w":"blankly","r":"blank","at":14,"t":"형용사와 부사","m":"be동사 보어는 형용사 blank 사용"}]},{"n":3,"en":"\"Ah! It is an polar bear in a snowstorm,\" she said.","ko":"\"아! 이건 눈보라 속의 북극곰이구나,\"라고 그녀가 말했다.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"자음 소리 polar 앞에는 a 사용"}]},{"n":5,"en":"Hers teacher smiled. \"Just make a marks.\"","ko":"그녀의 선생님이 미소를 지었다. \"그냥 아무 표시나 해봐.\"","fx":[{"w":"Hers","r":"Her","at":0,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 Her 사용"},{"w":"marks","r":"mark","at":6,"t":"명사의 단수형","m":"a 뒤에는 단수명사 mark 사용"}]},{"n":6,"en":"Vashti picked up a marker and drawed a small dot on the paper.","ko":"Vashti는 마커를 집어 들고 종이에 작은 점을 그렸다.","fx":[{"w":"drawed","r":"drew","at":6,"t":"불규칙 과거형","m":"draw의 과거형은 drew (drawed 아님)"}]},{"n":8,"en":"Her teacher picked up the paper and looked at it careful.","ko":"그녀의 선생님은 종이를 집어 들고 그것을 주의 깊게 바라보았다.","fx":[{"w":"careful","r":"carefully","at":10,"t":"형용사와 부사","m":"동사 looked 수식은 부사 carefully 사용"}]},{"n":10,"en":"She pushed the paper toward Vashti and asked her to signing it.","ko":"그녀는 종이를 Vashti 쪽으로 밀어주며 그것에 서명을 하라고 했다.","fx":[{"w":"signing","r":"sign","at":10,"t":"to부정사","m":"to 뒤에는 동사원형 sign 사용"}]},{"n":12,"en":"\"Well, maybe I can't draw, but I CAN sign me name.\"","ko":"\"음, 내가 그림은 못 그릴지 모르지만, 이름은 쓸 수 있지.\"","fx":[{"w":"me","r":"my","at":9,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"}]},{"n":13,"en":"The next day, Vashti was surprising to see something in a frame on the wall of the art classroom. It were her little dot!","ko":"다음 날, Vashti는 미술실 벽에 걸린 액자 속 무언가를 보고 놀랐다. 그것은 그녀가 그린 작은 점이었다!","fx":[{"w":"surprising","r":"surprised","at":5,"t":"현재분사와 과거분사","m":"사람이 놀란 감정은 surprised 사용"},{"w":"were","r":"was","at":20,"t":"be동사의 과거형","m":"주어 It에는 was 사용"}]},{"n":14,"en":"\"I can make a more better dot than that!\" Vashti said.","ko":"\"나는 저것보다 더 나은 점을 그릴 수 있어!\" 라고 Vashti가 말했다.","fx":[{"w":"more better","r":"better","at":4,"t":"비교급","m":"better 자체가 비교급이라 more 안 씀"}]},{"n":15,"en":"She got a brush and started paint.","ko":"그녀는 붓을 들고 그리기 시작했다.","fx":[{"w":"paint","r":"painting","at":6,"t":"동명사/to부정사","m":"started 뒤에는 painting/to paint (paint 아님)"}]},{"n":16,"en":"An red dot. A purple dot.","ko":"빨간 점. 보라색 점.","fx":[{"w":"An","r":"A","at":0,"t":"관사 a/an","m":"자음 소리 red 앞에는 a 사용"}]},{"n":17,"en":"A yellow dots. A blue dot.","ko":"노란 점. 파란 점.","fx":[{"w":"dots","r":"dot","at":2,"t":"명사의 단수형","m":"a 뒤에는 단수명사 dot 사용"}]},{"n":18,"en":"Then she mixed blue but yellow together. She discovered that she could makes a green dot.","ko":"그러고 나서 그녀는 파란색과 노란색을 함께 섞었다. 그녀는 녹색 점을 만들 수 있다는 것을 발견했다.","fx":[{"w":"but","r":"and","at":4,"t":"접속사","m":"두 색을 잇는 접속사는 and 사용"},{"w":"makes","r":"make","at":12,"t":"조동사 뒤 동사원형","m":"could 뒤에는 동사원형 make (makes 아님)"}]},{"n":19,"en":"Vashti kept experimenting. She painted lots of little dots in much colors.","ko":"Vashti는 계속해서 실험했다. 그녀는 여러 가지 색깔의 작은 점들을 많이 그렸다.","fx":[{"w":"much","r":"many","at":10,"t":"수량 형용사 many/much","m":"셀 수 있는 colors 앞에는 many 사용"}]},{"n":20,"en":"\"If I can makes little dots, I can make big dots, too.\"","ko":"\"내가 작은 점을 그릴 수 있다면, 큰 점도 그릴 수 있겠지.\"","fx":[{"w":"makes","r":"make","at":3,"t":"조동사 뒤 동사원형","m":"can 뒤에는 동사원형 make (makes 아님)"}]},{"n":21,"en":"All of the dot that she painted looked beautiful together on the paper.","ko":"그녀가 그린 모든 점들은 종이 위에서 함께 어우러져 아름답게 보였다.","fx":[{"w":"dot","r":"dots","at":3,"t":"명사의 복수형","m":"All of the 뒤에는 복수명사 dots 사용"}]}]},{"no":"42","t":"The Power of Words","q":[{"n":1,"en":"Words have power. They can makes us feel good or bad.","ko":"말에는 힘이 있습니다. 말은 우리를 기분 좋거나 나쁘게 만들 수 있습니다.","fx":[{"w":"makes","r":"make","at":5,"t":"조동사 뒤 동사원형","m":"조동사 can 뒤에는 동사원형: make (makes 아님)"}]},{"n":3,"en":"Let's explore some common problems that student usually face. You will understands the amazing power of words.","ko":"학생들이 흔히 겪는 일반적인 문제들을 함께 살펴봅시다. 여러분은 말의 놀라운 힘을 이해하게 될 것입니다.","fx":[{"w":"student","r":"students","at":6,"t":"명사의 복수형","m":"주어가 복수(students)인 일반 표현 사용"},{"w":"understands","r":"understand","at":11,"t":"조동사 뒤 동사원형","m":"조동사 will 뒤에는 동사원형: understand"}]},{"n":4,"en":"\"I didn't did well during dance practice. I always mess up.\"","ko":"\"나는 춤 연습을 잘 못했어. 난 항상 망쳐.\"","fx":[{"w":"did","r":"do","at":2,"t":"일반동사의 부정문","m":"didn't 뒤에는 동사원형 do 사용"}]},{"n":5,"en":"Negatively words like \"I always mess up\" can make you feel down and want to stop try.","ko":"\"난 항상 망쳐\"와 같은 부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만들 수 있습니다.","fx":[{"w":"Negatively","r":"Negative","at":0,"t":"형용사와 부사","m":"명사 words를 꾸미는 형용사 Negative 사용"},{"w":"try","r":"trying","at":16,"t":"동명사","m":"stop 뒤에는 동명사 trying 사용"}]},{"n":7,"en":"When you think positively, you can learn from you mistakes and improve your skills.","ko":"긍정적인 사고를 할 때, 실수에서 배우고 실력을 향상할 수 있습니다.","fx":[{"w":"you","r":"your","at":8,"t":"인칭대명사의 소유격","m":"명사 mistakes 앞에는 소유격 your 사용"}]},{"n":8,"en":"Say It! \"I didn't dance well this time, but I'll keep practicing and get more better.\"","ko":"말해 보세요! \"이번에는 춤을 잘 못 췄지만, 계속 연습해서 더 잘할 거야.\"","fx":[{"w":"more better","r":"better","at":14,"t":"비교급","m":"better 자체가 비교급이라 more 불필요"}]},{"n":9,"en":"\"Seongjun winned first place in the contest? He's just too lucky.\"","ko":"\"성준이가 대회에서 1등을 했다고? 그냥 운이 너무 좋네.\"","fx":[{"w":"winned","r":"won","at":1,"t":"불규칙 과거형","m":"win의 과거형은 won (winned 아님)"}]},{"n":10,"en":"We easily says negative things about others when we feel jealous.","ko":"우리는 질투를 느낄 때 다른 사람에 대해 부정적인 말을 쉽게 합니다.","fx":[{"w":"says","r":"say","at":2,"t":"일반동사의 현재형","m":"주어 We는 복수: say (says 아님)"}]},{"n":12,"en":"Instead, try to be happy of others and respect their efforts.","ko":"대신 다른 사람을 위해 기뻐하고 그들의 노력을 존중해 보세요.","fx":[{"w":"of","r":"for","at":5,"t":"기본전치사","m":"'~를 기뻐하는'은 happy for 사용"}]},{"n":13,"en":"With positive word, you can learn from your friends, get along better, and focus in your own growth.","ko":"긍정적인 말을 통해 여러분은 친구에게서 배우고, 더 잘 지내며, 자신의 성장에 집중할 수 있습니다.","fx":[{"w":"word","r":"words","at":2,"t":"명사의 복수형","m":"일반적인 '말'은 복수 words 사용"},{"w":"in","r":"on","at":14,"t":"기본전치사","m":"'~에 집중하다'는 focus on 사용"}]},{"n":14,"en":"Say It! \"He did an great job.","ko":"말해 보세요! \"그가 정말 잘했어.","fx":[{"w":"an","r":"a","at":4,"t":"관사 a/an","m":"자음 소리 great 앞에는 a 사용"}]},{"n":16,"en":"\"We lost the game because your mistake. It's your fault.\"","ko":"\"우리는 네 실수 때문에 게임에서 졌어. 네 잘못이야.\"","fx":[{"w":"your","r":"of your","at":5,"t":"전치사와 접속사","m":"명사구 앞에는 because of 사용"}]},{"n":17,"en":"When things goes wrong, we sometimes blame others.","ko":"일이 잘못되었을 때 우리는 가끔 다른 사람을 비난하기도 합니다.","fx":[{"w":"goes","r":"go","at":2,"t":"주어와 동사의 수일치","m":"주어 things는 복수: go (goes 아님)"}]},{"n":18,"en":"However, negative words like \"It's your fault\" can hurt they feelings and damage your friendship.","ko":"하지만 \"네 잘못이야\"와 같은 부정적인 말은 상대방의 감정을 상하게 하고 우정을 해칠 수 있습니다.","fx":[{"w":"they","r":"their","at":9,"t":"인칭대명사의 소유격","m":"명사 feelings 앞에는 소유격 their 사용"}]},{"n":20,"en":"Positive words will make your team develop a strong teamwork and perform better next time.","ko":"긍정적인 말은 여러분의 팀이 강한 팀워크를 키우고 다음에는 더 잘할 수 있게 할 것입니다.","fx":[{"w":"a strong","r":"strong","at":7,"t":"셀 수 없는 명사","m":"teamwork는 셀 수 없어 a 불가"}]},{"n":21,"en":"Say It! \"You're an team member whom I trust.","ko":"말해 보세요! \"너는 내가 믿는 팀원이야.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"자음 소리 team 앞에는 a 사용"}]},{"n":22,"en":"Let's keep doing our better together, and we'll win the next game.\"","ko":"함께 계속 최선을 다하면 다음 게임에서 이길 수 있을 거야.\"","fx":[{"w":"better","r":"best","at":4,"t":"최상급","m":"do our best: 최상급 best 사용"}]}]},{"no":"43","t":"A Journey to Find My Dream","q":[{"n":1,"en":"Some of you have a dream job in mind, but others does not. It is not easy for you to find a future job.","ko":"여러분 중의 일부는 꿈의 직업을 염두에 두고 있지만 다른 사람들은 그렇지 않다. 여러분이 미래 직업을 찾는 것은 쉽지 않다.","fx":[{"w":"does","r":"do","at":11,"t":"do동사의 수일치","m":"others는 복수: do not (does 아님)"}]},{"n":2,"en":"But us all need to answer the question, \"What do you want to be in the future?\"","ko":"그러나 우리는 모두 \"당신은 미래에 무엇이 되고 싶은가?\"라는 질문에 답해야 한다.","fx":[{"w":"us","r":"we","at":1,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 we 사용"}]},{"n":3,"en":"Think about the following questions, and you will find a path to you future job.","ko":"다음의 질문들을 생각해 보면 여러분의 미래 직업으로 가는 길을 찾게 될 것이다.","fx":[{"w":"you","r":"your","at":12,"t":"인칭대명사의 소유격","m":"명사 future job 앞에는 소유격 your 사용"}]},{"n":5,"en":"First, we work to making money. Our jobs help us get paid so we can make an living.","ko":"첫째, 우리는 돈을 벌기 위해 일한다. 우리의 직업은 우리가 돈을 벌 수 있게 돕고 그래서 우리는 생계를 꾸릴 수 있다.","fx":[{"w":"making","r":"make","at":4,"t":"to부정사","m":"목적 to 뒤는 동사원형: to make"},{"w":"an","r":"a","at":16,"t":"관사 a/an","m":"자음 소리 living 앞에는 a 사용"}]},{"n":7,"en":"For example, street cleaners keep us towns and cities clean, and police officers make our society safely.","ko":"예를 들어, 환경미화원은 우리 마을과 도시를 깨끗하게 유지하고, 경찰관은 우리 사회를 안전하게 만든다.","fx":[{"w":"us","r":"our","at":5,"t":"인칭대명사의 소유격","m":"명사 towns 앞에는 소유격 our 사용"},{"w":"safely","r":"safe","at":16,"t":"형용사와 부사","m":"make + 목적어 + 형용사 safe 사용"}]},{"n":8,"en":"We rely in others to do these important job, and everyone has a special role to play. Third, we work to feel proud of our work.","ko":"우리는 이런 중요한 일을 하는 사람들에게 의존하며 모두가 맡은 특별한 역할이 있다. 셋째, 우리는 우리의 일에 대해 자부심을 느끼기 위해 일한다.","fx":[{"w":"in","r":"on","at":2,"t":"기본전치사","m":"'~에 의존하다'는 rely on 사용"},{"w":"job","r":"jobs","at":8,"t":"명사의 복수형","m":"these 뒤에는 복수명사 jobs 사용"}]},{"n":9,"en":"By working, we can helps others and show our abilities. In the end, we work to find meaning in life.","ko":"일을 함으로써 우리는 다른 사람을 돕고 우리의 능력을 보여 줄 수 있다. 결국, 우리는 삶의 의미를 찾기 위해 일한다.","fx":[{"w":"helps","r":"help","at":4,"t":"조동사 can","m":"can 뒤는 동사원형: help"}]},{"n":11,"en":"Everyone have their own favorite activities. Try to connect them to a real job, and you will find your path.","ko":"모두가 자신만의 가장 좋아하는 활동이 있다. 그것을 실제 직업과 연결해 보라, 그러면 여러분의 길을 찾을 것이다.","fx":[{"w":"have","r":"has","at":1,"t":"3인칭 단수 현재형","m":"Everyone은 단수 취급하여 has 사용"}]},{"n":12,"en":"If you like watching TV shows, you can be a producer or an writer for those shows.","ko":"여러분이 TV 프로그램 보는 것을 좋아한다면, 그 프로그램들의 프로듀서나 작가가 될 수 있다.","fx":[{"w":"an","r":"a","at":12,"t":"관사 a/an","m":"자음 소리 writer 앞에는 a 사용"}]},{"n":13,"en":"However, liking something and being well at it are not the same. Playing soccer as a job is different from playing it as a hobby.","ko":"하지만 무언가를 좋아하는 것과 그것을 잘하는 것은 같지 않다. 축구를 직업으로 하는 것은 취미로 하는 것과는 다르다.","fx":[{"w":"well","r":"good","at":5,"t":"형용사와 부사","m":"be good at에서는 형용사 good 사용"}]},{"n":14,"en":"You love soccer but isn't good at it. Then you can look for other job in soccer.","ko":"축구를 정말 좋아하지만 잘하지 못한다. 그러면 축구에서 다른 직업들을 찾을 수 있다.","fx":[{"w":"isn't","r":"aren't","at":4,"t":"be동사의 부정문","m":"주어 You에는 aren't 사용"},{"w":"job","r":"jobs","at":14,"t":"명사의 복수형","m":"other 뒤에는 복수명사 jobs 사용"}]},{"n":15,"en":"If you are good at take care of people, you can become a soccer player's manager.","ko":"사람을 돌보는 것을 잘한다면, 축구선수의 매니저가 될 수 있다.","fx":[{"w":"take","r":"taking","at":5,"t":"동명사","m":"전치사 at 뒤에는 동명사 taking 사용"}]},{"n":16,"en":"Or you can work as a marketers for a soccer team if you are good at thinking creatively.","ko":"또는 창의적으로 생각하는 것을 잘한다면, 축구팀의 마케터로 일할 수 있다.","fx":[{"w":"marketers","r":"marketer","at":6,"t":"명사의 단수형","m":"a 뒤에는 단수명사 marketer 사용"}]}]},{"no":"44","t":"Street Art in London","q":[{"n":1,"en":"Modern street art comes in many different form, and it makes cities colorfully and lively.","ko":"현대 거리 예술은 여러 다양한 형태로 존재하며, 도시를 다채롭고 활기차게 만듭니다.","fx":[{"w":"form","r":"forms","at":7,"t":"명사의 복수형","m":"many 뒤에는 복수명사 forms 사용"},{"w":"colorfully","r":"colorful","at":12,"t":"형용사와 부사","m":"makes cities의 보어 자리에는 형용사 colorful 사용"}]},{"n":4,"en":"Poorly workers used to live in this area, but now it is one of the hippest area in London.","ko":"가난한 노동자들이 이 지역에 살았었지만, 지금 이곳은 런던에서 가장 힙한 지역 중 한 곳입니다.","fx":[{"w":"Poorly","r":"Poor","at":0,"t":"형용사와 부사","m":"명사 workers를 꾸미는 말은 형용사 Poor 사용"},{"w":"area","r":"areas","at":16,"t":"명사의 복수형","m":"one of the 뒤에는 복수명사 areas 사용"}]},{"n":5,"en":"We can find so much great pieces of street art here. Do you see the painting over there?","ko":"우리는 이곳에서 정말 많은 멋진 거리 예술 작품들을 볼 수 있습니다. 저쪽에 있는 그림이 보이시나요?","fx":[{"w":"much","r":"many","at":4,"t":"수량 형용사 many/much","m":"셀 수 있는 pieces에는 many 사용"}]},{"n":6,"en":"It is by the artist STIK. He is famous at using only lines and dots in him paintings of human bodies.","ko":"그것은 예술가 STIK의 작품입니다. 그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다.","fx":[{"w":"at","r":"for","at":9,"t":"형용사+전치사","m":"'~로 유명한'은 famous for 사용"},{"w":"him","r":"his","at":16,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 his 사용"}]},{"n":7,"en":"According to STIK, the three figures represents the past, present, and future of Shoreditch. Which figure represents which?","ko":"STIK에 따르면 저 세 인물은 쇼어디치의 과거, 현재, 그리고 미래를 나타냅니다. 어떤 인물이 어떤 것을 나타낼까요?","fx":[{"w":"represents","r":"represent","at":6,"t":"수일치","m":"주어 figures(복수)에는 represent 사용"}]},{"n":8,"en":"Well, look closely at the eyes of the three figure. They are just dots, but they will gives you a clue.","ko":"자, 세 인물의 눈을 자세히 보세요. 그것들은 그저 점이지만, 그 점들이 여러분에게 단서를 줄 겁니다.","fx":[{"w":"figure","r":"figures","at":9,"t":"수 표현과 명사","m":"three 뒤에는 복수명사 figures 사용"},{"w":"gives","r":"give","at":17,"t":"조동사 뒤 동사원형","m":"조동사 will 뒤에는 동사원형: give (gives 아님)"}]},{"n":9,"en":"We is now in Finsbury Park to see a painting by Banksy, a internationally famous street artist.","ko":"우리는 이제 국제적으로 유명한 거리 예술가 Banksy의 그림을 보기 위해 핀즈베리 공원에 있습니다.","fx":[{"w":"is","r":"are","at":1,"t":"be동사의 현재형","m":"주어 We에는 are 사용"},{"w":"a","r":"an","at":12,"t":"관사 a/an","m":"모음 소리 internationally 앞에는 an 사용"}]},{"n":10,"en":"Banksy's artworks often carry social message, and the green tree me see over there is a good example.","ko":"Banksy의 예술 작품들은 종종 사회적 메시지를 담고 있는데, 저쪽에 보이는 초록색 나무가 좋은 예입니다.","fx":[{"w":"message","r":"messages","at":5,"t":"명사의 복수형","m":"형용사 social 뒤 복수명사 messages 사용"},{"w":"me","r":"you","at":10,"t":"인칭대명사의 주격","m":"관계절 주어 자리에는 주격 you 사용"}]},{"n":11,"en":"As you can see, he created a green tree by spray green paint on a wall behind a leafless trees.","ko":"보시다시피 그는 잎이 없는 나무 뒤쪽 벽에 초록색 페인트를 뿌려서 초록색 나무를 만들었습니다.","fx":[{"w":"spray","r":"spraying","at":10,"t":"전치사 뒤 동명사","m":"전치사 by 뒤에는 동명사 spraying 사용"},{"w":"trees","r":"tree","at":19,"t":"명사의 단수·복수","m":"a 뒤에는 단수명사 tree 사용"}]},{"n":13,"en":"In many people's opinion, he is telling we that nature is having a hard time. They think he wants us to take better care of it.","ko":"많은 사람들의 의견에 따르면, 그는 자연이 힘든 시간을 보내고 있다는 것을 우리에게 말하려는 것 같습니다. 그들은 우리가 자연을 더 잘 보살피기를 Banksy가 원한다고 생각합니다.","fx":[{"w":"we","r":"us","at":7,"t":"인칭대명사의 목적격","m":"동사 telling의 목적어는 목적격 us 사용"}]},{"n":14,"en":"The finally stop of our tour today is Muswell Hill. Can't see any street artworks?","ko":"오늘 우리 투어의 마지막 장소는 머스웰 힐입니다. 어떤 거리 예술 작품도 보이지 않나요?","fx":[{"w":"finally","r":"final","at":1,"t":"형용사와 부사","m":"명사 stop을 꾸미는 말은 형용사 final 사용"}]},{"n":15,"en":"Well, look down and look closely. Does you see the little chewing gum paintings?","ko":"그렇다면, 아래를 내려다보고 자세히 살펴보세요. 작은 껌 그림들이 보이나요?","fx":[{"w":"Does","r":"Do","at":6,"t":"의문문의 조동사 do/does","m":"주어 you에는 Do 사용"}]},{"n":16,"en":"They are by the artist Ben Wilson. Wilson is well known for painting pictures on gum that people drops on the street.","ko":"이것들은 예술가 Ben Wilson의 작품입니다. Wilson은 사람들이 길에 버리는 껌에 그림을 그리는 것으로 잘 알려져 있습니다.","fx":[{"w":"drops","r":"drop","at":18,"t":"수일치","m":"주어 people(복수)에는 drop 사용"}]},{"n":17,"en":"His gum paintings often carries personal messages from people he meets on the street.","ko":"그의 껌 그림들은 그가 길에서 만나는 사람들의 개인적인 메시지를 종종 담고 있습니다.","fx":[{"w":"carries","r":"carry","at":4,"t":"수일치","m":"주어 paintings(복수)에는 carry 사용"}]},{"n":18,"en":"For example, the one over here is an happy birthday wish for a loved one.","ko":"예를 들어, 여기 있는 그림은 사랑하는 사람을 위한 생일 축하 메시지입니다.","fx":[{"w":"an","r":"a","at":7,"t":"관사 a/an","m":"자음 소리 happy 앞에는 a 사용"}]}]},{"no":"45","t":"Save the City on the Water","q":[{"n":1,"en":"Hello, friends! Me name is Monica, and I live in Venice.","ko":"안녕, 친구들! 내 이름은 Monica이고, 나는 베네치아에서 살고 있어.","fx":[{"w":"Me","r":"My","at":2,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 My 사용"}]},{"n":2,"en":"Have you heard of Venice? It is a beautifully city on the water in Italy.","ko":"베네치아에 대해 들어 본 적 있니? 그것은 이탈리아의 물 위에 있는 아름다운 도시야.","fx":[{"w":"beautifully","r":"beautiful","at":8,"t":"형용사와 부사","m":"명사 city를 꾸미는 형용사 beautiful 사용"}]},{"n":3,"en":"Venice is famous of its canals and historic buildings. Many tourists comes to see them every year.","ko":"베네치아는 운하와 역사적인 건물들로 유명해. 많은 여행객들이 매년 그것들을 보러 와.","fx":[{"w":"of","r":"for","at":3,"t":"기본전치사","m":"be famous for: ~로 유명하다"},{"w":"comes","r":"come","at":11,"t":"주어와 동사의 수일치","m":"주어 tourists는 복수: comes가 아니라 come"}]},{"n":4,"en":"But now, we has a big problem. Last week, the streets were flooded.","ko":"그런데 지금, 우리는 큰 문제를 겪고 있어. 지난주에, 거리가 침수됐어.","fx":[{"w":"has","r":"have","at":3,"t":"일반동사의 현재형","m":"주어 we에는 has가 아니라 have"}]},{"n":5,"en":"I couldn't went to school, and my parents' bakery had to close. I had to wear tall rain boots all the time.","ko":"나는 학교에 갈 수 없었고, 우리 부모님의 빵집은 문을 닫아야 했어. 나는 줄곧 긴 장화를 신어야 했어.","fx":[{"w":"went","r":"go","at":2,"t":"조동사 can의 과거형","m":"조동사 부정형 뒤에는 동사원형 go 사용"}]},{"n":6,"en":"I'm real worried. The warmer the Earth get, the high the water in Venice rises.","ko":"나는 정말 걱정이야. 지구가 더 더워질수록 베네치아의 수위는 더 상승해.","fx":[{"w":"real","r":"really","at":1,"t":"형용사와 부사","m":"형용사 worried를 꾸미는 부사 really 사용"},{"w":"get","r":"gets","at":7,"t":"3인칭 단수 현재형","m":"단수 주어 the Earth에는 gets 사용"},{"w":"high","r":"higher","at":9,"t":"비교급","m":"the+비교급 ~, the+비교급 구문: the higher"}]},{"n":9,"en":"My family visit Venice three years ago and we loved it! I am surprised and sad to hear your news.","ko":"우리 가족은 3년 전에 베네치아를 방문했고 우리는 그곳을 아주 좋아했어! 나는 네 소식을 듣고 놀랐고 슬퍼.","fx":[{"w":"visit","r":"visited","at":2,"t":"과거시제","m":"three years ago는 과거: visit가 아니라 visited"}]},{"n":10,"en":"I want do my part to help your city and the Earth. I recently found out interesting something.","ko":"나는 너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어. 나는 최근에 재미있는 것을 알게 됐어.","fx":[{"w":"do","r":"to do","at":2,"t":"to부정사","m":"want 뒤에는 to부정사 to do 사용"},{"w":"interesting something","r":"something interesting","at":16,"t":"형용사의 위치","m":"-thing 뒤에서 수식: something interesting"}]},{"n":11,"en":"The more meat we eat, the hot our planet gets. This is because lots of trees is cut down to make animal farms.","ko":"우리가 더 많은 고기를 먹을수록 우리의 행성은 더 뜨거워져. 이것은 동물 농장을 만들기 위해 많은 나무가 베어지기 때문이야.","fx":[{"w":"hot","r":"hotter","at":6,"t":"비교급","m":"the+비교급 구문: the hotter"},{"w":"is","r":"are","at":16,"t":"be동사의 수일치","m":"lots of trees는 복수: is가 아니라 are"}]},{"n":12,"en":"This increases greenhouse gases. Also, cows pass a lots of gas.","ko":"이것은 온실가스를 증가시켜. 또한, 소는 많은 가스를 배출해.","fx":[{"w":"lots","r":"lot","at":8,"t":"수량 형용사","m":"a lot of는 lot이 단수: a lots of는 틀림"}]},{"n":13,"en":"Smelly! But this is not the worse part.","ko":"고약한 냄새가 나! 그런데 이것이 최악인 부분은 아니야.","fx":[{"w":"worse","r":"worst","at":6,"t":"최상급","m":"the 뒤 최상급 the worst 사용"}]},{"n":14,"en":"The gas from cow also adds to greenhouse gases. Greenhouse gases make the Earth hotter.","ko":"소에게서 나온 가스는 또한 온실가스에 추가돼. 온실가스는 지구를 더 뜨겁게 만들어.","fx":[{"w":"cow","r":"cows","at":3,"t":"명사의 복수형","m":"일반적인 소들을 말하므로 복수형 cows 사용"}]},{"n":15,"en":"So, I'm trying to eat fewer meat to slow down global warming. It isn't easy to change my eating habits, but I'm doing my best.","ko":"그래서, 나는 지구 온난화를 늦추기 위해서 고기를 덜 먹으려고 노력하고 있어. 나의 식습관을 바꾸는 것은 쉽지 않지만, 나는 최선을 다하고 있어.","fx":[{"w":"fewer","r":"less","at":5,"t":"수량 형용사 few/less","m":"meat는 셀 수 없으므로 less 사용"}]},{"n":16,"en":"Hello, I'm Suin from Korea. Every summers, it rains a lot here.","ko":"안녕, 나는 한국의 수인이야. 매년 여름에 여기는 비가 많이 와.","fx":[{"w":"summers","r":"summer","at":6,"t":"수량 형용사 every","m":"Every 뒤에는 단수명사 summer 사용"}]},{"n":17,"en":"Sometimes, we have floods and they are really scary. The situation on Venice must be scary, too.","ko":"때때로, 우리는 홍수를 겪고 그것들은 정말 무서워. 베네치아의 상황도 무서울 게 틀림없어.","fx":[{"w":"on","r":"in","at":11,"t":"기본전치사","m":"도시 안에서는 전치사 in 사용"}]},{"n":18,"en":"I've never been to Venice, but I have saw much beautiful pictures of it. I talked my friends about the floods in your city.","ko":"나는 베네치아에 가 본 적이 없지만, 그곳의 많은 아름다운 사진들을 본 적이 있어. 나는 너희 도시의 홍수에 관해 친구들과 이야기했어.","fx":[{"w":"saw","r":"seen","at":8,"t":"현재완료","m":"현재완료는 have+과거분사 seen"},{"w":"much","r":"many","at":9,"t":"수량 형용사 many/much","m":"pictures는 셀 수 있으므로 many 사용"},{"w":"my","r":"to my","at":16,"t":"기본전치사","m":"talk to ~: ~에게 말하다 (to 필요)"}]},{"n":20,"en":"Now, many student at my school are doing this three things every day. It is important to do our part for Venice.","ko":"지금, 우리 학교에서 많은 학생들이 이 세 가지를 매일 하고 있어. 베네치아를 위해 우리의 역할을 하는 것이 중요해.","fx":[{"w":"student","r":"students","at":2,"t":"명사의 복수형","m":"many 뒤에는 복수명사 students 사용"},{"w":"this","r":"these","at":8,"t":"지시형용사","m":"복수명사 things 앞에는 these 사용"}]},{"n":21,"en":"Together, we can makes a difference!","ko":"함께, 우리는 변화를 만들 수 있어!","fx":[{"w":"makes","r":"make","at":3,"t":"조동사 뒤 동사원형","m":"조동사 can 뒤에는 동사원형: makes가 아니라 make"}]}]},{"no":"46","t":"My Hometown, Chuncheon","q":[{"n":1,"en":"Welcome to me blog, \"Happy Yujin!\"","ko":"제 블로그인 '행복한 유진!'에 오신 것을 환영합니다.","fx":[{"w":"me","r":"my","at":2,"t":"인칭대명사의 소유격","m":"명사 blog 앞에는 소유격 my 사용"}]},{"n":2,"en":"Hi, my name is Yujin, and I'm writing an blog to introduce me hometown, Chuncheon. Have you ever visited Chuncheon?","ko":"안녕하세요, 제 이름은 유진이고, 저는 제 고향인 춘천을 소개하기 위해서 블로그를 쓰고 있어요. 당신은 춘천을 방문해 본 적이 있나요?","fx":[{"w":"an","r":"a","at":8,"t":"관사 a/an","m":"blog는 자음 소리로 시작하므로 a 사용"},{"w":"me","r":"my","at":12,"t":"인칭대명사의 소유격","m":"명사 hometown 앞에는 소유격 my 사용"}]},{"n":3,"en":"It's famous for its beautifully mountains and lakes. There is so many things to do and so many things to see.","ko":"춘천은 아름다운 산과 호수로 유명해요. 할 것이 정말 많고, 볼 것도 정말 많답니다.","fx":[{"w":"beautifully","r":"beautiful","at":4,"t":"형용사와 부사","m":"명사 mountains 앞에는 형용사 beautiful 사용"},{"w":"is","r":"are","at":9,"t":"There is/are","m":"복수명사 things 앞에는 There are 사용"}]},{"n":5,"en":"I want share the history of Chuncheon and tips for visitors from around the world. So, I started these blog.","ko":"저는 춘천의 역사와 전 세계 방문객들을 위한 조언을 공유하고 싶어요. 그래서 저는 이 블로그를 시작했답니다.","fx":[{"w":"share","r":"to share","at":2,"t":"to부정사","m":"want 뒤에는 to share (to부정사) 사용"},{"w":"these","r":"this","at":18,"t":"지시형용사","m":"단수명사 blog 앞에는 this 사용"}]},{"n":8,"en":"Today focus is the Memorial Hall for Ethiopian Soldiers in the Korean War.","ko":"오늘 중점적으로 소개할 곳은 에티오피아군의 한국전 참전 기념관이에요.","fx":[{"w":"Today","r":"Today's","at":0,"t":"명사의 소유격","m":"'오늘의 초점'은 Today's focus 사용"}]},{"n":9,"en":"On the first floor of the hall, visitors can sees the names and pictures of the bravely soldiers.","ko":"기념관 1층에서 방문객들은 용감한 군인들의 이름과 사진을 볼 수 있어요.","fx":[{"w":"sees","r":"see","at":9,"t":"조동사 뒤 동사원형","m":"can 뒤에는 see (sees 아님)"},{"w":"bravely","r":"brave","at":16,"t":"형용사와 부사","m":"명사 soldiers 수식은 brave (bravely 아님)"}]},{"n":10,"en":"On the second floor, Ethiopian cultural items is displayed.","ko":"2층에는 에티오피아의 문화 유물들이 전시되어 있어요.","fx":[{"w":"is","r":"are","at":7,"t":"be동사의 수일치","m":"주어 items(복수)는 are (is 아님)"}]},{"n":11,"en":"If you wants to know about the special history between Korea or Ethiopia, please click on the link below.","ko":"한국과 에티오피아 사이의 특별한 역사에 대해 알고 싶으면, 아래 링크를 클릭해 주세요.","fx":[{"w":"wants","r":"want","at":2,"t":"3인칭 단수 현재형","m":"주어 you에는 동사원형 want 사용"},{"w":"or","r":"and","at":11,"t":"접속사","m":"between A and B 구문은 and 사용"}]}]},{"no":"47","t":"The Pea Blossom","q":[{"n":1,"en":"Five little pea lived together in a pod. The most big pea said, \"What is the world like?","ko":"다섯 개의 작은 완두콩이 꼬투리 속에서 함께 살았다. 가장 큰 완두콩이 말했다. \"세상은 어떤 것 같아?","fx":[{"w":"pea","r":"peas","at":2,"t":"명사의 복수형","m":"Five 뒤에는 복수명사 peas 사용"},{"w":"most big","r":"biggest","at":9,"t":"최상급","m":"big의 최상급은 biggest 사용"}]},{"n":2,"en":"I want to do great work for the world. I can't waiting to get out of here.\"","ko":"난 세상을 위해 훌륭한 일을 하고 싶어. 나는 빨리 여기서 나가고 싶어.\"","fx":[{"w":"waiting","r":"wait","at":11,"t":"조동사 뒤 동사원형","m":"can't 뒤에는 동사원형 wait 사용"}]},{"n":3,"en":"The smallest pea said, \"Good for your. I'm too small.","ko":"가장 작은 완두콩이 말했다. \"좋겠다. 난 너무 작아.","fx":[{"w":"your","r":"you","at":6,"t":"인칭대명사의 목적격","m":"전치사 for 뒤에는 목적격 you 사용"}]},{"n":4,"en":"What can I does?\" The others cheered, \"There will be something that you can do!","ko":"내가 무엇을 할 수 있겠어?\" 다른 콩들이 응원했다. \"네가 할 수 있는 일이 있을 거야!","fx":[{"w":"does","r":"do","at":3,"t":"조동사 뒤 동사원형","m":"조동사 can 뒤에는 동사원형: do (does 아님)"}]},{"n":6,"en":"One day, the pod breaked open. The wind blowed the smallest pea up into the air.","ko":"어느 날, 그 꼬투리가 터져 열렸다. 바람이 가장 작은 완두콩을 공중으로 날려 보냈다.","fx":[{"w":"breaked","r":"broke","at":4,"t":"불규칙 과거형","m":"break의 과거형은 broke (breaked 아님)"},{"w":"blowed","r":"blew","at":8,"t":"불규칙 과거형","m":"blow의 과거형은 blew (blowed 아님)"}]},{"n":7,"en":"It flied and landed on a tiny space by the window of a house. Soil built up, and the tiny pea sank into it.","ko":"그것은 날아서 어느 집 창문 옆의 작은 공간에 내려앉았다. 흙이 쌓이자 그 작은 완두콩은 그 속으로 가라앉았다.","fx":[{"w":"flied","r":"flew","at":1,"t":"불규칙 과거형","m":"fly의 과거형은 flew (flied 아님)"}]},{"n":8,"en":"A young girl lived with she mom in the house. Her mom had to work from early morning to late evening.","ko":"그 집에는 한 어린 소녀가 어머니와 함께 살고 있었다. 그녀의 어머니는 이른 아침부터 늦은 저녁까지 일해야 했다.","fx":[{"w":"she","r":"her","at":5,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 her 사용"}]},{"n":9,"en":"The girl was very sick and stayed in bed all day. One day, the girl asked, \"Mom, what are the green thing by the window?\"","ko":"소녀는 매우 아파서 하루 종일 침대에 누워 있었다. 어느 날, 소녀가 \"엄마, 창문 옆에 있는 저 초록색 물건이 뭐예요?\"라고 물었다.","fx":[{"w":"are","r":"is","at":18,"t":"be동사의 현재형","m":"단수 the green thing에는 is 사용"}]},{"n":10,"en":"\"Oh, it's an pea plant! It is as little than a baby's finger.","ko":"\"오, 이건 완두콩 식물이네! 그건 아기의 손가락만큼이나 작구나.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"자음 소리 pea 앞에는 a 사용"},{"w":"than","r":"as","at":9,"t":"원급 비교 as ~ as","m":"원급 비교는 as ~ as 사용"}]},{"n":12,"en":"Every day, the girl went to the window to seeing the plant. It grew taller and taller.","ko":"매일 소녀는 그 식물을 보기 위해 창문으로 갔다. 그것은 점점 더 키가 자랐다.","fx":[{"w":"seeing","r":"see","at":9,"t":"to부정사","m":"목적을 나타내는 to 뒤에는 동사원형: to see"}]},{"n":13,"en":"It became as taller as a small tree after a little weeks. \"How pretty and healthy you is!","ko":"몇 주가 지나자 그것은 작은 나무만큼 키가 커졌다. \"너는 정말 예쁘고 건강하구나!","fx":[{"w":"taller","r":"tall","at":3,"t":"원급 비교 as ~ as","m":"as ~ as 사이에는 원급 tall 사용"},{"w":"little","r":"few","at":10,"t":"수량 형용사 a few/a little","m":"셀 수 있는 weeks 앞에는 a few 사용"},{"w":"is","r":"are","at":17,"t":"be동사의 현재형","m":"주어 you에는 are: you are (is 아님)"}]},{"n":14,"en":"When I sit in the sun to see you, I feel healthily, too!\" The girl became more stronger and happier day by day.","ko":"너를 보기 위해 햇볕에 앉아 있을 때, 나도 더 건강해지는 것 같아!\" 소녀는 날이 갈수록 더 강해지고 행복해졌다.","fx":[{"w":"healthily","r":"healthier","at":11,"t":"형용사와 부사","m":"feel 뒤 보어 자리에는 형용사 healthier 사용"},{"w":"more stronger","r":"stronger","at":16,"t":"비교급","m":"stronger는 이미 비교급이므로 more 없이 사용"}]},{"n":15,"en":"One evening, the girl shouted, \"You must see this, Mom! It's the more wonderful thing!\"","ko":"어느 날 저녁, 소녀가 외쳤다. \"엄마, 이거를 꼭 봐야 해요! 그것은 가장 멋진 거예요!\"","fx":[{"w":"more","r":"most","at":12,"t":"최상급","m":"'가장 멋진'은 the most wonderful 사용"}]},{"n":16,"en":"A little flower blossomed on the pea plant. It was an beautiful pink flower.","ko":"작은 꽃이 완두콩 식물에 피어 있었다. 그것은 아름다운 분홍색 꽃이었다.","fx":[{"w":"an","r":"a","at":10,"t":"관사 a/an","m":"자음 소리 beautiful 앞에는 a 사용"}]},{"n":17,"en":"\"Thank you, little plant. You are the friend I has waited for!\"","ko":"\"고마워, 꼬마 식물아. 네가 바로 내가 기다려 왔던 친구야!\"","fx":[{"w":"has","r":"have","at":9,"t":"현재완료","m":"주어 I에는 have: have waited (has 아님)"}]},{"n":18,"en":"The little pea was as happy than the girl. It finally found the thing who it could do.","ko":"작은 완두콩은 소녀만큼 행복했다. 그것은 마침내 자신이 할 수 있는 일을 찾았다.","fx":[{"w":"than","r":"as","at":6,"t":"원급 비교 as ~ as","m":"원급 비교는 as happy as 사용"},{"w":"who","r":"which","at":14,"t":"관계대명사","m":"사물 thing 뒤에는 which 사용"}]}]},{"no":"48","t":"Living for a Month in New York City","q":[{"n":1,"en":"Last summer, I spended a month at my cousin's place in New York City.","ko":"지난여름 나는 뉴욕시의 사촌 집에서 한 달을 보냈다.","fx":[{"w":"spended","r":"spent","at":3,"t":"불규칙 과거형","m":"spend의 과거형은 spent (spended 아님)"}]},{"n":2,"en":"Each days I enjoyed the city, and it was a unforgettable experience.","ko":"매일 나는 그 도시를 즐겼고 그것은 잊지 못할 경험이었다.","fx":[{"w":"days","r":"day","at":1,"t":"수량 형용사 each","m":"each 뒤에는 단수명사 day 사용"},{"w":"a","r":"an","at":9,"t":"관사 a/an","m":"unforgettable은 모음 소리로 시작하므로 an"}]},{"n":3,"en":"New York City is famous for it high-rise buildings, but it also has beautifully parks.","ko":"뉴욕시는 고층 건물로 유명하지만, 아름다운 공원들도 있다.","fx":[{"w":"it","r":"its","at":6,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 its 사용"},{"w":"beautifully","r":"beautiful","at":13,"t":"형용사와 부사","m":"명사 parks를 꾸미는 형용사 beautiful 사용"}]},{"n":4,"en":"As my cousin's apartment was near Central Park, I often went there. I attended an free yoga class and rowed a boat on the lake.","ko":"내 사촌의 아파트가 센트럴 파크 근처에 있었기 때문에 나는 자주 거기에 갔다. 나는 무료 요가 수업에 참여했고 호수에서 보트의 노를 저었다.","fx":[{"w":"an","r":"a","at":14,"t":"관사 a/an","m":"free는 자음 소리로 시작하므로 a free"}]},{"n":5,"en":"Sometimes, I lay down on the grass and watched people passing by. I once saw a dog walker walking ten dog in the same time.","ko":"때때로 나는 잔디 위에 누워 사람들이 지나가는 것을 보았다. 한번은 도그 워커가 열 마리의 개를 동시에 산책시키는 것을 보았다.","fx":[{"w":"dog","r":"dogs","at":20,"t":"명사의 복수형","m":"ten 뒤에는 복수명사 dogs 사용"},{"w":"in","r":"at","at":21,"t":"기본전치사","m":"'동시에'는 at the same time 사용"}]},{"n":7,"en":"After spend time in the park, I often visited a famous bagel shop near the park. It haved more than 20 toppings.","ko":"나는 공원에서 시간을 보낸 후에 공원 근처의 유명한 베이글 가게에 자주 갔다. 거기에는 20개가 넘는 토핑이 있었다.","fx":[{"w":"spend","r":"spending","at":1,"t":"동명사","m":"전치사 After 뒤에는 동명사 spending 사용"},{"w":"haved","r":"had","at":17,"t":"불규칙 과거형","m":"have의 과거형은 had (haved 아님)"}]},{"n":9,"en":"I enjoyed to visit museums such as the Met and MoMA. They had many famous works of art that I saw in art books.","ko":"나는 Met과 MoMA 같은 박물관에 가는 것을 즐겼다. 그것들은 내가 미술책에서 보았던 유명한 예술품들을 많이 소장했다.","fx":[{"w":"to visit","r":"visiting","at":2,"t":"동명사","m":"enjoy 뒤에는 동명사 visiting 사용"}]},{"n":10,"en":"At the Met, there were a room full of paintings by Vincent van Gogh.","ko":"Met에는 Vincent van Gogh가 그린 그림들로 가득 찬 방이 있었다.","fx":[{"w":"were","r":"was","at":4,"t":"be동사의 수일치","m":"a room은 단수: was (were 아님)"}]},{"n":11,"en":"I could not believes that I was looking at his works of art up close. In another rooms, I saw people copying Edgar Degas' paintings.","ko":"나는 내가 그의 작품들을 가까이에서 보고 있다는 것을 믿을 수 없었다. 다른 방에서는 사람들이 Edgar Degas의 그림을 따라 그리고 있는 것을 보았다.","fx":[{"w":"believes","r":"believe","at":3,"t":"조동사 뒤 동사원형","m":"could not 뒤에는 동사원형: believe (believes 아님)"},{"w":"rooms","r":"room","at":17,"t":"수량 형용사 another","m":"another 뒤에는 단수명사 room 사용"}]},{"n":13,"en":"Watching The Lion King on Broadway were the most unforgettable moment.","ko":"브로드웨이에서 <The Lion King>을 관람한 것은 가장 잊지 못할 순간이었다.","fx":[{"w":"were","r":"was","at":6,"t":"be동사의 수일치","m":"동명사구 주어는 단수 취급하여 was 사용"}]},{"n":14,"en":"When I saw the colorfully stage, I felt like I was in the middle of a African jungle.","ko":"다채로운 무대를 보았을 때, 나는 마치 아프리카 정글 한가운데에 있는 것 같은 기분이 들었다.","fx":[{"w":"colorfully","r":"colorful","at":4,"t":"형용사와 부사","m":"명사 stage를 꾸미는 형용사 colorful 사용"},{"w":"a","r":"an","at":15,"t":"관사 a/an","m":"African은 모음 소리로 시작하므로 an"}]},{"n":16,"en":"In the last scene, the hero Simba showed he baby lion to the world, and tears rolls down my face.","ko":"마지막 장면에서 주인공 Simba가 자신의 새끼 사자를 세상에 보여 주었는데, 눈물이 내 얼굴을 타고 흘러내렸다.","fx":[{"w":"he","r":"his","at":8,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 his 사용"},{"w":"rolls","r":"rolled","at":16,"t":"동사의 시제","m":"과거 이야기이므로 과거형 rolled 사용"}]},{"n":17,"en":"When I came out, huge, colorful signs were shining brightly. At that moment, I knew I would never forgot this amazing city.","ko":"내가 밖으로 나왔을 때 크고 화려한 광고판들이 밝게 빛나고 있었다. 그 순간 나는 이 멋진 도시를 결코 잊지 못할 것이라는 것을 알았다.","fx":[{"w":"forgot","r":"forget","at":18,"t":"조동사 뒤 동사원형","m":"would never 뒤에는 동사원형: forget (forgot 아님)"}]}]},{"no":"49","t":"Voices from the Sports Field","q":[{"n":1,"en":"Do you love sports? If you do, you can have an career in sports.","ko":"당신은 스포츠를 좋아하시나요? 그렇다면 당신은 스포츠 분야에서 직업을 가질 수 있습니다.","fx":[{"w":"an","r":"a","at":10,"t":"관사 a/an","m":"자음 소리 c 앞에는 a career 사용"}]},{"n":2,"en":"Let's meet some peoples who are working in the sports field.","ko":"스포츠 현장에서 일하고 있는 몇몇 사람들을 만나 봅시다.","fx":[{"w":"peoples","r":"people","at":3,"t":"셀 수 없는 명사","m":"people은 이미 복수, peoples 아닌 people 사용"}]},{"n":4,"en":"Ms. Ali: Well, I've always had a passion to sports and writing. Writing about sports makes me exciting.","ko":"Ali 씨: 음, 저는 항상 스포츠와 글쓰기에 대한 열정을 가지고 있었습니다. 스포츠에 관해 글을 쓰는 것은 저를 신나게 합니다.","fx":[{"w":"to","r":"for","at":8,"t":"기본전치사","m":"'~에 대한 열정'은 passion for 사용"},{"w":"exciting","r":"excited","at":17,"t":"분사","m":"감정을 느끼는 사람은 과거분사 excited 사용"}]},{"n":5,"en":"Interviewer: There were a big baseball game yesterday. How did you spend the day?","ko":"기자: 어제 큰 야구 경기가 있었습니다. 하루를 어떻게 보내셨나요?","fx":[{"w":"were","r":"was","at":2,"t":"be동사의 수일치","m":"a big baseball game은 단수: was (were 아님)"}]},{"n":6,"en":"Ms. Ali: I arrived at the baseball park early. Before the game started, I had a interview with the players.","ko":"Ali 씨: 저는 야구장에 일찍 도착했습니다. 경기가 시작되기 전에 저는 선수들과 인터뷰를 했습니다.","fx":[{"w":"a","r":"an","at":15,"t":"관사 a/an","m":"모음 소리 i 앞에는 an interview 사용"}]},{"n":7,"en":"I took a lots of notes during the game. After the game, I went to the press conference with other journalists.","ko":"경기 중에는 메모를 많이 했습니다. 경기 후에는 다른 기자들과 기자 회견에 갔습니다.","fx":[{"w":"lots","r":"lot","at":3,"t":"수량 표현","m":"'많은'은 a lot of 사용 (lots 아님)"}]},{"n":8,"en":"I asked the players how they felt about the game. In the afternoon, I had to wrote an article and edit them very quickly.","ko":"저는 선수들에게 경기에 대해 어떻게 느꼈는지 물었습니다. 오후에는 기사를 작성하고 그것을 매우 빠르게 편집해야 했습니다.","fx":[{"w":"wrote","r":"write","at":16,"t":"to부정사","m":"had to 뒤에는 동사원형 write 사용"},{"w":"them","r":"it","at":21,"t":"인칭대명사","m":"article(단수)를 가리키므로 it 사용"}]},{"n":9,"en":"My article were posted online. I love writing about sports.","ko":"제 기사는 온라인에 게시되었습니다. 저는 스포츠에 관한 글을 쓰는 것을 매우 좋아합니다.","fx":[{"w":"were","r":"was","at":2,"t":"be동사의 수일치","m":"주어 article(단수)에는 was 사용"}]},{"n":10,"en":"Interviewer: Mr. Davis. Do you likes your job as a sports agent?","ko":"기자: Davis 씨. 스포츠 에이전트로서의 당신의 직업이 마음에 드시나요?","fx":[{"w":"likes","r":"like","at":5,"t":"do 뒤 동사원형","m":"Do 뒤에는 동사원형: like (likes 아님)"}]},{"n":11,"en":"Mr. Davis: Yes. I love sports, and I enjoy every about business.","ko":"Davis 씨: 네. 저는 스포츠를 매우 좋아하고 사업에 관한 모든 것을 즐깁니다.","fx":[{"w":"every","r":"everything","at":9,"t":"대명사 everything","m":"every 뒤에는 명사 필요, everything 사용"}]},{"n":12,"en":"I think my job is perfectly for me.","ko":"제 직업은 저에게 완벽하다고 생각합니다.","fx":[{"w":"perfectly","r":"perfect","at":5,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 perfect 사용"}]},{"n":14,"en":"Mr. Davis: When my client have a new contract to sign, I check it careful. I do my best to make the contract fair for them.","ko":"Davis 씨: 제 고객이 서명할 새로운 계약이 있을 때, 저는 그것을 신중하게 확인합니다. 저는 그들을 위해 계약을 공정하게 만들기 위해 최선을 다합니다.","fx":[{"w":"client","r":"clients","at":4,"t":"주어와 동사의 수일치","m":"복수 동사 have에는 주어 clients 사용"},{"w":"careful","r":"carefully","at":14,"t":"형용사와 부사","m":"동사 check 수식은 부사 carefully 사용"}]},{"n":15,"en":"Also, I often receive phone call from advertising companies. They wants my clients in their advertisements.","ko":"또한 저는 종종 광고 회사로부터 전화를 받습니다. 그들은 그들의 광고에 제 고객들을 원합니다.","fx":[{"w":"call","r":"calls","at":5,"t":"명사의 복수형","m":"관사 없이는 복수형 calls 사용"},{"w":"wants","r":"want","at":10,"t":"동사의 수일치","m":"주어 They에는 want 사용"}]},{"n":16,"en":"Then, I tries to get the best deal for my clients.","ko":"그러면 저는 제 고객들을 위해 최선의 거래를 얻고자 노력합니다.","fx":[{"w":"tries","r":"try","at":2,"t":"동사의 수일치","m":"주어 I에는 try 사용"}]}]},{"no":"50","t":"A Missing Cake","q":[{"n":1,"en":"Today was Dad's birthday. As a secret gift, Mom baked he a cake.","ko":"오늘은 아빠의 생일이었다. 비밀 선물로, 엄마는 그에게 케이크를 구워 주셨다.","fx":[{"w":"he","r":"him","at":10,"t":"인칭대명사의 목적격","m":"동사 baked의 간접목적어는 목적격 him 사용"}]},{"n":2,"en":"She wrapped the cake in an box and put it on the table on the kitchen.","ko":"그녀는 상자에 케이크를 포장했고 그것을 부엌에 있는 식탁에 올려놓았다.","fx":[{"w":"an","r":"a","at":5,"t":"관사 a/an","m":"자음 소리 b 앞에는 a 사용"},{"w":"on","r":"in","at":13,"t":"기본전치사","m":"'부엌 안에'는 전치사 in 사용"}]},{"n":3,"en":"Then she went out to buy candles at 11. When she came back to home one hours later, she found that the box was empty.","ko":"그러고 나서 그녀는 11시에 초를 사기 위해서 밖으로 나갔다. 그녀가 한 시간 후에 집에 돌아왔을 때, 그녀는 상자가 비어 있는 것을 발견했다.","fx":[{"w":"to home","r":"home","at":13,"t":"기본전치사","m":"home은 부사라 to 없이 back home 사용"},{"w":"hours","r":"hour","at":16,"t":"명사의 단수형","m":"one 뒤에는 단수명사 hour 사용"}]},{"n":4,"en":"Someone eated the whole cake!","ko":"누군가 케이크 전체를 먹었다!","fx":[{"w":"eated","r":"ate","at":1,"t":"불규칙 과거형","m":"eat의 과거형은 ate (eated 아님)"}]},{"n":5,"en":"Mom called Ms. Jones to finding the person who ate the cake. Ms. Jones was a wise old lady who lived next door.","ko":"엄마는 케이크를 먹은 사람을 찾기 위해 Ms. Jones에게 전화했다. Ms. Jones는 옆집에 사는 현명한 노부인이었다.","fx":[{"w":"finding","r":"find","at":5,"t":"to부정사","m":"목적을 나타내는 to 뒤에는 동사원형: find (finding 아님)"}]},{"n":6,"en":"Everyone in town came to her when they was in trouble.","ko":"마을에 있는 모든 사람은 그들이 곤경에 처했을 때 그녀에게 왔다.","fx":[{"w":"was","r":"were","at":8,"t":"be동사 수일치","m":"주어 they(복수)는 were (was 아님)"}]},{"n":8,"en":"Let's finds out the big eater!\"","ko":"대식가를 알아냅시다!\"","fx":[{"w":"finds","r":"find","at":1,"t":"Let's 뒤 동사원형","m":"Let's 뒤에는 동사원형 find 사용"}]},{"n":9,"en":"She asked Mom, \"Where was in the house this morning?\"","ko":"그녀는 엄마에게 물었다, \"누가 오늘 아침에 집에 있었죠?\"","fx":[{"w":"Where","r":"Who","at":3,"t":"의문사","m":"사람이 있었는지 묻는 의문사 Who 사용"}]},{"n":10,"en":"\"My childrens, Harry, Carol, and Tom.\"","ko":"\"우리 아이들, Harry, Carol, 그리고 Tom이요.\"","fx":[{"w":"childrens","r":"children","at":1,"t":"불규칙 복수형","m":"child의 복수형은 children"}]},{"n":11,"en":"First, Ms. Jones spoke with Harry, the oldest son, \"Someone ate you mom's cake. What did you do this morning?\"","ko":"처음에, Ms. Jones는 큰 아들 Harry와 이야기했다. \"누군가 너희 엄마의 케이크를 먹었어. 오늘 아침에 너는 무엇을 했니?\"","fx":[{"w":"you","r":"your","at":11,"t":"인칭대명사의 소유격","m":"명사 앞 소유격은 your 사용"}]},{"n":12,"en":"\"I played the soccer, and I came back home around 11. I saw the box on the table and opened it.","ko":"\"저는 축구를 했고, 11시쯤 집에 돌아왔어요. 저는 식탁 위에 있는 상자를 보았고 그것을 열었어요.","fx":[{"w":"the soccer","r":"soccer","at":2,"t":"관사","m":"운동 이름 앞에는 관사 쓰지 않음"}]},{"n":15,"en":"\"I just went to me room.\"","ko":"\"저는 그냥 제 방에 갔어요.\"","fx":[{"w":"me","r":"my","at":4,"t":"인칭대명사의 소유격","m":"명사 앞 소유격은 my 사용"}]},{"n":16,"en":"\"Hmm.... Then why do you has crumbs around your mouth?\"","ko":"\"흠…. 그러면 네 입 주변에 왜 부스러기가 있지?\"","fx":[{"w":"has","r":"have","at":5,"t":"의문문의 do/does","m":"do 뒤에는 동사원형 have 사용"}]},{"n":17,"en":"\"Oh, I ate some chocolate cookies because I were hungry.\"","ko":"\"오, 저는 배가 고파서 초콜릿 쿠키를 조금 먹었어요.\"","fx":[{"w":"were","r":"was","at":8,"t":"be동사 수일치","m":"주어 I의 과거 be동사는 was (were 아님)"}]}]},{"no":"51","t":"Yeji's Family Trip to the Rainbow State","q":[{"n":1,"en":"After a nine-hours flight, my family finally arrived at the international airport in Honolulu.","ko":"아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다.","fx":[{"w":"nine-hours","r":"nine-hour","at":2,"t":"복합 형용사","m":"하이픈 복합 형용사의 명사는 단수 hour 사용"}]},{"n":2,"en":"When we came through the gate, I heard someone calling me name. My cousin Soobin and her family were waiting for us.","ko":"우리가 게이트를 통과했을 때, 나는 누군가 내 이름을 부르는 소리를 들었다. 내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다.","fx":[{"w":"me","r":"my","at":10,"t":"인칭대명사의 소유격","m":"name 앞에는 소유격 my 사용"}]},{"n":3,"en":"When we saw each others, we hugged and jumped together in a circles. Then Soobin putted a pretty flower necklace around my neck.","ko":"우리가 서로를 보았을 때, 우리는 껴안고 함께 원을 그리며 뛰었다. 그때 수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다.","fx":[{"w":"others","r":"other","at":4,"t":"each other","m":"each other는 항상 other 단수형 사용"},{"w":"circles","r":"circle","at":12,"t":"명사의 복수형","m":"a 뒤에는 단수명사 circle 사용"},{"w":"putted","r":"put","at":15,"t":"불규칙 과거형","m":"put의 과거형은 put (putted 아님)"}]},{"n":5,"en":"We visited Diamond Head first. It is a famously hiking place.","ko":"우리는 먼저 다이아몬드 헤드를 방문했다. 그곳은 유명한 하이킹 장소이다.","fx":[{"w":"famously","r":"famous","at":8,"t":"형용사와 부사","m":"명사 hiking place 앞에는 형용사 famous 사용"}]},{"n":6,"en":"My uncle told us how it got its name. On the past, people mistook its shiny rocks for diamonds.","ko":"삼촌이 우리에게 그것이 어떻게 그런 이름을 갖게 되었는지 말해 주셨다. 과거에, 사람들은 그것의 반짝이는 돌들을 다이아몬드로 착각했다.","fx":[{"w":"On","r":"In","at":9,"t":"기본전치사","m":"'과거에'는 In the past 사용"}]},{"n":8,"en":"The view from the top were amazing. Soobin and I took much pictures there!","ko":"정상에서 바라본 경치는 정말 놀라웠다. 수빈이와 나는 거기서 많은 사진을 찍었다!","fx":[{"w":"were","r":"was","at":5,"t":"be동사의 수일치","m":"주어 The view(단수)에는 was 사용"},{"w":"much","r":"many","at":11,"t":"수량 형용사","m":"셀 수 있는 pictures 앞에는 many 사용"}]},{"n":9,"en":"Today we goed to a culture center. We learned about traditional Hawaiian culture there.","ko":"오늘 우리는 문화 센터에 갔다. 우리는 거기에서 하와이 전통문화에 대해 배웠다.","fx":[{"w":"goed","r":"went","at":2,"t":"불규칙 과거형","m":"go의 과거형은 went (goed 아님)"}]},{"n":10,"en":"First, we learned what some Hawaiian words means. \"Aloha\" is used to say \"hello\" or \"goodbye,\" and \"mahalo\" means \"thank you.\"","ko":"먼저, 우리는 몇몇 하와이 단어들이 무엇을 의미하는지 배웠다. \"Aloha\"는 '안녕' 또는 '잘 가'라는 인사를 하는 데 사용되고, \"mahalo\"는 '고마워'를 의미한다.","fx":[{"w":"means","r":"mean","at":7,"t":"주어와 동사의 수일치","m":"주어 words(복수)는 동사원형: mean (means 아님)"}]},{"n":11,"en":"Then it was hula dance time! Surprisingly, many of the movement stood for things in nature.","ko":"그 다음은 훌라 춤 시간이었다! 놀랍게도, 많은 동작들이 자연의 것들을 상징했다.","fx":[{"w":"movement","r":"movements","at":10,"t":"명사의 복수형","m":"many of the 뒤에는 복수명사 movements 사용"}]},{"n":12,"en":"For example, if you raise you arms above your head in a circle, it stand for the moon.","ko":"예를 들어, 팔을 머리 위로 원을 그리며 들면, 그것은 달을 의미한다.","fx":[{"w":"you","r":"your","at":5,"t":"인칭대명사의 소유격","m":"arms 앞에는 소유격 your 사용"},{"w":"stand","r":"stands","at":14,"t":"3인칭 단수 현재형","m":"주어 it에는 stands 사용"}]},{"n":13,"en":"When I danced hula, I could felt the Hawaiian people's love for nature.","ko":"훌라 춤을 출 때, 나는 하와이 사람들의 자연에 대한 사랑을 느낄 수 있었다.","fx":[{"w":"felt","r":"feel","at":6,"t":"조동사 뒤 동사원형","m":"조동사 could 뒤에는 동사원형: feel (felt 아님)"}]},{"n":14,"en":"On the way back to Soobin's house, we saw a big, beautiful rainbow. Soobin explained, \"You can see often rainbows in Hawaii.","ko":"수빈이네 집으로 돌아가는 길에, 우리는 크고 아름다운 무지개를 보았다. 수빈이는 \"하와이에서는 무지개를 자주 볼 수 있어.","fx":[{"w":"see often","r":"often see","at":17,"t":"빈도부사의 위치","m":"빈도부사 often은 일반동사 see 앞에 위치"}]}]},{"no":"52","t":"A Field Trip to the Moon","q":[{"n":1,"en":"Hohyun's school goed on a field trip to the Moon.","ko":"호현이의 학교는 달로 체험 학습을 갔습니다.","fx":[{"w":"goed","r":"went","at":2,"t":"불규칙 과거형","m":"go의 과거형은 went (goed 아님)"}]},{"n":3,"en":"Hohyun pushed Yuchan with he finger, and Yuchan went sail through the cabin! Kyujin stood upside down on the ceiling.","ko":"호현이는 유찬이를 손가락으로 밀었고, 유찬이는 선실 안을 떠다녔습니다! 규진이는 천장에 거꾸로 섰습니다.","fx":[{"w":"he","r":"his","at":4,"t":"인칭대명사의 소유격","m":"finger 앞에는 소유격 his 사용"},{"w":"sail","r":"sailing","at":9,"t":"go + -ing","m":"'~하며 가다'는 went sailing 사용"}]},{"n":4,"en":"Sihyun was standing on the wall. Everyone felt comfortably because there is no up or down in space.","ko":"시현이는 벽에 서 있었습니다. 우주에서는 위아래가 없기 때문에 모두가 편안하게 느꼈습니다.","fx":[{"w":"comfortably","r":"comfortable","at":8,"t":"형용사와 부사","m":"felt 뒤 보어 자리에는 형용사 comfortable 사용"}]},{"n":5,"en":"Lunch was soup and potatoes in special packages. Plates are not use in space, so everyone ate directly from the packages.","ko":"점심은 특별한 포장 용기에 담긴 수프와 감자였습니다. 우주에서는 접시를 사용할 수 없어서 모두 포장 용기에서 바로 음식을 먹었습니다.","fx":[{"w":"use","r":"used","at":11,"t":"수동태","m":"be동사 + 과거분사 used 사용"}]},{"n":6,"en":"It was possible to fixing the package on the table because there were magnet on both the package and the table.","ko":"포장 용기와 테이블에는 모두 자석이 있어서 포장 용기를 테이블에 고정할 수 있었습니다.","fx":[{"w":"fixing","r":"fix","at":4,"t":"to부정사","m":"to 뒤에는 동사원형 fix 사용"},{"w":"magnet","r":"magnets","at":13,"t":"명사의 복수형","m":"복수 동사 were 뒤에는 복수명사 magnets 사용"}]},{"n":7,"en":"\"Keep you food on the table magnet, everyone,\" said Ms. Lee, the homeroom teachers.","ko":"\"모두 테이블 자석 위에 음식을 올려 두세요,\"라고 담임 선생님인 이 선생님이 말씀하셨습니다.","fx":[{"w":"you","r":"your","at":1,"t":"인칭대명사의 소유격","m":"food 앞에는 소유격 your 사용"},{"w":"teachers","r":"teacher","at":13,"t":"명사의 단수형","m":"Ms. Lee 한 명이므로 단수 teacher 사용"}]},{"n":9,"en":"The spaceship landed in the Moon. Everyone jumped out and landed slowly because the Moon have low gravities.","ko":"우주선이 달에 착륙했습니다. 달은 낮은 중력을 갖고 있어서 모두 밖으로 뛰어나가서 천천히 착지했습니다.","fx":[{"w":"in","r":"on","at":3,"t":"기본전치사","m":"'~에 착륙하다'는 land on 사용"},{"w":"have","r":"has","at":15,"t":"일반동사의 수일치","m":"단수 주어 the Moon에는 has 사용"},{"w":"gravities","r":"gravity","at":17,"t":"셀 수 없는 명사","m":"gravity는 셀 수 없는 명사라 복수형 없음"}]},{"n":10,"en":"It was easily to jump high on the Moon. When Sihyun jumped, her went over Kyujin's head!","ko":"달에서는 높이 점프하는 것이 쉬웠습니다. 시현이는 점프하면서 규진이의 머리 위로 날아갔습니다!","fx":[{"w":"easily","r":"easy","at":2,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 easy 사용"},{"w":"her","r":"she","at":12,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 she 사용"}]},{"n":11,"en":"\"Be careful,\" said Ms. Lee. \"It's fun to jump in low gravity, but you can gets hurt if you bump into each others.","ko":"\"조심하세요,\" 이 선생님이 말했습니다. \"낮은 중력에서 점프하는 건 재미있지만, 서로 부딪히면 다칠 수 있어요.","fx":[{"w":"gets","r":"get","at":15,"t":"조동사 can","m":"조동사 can 뒤에는 동사원형 get 사용"},{"w":"others","r":"other","at":22,"t":"상호대명사","m":"each other의 other는 단수형 사용"}]},{"n":12,"en":"Now, everyone, come here and let's take a look to the footprints of the Apollo astronauts!\"","ko":"자, 이제 모두 이리로 와서 아폴로 우주 비행사들의 발자국을 봅시다!\"","fx":[{"w":"to","r":"at","at":9,"t":"기본전치사","m":"'~을 보다'는 take a look at 사용"}]},{"n":15,"en":"Then suddenly, the ground began to shaking. \"A earthquake!\" shouted Sihyun.","ko":"그때 갑자기 땅이 흔들리기 시작했습니다. \"지진이야!\" 시현이가 외쳤습니다.","fx":[{"w":"shaking","r":"shake","at":6,"t":"to부정사","m":"began to 뒤는 동사원형: to shake"},{"w":"A","r":"An","at":7,"t":"관사 a/an","m":"모음 소리 earthquake 앞에는 an 사용"}]},{"n":16,"en":"\"Calm down, everyone,\" said Ms. Lee. \"It's actually an moonquake.","ko":"\"진정하세요, 여러분,\" 이 선생님이 말했습니다. \"그건 사실 월진이에요.","fx":[{"w":"an","r":"a","at":8,"t":"관사 a/an","m":"자음 소리 moonquake 앞에는 a 사용"}]},{"n":17,"en":"Luckily, it's not very strong. We will be okay if we keeps still.\"","ko":"다행히 그리 강하지 않아요. 가만히 있으면 괜찮을 거예요.\"","fx":[{"w":"keeps","r":"keep","at":11,"t":"일반동사의 수일치","m":"주어 we에는 keep 사용"}]},{"n":19,"en":"\"Now, let's to go and explore the craters,\" said Ms. Lee. \"Craters are made when space rocks crash into the Moon.","ko":"\"이제 분화구를 탐험하러 갑시다,\" 이 선생님이 말했습니다. \"분화구는 우주 암석이 달에 충돌할 때 만들어져요.","fx":[{"w":"to go","r":"go","at":2,"t":"Let's + 동사원형","m":"Let's 뒤에는 동사원형 go 사용"}]},{"n":20,"en":"Like the footprints, the craters don't change many because the Moon has no air.\"","ko":"발자국처럼, 달에는 공기가 없어서 분화구도 거의 변하지 않아요.\"","fx":[{"w":"many","r":"much","at":7,"t":"수량 형용사 many/much","m":"동사 change를 꾸미는 말은 much 사용"}]}]},{"no":"53","t":"Living with Corals Again - A Diver's Diary","q":[{"n":2,"en":"It's a sad day for I. This morning, I went scuba diving at my favorite spot in the sea.","ko":"오늘은 내게 슬픈 날이다. 오늘 아침, 나는 바다에서 내가 가장 좋아하는 지점으로 스쿠버 다이빙을 갔다.","fx":[{"w":"I","r":"me","at":5,"t":"인칭대명사의 목적격","m":"전치사 for 뒤에는 목적격 me 사용"}]},{"n":3,"en":"It was an place that was full in beautiful and colorful corals. But today, I saw that corals was getting sick.","ko":"그곳은 아름답고 다채로운 산호들로 가득한 장소였다. 그런데 오늘, 나는 산호들이 병들어 가고 있는 것을 보았다.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"자음 소리 place 앞에는 a 사용"},{"w":"in","r":"of","at":7,"t":"관용 전치사구","m":"be full of: ~로 가득하다"},{"w":"was","r":"were","at":18,"t":"be동사의 과거형","m":"복수 주어 corals에는 were 사용"}]},{"n":4,"en":"I was shocking. Because the warm seawater, corals have turned white.","ko":"나는 충격을 받았다. 따뜻한 바닷물 때문에 산호들이 흰색으로 변해버렸다.","fx":[{"w":"shocking","r":"shocked","at":2,"t":"감정 분사","m":"주어 I가 충격을 받았으므로 shocked 사용"},{"w":"the","r":"of the","at":4,"t":"접속사와 전치사","m":"명사구 앞에는 Because of 사용"}]},{"n":5,"en":"Different types of waste has harmed the corals, too. Now the spot have lost its colors and beauty.","ko":"여러 종류의 쓰레기도 산호에 해를 끼쳤다. 이제 그 지점은 색과 아름다움을 잃어버렸다.","fx":[{"w":"has","r":"have","at":4,"t":"주어와 동사의 수일치","m":"주어 types(복수)는 have: have harmed (has 아님)"},{"w":"have","r":"has","at":12,"t":"주어와 동사의 수일치","m":"주어 the spot(단수)은 has: has lost (have 아님)"}]},{"n":8,"en":"I have thought about what to help corals. My plan is to form a team of divers.","ko":"나는 산호를 돕는 방법에 대해 생각했다. 내 계획은 잠수부 팀을 만드는 것이다.","fx":[{"w":"what","r":"how","at":4,"t":"의문사","m":"\"어떻게 ~할지\"는 how to help 사용"}]},{"n":9,"en":"My team can go underwater and take care of the sick corals. Many corals get sick because they don't gets good care in time.","ko":"우리 팀은 바닷속으로 가서 병든 산호들을 돌볼 수 있다. 많은 산호들은 제때 좋은 치료를 받지 못하기 때문에 아프다.","fx":[{"w":"gets","r":"get","at":19,"t":"do/does 의문문·부정문","m":"don't 뒤에는 동사원형: get (gets 아님)"}]},{"n":10,"en":"I'm sure that another divers are worried about this, too. I'm going to post a message online to look for volunteer divers.","ko":"나는 다른 잠수부들도 이것을 걱정하고 있다고 확신한다. 나는 자원봉사 잠수부를 찾기 위해 온라인에 메시지를 올릴 예정이다.","fx":[{"w":"another","r":"other","at":3,"t":"수량 한정사","m":"복수 divers 앞에는 other 사용"}]},{"n":12,"en":"For the last two weeks, my team has putted ointment on sick corals.","ko":"지난 두 주 동안, 우리 팀은 병든 산호에 연고를 발랐다.","fx":[{"w":"putted","r":"put","at":8,"t":"현재완료","m":"put의 과거분사는 put: has put (putted 아님)"}]},{"n":13,"en":"We also taked some healthy baby corals from the sea and put them in tanks of seawater.","ko":"우리는 또한 바다에서 건강한 아기 산호들을 가져와 바닷물 수조에 넣었다.","fx":[{"w":"taked","r":"took","at":2,"t":"불규칙 과거형","m":"take의 과거형은 took (taked 아님)"}]},{"n":14,"en":"We feed them clam parts and seaweed smoothies. This food helps baby corals grow more strong.","ko":"우리는 그것들에게 조개 부스러기와 해조류 스무디를 먹였다. 이 음식은 아기 산호들이 더 강하게 자라도록 돕는다.","fx":[{"w":"more strong","r":"stronger","at":14,"t":"비교급","m":"짧은 형용사는 -er: stronger"}]},{"n":15,"en":"When they are ready, we'll plant them onto the corals in the sea. Our goal is to growing many healthy corals.","ko":"아기 산호들이 준비되면, 우리는 그것들을 바다의 산호에 심을 것이다. 우리의 목표는 많은 건강한 산호들을 키우는 것이다.","fx":[{"w":"growing","r":"grow","at":17,"t":"to부정사","m":"is to 뒤에는 동사원형: grow (growing 아님)"}]},{"n":16,"en":"I look forward to see the results!","ko":"나는 결과를 볼 것을 기대한다!","fx":[{"w":"see","r":"seeing","at":4,"t":"동명사","m":"look forward to 뒤에는 동명사: seeing (see 아님)"}]},{"n":18,"en":"Last night, some healthily corals in the sea laid eggs during the full moon.","ko":"어젯밤, 바다의 일부 건강한 산호들이 보름달이 뜬 동안 알들을 낳았다.","fx":[{"w":"healthily","r":"healthy","at":3,"t":"형용사와 부사","m":"명사 corals를 꾸미는 형용사 healthy 사용"}]},{"n":19,"en":"This morning, hundreds of baby corals were born from the eggs like magic. They were cute and amazed.","ko":"오늘 아침, 그 알들에서 수백 마리의 아기 산호들이 마법처럼 태어났다. 그것들은 귀엽고 놀라웠다.","fx":[{"w":"amazed","r":"amazing","at":17,"t":"감정 분사","m":"주어 They가 놀라움을 주므로 amazing 사용"}]},{"n":20,"en":"I hope these miracle will happen to other sick corals, too.","ko":"나는 이 기적이 다른 병든 산호들에게도 일어나기를 바란다.","fx":[{"w":"these","r":"this","at":2,"t":"지시형용사 this/these","m":"단수명사 miracle에는 this 사용"}]},{"n":21,"en":"Although it took time to heal the sick corals and grow healthily ones, it was worth of the hard work.","ko":"비록 병든 산호들을 치료하고 건강한 산호들을 키우는 데 시간이 걸렸지만, 그 노력은 가치 있었다.","fx":[{"w":"healthily","r":"healthy","at":11,"t":"형용사와 부사","m":"명사 ones를 꾸미는 형용사 healthy 사용"},{"w":"of the","r":"the","at":16,"t":"관용 전치사구","m":"worth 뒤에는 of 없이 명사 사용"}]}]},{"no":"54","t":"Dr. Schofield, a Foreigner Who Loved Korea","q":[{"n":1,"en":"On February 28, 1919, a man comed to Dr. Schofield's house.","ko":"1919년 2월 28일, 한 남자가 Schofield 박사의 집에 왔다.","fx":[{"w":"comed","r":"came","at":6,"t":"불규칙 과거형","m":"come의 과거형은 came (comed 아님)"}]},{"n":2,"en":"A man: Dr. Schofield, I have a special favor to asking you.","ko":"남자: Schofield 박사님, 특별한 부탁이 있습니다.","fx":[{"w":"asking","r":"ask","at":10,"t":"to부정사","m":"to 뒤에는 동사원형 ask 사용"}]},{"n":4,"en":"A man: Much people are going to gather tomorrow for the independence of Korea.","ko":"남자: 내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다.","fx":[{"w":"Much","r":"Many","at":2,"t":"수량 형용사 many/much","m":"people은 셀 수 있으므로 Many 사용"}]},{"n":5,"en":"Could you take pictures of the event and share they with the world?","ko":"그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?","fx":[{"w":"they","r":"them","at":9,"t":"인칭대명사의 목적격","m":"동사 share 뒤에는 목적격 them 사용"}]},{"n":6,"en":"At 2 p.m. in March 1, Dr. Schofield was hiding in an building and saw a large group of people gathering outside.","ko":"3월 1일 오후 2시, Schofield 박사는 한 건물에 숨어 있으면서 밖에 많은 사람들이 모여드는 것을 보았다.","fx":[{"w":"in","r":"on","at":3,"t":"기본전치사","m":"특정한 날짜 앞에는 전치사 on 사용"},{"w":"an","r":"a","at":11,"t":"관사 a/an","m":"building은 자음 소리라 a building 사용"}]},{"n":8,"en":"Dr. Schofield: Unbelievable! There is so many people here.","ko":"Schofield 박사: 믿을 수 없어! 여기엔 정말 많은 사람들이 있어.","fx":[{"w":"is","r":"are","at":4,"t":"be동사","m":"복수 many people 앞에는 There are 사용"}]},{"n":9,"en":"I hope the world will learn about this important event through me pictures.","ko":"내 사진을 통해 세계가 이 중요한 사건에 대해 알게 되기를 바라.","fx":[{"w":"me","r":"my","at":11,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"}]},{"n":10,"en":"Do you know Seok Hopil? His English name were Frank W.","ko":"당신은 석호필을 아는가? 그의 영어 이름은 Frank W.","fx":[{"w":"were","r":"was","at":8,"t":"be동사","m":"단수 주어 name에는 was 사용"}]},{"n":11,"en":"Schofield, but he loved him Korean name. It sounded similar to his real name, and it also had a good meaning.","ko":"Schofield였지만, 그는 자신의 한국 이름을 사랑했다. 그 이름은 그의 본명과 비슷하게 들렸고 좋은 의미도 담고 있었다.","fx":[{"w":"him","r":"his","at":4,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 his 사용"}]},{"n":12,"en":"Dr. Schofield was a Canadian doctor, and he first came to Korea at 1916 to teach medicine.","ko":"Schofield 박사는 캐나다 의사였고, 의학을 가르치기 위해 1916년에 한국에 처음 왔다.","fx":[{"w":"at","r":"in","at":12,"t":"기본전치사","m":"연도 앞에는 전치사 in 사용"}]},{"n":14,"en":"He studied so hard that he was able to teach in Korean after only a little years.","ko":"그는 매우 열심히 공부해서 몇 년 만에 한국어로 가르칠 수 있게 되었다.","fx":[{"w":"little","r":"few","at":15,"t":"수량 형용사 a few/a little","m":"셀 수 있는 years에는 a few 사용"}]},{"n":15,"en":"He believed that every countries has the right to be independence, so he helped the Korean independence movement.","ko":"그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다.","fx":[{"w":"countries","r":"country","at":4,"t":"명사의 복수형","m":"every 뒤에는 단수명사 country 사용"},{"w":"independence","r":"independent","at":10,"t":"품사 혼동","m":"be 뒤 보어는 형용사 independent 사용"}]},{"n":17,"en":"He taked pictures of the event with his camera.","ko":"그는 카메라로 그 사건의 사진을 찍었다.","fx":[{"w":"taked","r":"took","at":1,"t":"불규칙 과거형","m":"take의 과거형은 took (taked 아님)"}]},{"n":18,"en":"He then wrote a article about the historic event and sent it to foreign newspapers with his pictures.","ko":"그 후 그는 이 역사적인 사건에 대한 기사를 써서 사진과 함께 외국 신문사에 보냈다.","fx":[{"w":"a","r":"an","at":3,"t":"관사 a/an","m":"article은 모음 소리라 an article 사용"}]},{"n":19,"en":"Dr. Schofield's fight for Korean independence didn't stopped even after the March 1st Movement.","ko":"한국 독립을 위한 Schofield 박사의 투쟁은 3·1운동 이후에도 멈추지 않았다.","fx":[{"w":"stopped","r":"stop","at":7,"t":"do/does 부정문","m":"didn't 뒤에는 동사원형: stop (stopped 아님)"}]},{"n":20,"en":"He continued to wrote about the terrible situation in Korea for foreign newspapers.","ko":"그는 외국 신문에 한국의 참혹한 상황에 대해 계속해서 글을 썼다.","fx":[{"w":"wrote","r":"write","at":3,"t":"to부정사","m":"to 뒤에는 동사원형 write 사용"}]}]},{"no":"55","t":"Voice of Teens","q":[{"n":1,"en":"Let's meet Fly High, our school's cheerleading club. The club started from an idea of one student two year ago.","ko":"우리 학교의 응원 동아리 Fly High를 만나봅시다. 그 동아리는 2년 전에 한 학생의 아이디어에서 시작되었습니다.","fx":[{"w":"year","r":"years","at":18,"t":"명사의 복수형","m":"two 뒤에는 복수명사 years 사용"}]},{"n":2,"en":"Now, there are 10 girls and 6 boys in the club. Each member have a special energy.","ko":"이제는, 그 동아리에 10명의 소녀와 6명의 소년이 있습니다. 각 멤버는 특별한 에너지를 가지고 있습니다.","fx":[{"w":"have","r":"has","at":13,"t":"3인칭 단수 현재형","m":"Each member(단수): has (have 아님)"}]},{"n":3,"en":"Do you remember the recently school basketball game? After two quarters, our team was losing on 20 points.","ko":"여러분은 최근 학교 농구 경기를 기억하나요? 2쿼터 후에, 우리 팀은 20점 차이로 지고 있었습니다.","fx":[{"w":"recently","r":"recent","at":4,"t":"형용사와 부사","m":"명사 game을 꾸미는 형용사 recent 사용"},{"w":"on","r":"by","at":15,"t":"기본전치사","m":"'~점 차로'는 by 20 points 사용"}]},{"n":4,"en":"During halftime, Fly High came on the court. They performed wonderful.","ko":"하프 타임 동안, Fly High가 코트에 나왔습니다. 그들은 멋지게 공연했습니다.","fx":[{"w":"wonderful","r":"wonderfully","at":10,"t":"형용사와 부사","m":"동사 performed를 꾸미는 부사 wonderfully 사용"}]},{"n":5,"en":"They flipped in the air and make a human pyramid. Then they shouted, \"Never give up!\"","ko":"그들은 공중에서 돌았고 인간 피라미드를 만들었습니다. 그러고 나서 그들은 \"절대 포기하지 마!\"라고 외쳤습니다.","fx":[{"w":"make","r":"made","at":6,"t":"일반동사의 과거형","m":"flipped와 병렬이므로 made (make 아님)"}]},{"n":6,"en":"And guess what? Our team win the game in the end.","ko":"그리고 어떻게 되었을까요? 결국에는 우리 팀이 그 경기에서 이겼습니다.","fx":[{"w":"win","r":"won","at":5,"t":"일반동사의 과거형","m":"과거 상황이므로 won 사용"}]},{"n":7,"en":"Jina, the captain of the club, said, \"I can flipping in the air because I trust me club members.","ko":"그 동아리의 회장인 지나는 말했습니다, \"나는 동아리 멤버들을 믿기 때문에 공중에서 돌 수 있어요.","fx":[{"w":"flipping","r":"flip","at":9,"t":"조동사","m":"조동사 can 뒤에는 동사원형 flip 사용"},{"w":"me","r":"my","at":16,"t":"인칭대명사의 소유격","m":"명사 club 앞에는 소유격 my 사용"}]},{"n":8,"en":"When I see the crowd cheering and screaming, I feel proud. Fly High is the most best part of my middle school life!\"","ko":"관중들이 응원하고 소리치는 것을 볼 때, 나는 자랑스럽습니다. Fly High는 나의 중학교 생활 중 최고의 부분입니다!\"","fx":[{"w":"most best","r":"best","at":15,"t":"최상급","m":"best는 이미 최상급이라 most를 쓰지 않음"}]},{"n":9,"en":"You can watch Fly High doing them performance at the school festival next weeks. Come and feel they energy!","ko":"다음 주 학교 축제에서 Fly High가 공연하는 것을 볼 수 있습니다. 오셔서 그들의 에너지를 느껴 보세요!","fx":[{"w":"them","r":"their","at":6,"t":"인칭대명사의 소유격","m":"명사 performance 앞에는 소유격 their 사용"},{"w":"weeks","r":"week","at":13,"t":"명사의 단수형","m":"next 뒤에는 단수명사 week 사용"},{"w":"they","r":"their","at":17,"t":"인칭대명사의 소유격","m":"명사 energy 앞에는 소유격 their 사용"}]},{"n":11,"en":"What does you do with your money? Do you save it or spend it?","ko":"당신은 당신의 돈으로 무엇을 하나요? 그것을 저축하나요 아니면 소비하나요?","fx":[{"w":"does","r":"do","at":1,"t":"do동사의 의문문","m":"주어 you: do (does 아님)"}]},{"n":12,"en":"We asked the following questions to 100 student from our school. Let's look at the results.","ko":"우리는 우리 학교 학생 100명에게 다음의 질문을 했습니다. 그 결과를 살펴봅시다.","fx":[{"w":"student","r":"students","at":7,"t":"명사의 복수형","m":"100 뒤에는 복수명사 students 사용"}]}]},{"no":"56","t":"My First Skateboarding Lesson","q":[{"n":1,"en":"When did you last try something new? I have always wanted to learning skateboarding.","ko":"너는 언제 마지막으로 새로운 것을 시도했니? 나는 항상 스케이트보드 타기를 배우고 싶어 했어.","fx":[{"w":"learning","r":"learn","at":12,"t":"to부정사","m":"want 뒤에는 to + 동사원형 learn 사용"}]},{"n":3,"en":"When I got to the skatepark, I saw an guy skateboarding in a big bowl. He was Eric, me skateboarding teacher.","ko":"스케이트파크에 도착했을 때, 나는 한 남자가 큰 볼(깊고 둥근 형태의 구조물)에서 스케이트보드를 타고 있는 것을 보았어. 그는 나의 스케이트보드 타기 선생님인 Eric이었어.","fx":[{"w":"an","r":"a","at":8,"t":"관사 a/an","m":"자음 소리로 시작하는 guy 앞에는 a 사용"},{"w":"me","r":"my","at":18,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"}]},{"n":4,"en":"He jumped into the air and flip the board. He landed clean.","ko":"그는 공중으로 뛰어올라 보드를 휙 뒤집었어. 그는 깔끔하게 착지했지.","fx":[{"w":"flip","r":"flipped","at":6,"t":"시제의 일치","m":"jumped와 같은 과거형 flipped 사용"},{"w":"clean","r":"cleanly","at":11,"t":"형용사와 부사","m":"동사 landed를 꾸미는 부사 cleanly 사용"}]},{"n":5,"en":"He reminded me of a surfer on a big wave. I learned from a blog that skateboarding began with surfers at California.","ko":"그는 큰 파도를 타는 서퍼를 떠올리게 했어. 나는 한 블로그에서 스케이트보드 타기가 캘리포니아의 서퍼들로부터 시작되었다는 것을 알게 되었어.","fx":[{"w":"at","r":"in","at":20,"t":"기본전치사","m":"주(州) 이름 앞에는 전치사 in 사용"}]},{"n":7,"en":"When there was few rain in California, skateboarders used empty swimming pools as them skateparks.","ko":"캘리포니아에 비가 거의 오지 않았을 때, 스케이트보드 타는 사람들은 빈 수영장을 그들의 스케이트파크로 이용했어.","fx":[{"w":"few","r":"little","at":3,"t":"수량 형용사 few/little","m":"셀 수 없는 rain에는 little 사용"},{"w":"them","r":"their","at":13,"t":"인칭대명사의 소유격","m":"명사 skateparks 앞에는 소유격 their 사용"}]},{"n":8,"en":"Before the lesson, Eric and I did a warm-up exercise. Eric told me, \"Safe is the most important thing, Ian!\"","ko":"수업 전에, Eric과 나는 준비 운동을 했어. Eric은 나에게 \"안전이 가장 중요한 거야, Ian!\"이라고 말했어.","fx":[{"w":"Safe","r":"Safety","at":13,"t":"명사와 형용사","m":"주어 자리에는 명사 Safety 사용"}]},{"n":9,"en":"Then, he made me to wear a helmet and pads to stay safely during the class.","ko":"그런 다음 그는 수업 중에 안전하게 있기 위해 나에게 헬멧과 보호대를 착용하게 했어.","fx":[{"w":"to wear","r":"wear","at":4,"t":"사역동사 make","m":"make + 목적어 뒤에는 동사원형 wear 사용"},{"w":"safely","r":"safe","at":12,"t":"형용사와 부사","m":"stay 뒤 보어 자리에는 형용사 safe 사용"}]},{"n":10,"en":"The lesson finally began. Eric taught me the basicest skill, the \"push-off.\"","ko":"수업이 마침내 시작되었어. Eric은 나에게 가장 기초적인 기술인 '푸시 오프'를 가르쳐 주었어.","fx":[{"w":"basicest","r":"most basic","at":8,"t":"최상급","m":"긴 형용사 basic은 the most basic 사용"}]},{"n":11,"en":"To push off on the skateboard, I put one feet on the board and push against the ground with the other foot. Tada!","ko":"스케이트보드 위에서 푸시 오프를 하기 위해서, 나는 한 발을 보드에 올리고 다른 발로 땅을 밀었어. 짜잔!","fx":[{"w":"feet","r":"foot","at":9,"t":"불규칙 복수형","m":"one 뒤에는 단수 foot 사용"},{"w":"push","r":"pushed","at":14,"t":"시제의 일치","m":"앞의 put과 같은 과거형 pushed 사용"}]},{"n":12,"en":"I moved forward! This skill looked simple, but I fell down much times.","ko":"나는 앞으로 나아갔어! 이 기술은 간단해 보였지만, 나는 여러 번 넘어졌어.","fx":[{"w":"much","r":"many","at":11,"t":"수량 형용사 many/much","m":"셀 수 있는 times 앞에는 many 사용"}]},{"n":13,"en":"With practice, I was able to keeping my balance and ride. I heard Eric cheering of me.","ko":"연습을 통해 나는 균형을 잡고 탈 수 있었어. 나는 Eric이 나를 응원하는 소리를 들었어.","fx":[{"w":"keeping","r":"keep","at":6,"t":"to부정사","m":"be able to 뒤는 동사원형: keep (keeping 아님)"},{"w":"of","r":"for","at":15,"t":"기본전치사","m":"\"~를 응원하다\"는 cheer for 사용"}]},{"n":14,"en":"After the lesson, I realized skateboarding are more than just a cool-looking sport. It makes me feel freely.","ko":"수업 후에, 나는 스케이트보드 타기가 단지 멋져 보이는 스포츠 그 이상이라는 것을 깨달았어. 그것은 나에게 자유를 느끼게 해 줘.","fx":[{"w":"are","r":"is","at":6,"t":"be동사의 수일치","m":"주어 skateboarding(동명사, 단수)은 is (are 아님)"},{"w":"freely","r":"free","at":17,"t":"형용사와 부사","m":"feel 뒤 보어 자리에는 형용사 free 사용"}]},{"n":16,"en":"It show I practiced really hard. I hope to skate more better and more freely someday.","ko":"그것은 내가 정말 열심히 연습했다는 것을 보여 주는 것이니까. 나는 언젠가는 더 잘, 그리고 더 자유롭게 스케이트보드를 탈 수 있으면 좋겠어.","fx":[{"w":"show","r":"shows","at":1,"t":"3인칭 단수 현재형","m":"주어 It(3인칭 단수)에는 shows 사용"},{"w":"more better","r":"better","at":10,"t":"비교급","m":"better는 이미 비교급이므로 more 안 붙임"}]},{"n":17,"en":"Do you want to try skateboarding, too? Just visit to the nearest skatepark!","ko":"너도 스케이트보드 타기를 해 보고 싶니? 일단 가장 가까운 스케이트파크를 방문해 봐!","fx":[{"w":"to the","r":"the","at":9,"t":"타동사와 전치사","m":"visit은 타동사라 전치사 없이 the skatepark 사용"}]}]},{"no":"57","t":"Science Is the Key","q":[{"n":2,"en":"\"We're going to spending the day under nature's roof. So, we should understand nature with a special keys,\" Dad said.","ko":"\"우리는 자연의 지붕 아래에서 하루를 보낼 거야. 그래서 우리는 특별한 열쇠로 자연을 이해해야 해.\" 아빠가 말씀하셨다.","fx":[{"w":"spending","r":"spend","at":3,"t":"to부정사","m":"to 뒤에는 동사원형 spend 사용"},{"w":"keys","r":"key","at":17,"t":"명사의 단수형","m":"a 뒤에는 단수명사 key 사용"}]},{"n":3,"en":"\"Who's the key?\" I asked.","ko":"\"그 열쇠가 뭐예요?\" 내가 물었다.","fx":[{"w":"Who's","r":"What's","at":0,"t":"의문사","m":"사물을 묻는 의문사 What 사용"}]},{"n":4,"en":"\"Science, Minho,\" Dad answered with an big smile.","ko":"\"과학이란다, 민호야.\" 아빠가 환하게 웃으며 대답하셨다.","fx":[{"w":"an","r":"a","at":5,"t":"관사 a/an","m":"자음 소리 big 앞에는 a 사용"}]},{"n":5,"en":"We pulled the tent out of it bag, and Dad look around.","ko":"우리는 가방에서 텐트를 꺼냈고, 아빠는 주위를 둘러보셨다.","fx":[{"w":"it","r":"its","at":6,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 its 사용"},{"w":"look","r":"looked","at":10,"t":"과거시제","m":"앞 동사와 같이 과거형 looked 사용"}]},{"n":6,"en":"\"What are you do, Dad?\"","ko":"\"아빠, 뭐 하세요?\"","fx":[{"w":"do","r":"doing","at":3,"t":"현재진행형","m":"are 뒤에는 doing: do 아님"}]},{"n":7,"en":"\"I'm look for a place for the tent.\"","ko":"\"텐트를 칠 장소를 찾고 있단다.\"","fx":[{"w":"look","r":"looking","at":1,"t":"현재진행형","m":"I'm 뒤에는 looking: look 아님"}]},{"n":8,"en":"\"It's going to be very hot at the afternoon,\" I said.","ko":"\"오후에는 매우 더울 거예요.\"라고 내가 말했다.","fx":[{"w":"at","r":"in","at":6,"t":"기본전치사","m":"'오후에'는 in the afternoon 사용"}]},{"n":9,"en":"\"Right. We will be back from the lake about 4 hour later.","ko":"\"맞아. 우리는 약 4시간 후에 호수에서 돌아올 거란다.","fx":[{"w":"hour","r":"hours","at":10,"t":"명사의 복수형","m":"숫자 4 뒤에는 복수명사 hours 사용"}]},{"n":11,"en":"Q1. Which is the more better place to set up the tent?","ko":"Q1. 텐트를 세우기에 더 좋은 장소는 어디인가요?","fx":[{"w":"more better","r":"better","at":4,"t":"비교급","m" sh people took over this region on the 16th century, them first learned about potatoes.","ko":"스페인 사람들이 16세기에 이 지역을 장악했을 때 그들은 처음 감자에 대해 알게 되었다.","fx":[{"w":"on","r":"in","at":7,"t":"기본전치사","m":"'~세기에'는 전치사 in 사용"},{"w":"them","r":"they","at":11,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 they 사용"}]},{"n":3,"en":"They brought them to Europe because they were a good food source. However, potatoes was not welcomed at first.","ko":"감자가 좋은 식량원이었기 때문에 그들은 감자를 유럽으로 가져왔다. 하지만 감자는 처음에 환영받지 못했다.","fx":[{"w":"was","r":"were","at":14,"t":"be동사의 과거형","m":"주어 potatoes(복수)에는 were 사용"}]},{"n":4,"en":"People did not try to grow and eat them because they looked strangely.","ko":"사람들은 감자가 이상하게 생겼기 때문에 그것을 재배해 먹으려고 하지 않았다.","fx":[{"w":"strangely","r":"strange","at":12,"t":"형용사와 부사","m":"looked 뒤 보어 자리에는 형용사 strange 사용"}]},{"n":6,"en":"A great food shortages happened in Prussia in 1744. People did not has enough food to eat.","ko":"1744년에 프로이센에서 대기근이 발생했다. 사람들은 먹을 식량이 충분치 않았다.","fx":[{"w":"shortages","r":"shortage","at":3,"t":"명사의 단수·복수","m":"A great 뒤에는 단수명사 shortage 사용"},{"w":"has","r":"have","at":12,"t":"do 부정문과 동사원형","m":"did not 뒤에는 동사원형 have 사용"}]},{"n":7,"en":"Frederick the Great wanted his people to grow and eat potatoes. He planted a large fields of potatoes, but nobody was interested.","ko":"Frederick 대왕은 백성들이 감자를 재배해 먹기를 원했다. 그는 커다란 감자밭을 일궜지만, 아무도 관심이 없었다.","fx":[{"w":"fields","r":"field","at":15,"t":"부정관사와 단수명사","m":"a 뒤에는 단수명사 field 사용"}]},{"n":8,"en":"The king did not give up, and he came up with a idea.","ko":"왕은 포기하지 않았고, 한 가지 아이디어를 생각해 냈다.","fx":[{"w":"a","r":"an","at":11,"t":"관사 a/an","m":"모음 소리 idea 앞에는 an 사용"}]},{"n":10,"en":"This made people curiously, and some even tried to steal potatoes at night.","ko":"이것은 사람들에게 호기심을 유발했고, 몇몇 사람들은 심지어 밤에 감자를 훔치려고 했다.","fx":[{"w":"curiously","r":"curious","at":3,"t":"형용사와 부사","m":"make+목적어 뒤 보어는 형용사 curious 사용"}]},{"n":12,"en":"When potatoes was first introduced in France, French people did not like they as well.","ko":"감자가 처음 프랑스에 들어왔을 때 프 var book=(location.hash||'#m1').replace('#','')==='m2'?'m2':'m1',cur=null,marks=[],lastIds=[];
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tabs(){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.b===book)});
 $('grid').innerHTML=DATA[book].map(function(p,i){return '<button class="lb" data-i="'+i+'"><b>'+p.no+'</b><span>'+esc(p.t)+'</span></button>'}).join('')}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){book=b.dataset.b;history.replaceState(null,'','#'+book);tabs()}});
$('grid').onclick=function(e){var b=e.target.closest('.lb');if(!b)return;start(+b.dataset.i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(i){cur=i;lastIds=[];$('pick').classList.add('hide');$('test').classList.remove('hide');$('sub').classList.add('hide');draw()}
function draw(){
 var p=DATA[book][cur];$('ttl').textContent=book.toUpperCase()+' · '+p.no+'. '+p.t;
 $('cards').innerHTML='<div class="balls"><div class="ball">?</div><div class="ball">?</div><div class="ball">?</div><div class="ball">?</div><div class="ball">?</div></div>';
 $('pen').classList.add('hide');window.scrollTo(0,0);
 setTimeout(function(){
  var pool=p.q.filter(function(q){return lastIds.indexOf(q.n)<0});
  if(pool.length<5){pool=p.q.slice();lastIds=[]}
  var pick=shuffle(pool).slice(0,5).sort(function(a,b){return a.n-b.n});
  lastIds=lastIds.concat(pick.map(function(q){return q.n}));
  marks=pick.map(function(){return 0});show(pick);
 },1200)}
function show(pick){
 $('cards').innerHTML=pick.map(function(q,k){
  var tk=q.en.split(/\s+/),bad={};
  q.fx.forEach(function(f){var n=f.w.split(/\s+/).length;for(var j=0;j<n;j++)bad[f.at+j]=1});
  var h=[],i=0;
  while(i<tk.length){if(bad[i]){var s=i;while(bad[i]&&i<tk.length)i++;h.push('<span class="bad">'+esc(tk.slice(s,i).join(' '))+'</span>')}else{h.push(esc(tk[i]));i++}}
  var fx=q.fx.map(function(f){return '<div class="fx"><span class="w">'+esc(f.w)+'</span> → <span class="r">'+esc(f.r)+'</span><span class="tp">'+esc(f.t)+' — '+esc(f.m)+'</span></div>'}).join('');
  return '<div class="q" id="q'+k+'"><div class="qh"><span class="qn">문제 '+(k+1)+' <small>(본문 '+q.n+'번)</small></span><div class="mk"><button class="o" data-k="'+k+'" data-v="1">○ 맞힘</button><button class="x" data-k="'+k+'" data-v="2">✕ 틀림</button></div></div><div class="en">'+h.join(' ')+'</div><div class="ko">'+esc(q.ko)+'</div><div class="ans">'+fx+'</div></div>'}).join('');
 $('pen').classList.remove('hide');upd()}
$('cards').onclick=function(e){var b=e.target.closest('.mk button');if(!b)return;var k=+b.dataset.k,v=+b.dataset.v;marks[k]=marks[k]===v?0:v;upd()};
function upd(){
 var n=marks.length,bad=marks.filter(function(m){return m===2}).length,ok=marks.filter(function(m){return m===1}).length;
 marks.forEach(function(m,k){var q=$('q'+k);q.classList.toggle('ok',m===1);q.classList.toggle('ng',m===2);q.querySelector('.o').classList.toggle('on',m===1);q.querySelector('.x').classList.toggle('on',m===2)});
 $('cnt').textContent='틀림 '+bad+'개 · 맞힘 '+ok+'개';
 var r=$('res'),msg,cls;
 if(ok+bad<n){msg='채점 중…';cls='p0';r.style.opacity='.55'}else{r.style.opacity='1';
  if(bad<=2){msg='통과 🎉';cls='p0'}else if(bad===3){msg='5문장 쓰기';cls='p3'}else if(bad===4){msg='10문장 쓰기';cls='p4'}else{msg='15문장 쓰기';cls='p5'}}
 if(ok+bad<n&&bad>=3){msg='지금 '+(bad===3?'5':bad===4?'10':'15')+'문장 쓰기';cls=bad===3?'p3':bad===4?'p4':'p5';r.style.opacity='1'}
 r.textContent=msg;r.className='res '+cls}
$('redraw').onclick=draw;
