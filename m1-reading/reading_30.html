EN=["Save Coral Reefs","Welcome to the 'Save Coral Reefs' festival. It is for Boram Middle School's Earth Day event. Join the festival and learn about coral reefs.","Coral Reefs Are in Danger!","In the movie Finding Nemo, Nemo lives on beautiful coral reefs. They are home to many sea animals.","Coral reefs are in danger. Climate change is warming up the sea. The sea water is also getting dirty. Coral reefs are dying, but our small actions can save them.","Small Actions for Coral Reefs","Say \"No\" to Plastics","Don't use plastic bags or plastic straws.","Save Energy","We can slow down climate change.","Choose Sunscreens Carefully","Some sunscreens are dangerous to coral reefs."];var PASS_KO=["산호초를 구해 주세요","'산호초를 구해 주세요' 축제에 오신 것을 환영합니다. 그것은 보람 중학교의 지구의 날 행사입니다. 축제에 참여하고 산호초에 대해 배우세요.","산호초가 위험에 처했어요!","영화 「니모를 찾아서」에서, 니모는 아름다운 산호초에서 삽니다. 그들은 많은 바다 동물들의 서식지입니다.","산호초가 위험에 처해 있습니다. 기후 변화가 바다를 따뜻하게 하고 있습니다. 바닷물 또한 더러워지고 있습니다. 산호초가 죽어 가고 있지만, 우리의 작은 행동들이 그들을 구할 수 있습니다.","산호초를 위한 작은 행동들","플라스틱에 \"아니오\"라고 말하세요","비닐봉지나 플라스틱 빨대를 사용하지 마세요.","에너지를 절약하세요","우리는 기후 변화를 늦출 수 있습니다.","자외선 차단제를 신중하게 고르세요","일부 자외선 차단제는 산호초에 위험합니다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["환경 보호를 위한 온라인 캠페인","가방 제작 시 재료 선택의 중요성","바다 동물들의 다양한 먹이와 서식처","바다 동물 보호를 위한 플라스틱 사용 줄이기","플라스틱 재활용이 환경에 미치는 긍정적 영향"],"a":3,"ans":"바다 동물 보호를 위한 플라스틱 사용 줄이기","evs":[["Save the sea animals! They're dying.","바다 동물들을 구해 주세요! 그들이 죽어 가고 있어요."],["No, it's a plastic bag. Sea turtles are dying because of plastic bags.","아니, 비닐봉지야. 바다거북은 비닐봉지 때문에 죽어 가고 있어."],["Oh, no. We should not use plastic bags.","오, 안 돼. 우리는 비닐봉지를 사용하면 안 돼."]],"ev":["Save the sea animals! They're dying.","바다 동물들을 구해 주세요! 그들이 죽어 가고 있어요."],"ow":["오답 ✕ — Junho가 온라인에 올리겠다고 하지만('I'll post your campaign information online, too!' 너희 캠페인 정보를 온라인에도 올릴게!) 이는 마지막에 나오는 작은 부분이다. 대화의 중심은 플라스틱 사용을 줄이자는 것이다.","오답 ✕ — 'We should use cloth bags.'(우리는 천 가방을 써야 해.)는 비닐봉지 대신 쓸 것을 말한 것일 뿐, 가방 제작 재료 선택의 중요성을 이야기하는 대화는 아니다.","오답 ✕ — 대화에서 바다 동물의 먹이나 서식처는 이야기하지 않는다. 거북이가 먹는 것은 비닐봉지('it's a plastic bag')라는 점만 나온다.","정답 ○ — 'Save the sea animals! They're dying.'(바다 동물들을 구해 주세요!)과 'Sea turtles are dying because of plastic bags.'(바다거북은 비닐봉지 때문에 죽어 가고 있어.), 'We should not use plastic bags.'(우리는 비닐봉지를 사용하면 안 돼.)에서 바다 동물을 위해 플라스틱을 줄이자는 주제를 알 수 있다.","오답 ✕ — 재활용의 긍정적 영향은 이야기하지 않는다. 대화는 플라스틱을 쓰지 말자는 내용이다."],"memo":["주제: 바다 동물 보호를 위한 플라스틱 사용 줄이기","근거: Sea turtles are dying because of plastic bags.(바다거북은 비닐봉지 때문에 죽어 가고 있어.)","함정: 온라인 홍보(①)와 천 가방(②)은 일부 내용일 뿐이다."],"why":"바다 동물을 지키려고 비닐봉지·빨대 같은 플라스틱을 줄이자는 대화."},{"n":2,"q":"위 대화의 내용과 일치하는 것은?","o":["Sea animals are safe these days.","There is a jellyfish in the picture.","Cloth bags are dangerous to sea turtles.","Junho will use a plastic bag from now on.","Junho will post about the campaign online."],"a":4,"ans":"Junho will post about the campaign online.","evs":[["Okay. From now on, I won't. I'll post your campaign information online, too!","좋아. 지금부터 나는 안 쓸게. 너희 캠페인 정보를 온라인에도 올릴게!"]],"ev":["Okay. From now on, I won't. I'll post your campaign information online, too!","좋아. 지금부터 나는 안 쓸게. 너희 캠페인 정보를 온라인에도 올릴게!"],"ow":["오답 ✕ — Alex가 'Save the sea animals! They're dying.'(바다 동물들을 구해 주세요! 그들이 죽어 가고 있어요.)이라고 하므로 바다 동물들은 안전하지 않다.","오답 ✕ — Junho가 해파리냐고 묻지만 Kate가 'No, it's a plastic bag.'(아니, 비닐봉지야.)이라고 답한다. 사진 속 물건은 해파리가 아니다.","오답 ✕ — 천 가방은 위험한 것이 아니라 Alex가 'We should use cloth bags.'(우리는 천 가방을 써야 해.)라며 권하는 것이다. 위험한 것은 비닐봉지이다.","오답 ✕ — Junho는 'From now on, I won't.'(지금부터 나는 안 쓸게.)라고 했으므로 앞으로 비닐봉지를 쓰지 않는다.","정답 ○ — Junho가 'I'll post your campaign information online, too!'(너희 캠페인 정보를 온라인에도 올릴게!)라고 말하므로 온라인에 캠페인을 알리는 글을 올릴 것이다."],"memo":["Junho는 캠페인을 온라인에 올릴 것이다.","근거: I'll post your campaign information online, too!(너희 캠페인 정보를 온라인에도 올릴게!)","함정: 사진 속 거북이가 먹는 것은 해파리가 아니라 비닐봉지이다."],"why":"Junho가 캠페인 정보를 온라인에 올리겠다고 했다."}],"dlg":[["Kate","Everyone, join our campaign!","여러분, 우리 캠페인에 참여하세요!"],["Alex","Save the sea animals! They're dying.","바다 동물들을 구해 주세요! 그들이 죽어 가고 있어요."],["Junho","Kate, Alex! Hi!","Kate, Alex! 안녕!"],["Kate","Hi, Junho! Come and join our campaign.","안녕, Junho! 와서 우리 캠페인에 참여해."],["Alex","Look at the sea turtle in the picture.","사진 속 바다거북을 봐."],["Junho","Okay. What is the turtle eating? Is that a jellyfish?","응. 그 거북이는 뭘 먹고 있는 거야? 저거 해파리야?"],["Kate","No, it's a plastic bag. Sea turtles are dying because of plastic bags.","아니, 비닐봉지야. 바다거북은 비닐봉지 때문에 죽어 가고 있어."],["Junho","Oh, no. We should not use plastic bags.","오, 안 돼. 우리는 비닐봉지를 사용하면 안 돼."],["Alex","You're right. We should use cloth bags.","네 말이 맞아. 우리는 천 가방을 써야 해."],["Kate","Also, we should not use plastic straws.","또한 우리는 플라스틱 빨대도 쓰면 안 돼."],["Junho","Okay. From now on, I won't. I'll post your campaign information online, too!","좋아. 지금부터 나는 안 쓸게. 너희 캠페인 정보를 온라인에도 올릴게!"],["Alex","That's a good idea. Thank you, Junho.","좋은 생각이야. 고마워, Junho."]]},{"qs":[{"n":3,"q":"윗글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["turn on - waste","clean - drink","turn off - save","turn off - waste","turn on - save"],"a":2,"ans":"turn off - save","evs":[["Mia, can you turn off the water, please? We should save water.","Mia, 물 좀 잠가 줄래? 우리는 물을 아껴야 해."],["Let's brush our teeth with just one cup of water.","컵 한 잔의 물만으로 양치질을 하자."]],"ev":["Mia, can you turn off the water, please? We should save water.","Mia, 물 좀 잠가 줄래? 우리는 물을 아껴야 해."],"ow":["오답 ✕ — 남자는 물을 켜 달라고 한 것이 아니라 'can you turn off the water'(물 좀 잠가 줄래?)라고 했고, 물을 낭비하자는 말도 하지 않았다.","오답 ✕ — clean(청소하다)이나 drink(마시다)는 대화에 나오지 않는다. 남자는 물을 '잠가 달라'고 하며 'We should save water.'(우리는 물을 아껴야 해.)라고 했다.","정답 ○ — 'Mia, can you turn off the water, please? We should save water.'(Mia, 물 좀 잠가 줄래? 우리는 물을 아껴야 해.)에서 (A)는 turn off, (B)는 save이다.","오답 ✕ — turn off는 맞지만 'We should save water.'라고 했으므로 waste(낭비하다)는 반대 뜻이다.","오답 ✕ — save는 맞지만 남자는 물을 잠가 달라고 했으므로 turn on(켜다)은 틀리다."],"memo":["(A) turn off, (B) save","근거: Mia, can you turn off the water, please? We should save water.(Mia, 물 좀 잠가 줄래? 우리는 물을 아껴야 해.)","함정: 'turn on'과 'waste'는 대화와 반대 뜻이다."],"why":"물을 아끼려고 물을 잠가 달라고 한 대화.","sum":"The man asks Mia to (A) the water because they should (B) water.","lab":"완성된 요약문 : "}],"dlg":[["M","Mia, can you turn off the water, please? We should save water.","Mia, 물 좀 잠가 줄래? 우리는 물을 아껴야 해."],["G","Oh, you're right.","아, 네 말이 맞아요."],["M","Let's brush our teeth with just one cup of water.","컵 한 잔의 물만으로 양치질을 하자."],["G","That's a good idea.","좋은 생각이에요."]]},{"qs":[{"n":4,"q":"What should the boy and the girl recycle?","o":["paper","the trash","food waste","glass bottles","plastic bottles"],"a":4,"ans":"plastic bottles","evs":[["Wait! We should recycle those plastic bottles.","잠깐! 우리는 저 플라스틱 병들을 재활용해야 해."]],"ev":["Wait! We should recycle those plastic bottles.","잠깐! 우리는 저 플라스틱 병들을 재활용해야 해."],"ow":["오답 ✕ — 대화에 종이(paper)를 재활용하자는 말은 없다. 가장 가까운 문장은 'We should recycle those plastic bottles.'(우리는 저 플라스틱 병들을 재활용해야 해.)이다.","오답 ✕ — 'I'll take out the trash.'(내가 쓰레기를 내다 버릴게.)는 쓰레기를 버리겠다는 말이지 재활용하자는 말이 아니다.","오답 ✕ — 음식물 쓰레기(food waste)에 대한 언급은 없다. 재활용하자고 한 것은 'those plastic bottles'이다.","오답 ✕ — 유리병(glass bottles)이 아니라 'plastic bottles'(플라스틱 병)를 재활용하자고 했다.","정답 ○ — 남자아이가 'Wait! We should recycle those plastic bottles.'(잠깐! 우리는 저 플라스틱 병들을 재활용해야 해.)라고 말한다."],"memo":["재활용할 것은 플라스틱 병(plastic bottles)이다.","근거: Wait! We should recycle those plastic bottles.(잠깐! 우리는 저 플라스틱 병들을 재활용해야 해.)","함정: 쓰레기(trash)는 버리는 것이고 재활용할 대상은 플라스틱 병이다."],"why":"재활용해야 할 것은 플라스틱 병이다."}],"dlg":[["B","All right. Let's clean up the house.","좋아. 집을 청소하자."],["G","That's a good idea. I'll take out the trash.","좋은 생각이야. 내가 쓰레기를 내다 버릴게."],["B","Wait! We should recycle those plastic bottles.","잠깐! 우리는 저 플라스틱 병들을 재활용해야 해."],["G","Oh, okay.","아, 알겠어."]]},{"qs":[{"n":5,"q":"What does David's mom ask him to do?","o":["Get his backpack","Clean the living room","Turn off the lights in the living room","Take out the trash","Recycle plastic bottles"],"a":2,"ans":"Turn off the lights in the living room","evs":[["Oh, can you turn off the lights in the living room?","아, 거실 불 좀 꺼 줄래?"],["Good idea, Mom. We should save energy.","좋은 생각이에요, 엄마. 우리는 에너지를 아껴야 해요."]],"ev":["Oh, can you turn off the lights in the living room?","아, 거실 불 좀 꺼 줄래?"],"ow":["오답 ✕ — 'I'll get my backpack and we can go.'(가방을 챙기면 갈 수 있어요.)는 David가 스스로 하겠다고 한 말이지 엄마가 부탁한 일이 아니다.","오답 ✕ — 엄마는 'turn off the lights in the living room'(거실 불 끄기)을 부탁했을 뿐, 거실을 청소하라고는 하지 않았다.","정답 ○ — 엄마가 'Oh, can you turn off the lights in the living room?'(아, 거실 불 좀 꺼 줄래?)라고 말한다. David도 'We should save energy.'(우리는 에너지를 아껴야 해요.)라고 답한다.","오답 ✕ — 쓰레기를 내다 버리는 이야기는 이 대화에 없다.","오답 ✕ — 플라스틱 병 재활용은 이 대화가 아니라 다른 대화의 내용이다. 이 대화에는 언급이 없다."],"memo":["엄마는 David에게 거실 불을 꺼 달라고 했다.","근거: Oh, can you turn off the lights in the living room?(아, 거실 불 좀 꺼 줄래?)","함정: 가방을 챙기는 것은 David가 스스로 말한 일이다."],"why":"엄마가 거실 불을 꺼 달라고 부탁했다."}],"dlg":[["W","David, are you ready to go?","David, 갈 준비 됐니?"],["B","I'll get my backpack and we can go.","가방을 챙기면 갈 수 있어요."],["W","Oh, can you turn off the lights in the living room?","아, 거실 불 좀 꺼 줄래?"],["B","Good idea, Mom. We should save energy.","좋은 생각이에요, 엄마. 우리는 에너지를 아껴야 해요."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Boram Middle School has a festival for Earth Day.","In the movie, Nemo's home is the coral reefs.","Coral reefs are facing danger these days.","Coral reefs are not safe from climate change.","The sea water is getting clean now."],"a":4,"ans":"The sea water is getting clean now.","evs":[["The sea water is also getting dirty.","바닷물 또한 더러워지고 있습니다."]],"ev":["The sea water is also getting dirty.","바닷물 또한 더러워지고 있습니다."],"ow":["오답 ✕ — 'It is for Boram Middle School's Earth Day event.'(그것은 보람 중학교의 지구의 날 행사입니다.)이므로 일치한다.","오답 ✕ — 'Nemo lives on beautiful coral reefs.'(니모는 아름다운 산호초에서 삽니다.)이므로 산호초가 니모의 집이다. 일치한다.","오답 ✕ — 'Coral reefs are in danger.'(산호초가 위험에 처해 있습니다.)이므로 일치한다.","오답 ✕ — 'Climate change is warming up the sea.'(기후 변화가 바다를 따뜻하게 하고 있습니다.)이므로 기후 변화로부터 안전하지 않다. 일치한다.","정답 ○ — 'The sea water is also getting dirty.'(바닷물 또한 더러워지고 있습니다.)라고 했으므로 깨끗해지고 있다는 말은 일치하지 않는다."],"memo":["바닷물은 깨끗해지는 중이 아니라 더러워지고 있다.","근거: The sea   var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}

var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}

 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}

function partHtml(p){

 });

 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';

function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';

  else if(pick[q.n]===i)cls+=' on';

 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'

 }

function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';

  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }

function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';

function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}

var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
