 걱정되시나요? 그것을 지우고 싶으신가요? 그렇다면 '행복한 디지털 세탁소'를 방문하세요. 저희가 당신의 온라인 기록을 지울 수 있습니다. 저희 웹사이트에 메시지를 남기시면 저희가 곧 당신을 도와드리겠습니다.","remove_all_plz","안녕하세요, 저는 Bella입니다. 지난 금요일에 저는 제 남동생이 방과 후에 농구하고 있는 것을 봤어요. 그가 정말 잘하고 있어서 저는 그의 사진을 찍었어요. 그다음에 저는 제 소셜 미디어에 그것을 공유했어요. 주말 동안 뭔가 잘못되었어요. 누군가가 그 사진을 복사하고 나쁜 글을 썼어요. 그 복사본은 여기저기 퍼졌고, 저는 매우 당황했어요. 제 남동생은 제가 그의 사진을 삭제하기를 원했어요. 저는 그에게 사과했고, 즉시 제 게시물을 삭제했어요. 하지만 그 복사본들은 여전히 온라인에 남아 있어요. 저는 그것들을 모두 없애고 싶어요. 제발 저를 도와주세요.","Happy_Digital_Laundry","저희는 온라인의 모든 복사본을 삭제했지만, 일부 복사본이 개인 기기에 남아 있을 수 있습니다. 복사본을 또 보면, 저희에게 연락하세요. 온라인에 뭔가를 공유할 때는 조심하세요. 온라인에 뭔가를 공유하는 것은 쉽지만, 없애는 것은 어렵다는 걸 기억하세요.","no_more","안녕하세요, 저는 지훈입니다. 지난달에 저는 온라인에서 흥미로운 광고를 봤어요. 그것은 제가 새 스마트폰을 공짜로 얻을 수 있다고 했어요. 저는 별생각 없이 그것을 클릭했어요. 그다음 저는 선물을 받기 위해 제 정보를 적었어요. 하지만, 새 스마트폰을 받는 대신, 저는 쓸모없는 이메일과 모르는 번호로부터 전화를 받고 있어요. 아, 이런! 저는 방금 또 제 전화가 울리는 소리를 들었어요. 그것은 저를 매우 화나게 해요. 누군가가 제 정보를 나쁜 방식으로 사용하고 있는 게 확실해요. 제 개인 정보가 공유된 것 같아요. 저는 그것을 삭제하고 싶어요. 제발 저를 도와주시겠어요?","remove_all_plz","Happy_Digital_Laundry","no_more"];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["recipe for boiling sweet potatoes","tips for choosing a good air fryer","the benefits of eating sweet potatoes","the way to clean an air fryer after cooking","how to bake sweet potatoes with an air fryer"],"a":4,"ans":"how to bake sweet potatoes with an air fryer","evs":[["Lily: I'd like to bake sweet potatoes. How do I use the air fryer?","고구마를 굽고 싶어요. 에어프라이어는 어떻게 사용해요?"],["Dad: It's simple. First, put some sweet potatoes in the air fryer.","간단해. 먼저, 고구마를 에어프라이어에 넣으렴."]],"ev":["Lily: I'd like to bake sweet potatoes. How do I use the air fryer?","고구마를 굽고 싶어요. 에어프라이어는 어떻게 사용해요?"],"ow":["오답 ✕ — 릴리는 'I'd like to bake sweet potatoes.'(고구마를 굽고 싶어요.)라고 했으므로 고구마를 삶는(boil) 것이 아니라 굽는 것이라서 틀림.","오답 ✕ — 좋은 에어프라이어를 고르는 내용은 없다. 릴리는 'How do I use the air fryer?'(에어프라이어는 어떻게 사용해요?)라고 이미 있는 기계의 사용법을 물었을 뿐이라서 틀림.","오답 ✕ — 고구마를 먹는 것의 이로운 점은 대화에 나오지 않는다. 'I'd like to bake sweet potatoes.'는 굽고 싶다는 말일 뿐이라서 틀림.","오답 ✕ — 'Don't forget to use oven gloves when you take them out.'(꺼낼 때 오븐 장갑을 쓰는 것을 잊지 마렴.)은 있지만 사용 후 청소하는 방법은 나오지 않아서 틀림.","정답 ○ — 릴리가 'How do I use the air fryer?'(에어프라이어는 어떻게 사용해요?)라고 묻고 아빠가 고구마를 넣고 온도와 시간을 맞추는 순서를 알려 주므로 주제로 알맞음."],"memo":["정답 ⑤: 에어프라이어로 고구마를 굽는 방법","근거: How do I use the air fryer?(에어프라이어는 어떻게 사용해요?)","함정: ① bake(굽다)와 boil(삶다)을 구별하자 ✕"],"why":"아빠가 릴리에게 에어프라이어로 고구마를 굽는 방법을 알려 준다."},{"n":2,"q":"위 대화를 읽고 답할 수 없는 질문은?","o":["Why does Lily want to use the air fryer?","What color is the round button on the air fryer?","How high should Lily set the temperature?","What should Lily press after setting the time?","When does Dad tell Lily to use oven gloves?"],"a":1,"ans":"What color is the round button on the air fryer?","evs":[["Dad: Then, turn the round button to set the temperature to 200℃.","그러고 나서, 동그란 버튼을 돌려서 온도를 200℃로 맞추렴."],["Dad: Lastly, set the time to 20 minutes and press the start button.","마지막으로, 시간을 20분으로 맞추고 시작 버튼을 눌러."],["Dad: Right. Don't forget to use oven gloves when you take them out.","맞아. 꺼낼 때 오븐 장갑을 쓰는 것을 잊지 마렴."]],"ev":["Dad: Then, turn the round button to set the temperature to 200℃.","그러고 나서, 동그란 버튼을 돌려서 온도를 200℃로 맞추렴."],"ow":["오답 ✕ — 답할 수 있는 질문이다. 릴리가 'I'd like to bake sweet potatoes.'(고구마를 굽고 싶어요.)라고 했다. 답할 수 없는 질문을 고르는 문제의 답이 아님.","정답 ○ — 아빠는 'turn the round button'(동그란 버튼을 돌려라)이라고만 했을 뿐 버튼의 색깔은 말하지 않아서 답할 수 없음.","오답 ✕ — 답할 수 있는 질문이다. 'set the temperature to 200℃'(온도를 200℃로 맞추렴)라고 했다. 답할 수 없는 질문을 고르는 문제의 답이 아님.","오답 ✕ — 답할 수 있는 질문이다. 'set the time to 20 minutes and press the start button'(시간을 20분으로 맞추고 시작 버튼을 눌러)이라고 했으므로 시작 버튼을 누른다.","오답 ✕ — 답할 수 있는 질문이다. 'Don't forget to use oven gloves when you take them out.'(꺼낼 때 오븐 장갑을 쓰는 것을 잊지 마렴.)라고 했으므로 꺼낼 때이다."],"memo":["정답 ②: 에어프라이어의 동그란 버튼은 무슨 색인가? (대화에 없음)","근거: turn the round button(동그란 버튼을 돌려라) — 모양만 나오고 색은 없다.","함정: 200℃, 20분, 시작 버튼, 오븐 장갑은 모두 대화에 나온다."],"why":"동그란 버튼의 색깔은 대화에 나오지 않는다."}],"dlg":[["Lily","Dad, I want to use the air fryer.","아빠, 저 에어프라이어를 쓰고 싶어요."],["Dad","The air fryer? What do you want to do with it, Lily?","에어프라이어? 그걸로 뭘 하고 싶니, 릴리?"],["Lily","I'd like to bake sweet potatoes. How do I use the air fryer?","고구마를 굽고 싶어요. 에어프라이어는 어떻게 사용해요?"],["Dad","It's simple. First, put some sweet potatoes in the air fryer.","간단해. 먼저, 고구마를 에어프라이어에 넣으렴."],["Lily","Okay, I did. What's next?","네, 넣었어요. 다음은요?"],["Dad","Then, turn the round button to set the temperature to 200℃.","그러고 나서, 동그란 버튼을 돌려서 온도를 200℃로 맞추렴."],["Lily","200℃, anything else?","200℃요, 또 있나요?"],["Dad","Lastly, set the time to 20 minutes and press the start button.","마지막으로, 시간을 20분으로 맞추고 시작 버튼을 눌러."],["Lily","Oh, it's easy.","아, 쉽네요."],["Dad","Right. Don't forget to use oven gloves when you take them out.","맞아. 꺼낼 때 오븐 장갑을 쓰는 것을 잊지 마렴."],["Lily","I see. Thanks, Dad.","알겠어요. 고마워요, 아빠."]]},{"qs":[{"n":3,"q":"위 담화에 언급된 MuzSearch의 사용 방법으로 알맞지 않은 것은?","o":["앱을 연다.","검색 아이콘을 터치한다.","마이크 아이콘을 누르고 잠시 기다린다.","화면에 입력 창이 뜨면 곡의 가사를 입력한다.","노래 제목을 확인하고 마음에 드는 곡은 하트 아이콘을 눌러 저장한다."],"a":3,"ans":"화면에 입력 창이 뜨면 곡의 가사를 입력한다.","evs":[["G: First, open the MuzSearch app and touch the search icon.","먼저, 뮤즈서치 앱을 열고 검색 아이콘을 터치하세요."],["G: Second, press the microphone icon and wait for a while.","두 번째로, 마이크 아이콘을 누르고 잠시 기다리세요."],["G: Then the app will show the title on the screen.","그러면 앱이 화면에 제목을 보여 줄 거예요."]],"ev":["G: First, open the MuzSearch app and touch the search icon.","먼저, 뮤즈서치 앱을 열고 검색 아이콘을 터치하세요."],"ow":["오답 ✕ — 이 보기는 알맞은 사용 방법이다. 'First, open the MuzSearch app'(먼저, 뮤즈서치 앱을 열고)이라고 했다. 알맞지 않은 것을 고르는 문제의 답이 아님.","오답 ✕ — 이 보기는 알맞은 사용 방법이다. 'touch the search icon'(검색 아이콘을 터치하세요)이라고 했다. 알맞지 않은 것을 고르는 문제의 답이 아님.","오답 ✕ — 이 보기는 알맞은 사용 방법이다. 'press the microphone icon and wait for a while'(마이크 아이콘을 누르고 잠시 기다리세요)이라고 했다.","정답 ○ — 마이크 아이콘을 누르고 기다리면 'the app will show the title on the screen'(앱이 화면에 제목을 보여 줄 거예요)이다. 입력 창에 가사를 입력하라는 말은 없으므로 알맞지 않은 방법임.","오답 ✕ — 이 보기는 알맞은 사용 방법이다. 'If you like the song, don't forget to press the heart icon.'(마음에 들면 하트 아이콘 누르는 것을 잊지 마세요.)와 'The song will be saved to your favorites.'(즐겨찾기에 저장됩니다.)라고 했다."],"memo":["정답 ④: 가사를 입력한다는 말은 없다. (마이크로 노래를 들려준다)","근거: Second, press the microphone icon and wait for a while.(마이크 아이콘을 누르고 잠시 기다리세요.)","함정: 앱은 가사 입력이 아니라 마이크로 들은 노래의 제목을 보여 준다. ✕"],"why":"MuzSearch는 마이크 아이콘으로 노래를 듣고 제목을 알려 주는 앱이다."}],"dlg":[["G","Hello. Today, I'll introduce a special app, MuzSearch.","안녕하세요. 오늘은 특별한 앱, 뮤즈서치를 소개할게요."],["G","When you want to know the title of a song, this app will help you.","노래 제목을 알고 싶을 때, 이 앱이 도움이 될 거예요."],["G","It's simple to use.","사용법은 간단해요."],["G","First, open the MuzSearch app and touch the search icon.","먼저, 뮤즈서치 앱을 열고 검색 아이콘을 터치하세요."],["G","Second, press the microphone icon and wait for a while.","두 번째로, 마이크 아이콘을 누르고 잠시 기다리세요."],["G","Then the app will show the title on the screen.","그러면 앱이 화면에 제목을 보여 줄 거예요."],["G","If you like the song, don't forget to press the heart icon.","그 노래가 마음에 들면, 하트 아이콘 누르는 것을 잊지 마세요."],["G","The song will be saved to your favorites.","그 노래는 즐겨찾기에 저장될 거예요."],["G","Try it now!","지금 한번 해 보세요!"]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["남자는 먼저 음료를 고르고 그다음에 햄버거를 고른다.","남자는 치즈버거를 주문한다.","여자는 감자튀김과 오렌지 주스를 주문한다.","남자는 직원에게 직접 돈을 낸다.","여자는 남자에게 도움을 주지 않는다."],"a":1,"ans":"남자는 치즈버거를 주문한다.","evs":[["M: Hmm. I want to have a cheeseburger.","음. 저는 치즈버거를 먹고 싶어요."],["W: Second, choose your side dish and drink. What do you want?","두 번째로, 사이드 메뉴와 음료를 고르세요. 무엇을 드시겠어요?"],["W: Then, pay on the next page. That's all.","그다음에는 다음 페이지에서 결제하세요. 그게 다예요."]],"ev":["M: Hmm. I want to have a cheeseburger.","음. 저는 치즈버거를 먹고 싶어요."],"ow":["오답 ✕ — 여자는 'First, select your hamburger on the screen.'(먼저, 화면에서 햄버거를 선택하세요.)라고 했으므로 햄버거를 먼저 고르고, 'Second, choose your side dish and drink.'(두 번째로 사이드 메뉴와 음료를 고르세요.)이므로 순서가 반대라서 틀림.","정답 ○ — 남자가 'I want to have a cheeseburger.'(저는 치즈버거를 먹고 싶어요.)라고 했으므로 맞음.","오답 ✕ — 'I want to have French fries and orange juice.'(감자튀김과 오렌지 주스를 먹고 싶어요.)라고 한 사람은 여자가 아니라 남자라서 틀림.","오답 ✕ — 여자가 'pay on the next page'(다음 페이지에서 결제하세요)라고 했으므로 기계 화면에서 결제한다. 직원에게 직접 내는 것이 아니라서 틀림.","오답 ✕ — 여자는 'Of course.'(물론이죠.)라고 하며 주문 방법을 차례대로 알려 주었으므로 도움을 준다. 틀림."],"memo":["정답 ②: 남자는 치즈버거를 주문한다.","근거: I want to have a cheeseburger.(저는 치즈버거를 먹고 싶어요.)","함정: 순서는 햄버거(First) → 사이드와 음료(Second) → 결제(Then)이다."],"why":"남자는 기계로 치즈버거, 감자튀김, 오렌지 주스를 주문한다."}],"dlg":[["M","Excuse me, I want to order with this machine. Can you help me, please?","실례합니다, 이 기계로 주문하고 싶어요. 저를 도와주실 수 있나요?"],["W","Of course. First, select your hamburger on the screen.","물론이죠. 먼저, 화면에서 햄버거를 선택하세요."],["M","Hmm. I want to have a cheeseburger.","음. 저는 치즈버거를 먹고 싶어요."],["W","Second, choose your side dish and drink. What do you want?","두 번째로, 사이드 메뉴와 음료를 고르세요. 무엇을 드시겠어요?"],["M","I want to have French fries and orange juice.","저는 감자튀김과 오렌지 주스를 먹고 싶어요."],["W","Then, pay on the next page. That's all.","그다음에는 다음 페이지에서 결제하세요. 그게 다예요."],["M","Okay, I got it. Thanks.","네, 알겠어요. 감사합니다."],["W","You're welcome.","천만에요."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["두 사람은 270번 버스를 타야 한다.","박물관까지는 약 3시간이 걸린다.","정류장에는 버스가 한 대만 선다.","소년은 버스 카드를 이미 잃어버렸다.","정류장 이름은 국립박물관이다."],"a":0,"ans":"두 사람은 270번 버스를 타야 한다.","evs":[["W: We should take bus number 270.","270번 버스를 타야 해."],["W: It'll take about 30 minutes.","약 30분 걸릴 거야."]],"ev":["W: We should take bus number 270.","270번 버스를 타야 해."],"ow":["정답 ○ — 엄마가 'We should take bus number 270.'(270번 버스를 타야 해.)라고 했으므로 맞음.","오답 ✕ — 엄마는 'It'll take about 30 minutes.'(약 30분 걸릴 거야.)라고 했는데, 이 보기는 3시간이라서 틀림.","오답 ✕ — 소년이 'many buses stop here'(여기에 버스가 많이 서요)라고 했는데, 이 보기는 한 대만 선다고 해서 틀림.","오답 ✕ — 엄마가 'don't forget to prepare your bus card'(버스 카드를 준비하는 것 잊지 마)라고 했을 뿐, 소년이 카드를 잃어버렸다는 말은 없어서 틀림.","오답 ✕ — 소년이 'The name of the stop is National Science Museum'(정류장 이름이 국립과학관)이라고 했는데, 이 보기는 국립박물관이라서 틀림."],"memo":["정답 ①: 두 사람은 270번 버스를 타야 한다.","근거: We should take bus number 270.(270번 버스를 타야 해.)","함정: 30분(30 minutes)을 3시간으로 바꾼 ② ✕"],"why":"두 사람은 270번 버스를 타고 약 30분 뒤 국립과학관 정류장에 간다."}],"dlg":[["B","Mom, many buses stop here.","엄마, 여기에 버스가 많이 서요."],["W","That's true. We should be careful not to take the wrong bus.","맞아. 버스를 잘못 타지 않도록 조심해 sold - copy","erased - comment","bought - gift"],"a":0,"ans":"shared - copy","evs":[["Then I shared it on my social media.","그다음에 저는 제 소셜 미디어에 그것을 공유했어요."],["Someone made a copy of the picture with bad comments.","누군가가 그 사진을 복사하고 나쁜 글을 썼어요."]],"ev":["Then I shared it on my social media.","그다음에 저는 제 소셜 미디어에 그것을 공유했어요."],"ow":["정답 ○ — 'I shared it on my social media.'(제 소셜 미디어에 공유했어요.)이므로 (A)는 shared, 'Someone made a copy of the picture'(누군가가 그 사진을 복사했어요)이므로 (B)는 copy가 맞음.","오답 ✕ — (A) shared는 맞지만, 누군가 만든 것은 선물(gift)이 아니라 'a copy of the picture'(사진의 복사본)라서 (B)가 틀림.","오답 ✕ — (B) copy는 맞지만, 사진을 판(sold) 것이 아니라 'I shared it on my social media'(소셜 미디어에 공유했다)이므로 (A)가 틀림.","오답 ✕ — Bella가 사진을 지운(erased) 것은 복사본이 퍼진 뒤('I deleted my post immediately')이고, 누군가 만든 것은 댓글이 아니라 'a copy'(복사본)라서 둘 다 틀림.","오답 ✕ — 사진을 산(bought) 것이 아니라 'I took a picture of him'(그의 사진을 찍었다)이고 공유했으며, 누군가 만든 것도 선물이 아니라서 둘 다 틀림."],"memo":["정답 ①: shared - copy","근거: Then I shared it on my social media.(제 소셜 미디어에 그것을 공유했어요.)","함정: 게시물을 지운(delete) 것은 복사본이 퍼진 '뒤'의 일이다. ④ ✕"],"why":"Bella가 남동생의 사진을 공유하자 누군가 그 사진을 복사했다.","sum":"Bella (A)______ her brother's picture on her social media, and someone made a (B)______ of it with bad comments.","lab":"완성된 요약문 : "},{"n":8,"q":"윗글의 내용과 일치하지 않는 것은?","o":["'행복한 디지털 세탁소'는 사람들의 온라인 기록을 지우는 것을 돕는다.","Bella는 남동생이 농구하는 모습의 사진을 소셜 미디어에 게시했다.","Bella의 게시물에 누군가가 나쁜 글을 달아 복사본을 퍼뜨렸다.","Bella는 남동생에게 사과했지만, 그녀의 게시물을 즉시 삭제할 수 없었다.","'행복한 디지털 세탁소'는 Bella에게 온라인에 무언가를 공유할 때 조심해야 한다고 조언한다."],"a":3,"ans":"Bella는 남동생에게 사과했지만, 그녀의 게시물을 즉시 삭제할 수 없었다.","evs":[["I apologized to him, and I deleted my post immediately.","저는 그에게 사과했고, 즉시 제 게시물을 삭제했어요."],["However, the copies still remain online.","하지만 그 복사본들은 여전히 온라인에 남아 있어요."]],"ev":["I apologized to him, and I deleted my post immediately.","저는 그에게 사과했고, 즉시 제 게시물을 삭제했어요."],"ow":["오답 ✕ — 이 보기는 일치한다. 'We can clean your online history.'(저희가 당신의 온라인 기록을 지울 수 있습니다.)라고 했다. 불일치 문제의 답이 아님.","오답 ✕ — 이 보기는 일치한다. Bella가 'Then I shared it on my social media.'(그
