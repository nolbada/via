<style>

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Bobby got him name from his grandfather, Bob. Bob was his most good friend.","ko":"Bobby는 할아버지인 Bob을 따라 이름 지어졌다. Bob은 그의 가장 친한 친구였다.","ok":false,"foot":[],"fixes":[{"wrong":"him","right":"his","partial":false,"at":[2],"point":"인칭대명사의 소유격: 명사 name 앞에는 소유격 his 사용","topic":"인칭대명사의 소유격","memo":"명사 name 앞에는 소유격 his 사용"},{"wrong":"most good","right":"best","partial":false,"at":[11],"point":"최상급: good의 최상급은 best 사용","topic":"최상급","memo":"good의 최상급은 best 사용"}]},{"n":2,"tag":null,"en":"Bob was the person who taught Bobby how to walk.","ko":"Bob은 Bobby에게 걷는 법을 가르쳐 준 사람이었다.","ok":true,"foot":[],"fixes":[]},{"n":3,"tag":null,"en":"\"Hold me hands, Bobby,\" Bob said.","ko":"\"내 손을 잡아, Bobby.\" Bob이 말했다.","ok":false,"foot":[],"fixes":[{"wrong":"me","right":"my","partial":false,"at":[1],"point":"인칭대명사의 소유격: 명사 hands 앞에는 소유격 my 사용","topic":"인칭대명사의 소유격","memo":"명사 hands 앞에는 소유격 my 사용"}]},{"n":4,"tag":null,"en":"\"Now one feet, now the other.\"","ko":"\"자, 한 발, 이제 다른 발.\"","ok":false,"foot":[],"fixes":[{"wrong":"feet","right":"foot","partial":false,"at":[2],"point":"불규칙 복수형: one 뒤에는 단수 foot 사용","topic":"불규칙 복수형","memo":"one 뒤에는 단수 foot 사용"}]},{"n":5,"tag":null,"en":"Bob and Bobby often played with old wooden blocks. They slowly piled the blocks one by one to building a tower.","ko":"Bob과 Bobby는 종종 오래된 나무 블록을 가지고 놀았다. 그들은 탑을 만들기 위해 블록을 하나씩 천천히 쌓았다.","ok":false,"foot":[],"fixes":[{"wrong":"building","right":"build","partial":false,"at":[18],"point":"to부정사: 목적 to 뒤는 동사원형: to build","topic":"to부정사","memo":"목적 to 뒤는 동사원형: to build"}]},{"n":6,"tag":null,"en":"\"There is one more blocks to put,\" Bob said.","ko":"\"이제 쌓을 블록이 하나 더 있어.\" Bob이 말했다.","ok":false,"foot":[],"fixes":[{"wrong":"blocks","right":"block","partial":false,"at":[4],"point":"명사의 단수형: one more 뒤에는 단수명사 block 사용","topic":"명사의 단수형","memo":"one more 뒤에는 단수명사 block 사용"}]},{"n":7,"tag":null,"en":"\"And that's the elephant block,\" Bobby said.","ko":"\"그리고 그건 코끼리 블록이에요.\" Bobby가 말했다.","ok":true,"foot":[],"fixes":[]},{"n":8,"tag":null,"en":"Bobby careful put the elephant block on the top. But Bob sneezed, and the tower falled.","ko":"Bobby는 코끼리 블록을 조심스럽게 꼭대기에 놓았다. 그런데 Bob이 재채기를 했고, 탑이 무너졌다.","ok":false,"foot":[],"fixes":[{"wrong":"careful","right":"carefully","partial":false,"at":[1],"point":"형용사와 부사: 동사 put을 꾸미는 부사 carefully 사용","topic":"형용사와 부사","memo":"동사 put을 꾸미는 부사 carefully 사용"},{"wrong":"falled","right":"fell","partial":false,"at":[15],"point":"불규칙 과거형: fall의 과거형은 fell","topic":"불규칙 과거형","memo":"fall의 과거형은 fell"}]},{"n":9,"tag":null,"en":"Bobby laughed and laughed. Bobby said, \"You always sneezes when the elephant block appears.\"","ko":"Bobby는 웃고 또 웃었다. Bobby가 말했다. \"할아버지는 코끼리 블록이 나오면 항상 재채기를 하시네요.\"","ok":false,"foot":[],"fixes":[{"wrong":"sneezes","right":"sneeze","partial":false,"at":[8],"point":"일반동사의 수일치: 주어 You에는 -s 없음: sneeze","topic":"일반동사의 수일치","memo":"주어 You에는 -s 없음: sneeze"}]},{"n":10,"tag":null,"en":"Time passed. One day, Bobby's dad looked very sadly.","ko":"시간이 흘렀다. 어느 날, Bobby의 아빠는 매우 슬퍼 보였다.","ok":false,"foot":[],"fixes":[{"wrong":"sadly","right":"sad","partial":false,"at":[8],"point":"형용사와 부사: look 뒤 보어 자리에는 형용사 sad 사용","topic":"형용사와 부사","memo":"look 뒤 보어 자리에는 형용사 sad 사용"}]},{"n":11,"tag":null,"en":"He told to Bobby, \"Bob fell ill. He is in an hospital which is far from here.\"","ko":"아빠는 Bobby에게 말했다. \"할아버지께서 편찮으셔. 할아버지는 여기서 멀리 떨어진 병원에 계셔.\"","ok":false,"foot":[],"fixes":[{"wrong":"to Bobby","right":"Bobby","partial":false,"at":[2],"point":"4형식 동사 tell: tell 뒤에는 to 없이 사람 목적어 사용","topic":"4형식 동사 tell","memo":"tell 뒤에는 to 없이 사람 목적어 사용"},{"wrong":"an","right":"a","partial":false,"at":[10],"point":"관사 a/an: 자음 소리 hospital 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 hospital 앞에는 a 사용"}]},{"n":12,"tag":null,"en":"\"I want to see him,\" Bobby said.","ko":"\"할아버지를 보고 싶어요.\" Bobby가 말했다.","ok":true,"foot":[],"fixes":[]},{"n":13,"tag":null,"en":"\"You can't, Bobby,\" Mom told him. \"He can't move his arms and legs, and he can't talks.","ko":"\"그럴 수 없어, Bobby.\" 엄마가 그에게 말했다. \"할아버지는 팔과 다리를 못 움직이시고, 말씀도 못하셔.","ok":false,"foot":[],"fixes":[{"wrong":"talks","right":"talk","partial":false,"at":[16],"point":"조동사: can't 뒤에는 동사원형 talk 사용","topic":"조동사","memo":"can't 뒤에는 동사원형 talk 사용"}]},{"n":14,"tag":null,"en":"We'll just have to wait and hope that he will get more better.\"","ko":"우리는 그저 기다리고 할아버지가 회복되시기를 바라야 할 거야.\"","ok":false,"foot":[],"fixes":[{"wrong":"more better","right":"better","partial":false,"at":[11],"point":"비교급: better 자체가 비교급이라 more 불필요","topic":"비교급","memo":"better 자체가 비교급이라 more 불필요"}]},{"n":15,"tag":null,"en":"Bob came back home after a little months. He just lay in bed without talking or moving.","ko":"Bob은 몇 달 후에 집으로 돌아왔다. 그는 말하지도, 움직이지도 않고 침대에 누워만 있었다.","ok":false,"foot":[],"fixes":[{"wrong":"little","right":"few","partial":false,"at":[6],"point":"수량 형용사 few/little: 셀 수 있는 복수명사 앞에는 a few 사용","topic":"수량 형용사 few/little","memo":"셀 수 있는 복수명사 앞에는 a few 사용"}]},{"n":16,"tag":null,"en":"After a while, Bobby came into Bob's room with the blocks.","ko":"얼마 후, Bobby는 블록을 가지고 Bob의 방에 들어왔다.","ok":true,"foot":[],"fixes":[]},{"n":17,"tag":null,"en":"\"Bob, it's time to building a tower!\"","ko":"\"할아버지, 이제 탑을 쌓을 시간이에요!\"","ok":false,"foot":[],"fixes":[{"wrong":"building","right":"build","partial":false,"at":[4],"point":"to부정사: time 뒤 to부정사는 to build 사용","topic":"to부정사","memo":"time 뒤 to부정사는 to build 사용"}]},{"n":18,"tag":null,"en":"Bob's mouth made an small smile. Bobby began to build the tower.","ko":"Bob의 입가에 작은 미소가 떠올랐다. Bobby는 탑을 쌓기 시작했다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[3],"point":"관사 a/an: 자음 소리 small 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 small 앞에는 a 사용"}]},{"n":19,"tag":null,"en":"\"Okay, Bob, now the elephant block.\"","ko":"\"자, 할아버지, 이제 코끼리 블록이에요.\"","ok":true,"foot":[],"fixes":[]},{"n":20,"tag":null,"en":"Suddenly, Bob made a small sounds like sneezing. At that moments, Bobby realized that Bob would recover soon.","ko":"갑자기 Bob이 재채기 같은 작은 소리를 냈다. 그 ob said.","\"And that's the elephant block,\" Bobby said.","Bobby carefully put the elephant block on the top. But Bob sneezed, and the tower fell. Bobby laughed and laughed. Bobby said, \"You always sneeze when the elephant block appears.\"","Time passed. One day, Bobby's dad looked very sad. He told Bobby, \"Bob fell ill. He is in a hospital which is far from here.\"","\"I want to see him,\" Bobby said.","\"You can't, Bobby,\" Mom told him. \"He can't move his arms and legs, and he can't talk. We'll just have to wait and hope that he will get better.\"","Bob came back home after a few months. He just lay in bed without talking or moving. After a while, Bobby came into Bob's room with the blocks.","\"Bob, it's time to build a tower!\"","Bob's mouth made a small smile. Bobby began to build the tower.","\"Okay, Bob, now the elephant block.\"","Suddenly, Bob made a small sound like sneezing. At that moment, Bobby realized that Bob would recover soon. And Bob did. Slowly, Bob began to talk a little and move his fingers. But he still couldn't walk."];var PASS_KO=["자, 한 발, 이제 다른 발","Bobby는 할아버지인 Bob을 따라 이름 지어졌다. Bob은 그의 가장 친한 친구였다. Bob은 Bobby에게 걷는 법을 가르쳐 준 사람이었다.","\"내 손을 잡아, Bobby.\" Bob이 말했다.","\"자, 한 발, 이제 다른 발.\"","Bob과 Bobby는 종종 오래된 나무 블록을 가지고 놀았다. 그들은 탑을 만들기 위해 블록을 하나씩 천천히 쌓았다.","\"이제 쌓을 블록이 하나 더 있어.\" Bob이 말했다.","\"그리고 그건 코끼리 블록이에요.\" Bobby가 말했다.","Bobby는 코끼리 블록을 조심스럽게 꼭대기에 놓았다. 그런데 Bob이 재채기를 했고, 탑이 무너졌다. Bobby는 웃고 또 웃었다. Bobby가 말했다. \"할아버지는 코끼리 블록이 나오면 항상 재채기를 하시네요.\"","시간이 흘렀다. 어느 날, Bobby의 아빠는 매우 슬퍼 보였다. 아빠는 Bobby에게 말했다. \"할아버지께서 편찮으셔. 할아버지는 여기서 멀리 떨어진 병원에 계셔.\"","\"할아버지를 보고 싶어요.\" Bobby가 말했다.","\"그럴 수 없어, Bobby.\" 엄마가 그에게 말했다. \"할아버지는 팔과 다리를 못 움직이시고, 말씀도 못하셔. 우리는 그저 기다리고 할아버지가 회복되시기를 바라야 할 거야.\"","Bob은 몇 달 후에 집으로 돌아왔다. 그는 말하지도, 움직이지도 않고 침대에 누워만 있었다. 얼마 후, Bobby는 블록을 가지고 Bob의 방에 들어왔다.","\"할아버지, 이제 탑을 쌓을 시간이에요!\"","Bob의 입가에 작은 미소가 떠올랐다. Bobby는 탑을 쌓기 시작했다.","\"자, 할아버지, 이제 코끼리 블록이에요.\"","갑자기 Bob이 재채기 같은 작은 소리를 냈다. 그 순간, Bobby는 Bob이 곧 회복될 것임을 깨달았다. 그리고 Bob은 회복되었다. 서서히 Bob은 말을 조금씩 하고 손가락을 움직이기 시작했다. 하지만 그는 여전히 걸을 수 없었다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["수빈이는 Kate를 위해 쿠키를 굽고 싶어 한다.","아빠는 수빈이가 오븐을 사용하는 것을 허락한다.","아빠는 4시에 온라인 회의가 있다.","아빠는 약 1시간 동안 수빈이를 도와줄 수 있다.","수빈이는 Kate가 매우 좋아하는 치즈 쿠키를 만들 것이다."],"a":3,"ans":"아빠는 약 1시간 동안 수빈이를 도와줄 수 있다.","evs":[["I have an online meeting at 4, so I can help you now.","아빠는 4시에 온라인 회의가 있어서 지금은 도와줄 수 있어."],["It's a quarter past two.","2시 15분이에요."]],"ev":["I have an online meeting at 4, so I can help you now.","아빠는 4시에 온라인 회의가 있어서 지금은 도와줄 수 있어."],"ow":["오답 ✕ — 'Today is Kate's birthday, so I want to bake them for her.'(오늘이 Kate의 생일이라서 그 애를 위해 쿠키를 굽고 싶어요.)라고 했으므로 일치하는 내용이다. 일치하지 않는 것을 찾는 문제라서 답이 아니다.","오답 ✕ — 아빠가 'Okay. Let's start.'(좋아. 시작하자.)라고 했으므로 오븐 사용을 허락한 것이다. 일치하는 내용이다.","오답 ✕ — 'I have an online meeting at 4'(4시에 온라인 회의가 있어서)라고 했으므로 일치하는 내용이다.","정답 ○ — 지금이 'It's a quarter past two.'(2시 15분)이고 회의는 4시이므로 아빠는 약 1시간 45분 동안 도와줄 수 있다. '약 1시간'이라는 보기는 일치하지 않는다.","오답 ✕ — 'Cheese cookies. Kate loves them.'(치즈 쿠키요. Kate가 아주 좋아해요.)라고 했으므로 일치하는 내용이다."],"memo":["정답: ④ 아빠는 약 1시간 동안 도와줄 수 있다 (✕ — 약 1시간 45분)","근거: It's a quarter past two.(2시 15분) → I have an online meeting at 4(4시에 회의)","함정: 2시 15분부터 4시까지의 시간을 계산해 보기"],"why":"지금 2시 15분이고 회의가 4시라서 도울 수 있는 시간은 약 1시간 45분이다."},{"n":2,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["computer - cookies","oven - cake","oven - cookies","microwave - cookies","oven - bread"],"a":2,"ans":"oven - cookies","evs":[["Dad, is it okay if I use the oven to bake some cookies?","아빠, 쿠키를 구우려고 오븐을 써도 괜찮아요?"],["Today is Kate's birthday, so I want to bake them for her.","오늘이 Kate의 생일이라서 그 애를 위해 쿠키를 굽고 싶어요."]],"ev":["Dad, is it okay if I use the oven to bake some cookies?","아빠, 쿠키를 구우려고 오븐을 써도 괜찮아요?"],"ow":["오답 ✕ — 수빈이가 쓰려는 것은 컴퓨터가 아니라 'the oven'(오븐)이라서 (A)가 틀림. 컴퓨터는 다른 대화에 나오는 물건이다.","오답 ✕ — (A) oven은 맞지만, 수빈이가 구우려는 것은 케이크가 아니라 'some cookies'(쿠키)라서 (B)가 틀림.","정답 ○ — 'is it okay if I use the oven to bake some cookies?'(쿠키를 구우려고 오븐을 써도 괜찮아요?)라고 허락을 구했으므로 (A)=oven, (B)=cookies이다.","오답 ✕ — 수빈이가 허락을 구한 것은 전자레인지가 아니라 'the oven'(오븐)이라서 (A)가 틀림.","오답 ✕ — (A) oven은 맞지만, 굽는 것은 빵이 아니라 'cheese cookies'(치즈 쿠키)라서 (B)가 틀림."],"memo":["정답: ③ oven - cookies","근거: is it okay if I use the oven to bake some cookies?(쿠키를 구우려고 오븐을 써도 괜찮아요?)","함정: is it okay if ~? = 허락을 구하는 표현"],"why":"수빈이는 Kate의 생일을 위해 오븐을 써서 쿠키를 구우려고 허락을 구한다.","sum":"Subin asks her dad if she can use the (A) to bake (B) for Kate's birthday.","lab":"완성된 요약문 : "}],"dlg":[["Subin","Dad, is it okay if I use the oven to bake some cookies?","아빠, 쿠키를 구우려고 오븐을 써도 괜찮아요?"],["Dad","Sure, Subin. What are they for?","그럼, 수빈아. 그건 무엇을 위한 거니?"],["Subin","Today is Kate's birthday, so I want to bake them for her.","오늘이 Kate의 생일이라서 그 애를 위해 쿠키를 굽고 싶어요."],["Dad","That's very nice of you. What time is it now?","정말 착하구나. 지금 몇 시니?"],["Subin","It's a quarter past two.","2시 15분이에요."],["Dad","I have an online meeting at 4, so I can help you now.","아빠는 4시에 온라인 회의가 있어서 지금은 도와줄 수 있어."],["Subin","That's great!","잘됐네요!"],["Dad","What kind of cookies are you going to bake?","어떤 쿠키를 구울 거니?"],["Subin","Cheese cookies. Kate loves them.","치즈 쿠키요. Kate가 아주 좋아해요."],["Dad","Okay. Let's start.","좋아. 시작하자."]]},{"qs":[{"n":3,"q":"다음 대화의 주제로 알맞은 것은?","o":["온라인에서 좋은 정보를 찾는 법","컴퓨터 사용법에 대해 묻기","컴퓨터 사용 허락 구하기","컴퓨터 가격 비교하기","새 컴퓨터 사기"],"a":2,"ans":"컴퓨터 사용 허락 구하기","evs":[["Mom, is it okay if I use your computer?","엄마, 엄마 컴퓨터를 써도 괜찮아요?"],["I need to find some information for my homework.","숙제를 위한 정보를 좀 찾아야 해요."]],"ev":["Mom, is it okay if I use your computer?","엄마, 엄마 컴퓨터를 써도 괜찮아요?"],"ow":["오답 ✕ — 'I need to find some information for my homework.'(숙제를 위한 정보를 좀 찾아야 해요.)는 컴퓨터를 쓰려는 이유일 뿐이다. 온라인에서 좋은 정보를 찾는 방법을 말하는 대화는 아니라서 틀림.","오답 ✕ — 'is it okay if I use your computer?'(엄마 컴퓨터를 써도 괜찮아요?)는 쓰는 방법이 아니라 써도 되는지를 묻는 말이라서 틀림.","정답 ○ — 'Mom, is it okay if I use your computer?'(엄마, 엄마 컴퓨터를 써도 괜찮아요?)로 허락을 구하고, 엄마가 'Okay, but I need to use the computer in the evening.'(좋아, 하지만 저녁에는 써야 해.)이라고 답한다. 주제는 컴퓨터 사용 허락 구하기이다.","오답 ✕ — 컴퓨터 가격에 대한 말은 대화에 전혀 없어서 틀림.","오답 ✕ — 새 컴퓨터를 산다는 말은 없다. 'your computer'(엄마의 컴퓨터)를 잠시 쓰려는 상황이라서 틀림."],"memo":["정답: ③ 컴퓨터 사용 허락 구하기","근거: Mom, is it okay if I use your computer?(엄마, 엄마 컴퓨터를 써도 괜찮아요?)","함정: 정보를 찾는 것은 컴퓨터를 쓰려는 '이유'일 뿐"],"why":"엄마의 컴퓨터를 써도 되는지 허락을 구하는 대화이다."}],"dlg":[["B","Mom, is it okay if I use your computer?","엄마, 엄마 컴퓨터를 써도 괜찮아요?"],["W","What do you need it for?","그걸 무엇에 쓰려고 하니?"],["B","I need to find some information for my homework.","숙제를 위한 정보를 좀 찾아야 해요."],["W","Okay, but I need to use the computer in the evening.","좋아, 하지만 엄마는 저녁에 컴퓨터를 써야 해."],["B","Don't worry. I'll finish before then.","걱정 마세요. 그 전에 끝낼게요."]]},{"qs":[{"n":4,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["closet - shirt","washing machine - jacket","washing machine - shirt","washing machine - hat","bag - shirt"],"a":2,"ans":"washing machine - shirt","evs":[["I put it in the washing machine this morning, and it's not dry yet.","오늘 아침에 세탁기에 넣었는데 아직 안 말랐어."],["Why don't you wear your blue shirt?","네 파란 셔츠를 입는 게 어때?"]],"ev":["I put it in the washing machine this morning, and it's not dry yet.","오늘 아침에 세탁기에 넣었는데 아직 안 말랐어."],"ow":["오답 ✕ — 갈색 재킷이 있는 곳은 옷장이 아니라 'the washing machine'(세탁기)라서 (A)가 틀림.","오답 ✕ — (A) washing machine은 맞지만, 대신 입으라고 제안한 것은 재킷이 아니라 'your blue shirt'(파란 셔츠)라서 (B)가 틀림.","정답 ○ — 'I put it in the washing machine'(세탁기에 넣었어)이라서 빌려줄 수 없고, 'Why don't you wear your blue shirt?'(파란 셔츠를 입는 게 어때?)라고 제안했다. (A)=washing machine, (B)=shirt이다.","오답 ✕ — (A) washing machine은 맞지만, 모자를 쓰라는 말은 없다. 'your blue shirt'(파란 셔츠)를 권했으므로 (B)가 틀림.","오답 ✕ — 재킷은 가방이 아니라 세탁기에 있어서 (A)가 틀림."],"memo":["정답: ③ washing machine - shirt","근거: I put it in the washing machine(세탁기에 넣었어) / Why don't you wear your blue shirt?(파란 셔츠를 입는 게 어때?)","함정: Why don't you ~? = 제안하는 표현"],"why":"갈색 재킷은 세탁기 안이라서 못 빌려주고, 대신 파란 셔츠를 제안한다.","sum":"Jina can't lend her brown jacket because it is in the (A) , so she suggests wearing a blue (B) .","lab":"완성된 요약문 : "}],"dlg":[["G1","Jina, is it okay if I wear your brown jacket?","진아야, 네 갈색 재킷을 입어도 괜찮아?"],["G2","My brown jacket? I put it in the washing machine this morning, and it's not dry yet.","내 갈색 재킷? 오늘 아침에 세탁기에 넣었는데 아직 안 말랐어."],["G1","Oh, no! I wanted to wear that jacket.","아, 이런! 나는 그 재킷을 입고 싶었는데."],["G2","Why don't you wear your blue shirt? It's warm today.","네 파란 셔츠를 입는 게 어때? 오늘은 따뜻해."],["G1","That's a good idea. Thanks.","좋은 생각이야. 고마워."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["Eric is traveling in London.","Grandma went to Big Ben and had a meat pie yesterday.","It is a quarter past six in the evening in London.","Grandma is having a bad time in London.","Eric woke up early in the morning."],"a":1,"ans":"Grandma went to Big Ben and had a meat pie yesterday.","evs":[["I went to Big Ben and had a meat pie yesterday.","어제 빅벤에 가고 미트 파이를 먹었어."],["It's a quarter past six in the morning.","아침 6시 15분이란다."]],"ev":["I went to Big Ben and had a meat pie yesterday.","어제 빅벤에 가고 미트 파이를 먹었어."],"ow":["오답 ✕ — 'How's your trip to London, Grandma?'(런던 여행은 어떠세요, 할머니?)라고 했으므로 런던을 여행 중인 사람은 Eric이 아니라 할머니라서 틀림.","정답 ○ — 할머니가 'I went to Big Ben and had a meat pie yesterday.'(어제 빅벤에 가고 미트 파이를 먹었어.)라고 했으므로 본문과 일치한다.","오답 ✕ — 'It's a quarter past six in the morning.'(아침 6시 15분이란다.)이라고 했는데 이 보기는 저녁이라고 해서 틀림.","오답 ✕ — 할머니는 'It's great.'(아주 좋단다.)라고 했고, Eric도 'You're having a great time there.'(아주 즐거운 시간을 보내고 계시네요.)라고 했다. 나쁜 시간이라는 말은 틀림.","오답 ✕ — 'you woke up early!'(일찍 일어나셨네요!)는 할머니에게 한 말이다. 일찍 일어난 사람은 Eric이 아니라서 틀림."],"memo":["정답: ② 할머니는 어제 빅벤에 가고 미트 파이를 먹었다","근거: I went to Big Ben and had a meat pie yesterday.(어제 빅벤에 가고 미트 파이를 먹었어.)","함정: 런던 여행 중인 사람 = 할머니 (Eric 아님)"],"why":"런던 여행 중인 할머니가 어제 빅벤에 가고 미트 파이를 먹었다."}],"dlg":[["W","Hello, Eric. How are you doing?","안녕, Eric. 잘 지내니?"],["B","I'm doing okay, thanks. How's your trip to London, Grandma?","잘 지내요, 고맙습니다. 런던 여행은 어떠세요, 할머니?"],["W","It's great. I went to Big Ben and had a meat pie yesterday.","아주 좋단다. 어제 빅벤에 가고 미트 파이를 먹었어."],["B","Wow! You're having a great time there. By the way, what time is it in London now?","와! 거기서 아주 즐거운 시간을 보내고 계시네요. 그런데 지금 런던은 몇 시예요?"],["W","It's a quarter past six in the morning.","아침 6시 15분이란다."],["B","Oh, you woke up early! I hope you have a wonderful vacation there.","아, 일찍 일어나셨네요! 그곳에서 멋진 휴가 보내시길 바라요."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 제목으로 알맞은 것은?","o":["Fun Games for Bobby","Bobby's Unhappy Childhood","The Mystery of Bob's Sneezes","The Challenges of Bobby's First Steps","Bobby's Happy Time with Grandpa Bob"],"a":4,"ans":"Bobby's Happy Time with Grandpa Bob","evs":[["Bob was his best friend.","Bob은 그의 가장 친한 친구였다."],["Bob and Bobby often played with old wooden blocks.","Bob과 Bobby는 종종 오래된 나무 블록을 가지고 놀았다."],["Bobby laughed and laughed.","Bobby는 웃고 또 웃었다."]],"ev":["Bob was his best friend.","Bob은 그의 가장 친한 친구였다."],"ow":["오답 ✕ — 블록을 쌓으며 노는 장면이 있긴 하지만 'Bob was the person who taught Bobby how to walk.'(Bob은 걷는 법을 가르쳐 준 사람이었다.)처럼 할아버지와의 관계가 중심이다. 재미있는 게임 소개가 아니라서 틀림.","오답 ✕ — 'Bob was his best friend.'(Bob은 그의 가장 친한 친구였다.)라고 했고 Bobby는 'Bobby laughed and laughed.'(웃고 또 웃었다.)했다. 불행한 어린 시절이 아니라서 틀림.","오답 ✕ — 'Bob sneezed, and the tower fell.'(Bob이 재채기를 했고, 탑이 무너졌다.)은 즐거운 일화일 뿐, 수수께끼가 아니다. Bobby는 'You always sneeze when the elephant block appears.'라며 웃었다. 세부 내용이라 틀림.","오답 ✕ — 'Now one foot, now the other.'(한 발, 이제 다른 발.)라며 걷는 법을 가르쳐 준 일이 나오지만, 어려움을 겪는 이야기는 아니다. 또 글의 중심은 할아버지와 놀던 즐거운 시간이라서 틀림.","정답 ○ — 할아버지 Bob은 'his best friend'(가장 친한 친구)였고, 함께 블록 탑을 쌓으며 'Bobby laughed and laughed.'(웃고 또 웃었다.) 했다. 할아버지와의 행복한 시간이 중심이다."],"memo":["정답: ⑤ Bobby's Happy Time with Grandpa Bob","근거: Bob was his best friend.(가장 친한 친구) / Bobby laughed and laughed.(웃고 또 웃었다.)","함정: ③ 재채기는 일화 하나라 제목으로 너무 좁다"],"why":"할아버지와 블록 탑을 쌓으며 웃던 행복한 시간을 담은 글이다."},{"n":7,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["plastic - tower","wooden - tower","wooden - bridge","paper - castle","wooden - house"],"a":1,"ans":"wooden - tower","evs":[["Bob and Bobby often played with old wooden blocks.","Bob과 Bobby는 종종 오래된 나무 블록을 가지고 놀았다."],["They slowly piled the blocks one by one to build  fell.(그런데 Bob이 재채기를 했고, 탑이 무너졌다.)","함정: Bobby는 울지 않고 웃고 또 웃었다"],"why":"코끼리 블록이 나오면 Bob이 재채기를 해서 탑이 무너졌다."}],"pp":[["Bobby got his name from his grandfather, Bob.","Bobby는 할아버지인 Bob을 따라 이름 지어졌다."],["Bob was his best friend.","Bob은 그의 가장 친한 친구였다."],["Bob was the person who taught Bobby how to walk.","Bob은 Bobby에게 걷는 법을 가르쳐 준 사람이었다."],["\"Hold my hands, Bobby,\" Bob said.","\"내 손을 잡아, Bobby.\" Bob이 말했다."],["\"Now one foot, now the other.\"","\"자, 한 발, 이제 다른 발.\""],["Bob and Bobby often played with old wooden blocks.","Bob과 Bobby는 종종 오래된 나무 블록을 가지고 놀았다."],["They slowly piled the blocks one by one to build a tower.","그들은 탑을 만들기 위해 블록을 하나씩 천천히 쌓았다."],["\"There is one more block to put,\" Bob said.","\"이제 쌓을 블록이 하나 더 있어.\" Bob이 말했다."],["\"And that's the elephant block,\" Bobby said.","\"그리고 그건 코끼리 블록이에요.\" Bobby가 말했다."],["Bobby carefully put the elephant block on the top.","Bobby는 코끼리 블록을 조심스럽게 꼭대기에 놓았다."],["But Bob sneezed, and the tower fell.","그런데 Bob이 재채기를 했고, 탑이 무너졌다."],["Bobby laughed and laughed.","Bobby는 웃고 또 웃었다."],["Bobby said, \"You always sneeze when the elephant block appears.\"","Bobby가 말했다. \"할아버지는 코끼리 블록이 나오면 항상 재채기를 하시네요.\""]]},{"qs":[{"n":9,"q":"윗글의 주제로 알맞은 것은?","o":["Bobby의 어린 시절 추억들","Bob의 질병과 가족들의 어려움","Bob의 어려움을 극복하려는 의지","Bobby의 가족들 사이의 갈등과 용서","Bobby의 할아버지를 위한 사랑과 노력"],"a":4,"ans":"Bobby의 할아버지를 위한 사랑과 노력","evs":[["\"Bob, it's time to build a tower!\"","\"할아버지, 이제 탑을 쌓을 시간이에요!\""],["At that moment, Bobby realized that Bob would recover soon.","그 순간, Bobby는 Bob이 곧 회복될 것임을 깨달았다."]],"ev":["\"Bob, it's time to build a tower!\"","\"할아버지, 이제 탑을 쌓을 시간이에요!\""],"ow":["오답 ✕ — 이 부분은 어린 시절 추억이 아니라 'Bob fell ill.'(할아버지께서 편찮으셔.) 이후의 일이다. 현재 Bobby가 할아버지를 위해 하는 행동이 중심이라서 틀림.","오답 ✕ — 'He is in a hospital which is far from here.'(할아버지는 여기서 멀리 떨어진 병원에 계셔.)처럼 병이 나오긴 하지만, 가족들의 어려움보다 Bobby가 할아버지를 위해 하는 행동이 중심이라서 틀림.","오답 ✕ — Bob이 'made a small smile'(작은 미소를 지었다)고 'a small sound'(작은 소리를 냈다)는 정도일 뿐, 스스로 어려움을 이겨 내려는 의지를 보이는 글은 아니다. 행동하는 쪽은 Bobby라서 틀림.","오답 ✕ — 가족 사이의 갈등이나
