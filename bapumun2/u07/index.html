": "그 사과는 씻지 않고 먹을 만큼 깨끗하다(enough 자리가 틀림).", "ok": false, "why": "to와 동사 사이에 enough를 넣을 수 없어요."}, {"n": "⑤", "en": "The apple is clean to eat enough without washing it.", "ko": "그 사과는 씻지 않고 먹을 만큼 깨끗하다(enough 자리가 틀림).", "ok": false, "why": "enough는 동사 뒤가 아니라 형용사 뒤에 와요."}], "pencil": "enough는 ___ 뒤에 놓는다", "pencilKey": "형용사", "page": 71, "sec": "s1"}, {"id": "S1-23", "step": 1, "no": 23, "qtype": "유형 04 too ~ to, enough to", "type": "mc", "ans": "⑤", "concept": ["062–063"], "gap": "", "words": [["small", "작은"], ["roller coaster", "롤러코스터"], ["wise", "현명한"], ["useful advice", "유용한 조언"]], "h1": "첫 문장은 '타기에 너무 작다'는 부정, 둘째 문장은 '조언을 줄 만큼 현명하다'는 긍정의 뜻이에요. 각각 어울리는 단어를 정해 보세요.", "h2": "부정의 느낌에는 too, '~할 만큼 충분히'에는 enough를 써요. enough는 형용사 뒤에 있다는 점도 확인해 보세요.", "why": "첫 문장은 '너무 작아서 못 타는' 뜻이라 too, 둘째는 '충분히 현명한' 뜻이라 enough가 알맞아요.", "opts": [{"n": "①", "en": "too - too", "ko": "너무 - 너무", "ok": false, "why": "둘째 문장은 긍정이라서 too가 어울리지 않아요."}, {"n": "②", "en": "enough - enough", "ko": "충분히 - 충분히", "ok": false, "why": "첫 문장은 형용사 앞에 enough를 쓸 수 없고 부정 뜻이에요."}, {"n": "③", "en": "so - enough", "ko": "그렇게 - 충분히", "ok": false, "why": "첫 문장에 so와 to부정사는 어울리지 않아요."}, {"n": "④", "en": "too - so", "ko": "너무 - 그렇게", "ok": false, "why": "둘째 문장에서 so wise to는 어색해요."}, {"n": "⑤", "en": "too - enough", "ko": "너무 - 충분히", "ok": true, "why": "부정은 too, 긍정은 wise enough로 알맞아요."}], "pencil": "'~할 만큼 충분히'는 형용사 + ___ + to부정사", "pencilKey": "enough", "page": 71, "sec": "s1"}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 04 too ~ to, enough to", "type": "mc", "ans": "③", "concept": ["062–063", "025-H1"], "gap": "", "words": [["pants", "바지"], ["wear", "입다"], ["long", "긴"]], "h1": "원래 문장은 '바지가 너무 길어서 내가 입을 수 없다'예요. so ~ that 문장으로 바꿀 때 that 뒤에 어떤 뜻이 와야 할까요?", "h2": "「too ~ to」는 「so ~ that … can't」로 바꿔요. 시제와 주어, pants가 복수라는 점을 확인해 보세요.", "why": "too ~ to는 so ~ that … can't와 같아요. 현재 시제이고 pants는 복수라서 that I can't wear them이 돼요.", "opts": [{"n": "①", "en": "I can wear them", "ko": "나는 그것들을 입을 수 있다", "ok": false, "why": "too long to wear는 '입을 수 없다'라서 긍정 can은 틀려요."}, {"n": "②", "en": "I can't wear it", "ko": "나는 그것을 입을 수 없다", "ok": false, "why": "pants는 복수라서 it이 아니라 them이에요."}, {"n": "③", "en": "I can't wear them", "ko": "나는 그것들을 입을 수 없다", "ok": true, "why": "현재 시제 부정과 복수 대명사가 모두 맞아요."}, {"n": "④", "en": "I could wear them", "ko": "나는 그것들을 입을 수 있었다", "ok": false, "why": "긍정이고 과거라서 틀려요."}, {"n": "⑤", "en": "I couldn't wear it", "ko": "나는 그것을 입을 수 없었다", "ok": false, "why": "과거이고 it이라서 틀려요."}], "pencil": "too ~ to는 so ~ that 주어 + ___ 로 바꾼다", "pencilKey": "can't", "page": 71, "sec": "s1"}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 04 too ~ to, enough to", "type": "write", "ans": "is smart enough to solve", "concept": ["062–063"], "gap": "", "words": [["smart", "영리한"], ["solve", "풀다"], ["problem", "문제"]], "h1": "'문제를 풀 정도로 충분히 영리하다'에서 enough가 꾸미는 말을 먼저 정해요. 괄호 안 단어를 다 사용해요.", "h2": "「동사 + 형용사 + enough + to부정사」 순서예요. 주어 She 다음에 be동사가 와요.", "why": "'~할 만큼 충분히 ~한'은 「형용사 + enough + to부정사」예요. 그래서 She is smart enough to solve the problem.이 돼요.", "opts": [], "pencil": "「형용사 + ___ + to부정사」는 '~할 만큼 충분히 ~한'", "pencilKey": "enough", "page": 71, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "유형 01, 02 to부정사의 형용사적 / 부사적 용법", "type": "mc", "ans": "④", "concept": ["025"], "gap": "", "words": [["go shopping", "쇼핑하러 가다"], ["backpack", "배낭"], ["need", "필요하다"]], "h1": "소라가 '새 가방이 필요해'라고 말하면서 쇼핑을 가자고 했어요. 쇼핑을 가는 이유가 빈칸에 들어가요.", "h2": "이유나 목적('~하기 위해')은 「to + 동사원형」으로 나타내요. 보기에서 이 모양을 찾아보세요.", "why": "'새 가방을 사기 위해 쇼핑하러 간다'는 목적이에요. 목적을 나타내는 to부정사 to buy가 알맞아요.", "opts": [{"n": "①", "en": "buy", "ko": "사다(동사원형)", "ok": false, "why": "동사원형만으로는 목적을 나타내지 못해요."}, {"n": "②", "en": "bought", "ko": "샀다(과거형)", "ok": false, "why": "과거형이라 목적을 나타내지 못해요."}, {"n": "③", "en": "buying", "ko": "사는(-ing)", "ok": false, "why": "-ing는 '~하기 위해'를 나타내지 못해요."}, {"n": "④", "en": "to buy", "ko": "사기 위해", "ok": true, "why": "목적을 나타내는 부사적 용법의 to부정사예요."}, {"n": "⑤", "en": "to buying", "ko": "to 뒤에 -ing", "ok": false,
