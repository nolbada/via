,[9,"So, they started Chinese restaurants and offered fortune cookies as a dessert.","그래서 그들은 중국 식당을 시작하였고 디저트로 포춘 쿠키를 제공하였다."]],"w":"8번에서 일본 식당을 열고 싶었지만 많은 미국인이 일본 요리를 좋아하지 않았다고 하고, 9번 So(그래서) they started Chinese restaurants로 이어짐. 이유와 결과가 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"d17930eccf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Fortune cookies are treats with hidden messages inside.)","ko":"(포춘 쿠키는 안쪽에 hidden 메시지가 있는 간식이다.)","opts":["차가운","숨겨진","비싼","오래된"],"word":"hidden","r":{"ev":"1번 문장","s":[[1,"Fortune cookies are treats with hidden messages inside.","포춘 쿠키는 안쪽에 숨겨진 메시지가 있는 간식이다."]],"w":"1번 문장은 포춘 쿠키 안쪽(inside)에 메시지가 겉에서 보이지 않게 들어 있다는 뜻. hidden = 숨겨진.","a":"2) 숨겨진","c":2},"h":"e9552bfd92"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As the cookies became more popular, the recipe changed to suit American tastes.)","ko":"(쿠키가 더 인기를 얻게 되면서, 조리법은 미국인의 입맛에 suit하도록 바뀌었다.)","opts":["피하다","자르다","맞추다","잊다"],"word":"suit","r":{"ev":"10번 문장","s":[[10,"As the cookies became more popular, the recipe changed to suit American tastes.","그 쿠키가 더 인기를 얻게 되면서, 미국인의 입맛에 맞춰 조리법이 바뀌었다."]],"w":"10번은 쿠키가 인기를 얻자 조리법을 미국인의 입맛에 맞게 바꿨다는 뜻. 바로 뒤 11번에서 바닐라와 버터로 더 달콤해졌다고 함. suit = ~에 맞추다.","a":"3) 맞추다","c":3},"h":"de301a3c1c"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSo, they started Chinese restaurants and offered fortune cookies as a dessert.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"그래서 그들은 중국 식당을 시작하였고 디저트로 포춘 쿠키를 제공하였다.","opts":["미국인들","중국 식당 손님들","포춘 쿠키들","일본 사람들"],"r":{"ev":"7~9번 문장","s":[[7,"When Japanese people moved to the U.S. in the 1900s, they introduced these cookies.","1900년대에 일본 사람들이 미국으로 이주했을 때, 그들은 이 쿠키를 들여왔다."],[8,"They wanted to open Japanese restaurants, but many Americans didn’t like certain Japanese dishes such as raw fish.","그들은 일본 식당을 열고 싶었지만, 많은 미국인들이 생선회와 같은 특정한 일본 요리를 좋아하지 않았다."],[9,"So, they started Chinese restaurants and offered fortune cookies as a dessert.","그래서 그들은 중국 식당을 시작하였고 디저트로 포춘 쿠키를 제공하였다."]],"w":"7번에서 Japanese people이 미국으로 이주해 쿠키를 들여왔고, 8번 They는 일본 식당을 열고 싶었던 사람들이며, 9번 So, they started Chinese restaurants의 they도 같은 일본 사람들임.","a":"4) 일본 사람들","c":4},"h":"3a5f179e18"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It’s more than just a dessert!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 단지 디저트 그 이상이다!","opts":["그것은 단지 디저트 그 이상의 의미가 있다!","그것은 디저트보다 훨씬 더 맛이 없다!","그것은 디저트가 아니라 식사이다!","그것은 디저트로만 먹을 수 있다!"],"r":{"ev":"13~14번 문장","s":[[13,"The cookie remains important in American culture.","그 쿠키는 미국 문화에서 여전히 중요하다."],[14,"It’s more than just a dessert!","그것은 단지 디저트 그 이상이다!"]],"w":"It은 13번의 the cookie(쿠키). more than just a dessert는 '단지 디저트 이상'이라는 뜻으로, 미국 문화에서 여전히 중요하다는 13번과 이어짐. 맛이 없다거나 식사라는 말은 없음.","a":"1) 그것은 단지 디저트 그 이상의 의미가 있다!","c":1},"h":"d1c1d2be28"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["포춘 쿠키는 중국에서 왔다.","교토 근처에서 만들어진 쿠키는 오늘날의 포춘 쿠키보다 더 작았다.","일본 사람들은 1900년대에 미국으로 이주했을 때 그 쿠키를 들여왔다.","쿠키 조리법은 일본인의 입맛에 맞게 바뀌었다."],"opts":["Fortune cookies came from China.","The cookie made near Kyoto was smaller than fortune cookies today.","Japanese people introduced the cookies when they moved to the U.S. in the 1900s.","The cookie recipe changed to suit Japanese tastes."],"r":{"ev":"3, 6~7, 10번 문장","s":[[3,"While many Americans link these cookies to Chinese culture, they are actually from Japan.","많은 미국인이 이 쿠키들을 중국 문화와 연관 짓지만, 그것들은 사실 일본에서 왔다."],[6,"It was larger and made with sesame and miso.","그것은 더 컸고 깨와 미소로 만들어졌다."],[7,"When Japanese people moved to the U.S. in the 1900s, they introduced these cookies.","1900년대에 일본 사람들이 미국으로 이주했을 때, 그들은 이 쿠키를 들여왔다."],[10,"As the cookies became more popular, the recipe changed to suit American tastes.","그 쿠키가 더 인기를 얻게 되면서, 미국인의 입맛에 맞춰 조리법이 바뀌었다."]],"w":"7번 문장에 When Japanese people moved to the U.S. in the 1900s, they introduced these cookies가 나옴. ①은 3번(일본에서 옴), ②는 6번(더 컸음), ④는 10번(미국인의 입맛)과 어긋남.","a":"3) Japanese people introduced the cookies when they moved to the U.S. in the 1900s.","c":3},"h":"812fbc885e"},{"n":9,"t":"sum","q":"Many Americans didn't like some Japanese dishes, so Japanese people started (A) restaurants and offered fortune cookies. As the cookies became popular, the recipe changed to suit (B) tastes.","ko":"많은 미국인이 일부 일본 요리를 좋아하지 않아서 일본 사람들은 (A) 식당을 시작하고 포춘 쿠키를 제공했다. 쿠키가 인기를 얻으면서 조리법은 (B) 입맛에 맞게 바뀌었다.","oko":["(A) 중국 / (B) 일본","(A) 일본 / (B) 미국","(A) 일본 / (B) 일본","(A) 중국 / (B) 중국","(A) 중국 / (B) 미국"],"opts":["(A) Chinese / (B) Japanese","(A) Japanese / (B) American","(A) Japanese / (B) Japanese","(A) Chinese / (B) Chinese","(A) Chinese / (B) American"],"r":{"ev":"8~10번 문장","s":[[8,"They wanted to open Japanese restaurants, but many Americans didn’t like certain Japanese dishes such as raw fish.","그들은 일본 식당을 열고 싶었지만, 많은 미국인들이 생선회와 같은 특정한 일본 요리를 좋아하지 않았다."],[9,"So, they started Chinese restaurants and offered fortune cookies as a dessert.","그래서 그들은 중국 식당을 시작하였고 디저트로 포춘 쿠키를 제공하였다."],[10,"As the cookies became more popular, the recipe changed to suit American tastes.","그 쿠키가 더 인기를 얻게 되면서, 미국인의 입맛에 맞춰 조리법이 바뀌었다."]],"w":"9번 So, they started Chinese restaurants에서 (A)는 Chinese(중국). 10번 the recipe changed to suit American tastes에서 (B)는 American(미국). 일본 식당은 8번에서 열고 싶었지만 열지 못한 곳임.","a":"5) (A) Chinese / (B) American","c":5},"h":"c3291253b9"},{"n":10,"t":"fill","q":"The cookies became sweeter with [A] and butter, and today billions of fortune cookies are [B] every year.","ko":"쿠키는 [A]과(와) 버터를 넣어 더 달콤해졌고, 오늘날 수십억 개의 포춘 쿠키가 매년 [B].","bank":["vanilla","produced","introduce","remain","receive","became"],"bko":{"vanilla":"바닐라","produced":"생산된다","introduce":"들여오다","remain":"계속 ~이다","receive":"받다","became":"~이 되었다"},"r":{"ev":"11~12번 문장","s":[[11,"They became sweeter with vanilla and butter.","그것들은 바닐라와 버터를 넣어 더 달콤해졌다."],[12,"Today, billions of fortune cookies are produced every year.","오늘날, 수십억 개의 포춘 쿠키가 매년 생산된다."]],"w":"11번 They became sweeter with vanilla and butter에서 [A]는 vanilla, 12번 billions of fortune cookies are produced every year에서 [B]는 produced. introduce(들여오다), remain(계속 ~이다), receive(받다), became(~이 되었다)은 동사라서 'with ___ and butter'나 'are ___ every year' 자리에 맞지 않음.","a":"[A] vanilla, [B] produced","c":null},"h":"8f2a99b5ed"}]},{"u":4,"id":"rg4-04-1","no":1,"ko":"바위 밑에 산다고? 진짜로 사는 마을이 있다!","items":[{"n":1,"t":"tf","q":"The houses in Setenil de las Bodegas were made by the Moors.","ko":"Setenil de las Bodegas의 집들은 무어인들이 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"These special houses were made by the Moors, who invaded Spain and founded the town in the 12th century.","이 특별한 집들은 12세기에 스페인을 침략해 이 마을을 세운 무어인들이 만들었다."]],"w":"3번 문장에 These special houses were made by the Moors라고 나옴. 같은 내용이라 T.","c":"T"},"h":"783ef78c02"},{"n":2,"t":"tf","q":"The Moors built new houses instead of making the natural caves bigger.","ko":"무어인들은 자연 동굴을 더 크게 만드는 대신 새 집을 지었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Instead of building new houses, they made the natural caves bigger to stay cool during the hot summer months.","그들은 새 집을 짓는 대신, 더운 여름 동안 시원하게 지내려고 자연 동굴을 더 크게 만들었다."]],"w":"4번 문장은 Instead of building new houses(새 집을 짓는 대신), they made the natural caves bigger(자연 동굴을 더 크게 만들었다)임. 새 집을 지은 것이 아니라 동굴을 넓힌 것이라 F.","c":"F"},"h":"9f55eb671a"},{"n":3,"t":"tf","q":"Most of the vineyards were destroyed by insects in the 1800s.","ko":"포도밭 대부분은 1800년대에 벌레들에 의해 파괴되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Most of the vineyards were destroyed by insects in the 1800s.","포도밭 대부분은 1800년대에 벌레들에 의해 파괴되었다."]],"w":"10번 문장에 Most of the vineyards were destroyed by insects in the 1800s가 그대로 나옴. T.","c":"T"},"h":"6d1d43257c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... Spain and founded the town in the 12th century.)","ko":"... 스페인을 침략하고 12세기에 그 마을을 ( ).","opts":["도와주었다","세웠다","팔았다","떠났다"],"word":"founded","r":{"a":"2) 세웠다","ev":"3번 문장","s":[[3,"These special houses were made by the Moors, who invaded Spain and founded the town in the 12th century.","이 특별한 집들은 12세기에 스페인을 침략해 이 마을을 세운 무어인들이 만들었다."]],"w":"3번에서 무어인들이 스페인을 침략하고 마을을 founded(found(세우다)의 과거형). 마을을 처음 만들었다는 뜻이라 ‘세웠다’. 떠나거나 팔았다는 내용은 없음.","c":2},"h":"9890a01bc8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... they made the natural caves bigger to stay cool ...)","ko":"... 그들은 시원하게 지내려고 ( ) 동굴을 더 크게 만들었다.","opts":["인공의","작은","자연의","새로운"],"word":"natural","r":{"a":"3) 자연의","ev":"4번 문장","s":[[4,"Instead of building new houses, they made the natural caves bigger to stay cool during the hot summer months.","그들은 새 집을 짓는 대신, 더운 여름 동안 시원하게 지내려고 자연 동굴을 더 크게 만들었다."]],"w":"4번에서 새 집을 짓는 대신 있던 동굴을 넓혔다고 함. natural caves는 사람이 만든 것이 아닌 원래 있던 ‘자연의’ 동굴. 인공의·새로운은 오히려 반대 방향.","c":3},"h":"926e8fb89a"},{"n":6,"t":"ref","q":"What does the underlined “It” refer to?\nIt was added to the town’s name by settlers who introduced vineyards to the region.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 그 지역에 포도밭을 들여온 정착민들에 의해 마을 이름에 덧붙여졌다.","opts":["Setenil이라는 말","와인 저장고라는 건물","마을의 포도밭","Bodegas라는 말"],"r":{"a":"4) Bodegas라는 말","ev":"8~9번 문장","s":[[8,"“Bodegas” means “a storehouse for wine” in Spanish.","‘Bodegas’는 스페인어로 ‘와인 저장고’를 뜻한다."],[9,"It was added to the town’s name by settlers who introduced vineyards to the region.","그것은 그 지역에 포도밭을 들여온 정착민들에 의해 마을 이름에 덧붙여졌다."]],"w":"8번에서 ‘Bodegas’의 뜻을 설명한 뒤 9번이 이어지므로 It은 ‘Bodegas’라는 말. ‘Setenil’은 6~7번에서 설명한 다른 이름 부분이고, 건물이나 포도밭이 마을 이름에 덧붙여진 것은 아님.","c":4},"h":"c22098bc22"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of building new houses, they made the natural caves bigger to stay cool during the hot summer months.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 새 집을 짓는 대신, 더운 여름 동안 시원하게 지내려고 자연 동굴을 더 크게 만들었다.","opts":["새 집을 짓지 않고 자연 동굴을 넓혀서 여름에 시원하게 지냈다.","새 집을 지어서 더운 여름에 시원하게 지냈다.","자연 동굴을 넓혀서 추운 겨울에 따뜻하게 지냈다.","새 집을 짓는 대신 자연 동굴을 더 작게 만들었다."],"r":{"a":"1) 새 집을 짓지 않고 자연 동굴을 넓혀서 여름에 시원하게 지냈다.","ev":"4번 문장","s":[[4,"Instead of building new houses, they made the natural caves bigger to stay cool during the hot summer months.","그들은 새 집을 짓는 대신, 더운 여름 동안 시원하게 지내려고 자연 동굴을 더 크게 만들었다."]],"w":"Instead of building new houses(새 집을 짓는 대신)는 집을 새로 짓지 않았다는 말이고, bigger(더 크게), to stay cool(시원하게 지내려고), summer(여름)로 정리됨. 새 집을 지었다, 겨울, 더 작게는 모두 본문과 다름.","c":1},"h":"41bf83e175"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Setenil이라는 이름은 영어 단어에서 왔다.","Bodegas는 무어인들이 마을 이름에 덧붙였다.","포도밭 대부분은 1800년대에 벌레들에 의해 파괴되었다.","가톨릭 통치자들이 마을을 되찾으려 한 것은 12세기였다."],"opts":["The name “Setenil” comes from an English word.","“Bodegas” was added to the town’s name by the Moors.","Most of the vineyards were destroyed by insects in the 1800s.","Catholic rulers tried to take the town back in the 12th century."],"r":{"a":"3) Most of the vineyards were destroyed by insects in the 1800s.","ev":"3번, 6~7번, 9~10번 문장","s":[[3,"These special houses were made by the Moors, who invaded Spain and founded the town in the 12th century.","이 특별한 집들은 12세기에 스페인을 침략해 이 마을을 세운 무어인들이 만들었다."],[6,"“Setenil” comes from the Latin words for “seven times nothing.”","‘Setenil’은 ‘7번의 무(無)’를 뜻하는 라틴어에서 왔다."],[7,"That’s because Catholic rulers tried seven times to take the town back from the Moors in the 15th century.","그것은 가톨릭 통치자들이 15세기에 무어인들로부터 그 마을을 되찾으려고 일곱 번 시도했기 때문이다."],[9,"It was added to the town’s name by settlers who introduced vineyards to the region.","그것은 그 지역에 포도밭을 들여온 정착민들에 의해 마을 이름에 덧붙여졌다."],[10,"Most of the vineyards were destroyed by insects in the 1800s.","포도밭 대부분은 1800년대에 벌레들에 의해 파괴되었다."]],"w":"10번에서 포도밭 대부분이 1800년대에 벌레들에 의해 파괴되었다고 함. ‘Setenil’은 라틴어에서 왔고(6번), ‘Bodegas’는 정착민들이 덧붙였고(9번), 통치자들이 되찾으려 한 것은 15세기(7번)라서 나머지는 모두 본문과 다름.","c":3},"h":"5b20758efe"},{"n":9,"t":"sum","q":"Some people in Setenil de las Bodegas live in houses built inside (A), because the Moors made the natural caves (B) to stay cool.","ko":"Setenil de las Bodegas의 일부 사람들은 (A) 안에 지어진 집에서 사는데, 무어인들이 시원하게 지내려고 자연 동굴을 (B) 만들었기 때문이다.","oko":["(A) 나무 / (B) 더 크게","(A) 바위 / (B) 더 크게","(A) 바위 / (B) 더 작게","(A) 성벽 / (B) 더 따뜻하게","(A) 바위 / (B) 더 어둡게"],"opts":["(A) trees / (B) bigger","(A) rocks / (B) bigger","(A) rocks / (B) smaller","(A) walls / (B) warmer","(A) rocks / (B) darker"],"r":{"a":"2) (A) rocks / (B) bigger","ev":"2~4번 문장","s":[[2,"But in a Spanish town called Setenil de las Bodegas, people really live in houses built inside rocks!","하지만 Setenil de las Bodegas라는 스페인의 한 마을에서는, 사람들이 정말로 바위 안에 지어진 집에서 산다!"],[3,"These special houses were made by the Moors, who invaded Spain and founded the town in the 12th century.","이 특별한 집들은 12세기에 스페인을 침략해 이 마을을 세운 무어인들이 만들었다."],[4,"Instead of building new houses, they made the natural caves bigger to stay cool during the hot summer months.","그들은 새 집을 짓는 대신, 더운 여름 동안 시원하게 지내려고 자연 동굴을 더 크게 만들었다."]],"w":"2번에서 사람들이 houses built inside rocks에 산다고 하고, 4번에서 자연 동굴을 bigger(더 크게) 만들었다고 함. 그래서 rocks와 bigger. 나무·성벽은 나오지 않고, smaller·warmer·darker도 본문과 반대이거나 없는 말.","c":2},"h":"9b455e7a9f"},{"n":10,"t":"fill","q":"The name “Setenil” comes from Latin words for “seven times [A],” and “Bodegas” was added to the town’s name by [B] who introduced vineyards.","ko":"‘Setenil’이라는 이름은 ‘7번의 [A]’를 뜻하는 라틴어에서 왔고, ‘Bodegas’는 포도밭을 들여온 [B]에 의해 마을 이름에 덧붙여졌다.","bko":{"nothing":"아무것도 (없음)","settlers":"정착민들","vineyards":"포도밭들","history":"역사","caves":"동굴들","insects":"벌레들"},"bank":["nothing","settlers","vineyards","history","caves","insects"],"r":{"a":"[A] nothing, [B] settlers","ev":"6번, 9번 문장","s":[[6,"“Setenil” comes from the Latin words for “seven times nothing.”","‘Setenil’은 ‘7번의 무(無)’를 뜻하는 라틴어에서 왔다."],[9,"It was added to the town’s name by settlers who introduced vineyards to the region.","그것은 그 지역에 포도밭을 들여온 정착민들에 의해 마을 이름에 덧붙여졌다."]],"w":"6번에서 ‘Setenil’은 ‘seven times nothing(7번의 무)’이고, 9번에서 Bodegas를 덧붙인 사람은 포도밭을 들여온 settlers(정착민들). vineyards(포도밭들)와 insects(벌레들)는 사람이 아니라서 [B]에 맞지 않고, history(역사)와 caves(동굴들)는 ‘seven times ~’에 맞지 않음.","c":null},"h":"a99193abf4"}]},{"u":4,"id":"rg4-04-2","no":2,"ko":"악몽(nightmare)의 night 뒤에 숨은 유령 이야기","items":[{"n":1,"t":"tf","q":"The word “night” was added later to show that the spirits visited at night.","ko":"‘night’라는 단어는 그 유령들이 밤에 방문했다는 것을 보여 주려고 나중에 추가되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The word “night” was added later to show that these spirits visited at night.","이러한 유령들이 밤에 방문했다는 것을 보여 주기 위해 ‘night’라는 단어가 나중에 추가되었다."]],"w":"3번 문장에 The word “night” was added later to show that these spirits visited at night라고 나옴. 같은 내용이라 T.","c":"T"},"h":"5657290009"},{"n":2,"t":"tf","q":"The word “mare” originally meant any scary dream.","ko":"‘mare’라는 단어는 원래 어떤 무서운 꿈이든 의미했다.","r":{"a":"F (본문과 다른 내용)","ev":"2번, 4번 문장","s":[[2,"The word “nightmare” originated from the Middle English word “mare,” which meant an evil spirit that bothered people during sleep.","‘nightmare’라는 단어는 중세 영어 단어인 ‘mare’에서 유래했는데, 그것은 잠자는 동안 사람들을 괴롭히는 사악한 유령을 의미했다."],[4,"Nowadays, we use the word “nightmare” to describe any scary dream.","오늘날 우리는 어떤 무서운 꿈이든 묘사하기 위해 ‘nightmare’라는 단어를 사용한다."]],"w":"2번에서 mare는 잠자는 동안 사람들을 괴롭히는 사악한 유령이었음. 어떤 무서운 꿈이든 가리키는 것은 오늘날의 nightmare(4번). 원래 뜻이 아니라서 F.","c":"F"},"h":"2f6b7b1e45"},{"n":3,"t":"tf","q":"In Germany, some people put shoes near the door to keep nightmare creatures away.","ko":"독일에서는 어떤 사람들이 악몽을 일으키는 생물을 쫓으려고 문 근처에 신발을 둔다.","r":{"a":"T (본문과 맞는 내용)","ev":"8~9번 문장","s":[[8,"In Germany, there are various creatures believed to bring nightmares.","독일에는 악몽을 일으킨다고 믿어지는 다양한 생물체가 있다."],[9,"To keep them away, some people put shoes near the door, cover the keyhole, or put something made of steel in their bed.","그것들을 멀리하기 위해, 어떤 사람들은 문 근처에 신발을 두거나, 열쇠 구멍을 막거나, 강철로 만든 무언가를 침대에 놓는다."]],"w":"8~9번에서 독일에는 악몽을 일으킨다고 믿어지는 생물이 있고, 쫓으려고 some people put shoes near the door. 같은 내용이라 T.","c":"T"},"h":"975a9fda6d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... there is an ancient story about King Vanlandi, ...)","ko":"... Vanlandi 왕에 대한 ( ) 이야기가 있다.","opts":["현대의","새로운","고대의","유명한"],"word":"ancient","r":{"a":"3) 고대의","ev":"6번 문장","s":[[6,"For example, in Scandinavia, there is an ancient story about King Vanlandi, who was killed by a mare.","예를 들어, 스칸디나비아에는 mare에게 죽임을 당한 Vanlandi 왕에 대한 고대의 이야기가 있다."]],"w":"6번의 ancient story는 오래전부터 전해 온 이야기. 스칸디나비아의 옛 왕 이야기라서 ancient = 고대의. 현대의·새로운은 반대 방향.","c":3},"h":"b5c6a287d7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... spirits or creatures that cause bad dreams.)","ko":"... 나쁜 꿈을 ( ) 유령이나 생물체","opts":["막다","일으키다","잊다","끝내다"],"word":"cause","r":{"a":"2) 일으키다","ev":"5번 문장","s":[[5,"Different cultures have their own stories about spirits or creatures that cause bad dreams.","다양한 문화들은 나쁜 꿈을 일으키는 유령이나 생물체에 대한 자신들만의 이야기를 가지고 있다."]],"w":"5번에서 유령이나 생물체가 나쁜 꿈의 원인이 된다는 말. cause = 일으키다. 8번의 ‘악몽을 가져온다고 믿어지는 생물’과도 같은 뜻 흐름. 막거나 끝낸다는 뜻이 아님.","c":2},"h":"c7c0d688f1"},{"n":6,"t":"ref","q":"What does the underlined “This creature” refer to?\nThis creature used to sit on the chests of people who were sleeping, so they found it hard to breathe.","ko":"밑줄 친 This creature가 가리키는 것은?","sko":"이 생물체는 자고 있던 사람들의 가슴 위에 앉곤 했고, 그래서 사람들은 숨쉬기가 어렵다고 여겼다.","opts":["mare (악몽을 일으키는 유령)","Vanlandi 왕","스칸디나비아 사람들","잠자던 사람들"],"r":{"a":"1) mare (악몽을 일으키는 유령)","ev":"6~7번 문장","s":[[6,"For example, in Scandinavia, there is an ancient story about King Vanlandi, who was killed by a mare.","예를 들어, 스칸디나비아에는 mare에게 죽임을 당한 Vanlandi 왕에 대한 고대의 이야기가 있다."],[7,"This creature used to sit on the chests of people who were sleeping, so they found it hard to breathe.","이 생물체는 자고 있던 사람들의 가슴 위에 앉곤 했고, 그래서 사람들은 숨쉬기가 어렵다고 여겼다."]],"w":"6번에서 Vanlandi 왕이 a mare에게 죽임을 당했다고 하고, 7번의 This creature가 그 mare를 가리킴. 가슴 위에 앉아 숨쉬기 힘들게 한 쪽은 mare이고, 왕이나 사람들은 당한 쪽.","c":1},"h":"ed3fc222ea"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"To keep them away, some people put shoes near the door, cover the keyhole, or put something made of steel in their bed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것들을 멀리하기 위해, 어떤 사람들은 문 근처에 신발을 두거나, 열쇠 구멍을 막거나, 강철로 만든 무언가를 침대에 놓는다.","opts":["그 생물들을 불러들이려고 신발, 열쇠 구멍, 강철 물건을 이용한다.","신발을 문 근처에 두면 열쇠 구멍과 침대가 강철로 변한다.","그 생물들을 쫓으려고 문 근처에 신발을 두거나, 열쇠 구멍을 막거나, 강철 물건을 침대에 둔다.","독일 사람들은 문 근처에서는 신발을 벗고 열쇠를 침대에 숨긴다."],"r":{"a":"3) 그 생물들을 쫓으려고 문 근처에 신발을 두거나, 열쇠 구멍을 막거나, 강철 물건을 침대에 둔다.","ev":"8~9번 문장","s":[[8,"In Germany, there are various creatures believed to bring nightmares.","독일에는 악몽을 일으킨다고 믿어지는 다양한 생물체가 있다."],[9,"To keep them away, some people put shoes near the door, cover the keyhole, or put something made of steel in their bed.","그것들을 멀리하기 위해, 어떤 사람들은 문 근처에 신발을 두거나, 열쇠 구멍을 막거나, 강철로 만든 무언가를 침대에 놓는다."]],"w":"To keep them away는 ‘그것들을 멀리하기 위해’(목적). them은 8번의 악몽을 일으키는 생물들. 이어지는 세 가지가 모두 쫓는 방법이라 3번. 불러들인다는 반대 뜻이거나 본문에 없는 내용은 오답.","c":3},"h":"11a4fe4ec2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["nightmare의 night는 처음부터 mare와 함께 쓰였다.","Vanlandi 왕의 이야기는 독일에 전해 온다.","다른 전통에서 mare는 사람들의 생명을 빨아들일 수 있다고 한다.","mare는 원래 아주 착한 유령을 뜻했다."],"opts":["The word “night” was used with “mare” from the beginning.","The story about King Vanlandi comes from Germany.","In other traditions, mares can suck the life out of people.","“Mare” originally meant a very kind spirit."],"r":{"a":"3) In other traditions, mares can suck the life out of people.","ev":"2~3번, 6번, 10번 문장","s":[[2,"The word “nightmare” originated from the Middle English word “mare,” which meant an evil spirit that bothered people during sleep.","‘nightmare’라는 단어는 중세 영어 단어인 ‘mare’에서 유래했는데, 그것은 잠자는 동안 사람들을 괴롭히는 사악한 유령을 의미했다."],[3,"The word “night” was added later to show that these spirits visited at night.","이러한 유령들이 밤에 방문했다는 것을 보여 주기 위해 ‘night’라는 단어가 나중에 추가되었다."],[6,"For example, in Scandinavia, there is an ancient story about King Vanlandi, who was killed by a mare.","예를 들어, 스칸디나비아에는 mare에게 죽임을 당한 Vanlandi 왕에 대한 고대의 이야기가 있다."],[10,"According to other traditions, mares can even suck the life out of people, just like vampires!","다른 전통에 따르면, mare는 심지어 마치 흡혈귀처럼 사람들의 생명을 빨아들일 수도 있다!"]],"w":"10번에서 다른 전통에 따르면 mare가 사람의 생명을 빨아들일 수 있다고 함. night는 나중에 추가됐고(3번), Vanlandi 이야기는 스칸디나비아(6번), mare는 사악한 유령(2번)이라 나머지는 모두 본문과 다름.","c":3},"h":"0c69e48bf8"},{"n":9,"t":"sum","q":"The word “nightmare” first meant an evil (A) that bothered people during sleep, but today it describes any scary (B).","ko":"‘nightmare’는 처음에는 잠자는 동안 사람들을 괴롭히는 사악한 (A)를 뜻했지만, 오늘날은 어떤 무서운 (B)든 묘사한다.","oko":["(A) 동물 / (B) 꿈","(A) 유령 / (B) 꿈","(A) 유령 / (B) 이야기","(A) 꿈 / (B) 유령","(A) 문화 / (B) 꿈"],"opts":["(A) animal / (B) dream","(A) spirit / (B) dream","(A) spirit / (B) story","(A) dream / (B) spirit","(A) culture / (B) dream"],"r":{"a":"2) (A) spirit / (B) dream","ev":"2~4번 문장","s":[[2,"The word “nightmare” originated from the Middle English word “mare,” which meant an evil spirit that bothered people during sleep.","‘nightmare’라는 단어는 중세 영어 단어인 ‘mare’에서 유래했는데, 그것은 잠자는 동안 사람들을 괴롭히는 사악한 유령을 의미했다."],[3,"The word “night” was added later to show that these spirits visited at night.","이러한 유령들이 밤에 방문했다는 것을 보여 주기 위해 ‘night’라는 단어가 나중에 추가되었다."],[4,"Nowadays, we use the word “nightmare” to describe any scary dream.","오늘날 우리는 어떤 무서운 꿈이든 묘사하기 위해 ‘nightmare’라는 단어를 사용한다."]],"w":"2번에서 mare는 사람들을 괴롭히는 evil spirit(사악한 유령), 4번에서 오늘날은 any scary dream(어떤 무서운 꿈이든)을 묘사한다고 함. 그래서 (A) spirit, (B) dream. 두 단어를 서로 바꾼 선지가 함정.","c":2},"h":"c329520ec2"},{"n":10,"t":"fill","q":"To keep nightmare creatures away, some people put [A] near the door, and other traditions say mares can [B] the life out of people.","ko":"악몽을 일으키는 생물을 쫓으려고 어떤 사람들은 문 근처에 [A]를 두고, 다른 전통에서는 mare가 사람들의 생명을 [B]할 수 있다고 한다.","bko":{"shoes":"신발","suck":"빨아들이다","vampires":"흡혈귀들","breathe":"숨 쉬다","spirit":"유령","bother":"괴롭히다"},"bank":["shoes","suck","vampires","breathe","spirit","bother"],"r":{"a":"[A] shoes, [B] suck","ev":"9~10번 문장","s":[[9,"To keep them away, some people put shoes near the door, cover the keyhole, or put something made of steel in their bed.","그것들을 멀리하기 위해, 어떤 사람들은 문 근처에 신발을 두거나, 열쇠 구멍을 막거나, 강철로 만든 무언가를 침대에 놓는다."],[10,"According to other traditions, mares can even suck the life out of people, just like vampires!","다른 전통에 따르면, mare는 심지어 마치 흡혈귀처럼 사람들의 생명을 빨아들일 수도 있다!"]],"w":"9번에서 문 근처(near the door)에 두는 것은 shoes(신발)이고, 10번에서 mares can suck(suck(빨아들이다))the life out of people. vampires(흡혈귀들)는 10번에서 비유로만 나온 말이라 문 근처에 두는 물건이 아니고, breathe(숨 쉬다)·bother(괴롭히다)·spirit(유령)은 이 두 빈칸의 뜻에 맞지 않음.","c":null},"h":"3b919121b3"}]},{"u":4,"id":"rg4-04-3","no":3,"ko":"몸속에 넣는 배터리가 암과 싸운다고?","items":[{"n":1,"t":"tf","q":"No other healthy cells are harmed during the process.","ko":"그 과정에서 다른 건강한 세포는 손상되지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"During the process, no other healthy cells are harmed.","그 과정에서, 어떠한 건강한 세포도 손상되지 않는다."]],"w":"7번 문장에 During the process, no other healthy cells are harmed가 나옴. 같은 내용이라 T.","c":"T"},"h":"da2325c2bf"},{"n":2,"t":"tf","q":"Strong medicine for cancer patients can make them feel sick.","ko":"암 환자를 위한 강한 약은 그들을 아프게 할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Cancer patients get strong medicine which can make them feel sick or cause various side effects.","암 환자들은 그들을 아프게 하거나 여러 가지 부작용을 일으킬 수 있는 강한 약을 받는다."]],"w":"1번 문장에 Cancer patients get strong medicine which can make them feel sick or cause various side effects. 같은 내용이라 T.","c":"T"},"h":"05d1e4632b"},{"n":3,"t":"tf","q":"Some significant side effects were observed in the mice.","ko":"쥐들에게서 몇몇 중대한 부작용이 관찰되었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Also, no significant side effects were observed.","또한, 어떠한 중대한 부작용도 관찰되지 않았다."]],"w":"10번 문장은 no significant side effects were observed(중대한 부작용이 관찰되지 않았다)임. 부작용이 관찰됐다는 말은 반대라서 F.","c":"F"},"h":"26ad1080d1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Also, no significant side effects were observed.)","ko":"또한, 어떠한 ( ) 부작용도 관찰되지 않았다.","opts":["작은","중대한","이상한","오래된"],"word":"significant","r":{"a":"2) 중대한","ev":"10번 문장","s":[[10,"Also, no significant side effects were observed.","또한, 어떠한 중대한 부작용도 관찰되지 않았다."]],"w":"10번은 부작용이 아주 중요한 수준으로는 나타나지 않았다는 말. significant = 중대한, 중요한. 앞의 1번에서 부작용이 문제였다는 흐름과도 이어짐.","c":2},"h":"f882230eff"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... it reduced the tumor size by 90 percent in most of the mice.)","ko":"... 그것은 쥐 대부분에서 종양의 크기를 90퍼센트까지 ( ).","opts":["늘렸다","바꿨다","줄였다","찾았다"],"word":"reduced","r":{"a":"3) 줄였다","ev":"9번 문장","s":[[9,"In just two weeks, it reduced the tumor size by 90 percent in most of the mice.","단 2주 만에, 그것은 쥐 대부분에서 종양의 크기를 90퍼센트까지 줄였다."]],"w":"9번에서 종양 크기가 90퍼센트 변했다는 것은 작아졌다는 뜻이고, 6번의 make the cancer smaller와도 같은 흐름. reduced = 줄였다. 늘렸다는 반대 뜻.","c":3},"h":"8bef464235"},{"n":6,"t":"ref","q":"What does the underlined “it” refer to?\nWhen the battery finds cancer, it uses the medicine to make the cancer smaller.","ko":"밑줄 친 it이 가리키는 것은?","sko":"배터리가 암을 발견하면, 그것은 암을 더 작게 만들기 위해 약을 사용한다.","opts":["암","약","환자","배터리"],"r":{"a":"4) 배터리","ev":"3번, 6번 문장","s":[[3,"They have developed a battery system that can be put inside the body.","그들은 몸속에 넣을 수 있는 배터리 시스템을 개발했다."],[6,"When the battery finds cancer, it uses the medicine to make the cancer smaller.","배터리가 암을 발견하면, 그것은 암을 더 작게 만들기 위해 약을 사용한다."]],"w":"6번에서 it uses the medicine에서 약을 쓰는 주체는 앞의 the battery(3번의 배터리 시스템). 약과 암은 쓰이는 대상이라 it이 아니고, 환자도 아님.","c":4},"h":"b89442fed9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It targets low-oxygen areas of the body that support tumor growth.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 종양 성장을 돕는 몸속의 저산소 구역을 목표로 삼는다.","opts":["산소가 많은 건강한 부위를 목표로 삼는다.","종양이 자라도록 돕는 산소가 적은 몸속 부위를 목표로 삼는다.","종양이 자라지 못하게 산소를 더 많이 보낸다.","산소가 적은 부위를 피해 건강한 세포만 찾아간다."],"r":{"a":"2) 종양이 자라도록 돕는 산소가 적은 몸속 부위를 목표로 삼는다.","ev":"4~5번 문장","s":[[4,"It targets low-oxygen areas of the body that support tumor growth.","그것은 종양 성장을 돕는 몸속의 저산소 구역을 목표로 삼는다."],[5,"Cancer cells and their surrounding areas have less oxygen compared to healthy cells.","암세포와 그 주변은 건강한 세포에 비해 산소가 더 적다."]],"w":"targets는 ‘목표로 삼는다’, low-oxygen areas는 산소가 적은 구역, that support tumor growth는 종양 성장을 돕는 구역을 꾸밈. 5번에서 암 주변은 산소가 적다고 했으므로 2번. 산소를 보내거나 피한다는 말은 본문에 없음.","c":2},"h":"4a44dc5513"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["과학자들은 암에 걸린 쥐들에게 이 시스템을 실험했다.","푸단 대학은 서울에 있는 대학이다.","이 시스템은 건강한 세포도 함께 손상시킨다.","이 방법은 이미 인간에게 성공적으로 실험되었다."],"opts":["Scientists tested this system on mice with cancer.","Fudan University is in Seoul.","This system harms healthy cells, too.","This method has already been successfully tested on humans."],"r":{"a":"1) Scientists tested this system on mice with cancer.","ev":"2번, 7~8번, 11번 문장","s":[[2,"Scientists from Fudan University in Shanghai found a potentially safer way to help these patients.","상하이에 있는 푸단 대학의 과학자들은 이러한 환자들을 돕는, 잠재적으로 더 안전한 방법을 찾아냈다."],[7,"During the process, no other healthy cells are harmed.","그 과정에서, 어떠한 건강한 세포도 손상되지 않는다."],[8,"Scientists tested this system on mice with cancer, and the results were amazing!","과학자들은 암에 걸린 쥐들에게 이 시스템을 실험했는데, 그 결과는 놀라웠다!"],[11,"This method hasn’t been tested on humans yet.","이 방법은 아직 인간에게는 실험되지 않았다."]],"w":"8번에서 암에 걸린 쥐들에게 이 시스템을 실험했다고 함. 푸단 대학은 상하이(2번), 건강한 세포는 손상되지 않고(7번), 인간에게는 아직 실험되지 않았으므로(11번) 나머지는 모두 본문과 다름.","c":1},"h":"a6555526a5"},{"n":9,"t":"sum","q":"Scientists developed a battery system that can (A) low-oxygen areas in the body and use medicine to make the cancer (B).","ko":"과학자들은 몸속의 저산소 구역을 (A)하고 약을 사용해 암을 (B) 만드는 배터리 시스템을 개발했다.","oko":["(A) 피하고 / (B) 더 작게","(A) 목표로 삼고 / (B) 더 크게","(A) 목표로 삼고 / (B) 더 작게","(A) 손상시키고 / (B) 더 크게","(A) 무시하고 / (B) 더 작게"],"opts":["(A) avoid / (B) smaller","(A) target / (B) bigger","(A) target / (B) smaller","(A) harm / (B) bigger","(A) ignore / (B) smaller"],"r":{"a":"3) (A) target / (B) smaller","ev":"3~4번, 6번 문장","s":[[3,"They have developed a battery system that can be put inside the body.","그들은 몸속에 넣을 수 있는 배터리 시스템을 개발했다."],[4,"It targets low-oxygen areas of the body that support tumor growth.","그것은 종양 성장을 돕는 몸속의 저산소 구역을 목표로 삼는다."],[6,"When the battery finds cancer, it uses the medicine to make the cancer smaller.","배터리가 암을 발견하면, 그것은 암을 더 작게 만들기 위해 약을 사용한다."]],"w":"4번에서 배터리가 low-oxygen areas를 target(목표로 삼음)하고, 6번에서 약을 써서 암을 smaller(더 작게) 만든다고 함. 그래서 target과 smaller. avoid·ignore·harm과 bigger는 본문과 반대.","c":3},"h":"7086427326"},{"n":10,"t":"fill","q":"In just two weeks, the battery system reduced the tumor size by [A] percent in most of the mice, and no significant [B] effects were observed.","ko":"단 2주 만에 배터리 시스템은 쥐 대부분에서 종양 크기를 [A]퍼센트 줄였고, 어떠한 중대한 [B] 효과도 관찰되지 않았다.","bko":{"90":"90 (구십)","side":"부수적인 (부작용의 ‘부’)","50":"50 (오십)","healthy":"건강한","oxygen":"산소","safer":"더 안전한"},"bank":["90","side","50","healthy","oxygen","safer"],"r":{"a":"[A] 90, [B] side","ev":"9~10번 문장","s":[[9,"In just two weeks, it reduced the tumor size by 90 percent in most of the mice.","단 2주 만에, 그것은 쥐 대부분에서 종양의 크기를 90퍼센트까지 줄였다."],[10,"Also, no significant side effects were observed.","또한, 어떠한 중대한 부작용도 관찰되지 않았다."]],"w":"9번에서 종양 크기를 90퍼센트 줄였고, 10번에서 no significant side effects(중대한 부작용 없음)가 관찰됐다고 함. 50은 숫자를 바꾼 함정이고, healthy·oxygen·safer는 두 빈칸에 들어가면 뜻이 맞지 않음.","c":null},"h":"73dd74fc7b"}]},{"u":5,"id":"rg4-05-1","no":1,"ko":"실수를 잘 살펴보는 아이가 더 빨리 배운다","items":[{"n":1,"t":"tf","q":"The study looked at 123 children aged six to eight.","ko":"그 연구는 6세에서 8세 사이의 아이들 123명을 대상으로 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"A psychologist at Michigan State University, studied 123 children aged six to eight.","미시간 주립 대학의 한 심리학자가 6세에서 8세 사이의 아이들 123명을 연구했다."]],"w":"3번 문장에 studied 123 children aged six to eight가 나옴. 같은 내용이라 T.","c":"T"},"h":"64642b3b45"},{"n":2,"t":"tf","q":"Some children believed that their intelligence can change.","ko":"어떤 아이들은 자신의 지능이 바뀔 수 있다고 믿었다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"Some of the children believed that they are born with a certain level of intelligence and it cannot change.","아이들 중 몇몇은 자신들이 특정한 수준의 지능을 가지고 태어나며 그것이 바뀔 수 없다고 믿었다."],[5,"Others believed that they can grow and become smarter through hard work.","다른 아이들은 고된 노력을 통해 자신들이 성장할 수 있고 더 똑똑해질 수 있다고 믿었다."]],"w":"4번의 어떤 아이들은 지능은 타고나서 it cannot change(바뀔 수 없다)고 믿었음. 바뀔 수 있다고 믿은 쪽은 5번의 다른 아이들이라 이 문장은 F.","c":"F"},"h":"743bb7b998"},{"n":3,"t":"tf","q":"The children wore special hats that recorded their brain activity.","ko":"아이들은 자신의 뇌 활동을 기록하는 특수한 모자를 썼다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"They wore special hats that recorded their brain activity.","그들은 자신의 뇌 활동을 기록하는 특수한 모자를 썼다."]],"w":"7번 문장에 They wore special hats that recorded their brain activity가 나옴. 같은 내용이라 T.","c":"T"},"h":"347af73ccf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... children with a fixed mindset tended to ignore their mistakes.)","ko":"... 고정된 사고방식을 지닌 아이들은 자신의 실수를 ( ) 경향이 있었다.","opts":["기억하다","무시하다","부러워하다","따라 하다"],"word":"ignore","r":{"a":"2) 무시하다","ev":"10번 문장","s":[[10,"On the other hand, children with a fixed mindset tended to ignore their mistakes.","반면에, 고정된 사고방식을 지닌 아이들은 자신의 실수를 무시하는 경향이 있었다."]],"w":"10번은 8~9번(실수에 주의를 기울임)과 반대되는 그룹 이야기. 그래서 ignore = 무시하다. 기억하거나 따라 한다는 뜻이면 반대 그룹이 되어 버림.","c":2},"h":"659e911b5a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They were also better at correcting their mistakes on the next try.)","ko":"그들은 또한 다음번 시도에서 자신의 실수를 ( ) 데 더 우수했다.","opts":["바로잡는","숨기는","반복하는","잊는"],"word":"correcting","r":{"a":"1) 바로잡는","ev":"9번 문장","s":[[9,"They were also better at correcting their mistakes on the next try.","그들은 또한 다음번 시도에서 자신의 실수를 바로잡는 데 더 우수했다."]],"w":"9번은 실수에 주의를 기울인 아이들이 다음 시도에서 더 잘한다는 흐름. correct = 바로잡다, 고치다. 숨기거나 반복하거나 잊는다면 ‘잘했다’는 뜻과 맞지 않음.","c":1},"h":"88bac3906e"},{"n":6,"t":"ref","q":"What does the underlined “They” refer to?\nThey were also better at correcting their mistakes on the next try.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 또한 다음번 시도에서 자신의 실수를 바로잡는 데 더 우수했다.","opts":["고정된 사고방식을 지닌 아이들","성장하는 사고방식을 지닌 아이들","미시간 주립 대학의 심리학자들","연구에 참여한 모든 아이들"],"r":{"a":"2) 성장하는 사고방식을 지닌 아이들","ev":"8~9번 문장","s":[[8,"The results showed that children with a growth mindset paid more attention to their mistakes.","결과는 성장하는 사고방식을 지닌 아이들이 자신의 실수에 더 많은 주의를 기울였다는 것을 보여 주었다."],[9,"They were also better at correcting their mistakes on the next try.","그들은 또한 다음번 시도에서 자신의 실수를 바로잡는 데 더 우수했다."]],"w":"8번에서 growth mindset을 가진 아이들이 실수에 더 주의를 기울였다고 하고, 9번의 They는 ‘또한(also)’으로 이어 그 아이들을 가리킴. 고정된 사고방식의 아이들은 10번에서 반대로 실수를 무시한다고 함.","c":2},"h":"ae2c9b80a1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This study shows that if you believe you can get smarter, you will be more likely to learn from your mistakes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 연구는 당신이 스스로 더 똑똑해질 수 있다고 믿는다면, 당신이 자신의 실수로부터 배울 가능성이 더 높다는 것을 보여 준다.","opts":["똑똑해질 수 있다고 믿으면 실수를 더 많이 하게 된다.","실수로부터 배우면 반드시 똑똑해진다고 믿게 된다.","스스로 더 똑똑해질 수 있다고 믿으면 실수로부터 배울 가능성이 더 높다.","똑똑해질 수 없다고 믿을수록 실수로부터 더 잘 배운다."],"r":{"a":"3) 스스로 더 똑똑해질 수 있다고 믿으면 실수로부터 배울 가능성이 더 높다.","ev":"11번 문장","s":[[11,"This study shows that if you believe you can get smarter, you will be more likely to learn from your mistakes.","이 연구는 당신이 스스로 더 똑똑해질 수 있다고 믿는다면, 당신이 자신의 실수로부터 배울 가능성이 더 높다는 것을 보여 준다."]],"w":"if 뒤가 조건(똑똑해질 수 있다고 믿으면), 뒤가 결과(실수로부터 배울 가능성이 더 높다). 믿음이 먼저, 배움이 결과임. 원인과 결과가 뒤바뀐 선지나 반대 뜻은 오답.","c":3},"h":"3caaf7dde7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["아이들은 책을 읽는 시험을 보았다.","연구에서는 아이들의 뇌 활동을 기록하지 않았다.","고정된 사고방식을 지닌 아이들이 실수를 더 잘 고쳤다.","연구에 참여한 아이들은 6세에서 8세 사이였다."],"opts":["The children took a reading test.","The brain activity of the children was not recorded.","Children with a fixed mindset were better at correcting mistakes.","The children in the study were between six and eight years old."],"r":{"a":"4) The children in the study were between six and eight years old.","ev":"3번, 6~7번, 9~10번 문장","s":[[3,"A psychologist at Michigan State University, studied 123 children aged six to eight.","미시간 주립 대학의 한 심리학자가 6세에서 8세 사이의 아이들 123명을 연구했다."],[6,"In the study, the children played a computer game to catch animals.","연구에서, 아이들은 동물을 잡는 컴퓨터 게임을 했다."],[7,"They wore special hats that recorded their brain activity.","그들은 자신의 뇌 활동을 기록하는 특수한 모자를 썼다."],[9,"They were also better at correcting their mistakes on the next try.","그들은 또한 다음번 시도에서 자신의 실수를 바로잡는 데 더 우수했다."],[10,"On the other hand, children with a fixed mindset tended to ignore their mistakes.","반면에, 고정된 사고방식을 지닌 아이들은 자신의 실수를 무시하는 경향이 있었다."]],"w":"3번에서 연구 대상은 6~8세 아이들. 아이들은 컴퓨터 게임을 했고(6번), 뇌 활동을 기록했고(7번), 실수를 더 잘 고친 쪽은 성장하는 사고방식의 아이들(9번)이라 나머지는 모두 본문과 다름.","c":4},"h":"3a5f0302dc"},{"n":9,"t":"sum","q":"Children with a growth mindset paid more (A) to their mistakes and were better at (B) them on the next try.","ko":"성장하는 사고방식을 지닌 아이들은 자신의 실수에 더 많은 (A)를 기울였고 다음 시도에서 그것을 (B)하는 데 더 우수했다.","oko":["(A) 주의 / (B) 무시","(A) 지원 / (B) 반복","(A) 돈 / (B) 바로잡","(A) 주의 / (B) 반복","(A) 주의 / (B) 바로잡"],"opts":["(A) attention / (B) ignoring","(A) support / (B) repeating","(A) money / (B) correcting","(A) attention / (B) repeating","(A) attention / (B) correcting"],"r":{"a":"5) (A) attention / (B) correcting","ev":"8~9번 문장","s":[[8,"The results showed that children with a growth mindset paid more attention to their mistakes.","결과는 성장하는 사고방식을 지닌 아이들이 자신의 실수에 더 많은 주의를 기울였다는 것을 보여 주었다."],[9,"They were also better at correcting their mistakes on the next try.","그들은 또한 다음번 시도에서 자신의 실수를 바로잡는 데 더 우수했다."]],"w":"8번에서 실수에 더 많은 attention(주의)을 기울였고, 9번에서 실수를 correcting(바로잡는 것)에 더 우수했다고 함. ignoring은 10번 고정된 사고방식 아이들의 특징, repeating·money·support는 본문에 없는 말.","c":5},"h":"dea662db37"},{"n":10,"t":"fill","q":"Children with a fixed mindset tended to [A] their mistakes, and believing you can get smarter makes you more likely to [B] from them.","ko":"고정된 사고방식을 지닌 아이들은 자신의 실수를 [A]하는 경향이 있었고, 더 똑똑해질 수 있다고 믿으면 실수로부터 [B]할 가능성이 더 높아진다.","bko":{"ignore":"무시하다","learn":"배우다","attention":"주의","smarter":"더 똑똑한","brain":"뇌","mindset":"사고방식"},"bank":["ignore","learn","attention","smarter","brain","mindset"],"r":{"a":"[A] ignore, [B] learn","ev":"10~11번 문장","s":[[10,"On the other hand, children with a fixed mindset tended to ignore their mistakes.","반면에, 고정된 사고방식을 지닌 아이들은 자신의 실수를 무시하는 경향이 있었다."],[11,"This study shows that if you believe you can get smarter, you will be more likely to learn from your mistakes.","이 연구는 당신이 스스로 더 똑똑해질 수 있다고 믿는다면, 당신이 자신의 실수로부터 배울 가능성이 더 높다는 것을 보여 준다."]],"w":"10번에서 고정된 사고방식의 아이들은 실수를 ignore(무시하다)하는 경향이 있고, 11번에서 더 똑똑해질 수 있다고 믿으면 실수로부터 learn(배우다) 가능성이 높다고 함. attention(주의)·brain(뇌)·mindset(사고방식)은 명사, smarter(더 똑똑한)는 형용사라서 ‘~하는 경향이 있었고’, ‘~할 가능성이 높다’ 뒤의 동사 자리에 들어갈 수 없음.","c":null},"h":"7b54796134"}]},{"u":5,"id":"rg4-05-2","no":2,"ko":"배 속 박테리아가 기분을 바꾼다고?","items":[{"n":1,"t":"tf","q":"When we are anxious, we might have an upset stomach.","ko":"우리가 불안할 때, 배탈이 날 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"For example, when we’re anxious, we might have an upset stomach.","예를 들어, 우리가 불안할 때, 배탈이 날 수도 있다."]],"w":"2번 문장에 when we’re anxious, we might have an upset stomach이 나옴. 같은 내용이라 T.","c":"T"},"h":"3f4376227a"},{"n":2,"t":"tf","q":"Researchers added bad bacteria to the guts of mice.","ko":"연구원들은 쥐의 소화기관에 나쁜 박테리아를 넣었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In a study with mice, researchers removed good bacteria from their guts.","쥐를 대상으로 한 연구에서, 연구원들은 그것들의 소화기관에서 좋은 박테리아를 제거했다."]],"w":"4번에서 연구원들이 한 일은 쥐의 소화기관에서 good bacteria(좋은 박테리아)를 제거한 것. 나쁜 박테리아를 넣었다는 말은 본문에 없어서 F.","c":"F"},"h":"5516aeee6a"},{"n":3,"t":"tf","q":"Giving good bacteria to stressed mice made them less stressed.","ko":"스트레스 받은 쥐에게 좋은 박테리아를 주자 쥐들은 스트레스를 덜 받았다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"But when they gave the stressed mice good bacteria, which are called probiotics, the mice became less stressed and their anxiety disappeared.","그러나 그들이 프로바이오틱스라고 불리는 좋은 박테리아를 스트레스 받은 쥐에게 주었을 때, 쥐들은 스트레스를 덜 받았고 불안감이 사라졌다."]],"w":"6번에서 좋은 박테리아(probiotics)를 스트레스 받은 쥐에게 주자 the mice became less stressed라고 함. 같은 내용이라 T.","c":"T"},"h":"59f31ac7da"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This made the mice more stressed and anxious.)","ko":"이것은 쥐를 더 스트레스받고 ( )하게 만들었다.","opts":["졸린","불안한","행복한","배고픈"],"word":"anxious","r":{"a":"2) 불안한","ev":"2번, 5번 문장","s":[[2,"For example, when we’re anxious, we might have an upset stomach.","예를 들어, 우리가 불안할 때, 배탈이 날 수도 있다."],[5,"This made the mice more stressed and anxious.","이것은 쥐를 더 스트레스받고 불안하게 만들었다."]],"w":"5번은 좋은 박테리아가 사라진 쥐가 stressed(스트레스받은)와 함께 anxious해졌다는 말. 2번의 ‘불안할 때 배탈이 난다’와 같은 단어. anxious = 불안한. 행복한은 반대.","c":2},"h":"685620f8c5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... consuming fermented foods such as yogurt, pickles, and kimchi can reduce these anxious feelings.)","ko":"... 요구르트, 피클, 김치와 같은 발효 식품을 ( ) 것이 이러한 불안한 감정을 줄일 수 있다.","opts":["만드는 것","파는 것","먹는(섭취하는) 것","버리는 것"],"word":"consuming","r":{"a":"3) 먹는(섭취하는) 것","ev":"8번 문장","s":[[8,"In fact, researchers also found that consuming fermented foods such as yogurt, pickles, and kimchi can reduce these anxious feelings.","사실, 연구원들은 요구르트, 피클, 그리고 김치와 같은 발효 식품을 먹는 것이 이러한 불안한 감정을 줄일 수 있다는 것도 발견했다."]],"w":"8번은 발효 식품을 consuming하면 불안한 감정이 줄어든다는 말. 음식을 먹어서 몸에 들어가야 효과가 있으므로 consuming = 먹는, 섭취하는. 만들거나 파는 것으로는 감정이 줄지 않음.","c":3},"h":"c1f6cb3fdd"},{"n":6,"t":"ref","q":"What does the underlined “They” refer to?\nThey think that these good bacteria might work similarly to medicines that improve our mood.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 이 좋은 박테리아가 우리의 기분을 향상시키는 약과 비슷하게 작용할지도 모른다고 생각한다.","opts":["연구원들","쥐들","좋은 박테리아","발효 식품"],"r":{"a":"1) 연구원들","ev":"8번, 10번 문장","s":[[8,"In fact, researchers also found that consuming fermented foods such as yogurt, pickles, and kimchi can reduce these anxious feelings.","사실, 연구원들은 요구르트, 피클, 그리고 김치와 같은 발효 식품을 먹는 것이 이러한 불안한 감정을 줄일 수 있다는 것도 발견했다."],[10,"They think that these good bacteria might work similarly to medicines that improve our mood.","그들은 이 좋은 박테리아가 우리의 기분을 향상시키는 약과 비슷하게 작용할지도 모른다고 생각한다."]],"w":"10번의 They think that ...에서 ‘생각하는’ 주체는 사람. 8번에서 발견한 연구원들(researchers)을 가리킴. 좋은 박테리아는 these good bacteria로 따로 나오고, 쥐나 음식은 생각하지 않음.","c":1},"h":"a0d7724f01"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For a long time, people have known that our feelings can affect our stomachs.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오랫동안 사람들은 우리의 감정이 위에 영향을 미칠 수 있다는 것을 알아 왔다.","opts":["사람들은 위가 감정에 영향을 준다는 것을 오래전부터 알았다.","사람들은 감정이 위에 영향을 준다는 것을 최근에야 알았다.","오랫동안 사람들은 위가 아프면 감정도 사라진다고 믿었다.","오랫동안 사람들은 감정이 위에 영향을 줄 수 있다는 것을 알아 왔다."],"r":{"a":"4) 오랫동안 사람들은 감정이 위에 영향을 줄 수 있다는 것을 알아 왔다.","ev":"1번, 3번 문장","s":[[1,"For a long time, people have known that our feelings can affect our stomachs.","오랫동안 사람들은 우리의 감정이 위(胃)에 영향을 미칠 수 있다는 것을 알아 왔다."],[3,"But now, researchers are discovering that our stomachs affect our feelings too: The many tiny bacteria in our guts can influence how we feel.","하지만 이제, 연구원들은 위가 우리의 감정에도 영향을 미친다는 것을 알아내고 있다. 즉, 우리 소화기관 내의 많은 아주 작은 박테리아는 우리가 느끼는 방식에 영향을 줄 수 있다."]],"w":"For a long time(오랫동안)이 ‘최근에야’와 다르고, our feelings can affect our stomachs는 감정 → 위 방향. 위 → 감정은 3번에서 But now로 새로 알아내고 있는 내용이라 1번 선지는 방향이 뒤바뀜.","c":4},"h":"c6585116f5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["쥐의 소화기관에서 좋은 박테리아를 없애도 쥐의 스트레스는 변하지 않았다.","발효 식품 속 작은 박테리아는 소화와 정신 건강에 도움을 준다.","발효 식품을 먹으면 불안한 감정이 더 늘어난다.","배탈은 감정과 아무 관계가 없다."],"opts":["Removing good bacteria from the guts of mice did not change their stress.","The tiny bacteria in fermented foods help with digestion and mental health.","Eating fermented foods makes anxious feelings grow.","An upset stomach has nothing to do with feelings."],"r":{"a":"2) The tiny bacteria in fermented foods help with digestion and mental health.","ev":"2번, 5번, 8~9번 문장","s":[[2,"For example, when we’re anxious, we might have an upset stomach.","예를 들어, 우리가 불안할 때, 배탈이 날 수도 있다."],[5,"This made the mice more stressed and anxious.","이것은 쥐를 더 스트레스받고 불안하게 만들었다."],[8,"In fact, researchers also found that consuming fermented foods such as yogurt, pickles, and kimchi can reduce these anxious feelings.","사실, 연구원들은 요구르트, 피클, 그리고 김치와 같은 발효 식품을 먹는 것이 이러한 불안한 감정을 줄일 수 있다는 것도 발견했다."],[9,"The tiny bacteria in these foods help with digestion and our mental health.","이 음식들에 있는 아주 작은 박테리아가 소화와 우리의 정신 건강에 도움을 준다."]],"w":"9번에서 발효 식품 속 작은 박테리아가 소화와 정신 건강에 도움을 준다고 함. 좋은 박테리아를 없애면 더 스트레스받고(5번), 발효 식품은 불안을 줄이고(8번), 불안하면 배탈이 날 수 있어(2번) 나머지는 모두 본문과 다름.","c":2},"h":"1da40ef2ff"},{"n":9,"t":"sum","q":"When researchers removed good bacteria from mice, the mice became more (A), but when good bacteria were given to them, their anxiety (B).","ko":"연구원들이 쥐에게서 좋은 박테리아를 제거하자 쥐들은 더 (A)해졌지만, 좋은 박테리아를 주자 불안감이 (B).","oko":["(A) 차분 / (B) 사라졌다","(A) 건강 / (B) 늘었다","(A) 차분 / (B) 늘었다","(A) 불안 / (B) 사라졌다","(A) 불안 / (B) 늘었다"],"opts":["(A) calm / (B) disappeared","(A) healthy / (B) increased","(A) calm / (B) increased","(A) anxious / (B) disappeared","(A) anxious / (B) increased"],"r":{"a":"4) (A) anxious / (B) disappeared","ev":"4~6번 문장","s":[[4,"In a study with mice, researchers removed good bacteria from their guts.","쥐를 대상으로 한 연구에서, 연구원들은 그것들의 소화기관에서 좋은 박테리아를 제거했다."],[5,"This made the mice more stressed and anxious.","이것은 쥐를 더 스트레스받고 불안하게 만들었다."],[6,"But when they gave the stressed mice good bacteria, which are called probiotics, the mice became less stressed and their anxiety disappeared.","그러나 그들이 프로바이오틱스라고 불리는 좋은 박테리아를 스트레스 받은 쥐에게 주었을 때, 쥐들은 스트레스를 덜 받았고 불안감이 사라졌다."]],"w":"5번에서 좋은 박테리아를 없앤 쥐는 더 stressed and anxious, 6번에서 좋은 박테리아를 주자 their anxiety disappeared. 그래서 (A) anxious, (B) disappeared. (B)를 increased로 바꾼 선지가 함정.","c":4},"h":"e972b82fe3"},{"n":10,"t":"fill","q":"The tiny bacteria in fermented foods help with digestion and mental health, and they might work similarly to [A] that improve our [B].","ko":"발효 식품 속 아주 작은 박테리아는 소화와 정신 건강에 도움을 주고, 우리의 [B]을(를) 향상시키는 [A]와 비슷하게 작용할지도 모른다.","bko":{"medicines":"약","mood":"기분","mice":"쥐들","kimchi":"김치","disappear":"사라지다","stressed":"스트레스를 받은"},"bank":["medicines","mood","mice","kimchi","disappear","stressed"],"r":{"a":"[A] medicines, [B] mood","ev":"9~10번 문장","s":[[9,"The tiny bacteria in these foods help with digestion and our mental health.","이 음식들에 있는 아주 작은 박테리아가 소화와 우리의 정신 건강에 도움을 준다."],[10,"They think that thes
