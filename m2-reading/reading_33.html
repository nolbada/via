<script>
var D=[{"n": 1, "tag": null, "en": "You may knows Florence Nightingale as an nurse who helped sick people. But did you also knew that she was good at math?", "ko": "여러분은 Florence Nightingale을 아픈 사람들을 도운 간호사라고 알고 있을지 모른다. 그러나 여러분은 그녀가 수학 또한 잘했다는 것을 알고 있었는가?", "ok": false, "foot": [], "fixes": [{"wrong": "knows", "right": "know", "partial": false, "at": [2], "point": "조동사 뒤 동사원형: 조동사 may 뒤에는 동사원형 know 사용", "topic": "조동사 뒤 동사원형", "memo": "조동사 may 뒤에는 동사원형 know 사용"}, {"wrong": "an", "right": "a", "partial": false, "at": [6], "point": "관사 a/an: nurse는 자음 소리로 시작하므로 a 사용", "topic": "관사 a/an", "memo": "nurse는 자음 소리로 시작하므로 a 사용"}, {"wrong": "knew", "right": "know", "partial": false, "at": [16], "point": "did 뒤 동사원형: did 뒤에는 동사원형 know 사용", "topic": "did 뒤 동사원형", "memo": "did 뒤에는 동사원형 know 사용"}]}, {"n": 2, "tag": null, "en": "When she was young, Nightingale liked playing with number. She enjoyed counting travel time and distance on family trips.", "ko": "Nightingale은 어릴 때 숫자를 가지고 노는 것을 좋아했다. 그녀는 가족 여행에서 여행 시간과 거리를 세는 것을 즐겼다.", "ok": false, "foot": [], "fixes": [{"wrong": "number", "right": "numbers", "partial": false, "at": [8], "point": "가산명사 복수형: 여러 숫자이므로 복수 numbers 사용", "topic": "가산명사 복수형", "memo": "여러 숫자이므로 복수 numbers 사용"}]}, {"n": 3, "tag": null, "en": "Then she gathered the numbers and record them as data. Nightingale knew that data was important.", "ko": "그러고 나서 그녀는 그 숫자들을 모으고 그것들을 데이터로 기록했다. Nightingale은 데이터가 중요하다는 것을 알았다.", "ok": false, "foot": [], "fixes": [{"wrong": "record", "right": "recorded", "partial": false, "at": [6], "point": "시제: 과거 서술이므로 recorded (record 아님)", "topic": "시제", "memo": "과거 서술이므로 recorded (record 아님)"}]}, {"n": 4, "tag": null, "en": "She used data to solve problems.", "ko": "그녀는 문제를 해결하기 위해 데이터를 사용했다.", "ok": true, "foot": [], "fixes": []}, {"n": 5, "tag": null, "en": "During the Crimean War, Nightingale went at the battlefield to help sick soldier. The hospital was more worse than she thought.", "ko": "크림전쟁 동안 Nightingale은 아픈 군인들을 돕기 위해 전쟁터에 dirty hospital than in battle.", "전투에서보다 더러운 병원에서 더 많은 군인들이 아프고 죽었다.", 0], ["She wanted to change that.", "그녀는 그것을 변화시키고 싶었다.", 0], ["She asked England to make the hospital much cleaner and safer.", "그녀는 병원을 훨씬 더 깨끗하고 더 안전하게 만들어달라고 영국에 요청했다.", 0], ["However, the leaders of England didn't understand.", "그러나 영국의 지도자들은 이해하지 못했다.", 0], ["To help them see the problem, she collected data about the number of wounded and dead soldiers.", "그들이 문제를 이해하도록 돕기 위해, 그녀는 부상을 입고 죽은 군인들의 숫자에 대한 데이터를 수집했다.", 0], ["However, showing her findings with just numbers was difficult.", "그러나 그녀의 조사 결과를 단지 숫자로만 보여주는 것은 어려웠다.", 0], ["To solve this problem, Nightingale created a simple picture.", "문제를 해결하기 위해 Nightingale은 간단한 그림을 만들었다.", 1], ["It is called Nightingale's rose diagram.", "그것은 Nightingale의 로즈 다이어그램이라고 불린다.", 0], ["The diagram looked like a rose with twelve petals.", "그 다이어그램은 12개의 꽃잎이 있는 장미처럼 보였다.", 0], ["Each petal showed a month, and larger petals meant more deaths.", "각 꽃잎은 한 달을 나타내고, 더 큰 꽃잎은 더 많은 죽음을 의미했다.", 0], ["In the rose diagram, three different colors were used by Nightingale: blue, red, and black.", "로즈 다이어그램에서 Nightingale에 의해 세 개의 다른 색깔이 사용되었다: 파란색, 빨간색, 그리고 검은색이다.", 0], ["Blue is for disease, red is for battle wounds, and black is for other causes.", "파란색은 질병, 빨간색은 전투 부상, 그리고 검은색은 다른 원인을 나타낸다.", 0], ["Surprisingly, the blue part was the largest!", "놀랍게도, 파란색 부분이 가장 컸다!", 0], ["Nightingale used this diagram to show her data simply and clearly.", "Nightingale은 그녀의 데이터를 간단하고 분명히 보여 주기 위해 이 다이어그램을 사용했다.", 0], ["She was very smart and creative.", "그녀는 매우 똑똑하고 창의적이었다.", 0]];var RNUM=33;var TITLE_EN="Data Saved Thousands of Lives";var PASS_EN=["Data Saved Thousands of Lives", "You may know Florence Nightingale as a nurse who helped sick people. But did you also know that she was good at math? When she was young, Nightingale liked playing with numbers. She enjoyed counting travel time and distance on family trips. Then she gathered the numbers and recorded them as data. Nightingale knew that data was important. She used data to solve problems.", "During the Crimean War, Nightingale went to the battlefield to help sick soldiers. The hospital was much worse than she thought. It was dirty, messy, and full of bugs! Nightingale knew that dirty hospitals could be bad for the soldiers. More soldiers got sick and died in the dirty hospital than in battle. She wanted to change that. She asked England to make the hospital much cleaner and safer. However, the leaders of England didn't understand. To help them see the problem, she collected data about the number of wounded and dead soldiers. However, showing her findings with just numbers was difficult.", "To solve this problem, Nightingale created a simple picture. It is called Nightingale's rose diagram. The diagram looked like a rose with twelve petals. Each petal showed a month, and larger petals meant more deaths. In the rose diagram, three different colors were used by Nightingale: blue, red, and black. Blue is for disease, red is for battle wounds, and black is for other causes. Surprisingly, the blue part was the largest! Nightingale used this diagram to show her data simply and clearly. She was very smart and creative."];var PASS_KO=["데이터가 수천 명의 목숨을 구했다", "여러분은 Florence Nightingale을 아픈 사람들을 도운 간호사라고 알고 있을지 모른다. 그러나 여러분은 그녀가 수학 또한 잘했다는 것을 알고 있었는가? Nightingale은 어릴 때 숫자를 가지고 노는 것을 좋아했다. 그녀는 가족 여행에서 여행 시간과 거리를 세는 것을 즐겼다. 그러고 나서 그녀는 그 숫자들을 모으고 그것들을 데이터로 기록했다. Nightingale은 데이터가 중요하다는 것을 알았다. 그녀는 문제를 해결하기 위해 데이터를 사용했다.", "크림전쟁 동안 Nightingale은 아픈 군인들을 돕기 위해 전쟁터에 갔다. 병원은 그녀가 생각했던 것보다 훨씬 더 형편없었다. 그것은 더럽고, 지저분하고, 벌레로 가득 차 있었다! Nightingale은 더러운 병원이 군인들에게 안 좋을 수 있다는 것을 알았다. 전투에서보다 더러운 병원에서 더 많은 군인들이 아프고 죽었다. 그녀는 그것을 변화시키고 싶었다. 그녀는 병원을 훨씬 더 깨끗하고 더 안전하게 만들어달라고 영국에 요청했다. 그러나 영국의 지도자들은 이해하지 못했다. 그들이 문제를 이해하도록 돕기 위해, 그녀는 부상을 입고 죽은 군인들의 숫자에 대한 데이터를 수집했다. 그러나 그녀의 조사 결과를 단지 숫자로만 보여주는 것은 어려웠다.", "문제를 해결하기 위해 Nightingale은 간단한 그림을 만들었다. 그것은 Nightingale의 로즈 다이어그램이라고 불린다. 그 다이어그램은 12개의 꽃잎이 있는 장미처럼 보였다. 각 꽃잎은 한 달을 나타내고, 더 큰 꽃잎은 더 많은 죽음을 의미했다. 로즈 다이어그램에서 Nightingale에 의해 세 개의 다른 색깔이 사용되었다: 파란색, 빨간색, 그리고 검은색이다. 파란색은 질병, 빨간색은 전투 부상, 그리고 검은색은 다른 원인을 나타낸다. 놀랍게도, 파란색 부분이 가장 컸다! Nightingale은 그녀의 데이터를 간단하고 분명히 보여 주기 위해 이 다이어그램을 사용했다. 그녀는 매우 똑똑하고 창의적이었다."];
