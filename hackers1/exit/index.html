말이에요.","c":2},"h":"8203013338"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nSo far, Ella and her family have donated thousands of Medi Teddys to children’s hospitals.","ko":"밑줄 친 her가 가리키는 것은?","opts":["Ella","Ella의 친구","병원의 의사","Medi Teddy 인형"],"sko":"지금까지, Ella와 그녀의 가족은 수천 개의 Medi Teddy를 아동 병원에 기부해왔다.","r":{"a":"1) Ella","ev":"10번 문장","s":[[10,"So far, Ella and her family have donated thousands of Medi Teddys to children’s hospitals.","지금까지, Ella와 그녀의 가족은 수천 개의 Medi Teddy를 아동 병원에 기부해왔다."]],"w":"10번 문장의 Ella and her family에서 her는 Ella를 가리켜요. 그러니까 her family는 Ella의 가족이에요.","c":1,"k":"her = Ella"},"pron":"her","h":"ac99c4ecbc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Ella’s small but great idea has made hospitals friendlier places.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["Ella는 작은 병원을 더 큰 곳으로 만들었다.","Ella의 큰 병원이 아이들을 더 친절하게 만들었다.","Ella의 발상은 너무 작아서 병원에 도움이 되지 않았다.","Ella의 작지만 훌륭한 발상이 병원을 더 친숙한 곳으로 만들었다."],"sko":"Ella의 작지만 훌륭한 발상이 병원을 더 친숙한 곳으로 만들었다.","r":{"a":"4) Ella의 작지만 훌륭한 발상이 병원을 더 친숙한 곳으로 만들었다.","ev":"11번 문장","s":[[11,"Ella’s small but great idea has made hospitals friendlier places.","Ella의 작지만 훌륭한 발상이 병원을 더 친숙한 곳으로 만들었다."]],"w":"small but great는 '작지만 훌륭한'이고, make A B는 'A를 B로 만들다'예요. 병원(A)을 더 친숙한 곳(B)으로 만들었다는 뜻이에요.","c":4},"h":"9f2c5516c2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Ella’s doctor created the Medi Teddy.","Ella created the Medi Teddy.","Ella’s mother created the Medi Teddy.","Ella bought the Medi Teddy at a store."],"oko":["Ella의 의사가 Medi Teddy를 만들었다.","Ella가 Medi Teddy를 만들었다.","Ella의 어머니가 Medi Teddy를 만들었다.","Ella는 가게에서 Medi Teddy를 샀다."],"r":{"a":"2) Ella created the Medi Teddy. (Ella가 Medi Teddy를 만들었다.)","ev":"7번 문장","s":[[7,"So Ella created the Medi Teddy.","그래서 Ella는 Medi Teddy를 만들었다."]],"w":"7번 문장에서 Ella가 Medi Teddy를 만들었다고 했어요.","c":2},"h":"6f5fe8c29a"},{"n":9,"t":"sum","q":"Hospitals are not (A) places, but the bag doesn’t look (B) anymore with the Medi Teddy.","ko":"병원은 (A) 곳이 아니지만, Medi Teddy 덕분에 주머니는 더는 (B) 보이지 않는다.","opts":["(A) dirty / (B) scary","(A) pleasant / (B) heavy","(A) pleasant / (B) scary","(A) dirty / (B) heavy","(A) quiet / (B) big"],"oko":["(A) 더러운 / (B) 무섭게","(A) 유쾌한 / (B) 무겁게","(A) 유쾌한 / (B) 무섭게","(A) 더러운 / (B) 무겁게","(A) 조용한 / (B) 크게"],"r":{"a":"3) (A) pleasant / (B) scary ((A) 유쾌한 / (B) 무섭게)","ev":"1번, 9번 문장","s":[[1,"Hospitals are not pleasant places.","병원은 유쾌한 곳이 아니다."],[9,"The bag doesn’t look scary anymore this way.","이렇게 하면 그 주머니는 더는 무섭게 보이지 않는다."]],"w":"1번 문장에서 병원은 유쾌한(pleasant) 곳이 아니라고 했고, 9번 문장에서 이렇게 하면 주머니가 더는 무섭게(scary) 보이지 않는다고 했어요.","c":3},"h":"65acce0378"},{"n":10,"t":"fill","q":"She had a [A] disease and needed to get an IV every [B] months.","ko":"그녀는 [A] 병을 앓고 있어 [B] 달마다 링거를 맞아야 했다.","bank":["rare","two","pouch","donated","thousands","fully"],"bko":{"rare":"희귀한","two":"두","pouch":"주머니","donated":"기부했다(donate의 과거)","thousands":"수천(thousand의 복수형)","fully":"완전히"},"r":{"a":"[A] rare (희귀한), [B] two (두)","ev":"5번 문장","s":[[5,"She had a rare disease and needed to get an IV every two months.","그녀는 희귀병을 앓고 있어 두 달마다 링거를 맞아야 했다."]],"w":"5번 문장에서 그녀는 희귀한(rare) 병이 있어서 두(two) 달마다 링거를 맞아야 했다고 했어요. disease 앞에는 형용사가, months 앞에는 수를 나타내는 말이 와요.","c":null},"h":"12cde094b2"}]},{"u":5,"id":"hk1-05-1","no":1,"ko":"이름이 뭐예요?","items":[{"n":1,"t":"tf","q":"The explorers had never seen an animal like a kangaroo before.","ko":"탐험가들은 이전에 캥거루 같은 동물을 본 적이 전혀 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"They had never seen an animal like this before.","그들은 이전에 이것과 같은 동물을 본 적이 전혀 없었다."]],"w":"5번 문장에 had never seen an animal like this before가 있어요. 탐험가들에게 캥거루는 처음 보는 동물이었어요.","c":"T"},"h":"022b56ae31"},{"n":2,"t":"tf","q":"The explorers kept the new animal a secret after they returned home.","ko":"탐험가들은 집으로 돌아온 후 그 새로운 동물을 비밀로 했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"After the explorers returned home, they told everyone about the new animal called kangaroo.","탐험가들은 집으로 돌아온 후, 모두에게 캥거루라고 불리는 새로운 동물에 관해 얘기했다."]],"w":"8번 문장에서 탐험가들은 집으로 돌아온 후 모두에게(told everyone) 새로운 동물에 관해 얘기했어요. 비밀로 했다는 말은 반대예요.","c":"F"},"h":"0ff5573c77"},{"n":3,"t":"tf","q":"The explorers asked the natives, \"What is this animal?\"","ko":"탐험가들은 원주민들에게 \"이 동물은 무엇입니까?\"라고 물었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"So they asked the natives, “What is this animal?”","그래서 그들은 원주민들에게 “이 동물은 무엇입니까?”라고 물었다."]],"w":"6번 문장에서 탐험가들이 원주민들에게 그렇게 물었어요. 질문한 쪽은 탐험가들이고 대답한 쪽은 원주민들이에요.","c":"T"},"h":"3dec7edc6d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (There, they saw an animal that was very unusual.)","ko":"그곳에서, 그들은 매우 특이한 동물을 보았다.","opts":["평범한","귀여운","특이한","거대한"],"word":"unusual","r":{"a":"3) 특이한","ev":"2번 문장","s":[[2,"There, they saw an animal that was very unusual.","그곳에서, 그들은 매우 특이한 동물을 보았다."]],"w":"2번 문장의 unusual은 5번에서 '이전에 본 적이 전혀 없었다'고 한 것과 이어져요. 평범하지 않은 처음 보는 동물이니 '특이한'이에요.","c":3},"h":"8600edc2a0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (From then on, the name spread all over the world.)","ko":"그 이후, 그 이름은 전 세계에 퍼졌다.","opts":["퍼졌다","멈췄다","사라졌다","바뀌었다"],"word":"spread","r":{"a":"1) 퍼졌다","ev":"9번 문장","s":[[9,"From then on, the name spread all over the world.","그 이후, 그 이름은 전 세계에 퍼졌다."]],"w":"spread(퍼지다)는 'all over the world(전 세계에)'와 이어져요. 8번에서 탐험가들이 모두에게 얘기했으니 이름이 널리 퍼진 거예요.","c":1},"h":"f984215850"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nIt also had a pouch on its belly to carry its baby.","ko":"밑줄 친 its가 가리키는 것은?","sko":"그것은 또한 배에 새끼를 데리고 다닐 주머니가 있었다.","opts":["탐험가들","원주민들","그 동물","주머니"],"r":{"a":"3) 그 동물","ev":"2~4번 문장","s":[[2,"There, they saw an animal that was very unusual.","그곳에서, 그들은 매우 특이한 동물을 보았다."],[3,"It had large ears and hopped around on two legs.","그것은 큰 귀를 가지고 있었고 두 다리로 깡충깡충 뛰어다녔다."],[4,"It also had a pouch on its belly to carry its baby.","그것은 또한 배에 새끼를 데리고 다닐 주머니가 있었다."]],"w":"배에 주머니가 있고 새끼를 데리고 다니는 것은 2번에서 본 특이한 동물(3번의 It)이에요. its는 그 동물의 것이라는 뜻이에요.","c":3},"h":"fb3949dbc0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The truth is, the natives didn’t know the name, either!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사실은, 원주민들도 그 이름을 몰랐다!","opts":["사실은 원주민들만 그 이름을 알고 있었다.","사실은 원주민들도 그 이름을 알지 못했다.","사실은 원주민들이 그 동물에게 이름을 지어 주었다.","사실은 탐험가들이 그 이름을 몰랐고 원주민들은 알았다."],"r":{"a":"2) 사실은 원주민들도 그 이름을 알지 못했다.","ev":"10~11번 문장","s":[[10,"However, kangaroo meant “I don’t know” in the natives’ language.","하지만, ‘캥거루’는 원주민 언어로 ‘나는 모른다’를 의미했다."],[11,"The truth is, the natives didn’t know the name, either!","사실은, 원주민들도 그 이름을 몰랐다!"]],"w":"10번에서 kangaroo는 '나는 모른다'라는 뜻이었어요. 11번은 그래서 원주민들도 그 이름을 몰랐다는 말이에요(either = 역시).","c":2},"h":"2e291659d4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["유럽의 탐험가들은 오래전에 아프리카로 항해했다.","유럽의 탐험가들은 오래전에 호주로 항해했다.","유럽의 탐험가들은 오래전에 아메리카로 항해했다.","유럽의 탐험가들은 오래전에 아시아로 항해했다."],"opts":["European explorers sailed to Africa long ago.","European explorers sailed to Australia long ago.","European explorers sailed to America long ago.","European explorers sailed to Asia long ago."],"r":{"a":"2) European explorers sailed to Australia long ago. (유럽의 탐험가들은 오래전에 호주로 항해했다.)","ev":"1번 문장","s":[[1,"Long ago, European explorers sailed to Australia.","오래전에, 유럽의 탐험가들은 호주로 항해했다."]],"w":"1번 문장에서 오래전에 유럽의 탐험가들이 호주(Australia)로 항해했다고 했어요.","c":2},"h":"335f75c346"},{"n":9,"t":"sum","q":"The natives (A) “Kangaroo,” but it (B) “I don’t know” in their language.","ko":"원주민들은 “캥거루”라고 (A), 하지만 그것은 그들의 언어로 “나는 모른다”를 (B).","oko":["(A) 물었고 / (B) 의미했다","(A) 대답했지만 / (B) 소리 났다","(A) 대답했지만 / (B) 의미했다","(A) 물었고 / (B) 비용이 들었다","(A) 외쳤지만 / (B) 소리 났다"],"opts":["(A) asked / (B) meant","(A) replied / (B) sounded","(A) replied / (B) meant","(A) asked / (B) cost","(A) shouted / (B) sounded"],"r":{"a":"3) (A) replied / (B) meant ((A) 대답했지만 / (B) 의미했다)","ev":"7번, 10번 문장","s":[[7,"The natives replied, “Kangaroo.”","원주민들은 “캥거루”라고 대답했다."],[10,"However, kangaroo meant “I don’t know” in the natives’ language.","하지만, ‘캥거루’는 원주민 언어로 ‘나는 모른다’를 의미했다."]],"w":"7번 문장에서 원주민들은 “캥거루”라고 대답했고(replied), 10번 문장에서 그것은 원주민 언어로 “나는 모른다”를 의미했다(meant)고 했어요.","c":3},"h":"99a352448c"},{"n":10,"t":"fill","q":"It had large [A] and hopped around on two [B].","ko":"그것은 큰 [A]을(를) 가지고 있었고 두 [B](으)로 깡충깡충 뛰어다녔다.","bank":["ears","legs","explorers","natives","world","truth"],"bko":{"ears":"귀(ear의 복수형)","legs":"다리(leg의 복수형)","explorers":"탐험가들","natives":"원주민들","world":"세계","truth":"사실, 진실"},"r":{"a":"[A] ears (귀(ear의 복수형)), [B] legs (다리(leg의 복수형))","ev":"3번 문장","s":[[3,"It had large ears and hopped around on two legs.","그것은 큰 귀를 가지고 있었고 두 다리로 깡충깡충 뛰어다녔다."]],"w":"3번 문장에서 그것은 큰 귀(ears)를 가지고 있었고 두 다리(legs)로 깡충깡충 뛰어다녔다고 했어요. 나머지 단어는 동물의 몸 부위가 아니라서 의미가 맞지 않아요.","c":null},"h":"0226193032"}]},{"u":5,"id":"hk1-05-2","no":2,"ko":"까먹기 전에 꼭!","items":[{"n":1,"t":"tf","q":"Tangerines make a chemical that helps fruits ripen.","ko":"귤은 과일이 익도록 돕는 화학물질을 만들어 낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"Most fruits, including tangerines, produce a small amount of a chemical that helps fruits ripen.","귤을 포함하여, 대부분의 과일은 과일이 익도록 돕는 소량의 화학물질을 만들어 낸다."],[5,"It is called ethylene.","그것은 에틸렌이라고 불린다."]],"w":"4번에서 귤을 포함한 대부분의 과일이 과일이 익도록 돕는 화학물질을 만들고, 5번에서 그 이름이 에틸렌이라고 해요.","c":"T"},"h":"28806e0e4e"},{"n":2,"t":"tf","q":"A tangerine that is hit will ripen more slowly.","ko":"맞은 귤은 더 느리게 익을 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Eventually, the tangerine will ripen faster and taste better.","결국, 귤은 더 빠르게 익고 맛이 더 좋아질 것이다."]],"w":"8번 문장에서 귤은 더 빠르게(faster) 익고 맛이 더 좋아진다고 해요. 더 느리게 익는다는 말은 반대예요.","c":"F"},"h":"6bb8ed77d6"},{"n":3,"t":"tf","q":"You can rub a tangerine hard with your hands, too.","ko":"귤을 손으로 세게 문지를 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"You can also rub it hard with your hands or drop it on the floor.","당신은 그것을 손으로 세게 문지르거나 바닥에 떨어뜨릴 수도 있다."]],"w":"3번 문장에 rub it hard with your hands가 있어요. 때리는 것 말고도 손으로 세게 문지르거나 바닥에 떨어뜨릴 수 있어요.","c":"T"},"h":"14ba6df92d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Most fruits, including tangerines, produce a small amount of a chemical that helps fruits ripen.)","ko":"귤을 포함하여, 대부분의 과일은 과일이 익도록 돕는 소량의 화학물질을 만들어 낸다.","opts":["썩다","마르다","익다","얼다"],"word":"ripen","r":{"a":"3) 익다","ev":"4번, 11번 문장","s":[[4,"Most fruits, including tangerines, produce a small amount of a chemical that helps fruits ripen.","귤을 포함하여, 대부분의 과일은 과일이 익도록 돕는 소량의 화학물질을 만들어 낸다."],[11,"It means it’s already ripe, so hitting it will only make it rot faster.","그것은 귤이 이미 익었음을 의미하므로, 귤을 때리는 것은 그것을 더 빨리 썩게 만들 뿐이다."]],"w":"ripen은 과일이 '익다'예요. 11번에서 이미 익은 귤을 ripe(익은)라고 하고, 그 귤은 때리면 썩기만 한다고 해요.","c":3},"h":"f16f880cc9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (More of it is produced when a fruit is physically stressed.)","ko":"과일이 물리적으로 압력을 받을 때 그것이 더 많이 만들어진다.","opts":["기뻐하는","압력을 받는","깨끗해진","차가워진"],"word":"stressed","r":{"a":"2) 압력을 받는","ev":"6번 문장","s":[[6,"More of it is produced when a fruit is physically stressed.","과일이 물리적으로 압력을 받을 때 그것이 더 많이 만들어진다."]],"w":"stressed는 여기서 '압력을 받는'이에요. 3번에서 세게 문지르거나 바닥에 떨어뜨리는 것처럼 과일에 힘이 가해지는 상황이에요.","c":2},"h":"05f379e9cc"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHitting a tangerine makes it sweeter!","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"귤을 때리는 것은 그것을 더 달게 만든다!","opts":["귤","과일","당도","에틸렌"],"r":{"a":"1) 귤","ev":"2번 문장","s":[[2,"Hitting a tangerine makes it sweeter!","귤을 때리는 것은 그것을 더 달게 만든다!"]],"w":"2번 문장은 귤을 때리는 것이 그것(it)을 더 달게 만든다는 뜻이에요. 더 달아지는 것은 때린 귤이에요.","c":1,"k":"it = 귤"},"pron":"it","h":"1eb3f56b0c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Therefore, if you hit a tangerine, it will produce more ethylene.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서, 만약 귤을 때리면, 그것은 더 많은 에틸렌을 만들어 낼 것이다.","opts":["그래서 귤을 때리면 귤이 더 많은 에틸렌을 만들어 낸다.","그래서 귤을 때리면 귤 안의 에틸렌이 모두 사라진다.","하지만 귤을 때려도 에틸렌은 늘어나지 않는다.","그래서 귤을 때리면 귤이 에틸렌을 먹어 버린다."],"r":{"a":"1) 그래서 귤을 때리면 귤이 더 많은 에틸렌을 만들어 낸다.","ev":"6~7번 문장","s":[[6,"More of it is produced when a fruit is physically stressed.","과일이 물리적으로 압력을 받을 때 그것이 더 많이 만들어진다."],[7,"Therefore, if you hit a tangerine, it will produce more ethylene.","따라서, 만약 귤을 때리면, 그것은 더 많은 에틸렌을 만들어 낼 것이다."]],"w":"6번에서 과일이 압력을 받으면 에틸렌이 더 많이 만들어진다고 했으니, 때린 귤은 에틸렌을 더 만들어 내요(produce more). 사라지거나 늘지 않는다는 말은 맞지 않아요.","c":1},"h":"1de8e0cf76"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["귤만 맞으면 더 달아진다.","귤을 때리면 당도가 20퍼센트까지 올라갈 수 있다.","이미 익은 귤은 때리면 맛이 더 좋아진다.","귤을 때리면 당도가 20퍼센트 내려간다."],"opts":["Only tangerines get sweeter when they are hit.","Hitting a tangerine can raise its sugar level by up to 20%.","A tangerine that is already ripe tastes better if you hit it.","Hitting a tangerine makes its sugar level go down by 20%."],"r":{"a":"2) Hitting a tangerine can raise its sugar level by up to 20%. (귤을 때리면 당도가 20퍼센트까지 올라갈 수 있다.)","ev":"9번 문장","s":[[9,"In fact, the sugar level can increase up to 20%!","실제로, 당도가 20퍼센트까지 증가할 수 있다!"]],"w":"9번 문장에서 실제로 당도가 20퍼센트까지 증가할 수 있다고 했어요.","c":2},"h":"7650b1ca47"},{"n":9,"t":"sum","q":"When a tangerine is too (A), you should not hit it, because it is already ripe and hitting it will only make it (B) faster.","ko":"귤이 너무 (A) 때리지 말아야 한다. 이미 익었기 때문에, 때리면 더 빨리 (B) 뿐이다.","oko":["(A) 단단하면 / (B) 녹을","(A) 달면 / (B) 자랄","(A) 무르면 / (B) 썩을","(A) 작으면 / (B) 떨어질","(A) 차가우면 / (B) 썩을"],"opts":["(A) hard / (B) melt","(A) sweet / (B) grow","(A) soft / (B) rot","(A) small / (B) fall","(A) cold / (B) rot"],"r":{"a":"3) (A) soft / (B) rot ((A) 무르면 / (B) 썩을)","ev":"10~11번 문장","s":[[10,"However, if the tangerine is too soft, don’t hit it.","하지만, 귤이 너무 무르다면, 그것을 때리지 말아라."],[11,"It means it’s already ripe, so hitting it will only make it rot faster.","그것은 귤이 이미 익었음을 의미하므로, 귤을 때리는 것은 그것을 더 빨리 썩게 만들 뿐이다."]],"w":"10번 문장에서 귤이 너무 무르다면(soft) 때리지 말라고 했고, 11번 문장에서 이미 익었으므로 때리면 더 빨리 썩게(rot) 될 뿐이라고 했어요.","c":3},"h":"805ba451d2"},{"n":10,"t":"fill","q":"Have you [A] heard that you should hit a tangerine [B] you eat it?","ko":"당신은 귤을 먹기 [B] 그것을 때려야 한다는 것을 [A] 들어본 적 있는가?","bank":["ever","before","hard","small","faster","floor"],"bko":{"ever":"한 번이라도, 지금까지","before":"~하기 전에","hard":"세게","small":"작은","faster":"더 빨리","floor":"바닥"},"r":{"a":"[A] ever (한 번이라도, 지금까지), [B] before (~하기 전에)","ev":"1번 문장","s":[[1,"Have you ever heard that you should hit a tangerine before you eat it?","당신은 귤을 먹기 전에 그것을 때려야 한다는 것을 들어본 적 있는가?"]],"w":"1번 문장은 귤을 먹기 전에(before) 때려야 한다는 것을 들어본 적이 있는지(ever) 묻고 있어요. Have you 뒤에는 ever가, 접속사 자리에는 before가 와요.","c":null},"h":"6d9f4960b0"}]},{"u":5,"id":"hk1-05-3","no":3,"ko":"뛰고 구르고 매달리고~","items":[{"n":1,"t":"tf","q":"You can do parkour with just a pair of sneakers.","ko":"당신은 운동화 한 켤레만 있으면 파쿠르를 할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7~8번 문장","s":[[7,"You don’t even need any special equipment for parkour.","당신은 파쿠르를 위한 어떠한 특별한 장비도 필요하지 않다."],[8,"A pair of sneakers is enough.","운동화 한 켤레면 충분하다."]],"w":"7번에서 특별한 장비가 필요하지 않다고 하고, 8번에서 운동화 한 켤레면 충분하다고 해요.","c":"T"},"h":"9ae67dc3a2"},{"n":2,"t":"tf","q":"Parkour is a competitive sport with points and losers.","ko":"파쿠르는 점수와 패자가 있는 경쟁적인 스포츠이다.","r":{"a":"F (본문과 다른 내용)","ev":"11번, 13번 문장","s":[[11,"Parkour is a non-competitive sport.","파쿠르는 비경쟁적인 스포츠다."],[13,"There are no time limits, no points, and no losers.","시간 제한, 점수, 그리고 패자는 없다."]],"w":"11번에서 파쿠르는 non-competitive(비경쟁적인) 스포츠라고 하고, 13번에서 시간 제한도 점수도 패자도 없다고 해요.","c":"F"},"h":"2b24839513"},{"n":3,"t":"tf","q":"People sometimes add moves from gymnastics and martial arts to parkour.","ko":"사람들은 가끔 체조와 무술의 움직임을 파쿠르에 더하기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"People sometimes add various moves from gymnastics and martial arts, too.","사람들은 가끔 체조와 무술에 나오는 다양한 움직임을 더하기도 한다."]],"w":"10번 문장 People sometimes add various moves from gymnastics and martial arts, too와 같은 내용이에요.","c":"T"},"h":"cd30747077"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is parkour, a sport of going over obstacles such as walls and railings.)","ko":"그것은 벽과 난간과 같은 장애물들을 넘어가는 스포츠인 파쿠르이다.","opts":["장비","운동화","장애물","경기장"],"word":"obstacles","r":{"a":"3) 장애물","ev":"5번 문장","s":[[5,"It is parkour, a sport of going over obstacles such as walls and railings.","그것은 벽과 난간과 같은 장애물들을 넘어가는 스포츠인 파쿠르이다."]],"w":"obstacles 뒤에 such as walls and railings(벽과 난간 같은)가 와요. 넘어가야 하는 벽이나 난간이니 '장애물'이에요.","c":3},"h":"4656495cb1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Before you try parkour, however, you should exercise enough to train your muscles.)","ko":"하지만, 파쿠르를 시도해보기 전에, 당신은 근육을 단련시킬 수 있을 만큼 충분히 운동해야 한다.","opts":["뼈","근육","피부","관절"],"word":"muscles","r":{"a":"2) 근육","ev":"14번 문장","s":[[14,"Before you try parkour, however, you should exercise enough to train your muscles.","하지만, 파쿠르를 시도해보기 전에, 당신은 근육을 단련시킬 수 있을 만큼 충분히 운동해야 한다."]],"w":"muscles는 운동으로 단련시키는 '근육'이에요. 15번에서 충분히 운동하지 않으면 다칠 수 있다고 이어져요.","c":2},"h":"3d1647a446"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nThen, he climbs up and down a tree.","ko":"밑줄 친 he이(가) 가리키는 것은?","sko":"그러고 나서, 그는 나무를 오르내린다.","opts":["한 남자","나무","난간","건물"],"r":{"a":"1) 한 남자","ev":"1번, 3번 문장","s":[[1,"A man leaps and runs up the side of a building.","한 남자가 도약해서 건물의 옆면을 뛰어 올라간다."],[3,"Then, he climbs up and down a tree.","그러고 나서, 그는 나무를 오르내린다."]],"w":"1번 문장에서 한 남자(a man)가 건물 옆면을 뛰어 올라간다고 했고, 3번 문장의 he는 그 남자를 가리켜요.","c":1,"k":"he = 한 남자"},"pron":"he","h":"1e0d99d31f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If not, you may hurt yourself!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그렇게 하지 않으면, 다칠 수도 있다!","opts":["그렇지 않으면 다칠 수도 있다.","그렇지 않으면 아주 건강해질 수도 있다.","그렇지 않아도 절대 다치지 않는다.","그렇다면 다른 사람을 다치게 할 수도 있다."],"r":{"a":"1) 그렇지 않으면 다칠 수도 있다.","ev":"15번 문장","s":[[15,"If not, you may hurt yourself!","그렇게 하지 않으면, 다칠 수도 있다!"]],"w":"If not은 그렇지 않으면이라는 뜻이고, you may hurt yourself는 당신이 다칠 수도 있다는 뜻이에요. hurt yourself는 스스로 다친다는 뜻이에요.","c":1},"h":"8d8e96ca1c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파쿠르는 헬멧 같은 특별한 장비가 필요하다.","파쿠르는 모든 동작마다 시간 제한이 있다.","파쿠르는 뛰어넘기, 구르기, 오르기를 포함한다.","사람들은 평평한 길에서만 파쿠르를 한다."],"opts":["Parkour needs special equipment such as a helmet.","Parkour has a time limit for every move.","Parkour includes jumping, rolling, and climbing.","People do parkour only on a flat road."],"r":{"a":"3) Parkour includes jumping, rolling, and climbing. (파쿠르는 뛰어넘기, 구르기, 오르기를 포함한다.)","ev":"9번 문장","s":[[9,"Parkour includes movements like jumping, rolling, and climbing.","파쿠르는 뛰어넘기, 구르기, 그리고 오르기와 같은 동작들을 포함한다."]],"w":"9번 문장에서 파쿠르는 뛰어넘기, 구르기, 그리고 오르기와 같은 동작들을 포함한다고 했어요.","c":3},"h":"cee9904032"},{"n":9,"t":"sum","q":"The goal of parkour is to move from one (A) to another as (B) as possible.","ko":"파쿠르의 목표는 한 (A)에서 다른 곳으로 가능한 한 (B) 움직이는 것이다.","oko":["(A) 도시 / (B) 조심스럽게","(A) 곳 / (B) 천천히","(A) 도시 / (B) 빠르게","(A) 집 / (B) 천천히","(A) 곳 / (B) 빠르게"],"opts":["(A) city / (B) carefully","(A) place / (B) slowly","(A) city / (B) quickly","(A) house / (B) slowly","(A) place / (B) quickly"],"r":{"a":"5) (A) place / (B) quickly ((A) 곳 / (B) 빠르게)","ev":"6번 문장","s":[[6,"The goal is to move from one place to another as quickly as possible.","목표는 한 곳에서 다른 곳으로 가능한 한 빠르게 움직이는 것이다."]],"w":"6번 문장에서 목표는 한 곳(place)에서 다른 곳으로 가능한 한 빠르게(quickly) 움직이는 것이라고 했어요.","c":5},"h":"b03ee48a79"},{"n":10,"t":"fill","q":"A man [A] and runs up the [B] of a building.","ko":"한 남자가 [A] 건물의 [B]을(를) 뛰어 올라간다.","bank":["leaps","side","tree","goal","sneakers","parkour"],"bko":{"leaps":"도약하다(leap의 3인칭 단수형)","side":"옆면","tree":"나무","goal":"목표","sneakers":"운동화","parkour":"파쿠르"},"r":{"a":"[A] leaps (도약하다(leap의 3인칭 단수형)), [B] side (옆면)","ev":"1번 문장","s":[[1,"A man leaps and runs up the side of a building.","한 남자가 도약해서 건물의 옆면을 뛰어 올라간다."]],"w":"1번 문장에서 한 남자가 도약해서(leaps) 건물의 옆면(side)을 뛰어 올라간다고 했어요. A man 뒤에는 동사가, the 뒤에는 명사가 와요.","c":null},"h":"488fe39c58"}]},{"u":5,"id":"hk1-05-4","no":4,"ko":"패션 피플의 비밀","items":[{"n":1,"t":"tf","q":"The princess and other ladies did not want to show their bald heads.","ko":"공주와 다른 귀부인들은 그들의 민머리를 보여주기를 원하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The princess and other ladies didn’t want to show their bald heads.","공주와 다른 귀부인들은 그들의 민머리를 보여주기를 원하지 않았다."]],"w":"7번 문장에 didn’t want to show their bald heads가 그대로 있어요.","c":"T"},"h":"fb2fa5880f"},{"n":2,"t":"tf","q":"The nobles from Portugal sailed to Brazil to conquer it.","ko":"포르투갈의 귀족들은 브라질을 정복하기 위해 항해했다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"In the early 1800s, Napoleon and his armies were trying to conquer Europe.","1800년대 초반에, 나폴레옹과 그의 군대는 유럽을 정복하기 위해 노력하고 있었다."],[4,"Nobles from Portugal were afraid, so they sailed to Brazil to escape.","포르투갈의 귀족들은 겁이 나서, 도망치기 위해 브라질로 항해했다."]],"w":"4번에서 포르투갈의 귀족들이 브라질로 간 이유는 to escape(도망치기 위해)예요. 유럽을 정복하려고 한 쪽은 나폴레옹과 그의 군대(3번)예요.","c":"F"},"h":"b1cd6c097d"},{"n":3,"t":"tf","q":"Everyone on the ship got head lice on the way to Brazil.","ko":"배에 탄 모두가 브라질로 가는 길에 머릿니를 갖게 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"On the way, unfortunately, everyone on the ship got head lice.","불행히도, 가는 길에, 배에 탄 모두가 머릿니를 갖게 되었다."]],"w":"5번 문장에서 가는 길에(On the way) 배에 탄 모두가(everyone on the ship) 머릿니를 갖게 되었다고 해요.","c":"T"},"h":"c618819551"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the early 1800s, Napoleon and his armies were trying to conquer Europe.)","ko":"1800년대 초반에, 나폴레옹과 그의 군대는 유럽을 정복하기 위해 노력하고 있었다.","opts":["도망치다","정복하다","방문하다","가르치다"],"word":"conquer","r":{"a":"2) 정복하다","ev":"3~4번 문장","s":[[3,"In the early 1800s, Napoleon and his armies were trying to conquer Europe.","1800년대 초반에, 나폴레옹과 그의 군대는 유럽을 정복하기 위해 노력하고 있었다."],[4,"Nobles from Portugal were afraid, so they sailed to Brazil to escape.","포르투갈의 귀족들은 겁이 나서, 도망치기 위해 브라질로 항해했다."]],"w":"3번에서 나폴레옹의 군대가 유럽을 conquer하려 했고, 4번에서 귀족들이 겁이 나서 도망쳤어요. 겁날 만한 일이니 '정복하다'예요.","c":2},"h":"ec4fadad82"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The princess and other ladies didn’t want to show their bald heads.)","ko":"공주와 다른 귀부인들은 그들의 민머리를 보여주기를 원하지 않았다.","opts":["긴","더러운","대머리의","화려한"],"word":"bald","r":{"a":"3) 대머리의","ev":"6~7번 문장","s":[[6,"They had to shave their heads, even the princess.","그들은, 심지어 공주도, 머리를 밀어야 했다."],[7,"The princess and other ladies didn’t want to show their bald heads.","공주와 다른 귀부인들은 그들의 민머리를 보여주기를 원하지 않았다."]],"w":"6번에서 머리를 밀어야 했으니 bald heads는 머리카락이 없는 '민머리'예요. 그래서 7번에서 보여주기 싫어했어요.","c":3},"h":"3ee4acf91c"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThis caught the eyes of the Brazilian women, and surprisingly, they liked it!","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"이것은 브라질 여성들의 시선을 사로잡았고, 놀랍게도, 그들은 그것을 좋아했다!","opts":["브라질 여성들","포르투갈의 귀족들","나폴레옹의 군대","배의 선원들"],"r":{"a":"1) 브라질 여성들","ev":"9번 문장","s":[[9,"This caught the eyes of the Brazilian women, and surprisingly, they liked it!","이것은 브라질 여성들의 시선을 사로잡았고, 놀랍게도, 그들은 그것을 좋아했다!"]],"w":"9번 문장에서 터번이 브라질 여성들의 시선을 사로잡았고, 놀랍게도 그들(they)이 그것을 좋아했어요. they는 브라질 여성들이에요.","c":1,"k":"they = 브라질 여성들"},"pron":"they","h":"6bb3b277f7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The secret to becoming a fashionista was head lice!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"패셔니스타가 되는 것의 비결은 머릿니였다!","opts":["패셔니스타가 되는 비결은 머릿니였다.","머릿니를 없애는 것이 패셔니스타의 비결이었다.","패셔니스타는 머릿니 때문에 터번을 벗었다.","머릿니가 있으면 패셔니스타가 될 수 없었다."],"r":{"a":"1) 패셔니스타가 되는 비결은 머릿니였다.","ev":"5~6번, 8번, 12번 문장","s":[[5,"On the way, unfortunately, everyone on the ship got head lice.","불행히도, 가는 길에, 배에 탄 모두가 머릿니를 갖게 되었다."],[6,"They had to shave their heads, even the princess.","그들은, 심지어 공주도, 머리를 밀어야 했다."],[8,"Therefore, they wore turbans when they arrived in Brazil.","그래서, 그들은 브라질에 도착했을 때 터번을 썼다."],[12,"The secret to becoming a fashionista was head lice!","패셔니스타가 되는 것의 비결은 머릿니였다!"]],"w":"머릿니 때문에 머리를 밀고(5~6번) 터번을 썼고(8번), 그것이 유행이 되었으니 패션 유행의 시작이 머릿니였다는 뜻이에요.","c":1},"h":"f5cff784ae"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["브라질 여성들은 터번이 아니라 모자를 쓰기 시작했다.","브라질 여성들도 터번을 쓰기 시작했다.","브라질 여성들은 공주를 위해 터번을 만들었다.","브라질 여성들은 터번이 아시아에서 왔다고 생각했다."],"opts":["The Brazilian women began to wear hats, not turbans.","The Brazilian women began to wear turbans as well.","The Brazilian women made the turbans for the princess.","The Brazilian women thought the turbans came from Asia."],"r":{"a":"2) The Brazilian women began to wear turbans as well. (브라질 여성들도 터번을 쓰기 시작했다.)","ev":"10번 문장","s":[[10,"They thought the turbans were a fashion trend from Europe, and they began to wear turbans as well.","그들은 터번이 유럽에서 온 패션 유행이라고 생각했고, 그들 역시 터번을 쓰기 시작했다."]],"w":"10번 문장에서 브라질 여성들도 터번을 쓰기 시작했다고 했어요. 터번이 유럽에서 온 것이라고 생각했지, 아시아에서 온 것이 아니에요.","c":2},"h":"cd30e6ded9"},{"n":9,"t":"sum","q":"Today, turbans are mostly worn for (A) reasons, but they were once very (B) clothes in Brazil.","ko":"오늘날 터번은 주로 (A) 이유로 착용되지만, 브라질에서는 한때 매우 (B) 의상이었다.","oko":["(A) 종교적인 / (B) 지루한","(A) 값싼 / (B) 유행하는","(A) 종교적인 / (B) 유행하는","(A) 값싼 / (B) 지루한","(A) 의학적인 / (B) 무거운"],"opts":["(A) religious / (B) boring","(A) cheap / (B) trendy","(A) religious / (B) trendy","(A) cheap / (B) boring","(A) medical / (B) heavy"],"r":{"a":"3) (A) religious / (B) trendy ((A) 종교적인 / (B) 유행하는)","ev":"1~2번 문장","s":[[1,"Turbans are mostly worn for religious reasons today.","오늘날 터번은 주로 종교적인 이유로 착용된다."],[2,"But they were once very trendy clothes in Brazil.","하지만 그것은 브라질에서 한때 매우 유행하는 의상이었다."]],"w":"1번 문장에서 오늘날 터번은 주로 종교적인(religious) 이유로 착용된다고 했고, 2번 문장에서 브라질에서는 한때 매우 유행하는(trendy) 의상이었다고 했어요.","c":3},"h":"562c56c77b"},{"n":10,"t":"fill","q":"[A], they wore turbans when they [B] in Brazil.","ko":"[A] 그들은 브라질에 [B] 때 터번을 썼다.","bank":["Therefore","arrived","Europe","army","secret","fashion"],"bko":{"Therefore":"그래서","arrived":"도착했다(arrive의 과거)","Europe":"유럽","army":"군대","secret":"비결","fashion":"패션"},"r":{"a":"[A] Therefore (그래서), [B] arrived (도착했다(arrive의 과거))","ev":"8번 문장","s":[[8,"Therefore, they wore turbans when they arrived in Brazil.","그래서, 그들은 브라질에 도착했을 때 터번을 썼다."]],"w":"8번 문장에서 그래서(Therefore) 그들은 브라질에 도착했을(arrived) 때 터번을 썼다고 했어요. 문장 맨 앞에는 연결어가, when they 뒤에는 동사가 와요.","c":null},"h":"c7445dcb80"}]},{"u":6,"id":"hk1-06-1","no":1,"ko":"휴지, 어떻게 거나요?","items":[{"n":1,"t":"tf","q":"If the toilet paper is hung in the left way, your hand doesn’t have to touch the dirty wall.","ko":"화장지를 왼쪽 방식으로 걸면, 더러운 벽에 손이 닿을 필요가 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"If the toilet paper is hung in this way, your hand doesn’t have to touch the dirty wall.","만약 화장지가 이 방식으로 걸린다면, 더러운 벽에 손이 닿을 필요가 없다."]],"w":"5번 문장에 this way(왼쪽 방식)로 걸면 더러운 벽에 손이 닿을 필요가 없다는 말이 나와요. 본문과 같은 내용이에요.","c":"T"},"h":"bdafe20cfb"},{"n":2,"t":"tf","q":"Modern toilet paper was invented in 1981.","ko":"현대식 화장지는 1981년에 발명되었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Modern toilet paper was invented in 1891.","현대식 화장지는 1891년에 발명되었다."]],"w":"7번 문장에서 현대식 화장지는 1891년에 발명되었다고 해요. 1981년이 아니라 1891년이에요.","c":"F"},"h":"61a28d5e4a"},{"n":3,"t":"tf","q":"The people who hang the toilet paper the other way found many problems with it.","ko":"화장지를 다른 방식으로 건 사람들은 그것에 대해 많은 문제를 발견했다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"And they found no problems with it!","그리고 그들은 그것에 대해 아무런 문제도 발견하지 못했다!"]],"w":"10번 문장에서 그들은 아무런 문제도 발견하지 못했다(found no problems)고 해요. 많은 문제를 발견했다는 말은 반대예요.","c":"F"},"h":"c81e4f8d98"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They say it looks tidier because the loose end is slightly hidden.)","ko":"그들은 풀린 끝부분이 약간 가려져 있기 때문에 그것이 더 깔끔해 보인다고 말한다.","opts":["더 지저분한","더 깔끔한","더 어두운","더 무거운"],"word":"tidier","r":{"a":"2) 더 깔끔한","ev":"3번 문장","s":[[3,"They say it looks tidier because the loose end is slightly hidden.","그들은 풀린 끝부분이 약간 가려져 있기 때문에 그것이 더 깔끔해 보인다고 말한다."]],"w":"끝부분이 가려져 있어서 그렇게 보인다고 했으니 보기 좋게 정돈된 느낌이에요. tidy = 깔끔한이고, tidier는 '더 깔끔한'이에요.","c":2},"h":"3cdddf1ec2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Originally, it was intended to hang like the left way.)","ko":"원래, 그것은 왼쪽 방식처럼 걸도록 의도되었다.","opts":["갑자기","나중에","결국","원래"],"word":"Originally","r":{"a":"4) 원래","ev":"8번 문장","s":[[8,"Originally, it was intended to hang like the left way.","원래, 그것은 왼쪽 방식처럼 걸도록 의도되었다."]],"w":"8번은 현대식 화장지가 처음 발명되었을 때의 이야기예요. 바로 뒤 9번에서 However(하지만)로 달라진 모습이 나오므로 originally는 '원래, 처음에는'이에요.","c":4},"h":"37490263e9"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen you hang your toilet paper, is it similar to the picture on the left or the right?","ko":"밑줄 친 it가 가리키는 것은?","sko":"당신이 화장지를 걸 때, 그것은 왼쪽에 있는 사진과 비슷한가 아니면 오른쪽에 있는 사진과 비슷한가?","opts":["화장지","왼쪽에 있는 사진","오른쪽에 있는 사진","당신의 손"],"pron":"it","r":{"a":"1) 화장지","ev":"1번 문장","s":[[1,"When you hang your toilet paper, is it similar to the picture on the left or the right?","당신이 화장지를 걸 때, 그것은 왼쪽에 있는 사진과 비슷한가 아니면 오른쪽에 있는 사진과 비슷한가?"]],"c":1,"k":"it = 화장지","w":"1번 문장의 it은 앞에 나온 your toilet paper(화장지)를 가리켜요."},"h":"ede0f5b9ed"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Also, it is easier to pull the tissue down.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"또한, 휴지를 끌어내리기가 더 쉽다.","opts":["또한, 휴지를 끌어내리기가 더 쉽다.","또한, 휴지를 끌어내리기가 더 어렵다.","또한, 휴지를 위로 올리기가 더 쉽다.","또한, 휴지를 끌어내릴 필요가 없다."],"r":{"a":"1) 또한, 휴지를 끌어내리기가 더 쉽다.","ev":"6번 문장","s":[[6,"Also, it is easier to pull the tissue down.","또한, 휴지를 끌어내리기가 더 쉽다."]],"w":"easier는 easy(쉬운)의 비교급이라 '더 쉬운'이에요. pull down은 끌어내리다예요. 어렵다, 올리다, 필요 없다는 문장과 다른 내용이에요.","c":1},"h":"5d71d5c630"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Everyone agrees on the correct way to hang toilet paper.","The debate over the correct way to hang toilet paper has continued until now.","Modern toilet paper was first made to hang like the right way.","The debate ended as soon as toilet paper was invented."],"oko":["모든 사람이 화장지를 거는 올바른 방식에 동의한다.","화장지를 거는 올바른 방식에 대한 논쟁은 지금까지 계속되어 왔다.","현대식 화장지는 오른쪽 방식으로 걸도록 처음 발명되었다.","논쟁은 화장지가 발명되자마자 끝났다."],"r":{"a":"2) The debate over the correct way to hang toilet paper has continued until now. (화장지를 거는 올바른 방식에 대한 논쟁은 지금까지 계속되어 왔다.)","ev":"11번 문장","s":[[11,"Since then, the debate over the correct way of hanging toilet paper has continued.","그때부터, 화장지를 거는 것의 올바른 방식에 대한 논쟁은 계속되어 왔다."]],"c":2,"w":"11번 문장에서 올바른 방식에 대한 논쟁이 그때부터 계속되었다고 해요."},"h":"6e11864701"},{"n":9,"t":"sum","q":"Some people (A) the way on the right. They (B) to hang their toilet paper that way.","ko":"어떤 사람들은 오른쪽에 있는 방식을 (A)한다. 그들은 화장지를 그렇게 걸기 (B)했다.","opts":["(A) dislike / (B) refused","(A) prefer / (B) began","(A) prefer / (B) refused","(A) dislike / (B) began","(A) fix / (B) refused"],"oko":["(A) 싫어한다 / (B) 거부","(A) 선호한다 / (B) 시작","(A) 선호한다 / (B) 거부","(A) 싫어한다 / (B) 시작","(A) 고친다 / (B) 거부"],"r":{"a":"2) (A) prefer / (B) began ((A) 선호한다 / (B) 시작)","ev":"2, 9번 문장","s":[[2,"Some people prefer the way on the right.","몇몇 사람들은 오른쪽에 있는 방식을 선호한다."],[9,"However, some people began to hang the toilet paper in the other way.","하지만, 몇몇 사람들이 화장지를 오른쪽 방식으로 걸기 시작했다."]],"c":2,"w":"2번 문장에서 오른쪽 방식을 선호하고(prefer), 9번 문장에서 그 방식으로 걸기 시작했다(began)고 해요."},"h":"17f041af47"},{"n":10,"t":"fill","q":"But others [A] the way on the left is [B] cleaner.","ko":"하지만 다른 사람들은 왼쪽에 있는 방식이 [B] 더 깔끔하다고 [A]한다.","bank":["think","actually","loose","hidden","dirty","wall"],"bko":{"think":"생각하다","actually":"실제로","loose":"풀린","hidden":"가려진","dirty":"더러운","wall":"벽"},"r":{"a":"[A] think (생각하다), [B] actually (실제로)","ev":"4번 문장","s":[[4,"But others think the way on the left is actually cleaner.","하지만 다른 사람들은 왼쪽 방식이 실제로 더 깔끔하다고 생각한다."]],"c":null,"w":"4번 문장: 다른 사람들은 왼쪽 방식이 실제로(actually) 더 깔끔하다고 생각한다(think)."},"h":"d780d50c39"}]},{"u":6,"id":"hk1-06-2","no":2,"ko":"바닷속 미스터리 서클","items":[{"n":1,"t":"tf","q":"The circular pattern on the seafloor looked like a piece of art.","ko":"해저의 원형 무늬는 하나의 예술 작품처럼 보였다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It was a two-meter-wide circular pattern, and it looked like a piece of art.","그것은 2미터 너비의 원형 무늬였는데, 하나의 예술 작품처럼 보였다."]],"w":"2번 문장에서 그것은 2미터 너비의 원형 무늬였고 예술 작품처럼 보였다고 해요.","c":"T"},"h":"9a1af79924"},{"n":2,"t":"tf","q":"The female pufferfish makes the circle on the seafloor.","ko":"암컷 복어가 해저에 원을 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"First, the male fish creates a circle on the seafloor.","먼저, 수컷 물고기는 해저에 원을 만든다."]],"w":"7번 문장에서 원을 만드는 것은 수컷 물고기(the male fish)예요. 암컷은 둥지가 완성된 뒤 알을 낳아요(12번).","c":"F"},"h":"2404636f1b"},{"n":3,"t":"tf","q":"A female pufferfish lays eggs in the nest when it is complete.","ko":"암컷 복어는 둥지가 완성되면 그 안에 알을 낳는다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"When the nest is complete, a female pufferfish will lay eggs in it.","둥지가 완성되면, 암컷 복어는 그 안에 알을 낳을 것이다."]],"w":"12번 문장에 둥지가 완성되면 암컷 복어가 그 안에 알을 낳는다고 나와요.","c":"T"},"h":"bdf54f86eb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day, a number of divers discovered something strange…)","ko":"어느 날, 많은 잠수부들은 무언가 낯선 것을 발견했다.","opts":["잃어버렸다","발견했다","만들었다","먹었다"],"word":"discovered","r":{"a":"2) 발견했다","ev":"1번 문장","s":[[1,"One day, a number of divers discovered something strange on the seafloor near Japan.","어느 날, 많은 잠수부들은 일본 근처의 해저에서 무언가 낯선 것을 발견했다."]],"w":"잠수부들이 바다 밑에서 처음 보는 낯선 것을 찾아냈다는 내용이에요. discover = 발견하다예요.","c":2},"h":"f3da358e35"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Finally, it gathers up the sand in the center to make a nest.)","ko":"마지막으로, 그것은 둥지를 만들기 위해 중앙에 모래를 모은다.","opts":["흩뿌린다","파낸다","모은다","씻어 낸다"],"word":"gathers up","r":{"a":"3) 모은다","ev":"10번 문장","s":[[10,"Finally, it gathers up the sand in the center to make a nest.","마지막으로, 그것은 둥지를 만들기 위해 중앙에 모래를 모은다."]],"w":"가운데에 모래를 모아야 둥지가 만들어져요. gather up = 모으다예요. 흩뿌리면 둥지를 만들 수 없어요.","c":3},"h":"c570b89c30"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt builds a structure that is 20 times its size by only using its fins!","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 지느러미만 사용해서 자기 몸의 20배 크기의 구조물을 짓는다!","opts":["12센티미터 길이의 복어","일본 근처의 잠수부들","해저의 원형 무늬","물고기의 지느러미"],"r":{"a":"1) 12센티미터 길이의 복어","ev":"5~6번 문장","s":[[5,"The fish is a species of pufferfish that is only 12 centimeters long.","그 물고기는 겨우 12센티미터 길이인 복어의 한 종이다."],[6,"It builds a structure that is 20 times its size by only using its fins!","그것은 지느러미만 사용해서 자기 몸의 20배 크기의 구조물을 짓는다!"]],"w":"구조물을 짓는 주인공은 5번에 나온 12센티미터짜리 복어예요. 6번에서 its fins(그것의 지느러미)라고 했으니 지느러미는 복어의 것이지 It이 아니에요.","c":1},"h":"90d4fd7dac"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The entire process takes six weeks.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"전체 과정은 6주가 걸린다.","opts":["전체 과정은 6일이 걸린다.","전체 과정은 6개월이 걸린다.","전체 과정은 6주가 걸린다.","전체 과정은 6주 뒤에 시작된다."],"r":{"a":"3) 전체 과정은 6주가 걸린다.","ev":"11번 문장","s":[[11,"The entire process takes six weeks.","전체 과정은 6주가 걸린다."]],"w":"entire = 전체의, process = 과정이고 take six weeks = 6주가 걸리다예요. 시작이 아니라 걸리는 기간을 말해요.","c":3},"h":"3e691f308e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The writer thinks the male pufferfish is a creative home-builder.","The writer thinks the male pufferfish is a lazy home-builder.","The writer thinks the female pufferfish builds the nest alone.","The writer thinks the nest is too small for the eggs."],"oko":["글쓴이는 수컷 복어가 창의적인 집 건설자라고 생각한다.","글쓴이는 수컷 복어가 게으른 집 건설자라고 생각한다.","글쓴이는 암컷 복어가 혼자 둥지를 짓는다고 생각한다.","글쓴이는 둥지가 알들에게 너무 작다고 생각한다."],"r":{"a":"1) The writer thinks the male pufferfish is a creative home-builder. (글쓴이는 수컷 복어가 창의적인 집 건설자라고 생각한다.)","ev":"13번 문장","s":[[13,"What a creative home-builder the male pufferfish is!","수컷 복어는 얼마나 창의적인 집 건설자인가!"]],"c":1,"w":"13번 문장에서 수컷 복어를 얼마나 창의적인 집 건설자인가라고 감탄해요."},"h":"e63484f5ef"},{"n":9,"t":"sum","q":"Divers found a (A) but beautiful artwork on the seafloor. Surprisingly, the artist was a (B) fish.","ko":"잠수부들은 해저에서 (A)하지만 아름다운 예술 작품을 발견했다. 놀랍게도 그 예술가는 (B) 물고기였다.","opts":["(A) mysterious / (B) tiny","(A) mysterious / (B) huge","(A) ordinary / (B) tiny","(A) ordinary / (B) huge","(A) dangerous / (B) huge"],"oko":["(A) 신비로운 / (B) 작은","(A) 신비로운 / (B) 거대한","(A) 평범한 / (B) 작은","(A) 평범한 / (B) 거대한","(A) 위험한 / (B) 거대한"],"r":{"a":"1) (A) mysterious / (B) tiny ((A) 신비로운 / (B) 작은)","ev":"3~4번 문장","s":[[3,"Who created this mysterious but beautiful artwork?","누가 이 신비롭지만 아름다운 예술 작품을 만들었을까?"],[4,"Surprisingly, the artist was a he couple sat down right behind Oliver.","ko":"그 연인은 Oliver의 바로 뒤에 앉았다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"They sat down right behind him.","그들은 그의 바로 뒤에 앉았다."]],"w":"7번 문장에서 They sat down right behind him이라고 했어요. They는 연인이고 him은 Oliver예요.","c":"T"},"h":"f7b68b961c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (“Excuse me, but I can’t hear,” he whispered.)","ko":"“실례합니다만, 들을 수가 없네요.”라고 그가 속삭였다.","opts":["소리쳤다","웃었다","속삭였다","노래했다"],"word":"whispered","r":{"a":"3) 속삭였다","ev":"10~11번 문장","s":[[10,"Finally, Oliver turned around.","마침내, Oliver는 뒤돌아보았다."],[11,"“Excuse me, but I can’t hear,” he whispered.","“실례합니다만, 들을 수가 없네요.”라고 그가 속삭였다."]],"w":"10번에서 Oliver가 뒤돌아봐요. 그리고 11번에서 연인에게 조심스럽게 말하는 장면이에요. 극장에서 작게 말하는 것이므로 whisper = 속삭이다예요.","c":3},"h":"744236d645"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The theater was empty when he walked in.)","ko":"그가 들어갔을 때 극장은 비어 있었다.","opts":["비어 있는","시끄러운","가득 찬","어두운"],"word":"empty","r":{"a":"1) 비어 있는","ev":"3~5번 문장","s":[[3,"The theater was empty when he walked in.","그가 들어갔을 때 극장은 비어 있었다."],[4,"“How lucky I am!”, he said.","“얼마나 운이 좋은가!”라고 그가 말했다."],[5,"He could enjoy the movie in a quiet environment.","그는 조용한 환경에서 영화를 즐길 수 있었다."]],"w":"3번에서 극장이 empty라서 Oliver가 4번에서 운이 좋다고 말하고, 5번에서 조용한 환경이라고 해요. 사람이 없다는 뜻이므로 empty = 비어 있는이에요.","c":1},"h":"85d454e1aa"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nHe tried to pay attention to the movie, but they kept talking loudly.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그는 영화에 집중하기 위해 노력했지만, 그들은 계속해서 크게 이야기했다.","opts":["극장 직원들","그 연인","Oliver의 친구들","영화 속 인물들"],"pron":"they","r":{"a":"2) 그 연인","ev":"6~9번 문장","s":[[6,"However, as soon as the film started, a couple entered.","하지만, 영화가 시작하자마자, 한 연인이 입장했다."],[7,"They sat down right behind him.","그들은 그의 바로 뒤에 앉았다."],[8,"Then, they started to talk to each other.","그 후, 그들은 서로에게 이야기를 하기 시작했다."],[9,"He tried to pay attention to the movie, but they kept talking loudly.","그는 영화에 집 },{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The water tastes slightly sweet with apple straws.)","ko":"사과 빨대를 사용하면 물이 약간 단맛이 난다.","opts":["약간","매우 많이","전혀","갑자기"],"word":"slightly","r":{"a":"1) 약간","ev":"12번 문장","s":[[12,"The water tastes slightly sweet with apple straws.","사과 빨대를 사용하면 물이 약간 단맛이 난다."]],"w":"물이 sweet한 정도를 나타내는 말이에요. 빨대로 물에 아주 진한 맛이 나는 것은 아니므로 slightly는 약간이에요.","c":1},"h":"cae66b9d10"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nOne of them is the bamboo straw.","ko":"밑줄 친 them가 가리키는 것은?","sko":"그것들 중 하나는 대나무 빨대이다.","opts":["대나무 빨대들","특별한 무기들","플라스틱 빨대들","환경 문제들"],"pron":"them","r":{"a":"2) 특별한 무기들","ev":"3~4번 문장","s":[[3,"To fight them, we use some special weapons!","그것들과 싸우기 위해, 우리는 몇몇 특별한 무기들을 사용한다!"],[4,"One of them is the bamboo straw.","그것들 중 하나는 대나무 빨대이다."]],"c":2,"k":"them = 특별한 무기들","w":"3번 문장의 some special weapons(특별한 무기들)를 4번 문장의 them이 가리켜요. 그중 하나가 대나무 빨대예요."},"h":"1494c5eeae"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"We can cut it down to make straws, and it will quickly grow back.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리는 빨대를 만들기 위해 그것을 베어낼 수 있고, 그것은 빠르게 다시 자랄 것이다.","opts":["대나무는 한 번 베면 다시 자라지 않는다.","빨대를 만들려면 대나무를 새로 심어야 한다.","대나무를 베면 빨대가 빠르게 자란다.","대나무를 베어 빨대를 만들어도 금방 다시 자란다."],"r":{"a":"4) 대나무를 베어 빨대를 만들어도 금방 다시 자란다.","ev":"6번 문장","s":[[6,"We can cut it down to make straws, and it will quickly grow back.","우리는 빨대를 만들기 위해 그것을 베어낼 수 있고, 그것은 빠르게 다시 자랄 것이다."]],"c":4,"w":"6번 문장은 대나무를 베어 빨대를 만들어도 금방 다시 자란다는 뜻이에요."},"h":"d095f864e3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Straws made of bamboo are strong.","Straws made of bamboo are weak.","Straws made of bamboo are very expensive.","Straws made of bamboo are soft like paper."],"oko":["대나무로 만든 빨대는 튼튼하다.","대나무로 만든 빨대는 약하다.","대나무로 만든 빨대는 매우 비싸다.","대나무로 만든 빨대는 종이처럼 물렁하다."],"r":{"a":"1) Straws made of bamboo are strong. (대나무로 만든 빨대는 튼튼하다.)","ev":"7~8번 문장","s":[[7,"Moreover, drinking straws made of bamboo are strong.","게다가, 대나무로 만든 음용 빨대는 튼튼하다."],[8,"They don’t become soft easily like paper straws, and each one can be used more than 50 times.","그것들은 종이 빨대처럼 쉽게 물러지지 않고, 각각 50번 넘게 사용될 수 있다."]],"c":1,"w":"7번 문장에서 대나무로 만든 빨대는 튼튼하다(strong)고 해요. 8번 문장에서 종이 빨대처럼 쉽게 물러지지 않는다고도 해요."},"h":"b21422c979"},{"n":9,"t":"sum","q":"To (A) the (B), a new kind of war is going on.","ko":"(B)을(를) (A) 위해, 새로운 종류의 전쟁이 벌어지고 있다.","opts":["(A) protect / (B) environment","(A) destroy / (B) environment","(A) protect / (B) city","(A) destroy / (B) city","(A) clean / (B) city"],"oko":["(A) 보호하기 / (B) 환경","(A) 파괴하기 / (B) 환경","(A) 보호하기 / (B) 도시","(A) 파괴하기 / (B) 도시","(A) 청소하기 / (B) 도시"],"r":{"a":"1) (A) protect / (B) environment ((A) 보호하기 / (B) 환경)","ev":"1번 문장","s":[[1,"To protect the environment, a new kind of a war is going on.","환경을 보호하기 위해, 새로운 종류의 전쟁이 벌어지고 있다."]],"c":1,"w":"1번 문장: 환경(environment)을 보호하기(protect) 위해 새로운 종류의 전쟁이 벌어지고 있어요."},"h":"bdc6b7dc0c"},{"n":10,"t":"fill","q":"And you can [A] them after you [B] drinking!","ko":"그리고 마시는 것을 [B] 후에는 그것들을 [A] 수 있다!","bank":["eat","finish","easily","quickly","plastic","special"],"bko":{"eat":"먹다","finish":"끝내다","easily":"쉽게","quickly":"빠르게","plastic":"플라스틱","special":"특별한"},"r":{"a":"[A] eat (먹다), [B] finish (끝내다)","ev":"13번 문장","s":[[13,"And you can eat them after you finish drinking!","그리고 다 마신 후에는 그것들을 먹을 수 있다!"]],"c":null,"w":"13번 문장: 다 마신 후에(finish) 그것들을 먹을(eat) 수 있어요."},"h":"a5d2c4c61f"}]},{"u":7,"id":"hk1-07-4","no":4,"ko":"선물을 뿌직!","items":[{"n":1,"t":"tf","q":"Caga Tió is a small log with a smiling face.","ko":"Caga Tió는 웃고 있는 얼굴을 한 작은 통나무이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It is a small log with a smiling face.","그것은 웃고 있는 얼굴을 한 작은 통나무다."]],"w":"4번 문장 It is a small log with a smiling face 그대로예요.","c":"T"},"h":"7a1a471d90"},{"n":2,"t":"tf","q":"Children get their own Caga Tió on Christmas Day.","ko":"아이들은 크리스마스 날에 자기만의 Caga Tió를 받는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"On December 8, children get their own Caga Tió.","12월 8일에, 아이들은 그들만의 Caga Tió를 받는다."]],"w":"5번 문장에서 아이들은 12월 8일에 Caga Tió를 받아요. 크리스마스 날(Christmas Day)에는 8번에서 두드리고 노래를 불러요.","c":"F"},"h":"c260b86f90"},{"n":3,"t":"tf","q":"Children remove the blanket after they finish singing the song.","ko":"아이들은 노래 부르는 것을 마친 후 담요를 치운다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"When they finish singing the song, they remove the blanket from the log.","그들은 노래 부르는 것을 마치면, 통나무에서 담요를 치운다."]],"w":"9번 문장에서 노래 부르는 것을 마치면 통나무에서 담요를 치운다고 해요.","c":"T"},"h":"5ee04dc3bf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In Spain, children receive Christmas gifts from something special.)","ko":"스페인에서는, 아이들이 무언가 특별한 것으로부터 크리스마스 선물을 받는다.","opts":["준다","빌린다","받는다","만든다"],"word":"receive","r":{"a":"3) 받는다","ev":"1~2번 문장","s":[[1,"In Spain, children receive Christmas gifts from something special.","스페인에서는, 아이들이 무언가 특별한 것으로부터 크리스마스 선물을 받는다."],[2,"Its name is Caga Tió.","그것의 이름은 Caga Tió이다."]],"w":"1번에서 아이들이 선물을 어떻게 하는지를 말해요. 2번에서 선물을 주는 존재가 Caga Tió이니 아이들은 선물을 받아요. receive = 받다예요.","c":3},"h":"a457ccadb8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Fortunately, they don’t smell bad!)","ko":"다행스럽게도, 그것은 고약한 냄새가 나지 않는다!","opts":["불행하게도","갑자기","천천히","다행스럽게도"],"word":"Fortunately","r":{"a":"4) 다행스럽게도","ev":"10~11번 문장","s":[[10,"There, they will find the gifts that are pooped out by the well-fed Caga Tió.","거기에서, 그들은 잘 먹은 Caga Tió로부터 배설된 선물을 발견할 것이다."],[11,"Fortunately, they don’t smell bad!","다행스럽게도, 그것은 고약한 냄새가 나지 않는다!"]],"w":"10번에서 선물이 응가처럼 나온다고 해서 냄새가 날 것 같지만, 11번에서는 냄새가 나지 않는다고 해요. 좋은 소식이므로 fortunately = 다행스럽게도예요.","c":4},"h":"6d87ebf205"},{"n":6,"t":"ref","q":"What does the underlined \"Its\" refer to?\nIts name is Caga Tió.","ko":"밑줄 친 Its가 가리키는 것은?","sko":"그것의 이름은 Caga Tió이다.","opts":["크리스마스 선물을 주는 특별한 것","스페인의 아이들","크리스마스 선물","12월 8일"],"pron":"Its","r":{"a":"1) 크리스마스 선물을 주는 특별한 것","ev":"1~2번 문장","s":[[1,"In Spain, children receive Christmas gifts from something special.","스페인에서는, 아이들이 무언가 특별한 것으로부터 크리스마스 선물을 받는다."],[2,"Its name is Caga Tió.","그것의 이름은 Caga Tió이다."]],"c":1,"k":"Its = 크리스마스 선물을 주는 특별한 것","w":"1번 문장의 something special(특별한 것)을 2번 문장의 Its가 가리켜요. 그 이름이 Caga Tió예요."},"h":"7d2d8b4ede"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There, they will find the gifts that are pooped out by the well-fed Caga Tió.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"거기에서, 그들은 잘 먹은 Caga Tió로부터 배설된 선물을 발견할 것이다.","opts":["거기에서 잘 먹은 Caga Tió가 내놓은 선물을 발견할 것이다.","거기에서 굶은 Caga Tió가 선물을 가져가 버릴 것이다.","거기에서 Caga Tió에게 선물을 줄 것이다.","거기에서 선물을 잃어버릴 것이다."],"r":{"a":"1) 거기에서 잘 먹은 Caga Tió가 내놓은 선물을 발견할 것이다.","ev":"10번 문장","s":[[10,"There, they will find the gifts that are pooped out by the well-fed Caga Tió.","거기에서, 그들은 잘 먹은 Caga Tió로부터 배설된 선물을 발견할 것이다."]],"c":1,"w":"10번 문장은 잘 먹은 Caga Tió가 내놓은 선물을 발견할 것이라는 뜻이에요."},"h":"2d3a051881"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Caga Tió is a big log with a sad face.","Children put a blanket on the log to keep it cold.","Caga Tió means “poo log” in Spanish.","The gifts from Caga Tió smell bad."],"oko":["Caga Tió는 슬픈 얼굴을 한 큰 통나무이다.","아이들은 통나무를 차갑게 유지하려고 담요를 덮는다.","Caga Tió는 스페인어로 ‘응가 통나무’를 의미한다.","Caga Tió의 선물은 고약한 냄새가 난다."],"r":{"a":"3) Caga Tió means “poo log” in Spanish.","ev":"3, 7, 11번 문장","s":[[3,"Caga Tió means “poo log” in Spanish.","Caga Tió는 스페인어로 ‘응가 통나무’를 의미한다."],[7,"So, they offer their log food and put a blanket over it to keep it warm.","그래서, 그들은 통나무에게 음식을 제공하고 따뜻하게 해주기 위해 그 위에 담요를 덮어준다."],[11,"Fortunately, they don’t smell bad!","다행스럽게도, 그것은 고약한 냄새가 나지 않는다!"]],"w":"3번에서 Caga Tió는 스페인어로 응가 통나무라고 해요. 생김새는 웃는 작은 통나무(4번), 담요는 따뜻하게 하려는 것(7번), 선물은 냄새가 나지 않아요(11번).","c":3},"h":"f271d171ee"},{"n":9,"t":"sum","q":"So, they (A) their log food and put a blanket over it to keep it (B).","ko":"그래서, 그들은 통나무에게 음식을 (A), 그것을 (B) 유지하기 위해 그 위에 담요를 덮어준다.","opts":["(A) offer / (B) warm","(A) offer / (B) cold","(A) sell / (B) warm","(A) sell / (B) cold","(A) hide / (B) wet"],"oko":["(A) 제공하고 / (B) 따뜻하게","(A) 제공하고 / (B) 차갑게","(A) 팔고 / (B) 따뜻하게","(A) 팔고 / (B) 차갑게","(A) 숨기고 / (B) 축축하게"],"r":{"a":"1) (A) offer / (B) warm ((A) 제공하고 / (B) 따뜻하게)","ev":"7번 문장","s":[[7,"So, they offer their log food and put a blanket over it to keep it warm.","그래서, 그들은 통나무에게 음식을 제공하고 따뜻하게 해주기 위해 그 위에 담요를 덮어준다."]],"c":1,"w":"7번 문장: 통나무에게 음식을 제공하고(offer) 따뜻하게(warm) 유지하려고 담요를 덮어줘요."},"h":"21682dce67"},{"n":10,"t":"fill","q":"They [A] if they take good care of it until Christmas Eve, it will give them [B]!","ko":"그들은 크리스마스 전날까지 Caga Tió를 잘 돌본다면, 그것이 [B]을(를) 줄 것이라고 [A]!","bank":["believe","presents","special","small","smiling","fortunately"],"bko":{"believe":"믿다","presents":"선물들","special":"특별한","small":"작은","smiling":"웃고 있는","fortunately":"다행스럽게도"},"r":{"a":"[A] believe (믿다), [B] presents (선물들)","ev":"6번 문장","s":[[6,"They believe if they take good care of it until Christmas Eve, it will give them presents!","그들은 크리스마스 전날까지 Caga Tió를 잘 돌본다면, 그것이 선물을 줄 것이라고 믿는다!"]],"c":null,"w":"6번 문장: 잘 돌보면 선물(presents)을 줄 것이라고 믿는다(believe)."},"h":"9a2ce8fa9a"}]},{"u":8,"id":"hk1-08-1","no":1,"ko":"나도 철 들었어~","items":[{"n":1,"t":"tf","q":"Many kinds of cereal contain iron powder.","ko":"많은 종류의 시리얼은 철가루를 함유하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In fact, many kinds of cereal contain iron powder, even yours.","사실, 많은 종류의 시리얼이, 심지어 당신의 것도 철가루를 함유하고 있다."]],"w":"3번 문장에 many kinds of cereal contain iron powder가 그대로 나와요. 심지어 당신이 먹는 시리얼도 그렇다고 해요.","c":"T"},"h":"0f47737ff0"},{"n":2,"t":"tf","q":"The iron in cereal is dangerous to eat.","ko":"시리얼 속 철은 먹기에 위험하다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"The iron in cereal is clean and safe to eat.","시리얼에 있는 철은 깨끗하고 먹기에 안전하다."]],"w":"11번 문장에서 시리얼 속 철은 깨끗하고 먹기에 안전하다(clean and safe to eat)고 해요. 위험하다는 말은 반대예요.","c":"F"},"h":"9f347cef87"},{"n":3,"t":"tf","q":"You should fill the plastic bottle completely with water.","ko":"플라스틱병을 물로 가득 채워야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Put them inside a plastic bottle and fill it halfway with water.","그것들을 플라스틱병 안에 넣고 병을 물로 반 정도 채워라."]],"w":"6번 문장은 병을 물로 반 정도(halfway) 채우라고 해요. 가득 채우는 것이 아니에요.","c":"F"},"h":"b4bad6999e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (First, crush up some cereal into small pieces.)","ko":"먼저, 약간의 시리얼을 작은 조각들로 부숴라.","word":"crush","opts":["씻다","부수다","굽다","섞다"],"r":{"a":"2) 부수다","ev":"5번 문장","s":[[5,"First, crush up some cereal into small pieces.","먼저, 약간의 시리얼을 작은 조각들로 부숴라."]],"w":"시리얼을 작은 조각들(small pieces)로 만드는 행동이에요. crush up은 '부수다'예요.","c":2},"h":"5c0ea1a4be"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You can feel weak or dizzy without enough of it.)","ko":"그것이 충분하지 않으면 당신은 힘이 없거나 어지럽다고 느낄 수 있다.","word":"dizzy","opts":["졸린","화난","어지러운","배고픈"],"r":{"a":"3) 어지러운","ev":"13번 문장","s":[[13,"You can feel weak or dizzy without enough of it.","그것이 충분하지 않으면 당신은 힘이 없거나 어지럽다고 느낄 수 있다."]],"w":"철이 부족할 때 힘이 없는(weak) 것과 함께 느끼는 상태예요. dizzy는 '어지러운'이에요. 졸리거나 배고프다는 말은 본문에 없어요.","c":3},"h":"00f3bb5558"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHold it close to the cereal pieces that are inside the bottle.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것을 병 안에 들어 있는 시리얼 조각들에 가까이 들어라.","opts":["물","시리얼 조각","병","자석"],"r":{"a":"4) 자석","ev":"7~8번 문장","s":[[7,"Next, get a magnet.","그 다음, 자석을 가져와라."],[8,"Hold it close to the cereal pieces that are inside the bottle.","그것을 병 안에 들어 있는 시리얼 조각들에 가까이 들어라."]],"w":"7번에서 Next, get a magnet(자석을 가져와라)이라고 했고, 8번에서 그 자석을 병 안의 시리얼 조각들 가까이에 들라고 해요. 병이나 시리얼 조각은 자석이 가까이 가는 대상이에요.","c":4},"h":"1a484fbef7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now, you may worry about eating iron, but you don’t have to.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이제, 당신은 철을 섭취하는 것에 대해 걱정할지도 모르겠지만, 그럴 필요가 없다.","opts":["철을 먹는 것을 걱정할지 모르지만, 걱정할 필요는 없다.","철을 먹는 것에 대해 반드시 걱정해야 한다.","철을 먹지 않아도 되니 시리얼도 먹지 마라.","철을 먹는 것을 걱정하는 사람은 아무도 없다."],"r":{"a":"1) 철을 먹는 것을 걱정할지 모르지만, 걱정할 필요는 없다.","ev":"10번 문장","s":[[10,"Now, you may worry about eating iron, but you don’t have to.","이제, 당신은 철을 섭취하는 것에 대해 걱정할지도 모르겠지만, 그럴 필요가 없다."]],"w":"you may worry는 '걱정할지도 모른다', don’t have to는 '~할 필요가 없다'예요. 뒤에 worry about eating iron이 생략돼 있어요. 걱정은 해도 되지만 그럴 필요가 없다는 뜻이에요.","c":1},"h":"05a0470760"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["시리얼 속 철은 더러우니 먹으면 안 된다.","철은 몸을 힘없고 어지럽게 만든다.","시리얼 속 철은 몸이 에너지를 만드는 것을 돕는다.","아침 식사용 시리얼에는 철이 전혀 들어 있지 않다."],"opts":["The iron in cereal is dirty, so you should not eat it.","Iron makes your body feel weak or dizzy.","Iron in cereal helps your body make energy.","Cereal for breakfast never contains iron."],"r":{"a":"3) Iron in cereal helps your body make energy.","ev":"11~12번 문장","s":[[11,"The iron in cereal is clean and safe to eat.","시리얼에 있는 철은 깨끗하고 먹기에 안전하다."],[12,"It’s actually necessary for your body because it helps produce energy.","그것은 에너지를 만들어 내는 것을 돕기 때문에 사실 당신의 몸에 필요하다."]],"w":"12번에서 철은 에너지를 만들어 내는 것을 돕기 때문에 몸에 필요하다고 해요. 철이 더럽다는 말은 없고(11번은 깨끗하고 안전), 힘이 없거나 어지러운 것은 철이 부족할 때예요(13번). 시리얼에는 철가루가 들어 있어요(3번).","c":3},"h":"2d0e8b9d20"},{"n":9,"t":"sum","q":"When you move the magnet (A), you will see small iron pieces from the cereal (B) it!","ko":"자석을 (A) 움직이면, 시리얼에서 나온 작은 철 조각들이 그것을 (B) 것을 볼 것이다!","opts":["(A) slowly / (B) follow","(A) slowly / (B) leave","(A) quickly / (B) leave","(A) loudly / (B) follow","(A) loudly / (B) leave"],"oko":["(A) 천천히 / (B) 따라다니는","(A) 천천히 / (B) 떠나는","(A) 빠르게 / (B) 떠나는","(A) 시끄럽게 / (B) 따라다니는","(A) 시끄럽게 / (B) 떠나는"],"r":{"a":"1) (A) slowly / (B) follow ((A) 천천히 / (B) 따라다니는)","ev":"9번 문장","s":[[9,"When you move the magnet slowly, you will see small iron pieces from the cereal follow it!","당신이 자석을 천천히 움직이면, 시리얼에서 나온 작은 철 조각들이 그것을 따라다니는 것을 볼 것이다!"]],"c":1,"w":"9번 문장: 자석을 천천히(slowly) 움직이면 작은 철 조각들이 그것을 따라다닌다(follow)."},"h":"f785a427b0"},{"n":10,"t":"fill","q":"You can [A] this with a [B] test.","ko":"당신은 [B] 실험으로 이것을 [A] 수 있다.","bank":["check","simple","probably","actually","in cab","q":"What is the meaning of the underlined word? (The person beats the ant because they step on it.)","ko":"사람은 개미를 밟기 때문에 그것을 이긴다.","word":"beats","opts":["지다","이기다","피하다","따라가다"],"r":{"a":"2) 이기다","ev":"9번 문장","s":[[9,"The person beats the ant because they step on it.","사람은 개미를 밟기 때문에 그것을 이긴다."]],"w":"사람이 개미를 밟으니까 사람이 이기는 거예요. beat는 여기서 '이기다'예요. 뒤의 because 이하가 이기는 이유를 설명해 줘요.","c":2},"h":"606d804aba"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is another version of the game from Indonesia.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 인도네시아에서 나온 가위바위보의 또 다른 버전이다.","opts":["가위바위보","개미, 사람, 코끼리 놀이","인도네시아","새끼손가락"],"pron":"This","r":{"a":"2) 개미, 사람, 코끼리 놀이","ev":"2~3번 문장","s":[[2,"How about trying Ant, Person, and Elephant?","개미, 사람, 코끼리 놀이를 해보는 것은 어떤가?"],[3,"This is another version of the game from Indonesia.","이것은 인도네시아에서 나온 가위바위보의 또 다른 버전이다."]],"c":2,"k":"This = 개미, 사람, 코끼리 놀이","w":"2번 문장의 Ant, Person, and Elephant 놀이를 3번 문장의 This가 가리켜요. 인도네시아에서 나온 또 다른 버전이에요."},"h":"cf5bdcb4ac"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Here is how to play the game.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"여기에 놀이를 하는 방법이 있다.","opts":["여기에 놀이를 하는 방법이 있다.","여기에서는 놀이를 하면 안 된다.","이 놀이는 하는 방법이 없다.","놀이를 하러 여기로 와라."],"r":{"a":"1) 여기에 놀이를 하는 방법이 있다.","ev":"8번 문장","s":[[8,"Here is how to play the game.","여기에 놀이를 하는 방법이 있다."]],"c":1,"w":"8번 문장은 놀이를 하는 방법이 여기 있다는 뜻이에요."},"h":"dfea163152"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The writer asks readers to play the game with friends.","The writer asks readers to play the game alone.","The writer asks readers to stop playing the game.","The writer asks readers to teach the game to teachers."],"oko":["글쓴이는 독자에게 친구들과 그 놀이를 해보라고 한다.","글쓴이는 독자에게 혼자 그 놀이를 해보라고 한다.","글쓴이는 독자에게 그 놀이를 그만하라고 한다.","글쓴이는 독자에게 선생님들에게 그 놀이를 가르치라고 한다."],"r":{"a":"1) The writer asks readers to play the game with friends. (글쓴이는 독자에게 친구들과 그 놀이를 해보라고 한다.)","ev":"13번 문장","s":[[13,"Now, try playing the game with your friends.","이제, 친구들과 그 놀이를 한번 해봐라."]],"c":1,"w":"13번 문장에서 이제 친구들과 그 놀이를 해보라고 해요."},"h":"23410d9cfb"},{"n":9,"t":"sum","q":"This game is from Indonesia. However, the (A) are (B) from Rock, Paper, Scissors.","ko":"이 놀이는 인도네시아에서 나왔다. 하지만 (A)은(는) 가위바위보와 (B).","opts":["(A) gestures / (B) different","(A) gestures / (B) same","(A) elephants / (B) different","(A) elephants / (B) same","(A) friends / (B) same"],"oko":["(A) 동작들 / (B) 다르다","(A) 동작들 / (B) 같다","(A) 코끼리들 / (B) 다르다","(A) 코끼리들 / (B) 같다","(A) 친구들 / (B) 같다"],"r":{"a":"1) (A) gestures / (B) different ((A) 동작들 / (B) 다르다)","ev":"3~4번 문장","s":[[3,"This is another version of the game from Indonesia.","이것은 인도네시아에서 나온 가위바위보의 또 다른 버전이다."],[4,"However, the gestures are different.","하지만, 동작들이 다르다."]],"c":1,"w":"3~4번 문장: 인도네시아에서 나온 또 다른 버전이고, 동작들(gestures)이 다르다(different)."},"h":"a7e6e148ae"},{"n":10,"t":"fill","q":"Are you [A] at Rock, Paper, Scissors? How about [B] Ant, Person, and Elephant?","ko":"당신은 가위바위보를 [A] 하는가? 개미, 사람, 코끼리 놀이를 [B] 것은 어떤가?","bank":["good","trying","thumb","finger","ear","because"],"bko":{"good":"잘하는","trying":"해보는(try의 -ing형)","thumb":"엄지","finger":"손가락","ear":"귀","because":"~ 때문에"},"r":{"a":"[A] good (잘하는), [B] trying (해보는(try의 -ing형))","ev":"1~2번 문장","s":[[1,"Are you good at Rock, Paper, Scissors?","당신은 가위바위보를 잘하는가?"],[2,"How about trying Ant, Person, and Elephant?","개미, 사람, 코끼리 놀이를 해보는 것은 어떤가?"]],"c":null,"w":"1~2번 문장: 가위바위보를 잘하는지(good) 묻고, 이 놀이를 해보자(trying)고 해요."},"h":"12f8e80884"}]},{"u":8,"id":"hk1-08-3","no":3,"ko":"지구야 잘 자!","items":[{"n":1,"t":"tf","q":"Earth Hour is held once a year.","ko":"Earth Hour는 일 년에 한 번 열린다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Once a year, places all over the world go dark for Earth Hour.","일 년마다 한 번씩, 전 세계의 지역들이 Earth Hour를 위해 어두워진다."]],"w":"3번 문장에 Once a year, places all over the world go dark for Earth Hour라고 나와요.","c":"T"},"h":"59a43d5335"},{"n":2,"t":"tf","q":"Most cities around the world turn off their lights at night.","ko":"전 세계 대부분의 도시들은 밤에 불을 끈다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Most cities around the world stay bright all night long.","전 세계 대부분의 도시들은 밤새도록 밝은 상태를 유지한다."]],"w":"4번 문장은 대부분의 도시들이 밤새도록 밝은 상태를 유지한다(stay bright all night long)고 해요. 불을 끈다는 말은 반대예요.","c":"F"},"h":"798e8a33ce"},{"n":3,"t":"tf","q":"Only a few countries take part in Earth Hour.","ko":"몇몇 나라만 Earth Hour에 참여한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Each year, people in more than 180 nations turn off their lights for an hour.","매년, 180개 이상의 나라들의 사람들은 한 시간 동안 불을 끈다."]],"w":"7번 문장에서 180개 이상의 나라 사람들이 불을 끈다고 해요. 몇몇 나라만이 아니에요.","c":"F"},"h":"f8bd4a850f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This consumes a lot of electricity and causes light pollution.)","ko":"이것은 많은 전력을 소비하고 빛 공해를 초래한다.","word":"consumes","opts":["만들다","저장하다","소비하다","빌리다"],"r":{"a":"3) 소비하다","ev":"5번 문장","s":[[5,"This consumes a lot of electricity and causes light pollution.","이것은 많은 전력을 소비하고 빛 공해를 초래한다."]],"w":"밤새 밝은 도시가 전력을 많이 쓴다는 뜻이에요. 그래서 전력을 아끼자는 Earth Hour가 필요해요. consume은 '소비하다'예요.","c":3},"h":"01779154c2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In countries that participate in Earth Hour, electricity usage decreases by 4% on average.)","ko":"Earth Hour에 참여하는 나라들에서, 전력 사용량은 평균적으로 4퍼센트만큼 감소한다.","word":"decreases","opts":["늘어나다","줄어들다","그대로이다","멈추다"],"r":{"a":"2) 줄어들다","ev":"9번 문장","s":[[9,"In countries that participate in Earth Hour, electricity usage decreases by 4% on average.","Earth Hour에 참여하는 나라들에서, 전력 사용량은 평균적으로 4퍼센트만큼 감소한다."]],"w":"Earth Hour 덕분에 전력 사용이 줄어드는 효과를 말하는 문장이에요. 퍼센트만큼 줄어든다는 뜻이라서 decrease는 '감소하다'예요.","c":2},"h":"6dad30fa2c"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nWhat happens when they all do this then?","ko":"밑줄 친 this가 가리키는 것은?","sko":"그렇다면 그들 모두가 이것을 할 때 무슨 일이 일어나는가?","opts":["밤새도록 불을 켜 두는 것","전력을 더 많이 쓰는 것","한 시간 동안 불을 끄는 것","도시를 더 밝게 꾸미는 것"],"r":{"a":"3) 한 시간 동안 불을 끄는 것","ev":"7~8번 문장","s":[[7,"Each year, people in more than 180 nations turn off their lights for an hour.","매년, 180개 이상의 나라들의 사람들은 한 시간 동안 불을 끈다."],[8,"What happens when they all do this then?","그렇다면 그들 모두가 이것을 할 때 무슨 일이 일어나는가?"]],"w":"8번의 they는 7번의 180개 이상의 나라 사람들이에요. 그들이 하는 것(this)은 7번의 turn off their lights for an hour, 즉 한 시간 동안 불을 끄는 것이에요.","c":3},"h":"5e07a66690"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But more importantly, it reminds everyone that saving electricity can save our planet.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 더 중요하게, 그것은 모든 사람에게 전력을 아끼는 것이 우리의 행성을 구할 수 있다는 것을 상기시킨다.","opts":["그러나 더 중요한 것은, 모두가 전력을 많이 쓸수록 행성이 구해진다는 점이다.","그러나 더 중요한 것은, 행성을 구하면 전력이 저절로 아껴진다는 점이다.","그러나 더 중요한 것은, 전력을 아끼려면 행성을 떠나야 한다는 점이다.","그러나 더 중요하게, 그것은 모든 사람에게 전력을 아끼는 것이 우리의 행성을 구할 수 있음을 상기시킨다."],"r":{"a":"4) 그러나 더 중요하게, 그것은 모든 사람에게 전력을 아끼는 것이 우리의 행성을 구할 수 있음을 상기시킨다.","ev":"10번 문장","s":[[10,"But more importantly, it reminds everyone that saving electricity can save our planet.","그러나 더 중요하게, 그것은 모든 사람에게 전력을 아끼는 것이 우리의 행성을 구할 수 있다는 것을 상기시킨다."]],"w":"remind + 사람 + that절은 '~에게 …을 상기시키다'예요. that절의 주어는 saving electricity(전력을 아끼는 것)이고, 그것이 행성을 구할 수 있다는 내용이에요. 원인과 결과를 뒤집은 선지에 주의하세요.","c":4},"h":"cae80fccef"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["서울의 N서울타워도 Earth Hour를 위해 불을 끈다.","Earth Hour는 매달 첫째 월요일에 열린다.","빛 공해는 불을 끄는 도시들이 일으킨다.","Earth Hour는 유럽 사람들만을 위한 것이다."],"opts":["N Seoul Tower in Seoul also turns off its lights for Earth Hour.","Earth Hour is held on the first Monday of every month.","Light pollution is caused by cities that turn off their lights.","Earth Hour is only for people in Europe."],"r":{"a":"1) N Seoul Tower in Seoul also turns off its lights for Earth Hour.","ev":"1~2번 문장","s":[[1,"At 8:30 p.m. on the last Saturday of March, the Eiffel Tower in Paris turns off its lights.","3월의 마지막 주 토요일 오후 8시 30분에, 파리의 에펠탑은 불을 끈다."],[2,"The Opera House in Sydney and N Seoul Tower in Seoul switch off their lights as well.","시드니의 오페라 하우스와 서울의 N서울타워 또한 그것들의 불을 끈다."]],"w":"2번 문장에서 서울의 N서울타워도 불을 끈다고 해요. Earth Hour는 일 년에 한 번(3번), 3월 마지막 주 토요일(1번)이에요. 빛 공해는 불을 끄는 도시가 아니라 밤새 밝은 도시가 만들어요(4~5번). 180개 이상의 나라가 참여해요(7번).","c":1},"h":"ac68194b00"},{"n":9,"t":"sum","q":"Earth Hour was started to (A) people’s (B) to these problems.","ko":"Earth Hour는 이러한 문제들에 사람들의 (B)을(를) (A) 위해 시작되었다.","opts":["(A) draw / (B) attention","(A) draw / (B) money","(A) lose / (B) attention","(A) lose / (B) money","(A) hide / (B) money"],"oko":["(A) 끌기 / (B) 관심","(A) 끌기 / (B) 돈","(A) 잃기 / (B) 관심","(A) 잃기 / (B) 돈","(A) 숨기기 / (B) 돈"],"r":{"a":"1) (A) draw / (B) attention ((A) 끌기 / (B) 관심)","ev":"6번 문장","s":[[6,"Earth Hour was started to draw people’s attention to these problems.","Earth Hour는 이러한 문제들에 사람들의 관심을 끌기 위해 시작되었다."]],"c":1,"w":"6번 문장: 이 문제들에 사람들의 관심(attention)을 끌기(draw) 위해 시작되었어요."},"h":"58c7e686fb"},{"n":10,"t":"fill","q":"At 8:30 p.m. on the last [A] of March, the [B] Tower in Paris turns off its lights.","ko":"3월의 마지막 주 [A] 오후 8시 30분에, 파리의 [B]탑은 불을 끈다.","bank":["Saturday","Eiffel","planet","electricity","pollution","average"],"bko":{"Saturday":"토요일","Eiffel":"에펠","planet":"행성","electricity":"전력","pollution":"공해","average":"평균"},"r":{"a":"[A] Saturday (토요일), [B] Eiffel (에펠)","ev":"1번 문장","s":[[1,"At 8:30 p.m. on the last Saturday of March, the Eiffel Tower in Paris turns off its lights.","3월의 마지막 주 토요일 오후 8시 30분에, 파리의 에펠탑은 불을 끈다."]],"c":null,"w":"1번 문장: 3월의 마지막 주 토요일(Saturday) 오후 8시 30분에 파리의 에펠(Eiffel)탑이 불을 꺼요."},"h":"e943633490"}]},{"u":8,"id":"hk1-08-4","no":4,"ko":"좋아해서 그래~","items":[{"n":1,"t":"tf","q":"Jessica and Amber both cover their mouths when they laugh.","ko":"Jessica와 Amber는 웃을 때 둘 다 입을 가린다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They both cover their mouths when they laugh.","그들이 웃을 때는 둘 다 입을 가린다."]],"w":"3번 문장에 They both cover their mouths when they laugh가 그대로 나와요.","c":"T"},"h":"19ea8d0d51"},{"n":2,"t":"tf","q":"The Chameleon Effect happens more often when we are far from people.","ko":"카멜레온 효과는 우리가 사람들과 멀리 떨어져 있을 때 더 자주 일어난다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"It happens more often if we are close to them.","만약 우리가 그들과 가깝다면 그것은 더 자주 일어난다."]],"w":"6번 문장은 그들과 가까울 때(if we are close to them) 더 자주 일어난다고 해요. 멀리 있을 때가 아니에요.","c":"F"},"h":"d4a8ee77a2"},{"n":3,"t":"tf","q":"Psychologists call this phenomenon the Chameleon Effect.","ko":"심리학자들은 이 현상을 카멜레온 효과라고 부른다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Psychologists call this phenomenon the Chameleon Effect.","심리학자들은 이 현상을 카멜레온 효과라고 부른다."]],"w":"8번 문장에 Psychologists call this phenomenon the Chameleon Effect가 그대로 나와요.","c":"T"},"h":"18edc01029"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (And interestingly, we usually don’t even notice it.)","ko":"그리고 흥미롭게도, 우리는 보통 그것을 의식하지도 못한다.","word":"notice","opts":["잊다","거절하다","알아차리다","허락하다"],"r":{"a":"3) 알아차리다","ev":"7번 문장","s":[[7,"And interestingly, we usually don’t even notice it.","그리고 흥미롭게도, 우리는 보통 그것을 의식하지도 못한다."]],"w":"주변 사람처럼 행동하고 있다는 사실을 우리가 알아차리지 못한다는 뜻이에요. don’t even notice는 '알아차리지도 못하다'예요. notice는 '의식하다, 알아차리다'예요.","c":3},"h":"5744373fe9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In fact, they share many other similar habits.)","ko":"사실, 그들은 다른 많은 비슷한 습관들을 공유한다.","word":"share","opts":["공유하다","버리다","숨기다","빌려주다"],"r":{"a":"1) 공유하다","ev":"4번 문장","s":[[4,"In fact, they share many other similar habits.","사실, 그들은 다른 많은 비슷한 습관들을 공유한다."]],"w":"Jessica와 Amber가 말 속도, 웃는 모습뿐 아니라 다른 습관도 둘 다 갖고 있다는 뜻이에요. share는 여기서 '공유하다, 함께 갖고 있다'예요.","c":1},"h":"da8afcaa62"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis is why we naturally follow what others do, because it can cause them to like us more!","ko":"밑줄 친 it이 가리키는 것은?","sko":"이것이 우리가 자연스럽게 다른 사람들이 하는 것을 따라 하는 이유인데, 왜냐하면 그들이 우리를 더 많이 좋아하도록 만들 수 있기 때문이다!","opts":["카멜레온이 색을 바꾸는 것","다른 사람들이 하는 것을 따라 하는 것","습관을 숨기는 것","친구와 다투는 것"],"r":{"a":"2) 다른 사람들이 하는 것을 따라 하는 것","ev":"11~12번 문장","s":[[11,"By nature, people are attracted to someone who is similar to them.","본래, 사람들은 그들과 비슷한 누군가에게 마음이 끌린다."],[12,"This is why we naturally follow what others do, because it can cause them to like us more!","이것이 우리가 자연스럽게 다른 사람들이 하는 것을 따라 하는 이유인데, 왜냐하면 그들이 우리를 더 많이 좋아하도록 만들 수 있기 때문이다!"]],"w":"12번 because 앞에서 우리는 다른 사람들이 하는 것을 따라 한다고 했어요. 그것(= 따라 하는 것)이 그들이 우리를 더 좋아하게 만들 수 있다는 이유가 돼요.","c":2},"h":"b03e73539b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Just think how you act when your crush or friends are around.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신의 짝사랑 상대나 친구들이 주변에 있을 때 당신이 어떻게 행동하는지 한번 생각해보아라.","opts":["당신의 짝사랑 상대와 친구들이 떠났을 때 어떻게 행동하는지 생각해 봐라.","당신의 짝사랑 상대가 어떻게 행동하는지 한번 생각해 봐라.","당신이 짝사랑 상대와 친구들에게 어떻게 행동해야 하는지 알려 줘라.","당신의 짝사랑 상대나 친구들이 주변에 있을 때 당신이 어떻게 행동하는지 생각해 보아라."],"r":{"a":"4) 당신의 짝사랑 상대나 친구들이 주변에 있을 때 당신이 어떻게 행동하는지 생각해 보아라.","ev":"13번 문장","s":[[13,"Just think how you act when your crush or friends are around.","당신의 짝사랑 상대나 친구들이 주변에 있을 때 당신이 어떻게 행동하는지 한번 생각해보아라."]],"w":"think 뒤의 how you act는 '네가 어떻게 행동하는지'예요. when your crush or friends are around는 '짝사랑 상대나 친구들이 주변에 있을 때'예요. 떠났을 때가 아니고, 상대의 행동이 아니라 내 행동이에요.","c":4},"h":"26a3cea88d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Jessica는 말이 빠르지만 Amber는 느리게 말한다.","사람들은 다른 사람처럼 행동할 때 항상 알아차린다.","Jessica와 Amber는 둘 다 말을 매우 빠르게 한다.","Jessica와 Amber는 어떤 습관도 공유하지 않는다."],"opts":["Jessica talks fast, but Amber talks slowly.","People always notice when they act like others.","Jessica and Amber both talk very fast.","Jessica and Amber never share any habits."],"r":{"a":"3) Jessica and Amber both talk very fast.","ev":"2번 문장","s":[[2,"Jessica talks very fast, and Amber does too.","Jessica는 말을 매우 빠르게 하는데, Amber도 역시 그렇다."]],"w":"2번 문장에서 Jessica는 말을 매우 빠르게 하는데 Amber도 그렇다고 해요. 4번에서 둘은 비슷한 습관을 많이 공유하고, 7번에서 우리는 보통 그것을 알아차리지 못해요.","c":3},"h":"079ebe4774"},{"n":9,"t":"sum","q":"By (A), people are (B) to someone who is similar to them.","ko":"(A), 사람들은 그들과 비슷한 누군가에게 마음이 (B).","opts":["(A) nature / (B) at  아카데미상과 오스카상","ev":"1~2번 문장","s":[[1,"Have you heard of the Academy Awards or the Oscars?","당신은 아카데미상 또는 오스카상에 대해 들어본 적이 있는가?"],[2,"How are they different?","그것들은 어떻게 다른가?"]],"c":1,"k":"they = 아카데미상과 오스카상","w":"1번 문장의 the Academy Awards와 the Oscars를 2번 문장의 they가 가리켜요."},"h":"e54273f544"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since then, that has been the trophy’s nickname, and people have called the Academy Awards the Oscars.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 이후로, 오스카는 트로피의 별명이 되었고, 사람들은 아카데미상을 오스카상이라고 불러왔다.","opts":["그 이후로 트로피는 아카데미상이 되었고, 사람들은 오스카라는 이름을 싫어했다.","그 이후로 오스카는 기자의 별명이 되었고, 사람들은 트로피를 아카데미상이라고만 불렀다.","그 이후로 오스카는 트로피의 별명이 되었고, 사람들은 아카데미상을 오스카상이라고 불러 왔다.","그 이후로 트로피는 삼촌의 이름이 되었고, 사람들은 도서관을 오스카상이라고 불렀다."],"r":{"a":"3) 그 이후로 오스카는 트로피의 별명이 되었고, 사람들은 아카데미상을 오스카상이라고 불러 왔다.","ev":"12번 문장","s":[[12,"Since then, that has been the trophy’s nickname, and people have called the Academy Awards the Oscars.","그 이후로, 오스카는 트로피의 별명이 되었고, 사람들은 아카데미상을 오스카상이라고 불러왔다."]],"w":"since then은 '그 이후로', the trophy’s nickname은 '트로피의 별명', call A B는 'A를 B라고 부르다'예요. 이 뜻을 모두 담은 건 3번이에요.","c":3},"h":"c00454d2a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Margaret은 도서관 책상 위의 아카데미상 트로피를 보았다.","Margaret Herrick은 신문사의 기자였다.","트로피는 기자의 삼촌 이름을 따서 이름 지어졌다.","아카데미상 수상자들은 오스카라고 불린다."],"opts":["Margaret saw the Academy Award trophy on a library desk.","Margaret Herrick was a reporter at a newspaper.","The trophy was named after the reporter’s uncle.","The winners of the Academy Awards are called Oscars."],"r":{"a":"1) Margaret saw the Academy Award trophy on a library desk.","ev":"5번, 7~8번 문장","s":[[5,"This is because the trophy that the winners get is known as an Oscar.","이것은 수상자들이 받는 트로피가 오스카상으로 알려져 있기 때문이다."],[7,"Margaret Herrick was a librarian at the organization that presents the Academy Awards.","Margaret Herrick은 아카데미상을 수여하는 조직의 사서였다."],[8,"One day in 1931, she saw the Academy Award trophy on a library desk.", ]],"w":"8번 문장에서 Usually, nights in Ethiopia are cool(에티오피아의 밤은 서늘하다)이라고 해요. 덥다는 말은 반대예요.","c":"F"},"h":"ac7d4b87d1"},{"n":3,"t":"tf","q":"The Warka Tower has a mesh net and a water tank.","ko":"와카 타워에는 그물망과 물탱크가 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The tower consisted of a mesh net and an empty water tank at the bottom.","그 타워는 그물망과 바닥에 있는 빈 물탱크로 이루어졌다."]],"w":"5번 문장에서 타워는 mesh net(그물망)과 empty water tank(빈 물탱크)로 이루어졌다고 해요.","c":"T"},"h":"6f2bd3ea35"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He built a nine-meter-high tower to collect water.)","ko":"그는 물을 모으기 위해 9미터 높이의 타워를 지었다.","opts":["씻다","모으다","버리다","섞다"],"word":"collect","r":{"a":"2) 모으다","ev":"4번, 12번 문장","s":[[4,"He built a nine-meter-high tower to collect water.","그는 물을 모으기 위해 9미터 높이의 타워를 지었다."],[12,"This way, it can collect 50 to 100 liters of clean water per day!","이렇게 하여, 그것은 하루에 50에서 100리터의 깨끗한 물을 모을 수 있다!"]],"w":"타워를 지은 이유가 물을 모으려는 것이고, 12번에서 하루에 50~100리터의 물을 모을 수 있다(collect)고 해요. collect = 모으다.","c":2},"h":"7fb8852692"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (the water vapor in the air turns into water drops)","ko":"공기 중의 수증기는 물방울로 변한다.","opts":["방울","구멍","그림자","바위"],"word":"drops","r":{"a":"1) 방울","ev":"10~11번 문장","s":[[10,"When the temperature drops, the water vapor in the air turns into water drops.","기온이 떨어질 때, 공기 중의 수증기는 물방울로 변한다."],[11,"The Warka Tower was designed so that the water drops could form on its net and then fall into the tank.","와카 타워는 망에 물방울이 형성되어 물탱크 안에 떨어질 수 있도록 설계되었다."]],"w":"10번에서 수증기가 water drops로 변하고, 11번에서 그 drops가 망에 맺혀 탱크로 떨어져요. 그러니 drops = 물방울이에요.","c":1},"h":"af20691d48"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nThe Warka Tower was designed so that the water drops could form on its net and then fall into the tank.","ko":"밑줄 친 its가 가리키는 것은?","sko":"와카 타워는 망에 물방울이 형성되어 물탱크 안에 떨어질 수 있도록 설계되었다.","opts":["물방울","에티오피아의 마을","와카 타워","건축가"],"r":{"a":"3) 와카 타워","ev":"5번, 11번 문장","s":[[5,"The tower consisted of a mesh net and an empty water tank at the bottom.","그 타워는 그물망과 바닥에 있는 빈 물탱크로 이루어졌다."],[11,"The Warka Tower was designed so that the water drops could form on its net and then fall into the tank.","와카 타워는 망에 물방울이 형성되어 물탱크 안에 떨어질 수 있도록 설계되었다."]],"w":"5번에서 타워가 mesh net(그물망)과 물탱크로 이루어졌다고 했어요. 11번의 its net은 '와카 타워의 망'이에요.","c":3},"h":"da6f889efd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The temperature at night is lower than during the daytime by 10 to 15 degrees Celsius.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"밤 기온이 낮 시간 동안보다 섭씨 10도에서 15도만큼 더 낮다.","opts":["밤 기온은 낮 기온보다 10~15도 높다.","낮 기온은 밤 기온보다 10~15도 낮다.","밤 기온은 항상 10도에서 15도 사이이다.","밤 기온은 낮 기온보다 10~15도 낮다."],"r":{"a":"4) 밤 기온은 낮 기온보다 10~15도 낮다.","ev":"9번 문장","s":[[9,"The temperature at night is lower than during the daytime by 10 to 15 degrees Celsius.","밤 기온이 낮 시간 동안보다 섭씨 10도에서 15도만큼 더 낮다."]],"w":"lower than은 '~보다 더 낮은', by는 차이를 나타내요. 밤이 낮보다 10~15도 낮다는 뜻이라서 4번이에요. 밤의 기온 자체가 10~15도라는 말이 아니에요.","c":4},"h":"d0ec55f3a2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The Warka Tower was named after a native tree in Ethiopia.","The Warka Tower was named after the architect.","The Warka Tower was named after a mountain in Ethiopia.","The Warka Tower was named after a river in Ethiopia."],"oko":["와카 타워는 에티오피아에 자생하는 나무의 이름을 따서 이름 지어졌다.","와카 타워는 건축가의 이름을 따서 이름 지어졌다.","와카 타워는 에티오피아의 한 산의 이름을 따서 이름 지어졌다.","와카 타워는 에티오피아의 한 강의 이름을 따서 이름 지어졌다."],"r":{"a":"1) The Warka Tower was named after a native tree in Ethiopia. (와카 타워는 에티오피아에 자생하는 나무의 이름을 따서 이름 지어졌다.)","ev":"6~7번 문장","s":[[6,"He called it the Warka Tower.","그는 그것을 와카 타워라고 불렀다."],[7,"It was named after a native tree in Ethiopia.","그것은 에티오피아에 자생하는 나무의 이름을 따서 이름 지어졌다."]],"c":1,"w":"7번 문장에서 에티오피아에 자생하는 나무의 이름을 따서 이름 지어졌다고 해요."},"h":"763431aeba"},{"n":9,"t":"sum","q":"(A) times, the water was not even (B).","ko":"(A)의 경우, 그 물은 심지어 (B)지도 않았다.","opts":["(A) Most / (B) clean","(A) Few / (B) c
