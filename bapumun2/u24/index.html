hy": "뒤 칸 took는 과거형이라서 would와 짝이 맞지 않아요. 주절은 would + 동사원형이에요."}, {"n": "④", "en": "had - would take", "ko": "가지고 있다면 - 찍을 텐데", "ok": true, "why": "if절은 과거형 had, 주절은 would + 동사원형 take로 짝이 맞아요."}, {"n": "⑤", "en": "would have - took", "ko": "갖게 될 것이다 - 찍었다", "ok": false, "why": "if절에는 would를 쓰지 않고, 뒤 칸도 과거형 took라서 틀려요."}], "pencil": "if절은 동사의 ___, 주절은 would + 동사원형", "pencilKey": "과거형", "page": 239, "sec": "s1"}, {"id": "S1-03", "step": 1, "no": 3, "qtype": "유형 01 가정법 과거", "type": "mc", "ans": "②", "concept": ["087", "012"], "gap": "", "words": [["hurried up", "서둘렀다 (원형 hurry up 서두르다)"], ["late", "늦은"], ["catch", "잡다, (차를) 타다"], ["arrive", "도착하다"]], "h1": "먼저 if절의 동사 hurried(서둘렀다)가 어떤 시제인지 보세요. 이 문제는 빈칸에 '알맞지 않은 것'을 찾는 문제라서, 모양이 나머지 넷과 다른 보기를 골라야 해요.", "h2": "if절 동사가 과거형이면 지금 사실과 반대로 상상하는 문장이에요. 이때 주절에는 will, can처럼 현재형 조동사가 어울릴까요, would, could처럼 과거형 조동사가 어울릴까요?", "why": "if절이 과거형(hurried)이면 주절에는 조동사의 과거형 + 동사원형이 와요. will not be는 과거형 조동사가 아니라서 어울리지 않아요.", "opts": [{"n": "①", "en": "could meet her", "ko": "그녀를 만날 수 있을 텐데", "ok": false, "why": "could(할 수 있을 텐데) + 동사원형이라서 알맞아요."}, {"n": "②", "en": "will not be late", "ko": "늦지 않을 것이다", "ok": true, "why": "will은 현재형 조동사라서 과거형 if절과 짝이 맞지 않아요."}, {"n": "③", "en": "could buy the ticket", "ko": "표를 살 수 있을 텐데", "ok": false, "why": "could + 동사원형이라서 알맞아요."}, {"n": "④", "en": "could catch the bus", "ko": "버스를 탈 수 있을 텐데", "ok": false, "why": "could + 동사원형이라서 알맞아요."}, {"n": "⑤", "en": "would arrive on time", "ko": "제시간에 도착할 텐데", "ok": false, "why": "would + 동사원형이라서 알맞아요."}], "pencil": "if절이 과거형이면 주절은 ___ + 동사원형", "pencilKey": "조동사의 과거형", "page": 239, "sec": "s1"}, {"id": "S1-04", "step": 1, "no": 4, "qtype": "유형 01 가정법 과거", "type": "mc", "ans": "⑤", "concept": ["087"], "gap": "", "words": [["apologize to", "~에게 사과하다 (원형 apologize 사과하다)"], ["would", "~할 텐데"], ["were", "~이다의 과거형"]], "h1": "'내가 너라면'은 현실이 아닌 상상이에요. 보기마다 if절의 be동사 모양과 주절의 동사 모양을 따로 살펴보세요.", "h2": "상상하는 문장에서는 if절 be동사를 주어와 상관없이 한 가지 모양으로 쓰고, 주절에는 would + 동사원형을 써요. 두 가지를 모두 만족하는 보기를 찾아보세요.", "why": "「If I were you, I would + 동사원형」은 '내가 너라면 ~할 텐데'라는 뜻이에요. if절은 were, 주절은 would apologize(사과할 텐데)가 맞아요.", "opts": [{"n": "①", "en": "If I am you, I apologize to her.", "ko": "내가 너이면, 나는 그녀에게 사과한다.", "ok": false, "why": "am과 현재형 apologize를 써서 상상하는 뜻이 나오지 않아요."}, {"n": "②", "en": "If I am you, I would apologize to her.", "ko": "내가 너이면, 나는 그녀에게 사과할 텐데.", "ok": false, "why": "if절의 am이 틀려요. were를 써야 해요."}, {"n": "③", "en": "If I will be you, I will apologize to her.", "ko": "내가 너일 것이라면, 나는 그녀에게 사과할 것이다.", "ok": false, "why": "if절에 will을 쓰지 않고, 주절의 will도 would여야 해요."}, {"n": "④", "en": "If I were you, I will apologize to her.", "ko": "내가 너라면, 나는 그녀에게 사과할 것이다.", "ok": false, "why": "if절은 맞지만 주절의 will이 틀려요. would여야 해요."}, {"n": "⑤", "en": "If I were you, I would apologize to her.", "ko": "내가 너라면, 나는 그녀에게 사과할 텐데.", "ok": true, "why": "if절은 were, 주절은 would + 동사원형이라서 모두 맞아요."}], "pencil": "'내가 너라면 ~할 텐데'는 If I ___ you, I would + 동사원형", "pencilKey": "were", "page": 239, "sec": "s1"}, {"id": "S1-05", "step": 1, "no": 5, "qtype": "유형 01 가정법 과거", "type": "write", "ans": "invited, would go", "concept": ["087", "012"], "gap": "", "words": [["invite", "초대하다"], ["go to the party", "파티에 가다 (원형 go 가다)"], ["will go", "갈 것이다 (원형 go 가다)"]], "h1": "괄호 속 invite(초대하다)와 will go(갈 것이다)를 그대로 쓰면 안 돼요. 우리말이 '~한다면 ~할 텐데'라는 상상의 문장이라는 점을 먼저 확인하세요.", "h2": "상상하는 문장은 if절 동사를 '과거형'으로, 주절은 '조동사의 과거형 + 동사원형'으로 써요. will의 과거형이 무엇인지 떠올려 보세요.", "why": "if절에는 invite(초대하다)의 과거형 invited를, 주절에는 will의 과거형 would에 동사원형 go(가다)를 붙여 would go라고 써요.", "opts": [], "pencil": "if절 동사는 과거형, 주절은 will의 과거형 ___ + 동사원형", "pencilKey": "would", "page": 239, "sec": "s1"}, {"id": "S1-06", "step": 1, "no": 6, "qtype": "유형 01 가정법 과거", "type": "write", "ans": "If she lived next door, I could see her every day.", "concept": ["087", "012"], "gap": "", "words": [["next door", "옆집에"], ["lived", "살았다 (원형 live 살다)"], ["see", "보다"], ["every day", "매일"], ["could", "~할 수 있을 텐데 (can의 과거형)"]], "h1": "문장이 If로 시작해요. '만일 ~라면 …할 수 있을 텐데'를 말하는 문장이니, 먼저 if절에 들어갈 말(she, lived, next door)부터 정해 보세요.", "h2": "if절은 「주어 + 동사의 과거형」, 주절은 「주어 + could + 동사원형」 순서예요. 괄호 속 동사 lived(살았다)와 see(보다)가 각각 어느 쪽에 들어갈지 정해 보세요.", "why": "'옆집에 산다면'이 if절이고, '매일 볼 수 있을 텐데'가 주절이에요. 지금 옆집에 살지 않는다는 사실과 반대로 상상하는 문장이라서 lived와 could see를 써요.", "opts": [], "pencil": "If + 주어 + 동사의 ___, 주어 + could + 동사원형", "pencilKey": "과거형", "page": 239, "sec": "s1"}, {"id": "S1-07", "step": 1, "no": 7, "qtype": "유형 01 가정법 과거", "type": "mc", "ans": "④", "concept": ["087", "042"], "gap": "", "words": [["umbrella", "우산"], ["author", "작가"], ["detective story", "탐정 소설"], ["fly", "날다"]], "h1": "'어색한 것'을 찾는 문제예요. 다섯 문장 모두 if절과 주절이 있으니, 두 절의 동사 모양이 짝이 맞는지 하나씩 비교해 보세요.", "h2": "주절에 could, would가 있으면 if절 동사는 과거형(be동사는 were)이어야 해요. if절 동사가 현재형으로 되어 있는 문장을 찾아보세요.", "why": "if절이 현재형 has(원형 have 가지다)인데 주절은 could예요. 짝이 안 맞아서 어색해요. had로 고쳐야 해요.", "opts": [{"n": "①", "en": "If I were you, I would talk to her.", "ko": "내가 너라면, 나는 그녀에게 말할 텐데.", "ok": false, "why": "were와 would + 동사원형이라서 맞아요."}, {"n": "②", "en": "If I were a bird, I could fly to her.", "ko": "내가 새라면, 그녀에게 날아갈 수 있을 텐데.", "ok": false, "why": "were와 could + 동사원형이라서 맞아요."}, {"n": "③", "en": "If I were a doctor, I could help you.", "ko": "내가 의사라면, 너를 도울 수 있을 텐데.", "ok": false, "why": "were와 could + 동사원형이라서 맞아요."}, {"n": "④", "en": "If she has an umbrella, she could go out.", "ko": "그녀에게 우산이 있다면, 그녀는 나갈 수 있을 텐데.", "ok": true, "why": "if절이 현재형 has라서 주절 could와 짝이 안 맞아요. had로 고쳐야 해요."}, {"n": "⑤", "en": "If she were an author, she would write a detective story.", "ko": "그녀가 작가라면, 탐정 소설을 쓸 텐데.", "ok": false, "why": "were와 would + 동사원형이라서 맞아요."}], "pencil": "주절에 could가 있으면 if절 동사는 ___", "pencilKey": "과거형", "page": 239, "sec": "s1"}, {"id": "S1-08", "step": 1, "no": 8, "qtype": "유형 02 가정법 문장 전환", "type": "write", "ans": "were, would travel", "concept": ["089", "087"], "gap": "", "words": [["travel", "여행하다"], ["Seoul", "서울"], ["As", "~이기 때문에"]], "h1": "첫 문장은 '서울에 있지 않아서 너와 여행하지 않는다'는 실제 사실이에요. 둘째 문장은 이 사실과 반대로 상상하는 문장이에요.", "h2": "사실을 말하는 현재 문장을 상상하는 문장으로 바꿀 때는 동사를 과거 모양으로 쓰고, 뜻은 반대로 만들어요. 첫 문장에는 not이 있지만 둘째 문장의 칸에는 not이 필요한지 생각해 보세요.", "why": "'서울에 있지 않다(am not)'의 반대는 '서울에 있다면'이라서 were를, '여행하지 않는다(don't travel)'의 반대는 '여행할 텐데'라서 would travel을 써요.", "opts": [], "pencil": "사실이 부정이면, 상상하는 문장에서는 ___으로 쓴다", "pencilKey": "긍정", "page": 239, "sec": "s1"}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 02 가정법 문장 전환", "type": "mc", "ans": "③", "concept": ["089", "087"], "gap": "", "words": [["honest", "정직한"], ["employ", "고용하다"], ["As", "~이기 때문에"]], "h1": "위 문장은 '정직하다면 고용할 텐데'라는 상상이에요. 아래 문장은 실제 사실을 말하는 문장이에요. 실제 사실은 어떤지 생각해 보세요.", "h2": "상상 문장은 실제 사실과 반대예요. 그래서 긍정은 부정으로 바뀌어요. 또 were는 현재형 be동사로, would는 같은 뜻의 현재형 조동사로 바꿔요.", "why": "상상하는 문장을 실제 사실로 바꾸면 뜻이 반대가 돼요. were honest(정직하다면)는 isn't honest(정직하지 않다), would employ(고용할 텐데)는 won't employ(고용하지 않을 것이다)가 돼요.", "opts": [{"n": "①", "en": "is - will employ", "ko": "~이다 - 고용할 것이다", "ok": false, "why": "긍정 그대로라서 뜻이 반대가 되지 않았어요."}, {"n": "②", "en": "was - would employ", "ko": "~이었다 - 고용할 텐데", "ok": false, "why": "과거형이고 긍정이라서 틀려요."}, {"n": "③", "en": "isn't - won't employ", "ko": "~이 아니다 - 고용하지 않을 것이다", "ok": true, "why": "현재형이면서 뜻이 반대라서 알맞아요."}, {"n": "④", "en": "will be - won't employ", "ko": "~일 것이다 - 고용하지 않을 것이다", "ok": false, "why": "앞 칸이 미래 표현이고 부정도 아니라서 틀려요."}, {"n": "⑤", "en": "wasn't - wouldn't employ", "ko": "~이 아니었다 - 고용하지 않을 텐데", "ok": false, "why": "과거형이라서 '지금 사실'을 말하지 못해요."}], "pencil": "가정법 과거를 사실로 바꾸면 긍정은 ___이 되고 시제는 현재가 된다", "pencilKey": "부정", "page": 240, "sec": "s1"}, {"id": "S1-10", "step": 1, "no": 10, "qtype": "유형 02 가정법 문장 전환", "type": "write", "ans": "don't live → live", "concept": ["089", "087"], "gap": "", "words": [["apartment", "아파트"], ["keep a dog", "개를 기르다 (원형 keep 기르다)"], ["live", "살다"]], "h1": "위 문장은 '아파트에 살지 않는다면 개를 키울 수 있을 텐데'라는 상상이에요. 이것을 사실로 바꾸면 아파트에 사는 걸까요, 안 사는 걸까요?", "h2": "상상 문장에서 부정(didn't live)이 나오면 실제 사실은 반대로 긍정이에요. 아래 문장의 첫 부분이 이 사실과 맞는지 확인하고, 틀린 두 단어를 찾아보세요.", "why": "상상 문장은 '아파트에 살지 않는다면'이라서 실제 사실은 '아파트에 산다'예요. 그래서 don't live(살지 않는다)를 live(산다)로 고쳐야 해요.", "opts": [], "pencil": "가정법의 부정은 사실로 바꿀 때 ___이 된다", "pencilKey": "긍정", "page": 240, "sec": "s1"}, {"id": "S1-11", "step": 1, "no": 11, "qtype": "유형 02 가정법 문장 전환", "type": "mc", "ans": "②", "concept": ["089", "087"], "gap": "", "words": [["true friend", "진정한 친구"], ["tell lies", "거짓말을 하다 (원형 tell 말하다)"]], "h1": "주어진 문장은 '진정한 친구라면 거짓말하지 않을 텐데'라는 상상이에요. 실제 사실은 어떨지 생각하고, 보기에서 같은 뜻의 사실 문장을 찾아보세요.", "h2": "상상 문장을 사실로 바꾸면 긍정과 부정이 서로 바뀌어요. 또 시제는 '현재'로 바뀌어요. 과거형이 쓰인 보기는 시제부터 맞지 않아요.", "why": "were a true friend(진정한 친구라면)는 isn't a true friend(진정한 친구가 아니다)로, wouldn't tell lies(거짓말하지 않을 텐데)는 tells lies(거짓말을 한다)로 바뀌어요.", "opts": [{"n": "①", "en": "As he is a true friend, he tells lies.", "ko": "그는 진정한 친구라서 거짓말을 한다.", "ok": false, "why": "'진정한 친구다'가 긍정이라서 뜻이 반대가 되지 않았어요."}, {"n": "②", "en": "He isn't a true friend, so he tells lies.", "ko": "그는 진정한 친구가 아니라서 거짓말을 한다.", "ok": true, "why": "두 부분 모두 반대로 바뀌고 현재형이라서 맞아요."}, {"n": "③", "en": "As he wasn't a true friend, he told lies.", "ko": "그는 진정한 친구가 아니었어서 거짓말을 했다.", "ok": false, "why": "과거형이라서 '지금 사실'과 시제가 맞지 않아요."}, {"n": "④", "en": "He is a true friend, so he doesn't tell lies.", "ko": "그는 진정한 친구라서 거짓말을 하지 않는다.", "ok": false, "why": "뜻이 원래 문장과 같은 방향이라서 반대로 바뀌지 않았어요."}, {"n": "⑤", "en": "As he wasn't a true friend, he would tell lies.", "ko": "그는 진정한 친구가 아니었어서 거짓말을 할 텐데.", "ok": false, "why": "과거형과 would가 섞여 사실 문장이 되지 않아요."}], "pencil": "가정법 과거를 사실로 바꾸면 긍정은 ___, 부정은 긍정이 된다", "pencilKey": "부정", "page": 240, "sec": "s1"}, {"id": "S1-12", "step": 1, "no": 12, "qtype": "유형 02 가정법 문장 전환", "type": "mc", "ans": "②", "concept": ["089", "087"], "gap": "", "words": [["give a ride", "태워 주다 (원형 give 주다)"], ["have a car", "차가 있다 (원형 have 가지다)"]], "h1": "주어진 문장은 '차가 없어서 태워 주지 않는다'는 사실이에요. 이것을 'If'로 시작하는 상상 문장으로 바꿔야 해요.", "h2": "사실을 상상 문장으로 바꿀 때는 뜻을 반대로 하고, 동사는 과거 모양으로 써요. 부정은 긍정으로 바꾸고, 조동사는 would로 써요. 보기마다 이 세 가지를 확인해 보세요.", "why": "'차가 없다(don't have)'는 상상 문장에서 'had a car(차가 있다면)'가 되고, '태워 주지 않는다(don't give)'는 'would give(태워 줄 텐데)'가 돼요.", "opts": [{"n": "①", "en": "If I have a car, I won't give you a ride.", "ko": "차가 있으면, 너를 태워 주지 않을 것이다.", "ok": false, "why": "현재형이라서 상상 문장이 아니고, 뜻도 반대가 아니에요."}, {"n": "②", "en": "If I had a car, I would give you a ride.", "ko": "내가 차가 있다면, 너를 태워 줄 텐데.", "ok": true, "why": "긍정으로 바뀌고 과거형 had와 would give가 짝이 맞아요."}, {"n": "③", "en": "If I don't have a car, I won't give you a ride.", "ko": "차가 없으면, 너를 태워 주지 않을 것이다.", "ok": false, "why": "사실을 그대로 현재형으로 말한 문장이에요."}, {"n": "④", "en": "If I don't have a car, you will give me a ride.", "ko": "차가 없으면, 네가 나를 태워 줄 것이다.", "ok": false, "why": "뜻이 달라지고 가정법 모양도 아니에요."}, {"n": "⑤", "en": "If I didn't have a car, I wouldn't give you a ride.", "ko": "내가 차가 없다면, 너를 태워 주지 않을 텐데.", "ok": false, "why": "부정이 그대로여서 사실과 같은 방향이에요. 반대로 바꿔야 해요."}], "pencil": "사실을 상상 문장으로 바꿀 때는 뜻을 ___로 만든다", "pencilKey": "반대", "page": 240, "sec": "s1"}, {"id": "S1-13", "step": 1, "no": 13, "qtype": "유형 02 가정법 문장 전환", "type": "write", "ans": "As I don't like the actor, I won't see his new movie. [또는 As I do not like the actor, I will not see his new movie.]", "concept": ["089", "087"], "gap": "", "words": [["actor", "배우"], ["see a movie", "영화를 보다 (원형 see 보다)"], ["As", "~이기 때문에"]], "h1": "주어진 문장은 '그 배우를 좋아한다면 새 영화를 볼 텐데'라는 상상이에요. 직설법(사실을 말하는 문장)으로 바꾸려면 실제 사실을 써야 해요. 접속사 As로 시작하는 문장이에요.", "h2": "상상 문장을 사실로 바꾸면 긍정은 부정으로, 과거 모양은 현재 모양으로 바뀌어요. liked(좋아했다, 원형 like 좋아하다)는 현재형으로 어떻게 되고, would see는 어떤 조동사가 될까요?", "why": "'좋아한다면 볼 텐데'의 사실은 '좋아하지 않아서 보지 않을 것이다'예요. liked는 don't like로, would see는 won't see로 바뀌어요.", "opts": [], "pencil": "가정법 과거를 사실로 바꾸면 긍정은 ___이 되고 would는 will로 바뀐다", "pencilKey": "부정", "page": 240, "sec": "s1"}, {"id": "S1-14", "step": 1, "no": 14, "qtype": "유형 02 가정법 문장 전환", "type": "write", "ans": "If she weren't sick, she would go hiking with me. [또는 If she were not sick, she would go hiking with me.]", "concept": ["089", "087"], "gap": "", "words": [["sick", "아픈"], ["go hiking", "하이킹 가다 (원형 go 가다)"], ["As", "~이기 때문에"]], "h1": "주어진 문장은 '그녀가 아파서 나와 하이킹을 가지 않는다'는 사실이에요. 이것을 If로 시작하는 상상 문장으로 바꿔 보세요.", "h2": "사실의 반대를 상상해요. '아프다'는 '아프지 않다면'으로, '가지 않는다'는 '갈 텐데'로 바꿔요. if절 be동사는 주어가 she여도 한 가지 모양(주어와 상관없이)을 써요.", "why": "'아프다(is sick)'의 반대는 '아프지 않다면(were not sick)'이고, '가지 않는다(doesn't go)'의 반대는 '갈 텐데(would go)'예요.", "opts": [], "pencil": "사실이 긍정이면 상상 문장에서는 ___으로 쓴다", "pencilKey": "부정", "page": 240, "sec": "s1"}, {"id": "S1-15", "step": 1, "no": 15, "qtype": "유형 02 가정법 문장 전환", "type": "mc", "ans": "③", "concept": ["089", "087"], "gap": "", "words": [["take a walk", "산책하다 (원형 take 하다)"], ["lazy", "게으른"], ["trust", "믿다"], ["truth", "진실"]], "h1": "'뜻이 서로 다른 것'을 찾는 문제예요. 각 보기에서 If로 시작한 상상 문장과 오른쪽의 사실 문장이 반대 뜻으로 잘 연결되었는지 하나씩 확인하세요.", "h2": "상상 문장을 사실로 바꾸면 긍정과 부정이 서로 바뀌고, 그 이유와 결과가 자연스럽게 이어져야 해요. 오른쪽 사실 문장이 '~이라서 ~이다'로 자연스럽게 이어지지 않는 보기가 답이에요.", "why": "③의 상상 문장은 '시간이 있다면 삼촌을 찾아갈 텐데'라서 사실은 '시간이 없어서 찾아가지 않는다'예요. 그런데 오른쪽은 '시간이 없지만 찾아갈 것이다'라서 뜻이 달라요.", "opts": [{"n": "①", "en": "If it rained, I couldn't take a walk. = As it doesn't rain, I can take a walk.", "ko": "비가 온다면, 산책할 수 없을 텐데. = 비가 오지 않아서 산책할 수 있다.", "ok": false, "why": "뜻이 서로 반대로 잘 바뀌었어요."}, {"n": "②", "en": "If he weren't lazy, he could get a job. = As he is lazy, he can't get a job.", "ko": "그가 게으르지 않다면 일자리를 구할 수 있을 텐데. = 그는 게을러서 일자리를 구하지 못한다.", "ok": false, "why": "뜻이 서로 반대로 잘 바뀌었어요."}, {"n": "③", "en": "If I had time, I would visit my uncle. = I don't have time, but I will visit my uncle.", "ko": "시간이 있다면 삼촌을 찾아뵐 텐데. = 시간이 없지만 삼촌을 찾아뵐 것이다.", "ok": true, "why": "'시간이 없어서 찾아뵙지 않는다'여야 하는데 but으로 이어 '찾아뵌다'고 해서 뜻이 달라요."}, {"n": "④", "en": "If you told the truth, I could trust you. = You don't tell the truth, so I can't trust you.", "ko": "네가 진실을 말한다면 너를 믿을 수 있을 텐데. = 너는 진실을 말하지 않아서 나는 너를 믿을 수 없다.", "ok": false, "why": "뜻이 서로 반대로 잘 바뀌었어요."}, {"n": "⑤", "en": "If Samuel were here, he could help us. = As Samuel isn't here, he can't help us.", "ko": "Samuel이 여기 있다면 우리를 도울 수 있을 텐데. = Samuel이 여기 없어서 우리를 도울 수 없다.", "ok": false, "why": "뜻이 서로 반대로 잘 바뀌었어요."}], "pencil": "가정법 과거를 사실로 바꾸면 상황이 ___이 된다", "pencilKey": "반대", "page": 240, "sec": "s1"}, {"id": "S1-16", "step": 1, "no": 16, "qtype": "유형 03 I wish 가정법 과거", "type": "mc", "ans": "③", "concept": ["090", "089"], "gap": "", "words": [["wish", "바라다, 소망하다"], ["play the piano", "피아노를 치다 (원형 play 연주하다)"], ["sorry", "유감스러운"]], "h1": "I wish 뒤에 could play(칠 수 있다면)가 나오면 '지금 못 치는 것'을 아쉬워하는 말이에요. 보기 중 같은 아쉬움을 말하는 문장을 찾아보세요.", "h2": "'I wish + 과거형'은 지금 사실과 반대되는 소망이에요. 소망의 내용이 반대이니 사실은 '못 친다'는 뜻이고, 시제는 현재예요. 보기에서 '지금 ~할 수 없어서 유감이다'를 찾아보세요.", "why": "I wish I could play the piano는 '피아노를 칠 수 있으면 좋을 텐데'라는 뜻이에요. 지금은 못 치는 것을 아쉬워하니까 I'm sorry that I can't play the piano(칠 수 없어서 유감이다)와 같아요.", "opts": [{"n": "①", "en": "I'm sorry that I play the piano.", "ko": "피아노를 쳐서 유감이다.", "ok": false, "why": "'피아노를 친다'는 긍정이라서 소망의 반대가 아니에요."}, {"n": "②", "en": "I'm sorry that I played the piano.", "ko": "피아노를 쳤던 것이 유감이다.", "ok": false, "why": "과거형이라서 '지금' 못하는 것을 아쉬워하는 뜻이 아니에요."}, {"n": "③", "en": "I'm sorry that I can't play the piano.", "ko": "피아노를 칠 수 없어서 유감이다.", "ok": true, "why": "현재 시점에 못 치는 사실을 말해서 같은 뜻이에요."}, {"n": "④", "en": "I'm sorry that I couldn't play the piano.", "ko": "피아노를 칠 수 없었던 것이 유감이다.", "ok": false, "why": "과거형이라서 '지금'의 아쉬움이 아니에요."}, {"n": "⑤", "en": "I'm sorry that I have played the piano.", "ko": "피아노를 쳐 왔던 것이 유감이다.", "ok": false, "why": "현재완료이고 긍정이라서 뜻이 달라요."}], "pencil": "I wish 가정법 과거는 ___ 사실과 반대되는 소망이다", "pencilKey": "지금(현재)", "page": 240, "sec": "s1"}, {"id": "S1-17", "step": 1, "no": 17, "qtype": "유형 03 I wish 가정법 과거", "type": "mc", "ans": "③", "concept": ["090"], "gap": "", "words": [["drive a car", "운전하다 (원형 drive 운전하다)"], ["wish", "바라다"], ["could", "~할 수 있을 텐데"]], "h1": "우리말이 '~라면 좋을 텐데'예요. I wish 뒤에 올 동사가 어떤 모양이어야 하는지 보기를 하나씩 확인해 보세요.", "h2": "I wish 뒤에는 지금 사실과 반대되는 소망이 와요. 그래서 동사나 조동사가 '과거 모양'이에요. 보기 중 can의 과거형을 쓴 것을 찾아보세요.", "why": "'내가 운전을 할 수 있으면 좋을 텐데'는 I wish I could drive a car예요. I wish 뒤에는 동사나 조동사의 과거형이 와요.", "opts": [{"n": "①", "en": "I wish I drive a car.", "ko": "내가 운전한다면 좋을 텐데.", "ok": false, "why": "drive가 현재형이라서 I wish 뒤에 올 수 없어요."}, {"n": "②", "en": "I wish I can drive a car.", "ko": "내가 운전할 수 있다면 좋을 텐데.", "ok": false, "why": "can이 현재형이라서 틀려요. could여야 해요."}, {"n": "③", "en": "I wish I could drive a car.", "ko": "내가 운전할 수 있으면 좋을 텐데.", "ok": true, "why": "could(과거형 조동사) + 동사원형이라서 맞아요."}, {"n": "④", "en": "I wish I couldn't drive a car.", "ko": "내가 운전할 수 없으면 좋을 텐데.", "ok": false, "why": "부정이라서 뜻이 반대가 돼요."}, {"n": "⑤", "en": "I wished I could have driven a car.", "ko": "내가 운전할 수 있었더라면 좋았을 텐데 하고 바랐다.", "ok": false, "why": "wished와 could have driven은 과거 일에 대한 후회라서 우리말과 뜻이 달라요."}], "pencil": "I wish 뒤에는 동사나 조동사의 ___을 쓴다", "pencilKey": "과거형", "page": 241, "sec": "s1"}, {"id": "S1-18", "step": 1, "no": 18, "qtype": "유형 03 I wish 가정법 과거", "type": "mc", "ans": "②", "concept": ["090", "089"], "gap": "", "words": [["sorry", "유감스러운"], ["sister", "언니, 여동생"], ["have", "가지고 있다"]], "h1": "'누이가 없어서 유감이다'를 I wish 문장으로 바꾸는 문제예요. 사실이 부정이니 소망은 긍정으로 바뀐다는 점을 떠올려 보세요.", "h2": "I wish 뒤에는 지금 사실과 반대되는 소망을 과거 모양으로 써요. 부정(don't have)은 긍정으로 바꾸고, 시제는 과거 모양으로 맞춰야 해요.", "why": "'I don't have a sister'의 반대는 '가지고 있다면'이라서, 과거형 had를 써서 I wish I had a sister(누이가 있으면 좋을 텐데)라고 해요.", "opts": [{"n": "①", "en": "have", "ko": "가지고 있다", "ok": false, "why": "현재형이라서 I wish 뒤에 올 수 없어요."}, {"n": "②", "en": "had", "ko": "가졌다 (원형 have 가지다)", "ok": true, "why": "I wish 뒤에 과거형을 써서 지금 사실과 반대되는 소망을 말해요."}, {"n": "③", "en": "won't have", "ko": "가지지 않을 것이다", "ok": false, "why": "미래의 부정이라서 뜻과 모양이 맞지 않아요."}, {"n": "④", "en": "don't have", "ko": "가지고 있지 않다", "ok": false, "why": "원래 문장의 사실을 그대로 쓴 것이라서 반대가 되지 않았어요."}, {"n": "⑤", "en": "didn't have", "ko": "가지고 있지 않았다", "ok": false, "why": "부정이라서 사실과 같은 방향이 돼요."}], "pencil": "I wish 가정법에서 사실의 부정은 ___으로 쓴다", "pencilKey": "긍정", "page": 241, "sec": "s1"}, {"id": "S1-19", "step": 1, "no": 19, "qtype": "유형 03 I wish 가정법 과거", "type": "write", "ans": "could speak", "concept": ["090", "089"], "gap": "", "words": [["speak", "말하다"], ["Chinese", "중국어"], ["sorry", "유감스러운"]], "h1": "'중국어를 말할 수 없어서 유감이다'를 I wish로 바꾸는 문제예요. can't speak(말할 수 없다)의 반대 뜻으로 써야 해요.", "h2": "I wish 뒤에는 지금 사실과 반대되는 소망을 과거 모양으로 써요. 조동사 can의 과거형이 무엇인지 떠올려 보고, 부정을 긍정으로 바꿔 보세요.", "why": "can't speak(말할 수 없다)의 반대는 '말할 수 있다면'이라서, I wish I could speak Chinese(중국어를 말할 수 있으면 좋을 텐데)가 돼요.", "opts": [], "pencil": "I wish 뒤의 can은 ___으로 바꿔 쓴다", "pencilKey": "could", "page": 241, "sec": "s1"}, {"id": "S1-20", "step": 1, "no": 20, "qtype": "유형 03 I wish 가정법 과거", "type": "write", "ans": "were", "concept": ["090", "006"], "gap": "", "words": [["Saturday", "토요일"], ["today", "오늘"], ["be", "~이다"]], "h1": "'오늘이 토요일이면 좋을 텐데'는 지금 토요일이 아니라서 아쉬운 소망이에요. 괄호 속 be(~이다)를 어떤 모양으로 바꿔야 할지 생각해 보세요.", "h2": "I wish 가정법 과거에서 be동사는 주어에 상관없이 한 가지 모양을 써요. 주어가 it이어도 was가 아니에요. 어떤 모양이었는지 떠올려 보세요.", "why": "I wish 뒤의 be동사는 주어가 무엇이든 were를 써요. 그래서 I wish it were Saturday today(오늘이 토요일이면 좋을 텐데)가 돼요.", "opts": [], "pencil": "I wish 가정법에서 be동사는 주어와 상관없이 ___", "pencilKey": "were", "page": 241, "sec": "s1"}, {"id": "S1-21", "step": 1, "no": 21, "qtype": "유형 04 as if 가정법 과거", "type": "mc", "ans": "②", "concept": ["090-2", "087"], "gap": "", "words": [["look rich", "부자처럼 보이다 (원형 look 보이다)"], ["in fact", "사실은"], ["as if", "마치 ~인 것처럼"]], "h1": "Elly는 부자로 보이지만 사실은 부자가 아니에요. '마치 ~인 것처럼'을 뜻하는 as if 뒤에는 어떤 모양의 be동사가 올까요?", "h2": "as if 뒤에는 '사실과 반대'인 내용을 상상해서 말해요. 이때 be동사는 주어에 상관없이 한 가지 모양을 써요. 보기에서 찾아보세요.", "why": "'마치 부자인 것처럼'은 사실이 아닌 것을 상상하는 말이에요. 그래서 as if 뒤에 be동사의 과거형 were를 써요.", "opts": [{"n": "①", "en": "is", "ko": "~이다", "ok": false, "why": "현재형이라서 '사실이 아닌 상상'을 말하는 모양이 아니에요."}, {"n": "②", "en": "were", "ko": "~이다의 과거형", "ok": true, "why": "as if 뒤에서 상상을 나타내는 be동사는 were예요."}, {"n": "③", "en": "isn't", "ko": "~이 아니다", "ok": false, "why": "부정이라서 뜻이 '마치 부자가 아닌 것처럼'이 되어 틀려요."}, {"n": "④", "en": "weren't", "ko": "~이 아니었다", "ok": false, "why": "부정이라서 '마치 부자가 아닌 것처럼'이 되어 틀려요."}, {"n": "⑤", "en": "would be", "ko": "~일 텐데", "ok": false, "why": "as if 뒤에는 would be를 쓰지 않아요."}], "pencil": "as if 가정법에서 be동사는 주어와 상관없이 ___를 쓴다", "pencilKey": "were", "page": 241, "sec": "s1"}, {"id": "S1-22", "step": 1, "no": 22, "qtype": "유형 04 as if 가정법 과거", "type": "mc", "ans": "④", "concept": ["090-2"], "gap": "", "words": [["behave", "행동하다"], ["leader", "대표, 지도자"], ["even if", "~일지라도"]], "h1": "'그는 마치 자신이 대표인 것처럼 행동한다'가 우리말 뜻이에요. 빈칸 뒤에 he were a leader가 이어지는 것을 보고 어울리는 접속사 표현을 찾아보세요.", "h2": "빈칸에는 '마치 ~인 것처럼'이라는 뜻이면서 뒤에 were(~이다의 과거형)가 이어지는 표현이 들어가야 해요. 보기를 하나씩 문장에 넣어 읽어 보세요.", "why": "'마치 ~인 것처럼'은 as if로 말해요. as if 뒤에 were를 쓰면 사실이 아닌 것을 상상하는 문장이 돼요.", "opts": [{"n": "①", "en": "if", "ko": "만약 ~라면", "ok": false, "why": "'마치 ~처럼'이라는 뜻이 나오지 않아요."}, {"n": "②", "en": "that", "ko": "~라는 것", "ok": false, "why": "'마치 ~처럼'이라는 뜻이 나오지 않아요."}, {"n": "③", "en": "when", "ko": "~할 때", "ok": false, "why": "때를 나타내서 뜻이 맞지 않아요."}, {"n": "④", "en": "as if", "ko": "마치 ~인 것처럼", "ok": true, "why": "'마치 자신이 대표인 것처럼'이라는 뜻이 되어 알맞아요."}, {"n": "⑤", "en": "even if", "ko": "비록 ~일지라도", "ok": false, "why": "'비록 ~일지라도'라는 뜻이라서 어울리지 않아요."}], "pencil": "'마치 ~인 것처럼'은 ___로 말한다", "pencilKey": "as if", "page": 241, "sec": "s1"}, {"id": "S1-23", "step": 1, "no": 23, "qtype": "유형 04 as if 가정법 과거", "type": "mc", "ans": "①", "concept": ["090-2"], "gap": "", "words": [["act", "행동하다"], ["angry", "화난"], ["as if", "마치 ~인 것처럼"]], "h1": "먼저 우리말에 맞게 문장 전체를 만들어 보세요. 'Judy는 마치 화나지 않은 것처럼 행동한다'를 영어 어순으로 놓아 보고, 여섯 번째 단어가 무엇인지 세어 보세요.", "h2": "주어 Judy 다음에 동사 acts(행동한다)가 오고, 그다음에 '마치 ~인 것처럼'이 와요. 그 뒤에 she, 상상을 나타내는 be동사, 부정어, 형용사 순서로 이어져요.", "why": "문장은 Judy acts as if she were not angry예요. 단어를 세어 보면 Judy, acts, as, if, she, were 순서라서 여섯 번째는 were예요.", "opts": [{"n": "①", "en": "were", "ko": "~이다의 과거형", "ok": true, "why": "여섯 번째에 오는 단어예요. 'Judy acts as if she' 다음 자리예요."}, {"n": "②", "en": "acts", "ko": "행동한다 (원형 act 행동하다)", "ok": false, "why": "두 번째에 오는 단어예요."}, {"n": "③", "en": "angry", "ko": "화난", "ok": false, "why": "여덟 번째, 맨 마지막에 오는 단어예요."}, {"n": "④", "en": "not", "ko": "~않은", "ok": false, "why": "일곱 번째에 오는 단어예요."}, {"n": "⑤", "en": "as", "ko": "~처럼", "ok": false, "why": "세 번째에 오는 단어예요."}], "pencil": "as if 문장 순서: Judy acts as if she ___ not angry", "pencilKey": "were", "page": 241, "sec": "s1"}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 04 as if 가정법 과거", "type": "write", "ans": "could touch", "concept": ["090-2", "012"], "gap": "", "words": [["touch", "만지다, 닿다"], ["sky", "하늘"], ["in fact", "사실은"]], "h1": "'나는 마치 하늘을 만질 수 있는 것처럼 느낀다'는 뜻이에요. 괄호 속 '사실은 만질 수 없다'를 보면 사실과 반대로 상상하는 문장이라는 걸 알 수 있어요.", "h2": "as if 뒤에는 사실과 반대인 내용을 과거 모양으로 써요. '~할 수 있다'를 뜻하는 조동사 can을 어떤 모양으로 바꿔야 할지 떠올려 보세요.", "why": "as if 뒤에 사실과 반대인 내용을 쓸 때는 과거 모양을 써요. can touch(만질 수 있다)는 could touch가 돼요.", "opts": [], "pencil": "as if 뒤의 can은 ___로 바꿔 쓴다", "pencilKey": "could", "page": 241, "sec": "s1"}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 04 as if 가정법 과거", "type": "write", "ans": "knew", "concept": ["090-2", "009"], "gap": "", "words": [["talk", "말하다"], ["fact", "사실"], ["know", "알다"]], "h1": "'James는 마치 사실을 아는 것처럼 말한다'는 뜻이에요. 괄호 속 know(알다)를 as if 뒤에 맞는 모양으로 바꿔야 해요.", "h2": "as if 뒤에는 사실과 반대인 내용을 과거 모양으로 써요. know(알다)의 과거형은 규칙적으로 -ed를 붙이는 동사일까요, 모양이 바뀌는 동사일까요?", "why": "as if 뒤에는 동사의 과거형을 써요. know(알다)의 과거형은 knew예요. 그래서 as if he knew the fact(마치 그가 사실을 아는 것처럼)가 돼요.", "opts": [], "pencil": "as if 뒤의 동사는 ___로 쓴다", "pencilKey": "과거형", "page": 241, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "mc", "ans": "②", "concept": ["042", "087"], "gap": "", "words": [["tomorrow", "내일"], ["tell the truth", "진실을 말하다 (원형 tell 말하다)"], ["enough money", "충분한 돈"], ["could", "~할 수 있을 텐데"]], "h1": "두 문장을 따로 보세요. 첫 문장의 주절은 will tell(말할 것이다)이고, 둘째 문장의 주절은 could buy(살 수 있을 텐데)예요. 두 주절의 조동사가 어떻게 다른지 확인하세요.", "h2": "첫 문장은 실제로 일어날 수 있는 일을 말해요. 이때 if절에서는 미래 일도 '현재 모양'으로 써요. 둘째 문장은 could가 있으니 지금 사실과 반대로 상상하는 문장이에요. 이때 if절은 어떤 모양일까요?", "why": "첫 문장은 will이 있어서 사실을 말하는 문장이고, if절에서는 미래를 현재형으로 말해서 come(오다)을 써요. 둘째 문장은 could가 있어서 상상하는 문장이고, if절에 과거형 had(원형 have 가지다)를 써요.", "opts": [{"n": "①", "en": "come - has", "ko": "오다 - 가지고 있다", "ok": false, "why": "둘째 칸의 has가 현재형이라서 could와 짝이 맞지 않아요."}, {"n": "②", "en": "come - had", "ko": "오다 - 가졌다", "ok": true, "why": "첫 칸은 현재형 come, 둘째 칸은 과거형 had라서 둘 다 맞아요."}, {"n": "③", "en": "came - has", "ko": "왔다 - 가지고 있다", "ok": false, "why": "첫 칸은 과거형이라서 will tell과 짝이 맞지 않고, 둘째 칸도 틀려요."}, {"n": "④", "en": "came - had", "ko": "왔다 - 가졌다", "ok": false, "why": "첫 칸이 과거형이라서 will tell(말할 것이다)과 짝이 맞지 않아요."}, {"n": "⑤", "en": "will come - had", "ko": "올 것이다 - 가졌다", "ok": false, "why": "if절 안에는 will을 쓰지 않아요."}], "pencil": "사실을 말하는 if절에서는 미래를 ___로 나타낸다", "pencilKey": "현재형", "page": 242, "sec": "s2"}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "mc", "ans": "②", "concept": ["089", "087"], "gap": "", "words": [["genius", "천재"], ["solve a problem", "문제를 풀다 (원형 solve 풀다)"], ["As", "~이기 때문에"]], "h1": "주어진 문장은 '내가 천재라면 문제를 풀 수 있을 텐데'라는 상상이에요. 직설법(사실)으로 바꾸려면 어떤 사실이 숨어 있는지 생각해 보세요.", "h2": "상상 문장을 사실 문장으로 바꾸면 긍정은 부정으로 바뀌고 시제는 현재가 돼요. were는 현재형 be동사로, could는 can의 부정으로 바뀌어요.", "why": "'천재라면 풀 수 있을 텐데'의 사실은 '천재가 아니라서 풀 수 없다'예요. 그래서 As I'm not a genius, I can't solve the problem이 맞아요.", "opts": [{"n": "①", "en": "As I'm a genius, I can solve the problem.", "ko": "나는 천재라서 문제를 풀 수 있다.", "ok": false, "why": "긍정 그대로라서 뜻이 반대가 되지 않았어요."}, {"n": "②", "en": "As I'm not a genius, I can't solve the problem.", "ko": "나는 천재가 아니라서 문제를 풀 수 없다.", "ok": true, "why": "뜻이 반대로 바뀌고 현재형이라서 맞아요."}, {"n": "③", "en": "As I wasn't a genius, I couldn't solve the problem.", "ko": "나는 천재가 아니었어서 문제를 풀 수 없었다.", "ok": false, "why": "과거형이라서 '지금 사실'을 말하지 못해요."}, {"n": "④", "en": "As I was a genius, I could solve the problem.", "ko": "나는 천재였어서 문제를 풀 수 있었다.", "ok": false, "why": "긍정이고 과거형이라서 틀려요."}, {"n": "⑤", "en": "As I hadn't a genius, I couldn't have solved the problem.", "ko": "나는 천재가 없어서 문제를 풀 수 없었을 것이다.", "ok": false, "why": "hadn't a genius는 어색한 표현이고 시제도 맞지 않아요."}], "pencil": "가정법 과거를 사실로 바꾸면 ___ 시제와 반대 뜻이 된다", "pencilKey": "현재", "page": 242, "sec": "s2"}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "mc", "ans": "⑤", "concept": ["089", "087"], "gap": "", "words": [["picnic", "소풍"], ["autograph", "사인"], ["exercise", "운동하다"], ["meet", "만나다"]], "h1": "'잘못 바꾼 것'을 찾는 문제예요. 각 보기에서 위 사실 문장과 아래 상상 문장이 뜻이 반대로 바뀌었는지, 동사 모양이 맞는지 하나씩 살펴보세요.", "h2": "사실을 상상으로 바꿀 때는 부정을 긍정으로, 긍정을 부정으로 바꿔요. 그런데 어떤 보기는 이미 부정인 문장을 다시 부정으로 써서 뜻이 반대가 되지 않았어요. 그 보기를 찾아보세요.", "why": "⑤의 사실은 '배우를 만나지 않아서 사인을 받지 않는다'예요. 상상 문장은 '배우를 만난다면 사인을 받을 텐데'가 되어야 해서, didn't meet을 met으로 써야 해요.", "opts": [{"n": "①", "en": "As he isn't here, he can't fix this car. If he were here, he could fix this car.", "ko": "그는 여기 없어서 이 차를 고칠 수 없다. 그가 여기 있다면 이 차를 고칠 수 있을 텐데.", "ok": false, "why": "반대로 잘 바뀌었어요."}, {"n": "②", "en": "As the weather isn't fine, we won't go on a picnic. If the weather were fine, we would go on a picnic.", "ko": "날씨가 좋지 않아서 소풍을 가지 않을 것이다. 날씨가 좋다면 소풍을 갈 텐데.", "ok": false, "why": "반대로 잘 바뀌었어요."}, {"n": "③", "en": "As I don't have enough time, I can't exercise. If I had enough time, I could exercise.", "ko": "시간이 충분하지 않아서 운동할 수 없다. 시간이 충분하다면 운동할 수 있을 텐데.", "ok": false, "why": "반대로 잘 바뀌었어요."}, {"n": "④", "en": "As I don't know her, I don't go with her. If I knew her, I would go with her.", "ko": "나는 그녀를 몰라서 그녀와 가지 않는다. 그녀를 안다면 그녀와 갈 텐데.", "ok": false, "why": "반대로 잘 바뀌었어요."}, {"n": "⑤", "en": "I don't meet the actor, so I don't get his autograph. If I didn't meet the actor, I wouldn't get his autograph.", "ko": "나는 그 배우를 만나지 않아서 사인을 받지 않는다. 그 배우를 만나지 않는다면 사인을 받지 않을 텐데.", "ok": true, "why": "사실이 부정인데 상상 문장도 부정이라서 틀려요. If I met the actor, I would get his autograph가 맞아요."}], "pencil": "직설법 현재를 가정법 과거로 바꿀 때는 ___ 뜻으로 바꾼다", "pencilKey": "반대", "page": 242, "sec": "s2"}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "mc", "ans": "③", "concept": ["087", "012"], "gap": "", "words": [["robot", "로봇"], ["cook", "요리하다"], ["alone", "혼자"], ["doctor", "의사"], ["get a good grade", "좋은 성적을 받다 (원형 get 받다)"]], "h1": "'어색한 것'을 찾는 문제예요. If절과 주절의 동사 모양이 서로 짝이 맞는지 보기마다 확인해 보세요.", "h2": "if절이 과거형이면 주절에는 would, could 같은 조동사의 과거형이 와요. if절이 현재형이면 will이 와도 돼요. 이 짝이 어긋난 보기를 찾아보세요.", "why": "③은 if절이 were(~이다의 과거형)인데 주절이 will not이라서 짝이 맞지 않아요. would not으로 고쳐야 해요. ⑤는 if절이 현재형이라서 will과 어울려서 어색하지 않아요.", "opts": [{"n": "①", "en": "If my uncle came, I would be happy.", "ko": "삼촌이 오신다면, 나는 행복할 텐데.", "ok": false, "why": "came(과거형)과 would be가 짝이 맞아요."}, {"n": "②", "en": "If I had a robot, I could make it cook.", "ko": "내가 로봇이 있다면, 그것에게 요리하게 할 수 있을 텐데.", "ok": false, "why": "had(과거형)와 could make가 짝이 맞아요."}, {"n": "③", "en": "If I were you, I will not go there alone.", "ko": "내가 너라면, 나는 거기에 혼자 가지 않을 것이다.", "ok": true, "why": "if절이 were인데 주절이 will not이라서 어색해요. would not으로 고쳐야 해요."}, {"n": "④", "en": "If I weren't a doctor, I would be a singer.", "ko": "내가 의사가 아니라면, 나는 가수일 텐데.", "ok": false, "why": "weren't와 would be가 짝이 맞아요."}, {"n": "⑤", "en": "If he studies hard, he will get a good grade.", "ko": "그가 열심히 공부하면, 그는 좋은 성적을 받을 것이다.", "ok": false, "why": "현재형 if절과 will이 짝이 맞는 사실 문장이에요."}], "pencil": "if절이 were이면 주절은 will이 아니라 ___", "pencilKey": "would", "page": 242, "sec": "s2"}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "I wish 가정법 과거 / as if 가정법 과거", "type": "mc", "ans": "④", "concept": ["090", "090-2"], "gap": "", "words": [["listen to", "~의 말을 듣다 (원형 listen 듣다)"], ["advice", "충고"], ["horror movie", "공포 영화"], ["in fact", "사실은"]], "h1": "두 문장의 빈칸 앞을 보세요. 첫 문장은 I wish로, 둘째 문장은 as if로 시작해요. 두 문장 모두 지금 사실과 반대되는 일을 상상해요.", "h2": "I wish와 as if 뒤에는 모두 동사의 어떤 모양을 쓸까요? 상상하는 문장이라서 같은 모양을 쓰고, 둘째 문장은 사실이 '좋아하지 않는다'라서 긍정으로 말해요.", "why": "I wish와 as if 뒤에는 지금 사실과 반대되는 내용을 동사의 과거형으로 써요. 그래서 둘 다 listened(원형 listen 듣다), liked(원형 like 좋아하다)가 맞아요.", "opts": [{"n": "①", "en": "listens - likes", "ko": "듣는다 - 좋아한다", "ok": false, "why": "둘 다 현재형이라서 상상하는 모양이 아니에요."}, {"n": "②", "en": "listened - likes", "ko": "들었다 - 좋아한다", "ok": false, "why": "둘째 칸이 현재형이라서 as if 뒤에 맞지 않아요."}, {"n": "③", "en": "listens - liked", "ko": "듣는다 - 좋아했다", "ok": false, "why": "첫 칸이 현재형이라서 I wish 뒤에 맞지 않아요."}, {"n": "④", "en": "listened - liked", "ko": "들었다 - 좋아했다", "ok": true, "why": "둘 다 과거형이라서 알맞아요."}, {"n": "⑤", "en": "will listen - would like", "ko": "들을 것이다 - 좋아할 텐데", "ok": false, "why": "I wish와 as if 뒤에는 will, would 모양을 쓰지 않아요."}], "pencil": "I wish, as if 뒤의 동사는 ___로 쓴다", "pencilKey": "과거형", "page": 242, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "I wish 가정법 과거 / as if 가정법 과거", "type": "mc", "ans": "③", "concept": ["090", "090-2", "006"], "gap": "", "words": [["kinder", "더 친절한"], ["idol star", "아이돌 스타"], ["act", "행동하다"]], "h1": "두 빈칸에 같은 말이 들어가요. 첫 문장은 I wish he ___ kinder이고, 둘째 문장은 She acts as if she ___ an idol star예요. 주어가 he와 she로 서로 달라요.", "h2": "I wish와 as if 뒤의 be동사는 주어가 달라도 모두 같은 모양을 써요. 주어가 he, she여도 was가 아닌 하나의 모양이에요. 보기에서 찾아보세요.", "why": "I wish와 as if로 상상하는 문장에서는 be동사를 주어와 상관없이 were로 써요. 그래서 두 빈칸 모두 were가 들어가요.", "opts": [{"n": "①", "en": "be", "ko": "~이다", "ok": false, "why": "동사원형이라서 이 자리에 올 수 없어요."}, {"n": "②", "en": "is", "ko": "~이다", "ok": false, "why": "현재형이라서 상상하는 모양이 아니에요."}, {"n": "③", "en": "were", "ko": "~이다의 과거형", "ok": true, "why": "I wish와 as if 뒤에서 모든 주어에 쓸 수 있는 be동사예요."}, {"n": "④", "en": "would be", "ko": "~일 텐데", "ok": false, "why": "I wish와 as if 바로 뒤에는 would be를 쓰지 않아요."}, {"n": "⑤", "en": "has been", "ko": "~이었다 (현재완료)", "ok": false, "why": "현재완료라서 이 자리에 맞지 않아요."}], "pencil": "I wish, as if 뒤의 be동사는 주어와 상관없이 ___", "pencilKey": "were", "page": 242, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "I wish 가정법 과거 / as if 가정법 과거", "type": "mc", "ans": "④", "concept": ["090", "090-2"], "gap": "", "words": [["lazy", "게으른"], ["stop smoking", "담배를 끊다 (원형 stop 멈추다)"], ["twins", "쌍둥이"], ["wish", "바라다"]], "h1": "'어색한 것'을 찾는 문제예요. I wish와 as if 뒤의 동사 모양을 보기마다 확인해 보세요.", "h2": "I wish, as if 뒤에는 지금 사실과 반대되는 내용을 과거 모양으로 써요. 동사가 현재형으로 남아 있는 보기를 찾아보세요.", "why": "④는 I wish 뒤에 현재형 stops(원형 stop 멈추다)가 있어서 어색해요. '아버지가 담배를 끊으시면 좋을 텐데'라는 뜻이 되려면 stopped로 써야 해요.", "opts": [{"n": "①", "en": "I wish he weren't lazy.", "ko": "그가 게으르지 않으면 좋을 텐데.", "ok": false, "why": "I wish 뒤에 weren't를 써서 맞아요."}, {"n": "②", "en": "I wish I had more time.", "ko": "내게 시간이 더 있으면 좋을 텐데.", "ok": false, "why": "I wish 뒤에 had를 써서 맞아요."}, {"n": "③", "en": "He talks as if he liked her.", "ko": "그는 마치 그녀를 좋아하는 것처럼 말한다.", "ok": false, "why": "as if 뒤에 liked를 써서 맞아요."}, {"n": "④", "en": "I wish my father stops smoking.", "ko": "아버지가 담배를 끊으시면 좋을 텐데.", "ok": true, "why": "I wish 뒤에 현재형 stops를 써서 틀려요. stopped로 고쳐야 해요."}, {"n": "⑤", "en": "The two girls look as if they were twins.", "ko": "두 소녀는 마치 쌍둥이인 것처럼 보인다.", "ok": false, "why": "as if 뒤에 were를 써서 맞아요."}], "pencil": "I wish 뒤의 동사는 현재형이 아니라 ___로 쓴다", "pencilKey": "과거형", "page": 242, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "가정법 과거", "type": "write", "ans": "had, could look", "concept": ["087", "012"], "gap": "", "words": [["dictionary", "사전"], ["look up", "찾아보다 (원형 look up 찾아보다)"], ["have", "가지다"], ["can", "~할 수 있다"]], "h1": "'내가 사전을 갖고 있다면 이 단어를 찾을 수 있을 텐데'는 지금 사전이 없다는 사실과 반대로 상상하는 문장이에요. 괄호 속 단어가 세 개(have, can, look)예요.", "h2": "if절에는 have(가지다)를 과거 모양으로, 주절에는 can(할 수 있다)을 과거 모양으로 쓰고 그 뒤에 동사원형 look(찾아보다)을 붙여요. 두 칸에 알맞은 말을 정해 보세요.", "why": "if절에는 have의 과거형 had를, 주절에는 can의 과거형 could에 look을 붙여 could look(찾아볼 수 있을 텐데)을 써요.", "opts": [], "pencil": "가정법 과거: If + 주어 + 과거형, 주어 + ___ + 동사원형", "pencilKey": "조동사의 과거형", "page": 243, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "가정법 과거", "type": "write", "ans": "were, would save", "concept": ["087", "012"], "gap": "", "words": [["save money", "돈을 모으다 (원형 save 모으다)"], ["need", "필요하다"], ["be", "~이다"]], "h1": "A는 '새 컴퓨터가 필요해'라고 말했어요. B의 대답은 '내가 너라면 돈을 좀 모을 텐데'라는 충고예요. 상상하는 문장이에요.", "h2": "「If I ___ you, I ___ + 동사원형」으로 충고하는 표현이에요. 괄호 속 be(~이다)는 어떤 모양으로 바뀌고, 조동사는 무엇을 써야 할까요?", "why": "'내가 너라면 ~할 텐데'는 「If I were you, I would + 동사원형」으로 말해요. be는 were로, 조동사는 would로 써서 If I were you, I would save some money가 돼요.", "opts": [], "pencil": "충고할 때는 If I ___ you, I would + 동사원형", "pencilKey": "were", "page": 243, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "가정법 과거", "type": "write", "ans": "knew, could send", "concept": ["087", "012"], "gap": "", "words": [["email address", "이메일 주소"], ["send", "보내다"], ["file", "파일"], ["know", "알다"]], "h1": "상황은 '이메일 주소를 몰라서 파일을 보낼 수 없다'예요. 이것과 반대로 상상하는 문장을 만들어야 해요.", "h2": "사실의 부정(모른다, 보낼 수 없다)을 긍정으로 바꾸고 과거 모양으로 써요. know(알다)는 과거형이 바뀌는 동사예요. can(할 수 있다)은 어떤 모양일까요?", "why": "'이메일 주소를 안다면(knew) 파일을 보낼 수 있을 텐데(could send)'가 돼요. 모른다는 사실의 반대이고, 보낼 수 없다는 사실의 반대예요.", "opts": [], "pencil": "사실이 부정이면 상상하는 문장에서는 ___으로 쓴다", "pencilKey": "긍정", "page": 243, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "가정법 과거", "type": "write", "ans": "were, could make", "concept": ["087", "012", "017"], "gap": "", "words": [["pancake", "팬케이크"], ["egg", "달걀"], ["milk", "우유"], ["make", "만들다"]], "h1": "상황은 '팬케이크를 만들고 싶지만 달걀과 우유가 없다'예요. 이것과 반대로 '달걀과 우유가 있다면 만들 수 있을 텐데'를 만들어요.", "h2": "If there ___ eggs and milk에서 there is, there are처럼 '~이 있다'를 말해요. 그런데 상상하는 문장이라서 be동사는 주어가 복수여도 한 가지 모양으로 써요. 뒤 칸에는 can의 과거형을 써요.", "why": "If there were eggs and milk(달걀과 우유가 있다면), I could make pancakes(팬케이크를 만들 수 있을 텐데)가 돼요. be동사는 were를 쓰고, could 뒤에는 동사원형 make를 써요.", "opts": [], "pencil": "If there ___ ~, I could + 동사원형", "pencilKey": "were", "page": 243, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "가정법 과거", "type": "write", "ans": "can → could", "concept": ["087", "012"], "gap": "", "words": [["expensive", "비싼"], ["enough money", "충분한 돈"], ["buy", "사다"]], "h1": "'드레스가 너무 비싸지 않으면 그것을 살 수 있을 텐데'라는 상상의 문장이에요. If절과 주절의 동사 모양이 짝이 맞는지 하나씩 보세요.", "h2": "if절에 were not이 있어요. 이런 if절과 짝이 되는 주절에는 현재형 조동사가 어울릴까요, 과거형 조동사가 어울릴까요?", "why": "if절이 were not이라서 상상하는 문장이에요. 주절에는 조동사의 과거형을 써야 하니, can(할 수 있다)을 could로 고쳐야 해요.", "opts": [], "pencil": "가정법 과거의 주절에는 조동사의 ___을 쓴다", "pencilKey": "과거형", "page": 243, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "I wish 가정법 과거 / as if 가정법 과거", "type": "write", "ans": "she were a singer", "concept": ["090-2", "006"], "gap": "", "words": [["singer", "가수"], ["sing", "노래하다"], ["like", "~처럼"], ["as if", "마치 ~인 것처럼"]], "h1": "Olivia는 가수가 아닌데 가수처럼 노래해요. 이 두 문장을 as if로 한 문장으로 만드는 문제예요. 빈칸에 들어갈 내용은 가수인 것처럼이라는 상상이에요.", "h2": "as if 뒤에는 '주어 + 동사'가 이어져요. 사실과 반대이니 be동사는 어떤 모양을 써야 할지 떠올려 보세요. 주어는 Olivia를 대신하는 말이에요.", "why": "'마치 가수인 것처럼'이라서 as if she were a singer라고 써요. Olivia 대신 she를 쓰고, be동사는 were를 써요.", "opts": [], "pencil": "as if 뒤의 be동사는 주어와 상관없이 ___", "pencilKey": "were", "page": 243, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "I wish 가정법 과거 / as if 가정법 과거", "type": "write", "ans": "(1) as if she did not [didn't] know me (2) I wish I could go shopping with you.", "concept": ["090-2", "090"], "gap": "", "words": [["know", "알다"], ["go shopping", "쇼핑하러 가다 (원형 go 가다)"], ["in fact", "사실은"], ["sorry", "유감스러운"]], "h1": "(1)은 사실이 '그녀는 나를 안다'예요. as if로 바꿀 때는 이 사실과 반대로 말해요. (2)는 '함께 쇼핑하러 갈 수 없어서 유감이에요'를 I wish로 바꾸는 문제예요.", "h2": "(1) 사실이 긍정이니 as if 뒤에는 부정으로 쓰고, 동사는 과거 모양으로 바꿔요. (2) 사실이 부정이니 I wish 뒤에는 긍정으로 쓰고, 조동사는 과거 모양으로 바꿔요.", "why": "(1) '나를 안다'의 반대는 '나를 모르는 것처럼'이라서 as if she did not know me가 돼요. (2) '갈 수 없다'의 반대는 '갈 수 있으면 좋을 텐데'라서 I wish I could go shopping with you가 돼요.", "opts": [], "pencil": "사실의 긍정, 부정은 가정법에서 ___으로 바뀐다", "pencilKey": "반대", "page": 243, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "I wish 가정법 과거 / as if 가정법 과거", "type": "write", "ans": "were not [weren't] sick", "concept": ["090", "006"], "gap": "", "words": [["sick", "아픈"], ["wish", "바라다"], ["be", "~이다"]], "h1": "그림 속 사람이 아파서 누워 있어요. 지금 아픈 사실이 아쉬워서 '아프지 않으면 좋을 텐데'라고 말하는 문장을 만들어요. 괄호 속 not, sick을 쓰세요.", "h2": "I wish 뒤에는 사실과 반대로 말하고, be동사는 주어와 상관없이 한 가지 모양을 써요. 부정 not이 들어갈 자리도 생각해 보세요.", "why": "지금 아픈 것(is sick)의 반대를 소망하니까 I wish she were not sick(그녀가 아프지 않으면 좋을 텐데)이 돼요.", "opts": [], "pencil": "I wish 뒤의 be동사는 ___, 부정은 not을 뒤에 붙인다", "pencilKey": "were", "page": 243, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "mc", "ans": "⑤", "concept": ["088", "087", "012"], "gap": "", "words": [["live far away", "멀리 살다 (원형 live 살다)"], ["accept", "받아들이다"], ["proposal", "제안"], ["carry", "나르다"]], "h1": "세 문장에서 (A), (B), (C)를 따로 풀어 보세요. 각 문장의 주절에 would, wouldn't, could 같은 조동사의 과거형이 있는지 보세요.", "h2": "주절에 조동사의 과거형이 있으면 if절은 과거형이에요. 그래서 (A)는 현재형 don't와 과거형 didn't 중 하나, (B)는 were와 had been(과거완료 모양) 중 하나, (C)는 can과 could 중 하나예요. 각각 지금 사실과 반대인 상상에 맞는 쪽을 골라 보세요.", "why": "(A) 주절에 could visit이 있어서 if절은 과거형 didn't, (B) 주절에 wouldn't가 있어서 were, (C) if절이 weren't라서 주절은 could가 맞아요.", "opts": [{"n": "①", "en": "don't - were - could", "ko": "~않다 - ~이다의 과거형 - ~할 수 있을 텐데", "ok": false, "why": "(A)의 don't가 현재형이라서 주절 could visit과 짝이 맞지 않아요."}, {"n": "②", "en": "don't - had been - can", "ko": "~않다 - ~이었다 - ~할 수 있다", "ok": false, "why": "(A), (B), (C) 모두 상상하는 문장에 맞지 않아요."}, {"n": "③", "en": "didn't - were - can", "ko": "~않았다 - ~이다의 과거형 - ~할 수 있다", "ok": false, "why": "(C)의 can이 현재형이라서 if절 weren't와 짝이 맞지 않아요."}, {"n": "④", "en": "didn't - had been - can", "ko": "~않았다 - ~이었다 - ~할 수 있다", "ok": false, "why": "(B)의 had been과 (C)의 can이 틀려요."}, {"n": "⑤", "en": "didn't - were - could", "ko": "~않았다 - ~이다의 과거형 - ~할 수 있을 텐데", "ok": true, "why": "세 칸 모두 가정법 과거에 맞아요."}], "pencil": "가정법 과거의 if절 동사는 ___, 주절은 조동사의 과거형 + 동사원형", "pencilKey": "과거형", "page": 244, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "mc", "ans": "③", "concept": ["089", "087"], "gap": "", "words": [["rich", "부자인"], ["buy", "사다"], ["though", "~이지만"]], "h1": "주어진 문장은 '그는 부자가 아니라서 그 집을 사지 않는다'는 사실이에요. 이것을 가정법으로 바꾸려면 어떤 뜻이어야 하는지 생각해 보세요.", "h2": "사실을 가정법으로 바꿀 때는 뜻을 반대로 하고, if절은 과거형, 주절은 would + 동사원형을 써요. 보기에서 이 모양을 갖춘 것을 찾아보세요.", "why": "'부자가 아니라서 사지 않는다'의 반대는 '부자라면 살 텐데'예요. 그래서 If he were rich, he would buy the house가 맞아요.", "opts": [{"n": "①", "en": "If he is rich, he will buy the house.", "ko": "그가 부자이면, 그는 그 집을 살 것이다.", "ok": false, "why": "현재형과 will을 써서 가정법이 아니라 사실을 말하는 조건문이에요."}, {"n": "②", "en": "If he isn't rich, he won't buy the house.", "ko": "그가 부자가 아니면, 그는 그 집을 사지 않을 것이다.", "ok": false, "why": "사실을 그대로 말한 문장이라서 가정법이 아니에요."}, {"n": "③", "en": "If he were rich, he would buy the house.", "ko": "그가 부자라면, 그는 그 집을 살 텐데.", "ok": true, "why": "반대 뜻이고 were와 would + 동사원형이라서 알맞아요."}, {"n": "④", "en": "He wouldn't buy the house if he weren't rich.", "ko": "그가 부자가 아니라면, 그는 그 집을 사지 않을 텐데.", "ok": false, "why": "부정이 그대로여서 사실과 반대가 되지 않았어요."}, {"n": "⑤", "en": "He wouldn't buy the house though he was rich.", "ko": "그가 부자였지만, 그는 그 집을 사지 않을 텐데.", "ok": false, "why": "though(~이지만)와 was가 쓰여서 가정법이 되지 않아요."}], "pencil": "사실을 가정법으로 바꿀 때 뜻은 ___로 만든다", "pencilKey": "반대", "page": 244, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "mc", "ans": "①, ④", "concept": ["087", "042"], "gap": "", "words": [["put on", "입다 (원형 put on 입다)"], ["situation", "상황"], ["disappointed", "실망한"], ["spend time", "시간을 보내다 (원형 spend 보내다)"]], "h1": "'어법상 올바른 문장을 모두' 고르는 문제예요. 다섯 문장 모두 If절과 주절의 동사 모양을 비교해 보세요. 답이 두 개예요.", "h2": "if절이 과거형이면 주절은 would + 동사원형, 주절에 would가 있으면 if절은 과거형이에요. 짝이 어긋나거나, 이미 지나간 일을 말하는 모양이 섞인 보기는 틀려요.", "why": "①은 were와 would put on, ④는 didn't accept와 would be가 각각 짝이 맞아요. ②는 will you do와 were가 어긋나고, ③은 understands와 would가 어긋나고, ⑤는 could have spent가 맞지 않아요.", "opts": [{"n": "①", "en": "If I were you, I would put a coat on.", "ko": "내가 너라면, 나는 코트를 입을 텐데.", "ok": true, "why": "were와 would + 동사원형이라서 맞아요."}, {"n": "②", "en": "What will you do if you were a teacher?", "ko": "네가 선생님이라면, 너는 무엇을 할 거니?", "ok": false, "why": "if절이 과거형이면 주절은 would you do가 되어야 해요."}, {"n": "③", "en": "If he understands your situation, he would help you.", "ko": "그가 네 상황을 이해한다면, 그는 너를 도울 텐데.", "ok": false, "why": "if절은 현재형인데 주절이 would라서 짝이 맞지 않아요. understood로 고쳐야 해요."}, {"n": "④", "en": "If you didn't accept her invitation, she would be disappointed.", "ko": "네가 그녀의 초대를 받아들이지 않는다면, 그녀는 실망할 텐데.", "ok": true, "why": "didn't accept와 would be가 짝이 맞아요."}, {"n": "⑤", "en": "If he had free time, he could have spent time with his children.", "ko": "그에게 자유 시간이 있다면, 그는 아이들과 시간을 보냈을 수도 있을 텐데.", "ok": false, "why": "could have spent는 과거 일을 말하는 모양이라서 맞지 않아요. could spend로 고쳐야 해요."}], "pencil": "가정법 과거: if절은 과거형, 주절은 ___ + 동사원형", "pencilKey": "would", "page": 244, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "mc", "ans": "④", "concept": ["087", "042"], "gap": "", "words": [["fail", "실패하다"], ["on sale", "할인 중인"], ["poor", "가난한"], ["air", "공기"], ["mask", "마스크"]], "h1": "'잘못된 것'을 찾는 문제예요. 밑줄 친 부분이 각각 앞뒤 절과 짝이 맞는지 하나씩 확인해 보세요.", "h2": "if절에 were가 있으면 상상하는 문장이라서 주절은 would, could가 와야 해요. ②번은 '실제로 일어날 수 있는 일'이라서 현재형 if절과 will이 짝을 이룬다는 점도 기억하세요.", "why": "④는 if절이 were라서 가정법 과거예요. 그러면 주절이 won't wear가 아니라 wouldn't wear가 되어야 해요. ②는 사실을 말하는 문장이라서 틀리지 않았어요.", "opts": [{"n": "①", "en": "If you tried again, you would not fail.", "ko": "네가 다시 시도한다면, 너는 실패하지 않을 텐데.", "ok": false, "why": "tried와 would not fail이 짝이 맞아요."}, {"n": "②", "en": "If the smartphone is on sale, I will buy it.", "ko": "그 스마트폰이 할인 중이면, 나는 그것을 살 것이다.", "ok": false, "why": "현재형 if절과 will이 짝이 맞는 사실 문장이에요."}, {"n": "③", "en": "If I were rich, I would help poor people.", "ko": "내가 부자라면, 나는 가난한 사람들을 도울 텐데.", "ok": false, "why": "were와 would help가 짝이 맞아요."}, {"n": "④", "en": "If the air were clean, I won't wear a mask.", "ko": "공기가 깨끗하다면, 나는 마스크를 쓰지 않을 것이다.", "ok": true, "why": "if절이 were라서 주절은 wouldn't wear여야 해요."}, {"n": "⑤", "en": "If he weren't lazy, he could pass the exam.", "ko": "그가 게으르지 않다면, 시험에 합격할 수 있을 텐데.", "ok": false, "why": "weren't와 could pass가 짝이 맞아요."}], "pencil": "if절이 were이면 주절은 would, could + ___", "pencilKey": "동사원형", "page": 244, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "I wish 가정법 과거 / as if 가정법 과거", "type": "mc", "ans": "②", "concept": ["090", "006"], "gap": "", "words": [["healthy", "건강한"], ["enough time", "충분한 시간"], ["wish", "바라다"], ["have", "가지다"]], "h1": "두 문장 모두 I wish로 시작해요. 밑줄 친 is와 have를 바르게 고치는 문제예요. 둘 다 지금 사실과 반대되는 소망이에요.", "h2": "I wish 뒤에는 과거 모양을 써요. be동사는 주어와 상관없이 한 가지 모양, have(가지다)는 과거형으로 써요. 두 칸에 알맞은 짝을 고르세요.", "why": "I wish 가정법 과거라서 is는 were로, have(원형 have 가지다)는 had로 고쳐요.", "opts": [{"n": "①", "en": "be - had", "ko": "~이다 - 가졌다", "ok": false, "why": "첫 칸 be는 동사원형이라서 틀려요."}, {"n": "②", "en": "were - had", "ko": "~이다의 과거형 - 가졌다", "ok": true, "why": "둘 다 I wish 뒤에 알맞은 과거 모양이에요."}, {"n": "③", "en": "were - will have", "ko": "~이다의 과거형 - 가질 것이다", "ok": false, "why": "둘째 칸의 will have는 미래 모양이라서 틀려요."}, {"n": "④", "en": "was - have had", "ko": "~이었다 - 가져 왔다", "ok": false, "why": "was는 I wish 뒤에 쓰지 않고, have had도 현재완료라서 틀려요."}, {"n": "⑤", "en": "had been - will have", "ko": "~이었다 - 가질 것이다", "ok": false, "why": "둘 다 I wish 가정법 과거에 맞지 않아요."}], "pencil": "I wish 가정법 과거: be동사는 ___, 일반동사는 과거형", "pencilKey": "were", "page": 244, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "I wish 가정법 과거 / as if 가정법 과거", "type": "mc", "ans": "②", "concept": ["090-2"], "gap": "", "words": [["fashion model", "패션 모델"], ["walk", "걷다"], ["in fact", "사실은"]], "h1": "B의 말을 보세요. 'No, she isn't(아니, 그렇지 않아)'라고 먼저 말하고 But(하지만)로 이어서 as if를 썼어요. 밑줄 친 부분이 실제 사실인지 상상인지 생각해 보세요.", "h2": "as if 뒤에 were가 있으면 사실과 반대되는 내용을 상상하는 말이에요. 그러니 '그렇게 걷지만 사실은 그렇지 않다'는 뜻일 거예요.", "why": "She walks as if she were a fashion model은 '그녀는 마치 패션 모델인 것처럼 걷는다'예요. 그렇지만 앞에서 No, she isn't라고 했으니 사실은 모델이 아니라는 뜻이에요.", "opts": [{"n": "①", "en": "She wants to be a fashion model.", "ko": "그녀는 패션 모델이 되고 싶어 한다.", "ok": false, "why": "그런 내용은 문장에 나오지 않아요."}, {"n": "②", "en": "In fact, she isn't a fashion model.", "ko": "사실, 그녀는 패션 모델이 아니다.", "ok": true, "why": "as if 가정법은 실제로는 그렇지 않다는 뜻이라서 알맞아요."}, {"n": "③", "en": "She doesn't walk like a fashion model.", "ko": "그녀는 패션 모델처럼 걷지 않는다.", "ok": false, "why": "실제로는 모델처럼 걷는다고 했어요."}, {"n": "④", "en": "She doesn't want to be a fashion model.", "ko": "그녀는 패션 모델이 되고 싶어 하지 않는다.", "ok": false, "why": "그런 내용은 문장에 나오지 않아요."}, {"n": "⑤", "en": "In fact, she doesn't like a fashion model.", "ko": "사실, 그녀는 패션 모델을 좋아하지 않는다.", "ok": false, "why": "like의 뜻이 달라서 틀려요."}], "pencil": "as if 가정법은 실제로는 ___는 뜻이다", "pencilKey": "그렇지 않다", "page": 244, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "I wish 가정법 과거 / as if 가정법 과거", "type": "mc", "ans": "④", "concept": ["090", "090-2"], "gap": "", "words": [["crazy", "미친"], ["dream", "꿈꾸다"], ["smart", "똑똑한"], ["join a club", "동아리에 가입하다 (원형 join 가입하다)"]], "h1": "'잘못 바꾼 것'을 찾는 문제예요. 위 문장은 사실이고, 아래 문장은 I wish나 as if를 써서 상상을 말해요. 뜻이 반대로 바뀌었는지 확인하세요.", "h2": "I wish 뒤에는 사실과 반대로 쓰기 때문에 부정이었던 사실은 긍정이 되고, 긍정이었던 사실은 부정이 돼요. 이 규칙이 지켜지지 않은 보기를 찾아보세요.", "why": "④의 사실은 'Fred가 우리 동아리에 가입하지 않아서 유감이다'예요. I wish로 바꿀 때는 긍정이 되어야 하니, didn't join이 아니라 joined(원형 join 가입하다)로 써야 해요.", "opts": [{"n": "①", "en": "In fact, he isn't crazy. He acts as if he were crazy.", "ko": "사실, 그는 미치지 않았다. 그는 마치 미친 것처럼 행동한다.", "ok": false, "why": "사실이 부정이고 as if 뒤는 긍정이라서 맞아요."}, {"n": "②", "en": "In fact, I am not dreaming. I feel as if I were dreaming.", "ko": "사실, 나는 꿈꾸고 있지 않다. 나는 마치 꿈꾸고 있는 것처럼 느낀다.", "ok": false, "why": "사실이 부정이고 as if 뒤는 긍정이라서 맞아요."}, {"n": "③", "en": "I'm sorry that she isn't smarter. I wish she were smarter.", "ko": "그녀가 더 똑똑하지 않아서 유감이다. 그녀가 더 똑똑하면 좋을 텐데.", "ok": false, "why": "사실이 부정이고 I wish 뒤는 긍정이라서 맞아요."}, {"n": "④", "en": "I'm sorry that Fred doesn't join our club. I wish Fred didn't join our club.", "ko": "Fred가 우리 동아리에 가입하지 않아서 유감이다. Fred가 우리 동아리에 가입하지 않으면 좋을 텐데.", "ok": true, "why": "사실이 부정인데 I wish 뒤도 부정이라서 틀려요. joined로 고쳐야 해요."}, {"n": "⑤", "en": "I'm sorry that I don't know his name. I wish I knew his name.", "ko": "그의 이름을 몰라서 유감이다. 그의 이름을 알면 좋을 텐데.", "ok": false, "why": "사실이 부정이고 I wish 뒤는 긍정이라서 맞아요."}], "pencil": "I wish로 바꿀 때 사실이 부정이면 ___으로 쓴다", "pencilKey": "긍정", "page": 244, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "write", "ans": "As [Because] I am busy, I can't go to the movies with you.", "concept": ["089", "087"], "gap": "", "words": [["busy", "바쁜"], ["go to the movies", "영화 보러 가다 (원형 go 가다)"], ["As", "~이기 때문에"], ["Because", "~이기 때문에"]], "h1": "주어진 문장은 '내가 바쁘지 않다면 너와 영화를 보러 갈 수 있을 텐데'라는 상상이에요. 실제 사실이 무엇인지 생각해 보세요. 접속사로 시작하라고 했어요.", "h2": "상상 문장을 사실로 바꾸면 긍정은 부정으로, 과거 모양은 현재 모양으로 바뀌어요. weren't busy(바쁘지 않다면)는 사실로는 어떻게 될까요? 접속사는 As나 Because로 써요.", "why": "'바쁘지 않다면 갈 수 있을 텐데'의 사실은 '바빠서 갈 수 없다'예요. 그래서 As I am busy, I can't go to the movies with you가 돼요.", "opts": [], "pencil": "가정법 과거를 사실로 바꾸면 ___ 시제와 반대 뜻이 된다", "pencilKey": "현재", "page": 245, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "write", "ans": "If I had a garden, I would plant an apple tree.", "concept": ["089", "087"], "gap": "", "words": [["garden", "정원"], ["plant", "심다"], ["apple tree", "사과나무"]], "h1": "주어진 문장은 '나는 정원이 없어서 사과나무를 심지 않는다'는 사실이에요. 이것을 If로 시작하는 상상 문장으로 바꾸세요.", "h2": "사실의 부정(없다, 심지 않는다)을 긍정으로 바꾸고, 동사는 과거 모양으로 써요. 주절에는 would를 써서 '~할 텐데'로 만들어요.", "why": "'정원이 없다'의 반대는 '정원이 있다면(had a garden)'이고, '심지 않는다'의 반대는 '심을 텐데(would plant)'예요.", "opts": [], "pencil": "사실의 부정은 가정법에서 ___으로 바뀐다", "pencilKey": "긍정", "page": 245, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "write", "ans": "If you went to the museum today, you could meet Tylor.", "concept": ["087", "012"], "gap": "", "words": [["museum", "박물관"], ["meet", "만나다"], ["went", "갔다 (원형 go 가다)"]], "h1": "주어진 문장은 If절이 현재형 go이고 주절은 could예요. 가정법 과거로 바르게 고쳐서 다시 쓰는 문제예요.", "h2": "주절에 could가 있으니 if절은 과거 모양이어야 해요. go(가다)는 모양이 바뀌는 동사예요. 어떤 모양일까요?", "why": "if절을 과거형으로 바꿔요. go(가다)의 과거형은 went라서 If you went to the museum today, you could meet Tylor가 돼요.", "opts": [], "pencil": "if절의 go는 ___로 고쳐 쓴다", "pencilKey": "went", "page": 245, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "write", "ans": "If she had a bike, she would go there by bike.", "concept": ["087", "012"], "gap": "", "words": [["have a bike", "자전거가 있다 (원형 have 가지다)"], ["go there", "거기에 가다 (원형 go 가다)"], ["by bike", "자전거로"]], "h1": "그림에서 한 사람이 걸어가면서 자전거를 타는 모습을 상상하고 있어요. 지금은 자전거가 없다는 사실의 반대를 If로 시작하는 문장으로 쓰는 문제예요.", "h2": "조건에 맞게 if절에는 have(가지다)를 과거 모양으로, 주절에는 would와 동사원형 go를 써요. 주어는 둘 다 she예요.", "why": "자전거가 없는 사실과 반대로 If she had a bike(그녀에게 자전거가 있다면), she would go there by bike(그녀는 자전거로 거기에 갈 텐데)라고 써요.", "opts": [], "pencil": "If + 주어 + 과거형, 주어 + ___ + 동사원형", "pencilKey": "would", "page": 245, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "가정법 과거 / 가정법 문장 전환", "type": "write", "ans": "will → would", "concept": ["087", "012"], "gap": "", "words": [["skip", "거르다"], ["hungry", "배고픈"], ["get up", "일어나다 (원형 get up 일어나다)"], ["breakfast", "아침 식사"]], "h1": "글에서 어색한 부분이 하나 있어요. 'If she didn't skip breakfast, she will not be hungry' 문장을 보세요. If절의 동사가 didn't skip(거르지 않는다면, 원형 skip 거르다)이에요.", "h2": "if절이 과거형이면 상상하는 문장이라서 주절에는 조동사의 과거형이 와야 해요. 주절의 조동사 부분을 살펴보세요.", "why": "if절이 didn't skip(거르지 않는다면)이라서 가정법 과거예요. 주절은 will not be가 아니라 would not be가 되어야 해서 will을 would로 고쳐요.", "opts": [], "pencil": "가정법 과거의 주절에는 will 대신 ___를 쓴다", "pencilKey": "would", "page": 245, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "I wish 가정법 과거 / as if 가정법 과거", "type": "write", "ans": "were walking", "concept": ["090-2", "090-3", "015"], "gap": "", "words": [["walk", "걷다"], ["thin ice", "얇은 얼음"], ["as if", "마치 ~인 것처럼"], ["in fact", "사실은"]], "h1": "'그녀는 마치 얇은 얼음 위를 걷는 것처럼 느꼈다'는 뜻이에요. 빈칸이 두 칸이라서 be동사와 또 다른 말이 들어가요. '걷고 있는 것처럼'이라는 진행하는 모양을 생각해 보세요.", "h2": "as if 뒤에서는 사실과 반대인 내용을 과거 모양으로 써요. 지금 걷고 있는 것처럼은 'be동사 + -ing'(진행형)로 말하는데, be동사는 어떤 모양을 써야 할까요?", "why": "'마치 걷고 있는 것처럼'은 진행형이에요. as if 뒤라서 be동사는 were를 쓰고, 동사에 -ing를 붙인 walking을 써서 were walking이 돼요.", "opts": [], "pencil": "as if 뒤의 진행형은 ___ + 동사-ing", "pencilKey": "were", "page": 245, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "I wish 가정법 과거 / as if 가정법 과거", "type": "write", "ans": "She treats her dog as if it were her child.", "concept": ["090-2", "006"], "gap": "", "words": [["treat", "대하다"], ["child", "아이"], ["as if", "마치 ~인 것처럼"]], "h1": "대화에서 Molly는 항상 강아지를 데리고 다녀요. 'She treats her dog as if it is her child'에서 밑줄 친 부분을 고쳐 문장 전체를 다시 쓰세요.", "h2": "as if 뒤에서 사실과 반대로 상상할 때 be동사는 어떤 모양을 써야 할까요? 강아지는 실제로는 아이가 아니에요.", "why": "강아지는 사실 아이가 아니라서 as if 뒤에는 is가 아니라 were를 써요. 그래서 She treats her dog as if it were her child가 돼요.", "opts": [], "pencil": "as if 뒤의 be동사는 주어와 상관없이 ___", "pencilKey": "were", "page": 245, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "I wish 가정법 과거", "type": "write", "ans": "(1) I wish I were a famous singer. (2) I wish she didn't know my secret.", "concept": ["090", "006"], "gap": "", "words": [["famous singer", "유명한 가수"], ["secret", "비밀"], ["recycle", "재활용하다"], ["know", "알다"]], "h1": "보기 문장을 따라 써 보세요. I wish로 시작하고, 뒤에는 괄호 속 표현을 이용해 상상하는 문장을 만들어요. (1)은 '내가 유명한 가수라면 좋을 텐데', (2)는 '그녀가 내 비밀을 모른다면 좋을 텐데'예요.", "h2": "(1) be동사는 어떤 모양을 쓸지 정하세요. (2) '모른다면'은 부정이라서 동사를 과거 모양으로 쓰고 didn't를 써요.", "why": "(1) I wish I were a famous singer는 '내가 유명한 가수이면 좋을 텐데'예요. (2) I wish she didn't know my secret은 '그녀가 내 비밀을 모르면 좋을 텐데'예요. know(알다)의 부정은 didn't know로 써요.", "opts": [], "pencil": "I wish 뒤의 부정은 didn't + ___ 로 쓴다", "pencilKey": "동사원형", "page": 245, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "I wish / as if / if 가정법 과거 짝 고르기", "type": "mc", "ans": "⑤", "concept": ["090", "090-2", "087"], "gap": "", "words": [["boyfriend", "남자 친구"], ["be late", "늦다"], ["near", "~ 가까이"], ["live", "살다"]], "h1": "세 문장에 각각 I wish, as if, if가 쓰였어요. 세 문장 모두 지금 사실과 반대인 상상을 말하니, 각 빈칸에는 동사의 어떤 모양이 들어갈지 하나씩 정하세요.", "h2": "I wish 뒤, as if 뒤, 주절에 would를 쓰는 if절 안에는 모두 '과거 모양'이 들어가요. 현재형이 들어간 보기를 먼저 지워 보세요.", "why": "첫째는 I wish라서 had(원형 have 가지다), 둘째는 as if라서 liked(원형 like 좋아하다), 셋째는 주절에 wouldn't be가 있어서 lived(원형 live 살다)가 와요.", "opts": [{"n": "①", "en": "have - likes - lived", "ko": "가지다 - 좋아한다 - 살았다", "ok": false, "why": "첫째와 둘째 칸이 현재형이라서 틀려요."}, {"n": "②", "en": "have - liked - lived", "ko": "가지다 - 좋아했다 - 살았다", "ok": false, "why": "첫째 칸 have가 현재형이라서 I wish 뒤에 맞지 않아요."}, {"n": "③", "en": "have - likes - live", "ko": "가지다 - 좋아한다 - 산다", "ok": false, "why": "세 칸 모두 현재 모양이라서 틀려요."}, {"n": "④", "en": "had - liked - live", "ko": "가졌다 - 좋아했다 - 산다", "ok": false, "why": "셋째 칸 live가 현재 모양이라서 틀려요."}, {"n": "⑤", "en": "had - liked - lived", "ko": "가졌다 - 좋아했다 - 살았다", "ok": true, "why": "세 칸 모두 과거형이라서 알맞아요."}], "pencil": "I wish, as if, if(가정법) 뒤에는 모두 동사의 ___를 쓴다", "pencilKey": "과거형", "page": 246, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "빈칸에 들어갈 말이 다른 것 찾기", "type": "mc", "ans": "④", "concept": ["087", "042", "090-2"], "gap": "", "words": [["fairy", "요정"], ["absent from", "~에 결석한"], ["spend time", "시간을 보내다 (원형 spend 보내다)"], ["upset", "화난"]], "h1": "'나머지와 다른 것'을 찾는 문제예요. 다섯 문장의 빈칸에 어떤 be동사가 들어가는지 하나씩 넣어 보고, 모양이 다른 문장을 찾아 보세요.", "h2": "I wish, as if, 주절에 would가 있는 if절은 모두 상상하는 문장이라서 같은 모양의 be동사가 들어가요. 하지만 주절에 will이 있는 if절은 사실을 말하는 문장이에요.", "why": "④는 주절이 will be upset(화가 날 것이다)이라서 사실을 말하는 조건문이에요. 그래서 빈칸에는 am이 들어가고, 나머지는 모두 상상하는 문장이라서 were가 들어가요.", "opts": [{"n": "①", "en": "Her sister acts as if she ___ a baby.", "ko": "그녀의 여동생은 마치 아기인 것처럼 행동한다.", "ok": false, "why": "as if 뒤의 상상이라서 were가 들어가요."}, {"n": "②", "en": "I wish she ___ not late for the meeting.", "ko": "그녀가 회의에 늦지 않으면 좋을 텐데.", "ok": false, "why": "I wish 뒤의 상상이라서 were가 들어가요."}, {"n": "③", "en": "What would you do if you ___ a fairy?", "ko": "네가 요정이라면 무엇을 하겠니?", "ok": false, "why": "would가 있는 상상 문장이라서 were가 들어가요."}, {"n": "④", "en": "If I ___ absent from school, my mom will be upset.", "ko": "내가 학교에 결석하면, 엄마가 화나실 것이다.", "ok": true, "why": "주절이 will이라서 사실을 말하는 조건문이에요. am이 들어가요."}, {"n": "⑤", "en": "If it ___ fine, we would spend more time at the beach.", "ko": "날씨가 좋다면, 우리는 해변에서 더 많은 시간을 보낼 텐데.", "ok": false, "why": "would가 있는 상상 문장이라서 were가 들어가요."}], "pencil": "주절에 will이 있는 if절은 ___을 말하는 문장이다", "pencilKey": "사실", "page": 246, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "어색한 문장의 개수 세기", "type": "mc", "ans": "②", "concept": ["090", "090-2", "087"], "gap": "", "words": [["wizard", "마법사"], ["school uniform", "교복"], ["miss the bus", "버스를 놓치다 (원형 miss 놓치다)"], ["hurt", "아프다"]], "h1": "여섯 문장을 하나씩 읽으면서 I wish, as if, if절의 동사 모양이 알맞은지 확인하세요. 어색한 문장만 세어 보세요.", "h2": "I wish, as if 뒤에는 과거 모양이 와야 하고, if절이 과거형이면 주절에는 would, could가 와야 해요. 현재형 동사나 will, won't가 남아 있는 문장을 찾아보세요.", "why": "ⓒ는 I wish 뒤에 현재형 don't wear(입지 않는다)가 있어서 didn't wear가 되어야 해요. ⓔ는 if절이 didn't hurt인데 주절이 won't miss라서 wouldn't miss가 되어야 해요. 모두 2개예요.", "opts": [{"n": "①", "en": "1개", "ko": "한 개", "ok": false, "why": "어색한 문장이 하나 더 있어요."}, {"n": "②", "en": "2개", "ko": "두 개", "ok": true, "why": "ⓒ와 ⓔ가 어색해서 모두 2개예요."}, {"n": "③", "en": "3개", "ko": "세 개", "ok": false, "why": "어색한 문장은 3개가 아니에요."}, {"n": "④", "en": "4개", "ko": "네 개", "ok": false, "why": "어색한 문장은 4개가 아니에요."}, {"n": "⑤", "en": "5개", "ko": "다섯 개", "ok": false, "why": "어색한 문장은 5개가 아니에요."}], "pencil": "I wish 뒤의 부정 don't는 ___로 고친다", "pencilKey": "didn't", "page": 246, "sec": "s4"}, {"id": "S4-04", "step": 4, "no": 4, "qtype": "가정법 과거 빈칸 쓰기", "type": "write", "ans": "(1) were, would be (2) could travel", "concept": ["087", "090", "006"], "gap": "", "words": [["proud of", "~을 자랑스러워하는"], ["parents", "부모님"], ["travel", "여행하다"], ["moon", "달"]], "h1": "(1) 'Mark의 부모님이 여기 계신다면 그를 매우 자랑스러워 하실 텐데'는 상상하는 문장이에요. (2) '내가 달로 여행을 갈 수 있다면 좋을 텐데'는 I wish로 쓰는 문장이에요. 괄호 속 be, be, travel을 확인하세요.", "h2": "(1) if절 be동사는 주어가 복수여도 한 가지 모양으로 쓰고, 주절은 would + 동사원형이에요. (2) I wish 뒤에는 can의 과거형을 써서 '~할 수 있으면 좋을 텐데'를 말해요.", "why": "(1) If Mark's parents were here, they would be very proud of him이에요. if절은 were, 주절은 would be예요. (2) I wish I could travel to the moon이에요. 괄호에 can은 없지만 '~할 수 있다면'이라서 could가 필요해요.", "opts": [], "pencil": "I wish ~ 뒤에는 can의 과거형 ___ 를 쓴다", "pencilKey": "could", "page": 246, "sec": "s4"}, {"id": "S4-05", "step": 4, "no": 5, "qtype": "사실을 가정법으로 바꾸기", "type": "write", "ans": "(1) knew the rumor (2) had, could watch", "concept": ["090-2", "089", "087"], "gap": "", "words": [["rumor", "소문"], ["glasses", "안경"], ["watch", "보다"], ["in fact", "사실은"]], "h1": "(1)은 사실이 '케이트는 소문을 모른다'예요. as if로 바꿀 때는 이 사실과 반대로 말해요. (2)는 '안경이 없어서 영화를 볼 수 없다'를 If로 시작하는 상상 문장으로 바꾸는 문제예요.", "h2": "(1) as if 뒤에는 사실과 반대인 긍정 내용을 과거 모양으로 써요. know(알다)의 과거형을 떠올리세요. (2) if절은 have(가지다)의 과거형, 주절은 can의 과거형 + 동사원형이에요.", "why": "(1) '모른다'의 반대는 '아는 것처럼'이라서 as if she knew the rumor가 돼요. (2) '안경이 없다'의 반대는 '안경이 있다면(had)', '볼 수 없다'의 반대는 '볼 수 있을 텐데(could watch)'예요.", "opts": [], "pencil": "사실이 부정이면 상상하는 문장에서는 ___으로 쓴다", "pencilKey": "긍정", "page": 246, "sec": "s4"}, {"id": "S4-06", "step": 4, "no": 6, "qtype": "I wish 가정법 과거 영작", "type": "write", "ans": "(1) they did not [didn't] fight each other (2) I could speak Spanish", "concept": ["090"], "gap": "", "words": [["fight each other", "서로 싸우다 (원형 fight 싸우다)"], ["speak", "말하다"], ["Spanish", "스페인어"]], "h1": "보기 문장을 따라 써요. 모두 'I wish + 상상하는 내용'이에요. (1) Harry는 '그들이 서로 싸우지 않으면 좋겠어'라고 말해요. (2) Luna는 '내가 스페인어를 할 수 있으면 좋겠어'라고 말해요.", "h2": "(1) '싸우지 않으면'은 부정이라서 동사 앞에 did not 또는 didn't를 써요. (2) '~할 수 있으면'은 can의 과거형을 써요.", "why": "(1) I wish they did not fight each other(그들이 서로 싸우지 않으면 좋겠어). (2) I wish I could speak Spanish(내가 스페인어를 말할 수 있으면 좋겠어)예요. I wish 뒤에는 과거 모양을 써요.", "opts": [], "pencil": "I wish 뒤의 부정은 ___ not + 동사원형", "pencilKey": "did", "page": 246, "sec": "s4"}, {"id": "Q-01", "step": "Q", "no": 1, "qtype": "어법상 옳은 문장 고르기", "type": "mc", "ans": "b", "concept": ["087", "012"], "gap": "", "words": [["money", "돈"], ["buy", "사다"]], "h1": "두 문장은 if절이 같고 주절만 달라요. if절의 had(가졌다, 원형 have 가지다)가 어떤 시제인지 먼저 보세요.", "h2": "if절이 과거형이면 주절에는 조동사의 현재형이 어울릴까요, 과거형이 어울릴까요? can과 could 중 골라 보세요.", "why": "if절이 과거형 had이니 상상하는 문장이에요. 주절은 can이 아니라 could buy(살 수 있을 텐데)가 맞아요.", "opts": [{"n": "a", "en": "If I had money, I can buy it.", "ko": "내가 돈이 있다면, 나는 그것을 살 수 있다.", "ok": false, "why": "if절이 과거형인데 주절이 can이라서 짝이 맞지 않아요."}, {"n": "b", "en": "If I had money, I could buy it.", "ko": "내가 돈이 있다면, 나는 그것을 살 수 있을 텐데.", "ok": true, "why": "if절의 had(과거형)와 could buy가 짝이 맞아요."}], "pencil": "if절이 과거형이면 주절 조동사는 ___", "pencilKey": "과거형", "page": 247, "sec": "q"}, {"id": "Q-02", "step": "Q", "no": 2, "qtype": "어법상 옳은 문장 고르기", "type": "mc", "ans": "a", "concept": ["087", "012", "011"], "gap": "", "words": [["skating", "스케이트 타기"], ["go skating", "스케이트 타러 가다 (원형 go 가다)"]], "h1": "두 문장의 주절이 서로 달라요. 주절에 could 뒤에 오는 동사가 어떤 모양인지 보세요.", "h2": "could 뒤에는 동사원형이 와요. have went처럼 have가 붙은 모양은 과거 일에 쓰고, went는 go의 과거형이라서 이 자리에 올 수 없어요.", "why": "if절이 과거형(met)이면 주절은 could + 동사원형이에요. could go skating(스케이트를 타러 갈 수 있을 텐데)이 맞아요.", "opts": [{"n": "a", "en": "If I met him, I could go skating.", "ko": "내가 그를 만난다면, 나는 스케이트를 타러 갈 수 있을 텐데.", "ok": true, "why": "could 뒤에 동사원형 go가 와서 맞아요."}, {"n": "b", "en": "If I met him, I could have went skating.", "ko": "내가 그를 만난다면, 나는 스케이트를 타러 갔을 수도 있을 텐데.", "ok": false, "why": "could have went는 모양이 틀렸고 상상하는 문장에도 맞지 않아요."}], "pencil": "could 뒤에는 ___ 이 온다", "pencilKey": "동사원형", "page": 247, "sec": "q"}, {"id": "Q-03", "step": "Q", "no": 3, "qtype": "어법상 옳은 문장 고르기", "type": "mc", "ans": "a", "concept": ["087", "006"], "gap": "", "words": [["sick", "아픈"], ["come to the party", "파티에 오다 (원형 come 오다)"]], "h1": "두 문장의 if절을 비교하세요. 하나는 were not, 다른 하나는 am not이에요. 주절은 같은 could예요.", "h2": "주절에 could가 있으면 if절 be동사는 과거 모양이어야 해요. 주어가 I여도 마찬가지예요.", "why": "주절에 could come(올 수 있을 텐데)이 있으니 상상하는 문장이에요. if절 be동사는 were not이 맞아요.", "opts": [{"n": "a", "en": "If I were not sick, I could come to the party.", "ko": "내가 아프지 않다면, 나는 파티에 올 수 있을 텐데.", "ok": true, "why": "if절 be동사가 were이고 주절이 could라서 맞아요."}, {"n": "b", "en": "If I am not sick, I could come to the party.", "ko": "내가 아프지 않으면, 나는 파티에 올 수 있을 텐데.", "ok": false, "why": "if절이 am not(현재형)인데 주절이 could라서 짝이 맞지 않아요."}], "pencil": "주절이 could이면 if절 be동사는 ___", "pencilKey": "were", "page": 247, "sec": "q"}, {"id": "Q-04", "step": "Q", "no": 4, "qtype": "어법상 옳은 문장 고르기", "type": "mc", "ans": "a", "concept": ["042", "087"], "gap": "", "words": [["keep a promise", "약속을 지키다 (원형 keep 지키다)"], ["trust", "믿다"]], "   if(r.h>=1){
   h+='<div class="hint">'+hl(d.h1)+'</div>';
   if(d.words&&d.words.length){h+='<div class="lab">단어 뜻</div><div class="chips">'+d.words.map(function(w){return '<span><b>'+esc(w[0])+'</b> '+esc(w[1])+'</span>'}).join("")+'</div>'}
   if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
   if(r.h<2)h+='<button class="btn g" onclick="useHint(\''+d.id+'\',2)">아직 막혀요 · 한 걸음 더</button>';
  }
  if(r.h>=2)h+='<div class="hint two">'+hl(d.h2)+'</div>';
  if(d.type==="mc"){
   var labs=d.opts.map(function(o){return o.n});
   var multi=d.ans.indexOf(",")>=0,sel=r.sel||[];
   h+='<div class="choices'+(labs.length===2?' two':'')+'">'+labs.map(function(l){return '<button class="ch" style="'+(multi&&sel.indexOf(l)>=0?'background:var(--soft);border-color:var(--a)':'')+'" onclick="'+(multi?'tog':'pick')+'(\''+d.id+'\',\''+l+'\')">'+esc(l)+'</button>'}).join("")+'</div>';
   h+=multi?'<div class="meter">정답이 두 개예요. 모두 누른 뒤 확인을 눌러요</div><button class="btn p" onclick="confirmMulti(\''+d.id+'\')">확인</button>':'<div class="meter">책의 답을 골라 누르면 바로 확인돼요</div>';
  }else{
   h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div>';
   h+='<button class="btn p" onclick="showW(\''+d.id+'\')">정답 확인</button>';
  }
 }else{
  h+=answerView(d,r);
 }
 h+='</div>';
 h+='<div class="nav">'+(st.idx>0?'<button class="btn g" onclick="goIdx('+(st.idx-1)+')">이전</button>':'')+'<button class="btn p" onclick="goIdx('+(st.idx+1)+')">'+(st.idx+1>=its.length?'결과 보기':'다음 문제')+'</button></div>';
 app.innerHTML=h;
}
function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
