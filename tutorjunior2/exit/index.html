he underlined \"this\" refer to?\nTo prevent this, salespeople would sometimes put their foot in the way of the door so it couldn’t be closed.","ko":"밑줄 친 this가 가리키는 것은?","sko":"이것을 막기 위해, 판매원들은 문이 닫히지 않도록 때때로 문간에 발을 들여놓곤 했다.","opts":["판매원들이 집집마다 다니는 것","판매원이 문간에 발을 들여놓는 것","문이 닫히지 않는 것","집에 있던 사람들이 그저 문을 닫을 수 있는 것"],"r":{"a":"4) 집에 있던 사람들이 그저 문을 닫을 수 있는 것","ev":"9~10번 문장","s":[[9,"The people in the homes could simply close the door if they didn’t want to buy anything.","집에 있던 사람들이 아무것도 사고 싶지 않다면 그저 문을 닫으면 되었다."],[10,"To prevent this, salespeople would sometimes put their foot in the way of the door so it couldn’t be closed.","이것을 막기 위해, 판매원들은 문이 닫히지 않도록 때때로 문간에 발을 들여놓곤 했다."]],"w":"판매원들이 발을 들여놓은 이유는 문을 닫히지 않게 하려는 것이니, 막으려는 것은 바로 앞 9번 문장의 '사람들이 그저 문을 닫을 수 있는 것'이에요.","c":4},"h":"8ec765905a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By focusing on getting one small yes after another, this technique often leads to a big yes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"작은 승낙을 연달아 얻어 내는 것에 집중함으로써, 이 기법은 흔히 큰 승낙으로 이어진다.","opts":["작은 승낙을 하나씩 연달아 얻는 데 집중하면, 이 기법은 흔히 큰 승낙으로 이어진다.","큰 승낙 하나에만 집중하면, 이 기법은 흔히 작은 승낙으로 이어진다.","작은 거절을 연달아 받으면, 이 기법은 흔히 큰 승낙으로 이어진다.","작은 승낙을 하나 얻은 뒤에는, 이 기법은 더 이상 요청하지 않는다."],"r":{"a":"1) 작은 승낙을 하나씩 연달아 얻는 데 집중하면, 이 기법은 흔히 큰 승낙으로 이어진다.","ev":"13번 문장","s":[[13,"By focusing on getting one small yes after another, this technique often leads to a big yes.","작은 승낙을 연달아 얻어 내는 것에 집중함으로써, 이 기법은 흔히 큰 승낙으로 이어진다."]],"w":"one small yes after another는 작은 승낙을 하나씩 연달아라는 뜻이고, leads to a big yes는 큰 승낙으로 이어진다는 뜻이에요.","c":1},"h":"ff4d0d8e01"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["판매원들은 예전에 사람들의 집을 방문하지 않았다.","친구는 당신이 바쁘다고 말하자 부탁을 그만둔다.","이 기법에서 새로운 요청은 하나하나가 매우 크다.","친구의 부탁이 반복되는 패턴은 당신이 운동장에 도착할 때까지 계속된다."],"opts":["Salespeople in the past did not visit people’s houses.","Your friend stops asking when you say you’re busy.","Each new request in this technique is very big.","The pattern of your friend’s requests continues until you arrive at the playground."],"r":{"a":"4) The pattern of your friend’s requests continues until you arrive at the playground.","ev":"2, 5, 8, 12번 문장","s":[[2,"You say you’re busy, so she asks you to walk to the corner instead.","당신이 바쁘다고 말해서, 그녀는 당신에게 대신 길모퉁이까지 걸어가자고 부탁한다."],[5,"The pattern repeats until you arrive at the playground.","이 패턴은 당신이 운동장에 도착할 때까지 반복된다."],[8,"A long time ago, salespeople went from house to house.","오래전에 판매원들은 집집마다 다녔다."],[12,"Each new request is not that big.","각각의 새로운 요청은 그다지 크지 않다."]],"w":"5번에서 패턴은 운동장에 도착할 때까지 반복돼요. 8번에서 판매원은 집집마다 다녔고, 2번에서 친구는 바쁘다는 말에 대신 모퉁이까지 부탁하며, 12번에서 새 요청은 그다지 크지 않아요.","c":4},"h":"3e739a22cc"},{"n":9,"t":"sum","q":"Your friend asks for a (A) favor each time, so you (B) each time.","ko":"친구는 매번 (A) 부탁을 하고, 그래서 당신은 매번 (B).","oko":["(A) 큰 / (B) 거절한다","(A) 큰 / (B) 승낙한다","(A) 작은 / (B) 거절한다","(A) 어려운 / (B) 승낙한다","(A) 작은 / (B) 승낙한다"],"opts":["(A) big / (B) refuse","(A) big / (B) agree","(A) small / (B) refuse","(A) difficult / (B) agree","(A) small / (B) agree"],"r":{"a":"5) (A) small / (B) agree","ev":"2~4번 문장","s":[[2,"You say you’re busy, so she asks you to walk to the corner instead.","당신이 바쁘다고 말해서, 그녀는 당신에게 대신 길모퉁이까지 걸어가자고 부탁한다."],[3,"It’s not far, so you agree.","그곳(길모퉁이)은 멀지 않아서, 당신은 승낙한다."],[4,"When you get there, she asks you to go a little farther.","당신이 그곳에 도착하자, 그녀는 조금 더 멀리 가자고 부탁한다."]],"w":"2번에서 친구는 먼 운동장 대신 가까운 모퉁이까지만 부탁하고, 3번에서 멀지 않아서 당신은 승낙(agree)해요. 4번에서도 조금만 더 가자는 작은 부탁이에요.","c":5},"h":"6c4e6374d3"},{"n":10,"t":"fill","q":"To prevent this, salespeople would sometimes put their [A] in the way of the door so it couldn’t be [B].","ko":"이것을 막기 위해, 판매원들은 문이 [B]될 수 없도록 때때로 [A]을 문간에 들여놓곤 했다.","bank":["foot","closed","pattern","playground","strategy","request"],"bko":{"foot":"발","closed":"닫힌","pattern":"패턴","playground":"운동장","strategy":"전략","request":"요청"},"r":{"a":"[A] foot, [B] closed","ev":"10번 문장","s":[[10,"To prevent this, salespeople would sometimes put their foot in the way of the door so it couldn’t be closed.","이것을 막기 위해, 판매원들은 문이 닫히지 않도록 때때로 문간에 발을 들여놓곤 했다."]],"w":"10번 문장에 put their foot in the way of the door(문간에 발을 들여놓다)와 so it couldn’t be closed(문이 닫히지 않도록)가 있어요. 나머지 단어는 발이나 닫힘 자리에 들어가면 뜻이 맞지 않아요.","c":null},"h":"2862f4daa1"}]},{"u":6,"id":"rj2-06-1","no":1,"ko":"얕보면 안 되는 이것","items":[{"n":1,"t":"tf","q":"Our fingers have more pain receptors than most other parts of our body.","ko":"우리의 손가락은 우리 몸의 다른 대부분의 부위보다 더 많은 통증 수용기를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"There are more pain receptors in your fingers than in most other parts of your body.","당신의 손가락에는 다른 대부분의 신체 부위보다 더 많은 통증 수용기가 있다."]],"w":"6번 문장에서 손가락에는 다른 대부분의 신체 부위보다 더 많은 통증 수용기가 있다고 해요.","c":"T"},"h":"90d45c0d9b"},{"n":2,"t":"tf","q":"You can easily see the uneven edge of paper without a microscope.","ko":"당신은 현미경 없이도 종이의 고르지 않은 가장자리를 쉽게 볼 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"It’s hard to see this without a microscope.","현미경 없이 이것을 보기는 어렵다."]],"w":"10번 문장에서 현미경 없이는 이것(고르지 않은 가장자리)을 보기 어렵다(hard)고 해요. easily(쉽게)는 반대 내용이에요.","c":"F"},"h":"72711f5e23"},{"n":3,"t":"tf","q":"The rough edge of paper can damage a finger more than a sharp knife would.","ko":"종이의 거친 가장자리는 날카로운 칼보다 손가락을 더 손상시킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"However, the rough edge will damage your finger more than a sharp knife would.","하지만 그 거친 가장자리는 날카로운 칼보다 당신의 손가락을 더 손상시킬 것이다."]],"w":"11번 문장에 the rough edge will damage your finger more than a sharp knife would라고 나와요.","c":"T"},"h":"2fdc186885"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One reason is that our fingers are very sensitive.)","ko":"한 가지 이유는 우리의 손가락은 매우 ( ) 때문이다.","opts":["민감한","둔한","튼튼한","차가운"],"word":"sensitive","r":{"a":"1) 민감한","ev":"5~6번 문장","s":[[5,"One reason is that our fingers are very sensitive.","한 가지 이유는 우리의 손가락은 매우 민감하기 때문이다."],[6,"There are more pain receptors in your fingers than in most other parts of your body.","당신의 손가락에는 다른 대부분의 신체 부위보다 더 많은 통증 수용기가 있다."]],"w":"손가락에 통증 수용기가 많아서(6번) 작은 자극에도 아픔을 잘 느껴요. 그래서 sensitive = 민감한이에요.","c":1},"h":"f64449e65f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, the rough edge will damage your finger more than a sharp knife would.)","ko":"하지만 그 거친 가장자리는 날카로운 칼보다 당신의 손가락을 더 ( ) 것이다.","opts":["보호하다","치료하다","손상을 주다","닦다"],"word":"damage","r":{"a":"3) 손상을 주다","ev":"11번 문장","s":[[11,"However, the rough edge will damage your finger more than a sharp knife would.","하지만 그 거친 가장자리는 날카로운 칼보다 당신의 손가락을 더 손상시킬 것이다."]],"w":"거친 가장자리가 칼보다 더 아픈 상처를 낸다는 내용이에요. damage = 손상을 주다예요.","c":3},"h":"e549e9d1bf"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nIt’s hard to see this without a microscope.","ko":"밑줄 친 this가 가리키는 것은?","sko":"현미경 없이 이것을 보기는 어렵다.","opts":["종이에 손가락을 베인 것","종이의 가장자리가 고르지 않은 것","통증 신호가 뇌로 전달되는 것","날카로운 칼의 날"],"r":{"a":"2) 종이의 가장자리가 고르지 않은 것","ev":"9~10번 문장","s":[[9,"Also, the edge of a piece of paper is uneven.","또한, 종이의 가장자리는 고르지 않다."],[10,"It’s hard to see this without a microscope.","현미경 없이 이것을 보기는 어렵다."]],"w":"10번의 this는 바로 앞 9번 문장의 '종이의 가장자리가 고르지 않다는 것'이에요. 너무 미세해서 현미경 없이는 보기 어렵다는 뜻이에요.","c":2},"h":"405873bc2d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"No matter how small a paper cut is, it will make you say, “Ouch!”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"종이에 베인 상처가 아무리 작더라도, 그것은 당신이 “아야!”라고 말하게 할 것이다.","opts":["종이에 베인 상처가 작으면, 당신은 아무 말도 하지 않을 것이다.","종이에 베인 상처가 아무리 커도, 아프지 않을 것이다.","종이에 베인 상처는 클 때만 “아야!”라는 말이 나오게 한다.","종이에 베인 상처가 아무리 작아도, 당신은 “아야!”라고 말하게 될 것이다."],"r":{"a":"4) 종이에 베인 상처가 아무리 작아도, 당신은 “아야!”라고 말하게 될 것이다.","ev":"12번 문장","s":[[12,"No matter how small a paper cut is, it will make you say, “Ouch!”","종이에 베인 상처가 아무리 작더라도, 그것은 당신이 “아야!”라고 말하게 할 것이다."]],"w":"no matter how small은 '아무리 작더라도'예요. make you say는 '당신이 말하게 만든다'라서, 작아도 아야! 소리가 난다는 뜻이에요.","c":4},"h":"13969b8b52"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["종이에 베인 상처는 보통 큰 부상이다.","손가락에는 다른 몸 부위보다 통증 수용기가 더 적다.","종이에 베이면 많은 통증 신호가 뇌로 전달된다.","날카로운 칼이 종이의 가장자리보다 손가락을 더 많이 손상시킨다."],"opts":["Paper cuts are usually large injuries.","Fingers have fewer pain receptors than other body parts.","When you get a paper cut, many pain signals are sent to the brain.","A sharp knife damages a finger more than the edge of paper does."],"r":{"a":"3) When you get a paper cut, many pain signals are sent to the brain.","ev":"2, 6, 7, 11번 문장","s":[[2,"Paper cuts are usually small.","종이에 베인 상처는 보통 작다."],[6,"There are more pain receptors in your fingers than in most other parts of your body.","당신의 손가락에는 다른 대부분의 신체 부위보다 더 많은 통증 수용기가 있다."],[7,"So, when you get a paper cut, a lot of pain signals are sent to the brain.","그래서 당신이 종이에 베이면, 많은 통증 신호가 뇌로 전달된다."],[11,"However, the rough edge will damage your finger more than a sharp knife would.","하지만 그 거친 가장자리는 날카로운 칼보다 당신의 손가락을 더 손상시킬 것이다."]],"w":"7번에서 종이에 베이면 많은 통증 신호가 뇌로 전달된다고 해요. 상처는 보통 작고(2번), 손가락에 수용기가 더 많으며(6번), 거친 종이 가장자리가 칼보다 더 손상을 줘요(11번).","c":3},"h":"157471c059"},{"n":9,"t":"sum","q":"Paper cuts are (A), but the pain they cause is (B).","ko":"종이에 베인 상처는 (A)하지만, 그것들이 일으키는 통증은 (B)하다.","oko":["(A) 큰 / (B) 가벼운","(A) 큰 / (B) 극심한","(A) 작은 / (B) 가벼운","(A) 위험한 / (B) 가벼운","(A) 작은 / (B) 극심한"],"opts":["(A) big / (B) mild","(A) big / (B) intense","(A) small / (B) mild","(A) dangerous / (B) mild","(A) small / (B) intense"],"r":{"a":"5) (A) small / (B) intense","ev":"2~3번 문장","s":[[2,"Paper cuts are usually small.","종이에 베인 상처는 보통 작다."],[3,"However, the pain they cause is intense.","하지만 그것이 유발하는 통증은 심하다."]],"w":"2번에서 종이에 베인 상처는 보통 작고(small), 3번에서 그것이 일으키는 통증은 극심하다(intense)고 해요.","c":5},"h":"a879ef6050"},{"n":10,"t":"fill","q":"A paper cut hurts so much because our fingers are very [A] and have many pain [B].","ko":"종이에 베인 상처가 매우 아픈 이유는 우리의 손가락이 매우 [A]하고 많은 통증 [B]를 가지고 있기 때문이다.","bank":["sensitive","receptors","intense","minor","uneven","damage"],"bko":{"sensitive":"민감한","receptors":"수용기","intense":"극심한","minor":"작은","uneven":"고르지 않은","damage":"손상을 주다"},"r":{"a":"[A] sensitive, [B] receptors","ev":"5~6번 문장","s":[[5,"One reason is that our fingers are very sensitive.","한 가지 이유는 우리의 손가락은 매우 민감하기 때문이다."],[6,"There are more pain receptors in your fingers than in most other parts of your body.","당신의 손가락에는 다른 대부분의 신체 부위보다 더 많은 통증 수용기가 있다."]],"w":"5번에서 우리의 손가락은 매우 민감하다(sensitive)고 하고, 6번에서 손가락에 통증 수용기(pain receptors)가 더 많다고 해요. 나머지 단어는 손가락과 many pain 뒤에 자연스럽게 들어가지 않아요.","c":null},"h":"2e6d133dd7"}]},{"u":6,"id":"rj2-06-2","no":2,"ko":"이게 정말 내 목소리라니!","items":[{"n":1,"t":"tf","q":"When you speak, sound waves also move through the bones of your head.","ko":"당신이 말을 할 때, 음파는 또한 당신의 머리뼈들을 통과하여 이동한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"But when you speak, the sound waves also move through the bones of your head.","그러나 당신이 말을 할 때, 그 음파는 또한 당신의 머리뼈들을 통과하여 이동한다."]],"w":"7번 문장에서 당신이 말을 할 때 음파가 공기뿐 아니라 머리뼈도 통과한다고 해요.","c":"T"},"h":"932ecaf0d3"},{"n":2,"t":"tf","q":"A recording of your voice makes your voice sound lower and stronger.","ko":"녹음된 목소리는 당신의 목소리를 더 낮고 더 선명하게 들리게 한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"So your voice sounds higher and weaker.","그래서 당신의 목소리는 더 높고 더 약하게 들린다."]],"w":"10번 문장에서 녹음된 것을 들으면 목소리가 더 높고 더 약하게(higher and weaker) 들린다고 해요. lower and stronger는 내가 말할 때의 소리예요(8번).","c":"F"},"h":"1b95011c6f"},{"n":3,"t":"tf","q":"Many people like to hear recordings of their own voice.","ko":"많은 사람들이 자신의 목소리가 녹음된 것을 듣는 것을 좋아한다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"For this reason, many people don’t like to hear recordings of their own voice.","이러한 이유로, 많은 사람들이 자신의 목소리가 녹음된 것을 듣는 것을 좋아하지 않는다."]],"w":"11번 문장에서 이러한 이유로 많은 사람이 자신의 녹음된 목소리를 듣는 것을 좋아하지 않는다(don’t like)고 해요.","c":"F"},"h":"a90bdc9082"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When they reach your ears, you hear them.)","ko":"그것들이 당신의 귀에 ( ), 당신은 그것들을 듣는다.","opts":["떠나다","도달하다","피하다","막다"],"word":"reach","r":{"a":"2) 도달하다","ev":"6번 문장","s":[[6,"When they reach your ears, you hear them.","그것들이 당신의 귀에 도달하면, 당신은 그것들을 듣는다."]],"w":"음파가 귀에 와 닿아야 소리가 들려요. reach = 도달하다예요.","c":2},"h":"da0e658759"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Do you remember the first time you heard a recording of your own voice?)","ko":"당신은 처음으로 자신의 목소리가 ( ) 것을 들었을 때를 기억하는가?","opts":["녹음된 것","악기","노래 가사","사진"],"word":"recording","r":{"a":"1) 녹음된 것","ev":"1번 문장","s":[[1,"Do you remember the first time you heard a recording of your own voice?","당신은 처음으로 자신의 목소리가 녹음된 것을 들었을 때를 기억하는가?"]],"w":"자기 목소리를 들었던 경험인데 소리를 저장해 둔 것을 말해요. recording = 녹음(된 것)이에요.","c":1},"h":"b3a375b954"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSo they reach your ears in two different ways, which makes your voice sound lower and stronger.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그래서 그것들은 두 가지 다른 경로로 당신의 귀에 도달하고, 이것은 당신의 목소리를 더 낮고 더 선명하게 들리게 만든다.","opts":["당신의 귀들","다른 사람들","음파들","머리의 뼈들"],"r":{"a":"3) 음파들","ev":"7~8번 문장","s":[[7,"But when you speak, the sound waves also move through the bones of your head.","그러나 당신이 말을 할 때, 그 음파는 또한 당신의 머리뼈들을 통과하여 이동한다."],[8,"So they reach your ears in two different ways, which makes your voice sound lower and stronger.","그래서 그것들은 두 가지 다른 경로로 당신의 귀에 도달하고, 이것은 당신의 목소리를 더 낮고 더 선명하게 들리게 만든다."]],"w":"8번 they는 바로 앞 7번 문장의 the sound waves(음파)예요. 음파가 공기와 머리뼈 두 길로 귀에 도달한다는 뜻이에요.","c":3},"h":"e003a54ef2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"On the other hand, when you hear a recording of your voice, the sound waves are traveling only through the air.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"반면에, 당신이 자신의 목소리가 녹음된 것을 들을 때는 그 음파가 오직 공기 중으로만 이동하고 있다.","opts":["반면에, 녹음된 것을 들을 때는 음파가 오직 머리뼈를 통해서만 이동한다.","반면에, 녹음된 것을 들을 때는 음파가 공기와 머리뼈 둘 다를 통해 이동한다.","반면에, 녹음된 것을 들을 때는 음파가 이동하지 않는다.","반면에, 녹음된 목소리를 들을 때는 음파가 오직 공기를 통해서만 이동한다."],"r":{"a":"4) 반면에, 녹음된 목소리를 들을 때는 음파가 오직 공기를 통해서만 이동한다.","ev":"9번 문장","s":[[9,"On the other hand, when you hear a recording of your voice, the sound waves are traveling only through the air.","반면에, 당신이 자신의 목소리가 녹음된 것을 들을 때는 그 음파가 오직 공기 중으로만 이동하고 있다."]],"w":"only through the air는 오직 공기를 통해서만이라는 뜻이에요. 머리뼈는 내가 직접 말할 때만 해당돼요(7번).","c":4},"h":"a12aea2cda"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["다른 사람의 목소리의 음파는 공기를 통해 당신의 귀에 도달한다.","다른 사람이 말하면 음파는 오직 머리뼈로만 이동한다.","녹음된 목소리의 음파는 머리뼈를 통해 이동한다.","대부분의 사람들은 녹음된 자기 목소리를 듣기를 매우 좋아한다."],"opts":["Sound waves from another person’s voice reach your ears through the air.","When others speak, sound waves travel only through the bones.","Sound waves of a recorded voice travel through the bones of the head.","Most people love hearing recordings of their own voice."],"r":{"a":"1) Sound waves from another person’s voice reach your ears through the air.","ev":"5, 6, 9, 11번 문장","s":[[5,"When another person speaks, the sound waves travel through the air.","다른 사람이 말을 할 때, 그 음파는 공기를 통해서 이동한다."],[6,"When they reach your ears, you hear them.","그것들이 당신의 귀에 도달하면, 당신은 그것들을 듣는다."],[9,"On the other hand, when you hear a recording of your voice, the sound waves are traveling only through the air.","반면에, 당신이 자신의 목소리가 녹음된 것을 들을 때는 그 음파가 오직 공기 중으로만 이동하고 있다."],[11,"For this reason, many people don’t like to hear recordings of their own voice.","이러한 이유로, 많은 사람들이 자신의 목소리가 녹음된 것을 듣는 것을 좋아하지 않는다."]],"w":"5~6번에서 다른 사람의 음파는 공기를 통해 귀에 도달해요. 녹음된 소리도 공기만 통해 이동하고(9번), 많은 사람은 녹음된 자기 목소리를 좋아하지 않아요(11번).","c":1},"h":"ea94b20953"},{"n":9,"t":"sum","q":"When you speak, sound waves travel through the air and your (A), so your voice sounds (B) to you.","ko":"당신이 말할 때 음파는 공기와 당신의 (A)을 통해 이동하고, 그래서 당신에게 당신의 목소리는 (B) 들린다.","oko":["(A) 손 / (B) 더 높고 더 약하게","(A) 뼈 / (B) 더 높고 더 약하게","(A) 손 / (B) 더 낮고 더 선명하게","(A) 뼈 / (B) 더 낮고 더 약하게","(A) 뼈 / (B) 더 낮고 더 선명하게"],"opts":["(A) hands / (B) higher and weaker","(A) bones / (B) higher and weaker","(A) hands / (B) lower and stronger","(A) bones / (B) lower and weaker","(A) bones / (B) lower and stronger"],"r":{"a":"5) (A) bones / (B) lower and stronger","ev":"7~8번 문장","s":[[7,"But when you speak, the sound waves also move through the bones of your head.","그러나 당신이 말을 할 때, 그 음파는 또한 당신의 머리뼈들을 통과하여 이동한다."],[8,"So they reach your ears in two different ways, which makes your voice sound lower and stronger.","그래서 그것들은 두 가지 다른 경로로 당신의 귀에 도달하고, 이것은 당신의 목소리를 더 낮고 더 선명하게 들리게 만든다."]],"w":"7번에서 내가 말할 때 음파는 공기와 머리뼈(bones)로 이동하고, 8번에서 그래서 목소리가 더 낮고 더 선명하게(lower and stronger) 들린다고 해요.","c":5},"h":"8ddea721a3"},{"n":10,"t":"fill","q":"When you hear a recording of your voice, the sound waves travel [A] through the air, so your voice sounds [B] and weaker.","ko":"당신이 자신의 목소리가 녹음된 것을 들을 때, 음파는 [A] 공기를 통해 이동하고, 그래서 당신의 목소리는 [B] 더 약하게 들린다.","bank":["only","higher","lower","bones","reach","recording"],"bko":{"only":"오직","higher":"더 높은","lower":"더 낮은","bones":"뼈","reach":"도달하다","recording":"녹음"},"r":{"a":"[A] only, [B] higher","ev":"9~10번 문장","s":[[9,"On the other hand, when you hear a recording of your voice, the sound waves are traveling only through the air.","반면에, 당신이 자신의 목소리가 녹음된 것을 들을 때는 그 음파가 오직 공기 중으로만 이동하고 있다."],[10,"So your voice sounds higher and weaker.","그래서 당신의 목소리는 더 높고 더 약하게 들린다."]],"w":"9번에 the sound waves are traveling only through the air(오직 공기를 통해)가, 10번에 your voice sounds higher and weaker(더 높고 더 약하게)가 있어요. lower는 내가 말할 때의 소리(8번)라서 여기에는 맞지 않아요.","c":null},"h":"f99b8492b8"}]},{"u":6,"id":"rj2-06-3","no":3,"ko":"키가 줄어들고 있다고?","items":[{"n":1,"t":"tf","q":"You are actually taller in the morning than you are in the evening.","ko":"당신은 실제로 저녁보다 아침에 키가 더 크다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It may sound strange, but you’re actually taller in the morning than you are in the evening.","이상하게 들릴 수도 있지만, 당신은 실제로 저녁보다 아침에 키가 더 크다."]],"w":"3번 문장에 you’re actually taller in the morning than you are in the evening이라고 나와요.","c":"T"},"h":"9edcad5819"},{"n":2,"t":"tf","q":"Your spine contains 33 large bones that are not connected to each other.","ko":"당신의 척추에는 서로 연결되지 않은 33개의 큰 뼈가 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"This is because your spine contains 33 small bones that are connected by discs.","이것은 당신의 척추에 디스크들로 연결된 33개의 작은 뼈가 있기 때문이다."]],"w":"4번 문장에서 척추에는 디스크들로 연결된(connected) 33개의 작은(small) 뼈가 있다고 해요. 크고 연결되지 않았다는 말은 반대예요.","c":"F"},"h":"ee522eab29"},{"n":3,"t":"tf","q":"The discs get thinner while you sleep, so you lose more height.","ko":"당신이 자는 동안 디스크들은 더 얇아지고, 그래서 당신은 키를 더 잃는다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"The discs get thicker, and you gain back your lost height.","디스크들은 더 두꺼워지고, 당신은 잃어버렸던 키를 되찾는다."]],"w":"11번 문장에서 자는 동안 디스크들은 더 두꺼워지고(thicker) 잃은 키를 되찾는다고 해요. 더 얇아지고 키를 더 잃는다는 말은 반대예요.","c":"F"},"h":"d35f3f74e4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They squeeze the discs and make them flatter.)","ko":"그것들은 디스크들을 ( ) 더 납작하게 만든다.","opts":["늘린다","짓누른다","자른다","씻는다"],"word":"squeeze","r":{"a":"2) 짓누른다","ev":"8번 문장","s":[[8,"They squeeze the discs and make them flatter.","그것들은 디스크들을 짓눌러 더 납작하게 만든다."]],"w":"뼈들이 디스크를 눌러서 디스크가 더 납작해지는 장면이에요. squeeze = 짓누르다예요.","c":2},"h":"8cc5fc06ca"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (During the day, gravity pulls the bones of your spine downward.)","ko":"낮 동안에는 ( )이 당신의 척추의 뼈들을 아래로 잡아당긴다.","opts":["빛","바람","중력","소리"],"word":"gravity","r":{"a":"3) 중력","ev":"7번 문장","s":[[7,"During the day, gravity pulls the bones of your spine downward.","낮 동안에는 중력이 당신의 척추의 뼈들을 아래로 잡아당긴다."]],"w":"뼈를 아래로 잡아당기는 힘이에요. 지구가 물체를 끌어당기는 이 힘이 gravity = 중력이에요.","c":3},"h":"b7dd078ebd"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey squeeze the discs and make them flatter.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 디스크들을 짓눌러 더 납작하게 만든다.","opts":["디스크들","여러 방향들","액체들","척추의 뼈들"],"r":{"a":"4) 척추의 뼈들","ev":"7~8번 문장","s":[[7,"During the day, gravity pulls the bones of your spine downward.","낮 동안에는 중력이 당신의 척추의 뼈들을 아래로 잡아당긴다."],[8,"They squeeze the discs and make them flatter.","그것들은 디스크들을 짓눌러 더 납작하게 만든다."]],"w":"8번 They는 바로 앞 7번 문장의 the bones of your spine(척추의 뼈들)이에요. 디스크는 눌리는 쪽이라 They가 될 수 없어요.","c":4},"h":"0d07d31d42"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It may sound strange, but you’re actually taller in the morning than you are in the evening.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이상하게 들릴 수도 있지만, 당신은 실제로 저녁보다 아침에 키가 더 크다.","opts":["이상하게 들릴 수도 있지만, 당신은 실제로 저녁보다 아침에 키가 더 크다.","이상하게 들릴 수도 있지만, 당신은 실제로 아침보다 저녁에 키가 더 크다.","이상하게 들릴 수도 있지만, 당신의 키는 아침과 저녁에 똑같다.","이상하지 않게 들리겠지만, 당신은 실제로 저녁에 키가 더 작아지지 않는다."],"r":{"a":"1) 이상하게 들릴 수도 있지만, 당신은 실제로 저녁보다 아침에 키가 더 크다.","ev":"3번 문장","s":[[3,"It may sound strange, but you’re actually taller in the morning than you are in the evening.","이상하게 들릴 수도 있지만, 당신은 실제로 저녁보다 아침에 키가 더 크다."]],"w":"taller in the morning than you are in the evening은 '저녁보다 아침에 더 크다'예요. 아침과 저녁이 바뀌면 틀려요.","c":1},"h":"e917a67ed2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["척추에는 디스크가 없다.","중력은 낮 동안 척추의 뼈들을 위쪽으로 잡아당긴다.","디스크들은 무르고 액체를 함유하고 있다.","낮 동안 사람은 최고 1미터까지 작아진다."],"opts":["Your spine has no discs.","Gravity pulls the bones of your spine upward during the day.","The discs are soft and contain liquid.","During the day, you become up to one meter shorter."],"r":{"a":"3) The discs are soft and contain liquid.","ev":"4, 5, 7, 9번 문장","s":[[4,"This is because your spine contains 33 small bones that are connected by discs.","이것은 당신의 척추에 디스크들로 연결된 33개의 작은 뼈가 있기 때문이다."],[5,"These discs are soft and contain liquid.","이러한 디스크들은 무르고 액체를 함유하고 있다."],[7,"During the day, gravity pulls the bones of your spine downward.","낮 동안에는 중력이 당신의 척추의 뼈들을 아래로 잡아당긴다."],[9,"As a result, you become up to one centimeter shorter.","결과적으로 당신은 (최고) 1센티미터까지 더 작아지게 된다."]],"w":"5번에서 디스크는 무르고 액체를 함유한다고 해요. 척추에는 디스크가 있고(4번), 중력은 뼈를 아래로(downward) 당기며(7번), 줄어드는 키는 최고 1센티미터예요(9번).","c":3},"h":"1b4231a1c4"},{"n":9,"t":"sum","q":"During the day, gravity pulls the bones of your spine (A), so the discs get (B) and you become shorter.","ko":"낮 동안 중력은 당신의 척추의 뼈들을 (A) 잡아당기고, 그래서 디스크들은 더 (B)하게 되어 당신은 더
