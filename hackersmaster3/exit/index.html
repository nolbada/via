<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 마스터 3 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>
</head>

<script>
var P=[{"u":1,"id":"ms3-01-1","no":1,"ko":"튀어야 산다! 달라야 뜬다!","items":[{"n":1,"t":"tf","q":"Seth Godin compared each company in the market to a cow in a field.","ko":"세스 고딘은 시장의 각 회사를 들판의 소 한 마리에 비유했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"He argued that the market landscape is like a field, with each company represented by a cow.","그는 시장 환경이 들판과 같고, 각각의 회사가 소 한 마리로 표현될 수 있다고 주장했다."]],"w":"7번 문장에서 시장 환경은 들판과 같고 각각의 회사는 소 한 마리로 표현된다고 했어요.","c":"T"},"h":"9a8e01cd16"},{"n":2,"t":"tf","q":"A purple cow is a real animal that Seth Godin found on a country road.","ko":"보라색 소는 세스 고딘이 시골길에서 발견한 실제 동물이다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Actually, a purple cow is not a real creature but a marketing concept introduced by American author Seth Godin.","사실, 보라색 소는 실제 생물이 아니라 미국 작가 세스 고딘이 소개한 마케팅 개념이다."]],"w":"6번 문장에서 보라색 소는 실제 생물이 아니라 마케팅 개념이라고 해요. 시골길 장면(1번)은 상황을 상상해 보게 하는 도입이에요.","c":"F"},"h":"f3d583c740"},{"n":3,"t":"tf","q":"TOMS could have reached the same level of brand recognition even with a traditional business model.","ko":"톰스는 전통적인 사업 모델로도 똑같은 수준의 브랜드 인지도를 얻을 수 있었을 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"If TOMS had adopted a more traditional business model, it would not have been possible to achieve such a high level of brand recognition.","만약 톰스가 더 전통적인 사업 모델을 채택했더라면, 그러한 높은 수준의 브랜드 인지도를 달성하는 것은 가능하지 않았을 것이다."]],"w":"13번 문장은 만약 톰스가 전통적인 모델을 택했더라면 그런 높은 수준의 인지도를 달성하는 것은 가능하지 않았을 것이라고 해요.","c":"F"},"h":"a47238865d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In today’s crowded market, conventional products and services are no longer enough to stand out…)","ko":"오늘날의 ___ 시장에서, 전통적인 제품들과 서비스들은 더 이상 돋보이기에 충분하지 않다.","opts":["한산한","붐비는","새로 생긴","값비싼"],"word":"crowded","r":{"a":"2) 붐비는","ev":"8번 문장","s":[[8,"In today’s crowded market, conventional products and services are no longer enough to stand out among all the “brown cows.”","오늘날의 혼잡한 시장에서, 전통적인 제품들과 서비스들은 더 이상 모든 ‘갈색 소들’ 사이에서 돋보이기에 충분하지 않다."]],"w":"8번 문장은 시장에 비슷한 경쟁 상대가 가득하다는 뜻이에요. 많은 소가 모인 들판처럼 붐비는 시장이라서 눈에 띄기가 어려워요.","c":2},"h":"a9791d226d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The company’s focus on social responsibility generated a great deal of media hype…)","ko":"이 회사의 사회적 책임에 대한 관심은 많은 언론의 떠들썩한 보도를 ___.","opts":["줄였다","막았다","숨겼다","만들어냈다"],"word":"generated","r":{"a":"4) 만들어냈다","ev":"12번 문장","s":[[12,"The company’s focus on social responsibility generated a great deal of media hype and attracted many customers hoping to make the world a better place.","이 회사의 사회적 책임에 대한 관심은 많은 언론의 떠들썩한 보도를 만들어냈고 세상을 더 나은 곳으로 만들기를 희망하는 많은 고객들을 끌어모았다."]],"w":"12번에서 사회적 책임에 대한 관심이 언론의 떠들썩한 보도를 만들어냈고(generate), 고객도 끌어모았다고 해요. 줄이거나 막거나 숨겼다면 뒤의 ‘고객을 끌어모았다’와 이어지지 않아요.","c":4},"h":"727e2f67d9"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSuddenly, something catches your eye, so you quickly take out your phone and snap a picture of it to share with your friends.","ko":"밑줄 친 it이 가리키는 것은?","sko":"갑자기, 무언가가 당신의 눈길을 끌고, 당신은 그것을 친구들과 공유하기 위해 급히 전화기를 꺼내 사진을 찍는다.","opts":["당신의 전화기","눈길을 끈 무언가","당신의 친구들","시골길"],"r":{"a":"2) 눈길을 끈 무언가","ev":"3번 문장","s":[[3,"Suddenly, something catches your eye, so you quickly take out your phone and snap a picture of it to share with your friends.","갑자기, 무언가가 당신의 눈길을 끌고, 당신은 그것을 친구들과 공유하기 위해 급히 전화기를 꺼내 사진을 찍는다."]],"w":"3번 문장에서 무언가가 눈길을 끌어서 그것의 사진을 찍는 거예요. it은 그 눈길을 끈 무언가를 가리켜요.","c":2,"k":"it = 눈길을 끈 무언가"},"pron":"it","h":"e871af089e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"One representative example of a purple cow is the American shoe company TOMS.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"보라색 소의 한 대표적인 예는 미국 신발 회사 톰스(TOMS)다.","opts":["톰스는 보라색 소를 길러서 신발을 만드는 회사이다.","미국의 신발 회사 톰스는 보라색 소의 대표적인 예이다.","보라색 소는 톰스가 만든 신발 상표의 이름이다.","톰스는 보라색 소와 달리 평범한 신발 회사이다."],"r":{"a":"2) 미국의 신발 회사 톰스는 보라색 소의 대표적인 예이다.","ev":"10번 문장","s":[[10,"One representative example of a purple cow is the American shoe company TOMS.","보라색 소의 한 대표적인 예는 미국 신발 회사 톰스(TOMS)다."]],"w":"10번 문장에서 미국 신발 회사 톰스가 보라색 소의 대표적인 예라고 해요.","c":2},"h":"9210b30a24"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["톰스는 신발을 열 켤레 팔 때마다 한 켤레를 나눠 주었다.","톰스는 신발 한 켤레가 팔릴 때마다 도움이 필요한 아이에게 무료 신발을 주겠다고 약속했다.","톰스는 신발을 두 켤레 이상 산 고객에게만 무료 신발을 주었다.","톰스는 고객들에게 신발을 회사에 기부해 달라고 요청했다."],"opts":["TOMS gave away one pair of shoes for every ten pairs it sold.","TOMS promised to give a free pair of shoes to a child in need for each pair sold.","TOMS offered free shoes only to customers who bought more than one pair.","TOMS asked its customers to donate shoes to the company."],"r":{"a":"2) TOMS promised to give a free pair of shoes to a child in need for each pair sold.","ev":"11번 문장","s":[[11,"Calling it the “one-for-one” model, TOMS promised to provide free shoes to a child in need for each pair it sold to a customer.","그것을 ‘일대일’ 모델이라고 부르며, 톰스는 고객에게 신발 한 켤레를 판매할 때마다 도움이 필요한 아이에게 무료 신발을 제공하겠다고 약속했다."]],"w":"11번 문장에서 톰스는 신발 한 켤레를 팔 때마다 도움이 필요한 아이에게 무료 신발을 제공하겠다고 약속했어요(일대일 모델). 나머지는 이 내용과 달라요.","c":2},"h":"4536401e83"},{"n":9,"t":"sum","q":"Companies should offer (A) and unique things, and even (B) ones, to draw the attention of consumers.","ko":"기업은 소비자들의 관심을 끌기 위해 (A) 독특한 것, 심지어 (B) 것을 제공해야 한다.","oko":["(A) 평범한 / (B) 직관에 반하는","(A) 뛰어난 / (B) 평범한","(A) 뛰어난 / (B) 직관에 반하는","(A) 값싼 / (B) 직관에 반하는","(A) 익숙한 / (B) 전통적인"],"opts":["(A) ordinary / (B) counterintuitive","(A) exceptional / (B) ordinary","(A) exceptional / (B) counterintuitive","(A) cheap / (B) counterintuitive","(A) familiar / (B) traditional"],"r":{"a":"3) (A) exceptional / (B) counterintuitive ((A) 뛰어난 / (B) 직관에 반하는)","ev":"9번 문장","s":[[9,"Instead, companies should offer something exceptional, unique, and even counterintuitive to draw the attention of consumers.","대신에, 기업들은 소비자들의 관심을 끌기 위해 뛰어나고, 독특하고, 심지어 직관에 반하는 무언가를 제공해야 한다."]],"w":"9번 문장에서 기업은 소비자의 관심을 끌려면 뛰어나고(exceptional) 독특하고 심지어 직관에 반하는(counterintuitive) 것을 제공해야 한다고 해요.","c":3},"h":"7bcfd87a0d"},{"n":10,"t":"fill","q":"The purple cow is a marketing [A] introduced by Seth Godin, and TOMS shows that [B] approaches can create one.","ko":"보라색 소는 세스 고딘이 소개한 마케팅 [A]이고, 톰스는 [B] 접근이 보라색 소를 만들어낼 수 있음을 보여준다.","bank":["concept","unconventional","creature","conventional","landscape","attention"],"bko":{"concept":"개념","unconventional":"관습을 벗어난","creature":"생물","conventional":"전통적인","landscape":"환경","attention":"관심"},"r":{"a":"[A] concept, [B] unconventional","ev":"6, 14번 문장","s":[[6,"Actually, a purple cow is not a real creature but a marketing concept introduced by American author Seth Godin.","사실, 보라색 소는 실제 생물이 아니라 미국 작가 세스 고딘이 소개한 마케팅 개념이다."],[14,"This example clearly demonstrates how an unconventional approach can create a purple cow in the marketplace.","이 사례는 관습을 벗어난 접근이 시장에서 어떻게 보라색 소를 만들어내는지를 잘 보여준다."]],"w":"6번에서 보라색 소는 실제 생물(creature)이 아니라 마케팅 개념이라고 했고, 14번에서 관습을 벗어난(unconventional) 접근이 보라색 소를 만든다고 해요. conventional은 8번에서 ‘더 이상 충분하지 않다’고 한 쪽이에요.","c":null},"h":"0af2892c59"}]},{"u":1,"id":"ms3-01-2","no":2,"ko":"어? 내가 여기 왜 왔더라?","items":[{"n":1,"t":"tf","q":"Gabriel Radvansky’s research suggests that the doorway effect may be related to how the brain stores memories.","ko":"가브리엘 라드반스키의 연구는 문틀 효과가 뇌가 기억을 저장하는 방식과 관련이 있을지도 모른다고 시사한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Cognitive psychologist Gabriel Radvansky’s research suggests it may be related to how the human brain stores memories as distinct episodes tied to specific environments.","인지 심리학자 가브리엘 라드반스키의 연구는 문틀 효과가 인간의 뇌가 기억들을 특정한 환경들과 결부된 별개의 에피소드들로 저장하는 방식과 관련이 있을지도 모른다는 것을 시사한다."]],"w":"4번 문장에서 라드반스키의 연구는 문틀 효과가 뇌가 기억을 특정한 환경과 결부된 별개의 에피소드로 저장하는 방식과 관련이 있을지도 모른다고 해요.","c":"T"},"h":"d3500a984b"},{"n":2,"t":"tf","q":"The writer says that the doorway effect is a clear sign of aging.","ko":"글쓴이는 문틀 효과가 노화의 분명한 징후라고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"This isn’t a sign of aging or distraction —it’s a fascinating cognitive phenomenon called the doorway effect.","이것은 노화나 주의 산만의 징후가 아니며, 문틀 효과라고 불리는 매혹적인 인지 현상이다."]],"w":"3번 문장에서 이것은 노화나 주의 산만의 징후가 아니라 문틀 효과라고 불리는 인지 현상이라고 해요.","c":"F"},"h":"916d78cab4"},{"n":3,"t":"tf","q":"One way to avoid the doorway effect is to bring the object you need with you into the next room.","ko":"문틀 효과를 피하는 한 가지 방법은 필요한 물건을 다음 방으로 가지고 가는 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"In the example above, you can bring the remote with you into the storage room.","위의 예시에서, 당신은 리모컨을 당신과 함께 창고로 가져갈 수 있다."]],"w":"10번 문장에서 위의 예시에서는 리모컨을 창고로 함께 가져갈 수 있다고 해요.","c":"T"},"h":"7cc2c9e8ea"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So, how can you bypass the doorway effect?)","ko":"그렇다면, 당신은 어떻게 문틀 효과를 ___ 수 있는가?","opts":["발견할","설명할","피해 갈","반복할"],"word":"bypass","r":{"a":"3) 피해 갈","ev":"8번 문장","s":[[8,"So, how can you bypass the doorway effect?","그렇다면, 당신은 어떻게 문틀 효과를 우회할 수 있는가?"]],"w":"8번부터 글은 문틀 효과를 어떻게 피할 수 있는지로 넘어가요. 이어지는 9~11번이 모두 기억을 지키는 방법이므로 bypass는 피해 가다(우회하다)예요.","c":3},"h":"108c364d17"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You’ve just walked into the kitchen, but the purpose that sent you there has vanished.)","ko":"당신은 방금 부엌으로 걸어 들어왔지만, 당신을 거기로 보냈던 목적은 ___.","opts":["늘어났다","사라졌다","변했다","정해졌다"],"word":"vanished","r":{"a":"2) 사라졌다","ev":"2번 문장","s":[[2,"You’ve just walked into the kitchen, but the purpose that sent you there has vanished.","당신은 방금 부엌으로 걸어 들어왔지만, 당신을 거기로 보냈던 목적은 사라졌다."]],"w":"부엌에 왔는데 왜 왔는지 모르겠다는 1번 질문과 이어져요. 목적이 사라졌다(vanish)는 뜻이에요.","c":2},"h":"c32197915e"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nWhen we cross a spatial boundary, like a doorway, our brain naturally clears its short-term memory from the earlier space.","ko":"밑줄 친 its가 가리키는 것은?","sko":"우리가 문틀처럼 공간적인 경계를 건널 때, 우리의 뇌는 자연스럽게 이전 공간으로부터의 단기 기억을 지운다.","opts":["문틀","우리의 뇌","이전 공간","공간적인 경계"],"r":{"a":"2) 우리의 뇌","ev":"5번 문장","s":[[5,"When we cross a spatial boundary, like a doorway, our brain naturally clears its short-term memory from the earlier space.","우리가 문틀처럼 공간적인 경계를 건널 때, 우리의 뇌는 자연스럽게 이전 공간으로부터의 단기 기억을 지운다."]],"w":"5번 문장에서 문장 주어는 our brain이고, its short-term memory는 그 뇌의 단기 기억이에요. its는 our brain을 가리켜요.","c":2,"k":"its = 우리의 뇌(our brain)"},"pron":"its","h":"5e2e2379c7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, if you’re watching TV in the living room and realize you need batteries for the remote, you might forget all about the batteries as soon as you enter the storage room.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서, 만약 당신이 거실에서 TV를 보고 있고 리모컨을 위한 건전지가 필요하다는 것을 깨닫는다면, 당신은 창고에 들어가자마자 건전지에 대한 모든 것을 잊어버릴지도 모른다.","opts":["거실에서 건전지가 필요함을 깨달아도, 창고에 들어가는 순간 건전지 생각을 완전히 잊을 수 있다.","창고에 들어가면 건전지를 찾아 바로 리모컨에 끼울 수 있다.","TV를 보다가 창고에 들어가면 리모컨이 어디 있는지를 잊는다.","창고에 건전지가 있다는 것을 기억해야 TV를 계속 볼 수 있다."],"r":{"a":"1) 거실에서 건전지가 필요함을 깨달아도, 창고에 들어가는 순간 건전지 생각을 완전히 잊을 수 있다.","ev":"7번 문장","s":[[7,"So, if you’re watching TV in the living room and realize you need batteries for the remote, you might forget all about the batteries as soon as you enter the storage room.","그래서, 만약 당신이 거실에서 TV를 보고 있고 리모컨을 위한 건전지가 필요하다는 것을 깨닫는다면, 당신은 창고에 들어가자마자 건전지에 대한 모든 것을 잊어버릴지도 모른다."]],"w":"거실에서 건전지가 필요하다고 깨달은 뒤 창고에 들어가자마자(as soon as) 건전지에 대한 모든 것을 잊을 수 있다는 뜻이에요. 잊는 대상은 리모컨의 위치가 아니라 건전지예요.","c":1},"h":"6ca3ad35c0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우리는 문을 지날 때 오히려 이전 공간의 기억이 더 선명해진다.","문틀 효과를 피하려면 가능한 한 빨리 새로운 방에 들어가야 한다.","문틀을 지나기 전에 거실을 마음속으로 떠올리면 할 일을 기억하는 데 도움이 된다.","문틀 효과는 나이가 들면서 건망증이 심해져서 생긴다."],"opts":["Our memory of the earlier space becomes clearer when we pass through a doorway.","To avoid the doorway effect, you should enter a new room as quickly as possible.","Picturing the living room before entering the storage room can help you remember your task.","The doorway effect is caused by getting more forgetful with age."],"r":{"a":"3) Picturing the living room before entering the storage room can help you remember your task.","ev":"11번 문장","s":[[11,"Or, before you enter the storage room, mentally picture the living room to help remind you of your task.","아니면, 당신이 창고에 들어가기 전에, 당신의 과업을 상기시키는 것을 돕기 위해 마음속으로 거실을 그려라."]],"w":"11번 문장에서 창고에 들어가기 전에 마음속으로 거실을 그리면 할 일을 상기시키는 데 도움이 된다고 해요. 문을 지나면 이전 공간의 기억은 오히려 지워지고(5번), 속도나 나이는 이유로 나오지 않아요.","c":3},"h":"a01312e077"},{"n":9,"t":"sum","q":"The doorway effect works like a refresh button: our brain (A) for new memory creation in a (B) environment.","ko":"문틀 효과는 새로 고침 버튼처럼 작동해서, 우리의 뇌는 (B) 환경에서의 새로운 기억 생성을 (A).","oko":["(A) 준비한다 / (B) 익숙한","(A) 준비한다 / (B) 새로운","(A) 돌본다 / (B) 새로운","(A) 돌본다 / (B) 익숙한","(A) 요청한다 / (B) 익숙한"],"opts":["(A) prepares / (B) familiar","(A) prepares / (B) novel","(A) cares / (B) novel","(A) cares / (B) familiar","(A) asks / (B) familiar"],"r":{"a":"2) (A) prepares / (B) novel ((A) 준비한다 / (B) 새로운)","ev":"6번 문장","s":[[6,"This neural mechanism essentially acts like a cognitive refresh button, allowing our brain to prepare for new memory creation in the novel environment.","이 신경 메커니즘은 본질적으로 인지적 새로 고침 버튼처럼 작동하며, 우리의 뇌가 새로운 환경에서 새로운 기억 생성을 준비할 수 있게 한다."]],"w":"6번 문장에서 뇌는 새로 고침 버튼처럼 새로운(novel) 환경에서 새로운 기억 생성을 준비한다(prepare)고 해요.","c":2},"h":"d22ea0e9cf"},{"n":10,"t":"fill","q":"To keep your memory [A], try to maintain a [B] to the previous location.","ko":"당신의 기억을 [A] 상태로 유지하기 위해서는, 이전 장소와의 [B]을(를) 유지하려고 노력해라.","bank":["intact","connection","spatial","remote","mentally","storage"],"bko":{"intact":"온전한","connection":"연관성","spatial":"공간적인","remote":"리모컨","mentally":"마음속으로","storage":"저장"},"r":{"a":"[A] intact (온전한), [B] connection (연관성)","ev":"9번 문장","s":[[9,"To keep your memory intact, try to maintain a connection to the previous location.","당신의 기억을 온전하게 유지하기 위해서는, 이전 장소와의 연관성을 유지하려고 노력해라."]],"w":"9번 문장에서 기억을 온전하게(intact) 유지하려면 이전 장소와의 연관성(connection)을 유지하라고 해요. spatial은 공간적인, storage는 저장이라 빈칸에 맞지 않아요.","c":null},"h":"8cdc5e1c54"}]},{"u":1,"id":"ms3-01-3","no":3,"ko":"모르면 당하는 리듬의 함정","items":[{"n":1,"t":"tf","q":"Music is almost always present in places such as stores and cafés.","ko":"음악은 상점이나 카페 같은 장소에 거의 항상 존재한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"When you walk into a store, café, or service space, music is almost always present.","당신이 상점, 카페, 또는 서비스 공간에 걸어 들어갈 때, 음악은 거의 항상 존재한다."]],"w":"1번 문장에서 상점, 카페, 서비스 공간에 들어가면 음악이 거의 항상 존재한다고 해요.","c":"T"},"h":"a381b7a043"},{"n":2,"t":"tf","q":"Music with less predictable rhythms makes customers leave sooner.","ko":"덜 예측 가능한 리듬의 음악은 고객이 더 일찍 떠나게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"In contrast, music with less predictable rhythms demands more attention.","대조적으로, 덜 예측 가능한 리듬을 가진 음악은 더 많은 주의력을 요구한다."],[11,"Because the brain cannot easily anticipate subsequent patterns, the perception of time may become less structured, leading individuals to remain longer without conscious awareness of the cause.","뇌가 이어지는 패턴을 쉽게 예측할 수 없기 때문에, 시간에 대한 인식은 덜 구조화된 상태가 될 수 있으며, 그 결과 사람들은 그 원인을 자각하지 못한 채 더 오래 머무르게 된다."]],"w":"10~11번 문장에서 덜 예측 가능한 리듬은 더 많은 주의를 요구하고 시간 인식을 흐리게 해서 사람들이 더 오래 머무르게 한다고 해요. 더 일찍 떠나게 하는 쪽은 규칙적인 박자예요(9번).","c":"F"},"h":"78e5389d9c"},{"n":3,"t":"tf","q":"Background music can affect the timing of payments and how long people stay without their awareness.","ko":"배경 음악은 사람들이 모르는 사이에 결제 시점과 머무는 시간에 영향을 줄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Our behavior can be subtly regulated by background music, with the timing of payments, departures, and duration of stay often being shaped without conscious awareness.","우리의 행동은 배경 음악에 의해 미묘하게 조절될 수 있고, 결제 시점, 떠나는 시점, 그리고 체류 시간 또한 종종 의식적인 인지 없이 형성된다."]],"w":"5번 문장에서 결제 시점, 떠나는 시점, 체류 시간이 종종 의식적인 인지 없이 형성된다고 해요.","c":"T"},"h":"81a408923d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The regular beat can subtly push customers to finish their meals…)","ko":"규칙적인 박자는 고객들이 식사를 마치도록 ___ 떠밀 수 있다.","opts":["크게","빠르게","억지로","미묘하게"],"word":"subtly","r":{"a":"4) 미묘하게","ev":"9번 문장","s":[[9,"The regular beat can subtly push customers to finish their meals, make decisions faster, and leave sooner.","규칙적인 박자는 고객들이 식사를 마치고, 결정을 더 빨리 내리고, 더 일찍 떠나도록 미묘하게 떠밀 수 있다."]],"w":"9번은 박자가 손님에게 알아채기 어렵게 영향을 준다는 뜻이에요. 5번에서도 행동이 의식적인 인지 없이 조절된다고 하므로 subtly는 미묘하게예요.","c":4},"h":"13778c8ab6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…some high-end stores deliberately choose music without clear melodies…)","ko":"일부 명품 샵들은 명확한 멜로디가 없는 음악을 ___ 선택한다.","opts":["우연히","의도적으로","어쩔 수 없이","마지못해"],"word":"deliberately","r":{"a":"2) 의도적으로","ev":"14번 문장","s":[[14,"For this reason, some high-end stores deliberately choose music without clear melodies or memorable hooks, aiming to support the shopping experience rather than become the focus.","이러한 이유로, 일부 명품 샵들은 쇼핑 경험을 뒷받침하고 (음악이) 중심이 되지 않도록 하기 위해 명확한 멜로디나 기억에 남는 후크가 없는 음악을 의도적으로 선택한다."]],"w":"14번의 명품 샵은 쇼핑 경험을 뒷받침하겠다는 목표(aiming to ~)를 가지고 음악을 골라요. 우연이 아니라 일부러 선택한 것이므로 의도적으로예요.","c":2},"h":"5da0894eed"},{"n":6,"t":"ref","q":"What does the underlined \"where\" refer to?\nFor this reason, such music is often used in fast-food restaurants or other places where quick turnover is important.","ko":"밑줄 친 where가 가리키는 것은?","sko":"이러한 이유로, 그러한 음악은 빠른 회전율이 중요한 패스트푸드 식당이나 다른 장소에서 종종 사용된다.","opts":["패스트푸드 식당이나 다른 장소","빠른 회전율","음악","고객들"],"r":{"a":"1) 패스트푸드 식당이나 다른 장소","ev":"8번 문장","s":[[8,"For this reason, such music is often used in fast-food restaurants or other places where quick turnover is important.","이러한 이유로, 그러한 음악은 빠른 회전율이 중요한 패스트푸드 식당이나 다른 장소에서 종종 사용된다."]],"w":"8번 문장의 where 앞에 other places가 있어요. where는 빠른 회전율이 중요한 패스트푸드 식당이나 다른 장소를 가리켜요.","c":1,"k":"where = 패스트푸드 식당이나 다른 장소"},"pron":"where","h":"1b79917273"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Calm music in a therapy room or energetic music in a sports shop feels so natural that most people barely notice it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"치료실의 차분한 음악이나 스포츠용품점의 활기찬 음악은 너무나 자연스럽게 느껴져서 대부분의 사람들은 그것을 거의 알아차리지 못한다.","opts":["치료실이나 스포츠용품점의 음악은 너무 자연스러워서 대부분의 사람들이 음악이 있다는 것을 거의 의식하지 못한다.","치료실과 스포츠용품점의 음악은 너무 시끄러워서 대부분의 사람들이 불평한다.","대부분의 사람들은 음악을 쉽게 알아차릴 수 있는 장소를 찾아다닌다.","사람들은 차분한 음악만 알아차리고 활기찬 음악은 잘 알아차린다."],"r":{"a":"1) 치료실이나 스포츠용품점의 음악은 너무 자연스러워서 대부분의 사람들이 음악이 있다는 것을 거의 의식하지 못한다.","ev":"2번 문장","s":[[2,"Calm music in a therapy room or energetic music in a sports shop feels so natural that most people barely notice it.","치료실의 차분한 음악이나 스포츠용품점의 활기찬 음악은 너무나 자연스럽게 느껴져서 대부분의 사람들은 그것을 거의 알아차리지 못한다."]],"w":"so natural that most people barely notice it은 너무 자연스러워서 대부분의 사람들이 그것을 거의 알아차리지 못한다는 뜻이에요.","c":1},"h":"4758b21893"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이 글은 한 가지 음악 장르만을 소개한다.","규칙적인 박자는 손님이 식사를 오래 즐기도록 만든다.","음악 중에는 무시하기 쉽도록 고안된 것이 있다.","패스트푸드점은 예측 가능한 리듬을 피한다."],"opts":["This text introduces only one genre of music.","A regular beat makes customers enjoy their meals for a long time.","Some music is designed to be easy to ignore.","Fast-food restaurants avoid music with predictable rhythms."],"r":{"a":"3) Some music is designed to be easy to ignore.","ev":"12번 문장","s":[[12,"Another strategy is using music that is designed to be easy to ignore.","또 다른 전략은 무시하기 쉽도록 고안된 음악을 사용하는 것이다."]],"w":"12번 문장에서 또 다른 전략은 무시하기 쉽도록 고안된 음악을 사용하는 것이라고 해요. 규칙적인 박자는 손님이 식사를 마치고 일찍 떠나게 하고(9번), 패스트푸드점은 예측 가능한 리듬을 오히려 사용해요(8번).","c":3},"h":"35de58013e"},{"n":9,"t":"sum","q":"Background music is not just a (A) but a hidden force that (B) all of our behaviors.","ko":"배경 음악은 단순한 (A)이(가) 아니라 우리의 모든 행동을 (B)하는 보이지 않는 힘이다.","oko":["(A) 소음 / (B) 무시하는","(A) 장식 / (B) 무시하는","(A) 소음 / (B) 형성하는","(A) 리듬 / (B) 숨기는","(A) 장식 / (B) 형성하는"],"opts":["(A) noise / (B) ignores","(A) decoration / (B) ignores","(A) noise / (B) shapes","(A) rhythm / (B) hides","(A) decoration / (B) shapes"],"r":{"a":"5) (A) decoration / (B) shapes","ev":"15번 문장","s":[[15,"Ultimately, background music is not mere decoration but an invisible force that subtly shapes all of our behaviors.","궁극적으로, 배경 음악은 단순한 장식이 아니라 우리의 모든 행동을 미묘하게 형성하는 보이지 않는 힘이다."]],"w":"15번에서 배경 음악은 단순한 장식(mere decoration)이 아니라 우리의 모든 행동을 미묘하게 형성하는(shapes) 보이지 않는 힘이라고 해요.","c":5},"h":"20319aabe5"},{"n":10,"t":"fill","q":"When a song is too [A] or emotionally [B], it can compete with products for attention.","ko":"노래가 너무 [A] 또는 감정적으로 [B] 경우, 그것은 주의를 끌기 위해 제품과 경쟁할 수 있다.","bank":["familiar","engaging","efficiency","invisible","mere","subsequent"],"bko":{"familiar":"친숙한","engaging":"매력적인","efficiency":"효율성","invisible":"보이지 않는","mere":"단순한","subsequent":"이어지는"},"r":{"a":"[A] familiar (친숙한), [B] engaging (매력적인)","ev":"13번 문장","s":[[13,"When a song is too familiar or emotionally engaging, it can compete with products for attention.","노래가 너무 친숙하거나 감정적으로 매력적일 때, 그것은 주의를 끌기 위해 제품과 경쟁할 수 있다."]],"w":"13번 문장에서 노래가 너무 친숙하거나(familiar) 감정적으로 매력적이면(engaging) 제품과 주의를 두고 경쟁할 수 있다고 해요. invisible과 mere는 15번에서 배경 음악을 설명하는 말이에요.","c":null},"h":"aaff2b4637"}]},{"u":1,"id":"ms3-01-4","no":4,"ko":"The Bear That Wasn’t Quite a Bear","items":[{"n":1,"t":"tf","q":"For more than a century, scientists argued about where the giant panda belongs on the animal family tree.","ko":"한 세기 넘게 과학자들은 자이언트 판다가 동물 가계도에서 어디에 속하는지에 대해 논쟁했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Yet for more than a century, scientists debated where it truly belonged on the animal family tree.","그러나 한 세기 이상 동안, 과학자들은 그것이 동물 가계도에서 진정으로 어디에 속하는지에 대해 논쟁했다."]],"w":"3번 문장에서 한 세기 이상 동안 과학자들이 판다가 동물 가계도의 어디에 속하는지 논쟁했다고 해요.","c":"T"},"h":"e313dc4ed3"},{"n":2,"t":"tf","q":"Giant pandas hibernate through the winter like most bears.","ko":"자이언트 판다는 대부분의 곰처럼 겨울 동안 겨울잠을 잔다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"Even more puzzling, giant pandas do not hibernate like most bears.","훨씬 더 당혹스럽게도, 자이언트 판다는 대부분의 곰이 그러하는 것과 달리 겨울잠을 자지 않는다."],[9,"Because bamboo provides limited energy, pandas cannot build enough fat reserves to sleep through the winter.","대나무가 제한된 에너지를 제공하기 때문에, 판다는 겨울 동안 잠을 자기 위한 충분한 지방 비축물을 만들 수 없다."]],"w":"8번 문장에서 자이언트 판다는 대부분의 곰과 달리 겨울잠을 자지 않는다고 하고, 9번에서 대나무가 제한된 에너지를 주어 지방을 충분히 비축할 수 없기 때문이라고 해요.","c":"F"},"h":"29bd265633"},{"n":3,"t":"tf","q":"The panda’s “thumb” is actually an enlarged wrist bone.","ko":"판다의 ‘엄지’는 사실 커진 손목 뼈이다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"This thumb was not a true finger, but an enlarged wrist bone—an unusual tool for a carnivore.","이 엄지는 진짜 손가락이 아니라, 육식 동물에게는 특이한 도구인 커진 손목 뼈였다."]],"w":"7번 문장에서 이 엄지는 진짜 손가락이 아니라 커진 손목 뼈라고 해요.","c":"T"},"h":"eb33166325"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This thumb was not a true finger, but an enlarged wrist bone…)","ko":"이 엄지는 진짜 손가락이 아니라, ___ 손목 뼈였다.","opts":["작아진","잘린","커진","가려진"],"word":"enlarged","r":{"a":"3) 커진","ev":"7번 문장","s":[[7,"This thumb was not a true finger, but an enlarged wrist bone—an unusual tool for a carnivore.","이 엄지는 진짜 손가락이 아니라, 육식 동물에게는 특이한 도구인 커진 손목 뼈였다."]],"w":"7번의 엄지는 진짜 손가락이 아니라 손목 뼈가 커진 것으로, 판다가 대나무 줄기를 잡는 데 쓰는 특이한 도구예요. enlarge는 크게 하다이므로 enlarged는 커진이에요.","c":3},"h":"8e02d667b6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…this view gradually became the mainstream position.)","ko":"이 관점은 점차 ___ 입장이 되었다.","opts":["주류의","소수의","임시의","위험한"],"word":"mainstream","r":{"a":"1) 주류의","ev":"13번 문장","s":[[13,"DNA-based studies strongly supported the idea that the giant panda is closer to bears than to raccoons, and this view gradually became the mainstream position.","DNA 기반 연구들은 자이언트 판다가 라쿤보다 곰에 더 가깝다는 생각을 강력하게 지지했고, 이 관점은 점차 주류 입장이 되었다."]],"w":"13번은 DNA 기반 연구가 판다는 라쿤보다 곰에 가깝다는 생각을 강력하게 지지했고, 이 관점이 점차 널리 받아들여졌다는 흐름이에요. 그래서 mainstream은 주류의예요.","c":1},"h":"3f6eba9ed5"},{"n":6,"t":"ref","q":"What does the underlined \"These traits\" refer to?\nThese traits fueled arguments that giant pandas should not be placed in the same category as bears.","ko":"밑줄 친 These traits가 가리키는 것은?","sko":"이러한 특성들은 자이언트 판다가 곰과 같은 범주에 배치되어서는 안 된다는 주장에 기름을 부었다.","opts":["곰과 판다가 공통으로 가진 특징들","판다가 다른 곰들과 구별되는 특이한 특징들","DNA 기반 연구에서 새로 밝혀진 특징들","라쿤이 곰과 다르게 갖고 있는 특징들"],"r":{"a":"2) 판다가 다른 곰들과 구별되는 특이한 특징들","ev":"6, 7, 8, 11번 문장","s":[[6,"Their diet was dominated by bamboo, and they possessed a strange “thumb” that helped them grip stalks.","판다들의 식단은 대나무가 주를 이루었고, 판다들은 그들이 줄기를 잡는 것을 도왔던 이상한 “엄지”를 가지고 있었다."],[7,"This thumb was not a true finger, but an enlarged wrist bone—an unusual tool for a carnivore.","이 엄지는 진짜 손가락이 아니라, 육식 동물에게는 특이한 도구인 커진 손목 뼈였다."],[8,"Even more puzzling, giant pandas do not hibernate like most bears.","훨씬 더 당혹스럽게도, 자이언트 판다는 대부분의 곰이 그러하는 것과 달리 겨울잠을 자지 않는다."],[11,"These traits fueled arguments that giant pandas should not be placed in the same category as bears.","이러한 특성들은 자이언트 판다가 곰과 같은 범주에 배치되어서는 안 된다는 주장에 기름을 부었다."]],"w":"11번 문장은 이런 특성들 때문에 판다를 곰과 같은 범주에 두면 안 된다는 주장이 나왔다고 해요. 그러니 These traits는 판다가 다른 곰들과 달라 보이게 하는 특이한 점들이에요.","c":2,"k":"These traits = 판다가 다른 곰들과 구별되는 특이한 특징들"},"pron":"These traits","h":"d85676b0fc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The problem was that the panda looked like a bear in some ways but in other ways resembled raccoons.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"문제는 판다가 어떤 면에서는 곰처럼 보였지만 다른 면에서는 라쿤을 닮았다는 것이었다.","opts":["판다가 곰과 라쿤을 모두 잡아먹는다는 것이 문제였다.","판다가 모든 면에서 곰과 똑같아서 문제였다.","판다가 곰보다 라쿤을 훨씬 더 닮았으므로 문제가 되지 않았다.","판다가 어떤 면은 곰을, 어떤 면은 라쿤을 닮아서 분류가 어려웠다."],"r":{"a":"4) 판다가 어떤 면은 곰을, 어떤 면은 라쿤을 닮아서 분류가 어려웠다.","ev":"4번 문장","s":[[4,"The problem was that the panda looked like a bear in some ways but in other ways resembled raccoons.","문제는 판다가 어떤 면에서는 곰처럼 보였지만 다른 면에서는 라쿤을 닮았다는 것이었다."]],"w":"in some ways ~ but in other ways …는 ‘어떤 면에서는 ~지만 다른 면에서는 …’이라는 뜻이에요. 곰과 라쿤을 모두 닮아서 어디에 속하는지 정하기 어려운 것이 문제였어요(3번의 논쟁).","c":4},"h":"242af647cc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["자이언트 판다는 곰처럼 보이고, 곰처럼 걷고, 종종 ‘판다 곰’이라고 불린다.","자이언트 판다는 곰처럼 보이지만, 곰처럼 걷지는 않는다.","자이언트 판다는 ‘판다 곰’이라고 불린 적이 없다.","자이언트 판다는 라쿤처럼 보이고 종종 ‘판다 라쿤’이라고 불린다."],"opts":["The giant panda looks like a bear, walks like a bear, and is often called a “panda bear.”","The giant panda looks like a bear, but it never walks like one.","The giant panda is never called a “panda bear.”","The giant panda looks like a raccoon and is often called a “panda raccoon.”"],"r":{"a":"1) The giant panda looks like a bear, walks like a bear, and is often called a “panda bear.” (자이언트 판다는 곰처럼 보이고, 곰처럼 걷고, 종종 ‘판다 곰’이라고 불린다.)","ev":"2번 문장","s":[[2,"It looks like a bear, walks like a bear, and is often called a “panda bear.”","그것은 곰처럼 보이고, 곰처럼 걷고, 종종 “판다 곰”이라고 불린다."]],"w":"2번 문장에서 판다는 곰처럼 보이고, 곰처럼 걷고, 종종 판다 곰이라고 불린다고 해요.","c":1},"h":"d8c28d4096"},{"n":9,"t":"sum","q":"DNA-based studies (A) the idea that the giant panda is (B) to bears than to raccoons.","ko":"DNA 기반 연구들은 자이언트 판다가 라쿤보다 곰에 더 (B)다는 생각을 (A).","oko":["(A) 지지했다 / (B) 가깝","(A) 지지했다 / (B) 덜 가깝","(A) 거부했다 / (B) 가깝","(A) 무시했다 / (B) 덜 가깝","(A) 무시했다 / (B) 가깝"],"opts":["(A) supported / (B) closer","(A) supported / (B) less close","(A) rejected / (B) closer","(A) ignored / (B) less close","(A) ignored / (B) closer"],"r":{"a":"1) (A) supported / (B) closer ((A) 지지했다 / (B) 가깝)","ev":"13번 문장","s":[[13,"DNA-based studies strongly supported the idea that the giant panda is closer to bears than to raccoons, and this view gradually became the mainstream position.","DNA 기반 연구들은 자이언트 판다가 라쿤보다 곰에 더 가깝다는 생각을 강력하게 지지했고, 이 관점은 점차 주류 입장이 되었다."]],"w":"13번 문장에서 DNA 기반 연구들은 판다가 라쿤보다 곰에 더 가깝다는 생각을 강력하게 지지했다고 해요.","c":1},"h":"c49c721cb7"},{"n":10,"t":"fill","q":"Today, the giant panda is [A] a bear, but it is also [B] from other bears.","ko":"오늘날 자이언트 판다는 곰으로 [A] 동물이지만, 다른 곰들과 [B] 동물로도 분류된다.","bank":["considered","distinct","molecular","hibernate","puzzling","appropriate"],"bko":{"considered":"간주되는","distinct":"별개의","molecular":"분자의","hibernate":"겨울잠을 자다","puzzling":"당혹스러운","appropriate":"적절한"},"r":{"a":"[A] considered (간주되는), [B] distinct (별개의)","ev":"14번 문장","s":[[14,"Today, giant pandas are considered bears, yet they are also classified in a distinct category that reflects their unusual characteristics.","오늘날, 자이언트 판다는 곰으로 간주되지만, 그들은 또한 그들의 특이한 특징들을 반영하는 별개의 범주로 분류된다."]],"w":"14번에서 오늘날 판다는 곰으로 간주되지만(considered) 별개의(distinct) 범주로도 분류된다고 해요. molecular와 enlarged는 각각 12~13번의 증거, 7번의 손목 뼈를 설명하는 말이에요.","c":null},"h":"b79fb3d3ff"}]},{"u":2,"id":"ms3-02-1","no":1,"ko":"그 총이 이렇게 쓰이다니!","items":[{"n":1,"t":"tf","q":"Judy uses a carrot-shaped pen that is actually a voice recorder.","ko":"주디는 사실 녹음기인 당근 모양의 펜을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Early in the movie Zootopia, the police officer Judy uses a carrot-shaped pen, which is actually a voice recorder, to catch Nick admitting to a crime.","영화 <주토피아>의 초반에, 경찰관 주디는 범죄를 자백하는 닉을 잡기 위해 실제로는 녹음기인 당근 모양의 펜을 사용한다."]],"w":"1번 문장에서 주디가 carrot-shaped pen을 쓰는데 그 펜이 사실은 voice recorder라고 해요.","c":"T"},"h":"8705b4fb8b"},{"n":2,"t":"tf","q":"According to Chekhov, a gun shown in the first act may stay unused until the end of the story.","ko":"체호프에 따르면, 1막에 보인 총은 이야기 끝까지 사용되지 않아도 된다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"He argued that if a gun is shown hanging on the wall in the first act, it must be fired in the second or third act.","그는 만약 총이 1막에서 벽에 걸려 있는 것으로 보여졌다면, 그것은 2막이나 3막에서 반드시 발사되어야 한다고 주장했다."]],"w":"5번에서 1막에 걸린 총은 2막이나 3막에서 반드시 발사되어야(must be fired) 한다고 해요. 사용하지 않아도 된다는 말은 반대예요.","c":"F"},"h":"ea9e639181"},{"n":3,"t":"tf","q":"Chekhov’s Gun is a concept introduced by a Russian playwright.","ko":"체호프의 총은 러시아 극작가가 소개한 개념이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Chekhov’s Gun is a storytelling concept introduced by the Russian playwright Anton Chekhov.","체호프의 총은 러시아 극작가 안톤 체호프가 소개한 스토리텔링 개념이다."]],"w":"4번 문장에서 안톤 체호프는 러시아 극작가(Russian playwright)이고, 체호프의 총은 그가 소개한 스토리텔링 개념이라고 해요.","c":"T"},"h":"db9dce2687"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (the pen plays a decisive role in defeating the villain)","ko":"그 펜은 악당을 물리치는 데 결정적인 역할을 한다.","opts":["사소한","결정적인","우연한","비밀스러운"],"word":"decisive","r":{"a":"2) 결정적인","ev":"2번 문장","s":[[2,"At first, this scene seems like just a fun moment demonstrating how cleverly Judy tricks Nick, but surprisingly, the pen plays a decisive role in defeating the villain later in the movie!","처음에는 이 장면이 주디가 얼마나 영리하게 닉을 속이는지 보여주는 단지 재미있는 순간처럼 보이지만, 놀랍게도 그 펜은 영화 후반부에 악당을 물리치는 데 결정적인 역할을 한다!"]],"w":"2번에서 펜은 악당을 물리치는 데 중요한 역할을 해요. 영화 초반에는 재미있는 소품처럼 보였지만 후반에 일을 해결하므로 decisive는 '결정적인'이에요.","c":2},"h":"8dd6066d5d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (creates a satisfying payoff)","ko":"만족스러운 보상을 만들어 낸다.","opts":["비용","실수","보상","소음"],"word":"payoff","r":{"a":"3) 보상","ev":"10번 문장","s":[[10,"Additionally, reintroducing an element later in the story creates a satisfying payoff.","또한, 하나의 요소를 나중에 이야기에서 또다시 제시하는 것은 만족스러운 보상을 만들어낸다."]],"w":"10번은 요소를 나중에 다시 제시하면 관객이 만족하는 결과가 생긴다는 내용이에요. satisfying(만족스러운)과 어울리는 뜻은 '보상, 결실'이에요.","c":3},"h":"c4db517a4c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIn the case of Zootopia, if the carrot-shaped pen hadn’t been introduced earlier, the audience wouldn’t have experienced the same sense of satisfaction when it appeared at the climax.","ko":"밑줄 친 it이 가리키는 것은?","sko":"<주토피아>의 경우, 만약 당근 모양의 펜이 일찍 소개되지 않았다면, 관객들은 그것이 클라이맥스에서 등장했을 때 동일한 만족감을 경험하지 못했을 것이다.","opts":["당근 모양의 펜","관객","만족감","주디"],"r":{"a":"1) 당근 모양의 펜","ev":"11번 문장","s":[[11,"In the case of Zootopia, if the carrot-shaped pen hadn’t been introduced earlier, the audience wouldn’t have experienced the same sense of satisfaction when it appeared at the climax.","<주토피아>의 경우, 만약 당근 모양의 펜이 일찍 소개되지 않았다면, 관객들은 그것이 클라이맥스에서 등장했을 때 동일한 만족감을 경험하지 못했을 것이다."]],"w":"11번 문장에서 펜이 일찍 소개되지 않았다면 그것이 클라이맥스에서 등장했을 때의 만족감이 없었을 거라고 해요. it은 클라이맥스에서 등장한 당근 모양의 펜이에요.","c":1,"k":"it = 당근 모양의 펜"},"pron":"it","h":"0e4ea22523"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In other words, elements important to the story’s climax should be introduced earlier.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다시 말해, 이야기의 클라이맥스에 중요한 요소들은 미리 제시되어야 한다.","opts":["이야기의 클라이맥스에 중요한 요소는 이야기 초반에 미리 보여 주어야 한다.","이야기의 클라이맥스는 초반에 모두 보여 주어야 한다.","중요한 요소는 클라이맥스에서 처음 보여 주어야 한다.","이야기의 초반에는 중요하지 않은 요소만 나와야 한다."],"r":{"a":"1) 이야기의 클라이맥스에 중요한 요소는 이야기 초반에 미리 보여 주어야 한다.","ev":"6번 문장","s":[[6,"In other words, elements important to the story’s climax should be introduced earlier.","다시 말해, 이야기의 클라이맥스에 중요한 요소들은 미리 제시되어야 한다."]],"w":"6번 문장은 이야기의 클라이맥스에 중요한 요소는 더 일찍 소개되어야 한다는 뜻이에요.","c":1},"h":"3010ed99a9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["영화 <주토피아>의 당근 모양 펜은 체호프의 총의 예이다.","체호프의 총은 영화 <주토피아>에 나오는 등장인물이다.","당근 모양의 펜은 체호프의 총의 예가 아니다.","<주토피아>는 극작가 안톤 체호프가 썼다."],"opts":["The carrot-shaped pen in Zootopia is an example of Chekhov’s Gun.","Chekhov’s Gun is a character in the movie Zootopia.","The carrot-shaped pen is not an example of Chekhov’s Gun.","Zootopia was written by the playwright Anton Chekhov."],"r":{"a":"1) The carrot-shaped pen in Zootopia is an example of Chekhov’s Gun. (영화 <주토피아>의 당근 모양 펜은 체호프의 총의 예이다.)","ev":"2~3번 문장","s":[[2,"At first, this scene seems like just a fun moment demonstrating how cleverly Judy tricks Nick, but surprisingly, the pen plays a decisive role in defeating the villain later in the movie!","처음에는 이 장면이 주디가 얼마나 영리하게 닉을 속이는지 보여주는 단지 재미있는 순간처럼 보이지만, 놀랍게도 그 펜은 영화 후반부에 악당을 물리치는 데 결정적인 역할을 한다!"],[3,"This is an example of Chekhov’s Gun.","이것이 체호프의 총의 예이다."]],"w":"2~3번 문장에서 펜이 영화 후반에 결정적인 역할을 하는 것이 체호프의 총의 예라고 해요.","c":1},"h":"c0e58bfa55"},{"n":9,"t":"sum","q":"Chekhov’s Gun sends a (A) to the audience that anything they notice may be (B) later.","ko":"체호프의 총은 관객이 알아차리는 모든 것이 나중에 (B) 것일 수 있다는 (A)을(를) 관객에게 보낸다.","oko":["(A) 신호 / (B) 중요한","(A) 신호 / (B) 지루한","(A) 농담 / (B) 중요한","(A) 농담 / (B) 잊힌","(A) 비밀 / (B) 지루한"],"opts":["(A) signal / (B) significant","(A) signal / (B) boring","(A) joke / (B) significant","(A) joke / (B) forgotten","(A) secret / (B) boring"],"r":{"a":"1) (A) signal / (B) significant ((A) 신호 / (B) 중요한)","ev":"9번 문장","s":[[9,"Not only does this concept prevent irrelevant details from cluttering the narrative, but it also signals to the audience that anything they notice may be significant later, which keeps the audience engaged and makes the story more immersive.","이 개념은 무관한 세부 사항들이 서사를 어지럽히는 것을 방지할 뿐만 아니라, 그들이 알아차리는 모든 것이 나중에 중요할 수 있다고 관객에게 신호를 보내며, 이는 관객을 몰입시키고 이야기를 더 몰입감 있게 만든다."]],"w":"9번 문장에서 이 개념은 관객이 알아차리는 모든 것이 나중에 중요할(significant) 수 있다고 관객에게 신호(signals)를 보낸다고 해요.","c":1},"h":"f80194f4c5"},{"n":10,"t":"fill","q":"Chekhov’s Gun makes every element [A] and keeps the audience [B].","ko":"체호프의 총은 모든 요소를 [A] 것으로 만들고 관객을 [B] 상태로 유지한다.","bank":["meaningful","engaged","irrelevant","satisfaction","climax","narrative"],"bko":{"meaningful":"의미 있는","engaged":"몰입한","irrelevant":"무관한","satisfaction":"만족감","climax":"클라이맥스","narrative":"이야기"},"r":{"a":"[A] meaningful (의미 있는), [B] engaged (몰입한)","ev":"8~9번 문장","s":[[8,"First, it ensures that every element is meaningful.","첫째, 그것은 모든 요소가 의미 있도록 보장한다."],[9,"Not only does this concept prevent irrelevant details from cluttering the narrative, but it also signals to the audience that anything they notice may be significant later, which keeps the audience engaged and makes the story more immersive.","이 개념은 무관한 세부 사항들이 서사를 어지럽히는 것을 방지할 뿐만 아니라, 그들이 알아차리는 모든 것이 나중에 중요할 수 있다고 관객에게 신호를 보내며, 이는 관객을 몰입시키고 이야기를 더 몰입감 있게 만든다."]],"w":"8번 'every element is meaningful'과 9번 'keeps the audience engaged'에서 가져왔어요. irrelevant는 오히려 9번에서 막는 대상이라 [A]에 맞지 않아요.","c":null},"h":"fa79d66da0"}]},{"u":2,"id":"ms3-02-2","no":2,"ko":"불안해서 많이 못 빌려줘","items":[{"n":1,"t":"tf","q":"A haircut in finance means the gap between an asset’s assigned value and its actual market value.","ko":"금융에서 헤어컷은 자산에 할당된 가치와 실제 시장 가치의 차이를 뜻한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In this context, a haircut describes the difference between an asset’s assigned value and its actual market value.","이러한 맥락에서, 헤어컷은 자산에 할당된 가치와 그것의 실제 시장 가치 간의 차이를 설명한다."]],"w":"5번 문장에서 헤어컷은 자산의 assigned value와 actual market value의 차이를 설명한다고 해요.","c":"T"},"h":"a38b623395"},{"n":2,"t":"tf","q":"When asset values rise, banks raise haircut rates to protect themselves.","ko":"자산 가치가 오르면, 은행들은 스스로를 보호하기 위해 헤어컷 비율을 올린다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"When asset values decline, haircut rates increase as banks seek more protection against potential losses.","자산 가치가 하락할 때, 은행들이 잠재적 손실에 대한 더 많은 보호를 추구함에 따라 헤어컷 비율이 증가한다."]],"w":"7번에서 헤어컷 비율이 오르는 때는 자산 가치가 '하락할' 때(decline)예요. 오를 때(rise)가 아니에요.","c":"F"},"h":"2b0eb2152d"},{"n":3,"t":"tf","q":"Borrowers who cannot get loans may sell their falling-value assets at low prices.","ko":"대출을 받을 수 없는 차용자들은 가치가 떨어지는 자산을 낮은 가격에 팔 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Due to high haircuts, borrowers unable to get loans may sell their depreciating assets at low prices.","높은 헤어컷으로 인해, 대출을 받을 수 없는 차용자들은 가치가 하락하는 그들의 자산을 낮은 가격에 팔 수 있다."]],"w":"10번에서 높은 헤어컷 때문에 대출을 받을 수 없는 차용자들은 depreciating assets를 낮은 가격에 팔 수 있다고 해요.","c":"T"},"h":"cdfbdbe389"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (the bank appraises it at $80,000)","ko":"은행은 그것을 8만 달러로 평가한다.","opts":["평가하다","거절하다","팔다","상속하다"],"word":"appraises","r":{"a":"1) 평가하다","ev":"3번 문장","s":[[3,"The home’s current market value may be $100,000, but the bank appraises it at $80,000 and offers a loan of that same amount.","그 집의 현재 시장가치는 10만 달러일 수 있지만, 은행은 그것을 8만 달러로 감정하고 동일한 금액의 대출을 제공한다."]],"w":"3번에서 집의 시장가치는 10만 달러인데 은행은 8만 달러라고 값을 매겨요. appraise는 '가치를 평가하다, 감정하다'예요.","c":1},"h":"6c4f8d526c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (sell their depreciating assets at low prices)","ko":"가치가 하락하는 자산을 낮은 가격에 판다.","opts":["가치가 오르는","가치가 하락하는","새로 생긴","빌려 온"],"word":"depreciating","r":{"a":"2) 가치가 하락하는","ev":"10번 문장","s":[[10,"Due to high haircuts, borrowers unable to get loans may sell their depreciating assets at low prices.","높은 헤어컷으로 인해, 대출을 받을 수 없는 차용자들은 가치가 하락하는 그들의 자산을 낮은 가격에 팔 수 있다."]],"w":"10번은 자산을 '낮은 가격에' 판다고 해요. 이 자산은 값이 떨어지는 중이므로 depreciating은 '가치가 하락하는'이에요.","c":2},"h":"b12f7ec887"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhile a haircut usually refers to a hair salon service, in finance, it has a very different meaning related to loans.","ko":"밑줄 친 it이 가리키는 것은?","sko":"헤어컷은 일반적으로 미용실 서비스를 의미하지만, 금융에서 그것은 대출과 관련해 매우 다른 의미를 가진다.","opts":["미용실 서비스","헤어컷","금융","대출"],"r":{"a":"2) 헤어컷","ev":"1번 문장","s":[[1,"While a haircut usually refers to a hair salon service, in finance, it has a very different meaning related to loans.","헤어컷은 일반적으로 미용실 서비스를 의미하지만, 금융에서 그것은 대출과 관련해 매우 다른 의미를 가진다."]],"w":"1번 문장에서 헤어컷은 보통 미용실 서비스를 뜻하지만, 금융에서는 it(헤어컷)이 대출과 관련된 전혀 다른 뜻을 가진다고 해요.","c":2,"k":"it = 헤어컷(haircut)"},"pron":"it","h":"ab65df1a11"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This would allow them to provide loans without having to impose high haircuts during economic downturns.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 그들이 경제 침체기 동안 높은 헤어컷을 부과하지 않고도 대출을 제공할 수 있게 해줄 것이다.","opts":["은행들은 침체기에 높은 헤어컷을 부과해야만 대출을 제공할 수 있다.","은행들이 경제 침체기에도 높은 헤어컷을 부과하지 않고 대출을 해 줄 수 있게 된다.","은행들은 침체기에 대출을 아예 제공할 수 없게 된다.","은행들이 현금을 줄이면 침체기에 대출이 늘어난다."],"r":{"a":"2) 은행들이 경제 침체기에도 높은 헤어컷을 부과하지 않고 대출을 해 줄 수 있게 된다.","ev":"16~17번 문장","s":[[16,"One of them requires banks to hold more cash.","그것들 중 하나는 은행들이 더 많은 현금을 보유하도록 요구하는 것이다."],[17,"This would allow them to provide loans without having to impose high haircuts during economic downturns.","이는 그들이 경제 침체기 동안 높은 헤어컷을 부과하지 않고도 대출을 제공할 수 있게 해줄 것이다."]],"w":"without having to ~는 '~할 필요 없이'예요. 16번처럼 은행이 현금을 더 보유하면, 침체기에도 높은 헤어컷 없이 대출을 제공할 수 있다는 뜻이에요.","c":2},"h":"fab7cc8630"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["경제학자들은 2008년의 상황이 세계 경제에 거의 영향이 없었다고 주장한다.","2008년 이후 세계 경제는 빠르게 회복되었다.","경제학자들은 2008년의 상황이 세계 경제가 깊은 불황에 빠지는 데 중요한 요인이었다고 주장한다.","2008년 금융 위기는 은행들이 헤어컷 비율을 낮춰서 일어났다."],"opts":["Economists argue that the 2008 conditions had little effect on the global economy.","The global economy recovered quickly after 2008.","Economists argue that the 2008 conditions were significant factors in the global economy falling into a deep recession.","The 2008 financial crisis happened because banks lowered haircut rates."],"r":{"a":"3) Economists argue that the 2008 conditions were significant factors in the global economy falling into a deep recession.","ev":"13~14번 문장","s":[[13,"As the subprime mortgage market collapsed, financial institutions dramatically increased haircut rates, which created a severe cash shortage and froze credit markets.","서브프라임 모기지 시장이 붕괴됨에 따라, 금융 기관들은 헤어컷 비율을 극적으로 높였고, 이는 심각한 현금 부족을 야기하며 신용 시장을 얼어붙게 했다."],[14,"Today, economists argue that these conditions were significant factors in the global economy eventually falling into a deep recession.","오늘날, 경제학자들은 이러한 조건들이 세계 경제가 결국 깊은 불황에 빠지는 데 중요한 요인이었다고 주장한다."]],"w":"14번에서 경제학자들은 그 조건들이 세계 경제가 결국 깊은 불황에 빠지는 데 중요한 요인이었다고 주장해요. 13번에서 기관들은 헤어컷 비율을 낮춘 것이 아니라 극적으로 높였어요.","c":3},"h":"c12c1f4511"},{"n":9,"t":"sum","q":"When many institutions raise haircuts together, (A) money is available for lending, and borrowers who cannot get loans may be unable to (B) their debts.","ko":"많은 기관이 함께 헤어컷을 올리면 대출에 쓸 돈이 (A) 있고, 대출을 못 받은 차용자들은 부채를 (B)하지 못할 수 있다.","oko":["(A) 더 많은 / (B) 갚","(A) 더 많은 / (B) 무시","(A) 더 적은 / (B) 빌리","(A) 더 적은 / (B) 무시","(A) 더 적은 / (B) 갚"],"opts":["(A) more / (B) repay","(A) more / (B) ignore","(A) less / (B) borrow","(A) less / (B) ignore","(A) less / (B) repay"],"r":{"a":"5) (A) less / (B) repay","ev":"8~11번 문장","s":[[8,"If more financial institutions adopt similar measures and raise their haircuts to safeguard assets, a haircut contagion can be triggered.","더 많은 금융 기관들이 유사한 조치를 채택하고 자산을 보호하기 위해 헤어컷을 높이면, 헤어컷 전염이 촉발될 수 있다."],[9,"As high haircut rates spread, the amount of money available for lending decreases.","높은 헤어컷 비율이 확산됨에 따라, 대출 가능한 자금의 양이 감소한다."],[10,"Due to high haircuts, borrowers unable to get loans may sell their depreciating assets at low prices.","높은 헤어컷으로 인해, 대출을 받을 수 없는 차용자들은 가치가 하락하는 그들의 자산을 낮은 가격에 팔 수 있다."],[11,"This can leave them incapable of paying off their debts and lead to mass bankruptcies.","이는 그들이 그들의 부채를 갚을 능력이 없게 만들 수 있고, 대규모 파산으로 이어질 수 있다."]],"w":"8~9번에서 기관들이 함께 헤어컷을 올리면 대출 가능한 자금이 줄어요(less). 그 때문에 10~11번의 차용자들은 빚을 갚을(pay off = repay) 능력이 없어져요.","c":5},"h":"ea615a0d2e"},{"n":10,"t":"fill","q":"The 2008 financial crisis [A] the danger of haircut contagion, when financial institutions dramatically [B] haircut rates.","ko":"2008년 금융 위기는 헤어컷 전염의 위험을 [A]. 이때 금융 기관들은 헤어컷 비율을 극적으로 [B].","bank":["exposed","increased","lowered","hid","solved","collapsed"],"bko":{"exposed":"드러냈다","increased":"높였다","lowered":"낮췄다","hid":"숨겼다","solved":"해결했다","collapsed":"붕괴했다"},"r":{"a":"[A] exposed (드러냈다), [B] increased (높였다)","ev":"12~13번 문장","s":[[12,"The 2008 financial crisis exposed the dangerous potential of haircut contagion.","2008년 금융 위기는 헤어컷 전염의 위험한 잠재력을 드러냈다."],[13,"As the subprime mortgage market collapsed, financial institutions dramatically increased haircut rates, which created a severe cash shortage and froze credit markets.","서브프라임 모기지 시장이 붕괴됨에 따라, 금융 기관들은 헤어컷 비율을 극적으로 높였고, 이는 심각한 현금 부족을 야기하며 신용 시장을 얼어붙게 했다."]],"w":"12번 'exposed the dangerous potential of haircut contagion'과 13번 'dramatically increased haircut rates'에서 가져왔어요. lowered는 13번과 반대이고, hid·solved는 위기가 위험을 '드러냈다'는 12번과 맞지 않아요.","c":null},"h":"21253c2176"}]},{"u":2,"id":"ms3-02-3","no":3,"ko":"다 짜고 치는 고스톱이었어","items":[{"n":1,"t":"tf","q":"Wrestlers have made great efforts over the years to protect kayfabe.","ko":"레슬러들은 수년에 걸쳐 케이페이브를 보호하기 위해 많은 노력을 기울여 왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Over the years, wrestlers have gone to great lengths to protect kayfabe.","수년에 걸쳐, 레슬러들은 케이페이브를 보호하기 위해 많은 노력을 기울여 왔다."]],"w":"5번에서 wrestlers have gone to great lengths to protect kayfabe라고 해요. 많은 노력을 했다는 뜻이에요.","c":"T"},"h":"34246dbab0"},{"n":2,"t":"tf","q":"After the plane crash, Woods stayed in the hospital close to Flair.","ko":"비행기 추락 사고 후, 우즈는 플레어 가까이에서 병원에 계속 머물렀다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"So, despite suffering from broken ribs and a concussion, Woods checked himself out of the hospital to avoid being seen near Flair.","그래서, 부러진 갈비뼈와 뇌진탕으로 고통받고 있음에도 불구하고, 우즈는 플레어 근처에서 목격되는 것을 피하기 위해 스스로 병원에서 퇴원했다."]],"w":"9번에서 우즈는 플레어 근처에서 목격되는 것을 피하려고 스스로 병원에서 퇴원했어요(checked himself out). 병원에 머문 것이 아니에요.","c":"F"},"h":"d8d6a4b4c3"},{"n":3,"t":"tf","q":"Wrestlers stopped following kayfabe completely after 1989.","ko":"레슬러들은 1989년 이후 케이페이브를 완전히 따르지 않게 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Nevertheless, wrestlers today still abide by kayfabe to offer immersive and thrilling experiences for fans.","그럼에도 불구하고, 오늘날 레슬러들은 팬들에게 몰입감 있고 짜릿한 경험을 제공하기 위해 여전히 케이페이브를 준수하고 있다."]],"w":"12번에서 Nevertheless 뒤에 오늘날에도 레슬러들이 여전히 케이페이브를 지킨다(still abide by)고 해요. 1989년에 엄격한 케이페이브는 불필요해졌지만 완전히 그만둔 것은 아니에요.","c":"F"},"h":"4d4aff8859"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (wrestlers today still abide by kayfabe)","ko":"오늘날 레슬러들은 여전히 케이페이브를 지킨다.","opts":["어긴다","지킨다","반대한다","잊는다"],"word":"abide","r":{"a":"2) 지킨다","ev":"12번 문장","s":[[12,"Nevertheless, wrestlers today still abide by kayfabe to offer immersive and thrilling experiences for fans.","그럼에도 불구하고, 오늘날 레슬러들은 팬들에게 몰입감 있고 짜릿한 경험을 제공하기 위해 여전히 케이페이브를 준수하고 있다."]],"w":"12번의 still(여전히)과 Nevertheless(그럼에도 불구하고)를 보면 케이페이브를 계속 따른다는 뜻이에요. abide by는 '~을 준수하다, 지키다'예요.","c":2},"h":"2c37e1a882"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (the authenticity of professional wrestling would have been in serious jeopardy)","ko":"프로레슬링의 진정성은 심각한 위기에 처했을 것이다.","opts":["이익","기회","확신","위기"],"word":"jeopardy","r":{"a":"4) 위기","ev":"8번 문장","s":[[8,"If the public had suspected that they had been traveling together like close friends, the authenticity of professional wrestling would have been in serious jeopardy.","만약 대중이 그들이 친한 친구처럼 함께 여행하고 있었다고 의심했다면, 프로레슬링의 진정성은 심각한 위기에 처했을 것이다."]],"w":"8번은 대중이 둘이 친구라고 의심했다면 프로레슬링의 진정성이 심각한(serious) 어떤 상태에 놓였을지를 말해요. 가짜라는 사실이 들통나는 상황이므로 jeopardy는 '위험, 위기'예요.","c":4},"h":"f715f53da8"},{"n":6,"t":"ref","q":"What does the underlined \"his\" refer to?\nThanks to his incredible commitment, kayfabe could be safely preserved, and Woods was praised as the “Man Who Saved Wrestling.”","ko":"밑줄 친 his가 가리키는 것은?","sko":"그의 놀라운 헌신 덕분에, 케이페이브는 안전하게 유지될 수 있었고, 우즈는 ‘레슬링을 구한 남자’로 칭송받았다.","opts":["릭 플레어","팀 우즈","대중","가장 큰 레슬링 단체"],"r":{"a":"2) 팀 우즈","ev":"9~10번 문장","s":[[9,"So, despite suffering from broken ribs and a concussion, Woods checked himself out of the hospital to avoid being seen near Flair.","그래서, 부러진 갈비뼈와 뇌진탕으로 고통받고 있음에도 불구하고, 우즈는 플레어 근처에서 목격되는 것을 피하기 위해 스스로 병원에서 퇴원했다."],[10,"Thanks to his incredible commitment, kayfabe could be safely preserved, and Woods was praised as the “Man Who Saved Wrestling.”","그의 놀라운 헌신 덕분에, 케이페이브는 안전하게 유지될 수 있었고, 우즈는 ‘레슬링을 구한 남자’로 칭송받았다."]],"w":"9번에서 부상에도 스스로 퇴원한 사람은 우즈예요. 10번의 his incredible commitment(그의 놀라운 헌신)는 우즈의 헌신이고, 뒤에서 Woods가 칭송받았다고 해요.","c":2},"h":"a82401eb9a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Then in 1989, the largest wrestling organization publicly acknowledged that professional wrestling was just entertainment with scripted scenarios, making strict kayfabe unnecessary.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그리고 1989년에, 가장 큰 레슬링 단체는 프로레슬링이 각본이 있는 시나리오로 단지 엔터테인먼트라는 것을 공개적으로 인정하여 엄격한 케이페이브가 불필요해졌다.","opts":["1989년에 가장 큰 레슬링 단체가 프로레슬링은 각본이 있는 엔터테인먼트라고 공개적으로 인정해서, 엄격한 케이페이브는 필요 없어졌다.","1989년에 가장 큰 레슬링 단체가 엄격한 케이페이브를 더 강화하겠다고 공개적으로 발표했다.","1989년에 가장 큰 레슬링 단체가 문을 닫아서 프로레슬링이 엔터테인먼트가 되었다.","1989년에 레슬러들이 각본을 거부하고 실제 싸움만 하기로 했다."],"r":{"a":"1) 1989년에 가장 큰 레슬링 단체가 프로레슬링은 각본이 있는 엔터테인먼트라고 공개적으로 인정해서, 엄격한 케이페이브는 필요 없어졌다.","ev":"11번 문장","s":[[11,"Then in 1989, the largest wrestling organization publicly acknowledged that professional wrestling was just entertainment with scripted scenarios, making strict kayfabe unnecessary.","그리고 1989년에, 가장 큰 레슬링 단체는 프로레슬링이 각본이 있는 시나리오로 단지 엔터테인먼트라는 것을 공개적으로 인정하여 엄격한 케이페이브가 불필요해졌다."]],"w":"11번 문장은 1989년에 가장 큰 단체가 프로레슬링이 각본 있는 엔터테인먼트임을 공개적으로 인정해서 엄격한 케이페이브가 필요 없어졌다는 뜻이에요.","c":1},"h":"91ae8554a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["케이페이브라는 용어의 기원은 명확하게 알려져 있다.","케이페이브가 20세기 초 축제 은어에서 유래했다고 추정하는 사람들이 있다.","축제의 공연자들은 관객과 암호로 대화하기 위해 케이페이브를 만들었다.","케이페이브는 1989년에 가장 큰 레슬링 단체가 만들었다."],"opts":["The origin of the term kayfabe is clearly known.","Some people think kayfabe came from early 20th-century carnival slang.","Carnival performers created kayfabe to talk in code with the audience.","The largest wrestling organization invented kayfabe in 1989."],"r":{"a":"2) Some people think kayfabe came from early 20th-century carnival slang.","ev":"4번 문장","s":[[4,"The origin of the term is unclear, but some speculate that it is derived from early 20th-century carnival slang, which allowed performers to speak with each other in code to avoid breaking character in front of the audience.","이 용어의 기원은 명확하지 않지만, 일부는 그것이 20세기 초 축제 은어에서 유래했다고 추정하는데, 이는 공연자들이 관객 앞에서 캐릭터를 깨뜨리지 않기 위해 서로 암호로 대화할 수 있게 했다."]],"w":"4번에서 용어의 기원은 불분명하지만 일부는 20세기 초 축제 은어에서 유래했다고 추정한다고 해요. 암호로 대화한 것은 공연자들끼리였고 관객과 한 것이 아니에요(③). 1989년은 단체가 인정한 해예요(11번, ④).","c":2},"h":"759dba9135"},{"n":9,"t":"sum","q":"After the plane crash, both men were rushed to the (A) hospital, but they were supposed to be (B) rivals at all costs.","ko":"비행기 추락 사고 후, 두 사람은 (A) 병원으로 급히 이송되었지만, 어떤 대가를 치르더라도 (B) 라이벌이어야 했다.","oko":["(A) 가장 가까운 / (B) 치열한","(A) 가장 가까운 / (B) 친근한","(A) 가장 먼 / (B) 치열한","(A) 가장 먼 / (B) 친근한","(A) 가장 큰 / (B) 외로운"],"opts":["(A) nearest / (B) bitter","(A) nearest / (B) friendly","(A) farthest / (B) bitter","(A) farthest / (B) friendly","(A) biggest / (B) lonely"],"r":{"a":"1) (A) nearest / (B) bitter ((A) 가장 가까운 / (B) 치열한)","ev":"6~7번 문장","s":[[6,"One of the most extreme examples occurred in 1975, when Ric Flair and Tim Woods were involved in a plane crash.","가장 극단적인 예 중 하나는 1975년에 발생했는데, 이때가 릭 플레어와 팀 우즈가 비행기 추락 사고를 당했던 때이다."],[7,"Both were rushed to the nearest hospital, but there was another problem besides their injuries: they were supposed to be bitter rivals at all costs.","두 사람 모두 가장 가까운 병원으로 급히 이송되었지만, 그들의 부상 외에도 또 다른 문제가 있었는데, 그들은 어떤 대가를 치르더라도 치열한 라이벌이어야 했다."]],"w":"7번 문장에서 두 사람은 가장 가까운(nearest) 병원으로 급히 이송되었지만, 어떤 대가를 치르더라도 치열한(bitter) 라이벌이어야 했다고 해요.","c":1},"h":"b875cef7b0"},{"n":10,"t":"fill","q":"Kayfabe is a rule that makes audiences [A] that wrestling matches are [B].","ko":"케이페이브는 관객들이 레슬링 경기가 [B] 것이라고 [A] 만드는 규칙이다.","bank":["believe","real","rival","origin","slang","unclear"],"bko":{"believe":"믿다","real":"진짜의","rival":"경쟁자","origin":"기원","slang":"은어","unclear":"불분명한"},"r":{"a":"[A] believe (믿다), [B] real (진짜의)","ev":"3번 문장","s":[[3,"Kayfabe is a rule designed to make audiences believe that the wrestlers’ characters and interactions are real, even though they are actually fake.","케이페이브는 실제로는 그것들이 가짜임에도 불구하고, 레슬러들의 캐릭터와 상호작용이 진짜라고 관객들이 믿게 만들도록 고안된 규칙이다."]],"w":"3번 'make audiences believe that ~ are real'에서 가져왔어요. 나머지는 4~7번에 나오는 말이지만 케이페이브의 정의 문장에는 들어갈 수 없어요.","c":null},"h":"545c8b2749"}]},{"u":2,"id":"ms3-02-4","no":4,"ko":"Did a Witch Really Leave This Behind?","items":[{"n":1,"t":"tf","q":"Witches’-broom looks like the end of a broom.","ko":"마녀의 빗자루는 빗자루의 끝처럼 보인다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"One tree branch has a thick cluster of short, spiky stems that looks like the end of a broom.","한 나무 가지는 빗자루의 끝처럼 보이는 짧고, 뾰족한 줄기들의 두꺼운 덩어리를 가지고 있다."]],"w":"2번에서 짧고 뾰족한 줄기들의 두꺼운 덩어리가 the end of a broom처럼 보인다고 해요.","c":"T"},"h":"1bdbf14ed1"},{"n":2,"t":"tf","q":"In a healthy tree, auxins let small offshoots grow without limit.","ko":"건강한 나무에서 옥신은 작은 곁가지가 제한 없이 자라게 한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"In a healthy tree, a group of hormones called auxins limits the growth of small offshoots and instead focuses the tree’s energy into increasing the size of its trunk and primary branches.","건강한 나무에서, 옥신이라고 불리는 호르몬들의 한 그룹은 작은 가지들의 성장을 제한하고 대신에 나무의 에너지를 그것의 몸통과 주된 가지들의 크기를 증가시키는 것에 집중시킨다."]],"w":"8번에서 건강한 나무의 옥신은 작은 곁가지의 성장을 제한해요(limits). 제한 없이 자라는 것은 마녀의 빗자루가 생긴 나무에서 일어나요(10번).","c":"F"},"h":"4588ebfbe3"},{"n":3,"t":"tf","q":"Witches’-broom generally does not harm the health of a tree.","ko":"마녀의 빗자루는 일반적으로 나무의 건강을 해치지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"While the formation of witches’-broom may make a tree less attractive, it generally has no negative effect on the tree’s health.","마녀의 빗자루의 형성이 나무를 덜 매력적으로 만들지도 모르지만, 그것은 일반적으로 나무의 건강에 부정적인 영향을 미치지 않는다."]],"w":"11번에서 마녀의 빗자루는 나무를 덜 매력적으로 만들 수는 있지만 일반적으로 나무의 건강에는 부정적인 영향이 없다고 해요.","c":"T"},"h":"230d68c954"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (How did this plant get such a wicked name?)","ko":"어떻게 이 식물은 그렇게 사악한 이름을 얻었을까?","opts":["아름다운","흔한","조용한","사악한"],"word":"wicked","r":{"a":"4) 사악한","ev":"4~6번 문장","s":[[4,"It’s a common plant deformity called witches’-broom!","그것은 마녀의 빗자루라고 불리는 흔한 식물 기형이다!"],[5,"How did this plant get such a wicked name?","어떻게 이 식물은 그렇게 사악한 이름을 얻었을까?"],[6,"In the past, people believed this was created by witches to make their flying brooms.","과거에, 사람들은 마녀들이 날아다니는 빗자루를 만들기 위해 이것을 만들었다고 믿었다."]],"w":"4번에서 마녀의 빗자루라는 이름이 나오고, 6번에서 마녀가 만들었다고 믿었다고 해요. 마녀와 어울리는 이름이므로 wicked는 '사악한'이에요.","c":4},"h":"797415880d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (grow uncontrollably in a wild, tangled mess)","ko":"야생의, 엉킨 엉망진창인 상태로 통제할 수 없게 자란다.","opts":["곧게 뻗은","뒤엉킨","투명한","가벼운"],"word":"tangled","r":{"a":"2) 뒤엉킨","ev":"10번 문장","s":[[10,"The production of auxins is reduced in the infected section of a tree, causing multiple offshoots to begin to grow uncontrollably in a wild, tangled mess.","옥신의 생산은 나무의 감염된 부분에서 감소되고, 다수의 가지들이 야생의, 엉킨 엉망진창인 상태로 통제할 수 없게 자라기 시작하는 것을 야기한다."]],"w":"10번은 옥신이 줄어서 곁가지가 통제할 수 없이 자란다는 내용이에요. wild(야생의), mess(엉망진창)와 이어지므로 tangled는 '뒤엉킨'이에요.","c":2},"h":"8ca9d22f03"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nIn the past, people believed this was created by witches to make their flying brooms.","ko":"밑줄 친 their가 가리키는 것은?","sko":"과거에, 사람들은 마녀들이 날아다니는 빗자루를 만들기 위해 이것을 만들었다고 믿었다.","opts":["사람들","마녀들","곤충들","나무들"],"r":{"a":"2) 마녀들","ev":"6번 문장","s":[[6,"In the past, people believed this was created by witches to make their flying brooms.","과거에, 사람들은 마녀들이 날아다니는 빗자루를 만들기 위해 이것을 만들었다고 믿었다."]],"w":"6번 문장에서 사람들은 마녀들이 자기들의(their) 날아다니는 빗자루를 만들기 위해 이것을 만들었다고 믿었어요. their는 마녀들을 가리켜요.","c":2,"k":"their = 마녀들(witches)"},"pron":"their","h":"805ca3f839"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As you walk through a lush forest with sunlight streaming through the leaves, you suddenly spot something strange.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 나뭇잎들을 통해 햇빛이 흘러드는 무성한 숲을 통과하여 걸을 때, 당신은 갑자기 이상한 무언가를 발견한다.","opts":["숲을 걷다가 햇빛이 강해서 갑자기 길을 잃는다.","나뭇잎 사이로 햇빛이 비치는 무성한 숲을 걷다가 갑자기 이상한 무언가를 발견한다.","무성한 숲에서 갑자기 햇빛이 사라지고 이상한 소리가 들린다.","숲속의 이상한 물건을 햇빛 아래에서 천천히 만든다."],"r":{"a":"2) 나뭇잎 사이로 햇빛이 비치는 무성한 숲을 걷다가 갑자기 이상한 무언가를 발견한다.","ev":"1번 문장","s":[[1,"As you walk through a lush forest with sunlight streaming through the leaves, you suddenly spot something strange.","당신이 나뭇잎들을 통해 햇빛이 흘러드는 무성한 숲을 통과하여 걸을 때, 당신은 갑자기 이상한 무언가를 발견한다."]],"w":"1번 문장은 햇빛이 나뭇잎 사이로 흘러드는 무성한 숲을 걷다가 갑자기 이상한 것을 발견한다는 뜻이에요.","c":2},"h":"1cf3c1de49"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마녀의 빗자루는 흔한 식물 기형이다.","마녀의 빗자루는 희귀한 동물의 한 종류이다.","마녀의 빗자루는 마녀들이 날아다닐 때 쓰는 도구이다.","마녀의 빗자루는 숲에서만 자라는 나무의 한 종류이다."],"opts":["Witches’-broom is a common plant deformity.","Witches’-broom is a rare kind of animal.","Witches’-broom is a tool that witches use to fly.","Witches’-broom is a kind of tree that grows only in forests."],"r":{"a":"1) Witches’-broom is a common plant deformity. (마녀의 빗자루는 흔한 식물 기형이다.)","ev":"4번 문장","s":[[4,"It’s a common plant deformity called witches’-broom!","그것은 마녀의 빗자루라고 불리는 흔한 식물 기형이다!"]],"w":"4번 문장에서 마녀의 빗자루는 마녀의 빗자루라고 불리는 흔한 식물 기형이라고 해요.","c":1},"h":"57e7f3eaf5"},{"n":9,"t":"sum","q":"Witches’-broom is a (A) of insects, fungi, or viruses that (B) with the normal growth of a tree.","ko":"마녀의 빗자루는 나무의 정상적인 성장을 (B)하는 곤충, 균류, 바이러스의 (A)이다.","oko":["(A) 결과 / (B) 도움","(A) 결과 / (B) 방해","(A) 원인 / (B) 방해","(A) 원인 / (B) 도움","(A) 결과 / (B) 동의"],"opts":["(A) result / (B) help","(A) result / (B) interfere","(A) cause / (B) interfere","(A) cause / (B) help","(A) result / (B) agree"],"r":{"a":"2) (A) result / (B) interfere ((A) 결과 / (B) 방해)","ev":"7번 문장","s":[[7,"However, it has been discovered to be a result of insects, fungi, or viruses that interfere with the normal growth process of a tree.","그러나, 그것은 나무의 정상적인 성장 과정을 방해하는 곤충들, 균류, 또는 바이러스들의 결과인 것으로 밝혀졌다."]],"w":"7번 문장에서 마녀의 빗자루는 나무의 정상적인 성장을 방해하는(interfere) 곤충, 균류, 바이러스의 결과(result)라고 밝혀졌다고 해요.","c":2},"h":"09ba8da25c"},{"n":10,"t":"fill","q":"Witches’-broom plays an important [A] role by providing [B] for insects, birds, and small mammals.","ko":"마녀의 빗자루는 곤충, 새, 작은 포유류에게 [B]을(를) 제공함으로써 중요한 [A] 역할을 한다.","bank":["ecological","shelter","hormones","viruses","infected","trunk"],"bko":{"ecological":"생태학적인","shelter":"피난처","hormones":"호르몬","viruses":"바이러스","infected":"감염된","trunk":"몸통"},"r":{"a":"[A] ecological (생태학적인), [B] shelter (피난처)","ev":"12~13번 문장","s":[[12,"In fact, it plays an important ecological role in a forest.","사실, 그것은 숲에서 중요한 생태학적 역할을 한다."],[13,"Studies have shown that it contributes to an increase in biodiversity by providing shelter for many species of insects, birds, and small mammals.","연구들은 그것이 곤충들, 새들, 그리고 작은 포유류들의 많은 종들에게 피난처를 제공함으로써 생물 다양성의 증가에 기여한다는 것을 보여주었다."]],"w":"12번 'an important ecological role'과 13번 'by providing shelter'에서 가져왔어요. wicked·tangled는 이름과 모양을 말하는 단어이고, hormones·viruses는 동물에게 제공하는 것이 될 수 없어요.","c":null},"h":"b78e635fff"}]},{"u":3,"id":"ms3-03-1","no":1,"ko":"늑대는 무섭고 개는 귀여운 이유","items":[{"n":1,"t":"tf","q":"The RAOL helps widen a dog's eye by pulling it toward the ears.","ko":"RAOL은 눈을 귀 쪽으로 당겨서 개의 눈을 크게 만드는 것을 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The RAOL is near the outer corner of the eye and widens the eye by pulling it toward the ears.","RAOL은 눈의 바깥쪽 구석 근처에 있으며 눈을 귀 쪽으로 당겨 눈을 크게 만든다."]],"w":"5번 문장에서 RAOL은 눈의 바깥쪽 구석 근처에 있고 눈을 귀 쪽으로 당겨 눈을 크게 만든다고 해요. 그래서 맞는 내용이에요.","c":"T"},"h":"7320feaae8"},{"n":2,"t":"tf","q":"Dogs in shelters that show puppy dog eyes are less likely to be adopted than those that don't.","ko":"보호소에서 강아지 눈을 보이는 개들은 그렇지 않은 개들보다 입양될 가능성이 더 낮다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"In fact, one study showed that dogs in shelters who exhibit puppy dog eyes are more likely to be adopted than those who don’t.","사실, 한 연구는 보호소에서 강아지 눈을 보이는 개들이 그렇지 않은 개들보다 입양될 가능성이 더 높다는 것을 보여주었다."]],"w":"8번 문장은 강아지 눈을 보이는 개들이 입양될 가능성이 '더 높다'고 해요. less likely(덜 ~할 것 같은)는 반대 내용이에요.","c":"F"},"h":"878c84268f"},{"n":3,"t":"tf","q":"The writer says the warm connection we sense in a dog's eyes is real, not imagined.","ko":"글쓴이는 개의 눈에서 느끼는 따뜻한 유대감이 상상이 아니라 실제라고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"So, when your furry friends look at you, remember that the warm connection you sense in their deep eyes is not your imagination.","그러니, 당신의 털뭉치 친구가 당신을 바라볼 때, 당신이 그들의 눈에서 느끼는 따뜻한 유대감은 결코 당신의 착각이 아니라는 것을 기억하라."]],"w":"10번 문장에서 그 따뜻한 유대감은 not your imagination(당신의 착각이 아니다)이라고 해요. 그래서 맞는 내용이에요.","c":"T"},"h":"c0c561f140"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This expression also resembles that of infants, which may promote a nurturing response from people.)","ko":"이 표정은 또한 유아의 표정과 닮았는데, 이는 사람들로부터 양육 반응을 촉진할 수 있다.","opts":["막는다","촉진한다","숨긴다","의심한다"],"word":"promote","r":{"a":"2) 촉진한다","ev":"7번 문장","s":[[7,"This expression also resembles that of infants, which may promote a nurturing response from people.","이 표정은 또한 유아의 표정과 닮았는데, 이는 사람들로부터 양육 반응을 촉진할 수 있다."]],"w":"개의 표정이 유아와 닮으면 사람들이 돌봐 주고 싶은 반응이 더 잘 나오겠지요. promote = 촉진하다예요. '막는다'는 반대 뜻이에요.","c":2},"h":"966e984ece"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Dogs possess two highly developed facial muscles.)","ko":"개는 고도로 발달한 두 개의 안면 근육을 가지고 있다.","opts":["잃어버린다","빌려 준다","가지고 있다","찾고 있다"],"word":"possess","r":{"a":"3) 가지고 있다","ev":"3번 문장","s":[[3,"Compared to wolves, dogs possess two highly developed facial muscles that give them their endearing appearance: the levator anguli oculi medialis (LAOM) and the retractor anguli oculi lateralis (RAOL).","늑대와 비교하여, 개는 그들에게 사랑스러운 외모를 부여하는 두 개의 고도로 발달한 안면 근육을 가지고 있다. 바로 눈 안쪽 구석 올림근(LAOM)과 눈 가쪽 구석 당김근(RAOL)이다."]],"w":"3번 문장은 개가 두 개의 발달한 안면 근육을 '가지고 있다'는 내용이에요. possess = 가지다(소유하다)예요.","c":3},"h":"1202edfda8"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhy does a dog look friendly while a wolf appears frightening, even though they are the same species?","ko":"밑줄 친 they가 가리키는 것은?","sko":"왜 개는 친근해 보이는 반면 늑대는 무서워 보일까, 비록 그들이 같은 종일지라도?","opts":["개와 늑대","개의 눈 근육","개와 사람","두 종류의 개"],"r":{"a":"1) 개와 늑대","ev":"1번 문장","s":[[1,"Why does a dog look friendly while a wolf appears frightening, even though they are the same species?","비록 그들이 같은 종일지라도, 왜 개는 친근해 보이는 반면 늑대는 무서워 보일까?"]],"w":"같은 종이라는 말은 앞에서 비교한 개(a dog)와 늑대(a wolf)에 대한 말이에요. 눈 근육은 3번에서야 나와요.","c":1},"h":"7967866047"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Together, these muscles enable dogs to create a sad, pleading expression that appeals to human empathy.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"함께, 이 근육들은 개가 인간의 공감에 호소하는 슬프고 애원하는 표정을 지을 수 있게 해준다.","opts":["개는 사람의 공감을 느끼면 슬픈 표정을 짓는다.","두 근육이 따로따로 움직여 서로 다른 표정을 만든다.","사람이 슬퍼할 때 개의 근육이 그 표정을 따라 한다.","두 근육이 함께 작용해 개가 사람의 공감을 끌어내는 슬픈 표정을 지을 수 있다."],"r":{"a":"4) 두 근육이 함께 작용해 개가 사람의 공감을 끌어내는 슬픈 표정을 지을 수 있다.","ev":"6번 문장","s":[[6,"Together, these muscles enable dogs to create a sad, pleading expression that appeals to human empathy.","함께, 이 근육들은 개가 인간의 공감에 호소하는 슬프고 애원하는 표정을 지을 수 있게 해준다."]],"w":"Together는 두 근육이 함께라는 뜻이고, enable ~ to-v는 '~가 …할 수 있게 해 주다'예요. 사람의 공감을 느끼는 쪽은 개가 아니라 사람이에요.","c":4},"h":"8e5fb1cb7b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["개와 늑대가 다르게 보이는 차이는 그들의 눈에서 비롯된다.","개는 늑대보다 더 크기 때문에 친근해 보인다.","늑대는 개보다 꼬리가 더 길기 때문에 무서워 보인다.","개와 늑대는 같은 종이 아니기 때문에 다르게 보인다."],"opts":["The difference in how dogs and wolves look comes from their eyes.","Dogs look friendly because they are bigger than wolves.","Wolves look frightening because they have longer tails than dogs.","Dogs and wolves look different because they are not the same species."],"r":{"a":"1) The difference in how dogs and wolves look comes from their eyes. (개와 늑대가 다르게 보이는 차이는 그들의 눈에서 비롯된다.)","ev":"1~2번 문장","s":[[1,"Why does a dog look friendly while a wolf appears frightening, even though they are the same species?","비록 그들이 같은 종일지라도, 왜 개는 친근해 보이는 반면 늑대는 무서워 보일까?"],[2,"The answer is in their eyes.","정답은 그들의 눈에 있다."]],"w":"1~2번 문장에서 개와 늑대는 같은 종인데도 다르게 보이고, 그 답은 그들의 눈에 있다고 해요.","c":1},"h":"cd4764a570"},{"n":9,"t":"sum","q":"Over thousands of years of (A), dogs evolved these traits to (B) with their human companions.","ko":"수만 년에 걸친 (A) 동안, 개는 인간 동반자와 (B)하기 위해 이 특성들을 진화시켰다.","oko":["(A) 가축화 / (B) 경쟁","(A) 가축화 / (B) 유대감을 형성","(A) 훈련 / (B) 유대감을 형성","(A) 사냥 / (B) 경쟁","(A) 훈련 / (B) 사냥"],"opts":["(A) domestication / (B) compete","(A) domestication / (B) bond","(A) training / (B) bond","(A) hunting / (B) compete","(A) training / (B) hunt"],"r":{"a":"2) (A) domestication / (B) bond ((A) 가축화 / (B) 유대감을 형성)","ev":"9번 문장","s":[[9,"Researchers believe that over 30,000 years of domestication, dogs evolved these traits to help them bond with their human companions emotionally, and secure consistent care and protection.","연구원들은 3만 년 이상의 가축화 기간 동안, 개들이 인간 동반자와 정서적으로 유대감을 형성하고 지속적인 보살핌과 보호를 얻는 것을 돕기 위해 이러한 특성들을 진화시켰다고 믿는다."]],"w":"9번 문장에서 3만 년 이상의 가축화(domestication) 동안 개는 인간 동반자와 유대감을 형성하기(bond) 위해 이 특성들을 진화시켰다고 해요.","c":2},"h":"ad5ea6ff7e"},{"n":10,"t":"fill","q":"The LAOM is [A] above the eye and helps [B] the eyebrows.","ko":"눈 위에 [A] LAOM은 눈썹을 [B] 것을 돕는다.","bank":["located","raise","adopted","evolved","resemble","exhibit"],"bko":{"located":"위치한","raise":"올리다","adopted":"입양된","evolved":"진화했다","resemble":"닮다","exhibit":"보이다"},"r":{"a":"[A] located (위치한), [B] raise (올리다)","ev":"4번 문장","s":[[4,"The LAOM is located above the eye, near the nose, and helps raise the eyebrows.","LAOM은 눈 위, 코 근처에 위치하며 눈썹을 올리는 것을 돕는다."]],"w":"4번 문장에 The LAOM is located above the eye ... and helps raise the eyebrows가 나와요. is 뒤에는 located가, helps 뒤에는 동사 raise가 와요. 나머지 단어는 이 자리에 뜻도 모양도 맞지 않아요.","c":null},"h":"60c49e6ad1"}]},{"u":3,"id":"ms3-03-2","no":2,"ko":"분명 나보다 더 바보가 있을 거야","items":[{"n":1,"t":"tf","q":"Michael bought the baseball card even though he knew its price was too high.","ko":"마이클은 그 야구 카드의 가격이 너무 높다는 것을 알고 있었음에도 그것을 샀다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Although he knew that the price was too high for the card, he eventually purchased it.","비록 그는 그 카드에 대한 가격이 너무 높다는 것을 알고 있었지만, 그는 결국 그것을 구매했다."]],"w":"2번 문장에서 마이클은 가격이 너무 높다는 것을 알고 있었지만 결국 구매했다고 해요. 맞는 내용이에요.","c":"T"},"h":"bc3e0f3de7"},{"n":2,"t":"tf","q":"Tulip bulbs with rare patterns were valued lower than craftsmen's annual incomes.","ko":"희귀한 무늬를 가진 튤립 구근들은 장인들의 연간 소득보다 낮게 평가되었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"They were even valued higher than craftsmen’s annual incomes!","그것들은 심지어 장인들의 연간 소득보다 더 높게 평가되었다!"]],"w":"11번 문장은 구근들이 장인들의 연간 소득보다 '더 높게' 평가되었다고 해요. 낮게 평가되었다는 말은 반대예요.","c":"F"},"h":"bee4927425"},{"n":3,"t":"tf","q":"Michael believed that a collector might pay more than he did for the card.","ko":"마이클은 수집가 중 누군가가 자신이 낸 것보다 더 많은 돈을 그 카드에 낼 수도 있다고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"He believed that the baseball card was in demand by collectors and one of them would be willing to pay more than he did to get their hands on it, allowing him to profit.","그는 그 야구 카드가 수집가들에게 수요가 있고, 그들 중 누군가는 그것을 손에 넣기 위해 더 많은 돈을 기꺼이 지불할 것이라고, 그것이 그에게 이익을 얻도록 해줄 것이라고 생각했다."]],"w":"7번 문장에서 마이클은 수집가들 중 누군가가 자신보다 더 많은 돈을 기꺼이 낼 것이라고 믿었다고 해요. 맞는 내용이에요.","c":"T"},"h":"7b71f4aecd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Although he knew that the price was too high for the card, he eventually purchased it.)","ko":"비록 그는 그 카드에 대한 가격이 너무 높다는 것을 알고 있었지만, 그는 결국 그것을 구매했다.","opts":["즉시","우연히","결국","가끔"],"word":"eventually","r":{"a":"3) 결국","ev":"2번 문장","s":[[2,"Although he knew that the price was too high for the card, he eventually purchased it.","비록 그는 그 카드에 대한 가격이 너무 높다는 것을 알고 있었지만, 그는 결국 그것을 구매했다."]],"w":"가격이 너무 높다는 것을 알면서도 마지막에는 샀다는 뜻이에요. eventually = 결국이에요. '즉시'는 바로 한다는 뜻이라서 맞지 않아요.","c":3},"h":"743c4e75eb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But the market for the rare tulip bulbs collapsed abruptly in 1637.)","ko":"하지만 희귀한 튤립 구근 시장은 1637년에 갑자기 붕괴되었다.","opts":["갑자기","서서히","정기적으로","조심스럽게"],"word":"abruptly","r":{"a":"1) 갑자기","ev":"12번 문장","s":[[12,"But the market for the rare tulip bulbs collapsed abruptly in 1637, inflicting massive losses on those who were still seeking greater fools.","하지만 희귀한 튤립 구근 시장은 1637년에 갑자기 붕괴되어, 여전히 더 어리석은 이들을 찾고 있던 사람들에게 막대한 손실을 입혔다."]],"w":"시장이 11번까지의 비싼 값에서 한순간에 무너졌다는 흐름이에요. abruptly = 갑자기예요. '서서히'는 반대 뜻이에요.","c":1},"h":"6dfbc230a4"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis is a concept whereby an investor purchases an overvalued asset based on the belief that another person will buy it at a higher price.","ko":"밑줄 친 it이 가리키는 것은?","sko":"이것은 투자자가 다른 사람이 더 높은 가격에 그것을 살 것이라는 믿음을 바탕으로 과대평가된 자산을 구매하는 개념이다.","opts":["투자자","과대평가된 자산","믿음","개념"],"r":{"a":"2) 과대평가된 자산","ev":"4번 문장","s":[[4,"This is a concept whereby an investor purchases an overvalued asset based on the belief that another person will buy it at a higher price.","이것은 투자자가 다른 사람이 더 높은 가격에 그것을 살 것이라는 믿음을 바탕으로 과대평가된 자산을 구매하는 개념이다."]],"w":"다른 사람이 더 높은 가격에 사는 것은 투자자가 산 과대평가된 자산이에요. 투자자는 사는 사람이고, 믿음은 사는 이유예요.","c":2},"h":"33604078d8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While it might seem like a rational investment strategy, the greater fool theory can be extremely hazardous.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 합리적인 투자 전략처럼 보일 수 있는 한편, 더 큰 바보 이론은 극도로 위험할 수 있다.","opts":["더 큰 바보 이론은 합리적인 투자 전략이라서 매우 안전하다.","더 큰 바보 이론은 위험하지만 합리적인 투자 전략보다 낫다.","투자 전략이 합리적일 때에만 더 큰 바보 이론이 위험해진다.","더 큰 바보 이론은 합리적인 전략처럼 보일 수 있지만 매우 위험할 수 있다."]
