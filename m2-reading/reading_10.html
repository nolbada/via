o": "전치사 of 뒤에는 명사 success 사용"}]}, {"n": 10, "tag": null, "en": "Grab a puzzle and enjoy!", "ko": "퍼즐을 잡고 즐겨 보세요!", "ok": true, "foot": [], "fixes": []}, {"n": 11, "tag": null, "en": "Lastly, head at the kitchen for some baking. You can make your own cookies.", "ko": "마지막으로, 부엌으로 가서 베이킹을 하세요. 여러분은 자신만의 쿠키를 만들 수 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "at", "right": "to", "partial": false, "at": [2], "point": "기본전치사: '~로 향하다'는 head to 사용", "topic": "기본전치사", "memo": "'~로 향하다'는 head to 사용"}]}, {"n": 12, "tag": null, "en": "Follow the recipes, but don't be afraid to get creative.", "ko": "조리법을 따르되, 창의력을 발휘하는 것을 두려워하지 마세요.", "ok": true, "foot": [], "fixes": []}, {"n": 13, "tag": null, "en": "When you make cookies, try difference shapes like cats, flowers, or even your favorite characters. Just express you!", "ko": "여러분이 쿠키를 만들 때, 고양이, 꽃, 심지어 여러분이 매우 좋아하는 캐릭터와 같은 다양한 모양을 시도해 보세요. 그저 여러분 자신을 표현해 보세요!", "ok": false, "foot": [], "fixes": [{"wrong": "difference", "right": "different", "partial": false, "at": [5], "point": "품사: 명사 shapes를 꾸미는 말은 형용사 different 사용", "topic": "품사", "memo": "명사 shapes를 꾸미는 말은 형용사 different 사용"}, {"wrong": "you", "right": "yourself", "partial": false, "at": [17], "point": "재귀대명사: 주어와 목적어가 같으면 yourself 사용", "topic": "재귀대명사", "memo": "주어와 목적어가 같으면 yourself 사용"}]}, {"n": 14, "tag": null, "en": "And here is the highlight of baking. It give you the joy of sharing.", "ko": "그리고 여기에 베이킹의 하이라이트가 있습니다. 그것은 여러분에게 나눔의 즐거움을 줍니다.", "ok": false, "foot": [], "fixes": [{"wrong": "give", "right": "gives", "partial": false, "at": [8], "point": "3인칭 단수 현재형: 주어 It에는 gives 사용", "topic": "3인칭 단수 현재형", "memo": "주어 It에는 gives 사용"}]}, {"n": 15, "tag": null, "en": "Bake something special for your friends or family. They will loves your cookies!", "ko": "여러분의 친구들이나 가족을 위해 특별한 것을 구워 보세요. 그들은 여러분의 쿠키를 아주 좋아할 거예요!", "ok": false, "foot": [], "fixes": [{"wrong": "loves", "right": "love", "partial": false, "at": [10], "point": "조동사 will: will 뒤는 동사원형: love", "topic": "
