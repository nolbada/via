"h":"ef7079ab8f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So don’t ignore those leftovers in the refrigerator.)","ko":"따라서 냉장고 속의 남은 음식들을 무시하지 마라.","opts":["먹다","데우다","무시하다","섞다"],"word":"ignore","r":{"a":"3) 무시하다","ev":"12~13번 문장","s":[[12,"So don’t ignore those leftovers in the refrigerator.","따라서 냉장고 속의 남은 음식들을 무시하지 마라."],[13,"They might make an excellent meal.","그것들은 훌륭한 식사가 될 수도 있다."]],"w":"13번에서 남은 음식이 훌륭한 식사가 될 수도 있다고 하니, 그냥 지나치지 말라는 뜻이에요. don’t ignore = 무시하지 마라예요.","c":3},"h":"75a8a8e816"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis increases the sweetness of the food.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 음식의 단맛을 증가시킨다.","opts":["지방과 양념이 섞이는 것","당이 분해되어 음식 전체에 퍼지는 것","음식이 냉장고에 남는 것","후각이 깨어나는 것"],"r":{"a":"2) 당이 분해되어 음식 전체에 퍼지는 것","ev":"9~10번 문장","s":[[9,"Additionally, sugar in the food breaks down and spreads throughout the dish.","게다가, 음식에 들어 있는 당이 분해되어 요리 전체에 퍼진다."],[10,"This increases the sweetness of the food.","이는 음식의 단맛을 증가시킨다."]],"w":"바로 앞 9번에서 음식 속 당이 분해되어 요리 전체에 퍼진다고 했어요. 그것이 단맛을 늘려요.","c":2},"h":"b3cf9cf109"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is because their taste continues to change after they are cooked.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그것의 맛이 요리가 된 이후 계속해서 변하기 때문이다.","opts":["이것은 요리하기 전에 맛이 변하기 때문이다.","이것은 음식이 요리된 뒤에는 맛이 변하지 않기 때문이다.","이것은 맛이 변하면 음식을 요리하기 때문이다.","이것은 음식이 요리된 뒤에도 맛이 계속 변하기 때문이다."],"r":{"a":"4) 이것은 음식이 요리된 뒤에도 맛이 계속 변하기 때문이다.","ev":"3번 문장","s":[[3,"This is because their taste continues to change after they are cooked.","이것은 그것의 맛이 요리가 된 이후 계속해서 변하기 때문이다."]],"w":"after they are cooked는 ‘요리가 된 뒤’이고 continues to change는 ‘계속 변한다’예요. 요리 전이나 변하지 않는다는 말은 틀려요.","c":4},"h":"2e695e883a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["남은 음식은 다음 날에는 언제나 맛이 없어진다.","당이 퍼지면 음식의 단맛이 줄어든다.","수프, 스튜, 소스는 지방이 많은 음식에 속한다.","양념은 당과 섞여서 냄새가 난다."],"opts":["Leftovers always taste worse the next day.","The sweetness of food decreases when sugar spreads.","Soups, stews, and sauces are examples of fatty foods.","Spices mix with sugar to make a scent."],"r":{"a":"3) Soups, stews, and sauces are examples of fatty foods.","ev":"2번, 4~6번, 10번 문장","s":[[2,"They may not look fresh, but certain dishes taste even better the next day.","그것은 신선해 보이지 않을 수도 있지만, 어떤 음식은 다음 날 훨씬 더 맛이 있다."],[4,"This is especially true with fatty foods, including soups, stews, and sauces.","이것은 특히 수프, 스튜, 소스를 포함한 지방이 많은 음식에 적용된다."],[5,"The spices in the dish mix with the fats.","음식에 든 양념은 지방질과 섞인다."],[6,"This gives the food a very nice scent.","이는 그 음식에 매우 좋은 냄새가 나게 한다."],[10,"This increases the sweetness of the food.","이는 음식의 단맛을 증가시킨다."]],"w":"4번에서 지방이 많은 음식에 수프, 스튜, 소스가 포함된다고 해요. 어떤 음식은 다음 날 더 맛있고(2번), 당이 퍼지면 단맛이 늘며(10번), 냄새는 양념과 지방이 섞여서 나요(5~6번).","c":3},"h":"5bd084d52f"},{"n":9,"t":"sum","q":"In leftovers, spices mix with (A), so the food smells good and tastes (B).","ko":"남은 음식에서는 양념이 (A)과 섞여서 음식이 좋은 냄새가 나고 맛이 (B).","oko":["(A) 지방 / (B) 더 약하다","(A) 당 / (B) 더 강하다","(A) 물 / (B) 더 약하다","(A) 당 / (B) 더 약하다","(A) 지방 / (B) 더 강하다"],"opts":["(A) fats / (B) weaker","(A) sugar / (B) stronger","(A) water / (B) weaker","(A) sugar / (B) weaker","(A) fats / (B) stronger"],"r":{"a":"5) (A) fats / (B) stronger","ev":"5~6번, 8번 문장","s":[[5,"The spices in the dish mix with the fats.","음식에 든 양념은 지방질과 섞인다."],[6,"This gives the food a very nice scent.","이는 그 음식에 매우 좋은 냄새가 나게 한다."],[8,"As a result, the food has a much stronger taste.","그 결과, 그 음식은 훨씬 더 강력한 맛을 지닌다."]],"w":"5번에서 양념은 지방(fats)과 섞이고, 6번에서 좋은 냄새가 나며, 8번에서 맛이 훨씬 더 강해져요(stronger).","c":5},"h":"d291de521c"},{"n":10,"t":"fill","q":"Sugar in the food breaks down and spreads, so the [A] increases and the [B] decreases.","ko":"음식 속 당이 분해되어 퍼져서 [A]은 증가하고 [B]은 줄어든다.","bank":["sweetness","bitterness","refrigerator","meal","fats","spices"],"bko":{"sweetness":"단맛","bitterness":"쓴맛","meal":"식사","fats":"지방","spices":"양념","refrigerator":"냉장고"},"r":{"a":"[A] sweetness, [B] bitterness","ev":"9~11번 문장","s":[[9,"Additionally, sugar in the food breaks down and spreads throughout the dish.","게다가, 음식에 들어 있는 당이 분해되어 요리 전체에 퍼진다."],[10,"This increases the sweetness of the food.","이는 음식의 단맛을 증가시킨다."],[11,"It also decreases its bitterness.","그것은 또한 쓴맛을 줄인다."]],"w":"9~11번에서 당이 분해되어 퍼지면 단맛(sweetness)이 늘고 쓴맛(bitterness)이 줄어요. fats(지방)나 spices(양념)는 5~6번에서 냄새와 관련된 말이라 당 이야기와 맞지 않아요.","c":null},"h":"ca5d75a4ff"}]},{"u":6,"id":"nl1-06-4","no":4,"ko":"얼음성이 실제로 존재했다고?","items":[{"n":1,"t":"tf","q":"Anna Ivanovna was the empress of Russia in the 1730s.","ko":"Anna Ivanovna는 1730년대 러시아의 여황제였다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Anna Ivanovna was the empress of Russia in the 1730s.","Anna Ivanovna(안나 이바노브나)는 1730년대 러시아의 여황제였다."]],"w":"1번에 Anna Ivanovna was the empress of Russia in the 1730s가 나와요.","c":"T"},"h":"7b47bb6203"},{"n":2,"t":"tf","q":"Anna Ivanovna was very interested in politics.","ko":"Anna Ivanovna는 정치에 매우 관심이 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"She wasn’t interested in politics.","그녀는 정치에 관심이 없었다."],[3,"She cared only about power.","그녀는 오직 권력에만 신경을 썼다."]],"w":"2번에서 She wasn’t interested in politics라고 해요. 3번에서 오직 권력에만 신경을 썼어요.","c":"F"},"h":"276a561361"},{"n":3,"t":"tf","q":"The empress locked the couple in the ice palace for a whole day.","ko":"여황제는 그 부부를 하루 종일 얼음 궁전에 가두었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Moreover, she locked the couple in the ice palace for a whole day.","게다가, 그녀는 그 부부를 하루 종일 얼음 궁전에 가두었다."]],"w":"12번에 she locked the couple in the ice palace for a whole day가 나와요.","c":"T"},"h":"cd34db79fd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day, she ordered the construction of an ice palace.)","ko":"어느 날, 그녀는 얼음 궁전의 건설을 명령했다.","opts":["거절했다","구경했다","명령했다","팔았다"],"word":"ordered","r":{"a":"3) 명령했다","ev":"4~5번 문장","s":[[4,"One day, she ordered the construction of an ice palace.","어느 날, 그녀는 얼음 궁전의 건설을 명령했다."],[5,"It was built to celebrate Russia’s victory over the Ottoman Empire.","그것은 오스만 제국을 상대로 한 러시아의 승리를 기념하기 위해 지어졌다."]],"w":"여황제가 건설을 시킨 장면이에요. order = 명령하다예요. 5번 It was built로 이어져요.","c":3},"h":"b8692ae6d3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The ice palace soon melted, and Anna died the next year.)","ko":"그 얼음 궁전은 머지않아 녹았고, 다음 해에 Anna는 죽었다.","opts":["얼었다","녹았다","무너졌다","커졌다"],"word":"melted","r":{"a":"2) 녹았다","ev":"14번 문장","s":[[14,"The ice palace soon melted, and Anna died the next year.","그 얼음 궁전은 머지않아 녹았고, 다음 해에 Anna는 죽었다."]],"w":"얼음으로 만든 궁전이 시간이 지나 어떻게 되는지를 묻는 거예요. 얼음이 열을 받으면 녹아요. melt = 녹다예요.","c":2},"h":"df0780f5de"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis made her angry.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 그녀를 화나게 만들었다.","opts":["왕자가 이탈리아 여성과 결혼하고 가톨릭 신자가 된 일","왕자가 여황제의 하녀와 결혼한 일","러시아가 오스만 제국에 승리한 일","얼음 궁전이 지어진 일"],"r":{"a":"1) 왕자가 이탈리아 여성과 결혼하고 가톨릭 신자가 된 일","ev":"8~9번 문장","s":[[8,"He had married a Catholic woman from Italy and then became Catholic himself.","그는 이탈리아 출신의 가톨릭 신자 여성과 결혼했고 이후 자신도 가톨릭 신자가 되었다."],[9,"This made her angry.","이것이 그녀를 화나게 만들었다."]],"w":"바로 앞 8번에서 왕자가 가톨릭 여성과 결혼하고 자신도 가톨릭 신자가 되었다고 했어요. 하녀와의 결혼은 11번에서 Anna가 시킨 일이에요.","c":1},"h":"20e1df8400"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But it really had a different purpose.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그것은 실제로 다른 목적이 있었다.","opts":["그러나 그것은 사실 아무 목적이 없었다.","그러나 그것은 사실 같은 목적을 가졌다.","그러나 그것은 사실 여러 목적이 있었다.","그러나 그것은 사실 겉으로 내세운 것과 다른 목적이 있었다."],"r":{"a":"4) 그러나 그것은 사실 겉으로 내세운 것과 다른 목적이 있었다.","ev":"5~7번 문장","s":[[5,"It was built to celebrate Russia’s victory over the Ottoman Empire.","그것은 오스만 제국을 상대로 한 러시아의 승리를 기념하기 위해 지어졌다."],[6,"But it really had a different purpose.","하지만 그것은 실제로 다른 목적이 있었다."],[7,"She wanted to punish a local prince.","그녀는 한 지역의 왕자를 벌하고 싶어 했다."]],"w":"different purpose는 ‘다른 목적’이에요. 5번의 겉목적(승리 기념)과 달리 7번에서 왕자를 벌주려는 실제 목적이 나와요.","c":4},"h":"e1d85d7f33"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["부부는 얼음 궁전에서 죽었다.","부부는 살아남았지만 둘 다 동상으로 고통받았다.","왕자의 첫 부인은 러시아 하녀였다.","얼음 궁전은 오스만 제국을 벌하려고 지어졌다."],"opts":["The couple died in the ice palace.","The couple survived, but they both suffered from frostbite.","The prince’s first wife was a Russian maid.","The ice palace was built to punish the Ottoman Empire."],"r":{"a":"2) The couple survived, but they both suffered from frostbite.","ev":"5번, 8번, 13번 문장","s":[[5,"It was built to celebrate Russia’s victory over the Ottoman Empire.","그것은 오스만 제국을 상대로 한 러시아의 승리를 기념하기 위해 지어졌다."],[8,"He had married a Catholic woman from Italy and then became Catholic himself.","그는 이탈리아 출신의 가톨릭 신자 여성과 결혼했고 이후 자신도 가톨릭 신자가 되었다."],[13,"Fortunately, they survived, but they both suffered from frostbite.","다행히도 그들은 살아남았지만, 둘 다 동상으로 고통받았다."]],"w":"13번에 they survived, but they both suffered from frostbite가 나와요. 왕자의 첫 부인은 이탈리아 출신 가톨릭 여성이고(8번), 얼음 궁전은 승리를 기념하려고 지어졌어요(5번).","c":2},"h":"a4097c4187"},{"n":9,"t":"sum","q":"Anna was angry at a local prince, so she forced him to marry a (A) and locked the couple in the ice palace for a (B).","ko":"Anna는 지역 왕자에게 화가 나서 그가 (A)와 결혼하도록 강요했고, 그 부부를 얼음 궁전에 (B) 동안 가두었다.","oko":["(A) 공주 / (B) 하루 종일","(A) 하녀 / (B) 일주일","(A) 하녀 / (B) 하루 종일","(A) 여왕 / (B) 한 달","(A) 선생님 / (B) 한 시간"],"opts":["(A) princess / (B) whole day","(A) maid / (B) week","(A) maid / (B) whole day","(A) queen / (B) month","(A) teacher / (B) hour"],"r":{"a":"3) (A) maid / (B) whole day","ev":"11~12번 문장","s":[[11,"After his wife died, the empress forced him to marry one of her maids.","그의 부인이 죽은 후에 여황제는 그가 자신의 하녀 중 한 명과 결혼할 것을 강요했다."],[12,"Moreover, she locked the couple in the ice palace for a whole day.","게다가, 그녀는 그 부부를 하루 종일 얼음 궁전에 가두었다."]],"w":"11번에서 왕자는 Anna의 하녀(maid) 중 한 명과 결혼하도록 강요받았고, 12번에서 하루 종일(a whole day) 갇혔어요.","c":3},"h":"a32a4af6ee"},{"n":10,"t":"fill","q":"The couple [A], but they both suffered from [B].","ko":"그 부부는 [A]했지만, 둘 다 [B]으로 고통받았다.","bank":["survived","frostbite","melted","punished","politics","victory"],"bko":{"survived":"살아남았다","frostbite":"동상","punished":"벌주었다","politics":"정치","victory":"승리","melted":"녹았다"},"r":{"a":"[A] survived, [B] frostbite","ev":"13번 문장","s":[[13,"Fortunately, they survived, but they both suffered from frostbite.","다행히도 그들은 살아남았지만, 둘 다 동상으로 고통받았다."]],"w":"13번 they survived, but they both suffered from frostbite에서 가져왔어요. punished(punish = 벌주다)는 부부가 아니라 Anna가 한 일이라 맞지 않아요.","c":null},"h":"7c28c1b355"}]},{"u":7,"id":"nl1-07-1","no":1,"ko":"뽁뽁이에도 출생의 비밀이?!","items":[{"n":1,"t":"tf","q":"In 1957, two engineers wanted to make plastic wallpaper.","ko":"1957년에 두 기술자는 플라스틱 벽지를 만들고 싶었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In 1957, two engineers wanted to make three-dimensional plastic wallpaper.","1957년에 두 명의 기술자는 입체적인 플라스틱 벽지를 만들고 싶었다."]],"w":"5번 문장에 1957년 두 기술자가 입체적인 플라스틱 벽지를 만들고 싶었다고 나와요. 일치해요.","c":"T"},"h":"55e8f0e78f"},{"n":2,"t":"tf","q":"The engineers' wallpaper was a big success.","ko":"기술자들의 벽지는 큰 성공이었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Unfortunately, it was a big failure.","불행히도 그것은 대실패였다."]],"w":"6번 문장에서 벽지는 it was a big failure, 즉 대실패였다고 해요. 성공이라는 말은 반대예요.","c":"F"},"h":"532a68d700"},{"n":3,"t":"tf","q":"One engineer thought the air bubbles in the wallpaper could protect fragile items.","ko":"한 기술자는 벽지 속 기포가 깨지기 쉬운 물품을 보호할 수 있다고 생각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"He thought that people could use the air bubbles in the wallpaper to protect fragile items!","그는 사람들이 벽지에 들어 있는 기포를 깨지기 쉬운 물품을 보호하는 데 사용할 수 있다고 생각했다!"]],"w":"8번 문장이 그대로 이 내용이에요. 기포로 깨지기 쉬운 물품을 보호하자는 생각이에요.","c":"T"},"h":"a65d4d9d9d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...use the air bubbles in the wallpaper to protect fragile items!)","ko":"...벽지 속 기포를 사용해서 fragile한 물품을 보호하는 데...","opts":["단단한","값비싼","깨지기 쉬운","오래된"],"word":"fragile","r":{"a":"3) 깨지기 쉬운","ev":"7, 8번 문장","s":[[7,"Later, one of the engineers had a better idea.","나중에 그 기술자들 중 한 명이 더 나은 생각을 떠올렸다."],[8,"He thought that people could use the air bubbles in the wallpaper to protect fragile items!","그는 사람들이 벽지에 들어 있는 기포를 깨지기 쉬운 물품을 보호하는 데 사용할 수 있다고 생각했다!"]],"w":"7번에서 한 기술자가 더 나은 생각을 떠올리고, 8번에서 그 생각이 기포로 보호하는 것이에요. 보호해야 하는 물품이니 fragile = 깨지기 쉬운이에요.","c":3},"h":"6513f730f9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...but this was not its original use.)","ko":"...하지만 이것이 그것의 original 용도는 아니었다.","opts":["원래의","새로운","마지막의","유일한"],"word":"original","r":{"a":"1) 원래의","ev":"4, 5번 문장","s":[[4,"Bubble wrap is known for keeping items safe, but this was not its original use.","뽁뽁이는 물품을 안전하게 유지하는 것으로 알려져 있지만, 이것이 원래의 용도는 아니었다."],[5,"In 1957, two engineers wanted to make three-dimensional plastic wallpaper.","1957년에 두 명의 기술자는 입체적인 플라스틱 벽지를 만들고 싶었다."]],"w":"4번에서 뽁뽁이가 물품을 지키는 것으로 알려져 있지만 이것은 original use가 아니라고 하고, 5번에서 원래는 벽지를 만들려 했다고 해요. original = 원래의.","c":1},"h":"5e798783eb"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe thought that people could use the air bubbles in the wallpaper to protect fragile items!","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 사람들이 벽지에 들어 있는 기포를 깨지기 쉬운 물품을 보호하는 데 사용할 수 있다고 생각했다!","opts":["우편을 보내려는 사람","벽지를 만들던 두 기술자 중 한 명","뽁뽁이를 사는 손님","포장재 회사의 직원"],"r":{"a":"2) 벽지를 만들던 두 기술자 중 한 명","ev":"7, 8번 문장","s":[[7,"Later, one of the engineers had a better idea.","나중에 그 기술자들 중 한 명이 더 나은 생각을 떠올렸다."],[8,"He thought that people could use the air bubbles in the wallpaper to protect fragile items!","그는 사람들이 벽지에 들어 있는 기포를 깨지기 쉬운 물품을 보호하는 데 사용할 수 있다고 생각했다!"]],"w":"7번 문장에서 two engineers 중 one of the engineers가 더 나은 생각을 떠올렸다고 하고, 8번의 He가 그 사람이에요.","c":2},"h":"94e4122000"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Bubble wrap is known for keeping items safe, but this was not its original use.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"뽁뽁이는 물품을 안전하게 유지하는 것으로 알려져 있지만, 이것이 원래의 용도는 아니었다.","opts":["뽁뽁이는 처음부터 물품을 안전하게 지키려고 만들어졌다.","뽁뽁이는 물품을 안전하게 지키지 못하는 것으로 알려져 있다.","뽁뽁이는 물품을 지키는 일에는 전혀 쓰이지 않는다.","뽁뽁이는 물품을 지키는 것으로 유명하지만, 처음 만든 목적은 그게 아니었다."],"r":{"a":"4) 뽁뽁이는 물품을 지키는 것으로 유명하지만, 처음 만든 목적은 그게 아니었다.","ev":"4번 문장","s":[[4,"Bubble wrap is known for keeping items safe, but this was not its original use.","뽁뽁이는 물품을 안전하게 유지하는 것으로 알려져 있지만, 이것이 원래의 용도는 아니었다."]],"w":"but 앞은 '알려진 용도', 뒤는 '원래 용도는 아니었다'예요. 그래서 유명한 용도와 처음 목적이 다르다는 ④가 알맞아요.","c":4},"h":"761fa45667"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["두 기술자는 1957년에 포장재 회사를 시작했다.","두 기술자의 벽지는 큰 성공을 거두었다.","한 기술자가 실패 뒤에 더 나은 생각을 떠올렸다.","그들의 회사는 지금은 뽁뽁이를 만들지 않는다."],"opts":["The engineers started a packaging company in 1957.","The engineers' wallpaper was a big success.","One engineer had a better idea after the failure.","Their company does not make bubble wrap now."],"r":{"a":"3) One engineer had a better idea after the failure.","ev":"6, 7, 9, 10번 문장","s":[[6,"Unfortunately, it was a big failure.","불행히도 그것은 대실패였다."],[7,"Later, one of the engineers had a better idea.","나중에 그 기술자들 중 한 명이 더 나은 생각을 떠올렸다."],[9,"In 1960, the two engineers started a packaging company.","1960년에 그 두 기술자들은 포장재 회사를 운영하기 시작했다."],[10,"Their company still makes bubble wrap today.","그들의 회사는 오늘날에도 여전히 뽁뽁이를 만든다."]],"w":"포장재 회사는 1960년에 시작했고(9번), 벽지는 실패했고(6번), 회사는 지금도 뽁뽁이를 만들어요(10번). 실패 뒤 한 기술자가 더 나은 생각을 한 것(7번)만 맞아요.","c":3},"h":"b9a2dd3b3d"},{"n":9,"t":"sum","q":"The engineers first wanted to make plastic (A), but it was a failure. Later, they thought the air bubbles could (B) fragile items.","ko":"두 기술자는 처음에 플라스틱 (A)를 만들려 했지만 실패했다. 나중에 그들은 기포가 깨지기 쉬운 물품을 (B)할 수 있다고 생각했다.","oko":["(A) 포장재 / (B) 보호","(A) 벽지 / (B) 깨뜨리","(A) 종이 / (B) 판매","(A) 벽지 / (B) 보호","(A) 포장재 / (B) 깨뜨리"],"opts":["(A) packaging / (B) protect","(A) wallpaper / (B) break","(A) paper / (B) sell","(A) wallpaper / (B) protect","(A) packaging / (B) break"],"r":{"a":"4) (A) wallpaper / (B) protect","ev":"5, 6, 8번 문장","s":[[5,"In 1957, two engineers wanted to make three-dimensional plastic wallpaper.","1957년에 두 명의 기술자는 입체적인 플라스틱 벽지를 만들고 싶었다."],[6,"Unfortunately, it was a big failure.","불행히도 그것은 대실패였다."],[8,"He thought that people could use the air bubbles in the wallpaper to protect fragile items!","그는 사람들이 벽지에 들어 있는 기포를 깨지기 쉬운 물품을 보호하는 데 사용할 수 있다고 생각했다!"]],"w":"5번에서 만들려던 것은 벽지(wallpaper)이고 6번에서 실패했어요. 8번에서 기포로 물품을 보호(protect)하자는 생각을 해요.","c":4},"h":"223cf6df97"},{"n":10,"t":"fill","q":"In 1960, the two engineers [A] a packaging company, and their company still [B] bubble wrap today.","ko":"1960년에 두 기술자는 포장재 회사를 [A]했고, 그들의 회사는 오늘날에도 여전히 뽁뽁이를 [B].","bank":["started","makes","failed","wrapped","protects","broke"],"bko":{"started":"시작했다","makes":"만든다","failed":"실패했다","wrapped":"쌌다","broke":"깨졌다","protects":"보호한다"},"r":{"a":"[A] started, [B] makes","ev":"9, 10번 문장","s":[[9,"In 1960, the two engineers started a packaging company.","1960년에 그 두 기술자들은 포장재 회사를 운영하기 시작했다."],[10,"Their company still makes bubble wrap today.","그들의 회사는 오늘날에도 여전히 뽁뽁이를 만든다."]],"w":"9번 started a packaging company, 10번 still makes bubble wrap에서 가져왔어요. failed·broke는 벽지 이야기(6번)나 깨지는 물건 이야기와 이어지는 말이고, wrapped·protects는 빈칸에 넣으면 뜻이 맞지 않아요.","c":null},"h":"d2b0d40f25"}]},{"u":7,"id":"nl1-07-2","no":2,"ko":"향초 켤 때 꼭 알아둬~","items":[{"n":1,"t":"tf","q":"Scented candles create soft light and good smells.","ko":"향초는 부드러운 빛과 좋은 향기를 낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They are very relaxing, and they create soft light and good smells.","향초는 마음을 느긋하게 해 주고, 부드러운 빛과 좋은 향기를 낸다."]],"w":"2번 문장에서 향초는 soft light and good smells를 만든다고 해요. 일치해요.","c":"T"},"h":"1dd3ef1e99"},{"n":2,"t":"tf","q":"The chemicals in scented candles never react with gases in the air.","ko":"향초 속 화학 물질은 공기 중의 기체와 절대 반응하지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Some of these chemicals react with gases in the air.","이 화학 물질들의 일부는 공기 중의 기체와 반응한다."]],"w":"5번 문장에서 일부 화학 물질이 공기 중의 기체와 반응한다(react)고 해요. never는 반대예요.","c":"F"},"h":"3674d8739c"},{"n":3,"t":"tf","q":"Formaldehyde can seriously harm your health.","ko":"포름알데히드는 건강을 심각하게 해칠 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Formaldehyde causes cancer and can seriously harm your health.","포름알데히드는 암을 유발하고 당신의 건강을 심각하게 해칠 수 있다."]],"w":"9번 문장에서 포름알데히드는 암을 일으키고 건강을 심각하게 해칠 수 있다고 해요.","c":"T"},"h":"20cf755186"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some of these chemicals react with gases in the air.)","ko":"이 화학 물질들의 일부는 공기 중의 기체와 react한다.","opts":["사라진다","녹는다","팔린다","반응한다"],"word":"react","r":{"a":"4) 반응한다","ev":"5, 6번 문장","s":[[5,"Some of these chemicals react with gases in the air.","이 화학 물질들의 일부는 공기 중의 기체와 반응한다."],[6,"This makes the candles dangerous.","이것이 향초를 위험하게 만든다."]],"w":"5번 다음 6번에서 This makes the candles dangerous라고 해요. 화학 물질이 기체와 만나 변하면서 위험해진다는 뜻이니 react = 반응하다예요.","c":4},"h":"023473bd12"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Formaldehyde causes cancer and can seriously harm your health.)","ko":"포름알데히드는 암을 유발하고 건강을 심각하게 harm할 수 있다.","opts":["해를 끼치다","좋게 하다","바꾸다","알려 주다"],"word":"harm","r":{"a":"1) 해를 끼치다","ev":"9번 문장","s":[[9,"Formaldehyde causes cancer and can seriously harm your health.","포름알데히드는 암을 유발하고 당신의 건강을 심각하게 해칠 수 있다."]],"w":"포름알데히드가 암을 일으킨다고 한 문장이에요. 건강에 나쁜 일이니 harm = 해를 끼치다예요.","c":1},"h":"7a668d320a"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBut when it mixes with other gases, it makes formaldehyde.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그러나 그것이 다른 기체들과 섞이면 포름알데히드를 만든다.","opts":["레몬","리모넨이라는 화학 물질","향초","공기 중의 기체"],"r":{"a":"2) 리모넨이라는 화학 물질","ev":"7, 8번 문장","s":[[7,"For example, a chemical called limonene smells like lemons.","예를 들어, 리모넨이라고 불리는 화학 물질은 레몬 같은 향기가 난다."],[8,"But when it mixes with other gases, it makes formaldehyde.","그러나 그것이 다른 기체들과 섞이면 포름알데히드를 만든다."]],"w":"7번에서 a chemical called limonene이 나오고, 8번에서 But when it mixes ...로 이어져요. it은 리모넨이에요. 섞이는 상대는 other gases예요.","c":2},"h":"d6a7b49f40"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But few people know that they can be dangerous.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 그것들이 위험할 수 있다는 것을 아는 사람은 거의 없다.","opts":["향초가 위험하다는 것을 모르는 사람은 거의 없다.","향초가 위험할 수 있다는 것을 아는 사람은 거의 없다.","향초가 위험하다는 것을 아는 사람은 아주 많다.","향초는 위험하지 않다고 아는 사람이 거의 없다."],"r":{"a":"2) 향초가 위험할 수 있다는 것을 아는 사람은 거의 없다.","ev":"3번 문장","s":[[3,"But few people know that they can be dangerous.","그러나 그것들이 위험할 수 있다는 것을 아는 사람은 거의 없다."]],"w":"few people know는 '아는 사람이 거의 없다'예요. 그래서 위험할 수 있다는 사실을 아는 사람이 거의 없다는 ②예요. ①은 정반대로 읽은 것이에요.","c":2},"h":"6bcba5611a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["향초에 쓰이는 향료에는 화학 물질이 들어 있지 않다.","리모넨은 포름알데히드 같은 냄새가 난다.","문과 창문이 모두 닫혀 있을 때는 향초를 켜지 말아야 한다.","포름알데히드는 건강에 도움이 된다."],"opts":["The perfumes in these candles contain no chemicals.","Limonene smells like formaldehyde.","You should not light scented candles when all the doors and windows are closed.","Formaldehyde is good for your health."],"r":{"a":"3) You should not light scented candles when all the doors and windows are closed.","ev":"4, 7, 9, 10번 문장","s":[[4,"The perfumes used in these candles contain chemicals.","이러한 향초에 사용되는 향료에는 화학 물질들이 들어 있다."],[7,"For example, a chemical called limonene smells like lemons.","예를 들어, 리모넨이라고 불리는 화학 물질은 레몬 같은 향기가 난다."],[9,"Formaldehyde causes cancer and can seriously harm your health.","포름알데히드는 암을 유발하고 당신의 건강을 심각하게 해칠 수 있다."],[10,"To stay safe, never light scented candles when all the doors and windows are closed.","안전하게 지내기 위해서 문과 창문들이 모두 닫혀 있을 때는 절대로 향초를 켜지 마라."]],"w":"10번에서 닫힌 곳에서는 켜지 말라고 해요. 향료에는 화학 물질이 있고(4번), 리모넨은 레몬 향이며(7번), 포름알데히드는 건강을 해쳐요(9번).","c":3},"h":"632ad5b423"},{"n":9,"t":"sum","q":"Some chemicals in scented candles (A) with gases in the air and make formaldehyde, which can (B) your health.","ko":"향초 속 일부 화학 물질은 공기 중의 기체와 (A)해서 포름알데히드를 만들고, 이것은 건강을 (B)할 수 있다.","oko":["(A) 냄새가 난다 / (B) 돕는다","(A) 반응한다 / (B) 좋아지게 한다","(A) 녹는다 / (B) 해친다","(A) 냄새가 난다 / (B) 해친다","(A) 반응한다 / (B) 해친다"],"opts":["(A) smell / (B) help","(A) react / (B) improve","(A) melt / (B) harm","(A) smell / (B) harm","(A) react / (B) harm"],"r":{"a":"5) (A) react / (B) harm","ev":"5, 8, 9번 문장","s":[[5,"Some of these chemicals react with gases in the air.","이 화학 물질들의 일부는 공기 중의 기체와 반응한다."],[8,"But when it mixes with other gases, it makes formaldehyde.","그러나 그것이 다른 기체들과 섞이면 포름알데히드를 만든다."],[9,"Formaldehyde causes cancer and can seriously harm your health.","포름알데히드는 암을 유발하고 당신의 건강을 심각하게 해칠 수 있다."]],"w":"5번에서 화학 물질이 기체와 반응하고(react), 8번에서 포름알데히드가 만들어지며, 9번에서 건강을 해쳐요(harm).","c":5},"h":"c693f76acc"},{"n":10,"t":"fill","q":"To stay safe, never [A] scented candles when all the doors and windows are closed. Always [B] a window before you light them!","ko":"안전하게 지내려면 문과 창문이 모두 닫혀 있을 때 향초를 절대 [A]하지 마라. 켜기 전에 항상 창문을 [B]라!","bank":["light","open","contain","react","cause","relax"],"bko":{"light":"불을 붙이다","open":"열다","contain":"들어 있다","react":"반응하다","cause":"일으키다","relax":"느긋해지다"},"r":{"a":"[A] light, [B] open","ev":"10, 11번 문장","s":[[10,"To stay safe, never light scented candles when all the doors and windows are closed.","안전하게 지내기 위해서 문과 창문들이 모두 닫혀 있을 때는 절대로 향초를 켜지 마라."],[11,"Always open a window before you light them!","향초에 불을 붙이기 전에 항상 창문을 열어라!"]],"w":"10번 never light scented candles, 11번 Always open a window에서 가져왔어요. contain·react·cause는 4~9번에서 화학 물질을 설명할 때 나온 말이고, relax는 2번에서 향초의 좋은 점을 말할 때 나온 말이라 이 빈칸에는 알맞지 않아요.","c":null},"h":"ec55d0f6c2"}]},{"u":7,"id":"nl1-07-3","no":3,"ko":"얼음으로 이것도 가능해?","items":[{"n":1,"t":"tf","q":"Elsa made an ice castle with her magic.","ko":"엘사는 마법으로 얼음성을 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Elsa made an ice castle with her magic!","Elsa(엘사)는 그녀의 마법으로 얼음성을 만들었다!"]],"w":"2번 문장 그대로예요. 영화 속 엘사가 마법으로 얼음성을 만들었어요.","c":"T"},"h":"4cdacee7a5"},{"n":2,"t":"tf","q":"Icehotel 365 is open only in the winter.","ko":"Icehotel 365는 겨울에만 연다.","r":{"a":"F (본문과 다른 내용)","ev":"5, 6번 문장","s":[[5,"Surprisingly, it isn’t just open in the winter.","놀랍게도, 이 호텔은 단지 겨울에만 개장하는 것이 아니다."],[6,"It’s open all year, even in the summer.","그것은 일 년 내내, 심지어 여름에도 연다."]],"w":"5번에서 겨울에만 여는 것이 아니라고 하고, 6번에서 일 년 내내 연다고 해요. only는 틀려요.","c":"F"},"h":"a238b09e45"},{"n":3,"t":"tf","q":"At the hotel, we can climb an ice staircase.","ko":"그 호텔에서 우리는 얼음 계단을 오를 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"At the hotel, we can enjoy ice art, climb an ice staircase, and even sleep!","그 호텔에서 우리는 얼음 예술을 즐기고, 얼음 계단을 오르고, 심지어 잠을 잘 수도 있다!"]],"w":"4번 문장에 climb an ice staircase가 있어요. 일치해요.","c":"T"},"h":"14cc5a1b12"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Solar power prevents the ice from melting.)","ko":"태양열 발전이 얼음이 녹는 것을 prevent한다.","opts":["돕는다","막는다","만든다","바꾼다"],"word":"prevents","r":{"a":"2) 막는다","ev":"6, 7번 문장","s":[[6,"It’s open all year, even in the summer.","그것은 일 년 내내, 심지어 여름에도 연다."],[7,"Solar power prevents the ice from melting.","태양열 발전이 얼음이 녹는 것을 막는다."]],"w":"여름에도 연다(6번)는 말 다음 문장이에요. 얼음이 녹으면 곤란하니 녹는 것을 막는다는 뜻이고, prevent = 막다예요.","c":2},"h":"6a9fe336de"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Many of the rooms are built by famous artists and architects.)","ko":"많은 객실이 유명한 예술가와 architect들에 의해 만들어진다.","opts":["요리사","화가","직원","건축가"],"word":"architects","r":{"a":"4) 건축가","ev":"10번 문장","s":[[10,"Many of the rooms are built by famous artists and architects.","많은 객실이 유명한 예술가 및 건축가들에 의해 만들어진다."]],"w":"객실(rooms)을 짓는 사람이에요. 예술가와 함께 객실을 만든다고 했으니 architect = 건축가예요.","c":4},"h":"d022c05151"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nAt Icehotel 365 in Sweden, we can experience one in real life!","ko":"밑줄 친 one이 가리키는 것은?","sko":"스웨덴에 있는 Icehotel 365에서, 우리는 one을 실생활에서 경험할 수 있다!","opts":["영화 겨울왕국","엘사의 마법","스웨덴의 여름","엘사가 만든 얼음성"],"r":{"a":"4) 엘사가 만든 얼음성","ev":"2, 3번 문장","s":[[2,"Elsa made an ice castle with her magic!","Elsa(엘사)는 그녀의 마법으로 얼음성을 만들었다!"],[3,"At Icehotel 365 in Sweden, we can experience one in real life!","스웨덴에 있는 Icehotel(얼음호텔) 365에서, 우리는 얼음성을 실생활에서 경험할 수 있다!"]],"w":"2번에서 엘사가 만든 것은 an ice castle이에요. 3번 one은 그 얼음성이 실제로 있다는 뜻이에요.","c":4},"h":"b1ae9b072d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"And everything in the hotel is made of ice, even the books.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그리고 호텔에 있는 모든 것, 심지어 책까지 얼음으로 만들어진다.","opts":["호텔 안의 모든 것이 얼음으로 만들어지고, 책도 그렇다.","호텔 안의 책만 얼음으로 만들어진다.","호텔에는 얼음으로 만든 것이 하나도 없다.","호텔의 책을 얼음 위에 올려 둔다."],"r":{"a":"1) 호텔 안의 모든 것이 얼음으로 만들어지고, 책도 그렇다.","ev":"11번 문장","s":[[11,"And everything in the hotel is made of ice, even the books.","그리고 호텔에 있는 모든 것, 심지어 책까지 얼음으로 만들어진다."]],"w":"everything ... is made of ice는 모든 것이 얼음으로 만들어진다는 뜻이고, even the books는 '책까지도'예요. 책만이라는 ②는 틀려요.","c":1},"h":"4602ca3b00"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["여름에는 이 호텔에 침실이 50개가 넘는다.","겨울에는 이 호텔의 객실이 50개 넘게 늘어난다.","태양열 발전은 얼음을 녹이는 데 쓰인다.","투숙객은 따뜻한 음료를 직접 가져와야 한다."],"opts":["The hotel has more than fifty bedrooms in summer.","The hotel has more than fifty rooms in winter.","Solar power is used to melt the ice.","Guests must bring their own hot drinks."],"r":{"a":"2) The hotel has more than fifty rooms in winter.","ev":"7~9, 14번 문장","s":[[7,"Solar power prevents the ice from melting.","태양열 발전이 얼음이 녹는 것을 막는다."],[8,"The hotel has eighteen bedrooms, including nine art rooms and nine special rooms in summer.","여름에 이 호텔에는 예술실 9개와 특실 9개를 포함해 18개의 침실이 있다."],[9,"In winter, the total number of rooms increases to more than fifty.","겨울에 총 객실 수는 50개 넘게 늘어난다."],[14,"Also, the hotel staff prepares hot drinks for the guests.","또한 호텔 직원이 투숙객을 위해 따뜻한 음료를 준비해 준다."]],"w":"9번에서 겨울에 객실이 50개 넘게 늘어나요. 여름에는 18개이고(8번), 태양열은 얼음이 녹는 것을 막으며(7번), 음료는 직원이 준비해 줘요(14번).","c":2},"h":"d047e207e7"},{"n":9,"t":"sum","q":"The hotel has (A) bedrooms in summer, but the number of rooms (B) in winter.","ko":"그 호텔은 여름에 침실이 (A)개 있지만, 겨울에는 객실 수가 (B).","oko":["(A) 50개 넘게 / (B) 늘어난다","(A) 18 / (B) 줄어든다","(A) 50개 넘게 / (B) 줄어든다","(A) 9 / (B) 줄어든다","(A) 18 / (B) 늘어난다"],"opts":["(A) fifty / (B) increases","(A) eighteen / (B) decreases","(A) fifty / (B) decreases","(A) nine / (B) decreases","(A) eighteen / (B) increases"],"r":{"a":"5) (A) eighteen / (B) increases","ev":"8, 9번 문장","s":[[8,"The hotel has eighteen bedrooms, including nine art rooms and nine special rooms in summer.","여름에 이 호텔에는 예술실 9개와 특실 9개를 포함해 18개의 침실이 있다."],[9,"In winter, the total number of rooms increases to more than fifty.","겨울에 총 객실 수는 50개 넘게 늘어난다."]],"w":"8번에서 여름에는 침실이 eighteen개이고, 9번에서 겨울에는 총 객실 수가 50개 넘게 늘어나요(increases).","c":5},"h":"428b71d3be"},{"n":10,"t":"fill","q":"Animal furs will [A] you warm, and the hotel staff [B] hot drinks for the guests.","ko":"동물의 모피 제품이 당신을 따뜻하게 [A]하고, 호텔 직원은 투숙객을 위해 따뜻한 음료를 [B].","bank":["keep","prepares","melt","climb","increase","built"],"bko":{"keep":"유지하다","prepares":"준비한다","melt":"녹다","climb":"오르다","built":"지어진","increase":"늘어나다"},"r":{"a":"[A] keep, [B] prepares","ev":"13, 14번 문장","s":[[13,"Animal furs will keep you warm when you sleep.","동물의 모피 제품이 당신이 잘 때 따뜻하게 해 줄 것이다."],[14,"Also, the hotel staff prepares hot drinks for the guests.","또한 호텔 직원이 투숙객을 위해 따뜻한 음료를 준비해 준다."]],"w":"13번 will keep you warm, 14번 prepares hot drinks에서 가져왔어요. melt는 얼음 이야기(7번), increase는 객실 수(9번), climb는 얼음 계단(4번), built는 객실을 짓는 이야기(10번)에서 나온 말이라 알맞지 않아요.","c":null},"h":"0af28ce1a3"}]},{"u":7,"id":"nl1-07-4","no":4,"ko":"혼잣말의 긍정적 효과","items":[{"n":1,"t":"tf","q":"When we make a mistake, we may say something to ourselves.","ko":"우리는 실수를 할 때 스스로에게 무언가를 말하기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When we make a mistake, we may say to ourselves, “Oh no! What did I do?”","우리는 실수를 할 때 우리 자신에게 “세상에! 내가 뭘 한 거지?”라고 말하기도 한다."]],"w":"3번 문장에 실수를 할 때 우리 자신에게 말하기도 한다고 나와요.","c":"T"},"h":"3116479280"},{"n":2,"t":"tf","q":"Talking to ourselves is a strange thing to do.","ko":"혼잣말을 하는 것은 이상한 일이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Talking to ourselves is not strange.","혼잣말을 하는 것은 이상한 일이 아니다."]],"w":"7번 문장에서 혼잣말은 not strange, 즉 이상하지 않다고 해요. 정반대예요.","c":"F"},"h":"b74b4b75fb"},{"n":3,"t":"tf","q":"When we play sports, we may shout to ourselves.","ko":"우리는 운동 경기를 할 때 스스로에게 외치기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"When we play sports, we may shout to ourselves, “All right!” or “I did it!”","운동 경기를 할 때 우리 자신에게 “좋아!” 또는 “해냈어!”라고 외치기도 한다."]],"w":"10번 문장에 운동 경기를 할 때 '좋아!' 또는 '해냈어!'라고 외치기도 한다고 나와요.","c":"T"},"h":"0ef78ec34f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...what's the best way to solve this?)","ko":"...이것을 solve하는 최선의 방법이 뭘까?","opts":["해결하다","설명하다","피하다","질문하다"],"word":"solve","r":{"a":"1) 해결하다","ev":"9번 문장","s":[[9,"For example, when we think deeply about a problem, we may say, “Hmm... what’s the best way to solve this?”","예를 들어, 우리는 어떤 문제에 대해 깊이 생각할 때 “음… 이것을 해결하는 최선의 방법이 뭘까?”라고 말하기도 한다."]],"w":"문제를 깊이 생각할 때 하는 말이에요. 최선의 방법을 찾는 것이니 solve = 해결하다예요.","c":1},"h":"2dc9814f8c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Talking to ourselves is not strange.)","ko":"혼잣말을 하는 것은 strange하지 않다.","opts":["위험한","이상한","어려운","부끄러운"],"word":"strange","r":{"a":"2) 이상한","ev":"5, 7번 문장","s":[[5,"Do you feel bad about doing this or worry that other people think you’re strange?","이렇게 하는 것이 마음에 걸리거나 다른 사람들이 당신을 이상하다고 생각할까 봐 걱정이 되는가?"],[7,"Talking to ourselves is not strange.","혼잣말을 하는 것은 이상한 일이 아니다."]],"w":"5번에서 다른 사람들이 나를 strange하다고 생각할까 봐 걱정하는 상황이 나오고, 7번에서 혼잣말은 not strange라고 해요. strange = 이상한이에요.","c":2},"h":"6bef28327f"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIn fact, most people do it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"사실, 대부분의 사람들이 그렇게 한다.","opts":["이상한 일","걱정하는 것","혼잣말을 하는 것","실수하는 것"],"r":{"a":"3) 혼잣말을 하는 것","ev":"7, 8번 문장","s":[[7,"Talking to ourselves is not strange.","혼잣말을 하는 것은 이상한 일이 아니다."],[8,"In fact, most people do it.","사실, 대부분의 사람들이 그렇게 한다."]],"w":"7번에서 Talking to ourselves(혼잣말을 하는 것)가 이상한 일이 아니라고 하고, 8번에서 대부분의 사람이 it을 한다고 해요. it은 혼잣말을 하는 것이에요.","c":3},"h":"8be57bcde3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So the next time you talk to yourself, don't feel like you're doing something wrong.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러니 다음 번에 혼잣말을 하게 되면 뭔가 잘못하고 있다고 느끼지 마라.","opts":["혼잣말을 하게 되면 다음부터는 하지 마라.","혼잣말은 잘못하고 있다는 신호이다.","혼잣말을 할 때는 더 큰 소리로 해야 한다.","혼잣말을 해도 잘못하고 있다고 느낄 필요가 없다."],"r":{"a":"4) 혼잣말을 해도 잘못하고 있다고 느낄 필요가 없다.","ev":"15번 문장","s":[[15,"So the next time you talk to yourself, don’t feel like you’re doing something wrong.","그러니 다음 번에 혼잣말을 하게 되면 뭔가 잘못하고 있다고 느끼지 마라."]],"w":"don't feel like ~는 '~라고 느끼지 마라'예요. 혼잣말을 해도 뭔가 잘못하는 것이 아니니 걱정하지 말라는 ④예요.","c":4},"h":"69aceb7435"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대부분의 사람들은 혼잣말을 하지 않는다.","혼잣말은 우리가 일에 집중하는 데 도움이 된다.","새 정보는 받아 적는 것이 반복해서 말하는 것보다 낫다.","운동 경기를 할 때는 스스로에게 말하면 안 된다."],"opts":["Most people never talk to themselves.","Talking to ourselves helps us concentrate on our work.","Writing down new information is better than repeating it.","We should not talk to ourselves when we play sports."],"r":{"a":"2) Talking to ourselves helps us concentrate on our work.","ev":"8, 10, 11, 13번 문장","s":[[8,"In fact, most people do it.","사실, 대부분의 사람들이 그렇게 한다."],[10,"When we play sports, we may shout to ourselves, “All right!” or “I did it!”","운동 경기를 할 때 우리 자신에게 “좋아!” 또는 “해냈어!”라고 외치기도 한다."],[11,"Talking to ourselves helps us concentrate on our work and encourage ourselves to try again when we fail.","혼잣말은 우리가 일에 집중하게 하고, 실패했을 때에는 우리 자신이 다시 시도하도록 격려하는 데 도움이 된다."],[13,"When you hear new information, repeat it to yourself instead of writing it down.","새로운 정보를 들을 때 그것을 받아 적는 대신 자신에게 반복해서 말해 보아라."]],"w":"11번에서 혼잣말이 일에 집중하게 돕는다고 해요. 대부분의 사람이 혼잣말을 하고(8번), 운동할 때도 하고(10번), 새 정보는 받아 적는 대신 반복해 말하라고 해요(13번).","c":2},"h":"66e7739c45"},{"n":9,"t":"sum","q":"When you hear new information, (A) it to yourself instead of writing it down. This helps you (B) and remember it.","ko":"새 정보를 들을 때 받아 적는 대신 자신에게 그것을 (A)해 보라. 이것은 당신이 그것을 (B)하고 기억하는 데 도움이 된다.","oko":["(A) 받아 적다 / (B) 잊다","(A) 반복하다 / (B) 잊다","(A) 반복하다 / (B) 이해하다","(A) 받아 적다 / (B) 이해하다","(A) 베끼다 / (B) 잊다"],"opts":["(A) write / (B) forget","(A) repeat / (B) forget","(A) repeat / (B) understand","(A) write / (B) understand","(A) copy / (B) forget"],"r":{"a":"3) (A) repeat / (B) understand","ev":"13, 14번 문장","s":[[13,"When you hear new information, repeat it to yourself instead of writing it down.","새로운 정보를 들을 때 그것을 받아 적는 대신 자신에게 반복해서 말해 보아라."],[14,"This will help you to understand and remember it.","이것은 당신이 그것을 이해하고 기억하는 데 도움이 될 것이다."]],"w":"13번에서 받아 적는 대신 반복해서(repeat) 말하라고 하고, 14번에서 이해하고(understand) 기억하는 데 도움이 된다고 해요.","c":3},"h":"409fea6fa2"},{"n":10,"t":"fill","q":"Talking to ourselves helps us [A] on our work and [B] ourselves to try again when we fail.","ko":"혼잣말은 우리가 일에 [A]하고, 실패했을 때 다시 시도하도록 우리 자신을 [B]하는 데 도움이 된다.","bank":["concentrate","encourage","shout","solve","remember","worry"],"bko":{"concentrate":"집중하다","encourage":"격려하다","shout":"외치다","solve":"해결하다","worry":"걱정하다","remember":"기억하다"},"r":{"a":"[A] concentrate, [B] encourage","ev":"11번 문장","s":[[11,"Talking to ourselves helps us concentrate on our work and encourage ourselves to try again when we fail.","혼잣말은 우리가 일에 집중하게 하고, 실패했을 때에는 우리 자신이 다시 시도하도록 격려하는 데 도움이 된다."]],"w":"11번 helps us concentrate on our work and encourage ourselves to try again에서 가져왔어요. solve와 shout는 9~10번의 예에서, worry는 5번에서 나온 말이라 알맞지 않아요.","c":null},"h":"a5791e8c29"}]},{"u":8,"id":"nl1-08-1","no":1,"ko":"그냥 편식이 아니란 말야!","items":[{"n":1,"t":"tf","q":"Some people say that cucumbers taste bitter.","ko":"어떤 사람들은 오이가 쓴맛이 난다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They say cucumbers actually taste bitter.","그들은 오이가 실제로 쓴맛이 난다고 말한다."]],"w":"2번 문장에서 그들(오이를 싫어하는 사람들)이 오이가 실제로 쓴맛이 난다고 말한다고 해요.","c":"T"},"h":"e5600910ac"},{"n":2,"t":"tf","q":"In the past, many people believed that the reason was genetic.","ko":"과거에는 많은 사람들이 그 이유가 유전적이라고 믿었다.","r":{"a":"F (본문과 다른 내용)","ev":"3, 4번 문장","s":[[3,"In the past, many people believed that there were psychological reasons for this.","과거에는 많은 사람들이 이에 대해 심리적인 이유가 있다고 믿었다."],[4,"However, scientists say that the cause is genetic.","그러나 과학자들은 그 원인이 유전적인 것이라고 말한다."]],"w":"3번에서 과거에 많은 사람들이 믿은 것은 심리적인 이유예요. 유전적이라고 말하는 것은 과학자들이에요(4번).","c":"F"},"h":"b63466a451"},{"n":3,"t":"tf","q":"People with the TAS2R38 gene also find watermelon bitter.","ko":"TAS2R38 유전자를 가진 사람들은 수박도 쓰다고 여긴다.","r":{"a":"T (본문과 맞는 내용)","ev":"5, 6번 문장","s":[[5,"Cucumbers have certain things that only people with a gene called TAS2R38 can taste.","오이는 TAS2R38이라 불리는 유전자를 가진 사람만이 맛볼 수 있는 특정한 것들을 가진다."],[6,"These people also find some other foods bitter, including watermelon.","이러한 사람들은 또한 수박을 비롯한 몇몇 다른 음식들도 쓴맛이 난다고 여긴다."]],"w":"6번 문장의 These people은 5번의 TAS2R38 유전자를 가진 사람들이고, 이들은 수박을 비롯한 음식들도 쓰다고 여겨요.","c":"T"},"h":"0d5552e2f1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They say cucumbers actually taste bitter.)","ko":"그들은 오이가 실제로 bitter한 맛이 난다고 말한다.","opts":["단","쓴","짠","매운"],"word":"bitter","r":{"a":"2) 쓴","ev":"1, 2번 문장","s":[[1,"Some people hate the taste of cucumbers.","어떤 사람들은 오이의 맛을 싫어한다."],[2,"They say cucumbers actually taste bitter.","그들은 오이가 실제로 쓴맛이 난다고 말한다."]],"w":"1번에서 오이 맛을 싫어한다고 했고, 2번에서 그 이유로 bitter한 맛이 난다고 해요. 싫어하는 이유가 되는 맛이므로 bitter = (맛이) 쓴이에요.","c":2},"h":"10bccb9c95"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, scientists say that the cause is genetic.)","ko":"그러나 과학자들은 그 원인이 genetic이라고 말한다.","opts":["유전적인","심리적인","환경적인","인위적인"],"word":"genetic","r":{"a":"1) 유전적인","ev":"3~5번 문장","s":[[3,"In the past, many people believed that there were psychological reasons for this.","과거에는 많은 사람들이 이에 대해 심리적인 이유가 있다고 믿었다."],[4,"However, scientists say that the cause is genetic.","그러나 과학자들은 그 원인이 유전적인 것이라고 말한다."],[5,"Cucumbers have certain things that only people with a gene called TAS2R38 can taste.","오이는 TAS2R38이라 불리는 유전자를 가진 사람만이 맛볼 수 있는 특정한 것들을 가진다."]],"w":"3번에서 과거에는 심리적(psychological) 이유라고 믿었지만 However 뒤의 genetic은 반대되는 설명이에요. 5번에서 유전자(gene)가 나오므로 genetic = 유전적인이에요.","c":1},"h":"62f4a75865"},{"n":6,"t":"ref","q":"What does the underlined \"These people\" refer to?\nThese people also find some other foods bitter, including watermelon.","ko":"밑줄 친 These people이 가리키는 것은?","sko":"이러한 사람들은 또한 수박을 비롯한 몇몇 다른 음식들도 쓴맛이 난다고 여긴다.","opts":["오이를 싫어하는 모든 사람","과학자들","TAS2R38 유전자를 가진 사람들","수박을 좋아하는 사람들"],"r":{"a":"3) TAS2R38 유전자를 가진 사람들","ev":"5, 6번 문장","s":[[5,"Cucumbers have certain things that only people with a gene called TAS2R38 can taste.","오이는 TAS2R38이라 불리는 유전자를 가진 사람만이 맛볼 수 있는 특정한 것들을 가진다."],[6,"These people also find some other foods bitter, including watermelon.","이러한 사람들은 또한 수박을 비롯한 몇몇 다른 음식들도 쓴맛이 난다고 여긴다."]],"w":"5번에서 TAS2R38이라는 유전자를 가진 사람만 오이의 그 맛을 볼 수 있다고 했어요. 6번의 These people이 그 사람들이에요.","c":3},"h":"b7e36438c0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The more the gene develops, the worse these foods taste.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 유전자가 더 발달할수록, 이 음식들의 맛은 더 나빠진다.","opts":["그 유전자가 발달할수록 이 음식들의 맛이 더 좋아진다.","그 유전자가 더 발달할수록 이 음식들의 맛은 더 나빠진다.","음식 맛이 나빠질수록 그 유전자가 더 발달한다.","그 유전자가 발달해도 음식 맛은 변하지 않는다."],"r":{"a":"2) 그 유전자가 더 발달할수록 이 음식들의 맛은 더 나빠진다.","ev":"7번 문장","s":[[7,"The more the gene develops, the worse these foods taste.","그 유전자가 더 발달할수록, 이 음식들의 맛은 더 나빠진다."]],"w":"the + 비교급, the + 비교급은 '~할수록 더 …하다'예요. worse는 '더 나쁜'이라서 유전자가 발달할수록 맛이 더 나쁘게 느껴지는 ②예요. ③은 원인과 결과가 바뀌었어요.","c":2},"h":"b0adee6da0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["누구나 오이에서 쓴 것을 맛볼 수 있다.","과거에는 많은 사람들이 원인이 유전적이라고 믿었다.","그 유전자가 덜 발달할수록 이 음식들의 맛이 더 나빠진다.","과학자들은 TAS2R38 유전자를 가진 사람들을 미각이 뛰어난 사람이라 부른다."],"opts":["Everyone can taste the bitter thing in cucumbers.","Many people in the past believed the cause was genetic.","The less the gene develops, the worse these foods taste.","Scientists now call people with the TAS2R38 gene \"supertasters.\""],"r":{"a":"4) Scientists now call people with the TAS2R38 gene \"supertasters.\"","ev":"3, 5, 7, 8번 문장","s":[[3,"In the past, many people believed that there were psychological reasons for this.","과거에는 많은 사람들이 이에 대해 심리적인 이유가 있다고 믿었다."],[5,"Cucumbers have certain things that only people with a gene ca the gene develops, the worse these foods taste.","그 유전자가 더 발달할수록, 이 음식들의 맛은 더 나빠진다."]],"w":"6번 also find some other foods bitter, 7번 The more the gene develops에서 가져왔어요. find + 목적어 + 형용사는 '~을 …라고 여기다'예요.","c":null},"h":"6d80d3c531"}]},{"u":8,"id":"nl1-08-2","no":2,"ko":"지상에서는 분명 맛있었는데?","items":[{"n":1,"t":"tf","q":"People often complain that airplane food doesn't taste good.","ko":"사람들은 종종 기내식이 맛있지 않다고 불평한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They often complain that the food doesn’t taste good.","그들은 종종 (기내에서 먹는) 음식이 맛있지 않다고 불평한다."]],"w":"2번 문장에서 사람들이 음식이 맛있지 않다고 종종 불평한다고 해요.","c":"T"},"h":"1d080fb175"},{"n":2,"t":"tf","q":"The air in a flying plane is very wet.","ko":"운항 중인 비행기 안의 공기는 매우 습하다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"First, the air in a flying plane is very dry, and the air pressure is low.","첫째로, 운항 중인 비행기 안의 공기는 매우 건조하고 기압이 낮다."]],"w":"5번 문장에서 비행기 안의 공기는 매우 건조하고(dry) 기압이 낮다고 해요. wet은 반대예요.","c":"F"},"h":"33948cfbbd"},{"n":3,"t":"tf","q":"The bad taste of airplane food is not the airlines' fault.","ko":"기내식이 맛없는 것은 항공사의 잘못이 아니다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But it’s not the airlines’ fault!","그러나 그것은 항공사의 잘못이 아니다!"]],"w":"3번 문장 But it's not the airlines' fault!가 그대로 이 내용이에요.","c":"T"},"h":"41d498e2c2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They often complain that the food doesn't taste good.)","ko":"그들은 종종 음식이 맛있지 않다고 complain한다.","opts":["감사하다","칭찬하다","불평하다","주문하다"],"word":"complain","r":{"a":"3) 불평하다","ev":"2, 3번 문장","s":[[2,"They often complain that the food doesn’t taste good.","그들은 종종 (기내에서 먹는) 음식이 맛있지 않다고 불평한다."],[3,"But it’s not the airlines’ fault!","그러나 그것은 항공사의 잘못이 아니다!"]],"w":"음식이 맛이 없다고 말하는 상황이고, 3번에서 항공사의 잘못이 아니라고 이어져요. complain = 불평하다예요.","c":3},"h":"e8308511cc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...there is one kind of taste that isn't affected by noise—umami.)","ko":"...소음에 affected되지 않는 한 가지 맛이 있는데, 바로 감칠맛이다.","opts":["영향을 받는","도움을 받는","방해하는","차가워진"],"word":"affected","r":{"a":"1) 영향을 받는","ev":"8, 9번 문장","s":[[8,"Studies show that food tastes less salty or sweet when it is eaten in a noisy place.","연구는 음식이 시끄러운 장소에서 섭취될 때 음식 맛이 덜 짜고 덜 달다는 것을 보여 준다."],[9,"Interestingly, there is one kind of taste that isn’t affected by noise—umami.","흥미롭게도, 소음에 영향을 받지 않는 한 가지 맛이 있는데, 바로 감칠맛이다."]],"w":"affect는 '영향을 미치다'라서 affected는 '영향을 받는'이에요. 8번에서 시끄러운 곳에서는 맛이 덜 짜고 덜 달게 느껴진다고 했고, 9번은 감칠맛만은 소음의 영향을 받지 않는다는 말이에요.","c":1},"h":"dce4123b8e"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nBecause of this, people can't taste or smell their food well.","ko":"밑줄 친 this가 가리키는 것은?","sko":"이 때문에 사람들은 그들의 음식을 제대로 맛보거나 냄새를 맡지 못한다.","opts":["비행기가 시끄러운 것","운항 중인 비행기 안의 공기가 매우 건조하고 기압이 낮은 것","항공사의 잘못","음식이 너무 짠 것"],"r":{"a":"2) 운항 중인 비행기 안의 공기가 매우 건조하고 기압이 낮은 것","ev":"5, 6번 문장","s":[[5,"First, the air in a flying plane is very dry, and the air pressure is low.","첫째로, 운항 중인 비행기 안의 공기는 매우 건조하고 기압이 낮다."],[6,"Because of this, people can’t taste or smell their food well.","이 때문에 사람들은 그들의 음식을 제대로 맛보거나 냄새를 맡지 못한다."]],"w":"6번 바로 앞 5번에서 공기가 매우 건조하고 기압이 낮다고 했어요. Because of this는 그 때문에라는 뜻이에요. 소음은 7번에서 따로 나와요.","c":2},"h":"6bc65a13ab"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Studies show that food tastes less salty or sweet when it is eaten in a noisy place.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"연구는 음식이 시끄러운 장소에서 섭취될 때 음식 맛이 덜 짜고 덜 달다는 것을 보여 준다.","opts":["시끄러운 곳에서 먹는 음식은 더 짜고 더 달게 느껴진다.","조용한 곳에서 먹는 음식은 덜 짜고 덜 달게 느껴진다.","연구에 따르면 소음은 음식의 맛과 관계가 없다.","시끄러운 곳에서 먹으면 음식이 덜 짜고 덜 달게 느껴진다."],"r":{"a":"4) 시끄러운 곳에서 먹으면 음식이 덜 짜고 덜 달게 느껴진다.","ev":"8번 문장","s":[[8,"Studies show that food tastes less salty or sweet when it is eaten in a noisy place.","연구는 음식이 시끄러운 장소에서 섭취될 때 음식 맛이 덜 짜고 덜 달다는 것을 보여 준다."]],"w":"less salty or sweet은 덜 짜거나 덜 달다는 뜻이고, in a noisy place는 시끄러운 곳이에요. 그래서 시끄러운 곳에서는 맛이 덜 느껴지는 ④예요.","c":4},"h":"9e6992ad86"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["기내식이 맛없는 것은 항공사의 실수 때문이다.","건조한 공기는 사람들이 음식을 더 잘 맛보게 도와준다.","소음은 음식을 더 짜고 더 달게 만든다.","항공사 주방장들은 감칠맛이 강한 음식을 자주 사용한다."],"opts":["Airplane food tastes bad because of the airlines' mistakes.","Dry air helps people taste their food better.","Noise makes food taste saltier and sweeter.","Airline chefs often use foods that have a strong umami flavor."],"r":{"a":"4) Airline chefs often use foods that have a strong umami flavor.","ev":"3, 5, 8, 10번 문장","s":[[3,"But it’s not the airlines’ fault!","그러나 그것은 항공사의 잘못이 아니다!"],[5,"First, the air in a flying plane is very dry, and the air pressure is low.","첫째로, 운항 중인 비행기 안의 공기는 매우 건조하고 기압이 낮다."],[8,"Studies show that food tastes less salty or sweet when it is eaten in a noisy place.","연구는 음식이 시끄러운 장소에서 섭취될 때 음식 맛이 덜 짜고 덜 달다는 것을 보여 준다."],[10,"For this reason, airline chefs often use foods that have a strong umami flavor, such as seaweed and mushrooms.","이런 이유로, 항공사 주방장들은 해초나 버섯과 같이 감칠맛이 강한 음식을 자주 사용한다."]],"w":"10번에서 항공사 주방장들이 감칠맛이 강한 음식을 자주 쓴다고 해요. 항공사의 잘못이 아니고(3번), 건조한 공기는 맛을 못 느끼게 하고(5~6번), 소음은 덜 짜고 덜 달게 느끼게 해요(8번).","c":4},"h":"68dc330aa9"},{"n":9,"t":"sum","q":"Airplanes are (A), so food tastes less salty or sweet, but (B) is not affected by noise.","ko":"비행기는 (A)해서 음식이 덜 짜고 덜 달게 느껴지지만, (B)는 소음의 영향을 받지 않는다.","oko":["(A) 건조한 / (B) 감칠맛","(A) 시끄러운 / (B) 단맛","(A) 시끄러운 / (B) 감칠맛","(A) 조용한 / (B) 감칠맛","(A) 건조한 / (B) 짠맛"],"opts":["(A) dry / (B) umami","(A) noisy / (B) sweetness","(A) noisy / (B) umami","(A) quiet / (B) umami","(A) dry / (B) saltiness"],"r":{"a":"3) (A) noisy / (B) umami","ev":"7~9번 문장","s":[[7,"Also, airplanes are noisy.","또한 비행기는 시끄럽다."],[8,"Studies show that food tastes less salty or sweet when it is eaten in a noisy place.","연구는 음식이 시끄러운 장소에서 섭취될 때 음식 맛이 덜 짜고 덜 달다는 것을 보여 준다."],[9,"Interestingly, there is one kind of taste that isn’t affected by noise—umami.","흥미롭게도, 소음에 영향을 받지 않는 한 가지 맛이 있는데, 바로 감칠맛이다."]],"w":"7번에서 비행기는 시끄럽고(noisy), 8번에서 그래서 덜 짜고 덜 달게 느껴요. 9번에서 소음의 영향을 받지 않는 맛은 감칠맛(umami)이에요.","c":3},"h":"9accabbbdb"},{"n":10,"t":"fill","q":"Airline chefs often use foods with a strong [A] flavor, such as [B] and mushrooms.","ko":"항공사 주방장들은 [B]나 버섯과 같이 [A] 맛이 강한 음식을 자주 사용한다.","bank":["umami","seaweed","noisy","airline","fault","scientific"],"bko":{"umami":"감칠맛","seaweed":"해초","noisy":"시끄러운","airline":"항공사","fault":"잘못","scientific":"과학적인"},"r":{"a":"[A] umami, [B] seaweed","ev":"10번 문장","s":[[10,"For this reason, airline chefs often use foods that have a strong umami flavor, such as seaweed and mushrooms.","이런 이유로, 항공사 주방장들은 해초나 버섯과 같이 감칠맛이 강한 음식을 자주 사용한다."]],"w":"10번 foods that have a strong umami flavor, such as seaweed and mushrooms에서 가져왔어요. noisy는 비행기가 시끄럽다는 7번에서, airline·fault·scientific은 3~4번에서 나온 말이라 이 빈칸에는 알맞지 않아요.","c":null},"h":"38300630da"}]},{"u":8,"id":"nl1-08-3","no":3,"ko":"3.14159265358 ...","items":[{"n":1,"t":"tf","q":"Pi Day is celebrated on March 14 every year.","ko":"파이 데이는 매년 3월 14일에 기념된다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Pi Day is celebrated on March 14 every year.","파이 데이는 매년 3월 14일에 기념됩니다."]],"w":"2번 문장 그대로예요.","c":"T"},"h":"07411a9d78"},{"n":2,"t":"tf","q":"The festival will be held in the school library.","ko":"축제는 학교 도서관에서 열릴 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"The festival will be held after school on Wednesday, March 14, in the school gym.","축제는 3월 14일 수요일 방과 후에 학교 체육관에서 열릴 것입니다."]],"w":"9번 문장에서 축제는 학교 체육관(gym)에서 열린다고 해요. 도서관은 아니에요.","c":"F"},"h":"2629eed001"},{"n":3,"t":"tf","q":"There will be a pie-throwing contest and a pie-eating contest.","ko":"파이 던지기 대회와 파이 먹기 대회가 있을 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"We will have a pie-throwing contest and a pie-eating contest.","우리는 파이 던지기 대회와 파이 먹기 대회를 할 것입니다."]],"w":"5번 문장에서 우리는 파이 던지기 대회와 파이 먹기 대회를 할 것이라고 해요.","c":"T"},"h":"a60eda638a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Come Celebrate Pi Day with the Math Club!)","ko":"수학 동아리와 함께 파이 데이를 celebrate하러 오세요!","opts":["연습하다","공부하다","설명하다","기념하다"],"word":"Celebrate","r":{"a":"4) 기념하다","ev":"1, 2번 문장","s":[[1,"Come Celebrate Pi Day with the Math Club!","수학 동아리와 함께 파이 데이를 기념하러 오세요!"],[2,"Pi Day is celebrated on March 14 every year.","파이 데이는 매년 3월 14일에 기념됩니다."]],"w":"파이 데이 행사에 초대하는 글이고, 2번에서 매년 3월 14일에 celebrated된다고 해요. 행사로 기념한다는 뜻이니 celebrate = 기념하다예요.","c":4},"h":"5816dd37ff"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The festival will be held after school on Wednesday, March 14, in the school gym.)","ko":"축제는 3월 14일 수요일 방과 후에 학교 체육관에서 held될 것이다.","opts":["열릴","닫힐","끝날","팔릴"],"word":"held","r":{"a":"1) 열릴","ev":"9번 문장","s":[[9,"The festival will be held after school on Wednesday, March 14, in the school gym.","축제는 3월 14일 수요일 방과 후에 학교 체육관에서 열릴 것입니다."]],"w":"9번은 축제가 언제, 어디서 열리는지 말하는 문장이에요. 날짜와 장소가 나오는 행사이니 be held는 '열리다'예요. 닫히거나 팔리는 것이 아니에요.","c":1},"h":"69db18e9f2"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat’s because the first three numbers of pi (π) are 3, 1, and 4.","ko":"밑줄 친 That이 가리키는 것은?","sko":"왜냐하면 파이(π)의 첫 세 개의 숫자가 3, 1, 그리고 4이기 때문이죠.","opts":["수학 동아리가 축제를 여는 것","파이 던지기 대회를 하는 것","파이 데이가 매년 3월 14일에 기념되는 것","축제가 방과 후에 열리는 것"],"r":{"a":"3) 파이 데이가 매년 3월 14일에 기념되는 것","ev":"2, 3번 문장","s":[[2,"Pi Day is celebrated on March 14 every year.","파이 데이는 매년 3월 14일에 기념됩니다."],[3,"That’s because the first three numbers of pi (π) are 3, 1, and 4.","왜냐하면 파이(π)의 첫 세 개의 숫자가 3, 1, 그리고 4이기 때문이죠."]],"w":"3번은 That's because ~로 이유를 말하고 있어요. 바로 앞 2번의 '파이 데이가 매년 3월 14일에 기념된다'가 That이 가리키는 내용이에요.","c":3},"h":"f3355614a9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you’re not sure what pi is, come to the festival and find out!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"파이가 무엇인지 잘 모르겠다면 축제에 오셔서 알아보세요!","opts":["파이가 무엇인지 알고 있다면 축제에 오세요.","파이가 무엇인지 잘 모르겠다면 축제에 와서 알아보세요.","파이가 무엇인지 알려 주려고 축제를 열 것입니다.","파이가 무엇인지 모르면 축제에 오지 마세요."],"r":{"a":"2) 파이가 무엇인지 잘 모르겠다면 축제에 와서 알아보세요.","ev":"4번 문장","s":[[4,"If you’re not sure what pi is, come to the festival and find out!","파이가 무 hem in the father’s pouch.","엄마가 알을 낳은 후에 아빠의 주머니에 알들을 넣는다."]],"w":"12번 문장 그대로예요. 엄마가 알을 낳은 뒤 아빠의 주머니에 넣어요.","c":"T"},"h":"cfd6ed6ca3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He carries them until they hatch.)","ko":"아빠는 알들이 부화할 때까지 그것들을 품고 다닌다. (hatch는 부화하다)","opts":["부화하다","달아나다","죽다","사라지다"],"word":"hatch","r":{"a":"1) 부화하다","ev":"14번 문장","s":[[14,"He carries them until they hatch.","아빠는 알들이 부화할 때까지 그것들을 품고 다닌다."]],"w":"알을 품고 다니다가 알에서 새끼가 나올 때까지라는 뜻이에요. hatch = 부화하다.","c":1},"h":"ee7fb3d303"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They live in warm sea water and swim standing straight up.)","ko":"그것들은 따뜻한 바닷물에 살고 똑바로 서서 헤엄친다. (straight는 똑바로)","opts":["거꾸로","느리게","옆으로","똑바로"],"word":"straight","r":{"a":"4) 똑바로","ev":"8번 문장","s":[[8,"They live in warm sea water and swim standing straight up.","그것들은 따뜻한 바닷물에 살고 똑바로 서서 헤엄친다."]],"w":"standing straight up은 똑바로 선 채라는 뜻이에요. 해마는 몸을 세워서 헤엄쳐요. straight = 똑바로.","c":4},"h":"3fc9f19924"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen the babies are big enough, he releases them.","ko":"밑줄 친 them가 가리키는 것은?","sko":"새끼들이 충분히 크면 아빠는 그들을 내보낸다.","opts":["알들","엄마 해마들","새끼들","주머니들"],"r":{"a":"3) 새끼들","ev":"14~15번 문장","s":[[14,"He carries them until they hatch.","아빠는 알들이 부화할 때까지 그것들을 품고 다닌다."],[15,"When the babies are big enough, he releases them.","새끼들이 충분히 크면 아빠는 그들을 내보낸다."]],"w":"15번에서 새끼들(the babies)이 충분히 크면 아빠가 them을 내보내요. 14번에서 알이 부화해 새끼가 된 거라서 them = the babies예요.","c":3},"h":"95bb303498"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s not all.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 다가 아니다.","opts":["해마 이야기는 여기서 끝이다.","해마는 전부 같은 모습이다.","해마에 대해 더 말할 것이 있다.","해마는 아무것도 하지 않는다."],"r":{"a":"3) 해마에 대해 더 말할 것이 있다.","ev":"10~11번 문장","s":[[10,"That’s not all.","그것이 다가 아니다."],[11,"There is another strange thing about seahorses.","해마에 대해 특이한 점이 또 하나 있다."]],"w":"That's not all은 '그게 다가 아니다'라는 뜻이에요. 바로 뒤 11번에서 또 하나의 특이한 점을 말해요.","c":3},"h":"041bbe83fa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["해마는 차가운 강물에 산다.","해마는 납작하게 누워서 헤엄친다.","모든 해마는 길이가 30센티미터가 넘는다.","해마는 따뜻한 바닷물에 산다."],"opts":["Seahorses live in cold river water.","Seahorses swim lying flat.","All seahorses are over 30 centimeters long.","Seahorses live in warm sea water."],"r":{"a":"4) Seahorses live in warm sea water.","ev":"8번 문장","s":[[8,"They live in warm sea water and swim standing straight up.","그것들은 따뜻한 바닷물에 살고 똑바로 서서 헤엄친다."]],"w":"8번 문장에서 해마는 따뜻한 바닷물에 살고 똑바로 서서 헤엄쳐요. 모든 해마가 30센티미터가 넘는 것도 아니에요(6~7번).","c":4},"h":"ddadecf5b7"},{"n":9,"t":"sum","q":"There are about fifty kinds of seahorses. Some are very (A), and others can be more than 30 centimeters (B).","ko":"해마는 약 50종이 있다. 어떤 것들은 매우 (A), 다른 것들은 30센티미터가 넘게 (B) 수 있다.","oko":["(A) 큰 / (B) 짧은","(A) 작은 / (B) 긴","(A) 빠른 / (B) 키가 큰","(A) 작은 / (B) 넓은","(A) 무거운 / (B) 긴"],"opts":["(A) big / (B) short","(A) small / (B) long","(A) fast / (B) tall","(A) small / (B) wide","(A) heavy / (B) long"],"r":{"a":"2) (A) small / (B) long","ev":"5~7번 문장","s":[[5,"There are about fifty different kinds of seahorses.","50여 종의 다양한 해마가 있다."],[6,"Some are very small.","어떤 것들은 매우 작다."],[7,"Others can be more than 30 centimeters long.","다른 것들은 길이가 30센티미터를 넘을 수도 있다."]],"w":"6번에서 어떤 것들은 매우 작고(very small), 7번에서 다른 것들은 길이가 30센티미터를 넘을 수 있다(more than 30 centimeters long)고 해요.","c":2},"h":"986bf2957e"},{"n":10,"t":"fill","q":"A seahorse looks strange, but it is really a [A]. The father carries the eggs in his [B] until they hatch.","ko":"해마는 이상해 보이지만 사실은 [A]이다. 아빠는 알이 부화할 때까지 [B] 안에 알을 품고 다닌다.","bank":["fish","pouch","tail","head","sea","egg"],"bko":{"fish":"물고기","pouch":"주머니","tail":"꼬리","head":"머리","sea":"바다","egg":"알"},"r":{"a":"[A] fish, [B] pouch","ev":"4, 12, 14번 문장","s":[[4,"However, it is really a fish!","하지만 그것은 실제로 물고기이다!"],[12,"After the mother lays her eggs, she puts them in the father’s pouch.","엄마가 알을 낳은 후에 아빠의 주머니에 알들을 넣는다."],[14,"He carries them until they hatch.","아빠는 알들이 부화할 때까지 그것들을 품고 다닌다."]],"w":"4번 it is really a fish, 12번 the father's pouch, 14번 He carries them until they hatch에서 가져왔어요. tail은 원숭이의 꼬리(2번)라서 알을 품는 곳이 아니에요.","c":null},"h":"6081389ab6"}]},{"u":9,"id":"nl1-09-3","no":3,"ko":"이젠 줄 서지 마세요!","items":[{"n":1,"t":"tf","q":"The writer says he is not a thief.","ko":"글쓴이는 자신이 도둑이 아니라고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"But I’m not a thief!","그러나 나는 도둑이 아니다!"]],"w":"4번 문장에서 But I'm not a thief!라고 해요. 계산 없이 걸어 나오는 것처럼 보여도 도둑이 아니에요.","c":"T"},"h":"24946d52b3"},{"n":2,"t":"tf","q":"You have to bring your wallet to pay at this new store.","ko":"이 새 매장에서는 계산하려면 지갑을 가져가야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"You don’t even have to bring your wallet!","당신은 심지어 지갑을 가져올 필요도 없다!"]],"w":"9번 문장에서 지갑을 가져올 필요도 없다(You don't even have to bring your wallet!)고 해요. 총액이 계좌에 자동으로 청구되기 때문이에요.","c":"F"},"h":"d4af40131f"},{"n":3,"t":"tf","q":"The writer shops at a special new store these days.","ko":"글쓴이는 요즘 특별한 새 매장에서 쇼핑을 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"That’s why I shop at a special new store these days.","그래서 나는 요즘 새로 생긴 특별한 매장에서 쇼핑을 한다."]],"w":"2번 문장 그대로예요(I shop at a special new store these days).","c":"T"},"h":"cb72025a25"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (I hate waiting in line at the supermarket counter.)","ko":"나는 슈퍼마켓 계산대에서 줄 서서 기다리는 것을 싫어한다. (counter는 계산대)","opts":["계산대","주차장","냉장고","출입문"],"word":"counter","r":{"a":"1) 계산대","ev":"1번 문장","s":[[1,"I hate waiting in line at the supermarket counter.","나는 슈퍼마켓 계산대에서 줄 서서 기다리는 것을 싫어한다."]],"w":"슈퍼마켓에서 줄 서서 기다리는 곳은 돈을 내는 계산대예요. counter = 계산대.","c":1},"h":"85eb7c7ba7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If you hate waiting in lines, I recommend this shop to you.)","ko":"만약 당신이 줄 서서 기다리는 것을 싫어한다면, 이 매장을 당신에게 추천한다. (recommend는 추천하다)","opts":["문을 닫다","팔다","추천하다","비교하다"],"word":"recommend","r":{"a":"3) 추천하다","ev":"10번 문장","s":[[10,"If you hate waiting in lines, I recommend this shop to you.","만약 당신이 줄 서서 기다리는 것을 싫어한다면, 이 매장을 당신에게 추천한다."]],"w":"줄 서기가 싫은 사람에게 이 매장을 소개하는 말이에요. recommend = 추천하다.","c":3},"h":"c8759811e2"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen you take an item, it is added to the shopping cart app on your phone.","ko":"밑줄 친 it가 가리키는 것은?","sko":"당신이 물건을 가져가면, 그것은 당신의 휴대 전화에 있는 쇼핑 카트 앱에 추가된다.","opts":["휴대 전화","쇼핑 카트 앱","센서","가져간 물건"],"r":{"a":"4) 가져간 물건","ev":"6번 문장","s":[[6,"When you take an item, it is added to the shopping cart app on your phone.","당신이 물건을 가져가면, 그것은 당신의 휴대 전화에 있는 쇼핑 카트 앱에 추가된다."]],"w":"앱에 추가되는 것은 당신이 가져간 물건(an item)이에요. 휴대 전화나 앱이 추가되는 게 아니에요.","c":4},"h":"bb9fb26751"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"I just walk in, take the food that I want, and then walk right out.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"나는 그냥 걸어 들어가서 내가 원하는 식품을 가지고 바로 걸어 나온다.","opts":["나는 들어가자마자 계산대에 줄을 선다.","나는 식품을 가지고 들어가서 바로 나온다.","나는 들어가서 식품을 가지고 바로 나온다.","나는 먹고 싶은 식품을 먹고 걸어 나온다."],"r":{"a":"3) 나는 들어가서 식품을 가지고 바로 나온다.","ev":"3번 문장","s":[[3,"I just walk in, take the food that I want, and then walk right out.","나는 그냥 걸어 들어가서 내가 원하는 식품을 가지고 바로 걸어 나온다."]],"w":"walk in(들어가다) → take the food(식품을 가지다) → walk right out(바로 나가다) 순서예요. 줄을 서지 않고 계산대도 거치지 않아요.","c":3},"h":"a1f0e40e1a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["당신이 매장을 나갈 때 앱이 비용을 합산한다.","당신이 매장에 들어가기 전에 앱이 비용을 합산한다.","당신은 계산대에서 사람에게 현금을 낸다.","매장은 사람 수를 세려고 센서를 쓴다."],"opts":["The app adds up the cost when you leave the store.","The app adds up the cost before you enter the store.","You pay cash to a person at the counter.","The store uses sensors to count the people."],"r":{"a":"1) The app adds up the cost when you leave the store.","ev":"7번 문장","s":[[7,"And when you leave, the app adds up how much everything costs.","그리고 당신이 나갈 때, 그 앱이 전부 얼마인지 합산한다."]],"w":"7번 문장에서 나갈 때(when you leave) 앱이 전부 얼마인지 합산해요. 센서는 물품을 추적하려고 써요(5번).","c":1},"h":"250265f076"},{"n":9,"t":"sum","q":"The store uses computer (A) to track the items you take, and each item is added to the (B) app on your phone.","ko":"그 매장은 당신이 가져가는 물품을 추적하려고 컴퓨터 (A)를 쓰고, 각 물품은 휴대 전화의 (B) 앱에 추가된다.","oko":["(A) 카메라 / (B) 음악","(A) 센서 / (B) 게임","(A) 센서 / (B) 쇼핑 카트","(A) 직원 / (B) 쇼핑 카트","(A) 계산대 / (B) 은행"],"opts":["(A) cameras / (B) music","(A) sensors / (B) game","(A) sensors / (B) shopping cart","(A) workers / (B) shopping cart","(A) counters / (B) bank"],"r":{"a":"3) (A) sensors / (B) shopping cart","ev":"5~6번 문장","s":[[5,"This new kind of store uses computer sensors to track the items that you take off the shelves.","이 새로운 형태의 매장은 당신이 선반에서 꺼내는 물품들을 추적하기 위해 컴퓨터 센서를 이용한다."],[6,"When you take an item, it is added to the shopping cart app on your phone.","당신이 물건을 가져가면, 그것은 당신의 휴대 전화에 있는 쇼핑 카트 앱에 추가된다."]],"w":"5번에서 컴퓨터 센서(sensors)로 물품을 추적하고, 6번에서 물건이 휴대 전화의 쇼핑 카트 앱(shopping cart app)에 추가돼요.","c":3},"h":"d9694025c8"},{"n":10,"t":"fill","q":"When you leave, the app adds up the price, and the total is automatically [A] to your [B].","ko":"당신이 나갈 때 앱이 가격을 합산하고, 총액은 자동으로 당신의 [B]에 [A]된다.","bank":["charged","account","item","thief","shelf","counter"],"bko":{"charged":"청구되는","account":"계좌","thief":"도둑","shelf":"선반","counter":"계산대","item":"물품"},"r":{"a":"[A] charged, [B] account","ev":"7~8번 문장","s":[[7,"And when you leave, the app adds up how much everything costs.","그리고 당신이 나갈 때, 그 앱이 전부 얼마인지 합산한다."],[8,"The total is then automatically charged to your account.","그런 다음 총액은 자동으로 당신의 계좌에 청구된다."]],"w":"7번에서 나갈 때 앱이 합산하고, 8번에서 The total is then automatically charged to your account라고 해요. 9번에서 지갑은 가져올 필요도 없다고 했어요.","c":null},"h":"9c53336fa7"}]},{"u":9,"id":"nl1-09-4","no":4,"ko":"사진과 실물은 달라","items":[{"n":1,"t":"tf","q":"In real life we see everything in three dimensions.","ko":"실생활에서 우리는 모든 것을 3차원으로 본다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In real life we see everything in three dimensions.","실생활에서 우리는 모든 것을 3차원으로 본다."]],"w":"5번 문장 그대로예요(In real life we see everything in three dimensions).","c":"T"},"h":"81a6235d99"},{"n":2,"t":"tf","q":"Photos show things in three dimensions.","ko":"사진은 사물을 3차원으로 보여 준다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"However, photos only show things in two dimensions.","하지만 사진은 사물을 2차원으로만 보여 준다."]],"w":"6번 문장에서 사진은 사물을 2차원으로만 보여 준다(photos only show things in two dimensions)고 해요. 3차원은 실생활이에요.","c":"F"},"h":"a7e1ed9631"},{"n":3,"t":"tf","q":"The writer says you should not look right at the camera.","ko":"글쓴이는 카메라를 똑바로 보지 말라고 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"When you take a picture, try not to look right at the camera.","사진을 찍을 때, 카메라를 똑바로 보지 않도록 해라."]],"w":"11번 문장에서 try not to look right at the camera라고 해요. 카메라를 정면으로 보지 않도록 하라는 뜻이에요.","c":"T"},"h":"b3e1c4f5a1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Therefore, your “flat” eyes in photos are only 70 to 80 percent of the size of your round eyes in real life.)","ko":"그러므로 사진 속 당신의 ‘납작한’ 눈은 실제 당신의 둥근 눈 크기의 70~80퍼센트밖에 되지 않는다. (therefore는 그러므로)","opts":["하지만","게다가","그러므로","예를 들어"],"word":"Therefore","r":{"a":"3) 그러므로","ev":"7~8번 문장","s":[[7,"They cannot show depth, so round shapes look smaller and flatter.","사진은 깊이를 보여 줄 수 없어서 둥근 형태는 더 작고 더 납작해 보인다."],[8,"Therefore, your “flat” eyes in photos are only 70 to 80 percent of the size of your round eyes in real life.","그래서 사진 속 당신의 ‘납작한’ 눈은 실제 당신의 둥근 눈 크기의 70~80퍼센트밖에 되지 않는다."]],"w":"7번에서 사진은 깊이를 못 보여 줘서 눈이 더 작아 보인다고 했어요. 그 결과로 8번에서 70~80퍼센트라고 말해요. Therefore = 그러므로.","c":3},"h":"72d1151f1a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You should look up or down slightly.)","ko":"(카메라의) 약간 위나 아래를 보아야 한다. (slightly는 약간)","opts":["약간","아주 많이","갑자기","오랫동안"],"word":"slightly","r":{"a":"1) 약간","ev":"12번 문장","s":[[12,"You should look up or down slightly.","(카메라의) 약간 위나 아래를 보아야 한다."]],"w":"카메라를 똑바로 보지 말라고 한 뒤(11번) 위나 아래를 보라고 해요. 크게 돌리는 게 아니라 slightly = 약간이에요.","c":1},"h":"cca2d5029e"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey cannot show depth, so round shapes look smaller and flatter.","ko":"밑줄 친 They가 가리키는 것은?","sko":"사진은 깊이를 보여 줄 수 없어서 둥근 형태는 더 작고 더 납작해 보인다.","opts":["둥근 형태들","사진들","사람들의 눈","우리 모두"],"r":{"a":"2) 사진들","ev":"6~7번 문장","s":[[6,"However, photos only show things in two dimensions.","하지만 사진은 사물을 2차원으로만 보여 준다."],[7,"They cannot show depth, so round shapes look smaller and flatter.","사진은 깊이를 보여 줄 수 없어서 둥근 형태는 더 작고 더 납작해 보인다."]],"w":"깊이를 보여 주지 못하는 것은 사진이에요. 6번에서 사진(photos)이 2차원으로만 보여 준다고 했고, 7번에서 그 photos를 They로 받았어요.","c":2},"h":"6b43963b4b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In addition, your face also looks flatter than it is.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"게다가 당신의 얼굴 또한 실제보다 더 납작하게 보인다.","opts":["당신의 얼굴은 실제로 매우 납작하다.","당신의 얼굴은 사진에서 더 둥글어 보인다.","당신의 얼굴은 눈보다 더 크게 보인다.","당신의 얼굴도 실제보다 더 납작해 보인다."],"r":{"a":"4) 당신의 얼굴도 실제보다 더 납작해 보인다.","ev":"9번 문장","s":[[9,"In addition, your face also looks flatter than it is.","게다가 당신의 얼굴 또한 실제보다 더 납작하게 보인다."]],"w":"flatter than it is는 실제(it is flat)보다 더 납작하다는 뜻이에요. 얼굴도 눈처럼 사진에서는 실제보다 납작하게 보여요.","c":4},"h":"b2775fd88b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사람들은 종종 자신이 사진에서 이상하게 보인다고 생각한다.","사진에서 둥근 형태는 더 크고 더 둥글게 보인다.","사진 속 눈은 실제보다 더 크다.","카메라를 똑바로 보면 더 3차원적으로 보인다."],"opts":["People often think they look strange in photos.","In photos, round shapes look bigger and rounder.","Your eyes in photos are bigger than in real life.","Looking right at the camera makes you look more three dimensional."],"r":{"a":"1) People often think they look strange in photos.","ev":"2, 7, 8, 11, 13번 문장","s":[[2,"Often, people think they look strange in photos.","종종 사람들은 자신들이 사진에서 이상하게 보인다고 생각한다."],[7,"They cannot show depth, so round shapes look smaller and flatter.","사진은 깊이를 보여 줄 수 없어서 둥근 형태는 더 작고 더 납작해 보인다."],[8,"Therefore, your “flat” eyes in photos are only 70 to 80 percent of the size of your round eyes in real life.","그래서 사진 속 당신의 ‘납작한’ 눈은 실제 당신의 둥근 눈 크기의 70~80퍼센트밖에 되지 않는다."],[11,"When you take a picture, try not to look right at the camera.","사진을 찍을 때, 카메라를 똑바로 보지 않도록 해라."],[13,"Then you will look more three dimensional.","그러면 당신은 더 3차원적으로 보일 것이다."]],"w":"2번에서 사람들은 사진에서 이상하게 보인다고 생각해요. 둥근 형태는 더 작고 납작해 보이고(7번), 눈은 실제의 70~80퍼센트(8번)이며, 3차원적으로 보이려면 카메라를 똑바로 보지 말아야 해요(11, 13번).","c":1},"h":"e6946bb87f"},{"n":9,"t":"sum","q":"Photos cannot show (A), so your eyes and face look (B) than they are in real life.","ko":"사진은 (A)을(를) 보여 줄 수 없어서 눈과 얼굴이 실제보다 더 (B) 보인다.","oko":["(A) 색 / (B) 더 둥글게","(A) 빛 / (B) 더 크게","(A) 깊이 / (B) 더 크게","(A) 깊이 / (B) 더 둥글게","(A) 깊이 / (B) 더 납작하게"],"opts":["(A) color / (B) rounder","(A) light / (B) bigger","(A) depth / (B) bigger","(A) depth / (B) rounder","(A) depth / (B) flatter"],"r":{"a":"5) (A) depth / (B) flatter","ev":"7, 9번 문장","s":[[7,"They cannot show depth, so round shapes look smaller and flatter.","사진은 깊이를 보여 줄 수 없어서 둥근 형태는 더 작고 더 납작해 보인다."],[9,"In addition, your face also looks flatter than it is.","게다가 당신의 얼굴 또한 실제보다 더 납작하게 보인다."]],"w":"7번에서 사진은 깊이(depth)를 보여 줄 수 없어 둥근 형태가 더 작고 납작해 보이고, 9번에서 얼굴도 실제보다 더 납작하게(flatter) 보인다고 해요.","c":5},"h":"262aff23ee"},{"n":10,"t":"fill","q":"To look more three dimensional in photos, do not look [A] at the camera. Look [B] or down slightly.","ko":"사진에서 더 3차원적으로 보이려면 카메라를 [A] 보지 마라. 약간 [B] 또는 아래를 보라.","bank":["right","up","flat","two","depth","small"],"bko":{"right":"똑바로","up":"위로","flat":"납작한","two":"둘","depth":"깊이","small":"작은"},"r":{"a":"[A] right, [B] up","ev":"11~13번 문장","s":[[11,"When you take a picture, try not to look right at the camera.","사진을 찍을 때, 카메라를 똑바로 보지 않도록 해라."],[12,"You should look up or down slightly.","(카메라의) 약간 위나 아래를 보아야 한다."],[13,"Then you will look more three dimensional.","그러면 당신은 더 3차원적으로 보일 것이다."]],"w":"11번 try not to look right at the camera, 12번 look up or down slightly, 13번 Then you will look more three dimensional에서 가져왔어요. flat은 사진에서 얼굴이 납작해 보이는 말(3번)이라 방법과 관계없어요.","c":null},"h":"d1e848be9b"}]},{"u":10,"id":"nl1-10-1","no":1,"ko":"먹을수록 살이 빠지는 비밀","items":[{"n":1,"t":"tf","q":"Carrots and tomatoes are also negative calorie foods.","ko":"당근과 토마토도 네거티브 칼로리 음식이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Carrots, broccoli, strawberries, and tomatoes are also negative calorie foods.","당근, 브로콜리, 딸기, 그리고 토마토 또한 네거티브 칼로리 음식이다."]],"w":"10번 문장에서 당근, 브로콜리, 딸기, 토마토 또한 네거티브 칼로리 음식이라고 해요.","c":"T"},"h":"21ad7b1c40"},{"n":2,"t":"tf","q":"The body burns fewer than five calories to digest celery.","ko":"몸은 셀러리를 소화하는 데 5칼로리보다 적게 태운다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"But the body burns more than five calories to digest it.","그러나 몸은 그것을 소화하기 위해 5칼로리 넘게 태운다."]],"w":"8번 문장에서 몸은 소화하느라 5칼로리보다 더 많이 태운다(burns more than five calories)고 해요. 적게 태운다는 말은 반대예요.","c":"F"},"h":"fa33ef6ac9"},{"n":3,"t":"tf","q":"With negative calorie foods, people can lose weight on a full stomach.","ko":"네거티브 칼로리 음식으로는 배부른 채로 살을 뺄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"With these foods, people can lose weight on a full stomach!","이 음식들로 사람들은 배부른 채 살을 뺄 수 있다!"]],"w":"11번 문장 그대로예요. 이 음식들로 배부른 채 살을 뺄 수 있다고 해요.","c":"T"},"h":"86adafd236"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When people are trying to lose weight, food is a delicious-looking enemy.)","ko":"사람들이 살을 빼려고 애쓸 때, 음식은 맛있어 보이는 적이다. (enemy는 적)","opts":["친구","적","선생님","가족"],"word":"enemy","r":{"a":"2) 적","ev":"1~2번 문장","s":[[1,"When people are trying to lose weight, food is a delicious-looking enemy.","사람들이 살을 빼려고 애쓸 때, 음식은 맛있어 보이는 적이다."],[2,"But there are some foods that actually help you lose weight!","그러나 실제로 당신이 살 빼는 것을 돕는 몇 가지 음식들이 있다!"]],"w":"살을 빼려는 사람에게 맛있어 보이는 음식은 방해가 되는 존재예요. 2번에서 But으로 반대 이야기를 시작하는 걸 보면 enemy = 적이에요.","c":2},"h":"d057c8ea2d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A stick of uncooked celery contains about five calories.)","ko":"익히지 않은 셀러리 한 대는 약 5칼로리를 포함한다. (contain은 포함하다)","opts":["버리다","섞다","팔다","포함하다"],"word":"contains","r":{"a":"4) 포함하다","ev":"6번 문장","s":[[6,"A stick of uncooked celery contains about five calories.","익히지 않은 셀러리 한 대는 약 5칼로리를 포함한다."]],"w":"셀러리 한 대에 약 5칼로리가 들어 있다는 뜻이에요. contain = 포함하다, 들어 있다.","c":4},"h":"47dca3c270"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen you eat a whole stick of it, your body has five more calories.","ko":"밑줄 친 it가 가리키는 것은?","sko":"당신이 셀러리 한 대를 다 먹으면, 당신의 몸은 5칼로리를 더 얻는다.","opts":["셀러리","몸","칼로리","네거티브"],"r":{"a":"1) 셀러리","ev":"6~7번 문장","s":[[6,"A stick of uncooked celery contains about five calories.","익히지 않은 셀러리 한 대는 약 5칼로리를 포함한다."],[7,"When you eat a whole stick of it, your body has five more calories.","당신이 셀러리 한 대를 다 먹으면, 당신의 몸은 5칼로리를 더 얻는다."]],"w":"먹는 것은 셀러리예요. 6번에서 셀러리 한 대를 말했고, 7번의 it은 그 셀러리(celery)를 가리켜요.","c":1},"h":"654b64bc05"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, you actually lose calories overall.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러므로 당신은 사실 전체적으로는 칼로리를 잃는 셈이다.","opts":["그래서 당신은 칼로리를 계속 얻는다.","그래서 당신은 먹을 때만 칼로리를 잃는다.","그래서 당신은 결국 전체로는 칼로리를 잃는다.","그래서 당신은 셀러리를 먹지 않아야 한다."],"r":{"a":"3) 그래서 당신은 결국 전체로는 칼로리를 잃는다.","ev":"9번 문장","s":[[9,"So, you actually lose calories overall.","그러므로 당신은 사실 전체적으로는 칼로리를 잃는 셈이다."]],"w":"overall은 전체적으로라는 뜻이에요. 얻은 칼로리보다 소화에 쓴 칼로리가 많아서(8번) 결국 칼로리가 줄어요.","c":3},"h":"209203a10f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["셀러리 한 대는 약 50칼로리를 포함한다.","셀러리는 네거티브 칼로리 음식의 한 예이다.","모든 음식은 사람들이 살 빼는 것을 돕는다.","셀러리를 먹으면 몸은 칼로리를 전혀 태우지 않는다."],"opts":["A stick of celery contains about fifty calories.","Celery is one example of negative calorie foods.","All foods help people lose weight.","Eating celery makes your body burn no calories."],"r":{"a":"2) Celery is one example of negative calorie foods.","ev":"2, 4, 5번 문장","s":[[2,"But there are some foods that actually help you lose weight!","그러나 실제로 당신이 살 빼는 것을 돕는 몇 가지 음식들이 있다!"],[4,"They are called “negative calorie” foods.","그것들은 ‘네거티브 칼로리’ 음식이라 불린다."],[5,"Celery is one example.","셀러리가 한 예이다."]],"w":"5번 문장에서 셀러리가 네거티브 칼로리 음식의 한 예라고 해요. 셀러리 칼로리는 약 5예요(6번). 살 빼는 것을 돕는 건 일부 음식이에요(2번).","c":2},"h":"39daa3df4a"},{"n":9,"t":"sum","q":"Celery has about five calories, but the body burns (A) calories to digest it, so you (B) calories overall.","ko":"셀러리에는 약 5칼로리가 있지만, 몸은 그것을 소화하려고 (A) 칼로리를 태워서 전체적으로는 칼로리를 (B).","oko":["(A) 더 적은 / (B) 얻는다","(A) 더 많은 / (B) 얻는다","(A) 더 많은 / (B) 잃는다","(A) 더 적은 / (B) 잃는다","(A) 아무 / (B) 유지한다"],"opts":["(A) fewer / (B) gain","(A) more / (B) gain","(A) more / (B) lose","(A) fewer / (B) lose","(A) no / (B) keep"],"r":{"a":"3) (A) more / (B) lose","ev":"6, 8, 9번 문장","s":[[6,"A stick of uncooked celery contains about five calories.","익히지 않은 셀러리 한 대는 약 5칼로리를 포함한다."],[8,"But the body burns more than five calories to digest it.","그러나 몸은 그것을 소화하기 위해 5칼로리 넘게 태운다."],[9,"So, you actually lose calories overall.","그러므로 당신은 사실 전체적으로는 칼로리를 잃는 셈이다."]],"w":"6번 셀러리는 5칼로리, 8번 몸은 5칼로리보다 더 많이(more) 태워요. 그래서 9번처럼 전체적으로는 칼로리를 잃어요(lose).","c":3},"h":"f2850fecb4"},{"n":10,"t":"fill","q":"Negative calorie foods [A] your body to lose calories when you [B] and digest them.","ko":"네거티브 칼로리 음식은 당신이 그것들을 [B]하고 소화할 때 몸이 칼로리를 잃도록 [A].","bank":["cause","eat","burn","gain","weigh","store"],"bko":{"cause":"~하게 하다","eat":"먹다","burn":"태우다","gain":"얻다","store":"저장하다","weigh":"무게를 재다"},"r":{"a":"[A] cause, [B] eat","ev":"3번 문장","s":[[3,"These foods cause your body to lose calories when you eat and digest them.","이 음식들은 당신이 그것들을 먹고 소화할 때, 당신의 몸이 칼로리를 잃게 한다."]],"w":"3번 These foods cause your body to lose calories when you eat and digest them에서 가져왔어요. gain은 몸이 잃는다는 내용과 반대이고, burn·weigh·store는 [A]나 [B] 자리에 뜻이 맞지 않아요.","c":null},"h":"40857ceb4d"}]},{"u":10,"id":"nl1-10-2","no":2,"ko":"상어의 고된 휴식","items":[{"n":1,"t":"tf","q":"Sharks need time to rest like any other animal.","ko":"상어는 다른 여느 동물처럼 휴식을 취할 시간이 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Sharks need time to rest like any other animal, but their sleep is very different from ours.","상어는 다른 여느 동물들처럼 휴식을 취할 시간이 필요하지만, 그들의 잠은 우리의 잠과 매우 다르다."]],"w":"2번 문장 그대로예요(Sharks need time to rest like any other animal).","c":"T"},"h":"730de568a2"},{"n":2,"t":"tf","q":"Sharks can lie down and close their eyes like humans.","ko":"상어는 인간처럼 누워서 눈을 감을 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Unlike humans, sharks can’t lie down and close their eyes.","인간과 달리, 상어는 누워서 눈을 감을 수 없다."]],"w":"3번 문장에서 인간과 달리(Unlike humans) 상어는 누워서 눈을 감을 수 없다고 해요.","c":"F"},"h":"ac7867aab7"},{"n":3,"t":"tf","q":"Yo-yo swimming is what sharks do when they want to sleep.","ko":"요요 헤엄은 상어가 잠을 자고 싶을 때 하는 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When sharks want to sleep, they do something called yo-yo swimming.","상어가 잠을 자고 싶을 때, 그들은 요요 헤엄이라고 불리는 것을 한다."]],"w":"6번 문장에서 상어가 자고 싶을 때 요요 헤엄이라고 불리는 것을 한다고 해요.","c":"T"},"h":"529628dcf3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If they’re not swimming, they can’t breathe!)","ko":"그들이 헤엄치지 않으면, 그들은 숨을 쉴 수 없다! (breathe는 숨을 쉬다)","opts":["숨을 쉬다","잠을 자다","먹이를 먹다","눈을 감다"],"word":"breathe","r":{"a":"1) 숨을 쉬다","ev":"5번 문장","s":[[5,"If they’re not swimming, they can’t breathe!","그들이 헤엄치지 않으면, 그들은 숨을 쉴 수 없다!"]],"w":"헤엄을 안 치면 어떻게 되는지 말하는 문장이에요. 4번에서 계속 헤엄쳐야 한다고 한 이유가 5번이라서 breathe = 숨을 쉬다예요.","c":1},"h":"9e22112163"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This means that they stop actively swimming and let themselves slowly sink to the bottom of the ocean.)","ko":"이것은 그들이 활발하게 헤엄치기를 멈추고 자신을 바다 밑바닥으로 천천히 가라앉게 하는 것을 의미한다. (sink는 가라앉다)","opts":["떠오르다","가라앉다","달리다","날아가다"],"word":"sink","r":{"a":"2) 가라앉다","ev":"7번 문장","s":[[7,"This means that they stop actively swimming and let themselves slowly sink to the bottom of the ocean.","이것은 그들이 활발하게 헤엄치기를 멈추고 자신을 바다 밑바닥으로 천천히 가라앉게 하는 것을 의미한다."]],"w":"바다 밑바닥(bottom)으로 천천히 내려간다는 말이에요. 8번의 swim back up(다시 올라오다)과 반대로 sink = 가라앉다예요.","c":2},"h":"994786f825"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis means that they stop actively swimming and let themselves slowly sink to the bottom of the ocean.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 그들이 활발하게 헤엄치기를 멈추고 자신을 바다 밑바닥으로 천천히 가라앉게 하는 것을 의미한다.","opts":["상어가 숨을 쉬는 것","요요 헤엄","상어가 눈을 감는 것","바다 밑바닥"],"r":{"a":"2) 요요 헤엄","ev":"6~7번 문장","s":[[6,"When sharks want to sleep, they do something called yo-yo swimming.","상어가 잠을 자고 싶을 때, 그들은 요요 헤엄이라고 불리는 것을 한다."],[7,"This means that they stop actively swimming and let themselves slowly sink to the bottom of the ocean.","이것은 그들이 활발하게 헤엄치기를 멈추고 자신을 바다 밑바닥으로 천천히 가라앉게 하는 것을 의미한다."]],"w":"This는 바로 앞 6번에서 나온 yo-yo swimming(요요 헤엄)을 가리켜요. 이어서 요요 헤엄이 무슨 뜻인지 설명해요.","c":2},"h":"a965b2e267"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While the sharks are slowly sinking towards the bottom of the ocean, they are able to get some sleep.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"상어가 바다 바닥을 향해 천천히 가라앉는 동안, 잠을 잘 수 있다.","opts":["상어는 바다 바닥에 닿은 뒤에만 잠을 잔다.","상어는 가라앉는 동안 잠을 잘 수 있다.","상어는 수면으로 올라가는 동안 잠을 잔다.","상어는 잠을 자지 않고 계속 가라앉는다."],"r":{"a":"2) 상어는 가라앉는 동안 잠을 잘 수 있다.","ev":"9번 문장","s":[[9,"While the sharks are slowly sinking towards the bottom of the ocean, they are able to get some sleep.","상어가 바다 바닥을 향해 천천히 가라앉는 동안, 잠을 잘 수 있다."]],"w":"While은 ~하는 동안이라는 뜻이에요. 바닥으로 천천히 가라앉는 동안 잠을 잘 수 있다는 내용이에요.","c":2},"h":"a36133a777"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["상어는 움직이지 않고 모래 위에서 잔다.","상어는 가라앉은 뒤 다시 헤엄쳐 올라오고 또 가라앉는다.","상어는 헤엄치지 않고도 숨을 쉴 수 있다.","상어는 수면까지 빠르게 헤엄치는 동안 잔다."],"opts":["Sharks sleep on the sand without moving.","Sharks swim back up after sinking and sink again.","Sharks can breathe without swimming.","Sharks sleep while swimming fast to the surface."],"r":{"a":"2) Sharks swim back up after sinking and sink again.","ev":"5, 8번 문장","s":[[5,"If they’re not swimming, they can’t breathe!","그들이 헤엄치지 않으면, 그들은 숨을 쉴 수 없다!"],[8,"Then they swim back up to the surface and sink back down again.","그러고 나면 그들은 수면으로 다시 헤엄쳐 올라오다가 다시 아래로 가라앉는다."]],"w":"8번에서 상어는 수면으로 다시 헤엄쳐 올라온 뒤 다시 가라앉아요. 헤엄치지 않으면 숨을 쉴 수 없어요(5번).","c":2},"h":"95c33e8425"},{"n":9,"t":"sum","q":"Sharks need to keep (A) because they can’t (B) if they stop.","ko":"상어는 멈추면 (B) 수 없기 때문에 계속 (A) 해야 한다.","oko":["(A) 자야 / (B) 헤엄칠","(A) 헤엄쳐야 / (B) 잘","(A) 누워 있어야 / (B) 숨 쉴","(A) 헤엄쳐야 / (B) 숨 쉴","(A) 먹어야 / (B) 숨 쉴"],"opts":["(A) sleeping / (B) swim","(A) swimming / (B) sleep","(A) lying / (B) breathe","(A) swimming / (B) breathe","(A) eating / (B) breathe"],"r":{"a":"4) (A) swimming / (B) breathe","ev":"4~5번 문장","s":[[4,"They need to keep swimming.","그들은 계속 헤엄을 쳐야 한다."],[5,"If they’re not swimming, they can’t breathe!","그들이 헤엄치지 않으면, 그들은 숨을 쉴 수 없다!"]],"w":"4번에서 상어는 계속 헤엄쳐야(keep swimming) 하고, 5번에서 헤엄치지 않으면 숨을 쉴 수 없다(can't breathe)고 해요.","c":4},"h":"a7150da6ec"},{"n":10,"t":"fill","q":"Sharks slowly [A] to the bottom of the ocean, and then swim back up to the [B].","ko":"상어는 바다 밑바닥으로 천천히 [A], 그러고 나서 [B]로 다시 헤엄쳐 올라온다.","bank":["sink","surface","sleep","breathe","rest","human"],"bko":{"sink":"가라앉다","surface":"수면","sleep":"자다","breathe":"숨 쉬다","rest":"휴식","human":"인간"},"r":{"a":"[A] sink, [B] surface","ev":"7~8번 문장","s":[[7,"This means that they stop actively swimming and let themselves slowly sink to the bottom of the ocean.","이것은 그들이 활발하게 헤엄치기를 멈추고 자신을 바다 밑바닥으로 천천히 가라앉게 하는 것을 의미한다."],[8,"Then they swim back up to the surface and sink back down again.","그러고 나면 그들은 수면으로 다시 헤엄쳐 올라오다가 다시 아래로 가라앉는다."]],"w":"7번 slowly sink to the bottom of the ocean, 8번 swim back up to the surface에서 가져왔어요. breathe는 5번에서 헤엄치지 않으면 못 하는 일이라 이 문장과 맞지 않아요.","c":null},"h":"b98c89fb5e"}]},{"u":10,"id":"nl1-10-3","no":3,"ko":"우리 아기 머리카락에 무슨 일이?","items":[{"n":1,"t":"tf","q":"Many babies are born with a full head of hair.","ko":"많은 아기들이 머리에 머리카락이 가득 나 있는 채로 태어난다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Many babies are born with a full head of hair.","많은 아기들이 머리에 머리카락이 가득 나 있는 채로 태어난다."]],"w":"1번 문장 그대로예요(Many babies are born with a full head of hair).","c":"T"},"h":"c815b4794b"},{"n":2,"t":"tf","q":"After birth, the hormone levels rise and hair growth starts.","ko":"출생 후 호르몬 수치가 올라가고 머리카락의 성장이 시작된다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"After birth, the hormone levels drop and hair growth stops.","출생 후, 호르몬 수치는 떨어지고 머리카락의 성장은 멈춘다."]],"w":"6번 문장에서 출생 후에는 호르몬 수치가 떨어지고(drop) 머리카락의 성장이 멈춘다(stops)고 해요. 오르고 시작한다는 말은 반대예요.","c":"F"},"h":"aa635187c4"},{"n":3,"t":"tf","q":"The parents were very surprised when their son was born.","ko":"아들이 태어났을 때 부모는 매우 놀랐다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Of course, they were very surprised!","물론 그들은 매우 놀랐다!"]],"w":"12번 문장에서 부모는 매우 놀랐다(they were very surprised)고 해요. 이유는 아들의 머리카락이 부모와 달랐기 때문이에요.","c":"T"},"h":"ed0c1399da"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Although this may worry parents, it’s perfectly natural.)","ko":"이것이 부모를 걱정시키기도 하지만 그것은 지극히 정상적인 것이다. (perfectly는 지극히, 완전히)","opts":["조금","완전히","가끔","거의"],"word":"perfectly","r":{"a":"2) 완전히","ev":"3번 문장","s":[[3,"Although this may worry parents, it’s perfectly natural.","이것이 부모를 걱정시키기도 하지만 그것은 지극히 정상적인 것이다."]],"w":"부모가 걱정해도(Although) 아주 자연스러운 일이라는 말이에요. perfectly = 완전히, 지극히.","c":2},"h":"e73b72b2e0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (For example, one pair of parents recently had a son.)","ko":"예를 들면, 한 쌍의 부모가 최근에 아들을 얻었다. (recently는 최근에)","opts":["오래전에","최근에","언젠가","갑자기"],"word":"recently","r":{"a":"2) 최근에","ev":"9번 문장","s":[[9,"For example, one pair of parents recently had a son.","예를 들면, 한 쌍의 부모가 최근에 아들을 얻었다."]],"w":"For example(예를 들어)로 최근 있었던 한 부부의 이야기를 시작해요. recently = 최근에.","c":2},"h":"8c95ccf1ab"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nLater, when new hair starts to grow, it will often push out the old hair.","ko":"밑줄 친 it가 가리키는 것은?","sko":"나중에, 새 머리카락이 자라기 시작할 때 보통 이전에 있던 머리카락을 밀어내게 된다.","opts":["이전의 머리카락","새 머리카락","호르몬","부모님"],"r":{"a":"2) 새 머리카락","ev":"7번 문장","s":[[7,"Later, when new hair starts to grow, it will often push out the old hair.","나중에, 새 머리카락이 자라기 시작할 때 보통 이전
