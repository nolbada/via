],"w":"3번에서 유럽인들은 다른 이유(a different reason)로 미라에 매료되었다(were fascinated)고 해요.","c":1},"h":"fa073acb38"},{"n":10,"t":"fill","q":"However, by the 18th century, it became [A] that this strange remedy was not actually [B].","ko":"하지만 18세기 즈음, 이 이상한 치료법이 사실은 [B]지 않다는 것이 [A]해졌다.","bank":["clear","effective","ground","believed","specifically","gradually"],"bko":{"clear":"분명한","effective":"효과적인","ground":"갈아졌다(grind의 과거분사)","believed":"믿었다(believe의 과거)","specifically":"구체적으로","gradually":"점차"},"a":"[A] clear, [B] effective","r":{"a":"[A] clear (분명한), [B] effective (효과적인)","ev":"11번 문장","s":[[11,"However, by the 18th century, it became clear that this strange remedy was not actually effective.","하지만, 18세기 즈음, 이 이상한 치료법이 사실은 효과적이지 않다는 것이 분명해졌다."]],"w":"11번에서 it became clear that this strange remedy was not actually effective라고 했어요. became 뒤에는 형용사 clear, not actually 뒤에는 형용사 effective가 와요. specifically와 gradually는 부사예요.","c":null},"h":"a203addcb5"}]},{"u":2,"id":"hk4-02-1","no":1,"ko":"하늘에서 다이아몬드가 내려와\b","items":[{"n":1,"t":"tf","q":"Diamond dust is actually a cloud.","ko":"다이아몬드 더스트는 사실 구름이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It’s called diamond dust, but it’s actually a cloud!","그것은 다이아몬드 더스트라고 불리지만, 사실 구름이다!"]],"w":"2번에서 이름은 diamond dust지만 사실은 구름(a cloud)이라고 해요.","c":"T"},"h":"c954b58f4b"},{"n":2,"t":"tf","q":"Diamond dust crystals are bigger and heavier than snowflakes.","ko":"다이아몬드 더스트 결정은 눈송이보다 더 크고 무겁다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"These crystals resemble snowflakes when you look closely at them, but they are much smaller and lighter.","이 결정들은 자세히 보면 눈송이를 닮았지만, 훨씬 더 작고 가볍다."]],"w":"5번에서 결정은 눈송이를 닮았지만 훨씬 더 작고 가볍다(much smaller and lighter)고 해요. 크고 무겁다는 말은 반대예요.","c":"F"},"h":"b5ff85bd1e"},{"n":3,"t":"tf","q":"Diamond dust forms near the ground when moisture in the air freezes.","ko":"다이아몬드 더스트는 공기 중의 수증기가 얼 때 지면 근처에서 형성된다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Diamond dust forms near the ground when moisture in the air freezes.","다이아몬드 더스트는 대기 중의 수증기가 얼 때 지면 근처에서 형성된다."]],"w":"3번 문장이 그대로 이 내용이에요. 장소는 지면 근처, 때는 수증기가 얼 때예요.","c":"T"},"h":"f95c95b673"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These crystals resemble snowflakes when you look closely at them, ...)","ko":"이 결정들은 자세히 보면 눈송이를 ( ), ...","opts":["닮았다","먹는다","부순다","피한다"],"word":"resemble","r":{"a":"1) 닮았다","ev":"5번 문장","s":[[5,"These crystals resemble snowflakes when you look closely at them, but they are much smaller and lighter.","이 결정들은 자세히 보면 눈송이를 닮았지만, 훨씬 더 작고 가볍다."]],"w":"결정을 자세히 보면 눈송이와 비슷하게 생겼다는 뜻이에요. 뒤에 but이 나와서 '비슷하지만 훨씬 작고 가볍다'로 이어져요. resemble = 닮다.","c":1},"h":"411650f520"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (First of all, it has to be extremely cold—below -16°C—...)","ko":"우선, ... 영하 16도 이하로 ( ) 추워야 한다.","opts":["조금","가끔","몹시","거의"],"word":"extremely","r":{"a":"3) 몹시","ev":"9번 문장","s":[[9,"First of all, it has to be extremely cold—below -16°C—with high humidity under clear skies.","우선, 맑은 하늘 아래 높은 습도와 함께 영하 16도 이하로 몹시 추워야 한다."]],"w":"영하 16도 이하라는 말이 바로 뒤에 나오니 ‘조금’이 아니라 ‘몹시’ 추워야 해요. extremely = 몹시, 매우.","c":3},"h":"a34a5049af"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nIt consists of millions of tiny ice crystals that reflect sunlight like sparkling diamonds.","ko":"밑줄 친 that이 가리키는 것은?","sko":"그것은 반짝거리는 다이아몬드처럼 햇빛을 반사하는 수백만 개의 미세한 얼음 결정들로 이루어진다.","opts":["햇빛","수백만 개의 미세한 얼음 결정들","반짝거리는 다이아몬드","지면 근처의 공기"],"pron":"that","r":{"a":"2) 수백만 개의 미세한 얼음 결정들","ev":"4번 문장","s":[[4,"It consists of millions of tiny ice crystals that reflect sunlight like sparkling diamonds.","그것은 반짝거리는 다이아몬드처럼 햇빛을 반사하는 수백만 개의 미세한 얼음 결정들로 이루어진다."]],"w":"4번의 that은 바로 앞의 millions of tiny ice crystals(수백만 개의 미세한 얼음 결정들)를 가리켜요. 그 결정들이 햇빛을 반사한다는 말이에요.","c":2,"k":"that = 수백만 개의 미세한 얼음 결정들"},"h":"fc896015e3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Only a few places in the world have the necessary conditions for diamond dust to form.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"세계에서 오직 몇몇 장소들만이 다이아몬드 더스트가 형성될 필수 조건들을 갖고 있다.","opts":["세계 곳곳에서 다이아몬드 더스트를 쉽게 볼 수 있다.","세계에서 다이아몬드 더스트가 생길 조건을 갖춘 곳은 몇 군데뿐이다.","다이아몬드 더스트는 몇몇 장소에서만 사라진다.","다이아몬드 더스트가 몇몇 장소를 새로 만든다."],"r":{"a":"2) 세계에서 다이아몬드 더스트가 생길 조건을 갖춘 곳은 몇 군데뿐이다.","ev":"8번 문장","s":[[8,"Only a few places in the world have the necessary conditions for diamond dust to form.","세계에서 오직 몇몇 장소들만이 다이아몬드 더스트가 형성될 필수 조건들을 갖고 있다."]],"w":"Only a few places는 '오직 몇몇 장소'예요. 형성될 조건(necessary conditions)을 갖춘 곳이 드물다는 뜻이에요.","c":2},"h":"a5e9d33ee3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["다이아몬드 더스트를 보는 것이 항상 쉬운 것은 아니다.","다이아몬드 더스트는 세계 어디에서나 쉽게 볼 수 있다.","다이아몬드 더스트는 여름에만 볼 수 있다.","아무도 다이아몬드 더스트를 보고 싶어 하지 않는다."],"opts":["It is not always easy to see diamond dust.","Diamond dust is easy to see anywhere in the world.","Diamond dust can be seen only in the summer.","Nobody wants to see diamond dust."],"r":{"a":"1) It is not always easy to see diamond dust. (다이아몬드 더스트를 보는 것이 항상 쉬운 것은 아니다.)","ev":"7번 문장","s":[[7,"Unfortunately, it is not always easy to see diamond dust.","불행히도, 다이아몬드 더스트를 보는 것이 항상 쉬운 것은 아니다."]],"w":"7번에서 다이아몬드 더스트를 보는 것이 항상 쉬운 것은 아니라고 했어요. 8번에서는 몇몇 장소에서만 볼 수 있다고 했으니 어디에서나 볼 수 있다는 말은 틀려요.","c":1},"h":"2ec6418496"},{"n":9,"t":"sum","q":"Diamond dust is as (A) as a diamond, and its crystals (B) in the air rather than fall to the ground.","ko":"다이아몬드 더스트는 다이아몬드만큼 (A) 먼지이고, 그 결정들은 땅에 떨어지기보다 공중에 (B).","oko":["(A) 희귀한 / (B) 뜬다","(A) 희귀한 / (B) 가라앉는다","(A) 흔한 / (B) 뜬다","(A) 흔한 / (B) 가라앉는다","(A) 무거운 / (B) 가라앉는다"],"opts":["(A) rare / (B) float","(A) rare / (B) sink","(A) common / (B) float","(A) common / (B) sink","(A) heavy / (B) sink"],"r":{"a":"1) (A) rare / (B) float ((A) 희귀한 / (B) 뜬다)","ev":"1번, 6번 문장","s":[[1,"There is a type of “dust” that is as rare as a diamond.","다이아몬드만큼 희귀한 일종의 ‘먼지’가 있다."],[6,"So, they float in the air rather than fall to the ground.","그래서, 그것들은 땅에 떨어지기보다는 공중에 뜬다."]],"w":"1번에서 다이아몬드 더스트는 다이아몬드만큼 희귀하다(rare)고 했고, 6번에서 그 결정들이 땅에 떨어지기보다 공중에 뜬다(float)고 해요.","c":1},"h":"3f3963a54a"},{"n":10,"t":"fill","q":"Also, there should be no [A], otherwise, the water [B] will be blown away.","ko":"또한, [A]이(가) 없어야 하는데, 그렇지 않으면 물 [B]이(가) 날아갈 것이다.","bank":["wind","vapor","melt","reflect","resemble","consist"],"bko":{"wind":"바람","vapor":"증기","melt":"녹다","reflect":"반사하다","resemble":"닮다","consist":"이루어지다"},"a":"[A] wind, [B] vapor","r":{"a":"[A] wind (바람), [B] vapor (증기)","ev":"10번 문장","s":[[10,"Also, there should be no wind, otherwise, the water vapor will be blown away.","또한, 바람이 없어야 하는데, 그렇지 않으면, 수증기가 날아갈 것이다."]],"w":"10번에서 there should be no wind, otherwise, the water vapor will be blown away라고 했어요. no 뒤와 water 뒤에는 명사가 와야 해요. float·reflect·resemble·consist는 동사예요.","c":null},"h":"15d24cb92a"}]},{"u":2,"id":"hk4-02-2","no":2,"ko":"걸을 수 없다면 뛰겠어!\b","items":[{"n":1,"t":"tf","q":"Wilma Rudolph’s left leg became paralyzed when she was five.","ko":"윌마 루돌프의 왼쪽 다리는 그녀가 다섯 살 때 마비되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"At age five, her left leg became paralyzed due to polio.","5살 때, 그녀의 왼쪽 다리가 소아마비 때문에 마비되었다."]],"w":"7번에서 5살 때 소아마비 때문에 왼쪽 다리가 마비되었다고 해요.","c":"T"},"h":"f3f895d256"},{"n":2,"t":"tf","q":"Wilma won a gold medal at her first Olympics.","ko":"윌마는 첫 올림픽에서 금메달을 땄다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"In 1956, she went to her first Olympics and won a bronze medal.","1956년에, 그녀는 첫 올림픽에 나가서 동메달을 땄다."]],"w":"13번에서 1956년 첫 올림픽에서 딴 것은 동메달(bronze medal)이에요. 금메달 3개는 4년 뒤 올림픽(14번)에서 땄어요.","c":"F"},"h":"0175f258c8"},{"n":3,"t":"tf","q":"Wilma wore a heavy brace to strengthen her leg muscles.","ko":"윌마는 다리 근육을 강화하기 위해 무거운 보조기를 착용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"To strengthen her leg muscles, she began wearing a heavy brace on her leg.","다리 근육을 강화하기 위해, 그녀는 다리에 무거운 보조기를 착용하기 시작했다."]],"w":"9번에서 To strengthen her leg muscles, she began wearing a heavy brace on her leg라고 해요.","c":"T"},"h":"26a8a00789"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (At age five, her left leg became paralyzed due to polio.)","ko":"5살 때, 그녀의 왼쪽 다리가 소아마비 때문에 ( ).","opts":["마비되었다","길어졌다","강해졌다","나았다"],"word":"paralyzed","r":{"a":"1) 마비되었다","ev":"7~8번 문장","s":[[7,"At age five, her left leg became paralyzed due to polio.","5살 때, 그녀의 왼쪽 다리가 소아마비 때문에 마비되었다."],[8,"Despite this, Wilma refused to give up.","이런데도 불구하고, 윌마는 포기하기를 거부했다."]],"w":"다리가 소아마비 때문에 움직일 수 없게 되었다는 뜻이에요. 그런데도 포기하지 않았다(8번)는 흐름이라 좋은 일이 아니에요. paralyze = 마비시키다.","c":1},"h":"dab87d3db3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Despite this, Wilma refused to give up.)","ko":"이런데도 불구하고, 윌마는 포기하기를 ( ).","opts":["기뻐했다","잊었다","시도했다","거부했다"],"word":"refused","r":{"a":"4) 거부했다","ev":"8번 문장","s":[[8,"Despite this, Wilma refused to give up.","이런데도 불구하고, 윌마는 포기하기를 거부했다."]],"w":"Despite this(이런데도 불구하고) 뒤라서, 포기하라는 압박에도 포기하기를 거부했다는 뜻이에요. refuse = 거부하다.","c":4},"h":"8f029a9cf4"},{"n":6,"t":"ref","q":"What does the underlined \"there\" refer to?\nBut she didn’t stop there.","ko":"밑줄 친 there가 가리키는 것은?","sko":"하지만 그녀는 거기에서 멈추지 않았다.","opts":["보조기를 벗고 혼자서 걸을 수 있게 된 단계","1956년의 올림픽 경기장","병원의 치료실","올림픽의 시상대"],"r":{"a":"1) 보조기를 벗고 혼자서 걸을 수 있게 된 단계","ev":"10~11번 문장","s":[[10,"After several years of treatment, she was finally able to take the brace off and walk on her own.","몇 년의 치료 후에, 그녀는 마침내 보조기를 벗고 혼자서 걸을 수 있었다."],[11,"But she didn’t stop there.","하지만 그녀는 거기에서 멈추지 않았다."]],"w":"11번의 there는 장소가 아니라 앞 10번의 단계예요. 보조기를 벗고 혼자서 걸을 수 있게 된 것에서 멈추지 않고 달리기까지 나아갔어요.","c":1},"h":"49440e1825"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"She started to practice running and pursued her dream of becoming an athlete.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그녀는 달리기를 연습하기 시작했고 육상 선수가 되려는 그녀의 꿈을 추구했다.","opts":["그녀는 달리기를 그만두고 다른 꿈을 찾았다.","그녀는 달리기 연습을 시작했고 육상 선수가 되려는 꿈을 좇았다.","그녀는 육상 선수를 가르치는 학교를 세웠다.","그녀는 연습 없이도 육상 선수가 되었다."],"r":{"a":"2) 그녀는 달리기 연습을 시작했고 육상 선수가 되려는 꿈을 좇았다.","ev":"12번 문장","s":[[12,"She started to practice running and pursued her dream of becoming an athlete.","그녀는 달리기를 연습하기 시작했고 육상 선수가 되려는 그녀의 꿈을 추구했다."]],"w":"pursue one's dream은 '꿈을 좇다'예요. her dream of becoming an athlete는 '육상 선수가 되려는 꿈'이라는 뜻이에요.","c":2},"h":"d8fdd97631"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["윌마는 태어날 때부터 건강하고 튼튼했다.","윌마는 태어났을 때 약했다.","윌마는 아기 때 가장 빠른 달리기 선수였다.","윌마는 어린 시절에 한 번도 아픈 적이 없다."],"opts":["Wilma was born healthy and strong.","Wilma was weak when she was born.","Wilma was the fastest runner as a baby.","Wilma never got sick as a child."],"r":{"a":"2) Wilma was weak when she was born. (윌마는 태어났을 때 약했다.)","ev":"5번 문장","s":[[5,"Wilma was born premature and weak.","윌마는 예정보다 일찍 태어나 약했다."]],"w":"5번에서 윌마는 예정보다 일찍 태어나 약했다고 해요. 6번에서 어린 시절 내내 수많은 병을 앓았다고 했으니 한 번도 아프지 않았다는 말은 틀려요.","c":2},"h":"e3077346e6"},{"n":9,"t":"sum","q":"Wilma’s (A) teaches us that nothing is (B) if we have the will.","ko":"윌마의 (A)은(는) 우리에게 의지가 있다면 (B) 것은 없다는 것을 가르쳐 준다.","oko":["(A) 결의 / (B) 불가능한","(A) 결의 / (B) 쉬운","(A) 두려움 / (B) 불가능한","(A) 두려움 / (B) 쉬운","(A) 행운 / (B) 쉬운"],"opts":["(A) determination / (B) impossible","(A) determination / (B) easy","(A) fear / (B) impossible","(A) fear / (B) easy","(A) luck / (B) easy"],"r":{"a":"1) (A) determination / (B) impossible ((A) 결의 / (B) 불가능한)","ev":"15번 문장","s":[[15,"Her determination teaches us that nothing is impossible if we have the will.","그녀의 결의는 우리에게 의지가 있다면 불가능한 것은 없다는 것을 가르쳐준다."]],"w":"15번에서 그녀의 결의(determination)는 의지가 있다면 불가능한(impossible) 것은 없다는 것을 가르쳐 준다고 해요.","c":1},"h":"0ee8a26b07"},{"n":10,"t":"fill","q":"She [A] from numerous [B] throughout childhood.","ko":"그녀는 어린 시절 내내 수많은 [B]을(를) [A].","bank":["suffered","diseases","treatment","athlete","pursued","strengthen"],"bko":{"suffered":"앓았다, 고통받았다(suffer의 과거)","diseases":"병들","treatment":"치료","athlete":"운동선수","pursued":"추구했다(pursue의 과거)","strengthen":"강화하다"},"a":"[A] suffered, [B] diseases","r":{"a":"[A] suffered (앓았다, 고통받았다(suffer의 과거)), [B] diseases (병들)","ev":"6번 문장","s":[[6,"She suffered from numerous diseases throughout childhood.","그녀는 어린 시절 내내 수많은 병들을 앓았다."]],"w":"6번에서 She suffered from numerous diseases throughout childhood라고 했어요. 주어 She 뒤에는 과거형 동사 suffered, numerous 뒤에는 복수 명사 diseases가 와요. disease의 복수형이 diseases예요.","c":null},"h":"be63dbbb1f"}]},{"u":2,"id":"hk4-02-3","no":3,"ko":"모두가 “예”를 외칠 때 나는?\b","items":[{"n":1,"t":"tf","q":"Before the experiment, all but one friend are told to answer line 1.","ko":"실험 전에, 한 명을 제외한 모든 친구들은 직선 1이라고 답하라는 말을 듣는다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But, beforehand, tell all but one friend to answer line 1.","그러나, 사전에, 한 친구를 제외하고 모두에게 직선 1로 답하라고 말해둬라."]],"w":"3번에서 beforehand(사전에) 한 친구를 제외하고 모두에게 직선 1로 답하라고 말해 둔다고 해요.","c":"T"},"h":"84c40a4853"},{"n":2,"t":"tf","q":"Conformity is a tendency to stand out from a group.","ko":"동조는 집단에서 눈에 띄려는 성향이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Conformity is a tendency to change our opinions or behavior in order to fit in with a group.","동조는 집단과 어울리기 위해 우리의 의견이나 행동을 바꾸려는 성향이다."]],"w":"7번에서 동조는 집단과 어울리기 위해(fit in with a group) 의견이나 행동을 바꾸려는 성향이라고 해요. 눈에 띄려는 것과 반대예요.","c":"F"},"h":"94ae0ed4cd"},{"n":3,"t":"tf","q":"We will likely follow those who are higher in status.","ko":"우리는 아마 지위가 더 높은 사람들을 따를 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Also, we will likely follow those who are higher in status.","또한, 우리는 아마 더 높은 지위에 있는 사람들을 따를 것이다."]],"w":"12번 문장이 그대로 이 내용이에요. those who are higher in status는 지위가 더 높은 사람들이에요.","c":"T"},"h":"969290b38d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Conformity is a tendency to change our opinions or behavior in order to fit in with a group.)","ko":"동조는 집단과 어울리기 위해 우리의 의견이나 행동을 바꾸려는 ( )이다.","opts":["성향","능력","실수","약속"],"word":"tendency","r":{"a":"1) 성향","ev":"6~7번 문장","s":[[6,"This is because of conformity.","이것은 동조 때문이다."],[7,"Conformity is a tendency to change our opinions or behavior in order to fit in with a group.","동조는 집단과 어울리기 위해 우리의 의견이나 행동을 바꾸려는 성향이다."]],"w":"6번에서 정답을 알면서도 틀린 답을 따르는 일을 동조 때문이라고 하고, 7번에서 동조가 무엇인지 풀어 줘요. tendency = 성향, 경향.","c":1},"h":"78543c363c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most of us don’t like to stand out, so we often follow what the majority does.)","ko":"우리들 중 대부분은 눈에 띄는 것을 좋아하지 않아서, ( )가 하는 것을 종종 따른다.","opts":["다수","소수","전문가","선생님"],"word":"majority","r":{"a":"1) 다수","ev":"8번 문장","s":[[8,"Most of us don’t like to stand out, so we often follow what the majority does.","우리들 중 대부분은 눈에 띄는 것을 좋아하지 않아서, 다수가 하는 것을 종종 따른다."]],"w":"눈에 띄기 싫어서 따르는 대상이니 다수예요. 11번의 go along with the majority, 13번의 majority opinion(다수 의견)도 같은 뜻이에요. majority = 다수.","c":1},"h":"3e18665470"},{"n":6,"t":"ref","q":"What does the underlined \"he or she\" refer to?\nSurprisingly, the friend you didn’t tell might answer line 1 too, even though he or she knows the correct answer is line 3!","ko":"밑줄 친 he or she가 가리키는 것은?","sko":"놀랍게도, 당신이 말해주지 않았던 친구 또한, 비록 정답이 직선 3이라는 것을 알고 있더라도 직선 1이라고 답할 수도 있다.","opts":["그림을 보여 준 사람","틀린 답을 하라고 미리 들은 친구들","실험을 지켜보는 사람","미리 말을 듣지 못한 한 친구"],"r":{"a":"4) 미리 말을 듣지 못한 한 친구","ev":"5번 문장","s":[[5,"Surprisingly, the friend you didn’t tell might answer line 1 too, even though he or she knows the correct answer is line 3!","놀랍게도, 당신이 말해주지 않았던 친구 또한, 비록 정답이 직선 3이라는 것을 알고 있더라도 직선 1이라고 답할 수도 있다."]],"w":"he or she는 바로 앞의 the friend you didn’t tell(당신이 말해 주지 않았던 친구)이에요. 이 친구만 틀린 답을 하라는 말을 못 들어서 정답이 3인 걸 알아요.","c":4},"h":"2f1b19c2f3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The greater the emotional bond we feel with the group, the more strongly we conform.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리가 집단에 느끼는 정서적 유대가 클수록, 우리는 더 강하게 동조한다.","opts":["집단과의 유대가 클수록 우리는 동조를 덜 한다.","집단이 클수록 우리는 더 강하게 동조한다.","집단에 느끼는 정서적 유대가 클수록 더 강하게 동조한다.","동조를 많이 할수록 집단과의 유대가 약해진다."],"r":{"a":"3) 집단에 느끼는 정서적 유대가 클수록 더 강하게 동조한다.","ev":"9번 문장","s":[[9,"The greater the emotional bond we feel with the group, the more strongly we conform.","우리가 집단에 느끼는 정서적 유대가 클수록, 우리는 더 강하게 동조한다."]],"w":"the + 비교급 ~, the + 비교급 …은 ‘~할수록 더 …하다’예요. 유대(bond)가 커질수록 동조(conform)도 강해진다는 뜻이고, 집단의 크기 이야기는 없어요.","c":3},"h":"da6140d8c3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사람들은 눈에 띄는 것을 좋아해서 다수와 다르게 행동한다.","결정을 내리기 어려울 때 우리는 다수를 따르는 경향이 있다.","동조는 지위와 전혀 관계가 없다.","한 명이 다수 의견에 반대하면 동조가 더 강해진다."],"opts":["People like to stand out, so they act differently from the majority.","When it is hard to make a decision, we tend to go along with the majority.","Conformity has nothing to do with status.","If one person disagrees with the majority, conformity gets stronger."],"r":{"a":"2) When it is hard to make a decision, we tend to go along with the majority. (결정을 내리기 어려울 때 우리는 다수를 따르는 경향이 있다.)","ev":"11번 문장","s":[[11,"When it is difficult to make a decision, we tend to go along with the majority.","결정을 내리기 어려울 때, 우리는 다수에 동조하는 경향이 있다."]],"w":"11번에서 결정을 내리기 어려울 때 다수에 동조하는 경향이 있다고 해요. 대부분은 눈에 띄는 것을 싫어하고(8번), 지위가 높은 사람을 따르며(12번), 한 명이라도 반대하면 동조가 무너질 수 있어요(13번).","c":2},"h":"e9c581ed60"},{"n":9,"t":"sum","q":"In the experiment, you (A) what happens when everyone else gives the (B) answer.","ko":"실험에서 당신은 다른 모든 사람이 (B) 대답을 할 때 무슨 일이 일어나는지 (A).","oko":["(A) 관찰한다 / (B) 틀린","(A) 관찰한다 / (B) 맞는","(A) 잊는다 / (B) 틀린","(A) 잊는다 / (B) 맞는","(A) 무시한다 / (B) 맞는"],"opts":["(A) observe / (B) wrong","(A) observe / (B) correct","(A) forget / (B) wrong","(A) forget / (B) correct","(A) ignore / (B) correct"],"r":{"a":"1) (A) observe / (B) wrong ((A) 관찰한다 / (B) 틀린)","ev":"4번 문장","s":[[4,"Then, observe what happens when everyone else gives the wrong answer.","그 다음, 다른 모든 사람이 틀린 대답을 할 때 무슨 일이 일어나는지 봐라."]],"w":"4번에서 다른 모든 사람이 틀린(wrong) 대답을 할 때 무슨 일이 일어나는지 관찰하라(observe)고 해요.","c":1},"h":"c083d516d0"},{"n":10,"t":"fill","q":"On the other hand, conformity can [A] down if even one [B] of the group disagrees with the majority opinion.","ko":"반면에, 집단의 [B] 한 명이라도 다수 의견에 동의하지 않는다면 동조는 [A] 수 있다.","bank":["break","member","follow","bond","avoid","influence"],"bko":{"break":"무너지다, 깨지다","member":"구성원","follow":"따르다","bond":"유대","avoid":"피하다","influence":"영향을 주다"},"a":"[A] break, [B] member","r":{"a":"[A] break (무너지다, 깨지다), [B] member (구성원)","ev":"13번 문장","s":[[13,"On the other hand, conformity can break down if even one member of the group disagrees with the majority opinion.","반면에, 만약 집단의 구성원 중 한 명이라도 다수 의견에 동의하지 않는다면 동조는 무너질 수 있다."]],"w":"13번에서 conformity can break down if even one member of the group disagrees with the majority opinion이라고 했어요. can 뒤에는 동사원형 break, one 뒤에는 명사 member가 와요.","c":null},"h":"161b3af557"}]},{"u":2,"id":"hk4-02-4","no":4,"ko":"사랑하면 나오나요? \b","items":[{"n":1,"t":"tf","q":"Wisdom teeth usually come out after the age of 17.","ko":"사랑니는 보통 17살 이후에 난다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They emerge when you’re older, usually after the age of 17.","그것들은 보통 17살 이후로, 당신이 나이가 더 들면 나온다."]],"w":"2번에서 그것들은 보통 17살 이후, 나이가 더 들면 나온다고 해요.","c":"T"},"h":"cf359c451d"},{"n":2,"t":"tf","q":"Our ancestors used their wisdom teeth to eat soft food.","ko":"우리의 선조들은 부드러운 음식을 먹기 위해 사랑니를 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"However, several million years ago, our ancestors used their wisdom teeth to eat tough roots, leaves, and raw meat.","하지만, 수백만 년 전에, 우리의 선조들은 질긴 뿌리, 이파리, 그리고 날고기를 먹기 위해 사랑니를 사용했다."]],"w":"6번에서 선조들은 질긴 뿌리, 이파리, 날고기를 먹기 위해 사랑니를 사용했다고 해요. 부드러운 음식이 아니에요.","c":"F"},"h":"3f320fdac9"},{"n":3,"t":"tf","q":"More and more people these days don’t get wisdom teeth in their life.","ko":"오늘날 점점 더 많은 사람들이 평생 사랑니가 나지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"In fact, more and more people these days don’t get wisdom teeth throughout their life!","실제로, 오늘날 점점 더 많은 사람들이 평생 사랑니가 나지 않는다!"]],"w":"11번에서 more and more people these days don’t get wisdom teeth throughout their life라고 해요.","c":"T"},"h":"26325c804e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They emerge when you’re older, usually after the age of 17.)","ko":"그것들은 보통 17살 이후로, 당신이 나이가 더 들면 ( ).","opts":["나온다","사라진다","부러진다","줄어든다"],"word":"emerge","r":{"a":"1) 나온다","ev":"1~2번 문장","s":[[1,"Do you know that you have teeth in the back of your mouth that haven’t come out yet?","당신은 입 뒤쪽에 아직 나지 않은 치아가 있다는 것을 알고 있는가?"],[2,"They emerge when you’re older, usually after the age of 17.","그것들은 보통 17살 이후로, 당신이 나이가 더 들면 나온다."]],"w":"1번에서 ‘아직 나지 않은(haven’t come out yet) 치아’라고 했고, 2번의 emerge가 그 치아가 나오는 일을 말해요. emerge = 나오다.","c":1},"h":"71a788fa5a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (..., our ancestors used their wisdom teeth to eat tough roots, leaves, and raw meat.)","ko":"..., 우리의 선조들은 ( ) 뿌리, 이파리, 그리고 날고기를 먹기 위해 사랑니를 사용했다.","opts":["부드러운","달콤한","질긴","뜨거운"],"word":"tough","r":{"a":"3) 질긴","ev":"6~8번 문장","s":[[6,"However, several million years ago, our ancestors used their wisdom teeth to eat tough roots, leaves, and raw meat.","하지만, 수백만 년 전에, 우리의 선조들은 질긴 뿌리, 이파리, 그리고 날고기를 먹기 위해 사랑니를 사용했다."],[7,"Their jaws were also much larger, providing plenty of room in the mouth for wisdom teeth.","그들의 턱은 또한 훨씬 더 커서, 입안에 사랑니를 위한 충분한 공간을 제공했다."],[8,"However, as humans started to use fire for cooking, food became softer and easier to chew.","하지만, 인간이 요리를 위해 불을 사용하기 시작함에 따라, 음식은 더 부드럽고 씹기 쉬워졌다."]],"w":"8번에서 불로 요리하자 음식이 더 부드럽고 씹기 쉬워졌다고 하니, 그 전의 음식은 질겼어요. tough = 질긴.","c":3},"h":"3a8a684fb6"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThis is why they are called wisdom teeth.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이것이 그것들이 지혜의 치아(사랑니)라고 불리는 이유이다.","opts":["사랑니들","우리의 선조들","치과 의사들","17살 이후의 사람들"],"pron":"they","r":{"a":"1) 사랑니들","ev":"4번 문장","s":[[4,"This is why they are called wisdom teeth.","이것이 그것들이 지혜의 치아(사랑니)라고 불리는 이유이다."]],"w":"4번의 they는 지혜의 치아라고 불리는 대상, 즉 사랑니(wisdom teeth)예요. 이 나이가 되면 지혜를 얻는다고 해서 지혜의 치아(wisdom teeth)라고 불린다는 말이에요.","c":1,"k":"they = 사랑니들"},"h":"7e63d266df"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, our jaws became smaller over time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로, 우리의 턱은 시간이 지나면서 더 작아졌다.","opts":["그 결과 우리의 턱은 시간이 지나면서 더 커졌다.","그 결과 우리의 턱은 시간이 지나면서 더 작아졌다.","그 결과 우리는 시간이 갈수록 음식을 더 오래 씹었다.","그 결과 우리의 이는 시간이 지나면서 더 많이 났다."],"r":{"a":"2) 그 결과 우리의 턱은 시간이 지나면서 더 작아졌다.","ev":"8~9번 문장","s":[[8,"However, as humans started to use fire for cooking, food became softer and easier to chew.","하지만, 인간이 요리를 위해 불을 사용하기 시작함에 따라, 음식은 더 부드럽고 씹기 쉬워졌다."],[9,"As a result, our jaws became smaller over time.","결과적으로, 우리의 턱은 시간이 지나면서 더 작아졌다."]],"w":"over time은 ‘시간이 지나면서’이고 smaller는 ‘더 작은’이에요. 8번에서 음식이 부드러워져 턱이 크지 않아도 됐기 때문이에요.","c":2},"h":"e4c691a0f9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우리는 이제 사랑니를 위한 충분한 공간이 사실상 없다.","우리는 이제 사랑니를 위한 공간이 훨씬 더 많다.","모든 사람은 열 살에 사랑니가 난다.","사랑니는 오늘날 우리가 날고기를 먹도록 돕는다."],"opts":["We don’t really have enough space for wisdom teeth now.","We have much more space for wisdom teeth now.","Everyone gets wisdom teeth at the age of ten.","Wisdom teeth help us eat raw meat today."],"r":{"a":"1) We don’t really have enough space for wisdom teeth now. (우리는 이제 사랑니를 위한 충분한 공간이 사실상 없다.)","ev":"10번 문장","s":[[10,"Now, we don’t really have enough space for wisdom teeth.","이제, 우리는 사실상 사랑니를 위한 충분한 공간을 갖고 있지 않다."]],"w":"10번에서 이제 사랑니를 위한 충분한 공간이 없다고 했어요. 11번에서는 점점 더 많은 사람이 평생 사랑니가 나지 않는다고 해요.","c":1},"h":"431f2505d3"},{"n":9,"t":"sum","q":"Their jaws were also much (A), providing plenty of (B) in the mouth for wisdom teeth.","ko":"그들의 턱은 또한 훨씬 더 (A), 입안에 사랑니를 위한 충분한 (B)을(를) 제공했다.","oko":["(A) 커서 / (B) 공간","(A) 커서 / (B) 음식","(A) 작아서 / (B) 공간","(A) 작아서 / (B) 음식","(A) 부드러워서 / (B) 음식"],"opts":["(A) larger / (B) room","(A) larger / (B) food","(A) smaller / (B) room","(A) smaller / (B) food","(A) softer / (B) food"],"r":{"a":"1) (A) larger / (B) room ((A) 커서 / (B) 공간)","ev":"7번 문장","s":[[7,"Their jaws were also much larger, providing plenty of room in the mouth for wisdom teeth.","그들의 턱은 또한 훨씬 더 커서, 입안에 사랑니를 위한 충분한 공간을 제공했다."]],"w":"7번에서 선조들의 턱은 훨씬 더 커서(larger) 입안에 사랑니를 위한 충분한 공간(room)을 제공했다고 해요.","c":1},"h":"8c1ae2106b"},{"n":10,"t":"fill","q":"However, as humans started to use fire for [A], food became softer and easier to [B].","ko":"하지만, 인간이 불을 [A]에 사용하기 시작하면서, 음식은 더 부드러워지고 [B] 것이 더 쉬워졌다.","bank":["cooking","chew","pain","removed","ancestors","cavities"],"bko":{"cooking":"요리","chew":"씹다","pain":"통증","removed":"제거된","ancestors":"선조들","cavities":"충치들"},"a":"[A] cooking, [B] chew","r":{"a":"[A] cooking (요리), [B] chew (씹다)","ev":"8번 문장","s":[[8,"However, as humans started to use fire for cooking, food became softer and easier to chew.","하지만, 인간이 요리를 위해 불을 사용하기 시작함에 따라, 음식은 더 부드럽고 씹기 쉬워졌다."]],"w":"8번에서 as humans started to use fire for cooking, food became softer and easier to chew라고 했어요. for 뒤에는 명사 cooking, easier to 뒤에는 동사원형 chew가 와요.","c":null},"h":"4e46d9ffba"}]},{"u":3,"id":"hk4-03-1","no":1,"ko":"해치지 않아~\b","items":[{"n":1,"t":"tf","q":"Clean Meat may interest people who feel guilty about eating meat.","ko":"클린 미트는 고기를 먹는 것에 죄책감을 느끼는 사람들에게 관심을 끌 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"If you sometimes feel guilty about eating meat, you may be interested in a new product called Clean Meat.","당신이 고기를 먹는 것에 대해 가끔 죄책감을 느낀다면, 당신은 클린 미트라고 불리는 새로운 제품에 관심이 있을지도 모른다."]],"w":"1번 문장에서 고기를 먹는 것에 가끔 죄책감을 느낀다면 클린 미트라는 새 제품에 관심이 있을지도 모른다(you may be interested in)고 해요.","c":"T"},"h":"811b749694"},{"n":2,"t":"tf","q":"Clean Meat releases a lot of greenhouse gas, just like cows.","ko":"클린 미트는 소처럼 많은 온실가스를 배출한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"But Clean Meat doesn’t release any greenhouse gas at all.","하지만 클린 미트는 조금의 온실가스도 전혀 배출하지 않는다."]],"w":"10번 문장에서 클린 미트는 온실가스를 전혀 배출하지 않는다(doesn’t release any greenhouse gas at all)고 해요. 소 네 마리가 차 한 대만큼 배출하는 것은 9번 이야기이고, 클린 미트는 그 반대예요.","c":"F"},"h":"2ab906cc1a"},{"n":3,"t":"tf","q":"A single cell can create 10,000 kilograms of meat.","ko":"하나의 세포가 만 킬로그램의 고기를 만들어 낼 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"A single cell can create 10,000 kilograms of meat, which looks and tastes just like regular meat.","하나의 세포가 만 킬로그램의 고기를 만들어낼 수 있는데, 이것은 마치 보통 고기처럼 보이고 맛이 난다."]],"w":"6번 문장에 A single cell can create 10,000 kilograms of meat가 그대로 나와요.","c":"T"},"h":"a19ce7868f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Clean Meat is produced in a lab.)","ko":"클린 미트는 연구실에서 ( ).","opts":["생산된다","버려진다","판매된다","발견된다"],"word":"produced","r":{"a":"1) 생산된다","ev":"2번 문장","s":[[2,"Clean Meat is produced in a lab.","클린 미트는 연구실에서 생산된다."]],"w":"2번 문장은 클린 미트를 연구실에서 만든다는 말이에요. is produced는 produce(생산하다)의 수동형으로 '생산된다'예요. 이어지는 3~5번에서 만드는 과정이 나와요.","c":1},"h":"074d47083e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (just four cows emit the same amount of greenhouse gas as a car)","ko":"단 네 마리의 소가 한 대의 차와 같은 양의 온실가스를 ( ).","opts":["흡수한다","모은다","배출한다","막는다"],"word":"emit","r":{"a":"3) 배출한다","ev":"9번 문장","s":[[9,"For example, just four cows emit the same amount of greenhouse gas as a car.","예를 들어, 단 네 마리의 소가 한 대의 차와 같은 양의 온실가스를 배출한다."]],"w":"9번 문장은 소 네 마리가 온실가스를 내뿜는다는 말이에요. 바로 뒤 10번에서 같은 뜻의 release(배출하다)가 쓰여요. emit = 배출하다.","c":3},"h":"add23a5842"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nNext, the cells are given nutrients and grown into muscles, which are the main part of the meat we eat.","ko":"밑줄 친 which가 가리키는 것은?","sko":"그 다음, 세포는 영양분을 공급받고 근육으로 키워지는데, 이것들은 우리가 먹는 고기의 주된 부위이다.","opts":["세포들","영양분","우리가 먹는 고기 전체","근육"],"r":{"a":"4) 근육","ev":"4번 문장","s":[[4,"Next, the cells are given nutrients and grown into muscles, which are the main part of the meat we eat.","그 다음, 세포는 영양분을 공급받고 근육으로 키워지는데, 이것들은 우리가 먹는 고기의 주된 부위이다."]],"w":"which are the main part의 which는 바로 앞 muscles(근육들)를 가리켜요. are가 복수 동사이므로 단수인 '고기 전체'가 아니라 복수인 muscles와 짝이에요.","c":4},"h":"4f53d66500"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"With this new product, you can eat as much meat as you want without killing livestock.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 새로운 제품으로, 당신은 가축을 죽이지 않고 원하는 만큼의 고기를 먹을 수 있다.","opts":["가축을 죽여야만 원하는 만큼 고기를 먹을 수 있다.","가축을 죽이지 않고도 원하는 만큼 고기를 먹을 수 있다.","가축을 죽이지 않으려면 고기를 조금만 먹어야 한다.","이 제품은 가축을 더 많이 키우도록 도와준다."],"r":{"a":"2) 가축을 죽이지 않고도 원하는 만큼 고기를 먹을 수 있다.","ev":"7번 문장","s":[[7,"With this new product, you can eat as much meat as you want without killing livestock.","이 새로운 제품으로, 당신은 가축을 죽이지 않고 원하는 만큼의 고기를 먹을 수 있다."]],"w":"without killing livestock은 '가축을 죽이지 않고'예요. as much meat as you want는 원하는 만큼 많은 고기이니 먹는 양을 줄이라는 말이 아니에요.","c":2},"h":"85f6092ea0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["클린 미트는 농장에서 사육되는 동물이 줄어들어 환경에 좋다.","클린 미트는 농장에서 더 많은 동물이 사육되게 한다.","클린 미트는 환경에 나쁘다.","클린 미트는 보통 고기보다 더 많은 농장이 필요하다."],"opts":["Clean Meat is good for the environment because fewer animals are raised on farms.","Clean Meat makes more animals be raised on farms.","Clean Meat is bad for the environment.","Clean Meat needs more farms than regular meat."],"r":{"a":"1) Clean Meat is good for the environment because fewer animals are raised on farms. (클린 미트는 농장에서 사육되는 동물이 줄어들어 환경에 좋다.)","ev":"8번 문장","s":[[8,"In addition, it has a positive effect on the environment by reducing the number of animals that are raised on farms.","게다가, 그것은 농장에서 사육되는 동물들의 수를 줄임으로써 환경에 긍정적인 영향을 끼친다."]],"w":"8번에서 클린 미트는 농장에서 사육되는 동물의 수를 줄여 환경에 긍정적인 영향을 끼친다고 했어요.","c":1},"h":"62ba307813"},{"n":9,"t":"sum","q":"Clean Meat is (A) into various food products, like hamburger patties or (B).","ko":"클린 미트는 햄버거 패티나 (B) 같은 다양한 식품으로 (A).","oko":["(A) 가공된다 / (B) 소시지","(A) 가공된다 / (B) 바나나","(A) 던져진다 / (B) 소시지","(A) 얼려진다 / (B) 바나나","(A) 던져진다 / (B) 바나나"],"opts":["(A) processed / (B) sausages","(A) processed / (B) bananas","(A) thrown / (B) sausages","(A) frozen / (B) bananas","(A) thrown / (B) bananas"],"r":{"a":"1) (A) processed / (B) sausages ((A) 가공된다 / (B) 소시지)","ev":"5번 문장","s":[[5,"Finally, Clean Meat is processed into various food products, like hamburger patties or sausages.","마지막으로, 클린 미트는 햄버거 패티와 소시지 같은 다양한 식품으로 가공된다."]],"w":"5번에서 클린 미트는 햄버거 패티나 소시지 같은 다양한 식품으로 가공된다(is processed)고 해요.","c":1},"h":"4658bff9fc"},{"n":10,"t":"fill","q":"First, muscle cells are [A] from a [B] animal, such as a pig, cow, or chicken.","ko":"먼저, 근육 세포가 돼지, 소, 또는 닭과 같은 [B] 동물로부터 [A].","bank":["removed","living","given","nutrients","reducing","livestock"],"bko":{"removed":"떼어내진(remove의 과거분사)","living":"살아있는","given":"주어진(give의 과거분사)","nutrients":"영양분","reducing":"줄이는","livestock":"가축"},"a":"[A] removed, [B] living","r":{"a":"[A] removed (떼어내진(remove의 과거분사)), [B] living (살아있는)","ev":"3번 문장","s":[[3,"First, muscle cells are removed from a living animal, such as a pig, cow, or chicken.","먼저, 근육 세포가 돼지, 소, 또는 닭과 같은 살아있는 동물로부터 떼어내진다."]],"w":"3번에서 muscle cells are removed from a living animal이라고 했어요. are 뒤에는 과거분사 removed, animal 앞에는 형용사 living이 와요. nutrients와 livestock은 명사예요.","c":null},"h":"f62e0ff1a8"}]},{"u":3,"id":"hk4-03-2","no":2,"ko":"알다가도 모를 예술의 세계\b","items":[{"n":1,"t":"tf","q":"One of the two works of art has a very unusual story behind it.","ko":"두 개의 예술 작품 중 하나는 매우 특이한 뒷이야기를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"However, one of the two has a very unusual story behind it.","하지만, 둘 중 하나는 매우 특이한 뒷이야기를 가지고 있다."]],"w":"3번 문장에 However, one of the two has a very unusual story behind it이 그대로 나와요.","c":"T"},"h":"54158c76b8"},{"n":2,"t":"tf","q":"Critics said Brassau’s paintings were weak and boring.","ko":"비평가들은 Brassau의 그림이 약하고 지루하다고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Critics praised his paintings for being powerful yet delicate.","비평가들은 강렬한데도 섬세한 것에 대해 그의 그림을 칭찬했다."]],"w":"6번 문장에서 비평가들은 그의 그림을 강렬하면서도 섬세하다(powerful yet delicate)고 칭찬했어요. 약하고 지루하다는 말은 반대예요.","c":"F"},"h":"4b0de63656"},{"n":3,"t":"tf","q":"The chimpanzee that played with the paint was four years old.","ko":"붓과 물감을 가지고 놀았던 침팬지는 네 살이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"So, he let a four-year-old chimpanzee at a nearby zoo play with a brush and some paint.","그래서, 그는 근처 동물원에 있는 4살짜리 침팬지가 붓과 물감을 가지고 놀도록 했다."]],"w":"11번 문장에서 기자는 근처 동물원의 네 살짜리(four-year-old) 침팬지가 붓과 물감을 가지고 놀게 했어요.","c":"T"},"h":"00160b9314"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…it was Brassau’s work that attracted the most attention.)","ko":"…가장 많은 관심을 ( ) 것은 바로 Brassau의 작품이었다.","opts":["끈","피한","잃은","나눠 준"],"word":"attracted","r":{"a":"1) 끈","ev":"5번 문장","s":[[5,"There were works by other artists from all over the world as well, but it was Brassau’s work that attracted the most attention.","전 세계 다른 예술가들의 작품들 또한 있었지만, 가장 많은 관심을 끈 것은 바로 Brassau의 작품이었다."]],"w":"5번 문장은 다른 작품들도 있었지만 Brassau의 작품이 가장 큰 관심을 받았다는 말이에요. attract는 '(관심을) 끌다'예요.","c":1},"h":"0dd76edc8d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Everyone was curious about who Brassau was…)","ko":"모두가 Brassau가 누구인지 ( ) 그를 직접 만나고 싶어 했다.","opts":["화난","지루한","궁금해했고","무서운"],"word":"curious","r":{"a":"3) 궁금해했고","ev":"7번 문장","s":[[7,"Everyone was curious about who Brassau was and couldn’t wait to meet him in person.","모두가 Brassau가 누구인지 궁금해했고 그를 정말 직접 만나고 싶어 했다."]],"w":"7번 문장은 칭찬받은 그림을 그린 사람이 누구인지 모두 알고 싶어 했다는 말이에요. 뒤의 couldn’t wait to meet him(만나고 싶어 못 견딘다)과 이어져요. curious = 궁금한.","c":3},"h":"a7fc5e8c46"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey both look like typical abstract paintings.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 둘 다 전형적인 추상화처럼 보인다.","opts":["두 명의 다른 예술가들","두 개의 예술 작품","비평가들","스웨덴 사람들"],"r":{"a":"2) 두 개의 예술 작품","ev":"1~2번 문장","s":[[1,"Look at these two works of art painted by two different artists.","두 명의 다른 예술가들에 의해 그려진 이 두 개의 예술 작품을 보아라."],[2,"They both look like typical abstract paintings.","그것들은 둘 다 전형적인 추상화처럼 보인다."]],"w":"2번 They both look like ~ paintings는 그림 같다는 말이니, 1번의 two works of art(두 개의 예술 작품)를 가리켜요. 예술가들(artists)은 그림을 그린 사람이라 '추상화처럼 보인다'의 주어가 될 수 없어요.","c":2},"h":"9b3442fede"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But surprisingly, he was not a person but a chimpanzee!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 놀랍게도, 그는 사람이 아니라 침팬지였다!","opts":["그는 사람이었지만 침팬지처럼 그림을 그렸다.","그는 침팬지가 아니라 사람이었다.","그는 사람과 침팬지가 함께 만든 이름이었다.","그는 사람이 아니라 침팬지였다."],"r":{"a":"4) 그는 사람이 아니라 침팬지였다.","ev":"8번 문장","s":[[8,"But surprisingly, he was not a person but a chimpanzee!","하지만 놀랍게도, 그는 사람이 아니라 침팬지였다!"]],"w":"not A but B는 'A가 아니라 B'예요. 그래서 사람이 아니라 침팬지라는 뜻이고, 사람과 침팬지가 함께했다는 말은 아니에요.","c":4},"h":"8de1a4f2e5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Pierre Brassau는 한 기자의 창작물이었다.","Pierre Brassau는 유명한 스웨덴 화가였다.","Pierre Brassau는 전시회의 비평가였다.","Pierre Brassau는 근처 학교의 학생이었다."],"opts":["Pierre Brassau was the creation of a journalist.","Pierre Brassau was a famous Swedish painter.","Pierre Brassau was a critic at the art show.","Pierre Brassau was a student at a nearby school."],"r":{"a":"1) Pierre Brassau was the creation of a journalist. (Pierre Brassau는 한 기자의 창작물이었다.)","ev":"9번 문장","s":[[9,"Pierre Brassau was the creation of a journalist.","Pierre Brassau는 한 기자의 창작물이었다."]],"w":"9번에서 Pierre Brassau는 한 기자의 창작물이었다고 해요. 8번에서 그는 사람이 아니라고 했으니 화가, 비평가, 학생은 모두 틀려요.","c":1},"h":"b8e50e1be7"},{"n":9,"t":"sum","q":"In 1964, several paintings by Pierre Brassau were (A) at an art show in (B).","ko":"1964년에 Pierre Brassau의 여러 그림이 (B)의 예술 전시회에서 (A).","oko":["(A) 전시되었다 / (B) 스웨덴","(A) 전시되었다 / (B) 한국","(A) 팔렸다 / (B) 한국","(A) 숨겨졌다 / (B) 스웨덴","(A) 숨겨졌다 / (B) 한국"],"opts":["(A) exhibited / (B) Sweden","(A) exhibited / (B) Korea","(A) sold / (B) Korea","(A) hidden / (B) Sweden","(A) hidden / (B) Korea"],"r":{"a":"1) (A) exhibited / (B) Sweden ((A) 전시되었다 / (B) 스웨덴)","ev":"4번 문장","s":[[4,"In 1964, several paintings by an artist named Pierre Brassau were exhibited at an art show in Sweden.","1964년에, Pierre Brassau라는 예술가의 여러 그림이 스웨덴의 예술 전시회에 전시되어 있었다."]],"w":"4번에서 1964년에 Pierre Brassau의 여러 그림이 스웨덴(Sweden)의 예술 전시회에 전시되었다(were exhibited)고 해요.","c":1},"h":"a5e01de221"},{"n":10,"t":"fill","q":"The journalist wanted to [A] whether art critics could tell the difference between true abstract art and [B] art.","ko":"그 기자는 예술 비평가들이 진짜 추상 예술 작품과 [B] 예술 작품을 구별할 수 있는지 [A] 보고 싶었다.","bank":["test","fake","attract","praise","invent","create"],"bko":{"test":"시험하다","fake":"가짜의","attract":"끌다","praise":"칭찬하다","invent":"발명하다","create":"만들어 내다"},"a":"[A] test, [B] fake","r":{"a":"[A] test (시험하다), [B] fake (가짜의)","ev":"10번 문장","s":[[10,"The journalist wanted to test whether art critics could tell the difference between true abstract art and fake art.","그 기자는 예술 비평가들이 진짜 추상 예술 작품과 가짜 예술 작품을 구별할 수 있는지 시험해보고 싶었다."]],"w":"10번에서 The journalist wanted to test whether ... and fake art라고 했어요. wanted to 뒤에는 동사원형 test, and 뒤 art 앞에는 형용사 fake가 와요.","c":null},"h":"cee8791ca3"}]},{"u":3,"id":"hk4-03-3","no":3,"ko":"우리 유니폼은 로봇이야\b","items":[{"n":1,"t":"tf","q":"Every Cybathlon team has one athlete and a group of robot developers.","ko":"사이배슬론의 모든 팀은 한 명의 선수와 한 무리의 로봇 개발자들을 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Every team in this competition consists of one athlete and a group of robot developers.","이 대회의 모든 팀은 한 명의 선수와 한 무리의 로봇 개발자들로 구성된다."]],"w":"3번 문장에서 모든 팀은 한 명의 선수와 한 무리의 로봇 개발자들로 구성된다(consists of)고 해요.","c":"T"},"h":"a326d74f1d"},{"n":2,"t":"tf","q":"The athletes in the Cybathlon are called “coaches.”","ko":"사이배슬론의 선수들은 ‘코치’라고 불린다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The athletes are called “pilots.”","선수들은 ‘조종사’라고 불린다."]],"w":"4번 문장에서 선수들은 ‘조종사(pilots)’라고 불린다고 해요. coaches(코치)는 본문에 나오지 않아요.","c":"F"},"h":"fb44daf5fb"},{"n":3,"t":"tf","q":"The winning team receives two medals.","ko":"이긴 팀은 두 개의 메달을 받는다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The winning team receives two medals: one for the pilot and one for the group of robot developers.","이긴 팀은 조종사를 위한 것과 로봇 개발자 무리를 위한 것의 두 개의 메달을 받는다."]],"w":"8번 문장에서 이긴 팀은 조종사를 위한 것과 로봇 개발자 무리를 위한 것, 두 개의 메달을 받는다고 해요.","c":"T"},"h":"5fa5295e5a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…they wear and operate robotic parts designed by the developers…)","ko":"…그들은 개발자들이 설계한 로봇 부품을 착용하고 ( ).","opts":["버린다","조종한다","숨긴다","판매한다"],"word":"operate","r":{"a":"2) 조종한다","ev":"5번 문장","s":[[5,"They have physical disabilities, so they wear and operate robotic parts designed by the developers to help them move.","그들은 신체장애를 가지고 있어서, 그들이 움직이도록 돕기 위해 개발자들에 의해 설계된 로봇 부품을 착용하고 조종한다."]],"w":"5번 문장은 선수가 로봇 부품을 몸에 입고 움직인다는 말이에요. 뒤의 to help them move(움직이도록 돕기 위해)와 이어져 operate는 '조종하다'예요.","c":2},"h":"eb16d8e000"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The ultimate goal of the Cybathlon is to make robots…)","ko":"사이배슬론의 ( ) 목표는 로봇을 만드는 것이다.","opts":["임시의","개인적인","사소한","궁극적인"],"word":"ultimate","r":{"a":"4) 궁극적인","ev":"9번 문장","s":[[9,"The ultimate goal of the Cybathlon is to make robots that move more easily, weigh less, and have a longer battery life.","사이배슬론의 궁극적인 목표는 더 쉽게 움직이고, 무게가 더 적게 나가고, 더 긴 배터리 수명을 가진 로봇을 만드는 것이다."]],"w":"9번 문장은 대회가 가장 크게 바라는 최종 목표를 말해요. 이어서 이 목표가 어떤 로봇을 만드는 것인지 세 가지로 설명해요. ultimate = 궁극적인, 최종의.","c":4},"h":"c8d7becbad"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nIt is the Cybathlon, which means “cyborg Olympics.”","ko":"밑줄 친 which가 가리키는 것은?","sko":"그것은 사이배슬론인데, 이는 ‘사이보그 올림픽’을 의미한다.","opts":["사이배슬론","사이보그","올림픽","조종사"],"pron":"which","r":{"a":"1) 사이배슬론","ev":"2번 문장","s":[[2,"It is the Cybathlon, which means “cyborg Olympics.”","그것은 사이배슬론인데, 이는 ‘사이보그 올림픽’을 의미한다."]],"w":"2번의 which는 바로 앞의 the Cybathlon(사이배슬론)을 가리켜요. 사이배슬론이라는 이름이 ‘사이보그 올림픽’을 의미한다는 말이에요.","c":1,"k":"which = 사이배슬론"},"h":"844c38bcca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"During the competition, pilots have to complete everyday tasks, such as walking up the stairs or hanging the laundry.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"대회 동안, 조종사들은 계단을 걸어 올라가는 것이나 빨래를 너는 것과 같은 일상적인 과제를 완수해야 한다.","opts":["조종사들은 대회 동안 계단과 빨래를 보기만 하면 된다.","조종사들은 대회 전에 일상적인 과제를 연습해야 한다.","조종사들은 계단 오르기나 빨래 널기 같은 일상 과제를 해내야 한다.","조종사들은 어려운 곡예를 해야 한다."],"r":{"a":"3) 조종사들은 계단 오르기나 빨래 널기 같은 일상 과제를 해내야 한다.","ev":"6번 문장","s":[[6,"During the competition, pilots have to complete everyday tasks, such as walking up the stairs or hanging the laundry.","대회 동안, 조종사들은 계단을 걸어 올라가는 것이나 빨래를 너는 것과 같은 일상적인 과제를 완수해야 한다."]],"w":"have to complete는 '완수해야 한다', such as는 '~와 같은'이에요. 대회 중에 계단 오르기, 빨래 널기 같은 일상 과제를 해낸다는 뜻이에요.","c":3},"h":"061c14f415"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["스포츠를 좋아하는 누구나 사이배슬론에 참가할 수 있다.","사이배슬론은 로봇들끼리만 겨루는 대회이다.","사이배슬론은 ‘로봇 올림픽’을 의미한다.","특별히 자격을 갖춘 사람들만 사이배슬론에 참가할 수 있다."],"opts":["Anyone who loves sports can join the Cybathlon.","The Cybathlon is a competition only between robots.","The Cybathlon means “robot Olympics.”","Only specially qualified people can participate in the Cybathlon."],"r":{"a":"4) Only specially qualified people can participate in the Cybathlon.","ev":"1~2번 문장","s":[[1,"Did you know that there is an international sports event that only specially qualified people can participate in?","당신은 특별히 자격을 갖춘 사람들만 참가할 수 있는 국제 스포츠 행사가 있다는 것을 알고 있었는가?"],[2,"It is the Cybathlon, which means “cyborg Olympics.”","그것은 사이배슬론인데, 이는 ‘사이보그 올림픽’을 의미한다."]],"w":"1번에서 특별히 자격을 갖춘 사람만 참가할 수 있다고 했어요. 2번에서 사이배슬론은 ‘사이보그 올림픽’을 의미한다고 했고, 로봇끼리만 겨루는 대회도 아니에요(3~4번).","c":4},"h":"c47820d420"},{"n":9,"t":"sum","q":"This unique competition will contribute to developing (A) robots to assist people with (B) in their daily lives.","ko":"이 특별한 대회는 일상생활에서 (B)을(를) 가진 사람들을 돕는 (A) 로봇을 개발하는 데 기여할 것이다.","oko":["(A) 착용할 수 있는 / (B) 장애","(A) 착용할 수 있는 / (B) 메달","(A) 고장 난 / (B) 장애","(A) 고장 난 / (B) 계단","(A) 무거운 / (B) 메달"],"opts":["(A) wearable / (B) disabilities","(A) wearable / (B) medals","(A) broken / (B) disabilities","(A) broken / (B) stairs","(A) heavy / (B) medals"],"r":{"a":"1) (A) wearable / (B) disabilities ((A) 착용할 수 있는 / (B) 장애)","ev":"10번 문장","s":[[10,"This unique competition will contribute to developing wearable robots to assist people with disabilities in their daily lives.","이 특별한 대회는 장애를 가진 사람들을 일상생활에서 돕는 착용할 수 있는 로봇을 개발하는 것에 기여할 것이다."]],"w":"10번에서 이 대회는 장애(disabilities)를 가진 사람들을 일상생활에서 돕는 착용할 수 있는(wearable) 로봇을 개발하는 데 기여할 것이라고 해요.","c":1},"h":"8b10ea127d"},{"n":10,"t":"fill","q":"The team whose pilot carries out the tasks most [A] and quickly [B].","ko":"조종사가 과제를 가장 [A] 빠르게 수행해내는 팀이 [B].","bank":["successfully","wins","daily","ultimate","laundry","medals"],"bko":{"successfully":"성공적으로","wins":"이긴다","daily":"일상의","ultimate":"궁극적인","laundry":"빨래","medals":"메달들"},"r":{"a":"[A] successfully, [B] wins","ev":"7번 문장","s":[[7,"The team whose pilot carries out the tasks most successfully and quickly wins.","조종사가 그 과제를 가장 성공적으로 빠르게 수행해내는 팀이 이긴다."]],"w":"7번 문장 The team whose pilot carries out the tasks most successfully and quickly wins에서 가져왔어요. [A]는 quickly와 짝인 부사, [B]는 주어 The team의 동사가 필요해서 나머지 단어들은 들어갈 수 없어요.","c":null},"h":"7670bad381"}]},{"u":3,"id":"hk4-03-4","no":4,"ko":"숨기면 더 보고 싶어! \b","items":[{"n":1,"t":"tf","q":"The picture that more than 420,000 people looked at was of a house on a beach.","ko":"42만 명이 넘는 사람들이 본 사진은 해변에 있는 집의 사진이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It was just a picture of a house on a beach.","그것은 단지 해변에 있는 집의 사진이었다."]],"w":"2번 문장에서 그 사진은 단지 해변에 있는 집의 사진(a picture of a house on a beach)이었다고 해요.","c":"T"},"h":"e6e69dbbe7"},{"n":2,"t":"tf","q":"The aerial pictures were taken to show beautiful beaches to tourists.","ko":"항공사진들은 관광객에게 아름다운 해변을 보여 주기 위해 찍혔다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"They had been taken to record the geological changes of the California coastline.","그것들은 캘리포니아 해안선의 지질학적 변화를 기록하기 위해 찍혔었다."]],"w":"5번 문장에서 사진들은 캘리포니아 해안선의 지질학적 변화를 기록하기 위해(to record the geological changes) 찍혔다고 해요. 관광객 이야기는 없어요.","c":"F"},"h":"070217b6f2"},{"n":3,"t":"tf","q":"After the incident was on the news, millions of people looked up the picture.","ko":"그 사건이 뉴스에 나온 후, 수백만 명의 사람들이 그 사진을 찾아봤다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Soon, millions of people heard about the picture and looked it up on the Internet.","곧, 수백만 명의 사람들이 그 사진에 대해 듣고 그것을 인터넷에서 찾아봤다."]],"w":"11번 문장에서 곧 수백만 명의 사람들이 그 사진에 대해 듣고 인터넷에서 찾아봤다(looked it up)고 해요.","c":"T"},"h":"ea33208ce2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But the photographer repeatedly refused.)","ko":"하지만 사진가는 ( ) 거절했다.","opts":["한 번만","여러 차례","즐겁게","천천히"],"word":"repeatedly","r":{"a":"2) 여러 차례","ev":"8번 문장","s":[[8,"But the photographer repeatedly refused.","하지만 사진가는 여러 차례 거절했다."]],"w":"8번 문장은 사진을 지워 달라는 요청을 사진가가 계속 거절했다는 말이에요. 결국(9번) 소송으로 이어져요. repeatedly = 여러 차례, 되풀이하여.","c":2},"h":"42dd52326c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…she filed a 50-million-dollar lawsuit against him for invading her privacy.)","ko":"…그녀는 그녀의 사생활을 ( ) 것으로 그에게 5천만 달러짜리 소송을 제기했다.","opts":["보호한","공개한","칭찬한","침해한"],"word":"invading","r":{"a":"4) 침해한","ev":"9번 문장","s":[[9,"Eventually, she filed a 50-million-dollar lawsuit against him for invading her privacy.","결국, 그녀는 사생활을 침해한 것으로 그에게 5천만 달러짜리 소송을 제기했다."]],"w":"9번 문장은 사진 때문에 사생활이 침해되었다며 소송을 낸 이유를 말해요. invade = 침해하다, 침입하다.","c":4},"h":"57d630ab33"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt refers to a situation where an attempt to hide information ironically helps spread it instead.","ko":"밑줄 친 It이 가리키는 것은?","sko":"이것은 정보를 숨기려는 시도가 얄궂게도 오히려 그것을 퍼뜨리는 것을 돕는 상황을 가리킨다.","opts":["스트라이샌드 효과","정보","인터넷","사진"],"pron":"It","r":{"a":"1) 스트라이샌드 효과","ev":"12~13번 문장","s":[[12,"This phenomenon became known as the Streisand effect.","이 현상은 스트라이샌드 효과로 알려지게 되었다."],[13,"It refers to a situation where an attempt to hide information ironically helps spread it instead.","이것은 정보를 숨기려는 시도가 얄궂게도 오히려 그것을 퍼뜨리는 것을 돕는 상황을 가리킨다."]],"w":"13번의 It은 앞 12번의 the Streisand effect(스트라이샌드 효과)예요. 정보를 숨기려는 시도가 오히려 정보를 퍼뜨리는 상황을 가리킨다는 설명이에요.","c":1,"k":"It = 스트라이샌드 효과"},"h":"7879c6a79f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"One of the photos was Hollywood entertainer Barbra Streisand’s house.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 사진들 중 하나는 할리우드 연예인인 바브라 스트라이샌드의 집이었다.","opts":["그 사진들 중 하나는 할리우드 연예인 바브라 스트라이샌드의 집이었다.","그 사진들 중 하나는 바브라 스트라이샌드가 직접 찍은 것이었다.","바브라 스트라이샌드는 할리우드의 유명한 사진가였다.","그 사진들은 모두 할리우드 연예인들의 집이었다."],"r":{"a":"1) 그 사진들 중 하나는 할리우드 연예인 바브라 스트라이샌드의 집이었다.","ev":"6번 문장","s":[[6,"One of the photos was Hollywood entertainer Barbra Streisand’s house.","그 사진들 중 하나는 할리우드 연예인인 바브라 스트라이샌드의 집이었다."]],"w":"One of the photos는 ‘그 사진들 중 하나’, Streisand’s house는 ‘스트라이샌드의 집’이에요. 사진 속 집이 스트라이샌드의 집이라는 뜻이고, 그녀가 찍었다는 말은 없어요.","c":1},"h":"235e2c8149"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["한 웹사이트에 12만 개가 넘는 항공사진 모음이 있었다.","한 웹사이트에 해변 사진이 열 장뿐이었다.","한 웹사이트에 만화 모음이 있었다.","한 웹사이트가 2003년에 폐쇄되었다."],"opts":["A website had a collection of over 120,000 aerial pictures.","A website had only ten pictures of beaches.","A website had a collection of cartoons.","A website was closed in 2003."],"r":{"a":"1) A website had a collection of over 120,000 aerial pictures. (한 웹사이트에 12만 개가 넘는 항공사진 모음이 있었다.)","ev":"4번 문장","s":[[4,"In 2003, one website had a collection of over 120,000 aerial pictures.","2003년에, 한 웹사이트에는 12만 개 이상의 항공사진 모음이 있었다."]],"w":"4번에서 2003년에 한 웹사이트에 12만 개가 넘는 항공사진 모음이 있었다고 해요.","c":1},"h":"d5601e5fa3"},{"n":9,"t":"sum","q":"Such an (A) photo got so much (B).","ko":"그렇게 (A) 사진이 매우 많은 (B)을(를) 받았다.","oko":["(A) 평범한 / (B) 관심","(A) 평범한 / (B) 돈","(A) 비싼 / (B) 돈","(A) 비싼 / (B) 숙제","(A) 어두운 / (B) 숙제"],"opts":["(A) ordinary / (B) attention","(A) ordinary / (B) money","(A) expensive / (B) money","(A) expensive / (B) homework","(A) dark / (B) homework"],"r":{"a":"1) (A) ordinary / (B) attention ((A) 평범한 / (B) 관심)","ev":"3번 문장","s":[[3,"Then why did such an ordinary photo get so much attention?","그렇다면 왜 그렇게 평범한 사진이 매우 많은 관심을 받았을까?"]],"w":"3번에서 그렇게 평범한(ordinary) 사진이 왜 그렇게 많은 관심(attention)을 받았을까 하고 물어요.","c":1},"h":"5919da9db1"},{"n":10,"t":"fill","q":"Streisand asked the photographer to [A] the picture from the website because she did not want the public to [B] her home.","ko":"스트라이샌드는 대중이 그녀의 집을 [B] 것을 원하지 않아서 사진가에게 그 사진을 웹사이트에서 [A] 달라고 요청했다.","bank":["remove","see","refuse","file","lawsuit","privacy"],"bko":{"remove":"지우다","see":"보다","refuse":"거절하다","file":"(소송을) 제기하다","lawsuit":"소송","privacy":"사생활"},"r":{"a":"[A] remove, [B] see","ev":"7번 문장","s":[[7,"Streisand asked the photographer to remove the picture from the website because she did not want the public to see her home.","스트라이샌드는 대중이 그녀의 집을 보기를 원하지 않았기 때문에 사진가에게 그 사진을 웹사이트에서 지워달라고 요청했다."]],"w":"7번 문장 Streisand asked the photographer to remove the picture ~ did not want the public to see her home에서 가져왔어요. [A], [B]는 to 뒤의 동사원형이 필요하고, 의미상 '지우다'와 '보다'만 알맞아요.","c":null},"h":"8ad1dba82c"}]},{"u":4,"id":"hk4-04-1","no":1,"ko":"버리지 마세요, 기부하세요\b","items":[{"n":1,"t":"tf","q":"About 1.5 billion or more phones are sold around the world each year.","ko":"매년 전 세계에서 15억 개 이상의 휴대폰이 팔린다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Each year, over 1.5 billion phones are sold worldwide.","매년, 15억 개가 넘는 휴대폰이 전 세계에서 팔린다."]],"w":"1번 문장에 Each year, over 1.5 billion phones are sold worldwide가 그대로 나와요.","c":"T"},"h":"b3274e0a04"},{"n":2,"t":"tf","q":"One ton of rocks gives more gold than one ton of phones.","ko":"암석 1톤은 휴대폰 1톤보다 더 많은 금을 준다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"If they are recycled, 400 grams of gold can be extracted from one ton of them.","만약 그것들이 재활용된다면, 1톤의 휴대폰으로부터 400그램의 금이 추출될 수 있다."],[6,"This is a great amount, considering only five grams of gold are extracted from the same weight of rocks.","같은 무게의 암석으로부터 5그램의 금만 추출되는 것을 고려하면, 이것은 굉장한 양이다."]],"w":"5번에서 휴대폰 1톤에서 금 400그램이 나오고, 6번에서 같은 무게의 암석에서는 5그램뿐이라고 해요. 그래서 휴대폰 쪽이 훨씬 많아요.","c":"F"},"h":"f85dd1b75e"},{"n":3,"t":"tf","q":"Old phones can be donated to a charity organization.","ko":"오래된 휴대폰은 자선 단체에 기부될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"You can donate them to a charity organization.","당신은 그것을 자선 단체에 기부할 수 있다."]],"w":"10번 문장에서 오래된 휴대폰을 자선 단체에 기부할 수 있다(You can donate them to a charity organization)고 해요.","c":"T"},"h":"dfaf43c205"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This means that about the same number of old phones are discarded.)","ko":"이것은 거의 같은 수의 오래된 휴대폰이 ( )는 것을 의미한다.","opts":["버려진다","수리된다","선물된다","보관된다"],"word":"discarded","r":{"a":"1) 버려진다","ev":"2번 문장","s":[[2,"This means that about the same number of old phones are discarded.","이것은 거의 같은 수의 오래된 휴대폰이 버려진다는 것을 의미한다."]],"w":"2번 문장은 새 휴대폰이 팔리는 만큼 오래된 휴대폰이 쓰고 나서 버려진다는 뜻이에요. 뒤에서 '재활용되는 것은 10퍼센트뿐'(3번)이라고 이어져요. discard = 버리다.","c":1},"h":"318a0263bf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…they usually end up in landfills and contaminate the surrounding soil and water with toxic materials.)","ko":"…보통 쓰레기 매립지에 가게 되고 주변 토양과 물을 독성 물질로 ( ).","opts":["정화한다","보호한다","오염시킨다","나눠 준다"],"word":"contaminate","r":{"a":"3) 오염시킨다","ev":"8번 문장","s":[[8,"When phones are discarded, they usually end up in landfills and contaminate the surrounding soil and water with toxic materials.","휴대폰이 버려지면, 보통 결국 쓰레기 매립지로 가게 되고 주변 토양과 물을 독성 물질로 오염시킨다."]],"w":"독성 물질(toxic materials)로 토양과 물에 무슨 일이 일어날까요? 오염시켜요. contaminate = 오염시키다. 그래서 7번에서 재활용이 환경에 이익이라고 한 거예요.","c":3},"h":"835c936d32"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIf they are recycled, 400 grams of gold can be extracted from one ton of them.","ko":"밑줄 친 they가 가리키는 것은?","sko":"만약 그것들이 재활용된다면, 1톤의 휴대폰으로부터 400그램의 금이 추출될 수 있다.","opts":["금","휴대폰","암석","자선 단체"],"r":{"a":"2) 휴대폰","ev":"4~5번 문장","s":[[4,"Phones contain many precious metals, including gold.","휴대폰에는 금을 포함하여 많은 값비싼 금속이 들어 있다."],[5,"If they are recycled, 400 grams of gold can be extracted from one ton of them.","만약 그것들이 재활용된다면, 1톤의 휴대폰으로부터 400그램의 금이 추출될 수 있다."]],"w":"4번에서 Phones contain many precious metals라고 했고 5번 If they are recycled의 they는 그 휴대폰이에요. 5번 끝의 them도 같은 휴대폰이에요.","c":2},"h":"76950a8e31"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But unfortunately, only 10 percent of these phones get recycled.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 불행히도, 이 휴대폰의 10퍼센트만이 재활용된다.","opts":["이 휴대폰의 90퍼센트가 재활용된다.","이 휴대폰의 10퍼센트만 팔린다.","이 휴대폰의 10퍼센트는 재활용될 수 없다.","이 휴대폰 중 10퍼센트만 재활용된다."],"r":{"a":"4) 이 휴대폰 중 10퍼센트만 재활용된다.","ev":"3번 문장","s":[[3,"But unfortunately, only 10 percent of these phones get recycled.","하지만 불행히도, 이 휴대폰의 10퍼센트만이 재활용된다."]],"w":"only 10 percent는 '겨우 10퍼센트'라서 나머지 대부분은 재활용되지 않는다는 말이에요. 'get recycled'는 재활용된다는 뜻이에요.","c":4},"h":"b763abeb6e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["휴대폰에는 금을 포함하여 많은 값비싼 금속이 들어 있다.","대부분의 오래된 휴대폰은 매년 새 휴대폰으로 재활용된다.","휴대폰에는 재활용할 가치가 있는 금속이 없다.","금은 휴대폰이 아니라 암석에서만 찾을 수 있다."],"opts":["Phones contain many precious metals, including gold.","Most old phones are recycled into new phones every year.","Phones contain no metals worth recycling.","Gold can only be found in rocks, not in phones."],"r":{"a":"1) Phones contain many precious metals, including gold.","ev":"4번 문장","s":[[4,"Phones contain many precious metals, including gold.","휴대폰에는 금을 포함하여 많은 값비싼 금속이 들어 있다."]],"w":"4번 문장에서 휴대폰에 금을 포함해 값비싼 금속이 많이 들어 있다고 해요. 재활용은 10퍼센트뿐이고(3번), 금은 휴대폰에서도 나와요(5번).","c":1},"h":"4544c1ebf0"},{"n":9,"t":"sum","q":"Recycling phones also has (A) (B).","ko":"휴대폰을 재활용하는 것에는 (A) (B)도 있다.","oko":["(A) 환경 보호의 / (B) 이익","(A) 환경 보호의 / (B) 문제","(A) 값비싼 / (B) 이익","(A) 값비싼 / (B) 문제","(A) 지루한 / (B) 문제"],"opts":["(A) ecological / (B) benefits","(A) ecological / (B) problems","(A) expensive / (B) benefits","(A) expensive / (B) problems","(A) boring / (B) problems"],"r":{"a":"1) (A) ecological / (B) benefits ((A) 환경 보호의 / (B) 이익)","ev":"7번 문장","s":[[7,"Recycling phones also has ecological benefits.","휴대폰을 재활용하는 것에는 환경 보호의 이익도 있다."]],"w":"7번에서 휴대폰을 재활용하는 것에는 환경 보호의(ecological) 이익(benefits)도 있다고 해요.","c":1},"h":"0ff9d245b2"},{"n":10,"t":"fill","q":"That way, the precious metals from the old phones can be recycled, and the [A] can be used to [B] those who are in need.","ko":"그 방법으로, 오래된 휴대폰에서 나온 값비싼 금속이 재활용될 수 있고, 그 [A]은(는) 도움이 필요한 사람들을 [B] 데 쓰일 수 있다.","bank":["profits","help","weight","rocks","extract","toxic"],"bko":{"profits":"수익","help":"돕다","weight":"무게","rocks":"암석","extract":"추출하다","toxic":"독성의"},"a":"[A] profits, [B] help","r":{"a":"[A] profits (수익), [B] help (돕다)","ev":"11번 문장","s":[[11,"That way, the precious metals from the old phones can be recycled, and the profits can be used to help those who are in need.","그 방법으로, 오래된 휴대폰에서 나온 값비싼 금속이 재활용될 수 있고, 그 수익은 도움이 필요한 사람들을 돕기 위해 쓰일 수 있다."]],"w":"11번에서 the profits can be used to help those who are in need라고 했어요. the 뒤에는 명사 profits(profit의 복수형), to 뒤에는 동사원형 help가 와요. toxic은 형용사예요.","c":null},"h":"4c8b42b24c"}]},{"u":4,"id":"hk4-04-2","no":2,"ko":"죽은 화가의 신작 대공개\b","items":[{"n":1,"t":"tf","q":"Rembrandt, a great artist, died in 1669.","ko":"위대한 예술가인 렘브란트는 1669년에 사망했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Rembrandt, one of history’s greatest artists, died in 1669.","역사상 가장 위대한 예술가들 중 한 명인 렘브란트는 1669년에 사망했다."]],"w":"1번 문장에 Rembrandt, one of history’s greatest artists, died in 1669가 나와요.","c":"T"},"h":"1d75637613"},{"n":2,"t":"tf","q":"The AI analyzed only ten of Rembrandt’s paintings.","ko":"인공지능은 렘브란트의 그림 열 점만 분석했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"It analyzed all 346 paintings by Rembrandt using 3D scans and facial recognition technology.","그것은 3D 스캔과 얼굴 인식 기술을 사용하여 렘브란트가 그린 346점의 모든 그림을 분석했다."]],"w":"5번 문장에서 AI는 렘브란트가 그린 346점의 모든 그림(all 346 paintings)을 분석했어요. 열 점이 아니에요.","c":"F"},"h":"b243d0fabb"},{"n":3,"t":"tf","q":"The portrait was printed by a 3D printer after it was completed.","ko":"초상화는 완성된 후 3D 프린터로 인쇄되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"When the portrait was completed, it was then printed by a 3D printer.","초상화가 완성되었을 때, 그것은 그 후 3D 프린터로 인쇄되었다."]],"w":"10번 문장에서 초상화가 완성되었을 때(When the portrait was completed) 3D 프린터로 인쇄되었다고 해요.","c":"T"},"h":"7d71518b47"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The printer used 13 layers of paint to imitate the texture of Rembrandt’s paintings.)","ko":"프린터는 렘브란트의 그림의 질감을 ( ) 위해 13겹의 물감을 사용했다.","opts":["지우기","팔기","따라 하기","잃어버리기"],"word":"imitate","r":{"a":"3) 따라 하기","ev":"11번 문장","s":[[11,"The printer used 13 layers of paint to imitate the texture of Rembrandt’s paintings.","프린터는 렘브란트의 그림의 질감을 따라하기 위해 13겹의 물감을 사용했다."]],"w":"11번 문장은 프린터가 물감을 13겹 쓴 목적을 말해요. 12번에서 렘브란트 본인이 그린 것처럼 보였다고 하니 질감을 똑같이 '따라 한' 거예요. imitate = 따라 하다, 모방하다.","c":3},"h":"a36a5f652d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, a brand-new painting of his was recently released.)","ko":"하지만, 그의 새로운 그림이 최근에 ( ).","opts":["공개되었다","삭제되었다","도난당했다","복원되었다"],"word":"released","r":{"a":"1) 공개되었다","ev":"2번 문장","s":[[2,"However, a brand-new painting of his was recently released.","하지만, 그의 새로운 그림이 최근에 공개되었다."]],"w":"1번에서 렘브란트는 이미 죽었는데, 2번에서 새 그림이 최근에 세상에 나왔다는 반전이에요. release = 공개하다, 발표하다.","c":1},"h":"39fbbb3b3e"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey asked it to produce a portrait of a man in his thirties wearing black clothes and a black hat.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 그것에 검은색 옷과 모자를 착용한 30대 남성의 초상화를 제작할 것을 요청했다.","opts":["렘브란트의 그림들","연구원들","인공지능","비평가들"],"r":{"a":"2) 연구원들","ev":"7~8번 문장","s":[[7,"Then, the researchers decided to put the AI to the test.","그 후, 연구원들은 인공지능을 시험해보기로 결정했다."],[8,"They asked it to produce a portrait of a man in his thirties wearing black clothes and a black hat.","그들은 그것에 검은색 옷과 모자를 착용한 30대 남성의 초상화를 제작할 것을 요청했다."]],"w":"8번 They asked it to produce ~에서 They는 요청하는 사람이고, it(AI)에게 시켰어요. 바로 앞 7번에서 AI를 시험해 보기로 결정한 the researchers(연구원들)가 They예요.","c":2},"h":"199d31cd0a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Surprisingly, the portrait looked as though it had been done by Rembrandt himself!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"놀랍게도, 그 초상화는 마치 렘브란트 본인에 의해 완성된 것처럼 보였다!","opts":["그 초상화는 렘브란트가 직접 그린 것이었다.","그 초상화는 렘브란트의 그림과 전혀 달라 보였다.","렘브란트는 그 초상화를 보고 놀랐다.","그 초상화는 마치 렘브란트 본인이 그린 것처럼 보였다."],"r":{"a":"4) 그 초상화는 마치 렘브란트 본인이 그린 것처럼 보였다.","ev":"12번 문장","s":[[12,"Surprisingly, the portrait looked as though it had been done by Rembrandt himself!","놀랍게도, 그 초상화는 마치 렘브란트 본인에 의해 완성된 것처럼 보였다!"]],"w":"as though는 '마치 ~인 것처럼'이에요. 실제로는 AI가 만들었지만 렘브란트 본인이 그린 것처럼 보였다는 뜻이라서, 실제로 렘브란트가 그렸다는 선지는 틀려요.","c":4},"h":"3061463f29"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["인공지능은 렘브란트가 사람의 얼굴과 몸을 어떻게 그렸는지 학습했다.","인공지능은 초상화의 모든 부분을 어떻게 그릴지 정확히 들었다.","연구원들은 인공지능에게 빨간 드레스를 입은 여자를 그리라고 말했다.","그 초상화는 연구원들이 손으로 그렸다."],"opts":["The AI learned how Rembrandt painted human faces and bodies.","The AI was told exactly how to paint every part of the portrait.","The researchers told the AI to paint a woman in a red dress.","The portrait was drawn by hand by the researchers."],"r":{"a":"1) The AI learned how Rembrandt painted human faces and bodies. (인공지능은 렘브란트가 사람의 얼굴과 몸을 어떻게 그렸는지 학습했다.)","ev":"6번 문장","s":[[6,"Based on that data, it learned how Rembrandt painted human faces and bodies in his portraits.","그 자료를 바탕으로, 그것은 렘브란트가 그의 초상화에서 어떻게 사람의 얼굴과 몸을 그렸는지 학습했다."]],"w":"6번 문장에서 AI가 자료를 바탕으로 렘브란트가 초상화에서 사람의 얼굴과 몸을 어떻게 그렸는지 학습했다고 해요. 연구원들은 검은 옷의 30대 남성을 요청했고(8번) 다른 세부 사항은 주지 않았어요(9번).","c":1},"h":"2faf6c9156"},{"n":9,"t":"sum","q":"This new painting was (A) by (B) intelligence (AI) from the Next Rembrandt Project.","ko":"이 새로운 그림은 넥스트 렘브란트 프로젝트의 (B) 지능(AI)에 의해 (A).","oko":["(A) 만들어졌다 / (B) 인공","(A) 만들어졌다 / (B) 자연","(A) 도난당했다 / (B) 인공","(A) 도난당했다 / (B) 인간","(A) 팔렸다 / (B) 인간"],"opts":["(A) created / (B) artificial","(A) created / (B) natural","(A) stolen / (B) artificial","(A) stolen / (B) human","(A) sold / (B) human"],"r":{"a":"1) (A) created / (B) artificial ((A) 만들어졌다 / (B) 인공)","ev":"4번 문장","s":[[4,"Actually, this painting was created by artificial intelligence (AI) from the Next Rembrandt Project.","사실, 이 그림은 넥스트 렘브란트 프로젝트의 인공지능(AI)에 의해 만들어졌다."]],"w":"4번에서 이 그림은 넥스트 렘브란트 프로젝트의 인공지능(artificial intelligence)에 의해 만들어졌다(was created)고 해요.","c":1},"h":"7bbdc49972"},{"n":10,"t":"fill","q":"They didn’t [A] it any other [B].","ko":"그들은 그것에 다른 어떠한 [B]도 [A]지 ,"ko":"영국인들은 금방이라도 전쟁이 시작될까 봐 ( ).","opts":["기뻐했다","두려워했다","지루해했다","부끄러워했다"],"word":"terrified","r":{"a":"2) 두려워했다","ev":"5번 문장","s":[[5,"British people were terrified that a war would begin at any minute.","영국인들은 금방이라도 전쟁이 시작될 것을 두려워했다."]],"w":"5번 문장은 전쟁이 시작될까 하는 걱정이에요. 6번에서 정부가 불안감을 완화하려고(ease the public’s anxiety) 포스터를 만들었으니 terrified는 '두려워하는'이에요.","c":2},"h":"7f87d62b49"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…a bookstore owner found the poster in an old box and hung it in his store.)","ko":"…한 서점 주인이 그 포스터를 오래된 상자에서 발견했고 그것을 그의 가게에 ( ).","opts":["팔았다","숨겼다","버렸다","걸었다"],"word":"hung","r":{"a":"4) 걸었다","ev":"9번 문장","s":[[9,"Then, in 2000, a bookstore owner found the poster in an old box and hung it in his store.","그 후, 2000년에, 한 서점 주인이 그 포스터를 오래된 상자에서 발견했고 그것을 가게에 걸었다."]],"w":"hung는 hang(걸다)의 과거형이에요. 포스터를 가게에 걸었기 때문에 곧 손님들이 그 인쇄물에 관심을 보여요(10번).","c":4},"h":"6e58444b25"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nEventually, it became a meme!","ko":"밑줄 친 it이 가리키는 것은?","sko":"마침내, 그것은 밈이 되었다!","opts":["그 포스터","서점","영국 정부","2차 세계 대전"],"pron":"it","r":{"a":"1) 그 포스터","ev":"11~12번 문장","s":[[11,"People made parodies of it by changing the words and design, and it quickly became famous worldwide.","사람들은 글자와 디자인을 바꿔서 그것의 패러디를 만들었고, 그것은 전 세계적으로 빠르게 유명해졌다."],[12,"Eventually, it became a meme!","마침내, 그것은 밈이 되었다!"]],"w":"12번의 it은 앞 11번에서 사람들이 패러디를 만든 대상, 즉 그 포스터예요. 포스터가 마침내 밈이 되었다는 말이에요.","c":1,"k":"it = 그 포스터"},"h":"6858366ed1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, it was never officially released to the public.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 그것은 한 번도 공식적으로 대중에게 공개되지 않았다.","opts":["그것은 한 번도 공식적으로 대중에게 공개되지 않았다.","그것은 공식적으로 대중에게 여러 번 공개되었다.","그것은 대중에게만 공개되고 정부에는 공개되지 않았다.","그것은 공개되었지만 대중은 관심이 없었다."],"r":{"a":"1) 그것은 한 번도 공식적으로 대중에게 공개되지 않았다.","ev":"8번 문장","s":[[8,"However, it was never officially released to the public.","하지만, 그것은 한 번도 공식적으로 대중에게 공개되지 않았다."]],"w":"never duced in 1939, just a few days before World War II.","그것은 원래 2차 세계 대전이 있기 불과 며칠 전, 1939년에 제작된 포스터였다."]],"w":"4번에서 It was originally a poster produced in 1939, just a few days before World War II라고 했어요. was 뒤에는 부사 originally, a few 뒤에는 복수 명사 days(day의 복수형)가 와요.","c":null},"h":"5b9f062514"}]},{"u":4,"id":"hk4-04-4","no":4,"ko":"이럴 땐 무조건 뛰어요!\b","items":[{"n":1,"t":"tf","q":"The beach was full of tourists.","ko":"해변은 관광객들로 가득 차 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The beach was full of tourists.","해변은 관광객들로 가득 차 있었다."]],"w":"2번 문장에 The beach was full of tourists가 그대로 나와요.","c":"T"},"h":"66b8ccda4f"},{"n":2,"t":"tf","q":"Most tourists ran away as soon as the water pulled back.","ko":"대부분의 관광객들은 물이 빠지자마자 도망쳤다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The fascinating sight drove many tourists to take pictures and videos with their phones.","이 매력적인 광경은 많은 관광객들이 휴대폰으로 사진과 동영상을 찍게 했다."]],"w":"5번 문장에서 이 광경 때문에 많은 관광객들이 휴대폰으로 사진과 동영상을 찍었다고 해요. 도망친 사람은 글쓴이 부부였어요.","c":"F"},"h":"20ce330400"},{"n":3,"t":"tf","q":"Tsunamis are huge waves created by earthquakes under the sea.","ko":"쓰나미는 바닷속 지진에 의해 만들어진 거대한 파도이다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"She explained that tsunamis are enormous waves created by earthquakes under the sea.","그녀는 쓰나미가 바닷속 지진에 의해 만들어진 거대한 파도라고 설명했다."]],"w":"14번 문장에서 쓰나미는 바닷속 지진에 의해 만들어진 거대한 파도(enormous waves created by earthquakes under the sea)라고 해요.","c":"T"},"h":"9914100439"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She held my hand and shouted urgently.)","ko":"그녀는 내 손을 잡고 ( ) 소리쳤다.","opts":["다급하게","천천히","조용히","즐겁게"],"word":"urgently","r":{"a":"1) 다급하게","ev":"7번 문장","s":[[7,"She held my hand and shouted urgently.","그녀는 내 손을 잡고 다급하게 소리쳤다."]],"w":"7번 문장은 바로 다음 8번에서 'Run!(뛰어요!)'이라고 외치는 상황이에요. 위험이 눈앞이니 천천히나 즐겁게가 아니라 '다급하게'예요. urgently = 다급하게.","c":1},"h":"67726b6ceb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When we returned to the hotel, we saw many people badly injured.)","ko":"호텔로 돌아왔을 때, 우리는 많은 사람들이 심하게 ( ) 것을 보았다.","opts":["잠든","즐거워하는","다친","지루해하는"],"word":"injured","r":{"a":"3) 다친","ev":"12번 문장","s":[[12,"When we returned to the hotel, we saw many people badly injured.","호텔로 돌아왔을 때, 우리는 많은 사람들이 심하게 다친 것을 보았다."]],"w":"12번은 쓰나미가 지나간 뒤에 호텔로 돌아와서 본 장면이에요. 파도가 모든 것을 파괴했으니(10번) 사람들이 badly injured, 즉 심하게 다쳤어요. injure = 다치게 하다.","c":3},"h":"4301c1327f"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat’s how she knew that something wasn’t right.","ko":"밑줄 친 That이 가리키는 것은?","sko":"그렇게 해서 그녀는 무언가 잘못되었다는 것을 알았다.","opts":["쓰나미가 지진으로 생긴다는 것","쓰나미 전에 바닷물이 매우 빠르게 뒤로 빠진다는 것","관광객들이 사진을 찍은 일","호텔로 돌아온 일"],"r":{"a":"2) 쓰나미 전에 바닷물이 매우 빠르게 뒤로 빠진다는 것","ev":"15~16번 문장","s":[[15,"The seawater pulls back very quickly before a tsunami occurs, and the larger the tsunami is, the faster the sea moves backwards.","쓰나미가 일어나기 전에 바닷물은 매우 빠르게 뒤로 빠지고, 쓰나미가 클수록, 바닷물은 더 빠르게 뒤로 움직인다."],[16,"That’s how she knew that something wasn’t right.","그렇게 해서 그녀는 무언가 잘못되었다는 것을 알았다."]],"w":"That's how ~는 '그렇게 해서 ~'라는 뜻이라서 바로 앞 15번의 내용을 받아요. 쓰나미가 일어나기 전에 바닷물이 빠르게 뒤로 빠지는 것을 보고 무언가 잘못되었다는 것을 알았어요.","c":2},"h":"da5c04400f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If we hadn’t fled, we might not be alive now.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 우리가 도망가지 않았다면, 우리는 지금 살아 있지 않을 수도 있다.","opts":["우리는 도망가지 않아서 지금 살아 있지 않다.","우리는 도망가서 지금 살아 있지 않다.","우리가 도망가면 살아 있지 않을 것이다.","우리가 도망가지 않았다면 지금 살아 있지 않을 수도 있다."],"r":{"a":"4) 우리가 도망가지 않았다면 지금 살아 있지 않을 수도 있다.","ev":"17번 문장","s":[[17,"If we hadn’t fled, we might not be alive now.","만약 우리가 도망가지 않았다면, 우리는 지금 살아 있지 않을 수도 있다."]],"w":"If we hadn’t fled는 실제로는 도망갔다는 뜻이에요. 그래서 '도망가지 않았다면 지금 살아 있지 않을 수도 있다'가 맞아요. 지금 살아 있다는 것이 전제예요.","c":4},"h":"43a1ee1900"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그들은 거대한 파도가 오기 전에 높은 언덕으로 달려갔다.","그들은 동영상을 찍으려고 바다 쪽으로 달려갔다.","그들은 파도가 지나갈 때까지 호텔 안에 숨어 있었다.","그들은 헤엄쳐 도망치려고 바다로 뛰어들었다."],"opts":["They ran toward a high hill before the giant wave came.","They ran toward the sea to take videos.","They hid inside the hotel until the wave passed.","They jumped into the sea to swim away."],"r":{"a":"1) They ran toward a high hill before the giant wave came.","ev":"9~10번 문장","s":[[9,"We ran toward a high hill.","우리는 높은 언덕을 향해 달려갔다."],[10,"Soon after, a giant wave crashed into the shore, destroying everything in its path.","곧이어, 거대한 파도가 해안에 부딪치고 나서, 그 경로에 있는 모든 것을 파괴했다."]],"w":"9번에서 높은 언덕을 향해 달렸고, 10번에서 곧이어 거대한 파도가 해안에 부딪쳤어요. 바다로 달려가거나 호텔에 숨은 것이 아니에요.","c":1},"h":"ea67130028"},{"n":9,"t":"sum","q":"Soon after, a giant wave (A) into the shore, (B) everything in its path.","ko":"곧이어, 거대한 파도가 해안에 (A), 그 경로에 있는 모든 것을 (B).","oko":["(A) 부딪치고 / (B) 파괴했다","(A) 부딪치고 / (B) 지었다","(A) 미끄러지고 / (B) 파괴했다","(A) 미끄러지고 / (B) 지었다","(A) 떠가고 / (B) 지었다"],"opts":["(A) crashed / (B) destroying","(A) crashed / (B) building","(A) slid / (B) destroying","(A) slid / (B) building","(A) floated / (B) building"],"r":{"a":"1) (A) crashed / (B) destroying ((A) 부딪치고 / (B) 파괴했다)","ev":"10번 문장","s":[[10,"Soon after, a giant wave crashed into the shore, destroying everything in its path.","곧이어, 거대한 파도가 해안에 부딪치고 나서, 그 경로에 있는 모든 것을 파괴했다."]],"w":"10번에서 거대한 파도가 해안에 부딪치고(crashed) 그 경로에 있는 모든 것을 파괴했다(destroying)고 해요.","c":1},"h":"8dbffa3977"},{"n":10,"t":"fill","q":"Suddenly, a waiter [A] to the sea. The water was [B] back very fast.","ko":"갑자기, 한 종업원이 바다를 [A]. 물이 매우 빠르게 뒤로 [B] 있었다.","bank":["pointed","pulling","injured","tsunami","breakfast","hill"],"bko":{"pointed":"가리켰다","pulling":"빠지고","injured":"다친","tsunami":"쓰나미","breakfast":"아침 식사","hill":"언덕"},"r":{"a":"[A] pointed, [B] pulling","ev":"3~4번 문장","s":[[3,"Suddenly, a waiter pointed to the sea.","갑자기, 한 종업원이 바다를 가리켰다."],[4,"The water was pulling back very fast.","물이 매우 빠르게 뒤로 빠지고 있었다."]],"w":"3~4번 문장 a waiter pointed to the sea와 The water was pulling back very fast에서 가져왔어요. [A]는 과거 동사, [B]는 was 뒤의 -ing 동사가 필요해서 나머지 단어들은 들어갈 수 없어요.","c":null},"h":"3f2131673c"}]},{"u":5,"id":"hk4-05-1","no":1,"ko":"작은 목소리들이 모여\b","items":[{"n":1,"t":"tf","q":"More than 35,000 people signed the online petition.","ko":"3만 5천 명이 넘는 사람들이 온라인 청원에 서명했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Soon, over 35,000 people signed it.","곧, 3만 5천 명이 넘는 사람들이 그것에 서명했다."]],"w":"6번 문장에 over 35,000 people signed it(3만 5천 명이 넘는 사람이 서명했다)이라고 나와요. 맞는 내용이에요.","c":"T"},"h":"0b30f0ebe5"},{"n":2,"t":"tf","q":"Before the petition, every person printed on British money was a man, with no exception.","ko":"청원 전에는 영국 화폐에 인쇄된 모든 사람이 예외 없이 남자였다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In the U.K., all of the people printed on money were men, except for Queen Elizabeth II.","영국에서는, 엘리자베스 2세 여왕을 제외하고는, 화폐에 인쇄된 모든 사람들이 남자였다."]],"w":"4번 문장에서 엘리자베스 2세 여왕을 제외하고(except for Queen Elizabeth II) 모두 남자였다고 해요. 여왕이 있었으니 '예외 없이'는 틀려요.","c":"F"},"h":"5372c38625"},{"n":3,"t":"tf","q":"Governments around the world, including Korea, offer websites for petitions.","ko":"한국을 포함한 세계 곳곳의 정부는 청원을 위한 웹사이트를 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Governments around the world, including Korea, offer petition websites where citizens can directly express their opinions.","한국을 포함하여, 세계 곳곳의 정부는 시민들이 직접적으로 그들의 의견을 표현할 수 있는 청원 웹사이트를 제공한다."]],"w":"8번 문장에 Governments around the world, including Korea, offer petition websites가 그대로 나와요.","c":"T"},"h":"ea2802afa2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (By sharing an issue with people and collecting their signatures, you can turn your ideas into action.)","ko":"사람들과 문제를 공유하고 그들의 ( )을 모아서, 당신의 생각을 행동으로 바꿀 수 있다.","opts":["사진","서명","주소","용돈"],"word":"signatures","r":{"a":"2) 서명","ev":"3번 문장","s":[[3,"By sharing an issue with people and collecting their signatures, you can turn your ideas into action.","사람들과 문제를 공유하고 그들의 서명을 모아서, 당신의 생각을 행동으로 바꿀 수 있다."]],"w":"청원은 여러 사람이 이름을 적어 뜻을 모으는 거예요. 3번에서 문제를 공유하고 모으는 것은 서명(signature)이에요.","c":2},"h":"5f3d191fff"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Petitions draw attention to important issues that may be overlooked.)","ko":"청원은 ( ) 수도 있는 중요한 문제들에 관심을 끌어낸다.","opts":["간과되는","해결되는","기록되는","금지되는"],"word":"overlooked","r":{"a":"1) 간과되는","ev":"9번 문장","s":[[9,"Although leaders may not be able to reply to every opinion, petitions draw attention to important issues that may be overlooked.","비록 지도자들이 모든 의견에 답하지 못할 수도 있지만, 청원은 간과될 수도 있는 중요한 문제들에 관심을 끌어낸다."]],"w":"청원이 관심을 끌어내는 이유를 생각해 보세요. 사람들이 그냥 지나치기 쉬운 문제를 알리는 거예요. overlook은 '간과하다', overlooked는 '간과된'이에요.","c":1},"h":"316b0f7ace"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nOne woman wanted to change this, so she started an online petition.","ko":"밑줄 친 she가 가리키는 것은?","sko":"한 여성은 이것을 바꾸고 싶었고, 그래서 그녀는 온라인 청원을 시작했다.","opts":["한 여성","엘리자베스 2세 여왕","제인 오스틴","영국 은행"],"pron":"she","r":{"a":"1) 한 여성","ev":"5번 문장","s":[[5,"One woman wanted to change this, so she started an online petition.","한 여성은 이것을 바꾸고 싶었고, 그래서 그녀는 온라인 청원을 시작했다."]],"w":"5번의 she는 같은 문장의 One woman(한 여성)이에요. 이 문제를 바꾸고 싶어서 온라인 청원을 시작한 사람이에요.","c":1,"k":"she = 한 여성"},"h":"c87fced268"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"One person's voice may not be enough to influence a government or a society, but online petitions can be.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"한 사람의 목소리는 정부나 사회에 영향을 주기에 충분하지 않을 수 있지만, 온라인 청원은 충분할 수 있다.","opts":["한 사람의 목소리도 온라인 청원만큼 정부에 큰 영향을 준다.","온라인 청원은 정부나 사회에 영향을 주기에 충분하지 않을 수 있다.","정부나 사회는 한 사람의 목소리에 영향을 받지 않으려고 청원을 만든다.","한 사람의 목소리로는 부족할 수 있어도, 온라인 청원은 정부나 사회에 영향을 줄 만큼 충분할 수 있다."],"r":{"a":"4) 한 사람의 목소리로는 부족할 수 있어도, 온라인 청원은 정부나 사회에 영향을 줄 만큼 충분할 수 있다.","ev":"2번 문장","s":[[2,"One person’s voice may not be enough to influence a government or a society, but online petitions can be.","정부나 사회에 영향을 주기에 한 사람의 목소리는 충분하지 않을 수 있지만, 온라인 청원은 충분할 수 있다."]],"w":"but을 기준으로 앞은 '한 사람의 목소리는 부족할 수 있다', 뒤는 '온라인 청원은 충분할 수 있다'예요. 뒤의 can be는 can be enough의 줄임이에요.","c":4},"h":"b0f8eedc0e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["더 많은 사람이 청원에 참여할수록 더 나은 사회를 만들기가 쉬워진다.","청원은 한 사람만 서명할 때 가장 효과가 좋다.","청원은 사회를 더 나쁘게 만든다.","청원이 쉬워질수록 참여하는 사람이 줄어든다."],"opts":["When more people take part in a petition, a better society is easier to build.","A petition works best when only one person signs it.","Petitions make a society worse.","Fewer people join a petition as it becomes easier."],"r":{"a":"1) When more people take part in a petition, a better society is easier to build. (더 많은 사람이 청원에 참여할수록 더 나은 사회를 만들기가 쉬워진다.)","ev":"10번 문장","s":[[10,"As more people participate in a petition, it becomes easier to inspire change for a better society.","더 많은 사람들이 청원에 참여함에 따라, 더 나은 사회를 위한 변화를 일으키는 것이 더 쉬워진다."]],"w":"10번에서 더 많은 사람이 청원에 참여할수록 더 나은 사회를 위한 변화를 일으키기가 더 쉬워진다고 해요.","c":1},"h":"038ce709df"},{"n":9,"t":"sum","q":"As a result, the Bank of England (A) to print the face of Jane Austen on the ten-pound bill, (B) Charles Darwin.","ko":"결과적으로, 영국 은행은 찰스 다윈을 (B) 제인 오스틴의 얼굴을 10파운드 지폐에 인쇄하기로 (A).","oko":["(A) 결정했다 / (B) 대신하여","(A) 결정했다 / (B) 고마워하며","(A) 거절했다 / (B) 대신하여","(A) 거절했다 / (B) 고마워하며","(A) 잊었다 / (B) 고마워하며"],"opts":["(A) decided / (B) replacing","(A) decided / (B) thanking","(A) refused / (B) replacing","(A) refused / (B) thanking","(A) forgot / (B) thanking"],"r":{"a":"1) (A) decided / (B) replacing ((A) 결정했다 / (B) 대신하여)","ev":"7번 문장","s":[[7,"As a result, the Bank of England decided to print the face of Jane Austen, on the ten-pound bill, replacing Charles Darwin.","결과적으로, 영국 은행은 찰스 다윈을 대신하여, 제인 오스틴의 얼굴을 10파운드 지폐에 인쇄하기로 결정했다."]],"w":"7번에서 영국 은행은 찰스 다윈을 대신하여(replacing) 제인 오스틴의 얼굴을 10파운드 지폐에 인쇄하기로 결정했다(decided)고 해요.","c":1},"h":"d96029fa97"},{"n":10,"t":"fill","q":"Is there an issue that you’d [A] to [B]?","ko":"당신이 [B]기를 [A] 문제가 있는가?","bank":["like","change","signed","printed","replace","reply"],"bko":{"like":"원하다","change":"바꾸다","signed":"서명했다(sign의 과거)","printed":"인쇄된","replace":"대신하다","reply":"답하다"},"a":"[A] like, [B] change","r":{"a":"[A] like (원하다), [B] change (바꾸다)","ev":"1번 문장","s":[[1,"Is there an issue that you’d like to change?","당신은 바꾸고 싶은 문제가 있는가?"]],"w":"1번에서 Is there an issue that you’d like to change?라고 했어요. you’d(you would) 뒤에는 like to + 동사원형 change가 와요.","c":null},"h":"03285fe98d"}]},{"u":5,"id":"hk4-05-2","no":2,"ko":"레드, 화이트, 그리고 핑크\b","items":[{"n":1,"t":"tf","q":"Myoglobin stores oxygen and gives it to muscles when they need it.","ko":"미오글로빈은 산소를 저장하고 근육이 필요로 할 때 그것을 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Myoglobin stores and distributes oxygen to muscles when they need it.","미오글로빈은 산소를 저장하고 근육이 산소를 필요로 할 때(산소를) 근육에 분배한다."]],"w":"6번 문장에 Myoglobin stores and distributes oxygen to muscles when they need it이 나와요. 산소를 저장했다가 필요할 때 나누어 주는 일이 맞아요.","c":"T"},"h":"23c9caf209"},{"n":2,"t":"tf","q":"Red meat is red because of blood.","ko":"붉은 고기는 피 때문에 붉다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The reason red meat is red is not because of blood, as many people think.","붉은 고기가 붉은 이유는 많은 사람들이 생각하는 것처럼, 피 때문이 아니다."]],"w":"4번 문장은 붉은 고기가 붉은 이유가 많은 사람들이 생각하는 것처럼 피 때문이 아니라고 해요. 진짜 이유는 미오글로빈이에요.","c":"F"},"h":"50fbd02a47"},{"n":3,"t":"tf","q":"Chickens run and jump all day long.","ko":"닭은 하루 종일 달리고 뛴다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"They only occasionally run or jump.","그것들은 가끔씩 달리거나 뛰기만 한다."]],"w":"14번 문장은 닭이 가끔씩만(only occasionally) 달리거나 뛴다고 해요. '하루 종일'은 본문과 반대예요.","c":"F"},"h":"ad0c0bcf6a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Myoglobin stores and distributes oxygen to muscles when they need it.)","ko":"미오글로빈은 산소를 저장하고 근육이 산소를 필요로 할 때 근육에 ( ).","opts":["숨긴다","만든다","분배한다","빼앗는다"],"word":"distributes","r":{"a":"3) 분배한다","ev":"6번 문장","s":[[6,"Myoglobin stores and distributes oxygen to muscles when they need it.","미오글로빈은 산소를 저장하고 근육이 산소를 필요로 할 때(산소를) 근육에 분배한다."]],"w":"산소를 저장해 두었다가 근육이 필요할 때 근육에게 나누어 주는 거예요. distribute는 '분배하다'예요.","c":3},"h":"e8b98bc657"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They only occasionally run or jump.)","ko":"그것들은 ( ) 달리거나 뛰기만 한다.","opts":["매일","가끔씩","하루 종일","절대"],"word":"occasionally","r":{"a":"2) 가끔씩","ev":"14번 문장","s":[[14,"They only occasionally run or jump.","그것들은 가끔씩 달리거나 뛰기만 한다."]],"w":"닭은 소처럼 많이 움직이지 않아요(13번). 그래서 occasionally는 '가끔씩'이에요.","c":2},"h":"8e7a55d509"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes beef look very red.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 소고기가 매우 빨갛게 보이도록 만든다.","opts":["소가 서 있거나 걷는 것","닭이 가끔 달리거나 뛰는 것","소고기가 피 때문에 붉은 것","소의 근육에 미오글로빈이 더 많이 들어 있는 것"],"r":{"a":"4) 소의 근육에 미오글로빈이 더 많이 들어 있는 것","ev":"11~12번 문장","s":[[11,"Therefore, their muscles contain more myoglobin.","따라서, 그것들의 근육엔 더 많은 미오글로빈이 들어 있다."],[12,"This makes beef look very red.","이것은 소고기가 매우 빨갛게 보이도록 만든다."]],"w":"12번 바로 앞 11번에서 소의 근육에 더 많은 미오글로빈이 들어 있다고 했어요. 그래서 소고기가 매우 빨갛게 보이는 거예요.","c":4},"h":"67df987e88"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It depends on how long and how much they move.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 그것들이 얼마나 오래 그리고 얼마나 많이 움직이는지에 달려있다.","opts":["그것은 동물이 얼마나 오래, 얼마나 많이 움직이는지에 달려 있다.","그것은 동물이 얼마나 오래 사는지에 달려 있다.","그것은 동물이 무엇을 먹는지에 달려 있다.","그것은 동물이 얼마나 빨리 자라는지에 달려 있다."],"r":{"a":"1) 그것은 동물이 얼마나 오래, 얼마나 많이 움직이는지에 달려 있다.","ev":"7~8번 문장","s":[[7,"Some animals have lots of myoglobin in their muscles and others have less.","어떤 동물들은 근육에 많은 미오글로빈이 있고 다른 동물들은 더 적게 있다."],[8,"It depends on how long and how much they move.","그것은 그것들이 얼마나 오래 그리고 얼마나 많이 움직이는지에 달려있다."]],"w":"7번에서 동물마다 근육 속 미오글로빈의 양이 다르다고 했고, 8번의 It은 그 차이예요. 그 차이는 얼마나 오래, 얼마나 많이 움직이는지에 달려 있어요.","c":1},"h":"b776424b4a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["닭고기는 모두 소고기만큼 붉다.","닭의 다리 살은 약간 분홍색이고 날개와 가슴살은 흰색이다.","닭은 하루의 대부분을 가만히 앉아서 보낸다.","닭의 날개는 다리보다 더 분홍색이다."],"opts":["All chicken meat is as red as beef.","The meat from chicken legs is slightly pink, but the wings and breast are white.","Chickens spend most of the day sitting still.","Chicken wings are pinker than chicken legs."],"r":{"a":"2) The meat from chicken legs is slightly pink, but the wings and breast are white. (닭의 다리 살은 약간 분홍색이고 날개와 가슴살은 흰색이다.)","ev":"15번 문장","s":[[15,"As a result, the meat from their legs is slightly pink, but everywhere else, including the wings and breast, is white.","그 결과, 그것들의 다리 살은 약간 분홍색이지만, 날개와 가슴살을 포함한 다른 모든 데는 흰색이다."]],"w":"15번에서 닭의 다리 살은 약간 분홍색이고, 날개와 가슴살을 포함한 다른 곳은 흰색이라고 해요. 닭은 그만큼 돌아다니지 않아요(13번).","c":2},"h":"96a6606fcd"},{"n":9,"t":"sum","q":"Cows usually spend long (A) of time standing or (B).","ko":"소는 보통 서 있거나 (B) 데 긴 (A)을(를) 보낸다.","oko":["(A) 시간 / (B) 걷는","(A) 시간 / (B) 자는","(A) 해 / (B) 걷는","(A) 해 / (B) 자는","(A) 식사 / (B) 자는"],"opts":["(A) periods / (B) walking","(A) periods / (B) sleeping","(A) years / (B) walking","(A) years / (B) sleeping","(A) meals / (B) sleeping"],"r":{"a":"1) (A) periods / (B) walking ((A) 시간 / (B) 걷는)","ev":"9번 문장","s":[[9,"Cows usually spend long periods of time standing or walking.","소는 보통 서 있거나 걷는 데 긴 시간을 보낸다."]],"w":"9번에서 소는 보통 서 있거나 걷는(walking) 데 긴 시간(periods of time)을 보낸다고 해요.","c":1},"h":"fb70625248"},{"n":10,"t":"fill","q":"It’s actually [A] by myoglobin, which is a reddish-colored [B] in muscles.","ko":"그것은 사실 미오글로빈 때문에 [A], 미오글로빈은 근육에 있는 불그스름한 색깔의 [B]이다.","bank":["caused","protein","oxygen","blood","stores","needs"],"bko":{"caused":"일으켜진(cause의 과거분사)","protein":"단백질","oxygen":"산소","blood":"피","stores":"저장하다(store의 3인칭 단수)","needs":"필요로 하다(need의 3인칭 단수)"},"a":"[A] caused, [B] protein","r":{"a":"[A] caused (일으켜진(cause의 과거분사)), [B] protein (단백질)","ev":"5번 문장","s":[[5,"It’s actually caused by myoglobin, which is a reddish-colored protein in muscles.","그것은 사실 미오글로빈으로 인한 것인데, 이것은 근육에 있는 불그스름한 색깔의 단백질이다."]],"w":"5번에서 It’s actually caused by myoglobin, which is a reddish-colored protein in muscles라고 했어요. is 뒤 by 앞에는 과거분사 caused, a reddish-colored 뒤에는 명사 protein이 와요. stores·needs는 동사라서 들어갈 수 없어요.","c":null},"h":"43d00a4bef"}]},{"u":5,"id":"hk4-05-3","no":3,"ko":"월요일이 기다려지는 이유\b","items":[{"n":1,"t":"tf","q":"On the fourth Friday of Novembe
