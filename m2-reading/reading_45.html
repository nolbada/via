rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"Hello, friends! Me name is Monica, and I live in Venice.","ko":"안녕, 친구들! 내 이름은 Monica이고, 나는 베네치아에서 살고 있어.","ok":false,"foot":[],"fixes":[{"wrong":"Me","right":"My","partial":false,"at":[2],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 My 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 My 사용"}]},{"n":2,"tag":null,"en":"Have you heard of Venice? It is a beautifully city on the water in Italy.","ko":"베네치아에 대해 들어 본 적 있니? 그것은 이탈리아의 물 위에 있는 아름다운 도시야.","ok":false,"foot":[],"fixes":[{"wrong":"beautifully","right":"beautiful","partial":false,"at":[8],"point":"형용사와 부사: 명사 city를 꾸미는 형용사 beautiful 사용","topic":"형용사와 부사","memo":"명사 city를 꾸미는 형용사 beautiful 사용"}]},{"n":3,"tag":null,"en":"Venice is famous of its canals and historic buildings. Many tourists comes to see them every year.","ko":"베네치아는 운하와 역사적인 건물들로 유명해. 많은 여행객들이 매년 그것들을 보러 와.","ok":false,"foot":[],"fixes":[{"wrong":"of","right":"for","partial":false,"at":[3],"point":"기본전치사: be famous for: ~로 유명하다","topic":"기본전치사","memo":"be famous for: ~로 유명하다"},{"wrong":"comes","right":"come","partial":false,"at":[11],"point":"주어와 동사의 수일치: 주어 tourists는 복수: comes가 아니라 come","topic":"주어와 동사의 수일치","memo":"주어 tourists는 복수: comes가 아니라 come"}]},{"n":4,"tag":null,"en":"But now, we has a big problem. Last week, the streets were flooded.","ko":"그런데 지금, 우리는 큰 문제를 겪고 있어. 지난주에, 거리가 침수됐어.","ok":false,"foot":[],"fixes":[{"wrong":"has","right":"have","partial":false,"at":[3],"point":"일반동사의 현재형: 주어 we에는 has가 아니라 have","topic":"일반동사의 현재형","memo":"주어 we에는 has가 아니라 have"}]},{"n":5,"tag":null,"en":"I couldn't went to school, and my parents' bakery had to close. I had to wear tall rain boots all the time.","ko":"나는 학교에 갈 수 없었고, 우리 부모님의 빵집은 문을 닫아야 했어. 나는 줄곧 긴 장화를 신어야 했어.","ok":false,"foot":[],"fixes":[{"wrong":"went","right":"go","partial":false,"at":[2],"point":"조동사 can의 과거형: 조동사 부정형 뒤에는 동사원형 go 사용","topic":"조동사 can의 과거형","memo":"조동사 부정형 뒤에는 동사원형 go 사용"}]},{"n":6,"tag":null,"en":"I'm real worried. The warmer the Earth get, the high the water in Venice rises.","ko":"나는 정말 걱정이야. 지구가 더 더워질수록 베네치아의 수위는 더 상승해.","ok":false,"foot":[],"fixes":[{"wrong":"real","right":"really","partial":false,"at":[1],"point":"형용사와 부사: 형용사 worried를 꾸미는 부사 really 사용","topic":"형용사와 부사","memo":"형용사 worried를 꾸미는 부사 really 사용"},{"wrong":"get","right":"gets","partial":false,"at":[7],"point":"3인칭 단수 현재형: 단수 주어 the Earth에는 gets 사용","topic":"3인칭 단수 현재형","memo":"단수 주어 the Earth에는 gets 사용"},{"wrong":"high","right":"higher","partial":false,"at":[9],"point":"비교급: the+비교급 ~, the+비교급 구문: the higher","topic":"비교급","memo":"the+비교급 ~, the+비교급 구문: the higher"}]},{"n":7,"tag":null,"en":"Venice could be underwater soon. My city needs your help!","ko":"베네치아는 곧 물에 잠길 수도 있어. 나의 도시는 너희들의 도움이 필요해!","ok":true,"foot":[],"fixes":[]},{"n":8,"tag":null,"en":"Hi, Monica! I'm Timothy from the United States.","ko":"안녕, Monica! 나는 미국의 Timothy야.","ok":true,"foot":[],"fixes":[]},{"n":9,"tag":null,"en":"My family visit Venice three years ago and we loved it! I am surprised and sad to hear your news.","ko":"우리 가족은 3년 전에 베네치아를 방문했고 우리는 그곳을 아주 좋아했어! 나는 네 소식을 듣고 놀랐고 슬퍼.","ok":false,"foot":[],"fixes":[{"wrong":"visit","right":"visited","partial":false,"at":[2],"point":"과거시제: three years ago는 과거: visit가 아니라 visited","topic":"과거시제","memo":"three years ago는 과거: visit가 아니라 visited"}]},{"n":10,"tag":null,"en":"I want do my part to help your city and the Earth. I recently found out interesting something.","ko":"나는 너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어. 나는 최근에 재미있는 것을 알게 됐어.","ok":false,"foot":[],"fixes":[{"wrong":"do","right":"to do","partial":false,"at":[2],"point":"to부정사: want 뒤에는 to부정사 to do 사용","topic":"to부정사","memo":"want 뒤에는 to부정사 to do 사용","alt":[1]},{"wrong":"interesting something","right":"something interesting","partial":false,"at":[16],"point":"형용사의 위치: -thing 뒤에서 수식: something interesting","topic":"형용사의 위치","memo":"-thing 뒤에서 수식: something interesting"}]},{"n":11,"tag":null,"en":"The more meat we eat, the hot our planet gets. This is because lots of trees is cut down to make animal farms.","ko":"우리가 더 많은 고기를 먹을수록 우리의 행성은 더 뜨거워져. 이것은 동물 농장을 만들기 위해 많은 나무가 베어지기 때문이야.","ok":false,"foot":[],"fixes":[{"wrong":"hot","right":"hotter","partial":false,"at":[6],"point":"비교급: the+비교급 구문: the hotter","topic":"비교급","memo":"the+비교급 구문: the hotter"},{"wrong":"is","right":"are","partial":false,"at":[16],"point":"be동사의 수일치: lots of trees는 복수: is가 아니라 are","topic":"be동사의 수일치","memo":"lots of trees는 복수: is가 아니라 are"}]},{"n":12,"tag":null,"en":"This increases greenhouse gases. Also, cows pass a lots of gas.","ko":"이것은 온실가스를 증가시켜. 또한, 소는 많은 가스를 배출해.","ok":false,"foot":[],"fixes":[{"wrong":"lots","right":"lot","partial":false,"at":[8],"point":"수량 형용사: a lot of는 lot이 단수: a lots of는 틀림","topic":"수량 형용사","memo":"a lot of는 lot이 단수: a lots of는 틀림"}]},{"n":13,"tag":null,"en":"Smelly! But this is not the worse part.","ko":"고약한 냄새가 나! 그런데 이것이 최악인 부분은 아니야.","ok":false,"foot":[],"fixes":[{"wrong":"worse","right":"worst","partial":false,"at":[6],"point":"최상급: the 뒤 최상급 the worst 사용","topic":"최상급","memo":"the 뒤 최상급 the worst 사용"}]},{"n":14,"tag":null,"en":"The gas from cow also adds to greenhouse gases. Greenhouse gases make the Earth hotter.","ko":"소에게서 나온 가스는 또한 온실가스에 추가돼. 온실가스는 지구를 더 뜨겁게 만들어.","ok":false,"foot":[],"fixes":[{"wrong":"cow","right":"cows","partial":false,"at":[3],"point":"명사의 복수형: 일반적인 소들을 말하므로 복수형 cows 사용","topic":"명사의 복수형","memo":"일반적인 소들을 말하므로 복수형 cows 사용"}]},{"n":15,"tag":null,"en":"So, I'm trying to eat fewer meat to slow down global warming. It isn't easy to change my eating habits, but I'm doing my best.","ko":"그래서, 나는 지구 온난화를 늦추기 위해서 고기를 덜 먹으려고 노력하고 있어. 나의 식습관을 바꾸는 것은 쉽지 않지만, 나는 최선을 다하고 있어.","ok":false,"foot":[],"fixes":[{"wrong":"fewer","right":"less","partial":false,"at":[5],"point":"수량 형용사 few/less: meat는 셀 수 없으므로 less 사용","topic":"수량 형용사 few/less","memo":"meat는 셀 수 없으므로 less 사용"}]},{"n":16,"tag":null,"en":"Hello, I'm Suin from Korea. Every summers, it rains a lot here.","ko":"안녕, 나는 한국의 수인이야. 매년 여름에 여기는 비가 많이 와.","ok":false,"foot":[],"fixes  gases.","이것은 온실가스를 증가시켜.",0],["Also, cows pass a lot of gas.","또한, 소는 많은 가스를 배출해.",0],["Smelly!","고약한 냄새가 나!",0],["But this is not the worst part.","그런데 이것이 최악인 부분은 아니야.",0],["The gas from cows also adds to greenhouse gases.","소에게서 나온 가스는 또한 온실가스에 추가돼.",0],["Greenhouse gases make the Earth hotter.","온실가스는 지구를 더 뜨겁게 만들어.",0],["So, I'm trying to eat less meat to slow down global warming.","그래서, 나는 지구 온난화를 늦추기 위해서 고기를 덜 먹으려고 노력하고 있어.",0],["It isn't easy to change my eating habits, but I'm doing my best.","나의 식습관을 바꾸는 것은 쉽지 않지만, 나는 최선을 다하고 있어.",0],["Hello, I'm Suin from Korea.","안녕, 나는 한국의 수인이야.",1],["Every summer, it rains a lot here.","매년 여름에 여기는 비가 많이 와.",0],["Sometimes, we have floods and they are really scary.","때때로, 우리는 홍수를 겪고 그것들은 정말 무서워.",0],["The situation in Venice must be scary, too.","베네치아의 상황도 무서울 게 틀림없어.",0],["I've never been to Venice, but I have seen many beautiful pictures of it.","나는 베네치아에 가 본 적이 없지만, 그곳의 많은 아름다운 사진들을 본 적이 있어.",0],["I talked to my friends about the floods in your city.","나는 너희 도시의 홍수에 관해 친구들과 이야기했어.",0],["We wanted to help Venice, so we started the 3R campaign.","우리는 베네치아를 돕고 싶어서, 3R 캠페인을 시작했어.",0],["The 3Rs are Recycle, Reuse, and Reduce.","3R은 '재활용하다', '재사용하다', 그리고 '줄이다'야.",0],["Now, many students at my school are doing these three things every day.","지금, 우리 학교에서 많은 학생들이 이 세 가지를 매일 하고 있어.",0],["It is important to do our part for Venice.","베네치아를 위해 우리의 역할을 하는 것이 중요해.",0],["Together, we can make a difference!","함께, 우리는 변화를 만들 수 있어!",0]];var RNUM=45;var TITLE_EN="Save the City on the Water";var PASS_EN=["Save the City on the Water","Hello, friends! My name is Monica, and I live in Venice. Have you heard of Venice? It is a beautiful city on the water in Italy. Venice is famous for its canals and historic buildings. Many tourists come to see them every year.","But now, we have a big problem. Last week, the streets were flooded. I couldn't go to school, and my parents' bakery had to close. I had to wear tall rain boots all the time. I'm really worried. The warmer the Earth gets, the higher the water in Venice rises. Venice could be underwater soon. My city needs your help!","Hi, Monica! I'm Timothy from the United States. My family visited Venice three years ago and we loved it! I am surprised and sad to hear your news. I want to do my part to help your city and the Earth. I recently found out something interesting. The more meat we eat, the hotter our planet gets. This is because lots of trees are cut down to make animal farms. This increases greenhouse gases. Also, cows pass a lot of gas. Smelly! But this is not the worst part. The gas from cows also adds to greenhouse gases. Greenhouse gases make the Earth hotter. So, I'm trying to eat less meat to slow down global warming. It isn't easy to change my eating habits, but I'm doing my best.","Hello, I'm Suin from Korea. Every summer, it rains a lot here. Sometimes, we have floods and they are really scary. The situation in Venice must be scary, too. I've never been to Venice, but I have seen many beautiful pictures of it. I talked to my friends about the floods in your city. We wanted to help Venice, so we started the 3R campaign. The 3Rs are Recycle, Reuse, and Reduce. Now, many students at my school are doing these three things every day. It is important to do our part for Venice. Together, we can make a difference!"];var PASS_KO=["물 위의 도시를 구하라","안녕, 친구들! 내 이름은 Monica이고, 나는 베네치아에서 살고 있어. 베네치아에 대해 들어 본 적 있니? 그것은 이탈리아의 물 위에 있는 아름다운 도시야. 베네치아는 운하와 역사적인 건물들로 유명해. 많은 여행객들이 매년 그것들을 보러 와.","그런데 지금, 우리는 큰 문제를 겪고 있어. 지난주에, 거리가 침수됐어. 나는 학교에 갈 수 없었고, 우리 부모님의 빵집은 문을 닫아야 했어. 나는 줄곧 긴 장화를 신어야 했어. 나는 정말 걱정이야. 지구가 더 더워질수록 베네치아의 수위는 더 상승해. 베네치아는 곧 물에 잠길 수도 있어. 나의 도시는 너희들의 도움이 필요해!","안녕, Monica! 나는 미국의 Timothy야. 우리 가족은 3년 전에 베네치아를 방문했고 우리는 그곳을 아주 좋아했어! 나는 네 소식을 듣고 놀랐고 슬퍼. 나는 너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어. 나는 최근에 재미있는 것을 알게 됐어. 우리가 더 많은 고기를 먹을수록 우리의 행성은 더 뜨거워져. 이것은 동물 농장을 만들기 위해 많은 나무가 베어지기 때문이야. 이것은 온실가스를 증가시켜. 또한, 소는 많은 가스를 배출해. 고약한 냄새가 나! 그런데 이것이 최악인 부분은 아니야. 소에게서 나온 가스는 또한 온실가스에 추가돼. 온실가스는 지구를 더 뜨겁게 만들어. 그래서, 나는 지구 온난화를 늦추기 위해서 고기를 덜 먹으려고 노력하고 있어. 나의 식습관을 바꾸는 것은 쉽지 않지만, 나는 최선을 다하고 있어.","안녕, 나는 한국의 수인이야. 매년 여름에 여기는 비가 많이 와. 때때로, 우리는 홍수를 겪고 그것들은 정말 무서워. 베네치아의 상황도 무서울 게 틀림없어. 나는 베네치아에 가 본 적이 없지만, 그곳의 많은 아름다운 사진들을 본 적이 있어. 나는 너희 도시의 홍수에 관해 친구들과 이야기했어. 우리는 베네치아를 돕고 싶어서, 3R 캠페인을 시작했어. 3R은 '재활용하다', '재사용하다', 그리고 '줄이다'야. 지금, 우리 학교에서 많은 학생들이 이 세 가지를 매일 하고 있어. 베네치아를 위해 우리의 역할을 하는 것이 중요해. 함께, 우리는 변화를 만들 수 있어!"];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["things that can be easily upcycled","Eric's new bag made from old jeans","what is upcycling and how to start it","why upcycling is helpful for the environment","how to make a pencil case from an old skirt"],"a":2,"ans":"what is upcycling and how to start it","evs":[["B: We can make new things from old things. It’s called upcycling.","우리는 낡은 물건으로 새로운 물건을 만들 수 있어. 그걸 업사이클링이라고 해."],["G: I’d like to try it. What can I do to start upcycling?","나도 해 보고 싶어. 업사이클링을 시작하려면 뭘 하면 돼?"]],"ev":["B: We can make new things from old things. It’s called upcycling.","우리는 낡은 물건으로 새로운 물건을 만들 수 있어. 그걸 업사이클링이라고 해."],"ow":["오답 ✕ — 대화에서 쉽게 업사이클링할 수 있는 물건들을 모아 소개하는 것이 아니라 업사이클링이 무엇인지와 시작하는 방법을 이야기하므로 범위가 어긋나 틀림.","오답 ✕ — Eric의 청바지 가방은 'I made it from old jeans.'(나는 그것을 낡은 청바지로 만들었어.)처럼 대화의 시작에 나오는 한 예일 뿐이고, 대화 전체의 주제는 아니라서 틀림.","정답 ○ — 'It’s called upcycling.'(그걸 업사이클링이라고 해.)로 뜻을 설명하고, 'What can I do to start upcycling?'(업사이클링을 시작하려면 뭘 하면 돼?)에 대한 단계별 방법을 알려 주므로 맞음.","오답 ✕ — 업사이클링이 환경에 왜 도움이 되는지는 대화에 나오지 않아 틀림. 대화는 방법 중심임.","오답 ✕ — 낡은 치마로 필통 만들기는 Yena가 하려는 한 가지 예일 뿐이고, 'Oh, I want to make a pencil case.'(필통을 만들고 싶어.)만으로는 대화 전체 주제가 되기에 좁아 틀림."],"memo":["정답 ③: what is upcycling and how to start it(업사이클링이 무엇이고 어떻게 시작하는지)","근거: It’s called upcycling.(그걸 업사이클링이라고 해.) / What can I do to start upcycling?(업사이클링을 시작하려면 뭘 하면 돼?)","함정: ⑤ 필통 만들기는 한 가지 예라서 너무 좁아 ✕"],"why":"업사이클링이 무엇인지 설명하고 시작하는 방법을 알려 주는 대화이다."},{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Eric used old jeans to make a bag.","Upcycling is making new things from old things.","Yena has an old skirt and she wears it often.","Yena will make a pencil case from old clothes.","Yena has to wash the old skirt before upcycling."],"a":2,"ans":"Yena has an old skirt and she wears it often.","evs":[["G: Well, I have an old skirt at home.","음, 나 집에 낡은 치마가 있어."],["G: Oh, I want to make a pencil case.","아, 나는 필통을 만들고 싶어."]],"ev":["G: Well, I have an old skirt at home.","음, 나 집에 낡은 치마가 있어."],"ow":["오답 ✕ — Eric이 'I made it from old jeans.'(나는 그것을 낡은 청바지로 만들었어.)라고 했으므로 일치함.","오답 ✕ — Eric이 'We can make new things from old things. It’s called upcycling.'(낡은 물건으로 새로운 물건을 만드는 걸 업사이클링이라고 해.)라고 했으므로 일치함.","정답 ○ — Yena는 'I have an old skirt at home.'(집에 낡은 치마가 있어.)라고만 했고 그 치마를 자주 입는다는 말은 없으므로 일치하지 않음.","오답 ✕ — Yena가 'I want to make a pencil case.'(나는 필통을 만들고 싶어.)라고 했고 재료는 낡은 치마라서 낡은 옷으로 필통을 만들 것이라는 보기는 일치함.","오답 ✕ — Eric이 'don’t forget to wash the skirt before upcycling'(업사이클링하기 전에 치마를 빠는 것을 잊지 마)이라고 했으므로 일치함."],"memo":["정답 ③ (일치하지 않는 것): Yena가 낡은 치마를 자주 입는다는 말은 없다.","근거: Well, I have an old skirt at home.(음, 나 집에 낡은 치마가 있어.)","함정: 나머지 ①②④⑤는 대화와 일치하는 말이라서 ✕"],"why":"Yena는 낡은 치마가 집에 있다고만 했고 자주 입는지는 말하지 않았다."}],"dlg":[["G","Eric, I like your bag! It’s so cute.","Eric, 네 가방 마음에 든다! 정말 귀여워."],["B","Thanks, Yena. I made it from old jeans.","고마워, 예나야. 나는 그것을 낡은 청바지로 만들었어."],["G","Really? That’s amazing!","정말? 놀랍다!"],["B","We can make new things from old things. It’s called upcycling.","우리는 낡은 물건으로 새로운 물건을 만들 수 있어. 그걸 업사이클링이라고 해."],["G","I’d like to try it. What can I do to start upcycling?","나도 해 보고 싶어. 업사이클링을 시작하려면 뭘 하면 돼?"],["B","First, you can find something you don’t need.","먼저, 너에게 필요 없는 물건을 찾으면 돼."],["G","Well, I have an old skirt at home.","음, 나 집에 낡은 치마가 있어."],["B","Good. Then think about an item you want to make.","좋아. 그럼 네가 만들고 싶은 물건을 생각해 봐."],["G","Oh, I want to make a pencil case.","아, 나는 필통을 만들고 싶어."],["B","Perfect. And don’t forget to wash the skirt before upcycling.","완벽해. 그리고 업사이클링하기 전에 치마를 빠는 것을 잊지 마."]]},{"qs":[{"n":3,"q":"위 대화에서 Jake가 배낭의 새 주인을 찾기 위해 하기로 한 방법은?","o":["온라인 벼룩시장을 통해 파는 것","친구에게 선물하는 것","재활용 센터에 버리는 것","가게에 맡기는 것","학교 게시판에 붙이는 것"],"a":0,"ans":"온라인 벼룩시장을 통해 파는 것","evs":[["Lucy: You can sell it through an online flea market.","온라인 벼룩시장을 통해 팔면 돼."],["Jake: That sounds good. I’ll give it a try.","좋은 생각이다. 한번 해 볼게."]],"ev":["Lucy: You can sell it through an online flea market.","온라인 벼룩시장을 통해 팔면 돼."],"ow":["정답 ○ — Lucy가 'You can sell it through an online flea market.'(온라인 벼룩시장을 통해 팔면 돼.)라고 하자 Jake가 'I’ll give it a try.'(한번 해 볼게.)라고 했으므로 맞음.","오답 ✕ — 친구에게 선물한다는 말은 대화에 없음. 새 주인을 찾는 방법은 'an online flea market'(온라인 벼룩시장)이라서 틀림.","오답 ✕ — Lucy는 'people throw out so many good items'(사람들은 좋은 물건을 너무 많이 버려)라며 버리는 것을 안타까워했으므로 재활용 센터에 버린다는 말은 틀림.","오답 ✕ — 가게에 맡긴다는 말은 대화에 없음. 'sell it through an online flea market'(온라인 벼룩시장을 통해 판다)이라고 했으므로 틀림.","오답 ✕ — 학교 게시판 이야기는 대화에 없음. Lucy가 말한 방법은 온라인 벼룩시장이라서 틀림."],"memo":["정답 ①: 온라인 벼룩시장을 통해 파는 것","근거: You can sell it through an online flea market.(온라인 벼룩시장을 통해 팔면 돼.)","함정: ③ Lucy는 좋은 물건을 버리는 것을 안타까워했어서 ✕"],"why":"Jake는 Lucy의 조언대로 배낭을 온라인 벼룩시장에서 팔기로 했다."}],"dlg":[["Lucy","Jake, are you throwing out that backpack?","Jake, 그 배낭 버리려는 거야?"],["Jake","Yeah. I don’t really use it anymore.","응. 이제 별로 안 쓰거든."],["Lucy","But it looks new. These days, people throw out so many good items.","그런데 새것 같아 보이는데. 요즘 사람들은 좋은 물건을 너무 많이 버려."],["Jake","Right. Someone can still use my backpack. What can I do to find a new owner for it?","맞아. 누군가는 아직 내 배낭을 쓸 수 있을 거야. 이 배낭의 새 주인을 찾으려면 어떻게 하면 될까?"],["Lucy","You can sell it through an online flea market.","온라인 벼룩시장을 통해 팔면 돼."],["Jake","That sounds good. I’ll give it a try.","좋은 생각이다. 한번 해 볼게."],["Lucy","Great. Don’t forget to post pictures of the backpack.","좋아. 배낭 사진을 올리는 것을 잊지 마."],["Jake","Thanks for the tip.","조언 고마워."],["Lucy","No problem!","천만에!"]]},{"qs":[{"n":4,"q":"위 대화에서 G가 마지막에 당부한 것은?","o":["방을 나갈 때 불을 끄는 것","에어컨을 하루 종일 켜 두는 것","창문을 연 채로 냉방하는 것","샤워 시간을 길게 하는 것","컴퓨터를 항상 켜 두는 것"],"a":0,"ans":"방을 나갈 때 불을 끄는 것","evs":[["G: And don’t forget to turn off the light when you leave a room.","그리고 방을 나갈 때 불 끄는 것을 잊지 마."]],"ev":["G: And don’t forget to turn off the light when you leave a room.","그리고 방을 나갈 때 불 끄는 것을 잊지 마."],"ow":["정답 ○ — G가 'don’t forget to turn off the light when you leave a room'(방을 나갈 때 불 끄는 것을 잊지 마)이라고 마지막에 말했으므로 맞음.","오답 ✕ — G는 'We can use the air conditioner less often.'(에어컨을 덜 자주 사용하면 돼.)라고 했는데, 이 보기는 하루 종일 켜 두라고 해서 반대로 말해 틀림.","오답 ✕ — 창문을 열고 냉방하라는 말은 대화에 없음. 에너지를 절약하자는 대화이므로 틀림.","오답 ✕ — 샤워 시간에 대한 말은 대화에 없음. 마지막 당부는 'turn off the light'(불 끄기)라서 틀림.","오답 ✕ — 컴퓨터를 항상 켜 두라는 말은 대화에 없고, 'save energy'(에너지를 절약하자)라는 대화 내용과도 반대라서 틀림."],"memo":["정답 ①: 방을 나갈 때 불을 끄는 것","근거: And don’t forget to turn off the light when you leave a room.(방을 나갈 때 불 끄는 것을 잊지 마.)","함정: ②는 에어컨을 '덜' 쓰자고 한 말과 반대라서 ✕"],"why":"에너지 절약을 위해 에어컨을 덜 쓰고, 방을 나갈 때 불을 끄라는 당부이다."}],"dlg":[["G","We need to save energy to slow down global warming.","지구 온난화를 늦추려면 우리는 에너지를 절약해야 해."],["B","You’re right. What can we do to save energy?","네 말이 맞아. 에너지를 절약하려면 우리가 뭘 할 수 있을까?"],["G","We can use the air conditioner less often.","에어컨을 덜 자주 사용하면 돼."],["B","Yeah. That would save a lot of energy.","그래. 그러면 에너지를 많이 절약할 수 있겠다."],["G","And don’t forget to turn off the light when you leave a room.","그리고 방을 나갈 때 불 끄는 것을 잊지 마."]]},{"qs":[{"n":5,"q":"위 대화의 주제로 알맞은 것은?","o":["ways to reduce air pollution","why the sky is blue","how to grow plants indoors","the history of air pollution","ways to save energy at home"],"a":0,"ans":"ways to reduce air pollution","evs":[["G: What can we do to reduce air pollution?","대기 오염을 줄이려면 우리가 뭘 할 수 있을까?"],["B: Start with little things. For example, walk to nearby places.","작은 것부터 시작해. 예를 들어, 가까운 곳은 걸어서 가."]],"ev":["G: What can we do to reduce air pollution?","대기 오염을 줄이려면 우리가 뭘 할 수 있을까?"],"ow":["정답 ○ — G가 'What can we do to reduce air pollution?'(대기 오염을 줄이려면 우리가 뭘 할 수 있을까?)라고 묻고 B가 걸어가기 같은 방법을 알려 주므로 맞음.","오답 ✕ — 하늘이 회색인 것을 보고 대화가 시작되지만, 하늘 색의 이유를 설명하는 대화는 아니라서 틀림. 'Look at the sky! It’s gray.'(하늘 좀 봐! 회색이야.)는 대화를 여는 말일 뿐임.","오답 ✕ — B가 'Don’t forget to care for your plants.'(네 식물을 돌보는 것을 잊지 마.)라고 한 것은 대기 오염을 줄이는 한 방법일 뿐 식물 키우는 방법 자체가 주제는 아니라서 틀림.","오답 ✕ — 'Air pollution is a big problem.'(대기 오염은 큰 문제야.)이라고 했지만 그 역사에 대한 내용은 없어서 틀림.","오답 ✕ — 에너지 절약은 다른 대화(에어컨, 불 끄기)의 주제이고, 이 대화는 대기 오염을 줄이는 방법이라서 틀림."],"memo":["정답 ①: ways to reduce air pollution(대기 오염을 줄이는 방법)","근거: What can we do to reduce air pollution?(대기 오염을 줄이려면 우리가 뭘 할 수 있을까?)","함정: ③ 식물 돌보기는 방법 중 하나일 뿐이라서 ✕"],"why":"걸어가기, 식물 돌보기 등 대기 오염을 줄이는 방법을 이야기한다."}],"dlg":[["G","Look at the sky! It’s gray.","하늘 좀 봐! 회색이야."],["B","Yeah. Air pollution is a big problem.","응. 대기 오염은 큰 문제야."],["G","What can we do to reduce air pollution?","대기 오염을 줄이려면 우리가 뭘 할 수 있을까?"],["B","Start with little things. For example, walk to nearby places.","작은 것부터 시작해. 예를 들어, 가까운 곳은 걸어서 가."],["G","Oh, that’s easy. What else can we do?","아, 그건 쉽네. 또 뭘 할 수 있을까?"],["B","Don’t forget to care for your plants.","네 식물을 돌보는 것을 잊지 마."]]}];var BG=[{"qs":[{"n":6,"q":"윗글을 읽고 Venice에 대해 알 수 있는 것은?","o":["역사","인구 수","환경적 특징","가장 유명한 유적지","평균 방문객 수"],"a":2,"ans":"환경적 특징","evs":[["It is a beautiful city on the water in Italy.","그것은 이탈리아의 물 위에 있는 아름다운 도시야."],["Venice is famous for its canals and historic buildings.","베네치아는 운하와 역사적인 건물들로 유명해."]],"ev":["It is a beautiful city on the water in Italy.","그것은 이탈리아의 물 위에 있는 아름다운 도시야."],"ow":["오답 ✕ — 'historic buildings'(역사적인 건물들)가 나오지만 베네치아의 역사(언제 어떻게 생겼는지)에 대한 설명은 글에 없어서 틀림.","오답 ✕ — 글에 인구 수를 알려 주는 숫자나 표현이 전혀 없어서 틀림.","정답 ○ — 'a beautiful city on the water in Italy'(이탈리아의 물 위에 있는 아름다운 도시)와 'its canals'(운하)처럼 물 위의 도시라는 환경적 특징을 알 수 있으므로 맞음.","오답 ✕ — 'historic buildings'(역사적인 건물들)로 유명하다고만 했고, 가장 유명한 유적지가 무엇인지는 글에 없어서 틀림.","오답 ✕ — 'Many tourists come to see them every year.'(많은 여행객들이 매년 그것들을 보러 와.)라고만 했을 뿐 평균 방문객 수는 나오지 않아서 틀림."],"memo":["정답 ③: 환경적 특징(물 위의 도시, 운하가 있음)","근거: It is a beautiful city on the water in Italy.(그것은 이탈리아의 물 위에 있는 아름다운 도시야.)","함정: ⑤ Many tourists라고만 하고 숫자는 없어서 ✕"],"why":"베네치아는 운하가 있는 물 위의 도시라는 환경적 특징을 알 수 있다."},{"n":7,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Monica lives in Venice, Italy.","Many people visit Venice to see its canals and historic buildings.","Monica couldn't go to school last week due to heavy snow.","Monica's parents run a bakery in Venice.","As the Earth becomes warmer, the water level in Venice goes up."],"a":2,"ans":"Monica couldn't go to school last week due to heavy snow.","evs":[["Last week, the streets were flooded.","지난주에, 거리가 침수됐어."],["I couldn't go to school, and my parents' bakery had to close.","나는 학교에 갈 수 없었고, 우리 부모님의 빵집은 문을 닫아야 했어."]],"ev":["Last week, the streets were flooded.","지난주에, 거리가 침수됐어."],"ow":["오답 ✕ — 'My name is Monica, and I live in Venice.'(내 이름은 Monica이고, 나는 베네치아에서 살고 있어.)와 'a beautiful city on the water in Italy'(이탈리아의 아름다운 도시)라고 했으므로 일치함.","오답 ✕ — 'Venice is famous for its canals and historic buildings. Many tourists come to see them every year.'(베네치아는 운하와 역사적인 건물들로 유명하고 많은 여행객들이 매년 보러 와.)라고 했으므로 일치함.","정답 ○ — Monica가 학교에 못 간 이유는 'the streets were flooded'(거리가 침수됐어)라서 폭설이 아니라 홍수 때문이므로 일치하지 않음.","오답 ✕ — 'my parents' bakery had to close'(우리 부모님의 빵집은 문을 닫아야 했어)라고 했으므로 부모님이 빵집을 운영한다는 보기는 일치함.","오답 ✕ — 'The warmer the Earth gets, the higher the water in Venice rises.'(지구가 더 더워질수록 베네치아의 수위는 더 상승해.)라고 했으므로 일치함."],"memo":["정답 ③ (일치하지 않는 것): 폭설 때문에 학교에 못 갔다(X) → 거리가 침수돼서(flooded) 못 갔다.","근거: Last week, the streets were flooded.(지난주에, 거리가 침수됐어.)","함정: snow(눈)가 아니라 flood(홍수)가 원인"],"why":"Monica가 학교에 못 간 것은 폭설이 아니라 거리가 침수됐기 때문이다."}],"pp":[["Hello, friends!","안녕, 친구들!"],["My name is Monica, and I live in Venice.","내 이름은 Monica이고, 나는 베네치아에서 살고 있어."],["Have you heard of Venice?","베네치아에 대해 들어 본 적 있니?"],["It is a beautiful city on the water in Italy.","그것은 이탈리아의 물 위에 있는 아름다운 도시야."],["Venice is famous for its canals and historic buildings.","베네치아는 운하와 역사적인 건물들로 유명해."],["Many tourists come to see them every year.","많은 여행객들이 매년 그것들을 보러 와."],["But now, we have a big problem.","그런데 지금, 우리는 큰 문제를 겪고 있어."],["Last week, the streets were flooded.","지난주에, 거리가 침수됐어."],["I couldn't go to school, and my parents' bakery had to close.","나는 학교에 갈 수 없었고, 우리 부모님의 빵집은 문을 닫아야 했어."],["I had to wear tall rain boots all the time.","나는 줄곧 긴 장화를 신어야 했어."],["I'm really worried.","나는 정말 걱정이야."],["The warmer the Earth gets, the higher the water in Venice rises.","지구가 더 더워질수록 베네치아의 수위는 더 상승해."],["Venice could be underwater soon.","베네치아는 곧 물에 잠길 수도 있어."],["My city needs your help!","나의 도시는 너희들의 도움이 필요해!"]]},{"qs":[{"n":8,"q":"윗글의 주제로 알맞은 것은?","o":["Timothy's family trip to Venice","the main cause of global warming","the importance of healthy eating habits","a field trip to an animal farm in Venice","Timothy's effort to help Venice and the Earth"],"a":4,"ans":"Timothy's effort to help Venice and the Earth","evs":[["I want to do my part to help your city and the Earth.","나는 너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어."],["So, I'm trying to eat less meat to slow down global warming.","그래서, 나는 지구 온난화를 늦추기 위해서 고기를 덜 먹으려고 노력하고 있어."]],"ev":["I want to do my part to help your city and the Earth.","나는 너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어."],"ow":["오답 ✕ — 'My family visited Venice three years ago and we loved it!'(우리 가족은 3년 전에 베네치아를 방문했고 아주 좋아했어!)가 나오지만 글의 중심은 여행이 아니라 돕기 위한 노력이라서 틀림.","오답 ✕ — 고기를 많이 먹을수록 지구가 더 뜨거워진다는 설명이 나오지만 이는 Timothy가 노력하는 이유일 뿐이고, 글 전체는 'I'm trying to eat less meat'(고기를 덜 먹으려고 노력해)이라는 실천이라서 틀림.","오답 ✕ — 'It isn't easy to change my eating habits'(식습관을 바꾸는 것은 쉽지 않아)라는 말이 있지만 건강한 식습관이 아니라 지구를 위한 식습관이라서 틀림.","오답 ✕ — 'cows pass a lot of gas'(소는 많은 가스를 배출해)처럼 동물 농장 이야기는 나오지만 Venice에 있는 동물 농장 견학 이야기는 없어서 틀림.","정답 ○ — 'I want to do my part to help your city and the Earth.'(너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어.)라고 하고 고기를 덜 먹으려고 노력한다고 했으므로 Timothy의 노력이 주제임."],"memo":["정답 ⑤: Timothy's effort to help Venice and the Earth(베네치아와 지구를 돕기 위한 Timothy의 노력)","근거: I want to do my part to help your city and the Earth.(너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어.)","함정: ②는 고기와 온난화 설명이 노력의 이유일 뿐이라서 ✕"],"why":"Timothy는 고기를 덜 먹는 노력으로 베네치아와 지구를 도우려 한다."}],"pp":[["Hi, Monica!","안녕, Monica!"],["I'm Timothy from the United States.","나는 미국의 Timothy야."],["My family visited Venice three years ago and we loved it!","우리 가족은 3년 전에 베네치아를 방문했고 우리는 그곳을 아주 좋아했어!"],["I am surprised and sad to hear your news.","나는 네 소식을 듣고 놀랐고 슬퍼."],["I want to do my part to help your city and the Earth.","나는 너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어."],["I recently found out something interesting.","나는 최근에 재미있는 것을 알게 됐어."],["The more meat we eat, the hotter our planet gets.","우리가 더 많은 고기를 먹을수록 우리의 행성은 더 뜨거워져."],["This is because lots of trees are cut down to make animal farms.","이것은 동물 농장을 만들기 위해 많은 나무가 베어지기 때문이야."],["This increases greenhouse gases.","이것은 온실가스를 증가시켜."],["Also, cows pass a lot of gas.","또한, 소는 많은 가스를 배출해."],["Smelly!","고약한 냄새가 나!"],["But this is not the worst part.","그런데 이것이 최악인 부분은 아니야."],["The gas from cows also adds to greenhouse gases.","소에게서 나온 가스는 또한 온실가스에 추가돼."],["Greenhouse gases make the Earth hotter.","온실가스는 지구를 더 뜨겁게 만들어."],["So, I'm trying to eat less meat to slow down global warming.","그래서, 나는 지구 온난화를 늦추기 위해서 고기를 덜 먹으려고 노력하고 있어."],["It isn't easy to change my eating habits, but I'm doing my best.","나의 식습관을 바꾸는 것은 쉽지 않지만, 나는 최선을 다하고 있어."]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["한국의 여름은 매우 뜨겁고 건조하다.","베네치아의 상황은 차츰 나아지고 있다.","수인이는 베네치아에 살고 있다.","수인이는 친구들과 함께 3R 캠페인에 참여할 계획이다.","수인이의 학교 학생들은 매일 재활용하기, 재사용하기, 줄이기를 실천하고 있다."],"a":4,"ans":"수인이의 학교 학생들은 매일 재활용하기, 재사용하기, 줄이기를 실천하고 있다.","evs":[["Now, many students at my school are doing these three things every day.","지금, 우리 학교에서 많은 학생들이 이 세 가지를 매일 하고 있어."],["The 3Rs are Recycle, Reuse, and Reduce.","3R은 '재활용하다', '재사용하다', 그리고 '줄이다'야."]],"ev":["Now, many students at my school are doing these three things every day.","지금, 우리 학교에서 많은 학생들이 이 세 가지를 매일 하고 있어."],"ow":["오답 ✕ — 수인이는 'Every summer, it rains a lot here.'(매년 여름에 여기는 비가 많이 와.)라고 했으므로 뜨겁고 건조하다는 보기는 틀림.","오답 ✕ — 베네치아의 상황이 나아지고 있다는 말은 글에 없음. 수인이는 'The situation in Venice must be scary, too.'(베네치아의 상황도 무서울 게 틀림없어.)라고 했으므로 틀림.","오답 ✕ — 수인이는 'Hello, I'm Suin from Korea.'(나는 한국의 수인이야.)라고 했고 'I've never been to Venice'(나는 베네치아에 가 본 적이 없어)라고 했으므로 틀림.","오답 ✕ — 수인이는 'we started the 3R campaign'(우리는 3R 캠페인을 시작했어)이라고 했으므로 이미 시작했고, 앞으로 참여할 계획이 아니라서 틀림.","정답 ○ — 'many students at my school are doing these three things every day'(우리 학교에서 많은 학생들이 이 세 가지를 매일 하고 있어)와 'Recycle, Reuse, and Reduce'가 나오므로 맞음."],"memo":["정답 ⑤: 수인이네 학교 학생들은 매일 재활용하기, 재사용하기, 줄이기를 실천한다.","근거: many students at my school are doing these three things every day(많은 학생들이 이 세 가지를 매일 하고 있어)","함정: ④ 계획이 아니라 이미 시작했다(we started)라서 ✕"],"why":"수인이네 학교 학생들은 3R(재활용·재사용·줄이기)을 매일 실천하고 있다."},{"n":10,"q":"윗글의 제목으로 알맞은 것은?","o":["Scary Floods in Venice","The 3R Campaign for Venice","Beautiful Places to Visit in Venice","Suin and Her Friends' Plans for Summer","What Korean People Do in the Rainy Season"],"a":1,"ans":"The 3R Campaign for Venice","evs":[["We wanted to help Venice, so we started the 3R campaign.","우리는 베네치아를 돕고 싶어서, 3R 캠페인을 시작했어."],["The 3Rs are Recycle, Reuse, and Reduce.","3R은 '재활용하다', '재사용하다', 그리고 '줄이다'야."]],"ev":["We wanted to help Venice, so we started the 3R campaign.","우리는 베네치아를 돕고 싶어서, 3R 캠페인을 시작했어."],"ow":["오답 ✕ — 'Sometimes, we have floods and they are really scary.'(때때로 우리는 홍수를 겪고 정말 무서워.)가 나오지만 홍수는 도입 부분일 뿐이고, 글의 중심은 돕기 위한 캠페인이라서 틀림.","정답 ○ — 'We wanted to help Venice, so we started the 3R campaign.'(베네치아를 돕고 싶어서 3R 캠페인을 시작했어.)라고 했으므로 맞음.","오답 ✕ — 'I have seen many beautiful pictures of it.'(그곳의 아름다운 사진들을 본 적이 있어.)가 나오지만 방문할 만한 곳을 소개하는 글이 아니라서 틀림.","오답 ✕ — 여름 계획이 아니라 이미 시작한 3R 캠페인 이야기라서 틀림.","오답 ✕ — 'Every summer, it rains a lot here.'(매년 여름에 여기는 비가 많이 와.)가 나오지만 한국 사람들이 장마철에 하는 일을 소개하는 글이 아니라서 틀림."],"memo":["정답 ②: The 3R Campaign for Venice(베네치아를 위한 3R 캠페인)","근거: We wanted to help Venice, so we started the 3R campaign.(베네치아를 돕고 싶어서 3R 캠페인을 시작했어.)","함정: ①은 홍수가 도입일 뿐이고 중심은 캠페인이라서 ✕"],"why":"수인이네 학교가 베네치아를 돕기 위해 시작한 3R 캠페인이 중심이다."}],"pp":[["Hello, I'm Suin from Korea.","안녕, 나는 한국의 수인이야."],["Every summer, it rains a lot here.","매년 여름에 여기는 비가 많이 와."],["Sometimes, we have floods and they are really scary.","때때로, 우리는 홍수를 겪고 그것들은 정말 무서워."],["The situation in Venice must be scary, too.","베네치아의 상황도 무서울 게 틀림없어."],["I've never been to Venice, but I have seen many beautiful pictures of it.","나는 베네치아에 가 본 적이 없지만, 그곳의 많은 아름다운 사진들을 본 적이 있어."],["I talked to my friends about the floods in your city.","나는 너희 도시의 홍수에 관해 친구들과 이야기했어."],["We wanted to help Venice, so we started the 3R campaign.","우리는 베네치아를 돕고 싶어서, 3R 캠페인을 시작했어."],["The 3Rs are Recycle, Reuse, and Reduce.","3R은 '재활용하다', '재사용하다', 그리고 '줄이다'야."],["Now, many students at my school are doing these three things every day.","지금, 우리 학교에서 많은 학생들이 이 세 가지를 매일 하고 있어."],["It is important to do our part for Venice.","베네치아를 위해 우리의 역할을 하는 것이 중요해."],["Together, we can make a difference!","함께, 우리는 변화를 만들 수 있어!"]]}];

function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
