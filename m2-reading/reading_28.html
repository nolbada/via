<style>

.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Some animals has been our friends for thousands of years. They have help and protected us.","ko":"어떤 동물들은 수천 년 동안 우리의 친구였다. 그들은 우리를 돕고 보호해 왔다.","ok":false,"foot":[],"fixes":[{"wrong":"has","right":"have","partial":false,"at":[2],"point":"현재완료: 복수 주어 animals: have been (has 아님)","topic":"현재완료","memo":"복수 주어 animals: have been (has 아님)"},{"wrong":"help","right":"helped","partial":false,"at":[12],"point":"현재완료: have 뒤 과거분사: helped (help 아님)","topic":"현재완료","memo":"have 뒤 과거분사: helped (help 아님)"}]},{"n":2,"tag":null,"en":"To celebrate this animal friends, people in Ireland and Nepal hold special festivals every years.","ko":"이러한 동물 친구들을 기념하기 위해 아일랜드와 네팔의 사람들은 매년 특별한 축제를 연다.","ok":false,"foot":[],"fixes":[{"wrong":"this","right":"these","partial":false,"at":[2],"point":"지시형용사 this/these: 복수명사 friends 앞에는 these 사용","topic":"지시형용사 this/these","memo":"복수명사 friends 앞에는 these 사용"},{"wrong":"years","right":"year","partial":false,"at":[14],"point":"every + 단수명사: every 뒤에는 단수명사 year 사용","topic":"every + 단수명사","memo":"every 뒤에는 단수명사 year 사용"}]},{"n":3,"tag":null,"en":"These festivals show a strong bond between humans and animals.","ko":"이러한 축제는 인간과 동물들 간의 강한 유대를 보여 준다.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":"아일랜드 · 야생 염소","en":"Every year from August 10 to 12, people in Killorglin hold a festival to celebrate wild goats.","ko":"매년 8월 10일부터 12일까지 킬로글린의 사람들은 야생 염소를 기리기 위해 축제를 연다.","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":null,"en":"There is one story about the festival's begin.","ko":"그 축제의 시작에 대한 한 가지 일화가 있다.","ok":false,"foot":[],"fixes":[{"wrong":"begin","right":"beginning","partial":false,"at":[7],"point":"명사와 동사의 품사: 소유격 뒤에는 명사 beginning 사용","topic":"명사와 동사의 품사","memo":"소유격 뒤에는 명사 beginning 사용"}]},{"n":6,"tag":null,"en":"When the English army was attacking Ireland on the 17th century, they came across a group of wild goat in a field.","ko":"17세기에 영국 군대가 아일랜드를 공격하고 있었을 때, 그들은 들판에서 야생 염소 떼와 마주쳤다.","ok":false,"foot":[],"fixes":[{"wrong":"on","right":"in","partial":false,"at":[7],"point":"기본전치사: \"~세기에\"는 전치사 in 사용","topic":"기본전치사","memo":"\"~세기에\"는 전치사 in 사용"},{"wrong":"goat","right":"goats","partial":false,"at":[18],"point":"a group of + 복수명사: a group of 뒤에는 복수명사 goats 사용","topic":"a group of + 복수명사","memo":"a group of 뒤에는 복수명사 goats 사용"}]},{"n":7,"tag":null,"en":"Much of the goats ran away to the mountains, but one goats ran toward the village.","ko":"대부분의 염소는 산으로 도망을 갔지만 염소 한 마리는 마을 쪽으로 달렸다.","ok":false,"foot":[],"fixes":[{"wrong":"Much","right":"Most","partial":false,"at":[0],"point":"수량 형용사 most/much: 셀 수 있는 goats 앞에는 Most of 사용","topic":"수량 형용사 most/much","memo":"셀 수 있는 goats 앞에는 Most of 사용"},{"wrong":"goats","right":"goat","partial":false,"at":[11],"point":"one + 단수명사: one 뒤에는 단수명사 goat 사용","topic":"one + 단수명사","memo":"one 뒤에는 단수명사 goat 사용"}]},{"n":8,"tag":null,"en":"When the villagers saw the tired and scared goat, they realized that danger were coming.","ko":"마을 사람들은 지치고 겁에 질린 염소를 보았을 때 위험이 다가오고 있다는 것을 깨달았다.","ok":false,"foot":[],"fixes":[{"wrong":"were","right":"was","partial":false,"at":[13],"point":"be동사의 과거형: 단수 주어 danger: was (were 아님)","topic":"be동사의 과거형","memo":"단수 주어 danger: was (were 아님)"}]},{"n":9,"tag":null,"en":"Thanks to the goat, the villagers were able to prepare and protect themself.","ko":"그 염소 덕분에 마을 사람들은 (공격에) 대비하고 자신들을 보호할 수 있었다.","ok":false,"foot":[],"fixes":[{"wrong":"themself","right":"themselves","partial":false,"at":[12],"point":"재귀대명사: 주어 the villagers의 재귀대명사는 themselves 사용","topic":"재귀대명사","memo":"주어 the villagers의 재귀대명사는 themselves 사용"}]},{"n":10,"tag":null,"en":"Since then, people in Killorglin have celebrated wild goats with this festival.","ko":"그 이후로, 킬로글린의 사람들은 이 축제로 야생 염소를 기념해 왔다.","ok":true,"foot":[],"fixes":[]},{"n":11,"tag":null,"en":"At the festival, people crowns a goat to show thanks to it. They also give it a lot of food and take good care of it.","ko":"축제에서 사람들은 염소에게 감사를 표하기 위해 왕관을 씌워 준다. 그들은 또한 염소에게 많은 먹이를 주고 잘 돌봐준다.","ok":false,"foot":[],"fixes":[{"wrong":"crowns","right":"crown","partial":false,"at":[4],"point":"일반동사 현재형: 복수 주어 people: crown (crowns 아님)","topic":"일반동사 현재형","memo":"복수 주어 people: crown (crowns 아님)"}]},{"n":12,"tag":null,"en":"People then parade, dance, and sing.","ko":"그런 다음 사람들은 퍼레이드를 하고 춤추며 노래를 부른다.","ok":true,"foot":[],"fixes":[]},{"n":13,"tag":"네팔 · 개 축제","en":"People say, \"Every dog have its day.\" In Nepal, this saying are literally true.","ko":"사람들은 \"모든 개는 자신들의 날이 있다.\"라고 한다. 네팔에서 이 격언은 문자 그대로 사실이다.","ok":false,"foot":[],"fixes":[{"wrong":"have","right":"has","partial":false,"at":[4],"point":"3인칭 단수 현재형: Every dog(단수): has (have 아님)","topic":"3인칭 단수 현재형","memo":"Every dog(단수): has (have 아님)"},{"wrong":"are","right":"is","partial":false,"at":[11],"point":"be동사의 현재형: 단수 주어 saying: is (are 아님)","topic":"be동사의 현재형","memo":"단수 주어 saying: is (are 아님)"}]},{"n":14,"tag":null,"en":"Dogs have been an important part of Nepalese culture for hundreds of years.","ko":"개는 수백 년 동안 네팔 문화의 중요한 일부였다.","ok":true,"foot":[],"fixes":[]},{"n":15,"tag":null,"en":"The Nepalese believe that dogs are helper of the god of death and guide souls at heaven.","ko":"네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다.","ok":false,"foot":[],"fixes":[{"wrong":"helper","right":"helpers","partial":false,"at":[6],"point":"명사의 복수형: dogs를 설명하므로 복수 helpers 사용","topic":"명사의 복수형","memo":"dogs를 설명하므로 복수 helpers 사용"},{"wrong":"at","right":"to","partial":false,"at":[15],"point":"기본전치사: \"천국으로\"는 방향 전치사 to 사용","topic":"기본전치사","memo":"\"천국으로\"는 방향 전치사 to 사용"}]},{"n":16,"tag":null,"en":"Because this belief, Nepal has a specially day to celebrate dogs. This dog festival usually take place in October or November.","ko":"이러한 믿음 때문에 네팔은 개를 기념하기 위해 특별한 날을 갖는다. 이 개 축제는 보통 10월이나 11월에 열린다.","ok":false,"foot":[],"fixes":[{"wrong":"this","right":"of this","partial":false,"at":[1],"point":"접속사와 전치사: 뒤에 명사구(this belief)가 오면 Because of 사용","topic":"접속사와 전치사","memo":"뒤에 명사구(this belief)가 오면 Because of 사용","alt":[0]},{"wrong":"specially","right":"spec 7th century, they came across a group of wild goats in a field.","17세기에 영국 군대가 아일랜드를 공격하고 있었을 때, 그들은 들판에서 야생 염소 떼와 마주쳤다.",0],["Most of the goats ran away to the mountains, but one goat ran toward the village.","대부분의 염소는 산으로 도망을 갔지만 염소 한 마리는 마을 쪽으로 달렸다.",0],["When the villagers saw the tired and scared goat, they realized that danger was coming.","마을 사람들은 지치고 겁에 질린 염소를 보았을 때 위험이 다가오고 있다는 것을 깨달았다.",0],["Thanks to the goat, the villagers were able to prepare and protect themselves.","그 염소 덕분에 마을 사람들은 (공격에) 대비하고 자신들을 보호할 수 있었다.",0],["Since then, people in Killorglin have celebrated wild goats with this festival.","그 이후로, 킬로글린의 사람들은 이 축제로 야생 염소를 기념해 왔다.",1],["At the festival, people crown a goat to show thanks to it.","축제에서 사람들은 염소에게 감사를 표하기 위해 왕관을 씌워 준다.",0],["They also give it a lot of food and take good care of it.","그들은 또한 염소에게 많은 먹이를 주고 잘 돌봐준다.",0],["People then parade, dance, and sing.","그런 다음 사람들은 퍼레이드를 하고 춤추며 노래를 부른다.",0],["Dog Festival in Nepal","네팔의 개 축제",1],["People say, \"Every dog has its day.\"","사람들은 \"모든 개는 자신들의 날이 있다.\"라고 한다.",1],["In Nepal, this saying is literally true.","네팔에서 이 격언은 문자 그대로 사실이다.",0],["Dogs have been an important part of Nepalese culture for hundreds of years.","개는 수백 년 동안 네팔 문화의 중요한 일부였다.",0],["The Nepalese believe that dogs are helpers of the god of death and guide souls to heaven.","네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다.",0],["Because of this belief, Nepal has a special day to celebrate dogs.","이러한 믿음 때문에 네팔은 개를 기념하기 위해 특별한 날을 갖는다.",0],["This dog festival usually takes place in October or November.","이 개 축제는 보통 10월이나 11월에 열린다.",0],["On this day, people give dogs flower necklaces and delicious food.","이날 사람들은 개에게 꽃목걸이와 맛있는 먹이를 준다.",0],["They also put a red mark on dogs' foreheads to wish them good luck.","그들은 또한 개에게 행운을 빌어 주기 위해 그것의 이마에 빨간색 마크를 찍는다.",0],["They even bow to dogs to show them love and thanks.","그들은 심지어 개에게 사랑과 감사를 표하기 위해 고개 숙여 인사하기도 한다.",0]];var RNUM=28;var TITLE_EN="Festivals for Our Animal Friends";var PASS_EN=["Festivals for Our Animal Friends","Some animals have been our friends for thousands of years. They have helped and protected us. To celebrate these animal friends, people in Ireland and Nepal hold special festivals every year. These festivals show a strong bond between humans and animals.","Wild Goat Festival in Ireland","Every year from August 10 to 12, people in Killorglin hold a festival to celebrate wild goats. There is one story about the festival's beginning. When the English army was attacking Ireland in the 17th century, they came across a group of wild goats in a field. Most of the goats ran away to the mountains, but one goat ran toward the village. When the villagers saw the tired and scared goat, they realized that danger was coming. Thanks to the goat, the villagers were able to prepare and protect themselves.","Since then, people in Killorglin have celebrated wild goats with this festival. At the festival, people crown a goat to show thanks to it. They also give it a lot of food and take good care of it. People then parade, dance, and sing.","Dog Festival in Nepal","People say, \"Every dog has its day.\" In Nepal, this saying is literally true. Dogs have been an important part of Nepalese culture for hundreds of years. The Nepalese believe that dogs are helpers of the god of death and guide souls to heaven. Because of this belief, Nepal has a special day to celebrate dogs. This dog festival usually takes place in October or November. On this day, people give dogs flower necklaces and delicious food. They also put a red mark on dogs' foreheads to wish them good luck. They even bow to dogs to show them love and thanks."];var PASS_KO=["우리의 동물 친구들을 위한 축제들","어떤 동물들은 수천 년 동안 우리의 친구였다. 그들은 우리를 돕고 보호해 왔다. 이러한 동물 친구들을 기념하기 위해 아일랜드와 네팔의 사람들은 매년 특별한 축제를 연다. 이러한 축제는 인간과 동물들 간의 강한 유대를 보여 준다.","아일랜드의 야생 염소 축제","매년 8월 10일부터 12일까지 킬로글린의 사람들은 야생 염소를 기리기 위해 축제를 연다. 그 축제의 시작에 대한 한 가지 일화가 있다. 17세기에 영국 군대가 아일랜드를 공격하고 있었을 때, 그들은 들판에서 야생 염소 떼와 마주쳤다. 대부분의 염소는 산으로 도망을 갔지만 염소 한 마리는 마을 쪽으로 달렸다. 마을 사람들은 지치고 겁에 질린 염소를 보았을 때 위험이 다가오고 있다는 것을 깨달았다. 그 염소 덕분에 마을 사람들은 (공격에) 대비하고 자신들을 보호할 수 있었다.","그 이후로, 킬로글린의 사람들은 이 축제로 야생 염소를 기념해 왔다. 축제에서 사람들은 염소에게 감사를 표하기 위해 왕관을 씌워 준다. 그들은 또한 염소에게 많은 먹이를 주고 잘 돌봐준다. 그런 다음 사람들은 퍼레이드를 하고 춤추며 노래를 부른다.","네팔의 개 축제","사람들은 \"모든 개는 자신들의 날이 있다.\"라고 한다. 네팔에서 이 격언은 문자 그대로 사실이다. 개는 수백 년 동안 네팔 문화의 중요한 일부였다. 네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다. 이러한 믿음 때문에 네팔은 개를 기념하기 위해 특별한 날을 갖는다. 이 개 축제는 보통 10월이나 11월에 열린다. 이날 사람들은 개에게 꽃목걸이와 맛있는 먹이를 준다. 그들은 또한 개에게 행운을 빌어 주기 위해 그것의 이마에 빨간색 마크를 찍는다. 그들은 심지어 개에게 사랑과 감사를 표하기 위해 고개 숙여 인사하기도 한다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["성 패트릭의 날 퍼레이드는 이번 주말에 있을 예정이다.","소녀는 작년에 퍼레이드를 보기만 했다.","소녀는 올해 퍼레이드에 적극적으로 참여할 것이다.","소년은 이번 퍼레이드에 갈 것이다.","이번 주 토요일은 하루 종일 맑을 것이다."],"a":4,"ans":"이번 주 토요일은 하루 종일 맑을 것이다.","evs":[["Look! There will be a St. Patrick's Day parade in town this Saturday. Have you been to the parade before?","봐! 이번 토요일에 시내에서 성 패트릭의 날 퍼레이드가 열릴 거야. 너는 전에 그 퍼레이드에 가 본 적 있니?"],["I just watched the parade last year. This year I'm going to wear a green costume, paint my face green, and walk in the parade.","작년에는 그냥 퍼레이드를 구경만 했어. 올해는 초록색 의상을 입고, 얼굴을 초록색으로 칠하고, 퍼레이드에서 걸을 거야."],["It'll be rainy in the morning but sunny in the afternoon.","아침에는 비가 오지만 오후에는 화창할 거야."]],"ev":["Look! There will be a St. Patrick's Day parade in town this Saturday. Have you been to the parade before?","봐! 이번 토요일에 시내에서 성 패트릭의 날 퍼레이드가 열릴 거야. 너는 전에 그 퍼레이드에 가 본 적 있니?"],"ow":["오답 ✕ — 소년이 'There will be a St. Patrick's Day parade in town this Saturday.'(이번 토요일에 시내에서 성 패트릭의 날 퍼레이드가 열릴 거야)라고 했으므로 이번 주말에 열려요. 일치해요.","오답 ✕ — 소녀가 'I just watched the parade last year.'(작년에는 그냥 퍼레이드를 구경만 했어)라고 했으므로 일치해요.","오답 ✕ — 소녀가 'This year I'm going to wear a green costume, paint my face green, and walk in the parade.'(올해는 초록색 의상을 입고 퍼레이드에서 걸을 거야)라고 했으니 적극적으로 참여해요. 일치해요.","오답 ✕ — 소년이 'That sounds fun! I think I should go, too.'(재미있겠다! 나도 가야겠어)라고 했으므로 갈 예정이에요. 일치해요.","정답 ○ — 소년이 'It'll be rainy in the morning but sunny in the afternoon.'(아침에는 비가 오지만 오후에는 화창할 거야)라고 했어요. 하루 종일 맑지 않으므로 이 보기는 일치하지 않아요."],"memo":["정답: ⑤ 이번 토요일은 하루 종일 맑지 않다 (아침 비, 오후 맑음)","근거: It'll be rainy in the morning but sunny in the afternoon.(아침에는 비가 오지만 오후에는 화창할 거야.)","함정: 소녀는 올해 구경만 하지 않고 직접 걸을 예정이라 ③은 ○"],"why":"토요일 날씨는 아침에 비, 오후에 맑음이라 하루 종일 맑은 것이 아니다."},{"n":2,"q":"위 대화의 주제로 알맞은 것은?","o":["this weekend's weather","the history of St. Patrick's Day","plans for the St. Patrick's Day parade","the way to join the St. Patrick's Day parade","the best part of the St. Patrick's Day parade"],"a":2,"ans":"plans for the St. Patrick's Day parade","evs":[["Look! There will be a St. Patrick's Day parade in town this Saturday. Have you been to the parade before?","봐! 이번 토요일에 시내에서 성 패트릭의 날 퍼레이드가 열릴 거야. 너는 전에 그 퍼레이드에 가 본 적 있니?"],["I just watched the parade last year. This year I'm going to wear a green costume, paint my face green, and walk in the parade.","작년에는 그냥 퍼레이드를 구경만 했어. 올해는 초록색 의상을 입고, 얼굴을 초록색으로 칠하고, 퍼레이드에서 걸을 거야."],["It'll be rainy in the morning but sunny in the afternoon.","아침에는 비가 오지만 오후에는 화창할 거야."]],"ev":["Look! There will be a St. Patrick's Day parade in town this Saturday. Have you been to the parade before?","봐! 이번 토요일에 시내에서 성 패트릭의 날 퍼레이드가 열릴 거야. 너는 전에 그 퍼레이드에 가 본 적 있니?"],"ow":["오답 ✕ — 날씨 이야기('what's the weather like this Saturday?')가 나오기는 하지만 일부일 뿐이에요. 주말 날씨가 대화 전체의 주제는 아니에요.","오답 ✕ — 성 패트릭의 날 역사에 대한 이야기는 대화에 전혀 없어요. 가장 가까운 문장은 'a St. Patrick's Day parade in town this Saturday'(이번 토요일 시내 퍼레이드)인데 역사가 아니라 행사 소식이에요.","정답 ○ — 'There will be a St. Patrick's Day parade in town this Saturday.'(이번 토요일 퍼레이드가 열려)와 'This year I'm going to wear a green costume ... and walk in the parade.'(올해는 초록색 의상을 입고 걸을 거야)처럼 퍼레이드에서 무엇을 할지 계획을 이야기해요.","오답 ✕ — 퍼레이드에 참가하는 절차를 설명하는 대화는 아니에요. 'I think I should go, too.'(나도 가야겠어)처럼 가겠다는 계획만 나와요.","오답 ✕ — 'it was amazing'(정말 멋졌어)이라는 말은 있지만 퍼레이드의 가장 좋은 부분을 고르는 대화는 아니에요."],"memo":["정답: ③ plans for the St. Patrick's Day parade (퍼레이드 계획)","근거: This year I'm going to wear a green costume, paint my face green, and walk in the parade.(올해는 초록색 의상을 입고 얼굴을 칠하고 걸을 거야.)","함정: ①은 날씨 이야기가 일부일 뿐이라서 ✕"],"why":"성 패트릭의 날 퍼레이드에서 무엇을 할지 계획을 이야기한다."}],"dlg":[["B","Look! There will be a St. Patrick's Day parade in town this Saturday. Have you been to the parade before?","봐! 이번 토요일에 시내에서 성 패트릭의 날 퍼레이드가 열릴 거야. 너는 전에 그 퍼레이드에 가 본 적 있니?"],["G","Oh, yes. I went to the parade last year, and it was amazing.","아, 응. 작년에 퍼레이드에 갔는데 정말 멋졌어."],["B","Did you do something special at the parade?","퍼레이드에서 뭔가 특별한 걸 했니?"],["G","I just watched the parade last year. This year I'm going to wear a green costume, paint my face green, and walk in the parade.","작년에는 그냥 퍼레이드를 구경만 했어. 올해는 초록색 의상을 입고, 얼굴을 초록색으로 칠하고, 퍼레이드에서 걸을 거야."],["B","That sounds fun! I think I should go, too.","재미있겠다! 나도 가야겠어."],["G","That's nice! By the way, what's the weather like this Saturday? Do you know?","잘됐다! 그런데 이번 토요일 날씨는 어때? 알고 있니?"],["B","It'll be rainy in the morning but sunny in the afternoon.","아침에는 비가 오지만 오후에는 화창할 거야."],["G","Great! We won't have any problem then.","좋아! 그러면 문제없겠다."]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하는 것은?","o":["Jenny has never been to the local festival.","Jenny watched a magic show at the festival.","Jenny thought the magic show was boring.","The boy suggests going to the festival alone.","Jenny doesn't want to go to the festival this year."],"a":1,"ans":"Jenny watched a magic show at the festival.","evs":[["Look at this poster, Jenny! Have you ever been to this local festival before?","이 포스터 봐, Jenny! 너는 전에 이 지역 축제에 가 본 적 있니?"],["Yes, I have. I watched a magic show. It was great.","응, 있어. 나는 마술 쇼를 봤어. 아주 좋았어."],["I'd love to.","좋아."]],"ev":["Look at this poster, Jenny! Have you ever been to this local festival before?","이 포스터 봐, Jenny! 너는 전에 이 지역 축제에 가 본 적 있니?"],"ow":["오답 ✕ — 소년이 'Have you ever been to this local festival before?'(전에 이 축제에 가 본 적 있니?)라고 묻자 Jenny는 'Yes, I have.'(응, 있어)라고 답했어요. 가 본 적이 있어요.","정답 ○ — Jenny는 'I watched a magic show.'(나는 마술 쇼를 봤어)라고 말했으므로 축제에서 마술 쇼를 본 것이 맞아요."," rip to Jeju, Minjun? Did you hike Hallasan?","민준아, 제주도 여행 어땠어? 한라산에 올라갔니?"],["B","No, I visited some museums instead because of the weather.","아니, 날씨 때문에 대신 박물관 몇 곳을 방문했어."],["G","How was the weather? Was it rainy?","날씨는 어땠어? 비가 왔니?"],["B","No, it wasn't, but the wind was too strong.","아니, 오지 않았는데 바람이 너무 강했어."]]},{"qs":[{"n":5,"q":"다음 대화를 읽고 답할 수 없는 질문은?","o":["When is the music festival?","What is the girl looking forward to the most at the festival?","How does the boy feel about the festival?","Why does the girl say they were very lucky?","What will the weather be like tomorrow?"],"a":1,"ans":"What is the girl looking forward to the most at the festival?","evs":[["Hi, Jay! I'm so excited for the music festival tomorrow.","안녕, Jay! 나는 내일 음악 축제가 정말 기대돼."],["Me, too! I can't believe we were able to get tickets.","나도! 우리가 표를 구할 수 있었다니 믿기지 않아."],["The app says it will be cloudy but not rainy. Perfect weather for a festival!","앱에서 흐리지만 비는 오지 않을 거래. 축제에 딱 좋은 날씨야!"]],"ev":["Hi, Jay! I'm so excited for the music festival tomorrow.","안녕, Jay! 나는 내일 음악 축제가 정말 기대돼."],"ow":["오답 ✕ — 소녀가 'the music festival tomorrow'(내일 음악 축제)라고 했으므로 축제가 언제인지 알 수 있어요. 답할 수 있는 질문이에요.","정답 ○ — 소녀가 'I'm so excited for the music festival tomorrow.'(내일 음악 축제가 정말 기대돼)라고만 했어요. 축제에서 무엇을 가장 기대하는지는 대화에 나오지 않아서 답할 수 없어요.","오답 ✕ — 소년이 'Me, too!'(나도!)라고 했으므로 소년도 신이 났다는 것을 알 수 있어요. 답할 수 있는 질문이에요.","오답 ✕ — 소년이 'I can't believe we were able to get tickets.'(표를 구할 수 있었다니 믿기지 않아)라고 했고 소녀가 'We were very lucky.'(우리는 정말 운이 좋았어)라고 했으니, 표를 구해서 운이 좋았다고 답할 수 있어요.","오답 ✕ — 소년이 'The app says it will be cloudy but not rainy.'(앱에서 흐리지만 비는 오지 않을 거래)라고 했으므로 내일 날씨를 알 수 있어요."],"memo":["정답: ② 소녀가 축제에서 가장 기대하는 것은 대화에 없음","근거: I'm so excited for the music festival tomorrow.(내일 음악 축제가 정말 기대돼.) — 무엇이 기대되는지는 말하지 않음","함정: ⑤ 날씨는 cloudy but not rainy라고 나와서 답할 수 있어"],"why":"소녀가 축제에서 무엇을 가장 기대하는지는 대화에 나오지 않는다."}],"dlg":[["G","Hi, Jay! I'm so excited for the music festival tomorrow.","안녕, Jay! 나는 내일 음악 축제가 정말 기대돼."],["B","Me, too! I can't believe we were able to get tickets.","나도! 우리가 표를 구할 수 있었다니 믿기지 않아."],["G","We were very lucky. By the way, what's the weather like tomorrow?","우리는 정말 운이 좋았어. 그런데 내일 날씨는 어때?"],["B","The app says it will be cloudy but not rainy. Perfect weather for a festival!","앱에서 흐리지만 비는 오지 않을 거래. 축제에 딱 좋은 날씨야!"]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["helped - festivals","helped - contests","hurt - festivals","fed - markets","hurt - markets"],"a":0,"ans":"helped - festivals","evs":[["They have helped and protected us.","그들은 우리를 돕고 보호해 왔다."],["To celebrate these animal friends, people in Ireland and Nepal hold special festivals every year.","이러한 동물 친구들을 기념하기 위해 아일랜드와 네팔의 사람들은 매년 특별한 축제를 연다."]],"ev":["They have helped and protected us.","그들은 우리를 돕고 보호해 왔다."],"ow":["정답 ○ — 'They have helped and protected us.'(그들은 우리를 돕고 보호해 왔다)와 'people in Ireland and Nepal hold special festivals every year'(아일랜드와 네팔 사람들은 매년 특별한 축제를 연다)에 따라 (A)는 helped, (B)는 festivals예요.","오답 ✕ — (A) helped는 맞아요. 하지만 'hold special festivals'(특별한 축제를 연다)라고 했으므로 contests(대회)는 (B)가 틀려요.","오답 ✕ — (B) festivals는 맞지만 'They have helped and protected us.'(우리를 돕고 보호해 왔다)라고 했으므로 hurt(해치다)는 (A)가 틀려요.","오답 ✕ — 동물이 사람을 먹여 주었다(fed)는 말도, 시장(markets)을 연다는 말도 없어서 (A), (B) 모두 틀려요.","오답 ✕ — 동물이 사람을 해쳤다(hurt)는 말은 본문과 반대이고, 시장(markets)을 연다는 말도 없어서 모두 틀려요."],"memo":["정답: ① helped - festivals (도왔고, 축제를 연다)","근거: They have helped and protected us. / people ... hold special festivals every year.(우리를 돕고 보호해 왔다. / 매년 특별한 축제를 연다.)","함정: hurt(해치다)는 helped와 반대말이라 ✕"],"why":"우리를 도와준 동물을 기리기 위해 아일랜드와 네팔은 축제를 연다.","sum":"Some animals have (A)________ and protected us, so people in Ireland and Nepal hold (B)________ to celebrate them.","lab":"완성된 요약문 : "}],"pp":[["Some animals have been our friends for thousands of years.","어떤 동물들은 수천 년 동안 우리의 친구였다."],["They have helped and protected us.","그들은 우리를 돕고 보호해 왔다."],["To celebrate these animal friends, people in Ireland and Nepal hold special festivals every year.","이러한 동물 친구들을 기념하기 위해 아일랜드와 네팔의 사람들은 매년 특별한 축제를 연다."],["These festivals show a strong bond between humans and animals.","이러한 축제는 인간과 동물들 간의 강한 유대를 보여 준다."]]},{"qs":[{"n":7,"q":"윗글의 주제로 알맞은 것은?","o":["the danger of wild goats in Killorglin","things to see at the wild goat festival","ways to protect wild animals in Ireland","the festival to celebrate the English army","the origin of the wild goat festival in Killorglin"],"a":4,"ans":"the origin of the wild goat festival in Killorglin","evs":[["There is one story about the festival's beginning.","그 축제의 시작에 대한 한 가지 일화가 있다."],["Thanks to the goat, the villagers were able to prepare and protect themselves.","그 염소 덕분에 마을 사람들은 (공격에) 대비하고 자신들을 보호할 수 있었다."],["Since then, people in Killorglin have celebrated wild goats with this festival.","그 이후로, 킬로글린의 사람들은 이 축제로 야생 염소를 기념해 왔다."]],"ev":["There is one story about the festival's beginning.","그 축제의 시작에 대한 한 가지 일화가 있다."],"ow":["오답 ✕ — 염소는 마을에 위험을 알려 준 고마운 존재였어요('Thanks to the goat, the villagers were able to prepare and protect themselves.'). 염소의 위험성이 주제가 아니에요.","오답 ✕ — 축제에서 볼 것(퍼레이드, 춤, 노래 등)은 마지막에 짧게 나올 뿐이에요. 글의 중심은 축제가 어떻게 시작되었는지예요.","오답 ✕ — 야생 동물을 보호하는 방법을 말하는 글이 아니에요. 염소 덕분에 마을 사람들이 스스로를 보호할 수 있었다는 이야기예요.","오답 ✕ — 영국 군대를 기념하는 축제가 아니에요. 영국 군대는 아일랜드를 공격했고, 축제는 염소를 기념해요('a festival to celebrate wild goats').","정답 ○ — 'There is one story about the festival's beginning.'(그 축제의 시작에 대한 한 가지 일화가 있다)와 'Since then, people in Killorglin have celebrated wild goats with this festival.'(그 이후로 킬로글린 사람들은 이 축제로 야생 염소를 기념해 왔다)에서 축제의 유래가 주제임을 알 수 있어요."],"memo":["정답: ⑤ the origin of the wild goat festival in Killorglin (축제의 유래)","근거: There is one story about the festival's beginning.(그 축제의 시작에 대한 한 가지 일화가 있다.)","함정: ④ 축제는 영국 군대가 아니라 염소를 기념하므로 ✕"],"why":"킬로글린 야생 염소 축제가 어떻게 시작되었는지를 말해 준다."},{"n":8,"q":"윗글의 내용과 일치하지 않는 것은?","o":["The wild goat festival takes place for three days.","The English army started to hold the festival in the 17th century.","One goat went to the village unlike most of the goats.","Thanks to the scared goat, the villagers could protect themselves.","People treat wild goats with great care during the festival."],"a":1,"ans":"The English army started to hold the festival in the 17th century.","evs":[["Every year from August 10 to 12, people in Killorglin hold a festival to celebrate wild goats.","매년 8월 10일부터 12일까지 킬로글린의 사람들은 야생 염소를 기리기 위해 축제를 연다."],["Most of the goats ran away to the mountains, but one goat ran toward the village.","대부분의 염소는 산으로 도망을 갔지만 염소 한 마리는 마을 쪽으로 달렸다."],["Since then, people in Killorglin have celebrated wild goats with this festival.","그 이후로, 킬로글린의 사람들은 이 축제로 야생 염소를 기념해 왔다."]],"ev":["Every year from August 10 to 12, people in Killorglin hold a festival to celebrate wild goats.","매년 8월 10일부터 12일까지 킬로글린의 사람들은 야생 염소를 기리기 위해 축제를 연다."],"ow":["오답 ✕ — 'from August 10 to 12'(8월 10일부터 12일까지)라고 했으니 3일 동안 열려요. 일치해요.","정답 ○ — 영국 군대는 'the English army was attacking Ireland in the 17th century'(17세기에 아일랜드를 공격하고 있었다)고 했어요. 'Since then, people in Killorglin have celebrated wild goats with this festival.'(그 이후로 킬로글린의 사람들이 이 축제로 염소를 기념해 왔다)처럼 축제를 연 것은 킬로글린의 사람들이므로 영국 군대가 축제를 시작했다는 말은 일치하지 않아요.","오답 ✕ — 'Most of the goats ran away to the mountains, but one goat ran toward the village.'(대부분의 염소는 산으로 도망갔지만 한 마리는 마을 쪽으로 달렸다)라고 했으므로 일치해요.","오답 ✕ — 'Thanks to the goat, the villagers were able to prepare and protect themselves.'(염소 덕분에 마을 사람들은 대비하고 자신들을 보호할 수 있었다)라고 했으므로 일치해요.","오답 ✕ — 'They also give it a lot of food and take good care of it.'(염소에게 많은 먹이를 주고 잘 돌봐준다)라고 했으므로 일치해요."],"memo":["정답: ② 영국 군대가 축제를 시작했다는 말은 ✕ (킬로글린 사람들이 염소를 기념)","근거: Since then, people in Killorglin have celebrated wild goats with this festival.(그 이후로 킬로글린 사람들이 이 축제로 야생 염소를 기념해 왔다.)","함정: 영국 군대는 아일랜드를 공격한 쪽이라서 ✕"],"why":"축제는 킬로글린 사람들이 염소를 기념하려고 연 것이지 영국 군대가 시작한 것이 아니다."}],"pp":[["Wild Goat Festival in Ireland","아일랜드의 야생 염소 축제"],["Every year from August 10 to 12, people in Killorglin hold a festival to celebrate wild goats.","매년 8월 10일부터 12일까지 킬로글린의 사람들은 야생 염소를 기리기 위해 축제를 연다."],["There is one story about the festival's beginning.","그 축제의 시작에 대한 한 가지 일화가 있다."],["When the English army was attacking Ireland in the 17th century, they came across a group of wild goats in a field.","17세기에 영국 군대가 아일랜드를 공격하고 있었을 때, 그들은 들판에서 야생 염소 떼와 마주쳤다."],["Most of the goats ran away to the mountains, but one goat ran toward the village.","대부분의 염소는 산으로 도망을 갔지만 염소 한 마리는 마을 쪽으로 달렸다."],["When the villagers saw the tired and scared goat, they realized that danger was coming.","마을 사람들은 지치고 겁에 질린 염소를 보았을 때 위험이 다가오고 있다는 것을 깨달았다."],["Thanks to the goat, the villagers were able to prepare and protect themselves.","그 염소 덕분에 마을 사람들은 (공격에) 대비하고 자신들을 보호할 수 있었다."],["Since then, people in Killorglin have celebrated wild goats with this festival.","그 이후로, 킬로글린의 사람들은 이 축제로 야생 염소를 기념해 왔다."],["At the festival, people crown a goat to show thanks to it.","축제에서 사람들은 염소에게 감사를 표하기 위해 왕관을 씌워 준다."],["They also give it a lot of food and take good care of it.","그들은 또한 염소에게 많은 먹이를 주고 잘 돌봐준다."],["People then parade, dance, and sing.","그런 다음 사람들은 퍼레이드를 하고 춤추며 노래를 부른다."]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하지 않는 것은?","o":["개는 수백 년 동안 네팔에서 중요한 존재였다.","네팔에서 개는 죽음의 신으로 여겨진다.","네팔의 개 축제는 10월 또는 11월에 열린다.","네팔의 개 축제에서 개들은 꽃목걸이를 받는다.","네팔의 개 축제에는 개에게 고개 숙여 인사하는 사람들이 있다."],"a":1,"ans":"네팔에서 개는 죽음의 신으로 여겨진다.","evs":[["Dogs have been an important part of Nepalese culture for hundreds of years.","개는 수백 년 동안 네팔 문화의 중요한 일부였다."],["The Nepalese believe that dogs are helpers of the god of death and guide souls to heaven.","네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다."],["This dog festival usually takes place in October or November.","이 개 축제는 보통 10월이나 11월에 열린다."],["On this day, people give dogs flower necklaces and delicious food.","이날 사람들은 개에게 꽃목걸이와 맛있는 먹이를 준다."]],"ev":["Dogs have been an important part of Nepalese culture for hundreds of years.","개는 수백 년 동안 네팔 문화의 중요한 일부였다."],"ow":["오답 ✕ — 'Dogs have been an important part of Nepalese culture for hundreds of years.'(개는 수백 년 동안 네팔 문화의 중요한 일부였다)라고 했으므로 일치해요.","정답 ○ — 'The Nepalese believe that dogs are helpers of the god of death'(네팔 사람들은 개가 죽음의 신을 도와주는 존재라고 믿는다)라고 했어요. 개 자체가 죽음의 신이라는 말은 없으므로 일치하지 않아요.","오답 ✕ — 'This dog festival usually takes place in October or November.'(이 개 축제는 보통 10월이나 11월에 열린다)라고 했으므로 일치해요.","오답 ✕ — 'people give dogs flower necklaces and delicious food'(사람들은 개에게 꽃목걸이와 맛있는 먹이를 준다)라고 했으므로 일치해요.","오답 ✕ — 'They even bow to dogs to show them love and thanks.'(심지어 개에게 사랑과 감사를 표하려고 고개 숙여 인사하기도 한다)라고 했으므로 일치해요."],"memo":["정답: ② 개가 죽음의 신으로 여겨진다는 말은 ✕ (죽음의 신의 '도우미')","근거: The Nepalese believe that dogs are helpers of the god of death and guide souls to heaven.(개는 죽음의 신을 도와 영혼을 하늘로 인도한다고 믿는다.)","함정: helpers(도우미)와 god(신)은 다르다는 점!"],"why":"네팔에서 개는 죽음의 신 자체가 아니라 그 신의 도우미로 여겨진다."},{"n":10,"q":"Why does Nepal have a special day to celebrate dogs?","o":["Because the Nepalese believe dogs help the god of death and guide souls to heaven.","Because dogs once helped the villagers prepare for danger.","Because dogs are the national animal of Nepal.","Because dogs find flower necklaces for people.","Because dogs came to Nepal in October or November."],"a":0,"ans":"Because the Nepalese believe dogs help the god of death and guide souls to heaven.","evs":[["The Nepalese believe that dogs are helpers of the god of death and guide souls to heaven.","네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다."],["Because of this belief, Nepal has a special day to celebrate dogs.","이러한 믿음 때문에 네팔은 개를 기념하기 위해 특별한 날을 갖는다."]],"ev":["The Nepalese believe that dogs are helpers of the god of death and guide souls to heaven.","네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다."],"ow":["정답 ○ — 'The Nepalese believe that dogs are helpers of the god of death and guide souls to heaven.'(개가 죽음의 신을 도와 영혼을 하늘로 인도한다고 믿는다)와 'Because of this belief, Nepal has a special day to celebrate dogs.'(이러한 믿음 때문에 네팔은 개를 기념하는 특별한 날을 갖는다)에 해당해요.","오답 ✕ — 마을 사람들이 위험에 대비하게 해 준 것은 아일랜드의 염소 이야기예요. 네팔의 개 축제 이유는 'Because of this belief'(이러한 믿음 때문에), 즉 영혼을 인도한다는 믿음이에요.","오답 ✕ — 개가 네팔의 국가 동물이라는 말은 본문에 없어요. 'important part of Nepalese culture'(네팔 문화의 중요한 일부)라고만 했어요.","오답 ✕ — 꽃목걸이는 사람들이 축제날 개에게 주는 것('people give dogs flower necklaces')이지, 개가 사람들에게 찾아 주는 것이 아니에요.","오답 ✕ — 'This dog festival usually takes place in October or November.'(10월이나 11월에 열린다)는 축제 시기예요. 개가 그때 네팔에 왔다는 말은 없어요."],"memo":["정답: ① 개가 죽음의 신을 도와 영혼을 하늘로 인도한다는 믿음 때문","근거: Because of this belief, Nepal has a special day to celebrate dogs.(이러한 믿음 때문에 네팔은 개를 기념하는 특별한 날을 갖는다.)","함정: ②는 아일랜드 염소 이야기와 섞은 함정이야"],"why":"개가 영혼을 하늘로 인도한다는 믿음 때문에 네팔은 개의 날을 기념한다."}],"pp":[["Dog Festival in Nepal","네팔의 개 축제"],["People say, \"Every dog has its day.\"","사람들은 \"모든 개는 자신들의 날이 있다.\"라고 한다."],["In Nepal, this saying is literally true.","네팔에서 이 격언은 문자 그대로 사실이다."],["Dogs have been an important part of Nepalese culture for hundreds of years.","개는 수백 년 동안 네팔 문화의 중요한 일부였다."],["The Nepalese believe that dogs are helpers of the god of death and guide souls to heaven.","네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다."],["Because of this belief, Nepal has a special day to celebrate dogs.","이러한 믿음 때문에 네팔은 개를 기념하기 위해 특별한 날을 갖는다."],["This dog festival usually takes place in October or November.","이 개 축제는 보통 10월이나 11월에 열린다."],["On this day, people give dogs flower necklaces and delicious food.","이날 사람들은 개에게 꽃목걸이와 맛있는 먹이를 준다."],["They also put a red mark on dogs' foreheads to wish them good luck.","그들은 또한 개에게 행운을 빌어 주기 위해 그것의 이마에 빨간색 마크를 찍는다."],["They even bow to dogs to show them love and thanks.","그들은 심지어 개에게 사랑과 감사를 표하기 위해 고개 숙여 인사하기도 한다."]]}];

function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}

var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}

 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
