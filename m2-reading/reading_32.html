rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"Eunji: Hi, everyone, I'm Eunji. I'm at Gangneung Station.","ko":"은지: 안녕하세요, 여러분. 저는 은지예요. 저는 지금 강릉역에 있어요.","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"I is here to meet my friend Rebecca and she brother Paul. Oh, there they are!","ko":"친구 Rebecca와 그녀의 남동생 Paul을 만나러 여기 왔어요. 아, 저기 있네요!","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"am","partial":false,"at":[1],"point":"be동사의 긍정문: 주어 I에는 am 사용","topic":"be동사의 긍정문","memo":"주어 I에는 am 사용"},{"wrong":"she","right":"her","partial":false,"at":[9],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 her 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 her 사용"}]},{"n":3,"tag":null,"en":"Rebecca: It's so well to see you again! I'm exciting to look around Gangneung together.","ko":"Rebecca: 다시 만나서 정말 반가워! 같이 강릉을 구경할 생각에 신나.","ok":false,"foot":[],"fixes":[{"wrong":"well","right":"good","partial":false,"at":[3],"point":"형용사와 부사: It's 뒤 보어 자리에는 형용사 good 사용","topic":"형용사와 부사","memo":"It's 뒤 보어 자리에는 형용사 good 사용"},{"wrong":"exciting","right":"excited","partial":false,"at":[9],"point":"분사형용사: '신이 난'은 excited 사용","topic":"분사형용사","memo":"'신이 난'은 excited 사용"}]},{"n":4,"tag":"정동진 레일바이크","en":"Eunji: We are at Jeongdongjin. We are ride a rail bike before we have lunch.","ko":"은지: 우리는 정동진에 있어요. 우리는 점심을 먹기 전에 레일 바이크를 타고 있어요.","ok":false,"foot":[],"fixes":[{"wrong":"ride","right":"riding","partial":false,"at":[7],"point":"현재진행형: be동사 뒤 진행형: riding (ride 아님)","topic":"현재진행형","memo":"be동사 뒤 진행형: riding (ride 아님)"}]},{"n":5,"tag":null,"en":"The rail run along the beach, so the view is nice.","ko":"철로가 해변을 따라 달려서 경치가 정말 좋아요.","ok":false,"foot":[],"fixes":[{"wrong":"run","right":"runs","partial":false,"at":[2],"point":"3인칭 단수 현재형: 주어 The rail(3인칭 단수): runs (run 아님)","topic":"3인칭 단수 현재형","memo":"주어 The rail(3인칭 단수): runs (run 아님)"}]},{"n":6,"tag":null,"en":"Rebecca: You can say that again. Look at the blue sea!","ko":"Rebecca: 네 말이 맞아. 저 파란 바다 좀 봐!","ok":true,"foot":[],"fixes":[]},{"n":7,"tag":null,"en":"Paul: It's beautifully ,0],["Eunji: Do you want to try sundubu ice cream for dessert?","은지: 디저트로 순두부 아이스크림 먹어 볼래?",1],["Sundubu is soft tofu.","순두부는 부드러운 두부야.",0],["Paul: You mean the ice cream is made from soft tofu?","Paul: 그럼 아이스크림이 부드러운 두부로 만들어졌다는 거야?",1],["Eunji: Yes.","은지: 맞아.",1],["I believe it was invented by people in the Gangneung area.","강릉 지역 사람들이 발명한 것이라고 생각해.",0],["Rebecca: I'm so excited to try it!","Rebecca: 먹어 볼 생각에 정말 신나!",1]];var RNUM=32;var TITLE_EN="VLOG IN GANGNEUNG";var PASS_EN=["VLOG IN GANGNEUNG","Eunji: Hi, everyone, I'm Eunji. I'm at Gangneung Station. I am here to meet my friend Rebecca and her brother Paul. Oh, there they are!","Rebecca: It's so good to see you again! I'm excited to look around Gangneung together.","Jeongdongjin Rail Bike Tour","Eunji: We are at Jeongdongjin. We are riding a rail bike before we have lunch. The rail runs along the beach, so the view is nice.","Rebecca: You can say that again. Look at the blue sea!","Paul: It's beautiful. The rail bike is also powered by electricity. Let's try it!","Eunji: Wow, it's getting faster.","Gangneung Central Market","Eunji: We are now at the Gangneung Central Market. This is a traditional market that sells many kinds of delicious food. We ordered ongsimi and makguksu. Ongsimi is hot soup with potato balls and makguksu is cold buckwheat noodles.","Rebecca: Paul, which do you prefer, ongsimi or makguksu?","Paul: I prefer ongsimi. The potato balls are chewy and delicious. They also look cute.","Rebecca: I like makguksu. The noodles are spicy and tasty.","Eunji: Do you want to try sundubu ice cream for dessert? Sundubu is soft tofu.","Paul: You mean the ice cream is made from soft tofu?","Eunji: Yes. I believe it was invented by people in the Gangneung area.","Rebecca: I'm so excited to try it!"];var PASS_KO=["강릉에서의 브이로그","은지: 안녕하세요, 여러분. 저는 은지예요. 저는 지금 강릉역에 있어요. 친구 Rebecca와 그녀의 남동생 Paul을 만나러 여기 왔어요. 아, 저기 있네요!","Rebecca: 다시 만나서 정말 반가워! 같이 강릉을 구경할 생각에 신나.","정동진 레일 바이크 투어","은지: 우리는 정동진에 있어요. 우리는 점심을 먹기 전에 레일 바이크를 타고 있어요. 철로가 해변을 따라 달려서 경치가 정말 좋아요.","Rebecca: 네 말이 맞아. 저 파란 바다 좀 봐!","Paul: 아름다워. 이 레일 바이크는 전기로도 움직인대. 한번 해 보자!","은지: 우와, 점점 빨라지고 있어.","강릉 중앙시장","은지: 지금 우리는 강릉 중앙시장에 있어요. 여기는 다양한 맛있는 음식을 파는 전통 시장이에요. 우리는 옹심이랑 막국수를 주문했어요. 옹심이는 감자 옹심이가 들어간 뜨거운 국물 요리고, 막국수는 차가운 메밀국수예요.","Rebecca: Paul, 너는 옹심이랑 막국수 중에 뭐가 더 좋아?","Paul: 나는 옹심이가 더 좋아. 감자 옹심이가 쫄깃하고 맛있어. 그리고 모양도 귀여워.","Rebecca: 나는 막국수가 좋아. 면이 매콤하고 맛있어.","은지: 디저트로 순두부 아이스크림 먹어 볼래? 순두부는 부드러운 두부야.","Paul: 그럼 아이스크림이 부드러운 두부로 만들어졌다는 거야?","은지: 맞아. 강릉 지역 사람들이 발명한 것이라고 생각해.","Rebecca: 먹어 볼 생각에 정말 신나!"];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["B는 경주를 방문하는 것을 더 좋아한다.","B는 남해를 방문하는 것을 더 좋아한다.","B는 경주에서 바다를 구경하고 싶어 한다.","A는 B에게 경주를 고른 이유를 묻지 않는다.","B는 최신 건물을 둘러보는 것을 좋아한다."],"a":0,"ans":"B는 경주를 방문하는 것을 더 좋아한다.","evs":[["I prefer to visit Gyeongju.","나는 경주를 방문하는 게 더 좋아."]],"ev":["I prefer to visit Gyeongju.","나는 경주를 방문하는 게 더 좋아."],"ow":["정답 ○ — B가 'I prefer to visit Gyeongju.'(나는 경주를 방문하는 게 더 좋아.)라고 했으므로 맞다.","오답 ✕ — B는 남해(Namhae)가 아니라 'Gyeongju'(경주)를 더 좋아한다고 했으므로 틀림.","오답 ✕ — B가 경주를 좋아하는 이유는 'visiting old temples and walking around historic places'(오래된 절을 방문하고 역사적인 장소를 둘러보는 것)이다. 바다 구경은 이유가 아니라서 틀림.","오답 ✕ — A는 'Why?'(왜?)라고 물어 이유를 물었으므로 이 설명은 틀림.","오답 ✕ — B는 'old temples'(오래된 절)와 'historic places'(역사적인 장소)를 좋아한다고 했다. 최신 건물이 아니라서 틀림."],"memo":["정답: B는 경주를 방문하는 것을 더 좋아한다.","근거: I prefer to visit Gyeongju.(나는 경주를 방문하는 게 더 좋아.)","함정: prefer A to B 에서 A(Gyeongju)가 더 좋아하는 쪽이다."],"why":"B는 남해보다 경주를 더 좋아한다."}],"dlg":[["A","Which place do you prefer to visit, Gyeongju or Namhae?","너는 경주와 남해 중에 어느 곳을 방문하는 게 더 좋아?"],["B","I prefer to visit Gyeongju.","나는 경주를 방문하는 게 더 좋아."],["A","Why?","왜?"],["B","Because I like visiting old temples and walking around historic places.","오래된 절을 방문하고 역사적인 장소를 둘러보는 걸 좋아하거든."]]},{"qs":[{"n":2,"q":"소녀가 널뛰기를 해 보고 싶어 하는 이유로 알맞은 것은?","o":["뛰는 것을 아주 좋아해서","투호가 어려워 보여서","널뛰기가 더 재미있어 보여서","친구가 추천해 주어서","소년이 같이 하자고 해서"],"a":0,"ans":"뛰는 것을 아주 좋아해서","evs":[["I'd like to try neolttwigi. I love jumping.","나는 널뛰기를 해 보고 싶어. 뛰는 걸 정말 좋아하거든."]],"ev":["I'd like to try neolttwigi. I love jumping.","나는 널뛰기를 해 보고 싶어. 뛰는 걸 정말 좋아하거든."],"ow":["정답 ○ — 소녀가 'I'd like to try neolttwigi. I love jumping.'(나는 널뛰기를 해 보고 싶어. 뛰는 걸 정말 좋아하거든.)이라고 했으므로 뛰는 것을 좋아해서가 이유이다.","오답 ✕ — 투호가 어려워 보인다는 말은 없다. 소년이 투호에 대해 'It looks more fun.'(더 재미있어 보여.)이라고 했을 뿐이라서 틀림.","오답 ✕ — 'It looks more fun.'(더 재미있어 보여.)은 소녀가 아니라 소년이 투호를 고른 이유이다. 널뛰기의 이유가 아니라서 틀림.","오답 ✕ — 친구의 추천에 대한 언급이 없다. 소녀의 이유는 'I love jumping.'(뛰는 걸 정말 좋아하거든.)이므로 틀림.","오답 ✕ — 소년은 투호를 더 좋아한다고 했을 뿐 같이 하자고 하지 않았다. 소녀의 이유는 'I love jumping.'(뛰는 걸 정말 좋아하거든.)이므로 틀림."],"memo":["정답: 뛰는 것을 아주 좋아해서","근거: I'd like to try neolttwigi. I love jumping.(널뛰기를 해 보고 싶어. 뛰는 걸 정말 좋아하거든.)","함정: 'It looks more fun'은 소년이 투호를 고른 이유"],"why":"소녀는 뛰는 것을 좋아해서 널뛰기를 해 보고 싶어 한다."}],"dlg":[["G","Which do you prefer, tuho or neolttwigi?","너는 투호랑 널뛰기 중에 뭐가 더 좋아?"],["B","I prefer tuho. It looks more fun. How about you?","나는 투호가 더 좋아. 더 재미있어 보여. 너는 어때?"],["G","I'd like to try neolttwigi. I love jumping.","나는 널뛰기를 해 보고 싶어. 뛰는 걸 정말 좋아하거든."]]},{"qs":[{"n":3,"q":"위 대화의 주제로 알맞은 것은?","o":["planning a trip to Busan","how to make dwaejigukbap","the history of traditional dishes in Busan","recommending famous places in Korea","introducing the best place to eat in Busan"],"a":0,"ans":"planning a trip to Busan","evs":[["I'm excited to go to Busan next week! We need to start planning our trip.","다음 주에 부산에 가게 돼서 신나! 여행 계획을 세우기 시작해야겠어."],["Why don't we visit Haeundae?","해운대에 가 보는 게 어때?"]],"ev":["I'm excited to go to Busan next week! We need to start planning our trip.","다음 주에 부산에 가게 돼서 신나! 여행 계획을 세우기 시작해야겠어."],"ow":["정답 ○ — 엄마가 'We need to start planning our trip.'(여행 계획을 세우기 시작해야겠어.)라고 한 뒤, 해운대 방문과 먹을 음식을 함께 정하므로 부산 여행을 계획하는 것이 주제이다.","오답 ✕ — 돼지국밥을 만드는 방법은 나오지 않는다. 'Dwaejigukbap is pork soup with rice'(돼지국밥은 밥이 들어간 돼지고기 국이에요)처럼 음식을 간단히 설명할 뿐이라서 틀림.","오답 ✕ — 부산 전통 음식의 역사는 대화에 나오지 않는다. 음식 이름과 어떤 음식인지만 말하므로 틀림.","오답 ✕ — 'Why don't we visit Haeundae?'(해운대에 가 보는 게 어때?)처럼 부산의 한 곳을 말하지만, 한국의 유명한 곳들을 추천하는 대화가 아니라 부산 여행 계획 대화라서 틀림.","오답 ✕ — 'famous local dishes in Busan'(부산의 유명한 향토 음식)이 나오지만 최고의 맛집을 소개하는 대화가 아니다. 음식은 여행 계획의 일부라서 틀림."],"memo":["정답: planning a trip to Busan (부산 여행 계획하기)","근거: We need to start planning our trip.(여행 계획을 세우기 시작해야겠어.)","함정: 해운대·음식 이야기는 모두 여행 계획의 일부이다."],"why":"엄마와 아들이 부산 여행 계획을 세우는 대화이다."},{"n":4,"q":"위 대화를 읽고 답할 수 없는 질문은?","o":["When do the boy and his mom go on a trip to Busan?","According to the boy, what is Haeundae like?","What are some famous local foods in Busan?","What is dwaejigukbap?","Where will the boy and his mom go after Haeundae?"],"a":4,"ans":"Where will the boy and his mom go after Haeundae?","evs":[["Why don't we visit Haeundae?","해운대에 가 보는 게 어때?"],["Let's try some famous local dishes in Busan.","부산의 유명한 향토 음식을 먹어 봐요."]],"ev":["Why don't we visit Haeundae?","해운대에 가 보는 게 어때?"],"ow":["오답 ✕ — 'I'm excited to go to Busan next week!'(다음 주에 부산에 가게 돼서 신나!)라고 했으므로 언제 가는지(다음 주) 알 수 있다. 답할 수 있는 질문이다.","오답 ✕ — 소년이 'it has a nice beach and lots of things to enjoy like busking'(멋진 해변이 있고 버스킹처럼 즐길 거리가 많다)이라고 했으므로 해운대가 어떤 곳인지 답할 수 있다.","오답 ✕ — 'I've heard about dwaejigukbap and milmyeon.'(돼지국밥이랑 밀면에 대해 들어 봤어요.)라고 했으므로 유명한 음식을 답할 수 있다.","오답 ✕ — 'Dwaejigukbap is pork soup with rice'(돼지국밥은 밥이 들어간 돼지고기 국이에요)라고 했으므로 돼지국밥이 무엇인지 답할 수 있다.","정답 ○ — 'Why don't we visit Haeundae?'(해운대에 가 보는 게 어때?)라는 말만 있을 뿐, 해운대 다음에 어디를 갈지는 대화에 나오지 않는다. 그래서 답할 수 없는 질문이다."],"memo":["정답: ⑤ 해운대 다음에 어디에 갈까? (답할 수 없음)","근거: 해운대 이후 일정은 대화에 없다. 나온 것은 Why don't we visit Haeundae?(해운대에 가 보는 게 어때?)까지","함정: 대화에 없는 내용은 '답할 수 없는 질문'이다."],"why":"해운대 다음에 갈 곳은 대화에 나오지 않는다."}],"dlg":[["W","I'm excited to go to Busan next week! We need to start planning our trip.","다음 주에 부산에 가게 돼서 신나! 여행 계획을 세우기 시작해야겠어."],["B","Sounds great, Mom! What should we do first?","좋아요, 엄마! 우리 뭐부터 할까요?"],["W","Why don't we visit Haeundae?","해운대에 가 보는 게 어때?"],["B","That's a good idea. I heard that it has a nice beach and lots of things to enjoy like busking.","좋은 생각이에요. 거기에는 멋진 해변이 있고 버스킹처럼 즐길 거리가 많다고 들었어요."],["W","Yes, right. How about food? Anything in mind?","응, 맞아. 음식은 어떻게 할까? 생각해 둔 거 있니?"],["B","Let's try some famous local dishes in Busan. I've heard about dwaejigukbap and milmyeon.","부산의 유명한 향토 음식을 먹어 봐요. 돼지국밥이랑 밀면에 대해 들어 봤어요."],["W","Oh, what are they?","오, 그게 뭔데?"],["B","Dwaejigukbap is pork soup with rice and milmyeon is a cold noodle dish. Which do you prefer, hot soup or cold noodles?","돼지국밥은 밥이 들어간 돼지고기 국이고 밀면은 차가운 국수 요리예요. 엄마는 뜨거운 국이랑 차가운 국수 중에 뭐가 더 좋으세요?"],["W","I prefer hot soup.","나는 뜨거운 국이 더 좋아."],["B","Me, too! I'm excited to experience all these new things with you!","저도요! 엄마랑 이 모든 새로운 것들을 경험하게 돼서 정말 신나요!"]]},{"qs":[{"n":5,"q":"다음 담화의 내용과 일치하지 않는 것은?","o":["소년은 흥미로운 프로그램을 소개하게 되어 기뻐한다.","프로그램의 이름은 '청소년 궁궐 해설사'이다.","프로그램에서 세계 각국의 궁궐 이야기를 배운다.","프로그램에서 배운 궁궐 이야기를 영어로 설명하는 것을 연습한다.","관광객들에게 영어로 투어를 진행하게 된다."],"a":2,"ans":"프로그램에서 세계 각국의 궁궐 이야기를 배운다.","evs":[["Through this program, you will learn about the stories of traditional Korean palaces.","이 프로그램을 통해 여러분은 한국 전통 궁궐의 이야기를 배우게 됩니다."]],"ev":["Through this program, you will learn about the stories of traditional Korean palaces.","이 프로그램을 통해 여러분은 한국 전통 궁궐의 이야기를 배우게 됩니다."],"ow":["오답 ✕ — 'Today, I'm excited to tell you about an interesting program.'(오늘 저는 흥미로운 프로그램을 소개하게 되어 기쁩니다.)라고 했으므로 일치한다.","오답 ✕ — 'The title of the program is “Teen Palace Guides.”'(프로그램의 이름은 ‘청소년 궁궐 해설사’입니다.)라고 했으므로 일치한다.","정답 ○ — 프로그램에서 배우는 것은 'the stories of traditional Korean palaces'(한국 전통 궁궐의 이야기)이다. 세계 각국의 궁궐 이야기가 아니라서 일치하지 않는다.","오답 ✕ — 'You will also practice explaining the stories in English.'(그 이야기를 영어로 설명하는 연습도 하게 됩니다.)라고 했으므로 일치한다.","오답 ✕ — 'you will give tours to tourists in English'(관광객들에게 영어로 투어를 해 주게 됩니다)라고 했으므로 일치한다."],"memo":["정답: ③ 세계 각국의 궁궐 이야기를 배운다 (✕ 일치하지 않음)","근거: you will learn about the stories of traditional Korean palaces(한국 전통 궁궐의 이야기를 배우게 됩니다)","함정: 세계 각국이 아니라 한국 전통 궁궐이다."],"why":"이 프로그램에서 배우는 것은 한국 전통 궁궐 이야기이다."}],"dlg":[["B","Today, I'm excited to tell you about an interesting program.","오늘 저는 여러분에게 흥미로운 프로그램을 소개하게 되어 기쁩니다."],["B","The title of the program is “Teen Palace Guides.”","프로그램의 이름은 ‘청소년 궁궐 해설사’입니다."],["B","Through this program, you will learn about the stories of traditional Korean palaces.","이 프로그램을 통해 여러분은 한국 전통 궁궐의 이야기를 배우게 됩니다."],["B","You will also practice explaining the stories in English.","또한 그 이야기를 영어로 설명하는 연습도 하게 됩니다."],["B","Finally, you will give tours to tourists in English.","마지막으로, 관광객들에게 영어로 투어를 해 주게 됩니다."],["B","Join us and become a Teen Palace Guide!","함께해서 청소년 궁궐 해설사가 되어 보세요!"]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["은지는 친구 Rebecca와 그녀의 남동생 Paul을 만나러 강릉역에 왔다.","Rebecca는 은지의 남동생이다.","은지와 Rebecca는 이번에 처음 만난다.","세 사람은 부산을 구경할 예정이다.","Rebecca는 강릉을 구경하는 것이 지루하다고 말한다."],"a":0,"ans":"은지는 친구 Rebecca와 그녀의 남동생 Paul을 만나러 강릉역에 왔다.","evs":[["I am here to meet my friend Rebecca and her brother Paul.","친구 Rebecca와 그녀의 남동생 Paul을 만나러 여기 왔어요."]],"ev":["I am here to meet my friend Rebecca and her brother Paul.","친구 Rebecca와 그녀의 남동생 Paul을 만나러 여기 왔어요."],"ow":["정답 ○ — 은지가 'I am here to meet my friend Rebecca and her brother Paul.'(친구 Rebecca와 그녀의 남동생 Paul을 만나러 여기 왔어요.)라고 했으므로 맞다.","오답 ✕ — 'my friend Rebecca and her brother Paul'(친구 Rebecca와 그녀의 남동생 Paul)이라고 했다. Rebecca는 은지의 남동생이 아니라 친구이고, Paul이 Rebecca의 남동생이라서 틀림.","오답 ✕ — Rebecca는 'It's so good to see you again!'(다시 만나서 정말 반가워!)이라고 했다. 'again'이 있으므로 처음 만나는 것이 아니라서 틀림.","오답 ✕ — Rebecca는 'I'm excited to look around Gangneung together.'(같이 강릉을 구경할 생각에 신나.)라고 했다. 부산이 아니라 강릉이라서 틀림.","오답 ✕ — Rebecca는 'I'm excited to look around Gangneung together.'(같이 강릉을 구경할 생각에 신나.)라고 했다. 지루한 것이 아니라 신나 있으므로 틀림."],"memo":["정답: 은지는 Rebecca와 Paul을 만나러 강릉역에 왔다.","근거: I am here to meet my friend Rebecca and her brother Paul.(친구 Rebecca와 그녀의 남동생 Paul을 만나러 여기 왔어요.)","함정: Paul은 Rebecca의 남동생 (Rebecca가 은지의 남동생 ✕)"],"why":"은지는 친구 Rebecca와 그 남동생 Paul을 만나러 강릉역에 있다."}],"pp":[["Eunji: Hi, everyone, I'm Eunji.","은지: 안녕하세요, 여러분. 저는 은지예요."],["I'm at Gangneung Station.","저는 지금 강릉역에 있어요."],["I am here to meet my friend Rebecca and he   var tot=0,fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});
var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});

}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
