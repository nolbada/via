"],[8,"That’s because sharks and killer whales usually stay near the surface.","그것은 상어와 범고래가 보통 수면 근처에 머무르기 때문이다."]],"w":"5번에서 바닷속 깊이 잠수해서 잔다고 하고, 8번에서 수면 근처에 머무는 것은 상어와 범고래라고 함. 그래서 수면 근처에서 자는 것이 아님.","c":"F"},"h":"d915a15fc1"},{"n":3,"t":"tf","q":"Elephant seals begin to sink in a spiral in the second stage of sleep.","ko":"코끼리바다물범은 수면의 두 번째 단계에서 나선형으로 가라앉기 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10~11번 문장","s":[[10,"They then turn upside down as they go into the second stage of sleep.","그러고 나서 그들은 수면의 두 번째 단계에 들어갈 때 몸을 거꾸로 뒤집는다."],[11,"In this stage, they can’t move and begin to sink down in a spiral.","이 단계에서, 그들은 움직일 수 없고 나선형으로 가라앉기 시작한다."]],"w":"10번에서 두 번째 단계에 들어가며 거꾸로 뒤집히고, 11번에서 이 단계에 움직일 수 없고 나선형으로 가라앉기 시작한다고 함.","c":"T"},"h":"a46e851d5d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They close their eyes and dive deep into the ocean.)","ko":"그들은 눈을 감고 바닷속 깊이 dive 한다.","opts":["올라가다","잠수하다","도망치다","날다"],"word":"dive","r":{"a":"2) 잠수하다","ev":"5번 문장","s":[[5,"They close their eyes and dive deep into the ocean.","그들은 눈을 감고 바닷속 깊이 잠수한다."]],"w":"dive deep into the ocean은 ‘바닷속 깊이 들어가다’. 4번의 dive naps도 잠수해서 자는 낮잠. 올라가는 것은 12번의 swim to the surface.","c":2},"h":"33292b6906"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…sharks and killer whales usually stay near the surface.)","ko":"…상어와 범고래가 보통 surface 근처에 머무른다.","opts":["바닥","동굴","그림자","수면, 표면"],"word":"surface","r":{"a":"4) 수면, 표면","ev":"8번 문장","s":[[8,"That’s because sharks and killer whales usually stay near the surface.","그것은 상어와 범고래가 보통 수면 근처에 머무르기 때문이다."]],"w":"상어와 범고래는 수면 근처에 있어서, 깊이 잠수한 코끼리바다물범은 안전하다는 흐름. 12번에서도 먹이를 찾으러 the surface로 올라감.","c":4},"h":"f8f82cc147"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThese dive naps keep them safe.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이 다이빙 낮잠은 그들을 안전하게 지켜 준다.","opts":["코끼리바다물범","상어와 범고래","다이빙 낮잠","먹이"],"r":{"a":"1) 코끼리바다물범","ev":"4번, 7번 문장","s":[[4,"To rest, they take “dive naps.”","쉬기 위해, 그들은 ‘다이빙 낮잠’을 잔다."],[7,"These dive naps keep them safe.","이 다이빙 낮잠은 그들을 안전하게 지켜 준다."]],"w":"4번에서 다이빙 낮잠을 자는 주체는 코끼리바다물범(they)이고, 7번은 그 낮잠이 코끼리바다물범을 안전하게 지켜 준다는 내용. 상어와 범고래는 8번에서 위험 요소로 나옴.","c":1},"h":"8895c94592"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s because sharks and killer whales usually stay near the surface.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 상어와 범고래가 보통 수면 근처에 머무르기 때문이다.","opts":["그것은 상어와 범고래가 보통 깊은 바다에 살기 때문이다.","그것은 상어와 범고래가 수면 위로 올라오지 못하기 때문이다.","그것은 상어와 범고래가 보통 수면 근처에 머무르기 때문이다.","그것은 상어와 범고래가 코끼리바다물범과 친구이기 때문이다."],"r":{"a":"3) 그것은 상어와 범고래가 보통 수면 근처에 머무르기 때문이다.","ev":"7~8번 문장","s":[[7,"These dive naps keep them safe.","이 다이빙 낮잠은 그들을 안전하게 지켜 준다."],[8,"That’s because sharks and killer whales usually stay near the surface.","그것은 상어와 범고래가 보통 수면 근처에 머무르기 때문이다."]],"w":"That’s because 뒤에는 ‘그 이유’가 온다. 7번에서 다이빙 낮잠이 안전하다고 한 이유가, 상어와 범고래가 수면 근처에 있어서 깊은 곳은 안전하기 때문.","c":3},"h":"67212fc726"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["코끼리바다물범은 한꺼번에 몇 시간 동안 잠을 잔다.","짧은 낮잠 후에 코끼리바다물범은 먹이를 찾으러 수면으로 헤엄쳐 간다.","코끼리바다물범은 한 시간이 넘는 낮잠을 잔다.","코끼리바다물범은 1년에 약 2개월을 바다에서 보낸다."],"opts":["Elephant seals sleep for several hours all at once.","After a short nap, elephant seals swim to the surface to find food.","Elephant seals take naps for more than an hour.","Elephant seals stay in the sea for about two months a year."],"r":{"a":"2) After a short nap, elephant seals swim to the surface to find food.","ev":"1번, 3번, 6번, 12번 문장","s":[[1,"Elephant seals spend about 7 months of the year in the sea.","코끼리바다물범은 1년 중 약 7개월을 바다에서 보낸다."],[3,"And they don’t sleep all at once.","그리고 그들은 한꺼번에 잠을 자지 않는다."],[6,"There, they take short naps for less than 20 minutes.","그곳에서, 그들은 20분 미만의 짧은 낮잠을 잔다."],[12,"After their short nap, they swim to the surface to find food.","짧은 낮잠 후에, 그들은 먹이를 찾기 위해 수면으로 헤엄쳐 간다."]],"w":"12번에서 짧은 낮잠 후 먹이를 찾으러 수면으로 헤엄친다고 함. 한꺼번에 자지 않고(3번), 낮잠은 20분 미만이며(6번), 바다에서 약 7개월을 보낸다(1번).","c":2},"h":"f781c5ee50"},{"n":9,"t":"sum","q":"Elephant seals take (A) naps deep in the ocean, and this keeps them (B).","ko":"코끼리바다물범은 바닷속 깊이에서 (A) 낮잠을 자고, 이것이 그들을 (B) 지켜 준다.","oko":["(A) 긴 / (B) 안전하게","(A) 짧은 / (B) 배고프게","(A) 긴 / (B) 배고프게","(A) 짧은 / (B) 피곤하게","(A) 짧은 / (B) 안전하게"],"opts":["(A) long / (B) safe","(A) short / (B) hungry","(A) long / (B) hungry","(A) short / (B) tired","(A) short / (B) safe"],"r":{"a":"5) (A) short / (B) safe","ev":"6~7번 문장","s":[[6,"There, they take short naps for less than 20 minutes.","그곳에서, 그들은 20분 미만의 짧은 낮잠을 잔다."],[7,"These dive naps keep them safe.","이 다이빙 낮잠은 그들을 안전하게 지켜 준다."]],"w":"6번에서 20분 미만의 short naps(짧은 낮잠), 7번에서 These dive naps keep them safe(그들을 안전하게 지켜 준다)고 함.","c":5},"h":"5e5d2096c5"},{"n":10,"t":"fill","q":"During their dive naps, elephant seals enter a deep [A] with their bodies [B] up.","ko":"다이빙 낮잠 중에, 코끼리바다물범은 몸을 [B] 세운 채 깊은 [A]에 들어간다.","bko":{"sleep":"잠","straight":"똑바로, 수직으로","usually":"보통","only":"오직","less":"더 적은","begin":"시작하다"},"bank":["sleep","straight","usually","only","less","begin"],"r":{"a":"[A] sleep, [B] straight","ev":"9번 문장","s":[[9,"During their dive naps, elephant seals enter a deep sleep with their bodies straight up.","다이빙 낮잠 중에, 코끼리바다물범들은 몸을 수직으로 세운 채 깊은 잠에 들어간다."]],"w":"9번 During their dive naps, elephant seals enter a deep sleep with their bodies straight up에서 가져옴. usually(보통)·only(오직)·less(더 적은)는 정도를 말하는 말이고 begin(시작하다)은 동작이라, ‘깊은 ~’이나 ‘몸을 ~ 세운 채’ 자리에 맞지 않음.","c":null},"h":"7bb0a7cfb6"}]},{"u":10,"id":"rg1-10-1","no":1,"ko":"실패한 제품만 모아 둔 박물관이 있다고?","items":[{"n":1,"t":"tf","q":"The Museum of Failure started in Sweden in 2017.","ko":"실패 박물관은 2017년 스웨덴에서 시작되었다.","r":{"ev":"3번 문장","s":[[3,"The museum started in Sweden in 2017 and traveled around the world.","그 박물관은 2017년 스웨덴에서 시작되어 전 세계를 돌아다녔다."]],"w":"3번 문장에 The museum started in Sweden in 2017이 그대로 나온다. 스웨덴, 2017년 모두 본문과 같다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"c76a1ab7a1"},{"n":2,"t":"tf","q":"Big companies like Coca-Cola and Pepsi never made mistakes.","ko":"코카콜라와 펩시 같은 대기업들은 절대 실수를 하지 않았다.","r":{"ev":"8~9번 문장","s":[[8,"He says that even big companies like Coca-Cola and Pepsi made mistakes.","그는 코카콜라와 펩시 같은 대기업조차도 실수를 했다고 말한다."],[9,"But they learned and improved.","하지만 그들은 배우고 개선했다."]],"w":"8번 문장에서 대기업조차도 실수를 했다(made mistakes)고 하고, 9번에서 그들은 배우고 개선했다고 한다. never made mistakes는 본문과 반대이다.","c":"F","a":"F (본문과 다른 내용)"},"h":"500e035970"},{"n":3,"t":"tf","q":"Samuel West thinks we learn from our mistakes.","ko":"Samuel West는 우리가 실수로부터 배운다고 생각한다.","r":{"ev":"7번 문장","s":[[7,"He thinks we learn from our mistakes.","그는 우리가 실수로부터 배운다고 생각한다."]],"w":"7번 문장 He thinks we learn from our mistakes와 같은 내용이다. He는 6번의 Samuel West이다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"7bb737d069"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But they learned and improved.)","ko":"밑줄 친 단어의 뜻은? (하지만 그들은 배웠고 ...)","opts":["더 나빠졌다","나아졌다","사라졌다","포기했다"],"word":"improved","r":{"ev":"9번 문장","s":[[9,"But they learned and improved.","하지만 그들은 배우고 개선했다."]],"w":"9번에서 대기업들이 실수를 하고도 배웠으니(learned) 그 결과 나아졌다는 뜻이다. improve = 나아지다, 개선하다. 12번의 become better와 같은 뜻.","c":2,"a":"2) 나아졌다"},"h":"20e49e5d88"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Samuel’s message is clear.)","ko":"밑줄 친 단어의 뜻은? (Samuel의 메시지는 ...)","opts":["비밀의","재미있는","명확한","위험한"],"word":"clear","r":{"ev":"12번 문장","s":[[12,"Samuel’s message is clear: making mistakes is just a way to become better.","Samuel의 메시지는 명확하다. 실수를 하는 것은 더 나아지게 되는 하나의 방법일 뿐이다."]],"w":"12번에서 clear 뒤 콜론(:)으로 메시지의 내용이 바로 이어진다. 분명하게 말한 메시지라는 뜻이므로 clear = 명확한, 분명한.","c":3,"a":"3) 명확한"},"h":"d1b11363ce"},{"n":6,"t":"ref","opts":["자신의 실수를 적은 접착식 메모지들","방문객들","박물관의 벽","코카콜라와 펩시"],"ko":"밑줄 친 them이 가리키는 것은?","q":"What does the underlined \"them\" refer to?\nAny visitors can write their own mistakes on sticky notes and put them on a wall.","sko":"어떤 방문객이든 자신의 실수를 접착식 메모지에 적어 벽에 붙일 수 있다.","r":{"ev":"11번 문장","s":[[11,"Any visitors can write their own mistakes on sticky notes and put them on a wall.","어떤 방문객이든 자신의 실수를 접착식 메모지에 적어 벽에 붙일 수 있다."]],"w":"11번에서 방문객이 자신의 실수를 접착식 메모지에 적은 뒤 그것들(them)을 벽에 붙인다. 벽은 붙이는 장소이고, 방문객은 붙이는 사람이다.","c":1,"a":"1) 자신의 실수를 적은 접착식 메모지들"},"h":"84b5a08bdd"},{"n":7,"t":"sense","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["실수를 하면 박물관에 갈 수 없다.","실수를 숨기는 것이 가장 좋은 방법이다.","실수는 절대 해서는 안 되는 일이다.","실수는 더 나아지는 하나의 방법일 뿐이다."],"q":"Which is the best meaning of the sentence?\n\"Samuel’s message is clear: making mistakes is just a way to become better.\"","sko":"Samuel의 메시지는 명확하다. 실수를 하는 것은 더 나아지게 되는 하나의 방법일 뿐이다.","r":{"ev":"12번 문장","s":[[12,"Samuel’s message is clear: making mistakes is just a way to become better.","Samuel의 메시지는 명확하다. 실수를 하는 것은 더 나아지게 되는 하나의 방법일 뿐이다."]],"w":"12번에서 making mistakes(실수를 하는 것)는 just a way to become better(더 나아지는 하나의 방법일 뿐)라고 한다. 실수를 숨기거나 피하라는 말은 없다.","c":4,"a":"4) 실수는 더 나아지는 하나의 방법일 뿐이다."},"h":"4651465554"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["박물관에는 50개도 안 되는 실패한 제품이 있다.","Samuel West는 대기업들이 절대 실수하지 않는다고 생각한다.","실패 박물관은 Samuel West가 만들었다.","‘Share Your Failure’ 벽은 관람 시작 부분에 있다."],"opts":["The museum has fewer than 50 failed products.","Samuel West thinks big companies never make mistakes.","The Museum of Failure was made by Samuel West.","The “Share Your Failure” wall is at the start of the tour."],"r":{"ev":"4번, 6번, 8번, 10번 문장","s":[[4,"Here, you can see examples of more than 150 failed products.","이곳에서 여러분은 150개가 넘는 실패한 제품의 사례를 볼 수 있다."],[6,"A man named Samuel West made this museum.","Samuel West라는 이름의 남자가 이 박물관을 만들었다."],[8,"He says that even big companies like Coca-Cola and Pepsi made mistakes.","그는 코카콜라와 펩시 같은 대기업조차도 실수를 했다고 말한다."],[10,"At the end of the museum’s tour, there is a “Share Your Failure” wall.","박물관 관람의 마지막에는 ‘당신의 실패를 공유하세요’ 벽이 있다."]],"w":"6번에서 Samuel West라는 사람이 박물관을 만들었다고 한다. 제품은 150개 이상(4번), 대기업도 실수를 했고(8번), 벽은 관람의 마지막에 있다(10번).","c":3,"a":"3) The Museum of Failure was made by Samuel West."},"h":"2e76d18cc5"},{"n":9,"t":"sum","q":"The Museum of Failure shows (A) products, and it teaches that making mistakes is a way to (B).","ko":"실패 박물관은 (A) 제품들을 보여 주며, 실수를 하는 것은 (B)하는 방법이라고 가르쳐 준다.","oko":["(A) 성공한 / (B) 잊다","(A) 실패한 / (B) 나아지다","(A) 성공한 / (B) 나아지다","(A) 값비싼 / (B) 멈추다","(A) 실패한 / (B) 잊다"],"opts":["(A) successful / (B) forget","(A) failed / (B) improve","(A) successful / (B) improve","(A) expensive / (B) stop","(A) failed / (B) forget"],"r":{"ev":"4번, 12번 문장","s":[[4,"Here, you can see examples of more than 150 failed products.","이곳에서 여러분은 150개가 넘는 실패한 제품의 사례를 볼 수 있다."],[12,"Samuel’s message is clear: making mistakes is just a way to become better.","Samuel의 메시지는 명확하다. 실수를 하는 것은 더 나아지게 되는 하나의 방법일 뿐이다."]],"w":"4번에서 박물관은 failed products(실패한 제품)를 보여 주고, 12번에서 실수는 더 나아지는(become better = improve) 방법이라고 한다. forget은 박물관이 하지 않는 행동(2번)이라 틀리다.","c":2,"a":"2) (A) failed / (B) improve"},"h":"1b214c1572"},{"n":10,"t":"fill","q":"Visitors can write their own [A] on sticky notes and put them on a [B] at the end of the museum’s tour.","ko":"방문객들은 박물관 관람의 마지막에 자신의 [A]을 접착식 메모지에 적어 [B]에 붙일 수 있다.","bank":["mistakes","wall","products","tour","museum","companies"],"bko":{"mistakes":"실수","wall":"벽","products":"제품들","tour":"관람, 견학","museum":"박물관","companies":"회사들"},"r":{"ev":"10~11번 문장","s":[[10,"At the end of the museum’s tour, there is a “Share Your Failure” wall.","박물관 관람의 마지막에는 ‘당신의 실패를 공유하세요’ 벽이 있다."],[11,"Any visitors can write their own mistakes on sticky notes and put them on a wall.","어떤 방문객이든 자신의 실수를 접착식 메모지에 적어 벽에 붙일 수 있다."]],"w":"10~11번에서 방문객은 자신의 실수(mistakes)를 메모지에 적어 벽(wall)에 붙인다. products(제품들), museum(박물관), companies(회사들), tour(관람)는 적거나 붙이는 대상이 될 수 없어서 빈칸에 맞지 않는다.","c":null,"a":"[A] mistakes, [B] wall"},"h":"4eebb2e6ae"}]},{"u":10,"id":"rg1-10-2","no":2,"ko":"단것을 좋아하면 시급 30달러? 꿈의 직업 공고","items":[{"n":1,"t":"tf","q":"The company wants people to taste new candies.","ko":"그 회사는 새로운 사탕을 맛볼 사람들을 원한다.","r":{"ev":"5번 문장","s":[[5,"Our company is looking for people to try new candies.","저희 회사는 새로운 사탕을 시식해 볼 사람들을 찾고 있습니다."]],"w":"5번 문장에서 회사는 새로운 사탕을 시식해 볼(try new candies) 사람들을 찾고 있다고 한다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"c213d10521"},{"n":2,"t":"tf","q":"Workers must work only full-time.","ko":"일하는 사람은 반드시 풀타임으로만 일해야 한다.","r":{"ev":"8번 문장","s":[[8,"You can choose to work full-time or part-time.","여러분은 풀타임 또는 파트타임으로 일하는 것을 선택할 수 있습니다."]],"w":"8번 문장에서 풀타임이나 파트타임 중에서 선택할 수 있다(choose to work full-time or part-time)고 한다. 풀타임으로만 일해야 하는 것은 아니다.","c":"F","a":"F (본문과 다른 내용)"},"h":"ec5abf2ab7"},{"n":3,"t":"tf","q":"People should send an email to apply for the job.","ko":"그 일자리에 지원하려면 이메일을 보내야 한다.","r":{"ev":"13번 문장","s":[[13,"To apply, please send us an email to: jobs@candyhouse.com by February 15.","지원하려면, 2월 15일까지 jobs@candyhouse.com으로 이메일을 보내 주세요."]],"w":"13번 문장에서 지원하려면 이메일을 보내 달라(please send us an email)고 한다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"d1484300cb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (we have the perfect job for you.)","ko":"밑줄 친 단어의 뜻은? (우리에게 여러분을 위한 ... 직업이 있습니다.)","opts":["어려운","위험한","완벽한","오래된"],"word":"perfect","r":{"ev":"4번 문장","s":[[4,"If so, we have the perfect job for you.","만약 그렇다면, 우리에게 여러분을 위한 완벽한 직업이 있습니다."]],"w":"4번에서 재미있는 직업을 찾는 사람에게 딱 맞는 직업이 있다고 소개한다. perfect = 완벽한, 딱 맞는.","c":3,"a":"3) 완벽한"},"h":"ebd43c0051"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Anyone who has a sweet tooth for candy can apply.)","ko":"밑줄 친 단어의 뜻은? (사탕 같은 단것을 좋아하는 사람은 누구나 ...)","opts":["지원하다","거절하다","주문하다","요리하다"],"word":"apply","r":{"ev":"10번, 13번 문장","s":[[10,"Anyone who has a sweet tooth for candy can apply.","단것을 좋아하는 사람은 누구나 지원할 수 있습니다."],[13,"To apply, please send us an email to: jobs@candyhouse.com by February 15.","지원하려면, 2월 15일까지 jobs@candyhouse.com으로 이메일을 보내 주세요."]],"w":"10번에서 단것을 좋아하는 사람은 누구나 can apply 할 수 있다고 하고, 13번에서 To apply 뒤에 이메일을 보내라고 한다. 일자리에 신청하는 것이므로 apply = 지원하다.","c":1,"a":"1) 지원하다"},"h":"17992f9862"},{"n":6,"t":"ref","opts":["여러분의 생각들","새로운 사탕들","풀타임 일자리들","회사 사람들"],"ko":"밑줄 친 them이 가리키는 것은?","q":"What does the underlined \"them\" refer to?\nYou will taste new candies like chocolate and gummy candies and share your thoughts about them — how they taste, feel, and smell.","sko":"여러분은 초콜릿과 젤리 같은 새로운 사탕들을 맛보고, 그것들이 어떤 맛이 나고 어떤 느낌이 들고 어떤 냄새가 나는지에 대한 생각을 공유하게 될 것입니다.","r":{"ev":"7번 문장","s":[[7,"You will taste new candies like chocolate and gummy candies and share your thoughts about them — how they taste, feel, and smell.","여러분은 초콜릿과 젤리 같은 새로운 사탕들을 맛보고, 그것들이 어떤 맛이 나고 어떤 느낌이 들고 어떤 냄새가 나는지에 대한 생각을 공유하게 될 것입니다."]],"w":"7번에서 새로운 사탕(new candies)을 맛보고 그것들(them)에 대한 생각을 공유한다. 그래서 them은 초콜릿과 젤리 같은 새로운 사탕들이다.","c":2,"a":"2) 새로운 사탕들"},"h":"876eb9b08b"},{"n":7,"t":"sense","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["단것을 먹으면 이가 아픈 사람만 지원할 수 있다.","사탕을 파는 가게를 가진 사람만 지원할 수 있다.","사탕 만드는 방법을 아는 사람만 지원할 수 있다.","사탕 같은 단것을 좋아하는 사람이라면 누구나 지원할 수 있다."],"q":"Which is the best meaning of the sentence?\n\"Anyone who has a sweet tooth for candy can apply.\"","sko":"단것을 좋아하는 사람은 누구나 지원할 수 있습니다.","r":{"ev":"10번 문장","s":[[10,"Anyone who has a sweet tooth for candy can apply.","단것을 좋아하는 사람은 누구나 지원할 수 있습니다."]],"w":"have a sweet tooth는 ‘단것을 좋아하다’라는 표현이다. 그래서 단것을 좋아하는 사람은 누구나(Anyone) 지원할 수 있다는 뜻이다. 이가 아프다는 뜻이 아니다.","c":4,"a":"4) 사탕 같은 단것을 좋아하는 사람이라면 누구나 지원할 수 있다."},"h":"e845561ca3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["시간당 30달러가 아니라 하루에 30달러를 번다.","18세 미만의 사람도 지원할 수 있다.","지원하려면 미국에 살아야 한다.","음식 알레르기가 있는 사람도 지원할 수 있다."],"opts":["You can earn $30 a day.","People under 18 can apply.","Applicants must live in the United States.","People with food allergies can apply."],"r":{"ev":"9번, 11~12번 문장","s":[[9,"You can earn $30 an hour.","여러분은 시간당 30달러를 벌 수 있습니다."],[11,"You must live in the United States and be 18 years or older.","여러분은 미국에 거주해야 하고 18세 이상이어야 합니다."],[12,"You must not have any food allergies.","여러분은 어떠한 음식 알레르기도 없어야 합니다."]],"w":"11번에서 미국에 살아야 한다(must live in the United States)고 한다. 보수는 시간당 30달러(9번), 18세 이상이어야 하고(11번), 음식 알레르기는 없어야 한다(12번).","c":3,"a":"3) Applicants must live in the United States."},"h":"1972c95f55"},{"n":9,"t":"sum","q":"Candy House is looking for people to (A) new candies, and people who want the job should (B) an email by February 15.","ko":"Candy House는 새로운 사탕을 (A)할 사람들을 찾고 있으며, 그 일을 원하는 사람은 2월 15일까지 이메일을 (B)해야 한다.","oko":["(A) 팔다 / (B) 보내다","(A) 맛보다 / (B) 보내다","(A) 맛보다 / (B) 받다","(A) 만들다 / (B) 보내다","(A) 팔다 / (B) 받다"],"opts":["(A) sell / (B) send","(A) taste / (B) send","(A) taste / (B) receive","(A) make / (B) send","(A) sell / (B) receive"],"r":{"ev":"5번, 13번 문장","s":[[5,"Our company is looking for people to try new candies.","저희 회사는 새로운 사탕을 시식해 볼 사람들을 찾고 있습니다."],[13,"To apply, please send us an email to: jobs@candyhouse.com by February 15.","지원하려면, 2월 15일까지 jobs@candyhouse.com으로 이메일을 보내 주세요."]],"w":"5번에서 새로운 사탕을 시식해 볼(try) 사람을 찾고, 13번에서 지원하려면 이메일을 보내라(send)고 한다. 사탕을 팔거나 만든다는 말은 없고, 받는 쪽은 회사이다.","c":2,"a":"2) (A) taste / (B) send"},"h":"d0222481bf"},{"n":10,"t":"fill","q":"People who have a sweet [A] can apply, but they must not have any food [B].","ko":"단것을 좋아하는 [A]을 가진 사람은 지원할 수 있지만, 어떠한 음식 [B]도 없어야 한다.","bank":["tooth","allergies","perfect","send","address","thoughts"],"bko":{"tooth":"이, 치아","allergies":"알레르기","perfect":"완벽한","send":"보내다","address":"주소","thoughts":"생각"},"r":{"ev":"10번, 12번 문장","s":[[10,"Anyone who has a sweet tooth for candy can apply.","단것을 좋아하는 사람은 누구나 지원할 수 있습니다."],[12,"You must not have any food allergies.","여러분은 어떠한 음식 알레르기도 없어야 합니다."]],"w":"10번에서 have a sweet tooth(단것을 좋아하다)가 지원 조건이고, 12번에서 must not have any food allergies(음식 알레르기가 없어야 함)라고 한다. perfect(완벽한), send(보내다), address(주소), thoughts(생각)는 빈칸 자리에 넣으면 뜻이 맞지 않는다.","c":null,"a":"[A] tooth, [B] allergies"},"h":"3f4a0fd84d"}]},{"u":10,"id":"rg1-10-3","no":3,"ko":"넘어져도 터지는 에어백, 이번엔 청바지에?","items":[{"n":1,"t":"tf","q":"Many injuries from serious motorcycle accidents happen to the lower body.","ko":"심각한 오토바이 사고로 인한 많은 부상은 하반신에 발생한다.","r":{"ev":"4번 문장","s":[[4,"Many injuries from serious motorcycle accidents happen to the lower body.","심각한 오토바이 사고로 인한 많은 부상은 하반신에 발생한다."]],"w":"4번 문장과 같은 내용이다. 부상이 많이 생기는 곳이 lower body(하반신)이다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"b2063295eb"},{"n":2,"t":"tf","q":"Most motorcycle pants protect the tailbone.","ko":"대부분의 오토바이용 바지는 꼬리뼈를 보호한다.","r":{"ev":"5~6번 문장","s":[[5,"So, most motorcycle pants usually protect the knees and hips.","그래서 대부분의 오토바이용 바지는 보통 무릎과 엉덩이를 보호한다."],[6,"But the airbag jeans help protect new areas on the lower body, especially the tailbone.","하지만 에어백 청바지는 하반신의 새로운 부분, 특히 꼬리뼈를 보호하는 데 도움을 준다."]],"w":"5번에서 대부분의 오토바이용 바지는 무릎과 엉덩이를 보호한다고 한다. 꼬리뼈는 6번에서 에어백 청바지가 새로 보호하는 부분이다.","c":"F","a":"F (본문과 다른 내용)"},"h":"7a12588487"},{"n":3,"t":"tf","q":"The airbag jeans are made from very strong denim.","ko":"에어백 청바지는 아주 튼튼한 데님으로 만들어진다.","r":{"ev":"7번 문장","s":[[7,"These jeans are made from the strongest denim in the world.","이 청바지는 세상에서 가장 튼튼한 데님으로 만들어진다."]],"w":"7번 문장에서 이 청바지는 세상에서 가장 튼튼한 데님(the strongest denim)으로 만들어진다고 한다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"68e1d218ad"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Motorcycle riders can have serious accidents.)","ko":"밑줄 친 단어의 뜻은? (오토바이 운전자는 ... 사고를 당할 수 있다.)","opts":["재미있는","심각한","작은","새로운"],"word":"serious","r":{"ev":"2번 문장","s":[[2,"Motorcycle riders can have serious accidents.","오토바이 운전자는 심각한 사고를 당할 수 있다."]],"w":"2번은 1번의 ‘훨씬 더 위험하다’를 이어서 크게 다치는 사고를 말한다. serious = 심각한.","c":2,"a":"2) 심각한"},"h":"1ecf894dd7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…help protect new areas on the lower body, especially the tailbone.)","ko":"밑줄 친 단어의 뜻은? (하반신의 새로운 부분, ... 꼬리뼈를 보호하는 데 도움을 준다.)","opts":["가끔","거의","이미","특히"],"word":"especially","r":{"ev":"6번 문장","s":[[6,"But the airbag jeans help protect new areas on the lower body, especially the tailbone.","하지만 에어백 청바지는 하반신의 새로운 부분, 특히 꼬리뼈를 보호하는 데 도움을 준다."]],"w":"6번에서 새로운 부분 가운데 가장 중요하게 꼬리뼈를 짚어 말한다. especially = 특히.","c":4,"a":"4) 특히"},"h":"25100c5210"},{"n":6,"t":"ref","opts":["에어백 청바지","오토바이들","일반 바지들","사고들"],"ko":"밑줄 친 them이 가리키는 것은?","q":"What does the underlined \"them\" refer to?\nRiders can also use them many times!","sko":"운전자들은 또한 그것을 여러 번 사용할 수 있다!","r":{"ev":"11~12번 문장","s":[[11,"The airbag jeans help keep riders safe, and are as comfortable as regular pants.","에어백 청바지는 운전자들을 안전하게 지켜 주고, 일반 바지만큼 편하다."],[12,"Riders can also use them many times!","운전자들은 또한 그것을 여러 번 사용할 수 있다!"]],"w":"11번의 주어가 The airbag jeans이고, 12번에서 그것(them)을 여러 번 쓸 수 있다고 한다. 일반 바지는 비교 대상으로만 나온다.","c":1,"a":"1) 에어백 청바지"},"h":"302ca90243"},{"n":7,"t":"sense","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["그리고 가장 위험한 부분은 에어백이 안에 있다는 것이다!","그리고 에어백은 가장 좋은 부분만 보호한다!","그리고 가장 좋은 점은 이것이다. 청바지 안에 에어백이 들어 있다!","그리고 가장 좋은 부분은 청바지 바깥에 에어백을 붙이는 것이다!"],"q":"Which is the best meaning of the sentence?\n\"And here’s the best part: They have airbags inside!\"","sko":"그리고 가장 우수한 점은 이것이다. 그 안에 에어백이 있다는 것!","r":{"ev":"8번 문장","s":[[8,"And here’s the best part: They have airbags inside!","그리고 가장 우수한 점은 이것이다. 그 안에 에어백이 있다는 것!"]],"w":"here’s the best part는 ‘가장 좋은 점은 이것이다’라는 뜻이고, 그 내용은 They have airbags inside(안에 에어백이 있다)이다. 위험하다는 말이나 바깥에 붙인다는 말은 없다.","c":3,"a":"3) 그리고 가장 좋은 점은 이것이다. 청바지 안에 에어백이 들어 있다!"},"h":"410c5ce7b1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["에어백 청바지는 무릎과 엉덩이만 보호한다.","청바지 안의 에어백은 운전자가 오토바이에서 떨어지면 터진다.","에어백 청바지는 일반 바지보다 덜 편하다.","에어백 청바지는 한 번만 쓸 수 있다."],"opts":["Airbag jeans protect only the knees and hips.","The airbags in the jeans blow up when a rider falls off a motorcycle.","Airbag jeans are less comfortable than regular pants.","Airbag jeans can be used only one time."],"r":{"ev":"5~6번, 9번, 11~12번 문장","s":[[5,"So, most motorcycle pants usually protect the knees and hips.","그래서 대부분의 오토바이용 바지는 보통 무릎과 엉덩이를 보호한다."],[6,"But the airbag jeans help protect new areas on the lower body, especially the tailbone.","하지만 에어백 청바지는 하반신의 새로운 부분, 특히 꼬리뼈를 보호하는 데 도움을 준다."],[9,"If a rider falls off his motorcycle, the airbags blow up.","만약 운전자가 자신의 오토바이에서 떨어지면, 에어백이 터진다."],[11,"The airbag jeans help keep riders safe, and are as comfortable as regular pants.","에어백 청바지는 운전자들을 안전하게 지켜 주고, 일반 바지만큼 편하다."],[12,"Riders can also use them many times!","운전자들은 또한 그것을 여러 번 사용할 수 있다!"]],"w":"9번에서 운전자가 오토바이에서 떨어지면 에어백이 터진다고 한다. 에어백 청바지는 꼬리뼈도 보호하고(6번), 일반 바지만큼 편하며(11번), 여러 번 쓸 수 있다(12번).","c":2,"a":"2) The airbags in the jeans blow up when a rider falls off a motorcycle."},"h":"0b06cecaf0"},{"n":9,"t":"sum","q":"The airbags in the jeans (A) when a rider falls off, so they help riders stay (B).","ko":"청바지 속 에어백은 운전자가 떨어질 때 (A)해서, 운전자가 (B) 있도록 도와준다.","oko":["(A) 사라져서 / (B) 다친 채로","(A) 터져서 / (B) 화난 채로","(A) 녹아서 / (B) 안전하게","(A) 사라져서 / (B) 안전하게","(A) 터져서 / (B) 안전하게"],"opts":["(A) disappear / (B) hurt","(A) blow up / (B) angry","(A) melt / (B) safe","(A) disappear / (B) safe","(A) blow up / (B) safe"],"r":{"ev":"9~11번 문장","s":[[9,"If a rider falls off his motorcycle, the airbags blow up.","만약 운전자가 자신의 오토바이에서 떨어지면, 에어백이 터진다."],[10,"These airbags protect the rider from getting hurt.","이 에어백들은 운전자가 다치지 않도록 보호해 준다."],[11,"The airbag jeans help keep riders safe, and are as comfortable as regular pants.","에어백 청바지는 운전자들을 안전하게 지켜 주고, 일반 바지만큼 편하다."]],"w":"9번에서 운전자가 떨어지면 에어백이 터지고(blow up), 10~11번에서 에어백이 운전자를 다치지 않게 보호해 안전하게(safe) 지켜 준다. disappear나 melt는 본문에 맞지 않는 말이다.","c":5,"a":"5) (A) blow up / (B) safe"},"h":"36538407f2"},{"n":10,"t":"fill","q":"The airbag jeans protect new areas of the lower body, especially the [A], and are made from the strongest [B] in the world.","ko":"에어백 청바지는 하반신의 새로운 부분, 특히 [A]을 보호하고, 세상에서 가장 튼튼한 [B]으로 만들어진다.","bank":["tailbone","denim","knees","pants","hips","accidents"],"bko":{"tailbone":"꼬리뼈","denim":"데님(청바지 천)","knees":"무릎","pants":"바지","hips":"엉덩이","accidents":"사고들"},"r":{"ev":"6~7번 문장","s":[[6,"But the airbag jeans help protect new areas on the lower body, especially the tailbone.","하지만 에어백 청바지는 하반신의 새로운 부분, 특히 꼬리뼈를 보호하는 데 도움을 준다."],[7,"These jeans are made from the strongest denim in the world.","이 청바지는 세상에서 가장 튼튼한 데님으로 만들어진다."]],"w":"6번에서 새로운 부분, 특히 꼬리뼈(tailbone)를 보호한다고 하고, 7번에서 가장 튼튼한 데님(denim)으로 만든다고 한다. 무릎(knees)과 엉덩이(hips)는 일반 바지도 보호하는 부분(5번)이라 ‘새로운 부분’이 아니다.","c":null,"a":"[A] tailbone, [B] denim"},"h":"e10cac9f73"}]},{"u":11,"id":"rg1-11-1","no":1,"ko":"일주일 뒤면 사라지는 공항이 있다고?","items":[{"n":1,"t":"tf","q":"Black Rock City Airport only shows up for one week every year.","ko":"Black Rock City 공항은 매년 일주일 동안만 나타난다.","r":{"ev":"2번 문장","s":[[2,"It only shows up for one week every year.","그곳은 매년 일주일 동안만 나타난다."]],"w":"2번 문장과 같은 내용이다. only … for one week every year(매년 일주일만)가 그대로 나온다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"67c7ead150"},{"n":2,"t":"tf","q":"The airport has a big control tower and big buildings.","ko":"그 공항에는 큰 관제탑과 큰 건물들이 있다.","r":{"ev":"4~5번 문장","s":[[4,"Unlike other airports, it doesn’t have big buildings or a control tower.","다른 공항들과 달리, 그곳에는 큰 건물이나 관제탑이 없다."],[5,"This airport only has a simple runway.","이 공항에는 간소한 활주로만 있다."]],"w":"4번에서 다른 공항들과 달리 큰 건물이나 관제탑이 없다고 하고, 5번에서 간소한 활주로만 있다고 한다.","c":"F","a":"F (본문과 다른 내용)"},"h":"84d71f4c95"},{"n":3,"t":"tf","q":"About 70,000 people from all over the world come to the festival.","ko":"전 세계에서 약 7만 명의 사람들이 그 축제에 온다.","r":{"ev":"9번 문장","s":[[9,"About 70,000 people from all over the world come to join.","전 세계에서 약 7만 명의 사람들이 참여하기 위해 온다."]],"w":"9번 문장과 같은 내용이다. About 70,000 people from all over the world이 그대로 나온다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"792149d3d8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is a huge festival of art, music, and culture.)","ko":"밑줄 친 단어의 뜻은? (이것은 예술, 음악, 문화의 ... 축제이다.)","opts":["작은","거대한","오래된","조용한"],"word":"huge","r":{"ev":"8~9번 문장","s":[[8,"This is a huge festival of art, music, and culture.","이것은 예술, 음악, 그리고 문화의 거대한 축제이다."],[9,"About 70,000 people from all over the world come to join.","전 세계에서 약 7만 명의 사람들이 참여하기 위해 온다."]],"w":"8번 뒤 9번에서 전 세계 약 7만 명이 온다고 한다. 그만큼 큰 축제이므로 huge = 거대한.","c":2,"a":"2) 거대한"},"h":"0ae9c70e96"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…but they can get stuck in heavy traffic.)","ko":"밑줄 친 단어의 뜻은? (…하지만 그들은 극심한 교통 체증 속에 ... 수 있다.)","opts":["빠르게 달리는","즐거워하는","길을 안내하는","꼼짝 못 하게 갇힌"],"word":"stuck","r":{"ev":"10~11번 문장","s":[[10,"Some visitors come in cars, but they can get stuck in heavy traffic.","일부 방문객들은 자가용으로 오지만, 그들은 극심한 교통 체증 속에 갇힐 수 있다."],[11,"So, some people fly to the desert with small jets!","그래서 몇몇 사람들은 작은 제트기로 그 사막에 날아온다!"]],"w":"10번에서 교통 체증(heavy traffic) 때문에 움직이지 못하는 상황이고, 11번에서 그래서(So) 제트기로 날아온다. get stuck = 꼼짝 못 하게 되다.","c":4,"a":"4) 꼼짝 못 하게 갇힌"},"h":"0de73747e8"},{"n":6,"t":"ref","opts":["Black Rock City 공항의 직원들","축제를 여는 예술가들","사막의 모든 방문객들","작은 제트기로 오는 몇몇 사람들"],"ko":"밑줄 친 they가 가리키는 것은?","q":"What does the underlined \"they\" refer to?\nThat’s why they need an airport.","sko":"그것이 그들이 공항을 필요로 하는 이유이다.","r":{"ev":"11~12번 문장","s":[[11,"So, some people fly to the desert with small jets!","그래서 몇몇 사람들은 작은 제트기로 그 사막에 날아온다!"],[12,"That’s why they need an airport.","그것이 그들이 공항을 필요로 하는 이유이다."]],"w":"12번 That’s why 바로 앞인 11번에서 몇몇 사람들(some people)이 작은 제트기로 사막에 날아온다고 한다. 이 사람들이 공항을 필요로 한다.","c":4,"a":"4) 작은 제트기로 오는 몇몇 사람들"},"h":"ed1748d70c"},{"n":7,"t":"sense","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["축제가 끝나면, 그 공항은 마법처럼 사라진다.","축제가 시작되면, 그 공항은 마법처럼 나타난다.","축제가 끝나도, 그 공항은 마법처럼 계속 남아 있다.","축제가 끝나면, 마법사들이 공항을 청소한다."],"q":"Which is the best meaning of the sentence?\n\"When the festival is over, the airport disappears like magic.\"","sko":"축제가 끝나면, 그 공항은 마법처럼 사라진다.","r":{"ev":"13번 문장","s":[[13,"When the festival is over, the airport disappears like magic.","축제가 끝나면, 그 공항은 마법처럼 사라진다."]],"w":"When the festival is over는 ‘축제가 끝나면’이고, disappears like magic은 ‘마법처럼 사라진다’이다. 계속 남아 있거나 마법사가 나온다는 말은 없다.","c":1,"a":"1) 축제가 끝나면, 그 공항은 마법처럼 사라진다."},"h":"a7cbf85fee"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["그 공항에는 큰 관제탑이 있다.","그 공항은 내년에 다시 나타날 것이다.","그 공항은 일 년 내내 열려 있다.","그 축제는 소수의 방문객만 오는 작은 행사이다."],"opts":["The airport has a big control tower.","The airport will show up again next year.","The airport is open all year.","The festival is a small event with only a few visitors."],"r":{"ev":"2번, 4번, 9번, 14번 문장","s":[[2,"It only shows up for one week every year.","그곳은 매년 일주일 동안만 나타난다."],[4,"Unlike other airports, it doesn’t have big buildings or a control tower.","다른 공항들과 달리, 그곳에는 큰 건물이나 관제탑이 없다."],[9,"About 70,000 people from all over the world come to join.","전 세계에서 약 7만 명의 사람들이 참여하기 위해 온다."],[14,"But it’ll show up again next year for more fun and adventure!","하지만 그곳은 더 많은 재미와 모험을 위해 내년에 다시 나타날 것이다!"]],"w":"14번에서 공항은 내년에 다시 나타날 것(it’ll show up again next year)이라고 한다. 관제탑은 없고(4번), 일주일만 나타나며(2번), 약 7만 명이 오는 큰 축제이다(9번).","c":2,"a":"2) The airport will show up again next year."},"h":"ec8ed59c77"},{"n":9,"t":"sum","q":"The airport shows up in the desert for (A) every year because of a festival, and it (B) when the festival is over.","ko":"그 공항은 축제 때문에 매년 (A) 동안 사막에 나타나며, 축제가 끝나면 (B).","oko":["(A) 1년 / (B) 사라진다","(A) 일주일 / (B) 커진다","(A) 한 달 / (B) 사라진다","(A) 1년 / (B) 계속 남는다","(A) 일주일 / (B) 사라진다"],"opts":["(A) one year / (B) disappears","(A) one week / (B) grows","(A) one month / (B) disappears","(A) one year / (B) stays","(A) one week / (B) disappears"],"r":{"ev":"2번, 13번 문장","s":[[2,"It only shows up for one week every year.","그곳은 매년 일주일 동안만 나타난다."],[13,"When the festival is over, the airport disappears like magic.","축제가 끝나면, 그 공항은 마법처럼 사라진다."]],"w":"2번에서 공항은 매년 일주일(one week) 동안만 나타나고, 13번에서 축제가 끝나면 사라진다(disappears). 나머지 선지는 기간이나 결과가 본문과 다르다.","c":5,"a":"5) (A) one week / (B) disappears"},"h":"f99695fbb6"},{"n":10,"t":"fill","q":"Some visitors come in [A], but they can get stuck in heavy [B].","ko":"일부 방문객들은 [A]을 타고 오지만, 극심한 [B]에 갇힐 수 있다.","bank":["cars","traffic","adventure","tower","runway","magic"],"bko":{"cars":"자동차들","traffic":"교통, 교통량","adventure":"모험","tower":"탑","runway":"활주로","magic":"마법"},"r":{"ev":"10번 문장","s":[[10,"Some visitors come in cars, but they can get stuck in heavy traffic.","일부 방문객들은 자가용으로 오지만, 그들은 극심한 교통 체증 속에 갇힐 수 있다."]],"w":"10번에서 일부 방문객은 자가용(cars)으로 오지만 극심한 교통 체증(heavy traffic)에 갇힐 수 있다. adventure(모험), tower(탑), runway(활주로), magic(마법)은 빈칸 자리에 넣으면 뜻이 맞지 않는다.","c":null,"a":"[A] cars, [B] traffic"},"h":"eee4552beb"}]},{"u":11,"id":"rg1-11-2","no":2,"ko":"얼음으로 만든 바이올린, 연주할 수 있을까?","items":[{"n":1,"t":"tf","q":"Tim Linhart got the idea for ice instruments from a friend who makes guitars.","ko":"Tim Linhart는 기타를 만드는 친구에게서 얼음 악기에 대한 아이디어를 얻었다.","r":{"ev":"3번 문장","s":[[3,"Tim first got the idea from a friend who makes guitars.","Tim은 기타를 만드는 친구로부터 그 아이디어를 처음 얻었다."]],"w":"3번 문장에서 Tim은 기타를 만드는 친구(a friend who makes guitars)로부터 그 아이디어를 처음 얻었다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"1520ea8dc7"},{"n":2,"t":"tf","q":"Tim’s orchestra has only one kind of ice instrument.","ko":"Tim의 오케스트라에는 한 종류의 얼음 악기만 있다.","r":{"ev":"6번 문장","s":[[6,"Now, Tim’s orchestra has many ice instruments like violins, cellos, drums, and so on.","이제, Tim의 오케스트라는 바이올린, 첼로, 드럼 등과 같은 많은 얼음 악기를 가지고 있다."]],"w":"6번에서 바이올린, 첼로, 드럼 등 여러 얼음 악기(many ice instruments)가 있다고 한다.","c":"F","a":"F (본문과 다른 내용)"},"h":"0cc71d82a9"},{"n":3,"t":"tf","q":"Tim loves the sound of ice music.","ko":"Tim은 얼음 음악의 소리를 아주 좋아한다.","r":{"ev":"7번 문장","s":[[7,"He loves the unique, sharp sound of ice music.","그는 얼음 음악의 독특하고 날카로운 소리를 아주 좋아한다."]],"w":"7번 문장에서 그는 얼음 음악의 독특하고 날카로운 소리를 아주 좋아한다(loves)고 한다.","c":"T","a":"T (본문과 맞는 내용)"},"h":"6493be0980"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He loves the unique, sharp sound of ice music.)","ko":"밑줄 친 단어의 뜻은? (그는 얼음 음악의 ... 날카로운 소리를 아주 좋아한다.)","opts":["평범한","독특한","시끄러운","낡은"],"word":"unique","r":{"ev":"7번 문장","s":[[7,"He loves the unique, sharp sound of ice music.","그는 얼음 음악의 독특하고 날카로운 소리를 아주 좋아한다."]],"w":"7번에서 Tim이 특히 좋아하는 얼음 음악의 소리를 소개하는 말이다. 다른 악기와 다른 소리이므로 unique = 독특한.","c":2,"a":"2) 독특한"},"h":"698b6ca6e2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They can even melt from people’s body heat or breath.)","ko":"밑줄 친 단어의 뜻은? (그것들은 심지어 사람들의 체온이나 숨결로 인해 ... 수도 있다.)","opts":["얼다","깨지다","녹다","사라지다"],"word":"melt","r":{"ev":"10번 문장","s":[[10,"They can even melt from people’s body heat or breath.","그것들은 심지어 사람들의 체온이나 숨결로 인해 녹을 수도 있다."]],"w":"10번에서 체온이나 숨결(body heat or breath)은 따뜻한 것이다. 얼음이 따뜻한 것에 닿으면 녹으므로 melt = 녹다. 깨지다는 9번의 break이다.","c":3,"a":"3) 녹다"},"h":"3f3baf10e9"},{"n":6,"t":"ref","opts":["Tim의 친구들","눈과 물","기타들","얼음 악기들"],"ko":"밑줄 친 them이 가리키는 것은?","q":"What does the underlined \"them\" refer to?\nSo, in order to make them, he used ice and a special mix of snow and water.","sko":"그래서 그것들을 만들기 위해, 그는 얼음과 눈과 물이 섞인 특별한 혼합물을 사용했다.","r":{"ev":"4~5번 문장","s":[[4,"He wondered how music would sound on ice instruments.","그는 얼음 악기에서는 음악이 어떻게 들릴지 궁금했다."],[5,"So, in order to make them, he used ice and a special mix of snow and water.","그래서 그것들을 만들기 위해, 그는 얼음과 눈과 물이 섞인 특별한 혼합물을 사용했다."]],"w":"4번에서 궁금해한 얼음 악기(ice instruments)를 5번에서 만들기 위해 얼음과 눈과 물을 사용했다. 그래서 them = 얼음 악기들이다.","c":4,"a":"4) 얼음 악기들"},"h":"f3bbc69661"},{"n":7,"t":"sense","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["하지만 연주자들은 조심해야 한다.","그래서 연주자들은 연주를 멈춰야 한다.","하지만 연주자들은 더 빨리 연주해야 한다.","그래서 연주자들은 얼음을 모아야 한다."],"q":"Which is the best meaning of the sentence?\n\"However, the players need to be careful.\"","sko":"하지만 연주자들은 조심해야 한다.","r":{"ev":"7~8번 문장","s":[[7,"He loves the unique, sharp sound of ice music.","그는 얼음 음악의 독특하고 날카로운 소리를 아주 좋아한다."],[8,"However, the players need to be careful.","하지만 연주자들은 조심해야 한다."]],"w":"However는 ‘하지만’이고 need to be careful은 ‘조심해야 한다’이다. 앞 문장(7번)의 좋은 점과 반대되는 조심할 점을 말한다.","c":1,"a":"1) 하지만 연주자들은 조심해야 한다."},"h":"72c0736cee"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["얼음 악기는 녹지 않는다.","Tim은 바이올린 연주자에게서 얼음 음악 아이디어를 얻었다.","Tim은 스웨덴의 얼음 예술가이다.","Tim은 나무로 악기를 만들었다."],"opts":["Ice instruments cannot melt.","Tim got the idea for ice music from a violin player.","Tim is a Swedish ice artist.","Tim used wood to make the instruments."],"r":{"ev":"2~3번, 5번, 10번 문장","s":[[2,"A Swedish ice artist, Tim Linhart, turned this dream into a reality!","스웨덴의 얼음 예술가 T endar has (A) months in a year, and Ethiopians start counting time from (B).","ko":"에티오피아의 달력은 1년에 (A)개의 달이 있고, 에티오피아 사람들은 (B)부터 시간을 세기 시작한다.","oko":["(A) 12 / (B) 오전 12시","(A) 13 / (B) 오전 12시","(A) 12 / (B) 오전 6시","(A) 13 / (B) 오후 6시","(A) 13 / (B) 오전 6시"],"opts":["(A) 12 / (B) 12:00 a.m.","(A) 13 / (B) 12:00 a.m.","(A) 12 / (B) 6:00 a.m.","(A) 13 / (B) 6:00 p.m.","(A) 13 / (B) 6:00 a.m."],"r":{"ev":"2번, 9번 문장","s":[[2,"The Ethiopian calendar has 13 months in a year instead of 12!","에티오피아의 달력은 1년에 12달 대신 13달을 가지고 있다!"],[9,"They start counting time from 6:00 a.m., not 12:00 a.m.","그들은 오전 12시가 아닌 오전 6시부터 시간을 세기 시작한다."]],"w":"2번에서 에티오피아의 달력은 13개의 달을 가지고 있고, 9번에서 오전 12시가 아닌 오전 6시부터 시간을 세기 시작한다. 12개의 달과 오전 12시는 우리 방식이다.","c":5,"a":"5) (A) 13 / (B) 6:00 a.m."},"h":"21d0f1fdd4"},{"n":10,"t":"fill","q":"In Ethiopia, the first 12 months each have [A] days, and the 13th month has only five or [B] days.","ko":"에티오피아에서 처음 12개의 달은 각각 [A]일이고, 13번째 달은 5일 또는 [B]일만 있다.","bank":["thirty","six","twelve","thirteen","seven","twenty"],"bko":{"thirty":"서른(30)","six":"여섯(6)","twelve":"열둘(12)","thirteen":"열셋(13)","seven":"일곱(7)","twenty":"스물(20)"},"r":{"ev":"3번, 5번 문장","s":[[3,"The first 12 months each have 30 days.","처음 12개의 달은 각각 30일을 가지고 있다."],[5,"It only has five or six days.","그것은 5일 또는 6일만 가지고 있다."]],"w":"3번에서 처음 12개의 달은 각각 30일(thirty)이고, 5번에서 13번째 달은 5일 또는 6일(six)이다. twelve, thirteen은 달의 개수이고, seven과 twenty는 본문에 나오지 않는다.","c":null,"a":"[A] thirty, [B] six"},"h":"843b35343f"}]},{"u":12,"id":"rg1-12-2","no":2,"ko":"전화는 안 걸지만, 쓸모는 더 커진 빨간 박스","items":[{"n":1,"t":"tf","q":"In the U.K., people use red phone boxes mainly for calls now.","ko":"영국에서 사람들은 이제 주로 전화를 하려고 빨간 공중전화 박스를 사용한다.","r":{"ev":"2~3번 문장","s":[[2,"Now, people don’t use them for calls.","이제, 사람들은 전화를 하기 위해 그것들을 사용하지 않는다."],[3,"Instead, they found new ways to use these old phone boxes.","대신, 그들은 이 오래된 공중전화 박스를 활용할 수 있는 새로운 방법을 찾았다."]],"w":"2번에서 이제 사람들은 전화를 하기 위해 공중전화 박스를 사용하지 않는다고 한다. 3번에서 대신 새로운 사용 방법을 찾았다고 한다.","c":"F","a" 라졌고(disappeared), 8~9번에서 과학자들은 그 색을 만드는 데 사용된 식물(plant)을 찾아냈으며, 11번에서 재현에 성공했다. 화가나 값 이야기는 본문에 없다.","c":5,"a":"5) (A) disappeared / (B) plant"},"h":"8a22909387"},{"n":10,"t":"fill","q":"Scientists looked into old [A] from the 1400s for hints and did many [B] with old recipes.","ko":"과학자들은 힌트를 찾으려고 1400년대의 오래된 [A]을 조사했고 옛 제조법으로 많은 [B]을 했다.","bank":["books","experiments","hints","village","labs","plant"],"bko":{"books":"책들","experiments":"실험들","hints":"힌트들","village":"마을","labs":"실험실들","plant":"식물"},"r":{"ev":"7번, 10번 문장","s":[[7,"So they looked into old books from the 1400s for hints.","그래서 그들은 힌트를 찾기 위해 1400년대의 오래된 책들을 조사했다."],[10,"In their labs, the scientists did many experiments with old recipes from the books.","그들의 실험실에서, 과학자들은 책에서 얻은 옛 제조법으로 많은 실험을 했다."]],"w":"7번에서 힌트를 찾으려고 1400년대의 오래된 책들(books)을 조사했고, 10번에서 옛 제조법으로 많은 실험(experiments)을 했다. hints(힌트들), labs(실험실들), plant(식물), village(마을)는 빈칸 자리에 넣으면 뜻이 맞지 않는다.","c":null,"a":"[A] books, [B] experiments"},"h":"7f0a4af119"}]}];

function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
