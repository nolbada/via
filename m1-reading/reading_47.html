<style>

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"Hi! I’m Hyunsu.","ko":"안녕! 나는 현수야.","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"Last summer, my friends and I make our own adventure game, “The Lost Island.”","ko":"지난여름, 내 친구들과 나는 우리만의 모험 게임인 ‘잃어버린 섬’을 만들었어.","ok":false,"foot":[],"fixes":[{"wrong":"make","right":"made","partial":false,"at":[6],"point":"시제: Last summer(지난여름)는 과거를 나타내므로 동사도 과거형 made 사용","topic":"시제","memo":"Last summer(지난여름)는 과거를 나타내므로 동사도 과거형 made 사용"}]},{"n":3,"tag":null,"en":"We worked together like a team.","ko":"우리는 팀으로서 함께 일했어.","ok":false,"foot":[],"fixes":[{"wrong":"like","right":"as","partial":false,"at":[3],"point":"어휘: as(~로서, 자격을 나타냄)와 like(~처럼, 유사함을 나타냄)의 혼동 — 팀의 일원으로서 일했다는 의미이므로 as 사용","topic":"어휘","memo":"as(~로서, 자격을 나타냄)와 like(~처럼, 유사함을 나타냄)의 혼동 — 팀의 일원으로서 일했다는 의미이므로 as 사용"}]},{"n":4,"tag":"STEP 1 · Story-making","en":"First, I writed a story. The story begins like this:","ko":"우선, 나는 이야기를 썼어. 이야기는 이와 같이 시작돼:","ok":false,"foot":[],"fixes":[{"wrong":"writed","right":"wrote","partial":false,"at":[2],"point":"불규칙 동사의 과거형: write - wrote - written (writed는 잘못된 규칙 변화형)","topic":"불규칙 동사의 과거형","memo":"write - wrote - written (writed는 잘못된 규칙 변화형)"}]},{"n":5,"tag":null,"en":"One day you wake up on an island.","ko":"어느 날 당신은 섬에서 깨어납니다.","ok":true,"foot":[],"fixes":[]},{"n":6,"tag":null,"en":"There is much monsters on the island.","ko":"그 섬에는 많은 괴물들이 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[1],"point":"수일치: 주어 monsters(복수)에 맞춰 동사 are 사용","topic":"수일치","memo":"주어 monsters(복수)에 맞춰 동사 are 사용"},{"wrong":"much","right":"many","partial":false,"at":[2],"point":"수량형용사: 가산명사 복수형 monsters 앞에는 many 사용 (much는 불가산명사 앞에 사용)","topic":"수량형용사","memo":"가산명사 복수형 monsters 앞에는 many 사용 (much는 불가산명사 앞에 사용)"}]},{"n":7,"tag":null,"en":"You goes through a high mountain, a long river, and an giant tower.","ko":"당신은 높은 산, 긴 강, 그리고 거대한 탑을 거쳐 갑니다.","ok":false,"foot":[],"fixes":[{"wrong":"goes","right":"go","partial":false,"at":[1],"point"
