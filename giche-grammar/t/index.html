Q('pp37','인왕 2019 2학기 기말','다음 한글 문장을 영어 문장으로 바꿨을 때 문법적으로 가장 자연스러운 것은?',['He has already finish his homework.','He already has finish his homework.','He has already finished his homework.','He have already finished his homework.','He already have finished his homework.'],[2],[
X('그는 이미 숙제를 끝마쳤다.','has 뒤에는 과거분사(p.p.)! finish가 아니라 finished. → has already finished (finish 끝내다)'),
X('그는 이미 숙제를 끝마쳤다.','already는 has와 p.p. 사이에 와요. 그리고 finish가 아니라 finished. → He has already finished ~.'),
O('그는 이미 숙제를 끝마쳤다.','주어 He(3인칭 단수) + has + already + finished(p.p.). 순서가 딱 맞아요.'),
X('그는 이미 숙제를 끝마쳤다.','He는 3인칭 단수라서 have가 아니라 has! → He has already finished ~.'),

Q('pp38','인왕 2019 2학기 기말','다음 빈칸에 들어갈 말이 알맞게 짝지어진 것은?',['lived – lived','lived – have lived','lived – have living','have lived – have lived','have lived – have living'],[1],[
X('2015년에 살았다 / 3년 동안 살았다','두 번째 칸은 for three years(3년 동안)라서 지금까지 이어지는 현재완료가 필요해요. → have lived'),
O('2015년에 살았다 / 3년 동안 살아 왔다','in 2015(2015년에)는 과거를 콕 집는 말이라 lived, for three years(3년 동안)는 계속이라 have lived! (live 살다)'),
X('2015년에 살았다 / 3년 동안 살고 있다','have 뒤에는 과거분사(p.p.)! living이 아니라 lived. → have lived'),
X('2015년부터 살아 왔다 / 3년 동안 살아 왔다','in 2015는 과거를 콕 집는 말이라 첫 칸은 have lived가 아니라 lived!'),
X('2015년부터 살아 왔다 / 3년 동안 살고 있다','첫 칸은 lived, 둘째 칸은 have lived가 맞아요. have 뒤에는 p.p.!')],{body:['ㆍ We _______ in this apartment in 2015.','ㆍ We _______ in this apartment for three years.']});
Q('pp39','개운 2020 2학기 기말','다음 <보기>의 두 문장을 한 문장으로 쓸 때 빈칸 (A), (B)에 들어갈 말로 짝지어진 것은?',['has moved – for','moved – since','was lived – for','have moved – since','has lived – for'],[4],[
X('그녀는 5년 동안 이사해 왔다.','move(이사하다)는 한 순간에 끝나는 동작이라 for five years와 안 맞아요. "지금도 산다"는 live(살다)로 써요.'),
X('그녀는 5년 이후로 이사했다.','지금도 산다는 뜻이 빠졌고, since 뒤에는 시작한 때가 오는데 five years는 시간의 길이예요.'),
X('was lived는 틀린 모양이에요.','live(살다)는 be + p.p.(수동)로 쓰지 않아요. → has lived'),
X('그녀는 5년 이후로 이사해 왔다.','주어 She는 has! 또 since + five years(시간의 길이)도 안 맞아요.'),
O('그녀는 부산에서 5년 동안 살아 왔다.','5년 전에 이사해서 지금도 산다 = 5년 동안 계속 산다. She + has lived + for + 시간의 길이(five years)')],{body:['<보기>','ㆍ She moved to Busan five years ago.','ㆍ And she still lives in Busan.','→ She (A)__________ in Busan (B)__________ five years.']});
Q('pp40','동주 2021 2학기 기말','다음 두 문장을 한 문장으로 표현할 때 빈칸에 들어갈 말을 순서대로 바르게 짝지은 것은?',['has known – since','knew – for','have known – since','knew – in','have known – for'],[2],[
X('나는 열 살 때부터 Daniel을 알아 왔다.','주어 I는 has가 아니라 have!'),
X('나는 열 살 때 Daniel을 알았다.','과거형 knew는 "지금도 안다"를 담지 못해요. 또 I was ten years old는 시작한 때라서 for가 아니라 since!'),
O('나는 열 살 때부터 Daniel을 알아 왔다.','지금까지 이어지니까 have known(know 알다). 뒤에 "I was ten years old"처럼 시작한 때가 오면 since!'),
X('나는 열 살 때 Daniel을 알았다.','지금도 안다는 뜻이 필요해서 현재완료 have known이 맞아요. in 뒤에는 절이 올 수 없어요.'),
X('나는 열 살 동안 Daniel을 알아 왔다.','have known은 맞지만, for 뒤에는 시간의 길이(ten years)가 와요. 시작한 때(I was ten years old)에는 since!')],{body:['‧ I knew Daniel when I was ten years old.','‧ I still know Daniel now.','→ I _______________ Daniel ____________ I was ten years old.']});
Q('pp41','구월 2023 2학기 기말','다음 두 문장을 한 문장으로 바꾸어 쓸 때, 빈칸에 들어갈 가장 옳은 말로 순서대로 짝지어진 것은?',['owned – for','owned – since','has owned – for','has owned – since','have owned – for'],[3],[
X('우리 아빠는 작년 동안 서점을 가졌다.','지금도 갖고 있다는 뜻이 빠졌고, last year는 시작한 때라서 for가 안 맞아요.'),
X('우리 아빠는 작년에 서점을 가졌다.','since는 맞지만 과거형 owned는 지금도 갖고 있다는 뜻을 못 담아요. → has owned'),
X('우리 아빠는 작년 동안 서점을 갖고 있다.','has owned는 맞지만 last year는 시간의 길이가 아니라 시작한 때예요. → since last year'),
O('우리 아빠는 작년부터 서점을 갖고 있다.','주어 My dad(3인칭 단수) + has owned(own 갖고 있다) + since + 시작한 때(last year)!'),
X('My dad는 3인칭 단수라서 have가 아니라 has!','또 last year 앞은 for가 아니라 since! → has owned ~ since last year')],{body:['My dad started to own a bookstore last year.','He still owns it.','→ My dad __________ a bookstore __________ last year.']});
Q('pp42','을지 2020 2학기 기말','다음 중 영작이 바르게 된 것은?',['Paul has been out the house since he went to the party last month.','Paul has been out of the house since he didn’t went to the party last month.','Paul hasn’t been out the house he went to the party last month ago.','Paul hasn’t been out of the house since he has gone to the party last month.','Paul hasn’t been out of the house since he went to the party last month.'],[4],[
X('Paul은 집 밖에 나가 있다는 뜻이 돼요.','"나가지 않았다"라서 부정문(hasn’t)이어야 하고, out the house가 아니라 out of the house!'),
X('didn’t went는 틀려요.','didn’t 뒤에는 동사원형! 그리고 "나가지 않았다"는 부정문이 앞 문장에 있어야 해요.'),
X('since가 빠졌어요.','"~이후로"는 since! last month ago도 어색해요(last month와 ago는 같이 안 써요). out of the house'),
X('since 뒤의 절은 과거형으로 써요.','since he has gone이 아니라 since he went! last month(지난달)는 과거를 콕 집는 말이에요.'),
O('Paul은 지난달 파티에 간 이후로 집 밖을 나가지 않았다.','hasn’t been out of the house(be 있다) + since + 과거형 절(he went to the party last month). 모두 맞아요.')],{body:['Paul은 지난달 파티에 간 이후로 집 밖을 나가지 않았다.']});
Q('pp43','풍양 2022 2학기 기말','다음 우리말 뜻과 같도록 바르게 영작한 것은?',['He knew her 10 years ago.','He knew her since he was 10.','He has known her 10 years ago.','He has known her for 10 years.','He has known her since he was 10.'],[4],[
X('그는 10년 전에 그녀를 알았다.','knew + ago는 문법은 맞지만 뜻이 달라요. 우리말은 "10살 때부터" 지금까지 아는 거예요.'),
X('since가 있는데 과거형 knew를 썼어요.','since(~부터)가 있으면 현재완료! → He has known her since he was 10.'),
X('10 years ago(10년 전에)는 과거를 콕 집는 말이라 현재완료와 못 써요.','→ He knew her 10 years ago. (know 알다)'),
X('그는 10년 동안 그녀를 알아 왔다.','문법은 맞지만 뜻이 달라요. "10살 때부터"는 시작한 때라서 for 10 years가 아니라 since he was 10!'),
O('그는 10살 때부터 그녀를 알아 왔다.','has known(know 알다) + since + 시작한 때(he was 10). 뜻과 문법이 모두 맞아요.')],{body:['그는 10살 때부터 그녀를 알았다.']});
Q('pp44','향산 2021 2학기 기말','다음 문장을 영작한 것으로 가장 적절한 것은?',['Gimpo has changed a lot after Lisa moved.','Lisa has changed much after moving to Gimpo.','Lisa moved to Gimpo before many things changed.','Many things changed after Lisa has moved to Gimpo.','Things have changed a lot since Lisa moved to Gimpo.'],[4],[
X('김포는 Lisa가 이사한 뒤에 많이 변했다.','주어가 Gimpo로 바뀌어 뜻이 달라요. 우리말의 주어는 "많은 것들"이고, "이후로"는 after가 아니라 since.'),
X('Lisa는 김포로 이사한 뒤에 많이 변했다.','변한 것은 Lisa가 아니라 "많은 것들"이에요.'),
X('Lisa는 많은 것들이 변하기 전에 김포로 이사했다.','before(~전에)라서 순서와 뜻이 달라요.'),
X('많은 것들이 Lisa가 이사한 뒤에 변했다.','"이사한 이후로 지금까지 변해 왔다"는 현재완료 + since예요. after 뒤의 절에 has moved도 어색해요. → since Lisa moved'),
O('Lisa가 김포로 이사한 이후로 많은 것들이 변했다.','Things + have changed(change 변하다) + since + 과거형 절(Lisa moved). 딱 맞아요.')],{body:['Lisa가 김포로 이사한 이후로 많은 것들이 변했다.']});

Q('pp45','인천여자 2021 2학기 기말','다음 중 내용과 어법으로 보아 가장 자연스러운 대화는?',['A: Have you gone to London? B: No. This is my first time.','A: How long have you known her? B: For more than two years.','A: Let’s go see the movie, Spider-Man. B: I’m sorry, but I have already saw it.','A: Have you read this book? B: Yes. I’ve already read the book last year.','A: When has your mom been sick? B: My mom has been sick since May 1st.'],[1],[
X('런던에 가 본 적 있니? 아니, 이번이 처음이야.','가 본 적 있는지는 have been to! have gone to는 "가 버리고 여기 없다"예요. → Have you been to London?'),
O('그녀를 얼마나 오래 알았니? 2년 넘게.','How long + have you known(know 알다) / For + 시간의 길이. 질문과 대답이 모두 자연스러워요.'),
X('스파이더맨 보러 가자. 미안, 난 이미 봤어.','have 뒤에는 p.p.! saw가 아니라 seen. → I have already seen it. (see 보다)'),
X('이 책 읽어 봤니? 응, 작년에 이미 읽었어.','last year(작년)는 과거를 콕 집는 말이라 현재완료와 못 써요. → I read the book last year.'),
X('너희 엄마는 언제 아프셨니? 5월 1일부터 아프셔.','When(언제)은 현재완료와 못 써요. 얼마나 오래 아팠는지 묻는 How long이 어울려요.')]);
Q('pp46','천안신방 2021 2학기 기말','다음 대화 중 어법상 어색한 것은?',['A: Have you ever tried skydiving? B: Yes, I have. It was really amazing.','A: How long have you lived here? B: Since 9 years.','A: Can you return my notebook now? B: I’m sorry but I can’t. I have lost it.','A: Do you know where Kate is? B: I haven’t seen Kate since last week.','A: Let’s see the movie ‘Life on the Moon’. B: I have already seen it.'],[1],[
O('스카이다이빙 해 본 적 있니? 응, 정말 멋졌어.','경험을 물으면 Yes, I have. 그다음 자세한 이야기는 과거형(was)으로 해요.'),
X('여기서 얼마나 오래 살았니? 9년 전부터.','since 뒤에는 시작한 때가 와요. 9 years는 시간의 길이라서 For 9 years! → For 9 years. (어색한 대화 = 정답)'),
O('내 공책 지금 돌려줄래? 미안, 못 줘. 잃어버렸어.','have lost(lose 잃어버리다)는 잃어버려서 지금 없다는 결과예요.'),
O('Kate가 어디 있는지 아니? 지난주부터 못 봤어.','where Kate is(간접의문문, 어디 + 주어 + 동사)와 since last week 모두 맞아요. (see 보다)'),
O('영화 보러 가자. 난 이미 봤어.','already + have seen(see 보다). 완료예요.')]);
Q('pp47','한천 2019 2학기 기말','다음 대화 중 어색한 것은?',['A: What’s wrong with you? You look sick. B: I have had a cold for a week.','A: Have you heard about Jane’s car accident? B: Yes. I have.','A: Are you still doing your homework? B: No, I have already finished my homework.','A: What is the most delicious food you have eaten? B: I’ve never tried tacos.','A: When did you first meet him? B: Five years ago. Since then, we have been best friends.'],[3],[
O('어디 아프니? 아파 보여. 일주일 동안 감기에 걸려 있어.','have had(have 걸리다) + for a week. 계속이에요.'),
O('Jane의 교통사고에 대해 들어 봤니? 응, 들어 봤어.','Have you heard(hear 듣다) ~? 에는 Yes, I have.로 답해요.'),
O('아직도 숙제하는 중이니? 아니, 이미 끝냈어.','already + have finished(finish 끝내다). 완료예요.'),
X('네가 먹어 본 가장 맛있는 음식은 뭐니? 나는 타코를 먹어 본 적이 없어.','질문은 "가장 맛있던 음식이 뭐냐"인데 대답이 먹어 본 적 없다고 해서 질문과 어긋나요. (어색한 대화 = 정답)'),
O('그를 처음 언제 만났니? 5년 전에. 그때부터 우리는 가장 친한 친구야.','When은 과거형(did)으로 묻고 Five years ago로 답해요. 그 뒤 Since then + have been(be 이다)은 계속이에요.')]);
Q('pp48','을지 2020 2학기 기말','다음 글의 빈칸에 들어갈 말이 순서대로 짝지어진 것은?',['lived – of them','lived – for them','has lived – of them','has lived – for them','have lived – of them'],[3],[
X('열 살 때부터 살았다 / 그들이 길을 잃는 것은 불가능하다(of)','since(~부터)가 있으면 현재완료 has lived! 또 impossible 뒤는 of가 아니라 for.'),
X('열 살 때부터 살았다 / 그들이 길을 잃는 것은 불가능하다','두 번째 칸은 맞지만 첫 칸이 과거형이에요. since가 있으면 has lived!'),
X('열 살 때부터 살아 왔다 / 그들이 길을 잃는 것은 불가능하다(of)','첫 칸은 맞지만 impossible은 일이 어떤지 말하니까 of가 아니라 for. (of는 kind·foolish처럼 사람 성격)'),
O('열 살 때부터 살아 왔다 / 그들이 길을 잃는 것은 불가능하다','Kelly는 3인칭 단수라 has lived(live 살다) + since. impossible은 일이 어떤지를 말해서 for them! (It = 가주어, to get lost = 진짜 주어)'),
X('Kelly는 열 살 때부터 살아 왔다 / ... (of)','Kelly는 3인칭 단수라서 have가 아니라 has! 또 impossible 뒤는 for.')],{body:['ㆍ Kelly __________ in LA since she was 10 years old.','ㆍ It is impossible __________ to get lost.'],tag:'7과 (가주어)'});
Q('pp49','을지 2020 2학기 기말','다음 빈칸에 들어갈 말이 순서대로 짝지어진 것은?',['of you – have you seen','of you – has you seen','of you – did you see','for you – have you seen','for you – did you see'],[2],[
X('너는 그를 믿다니 어리석었다. / 너는 그녀를 언제 봤니? (현재완료)','앞은 맞지만 When(언제)은 현재완료와 못 써요. → did you see'),
X('has you는 틀린 모양이에요.','you는 has가 아니라 have! 또 When이라서 did you see.'),
O('너는 그를 믿다니 어리석었다. / 너는 그녀를 언제 봤니?','foolish는 사람의 성격이라서 of you! When(언제)이 있으니 과거형 did you see(see 보다)!'),
X('foolish인데 for you / When인데 have you seen','foolish는 사람 성격이라 of you! 또 When이라서 did you see.'),
X('foolish인데 for you','뒤는 맞지만 foolish는 사람의 성격을 말하니까 for가 아니라 of! "너는 어리석다"가 말이 되면 of you.')],{body:['ㆍ It was foolish __________ to believe him.','ㆍ When __________ her?'],tag:'7과 (가주어)'});
Q('pp50','성신여자 2020 2학기 기말','다음 중 어법상 가장 적절한 문장은?',['Can you tell me what was the missing child wearing?','Don’t ask me what is Amber going to buy on her way home.','Alex wonders how many movies the director has made so far.','John couldn’t ask how Jessica’s sister was tall because he didn’t want to be rude.','I don’t know who did stole the dog which has stayed with Ann for over 10 years.'],[2],[

  var h=head();
  if(TAB==='st')h+=viewSt();else if(TAB==='qs')h+=viewQs();else if(TAB==='pr')h+=viewPr();else h+=viewHd();
  if(TAB==='pr'&&PR)h=h.replace(/<h1>.*?<\/h1><div class="tabs">.*?<\/div>(<div class="card bad">.*?<\/div>)?/s,function(m){return'<div class="noprint">'+m+'</div>'});
  $.innerHTML=h;wire();if(TAB==='pr')wirePr();
  if(TAB==='st')$.querySelectorAll('tr.row').forEach(function(r){r.onclick=function(){detail(r.dataset.n)}});
  if(TAB==='qs'){var b=document.getElementById('qall');if(b)b.onclick=loadAll}
  if(TAB==='hd')$.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){toggle(b.dataset.q)}});
}
function viewSt(){
  if(!ROSTER||!ROSTER.length)return'<div class="card msg">아직 이름을 넣고 푼 학생이 없어요.</div>';
  var h='<div class="card"><table><tr><th>이름</th><th>푼 문제</th><th>정답률</th><th>마지막으로 푼 때</th></tr>';
  ROSTER.forEach(function(s){var rate=s.a?Math.round(s.c/s.a*100):0;
    h+='<tr class="row" data-n="'+esc(s.n)+'"><td><b>'+esc(s.n)+'</b></td><td>'+s.a+' / '+NQ+'</td><td>'+(s.a?rate+'%':'-')+'</td><td class="sub">'+fmt(s.t)+'</td></tr>'});
  return h+'</table><div class="sub" style="margin-top:8px">학생 이름을 누르면 자세히 볼 수 있어요. 푼 문제 수는 마지막 결과 기준이에요.</div></div>';
}
function detail(n){
  var box=document.createElement('div');box.className='card';box.id='dt';box.innerHTML='<div class="msg">'+esc(n)+' 불러오는 중...</div>';
  var old=document.getElementById('dt');if(old)old.remove();$.appendChild(box);box.scrollIntoView({behavior:'smooth',block:'start'});
  getStu(n).then(function(S){
    var h='<b style="font-size:18px">'+esc(n)+'</b>',R=S.r||{},SS=S.s||{},T=Object.keys(TOPICS);
    T.forEach(function(t){var T0=TOPICS[t],sets=T0.sets||[QS.filter(function(q){return q.t===t}).map(function(q){return q.id})];
      sets.forEach(function(ids,k){var ok=0,an=0;ids=ids.filter(function(id){return QBY[id]});
        var d=ids.map(function(id){var r=R[id];if(r!==undefined){an++;if(r===1)ok++}return'<i class="'+(r===1?'g':r===0?'b':'')+'" title="'+id+'"></i>'}).join('');
        h+='<div style="margin-top:10px"><span class="pill">'+esc(T0.name)+(T0.sets?' 세트 '+(k+1):'')+'</span> <span class="sub">'+an+'/'+ids.length+'문제, 맞힘 '+ok+'</span><div class="dots">'+d+'</div></div>'})});
    var W=Object.keys(R).filter(function(id){return R[id]===0&&QBY[id]});
    h+='<div style="margin-top:14px"><b>지금 틀린 문제 ('+W.length+')</b></div>';
    if(!W.length)h+='<div class="msg">없어요.</div>';
    W.forEach(function(id){var q=QBY[id],s=SS[id]||{};
      h+='<div class="q"><div class="stem">'+esc(q.stem)+'</div><div class="sub">'+esc(setOf(id))+' · '+esc(q.src)+' · 시도 '+(s.n||1)+'번, 틀림 '+(s.w||1)+'번 · 정답 '+q.ans.map(function(i){return'①②③④⑤'[i]}).join(' ')+'</div></div>'});
    box.innerHTML=h;
  }).catch(function(){box.innerHTML='<div class="msg bad">불러오지 못했어요.</div>'});
}
function getStu(n){
  if(CACHE[n])return Promise.resolve(CACHE[n]);
  return post({act:'put',id:'GK|'+String(n).toLowerCase(),data:{}}).then(function(r){var S=pj(r,'st')||{r:{},s:{}};CACHE[n]=S;return S});
}
var LOADED=false;
function loadAll(){
  var b=document.getElementById('qall');if(b){b.disabled=true;b.textContent='불러오는 중...'}
  var L=(ROSTER||[]).slice(),i=0;
  (function next(){if(i>=L.length){LOADED=true;draw();return}
    var n=L[i++].n;getStu(n).catch(function(){}).then(function(){if(b)b.textContent='불러오는 중... '+i+'/'+L.length;next()})})();
}
function viewQs(){
  if(!ROSTER||!ROSTER.length)return'<div class="card msg">아직 푼 학생이 없어요.</div>';
  if(!LOADED)return'<div class="card"><div class="msg">문제별 틀린 학생 수를 보려면 모든 학생 기록을 한 번 불러와야 해요 (학생 '+ROSTER.length+'명).</div><button class="btn" id="qall">전체 불러오기</button></div>';
  var st={};QS.forEach(function(q){st[q.id]={a:0,w:0}});
  ROSTER.forEach(function(s){var S=CACHE[s.n];if(!S)return;var R=S.r||{};for(var id in R)if(st[id]){st[id].a++;if(R[id]===0)st[id].w++}});
  var L=QS.filter(function(q){return st[q.id].a>0}).sort(function(a,b){var x=st[a.id],y=st[b.id];return(y.w/y.a-x.w/x.a)||(y.w-x.w)});
  if(!L.length)return'<div class="card msg">푼 기록이 아직 없어요.</div>';
  var h='<div class="card"><table><tr><th>문제</th><th>푼 학생</th><th>틀린 학생</th></tr>';
  L.forEach(function(q){var s=st[q.id];h+='<tr><td><div class="stem">'+esc(q.stem)+'</div><div class="sub">'+esc(setOf(q.id))+' · '+esc(q.src)+(q.pre?' · '+esc(q.pre):'')+'</div></td><td>'+s.a+'명</td><td class="'+(s.w?'bad':'')+'">'+s.w+'명 ('+Math.round(s.w/s.a*100)+'%)</td></tr>'});
  return h+'</table></div>';
}
function viewHd(){
  var h='<div class="card"><div class="sub">숨긴 문제는 학생 앱에서 다음에 열 때부터 목록에서 빠져요 (이미 푼 기록은 그대로).</div>';
  QS.forEach(function(q){var off=!!CTL[q.id];
    h+='<div class="q" style="display:flex;gap:10px;align-items:flex-start"><button class="tg'+(off?' off':'')+'" data-q="'+q.id+'">'+(off?'숨김':'보임')+'</button><div><div class="stem">'+esc(q.stem)+'</div><div class="sub">'+esc(setOf(q.id))+' · '+esc(q.src)+(q.adapted?' · 윗글→우리말로 바꿈':'')+'</div></div></div>'});
  return h+'</div>';
}
function toggle(id){
  if(CTL[id])delete CTL[id];else CTL[id]=1;
  var d={hide:{v:{s:JSON.stringify(CTL)},t:Date.now()}};
  post({act:'put',id:'GK_CTL',data:d}).then(function(){ERR=''}).catch(function(){ERR='저장하지 못했어요. 다시 눌러 주세요.'}).then(draw);
  draw();
}
/* ===== 인쇄 ===== */
var PR=null,PSCH=false,PEX=false;
function pbold(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
var NUMS='①②③④⑤';
function setList(){var L=[];['gj','pp','ind','bs'].filter(function(t){return TOPICS[t]}).forEach(function(t){var T0=TOPICS[t],sets=T0.sets||[QS.filter(function(q){return q.t===t}).map(function(q){return q.id})];
  sets.forEach(function(ids,k){ids=ids.filter(function(id){return QBY[id]});L.push({t:t,k:k,name:T0.name+(T0.sets?' 세트 '+(k+1):' 전체'),ids:ids})})});return L}
function paperHead(S,kind){return '<div class="hd"><div><div class="t1">비타민 영어클리닉 · 중등 문법 기출 풀기</div><div class="t2">'+esc(S.name)+' '+kind+'</div></div><div class="nm2">학교 ________ 이름 ________ 점수 ____ / '+S.ids.length+'</div></div>'}
function ulIt(q,t){
  if(q.t!=='gj'||!/밑줄/.test(q.stem))return esc(t);
  var m=String(t).match(/\bit\b/ig),re=null;
  if(m&&m.length===1)re=/\b(it)\b/i;else if(m&&m.length>1)re=/\b(It)\b/;
  if(!re)return esc(t);
  return esc(String(t).replace(re,'\u0001$1\u0002')).replace('\u0001','<u>').replace('\u0002','</u>');
}
function paperQ(S){
  var h='<div class="paper">'+paperHead(S,'문제');
  h+='<div class="cols">';
  S.ids.forEach(function(id,i){var q=QBY[id];
    h+='<div class="pq"><span class="pn">'+(i+1)+'.</span> <span class="ps">'+esc(q.stem)+'</span>'+(PSCH?'<span class="sc">['+esc(q.src)+']</span>':'')+
      (q.multi?'<div class="mu">(정답 '+q.multi+'개를 고르세요)</div>':'')+
      (q.pre?'<div class="pp">'+esc(q.pre)+'</div>':'')+
      (q.body&&q.body.length?'<div class="pb">'+q.body.map(function(x){return'<div>'+ulIt(q,x)+'</div>'}).join('')+'</div>':'')+
      q.ch.map(function(c,j){return'<div class="pc">'+NUMS[j]+' '+ulIt(q,c)+'</div>'}).join('')+'</div>'});
  return h+'</div></div>';
}
function paperA(S){
  var h='<div class="paper an">'+paperHead(S,'정답·해설');
  h+='<div class="quick">'+S.ids.map(function(id,i){var q=QBY[id];return'<span>'+(i+1)+'번 <b>'+q.ans.map(function(a){return NUMS[a]}).join(' ')+'</b></span>'}).join('')+'</div>';
  S.ids.forEach(function(id,i){var q=QBY[id],K=KEY[id]||{a:[],c:[]};
    h+='<div class="aq"><div class="a1">'+(i+1)+'번<em>정답 '+q.ans.map(function(a){return NUMS[a]}).join(' ')+'</em>'+(PSCH?'<span class="sub" style="font-weight:400;margin-left:8px">'+esc(q.src)+'</span>':'')+'</div>';
    if(K.h)h+='<div class="key">'+esc(K.h)+'</div>';
    (K.a||[]).forEach(function(x){h+='<div class="en">'+pbold(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'});
    if(K.c&&K.c.length)h+='<div class="vb">'+K.c.map(esc).join(' · ')+'</div>';
    if(PEX&&q.ex){h+='<div class="ee">'+q.ex.map(function(e,j){
      var en=q.lab==='ch'?String(q.ch[j]).split(' → ').pop():(q.body[j]||''),w=e.w||'',p=w.indexOf('→'),fx='';
      if(p>=0){fx=w.slice(p+1).trim();w=w.slice(0,p).trim()}
      var lb=(q.lab==='body'&&e.l&&e.l!=='·')?e.l:NUMS[j];
      return'<div class="'+(e.ok?'':'x')+'">'+lb+' '+(e.ok?'○':'✕')+' '+esc(en)+(e.m?' - '+esc(e.m):'')+(w?' / '+esc(w):'')+(fx?' (고치면: '+esc(fx)+')':'')+'</div>'}).join('')+'</div>'}
    h+='</div>'});
  return h+'</div>';
}
function viewPr(){
  var L=setList();
  if(!PR){
    var h='<div class="card plist"><div class="sub" style="margin-bottom:6px">세트를 골라 인쇄 화면을 열어요. 인쇄창에서 "PDF로 저장"을 고르면 PDF 파일이 돼요.</div>';
    L.forEach(function(S,n){h+='<div class="row2"><span class="nm">'+esc(S.name)+'</span><span class="sub">'+S.ids.length+'문제</span><button class="btn" data-pr="'+n+'|q">문제지</button><button class="btn" data-pr="'+n+'|a">정답·해설지</button><button class="btn" data-pr="'+n+'|qa">문제+정답</button></div>'});
    return h+'</div>';
  }
  var S=L[PR.n],h='<div class="pbar noprint"><button class="btn" id="prb">목록으로</button><label><input type="checkbox" id="psc"'+(PSCH?' checked':'')+'> 출처 학교 표시</label><label><input type="checkbox" id="pex"'+(PEX?' checked':'')+'> 정답지에 번호별 풀이 포함</label><button class="pbtn" id="prp">인쇄 / PDF 저장</button></div>';
  if(PR.m.indexOf('q')>=0)h+=paperQ(S);
  if(PR.m.indexOf('a')>=0)h+=paperA(S);
  return h;
}
function wirePr(){
  $.querySelectorAll('[data-pr]').forEach(function(b){b.onclick=function(){var a=b.dataset.pr.split('|');PR={n:+a[0],m:a[1]};draw();window.scrollTo(0,0)}});
  var b=document.getElementById('prb');if(b)b.onclick=function(){PR=null;draw()};
  var c=document.getElementById('psc');if(c)c.onchange=function(){PSCH=c.checked;draw()};
  var e=document.getElementById('pex');if(e)e.onchange=function(){PEX=e.checked;draw()};
  var p=document.getElementById('prp');if(p)p.onclick=function(){window.print()};
}

load();
</script></body></html>
