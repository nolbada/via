를 보러 가고 싶었다. 그래서 그녀는 Emily에게 물었다, “오늘 나랑 영화 볼래?”", "ok": false, "foot": [], "fixes": [{"wrong": "seeing", "right": "to see", "partial": false, "at": [2], "point": "want + to부정사: want는 목적어로 to부정사를 씀", "topic": "want + to부정사", "memo": "want는 목적어로 to부정사를 씀"}]}, {"n": 15, "tag": null, "en": "Emily replied, “I'm sorry, but I have take a rain check. I have to go to my grandmother's house today.”", "ko": "Emily는 대답했다, “미안하지만, 난 우천 교환권을 받아야만 해. 나는 오늘 할머니 댁에 가야 해.”", "ok": false, "foot": [], "fixes": [{"wrong": "have", "right": "have to", "partial": false, "at": [6], "point": "have to: '~해야 한다'는 have to + 동사원형", "topic": "have to", "memo": "'~해야 한다'는 have to + 동사원형"}]}, {"n": 16, "tag": null, "en": "“That's okay. Let's do it another time,” said Sarah. Although Sarah was a little disappointing, she understood Emily's situation.", "ko": "“괜찮아. 다음에 보자.”라고 Sarah가 말했다. 비록 Sarah는 조금 실망했지만, 그녀는 Emily의 상황을 이해했다.", "ok": false, "foot": [], "fixes": [{"wrong": "disappointing", "right": "disappointed", "partial": false, "at": [14], "point": "감정 분사: Sarah가 '실망한' 것이므로 과거분사 disappointed", "topic": "감정 분사", "memo": "Sarah가 '실망한' 것이므로 과거분사 disappointed"}]}, {"n": 17, "tag": null, "en": "What does “take a rain check” mean? It means to refuse an offer politely but wishing to do it later.", "ko": "‘우천 교환권을 받는다’가 무엇을 의미할까? 그것은 제안을 정중하게 거절하지만 나중에 하고 싶어 한다는 것을 의미한다.", "ok": false, "foot": [], "fixes": [{"wrong": "wishing", "right": "wish", "partial": false, "at": [15], "point": "병렬 구조: to refuse ... but wish ...에서 to에 이어지는 동사원형 병렬", "topic": "병렬 구조", "memo": "to refuse ... but wish ...에서 to에 이어지는 동사원형 병렬"}]}, {"n": 18, "tag": null, "en": "The phrase “rain check” was first use at a baseball game in the 1880s. A rain check was a ticket that people got for a future game when a baseball game was canceled because rain.", "ko": "어구 ‘우천 교환권’은 1880년대에 야구 경기에서 처음 사용되었다. 우천 교환권은 비 때문에 야구 경기가 취소되었을 때 사람들이 미래의 경기를 위해 받는 표였다.", "ok": false, "foot": [], "fixes": [{"wrong": "use", "right": "used", "partial": fa 것은 제안을 정중하게 거절하지만 나중에 하고 싶어 한다는 것을 의미한다.", 0], ["The phrase “rain check” was first used at a baseball game in the 1880s.", "어구 ‘우천 교환권’은 1880년대에 야구 경기에서 처음 사용되었다.", 0], ["A rain check was a ticket that people got for a future game when a baseball game was canceled because of rain.", "우천 교환권은 비 때문에 야구 경기가 취소되었을 때 사람들이 미래의 경기를 위해 받는 표였다.", 0], ["Later, rain checks were given at other sporting events.", "이후에, 우천 교환권들이 다른 스포츠 행사들에서 주어졌다.", 0], ["Over time, “take a rain check” has been widely used to say that you can't do something now and want to do it later.", "시간이 흐르면서, ‘우천 교환권을 받는다’는 당신이 지금은 어떤 일을 할 수 없고 나중에 그것을 하고 싶다고 말하기 위해 널리 사용되어 왔다.", 0]];var RNUM=65;var TITLE_EN="Stories Behind Idioms";var PASS_EN=["Stories Behind Idioms", "Break a Leg", "It was the day of the school play. Lily practiced for the play for weeks. The curtains were about to go up, and she felt very nervous. Her friend smiled and said, “Break a leg!” Lily said, “Thanks. I will!” She got on the stage and performed successfully. Although “Break a leg!” may sound like a bad thing, it actually means “Good luck!” German actors who came to the United States in the early 20th century first used this phrase. By wishing each other bad luck, they believed that it would go away. This expression is still used today. “Break a leg” is a phrase that people say to wish performers good luck before a show.", "Spill the Beans", "Tommy and Lisa were preparing a surprise party for Hana. But Tommy was not good at keeping secrets. So, Lisa told him, “Don't spill the beans.” Tommy said, “Don't worry. I promise not to tell Hana.” Tommy kept his promise and the surprise party was a big success. Hana was completely surprised. What does the phrase “spill the beans” mean? It means to reveal a secret. Where does this phrase come from? It comes from an ancient Greek way of voting. When Greeks voted, they put a white or black bean in a big jar. When the voting was completed, the beans were spilled to reveal the results. From then, people began to use this phrase with a new meaning.", "Take a Rain Check", "Sarah wanted to see a movie with her best friend, Emily. So, she asked Emily, “Do you want to see a movie with me today?” Emily replied, “I'm sorry, but I have to take a rain check. I have to go to my grandmother's house today.” “That's okay. Let's do it another time,” said Sarah. Although Sarah was a little disappointed, she understood Emily's situation. What does “take a rain check” mean? It means to refuse an offer politely but wish to do it later. The phrase “rain check” was first used at a baseball game in the 1880s. A rain check was a ticket that people got for a future game when a baseball game was canceled because of rain. Later, rain checks were given at other sporting events. Over time, “take a rain check” has been widely used to say that you can't do something now and want to do it later."];var PASS_KO=["관용 표현에 얽힌 이야기", "다리 부러지세요", "학교 연극의 날이었다. Lily는 몇 주 동안 그 연극을 위해 연습했다. 커튼이 막 올라가려는 참에, 그녀는 매우 긴장했다. 그녀의 친구가 웃으며 말했다, “다리 부러져!” Lily는 “고마워. 그럴게!”라고 말했다. 그녀는 무대에 올랐고 성공적으로 공연했다. 비록 “다리 부러지세요!”가 나쁜 것처럼 들릴 수 있지만, 그것은 사실 “행운을 빌어요!”를 의미한다. 20세기 초에 미국에 온 독일 배우들이 이 어구를 처음 사용했다. 서로에게 불운을 빎으로써, 그들은 그것이 없어질 거라고 믿었다. 이 표현은 오늘날에도 여전히 사용된다. ‘다리 부러지세요’는 사람들이 공연 전에 공연자들에게 행운을 빌기 위해 말하는 어구이다.", "콩을 쏟다", "Tommy와 Lisa는 하나를 위한 깜짝 파티를 준비하고 있었다. 그러나 Tommy는 비밀을 지키는 것을 잘하지 못했다. 그래서, Lisa는 그에게 “콩을 쏟지 마.”라고 말했다. Tommy는 “걱정 마. 하나에게 말하지 않겠다고 약속해.”라고 말했다. Tommy는 그의 약속을 지켰고 깜짝 파티는 크게 성공했다. 하나는 완전히 깜짝 놀랐다. 어구 ‘콩을 쏟다’가 무엇을 의미할까? 그것은 비밀을 드러내는 것을 의미한다. 이 어구는 어디에서 유래한 것일까? 그것은 고대 그리스의 투표 방법에서 유래한 것이다. 그리스인들이 투표할 때, 그들은 흰색이나 검은색 콩을 큰 항아리에 넣었다. 투표가 완료되었을 때, 그 콩들은 결과를 드러내기 위해 쏟아졌다. 그때부터, 사람들은 이 어구를 새로운 의미로 사용하기 시작했다.", "우천 교환권을 받는다", "Sarah는 그녀의 가장 친한 친구 Emily와 영화를 보러 가고 싶었다. 그래서 그녀는 Emily에게 물었다, “오늘 나랑 영화 볼래?” Emily는 대답했다, “미안하지만, 난 우천 교환권을 받아야만 해. 나는 오늘 할머니 댁에 가야 해.” “괜찮아. 다음에 보자.”라고 Sarah가 말했다. 비록 Sarah는 조금 실망했지만, 그녀는 Emily의 상황을 이해했다. ‘우천 교환권을 받는다’가 무엇을 의미할까? 그것은 제안을 정중하게 거절하지만 나중에 하고 싶어 한다는 것을 의미한다. 어구 ‘우천 교환권’은 ”라고 말했다."], ["She got on the stage and performed successfully.", "그녀는 무대에 올랐고 성공적으로 공연했다."], ["Although “Break a leg!” may sound like a bad thing, it actually means “Good luck!”", "비록 “다리 부러지세요!”가 나쁜 것처럼 들릴 수 있지만, 그것은 사실 “행운을 빌어요!”를 의미한다."], ["German actors who came to the United States in the early 20th century first used this phrase.", "20세기 초에 미국에 온 독일 배우들이 이 어구를 처음 사용했다."], ["By wishing each other bad luck, they believed that it would go away.", "서로에게 불운을 빎으로써, 그들은 그것이 없어질 거라고 믿었다."], ["This expression is still used today.", "이 표현은 오늘날에도 여전히 사용된다."], ["“Break a leg” is a phrase that people say to wish performers good luck before a show.", "‘다리 부러지세요’는 사람들이 공연 전에 공연자들에게 행운을 빌기 위해 말하는 어구이다."]]}, {"qs": [{"n": 8, "q": "윗글의 내용과 일치하는 것은?", "o": ["Lisa told Tommy to spill the beans.", "The phrase “spill the beans” means to reveal a secret.", "Tommy told Hana about the surprise party.", "Greeks put only white beans in a jar when they voted.", "The phrase came from a baseball game."], "a": 1, "ans": "The phrase “spill the beans” means to reveal a secret.", "ko": ["Lisa는 Tommy에게 비밀을 말하라고 했다.", "어구 “spill the beans”는 비밀을 드러내는 것을 뜻한다.", "Tommy는 하나에게 깜짝 파티에 대해 말했다.", "그리스인들은 투표할 때 항아리에 흰 콩만 넣었다.", "그 어구는 야구 경기에서 유래했다."], "evs": [["What does the phrase “spill the beans” mean? It means to reveal a secret.", "어구 ‘콩을 쏟다’가 무엇을 의미할까? 그것은 비밀을 드러내는 것을 의미한다."]], "ow": ["오답 ✕ — Lisa는 “Don’t spill the beans.”(콩을 쏟지 마.)라고 했으므로 말하라고 한 것이 아니다.", "정답 ○ — 'It means to reveal a secret.'(비밀을 드러내는 것을 의미한다.)와 일치한다.", "오답 ✕ — 'Tommy kept his promise'(Tommy는 약속을 지켰다)이므로 말하지 않았다.", "오답 ✕ — 'a white or black bean'(흰색이나 검은색 콩)을 넣었다고 했다.", "오답 ✕ — 'an ancient Greek way of voting'(고대 그리스의 투표 방법)에서 유래했다. 야구 경기는 rain check의 유래이다."], "memo": ["정답 ②: spill the beans는 비밀을 드러낸다는 뜻이다.", "근거: It means to reveal a secret.(그것은 비밀을 드러내는 것을 의미한다.)", "함정: Lisa의 말은 쏟지 말라는 것, 유래는 고대 그리스 투표 ✕"], "why": "spill the beans는 비밀을 드러낸다는 뜻이다.", "ev": ["What does the phrase “spill the beans” mean? It means to reveal a secret.", "어구 ‘콩을 쏟다’가 무엇을 의미할까? 그것은 비밀을 드러내는 것을 의미한다."]}], "pp": [["Spill the Beans", "콩을 쏟다"], ["Tommy and Lisa were preparing a surprise party for Hana.", "Tommy와 Lisa는 하나를 위한 깜짝 파티를 준비하고 있었다."], ["But Tommy was not good at keeping secrets.", "그러나 Tommy는 비밀을 지키는 것을 잘하지 못했다."], ["So, Lisa told him, “Don't spill the beans.”", "그래서, Lisa는 그에게 “콩을 쏟지 마.”라고 말했다."], ["Tommy said, “Don't worry. I promise not to tell Hana.”", "Tommy는 “걱정 마. 하나에게 말하지 않겠다고 약속해.”라고 말했다."], ["Tommy kept his promise and the surprise party was a big success.", "Tommy는 그의 약속을 지켰고 깜짝 파티는 크게 성공했다."], ["Hana was completely surprised.", "하나는 완전히 깜짝 놀랐다."], ["What does the phrase “spill the beans” mean?", "어구 ‘콩을 쏟다’가 무엇을 의미할까?"], ["It means to reveal a secret.", "그것은 비밀을 드러내는 것을 의미한다."], ["Where does this phrase come from?", "이 어구는 어디에서 유래한 것일까?"], ["It comes from an ancient Greek way of voting.", "그것은 고대 그리스의 투표 방법에서 유래한 것이다."], ["When Greeks voted, they put a white or black bean in a big jar.", "그리스인들이 투표할 때, 그들은 흰색이나 검은색 콩을 큰 항아리에 넣었다."], ["When the voting was completed, the beans were spilled to reveal the results.", "투표가 완료되었을 때, 그 콩들은 결과를 드러내기 위해 쏟아졌다."], ["From then, people began to use this phrase with a new meaning.", "그때부터, 사람들은 이 어구를 새로운 의미로 사용하기 시작했다."]]}, {"qs": [{"n": 9, "q": "윗글의 빈칸에 들어갈 말로 알맞은 것은?   It means to ________ an offer politely but wish to do it later.", "o": ["discuss", "make", "accept", "refuse", "change"], "a": 3, "ans": "refuse", "ko": ["논의하다", "만들다", "받아들이다", "거절하다", "바꾸다"], "evs": [["Emily replied, “I’m sorry, but I have to take a rain check.”", "Emily는 대답했다, “미안하지만, 난 우천 교환권을 받아야만 해.”"], ["“That’s okay. Let’s do it another time,” said Sarah.", "“괜찮아. 다음에 보자.”라고 Sarah가 말했다."]], "ow": ["오답 ✕ — discuss는 '논의하다'이다. Emily는 논의한 것이 아니라 'I’m sorry, but I have to take a rain check'(미안하지만 ~해야 해)라며 거절했다.", "오답 ✕ — make는 '만들다'이다. 제안을 만드는 것이 아니라 거절하는 상황이다.", "오답 ✕ — accept는 '받아들이다'이다. Emily는 영화 제안을 받아들이지 못하고 'Let’s do it another time'(다음에 하자)로 미뤘다.", "정답 ○ — Emily는 오늘 영화 제안을 정중히 거절하고 나중에 하자고 했으므로 refuse가 알맞다.", "오답 ✕ — change는 '바꾸다'이다. 제안 자체를 바꾸는 것이 아니라 거절하고 미룬다."], "memo": ["정답 ④: refuse(거절하다)", "근거: Emily replied, “I’m sorry, but I have to take a rain check.”(Emily는 “미안하지만 우천 교환권을 받아야만 해.”라고 대답했다.)", "함정: 나중에 하고 싶다고 해도 지금은 거절하는 것 ✕ accept"], "why": "rain check은 지금 제안을 정중히 거절하고 나중을 기약하는 표현이다.", "ev": ["Emily replied, “I’m sorry, but I have to take a rain check.”", "Emily는 대답했다, “미안하지만, 난 우천 교환권을 받아야만 해.”"]}, {"n": 10, "q": "다음은 윗글 전체를 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?", "sum": "When people say “take a rain check,” they (A)________ an offer now and want to (B)________ it later.", "lab": "완성된 요약문 : ", "o": ["refuse - do", "accept - cancel", "refuse - forget", "ignore - cancel", "accept - forget"], "a": 0, "ans": "refuse - do", "ko": ["거절하다 - 하다", "받아들이다 - 취소하다", "거절하다 - 잊다", "무시하다 - 취소하다", "받아들이다 - 잊다"], "evs": [["It means to refuse an offer politely but wish to do it later.", "그것은 제안을 정중하게 거절하지만 나중에 하고 싶어 한다는 것을 의미한다."]], "ow": ["정답 ○ — 'refuse an offer politely but wish to do it later'(제안을 정중히 거절하지만 나중에 하고 싶어 한다)이므로 (A)는 refuse, (B)는 do이다.", "오답 ✕ — 'you can’t do something now'(지금은 할 수 없다)이므로 accept가 아니며, 나중에 취소하는 것이 아니라 하고 싶어 한다.", "오답 ✕ — (A) refuse는 맞지만 'want to do it later'(나중에 하고 싶다)이므로 잊는 것이 아니다.", "오답 ✕ — 무시하는 것이 아니라 정중히 거절하는 것이고, 나중에 취소하는 것도 아니다.", "오답 ✕ — 지금은 받아들이지 않고, 나중에 잊는 것도 아니다."], "memo": ["정답 ①: refuse(거절하다) - do(하다)", "근거: It means to refuse an offer politely but wish to do it later.(제안을 정중하게 거절하지만 나중에 하고 싶어 한다는 것을 의미한다.)", "함정: 지금은 거절하고 나중에 하고 싶다는 뜻 ✕ 취소·잊다"], "why": "지금은 제안을 거절하지만 나중에 하고 싶다는 뜻이다.", "note": {"en": "When people say “take a rain check,” they refuse an offer now and want to do it later.", "ko": "사람들이 ‘take a rain check’라고 말할 때, 그들은 지금은 제안을 거절하고 나중에 그것을 하고 싶어 한다.", "words": [["refuse", "거절하다"], ["do it later", "나중에 하다"]]}, "ev": ["It means to refuse an offer politely but wish to do it later.", "그것은 제안을 정중하게 거절하지만 나중에 하고 싶어 한다는 것을 의미한다."]}], "pp": [["Take a Rain Check", "우천 교환권을 받는다"], ["Sarah wanted to see a   h+='</div>';
 }
 h+='<div class="ac-sec">보기 풀이</div>';
 q.o.forEach(function(t,j){var isA=j===q.a,isW=st.w.indexOf(j)>=0;
  h+='<div class="oc'+(isA?' g':isW?' r':'')+'"><div class="oh"><span class="cn">'+CN[j]+'</span><div class="ot">'+(q.ko?en(t):esc(t))+(q.ko?'<div class="okr">'+esc(q.ko[j])+'</div>':'')+'</div>'+(isA?'<span class="tg">정답</span>':isW?'<span class="tg">내가 고름</span>':'')+'</div><div class="why">'+reasonHtml(q.ow[j])+'</div></div>';
 });
 var tr=(q.memo||[]).filter(function(l){return /^함정/.test(l)})[0];
 if(tr)h+='<div class="trap"><b>함정</b> '+esc(tr.replace(/^함정\s*:\s*/,'').replace(/\s*✕/g,''))+'</div>';
 if(!st.ok){
  h+='<div class="fix"><div class="fh">고쳐 보기</div>';
  q.o.forEach(function(t,j){var xx=st.w.indexOf(j)>=0;h+='<div class="opt'+(xx?' xx':'')+'" data-q="'+q.n+'" data-o="'+j+'"><span class="cn">'+CN[j]+'</span><span>'+(q.ko?en(t):esc(t))+'</span></div>'});
  h+='</div>';
 } else {
  h+='<div class="fixed">정답 '+CN[q.a]+'</div>';
  if(q.note)h+=postHtml(q,st);
  else if(!st.adv)h+='<div class="nx"><button type="button" data-next="'+q.n+'">다음 문제</button></div>';
 }
 return h+'</div>';
}
function fcount(){return QL.filter(function(q){var s=qst[q.n];return s&&s.ok&&!s.w.length}).length}
function fastInfo(){
 var s1=[];secs.forEach(function(S,si){if(s1t[si]!=null&&s1t[si]<1500*S.items.length)s1.push(S.name||('구간 '+(si+1)))});
 var q2=[];QL.forEach(function(q){var s=qst[q.n];if(s&&s.t1&&s.t1-s.t0<2500)q2.push(q.dn)});
 return{s1:s1,q2:q2};
}
function resultHtml(){
 var f=fcount(),fx=QL.reduce(function(a,q){return a+qst[q.n].w.length},0),fi=fastInfo();
 var h='<div class="stage">완료</div><div class="res"><div class="rl">처음에 맞힌 문제</div><div class="rpct">'+f+'<small> / '+QL.length+'</small></div>';
 h+='<table class="rtb">'+QL.map(function(q){var s=qst[q.n];return '<tr><td>'+q.dn+'번</td><td>'+(s.w.length?'틀림':'처음에 맞힘')+'</td></tr>'}).join('')+'</table>';
 h+='<div class="rl">총 학습 시간 '+fmtT(TM.act)+'</div>';
 h+='<div class="chip'+(chk?' on':'')+'">'+(chk?'선생님 확인 완료':'선생님 확인 대기')+'</div>';
 if(TEACH){
  h+='<div class="tp"><b>선생님용</b><div>빠른 제출 : '+((fi.s1.length||fi.q2.length)?'<span class="fl">'+(fi.s1.length?'오류 찾기 '+fi.s1.join(', ')+' ':'')+(fi.q2.length?'문제 '+fi.q2.join(', ')+'번':'')+'</span>':'없음')+'</div><div>첫 시도 정답 '+f+'/'+QL.length+'· 틀린 횟수 '+fx+'</div><div style="margin-top:8px"><button type="button" data-chk="1">'+(chk?'확인 취소':'노트 확인 완료')+'</button></div></div>';
 }
 h+='<div style="margin-top:14px"><a href="./" style="display:inline-block;background:var(--pri);color:#fff;text-decoration:none;font-weight:700;padding:9px 20px;border-radius:8px">M1 Reading 목록으로</a></div>';
 return h+'</div>';
}
function lognote(q){var n=q.note;wlog('s','2단계 · 요약문 완성',[{n:q.dn,a:'정답 '+CN[q.a]+' '+q.ans,m:[n.en,n.ko].concat(n.words.map(function(w){return w[0]+' = '+w[1]}))}])}
function pickOpt(n,j){var q=qById(n),st=qst[n];if(!st||st.ok)return;if(!st.t1)st.t1=Date.now();
 if(j===q.a){st.ok=1;if(q.note)lognote(q);}
 else if(st.w.indexOf(j)<0){st.w.push(j);st.ok=1;if(q.note)lognote(q)}
 var y=window.scrollY;render();window.scrollTo(0,y);
}
function advQ(n){var st=qst[n];if(!st||st.adv)return;st.adv=1;if(allAdv()){tmFlush();TM.done=1}
 render();var ix=QL.indexOf(qById(n)),nx=ix<QL.length-1?QL[ix+1]:null,el=nx?document.getElementById('q'+nx.n):document.querySelector('.res');
 if(el){var ty=el.getBoundingClientRect().top+window.pageYOffset-8;window.scrollTo(0,ty);setTimeout(function(){window.scrollTo(0,el.getBoundingClientRect().top+window.pageYOffset-8)},60)}
}
document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){var sb=+b.dataset.sub;s1t[sb]=Date.now()-mark;mark=Date.now();done[sb]=true;render();
  var fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(aDone())save(fo);
  var gs=document.querySelectorAll('section.grp');if(gs[sb])gs[sb].scrollIntoView({behavior:'smooth',block:'start'});return}
 var jb=e.target.closest('button[data-jump]');if(jb){var jt=document.getElementById(jb.dataset.jump);if(jt)jt.scrollIntoView({behavior:'smooth',block:'start'});return}
 var gb=e.target.closest('button[data-go]');if(gb){qgo=1;render();var sts=document.querySelectorAll('.stage');if(sts[1])sts[1].scrollIntoView({behavior:'smooth',block:'start'});return}
 var o=e.target.closest('.opt[data-q]');if(o){pickOpt(+o.dataset.q,+o.dataset.o);return}
 var nx=e.target.closest('button[data-next]');if(nx){advQ(+nx.dataset.next);return}
 var wr=e.target.closest('button[data-wrote]');if(wr){var qn=+wr.dataset.wrote;qst[qn].wrote=1;advQ(qn);return}
 var ck=e.target.closest('button[data-chk]');if(ck){chk=chk?0:1;var y2=window.scrollY;render();window.scrollTo(0,y2);return}
});
function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){if(window.__bsR)return;try{var any=Object.keys(sel).length||Object.keys(qst).length||Object.keys(done).length;
 if(any)localStorage.setItem(PK,JSON.stringify({v:2,sel:sel,done:done,qst:qst,chk:chk,s1t:s1t,tm:TM,go:qgo}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+(allAdv()?1:0);var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');
 if(n>=2){rs[RNUM]={p:Math.round(fcount()*100/QL.length),ok:1,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}
 localStorage.setItem('m2-res',JSON.stringify(rs));
 if(any){st[RNUM]=(n>=2?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none';
 try{if(any)BSYNC(RNUM,JSON.parse(localStorage.getItem(PK)),n>=2?3:n,n>=2)}catch(e){}}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv&&sv.v===2){sel=sv.sel||{};done=sv.done||{};qst=sv.qst||{};qgo=sv.go||0;if(!qgo&&Object.keys(qst).length)qgo=1;chk=sv.chk||0;s1t=sv.s1t||{};if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}}}catch(e){}
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}try{BSYNC(RNUM,null,0,true)}catch(x){}sel={};done={};qst={};chk=0;s1t={};qgo=0;mark=Date.now();TM={act:0,lv:0,lt:0,done:0};_last=Date.now();render();window.scrollTo(0,0)}}});
var GLX=[[2, 0, ["be about to = 막 ~하려 하다"]], [4, 0, ["although = 비록 ~이지만", "despite = ~에도 불구하고"]], [9, 1, ["surprised = 놀란", "surprising = 놀라운"]], [16, 0, ["disappointed = 실망한", "disappointing = 실망스러운"]], [18, 1, ["because of = ~ 때문에"]]];GLX.forEach(function(g){D.forEach(function(it){if(it.n===g[0]&&it.fixes[g[1]])it.fixes[g[1]].gl=g[2]})});
render();

</script></body></html>
