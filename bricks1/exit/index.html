e sentence?\n\"Even though the curved path is longer, the ball moves so fast that it reaches the bottom first.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 곡선 길이 더 길지만, 공이 아주 빠르게 움직여서 바닥에 먼저 도착한다.","opts":["곡선 길이 더 짧아서 공이 먼저 도착한다.","곡선 길이 더 길지만 공이 아주 빨라서 먼저 도착한다.","곡선 길이 더 길어서 공이 나중에 도착한다.","두 길의 길이가 같아서 공이 동시에 도착한다."],"r":{"a":"2) 곡선 길이 더 길지만 공이 아주 빨라서 먼저 도착한다.","w":"Even though는 '비록 ~이지만'이에요. 곡선이 더 긴데도(양보) 공이 아주 빨라서 먼저 도착한다는 뜻이에요. 길이가 같거나 더 짧다는 말은 없어요.","c":2,"ev":"8번 문장","s":[[8,"Even though the curved path is longer, the ball moves so fast that it reaches the bottom first.","비록 곡선 길이 더 길지만, 공이 아주 빠르게 움직여서 바닥에 먼저 도착한다."]]},"h":"3f2d1e0b05"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["직선 길에서 공이 곡선 길보다 더 빠르다.","곡선 길이 직선 길보다 더 짧다.","곡선 길에서 공은 맨 처음에 많은 속도를 얻는다.","이 아이디어는 롤러코스터에만 쓰인다."],"opts":["The straight line is faster than the curved line.","The curved path is shorter than the straight line.","A ball on the curved path gains a lot of speed at the beginning.","This idea is used only in roller coasters."],"r":{"a":"3) A ball on the curved path gains a lot of speed at the beginning.","w":"7번에서 곡선 길에서는 공이 맨 처음에 많은 속도를 얻어요. 곡선이 더 빠르고(4번) 더 길며(8번), 아이디어는 미끄럼틀과 롤러코스터 등 여러 곳에 쓰여요(9번).","c":3,"ev":"7번 문장","s":[[7,"This helps the ball drop quickly and gain a lot of speed at the very beginning.","이것은 공이 빠르게 떨어지고 맨 처음에 많은 속도를 얻도록 도와준다."]]},"h":"ff40b38aeb"},{"n":9,"t":"sum","q":"Although the curved path is (A), the ball on it reaches the bottom (B).","ko":"곡선 길이 (A)고 해도, 그 위의 공은 바닥에 (B) 도착한다.","oko":["(A) 더 짧다 / (B) 늦게","(A) 더 곧다 / (B) 천천히","(A) 더 짧다 / (B) 먼저","(A) 더 길다 / (B) 먼저","(A) 더 길다 / (B) 늦게"],"opts":["(A) shorter / (B) last","(A) straighter / (B) slowly","(A) shorter / (B) first","(A) longer / (B) first","(A) longer / (B) last"],"r":{"a":"4) (A) longer / (B) first","w":"8번에서 곡선 길이 더 길지만(longer) 공이 먼저(first) 도착한다고 해요. shorter와 last는 본문과 반대예요.","c":4,"ev":"8번 문장","s":[[8,"Even though the curved path is longer, the ball moves so fast that it reaches the bottom first.","비록 곡선 길이 더 길지만, 공이 아주 빠르게 움직여서 바닥에 먼저 도착한다."]]},"h":"85f924fe78"},{"n":10,"t":"fill","q":"The [A] of the path is the secret: at the start the curve is steeper, so the ball gains [B] quickly.","ko":"길의 [A]가 비밀이다. 출발할 때 곡선이 더 가파라서 공이 [B]를 빠르게 얻는다.","bank":["angle","speed","length","bottom","slides","shortest"],"bko":{"angle":"각도","speed":"속도","length":"길이","bottom":"바닥","slides":"미끄럼틀","shortest":"가장 짧은"},"r":{"a":"[A] angle, [B] speed","w":"5번에서 비밀은 길의 각도(angle)에 있다고 하고, 6~7번에서 처음에 가파른 곡선이 공이 많은 속도(speed)를 얻게 해요. length는 곡선이 더 길다는 내용이라 비밀이 아니에요.","c":null,"ev":"5~7번 문장","s":[[5,"The secret is in the angle of the path.","비밀은 길의 각도에 있다."],[6,"At the start, the curve is much steeper than the straight line.","출발할 때, 곡선은 직선보다 훨씬 더 가파르다."],[7,"This helps the ball drop quickly and gain a lot of speed at the very beginning.","이것은 공이 빠르게 떨어지고 맨 처음에 많은 속도를 얻도록 도와준다."]]},"h":"053384de10"}]},{"u":4,"id":"b1-04-4","no":4,"ko":"비가 올 때 나는 흙냄새의 정체","items":[{"n":1,"t":"tf","q":"The earthy smell comes from the ground.","ko":"흙냄새는 땅에서 나온다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장이 It comes from the ground라고 말해요. 2번에서 비에서 나온 것이 아니라고 한 뒤의 답이에요.","c":"T","ev":"3번 문장","s":[[3,"It comes from the ground.","그것은 땅에서 나온다."]]},"h":"9dfb453c16"},{"n":2,"t":"tf","q":"The special chemical is released when the bacteria eat plant oil.","ko":"특별한 화학 물질은 세균이 식물 기름을 먹을 때 방출된다.","r":{"a":"F (본문과 다른 내용)","w":"8번 문장에서 이 화학 물질은 세균이 죽을 때(when the bacteria die) 방출돼요. 식물 기름을 먹을 때라는 말은 본문에 없어요.","c":"F","ev":"8번 문장","s":[[8,"This chemical is released when the bacteria die.","이 화학 물질은 세균이 죽을 때 방출된다."]]},"h":"7eb74ce292"},{"n":3,"t":"tf","q":"Plant oil helps plants keep water inside.","ko":"식물 기름은 식물이 물을 안에 간직하도록 도와준다.","r":{"a":"T (본문과 맞는 내용)","w":"5번 문장이 This oil helps plants keep water inside라고 해요. 그대로 일치하는 내용이에요.","c":"T","ev":"5번 문장","s":[[5,"This oil helps plants keep water inside.","이 기름은 식물이 물을 안에 간직하도록 도와준다."]]},"h":"987e9acff7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This chemical is released when the bacteria die.)","ko":"이 화학 물질은 세균이 죽을 때 방출된다.","opts":["흡수된다","숨겨진다","방출된다","팔린다"],"word":"released","r":{"a":"3) 방출된다","w":"세균이 죽을 때 화학 물질이 밖으로 나오고, 나중에 공기 중으로 올라가 냄새가 돼요(9~10번). is released는 방출된다는 뜻이에요.","c":3,"ev":"8번 문장","s":[[8,"This chemical is released when the bacteria die.","이 화학 물질은 세균이 죽을 때 방출된다."]]},"h":"ff94010338"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Over time, the chemical builds up in the ground with the plant oils.)","ko":"시간이 지나면서, 그 화학 물질은 식물 기름과 함께 땅속에 쌓인다.","opts":["사라진다","쌓인다","녹는다","마른다"],"word":"builds up","r":{"a":"2) 쌓인다","w":"Over time(시간이 지나면서) 뒤라서 점점 늘어나는 모습이에요. 그래서 비가 올 때 많은 양이 공기로 올라갈 수 있어요. build up은 쌓이다예요.","c":2,"ev":"9번 문장","s":[[9,"Over time, the chemical builds up in the ground with the plant oils.","시간이 지나면서, 그 화학 물질은 식물 기름과 함께 땅속에 쌓인다."]]},"h":"24195744e3"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAs they spread, we start to notice the earthy smell.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그것들이 퍼지면서, 우리는 흙냄새를 알아채기 시작한다.","opts":["비와 바람","바위와 흙","식물과 세균","특별한 화학 물질과 식물 기름"],"r":{"a":"4) 특별한 화학 물질과 식물 기름","w":"11번 바로 앞 10번에서 공기 중으로 올라가는 것은 특별한 화학 물질과 식물 기름이에요. 그것들이 퍼지면서 냄새를 알아채게 돼요.","c":4,"ev":"10~11번 문장","s":[[10,"When rain falls on dry soil, the special chemical and plant oils go up into the air.","비가 마른 흙에 떨어지면, 특별한 화학 물질과 식물 기름이 공기 중으로 올라간다."],[11,"As they spread, we start to notice the earthy smell.","그것들이 퍼지면서, 우리는 흙냄새를 알아채기 시작한다."]]},"h":"29f4fcdcf9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The oil slowly moves into the air and lands on rocks and soil.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 기름은 천천히 공기 중으로 이동하여 바위와 흙 위에 내려앉는다.","opts":["기름은 천천히 공기 중으로 이동해 바위와 흙 위에 내려앉는다.","기름은 빠르게 땅속 깊이 스며든다.","기름은 바위를 녹여서 흙으로 만든다.","기름은 비와 함께 하늘에서 내려온다."],"r":{"a":"1) 기름은 천천히 공기 중으로 이동해 바위와 흙 위에 내려앉는다.","w":"slowly는 천천히, moves into the air는 공기 중으로 이동한다, lands on은 ~ 위에 내려앉는다는 뜻이에요. 빠르게 스며든다거나 바위를 녹인다는 말은 없어요.","c":1,"ev":"6번 문장","s":[[6,"The oil slowly moves into the air and lands on rocks and soil.","그 기름은 천천히 공기 중으로 이동하여 바위와 흙 위에 내려앉는다."]]},"h":"16e41be724"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["흙냄새는 비 자체에서 나온다.","식물은 날씨가 습할 때 기름을 만든다.","특별한 화학 물질은 식물 기름과 함께 땅속에 쌓인다.","세균은 비가 올 때만 화학 물질을 만든다."],"opts":["The earthy smell comes from the rain itself.","Plants make oil when the weather is wet.","The special chemical builds up in the ground with plant oils.","Bacteria make the chemical only when it rains."],"r":{"a":"3) The special chemical builds up in the ground with plant oils.","w":"9번에서 화학 물질이 식물 기름과 함께 땅속에 쌓인다고 해요. 냄새는 비에서 나오지 않고(2번), 식물은 건조할 때 기름을 만들며(4번), 세균의 화학 물질은 비가 오기 전부터 땅속에 쌓여 있다가(9번) 비가 오면 올라가요(10번).","c":3,"ev":"9번 문장","s":[[9,"Over time, the chemical builds up in the ground with the plant oils.","시간이 지나면서, 그 화학 물질은 식물 기름과 함께 땅속에 쌓인다."]]},"h":"cd6be620fc"},{"n":9,"t":"sum","q":"In dry weather, plants make (A), and soil bacteria make a special (B).","ko":"건조한 날씨에 식물은 (A)을 만들고, 토양 세균은 특별한 (B)을 만든다.","oko":["(A) 물 / (B) 바위","(A) 기름 / (B) 바람","(A) 비 / (B) 흙","(A) 열매 / (B) 소금","(A) 기름 / (B) 화학 물질"],"opts":["(A) water / (B) rock","(A) oil / (B) wind","(A) rain / (B) soil","(A) fruit / (B) salt","(A) oil / (B) chemical"],"r":{"a":"5) (A) oil / (B) chemical","w":"4번에서 식물은 소량의 기름(oil)을 만들고, 7번에서 토양 세균은 특별한 화학 물질(chemical)을 만들어요. 나머지는 본문에 없는 조합이에요.","c":5,"ev":"4번, 7번 문장","s":[[4,"When the weather is dry, plants make small amounts of oil.","날씨가 건조하면, 식물은 소량의 기름을 만든다."],[7,"At the same time, some soil bacteria make a special chemical.","같은 시기에, 일부 토양 세균은 특별한 화학 물질을 만든다."]]},"h":"df2498ccef"},{"n":10,"t":"fill","q":"When rain falls on dry soil, the chemical and plant oils go up into the [A], and as they [B], we notice the earthy smell.","ko":"비가 마른 흙에 떨어지면 화학 물질과 식물 기름이 [A] 속으로 올라가고, 그것들이 [B]면서 우리는 흙냄새를 알아챈다.","bank":["air","spread","rocks","water","bacteria","vegetables"],"bko":{"air":"공기","spread":"퍼지다","rocks":"바위","water":"물","bacteria":"세균","vegetables":"채소"},"r":{"a":"[A] air, [B] spread","w":"10번에서 화학 물질과 식물 기름이 공기(air) 속으로 올라가고, 11번에서 그것들이 퍼지면서(spread) 냄새를 알아채요. rocks는 6번에서 기름이 내려앉는 곳이라 올라가는 곳이 아니에요.","c":null,"ev":"10~11번 문장","s":[[10,"When rain falls on dry soil, the special chemical and plant oils go up into the air.","비가 마른 흙에 떨어지면, 특별한 화학 물질과 식물 기름이 공기 중으로 올라간다."],[11,"As they spread, we start to notice the earthy smell.","그것들이 퍼지면서, 우리는 흙냄새를 알아채기 시작한다."]]},"h":"ebb3a79dfe"}]},{"u":5,"id":"b1-05-1","no":1,"ko":"평범한 몸짓이 다른 나라에선 무례하다고?","items":[{"n":1,"t":"tf","q":"In Greece, holding out your palms toward someone is very rude.","ko":"그리스에서는 누군가를 향해 손바닥을 내미는 것이 매우 무례하다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"In Greece, for example, never hold out your palms toward someone.","예를 들어 그리스에서는 누군가를 향해 손바닥을 내밀지 마라."],[4,"This gesture is very rude there.","그 몸짓은 그곳에서 매우 무례하다."]],"w":"3번에서 그리스에서는 손바닥을 내밀지 말라고 하고, 4번에서 This gesture is very rude there(그 몸짓은 그곳에서 매우 무례하다)라고 해요.","c":"T"},"h":"d7f9f56149"},{"n":2,"t":"tf","q":"In Thailand and Fiji, people pat children’s heads to praise them.","ko":"태국과 피지에서는 사람들이 아이들을 칭찬하려고 머리를 쓰다듬는다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"In many countries, people pat children’s heads to praise them.","많은 나라에서 사람들은 아이들을 칭찬하려고 머리를 쓰다듬는다."],[8,"But in Thailand and Fiji, you should not touch someone’s head.","하지만 태국과 피지에서는 다른 사람의 머리를 만지면 안 된다."]],"w":"머리를 쓰다듬어 칭찬하는 곳은 7번의 '많은 나라'예요. 8번에서 태국과 피지는 머리를 만지면 안 된다고 해요.","c":"F"},"h":"d374862f05"},{"n":3,"t":"tf","q":"In Egypt and India, showing the bottoms of your feet is not polite.","ko":"이집트와 인도에서는 발바닥을 보이는 것이 예의 바르지 않다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"In Egypt and India, don’t show the bottoms of your feet.","이집트와 인도에서는 발바닥을 보이지 마라."],[6,"People there think feet are dirty, so this is not polite.","그곳 사람들은 발이 더럽다고 생각해서, 이것은 예의 바르지 않다."]],"w":"5번에서 발바닥을 보이지 말라고 하고, 6번에서 발이 더럽다고 생각해서 this is not polite(이것은 예의 바르지 않다)라고 해요.","c":"T"},"h":"e546768a54"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Something normal in your country might be rude in another country.)","ko":"당신 나라에서는 평범한 것이 다른 나라에서는 무례할 수도 있다.","opts":["친절한","무례한","재미있는","낯선"],"word":"rude","r":{"a":"2) 무례한","ev":"2번 문장","s":[[2,"Something normal in your country might be rude in another country.","당신 나라에서는 평범한 것이 다른 나라에서는 무례할 수도 있다."]],"w":"우리나라에서는 평범한 행동이 다른 나라에서는 문제가 될 수 있다는 흐름이에요. 뒤의 4번에서도 This gesture is very rude(매우 무례하다)라고 해요. rude = 무례한.","c":2},"h":"4d48c89cde"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (People there think feet are dirty, so this is not polite.)","ko":"그곳 사람들은 발이 더럽다고 생각해서, 이것은 예의 바르지 않다.","opts":["더러운","위험한","시끄러운","예의 바른"],"word":"polite","r":{"a":"4) 예의 바른","ev":"6번 문장","s":[[6,"People there think feet are dirty, so this is not polite.","그곳 사람들은 발이 더럽다고 생각해서, 이것은 예의 바르지 않다."]],"w":"발이 더럽다고 생각해서 발바닥을 보이는 것이 not polite라고 해요. 그러니 polite는 '예의 바른'이에요. 더러운(dirty)은 앞에 따로 나오는 단어예요.","c":4},"h":"0ac197746c"},{"n":6,"t":"ref","q":"What does the underlined \"there\" refer to?\nPeople there believe their soul is in their head.","ko":"밑줄 친 there가 가리키는 것은?","sko":"그곳 사람들은 영혼이 머리 안에 있다고 믿는다.","opts":["그리스","이집트와 인도","태국과 피지","많은 나라"],"r":{"a":"3) 태국과 피지","ev":"8~9번 문장","s":[[8,"But in Thailand and Fiji, you should not touch someone’s head.","하지만 태국과 피지에서는 다른 사람의 머리를 만지면 안 된다."],[9,"People there believe their soul is in their head.","그곳 사람들은 영혼이 머리 안에 있다고 믿는다."]],"w":"9번 바로 앞 8번에서 머리를 만지면 안 되는 곳이 태국과 피지예요. 그곳 사람들이 영혼이 머리에 있다고 믿는 거예요.","c":3},"h":"4a7d5052d7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"To them, touching their head is like taking away their soul.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들에게, 머리를 만지는 것은 영혼을 빼앗는 것과 같다.","opts":["그들에게 머리를 만지는 것은 영혼을 빼앗는 것과 같다.","그들에게 머리를 만지는 것은 영혼을 돌려주는 것과 같다.","그들은 영혼을 만지면 머리가 아프다고 믿는다.","그들은 머리를 만지는 것을 칭찬으로 여긴다."],"r":{"a":"1) 그들에게 머리를 만지는 것은 영혼을 빼앗는 것과 같다.","ev":"10번 문장","s":[[10,"To them, touching their head is like taking away their soul.","그들에게, 머리를 만지는 것은 영혼을 빼앗는 것과 같다."]],"w":"taking away their soul은 '영혼을 빼앗는 것'이에요. 돌려주는 것이 아니고, 칭찬으로 여기는 것도 아니에요.","c":1},"h":"0ebc862e9f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그리스에서는 손바닥을 내미는 것이 예의 바르다.","나라마다 몸짓의 뜻이 다를 수 있다.","머리를 쓰다듬는 것은 모든 나라에서 무례하다.","이집트와 인도에서는 발바닥을 보이면 칭찬이 된다."],"opts":["Holding out your palms is polite in Greece.","A gesture can mean different things in different countries.","Patting a child’s head is rude in every country.","In Egypt and India, showing your feet is a way to praise someone."],"r":{"a":"2) A gesture can mean different things in different countries.","ev":"1~2번 문장","s":[[1,"Gestures can mean different things in different countries.","몸짓은 나라마다 다른 의미를 가질 수 있다."],[2,"Something normal in your country might be rude in another country.","당신 나라에서는 평범한 것이 다른 나라에서는 무례할 수도 있다."]],"w":"1~2번에서 몸짓은 나라마다 다른 뜻을 가질 수 있다고 해요. 그리스에서 손바닥은 무례하고(3~4번), 머리 쓰다듬기는 많은 나라에서 칭찬이에요(7번).","c":2},"h":"9f98a29977"},{"n":9,"t":"sum","q":"Gestures can mean (A) things in different countries, so understanding these (B) can help us respect other cultures.","ko":"몸짓은 나라마다 (A) 의미를 가질 수 있어서, 이러한 (B)를 이해하면 다른 문화를 존중하는 데 도움이 된다.","oko":["(A) 같은 / (B) 차이","(A) 다른 / (B) 닮은 점","(A) 재미있는 / (B) 규칙","(A) 위험한 / (B) 음식","(A) 다른 / (B) 차이"],"opts":["(A) same / (B) differences","(A) different / (B) similarities","(A) funny / (B) rules","(A) dangerous / (B) foods","(A) different / (B) differences"],"r":{"a":"5) (A) different / (B) differences","ev":"1번, 11번 문장","s":[[1,"Gestures can mean different things in different countries.","몸짓은 나라마다 다른 의미를 가질 수 있다."],[11,"Understanding these differences can help you respect other cultures.","이러한 차이를 이해하는 것은 다른 문화를 존중하는 데 도움이 될 수 있다."]],"w":"1번에서 몸짓은 나라마다 different한 뜻을 가진다고 하고, 11번에서 이 differences(차이)를 이해하면 존중할 수 있다고 해요.","c":5},"h":"afb36c5fe0"},{"n":10,"t":"fill","q":"In Thailand and Fiji, you should not touch someone’s [A], because people there believe their [B] is in it.","ko":"태국과 피지에서는 다른 사람의 [A]를 만지면 안 되는데, 그곳 사람들은 자신의 [B]이 그 안에 있다고 믿기 때문이다.","bank":["head","soul","feet","palms","praise","gesture"],"bko":{"head":"머리","soul":"영혼","feet":"발","palms":"손바닥","praise":"칭찬","gesture":"몸짓"},"r":{"a":"[A] head, [B] soul","ev":"8~10번 문장","s":[[8,"But in Thailand and Fiji, you should not touch someone’s head.","하지만 태국과 피지에서는 다른 사람의 머리를 만지면 안 된다."],[9,"People there believe their soul is in their head.","그곳 사람들은 영혼이 머리 안에 있다고 믿는다."],[10,"To them, touching their head is like taking away their soul.","그들에게, 머리를 만지는 것은 영혼을 빼앗는 것과 같다."]],"w":"8번 someone’s head, 9번 their soul is in their head, 10번 taking away their soul에서 가져왔어요. feet와 palms는 이집트·인도와 그리스 이야기라서 맞지 않아요.","c":null},"h":"a6aa25f4bf"}]},{"u":5,"id":"b1-05-2","no":2,"ko":"안전망도 없이 장대에서 뛰어내리는 사람들","items":[{"n":1,"t":"tf","q":"The performance begins with five men climbing a tall pole.","ko":"공연은 다섯 명의 남자가 높은 장대를 오르는 것으로 시작된다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The performance begins with five men climbing a tall pole.","공연은 다섯 명의 남자가 높은 장대를 오르는 것으로 시작된다."]],"w":"3번 문장에 The performance begins with five men climbing a tall pole이 그대로 나와요.","c":"T"},"h":"5aa3f1dfc2"},{"n":2,"t":"tf","q":"All five men jump off the pole.","ko":"다섯 명의 남자 모두가 장대에서 뛰어내린다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"One man stands at the top, playing music.","한 남자는 꼭대기에 서서 음악을 연주한다."],[6,"The other four jump off the pole, only held up by long ropes.","나머지 네 명은 긴 밧줄에만 매달린 채 장대에서 뛰어내린다."]],"w":"한 남자는 꼭대기에 서서 음악을 연주하고(5번), 나머지 네 명만 뛰어내려요(6번). 다섯 명 모두가 뛰는 것은 아니에요.","c":"F"},"h":"34361ca66f"},{"n":3,"t":"tf","q":"Today, the dance is still performed at festivals.","ko":"오늘날에도 이 춤은 여전히 축제에서 공연된다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Today, the dance is still performed at festivals to keep this tradition alive.","오늘날에도 이 전통을 이어 가기 위해 축제에서 이 춤이 공연된다."]],"w":"10번에서 Today, the dance is still performed at festivals(오늘날에도 이 춤은 축제에서 공연된다)라고 해요.","c":"T"},"h":"121e82e997"},{"n":4,"t":"vocab" h above the ground, men jump from a pole with no safety nets.","땅 위 높은 곳에서, 남자들이 안전망도 없이 장대에서 뛰어내린다."]],"w":"High above the ground는 땅 위 아주 높은 곳, no safety nets는 안전망이 없다는 뜻이에요. 올라가는 것도, 안전망이 있는 것도 아니에요.","c":2},"h":"c8c345a957"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["남자들은 안전망 위로 뛰어내린다.","장대의 높이는 항상 10미터이다.","사람들은 이 춤이 비를 가져온다고 믿었다.","오늘날에는 이 춤을 아무도 공연하지 않는다."],"opts":["The men jump onto safety nets.","The pole is always 10 meters high.","People once believed the dance would bring rain.","Nobody performs the dance anymore."],"r":{"a":"3) People once believed the dance would bring rain.","ev":"9번 문장","s":[[9,"Long ago, people believed that this dance would bring rain and help their crops grow.","오래전에 사람들은 이 춤이 비를 가져오고 농작물이 자라도록 도와줄 것이라고 믿었다."]],"w":"9번에서 오래전에 사람들은 이 춤이 비를 가져온다고 믿었다고 해요. 안전망은 없고(1번), 장대는 최대 40미터이고(4번), 오늘날에도 공연돼요(10번).","c":3},"h":"ed667690e4"},{"n":9,"t":"sum","q":"In the Dance of the Flyers, four men jump from a tall (A) and spin around it, looking like (B) in the sky.","ko":"날아다니는 사람들의 춤에서 네 명의 남자는 높은 (A)에서 뛰어내려 그 주위를 돌며, 하늘의 (B)처럼 보인다.","oko":["(A) 나무 / (B) 물고기","(A) 벽 / (B) 구름","(A) 집 / (B) 농부","(A) 밧줄 / (B) 비","(A) 장대 / (B) 새"],"opts":["(A) tree / (B) fish","(A) wall / (B) clouds","(A) house / (B) farmers","(A) rope / (B) rain","(A) pole / (B) birds"],"r":{"a":"5) (A) pole / (B) birds","ev":"6~8번 문장","s":[[6,"The other four jump off the pole, only held up by long ropes.","나머지 네 명은 긴 밧줄에만 매달린 채 장대에서 뛰어내린다."],[7,"Their bodies spin around the pole in big circles.","그들의 몸은 장대 주위를 큰 원을 그리며 빙빙 돈다."],[8,"They look like birds flying gracefully through the sky.","그들은 하늘을 우아하게 날아다니는 새처럼 보인다."]],"w":"6번에서 장대(pole)에서 뛰어내리고, 7번에서 그 주위를 돌며, 8번에서 새(birds)처럼 보인다고 해요. rope는 매달리는 도구이지 뛰어내리는 곳이 아니에요.","c":5},"h":"10f075f67a"},{"n":10,"t":"fill","q":"Long ago, people believed the dance would bring [A], and today it is still performed at [B].","ko":"오래전 사람들은 이 춤이 [A]를 가져온다고 믿었고, 오늘날에도 [B]에서 공연된다.","bank":["rain","festiv st","ev":"6~8번 문장","s":[[6,"In 1745, Britain ruled Scotland.","1745년에 영국이 스코틀랜드를 통치했다."],[7,"Some clans wanted to bring the Scottish kings back.","일부 클랜은 스코틀랜드의 왕들을 다시 데려오고 싶어 했다."],[8,"So they fought the British, but they lost.","그래서 그들은 영국인들과 싸웠지만, 졌다."]],"w":"8번에서 So they fought the British, but they lost(그래서 그들은 영국인들과 싸웠지만 졌다)라고 해요. ruled(통치했다)는 영국이 한 일이고, won은 but 뒤의 결과와 반대예요.","c":null},"h":"fdf57207eb"}]},{"u":5,"id":"b1-05-4","no":4,"ko":"빛이 딱 세 조각상만 비추는 신전의 비밀","items":[{"n":1,"t":"tf","q":"The sunlight shines on three of the four statues.","ko":"햇빛은 네 개의 조각상 중 세 개를 비춘다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It shines on three of the statues.","그 빛은 조각상 세 개를 비춘다."]],"w":"4번에서 It shines on three of the statues(그 빛은 조각상 세 개를 비춘다)라고 해요. 네 번째는 어두운 채로 있어요(6번).","c":"T"},"h":"4616abb744"},{"n":2,"t":"tf","q":"The sunlight shines on the statues every morning of the year.","ko":"햇빛은 일 년 내내 매일 아침 조각상들을 비춘다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"This event happens twice a year, on February 22 and October 22.","이 일은 일 년에 두 번, 2월 22일과 10월 22일에 일어난다."]],"w":"이 일은 twice a year(일 년에 두 번), 2월 22일과 10월 22일에만 일어나요. 매일 아침이 아니에요.","c":"F"},"h":"3b7b133026"},{"n":3,"t":"tf","q":"No one knows the real reason for the two dates.","ko":"아무도 그 두 날짜의 진짜 이유를 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"11~12번 문장","s":[[11,"Some people say these dates were chosen for royal events.","어떤 사람들은 이 날짜들이 왕실 행사 때문에 정해졌다고 말한다."],[12,"But no one knows the real reason.","하지만 아무도 진짜 이유를 모른다."]],"w":"11번에서 어떤 사람들은 왕실 행사 때문이라고 말하지만, 12번에서 But no one knows the real reason(하지만 아무도 진짜 이유를 모른다)이라고 해요.","c":"T"},"h":"2e2963a230"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is not an accident.)","ko":"이것은 우연이 아니다.","opts":["우연","계획","약속","행사"],"word":"accident","r":{"a":"1) 우연","ev":"7~8번 문장","s":[[7,"This is not an accident.","이것은 우연이 아니다."],[8,"The builders planned this perfectly.","건축가들은 이것을 완벽하게 계획했다."]],"w":"7번 다음에 8번에서 건축가들이 완벽하게 계획했다고 해요. 계획한 일이니 '우연이 아니다'이고, accident = 우연이에요.","c":1},"h":"ddae133c28"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The builders planned this perfectly.)","ko":"건축가들은 이것을 계획했다.","opts":["대충","몰래","완벽하게","천천히"],"word":"perfectly","r":{"a":"3) 완벽하게","ev":"8번 문장","s":[[8,"The builders planned this perfectly.","건축가들은 이것을 완벽하게 계획했다."]],"w":"빛이 세 조각상만 비추고 한 조각상은 어둠에 두는 일을 정확하게 계획했다는 뜻이에요. perfectly = 완벽하게예요. 13번에서도 태양과 perfectly 맞는다고 해요.","c":3},"h":"5040772f50"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt shines on three of the statues.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그 빛은 조각상 세 개를 비춘다.","opts":["어두운 복도","햇빛","신전 전체","어둠의 신"],"r":{"a":"2) 햇빛","ev":"3~4번 문장","s":[[3,"On certain mornings, sunlight comes through a dark hallway.","특정한 아침에, 햇빛이 어두운 복도를 지나 들어온다."],[4,"It shines on three of the statues.","그 빛은 조각상 세 개를 비춘다."]],"w":"3번에서 햇빛(sunlight)이 어두운 복도를 지나 들어와요. 4번의 It이 그 햇빛이고, 조각상 세 개를 비춰요.","c":2},"h":"317a67bb1d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They chose who the light would hit and who would stay in the dark.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 빛이 누구를 비추고 누가 어둠 속에 남을지를 선택했다.","opts":["그들은 빛이 어디서 오는지 몰라서 아무 조각상이나 골랐다.","그들은 모든 조각상이 똑같이 빛을 받도록 했다.","그들은 조각상을 모두 어둠 속에 두기로 선택했다.","그들은 빛이 비출 조각상과 어둠에 남을 조각상을 선택했다."],"r":{"a":"4) 그들은 빛이 비출 조각상과 어둠에 남을 조각상을 선택했다.","ev":"9번 문장","s":[[9,"They chose who the light would hit and who would stay in the dark.","그들은 빛이 누구를 비추고 누가 어둠 속에 남을지를 선택했다."]],"w":"who the light would hit(빛이 누구를 비출지)과 who would stay in the dark(누가 어둠 속에 남을지)를 건축가들이 정했다는 뜻이에요. 우연히 정해진 것도, 똑같이 비추는 것도 아니에요.","c":4},"h":"572ff20680"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["빛은 어둠의 신 조각상을 가장 먼저 비춘다.","신전은 떠오르는 태양과 완벽하게 일직선으로 맞는다.","빛은 일 년 내내 매일 신전으로 들어온다.","두 날짜의 진짜 이유는 분명히 밝혀져 있다."],"opts":["The light hits the god of darkness first.","The temple lines up perfectly with the rising sun.","The light enters the temple every day of the year.","The real reason for the two dates is clearly known."],"r":{"a":"2) The temple lines up perfectly with the rising sun.","ev":"13번 문장","s":[[13,"Still, the temple lines up perfectly with the rising sun.","그래도 신전은 떠오르는 태양과 완벽하게 일직선으로 맞는다."]],"w":"13번에서 신전이 떠오르는 태양과 완벽하게 일직선으로 맞는다고 해요. 어둠의 신은 어두운 채로 있고(6번), 빛은 일 년에 두 번이며(10번), 진짜 이유는 아무도 몰라요(12번).","c":2},"h":"d77dfd36d2"},{"n":9,"t":"sum","q":"On certain mornings, sunlight lights up (A) of the four statues, and the god of (B) stays dark.","ko":"특정한 아침에 햇빛은 네 조각상 중 (A)을 비추고, (B)의 신은 어두운 채로 있다.","oko":["(A) 한 개 / (B) 빛","(A) 두 개 / (B) 태양","(A) 모두 / (B) 어둠","(A) 세 개 / (B) 빛","(A) 세 개 / (B) 어둠"],"opts":["(A) one / (B) light","(A) two / (B) the sun","(A) all / (B) darkness","(A) three / (B) light","(A) three / (B) darkness"],"r":{"a":"5) (A) three / (B) darkness","ev":"3~6번 문장","s":[[3,"On certain mornings, sunlight comes through a dark hallway.","특정한 아침에, 햇빛이 어두운 복도를 지나 들어온다."],[4,"It shines on three of the statues.","그 빛은 조각상 세 개를 비춘다."],[5,"They are of two gods and a pharaoh.","그것들은 두 신과 파라오의 조각상이다."],[6,"A fourth statue, the god of darkness, stays dark.","네 번째 조각상인 어둠의 신은 어두운 채로 있다."]],"w":"4번에서 세 조각상(three)을 비추고, 6번에서 네 번째 조각상인 the god of darkness(어둠의 신)는 어두운 채로 있어요.","c":5},"h":"4c4a6a97e0"},{"n":10,"t":"fill","q":"The builders showed deep [A] for the sun, because the temple [B] up perfectly with the rising sun.","ko":"신전이 떠오르는 태양과 완벽하게 [B] 있어서, 건축가들이 태양에 대한 깊은 [A]을 보여 준다.","bank":["respect","lines","fear","shines","hides","chose"],"bko":{"respect":"존경, 존중","lines":"일직선으로 맞다 (lines up)","fear":"두려움","shines":"비추다","hides":"숨기다","chose":"선택했다"},"r":{"a":"[A] respect, [B] lines","ev":"13~14번 문장","s":[[13,"Still, the temple lines up perfectly with the rising sun.","그래도 신전은 떠오르는 태양과 완벽하게 일직선으로 맞는다."],[14,"This shows the builders’ deep respect for the sun and their gods.","이것은 건축가들이 태양과 그들의 신들에 대해 가진 깊은 존경심을 보여 준다."]],"w":"13번 the temple lines up perfectly with the rising sun, 14번 This shows the builders’ deep respect for the sun에서 가져왔어요. fear는 14번의 respect와 뜻이 달라요.","c":null},"h":"dc326648d7"}]},{"u":6,"id":"b1-06-1","no":1,"ko":"동전 테두리의 홈, 장식이 아니었다고?","items":[{"n":1,"t":"tf","q":"Some people shaved the edges of coins to steal a little metal.","ko":"어떤 사람들은 조금씩 금속을 훔치려고 동전의 테두리를 깎았다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Some people tried to steal a little by shaving off the edges.","어떤 사람들은 테두리를 깎아 내어 조금씩 훔치려고 했다."]],"w":"5번 문장에 tried to steal a little by shaving off the edges가 나와요. 테두리를 깎아 조금씩 훔치려 했다는 내용과 일치해요.","c":"T"},"h":"772f728853"},{"n":2,"t":"tf","q":"Coins today are still made of gold and silver.","ko":"오늘날의 동전은 여전히 금과 은으로 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Today, coins are no longer made of valuable metals.","오늘날 동전은 더 이상 값비싼 금속으로 만들어지지 않는다."]],"w":"10번 문장에서 오늘날 동전은 더 이상 값비싼 금속으로 만들어지지 않는다(no longer made of valuable metals)고 해요. 금과 은으로 만든다는 말은 반대예요.","c":"F"},"h":"0aa1edb2d6"},{"n":3,"t":"tf","q":"A broken pattern showed that someone had shaved the coin.","ko":"망가진 무늬는 누군가 동전을 깎았다는 것을 보여 주었다.","r":{"a":"T (본문과 맞는 내용)","ev":"8~9번 문장","s":[[8,"When a coin was shaved, the pattern was broken.","동전이 깎이면, 무늬가 망가졌다."],[9,"This made it easy to see if someone had shaved the coin.","이것은 누군가 동전을 깎았는지 쉽게 알아볼 수 있게 해 주었다."]],"w":"8번에서 동전이 깎이면 무늬가 망가진다고 했고, 9번에서 그래서 깎았는지 쉽게 알 수 있다고 해요.","c":"T"},"h":"3235ca22b0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A long time ago, coins were made of valuable metals like gold and silver.)","ko":"아주 오래전에, 동전은 금과 은 같은 값비싼 금속으로 만들어졌다.","opts":["흔한","녹슨","값비싼","가벼운"],"word":"valuable","r":{"a":"3) 값비싼","ev":"4~5번 문장","s":[[4,"A long time ago, coins were made of valuable metals like gold and silver.","아주 오래전에, 동전은 금과 은 같은 값비싼 금속으로 만들어졌다."],[5,"Some people tried to steal a little by shaving off the edges.","어떤 사람들은 테두리를 깎아 내어 조금씩 훔치려고 했다."]],"w":"금과 은은 값비싼 금속이에요. 그래서 5번 문장처럼 사람들이 테두리를 깎아 조금씩 훔치려 했어요.","c":3},"h":"dda474c764"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Some people tried to steal a little by shaving off the edges.)","ko":"어떤 사람들은 테두리를 깎아 내어 조금씩 훔치려고 했다.","opts":["깎아 내는","칠하는","붙이는","닦는"],"word":"shaving","r":{"a":"1) 깎아 내는","ev":"5~6번 문장","s":[[5,"Some people tried to steal a little by shaving off the edges.","어떤 사람들은 테두리를 깎아 내어 조금씩 훔치려고 했다."],[6,"This made the coins lighter and worth less.","이것은 동전을 더 가볍게 만들었고 가치도 더 낮게 만들었다."]],"w":"테두리를 shave(깎다)하면 6번 문장처럼 동전이 더 가벼워져요. 칠하거나 붙이면 더 가벼워질 수 없어요.","c":1},"h":"080fcfc7da"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis made the coins lighter and worth less.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 동전을 더 가볍게 만들었고 가치도 더 낮게 만들었다.","opts":["동전을 금과 은으로 만든 것","동전에 무늬를 넣은 것","사람들이 테두리를 깎아 조금씩 훔친 것","오늘날 동전이 가짜로 만들어지는 것"],"r":{"a":"3) 사람들이 테두리를 깎아 조금씩 훔친 것","ev":"5~6번 문장","s":[[5,"Some people tried to steal a little by shaving off the edges.","어떤 사람들은 테두리를 깎아 내어 조금씩 훔치려고 했다."],[6,"This made the coins lighter and worth less.","이것은 동전을 더 가볍게 만들었고 가치도 더 낮게 만들었다."]],"w":"동전이 더 가벼워지고 가치가 낮아진 이유는 테두리를 깎았기 때문이에요. 바로 앞 5번 문장의 내용이에요. 무늬를 넣은 것은 그 뒤인 7번 문장이에요.","c":3},"h":"34c3624108"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They look like a decoration, but these marks have a very smart purpose.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것들은 장식처럼 보이지만, 이 표시들에는 아주 영리한 목적이 있다.","opts":["이 표시들은 장식이라서 아무 쓸모가 없다.","이 표시들은 아주 영리한 사람들이 장식으로 만들었다.","이 표시들은 목적이 있어서 장식으로 보이지 않는다.","이 표시들은 장식처럼 보이지만 사실은 영리한 목적이 있다."],"r":{"a":"4) 이 표시들은 장식처럼 보이지만 사실은 영리한 목적이 있다.","ev":"3번 문장","s":[[3,"They look like a decoration, but these marks have a very smart purpose.","그것들은 장식처럼 보이지만, 이 표시들에는 아주 영리한 목적이 있다."]],"w":"look like a decoration은 장식처럼 보인다는 뜻이고, but 뒤에 아주 영리한 목적이 있다고 이어져요. 장식이라서 쓸모없다는 말은 반대예요.","c":4},"h":"c117478b61"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["테두리를 깎으면 동전이 더 무거워졌다.","오늘날 동전은 값비싼 금속으로만 만들어진다.","테두리 무늬는 오늘날에도 가짜 동전을 막는 데 쓰인다.","테두리 무늬는 오늘날 장식으로만 쓰인다."],"opts":["Shaving the edges made coins heavier.","Today, coins are made only of valuable metals.","Edge patterns are still used today to help stop fake coins.","Edge patterns are used today only as a decoration."],"r":{"a":"3) Edge patterns are still used today to help stop fake coins.","ev":"6, 10~11번 문장","s":[[6,"This made the coins lighter and worth less.","이것은 동전을 더 가볍게 만들었고 가치도 더 낮게 만들었다."],[10,"Today, coins are no longer made of valuable metals.","오늘날 동전은 더 이상 값비싼 금속으로 만들어지지 않는다."],[11,"But edge patterns are still used to help stop fake coins.","하지만 테두리 무늬는 가짜 동전을 막는 데 도움이 되도록 여전히 사용된다."]],"w":"11번에서 테두리 무늬는 가짜 동전을 막는 데 여전히 쓰인다고 해요. 깎으면 더 가벼워지고(6번), 오늘날은 값비싼 금속으로 만들지 않아요(10번).","c":3},"h":"2ed3554591"},{"n":9,"t":"sum","q":"Some people (A) the edges of gold and silver coins, so edge patterns were added that (B) when a coin was shaved.","ko":"어떤 사람들은 금과 은 동전의 테두리를 (A)해서, 동전이 깎이면 (B)하는 테두리 무늬가 더해졌다.","oko":["(A) 칠했다 / (B) 망가진다","(A) 모았다 / (B) 빛난다","(A) 깎았다 / (B) 자란다","(A) 닦았다 / (B) 사라진다","(A) 깎았다 / (B) 망가진다"],"opts":["(A) painted / (B) broke","(A) collected / (B) shined","(A) shaved / (B) grew","(A) polished / (B) disappeared","(A) shaved / (B) broke"],"r":{"a":"5) (A) shaved / (B) broke","ev":"5, 7~8번 문장","s":[[5,"Some people tried to steal a little by shaving off the edges.","어떤 사람들은 테두리를 깎아 내어 조금씩 훔치려고 했다."],[7,"To stop this, people in 17th-century England added patterns to the edges.","이를 막기 위해, 17세기 영국 사람들은 테두리에 무늬를 넣었다."],[8,"When a coin was shaved, the pattern was broken.","동전이 깎이면, 무늬가 망가졌다."]],"w":"5번에서 테두리를 깎았고(shaved), 7번에서 이를 막으려고 무늬를 넣었으며, 8번에서 동전이 깎이면 무늬가 망가진다(was broken)고 해요.","c":5},"h":"36cbc34307"},{"n":10,"t":"fill","q":"Edge patterns made it easy to [A] if a coin had been shaved, and today they help stop [B] coins.","ko":"테두리 무늬는 동전이 깎였는지 쉽게 [A]할 수 있게 해 주었고, 오늘날에는 [B] 동전을 막는 데 도움이 된다.","bank":["see","fake","steal","gold","edges","decoration"],"bko":{"see":"알아보다","fake":"가짜의","steal":"훔치다","gold":"금","edges":"테두리","decoration":"장식"},"r":{"a":"[A] see, [B] fake","ev":"9, 11번 문장","s":[[9,"This made it easy to see if someone had shaved the coin.","이것은 누군가 동전을 깎았는지 쉽게 알아볼 수 있게 해 주었다."],[11,"But edge patterns are still used to help stop fake coins.","하지만 테두리 무늬는 가짜 동전을 막는 데 도움이 되도록 여전히 사용된다."]],"w":"9번 This made it easy to see…에서 see를, 11번 help stop fake coins에서 fake를 가져왔어요. steal은 5번에서 사람들이 한 일이라 이 문장에 맞지 않아요.","c":null},"h":"cd27e00e87"}]},{"u":6,"id":"b1-06-2","no":2,"ko":"로마 곳곳에 선 거대한 돌문의 정체","items":[{"n":1,"t":"tf","q":"The Romans built triumphal arches to celebrate important victories in war.","ko":"로마인들은 전쟁에서의 중요한 승리를 기념하기 위해 개선문을 지었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Long ago, the Romans built them to celebrate important victories in war.","아주 오래전에, 로마인들은 전쟁에서의 중요한 승리를 기념하기 위해 그것들을 지었다."]],"w":"3번 문장에 built them to celebrate important victories in war가 있어요. them은 2번의 triumphal arches예요.","c":"T"},"h":"0826cea084"},{"n":2,"t":"tf","q":"The parade called a triumph lasted for a week.","ko":"개선식이라고 불린 행진은 일주일 동안 이어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"But the parade lasted only one day.","하지만 행진은 단 하루만 지속되었다."]],"w":"7번 문장에서 행진은 단 하루만 지속되었다(lasted only one day)고 해요. 일주일은 틀려요.","c":"F"},"h":"b7b4c7b8d7"},{"n":3,"t":"tf","q":"The carvings on the arches told who won and where the battle happened.","ko":"개선문의 조각은 누가 이겼는지와 전투가 어디에서 일어났는지를 알려 주었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The carvings told who won and where the battle happened.","조각은 누가 이겼는지, 그리고 전투가 어디에서 일어났는지를 알려 주었다."]],"w":"11번 문장에 The carvings told who won and where the battle happened가 그대로 있어요.","c":"T"},"h":"58c32e8ffd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Long ago, the Romans built them to celebrate important victories in war.)","ko":"아주 오래전에, 로마인들은 전쟁에서의 중요한 승리를 기념하기 위해 그것들을 지었다.","opts":["숨기다","기념하다","바꾸다","피하다"],"word":"celebrate","r":{"a":"2) 기념하다","ev":"3번 문장","s":[[3,"Long ago, the Romans built them to celebrate important victories in war.","아주 오래전에, 로마인들은 전쟁에서의 중요한 승리를 기념하기 위해 그것들을 지었다."]],"w":"로마인들이 승리를 기념하려고 개선문을 지었어요. 8번 문장에서도 이 승리를 오래 기억하고 싶어서 그랬다고 해요.","c":2},"h":"a9a0648c28"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They carved words and pictures on them.)","ko":"그들은 그 위에 글과 그림을 새겼다.","opts":["지웠다","칠했다","새겼다","읽었다"],"word":"carved","r":{"a":"3) 새겼다","ev":"10~11번 문장","s":[[10,"They carved words and pictures on them.","그들은 그 위에 글과 그림을 새겼다."],[11,"The carvings told who won and where the battle happened.","조각은 누가 이겼는지, 그리고 전투가 어디에서 일어났는지를 알려 주었다."]],"w":"돌로 만든 개선문에 글과 그림을 새겨서 11번 문장처럼 누가 이겼는지를 알려 줬어요. carve = 새기다.","c":3},"h":"dbfa347235"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey carved words and pictures on them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그들은 그 위에 글과 그림을 새겼다.","opts":["병사들","전투","포로들","개선문"],"r":{"a":"4) 개선문","ev":"9~10번 문장","s":[[9,"So they built triumphal arches.","그래서 그들은 개선문을 지었다."],[10,"They carved words and pictures on them.","그들은 그 위에 글과 그림을 새겼다."]],"w":"글과 그림을 새긴 곳은 바로 앞 9번 문장의 triumphal arches(개선문)예요. 병사나 포로 위에 새길 수는 없어요.","c":4},"h":"6c2923732b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It was like a news report made of stone.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 돌로 만든 뉴스 보도 같았다.","opts":["승리 소식을 돌에 새겨 전하는 것과 같았다.","뉴스 기자가 돌을 모으는 일과 같았다.","돌이 너무 무거워서 뉴스가 되었다.","뉴스에 나온 돌을 보여 주는 것과 같았다."],"r":{"a":"1) 승리 소식을 돌에 새겨 전하는 것과 같았다.","ev":"11~12번 문장","s":[[11,"The carvings told who won and where the battle happened.","조각은 누가 이겼는지, 그리고 전투가 어디에서 일어났는지를 알려 주었다."],[12,"It was like a news report made of stone.","그것은 돌로 만든 뉴스 보도 같았다."]],"w":"11번에서 조각이 누가 이겼는지와 전투 장소를 알려 줬어요. 그래서 12번은 돌에 새긴 뉴스처럼 소식을 전한다는 비유예요.","c":1},"h":"1b581fdcfe"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["로마인들은 전투에서 졌을 때 행진을 열었다.","행진에는 장군만 참여했다.","오늘날에도 개선문은 도시에 서 있다.","로마인들은 행진이 싫어서 개선문을 지었다."],"opts":["The Romans held a parade when they lost a battle.","Only the general marched in the parade.","The arches still stand in the city today.","The Romans built arches because they didn't like parades."],"r":{"a":"3) The arches still stand in the city today.","ev":"4, 6, 13번 문장","s":[[4,"When a Roman general won a big battle, the city held a large parade.","로마 장군이 큰 전투에서 이기면, 도시는 큰 행진을 열었다."],[6,"The general and his soldiers marched through the city with music, animals, treasure, and prisoners.","장군과 그의 병사들은 음악, 동물, 보물, 포로와 함께 도시를 행진했다."],[13,"Today, the arches still stand as a proud part of the city’s history.","오늘날 개선문은 도시 역사의 자랑스러운 일부로 여전히 서 있다."]],"w":"13번에서 개선문이 여전히 서 있다고 해요. 행진은 이겼을 때 열렸고(4번), 장군과 병사들이 함께 행진했어요(6번).","c":3},"h":"5e226325ab"},{"n":9,"t":"sum","q":"Because the (A) lasted only one day, the Romans built triumphal (B) to remember victories for a long time.","ko":"(A)가 단 하루만 지속되었기 때문에, 로마인들은 승리를 오랫동안 기억하기 위해 개선(B)을 지었다.","oko":["(A) 행진 / (B) 시장","(A) 전투 / (B) 문","(A) 아치 / (B) 행진","(A) 병사 / (B) 도시","(A) 행진 / (B) 아치"],"opts":["(A) parade / (B) markets","(A) battle / (B) arches","(A) arch / (B) parade","(A) soldier / (B) cities","(A) parade / (B) arches"],"r":{"a":"5) (A) parade / (B) arches","ev":"7~9번 문장","s":[[7,"But the parade lasted only one day.","하지만 행진은 단 하루만 지속되었다."],[8,"The Romans wanted to remember this victory for a long time.","로마인들은 이 승리를 오랫동안 기억하고 싶었다."],[9,"So they built triumphal arches.","그래서 그들은 개선문을 지었다."]],"w":"7번에서 행진이 하루뿐이었고(parade), 8번에서 승리를 오래 기억하고 싶어서, 9번에서 개선문(arches)을 지었어요.","c":5},"h":"f473dc3c84"},{"n":10,"t":"fill","q":"The carvings told who [A] and where the battle happened. It was like a news report made of [B].","ko":"조각은 누가 [A]했는지와 전투가 어디서 일어났는지를 알려 주었다. 그것은 [B]로 만든 뉴스 보도 같았다.","bank":["won","stone","built","marched","parade","history"],"bko":{"won":"이겼다","stone":"돌","built":"지었다","marched":"행진했다","parade":"행진","history":"역사"},"r":{"a":"[A] won, [B] stone","ev":"11~12번 문장","s":[[11,"The carvings told who won and where the battle happened.","조각은 누가 이겼는지, 그리고 전투가 어디에서 일어났는지를 알려 주었다."],[12,"It was like a news report made of stone.","그것은 돌로 만든 뉴스 보도 같았다."]],"w":"11번 told who won에서 won을, 12번 made of stone에서 stone을 가져왔어요. built나 marched는 조각이 알려 주는 내용이 아니에요.","c":null},"h":"d727af88a8"}]},{"u":6,"id":"b1-06-3","no":3,"ko":"“얼음을 깨다”라는 말은 어디서 왔을까?","items":[{"n":1,"t":"tf","q":"A long time ago, people often traveled by boat.","ko":"아주 오래전에, 사람들은 흔히 배로 이동했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"A long time ago, before modern roads and cars, people often traveled by boat.","아주 오래전, 현대의 도로와 자동차가 생기기 전에는, 사람들이 흔히 배로 이동했다."]],"w":"7번 문장에 people often traveled by boat가 그대로 있어요. 현대의 도로와 자동차가 생기기 전이에요.","c":"T"},"h":"51197cebc7"},{"n":2,"t":"tf","q":"Smaller boats were sent ahead to make the ice thicker.","ko":"더 작은 배들은 얼음을 더 두껍게 만들려고 먼저 보내졌다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Smaller boats were sent ahead to break the ice and clear a path.","더 작은 배들이 얼음을 깨고 길을 내기 위해 먼저 보내졌다."]],"w":"9번 문장에서 작은 배들은 얼음을 깨고 길을 내려고(break the ice and clear a path) 보내졌어요. 얼음을 두껍게 만드는 것은 반대예요.","c":"F"},"h":"e02c1623a2"},{"n":3,"t":"tf","q":"Someone might tell a joke to start a conversation in a quiet room.","ko":"조용한 방에서는 누군가 대화를 시작하려고 농담을 할지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"The room is quiet and everyone seems a little nervous.","교실은 조용하고 모두가 조금 긴장한 것처럼 보인다."],[4,"In this situation, someone might tell a joke or ask a simple question to start a conversation.","이런 상황에서, 누군가는 대화를 시작하려고 농담을 하거나 간단한 질문을 할지도 모른다."]],"w":"3번에서 방이 조용하고 모두 긴장해 보인다고 했고, 4번에서 누군가 농담을 하거나 질문을 해 대화를 시작할 수 있다고 해요.","c":"T"},"h":"9a12575dcd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The room is quiet and everyone seems a little nervous.)","ko":"교실은 조용하고 모두가 조금 긴장한 것처럼 보인다.","opts":["편안한","긴장한","화난","졸린"],"word":"nervous","r":{"a":"2) 긴장한","ev":"3~4번 문장","s":[[3,"The room is quiet and everyone seems a little nervous.","교실은 조용하고 모두가 조금 긴장한 것처럼 보인다."],[4,"In this situation, someone might tell a joke or ask a simple question to start a conversation.","이런 상황에서, 누군가는 대화를 시작하려고 농담을 하거나 간단한 질문을 할지도 모른다."]],"w":"첫날의 조용한 교실이라 모두 긴장해 보여요. 그래서 4번에서 농담이나 질문으로 어색함을 풀어요.","c":2},"h":"9b474ce609"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This helped other ships continue their journey.)","ko":"이것은 다른 배들이 여행을 계속하도록 도왔다.","opts":["위험","계절","여행","약속"],"word":"journey","r":{"a":"3) 여행","ev":"9~10번 문장","s":[[9,"Smaller boats were sent ahead to break the ice and clear a path.","더 작은 배들이 얼음을 깨고 길을 내기 위해 먼저 보내졌다."],[10,"This helped other ships continue their journey.","이것은 다른 배들이 여행을 계속하도록 도왔다."]],"w":"작은 배들이 길을 내 준 덕분에 다른 배들이 계속 가야 할 길, 곧 여행(여정)을 이어 갈 수 있었어요.","c":3},"h":"2e8ba748a5"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis helped other ships continue their journey.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 다른 배들이 여행을 계속하도록 도왔다.","opts":["강이 얼어붙은 것","배들이 움직일 수 없었던 것","추운 겨울이 온 것","작은 배들이 얼음을 깨고 길을 낸 것"],"r":{"a":"4) 작은 배들이 얼음을 깨고 길을 낸 것","ev":"9~10번 문장","s":[[9,"Smaller boats were sent ahead to break the ice and clear a path.","더 작은 배들이 얼음을 깨고 길을 내기 위해 먼저 보내졌다."],[10,"This helped other ships continue their journey.","이것은 다른 배들이 여행을 계속하도록 도왔다."]],"w":"다른 배들에게 도움이 된 것은 바로 앞 9번의 작은 배들의 일이에요. 얼어붙은 강이나 겨울은 문제 상황이라 도움이 될 수 없어요.","c":4},"h":"008f2fa614"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Just like those boats, a kind word or joke can help start things off and make people feel at ease.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 배들처럼, 친절한 말이나 농담은 일을 시작하게 하고 사람들을 편안하게 해 줄 수 있다.","opts":["그 배들처럼, 친절한 말이나 농담은 일을 시작하게 하고 사람들을 편안하게 해 줄 수 있다.","그 배들과 달리, 농담은 사람들을 불편하게 만들 수 있다.","그 배들처럼, 친절한 말은 사람들을 얼음 위로 보낸다.","그 배들처럼, 농담은 일을 끝내고 사람들을 집으로 보낸다."],"r":{"a":"1) 그 배들처럼, 친절한 말이나 농담은 일을 시작하게 하고 사람들을 편안하게 해 줄 수 있다.","ev":"9, 12번 문장","s":[[9,"Smaller boats were sent ahead to break the ice and clear a path.","더 작은 배들이 얼음을 깨고 길을 내기 위해 먼저 보내졌다."],[12,"Just like those boats, a kind word or joke can help start things off and make people feel at ease.","그 배들처럼, 친절한 말이나 농담은 일을 시작하게 하고 사람들을 편안하게 해 줄 수 있다."]],"w":"작은 배들이 길을 열어 준 것(9번)처럼, 친절한 말이나 농담이 시작을 돕고 사람들을 편안하게 한다는 뜻이에요(12번). 불편하게 한다는 말은 반대예요.","c":1},"h":"9d44fe6da9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["첫날 교실에서 모두가 즐겁게 이야기하고 있었다.","나중에 사람들은 사회적 상황에서 이 표현을 쓰기 시작했다.","강은 여름에 얼어서 배가 움직일 수 없었다.","더 큰 배들이 얼음을 깨려고 먼저 보내졌다."],"opts":["Everyone in the class was talking happily on the first day.","Later, people began using the phrase in social situations.","Rivers froze in summer, so ships couldn't move.","Larger boats were sent ahead to break the ice."],"r":{"a":"2) Later, people began using the phrase in social situations.","ev":"3, 8~9, 11번 문장","s":[[3,"The room is quiet and everyone seems a little nervous.","교실은 조용하고 모두가 조금 긴장한 것처럼 보인다."],[8,"In winter, rivers froze and ships couldn’t move.","겨울에는 강이 얼어서 배들이 움직일 수 없었다."],[9,"Smaller boats were sent ahead to break the ice and clear a path.","더 작은 배들이 얼음을 깨고 길을 내기 위해 먼저 보내졌다."],[11,"Later, people began using the phrase “break the ice” in social situations.","나중에 사람들은 사회적 상황에서 “얼음을 깨다”라는 표현을 쓰기 시작했다."]],"w":"11번에서 나중에 사람들이 사회적 상황에서 이 표현을 쓰기 시작했다고 해요. 교실은 조용했고(3번), 강은 겨울에 얼었으며(8번), 먼저 간 것은 더 작은 배들이에요(9번).","c":2},"h":"4c2c496541"},{"n":9,"t":"sum","q":"The phrase “break the ice” began with small (A) that cleared a path through frozen rivers, and now it is used to help people feel (B).","ko":"“break the ice”라는 표현은 얼어붙은 강에서 길을 낸 작은 (A)에서 시작되었고, 지금은 사람들이 (B)하게 느끼도록 돕는 데 쓰인다.","oko":["(A) 자동차 / (B) 긴장","(A) 배 / (B) 긴장","(A) 도로 / (B) 편안","(A) 큰 배 / (B) 화남","(A) 배 / (B) 편안"],"opts":["(A) cars / (B) nervous","(A) boats / (B) nervous","(A) roads / (B) comfortable","(A) ships / (B) angry","(A) boats / (B) comfortable"],"r":{"a":"5) (A) boats / (B) comfortable","ev":"9, 11~12번 문장","s":[[9,"Smaller boats were sent ahead to break the ice and clear a path.","더 작은 배들이 얼음을 깨고 길을 내기 위해 먼저 보내졌다."],[11,"Later, people began using the phrase “break the ice” in social situations.","나중에 사람들은 사회적 상황에서 “얼음을 깨다”라는 표현을 쓰기 시작했다."],[12,"Just like those boats, a kind word or joke can help start thi
