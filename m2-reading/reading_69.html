var D=[{"n": 1, "tag": null, "en": "National parks are special places for preserve nature. They keep many animal and plant species safe.", "ko": "국립 공원은 자연을 보존하기 위한 특별한 장소입니다. 그곳들은 많은 동물과 식물종을 안전하게 지켜 줍니다.", "ok": false, "foot": [], "fixes": [{"wrong": "preserve", "right": "preserving", "partial": false, "at": [6], "point": "전치사 뒤 동명사: 전치사 for 뒤에는 동명사 preserving", "topic": "전치사 뒤 동명사", "memo": "전치사 for 뒤에는 동명사 preserving"}]}, {"n": 2, "tag": null, "en": "At the same time, they let people enjoy the beauty of nature. Let's take a look at two famous national parks in South America and Africa.", "ko": "동시에 그곳들은 사람들이 자연의 아름다움을 즐기도록 해 줍니다. 남미와 아프리카의 유명한 두 국립 공원을 살펴봅시다.", "ok": true, "foot": [], "fixes": []}, {"n": 3, "tag": "칠레 · 토레스 델 파이네", "en": "Can you believe you can experiencing four seasons in one day? Torres del Paine National Park in Chile are the perfect place for this.", "ko": "하루에 사계절을 경험할 수 있다는 것을 믿을 수 있나요? 칠레의 토레스 델 파이네 국립 공원은 이것을 위한 완벽한 장소입니다.", "ok": false, "foot": [], "fixes": [{"wrong": "experiencing", "right": "experience", "partial": false, "at": [5], "point": "조동사 + 동사원형: 조동사 can 뒤에는 동사원형 experience", "topic": "조동사 + 동사원형", "memo": "조동사 can 뒤에는 동사원형 experience"}, {"wrong": "are", "right": "is", "partial": false, "at": [18], "point": "주어와 동사의 수일치: 주어 Torres del Paine National Park는 단수라 is", "topic": "주어와 동사의 수일치", "memo": "주어 Torres del Paine National Park는 단수라 is"}]}, {"n": 4, "tag": null, "en": "It is famous to its dynamic weather. It can be sunny, rainy, or snowy in a single day!", "ko": "그곳은 역동적인 날씨로 유명합니다. 단 하루 안에 맑을 수도, 비가 올 수도, 또는 눈이 내릴 수도 있습니다!", "ok": false, "foot": [], "fixes": [{"wrong": "to", "right": "for", "partial": false, "at": [3], "point": "전치사: be famous for: ~로 유명하다", "topic": "전치사", "memo": "be famous for: ~로 유명하다"}]}, {"n": 5, "tag": null, "en": "Also, you can see mountains, lakes, and even a big ice field in this park.", "ko": "또한, 이 공원에서는 산, 호수, 그리고 심지어 큰 빙원을 볼 수 있습니다.", "ok": true, "foot": [], "fixes": []}, {"n": 6, "tag": null, "en": "For example, Grey Glacier, one of the most wonderful glacier in Chile, welcomes you in the park. It is exciting walk on the glacier and enjoy the icy view.", "ko": "예를 들어, 칠레에서 가장 멋진 빙하 중 하나인 그레이 빙하가 공원에서 여러분을 환영합니다. 빙하 위를 걷고 얼음에 뒤덮인 경치를 즐기는 것은 흥미진진합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "glacier", "right": "glaciers", "partial": false, "at": [9], "point": "one of + 복수명사: one of the most wonderful 뒤에는 복수명사", "topic": "one of + 복수명사", "memo": "one of the most wonderful 뒤에는 복수명사"}, {"wrong": "walk", "right": "to walk", "partial": false, "at": [20], "point": "가주어 it과 진주어 to부정사: It is exciting 뒤의 진주어는 to walk", "topic": "가주어 it과 진주어 to부정사", "memo": "It is exciting 뒤의 진주어는 to walk"}]}, {"n": 7, "tag": "자연 보존 노력", "en": "The park is making efforts preserve its natural beauty. First, it controls the number of visitors, so they should book to enter the park.", "ko": "그 공원은 자연의 아름다움을 보존하기 위해 노력하고 있습니다. 첫째, 그곳은 방문객의 수를 통제해서 방문객들은 공원에 들어가기 위해 예약을 해야 합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "preserve", "right": "to preserve", "partial": false, "at": [5], "point": "to부정사의 형용사적 용법: efforts를 꾸며 주는 to부정사 to preserve", "topic": "to부정사의 형용사적 용법", "memo": "efforts를 꾸며 주는 to부정사 to preserve"}]}, {"n": 8, "tag": null, "en": "Second, only some park trails open to visitors for hiking. Third, the park makes visitors to take their trash with them when they leave.", "ko": "둘째, 공원의 일부 산책로만 방문객들에게 하이킹용으로 개방되어 있습니다. 셋째, 그 공원은 방문객들이 떠날 때 그들의 쓰레기를 가져가게 합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "open", "right": "are open", "partial": false, "at": [5], "point": "be동사 생략 오류: 문장에 동사가 없으므로 are open", "topic": "be동사 생략 오류", "memo": "문장에 동사가 없으므로 are open"}, {"wrong": "to take", "right": "take", "partial": false, "at": [15], "point": "사역동사 make: make + 목적어 + 동사원형", "topic": "사역동사 make", "memo": "make + 목적어 + 동사원형"}]}, {"n": 9, "tag": null, "en": "There's one more thing: the hotels in the park does not use plastic and only use eco-friendly products.", "ko": "한 가지가 더 있습니다: 공원 내 호텔들은 플라스틱을 사용하지 않고 친환경 제품만 사용합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "does", "right": "do", "partial": false, "at": [9], "point": "주어와 동사의 수일치: 주어 the hotels는 복수라 do", "topic": "주어와 동사의 수일치", "memo": "주어 the hotels는 복수라 do"}]}, {"n": 10, "tag": "남아공 · 크루거", "en": "Have you hear about the Big Five? They are lions, leopards, elephants, rhinos, and buffaloes.", "ko": "빅 파이브에 대해 들어 본 적이 있나요? 그것들은 사자, 표범, 코끼리, 코뿔소, 그리고 버팔로입니다.", "ok": false, "foot": [], "fixes": [{"wrong": "hear", "right": "heard", "partial": false, "at": [2], "point": "현재완료: Have you + 과거분사 heard", "topic": "현재완료", "memo": "Have you + 과거분사 heard"}]}, {"n": 11, "tag": null, "en": "You can see them all in Kruger National Park in South Africa. Many wild animals moves around this park freely.", "ko": "여러분은 이 모든 동물들을 남아프리카 공화국의 크루거 국립 공원에서 볼 수 있습니다. 많은 야생 동물들이 이 공원에서 자유롭게 돌아다닙니다.", "ok": false, "foot": [], "fixes": [{"wrong": "moves", "right": "move", "partial": false, "at": [15], "point": "주어와 동사의 수일치: 주어 Many wild animals는 복수라 move", "topic": "주어와 동사의 수일치", "memo": "주어 Many wild animals는 복수라 move"}]}, {"n": 12, "tag": null, "en": "If you will be lucky, you can see rhinos which are sleeping under baobab trees.", "ko": "운이 좋으면, 바오밥 나무 아래에서 자고 있는 코뿔소를 볼 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "will be", "right": "are", "partial": false, "at": [2], "point": "조건 부사절의 시제: 조건 부사절에서는 미래를 현재형으로 씀", "topic": "조건 부사절의 시제", "memo": "조건 부사절에서는 미래를 현재형으로 씀"}]}, {"n": 13, "tag": null, "en": "However, the Big Five are in danger because too much hunting. To protect the Big Five, the park has being a “no-hunting” area from the start.", "ko": "하지만, 빅 파이브는 너무 많은 사냥 때문에 위험에 처해 있습니다. 빅 파이브를 보호하기 위해서 그 공원은 처음부터 ‘사냥 금지’ 지역이었습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "because", "right": "because of", "partial": false, "at": [7], "point": "전치사구: 뒤에 명사구(too much hunting)가 오므로 because of", "topic": "전치사구", "memo": "뒤에 명사구(too much hunting)가 오므로 because of"}, {"wrong": "being", "right": "been", "partial": false, "at": [19], "point": "현재완료: have/has + 과거분사 been", "topic": "현재완료", "memo": "have/has + 과거분사 been"}]}, {"n": 14, "tag": null, "en": "These days, drones and helicopters used to monitor hunting activities. Also, the park runs many nature volunteer programs.", "ko": "요즘에는 드론과 헬리콥터가 사냥 활동을 감시하는 데 사용됩니다. 또한, 그 공원은 많은 자연 자원봉사 프로그램을 운영합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "used", "right": "are used", "partial": false, "at": [5], "point": "수동태: 드론과 헬리콥터가 '사용되는' 것이라 are used", "topic": "수동태", "memo": "드론과 헬리콥터가 '사용되는' 것이라 are used"}]}, {"n": 15, "tag": null, "en": "Volunteers monitor signs of illegal hunting activities and remove animal traps.", "ko": "자원봉사자들은 불법 사냥 활동의 징후를 관찰하고 동물 덫을 제거합니다.", "ok": true, "foot": [], "fixes": []}, {"n": 16, "tag": null, "en": "National parks preserve the Earth's past, present, and future. Thanks to them, future generations will also able to experience many natural wonders.", "ko": "국립 공원은 지구의 과거, 현재, 그리고 미래를 보존합니다. 그곳들 덕분에 미래 세대 또한 많은 자연의 경이로움을 경험할 수 있을 것입니다.", "ok": false, "foot": [], "fixes": [{"wrong": "able", "right": "be able", "partial": false, "at": [16], "point": "조동사 will + be able to: will 뒤에는 동사원형 be가 필요", "topic": "조동사 will + be able to", "memo": "will 뒤에는 동사원형 be가 필요"}]}];var PP=[["National parks are special places for preserving nature.", "국립 공원은 자연을 보존하기 위한 특별한 장소입니다.", 1], ["They keep many animal and plant species safe.", "그곳들은 많은 동물과 식물종을 안전하게 지켜 줍니다.", 0], ["At the same time, they let people enjoy the beauty of nature.", "동시에 그곳들은 사람들이 자연의 아름다움을 즐기도록 해 줍니다.", 0], ["Let's take a look at two famous national parks in South America and Africa.", "남미와 아프리카의 유명한 두 국립 공원을 살펴봅시다.", 0], ["Exploring the Dynamic Nature – Torres del Paine National Park", "역동적인 자연 탐험하기 – 토레스 델 파이네 국립 공원", 1], ["Can you believe you can experience four seasons in one day?", "하루에 사계절을 경험할 수 있다는 것을 믿을 수 있나요?", 0], ["Torres del Paine National Park in Chile is the perfect place for this.", "칠레의 토레스 델 파이네 국립 공원은 이것을 위한 ", 0], ["To protect the Big Five, the park has been a “no-hunting” area from the start.", "빅 파이브를 보호하기 위해서 그 공원은 처음부터 ‘사냥 금지’ 지역이었습니다.", 0], ["These days, drones and helicopters are used to monitor hunting activities.", "요즘에는 드론과 헬리콥터가 사냥 활동을 감시하는 데 사용됩니다.", 0], ["Also, the park runs many nature volunteer programs.", "또한, 그 공원은 많은 자연 자원봉사 프로그램을 운영합니다.", 0], ["Volunteers monitor signs of illegal hunting activities and remove animal traps.", "자원봉사자들은 불법 사냥 활동의 징후를 관찰하고 동물 덫을 제거합니다.", 0], ["National parks preserve the Earth's past, present, and future.", "국립 공원은 지구의 과거, 현재, 그리고 미래를 보존합니다.", 0], ["Thanks to them, future generations will also be able to experience many natural wonders.", "그곳들 덕분에 미래 세대 또한 많은 자연의 경이로움을 경험할 수 있을 것입니다.", 0]];var RNUM=69;var TITLE_EN="Wild Wonderlands";var PASS_EN=["Wild Wonderlands", "National parks are special places for preserving nature. They keep many animal and plant species safe. At the same time, they let people enjoy the beauty of nature. Let's take a look at two famous national parks in South America and Africa.", "Exploring the Dynamic Nature – Torres del Paine National Park", "Can you believe you can experience four seasons in one day? Torres del Paine National Park in Chile is the perfect place for this. It is famous for its dynamic weather. It can be sunny, rainy, or snowy in a single day! Also, you can see mountains, lakes, and even a big ice field in this park. For example, Grey Glacier, one of the most wonderful glaciers in Chile, welcomes you in the park. It is exciting to walk on the glacier and enjoy the icy view.", "Efforts to Preserve Nature", "The park is making efforts to preserve its natural beauty. First, it controls the number of visitors, so they should book to enter the park. Second, only some park trails are open to visitors for hiking. Third, the park makes visitors take their trash with them when they leave. There's one more thing: the hotels in the park do not use plastic and only use eco-friendly products.", "Discovering the Big Five – Kruger National Park", "Have you heard about the Big Five? They are lions, leopards, elephants, rhinos, and buffaloes. You can see them all in Kruger National Park in South Africa. Many wild animals move around this park freely. If you are lucky, you can see rhinos which are sleeping under baobab trees. However, the Big Five are in danger because of too much hunting. To protect the Big Five, the park has been a “no-hunting” area from the start. These days, drones and helicopters are used to monitor hunting activities. Also, the park runs many nature volunteer programs. Volunteers monitor signs of illegal hunting activities and remove animal traps. National parks preserve the Earth's past, present, and future. Thanks to them, future generations will also be able to experience many natural wonders."];var PASS_KO=["야생의 아주 멋진 곳", "국립 공원은 자연을 보존하기 위한 특별한 장소입니다. 그곳들은 많은 동물과 식물종을 안전하게 지켜 줍니다. 동시에 그곳들은 사람들이 자연의 아름다움을 즐기도록 해 줍니다. 남미와 아프리카의 유명한 두 국립 공원을 살펴봅시다.", "역동적인 자연 탐험하기 – 토레스 델 파이네 국립 공원", "하루에 사계절을 경험할 수 있다는 것을 믿을 수 있나요? 칠레의 토레스 델 파이네 국립 공원은 이것을 위한 완벽한 장소입니다. 그곳은 역동적인 날씨로 유명합니다. 단 하루 안에 맑을 수도, 비가 올 수도, 또는 눈이 내릴 수도 있습니다! 또한, 이 공원에서는 산, 호수, 그리고 심지어 큰 빙원을 볼 수 있습니다. 예를 들어, 칠레에서 가장 멋진 빙하 중 하나인 그레이 빙하가 공원에서 여러분을 환영합니다. 빙하 위를 걷고 얼음에 뒤덮인 경치를 즐기는 것은 흥미진진합니다.", "자연 보존을 위한 노력", "그 공원은 자연의 아름다움을 보존하기 위해 노력하고 있습니다. 첫째, 그곳은 방문객의 수를 통제해서 방문객들은 공원에 들어가기 위해 예약을 해야 합니다. 둘째, 공원의 일부 산책로만 방문객들에게 하이킹용으로 개방되어 있습니다. 셋째, 그 공원은 방문객들이 떠날 때 그들의 쓰레기를 가져가게 합니다. 한 가지가 더 있습니다: 공원 내 호텔들은 플라스틱을 사용하지 않고 친환경 제품만 사용합니다.", "빅 파이브 발견하기 – 크루거 국립 공원", "빅 파이브에 대해 들어 본 적이 있나요? 그것들은 사자, 표범, 코끼리, 코뿔소, 그리고 버팔로입니다. 여러분은 이 모든 동물들을 남아프리카 공화국의 크루거 국립 공원에서 볼 수 있습니다. 많은 야생 동물들이 이 공원에서 자유롭게 돌아다닙니다. 운이 좋으면, 바오밥 나무 아래에서 자고 있는 코뿔소를 볼 수 있습니다. 하지만, 빅 파이브는 너무 많은 사냥 때문에 위험에 처해 있습니다. 빅 파이브를 보호하기 위해서 그 공원은 처음부터 ‘사냥 금지’ 지역이었습니다. 요즘에는 드론과 헬리콥터가 사냥 활동을 감시하는 데 사용됩니다. 또한, 그 공원은 많은 자연 자원봉사 프로그램을 운영합니다. 자원봉사자들은 불법 사냥 활동의 징후를 관찰하고 동물 덫을 제거합니다. 국립 공원은 지구의 과거, 현재, 그리고 미래를 보존합니다. 그곳들 덕분에 미래 세대 또한 많은 자연의 경이로움을 경험할 수 있을 것입니다."];var BG=[{"qs": [{"n": 6, "q": "윗글의 내용과 일치하지 않는 것은?", "o": ["Torres del Paine National Park is located in Chile.", "Walking on Grey Glacier is not allowed.", "People can see mountains, lakes, and an ice field in the park.", "The weather can change a lot in a single day in the park.", "Grey Glacier is one of the glaciers in Chile."], "a": 1, "ans": "Walking on Grey Glacier is not allowed.", "ko": ["토레스 델 파이네 국립 공원은 칠레에 있다.", "그레이 빙하 위를 걷는 것은 허용되지 않는다.", "사람들은 공원에서 산, 호수, 빙원을 볼 수 있다.", "공원에서는 하루 안에 날씨가 크게 바뀔 수 있다.", "그레이 빙하는 칠레의 빙하 중 하나이다."], "evs": [["It is exciting to walk on the glacier and enjoy the icy view.", "빙하 위를 걷고 얼음에 뒤덮인 경치를 즐기는 것은 흥미진진합니다."]], "ow": ["오답 ✕ — 'Torres del Paine National Park in Chile'(칠레의 토레스 델 파이네 국립 공원)라고 했으므로 일치.", "정답 ○ — 'It is exciting to walk on the glacier'(빙하 위를 걷는 것은 흥미진진하다)라고 했으므로 걷는 것이 허용되지 않는다는 말은 일치하지 않는다.", "오답 ✕ — 'you can see mountains, lakes, and even a big ice field'(산, 호수, 큰 빙원을 볼 수 있다)라고 했으므로 일치.", "오답 ✕ — 'It can be sunny, rainy, or snowy in a single day!'(하루 안에 맑거나 비가 오거나 눈이 올 수 있다)라고 했으므로 일치.", "오답 ✕ — 'one of the most wonderful glaciers in Chile'(칠레에서 가장 멋진 빙하 중 하나)라고 했으므로 일치."], "memo": ["정답 ②: 그레이 빙하 위를 걷는 것은 흥미진진한 체험이다.", "근거: It is exciting to walk on the glacier and enjoy the icy view.(빙하 위를 걷고 얼음에 뒤덮인 경치를 즐기는 것은 흥미진진합니다.)", "함정: 일치하지 않는 것 찾기! 걷는 것이 가능한 체험인데 금지라고 바꿔 놓음"], "why": "빙하 위를 걷는 것은 이 공원의 흥미진진한 체험이다.", "ev": ["It is exciting to walk on the glacier and enjoy the icy view.", "빙하 위를 걷고 얼음에 뒤덮인 경치를 즐기는 것은 흥미진진합니다."]}, {"n": 7, "q": "윗글의 빈칸에 들어갈 말로 알맞은 것은?   It is exciting to walk on the glacier and enjoy the ________ view.", "o": ["warm", "sandy", "grassy", "icy", "muddy"], "a": 3, "ans": "icy", "ko": ["따뜻한", "모래로 덮인", "풀이 무성한", "얼음에 뒤덮인", "진흙투성이의"], "evs": [["Also, you can see mountains, lakes, and even a big ice field in this park.", "또한, 이 공원에서는 산, 호수, 그리고 심지어 큰 빙원을 볼 수 있습니다."]], "ow": ["오답 ✕ — warm은 '따뜻한'이다. 빙하 경치와 어울리지 않는다.", "오답 ✕ — sandy는 '모래로 덮인'이다. 빙하는 모래가 아니라 얼음이다.", "오답 ✕ — grassy는 '풀이 무성한'이다. 빙하 위에는 풀이 없다.", "정답 ○ — 'Grey Glacier'(그레이 빙하)와 'a big ice field'(큰 빙원)가 나오므로 얼음에 뒤덮인 경치, 즉 icy가 알맞다.", "오답 ✕ — muddy는 '진흙투성이의'이다. 빙하 경치와 맞지 않는다."], "memo": ["정답 ④: icy(얼음에 뒤덮인)", "근거: Grey Glacier ... a big ice field(그레이 빙하, 큰 빙원)", "함정: 빙하는 얼음! warm, sandy, grassy, muddy는 모두 어울리지 않음 ✕"], "why": "빙하의 경치는 얼음에 뒤덮인 모습이다.", "ev": ["Also, you can see mountains, lakes, and even a big ice field in this park.", "또한, 이 공원에서는 산, 호수, 그리고 심지어 큰 빙원을 볼 수 있습니다."]}], "pp": [["Exploring the Dynamic Nature – Torres del Paine National Park", "역동적인 자연 탐험하기 – 토레스 델 파이네 국립 공원"], ["Can you believe you can experience four seasons in one day?", "하루에 사계절을 경험할 수 있다는 것을 믿을 수 있나요?"], ["Torres del Paine National Park in Chile is the perfect place for this.", "칠레의 토레스 델 파이네 국립 공원은 이것을 위한 완벽한 장소입니다."], ["It is famous for its dynamic weather.", "그곳은 역동적인 날씨로 유명합니다."], ["It can be sunny, rainy, or snowy in a single day!", "단 하루 안에 맑을 수도, 비가 올 수도, 또는 눈이 내릴 수도 있습니다!"], ["Also, you can see mountains, lakes, and even a big ice field in this park.", "또한, 이 공원에서는 산, 호수, 그리고 심지어 큰 빙원을 볼 수 있습니다."], ["For example, Grey Glacier, one of the most wonderful glaciers in Chile, welcomes you in the park.", "예를 들어, 칠레에서 가장 멋진 빙하 중 하나인 그레이 빙하가 공원에서 여러분을 환영합니다."], ["It is exciting to walk on the glacier and enjoy the icy view.", "빙하 위를 걷고 얼음에 뒤덮인 경치를 즐기는 것은 흥미진진합니다."]]}, {"qs": [{"n": 8, "q": "윗글의 제목으로 알맞은 것은?", "o": ["The Best Hotels Near the Park", "Eco-Friendly Efforts in the World", "Recommendation for Hiking Trails", "Guideline for Booking a Visit to the Park", "How the Park Protects Its Natural Beauty"], "a": 4, "ans": "How the Park Protects Its Natural Beauty", "ko": ["공원 근처의 최고의 호텔들", "세계의 친환경 노력", "하이킹 코스 추천", "공원 방문 예약 안내", "공원은 자연의 아름다움을 어떻게 지킬까"], "evs": [["The park is making efforts to preserve its natural beauty.", "그 공원은 자연의 아름다움을 보존하기 위해 노력하고 있습니다."]], "ow": ["오답 ✕ — 'the hotels in the park do not use plastic'(공원 내 호텔은 플라스틱을 쓰지 않는다)는 일부일 뿐, 호텔 추천 글이 아니다.", "오답 ✕ — 세계의 노력이 아니라 한 공원의 노력을 다룬다.", "오답 ✕ — 'only some park trails are open'(일부 산책로만 개방)은 일부일 뿐, 추천 글이 아니다.", "오답 ✕ — 'they should book to enter the park'(예약을 해야 한다)는 일부일 뿐이다.", "정답 ○ — 예약으로 방문객 수 통제, 일부 산책로만 개방, 쓰레기 되가져가기, 친환경 호텔 등 공원이 자연의 아름다움을 지키는 방법을 소개한다."], "memo": ["정답 ⑤: How the Park Protects Its Natural Beauty(공원은 자연의 아름다움을 어떻게 지킬까)", "근거: The park is making efforts to preserve its natural beauty.(그 공원은 자연의 아름다움을 보존하기 위해 노력하고 있습니다.)", "함정: 예약, 산책로, 호텔은 모두 보존 노력의 예시일 뿐 ✕"], "why": "공원의 여러 보존 노력을 소개하는 글이다.", "ev": ["The park is making efforts to preserve its natural beauty.", "그 공원은 자연의 아름다움을 보존하기 위해 노력하고 있습니다."]}], "pp": [["Efforts to Preserve Nature", "자연 보존을 위한 노력"], ["The park is making efforts to preserve its natural beauty.", "그 공원은 자연의 아름다움을 보존하기 위해 노력하고 있습니다."], ["First, it controls the number of visitors, so they should book to enter the park.", "첫째, 그곳은 방문객의 수를 통제해서 방문객들은 공원에 들어가기 위해 예약을 해야 합니다."], ["Second, only some park trails are open to visitors for hiking.", "둘째, 공원의 일부 산책로만 방문객들에게 하이킹용으로 개방되어 있습니다."], ["Third, the park makes visitors take their trash with them when they leave.", "셋째, 그 공원은 방문객들이 떠날 때 그들의 쓰레기를 가져가게 합니다."], ["There's one more thing: the hotels in the park do not use plastic and only use eco-friendly products.", "한 가지가 더 있습니다: 공원 내 호텔들은 플라스틱을 사용하지 않고 친환경 제품만 사용합니다."]]}, {"qs": [{"n": 9, "q": "윗글의 내용과 일치하지 않는 것은?", "o": ["The Big Five animals live in Kruger National Park.", "People can see rhinos sleep under baobab trees.", "The park has recently changed to a “no-hunting” area.", "Drones and helicopters watch hunting to protect the Big Five.", "The park has volunteer programs that help stop illegal hunting activities."], "a": 2, "ans": "The park has recently changed to a “no-hunting” area.", "ko": ["빅 파이브 동물들은 크루거 국립 공원에 산다.", "사람들은 바오밥 나무 아래에서 자는 코뿔소를 볼 수 있다.", "그 공원은 최근에 ‘사냥 금지’ 지역으로 바뀌었다.", "드론과 헬리콥터가 빅 파이브를 보호하기 위해 사냥을 감시한다.", "그 공원에는 불법 사냥을 막는 것을 돕는 자원봉사 프로그램이 있다."], "evs": [["To protect the Big Five, the park has been a “no-hunting” area from the start.", "빅 파이브를 보호하기 위해서 그 공원은 처음부터 ‘사냥 금지’ 지역이었습니다."]], "ow": ["오답 ✕ — 'You can see them all in Kruger National Park'(이 모든 동물들을 크루거 국립 공원에서 볼 수 있다)라고 했으므로 일치.", "오답 ✕ — 'you can see rhinos which are sleeping under baobab trees'(바오밥 나무 아래에서 자고 있는 코뿔소를 볼 수 있다)라고 했으므로 일치.", "정답 ○ — 'has been a no-hunting area from the start'(처음부터 사냥 금지 지역이었다)이므로 최근에 바뀌었다는 말은 일치하지 않는다.", "오답 ✕ — 'drones and helicopters are used to monitor hunting activities'(드론과 헬리콥터가 사냥 활동을 감시하는 데 사용된다)라고 했으므로 일치.", "오답 ✕ — 'Volunteers monitor signs of illegal hunting activities and remove animal traps.'(자원봉사자들은 불법 사냥의 징후를 관찰하고 덫을 제거한다.)라고 했으므로 일치."], "memo": ["정답 ③: 공원은 처음부터 사냥 금지 지역이었다.", "근거: To protect the Big Five, the park has been a “no-hunting” area from the start.(빅 파이브를 보호하기 위해서 그 공원은 처음부터 ‘사냥 금지’ 지역이었다.)", "함정: 일치하지 않는 것 찾기! from the start(처음부터)를 recently(최근에)로 바꿔 놓음"], "why": "공원은 처음부터 사냥 금지 지역이었다.", "ev": ["To protect the Big Five, the park has been a “no-hunting” area from the start.", "빅 파이브를 보호하기 위해서 그 공원은 처음부터 ‘사냥 금지’ 지역이었습니다."]}, {"n": 10, "q": "다음은 윗글 전체를 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?", "sum": "To protect the Big Five, Kruger National Park has been a (A)________ area from the start, and volunteers (B)________ signs of illegal hunting.", "lab": "완성된 요약문 : ", "o": ["no-hunting - monitor", "hunting - monitor", "no-hunting - ignore", "tourist - remove", "no-hunting - allow"], "a": 0, "ans": "no-hunting - monitor", "ko": ["사냥 금지 - 감시하다", "사냥 - 감시하다", "사냥 금지 - 무시하다", "관광 - 제거하다", "사냥 금지 - 허락하다"], "evs": [["To protect the Big Five, the park has been a “no-hunting” area from the start.", "빅 파이브를 보호하기 위해서 그 공원은 처음부터 ‘사냥 금지’ 지역이었습니다."], ["Volunteers monitor signs of illegal hunting activities and remove animal traps.", "자원봉사자들은 불법 사냥 활동의 징후를 관찰하고 동물 덫을 제거합니다."]], "ow": ["정답 ○ — 'a no-hunting area from the start'(처음부터 사냥 금지 지역)이므로 (A)는 no-hunting, 'Volunteers monitor signs'(자원봉사자들은 징후를 관찰한다)이므로 (B)는 monitor이다.", "오답 ✕ — 빅 파이브를 보호하기 위해 사냥을 금지한 곳이지 사냥하는 곳이 아니다. (B) monitor는 맞다.", "오답 ✕ — (A) no-hunting은 맞지만, 자원봉사자들은 징후를 무시하지 않고 관찰한다.", "오답 ✕ — 관광지로 만든다는 내용이 아니며, 징후를 제거하는 것이 아니라 관찰하고 덫을 제거한다.", "오답 ✕ — (A) no-hunting은 맞지만, 자원봉사자들은 불법 사냥을 허락하지 않고 감시한다."], "memo": ["정답 ①: no-hunting(사냥 금지) - monitor(감시하다)", "근거: Volunteers monitor signs of illegal hunting activities and remove animal traps.(자원봉사자들은 불법 사냥 활동의 징후를 관찰하고 동물 덫을 제거한다.)", "함정: 사냥을 허락하거나 무시하는 것이 아니라 막기 위해 감시 ✕"], "why": "공원은 처음부터 사냥 금지 지역이고 자원봉사자들이 불법 사냥의 징후를 감시한다.", "note": {"en": "To protect the Big Five, Kruger National Park has been a no-hunting area from the start, and volunteers monitor signs of illegal hunting.", "ko": "빅 파이브를 보호하기 위해 크루거 국립 공원은 처음부터 사냥 금지 지역이었고, 자원봉사자들은 불법 사냥의 징후를 감시한다.", "words": [["no-hunting", "사냥 금지의"], ["monitor", "감시하다"]]}, "ev": ["To protect the Big Five, the park has been a “no-hunting” area from the start.", "빅 파이브를 보호하기 위해서 그 공원은 처음부터 ‘사냥 금지’ 지역이었습니다."]}], "pp": [["Discovering the Big Five – Kruger National Park", "빅 파이브 발견하기 – 크루거 국립 공원"], ["Have you heard about the Big Five?", "빅 파이브에 대해 들어 본 적이 있나요?"], ["They are lions, leopards, elephants, rhinos, and buffaloes.", "그것들은 사자, 표범, 코끼리, 코뿔소, 그리고 버팔로입니다."], ["You can see them all in Kruger National Park in South Africa.", "여러분은 이 모든 동물들을 남아프리카 공화국의 크루거 국립 공원에서 볼 수 있습니다."], ["Many wild animals move around this park freely.", "많은 야생 동물들이 이 공원에서 자유롭게 돌아다닙니다."], ["If you are lucky, you can see rhinos which are sleeping under baobab trees.", "운이 좋으면, 바오밥 나무 아래에서 자고 있는 코뿔소를 볼 수 있습니다."], ["However, the Big Five are in danger because of too much hunting.", "하지만, 빅 파이브는 너무 많은 사냥 때문에 위험에 처해 있습니다."], ["To protect the Big Five, the park has been a “no-hunting” area from the start.", "빅 파이브를 보호하기 위해서 그 공원은 처음부터 ‘사냥 금지’ 지역이었습니다."], ["These days, drones and helicopters are used to monitor hunting activities.", "요즘에는 드론과 헬리콥터가 사냥 활동을 감시하는 데 사용됩니다."], ["Also, the park runs many nature volunteer programs.", "또한, 그 공원은 많은 자연 자원봉사 프로그램을 운영합니다."], ["Volunteers monitor signs of illegal hunting activities and remove animal traps.", "자원봉사자들은 불법 사냥 활동의 징후를 관찰하고 동물 덫을 제거합니다."], ["National parks preserve the Earth's past, present, and future.", "국립 공원은 지구의 과거, 현재, 그리고 미래를 보존합니다."], ["Thanks to them, future generations will also be able to experience many natural wonders.", "그곳들 덕분에 미래 세대 또한 많은 자연의 경이로움을 경험할 수 있을 것입니다."]]}];
