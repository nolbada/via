ite simple.", "그것은 또한 꽤 단순합니다.", 0], ["You just need a ball, a small open space, and the desire to kick!", "여러분은 공, 작은 열린 공간, 그리고 (공을) 차고 싶은 욕구만 있으면 됩니다!", 0], ["Oh, don't forget one more thing.", "아, 한 가지 더 잊지 마세요.", 0], ["You need to understand the importance of colors!", "여러분은 색깔의 중요성을 이해해야 합니다!", 0], ["Soccer balls today come in various colors, but black and white balls are quite common.", "오늘날 축구공은 다양한 색깔로 나오지만, 검고 흰 축구공이 상당히 흔합니다.", 0], ["Have you heard about the origin of this popular design?", "여러분은 이 인기 있는 디자인의 기원에 대해 들어 본 적 있나요?", 0], ["Black and white balls were introduced during the 1970 World Cup in Mexico.", "검고 흰 축구공은 1970년 멕시코 월드컵 동안 도입되었습니다.", 0], ["People could spot them easily on their black and white TVs. Isn't that smart?", "사람들은 그들의 흑백 TV에서 그것들을 쉽게 발견할 수 있었어요. 똑똑하지 않나요?", 0], ["Now we have color televisions, but we still kick the classic black and white soccer balls.", "이제 우리는 컬러텔레비전을 가지고 있지만, 우리는 여전히 그 대표적인 검고 흰 축구공을 찹니다.", 0], ["Players on each team wear uniforms with their own colors.", "각 팀의 선수들은 자신들만의 색깔이 있는 유니폼을 입습니다.", 0], ["Uniform colors have the power to unite the team under the same spirit.", "유니폼 색깔은 팀을 같은 정신 아래 결속시키는 힘을 가지고 있습니다.", 0], ["They are also useful on the field.", "그것들은 또한 경기장에서 유용합니다.", 0], ["Players can spot each other and make quick decisions thanks to their team's unique colors.", "선수들은 서로를 알아보고 그들 팀의 고유한 색깔 덕분에 빠른 결정을 내릴 수 있습니다.", 0], ["On the field, referees wear uniforms with special colors because they need to stand out from the players.", "경기장에서, 심판들은 선수들로부터 눈에 띄어야 하기 때문에 특별한 색깔의 유니폼을 입습니다.", 0], ["Among several colors, black has been their favorite.", "몇몇 색깔 중에서, 검은색은 줄곧 그들이 가장 좋아하는 색이었습니다.", 0], ["Black makes referees look powerful and sends a strong \"Don't argue with me!\" message.", "검은색은 심판들을 강력해 보이게 만들고 강한 \"나와 논쟁하지 마시오!\"라는 메시지를 보냅니다.", 0], ["Referees have used yellow and red cards since 1970.", "심판들은 1970년부터 노란색과 빨간색 카드를 사용해 왔습니다.", 0], ["Different color cards send different messages to players.", "다른 색깔 function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){

 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});

function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}

var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}

 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
