mell of space can be different from place to place.","Scientists say a comet is a big hot ball of fire.","The cloud around comet 67P has no smell at all.","Astronauts say that space has no smell."],"r":{"a":"1) The smell of space can be different from place to place.","ev":"3번, 6~7번, 12번 문장","s":[[3,"But astronauts say it actually smells!","하지만 우주 비행사들은 그것이 실제로 냄새가 난다고 말한다!"],[6,"A comet is a big icy ball of dust and rocks.","혜성은 먼지와 바위로 이루어진 커다란 얼음덩어리이다."],[7,"Scientists discovered that the cloud around this comet has some unique smells like rotten eggs and almonds!","과학자들은 이 혜성 주변의 구름이 썩은 달걀과 아몬드와 같은 몇몇 독특한 냄새를 가지고 있다는 것을 발견했다!"],[12,"A NASA researcher says, “The smell of space differs from place to place. Space might smell like a buffet restaurant with all kinds of smells.”","NASA의 한 연구원은 “우주의 냄새는 장소마다 달라요. 우주는 온갖 종류의 냄새를 가지고 있는 뷔페 레스토랑과 같은 냄새가 날지도 몰라요.”라고 말한다."]],"w":"12번에서 우주의 냄새는 장소마다 다르다고 함. 6번은 먼지와 바위로 된 '얼음'덩어리, 7번은 구름에 독특한 냄새가 있음, 3번은 우주 비행사들이 우주에서 냄새가 난다고 함이라 나머지는 본문과 다름.","c":1},"h":"eef65099a6"},{"n":9,"t":"sum","q":"Sagittarius B2 smells like (A), and the sweet smell comes from a special (B) in the cloud.","ko":"Sagittarius B2는 (A) 같은 냄새가 나고, 그 달콤한 냄새는 구름 속의 특별한 (B)에서 나온다.","oko":["(A) 아몬드 / (B) 화학 물질","(A) 라즈베리 / (B) 바위","(A) 달걀 / (B) 먼지","(A) 라즈베리 / (B) 화학 물질","(A) 아몬드 / (B) 바위"],"opts":["(A) almonds / (B) chemical","(A) raspberries / (B) rock","(A) eggs / (B) dust","(A) raspberries / (B) chemical","(A) almonds / (B) rock"],"r":{"a":"4) (A) raspberries / (B) chemical","ev":"9~11번 문장","s":[[9,"There’s also a big space cloud named Sagittarius B2.","Sagittarius B2라는 이름의 큰 성운도 있다."],[10,"It smells like raspberries.","그것은 라즈베리 같은 냄새가 난다."],[11,"This sweet smell comes from a special chemical in the cloud.","이 달콤한 냄새는 구름에 있는 특별한 화학 물질에서 나온다."]],"w":"10번 It smells like raspberries(라즈베리 같은 냄새), 11번 This sweet smell comes from a special chemical in the cloud(달콤한 냄새는 구름 속 특별한 화학 물질에서 나온다). 아몬드와 달걀은 혜성 67P의 냄새(7번)이고, 바위와 먼지는 혜성의 재료(6번)라서 틀림.","c":4},"h":"246a2dd691"},{"n":10,"t":"fill","q":"You might think space doesn’t have a [A]. But astronauts say it actually [B]!","ko":"당신은 우주에 [A]가 없다고 생각할지도 모른다. 하지만 우주 비행사들은 그것이 실제로 [B] 말한다!","bko":{"smell":"냄새","smells":"냄새가 난다","rock":"바위","dust":"먼지","planet":"행성","comets":"혜성들"},"bank":["smell","smells","rock","dust","planet","comets"],"r":{"a":"[A] smell, [B] smells","ev":"2~3번 문장","s":[[2,"You might think it doesn’t have any smell.","당신은 그것이 어떤 냄새도 나지 않는다고 생각할지도 모른다."],[3,"But astronauts say it actually smells!","하지만 우주 비행사들은 그것이 실제로 냄새가 난다고 말한다!"]],"w":"2번 You might think it doesn’t have any smell(어떤 냄새도 없다고 생각할지도 모른다), 3번 astronauts say it actually smells(실제로 냄새가 난다고 말한다). 명사 smell(냄새)과 동사 smells(냄새가 난다)를 구분해야 함: a 뒤에는 명사 smell, it 뒤에는 동사 smells가 와야 함. rock(바위), dust(먼지), planet(행성), comets(혜성들)는 냄새가 있는지 없는지를 말하는 이 문장과 뜻이 통하지 않음.","c":null},"h":"64a7860ce5"}]},{"u":7,"id":"rg1-07-1","no":1,"ko":"세 가지 색깔의 소음, 무엇이 다를까?","items":[{"n":1,"t":"tf","q":"You can hear white noise from a fan or a vacuum.","ko":"백색 소음은 선풍기나 진공청소기에서 들을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"You can hear this from a fan or a vacuum.","여러분은 선풍기나 진공청소기에서 이 소리를 들을 수 있다."]],"w":"7번 문장에 You can hear this from a fan or a vacuum이 있음. this는 6번의 white noise. hear는 hear(듣다)의 기본형.","c":"T"},"h":"ac5af59ac2"},{"n":2,"t":"tf","q":"Pink noise uses higher sounds than white noise.","ko":"분홍색 소음은 백색 소음보다 더 높은 소리를 사용한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Pink noise uses lower sounds than white noise.","분홍색 소음은 백색 소음보다 더 낮은 소리를 사용한다."]],"w":"9번 문장은 Pink noise uses lower sounds than white noise. 즉 ‘더 낮은’ 소리를 씀. higher(더 높은)와 lower(더 낮은)가 반대라서 틀린 문장.","c":"F"},"h":"93a46f4a2c"},{"n":3,"t":"tf","q":"Brown noise could help improve your thinking skills.","ko":"갈색 소음은 사고력을 향상시키는 데 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"It could help improve your thinking skills.","그것은 여러분의 사고력을 향상시키는 데 도움이 될 수 있다."]],"w":"14번 문장에 It could help improve your thinking skills가 나옴. It은 13번까지 설명한 brown noise(갈색 소음).","c":"T"},"h":"24ab3dc2c4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (All these three sounds have a calming effect.)","ko":"이 세 가지 소리는 모두 calming 효과가 있다.","opts":["시끄러운","놀라운","마음을 진정시키는","지루한"],"word":"calming","r":{"a":"3) 마음을 진정시키는","ev":"4번 문장","s":[[4,"All these three sounds have a calming effect.","이 세 가지 소리는 모두 마음을 진정시키는 효과가 있다."]],"w":"4번 문장의 calming effect는 마음을 가라앉히는 효과. 11번 relaxing(마음을 편안하게 하는)도 같은 방향의 말. 시끄럽다는 뜻이 아님.","c":3},"h":"f8d7e6015f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Brown noise is the deepest sound of the three.)","ko":"갈색 소음은 세 가지 중에서 deepest 소리이다.","opts":["가장 큰","가장 깊은","가장 높은","가장 짧은"],"word":"deepest","r":{"a":"2) 가장 깊은","ev":"12번 문장","s":[[12,"Brown noise is the deepest sound of the three.","갈색 소음은 세 가지 중에서 가장 깊은 소리이다."]],"w":"deepest는 deep(깊은)의 최상급이라 ‘가장 깊은’. 9번에서 분홍색이 백색보다 낮은 소리였고, 갈색은 그보다 더 깊은 소리. 높은 소리가 아님.","c":2},"h":"bed354e907"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSo, what’s the difference between them?","ko":"밑줄 친 them이 가리키는 것은?","sko":"그렇다면 그것들 사이의 차이점은 무엇일까?","opts":["선풍기와 진공청소기","우리가 사용하는 색깔들","빗소리와 파도 소리","백색 소음, 분홍색 소음, 갈색 소음"],"r":{"a":"4) 백색 소음, 분홍색 소음, 갈색 소음","ev":"3~5번 문장","s":[[3,"But did you know about pink noise and brown noise?","그런데 분홍색 소음과 갈색 소음에 대해서도 알고 있었는가?"],[4,"All these three sounds have a calming effect.","이 세 가지 소리는 모두 마음을 진정시키는 효과가 있다."],[5,"So, what’s the difference between them?","그렇다면 그것들 사이의 차이점은 무엇일까?"]],"w":"3번에서 pink noise와 brown noise를 소개하고 4번에서 ‘이 세 가지 소리(these three sounds)’라고 정리함. 5번의 them은 이 세 소음이고, 이 세 소음의 차이를 이어서 설명함.","c":4},"h":"42530e8244"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It’s like a “shhh” sound and helps cover up other noise, so you can focus.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 ‘쉬이이’ 하는 소리 같고 다른 소음을 가려 주어서, 여러분이 집중할 수 있다.","opts":["‘쉬이이’ 소리 같고 다른 소음을 가려 주어서 집중할 수 있다.","‘쉬이이’ 소리가 다른 소음보다 커서 집중하기 어렵다.","다른 소음이 커져서 ‘쉬이이’ 소리가 들리지 않게 된다.","‘쉬이이’ 소리를 내면 모든 소음이 사라져 잠이 온다."],"r":{"a":"1) ‘쉬이이’ 소리 같고 다른 소음을 가려 주어서 집중할 수 있다.","ev":"8번 문장","s":[[8,"It’s like a “shhh” sound and helps cover up other noise, so you can focus.","그것은 ‘쉬이이’ 하는 소리 같고 다른 소음을 가려 주어서, 여러분이 집중할 수 있다."]],"w":"cover up은 ‘덮어서 가리다’이고 so는 ‘그래서’. 다른 소음이 가려지니 집중할 수 있다는 내용. 집중이 어려워진다거나 잠이 온다는 말은 없음.","c":1},"h":"b06512bab9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["분홍색 소음은 갈색 소음보다 더 깊은 소리이다.","백색 소음은 폭우나 폭포 소리 같다.","분홍색 소음은 빗소리나 해변의 파도 소리와 비슷하다.","세 가지 소음은 모두 사람을 흥분시킨다."],"opts":["Pink noise is deeper than brown noise.","White noise sounds like heavy rain or a waterfall.","Pink noise is similar to the sound of rain or waves on a beach.","All three sounds make people excited."],"r":{"a":"3) Pink noise is similar to the sound of rain or waves on a beach.","ev":"4번, 10번, 12~13번 문장","s":[[4,"All these three sounds have a calming effect.","이 세 가지 소리는 모두 마음을 진정시키는 효과가 있다."],[10,"It’s similar to the sound of rain or waves on a beach.","그것은 빗소리나 해변의 파도 소리와 비슷하다."],[12,"Brown noise is the deepest sound of the three.","갈색 소음은 세 가지 중에서 가장 깊은 소리이다."],[13,"It’s like the sound of heavy rain or a waterfall.","그것은 폭우나 폭포 소리 같다."]],"w":"10번에서 분홍색 소음은 빗소리나 해변의 파도 소리와 비슷하다고 함. 가장 깊은 소리는 갈색 소음(12번), 폭우·폭포 소리는 갈색 소음(13번), 세 소음은 모두 마음을 진정시킴(4번).","c":3},"h":"5f620815eb"},{"n":9,"t":"sum","q":"Pink noise sounds like (A) such as rain, so it is relaxing, and brown noise is the (B) sound of the three.","ko":"분홍색 소음은 비 같은 (A) 소리처럼 들려서 편안하고, 갈색 소음은 세 가지 중 가장 (B) 소리이다.","oko":["(A) 기계 / (B) 깊은","(A) 자연 / (B) 높은","(A) 음악 / (B) 깊은","(A) 기계 / (B) 높은","(A) 자연 / (B) 깊은"],"opts":["(A) machines / (B) deepest","(A) nature / (B) highest","(A) music / (B) deepest","(A) machines / (B) highest","(A) nature / (B) deepest"],"r":{"a":"5) (A) nature / (B) deepest","ev":"10~12번 문장","s":[[10,"It’s similar to the sound of rain or waves on a beach.","그것은 빗소리나 해변의 파도 소리와 비슷하다."],[11,"It’s relaxing because it sounds like nature.","그것은 자연처럼 들리기 때문에 마음을 편안하게 해 준다."],[12,"Brown noise is the deepest sound of the three.","갈색 소음은 세 가지 중에서 가장 깊은 소리이다."]],"w":"10~11번에서 분홍색 소음은 비·파도처럼 자연처럼 들려서 편안하다고 함(A = nature). 12번에서 갈색 소음은 가장 깊은 소리(B = deepest). 기계 소리는 백색 소음(7번)의 예.","c":5},"h":"4da553a4b1"},{"n":10,"t":"fill","q":"All three colors of noise have a calming [A], and brown noise could help [B] your thinking skills.","ko":"세 가지 색의 소음은 모두 마음을 진정시키는 [A]가 있고, 갈색 소음은 사고력을 [B]하는 데 도움이 될 수 있다.","bko":{"effect":"효과","improve":"향상시키다","cover":"덮다, 가리다","skills":"기술, 능력","waves":"파도","relaxing":"편안하게 하는"},"bank":["effect","improve","cover","skills","waves","relaxing"],"r":{"a":"[A] effect, [B] improve","ev":"4번, 14번 문장","s":[[4,"All these three sounds have a calming effect.","이 세 가지 소리는 모두 마음을 진정시키는 효과가 있다."],[14,"It could help improve your thinking skills.","그것은 여러분의 사고력을 향상시키는 데 도움이 될 수 있다."]],"w":"4번 have a calming effect, 14번 help improve your thinking skills에서 가져옴. cover(덮다)는 백색 소음(8번)의 효과를 말할 때 쓴 단어라 갈색 소음 문장에는 맞지 않음.","c":null},"h":"cb6f119de3"}]},{"u":7,"id":"rg1-07-2","no":2,"ko":"넘어져서 진흙 웅덩이에 풍덩! 그런데 왜 웃었을까?","items":[{"n":1,"t":"tf","q":"Lisa wore a chicken costume in the relay race.","ko":"Lisa는 릴레이 경주에서 치킨 의상을 입었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When it was my turn, I had to wear a chicken costume.","제 차례가 왔을 때, 저는 치킨 의상을 입어야 했어요."]],"w":"6번 문장에 I had to wear a chicken costume이 있음. had to wear는 have to wear(입어야 하다)의 과거형.","c":"T"},"h":"4be82732f4"},{"n":2,"t":"tf","q":"Lisa was badly hurt after she fell into the mud puddle.","ko":"Lisa는 진흙 웅덩이에 빠진 뒤 크게 다쳤다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"But don’t worry.","하지만 걱정하지 마세요."],[11,"I’m totally fine!","저는 아주 괜찮아요!"]],"w":"10~11번에서 걱정하지 말라고 하며 I’m totally fine!(완전히 괜찮다)이라고 함. 크게 다쳤다는 말은 본문과 반대.","c":"F"},"h":"cfba50f850"},{"n":3,"t":"tf","q":"Lisa’s friends call her “Muddy Chicken” as a funny joke.","ko":"Lisa의 친구들은 장난으로 그녀를 ‘진흙투성이 치킨’이라고 부른다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"My friends now call me “Muddy Chicken,” but it’s just a funny joke.","제 친구들은 이제 저를 ‘진흙투성이 치킨’이라고 부르지만, 그냥 웃긴 농담일 뿐이에요."]],"w":"12번 문장에 My friends now call me “Muddy Chicken,” but it’s just a funny joke가 그대로 나옴. call은 ‘부르다’.","c":"T"},"h":"e09b62635c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the race, we wore silly costumes…)","ko":"그 경주에서, 우리는 silly 의상을 입고…","opts":["비싼","우스꽝스러운","무거운","낡은"],"word":"silly","r":{"a":"2) 우스꽝스러운","ev":"5번 문장","s":[[5,"In the race, we wore silly costumes, ran to a spot, and then took off the costumes for the next person.","그 경주에서, 우리는 우스꽝스러운 의상을 입고, 어느 지점까지 달려갔다가, 다음 사람을 위해 의상을 벗었어요."]],"w":"5번 문장의 silly costumes는 웃기고 바보 같아 보이는 의상. 뒤에 나오는 치킨 의상(6번)과 이어서 생각하면 쉬움.","c":2},"h":"c3a2f9a4e1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (I tripped over the chicken feet.)","ko":"저는 치킨 발에 tripped.","opts":["~을 닦았다","~을 던졌다","~을 벗었다","~에 발이 걸려 넘어졌다"],"word":"tripped","r":{"a":"4) ~에 발이 걸려 넘어졌다","ev":"7번 문장","s":[[7,"As I started running, I tripped over the chicken feet.","제가 달리기 시작했을 때, 저는 치킨 발에 걸려 넘어졌어요."]],"w":"tripped는 trip(발이 걸려 넘어지다)의 과거형. 바로 뒤 8번에서 진흙 웅덩이에 빠졌으니 ‘넘어졌다’가 맞음. 벗었다는 take off(5번)와 구별.","c":4},"h":"7bbd152cca"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nMy friends now call me “Muddy Chicken,” but it’s just a funny joke.","ko":"밑줄 친 it이 가리키는 것은?","sko":"제 친구들은 이제 저를 ‘진흙투성이 치킨’이라고 부르지만, 그냥 웃긴 농담일 뿐이에요.","opts":["친구들이 나를 ‘진흙투성이 치킨’이라고 부르는 것","치킨 의상","여름 캠프","릴레이 경주"],"r":{"a":"1) 친구들이 나를 ‘진흙투성이 치킨’이라고 부르는 것","ev":"12번 문장","s":[[12,"My friends now call me “Muddy Chicken,” but it’s just a funny joke.","제 친구들은 이제 저를 ‘진흙투성이 치킨’이라고 부르지만, 그냥 웃긴 농담일 뿐이에요."]],"w":"앞부분에서 친구들이 Lisa를 Muddy Chicken이라고 부른다고 했고, but it’s just a funny joke(그것은 그냥 웃긴 농담일 뿐)에서 it은 그렇게 부르는 일 전체를 가리킴.","c":1},"h":"f7dee0ec58"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"I miss you both and can’t wait to tell you more fun stories when I get home.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"두 분 모두 보고 싶고, 집에 돌아가서 더 많은 재미있는 이야기들을 들려드릴 것이 기대돼요.","opts":["두 분이 캠프에 오셔서 이야기를 들려주시면 좋겠다.","집에 돌아가도 두 분께 재미있는 이야기는 하지 않을 것이다.","두 분이 보고 싶고, 집에 가서 더 많은 재미있는 이야기를 들려드릴 날이 기다려진다.","두 분이 보고 싶지만, 집에 가면 할 이야기가 없을까 봐 걱정된다."],"r":{"a":"3) 두 분이 보고 싶고, 집에 가서 더 많은 재미있는 이야기를 들려드릴 날이 기다려진다.","ev":"14번 문장","s":[[14,"I miss you both and can’t wait to tell you more fun stories when I get home.","두 분 모두 보고 싶고, 집에 돌아가서 더 많은 재미있는 이야기들을 들려드릴 것이 기대돼요."]],"w":"miss는 ‘그리워하다’, can’t wait to는 ‘몹시 기다려진다’. 이야기를 들려줄 사람은 Lisa이고, 하고 싶은 마음이 크다는 뜻.","c":3},"h":"cc061b4d1f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Lisa는 선생님께 편지를 쓰고 있다.","Lisa는 치킨 발에 걸려 넘어져 진흙 웅덩이에 빠졌다.","Lisa가 넘어졌을 때 Lisa만 웃었다.","Lisa는 다쳐서 바로 집에 가고 싶어 한다."],"opts":["Lisa is writing a letter to her teacher.","Lisa tripped over the chicken feet and fell into a mud puddle.","Only Lisa laughed when she fell.","Lisa wants to go home right away because she got hurt."],"r":{"a":"2) Lisa tripped over the chicken feet and fell into a mud puddle.","ev":"1번, 7~9번, 11번 문장","s":[[1,"Dear Mom and Dad, I hope you’re doing well.","사랑하는 엄마 아빠께, 두 분이 잘 지내고 계시길 바라요."],[7,"As I started running, I tripped over the chicken feet.","제가 달리기 시작했을 때, 저는 치킨 발에 걸려 넘어졌어요."],[8,"I fell into a big mud puddle!","저는 큰 진흙 웅덩이에 빠졌어요!"],[9,"Everyone laughed a lot, including me.","모두들 저를 포함해서 많이 웃었어요."],[11,"I’m totally fine!","저는 아주 괜찮아요!"]],"w":"7~8번에서 치킨 발에 걸려 넘어져 진흙 웅덩이에 빠졌다고 함. 편지는 엄마 아빠께(1번), 웃은 사람은 Lisa를 포함한 모두(9번), 다치지 않고 괜찮다(11번)는 내용과 달라 나머지는 틀림.","c":2},"h":"e803d4d78b"},{"n":9,"t":"sum","q":"Lisa is having a (A) time at summer camp, and she has made many new (B).","ko":"Lisa는 여름 캠프에서 (A) 시간을 보내고 있고, 새로운 (B)를 많이 사귀었다.","oko":["(A) 지루한 / (B) 친구들","(A) 즐거운 / (B) 의상들","(A) 무서운 / (B) 친구들","(A) 즐거운 / (B) 친구들","(A) 지루한 / (B) 의상들"],"opts":["(A) boring / (B) friends","(A) great / (B) costumes","(A) scary / (B) friends","(A) great / (B) friends","(A) boring / (B) costumes"],"r":{"a":"4) (A) great / (B) friends","ev":"2번, 13번 문장","s":[[2,"I’m having so much fun here at summer camp!","저는 여기 여름 캠프에서 너무 재미있게 지내고 있어요!"],[13,"Camp has been really great, and I made lots of new friends.","캠프는 정말 좋았고, 저는 새로운 친구들을 많이 사귀었어요."]],"w":"2번 having so much fun, 13번 Camp has been really great에서 (A)는 great(즐거운). 13번 I made lots of new friends에서 (B)는 friends. 의상은 경주 이야기라 새로 만든 것이 아님.","c":4},"h":"360e99cc8e"},{"n":10,"t":"fill","q":"Lisa [A] over the chicken feet and fell into the mud, and everyone [B] a lot.","ko":"Lisa는 치킨 발에 걸려 [A] 진흙에 빠졌고, 모두가 많이 [B].","bko":{"tripped":"발이 걸려 넘어졌다","laughed":"웃었다","costume":"의상","silly":"우스꽝스러운","puddle":"물웅덩이","relay":"릴레이, 이어달리기"},"bank":["tripped","laughed","costume","silly","puddle","relay"],"r":{"a":"[A] tripped, [B] laughed","ev":"7~9번 문장","s":[[7,"As I started running, I tripped over the chicken feet.","제가 달리기 시작했을 때, 저는 치킨 발에 걸려 넘어졌어요."],[8,"I fell into a big mud puddle!","저는 큰 진흙 웅덩이에 빠졌어요!"],[9,"Everyone laughed a lot, including me.","모두들 저를 포함해서 많이 웃었어요."]],"w":"7번 I tripped over the chicken feet, 9번 Everyone laughed a lot에서 가져옴. [A]에는 ‘~에 걸려 넘어졌다’는 동작이, [B]에는 ‘많이 ~했다’는 동작이 와야 해서 costume(의상)·silly(우스꽝스러운)·puddle(웅덩이)·relay(릴레이)는 동사 자리에 들어갈 수 없음.","c":null},"h":"54d0f7f0df"}]},{"u":7,"id":"rg1-07-3","no":3,"ko":"고대 이집트 사람들은 왜 눈 주위를 까맣게 칠했을까?","items":[{"n":1,"t":"tf","q":"Both men and women in Ancient Egypt drew thick black lines around their eyes.","ko":"고대 이집트의 남자와 여자는 모두 눈 주위에 두꺼운 검은 선을 그렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Both men and women drew thick black lines around their eyes.","남녀 모두 눈 주위에 두꺼운 검은 선을 그렸다."]],"w":"3번 문장에 Both men and women drew thick black lines around their eyes가 그대로 나옴. drew는 draw(그리다)의 과거형.","c":"T"},"h":"07a84f7e6c"},{"n":2,"t":"tf","q":"People in Ancient Egypt used kohl only to look good.","ko":"고대 이집트 사람들은 오직 멋져 보이기 위해서만 kohl을 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"They didn’t do this just to look good.","그들은 단지 멋져 보이기 위해 이렇게 한 것이 아니었다."],[5,"It was mostly for their eye health.","그것은 주로 그들의 눈 건강을 위한 것이었다."]],"w":"4번에서 They didn’t do this just to look good(단지 멋져 보이려고 한 것이 아님), 5번에서 주로 눈 건강을 위한 것이라고 함. ‘오직 멋 때문’이라는 말은 본문과 반대.","c":"F"},"h":"6083c2c2d3"},{"n":3,"t":"tf","q":"Zinc oxide in kohl is a powerful natural sunblock.","ko":"kohl에 든 산화아연은 강력한 천연 자외선 차단제이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"One is zinc oxide, a powerful natural sunblock.","하나는 강력한 천연 자외선 차단제인 산화아연이다."]],"w":"10번 문장에 One is zinc oxide, a powerful natural sunblock이 나옴. One은 9번의 special ingredients(특별한 성분) 중 하나.","c":"T"},"h":"a67178c42b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the bright sun and the dusty desert wind.)","ko":"…밝은 햇빛과 dusty 사막 바람.","opts":["얼음처럼 찬","먼지투성이의","촉촉한","어두운"],"word":"dusty","r":{"a":"2) 먼지투성이의","ev":"6번 문장","s":[[6,"The makeup protected their eyes from the bright sun and the dusty desert wind.","그 화장품은 밝은 햇빛과 먼지투성이의 사막 바람으로부터 그들의 눈을 보호해 주었다."]],"w":"dusty는 dust(먼지)에서 온 말로 ‘먼지가 많은’. 사막 바람이 눈에 해롭다는 7번 내용과 이어짐.","c":2},"h":"094900aed6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It helps fight harmful germs.)","ko":"그것은 harmful 세균과 싸우는 데 도움을 준다.","opts":["도움이 되는","귀중한","해로운","특별한"],"word":"harmful","r":{"a":"3) 해로운","ev":"12번 문장","s":[[12,"It helps fight harmful germs.","그것은 유해한 세균과 싸우는 데 도움을 준다."]],"w":"harmful은 ‘해로운’. 세균(germs)은 몸에 해로우니 neem이 그것과 싸운다는 문맥. 도움이 되는 것은 neem 쪽 설명.","c":3},"h":"b2fa332c34"},{"n":6,"t":"ref","q":"What does the underlined \"These things\" refer to?\nThese things could hurt their eyes or give them eye diseases.","ko":"밑줄 친 These things가 가리키는 것은?","sko":"이런 것들은 그들의 눈을 아프게 하거나 눈병을 일으킬 수 있었다.","opts":["눈 주위의 두꺼운 검은 선","kohl에 들어 있는 특별한 성분","고대 이집트의 남자와 여자","밝은 햇빛과 먼지투성이의 사막 바람"],"r":{"a":"4) 밝은 햇빛과 먼지투성이의 사막 바람","ev":"6~7번 문장","s":[[6,"The makeup protected their eyes from the bright sun and the dusty desert wind.","그 화장품은 밝은 햇빛과 먼지투성이의 사막 바람으로부터 그들의 눈을 보호해 주었다."],[7,"These things could hurt their eyes or give them eye diseases.","이런 것들은 그들의 눈을 아프게 하거나 눈병을 일으킬 수 있었다."]],"w":"6번에서 kohl이 the bright sun과 the dusty desert wind로부터 눈을 보호했다고 했고, 7번의 These things는 그 눈을 아프게 하는 것들. 검은 선이나 성분은 눈을 해치는 것이 아님.","c":4},"h":"591a852abe"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now we know it really helped!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이제 우리는 그것이 정말 도움이 되었다는 것을 안다!","opts":["이제 우리는 kohl이 정말 도움이 되었다는 것을 안다.","이제 우리는 kohl이 도움이 되지 않았다는 것을 안다.","이제 우리는 kohl을 더 이상 쓰지 않는다.","이제 우리는 kohl이 마법이라고 믿는다."],"r":{"a":"1) 이제 우리는 kohl이 정말 도움이 되었다는 것을 안다.","ev":"13~14번 문장","s":[[13,"People back then believed kohl was magical.","그 당시 사람들은 kohl이 마법 같다고 믿었다."],[14,"Now we know it really helped!","이제 우리는 그것이 정말 도움이 되었다는 것을 안다!"]],"w":"13번에서 옛날 사람들은 kohl이 마법 같다고 믿었고, 14번에서는 지금 연구로 정말 도움이 되었다는 것을 안다고 함. ‘믿음’이 아니라 ‘알게 된 사실’.","c":1},"h":"ebfe1f125e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Neem은 강력한 천연 자외선 차단제이다.","Kohl은 단지 멋져 보이기 위해서만 사용되었다.","Kohl은 밝은 햇빛과 먼지투성이 사막 바람으로부터 눈을 보호했다.","오직 남자만 눈 주위에 선을 그렸다."],"opts":["Neem is a powerful natural sunblock.","Kohl was used just to look good.","Kohl helped protect the eyes from the bright sun and dusty wind.","Only men drew lines around their eyes."],"r":{"a":"3) Kohl helped protect the eyes from the bright sun and dusty wind.","ev":"3~4번, 6번, 10~11번 문장","s":[[3,"Both men and women drew thick black lines around their eyes.","남녀 모두 눈 주위에 두꺼운 검은 선을 그렸다."],[4,"They didn’t do this just to look good.","그들은 단지 멋져 보이기 위해 이렇게 한 것이 아니었다."],[6,"The makeup protected their eyes from the bright sun and the dusty desert wind.","그 화장품은 밝은 햇빛과 먼지투성이의 사막 바람으로부터 그들의 눈을 보호해 주었다."],[10,"One is zinc oxide, a powerful natural sunblock.","하나는 강력한 천연 자외선 차단제인 산화아연이다."],[11,"Another is neem.","또 다른 하나는 인도 멀구슬나무이다."]],"w":"6번에서 kohl이 눈을 밝은 햇빛과 사막 바람으로부터 보호했다고 함. 자외선 차단제는 산화아연(10번)이고 neem은 세균과 싸움(11~12번), 멋만을 위한 것이 아니고(4번), 남녀 모두 그렸음(3번).","c":3},"h":"3adfaad08b"},{"n":9,"t":"sum","q":"Recent studies showed that kohl had special (A), such as zinc oxide, which blocks the sun, and neem, which fights harmful (B).","ko":"최근 연구에서 kohl에는 햇빛을 막는 산화아연과 해로운 (B)와 싸우는 neem 같은 특별한 (A)가 있다는 것이 밝혀졌다.","oko":["(A) 색 / (B) 세균","(A) 성분 / (B) 동물","(A) 색 / (B) 햇빛","(A) 성분 / (B) 햇빛","(A) 성분 / (B) 세균"],"opts":["(A) colors / (B) germs","(A) ingredients / (B) animals","(A) colors / (B) sunlight","(A) ingredients / (B) sunlight","(A) ingredients / (B) germs"],"r":{"a":"5) (A) ingredients / (B) germs","ev":"9~12번 문장","s":[[9,"Recent studies showed that kohl had special ingredients.","최근의 연구에서 kohl에는 특별한 성분이 있었다는 것이 밝혀졌다."],[10,"One is zinc oxide, a powerful natural sunblock.","하나는 강력한 천연 자외선 차단제인 산화아연이다."],[11,"Another is neem.","또 다른 하나는 인도 멀구슬나무이다."],[12,"It helps fight harmful germs.","그것은 유해한 세균과 싸우는 데 도움을 준다."]],"w":"9번 special ingredients(특별한 성분)에서 (A)는 ingredients. 12번에서 neem은 harmful germs(해로운 세균)와 싸운다고 하므로 (B)는 germs. 햇빛을 막는 것은 산화아연의 역할.","c":5},"h":"6dbea17a03"},{"n":10,"t":"fill","q":"The Egyptians used kohl mainly for their eye [A], because it [B] their eyes from the bright sun and the dusty wind.","ko":"이집트 사람들은 주로 눈 [A]을 위해 kohl을 사용했는데, 그것이 밝은 햇빛과 먼지투성이 바람으로부터 눈을 [B] 때문이다.","bko":{"health":"건강","protected":"보호했다","culture":"문화","fashion":"패션","hurt":"아프게 했다","dusty":"먼지투성이의"},"bank":["health","protected","culture","fashion","hurt","dusty"],"r":{"a":"[A] health, [B] protected","ev":"5~6번 문장","s":[[5,"It was mostly for their eye health.","그것은 주로 그들의 눈 건강을 위한 것이었다."],[6,"The makeup protected their eyes from the bright sun and the dusty desert wind.","그 화장품은 밝은 햇빛과 먼지투성이의 사막 바람으로부터 그들의 눈을 보호해 주었다."]],"w":"5번 It was mostly for their eye health, 6번 The makeup protected their eyes from the bright sun…에서 가져옴. hurt는 눈을 아프게 하는 것이 햇빛·바람(7번)이라 kohl의 일이 아님.","c":null},"h":"27e1522eb7"}]},{"u":8,"id":"rg1-08-1","no":1,"ko":"앞다리가 구부러진 아기 기린, 다시 걸을 수 있을까?","items":[{"n":1,"t":"tf","q":"Msituni’s front legs were bending the wrong way.","ko":"Msituni의 앞다리는 잘못된 방향으로 구부러져 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Her front legs were bending the wrong way.","그녀의 앞다리가 잘못된 방향으로 구부러져 있었다."]],"w":"3번 문장에 Her front legs were bending the wrong way가 그대로 나옴. Her는 1번의 baby giraffe Msituni.","c":"T"},"h":"2f65d3e70d"},{"n":2,"t":"tf","q":"Dr. Ara had worked with giraffes before.","ko":"Ara 박사는 전에 기린과 일해 본 적이 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"But he never worked with a giraffe before.","하지만 그는 이전에 기린과 작업해 본 적이 한 번도 없었다."]],"w":"7번에서 he never worked with a giraffe before(기린과 일한 적이 한 번도 없다)고 함. 경험이 많았던 것은 사람용 교정기(6번).","c":"F"},"h":"7bb00e6a37"},{"n":3,"t":"tf","q":"After two months, Msituni still needed the braces to walk.","ko":"두 달 후에도 Msituni는 걷기 위해 여전히 교정기가 필요했다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"But after two months, she could walk by herself without them.","그러나 두 달 후에, 그녀는 그것 없이 혼자서 걸을 수 있었다."]],"w":"13번에서 after two months, she could walk by herself without them(교정기 없이 혼자 걸을 수 있었다)이라고 함. 두 달 뒤에는 교정기가 필요 없어졌다.","c":"F"},"h":"b7f009610f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Dr. Ara had lots of experience in making braces for people.)","ko":"Ara 박사는 사람들을 위한 교정기를 만드는 데 많은 experience가 있었다.","opts":["실수","경험","용기","시간"],"word":"experience","r":{"a":"2) 경험","ev":"6번 문장","s":[[6,"Dr. Ara had lots of experience in making braces for people.","Ara 박사는 사람들을 위한 교정기를 만드는 데 많은 경험이 있었다."]],"w":"lots of experience in making braces는 교정기를 많이 만들어 본 경험이 있다는 뜻. 바로 뒤 7번 But he never worked with a giraffe와 대조됨.","c":2},"h":"cef54f9b21"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Dr. Ara studied all about giraffes.)","ko":"Ara 박사는 기린에 대한 모든 것을 studied.","opts":["그렸다","무시했다","조사했다, 공부했다","팔았다"],"word":"studied","r":{"a":"3) 조사했다, 공부했다","ev":"10번 문장","s":[[10,"To help Msituni, Dr. Ara studied all about giraffes.","Msituni를 돕기 위해, Ara 박사는 기린에 대한 모든 것을 조사했다."]],"w":"studied는 study(조사하다, 공부하다)의 과거형. 기린은 처음이라(7번) 먼저 기린에 대해 알아본 것. 그다음 11번에서 교정기를 만듦.","c":3},"h":"b7706a1243"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nBut after two months, she could walk by herself without them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그러나 두 달 후에, 그녀는 그것 없이 혼자서 걸을 수 있었다.","opts":["교정기","앞다리","기린 친구들","사육사들"],"r":{"a":"1) 교정기","ev":"12~13번 문장","s":[[12,"At first, walking with braces was hard for Msituni.","처음에는, 교정기를 착용하고 걷는 것이 Msituni에게 어려웠다."],[13,"But after two months, she could walk by herself without them.","그러나 두 달 후에, 그녀는 그것 없이 혼자서 걸을 수 있었다."]],"w":"12번에서 walking with braces(교정기를 하고 걷기)가 어렵다고 했고, 13번 without them은 ‘교정기 없이’라는 뜻. 앞다리나 친구들이 아님.","c":1},"h":"4f65bcb48a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So making her braces was a big job for Dr. Ara.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 그녀의 교정기를 만드는 것은 Ara 박사에게 힘든 작업이었다.","opts":["그녀의 교정기를 만드는 일은 Ara 박사에게 쉬운 일이었다.","Ara 박사는 더 큰 일을 맡겨 달라고 부탁했다.","Ara 박사가 만든 교정기는 아주 컸다.","그래서 그녀의 교정기를 만드는 일은 Ara 박사에게 힘든 작업이었다."],"r":{"a":"4) 그래서 그녀의 교정기를 만드는 일은 Ara 박사에게 힘든 작업이었다.","ev":"8~9번 문장","s":[[8,"Msituni was getting taller every day.","Msituni는 매일 키가 점점 더 커지고 있었다."],[9,"So making her braces was a big job for Dr. Ara.","그래서 그녀의 교정기를 만드는 것은 Ara 박사에게 힘든 작업이었다."]],"w":"a big job은 ‘큰 일, 힘든 작업’. 8번에서 Msituni가 매일 자라고 있었고 7번에서 기린 작업이 처음이라 힘들었다는 흐름. 쉬운 일이라는 선지는 정반대.","c":4},"h":"6d819793d3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Msituni는 처음부터 다른 기린들처럼 서고 걸을 수 있었다.","Ara 박사는 기린에 대해 조사한 뒤 Msituni를 위한 특별한 교정기를 만들었다.","사육사들이 직접 Msituni의 교정기를 만들었다.","Msituni는 매일 키가 점점 작아지고 있었다."],"opts":["Msituni could stand and walk like other giraffes from the start.","Dr. Ara made special braces for Msituni after studying giraffes.","The zookeepers made Msituni’s braces by themselves.","Msituni was getting shorter every day."],"r":{"a":"2) Dr. Ara made special braces for Msituni after studying giraffes.","ev":"4~5번, 8번, 10~11번 문장","s":[[4,"This meant she couldn’t stand or walk like other giraffes.","이는 그녀가 다른 기린들처럼 서거나 걷지 못한다는 것을 의미했다."],[5,"So the zookeepers asked Dr. Ara to make special braces for Msituni.","그래서 사육사들은 Ara 박사에게 Msituni를 위해 특별한 교정기를 만들어 달라고 부탁했다."],[8,"Msituni was getting taller every day.","Msituni는 매일 키가 점점 더 커지고 있었다."],[10,"To help Msituni, Dr. Ara studied all about giraffes.","Msituni를 돕기 위해, Ara 박사는 기린에 대한 모든 것을 조사했다."],[11,"He then made special braces just for her.","그 후 그는 그녀만을 위해 특별한 교정기를 만들었다."]],"w":"10~11번에서 Ara 박사가 기린에 대해 조사한 뒤 특별한 교정기를 만들었다고 함. 처음엔 서거나 걷지 못했고(4번), 사육사들은 박사에게 부탁했을 뿐이고(5번), Msituni는 점점 더 커지고 있었음(8번).","c":2},"h":"9d1839ea54"},{"n":9,"t":"sum","q":"Msituni’s front legs bent the wrong way, so Dr. Ara made special (A) for her after (B) about giraffes.","ko":"Msituni의 앞다리가 잘못 구부러져서, Ara 박사는 기린에 대해 (B)한 뒤 그녀를 위한 특별한 (A)를 만들었다.","oko":["(A) 신발 / (B) 공부","(A) 교정기 / (B) 잊어버림","(A) 교정기 / (B) 공부","(A) 음식 / (B) 공부","(A) 신발 / (B) 잊어버림"],"opts":["(A) shoes / (B) studying","(A) braces / (B) forgetting","(A) braces / (B) studying","(A) food / (B) studying","(A) shoes / (B) forgetting"],"r":{"a":"3) (A) braces / (B) studying","ev":"3번, 10~11번 문장","s":[[3,"Her front legs were bending the wrong way.","그녀의 앞다리가 잘못된 방향으로 구부러져 있었다."],[10,"To help Msituni, Dr. Ara studied all about giraffes.","Msituni를 돕기 위해, Ara 박사는 기린에 대한 모든 것을 조사했다."],[11,"He then made special braces just for her.","그 후 그는 그녀만을 위해 특별한 교정기를 만들었다."]],"w":"3번에서 앞다리가 잘못 구부러졌고, 10~11번에서 박사가 기린에 대해 공부(studying)한 뒤 특별한 교정기(braces)를 만들었다고 함. 신발이나 음식은 본문에 없음.","c":3},"h":"ef00dd8030"},{"n":10,"t":"fill","q":"At first, walking with braces was [A] for Msituni, but after two months, she could walk [B] them.","ko":"처음에는 교정기를 하고 걷는 것이 Msituni에게 [A]했지만, 두 달 후에는 교정기 [B] 걸을 수 있었다.","bko":{"hard":"어려운","without":"~없이","taller":"더 키가 큰","braces":"교정기","zoo":"동물원","legs":"다리들"},"bank":["hard","without","taller","braces","zoo","legs"],"r":{"a":"[A] hard, [B] without","ev":"12~13번 문장","s":[[12,"At first, walking with braces was hard for Msituni.","처음에는, 교정기를 착용하고 걷는 것이 Msituni에게 어려웠다."],[13,"But after two months, she could walk by herself without them.","그러나 두 달 후에, 그녀는 그것 없이 혼자서 걸을 수 있었다."]],"w":"12번 walking with braces was hard, 13번 she could walk by herself without them에서 가져옴. taller(더 키가 큰)는 키 이야기(8번), braces(교정기)·zoo(동물원)·legs(다리들)는 사물 이름이라 ‘어려운’, ‘~없이’ 자리에 들어갈 수 없음.","c":null},"h":"257c3c28a5"}]},{"u":8,"id":"rg1-08-2","no":2,"ko":"두 번의 큰 불, 그런데 오히려 기회가 됐다고?","items":[{"n":1,"t":"tf","q":"Ole opened his own shop in 1916.","ko":"Ole은 1916년에 자신의 가게를 열었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"He loved making things out of wood, so he opened his own shop in 1916.","그는 나무로 물건을 만드는 것을 아주 좋아해서 1916년에 자신의 가게를 열었다."]],"w":"2번 문장에 he opened his own shop in 1916이 그대로 나옴. opened는 open(열다)의 과거형.","c":"T"},"h":"ab447df752"},{"n":2,"t":"tf","q":"Ole gave up making toys after the second fire.","ko":"Ole은 두 번째 화재 후에 장난감 만들기를 포기했다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"In 1942, another fire burned down his factory.","1942년에, 또 다른 화재가 그의 공장을 태워 버렸다."],[10,"But Ole didn’t let this stop him.","하지만 Ole은 이것이 그를 멈추게 두지 않았다."]],"w":"9번에서 두 번째 화재가 났지만, 10번에서 But Ole didn’t let this stop him(이것이 그를 멈추게 두지 않았다)이라고 함. 포기했다는 말은 본문과 반대.","c":"F"},"h":"47759e0fe5"},{"n":3,"t":"tf","q":"Ole bought a machine to make plastic toys because plastic was less expensive.","ko":"플라스틱이 덜 비쌌기 때문에 Ole은 플라스틱 장난감을 만들 기계를 샀다.","r":{"a":"T (본문과 맞는 내용)","ev":"11~12번 문장","s":[[11,"Around this time, people started using plastic because it was less expensive.","이 시기쯤, 사람들은 플라스틱이 덜 비싸서 그것을 사용하기 시작했다."],[12,"So in 1946, Ole bought a machine to make toys out of plastic.","그래서 1946년에, Ole은 플라스틱으로 장난감을 만들기 위해 기계를 구입했다."]],"w":"11번에서 플라스틱이 less expensive(덜 비싼)여서 사람들이 쓰기 시작했고, 12번에서 So(그래서) Ole이 플라스틱 장난감을 만들 기계를 샀다고 이어짐.","c":"T"},"h":"d3fa8a82b6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 1924, a big fire destroyed his shop.)","ko":"1924년에, 큰 화재가 그의 가게를 destroyed.","opts":["지었다","파괴했다","칠했다","팔았다"],"word":"destroyed","r":{"a":"2) 파괴했다","ev":"4번 문장","s":[[4,"In 1924, a big fire destroyed his shop.","1924년에, 큰 화재가 그의 가게를 파괴했다."]],"w":"destroyed는 destroy(파괴하다)의 과거형. 4번에서 가게가 불에 파괴됐고, 5번 But 뒤에서 Ole이 더 큰 작업실을 지은 것과 대조됨.","c":2},"h":"4807bd1a81"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…because it was less expensive.)","ko":"…그것이 덜 expensive 때문에.","opts":["유명한","가벼운","오래된","비싼"],"word":"expensive","r":{"a":"4) 비싼","ev":"11번 문장","s":[[11,"Around this time, people started using plastic because it was less expensive.","이 시기쯤, 사람들은 플라스틱이 덜 비싸서 그것을 사용하기 시작했다."]],"w":"less expensive는 ‘덜 비싼’. 사람들이 플라스틱을 쓰기 시작한 이유가 값이 덜 비싸서라는 문맥. 가볍다는 말은 본문에 없음.","c":4},"h":"72a7184ab8"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nBut Ole saw this as a new chance.","ko":"밑줄 친 this가 가리키는 것은?","sko":"하지만 Ole은 이것을 새로운 기회로 보았다.","opts":["가구를 만드는 일","새 가게를 연 일","큰 화재가 그의 가게를 파괴한 일","회사 이름을 바꾼 일"],"r":{"a":"3) 큰 화재가 그의 가게를 파괴한 일","ev":"4~5번 문장","s":[[4,"In 1924, a big fire destroyed his shop.","1924년에, 큰 화재가 그의 가게를 파괴했다."],[5,"But Ole saw this as a new chance.","하지만 Ole은 이것을 새로운 기회로 보았다."]],"w":"4번에서 1924년에 큰 화재가 가게를 파괴했고, 5번의 But Ole saw this as a new chance에서 this는 그 화재로 가게를 잃은 일을 가리킴.","c":3},"h":"fd03a0e845"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But Ole didn’t let this stop him.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 Ole은 이것이 그를 멈추게 두지 않았다.","opts":["하지만 Ole은 이 일이 그를 멈추게 두지 않고 계속 나아갔다.","하지만 Ole은 이 일 때문에 일을 그만두었다.","하지만 Ole은 이 일이 일어나는 것을 막지 못했다.","하지만 Ole은 이 일을 계기로 쉬기로 했다."],"r":{"a":"1) 하지만 Ole은 이 일이 그를 멈추게 두지 않고 계속 나아갔다.","ev":"9~10번 문장","s":[[9,"In 1942, another fire burned down his factory.","1942년에, 또 다른 화재가 그의 공장을 태워 버렸다."],[10,"But Ole didn’t let this stop him.","하지만 Ole은 이것이 그를 멈추게 두지 않았다."]],"w":"let A stop B는 ‘A가 B를 멈추게 두다’. didn’t let this stop him은 두 번째 화재도 그를 멈추지 못했다는 뜻이고, 12번에서 기계를 사서 다시 나아감.","c":1},"h":"399dc0cf3a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Ole은 1924년에 자신의 가게를 열었다.","Ole은 첫 번째 화재 전에 플라스틱 장난감을 만들었다.","Ole은 1946년에 첫 번째 플라스틱 장난감을 만들었다.","Ole이 나무 장난감을 만들기 시작한 뒤 그의 장난감은 큰 성공을 거두었다."],"opts":["Ole opened his shop in 1924.","Ole made plastic toys before the first fire.","Ole made his first plastic toy in 1946.","Ole’s toys became a big hit after he began making wooden toys."],"r":{"a":"4) Ole’s toys became a big hit after he began making wooden toys.","ev":"2번, 6번, 8번, 12~13번 문장","s":[[2,"He loved making things out of wood, so he opened his own shop in 1916.","그는 나무로 물건을 만드는 것을 아주 좋아해서 1916년에 자신의 가게를 열었다."],[6,"He built a bigger workshop and began making wooden toys.","그는 더 큰 작업실을 짓고 나무로 된 장난감을 만들기 시작했다."],[8,"Soon, his toys were a big hit.","곧, 그의 장난감은 큰 성공을 거두었다."],[12,"So in 1946, Ole bought a machine to make toys out of plastic.","그래서 1946년에, Ole은 플라스틱으로 장난감을 만들기 위해 기계를 구입했다."],[13,"He made his first plastic toy in 1949.","그는 1949년에 첫 번째 플라스틱 장난감을 만들었다."]],"w":"6번 나무 장난감을 만들기 시작하고 8번에서 곧 큰 성공을 거두었다는 내용과 일치. 가게는 1916년(2번)에 열었고, 기계를 산 것은 1946년이며 첫 플라스틱 장난감은 1949년(12~13번).","c":4},"h":"c45afd8134"},{"n":9,"t":"sum","q":"Even though two fires destroyed Ole’s (A), he kept going and later made his first (B) toy, which looked like a modern LEGO brick.","ko":"두 번의 화재가 Ole의 (A)를 파괴했지만 그는 계속 나아갔고, 나중에 현대 레고 블록과 비슷한 첫 (B) 장난감을 만들었다.","oko":["(A) 건물들 / (B) 나무","(A) 건물들 / (B) 플라스틱","(A) 장난감 / (B) 나무","(A) 장난감 / (B) 플라스틱","(A) 생각 / (B) 플라스틱"],"opts":["(A) buildings / (B) wooden","(A) buildings / (B) plastic","(A) toys / (B) wooden","(A) toys / (B) plastic","(A) ideas / (B) plastic"],"r":{"a":"2) (A) buildings / (B) plastic","ev":"4번, 9번, 13~14번 문장","s":[[4,"In 1924, a big fire destroyed his shop.","1924년에, 큰 화재가 그의 가게를 파괴했다."],[9,"In 1942, another fire burned down his factory.","1942년에, 또 다른 화재가 그의 공장을 태워 버렸다."],[13,"He made his first plastic toy in 1949.","그는 1949년에 첫 번째 플라스틱 장난감을 만들었다."],[14,"It looked a lot like a modern LEGO brick.","그것은 현대의 레고 블록과 매우 비슷해 보였다."]],"w":"4번에서 화재가 가게를, 9번에서 공장을 파괴했으니 (A)는 건물들(buildings). 13~14번에서 첫 플라스틱 장난감이 레고 블록과 비슷했으니 (B)는 plastic. 나무 장난감은 6번에서 이미 만들기 시작한 것.","c":2},"h":"343c719966"},{"n":10,"t":"fill","q":"People started using plastic because it was less [A], so Ole bought a [B] to make toys out of plastic.","ko":"사람들은 플라스틱이 덜 [A] 때문에 그것을 쓰기 시작했고, 그래서 Ole은 플라스틱으로 장난감을 만들 [B]를 샀다.","bko":{"expensive":"비싼","machine":"기계","furniture":"가구","renamed":"이름을 다시 지었다","ladders":"사다리들","Denmark":"덴마크"},"bank":["expensive","machine","furniture","renamed","ladders","Denmark"],"r":{"a":"[A] expensive, [B] machine","ev":"11~12번 문장","s":[[11,"Around this time, people started using plastic because it was less expensive.","이 시기쯤, 사람들은 플라스틱이 덜 비싸서 그것을 사용하기 시작했다."],[12,"So in 1946, Ole bought a machine to make toys out of plastic.","그래서 1946년에, Ole은 플라스틱으로 장난감을 만들기 위해 기계를 구입했다."]],"w":"11번 plastic … less expensive, 12번 Ole bought a machine to make toys out of plastic에서 가져옴. furniture(가구)·ladders(사다리)·Denmark(덴마크)는 3번·1번에 나온 말이고, renamed는 7번의 ‘이름을 다시 지었다’는 동작이라 ‘덜 ~한’이나 ‘기계’ 자리에 맞지 않음.","c":null},"h":"e3e67b03f8"}]},{"u":8,"id":"rg1-08-3","no":3,"ko":"깨진 그릇이 더 아름다워질 수 있다고?","items":[{"n":1,"t":"tf","q":"Noah broke his mom’s favorite bowl by accident.","ko":"Noah는 실수로 엄마가 가장 좋아하는 그릇을 깨뜨렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"One day, Noah accidentally broke his mom’s favorite bowl.","어느 날, Noah는 엄마가 가장 좋아하는 그릇을 실수로 깨뜨렸다."]],"w":"2번 문장에 Noah accidentally broke his mom’s favorite bowl이 나옴. accidentally는 ‘실수로’. broke는 break(깨뜨리다)의 과거형.","c":"T"},"h":"079ca302f7"},{"n":2,"t":"tf","q":"Mr. Sato bought a new bowl for Noah.","ko":"Sato 씨는 Noah에게 새 그릇을 사 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번, 7번 문장","s":[[5,"He said, “I can fix the bowl by using a special technique, kintsugi.”","그는 “나는 특별한 기술인 kintsugi를 사용해 그 그릇을 고칠 수 있단다.”라고 말했다."],[7,"Mr. Sato showed him how to fix the bowl: Mr. Sato glued the broken pieces together.","Sato 씨는 그에게 그릇을 고치는 방법을 보여주었다. Sato 씨는 깨진 조각들을 붙였다."]],"w":"5번에서 Sato 씨는 그릇을 고칠 수 있다고 했고, 7번에서 깨진 조각들을 붙였다고 함. 새 그릇을 샀다는 말은 본문에 없음.","c":"F"},"h":"8e532d7c6b"},{"n":3,"t":"tf","q":"Mr. Sato painted gold on the cracks.","ko":"Sato 씨는 깨진 틈에 금색을 칠했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Then he painted gold on the cracks.","그다음 그는 깨진 틈을 금색으로 칠했다."]],"w":"8번 문장에 Then he painted gold on the cracks가 나옴. he는 Mr. Sato, painted는 paint(칠하다)의 과거형.","c":"T"},"h":"2533b10b58"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day, Noah accidentally broke his mom’s favorite bowl.)","ko":"어느 날, Noah는 엄마가 가장 좋아하는 그릇을 accidentally 깨뜨렸다.","opts":["천천히","실수로","일부러","혼자서"],"word":"accidentally","r":{"a":"2) 실수로","ev":"2번 문장","s":[[2,"One day, Noah accidentally broke his mom’s favorite bowl.","어느 날, Noah는 엄마가 가장 좋아하는 그릇을 실수로 깨뜨렸다."]],"w":"accidentally는 ‘우연히, 실수로’. 3번에서 Noah가 정말 속상했다고 했으니 일부러 깬 것이 아님.","c":2},"h":"bf8dec96e8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (I can fix the bowl by using a special technique, kintsugi.)","ko":"나는 특별한 technique인 kintsugi를 사용해 그 그릇을 고칠 수 있단다.","opts":["이야기","도구","기술","그릇"],"word":"technique","r":{"a":"3) 기술","ev":"5번 문장","s":[[5,"He said, “I can fix the bowl by using a special technique, kintsugi.”","그는 “나는 특별한 기술인 kintsugi를 사용해 그 그릇을 고칠 수 있단다.”라고 말했다."]],"w":"special technique, kintsugi는 ‘특별한 기술, 즉 kintsugi’. 7~8번에서 조각을 붙이고 금색을 칠하는 방법이 바로 그 기술의 내용.","c":3},"h":"ca2e9018e9"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen he finished fixing the bowl, it looked different.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그가 그릇을 다 고쳤을 때, 그것은 달라 보였다.","opts":["고친 그릇","새로운 도시","Noah의 엄마","Sato 씨의 이웃"],"r":{"a":"1) 고친 그릇","ev":"9번 문장","s":[[9,"When he finished fixing the bowl, it looked different.","그가 그릇을 다 고쳤을 때, 그것은 달라 보였다."]],"w":"When he finished fixing the bowl에서 fixing의 대상이 the bowl이고, it looked different의 it은 그 고친 그릇. 다음 10번도 그릇이 전보다 더 아름다웠다고 함.","c":1},"h":"3efca24771"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He learned that things might break, but they can be fixed and become even better.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 물건이 깨질 수도 있지만, 그것들은 고쳐질 수 있고 훨씬 더 나아질 수도 있다는 것을 배웠다.","opts":["물건은 한번 깨지면 다시 쓸 수 없다는 것을 배웠다.","물건이 깨지지 않도록 조심해야 한다는 것을 배웠다.","새 물건을 사는 것이 고치는 것보다 낫다는 것을 배웠다.","물건은 깨질 수 있지만 고쳐서 더 좋아질 수도 있다는 것을 배웠다."],"r":{"a":"4) 물건은 깨질 수 있지만 고쳐서 더 좋아질 수도 있다는 것을 배웠다.","ev":"12번 문장","s":[[12,"He learned that things might break, but they can be fixed and become even better.","그는 물건이 깨질 수도 있지만, 그것들은 고쳐질 수 있고 훨씬 더 나아질 수도 있다는 것을 배웠다."]],"w":"might break는 ‘깨질 수도 있다’, but 뒤의 can be fixed and become even better는 ‘고쳐질 수 있고 훨씬 더 나아질 수 있다’. 한번 깨지면 끝이라는 선지는 정반대.","c":4},"h":"a710304317"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Noah는 새로운 도시에서 행복했다.","Noah는 일부러 그릇을 깨뜨렸다.","Sato 씨가 고친 뒤 그릇은 전보다 더 아름다웠다.","Sato 씨는 깨진 조각들을 버렸다."],"opts":["Noah felt happy in the new city.","Noah broke the bowl on purpose.","After Mr. Sato fixed it, the bowl looked more beautiful than before.","Mr. Sato threw away the broken pieces."],"r":{"a":"3) After Mr. Sato fixed it, the bowl looked more beautiful than before.","ev":"1~2번, 7번, 10번 문장","s":[[1,"Noah and his mom moved to a new city, but he felt sad and missed his old life.","Noah와 그의 엄마는 새로운 도시로 이사 갔지만, 그는 슬펐고 예전의 삶을 그리워했다."],[2,"One day, Noah accidentally broke his mom’s favorite bowl.","어느 날, Noah는 엄마가 가장 좋아하는 그릇을 실수로 깨뜨렸다."],[7,"Mr. Sato showed him how to fix the bowl: Mr. Sato glued the broken pieces together.","Sato 씨는 그에게 그릇을 고치는 방법을 보여주었다. Sato 씨는 깨진 조각들을 붙였다."],[10,"But it was even more beautiful than before.","하지만 그것은 전보다 훨씬 더 아름다웠다."]],"w":"10번에서 고친 그릇이 전보다 훨씬 더 아름다웠다고 함. Noah는 슬펐고(1번), 그릇은 실수로 깨졌고(2번), Sato 씨는 깨진 조각들을 붙였음(7번).","c":3},"h":"e2da802784"},{"n":9,"t":"sum","q":"Noah felt (A) at first, but after the repair, he learned that broken things can become even (B).","ko":"Noah는 처음에 (A)했지만, 수리를 보고 깨진 물건이 훨씬 더 (B)질 수 있다는 것을 배웠다.","oko":["(A) 슬픈 / (B) 나빠","(A) 행복한 / (B) 나빠","(A) 화난 / (B) 나아","(A) 행복한 / (B) 나아","(A) 슬픈 / (B) 나아"],"opts":["(A) sad / (B) worse","(A) happy / (B) worse","(A) angry / (B) better","(A) happy / (B) better","(A) sad / (B) better"],"r":{"a":"5) (A) sad / (B) better","ev":"1번, 11~12번 문장","s":[[1,"Noah and his mom moved to a new city, but he felt sad and missed his old life.","Noah와 그의 엄마는 새로운 도시로 이사 갔지만, 그는 슬펐고 예전의 삶을 그리워했다."],[11,"It felt like a new start for Noah.","그것은 Noah에게 새로운 시작처럼 느껴졌다."],[12,"He learned that things might break, but they can be fixed and become even better.","그는 물건이 깨질 수도 있지만, 그것들은 고쳐질 수 있고 훨씬 더 나아질 수도 있다는 것을 배웠다."]],"w":"1번에서 Noah는 sad(슬픈) 상태였고, 12번에서 깨진 물건이 고쳐지면 even better(훨씬 더 나아짐)한다는 것을 배움.","c":5},"h":"b797c75bcf"},{"n":10,"t":"fill","q":"Mr. Sato painted [A] on the cracks, and the bowl became even more [B] than before.","ko":"Sato 씨는 깨진 틈에 [A]을 칠했고, 그릇은 전보다 훨씬 더 [B]해졌다.","bko":{"gold":"금색","beautiful":"아름다운","besides":"게다가","without":"~없이","learned":"배웠다","happen":"일어나다"},"bank":["gold","beautiful","besides","without","learned","happen"],"r":{"a":"[A] gold, [B] beautiful","ev":"8~10번 문장","s":[[8,"Then he painted gold on the cracks.","그다음 그는 깨진 틈을 금색으로 칠했다."],[9,"When he finished fixing the bowl, it looked different.","그가 그릇을 다 고쳤을 때, 그것은 달라 보였다."],[10,"But it was even more beautiful than before.","하지만 그것은 전보다 훨씬 더 아름다웠다."]],"w":"8번 painted gold on the cracks, 10번 it was even more beautiful than before에서 가져옴. besides(게다가)·without(~없이)은 연결·설명하는 말이고 learned(배웠다)·happen(일어나다)은 동작이라, ‘칠한 것’이나 ‘더 ~한’ 자리에 들어갈 수 없음.","c":null},"h":"039b1adda7"}]},{"u":9,"id":"rg1-09-1","no":1,"ko":"냄새는 지독해도 맛있다는 아이슬란드의 국민 음식","items":[{"n":1,"t":"tf","q":"Hákarl is made from the Greenland shark.","ko":"하우카르는 그린란드 상어로 만들어진다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It’s made from the Greenland shark.","그것은 그린란드 상어로 만들어진다."]],"w":"2번 문장에 It’s made from the Greenland shark가 나옴. It은 1번의 Hákarl.","c":"T"},"h":"82710065f4"},{"n":2,"t":"tf","q":"People can eat the shark meat right away without any problem.","ko":"사람들은 상어 고기를 아무 문제 없이 바로 먹을 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"But if you eat the shark meat right away, it can make you feel sick.","하지만 상어 고기를 바로 먹으면, 그것은 여러분을 아프게 만들 수 있다."],[4,"The shark has harmful things in its body.","그 상어의 몸에는 해로운 것들이 있다."]],"w":"3번에서 바로 먹으면 아프게 만들 수 있다고 하고, 4번에서 상어 몸에 해로운 것들이 있다고 함. 그래서 바로 먹지 않는다.","c":"F"},"h":"737f9343ef"},{"n":3,"t":"tf","q":"Some people love Hákarl, and some people don’t.","ko":"어떤 사람들은 하우카르를 아주 좋아하고, 어떤 사람들은 그렇지 않다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Because of this, some people love it, and some don’t.","이 때문에, 어떤 사람들은 그것을 아주 좋아하고, 어떤 사람들은 그렇지 않다."]],"w":"11번 문장에 some people love it, and some don’t가 그대로 나옴. 냄새가 강한 것(10번) 때문에 호불호가 갈림.","c":"T"},"h":"077feb11c9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The shark has harmful things in its body.)","ko":"그 상어의 몸에는 harmful 것들이 있다.","opts":["귀한","해로운","맛있는","차가운"],"word":"harmful","r":{"a":"2) 해로운","ev":"4번 문장","s":[[4,"The shark has harmful things in its body.","그 상어의 몸에는 해로운 것들이 있다."]],"w":"3번에서 바로 먹으면 아프게 만든다고 했으니, 4번의 harmful things는 몸에 해로운 것들. 6번에서 그것을 없앤다고 함.","c":2},"h":"ac3c96e121"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This helps remove the harmful things.)","ko":"이것은 해로운 것들을 remove 데 도움이 된다.","opts":["섞다","기르다","모으다","없애다"],"word":"remove","r":{"a":"4) 없애다","ev":"6번 문장","s":[[6,"This helps remove the harmful things.","이것은 해로운 것들을 없애는 데 도움이 된다."]],"w":"remove는 ‘없애다, 제거하다’. 5번의 발효하고 말리는 방법이 해로운 것을 없앤다는 흐름. 해로운 것을 모으거나 기른다면 문장이 맞지 않음.","c":4},"h":"5e5cfce634"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThey’re proud of it and love their tradition.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그들은 그것을 자랑스러워하고 그들의 전통을 사랑한다.","opts":["그린란드 상어","암모니아","하우카르","아이슬란드의 전통 놀이"],"r":{"a":"3) 하우카르","ev":"12~13번 문장","s":[[12,"Although it smells strong, Hákarl is a very special food for Icelanders.","비록 그것이 냄새가 강하긴 하지만, 하우카르는 아이슬란드 사람들에게 매우 특별한 음식이다."],[13,"They’re proud of it and love their tradition.","그들은 그것을 자랑스러워하고 그들의 전통을 사랑한다."]],"w":"12번에서 하우카르가 아이슬란드 사람들에게 아주 특별한 음식이라고 했고, 13번에서 그들이 그것(it = Hákarl)을 자랑스러워한다고 이어짐.","c":3},"h":"98ff63558f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because of this, some people love it, and some don’t.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 때문에, 어떤 사람들은 그것을 아주 좋아하고, 어떤 사람들은 그렇지 않다.","opts":["이 냄새 때문에 어떤 사람들은 좋아하고, 어떤 사람들은 좋아하지 않는다.","이 냄새 때문에 아무도 그것을 먹지 않는다.","이 냄새 때문에 어떤 사람들은 그것을 만들고, 어떤 사람들은 만들지 않는다.","이 냄새 때문에 모든 사람이 그것을 싫어한다."],"r":{"a":"1) 이 냄새 때문에 어떤 사람들은 좋아하고, 어떤 사람들은 좋아하지 않는다.","ev":"10~11번 문장","s":[[10,"Some people say Hákarl smells like ammonia.","어떤 사람들은 하우카르가 암모니아 같은 냄새가 난다고 말한다."],[11,"Because of this, some people love it, and some don’t.","이 때문에, 어떤 사람들은 그것을 아주 좋아하고, 어떤 사람들은 그렇지 않다."]],"w":"this는 10번의 ‘암모니아 같은 냄새가 난다’는 말. some people love it, and some don’t는 ‘어떤 사람들은 좋아하고, 어떤 사람들은 좋아하지 않는다’는 뜻.","c":1},"h":"c33579ec57"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["하우카르는 작은 물고기로 만든다.","아이슬란드 사람들은 상어 고기를 단 하루 동안만 상자에 넣어 둔다.","하우카르는 아무 냄새도 나지 않는다.","아이슬란드 사람들은 하우카르를 자랑스러워한다."],"opts":["Hákarl is made from a small fish.","Icelanders put the shark meat in boxes for just one day.","Hákarl has no smell.","Icelanders are proud of Hákarl."],"r":{"a":"4) Icelanders are proud of Hákarl.","ev":"2번, 7번, 9번, 13번 문장","s":[[2,"It’s made from the Greenland shark.","그것은 그린란드 상어로 만들어진다."],[7,"To make Hákarl, people clean the shark meat and put it in boxes for several weeks.","하우카르를 만들기 위해, 사람들은 상어 고기를 씻어서 몇 주 동안 상자에 넣어 둔다."],[9,"When it’s ready, it has a strong smell and taste.","그것이 준비되면, 강한 냄새와 맛이 난다."],[13,"They’re proud of it and love their tradition.","그들은 그것을 자랑스러워하고 그들의 전통을 사랑한다."]],"w":"13번에서 아이슬란드 사람들이 하우카르를 자랑스러워한다고 함. 재료는 그린란드 상어(2번), 상자에 넣는 기간은 몇 주(7번), 냄새는 강함(9번).","c":4},"h":"050bf3be10"},{"n":9,"t":"sum","q":"To remove the harmful things in the shark, Icelanders (A) and dry the meat, and Hákarl is a (B) food for them.","ko":"상어의 해로운 것들을 없애기 위해 아이슬란드 사람들은 고기를 (A)하고 말리며, 하우카르는 그들에게 (B) 음식이다.","oko":["(A) 요리 / (B) 값싼","(A) 판매 / (B) 평범한","(A) 요리 / (B) 특별한","(A) 발효 / (B) 평범한","(A) 발효 / (B) 특별한"],"opts":["(A) cook / (B) cheap","(A) sell / (B) ordinary","(A) cook / (B) special","(A) ferment / (B) ordinary","(A) ferment / (B) special"],"r":{"a":"5) (A) ferment / (B) special","ev":"4~6번, 12번 문장","s":[[4,"The shark has harmful things in its body.","그 상어의 몸에는 해로운 것들이 있다."],[5,"So, Icelanders ferment and dry out the shark meat.","그래서 아이슬란드 사람들은 상어 고기를 발효하고 건조시킨다."],[6,"This helps remove the harmful things.","이것은 해로운 것들을 없애는 데 도움이 된다."],[12,"Although it smells strong, Hákarl is a very special food for Icelanders.","비록 그것이 냄새가 강하긴 하지만, 하우카르는 아이슬란드 사람들에게 매우 특별한 음식이다."]],"w":"4~6번에서 해로운 것을 없애려고 ferment and dry out(발효하고 말린다)한다고 함. 12번에서 아이슬란드 사람들에게 very special food(아주 특별한 음식)라고 함.","c":5},"h":"addf00766b"},{"n":10,"t":"fill","q":"To make Hákarl, people put the shark meat in boxes for several [A], and then hang it outside to [B].","ko":"하우카르를 만들기 위해 사람들은 상어 고기를 몇 [A] 동안 상자에 넣어 두고, 그다음 밖에 걸어서 [B].","bko":{"weeks":"주","dry":"말리다","harmful":"해로운","strong":"강한","special":"특별한","Iceland":"아이슬란드"},"bank":["weeks","dry","harmful","strong","special","Iceland"],"r":{"a":"[A] weeks, [B] dry","ev":"7~8번 문장","s":[[7,"To make Hákarl, people clean the shark meat and put it in boxes for several weeks.","하우카르를 만들기 위해, 사람들은 상어 고기를 씻어서 몇 주 동안 상자에 넣어 둔다."],[8,"Then, they hang the meat outside to dry for four to five months.","그다음, 그들은 말리기 위해 고기를 밖에 4~5개월 동안 걸어 둔다."]],"w":"7번 put it in boxes for several weeks, 8번 hang the meat outside to dry에서 가져옴. harmful(해로운)·strong(강한)·special(특별한)은 꾸며 주는 말이고 Iceland는 나라 이름이라, ‘몇 ~ 동안’의 단위나 ‘~하기 위해’ 뒤 동작 자리에 들어갈 수 없음.","c":null},"h":"43ca235c75"}]},{"u":9,"id":"rg1-09-2","no":2,"ko":"“pyt” 한마디로 행복해지는 나라가 있다고?","items":[{"n":1,"t":"tf","q":"Denmark is one of the happiest countries in the world.","ko":"덴마크는 세계에서 가장 행복한 나라 중 하나이다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Denmark is one of the happiest countries in the world.","덴마크는 세계에서 가장 행복한 나라 중 하나이다."]],"w":"1번 문장에 Denmark is one of the happiest countries in the world가 그대로 나옴.","c":"T"},"h":"bc4761c5a2"},{"n":2,"t":"tf","q":"Danish people say “pyt” when
