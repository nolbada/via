<title>정답</title>
<style>
:root{--bg:#f4f6f8;--card:#ffffff;--ink:#14202b;--sub:#566474;--line:#d9e0e7}
@media (prefers-color-scheme:dark){:root{--bg:#0c1f2b;--card:#14303f;--ink:#e8eef2;--sub:#9db0bd;--line:#24465a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:22px;margin:0 0 20px;letter-spacing:-.01em}
.ns{border:2px solid var(--k);background:var(--kb);border-radius:16px;padding:4px 12px 10px;margin:0 0 18px;--k:#e2a6ec;--kb:#fbeefd;--kh:#efc8f6}
@media (prefers-color-scheme:dark){.ns{--k:#6d2a78;--kb:#2a1530;--kh:#6d2a78}}
.ns h2{display:block;text-align:center;font-size:24px;font-weight:900;letter-spacing:.06em;color:var(--ink);background:var(--kh);border-radius:12px;padding:12px 10px;margin:10px 0 12px}
.ns h3{font-size:13px;font-weight:700;color:var(--sub);margin:12px 2px 6px;letter-spacing:.02em}
.sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sg a{display:flex;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:16px 4px;color:var(--ink);text-decoration:none;font-size:18px;font-weight:700;min-width:0}
.sg a:active{background:var(--line)}
</style>
</head>
<body>
<main>
<h1>정답</h1>
<div class="ns">
<h2>문법</h2>
<h3>그래머인사이드</h3>
<div class="sg">
<a href="https://nolbada.github.io/via/grammar-inside/l1-key/" style="--c:#a21caf">L1</a>
</div>
</div>
</main>
</body>
</html>
