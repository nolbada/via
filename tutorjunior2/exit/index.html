<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주니어 리딩튜터 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"rj2-01-1","no":1,"ko":"왜 잠그지 않는 거야!","items":[{"n":1,"t":"tf","q":"Jackets are made to fit the body loosely.","ko":"재킷은 몸에 헐렁하게 맞도록 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Jackets are made to fit the body tightly.","재킷은 몸에 꼭 맞게 만들어진다."]],"w":"4번 문장에서 재킷은 몸에 꼭 맞게(tightly) 만들어진다고 해요. 헐렁하다는 말은 반대예요.","c":"F"},"h":"852fc6b605"},{"n":2,"t":"tf","q":"Edward VII couldn't close the bottom button of his jacket.","ko":"에드워드 7세는 재킷의 맨 아래 단추를 잠글 수 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"He couldn’t close the bottom button of his jacket!","그는 재킷의 맨 아래 단추를 잠글 수가 없었다!"]],"w":"11번 문장에 He couldn't close the bottom button of his jacket!이 그대로 나와요.","c":"T"},"h":"86e3a2454f"},{"n":3,"t":"tf","q":"People kept buttoning their bottom button to show respect to Edward VII.","ko":"사람들은 에드워드 7세에게 존경을 보이기 위해 맨 아래 단추를 계속 잠갔다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"To show respect to him, people stopped buttoning their bottom button as well.","그에 대한 존경을 표하기 위해, 사람들도 역시 맨 아래 단추를 잠그는 것을 멈췄다."]],"w":"12번 문장에서 사람들은 존경을 보이려고 맨 아래 단추 잠그는 것을 멈췄어요(stopped buttoning). 계속 잠갔다는 말은 반대예요.","c":"F"},"h":"11e207f6ca"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One simple theory behind this is that it is practical.)","ko":"이것 뒤에 숨겨진 한 가지 간단한 이론은 그것이 ( )이라는 것이다.","opts":["위험한","비싼","실용적인","유행하는"],"word":"practical","r":{"a":"3) 실용적인","ev":"3번, 5번 문장","s":[[3,"One simple theory behind this is that it is practical.","이것 뒤에 숨겨진 한 가지 간단한 이론은 그것이 실용적이라는 것이다."],[5,"With the bottom button open, the person can move more easily.","맨 아래 단추가 열려 있어서, 사람은 더 쉽게 움직일 수 있다."]],"w":"3번은 첫 번째 이론이고, 5번에서 단추가 열려 있으면 더 쉽게 움직일 수 있다고 해요. 쓸모가 있다는 뜻의 '실용적인'이 알맞아요.","c":3},"h":"f4d642bfa9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Edward VII loved eating so much that he was overweight.)","ko":"에드워드 7세는 먹는 것을 너무 좋아해서 ( )이었다.","opts":["과체중인","키가 큰","유명한","게으른"],"word":"overweight","r":{"a":"1) 과체중인","ev":"10~11번 문장","s":[[10,"However, Edward VII loved eating so much that he was overweight.","하지만, 에드워드 7세는 먹는 것을 너무 좋아해서 과체중이었다."],[11,"He couldn’t close the bottom button of his jacket!","그는 재킷의 맨 아래 단추를 잠글 수가 없었다!"]],"w":"먹는 것을 너무 좋아해서 단추를 잠그지 못했다고 하니(11번) '체중이 많이 나가는'이라는 뜻의 과체중이에요.","c":1},"h":"ea24ed38a3"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is especially true for sitting down.","ko":"밑줄 친 This이(가) 가리키는 것은?","sko":"이것은 특히 앉을 때에 해당된다.","opts":["재킷이 몸에 꼭 맞게 만들어진다는 것","맨 아래 단추가 열려 있으면 더 쉽게 움직일 수 있다는 것","에드워드 7세가 왕이었다는 것","사람들이 단추를 잠그지 않는다는 것"],"r":{"a":"2) 맨 아래 단추가 열려 있으면 더 쉽게 움직일 수 있다는 것","ev":"5~6번 문장","s":[[5,"With the bottom button open, the person can move more easily.","맨 아래 단추가 열려 있어서, 사람은 더 쉽게 움직일 수 있다."],[6,"This is especially true for sitting down.","이것은 특히 앉을 때에 해당된다."]],"w":"This는 바로 앞 5번 문장 내용을 가리켜요. 단추가 열려 있으면 더 쉽게 움직이는데, 앉을 때 특히 그렇다는 뜻이에요.","c":2},"pron":"This","h":"655b5dd8a0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Over time, this has become today's practice for jacket buttons.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시간이 지나면서, 이것은 재킷 단추에 대한 오늘날의 관행이 되었다.","opts":["이 관행은 오늘날 완전히 사라졌다.","에드워드 7세는 오늘날의 재킷 단추를 처음 만들었다.","재킷 단추는 시간이 지나면서 점점 더 커졌다.","시간이 지나면서 이것은 오늘날 재킷 단추를 다루는 관행이 되었다."],"r":{"a":"4) 시간이 지나면서 이것은 오늘날 재킷 단추를 다루는 관행이 되었다.","ev":"13번 문장","s":[[13,"Over time, this has become today’s practice for jacket buttons.","시간이 지나면서, 이것은 재킷 단추에 대한 오늘날의 관행이 되었다."]],"w":"has become today's practice는 '오늘날의 관행이 되었다'는 뜻이에요. 사라졌다는 말도, 단추 크기 이야기도 아니에요.","c":4},"h":"5eb5502276"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우아한 정장은 에드워드 7세가 웨일스의 왕자였을 때 궁정에서 인기가 있었다.","재킷의 맨 아래 단추는 만들기 어려워서 풀어 둔다.","사람들은 화가 나서 왕에게 항의하려고 단추를 잠그지 않았다.","에드워드 7세는 말랐기 때문에 재킷이 너무 컸다."],"opts":["Elegant suits were popular in court when Edward VII was the Prince of Wales.","The bottom button of a jacket is left undone because it is hard to make.","People stopped buttoning their jackets to protest against the king.","Edward VII was thin, so his jackets were too big."],"r":{"a":"1) Elegant suits were popular in court when Edward VII was the Prince of Wales. (우아한 정장은 에드워드 7세가 웨일스의 왕자였을 때 궁정에서 인기가 있었다.)","ev":"9번 문장","s":[[9,"When he was the Prince of Wales, elegant suits were popular in court.","그가 웨일스의 왕자였을 때, 우아한 정장은 궁정에서 인기가 있었다."]],"w":"9번 문장에 그대로 나와요. 나머지는 본문에 없는 내용이에요.","c":1},"h":"0e1f2643b8"},{"n":9,"t":"sum","q":"In many suit jackets, the bottom button is left (A). One theory says that this lets the person (B) more easily.","ko":"많은 정장 재킷에서 맨 아래 단추는 (A) 상태이다. 한 이론은 이렇게 하면 사람이 더 쉽게 (B)할 수 있다고 한다.","oko":["(A) 닫힌 / (B) 움직이다","(A) 열린 / (B) 숨다","(A) 열린 / (B) 움직이다","(A) 잃어버린 / (B) 움직이다","(A) 열린 / (B) 먹다"],"opts":["(A) closed / (B) move","(A) open / (B) hide","(A) open / (B) move","(A) lost / (B) move","(A) open / (B) eat"],"r":{"a":"3) (A) open / (B) move (A 열린 / B 움직이다)","ev":"1번, 5번 문장","s":[[1,"You can often find something in common among people wearing suit jackets: their bottom button is left open.","당신은 정장 재킷을 입은 사람들 사이에서 흔히 공통점을 발견할 수 있다. 맨 아래 단추가 열려 있다."],[5,"With the bottom button open, the person can move more easily.","맨 아래 단추가 열려 있어서, 사람은 더 쉽게 움직일 수 있다."]],"w":"1번에서 맨 아래 단추가 열려 있다고 했고(open), 5번에서 단추가 열려 있으면 더 쉽게 움직일 수 있다고 했어요(move).","c":3},"h":"b23e4d5edb"},{"n":10,"t":"fill","q":"There is [A] interesting theory. King Edward VII of England [B] from 1901 to 1910.","ko":"[A] 흥미로운 이론이 있다. 영국의 왕 에드워드 7세는 1901년부터 1910년까지 [B].","bank":["another","ruled","button","easily","respect","tight"],"bko":{"another":"또 다른","ruled":"통치했다(rule의 과거)","button":"단추","easily":"쉽게","respect":"존경","tight":"꼭 끼는"},"r":{"a":"[A] another (또 다른), [B] ruled (통치했다)","ev":"7~8번 문장","s":[[7,"There is another interesting theory.","또 다른 흥미로운 이론이 있다."],[8,"King Edward VII of England ruled from 1901 to 1910.","영국의 왕 에드워드 7세는 1901년부터 1910년까지 통치했다."]],"w":"7번 There is another interesting theory.와 8번 King Edward VII of England ruled from 1901 to 1910.에서 가져왔어요. 나머지 단어는 두 빈칸에 문법상 들어갈 수 없어요.","c":null},"h":"104e8fe780"}]},{"u":1,"id":"rj2-01-2","no":2,"ko":"작은 삼각형의 비밀","items":[{"n":1,"t":"tf","q":"The triangle shape was on the very first sweatshirts.","ko":"그 삼각형 모양은 최초의 맨투맨 티에 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This shape was on the very first sweatshirts.","이 모양은 최초의 맨투맨 티에 있었다."]],"w":"3번 문장에 This shape was on the very first sweatshirts가 그대로 나와요.","c":"T"},"h":"19d137be7d"},{"n":2,"t":"tf","q":"Sweatshirts were first made as party clothes.","ko":"맨투맨 티는 처음에 파티복으로 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Sweatshirts were exercise clothing.","맨투맨 티는 운동복이었다."]],"w":"7번 문장에서 맨투맨 티는 운동복(exercise clothing)이었다고 해요. 파티복은 본문에 없는 내용이에요.","c":"F"},"h":"48c09b5443"},{"n":3,"t":"tf","q":"Companies stopped using the triangle as a design feature.","ko":"회사들은 삼각형을 디자인 특징으로 사용하는 것을 그만두었다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"But many companies still include the triangle as a classic design feature.","그러나 많은 회사들이 여전히 이 삼각형을 고전적인 디자인 특징으로 포함시킨다."]],"w":"12번 문장에서 많은 회사가 여전히(still) 삼각형을 고전적인 디자인 특징으로 넣는다고 해요. 그만두었다는 말은 반대예요.","c":"F"},"h":"667214bc13"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is made from stretchable material, like the waistband on a pair of shorts.)","ko":"그것은 한 벌의 반바지에 있는 허리 밴드처럼 ( ) 소재로 만들어진다.","opts":["단단한","신축성 있는","투명한","무거운"],"word":"stretchable","r":{"a":"2) 신축성 있는","ev":"5번 문장","s":[[5,"It is made from stretchable material, like the waistband on a pair of shorts.","그것은 한 벌의 반바지에 있는 허리 밴드처럼 신축성 있는 소재로 만들어진다."]],"w":"반바지 허리 밴드는 몸에 맞게 늘어나는 소재예요. stretch(늘이다)에 가능을 뜻하는 -able이 붙어 '늘어나는, 신축성 있는'이에요.","c":2},"h":"a131df2d92"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The V-stitch had extra material that soaked up sweat and reduced discomfort.)","ko":"V 스티치에는 땀을 ( ) 불쾌함을 줄여 주는 여분의 직물이 있었다.","opts":["뿌렸다","씻어 냈다","흡수했다","숨겼다"],"word":"soaked up","r":{"a":"3) 흡수했다","ev":"8~9번 문장","s":[[8,"People sweat a lot when they exercise, and the sweat makes clothing wet and uncomfortable.","사람들은 운동할 때 땀을 많이 흘리고, 그 땀은 옷을 축축하고 불편하게 만든다."],[9,"The V-stitch had extra material that soaked up sweat and reduced discomfort.","V 스티치에는 땀을 흡수하여 불쾌함을 줄여 주는 여분의 직물이 있었다."]],"w":"8번에서 땀이 옷을 축축하게 만든다고 했고, 9번에서 그 땀을 처리해 불쾌함을 줄였다고 해요. 그래서 soak up(빨아들이다)이 '흡수했다'예요.","c":3},"h":"87dc2cb16e"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIn addition, it allowed people to put their head through the collar more easily.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"게다가, 그것은 사람들이 머리를 칼라를 통과해 더 쉽게 집어넣게 해 주었다.","opts":["땀","V 스티치","칼라","운동하는 사람들"],"r":{"a":"2) V 스티치","ev":"9~10번 문장","s":[[9,"The V-stitch had extra material that soaked up sweat and reduced discomfort.","V 스티치에는 땀을 흡수하여 불쾌함을 줄여 주는 여분의 직물이 있었다."],[10,"In addition, it allowed people to put their head through the collar more easily.","게다가, 그것은 사람들이 머리를 칼라를 통과해 더 쉽게 집어넣게 해 주었다."]],"w":"10번의 it은 앞 9번에서 설명한 주어 The V-stitch를 받아요. 머리를 칼라로 쉽게 넣게 해 준 것은 V 스티치예요.","c":2},"h":"f3f17eedda"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Due to improvements in the quality of sportswear, the V-stitch is no longer necessary.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"운동복의 품질 향상으로, V 스티치가 더는 필요하지 않다.","opts":["V 스티치 덕분에 운동복의 품질이 좋아졌다.","운동복의 품질이 나빠져서 V 스티치가 필요해졌다.","V 스티치는 아직도 모든 운동복에 꼭 필요하다.","운동복의 품질이 좋아져서 V 스티치가 더는 필요하지 않다."],"r":{"a":"4) 운동복의 품질이 좋아져서 V 스티치가 더는 필요하지 않다.","ev":"11번 문장","s":[[11,"Due to improvements in the quality of sportswear, the V-stitch is no longer necessary.","운동복의 품질 향상으로, V 스티치가 더는 필요하지 않다."]],"w":"due to는 '~ 때문에'라서 원인은 품질 향상이고, 결과는 V 스티치가 필요 없어진 거예요. no longer는 '더는 ~않다'예요.","c":4},"h":"98110cc5dc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["삼각형 모양은 때때로 ‘V 스티치’라고 불린다.","V 스티치는 맨투맨 티를 더 비싸게 만들려고 더해졌다.","삼각형 모양은 최근에야 맨투맨 티에 더해졌다.","삼각형 모양에는 이름이 없어서 누구도 부르지 않는다."],"opts":["The triangle shape is sometimes called the “V-stitch.”","The V-stitch was added to make sweatshirts more expensive.","The triangle shape was added to sweatshirts only recently.","The triangle shape has no name, so nobody calls it anything."],"r":{"a":"1) The triangle shape is sometimes called the “V-stitch.” (삼각형 모양은 때때로 ‘V 스티치’라고 불린다.)","ev":"3~4번, 9번 문장","s":[[3,"This shape was on the very first sweatshirts.","이 모양은 최초의 맨투맨 티에 있었다."],[4,"In the fashion industry, it is sometimes called the “V-stitch.”","패션 업계에서 그것은 때때로 ‘V 스티치’라고 불린다."],[9,"The V-stitch had extra material that soaked up sweat and reduced discomfort.","V 스티치에는 땀을 흡수하여 불쾌함을 줄여 주는 여분의 직물이 있었다."]],"w":"4번에 그대로 나와요. 3번에서 최초의 맨투맨 티에 있었다고 했고, 9번에서 V 스티치는 땀을 흡수해 불쾌함을 줄여 줬어요.","c":1},"h":"68773519bd"},{"n":9,"t":"sum","q":"People sweat a lot when they exercise, and the sweat makes clothing (A) and (B).","ko":"사람들은 운동할 때 땀을 많이 흘리고, 그 땀은 옷을 (A)하고 (B)하게 만든다.","oko":["(A) 건조한 / (B) 불편한","(A) 축축한 / (B) 차가운","(A) 축축한 / (B) 불편한","(A) 뜨거운 / (B) 불편한","(A) 축축한 / (B) 꽉 끼는"],"opts":["(A) dry / (B) uncomfortable","(A) wet / (B) cold","(A) wet / (B) uncomfortable","(A) hot / (B) uncomfortable","(A) wet / (B) tight"],"r":{"a":"3) (A) wet / (B) uncomfortable (A 축축한 / B 불편한)","ev":"8번 문장","s":[[8,"People sweat a lot when they exercise, and the sweat makes clothing wet and uncomfortable.","사람들은 운동할 때 땀을 많이 흘리고, 그 땀은 옷을 축축하고 불편하게 만든다."]],"w":"8번에서 땀이 옷을 wet(축축한)하고 uncomfortable(불편한)하게 만든다고 했어요.","c":3},"h":"15ea5d6700"},{"n":10,"t":"fill","q":"Most people own at least one [A] sweatshirt. However, few people notice the triangle shape just [B] the collar.","ko":"대부분의 사람들은 적어도 하나의 [A] 맨투맨 티를 가지고 있다. 그러나 칼라 바로 [B]에 있는 삼각형 모양을 의식하는 사람들은 거의 없다.","bank":["comfortable","below","easily","notice","never","because"],"bko":{"comfortable":"편안한","below":"~ 아래에","easily":"쉽게","notice":"알아채다","never":"결코 ~않다","because":"~ 때문에"},"r":{"a":"[A] comfortable (편안한), [B] below (~ 아래에)","ev":"1~2번 문장","s":[[1,"Most people own at least one comfortable sweatshirt.","대부분의 사람들은 편안한 맨투맨 티를 적어도 하나는 가지고 있다."],[2,"However, few people notice the triangle shape just below the collar.","그러나 칼라 바로 아래에 있는 삼각형 모양을 의식하는 사람들은 거의 없다."]],"w":"1~2번 문장에서 가져왔어요. A에는 sweatshirt를 꾸미는 말, B에는 the collar 앞에 오는 위치 말이 들어가야 해요.","c":null},"h":"5e536bbeee"}]},{"u":1,"id":"rj2-01-3","no":3,"ko":"이 단추의 용도가 뭐야?","items":[{"n":1,"t":"tf","q":"Napoleon didn't like his soldiers' dirty habit.","ko":"나폴레옹은 군인들의 더러운 습관을 좋아하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Napoleon didn’t like this dirty habit.","나폴레옹은 이 더러운 습관을 좋아하지 않았다."]],"w":"5번 문장에 Napoleon didn't like this dirty habit이 나와요. 그 습관은 4번의 소매에 콧물을 닦는 것이에요.","c":"T"},"h":"659dff3ae3"},{"n":2,"t":"tf","q":"The soldiers wiped their noses with handkerchiefs at first.","ko":"군인들은 처음에 손수건으로 코를 닦았다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"His soldiers often wiped their noses on the sleeves of their jackets.","그의 군인들은 종종 재킷 소매에 콧물을 닦았다."]],"w":"4번 문장에서 군인들은 처음에 재킷의 소매에 콧물을 닦았어요. 손수건을 쓴 것은 단추가 달린 뒤(11번)예요.","c":"F"},"h":"ff234879b0"},{"n":3,"t":"tf","q":"Napoleon had metal buttons sewn onto the sleeves.","ko":"나폴레옹은 소매에 금속 단추를 꿰매게 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"He had metal buttons sewn onto the sleeves.","그는 소매에 금속 단추를 꿰매게 했다."]],"w":"8번 문장에 He had metal buttons sewn onto the sleeves가 그대로 나와요.","c":"T"},"h":"d7c3e33d76"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So he came up with a clever but rather cruel solution.)","ko":"그래서 그는 영리하지만 다소 ( ) 해결책을 생각해 냈다.","opts":["친절한","잔인한","웃긴","느린"],"word":"cruel","r":{"a":"2) 잔인한","ev":"7번, 9~10번 문장","s":[[7,"So he came up with a clever but rather cruel solution.","그래서 그는 영리하지만 다소 잔인한 해결책을 생각해 냈다."],[9,"Whenever the soldiers tried to wipe their noses with their sleeves, the rough metal scratched their faces.","군인들이 소매로 그들의 코를 닦으려 할 때마다, 거친 금속이 그들의 얼굴을 긁었다."],[10,"It was very painful.","그것은 매우 고통스러웠다."]],"w":"단추가 군인들의 얼굴을 긁어 매우 고통스러웠다고 해요(9~10번). 그래서 해결책이 영리하지만 다소 '잔인한'이에요.","c":2},"h":"622c5a68e5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (His soldiers often wiped their noses on the sleeves of their jackets.)","ko":"그의 군인들은 종종 재킷 소매에 콧물을 ( ).","opts":["씻었다","찔렀다","닦았다","던졌다"],"word":"wiped","r":{"a":"3) 닦았다","ev":"4~5번 문장","s":[[4,"His soldiers often wiped their noses on the sleeves of their jackets.","그의 군인들은 종종 재킷 소매에 콧물을 닦았다."],[5,"Napoleon didn’t like this dirty habit.","나폴레옹은 이 더러운 습관을 좋아하지 않았다."]],"w":"소매에 콧물을 닦는 모습이에요. 나폴레옹이 이것을 더러운 습관이라고 싫어했어요(5번). wipe는 '닦다'예요.","c":3},"h":"22c3a12dfa"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was very painful.","ko":"밑줄 친 It이(가) 가리키는 것은?","sko":"그것은 매우 고통스러웠다.","opts":["거친 금속이 군인들의 얼굴을 긁는 것","나폴레옹이 단추를 만든 것","군인들이 손수건을 쓰는 것","군인들이 콧물을 닦는 습관"],"r":{"a":"1) 거친 금속이 군인들의 얼굴을 긁는 것","ev":"9~10번 문장","s":[[9,"Whenever the soldiers tried to wipe their noses with their sleeves, the rough metal scratched their faces.","군인들이 소매로 그들의 코를 닦으려 할 때마다, 거친 금속이 그들의 얼굴을 긁었다."],[10,"It was very painful.","그것은 매우 고통스러웠다."]],"w":"It은 바로 앞 9번의 '거친 금속이 얼굴을 긁었다'를 가리켜요. 그것이 아팠기 때문에 11번에서 손수건을 쓰기 시작해요.","c":1},"h":"314bdd6246"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The origin is unclear, but there may be a painful story behind it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"기원은 불분명하지만, 그 뒤에는 고통스러운 이야기가 있을 수 있다.","opts":["기원은 분명하고, 그 뒤에는 즐거운 이야기가 있다.","기원은 불분명해서 아무도 소매에 단추를 달지 않는다.","기원은 알려져 있고, 그 뒤에는 슬픈 노래가 있다.","기원은 확실하지 않지만, 그 뒤에 아픈 사연이 있을 수도 있다."],"r":{"a":"4) 기원은 확실하지 않지만, 그 뒤에 아픈 사연이 있을 수도 있다.","ev":"2번 문장","s":[[2,"The origin is unclear, but there may be a painful story behind it.","기원은 불분명하지만, 그 뒤에는 고통스러운 이야기가 있을 수 있다."]],"w":"2번 문장은 기원은 불분명(unclear)하지만 고통스러운(painful) 이야기가 있을 수 있다는 뜻이에요.","c":4},"h":"e1fd6c4f22"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["재킷 소매에 단추를 다는 아이디어는 나폴레옹에게서 비롯되었을 수 있다.","나폴레옹의 군인들은 그에게 소매에 단추를 꿰매 달라고 부탁했다.","재킷 소매의 단추는 처음에 어린이를 위해 만들어졌다.","소매의 단추는 부드러운 천으로 만들어졌다."],"opts":["The idea of buttons on jacket sleeves may have come from Napoleon.","Napoleon’s soldiers asked him to sew buttons onto their sleeves.","Buttons on jacket sleeves were first made for children.","The buttons on the sleeves were made of soft cloth."],"r":{"a":"1) The idea of buttons on jacket sleeves may have come from Napoleon. (재킷 소매에 단추를 다는 아이디어는 나폴레옹에게서 비롯되었을 수 있다.)","ev":"3번 문장","s":[[3,"The idea may have come from Napoleon.","그 아이디어는 나폴레옹에게서 비롯된 것일 수도 있다."]],"w":"3번에 그대로 나와요. 나머지는 본문에 없거나 다른 내용이에요.","c":1},"h":"b5a8fd85a9"},{"n":9,"t":"sum","q":"Jacket sleeves with buttons later became (A) even among (B) people.","ko":"단추가 달린 재킷 소매는 나중에 (B) 사람들 사이에서도 (A) 되었다.","oko":["(A) 유행하게 / (B) 군인인","(A) 고통스럽게 / (B) 군인이 아닌","(A) 값싸게 / (B) 군인인","(A) 더럽게 / (B) 군인이 아닌","(A) 유행하게 / (B) 군인이 아닌"],"opts":["(A) fashionable / (B) military","(A) painful / (B) non-military","(A) cheap / (B) military","(A) dirty / (B) non-military","(A) fashionable / (B) non-military"],"r":{"a":"5) (A) fashionable / (B) non-military (A 유행하게 / B 군인이 아닌)","ev":"12번 문장","s":[[12,"However, jacket sleeves with buttons later became fashionable even among non-military people.","그러나 단추가 달린 재킷 소매는 나중에 군인이 아닌 사람들 사이에서도 유행하게 되었다."]],"w":"12번에서 단추가 달린 재킷 소매가 군인이 아닌(non-military) 사람들 사이에서도 유행하게(fashionable) 되었다고 했어요.","c":5},"h":"8f3b378405"},{"n":10,"t":"fill","q":"So they [A] to use handkerchiefs [B] of their sleeves.","ko":"그래서 그들은 소매 [B] 손수건을 사용하기 [A].","bank":["started","instead","often","never","rough","clever"],"bko":{"started":"시작했다","instead":"대신에","often":"자주","never":"결코 ~않다","rough":"거친","clever":"영리한"},"r":{"a":"[A] started (시작했다), [B] instead (대신에)","ev":"11번 문장","s":[[11,"So they started to use handkerchiefs instead of their sleeves.","그래서 그들은 소매 대신에 손수건을 사용하기 시작했다."]],"w":"9번 문장에서 가져왔어요. A에는 metal을 꾸미는 말, B에는 their faces를 목적어로 하는 동사가 들어가요.","c":null},"h":"73110b6ec6"}]},{"u":1,"id":"rj2-01-4","no":4,"ko":"수염을 기르려면 세금을~","items":[{"n":1,"t":"tf","q":"Russian men had to pay money to have beards.","ko":"러시아 남성들은 수염을 갖기 위해 돈을 내야 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Interestingly, Russian men had to pay money to have beards under the rule of Peter the Great, a powerful Russian czar.","흥미롭게도, 러시아 남성들은 강력한 러시아 군주인 표트르 대제의 통치하에서 수염을 갖기 위해 돈을 내야 했다."]],"w":"2번 문장에 Russian men had to pay money to have beards가 나와요.","c":"T"},"h":"d0a7ab60c3"},{"n":2,"t":"tf","q":"The token showed that a man had refused to pay the tax.","ko":"징표는 어떤 남성이 세금 내기를 거부했다는 것을 보여 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"And he had to carry a token which showed that he had already paid the tax.","그리고 그는 이미 세금을 지불했었다는 것을 보여주는 징표를 가지고 다녀야 했다."]],"w":"8번 문장에서 징표는 이미 세금을 냈다(had already paid)는 것을 보여 줘요. 거부했다는 말은 반대예요.","c":"F"},"h":"cfb048ea0f"},{"n":3,"t":"tf","q":"If a man refused to pay, the police shaved his beard off.","ko":"어떤 남성이 지불하기를 거부하면, 경찰은 그의 수염을 깎아 버렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"If a man refused to pay, the police shaved his beard off!","만약 어떤 남성이 (세금을) 지불하기를 거부했다면, 경찰은 그의 수염을 깎아 버렸다!"]],"w":"10번 문장에 그대로 나와요. 세금을 안 내려는 남성의 수염을 경찰이 깎아 버렸어요.","c":"T"},"h":"ab425368e4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If a man wanted to grow a beard, he had to pay a tax.)","ko":"어떤 남성이 수염을 기르기를 원했다면, 그는 ( )을 지불해야 했다.","opts":["상","세금","편지","허락"],"word":"tax","r":{"a":"2) 세금","ev":"7번, 9번 문장","s":[[7,"If a man wanted to grow a beard, he had to pay a tax.","만약 어떤 남성이 수염을 기르기를 원했다면, 그는 세금을 지불해야 했다."],[9,"Peter the Great even hired beard police to collect the beard tax.","표트르 대제는 심지어 수염 세금을 징수하기 위해 수염 경찰을 고용했다."]],"w":"수염을 기르려면 내야 하는 것이고, 9번에서 수염 경찰이 이것을 걷어(collect) 가요. 그래서 tax는 '세금'이에요.","c":2},"h":"b1c30970a3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Peter the Great even hired beard police to collect the beard tax.)","ko":"표트르 대제는 심지어 수염 세금을 ( ) 위해 수염 경찰을 고용했다.","opts":["가르치다","없애다","숨기다","징수하다"],"word":"collect","r":{"a":"4) 징수하다","ev":"9~10번 문장","s":[[9,"Peter the Great even hired beard police to collect the beard tax.","표트르 대제는 심지어 수염 세금을 징수하기 위해 수염 경찰을 고용했다."],[10,"If a man refused to pay, the police shaved his beard off!","만약 어떤 남성이 (세금을) 지불하기를 거부했다면, 경찰은 그의 수염을 깎아 버렸다!"]],"w":"경찰을 고용한 이유가 수염 세금을 '걷기' 위해서예요. 세금을 안 내면 수염을 깎았다는 내용(10번)으로도 알 수 있어요. 여기서 collect는 '징수하다'예요.","c":4},"h":"0a5d944763"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe introduced many things from Western Europe, such as laws, a military system, and even fashion.","ko":"밑줄 친 \"He\"가 가리키는 것은?","sko":"그는 서유럽으로부터 법률, 군사 제도, 그리고 심지어 패션과 같은 많은 것들을 도입했다.","opts":["표트르 대제","수염 경찰","서유럽 남성들","러시아 남성들"],"r":{"a":"1) 표트르 대제","ev":"3~4번 문장","s":[[3,"Peter the Great wanted to make the country more like Western Europe.","표트르 대제는 국가를 서유럽과 더 비슷하게 만들기를 원했다."],[4,"He introduced many things from Western Europe, such as laws, a military system, and even fashion.","그는 서유럽으로부터 법률, 군사 제도, 그리고 심지어 패션과 같은 많은 것들을 도입했다."]],"w":"he는 앞 7번의 a man who wanted to grow a beard예요. 세금을 낸 사람이 그 사실을 보여 주는 징표를 가지고 다녀야 했어요.","c":1,"k":"He = 표트르 대제"},"pron":"He","h":"b35157a57b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"At that time, many Western European men shaved, but Russian men grew long beards.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 당시에, 많은 서유럽 남성들은 면도를 했지만, 러시아 남성들은 긴 수염을 길렀다.","opts":["그 당시 많은 서유럽 남성들은 면도를 했지만, 러시아 남성들은 긴 수염을 길렀다.","그 당시 서유럽 남성들은 긴 수염을 길렀지만, 러시아 남성들은 면도를 했다.","그 당시 서유럽과 러시아 남성들은 모두 면도를 했다.","그 당시 서유럽 남성들은 수염 때문에 세금을 냈다."],"r":{"a":"1) 그 당시 많은 서유럽 남성들은 면도를 했지만, 러시아 남성들은 긴 수염을 길렀다.","ev":"5번 문장","s":[[5,"At that time, many Western European men shaved, but Russian men grew long beards.","그 당시에, 많은 서유럽 남성들은 면도를 했지만, 러시아 남성들은 긴 수염을 길렀다."]],"w":"but을 기준으로 서유럽 남성은 면도(shaved), 러시아 남성은 긴 수염(grew long beards)이에요. 두 나라가 서로 바뀌거나 같은 것은 아니고, 세금은 러시아 이야기예요(7번).","c":1},"h":"b98f70b05e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["표트르 대제는 모든 러시아 남성들에게 수염을 기르게 했다.","그 당시 서유럽 남성들은 긴 수염을 길렀다.","수염 경찰은 수염을 기른 남성들에게 돈을 주었다.","표트르 대제는 모든 러시아 남성들이 면도하게 하려고 노력했다."],"opts":["Peter the Great made all Russian men grow beards.","Western European men grew long beards at that ti arned about pineapples in 1493. (유럽인들은 1493년에 파인애플에 대해 처음 알게 되었다.)","ev":"3번 문장","s":[[3,"Europeans first learned about pineapples in 1493.","유럽인들은 1493년에 파인애플에 대해 처음 알게 되었다."]],"w":"3번에 그대로 나와요. 선원들이 과일을 발견한 곳은 유럽이 아니라 카리브해 쪽이에요(4~5번).","c":1},"h":"8bf31e4baa"},{"n":9,"t":"sum","q":"In some cultures, the pineapple is considered a (A) of (B) others.","ko":"일부 문화권에서, 파인애플은 다른 사람들을 (B) (A)(으)로 여겨진다.","oko":["(A) 상징 / (B) 미워하는","(A) 장난감 / (B) 환영하는","(A) 상징 / (B) 두려워하는","(A) 가격 / (B) 환영하는","(A) 상징 / (B) 환영하는"],"opts":["(A) symbol / (B) hating","(A) toy / (B) welcoming","(A) symbol / (B) fearing","(A) price / (B) welcoming","(A) symbol / (B) welcoming"],"r":{"a":"5) (A) symbol / (B) welcoming (A 상징 / B 환영하는)","ev":"1번 문장","s":[[1,"In some cultures, the pineapple is considered a symbol of welcoming others.","일부 문화권에서, 파인애플은 다른 사람들을 환영하는 상징으로 여겨진다."]],"w":"1번에서 파인애플은 다른 사람들을 환영하는(welcoming) 상징(symbol)으로 여겨진다고 했어요.","c":5},"h":"d7567fef00"},{"n":10,"t":"fill","q":"Christopher Columbus was taking his [A] trip to the [B].","ko":"크리스토퍼 콜럼버스는 [B](으)로 [A] 번째 여행을 가고 있었다.","bank":["second","Caribbean","farmers","although","successfully","because"],"bko":{"second":"두 번째의","Caribbean":"카리브해","farmers":"농부들","although":"비록 ~이지만","successfully":"성공적으로","because":"~ 때문에"},"r":{"a":"[A] second (두 번째의), [B] Caribbean (카리브해)","ev":"4번 문장","s":[[4,"Christopher Columbus was taking his second trip to the Caribbean.","크리스토퍼 콜럼버스는 카리브해로 두 번째 여행을 가고 있었다."]],"w":"4번 Christopher Columbus was taking his second trip to the Caribbean.에서 가져왔어요.","c":null},"h":"b438371604"}]},{"u":2,"id":"rj2-02-2","no":2,"ko":"무시무시한 음력 7월!","items":[{"n":1,"t":"tf","q":"Some Chinese people call the seventh month of the lunar calendar the “ghost month.”","ko":"어떤 중국인들은 음력 7월을 ‘귀신의 달’이라고 부른다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"So they call the seventh month the “ghost month.”","그래서 그들은 7월을 ‘귀신의 달’이라고 부른다."]],"w":"4번 문장에 they call the seventh month the 'ghost month'가 나와요. 죽은 사람들의 영혼이 이승으로 돌아올 수 있다고 믿기 때문이에요(3번).","c":"T"},"h":"490e5b74a3"},{"n":2,"t":"tf","q":"Chinese people often move into a new house or get married in the ghost month.","ko":"중국인들은 귀신의 달에 새집으로 이사하거나 결혼을 자주 한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"So they do not move into a new house or get married.","그래서 그들은 새집으로 이사를 하거나 결혼을 하지 않는다."]],"w":"6번 문장에서 이 기간에는 새집으로 이사하거나 결혼하지 않는다고 해요. 자주 한다는 말은 반대예요.","c":"F"},"h":"eda6fad885"},{"n":3,"t":"tf","q":"Some people burn paper money to give the ghosts comfort.","ko":"어떤 사람들은 귀신들에게 위안을 주기 위해 지폐를 태운다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Others burn paper money to give the ghosts comfort.","다른 사람들은 귀신들에게 위안을 주기 위해 지폐를 태운다."]],"w":"9번 문장에 Others burn paper money to give the ghosts comfort가 나와요.","c":"T"},"h":"33ceb318fb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some Chinese people are superstitious about the seventh month of the lunar calendar.)","ko":"어떤 중국인들은 음력 7월에 대해 ( ).","opts":["미신을 믿는","용감한","부유한","친절한"],"word":"superstitious","r":{"a":"1) 미신을 믿는","ev":"1~2번 문장","s":[[1,"Some Chinese people are superstitious about the seventh month of the lunar calendar.","어떤 중국인들은 음력 7월에 대한 미신을 믿는다."],[2,"They believe the gate to the world of the dead opens at that time.","그들은 그때에 죽은 사람들의 세계로 가는 문이 열린다고 믿는다."]],"w":"음력 7월에 문이 열려 귀신이 돌아온다고 믿는 이야기가 이어져요(2번). 그래서 superstitious는 '미신을 믿는'이에요.","c":1},"h":"4eb23b9c45"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Others burn paper money to give the ghosts comfort.)","ko":"다른 사람들은 귀신들에게 ( )을 주기 위해 지폐를 태운다.","opts":["음식","벌","위안","그림"],"word":"comfort","r":{"a":"3) 위안","ev":"8~9번 문장","s":[[8,"Some people make lots of food for the ghosts.","어떤 사람들은 귀신들을 위해 많은 음식을 만든다."],[9,"Others burn paper money to give the ghosts comfort.","다른 사람들은 귀신들에게 위안을 주기 위해 지폐를 태운다."]],"w":"귀신을 기쁘게 하려는 노력(7번) 중 하나로, 지폐를 태워 귀신에게 주는 것은 '위안'이에요. comfort는 마음을 편하게 해 주는 것이에요.","c":3},"h":"85c6cb236a"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat means the spirits of the dead can return to earth.","ko":"밑줄 친 That이(가) 가리키는 것은?","sko":"그것은 죽은 사람들의 영혼이 이승으로 돌아올 수 있다는 것을 의미한다.","opts":["음력 7월을 귀신의 달이라고 부르는 것","그때 죽은 사람들의 세계로 가는 문이 열린다는 것","중국인들이 새집으로 이사하지 않는 것","15일에 귀신제를 여는 것"],"r":{"a":"2) 그때 죽은 사람들의 세계로 가는 문이 열린다는 것","ev":"2~3번 문장","s":[[2,"They believe the gate to the world of the dead opens at that time.","그들은 그때에 죽은 사람들의 세계로 가는 문이 열린다고 믿는다."],[3,"That means the spirits of the dead can return to earth.","그것은 죽은 사람들의 영혼이 이승으로 돌아올 수 있다는 것을 의미한다."]],"w":"That은 바로 앞 2번 문장 내용을 가리켜요. 죽은 사람들의 세계로 가는 문이 열리니 영혼이 이승으로 돌아올 수 있다는 뜻이에요.","c":2},"h":"97828df39c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"During this time, Chinese people worry that bad things will happen.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 기간 동안에, 중국인들은 나쁜 일들이 일어날 것을 걱정한다.","opts":["이 기간 동안 중국인들은 좋은 일이 생기기를 기대한다.","이 기간 동안 중국인들은 아무것도 걱정하지 않는다.","이 기간 동안 중국인들은 나쁜 일을 한 사람을 벌한다.","이 기간 동안 중국인들은 나쁜 일이 생길까 봐 걱정한다."],"r":{"a":"4) 이 기간 동안 중국인들은 나쁜 일이 생길까 봐 걱정한다.","ev":"5번 문장","s":[[5,"During this time, Chinese people worry that bad things will happen.","이 기간 동안에, 중국인들은 나쁜 일들이 일어날 것을 걱정한다."]],"w":"5번 문장은 이 기간에 나쁜 일이 일어날까 봐 걱정한다(worry)는 뜻이에요.","c":4},"h":"1d20c97d74"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사람들은 귀신을 쫓아내려고 강에 종이배를 띄운다.","귀신제는 음력 7월 15일에 열린다.","귀신제는 음력 7월 1일에 열린다.","귀신제는 중국의 큰 도시에서만 열린다."],"opts":["People put paper boats on rivers to drive the ghosts away.","The ghost festival is held on the fifteenth day of the month.","The ghost festival is held on the first day of the month.","The ghost festival is held only in big cities in China."],"r":{"a":"2) The ghost festival is held on the fifteenth day of the month. (귀신제는 음력 7월 15일에 열린다.)","ev":"10~11번 문장","s":[[10,"They even have a special “ghost festival” on the fifteenth day of the month.","그들은 심지어 그달의 15일에는 특별한 ‘귀신제’를 열기도 한다."],[11,"On that day, people put paper lights on rivers to help the ghosts find their way back home.","그날, 사람들은 귀신들이 그들의 집으로 돌아가는 길을 찾는 것을 돕기 위해 강에 종이등을 띄운다."]],"w":"10번에 귀신제는 그달 15일(the fifteenth day)에 연다고 나와요. 11번에서 강에 띄우는 것은 귀신이 집으로 돌아가는 길을 찾도록 돕기 위한 것이에요.","c":2},"h":"1856ae3efe"},{"n":9,"t":"sum","q":"To make the ghosts (A), some people make lots of (B) and others burn paper money.","ko":"귀신들을 (A)하게 만들기 위해, 어떤 사람들은 많은 (B)을(를) 만들고 다른 사람들은 지폐를 태운다.","oko":["(A) 화난 / (B) 음식","(A) 기쁜 / (B) 옷","(A) 기쁜 / (B) 음식","(A) 두려워하는 / (B) 책","(A) 화난 / (B) 옷"],"opts":["(A) angry / (B) food","(A) happy / (B) clothes","(A) happy / (B) food","(A) afraid / (B) books","(A) angry / (B) clothes"],"r":{"a":"3) (A) happy / (B) food","ev":"7~9번 문장","s":[[7,"Instead, they try to make the ghosts happy.","대신에, 그들은 귀신들을 기쁘게 만들려고 노력한다."],[8,"Some people make lots of food for the ghosts.","어떤 사람들은 귀신들을 위해 많은 음식을 만든다."],[9,"Others burn paper money to give the ghosts comfort.","다른 사람들은 귀신들에게 위안을 주기 위해 지폐를 태운다."]],"w":"7번에서 귀신들을 기쁘게(happy) 하려고 노력하고, 8번에서 어떤 사람들은 음식(food)을 많이 만들고 9번에서 다른 사람들은 지폐를 태워요.","c":3},"h":"94dd3c1c9a"},{"n":10,"t":"fill","q":"On that day, people put paper [A] on rivers to help the ghosts find their way back [B].","ko":"그날, 사람들은 귀신들이 다시 [B](으)로 가는 길을 찾는 것을 돕기 위해 강에 종이 [A]을(를) 띄운다.","bank":["lights","home","festival","month","dead","river"],"bko":{"lights":"등","home":"집","festival":"축제","month":"달","dead":"죽은 사람들","river":"강"},"r":{"a":"[A] lights (등), [B] home (집)","ev":"11번 문장","s":[[11,"On that day, people put paper lights on rivers to help the ghosts find their way back home.","그날, 사람들은 귀신들이 그들의 집으로 돌아가는 길을 찾는 것을 돕기 위해 강에 종이등을 띄운다."]],"w":"11번 People put paper lights on rivers to help the ghosts find their way back home.에서 가져왔어요.","c":null},"h":"3fe733eca5"}]},{"u":2,"id":"rj2-02-3","no":3,"ko":"빗자루를 왜 뛰어넘지?","items":[{"n":1,"t":"tf","q":"The MC said, “Let’s jump the broom!”","ko":"사회자가 “빗자루를 넘자고요!”라고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"“Let’s jump the broom!” the MC said.","“빗자루를 넘자고요!”라고 사회자가 말했다."]],"w":"5번 문장에 'Let's jump the broom!' the MC said가 그대로 나와요.","c": 국의 Lopburi에서는 성대한 파티가 있다."],[2,"Chefs prepare fresh fruit, vegetables, and ice cream in front of a temple.","요리사들은 신선한 과일, 채소, 그리고 아이스크림을 사찰 앞에 준비한다."]],"w":"2번에 요리사들이 사찰 앞에서 음식을 준비한다고 나와요. 1번에서 축제는 11월에 열려요.","c":1},"h":"a9ad1ed318"},{"n":9,"t":"sum","q":"On the (A) Sunday of (B), there is a big party in Lopburi, Thailand.","ko":"(B)의 (A) 일요일에, 태국의 Lopburi에서는 성대한 파티가 있다.","oko":["(A) 첫 / (B) 3월","(A) 마지막 / (B) 8월","(A) 마지막 / (B) 11월","(A) 다음 / (B) 11월","(A) 첫 / (B) 6월"],"opts":["(A) first / (B) March","(A) last / (B) August","(A) last / (B) November","(A) next / (B) November","(A) first / (B) June"],"r":{"a":"3) (A) last / (B) November (A 마지막 / B 11월)","ev":"1번 문장","s":[[1,"On the last Sunday of November, there is a big party in Lopburi, Thailand.","11월의 마지막 일요일에, 태국의 Lopburi에서는 성대한 파티가 있다."]],"w":"1번에서 11월(November)의 마지막(last) 일요일에 파티가 있다고 했어요.","c":3},"h":"07699f9a8a"},{"n":10,"t":"fill","q":"The people of Lopburi hold the festival to [A] the monkeys. The monkeys made Lopburi a [B] tourist spot.","ko":"Lopburi의 사람들은 그 원숭이들에게 [A] 위해 그 축제를 개최한다. 그 원숭이들은 Lopburi를 [B] 관광지로 만들었다.","bank":["thank","famous","before","slowly","because","between"],"bko":{"thank":"감사하다","famous":"유명한","before":"~ 전에","slowly":"천천히","because":"~ 때문에","between":"~ 사이에"},"r":{"a":"[A] thank (감사하다), [B] famous (유명한)","ev":"6~7번 문장","s":[[6,"The people of Lopburi hold the festival to thank the monkeys.","Lopburi의 사람들은 그 원숭이들에게 감사를 표하기 위해 그 축제를 개최한다."],[7,"The monkeys made Lopburi a famous tourist spot.","그 원숭이들은 Lopburi를 유명한 관광지로 만들었다."]],"w":"6~7번 문장에서 가져왔어요. A에는 to 뒤에 오는 동사, B에는 tourist spot을 꾸미는 말이 들어가요.","c":null},"h":"f3196ed3ec"}]},{"u":3,"id":"rj2-03-1","no":1,"ko":"바나나보다 중요해질지도 몰라!","items":[{"n":1,"t":"tf","q":"Enset is a staple food in Ethiopia.","ko":"엔셋은 에티오피아의 주식이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Enset is a staple food in Ethiopia.","엔셋은 에티오피아의 주식이다."]],"w":"5번 문장에 Enset is a staple food in Ethiopia가 그대로 있어요. 에티오피아의 주식이라는 내용과 일치해요.","c":"T"},"h":"8ec63adb5e"},{"n":2,"t":"tf","q":"Enset can be harvested only in one season of the year.","ko":"엔셋은 일 년 중 한 계절에만 수확할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"It grows quickly and can be harvested in any season.","그것은 빨리 자라고 어떤 계절에도 수확할 수 있다."]],"w":"10번 문장에서 엔셋은 in any season, 즉 어떤 계절에도 수확할 수 있다고 해요. 한 계절에만 수확한다는 말은 반대예요.","c":"F"},"h":"f2b825e64e"},{"n":3,"t":"tf","q":"The food crisis around the world is getting worse because of the climate change.","ko":"기후 변화 때문에 전 세계의 식량 위기가 더 악화되고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"The food crisis around the world is getting worse due to the climate change.","기후 변화 때문에 전 세계의 식량 위기가 더 악화되고 있다."]],"w":"1번 문장의 due to the climate change(기후 변화 때문에)와 같은 뜻이에요. 식량 위기가 더 나빠지는 까닭은 기후 변화라는 내용과 일치해요.","c":"T"},"h":"2d259516b2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The good news is that there could be a solution.)","ko":"좋은 소식은 ( )이 있을 수 있다는 것이다.","opts":["원인","질문","해결책","결과"],"word":"solution","r":{"a":"3) 해결책","ev":"1~3번 문장","s":[[1,"The food crisis around the world is getting worse due to the climate change.","기후 변화 때문에 전 세계의 식량 위기가 더 악화되고 있다."],[2,"Up to 783 million people regularly go hungry.","7억 8천 3백만 명에 이르는 사람들이 정기적으로 굶주리고 있다."],[3,"The good news is that there could be a solution.","좋은 소식은 해결책이 있을 수 있다는 것이다."]],"w":"1~2번에서 식량 위기와 굶주림이라는 문제가 나오고, 3번에서 좋은 소식으로 solution이 나와요. 문제를 풀어 주는 것이니 '해결책'이에요.","c":3},"h":"6cdd8aa0d9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Up to 783 million people regularly go hungry.)","ko":"7억 8천 3백만 명에 이르는 사람들이 ( ) 굶주리고 있다.","opts":["가끔","정기적으로","갑자기","처음으로"],"word":"regularly","r":{"a":"2) 정기적으로","ev":"2번 문장","s":[[2,"Up to 783 million people regularly go hungry.","7억 8천 3백만 명에 이르는 사람들이 정기적으로 굶주리고 있다."]],"w":"2번은 식량 위기가 심각하다는 설명이에요. 많은 사람들이 늘 때가 되면 굶주린다는 뜻이라 regularly는 '정기적으로'예요.","c":2},"h":"78013ced01"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are used to make porridge and bread.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 포리지와 빵을 만드는 데 사용된다.","opts":["다른 식물들의 열매","엔셋의 열매","엔셋의 뿌리와 줄기","바나나 나무들"],"r":{"a":"3) 엔셋의 뿌리와 줄기","ev":"7~8번 문장","s":[[7,"Unlike the fruits of other plants, the fruit of the enset cannot be eaten, but its roots and stems can.","다른 식물들의 열매들과 달리, 엔셋의 열매는 먹을 수 없지만, 그것의 뿌리와 줄기는 먹을 수 있다."],[8,"They are used to make porridge and bread.","그것들은 포리지와 빵을 만드는 데 사용된다."]],"w":"7번에서 엔셋의 열매는 못 먹지만 its roots and stems(뿌리와 줄기)는 먹을 수 있다고 했어요. 그래서 8번의 They는 뿌리와 줄기예요.","c":3},"h":"d3356c3e49"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It can also live up to seven years without water!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 또한 물 없이도 7년까지 살 수 있다!","opts":["7년마다 물을 한 번 줘야 한다.","물이 있어야만 7년 동안 살 수 있다.","물 없이는 7년 안에 죽는다.","물이 없는 상태에서도 최대 7년 동안 살아남을 수 있다."],"r":{"a":"4) 물이 없는 상태에서도 최대 7년 동안 살아남을 수 있다.","ev":"12번 문장","s":[[12,"It can also live up to seven years without water!","또한 물 없이도 7년까지 살 수 있다!"]],"w":"without water는 '물 없이'이고, live up to seven years는 '7년까지 살다'예요. 물이 없어도 오래 산다는 엔셋의 이점이에요.","c":4},"h":"fcd70264c8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["엔셋은 코코넛 나무처럼 생겼다.","엔셋은 바나나 나무처럼 생겼다.","엔셋은 약 40미터 높이까지 자랄 수 있다.","엔셋은 실내에서만 자라는 아주 작은 식물이다."],"opts":["Enset looks like a coconut tree.","Enset looks like a banana tree.","Enset can grow to a height of about 40 meters.","Enset is a very small plant that grows only indoors."],"r":{"a":"2) Enset looks like a banana tree. (엔셋은 바나나 나무처럼 생겼다.)","ev":"6번 문장","s":[[6,"It looks like a banana tree and can grow to a height of about 4 to 13 meters.","그것은 바나나 나무처럼 생겼고 약 4미터에서 13미터까지의 높이까지 자랄 수 있다."]],"w":"6번에 It looks like a banana tree라고 나와요. 높이는 4~13미터까지 자랄 수 있어요.","c":2},"h":"b632aeab61"},{"n":9,"t":"sum","q":"There are several (A) of enset as the food of the (B).","ko":"엔셋에는 (B)의 식량으로서 몇 가지 (A)이(가) 있다.","oko":["(A) 문제점 / (B) 미래","(A) 이점 / (B) 과거","(A) 이점 / (B) 미래","(A) 이야기 / (B) 미래","(A) 이점 / (B) 시장"],"opts":["(A) problems / (B) future","(A) benefits / (B) past","(A) benefits / (B) future","(A) stories / (B) future","(A) benefits / (B) market"],"r":{"a":"3) (A) benefits / (B) future (A 이점 / B 미래)","ev":"9번 문장","s":[[9,"There are several benefits of enset as the food of the future.","미래의 식량으로서 엔셋의 몇 가지 이점이 있다."]],"w":"9번에서 엔셋은 미래의 식량(the food of the future)으로서 몇 가지 이점(benefits)이 있다고 했어요.","c":3},"h":"54aa1c9fb5"},{"n":10,"t":"fill","q":"It is possible that enset will [A] many people [B] worsening climate change.","ko":"악화되고 있는 기후 변화 [B] 엔셋이 많은 사람들을 [A] 것은 가능하다.","bank":["feed","despite","because","quickly","harvest","season"],"bko":{"feed":"먹여 살리다","despite":"~에도 불구하고","because":"~ 때문에","quickly":"빨리","harvest":"수확하다","season":"계절"},"r":{"a":"[A] feed (먹여 살리다), [B] despite (~에도 불구하고)","ev":"13번 문장","s":[[13,"It is possible that enset will feed many people despite worsening climate change.","악화되고 있는 기후 변화에도 불구하고 엔셋은 많은 사람들을 먹여 살릴 가능성이 있다."]],"w":"13번 문장에서 가져왔어요. A에는 many people을 목적어로 하는 동사, B에는 worsening climate change 앞에 오는 전치사가 들어가요.","c":null},"h":"1592cbc2d0"}]},{"u":3,"id":"rj2-03-2","no":2,"ko":"버터가 다 떨어졌다고요? 걱정 마세요!","items":[{"n":1,"t":"tf","q":"You should shake the heavy cream in a jar for a long time.","ko":"유지가 많은 크림을 병에 넣고 오랫동안 흔들어야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"First, fill half a jar with heavy cream and shake it for a long time.","먼저, 유지가 많은 크림으로 병의 반을 채우고 그것을 오랫동안 흔들어라."]],"w":"2번 문장에 fill half a jar with heavy cream and shake it for a long time이 있어요. 병에 크림을 넣고 오랫동안 흔들라는 내용과 일치해요.","c":"T"},"h":"79ccce1f98"},{"n":2,"t":"tf","q":"You should rinse the butter only one time.","ko":"버터를 한 번만 헹궈야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Rinse the butter at least two times in this way.","이런 방법으로 버터를 최소 두 번 헹궈라."]],"w":"10번 문장에서 버터를 at least two times, 즉 최소 두 번 헹구라고 해요. 한 번만이라는 말은 맞지 않아요.","c":"F"},"h":"f99618d23e"},{"n":3,"t":"tf","q":"Butter that still has water in it will quickly go bad.","ko":"물이 아직 남아 있는 버터는 빨리 상할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"If you don’t get all the water out, your butter will quickly go bad.","만약 당신이 물을 모두 나오게 하지 못하면, 당신의 버터는 빠르게 상할 것이다."]],"w":"12번 문장에서 물을 모두 빼내지 못하면 버터가 빨리 상한다(go bad)고 해요.","c":"T"},"h":"744d5211ac"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The cream will start to thicken.)","ko":"크림이 ( ) 시작할 것이다.","opts":["얇아지다","차가워지다","걸쭉해지다","사라지다"],"word":"thicken","r":{"a":"3) 걸쭉해지다","ev":"3번, 5~6번 문장","s":[[3,"The cream will start to thicken.","크림이 걸쭉해지기 시작할 것이다."],[5,"It’s because cream is a mixture of milk fat and water.","크림은 유지방과 물의 혼합물이기 때문이다."],[6,"When you shake it, the fat molecules stick together.","당신이 그것을 흔들면, 지방 분자들은 서로 붙는다."]],"w":"3번에서 크림이 thicken하기 시작해요. 6번에서 지방 분자들이 서로 붙으니 크림이 점점 되직하고 걸쭉해지는 거예요.","c":3},"h":"903d201d96"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Finally, take out the butter and squeeze it until there is no more water.)","ko":"마지막으로 버터를 꺼내 물이 더 이상 없을 때까지 그것을 ( ).","opts":["던져라","짜라","썰어라","얼려라"],"word":"squeeze","r":{"a":"2) 짜라","ev":"11번 문장","s":[[11,"Finally, take out the butter and squeeze it until there is no more water.","마지막으로 버터를 꺼내 더 이상 물이 없을 때까지 그것을 짜라."]],"w":"11번은 버터에 남은 물을 없애는 단계예요. 물이 없을 때까지 하는 동작은 꾹 눌러 '짜다'예요.","c":2},"h":"0779573db4"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nEventually, they will form yellow lumps.","ko":"밑줄 친 they가 가리키는 것은?","sko":"결국, 그것들은 노란 덩어리를 형성할 것이다.","opts":["크림 두 병","지방 분자들","차가운 물 그릇","버터 덩어리들"],"r":{"a":"2) 지방 분자들","ev":"6~7번 문장","s":[[6,"When you shake it, the fat molecules stick together.","당신이 그것을 흔들면, 지방 분자들은 서로 붙는다."],[7,"Eventually, they will form yellow lumps.","결국, 그것들은 노란 덩어리를 형성할 것이다."]],"w":"6번에서 흔들면 the fat molecules(지방 분자들)가 서로 붙는다고 했고, 7번에서 그것들(they)이 노란 덩어리를 만들어요. 덩어리는 they가 만드는 결과예요.","c":2},"h":"3df51308da"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It's because cream is a mixture of milk fat and water.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 크림이 유지방과 물의 혼합물이기 때문이다.","opts":["크림이 유지방과 물이 섞인 것이기 때문이다.","크림이 우유에서 물을 모두 뺀 것이기 때문이다.","크림이 버터와 물을 차갑게 한 것이기 때문이다.","크림이 지방 없이 물로만 만들어졌기 때문이다."],"r":{"a":"1) 크림이 유지방과 물이 섞인 것이기 때문이다.","ev":"5번 문장","s":[[5,"It’s because cream is a mixture of milk fat and water.","크림은 유지방과 물의 혼합물이기 때문이다."]],"w":"a mixture of milk fat and water는 '유지방과 물의 혼합물'이에요. It's because ~는 앞에서 말한 일(크림이 걸쭉해지는 것)의 이유를 말해요.","c":1},"h":"43cbb99332"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["노란 덩어리가 버터이다.","노란 덩어리는 치즈이다.","버터를 만들려면 뜨거운 물이 담긴 그릇이 필요하다.","크림은 냉장고에 두면 버터가 된다."],"opts":["The yellow lumps are butter.","The yellow lumps are cheese.","You need a bowl of hot water to make butter.","Cream becomes butter when you leave it in the fridge."],"r":{"a":"1) The yellow lumps are butter. (노란 덩어리가 버터이다.)","ev":"7~8번 문장","s":[[7,"Eventually, they will form yellow lumps.","결국, 그것들은 노란 덩어리를 형성할 것이다."],[8,"These lumps are butter.","이 덩어리가 버터이다."]],"w":"8번에 These lumps are butter.라고 나와요. 크림을 흔들어 생긴 노란 덩어리가 버터예요.","c":1},"h":"78b358dd7e"},{"n":9,"t":"sum","q":"Now (A) the lumps of butter in a bowl of (B) water.","ko":"이제 (B) 물이 담긴 그릇에 버터 덩어리를 (A).","oko":["(A) 넣어라 / (B) 뜨거운","(A) 던져라 / (B) 차가운","(A) 넣어라 / (B) 더러운","(A) 잃어버려라 / (B) 차가운","(A) 넣어라 / (B) 차가운"],"opts":["(A) place / (B) hot","(A) throw / (B) cold","(A) place / (B) dirty","(A) lose / (B) cold","(A) place / (B) cold"],"r":{"a":"5) (A) place / (B) cold (A 넣어라 / B 차가운)","ev":"9번 문장","s":[[9,"Now place the lumps of butter in a bowl of cold water.","이제 차가운 물이 담긴 그릇에 버터 덩어리를 넣어라."]],"w":"9번에서 차가운(cold) 물이 담긴 그릇에 버터 덩어리를 넣으라(place)고 했어요.","c":5},"h":"8b4cdaf72b"},{"n":10,"t":"fill","q":"Here is how you can [A] make your [B] butter.","ko":"여기에 당신이 [A] [B] 버터를 만들 수 있는 방법이 있다.","bank":["easily","own","because","until","finish","between"],"bko":{"easily":"쉽게","own":"자신의","because":"~ 때문에","until":"~할 때까지","finish":"끝내다","between":"~ 사이에"},"r":{"a":"[A] easily (쉽게), [B] own (자신의)","ev":"1번 문장","s":[[1,"Here is how you can easily make your own
