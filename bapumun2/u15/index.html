chine에 that을 써서 알맞아요."}], "pencil": "전치사 바로 뒤에서는 ___ 을 쓸 수 없다", "pencilKey": "that", "page": 154, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "목적격 관계대명사의 종류와 쓰임", "type": "mc", "ans": "③", "concept": ["079", "085-H1"], "gap": "", "words": [["listened to", "~을 들었다 (원형 listen to ~을 듣다)"], ["radio", "라디오"], ["happy", "행복한"]], "h1": "'The music to ___ they listened on the radio made them happy.' 빈칸 바로 앞에 전치사 to가 있어요. 빈칸 앞뒤를 살펴요.", "h2": "전치사 바로 뒤에 올 수 없는 말(that, who)을 먼저 지우고, 선행사 The music이 사물이라는 점을 떠올려요.", "why": "선행사 The music은 사물이고 앞에 전치사 to가 있으므로 which가 알맞아요.", "opts": [{"n": "①", "en": "who", "ko": "~하는 (사람이)", "ok": false, "why": "전치사 바로 뒤에 who는 쓰지 않고, 사물에도 맞지 않아요."}, {"n": "②", "en": "whom", "ko": "~하는 (사람을)", "ok": false, "why": "whom은 사람 선행사에 써요."}, {"n": "③", "en": "which", "ko": "~하는 (사물을)", "ok": true, "why": "사물 선행사 + 전치사 뒤라서 which가 맞아요."}, {"n": "④", "en": "that", "ko": "~하는", "ok": false, "why": "전치사 바로 뒤에는 that을 쓸 수 없어요."}, {"n": "⑤", "en": "whose", "ko": "~의", "ok": false, "why": "whose 뒤에는 명사가 와야 하는데 주어 they가 와요."}], "pencil": "전치사 + 사물 관계대명사는 ___", "pencilKey": "which", "page": 154, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "목적격 관계대명사의 종류와 쓰임", "type": "mc", "ans": "④", "concept": ["079", "085-H1"], "gap": "", "words": [["traveled", "여행했다 (원형 travel 여행하다)"], ["astronaut", "우주비행사"], ["gallery", "미술관"], ["baked", "구웠다 (원형 bake 굽다)"]], "h1": "각 문장 뒤 괄호에 고친 방법이 있어요. 이 중 잘못 고친 것 하나를 찾아요. 먼저 원래 문장이 틀렸는지, 맞았는지 확인해요.", "h2": "선행사가 사물인지 사람인지에 따라 which, whom, that이 달라요. 이미 맞는 문장을 고쳤다면 잘못 고친 거예요. 선행사 The pictures는 어떤 종류인가요?", "why": "④는 선행사 The pictures가 사물이므로 which가 이미 맞아요. with whom으로 고칠 필요가 없어서 잘못 고친 것이에요.", "opts": [{"n": "①", "en": "He is my friend which I traveled with. [whom으로 고침]", "ko": "그는 내가 함께 여행한 친구이다.", "ok": false, "why": "사람 선행사에 which가 틀렸고 whom으로 고친 게 맞아요."}, {"n": "②", "en": "The woman that you saw on TV is an astronaut. [고칠 필요 없음]", "ko": "네가 TV에서 본 그 여자는 우주비행사이다.", "ok": false, "why": "that 목적격이 맞아서 고칠 필요가 없다는 ) [that] I talked to.", "concept": ["079", "085-H1"], "gap": "", "words": [["police officer", "경찰관"], ["talked to", "~에게 말했다 (원형 talk to ~에게 말하다)"], ["woman", "여자"]], "h1": "어색한 부분을 모두 찾아 고쳐서 문장 전체를 다시 써요. 틀린 곳이 두 군데예요. which와 her를 살펴요.", "h2": "선행사 the woman은 사람이에요. 그리고 which가 이미 talked to의 목적어를 대신하는데 뒤에 her가 또 있어요.", "why": "사람 the woman에는 which가 아니라 who(m) 또는 that을 쓰고, 목적어를 대신하는 her는 삭제해요.", "opts": [], "pencil": "목적격 관계대명사가 있으면 같은 목적어는 ___ 한다", "pencilKey": "삭제", "page": 155, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "목적격 관계대명사의 종류와 쓰임", "type": "write", "ans": "(1) A library is the place which [that] we can read books in / in which we can read books. (2) Ketchup is the sauce which [that] we eat with burgers or French fries.", "concept": ["079", "085-H1"], "gap": "", "words": [["library", "도서관"], ["place", "장소"], ["sauce", "소스"], ["ketchup", "케첩"], ["French fries", "감자튀김"]], "h1": "<보기> 중 알맞은 설명을 골라 문장을 완성해요. (1)은 도서관 설명 'We can read books in this place', (2)는 케첩 설명 'We eat it with burgers or French fries'예요.", "h2": "설명 문장의 this place와 it을 목적격 관계대명사로 바꿔서 선행사 뒤에 붙여요. (1)은 in이 필요한 표현이니 전치사를 빼먹지 마세요.", "why": "(1) 장소를 대신하는 in this place에서 전치사 in을 남겨 which [that] we can read books in으로 쓰거나 in which we can read books로 써요. (2)는 which [that] we eat with burgers or French fries예요.", "opts": [], "pencil": "전치사가 필요한 설명은 전치사를 ___ 하면 안 된다", "pencilKey": "생략", "page": 155, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "목적격 관계대명사의 종류와 쓰임", "type": "write", "ans": "The museum which [that] they visited yesterday is very old.", "concept": ["079", "081"], "gap": "", "words": [["museum", "박물관"], ["visited", "방문했다 (원형 visit 방문하다)"], ["old", "오래된"]], "h1": "'어제 그들이 방문했던 그 박물관은 매우 오래됐다'에서 기본 문장은 'The museum is very old.'예요. 여기에 '어제 그들이 방문했던'을 붙여요.", "h2": "The museum 바로 뒤에 목적격 관계대명사절을 붙여요. 시제는 과거 visited예요. visited의 목적어는 쓰지 않아요.", "why": "The museum을 선행사로 which [that] they visited yesterday를 붙이고, 문장 전체는 is very old로 마무리해요.", "opts": [], "pencil": "「선행사 + which [that] + 주어 + ___」 순서로 쓴다", "pencilKey": "동사", "page": 155, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "목적격 관계대명사의 종류와 쓰임", "type": "write", "ans": "I remember the girl who(m) [that] Lucas helped.", "concept": ["079", "081"], "gap": "", "words": [["remember", "기억하다"], ["helped", "도와주었다 (원형 help 돕다)"], ["Lucas", "루카스(사람 이름)"]], "h1": "'나는 Lucas가 도와줬던 그 소녀를 기억한다'에서 기본 문장은 'I remember the girl.'이에요. 여기에 '도와줬던'을 붙여요.", "h2": "the girl은 사람이에요. 사람 선행사의 목적격 관계대명사는 whom(또는 who) 또는 that이에요. Lucas helped가 뒤에서 꾸며요.", "why": "I remember the girl 뒤에 who(m) [that] Lucas helped를 붙여요. helped의 목적어는 관계대명사가 대신하니까 쓰지 않아요.", "opts": [], "pencil": "사람 선행사의 목적격은 who(m) 또는 ___", "pencilKey": "that", "page": 155, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "목적격 관계대명사의 종류와 쓰임", "type": "write", "ans": "(1) She is the singer (who(m) [that]) I like most. (2) Her concert (which [that]) I saw on TV was fantastic.", "concept": ["079", "081"], "gap": "", "words": [["singer", "가수"], ["concert", "콘서트"], ["fantastic", "환상적인"], ["like most", "가장 좋아하다"]], "h1": "(1) '그녀는 내가 가장 좋아하는 가수이다', (2) '내가 TV에서 본 그녀의 콘서트는 환상적이었다'예요. 각 문장의 뼈대를 먼저 쓰세요.", "h2": "(1)은 She is the singer가 뼈대, (2)는 Her concert was fantastic이 뼈대예요. 선행사 뒤에 「주어 + 동사」를 붙이고, 목적격 관계대명사는 생략해도 돼요.", "why": "(1) 사람 the singer에 who(m) [that] I like most, (2) 사물 Her concert에 which [that] I saw on TV를 붙여요. 목적격이라 괄호로 생략할 수 있어요.", "opts": [], "pencil": "뼈대 문장의 명사 뒤에 「(관계대명사) + 주어 + ___」를 붙인다", "pencilKey": "동사", "page": 155, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "우리말을 영어로 바르게 옮긴 것 고르기", "type": "mc", "ans": "②, ④", "concept": ["079", "085-H1"], "gap": "", "words": [["talking to", "~에게 말하고 있는 (원형 talk to ~에게 말하다)"], ["Billy", "빌리(사람 이름)"], ["know", "알다"]], "h1": "'나는 Billy와 이야기하고 있는 남자를 안다'를 옮겨요. 말하는 대상을 나타내려면 talk 뒤에 어떤 전치사가 필요한지 보세요.", "h2": "the man은 사람이고 목적격 관계대명사를 생략할 수 있어요. 전치사가 문장 끝에 오는지, which가 틀리지 않았는지, 대명사 him이 중복되지 않는지 확인하세요. 정답이 둘이에요.", "why": "전치사 to를 남기고 관계대명사를 생략한 ②와, whom을 쓴 ④가 맞아요. ①은 to가 빠졌고, ③은 사람에게 which를 썼고, ⑤는 him이 중복돼요.", "opts": [{"n": "①", "en": "I know the man Billy is talking.", "ko": "나는 Billy가 말하고 있는 남자를 안다.", "ok": false, "why": "'~에게'를 나타내는 전치사 to가 빠졌어요."}, {"n": "②", "en": "I know the man Billy is talking to.", "ko": "나는 Billy와 이야기하고 있는 남자를 안다.", "ok": true, "why": "관계대명사를 생략하고 전치사 to를 뒤에 남겨서 맞아요."}, {"n": "③", "en": "I know the man which Billy is talking to.", "ko": "나는 Billy와 이야기하고 있는 남자를 안다.", "ok": false, "why": "사람 the man에 which를 쓸 수 없어요."}, {"n": "④", "en": "I know the man whom Billy is talking to.", "ko": "나는 Billy와 이야기하고 있는 남자를 안다.", "ok": true, "why": "사람 선행사에 whom을 쓰고 전치사 to를 남겨서 맞아요."}, {"n": "⑤", "en": "I know the man to whom Billy is talking him.", "ko": "나는 Billy가 그에게 이야기하고 있는 남자를 안다.", "ok": false, "why": "to whom 뒤에 him이 또 있어 목적어가 중복돼요."}], "pencil": "관계대명사를 생략해도 전치사는 ___", "pencilKey": "남긴다", "page": 156, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "목적격 관계대명사가 생략되지 않은 문장 고르기", "type": "mc", "ans": "③", "concept": ["079", "068"], "gap": "", "words": [["fits", "잘 맞는다 (원형 fit 맞다)"], ["musical", "뮤지컬"], ["standing", "서 있는 (원형 stand 서다)"], ["bus stop", "버스 정류장"], ["same watch", "똑같은 시계"]], "h1": "다섯 문장 중 목적격 관계대명사가 생략된 문장이 아닌 것을 찾아요. 생략된 문장은 명사 바로 뒤에 「주어 + 동사」가 와요.", "h2": "명사 뒤에 -ing로 시작하는 말이 오는 문장은 관계대명사가 생략된 것일까요? -ing는 동사가 아니라 어떤 역할인지 떠올려 보세요.", "why": "③은 the girl standing there로 분사구가 명사를 꾸미는 문장이에요. 나머지는 모두 「주어 + 동사」 앞에 목적격 관계대명사가 생략되어 있어요.", "opts": [{"n": "①", "en": "The shirt Jenny bought fits her very well.", "ko": "Jenny가 산 셔츠는 그녀에게 잘 맞는다.", "ok": false, "why": "The shirt 뒤에 「Jenny bought」가 와서 목적격이 생략돼 있어요."}, {"n": "②", "en": "This is the musical he was talking about.", "ko": "이것은 그가 이야기하던 뮤지컬이다.", "ok": false, "why": "the musical 뒤에 「he was talking about」이 와서 생략돼 있어요."}, {"n": "③", "en": "Let's ask the girl standing there to take a picture of us.", "ko": "저기에 서 있는 소녀에게 우리 사진을 찍어 달라고 부탁하자.", "ok": true, "why": "the girl standing there는 분사구가 명사를 꾸미는 것이라 관계대명사 생략이 아니에요."}, {"n": "④", "en": "Joseph is the boy we saw at the bus stop.", "ko": "Joseph은 우리가 버스 정류장에서 본 소년이다.", "ok": false, "why": "the boy 뒤에 「we saw」가 와서 목적격이 생략돼 있어요."}, {"n": "⑤", "en": "I got the same watch Mike has.", "ko": "나는 Mike가 가지고 있는 것과 같은 시계를 샀다.", "ok": false, "why": "the same watch 뒤에 「Mike has」가 와서 생략돼 있어요."}], "pencil": "명사 + -ing는 관계대명사 생략이 아니라 ___ 가 꾸미는 것", "pencilKey": "분사", "page": 156, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "어법상 자연스러운 문장의 개수", "type": "mc", "ans": "③", "concept": ["079", "085-H1"], "gap": "", "words": [["return", "반납하다"], ["checked out", "빌렸다 (원형 check out 대출하다)"], ["spaghetti", "스파게티"], ["came across", "우연히 만났다 (원형 come across 우연히 만나다)"]], "h1": "ⓐ~ⓕ 여섯 문장 하나하나가 맞는지 틀린지 판단해서 맞는 것의 개수를 세어요. 틀린 곳은 목적어 중복과 관계대명사의 종류예요.", "h2": "ⓐ와 ⓕ는 it, her이 관계대명사와 중복돼요. ⓑ는 사물에 who를 썼어요. 나머지 셋은 모양이 바른지 확인해요.", "why": "ⓐ it 중복, ⓑ who는 사물에 부적절, ⓕ her 중복으로 3개가 틀려요. ⓒ ⓓ ⓔ 3개가 자연스러워요.", "opts": [{"n": "①", "en": "1개", "ko": "한 개", "ok": false, "why": "맞는 문장이 하나보다 많아요."}, {"n": "②", "en": "2개", "ko": "두 개", "ok": false, "why": "맞는 문장이 둘보다 많아요."}, {"n": "③", "en": "3개", "ko": "세 개", "ok": true, "why": "ⓒ from which, ⓓ whom I met, ⓔ 생략 문장 세 개가 맞아요."}, {"n": "④", "en": "4개", "ko": "네 개", "ok": false, "why": "틀린 문장이 3개나 있어서 네 개가 될 수 없어요."}, {"n": "⑤", "en": "5개", "ko": "다섯 개", "ok": false, "why": "틀린 문장이 있어서 다섯 개가 될 수 없어요."}], "pencil": "관계대명사가 있으면 같은 ___를 또 쓰지 않는다", "pencilKey": "목적어", "page": 156, "sec": "s4"}, {"id": "S4-04", "step": 4, "no": 4, "qtype": "표에서 짝지어 관계대명사로 연결하기", "type": "write", "ans": "She wears a silver ring which [that] her mother left. / I told my friends about the kids who(m) [that] I saw two days ago. / The pasta which [that] we ate last night was too salty.", "concept": ["079", "081"], "gap": "", "words": [["silver ring", "은반지"], ["left", "남겨 주었다 (원형 leave 남기다)"], ["kids", "아이들"], ["pasta", "파스타"], ["salty", "짠"]], "h1": "A의 문장 셋과 B의 문장 셋을 뜻으로 짝지어요. B의 문장에서 it이나 them이 A의 어느 명사를 가리키는지 찾아요.", "h2": "B의 목적어(it, them)가 가리키는 말이 A의 선  h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
