"밧줄이 끊어졌는데 그다음 4번에서 사람들이 무서워했다고 함. 큰 사고가 났다는 뜻이라 crashed는 '추락했다'.","c":2},"h":"48f029ff96"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To prove it was safe, Otis gave a public demonstration.)","ko":"그것이 안전하다는 것을 ( ) 위해 오티스는 공개 시연을 했다.","opts":["숨기다","바꾸다","증명하다","돕다"],"word":"prove","r":{"a":"3) 증명하다","ev":"10번 문장","s":[[10,"To prove it was safe, Otis gave a public demonstration.","그것이 안전하다는 것을 증명하기 위해 오티스는 공개 시연을 했다."]],"w":"안전하다는 것을 사람들에게 보여 주려고 시연을 했으므로 prove는 '증명하다'.","c":3},"h":"87fd5b5dd9"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nBecause of this, people were afraid to use them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이 때문에 사람들은 그것들을 사용하기를 두려워했다.","opts":["공장과 창고","무거운 물건","밧줄","엘리베이터"],"r":{"a":"4) 엘리베이터","ev":"3~4번 문장","s":[[3,"If a rope broke, the elevator crashed.","밧줄이 끊어지면 엘리베이터는 추락했다."],[4,"Because of this, people were afraid to use them.","이 때문에 사람들은 엘리베이터 타기를 두려워했다."]],"w":"3번에서 밧줄이 끊어지면 엘리베이터가 추락한다고 함. 그래서 사람들이 타기 두려워한 것은 엘리베이터(them). 밧줄은 추락의 원인일 뿐.","c":4},"h":"fa00847005"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This serious problem was solved by American inventor Elisha Otis.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 심각한 문제는 미국의 발명가 엘리샤 오티스에 의해 해결되었다.","opts":["엘리베이터가 추락해 사람들이 두려워하던 문제를 미국인 발명가 오티스가 해결했다.","미국인 발명가 오티스가 엘리베이터가 추락하는 사고를 처음 일으켰다.","오티스는 이 문제를 풀지 못하고 다른 발명가에게 넘겼다.","사람들이 오티스의 발명 때문에 엘리베이터를 더 두려워하게 되었다."],"r":{"a":"1) 엘리베이터가 추락해 사람들이 두려워하던 문제를 미국인 발명가 오티스가 해결했다.","ev":"5번 문장","s":[[5,"This serious problem was solved by American inventor Elisha Otis.","이 심각한 문제는 미국의 발명가 엘리샤 오티스에 의해 해결되었다."]],"w":"this serious problem은 3~4번의 추락과 두려움. solved by는 '~에 의해 해결되었다'. 오티스가 해결한 사람이라 ①이 답.","c":1},"h":"79628a3559"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["오티스는 자신의 엘리베이터 위에 서는 것을 두려워했다.","오티스는 밧줄을 더 튼튼하고 굵게 만들었다.","오티스는 밧줄이 잘릴 때 엘리베이터 위에 서 있었다.","오티스의 발명 이전에도 높은 건물이 흔했다."],"opts":["Otis was afraid to stand on his own elevator.","Otis made the rope stronger and thicker.","Otis stood on the elevator when the rope was cut.","Tall buildings were already common before Otis’s invention."],"r":{"a":"3) Otis stood on the elevator when the rope was cut. (오티스는 밧줄이 잘릴 때 엘리베이터 위에 서 있었다.)","ev":"11번 문장","s":[[11,"He stood on the elevator and ordered the rope to be cut.","그는 엘리베이터 위에 서서 밧줄을 자르라고 명령했다."]],"w":"11번 문장에서 오티스는 엘리베이터 위에 서서 밧줄을 자르라고 명령했다고 함. ①은 두려워한 것이 아니라 직접 올라섰고, ②는 밧줄이 아니라 안전 제동장치를 발명했으며, ④는 오티스의 발명 덕분에 높은 건물이 가능해졌다고 했음.","c":3},"h":"cc6cbf9ec4"},{"n":9,"t":"sum","q":"His device used special (A) and (B) on the sides of the elevator.","ko":"그의 장치는 엘리베이터 양옆에 있는 특수한 (A)와(과) (B)을(를) 사용했다.","oko":["(A) 스프링 / (B) 갈고리","(A) 스프링 / (B) 바퀴","(A) 엔진 / (B) 갈고리","(A) 엔진 / (B) 바퀴","(A) 전등 / (B) 문"],"opts":["(A) springs / (B) hooks","(A) springs / (B) wheels","(A) engines / (B) hooks","(A) engines / (B) wheels","(A) lamps / (B) doors"],"r":{"a":"1) (A) springs / (B) hooks ((A) 스프링 / (B) 갈고리)","ev":"7번 문장","s":[[7,"His device used special springs and hooks on the sides of the elevator.","그의 장치는 엘리베이터 양옆에 있는 특수한 스프링과 갈고리를 사용했다."]],"w":"7번 문장에서 His device used special springs and hooks on the sides of the elevator(그의 장치는 엘리베이터 양옆에 있는 특수한 스프링과 갈고리를 사용했다)라고 함.","c":1},"h":"beb5e2d500"},{"n":10,"t":"fill","q":"This [A] finally made people [B] elevators.","ko":"이 [A]이(가) 마침내 사람들이 엘리베이터를 [B] 만들었다.","bank":["success","trust","stood","ordered","simple","serious"],"bko":{"success":"성공","trust":"믿다","stood":"섰다(stand의 과거)","ordered":"명령했다(order의 과거)","simple":"단순한","serious":"심각한"},"r":{"a":"[A] success (성공), [B] trust (믿다)","ev":"13번 문장","s":[[13,"This success finally made people trust elevators.","이 성공은 마침내 사람들이 엘리베이터를 믿게 만들었다."]],"w":"13번 문장에서 This success finally made people trust elevators(이 성공은 마침내 사람들이 엘리베이터를 믿게 만들었다)라고 함.","c":null},"h":"f9ce638bf6"}]},{"u":5,"id":"b2-05-3","no":3,"ko":"문학상을 받은 가수, 그 이유는?","items":[{"n":1,"t":"tf","q":"In 2016, a Nobel Prize in Literature was given to an American musician.","ko":"2016년에 노벨 문학상이 미국의 음악가에게 주어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"However, in 2016, the world was surprised when one was given to American musician Bob Dylan.","그러나 2016년에 미국의 음악가 밥 딜런에게 노벨상이 주어졌을 때 세상은 놀랐다."]],"w":"2번 문장에 in 2016 ... one was given to American musician Bob Dylan이라고 나옴. 2016년, 음악가에게 상이 주어졌다는 내용과 맞음.","c":"T"},"h":"b7a84c5746"},{"n":2,"t":"tf","q":"Most Nobel Prizes in Literature go to musicians.","ko":"문학 부문 노벨상 대부분은 음악가에게 돌아간다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Most Nobel Prizes in Literature go to people who write books or poems.","문학 부문 노벨상 대부분은 책이나 시를 쓰는 사람들에게 돌아간다."]],"w":"1번 문장에 대부분은 people who write books or poems(책이나 시를 쓰는 사람들)에게 간다고 나옴. 음악가가 아니라서 틀림.","c":"F"},"h":"b72d86b7bd"},{"n":3,"t":"tf","q":"Some critics argued that song lyrics are different from literature.","ko":"일부 비평가들은 노래 가사가 문학과 다르다고 주장했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Some critics argued that song lyrics are different from literature.","일부 비평가들은 노래 가사가 문학과는 다르다고 주장했다."]],"w":"9번 문장에 Some critics argued that song lyrics are different from literature라고 그대로 나옴.","c":"T"},"h":"d0075f3f25"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These events influenced his music.)","ko":"이런 사건들은 그의 음악에 ( ).","opts":["방해했다","끝냈다","영향을 주었다","따라 했다"],"word":"influenced","r":{"a":"3) 영향을 주었다","ev":"3~4번 문장","s":[[3,"Dylan became famous in the 1960s, a time of war and protest in the U.S.","딜런은 전쟁과 시위의 시대였던 1960년대 미국에서 유명해졌다."],[4,"These events influenced his music.","이런 사건들은 그의 음악에 영향을 주었다."]],"w":"3번의 전쟁과 시위 같은 사건들이 딜런의 음악에 어떤 힘을 미쳤다는 내용. 5~6번에서 그 영향이 노랫말에 나타난다. 그래서 influenced는 '영향을 주었다'.","c":3},"h":"e1f5fab1dc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, others supported the decision.)","ko":"그러나 다른 사람들은 그 결정을 ( ).","opts":["반대했다","지지했다","잊었다","바꿨다"],"word":"supported","r":{"a":"2) 지지했다","ev":"9~10번 문장","s":[[9,"Some critics argued that song lyrics are different from literature.","일부 비평가들은 노래 가사가 문학과는 다르다고 주장했다."],[10,"However, others supported the decision.","그러나 다른 사람들은 그 결정을 지지했다."]],"w":"9번에서 일부 비평가가 가사는 문학이 아니라고 주장했고, 10번 However(그러나)로 다른 사람들의 입장이 이어짐. 비평가들과 반대되는 입장이므로 supported는 '지지했다'. '반대했다'는 9번 비평가들의 태도.","c":2},"h":"bbf70b959b"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThis is why they gave him the prize.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이것이 그들이 그에게 상을 준 이유이다.","opts":["노벨 위원회","일부 비평가들","밥 딜런","딜런의 팬들"],"r":{"a":"1) 노벨 위원회","ev":"8번 문장","s":[[8,"This is why they gave him the prize.","이것이 그들이 그에게 상을 준 이유이다."]],"w":"8번 문장 This is why they gave him the prize(이것이 그들이 그에게 상을 준 이유이다)에서 상을 준 they는 바로 앞 7번 문장의 노벨 위원회(The Nobel Committee).","c":1,"k":"they = 노벨 위원회"},"pron":"they","h":"e9a144b537"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Dylan's award showed that literature is not only written in books.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"딜런의 수상은 문학이 책 속에만 쓰이는 것이 아님을 보여 주었다.","opts":["딜런의 수상은 문학이 책으로만 이루어지지 않는다는 것을 보여 주었다.","딜런의 수상은 문학이 책에서만 만들어져야 한다는 것을 보여 주었다.","딜런이 책을 많이 써서 상을 받았다는 것을 보여 주었다.","딜런의 수상은 음악이 문학보다 못하다는 것을 보여 주었다."],"r":{"a":"1) 딜런의 수상은 문학이 책으로만 이루어지지 않는다는 것을 보여 주었다.","ev":"12번 문장","s":[[12,"Dylan’s award showed that literature is not only written in books.","딜런의 수상은 문학이 책 속에만 쓰이는 것이 아님을 보여 주었다."]],"w":"not only written in books는 '책 속에만 쓰이는 것이 아니다'. 13번에서 음악으로도 노래되고 느껴질 수 있다고 이어짐. 그래서 ①이 답.","c":1},"h":"77ff25193d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["딜런은 책을 많이 써서 노벨 문학상을 받았다.","딜런은 평화롭고 조용했던 1990년대에 유명해졌다.","딜런은 전쟁과 시위의 시대인 1960년대에 유명해졌다.","딜런은 음식과 스포츠에 관한 노래만 썼다."],"opts":["Dylan won the Nobel Prize in Literature because he wrote many books.","Dylan became famous in the 1990s, a time of peace and quiet.","Dylan became famous in the 1960s, a time of war and protest.","Dylan wrote songs only about food and sports."],"r":{"a":"3) Dylan became famous in the 1960s, a time of war and protest. (딜런은 전쟁과 시위의 시대인 1960년대에 유명해졌다.)","ev":"3번 문장","s":[[3,"Dylan became famous in the 1960s, a time of war and protest in the U.S.","딜런은 전쟁과 시위의 시대였던 1960년대 미국에서 유명해졌다."]],"w":"3번 문장에서 딜런은 전쟁과 시위의 시대였던 1960년대 미국에서 유명해졌다고 함. ①은 책이 아니라 노래 가사 덕분이고, ②는 1990년대가 아니라 1960년대이며, ④는 자유, 평화, 정의에 관한 노래를 썼다고 했음.","c":3},"h":"6edd44f48b"},{"n":9,"t":"sum","q":"Dylan wrote songs with (A) language about freedom, peace, and justice, and his music gave people (B).","ko":"딜런은 자유, 평화, 정의에 관한 노래를 (A) 언어로 썼고, 그의 음악은 사람들에게 (B)을(를) 주었다.","oko":["(A) 화난 / (B) 두려움","(A) 단순한 / (B) 평화","(A) 시적인 / (B) 두려움","(A) 단순한 / (B) 희망","(A) 시적인 / (B) 희망"],"opts":["(A) angry / (B) fear","(A) simple / (B) peace","(A) poetic / (B) fear","(A) simple / (B) hope","(A) poetic / (B) hope"],"r":{"a":"5) (A) poetic / (B) hope","ev":"5~6번 문장","s":[[5,"He used poetic language to write songs about freedom, peace, and justice.","그는 시적인 언어를 사용해 자유, 평화, 정의에 관한 노래를 썼다."],[6,"His music reflected the social changes of the time and gave people hope.","그의 음악은 그 시대의 사회 변화를 반영했고 사람들에게 희망을 주었다."]],"w":"5번에서 poetic language(시적인 언어)로 자유·평화·정의 노래를 썼고, 6번에서 gave people hope(사람들에게 희망을 주었다)라고 함. 그래서 poetic과 hope.","c":5},"h":"a8ac65a26c"},{"n":10,"t":"fill","q":"They said his [A] lyrics were like modern [B].","ko":"그들은 그의 [A] 가사가 현대 [B]와(과) 같다고 말했다.","bank":["meaningful","poetry","finally","argued","quickly","gave"],"bko":{"meaningful":"의미 있는","poetry":"시","finally":"마침내","argued":"주장했다(argue의 과거)","quickly":"빠르게","gave":"주었다(give의 과거)"},"r":{"a":"[A] meaningful (의미 있는), [B] poetry (시)","ev":"11번 문장","s":[[11,"They said his meaningful lyrics were like modern poetry.","그들은 그의 의미 있는 가사가 현대 시와 같다고 말했다."]],"w":"11번 문장에서 They said his meaningful lyrics were like modern poetry(그들은 그의 의미 있는 가사가 현대 시와 같다고 말했다)라고 함.","c":null},"h":"70056fe94f"}]},{"u":5,"id":"b2-05-4","no":4,"ko":"사고로 누운 침대에서 시작된 그림, 어떻게 위대한 예술이 되었나?","items":[{"n":1,"t":"tf","q":"Frida Kahlo was eighteen when she had a terrible bus accident.","ko":"프리다 칼로는 열여덟 살 때 끔찍한 버스 사고를 당했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In 1925, when Frida Kahlo was eighteen, a terrible bus accident changed her life forever.","1925년, 프리다 칼로가 열여덟 살이었을 때, 끔찍한 버스 사고가 그녀의 삶을 영원히 바꾸어 놓았다."]],"w":"1번 문장에 when Frida Kahlo was eighteen, a terrible bus accident라고 나옴. 나이와 사고가 모두 맞음.","c":"T"},"h":"be02c25089"},{"n":2,"t":"tf","q":"After her body healed, the pain from her injuries went away completely.","ko":"몸이 회복된 뒤 부상으로 인한 고통은 완전히 사라졌다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"Over time, Frida’s body healed.","시간이 지나면서 프리다의 몸은 회복되었다."],[6,"But the pain from her injuries never went away completely.","하지만 부상으로 인한 고통은 완전히 사라지지 않았다."]],"w":"5번에서 몸은 회복되었지만, 6번에서 But the pain ... never went away completely라고 함. 고통이 완전히 사라지지 않았으므로 틀림.","c":"F"},"h":"2c1b655400"},{"n":3,"t":"tf","q":"Frida began to paint because she wanted to become a famous artist.","ko":"프리다는 유명한 예술가가 되고 싶어서 그림을 그리기 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"During those long, painful days, she began to paint to pass the time.","그 길고 고통스러운 날들 동안, 그녀는 시간을 보내기 위해 그림을 그리기 시작했다."]],"w":"3번 문장에 she began to paint to pass the time(시간을 보내려고)이라고 나옴. 유명해지려는 목적이 아니므로 틀림.","c":"F"},"h":"7d22973e55"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In this way, she revealed the strength she carried throughout her life.)","ko":"이렇게 해서 그녀는 평생 지니고 있던 강인함을 ( ).","opts":["숨겼다","드러냈다","잃었다","팔았다"],"word":"revealed","r":{"a":"2) 드러냈다","ev":"9~10번 문장","s":[[9,"She used bright colors and strong symbols to show her pain and emotions.","그녀는 밝은 색과 강렬한 상징을 사용해 자신의 고통과 감정을 보여 주었다."],[10,"In this way, she revealed the strength she carried throughout her life.","이렇게 해서 그녀는 평생 지니고 있던 강인함을 드러냈다."]],"w":"9번에서 색과 상징으로 고통과 감정을 보여 주었고, 10번 In this way로 이어짐. 보여 준 것이니 revealed는 '드러냈다'. 숨겼다는 반대.","c":2},"h":"cea34504c2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Her honest works inspired many people who faced their own challenges.)","ko":"그녀의 솔직한 작품은 자신만의 어려움에 맞선 많은 사람들에게 ( ).","opts":["방해했다","놀라게 했다","영감을 주었다","무시했다"],"word":"inspired","r":{"a":"3) 영감을 주었다","ev":"11번 문장","s":[[11,"Her honest works inspired many people who faced their own challenges.","그녀의 솔직한 작품은 자신만의 어려움에 맞선 많은 사람들에게 영감을 주었다."]],"w":"어려움에 맞선 사람들에게 솔직한 작품이 힘을 주었다는 흐름이라 inspired는 '영감을 주었다'.","c":3},"h":"3cbd9a7908"},{"n":6,"t":"ref","q":"What does the underlined \"the subject she knew best\" refer to?\nShe painted herself, the subject she knew best.","ko":"밑줄 친 the subject she knew best가 가리키는 것은?","sko":"그녀는 자신이 가장 잘 아는 대상인 자기 자신을 그렸다.","opts":["침대에서 보낸 시간","버스 사고","프리다 자신","그림 도구"],"r":{"a":"3) 프리다 자신","ev":"4번 문장","s":[[4,"She painted herself, the subject she knew best.","그녀는 자신이 가장 잘 아는 대상인 자기 자신을 그렸다."]],"w":"4번 문장에서 she painted herself 바로 뒤에 쉼표로 the subject she knew best가 붙어 herself를 다시 설명함. 가장 잘 아는 대상은 프리다 자신.","c":3},"h":"7c9717de8b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Her self-portraits became a way for her to express her inner world.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그녀의 자화상은 자신의 내면세계를 표현하는 수단이 되었다.","opts":["프리다에게 자화상은 자신의 내면세계를 표현하는 방법이 되었다.","프리다는 자화상을 그리는 것을 싫어하게 되었다.","프리다는 자신의 내면세계를 숨기려고 자화상을 그렸다.","프리다의 자화상은 다른 사람의 내면세계를 보여 주는 그림이었다."],"r":{"a":"1) 프리다에게 자화상은 자신의 내면세계를 표현하는 방법이 되었다.","ev":"8번 문장","s":[[8,"Her self-portraits became a way for her to express her inner world.","그녀의 자화상은 자신의 내면세계를 표현하는 수단이 되었다."]],"w":"8번 문장은 자화상이 자신의 내면세계(inner world)를 표현하는(express) 방법이 되었다는 내용. ③은 숨기려고 했다는 반대 뜻, ④는 다른 사람이 아니라 자신의 내면세계.","c":1},"h":"738edcc55a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["프리다의 사고는 그녀의 몸을 다치게 하지 않았다.","프리다는 통증 때문에 그림을 그만두었다.","프리다는 주로 가족과 친구들을 그렸다.","프리다는 사고 뒤에 몇 달 동안 침대에 누워 지내야 했다."],"opts":["Frida’s accident did not hurt her body.","Frida stopped painting because of her pain.","Frida mainly painted her family and friends.","Frida had to stay in bed for months after the crash."],"r":{"a":"4) Frida had to stay in bed for months after the crash. (프리다는 사고 뒤에 몇 달 동안 침대에 누워 지내야 했다.)","ev":" leep quality.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 수면의 질을 높일 수 있다.","opts":["아침 운동이 하루를 긍정적으로 시작하게 해 주는 것","오후에 강도 높은 운동을 하는 것","저녁 운동이 몸과 마음을 편안하게 해 주는 것","운동하는 시간을 정하는 것"],"pron":"This","r":{"a":"3) 저녁 운동이 몸과 마음을 편안하게 해 주는 것","ev":"10~11번 문장","s":[[10,"They help your body and mind relax.","그것은 몸과 마음이 편안해지도록 돕는다."],[11,"This can improve your sleep quality.","이는 수면의 질을 높일 수 있다."]],"w":"10번에서 저녁 운동이 몸과 마음을 편안해지도록 돕는다고 함. 11번의 This는 이 내용을 가리킴. 그래서 수면의 질이 좋아질 수 있다는 뜻.","c":3,"k":"This = 저녁 운동이 몸과 마음을 편안하게 해 주는 것"},"h":"d7d13382bc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So the best time to exercise depends on your body and goals.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러니 운동하기에 가장 좋은 시간은 자신의 몸과 목표에 달려 있다.","opts":["운동하기에 가장 좋은 시간은 사람의 몸과 목표에 따라 달라진다.","운동하기에 가장 좋은 시간은 모든 사람에게 똑같다.","운동은 목표가 없을 때 가장 효과가 크다.","운동은 아침에 하는 것이 몸에 가장 좋다."],"r":{"a":"1) 운동하기에 가장 좋은 시간은 사람의 몸과 목표에 따라 달라진다.","ev":"12~13번 문장","s":[[12,"In short, each time of day offers different benefits.","요약하면, 하루의 각 시간대는 서로 다른 이점을 준다."],[13,"So the best time to exercise depends on your body and goals.","그러니 운동하기에 가장 좋은 시간은 자신의 몸과 목표에 달려 있다."]],"w":"depends on은 '~에 달려 있다'. 12번에서 시간대마다 다른 이점이 있다고 했으니, 가장 좋은 시간은 몸과 목표에 따라 달라짐. 그래서 1번.","c":1},"h":"2362107178"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Morning workouts make the rest of the day worse.","Afternoon is a bad time for intense workouts.","Morning workouts give the day a positive start.","Workouts have no effect on your body."],"oko":["아침 운동은 하루의 나머지를 더 나쁘게 만든다.","오후는 강도 높은 운동을 하기에 나쁜 시간이다.","아침 운동은 하루를 긍정적으로 시작하게 해 준다.","운동은 몸에 아무 영향도 주지 않는다."],"r":{"a":"3) Morning workouts give the day a positive start. (아침 운동은 하루를 긍정적으로 시작하게 해 준다.)","ev":"3번, 6번 문장","s":[[3,"Morning workouts set a positive tone for the day.","아침 운동은 하루를 긍정적으로 시작하게 해 준다."],[6,"Afternoon is the perfect time for intense workouts.","오후는 강도 높은 운동을 하기에 완벽한 시간이다."]],"w":"3번에 Morning workouts set a positive tone for the day라고 나옴. ①은 이와 반대, ②는 6번에서 오후는 강도 높은 운동에 완벽한 시간이라고 해서 반대, ④는 운동하는 시간이 몸에 영향을 준다는 글의 내용과 반대.","c":3},"h":"0d48415465"},{"n":9,"t":"sum","q":"Afternoon workouts lower the risk of (A) and help you get better (B) from your training.","ko":"오후 운동은 (A)의 위험을 낮추고 훈련으로 더 나은 (B)을(를) 얻도록 돕는다.","opts":["(A) injury / (B) results","(A) injury / (B) sleep","(A) energy / (B) results","(A) energy / (B) sleep","(A) stress / (B) results"],"oko":["(A) 부상 / (B) 결과","(A) 부상 / (B) 수면","(A) 에너지 / (B) 결과","(A) 에너지 / (B) 수면","(A) 스트레스 / (B) 결과"],"r":{"a":"1) (A) injury / (B) results ((A) 부상 / (B) 결과)","ev":"8번 문장","s":[[8,"This state lowers the risk of injury and helps you get better results from your training.","이 상태는 부상의 위험을 낮추고 운동으로 더 나은 결과를 얻도록 도와준다."]],"w":"8번 문장에 lowers the risk of injury and helps you get better results from your training이라고 나옴. 그래서 injury와 results.","c":1},"h":"c9f1ca3c97"},{"n":10,"t":"fill","q":"This supports [A] loss and keeps you [B].","ko":"이것은 [A] 감량을 돕고 당신을 [B] 상태로 유지해 준다.","bank":["weight","energized","workout","goals","afternoon","mind"],"bko":{"weight":"체중","energized":"활력이 넘치는","workout":"운동","goals":"목표","afternoon":"오후","mind":"마음"},"r":{"a":"[A] weight (체중), [B] energized (활력이 넘치는)","ev":"5번 문장","s":[[5,"This supports weight loss and keeps you energized.","이것은 체중 감량을 돕고 활력을 유지해 준다."]],"w":"5번 문장 This supports weight loss and keeps you energized에서 가져옴. weight loss는 \"체중 감량\", keeps you energized는 \"활력이 넘치게 유지해 준다\"는 뜻. workout, goals, afternoon, mind는 loss 앞이나 keeps you 뒤에서 뜻이 맞지 않음.","c":null},"h":"49faaea100"}]},{"u":6,"id":"b2-06-3","no":3,"ko":"운동선수들이 몸에 걸치는 작은 기기는 무엇을 알려 줄까?","items":[{"n":1,"t":"tf","q":"Athletes wear small electronic devices called wearables during games or training.","ko":"운동선수들은 경기나 훈련 중에 웨어러블이라고 불리는 작은 전자 기기를 착용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Athletes wear small electronic devices called wearables during games or training.","운동선수들은 경기나 훈련 중에 웨어러블이라고 불리는 작은 전자 기기를 착용한다."]],"w":"1번 문장에 그대로 나옴. wearables는 작은 전자 기기이고 경기나 훈련 중에 착용함.","c":"T"},"h":"d790a97d64"},{"n":2,"t":"tf","q":"Wearables are helpful for professional athletes today.","ko":"웨어러블은 오늘날 프로 선수들에게 도움이 된다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"These are helpful for professional athletes today.","이것들은 오늘날 프로 선수들에게 도움이 된다."]],"w":"2번 문장에 These are helpful for professional athletes today라고 그대로 나옴. 프로 선수들에게 도움이 된다는 내용과 같음.","c":"T"},"h":"7b1587e4c8"},{"n":3,"t":"tf","q":"Wearables cannot help prevent injuries.","ko":"웨어러블은 부상을 예방하는 데 도움이 될 수 없다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Wearables also help prevent injuries.","웨어러블은 또한 부상을 예방하는 데 도움이 된다."]],"w":"10번 문장에 Wearables also help prevent injuries라고 나옴. 도움이 되므로 틀림.","c":"F"},"h":"dcb99e8452"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They record valuable data on their bodies and performance.)","ko":"그것들은 선수들의 몸과 경기력에 관한 ( ) 데이터를 기록한다.","opts":["귀중한","가짜의","오래된","흔한"],"word":"valuable","r":{"a":"1) 귀중한","ev":"3~4번 문장","s":[[3,"They record valuable data on their bodies and performance.","그것들은 선수들의 몸과 경기력에 관한 귀중한 데이터를 기록한다."],[4,"This data can be used to improve performance.","이 데이터는 경기력을 향상시키는 데 사용될 수 있다."]],"w":"3번의 데이터는 4번에서 경기력을 높이는 데 쓰인다고 함. 쓸모 있고 값진 데이터라 valuable은 '귀중한'.","c":1},"h":"23b7960fdd"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This data can be used to improve performance.)","ko":"이 데이터는 ( )을 향상시키는 데 사용될 수 있다.","opts":["가격","속도","경기력","거리"],"word":"performance","r":{"a":"3) 경기력","ev":"3~4번 문장","s":[[3,"They record valuable data on their bodies and performance.","그것들은 선수들의 몸과 경기력에 관한 귀중한 데이터를 기록한다."],[4,"This data can be used to improve performance.","이 데이터는 경기력을 향상시키는 데 사용될 수 있다."]],"w":"3번에서 선수들의 몸과 performance에 관한 데이터를 기록한다고 하고, 4번에서 그것을 높인다고 함. 경기에서 보이는 실력이라 performance는 '경기력'.","c":3},"h":"6d1450a3e4"},{"n":6,"t":"ref","q":"What does the underlined \"These changes\" refer to?\nThese changes can show early signs of tiredness or injury.","ko":"밑줄 친 These changes가 가리키는 것은?","sko":"이런 변화는 피로나 부상의 초기 징후를 보여 줄 수 있다.","opts":["경기 규칙의 변화","선수의 움직임이나 심박수의 변화","훈련 계획의 변화","기기 가격의 변화"],"r":{"a":"2) 선수의 움직임이나 심박수의 변화","ev":"11~12번 문장","s":[[11,"They track changes in an athlete’s movement or heart rate.","그것들은 선수의 움직임이나 심박수의 변화를 추적한다."],[12,"These changes can show early signs of tiredness or injury.","이런 변화는 피로나 부상의 초기 징후를 보여 줄 수 있다."]],"w":"11번에서 They track changes in an athlete's movement or heart rate라고 하고, 바로 뒤 12번의 These changes가 그 변화. 훈련 계획의 변화는 13번에서 코치가 하는 행동.","c":2},"h":"a9e533bfdd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"With this technology, athletes can stay safe and play their best.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 기술 덕분에 선수들은 안전하게 지내며 최선을 다해 경기할 수 있다.","opts":["이 기술 때문에 선수들은 경기에서 더 위험해질 수 있다.","기술이 없어도 선수들은 항상 안전하게 경기한다.","선수들은 이 기술을 쓰면 최선을 다하지 않아도 된다.","이 기술을 통해 선수들은 안전을 지키면서 최고의 경기를 할 수 있다."],"r":{"a":"4) 이 기술을 통해 선수들은 안전을 지키면서 최고의 경기를 할 수 있다.","ev":"14번 문장","s":[[14,"With this technology, athletes can stay safe and play their best.","이 기술 덕분에 선수들은 안전하게 지내며 최선을 다해 경기할 수 있다."]],"w":"With this technology는 '이 기술 덕분에', stay safe는 안전하게 지내다, play their best는 최선을 다해 경기하다. 10~13번에서 부상을 예방한다는 내용과 이어져 4번.","c":4},"h":"3c88e4e6ab"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["웨어러블은 아마추어 선수에게만 도움이 된다.","축구 선수들은 얼마나 높이 점프하는지 재려고 GPS 조끼를 입는다.","코치들은 웨어러블의 데이터를 보고 훈련 계획을 짠다.","웨어러블은 부상의 징후를 전혀 보여 주지 못한다."],"opts":["Wearables are helpful only for amateur players.","Soccer players wear GPS vests to measure how high they jump.","Coaches use data from wearables to make training plans.","Wearables cannot show any signs of injury."],"r":{"a":"3) Coaches use data from wearables to make training plans.","ev":"2번, 6번, 9번, 12번 문장","s":[[2,"These are helpful for professional athletes today.","이것들은 오늘날 프로 선수들에게 도움이 된다."],[6,"These track how fast and how far they run.","이것들은 선수들이 얼마나 빠르게, 얼마나 멀리 달리는지 추적한다."],[9,"Coaches look at these details to make training plans for each athlete.","코치들은 이런 세부 정보를 보고 각 선수를 위한 훈련 계획을 짠다."],[12,"These changes can show early signs of tiredness or injury.","이런 변화는 피로나 부상의 초기 징후를 보여 줄 수 있다."]],"w":"9번에 Coaches look at these details to make training plans라고 나옴. ①은 2번에서 프로 선수들에게 도움이 된다고 해서 틀림, ②는 6번에서 GPS 조끼는 달리는 속도와 거리를 추적한다고 해서 틀림, ④는 12번에서 초기 징후를 보여 줄 수 있다고 해서 반대.","c":3},"h":"8f1795e507"},{"n":9,"t":"sum","q":"If signs of tiredness (A), coaches can change training or let athletes (B).","ko":"피로의 징후가 (A) 코치들은 훈련을 바꾸거나 선수들을 (B) 할 수 있다.","opts":["(A) appear / (B) rest","(A) appear / (B) quit","(A) disappear / (B) rest","(A) disappear / (B) quit","(A) end / (B) rest"],"oko":["(A) 나타나면 / (B) 쉬게","(A) 나타나면 / (B) 그만두게","(A) 사라지면 / (B) 쉬게","(A) 사라지면 / (B) 그만두게","(A) 끝나면 / (B) 쉬게"],"r":{"a":"1) (A) appear / (B) rest ((A) 나타나면 / (B) 쉬게)","ev":"13번 문장","s":[[13,"If these signs appear, coaches can change training or let athletes rest.","이런 징후가 나타나면 코치들은 훈련을 바꾸거나 선수들이 쉬게 할 수 있다."]],"w":"13번 문장에 If these signs appear, coaches can change training or let athletes rest라고 나옴. 그래서 appear와 rest.","c":1},"h":"c4c812e7dd"},{"n":10,"t":"fill","q":"Basketball players use smart [A] to measure how high they jump. In tennis, [B] on rackets measure how fast a player swings.","ko":"농구 선수들은 얼마나 높이 점프하는지 재려고 스마트 [A]을(를) 사용한다. 테니스에서는 라켓에 달린 [B]이(가) 선수가 얼마나 빠르게 스윙하는지 측정한다.","bank":["plans","shoes","injury","sensors","tiredness","heart"],"bko":{"plans":"계획","shoes":"신발","injury":"부상","sensors":"센서","tiredness":"피로","heart":"심장"},"r":{"a":"[A] shoes (신발), [B] sensors (센서)","ev":"7~8번 문장","s":[[7,"Basketball players use smart shoes to measure how high they jump.","농구 선수들은 스마트 신발을 사용해 얼마나 높이 점프하는지 측정한다."],[8,"In tennis, sensors on rackets measure how fast a player swings.","테니스에서는 라켓에 달린 센서가 선수가 얼마나 빠르게 스윙하는지 측정한다."]],"w":"7번 Basketball players use smart shoes, 8번 sensors on rackets measure how fast a player swings에서 가져옴. [A]에 sensors를 넣으면 [B]에 들어갈 말이 없고, plans, injury, tiredness, heart는 문장 뜻에 맞지 않음.","c":null},"h":"7112cd1c28"}]},{"u":6,"id":"b2-06-4","no":4,"ko":"설탕이 없는데 달콤한 음료, 정말 괜찮을까?","items":[{"n":1,"t":"tf","q":"Zero-calorie drinks use artificial sweeteners instead of real sugar.","ko":"제로 칼로리 음료는 진짜 설탕 대신 인공 감미료를 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"These drinks use artificial sweeteners instead of real sugar.","이 음료들은 진짜 설탕 대신 인공 감미료를 사용한다."]],"w":"4번 문장에 These drinks use artificial sweeteners instead of real sugar라고 그대로 나옴.","c":"T"},"h":"e539670cdf"},{"n":2,"t":"tf","q":"Artificial sweeteners are less sweet than sugar, so a large amount is needed.","ko":"인공 감미료는 설탕보다 덜 달아서 많은 양이 필요하다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The sweeteners are much sweeter, so only a tiny amount is needed.","감미료는 훨씬 더 달아서 아주 적은 양만 필요하다."]],"w":"5번 문장에 The sweeteners are much sweeter, so only a tiny amount is needed라고 나옴. 더 달아서 적은 양만 필요하므로 틀림.","c":"F"},"h":"a4f51b1423"},{"n":3,"t":"tf","q":"The writer says people should rely on zero-calorie drinks as much as possible.","ko":"글쓴이는 사람들이 제로 칼로리 음료에 가능한 한 많이 의존해야 한다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"So, it’s better not to rely on them too much.","그러니 그것에 너무 많이 의존하지 않는 편이 낫다."]],"w":"14번 문장에 it's better not to rely on them too much라고 나옴. 너무 의존하지 않는 편이 낫다고 했으므로 틀림.","c":"F"},"h":"5d26028930"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This small quantity adds almost no calories.)","ko":"이 적은 ( )은 칼로리를 거의 더하지 않는다.","opts":["가격","양","온도","맛"],"word":"quantity","r":{"a":"2) 양","ev":"5~6번 문장","s":[[5,"The sweeteners are much sweeter, so only a tiny amount is needed.","감미료는 훨씬 더 달아서 아주 적은 양만 필요하다."],[6,"This small quantity adds almost no calories.","이 적은 양은 칼로리를 거의 더하지 않는다."]],"w":"5번에서 only a tiny amount(아주 적은 양)라고 하고, 6번 This small quantity가 그것을 받음. 그래서 quantity는 '양'.","c":2},"h":"ff0ecc79c7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, it's better not to rely on them too much.)","ko":"그러니 그것에 너무 ( ) 않는 편이 낫다.","opts":["무시하다","거절하다","발견하다","의존하다"],"word":"rely","r":{"a":"4) 의존하다","ev":"13~14번 문장","s":[[13,"Zero-calorie drinks can help people avoid sugar, but they’re not a perfect solution.","제로 칼로리 음료는 사람들이 설탕을 피하는 데 도움이 될 수 있지만, 완벽한 해결책은 아니다."],[14,"So, it’s better not to rely on them too much.","그러니 그것에 너무 많이 의존하지 않는 편이 낫다."]],"w":"13번에서 완벽한 해결책은 아니라고 했고, 14번 So로 이어짐. 너무 기대지 말라는 뜻이라 rely on은 '의존하다'.","c":4},"h":"7077ec858e"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat’s why some choose zero-calorie drinks.","ko":"밑줄 친 That이 가리키는 것은?","sko":"그래서 일부는 제로 칼로리 음료를 선택한다.","opts":["많은 사람이 지나친 설탕을 걱정하는 것","제로 칼로리 음료가 진짜 설탕을 쓰는 것","탄산음료가 맛이 없는 것","사람들이 탄산음료를 마시지 못하는 것"],"pron":"That","r":{"a":"1) 많은 사람이 지나친 설탕을 걱정하는 것","ev":"1~2번 문장","s":[[1,"Many people enjoy soda, but they worry about too much sugar.","많은 사람이 탄산음료를 즐기지만 지나친 설탕을 걱정한다."],[2,"That’s why some choose zero-calorie drinks.","그래서 일부는 제로 칼로리 음료를 선택한다."]],"w":"1번에서 많은 사람이 탄산음료를 즐기지만 지나친 설탕을 걱정한다고 함. 2번의 That은 이 내용을 가리킴. 그래서 일부 사람들이 제로 칼로리 음료를 고른다는 뜻.","c":1,"k":"That = 많은 사람이 지나친 설탕을 걱정하는 것"},"h":"bbeccba506"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Zero-calorie drinks can help people avoid sugar, but they're not a perfect solution.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"제로 칼로리 음료는 사람들이 설탕을 피하는 데 도움이 될 수 있지만, 완벽한 해결책은 아니다.","opts":["제로 칼로리 음료는 설탕을 피하는 데 전혀 도움이 되지 않는다.","제로 칼로리 음료는 설탕을 피하는 데 도움이 되지만 완벽한 해결책은 아니다.","제로 칼로리 음료는 완벽한 해결책이라 마음껏 마셔도 된다.","제로 칼로리 음료는 사람들이 설탕을 더 많이 먹게 만든다."],"r":{"a":"2) 제로 칼로리 음료는 설탕을 피하는 데 도움이 되지만 완벽한 해결책은 아니다.","ev":"13번 문장","s":[[13,"Zero-calorie drinks can help people avoid sugar, but they’re not a perfect solution.","제로 칼로리 음료는 사람들이 설탕을 피하는 데 도움이 될 수 있지만, 완벽한 해결책은 아니다."]],"w":"can help는 '도움이 될 수 있다', but 뒤의 not a perfect solution은 '완벽한 해결책은 아니다'. 장점과 한계를 함께 말한 2번.","c":2},"h":"c3d34c05ad"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["일부 연구자들은 인공 감미료가 뇌의 단맛 감각을 혼란스럽게 할 수 있다고 생각한다.","연구자들은 인공 감미료가 완전히 안전하다고 말한다.","인공 감미료는 뇌가 단맛을 잊어버리게 만든다.","연구자들은 감미료가 모든 건강 문제를 막아 준다고 밝혔다."],"opts":["Some researchers think artificial sweeteners might confuse the brain's sense of sweetness.","Researchers say artificial sweeteners are completely safe.","Artificial sweeteners make the brain forget about sweetness.","Researchers found that sweeteners prevent all health problems."],"r":{"a":"1) Some researchers think artificial sweeteners might confuse the brain's sense of sweetness.","ev":"9~10번 문장","s":[[9,"However, some researchers warn about side effects.","하지만 일부 연구자들은 부작용을 경고한다."],[10,"They suggest that artificial sweeteners might confuse the brain’s sense of sweetness.","그들은 인공 감미료가 뇌의 단맛 감각을 혼란스럽게 할 수 있다고 말한다."]],"w":"9번에서 일부 연구자들이 경고하고, 10번에서 They suggest that artificial sweeteners might confuse the brain's sense of sweetness라고 함. ②는 9번 경고와 반대, ③은 잊게 하는 게 아니라 혼란스럽게 하는 것, ④는 12번에서 건강 문제를 일으킬 수 있다고 해서 반대.","c":1},"h":"1aa4c2dc0d"},{"n":9,"t":"sum","q":"Zero-calorie drinks may seem (A), but some researchers warn about (B).","ko":"제로 칼로리 음료는 (A) 보일 수 있지만, 일부 연구자들은 (B)을(를) 경고한다.","opts":["(A) healthy / (B) side effects","(A) healthy / (B) good news","(A) harmful / (B) side effects","(A) harmful / (B) good news","(A) cheap / (B) good news"],"oko":["(A) 건강해 / (B) 부작용","(A) 건강해 / (B) 좋은 소식","(A) 해로워 / (B) 부작용","(A) 해로워 / (B) 좋은 소식","(A) 싸 / (B) 좋은 소식"],"r":{"a":"1) (A) healthy / (B) side effects ((A) 건강해 / (B) 부작용)","ev":"8~9번 문장","s":[[8,"Zero-calorie drinks may seem like a healthy choice.","제로 칼로리 음료는 건강한 선택처럼 보일 수 있다."],[9,"However, some researchers warn about side effects.","하지만 일부 연구자들은 부작용을 경고한다."]],"w":"8번에 Zero-calorie drinks may seem like a healthy choice, 9번에 some researchers warn about side effects라고 나옴. 그래서 healthy와 side effects.","c":1},"h":"3cecfba925"},{"n":10,"t":"fill","q":"This can make people want more sweet [A] or affect how the body [B] sugar.","ko":"이것은 사람들이 단 [A]을(를) 더 원하게 만들거나 몸이 당을 [B] 방식에 영향을 줄 수 있다.","bank":["calories","brain","quantity","food","health","controls"],"bko":{"calories":"칼로리","brain":"뇌","quantity":"양","food":"음식","health":"건강","controls":"조절하다(control의 3인칭 단수)"},"r":{"a":"[A] food (음식), [B] controls (조절하다(control의 3인칭 단수))","ev":"11번 문장","s":[[11,"This can make people want more sweet food or affect how the body controls sugar.","이것은 사람들이 단 음식을 더 원하게 만들거나 몸이 당을 조절하는 방식에 영향을 줄 수 있다."]],"w":"11번 문장 This can make people want more sweet food or affect how the body controls sugar에서 가져옴. want more sweet food는 \"단 음식을 더 원하다\", how the body controls sugar는 \"몸이 당을 조절하는 방식\". calories, brain, quantity, health는 뜻이 맞지 않음.","c":null},"h":"07f9a2bf93"}]},{"u":7,"id":"b2-07-1","no":1,"ko":"책 70권을 싣고 강을 건너는 당나귀 도서관","items":[{"n":1,"t":"tf","q":"Luis Soriano’s traveling library is called Biblioburro.","ko":"루이스 소리아노의 이동 도서관은 비블리오부로라고 불린다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장에서 He called it Biblioburro라고 함. 이동 도서관의 이름이 Biblioburro라는 내용과 일치.","c":"T","ev":"4번 문장","s":[[4,"He called it Biblioburro, which means “donkey library” in Spanish.","그는 그것을 '비블리오부로'라고 불렀는데, 이는 스페인어로 '당나귀 도서관'을 뜻한다."]]},"h":"20922cf843"},{"n":2,"t":"tf","q":"Biblioburro still has only 70 books.","ko":"비블리오부로는 아직도 책이 70권뿐이다.","r":{"a":"F (본문과 다른 내용)","w":"70권은 5번에서 처음 시작할 때의 책 수. 10번 문장에서 지금은 more than 4,000 books(4,000권 이상)라고 함. 그래서 틀린 내용.","c":"F","ev":"5번, 10번 문장","s":[[5,"With two donkeys and just 70 books, Luis began visiting small villages.","당나귀 두 마리와 겨우 70권의 책을 가지고, 루이스는 작은 마을들을 방문하기 시작했다."],[10,"Now, Biblioburro has more than 4,000 books.","이제 비블리오부로는 4,000권이 넘는 책을 가지고 있다."]]},"h":"2f68af4ab7"},{"n":3,"t":"tf","q":"A small library has also opened in Luis’s town.","ko":"루이스의 마을에는 작은 도서관도 문을 열었다.","r":{"a":"T (본문과 맞는 내용)","w":"11번 문장에 A small library has also opened in Luis’s town이라고 그대로 나옴. 루이스의 마을에 작은 도서관도 생겼다는 내용과 같음.","c":"T","ev":"11번 문장","s":[[11,"A small library has also opened in Luis’s town.","루이스의 마을에는 작은 도서관도 문을 열었다."]]},"h":"676d5c2ba4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Children gather when the donkeys arrive.)","ko":"아이들은 당나귀들이 도착하면 ( ).","opts":["흩어지다","모이다","도망치다","잠자다"],"word":"gather","r":{"a":"2) 모이다","w":"8번 문장에서 당나귀가 오면 아이들이 어떻게 되는지 생각하면 됨. gather = 모이다. 9번에서 루이스가 그 아이들(them)에게 책을 읽어 주니 흩어지는 것은 아님.","c":2,"ev":"8~9번 문장","s":[[8,"Children gather when the donkeys arrive.","당나귀들이 도착하면 아이들이 모인다."],[9,"Luis reads to them and lets them borrow books to take home.","루이스는 아이들에게 책을 읽어 주고, 집에 가져가도록 책을 빌려 가게 해 준다."]]},"h":"d5a54bd633"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They cross rivers and climb narrow trails.)","ko":"그들은 강을 건너고 ( ) 길을 오른다.","opts":["넓은","위험한","좁은","긴"],"word":"narrow","r":{"a":"3) 좁은","w":"7번 문장에서 길(trails)을 꾸미는 말. 작은 마을까지 가는 산길이므로 narrow = 좁은. 넓은은 반대 뜻.","c":3,"ev":"7번 문장","s":[[7,"They cross rivers and climb narrow trails.","그들은 강을 건너고 좁은 길을 오른다."]]},"h":"a091b5aacc"},{"n":6,"t":"ref","q":"What does the underlined \"these areas\" refer to?\nSo Luis Soriano, a teacher in one of these areas, started a traveling library.","ko":"밑줄 친 these areas가 가리키는 것은?","sko":"그래서 그런 지역 중 한 곳의 교사인 루이스 소리아노는 이동 도서관을 시작했다.","opts":["학교나 도서관이 없는 콜롬비아의 외딴 마을들","스페인어를 쓰는 여러 나라","강을 건너야 하는 길","책이 아주 많은 큰 도시들"],"pron":"these areas","r":{"a":"1) 학교나 도서관이 없는 콜롬비아의 외딴 마을들","ev":"1번, 3번 문장","s":[[1,"Many remote villages in Colombia do not have schools or libraries.","콜롬비아의 많은 외딴 마을에는 학교나 도서관이 없다."],[3,"So Luis Soriano, a teacher in one of these areas, started a traveling library.","그래서 그런 지역 중 한 곳의 교사인 루이스 소리아노는 이동 도서관을 시작했다."]],"w":"1번에서 콜롬비아의 많은 외딴 마을에는 학교나 도서관이 없다고 함. 3번의 these areas는 이 마을들을 가리킴. 그래서 그런 지역의 교사인 루이스가 이동 도서관을 시작했다는 뜻.","c":1,"k":"these areas = 학교나 도서관이 없는 콜롬비아의 외딴 마을들"},"h":"cae49c443f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This means children don’t have access to books.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 아이들이 책을 접할 수 없다는 뜻이다.","opts":["아이들이 책을 마음껏 고를 수 있다는 뜻이다.","아이들이 책 읽기를 싫어한다는 뜻이다.","아이들이 책을 접할 수 없다는 뜻이다.","아이들이 책을 너무 많이 갖고 있다는 뜻이다."],"r":{"a":"3) 아이들이 책을 접할 수 없다는 뜻이다.","w":"don’t have access to는 '~을 접할 수 없다'는 뜻. 1번에서 외딴 마을에 학교와 도서관이 없다고 했으니, 아이들이 책을 접할 수 없다는 3번.","c":3,"ev":"2번 문장","s":[[2,"This means children don’t have access to books.","이것은 아이들이 책을 접할 수 없다는 뜻이다."]]},"h":"66dee1bb4f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Luis started the library because his town already had many libraries.","Luis keeps all the books and never lets children take them home.","Luis reads to the children and lets them borrow books.","Luis uses trucks to carry the books."],"oko":["루이스는 마을에 이미 도서관이 많아서 도서관을 시작했다.","루이스는 모든 책을 자기가 갖고 있고 아이들이 집에 가져가지 못하게 한다.","루이스는 아이들에게 책을 읽어 주고 책을 빌려 가게 해 준다.","루이스는 트럭으로 책을 나른다."],"r":{"a":"3) Luis reads to the children and lets them borrow books. (루이스는 아이들에게 책을 읽어 주고 책을 빌려 가게 해 준다.)","ev":"1번, 9번 문장","s":[[1,"Many remote villages in Colombia do not have schools or libraries.","콜롬비아의 많은 외딴 마을에는 학교나 도서관이 없다."],[9,"Luis reads to them and lets them borrow books to take home.","루이스는 아이들에게 책을 읽어 주고, 집에 가져가도록 책을 빌려 가게 해 준다."]],"w":"9번에 Luis reads to them and lets them borrow books to take home이라고 나옴. ①은 1번에서 도서관이 없다고 해서 반대, ②는 책을 빌려 가게 해 준다는 내용과 반대, ④는 5번에서 당나귀와 함께 간다고 해서 반대.","c":3},"h":"e6ae2aa93d"},{"n":9,"t":"sum","q":"Every (A), Luis and his donkeys travel up to 10 (B).","ko":"매 (A) 루이스와 그의 당나귀들은 최대 10 (B)을(를) 이동한다.","opts":["(A) week / (B) kilometers","(A) week / (B) meters","(A) day / (B) kilometers","(A) month / (B) meters","(A) year / (B) kilometers"],"oko":["(A) 주 / (B) 킬로미터","(A) 주 / (B) 미터","(A) 일 / (B) 킬로미터","(A) 달 / (B) 미터","(A) 해 / (B) 킬로미터"],"r":{"a":"1) (A) week / (B) kilometers ((A) 주 / (B) 킬로미터)","ev":"6번 문장","s":[[6,"Each week, Luis and his donkeys travel up to 10 kilometers.","매주 루이스와 그의 당나귀들은 최대 10킬로미터를 이동한다."]],"w":"6번 문장에 Each week, Luis and his donkeys travel up to 10 kilometers라고 나옴. 그래서 week와 kilometers.","c":1},"h":"210ac764f1"},{"n":10,"t":"fill","q":"His idea has helped many children [A] reading and [B] others to start mobile libraries.","ko":"그의 아이디어는 많은 아이들이 독서를 [A] 도왔고, 다른 사람들이 이동 도서관을 시작하도록 [B].","bank":["enjoy","inspired","borrow","gather","climb","cross"],"bko":{"enjoy":"즐기다","inspired":"영감을 주었다","borrow":"빌리다","gather":"모이다","climb":"오르다","cross":"건너다"},"r":{"a":"[A] enjoy (즐기다), [B] inspired (영감을 주었다)","ev":"12번 문장","s":[[12,"His idea has helped many children enjoy reading and inspired others to start mobile libraries.","그의 아이디어는 많은 아이들이 독서를 즐기도록 도왔고 다른 사람들이 이동 도서관을 시작하도록 영감을 주었다."]],"w":"12번 문장 His idea has helped many children enjoy reading and inspired others to start mobile libraries에서 가져옴. helped ~ enjoy는 \"~가 즐기도록 도왔다\", inspired는 \"영감을 주었다\"(inspire의 과거형). borrow, gather, climb, cross는 두 빈칸의 뜻에 맞지 않음.","c":null},"h":"3763fe185d"}]},{"u":7,"id":"b2-07-2","no":2,"ko":"교실이 바다 위에 있다면?","items":[{"n":1,"t":"tf","q":"Semester at Sea is a college program where students travel and study on a ship.","ko":"세메스터 앳 시는 학생들이 배를 타고 여행하며 공부하는 대학 프로그램이다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장이 그대로 이 설명임. 배 위에서 여행하며 공부한다는 내용과 일치.","c":"T","ev":"3번 문장","s":[[3,"It’s a college program where students travel and study on a ship.","그것은 학생들이 배를 타고 여행하며 공부하는 대학 프로그램이다."]]},"h":"e0f474756c"},{"n":2,"t":"tf","q":"The journey lasts about 100 days and stops in only 3 countries.","ko":"그 여정은 약 100일 동안 이어지며 단 3개의 나라에만 들른다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 100일은 맞지만 stops in more than 10 countries(10개가 넘는 나라)라고 함. 3개 나라라는 부분이 틀림.","c":"F","ev":"4번 문장","s":[[4,"The journey lasts about 100 days and stops in more than 10 countries.","그 여정은 약 100일 동안 이어지며 10개가 넘는 나라에 들른다."]]},"h":"4e424afd21"},{"n":3,"t":"tf","q":"Students continue learning through real experiences when the ship arrives at a port.","ko":"배가 항구에 도착하면 학생들은 실제 경험을 통해 계속 배운다.","r":{"a":"T (본문과 맞는 내용)","w":"8번 문장이 같은 내용. 항구에 도착한 뒤에도 실제 경험으로 배움을 이어간다는 뜻.","c":"T","ev":"8번 문장","s":[[8,"When the ship arrives at a port, students continue learning through real experiences.","배가 항구에 도착하면, 학생들은 실제 경험을 통해 계속 배운다."]]},"h":"56104060ae"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The journey lasts about 100 days and stops in more than 10 countries.)","ko":"( )은 약 100일 동안 이어지며 10개가 넘는 나라에 들른다.","opts":["여행","시험","휴식","경기"],"word":"journey","r":{"a":"1) 여행","w":"4번 문장에서 100일 동안 이어지고 여러 나라에 들른다고 했으므로 journey = 여정, 긴 여행. 3번에서 배를 타고 여행(travel)한다는 말과도 이어짐.","c":1,"ev":"4번 문장","s":[[4,"The journey lasts about 100 days and stops in more than 10 countries.","그 여정은 약 100일 동안 이어지며 10개가 넘는 나라에 들른다."]]},"h":"6fd244756e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A history student might explore ancient ruins.)","ko":"역사학과 학생은 ( ) 유적을 탐험할지도 모른다.","opts":["작은","현대의","유명한","고대의"],"word":"ancient","r":{"a":"4) 고대의","w":"10번 문장에서 역사학과 학생이 탐험하는 유적(ruins)을 꾸미는 말. 역사학과 학생이 가는 곳이므로 ancient = 고대의. 현대의는 반대 뜻.","c":4,"ev":"10번 문장","s":[[10,"A history student might explore ancient ruins.","역사학과 학생은 고대 유적을 탐험할지도 모른다."]]},"h":"83bff7e81f"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSome lessons also introduce the culture or history of the next country they will visit.","ko":"밑줄 친 they가 가리키는 것은?","sko":"일부 수업은 그들이 다음에 방문할 나라의 문화나 역사도 소개한다.","opts":["항구들","학생들","나라들","선생님들"],"pron":"they","r":{"a":"2) 학생들","ev":"5번, 7번 문장","s":[[5,"While the ship is sailing, students take classes such as world history and international business.","배가 항해하는 동안, 학생들은 세계사와 국제 경영 같은 수업을 듣는다."],[7,"Some lessons also introduce the culture or history of the next country they will visit.","일부 수업은 그들이 다음에 방문할 나라의 문화나 역사도 소개한다."]],"w":"5번에서 학생들이 배 위에서 수업을 듣는다고 하고, 7번의 they는 다음에 나라를 방문할 사람, 즉 학생들을 가리킴.","c":2,"k":"they = 학생들"},"h":"e9c592a232"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For these students, the ocean is a campus, and every country is a classroom.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 학생들에게 바다는 캠퍼스이고 모든 나라는 교실이다.","opts":["학생들은 바다에서 수영하는 법을 배우는 데 대부분의 시간을 쓴다.","학생들은 모든 나라에 학교 건물을 새로 짓는다.","학생들은 바다 위와 방문하는 모든 나라에서 배움을 얻는다.","학생들은 교실 없이 놀기만 한다."],"r":{"a":"3) 학생들은 바다 위와 방문하는 모든 나라에서 배움을 얻는다.","w":"12번은 비유. 바다(배 위)는 캠퍼스, 방문하는 나라는 교실이라는 말은 배 위에서도 나라에서도 배운다는 뜻. 5번 수업과 8번 이후 실제 경험이 이어지는 내용임.","c":3,"ev":"12번 문장","s":[[12,"For these students, the ocean is a campus, and every country is a classroom.","이 학생들에게 바다는 캠퍼스이고 모든 나라는 교실이다."]]},"h":"cf0b5d4910"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Every student studies the same subjects.","Students only study while the ship is in port.","What students study depends on their majors or interests.","Each student does the same thing at every port."],"oko":["모든 학생이 똑같은 과목을 공부한다.","학생들은 배가 항구에 있는 동안에만 공부한다.","학생들이 공부하는 것은 전공이나 관심사에 따라 달라진다.","각 학생은 모든 항구에서 똑같은 일을 한다."],"r":{"a":"3) What students study depends on their majors or interests. (학생들이 공부하는 것은 전공이나 관심사에 따라 달라진다.)","ev":"5번, 6번, 9번 문장","s":[[5,"While the ship is sailing, students take classes such as world history and international business.","배가 항해하는 동안, 학생들은 세계사와 국제 경영 같은 수업을 듣는다."],[6,"The subjects they study depend on their majors or interests.","그들이 공부하는 과목은 전공이나 관심사에 따라 달라진다."],[9,"Each student joins different activities related to their classes.","각 학생은 자신의 수업과 관련된 서로 다른 활동에 참여한다."]],"w":"6번에 The subjects they study depend on their majors or interests라고 나옴. ①은 이와 반대, ②는 5번에서 배가 항해하는 동안 수업을 듣는다고 해서 반대, ④는 9번에서 각 학생이 서로 다른 활동에 참여한다고 해서 반대.","c":3},"h":"112ed302bb"},{"n":9,"t":"sum","q":"Each student joins different (A) related to their (B).","ko":"각 학생은 자신의 (B)과(와) 관련된 서로 다른 (A)에 참여한다.","opts":["(A) activities / (B) classes","(A) activities / (B) friends","(A) games / (B) classes","(A) games / (B) friends","(A) rules / (B) classes"],"oko":["(A) 활동 / (B) 수업","(A) 활동 / (B) 친구","(A) 게임 / (B) 수업","(A) 게임 / (B) 친구","(A) 규칙 / (B) 수업"],"r":{"a":"1) (A) activities / (B) classes ((A) 활동 / (B) 수업)","ev":"9번 문장","s":[[9,"Each student joins different activities related to their classes.","각 학생은 자신의 수업과 관련된 서로 다른 활동에 참여한다."]],"w":"9번 문장에 Each student joins different activities related to their classes라고 나옴. 그래서 activities와 classes.","c":1},"h":"c059466fd8"},{"n":10,"t":"fill","q":"On the other hand, a [A] student could visit a local [B].","ko":"반면에, [A] 전공 학생은 현지 [B]을(를) 방문할 수도 있다.","bank":["business","company","ruins","journey","sailing","arrives"],"bko":{"business":"경영","company":"회사","ruins":"유적","journey":"여정","sailing":"항해","arrives":"도착한다"},"r":{"a":"[A] business (경영), [B] company (회사)","ev":"11번 문장","s":[[11,"On the other hand, a business student could visit a local company.","반면에, 경영학과 학생은 현지 회사를 방문할 수도 있다."]],"w":"11번 문장 On the other hand, a business student could visit a local company에서 가져옴. a business student는 \"경영학과 학생\", a local company는 \"현지 회사\". ruins, journey, sailing, arrives는 student 앞이나 a local 뒤에 쓰기에 뜻이 맞지 않음.","c":null},"h":"b524fc7b68"}]},{"u":7,"id":"b2-07-3","no":3,"ko":"토마토 타이머가 집중력을 살려 준다고?","items":[{"n":1,"t":"tf","q":"Francesco Cirillo had trouble focusing while studying.","ko":"프란체스코 시릴로는 공부하는 동안 집중하는 데 어려움을 겪었다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장 had trouble focusing while studying과 같은 내용.","c":"T","ev":"1번 문장","s":[[1,"In the 1980s, an Italian student named Francesco Cirillo had trouble focusing while studying.","1980년대에 이탈리아 학생 프란체스코 시릴로는 공부하는 동안 집중하는 데 어려움을 겪었다."]]},"h":"a76ef7b0b0"},{"n":2,"t":"tf","q":"Francesco first challenged himself to study for two hours.","ko":"프란체스코는 처음에 두 시간 동안 공부하겠다고 스스로에게 도전했다.","r":{"a":"F (본문과 다른 내용)","w":"2번 문장에서 처음 도전한 시간은 just two minutes(단 2분). 두 시간이 아님.","c":"F","ev":"2번 문장","s":[[2,"One day, he grabbed a tomato-shaped timer and challenged himself to study for just two minutes.","어느 날 그는 토마토 모양의 타이머를 집어 들고 단 2분 동안만 공부해 보겠다고 스스로에게 도전했다."]]},"h":"74ce6b795b"},{"n":3,"t":"tf","q":"The idea Francesco found became the Pomodoro Technique.","ko":"프란체스코가 찾은 아이디어는 포모도로 기법이 되었다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장 This idea became the Pomodoro Technique와 같은 내용. This idea는 4~5번의 25분 공부 + 5분 휴식 방법.","c":"T","ev":"6번 문장","s":[[6,"This idea became the Pomodoro Technique.","이 아이디어는 포모도로 기법이 되었다."]]},"h":"444f5b1b0c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day, he grabbed a tomato-shaped timer and challenged himself…)","ko":"어느 날 그는 토마토 모양의 타이머를 ( ) 스스로에게 도전했다.","opts":["던졌다","집어 들었다","깨뜨렸다","주문했다"],"word":"grabbed","r":{"a":"2) 집어 들었다","w":"2번 문장에서 타이머를 잡아서 바로 공부에 쓰는 장면. grab = 붙잡다, 집어 들다. 던지거나 깨뜨리면 타이머로 공부할 수 없음.","c":2,"ev":"2번 문장","s":[[2,"One day, he grabbed a tomato-shaped timer and challenged himself to study for just two minutes.","어느 날 그는 토마토 모양의 타이머를 집어 들고 단 2분 동안만 공부해 보겠다고 스스로에게 도전했다."]]},"h":"5f1b27f4b2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You also stay motivated as you finish each session.)","ko":"각 시간을 끝낼 때마다 계속 ( ) 상태가 된다.","opts":["피곤한","지루한","의욕이 있는","바쁜"],"word":"motivated","r":{"a":"3) 의욕이 있는","w":"11번 문장에서 각 시간을 끝낼 때마다 어떤 마음이 유지되는지 묻는 것. 10번의 without getting tired(지치지 않고)와 이어지는 좋은 점이라 motivated = 의욕이 있는.","c":3,"ev":"11번 문장","s":[[11,"You also stay motivated as you finish each session.","또한 각 시간을 끝낼 때마다 의욕이 계속 유지된다."]]},"h":"02d77e01aa"},{"n":6,"t":"ref","q":"What does the underlined \"This rhythm\" refer to?\nThis rhythm helps your brain stay focused without getting tired.","ko":"밑줄 친 This rhythm이 가리키는 것은?","sko":"이 리듬은 지치지 않고 뇌가 집중을 유지하도록 돕는다.","opts":["25분 공부하고 5분 쉬기를 반복하고, 네 번 뒤에는 더 길게 쉬는 방식","토마토 모양 타이머가 울리는 소리","프란체스코가 처음 공부하던 시간","포모도로라는 이탈리아어 단어"],"pron":"This rhythm","r":{"a":"1) 25분 공부하고 5분 쉬기를 반복하고, 네 번 뒤에는 더 길게 쉬는 방식","ev":"8~10번 문장","s":[[8,"Study for 25 minutes, then rest for 5 minutes, and repeat.","25분 동안 공부하고, 5분 동안 쉬고, 이를 반복하라."],[9,"After four of these sessions, take a longer break of 15 to 30 minutes.","이런 시간을 네 번 한 뒤에는 15분에서 30분의 더 긴 휴식을 취하라."],[10,"This rhythm helps your brain stay focused without getting tired.","이 리듬은 지치지 않고 뇌가 집중을 유지하도록 돕는다."]],"w":"8~9번에서 25분 공부하고 5분 쉬기를 반복하고, 네 번 뒤에는 더 길게 쉬라고 함. 10번의 This rhythm은 이 방식을 가리킴. 그래서 지치지 않고 집중을 유지하도록 돕는다는 뜻.","c":1,"k":"This rhythm = 25분 공부하고 5분 쉬기를 반복하고, 네 번 뒤에는 더 길게 쉬는 방식"},"h":"38bea81f29"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence 효과가 좋다는 것을 알게 되었다.","bank":["increased","break","tomato","sessions","finished","rhythm"],"bko":{"increased":"늘렸다(increase의 과거)","break":"휴식","tomato":"토마토","sessions":"시간들","finished":"끝냈다","rhythm":"리듬"},"r":{"a":"[A] increased (늘렸다(increase의 과거)), [B] break (휴식)","ev":"4번 문장","s":[[4,"He slowly increased the time and found that 25 minutes of study followed by a 5-minute break worked best.","그는 시간을 천천히 늘렸고, 25분 공부한 뒤 5분 쉬는 것이 가장 효과가 좋다는 것을 알게 되었다."]],"w":"4번 문장 He slowly increased the time and found that 25 minutes of study followed by a 5-minute break worked best에서 가져옴. increased는 increase(늘리다)의 과거형, a 5-minute break는 \"5분 휴식\". tomato, sessions, finished, rhythm은 문장 뜻과 문법에 맞지 않음.","c":null},"h":"b974234b09"}]},{"u":7,"id":"b2-07-4","no":4,"ko":"지루한 공부를 게임처럼 만드는 비밀","items":[{"n":1,"t":"tf","q":"Gamification adds game-like features to everyday tasks.","ko":"게임화는 게임 같은 요소를 일상적인 일에 더한다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장이 그대로 게임화의 뜻임. 일상적인 일에 게임 같은 요소를 더한다는 내용과 일치.","c":"T","ev":"1번 문장","s":[[1,"Gamification adds game-like features to everyday tasks.","게임화는 게임 같은 요소를 일상적인 일에 더한다."]]},"h":"a097f1d0ca"},{"n":2,"t":"tf","q":"Duolingo learners cannot compete with other users.","ko":"듀오링고 학습자들은 다른 사용자들과 경쟁할 수 없다.","r":{"a":"F (본문과 다른 내용)","w":"6번 문장에서 They can also compete with other users라고 함. 경쟁할 수 있다는 내용이라 cannot은 틀림.","c":"F","ev":"6번 문장","s":[[6,"They can also compete with other users to see who studies the most.","그들은 또한 누가 가장 많이 공부하는지 보기 위해 다른 사용자들과 경쟁할 수 있다."]]},"h":"214bdc8b27"},{"n":3,"t":"tf","q":"Many schools now use gamification in subjects such as math and science.","ko":"많은 학교가 이제 수학과 과학 같은 과목에서 게임화를 사용한다.","r":{"a":"T (본문과 맞는 내용)","w":"11번 문장 Many schools now use it in subjects such as math and science와 같은 내용. it은 게임화.","c":"T","ev":"11번 문장","s":[[11,"Many schools now use it in subjects such as math and science.","많은 학교가 이제 수학과 과학 같은 과목에서 그것을 사용한다."]]},"h":"4396153ce1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Learners earn points and badges when they learn new words or grammar.)","ko":"학습자들은 새로운 단어나 문법을 배울 때 점수와 배지를 ( ).","opts":["잃는다","산다","얻는다","빌려준다"],"word":"earn","r":{"a":"3) 얻는다","w":"5번 문장에서 단어나 문법을 배우면 점수와 배지가 생긴다는 뜻. 7번의 보상(rewards)과 이어지므로 earn = 얻다. 잃는다는 반대 뜻.","c":3,"ev":"5번 문장","s":[[5,"Learners earn points and badges when they learn new words or grammar.","학습자들은 새로운 단어나 문법을 배울 때 점수와 배지를 얻는다."]]},"h":"7aa658a7f4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They can also compete with other users to see who studies the most.)","ko":"그들은 누가 가장 많이 공부하는지 보기 위해 다른 사용자들과 ( ) 수 있다.","opts":["경쟁할","도울","포기할","섞일"],"word":"compete","r":{"a":"1) 경쟁할","w":"6번 문장에서 목적이 누가 가장 많이 공부하는지 보는 것. 다른 사용자와 순위를 겨루는 것이므로 compete = 경쟁하다.","c":1,"ev":"6번 문장","s":[[6,"They can also compete with other users to see who studies the most.","그들은 또한 누가 가장 많이 공부하는지 보기 위해 다른 사용자들과 경쟁할 수 있다."]]},"h":"f609d0ffb9"},{"n":6,"t":"ref","q":"What does the underlined \"these benefits\" refer to?\nBecause of these benefits, gamification is spreading beyond apps.","ko":"밑줄 친 these benefits가 가리키는 것은?","sko":"이러한 이점 때문에 게임화는 앱을 넘어 퍼지고 있다.","opts":["게임화가 학생들이 의욕을 유지하고 새로운 정보를 더 쉽게 기억하도록 돕는 것","학습자들이 다른 사용자들과 경쟁하는 것","학교에서 수학과 과학을 가르치는 것","듀오링고가 새로운 앱을 만드는 것"],"pron":"these benefits","r":{"a":"1) 게임화가 학생들이 의욕을 유지하고 새로운 정보를 더 쉽게 기억하도록 돕는 것","ev":"8~10번 문장","s":[[8,"Studies show that gamification helps students stay motivated.","연구들은 게임화가 학생들이 의욕을 유지하도록 돕는다는 것을 보여 준다."],[9,"They also show that students remember new information more easily.","연구들은 또한 학생들이 새로운 정보를 더 쉽게 기억한다는 것을 보여 준다."],[10,"Because of these benefits, gamification is spreading beyond apps.","이러한 이점 때문에 게임화는 앱을 넘어 퍼지고 있다."]],"w":"8~9번에서 게임화가 학생들이 의욕을 유지하고 새로운 정보를 더 쉽게 기억하도록 돕는다고 함. 10번의 these benefits는 이 이점들을 가리킴. 그래서 게임화가 앱을 넘어 퍼지고 있다는 뜻.","c":1,"k":"these benefits = 게임화가 학생들이 의욕을 유지하고 새로운 정보를 더 쉽게 기억하도록 돕는 것"},"h":"e9506b5c6b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This way keeps students interested in learning and helps them learn better.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 방식은 학생들이 학습에 계속 흥미를 갖게 하고 더 잘 배우도록 돕는다.","opts":["이 방식은 학생들이 학습에 흥미를 잃지만 빨리 끝내게 한다.","이 방식은 학생들이 혼자서만 공부하도록 만든다.","이 방식은 학생들이 흥미를 유지하고 더 잘 배우도록 돕는다.","이 방식은 학생들이 시험을 더 쉽게 통과하게 한다."],"r":{"a":"3) 이 방식은 학생들이 흥미를 유지하고 더 잘 배우도록 돕는다.","w":"12번은 결과 두 가지. 하나는 keeps students interested(학생들이 계속 흥미를 가짐), 다른 하나는 helps them learn better(더 잘 배움). ③만 이 두 가지가 모두 들어 있음. ④의 시험 이야기는 본문에 없음.","c":3,"ev":"12번 문장","s":[[12,"This way keeps students interested in learning and helps them learn better.","이 방식은 학생들이 학습에 계속 흥미를 갖게 하고 더 잘 배우도록 돕는다."]]},"h":"dabf4de964"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Gamification removes game-like features from everyday tasks.","Many schools use gamification only in art classes.","Fun challenges and rewards make learners want to study more.","Rewards make learners want to study less."],"oko":["게임화는 일상적인 일에서 게임 같은 요소를 없앤다.","많은 학교가 미술 수업에서만 게임화를 사용한다.","재미있는 도전과 보상은 학습자들이 더 공부하고 싶게 만든다.","보상은 학습자들이 덜 공부하고 싶게 만든다."],"r":{"a":"3) Fun challenges and rewards make learners want to study more. (재미있는 도전과 보상은 학습자들이 더 공부하고 싶게 만든다.)","ev":"7번 문장","s":[[7,"These fun challenges and rewards make learners want to study more.","이런 재미있는 도전과 보상은 학습자들이 더 공부하고 싶게 만든다."]],"w":"7번에 These fun challenges and rewards make learners want to study more라고 나옴. ④는 more가 아니라 less라서 반대. ①은 1번에서 게임 같은 요소를 더한다고 해서 반대, ②는 11번에서 수학과 과학 같은 과목에서 쓴다고 해서 반대.","c":3},"h":"d6b705db95"},{"n":9,"t":"sum","q":"Gamification makes boring activities more (A) and (B).","ko":"게임화는 지루한 활동을 더 (A) (B) 만든다.","opts":["(A) exciting / (B) enjoyable","(A) exciting / (B) difficult","(A) tiring / (B) enjoyable","(A) tiring / (B) difficult","(A) boring / (B) enjoyable"],"oko":["(A) 흥미롭고 / (B) 즐겁게","(A) 흥미롭고 / (B) 어렵게","(A) 피곤하고 / (B) 즐겁게","(A) 피곤하고 / (B) 어렵게","(A) 지루하고 / (B) 즐겁게"],"r":{"a":"1) (A) exciting / (B) enjoyable ((A) 흥미롭고 / (B) 즐겁게)","ev":"2번 문장","s":[[2,"It makes boring activities more exciting and enjoyable.","그것은 지루한 활동을 더 흥미롭고 즐겁게 만든다."]],"w":"2번 문장에 It makes boring activities more exciting and enjoyable이라고 나옴. 그래서 exciting과 enjoyable.","c":1},"h":"8b44cad14f"},{"n":10,"t":"fill","q":"It uses [A] and fun lessons, like quick [B] in a game.","ko":"그것은 게임의 빠른 [B]처럼 [A] 재미있는 수업을 사용한다.","bank":["short","rounds","math","apps","compete","beyond"],"bko":{"short":"짧은","rounds":"라운드(판)","math":"수학","apps":"앱","compete":"경쟁하다","beyond":"~을 넘어"},"r":{"a":"[A] short (짧은), [B] rounds (라운드(판))","ev":"4번 문장","s":[[4,"It uses short and fun lessons, like quick rounds in a game.","그것은 게임의 빠른 라운드처럼 짧고 재미있는 수업을 사용한다."]],"w":"4번 문장 It uses short and fun lessons, like quick rounds in a game에서 가져옴. short and fun은 \"짧고 재미있는\", quick rounds는 \"빠른 라운드\". math, apps, compete, beyond는 빈칸에 들어갈 수 없음.","c":null},"h":"6d69a4bfa8"}]},{"u":8,"id":"b2-08-1","no":1,"ko":"산에 가면 마음이 편해지는 진짜 이유","items":[{"n":1,"t":"tf","q":"Serotonin helps us feel calm and happy.","ko":"세로토닌은 우리가 차분하고 행복하게 느끼도록 돕는다.","r":{"a":"T (본문과 맞는 내용)","w":"5번 문장에 It can also increase serotonin, which helps us feel calm and happy라고 나옴. 세로토닌은 차분하고 행복하게 느끼게 돕는 호르몬이라는 내용과 같음.","c":"T","ev":"5번 문장","s":[[5,"It can also increase serotonin, which helps us feel calm and happy.","그것은 또한 우리가 차분하고 행복하게 느끼도록 돕는 세로토닌을 늘릴 수 있다."]]},"h":"50022e9432"},{"n":2,"t":"tf","q":"Spending time in nature can increase cortisol, the stress hormone.","ko":"자연에서 시간을 보내는 것은 스트레스 호르몬인 코티솔을 늘릴 수 있다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 자연은 코티솔을 lower(낮추다)할 수 있다고 함. 늘린다는 말은 반대.","c":"F","ev":"4번 문장","s":[[4,"It can lower cortisol, the hormone related to stress.","그것은 스트레스와 관련된 호르몬인 코티솔을 낮출 수 있다."]]},"h":"e69c2ba967"},{"n":3,"t":"tf","q":"The writer says that people who feel stressed should take a moment to go outside.","ko":"글쓴이는 스트레스를 받으면 잠시 밖으로 나가 보라고 말한다.","r":{"a":"T (본문과 맞는 내용)","w":"12번 문장에 So if you’re feeling stressed, take a moment to go outside라고 나옴. 스트레스를 받으면 잠깐 밖으로 나가라는 내용과 같음.","c":"T","ev":"12번 문장","s":[[12,"So if you’re feeling stressed, take a moment to go outside.","그러니 스트레스를 받고 있다면, 잠시 밖으로 나가 보라."]]},"h":"d4b921ae5b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the fresh air and trees help your mind relax.)","ko":"... 맑은 공기와 나무는 당신의 마음이 ( ) 도와준다.","opts":["긴장하다","편안해지다","피곤해지다","화나다"],"word":"relax","r":{"a":"2) 편안해지다","w":"1번 문장에서 산의 맑은 공기와 나무가 마음에 주는 효과. 2번에서 단지 기분만이 아니라고 하고, 4~6번에서 코티솔이 낮아지고 편안해진다고 함. relax = 편안해지다.","c":2,"ev":"1번 문장","s":[[1,"When you visit the mountains, the fresh air and trees help your mind relax.","산에 가면, 맑은 공기와 나무가 당신의 마음이 편안해지도록 돕는다."]]},"h":"31c108a06f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These places increased their chance of survival.)","ko":"이런 장소들은 그들의 ( ) 가능성을 높였다.","opts":["생존","여행","수확","발견"],"word":"survival","r":{"a":"1) 생존","w":"8번에서 초기 인류가 음식, 물, 쉴 곳을 찾아 숲과 초원으로 갔고, 9번에서 이곳들이 chance of survival(살아남을 가능성)을 높였다고 함. survival = 생존.","c":1,"ev":"8~9번 문장","s":[[8,"Long ago, early humans searched for forests and grasslands to find food, water, and shelter.","아주 오래전, 초기 인류는 음식, 물, 쉴 곳을 찾으려고 숲과 초원을 찾아다녔다."],[9,"These places increased their chance of survival.","이런 장소들은 그들의 생존 가능성을 높였다."]]},"h":"1eb34b4a54"},{"n":6,"t":"ref","q":"What does the underlined \"this reaction\" refer to?\nScientists believe this reaction comes from our past.","ko":"밑줄 친 this reaction이 가리키는 것은?","sko":"과학자들은 이 반응이 우리의 과거에서 비롯된다고 믿는다.","opts":["과학자들의 연구 방법","산으로 가는 여행","자연에서 시간을 보내면 몸과 기분이 달라지는 반응","초기 인류가 음식을 찾는 일"],"pron":"this reaction","r":{"a":"3) 자연에서 시간을 보내면 몸과 기분이 달라지는 반응","ev":"3번, 6번, 7번 문장","s":[[3,"Studies show that spending time in nature changes the chemicals in our bodies.","연구들은 자연에서 시간을 보내는 것이 우리 몸의 화학 물질을 바꾼다는 것을 보여 준다."],[6,"These changes slow our heart rate and make us feel more comfortable.","이런 변화들은 우리의 심장 박동을 느리게 하고 우리가 더 편안하게 느끼도록 만든다."],[7,"Scientists believe this reaction comes from our past.","과학자들은 이 반응이 우리의 과거에서 비롯된다고 믿는다."]],"w":"3~6번에서 자연에서 시간을 보내면 몸속 화학 물질이 바뀌고 몸과 기분이 달라진다고 함. 7번의 this reaction은 이 반응을 가리킴. 과학자들은 이것이 인류의 과거에서 비롯되었다고 믿음.","c":3,"k":"this reaction = 자연에서 시간을 보내면 몸과 기분이 달라지는 반응"},"h":"37cd80bb03"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even a short time in nature can help you feel better.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"자연 속에서 보내는 짧은 시간도 당신이 더 나아지도록 도울 수 있다.","opts":["자연 속에서 짧게 보내는 시간도 기분이 나아지는 데 도움이 될 수 있다.","자연 속에서는 오래 있어야만 기분이 나아진다.","자연 속에서 보내는 짧은 시간은 기분을 더 나쁘게 한다.","자연은 기분과 아무 상관이 없다."],"r":{"a":"1) 자연 속에서 짧게 보내는 시간도 기분이 나아지는 데 도움이 될 수 있다.","ev":"13번 문장","s":[[13,"Even a short time in nature can help you feel better.","자연 속에서 보내는 짧은 시간도 당신이 더 나아지도록 도울 수 있다."]],"w":"Even a short time은 \"짧은 시간조차도\"라는 뜻이고 can help you feel better는 \"기분이 나아지도록 도울 수 있다\"는 뜻. 그래서 짧은 시간도 도움이 된다는 1번.","c":1},"h":"a385341098"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Spending time in nature changes the chemicals in our bodies.","Scientists believe this reaction is only a feeling.","Early humans never visited forests or grasslands.","Spending time in a city makes us feel calm and happy."],"oko":["자연에서 시간을 보내면 우리 몸의 화학 물질이 바뀐다.","과학자들은 이 반응이 단지 기분일 뿐이라고 믿는다.","초기 인류는 숲이나 초원을 한 번도 찾지 않았다.","도시에서 시간을 보내면 우리는 차분하고 행복하게 느낀다."],"r":{"a":"1) Spending time in nature changes the chemicals in our bodies. (자연에서 시간을 보내면 우리 몸의 화학 물질이 바뀐다.)","ev":"2번, 3번, 8번 문장","s":[[2,"This isn’t just a feeling.","이것은 단지 기분만이 아니다."],[3,"Studies show that spending time in nature changes the chemicals in our bodies.","연구들은 자연에서 시간을 보내는 것이 우리 몸의 화학 물질을 바꾼다는 것을 보여 준다."],[8,"Long ago, early humans searched for forests and grasslands to find food, water, and shelter.","아주 오래전, 초기 인류는 음식, 물, 쉴 곳을 찾으려고 숲과 초원을 찾아다녔다."]],"w":"3번에 spending time in nature changes the chemicals in our bodies라고 나옴. ②는 2번에서 단지 기분만이 아니라고 해서 반대, ③은 8번에서 초기 인류가 숲과 초원을 찾아다녔다고 해서 반대, ④는 자연에서 시간을 보내는 경우의 이야기라 본문과 다름.","c":1},"h":"78ddd79a8f"},{"n":9,"t":"sum","q":"Spending time in nature slows our (A) and makes us feel more (B).", ide top(넓은 윗부분)이고 뒤집힌 우산처럼 생겼다고 함. 좁다는 말은 반대.","c":"F","ev":"2번 문장","s":[[2,"It has a wide top that looks like a huge upside-down umbrella.","그것은 거대한 뒤집힌 우산처럼 보이는 넓은 윗부분을 가지고 있다."]]},"h":"89828f312c"},{"n":3,"t":"tf","q":"Dragon’s Blood Trees stand as living symbols of Socotra’s ancient past.","ko":"용혈수는 소코트라의 고대 과거를 보여 주는 살아 있는 상징이다.","r":{"a":"T (본문과 맞는 내용)","w":"12번 문장에 They stand as living symbols of Socotra’s ancient past라고 나옴. They는 앞 문장의 많은 용혈수이고, 소코트라의 고대 과거를 보여 주는 살아 있는 상징이라는 내용과 같음.","c":"T","ev":"12번 문장","s":[[12,"They stand as living symbols of Socotra’s ancient past.","그것들은 소코트라의 고대 과거를 보여 주는 살아 있는 상징으로 서 있다."]]},"h":"1a2c364a4d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…there is a very unusual tree.)","ko":"... 아주 ( ) 나무가 있다.","opts":["흔한","특이한","거대한","오래된"],"word":"unusual","r":{"a":"2) 특이한","w":"1번 문장에서 이 나무를 소개하는 말. 2~4번에서 뒤집힌 우산 같은 모양이라고 하고, 3번에서 strange shape(이상한 모양)라고 함. unusual = 특이한, 흔치 않은.","c":2,"ev":"1번, 3번 문장","s":[[1,"On the island of Socotra, off the coast of Yemen, there is a very unusual tree.","예멘 해안에서 떨어진 소코트라 섬에는 아주 특이한 나무가 있다."],[3,"This strange shape is a clever survival trick in the dry climate.","이 이상한 모양은 건조한 기후에서 살아남기 위한 영리한 요령이다."]]},"h":"c9363365ac"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If its bark is cut, thick red liquid comes out.)","ko":"( )이 베이면 걸쭉한 붉은 액체가 나온다.","opts":["잎","뿌리","열매","나무껍질"],"word":"bark","r":{"a":"4) 나무껍질","w":"6번 문장에서 베이면 액체가 나오는 곳. 8번에서 수액이 굳어 wounds on the bark(나무껍질의 상처)를 보호함. bark = 나무껍질.","c":4,"ev":"6번, 8번 문장","s":[[6,"If its bark is cut, thick red liquid comes out.","나무껍질이 베이면, 걸쭉한 붉은 액체가 나온다."],[8,"The red sap hardens and protects wounds on the bark.","붉은 수액은 굳어서 나무껍질의 상처를 보호한다."]]},"h":"a4a1e1f90a"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt also has special chemicals that help the tree fight germs and keep insects away.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 또한 나무가 세균과 싸우고 곤충을 쫓아내도록 돕는 특별한 화학 물질도 가지고 있다.","opts":["붉은 수액","소코트라 섬","나무의 뿌리","건조한 기후"],"pron":"It","r":{"a":"1) 붉은 수액","ev":"8~9번 문장","s":[[8,"The red sap hardens and protects wounds on the bark.","붉은 수액은 굳어서 나무껍질의 상처를 보호한다."],[9,"It also has special chemicals that help the tree fight germs and keep insects away.","그것은 또한 나무가 세균과 싸우고 곤충을 쫓아내도록 돕는 특별한 화학 물질도 가지고 있다."]],"w":"8번에서 붉은 수액이 굳어서 상처를 보호한다고 함. 9번의 It은 이 붉은 수액을 가리킴. 수액에는 나무가 세균과 싸우고 곤충을 쫓아내도록 돕는 화학 물질이 있다는 뜻.","c":1,"k":"It = 붉은 수액"},"h":"29448b0c93"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This strange shape is a clever survival trick in the dry climate.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 이상한 모양은 건조한 기후에서 살아남기 위한 영리한 요령이다.","opts":["이 이상한 모양은 습한 기후에서 자라려고 생긴 것이다.","이 이상한 모양 때문에 나무가 더 건조해진다.","이 이상한 모양은 건조한 기후에서 나무가 살아남도록 돕는 영리한 방법이다.","이 이상한 모양은 사람들의 눈길을 끌려는 것이다."],"r":{"a":"3) 이 이상한 모양은 건조한 기후에서 나무가 살아남도록 돕는 영리한 방법이다.","w":"3번의 clever survival trick은 살아남기 위한 영리한 요령. 4번에서 그 모양이 비와 안개의 물을 모아 뿌리로 보낸다고 설명함. 습한 기후나 눈길 끌기는 본문에 없음.","c":3,"ev":"3~4번 문장","s":[[3,"This strange shape is a clever survival trick in the dry climate.","이 이상한 모양은 건조한 기후에서 살아남기 위한 영리한 요령이다."],[4,"It helps the tree catch water from rain and fog and carry it to the roots.","그것은 나무가 비와 안개에서 물을 모아 뿌리로 운반하도록 돕는다."]]},"h":"1d44787d57"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["The tree gets its name from its white flowers.","People named the tree the Dragon’s Blood Tree because its sap looks like blood.","The tree gets water only from the sea.","The sap of the tree makes insects come closer."],"oko":["이 나무의 이름은 하얀 꽃에서 왔다.","수액이 피처럼 보여서 사람들은 이 나무를 용혈수라고 이름 붙였다.","이 나무는 바다에서만 물을 얻는다.","나무의 수액은 곤충을 가까이 오게 한다."],"r":{"a":"2) People named the tree the Dragon’s Blood Tree because its sap looks like blood. (수액이 피처럼 보여서 사람들은 이 나무를 용혈수라고 이름 붙였다.)","ev":"7번 문장","s":[[7,"Because this sap looks like blood, people named it the Dragon’s Blood Tree.","이 수액이 피처럼 보이기 때문에, 사람들은 그것을 '용혈수'라고 이름 붙였다."]],"w":"7번에 Because this sap looks like blood, people named it the Dragon’s Blood Tree라고 나옴. ①은 하얀 꽃이 아니라 수액 때문이라서 반대, ③은 4번에서 비와 안개에서 물을 모은다고 해서 반대, ④는 9번에서 곤충을 쫓아낸다고 해서 반대.","c":2},"h":"742875a5da"},{"n":9,"t":"sum","q":"The red sap (A) and (B) wounds on the bark.","ko":"붉은 수액은 (A) 나무껍질의 상처를 (B).","opts":["(A) hardens / (B) protects","(A) hardens / (B) opens","(A) melts / (B) protects","(A) melts / (B) opens","(A) disappears / (B) hurts"],"oko":["(A) 굳고 / (B) 보호한다","(A) 굳고 / (B) 연다","(A) 녹고 / (B) 보호한다","(A) 녹고 / (B) 연다","(A) 사라지고 / (B) 해친다"],"r":{"a":"1) (A) hardens / (B) protects ((A) 굳고 / (B) 보호한다)","ev":"8번 문장","s":[[8,"The red sap hardens and protects wounds on the bark.","붉은 수액은 굳어서 나무껍질의 상처를 보호한다."]],"w":"8번 문장에 The red sap hardens and protects wounds on the bark라고 나옴. 그래서 hardens와 protects.","c":1},"h":"03bab66c0e"},{"n":10,"t":"fill","q":"This tree is also known for its incredible [A]. Many Dragon’s Blood Trees are hundreds of years [B].","ko":"이 나무는 놀라운 [A]로도 알려져 있다. 많은 용혈수는 수백 년 [B].","bank":["age","old","tall","wide","dry","red"],"bko":{"age":"나이","old":"된","tall":"키가 큰","wide":"넓은","dry":"건조한","red":"붉은"},"r":{"a":"[A] age, [B] old","w":"10번 known for its incredible age와 11번 hundreds of years old에서 가져옴. tall, wide, dry, red는 본문에 나오지만 이 빈칸에는 뜻이나 문법이 맞지 않음.","c":null,"ev":"10~11번 문장","s":[[10,"This tree is also known for its incredible age.","이 나무는 놀라운 나이로도 알려져 있다."],[11,"Many Dragon’s Blood Trees are hundreds of years old.","많은 용혈수는 수백 년이 되었다."]]},"h":"6d06a66152"}]},{"u":8,"id":"b2-08-3","no":3,"ko":"숲속에 숨은 인터넷, 우드 와이드 웹","items":[{"n":1,"t":"tf","q":"Scientists call the underground fungi network the “wood wide web.”","ko":"과학자들은 땅속 곰팡이 네트워크를 '우드 와이드 웹'이라고 부른다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장 Scientists call it the “wood wide web.”와 같은 내용. it은 2번의 곰팡이 네트워크.","c":"T","ev":"3번 문장","s":[[3,"Scientists call it the “wood wide web.”","과학자들은 그것을 '우드 와이드 웹'이라고 부른다."]]},"h":"8f06964172"},{"n":2,"t":"tf","q":"We can easily see this network with our eyes.","ko":"우리는 이 네트워크를 눈으로 쉽게 볼 수 있다.",
