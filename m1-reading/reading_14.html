. They're making healthy and delicious snacks, and they will tell us about them.","Bella","Ciao, I'm Bella from Italy. I'm making caprese skewers. Anyone can make these. You just need mozzarella cheese, cherry tomatoes, and basil leaves. Just put them on skewers, and they'll become healthy snacks. Caprese skewers are low in calories, so I often eat them as a light snack.","Mina","Hi, I'm Mina from Korea, and I'm baking tofu chips. Unlike other chips, my tofu chips are healthy. Why? I don't fry my chips but bake them. I don't use any flour, either. I use only tofu. Eat the tofu chips with honey or garlic powder. They'll taste good.","Miguel","Hello, everyone. I'm Miguel from Brazil. I'm making an acai bowl right now. It's a thick acai berry smoothie in a bowl. You can add other healthy foods like nuts and bananas, and it'll taste really good. Acai berries are a superfood, and people all over the world enjoy them.","Bella","Miguel"];var PASS_KO=["여러분을 위한 건강하고 맛있는 간식","프로그램 진행자","안녕하세요, 여러분! Teens' Kitchen에 오신 것을 환영합니다. 오늘 세 명의 십 대 요리사들이 쇼에 나옵니다. 그들은 건강하고 맛있는 간식들을 만들고 있고, 우리에게 그것들에 대해 이야기해 줄 것입니다.","안녕하세요, 저는 이탈리아에서 온 Bella입니다. 저는 카프레제 꼬치를 만들고 있어요. 누구나 이것을 만들 수 있어요. 모차렐라치즈, 방울토마토, 그리고 바질 잎만 있으면 돼요. 그것들을 꼬치에 꽂기만 하면, 건강한 간식이 될 거예요. 카프레제 꼬치는 열량이 낮아서 저는 가벼운 간식으로 그것들을 자주 먹어요.","안녕하세요, 저는 한국에서 온 미나이고, 두부칩을 굽고 있어요. 다른 칩들과는 다르게, 제 두부칩은 건강에 좋아요. 왜냐고요? 저는 칩을 튀기지 않고 굽거든요. 저는 밀가루도 사용하지 않아요. 두부만 사용해요. 두부칩을 꿀이나 마늘 가루와 같이 먹어 보세요. 맛이 좋을 거예요.","안녕하세요, 여러분. 저는 브라질에서 온 Miguel입니다. 저는 지금 아사이 볼을 만들고 있어요. 그것은 그릇에 담긴 걸쭉한 아사이베리 스무디예요. 여러분은 견과류와 바나나 같은 건강에 좋은 다른 식품을 추가할 수 있는데, 그러면 맛이 아주 좋을 거예요. 아사이베리는 슈퍼 푸드이고 전 세계 사람들이 그것을 즐겨 먹어요."];var DG=[{"dlg":[["M","Can I help you?","도와드릴까요?"],["G","Yes, I’d like to take some badminton lessons.","네, 배드민턴 수업을 좀 듣고 싶어요."],["M","Are you a beginner?","초보자인가요?"],["G","Yes, I am.","네, 맞아요."],["M","OK. How often do you want to take lessons?","알겠어요. 수업을 얼마나 자주 듣고 싶나요?"],["G","Two times a week, but I can only come after 5 p.m.","일주일에 두 번이요, 하지만 저는 오후 5시 이후에만 올 수 있어
