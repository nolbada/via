<script>
var D=[{"n":1,"tag":null,"en":"My name is Yubin. My father and mother is computer engineers.","ko":"내 이름은 유빈이야. 나의 아빠와 엄마는 컴퓨터 엔지니어야.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[8],"point":"주어와 동사의 수일치: 주어 My father and mother는 복수: are (is 아님)","topic":"주어와 동사의 수일치","memo":"주어 My father and mother는 복수: are (is 아님)"}]},{"n":2,"tag":null,"en":"My mother fell in love with he when she worked in India. Yes, my father is Indian.","ko":"나의 엄마는 인도에서 일할 때 아빠와 사랑에 빠졌어. 맞아, 나의 아빠는 인도 사람이야.","ok":false,"foot":[],"fixes":[{"wrong":"he","right":"him","partial":false,"at":[6],"point":"인칭대명사의 목적격: 전치사 with 뒤에는 목적격 him 사용","topic":"인칭대명사의 목적격","memo":"전치사 with 뒤에는 목적격 him 사용"}]},{"n":3,"tag":null,"en":"We're a family of three. We have much family traditions.","ko":"우리는 세 식구야. 우리에게는 두 가지 가족 전통이 있어.","ok":false,"foot":[],"fixes":[{"wrong":"much","right":"two","partial":false,"at":[7],"point":"수량 형용사 many/much: traditions는 복수이므로 two(또는 many) 사용, much 아님","topic":"수량 형용사 many/much","memo":"traditions는 복수이므로 two(또는 many) 사용, much 아님"}]},{"n":4,"tag":null,"en":"Every spring, we visits the city's baseball park in the KBO's opening day. It's a exciting day.","ko":"매년 봄, 우리는 KBO 개막식 날에 시 야구장을 방문해. 신나는 날이지.","ok":false,"foot":[],"fixes":[{"wrong":"visits","right":"visit","partial":false,"at":[3],"point":"주어와 동사의 수일치: 주어 we에는 동사원형 visit 사용","topic":"주어와 동사의 수일치","memo":"주어 we에는 동사원형 visit 사용"},{"wrong":"in","right":"on","partial":false,"at":[8],"point":"기본전치사: 특정한 날 앞에는 전치사 on 사용","topic":"기본전치사","memo":"특정한 날 앞에는 전치사 on 사용"},{"wrong":"a","right":"an","partial":false,"at":[14],"point":"관사 a/an: 자음 소리 앞이 아니라 모음 소리 exciting 앞이므로 an 사용","topic":"관사 a/an","memo":"자음 소리 앞이 아니라 모음 소리 exciting 앞이므로 an 사용"}]},{"n":5,"tag":null,"en":"We wear our team's uniform and cheer for them loud. We like to take pictures at the gates.","ko":"우리는 우리 팀의 유니폼을 입고 큰 소리로 그들을 응원해. 우리는 입구에서 사진 찍는 것을 좋아해.","ok":false,"foot":[],"fixes":[{"wrong":"loud","right":"loudly","partial":false,"a er dinner, we play pachisi. It's a traditional board game in India. My father played it when he was young. Last year, I lost the game and did the dishes. I really want to win this year!","Family traditions create wonderful memories. I love my family traditions and hope to keep them for a long time."];var PASS_KO=["나의 가족 전통","내 이름은 유빈이야. 나의 아빠와 엄마는 컴퓨터 엔지니어야. 나의 엄마는 인도에서 일할 때 아빠와 사랑에 빠졌어. 맞아, 나의 아빠는 인도 사람이야. 우리는 세 식구야. 우리에게는 두 가지 가족 전통이 있어.","매년 봄, 우리는 KBO 개막식 날에 시 야구장을 방문해. 신나는 날이지. 우리는 우리 팀의 유니폼을 입고 큰 소리로 그들을 응원해. 우리는 입구에서 사진 찍는 것을 좋아해. 우리가 그 야구장을 처음으로 방문했을 때 나는 네 살이었어.","내 아빠의 생일은 가을에 있어. 우리는 그의 생일에 특별한 것들을 해. 저녁에 우리는 함께 인도식 치킨카레를 요리해. 그것은 그가 가장 좋아하는 요리야. 우리는 인도에 계신 할머니에게서 특별한 카레 파우더를 받아. 그것은 진짜 인도의 맛을 가지고 있어. 우리는 모두 따뜻하고 맛있는 카레 한 그릇을 사랑해.","저녁 식사 후에 우리는 파치시를 해. 그것은 인도의 전통 보드게임이야. 나의 아빠는 어렸을 때 그것을 했었어. 작년에 나는 게임에서 져서 설거지했어. 나는 올해 정말로 이기고 싶어!","가족 전통은 훌륭한 추억을 만들어. 나는 나의 가족 전통을 사랑하고 그것들을 오랫동안 유지하면 좋겠어."];var DG=[{"qs":[{"n":1,"q":"Why does Emma need help?","o":["새 컴퓨터를 사야해서","그녀의 컴퓨터를 잃어버려서","컴퓨터 수리점을 찾을 수 없어서","그녀의 컴퓨터가 작동하지 않아서","컴퓨터 수리점의 전화번호를 몰라서"],"a":3,"ans":"그녀의 컴퓨터가 작동하지 않아서","evs":[["A: My computer isn't working. Can you fix it, please?","내 컴퓨터가 작동하지 않아. 그것을 고쳐 줄 수 있니?"]],"ev":["A: My computer isn't working. Can you fix it, please?","내 컴퓨터가 작동하지 않아. 그것을 고쳐 줄 수 있니?"],"ow":["오답 ✕ — 대화에서 Emma는 새 컴퓨터를 사고 싶다고 말하지 않았다. 'My computer isn't working.'(내 컴퓨터가 작동하지 않아.)라고 했으므로 틀림.","오답 ✕ — 컴퓨터를 잃어버렸다는 말은 없고 'My computer isn't working.'(내 컴퓨터가 작동하지 않아.)라고 했다. 컴퓨터는 있지만 작동하지 않는 것이라서 틀림.","오답 ✕ — 수리점을 찾을 수 없다는 말은 없다. 오히려 B가 'Let's take it to the repair shop.'(그것을 수리점에 가져가 보자.)라고 제안한다. 그래서 틀림.","정답 ○ — Emma가 'My computer isn't working. Can you fix it, please?'(내 컴퓨터가 작동하지 않아. 그것을 고쳐 줄 수 있니?)라고 도움을 청하므로 컴퓨터가 작동하지 않아서이다.","오답 ✕ — 수리점 전화번호에 대한 언급은 없다. 'My computer isn't working.'(내 컴퓨터가 작동하지 않아.)가 도움이 필요한 이유이므로 틀림."],"memo":["정답 ④: Emma의 컴퓨터가 작동하지 않아서 도움이 필요하다.","근거: My computer isn't working.(내 컴퓨터가 작동하지 않아.)","함정: ③ 수리점은 B가 먼저 제안하는 곳이라 ✕"],"why":"Emma의 컴퓨터가 작동하지 않아서 도움을 요청한다."},{"n":2,"q":"다음은 위 대화를 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["fix - repair shop","buy - bookstore","fix - hospital","clean - repair shop","sell - library"],"a":0,"ans":"fix - repair shop","evs":[["A: My computer isn't working. Can you fix it, please?","내 컴퓨터가 작동하지 않아. 그것을 고쳐 줄 수 있니?"],["B: I'm sorry, but I can't. Let's take it to the repair shop.","미안하지만 못 고쳐. 그것을 수리점에 가져가 보자."]],"ev":["A: My computer isn't working. Can you fix it, please?","내 컴퓨터가 작동하지 않아. 그것을 고쳐 줄 수 있니?"],"ow":["정답 ○ — Emma가 'Can you fix it, please?'(그것을 고쳐 줄 수 있니?)라고 했으므로 (A)는 fix이고, B가 'Let's take it to the repair shop.'(그것을 수리점에 가져가 보자.)라고 했으므로 (B)는 repair shop이다.","오답 ✕ — Emma가 컴퓨터를 사 달라고(buy) 한 것이 아니라 'Can you fix it, please?'(그것을 고쳐 줄 수 있니?)라고 했다. 서점(bookstore)에 대한 언급도 없다.","오답 ✕ — fix는 맞지만, B가 가자고 한 곳은 병원이 아니라 'the repair shop'(수리점)이다.","오답 ✕ — repair shop은 맞지만, Emma가 부탁한 것은 청소(clean)가 아니라 'Can you fix it, please?'(그것을 고쳐 줄 수 있니?)이다.","오답 ✕ — 컴퓨터를 팔자(sell)는 말은 없고, 도서관(library)도 나오지 않는다. 'Let's take it to the repair shop.'(그것을 수리점에 가져가 보자.)이므로 틀림."],"memo":["정답 fix - repair shop: 컴퓨터를 고쳐 달라고 부탁했지만 수리점에 가져가 보자고 한다.","근거: Can you fix it, please?(그것을 고쳐 줄 수 있니?) / Let's take it to the repair shop.(그것을 수리점에 가져가 보자.)","함정: 수리점이 가는 곳이지 병원·도서관이 아니다 ✕"],"why":"고쳐 달라는 부탁에 B는 수리점에 가져가 보자고 답한다.","sum":"Emma asks B to (A)______ her computer, but B says they should take it to the (B)______.","lab":"완성된 요약문 : "}],"dlg":[["A","I need your help.","나 네 도움이 필요해."],["B","What is it, Emma?","무슨 일이야, Emma?"],["A","My computer isn't working. Can you fix it, please?","내 컴퓨터가 작동하지 않아. 그것을 고쳐 줄 수 있니?"],["B","I'm sorry, but I can't. Let's take it to the repair shop.","미안하지만 못 고쳐. 그것을 수리점에 가져가 보자."],["A","All right.","좋아."]]},{"qs":[{"n":3,"q":"What is Uncle John doing?","o":["He is planting chilies.","He is making a basket.","He is looking for a basket.","He is working in the garden.","He is cleaning up the garden."],"a":3,"ans":"He is working in the garden.","evs":[["M: Hey, Lucy. I'm picking some chilies.","안녕, Lucy. 고추를 좀 따고 있단다."],["G: Uncle John, what are you doing in the garden?","John 삼촌, 정원에서 뭐 하고 계세요?"]],"ev":["M: Hey, Lucy. I'm picking some chilies.","안녕, Lucy. 고추를 좀 따고 있단다."],"ow":["오답 ✕ — 고추를 심는(plant) 것이 아니라 'I'm picking some chilies.'(고추를 좀 따고 있단다.)라고 했다. 따는 것과 심는 것은 다르므로 틀림.","오답 ✕ — 바구니를 만든다는 말은 없다. 바구니는 Lucy가 'I'll get a basket.'(제가 바구니를 가져올게요.)라고 한 것뿐이라 틀림.","오답 ✕ — 바구니를 찾고 있는 사람도 없다. Lucy가 'I'll get a basket.'(제가 바구니를 가져올게요.)이라고 했을 뿐이라 틀림.","정답 ○ — Lucy가 'what are you doing in the garden?'(정원에서 뭐 하고 계세요?)이라고 묻자 'I'm picking some chilies.'(고추를 좀 따고 있단다.)라고 답했으므로 정원에서 일하고 있다.","오답 ✕ — 정원을 청소한다는 말은 없다. 'I'm picking some chilies.'(고추를 좀 따고 있단다.)라고 했으므로 틀림."],"memo":["정답 ④: John 삼촌은 정원에서 일하고 있다(고추를 따는 중).","근거: I'm picking some chilies.(고추를 좀 따고 있단다.)","함정: ① plant(심다)가 아니라 pick(따다) ✕"],"why":"John 삼촌은 정원에서 고추를 따고 있다."},{"n":4,"q":"위 대화의 주제로 알맞은 것은?","o":["정원 일의 어려움","정원 일에 필요한 도구들","정원에서 작물을 따는 방법","정원 일에 대한 도움 제안과 요청","정원에서 기를 수 있는 작물 종류"],"a":3,"ans":"정원 일에 대한 도움 제안과 요청","evs":[["G: Oh, do you need any help?","아, 도움이 필요하세요?"],["M: Yes, I do. Can you pick some tomatoes?","응, 필요해. 토마토를 좀 따 줄 수 있겠니?"]],"ev":["G: Oh, do you need any help?","아, 도움이 필요하세요?"],"ow":["오답 ✕ — 정원 일이 어렵다는 말은 대화에 없다. 'Oh, do you need any help?'(도움이 필요하세요?)처럼 도움을 주고받는 내용이라 틀림.","오답 ✕ — 도구에 대한 이야기는 없고, Lucy가 'I'll get a basket.'(제가 바구니를 가져올게요.)이라고 한 정도뿐이라 주제로는 너무 좁아서 틀림.","오답 ✕ — 작물을 따는 방법을 설명하는 부분이 없다. 'Can you pick some tomatoes?'(토마토를 좀 따 줄 수 있겠니?)는 방법이 아니라 부탁이라서 틀림.","정답 ○ — Lucy가 'do you need any help?'(도움이 필요하세요?)라고 제안하고 John 삼촌이 'Can you pick some tomatoes?'(토마토를 좀 따 줄 수 있겠니?)라고 요청하므로 도움 제안과 요청이 주제이다.","오답 ✕ — 정원에서 기를 수 있는 작물 종류를 소개하는 대화가 아니다. 고추와 토마토가 나오지만 도움을 주고받는 상황의 일부일 뿐이라 틀림."],"memo":["정답 ④: 정원 일에 대한 도움 제안과 요청","근거: do you need any help?(도움이 필요하세요?) — Can you pick some tomatoes?(토마토를 좀 따 줄 수 있겠니?)","함정: ⑤ 고추·토마토는 소재일 뿐 주제가 아니다 ✕"],"why":"Lucy가 도움을 제안하고 John 삼촌이 토마토 따기를 부탁하는 대화이다."},{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["John 삼촌은 토마토를 심고 있다.","Lucy가 John 삼촌에게 먼저 도움을 요청  틀림.","오답 ✕ — 본문에는 'Yes, my father is Indian.'(맞아, 나의 아빠는 인도 사람이야.)라고 했는데, 이 보기는 한국 사람이라고 해서 틀림.","오답 ✕ — 본문에는 'We're a family of three.'(우리는 세 식구야.)라고 했는데, 이 보기는 네 식구라고 해서 틀림.","정답 ○ — 'My mother fell in love with him when she worked in India.'(나의 엄마는 인도에서 일할 때 아빠와 사랑에 빠졌어.)라고 했으므로 맞다.","오답 ✕ — 본문에는 'We have two family traditions.'(우리에게는 두 가지 가족 전통이 있어.)라고 했는데, 이 보기는 세 가지라고 해서 틀림."],"memo":["정답 ④: 유빈이의 엄마는 인도에서 일할 때 아빠와 사랑에 빠졌다.","근거: My mother fell in love with him when she worked in India.(나의 엄마는 인도에서 일할 때 아빠와 사랑에 빠졌어.)","함정: 세 식구(three), 가족 전통은 두 가지(two) — 숫자 함정 ✕"],"why":"유빈이의 엄마는 인도에서 일하다가 인도 사람인 아빠와 사랑에 빠졌다."}],"pp":[["My name is Yubin.","내 이름은 유빈이야."],["My father and mother are computer engineers.","나의 아빠와 엄마는 컴퓨터 엔지니어야."],["My mother fell in love with him when she worked in India.","나의 엄마는 인도에서 일할 때 아빠와 사랑에 빠졌어."],["Yes, my father is Indian.","맞아, 나의 아빠는 인도 사람이야."],["We're a family of three.","우리는 세 식구야."],["We have two family traditions.","우리에게는 두 가지 가족 전통이 있어."]]},{"qs":[{"n":7,"q":"윗글의 내용과 일치하는 것은?","o":["유빈이는 2년마다 야구장에 간다.","유빈이는 KBO 개막식 날에 긴장한다.","유빈이는 응원하는 팀의 유니폼이 없다.","유빈이는 입구에서 사진을 찍는다.","유빈이는 네 살 되기 전에 처음으로 야구장에 갔다."],"a":3,"ans":"유빈이는 입구에서 사진을 찍는다.","evs":[["We like to take pictures at the gates.","우리는 입구에서 사진 찍는 것을 좋아해."],["It's an exciting day.","신나는 날이지."]],"ev":["We like to take pictures at the gates.","우리는 입구에서 사진 찍는 것을 좋아해."],"ow":["오답 ✕ — 본문에는 'Every spring, we visit the city's baseball park'(매년 봄, 우리는 시 야구장을 방문해.)라고 했는데, 이 보기는 2년마다 간다고 해서 틀림.","오답 ✕ — 본문에는 'It's an exciting day.'(신나는 날이지.)라고 했는데, 이 보기는 긴장한다고 해서 틀림. 개막식 날은 신나는 날이다.","오답 ✕ — 본문에는 'We wear our team's uniform'(우리는 우리 팀의 유니폼을 입고)이라고 했는데, 이 보기는 유니폼이 없다고 해서 틀림.","정답 ○ — 'We like to take pictures at the gates.'(우리는 입구에서 사진 찍는 것을 좋아해.)라고 했으므로 입구에서 사진을 찍는다는 보기가 맞다.","오답 ✕ — 본문에는 'When we visited the park for the first time, I was four years old.'(그 야구장을 처음으로 방문했을 때 나는 네 살이었어.)라고 했는데, 이 보기는 네 살 되기 전이라고 해서 틀림."],"memo":["정답 ④: 유빈이는 입구에서 사진을 찍는다.","근거: We like to take pictures at the gates.(우리는 입구에서 사진 찍는 것을 좋아해.)","함정: ⑤ 처음 방문했을 때 '네 살'이었지, 네 살 '이전'이 아니다 ✕"],"why":"유빈이네 가족은 KBO 개막식 날 야구장 입구에서 사진을 찍는다."}],"pp":[["Every spring, we visit the city's baseball park on the KBO's opening day.","매년 봄, 우리는 KBO 개막식 날에 시 야구장을 방문해."],["It's an exciting day.","신나는 날이지."],["We wear our team's uniform and cheer for them loudly.","우리는 우리 팀의 유니폼을 입고 큰 소리로 그들을 응원해."],["We like to take pictures at the gates.","우리는 입구에서 사진 찍는 것을 좋아해."],["When we visited the park for the first time, I was four years old.","우리가 그 야구장을 처음으로 방문했을 때 나는 네 살이었어."]]},{"qs":[{"n":8,"q":"윗글의 주제로 알맞은 것은?","o":["인도의 전통 음식인 카레","카레를 맛있게 만드는 방법","내가 제일 좋아하는 카레 종류","아빠 생일을 위한 우리의 선물","우리가 아빠 생일에 먹는 음식"],"a":4,"ans":"우리가 아빠 생일에 먹는 음식","evs":[["My father's birthday is in the fall.","내 아빠의 생일은 가을에 있어."],["In the evening, we cook Indian chicken curry together.","저녁에 우리는 함께 인도식 치킨카레를 요리해."]],"ev":["My father's birthday is in the fall.","내 아빠의 생일은 가을에 있어."],"ow":["오답 ✕ — 본문에는 'Indian chicken curry'(인도식 치킨카레)가 나오지만 카레의 유래를 설명하는 글이 아니다. 아빠 생일에 함께 카레를 요리한다는 내용이 중심이라 틀림.","오답 ✕ — 본문에는 'we cook Indian chicken curry together'(우리는 함께 인도식 치킨카레를 요리해)라고만 했고 카레를 맛있게 만드는 방법을 설명하지 않는다. 그래서 틀림.","오답 ✕ — 카레 종류를 비교하며 가장 좋아하는 것을 고르는 글이 아니다. 'It's his favorite dish.'(그것은 그가 가장 좋아하는 요리야.)에서 가장 좋아하는 사람도 글쓴이가 아니라 아빠라서 틀림.","오답 ✕ — 아빠 생일 선물에 대한 내용은 없다. 'We do special things on his birthday.'(우리는 그의 생일에 특별한 것들을 해.)에서 특별한 일은 함께 카레를 요리하는 것이라 틀림.","정답 ○ — 'My father's birthday is in the fall.'(내 아빠의 생일은 가을에 있어.)이고 'we cook Indian chicken curry together'(우리는 함께 인도식 치킨카레를 요리해)라고 했으므로 아빠 생일에 먹는 음식이 주제이다."],"memo":["정답 ⑤: 우리가 아빠 생일에 먹는 음식(카레)","근거: In the evening, we cook Indian chicken curry together.(저녁에 우리는 함께 인도식 치킨카레를 요리해.)","함정: ② 요리 방법 설명은 없고, ④ 선물 이야기도 없다 ✕"],"why":"아빠의 생일에 온 가족이 인도식 치킨카레를 함께 요리해 먹는다."}],"pp":[["My father's birthday is in the fall.","내 아빠의 생일은 가을에 있어."],["We do special things on his birthday.","우리는 그의 생일에 특별한 것들을 해."],["In the evening, we cook Indian chicken curry together.","저녁에 우리는 함께 인도식 치킨카레를 요리해."],["It 임에서 져서 설거지했어."],"ow":["정답 ○ — 'Last year, I lost the game and did the dishes.'(작년에 나는 게임에서 져서 설거지했어.)이므로 (A)는 lost이고, 'I really want to win this year!'(나는 올해 정말로 이기고 싶어!)이므로 (B)는 win이다.","오답 ✕ — win은 맞지만, 작년에 이겼다면 설거지를 하지 않았을 것이다. 'I lost the game and did the dishes.'(게임에서 져서 설거지했어.)라고 했으므로 won은 틀림.","오답 ✕ — lost는 맞지만, 올해 하고 싶은 것은 요리(cook)가 아니라 'I really want to win this year!'(나는 올해 정말로 이기고 싶어!)이다.","오답 ✕ — 'After dinner, we play pachisi.'(저녁 식사 후에 우리는 파치시를 해.)라고 했으므로 게임에 빠진 것(skipped)이 아니라 졌다. 또 게임에 참여하고(join) 싶다는 말도 없다.","오답 ✕ — 작년에 이긴 것(won)이 아니라 'I lost the game'(게임에서 졌어)이고, 올해 쉬고(rest) 싶다는 말도 없어 틀림."],"memo":["정답 lost - win: 작년에는 졌고(lost) 올해는 이기고(win) 싶다.","근거: Last year, I lost the game and did the dishes.(작년에 나는 게임에서 져서 설거지했어.) / I really want to win this year!(나는 올해 정말로 이기고 싶어!)","함정: 이겼다면(won) 설거지를 하지 않았을 것 ✕"],"why":"작년에 파치시에서 져서 설거지한 유빈이는 올해 이기고 싶어 한다.","sum":"Last year, Yubin (A)______ the pachisi game and did the dishes, but this year she really wants to (B)______.","lab":"완성된 요약문 : "}],"pp":[["After dinner, we play pachisi.","저녁 식사 후에 우리는 파치시를 해."],["It's a traditional board game in India.","그것은 인도의 전통 보드게임이야."],["My father played it when he was young.","나의 아빠는 어렸을 때 그것을 했었어."],["Last year, I lost the game and did the dishes.","작년에 나는 게임에서 져서 설거지했어."],["I really want to win this year!","나는 올해 정말로 이기고 싶어!"],["Family traditions create wonderful memories.","가족 전통은 훌륭한 추억을 만들어."],["I love my family traditions and hope to keep them for a long time.","나는 나의 가족 전통을 사랑하고 그것들을 오랫동안 유지하면 좋겠어."]]}];

function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}

  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}

function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});

 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});

function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}

   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
