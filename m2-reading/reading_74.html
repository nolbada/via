<script>
var D=[{"n": 1, "tag": "Time Travel 사무실", "en": "Eckels walked into the office of Time Travel. The big sign on the wall said, “NAME ANY YEAR IN THE PAST. WE TAKE YOU THERE.” There were a TV on the wall, and Mr. Keith, the new president, was on the news.", "ko": "Eckels는 Time Travel의 사무실로 걸어 들어갔다. 벽에 걸린 큰 간판에는 “과거의 어느 연도든 말씀하세요. 우리가 당신을 그곳으로 모시겠습니다.”라고 쓰여 있었다. 벽에는 TV가 있었고, 새 대통령인 Keith 씨가 뉴스에 나오고 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [26], "point": "There be 구문의 수일치: 뒤의 a TV가 단수라 was", "topic": "There be 구문의 수일치", "memo": "뒤의 a TV가 단수라 was"}]}, {"n": 2, "tag": null, "en": "“How can we help you?” said Mr. Parker, the founder of Time Travel. “I've always want to see a dinosaur. Is it possible?” asked Eckels.", "ko": "“무엇을 도와드릴까요?” Time Travel의 설립자인 Parker 씨가 말했다. “저는 항상 공룡을 보고 싶었어요. 가능한가요?” Eckels가 물었다.", "ok": false, "foot": [], "fixes": [{"wrong": "want", "right": "wanted", "partial": false, "at": [15], "point": "현재완료: have + 과거분사 wanted", "topic": "현재완료", "memo": "have + 과거분사 wanted"}]}, {"n": 3, "tag": null, "en": "“Sure,” said Mr. Parker. “We can take you back to the jungle of 60 million years ago.” “Great,” said Eckels. “Can you take me there now?”", "ko": "“물론이죠.” Parker 씨가 대답했다. “당신을 6천만 년 전의 정글로 데려다줄 수 있습니다.” “멋지군요.” Eckels가 말했다. “지금 저를 그곳에 데려가 줄 수 있나요?”", "ok": true, "foot": [], "fixes": []}, {"n": 4, "tag": null, "en": "“You're lucky. There's a time machine that leave in 10 minutes,” said Mr. Parker.", "ko": "“운이 좋으시네요. 10분 후에 출발하는 타임머신이 있습니다.” Parker 씨가 말했다.", "ok": false, "foot": [], "fixes": [{"wrong": "leave", "right": "leaves", "partial": false, "at": [7], "point": "주격 관계대명사절의 수일치: 선행사 a time machine이 단수라 leaves", "topic": "주격 관계대명사절의 수일치", "memo": "선행사 a time machine이 단수라 leaves"}]}, {"n": 5, "tag": null, "en": "“This is Travis, your travel guide,” he continued. “To staying safe, you must follows his instructions.”", "ko": "“이분은 당신의 여행 안내원인 Travis입니다.” 그는 계속 말했다. “안전하려면 그의 지시를 반드시 따라야 합니다.”" ly."];var PASS_KO=["미래를 바꾼 나비 한 마리", "Time Travel의 사무실", "Eckels는 Time Travel의 사무실로 걸어 들어갔다. 벽에 걸린 큰 간판에는 “과거의 어느 연도든 말씀하세요. 우리가 당신을 그곳으로 모시겠습니다.”라고 쓰여 있었다. 벽에는 TV가 있었고, 새 대통령인 Keith 씨가 뉴스에 나오고 있었다. “무엇을 도와드릴까요?” Time Travel의 설립자인 Parker 씨가 말했다. “저는 항상 공룡을 보고 싶었어요. 가능한가요?” Eckels가 물었다. “물론이죠.” Parker 씨가 대답했다. “당신을 6천만 년 전의 정글로 데려다줄 수 있습니다.” “멋지군요.” Eckels가 말했다. “지금 저를 그곳에 데려가 줄 수 있나요?” “운이 좋으시네요. 10분 후에 출발하는 타임머신이 있습니다.” Parker 씨가 말했다. “이분은 당신의 여행 안내원인 Travis입니다.” 그는 계속 말했다. “안전하려면 그의 지시를 반드시 따라야 합니다.” 타임머신 안에는 다른 여행자 두 명이 있었다. Eckels는 자리에 앉아 눈을 감았다. 그는 발밑에서 타임머신이 움직이는 것을 느꼈다. 불과 몇 분 지나지 않아 타임머신이 멈췄다. “우리는 이제 막 6천만 년 전 정글에 도착했습니다.” Travis가 설명했다. “저쪽에 길이 보이십니까? 어떤 경우에도 저 길을 절대 벗어나면 안 됩니다. 아무것도 만지지 마세요. 여러분이 실수로 무언가를 죽일 수도 있습니다. 이곳에서의 작은 변화가 미래에 상상할 수 없는 일을 초래할 수 있습니다.”", "티라노사우루스", "“정말 신나요.” Eckels가 말했다. “조심하세요. 배가 고픈 공룡들도 있습니다.” Travis가 말했다. “침착하세요. 당신이 어리석은 어떤 행동도 하지 않기를 바랍니다.” “걱정하지 마세요. 저는 바보가 아니에요.” Eckels가 말했다. 그들은 모두 길을 걷기 시작했다. 얼마 후, Travis가 속삭였다. “저기 봐요. 티라노사우루스가 있어요.” 100미터 떨어진 곳에서 티라노사우루스가 서서히 나타났다. “저것은,” Eckels가 속삭였다. “저것은 …” “쉿!” “저건 … 거대해요. 저렇게 거대한 것을 본 적이 없어요. 너무 무서워요.” Eckels가 말했다. “쉿 … 조용히!” Travis가 화를 내며 말했다. “공룡이 당신을 보길 원하는 건 아니겠죠.” “숨을 쉴 수가 없어요.” Eckels가 말했다. “여기서 나가게 해 줘요!” “겁먹지 마세요, Eckels.” Travis가 말했다. “뒤로 돌아서 조용히 타임머신으로 돌아가세요.” Eckels는 돌아서서 뛰기 시작했다. 그는 너무 겁에 질려 실수로 길을 벗어나고 말았다. “Eckels!” Travis가 외쳤다. “길을 벗어나지 말아요!” 티라노사우루스가 Travis의 소리를 듣고 그와 다른 여행자들을 향해 고개를 돌렸다. 잠시 정적이 흘렀다. 그리고 갑자기 티라노사우루스가 큰 포효와 함께 그들을 향해 달려오기 시작했다. “모두 뛰어요! 뛰어!” Travis가 외쳤다.", "현재로 돌아오다", "Travis와 다른 여행자들은 안전하게 타임머신으로 돌아와서 안에 있는 Eckels를 발견했다. “당신이 우리 모두를 위험에 빠뜨렸어요.” Travis가 화난 목소리로 Eckels에게 말했다. “당신이 길을 벗어났잖아요.” “미안해요, 그렇지만 난 어떤 것도 죽이지 않았어요.” Eckels가 말했다. “신발에 진흙이 조금 묻었을 뿐이에요.” Travis는 아무 말 없이 Eckels를 오랫동안 응시했다. “집으로 갑시다.” 마침내 Travis가 말했다. 타임머신이 멈췄다. 그들은 모두 안전하게 현재로 돌아왔다. “이곳은 모든 것이 괜찮나요?” Travis가 물었다. “괜찮아요. 돌아오신 것을 환영합니다!” Parker 씨가 말했다. Eckels는 방을 주의 깊게 둘러보았다. 벽에 걸린 큰 간판만 빼고 모든 것이 똑같아 보였다. 간판에는 이제 이렇게 쓰여 있었다. “NAIM ANY YEER EN THE PAST. WEE TAEK YU THAIR.” Eckels는 혼란스러
