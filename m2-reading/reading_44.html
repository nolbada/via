works?", "어떤 거리 예술 작품도 보이지 않나요?", 0], ["Well, look down and look closely.", "그렇다면, 아래를 내려다보고 자세히 살펴보세요.", 0], ["Do you see the little chewing gum paintings?", "작은 껌 그림들이 보이나요?", 0], ["They are by the artist Ben Wilson.", "이것들은 예술가 Ben Wilson의 작품입니다.", 0], ["Wilson is well known for painting pictures on gum that people drop on the street.", "Wilson은 사람들이 길에 버리는 껌에 그림을 그리는 것으로 잘 알려져 있습니다.", 0], ["His gum paintings often carry personal messages from people that he meets on the street.", "그의 껌 그림들은 그가 길에서 만나는 사람들의 개인적인 메시지를 종종 담고 있습니다.", 0], ["For example, the one over here is a happy birthday wish for a loved one.", "예를 들어, 여기 있는 그림은 사랑하는 사람을 위한 생일 축하 메시지입니다.", 0], ["Wilson's gum paintings are tiny, but they give great pleasure to many people.", "Wilson의 껌 그림들은 아주 작지만, 많은 사람들에게 큰 기쁨을 줍니다.", 0]];var RNUM=44;var TITLE_EN="Street Art in London";var PASS_EN=["Street Art in London", "Modern street art comes in many different forms, and it makes cities colorful and lively. Today, we are going to see some well-known street artworks in London.", "The place that we are going to visit is Shoreditch. Poor workers used to live in this area, but now it is one of the hippest areas in London. We can find so many great pieces of street art here. Do you see the painting over there? It is by the artist STIK. He is famous for using only lines and dots in his paintings of human bodies. According to STIK, the three figures represent the past, present, and future of Shoreditch. Which figure represents which? Well, look closely at the eyes of the three figures. They are just dots, but they will give you a clue.", "We are now in Finsbury Park to see a painting by Banksy, an internationally famous street artist. Banksy's artworks often carry social messages, and the green tree you see over there is a good example. As you can see, he created a green tree by spraying green paint on a wall behind a leafless tree. Next to the tree, there is a person who is holding a sprayer. What message does Banksy want to give us through this painting? In many people's opinion, he is telling us that nature is having a hard time. They think he wants us to take better care of it.", "The final stop of our tour today is Muswell Hill. Can't see any street artworks? Well, look down and look closely. Do you see the little chewing gum paintings? They are by the artist Ben Wilson. Wilson is well known for painting pictures on gum that people drop on the street. His gum paintings often carry personal messages from people that he meets on the street. For example, the one over here is a happy birthday wish for a loved one. Wilson's gum paintings are tiny, but they give great pleasure to many people."];var PASS_KO=["런던의 거리 예술", "현대 거리 예술은 여러 다양한 형태로 존재하며, 도시를 다채롭고 활기차게 만듭니다. 오늘, 우리는 런던에 있는 몇몇 유명한 거리 예술 작품들을 살펴보겠습니다.", "우리가 방문할 장소는 쇼어디치입니다. 가난한 노동자들이 이 지역에 살았었지만, 지금 이곳은 런던에서 가장 힙한 지역 중 한 곳입니다. 우리는 이곳에서 정말 많은 멋진 거리 예술 작품들을 볼 수 있습니다. 저쪽에 있는 그림이 보이시나요? 그것은 예술가 STIK의 작품입니다. 그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다. STIK에 따르면 저 세 인물은 쇼어디치의 과거, 현재, 그리고 미래를 나타냅니다. 어떤 인물이 어떤 것을 나타낼까요? 자, 세 인물의 눈을 자세히 보세요. 그것들은 그저 점이지만, 그 점들이 여러분에게 단서를 줄 겁니다.", "우리는 이제 국제적으로 유명한 거리 예술가 Banksy의 그림을 보기 위해 핀즈베리 공원에 있습니다. Banksy의 예술 작품들은 종종 사회적 메시지를 담고 있는데, 저쪽에 보이는 초록색 나무가 좋은 예입니다. 보시다시피 그는 잎이 없는 나무 뒤쪽 벽에 초록색 페인트를 뿌려서 초록색 나무를 만들었습니다. 그 나무 옆에는 분무기를 들고 있는 사람이 한 명 있습니다. Banksy는 이 그림을 통해 우리에게 어떤 메시지를 전하고 싶은 걸까요? 많은 사람들의 의견에 따르면, 그는 자연이 힘든 시간을 보내고 있다는 것을 우리에게 말하려는 것 같습니다. 그들은 우리가 자연을 더 잘 보살피기를 Banksy가 원한다고 생각합니다.", "오늘 우리 투어의 마지막 장소는 머스웰 힐입니다. 어떤 거리 예술 작품도 보이지 않나요? 그렇다면, 아래를 내려다보고 자세히 살펴보세요. 작은 껌 그림들이 보이나요? 이것들은 예술가 Ben Wilson의 작품입니다. Wilson은 사람들이 길에 버리는 껌에 그림을 그리는 것으로 잘 알려져 있습니다. 그의 껌 그림들은 그가 길에서 만나는 사람들의 개인적인 메시지를 종종 담고 있습니다. 예를 들어, 여기 있는 그림은 사랑하는 사람을 위한 생일 축하 메시지입니다. Wilson의 껌 그림들은 아주 작지만, 많은 사람들에게 큰 기쁨을 줍니다."];var DG=[{"dlg": [["B", "Somi, I need help. What’s the best way to get to Sebit Park from here?", "소미야, 도움이 필요해. 여기서 세빛 공원까지 가는 가장 좋은 방법이 뭐야?"], ["G", "Sebit Park? Well, you can get there by bus or by subway, but th function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');

  var cls='opt';

  else if(pick[q.n]===i)cls+=' on';

 });

  var ok=pick[q.n]===q.a;

function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';

 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');

 }

function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
