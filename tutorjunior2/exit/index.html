":"4번 문장","s":[[4,"It was awarded to the World Cup winner from 1930 to 1970.","그것은 1930년부터 1970년까지 월드컵 우승자에게 수여되었다."]],"w":"트로피는 월드컵 우승자에게 주어져요. 1번에서도 is given to the winner라고 했으니 awarded = 수여되었다예요.","c":4},"h":"5224580774"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Instead, they get a copy of the trophy.)","ko":"대신에, 그들은 트로피의 ( )을 받는다.","opts":["우승자","규칙","복제품","박물관"],"word":"copy","r":{"a":"3) 복제품","ev":"9~10번 문장","s":[[9,"Now, no team can keep the FIFA World Cup Trophy.","이제 어떤 팀도 FIFA 월드컵 트로피를 보유할 수 없다."],[10,"Instead, they get a copy of the trophy.","대신에, 그들은 트로피의 복제품을 받는다."]],"w":"9번에서 어떤 팀도 FIFA 월드컵 트로피를 보유할 수 없다고 했어요. 그래서 대신 받는 것은 똑같이 만든 복제품이에요.","c":3},"h":"f361806e2c"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nHowever, there was a special rule—if a team won the World Cup three times, they could keep the trophy forever.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그러나 특별한 규칙이 있었다. 만약 한 팀이 월드컵에서 세 번 우승했다면, 그들은 그 트로피를 영원히 보유할 수 있었다.","opts":["다음 우승자","FIFA의 관계자들","월드컵에서 세 번 우승한 팀","월드컵을 보러 온 관중"],"r":{"a":"3) 월드컵에서 세 번 우승한 팀","ev":"6번 문장","s":[[6,"However, there was a special rule—if a team won the World Cup three times, they could keep the trophy forever.","그러나 특별한 규칙이 있었다. 만약 한 팀이 월드컵에서 세 번 우승했다면, 그들은 그 트로피를 영원히 보유할 수 있었다."]],"w":"if a team won the World Cup three times에서 a team이 주어이고, 뒤의 they는 이 팀을 받아요. 세 번 우승한 팀이 트로피를 영원히 가질 수 있었어요.","c":3},"h":"3552f5bf7e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"After this, a new trophy—the FIFA World Cup Trophy—was designed, and the special rule was changed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이후에 새로운 트로피인 FIFA 월드컵 트로피가 고안되었고, 그 특별한 규칙은 바뀌었다.","opts":["FIFA 월드컵 트로피가 먼저 있었고 특별한 규칙은 그대로 유지되었다.","새 트로피 계획은 취소되었고 특별한 규칙도 없어졌다.","브라질의 우승 이후 트로피가 사라졌고 규칙만 남았다.","그 후 새로운 트로피가 만들어졌고 특별한 규칙은 바뀌었다."],"r":{"a":"4) 그 후 새로운 트로피가 만들어졌고 특별한 규칙은 바뀌었다.","ev":"8번 문장","s":[[8,"After this, a new trophy—the FIFA World Cup Trophy—was designed, and the special rule was changed.","이후에 새로운 트로피인 FIFA 월드컵 트로피가 고안되었고, 그 특별한 규칙은 바뀌었다."]],"w":"After this는 브라질이 쥘 리메 트로피를 받은 뒤라는 뜻이에요. was designed는 고안되었다, was changed는 바뀌었다예요.","c":4},"h":"a412b16d06"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["각 우승팀은 쥘 리메 트로피를 4년 동안 가지고 있다가 다음 우승자에게 주었다.","쥘 리메 트로피는 오늘날에도 우승팀에게 주어진다.","브라질은 1970년에 처음으로 월드컵에서 우승했다.","오늘날 팀들은 FIFA 월드컵 트로피를 영원히 보유할 수 있다."],"opts":["Each winning team kept the Jules Rimet Trophy for four years before giving it to the next winner.","The Jules Rimet Trophy is still given to the winner today.","Brazil won the World Cup for the first time in 1970.","Teams today can keep the FIFA World Cup Trophy forever."],"r":{"a":"1) Each winning team kept the Jules Rimet Trophy for four years before giving it to the next winner.","ev":"5, 7, 8, 9번 문장","s":[[5,"Each winning team kept the trophy for four years before giving it to the next winner.","각각의 우승팀은 그 트로피를 다음 우승자에게 주기 전에 4년 동안 가지고 있었다."],[7,"In 1970, Brazil won the World Cup for the third time and was given the Jules Rimet Trophy.","1970년에 브라질이 월드컵에서 세 번째로 우승했고 쥘 리메 트로피를 받았다."],[8,"After this, a new trophy—the FIFA World Cup Trophy—was designed, and the special rule was changed.","이후에 새로운 트로피인 FIFA 월드컵 트로피가 고안되었고, 그 특별한 규칙은 바뀌었다."],[9,"Now, no team can keep the FIFA World Cup Trophy.","이제 어떤 팀도 FIFA 월드컵 트로피를 보유할 수 없다."]],"w":"5번에서 우승팀은 쥘 리메 트로피를 4년 동안 가지고 있다가 다음 우승자에게 줬어요. 1970년이 브라질의 세 번째 우승이고(7번), 쥘 리메 트로피 뒤에 새 트로피가 만들어졌으며(8번), 지금은 어떤 팀도 FIFA 트로피를 보유할 수 없어요(9번).","c":1},"h":"635a999056"},{"n":9,"t":"sum","q":"A team that won the World Cup three times could (A) the Jules Rimet Trophy forever. Brazil did this in 1970, and later the rule was (B).","ko":"월드컵에서 세 번 우승한 팀은 쥘 리메 트로피를 영원히 (A)할 수 있었다. 브라질이 1970년에 그렇게 했고, 나중에 그 규칙은 (B).","oko":["(A) 잃을 / (B) 바뀌었다","(A) 보유할 / (B) 유지되었다","(A) 보유할 / (B) 바뀌었다","(A) 빌릴 / (B) 유지되었다","(A) 잃을 / (B) 유지되었다"],"opts":["(A) lose / (B) changed","(A) keep / (B) kept","(A) keep / (B) changed","(A) borrow / (B) kept","(A) lose / (B) kept"],"r":{"a":"3) (A) keep / (B) changed","ev":"6~8번 문장","s":[[6,"However, there was a special rule—if a team won the World Cup three times, they could keep the trophy forever.","그러나 특별한 규칙이 있었다. 만약 한 팀이 월드컵에서 세 번 우승했다면, 그들은 그 트로피를 영원히 보유할 수 있었다."],[7,"In 1970, Brazil won the World Cup for the third time and was given the Jules Rimet Trophy.","1970년에 브라질이 월드컵에서 세 번째로 우승했고 쥘 리메 트로피를 받았다."],[8,"After this, a new trophy—the FIFA World Cup Trophy—was designed, and the special rule was changed.","이후에 새로운 트로피인 FIFA 월드컵 트로피가 고안되었고, 그 특별한 규칙은 바뀌었다."]],"w":"6번에서 세 번 우승한 팀은 트로피를 영원히 보유(keep)할 수 있었어요. 7번에서 브라질이 1970년에 그렇게 했고, 8번에서 그 규칙은 바뀌었어요(changed).","c":3},"h":"3568f846b0"},{"n":10,"t":"fill","q":"The Jules Rimet Trophy was awarded to the World Cup [A] from 1930 to 1970, and each winning team [B] it for four years before giving it to the next winner.","ko":"쥘 리메 트로피는 1930년부터 1970년까지 월드컵 [A]에게 수여되었고, 각 우승팀은 그것을 다음 우승자에게 주기 전에 4년 동안 [B].","bank":["winner","kept","copy","forever","third","special"],"bko":{"winner":"우승자","kept":"가지고 있었다","copy":"복제품","forever":"영원히","third":"세 번째의","special":"특별한"},"r":{"a":"[A] winner, [B] kept","ev":"4~5번 문장","s":[[4,"It was awarded to the World Cup winner from 1930 to 1970.","그것은 1930년부터 1970년까지 월드컵 우승자에게 수여되었다."],[5,"Each winning team kept the trophy for four years before giving it to the next winner.","각각의 우승팀은 그 트로피를 다음 우승자에게 주기 전에 4년 동안 가지고 있었다."]],"w":"4번의 awarded to the World Cup winner(월드컵 우승자에게 수여되었다)와 5번의 Each winning team kept the trophy for four years(각 우승팀은 4년 동안 가지고 있었다)에서 가져왔어요. [A]에는 사람인 명사, [B]에는 동사가 들어가야 해요.","c":null},"h":"b2fa49ead8"}]},{"u":10,"id":"rj2-10-1","no":1,"ko":"비슷하지만 다른 둘","items":[{"n":1,"t":"tf","q":"The violin and the viola are both stringed instruments in an orchestra.","ko":"바이올린과 비올라는 둘 다 오케스트라의 현악기이다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"The violin and the viola are both orchestral stringed instruments.","바이올린과 비올라는 둘 다 오케스트라의 현악기이다."]],"w":"1번 문장에서 바이올린과 비올라는 둘 다 오케스트라의 현악기(orchestral stringed instruments)라고 해요.","c":"T"},"h":"f17907b4cd"},{"n":2,"t":"tf","q":"A viola is always shorter than a violin.","ko":"비올라는 항상 바이올린보다 짧다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"Most violins are around 35 centimeters long.","대부분의 바이올린은 약 35센티미터 길이이다."],[4,"On the other hand, the viola can be 45 centimeters long.","반면, 비올라는 45센티미터 길이가 될 수 있다."]],"w":"3번에서 바이올린은 대부분 약 35센티미터이고, 4번에서 비올라는 45센티미터까지 될 수 있다고 해요. 항상 더 짧다는 말은 틀려요.","c":"F"},"h":"ea6f9d41f6"},{"n":3,"t":"tf","q":"Violin bows are lighter than viola bows.","ko":"바이올린 활은 비올라 활보다 더 가볍다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Violin bows are lighter than bows for violas.","바이올린 활은 비올라의 활보다 더 가볍다."]],"w":"10번 문장에 Violin bows are lighter than bows for violas가 있어요. 바이올린 활이 더 가볍다는 내용과 맞아요.","c":"T"},"h":"97a51ecbc9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The viola produces a deeper sound than the violin.)","ko":"비올라는 바이올린보다 더 깊은 소리를 ( ).","opts":["만들어 내다","숨기다","줄이다","빌리다"],"word":"produces","r":{"a":"1) 만들어 내다","ev":"7번 문장","s":[[7,"The viola produces a deeper sound than the violin, but not as deep as the cello.","비올라는 바이올린보다 더 깊은 소리를 내지만, 첼로만큼 깊지는 않다."]],"w":"비올라가 소리를 '내는' 내용이에요. 소리를 만들어 낸다는 뜻이므로 produce = 만들어 내다예요.","c":1},"h":"24a6e1cdc7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most violins are around 35 centimeters long.)","ko":"대부분의 바이올린은 ( ) 35센티미터 길이이다.","opts":["정확히","최대","약","최소"],"word":"around","r":{"a":"3) 약","ev":"3번 문장","s":[[3,"Most violins are around 35 centimeters long.","대부분의 바이올린은 약 35센티미터 길이이다."]],"w":"3번은 바이올린 길이가 '약' 35센티미터라는 뜻이에요. around 뒤에 숫자가 오면 '대략, 약'이에요. 4번에서 비올라는 45센티미터까지 될 수 있다고 비교해요.","c":3},"h":"9d56743b81"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHowever, on a viola bow, it has a round shape.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그러나 비올라 활에서 그것은 둥근 모양이다.","opts":["바이올린","비올라","첼로","프로그(손에 잡히는 활의 부분)"],"r":{"a":"4) 프로그(손에 잡히는 활의 부분)","ev":"11~13번 문장","s":[[11,"Furthermore, the part of the bow that is held in the hand, known as the “frog,” is also different.","더욱이, ‘프로그’로 알려진 손에 잡히는 활의 부분도 다르다."],[12,"On a violin bow, the frog is pointy.","바이올린 활에서 프로그는 뾰족하다."],[13,"However, on a viola bow, it has a round shape.","그러나 비올라 활에서 그것은 둥근 모양이다."]],"w":"11번에서 손에 잡히는 활의 부분을 frog라고 한다고 했고, 12번에서 그 모양을 바이올린 활과 설명해요. 13번의 it은 비올라 활의 frog예요.","c":4},"h":"0ce9cd31eb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That places the viola in the middle of the stringed instrument family.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 비올라를 현악기군의 중간에 위치시킨다.","opts":["그 때문에 비올라는 현악기 중 가장 낮은 소리를 내는 악기가 된다.","그 때문에 비올라는 현악기군에 속하지 못한다.","그 때문에 비올라는 현악기 중 가장 높은 소리를 내는 악기가 된다.","그 때문에 비올라는 현악기군에서 중간쯤의 소리를 낸다."],"r":{"a":"4) 그 때문에 비올라는 현악기군에서 중간쯤의 소리를 낸다.","ev":"7~8번 문장","s":[[7,"The viola produces a deeper sound than the violin, but not as deep as the cello.","비올라는 바이올린보다 더 깊은 소리를 내지만, 첼로만큼 깊지는 않다."],[8,"That places the viola in the middle of the stringed instrument family.","그것은 비올라를 현악기군의 중간에 위치시킨다."]],"w":"in the middle of는 '~의 중간에'라는 뜻이에요. 7번에서 비올라는 바이올린보다 깊지만 첼로만큼은 깊지 않으니 현악기군의 중간 위치예요.","c":4},"h":"db90c72d98"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["바이올린은 비올라보다 더 높은 소리를 낸다.","비올라는 첼로만큼 깊은 소리를 낸다.","바이올린 활이 비올라 활보다 더 무겁다.","비올라 활의 프로그는 뾰족하다."],"opts":["The violin makes a higher sound than the viola.","The viola makes a sound as deep as the cello’s.","Violin bows are heavier than viola bows.","The frog of a viola bow is pointy."],"r":{"a":"1) The violin makes a higher sound than the viola.","ev":"6, 7, 10, 13번 문장","s":[[6,"The violin has a very high pitch.","바이올린은 매우 높은 음조를 가지고 있다."],[7,"The viola produces a deeper sound than the violin, but not as deep as the cello.","비올라는 바이올린보다 더 깊은 소리를 내지만, 첼로만큼 깊지는 않다."],[10,"Violin bows are lighter than bows for violas.","바이올린 활은 비올라의 활보다 더 가볍다."],[13,"However, on a viola bow, it has a round shape.","그러나 비올라 활에서 그것은 둥근 모양이다."]],"w":"6번에서 바이올린은 매우 높은 음조를 갖고, 7번에서 비올라는 바이올린보다 더 깊은 소리를 내요. 비올라는 첼로만큼 깊지 않고(7번), 바이올린 활이 더 가벼우며(10번), 비올라 활의 프로그는 둥글어요(13번).","c":1},"h":"aeb932932a"},{"n":9,"t":"sum","q":"The viola is (A) than the violin, and its sound is (B) than the violin’s.","ko":"비올라는 바이올린보다 (A) 그 소리는 바이올린의 소리보다 (B).","oko":["(A) 더 짧고 / (B) 더 깊다","(A) 더 길고 / (B) 더 높다","(A) 더 길고 / (B) 더 깊다","(A) 더 짧고 / (B) 더 높다","(A) 같은 길이이고 / (B) 더 깊다"],"opts":["(A) shorter / (B) deeper","(A) longer / (B) higher","(A) longer / (B) deeper","(A) shorter / (B) higher","(A) as long as / (B) deeper"],"r":{"a":"3) (A) longer / (B) deeper","ev":"3, 4, 7번 문장","s":[[3,"Most violins are around 35 centimeters long.","대부분의 바이올린은 약 35센티미터 길이이다."],[4,"On the other hand, the viola can be 45 centimeters long.","반면, 비올라는 45센티미터 길이가 될 수 있다."],[7,"The viola produces a deeper sound than the violin, but not as deep as the cello.","비올라는 바이올린보다 더 깊은 소리를 내지만, 첼로만큼 깊지는 않다."]],"w":"3~4번에서 바이올린은 약 35센티미터, 비올라는 45센티미터까지 길 수 있어 비올라가 더 길어요(longer). 7번에서 비올라는 바이올린보다 더 깊은(deeper) 소리를 내요.","c":3},"h":"f8da2cc7db"},{"n":10,"t":"fill","q":"The part of the bow that is held in the hand is known as the [A]. On a violin bow, it is [B].","ko":"손에 잡히는 활의 부분은 [A]로 알려져 있다. 바이올린 활에서 그것은 [B].","bank":["frog","pointy","pitch","family","orchestral","deeper"],"bko":{"frog":"프로그(활의 손잡이 부분)","pointy":"뾰족한","pitch":"음의 높이","family":"(같은 종류의) 군","orchestral":"오케스트라의","deeper":"더 깊은"},"r":{"a":"[A] frog, [B] pointy","ev":"11~12번 문장","s":[[11,"Furthermore, the part of the bow that is held in the hand, known as the “frog,” is also different.","더욱이, ‘프로그’로 알려진 손에 잡히는 활의 부분도 다르다."],[12,"On a violin bow, the frog is pointy.","바이올린 활에서 프로그는 뾰족하다."]],"w":"11번에서 손에 잡히는 활의 부분을 known as the “frog”라고 하고, 12번에서 바이올린 활의 frog는 pointy(뾰족하다)고 해요. 나머지 단어는 이 문맥에 맞지 않아요.","c":null},"h":"743e092176"}]},{"u":10,"id":"rj2-10-2","no":2,"ko":"모두 진품이 맞아요","items":[{"n":1,"t":"tf","q":"Claude Monet was a famous French painter.","ko":"클로드 모네는 유명한 프랑스 화가였다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Claude Monet was a famous French painter.","클로드 모네는 유명한 프랑스 화가였다."]],"w":"1번 문장에 Claude Monet was a famous French painter가 그대로 있어요.","c":"T"},"h":"4e74520e66"},{"n":2,"t":"tf","q":"The judge said that only one of the paintings was painted by Monet.","ko":"판사는 그림들 중 하나만 모네가 그린 것이라고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"After he looked at the paintings, he said, “They all were!”","그가 그 그림들을 본 후에, 그는 “그것들 모두입니다!”라고 말했다."]],"w":"8번 문장에서 판사는 \"They all were!\"(그것들 모두입니다!)라고 말해요. 하나만이라는 말은 틀려요.","c":"F"},"h":"07975a3333"},{"n":3,"t":"tf","q":"Monet made about 250 water lily paintings.","ko":"모네는 약 250점의 수련 그림을 그렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"He made about 250 of these water lily paintings!","그는 약 250점의 이 수련 그림들을 그렸다!"]],"w":"11번 문장에 He made about 250 of these water lily paintings가 있어요.","c":"T"},"h":"c78f3fd610"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Here is an interesting story about his paintings.)","ko":"여기에 그의 그림들에 관한 ( ) 이야기가 있다.","opts":["지루한","흥미로운","무서운","어려운"],"word":"interesting","r":{"a":"2) 흥미로운","ev":"2번 문장","s":[[2,"Here is an interesting story about his paintings.","여기에 그의 그림들에 관한 흥미로운 이야기가 있다."]],"w":"2번은 모네의 그림들에 관한 '흥미로운' 이야기가 나온다고 알려 줘요. 그래서 3번부터 법정에서 일어난 재미있는 일이 시작돼요. interesting = 흥미로운.","c":2},"h":"6de687314b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They wanted the judge to decide which one was really painted by Monet.)","ko":"그들은 어떤 것이 정말 모네에 의해 그려진 것인지 판사가 ( ) 주기를 원했다.","opts":["그리다","잊다","보여 주다","결정하다"],"word":"decide","r":{"a":"4) 결정하다","ev":"6번 문장","s":[[6,"They wanted the judge to decide which one was really painted by Monet.","그들은 어떤 것이 정말 모네에 의해 그려진 것인지 판사가 결정해 주기를 원했다."]],"w":"사람들은 어느 그림이 진짜 모네의 그림인지 판사가 정해 주기를 원했어요. decide = 결정하다예요.","c":4},"h":"59f342af27"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nEach of them said their painting had been painted by Monet.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그들 각자는 자신의 그림이 모네에 의해 그려졌다고 말했다.","opts":["그림들","판사들","몇몇 사람들","프랑스 화가들"],"r":{"a":"3) 몇몇 사람들","ev":"3~4번 문장","s":[[3,"One day, several people brought paintings to court.","어느 날, 몇몇 사람들이 법정으로 그림들을 가져왔다."],[4,"Each of them said their painting had been painted by Monet.","그들 각자는 자신의 그림이 모네에 의해 그려졌다고 말했다."]],"w":"3번에서 several people(몇몇 사람들)이 그림을 법정에 가져왔다고 했고, 4번의 them은 이 사람들을 가리켜요. 그림은 their painting으로 따로 나와요.","c":3},"h":"734f4e40dd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"All of the paintings showed the same scene, but each one was a little different.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 그림들은 모두 같은 풍경을 보여주고 있었지만, 각각은 조금 달랐다.","opts":["모든 그림이 같은 풍경이었지만 각각 조금씩 달랐다.","모든 그림이 완전히 똑같은 모양이었다.","그림마다 풍경이 전혀 달랐다.","그림 중 단 하나만 같은 풍경이었다."],"r":{"a":"1) 모든 그림이 같은 풍경이었지만 각각 조금씩 달랐다.","ev":"5번 문장","s":[[5,"All of the paintings showed the same scene, but each one was a little different.","그 그림들은 모두 같은 풍경을 보여주고 있었지만, 각각은 조금 달랐다."]],"w":"All of the paintings showed the same scene은 모든 그림이 같은 풍경이라는 뜻이고, each one was a little different는 각각 조금씩 달랐다는 뜻이에요.","c":1},"h":"00fe3ed13e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["판사는 미술에 대해 거의 알지 못했다.","몇몇 사람들이 그림을 법정에 가져왔다.","모네는 약 25점의 수련 그림을 그렸다.","단 한 사람만 자신의 그림이 모네의 것이라고 말했다."],"opts":["The judge knew little about art.","Several people brought paintings to court.","Monet made about 25 water lily paintings.","Only one person said his painting was painted by Monet."],"r":{"a":"2) Several people brought paintings to court.","ev":"3, 4, 7, 11번 문장","s":[[3,"One day, several people brought paintings to court.","어느 날, 몇몇 사람들이 법정으로 그림들을 가져왔다."],[4,"Each of them said their painting had been painted by Monet.","그들 각자는 자신의 그림이 모네에 의해 그려졌다고 말했다."],[7,"The judge knew a lot about art.","그 판사는 미술에 대해 많이 알고 있었다."],[11,"He made about 250 of these water lily paintings!","그는 약 250점의 이 수련 그림들을 그렸다!"]],"w":"3번에서 몇몇 사람들이 그림을 법정에 가져왔어요. 판사는 미술에 대해 많이 알았고(7번), 수련 그림은 약 250점이며(11번), 그들 각자가 자기 그림이 모네의 것이라고 말했어요(4번).","c":2},"h":"d7f2db9e41"},{"n":9,"t":"sum","q":"Monet painted the same place at different (A) of the day to capture the change of (B).","ko":"모네는 (B)의 변화를 담아내기 위해 하루 중 각기 다른 (A)에 같은 장소를 그렸다.","oko":["(A) 장소 / (B) 빛","(A) 시간 / (B) 날씨","(A) 장소 / (B) 계절","(A) 시간 / (B) 빛","(A) 계절 / (B) 색"],"opts":["(A) places / (B) light","(A) times / (B) weather","(A) places / (B) season","(A) times / (B) light","(A) seasons / (B) color"],"r":{"a":"4) (A) times / (B) light","ev":"9~10번 문장","s":[[9,"Monet painted the same place at different times of the day to capture the change of light.","모네는 빛의 변화를 담아내기 위해 하루 중 각기 다른 시간에 같은 장소를 그렸다."],[10,"For example, his most famous works of art show water lilies in his garden at different times of the day.","예를 들어, 그의 가장 유명한 미술 작품들은 하루 중 각기 다른 시간에 그의 정원에 있는 수련들을 보여준다."]],"w":"9번에서 모네는 같은 장소를 하루 중 각기 다른 시간(times)에 그렸고, 빛(light)의 변화를 담아내려고 했어요. 10번의 수련 그림도 같은 정원을 각기 다른 시간에 그린 거예요.","c":4},"h":"a54ede450d"},{"n":10,"t":"fill","q":"Several people brought [A] to court, and each of them said their painting had been [B] by Monet.","ko":"몇몇 사람들이 [A]을(를) 법정으로 가져왔고, 그들 각자는 자신의 그림이 모네에 의해 [B] 것이라고 말했다.","bank":["paintings","painted","judge","scene","capture","famous"],"bko":{"paintings":"그림들","painted":"그려진 (paint 그리다)","judge":"판사","scene":"풍경","capture":"담아내다","famous":"유명한"},"r":{"a":"[A] paintings, [B] painted","ev":"3~4번 문장","s":[[3,"One day, several people brought paintings to court.","어느 날, 몇몇 사람들이 법정으로 그림들을 가져왔다."],[4,"Each of them said their painting had been painted by Monet.","그들 각자는 자신의 그림이 모네에 의해 그려졌다고 말했다."]],"w":"3번의 brought paintings to court와 4번의 their painting had been painted by Monet에서 가져왔어요. [B]는 had been 뒤의 과거분사 자리라서 painted만 들어가요.","c":null},"h":"8bd42780d8"}]},{"u":10,"id":"rj2-10-3","no":3,"ko":"제가 아는 그 악기가 맞나요?!","items":[{"n":1,"t":"tf","q":"William Close invented the Earth Harp in 1999.","ko":"William Close는 1999년에 Earth Harp를 발명했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Musician William Close invented it in 1999.","음악가 William Close가 1999년에 그것을 발명했다."]],"w":"3번 문장에 Musician William Close invented it in 1999가 있어요. it은 2번의 Earth Harp예요.","c":"T"},"h":"d712d0e9c8"},{"n":2,"t":"tf","q":"The Earth Harp has a small metal base.","ko":"Earth Harp는 작은 금속 하부를 갖고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The harp has a large wooden base.","그 하프는 나무로 된 큰 하부를 갖고 있다."]],"w":"6번 문장에서 하프는 나무로 된 큰 하부(a large wooden base)를 갖고 있다고 해요. 작고 금속이라는 말은 틀려요.","c":"F"},"h":"ddb6175c0e"},{"n":3,"t":"tf","q":"The musician stands near the base of the instrument.","ko":"음악가는 악기의 하부 가까이에 선다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"The musician stands on the stage near the base of the instrument.","그 음악가는 무대 위에서 악기의 하부에 가까이 선다."]],"w":"10번 문장에서 음악가는 무대 위에서 악기의 하부 가까이(near the base)에 선다고 해요.","c":"T"},"h":"b2ac997dff"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Strings stretch from the base for hundreds of meters.)","ko":"현들은 하부로부터 수백 미터나 ( ).","opts":["뻗어 있다","멈춰 있다","줄어든다","깨진다"],"word":"stretch","r":{"a":"1) 뻗어 있다","ev":"8번 문장","s":[[8,"Strings stretch from the base for hundreds of meters.","현들은 하부로부터 수백 미터나 뻗어 있다."]],"w":"8번은 현들이 하부에서 수백 미터나 '뻗어' 있다는 뜻이에요. 그래서 9번처럼 극장, 빌딩, 계곡의 꼭대기까지 닿을 수 있어요. stretch = 뻗다.","c":1},"h":"f5c10662f4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This is usually set on a stage.)","ko":"이것은 보통 무대 위에 ( ).","opts":["던져지다","놓이다","팔리다","깨지다"],"word":"set","r":{"a":"2) 놓이다","ev":"7번 문장","s":[[7,"This is usually set on a stage.","이것은 보통 무대 위에 놓인다."]],"w":"7번의 This는 6번의 나무로 된 큰 하부예요. 그 하부가 보통 무대 위에 '놓인다'는 뜻이에요. set = 놓다, is set = 놓인다.","c":2},"h":"3eec22bf03"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are attached to the tops of theaters, buildings, and even valleys.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 극장과 빌딩, 그리고 심지어 계곡의 꼭대기에 부착된다.","opts":["나무 하부들","음악가들","현들","무대들"],"r":{"a":"3) 현들","ev":"8~9번 문장","s":[[8,"Strings stretch from the base for hundreds of meters.","현들은 하부로부터 수백 미터나 뻗어 있다."],[9,"They are attached to the tops of theaters, buildings, and even valleys.","그것들은 극장과 빌딩, 그리고 심지어 계곡의 꼭대기에 부착된다."]],"w":"8번에서 Strings stretch from the base(현들이 하부에서 뻗어 있다)라고 했고, 9번의 They가 그 현들을 받아요. 극장, 빌딩, 계곡의 꼭대기에 부착되는 것은 현이에요.","c":3},"h":"6717f69421"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The Earth Harp is still listed in the Guinness World Records as the longest stringed instrument.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Earth Harp는 여전히 가장 긴 현악기로 기네스 세계 기록에 등재되어 있다.","opts":["Earth Harp는 가장 짧은 현악기로 기록에 올라 있다.","Earth Harp는 지금도 가장 긴 현악기로 기네스 세계 기록에 올라 있다.","Earth Harp는 더 이상 기네스 세계 기록에 올라 있지 않다.","Earth Harp는 기네스 세계 기록을 깨기 위해 만들어졌다."],"r":{"a":"2) Earth Harp는 지금도 가장 긴 현악기로 기네스 세계 기록에 올라 있다.","ev":"5번 문장","s":[[5,"The Earth Harp is still listed in the Guinness World Records as the longest stringed instrument.","Earth Harp는 여전히 가장 긴 현악기로 기네스 세계 기록에 등재되어 있다."]],"w":"is still listed in은 '여전히 ~에 올라 있다'이고, as the longest stringed instrument는 '가장 긴 현악기로서'예요.","c":2},"h":"6404c9a061"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Earth Harp는 1990년에 발명되었다.","Earth Harp의 하부는 보통 계곡에 놓인다.","음악가는 하부에서 멀리 떨어져 선다.","음악가는 끈적한 송진이 묻은 면장갑을 낀다."],"opts":["The Earth Harp was invented in 1990.","The base of the Earth Harp is usually set in a valley.","The musician stands far away from the base.","The musician wears cotton gloves coated with sticky resin."],"r":{"a":"4) The musician wears cotton gloves coated with sticky resin.","ev":"3, 7, 10, 11번 문장","s":[[3,"Musician William Close invented it in 1999.","음악가 William Close가 1999년에 그것을 발명했다."],[7,"This is usually set on a stage.","이것은 보통 무대 위에 놓인다."],[10,"The musician stands on the stage near the base of the instrument.","그 음악가는 무대 위에서 악기의 하부에 가까이 선다."],[11,"He wears cotton gloves coated with sticky resin.","그는 끈적끈적한 송진이 묻은 면장갑을 낀다."]],"w":"11번에서 음악가는 끈적한 송진이 묻은 면장갑을 껴요. 발명은 1999년이고(3번), 하부는 보통 무대 위에 놓이며(7번), 음악가는 하부 가까이에 서요(10번).","c":4},"h":"dee72559ab"},{"n":9,"t":"sum","q":"The musician runs his hands along the strings, which makes them (A), and this produces a beautiful sound that is much (B) than a normal harp’s.","ko":"음악가가 현들을 따라 손을 움직이면 현들이 (A)하고, 이것은 일반 하프보다 훨씬 더 (B) 아름다운 소리를 낸다.","oko":["(A) 멈추고 / (B) 깊은","(A) 진동하고 / (B) 높은","(A) 끊어지고 / (B) 깊은","(A) 끊어지고 / (B) 높은","(A) 진동하고 / (B) 깊은"],"opts":["(A) stop / (B) deeper","(A) vibrate / (B) higher","(A) break / (B) deeper","(A) break / (B) higher","(A) vibrate / (B) deeper"],"r":{"a":"5) (A) vibrate / (B) deeper","ev":"12~13번 문장","s":[[12,"He runs his hands along the strings and causes them to vibrate.","그는 현들을 따라 그의 손을 움직이고 그것(현)들을 진동하게 한다."],[13,"This makes a beautiful sound that is much deeper than that of a normal harp.","이것은 일반 하프의 그것(소리)보다 훨씬 더 깊은 아름다운 소리를 낸다."]],"w":"12번에서 손으로 현을 따라 움직이면 현이 진동해요(vibrate). 13번에서 그 소리는 일반 하프보다 훨씬 더 깊다(deeper)고 해요.","c":5},"h":"b47c0f4ed2"},{"n":10,"t":"fill","q":"William Close [A] buildings and natural spaces into enormous [B].","ko":"William Close는 빌딩과 자연 공간들을 거대한 [B](으)로 [A].","bank":["turns","harps","wooden","sticky","deeper","longest"],"bko":{"turns":"바꾼다","harps":"하프들","wooden":"나무로 된","sticky":"끈적끈적한","deeper":"더 깊은","longest":"가장 긴"},"r":{"a":"[A] turns, [B] harps","ev":"4번 문장","s":[[4,"He turns buildings and natural spaces into enormous harps.","그는 빌딩과 자연 공간들을 거대한 하프로 바꾼다."]],"w":"4번 He turns buildings and natural spaces into enormous harps에서 가져왔어요. [A]는 turn A into B의 동사 자리이고, [B]는 enormous가 꾸미는 명사 자리예요.","c":null},"h":"39c97a9a4f"}]},{"u":10,"id":"rj2-10-4","no":4,"ko":"왜 이런 별명이?","items":[{"n":1,"t":"tf","q":"Night Watch is one of Rembrandt’s most famous works.","ko":"<야경>은 렘브란트의 가장 유명한 작품들 중 하나이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It is Night Watch, one of Rembrandt’s most famous works.","그것은 렘브란트의 가장 유명한 작품들 중 하나인 <야경(夜警)>이다."]],"w":"2번 문장에 It is Night Watch, one of Rembrandt’s most famous works가 있어요.","c":"T"},"h":"b5e47101f3"},{"n":2,"t":"tf","q":"In the 1940s, more layers of varnish were added to the painting.","ko":"1940년대에 그 그림에는 더 많은 겹의 니스가 덧칠되었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"In the 1940s, however, the layers of varnish were removed and the colors were restored to their original condition.","하지만, 1940년대에 여러 겹의 니스가 제거되었고, 색들은 그것들의 원래 상태로 복원되었다."]],"w":"11번 문장에서 1940년대에는 여러 겹의 니스가 제거되었고(were removed) 색들이 복원되었어요. 더 덧칠했다는 말은 반대예요.","c":"F"},"h":"d4e3a1aacb"},{"n":3,"t":"tf","q":"The layers of varnish made the painting look dark.","ko":"여러 겹의 니스는 그 그림이 어두워 보이게 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"This made the painting look dark.","이것은 그 그림이 어두워 보이게 했다."]],"w":"9번 문장에서 This(니스를 덧칠한 일)가 그림이 어두워 보이게 했다(made the painting look dark)고 해요.","c":"T"},"h":"d667896f28"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Naturally, people thought the painting showed a nighttime event.)","ko":"( ), 사람들은 그 그림이 밤에 일어난 일을 보여준다고 생각했다.","opts":["우연히","당연히","불행히도","천천히"],"word":"Naturally","r":{"a":"2) 당연히","ev":"9~10번 문장","s":[[9,"This made the painting look dark.","이것은 그 그림이 어두워 보이게 했다."],[10,"Naturally, people thought the painting showed a nighttime event.","자연스럽게, 사람들은 그 그림이 밤에 일어난 일을 보여준다고 생각했다."]],"w":"9번에서 그림이 어두워 보였으니, 사람들이 밤 장면이라고 생각한 것은 당연한 반응이에요. Naturally = 당연히, 자연스럽게예요.","c":2},"h":"0a474840d4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In the 1940s, however, the layers of varnish were removed.)","ko":"하지만, 1940년대에 여러 겹의 니스가 ( ).","opts":["덧칠했다","제거되었다","보호되었다","설명되었다"],"word":"removed","r":{"a":"2) 제거되었다","ev":"11번 문장","s":[[11,"In the 1940s, however, the layers of varnish were removed and the colors were restored to their original condition.","하지만, 1940년대에 여러 겹의 니스가 제거되었고, 색들은 그것들의 원래 상태로 복원되었다."]],"w":"10번에서는 니스 때문에 밤 풍경이라고 생각했는데, 11번의 however 이후에는 색이 원래 상태로 복원되었어요. 니스가 없어져야 하니 were removed = 제거되었다예요.","c":2},"h":"42a285dfd6"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSo people started using the name Night Watch because it seemed to describe the painting well.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그래서 사람들은 그것이 그 그림을 잘 설명하는 것 같았기 때문에 <야경>이라는 이름을 사용하기 시작했다.","opts":["그 그림","렘브란트","<야경>이라는 이름","그림의 진짜 이름"],"r":{"a":"3) <야경>이라는 이름","ev":"4~5번 문장","s":[[4,"Its real name is very long.","그것의 진짜 이름은 매우 길다."],[5,"So people started using the name Night Watch because it seemed to describe the painting well.","그래서 사람들은 그것이 그 그림을 잘 설명하는 것 같았기 때문에 <야경>이라는 이름을 사용하기 시작했다."]],"w":"4번에서 진짜 이름은 아주 길다고 했어요. 5번에서 사람들이 쓰기 시작한 이름이 Night Watch이고, because it seemed to describe the painting well의 it은 그 이름을 가리켜요. 그림을 설명하는 것 같은 것은 이름이에요.","c":3},"h":"7d2301acf0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Actually, it is not a night scene at all!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사실, 그것은 밤 풍경이 전혀 아니다!","opts":["사실, 그것은 밤 풍경과 조금 비슷하다.","사실, 그것은 밤에만 볼 수 있는 그림이다.","사실, 그것은 밤 풍경이 맞다.","사실, 그것은 밤 풍경이 전혀 아니다."],"r":{"a":"4) 사실, 그것은 밤 풍경이 전혀 아니다.","ev":"6~7번 문장","s":[[6,"However, it turns out that the nickname is wrong!","하지만, 그 별명은 잘못된 것으로 밝혀진다!"],[7,"Actually, it is not a night scene at all!","사실, 그것은 밤 풍경이 전혀 아니다!"]],"w":"not ~ at all은 '전혀 ~ 아니다'라는 뜻이에요. 6번에서 별명이 잘못되었다고 했고, 7번에서 이 그림은 밤 풍경이 전혀 아니라고 해요.","c":4},"h":"7c25912fb4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그림의 진짜 이름은 아주 짧다.","그림을 먼지로부터 보호하기 위해 여러 겹의 니스가 덧칠되었다.","그림은 오늘날 <Day Watch>라고 불린다.","렘브란트가 죽기 전에 그림에 니스가 덧칠되었다."],"opts":["The real name of the painting is very short.","Layers of varnish were added to protect the painting from dirt.","The painting is called Day Watch today.","Varnish was added to the painting before Rembrandt died."],"r":{"a":"2) Layers of varnish were added to protect the painting from dirt.","ev":"4, 8, 13번 문장","s":[[4,"Its real name is very long.","그것의 진짜 이름은 매우 길다."],[8,"After Rembrandt’s death, layers of varnish were added to the painting to protect it from dirt.","렘브란트의 사망 후에, 그것을 먼지로부터 보호하기 위해 여러 겹의 니스가 그림에 덧칠해졌다."],[13,"But its original nickname was already famous, so the painting is
