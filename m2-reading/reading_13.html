<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}

.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}

.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"Many student have \"turtle neck.\" This happens when their head stick forward.","ko":"많은 학생들이 '거북목'을 가지고 있다. 이것은 그들의 머리가 앞으로 나올 때 발생한다.","ok":false,"foot":[],"fixes":[{"wrong":"student","right":"students","partial":false,"at":[1],"point":"명사의 복수형: Many 뒤에는 복수명사 students 사용","topic":"명사의 복수형","memo":"Many 뒤에는 복수명사 students 사용"},{"wrong":"stick","right":"sticks","partial":false,"at":[10],"point":"3인칭 단수 현재형: 주어 head(단수)에는 sticks 사용","topic":"3인칭 단수 현재형","memo":"주어 head(단수)에는 sticks 사용"}]},{"n":2,"tag":null,"en":"It often comes from using smartphones, studying, or sitting for a long time.","ko":"그것은 스마트폰을 사용하거나 공부를 하거나 혹은 오랜 시간 동안 앉아 있는 것에서 흔히 비롯된다.","ok":true,"foot":[],"fixes":[]},{"n":3,"tag":null,"en":"When you have turtle neck, you may gets neck pain, back pain, or headaches. But don't worry!","ko":"여러분이 거북목을 가지고 있을 때 여러분은 목 통증, 허리 통증, 또는 두통이 있을 수 있다. 그러나 걱정하지 마라!","ok":false,"foot":[],"fixes":[{"wrong":"gets","right":"get","partial":false,"at":[7],"point":"조동사: 조동사 may 뒤에는 동사원형 get 사용","topic":"조동사","memo":"조동사 may 뒤에는 동사원형 get 사용"}]},{"n":4,"tag":null,"en":"Here is some easy stretches to help with turtle neck.","ko":"여기 거북목에 도움이 되는 쉬운 스트레칭이 몇 가지 있다.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[1],"point":"be동사의 긍정문: stretches(복수)에는 are 사용","topic":"be동사의 긍정문","memo":"stretches(복수)에는 are 사용"}]},{"n":5,"tag":"책상 스트레칭","en":"Sit up straightly and move your head slowly from side to side. Put your right hand on the left side of your head.","ko":"똑바로 앉고 머리를 천천히 좌우로 움직여라. 오른손을 머리의 왼쪽에 두어라.","ok":false,"foot":[],"fixes":[{"wrong":"straightly","right":"straight","partial":false,"at":[2],"point":"형용사와 부사: '똑바로'는 straight 사용 (straightly 아님)","topic":"형용사와 부사","memo":"'똑바로'는 straight 사용 (straightly 아님)"}]},{"n":6,"tag":null,"en":"Then gently pull you head to the right. Hold for 5 second.","ko":"그러고 나서 머리를 오른쪽으로 부드럽게 당겨라. 5초 동안 유지하라.","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[3],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 your 사용"},{"wrong":"second","right":"seconds","partial":false,"at":[11],"point":"명사의 복수형: 2 이상이므로 복수 seconds 사용","topic":"명사의 복수형","memo":"2 이상이므로 복수 seconds 사용"}]},{"n":7,"tag":null,"en":"Repeat on yours left side. Finally, put your hands together and hold your chin with your thumbs.","ko":"왼쪽에 반복하라. 마지막으로, 두 손을 함께 모으고 엄지손가락으로 턱을 잡아라.","ok":false,"foot":[],"fixes":[{"wrong":"yours","right":"your","partial":false,"at":[2],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 your 사용"}]},{"n":8,"tag":null,"en":"Push your head back slowly. Hold at 10 seconds.","ko":"머리를 천천히 뒤로 밀어라. 10초 동안 유지하라.","ok":false,"foot":[],"fixes":[{"wrong":"at","right":"for","partial":false,"at":[6],"point":"기본전치사: '~동안'은 전치사 for 사용","topic":"기본전치사","memo":"'~동안'은 전치사 for 사용"}]},{"n":9,"tag":null,"en":"If you do this set of stretches, you'll felt better.","ko":"만약 이 스트레칭 세트를 하면, 여러분은 더 나아질 것이다.","ok":false,"foot":[],"fixes":[{"wrong":"felt","right":"feel","partial":false,"at":[8],"point":"조동사: will 뒤에는 동사원형: feel (felt 아님)","topic":"조동사","memo":"will 뒤에는 동사원형: feel (felt 아님)"}]},{"n":10,"tag":"서서 하는 스트레칭","en":"Stand and spread your feet. Bend your arms to makes a W shape.","ko":"서서 두 발을 벌려라. W 모양을 만들기 위해 팔을 구부려라.","ok":false,"foot":[],"fixes":[{"wrong":"makes","right":"make","partial":false,"at":[9],"point":"to부정사: to 뒤에는 동사원형 make 사용","topic":"to부정사","memo":"to 뒤에는 동사원형 make 사용"}]},{"n":11,"tag":null,"en":"Then lean your head backward. Look up at an 45-degree angle.","ko":"그런 다음 머리를 뒤로 젖혀라. 45도 각도로 위를 바라보라.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[8],"point":"관사 a/an: 자음 소리 forty-five 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 forty-five 앞에는 a 사용"}]},{"n":12,"tag":null,"en":"Hold for 10 seconds. This stretch is great for your neck and shoulders.","ko":"10초 동안 유지하라. 이 스트레칭은 목과 어깨에 좋다.","ok":true,"foot":[],"fixes":[]},{"n":13,"tag":"취침 시간 스트레칭","en":"Lie on you bed with your head at the edge. Let your head hang off the bed.","ko":"머리를 침대의 가장자리에 두고 누워라. 머리를 침대 밖으로 늘어뜨려라.","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[2],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 your 사용"}]},{"n":14,"tag":null,"en":"Hold for 60 seconds. Don't do this for more longer than 60 seconds.","ko":"60초 동안 유지하라. 이것을 60초 이상 하지 마라.","ok":false,"foot":[],"fixes":[{"wrong":"more longer","right":"longer","partial":false,"at":[8],"point":"비교급: long의 비교급은 longer (more 안 씀)","topic":"비교급","memo":"long의 비교급은 longer (more 안 씀)"}]},{"n":15,"tag":null,"en":"It can make you feel dizzily. This stretch help relax your neck and back.","ko":"이것은 어지러움을 느끼게 만들 수 있다. 이 스트레칭은 목과 등을 이완하는 데 도움이 된다.","ok":false,"foot":[],"fixes":[{"wrong":"dizzily","right":"dizzy","partial":false,"at":[5],"point":"형용사와 부사: feel 뒤 보어는 형용사 dizzy 사용","topic":"형용사와 부사","memo":"feel 뒤 보어는 형용사 dizzy 사용"},{"wrong":"help","right":"helps","partial":false,"at":[8],"point":"3인칭 단수 현재형: 주어 This stretch(3인칭 단수)는 helps (help 아님)","topic":"3인칭 단수 현재형","memo":"주어 This stretch(3인칭 단수)는 helps (help 아님)"}]},{"n":16,"tag":null,"en":"One things is more important than stretching: good habits in everyday life. Don't look down at your smartphone or computer monitor.","ko":"한 가지가 스트레칭보다 더 중요하다: 일상생활에서의 좋은 습관이다. 스마트폰이나 컴퓨터 모니터를 내려다보지 마라.","ok":false,"foot":[],"fixes":[{"wrong":"things","right":"thing","partial":false,"at":[1],"point":"명사의 단수형: One 뒤에는 단수명사 thing 사용","topic":"명사의 단수형","memo":"One 뒤에는 단수명사 thing 사용"}]},{"n":17,"tag":null,"en":"Try to keep it at eye level. When you is sitting, sit up straight and keep your feet in the floor.","ko":"그것을 눈높이에 맞추려고 노력하라. 앉아 있을 때 똑바로 앉고 발을 바닥에 두어라.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[9],"point":"be동사의 긍정문: 주어 you에는 are 사용","topic":"be동사의 긍정문","memo":"주어 you에는 are 사용"},{"wrong":"in","right":"on","partial":false,"at":[18],"point":"기본전치사: '바닥 위에'는 on the floor 사용","topic":"기본전치사","memo":"'바닥 위에'는 on the floor 사용"}]},{"n":18,"tag":null,"en":"If you are studying for a long time, you should stretches every 50 minutes. Good habits keep your neck health and strong.","ko":"오랜 시간 동안 공부할 때 50분마다 스트레칭을 해야 한다. 좋은 습관은 여러분의 목을 건강하고 강하게 유지시켜 준다.","ok":false,"foot":[],"fixes":[{"wrong":"stretches","right":"stretch","partial":false,"at":[10],"point":"조동사: 조동사 should 뒤에는 동사원형 stretch 사용","topic":"조동사","memo":"조동사 should 뒤에는 동사원형 stretch 사용"},{"wrong":"health","right":"healthy","partial":false,"at":[19],"point":"품사 혼동: 보어 자리에는 형용사 healthy 사용","topic":"품사 혼동","memo":"보어 자리에는 형용사 healthy 사용"}]}];var PP=[["Many students have \"turtle neck.\"","많은 학생들이 '거북목'을 가지고 있다.",1],["This happens when their head sticks forward.","이것은 그들의 머리가 앞으로 나올 때 발생한다.",0],["It often comes from using smartphones, studying, or sitting for a long time.","그것은 스마트폰을 사용하거나 공부를 하거나 혹은 오랜 시간 동안 앉아 있는 것에서 흔히 비롯된다.",0],["When you have turtle neck, you may get neck pain, back pain, or headaches.","여러분이 거북목을 가지고 있을 때 여러분은 목 통증, 허리 통증, 또는 두통이 있을 수 있다.",0],["But don't worry!","그러나 걱정하지 마라!",0],["Here are some easy stretches to help with turtle neck.","여기 거북목에 도움이 되는 쉬운 스트레칭이 몇 가지 있다.",0],["Desk Stretch","책상 스트레칭",1],["Sit up straight and move your head slowly from side to side.","똑바로 앉고 머리를 천천히 좌우로 움직여라.",1],["Put your right hand on the left side of your head.","오른손을 머리의 왼쪽에 두어라.",0],["Then gently pull your head to the right.","그러고 나서 머리를 오른쪽으로 부드럽게 당겨라.",0],["Hold for 5 seconds.","5초 동안 유지하라.",0],["Repeat on your left side.","왼쪽에 반복하라.",0],["Finally, put your hands together and hold your chin with your thumbs.","마지막으로, 두 손을 함께 모으고 엄지손가락으로 턱을 잡아라.",0],["Push your head back slowly.","머리를 천천히 뒤로 밀어라.",0],["Hold for 10 seconds.","10초 동안 유지하라.",0],["If you do this set of stretches, you'll feel better.","만약 이 스트레칭 세트를 하면, 여러분은 더 나아질 것이다.",0],["Standing Stretch","서서 하는 스트레칭",1],["Stand and spread your feet.","서서 두 발을 벌려라.",1],["Bend your arms to make a W shape.","W 모양을 만들기 위해 팔을 구부려라.",0],["Then lean your head backward.","그런 다음 머리를 뒤로 젖혀라.",0],["Look up at a 45-degree angle.","45도 각도로 위를 바라보라.",0],["Hold for 10 seconds.","10초 동안 유지하라.",0],["This stretch is great for your neck and shoulders.","이 스트레칭은 목과 어깨에 좋다.",0],["Bedtime Stretch","취침 시간 스트레칭",1],["Lie on your bed with your head at the edge.","머리를 침대의 가장자리에 두고 누워라.",1],["Let your head hang off the bed.","머리를 침대 밖으로 늘어뜨려라.",0],["Hold for 60 seconds.","60초 동안 유지하라.",0],["Don't do this for longer than 60 seconds.","이것을 60초 이상 하지 마라.",0],["It can make you feel dizzy.","이것은 어지러움을 느끼게 만들 수 있다.",0],["This stretch helps relax your neck and back.","이 스트레칭은 목과 등을 이완하는 데 도움이 된다.",0],["One thing is more important than stretching: good habits in everyday life.","한 가지가 스트레칭보다 더 중요하다: 일상생활에서의 좋은 습관이다.",1],["Don't look down at your smartphone or computer monitor.","스마트폰이나 컴퓨터 모니터를 내려다보지 마라.",0],["Try to keep it at eye level.","그것을 눈높이에 맞추려고 노력하라.",0],["When you are sitting, sit up straight and keep your feet on the floor.","앉아 있을 때 똑바로 앉고 발을 바닥에 두어라.",0],["If you are studying for a long time, you should stretch every 50 minutes.","오랜 시간 동안 공부할 때 50분마다 스트레칭을 해야 한다.",0],["Good habits keep your neck healthy and strong.","좋은 습관은 여러분의 목을 건강하고 강하게 유지시켜 준다.",0]];var RNUM=13;var TITLE_EN="How's Your Neck Doing?";var PASS_EN=["How's Your Neck Doing?","Many students have \"turtle neck.\" This happens when their head sticks forward. It often comes from using smartphones, studying, or sitting for a long time. When you have turtle neck, you may get neck pain, back pain, or headaches. But don't worry! Here are some easy stretches to help with turtle neck.","Desk Stretch","Sit up straight and move your head slowly from side to side. Put your right hand on the left side of your head. Then gently pull your head to the right. Hold for 5 seconds. Repeat on your left side. Finally, put your hands together and hold your chin with your thumbs. Push your head back slowly. Hold for 10 seconds. If you do this set of stretches, you'll feel better.","Standing Stretch","Stand and spread your feet. Bend your arms to make a W shape. Then lean your head backward. Look up at a 45-degree angle. Hold for 10 seconds. This stretch is great for your neck and shoulders.","Bedtime Stretch","Lie on your bed with your head at the edge. Let your head hang off the bed. Hold for 60 seconds. Don't do this for longer than 60 seconds. It can make you feel dizzy. This stretch helps relax your neck and back.","One thing is more important than stretching: good habits in everyday life. Don't look down at your smartphone or computer monitor. Try to keep it at eye level. When you are sitting, sit up straight and keep your feet on the floor. If you are studying for a long time, you should stretch every 50 minutes. Good habits keep your neck healthy and strong."];var PASS_KO=["당신의 목은 괜찮은가요?","많은 학생들이 '거북목'을 가지고 있다. 이것은 그들의 머리가 앞으로 나올 때 발생한다. 그것은 스마트폰을 사용하거나 공부를 하거나 혹은 오랜 시간 동안 앉아 있는 것에서 흔히 비롯된다. 여러분이 거북목을 가지고 있을 때 여러분은 목 통증, 허리 통증, 또는 두통이 있을 수 있다. 그러나 걱정하지 마라! 여기 거북목에 도움이 되는 쉬운 스트레칭이 몇 가지 있다.","책상 스트레칭","똑바로 앉고 머리를 천천히 좌우로 움직여라. 오른손을 머리의 왼쪽에 두어라. 그러고 나서 머리를 오른쪽으로 부드럽게 당겨라. 5초 동안 유지하라. 왼쪽에 반복하라. 마지막으로, 두 손을 함께 모으고 엄지손가락으로 턱을 잡아라. 머리를 천천히 뒤로 밀어라. 10초 동안 유지하라. 만약 이 스트레칭 세트를 하면, 여러분은 더 나아질 것이다.","서서 하는 스트레칭","서서 두 발을 벌려라. W 모양을 만들기 위해 팔을 구부려라. 그런 다음 머리를 뒤로 젖혀라. 45도 각도로 위를 바라보라. 10초 동안 유지하라. 이 스트레칭은 목과 어깨에 좋다.","취침 시간 스트레칭","머리를 침대의 가장자리에 두고 누워라. 머리를 침대 밖으로 늘어뜨려라. 60초 동안 유지하라. 이것을 60초 이상 하지 마라. 이것은 어지러움을 느끼게 만들 수 있다. 이 스트레칭은 목과 등을 이완하는 데 도움이 된다.","한 가지가 스트레칭보다 더 중요하다: 일상생활에서의 좋은 습관이다. 스마트폰이나 컴퓨터 모니터를 내려다보지 마라. 그것을 눈높이에 맞추려고 노력하라. 앉아 있을 때 똑바로 앉고 발을 바닥에 두어라. 오랜 시간 동안 공부할 때 50분마다 스트레칭을 해야 한다. 좋은 습관은 여러분의 목을 건강하고 강하게 유지시켜 준다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["조깅을 하는 방법","지원의 새로운 취미","댄스 수업을 가입하는 방법","선우가 스트레스를 받는 이유","스트레스 해소를 위한 신체적 활동"],"a":4,"ans":"스트레스 해소를 위한 신체적 활동","evs":[["G: Games are fun, but I think you should try some physical activities.","게임은 재미있지만, 나는 네가 몸을 움직이는 활동을 해 보면 좋겠다고 생각해."],["G: How about jogging? You can listen to your favorite songs while you run.","조깅은 어때? 달리는 동안 좋아하는 노래를 들을 수 있어."]],"ev":["G: Games are fun, but I think you should try some physical activities.","게임은 재미있지만, 나는 네가 몸을 움직이는 활동을 해 보면 좋겠다고 생각해."],"ow":["오답 ✕ — 조깅은 'How about jogging?'(조깅은 어때?)이라고 제안한 활동 중 하나일 뿐, 조깅하는 방법을 설명하는 대화는 아니라서 틀림.","오답 ✕ — 'I take dance classes every evening.'(매일 저녁 댄스 수업을 들어.)는 지원이의 취미를 말하는 마지막 부분일 뿐, 새로운 취미를 이야기하는 대화가 아니라서 틀림.","오답 ✕ — 지원이가 댄스 수업을 듣는다고 말할 뿐, 'I take dance classes every evening.'에 가입 방법은 나오지 않아서 틀림.","오답 ✕ — 'I'm really stressed about my studies these days.'(공부 때문에 스트레스를 받아.)라고 하지만, 대화의 중심은 이유가 아니라 풀 방법(조깅 등)이라서 틀림.","정답 ○ — 'I think you should try some physical activities.'(몸을 움직이는 활동을 해 보면 좋겠다.)와 'How about jogging?'(조깅은 어때?)으로 스트레스를 풀 신체 활동을 이야기하므로 주제로 알맞음."],"memo":["정답 ⑤: 스트레스 해소를 위한 신체적 활동","근거: I think you should try some physical activities.(몸을 움직이는 활동을 해 보면 좋겠다.)","함정: ④ 스트레스의 이유가 아니라 푸는 방법이 중심이다. ✕"],"why":"스트레스를 받는 선우에게 지원이가 조깅 같은 신체 활동을 권한다."},{"n":2,"q":"위 대화를 읽고 답할 수 없는 질문은?","o":["What does Seonu get stressed about?","What does Seonu do to relax?","What does Jiwon think Seonu should do?","What are Jiwon's favorite songs?","What is Jiwon's hobby?"],"a":3,"ans":"What are Jiwon's favorite songs?","evs":[["G: Games are fun, but I think you should try some physical activities.","게임은 재미있지만, 나는 네가 몸을 움직이는 활동을 해 보면 좋겠다고 생각해."],["G: I take dance classes every evening. It's so much fun.","나는 매일 저녁 댄스 수업을 들어. 정말 재미있어."]],"ev":["G: Games are fun, but I think you should try some physical activities.","게임은 재미있지만, 나는 네가 몸을 움직이는 활동을 해 보면 좋겠다고 생각해."],"ow":["오답 ✕ — 답할 수 있는 질문이다. 선우가 'I'm really stressed about my studies these days.'(요즘 공부 때문에 스트레스를 받아.)라고 했다. 답할 수 없는 질문을 고르는 문제의 답이 아님.","오답 ✕ — 답할 수 있는 질문이다. 선우는 'I just play games sometimes.'(가끔 게임만 해.)라고 했다. 답할 수 없는 질문을 고르는 문제의 답이 아님.","오답 ✕ — 답할 수 있는 질문이다. 지원이는 'I think you should try some physical activities.'(몸을 움직이는 활동을 해 보면 좋겠다.)라고 했다.","정답 ○ — 'You can listen to your  drinks water every day.","B thinks soda is good for A's health.","B advises A to drink water instead of soda.","A refuses B's advice.","B drinks soda every day."],"a":2,"ans":"B advises A to drink water instead of soda.","evs":[["B: That's not good for your health. I think you should drink water instead.","그건 건강에 좋지 않아. 대신 물을 마셔야 한다고 생각해."],["A: Okay, I'll try.","알겠어, 노력해 볼게."]],"ev":["B: That's not good for your health. I think you should drink water instead.","그건 건강에 좋지 않아. 대신 물을 마셔야 한다고 생각해."],"ow":["오답 ✕ — A는 'I drink soda every day.'(나는 매일 탄산음료를 마셔.)라고 했으므로 매일 마시는 것은 물이 아니라 탄산음료라서 틀림.","오답 ✕ — B는 'That's not good for your health.'(그건 건강에 좋지 않아.)라고 했는데, 이 보기는 건강에 좋다고 해서 틀림.","정답 ○ — B가 'I think you should drink water instead.'(대신 물을 마셔야 한다고 생각해.)라고 했으므로 탄산음료 대신 물을 마시라는 조언이 맞음.","오답 ✕ — A는 'Okay, I'll try.'(알겠어, 노력해 볼게.)라고 했으므로 조언을 거절한 것이 아니라 받아들여서 틀림.","오답 ✕ — 매일 탄산음료를 마시는 사람은 B가 아니라 A이다('I drink soda every day.'). 틀림."],"memo":["정답 ③: B는 A에게 탄산음료 대신 물을 마시라고 조언한다.","근거: I think you should drink water instead.(대신 물을 마셔야 한다고 생각해.)","함정: 탄산음료를 매일 마시는 사람은 B가 아니라 A ✕"],"why":"B는 매일 탄산음료를 마시는 A에게 대신 물을 마시라고 조언한다."}],"dlg":[["A","I drink soda every day.","나는 매일 탄산음료를 마셔."],["B","That's not good for your health. I think you should drink water instead.","그건 건강에 좋지 않아. 대신 물을 마셔야 한다고 생각해."],["A","Okay, I'll try.","알겠어, 노력해 볼게."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 제목으로 알맞은 것은?","o":["A Guide to Healthy Posture","The Increase of Turtle Neck","Examples of Incorrect Stretches","Turtle Neck: Its Causes and Problem","Our Bodies Hurt Due to Smartphones!"],"a":3,"ans":"Turtle Neck: Its Causes and Problem","evs":[["Many students have \"turtle neck.\"","많은 학생들이 '거북목'을 가지고 있다."],["It often comes from using smartphones, studying, or sitting for a long time.","그것은 스마트폰을 사용하거나 공부를 하거나 혹은 오랜 시간 동안 앉아 있는 것에서 흔히 비롯된다."],["When you have turtle neck, you may get neck pain, back pain, or headaches.","여러분이 거북목을 가지고 있을 때 여러분은 목 통증, 허리 통증, 또는 두통이 있을 수 있다."]],"ev":["Many students have \"turtle neck.\"","많은 학생들이 '거북목'을 가지고 있다."],"ow":["오답 ✕ — 글은 거북목이 무엇이고 왜 생기는지를 설명한다. 'Sit up straight'(똑바로 앉아라)라는 말은 있지만 올바른 자세를 안내하는 글은 아니라서 제목으로는 틀림.","오답 ✕ — 'Many students have \"turtle neck.\"'(많은 학생들이 '거북목'을 가지고 있다.)라고 하지만, 거북목이 늘어나고 있다는 증가 추세를 말하는 글은 아니라서 틀림.","오답 ✕ — 'Here are some easy stretches to help with turtle neck.'(거북목에 도움이 되는 쉬운 스트레칭이 있다.)처럼 올바른 스트레칭을 소개하므로 잘못된 스트레칭의 예시가 아니라서 틀림.","정답 ○ — 'It often comes from using smartphones, studying, or sitting for a long time.'(원인)와 'you may get neck pain, back pain, or headaches'(문제)를 설명하므로 제목으로 알맞음.","오답 ✕ — 원인으로 'using smartphones'(스마트폰 사용)가 나오지만 'studying, or sitting for a long time'(공부, 오래 앉아 있기)도 원인이라 스마트폰만 탓하는 제목은 너무 좁아서 틀림."],"memo":["정답 ④: Turtle Neck: Its Causes and Problem","근거: It often comes from using smartphones, studying, or sitting for a long time.(원인)","함정: ⑤ 원인이 스마트폰만이 아니다(공부, 오래 앉기도 원인) ✕"],"why":"글은 거북목의 원인과 문제를 설명한다."},{"n":7,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Using smartphones is one of the causes of turtle neck.","Turtle neck causes pain in your neck or back.","We don't have to worry about turtle neck because easy stretches can help.","There are easy stretches to do when you are sitting at the desk.","After holding your head with your hands, you should push your head down slowly."],"a":4,"ans":"After holding your head with your hands, you should push your head down slowly.","evs":[["Finally, put your hands together and hold your chin with your thumbs.","마지막으로, 두 손을 함께 모으고 엄지손가락으로 턱을 잡아라."],["Push your head back slowly.","머리를 천천히 뒤로 밀어라."]],"ev":["Finally, put your hands together and hold your chin with your thumbs.","마지막으로, 두 손을 함께 모으고 엄지손가락으로 턱을 잡아라."],"ow":["오답 ✕ — 이 보기는 일치한다. 'It often comes from using smartphones, studying, or sitting for a long time.'(그것은 스마트폰을 사용하거나 공부를 하거나 오래 앉아 있는 것에서 흔히 비롯된다.)라고 했다. 불일치 문제의 답이 아님.","오답 ✕ — 이 보기는 일치한다. 'you may get neck pain, back pain, or headaches'(목 통증, 허리 통증, 또는 두통이 있을 수 있다)라고 했다. 불일치 문제의 답이 아님.","오답 ✕ — 이 보기는 일치한다. 'But don't worry! Here are some easy stretches to help with turtle neck.'(걱정하지 마라! 거북목에 도움이 되는 쉬운 스트레칭이 있다.)라고 했다. 불일치 문제의 답이 아님.","오답 ✕ — 이 보기는 일치한다. 'Desk Stretch'(책상 스트레칭)에서 'Sit up straight and move your head slowly from side to side.'(똑바로 앉고 머리를 천천히 좌우로 움직여라.)라고 했다. 불일치 문제의 답이 아님.","정답 ○ — 본문은 'Push your head back slowly.'(머리를 천천히 뒤로 밀어라.)인데, 이 보기는 아래로(down) 밀라고 해서 본문과 일치하지 않음."],"memo":["정답 ⑤: 머리를 아래로(down) 미는 것이 아니라 뒤로(back) 밀어야 한다.","근거: Push your head back slowly.(머리를 천천히 뒤로 밀어라.)","함정: back(뒤로)과 down(아래로)을 구별하자 ✕"],"why":"두 손으로 턱을 잡고 머리를 뒤로 천천히 밀어야 한다."}],"pp":[["Many students have \"turtle neck.\"","많은 학생들이 '거북목'을 가지고 있다."],["This happens when their head sticks forward.","이것은 그들의 머리가 앞으로 나올 때 발생한다."],["It often comes from using smartphones, studying, or sitting for a long time.","그것은 스마트폰을 사용하거나 공부를 하거나 혹은 오랜 시간 동안 앉아 있는 것에서 흔히 비롯된다."],["When you have turtle neck, you may get neck pain, back pain, or headaches.","여러분이 거북목을 가지고 있을 때 여러분은 목 통증, 허리 통증, 또는 두통이 있을 수 있다."],["But don't worry!","그러나 걱정하지 마라!"],["Here are some easy stretches to help with turtle neck.","여기 거북목에 도움이 되는 쉬운 스트레칭이 몇 가지 있다."],["Desk Stretch","책상 스트레칭"],["Sit up straight and move your head slowly from side to side.","똑바로 앉고 머리를 천천히 좌우로 움직여라."],["Put your right hand on the left side of your head.","오른손을 머리의 왼쪽에 두어라."],["Then gently pull your head to the right.","그러고 나서 머리를 오른쪽으로 부드럽게 당겨라."],["Hold for 5 seconds.","5초 동안 유지하라."],["Repeat on your left side.","왼쪽에 반복하라."],["Finally, put your hands together and hold your chin with your thumbs.","마지막으로, 두 손을 함께 모으고 엄지손가락으로 턱을 잡아라."],["Push your head back slowly.","머리를 천천히 뒤로 밀어라."],["Hold for 10 seconds.","10초 동안 유지하라."],["If you do this set of stretches, you'll feel better.","만약 이 스트레칭 세트를 하면, 여러분은 더 나아질 것이다."]]},{"qs":[{"n":8,"q":"윗글의 두 번째 문단의 요지로 알맞은 것은?","o":["자주 당신의 목과 등을 이완하는 것이 스트레칭의 핵심이다.","스트레칭보다 목 문제를 해결하는데 효과적인 방법은 없다.","스마트폰의 사용만 줄여도 당신의 목을 건강하게 유지할 수 있다.","우리의 생각과 다르게, 목 건강과 오래 공부하는 것은 서로 관련이 없다.","목을 건강하게 유지하기 위해서는 스트레칭보다 좋은 일상 습관이 더 중요하다."],"a":4,"ans":"목을 건강하게 유지하기 위 function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function load(){try{var v=localStorage.getItem(BK);return v==null?null:+v}catch(e){return null}}

document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){done[+b.dataset.sub]=true;logA(+b.dataset.sub);render();
  var tot=0,fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}

var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});

}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}

});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
