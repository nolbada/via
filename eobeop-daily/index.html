<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ee">
<title>데일리어법</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1c1f26;--mute:#6a6e78;--line:#e3dfd3;--accent:#2b5aa8;--soft:#e6edf8;--ok:#2d6a4f;--oks:#e3f1ea;--no:#b3261e;--nos:#fbe9e7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif;padding:14px 14px 110px;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font-family:inherit}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd h1{margin:0;font-size:20px;letter-spacing:-.01em}
.hd .sub{font-size:13px;color:var(--mute)}
.bk{border:0;background:none;color:var(--mute);font-size:14px;padding:6px 0;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(30,30,40,.05)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sb{border:1.5px solid var(--line);background:#fff;border-radius:12px;height:48px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer}
.sb.cur{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.sb.dn{background:var(--oks);border-color:#b9dcc9;color:var(--ok)}
.sb.lk{color:#bdb9aa;background:#faf9f4;cursor:default}
.sum{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sum b{font-size:30px;letter-spacing:-.02em}
.mute{color:var(--mute);font-size:14px}
.go{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;padding:15px;cursor:pointer}
.go.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.dots{display:flex;gap:6px}.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--accent)}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--no)}
.q{font-size:19px;line-height:1.95}
.w{border-bottom:1px dotted #b9b4a3;cursor:pointer}.w.lk{background:#e9f3ff;border-bottom-color:var(--accent)}
.br{display:inline-block;font-weight:700;color:var(--accent);background:var(--soft);padding:0 8px;border-radius:8px;margin:0 2px}
.lbl{font-size:13px;color:var(--mute);margin:0 0 8px;letter-spacing:.02em}
.row{display:flex;gap:10px}
.ab{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 10px;font-size:18px;font-weight:700;min-height:52px;cursor:pointer;color:var(--ink)}
.ab.ok{background:var(--oks);border-color:var(--ok);color:var(--ok)}
.ab.no{background:var(--nos);border-color:var(--no);color:var(--no)}
.hide{display:none!important}
.sec{margin-top:16px}.sec:first-child{margin-top:0}.sec h4{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.02em}
.sl{border-top:1px solid var(--line)}
.sl .r{padding:8px 0 8px 10px;border-bottom:1px solid var(--line);border-left:3px solid var(--line)}.sl .r>b,.sl .r>span{display:block}
.sl .r>b{font-size:15.5px;line-height:1.45;font-weight:600}.sl .r>span{font-size:14.5px;color:var(--accent);line-height:1.45}
.tx{font-size:15px;color:#3a3e48;line-height:1.7}
.nat{font-size:16px;line-height:1.75;background:#faf9f4;border-radius:10px;padding:10px 12px}
.post{background:#fff;border:1px solid var(--ink);border-left:6px solid var(--ink);border-radius:6px;padding:14px 14px 12px;margin-top:16px}
.post .lb{font-size:12px;letter-spacing:.1em;color:var(--mute);font-weight:600;margin-bottom:6px}
.post .fm{font-family:"Noto Serif KR",Georgia,serif;font-size:21px;font-weight:700;line-height:1.4;color:var(--ink)}
.post .fm i{font-style:normal;color:var(--accent);padding:0 .2em;font-weight:400}
.mp{margin-top:12px}
.mp .cl{font-size:12px;color:var(--mute);font-weight:600;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:2px 0 4px}
.mp .ph{display:grid;grid-template-columns:1fr 1fr;gap:3px 4px;margin-bottom:8px}
.mp .pl{grid-column:1/-1;font-size:12px;font-weight:700;border-left:3px solid var(--ink);padding-left:6px;line-height:1.2}
.mp .ce{background:#f1efe7;border-radius:6px;padding:6px 8px;font-size:15px;line-height:1.35}
.mp .ct{background:var(--soft);border-radius:6px;padding:6px 8px;font-size:15px;line-height:1.35;font-weight:700}
.mp .k{font-size:13px;color:#8a8f99;line-height:1.45;margin:2px 0 8px}
.mp .bd{margin-top:8px;font-size:15px;font-weight:700;color:var(--no)}
.mp .bd small{font-size:12px;letter-spacing:.06em;margin-right:6px;border:1px solid var(--no);border-radius:4px;padding:0 5px;font-weight:600}
.trend{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.6}
.next{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.next button{max-width:560px;margin:0 auto}
.sheet{position:fixed;left:0;right:0;bottom:78px;margin:0 auto;max-width:520px;background:#1c1f26;color:#fff;border-radius:14px;padding:12px 16px;font-size:16px;z-index:5}
.sheet small{display:block;font-size:13px;color:#a9b0bd;margin-top:2px}
.res{display:flex;flex-direction:column;gap:6px}
.res .it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.res .it i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:9px;background:var(--ok)}.res .it i.no{background:var(--no)}
.tp{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.tp .l{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tp .l span{flex:1 1 100%;color:var(--mute);font-size:13px}
.tp button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}.tp button.on{background:var(--accent);border-color:var(--accent);color:#fff}
</style></head><body>
<div class="wrap" id="app"></div>
<div class="sheet hide" id="sheet"></div>
<div class="next hide" id="nx"><button class="go" id="nb"></button></div>
<script>
var DATA={"Q":[{"pre":"Their team members led by a newly appointed team leader ","a":"has","b":"have","post":" published important findings in a science journal.","ans":"b","sl":[["Their team members led by a newly appointed team leader","새로 임명된 팀 리더가 이끄는 그들의 팀 구성원들이"],["have published important findings","중요한 연구 결과를 실었다"],["in a science journal.","과학 잡지에."]],"ko":"새로 임명된 팀 리더가 이끄는 그들의 팀 구성원들이 과학 잡지에 중요한 연구 결과를 실었다.","fm":"핵심 주어 + 동사 (수 일치)","mp":{"h":["핵심 주어","주어를 꾸미는 말","동사"],"e":["The boys","in the red hats","like"],"t":["members","led by a newly appointed team leader","have"]},"ex":"The boys in the red hats like dogs.","exko":"빨간 모자를 쓴 소년들은 개를 좋아해요.","bad":"The boys in the red hats likes dogs.","badko":"(boys가 여러 명이라서 likes가 아니라 like여야 해요)","why":"동사의 주어는 leader(리더)가 아니라 members(구성원들)예요. led by(~가 이끄는) ... leader는 members를 꾸미는 말이라서 괄호로 묶고 지우면 'Their team members have published(그들의 팀 구성원들이 발표했다)'가 남아요. members는 여러 명이라 has가 아니라 have가 맞아요. 바로 앞의 leader가 한 명이라서 has를 고르기 쉬운데, 그게 함정이에요.","trend":"<b>출제 6위 · 수식받는 주어의 수일치</b><br>31년간 57회 나왔어요. 최근 9년은 정답 16번, 오답 보기 38번이에요.<br>주어 뒤 수식어는 괄호로 묶고 진짜 주어를 찾아요","dict":{"led":"lead(이끌다)의 과거분사형","newly":"새롭게","appointed":"appoint(임명하다)의 과거분사형","has":"have(가지다)의 3인칭 단수형","have":"have(가지다)의 현재형(have + p.p.로 현재완료를 만드는 말)","published":"publish(싣다, 발행하다)의 과거분사형","findings":"finding(연구 결과)의 복수형","journal":"잡지, 학술지","members":"member(구성원)의 복수형","their":"그들의","by":"~에 의해","a":"하나의","in":"~에","team":"팀","important":"중요한","science":"과학","leader":"리더, 지도자"}},{"pre":"A highly perceptive person sensitive to others’ subtle and complex emotions ","a":"understand","b":"understands","post":" people better.","ans":"b","sl":[["A highly perceptive person sensitive to others’ subtle and complex emotions","다른 사람의 미묘하고 복잡한 감정에 민감한 매우 예민한 사람은"],["understands people better.","사람들을 더 잘 이해한다."]],"ko":"다른 사람의 미묘하고 복잡한 감정에 민감한 매우 예민한 사람은 사람들을 더 잘 이해한다.","fm":"핵심 주어(단수) + 동사 -s","mp":{"h":["핵심 주어(단수)","주어를 꾸미는 말","동사"],"e":["The boy","in the red hat","likes"] function show(){
  var qi=PL[cur.k],d=Q[qi],pos=cur.k-cur.from;
  var dots='';for(var i=cur.from;i<cur.to;i++){var r=S.res[i];dots+='<i class="'+(i==cur.k?'on':(r===1?'ok':(r===0?'no':'')))+'"></i>'}
  var h='<div class="top"><button class="bk" id="bk">목록</button><span>'+(pos+1)+' / '+(cur.to-cur.from)+'</span><div class="dots">'+dots+'</div></div>';
  h+='<div class="card"><div class="q">'+tk(d.pre)+'<span class="br">[ '+tk(d.a)+' / '+tk(d.b)+' ]</span>'+tk(d.post)+'</div><div class="mute" style="margin-top:6px">모르는 단어는 눌러서 뜻 확인</div></div>';
  h+='<div class="card" id="s2"><p class="lbl">정답 고르기</p><div class="row"><button class="ab" data-k="a">'+esc(d.a)+'</button><button class="ab" data-k="b">'+esc(d.b)+'</button></div></div>';
  h+='<div class="card hide" id="exp"></div>';
  $("#app").innerHTML=h;$("#nx").classList.add("hide");$("#sheet").classList.add("hide");cur.step=1;
  $("#bk").onclick=home;window.scrollTo(0,0);
  if(S.res[cur.k]!=null&&cur.review)pick(S.res[cur.k]===1?d.ans:(d.ans=="a"?"b":"a"),true);
}
function pick(k,quiet){
  var d=Q[PL[cur.k]];if(cur.step!=1)return;cur.step=2;var ok=k==d.ans;
  if(!quiet&&!cur.review){S.res[cur.k]=ok?1:0;save()}
  [].forEach.call(document.querySelectorAll(".ab"),function(x){if(x.dataset.k==d.ans)x.classList.add("ok");else if(x.dataset.k==k)x.classList.add("no")});
  var e=$("#exp");e.classList.remove("hide");
  var tr=d.trend||"";
  e.innerHTML='<div class="sec"><h4>정답</h4><b style="font-size:20px">'+esc(d[d.ans])+'</b></div>'
  +'<div class="sec"><h4>직독직해</h4><div class="sl">'+d.sl.map(function(c){return '<div class="r"><b>'+tk(c[0])+'</b><span>'+esc(c[1])+'</span></div>'}).join('')+'</div></div>'
  +'<div class="sec"><h4>자연스러운 해석</h4><div class="nat">'+esc(d.ko)+'</div></div>'
  +bx(d)
  +'<div class="sec"><h4>왜 그럴까요</h4><div class="tx">'+esc(d.why).replace(/\n/g,'<br>')+'</div></div>'
  +(tr?'<div class="sec trend">'+tr+'</div>':'');
  var last=cur.k==cur.to-1;$("#nx").classList.remove("hide");$("#nb").textContent=last?"오늘 학습 마치기":"다음 문제";
  e.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function adv(){
  if(!cur.review){S.pos=Math.max(S.pos,cur.k+1);save()}
  if(cur.k<cur.to-1){cur.k++;show()}else finish();
}
function finish(){
  $("#nx").classList.add("hide");$("#sheet").classList.add("hide");
  var ok=0,tot=cur.to-cur.from,list='';
  for(var i=cur.from;i<cur.to;i++){var r=S.res[i],d=Q[PL[i]];if(r===1)ok++;
    list+='<div class="it"><i class="'+(r===1?'':'no')+'"></i><div>'+esc(d.pre+d[d.ans]+d.post)+'</div></div>'}
  var nw=Object.keys(S.words).length;
  $("#app").innerHTML='<div class="card"><div class="sum"><b>'+ok+'</b><span class="mute">/ '+tot+' 정답</span></div><p class="mute" style="margin:6px 0 0">누적 단어 '+nw+'개가 오답노트에 쌓였어요</p></div><div class="card res"><p class="lbl">오늘의 문장</p>'+list+'</div><button class="go" id="hm">목록으로</button>';
  $("#hm").onclick=home;window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
  var t=e.target;
  var w=t.closest&&t.closest(".w");
  if(w&&cur){var d=Q[PL[cur.k]],k=w.dataset.w,v=lookup(d.dict,k);if(v==null)return;
    var m=/^([A-Za-z][A-Za-z’' \-]*)\((.+?)\)(?:의 (.*))?$/.exec(v),base=m?m[1]:k,mean=m?m[2]:v,form=m&&m[3]?m[3]:"";
    {w.classList.add("lk");S.words[base.toLowerCase()]={m:mean,src:"데일리어법"};save();
      if(window.WN&&WN.add){try{WN.add({w:base.toLowerCase(),m:mean,src:"데일리어법"})}catch(x){}}}
    var sh=$("#sheet");sh.classList.remove("hide");
    sh.innerHTML=(base.toLowerCase()!=k?esc(k)+' → ':'')+'<b>'+esc(base)+'</b>('+esc(mean)+')'+(form?'<small>'+esc(k)+' = '+esc(base)+'의 '+esc(form)+'</small>':'')+'<small>오답노트에 '+esc(base.toLowerCase())+' 가 쌓였어요</small>';
    clearTimeout(window._st);window._st=setTimeout(function(){sh.classList.add("hide")},4000);return}
  var a=t.closest&&t.closest(".ab");if(a&&cur){pick(a.dataset.k);return}
  var g=t.closest&&t.closest("[data-go]");if(g){startS(+g.dataset.go);return}
  var s=t.closest&&t.closest(".sb");if(s&&!s.classList.contains("lk")){var si=+s.dataset.s,cs=Math.floor(S.pos/S.n);if(si<cs)reviewS(si);else startS(si);return}
  var nn=t.closest&&t.closest("[data-n]");if(nn){var pos=S.pos;S.n=+nn.dataset.n;save();home();teacher();return}
  var op=t.closest&&t.closest("[data-op]");if(op){S.open=op.dataset.op=="1";save();home();teacher();return}
  var rs=t.closest&&t.closest("[data-rs]");if(rs){if(rs.dataset.armed){S.pos=0;S.res={};save();home();return}rs.dataset.armed=1;rs.textContent="한 번 더 누르면 처음부터";return}
});
$("#nb").onclick=adv;
home();
</script></body></html>
