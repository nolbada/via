 chList().forEach(c=>{const L=chItems(c),d=doneOf(L);
  h+='<button class="row" onclick="openCh('+c+')"><span><b>CHAPTER '+pad2(c)+'</b> '+CHAPS[c].name+'</span><span class="pill '+(d==L.length?"on":"")+'">'+d+' / '+L.length+'</span></button>'});

 let h='<div class="bk"><a onclick="go(\'home\')">목록</a><span class="small">CHAPTER '+pad2(c)+'</span></div><h2>'+CHAPS[c].name+'</h2>';
 CHAPS[c].units.forEach(k=>{const uk=c+"-"+k,L=unItems(uk),U=UN[uk];if(!L.length)return;const d=doneOf(L);
  h+='<button class="row" onclick="start(\''+uk+'\')"><span><b>'+U.n+'</b> '+U.t+'<span class="small"> · '+(U.cp?"개념 "+U.cp+" · ":"")+"문제 "+U.pp+'</span></span><span class="pill '+(d==L.length?"on":"")+'">'+d+' / '+L.length+'</span></button>'});
 R(h)}
function start(uk){const L=unItems(uk),n=L.find(x=>!st(x.id).pen)||L[0];open_(n.id)}
function open_(id){cur=id;sh=st(id).h||0;wrong=0;go("item")}
function dq(it){if(it.kind!="c")return it.q;const i=it.q.indexOf("①");if(i<0)return it.q;
 const n=t=>t.replace(/<[^>]+>/g,"").replace(/&nbsp;/g,"").replace(/[①-⑦\s]/g,"");
 if(n(it.q.slice(i))!=n(it.opts.join("")))return it.q;
 return it.q.slice(0,i).replace(/(<br>|&nbsp;|\s)+$/,"")}
function item(){
 const it=IT(cur),s=st(cur),U=UN[it.uk],L=unItems(it.uk);
 let h='<div class="bk"><a onclick="openCh('+it.ch+')">목록</a><span class="small">CH'+pad2(it.ch)+' · '+U.n+' · '+SECLAB(it)+'</span></div>';
 h+='<div class="q">'+dq(it).replace(/___/g,'<span class="blank"></span>')+'</div>';
 if(it.bank)h+='<div class="small">보기 : '+it.bank.join(" · ")+' (한 번씩만)</div>';
 if(it.kind=="w"&&!s.rev)h+='<div class="small">본책에 직접 써요.</div>';
 h+='<div class="hint">';
 for(let i=0;i<3;i++){h+=i<sh?'<div class="hp"><b>힌트 '+(i+1)+'</b> '+it.h[i]+'</div>':(i==sh?'<button class="btn ghost" onclick="openHint()">힌트 '+(i+1)+' 열기 : '+["본책 어디?","생각 순서","거의 답"][i]+'</button>':'')}
 h+='</div>';
 if(!s.rev){
  if(it.kind=="c")h+='<div class="opts">'+it.opts.map((o,i)=>'<button class="opt" onclick="pick('+i+')">'+o+'</button>').join("")+'</div>'+(wrong?'<div class="note">다시 한 번 골라 봐요. 힌트를 열어서 따라가 보세요.</div>':'');
  else h+='<button class="btn" onclick="wrote()">다 썼어요 · 답 보기</button>';
 }else{
  h+='<div class="ans"><div class="small">정답</div><b>'+it.full+'</b><div class="small">'+it.ko+'</div></div>';
  if(it.kind=="w"&&s.self==null)h+='<div class="note">내가 쓴 답과 비교해 보세요.</div><div class="two"><button class="btn" onclick="selfck(1)">똑같이 썼어요</button><button class="btn ghost" onclick="selfck(0)">고쳐 썼어요</button></div>';
  else{
   h+='<div class="post"><div class="pt">'+PEN+' 책에 쓰기 · 본책 '+U.pp+' 이 문제 옆 여백에 이 한 줄만</div><div class="pl">'+it.pen+'</div><div class="pt2">맞혔어도 이 한 줄은 꼭 써요.</div></div>';
   if(!s.pen)h+='<button class="btn pencil" onclick="penDone()">'+PEN+' 다 썼어요</button>';
   else{const last=L[L.length-1].id==cur;h+='<div class="small ok">연필 한 줄 완료</div><button class="btn" onclick="nextItem()">'+(last?"이 파트 마무리":"다음 문제")+'</button>'}
  }
 }
 R(h)}
function openHint(){sh++;st(cur).h=Math.max(st(cur).h,sh);save();render()}
function pick(i){const it=IT(cur),s=st(cur);s.tries++;
 if(it.opts[i]==it.ans){s.rev=1;s.ok=s.tries==1?1:0}
 else{wrong++;if(wrong>=2){s.rev=1;s.ok=0}}save();render()}
function wrote(){st(cur).rev=1;save();render()}
function selfck(v){const s=st(cur);s.self=v;s.ok=v;save();render()}
function penDone(){st(cur).pen=1;save();render()}
function nextItem(){const it=IT(cur),L=unItems(it.uk),i=L.findIndex(x=>x.id==cur);
 if(i==L.length-1){go("unitend");return}open_(L[i+1].id)}
function unitend(){const it=IT(cur),L=unItems(it.uk),U=UN[it.uk];
 const ok=L.filter(x=>st(x.id).ok).length,hs=L.reduce((a,x)=>a+st(x.id).h,0);
 R('<div class="bk"><a onclick="openCh('+it.ch+')">목록</a></div><h2>'+U.n+' 끝</h2><div class="small">처음에 바로 맞힌 문제 '+ok+' / '+L.length+' · 힌트 사용 '+hs+'회</div><div class="post"><div class="pt">'+PEN+' 오늘 쓴 줄 모아 보기</div>'+L.map(x=>'<div class="pl"><span class="small">'+SECSHORT(x)+'</span> '+x.pen+'</div>').join("")+'</div><button class="btn" onclick="openCh('+it.ch+')">목록으로</button>')}
function pin(){pinv="";pinui()}
function pinui(){R('<div class="bk"><a onclick="go(\'home\')">목록</a></div><h2>선생님 확인</h2><div class="dots">'+[0,1,2,3].map(i=>'<i class="'+(i<pinv.length?"f":"")+'"></i>').join("")+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9,"",0,"←"].map(k=>k===""?'<span></span>':'<button onclick="pk(\''+k+'\')">'+k+'</button>').join("")+'</div>')}
function pk(k){if(k=="←")pinv=pinv.slice(0,-1);else if(pinv.length<4)pinv+=k;if(pinv.length==4){if(pinv==PIN){tab="stuck";go("teacher");return}pinv=""}pinui()}
function teacher(){
 let h='<div class="bk"><a onclick="go(\'home\')">나가기</a><span class="small">선생님 화면</span></div><div class="tabs">'+[["stuck","막힌 문제"],["ctl","관리"]].map(([k,n])=>'<button class="'+(tab==k?"on":"")+'" onclick="tab=\''+k+'\';render()">'+n+'</button>').join("")+'</div>';
 if(tab=="stuck"){
  const pen=ITEMS.filter(x=>st(x.id).pen).length;
  h+='<div class="small">이 기기에서 푼 기록입니다. 실시간 연결은 EM보드에 넣을 때 붙입니다.</div><div class="card"><b>연필 한 줄 완료</b> '+pen+' / '+ITEMS.length+'</div>';
  chList().forEach(c=>{const L=chItems(c);h+='<div class="small">CHAPTER '+pad2(c)+' '+CHAPS[c].name+' : '+doneOf(L)+' / '+L.length+'</div>'});
  const S2=ITEMS.filter(x=>st(x.id).h>=2||st(x.id).ok===0);
  h+='<div class="small" style="margin-top:10px">막힌 문제 (힌트 2단계 이상 또는 바로 못 맞힘)</div>';
  if(!S2.length)h+='<div class="card small">아직 없어요.</div>';
  S2.forEach(x=>{const s=st(x.id);h+='<div class="card"><b>CH'+pad2(x.ch)+' · '+UN[x.uk].n+' · '+SECLAB(x)+'</b><div class="small">힌트 '+s.h+'단계 · 시도 '+s.tries+'회</div><div class="small">'+x.pen+'</div></div>'});
  h+='<div class="small">힌트를 3단계까지 써도 못 맞히면 개념을 오프라인으로 설명하고, 힌트 없이 바로 맞히면 다음 난이도로 넘겨요.</div>';
 }else h+='<div class="card"><b>초기화</b><div class="small">이 기기의 기록을 지웁니다.</div><button class="btn ghost" onclick="S=fresh();save();go(\'home\')">지우기</button></div>';
 R(h)}
render();
</script></body></html>
