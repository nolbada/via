<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* layout: one phone-width column; five post-it notes stacked, a fixed "write this" bar at the bottom */
:root{
  --bg:#EEF1F5;
  --paper:#FFFFFF;
  --ink:#16202E;
  --muted:#5D6B7E;
  --line:#D5DBE4;
  --accent:#2349C9;
  --postit:#FFF0A0;
  --postit-edge:#EBD96A;
  --postit-ink:#2B2A1E;
  --postit-sub:#6B6640;
  --bar:#16202E;
  --bar-ink:#FFFFFF;
  --bar-sub:#AEB9C9;
  --warn:#B3261E;
  --warn-soft:#FBE9E7;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --hand:"Gaegu","Noto Sans KR","Malgun Gothic",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B;--paper:#171E29;--ink:#E8EDF4;--muted:#93A0B3;--line:#2A3444;--accent:#8AA6FF;
    --bar:#05080D;--warn:#FF8F85;--warn-soft:#3A1F1D;color-scheme:dark}
}
:root[data-theme="dark"]{
  --bg:#0E131B;--paper:#171E29;--ink:#E8EDF4;--muted:#93A0B3;--line:#2A3444;--accent:#8AA6FF;
  --bar:#05080D;--warn:#FF8F85;--warn-soft:#3A1F1D;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
.frame{max-width:480px;margin:0 auto;padding-block:20px 220px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sample{font-size:12px;color:var(--muted);margin:0 0 14px;letter-spacing:.02em}
header .where{font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:500;letter-spacing:.04em}
header h1{margin:0;font-size:26px;line-height:1.25;font-weight:900;letter-spacing:-.01em}
h2{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:26px 0 12px}

/* post-it */
.pi{background:var(--postit);color:var(--postit-ink);border-radius:2px 2px 14px 2px;padding:14px 16px 14px;margin:0 0 18px;box-shadow:0 1px 0 var(--postit-edge),0 6px 14px rgba(0,0,0,.14);position:relative}
.pi:nth-child(odd){transform:rotate(-.5deg)}
.pi:nth-child(even){transform:rotate(.4deg)}
.pi .no{font-size:12px;letter-spacing:.08em;color:var(--postit-sub);font-weight:700;margin:0}
.pi h3{margin:2px 0 10px;font-family:var(--serif);font-size:21px;line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.pi .r{display:grid;grid-template-columns:minmax(0,1fr);gap:0;padding:6px 0;border-top:1px dashed var(--postit-edge)}
.pi .r .w{font-family:var(--serif);font-weight:600;font-size:16px}
.pi .r .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;margin-left:8px}
.pi .r .m{font-size:13px;color:var(--postit-sub)}
.pi .r .s{font-family:var(--hand);font-size:19px;line-height:1.3;font-weight:700;margin-top:2px}
.pi .care{font-family:var(--hand);font-size:20px;line-height:1.35;font-weight:700;margin:8px 0 0;padding-top:8px;border-top:2px solid var(--postit-ink)}
.pi .care b{font-weight:700;color:var(--warn)}
:root[data-theme="dark"] .pi .care b{color:#B3261E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pi .care b{color:#B3261E}}
.pi .ex{font-size:13px;margin:8px 0 0;color:var(--postit-sub)}
.pi .ex i{font-family:var(--serif);color:var(--postit-ink)}
.pi .fix{margin-top:10px}
.pi .fix label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.pi .fix input{width:100%;font:inherit;font-family:var(--serif);font-size:15px;color:var(--postit-ink);background:rgba(255,255,255,.55);border:1px solid var(--postit-edge);border-radius:6px;padding:8px 10px}
.pi .fix input:focus{outline:2px solid var(--accent);outline-offset:1px}
.chk{all:unset;box-sizing:border-box;cursor:pointer;margin-top:12px;display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:700;padding:6px 12px 6px 8px;border:1.5px solid var(--postit-ink);border-radius:999px}
.chk i{width:18px;height:18px;border:1.5px solid var(--postit-ink);border-radius:4px;display:inline-block;position:relative}
.chk[aria-pressed="true"]{background:var(--postit-ink);color:var(--postit)}
.chk[aria-pressed="true"] i{background:var(--postit);border-color:var(--postit)}
.chk[aria-pressed="true"] i::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--postit-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--bar-ink);padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:480px;margin:0 auto}
.bar .ttl{font-size:12px;letter-spacing:.1em;color:var(--bar-sub);font-weight:700;margin:0}
.bar .do{font-size:19px;font-weight:900;margin:2px 0 10px;line-height:1.35}
.bar .row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar .cnt{font-variant-numeric:tabular-nums;font-size:14px;color:var(--bar-sub)}
.done{all:unset;box-sizing:border-box;cursor:pointer;background:#FFE27A;color:#16202E;font-weight:900;border-radius:8px;padding:10px 20px;font-size:15px}
.done[aria-disabled="true"]{opacity:.35;cursor:not-allowed}
.done:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* result */
.proof{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}
.proof .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
.line{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:9px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .i{color:var(--muted);font-variant-numeric:tabular-nums}
.line .w1{font-family:var(--serif);font-weight:600;font-size:17px;overflow-wrap:anywhere}
.reveal{background:var(--warn-soft);border-radius:10px;padding:14px;margin-top:14px}
.reveal h3{margin:0 0 8px;font-size:14px;color:var(--warn)}
.reveal .lbl{font-size:12px;color:var(--muted);margin:6px 0 0}
.reveal .a{font-family:var(--serif);font-size:16px;margin:0;overflow-wrap:anywhere}
.reveal .a.x{text-decoration:line-through;text-decoration-color:var(--warn)}
.reveal .a.ok{font-weight:600}
.reveal .why{font-size:13px;margin:8px 0 0}
.back{all:unset;cursor:pointer;color:var(--accent);font-weight:700;font-size:14px;margin-top:14px;display:inline-block}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pi{transform:none!important}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:5px 11px;border:1.5px solid var(--line);border-radius:999px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#usel{font:inherit;font-size:13px;font-weight:700;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pi .key{margin:8px 0 0;font-size:13px;font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.pi .key span{font-variant-numeric:tabular-nums;font-size:15px;font-family:var(--serif)}
.bar .sub{font-size:13px;color:var(--bar-sub);margin:-6px 0 10px}
.egg{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 18px}
.egg label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.egg .sent{font-family:var(--serif);font-size:16px;margin:0 0 8px;overflow-wrap:anywhere}
.egg input{width:100%;font:inherit;font-family:var(--serif);font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.egg input:focus{outline:2px solid var(--accent);outline-offset:1px}
</style>

function pad(n){return n<10?"0"+n:""+n}
function render(){
  var y=window.pageYOffset,u=U(),s=S(),n=u.cards.length;
  var h='<div class="tabs">';
  if(window.TWO)["고교","수능"].forEach(function(t){h+='<button class="tab" data-t="'+t+'" aria-pressed="'+(u.track===t)+'">'+t+'편</button>'});
  h+='<select id="usel" aria-label="UNIT 선택">';
  UNITS.forEach(function(x,i){if(x.track===u.track)h+='<option value="'+i+'"'+(i===cur?' selected':'')+'>UNIT '+pad(x.no)+'</option>'});
  h+='</select>';
  h+='</div><header><p class="where">보카스위치 '+u.track+' · UNIT '+u.no+'</p><h1>이것만은 꼭!</h1></header>';
  if(view==="done"){app.innerHTML=h+renderDone();bind();document.getElementById("back").onclick=function(){view="edit";render();window.scrollTo(0,0)};return}
  h+='<h2>오늘의 메모</h2>';
  u.cards.forEach(function(c,i){
    h+='<section class="pi"><p class="no">오늘의 메모 '+(i+1)+'</p><h3>'+esc(c.t)+'</h3>';
    c.rows.forEach(function(r){h+='<div class="r"><div><span class="w">'+esc(r[0])+'</span><span class="n">'+esc(r[1])+'</span></div><div class="m">'+esc(r[2])+'</div><div class="s">'+esc(r[3])+'</div></div>'});
    h+='<p class="care">'+esc(c.care)+'</p>';
    if(c.ex)h+='<p class="ex"><i>'+esc(c.ex.en)+'</i> ('+esc(c.ex.ko)+')</p>';
    h+='<p class="key">대표 문장 '+c.key.map(function(k){return '<span>#'+k+'</span>'}).join(' ')+'</p>';
    h+='<button class="chk" data-i="'+i+'" aria-pressed="'+s.done[i]+'"><i></i>책에 옮겨 씀</button></section>';
  });
  if(u.egg)h+='<div class="egg"><label for="fix">#'+u.egg.n+' 문장 어색한 곳 1군데 고쳐 쓰기</label><p class="sent">'+esc(u.egg.wrong)+'</p><input id="fix" type="text" maxlength="80" value="'+esc(s.fix)+'" autocomplete="off"></div>';
  h+='<div class="bar"><div class="in"><p class="ttl">오늘 꼭 쓸 것</p><p class="do">책 UNIT '+u.no+' 여백에<br>메모 '+n+'장 + 대표 문장 10개 영어로 쓰고 해석</p><p class="sub">틀린 문제 : 번호 체크 + 단어 뜻만</p><div class="row"><span class="cnt">옮겨 씀 '+cnt()+' / '+n+'</span><button class="done" id="done" aria-disabled="'+(cnt()<n)+'">메모 완성</button></div></div></div>';
  app.innerHTML=h;bind();
  Array.prototype.forEach.call(app.querySelectorAll(".chk"),function(b){b.onclick=function(){var i=+b.getAttribute("data-i");s.done[i]=!s.done[i];render()}});
  var f=document.getElementById("fix");if(f)f.oninput=function(){s.fix=f.value};
  var d=document.getElementById("done");d.onclick=function(){if(d.getAttribute("aria-disabled")==="true")return;view="done";render();window.scrollTo(0,0)};
  window.scrollTo(0,y);
}
function bind(){Array.prototype.forEach.call(app.querySelectorAll(".tab"),function(b){b.onclick=function(){var t=b.getAttribute("data-t");if(UNITS[cur].track===t)return;for(var i=0;i<UNITS.length;i++)if(UNITS[i].track===t){cur=i;break}view="edit";render();window.scrollTo(0,0)}});var sl=document.getElementById("usel");if(sl)sl.onchange=function(){cur=+sl.value;view="edit";render();window.scrollTo(0,0)}}
function renderDone(){
  var u=U(),s=S();
  var h='<h2>인증</h2><div class="proof"><div class="meta"><span>UNIT '+u.no+'</span><span>'+dateStr()+'</span></div>';
  u.cards.forEach(function(c,i){h+='<div class="line"><span class="i">'+(i+1)+'</span><span class="w1">'+esc(c.t)+'<br><span style="font-size:13px;color:var(--muted);font-family:var(--sans)">대표 문장 '+c.key.map(function(k){return '#'+k}).join('  ')+'</span></span></div>'});
  h+='</div>';
  if(u.egg){var f=u.egg;h+='<div class="reveal"><h3>숨은그림 확인 : '+f.n+'번</h3><p class="lbl">책 문장</p><p class="a x">'+esc(f.wrong)+'</p><p class="lbl">내가 고친 문장</p><p class="a">'+(s.fix.trim()?esc(s.fix):'(작성 없음)')+'</p><p class="lbl">정답</p><p class="a ok">'+esc(f.right)+'</p><p class="why">'+esc(f.why)+'</p></div>'}
  h+='<button class="back" id="back">메모 다시 보기</button>';
  return h;
}
render();
</script>
