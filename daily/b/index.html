the visitors]] to the gate.","경비원이 문까지 [[방문객들을 호위할]] 것이다."],["The nurse [[escorted him]] to his room.","간호사가 방까지 [[그를 안내했다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"inventory","a":"4","e":"④ inventory: (완전한 목록 / 모든 물품의 / 상점이나 회사가 재고로 가지고 있는) 재고, 재고 목록 (가게나 회사가 보유한 모든 상품의 전체 목록)","w":"① warranty: 품질 보증서\n② invoice: 송장, 청구서\n③ receipt: 영수증","k":"완전한 목록 / 모든 물품의 / 상점이나 회사가 재고로 가지고 있는","m":0,"s":"\"a complete list of all the goods that a shop or a company has in stock\"","c":["warranty","invoice","receipt","inventory"],"mn":"재고, 재고 목록 (가게나 회사가 보유한 모든 상품의 전체 목록)","hk":"inventory(재고 목록)는 가게가 가진 상품 전체 목록. receipt(영수증), invoice(송장), warranty(품질 보증서)는 거래 서류일 뿐 재고 목록은 아님.","ex":[["The store has [[a large inventory]] of toys.","그 가게는 장난감 [[재고가 많다]]."],["We must [[check the inventory]] every Monday.","우리는 월요일마다 [[재고를 확인해야]] 한다."],["The manager asked us to [[take inventory]] before closing.","관리자는 우리에게 마감 전에 [[재고 조사를 하라고]] 했다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"admire","a":"3","e":"③ despise: 경멸하다, 깔보다 (선수들은 정직함과 성실함 때문에 새 코치를 존경한다.) / admire(존경하다, 감탄하다)의 반의어.","w":"① cherish: 소중히 여기다\n② worship: 숭배하다\n④ adore: 아주 좋아하다, 흠모하다","k":"선수들은 정직함과 성실함 때문에 새 코치를 존경한다.","m":0,"s":"The players admire their new coach for his honesty and hard work.","h":"admire","c":["cherish","worship","despise","adore"],"mn":"존경하다, 감탄하다","hk":"admire(존경하다)의 반대편은 despise(경멸하다). cherish(소중히 여기다), worship(숭배하다), adore(아주 좋아하다)는 같은 편이라 속임수.","ex":[["We [[admire her courage]].","우리는 [[그녀의 용기를 존경한다]].","admire (동) 존경하다, 감탄하다"],["Many people [[despise liars]].","많은 사람들은 [[거짓말쟁이를 경멸한다]].","despise (동) 경멸하다, 깔보다"],["He [[despised himself]] for telling a lie.","그는 거짓말을 한 것에 대해 [[자신을 경멸했다]].","despise (동) 경멸하다, 깔보다"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"diploma","a":"diploma","e":"diploma 졸업장","k":"졸업식에서 각 학생은 교장 선생님에게서 졸업장을 받았다.","m":0,"s":"At the graduation ceremony each student received a d______ from the principal.","mn":"졸업장","hk":"diploma(졸업장)는 '디-플로-마'로 끊어 쓰기. 가운데 o를 빠뜨리지 않기. graduation(졸업)식에서 받는 종이로 기억.","ex":[["She received [[a high school diploma]] last June.","그녀는 지난 6월에 [[고등학교 졸업장]]을 받았다."],["He hung [[his diploma]] on the office wall.","그는 사무실 벽에 [[졸업장]]을 걸었다."],["It takes four years to [[earn a diploma]] here.","여기서 [[졸업장을 따려면]] 4년이 걸린다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"represents","a":"1","e":"①나타내다, 상징하다 / ②대표하다 / ③대표하다 / ④대표하다 [①번만 의미가 다름]","k":"①그래프의 빨간 선은 각 달의 평균 강우량을 나타낸다.\n②세 명의 학생이 학생회 회의에서 자기 반을 대표할 것이다.\n③그녀는 전국 말하기 대회에서 우리 학교를 대표하도록 선발되었다.\n④그는 국제 로봇 대회에서 자기 나라를 대표했다.","m":0,"c":["The red line on the graph represents the average rainfall of each month.","Three students will represent their class at the student council meeting.","She was chosen to represent our school at the national speech contest.","He represented his country at the international robot competition."],"hc":"represents|represent|represent|represented","mn":"대표하다 / 나타내다, 상징하다","hk":"represent(나타내다, 상징하다)는 ①번만의 뜻. 나머지 셋은 사람이 단체를 대신하는 represent(대표하다). 주어가 사물이면 나타내다, 사람이면 대표하다.","ex":[["A white dove [[represents peace]].","흰 비둘기는 [[평화를 상징한다]].","represent (동) 나타내다, 상징하다"],["Two students will [[represent the class]] at the meeting.","두 학생이 회의에서 [[반을 대표할]] 것이다.","represent (동) 대표하다"],["She [[represented her country]] at the Olympics.","그녀는 올림픽에서 [[자기 나라를 대표했다]].","represent (동) 대표하다"]]}]},{"day":37,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"suburb","a":"3","e":"③ suburb: 교외, 근교","w":"① province: 지방, 주\n② estate: 사유지, 토지\n④ wilderness: 황야, 황무지","m":0,"s":"\"교외, 근교\"","c":["province","estate","suburb","wilderness"],"mn":"교외, 근교","hk":"suburb(교외)는 도시 바깥의 주택가. province(지방), estate(사유지), wilderness(황야)와 구분.","ex":[["They live in [[a quiet suburb]] of Seoul.","그들은 서울의 [[조용한 교외]]에 산다."],["Many families move to [[the suburbs]] for bigger houses.","많은 가족이 더 큰 집을 위해 [[교외]]로 이사한다."],["He grew up in [[a suburb of London]].","그는 [[런던 교외]]에서 자랐다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"enormous","a":"3,4","e":"③ gigantic: 거대한\n④ tremendous: 엄청난, 거대한 (거대한 파도가 작은 고깃배 앞에서 갑자기 솟아올랐다.) / enormous(거대한, 막대한)의 유의어.","w":"① shallow: 얕은\n② compact: 소형의, 작고 조밀한","k":"거대한 파도가 작은 고깃배 앞에서 갑자기 솟아올랐다.","m":2,"s":"An enormous wave suddenly rose in front of the small fishing boat.","h":"enormous","c":["shallow","compact","gigantic","tremendous"],"mn":"거대한, 막대한","hk":"enormous(거대한)는 gigantic(거대한), tremendous(엄청난)와 같은 편. shallow(얕은)와 compact(소형의)는 크기가 반대 방향.","ex":[["We saw [[an enormous wave]] from the beach.","우리는 해변에서 [[거대한 파도]]를 보았다."],["He earned [[an enormous amount of money]].","그는 [[막대한 돈]]을 벌었다."],["The dinosaur's skeleton was [[enormous]].","공룡의 뼈대는 [[거대했다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"tenant","a":"2","e":"② tenant: (정기적으로 돈을 내는 사람 / 집이나 방에 살기 위해 / 다른 사람에게 속한) 세입자, 임차인 (다른 사람에게 속한 집이나 방에 살기 위해 정기적으로 돈을 내는 사람)","w":"① heir: 상속인, 후계자\n③ vendor: 행상인, 노점 상인\n④ landlord: 임대인, 집주인","k":"정기적으로 돈을 내는 사람 / 집이나 방에 살기 위해 / 다른 사람에게 속한","m":0,"s":"\"a person who pays money regularly to live in a house or room that belongs to someone else\"","c":["heir","tenant","vendor","landlord"],"mn":"세입자, 임차인 (다른 사람에게 속한 집이나 방에 살기 위해 정기적으로 돈을 내는 사람)","hk":"tenant(세입자)는 집세를 내는 쪽, landlord(집주인)는 집을 빌려 주는 쪽. 짝꿍이라 뒤바꾸기 쉬운 함정.","ex":[["[[The tenant]] pays the rent on the first of each month.","[[세입자]]는 매달 1일에 집세를 낸다."],["She has been [[a tenant]] in this building for five years.","그녀는 이 건물에서 5년째 [[세입자]]로 산다."],["The landlord told [[the tenants]] to keep the hall clean.","집주인은 [[세입자들]]에게 복도를 깨끗이 하라고 말했다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"corridor","a":"corridor","e":"corridor 복도, 회랑","k":"두 건물을 연결하는 좁은 복도가 지진으로 손상되었다.","m":0,"s":"The narrow c______ connecting the two buildings was damaged in the earthquake.","mn":"복도, 회랑","hk":"corridor(복도)는 소리는 '코리도'지만 철자는 r이 두 개 들어감. 끝은 d, o, r 순서로 마무리.","ex":[["The classroom is at the end of [[the long corridor]].","교실은 [[긴 복도]] 끝에 있다."],["Don't run in [[the school corridor]].","[[학교 복도]]에서 뛰지 마라."],["We walked down [[a dark corridor]].","우리는 [[어두운 복도]]를 걸어 내려갔다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"infer","a":"3","e":"infer (동) 추론하다 - inference (명) 추론, 추측\n③ acknowledge (동) 인정하다 - acknowledgment (명) 인정, 승인","w":"① fierce (형) 사나운, 맹렬한 - fierceness (명) 사나움, 맹렬함\n② adverse (형) 부정적인, 불리한 - adversity (명) 역경\n④ decent (형) 괜찮은, 품위 있는 - decency (명) 품위, 예의","m":0,"s":"infer - inference","c":["fierce - fierceness","adverse - adversity","acknowledge - acknowledgment","decent - decency"],"mn":"추론하다","hk":"infer(추론하다) - inference(추론)는 동사 → 명사. 정답 acknowledge(인정하다) - acknowledgment(인정)도 동사 → 명사, 나머지 보기는 모두 형용사 → 명사.","ex":[["From the clouds, we can [[infer]] that it will rain.","구름을 보고 비가 올 것이라고 [[추론할]] 수 있다.","infer (동) 추론하다"],["Scientists [[draw an inference]] from the data.","과학자들은 자료에서 [[추론을 끌어낸다]].","inference (명) 추론, 추측"],["He refused to [[acknowledge his mistake]].","그는 [[자신의 실수를 인정하기를]] 거부했다.","acknowledge (동) 인정하다"],["She received [[acknowledgment]] for her hard work.","그녀는 노력에 대해 [[인정]]을 받았다.","acknowledgment (명) 인정, 승인"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"minimize","a":"2","e":"② maximize: 최대화하다 (새 안전 규칙은 공장에서 사고의 위험을 최소화하기 위해 고안되었다.) / minimize(최소화하다, 최소로 줄이다)의 반의어.","w":"① exaggerate: 과장하다\n③ underestimate: 과소평가하다\n④ reckon: 계산하다, 여기다","k":"새 안전 규칙은 공장에서 사고의 위험을 최소화하기 위해 고안되었다.","m":0,"s":"The new safety rules are designed to minimize the risk of accidents in the factory.","h":"minimize","c":["exaggerate","maximize","underestimate","reckon"],"mn":"최소화하다, 최소로 줄이다","hk":"minimize(최소화하다)의 반대편은 maximize(최대화하다). mini(작은)와 maxi(큰)로 대비. exaggerate(과장하다), underestimate(과소평가하다)는 속임수.","ex":[["We must [[minimize the risk]] of fire.","우리는 화재의 [[위험을 최소화해야]] 한다.","minimize (동) 최소화하다"],["The company wants to [[maximize profits]].","그 회사는 [[이익을 최대화하기를]] 원한다.","maximize (동) 최대화하다"],["She tried to [[maximize her chances]] of winning.","그녀는 이길 [[가능성을 최대한 높이려고]] 노력했다.","maximize (동) 최대화하다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"overwhelm","a":"1","e":"① overwhelm: 압도하다, 당황하게 하다 (그렇게 많은 양의 정보는 경험 많은 연구자조차 압도할 수 있다.)","w":"② flatter: 아첨하다, 우쭐하게 하다\n③ console: 위로하다\n④ ignore: 무시하다","k":"그렇게 많은 양의 정보는 경험 많은 연구자조차 압도할 수 있다.","m":0,"s":"Such a large amount of information can ________ even an experienced researcher.","c":["overwhelm","flatter","console","ignore"],"mn":"압도하다, 당황하게 하다","hk":"overwhelm(압도하다)은 정보나 감정이 한꺼번에 몰려와 사람을 짓누르는 뜻. ignore(무시하다), console(위로하다), flatter(아첨하다)는 흐름에 안 맞음.","ex":[["Too much homework can [[overwhelm students]].","숙제가 너무 많으면 [[학생들을 압도할]] 수 있다."],["She was [[overwhelmed by joy]].","그녀는 [[기쁨에 압도되었다]]."],["The sad news [[overwhelmed him]].","슬픈 소식이 [[그를 압도했다]]."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"spouse","a":"1","e":"① spouse: 배우자","w":"② 형제, 자매(sibling)\n③ 연장자, 어르신(elder)\n④ 남자 조카(nephew)","m":0,"s":"spouse","c":["배우자","형제, 자매","연장자, 어르신","남자 조카"],"mn":"배우자","hk":"spouse(배우자)는 남편이나 아내를 모두 가리키는 말. sibling(형제자매), nephew(남자 조카), elder(연장자)는 가족이지만 배우자는 아님.","ex":[["Please write [[your spouse's name]] here.","여기에 [[배우자의 이름]]을 적어 주세요."],["He thanked [[his spouse]] for the support.","그는 도와준 [[배우자]]에게 감사했다."],["You can bring [[your spouse]] to the party.","파티에 [[배우자]]를 데려와도 된다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"weird","a":"2","e":"② bizarre: 아주 이상한, 기괴한 (그 오래된 기계는 누군가 켤 때마다 이상한 소리를 냈다.) / weird(이상한, 기묘한)의 유의어.","w":"① obscure: 불분명한, 모호한\n③ exotic: 이국적인\n④ absurd: 터무니없는","k":"그 오래된 기계는 누군가 켤 때마다 이상한 소리를 냈다.","m":0,"s":"The old machine made a weird sound every time someone turned it on.","h":"weird","c":["obscure","bizarre","exotic","absurd"],"mn":"이상한, 기묘한","hk":"weird(이상한)는 bizarre(아주 이상한)와 같은 편. obscure(불분명한), exotic(이국적인), absurd(터무니없는)는 비슷해 보여도 뜻이 다름.","ex":[["The machine made [[a weird sound]].","그 기계는 [[이상한 소리]]를 냈다."],["I had [[a weird dream]] last night.","나는 어젯밤 [[이상한 꿈]]을 꾸었다."],["He wore [[weird clothes]] to school.","그는 학교에 [[이상한 옷]]을 입고 왔다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"thirst","a":"thirst","e":"thirst (명) 갈증, 목마름 / (명) 갈망, 열망","k":"주자들은 두 시간 넘게 아무것도 마시지 않았고, 그들의 갈증은 거의 견딜 수 없을 정도가 되었다.\n지식에 대한 그녀의 갈망은 그녀가 자정까지 도서관에서 책을 읽게 했다.","m":0,"s":"The runners drank nothing for over two hours, and their t______ became almost unbearable.\nHer t______ for knowledge kept her reading in the library until midnight.","mn":"갈증, 목마름 / 갈망, 열망","hk":"thirst(갈증)는 물이 마시고 싶은 몸의 느낌, thirst(갈망)는 마음의 간절함. thirst for(~에 대한 갈망)로 짝 기억.","ex":[["He drank water to quench [[his thirst]].","그는 [[갈증]]을 풀려고 물을 마셨다.","thirst (명) 갈증, 목마름"],["Hot weather gave the hikers [[a terrible thirst]].","더운 날씨 때문에 등산객들은 [[심한 갈증]]을 느꼈다.","thirst (명) 갈증, 목마름"],["He has [[a thirst for knowledge]].","그는 [[지식에 대한 갈망]]이 있다.","thirst (명) 갈망, 열망"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"retain","a":"3","e":"③ retain: 보유하다, 유지하다 (그 회사는 가장 재능 있는 기술자들을 계속 보유하기 위해 더 높은 급여를 제시했다.)","w":"① discharge: 해고하다, 내보내다\n② expel: 내쫓다, 추방하다\n④ substitute: 대체하다","k":"그 회사는 가장 재능 있는 기술자들을 계속 보유하기 위해 더 높은 급여를 제시했다.","m":0,"s":"The company offered higher salaries in order to ________ its most talented engineers.","c":["discharge","expel","retain","substitute"],"mn":"보유하다, 유지하다","hk":"retain(보유하다)은 잃지 않고 계속 가지고 있음. discharge(해고하다), expel(내쫓다)은 내보내는 쪽, substitute(대체하다)는 바꾸는 쪽이라 반대.","ex":[["The old walls [[retain heat]] well.","그 오래된 벽은 [[열을 잘 간직한다]]."],["She tried to [[retain her title]] as champion.","그녀는 챔피언 [[타이틀을 지키려고]] 노력했다."],["The company wants to [[retain its customers]].","그 회사는 [[고객을 계속 확보하기를]] 원한다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"embassy","a":"1","e":"① embassy: (공식 사무소 / 한 나라의 정부를 대표하는 / 다른 나라에서) 대사관 (한 나라의 정부를 다른 나라에서 대표하는 공식 사무소)","w":"② academy: 학원, 학술원\n③ ministry: (정부의) 부, 부처\n④ headquarters: 본부, 본사","k":"공식 사무소 / 한 나라의 정부를 대표하는 / 다른 나라에서","m":0,"s":"\"an official office that represents one country's government in another country\"","c":["embassy","academy","ministry","headquarters"],"mn":"대사관 (한 나라의 정부를 다른 나라에서 대표하는 공식 사무소)","hk":"embassy(대사관)는 다른 나라에서 우리 정부를 대표하는 사무소. ministry(정부 부처)는 자기 나라 안, headquarters(본부)는 조직의 중심.","ex":[["[[The American embassy]] is near the park.","[[미국 대사관]]은 공원 근처에 있다."],["He went to [[the embassy]] to get a visa.","그는 비자를 받으려고 [[대사관]]에 갔다."],["[[The Korean embassy in Paris]] helped many tourists.","[[파리의 한국 대사관]]이 많은 관광객을 도왔다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"assertive","a":"2","e":"② submissive: 순종적인, 고분고분한 (회의에서 그녀의 적극적인 태도는 그녀를 조용한 사람으로 알고 있던 모두를 놀라게 했다.) / assertive(적극적인, 자기주장이 강한)의 반의어.","w":"① reckless: 무모한\n③ outgoing: 외향적인, 사교적인\n④ cynical: 냉소적인","k":"회의에서 그녀의 적극적인 태도는 그녀를 조용한 사람으로 알고 있던 모두를 놀라게 했다.","m":0,"s":"Her assertive manner in the meeting surprised everyone who knew her as a quiet person.","h":"assertive","c":["reckless","submissive","outgoing","cynical"],"mn":"적극적인, 자기주장이 강한","hk":"assertive(적극적인)의 반대편은 submissive(순종적인). reckless(무모한), outgoing(외향적인)은 반대말이 아님.","ex":[["[[An assertive person]] clearly says what she wants.","[[적극적인 사람]]은 원하는 것을 분명히 말한다.","assertive (형) 적극적인, 자기주장이 강한"],["The dog lay down in [[a submissive posture]].","그 개는 [[순종적인 자세]]로 엎드렸다.","submissive (형) 순종적인, 고분고분한"],["She was too [[submissive]] to argue.","그녀는 너무 [[순종적이어서]] 따지지 못했다.","submissive (형) 순종적인, 고분고분한"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"molecule","a":"molecule","e":"molecule 분자","k":"과학자들은 이제 강력한 현미경으로 물 분자 하나를 관찰할 수 있다.","m":0,"s":"Scientists can now observe a single m______ of water under a powerful microscope.","mn":"분자","hk":"molecule(분자)은 '몰-러-큘' 세 덩이로 끊어 쓰기. 마지막 덩이의 c, u, l, e 순서 주의. water(물)가 분자로 이루어졌다고 기억.","ex":[["[[A water molecule]] is extremely small.","[[물 분자]] 하나는 아주 작다."],["Heat makes [[molecules]] move faster.","열은 [[분자]]를 더 빨리 움직이게 한다."],["Sugar is made of many [[molecules]].","설탕은 수많은 [[분자]]로 이루어져 있다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"tapped","a":"3","e":"①톡톡 두드리다 / ②톡톡 두드리다 / ③이용하다, 활용하다 / ④톡톡 두드리다 [③번만 의미가 다름]","k":"①선생님은 시끄러운 반을 조용히 시키려고 칠판을 두 번 두드렸다.\n②그는 모두의 주의를 끌기 위해 작은 숟가락으로 유리잔을 톡톡 두드렸다.\n③그 회사는 젊은 온라인 쇼핑객들의 거대한 시장을 활용하기를 희망한다.\n④그녀는 마이크가 작동하는지 확인하려고 그것을 가볍게 톡톡 두드렸다.","m":0,"c":["The teacher tapped the board twice to quiet the noisy class.","He tapped the glass with a small spoon to get everyone's attention.","The company hopes to tap the huge market of young online shoppers.","She gently tapped the microphone to check whether it was working."],"hc":"tapped|tapped|tap|tapped","mn":"톡톡 두드리다 / 이용하다, 활용하다","hk":"tap(톡톡 두드리다)이 기본 뜻이고, 시장이나 자원을 끌어다 쓰는 tap(이용하다, 활용하다)은 ③번만 다른 뜻.","ex":[["She [[tapped him on the shoulder]].","그녀는 [[그의 어깨를 톡톡 두드렸다]].","tap (동) 톡톡 두드리다"],["He [[tapped his foot]] to the music.","그는 음악에 맞춰 [[발을 톡톡 굴렀다]].","tap (동) 톡톡 두드리다"],["The town hopes to [[tap the tourist market]].","그 마을은 [[관광 시장을 활용하기를]] 바란다.","tap (동) 이용하다, 활용하다"]]}]},{"day":38,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"diabetes","a":"1","e":"① diabetes: 당뇨병","w":"② plague: 역병, 전염병\n③ epidemic: 유행병, 전염병\n④ phobia: 공포증","m":0,"s":"\"당뇨병\"","c":["diabetes","plague","epidemic","phobia"],"mn":"당뇨병","hk":"diabetes(당뇨병)는 혈당 때문에 생기는 병. plague(역병), epidemic(유행병)은 널리 퍼지는 병, phobia(공포증)는 두려움이라 구분.","ex":[["My grandfather [[has diabetes]].","우리 할아버지는 [[당뇨병이 있다]]."],["People with [[diabetes]] must watch their sugar.","[[당뇨병]]이 있는 사람은 당을 조심해야 한다."],["Too much sugar can lead to [[diabetes]].","설탕을 너무 많이 먹으면 [[당뇨병]]에 걸릴 수 있다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"counselor","a":"3","e":"③ counselor: (직업이 사람들의 고민을 들어주는 것인 사람 / 그리고 그들에게 조언을 해 주는 것인) 상담가, 고문 (사람들의 문제를 듣고 그들에게 조언해 주는 것이 직업인 사람)","w":"① delegate: 대표, 대표자\n② diplomat: 외교관\n④ defendant: 피고인","k":"직업이 사람들의 고민을 들어주는 것인 사람 / 그리고 그들에게 조언을 해 주는 것인","m":0,"s":"\"a person whose job is to listen to people's problems and give them advice\"","c":["delegate","diplomat","counselor","defendant"],"mn":"상담가, 고문 (사람들의 문제를 듣고 그들에게 조언해 주는 것이 직업인 사람)","hk":"counselor(상담가)는 고민을 들어주고 조언하는 직업. delegate(대표자)는 대신 나서는 사람, diplomat(외교관)은 나라 사이의 일, defendant(피고인)는 재판받는 사람.","ex":[["She talked to [[a school counselor]] about her worries.","그녀는 걱정거리를 [[학교 상담 선생님]]과 이야기했다."],["He works as [[a career counselor]].","그는 [[진로 상담가]]로 일한다."],["[[The counselor]] listened carefully to the boy.","[[상담가]]는 소년의 말을 주의 깊게 들었다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"available","a":"1","e":"available (형) 이용 가능한 - availability (명) 이용 가능성\n① sacred (형) 신성한 - sacredness (명) 신성함","w":"② compile (동) 수집하여 엮다 - compilation (명) 모음집, 편집물\n③ employ (동) 고용하다 - employment (명) 고용, 취업\n④ allocate (동) 할당하다 - allocation (명) 배분, 할당","m":0,"s":"available - availability","c":["sacred - sacredness","compile - compilation","employ - employment","allocate - allocation"],"mn":"이용 가능한","hk":"available(이용 가능한) - availability(이용 가능성)는 형용사 → 명사. 정답 sacred(신성한) - sacredness(신성함)도 같고, 나머지는 모두 동사 → 명사.","ex":[["The room is [[available]] all week.","그 방은 일주일 내내 [[이용 가능하다]].","available (형) 이용 가능한"],["Please check the [[availability]] of seats.","좌석의 [[이용 가능성]]을 확인해 주세요.","availability (명) 이용 가능성"],["The temple is [[a sacred place]].","그 사원은 [[신성한 장소]]이다.","sacred (형) 신성한"],["People respect the [[sacredness]] of the mountain.","사람들은 그 산의 [[신성함]]을 존중한다.","sacredness (명) 신성함"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"handicap","a":"handicap","e":"※ 경기에서 실력을 맞추려고 미리 주는 불리한 조건은 handicap만 쓴다. hindrance·hurdle은 이 뜻이 없다.","k":"골프에서 미리 받는 불리한 조건이 낮은 선수는 아주 잘하는 선수로 여겨진다.","m":0,"s":"In golf, a player with a low h______ is considered a very good player.","hk":"handicap(핸디캡)은 hand(손)로 시작해 끝의 p를 빠뜨리기 쉬운 철자. 이 뜻은 hindrance(방해물), hurdle(장애물)에는 없음.","ex":[["Good golfers have [[a low handicap]].","잘 치는 골퍼는 [[낮은 핸디캡]]을 가진다."],["She plays golf with [[a handicap of ten]].","그녀는 [[핸디캡 10]]으로 골프를 친다."],["Beginners often get [[a high handicap]].","초보자는 흔히 [[높은 핸디캡]]을 받는다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"uptight","a":"3","e":"③ easygoing: 느긋한, 태평한 (그는 많은 사람들 앞에서 말해야 할 때마다 매우 초조해진다.) / uptight(긴장한, 신경이 곤두선)의 반의어.","w":"① altruistic: 이타적인\n② sociable: 사교적인\n④ naughty: 버릇없는, 장난이 심한","k":"그는 많은 사람들 앞에서 말해야 할 때마다 매우 초조해진다.","m":0,"s":"He becomes very uptight whenever he has to speak in front of a large group.","h":"uptight","c":["altruistic","sociable","easygoing","naughty"],"mn":"긴장한, 신경이 곤두선","hk":"uptight(긴장한)의 반대편은 easygoing(느긋한). sociable(사교적인)은 긴장 여부와 무관한 속임수.","ex":[["He gets [[uptight]] before every test.","그는 시험 때마다 [[긴장한다]].","uptight (형) 긴장한, 신경이 곤두선"],["My dad is [[an easygoing person]].","우리 아빠는 [[느긋한 사람]]이다.","easygoing (형) 느긋한, 태평한"],["She has [[an easygoing attitude]] about life.","그녀는 삶에 대해 [[느긋한 태도]]를 가졌다.","easygoing (형) 느긋한, 태평한"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"evacuate","a":"4","e":"④ evacuate: 대피시키다, 떠나 비우다 (시장은 폭풍이 도착하기 전에 모두에게 해안 마을에서 대피하라고 명령했다.)","w":"① populate: 거주하다, 살다\n② dwell: 살다, 거주하다\n③ immigrate: 이민 오다, 이주해 오다","k":"시장은 폭풍이 도착하기 전에 모두에게 해안 마을에서 대피하라고 명령했다.","m":0,"s":"The mayor ordered everyone to ________ the coastal town before the storm arrived.","c":["populate","dwell","immigrate","evacuate"],"mn":"대피시키다, 떠나 비우다","hk":"evacuate(대피시키다)는 위험한 곳에서 사람을 빼내 비우는 것. dwell(살다), populate(거주하다), immigrate(이민 오다)는 들어가 사는 쪽이라 방향이 반대.","ex":[["People had to [[evacuate the building]] quickly.","사람들은 서둘러 [[건물에서 대피해야]] 했다."],["Passengers had to [[evacuate the ship]].","승객들은 [[배에서 대피해야]] 했다."],["They [[evacuated the residents]] from the area.","그들은 그 지역에서 [[주민들을 대피시켰다]]."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"banquet","a":"4","e":"④ banquet: 연회, 만찬","w":"① 행진, 퍼레이드(parade)\n② 관광(sightseeing)\n③ 장례식(funeral)","m":0,"s":"banquet","c":["행진, 퍼레이드","관광","장례식","연회, 만찬"],"mn":"연회, 만찬","hk":"banquet(연회)은 많은 사람이 모여 먹는 공식 만찬. parade(퍼레이드), sightseeing(관광), funeral(장례식)은 음식 모임이 아님.","ex":[["They held [[a wedding banquet]] at the hotel.","그들은 호텔에서 [[결혼 연회]]를 열었다."],["The king gave [[a grand banquet]].","왕은 [[성대한 연회]]를 베풀었다."],["We were invited to [[the banquet]] last night.","우리는 어젯밤 [[연회]]에 초대받았다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"notorious","a":"1","e":"① infamous: 악명 높은 (그 거리는 극심한 교통 체증과 잦은 사고로 악명이 높다.) / notorious(악명 높은, 악평이 자자한)의 유의어.","w":"② legendary: 전설적인\n③ renowned: 명성 있는, 유명한\n④ prestigious: 명망 있는","k":"그 거리는 극심한 교통 체증과 잦은 사고로 악명이 높다.","m":0,"s":"That street is notorious for its heavy traffic and frequent accidents.","h":"notorious","c":["infamous","legendary","renowned","prestigious"],"mn":"악명 높은, 악평이 자자한","hk":"notorious(악명 높은)는 infamous(악명 높은)와 같은 편으로 나쁜 쪽 유명함. renowned(명성 있는), legendary(전설적인), prestigious(명망 있는)는 좋은 쪽.","ex":[["The police caught [[a notorious thief]].","경찰이 [[악명 높은 도둑]]을 잡았다."],["The road is [[notorious for]] accidents.","그 길은 사고로 [[악명이 높다]]."],["He is [[a notorious liar]].","그는 [[악명 높은 거짓말쟁이]]이다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"pose","a":"pose","e":"pose (동) (위협·문제를) 제기하다, 일으키다 / (명) 자세","k":"폭우와 강풍은 오래된 목조 주택에 심각한 위협이 될 수 있다.\n그 무용수는 전혀 움직이지 않고 한 가지 어려운 자세를 거의 3분 동안 유지했다.","m":0,"s":"Heavy rain and strong winds can p______ a serious threat to old wooden houses.\nThe dancer held one difficult p______ for almost three minutes without moving at all.","mn":"제기하다, 일으키다 / 자세","hk":"pose(제기하다, 일으키다)는 pose a threat(위협이 되다), pose a question(질문을 던지다)로 기억. 명사 pose(자세)는 춤·사진의 자세.","ex":[["Strong winds [[pose a threat]] to small boats.","강풍은 작은 배에 [[위협이 된다]].","pose (동) 제기하다, 일으키다"],["Students can [[pose questions]] to the guest.","학생들은 손님에게 [[질문을 제기할]] 수 있다.","pose (동) 제기하다, 일으키다"],["The model held [[a difficult pose]].","모델은 [[어려운 자세]]를 유지했다.","pose (명) 자세"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"fulfill","a":"1","e":"① fulfill: 완수하다, 충족시키다 (새 시장은 선거 기간에 했던 약속들을 완수하기 위해 열심히 일했다.)","w":"② undertake: (책임을) 맡다, 착수하다\n③ initiate: 시작하다, 개시하다\n④ pledge: 약속하다, 맹세하다","k":"새 시장은 선거 기간에 했던 약속들을 완수하기 위해 열심히 일했다.","m":0,"s":"The new mayor worked hard to ________ the promises he had made during the election.","c":["fulfill","undertake","initiate","pledge"],"mn":"완수하다, 충족시키다","hk":"fulfill(완수하다)은 약속이나 꿈을 채워 이루는 것. fulfill a promise(약속을 지키다)로 기억. pledge(약속하다)는 약속을 하는 쪽이라 단계가 다름.","ex":[["He always [[fulfills his promises]].","그는 항상 [[약속을 지킨다]]."],["She worked hard to [[fulfill her dream]].","그녀는 [[꿈을 이루려고]] 열심히 노력했다."],["The new shop can [[fulfill your needs]].","그 새 가게는 [[당신의 필요를 충족시킬]] 수 있다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"certificate","a":"1","e":"① certificate: (공식 문서 / 증명해 주는 / 당신이 과정을 마쳤거나 시험에 통과했다는 것을) 수료증, 증명서 (과정을 마쳤거나 시험에 합격했음을 증명하는 공식 문서)","w":"② guideline: 지침, 가이드라인\n③ index: 색인, 지수\n④ draft: 초안, 원고","k":"공식 문서 / 증명해 주는 / 당신이 과정을 마쳤거나 시험에 통과했다는 것을","m":0,"s":"\"an official document that proves you have finished a course or passed a test\"","c":["certificate","guideline","index","draft"],"mn":"수료증, 증명서 (과정을 마쳤거나 시험에 합격했음을 증명하는 공식 문서)","hk":"certificate(수료증)는 과정을 마쳤거나 시험에 합격했음을 증명하는 문서. guideline(지침), index(색인), draft(초안)는 증명 서류가 아님.","ex":[["She got [[a certificate]] for finishing the course.","그녀는 과정을 마쳐서 [[수료증]]을 받았다."],["You need [[a birth certificate]] to apply.","신청하려면 [[출생 증명서]]가 필요하다."],["He proudly showed his [[swimming certificate]].","그는 자랑스럽게 [[수영 수료증]]을 보여 주었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"legalize","a":"3","e":"③ outlaw: 불법화하다, 금지하다 (여러 나라가 그 식물의 의료용 사용을 합법화하기로 결정했다.) / legalize(합법화하다)의 반의어.","w":"① overturn: 뒤집다, 번복하다\n② impose: 부과하다\n④ violate: 위반하다","k":"여러 나라가 그 식물의 의료용 사용을 합법화하기로 결정했다.","m":0,"s":"Several countries have decided to legalize the medical use of the plant.","h":"legalize","c":["overturn","impose","outlaw","violate"],"mn":"합법화하다","hk":"legalize(합법화하다)는 legal(합법의)에 ize(~로 만들다)가 붙은 말, 반대편은 outlaw(불법화하다). violate(위반하다)는 법을 어기는 행동이라 속임수.","ex":[["Some countries want to [[legalize gambling]].","일부 나라는 [[도박을 합법화하기를]] 원한다.","legalize (동) 합법화하다"],["The law will [[outlaw smoking]] in parks.","그 법은 공원에서 [[흡연을 금지할]] 것이다.","outlaw (동) 불법화하다, 금지하다"],["Many countries [[outlawed slavery]] long ago.","많은 나라가 오래전에 [[노예제를 금지했다]].","outlaw (동) 불법화하다, 금지하다"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"bewildered","a":"3,4","e":"③ puzzled: 어리둥절한 (선생님이 게임 도중에 규칙을 바꾸자 학생들은 완전히 당황한 표정이었다.) / bewildered(당황한, 어리둥절한)의 유의어.\n④ confused: 혼란스러운","w":"① amazed: 깜짝 놀란\n② annoyed: 짜증이 난","k":"선생님이 게임 도중에 규칙을 바꾸자 학생들은 완전히 당황한 표정이었다.","m":2,"s":"The students looked completely bewildered when the teacher changed the rules in the middle of the game.","h":"bewildered","c":["amazed","annoyed","puzzled","confused"],"mn":"당황한, 어리둥절한","hk":"bewildered(당황한)는 puzzled(어리둥절한), confused(혼란스러운)와 같은 편. amazed(깜짝 놀란)는 놀람, annoyed(짜증이 난)는 화라 감정이 다름.","ex":[["He [[looked bewildered]] when I asked the question.","내가 질문하자 그는 [[어리둥절해 보였다]]."],["The boy had [[a bewildered look]] on his face.","소년의 얼굴에는 [[당황한 표정]]이 떠올라 있었다."],["The tourists felt [[bewildered]] in the huge station.","관광객들은 거대한 역에서 [[어리둥절했다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"globe","a":"globe","e":"globe 지구, 세계","k":"심각한 환경 오염은 이제 전 세계 거의 모든 나라의 문제이다.","m":0,"s":"Serious environmental pollution is now a problem in almost every country across the g______.","mn":"지구, 세계","hk":"globe(지구, 세계)는 끝의 e를 빼먹기 쉬움. across the globe(전 세계에서)로 짝 기억.","ex":[["People [[across the globe]] love music.","[[전 세계]] 사람들이 음악을 사랑한다."],["She traveled [[around the globe]].","그녀는 [[전 세계를]] 여행했다."],["Fans [[all over the globe]] watched the final.","[[전 세계]]의 팬들이 결승전을 보았다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"favor","a":"3","e":"①부탁, 호의 / ②부탁, 호의 / ③지지, 찬성 / ④부탁, 호의 [③번만 의미가 다름]","k":"①창문 좀 닫아 주는 부탁을 들어줄 수 있니?\n②그녀는 자신이 없는 동안 이웃에게 작은 부탁을 했다.\n③그 새 계획은 대부분의 위원회 위원들의 지지를 빠르게 얻었다.\n④그는 내가 상자를 위층으로 옮기는 것을 도와주며 호의에 보답했다.","m":0,"c":["Could you do me a favor and close the window?","She asked her neighbor for a small favor while she was away.","The new plan quickly won the favor of most committee members.","He returned the favor by helping me carry the boxes upstairs."],"hc":"favor|favor|favor|favor","mn":"부탁, 호의 / 지지, 찬성","hk":"favor(부탁, 호의)는 do a favor(부탁을 들어주다)로 쓰는 뜻이 기본이고, ③번만 favor(지지, 찬성)로 in favor of(~에 찬성하여)와 같은 뜻.","ex":[["Can you do me [[a favor]]?","[[부탁]] 하나 들어줄래?","favor (명) 부탁, 호의"],["He asked me for [[a small favor]].","그는 나에게 [[작은 부탁]]을 했다.","favor (명) 부탁, 호의"],["Most students are [[in favor of]] the new rule.","대부분의 학생들이 새 규칙에 [[찬성한다]].","favor (명) 지지, 찬성"]]}]},{"day":39,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"riot","a":"1","e":"① riot: 폭동, 소동","w":"② combat: 전투, 싸움\n③ exile: 추방, 망명\n④ massacre: 학살","m":0,"s":"\"폭동, 소동\"","c":["riot","combat","exile","massacre"],"mn":"폭동, 소동","hk":"riot(폭동)은 군중이 거칠게 날뛰는 소동. combat(전투)는 군대의 싸움, massacre(학살)는 많은 사람을 죽이는 것, exile(추방)은 쫓겨남이라 다름.","ex":[["[[A riot]] broke out in the city.","도시에서 [[폭동]]이 일어났다."],["The angry fans started [[a riot]] after the game.","화난 팬들은 경기 후 [[폭동]]을 일으켰다."],["[[Riot police]] arrived at the stadium.","[[폭동 진압 경찰]]이 경기장에 도착했다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"surpass","a":"1,4","e":"① exceed: 초과하다, 넘어서다\n④ outdo: 능가하다, ~보다 더 잘하다 (올해의 판매량은 이미 전년도 총계를 넘어선다.) / surpass(능가하다, 뛰어넘다)의 유의어.","w":"② approximate: 근접하다, 비슷하다\n③ coincide: 일치하다, 동시에 일어나다","k":"올해의 판매량은 이미 전년도 총계를 넘어선다.","m":2,"s":"This year's sales already surpass the total of the previous year.","h":"surpass","c":["exceed","approximate","coincide","outdo"],"mn":"능가하다, 뛰어넘다","hk":"surpass(능가하다)는 exceed(초과하다), outdo(능가하다)와 같은 편. approximate(근접하다)는 못 미치게 가까운 것, coincide(일치하다)는 딱 맞는 것이라 속임수.","ex":[["The movie [[surpassed all expectations]].","그 영화는 [[모든 기대를 뛰어넘었다]]."],["He hopes to [[surpass his father]].","그는 [[아버지를 능가하기를]] 바란다."],["Sales will soon [[surpass last year's record]].","판매량은 곧 [[작년 기록을 넘어설]] 것이다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"pedestrian","a":"3","e":"③ pedestrian: (도로나 거리를 따라 걸어가고 있는 사람 / 운전을 하는 것이 아니라) 보행자 (운전하는 것이 아니라 길이나 거리를 걸어가는 사람)","w":"① civilian: 민간인\n② cyclist: 자전거 타는 사람\n④ stranger: 낯선 사람, 이방인","k":"도로나 거리를 따라 걸어가고 있는 사람 / 운전을 하는 것이 아니라","m":0,"s":"\"a person who is walking along a road or street rather than driving\"","c":["civilian","cyclist","pedestrian","stranger"],"mn":"보행자 (운전하는 것이 아니라 길이나 거리를 걸어가는 사람)","hk":"pedestrian(보행자)은 걸어가는 사람. cyclist(자전거 타는 사람)는 자전거를 타고, civilian(민간인)과 stranger(낯선 사람)는 걷는지와 무관.","ex":[["Drivers must stop for [[pedestrians]].","운전자는 [[보행자]]를 위해 멈춰야 한다."],["Wait at [[the pedestrian crossing]].","[[횡단보도]]에서 기다려라."],["The car hit [[a pedestrian]].","차가 [[보행자]]를 쳤다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"beast","a":"beast","e":"beast 짐승, 야수","k":"그 옛 전설에서 날카로운 이빨을 가진 거대한 야수가 성문을 지켰다.","m":0,"s":"In the old legend a huge b______ with sharp teeth guarded the gate of the castle.","mn":"짐승, 야수","hk":"beast(야수)는 ea가 가운데 들어가는 철자. a를 빼면 best(최고의)가 되어 전혀 다른 말.","ex":[["The hero fought [[a wild beast]].","영웅은 [[야생 짐승]]과 싸웠다."],["The hunter saw [[a huge beast]] in the forest.","사냥꾼은 숲에서 [[거대한 야수]]를 보았다."],["Can you hear [[the beast]] roaring in the cave?","동굴에서 [[야수]]가 포효하는 소리가 들리니?"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"atom","a":"1","e":"atom (명) 원자 - atomic (형) 원자의\n① gene (명) 유전자 - genetic (형) 유전의","w":"② prefer (동) 선호하다 - preferable (형) 더 나은, 선호되는\n③ innovate (동) 혁신하다 - innovative (형) 혁신적인\n④ refine (동) 정제하다, 다듬다 - refined (형) 정제된, 세련된","m":0,"s":"atom - atomic","c":["gene - genetic","prefer - preferable","innovate - innovative","refine - refined"],"mn":"원자","hk":"atom(원자) - atomic(원자의)은 명사 → 형용사. 정답 gene(유전자) - genetic(유전의)도 명사 → 형용사, 나머지 보기는 모두 동사 → 형용사.","ex":[["[[An atom]] is too small to see.","[[원자]] 하나는 너무 작아서 볼 수 없다.","atom (명) 원자"],["Some countries use [[atomic energy]].","일부 나라는 [[원자력]]을 쓴다.","atomic (형) 원자의"],["Each [[gene]] carries information.","각 [[유전자]]는 정보를 담고 있다.","gene (명) 유전자"],["Eye color is [[a genetic trait]].","눈 색깔은 [[유전적 특성]]이다.","genetic (형) 유전의"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"inhale","a":"4","e":"④ exhale: 숨을 내쉬다 (의사는 그에게 천천히 숨을 들이쉰 다음 5초 동안 참으라고 요청했다.) / inhale(숨을 들이쉬다)의 반의어.","w":"① sigh: 한숨 쉬다\n② shiver: (추위·두려움으로) 떨다\n③ sneeze: 재채기하다","k":"의사는 그에게 천천히 숨을 들이쉰 다음 5초 동안 참으라고 요청했다.","m":0,"s":"The doctor asked him to inhale slowly and then hold it for five seconds.","h":"inhale","c":["sigh","shiver","sneeze","exhale"],"mn":"숨을 들이쉬다","hk":"inhale(들이쉬다)의 반대편은 exhale(내쉬다). in(안으로)과 ex(밖으로)로 기억: 들이쉬면 in, 내쉬면 ex. sigh(한숨 쉬다)는 속임수.","ex":[["Please [[inhale deeply]] through your nose.","코로 [[깊게 숨을 들이쉬세요]].","inhale (동) 숨을 들이쉬다"],["Slowly [[exhale through your mouth]].","천천히 [[입으로 숨을 내쉬세요]].","exhale (동) 숨을 내쉬다"],["He closed his eyes and [[exhaled slowly]].","그는 눈을 감고 [[천천히 숨을 내쉬었다]].","exhale (동) 숨을 내쉬다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"safeguard","a":"3","e":"③ safeguard: 보호하다 (정부는 시민들의 개인 정보를 보호하기 위해 엄격한 새 규칙을 도입했다.)","w":"① disclose: 폭로하다, 밝히다\n② duplicate: 복제하다\n④ retrieve: 되찾다, 회수하다","k":"정부는 시민들의 개인 정보를 보호하기 위해 엄격한 새 규칙을 도입했다.","m":0,"s":"The government introduced strict new rules to ________ the personal information of citizens.","c":["disclose","duplicate","safeguard","retrieve"],"mn":"보호하다","hk":"safeguard(보호하다)는 safe(안전한)와 guard(지키다)가 합쳐진 말, 안전하게 지킨다는 뜻. disclose(폭로하다)는 정보를 드러내는 쪽이라 정반대.","ex":[["Good laws [[safeguard people's rights]].","좋은 법은 사람들의 [[권리를 보호한다]]."],["We must [[safeguard the environment]].","우리는 [[환경을 보호해야]] 한다."],["Passwords [[safeguard your data]].","비밀번호는 [[당신의 자료를 보호한다]]."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"fiber","a":"1","e":"① fiber: 섬유, 섬유질","w":"② 효모, 이스트(yeast)\n③ 입자, 미립자(particle)\n④ 결정, 크리스털(crystal)","m":0,"s":"fiber","c":["섬유, 섬유질","효모, 이스트","입자, 미립자","결정, 크리스털"],"mn":"섬유, 섬유질","hk":"fiber(섬유, 섬유질)는 채소에 든 식이섬유이자 천의 실. yeast(효모), particle(입자), crystal(결정)은 전혀 다른 물질.","ex":[["Vegetables are [[rich in fiber]].","채소는 [[섬유질이 풍부하다]]."],["[[Cotton fiber]] is soft and light.","[[면 섬유]]는 부드럽고 가볍다."],["[[Dietary fiber]] helps digestion.","[[식이섬유]]는 소화를 돕는다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"imminent","a":"3","e":"③ impending: 임박한, 곧 닥칠 (어두운 구름과 갑작스러운 정적은 마을 사람들에게 임박한 폭풍을 경고했다.) / imminent(임박한, 금방이라도 일어날)의 유의어.","w":"① preliminary: 예비의, 서론의\n② premature: 너무 이른, 시기상조의\n④ subsequent: 그 다음의, 이후의","k":"어두운 구름과 갑작스러운 정적은 마을 사람들에게 임박한 폭풍을 경고했다.","m":0,"s":"Dark clouds and sudden silence warned the villagers of an imminent storm.","h":"imminent","c":["preliminary","premature","impending","subsequent"],"mn":"임박한, 금방이라도 일어날","hk":"imminent(임박한)는 impending(임박한)과 같은 편. preliminary(예비의), premature(너무 이른), subsequent(그 다음의)는 뜻이 다름.","ex":[["A big storm is [[imminent]] tonight.","오늘 밤 큰 폭풍이 [[임박했다]]."],["There is [[imminent danger]] near the river.","강 근처에 [[임박한 위험]]이 있다."],["The team's defeat seemed [[imminent]].","그 팀의 패배는 [[임박해 보였다]]."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"rank","a":"rank","e":"rank (명) 계급, 지위 / (동) 순위를 차지하다, 순위를 매기다","k":"그는 열여덟 살에 군에 입대해 천천히 대위 계급까지 올라갔다.\n우리 학교는 과학 대회에 참가하는 모든 학교 중에서 3위를 차지하기를 바란다.","m":0,"s":"He joined the army at eighteen and slowly rose to the r______ of captain.\nOur school hopes to r______ third among all the schools that enter the science contest.","mn":"계급, 지위 / 순위를 차지하다, 순위를 매기다","hk":"rank(계급, 지위)는 명사, rank(순위를 차지하다)는 동사로 두 뜻. rise in rank(계급이 오르다), rank third(3위를 차지하다) 짝으로 기억.","ex":[["He rose to [[the rank of captain]].","그는 [[대위 계급]]까지 올랐다.","rank (명) 계급, 지위"],["A general holds [[a high rank]] in the army.","장군은 군에서 [[높은 계급]]을 가진다.","rank (명) 계급, 지위"],["Our team [[ranks first]] in the league.","우리 팀은 리그에서 [[1위를 차지한다]].","rank (동) 순위를 차지하다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"narrate","a":"3","e":"③ narrate: 내레이션을 하다, 이야기를 들려주다 (한 유명한 과학자가 심해에 관한 새 다큐멘터리의 내레이션을 맡기로 해서, 영화 내내 그의 목소리를 듣게 될 것이다.)","w":"① censor: 검열하다\n② publicize: 알리다, 홍보하다\n④ advertise: 광고하다","k":"한 유명한 과학자가 심해에 관한 새 다큐멘터리의 내레이션을 맡기로 해서, 영화 내내 그의 목소리를 듣게 될 것이다.","m":0,"s":"A famous scientist agreed to ________ the new documentary about the deep sea, so his voice will be heard throughout the film.","c":["censor","publicize","narrate","advertise"],"mn":"내레이션을 하다, 이야기를 들려주다","hk":"narrate(내레이션을 하다)는 목소리로 이야기를 들려주는 것, narrator(내레이터)와 한 식구. censor(검열하다), publicize(알리다), advertise(광고하다)는 속임수.","ex":[["An actor will [[narrate the film]].","한 배우가 [[영화의 내레이션을 맡을]] 것이다."],["She likes to [[narrate stories]] to children.","그녀는 아이들에게 [[이야기를 들려주기를]] 좋아한다."],["He [[narrated the documentary]] last year.","그는 작년에 [[그 다큐멘터리의 내레이션을 했다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"perseverance","a":"1","e":"① perseverance: (성질 / 어떤 일을 계속 열심히 해 나가는 / 그것이 어려울 때조차도) 인내, 끈기 (어려울 때에도 무언가를 계속 열심히 해내려는 성질)","w":"② obligation: 의무\n③ temperament: 기질, 성미\n④ indecision: 주저, 우유부단","k":"성질 / 어떤 일을 계속 열심히 해 나가는 / 그것이 어려울 때조차도","m":0,"s":"\"the quality of continuing to try hard to do something even when it is difficult\"","c":["perseverance","obligation","temperament","indecision"],"mn":"인내, 끈기 (어려울 때에도 무언가를 계속 열심히 해내려는 성질)","hk":"perseverance(인내, 끈기)는 어려워도 계속 노력하는 성질. obligation(의무), temperament(기질), indecision(주저)과 구분. 짝은 hard work(노력).","ex":[["Success takes [[hard work and perseverance]].","성공에는 [[노력과 끈기]]가 필요하다."],["He showed [[great perseverance]] during training.","그는 훈련 중 [[대단한 끈기]]를 보였다."],["[[Perseverance]] helped her finish the race.","[[끈기]] 덕분에 그녀는 경주를 끝마쳤다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"vein","a":"1","e":"① artery: 동맥 (피는 몸을 통과한 뒤 정맥을 통해 심장으로 돌아온다.) / vein(정맥)의 반의어.","w":"② flesh: 살, 육체\n③ spine: 척추, 등뼈\n④ pulse: 맥박","k":"피는 몸을 통과한 뒤 정맥을 통해 심장으로 돌아온다.","m":0,"s":"Blood returns to the heart through a vein after it has passed through the body.","h":"vein","c":["artery","flesh","spine","pulse"],"mn":"정맥","hk":"vein(정맥)의 반대편은 artery(동맥). 심장에서 나가는 피는 artery(동맥), 심장으로 돌아오는 피는 vein(정맥). pulse(맥박)는 속임수.","ex":[["Blood flows through [[a vein]] back to the heart.","피는 [[정맥]]을 통해 심장으로 돌아간다.","vein (명) 정맥"],["[[A blocked artery]] can cause a heart attack.","[[막힌 동맥]]은 심장마비를 일으킬 수 있다.","artery (명) 동맥"],["Fresh blood leaves the heart through [[an artery]].","신선한 피는 [[동맥]]을 통해 심장을 떠난다.","artery (명) 동맥"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"grammar","a":"grammar","e":"grammar 문법","k":"언어학자들은 한 언어의 문법이 다른 언어의 문법과 어떻게 다른지 연구한다.","m":0,"s":"Linguists study how the g______ of one language differs from that of another language.","mn":"문법","hk":"grammar(문법)는 m이 두 개, 끝은 -mar. 끝을 -er로 쓰기 쉬우니 a, r 순서 주의.","ex":[["I study [[English grammar]] every day.","나는 매일 [[영어 문법]]을 공부한다."],["She checked her essay for [[grammar mistakes]].","그녀는 에세이의 [[문법 실수]]를 확인했다."],["I bought [[a grammar book]] yesterday.","나는 어제 [[문법책]] 한 권을 샀다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"bound","a":"3","e":"①반드시 ~하게 되어 있는 / ②반드시 ~하게 되어 있는 / ③~행의, ~로 향하는 / ④반드시 ~하게 되어 있는 [③번만 의미가 다름]","k":"①이렇게 계속 연습하면 너는 반드시 실력이 늘게 되어 있다.\n②누구나 실수를 하므로 너도 가끔은 실패하기 마련이다.\n③2번 승강장의 마지막 기차는 남쪽 해안행이다.\n④새 세금이 시행되면 물가는 반드시 오르게 되어 있다.","m":0,"c":["If you keep practicing like this, you are bound to improve.","Everyone makes mistakes, so you are bound to fail sometimes.","The last train on platform two is bound for the southern coast.","Prices are bound to rise once the new tax takes effect."],"hc":"bound|bound|bound|bound","mn":"반드시 ~하게 되어 있는 / ~행의, ~로 향하는","hk":"bound to(반드시 ~하게 되어 있는)가 셋, bound for(~행의, ~로 향하는)가 ③번 하나. to(~하도록)와 for(~을 향해) 뒤의 말로 구분.","ex":[["He is [[bound to win]].","그는 [[반드시 이기게 되어 있다]].","bound (형) 반드시 ~하게 되어 있는"],["You are [[bound to feel nervous]] at first.","처음에는 [[긴장하기 마련이다]].","bound (형) 반드시 ~하게 되어 있는"],["This bus is [[bound for Busan]].","이 버스는 [[부산행]]이다.","bound (형) ~행의, ~로 향하는"]]}]},{"day":40,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"cuisine","a":"4","e":"④ cuisine: 요리, 요리법","w":"① flavor: 맛, 풍미\n② menu: 메뉴, 식단표\n③ dessert: 후식","m":0,"s":"\"요리, 요리법\"","c":["flavor","menu","dessert","cuisine"],"mn":"요리, 요리법","hk":"cuisine(요리)은 나라나 지역 특유의 요리 스타일. flavor(맛), menu(메뉴), dessert(후식)는 요리의 일부일 뿐 요리법 전체가 아님.","ex":[["I love [[Italian cuisine]].","나는 [[이탈리아 요리]]를 아주 좋아한다."],["This restaurant serves [[French cuisine]].","이 식당은 [[프랑스 요리]]를 낸다."],["Try the [[local cuisine]] when you travel.","여행할 때 [[현지 요리]]를 먹어 봐라."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"accurate","a":"2,4","e":"② exact: 정확한, 정밀한 (그 기자는 자신의 기사가 정확한지 확인하기 위해 모든 숫자를 두 번 확인했다.) / accurate(정확한, 오차 없는)의 유의어.\n④ correct: 맞는, 정확한","w":"① brief: 간결한, 짧은\n③ detailed: 상세한","k":"그 기자는 자신의 기사가 정확한지 확인하기 위해 모든 숫자를 두 번 확인했다.","m":2,"s":"The journalist checked every number twice to make sure her article was accurate.","h":"accurate","c":["brief","exact","detailed","correct"],"mn":"정확한, 오차 없는","hk":"accurate(정확한)는 exact(정확한), correct(맞는)와 같은 편. detailed(상세한)는 자세함, brief(간결한)는 짧음이라 정확함과는 다른 축.","ex":[["That is [[an accurate answer]].","그것은 [[정확한 답]]이다."],["Her watch always shows [[the accurate time]].","그녀의 시계는 항상 [[정확한 시간]]을 보여 준다."],["The weather report was [[accurate]] today.","오늘 일기예보는 [[정확했다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"abolish","a":"2","e":"abolish (동) 폐지하다, 없애다 - abolition (명) 폐지\n② combine (동) 결합하다, 섞다 - combination (명) 결합","w":"① wealthy (형) 부유한, 돈이 많은 - wealth (명) 재산, 부\n③ bold (형) 대담한, 용감한 - boldness (명) 대담함\n④ active (형) 활동적인, 적극적인 - activity (명) 활동","m":0,"s":"abolish - abolition","c":["wealthy - wealth","combine - combination","bold - boldness","active - activity"],"mn":"폐지하다, 없애다","hk":"abolish(폐지하다) - abolition(폐지)은 동사 → 명사. 정답 combine(결합하다) - combination(결합)도 동사 → 명사, 나머지 보기는 모두 형용사 → 명사.","ex":[["Many countries [[abolished slavery]].","많은 나라가 [[노예제를 폐지했다]].","abolish (동) 폐지하다, 없애다"],["People demanded [[the abolition]] of the old tax.","사람들은 낡은 세금의 [[폐지]]를 요구했다.","abolition (명) 폐지"],["[[Combine the flour and eggs]] in a bowl.","그릇에 [[밀가루와 달걀을 섞어라]].","combine (동) 결합하다, 섞다"],["Red and blue make [[a good combination]].","빨강과 파랑은 [[좋은 조합]]이다.","combination (명) 결합"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"finite","a":"1","e":"① finite: 유한한, 한정된 (지구의 유한한 천연자원은 무한한 미래의 경제 성장을 지탱할 수 없다.)","w":"② renewable: 재생 가능한\n③ abundant: 풍부한\n④ massive: 거대한","k":"지구의 유한한 천연자원은 무한한 미래의 경제 성장을 지탱할 수 없다.","m":0,"s":"The earth's ________ natural resources cannot support unlimited future economic growth.","c":["finite","renewable","abundant","massive"],"mn":"유한한, 한정된","hk":"finite(유한한)는 끝이 있는 것이고, 반대는 infinite(무한한). abundant(풍부한), massive(거대한)는 끝이 있다는 뜻이 아니고 renewable(재생 가능한)은 다시 생김.","ex":[["Our time is [[finite]].","우리의 시간은 [[유한하다]]."],["The earth has [[finite resources]].","지구에는 [[유한한 자원]]이 있다."],["We have [[a finite amount of]] time.","우리에게는 [[한정된 양의]] 시간이 있다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"complex","a":"1","e":"① simple: 단순한, 간단한 (새 기계의 설명서는 너무 복잡해서 엔지니어들조차 따라갈 수 없었다.) / complex(복잡한, 복합적인)의 반의어.","w":"② unclear: 불분명한\n③ messy: 엉망인, 지저분한\n④ tricky: 까다로운","k":"새 기계의 설명서는 너무 복잡해서 엔지니어들조차 따라갈 수 없었다.","m":0,"s":"The instructions for the new machine were so complex that even the engineers could not follow them.","h":"complex","c":["simple","unclear","messy","tricky"],"mn":"복잡한, 복합적인","hk":"complex(복잡한)의 반대편은 simple(단순한). unclear(불분명한), messy(엉망인), tricky(까다로운)는 복잡함과 비슷한 쪽이라 속임수.","ex":[["The plot of the movie is [[very complex]].","그 영화의 줄거리는 [[매우 복잡하다]].","complex (형) 복잡한, 복합적인"],["Please give me [[a simple answer]].","[[간단한 답]]을 주세요.","simple (형) 단순한, 간단한"],["It is [[a simple recipe]] for beginners.","그것은 초보자를 위한 [[간단한 요리법]]이다.","simple (형) 단순한, 간단한"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"circumstance","a":"1","e":"① circumstance: 상황, 환경","w":"② 순서, 차례(order)\n③ 예외(exception)\n④ 결론, 결말(conclusion)","m":0,"s":"circumstance","c":["상황, 환경","순서, 차례","예외","결론, 결말"],"mn":"상황, 환경","hk":"circumstance(상황, 환경)는 일을 둘러싼 조건. under the circumstances(그 상황에서)로 기억. order(순서), exception(예외), conclusion(결론)과 구분.","ex":[["Under [[these circumstances]], we can't go.","[[이런 상황]]에서는 우리가 갈 수 없다."],["Stay calm in [[any circumstance]].","[[어떤 상황]]에서도 침착해라."],["[[Difficult circumstances]] can make people stronger.","[[어려운 환경]]은 사람을 더 강하게 만들 수 있다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"drown","a":"drown","e":"drown 물에 빠지다, 익사하다","k":"불어난 홍수로 인해 많은 농장 동물들이 저지대 들판에서 익사했다.","m":0,"s":"Rising floodwaters caused many farm animals to d______ in the low-lying fields.","mn":"물에 빠지다, 익사하다","hk":"drown(익사하다)은 r, o, w, n 순서로 쓰기. down(아래로)과 헷갈려 r을 빼먹기 쉬움. 끝은 d가 아니라 n.","ex":[["A child can [[drown]] in shallow water.","아이는 얕은 물에서도 [[익사할]] 수 있다."],["He almost [[drowned in the river]].","그는 [[강에서 익사할]] 뻔했다."],["She saved a boy who was about to [[drown]].","그녀는 [[물에 빠지려던]] 소년을 구했다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"spectacle","a":"3","e":"③ spectacle: (아주 인상적이거나 특이한 광경 / 많은 관심을 끌어모으는) 구경거리, 장관","w":"① carnival: 축제, 카니발\n② presentation: 발표\n④ episode: (드라마의) 회, 일화","k":"아주 인상적이거나 특이한 광경 / 많은 관심을 끌어모으는","m":0,"s":"\"a very impressive or unusual sight that attracts a lot of attention\"","c":["carnival","presentation","spectacle","episode"],"mn":"구경거리, 장관","hk":"spectacle(구경거리, 장관)은 눈길을 확 끄는 대단한 광경. carnival(축제)은 행사이고, episode(회, 일화)와 presentation(발표)은 광경이 아님.","ex":[["The fireworks were [[a great spectacle]].","불꽃놀이는 [[멋진 구경거리]]였다."],["The sunrise was [[a beautiful spectacle]].","일출은 [[아름다운 장관]]이었다."],["The huge waves were [[a stunning spectacle]].","거대한 파도는 [[놀라운 장관]]이었다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"owe","a":"owe","e":"owe (동) 빚지다 / (동) ~의 덕분이다","k":"수년간의 고된 노력 후에도, 그 농부들은 여전히 마을 은행에 큰 금액을 빚지고 있다.\n그 과학자들은 자신들의 가장 위대한 발견이 실험실에서의 단순한 실수 덕분이라고 말한다.","m":0,"s":"Even after years of hard work, the farmers still o______ a large sum of money to the village bank.\nThe scientists say they o______ their greatest discovery to a simple mistake in the lab.","mn":"빚지다 / ~의 덕분이다","hk":"owe(빚지다)는 돈을 빚지다 외에 ~의 덕분이다는 뜻도 있음. owe money(돈을 빚지다), owe success to(성공이 ~ 덕분이다)로 기억.","ex":[["I [[owe you ten dollars]].","나는 너에게 [[10달러를 빚졌다]].","owe (동) 빚지다"],["They [[owe the bank a lot of money]].","그들은 은행에 [[많은 돈을 빚지고 있다]].","owe (동) 빚지다"],["She [[owes her success to her parents]].","그녀의 [[성공은 부모님 덕분이다]].","owe (동) ~의 덕분이다"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"quality","a":"2","e":"② quantity: 양 (그 식당은 요리의 크기가 아니라 재료의 품질로 유명하다.) / quality(질, 품질)의 반의어.","w":"① value: 가치\n③ standard: 기준, 수준\n④ grade: 등급","k":"그 식당은 요리의 크기가 아니라 재료의 품질로 유명하다.","m":0,"s":"The restaurant is famous for the quality of its ingredients, not for the size of its dishes.","h":"quality","c":["value","quantity","standard","grade"],"mn":"질, 품질","hk":"quality(질)와 quantity(양)는 철자가 비슷한 반대짝. 좋으냐 나쁘냐는 quality(질), 많으냐 적으냐는 quantity(양).","ex":[["The shop sells [[high-quality food]].","그 가게는 [[고품질 음식]]을 판다.","quality (명) 질, 품질"],["Buy [[a large quantity]] of rice to save money.","돈을 아끼려면 쌀을 [[많은 양]] 사라.","quantity (명) 양"],["Only [[a small quantity]] of water was left.","[[적은 양]]의 물만 남아 있었다.","quantity (명) 양"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"preached","a":"1","e":"① preached: 역설하다, 설교하다 (preach의 과거형) (그가 방문한 모든 학교에서, 그 젊은 활동가는 환경을 보호하는 것의 중요성을 역설했다.)","w":"② forgot: 잊다 (forget의 과거형)\n③ whispered: 속삭이다 (whisper의 과거형)\n④ confessed: 고백하다 (confess의 과거형)","k":"그가 방문한 모든 학교에서, 그 젊은 활동가는 환경을 보호하는 것의 중요성을 역설했다.","m":0,"s":"At every school he visited, the young activist ________ the importance of protecting the environment.","c":["preached","forgot","whispered","confessed"],"mn":"역설하다, 설교하다","hk":"preached(역설하다)는 preach(설교하다)의 과거형, 주장을 강하게 펼치는 뜻. whispered(속삭이다), confessed(고백하다), forgot(잊었다)은 과거형이어도 뜻이 안 맞음.","ex":[["The coach [[preached teamwork]] to the players.","코치는 선수들에게 [[팀워크를 역설했다]].","preached (동) preach(역설하다)의 과거형"],["He often [[preaches kindness]] to children.","그는 아이들에게 자주 [[친절을 설교한다]].","preach (동) 역설하다, 설교하다"],["She [[preached patience]] to her students.","그녀는 학생들에게 [[인내를 역설했다]].","preached (동) preach(역설하다)의 과거형"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"encourage","a":"4","e":"④ support: 지지하다, 지원하다 (좋은 선생님들은 실수하기를 두려워하는 학생들을 격려한다.) / encourage(격려하다, 북돋우다)의 유의어.","w":"① warn: 경고하다\n② remind: 상기시키다\n③ judge: 판단하다","k":"좋은 선생님들은 실수하기를 두려워하는 학생들을 격려한다.","m":0,"s":"Good teachers encourage students who are afraid of making mistakes.","h":"encourage","c":["warn","remind","judge","support"],"mn":"격려하다, 북돋우다","hk":"encourage(격려하다)는 courage(용기)를 넣어 주는 말, support(지지하다)가 같은 편. warn(경고하다), judge(판단하다)는 속임수.","ex":[["Parents should [[encourage their children]].","부모는 [[자녀를 격려해야]] 한다."],["My teacher [[encouraged me to try]] again.","선생님은 내가 다시 [[해 보도록 격려하셨다]]."],["Her words [[encouraged him to keep going]].","그녀의 말은 그가 [[계속 나아가도록 용기를 주었다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"intervene","a":"4","e":"④ intervene: (어떤 상황에 끼어들다 / 멈추거나 바꾸기 위해 / 벌어지고 있는 일을) 개입하다, 끼어들다","w":"① contend: 주장하다\n② convene: 소집하다\n③ correspond: 일치하다","k":"어떤 상황에 끼어들다 / 멈추거나 바꾸기 위해 / 벌어지고 있는 일을","m":0,"s":"\"to become involved in a situation in order to stop or change what is happening\"","c":["contend","convene","correspond","intervene"],"mn":"개입하다, 끼어들다","hk":"intervene(개입하다)은 inter(사이)가 들어 있어 사이에 끼어드는 이미지. contend(주장하다), convene(소집하다), correspond(일치하다)는 뜻이 다른 속임수.","ex":[["The teacher had to [[intervene in the fight]].","선생님은 [[싸움에 개입해야]] 했다."],["The government decided to [[intervene in the market]].","정부는 [[시장에 개입하기로]] 결정했다."],["Nobody dared to [[intervene]] when the boss shouted.","사장이 소리쳤을 때 아무도 감히 [[끼어들지]] 못했다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"vigor","a":"vigor","e":"※ vitality도 정답으로 인정한다. (vigor / vitality 모두 ‘활력’)","k":"그 젊은 운동선수는 전국 대회 우승을 위해 대단한 활력으로 매일 훈련했다.","m":0,"s":"The young athlete trained every day with great v______ to win the national title.","al":"vitality|vigour","hk":"vigor(활력)는 끝이 or인 미국식 철자. vitality(활력)도 같은 뜻이라 정답으로 인정됨.","ex":[["He worked with [[great vigor]].","그는 [[대단한 활력]]으로 일했다."],["She spoke with [[youthful vigor]].","그녀는 [[젊은 활력]]으로 말했다."],["The team played with [[new vigor]].","그 팀은 [[새로운 활력]]으로 경기했다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"due","a":"4","e":"①기한인, 예정된 / ②기한인, 예정된 / ③기한인, 예정된 / ④~때문인 [④번만 의미가 다름]","k":"①모든 도서관 책은 겨울 방학 전이 반납 기한이다.\n②다음 지불은 4월 1일이 기한이다.\n③최종 에세이는 이달 말이 기한이다.\n④그 팀의 실패는 준비 부족 때문이었다.","m":0,"c":["All library books are due back before the winter break.","The next payment is due on the first day of April.","The final essay is due at the end of this month.","The team's failure was due to a lack of preparation."],"hc":"due|due|due|due","mn":"기한인, 예정된 / ~때문인","hk":"due(기한인, 예정된)는 due on(~이 기한인)처럼 날짜와 함께 쓰이고, ④번 due to(~ 때문에)만 이유를 나타냄.","ex":[["The homework is [[due tomorrow]].","숙제는 [[내일이 기한이다]].","due (형) 기한인, 예정된"],["The baby is [[due in May]].","아기는 [[5월이 출산 예정이다]].","due (형) 기한인, 예정된"],["The delay was [[due to]] heavy snow.","그 지연은 폭설 [[때문이었다]].","due (형) ~때문인"]]}]},{"day":41,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"optimist","a":"2","e":"② optimist: (항상 기대하는 사람 / 좋은 일이 일어날 것이라고) 낙관주의자","w":"① realist: 현실주의자\n③ critic: 비평가\n④ dreamer: 몽상가","k":"항상 기대하는 사람 / 좋은 일이 일어날 것이라고","m":0,"s":"\"a person who always expects that good things will happen\"","c":["realist","optimist","critic","dreamer"],"mn":"낙관주의자","hk":"optimist(낙관주의자)는 좋은 일을 기대하는 사람이고 반대편은 pessimist(비관주의자). realist(현실주의자)는 현실 그대로 보는 사람이라 속임수 보기.","ex":[["She is [[an optimist]] who always sees the bright side.","그녀는 늘 밝은 면을 보는 [[낙관주의자]]이다."],["Being [[a born optimist]], he never gave up hope.","[[타고난 낙관주의자]]라서 그는 희망을 버리지 않았다."],["[[An optimist]] believes tomorrow will be better.","[[낙관주의자]]는 내일이 더 나을 것이라고 믿는다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"turnover","a":"3","e":"③ turnover: 이직률; (총)매출액, 회전율","w":"① 노출, 폭로(exposure)\n② 기여, 공헌(contribution)\n④ 예외(exception)","m":0,"s":"turnover","c":["노출, 폭로","기여, 공헌","이직률","예외"],"mn":"이직률","hk":"turnover(이직률)는 staff(직원)와 짝지어 staff turnover(직원 이직률)로 자주 씀. exposure(노출)·exception(예외)은 다른 단어.","ex":[["The company has a high [[staff turnover]] each year.","그 회사는 해마다 [[직원 이직률]]이 높다."],["[[High turnover]] costs a business time and money.","[[높은 이직률]]은 기업에 시간과 돈이 들게 한다."],["The school wants to lower its [[teacher turnover]].","그 학교는 [[교사 이직률]]을 낮추고 싶어 한다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"exist","a":"2,3","e":"② disappear: 사라지다 (과학자들은 이 심해 종들 중 일부가 탐사되지 않은 바다에 여전히 존재한다고 믿는다.) / exist(존재하다, 실재하다)의 반의어.\n③ vanish: 사라지다, 자취를 감추다","w":"① remain: 남아 있다\n④ survive: 살아남다","k":"과학자들은 이 심해 종들 중 일부가 탐사되지 않은 바다에 여전히 존재한다고 믿는다.","m":2,"s":"Scientists believe that some of these deep-sea species still exist in unexplored waters.","h":"exist","c":["remain","disappear","vanish","survive"],"mn":"존재하다, 실재하다","hk":"exist(존재하다)의 반대편은 disappear(사라지다)와 vanish(사라지다). remain(남아 있다)·survive(살아남다)는 같은 편이라 속임수.","ex":[["Dinosaurs no longer [[exist]] on Earth.","공룡은 더 이상 지구에 [[존재하지]] 않는다.","exist (동) 존재하다, 실재하다"],["The magician made the coin [[disappear]] in front of us.","마술사는 우리 앞에서 동전을 [[사라지게]] 했다.","disappear (동) 사라지다"],["The rabbit [[vanished]] into the dark forest.","토끼는 어두운 숲속으로 [[사라졌다]].","vanish (동) 사라지다, 자취를 감추다"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"major","a":"3","e":"major (형) 주요한, 중요한 - majority (명) 대다수\n③ addicted (형) 중독된, 빠진 - addiction (명) 중독","w":"① danger (명) 위험 - dangerous (형) 위험한\n② wide (형) 넓은 - widen (동) 넓히다\n④ quick (형) 빠른 - quickly (부) 빠르게","m":0,"s":"major - majority","c":["danger - dangerous","wide - widen","addicted - addiction","quick - quickly"],"mn":"주요한, 중요한","hk":"major(주요한)에서 majority(대다수)로 형용사에서 명사 방향. addicted(중독된)에서 addiction(중독)이 같고 danger(위험)에서 dangerous(위험한)는 반대.","ex":[["Exercise is [[a major part]] of a healthy life.","운동은 건강한 삶의 [[주요한 부분]]이다.","major (형) 주요한, 중요한"],["[[The majority]] of students voted for the plan.","학생들의 [[대다수]]가 그 계획에 투표했다.","majority (명) 대다수"],["He is [[addicted to]] online games.","그는 온라인 게임에 [[중독되어 있다]].","addicted (형) 중독된, 빠진"],["[[Addiction]] to sugar is hard to break.","설탕 [[중독]]은 끊기가 어렵다.","addiction (명) 중독"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"prevailed","a":"4","e":"④ prevailed: 승리하다, 이기다 (prevail의 과거형) (수적으로 열세였음에도 불구하고 더 작은 군대가 최후의 전투에서 승리했다.)","w":"① competed: 경쟁하다 (compete의 과거형)\n② retreated: 후퇴하다 (retreat의 과거형)\n③ struggled: 고전하다 (struggle의 과거형)","k":"수적으로 열세였음에도 불구하고 더 작은 군대가 최후의 전투에서 승리했다.","m":0,"s":"Though the smaller army was outnumbered, it ________ in the final battle.","c":["competed","retreated","struggled","prevailed"],"mn":"승리하다, 이기다","hk":"prevail(승리하다)의 과거형 prevailed(승리했다). compete(경쟁하다)는 겨루기만 하고, retreat(후퇴하다)는 오히려 반대 방향인 속임수.","ex":[["After a long fight, justice [[prevailed]].","긴 싸움 끝에 정의가 [[승리했다]]."],["Her plan [[prevailed over]] all the others.","그녀의 계획이 다른 모든 계획을 [[이겼다]]."],["The smaller team [[prevailed]] in the last game.","그 작은 팀은 마지막 경기에서 [[승리했다]]."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"succeed","a":"succeed","e":"succeed (동) 성공하다 / (동) 뒤를 잇다, 계승하다","k":"그 붐비는 거리의 새 식당들 중 극소수만이 첫해에 성공한다.\n장남이 가족 사업의 대표로 아버지의 뒤를 이을 것이다.","m":0,"s":"Only a few of the new restaurants on that crowded street s______ in their very first year.\nThe eldest son will s______ his father as the head of the family business.","mn":"성공하다 / 뒤를 잇다, 계승하다","hk":"succeed(성공하다, 뒤를 잇다)는 명사로 갈라져 success(성공)와 successor(후계자). succeed in(~에 성공하다)은 성공, 사람을 바로 받으면 뒤를 잇다.","ex":[["She worked hard and [[succeeded in]] passing the test.","그녀는 열심히 공부해서 시험 통과에 [[성공했다]].","succeed (동) 성공하다"],["Many people dream of [[succeeding]] in business.","많은 사람이 사업에서 [[성공하기]]를 꿈꾼다.","succeed (동) 성공하다"],["The prince will one day [[succeed]] the king.","그 왕자는 언젠가 왕의 [[뒤를 이을]] 것이다.","succeed (동) 뒤를 잇다, 계승하다"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"announce","a":"3","e":"③ report: 알리다, 보도하다 (교장 선생님이 내일 아침에 대회 우승자들을 발표할 것이다.) / announce(발표하다, 알리다)의 유의어.","w":"① postpone: 연기하다\n② withdraw: 철회하다\n④ review: 검토하다","k":"교장 선생님이 내일 아침에 대회 우승자들을 발표할 것이다.","m":0,"s":"The principal will announce the winners of the contest tomorrow morning.","h":"announce","c":["postpone","withdraw","report","review"],"mn":"발표하다, 알리다","hk":"announce(발표하다)는 report(알리다, 보도하다)와 같은 편. postpone(연기하다)·withdraw(철회하다)·review(검토하다)는 발표와 거리가 먼 속임수.","ex":[["The school will [[announce]] the news on Monday.","학교는 월요일에 그 소식을 [[발표할]] 것이다."],["He [[announced that]] he would leave the team.","그는 팀을 떠날 것이라고 [[발표했다]]."],["The singer will [[announce a new album]] soon.","그 가수는 곧 [[새 앨범을 발표할]] 것이다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"publisher","a":"publisher","e":"※ press도 ‘출판사’를 뜻하지만 her press처럼 개인과 계약한 곳을 가리킬 때는 쓰지 않는다.","k":"그녀는 새 원고를 자신의 출판사에 보내고 답장을 기다렸다.","m":0,"s":"She sent her new manuscript to her p______ and waited for a reply.","hk":"publisher(출판사)는 publish(출판하다)에 -er(~하는 사람·회사)가 붙은 꼴. 가운데 sh와 끝의 er을 챙기기.","ex":[["The [[publisher]] printed ten thousand copies of the book.","[[출판사]]는 그 책을 만 부 찍었다."],["She sent her story to [[a famous publisher]].","그녀는 자신의 이야기를 [[유명한 출판사]]에 보냈다."],["He works for [[a large publisher]] in Seoul.","그는 서울에 있는 [[큰 출판사]]에서 일한다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"fame","a":"2","e":"② fame: 명성","w":"① pride: 자부심, 자랑\n③ approval: 승인, 찬성\n④ fortune: 재산, 운","m":0,"s":"\"명성\"","c":["pride","fame","approval","fortune"],"mn":"명성","hk":"fame(명성)은 famous(유명한)와 한 가족. pride(자부심)는 마음속 느낌이고 fortune(재산, 운)은 돈이나 운이라 명성과 구분.","ex":[["The actor [[gained fame]] at a young age.","그 배우는 어린 나이에 [[명성을 얻었다]]."],["[[Fame and fortune]] do not always bring happiness.","[[명성과 부]]가 늘 행복을 가져다주지는 않는다."],["The singer's [[world fame]] began with one song.","그 가수의 [[세계적인 명성]]은 한 곡에서 시작되었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"create","a":"3","e":"③ destroy: 파괴하다 (그 새 법은 젊은 노동자들을 위한 더 많은 일자리를 만들기 위해 작성되었다.) / create(만들어 내다, 창조하다)의 반의어.","w":"① form: 형성하다\n② produce: 생산하다\n④ build: 세우다, 짓다","k":"그 새 법은 젊은 노동자들을 위한 더 많은 일자리를 만들기 위해 작성되었다.","m":0,"s":"The new law was written to create more jobs for young workers.","h":"create","c":["form","produce","destroy","build"],"mn":"만들어 내다, 창조하다","hk":"create(창조하다)의 반대편은 destroy(파괴하다). form(형성하다)·produce(생산하다)·build(세우다)는 모두 만드는 쪽이라 같은 편 속임수.","ex":[["Artists [[create]] new things from nothing.","예술가들은 아무것도 없는 데서 새로운 것을 [[창조한다]].","create (동) 만들어 내다, 창조하다"],["The new factory will [[create]] a thousand jobs.","새 공장은 천 개의 일자리를 [[만들어 낼]] 것이다.","create (동) 만들어 내다, 창조하다"],["The storm [[destroyed]] many old houses.","폭풍이 많은 낡은 집을 [[파괴했다]].","destroy (동) 파괴하다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"vacate","a":"1","e":"① vacate: (어떤 장소를 떠나다 / 특히 건물을 / 그곳이 비게 되도록) 비우다, 떠나다","w":"② inhabit: 거주하다\n③ occupy: 차지하다, 점유하다\n④ settle: 정착하다","k":"어떤 장소를 떠나다 / 특히 건물을 / 그곳이 비게 되도록","m":0,"s":"\"to leave a place, especially a building, so that it becomes empty\"","c":["vacate","inhabit","occupy","settle"],"mn":"비우다, 떠나다","hk":"vacate(비우다)는 vacant(비어 있는)와 같은 뿌리로 비게 만든다는 뜻. occupy(차지하다)·inhabit(거주하다)은 채우는 쪽이라 반대편 속임수.","ex":[["Guests must [[vacate the room]] by noon.","손님들은 정오까지 [[방을 비워야]] 한다."],["Please [[vacate the building]] at once.","즉시 [[건물을 비워]] 주세요."],["He [[vacated his seat]] for an old woman.","그는 한 노부인을 위해 [[자리를 비웠다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"confide","a":"2","e":"② confide: 비밀을 털어놓다, 신뢰하다 (많은 환자들이 깊이 신뢰하는 의사에게 자신의 증상을 털어놓는다.)","w":"① conceal: 숨기다\n③ cure: 치료하다\n④ dismiss: 일축하다","k":"많은 환자들이 깊이 신뢰하는 의사에게 자신의 증상을 털어놓는다.","m":0,"s":"Many patients ________ their symptoms to doctors they trust deeply.","c":["conceal","confide","cure","dismiss"],"mn":"비밀을 털어놓다, 신뢰하다","hk":"confide(털어놓다)는 믿는 사람에게만 속마음을 말하는 것으로, confident(자신 있는)와 같은 믿음 뿌리. conceal(숨기다)은 정반대 속임수.","ex":[["She likes to [[confide in]] her best friend.","그녀는 가장 친한 친구에게 [[속마음을 털어놓기]]를 좋아한다."],["He [[confided his secret to]] his sister.","그는 누나에게 [[비밀을 털어놓았다]]."],["Many people [[confide their worries]] to a counselor.","많은 사람이 상담사에게 [[걱정을 털어놓는다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"achieved","a":"1","e":"① reached: 도달하다, 이루다 (reach의 과거형) (수년간의 훈련 끝에 그녀는 마침내 마라톤 완주라는 목표를 이루었다.) / achieve(이루다, 달성하다)의 유의어.","w":"② missed: 놓치다 (miss의 과거형)\n③ shared: 공유하다 (share의 과거형)\n④ delayed: 미루다 (delay의 과거형)","k":"수년간의 훈련 끝에 그녀는 마침내 마라톤 완주라는 목표를 이루었다.","m":0,"s":"After years of training, she finally achieved her goal of running a marathon.","h":"achieved","c":["reached","missed","shared","delayed"],"mn":"이루다, 달성하다","wb":"achieve","hk":"achieve(이루다)는 reach(도달하다, 이루다)와 같은 편. miss(놓치다)는 반대편이고 share(공유하다)·delay(미루다)는 뜻이 다른 속임수.","ex":[["He [[achieved his goal]] after hard work.","그는 열심히 노력한 끝에 [[목표를 이루었다]]."],["The team [[achieved great success]] this year.","그 팀은 올해 [[큰 성공을 거두었다]]."],["She [[achieved good grades]] in every subject.","그녀는 모든 과목에서 [[좋은 성적을 거두었다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"sculpt","a":"sculpt","e":"sculpt 조각하다, 형태를 만들다","k":"그 유명한 전통 예술가는 나무 한 덩이로 아름다운 동물을 조각할 것이다.","m":0,"s":"The famous traditional artist will s______ a beautiful animal out of a single block of wood.","mn":"조각하다, 형태를 만들다","hk":"sculpt(조각하다)는 철자가 까다로워 명사 sculpture(조각품)와 함께 묶어 외우기. 끝의 두 글자를 놓치지 않기.","ex":[["He can [[sculpt a statue]] from stone.","그는 돌로 [[조각상을 조각할]] 수 있다."],["The artist likes to [[sculpt in clay]].","그 예술가는 [[점토로 조각하기]]를 좋아한다."],["She will [[sculpt a horse]] out of wood.","그녀는 나무로 [[말을 조각할]] 것이다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"custom","a":"3","e":"①관습, 풍습 / ②관습, 풍습 / ③세관 / ④관습, 풍습 [③번만 의미가 다름]","k":"①그 마을은 여전히 새해 전야에 등을 켜는 관습을 지킨다.\n②사람을 만날 때 악수하는 것은 많은 나라에서 오래된 관습이다.\n③우리는 공항 세관에서 여행 가방을 열어야 했다.\n④이웃에게 작은 선물을 주는 것은 수 세기 동안 이어져 온 관습이다.","m":0,"c":["The village still keeps the custom of lighting lamps on New Year's Eve.","Shaking hands when meeting someone is an old custom in many countries.","We had to open our suitcases at customs in the airport.","Giving small gifts to neighbors is a custom that has lasted for centuries."],"hc":"custom|custom|customs|custom","mn":"관습, 풍습 / 세관","hk":"③번 customs(세관)만 다른 뜻으로, 공항에서 짐을 검사하는 곳. 나머지는 모두 custom(관습, 풍습).","ex":[["Bowing is a polite [[custom]] in Korea.","절하는 것은 한국에서 예의 바른 [[관습]]이다.","custom (명) 관습, 풍습"],["It is [[the custom]] to take off shoes at home.","집에서 신발을 벗는 것은 [[관습]]이다.","custom (명) 관습, 풍습"],["We showed our passports at [[customs]].","우리는 [[세관]]에서 여권을 보여 주었다.","customs (명) 세관"]]}]},{"day":42,"q":[{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"allow","a":"3","e":"③ block: 막다, 금지하다 (그 박물관은 방문객들이 중앙 홀 안에서 사진 찍는 것을 허락하지 않는다.) / allow(허락하다, 허용하다)의 반의어.","w":"① permit: 허가하다\n② approve: 승인하다\n④ accept: 받아들이다","k":"그 박물관은 방문객들이 중앙 홀 안에서 사진 찍는 것을 허락하지 않는다.","m":0,"s":"The museum does not allow visitors to take photographs inside the main hall.","h":"allow","c":["permit","approve","block","accept"],"mn":"허락하다, 허용하다","hk":"allow(허락하다)의 반대편은 block(막다, 금지하다). permit(허가하다)·approve(승인하다)·accept(받아들이다)는 같은 편이라 속임수.","ex":[["Dogs are not [[allowed]] in this shop.","이 가게에는 개가 [[허용되지]] 않는다.","allow (동) 허락하다, 허용하다"],["My parents [[allow me to]] use the phone at night.","부모님은 내가 밤에 전화를 쓰도록 [[허락하신다]].","allow (동) 허락하다, 허용하다"],["A fallen tree [[blocked]] the road.","쓰러진 나무가 도로를 [[막았다]].","block (동) 막다, 금지하다"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"wildlife","a":"2","e":"② wildlife: 야생 생물","w":"① habitat: 서식지\n③ vegetation: 초목, 식물\n④ landscape: 풍경, 경관","m":0,"s":"\"야생 생물\"","c":["habitat","wildlife","vegetation","landscape"],"mn":"야생 생물","hk":"wildlife(야생 생물)는 wild(야생의)와 life(생명)가 합쳐진 말. habitat(서식지)은 사는 곳, vegetation(초목)은 식물, landscape(풍경)는 경치라 구분.","ex":[["Rangers work to [[protect wildlife]] in the park.","관리인들은 공원의 [[야생 생물을 보호하려고]] 일한다."],["A [[wildlife photographer]] waited for hours.","[[야생 생물 사진작가]]는 몇 시간 동안 기다렸다."],["Pollution is harmful to [[wildlife]].","오염은 [[야생 생물]]에게 해롭다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"inject","a":"2","e":"② inject: (액체를 넣다 / 특히 약을 / 누군가의 몸속에 바늘로) 주입하다, 주사하다","w":"① swallow: 삼키다\n③ dissolve: 녹이다, 용해시키다\n④ absorb: 흡수하다","k":"액체를 넣다 / 특히 약을 / 누군가의 몸속에 바늘로","m":0,"s":"\"to put a liquid, especially medicine, into someone's body with a needle\"","c":["swallow","inject","dissolve","absorb"],"mn":"주입하다, 주사하다","hk":"inject(주입하다)는 바늘로 약을 몸속에 넣는 것이고 명사는 injection(주사). swallow(삼키다)·absorb(흡수하다)는 바늘이 없는 속임수.","ex":[["The nurse will [[inject]] the medicine into your arm.","간호사가 약을 당신의 팔에 [[주사할]] 것이다."],["Doctors [[inject a vaccine]] to protect people.","의사들은 사람들을 보호하려고 [[백신을 주사한다]]."],["The vet [[injected medicine]] into the sick dog.","수의사는 아픈 개에게 [[약을 주사했다]]."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알 des.","판사가 양측 사이를 [[중재할]] 수 있다."],["He was asked to [[mediate in]] the quarrel.","그는 그 다툼을 [[중재해]] 달라는 요청을 받았다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"route","a":"3","e":"③ path: 길, 오솔길 (그 버스는 주요 도로가 폐쇄될 때마다 다른 노선으로 간다.) / route(길, 경로)의 유의어.","w":"① station: 역, 정류장\n② tunnel: 터널\n④ bridge: 다리","k":"그 버스는 주요 도로가 폐쇄될 때마다 다른 노선으로 간다.","m":0,"s":"The bus takes a different route whenever the main road is closed.","h":"route","c":["station","tunnel","path","bridge"],"mn":"길, 경로","hk":"route(길, 경로)는 path(길, 오솔길)와 같은 편. station(역)·tunnel(터널)·bridge(다리)는 길 위의 시설이지 길 자체가 아니라 속임수.","ex":[["We took [[a different route]] home.","우리는 집에 갈 때 [[다른 길]]로 갔다."],["This is [[the shortest route]] to the beach.","이것이 해변으로 가는 [[가장 짧은 길]]이다."],["The [[bus route]] passes the school.","[[버스 노선]]은 학교를 지나간다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"betrayed","a":"2","e":"② betrayed: 배신하다 (betray의 과거형) (그 불충한 군인은 적에게 비밀을 넘김으로써 자기 나라를 배신했다.)","w":"① served: 복무하다 (serve의 과거형)\n③ defended: 방어하다 (defend의 과거형)\n④ honored: 명예롭게 하다 (honor의 과거형)","k":"그 불충한 군인은 적에게 비밀을 넘김으로써 자기 나라를 배신했다.","m":0,"s":"The disloyal soldier ________ his country by handing secrets to the enemy.","c":["served","betrayed","defended","honored"],"mn":"배신하다","hk":"betray(배신하다)의 과거형 betrayed(배신했다). served(복무했다)·defended(지켰다)·honored(명예롭게 했다)는 나라 편이라 정반대인 속임수.","ex":[["He [[betrayed his friend]] for money.","그는 돈 때문에 [[친구를 배신했다]]."],["She felt [[betrayed by]] her friend.","그녀는 친구에게 [[배신당했다고]] 느꼈다."],["They [[betrayed our trust]].","그들은 [[우리의 믿음을 저버렸다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"trail","a":"trail","e":"trail 오솔길, 자국","k":"등산객들은 울창한 산림을 통과하는 등산로를 따라갔다.","m":0,"s":"Hikers followed the hiking t______ that ran through the dense mountain forest.","mn":"오솔길, 자국","hk":"trail(오솔길)은 tail(꼬리)·rail(철길)에 글자 하나가 더 붙은 꼴이라 철자 순서를 지키기.","ex":[["We walked along [[a forest trail]].","우리는 [[숲속 오솔길]]을 따라 걸었다."],["The dog followed [[the trail]] of the rabbit.","개는 토끼의 [[자국]]을 따라갔다."],["[[The hiking trail]] closes at night.","[[등산로]]는 밤에 닫힌다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"reflected","a":"3","e":"①반영하다 / ②반영하다 / ③곰곰이 생각하다 / ④반영하다 [③번만 의미가 다름]","k":"①그녀의 차분한 목소리는 어려운 상황에서의 수년간의 경험을 반영했다.\n②시장의 가격은 사람들이 상품을 얼마나 원하는지를 반영한다.\n③면접이 끝난 후, 그는 조용히 앉아 자신의 대답을 곰곰이 생각했다.\n④선거 결과는 평범한 시민들의 의견을 반영한다.","m":0,"c":["Her steady voice reflected years of experience in difficult situations.","Prices in the market reflect how much people want a product.","After the interview, he sat quietly and reflected on his answers.","The results of the election reflect the opinions of ordinary citizens."],"hc":"reflected|reflect|reflected|reflect","mn":"반영하다 / 곰곰이 생각하다","hk":"③번 reflected on(~을 곰곰이 생각했다)만 생각하는 뜻. 나머지는 모두 거울처럼 드러내 보이는 reflect(반영하다).","ex":[["Her face [[reflected]] her happiness.","그녀의 얼굴은 행복을 [[반영했다]].","reflect (동) 반영하다"],["The test results [[reflect]] your hard work.","시험 결과는 너의 노력을 [[반영한다]].","reflect (동) 반영하다"],["He sat and [[reflected on]] his mistakes.","그는 앉아서 자기 실수를 [[곰곰이 생각했다]].","reflect (동) 곰곰이 생각하다"]]}]},{"day":43,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"deforestation","a":"2","e":"② deforestation: 삼림 벌채","w":"① cultivation: 경작, 재배\n③ reforestation: 재조림, 숲 되살리기\n④ irrigation: 관개, 물 대기","m":0,"s":"\"삼림 벌채\"","c":["cultivation","deforestation","reforestation","irrigation"],"mn":"삼림 벌채","hk":"deforestation(삼림 벌채)은 forest(숲)를 없앤다는 뜻. reforestation(재조림)은 숲을 다시 만드는 반대편 속임수.","ex":[["[[Rapid deforestation]] harms many animals.","[[급속한 삼림 벌채]]는 많은 동물에게 해를 끼친다."],["Farming is one cause of [[deforestation]].","농업은 [[삼림 벌채]]의 한 원인이다."],["We must [[stop deforestation]] now.","우리는 지금 [[삼림 벌채를 멈춰야]] 한다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"external","a":"2","e":"② internal: 내부의 (그 기술자들은 시험 비행 중에 우주선의 외부 온도를 측정했다.) / external(외부의, 바깥의)의 반의어.","w":"① exterior: 외부의, 바깥쪽의\n③ outward: 겉으로 드러나는\n④ outer: 바깥의","k":"그 기술자들은 시험 비행 중에 우주선의 외부 온도를 측정했다.","m":0,"s":"The engineers measured the external temperature of the spacecraft during the test flight.","h":"external","c":["exterior","internal","outward","outer"],"mn":"외부의, 바깥의","hk":"external(외부의)의 반대편은 internal(내부의). exterior(외부의)·outward(겉으로 드러나는)·outer(바깥의)는 같은 바깥쪽이라 속임수.","ex":[["Loud [[external noise]] woke the baby.","큰 [[외부 소음]]이 아기를 깨웠다.","external (형) 외부의, 바깥의"],["The company needs [[external help]].","그 회사는 [[외부의 도움]]이 필요하다.","external (형) 외부의, 바깥의"],["The doctor checked her [[internal organs]].","의사는 그녀의 [[내부 장기]]를 검사했다.","internal (형) 내부의"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"sustainable","a":"4","e":"④ sustainable: 지속 가능한 (지속 가능한 개발은 미래의 환경을 해치지 않으면서 현재의 필요를 충족시킨다.)","w":"① affordable: 감당할 수 있는\n② disposable: 일회용의\n③ profitable: 수익성 있는","k":"지속 가능한 개발은 미래의 환경을 해치지 않으면서 현재의 필요를 충족시킨다.","m":0,"s":"________ development meets current needs without damaging the future environment.","c":["affordable","disposable","profitable","sustainable"],"mn":"지속 가능한","hk":"sustainable(지속 가능한)은 sustain(유지하다)에 -able이 붙음. affordable(감당할 수 있는)·disposable(일회용의)·profitable(수익성 있는)은 속임수.","ex":[["We need [[sustainable energy]] for the future.","우리는 미래를 위해 [[지속 가능한 에너지]]가 필요하다."],["Farmers use [[sustainable methods]] to protect soil.","농부들은 흙을 보호하려고 [[지속 가능한 방법]]을 쓴다."],["The city wants [[sustainable growth]].","그 도시는 [[지속 가능한 성장]]을 원한다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"bare","a":"bare","e":"bare (형) 벌거벗은, 맨 / (동) (숨긴 것을) 드러내다","k":"등반가들은 장갑을 잃어버려서 맨손으로 얼어붙은 바위를 건넜다.\n그는 방금 만난 사람에게 자신의 속마음을 결코 드러내지 않을 것이다.","m":0,"s":"The climbers crossed the icy rocks with b______ hands because they had lost their gloves.\nHe would never b______ his soul to someone he had just met.","mn":"벌거벗은, 맨 / 드러내다","hk":"bare(벌거벗은, 맨)는 bare hands(맨손)처럼 쓰고 동사로는 속을 드러냄. 발음이 같은 bear(곰, 참다)와 철자를 구분.","ex":[["He walked on the sand with [[bare feet]].","그는 [[맨발]]로 모래 위를 걸었다.","bare (형) 벌거벗은, 맨"],["The trees were [[bare]] in winter.","겨울에 나무들은 [[헐벗어]] 있었다.","bare (형) 벌거벗은, 맨"],["She decided to [[bare her heart]] to him.","그녀는 그에게 [[속마음을 드러내기로]] 했다.","bare (동) 드러내다"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"attribute","a":"4","e":"④ trait: 특징, 특성 (인내심은 어린아이들과 함께 일하는 사람에게 가장 값진 특성이다.) / attribute(속성, 특성)의 유의어.","w":"① impulse: 충동\n② mannerism: 버릇, 습관적 태도\n③ motive: 동기","k":"인내심은 어린아이들과 함께 일하는 사람에게 가장 값진 특성이다.","m":0,"s":"Patience is the most valuable attribute for anyone who works with young children.","h":"attribute","c":["impulse","mannerism","motive","trait"],"mn":"속성, 특성","hk":"attribute(속성, 특성)는 trait(특징, 특성)와 같은 편. impulse(충동)·motive(동기)·mannerism(버릇)은 특성이 아니라 속임수.","ex":[["Honesty is [[an important attribute]].","정직은 [[중요한 특성]]이다."],["Kindness is her best [[attribute]].","친절은 그녀의 가장 좋은 [[특성]]이다."],["Leaders share some [[common attributes]].","리더들은 몇 가지 [[공통된 특성]]을 공유한다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"comply","a":"2","e":"comply (동) (법·규칙을) 따르다, 준수하다 - compliance (명) 준수, 따름\n② expend (동) (돈·시간을) 쓰다, 소비하다 - expenditure (명) 지출, 소비","w":"① eminent (형) 저명한, 뛰어난 - eminence (명) 저명함, 탁월함\n③ immoral (형) 부도덕한 - immorality (명) 부도덕\n④ monotonous (형) 단조로운, 지루한 - monotony (명) 단조로움","m":0,"s":"comply - compliance","c":["eminent - eminence","expend - expenditure","immoral - immorality","monotonous - monotony"],"mn":"(법·규칙을) 따르다, 준수하다","hk":"comply(따르다, 동)에서 compliance(준수, 명)로 가는 동사에서 명사 방향. expend(쓰다, 동)에서 expenditure(지출, 명)가 같은 방향이고 나머지는 형용사에서 명사.","ex":[["Drivers must [[comply with]] the traffic rules.","운전자는 교통 규칙을 [[따라야]] 한다.","comply (동) 따르다, 준수하다"],["[[Compliance with]] the law is required.","법 [[준수]]가 요구된다.","compliance (명) 준수, 따름"],["Don't [[expend all your energy]] early.","초반에 [[모든 에너지를 쓰지]] 마라.","expend (동) 쓰다, 소비하다"],["Public [[expenditure]] rose last year.","공공 [[지출]]이 작년에 늘었다.","expenditure (명) 지출, 소비"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"signature","a":"signature","e":"signature 서명","k":"은행은 서명이 보관된 것과 일치하지 않아 그 수표를 거절했다.","m":0,"s":"The bank refused the check because the s______ did not match the one kept on file.","mn":"서명","hk":"signature(서명)는 sign(서명하다)에 -ature가 붙은 꼴이라 g를 빼먹지 말고 끝을 -ature로 쓰기.","ex":[["Please put your [[signature]] on this paper.","이 서류에 당신의 [[서명]]을 해 주세요."],["The letter had no [[signature]].","그 편지에는 [[서명]]이 없었다."],["[[Her signature]] is hard to read.","[[그녀의 서명]]은 읽기 어렵다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"encrypt","a":"3","e":"③ encrypt: (정보를 비밀스러운 형태로 바꾸다 / 열쇠를 가진 사람만이 그것을 읽을 수 있도록) 암호화하다","w":"① archive: 보관하다, 기록 보관하다\n② decipher: 해독하다\n④ compress: 압축하다","k":"정보를 비밀스러운 형태로 바꾸다 / 열쇠를 가진 사람만이 그것을 읽을 수 있도록","m":0,"s":"\"to change information into a secret form so that only people with a key can read it\"","c":["archive","decipher","encrypt","compress"],"mn":"암호화하다","hk":"encrypt(암호화하다)의 반대는 decipher(해독하다). archive(보관하다)·compress(압축하다)는 비밀로 만드는 일이 아니라 속임수.","ex":[["Banks [[encrypt]] your data to keep it safe.","은행은 데이터를 안전하게 지키려고 [[암호화한다]]."],["You should [[encrypt your files]].","너는 [[파일을 암호화하는]] 게 좋다."],["The app will [[encrypt every message]].","그 앱은 [[모든 메시지를 암호화할]] 것이다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"ignorant","a":"2","e":"② aware: 알고 있는, 인식하는 (많은 운전자들이 지난달 시행된 새 교통 규칙을 여전히 모르고 있다.) / ignorant(모르는, 무지한)의 반의어.","w":"① unfamiliar: 익숙하지 않은\n③ uninformed: 잘 알지 못하는\n④ uneducated: 교육받지 못한","k":"많은 운전자들이 지난달 시행된 새 교통 규칙을 여전히 모르고 있다.","m":0,"s":"Many drivers are still ignorant of the new traffic rules that took effect last month.","h":"ignorant","c":["unfamiliar","aware","uninformed","uneducated"],"mn":"모르는, 무지한","hk":"ignorant(모르는)의 반대편은 aware(알고 있는). unfamiliar(익숙하지 않은)·uninformed(잘 알지 못하는)·uneducated(교육받지 못한)는 같은 편 속임수.","ex":[["He was [[ignorant of]] the rules.","그는 규칙을 [[몰랐다]].","ignorant (형) 모르는, 무지한"],["Don't be [[ignorant about]] your health.","건강에 [[무지하지]] 마라.","ignorant (형) 모르는, 무지한"],["Are you [[aware of]] the problem?","너는 그 문제를 [[알고 있니]]?","aware (형) 알고 있는, 인식하는"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"intensive","a":"4","e":"④ intensive: 집중적인, 심화된 (집중적인 훈련은 학생들을 전문 연구의 까다로운 도전에 대비시킨다.)","w":"① casual: 가벼운, 대충 하는\n② expansive: 광범위한, 팽창하는\n③ passive: 수동적인, 소극적인","k":"집중적인 훈련은 학생들을 전문 연구의 까다로운 도전에 대비시킨다.","m":0,"s":"________ training prepares students for the demanding challenges of professional research.","c":["casual","expansive","passive","intensive"],"mn":"집중적인, 심화된","hk":"intensive(집중적인)는 intense(강렬한)와 한 가족. casual(가벼운)·passive(수동적인)·expansive(광범위한)는 힘을 모으는 느낌과 반대라 속임수.","ex":[["She took [[an intensive course]] in English.","그녀는 영어 [[집중 강좌]]를 들었다."],["The patient needs [[intensive care]].","그 환자는 [[집중 치료]]가 필요하다."],["He did [[intensive training]] for a month.","그는 한 달 동안 [[집중 훈련]]을 했다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"negligible","a":"2","e":"② negligible: 무시할 만한, 사소한","w":"① 태만한, 소홀한(negligent)\n③ 협상할 수 있는(negotiable)\n④ 읽기 쉬운, 알아볼 수 있는(legible)","m":0,"s":"negligible","c":["태만한, 소홀한","무시할 만한, 사소한","협상할 수 있는","읽기 쉬운, 알아볼 수 있는"],"mn":"무시할 만한, 사소한","hk":"negligible(무시할 만한)은 neglect(소홀히 하다)와 한 뿌리로 신경 쓰지 않아도 될 만큼 작음. negligent(태만한)는 사람의 태도라 속임수.","ex":[["The difference in price is [[negligible]].","가격 차이는 [[무시할 만하다]]."],["The risk is [[almost negligible]].","그 위험은 [[거의 무시할 만하다]]."],["A [[negligible amount]] of rain fell.","[[무시할 만한 양]]의 비가 내렸다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"intact","a":"1,3","e":"① undamaged: 손상되지 않은\n③ unharmed: 다치지 않은, 온전한 (그 고대 항아리는 지진이 박물관 전체를 흔든 뒤에도 여전히 온전했다.) / intact(온전한, 손상되지 않은)의 유의어.","w":"② restored: 복원된\n④ sealed: 밀봉된","k":"그 고대 항아리는 지진이 박물관 전체를 흔든 뒤에도 여전히 온전했다.","m":2,"s":"The ancient vase was still intact even after the earthquake shook the whole museum.","h"
