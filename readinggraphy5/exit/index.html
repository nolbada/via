itted"],"r":{"a":"[A] incorrect, [B] went","ev":"7번, 12번 문장","s":[[7,"The confederates answered first, intentionally giving incorrect answers.","그 공모자들은 의도적으로 잘못된 답변을 하며 먼저 대답했다."],[12,"Others admitted that, although they knew the correct answer, they went along with the group to avoid standing out.","다른 참가자들은 그들이 정답을 알았음에도 불구하고, 눈에 띄는 것을 피하기 위해 그 집단의 의견에 따랐다고 털어놓았다."]],"w":"7번: intentionally giving incorrect answers. 12번: went along with the group to avoid standing out.","c":null}}]},{"u":8,"id":"r24","no":24,"ko":"웃다가 큰일 날 뻔?!","items":[{"n":1,"t":"tf","q":"In one case, a man laughed nonstop for nearly two minutes and then died in his sleep.","h":"15a68af77d","ko":"한 사례에서 한 남자가 거의 2분간 쉬지 않고 웃은 뒤 잠든 상태로 사망했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In another case, a man laughed nonstop for nearly two minutes before dying in his sleep, possibly due to a loss of breath or heart failure.","또 다른 사례로, 한 남성이 거의 2분 동안 쉬지 않고 웃은 뒤 수면 중에 사망했는데, 이는 호흡 곤란이나 심장 마비 때문인 것으로 추정된다."]],"w":"6번 문장 laughed nonstop for nearly two minutes before dying in his sleep. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Extreme laughter is often called hysterical laughter.","h":"8441639899","ko":"극심한 웃음은 흔히 히스테리성 웃음이라고 불린다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Doctors explain that extreme laughter, often called hysterical laughter, can put a significant strain on the body.","의사들은 주로 히스테리성 웃음이라고 불리는 극단적인 웃음이 신체에 상당한 부담을 줄 수 있다고 설명한다."]],"w":"7번 문장 extreme laughter, often called hysterical laughter. 일치.","c":"T"}},{"n":3,"t":"tf","q":"In 1975, a man's laughter lasted for 25 hours before it caused a heart problem.","h":"00cba0ba60","ko":"1975년에 한 남자의 웃음이 25시간 지속된 뒤 심장 문제를 일으켰다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"One famous example occurred in 1975 when a man laughed uncontrollably while watching a comedy show.","한 유명한 예는 1975년 한 남성이 코미디 쇼를 시청하던 중 통제할 수 없이 웃었던 때에 일어났다."],[5,"Having lasted for 25 minutes, his laughter then triggered a heart problem that caused his heart to stop.","25분 동안 지속되고 나서, 그의 웃음은 이어 그의 심장을 멎게 한 심장 문제를 유발했다."]],"w":"5번 문장은 25 minutes(25분). 시간 단위를 hours로 바꾼 오답.","c":"F"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word in the passage?","h":"40c31e67cd","ko":"밑줄 친 hilarious의 뜻","opts":["끔찍한","지루한","아주 재미있는","부끄러운"],"word":"hilarious","r":{"a":"3) 아주 재미있는","ev":"1번 문장","s":[[1,"We’ve all heard the phrase, “I’m dying of laughter!” after hearing a hilarious joke.","우리는 모두 아주 재미있는 농담을 들은 후 “웃겨 죽겠어!”라는 말을 들어본 적이 있다."]],"w":"hilarious는 '아주 재미있는, 매우 유쾌한'. 웃다가 죽겠다는 표현이 나오는 상황의 농담.","c":3}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in the passage? (다의어)","h":"488a50aba2","ko":"밑줄 친 strokes의 문맥상 뜻 (stroke: 타격 / 쓰다듬기 / 뇌졸중)","opts":["타격, 한 번 치기","쓰다듬기","수영 영법","뇌졸중"],"word":"strokes","r":{"a":"4) 뇌졸중","ev":"9번 문장","s":[[9,"This can result in fainting, choking, or even heart-related issues such as heart attacks or strokes.","이것은 실신, 질식, 또는 심장마비나 뇌졸중과 같은 심장 관련 문제까지도 초래할 수 있다."]],"w":"heart attacks or strokes: 심장 마비와 함께 나오므로 '뇌졸중'. stroke는 명사 stroke의 복수형.","c":4}},{"n":6,"t":"ref","q":"What does the underlined 'this' refer to?","h":"925fb50e93","ko":"밑줄 친 this가 가리키는 것","oko":["웃다가 죽는 것","농담을 듣는 것","아주 재미있는 농담을 하는 것","코미디 쇼를 보는 것"],"sko":"하지만 이런 일이 실제로 일어날 수 있을까?","opts":["dying of laughter","hearing a joke","telling a hilarious joke","watching a comedy show"],"r":{"a":"1) dying of laughter","ev":"1~2번 문장","s":[[1,"We’ve all heard the phrase, “I’m dying of laughter!” after hearing a hilarious joke.","우리는 모두 아주 재미있는 농담을 들은 후 “웃겨 죽겠어!”라는 말을 들어본 적이 있다."],[2,"But could this ever actually happen?","하지만 이런 일이 실제로 일어날 수 있을까?"]],"w":"1번 문장에서 I'm dying of laughter를 말한 뒤 '이런 일(웃다가 죽는 일)이 실제로 일어날 수 있을까?'라고 물음.","c":1}},{"n":7,"t":"sense","q":"Which is closest in meaning to the sentence below? (Sentence 12)","h":"dc21bddb57","ko":"12번 문장 일부의 의미로 알맞은 것","sko":"웃음도 적당함이 중요하다","opts":["웃음은 몸에 해로우니 피해야 한다는 의미","웃음을 참을수록 건강에 좋다는 의미","웃음도 다른 모든 것처럼 적당히 하는 것이 중요하다는 의미","웃음이 몸에 미치는 영향은 의사만 판단할 수 있다는 의미"],"r":{"a":"3) 웃음도 다른 모든 것처럼 적당히 하는 것이 중요하다는 의미","ev":"12번 문장","s":[[12,"Just remember: as with anything, moderation is key — even when it comes to laughter.","단지, 다른 모든 것과 마찬가지로, 웃음도 적당함이 중요하다는 것을 기억하라."]],"w":"moderation is key = 절제(적당함)가 핵심. 웃음도 예외가 아니라는 뜻. 웃음을 피하라는 내용은 아님(10번).","c":3}},{"n":8,"t":"match","q":"Which is true about the passage?","h":"1d7e54b6b5","ko":"본문과 일치하는 것","oko":["의사들은 웃음이 몸에 전혀 영향을 주지 않는다고 말한다.","1975년에 25분간 지속된 한 남성의 웃음이 심장 문제를 유발했다.","웃음으로 인한 사망의 대부분은 일상생활에서 일어난다.","히스테리성 웃음은 약하고 조용한 웃음을 뜻한다."],"opts":["Doctors say laughing never affects the body.","A man's laughter that lasted 25 minutes triggered a heart problem in 1975.","Most deaths from laughter happen in everyday life.","Hysterical laughter means a mild and quiet laugh."],"r":{"a":"2) A man's laughter that lasted 25 minutes triggered a heart problem in 1975.","ev":"3번, 5번, 7번 문장","s":[[3,"Surprisingly, while rare, there have been real cases where extreme laughter led to (A) consequences.","놀랍게도, 드물기는 하지만, 극단적인 웃음이 해로운 결과로 이어진 실제 사례들이 있었다."],[5,"Having lasted for 25 minutes, his laughter then triggered a heart problem that caused his heart to stop.","25분 동안 지속되고 나서, 그의 웃음은 이어 그의 심장을 멎게 한 심장 문제를 유발했다."],[7,"Doctors explain that extreme laughter, often called hysterical laughter, can put a significant strain on the body.","의사들은 주로 히스테리성 웃음이라고 불리는 극단적인 웃음이 신체에 상당한 부담을 줄 수 있다고 설명한다."]],"w":"5번: 25분 지속된 웃음이 심장 문제를 유발(일치). 7번: 극심한 웃음은 몸에 큰 부담. 3번: 이런 사례는 드묾(while rare). hysterical은 병적으로 흥분한 웃음.","c":2}},{"n":9,"t":"sum","q":"Extreme laughter can strain the body and (A) serious problems in rare cases, but people should keep laughing because it is mostly (B).","h":"55065c062e","ko":"극심한 웃음은 드물게 몸에 부담을 주어 심각한 문제를 (A)할 수 있지만, 대부분은 (B)하므로 계속 웃어야 한다.","oko":["(A) 예방하다 / (B) 건강에 이로운","(A) 일으키다 / (B) 해로운","(A) 예방하다 / (B) 해로운","(A) 일으키다 / (B) 건강에 이로운","(A) 피하다 / (B) 위험한"],"opts":["(A) prevent / (B) healthy","(A) cause / (B) harmful","(A) prevent / (B) harmful","(A) cause / (B) healthy","(A) avoid / (B) dangerous"],"r":{"a":"4) (A) cause / (B) healthy","ev":"7~11번 문장","s":[[7,"Doctors explain that extreme laughter, often called hysterical laughter, can put a significant strain on the body.","의사들은 주로 히스테리성 웃음이라고 불리는 극단적인 웃음이 신체에 상당한 부담을 줄 수 있다고 설명한다."],[8,"The act of laughing intensely changes pressure in the chest, which can affect internal organs and disrupt oxygen flow to the brain.","심하게 웃는 행위는 가슴의 압력을 변화시키고, 이는 내부 장기에 영향을 주고 뇌로 가는 산소 흐름을 방해할 수 있다."],[9,"This can result in fainting, choking, or even heart-related issues such as heart attacks or strokes.","이것은 실신, 질식, 또는 심장마비나 뇌졸중과 같은 심장 관련 문제까지도 초래할 수 있다."],[10,"Although such cases are shocking, these rare examples shouldn’t stop anyone from laughing — it’s incredibly (B) in most cases.","이러한 사례들이 충격적이긴 하지만, 이런 드문 예들이 누구든 웃는 것을 멈추게 해서는 안 된다. 웃음은 대부분의 경우 매우 유익하다."],[11,"The saying “laughter is the best medicine” still holds true today.","‘웃음이 최고의 약이다’라는 속담은 오늘날에도 여전히 유효하다."]],"w":"극심한 웃음은 심장 문제 등을 일으킬 수 있음(5~9번)이나 드문 일이고, 대부분의 경우 매우 이로움(10~11번). cause / healthy.","c":4}},{"n":10,"t":"fill","q":"Doctors say extreme [A] puts a strain on the body and can even lead to heart [B].","h":"a3815463aa","ko":"의사들은 극심한 [A]이 몸에 부담을 주고 심지어 심장 [B]까지 이어질 수 있다고 말한다.","bko":{"laughter":"웃음","attacks":"발작(심장마비)","medicine":"약","moderation":"적당함, 절제","oxygen":"산소","chest":"가슴"},"bank":["laughter","attacks","medicine","moderation","oxygen","chest"],"r":{"a":"[A] laughter, [B] attacks","ev":"7번, 9번 문장","s":[[7,"Doctors explain that extreme laughter, often called hysterical laughter, can put a significant strain on the body.","의사들은 주로 히스테리성 웃음이라고 불리는 극단적인 웃음이 신체에 상당한 부담을 줄 수 있다고 설명한다."],[9,"This can result in fainting, choking, or even heart-related issues such as heart attacks or strokes.","이것은 실신, 질식, 또는 심장마비나 뇌졸중과 같은 심장 관련 문제까지도 초래할 수 있다."]],"w":"7번: extreme laughter가 몸에 부담. 9번: heart attacks or strokes로 이어질 수 있음.","c":null}}]},{"u":9,"id":"r25","no":25,"ko":"천재의 호기심이 남긴 영원한 메시지","items":[{"n":1,"t":"tf","q":"The Codex Leicester is a 72-page manuscript.","h":"a7f338265d","ko":"코덱스 레스터는 72쪽짜리 원고이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The Codex Leicester is a 72-page manuscript that provides a rare insight into da Vinci’s mind and his efforts to understand the natural world.","코덱스 레스터는 다빈치의 사고방식과 자연 세계를 이해하려는 그의 노력에 대해 진귀한 통찰을 제공하는 72페이지 분량의 원고이다."]],"w":"3번 문장에 a 72-page manuscript라고 나옴. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Gates kept the manuscript private so that only scholars could study it.","h":"ffaeca7612","ko":"게이츠는 학자들만 연구할 수 있도록 그 원고를 비공개로 두었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Gates even had the manuscript digitized so more people could follow and connect with da Vinci’s pursuit of knowledge.","게이츠는 더 많은 사람들이 다빈치의 지적 탐구를 따르고 공감할 수 있도록 그 원고를 디지털화하기까지 했다."]],"w":"8번 문장에서 게이츠는 더 많은 사람들이 따르고 공감하도록 원고를 디지털화함. 비공개가 아니라 공개 방향이라 F.","c":"F"}},{"n":3,"t":"tf","q":"The Codex Leicester has da Vinci's thoughts on the behavior of light.","h":"9cde14fe4a","ko":"코덱스 레스터에는 빛의 행동에 대한 다빈치의 생각이 담겨 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It captures his thoughts and sketches on topics such as the movement of water, the behavior of light, and the mysteries of the universe.","그것은 물의 움직임, 빛의 행동, 그리고 우주의 신비와 같은 주제에 대한 그의 생각과 스케치를 담고 있다."]],"w":"4번 문장에 thoughts and sketches on topics such as ... the behavior of light가 나옴. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"Bill Gates acquired the document for 30.8 million dollars.","h":"bfddfe1985","ko":"빌 게이츠는 그 문서를 3,080만 달러에 (acquired) 했다.","opts":["~을 잃어버렸다","~을 기부했다","~을 입수했다","~을 복원했다"],"word":"acquired","r":{"a":"3) ~을 입수했다","ev":"6번 문장","s":[[6,"In 1994, Microsoft co-founder Bill Gates acquired the document for 30.8 million dollars, making it the most expensive book ever sold.","1994년에, Microsoft의 공동 창립자인 빌 게이츠는 그 문서를 3,080만 달러에 인수하여, 그것이 역대 판매된 책 중에 가장 비싼 책이 되었다."]],"w":"acquire는 '입수하다, 획득하다'. 6번 문장에서 게이츠가 돈을 주고 문서를 손에 넣은 내용. 잃어버리거나 기부한 것이 아님.","c":3}},{"n":5,"t":"vocab","q":"Among his most valuable works is the Codex Leicester.","h":"272fd038e7","ko":"그의 가장 귀중한 (works) 중에는 코덱스 레스터가 있다.","opts":["작품","일자리","작동","공장"],"word":"works","r":{"a":"1) 작품","ev":"2번 문장","s":[[2,"Among his most valuable works is the Codex Leicester.","그의 가장 가치 있는 작품들 중 하나는 코덱스 레스터이다."]],"w":"work는 '일'이라는 뜻이 흔하지만 여기서는 다빈치가 만든 '작품'. 다의어라 문맥으로 판단. 모나리자 같은 걸작을 말하는 앞 문장 흐름과도 연결.","c":1}},{"n":6,"t":"ref","q":"In 1994, Microsoft co-founder Bill Gates acquired the document ... making it the most expensive book ever sold. 여기서 it이 가리키는 것은?","h":"1598639ccc","ko":"6번 문장의 making it에서 it이 가리키는 것은?","oko":["Microsoft","3,080만 달러","빌 게이츠","그 문서(코덱스 레스터)"],"sko":"그것이 역대 판매된 책 중에 가장 비싼 책이 되었다","opts":["Microsoft","30.8 million dollars","Bill Gates","the document (the Codex Leicester)"],"r":{"a":"4) the document (the Codex Leicester)","ev":"6번 문장","s":[[6,"In 1994, Microsoft co-founder Bill Gates acquired the document for 30.8 million dollars, making it the most expensive book ever sold.","1994년에, Microsoft의 공동 창립자인 빌 게이츠는 그 문서를 3,080만 달러에 인수하여, 그것이 역대 판매된 책 중에 가장 비싼 책이 되었다."]],"w":"it은 '역사상 가장 비싸게 팔린 책'이 된 것이므로 게이츠가 산 the document, 즉 코덱스 레스터. 가격이나 사람이 책이 될 수는 없음.","c":4}},{"n":7,"t":"sense","q":"Gates recognized its value not only as a scientific record but as a symbol of humanity's desire to learn and discover.","h":"814e7cf7c0","ko":"7번 문장 'not only as a scientific record but as a symbol'의 의미는?","sko":"게이츠는 그것을 과학적 기록으로서뿐만 아니라, 배우고 발견하고자 하는 인류 열망에 대한 상징으로서 그것의 가치를 인식했다.","opts":["게이츠는 이 원고를 과학 기록으로만 보았다.","게이츠는 이 원고를 과학 기록일 뿐 아니라 인류의 배움에 대한 열망의 상징으로도 보았다.","게이츠는 이 원고를 과학 기록보다 예술 작품으로 더 높이 평가했다.","게이츠는 이 원고의 가치를 알아보지 못한 채 샀다."],"r":{"a":"2) 게이츠는 이 원고를 과학 기록일 뿐 아니라 인류의 배움에 대한 열망의 상징으로도 보았다.","ev":"7번 문장","s":[[7,"Gates recognized its value not only as a scientific record but as a symbol of humanity’s desire to learn and discover.","게이츠는 그것을 과학적 기록으로서뿐만 아니라, 배우고 발견하고자 하는 인류 열망에 대한 상징으로서 그것의 가치를 인식했다."]],"w":"not only A but B는 'A뿐 아니라 B도'. A는 과학적 기록, B는 배우고 발견하려는 인류의 열망의 상징. recognized는 가치를 알아보았다는 뜻이라 4번은 반대.","c":2}},{"n":8,"t":"match","q":"Which of the following matches the passage?","h":"98a8d5a219","ko":"다음 중 본문과 일치하는 것은?","oko":["그 원고는 다빈치 본인이 빌 게이츠에게 팔았다.","그 원고는 주로 다빈치의 그림에 관한 것이다.","그 원고는 지금 디지털 형태로 볼 수 있다.","그 원고의 생각들은 당시 과학자들 사이에서 흔한 것이었다."],"opts":["The manuscript was sold to Bill Gates by da Vinci himself.","The manuscript is mostly about da Vinci's paintings.","The manuscript is now available in digital form.","The manuscript's ideas were common among scientists of his time."],"r":{"a":"3) The manuscript is now available in digital form.","ev":"4번, 5번, 8번 문장","s":[[4,"It captures his thoughts and sketches on topics such as the movement of water, the behavior of light, and the mysteries of the universe.","그것은 물의 움직임, 빛의 행동, 그리고 우주의 신비와 같은 주제에 대한 그의 생각과 스케치를 담고 있다."],[5,"His notes show how deeply he thought about these subjects and how far ahead his ideas were for his time.","그의 기록은 그가 이러한 주제들에 대해 얼마나 깊이 생각했는지와 그의 생각이 그 당시로서는 얼마나 앞서있었는지를 보여준다."],[8,"Gates even had the manuscript digitized so more people could follow and connect with da Vinci’s pursuit of knowledge.","게이츠는 더 많은 사람들이 다빈치의 지적 탐구를 따르고 공감할 수 있도록 그 원고를 디지털화하기까지 했다."]],"w":"8번 문장에서 게이츠가 원고를 디지털화함. 1번은 다빈치가 판 것이 아니라 1994년 게이츠가 입수(6번). 2번은 주제가 물·빛·우주(4번). 4번은 그의 생각이 시대보다 훨씬 앞섰다는 5번과 반대.","c":3}},{"n":9,"t":"sum","q":"The Codex Leicester records da Vinci's deep (A) about nature, and Gates's (B) of it helped more people connect with his ideas.","h":"b7c46c055f","ko":"코덱스 레스터에는 자연에 대한 다빈치의 깊은 (A)가 담겨 있고, 게이츠가 그것을 (B)한 것이 더 많은 사람이 그의 생각에 공감하도록 도왔다.","oko":["(A) 두려움 / (B) 디지털화","(A) 사고 / (B) 파괴","(A) 의심 / (B) 상실","(A) 사고 / (B) 디지털화","(A) 유머 / (B) 판매"],"opts":["(A) fear / (B) digitization","(A) thinking / (B) destruction","(A) doubt / (B) loss","(A) thinking / (B) digitization","(A) humor / (B) sale"],"r":{"a":"4) (A) thinking / (B) digitization","ev":"4번, 5번, 8번 문장","s":[[4,"It captures his thoughts and sketches on topics such as the movement of water, the behavior of light, and the mysteries of the universe.","그것은 물의 움직임, 빛의 행동, 그리고 우주의 신비와 같은 주제에 대한 그의 생각과 스케치를 담고 있다."],[5,"His notes show how deeply he thought about these subjects and how far ahead his ideas were for his time.","그의 기록은 그가 이러한 주제들에 대해 얼마나 깊이 생각했는지와 그의 생각이 그 당시로서는 얼마나 앞서있었는지를 보여준다."],[8,"Gates even had the manuscript digitized so more people could follow and connect with da Vinci’s pursuit of knowledge.","게이츠는 더 많은 사람들이 다빈치의 지적 탐구를 따르고 공감할 수 있도록 그 원고를 디지털화하기까지 했다."]],"w":"5번 문장에서 노트가 다빈치가 얼마나 깊이 생각했는지 보여 줌(thinking). 8번 문장에서 게이츠가 원고를 디지털화해 더 많은 사람이 공감하게 함(digitization). 나머지는 둘 중 하나가 본문과 맞지 않음.","c":4}},{"n":10,"t":"fill","q":"In 1994, Gates [A] the document for 30.8 million dollars, and he even had it [B] so more people could follow da Vinci.","h":"6885495f57","ko":"1994년 게이츠는 3,080만 달러에 그 문서를 [A]했고, 더 많은 사람이 다빈치를 따를 수 있도록 그것을 [B]하기까지 했다.","bko":{"acquired":"인수했다","digitized":"디지털화되게 했다","humanity":"인류","legacy":"유산","symbol":"상징","wonder":"경이로움"},"bank":["acquired","digitized","humanity","legacy","symbol","wonder"],"r":{"a":"[A] acquired, [B] digitized","ev":"6번, 8번 문장","s":[[6,"In 1994, Microsoft co-founder Bill Gates acquired the document for 30.8 million dollars, making it the most expensive book ever sold.","1994년에, Microsoft의 공동 창립자인 빌 게이츠는 그 문서를 3,080만 달러에 인수하여, 그것이 역대 판매된 책 중에 가장 비싼 책이 되었다."],[8,"Gates even had the manuscript digitized so more people could follow and connect with da Vinci’s pursuit of knowledge.","게이츠는 더 많은 사람들이 다빈치의 지적 탐구를 따르고 공감할 수 있도록 그 원고를 디지털화하기까지 했다."]],"w":"[A]는 돈을 주고 입수한 6번 문장의 acquired. [B]는 'had + 목적어 + p.p.' 구조로 8번 문장의 digitized. 나머지 단어는 명사라 문법상도 들어갈 수 없음.","c":null}}]},{"u":9,"id":"r26","no":26,"ko":"멀리 떠나고 싶은 이 마음, 뭐라고 할까?","items":[{"n":1,"t":"tf","q":"The word fernweh combines two German words.","h":"34e8c970cc","ko":"fernweh라는 단어는 두 개의 독일어 단어를 결합한 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The word fernweh combines two German words: “fern”(distant) and “wehe”(ache).","‘fernweh’라는 단어는 두 개의 독일어 단어, ‘fern’(먼)과 ‘wehe’(아픔)를 결합한 말이다."]],"w":"4번 문장에 The word fernweh combines two German words(fern, wehe)라고 나옴. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Fernweh describes a deep desire to return home.","h":"94fd2e9bc1","ko":"fernweh는 집으로 돌아가고 싶은 깊은 욕구를 나타낸다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"It describes a deep, aching desire to travel and is considered the opposite of homesickness(heimweh), the longing to return home.","그것은 깊고 쓰라린, 여행하고 싶은 욕구를 뜻하며, 집으로 돌아가고 싶은 갈망인 향수병(‘heimweh’)의 반대말로 여겨진다."]],"w":"fernweh는 여행하고 싶은 갈망이고, 집으로 돌아가고 싶은 마음은 homesickness. 5번 문장에서 둘은 정반대라 F.","c":"F"}},{"n":3,"t":"tf","q":"The term is believed to have been first used in the 1930s.","h":"2ecb9887ee","ko":"그 용어는 1930년대에 처음 사용된 것으로 여겨진다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The term is believed to have been first used by a German prince in the 1830s in his book about his travels across Europe and Northern Africa.","그 용어는 1830년대에 한 독일의 왕자가 자신의 유럽과 북아프리카 여행에 대해 쓴 책에서 처음 사용되었다고 여겨진다."]],"w":"6번 문장에서 처음 사용된 때는 1830년대. 숫자를 하나 바꾼 진술이라 F.","c":"F"}},{"n":4,"t":"vocab","q":"the word evolved as a way for Germans to express their yearning","h":"5b9247bd13","ko":"그 단어는 독일인들이 동경을 표현하는 방법으로 (evolved) 했다.","opts":["점차 사라졌다","점진적으로 발전했다","갑자기 생겨났다","더 짧아졌다"],"word":"evolved","r":{"a":"2) 점진적으로 발전했다","ev":"7번 문장","s":[[7,"Over the years, as travel became more accessible, the word evolved as a way for Germans to express their yearning for distant places.","세월이 지나 여행이 더 쉬워지면서, 그 단어는 독일인들이 먼 곳에 대한 갈망을 표현하는 방법으로 발전했다."]],"w":"evolve는 '점진적으로 발전하다, 진화하다'. 7번 문장에서 여행이 쉬워지면서 단어가 표현 방식으로 자리 잡아 간 과정을 말함. 이후 20세기 후반에 널리 알려졌으므로 사라진 것이 아님.","c":2}},{"n":5,"t":"vocab","q":"you may have struggled to contain your desire to travel","h":"ef87060ecf","ko":"너는 여행하고 싶은 욕구를 (contain) 하느라 애썼을 수 있다.","opts":["담고 있다","수집하다","만들어내다","(감정을) 억누르다, 참다"],"word":"contain","r":{"a":"4) (감정을) 억누르다, 참다","ev":"2번 문장","s":[[2,"Stuck at home, you may have struggled to contain your desire to travel.","집에 갇혀 당신은 여행하고 싶은 욕구를 억누르려고 힘들었을지도 모른다."]],"w":"contain은 '담고 있다'가 기본 뜻이지만, 감정이 목적어일 때는 '억누르다, 참다'. 집에 kend warriors, and inactive individuals.","참가자들은 세 그룹으로 나누어졌는데, 규칙적으로 운동하는 사람들, 주말 전사들, 그리고 활동하지 않는 사람들이었다."]],"w":"6번 문장에서 세 그룹(규칙적 운동자, 주말 전사, 활동하지 않는 사람들)으로 나뉨. 숫자를 바꾼 진술이라 F.","c":"F"}},{"n":3,"t":"tf","q":"Wrist sensors were used to track the participants' movements.","h":"cdb06884c3","ko":"참가자들의 움직임을 추적하기 위해 손목 센서가 사용되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Wrist sensors were used to accurately track participants’ movements.","손목 센서가 참가자의 움직임을 정확하게 추적하는 데 사용되었다."]],"w":"11번 문장에 Wrist sensors were used to accurately track participants' movements라고 나옴. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"Regular exercisers met the recommended 150 minutes of moderate activity or 75 minutes of vigorous activity per week.","h":"08bcef565d","ko":"규칙적 운동자들은 일주일에 중간 강도 150분 또는 (vigorous) 활동 75분이라는 권장량을 채웠다.","opts":["느슨한","짧은","격렬한","불필요한"],"word":"vigorous","r":{"a":"3) 격렬한","ev":"7번 문장","s":[[7,"Regular exercisers met the recommended 150 minutes of moderate activity or 75 minutes of vigorous activity per week.","규칙적으로 운동하는 사람들은 주당 권장되는 150분의 중강도 운동 또는 75분의 고강도 운동을 충족했다."]],"w":"vigorous는 '격렬한, 활발한'. 중간 강도(moderate) 150분과 짝을 이루어 더 센 강도는 절반인 75분이라는 흐름. moderate는 '적당한'이라 대비되는 단어.","c":3}},{"n":5,"t":"vocab","q":"What truly counts is making time to move.","h":"b9792d2efd","ko":"진정으로 (counts) 하는 것은 움직일 시간을 내는 것이다.","opts":["(수를) 센다","중요하다","계산서","제외한다"],"word":"counts","r":{"a":"2) 중요하다","ev":"15번 문장","s":[[15,"What truly counts is making time to move.","진정으로 중요한 것은 움직일 시간을 내는 것이다."]],"w":"count는 '세다'가 기본 뜻이지만, 여기서는 목적어 없이 쓰여 '중요하다'. What truly counts는 '진정으로 중요한 것'이라는 뜻. 다의어라 문장 구조로 판단.","c":2}},{"n":6,"t":"ref","q":"This exercise pattern has recently attracted growing interest from researchers. 여기서 This exercise pattern이 가리키는 것은?","h":"24d9afd767","ko":"4번 문장의 This exercise pattern이 가리키는 것은?","oko":["주말에 한두 번 긴 운동을 하는 것","주중에 다섯 번이나 여섯 번 짧은 운동을 하는 것","전혀 운동을 하지 않는 것","매일 150분씩 운동하는 것"],"sko":"이러한 운동 패턴은 최근 연구자들에게 점점 더 많은 관심을 끌고 있다.","opts":["doing one or two long workouts on the weekend","doing five or six short workouts during the week","not doing any exercise","doing 150 minutes of exercise every day"],"r":{"a":"1) doing one or two long workouts on the weekend","ev":"3번, 4번 문장","s":[[3,"Weekend warriors typically fit in one or two long workouts over the weekend instead of doing shorter sessions spread throughout the week.","주말 전사는 한 주에 걸쳐 분산된 짧은 (운동) 세션을 하는 대신, 일반적으로 주말에 한두 번의 긴 운동을 시간을 내서 한다."],[4,"This exercise pattern has recently attracted growing interest from researchers.","이러한 운동 패턴은 최근 연구자들에게 점점 더 많은 관심을 끌고 있다."]],"w":"4번 문장 바로 앞 3번 문장에서 weekend warriors의 방식, 즉 주말에 긴 운동 한두 번을 설명함. 그 방식이 This exercise pattern. 한 주에 나눠 짧게 하는 것은 3번 문장에서 오히려 대비되는 방식.","c":1}},{"n":7,"t":"sense","q":"Meanwhile, the inactive group did not meet the recommended levels of physical activity.","h":"06cee96765","ko":"10번 문장 'the inactive group did not meet the recommended levels'의 의미는?","sko":"한편, 활동하지 않는 그룹은 권장되는 신체 활동 수준을 충족하지 못했다.","opts":["활동하지 않은 그룹은 권장 수준보다 더 많이 운동했다.","활동하지 않은 그룹은 주말에만 운동했다.","활동하지 않은 그룹은 연구에서 제외되었다.","활동하지 않은 그룹은 권장되는 신체 활동 수준을 채우지 못했다."],"r":{"a":"4) 활동하지 않은 그룹은 권장되는 신체 활동 수준을 채우지 못했다.","ev":"10번 문장","s":[[10,"Meanwhile, the inactive group did not meet the recommended levels of physical activity.","한편, 활동하지 않는 그룹은 권장되는 신체 활동 수준을 충족하지 못했다."]],"w":"did not meet ~는 '~을 채우지 못했다'. 7번 문장에서 규칙적 운동자가 권장량을 채운 것(met)과 대비됨. 주말에만 운동한 것은 주말 전사의 특징이고, 제외되었다는 말은 본문에 없음.","c":4}},{"n":8,"t":"match","q":"Which of the following matches the passage?","h":"3c5df89479","ko":"다음 중 본문과 일치하는 것은?","oko":["규칙적으로 운동하는 사람들은 모든 운동을 주말에 했다.","그 연구는 약 9만 명을 6년 동안 관찰했다.","활동하지 않는 그룹은 주말 전사보다 질병 위험이 더 낮았다.","주말 전사는 규칙적으로 운동하는 사람들보다 운동을 적게 했다."],"opts":["Regular exercisers did all their exercise on the weekend.","The study observed nearly 90,000 people for six years.","The inactive group had a lower risk of diseases than weekend warriors.","Weekend warriors did less exercise than regular exercisers."],"r":{"a":"2) The study observed nearly 90,000 people for six years.","ev":"5번, 8번, 9번, 13번 문장","s":[[5,"A large-scale study observed nearly 90,000 people for six years to see how different exercise habits affect health.","한 대규모 연구는 서로 다른 운동 습관이 어떻게 건강에 영향을 미치는지 보기 위해 약 9만 명의 사람들을 6년 동안 관찰했다."],[8,"Their workouts were usually spread across five or six shorter sessions.","그들의 운동은 보통 다섯 번이나 여섯 번의 짧은 세션에 나뉘어져 수행되었다."],[9,"Weekend warriors achieved the same amount of exercise, but only on weekends.","주말 전사는 동일한 양의 운동을 했지만, 오직 주말에만 했다."],[13,"They showed a lower risk of over 260 diseases, including heart problems, diabetes, and mental health issues, compared to inactive individuals.","그들은 활동하지 않는 사람들에 비해 심장 질환, 당뇨병, 정신 건강 문제를 포함한 260가지 이상의 질병에 대한 위험이 더 낮게 나타났다."]],"w":"5번 문장에 nearly 90,000 people for six years. 1번은 규칙적 운동자가 5~6번에 나눠 운동(8번). 3번은 위험이 낮은 쪽이 활동하지 않는 그룹과 비교해 규칙적 운동자와 주말 전사(13번). 4번은 주말 전사도 같은 운동량(9번).","c":2}},{"n":9,"t":"sum","q":"Whether people exercise throughout the week or only on weekends, their risk of disease is (A) than that of (B) people.","h":"54b2a7ecdc","ko":"일주일 내내 운동하든 주말에만 운동하든, 이들의 질병 위험은 (B) 사람들보다 (A).","oko":["(A) 더 높은 / (B) 활동하지 않는","(A) 더 낮은 / (B) 규칙적인","(A) 더 낮은 / (B) 주말","(A) 더 높은 / (B) 격렬한","(A) 더 낮은 / (B) 활동하지 않는"],"opts":["(A) higher / (B) inactive","(A) lower / (B) regular","(A) lower / (B) weekend","(A) higher / (B) vigorous","(A) lower / (B) inactive"],"r":{"a":"5) (A) lower / (B) inactive","ev":"12번, 13번 문장","s":[[12,"The results revealed something surprising: both regular exercisers and weekend warriors experienced similar health benefits.","그 결과는 놀라운 것을 밝혀냈는데, 바로 규칙적으로 운동하는 사람들과 주말 전사 모두 비슷한 건강상의 이점을 경험했다는 점이다."],[13,"They showed a lower risk of over 260 diseases, including heart problems, diabetes, and mental health issues, compared to inactive individuals.","그들은 활동하지 않는 사람들에 비해 심장 질환, 당뇨병, 정신 건강 문제를 포함한 260가지 이상의 질병에 대한 위험이 더 낮게 나타났다."]],"w":"13번 문장에서 규칙적 운동자와 주말 전사 모두 inactive individuals와 비교해 260개 넘는 질병의 위험이 더 낮음(lower). 그래서 (A) lower, (B) inactive. regular와 weekend는 비교 대상이 아니라 운동하는 쪽.","c":5}},{"n":10,"t":"fill","q":"Weekend warriors [A] the same amount of exercise as regular exercisers, so they gained similar health [B].","h":"25bfe7a4a9","ko":"주말 전사들은 규칙적 운동자와 같은 양의 운동을 [A]했고, 그래서 비슷한 건강상 [B]을 얻었다.","bko":{"achieved":"달성했다","benefits":"이점","risk":"위험","pattern":"패턴","revealed":"밝혀냈다","observed":"관찰했다"},"bank":["achieved","benefits","risk","pattern","revealed","observed"],"r":{"a":"[A] achieved, [B] benefits","ev":"9번, 12번 문장","s":[[9,"Weekend warriors achieved the same amount of exercise, but only on weekends.","주말 전사는 동일한 양의 운동을 했지만, 오직 주말에만 했다."],[12,"The results revealed something surprising: both regular exercisers and weekend warriors experienced similar health benefits.","그 결과는 놀라운 것을 밝혀냈는데, 바로 규칙적으로 운동하는 사람들과 주말 전사 모두 비슷한 건강상의 이점을 경험했다는 점이다."]],"w":"9번 문장에 Weekend warriors achieved the same amount of exercise, 12번 문장에 similar health benefits. revealed와 observed는 운동량을 목적어로 하기 어색하고, risk는 얻는 것이 아니라 줄어드는 것.","c":null}}]},{"u":10,"id":"r28","no":28,"ko":"설레는 하루를 시작하는 방법","items":[{"n":1,"t":"tf","q":"Ikigai is a Japanese word that means “a reason to get up in the morning.”","h":"1db94162b1","ko":"Ikigai는 ‘아침에 일어나는 이유’를 뜻하는 일본어 단어이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"In Japan, this concept is called Ikigai, which means “a reason to get up in the morning.”","일본에서는 이 개념을 ikigai라고 부르는데, 이것은 ‘아침에 일어나는 이유’를 뜻한다."]],"w":"4번 문장에서 일본에서는 이 개념을 Ikigai라 부르고 ‘아침에 일어나는 이유’를 뜻한다고 함. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Ikigai is built on three key elements.","h":"2b141b5786","ko":"Ikigai는 세 가지 핵심 요소를 기반으로 한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Ikigai is built on four key elements:","ikigai는 네 가지 핵심 요소를 기반으로 한다:"]],"w":"5번 문장은 네 가지(four) 핵심 요소라고 함. 숫자를 three로 바꾼 진술.","c":"F"}},{"n":3,"t":"tf","q":"Dan Buettner found that a strong sense of purpose contributes to healthier, happier lives.","h":"34ffd00474","ko":"Dan Buettner는 강한 목적의식이 더 건강하고 행복한 삶에 기여한다는 것을 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"What you’re good pts simply list the store as “Store Number 1,” (B) revealing / concealing nothing about this place.","그것의 영수증은 그저 그 매장을 ‘1번 매장’으로 기재할 뿐, 이곳에 대해 어떤 것도 드러내지 않는다."]],"w":"앞 문장(4번) This Starbucks를 받아 ‘이 스타벅스의 영수증’이라는 뜻. its는 it의 소유격.","c":1}},{"n":7,"t":"sense","q":"In sentence 3, what does “let alone enjoy a cup of coffee” imply?","h":"897e9b1790","ko":"3번 문장의 “let alone enjoy a cup of coffee”가 의미하는 것은?","sko":"커피 한 잔을 즐기는 것은커녕, 안으로 들어설 수도 없을 것이다.","opts":["들어간 뒤에야 커피를 마실 수 있다","커피를 마시는 것은 허락되지만 들어가는 것은 안 된다","들어가는 것도 어려운데 커피를 마시는 것은 더욱 불가능하다","커피를 마시지 않고 들어가기만 하면 된다"],"r":{"a":"3) 들어가는 것도 어려운데 커피를 마시는 것은 더욱 불가능하다","ev":"3번 문장","s":[[3,"Unless you are a CIA employee or have special permission, you won’t be able to step inside, let alone enjoy a cup of coffee.","당신이 CIA 직원이거나 특별 허가를 받지 않는다면, 커피 한 잔을 즐기는 것은커녕, 안으로 들어설 수도 없을 것이다."]],"w":"let alone ~은 ‘~은 말할 것도 없고, ~은커녕’. 안에 들어서지도 못하니 커피를 마시는 것은 당연히 불가능하다는 뜻.","c":3}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"2644cc4a38","ko":"본문과 일치하는 것은?","oko":["이 스타벅스는 CIA 본부 근처의 호텔에 있다.","영수증에는 매장의 실제 이름이 나와 있다.","바리스타들은 건물 안을 자유롭게 돌아다닐 수 있다.","엄격한 규칙에도 불구하고, 이 스타벅스는 직원들의 긴 줄로 붐빈다."],"opts":["This Starbucks is located in a hotel near the CIA headquarters.","The receipts show the real name of the store.","Baristas can move around the building freely.","Even with strict rules, the Starbucks is busy with long lines of workers."],"r":{"a":"4) Even with strict rules, the Starbucks is busy with long lines of workers.","ev":"8번 문장","s":[[8,"Despite its unusual restrictions, this Starbucks remains incredibly busy with long lines of caffeine-craving workers stretching down the hallway in the mornings and afternoons.","그것의 특이한 제약들에도 불구하고, 이 스타벅스는 아침과 오후마다 카페인을 갈망하는 직원들의 긴 줄이 복도까지 늘어설 만큼 매우 붐빈다."]],"w":"8번 문장: 이상한 규제에도 불구하고 줄이 길게 늘어설 만큼 붐빔. 1번은 CIA 본부 안(2번), 2번은 Store Number 1(5번), 3번은 안내원 없이 이동 불가(6번)와 어긋남.","c":4}},{"n":9,"t":"sum","q":"This Starbucks inside the CIA headquarters is a (A) coffee shop that runs under over 3,000 pounds for the charity.","사람들은 Dan의 아이디어를 무척 좋아해 기꺼이 도왔고, 며칠 만에 그는 자선 단체를 위해 3,000파운드 이상을 모금했다."]],"w":"raise는 다의어(올리다, 기르다, 모으다). 자금과 함께 쓰이면 ‘모으다’. 본문의 raised는 원형 raise의 과거형.","c":2}},{"n":6,"t":"ref","q":"In sentence 4, what does the underlined “This error” refer to?","h":"092d078fba","ko":"4번 문장의 This error가 가리키는 것은?","opts":["래플을 연 것","부활절 사탕을 주문한 것","달걀 80개 대신 80상자를 주문한 실수","섬의 인구가 적은 것"],"r":{"a":"3) 달걀 80개 대신 80상자를 주문한 실수","ev":"3~4번 문장","s":[[3,"However, he made a huge mistake: instead of ordering 80 eggs, Dan accidentally ordered 80 cases of chocolate eggs.","하지만, 그는 커다란 실수를 저지르고 말았는데, 달걀 80개를 주문하는 대신 실수로 초콜릿 달걀 80상자를 주문한 것이었다."],[4,"This error meant he had 720 eggs — far more than the entire population of the islands!","이 실수는 그가 720개의 달걀을 가지게 된 것을 의미했는데, 이는 그 섬들의 전체 인구보다 훨씬 더 많은 수였다!"]],"w":"3번 문장의 huge mistake(80개 대신 80상자 주문)를 4번에서 This error로 다시 가리킴. 그 결과 달걀이 720개가 됨.","c":3}},{"n":7,"t":"sense","q":"In sentence 7, what did Dan decide to do? (“he decided to make the best of the situation”)","h":"691a61bfa3","ko":"7번 문장에서 Dan이 하기로 결정한 것은?","sko":"그는 이 상황을 최대한으로 활용하기로 결정했다.","opts":["어려운 상황을 최대한 잘 활용하기로","달걀을 모두 반품하기로","가게 문을 닫기로","상황이 나아질 때까지 기다리기로"],"r":{"a":"1) 어려운 상황을 최대한 잘 활용하기로","ev":"7번 문장","s":[[7,"(B) But soon, he decided to make the best of the situation.","하지만 그는 곧 이 상황을 최대한으로 활용하기로 결정했다."]],"w":"make the best of ~는 ~을 최대한으로 이용하다. 5번에서 막막해하던 Dan이 But soon으로 마음을 바꿔 상황을 잘 활용하기로 함.","c":1}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"d63e78a275","ko":"본문과 일치하는 것은?","oko":["Dan은 인구가 약 5,000명인 섬에서 가게를 운영한다.","추첨 행사의 당첨자는 달걀 80개를 받게 된다.","소문이 퍼지면서 더 많은 사람들이 추첨 행사 티켓을 샀다.","Dan은 추첨 행사가 시작된 뒤 달걀 주문을 멈췄다."],"opts":["Dan runs a store on an island with a population of about 5,000.","The winner of the raffle would receive 80 eggs.","More people bought raffle tickets as word spread.","Dan stopped ordering eggs after the raffle began."],"r":{"a":"3) More people bought raffle tickets as word spread.","ev":"10번 문장","s":[[10,"As word spread, even more people purchased raffle tickets for the eggs.","소문이 퍼지면서, 훨씬 더 많은 사람들이 달걀이 걸린 추첨 행사 티켓을 샀다."]],"w":"10번 문장: 소문이 퍼지면서 래플 티켓을 사는 사람이 더 늘어남. 1번은 약 500명(1번 문장), 2번은 달걀 100개(6번), 4번은 오히려 달걀을 더 주문(11번)과 어긋남.","c":3}},{"n":9,"t":"sum","q":"Dan (A) ordered far too many chocolate eggs, but he turned his (B) into a sweet Easter story.","h":"7a1aa9b2fd","ko":"Dan은 (A) 초콜릿 달걀을 너무 많이 주문했지만 자신의 (B)을 달콤한 부활절 이야기로 바꾸었다.","oko":["(A) 고의로 / (B) 실수","(A) 실수로 / (B) 이익","(A) 신중하게 / (B) 자선","(A) 실수로 / (B) 실수","(A) 고의로 / (B) 이익"],"opts":["(A) deliberately / (B) mistake","(A) accidentally / (B) profit","(A) carefully / (B) charity","(A) accidentally / (B) mistake","(A) deliberately / (B) profit"],"r":{"a":"4) (A) accidentally / (B) mistake","ev":"3번, 13번 문장","s":[[3,"However, he made a huge mistake: instead of ordering 80 eggs, Dan accidentally ordered 80 cases of chocolate eggs.","하지만, 그는 커다란 실수를 저지르고 말았는데, 달걀 80개를 주문하는 대신 실수로 초콜릿 달걀 80상자를 주문한 것이었다."],[13,"It turned into a sweet Easter story that will be remembered for a long time.","그 일은 오랫동안 기억될 달콤한 부활절 이야기가 되었다."]],"w":"3번 문장 accidentally ordered(실수로 주문)와 huge mistake, 13번 문장 It turned into a sweet Easter story. 따라서 (A) accidentally, (B) mistake.","c":4}},{"n":10,"t":"fill","q":"Dan made a [A] mistake, but he held a [B] to raise money for a local charity.","h":"f63c4cf9d9","ko":"Dan은 [A] 실수를 했지만 지역 자선 단체를 위한 돈을 모으려고 [B]을 열었다.","bko":{"huge":"커다란","raffle":"추첨 행사","entire":"전체의","eager":"열망하는","extra":"여분의","population":"인구"},"bank":["huge","raffle","entire","eager","extra","population"],"r":{"a":"[A] huge, [B] raffle","ev":"3번, 6번 문장","s":[[3,"However, he made a huge mistake: instead of ordering 80 eggs, Dan accidentally ordered 80 cases of chocolate eggs.","하지만, 그는 커다란 실수를 저지르고 말았는데, 달걀 80개를 주문하는 대신 실수로 초콜릿 달걀 80상자를 주문한 것이었다."],[6,"(A) He set up a raffle where people could buy tickets to win a special prize: one lucky winner would receive 100 eggs.","그는 사람들이 티켓을 사서 특별한 상품에 당첨될 수 있는 추첨 행사를 열었는데, 행운의 당첨자 한 명이 100개의 달걀을 받는 것이었다."]],"w":"3번 문장 he made a huge mistake에서 huge, 6번 문장 He set up a raffle에서 raffle(래플, 추첨식 판매).","c":null}}]},{"u":11,"id":"r31","no":31,"ko":"‘웃긴’ 뼈를 아시나요?","items":[{"n":1,"t":"tf","q":"People in English-speaking cultures call the feeling of hitting the elbow the “funny bone.”","h":"fa81e4f036","ko":"영어권 문화에서는 팔꿈치를 부딪힐 때의 느낌을 ‘웃긴 뼈’라고 부른다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In English-speaking cultures, people call this hitting the “funny bone.”","영어권 문화에서는 사람들이 이를 ‘funny bone’을 부딪혔다고 부른다."]],"w":"2번 문장: In English-speaking cultures, people call this hitting the “funny bone.” 그대로 일치.","c":"T"}},{"n":2,"t":"tf","q":"A nerve that is directly hit causes the same kind of pain as a usual bump.","h":"ba44d80576","ko":"직접 맞은 신경은 평소 부딪혔을 때와 같은 종류의 통증을 일으킨다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"Typically, when you bump a part of your body, the nerves near the damaged area send pain signals to your brain, letting you recognize the aching pain.","일반적으로, 당신이 몸의 한 부분을 부딪히면, 손상된 부분 근처의 신경이 뇌에 통증 신호를 보내 당신이 그 아픈 통증을 인식할 수 있게 한다."],[8,"But when a nerve is directly hit or irritated, it causes a different type of pain, like tickling, burning, or a sensation like an electric shock.","하지만 신경이 직접 부딪히거나 자극을 받으면, 그것은 간지러움, 화끈거림, 또는 전기 충격 같은 감각의 다른 종류의 통증을 유발한다."]],"w":"8번 문장: 신경을 직접 맞으면 간지럽거나 화끈거리거나 전기 충격 같은 ‘다른 종류’의 통증이 생김. 같은 통증이라는 진술이 틀림.","c":"F"}},{"n":3,"t":"tf","q":"The word “humerus” sounds like “humorous.”","h":"7b7e853680","ko":"‘humerus’라는 단어는 ‘humorous’처럼 들린다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"First, the word “humerus” sounds like “humorous,” which means funny.","첫째로, ‘humerus’라는 단어는 ‘humorous’처럼 들리는데, 그것은 재미있다는 뜻이다."]],"w":"11번 문장: the word “humerus” sounds like “humorous,” which means funny. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"In the sentence “…to cushion the impact,” what does the underlined word mean?","h":"cb2aeb5e92","ko":"‘충격을 완충하기 위한’ 문장에서 밑줄 친 cushion의 뜻은?","opts":["전달하다","완충 작용을 하다","증가시키다","없애다"],"word":"cushion","r":{"a":"2) 완충 작용을 하다","ev":"5번 문장","s":[[5,"Since there’s little muscle or fat in the area to cushion the impact, the nearby nerve, called the ulnar nerve, can be easily irritated.","이 부위에는 충격을 완화해 줄 근육이나 지방이 거의 없기 때문에, 척골 신경이라고 불리는 인근의 신경이 쉽게 자극받을 수 있다."]],"w":"5번 문장: little muscle or fat … to cushion the impact. 충격을 흡수해 줄 근육·지방이 없다는 뜻이므로 cushion = 완충 작용을 하다.","c":2}},{"n":5,"t":"vocab","q":"In the sentence “the odd feeling that you get,” what does the underlined word mean?","h":"04abdfe915","ko":"‘the odd feeling’에서 밑줄 친 odd의 뜻은? (1번 문장의 unusual과 같은 방향)","opts":["강한","평범한","기억에 남는","이상한, 기이한"],"word":"odd","r":{"a":"4) 이상한, 기이한","ev":"12번 문장","s":[[12,"Second, the odd feeling that you get when you hit your elbow can be described as “funny.”","둘째로, 당신이 팔꿈치를 부딪혔을 때 받는 묘한 느낌이 ‘funny’하다고 묘사될 수 있다."]],"w":"12번 문장: the odd feeling that you get when you hit your elbow. 1번 문장의 very unusual sensation과 같은 의미 흐름이므로 odd = 이상한, 기이한. 평범한은 반대 뜻.","c":4}},{"n":6,"t":"ref","q":"In the sentence “because it’s caused by a nerve,” what does the underlined “it” refer to?","h":"0d2629ccd1","ko":"‘because it’s caused by a nerve’에서 it이 가리키는 것은?","sko":"이러한 자극은 신경에서 비롯되었기 때문에 타박상이나 멍에서 오는 일반적인 통증과는 다르게 느껴진다.","opts":["이 자극(this irritation)","평소의 통증","멍","팔꿈치"],"r":{"a":"1) 이 자극(this irritation)","ev":"6번 문장","s":[[6,"This irritation feels different from the usual pain of bumps or bruises because it’s caused by a nerve.","이러한 자극은 신경에서 비롯되었기 때문에 타박상이나 멍에서 오는 일반적인 통증과는 다르게 느껴진다."]],"w":"6번 문장: This irritation feels different … because it’s caused by a nerve. it은 문장 주어인 This irritation을 가리킴.","c":1}},{"n":7,"t":"sense","q":"What does sentence 13, “Although the feeling might not be funny at the moment,” mean?","h":"98dc4db495","ko":"13번 문장 ‘Although the feeling might not be funny at the moment’의 의미는?","sko":"그 느낌이 그 순간에는 재미있지 않을 수도 있지만","opts":["팔꿈치를 부딪히면 항상 웃음이 난다","그 느낌은 부딪힌 뒤에 곧 사라진다","부딪힌 그 순간에는 그 느낌이 웃기지 않을 수도 있다","그 느낌은 사람마다 완전히 다르다"],"r":{"a":"3) 부딪힌 그 순간에는 그 느낌이 웃기지 않을 수도 있다","ev":"13번 문장","s":[[13,"Although the feeling might not be funny at the moment, it’s certainly a memorable experience for anyone who’s hit their elbow.","그 느낌이 그 순간에는 재미있지 않을 수도 있지만, 팔꿈치를 부딪혀 본 사람이라면 누구에게나 분명 기억에 남는 경험이다."]],"w":"13번 문장: might not be funny at the moment = 그 순간에는 웃기지 않을 수도 있음. 뒤에 it’s certainly a memorable experience가 이어져 대비를 이룸.","c":3}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"f0645e434d","ko":"글의 내용과 일치하는 것은?","oko":["funny bone은 팔꿈치에 있는 실제 뼈이다.","직접 부딪힌 신경은 전기 충격 같은 느낌을 일으킬 수 있다.","팔꿈치 부위에는 충격을 완화해 줄 지방이 많다.","‘funny bone’이라는 이름은 단 한 가지 이유에서 비롯되었다."],"opts":["The funny bone is an actual bone in the elbow.","A nerve that is directly hit can cause a feeling like an electric shock.","The elbow area has a lot of fat to cushion the impact.","The name “funny bone” comes from only one reason."],"r":{"a":"2) A nerve that is directly hit can cause a feeling like an electric shock.","ev":"3, 5, 8, 10번 문장","s":[[3,"However, it’s not actually a (A) — it’s your (B).","하지만, 그것은 실제로 뼈가 아니라, 당신의 신경이다."],[5,"Since there’s little muscle or fat in the area to cushion the impact, the nearby nerve, called the ulnar nerve, can be easily irritated.","이 부위에는 충격을 완화해 줄 근육이나 지방이 거의 없기 때문에, 척골 신경이라고 불리는 인근의 신경이 쉽게 자극받을 수 있다."],[8,"But when a nerve is directly hit or irritated, it causes a different type of pain, like tickling, burning, or a sensation like an electric shock.","하지만 신경이 직접 부딪히거나 자극을 받으면, 그것은 간지러움, 화끈거림, 또는 전기 충격 같은 감각의 다른 종류의 통증을 유발한다."],[10,"The name comes from two reasons.","그 이름은 두 가지 이유에서 비롯된다."]],"w":"8번 문장: a sensation like an electric shock로 일치. 1번 선지는 3번(진짜 뼈가 아님), 3번 선지는 5번(지방이 거의 없음), 4번 선지는 10번(이유 두 가지)과 어긋남.","c":2}},{"n":9,"t":"sum","q":"The “funny bone” is not a bone but a (A), and its name partly comes from the (B) of “humerus” and “humorous.”","h":"9491665a7b","ko":"‘funny bone’은 뼈가 아니라 (A)이고, 이름은 부분적으로 humerus와 humorous의 (B)에서 왔다.","oko":["(A) 근육 / (B) 의미","(A) 신경 / (B) 의미","(A) 신경 / (B) 소리","(A) 관절 / (B) 소리","(A) 관절 / (B) 의미"],"opts":["(A) muscle / (B) meaning","(A) nerve / (B) meaning","(A) nerve / (B) sound","(A) joint / (B) sound","(A) joint / (B) meaning"],"r":{"a":"3) (A) nerve / (B) sound","ev":"3, 5~6, 11번 문장","s":[[3,"However, it’s not actually a (A) — it’s your (B).","하지만, 그것은 실제로 뼈가 아니라, 당신의 신경이다."],[5,"Since there’s little muscle or fat in the area to cushion the impact, the nearby nerve, called the ulnar nerve, can be easily irritated.","이 부위에는 충격을 완화해 줄 근육이나 지방이 거의 없기 때문에, 척골 신경이라고 불리는 인근의 신경이 쉽게 자극받을 수 있다."],[6,"This irritation feels different from the usual pain of bumps or bruises because it’s caused by a nerve.","이러한 자극은 신경에서 비롯되었기 때문에 타박상이나 멍에서 오는 일반적인 통증과는 다르게 느껴진다."],[11,"First, the word “humerus” sounds like “humorous,” which means funny.","첫째로, ‘humerus’라는 단어는 ‘humorous’처럼 들리는데, 그것은 재미있다는 뜻이다."]],"w":"(A) 3·5·6번 문장에서 뼈가 아니라 신경(nerve). (B) 11번 문장에서 humerus가 humorous와 ‘소리’가 비슷함(뜻은 다름).","c":3}},{"n":10,"t":"fill","q":"Hitting the “funny bone” irritates a [A], which causes an [B] feeling that is different from the usual pain.","h":"182bc6c9d7","ko":"‘웃긴 뼈’를 부딪히면 [A]가 자극받아 평소의 통증과 다른 [B] 느낌이 생긴다.","bko":{"joint":"관절","odd":"이상한, 묘한","nerve":"신경","aching":"아픈, 욱신거리는","usual":"평소의, 일반적인","muscle":"근육"},"bank":["joint","odd","nerve","aching","usual","muscle"],"r":{"a":"[A] nerve, [B] odd","ev":"5~6, 12번 문장","s":[[5,"Since there’s little muscle or fat in the area to cushion the impact, the nearby nerve, called the ulnar nerve, can be easily irritated.","이 부위에는 충격을 완화해 줄 근육이나 지방이 거의 없기 때문에, 척골 신경이라고 불리는 인근의 신경이 쉽게 자극받을 수 있다."],[6,"This irritation feels different from the usual pain of bumps or bruises because it’s caused by a nerve.","이러한 자극은 신경에서 비롯되었기 때문에 타박상이나 멍에서 오는 일반적인 통증과는 다르게 느껴진다."],[12,"Second, the odd feeling that you get when you hit your elbow can be described as “funny.”","둘째로, 당신이 팔꿈치를 부딪혔을 때 받는 묘한 느낌이 ‘funny’하다고 묘사될 수 있다."]],"w":"[A] 5·6번 문장에서 자극받는 것은 nerve. [B] 12번 문장 the odd feeling과 1번 unusual sensation에서 이상한 느낌 = odd. usual은 평소의 통증 쪽 단어라 오답.","c":null}}]},{"u":11,"id":"r32","no":32,"ko":"18세기의 감자 대왕","items":[{"n":1,"t":"tf","q":"The grave of Frederick the Great is decorated with fresh potatoes left by visitors.","h":"c3d4284e30","ko":"프리드리히 대왕의 무덤은 방문객들이 놓고 간 신선한 감자로 장식되어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"There’s a king whose grave is decorated with fresh potatoes left by visitors.","방문객들이 남긴 신선한 감자로 무덤이 장식된 왕이 있다."],[2,"This is the resting place of Frederick the Great, the 18th-century king of Prussia.","이곳은 18세기 프로이센의 왕인 Frederick 대왕의 안식처이다."]],"w":"1~2번 문장: a king whose grave is decorated with fresh potatoes left by visitors; this is the resting place of Frederick the Great. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Frederick placed guards around the fields to make potatoes seem cheap.","h":"addaa5efb9","ko":"왕은 감자가 값싸 보이도록 밭 주위에 경비병을 세웠다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"He even placed guards around the fields to make them seem valuable.","그는 심지어 그것들이 귀중하게 보이도록 만들기 위해 밭 주변에 경비병을 배치했다."]],"w":"11번 문장: guards를 세운 이유는 cheap이 아니라 valuable(귀중해 보이게)하기 위함. 이유가 뒤집힘.","c":"F"}},{"n":3,"t":"tf","q":"Frederick declared potatoes “royal vegetables” and planted them in the farmers’ fields.","h":"385ecb297b","ko":"왕은 감자를 ‘왕실 채소’라고 선포하고 농부들의 밭에 심었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"He declared potatoes “royal vegetables” and planted them near his palace.","그는 감자를 ‘왕실 채소’로 선언하고 자신의 궁전 근처에 심었다."]],"w":"10번 문장: planted them near his palace. 심은 곳은 농부들의 밭이 아니라 궁전 근처. 장소가 뒤집힘.","c":"F"}},{"n":4,"t":"vocab","q":"In the sentence “began cultivating potatoes on their own land,” what does the underlined word mean?","h":"90d9a8c91f","ko":"‘began cultivating potatoes on their own land’에서 밑줄 친 cultivating의 뜻은? (동사 cultivate의 -ing형)","opts":["재배하는 것","수확하는 것","수출하는 것","요리하는 것"],"word":"cultivating","r":{"a":"1) 재배하는 것","ev":"13번 문장","s":[[13,"People grew curious about the “royal” vegetable and began cultivating potatoes on their own land.","사람들은 그 ‘왕실’ 채소에 대해 호기심을 갖게 되었고 자신의 땅에 감자를 재배하기 시작했다."]],"w":"13번 문장: 사람들이 호기심을 갖고 자기 땅에서 감자를 키우기 시작함. cultivate = 재배하다, cultivating은 그 -ing형.","c":1}},{"n":5,"t":"vocab","q":"In the sentence “During Frederick’s rule, many Prussians struggled with hunger,” what does the underlined word mean?","h":"680803cfc4","ko":"‘During Frederick’s rule, many Prussians struggled with hunger’에서 rule의 뜻은? (‘규칙’이 아님에 주의)","opts":["규칙","의견","통치, 지배","계획"],"word":"rule","r":{"a":"3) 통치, 지배","ev":"5번 문장","s":[[5,"During Frederick’s rule, many Prussians struggled with hunger.","Frederick의 통치 기간 동안, 많은 프로이센 사람들은 굶주림에 시달렸다."]],"w":"5번 문장: During Frederick’s rule = 프리드리히의 통치 기간 동안. rule은 ‘규칙’ 외에 명사 ‘통치, 지배’ 뜻이 있고 여기서는 통치.","c":3}},{"n":6,"t":"ref","q":"In the sentence “even when the king ordered them to,” what does the underlined “them” refer to?","h":"a1bfb03ea0","ko":"‘even when the king ordered them to’에서 them이 가리키는 것은?","sko":"왕이 그들에게 (경작)하라고 명령했을 때조차","opts":["감자","경비병들","왕","농부들"],"r":{"a":"4) 농부들","ev":"8번 문장","s":[[8,"Farmers refused to grow them, even when the king ordered them to.","농민들은 왕이 그들에게 (경작)하라고 명령했을 때조차 그것을 재배하기를 거부했다."]],"w":"8번 문장: Farmers refused to grow them, even when the king ordered them to. 앞의 them은 potatoes, ordered them의 them은 명령받은 Farmers.","c":4}},{"n":7,"t":"sense","q":"What does the sentence “Frederick helped improve food security in his kingdom” (15번) mean?","h":"d3486471f9","ko":"15번 문장 ‘Frederick helped improve food security in his kingdom’의 의미는?","sko":"Frederick은 자신의 왕국의 식량 안보를 개선하는 데 도움을 주었다.","opts":["프리드리히는 왕국의 식량 가격을 올렸다","프리드리히는 왕국의 식량 안정을 개선하는 데 도움을 주었다","프리드리히는 다른 나라에서 곡식을 사 왔다","프리드리히는 왕국의 농업을 금지했다"],"r":{"a":"2) 프리드리히는 왕국의 식량 안정을 개선하는 데 도움을 주었다","ev":"15번 문장","s":[[15,"By encouraging smart farming solutions, Frederick helped improve food security in his kingdom.","Frederick은 영리한 농업 전략을 장려함으로써, 자신의 왕국의 식량 안보를 개선하는 데 도움을 주었다."]],"w":"15번 문장: helped improve food security = 식량 안정을 개선하는 데 도움을 줌. 앞의 By encouraging smart farming solutions가 그 방법.","c":2}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"ffd52bb919","ko":"글의 내용과 일치하는 것은?","oko":["감자는 Frederick 이전부터 오랫동안 프로이센에서 재배되어 왔다.","프로이센 농민들은 왕이 명령하자마자 기꺼이 감자를 재배했다.","왕은 감자가 귀중하게 보이도록 밭 주변에 경비병을 배치했다.","감자는 오늘날 독일 요리에서 더 이상 중요하지 않다."],"opts":["Potatoes had been grown in Prussia for a long time before Frederick.","Prussian farmers happily grew potatoes as soon as the king ordered it.","The king placed guards around the fields to make potatoes seem valuable.","Potatoes are no longer important in German cuisine today."],"r":{"a":"3) The king placed guards around the fields to make potatoes seem valuable.","ev":"7, 8, 11, 14번 문장","s":[[7,"He realized that potatoes, newly introduced to Europe from South America, were the perfect solution. However, their unattractive appearance made people think they were unpleasant to eat or even poisonous.","그는 남아메리카에서 유럽으로 새로 도입된 감자가 완벽한 해결책이라는 것을 깨달았다. 그러나, 그것들의 매력적이지 않은 외형은 사람들로 하여금 그것들이 먹기에 불쾌하거나 심지어 독성이 있다고 생각하게 했다."],[8,"Farmers refused to grow them, even when the king ordered them to.","농민들은 왕이 그들에게 (경작)하라고 명령했을 때조차 그것을 재배하기를 거부했다."],[11,"He even placed guards around the fields to make them seem valuable.","그는 심지어 그것들이 귀중하게 보이도록 만들기 위해 밭 주변에 경비병을 배치했다."],[14,"Over time, potatoes became a vital source in Prussia, and remain important in German cuisine today.","시간이 지나면서, 감자는 프로이센에 매우 중요한 식량원이 되었으며, 오늘날에도 독일 요리에서 여전히 중요하다."]],"w":"11번 문장: placed guards around the fields to make them seem valuable. 1번 선지는 7번(newly introduced), 2번 선지는 8번(refused), 4번 선지는 14번(remain important)과 어긋남.","c":3}},{"n":9,"t":"sum","q":"Frederick solved the hunger problem by making potatoes seem (A), which made farmers (B) growing them.","h":"80ea76ab99","ko":"프리드리히는 감자가 (A)해 보이게 만들어 굶주림 문제를 해결했고, 이는 농부들이 감자 재배를 (B)하게 했다.","oko":["(A) 값싼 / (B) 그만두다","(A) 귀중한 / (B) 시작하다","(A) 위험한 / (B) 시작하다","(A) 귀중한 / (B) 그만두다","(A) 값싼 / (B) 시작하다"],"opts":["(A) cheap / (B) stop","(A) valuable / (B) start","(A) dangerous / (B) start","(A) valuable / (B) stop","(A) cheap / (B) start"],"r":{"a":"2) (A) valuable / (B) start","ev":"5, 11~13번 문장","s":[[5,"During Frederick’s rule, many Prussians struggled with hunger.","Frederick의 통치 기간 동안, 많은 프로이센 사람들은 굶주림에 시달렸다."],[11,"He even placed guards around the fields to make them seem valuable.","그는 심지어 그것들이 귀중하게 보이도록 만들기 위해 밭 주변에 경비병을 배치했다."],[12,"As expected, ________!","예상대로, 그 전략은 효과가 있었다!"],[13,"People grew curious about the “royal” vegetable and began cultivating potatoes on their own land.","사람들은 그 ‘왕실’ 채소에 대해 호기심을 갖게 되었고 자신의 땅에 감자를 재배하기 시작했다."]],"w":"(A) 11번 문장 seem valuable. (B) 13번 문장 began cultivating potatoes로 재배를 시작함.","c":2}},{"n":10,"t":"fill","q":"Frederick needed a food that was [A] and easy to grow, but farmers [B] to plant potatoes until the king changed public opinion.","h":"9531758cc7","ko":"프리드리히는 [A]하고 키우기 쉬운 식량이 필요했지만, 왕이 여론을 바꾸기 전까지 농부들은 감자 심기를 [B]했다.","bko":{"refused":"거부했다","expensive":"값비싼","inexpensive":"값싼","curious":"호기심이 많은","royal":"왕실의","declared":"선언했다"},"bank":["refused","expensive","inexpensive","curious","royal","declared"],"r":{"a":"[A] inexpensive, [B] refused","ev":"6, 8~11번 문장","s":[[6,"The king needed to find a food source that was both inexpensive and easy to grow.","왕은 값싸고 재배하기 쉬운 식량원을 찾아야 했다."],[8,"Farmers refused to grow them, even when the king ordered them to.","농민들은 왕이 그들에게 (경작)하라고 명령했을 때조차 그것을 재배하기를 거부했다."],[9,"Frederick came up with a clever idea to change public opinion.","Frederick은 대중의 의견을 바꾸기 위해 영리한 아이디어를 생각해냈다."],[10,"He declared potatoes “royal vegetables” and planted them near his palace.","그는 감자를 ‘왕실 채소’로 선언하고 자신의 궁전 근처에 심었다."],[11,"He even placed guards around the fields to make them seem valuable.","그는 심지어 그것들이 귀중하게 보이도록 만들기 위해 밭 주변에 경비병을 배치했다."]],"w":"[A] 6번 문장 both inexpensive and easy to grow. expensive는 반대 뜻. [B] 8번 문장 Farmers refused to grow them. declared는 왕이 한 행동(10번)이라 오답.","c":null}}]},{"u":11,"id":"r33","no":33,"ko":"산업혁명에서 시작되었어요","items":[{"n":1,"t":"tf","q":"Eating three meals a day is a relatively new habit.","h":"3feb1276c2","ko":"하루 세 끼를 먹는 것은 비교적 새로운 습관이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"But did you know this habit is relatively new?","하지만 이러한 습관이 비교적 최근의 것이라는 사실을 알고 있었는가?"]],"w":"2번 문장: did you know this habit is relatively new? 하루 세 끼 습관이 비교적 새롭다는 내용과 일치.","c":"T"}},{"n":2,"t":"tf","q":"In the past, most people ate at the same fixed times every day.","h":"c4d204251d","ko":"과거에는 대부분의 사람들이 매일 같은 정해진 시간에 식사했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Most people ate whenever food was available or when it fit their daily activities, such as farming or hunting.","대부분의 사람들은 음식이 있을 때마다 또는 농사나 사냥과 같은 그들의 일상 활동과 맞을 때 식사를 했다."]],"w":"4번 문장: 음식이 있을 때나 일상 활동에 맞을 때 먹었음. 정해진 시간이 있었다는 진술이 반대.","c":"F"}},{"n":3,"t":"tf","q":"In the evening, factory workers ate their meals at the factory with their coworkers.","h":"604b4d2dae","ko":"저녁에 공장 노동자들은 공장에서 동료들과 식사했다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"(b) Finally, in the evening, they returned home to share a meal with their families.","마지막으로, 저녁에는, 집으로 돌아와 가족과 식사를 함께 했다."]],"w":"9번 문장: in the evening, they returned home to share a meal with their families. 식사 장소·상대가 뒤집힘(집, 가족).","c":"F"}},{"n":4,"t":"vocab","q":"In the sentence “people had to adjust their meal times,” what does the underlined word mean?","h":"d6d7df5185","ko":"‘people had to adjust their meal times’에서 adjust의 뜻은?","opts":["거부하다","조절하다, 맞추다","줄이다","시작하다"],"word":"adjust","r":{"a":"2) 조절하다, 맞추다","ev":"6번 문장","s":[[6,"As factory work became a central part of daily life, people had to adjust their meal times to fit strict work schedules.","공장 일이 일상생활의 중심이 되면서, 사람들은 엄격한 근무 일정에 맞추기 위해 식사 시간을 조정해야 했다."]],"w":"6번 문장: adjust their meal times to fit strict work schedules. 일정에 맞춰 식사 시간을 조절한다는 뜻.","c":2}},{"n":5,"t":"vocab","q":"In the sentence “The idea of eating three set meals became widespread,” what does the underlined word mean?","h":"ad57e62776","ko":"‘eating three set meals’에서 set의 뜻은? (‘놓다’ 뜻이 아님에 주의)","opts":["정해진","설치하다","한 벌의","놓다"],"word":"set","r":{"a":"1) 정해진","ev":"12번 문장","s":[[12,"(e) The idea of eating three set meals became widespread and settled in many cultures.","세 끼 정해진 식사를 한다는 개념은 널리 퍼져 많은 문화권에 자리 잡았다."]],"w":"12번 문장: three set meals = 정해진 세 끼 식사. set은 동사 ‘놓다’ 외에 형용사 ‘정해진’ 뜻이 있고 여기서는 정해진.","c":1}},{"n":6,"t":"ref","q":"In the sentence “but it later became a daily habit for families and communities,” what does the underlined “it” refer to?","h":"56ac266c2f","ko":"‘but it later became a daily habit for families and communities’에서 it이 가리키는 것은?","sko":"하지만 그것은 이후에 가족들과 지역 사회의 일상적인 습관이 되었다.","opts":["공장 일","가족","이 식사 일정","산업혁명"],"r":{"a":"3) 이 식사 일정","ev":"10번 문장","s":[[10,"(c) Initially, this eating schedule was created to fit work needs, but it later became a daily habit for families and communities.","처음에는, 이 식사 일정이 업무상의 필요에 맞추기 위해 만들어졌지만, 이후에는 가족들과 지역 사회의 일상적인 습관이 되었다."]],"w":"10번 문장: Initially, this eating schedule was created to fit work needs, but it later became a daily habit. it은 앞의 this eating schedule.","c":3}},{"n":7,"t":"sense","q":"What does the sentence “…brought significant changes to eating habits” (5번) tell us about the Industrial Revolution?","h":"20ae2ae651","ko":"5번 문장 ‘brought significant changes to eating habits’가 말하는 산업혁명의 영향은?","sko":"식사 습관에 중대한 변화를 가져왔다","opts":["산업혁명 이전에는 식습관이 정해져 있었다","산업혁명 때문에 사람들이 식사를 줄였다","산업혁명 이후 식량 생산이 크게 늘었다","산업혁명이 식습관에 중대한 변화를 가져왔다"],"r":{"a":"4) 산업혁명이 식습관에 중대한 변화를 가져왔다","ev":"5번 문장","s":[[5,"However, the Industrial Revolution in Europe and the U.S. during the 18th and 19th centuries brought significant changes to eating habits.","그러나, 18세기와 19세기 동안의 유럽과 미국의 산업혁명은 식사 습관에 중대한 변화를 가져왔다."]],"w":"5번 문장: brought significant changes to eating habits = 식습관에 중대한 변화를 가져옴. 앞의 However가 과거(4번)의 불규칙한 식사와 대비시킴.","c":4}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"4f5873dce0","ko":"글의 내용과 일치하는 것은?","oko":["과거에 사람들은 항상 정해진 시간에 세 끼를 먹었다.","공장 노동자들은 재충전하기 위해 오후에 식사 휴식을 가졌다.","산업혁명은 아시아에서만 일어났다.","세 끼 식사 습관은 가정에서 시작되어 나중에 공장으로 퍼졌다."],"opts":["People in the past always ate three meals at fixed times.","Factory workers took a meal break in the afternoon to recharge.","The Industrial Revolution happened only in Asia.","The three-meal habit started in families and later spread to factories."],"r":{"a":"2) Factory workers took a meal break in the afternoon to recharge.","ev":"4, 5, 8, 10번 문장","s":[[4,"Most people ate whenever food was available or when it fit their daily activities, such as farming or hunting.","대부분의 사람들은 음식이 있을 때마다 또는 농사나 사냥과 같은 그들의 일상 활동과 맞을 때 식사를 했다."],[5,"However, the Industrial Revolution in Europe and the U.S. during the 18th and 19th centuries brought significant changes to eating habits.","그러나, 18세기와 19세기 동안의 유럽과 미국의 산업혁명은 식사 습관에 중대한 변화를 가져왔다."],[8,"(a) In the afternoon, they took a meal break to recharge and continue their hard work.","오후에는, 그들이 재충전하고 힘든 일을 계속하기 위해 식사하는 휴식을 가졌다."],[10,"(c) Initially, this eating schedule was created to fit work needs, but it later became a daily habit for families and communities.","처음에는, 이 식사 일정이 업무상의 필요에 맞추기 위해 만들어졌지만, 이후에는 가족들과 지역 사회의 일상적인 습관이 되었다."]],"w":"8번 문장: In the afternoon, they took a meal break to recharge. 1번 선지는 4번, 3번 선지는 5번(Europe and the U.S.), 4번 선지는 10번(처음엔 업무상의 필요)과 어긋남.","c":2}},{"n":9,"t":"sum","q":"The three-meal habit began to fit (A) schedules during the Industrial Revolution and later became a (B) habit.","h":"23ac14f89c","ko":"하루 세 끼 습관은 산업혁명 때 (A) 일정에 맞추려고 시작되어 나중에 (B)한 습관이 되었다.","oko":["(A) 농사 / (B) 드문","(A) 업무 / (B) 드문","(A) 농사 / (B) 흔한","(A) 여행 / (B) 흔한","(A) 업무 / (B) 흔한"],"opts":["(A) farming / (B) rare","(A) work / (B) rare","(A) farming / (B) common","(A) travel / (B) common","(A) work / (B) common"],"r":{"a":"5) (A) work / (B) common","ev":"6, 10, 13번 문장","s":[[6,"As factory work became a central part of daily life, people had to adjust their meal times to fit strict work schedules.","공장 일이 일상생활의 중심이 되면서, 사람들은 엄격한 근무 일정에 맞추기 위해 식사 시간을 조정해야 했다."],[10,"(c) Initially, this eating schedule was created to fit work needs, but it later became a daily habit for families and communities.","처음에는, 이 식사 일정이 업무상의 필요에 맞추기 위해 만들어졌지만, 이후에는 가족들과 지역 사회의 일상적인 습관이 되었다."],[13,"It has continued to this day and remains a common practice around the world.","그것은 오늘날까지 이어져 오며 전 세계적으로 일반적인 관행으로 남아 있다."]],"w":"(A) 6·10번 문장 strict work schedules, work needs. (B) 1번·13번 문장 common routine, common practice. farming은 산업혁명 이전(4번)의 활동.","c":5}},{"n":10,"t":"fill","q":"In the past, people ate whenever food was [A], but later three meals a day became a [B] habit.","h":"4ca33bccb9","ko":"과거에는 사람들이 음식이 [A]할 때마다 먹었지만, 나중에는 하루 세 끼가 [B]한 습관이 되었다.","bko":{"adjust":"조정하다, 맞추다","common":"흔한, 일반적인","initially":"처음에는","available":"이용 가능한, 구할 수 있는","recharge":"재충전하다","relatively":"비교적"},"bank":["adjust","common","initially","available","recharge","relatively"],"r":{"a":"[A] available, [B] common","ev":"1, 4, 13번 문장","s":[[1,"In many cultures today, eating three meals a day — breakfast, lunch, and dinner — is a common routine.","오늘날 많은 문화권에서, 하루에 아침, 점심, 저녁 세 끼를 먹는 것은 일반적인 일상이다."],[4,"Most people ate whenever food was available or when it fit their daily activities, such as farming or hunting.","대부분의 사람들은 음식이 있을 때마다 또는 농사나 사냥과 같은 그들의 일상 활동과 맞을 때 식사를 했다."],[13,"It has continued to this day and remains a common practice around the world.","그것은 오늘날까지 이어져 오며 전 세계적으로 일반적인 관행으로 남아 있다."]],"w":"[A] 4번 문장 whenever food was available. [B] 1번 문장 is a common routine, 13번 문장 a common practice. adjust·recharge는 동사, initially·relatively는 부사라 자리에 맞지 않음.","c":null}}]},{"u":12,"id":"r34","no":34,"ko":"거친 바람 속으로 돌격!","items":[{"n":1,"t":"tf","q":"Storm chasers start their work by analyzing weather information.","h":"6cd3b86b9a","ko":"폭풍 추적자들은 날씨 정보를 분석하는 것으로 일을 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"Each chase begins with preparation.","각 추적은 준비로 시작된다."],[5,"We start by analyzing weather forecasts, radar images, and reports to find the best spot where a tornado might form.","우리는 토네이도가 형성될지도 모르는 최적의 지점을 찾기 위해 일기예보, 레이더 이미지, 그리고 보고서를 분석하는 것으로 시작한다."]],"w":"5번에서 일기예보, 레이더 이미지, 보고서를 분석하는 것으로 시작한다고 함. 진술과 일치.","c":"T"}},{"n":2,"t":"tf","q":"Storm chasers always see a funnel cloud when they drive out.","h":"4a7c5bb589","ko":"폭풍 추적자들은 차를 몰고 나가면 항상 깔때기 구름을 본다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Some days, we drive for hours without seeing a single funnel cloud.","어떤 날엔, 우리가 몇 시간 동안 운전해도 깔때기 구름 하나를 보지 못하기도 한다."]],"w":"9번에서 몇 시간을 운전해도 깔때기 구름을 하나도 못 보는 날이 있다고 함. always가 틀림.","c":"F"}},{"n":3,"t":"tf","q":"Storm chasers sometimes use weather balloons to collect information from inside a storm.","h":"3273166eda","ko":"폭풍 추적자들은 때때로 기상 풍선을 이용해 폭풍 내부의 정보를 수집한다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"Sometimes, we even launch weather balloons to collect information from inside the storm.","때때로, 우리는 폭풍 내부의 정보를 수집하기 위해 기상 풍선을 발사하기도 한다."]],"w":"13번에서 기상 풍선을 띄워 폭풍 내부 정보를 수집한다고 함. 진술과 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What does the underlined word mean? 'Once we decide, we grab our gear and head out.'","h":"05e5760ff8","ko":"다음 문장의 밑줄 친 단어의 뜻은? '결정하면 우리는 gear를 챙겨 출발한다.'","opts":["지도","장비","소식","속도"],"word":"gear","r":{"a":"2) 장비","ev":"7번 문장","s":[[7,"Once we decide, we grab our gear and head out.","일단 우리가 결정을 내리면, 우리는 장비를 집어 들고 밖으로 향한다."]],"w":"gear는 '장비, 도구'. 결정한 뒤 챙겨서 출발하는 것이므로 장비가 문맥에 맞음.","c":2}},{"n":5,"t":"vocab","q":"What does the underlined word mean in this sentence? 'When most people see dark skies and swirling clouds, they run for cover.'","h":"5a4d8e874d","ko":"다음 문장에서 밑줄 친 cover의 뜻은? '대부분의 사람들은 어두운 하늘과 소용돌이치는 구름을 보면 cover로 달려간다.'","opts":["책의 표지","이불 같은 덮개","몸을 피할 곳","보험 보장"],"word":"cover","r":{"a":"3) 몸을 피할 곳","ev":"1번 문장","s":[[1,"When most people see dark skies and swirling clouds, they run for cover.","대부분의 사람들은 어두운 하늘과 소용돌이치는 구름을 보면, 몸을 피할 곳을 찾아 달아난다."]],"w":"cover는 '덮개, 표지' 외에 run for cover에서 '몸을 피할 곳'(= shelter). 폭풍을 보고 달려가는 곳이므로 피신처.","c":3}},{"n":6,"t":"ref","q":"What does the underlined 'its' refer to?","h":"c455f14ce1","ko":"밑줄 친 its가 가리키는 것은?","sko":"우리는 안전거리를 유지하면서 그것의 움직임을 주의 깊게 관찰한다.","opts":["기상 풍선","형성되고 있는 폭풍","안전한 거리","깔때기 구름"],"r":{"a":"2) 형성되고 있는 폭풍","ev":"10~11번 문장","s":[[10,"But when we do spot a storm forming, the excitement is unmatched.","하지만 폭풍이 형성되는 것을 실제로 발견하게 되면, 그 흥분은 이루 말할 수 없다."],[11,"We carefully monitor its movement while keeping a safe distance.","우리는 안전거리를 유지하면서 그것의 움직임을 주의 깊게 관찰한다."]],"w":"10번에서 발견한 'a storm forming'의 움직임을 11번에서 주시한다는 흐름. its = 형성되는 폭풍.","c":2}},{"n":7,"t":"sense","q":"Which is closest in meaning to 'Storm chasing is anything but predictable.'?","h":"439774fc15","ko":"'Storm chasing is anything but predictable.'과 의미가 가장 가까운 것은?","sko":"폭풍을 추적하는 일은 결코 예측할 수 없다.","opts":["폭풍 추적은 예측하기 매우 쉬운 일이다.","폭풍 추적은 예측 외에는 아무것도 아니다.","폭풍 추적은 결코 예측할 수 있는 일이 아니다.","폭풍 추적은 예측 가능한 일 중 하나이다."],"r":{"a":"3) 폭풍 추적은 결코 예측할 수 있는 일이 아니다.","ev":"8번 문장","s":[[8,"Storm chasing is anything but predictable.","폭풍을 추적하는 일은 결코 예측할 수 없다."]],"w":"anything but = 결코 ~이 아닌. 따라서 결코 예측 가능하지 않다는 뜻. 바로 뒤 9번에서 깔때기 구름을 못 보는 날도 있다고 이어짐.","c":3}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"36b80dc9cc","ko":"본문의 내용과 일치하는 것은?","oko":["폭풍 추적자들은 소용돌이치는 구름을 보면 몸을 피할 곳으로 달려간다.","폭풍 추적자들은 매일 몇 시간씩 운전하며 항상 깔때기 구름을 본다.","폭풍 추적자들은 폭풍에서 멀리 떨어져 있기 위해 기상 풍선을 발사한다.","폭풍 추적자들의 데이터는 기상학자들이 사람들에게 안전한 곳으로 갈 시간을 주도록 돕는다."],"opts":["Storm chasers run for cover when they see swirling clouds.","Storm chasers drive for hours every day and always see a funnel cloud.","Storm chasers launch weather balloons to stay away from the storm.","Storm chasers' data helps meteorologists give people time to get to safety."],"r":{"a":"4) Storm chasers' data helps meteorologists give people time to get to safety.","ev":"17번 문장","s":[[17,"The data we collect helps meteorologists issue faster, more accurate warnings, giving people time to get to safety.","우리가 수집하는 데이터는 기상학자들이 더 빠르고, 더 정확한 경보를 발령할 수 있게 도와주어, 사람들이 안전한 곳으로 갈 시간을 준다."]],"w":"17번에서 모은 데이터가 기상학자의 경보를 도와 사람들이 안전한 곳으로 갈 시간을 준다고 함. ①은 일반 사람들(1번), ②는 9번, ③은 13번(정보 수집 목적)과 다름.","c":4}},{"n":9,"t":"sum","q":"Storm chasing is a(n) (A) job, but they think it is worth it because the (B) they collect helps keep people safe.","h":"5fe418fd60","ko":"폭풍 추적은 (A)한 일이지만, 그들이 모으는 (B)가 사람들을 안전하게 지키는 데 도움이 되므로 가치 있다고 생각한다.","oko":["(A) 안전한 / (B) 데이터","(A) 위험한 / (B) 경보","(A) 지루한 / (B) 데이터","(A) 쉬운 / (B) 데이터","(A) 위험한 / (B) 데이터"],"opts":["(A) safe / (B) data","(A) risky / (B) warnings","(A) boring / (B) data","(A) easy / (B) data","(A) risky / (B) data"],"r":{"a":"5) (A) risky / (B) data","ev":"14~17번 문장","s":[[14,"So why do we take on such a risky job?","그렇다면 우리는 왜 이렇게 위험한 일을 하는 걸까?"],[15,"Sure, there’s excitement — the kind that makes your heart race when a storm appears on the horizon.","물론, 스릴도 있다. 폭풍이 지평선에 나타날 때, 심장을 뛰게 만드는 바로 그런 종류의 흥분이다."],[16,"But more than that, there’s a purpose.","하지만 그 이상으로, 목적이 있다."],[17,"The data we collect helps meteorologists issue faster, more accurate warnings, giving people time to get to safety.","우리가 수집하는 데이터는 기상학자들이 더 빠르고, 더 정확한 경보를 발령할 수 있게 도와주어, 사람들이 안전한 곳으로 갈 시간을 준다."]],"w":"14번에서 risky job, 17번에서 The data we collect helps ~. 경보(warnings)는 기상학자가 발령하는 것이라 B에 맞지 않음.","c":5}},{"n":10,"t":"fill","q":"Storm chasers carefully [A] a storm's movement, and the [B] of spotting a forming storm is unmatched.","h":"2ecbaeb41e","ko":"폭풍 추적자들은 폭풍의 움직임을 주의 깊게 [A]하고, 형성되는 폭풍을 발견할 때의 [B]는 비길 데 없다.","bko":{"monitor":"관찰하다, 주시하다","excitement":"흥분, 스릴","gear":"장비","horizon":"지평선","preparation":"준비","mission":"임무"},"bank":["monitor","excitement","gear","horizon","preparation","mission"],"r":{"a":"[A] monitor, [B] excitement","ev":"10~11번 문장","s":[[10,"But when we do spot a storm forming, the excitement is unmatched.","하지만 폭풍이 형성되는 것을 실제로 발견하게 되면, 그 흥분은 이루 말할 수 없다."],[11,"We carefully monitor its movement while keeping a safe distance.","우리는 안전거리를 유지하면서 그것의 움직임을 주의 깊게 관찰한다."]],"w":"11번 We carefully monitor its movement, 10번 the excitement is unmatched에서 가져옴. A는 동사 원형, B는 명사가 필요.","c":null}}]},{"u":12,"id":"r35","no":35,"ko":"손짓만으로 신비로운 멜로디 완성!","i ,"IBM은 버블랩을 만든 최초의 회사였다.","소규모 포장 회사들은 IBM 이후 버블랩 사용을 중단했다."],"opts":["Bubble wrap found its purpose after the inventors decided to use it for packaging.","Fielding and Chavannes succeeded with their wallpaper idea in 1957.","IBM was the first company to make bubble wrap.","Small packaging companies stopped using bubble wrap after IBM."],"r":{"a":"1) Bubble wrap found its purpose after the inventors decided to use it for packaging.","ev":"10번 문장","s":[[10,"When they decided to use it as a packaging material the following year, bubble wrap finally found its purpose.","이듬해, 그들이 그것을 포장재로 사용하기로 결정했을 때, 버블랩은 마침내 그 쓰임새를 찾게 되었다."]],"w":"10번에서 포장재로 쓰기로 결정하면서 버블랩이 마침내 쓰임을 찾았다고 함. ②는 7번, ③은 4번, ④는 13번과 다름.","c":1}},{"n":9,"t":"sum","q":"Bubble wrap was first designed for (A) but became successful as (B) material.","h":"4a3b3123e1","ko":"버블랩은 처음에 (A)용으로 설계되었지만 (B) 소재로 성공했다.","oko":["(A) 포장 / (B) 벽지","(A) 샤워 커튼 / (B) 벽지","(A) 벽지 / (B) 포장","(A) 벽지 / (B) 샤워 커튼","(A) 샤워 커튼 / (B) 포장"],"opts":["(A) packaging / (B) wallpaper","(A) shower curtains / (B) wallpaper","(A) wallpaper / (B) packaging","(A) wallpaper / (B) shower curtains","(A) shower curtains / (B) packaging"],"r":{"a":"3) (A) wallpaper / (B) packaging","ev":"5번, 10번 문장","s":[[5,"They intended to create a wallpaper with a unique texture.","그들은 독특한 질감의 벽지를 만들고자 했다."],[10,"When they decided to use it as a packaging material the following year, bubble wrap finally found its purpose.","이듬해, 그들이 그것을 포장재로 사용하기로 결정했을 때, 버블랩은 마침내 그 쓰임새를 찾게 되었다."]],"w":"5번 wallpaper를 만들려 했으나 7번에서 실패, 10번 이후 packaging material로 성공. 샤워 커튼은 재료였을 뿐 용도가 아님.","c":3}},{"n":10,"t":"fill","q":"The wallpaper idea was not a [A], but bubble wrap became a packaging [B] for shippers around the world.","h":"025ab89d2e","ko":"벽지 아이디어는 [A]이 아니었지만, 버블랩은 전 세계 운송업자들에게 포장 [B]이 되었다.","bko":{"success":"성공","essential":"필수품","engineers":"엔지니어들","texture":"질감","belief":"믿음","equipment":"장비"},"bank":["success","essential","engineers","texture","belief","equipment"],"r":{"a":
