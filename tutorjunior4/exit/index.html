rch.","Most of Mauna Kea is above the sea.","Mt. Everest is the tallest mountain from base to peak."],"r":{"a":"2) The writer tells us to change “the highest” in our search. (글쓴이는 검색어에서 ‘가장 높은’을 바꾸라고 말한다.)","ev":"4번 문장","s":[[4,"Change “the highest” to “the tallest.”","‘가장 높은’을 ‘가장 키가 큰’으로 변경하라."]],"w":"4번 문장에서 ‘가장 높은(the highest)’을 바꾸라고(Change) 해요. 나머지는 본문과 달라요.","c":2},"h":"857614144c"},{"n":9,"t":"sum","q":"It does not (A) to be the tallest mountain at all, because it only (B) 4,205 meters above sea level.","ko":"그것은 전혀 가장 키가 큰 산으로 (A) 않는데, 그것이 겨우 해발 4,205m에 (B) 때문이다.","oko":["(A) 원하지 / (B) 이르기","(A) 보이지 / (B) 떠나기","(A) 원하지 / (B) 떠나기","(A) 보이지 / (B) 가라앉기","(A) 보이지 / (B) 이르기"],"opts":["(A) want / (B) reaches","(A) seem / (B) leaves","(A) want / (B) leaves","(A) seem / (B) sinks","(A) seem / (B) reaches"],"r":{"a":"5) (A) seem / (B) reaches (보이지 / 이르기)","ev":"6번 문장","s":[[6,"It does not seem to be the tallest mountain at all, because it only reaches 4,205 meters above sea level.","그것은 전혀 가장 키가 큰 산으로 보이지 않는데, 그것이 겨우 해발 4,205m에 이르기 때문이다."]],"w":"6번에서 마우나케아는 전혀 가장 키가 큰 산으로 보이지 않는다(does not seem to be)고 해요. 그 이유는 해발 4,205m에만 이르기(only reaches) 때문이에요.","c":5},"h":"9c9aeb233f"},{"n":10,"t":"fill","q":"If you search for “the highest mountain in the [A]” on the [B], most of the results will say it is Mt. Everest.","ko":"만약 당신이 [B]에서 ‘[A]에서 가장 높은 산’을 검색한다면, 대부분의 결과들은 그것이 에베레스트산이라고 말할 것이다.","bank":["world","Internet","slightly","kilometer","volcano","Hawaiian"],"bko":{"world":"세계","Internet":"인터넷","slightly":"약간","kilometer":"킬로미터","volcano":"화산","Hawaiian":"하와이의"},"r":{"a":"[A] world (세계), [B] Internet (인터넷)","ev":"1번 문장","s":[[1,"If you search for “the highest mountain in the world” on the Internet, most of the results will say it is Mt. Everest.","만약 당신이 인터넷에서 ‘세계에서 가장 높은 산’을 검색한다면, 대부분의 결과들은 그것이 에베레스트산이라고 말할 것이다."]],"w":"1번 If you search for “the highest mountain in the world” on the Internet에서 가져왔어요. in the world는 '세계에서', on the Internet은 '인터넷에서'예요. 나머지 단어는 the 뒤의 이 두 자리에 의미가 맞지 않아요.","c":null},"h":"72bc748f58"}]},{"u":8,"id":"rj4-08-3","no":3,"ko":"더 맛있는 바나나가 있었어?","items":[{"n":1,"t":"tf","q":"Until 1965, the world ate a more delicious type of banana called the Gros Michel.","ko":"1965년까지, 세계는 Gros Michel이라는 더 맛있는 종류의 바나나를 먹었다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Until 1965, the world ate a more delicious type of banana, the Gros Michel.","1965년까지, 세계는 더 맛있는 종류의 바나나인 Gros Michel을 먹었다."]],"w":"1번 문장에서 1965년까지 세계는 더 맛있는 바나나인 Gros Michel을 먹었다고 해요.","c":"T"},"h":"939ae339d9"},{"n":2,"t":"tf","q":"The new type of disease has not yet spread outside Asia.","ko":"새로운 종류의 질병은 아직 아시아 밖으로 퍼지지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"This disease has already spread to Asia, Australia, and Africa, and is now endangering South America.","이 질병은 이미 아시아와 호주, 아프리카에 퍼졌고, 이제는 남아메리카를 위험에 빠뜨리고 있다."]],"w":"6번에서 이 질병은 이미 아시아와 호주, 아프리카에 퍼졌고 이제 남아메리카도 위험에 빠뜨리고 있다고 해요. 아시아 밖으로도 퍼졌어요.","c":"F"},"h":"87612a6b41"},{"n":3,"t":"tf","q":"Banana plants do not grow from seeds.","ko":"바나나 나무는 씨앗에서 자라지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The problem is that banana plants do not grow from seeds.","문제는 바나나 나무가 씨앗에서 자라지 않는다는 것이다."]],"w":"7번에서 문제는 바나나 나무가 씨앗에서 자라지 않는다는 것이라고 해요.","c":"T"},"h":"f2066f0366"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Banana growers then began to depend on a different type of banana, the Cavendish.)","ko":"바나나 재배자들은 그래서 다른 종류의 바나나인 Cavendish에 ( ) 시작했다.","opts":["반대하기","의존하기","수출하기","잊기"],"word":"depend on","r":{"a":"2) 의존하기","ev":"3번 문장","s":[[3,"Banana growers then began to depend on a different type of banana, the Cavendish.","그래서 바나나 재배자들은 다른 종류의 바나나인 Cavendish에 의존하기 시작했다."]],"w":"Gros Michel이 병으로 죽었으니 재배자들은 대신 다른 종류의 바나나에 기대게 돼요. depend on은 '~에 의존하다'예요. 4번에서 지금은 거의 모든 바나나가 이 나무에서 재배된다고 해요.","c":2},"h":"0b9cdc18ed"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, a new type of the disease is threatening the Cavendish as well.)","ko":"그러나, 그 질병의 새로운 종류가 Cavendish 역시 ( ) 있다.","opts":["돕고","키우고","위협하고","바꾸고"],"word":"threatening","r":{"a":"3) 위협하고","ev":"5번 문장","s":[[5,"However, a new type of the disease is threatening the Cavendish as well.","그러나, 그 질병의 새로운 종류가 Cavendish 역시 위협하고 있다."]],"w":"Gros Michel이 병으로 죽은 일(2번) 다음에 However로 이어지니 Cavendish도 위험해졌다는 뜻이에요. threaten은 '위협하다'예요.","c":3},"h":"5f14d5064a"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis will make it harder for diseases to spread from one type of banana plant to another.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 질병이 한 종류의 바나나 나무에서 다른 종류로 퍼지는 것을 더 어렵게 만들 것이다.","opts":["Cavendish에서 발견된 새 질병","많은 각기 다른 종류의 바나나를 재배하는 것","바나나가 씨앗에서 자라지 않는 것","바나나 값이 크게 오른 것"],"r":{"a":"2) 많은 각기 다른 종류의 바나나를 재배하는 것","ev":"10~11번 문장","s":[[10,"Experts agree that the only way to save bananas is to grow many different types of bananas.","전문가들은 바나나를 구할 유일한 방법이 많은 각기 다른 종류의 바나나를 재배하는 것이라는 데 동의한다."],[11,"This will make it harder for diseases to spread from one type of banana plant to another.","이는 질병이 한 종류의 바나나 나무에서 다른 종류로 퍼지는 것을 더 어렵게 만들 것이다."]],"w":"This는 바로 앞 10번의 내용이에요. 여러 종류의 바나나를 재배하면 한 종류에서 다른 종류로 질병이 퍼지는 것이 더 어려워진다는 뜻이에요.","c":2},"h":"93bbef01f7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So if one plant has a disease, all of the plants that grow from it will also be easily affected by that disease.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 나무 하나가 질병에 걸리면, 그것으로부터 자라는 모든 나무들 또한 그 질병에 의해 쉽게 영향을 받게 된다.","opts":["나무 하나가 병에 걸리면, 그 나무에서 자란 모든 나무도 같은 병에 쉽게 걸린다.","나무 하나가 병에 걸려도 다른 나무는 전혀 영향을 받지 않는다.","나무 하나가 병에 걸리면, 그 나무에서 자란 나무는 병이 낫는다.","모든 나무가 병에 걸려야 나무 하나가 병에 걸린다."],"r":{"a":"1) 나무 하나가 병에 걸리면, 그 나무에서 자란 모든 나무도 같은 병에 쉽게 걸린다.","ev":"9번 문장","s":[[9,"So if one plant has a disease, all of the plants that grow from it will also be easily affected by that disease.","그래서 나무 하나가 질병에 걸리면, 그것으로부터 자라는 모든 나무들 또한 그 질병에 의해 쉽게 영향을 받게 된다."]],"w":"it은 one plant예요. 한 나무에서 조각으로 자란 나무들은 같은 병의 영향을 쉽게 받는다는 뜻이에요(be affected = 영향을 받다).","c":1},"h":"39cc79359c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["전 세계 거의 모든 바나나는 Gros Michel에서 재배된다.","새로운 질병은 아시아에만 퍼졌다.","전 세계 거의 모든 바나나는 Cavendish에서 재배된다.","Cavendish는 질병에 전혀 문제가 없다."],"opts":["Almost all bananas in the world are grown from the Gros Michel.","The new disease has spread only to Asia.","Almost all bananas in the world are grown from the Cavendish.","The Cavendish has no problem with disease."],"r":{"a":"3) Almost all bananas in the world are grown from the Cavendish. (전 세계 거의 모든 바나나는 Cavendish에서 재배된다.)","ev":"4~6번 문장","s":[[4,"Now, almost all bananas in the world are grown from this type of plant.","이제, 세계의 거의 모든 바나나가 이 종류의 나무에서 재배된다."],[5,"However, a new type of the disease is threatening the Cavendish as well.","그러나, 그 질병의 새로운 종류가 Cavendish 역시 위협하고 있다."],[6,"This disease has already spread to Asia, Australia, and Africa, and is now endangering South America.","이 질병은 이미 아시아와 호주, 아프리카에 퍼졌고, 이제는 남아메리카를 위험에 빠뜨리고 있다."]],"w":"4번에서 이제 세계의 거의 모든 바나나가 Cavendish 종류의 나무에서 재배된다고 해요. Gros Michel은 Panama병으로 거의 다 죽었고(2번), 새 질병은 아시아에만 퍼진 것이 아니며(6번), Cavendish도 질병의 위협을 받고 있어요(5번).","c":3},"h":"e0efcf709f"},{"n":9,"t":"sum","q":"Banana plants grow from (A) (B) of other banana plants.","ko":"바나나 나무는 다른 바나나 나무의 (A) (B)에서 자란다.","oko":["(A) 큰 / (B) 조각","(A) 작은 / (B) 뿌리","(A) 큰 / (B) 잎","(A) 작은 / (B) 잎","(A) 작은 / (B) 조각"],"opts":["(A) large / (B) pieces","(A) small / (B) roots","(A) large / (B) leaves","(A) small / (B) leaves","(A) small / (B) pieces"],"r":{"a":"5) (A) small / (B) pieces (작은 / 조각)","ev":"8번 문장","s":[[8,"Instead, they grow from small pieces of other banana plants.","대신, 그것들은 다른 바나나 나무의 작은 조각에서 자란다."]],"w":"8번에서 바나나 나무는 다른 바나나 나무의 작은 조각(small pieces)에서 자란다고 해요. 씨앗에서 자라지 않는다는 말은 7번에 있어요.","c":5},"h":"6b0a80e989"},{"n":10,"t":"fill","q":"However, [A] disease [B] almost all of the Gros Michel plants.","ko":"그러나 [A]병이 거의 모든 Gros Michel 나무를 [B].","bank":["Panama","killed","grown","already","types","seeds"],"bko":{"Panama":"파나마(지명)","killed":"죽게 했다(kill의 과거)","grown":"재배된(grow의 과거분사)","already":"이미","types":"종류들","seeds":"씨앗"},"r":{"a":"[A] Panama (파나마(지명)), [B] killed (죽게 했다(kill의 과거))","ev":"2번 문장","s":[[2,"However, Panama disease killed almost all of the Gros Michel plants.","그러나 파나마병이 거의 모든 Gros Michel 나무를 죽게 했다."]],"w":"2번 However, Panama disease killed almost all of the Gros Michel plants에서 가져왔어요. 질병 이름은 Panama disease(파나마병)이고, 과거에 일어난 일이라 killed(kill의 과거형)예요. 나머지 단어는 이 두 자리에 문법이나 의미가 맞지 않아요.","c":null},"h":"ef979c9608"}]},{"u":8,"id":"rj4-08-4","no":4,"ko":"사막에서 낚시를","items":[{"n":1,"t":"tf","q":"Researchers will continue to study the Sahara area.","ko":"연구자들은 사하라 지역을 계속 연구할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Researchers will continue to study this area.","연구자들은 이 지역을 계속 연구할 것이다."]],"w":"10번에서 연구자들은 이 지역을 계속 연구할 것이라고 해요.","c":"T"},"h":"1287460a61"},{"n":2,"t":"tf","q":"The researchers found the skeletons of fewer than 200 human beings.","ko":"연구자들은 200구보다 적은 인간 해골을 찾았다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"They found the skeletons of more than 200 human beings, along with hunting tools, fishing instruments, and other artifacts.","그들은 사냥 도구와 낚시 도구, 다른 공예품들과 함께 200구 이상의 인간 해골들을 찾았다."]],"w":"6번에서 200구 이상(more than 200)의 인간 해골을 찾았다고 해요. 200구보다 적다는 말과 반대예요.","c":"F"},"h":"178d549e94"},{"n":3,"t":"tf","q":"Today, the Sahara desert looks like a dry, lifeless land.","ko":"오늘날 사하라 사막은 건조하고 생명체가 살지 않는 땅으로 보인다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"When you look at the Sahara desert today, you see a dry, lifeless land.","당신이 오늘날 사하라 사막을 보면, 건조하고, 생명체가 살지 않는 땅을 본다."]],"w":"1번에서 오늘날 사하라 사막을 보면 건조하고 생명체가 살지 않는 땅이 보인다고 해요.","c":"T"},"h":"f9612a7a0e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A team of researchers made a surprising discovery that helps us understand more about this interesting time.)","ko":"한 연구팀이 이 흥미로운 시대에 대해 우리가 더 이해하게 돕는 놀라운 ( )을 했다.","opts":["사고","발견","실수","경기"],"word":"discovery","r":{"a":"2) 발견","ev":"5번 문장","s":[[5,"A team of researchers made a surprising discovery that helps us understand more about this interesting time.","한 연구팀이 이 흥미로운 시대에 대해서 우리가 더 이해할 수 있도록 돕는 놀라운 발견을 했다."]],"w":"연구팀이 해골과 도구를 찾아서(6번) 옛 시대를 이해하는 데 도움을 주었어요. discovery는 '발견'이에요.","c":2},"h":"e1bdf04b47"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They also uncovered the bones of large fish and crocodiles.)","ko":"그들은 또한 커다란 물고기와 악어의 뼈를 ( ).","opts":["숨겼다","그렸다","발견했다","버렸다"],"word":"uncovered","r":{"a":"3) 발견했다","ev":"6~7번 문장","s":[[6,"They found the skeletons of more than 200 human beings, along with hunting tools, fishing instruments, and other artifacts.","그들은 사냥 도구와 낚시 도구, 다른 공예품들과 함께 200구 이상의 인간 해골들을 찾았다."],[7,"They also uncovered the bones of large fish and crocodiles.","그들은 또한 커다란 물고기와 악어의 뼈를 발견했다."]],"w":"6번에서 연구팀이 해골을 찾았고(found), 7번에서 also(또한)로 이어져 뼈도 찾았다는 뜻이에요. uncover는 덮인 것을 열어서 '발견하다'예요.","c":3},"h":"6cb8662251"},{"n":6,"t":"ref","q":"What does the underlined \"These animals\" refer to?\nThese animals could not have survived in a desert climate.","ko":"밑줄 친 These animals가 가리키는 것은?","sko":"이 동물들은 사막 기후에서는 생존할 수 없었을 것이다.","opts":["연구자들","200구 이상의 해골","사냥 도구들","큰 물고기와 악어"],"r":{"a":"4) 큰 물고기와 악어","ev":"7~8번 문장","s":[[7,"They also uncovered the bones of large fish and crocodiles.","그들은 또한 커다란 물고기와 악어의 뼈를 발견했다."],[8,"These animals could not have survived in a desert climate.","이 동물들은 사막 기후에서는 생존할 수 없었을 것이다."]],"w":"사막 기후에서 살 수 없는 동물은 바로 앞 7번에서 뼈가 발견된 큰 물고기와 악어예요. 연구자들, 해골, 도구는 동물이 아니에요.","c":4},"h":"03aad357b0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Can you now believe the Sahara desert used to be very different?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신은 이제 사하라 사막이 매우 달랐었다는 것을 믿을 수 있는가?","opts":["당신은 사하라 사막이 앞으로 매우 달라질 것이라고 믿는가?","당신은 사하라 사막이 항상 똑같았다고 믿을 수 있는가?","당신은 이제 사하라 사막이 예전에는 매우 달랐다는 것을 믿을 수 있는가?","당신은 사하라 사막이 지금도 매우 다르다고 믿는가?"],"r":{"a":"3) 당신은 이제 사하라 사막이 예전에는 매우 달랐다는 것을 믿을 수 있는가?","ev":"9번 문장","s":[[9,"Can you now believe the Sahara desert used to be very different?","당신은 이제 사하라 사막이 매우 달랐었다는 것을 믿을 수 있는가?"]],"w":"used to be는 '예전에는 ~이었다'로, 지금은 그렇지 않다는 뜻이에요. 지금은 메마른 사막이지만 예전에는 매우 달랐다는 것을 이제(now) 믿을 수 있냐고 묻는 문장이에요.","c":3},"h":"8a7924b8b0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["녹색 사하라 시대는 약 5,000년 전에 시작되었을지도 모른다.","연구자들은 사하라에서 사람 뼈를 전혀 찾지 못했다.","연구자들은 사하라 지역 연구를 멈출 것이다.","녹색 사하라 시대는 약 11,000년 전에 시작되었을지도 모른다."],"opts":["The Green Sahara period may have started about 5,000 years ago.","The researchers found no human bones in the Sahara.","The researchers will stop studying the Sahara area.","The Green Sahara period may have started about 11,000 years ago."],"r":{"a":"4) The Green Sahara period may have started about 11,000 years ago. (녹색 사하라 시대는 약 11,000년 전에 시작되었을지도 모른다.)","ev":"3번 문장","s":[[3,"This period, now known as the Green Sahara period, may have started about 11,000 years ago and lasted until about 5,000 years ago.","현재 녹색 사하라 시대로 알려진 이 시대는 약 11,000년 전에 시작해서 약 5,000년 전까지 계속됐을지도 모른다."]],"w":"3번에서 녹색 사하라 시대는 약 11,000년 전에 시작해서 약 5,000년 전까지 계속됐을지도 모른다고 해요. 5,000년 전은 시작이 아니라 끝난 때예요.","c":4},"h":"5f4fc869de"},{"n":9,"t":"sum","q":"The Sahara once received lots of (A) and had (B) and rivers.","ko":"사하라는 한때 많은 (A)을(를) 받았고 (B)와(과) 강이 있었다.","oko":["(A) 햇빛 / (B) 호수","(A) 강우 / (B) 산","(A) 햇빛 / (B) 산","(A) 눈 / (B) 호수","(A) 강우 / (B) 호수"],"opts":["(A) sunshine / (B) lakes","(A) rainfall / (B) mountains","(A) sunshine / (B) mountains","(A) snow / (B) lakes","(A) rainfall / (B) lakes"],"r":{"a":"5) (A) rainfall / (B) lakes (강우 / 호수)","ev":"2번 문장","s":[[2,"However, it is believed that the Sahara once received lots of rainfall and had lakes and rivers.","그러나, 사하라 사막은 한때 많은 강우를 받았고 호수와 강이 있었다고 믿어진다."]],"w":"2번에서 사하라는 한때 많은 강우(rainfall)를 받았고 호수(lakes)와 강이 있었다고 해요. 지금은 건조한 땅이지만 예전에는 달랐어요.","c":5},"h":"bd017d20c1"},{"n":10,"t":"fill","q":"We can expect to learn more about the Sahara desert’s unexpected [A] and the ancient people who once [B] the Sahara their home.","ko":"우리는 사하라 사막의 뜻밖의 [A]와(과) 한때 사하라 사막을 그들의 집이라고 [B] 고대의 사람들에 대해 더 알게 될 것이라고 예상할 수 있다.","bank":["past","called","surprising","interesting","lasted","dry"],"bko":{"past":"과거","called":"불렀던(call의 과거)","surprising":"놀라운","interesting":"흥미로운","lasted":"계속됐다(last의 과거)","dry":"건조한"},"r":{"a":"[A] past (과거), [B] called (불렀던(call의 과거))","ev":"11번 문장","s":[[11,"We can expect to learn more about the Sahara desert’s unexpected past and the ancient people who once called the Sahara their home.","우리는 사하라 사막의 뜻밖의 과거와 한때 사하라 사막을 그들의 집이라고 불렀던 고대의 사람들에 대해 더 알게 될 것이라고 예상할 수 있다."]],"w":"11번 the Sahara desert’s unexpected past and the ancient people who once called the Sahara their home에서 가져왔어요. unexpected 뒤에는 명사 past(과거)가 오고, who once called A B는 'A를 B라고 불렀던'이에요. 나머지 단어는 이 두 자리에 문법이나 의미가 맞지 않아요.","c":null},"h":"2e1befd3ed"}]},{"u":9,"id":"rj4-09-1","no":1,"ko":"부드러운 곡선, 날카로운 현실","items":[{"n":1,"t":"tf","q":"Charles Keeling measured the change in CO2 every day for 47 years.","ko":"Charles Keeling은 47년 동안 매일 이산화탄소의 변화를 측정했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It was named after the scientist Charles Keeling, who actually measured the change every day for 47 years.","그것은 과학자 Charles Keeling의 이름을 따서 이름 지어졌는데, 그는 47년간 매일 그 변화를 실제로 측정했다."]],"w":"2번 문장에 who actually measured the change every day for 47 years라고 있어요. 매일 47년간 측정했다는 내용과 같아요.","c":"T"},"h":"77df1ccffa"},{"n":2,"t":"tf","q":"Mauna Loa was ideal for collecting clean air because it is close to human activity.","ko":"마우나로아는 인간 활동과 가까워서 깨끗한 공기를 모으기에 이상적이었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Being far away from human activity, this location was ideal for collecting clean air.","인간 활동에서 멀리 떨어져 있어서, 이 장소는 깨끗한 공기를 수집하는 데 이상적이었다."]],"w":"4번 문장에서 마우나로아는 인간 활동에서 멀리 떨어져(far away) 있어서 이상적이라고 해요. 가깝다는 말은 반대예요.","c":"F"},"h":"fba5127031"},{"n":3,"t":"tf","q":"When CO2 levels in the air increase, temperatures and sea levels around the globe rise.","ko":"대기 중 이산화탄소 농도가 증가하면, 전 세계적으로 기온과 해수면이 올라간다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"If CO2 levels in the air increase, temperatures and sea levels around the globe rise.","만약 대기 중 이산화탄소 농도가 증가하면, 전 세계적으로 기온과 해수면이 올라간다."]],"w":"8번 문장에 If CO2 levels in the air increase, temperatures and sea levels around the globe rise.라고 그대로 나와요.","c":"T"},"h":"bf6a591ee1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...in a particular place.)","ko":"그래프는 ( ) 장소에서의 시간의 흐름에 따른 대기 중 이산화탄소 농도의 변화를 보여 준다.","opts":["익숙한","위험한","특정한","거대한"],"word":"particular","r":{"a":"3) 특정한","ev":"1번 문장","s":[[1,"The “Keeling Curve” is a graph that shows the changes in the level of CO2 in the air over time in a particular place.","‘킬링 곡선’은 특정 장소에서의 시간의 흐름에 따른 대기 중 이산화탄소 농도의 변화를 보여 주는 그래프이다."]],"w":"1번 문장은 킬링 곡선이 어떤 한 장소에서 시간에 따른 이산화탄소 변화를 보여 주는 그래프라는 뜻이에요. a particular place는 '특정한 장소'예요.","c":3},"h":"27d0286662"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...can endanger people's lives...)","ko":"이산화탄소의 증가가 극심한 기상 사태를 일으켜 인명을 ( ) 수 있다.","opts":["위태롭게 할","구해 줄","연장할","가볍게 할"],"word":"endanger","r":{"a":"1) 위태롭게 할","ev":"11~12번 문장","s":[[11,"Typhoons absorb this energy and become stronger and more dangerous than before.","태풍은 이 에너지를 흡수하여 전보다 더 강하고 위험해진다."],[12,"In other words, an increase of CO2 can endanger people’s lives by causing violent weather events.","다시 말해서, 이산화탄소의 증가가 극심한 기상 사태를 유발함으로써 인명을 위태롭게 만들 수 있다."]],"w":"11번에서 태풍이 더 강하고 위험해지고, 12번에서 그것이 사람들의 생명에 어떤 일을 하는지 말해요. 위험해지는 흐름이니 endanger는 '위태롭게 하다'예요.","c":1},"h":"05f57aed83"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis increases the amount of water vapor in the air.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 대기 중 수증기량을 증가시킨다.","opts":["이산화탄소 농도가 낮아지는 것","태풍이 약해지는 것","킬링 곡선을 처음 그린 것","전 세계적으로 기온과 해수면이 올라가는 것"],"r":{"a":"4) 전 세계적으로 기온과 해수면이 올라가는 것","ev":"8~9번 문장","s":[[8,"If CO2 levels in the air increase, temperatures and sea levels around the globe rise.","만약 대기 중 이산화탄소 농도가 증가하면, 전 세계적으로 기온과 해수면이 올라간다."],[9,"This increases the amount of water vapor in the air.","이는 대기 중 수증기량을 증가시킨다."]],"w":"9번의 This는 바로 앞 8번 문장의 내용을 가리켜요. 이산화탄소가 늘어 기온과 해수면이 올라가는 것이 수증기를 늘려요.","c":4},"h":"5c91c4b1f6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Interestingly, the higher the curve goes, the more severe the weather becomes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"흥미롭게도, 곡선이 높아지면 질수록, 날씨가 더 극심해진다.","opts":["곡선이 낮아질수록 날씨가 더 극심해진다.","곡선이 높아질수록 날씨가 더 극심해진다.","곡선이 높아질수록 날씨가 더 온화해진다.","날씨가 극심해져도 곡선은 변하지 않는다."],"r":{"a":"2) 곡선이 높아질수록 날씨가 더 극심해진다.","ev":"5번 문장","s":[[5,"Interestingly, the higher the curve goes, the more severe the weather becomes.","흥미롭게도, 곡선이 높아지면 질수록, 날씨가 더 극심해진다."]],"w":"the higher ~, the more …은 '~할수록 더 …하다'예요. 곡선이 높아질수록 날씨가 더 극심해진다는 뜻이에요.","c":2},"h":"62564a10fa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Charles Keeling은 변화를 딱 한 번만 측정했다.","킬링 곡선은 대기 중 수증기량을 보여 주는 그래프이다.","태풍은 물 분자들이 만든 에너지를 흡수해 더 강해진다.","마우나로아는 인간 활동이 아주 많은 장소이다."],"opts":["Charles Keeling measured the change only once.","The Keeling Curve shows the amount of water vapor in the air.","Typhoons absorb the energy made by water molecules and become stronger.","Mauna Loa is a place with a lot of human activity."],"r":{"a":"3) Typhoons absorb the energy made by water molecules and become stronger.","ev":"1~2번, 4번, 10~11번 문장","s":[[1,"The “Keeling Curve” is a graph that shows the changes in the level of CO2 in the air over time in a particular place.","‘킬링 곡선’은 특정 장소에서의 시간의 흐름에 따른 대기 중 이산화탄소 농도의 변화를 보여 주는 그래프이다."],[2,"It was named after the scientist Charles Keeling, who actually measured the change every day for 47 years.","그것은 과학자 Charles Keeling의 이름을 따서 이름 지어졌는데, 그는 47년간 매일 그 변화를 실제로 측정했다."],[4,"Being far away from human activity, this location was ideal for collecting clean air.","인간 활동에서 멀리 떨어져 있어서, 이 장소는 깨끗한 공기를 수집하는 데 이상적이었다."],[10,"All those water molecules rub together and create energy.","그 모든 물 분자들은 서로 맞비벼지고 에너지를 만들어 낸다."],[11,"Typhoons absorb this energy and become stronger and more dangerous than before.","태풍은 이 에너지를 흡수하여 전보다 더 강하고 위험해진다."]],"w":"10~11번에서 물 분자들이 만든 에너지를 태풍이 흡수해 더 강해진다고 해요. 측정은 47년간 매일 했고(2번), 곡선은 이산화탄소 농도를 보여 주며(1번), 마우나로아는 인간 활동에서 멀어요(4번).","c":3},"h":"bd1115a9f6"},{"n":9,"t":"sum","q":"This (A) measurement took place at Mauna Loa in (B).","ko":"이 (A) 측정은 (B)의 마우나로아에서 일어났다.","oko":["(A) 드문 / (B) 하와이","(A) 지속적인 / (B) 알래스카","(A) 드문 / (B) 알래스카","(A) 짧은 / (B) 하와이","(A) 지속적인 / (B) 하와이"],"opts":["(A) rare / (B) Hawaii","(A) continuous / (B) Alaska","(A) rare / (B) Alaska","(A) short / (B) Hawaii","(A) continuous / (B) Hawaii"],"r":{"a":"5) (A) continuous / (B) Hawaii (지속적인 / 하와이)","ev":"3번 문장","s":[[3,"This continuous measurement took place at Mauna Loa in Hawaii.","이 지속적인 측정은 하와이의 마우나로아에서 일어났다."]],"w":"3번에서 이 지속적인(continuous) 측정은 하와이(Hawaii)의 마우나로아에서 일어났다고 해요.","c":5},"h":"56a8cc2132"},{"n":10,"t":"fill","q":"This is because CO2 is [A] related to [B] change.","ko":"이는 이산화탄소가 [B] 변화와 [A] 관련이 있기 때문이다.","bank":["highly","climate","typhoons","curve","location","graph"],"bko":{"highly":"매우, 상당히","climate":"기후","typhoons":"태풍들","curve":"곡선","location":"장소","graph":"그래프"},"r":{"a":"[A] highly (매우, 상당히), [B] climate (기후)","ev":"6번 문장","s":[[6,"This is because CO2 is highly related to climate change.","이는 이산화탄소가 기후 변화와 상당히 관련이 있기 때문이다."]],"w":"6번 This is because CO2 is highly related to climate change에서 가져왔어요. highly related는 '매우 관련 있는', climate change는 '기후 변화'예요. 나머지 단어는 이 두 자리에 문법이나 의미가 맞지 않아요.","c":null},"h":"bb9208c937"}]},{"u":9,"id":"rj4-09-2","no":2,"ko":"바위 전용 워터파크","items":[{"n":1,"t":"tf","q":"The sailing stones weigh up to 318 kg.","ko":"미끄러지듯 움직이는 돌은 무게가 318kg까지 나간다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"For decades, the rocks were a mystery because they weigh up to 318 kg.","수십 년 동안, 그 바위들은 무게가 318kg까지 나가기 때문에 수수께끼였다."]],"w":"2번 문장에 they weigh up to 318 kg이라고 있어요. 무게가 최대 318kg이라는 내용과 같아요.","c":"T"},"h":"9dce3a16b7"},{"n":2,"t":"tf","q":"Many people saw the rocks move, but t clear tracks in the mud.","ko":"밑줄 친 them이 가리키는 것은?","sko":"게다가, 아무도 한 번도 그것들이 움직이는 것을 보지 못했지만, 그것들은 진흙에 분명한 자국을 남겼다.","opts":["그 바위들","과학자들","진흙 자국들","국립공원의 방문객들"],"r":{"a":"1) 그 바위들","ev":"2~3번 문장","s":[[2,"For decades, the rocks were a mystery because they weigh up to 318 kg.","수십 년 동안, 그 바위들은 무게가 318kg까지 나가기 때문에 수수께끼였다."],[3,"Moreover, no one had ever seen them move, but they left clear tracks in the mud.","게다가, 아무도 한 번도 그것들이 움직이는 것을 보지 못했지만, 그것들은 진흙에 분명한 자국을 남겼다."]],"w":"움직이는 것을 본 적이 없다고 한 대상은 2번에서 무게가 318kg까지 나가는 바위들(the rocks)이에요.","c":1},"h":"a0dd3eb773"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Of course, this alone isn't enough to move the rocks.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"물론, 이것만으로는 그 바위들을 움직이기에 충분하지 않다.","opts":["물론, 이것은 바위를 움직이기에 충분하고도 남는다.","물론, 바위를 움직이는 것은 아무도 해내지 못한다.","물론, 이것 하나만으로는 바위를 움직이기에 부족하다.","물론, 이것은 바위를 움직일 필요가 없다."],"r":{"a":"3) 물론, 이것 하나만으로는 바위를 움직이기에 부족하다.","ev":"9번 문장","s":[[9,"Of course, this alone isn’t enough to move the rocks.","물론, 이것만으로는 그 바위들을 움직이기에 충분하지 않다."]],"w":"alone은 '그것만으로', isn't enough to ~는 '~하기에 충분하지 않다'예요. 얼음의 힘만으로는 부족하고 바람이 더해져야 해요.","c":3},"h":"0baad21123"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["바위가 가벼워서 사람들이 쉽게 움직일 수 있다.","비, 얼음, 태양, 바람이 함께 바위를 움직이게 한다.","바위는 바람이 전혀 없을 때만 움직인다.","바위의 수수께끼는 아직 풀리지 않았다."],"opts":["The rocks are light, so people can move them easily.","Rain, ice, sun, and wind together make the rocks move.","The rocks move only when there is no wind.","The mystery of the rocks is still unsolved."],"r":{"a":"2) Rain, ice, sun, and wind together make the rocks move.","ev":"2번, 5번, 10~11번 문장","s":[[2,"For decades, the rocks were a mystery because they weigh up to 318 kg.","수십 년 동안, 그 바위들은 무게가 318kg까지 나가기 때문에 수수께끼였다."],[5,"Using GPS, cameras, and weather data, they found that the movement is caused by a combination of rain, ice, sun, and wind.","GPS와 카메라, 기상 정보를 이용해서 그들은 그 움직임이 비와 얼음, 태양 그리고 바람의 결합에 의해 야기된다는 것을 밝혀냈다."],[10,"When wind speeds reach about 11 km/h, the force of the ice and wind together causes the rocks to move at speeds up to five meters per minute.","풍속이 약 시속 11km에 이를 때, 얼음과 바람이 함께하는 힘은 그 바위들이 분당 5미터에 달하는 속도로 움직이게 한다."],[11,"The mystery was solved!","수수께끼가 풀렸다!"]],"w":"5번에서 비, 얼음, 태양, 바람의 결합이 바위를 움직인다고 해요. 바위는 최대 318kg이고(2번), 바람이 약 시속 11km에 이를 때 움직이며(10번), 수수께끼는 풀렸어요(11번).","c":2},"h":"4a8c40725b"},{"n":9,"t":"sum","q":"At night, the water at the (A) of the pond (B), and the ice surrounds the rocks.","ko":"밤에, 연못 (A)의 물이 (B), 그리고 얼음이 바위들을 둘러싼다.","oko":["(A) 바닥 / (B) 언다","(A) 표면 / (B) 녹는다","(A) 바닥 / (B) 녹는다","(A) 가장자리 / (B) 끓는다","(A) 표면 / (B) 언다"],"opts":["(A) bottom / (B) freezes","(A) surface / (B) melts","(A) bottom / (B) melts","(A) edge / (B) boils","(A) surface / (B) freezes"],"r":{"a":"5) (A) surface / (B) freezes (표면 / 언다)","ev":"7번 문장","s":[[7,"At night, the water at the surface of the pond freezes, and the ice surrounds the rocks.","밤에, 연못 표면의 물이 얼고, 얼음이 바위들을 둘러싼다."]],"w":"7번에서 밤에 연못 표면(surface)의 물이 얼고(freezes) 얼음이 바위들을 둘러싼다고 해요.","c":5},"h":"9a99156440"},{"n":10,"t":"fill","q":"When wind speeds [A] about 11 km/h, the force of the ice and wind together causes the rocks to move at speeds up to five meters per [B].","ko":"풍속이 약 시속 11km에 [A] 때, 얼음과 바람이 함께하는 힘은 그 바위들이 [B]당 5미터에 달하는 속도로 움직이게 한다.","bank":["reach","minute","solved","sheets","tracks","mystery"],"bko":{"reach":"이르다, 도달하다","minute":"분","solved":"풀렸다(solve의 과거분사)","sheets":"판들","tracks":"자국들","mystery":"수수께끼"},"r":{"a":"[A] reach (이르다, 도달하다), [B] minute (분)","ev":"10번 문장","s":[[10,"When wind speeds reach about 11 km/h, the force of the ice and wind together causes the rocks to move at speeds up to five meters per minute.","풍속이 약 시속 11km에 이를 때, 얼음과 바람이 함께하는 힘은 그 바위들이 분당 5미터에 달하는 속도로 움직이게 한다."]],"w":"10번 When wind speeds reach about 11 km/h ... five meters per minute에서 가져왔어요. reach about 11 km/h는 '약 시속 11km에 이르다', per minute는 '분당'이에요. 나머지 단어는 이 두 자리에 문법이나 의미가 맞지 않아요.","c":null},"h":"4228803448"}]},{"u":9,"id":"rj4-09-3","no":3,"ko":"예쁜 눈의 비애","items":[{"n":1,"t":"tf","q":"Watermelon snow has been found in the Arctic and Antarctica.","ko":"수박 눈은 북극과 남극 대륙에서 발견되어 왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"A type of mysterious pink snow, known as “watermelon snow,” has been found in various places around the world, including the Rocky Mountains, the Himalayas, the Arctic, and Antarctica.","‘수박 눈’으로 알려진 한 종류의 불가사의한 분홍색 눈이 로키산맥과 히말라야산맥, 북극 그리고 남극 대륙을 포함하여 세계의 다양한 장소에서 발견되었다."]],"w":"2번 문장에 장소로 the Arctic, and Antarctica가 나와요. 북극과 남극 대륙에서도 발견되었다는 내용과 같아요.","c":"T"},"h":"866ddee94a"},{"n":2,"t":"tf","q":"People could easily explain watermelon snow thousands of years ago.","ko":"사람들은 수천 년 전에 수박 눈을 쉽게 설명할 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"For thousands of years, people were unable to explain it.","수천 년 동안, 사람들은 그것을 설명하지 못했다."]],"w":"3번 문장에서 수천 년 동안 사람들은 그것을 설명하지 못했다(were unable to explain)고 해요. 쉽게 설명했다는 말은 반대예요.","c":"F"},"h":"f49cf133d5"},{"n":3,"t":"tf","q":"The algae tend to bloom where there are freezing temperatures and water.","ko":"그 조류는 영하의 기온과 물이 있는 곳에서 활발히 번식하는 경향이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"These algae tend to bloom in conditions that include freezing temperatures and the presence of water.","이 조류들은 영하의 기온과 물의 존재를 포함하는 환경에서 나타나는 경향이 있다."]],"w":"5번 문장에 These algae tend to bloom in conditions that include freezing temperatures and the presence of water.라고 있어요.","c":"T"},"h":"c77aca4ac3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These algae tend to bloom ...)","ko":"이 조류들은 영하의 기온과 물이 있는 환경에서 ( ) 경향이 있다.","opts":["사라지는","나타나는","얼어붙는","가라앉는"],"word":"bloom","r":{"a":"2) 나타나는","ev":"5번, 7번 문장","s":[[5,"These algae tend to bloom in conditions that include freezing temperatures and the presence of water.","이 조류들은 영하의 기온과 물의 존재를 포함하는 환경에서 나타나는 경향이 있다."],[7,"When the sun begins to melt snow in early spring, the algae begin to bloom rapidly in snow.","태양이 초봄에 눈을 녹이기 시작할 때, 그 조류가 눈 속에서 급속히 나타나기 시작한다."]],"w":"5번에서 조류가 bloom하는 경향이 있다고 하고, 7번에서 눈이 녹기 시작하면 조류가 눈 속에서 빠르게 bloom하기 시작해요. 그래서 눈이 분홍색이 되니(8번) '나타나다'예요.","c":2},"h":"2c1ec5441b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...watermelon snow occurs in mountain ranges...)","ko":"이런 이유로, 수박 눈은 빙하가 존재하는 산맥과 다른 장소들에서 ( ).","opts":["발생한다","사라진다","녹는다","흐른다"],"word":"occurs","r":{"a":"1) 발생한다","ev":"6번 문장","s":[[6,"For this reason, watermelon snow occurs in mountain ranges and other places where glaciers exist.","이런 이유로, 수박 눈은 빙하가 존재하는 산맥과 다른 장소들에서 발생한다."]],"w":"6번 문장은 수박 눈이 어디서 생기는지 말해요. occur는 '일어나다, 발생하다'예요. 산맥과 빙하가 있는 곳에서 생긴다는 뜻이에요.","c":1},"h":"5c5fb8fe70"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nFor thousands of years, people were unable to explain it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"수천 년 동안, 사람들은 그것을 설명하지 못했다.","opts":["로키산맥","북극","분홍색 눈(수박 눈)","빙하의 원인인 조류"],"r":{"a":"3) 분홍색 눈(수박 눈)","ev":"2~3번 문장","s":[[2,"A type of mysterious pink snow, known as “watermelon snow,” has been found in various places around the world, including the Rocky Mountains, the Himalayas, the Arctic, and Antarctica.","‘수박 눈’으로 알려진 한 종류의 불가사의한 분홍색 눈이 로키산맥과 히말라야산맥, 북극 그리고 남극 대륙을 포함하여 세계의 다양한 장소에서 발견되었다."],[3,"For thousands of years, people were unable to explain it.","수천 년 동안, 사람들은 그것을 설명하지 못했다."]],"w":"3번의 it은 바로 앞 2번에서 소개한 분홍색 눈, 즉 수박 눈이에요. 사람들이 오랫동안 이유를 설명하지 못한 것이에요.","c":3},"h":"67794db70a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Pink snow may be pretty, but it actually causes a serious problem.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"분홍색 눈은 예쁠지 모르지만, 그것은 사실 심각한 문제를 야기한다.","opts":["분홍색 눈은 예쁘고, 그래서 아무 문제도 일으키지 않는다.","분홍색 눈은 예쁘지 않지만 문제도 없다.","분홍색 눈은 문제를 해결해 준다.","분홍색 눈은 예쁠지 몰라도, 사실은 심각한 문제를 일으킨다."],"r":{"a":"4) 분홍색 눈은 예쁠지 몰라도, 사실은 심각한 문제를 일으킨다.","ev":"9번 문장","s":[[9,"Pink snow may be pretty, but it actually causes a serious problem.","분홍색 눈은 예쁠지 모르지만, 그것은 사실 심각한 문제를 야기한다."]],"w":"may be ~, but …은 '~일지 모르지만 …하다'예요. 예쁘다는 좋은 점 뒤에 but으로 심각한 문제를 말하고 있어요.","c":4},"h":"d61a3bc8fb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["수박 눈은 로키산맥에서만 발견된다.","한 과학자가 아주 작고 불그스름한 조류가 눈을 분홍색으로 만든다는 것을 알아냈다.","과학자들은 수박 눈에 색을 입히는 것이 무엇인지 여전히 설명하지 못한다.","수박 눈의 색은 아주 작은 파란 곤충에서 나온다."],"opts":["Watermelon snow is found only in the Rocky Mountains.","A scientist found that tiny reddish algae make the snow pink.","Scientists still cannot explain what colors watermelon snow.","The color of watermelon snow comes from tiny blue insects."],"r":{"a":"2) A scientist found that tiny reddish algae make the snow pink. (한 과학자가 아주 작고 불그스름한 조류가 눈을 분홍색으로 만든다는 것을 알아냈다.)","ev":"4번 문장","s":[[4,"Finally, a scientist discovered its cause—tiny reddish algae.","마침내, 한 과학자가 그 원인을 알아냈는데, 아주 작고 불그스름한 조류였다."]],"w":"4번에서 한 과학자가 그 원인이 아주 작고 불그스름한 조류(tiny reddish algae)라는 것을 알아냈다고 해요. 8번에서 이 조류가 눈을 분홍색으로 물들인다고 해요.","c":2},"h":"492146e0fe"},{"n":9,"t":"sum","q":"Considering that the rapid melting of glaciers (A) life on Earth, it is definitely not our (B)!","ko":"빙하의 빠른 녹음이 지구의 생명체를 (A)은(는) 것을 고려하면, 그것은 분명 우리의 (B)이(가) 아니다!","oko":["(A) 돕 / (B) 친구","(A) 위협하 / (B) 적","(A) 구하 / (B) 친구","(A) 숨기 / (B) 친구","(A) 위협하 / (B) 친구"],"opts":["(A) helps / (B) friend","(A) threatens / (B) enemy","(A) saves / (B) friend","(A) hides / (B) friend","(A) threatens / (B) friend"],"r":{"a":"5) (A) threatens / (B) friend (위협하 / 친구)","ev":"11번 문장","s":[[11,"Considering that the rapid melting of glaciers threatens life on Earth, it is definitely not our friend!","빙하가 빠르게 녹는 것이 지구의 생명체를 위협한다는 것을 고려하면, 그것은 우리의 친구가 분명 아니다!"]],"w":"11번에서 빙하가 빠르게 녹는 것이 지구의 생명체를 위협한다(threatens)고 하고, 그래서 눈은 우리의 친구(friend)가 분명 아니라고 해요.","c":5},"h":"e68fc760e1"},{"n":10,"t":"fill","q":"Watermelon snow’s pinkish color makes it absorb more [A], which speeds up the melting [B] of glaciers.","ko":"수박 눈의 분홍빛을 띤 색은 그것(눈)이 더 많은 [A]을(를) 흡수하게 만들고, 이는 빙하의 녹는 [B]의 속도를 높인다.","bank":["sunlight","process","scientist","presence","mountain","Antarctica"],"bko":{"sunlight":"햇빛","process":"과정","scientist":"과학자","presence":"존재","mountain":"산","Antarctica":"남극 대륙"},"r":{"a":"[A] sunlight (햇빛), [B] process (과정)","ev":"10번 문장","s":[[10,"Watermelon snow’s pinkish color makes it absorb more sunlight, which speeds up the melting process of glaciers.","수박 눈의 분홍빛을 띤 색은 그것(눈)이 더 많은 햇빛을 흡수하게 만들고, 이는 빙하의 녹는 과정의 속도를 높인다."]],"w":"10번 Watermelon snow’s pinkish color makes it absorb more sunlight, which speeds up the melting process of glaciers.에서 가져왔어요. 나머지 단어는 이 문장 빈칸에 문법과 의미가 맞지 않아요.","c":null},"h":"485ff58749"}]},{"u":9,"id":"rj4-09-4","no":4,"ko":"지구에 커튼을 친 것도 아닌데!","items":[{"n":1,"t":"tf","q":"Burning coal and oil produces pieces of dust and other material.","ko":"석탄과 기름을 태우면 먼지와 다른 물질의 조각들이 발생한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They are often pieces of dust and other material produced when coal and oil are burned.","그것들은 흔히 석탄과 기름이 태워질 때 발생되는 먼지와 다른 물질의 조각들이다."]],"w":"2번 문장에 pieces of dust and other material produced when coal and oil are burned가 있어요. 석탄과 기름이 태워질 때 생긴다는 내용과 같아요.","c":"T"},"h":"3547782b80"},{"n":2,"t":"tf","q":"The earth now receives more sunlight than it did 50 years ago.","ko":"지구는 이제 50년 전보다 더 많은 햇빛을 받는다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Studies have shown that the earth currently receives less sunlight than it did 50 years ago.","연구들은 지구가 현재 그것이 50년 전에 받았던 것보다 더 적은 햇빛을 받는다는 것을 보여 왔다."]],"w":"6번 문장에서 지구가 현재 50년 전보다 더 적은(less) 햇빛을 받는다고 해요. 더 많이 받는다는 말은 반대예요.","c":"F"},"h":"c95314c392"},{"n":3,"t":"tf","q":"Dust pollutes clouds, so it is harder for sunlight to pass through them.","ko":"먼지는 구름을 오염시켜서 햇빛이 구름을 통과하기 더 어렵게 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"They also pollute clouds, making it harder for sunlight to pass through.","그것들은 또한 구름을 오염시켜서 햇빛이 통과하는 것을 더 어렵게 만든다."]],"w":"8번 문장에 They also pollute clouds, making it harder for sunlight to pass through.가 있어요. 구름을 오염시켜 햇빛이 통과하기 더 어려워진다는 내용과 같아요.","c":"T"},"h":"13a9abacff"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...these tiny objects in the air absorb some of the sun's energy...)","ko":"공기 중 이 아주 작은 물체들이 태양 에너지의 일부를 ( ) 태양 복사열을 다시 우주로 반사한다.","opts":["흡수하고","만들고","건너고","피하고"],"word":"absorb","r":{"a":"1) 흡수하고","ev":"7번 문장","s":[[7,"This is because these tiny objects in the air absorb some of the sun’s energy and reflect solar radiation back into space.","이는 공기 중 이 아주 작은 물체들이 태양 에너지의 일부를 흡수하고 태양 복사열을 다시 우주로 반사하기 때문이다."]],"w":"7번 문장에서 작은 물체들이 태양 에너지의 일부를 absorb하고, 태양 복사열은 우주로 반사한다고 해요. 그래서 지구에 오는 햇빛이 줄어요. absorb는 '흡수하다'예요.","c":1},"h":"06b7ed6f48"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...some sunlight cannot reach the earth's surface.)","ko":"이것들의 결과로, 일부 햇빛은 지구의 표면에 ( ) 못한다.","opts":["떠나지","피하지","이르지","멈추지"],"word":"reach","r":{"a":"3) 이르지","ev":"9번 문장","s":[[9,"As a result of these things, some sunlight cannot reach the earth’s surface.","이것들의 결과로, 일부 햇빛은 지구의 표면에 이르지 못한다."]],"w":"9번 문장은 7~8번 때문에 일부 햇빛이 지구 표면에 닿지 못한다는 결과를 말해요. reach는 '이르다, 닿다'예요.","c":3},"h":"fb4a2f0633"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey cause air pollution and increase the risk of many diseases.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 대기 오염을 야기하고 많은 질병의 위험을 증가시킨다.","opts":["석탄과 기름","먼지와 다른 물질의 조각들","햇빛","살아 있는 생명체들"],"r":{"a":"2) 먼지와 다른 물질의 조각들","ev":"2~3번 문장","s":[[2,"They are often pieces of dust and other material produced when coal and oil are burned.","그것들은 흔히 석탄과 기름이 태워질 때 발생되는 먼지와 다른 물질의 조각들이다."],[3,"They cause air pollution and increase the risk of many diseases.","그것들은 대기 오염을 야기하고 많은 질병의 위험을 증가시킨다."]],"w":"3번의 They는 바로 앞 2번 문장의 pieces of dust and other material(먼지와 다른 물질의 조각들)이에요. 석탄과 기름은 그것들이 태워지는 재료예요.","c":2},"h":"a600285f4f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, they also cause another problem—they make the earth darker.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 그것들은 다른 문제도 야기하는데, 그것들이 지구를 더 어둡게 만드는 것이다.","opts":["하지만 그것들은 지구를 더 밝게 만들어서 다른 문제를 해결한다.","하지만 그것들은 지구를 더 어둡게 만드는 또 다른 문제도 일으킨다.","하지만 그것들은 대기 오염 외에는 아무 문제도 일으키지 않는다.","하지만 그것들은 지구를 어둡게 만들어서 문제를 없애 준다."],"r":{"a":"2) 하지만 그것들은 지구를 더 어둡게 만드는 또 다른 문제도 일으킨다.","ev":"4번 문장","s":[[4,"However, they also cause another problem—they make the earth darker.","하지만, 그것들은 다른 문제도 야기하는데, 그것들이 지구를 더 어둡게 만드는 것이다."]],"w":"another problem은 '또 다른 문제'이고, they make the earth darker는 '그것들이 지구를 더 어둡게 만든다'는 뜻이에요.","c":2},"h":"70c5317e8a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["지구 흐리기 현상은 지구가 햇빛을 더 많이 받는다는 뜻이다.","공기 중의 먼지는 지구를 더 밝게 만든다.","지구 흐리기 현상은 지구의 날씨에 변화를 일으킬 수도 있다.","지구 흐리기 현상은 지구의 날씨를 절대 바꾸지 않는다."],"opts":["Global dimming means the earth is getting more sunlight.","Dust in the air makes the earth brighter.","Global dimming can also cause changes in the earth's weather.","Global dimming never changes the earth's weather."],"r":{"a":"3) Global dimming can also cause changes in the earth's weather. (지구 흐리기 현상은 지구의 날씨에 변화를 일으킬 수도 있다.)","ev":"11번 문장","s":[[11,"It can also cause changes in the earth’s weather.","그것은 또한 지구의 날씨에 변화를 야기할 수도 있다."]],"w":"11번에서 It can also cause changes in the earth’s weather.라고 해요. 날씨를 절대 바꾸지 않는다는 보기는 반대 내용이에요.","c":3},"h":"70a59154c8"},{"n":9,"t":"sum","q":"The earth receives (A) sunlight than 50 years ago because tiny objects in the air (B) solar radiation back into space.","ko":"지구는 공기 중의 작은 물체들이 태양 복사열을 다시 우주로 (B)하기 때문에 50년 전보다 (A) 햇빛을 받는다.","oko":["(A) 더 많은 / (B) 반사","(A) 더 적은 / (B) 생산","(A) 더 많은 / (B) 차단","(A) 더 적은 / (B) 중단","(A) 더 적은 / (B) 반사"],"opts":["(A) more / (B) reflect","(A) less / (B) produce","(A) more / (B) block","(A) less / (B) stop","(A) less / (B) reflect"],"r":{"a":"5) (A) less / (B) reflect (더 적은 / 반사)","ev":"6~7번 문장","s":[[6,"Studies have shown that the earth currently receives less sunlight than it did 50 years ago.","연구들은 지구가 현재 그것이 50년 전에 받았던 것보다 더 적은 햇빛을 받는다는 것을 보여 왔다."],[7,"This is because these tiny objects in the air absorb some of the sun’s energy and reflect solar radiation back into space.","이는 공기 중 이 아주 작은 물체들이 태양 에너지의 일부를 흡수하고 태양 복사열을 다시 우주로 반사하기 때문이다."]],"w":"6번에서 지구는 50년 전보다 더 적은(less) 햇빛을 받고, 7번에서 그 이유는 작은 물체들이 태양 복사열을 우주로 반사하기(reflect) 때문이에요.","c":5},"h":"690e8705c1"},{"n":10,"t":"fill","q":"Since all living things need sunlight to [A], global dimming can have serious [B].","ko":"모든 생명체는 [A] 위해 햇빛을 필요로 하기 때문에, 지구 흐리기 현상은 심각한 [B]을(를) 미칠 수 있다.","bank":["survive","effects","float","burn","pieces","coal"],"bko":{"survive":"살아남다","effects":"영향","float":"떠다니다","burn":"태우다","pieces":"조각들","coal":"석탄"},"r":{"a":"[A] survive (살아남다), [B] effects (영향)","ev":"10번 문장","s":[[10,"Since all living things need sunlight to survive, global dimming can have serious effects.","모든 생명체는 생존하기 위해 햇빛을 필요로 하기 때문에, 지구 흐리기 현상은 심각한 영향을 미칠 수 있다."]],"w":"10번 Since all living things need sunlight to survive, global dimming can have serious effects.에서 가져왔어요. 나머지 단어는 이 문장 빈칸에 의미가 맞지 않아요.","c":null},"h":"da00a09a41"}]},{"u":10,"id":"rj4-10-1","no":1,"ko":"유리를 알고 싶다","items":[{"n":1,"t":"tf","q":"Tour guides often say that glass is actually a type of liquid.","ko":"여행 가이드들은 흔히 유리가 사실은 액체의 한 종류라고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Tour guides often say that this happens because glass is actually a type of liquid that slowly flows downward over hundreds of years.","여행 가이드는 흔히 유리가 사실은 수백 년에 걸쳐 천천히 아래로 흐르는 액체의 한 종류이기 때문에 이런 일이 생긴다고 말한다."]],"w":"2번 문장에 Tour guides often say that ~ glass is actually a type of liquid라고 있어요. 가이드들이 그렇게 말한다는 내용과 같아요.","c":"T"},"h":"137f63925d"},{"n":2,"t":"tf","q":"When you heat gold, its molecules stay in a straight line.","ko":"금을 가열하면, 금의 분자들은 곧은 줄을 유지한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"If you heat gold, it becomes a liquid like water, and the molecules move around.","금을 가열하면, 그것은 물과 같은 액체가 되고 분자들은 여기저기 이동한다."]],"w":"6번 문장에서 금을 가열하면 물 같은 액체가 되고 분자들이 여기저기 이동한다(move around)고 해요. 곧은 줄을 유지한다는 말은 반대예요.","c":"F"},"h":"52a3b1c349"},{"n":3,"t":"tf","q":"Glass is not a liquid, but a special type of solid.","ko":"유리는 액체가 아니라 특별한 종류의 고체이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Glass is not a liquid, but a special type of solid.","유리는 액체가 아니라 특별한 종류의 고체이다."]],"w":"4번 문장에 Glass is not a liquid, but a special type of solid.가 그대로 있어요.","c":"T"},"h":"6eef7c2b0f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...its molecules still remain uneven.)","ko":"하지만, (액체 상태의) 유리가 식어서 고체가 될 때, 그것의 분자들은 여전히 계속 ( ).","opts":["질서 정연하다","고르지 않다","투명하다","매끄럽다"],"word":"uneven","r":{"a":"2) 고르지 않다","ev":"7번, 9번 문장","s":[[7,"When gold cools down, the molecules line up, and gold will become a perfectly straight solid again, much like ice.","금이 식으면, 분자들은 줄을 서고, 금은 마치 얼음처럼 다시 완전히 곧은 고체가 될 것이다."],[9,"However, when glass cools to become a solid, its molecules still remain uneven.","하지만, (액체 상태의) 유리가 식어서 고체가 될 때, 그것의 분자들은 여전히 계속 고르지 않다."]],"w":"7번에서 금은 식으면 분자가 줄을 서지만, 9번의 However 뒤에서 유리의 분자는 still remain uneven이에요. 금과 반대로 줄을 서지 않으니 '고르지 않은'이에요.","c":2},"h":"ab52854de2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...they can't move freely like a liquid's molecules.)","ko":"그것들은 액체의 분자들처럼 ( ) 이동할 수 없다.","opts":["느리게","조용히","빠르게","자유롭게"],"word":"freely","r":{"a":"4) 자유롭게","ev":"10번 문장","s":[[10,"Even though these molecules are uneven, they can’t move freely like a liquid’s molecules.","이 분자들이 고르지 않음에도 불구하고, 그것들은 액체의 분자들처럼 자유롭게 이동할 수 없다."]],"w":"10번은 유리의 분자가 고르지 않아도 액체의 분자들처럼은 움직이지 못한다는 내용이에요. can't move freely는 '자유롭게 이동할 수 없다'예요.","c":4},"h":"b2bd5cd59f"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIf you heat gold, it becomes a liquid like water, and the molecules move around.","ko":"밑줄 친 it이 가리키는 것은?","sko":"금을 가열하면, 그것은 물과 같은 액체가 되고 분자들은 여기저기 이동한다.","opts":["유리","철","금","물"],"r":{"a":"3) 금","ev":"5~6번 문장","s":[[5,"Normal solids, like gold, have very straight and ordered molecules.","금과 같은 일반적인 고체는 매우 곧고 질서 정연한 분자들을 가지고 있다."],[6,"If you heat gold, it becomes a liquid like water, and the molecules move around.","금을 가열하면, 그것은 물과 같은 액체가 되고 분자들은 여기저기 이동한다."]],"w":"가열하는 대상은 gold(금)이고, it은 그 금을 가리켜요. 금이 물 같은 액체가 되는 거예요.","c":3},"h":"203a838658"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When glass is heated and becomes a liquid, its molecules also move around.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"유리가 가열되어 액체가 되면, 그것의 분자들 또한 여기저기 이동한다.","opts":["유리가 가열되어 액체가 되면, 분자들도 여기저기 이동한다.","유리가 가열되면, 분자들이 한 줄로 곧게 선다.","유리가 액체가 되면, 분자들은 전혀 움직이지 않는다.","유리가 식어서 고체가 되면, 분자들이 여기저기 이동한다."],"r":{"a":"1) 유리가 가열되어 액체가 되면, 분자들도 여기저기 이동한다.","ev":"8번 문장","s":[[8,"When glass is heated and becomes a liquid, its molecules also move around.","유리가 가열되어 액체가 되면, 그것의 분자들 또한 여기저기 이동한다."]],"w":"heated and becomes a liquid는 '가열되어 액체가 된다'는 뜻이고, move around는 '여기저기 이동한다'는 뜻이에요.","c":1},"h":"89e6ff9aa0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["유리는 수백 년에 걸쳐 천천히 아래로 흐르는 액체이다.","금은 가열해도 고체로 남아 있다.","유리가 고체가 된 뒤에는 분자들이 곧게 줄을 선다.","유리는 특별한 종류의 고체이다."],"opts":["Glass is a liquid that slowly flows downward over hundreds of years.","Gold stays solid even when it is heated.","The molecules of glass line up straight after it becomes a solid.","Glass is a special type of solid."],"r":{"a":"4) Glass is a special type of solid. (유리는 특별한 종류의 고체이다.)","ev":"2, 4, 6, 9번 문장","s":[[2,"Tour guides often say that this happens because glass is actually a type of liquid that slowly flows downward over hundreds of years.","여행 가이드는 흔히 유리가 사실은 수백 년에 걸쳐 천천히 아래로 흐르는 액체의 한 종류이기 때문에 이런 일이 생긴다고 말한다."],[4,"Glass is not a liquid, but a special type of solid.","유리는 액체가 아니라 특별한 종류의 고체이다."],[6,"If you heat gold, it becomes a liquid like water, and the molecules move around.","금을 가열하면, 그것은 물과 같은 액체가 되고 분자들은 여기저기 이동한다."],[9,"However, when glass cools to become a solid, its molecules still remain uneven.","하지만, (액체 상태의) 유리가 식어서 고체가 될 때, 그것의 분자들은 여전히 계속 고르지 않다."]],"w":"4번에서 유리는 액체가 아니라 특별한 종류의 고체라고 해요. 흐르는 액체라는 것은 가이드들의 말이고(2번), 금은 식으면 곧은 고체가 되며(7번), 유리 분자는 식어도 고르지 않아요(9번).","c":4},"h":"f210887504"},{"n":9,"t":"sum","q":"When gold (A), the molecules line up, and gold will become a straight solid again, much like (B).","ko":"금이 (A) 분자들은 줄을 서고, 금은 마치 (B)처럼 다시 곧은 고체가 될 것이다.","oko":["(A) 가열되면 / (B) 물","(A) 식으면 / (B) 물","(A) 가열되면 / (B) 얼음","(A) 가열되면 / (B) 유리","(A) 식으면 / (B) 얼음"],"opts":["(A) heats up / (B) water","(A) cools down / (B) water","(A) heats up / (B) ice","(A) heats up / (B) glass","(A) cools down / (B) ice"],"r":{"a":"5) (A) cools down / (B) ice (식으면 / 얼음)","ev":"7번 문장","s":[[7,"When gold cools down, the molecules line up, and gold will become a perfectly straight solid again, much like ice.","금이 식으면, 분자들은 줄을 서고, 금은 마치 얼음처럼 다시 완전히 곧은 고체가 될 것이다."]],"w":"7번에서 금이 식으면(cools down) 분자들이 줄을 서고, 금은 마치 얼음(ice)처럼 다시 곧은 고체가 된다고 해요.","c":5},"h":"d63266755a"},{"n":10,"t":"fill","q":"Old windows are thicker near the [A] because people had not yet learned how to make perfectly [B] glass.","ko":"오래된 창문이 [A] 근처가 더 두꺼운 것은 사람들이 완전히 [B] 유리를 만드는 방법을 아직 알지 못했었기 때문이다.","bank":["bottom","flat","gold","molecules","guides","windows"],"bko":{"bottom":"아래쪽","flat":"평평한","gold":"금","molecules":"분자들","guides":"가이드들","windows":"창문들"},"r":{"a":"[A] bottom, [B] flat","ev":"11~12번 문장","s":[[11,"So, why are old windows thicker near the bottom?","그렇다면 왜 오래된 창문은 아래쪽 근처가 더 두꺼울까?"],[12,"It’s simply because people had not yet learned how to make perfectly flat glass!","그것은 단지 사람들이 완전히 평평한 유리를 만드는 방법을 아직 알지 못했었기 때문이다!"]],"w":"11번 why are old windows thicker near the bottom?과 12번 how to make perfectly flat glass에서 가져왔어요. 나머지 단어는 이 문장 빈칸에 의미가 맞지 않아요.","c":null},"h":"e9785bdb2c"}]},{"u":10,"id":"rj4-10-2","no":2,"ko":"돌아라, 아이스 서클","items":[{"n":1,"t":"tf","q":"Ice circles can be as small as a CD.","ko":"아이스 서클은 CD만큼 작을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Ice circles, which are usually found in cold parts of North America and Europe, can be as small as a CD or as large as 17 meters across.","북아메리카와 유럽의 추운 지방에서 주로 발견되는 아이스 서클은, CD만큼 작거나 직경 17미터만큼 클 수 있다."]],"w":"3번 문장에 can be as small as a CD or as large as 17 meters across라고 있어요. CD만큼 작은 것도 있다는 내용과 같아요.","c":"T"},"h":"5698211695"},{"n":2,"t":"tf","q":"Ice circles have been found only in rivers where water flows.","ko":"아이스 서클은 물이 흐르는 강에서만 발견되어 왔다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Although people used to think that flowing water caused ice circles to spin, they also have been found in lakes where the water doesn’t move.","사람들은 흐르는 물이 아이스 서클을 회전하게 했다고 생각했었지만, 그것들은 물이 움직이지 않는 호수에서도 발견되어 왔다."]],"w":"4번 문장에서 아이스 서클은 물이 움직이지 않는 호수에서도 발견되어 왔다고 해요. 강에서만이라는 말은 틀려요.","c":"F"},"h":"c891e02889"},{"n":3,"t":"tf","q":"Cold water is generally heavier than warm water.","ko":"차가운 물은 일반적으로 따뜻한 물보다 더 무겁다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"First of all, cold water is generally heavier than warm water.","우선, 차가운 물은 일반적으로 따뜻한 물보다 더 무겁다."]],"w":"6번 문장에 First of all, cold water is generally heavier than warm water.라고 그대로 있어요.","c":"T"},"h":"d2f0ee4d34"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists figured out the real reason...)","ko":"과학자들이 아이스 서클이 회전하는 진짜 이유를 ( ).","opts":["숨겼다","잃어버렸다","알아냈다","따라 했다"],"word":"figured out","r":{"a":"3) 알아냈다","ev":"5~6번 문장","s":[[5,"Scientists figured out the real reason why ice circles spin.","과학자들이 아이스 서클이 회전하는 진짜 이유를 알아냈다."],[6,"First of all, cold water is generally heavier than warm water.","우선, 차가운 물은 일반적으로 따뜻한 물보다 더 무겁다."]],"w":"5번에서 과학자들이 진짜 이유를 figured out했고, 6번부터 그 이유가 설명돼요. 이유가 밝혀진 것이니 '알아냈다'예요.","c":3},"h":"6453637d41"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Think of water going down a drain.)","ko":"( )을 내려가는 물을 생각해 보라.","opts":["배수관","호수","얼음","회전목마"],"word":"drain","r":{"a":"1) 배수관","ev":"7~8번 문장","s":[[7,"Secondly, water spins as it sinks.","둘째로, 물은 가라앉을 때 회전한다."],[8,"Think of water going down a drain.","배수관을 내려가는 물을 생각해 보라."]],"w":"7번에서 물은 가라앉을 때 회전한다고 해요. 8번은 그 예로 물이 내려가는 곳이니 drain은 '배수관'이에요.","c":1},"h":"e91ac37123"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAs an ice circle slowly melts, it cools the water right under it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"아이스 서클이 천천히 녹으면서, 그것은 그 바로 아래에 있는 물을 차갑게 한다.","opts":["호수","그 아래의 물","따뜻한 물","아이스 서클"],"r":{"a":"4) 아이스 서클","ev":"9~10번 문장","s":[[9,"As an ice circle slowly melts, it cools the water right under it.","아이스 서클이 천천히 녹으면서, 그 바로 아래에 있는 물을 차갑게 한다."],[10,"This water sinks because it is heavier than the lake’s warmer water.","이 물은 호수의 더 따뜻한 물보다 더 무겁기 때문에 가라앉는다."]],"w":"물을 차갑게 만드는 것은 천천히 녹는 아이스 서클이에요. it은 바로 앞의 an ice circle을 가리켜요.","c":4},"h":"0a534189c3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Secondly, water spins as it sinks.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"둘째로, 물은 가라앉을 때 회전한다.","opts":["둘째로, 물은 회전하면서 위로 떠오른다.","둘째로, 물은 가라앉을 때 회전한다.","둘째로, 물은 회전하기 때문에 가라앉는다.","둘째로, 물은 가라앉으면 회전을 멈춘다."],"r":{"a":"2) 둘째로, 물은 가라앉을 때 회전한다.","ev":"7번 문장","s":[[7,"Secondly, water spins as it sinks.","둘째로, 물은 가라앉을 때 회전한다."]],"w":"as it sinks는 '가라앉을 때, 가라앉으면서'예요. 물이 가라앉는 동안 회전한다는 뜻이고 배수관의 물(8번)이 그 예예요.","c":2},"h":"f5800af716"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아이스 서클은 북아메리카에서만 발견된다.","따뜻한 물이 차가운 물보다 더 무겁다.","얼음으로 된 원이 차가운 강 가운데에서 천천히 회전한다.","아이스 서클은 물이 흐르는 강에서만 회전한다."],"opts":["Ice circles can only be found in North America.","Warm water is heavier than cold water.","A circle of ice slowly spins in the middle of a cold river.","Ice circles spin only in rivers where water flows."],"r":{"a":"3) A circle of ice slowly spins in the middle of a cold river. (얼음으로 된 원이 차가운 강 가운데에서 천천히 회전한다.)","ev":"1번 문장","s":[[1,"In the middle of a cold river, a circle of ice slowly spins like a merry-go-round.","차가운 강 가운데에 얼음으로 된 원이 회전목마처럼 천천히 회전한다."]],"w":"1번에서 차가운 강 가운데에서 얼음으로 된 원이 회전목마처럼 천천히 회전한다고 해요. 아이스 서클은 북아메리카에서만 발견되는 것이 아니고(3번), 차가운 물이 따뜻한 물보다 더 무거워요(6번).","c":3},"h":"7910a83023"},{"n":9,"t":"sum","q":"Although it looks (A), it is actually a (B) formation called an “ice circle.”","ko":"그것은 (A) 보이지만, 사실은 ‘아이스 서클’이라고 불리는 (B) 형성물이다.","oko":["(A) 단순하게 / (B) 인공","(A) 불가사의하게 / (B) 인공","(A) 단순하게 / (B) 자연","(A) 위험하게 / (B) 사람이 만든","(A) 불가사의하게 / (B) 자연"],"opts":["(A) simple / (B) artificial","(A) mysterious / (B) artificial","(A) simple / (B) natural","(A) dangerous / (B) man-made","(A) mysterious / (B) natural"],"r":{"a":"5) (A) mysterious / (B) natural (불가사의하게 / 자연)","ev":"2번 문장","s":[[2,"Although it looks mysterious, it is actually a natural formation called an “ice circle.”","그것은 불가사의하게 보이지만, 사실은 ‘아이스 서클’이라고 불리는 자연 형성물이다."]],"w":"2번에서 아이스 서클은 불가사의하게 보이지만(looks mysterious) 사실은 자연 형성물(natural formation)이라고 해요.","c":5},"h":"776bbe1049"},{"n":10,"t":"fill","q":"As it sinks, it spins, [A] the ice [B] it to spin too!","ko":"그것이 가라앉으면서 회전하고, 그 [B]의 얼음도 같이 회전하게 [A]!","bank":["causing","above","lake","warmer","parts","formation"],"bko":{"causing":"만들면서(cause의 -ing형)","above":"위에","lake":"호수","warmer":"더 따뜻한","parts":"부분들","formation":"형성물"},"r":{"a":"[A] causing (만들면서(cause의 -ing형)), [B] above (위에)","ev":"11번 문장","s":[[11,"As it sinks, it spins, causing the ice above it to spin too!","그것이 가라앉으면서 회전하고, 그 위의 얼음도 회전하게 한다!"]],"w":"11번 As it sinks, it spins, causing the ice above it to spin too에서 가져왔어요. causing A to B는 'A가 B하게 만들면서'이고, the ice above it은 '그 위의 얼음'이에요. 나머지 단어는 이 두 자리에 문법이나 의미가 맞지 않아요.","c":null},"h":"d8b05f19fa"}]},{"u":10,"id":"rj4-10-3","no":3,"ko":"음료수 캔 모양을 얘들이 결정했대","items":[{"n":1,"t":"tf","q":"One advantage of cylinder-shaped soda cans is that they are economical.","ko":"원기둥 모양의 탄산음료 캔이 가진 좋은 점 하나는 경제적이라는 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"One of them is that they are economical!","그것들 중 한 가지는 그것들이 경제적이라는 것이다!"]],"w":"6번 문장에 One of them is that they are economical!이라고 있어요. 이점 중 하나가 경제적이라는 내용과 같아요.","c":"T"},"h":"711dece979"},{"n":2,"t":"tf","q":"A sphere is the shape with the highest surface area compared to its volume.","ko":"구는 부피에 비해 표면적이 가장 큰 모양이다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"The sphere is the shape with the lowest surface area compared to its volume.","구(球)가 그것의 부피에 비해 가장 작은 표면적을 가진 모양이다."]],"w":"10번 문장에서 구(sphere)는 부피에 비해 표면적이 가장 낮은(lowest) 모양이라고 해요. 가장 크다는 말은 반대예요.","c":"F"},"h":"a20b50b14f"},{"n":3,"t":"tf","q":"Sphere-shaped soda cans would roll away when you put them down.","ko":"구 모양의 탄산음료 캔은 내려놓으면 굴러가 버릴 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"When you put them down, they would roll away.","당신이 그것들을 내려놓으면, 그것들은 굴러갈 것이다."]],"w":"12번 문장에 When you put them down, they would roll away.라고 있어요. 내려놓으면 굴러간다는 내용과 같아요.","c":"T"},"h":"69d4ac13e7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Actually, they have several advantages.)","ko":"실제로, 그것들은 몇몇 ( )들이 있다.","opts":["단점","이점","재료","크기"],"word":"advantages","r":{"a":"2) 이점","ev":"5~6번 문장","s":[[5,"Actually, they have several advantages.","실제로, 그것들은 몇몇 이점들이 있다."],[6,"One of them is that they are economical!","그것들 중 한 가지는 그것들이 경제적이라는 것이다!"]],"w":"5번에서 원기둥 캔이 several advantages를 가진다고 하고, 6번에서 그중 하나가 경제적이라는 좋은 점을 말해요. advantage는 '이점, 장점'이에요.","c":2},"h":"9fd607d971"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...how they help manufacturers save money.)","ko":"그것들이 ( )들이 돈을 아끼도록 돕는 방법을 우리는 수학으로 보여 줄 수 있다.","opts":["소비자","판매자","제조자","운송업자"],"word":"manufacturers","r":{"a":"3) 제조자","ev":"7번, 9번 문장","s":[[7,"We can use math to show how they help manufacturers save money.","그것들이 제조자들이 돈을 아끼도록 돕는 방법을 보여주기 위해 우리는 수학을 이용할 수 있다."],[9,"So, for the manufacturers, the best shape would be one with the lowest surface area and the highest volume.","그래서, 제조자들에게, 최상의 모양은 가장 작은 표면적과 가장 큰 부피를 가진 것일 것이다."]],"w":"7번에서 캔의 모양으로 돈을 아끼는 쪽은 캔을 만드는 사람이에요. 9번에서도 for the manufacturers 가장 좋은 모양이 재료는 적고 담는 양은 많은 모양이라고 해요. manufacturer는 '제조자'예요.","c":3},"h":"bf70ae8ba8"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen you put them down, they would roll away.","ko":"밑줄 친 them이 가리키는 것은?","sko":"당신이 그것들을 내려놓으면, 그것들은 굴러갈 것이다.","opts":["구 모양의 탄산음료 캔들","원기둥 모양의 캔들","슈퍼마켓의 손님들","탁자 위의 병들"],"r":{"a":"1) 구 모양의 탄산음료 캔들","ev":"11~12번 문장","s":[[11,"But imagine sphere-shaped soda cans!","하지만 구 모양의 탄산음료 캔들을 상상해 봐라!"],[12,"When you put them down, they would roll away.","당신이 그것들을 내려놓으면, 그것들은 굴러갈 것이다."]],"w":"12번의 them은 바로 앞 11번 문장에서 상상해 보라고 한 sphere-shaped soda cans(구 모양의 탄산음료 캔들)예요. 구 모양이라서 굴러가요.","c":1},"h":"ec88de0764"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Is it because cylinders look good?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"원기둥이 좋아 보이기 때문일까?","opts":["원기둥이 좋아 보이기 때문일까?","원기둥이 만들기 쉽기 때문일까?","원기둥이 값이 싸기 때문일까?","원기둥이 튼튼하기 때문일까?"],"r":{"a":"1) 원기둥이 좋아 보이기 때문일까?","ev":"3번 문장","s":[[3,"Is it because cylinders look good?","원기둥이 좋아 보이기 때문일까?"]],"w":"Is it because cylinders look good?은 '원기둥이 좋아 보이기 때문일까?'라는 뜻이에요. look good은 '좋아 보이다'예요.","c":1},"h":"596971e698"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["슈퍼마켓의 탄산음료 캔들은 모양이 매우 다양하다.","슈퍼마켓의 모든 탄산음료 캔은 원기둥 모양이다.","구 모양의 캔은 탁자 위에 내려놓기 쉬울 것이다.","구 모양의 탄산음료 캔이 슈퍼마켓에서 팔린다."],"opts":["Soda cans in the supermarket have many different shapes.","All of the soda cans in the supermarket are shaped like cylinders.","Sphere-shaped cans would be easy to put down on a table.","Sphere-shaped soda cans are sold in the supermarket."],"r":{"a":"2) All of the soda cans in the supermarket are shaped like cylinders. (슈퍼마켓의 모든 탄산음료 캔은 원기둥 모양이다.)","ev":"1번 문장","s":[[1,"Have you ever noticed that all of the soda cans in the supermarket are shaped like cylinders?","당신은 슈퍼마켓의 모든 탄산음료 캔들이 원기둥과 같은 모양으로 만들어진 것을 알아차린 적이 있는가?"]],"w":"1번에서 슈퍼마켓의 모든 탄산음료 캔은 원기둥 모양이라고 해요(all of the soda cans ... are shaped like cylinders). 구 모양 캔은 내려놓으면 굴러가 버릴 거예요(12번).","c":2},"h":"e7ab5952c2"},{"n":9,"t":"sum","q":"The amount of (A) a shape requires is called its “surface area,” and the amount of soda it can (B) is called its “volume.”","ko":"한 모양이 필요로 하는 (A)의 양은 ‘표면적’이라고 불리고, 그것이 (B) 수 있는 탄산음료의 양은 ‘부피’라고 불린다.","oko":["(A) 물 / (B) 담을","(A) 재료 / (B) 버릴","(A) 물 / (B) 버릴","(A) 페인트 / (B) 깨뜨릴","(A) 재료 / (B) 담을"],"opts":["(A) water / (B) hold","(A) material / (B) drop","(A) water / (B) drop","(A) paint / (B) break","(A) material / (B) hold"],"r":{"a":"5) (A) material / (B) hold (재료 / 담을)","ev":"8번 문장","s":[[8,"The amount of material a shape requires is called its “surface area,” and the amount of soda it can hold is called its “volume.”","한 모양이 필요로 하는 재료의 양은 그것의 ‘표면적’이라고 불리고, 그것이 담을 수 있는 탄산음료의 양은 그것의 ‘부피’라고 불린다."]],"w":"8번에서 한 모양이 필요로 하는 재료(material)의 양은 표면적이라고 불리고, 그것이 담을(hold) 수 있는 탄산음료의 양은 부피라고 불려요.","c":5},"h":"55e274220b"},{"n":10,"t":"fill","q":"The cylinder requires a little more [A] than a sphere but stays [B].","ko":"원기둥은 구보다 [A]이(가) 조금 더 필요하지만 [B] 상태로 있다.","bank":["aluminum","still","roll","math","supermarket","shape"],"bko":{"aluminum":"알루미늄","still":"가만히 있는","roll":"구르다","math":"수학","supermarket":"슈퍼마켓","shape":"모양"},"r":{"a":"[A] aluminum (알루미늄), [B] still (가만히 있는)","ev":"13번 문장","s":[[13,"Thus, the cylinder, which requires a little more aluminum than a sphere but stays still, is used!","그래서, 구보다 조금 더 많은 알루미늄을 필요로 하지만 가만히 있는 원기둥이 사용된다!"]],"w":"13번 the cylinder, which requires a little more aluminum than a sphere but stays still에서 가져왔어요. 나머지 단어는 이 문장 빈칸에 문법과 의미가 맞지 않아요.","c":null},"h":"539ef3d68e"}]},{"u":10,"id":"rj4-10-4","no":4,"ko":"암호가 아니라 숫자야!","items":[{"n":1,"t":"tf","q":"XIX is not a word but the number 19.","ko":"XIX는 단어가 아니라 숫자 19이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It is not a word but the number 19.","그것은 단어가 아니라 숫자 19이다."]],"w":"2번 문장에 It is not a word but the number 19.라고 있어요. XIX는 단어가 아니라 숫자예요.","c":"T"},"h":"db8ca4bb20"},{"n":2,"t":"tf","q":"You need to know ten things to read Roman numerals.","ko":"로마 숫자를 읽으려면 열 가지를 알아야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Roman numerals may seem complicated, but you only need to know three things to read them!","로마 숫자는 복잡해 보일지도 모르지만, 당신은 그것들을 읽기 위해 세 가지만 알면 된다!"]],"w":"4번 문장에서 읽기 위해 알아야 할 것은 세 가지(three things)뿐이라고 해요. 열 가지라는 말은 틀려요.","c":"F"},"h":"b7c893dc71"},{"n":3,"t":"tf","q":"The numeral I can be repeated up to three times.","ko":"숫자 I는 세 번까지 반복될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Of these numerals, I, X, C, and M can be repeated up to three times, and you need to add them.","이 숫자들 중에, I와 X, C 그리고 M은 세 번까지 반복될 수 있고 당신은 그것들을 더해야 한다."]],"w":"6번 문장에서 I, X, C, M은 세 번까지 반복될 수 있다고 해요. I도 그중 하나예요.","c":"T"},"h":"7b6551cd6d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Roman numerals may seem complicated...)","ko":"로마 숫자는 ( ) 보일지도 모르지만, 당신은 그것들을 읽기 위해 세 가지만 알면 된다.","opts":["쉬워","짧아","복잡해","오래돼"],"word":"complicated","r":{"a":"3) 복잡해","ev":"4번 문장","s":[[4,"Roman numerals may seem complicated, but you only need to know three things to read them!","로마 숫자는 복잡해 보일지도 모르지만, 당신은 그것들을 읽기 위해 세 가지만 알면 된다!"]],"w":"4번에서 may seem complicated, but you only need to know three things라고 해요. but 뒤가 세 가지만 알면 된다는 쉬운 내용이니, complicated는 '복잡한'이에요.","c":3},"h":"afffec185b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then add the rest.)","ko":"그러고 나서 ( )를 더해라.","opts":["나머지","전부","처음","반대"],"word":"the rest","r":{"a":"1) 나머지","ev":"10~11번 문장","s":[[10,"If there are more than three numerals, find any numerals before larger ones and do the subtraction.","만약 세 개 이상의 숫자들이 있다면, 더 큰 것들 앞에 있는 어떤 숫자든지 찾아서 뺄셈을 해라."],[11,"Then add the rest.","그러고 나서 나머지를 더해라."]],"w":"10번에서 큰 숫자 앞의 숫자들로 뺄셈을 먼저 해요. Then(그러고 나서) the rest는 뺄셈에 쓰고 남은 것, 즉 '나머지'예요.","c":1},"h":"5d385f8d20"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIf a numeral comes before a larger one, subtract it from the larger one.","ko":"밑줄 친 it이 가리키는 것은?","sko":"만약 한 숫자가 더 큰 것 앞에 오면, 더 큰 것에서 그것을 빼라.","opts":["더 큰 숫자","로마 숫자의 역사","로마 숫자 전체의 목록","더 큰 숫자 앞에 오는 그 숫자"],"r":{"a":"4) 더 큰 숫자 앞에 오는 그 숫자","ev":"8번 문장","s":[[8,"If a numeral comes before a larger one, subtract it from the larger one.","만약 한 숫자가 더 큰 것 앞에 오면, 더 큰 것에서 그것을 빼라."]],"w":"빼야 하는 것은 더 큰 숫자 앞에 온 작은 숫자예요. subtract it from the larger one에서 it은 앞의 a numeral을 가리키고, larger one은 빼는 대상이 아니라 빼이는 숫자예요.","c":4},"h":"efcdcd628e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If there are more than three numerals, find any numerals before larger ones and do the subtraction.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 세 개 이상의 숫자들이 있다면, 더 큰 것들 앞에 있는 어떤 숫자든지 찾아서 뺄셈을 해라.","opts":["숫자가 세 개 이상이면, 더 큰 숫자 뒤에 있는 숫자들을 찾아 모두 더해라.","숫자가 세 개 이상이면, 더 큰 숫자 앞에 있는 숫자들을 찾아 뺄셈을 해라.","숫자가 세 개 미만이면, 더 큰 숫자 앞에 있는 숫자들을 찾아 뺄셈을 해라.","숫자가 세 개 이상이면, 가장 작은 숫자들을 찾아 곱해라."],"r":{"a":"2) 숫자가 세 개 이상이면, 더 큰 숫자 앞에 있는 숫자들을 찾아 뺄셈을 해라.","ev":"10번 문장","s":[[10,"If there are more than three numerals, find any numerals before larger ones and do the subtraction.","만약 세 개 이상의 숫자들이 있다면, 더 큰 것들 앞에 있는 어떤 숫자든지 찾아서 뺄셈을 해라."]],"w":"more than three는 '세 개 이상(세 개보다 많은)'이고, before larger ones는 '더 큰 것들 앞에'예요. 그 숫자들로 뺄셈(subtraction)을 하라는 뜻이에요.","c":2},"h":"33e04914fd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["로마 숫자는 세 개의 숫자만 사용한다.","I, X, C, M은 반복해서 쓸 수 없다.","한 숫자가 더 큰 숫자 뒤에 오면 그것들을 더한다.","로마 숫자에서 3은 IIV로 쓴다."],"opts":["Roman numerals use only three numerals.","I, X, C, and M cannot be repeated.","If a numeral comes after a larger one, you add them.","The number 3 is written IIV in Roman numerals."],"r":{"a":"3) If a numeral comes after a larger one, you add them.","ev":"5~7번, 9번 문장","s":[[5,"Learn the seven numerals: I=1, V=5, X=10, L=50, C=100, D=500, and M=1,000.","일곱 숫자들을 배워라: I=1, V=5, X=10, L=50, C=100, D=500 그리고 M=1,000이다."],[6,"Of these numerals, I, X, C, and M can be repeated up to three times, and you need to add them.","이 숫자들 중에, I와 X, C 그리고 M은 세 번까지 반복될 수 있고 당신은 그것들을 더해야 한다."],[7,"If a numeral comes after a larger one, add them.","만약 한 숫자가 더 큰 것 뒤에 오면, 그것들을 더해라."],[9,"However, you can subtract only one number from another, so 3 is III, not IIV.","그러나, 당신은 또 다른 수로부터 오직 한 개의 수를 뺄 수 있으므로, 3은 III이지 IIV가 아니다."]],"w":"7번에서 더 큰 숫자 뒤에 오면 더하라고 해요. 숫자는 일곱 개이고(5번), I, X, C, M은 세 번까지 반복할 수 있으며(6번), 3은 III이지 IIV가 아니에요(9번).","c":3},"h":"f01392670b"},{"n":9,"t":"sum","q":"Roman numerals have (A) basic numerals, and the largest one, M, is (B).","ko":"로마 숫자에는 (A) 개의 기본 숫자가 있고, 가장 큰 숫자인 M은 (B)이다.","oko":["(A) 세 / (B) 1,000","(A) 일곱 / (B) 100","(A) 세 / (B) 100","(A) 열 / (B) 500","(A) 일곱 / (B) 1,000"],"opts":["(A) three / (B) 1,000","(A) seven / (B) 100","(A) three / (B) 100","(A) ten / (B) 500","(A) seven / (B) 1,000"],"r":{"a":"5) (A) seven / (B) 1,000","ev":"5번 문장","s":[[5,"Learn the seven numerals: I=1, V=5, X=10, L=50, C=100, D=500, and M=1,000.","일곱 숫자들을 배워라: I=1, V=5, X=10, L=50, C=100, D=500 그리고 M=1,000이다."]],"w":"5번에서 일곱(seven) 숫자를 배우고, M=1,000이라고 해요. 세 가지(three)는 4번에서 알아야 할 규칙의 수이지 숫자의 수가 아니에요.","c":5},"h":"6789c9d5c4"},{"n":10,"t":"fill","q":"It [A] different [B] it is a Roman numeral.","ko":"그것은 로마 숫자이기 [B] 다르게 [A].","bank":["looks","because","add","times","word","number"],"bko":{"looks":"보인다","because":"때문에","add":"더하다","times":"번, 배","word":"단어","number":"수"},"r":{"a":"[A] looks (보인다), [B] because (때문에)","ev":"3번 문장","s":[[3,"It looks different because it is a Roman numeral.","그것은 로마 숫자이기 때문에 다르게 보인다."]],"w":"3번 It looks different because it is a Roman numeral에서 가져왔어요. looks different는 '다르게 보인다', because it is ...는 '~이기 때문에'예요. 나머지 단어는 이 두 자리에 문법이나 의미가 맞지 않아요.","c":null},"h":"9d145076fe"}]}];
