op expert in [[the medical field]].","그는 [[의료 분야]] 최고의 전문가이다.","field (명) (연구) 분야"],["Cows were eating grass in [[a green field]].","소들이 [[푸른 들판]]에서 풀을 먹고 있었다.","field (명) 들판, 벌판"]]}]},{"day":53,"q":[{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"important","a":"2","e":"important (형) 중요한 - importance (명) 중요성\n② dark (형) 어두운 - darkness (명) 어둠","w":"① agree (동) 동의하다 - agreement (명) 합의, 동의\n③ arrive (동) 도착하다 - arrival (명) 도착\n④ disturb (동) 방해하다 - disturbance (명) 방해, 소란","m":0,"s":"important - importance","c":["agree - agreement","dark - darkness","arrive - arrival","disturb - disturbance"],"mn":"중요한","hk":"important(중요한)-importance(중요성)는 형용사에서 명사로 가는 관계. dark(어두운)-darkness(어둠)가 같은 방향, agree(동의하다) 등은 동사 출발이라 오답.","ex":[["It is [[an important rule]] at school.","그것은 학교의 [[중요한 규칙]]이다.","important (형) 중요한"],["Doctors stress [[the importance of sleep]].","의사들은 [[수면의 중요성]]을 강조한다.","importance (명) 중요성"],["The room was [[dark and cold]].","그 방은 [[어둡고 추웠다]].","dark (형) 어두운"],["She was afraid of [[the darkness]].","그녀는 [[어둠]]을 무서워했다.","darkness (명) 어둠"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"legal","a":"1","e":"① illegal: 불법의, 위법의 (그 회사는 자사의 모든 회계 관행이 전적으로 합법적이라고 주장했다.) / legal(합법의, 법에 맞는)의 반의어.","w":"② lawful: 합법적인(유의어 함정)\n③ rightful: 정당한 권리가 있는(유의어 함정)\n④ legitimate: 정당한, 적법한(유의어 함정)","k":"그 회사는 자사의 모든 회계 관행이 전적으로 합법적이라고 주장했다.","m":0,"s":"The company argued that all of its accounting practices were entirely legal.","h":"legal","c":["illegal","lawful","rightful","legitimate"],"mn":"합법의, 법에 맞는","hk":"legal(합법의)에 접두사 il(부정)이 붙으면 illegal(불법의). lawful(합법적인)·rightful(정당한)·legitimate(적법한)은 오히려 같은 편이라 속임수.","ex":[["The company's plan is [[perfectly legal]].","그 회사의 계획은 [[완전히 합법적이다]].","legal (형) 합법의, 법에 맞는"],["It is [[legal to park]] here after six.","여섯 시 이후에는 여기에 [[주차하는 것이 합법]]이다.","legal (형) 합법의, 법에 맞는"],["[[Illegal parking]] can cost you a lot.","[[불법 주차]]는 큰 비용을 치르게 할 수 있다.","illegal (형) 불법의, 위법의"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"drill","a":"drill","e":"drill (동) 구멍을 뚫다 / (명) 반복 훈련, 연습","k":"인부들은 물에 도달하기 전에 몇 미터에 이르는 단단한 암석을 뚫어야 했다.\n코치는 아무도 실수하지 않을 때까지 선수들에게 같은 수비 훈련을 반복시켰다.","m":0,"s":"The workers had to d______ through several meters of solid rock before they reached the water.\nThe coach made the players repeat the same defensive d______ until nobody made a mistake.","mn":"구멍을 뚫다 / 반복 훈련, 연습","hk":"drill(구멍을 뚫다, 반복 훈련)은 동사로 구멍 뚫기, 명사로 훈련. drill a hole(구멍을 뚫다)과 fire drill(소방 대피 훈련)으로 묶기.","ex":[["They will [[drill a hole]] in the wall.","그들은 벽에 [[구멍을 뚫을]] 것이다.","drill (동) 구멍을 뚫다"],["Workers [[drilled a well]] in the village.","인부들은 마을에 [[우물을 뚫었다]].","drill (동) 구멍을 뚫다"],["The students did [[a fire drill]] on Monday.","학생들은 월요일에 [[소방 대피 훈련]]을 했다.","drill (명) 반복 훈련, 연습"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"crush","a":"4","e":"④ crush: (어떤 것을 아주 세게 누르다 / 그것이 부서지거나 모양을 잃을 정도로) 으깨다, 짓누르다","w":"① grind: 갈다, 빻다\n② shatter: 산산조각 내다\n③ crack: 금이 가게 하다","k":"어떤 것을 아주 세게 누르다 / 그것이 부서지거나 모양을 잃을 정도로","m":0,"s":"\"to press something so hard that it is broken or loses its shape\"","c":["grind","shatter","crack","crush"],"mn":"으깨다, 짓누르다","hk":"crush(으깨다)는 세게 눌러 부수거나 모양을 망가뜨림. grind(갈다)는 문질러 가루로, shatter(산산조각 내다)는 깨뜨리고, crack(금이 가게 하다)은 금만 가서 오답.","ex":[["She [[crushed the garlic]] with a knife.","그녀는 칼로 [[마늘을 으깼다]]."],["The heavy rock [[crushed the box]].","무거운 바위가 [[상자를 짓눌렀다]]."],["Please [[crush the cans]] before recycling them.","재활용하기 전에 [[캔을 찌그러뜨려]] 주세요."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"intention","a":"1","e":"① intention: 의도, 의향","w":"② reminder: 상기시켜 주는 것, 알림\n③ description: 묘사, 설명\n④ warning: 경고, 주의","m":0,"s":"\"의도, 의향\"","c":["intention","reminder","description","warning"],"mn":"의도, 의향","hk":"intention(의도)은 마음속에 둔 목적, have no intention of(~할 생각이 없다)가 대표 표현. reminder(알림)·warning(경고)은 의도와 무관.","ex":[["I have [[no intention of quitting]].","나는 [[그만둘 생각이 전혀 없다]]."],["It was never [[my intention to hurt]] you.","너를 [[다치게 할 의도]]는 전혀 내게 없었다."],["She came with [[good intentions]].","그녀는 [[좋은 의도]]를 가지고 왔다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"glance","a":"glance","e":"glance 흘낏 봄, 힐끗 보기","k":"그녀는 시계를 흘낏 보고는 서둘러 회의실을 나갔다.","m":0,"s":"She took a quick g______ at her watch and hurried out of the meeting room.","mn":"흘낏 봄, 힐끗 보기","hk":"glance(흘낏 봄)는 끝을 ce(철자)로 마무리. take a glance(흘낏 보다)와 at a glance(한눈에)가 대표 짝.","ex":[["He [[took a glance]] at the clock.","그는 시계를 [[흘낏 보았다]]."],["I knew the answer [[at a glance]].","나는 [[한눈에]] 답을 알았다."],["She gave him [[a quick glance]] and smiled.","그녀는 그에게 [[재빠른 눈길]]을 주고 미소 지었다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"inflate","a":"1","e":"① inflate: (어떤 것을 공기나 기체로 채우다 / 그것이 더 커지도록) 부풀리다, 공기를 넣다","w":"② bulge: 불룩해지다\n③ deflate: 공기를 빼다, 바람이 빠지다\n④ mingle: 섞이다, 어울리다","k":"어떤 것을 공기나 기체로 채우다 / 그것이 더 커지도록","m":0,"s":"\"to fill something with air or gas so that it becomes larger\"","c":["inflate","bulge","deflate","mingle"],"mn":"부풀리다, 공기를 넣다","hk":"inflate(부풀리다)는 in(안으로) 공기를 불어넣어 키운다는 뜻. 반대편 deflate(공기를 빼다)와 구분하기. bulge(불룩해지다)·mingle(섞이다)는 오답.","ex":[["He [[inflated the balloon]] with a pump.","그는 펌프로 [[풍선을 부풀렸다]]."],["Please [[inflate the tires]] before the trip.","여행 전에 [[타이어에 공기를 넣어]] 주세요."],["The life jacket will [[inflate automatically]].","구명조끼는 [[자동으로 부풀어 오른다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"aroma","a":"2,4","e":"② scent: 향기, 냄새\n④ fragrance: 향기, 향 (갓 구운 빵의 진한 향이 그 작은 빵집을 가득 채웠다.) / aroma(향, 향기)의 유의어.","w":"① stench: 악취\n③ noise: 소음","k":"갓 구운 빵의 진한 향이 그 작은 빵집을 가득 채웠다.","m":2,"s":"The rich aroma of freshly baked bread filled the little bakery.","h":"aroma","c":["stench","scent","noise","fragrance"],"mn":"향, 향기","hk":"aroma(향)의 같은 편은 scent(향기)·fragrance(향). stench(악취)는 같은 냄새라도 나쁜 쪽이고 noise(소음)는 소리라 오답.","ex":[["[[The aroma of coffee]] woke me up.","[[커피 향]]이 나를 깨웠다."],["The soup has [[a rich aroma]].","그 수프는 [[진한 향]]이 난다."],["[[A sweet aroma]] came from the kitchen.","부엌에서 [[달콤한 향]]이 흘러나왔다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"seldom","a":"3,4","e":"③ often: 자주, 흔히\n④ frequently: 자주, 빈번하게 (그는 가장 친한 친구들에게조차 자신의 어린 시절에 대해 좀처럼 이야기하지 않는다.) / seldom(좀처럼 ~하지 않는, 드물게)의 반의어.","w":"① rarely: 드물게, 좀처럼 ~하지 않는(유의어 함정)\n② occasionally: 가끔, 이따금(유의어 함정)","k":"그는 가장 친한 친구들에게조차 자신의 어린 시절에 대해 좀처럼 이야기하지 않는다.","m":2,"s":"He seldom speaks about his childhood, even to his closest friends.","h":"seldom","c":["rarely","occasionally","often","frequently"],"mn":"좀처럼 ~하지 않는, 드물게","hk":"seldom(좀처럼 ~하지 않는)의 반대편은 often(자주)·frequently(자주). rarely(좀처럼 ~하지 않는)와 occasionally(가끔)는 빈도가 낮은 같은 편이라 속임수.","ex":[["She [[seldom eats meat]].","그녀는 [[고기를 좀처럼 먹지 않는다]].","seldom (부) 좀처럼 ~하지 않는, 드물게"],["We [[often visit]] our grandparents.","우리는 조부모님을 [[자주 방문한다]].","often (부) 자주, 흔히"],["Buses here [[run frequently]] during rush hour.","이곳 버스는 출퇴근 시간에 [[자주 다닌다]].","frequently (부) 자주, 빈번하게"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"murder","a":"2","e":"② slay: 죽이다, 살해하다 (그 두 남자는 부유한 지주를 살해하려고 모의한 혐의로 기소되었다.) / murder(살해하다)의 유의어.","w":"① abuse: 학대하다, 남용하다\n③ bully: 괴롭히다\n④ betray: 배신하다","k":"그 두 남자는 부유한 지주를 살해하려고 모의한 혐의로 기소되었다.","m":0,"s":"The two men were accused of plotting to murder the wealthy landowner.","h":"murder","c":["abuse","slay","bully","betray"],"mn":"살해하다","hk":"murder(살해하다)의 같은 편은 slay(죽이다). abuse(학대하다)·bully(괴롭히다)·betray(배신하다)는 해치긴 해도 목숨을 빼앗는 뜻은 아니라 오답.","ex":[["He was accused of [[murdering his neighbor]].","그는 [[이웃을 살해한]] 혐의로 기소되었다."],["The villain planned to [[murder the king]].","악당은 [[왕을 살해하려고]] 계획했다."],["In the story, the thief [[murders a guard]].","이야기 속에서 도둑은 [[경비원을 살해한다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"shrug","a":"shrug","e":"shrug (어깨를) 으쓱하다","k":"선생님이 누가 창문을 깼는지 물었을 때 그는 어깨를 으쓱할 수밖에 없었다.","m":0,"s":"He could only s______ his shoulders when the teacher asked who had broken the window.","mn":"(어깨를) 으쓱하다","hk":"shrug((어깨를) 으쓱하다)는 sh(철자)로 시작하고 끝에 g(철자)를 꼭 붙이기. shrug your shoulders(어깨를 으쓱하다)가 대표 짝.","ex":[["He [[shrugged his shoulders]] and said nothing.","그는 [[어깨를 으쓱하고]] 아무 말도 하지 않았다."],["She just [[shrugged it off]] and kept smiling.","그녀는 그냥 [[대수롭지 않게 넘기고]] 계속 웃었다."],["I asked him why, but he only [[gave a shrug]].","내가 이유를 물었지만 그는 [[어깨만 으쓱했다]]."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"sluggish","a":"2","e":"② sluggish: 느릿느릿한, 부진한","w":"① 활기찬, 원기 왕성한(energetic)\n③ 꾸준한, 한결같은(steady)\n④ 갑작스러운, 급작스러운(abrupt)","m":0,"s":"sluggish","c":["활기찬, 원기 왕성한","느릿느릿한, 부진한","꾸준한, 한결같은","갑작스러운, 급작스러운"],"mn":"느릿느릿한, 부진한","hk":"sluggish(느릿느릿한)는 움직임이나 경기가 굼뜬 상태, 반대편은 energetic(활기찬). steady(꾸준한)·abrupt(갑작스러운)는 오답.","ex":[["I felt [[sluggish after lunch]].","나는 [[점심 먹고 나서 몸이 굼떴다]]."],["The country has [[a sluggish economy]].","그 나라는 [[부진한 경제]]를 안고 있다."],["[[Sluggish traffic]] made us late.","[[느릿느릿한 교통 흐름]] 때문에 우리는 늦었다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"stumble","a":"2","e":"② stumble: 발이 걸려 비틀거리다 (그는 어둑한 복도에서 헐거운 돌에 걸려 비틀거렸고 계단에서 넘어질 뻔했다.)","w":"① limp: 절뚝거리다\n③ creep: 살금살금 움직이다\n④ crawl: 기어가다","k":"그는 어둑한 복도에서 헐거운 돌에 걸려 비틀거렸고 계단에서 넘어질 뻔했다.","m":0,"s":"He happened to ________ over a loose stone in the dim hallway and nearly fell down the stairs.","c":["limp","stumble","creep","crawl"],"mn":"발이 걸려 비틀거리다","hk":"stumble(발이 걸려 비틀거리다)은 stumble over(~에 걸려 비틀거리다)로 자주 씀. limp(절뚝거리다)는 다친 다리, creep(살금살금 움직이다)은 오답.","ex":[["She [[stumbled over a root]] and fell.","그녀는 [[나무뿌리에 걸려 비틀거리다]] 넘어졌다."],["I [[stumbled on the stairs]] in the dark.","나는 어둠 속에서 [[계단에서 비틀거렸다]]."],["The baby [[stumbled forward]] a few steps.","아기는 [[비틀거리며 앞으로]] 몇 걸음 걸었다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"soak","a":"4","e":"④ soak: 담그다, 흠뻑 적시다 (요리하기 전에 마른 콩을 찬물에 밤새 담가 두어야 한다.)","w":"① rinse: 헹구다\n② sprinkle: 뿌리다, 끼얹다\n③ pour: 붓다, 따르다","k":"요리하기 전에 마른 콩을 찬물에 밤새 담가 두어야 한다.","m":0,"s":"Before cooking, you should ________ the dried beans in cold water overnight.","c":["rinse","sprinkle","pour","soak"],"mn":"담그다, 흠뻑 적시다","hk":"soak(담그다)은 물에 오래 담가 푹 적심. soak in water(물에 담그다)가 대표 짝이고 rinse(헹구다)·sprinkle(뿌리다)·pour(붓다)는 오래 담근다는 뜻이 없어 오답.","ex":[["She [[soaked the beans]] in water overnight.","그녀는 밤새 물에 [[콩을 담가 두었다]]."],["He [[soaked his feet]] in warm water.","그는 따뜻한 물에 [[발을 담갔다]]."],["The rain [[soaked my shirt]] completely.","비가 [[내 셔츠를 흠뻑 적셨다]]."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"view","a":"1","e":"①견해, 관점 / ②경치, 전망 / ③경치, 전망 / ④경치, 전망 [①번만 의미가 다름]","k":"① 내 견해로는, 위원회가 너무 성급하게 잘못된 결정에 도달했다.\n② 관광객들이 그 경치를 사진에 담기 위해 절벽 가장자리에 모였다.\n③ 언덕 꼭대기에서 우리는 계곡의 멋진 경치를 즐겼다.\n④ 그 호텔 방은 밤에 항구의 멋진 경치를 제공한다.","m":0,"c":["In my view, the committee reached the wrong decision far too quickly.","Tourists gathered at the edge of the cliff to photograph the view.","From the top of the hill we enjoyed a spectacular view of the valley.","The hotel room offers a wonderful view of the harbor at night."],"hc":"view|view|view|view","mn":"경치, 전망 / 견해, 관점","hk":"view(경치, 전망)는 눈에 보이는 풍경이라는 뜻이 공통이고, 위원회 결정에 대한 view(견해, 관점)만 뜻이 다름. in my view(내 견해로는)는 의견을 말하는 표현.","ex":[["We enjoyed [[the view from the hill]].","우리는 [[언덕에서 보는 경치]]를 즐겼다.","view (명) 경치, 전망"],["The room has [[a view of the sea]].","그 방은 [[바다 전망]]이 있다.","view (명) 경치, 전망"],["[[In my view]], the plan is too risky.","[[내 견해로는]] 그 계획은 너무 위험하다.","view (명) 견해, 관점"]]}]},{"day":54,"q":[{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"yawn","a":"yawn","e":"yawn 하품하다","k":"학생들은 긴 오후 강의의 마지막 시간 동안 하품하기 시작했다.","m":0,"s":"The students started to y______ during the last hour of the long afternoon lecture.","mn":"하품하다","hk":"yawn(하품하다)은 y(철자)로 시작하고 가운데 aw(철자)를 지키기. 졸리거나 지루할 때 입을 크게 벌리는 동작.","ex":[["He [[yawned loudly]] in class.","그는 수업 시간에 [[크게 하품했다]]."],["I always [[yawn when I'm tired]].","나는 항상 [[피곤하면 하품한다]]."],["The dog [[stretched and yawned]].","개는 [[기지개를 켜고 하품했다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"twist","a":"twist","e":"※ turn(돌리다)은 수건을 짜는 동작에 쓰지 않는다. 비틀어 짜는 것은 twist.","k":"그녀는 물기를 다 짜내려고 젖은 수건을 세게 비틀어야 했다.","m":0,"s":"She had to t______ the wet towel hard to squeeze out all the water.","hk":"twist(비틀다)는 수건을 짜듯 양쪽을 반대로 꼬는 동작, turn(돌리다)은 한 방향으로 돌릴 뿐이라 짜는 동작에 쓰지 않음. 철자는 tw(철자)로 시작.","ex":[["She [[twisted the towel]] to squeeze out the water.","그녀는 물기를 빼려고 [[수건을 비틀어 짰다]]."],["He [[twisted his ankle]] while running.","그는 달리다가 [[발목을 삐었다]]."],["Please [[twist the cap]] off the bottle.","병에서 [[뚜껑을 비틀어]] 열어 주세요."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"trustworthy","a":"2","e":"② trustworthy: 믿을 만한, 신뢰할 수 있는","w":"① 겸손한, 소박한(modest)\n③ 관대한, 너그러운(generous)\n④ 의심스러운, 수상한(suspicious)","m":0,"s":"trustworthy","c":["겸손한, 소박한","믿을 만한, 신뢰할 수 있는","관대한, 너그러운","의심스러운, 수상한"],"mn":"믿을 만한, 신뢰할 수 있는","hk":"trustworthy(믿을 만한)는 trust(신뢰)+worthy(~할 가치가 있는)의 합성. 반대편은 suspicious(의심스러운), modest(겸손한)는 믿음과 다른 뜻.","ex":[["He is [[a trustworthy friend]].","그는 [[믿을 만한 친구]]이다."],["We need [[trustworthy information]].","우리는 [[신뢰할 수 있는 정보]]가 필요하다."],["She seems [[honest and trustworthy]].","그녀는 [[정직하고 믿음직해]] 보인다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"foreign","a":"4","e":"④ local: 현지의, 지역의 (그 여름 축제는 매년 수천 명의 외국인 방문객을 끌어들인다.) / foreign(외국의, 이국의)의 반의어.","w":"① imported: 수입된(유의어 함정)\n② alien: 외국의, 이질적인(유의어 함정)\n③ overseas: 해외의(유의어 함정)","k":"그 여름 축제는 매년 수천 명의 외국인 방문객을 끌어들인다.","m":0,"s":"The summer festival attracts thousands of foreign visitors every year.","h":"foreign","c":["imported","alien","overseas","local"],"mn":"외국의, 이국의","hk":"foreign(외국의)의 반대편은 local(현지의). imported(수입된)·alien(외국의)·overseas(해외의)는 모두 바깥쪽을 가리켜 같은 편, 속임수.","ex":[["She is learning [[a foreign language]].","그녀는 [[외국어]]를 배우고 있다.","foreign (형) 외국의, 이국의"],["Many [[foreign tourists]] visit Korea.","많은 [[외국인 관광객]]이 한국을 방문한다.","foreign (형) 외국의, 이국의"],["We ate at [[a local restaurant]] near the hotel.","우리는 호텔 근처 [[현지 식당]]에서 먹었다.","local (형) 현지의, 지역의"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"merge","a":"1,2","e":"① join: 합쳐지다, 합류하다 (그 두 강은 도시 바로 북쪽에서 합쳐져 함께 바다로 흘러간다.) / merge(합쳐지다, 하나로 병합되다)의 유의어.\n② combine: 결합하다, 합쳐지다","w":"③ attach: 붙이다, 첨부하다\n④ separate: 분리하다, 갈라지다","k":"그 두 강은 도시 바로 북쪽에서 합쳐져 함께 바다로 흘러간다.","m":2,"s":"The two rivers merge just north of the city and flow together to the sea.","h":"merge","c":["join","combine","attach","separate"],"mn":"합쳐지다, 하나로 병합되다","hk":"merge(합쳐지다)의 같은 편은 join(합류하다)·combine(결합하다). separate(분리하다)는 갈라지는 반대쪽이고 attach(붙이다)는 붙이는 동작이라 오답.","ex":[["Traffic from both lanes [[merges here]].","두 차선의 차량이 [[여기서 합쳐진다]]."],["The two companies will [[merge next year]].","두 회사는 [[내년에 합병할]] 것이다."],["Two small streams [[merge into a river]].","두 개의 작은 개울이 [[합쳐져 강이 된다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"decide","a":"2","e":"decide (동) 결정하다 - decisive (형) 결정적인, 단호한\n② respond (동) 반응하다, 응답하다 - responsive (형) 반응이 빠른, 호응하는","w":"① noise (명) 소음 - noisy (형) 시끄러운\n③ culture (명) 문화 - cultural (형) 문화의\n④ adventure (명) 모험 - adventurous (형) 모험심이 강한","m":0,"s":"decide - decisive","c":["noise - noisy","respond - responsive","culture - cultural","adventure - adventurous"],"mn":"결정하다","hk":"decide(결정하다)-decisive(결정적인)는 동사에서 형용사로 가는 관계. respond(반응하다)-responsive(반응이 빠른)가 같은 방향, noise(소음)는 명사 출발.","ex":[["They will [[decide the winner]] tomorrow.","그들은 내일 [[우승자를 결정할]] 것이다.","decide (동) 결정하다"],["The goal was [[a decisive moment]] in the game.","그 골은 경기의 [[결정적인 순간]]이었다.","decisive (형) 결정적인, 단호한"],["She did not [[respond to my email]].","그녀는 [[내 이메일에 답하지]] 않았다.","respond (동) 반응하다, 응답하다"],["The staff were [[responsive to complaints]].","직원들은 [[불만에 빠르게 호응했다]].","responsive (형) 반응이 빠른, 호응하는"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"weep","a":"4","e":"④ cry: 울다 (그녀는 할아버지에 관한 소식을 듣고 조용히 울기 시작했다.) / weep(울다, 눈물을 흘리다)의 유의어.","w":"① giggle: 킥킥 웃다\n② frown: 얼굴을 찌푸리다\n③ sneer: 비웃다","k":"그녀는 할아버지에 관한 소식을 듣고 조용히 울기 시작했다.","m":0,"s":"She began to weep quietly when she heard the news about her grandfather.","h":"weep","c":["giggle","frown","sneer","cry"],"mn":"울다, 눈물을 흘리다","hk":"weep(울다)의 같은 편은 cry(울다), 눈물을 흘리는 모습에 초점. giggle(킥킥 웃다)·frown(찌푸리다)·sneer(비웃다)는 울음과 무관한 표정이라 오답.","ex":[["She began to [[weep with joy]].","그녀는 [[기뻐서 울기]] 시작했다."],["He [[wept for his lost dog]].","그는 [[잃어버린 개를 생각하며 울었다]]."],["She [[wept bitter tears]] at the funeral.","그녀는 장례식에서 [[쓰라린 눈물을 흘렸다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"mutter","a":"4","e":"④ mutter: (낮고 불분명한 목소리로 말하다 / 특히 당신이 불평을 할 때) 중얼거리다, 투덜대다","w":"① shout: 외치다, 소리치다\n② whistle: 휘파람을 불다\n③ scream: 비명을 지르다","k":"낮고 불분명한 목소리로 말하다 / 특히 당신이 불평을 할 때","m":0,"s":"\"to speak in a low, unclear voice, especially when you are complaining\"","c":["shout","whistle","scream","mutter"],"mn":"중얼거리다, 투덜대다","hk":"mutter(중얼거리다)는 낮고 불분명한 목소리로 불평하듯 말함. shout(외치다)·scream(비명을 지르다)은 크게 지르는 소리, whistle(휘파람을 불다)은 말이 아니라 오답.","ex":[["He [[muttered an apology]] and left.","그는 [[사과를 중얼거리고]] 떠났다."],["She [[muttered to herself]] while she worked.","그녀는 일하면서 [[혼잣말로 중얼거렸다]]."],["The old man [[muttered under his breath]].","노인은 [[낮은 소리로 투덜거렸다]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"visible","a":"1,3","e":"① invisible: 보이지 않는\n③ hidden: 숨겨진, 감춰진 (덮개가 제거되자 엔진의 손상이 분명히 눈에 보였다.) / visible(눈에 보이는, 드러나 있는)의 반의어.","w":"② noticeable: 눈에 띄는(유의어 함정)\n④ observable: 관찰할 수 있는(유의어 함정)","k":"덮개가 제거되자 엔진의 손상이 분명히 눈에 보였다.","m":2,"s":"The damage to the engine was clearly visible once the cover had been removed.","h":"visible","c":["invisible","noticeable","hidden","observable"],"mn":"눈에 보이는, 드러나 있는","hk":"visible(눈에 보이는)의 반대편은 invisible(보이지 않는)·hidden(숨겨진). noticeable(눈에 띄는)·observable(관찰할 수 있는)은 보이는 쪽이라 같은 편.","ex":[["Stars are [[visible at night]].","별은 [[밤에 보인다]].","visible (형) 눈에 보이는, 드러나 있는"],["Germs are [[invisible to the eye]].","세균은 [[눈에 보이지 않는다]].","invisible (형) 보이지 않는"],["The key was [[hidden under a rock]].","열쇠는 [[돌 밑에 숨겨져]] 있었다.","hidden (형) 숨겨진, 감춰진"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"condense","a":"3","e":"③ condense: 응결되다, 응축시키다 (따뜻한 공기가 식으면서 수증기가 작은 물방울로 응결되기 시작한다.)","w":"① insulate: 단열하다, 차단하다\n② ventilate: 환기시키다\n④ dampen: 축축하게 하다","k":"따뜻한 공기가 식으면서 수증기가 작은 물방울로 응결되기 시작한다.","m":0,"s":"As the warm air cools, water vapor begins to ________ into tiny droplets.","c":["insulate","ventilate","condense","dampen"],"mn":"응결되다, 응축시키다","hk":"condense(응결되다)는 수증기가 식어 물방울이 되는 변화. water vapor condenses(수증기가 응결되다)가 대표 짝, insulate(단열하다)는 오답.","ex":[["Steam [[condenses on the window]].","김이 [[창문에 응결된다]]."],["Water vapor [[condenses into clouds]] high in the air.","수증기는 높은 공중에서 [[응결되어 구름이 된다]]."],["Cooling can [[condense gas into liquid]].","냉각은 [[기체를 액체로 응축시킬]] 수 있다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"stem","a":"stem","e":"stem (동) ~에서 비롯되다, 기인하다 / (명) 줄기","k":"그 회사의 현재 문제들 중 다수는 명확한 리더십의 부재에서 비롯된다.\n정원사는 장미를 꽃병에 꽂기 전에 긴 줄기를 다듬었다.","m":0,"s":"Many of the company's current problems s______ from a lack of clear leadership.\nThe gardener trimmed the long s______ of the rose before putting it in the vase.","mn":"~에서 비롯되다, 기인하다 / 줄기","hk":"stem(비롯되다, 줄기)은 동사로 ~에서 비롯되다, 명사로 줄기. stem from(~에서 비롯되다)과 rose stem(장미 줄기)을 한 단어로 묶기.","ex":[["Her fear of dogs [[stems from an accident]].","그녀의 개 공포는 [[사고에서 비롯된다]].","stem (동) ~에서 비롯되다, 기인하다"],["His anger [[stems from a lack of sleep]].","그의 화는 [[수면 부족에서 비롯된다]].","stem (동) ~에서 비롯되다, 기인하다"],["He cut the flower [[at the stem]].","그는 꽃을 [[줄기 부분에서]] 잘랐다.","stem (명) 줄기"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"sow","a":"3","e":"③ sow: (씨앗을 땅에 심다 / 그것들이 자라서 농작물이 되도록) (씨를) 뿌리다","w":"① reap: 수확하다, 거두다\n② plow: 쟁기질하다, 갈다\n④ graze: 풀을 뜯다, 방목하다","k":"씨앗을 땅에 심다 / 그것들이 자라서 농작물이 되도록","m":0,"s":"\"to plant seeds in the ground so that they will grow into crops\"","c":["reap","plow","sow","graze"],"mn":"(씨를) 뿌리다","hk":"sow((씨를) 뿌리다)는 씨앗을 땅에 심는 일, reap(수확하다)은 거두는 일. sow and reap(뿌리고 거두다)으로 짝지어 기억. plow(쟁기질하다)·graze(풀을 뜯다)는 오답.","ex":[["Farmers [[sow seeds in spring]].","농부들은 [[봄에 씨를 뿌린다]]."],["He [[sowed corn]] in the field.","그는 밭에 [[옥수수 씨를 뿌렸다]]."],["They [[sow wheat in autumn]] for next summer.","그들은 다음 여름을 위해 [[가을에 밀 씨를 뿌린다]]."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"philosophy","a":"1","e":"① philosophy: 철학","w":"② sociology: 사회학\n③ religion: 종교\n④ psychology: 심리학","m":0,"s":"\"철학\"","c":["philosophy","sociology","religion","psychology"],"mn":"철학","hk":"philosophy(철학)는 삶과 존재를 깊이 따지는 학문. sociology(사회학)는 사회, psychology(심리학)는 마음, religion(종교)은 믿음을 다뤄 오답.","ex":[["He studies [[Greek philosophy]].","그는 [[그리스 철학]]을 공부한다."],["My father likes to talk about [[the philosophy of life]].","아버지는 [[인생 철학]]에 대해 이야기하기를 좋아하신다."],["She wants to major in [[philosophy at university]].","그녀는 [[대학에서 철학]]을 전공하고 싶어 한다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"shove","a":"2","e":"② shove: 밀치다, 떠밀다 (그 성급한 남자는 붐비는 지하철 칸을 밀치며 헤쳐 나가려 했다.)","w":"① tug: 잡아당기다\n③ haul: 끌어당기다, 운반하다\n④ lean: 기대다, 기울다","k":"그 성급한 남자는 붐비는 지하철 칸을 밀치며 헤쳐 나가려 했다.","m":0,"s":"The impatient man tried to ________ his way through the crowded subway car.","c":["tug","shove","haul","lean"],"mn":"밀치다, 떠밀다","hk":"shove(밀치다)는 거칠게 확 밀어내는 동작, shove one's way through(헤치고 나아가다)가 붐비는 곳의 대표 짝. tug(잡아당기다)·haul(끌어당기다)은 당기는 쪽이라 오답.","ex":[["He [[shoved the door]] open.","그는 [[문을 밀쳐]] 열었다."],["The boy [[shoved his brother]] and ran away.","그 소년은 [[동생을 떠밀고]] 달아났다."],["She [[shoved her way through the crowd]] to the front.","그녀는 앞으로 가려고 [[사람들 틈을 밀치고 나아갔다]]."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"couple","a":"3","e":"①두어 개, 몇 / ②두어 개, 몇 / ③부부, 커플 / ④두어 개, 몇 [③번만 의미가 다름]","k":"① 나는 오늘 밤 저녁 식사를 위해 의자 두어 개가 더 필요하다.\n② 우리는 다음 마을로 이동하기 전에 그곳에 이틀 정도 머물렀다.\n③ 그 노부부는 오십 년 넘게 결혼 생활을 이어 오고 있다.\n④ 그녀는 보고서 전체를 두어 시간 만에 끝냈다.","m":0,"c":["I need a couple of extra chairs for tonight's dinner.","We remained there for a couple of days before moving on to the next town.","The elderly couple have been married for more than fifty years.","She finished the whole report in a couple of hours."],"hc":"couple|couple|couple|couple","mn":"두어 개, 몇 / 부부, 커플","hk":"couple(두어 개, 부부)은 a couple of(두어 개의)가 공통, couple(부부)만 뜻이 다름. a couple of days(이틀 정도)와 old couple(노부부)로 구분.","ex":[["I bought [[a couple of apples]].","나는 [[사과 두어 개]]를 샀다.","couple (명) 두어 개, 몇"],["We waited [[a couple of hours]] for the bus.","우리는 버스를 [[두어 시간]] 기다렸다.","couple (명) 두어 개, 몇"],["[[A young couple]] lives next door.","[[젊은 부부]]가 옆집에 산다.","couple (명) 부부, 커플"]]}]},{"day":55,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"yell","a":"1","e":"① shout: 외치다, 소리치다 (그는 군중의 소음을 뚫고 목소리가 들리게 하려고 소리를 질러야 했다.) / yell(소리 지르다, 고함치다)의 유의어.","w":"② listen: 귀를 기울여 듣다\n③ reply: 대답하다, 답장하다\n④ talk: 말하다, 이야기하다","k":"그는 군중의 소음을 뚫고 목소리가 들리게 하려고 소리를 질러야 했다.","m":0,"s":"He had to yell to be heard over the noise of the crowd.","h":"yell","c":["shout","listen","reply","talk"],"mn":"소리 지르다, 고함치다","hk":"yell(소리 지르다)의 같은 편은 shout(외치다), 시끄러운 곳에서 목소리를 키우는 동작. listen(듣다)·reply(대답하다)·talk(말하다)는 소리를 지른다는 뜻이 없어 오답.","ex":[["Don't [[yell at me]].","나에게 [[소리 지르지]] 마."],["The coach [[yelled instructions]] from the sideline.","코치는 사이드라인에서 [[지시를 외쳤다]]."],["The kids [[yelled for help]].","아이들은 [[도와 달라고 소리쳤다]]."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"foliage","a":"4","e":"④ foliage: 나뭇잎, 잎사귀","w":"① pollination: 수분(꽃가루받이)\n② flora: 식물군\n③ sapling: 묘목, 어린나무","m":0,"s":"foliage","c":["수분(꽃가루받이)","식물군","묘목, 어린나무","나뭇잎, 잎사귀"],"mn":"나뭇잎, 잎사귀","hk":"foliage(나뭇잎)는 나무의 잎 전체를 모아 부르는 말, autumn foliage(가을 단풍)로 자주 씀. pollination(수분)·flora(식물군)·sapling(묘목)은 잎이 아님.","ex":[["[[Thick foliage]] hid the small bird.","[[울창한 나뭇잎]]이 작은 새를 가렸다."],["Tourists come to see [[autumn foliage]].","관광객들은 [[가을 단풍]]을 보러 온다."],["The sun shone through [[the green foliage]].","햇빛이 [[푸른 나뭇잎]] 사이로 비쳤다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"novice","a":"2","e":"② novice: (일이나 활동에 새로 들어온 사람 / 그리고 아직 경험이 아주 적은) 초보자","w":"① practitioner: (의사·변호사 등) 전문직 종사자, 개업의\n③ mentor: 멘토, 스승\n④ pioneer: 개척자","k":"일이나 활동에 새로 들어온 사람 / 그리고 아직 경험이 아주 적은","m":0,"s":"\"a person who is new to a job or activity and still has very little experience\"","c":["practitioner","novice","mentor","pioneer"],"mn":"초보자","hk":"novice(초보자)는 일을 막 시작해 경험이 적은 사람. mentor(멘토)는 가르치는 선배로 반대편, practitioner(전문직 종사자)·pioneer(개척자)는 오답.","ex":[["He is [[a novice at cooking]].","그는 [[요리 초보자]]이다."],["[[A novice skier]] should start on easy slopes.","[[초보 스키어]]는 쉬운 경사면에서 시작해야 한다."],["Even [[a complete novice]] can learn this game.","[[완전한 초보자]]도 이 게임을 배울 수 있다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"empathy","a":"empathy","e":"empathy 공감","k":"좋은 상담사는 내담자가 무엇을 느끼는지 진정으로 이해하기 위해 깊은 공감 능력이 필요하다.","m":0,"s":"A good counselor needs deep e______ to truly understand what a client is feeling.","mn":"공감","hk":"empathy(공감)는 em(철자)으로 시작해 pathy(철자)로 끝남. 비슷한 sympathy(동정)와 구분하기: empathy(공감)는 남의 감정을 같이 느낌.","ex":[["She shows [[great empathy]] to patients.","그녀는 환자들에게 [[깊은 공감]]을 보인다."],["Reading stories can help us [[develop empathy]].","이야기를 읽는 것은 우리가 [[공감 능력을 키우도록]] 도와줄 수 있다."],["He felt [[empathy for the refugees]].","그는 [[난민들에게 공감]]을 느꼈다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"dim","a":"3","e":"③ bright: 밝은, 빛나는 (촛불 하나의 희미한 불빛은 작은 글자를 읽기 어렵게 만들었다.) / dim(어둑한, 흐릿한)의 반의어.","w":"① shadowy: 그늘진, 어둑한\n② faint: 희미한, 흐릿한\n④ murky: 어둑하고 탁한","k":"촛불 하나의 희미한 불빛은 작은 글자를 읽기 어렵게 만들었다.","m":0,"s":"The dim light of a single candle made it hard to read the small letters.","h":"dim","c":["shadowy","faint","bright","murky"],"mn":"어둑한, 흐릿한","hk":"dim(어둑한)의 반대편은 bright(밝은). shadowy(그늘진)·faint(희미한)·murky(어둑하고 탁한)는 어둡고 흐린 쪽이라 같은 편, 속임수.","ex":[["We sat in [[a dim room]].","우리는 [[어둑한 방]]에 앉아 있었다.","dim (형) 어둑한, 흐릿한"],["[[The dim light]] made my eyes tired.","[[희미한 불빛]] 때문에 눈이 피곤했다.","dim (형) 어둑한, 흐릿한"],["The room was filled with [[bright sunlight]].","방은 [[밝은 햇빛]]으로 가득했다.","bright (형) 밝은, 빛나는"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"clip","a":"3","e":"③ clip: 클립, 종이집게 (그녀는 핀 대신 작은 금속 클립으로 흩어진 종이들을 함께 고정했다.)\n※ clip은 종이에 구멍을 내지 않고 끼우는 집게.","w":"① knot: 매듭\n② tag: 꼬리표, 태그\n④ nail: 못","k":"그녀는 핀 대신 작은 금속 클립으로 흩어진 종이들을 함께 고정했다.","m":0,"s":"She held the loose papers together with a small metal ________ instead of a pin.","c":["knot","tag","clip","nail"],"mn":"클립, 종이집게","hk":"clip(클립)은 종이를 구멍 없이 끼우는 집게, paper clip(종이 클립)이 대표 짝. knot(매듭)·tag(꼬리표)·nail(못)은 오답.","ex":[["She used [[a paper clip]] to hold the pages.","그녀는 쪽들을 고정하려고 [[종이 클립]]을 사용했다."],["She fixed her hair with [[a hair clip]].","그녀는 [[머리 집게]]로 머리를 고정했다."],["He attached the receipt with [[a metal clip]].","그는 영수증을 [[금속 클립]]으로 끼워 두었다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"exert","a":"2","e":"exert (동) 발휘하다, 행사하다 - exertion (명) 노력, 분투\n② improvise (동) 즉흥적으로 하다 - improvisation (명) 즉흥 연주, 즉흥적으로 하기","w":"① reciprocal (형) 상호간의, 호혜적인 - reciprocity (명) 호혜성, 상호 이익\n③ contradictory (형) 모순되는, 상반되는 - contradiction (명) 모순\n④ related (형) 관련된 - relatedness (명) 연관성, 관련성","m":0,"s":"exert - exertion","c":["reciprocal - reciprocity","improvise - improvisation","contradictory - contradiction","related - relatedness"],"mn":"발휘하다, 행사하다","hk":"exert(발휘하다)-exertion(노력)은 동사에서 명사로 가는 관계. improvise(즉흥적으로 하다)-improvisation(즉흥 연주)도 같은 방향, 나머지는 형용사 출발.","ex":[["Players must [[exert all their strength]].","선수들은 [[모든 힘을 발휘해야]] 한다.","exert (동) 발휘하다, 행사하다"],["[[Physical exertion]] makes me hungry.","[[신체적 노력]]은 나를 배고프게 한다.","exertion (명) 노력, 분투"],["The band had to [[improvise a song]].","그 밴드는 [[즉흥적으로 노래를 만들어야]] 했다.","improvise (동) 즉흥적으로 하다"],["The pianist is famous for [[his jazz improvisation]].","그 피아니스트는 [[재즈 즉흥 연주]]로 유명하다.","improvisation (명) 즉흥 연주, 즉흥적으로 하기"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"grit","a":"2","e":"② willpower: 의지력 (그녀의 투지는 마침내 성공할 때까지 여러 해의 실패를 견디게 해 주었다.) / grit(투지, 끈기)의 유의어.","w":"① vitality: 활력, 생기\n③ composure: 침착함, 평정심\n④ morale: 사기","k":"그녀의 투지는 마침내 성공할 때까지 여러 해의 실패를 견디게 해 주었다.","m":0,"s":"Her grit carried her through years of failure until she finally succeeded.","h":"grit","c":["vitality","willpower","composure","morale"],"mn":"투지, 끈기","hk":"grit(투지)의 같은 편은 willpower(의지력), 힘든 일을 끝까지 버티는 끈기. vitality(활력)·composure(침착함)·morale(사기)은 오답.","ex":[["She showed [[great grit]] in the race.","그녀는 경주에서 [[대단한 투지]]를 보였다."],["It takes [[grit and determination]] to succeed.","성공하려면 [[투지와 결단력]]이 필요하다."],["The team won with [[pure grit]].","그 팀은 [[순전한 투지]]로 이겼다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"fire","a":"fire","e":"fire (명) 불, 화재 / (동) 해고하다","k":"조사관들은 그 낡은 창고를 파괴한 화재가 무엇 때문에 시작되었는지 아직 알아내려 하고 있다.\n그 회사는 공장이 문을 닫았을 때 수십 명의 노동자를 해고할 수밖에 없었다.","m":0,"s":"Investigators are still trying to find out what started the f______ that destroyed the old warehouse.\nThe company had no choice but to f______ dozens of workers when the factory shut down.","mn":"불, 화재 / 해고하다","hk":"fire(불, 해고하다)는 명사로 불·화재, 동사로 해고하다. start a fire(불을 내다)와 fire a worker(직원을 해고하다)를 한 단어로 묶기.","ex":[["A big [[fire broke out]] near the market.","시장 근처에서 큰 [[불이 났다]].","fire (명) 불, 화재"],["They sat around [[a warm fire]].","그들은 [[따뜻한 불]] 주위에 둘러앉았다.","fire (명) 불, 화재"],["The boss may [[fire him]] for being late.","사장은 지각 때문에 [[그를 해고할]] 수도 있다.","fire (동) 해고하다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"anecdote","a":"4","e":"④ anecdote: (짧고 흥미로운 이야기 / 실제 인물이나 실제 사건에 대한) 일화, 짧은 이야기","w":"① satire: 풍자\n② allegory: 우화, 비유(적 이야기)\n③ memoir: 회고록, 수기","k":"짧고 흥미로운 이야기 / 실제 인물이나 실제 사건에 대한","m":0,"s":"\"a short and interesting story about a real person or a real event\"","c":["satire","allegory","memoir","anecdote"],"mn":"일화, 짧은 이야기","hk":"anecdote(일화)는 실제 인물이나 사건을 다룬 짧고 재미있는 이야기. satire(풍자)·allegory(우화)는 지어낸 이야기 방식, memoir(회고록)는 긴 책이라 오답.","ex":[["He told [[a funny anecdote]] about his school days.","그는 학창 시절에 대한 [[재미있는 일화]]를 말했다."],["The book is full of [[personal anecdotes]].","그 책에는 [[개인적인 일화]]가 가득하다."],["She shared [[an anecdote about her grandmother]].","그녀는 [[할머니에 관한 일화]]를 들려주었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"irresponsible","a":"3,4","e":"③ conscientious: 양심적인, 성실한 (밤새 현관문을 잠그지 않고 둔 것은 그로서는 무책임한 일이었다.) / irresponsible(무책임한, 성의 없는)의 반의어.\n④ accountable: 책임이 있는","w":"① heedless: 아랑곳하지 않는, 부주의한\n② thoughtless: 생각이 없는, 경솔한","k":"밤새 현관문을 잠그지 않고 둔 것은 그로서는 무책임한 일이었다.","m":2,"s":"It was irresponsible of him to leave the front door unlocked all night.","h":"irresponsible","c":["heedless","thoughtless","conscientious","accountable"],"mn":"무책임한, 성의 없는","hk":"irresponsible(무책임한)의 반대편은 conscientious(성실한)·accountable(책임이 있는). heedless(부주의한)·thoughtless(경솔한)는 같은 쪽이라 속임수.","ex":[["Leaving a child alone is [[irresponsible behavior]].","아이를 혼자 두는 것은 [[무책임한 행동]]이다.","irresponsible (형) 무책임한, 성의 없는"],["She is [[a conscientious worker]].","그녀는 [[성실한 직원]]이다.","conscientious (형) 양심적인, 성실한"],["Leaders are [[accountable for their decisions]].","지도자는 [[자신의 결정에 책임이 있다]].","accountable (형) 책임이 있는"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"dexterity","a":"1","e":"① dexterity: 손재주, 솜씨","w":"② acuity: 예민함, 예리함\n③ mastery: 숙달, 통달\n④ ingenuity: 독창성, 창의력","m":0,"s":"\"손재주, 솜씨\"","c":["dexterity","acuity","mastery","ingenuity"],"mn":"손재주, 솜씨","hk":"dexterity(손재주)는 손을 능숙하게 놀리는 솜씨, manual dexterity(손재주)로 자주 씀. acuity(예민함)·mastery(숙달)는 오답.","ex":[["Playing the piano needs [[great dexterity]].","피아노 연주에는 [[뛰어난 손재주]]가 필요하다."],["The surgeon has [[manual dexterity]].","그 외과의사는 [[섬세한 손재주]]를 지녔다."],["He [[showed dexterity]] in tying the knot.","그는 매듭을 묶을 때 [[솜씨를 보여 주었다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"toothache","a":"toothache","e":"toothache 치통","k":"치과 의사는 그가 사탕을 너무 많이 먹은 후 생긴 심한 치통 때문에 그에게 약을 주었다.","m":0,"s":"The dentist gave him medicine for the terrible t______ he got after eating too much candy.","mn":"치통","hk":"toothache(치통)는 tooth(이)와 ache(아픔)를 띄어쓰기 없이 붙인 말, ache(아픔)의 ch(철자)가 철자 포인트.","ex":[["He has [[a terrible toothache]].","그는 [[심한 치통]]을 앓고 있다."],["Cold drinks can [[cause a toothache]].","차가운 음료는 [[치통을 일으킬]] 수 있다."],["She took medicine [[for her toothache]].","그녀는 [[치통 때문에]] 약을 먹었다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"pinpoint","a":"4","e":"④ pinpoint: 정확히 짚어내다, 정확히 찾아내다 (여러 검사를 한 뒤에도 의사들은 그녀의 두통의 정확한 원인을 짚어내지 못했다.)","w":"① advertise: 광고하다\n② possess: 소유하다, 지니다\n③ reduce: 줄이다, 할인하다","k":"여러 검사를 한 뒤에도 의사들은 그녀의 두통의 정확한 원인을 짚어내지 못했다.","m":0,"s":"Even after many tests, the doctors could not ________ the exact cause of her headaches.","c":["advertise","possess","reduce","pinpoint"],"mn":"정확히 짚어내다, 정확히 찾아내다","hk":"pinpoint(정확히 짚어내다)는 pin(핀)으로 콕 찍듯 정확한 위치·원인을 찾음. pinpoint the cause(원인을 짚어내다)가 대표 짝, advertise(광고하다)는 오답.","ex":[["Police could not [[pinpoint the location]].","경찰은 [[위치를 정확히 찾아내지]] 못했다."],["Scientists tried to [[pinpoint the cause]] of the fire.","과학자들은 화재의 [[원인을 정확히 짚어내려고]] 했다."],["Can you [[pinpoint the problem]] in this code?","이 코드에서 [[문제를 정확히 짚어낼]] 수 있니?"]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"share","a":"3","e":"①몫 / ②몫 / ③주식 / ④몫 [③번만 의미가 다름]","k":"①수확이 끝난 뒤 모든 일꾼이 쌀의 공정한 몫을 받았다.\n②팀의 각 구성원은 상금의 동등한 몫을 받았다.\n③그녀는 큰 이익을 남기고 그 회사의 주식을 팔았다.\n④내가 내는 집세 몫은 매달 5만 원이다.","m":0,"c":["After the harvest, every worker got a fair share of the rice.","Each member of the team received an equal share of the prize money.","She sold her shares in the company for a large profit.","My share of the rent is fifty thousand won every month."],"hc":"share|share|shares|share","mn":"몫 / 주식","hk":"share(몫)는 나눠 가진 한 부분이라는 뜻이 공통이고, 회사 share(주식)만 뜻이 다름. fair share(공정한 몫)와 sell shares(주식을 팔다)로 구분.","ex":[["Everyone got [[a fair share]] of the cake.","모두가 케이크의 [[공평한 몫]]을 받았다.","share (명) 몫"],["I pay [[my share of the rent]].","나는 [[월세 중 내 몫]]을 낸다.","share (명) 몫"],["He bought [[shares in the company]].","그는 [[그 회사의 주식]]을 샀다.","share (명) 주식"]]}]},{"day":56,"q":[{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"obituary","a":"4","e":"④ obituary: 부고, 사망 기사","w":"① caption: 자막, 설명문\n② dissertation: 학위 논문\n③ editorial: 사설, 논평","m":0,"s":"obituary","c":["자막, 설명문","학위 논문","사설, 논평","부고, 사망 기사"],"mn":"부고, 사망 기사","hk":"obituary(부고)는 사람의 죽음을 알리는 기사. editorial(사설)은 의견 글, caption(자막)은 사진 옆 설명문","ex":[["The newspaper printed [[an obituary]] for the old teacher.","신문은 그 노선생님의 [[부고]]를 실었다."],["She read [[the obituary]] of her neighbor.","그녀는 이웃의 [[부고 기사]]를 읽었다."],["His family wrote [[an obituary]] to share the sad news.","그의 가족은 슬픈 소식을 알리려고 [[부고]]를 썼다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"antiquated","a":"2","e":"② advanced: 진보된, 최신의 (그 공장은 거의 매주 고장 나는 구식 기계들에 여전히 의존하고 있다.) / antiquated(구식의, 낡은)의 반의어.","w":"① dated: 구식이 된\n③ outmoded: 시대에 뒤떨어진\n④ archaic: 아주 오래된, 낡은","k":"그 공장은 거의 매주 고장 나는 구식 기계들에 여전히 의존하고 있다.","m":0,"s":"The factory still relies on antiquated machines that break down almost every week.","h":"antiquated","c":["dated","advanced","outmoded","archaic"],"mn":"구식의, 낡은","hk":"antiquated(구식의)의 반대편은 advanced(진보된). dated(구식이 된), outmoded(시대에 뒤떨어진), archaic(낡은)은 같은 편이라 오답","ex":[["The office still uses [[antiquated equipment]] from the 1980s.","그 사무실은 1980년대의 [[구식 장비]]를 아직도 쓴다.","antiquated (형) 구식의, 낡은"],["This school has [[advanced technology]] in every classroom.","이 학교는 모든 교실에 [[최신 기술]]이 있다.","advanced (형) 진보된, 최신의"],["The hospital offers [[advanced medical care]] to patients.","그 병원은 환자들에게 [[선진 의료]]를 제공한다.","advanced (형) 진보된, 최신의"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"mend","a":"1","e":"① mend: 수선하다, 고치다 (그녀는 겨울이 오기 전에 스웨터에 난 작은 구멍을 수선해야 했다.)","w":"② sort: 분류하다, 가려내다\n③ hang: 걸다, 매달다\n④ wash: 씻다, 세탁하다","k":"그녀는 겨울이 오기 전에 스웨터에 난 작은 구멍을 수선해야 했다.","m":0,"s":"She had to ________ the small hole in her sweater before the winter came.","c":["mend","sort","hang","wash"],"mn":"수선하다, 고치다","hk":"mend(수선하다)는 구멍 난 옷이나 물건을 고치는 동사. sort(분류하다), hang(걸다), wash(씻다)는 구멍을 고치는 동작이 아님","ex":[["He used a needle to [[mend his torn shirt]].","그는 바늘로 [[찢어진 셔츠를 수선했다]]."],["Dad will [[mend the broken fence]] this weekend.","아빠는 이번 주말에 [[부서진 울타리를 고칠]] 것이다."],["Grandma likes to [[mend old socks]] by hand.","할머니는 손으로 [[낡은 양말을 꿰매는]] 것을 좋아하신다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"induction","a":"1","e":"induction (명) 귀납 - inductive (형) 귀납적인\n① legislation (명) 법률, 입법 - legislative (형) 입법의","w":"② quantify (동) 수량화하다 - quantitative (형) 정량적인\n③ decentralize (동) 분권화하다 - decentralized (형) 분산된\n④ embed (동) 내장하다, 깊이 박다 - embedded (형) 내재된, 깊이 자리 잡은","m":0,"s":"induction - inductive","c":["legislation - legislative","quantify - quantitative","decentralize - decentralized","embed - embedded"],"mn":"귀납","hk":"명사에서 형용사로: induction(귀납)에서 inductive(귀납적인)처럼 legislation(입법)에서 legislative(입법의). 나머지는 동사 출발","ex":[["Scientists often use [[induction]] to find a general rule.","과학자들은 일반적인 규칙을 찾으려고 자주 [[귀납]]을 쓴다.","induction (명) 귀납"],["She used [[inductive reasoning]] to reach her conclusion.","그녀는 [[귀납적 추론]]으로 결론에 이르렀다.","inductive (형) 귀납적인"],["The government passed [[new legislation]] on school safety.","정부는 학교 안전에 관한 [[새 법률]]을 통과시켰다.","legislation (명) 법률, 입법"],["The parliament is [[a legislative body]] that makes laws.","의회는 법을 만드는 [[입법 기관]]이다.","legislative (형) 입법의"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"mostly","a":"2","e":"② mainly: 주로 (관객은 대부분 근처 고등학교의 학생들로 이루어져 있었다.) / mostly(주로, 대부분)의 유의어.","w":"① slightly: 약간, 조금\n③ nearly: 거의\n④ partly: 부분적으로","k":"관객은 대부분 근처 고등학교의 학생들로 이루어져 있었다.","m":0,"s":"The audience was mostly made up of students from the nearby high school.","h":"mostly","c":["slightly","mainly","nearly","partly"],"mn":"주로, 대부분","hk":"mostly(주로)와 mainly(주로)는 같은 뜻. slightly(약간), nearly(거의), partly(부분적으로)는 정도를 말하는 단어라 오답","ex":[["The park is [[mostly empty]] on weekday mornings.","그 공원은 평일 아침에는 [[대부분 비어]] 있다."],["The sky will be [[mostly cloudy]] tomorrow.","내일 하늘은 [[대체로 흐릴]] 것이다."],["It was [[mostly my fault]].","[[대부분 내 잘못]]이었다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"solidarity","a":"solidarity","e":"solidarity 연대, 결속","k":"세 곳의 서로 다른 공장에서 온 노동자들이 파업 중인 사람들과의 연대를 보여주기 위해 함께 행진했다.","m":0,"s":"Workers from three different factories marched together to show their s______ with the strikers.","mn":"연대, 결속","hk":"solidarity(연대)는 solid(단단한)에 -arity가 붙은 꼴. 앞은 solid, 끝은 -arity로 철자 챙기기","ex":[["The crowd showed [[solidarity]] with the workers.","군중은 노동자들과의 [[연대]]를 보여 주었다."],["People stood together [[in solidarity]] after the flood.","사람들은 홍수 뒤에 [[연대하여]] 함께 섰다."],["A song can build [[a sense of solidarity]] among fans.","노래는 팬들 사이에 [[연대감]]을 만들 수 있다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"maxim","a":"1","e":"① maxim: (짧고 널리 알려진 말 / 일반적인 진리나 행동에 관한 규칙을 나타내는) 격언, 금언","w":"② rebuttal: 반박, 논박\n③ critique: 비평, 평론\n④ premise: 전제","k":"짧고 널리 알려진 말 / 일반적인 진리나 행동에 관한 규칙을 나타내는","m":0,"s":"\"a short well-known saying that expresses a general truth or a rule about behavior\"","c":["maxim","rebuttal","critique","premise"],"mn":"격언, 금언","hk":"maxim(격언)은 짧고 널리 알려진 교훈의 말. rebuttal(반박), critique(비평), premise(전제)는 정의와 맞지 않음","ex":[["Our teacher often repeats [[an old maxim]] about hard work.","우리 선생님은 노력에 관한 [[오래된 격언]]을 자주 되풀이하신다."],["[[A famous maxim]] says that time is money.","[[유명한 격언]]은 시간이 돈이라고 말한다."],["He lives by [[the maxim]] of never giving up.","그는 절대 포기하지 않는다는 [[격언]]대로 산다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"tear","a":"tear","e":"tear (명) 눈물 / (동) 찢다, 뜯어내다","k":"그녀는 딸이 무대 위로 걸어 나가는 것을 보면서 조용히 눈물을 닦아냈다.\n그 오래된 지도를 탁자 위에 펼칠 때 찢지 않도록 조심해라.","m":0,"s":"She quietly wiped away a t______ as she watched her daughter walk onto the stage.\nBe careful not to t______ the old map when you unfold it on the table.","mn":"눈물 / 찢다, 뜯어내다","hk":"tear(눈물)는 [티어], tear(찢다)는 [테어]로 발음이 달라지는 같은 철자. a tear(눈물 한 방울), tear paper(종이를 찢다)처럼 짝으로 구분","ex":[["She wiped [[a tear]] from her eye.","그녀는 눈에서 [[눈물]] 한 방울을 닦았다.","tear (명) 눈물"],["He had [[tears of joy]] at the party.","그는 파티에서 [[기쁨의 눈물]]을 흘렸다.","tear (명) 눈물"],["Do not [[tear the page]] out of the book.","책에서 [[그 쪽을 뜯어내지]] 마라.","tear (동) 찢다, 뜯어내다"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"ugly","a":"3,4","e":"③ handsome: 잘생긴, 보기 좋은\n④ lovely: 사랑스러운, 멋진 (모두가 그 오래된 건물이 흉하다고 말했지만, 그 화가는 거기서 특별한 것을 보았다.) / ugly(못생긴, 흉한)의 반의어.","w":"① dull: 칙칙한, 따분한\n② dirty: 더러운","k":"모두가 그 오래된 건물이 흉하다고 말했지만, 그 화가는 거기서 특별한 것을 보았다.","m":2,"s":"Everyone said the old building was ugly, but the artist saw something special in it.","h":"ugly","c":["dull","dirty","handsome","lovely"],"mn":"못생긴, 흉한","hk":"ugly(못생긴)의 반대편은 handsome(잘생긴)과 lovely(사랑스러운), 정답 2개. dull(칙칙한)과 dirty(더러운)는 오히려 나쁜 쪽","ex":[["Nobody wanted to buy [[the ugly painting]].","아무도 [[그 흉한 그림]]을 사고 싶어 하지 않았다.","ugly (형) 못생긴, 흉한"],["He is [[a handsome actor]] loved by many fans.","그는 많은 팬에게 사랑받는 [[잘생긴 배우]]이다.","handsome (형) 잘생긴, 보기 좋은"],["They found [[a lovely little house]] by the lake.","그들은 호숫가에서 [[사랑스러운 작은 집]]을 발견했다.","lovely (형) 사랑스러운, 멋진"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"preconception","a":"2","e":"② preconception: 선입견, 예상","w":"① predisposition: 소질, 기질\n③ inclination: 성향, 경향\n④ deliberation: 숙고, 신중함","m":0,"s":"\"선입견, 예상\"","c":["predisposition","preconception","inclination","deliberation"],"mn":"선입견, 예상","hk":"preconception(선입견)은 pre-(미리) + conception(생각), 곧 미리 굳은 생각. predisposition(소질), inclination(성향)과 구분","ex":[["He had [[a preconception]] about the new student.","그는 새로 온 학생에 대해 [[선입견]]을 갖고 있었다."],["Try to meet people without [[any preconceptions]].","[[어떤 선입견]]도 없이 사람들을 만나 보도록 해라."],["Travel can break [[old preconceptions]] about other countries.","여행은 다른 나라에 대한 [[낡은 선입견]]을 깨뜨릴 수 있다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"unravel","a":"3","e":"③ unravel: 풀어내다, 밝히다 (역사가들은 그 고대 도시가 어떻게 사라졌는지에 대한 수수께끼를 아직도 풀어내려 하고 있다.)","w":"① retort: 반박하다, 말대꾸하다\n② corroborate: 확증하다, 뒷받침하다\n④ excavate: 발굴하다","k":"역사가들은 그 고대 도시가 어떻게 사라졌는지에 대한 수수께끼를 아직도 풀어내려 하고 있다.","m":0,"s":"Historians are still trying to ________ the mystery of how the ancient city disappeared.","c":["retort","corroborate","unravel","excavate"],"mn":"풀어내다, 밝히다","hk":"unravel(풀어내다)은 엉킨 실을 풀듯 얽힌 수수께끼를 푸는 동사. retort(반박하다), corroborate(확증하다), excavate(발굴하다)는 오답","ex":[["The cat began to [[unravel the ball of yarn]].","고양이가 [[털실 뭉치를 풀기]] 시작했다."],["Detectives worked to [[unravel the mystery]].","형사들은 [[수수께끼를 풀기]] 위해 일했다."],["She hopes to [[unravel the truth]] about the accident.","그녀는 그 사고에 대한 [[진실을 밝히기]]를 바란다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"vanquish","a":"2","e":"② conquer: 정복하다 (그 작은 왕국은 어떻게든 자기보다 세 배 큰 군대를 물리쳐냈다.) / vanquish(정복하다, 무찌르다)의 유의어.","w":"① grapple: 맞서 싸우다, 씨름하다\n③ besiege: 포위하다\n④ mobilize: 동원하다","k":"그 작은 왕국은 어떻게든 자기보다 세 배 큰 군대를 물리쳐냈다.","m":0,"s":"The small kingdom somehow managed to vanquish an army three times its size.","h":"vanquish","c":["grapple","conquer","besiege","mobilize"],"mn":"정복하다, 무찌르다","hk":"vanquish(무찌르다)는 conquer(정복하다)처럼 이기는 뜻. grapple(씨름하다)은 맞붙기만 하고, besiege(포위하다)와 mobilize(동원하다)도 오답","ex":[["The hero vowed to [[vanquish the dragon]].","영웅은 [[용을 무찌르겠다고]] 맹세했다."],["The army hoped to [[vanquish its enemies]] quickly.","그 군대는 빨리 [[적을 무찌르기]]를 바랐다."],["She worked hard to [[vanquish her fear]] of heights.","그녀는 높은 곳에 대한 [[두려움을 이겨 내려고]] 열심히 노력했다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"evaporation","a":"3","e":"③ evaporation: (과정 / 액체 상태의 물이 천천히 기체로 변하는 / 그리고 공기 중으로 올라가는) 증발","w":"① circulation: 순환, 유통\n② condensation: 응결, 응축\n④ precipitation: 강수(비·눈이 내림), 강수량","k":"과정 / 액체 상태의 물이 천천히 기체로 변하는 / 그리고 공기 중으로 올라가는","m":0,"s":"\"the process in which liquid water slowly changes into gas and rises into the air\"","c":["circulation","condensation","evaporation","precipitation"],"mn":"증발","hk":"evaporation(증발)은 물이 기체로 변해 올라가는 과정. 반대인 condensation(응결), circulation(순환), precipitation(강수)은 오답","ex":[["[[Evaporation]] makes puddles disappear on sunny days.","맑은 날에는 [[증발]]이 물웅덩이를 사라지게 한다."],["Heat speeds up [[the evaporation of water]].","열은 [[물의 증발]]을 빠르게 한다."],["We get salt from sea water through [[evaporation]].","우리는 [[증발]]을 통해 바닷물에서 소금을 얻는다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"crosswalk","a":"crosswalk","e":"※ 영국식 crossing도 정답으로 인정한다. (미국식 crosswalk / 영국식 crossing)","k":"초록불일 때조차도 횡단보도에 발을 들여놓기 전에 항상 양쪽을 살펴라.","m":0,"s":"Always look both ways before you step onto the c______, even when the light is green.","al":"crossing","hk":"crosswalk(횡단보도)는 cross(건너다)와 walk(걷다)를 붙인 한 단어. 영국식 crossing(횡단보도)도 정답","ex":[["Wait for the green light at [[the crosswalk]].","[[횡단보도]]에서 초록불을 기다려라."],["A boy ran across [[the crosswalk]] to catch the bus.","한 소년이 버스를 타려고 [[횡단보도]]를 뛰어 건넜다."],["The city painted [[a new crosswalk]] near the school.","시는 학교 근처에 [[새 횡단보도]]를 칠했다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"object","a":"1","e":"①목적, 목표 / ②물건, 사물 / ③물건, 사물 / ④물체 [①번만 의미가 다름]","k":"①그 회의의 주된 목적은 연말 전에 비용을 줄이는 것이었다.\n②어린아이들은 주변의 모든 물건을 만져 보면서 세상에 대해 배운다.\n③그 과학자는 작은 금속 물체를 탁자 위에 놓고 그것을 측정했다.\n④망원경은 멀리 있는 물체를 실제보다 훨씬 가깝게 보이게 할 수 있다.","m":0,"c":["The main object of the meeting was to cut costs before the end of the year.","Young children learn about the world by touching every object around them.","The scientist placed a small metal object on the table and measured it.","A telescope can make a faraway object look much closer than it really is."],"hc":"object|object|object|object","mn":"물건, 사물 / 목적, 목표","hk":"①번만 object(목적, 목표)이고 ②③④는 object(물건, 사물). main(주된) object는 주된 목적으로 기억","ex":[["[[The main object]] of this game is to win points.","이 게임의 [[주된 목적]]은 점수를 얻는 것이다.","object (명) 목적, 목표"],["He found [[a strange object]] on the beach.","그는 해변에서 [[이상한 물건]]을 발견했다.","object (명) 물건, 사물"],["Cats like to play with [[small objects]].","고양이는 [[작은 물건들]]을 가지고 노는 것을 좋아한다.","object (명) 물건, 사물"]]}]},{"day":57,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"literacy","a":"3","e":"③ literacy: (읽고 쓸 수 있는 능력) 문해력, 읽고 쓰는 능력","w":"① pedagogy: 교육학, 교수법\n② syntax: 구문론, 문장 구조\n④ lexicon: 어휘, 전문 용어 체계","k":"읽고 쓸 수 있는 능력","m":0,"s":"\"the ability to read and write\"","c":["pedagogy","syntax","literacy","lexicon"],"mn":"문해력, 읽고 쓰는 능력","hk":"literacy(문해력)는 letter(글자)와 같은 뿌리로 읽고 쓰는 힘. pedagogy(교육학), syntax(구문론), lexicon(어휘)은 오답","ex":[["Reading daily builds strong [[literacy skills]].","매일 읽으면 탄탄한 [[문해 능력]]이 길러진다."],["The program teaches [[basic literacy]] to adults.","그 프로그램은 어른들에게 [[기초 문해력]]을 가르친다."],["[[Digital literacy]] is important for young students.","[[디지털 문해력]]은 어린 학생들에게 중요하다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"sad","a":"2","e":"② glad: 기쁜, 반가운 (그녀는 가장 친한 친구가 다른 도시로 이사 간 뒤 몇 주 동안 슬펐다.) / sad(슬픈)의 반의어.","w":"① painful: 아픈, 고통스러운\n③ unhappy: 불행한, 슬픈\n④ upset: 속상한, 마음이 상한","k":"그녀는 가장 친한 친구가 다른 도시로 이사 간 뒤 몇 주 동안 슬펐다.","m":0,"s":"She felt sad for weeks after her best friend moved to another city.","h":"sad","c":["painful","glad","unhappy","upset"],"mn":"슬픈","hk":"sad(슬픈)의 반대편은 glad(기쁜). unhappy(불행한)는 sad(슬픈)와 같은 편, painful(고통스러운)과 upset(속상한)도 반대가 아님","ex":[["[[The sad news]] made everyone quiet.","[[그 슬픈 소식]]에 모두가 조용해졌다.","sad (형) 슬픈"],["We were [[glad to hear]] the good news.","우리는 그 좋은 소식을 [[듣게 되어 기뻤다]].","glad (형) 기쁜, 반가운"],["She gave him [[a glad smile]].","그녀는 그에게 [[기쁜 미소]]를 지어 주었다.","glad (형) 기쁜, 반가운"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"wary","a":"4","e":"wary (형) 경계하는, 조심스러운 - wariness (명) 경계심, 조심성\n④ eloquent (형) 웅변의, 설득력 있는 - eloquence (명) 웅변, 능변","w":"① empower (동) 권한을 부여하다 - empowerment (명) 권한 부여, 역량 강화\n② alienate (동) 소외시키다, 멀어지게 하다 - alienation (명) 소외, 이질감\n③ apprehend (동) 이해하다, 체포하다 - apprehension (명) 불안, 우려","m":0,"s":"wary - wariness","c":["empower - empowerment","alienate - alienation","apprehend - apprehension","eloquent - eloquence"],"mn":"경계하는, 조심스러운","hk":"형용사에서 명사로: wary(경계하는)에서 wariness(경계심)처럼 eloquent(웅변의)에서 eloquence(웅변). 나머지는 모두 동사 출발","ex":[["Be [[wary of strangers]] online.","온라인에서는 [[낯선 사람을 경계해라]].","wary (형) 경계하는, 조심스러운"],["She looked at the stranger with [[wariness]].","그녀는 [[경계심]]을 품고 그 낯선 사람을 보았다.","wariness (명) 경계심, 조심성"],["She gave [[an eloquent speech]] at the ceremony.","그녀는 기념식에서 [[설득력 있는 연설]]을 했다.","eloquent (형) 웅변의, 설득력 있는"],["His [[eloquence]] moved the whole crowd.","그의 [[웅변]]은 군중 전체를 감동시켰다.","eloquence (명) 웅변, 능변"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"scrutiny","a":"scrutiny","e":"scrutiny 면밀한 검토, 조사","k":"그 새 법안은 언론과 대중 양쪽으로부터 면밀한 검토를 받게 되었다.","m":0,"s":"The new bill came under close s______ from both the press and the public.","mn":"면밀한 검토, 조사","hk":"scrutiny(면밀한 검토)는 s-c-r-u-t-i-n-y. 앞의 scru와 끝의 -tiny 철자를 챙기고, close(면밀한) scrutiny 짝으로 기억","ex":[["The plan came under [[close scrutiny]].","그 계획은 [[면밀한 검토]]를 받게 되었다."],["The star's life is always under [[public scrutiny]].","그 스타의 삶은 늘 [[대중의 면밀한 시선]] 아래 있다."],["The company faces [[government scrutiny]] over its prices.","그 회사는 가격 문제로 [[정부의 조사]]를 받고 있다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"irreversible","a":"2","e":"② irrevocable: 돌이킬 수 없는, 취소 불가능한 (물이 계속 따뜻해지면 그 산호초의 손상은 돌이킬 수 없을지도 모른다.) / irreversible(되돌릴 수 없는, 뒤집을 수 없는)의 유의어.","w":"① ephemeral: 일시적인, 순간적인\n③ transitional: 과도기적인\n④ intermediate: 중간의, 중급의","k":"물이 계속 따뜻해지면 그 산호초의 손상은 돌이킬 수 없을지도 모른다.","m":0,"s":"The damage to the coral reef may be irreversible if the water keeps warming.","h":"irreversible","c":["ephemeral","irrevocable","transitional","intermediate"],"mn":"되돌릴 수 없는, 뒤집을 수 없는","hk":"irreversible(되돌릴 수 없는)은 irrevocable(돌이킬 수 없는)과 같은 뜻. 둘 다 ir-(아닌)이 붙은 부정어. ephemeral(일시적인)은 오답","ex":[["Cutting down the forest caused [[irreversible damage]].","숲을 벌목하는 것은 [[되돌릴 수 없는 피해]]를 일으켰다."],["The doctor said the change was [[irreversible]].","의사는 그 변화가 [[되돌릴 수 없다고]] 말했다."],["Quitting school is [[an irreversible decision]].","학교를 그만두는 것은 [[되돌릴 수 없는 결정]]이다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"pollutant","a":"2","e":"② pollutant: 오염 물질","w":"① pigment: 색소\n③ sediment: 퇴적물, 침전물\n④ microbe: 미생물","m":0,"s":"\"오염 물질\"","c":["pigment","pollutant","sediment","microbe"],"mn":"오염 물질","hk":"pollutant(오염 물질)는 pollute(오염시키다)에서 나온 말. pigment(색소), sediment(퇴적물), microbe(미생물)와 구분","ex":[["Cars release [[harmful pollutants]] into the air.","자동차는 [[해로운 오염 물질]]을 공기 중으로 내보낸다."],["Factories must reduce [[air pollutants]].","공장들은 [[대기 오염 물질]]을 줄여야 한다."],["Scientists found [[a toxic pollutant]] in the river.","과학자들은 강에서 [[유독한 오염 물질]]을 발견했다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"boil","a":"4","e":"④ boil: 끓다, 끓이다 (냄비에 달걀을 넣고 물을 약 10분 동안 끓게 두어라.)","w":"① fry: 기름에 튀기다, 볶다\n② chop: 토막토막 썰다\n③ bake: 굽다","k":"냄비에 달걀을 넣고 물을 약 10분 동안 끓게 두어라.","m":0,"s":"Put the eggs in the pot and let the water ________ for about ten minutes.","c":["fry","chop","bake","boil"],"mn":"끓다, 끓이다","hk":"boil(끓다)은 물이 끓는 동사. fry(튀기다), chop(썰다), bake(굽다)는 물에 하는 동작이 아니라 오답","ex":[["Wait until [[the water boils]].","[[물이 끓을]] 때까지 기다려라."],["Mom will [[boil some eggs]] for lunch.","엄마가 점심으로 [[달걀을 삶아]] 줄 것이다."],["[[Boil the milk]] first, then add the sugar.","먼저 [[우유를 끓인]] 다음 설탕을 넣어라."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"pitch","a":"pitch","e":"pitch (명) (소리의) 높낮이, 음높이 / (명) 경기장","k":"잘 훈련된 가수는 목소리에 전혀 무리를 주지 않고 높은 음을 유지할 수 있다.\n선수들은 폭우가 마침내 그치자마자 진흙투성이 경기장 위로 걸어 나갔다.","m":0,"s":"A well-trained singer can hold a high p______ without straining her voice at all.\nThe players walked onto the muddy p______ just as the heavy rain finally stopped.","mn":"높낮이, 음높이 / 경기장","hk":"pitch(음높이, 경기장)는 한 단어 두 뜻. high(높은) pitch는 음높이, football(축구) pitch는 경기장. 앞뒤 짝으로 구분","ex":[["The singer's [[high pitch]] surprised everyone.","그 가수의 [[높은 음]]에 모두가 놀랐다.","pitch (명) 음높이"],["Dogs can hear sounds of [[a very high pitch]].","개는 [[아주 높은 음]]의 소리를 들을 수 있다.","pitch (명) 음높이"],["The boys played football on [[the school pitch]].","소년들은 [[학교 경기장]]에서 축구를 했다.","pitch (명) 경기장"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"conclusive","a":"2,4","e":"② tentative: 잠정적인, 확정되지 않은\n④ shaky: 흔들리는, 근거가 불안정한 (그 연구팀은 몇 달간의 실험 후에도 결정적인 답에 이르지 못했다.) / conclusive(결정적인, 확실한)의 반의어.","w":"① definitive: 확정적인, 최종적인\n③ empirical: 경험적인, 실증적인","k":"그 연구팀은 몇 달간의 실험 후에도 결정적인 답에 이르지 못했다.","m":2,"s":"The research team could not reach a conclusive answer even after months of testing.","h":"conclusive","c":["definitive","tentative","empirical","shaky"],"mn":"결정적인, 확실한","hk":"conclusive(결정적인)의 반대편은 tentative(잠정적인)와 shaky(불안정한). definitive(확정적인)는 같은 편, empirical(경험적인)은 무관","ex":[["The police found [[conclusive evidence]] at last.","경찰은 마침내 [[결정적인 증거]]를 찾았다.","conclusive (형) 결정적인, 확실한"],["They made [[a tentative plan]] for next week.","그들은 다음 주를 위해 [[잠정적인 계획]]을 세웠다.","tentative (형) 잠정적인, 확정되지 않은"],["The team's [[shaky start]] worried the coach.","팀의 [[불안한 출발]]이 감독을 걱정시켰다.","shaky (형) 흔들리는, 불안정한"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"brevity","a":"3","e":"③ brevity: 간결함, 짧음","w":"① intricacy: 정교함, 복잡함\n② authenticity: 진정성, 진실성\n④ coherence: 일관성, 응집력","m":0,"s":"brevity","c":["정교함, 복잡함","진정성, 진실성","간결함, 짧음","일관성, 응집력"],"mn":"간결함, 짧음","hk":"brevity(간결함)는 brief(짧은)와 같은 뿌리로 짧고 간단함. intricacy(정교함), authenticity(진정성), coherence(일관성)와 구분","ex":[["[[Brevity]] is important in a good speech.","좋은 연설에서는 [[간결함]]이 중요하다."],["Her letter was famous for [[its brevity]].","그녀의 편지는 [[그 간결함]]으로 유명했다."],["Please answer [[with brevity]].","[[간결하게]] 대답해 주세요."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"celebrate","a":"1","e":"① congratulate: 축하하다 (우리 가족은 할머니의 생신에 할머니를 축하하기 위해 항상 함께 모인다.) / celebrate(축하하다, 기념하다)의 유의어.","w":"② recommend: 추천하다, 권하다\n③ organize: 정리하다, 조직하다\n④ invite: 초대하다","k":"우리 가족은 할머니의 생신에 할머니를 축하하기 위해 항상 함께 모인다.","m":0,"s":"Our family always gets together to celebrate my grandmother on her birthday.","h":"celebrate","c":["congratulate","recommend","organize","invite"],"mn":"축하하다, 기념하다","hk":"celebrate(축하하다)와 같은 편은 congratulate(축하하다). recommend(추천하다), organize(조직하다), invite(초대하다)는 오답","ex":[["We [[celebrate the new year]] with fireworks.","우리는 불꽃놀이로 [[새해를 축하한다]]."],["They will [[celebrate their anniversary]] at a restaurant.","그들은 식당에서 [[결혼기념일을 축하할]] 것이다."],["Let us [[celebrate your success]] with a cake.","케이크로 [[너의 성공을 축하하자]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"incentivize","a":"4","e":"④ incentivize: 장려하다, 동기를 부여하다 (그 도시는 주민들이 전기차를 쓰도록 장려하기 위해 무료 주차를 제공했다.)","w":"① prioritize: 우선순위를 두다\n② criticize: 비판하다\n③ marginalize: 소외시키다","k":"그 도시는 주민들이 전기차를 쓰도록 장려하기 위해 무료 주차를 제공했다.","m":0,"s":"The city offered free parking in order to ________ residents to use electric cars.","c":["prioritize","criticize","marginalize","incentivize"],"mn":"장려하다, 동기를 부여하다","hk":"incentivize(장려하다)는 incentive(장려책) + -ize(~로 만들다). prioritize(우선순위를 두다), criticize(비판하다)는 오답","ex":[["The company will [[incentivize workers]] with bonuses.","회사는 보너스로 [[직원들에게 동기를 부여할]] 것이다."],["Lower prices can [[incentivize people]] to buy more.","가격 인하는 더 사도록 [[사람들을 장려할]] 수 있다."],["Tax cuts may [[incentivize companies]] to hire more people.","세금 감면은 더 많은 사람을 고용하도록 [[기업을 장려할]] 수 있다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"skyscraper","a":"skyscraper","e":"skyscraper 고층 건물","k":"그 고층 건물 꼭대기에서 저 아래의 자동차들은 아주 작은 플라스틱 장난감처럼 보였다.","m":0,"s":"From the top of the s______, the cars far below looked like tiny plastic toys.","mn":"고층 건물","hk":"skyscraper(고층 건물)는 sky(하늘) + scraper(긁는 것)가 붙은 한 단어. 중간에 띄우지 않고 한 단어로 쓰기","ex":[["They live on the top floor of [[a tall skyscraper]].","그들은 [[높은 고층 건물]]의 꼭대기 층에 산다."],["Workers built [[a glass skyscraper]] downtown.","일꾼들은 시내에 [[유리 고층 건물]]을 지었다."],["Many tourists visit [[the famous skyscraper]] every year.","많은 관광객이 매년 [[그 유명한 고층 건물]]을 찾는다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"pension","a":"2","e":"② pension: (정기적으로 지급되는 돈 / 일하기를 그만둔 사람에게 / 나이가 많아졌기 때문에) 연금","w":"① mortgage: 담보 대출\n③ surcharge: 추가 요금, 할증료\n④ allowance: 수당, 용돈","k":"정기적으로 지급되는 돈 / 일하기를 그만둔 사람에게 / 나이가 많아졌기 때문에","m":0,"s":"\"money paid regularly to a person who has stopped working because of old age\"","c":["mortgage","pension","surcharge","allowance"],"mn":"연금","hk":"pension(연금)은 나이 들어 일을 그만둔 사람에게 정기적으로 주는 돈. mortgage(담보 대출), surcharge(추가 요금), allowance(수당)와 구분","ex":[["My grandfather lives on [[a small pension]].","할아버지는 [[적은 연금]]으로 생활하신다."],["She will receive [[a monthly pension]] after retiring.","그녀는 은퇴 후에 [[매달 연금]]을 받을 것이다."],["The government pays [[a state pension]] to old people.","정부는 노인들에게 [[국가 연금]]을 지급한다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"exercise","a":"1","e":"①(권력의) 행사, 발휘 / ②운동 / ③운동 / ④운동 [①번만 의미가 다름]","k":"①그 왕의 절대 권력 행사는 마침내 귀족들을 분노하게 했다.\n②매일의 운동은 심장을 튼튼하게, 정신을 맑게 유지해 준다.\n③의사는 그에게 운동을 더 하고 일에 대해 덜 걱정하라고 말했다.\n④수영은 무릎에 문제가 있는 사람들에게 가장 좋은 운동이다.","m":0,"c":["The king's exercise of absolute power finally angered the nobles.","Daily exercise keeps your heart strong and your mind clear.","The doctor told him to get more exercise and to worry less about work.","Swimming is the best exercise for people who have knee problems."],"hc":"exercise|exercise|exercise|exercise","mn":"운동 / (권력의) 행사, 발휘","hk":"①번만 exercise(행사, 발휘)이고 ②③④는 exercise(운동). exercise of power(권력의 행사)는 power(권력)와 붙는 짝으로 기억","ex":[["Walking is good [[exercise]] for old people.","걷기는 노인에게 좋은 [[운동]]이다.","exercise (명) 운동"],["[[Regular exercise]] helps you sleep well.","[[규칙적인 운동]]은 잠을 잘 자게 도와준다.","exercise (명) 운동"],["The judge's [[exercise of power]] was fair.","판사의 [[권한 행사]]는 공정했다.","exercise (명) (권력의) 행사, 발휘"]]}]},{"day":58,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"currency","a":"3","e":"③ currency: (화폐 제도 / 특정한 나라에서 쓰이는) 통화, 화폐","w":"① budget: 예산\n② credit: 신용, 외상\n④ loan: 대출(금)","k":"화폐 제도 / 특정한 나라에서 쓰이는","m":0,"s":"\"the system of money that is used in a particular country\"","c":["budget","credit","currency","loan"],"mn":"통화, 화폐","hk":"currency(통화)는 한 나라에서 쓰는 돈의 체계. budget(예산), credit(신용), loan(대출)은 돈의 제도가 아니라 오답","ex":[["The dollar is [[the currency]] of the United States.","달러는 미국의 [[통화]]이다."],["Travelers exchange money for [[foreign currency]].","여행객들은 돈을 [[외국 통화]]로 바꾼다."],["Please pay in [[local currency]].","[[현지 통화]]로 지불해 주세요."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"previous","a":"4","e":"④ prior: 이전의, 사전의 (선생님은 오늘 시험 전에 이전 단원을 복습하라고 우리에게 말씀하셨다.) / previous(이전의, 앞선)의 유의어.","w":"① recent: 최근의\n② upcoming: 다가오는\n③ latter: 후자의, 나중의","k":"선생님은 오늘 시험 전에 이전 단원을 복습하라고 우리에게 말씀하셨다.","m":0,"s":"The teacher asked us to review the previous chapter before today's test.","h":"previous","c":["recent","upcoming","latter","prior"],"mn":"이전의, 앞선","hk":"previous(이전의)는 prior(이전의)와 같은 뜻. recent(최근의), upcoming(다가오는), latter(후자의)는 시간 방향이나 뜻이 다름","ex":[["I met her on [[a previous trip]].","나는 [[이전 여행]]에서 그녀를 만났다."],["Please check [[the previous page]] again.","[[이전 쪽]]을 다시 확인해 주세요."],["He has [[previous experience]] with this work.","그는 이 일에 [[이전 경험]]이 있다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"comet","a":"2","e":"② comet: 혜성","w":"① eclipse: (일식·월식의) 식\n③ planet: 행성\n④ asteroid: 소행성","m":0,"s":"\"혜성\"","c":["eclipse","comet","planet","asteroid"],"mn":"혜성","hk":"comet(혜성)은 꼬리를 끌며 도는 천체. eclipse(식), planet(행성), asteroid(소행성)와 구분","ex":[["We watched [[a bright comet]] in the night sky.","우리는 밤하늘에서 [[밝은 혜성]]을 보았다."],["[[The comet's tail]] glowed in the dark.","[[혜성의 꼬리]]가 어둠 속에서 빛났다."],["[[Halley's comet]] returns about every seventy-six years.","[[핼리 혜성]]은 약 76년마다 돌아온다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"knowledge","a":"knowledge","e":"knowledge 지식, 아는 것","k":"책은 기꺼이 읽으려는 사람에게는 여전히 가장 값싼 지식의 원천이다.","m":0,"s":"Books are still the cheapest source of k______ for anyone who is willing to read.","mn":"지식, 아는 것","hk":"knowledge(지식)는 know(알다)에 -ledge가 붙은 꼴이라 앞의 k는 읽지 않아도 꼭 써야 하는 철자","ex":[["Reading gives you [[new knowledge]].","독서는 너에게 [[새로운 지식]]을 준다."],["He has [[a good knowledge]] of Korean history.","그는 한국사에 대한 [[좋은 지식]]이 있다."],["[[General knowledge]] helps in quiz shows.","[[일반 상식]]은 퀴즈 프로그램에서 도움이 된다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"humble","a":"3,4","e":"③ arrogant: 오만한, 거만한\n④ proud: 거만한, 우쭐대는 (그는 전국 대회에서 상을 받은 뒤에도 반 친구들 앞에서 겸손한 태도를 유지했다.) / humble(겸손한, 겸허한)의 반의어.","w":"① sincere: 진실한, 진심 어린\n② modest: 겸손한","k":"그는 전국 대회에서 상을 받은 뒤에도 반 친구들 앞에서 겸손한 태도를 유지했다.","m":2,"s":"Even after winning the national prize, he remained humble in front of his classmates.","h":"humble","c":["sincere","modest","arrogant","proud"],"mn":"겸손한, 겸허한","hk":"humble(겸손한)의 반대편은 arrogant(오만한)와 proud(거만한). modest(겸손한)는 같은 편, sincere(진실한)는 무관","ex":[["She is [[humble]] even though she is rich.","그녀는 부자인데도 [[겸손하다]].","humble (형) 겸손한, 겸허한"],["Nobody likes [[an arrogant boss]].","아무도 [[오만한 상사]]를 좋아하지 않는다.","arrogant (형) 오만한, 거만한"],["He is [[a proud man]] who never listens to others.","그는 남의 말을 전혀 듣지 않는 [[거만한 사람]]이다.","proud (형) 거만한, 우쭐대는"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"please","a":"1","e":"please (동) 기쁘게 하다 - pleasant (형) 쾌적한, 기분 좋은\n① help (동) 돕다 - helpful (형) 도움이 되는","w":"② danger (명) 위험 - dangerous (형) 위험한\n③ courage (명) 용기 - courageous (형) 용감한\n④ mystery (명) 신비, 수수께끼 - mysterious (형) 신비로운","m":0,"s":"please - pleasant","c":["help - helpful","danger - dangerous","courage - courageous","mystery - mysterious"],"mn":"기쁘게 하다","hk":"동사에서 형용사로: please(기쁘게 하다)에서 pleasant(쾌적한)처럼 help(돕다)에서 helpful(도움이 되는). 나머지는 명사 출발","ex":[["It is hard to [[please everyone]].","[[모두를 기쁘게 하기]]는 어렵다.","please (동) 기쁘게 하다"],["The room has [[a pleasant smell]].","그 방에는 [[기분 좋은 냄새]]가 난다.","pleasant (형) 쾌적한, 기분 좋은"],["Please [[help me]] carry this box.","이 상자 나르는 것을 [[도와줘]].","help (동) 돕다"],["The guide was very [[helpful]] to us.","안내원은 우리에게 매우 [[도움이 되었다]].","helpful (형) 도움이 되는"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"fee","a":"3","e":"③ fee: 요금, 수수료 (방문객들은 성의 정원에 들어가기 전에 소액의 입장료를 지불해야 한다.)","w":"① tax: 세금\n② toll: 통행료\n④ deposit: 보증금, 예치금","k":"방문객들은 성의 정원에 들어가기 전에 소액의 입장료를 지불해야 한다.","m":0,"s":"Visitors must pay a small entrance ________ before they can enter the castle garden.","c":["tax","toll","fee","deposit"],"mn":"요금, 수수료","hk":"fee(요금)는 입장이나 서비스에 내는 돈. entrance(입장) fee(입장료) 짝으로 기억. tax(세금), toll(통행료), deposit(보증금)은 오답","ex":[["The museum has no [[entrance fee]] on Sundays.","그 박물관은 일요일에 [[입장료]]가 없다."],["The club charges [[a small fee]] for new members.","그 동호회는 신입 회원에게 [[소액의 요금]]을 받는다."],["You must pay [[a late fee]] if you return the book late.","책을 늦게 반납하면 [[연체료]]를 내야 한다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"class","a":"class","e":"class (명) 등급, 체급 / (명) 수업, 반","k":"헤비급 체급의 선수들은 90킬로그램이 넘어야 한다.\n그 교수는 학생의 절반이 독감으로 앓아누워서 오전 수업을 취소했다.","m":0,"s":"Athletes in the heavyweight c______ must weigh more than ninety kilograms.\nThe professor canceled the morning c______ because half of the students were down with the flu.","mn":"등급, 체급 / 수업, 반","hk":"class(체급, 수업)는 한 단어 두 뜻. weight(몸무게) class는 체급, English(영어) class는 수업이나 반. 앞뒤 짝으로 구분","ex":[["The boxer moved up to a heavier [[weight class]].","그 권투 선수는 더 무거운 [[체급]]으로 올라갔다.","class (명) 등급, 체급"],["Our English [[class]] starts at nine.","우리 영어 [[수업]]은 아홉 시에 시작한다.","class (명) 수업, 반"],["Every student in my [[class]] likes music.","우리 [[반]]의 모든 학생은 음악을 좋아한다.","class (명) 수업, 반"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"terrain","a":"3","e":"③ terrain: 지형","w":"① boundary: 경계, 국경\n② climate: 기후\n④ shore: 해안, 물가","m":0,"s":"terrain","c":["경계, 국경","기후","지형","해안, 물가"],"mn":"지형","hk":"terrain(지형)은 땅의 생김새. boundary(경계), climate(기후), shore(해안)와 구분. rough(험한) terrain(지형)으로 기억","ex":[["The truck can drive over [[rough terrain]].","그 트럭은 [[험한 지형]]에서도 달릴 수 있다."],["Hikers crossed [[the rocky terrain]] slowly.","등산객들은 [[바위투성이 지형]]을 천천히 건넜다."],["This area has [[flat terrain]] and few trees.","이 지역은 [[평평한 지형]]이고 나무가 거의 없다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"ashamed","a":"4","e":"④ embarrassed: 부끄러운, 창피한 (선생님이 그의 부주의한 답을 소리 내어 읽었을 때 그는 부끄러움을 느꼈다.) / ashamed(부끄러운, 수치스러운)의 유의어.","w":"① awkward: 어색한, 서투른\n② nervous: 긴장한, 불안한\n③ startled: 깜짝 놀란","k":"선생님이 그의 부주의한 답을 소리 내어 읽었을 때 그는 부끄러움을 느꼈다.","m":0,"s":"He felt ashamed when the teacher read his careless answer aloud.","h":"ashamed","c":["awkward","nervous","startled","embarrassed"],"mn":"부끄러운, 수치스러운","hk":"ashamed(부끄러운)는 embarrassed(창피한)와 같은 편. awkward(어색한), nervous(긴장한), startled(깜짝 놀란)는 감정이 다름","ex":[["She was [[ashamed of her mistake]].","그녀는 [[자신의 실수를 부끄러워했다]]."],["I am [[ashamed to say]] that I forgot your name.","[[말하기 부끄럽지만]] 네 이름을 잊었다."],["He felt [[deeply ashamed]] after the fight.","그는 싸운 뒤 [[몹시 부끄러웠다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"lecture","a":"4","e":"④ lecture: (공식적인 강연 / 한 무리의 학생들에게 주어지는 / 특정한 주제에 대해) 강의","w":"① textbook: 교과서\n② seminar: 세미나, 토론 수업\n③ tutorial: 개별 지도, 소규모 수업","k":"공식적인 강연 / 한 무리의 학생들에게 주어지는 / 특정한 주제에 대해","m":0,"s":"\"a formal talk given to a group of students about a particular subject\"","c":["textbook","seminar","tutorial","lecture"],"mn":"강의","hk":"lecture(강의)는 학생들에게 하는 공식 강연. seminar(토론 수업), tutorial(개별 지도), textbook(교과서)은 오답","ex":[["The students listened to [[a long lecture]].","학생들은 [[긴 강의]]를 들었다."],["She will give [[a lecture]] on climate change.","그녀는 기후 변화에 관한 [[강의]]를 할 것이다."],["I took notes during [[the history lecture]].","나는 [[역사 강의]] 동안 필기를 했다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"total","a":"1","e":"① partial: 부분적인, 일부의 (그 보고서는 한 해 전체의 총 방문객 수를 제시했다.) / total(전체의, 완전한)의 반의어.","w":"② complete: 완전한, 전부의\n③ entire: 전체의\n④ whole: 전체의, 모든","k":"그 보고서는 한 해 전체의 총 방문객 수를 제시했다.","m":0,"s":"The report gave the total number of visitors for the whole year.","h":"total","c":["partial","complete","entire","whole"],"mn":"전체의, 완전한","hk":"total(전체의)의 반대편은 partial(부분적인). complete(완전한), entire(전체의), whole(전체의)은 total(전체의)과 같은 편이라 오답","ex":[["What is [[the total cost]] of the trip?","여행의 [[총비용]]은 얼마니?","total (형) 전체의, 완전한"],["The plan was only [[a partial success]].","그 계획은 [[부분적인 성공]]에 그쳤다.","partial (형) 부분적인, 일부의"],["We got [[partial payment]] for the work.","우리는 그 일에 대해 [[일부 대금]]을 받았다.","partial (형) 부분적인, 일부의"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"mood","a":"1","e":"① mood: 기분, 분위기 (은은한 조명과 부드러운 음악이 그 작은 식당에 편안한 분위기를 만들어 냈다.)","w":"② habit: 습관\n③ temper: 성질, 화\n④ debt: 빚","k":"은은한 조명과 부드러운 음악이 그 작은 식당에 편안한 분위기를 만들어 냈다.","m":0,"s":"The gentle lighting and soft music created a relaxed ________ in the small restaurant.","c":["mood","habit","temper","debt"],"mn":"기분, 분위기","hk":"mood(분위기, 기분)는 장면의 분위기를 만드는 말. habit(습관), temper(성질), debt(빚)는 분위기와 무관","ex":[["She is in [[a good mood]] today.","그녀는 오늘 [[기분이 좋다]]."],["Soft music sets [[the mood]] for dinner.","부드러운 음악이 저녁 식사의 [[분위기]]를 만든다."],["Dad was in [[a bad mood]] after work.","아빠는 퇴근 후 [[기분이 나빴다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"election","a":"election","e":"election 선거","k":"그 시장은 다가오는 선거 전에 시내버스 요금을 낮추겠다고 약속했다.","m":0,"s":"The mayor promised to lower the city bus fares before the coming e______.","mn":"선거","hk":"election(선거)은 elect(뽑다)에 -ion이 붙은 꼴. elect(뽑다) 뒤에 ion을 이어 쓰기","ex":[["The class held [[an election]] for president.","반은 회장을 뽑는 [[선거]]를 했다."],["She won [[the election]] by a large number of votes.","그녀는 큰 표 차이로 [[선거]]에서 이겼다."],["[[Election day]] is a holiday in some countries.","[[선거일]]은 어떤 나라에서는 휴일이다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"rate","a":"3","e":"①비율, 율 / ②비율, 율 / ③요금 / ④비율, 율 [③번만 의미가 다름]","k":"①이 지역의 실업률은 작년에 5퍼센트 아래로 떨어졌다.\n②이 도시의 범죄율은 올해 급격히 올랐다.\n③그 호텔은 일주일 넘게 머무는 손님에게 특별 요금을 제공한다.\n④출생률은 지난 10년 동안 꾸준히 떨어지고 있다.","m":0,"c":["The unemployment rate in this region fell below five percent last year.","The crime rate in this city has risen sharply this year.","The hotel offers a special rate for guests who stay longer than a week.","The birth rate has been dropping steadily for the past ten years."],"hc":"rate|rate|rate|rate","mn":"비율, 율 / 요금","hk":"③번만 rate(요금)이고 나머지는 rate(비율). crime(범죄) rate(범죄율)처럼 앞말과 붙으면 비율, hotel(호텔) rate는 요금","ex":[["[[The crime rate]] has dropped this year.","올해 [[범죄율]]이 떨어졌다.","rate (명) 비율, 율"],["Korea has [[a low birth rate]].","한국은 [[낮은 출생률]]을 갖고 있다.","rate (명) 비율, 율"],["This hotel has [[a cheap rate]] for students.","이 호텔은 학생에게 [[싼 요금]]을 제공한다.","rate (명) 요금"]]}]},{"day":59,"q":[{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"literature","a":"2","e":"② literature: 문학","w":"① geography: 지리학\n③ history: 역사\n④ linguistics: 언어학","m":0,"s":"literature","c":["지리학","문학","역사","언어학"],"mn":"문학","hk":"literature(문학)는 소설과 시 같은 글. geography(지리학), history(역사), linguistics(언어학)와 구분","ex":[["She loves reading [[English literature]].","그녀는 [[영문학]] 읽기를 좋아한다."],["He studies [[Korean literature]] at university.","그는 대학에서 [[한국 문학]]을 공부한다."],["This book is a classic of [[world literature]].","이 책은 [[세계 문학]]의 고전이다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"acute","a":"1,2","e":"① mild: (통증·증상이) 가벼운, 약한\n② chronic: 만성적인 (그 환자는 허리 아래쪽에 극심한 통증을 안고 응급실에 왔다.) / acute(급성의; (통증이) 극심한)의 반의어 — ①은 '극심한↔가벼운', ②는 '급성의↔만성의'.","w":"③ severe: 극심한, 심한\n④ sharp: (통증이) 찌르는 듯한, 날카로운","k":"그 환자는 허리 아래쪽에 극심한 통증을 안고 응급실에 왔다.","m":2,"s":"The patient came to the emergency room with acute pain in his lower back.","h":"acute","c":["mild","chronic","severe","sharp"],"mn":"급성의; (통증이) 극심한","hk":"acute(급성의, 극심한)의 반대편은 mild(가벼운)와 chronic(만성적인), 정답 2개. severe(극심한)와 sharp(날카로운)는 같은 편","ex":[["He went to the hospital with [[acute pain]].","그는 [[극심한 통증]]을 안고 병원에 갔다.","acute (형) 급성의, 극심한"],["I only have [[a mild cold]] today.","나는 오늘 [[가벼운 감기]]에 걸렸을 뿐이다.","mild (형) 가벼운, 약한"],["She suffers from [[chronic pain]] in her back.","그녀는 허리의 [[만성 통증]]에 시달린다.","chronic (형) 만성적인"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"technique","a":"2","e":"② technique: 기술, 기법 (수년간의 연습 끝에 그 바이올린 연주자는 아주 빠른 악절을 연주하는 자기만의 기법을 개발했다.)","w":"① lyric: 가사\n③ rhythm: 리듬, 박자\n④ melody: 선율, 멜로디","k":"수년간의 연습 끝에 그 바이올린 연주자는 아주 빠른 악절을 연주하는 자기만의 기법을 개발했다.","m":0,"s":"After years of practice, the violinist developed her own ________ for playing very fast passages.","c":["lyric","technique","rhythm","melody"],"mn":"기술, 기법","hk":"technique(기법)는 일을 하는 특별한 방법. 연주 기법을 개발했다는 문장에 lyric(가사), rhythm(리듬), melody(선율)는 맞지 않음","ex":[["She learned [[a new technique]] for painting.","그녀는 그림을 위한 [[새로운 기법]]을 배웠다."],["The chef has [[a special technique]] for cooking rice.","그 e(뒤쫓다)와 pursue(추적하다)는 쫓는 쪽이라 반대 방향","ex":[["The family had to [[flee the country]] during the war.","그 가족은 전쟁 중에 [[나라를 떠나 도망쳐야]] 했다."],["Many people [[fled from the fire]].","많은 사람이 [[불을 피해 달아났다]]."],["The thief tried to [[flee the scene]].","도둑은 [[현장에서 달아나려고]] 했다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"labor","a":"4","e":"④ labor: 노동, 수고","w":"① shift: 교대 근무 (시간)\n② wage: 임금\n③ employment: 고용, 취업","m":0,"s":"\"노동, 수고\"","c":["shift","wage","employment","labor"],"mn":"노동, 수고","hk":"labor(노동)는 일하는 수고 그 자체. shift(교대 근무), wage(임금), employment(고용)는 일에 딸린 다른 말","ex":[["Farmers do [[hard labor]] in the fields.","농부들은 들에서 [[힘든 노동]]을 한다."],["The factory uses [[cheap labor]].","그 공장은 [[값싼 노동]]을 쓴다."],["Many people's [[labor]] built this road.","많은 사람의 [[노동]]이 이 길을 만들었다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"reception","a":"3","e":"③ reception: (호텔이나 사무실 안에 있는 책상 / 손님들이 맞이를 받고 안내를 받는) 접수처, 프런트","w":"① lobby: 로비\n② entrance: 입구\n④ ceiling: 천장","k":"호텔이나 사무실 안에 있는 책상 / 손님들이 맞이를 받고 안내를 받는","m":0,"s":"\"the desk inside a hotel or office where guests are greeted and given information\"","c":["lobby","entrance","reception","ceiling"],"mn":"접수처, 프런트","hk":"reception(접수처)은 손님을 맞아 안내하는 책상. lobby(로비), entrance(입구), ceiling(천장)은 책상이 아님","ex":[["Please check in at [[the reception desk]].","[[접수 데스크]]에서 체크인해 주세요."],["The hotel [[reception]] is open all night.","호텔 [[프런트]]는 밤새 열려 있다."],["Leave your key at [[reception]].","열쇠는 [[접수처]]에 두세요."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"flat","a":"flat","e":"flat (형) 평평한 / (형) (타이어가) 바람이 빠진","k":"강 너머의 땅은 언덕 하나 보이지 않을 만큼 완전히 평평했다.\n우리는 타이어에 바람이 빠져서 차를 정비소까지 내내 밀고 가야 했다.","m":0,"s":"The land beyond the river was completely f______, without a single hill in sight.\nWe had to push the car all the way to the garage because of a f______ tire.","mn":"평평한 / 바람이 빠진","hk":"flat(평평한)은 평평한 / 바람이 빠진 두 뜻. flat(평평한) land(땅), flat(
