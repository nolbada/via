 수 있어.",0],["Yes, I'm from France!","맞아, 나는 프랑스에서 왔어!",0],["I live with my family: my mom, dad, and Enzo.","나는 가족과 함께 살아: 엄마, 아빠, 그리고 엔조야.",0],["Enzo is my twin brother.","엔조는 내 쌍둥이 남동생이야.",0],["We are best friends!","우리는 가장 친한 친구야!",0],["My family loves camping.","우리 가족은 캠핑을 아주 좋아해.",0],["We go camping very often.","우리는 아주 자주 캠핑을 가.",0],["leo_121: Bonjour, Sophie!","leo_121: 봉주르, 소피!",1],["k!m: Do you and your brother look like each other?","k!m: 너와 네 남동생은 서로 닮았니?",1]];var RNUM=1;var TITLE_EN="Me and My Three Emojis";var PASS_EN=["Me and My Three Emojis","Jaeho","Hello! My name is Jaeho. I'm from Korea. I'm in the first grade of middle school. Look at my smile! I always smile, so many people like me. In my free time, I play soccer with my friends. I love soccer. I'm in the school soccer club. I also love music. I'm in the singing club too. Both clubs are fun!","im13: Hey, I'm also in middle school! Good luck.","messi10: I like soccer too!","Diego","I'm Diego. I'm from Mexico. I have a cat. Her name is Bella. (Meow!) She is so sweet! I often take pictures of Bella and post them online. Also, I like tacos. I sometimes make them with my mom.","luv_cat: I love cats too!","0905jm: Bella","Amara","I'm Amara. I live in Thailand. I have a warm heart. I often help other people and feel happy. I like dancing and exercise. I practice dance moves every day. I also go to the gym for exercise. I feel so healthy!","p0wer: Great! What do you do for exercise?","Sophie","Hi! I'm Sophie. Can you guess my country? You can see the baguette. Yes, I'm from France! I live with my family: my mom, dad, and Enzo. Enzo is my twin brother. We are best friends! My family loves camping. We go camping very often.","leo_121: Bonjour, Sophie!","k!m: Do you and your brother look like each other?"];var PASS_KO=["나와 나의 세 가지 이모티콘","재호","안녕! 내 이름은 재호야. 나는 한국에서 왔어. 나는 중학교 1학년이야. 내 미소를 봐! 나는 항상 웃어서, 많은 사람들이 나를 좋아해. 여가 시간에, 나는 친구들과 축구를 해. 나는 축구를 아주 좋아해. 나는 학교 축구부에 속해 있어. 나는 음악도 아주 좋아해. 나는 합창부에도 속해 있어. 두 동아리 모두 재미있어!","im13: 와, 나도 중학생이야! 행운을 빌어.","messi10: 나도 축구 좋아해!","디에고","나는 디에고야. 나는 멕시코에서 왔어. 나는 고양이가 한 마리 있어. 그녀의 이름은 벨라야. (야옹!) 그녀는 정말 사랑스러워! 나는 자주 벨라의 사진을 찍어서 온라인에 올려. 또한, 나는 타코를 좋아해. 나는 가끔 엄마와 함께 타코를 만들어.","luv_cat: 나도 고양이를 정말 좋아해!","0905jm: 벨라","아마라","나는 아마라야. 나는 태국에 살아. 나는 따뜻한 마음을 가졌어. 나는 자주 다른 사람들을 도우며 행복함을 느껴. 나는 춤과 운동을 좋아해. 나는 매일 춤 동작을 연습해. 나는 운동하러 체육관에도 가. 나는 정말 건강하다고 느껴!","p0wer: 멋지다! 너는 운동으로 무엇을 하니?","소피","안녕! 나는 소피야. 내 나라가 어디인지 맞혀 볼래? 너는 바게트를 볼 수 있어. 맞아, 나는 프랑스에서 왔어! 나는 가족과 함께 살아: 엄마, 아빠, 그리고 엔조야. 엔조는 내 쌍둥이 남동생이야. 우리는 가장 친한 친구야! 우리 가족은 캠핑을 아주 좋아해. 우리는 아주 자주 캠핑을 가.","leo_121: 봉주르, 소피!","k!m: 너와 네 남동생은 서로 닮았니?"];var DG=[{"qs":[{"n":1,"q":"다음 대화의 내용과 일치하는 것은?","o":["Kate doesn't like sports.","Soccer is Kate's favorite sport.","Kate and Dohun talk about their favorite sports.","Kate and Dohun like the same sport.","Dohun doesn't like soccer."],"a":2,"ans":"Kate and Dohun talk about their favorite sports.","evs":[["B: Do you like sports, Kate?","케이트, 너는 운동을 좋아하니?"],["G: Yes, I like sports. Tennis is my favorite sport. What about you, Dohun?","응, 나는 운동을 좋아해. 테니스가 내가 가장 좋아하는 운동이야. 도훈아, 너는 어때?"],["B: I love soccer.","나는 축구를 아주 좋아해."]],"ev":["B: Do you like sports, Kate?","케이트, 너는 운동을 좋아하니?"],"ow":["오답 ✕ — 대화에서 케이트는 'Yes, I like sports.'(응, 나는 운동을 좋아해.)라고 했는데, 이 보기는 운동을 좋아하지 않는다고 해서 틀림.","오답 ✕ — 케이트는 'Tennis is my favorite sport.'(테니스가 내가 가장 좋아하는 운동이야.)라고 했는데, 이 보기는 축구가 케이트가 제일 좋아하는 운동이라고 해서 틀림. 축구는 도훈이가 좋아하는 운동이다.","정답 ○ — 'Do you like sports, Kate?'(케이트, 너는 운동을 좋아하니?)로 시작해서 케이트는 테니스를, 도훈이는 축구를 이야기하므로 두 사람이 좋아하는 운동에 대해 이야기하는 것이 맞음.","오답 ✕ — 케이트는 'Tennis is my favorite sport.'(테니스)라고 했고 도훈이는 'I love soccer.'(나는 축구를 아주 좋아해.)라고 해서 좋아하는 운동이 서로 다르므로 틀림.","오답 ✕ — 도훈이는 'I love soccer.'(나는 축구를 아주 좋아해.)라고 했는데, 이 보기는 축구를 좋아하지 않는다고 해서 틀림."],"memo":["정답 ③: 케이트와 도훈이는 각자 좋아하는 운동에 대해 이야기한다.","근거: Do you like sports, Kate?(케이트, 너는 운동을 좋아하니?)","함정: ④는 테니스(케이트)와 축구(도훈)가 서로 달라서 ✕"],"why":"두 사람이 서로 좋아하는 운동(테니스, 축구)을 묻고 답하는 대화이다."}],"dlg":[["B","Do you like sports, Kate?","케이트, 너는 운동을 좋아하니?"],["G","Yes, I like sports. Tennis is my favorite sport. What about you, Dohun?","응, 나는 운동을 좋아해. 테니스가 내가 가장 좋아하는 운동이야. 도훈아, 너는 어때?"],["B","I love soccer.","나는 축구를 아주 좋아해."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하는 것은?","o":["Jenny와 Peter는 1반이다.","Jenny는 Peter와 다른 반이다.","Peter와 Jenny는 처음 만났다.","Peter는 Jenny에게 먼저 인사했다.","Jenny와 Peter의 수업은 3시에 시작한다."],"a":2,"ans":"Peter와 Jenny는 처음 만났다.","evs":[["G: Hi, I'm Jenny! Nice to meet you.","안녕, 나는 제니야! 만나서 반가워."],["B: Hi, Jenny. I'm Peter. Nice to meet you too!","안녕, 제니야. 나는 피터야. 나도 만나서 반가워!"]],"ev":["G: Hi, I'm Jenny! Nice to meet you.","안녕, 나는 제니야! 만나서 반가워."],"ow":["오답 ✕ — 대화에서 피터는 'Yes, I'm in class 3.'(응, 나는 3반이야.)라고 했는데, 이 보기는 1반이라고 해서 틀림.","오답 ✕ — 제니가 'Are you in this class?'(너도 이 반이니?)라고 묻자 피터가 'Yes'라고 답했으므로 두 사람은 같은 반인데, 이 보기는 다른 반이라고 해서 틀림.","정답 ○ — 서로 'Nice to meet you.'(만나서 반가워.)라고 인사하고 자기소개(I'm Jenny. / I'm Peter.)를 하므로 처음 만난 사이가 맞음.","오답 ✕ — 먼저 인사한 사람은 제니이다. 대화가 'Hi, I'm Jenny! Nice to meet you.'(안녕, 나는 제니야! 만나서 반가워.)로 시작하므로 틀림.","오답 ✕ — 'I'm in class 3.'의 class 3은 '3반'이라는 뜻이지 수업이 3시에 시작한다는 말이 아니다. 대화에 수업 시작 시각에 대한 언급은 없음."],"memo":["정답 ③: 제니와 피터는 처음 만났다.","근거: Nice to meet you.(만나서 반가워.) — 서로 처음 하는 인사","함정: ⑤ class 3은 '3반'이지 '3시'가 아니다. ✕"],"why":"서로 'Nice to meet you.'라고 인사하며 자기소개를 하니 처음 만난 사이이다."}],"dlg":[["G","Hi, I'm Jenny! Nice to meet you.","안녕, 나는 제니야! 만나서 반가워."],["B","Hi, Jenny. I'm Peter. Nice to meet you too!","안녕, 제니야. 나는 피터야. 나도 만나서 반가워!"],["G","Are you in this class?","너도 이 반이니?"],["B","Yes, I'm in class 3. Let's go in.","응, 나는 3반이야. 같이 들어가자."]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하는 것은?","o":["지호와 안젤라는 전에 만난 적이 있다.","안젤라는 한국 음식을 좋아한다.","지호가 가장 좋아하는 음식은 비빔밥이다.","안젤라는 점심으로 피자를 먹자고 했다.","두 사람은 도서관에 가기로 했다."],"a":1,"ans":"안젤라는 한국 음식을 좋아한다.","evs":[["G: Yes. I like Korean food. Bibimbap is my favorite food. What about you?","응. 나는 한국 음식을 좋아해. 비빔밥은 내가 가장 좋아하는 음식이야. 너는 어때?"],["B: My favorite food is pizza.","내가 가장 좋아하는 음식은 피자야."]],"ev":["G: Yes. I like Korean food. Bibimbap is my favorite food. What about you?","응. 나는 한국 음식을 좋아해. 비빔밥은 내가 가장 좋아하는 음식이야. 너는 어때?"],"ow":["오답 ✕ — 두 사람은 'Nice to meet you.'(만나서 반가워.)라고 인사하며 처음 만났는데, 이 보기는 전에 만난 적이 있다고 해서 틀림.","정답 ○ — 안젤라가 'Yes. I like Korean food.'(응. 나는 한국 음식을 좋아해.)라고 말했으므로 맞는 설명이다.","오답 ✕ — 비빔밥은 안젤라가 가장 좋아하는 음식이다. 지호는 'My favorite food is pizza.'(내가 가장 좋아하는 음식은 피자야.)라고 했으므로 틀림.","오답 ✕ — 피자는 지호가 가장 좋아하는 음식이고, 점심 메뉴는 'Bibimbap!'(비빔밥이야!)이다. 안젤라가 피자를 먹자고 한 적은 없음.","오답 ✕ — 지호가 'How about going to the cafeteria?'(구내식당에 가는 게 어때?)라고 제안했으므로 도서관이 아니라 구내식당에 가기로 한 것이다."],"memo":["정답 ②: 안젤라는 한국 음식을 좋아한다.","근거: I like Korean food.(나는 한국 음식을 좋아해.)","함정: ③ 비빔밥은 안젤라, 피자는 지호가 가장 좋아하는 음식 ✕"],"why":"안젤라는 한국 음식(비빔밥)을, 지호는 피자를 가장 좋아한다."},{"n":4,"q":"다음은 위 대화를 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["meet - food","meet - subject","call - food","visit - song","help - sport"],"a":0,"ans":"meet - food","evs":[["B: Hello, I'm Jiho. Nice to meet you.","안녕, 나는 지호야. 만나서 반가워."],["G: Yes. I like Korean food. Bibimbap is my favorite food. What about you?","응. 나는 한국 음식을 좋아해. 비빔밥은 내가 가장 좋아하는 음식이야. 너는 어때?"]],"ev":["B: Hello, I'm Jiho. Nice to meet you.","안녕, 나는 지호야. 만나서 반가워."],"ow":["정답 ○ — 'Nice to meet you.'(만나서 반가워.)로 처음 만났고(meet), 'Bibimbap is my favorite food.'(비빔밥은 내가 가장 좋아하는 음식이야.)처럼 좋아하는 음식(food)을 이야기하므로 맞음.","오답 ✕ — meet은 맞지만 두 사람이 좋아하는 과목에 대해 이야기하지는 않는다. 'My favorite food is pizza.'(내가 가장 좋아하는 음식은 피자야.)처럼 음식 이야기이므로 subject는 틀림.","오답 ✕ — food는 맞지만 두 사람이 서로를 부르는 것(call)이 아니라 'Nice to meet you.'(만나서 반가워.)라고 처음 만나 인사하는 것이므로 call은 틀림.","오답 ✕ — 대화에 노래에 대한 언급은 없고 'Bibimbap is my favorite food.'(비빔밥은 내가 가장 좋아하는 음식이야.)처럼 음식 이야기를 한다. 또 서로 방문(visit)하는 내용도 없음.","오답 ✕ — 'Nice to meet you.'(만나서 반가워.)는 서로 돕는(help) 장면이 아니고, 좋아하는 운동(sport)에 대한 언급도 없으므로 틀림."],"memo":["정답 meet - food: 처음 만나서 좋아하는 음식 이야기를 한다.","근거: Nice to meet you.(만나서 반가워.) / Bibimbap is my favorite food.(비빔밥은 내가 가장 좋아하는 음식이야.)","함정: 좋아하는 과목·노래·운동 이야기는 나오지 않는다."],"why":"처음 만난 두 사람이 서로 좋아하는 음식(비빔밥, 피자)을 이야기한다.","sum":"Jiho and Angela (A)______ for the first time and talk about their favorite (B)______.","lab":"완성된 요약문 : "}],"dlg":[["B","Hello, I'm Jiho. Nice to meet you.","안녕, 나는 지호야. 만나서 반가워."],["G","Hi, Jiho. I'm Angela. Nice to meet you too.","안녕, 지호야. 나는 안젤라야. 나도 만나서 반가워."],["B","It's lunchtime! How about going to the cafeteria?","점심시간이다! 구내식당에 가는 게 어때?"],["G","Okay. What is for lunch today?","좋아. 오늘 점심은 뭐야?"],["B","Bibimbap! Do you like bibimbap?","비빔밥이야! 너는 비빔밥 좋아하니?"],["G","Yes. I like Korean food. Bibimbap is my favorite food. What about you?","응. 나는 한국 음식을 좋아해. 비빔밥은 내가 가장 좋아하는 음식이야. 너는 어때?"],["B","My favorite food is pizza.","내가 가장 좋아하는 음식은 피자야."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Sam은 캐나다 출신이다.","민정이와 Sam은 처음 만났다.","민정이는 Ladybug를 좋아한다.","Sam은 Ladybug의 CD를 가지고 있다.","민정이와 Sam이 가장 좋아하는 노래는 같다."],"a":4,"ans":"민정이와 Sam이 가장 좋아하는 노래는 같다.","evs":[["B: My favorite song is \"Summer Days.\" I like the words of the song.","내가 가장 좋아하는 노래는 \"Summer Days\"야. 나는 그 노래의 가사가 좋아."],["G: Of course! I like her music so much. What is your favorite song?","물론이지! 나는 그녀의 음악을 정말 좋아해. 네가 가장 좋아하는 노래는 뭐야?"]],"ev":["B: My favorite song is \"Summer Days.\" I like the words of the song.","내가 가장 좋아하는 노래는 \"Summer Days\"야. 나는 그 노래의 가사가 좋아."],"ow":["오답 ✕ — 이 보기는 대화와 일치한다. 샘이 'I'm from Canada.'(나는 캐나다에서 왔어.)라고 말했으므로 틀린 설명이 아님.","오답 ✕ — 이 보기는 대화와 일치한다. 'Nice to meet you.'(만나서 반가워.)라고 서로 인사하며 자기소개를 하니 처음 만난 것이 맞다.","오답 ✕ — 이 보기는 대화와 일치한다. 민정이가 'I like her music so much.'(나는 그녀의 음악을 정말 좋아해.)라고 했으므로 레이디버그를 좋아하는 것이 맞다.","오답 ✕ — 이 보기는 대화와 일치한다. 민정이가 'you have a Ladybug CD'(너 레이디버그 CD를 가지고 있네)라고 말했으므로 샘이 CD를 가진 것이 맞다.","정답 ○ — 샘이 가장 좋아하는 노래는 \"Summer Days\"라고 나오지만, 민정이가 가장 좋아하는 노래는 대화에 나오지 않는다(What is your favorite song?에 대한 민정이의 답이 없음). 그래서 같다고 할 수 없으므로 일치하지 않는 보기이다."],"memo":["정답 ⑤: 민정이가 가장 좋아하는 노래는 대화에 나오지 않는다(샘만 Summer Days).","근거: My favorite song is \"Summer Days.\"(샘이 가장 좋아하는 노래)","함정: ①~④는 모두 대화에 나오는 내용이라 일치한다."],"why":"샘의 노래만 나오고 민정이의 노래는 나오지 않아서 '같다'는 보기가 일치하지 않는다."}],"dlg":[["G","Hi, I'm Minjeong. Nice to meet you.","안녕, 나는 민정이야. 만나서 반가워."],["B","Hi, Minjeong. Nice to meet you too. I'm Sam.","안녕, 민정아. 나도 만나서 반가워. 나는 샘이야."],["G","Where are you from, Sam?","샘, 너는 어디에서 왔니?"],["B","I'm from Canada.","나는 캐나다에서 왔어."],["G","I see. Oh, you have a Ladybug CD. Are you a fan of Ladybug?","그렇구나. 어, 너 레이디버그 CD를 가지고 있네. 너는 레이디버그의 팬이니?"],["B","Yeah! She is my favorite singer. Do you like Ladybug too?","응! 그녀는 내가 가장 좋아하는 가수야. 너도 레이디버그를 좋아하니?"],["G","Of course! I like her music so much. What is your favorite song?","물론이지! 나는 그녀의 음악을 정말 좋아해. 네가 가장 좋아하는 노래는 뭐야?"],["B","My favorite song is \"Summer Days.\" I like the words of the song.","내가 가장 좋아하는 노래는 \"Summer Days\"야. 나는 그 노래의 가사가 좋아."]]}];var BG=[{"qs":[{"n":6,"q":"윗글을 읽고 재호에 대해 알 수 있는 내용은?","o":["재호의 애완동물","재호의 형제관계","재호의 동호회","재호의 학교명","재호의 성적"],"a":2,"ans":"재호의 동호회","evs":[["I'm in the school soccer club.","나는 학교 축구부에 속해 있어."],["I'm in the singing club too.","나는 합창부에도 속해 있어."]],"ev":["I'm in the school soccer club.","나는 학교 축구부에 속해 있어."],"ow":["오답 ✕ — 글에 애완동물에 대한 이야기는 없다. 가장 가까운 문장은 'I play soccer with my friends.'(친구들과 축구를 해.)인데 동물 이야기가 아님.","오답 ✕ — 형제나 자매에 대한 언급이 글에 없다. 'My name is Jaeho.'(내 이름은 재호야.)처럼 자기소개만 나온다. (엔조 쌍둥이 이야기는 소피의 글임)","정답 ○ — 'I'm in the school soccer club.'(나는 학교 축구부에 속해 있어.)와 'I'm in the singing club too.'(나는 합창부에도 속해 있어.)에서 재호의 동호회를 알 수 있음.","오답 ✕ — 'I'm in the first grade of middle school.'(나는 중학교 1학년이야.)라고만 했고 학교 이름은 나오지 않으므로 알 수 없음.","오답 ✕ — 'grade'는 여기서 '학년'이라는 뜻이다. 'I'm in the first grade of middle school.'(중학교 1학년이야.)일 뿐 성적 이야기는 아님."],"memo":["정답 ③: 재호의 동호회(축구부, 합창부)를 알 수 있다.","근거: I'm in the school soccer club.(나는 학교 축구부에 속해 있어.)","함정: ⑤ grade는 '성적'이 아니라 '학년'이다. ✕"],"why":"재호가 축구부와 합창부 두 동아리에 속해 있다는 것을 알 수 있다."},{"n":7,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Jaeho is from Korea.","Jaeho is in two school clubs.","Jaeho and messi10 both love soccer.","Jaeho and im13 are in the same class.","Jaeho is in the first grade of middle school."],"a":3,"ans":"Jaeho and im13 are in the same class.","evs":[["im13: Hey, I'm also in middle school!","im13: 와, 나도 중학생이야!"],["messi10:  var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
