re이고 뒤가 their helmets예요. are 뒤에 어떤 모양이 와야 '~해야 한다'는 뜻이 되는지 생각해 보세요.", "h2": "「be동사 + to부정사」는 의무(~해야 한다), 예정, 가능, 운명, 의지를 나타내요. 자전거를 탈 때 헬멧을 써야 한다는 규칙이니 의무의 뜻이에요.", "why": "「be + to부정사」가 의무(~해야 한다)를 나타내서 are to wear(원형 wear 쓰다)가 돼요.", "opts": [{"n": "①", "en": "wear", "ko": "쓰다", "ok": false, "why": "are 뒤에 동사원형만 오면 문장이 이어지지 않아요."}, {"n": "②", "en": "wore", "ko": "썼다", "ok": false, "why": "과거형이라 are와 함께 쓸 수 없어요."}, {"n": "③", "en": "to wear", "ko": "써야 하는", "ok": true, "why": "are to wear로 '~해야 한다'는 의무가 돼서 맞아요."}, {"n": "④", "en": "be wearing", "ko": "쓰고 있는", "ok": false, "why": "are 뒤에 be가 또 와서 틀려요."}, {"n": "⑤", "en": "to wearing", "ko": "쓰는 것에", "ok": false, "why": "to 뒤에 -ing가 오면 틀려요. 동사원형이 와야 해요."}], "pencil": "「be + to부정사」는 예정, ___ 등을 나타낸다", "pencilKey": "의무", "page": 49, "sec": "s1", "k": "pick", "tr": "사람들은 자전거를 탈 때 헬멧을 ___.", "ex": ["helmet = 헬멧", "ride a bike = 자전거를 타다"]}, {"id": "S1-07", "step": 1, "no": 7, "qtype": "유형 02 「be + to부정사」", "type": "mc", "ans": "②", "concept": ["025-H1"], "gap": "", "words": [["cousin", "사촌"], ["stay", "머무르다"], ["seem", "~인 것 같다"], ["be likely to", "~할 것 같다"], ["be able to", "~할 수 있다"]], "h1": "밑줄 친 is to가 '예정', '의무', '가능' 중 어떤 뜻인지 먼저 정하세요. 뒤에 a month(한 달 동안)가 있어요.", "h2": "「be + to부정사」가 예정(~할 예정이다)일 때는 be going to로 바꿔 쓸 수 있어요.", "why": "사촌이 한 달 머무를 예정이라는 뜻이라서 be going to와 같아요.", "opts": [{"n": "①", "en": "seems to", "ko": "~인 것 같다", "ok": false, "why": "추측의 뜻이라 '예정'과 달라요."}, {"n": "②", "en": "is going to", "ko": "~할 예정이다", "ok": true, "why": "예정을 나타내서 is to와 바꿔 쓸 수 있어요."}, {"n": "③", "en": "is likely to", "ko": "~할 것 같다", "ok": false, "why": "가능성을 말하는 표현이라 '예정'과 달라요."}, {"n": "④", "en": "is able to", "ko": "~할 수 있다", "ok": false, "why": "능력의 뜻이라 '예정'과 달라요."}, {"n": "⑤", "en": "would like to", "ko": "~하고 싶다", "ok": false, "why": "바람의 뜻이라 '예정'과 달라요."}], "pencil": "예정을 나타내는 「be + to부정사」는 be ___ to로 바꿔 쓸 수 있다", "pencilKey": "going", "page": 49, "sec": "s1", "k": "pick", "tr": "내 사촌은 여기에 한 달 동안 머물 ___.", "ex": ["cousin = 사촌", "stay = 머물다"]}, {"id": "S1-08", "step": 1, "no": 8, "qtype": "유형 02 「be + to부정사」", "type": "mc", "ans": "⑤", "concept": ["025-H1"], "gap": "", "words": [["report", "알리다, 보고하다"], ["take off", "이륙하다"], ["meet", "만나다"], ["hand in", "제출하다"], ["essay", "에세이"]], "h1": "<보기>의 are to가 어떤 뜻인지 먼저 해석해 보세요. 그다음 각 보기의 be to가 어떤 뜻인지 하나씩 따져요.", "h2": "「be + to부정사」는 예정, 의무, 가능, 운명, 의지로 나뉘어요. 앞뒤 내용을 보고 뜻을 골라요.", "why": "<보기>는 '문제를 알려야 한다'는 의무예요. ⑤도 '금요일까지 제출해야 한다'라는 의무라서 같아요.", "opts": [{"n": "①", "en": "The airplane is to take off in a minute.", "ko": "그 비행기는 곧 이륙할 예정이다.", "ok": false, "why": "예정이라서 의무인 <보기>와 달라요."}, {"n": "②", "en": "She was never to meet her child again.", "ko": "그녀는 다시는 자기 아이를 만나지 못할 운명이었다.", "ok": false, "why": "운명이라서 달라요."}, {"n": "③", "en": "No one was to be seen in the street.", "ko": "거리에서 아무도 보이지 않았다.", "ok": false, "why": "가능(~될 수 있다)이라서 달라요."}, {"n": "④", "en": "If you are to win, you should practice harder.", "ko": "네가 이길 작정이라면 더 열심히 연습해야 한다.", "ok": false, "why": "의지(~할 작정이다)라서 달라요."}, {"n": "⑤", "en": "You are to hand in the essay by Friday.", "ko": "너는 금요일까지 에세이를 제출해야 한다.", "ok": true, "why": "의무(~해야 한다)라서 <보기>와 같아요."}], "pencil": "「be + to부정사」가 '~해야 한다'이면 ___의 뜻이다", "pencilKey": "의무", "page": 49, "sec": "s1", "k": "pick", "tr": "<보기> 너는 금요일까지 에세이를 (제출하다) ___.\n① 그 비행기는 곧 (이륙하다) ___.\n② 그녀는 자기 아이를 다시는 (만나다) ___.\n③ 거리에서 아무도 (보이다) ___.\n④ 네가 이길 ___, 더 열심히 연습해야 한다.\n⑤ 너는 금요일까지 에세이를 (제출하다) ___.", "ex": ["take off = 이륙하다", "in a minute = 곧"]}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 03 부사적 용법", "type": "mc", "ans": "③", "concept": ["025"], "gap": "", "words": [["fashion design", "패션 디자인"], ["study", "공부하다"]], "h1": "'왜 이탈리아에 갔나요?'라는 질문에 대한 대답이에요. 빈칸이 이유(~하려고)를 말하는 자리인지 생각해 보세요.", "h2": "'~하기 위해서'라는 목적은 to + 동사원형으로 말해요. to 뒤에는 -ing나 to be 같은 다른 모양이 올 수 없어요.", "why": "이탈리아에 간 이유(목적)를 말하므로 to study(원형 study 공부하다)가 맞아요.", "opts": [{"n": "①", "en": "study", "ko": "공부하다", "ok": false, "why": "동사원형만 있어서 '공부하려고'라는 목적 표현이 안 돼요."}, {"n": "②", "en": "studying", "ko": "공부하는 것", "ok": false, "why": "-ing는 '~하러'의 목적을 나타내지 못해요."}, {"n": "③", "en": "to study", "ko": "공부하기 위해서", "ok": true, "why": "목적을 나타내는 to부정사라서 맞아요."}, {"n": "④", "en": "to studying", "ko": "공부하는 것에", "ok": false, "why": "to 뒤에 -ing를 쓰면 틀려요."}, {"n": "⑤", "en": "to be study", "ko": "공부 되기 위해서", "ok": false, "why": "to be 뒤에 동사원형 study를 쓸 수 없어요."}], "pencil": "'~하기 위해서'는 ___ + 동사원형으로 쓴다", "pencilKey": "to", "page": 50, "sec": "s1", "k": "pick", "tr": "A: 너는 왜 이탈리아에 갔어?\nB: 나는 패션 디자인을 ___ 거기에 갔어.", "ex": []}, {"id": "S1-10", "step": 1, "no": 10, "qtype": "유형 03 부사적 용법", "type": "mc", "ans": "⑤", "concept": ["025", "025-2"], "gap": "", "words": [["return", "반납하다"], ["get", "얻다"], ["seat", "자리"], ["achieve", "이루다"], ["goal", "목표"], ["run into", "우연히 만나다"]], "h1": "밑줄 친 to부정사가 '~하기 위해서'인지 다른 뜻인지 하나씩 해석해 보세요.", "h2": "다섯 문장 모두 부사적 용법이에요. 목적이면 '~하기 위해서'로, 감정이나 판단 같은 다른 뜻이면 그 뜻으로 읽혀요. 앞에 감정 형용사가 있는 문장이 있는지 살펴보세요.", "why": "⑤는 '우연히 만나서 놀랐다'는 감정의 원인이에요. 나머지는 모두 '~하기 위해서'라는 목적이에요.", "opts": [{"n": "①", "en": "I went to the library to return books.", "ko": "나는 책을 반납하러 도서관에 갔다.", "ok": false, "why": "'반납하기 위해서'라는 목적이에요."}, {"n": "②", "en": "Emma left home early to get a good seat.", "ko": "Emma는 좋은 자리를 얻으려고 일찍 집을 나섰다.", "ok": false, "why": "'얻기 위해서'라는 목적이에요."}, {"n": "③", "en": "Janet turned on the computer to write a report.", "ko": "Janet은 보고서를 쓰려고 컴퓨터를 켰다.", "ok": false, "why": "'쓰기 위해서'라는 목적이에요."}, {"n": "④", "en": "To achieve your goals, you have to work hard.", "ko": "목표를 이루려면 열심히 일해야 한다.", "ok": false, "why": "'이루기 위해서'라는 목적이에요."}, {"n": "⑤", "en": "I was so surprised to run into an old friend of mine.", "ko": "나는 옛 친구를 우연히 만나서 매우 놀랐다.", "ok": true, "why": "감정(surprised)의 원인을 말해서 나머지 넷과 달라요."}], "pencil": "감정을 나타내는 형용사 뒤의 to부정사는 감정의 ___을 나타낸다", "pencilKey": "원인", "page": 50, "sec": "s1", "k": "pick", "tr": "① 나는 책을 (반납하다) ___ 도서관에 갔다.\n② Emma는 좋은 자리를 (얻다) ___ 일찍 집을 나섰다.\n③ Janet은 보고서를 (쓰다) ___ 컴퓨터를 켰다.\n④ 목표를 (이루다) ___ 너는 열심히 노력해야 한다.\n⑤ 나는 옛 친구를 (우연히 만나다) ___ 매 why": "지금 추측하는데 잘못은 이미 지난 일이라서 seems to have done(원형 do 하다)이에요.", "opts": [{"n": "①", "en": "seems to do", "ko": "~하는 것 같다", "ok": false, "why": "현재의 일이라 지난 일(did)을 나타내지 못해요."}, {"n": "②", "en": "seems to doing", "ko": "~하는 중인 것 같다", "ok": false, "why": "to 뒤에 -ing를 쓸 수 없어요."}, {"n": "③", "en": "seemed to do", "ko": "~하는 것 같았다", "ok": false, "why": "seemed(과거)로 시제가 달라요."}, {"n": "④", "en": "seems to have done", "ko": "~한 것 같다", "ok": true, "why": "seems(현재)와 앞선 일을 나타내는 완료부정사가 맞아요."}, {"n": "⑤", "en": "seemed to have done", "ko": "~했던 것 같았다", "ok": false, "why": "seemed(과거)로 시제가 달라요."}], "pencil": "앞선 일을 말하는 완료부정사는 to + ___ + p.p.이다", "pencilKey": "have", "page": 51, "sec": "s1", "k": "pick", "tr": "Robin이 뭔가 잘못 ___ 것 같다.\n(아래 문장도 같은 뜻이에요.)", "ex": []}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 05 seem to", "type": "write", "ans": "(1) It seems, cares (2) It seemed, had lost", "concept": ["065"], "gap": "", "words": [["care about", "신경 쓰다"], ["lose", "잃어버리다"], ["key", "열쇠"]], "h1": "(1)과 (2)는 주어 + seem to 문장을 It seems that 문장으로 바꾸는 문제예요. seem의 시제를 먼저 확인하세요.", "h2": "(1) 단순한 to부정사라서 that절의 시제가 seem과 같아요. (2) 완료부정사(to have + p.p.)라서 that절은 한 시제 앞선 과거완료예요.", "why": "(1) 단순부정사이면 It seems that no one cares(원형 care 신경 쓰다)예요. (2) 완료부정사이면 It seemed that David had lost(원형 lose 잃어버리다)예요.", "opts": [], "pencil": "완료부정사는 that절에서 ___완료로 바꾼다", "pencilKey": "과거", "page": 51, "sec": "s1", "k": "self", "acc": [], "tr": "(1) 아무도 그 문제에 신경 쓰지 않는 것 같다.\n(2) David는 자동차 열쇠를 ___ 것 같았다.\n(각각 아래 문장도 같은 뜻이에요.)", "ex": []}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 05 seem to", "type": "write", "ans": "You seemed to be surprised.", "concept": ["065"], "gap": "", "words": [["seem", "~인 것 같다"], ["surprised", "놀란"]], "h1": "주어를 you로 시작하라는 지시예요. It seemed that 뒤의 내용(you were surprised)에서 주어를 앞으로 꺼내 보세요.", "h2": "It seemed that 주어 + 동사는 「주어 + seemed to + 동사원형」으로 바꿔요. that절의 were가 seemed와 같은 때의 일인지 보세요.", "why": "seemed와 were가 같은 때(과거)라서 단순한 to be(원형 be ~이다)를 써서 You seemed to be surprised가 돼요.", "opts": [], "pencil": "It seemed that 주어 + 동사는 「주어 + seemed to + ___」로 바꾼다", "pencilKey": "동사원형", "page": 51, "sec": "s1", "k": "self", "acc": [], "tr": "네가 놀란 것 같았다.\n이 문장을 you로 시작하는 문장으로 바꾸는 문제예요.", "ex": []}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "유형 01, 03 형용사적 용법 / 부사적 용법", "type": "mc", "ans": "①", "concept": ["024", "025"], "gap": "", "words": [["right", "권리"], ["freely", "자유롭게"], ["ignore", "무시하다"], ["rude", "무례한"], ["handwriting", "글씨"], ["impossible", "불가능한"]], "h1": "밑줄 친 to부정사가 명사를 꾸미는지, 동사나 형용사를 꾸미는지 다섯 개를 하나씩 확인하세요.", "h2": "명사를 '~할'로 꾸미면 형용사적 용법이에요. 감정, 목적, 판단의 근거, 형용사 꾸밈은 부사적 용법이에요. 하나만 다른 쪽이에요.", "why": "①의 to speak(원형 speak 말하다)는 명사 right(권리)를 꾸미는 형용사적 용법이고, 나머지는 모두 부사적 용법이에요.", "opts": [{"n": "①", "en": "Everyone has a right to speak freely.", "ko": "모든 사람은 자유롭게 말할 권리가 있다.", "ok": true, "why": "right(권리)를 '말할'로 꾸미는 형용사적 용법이라서 다른 것이에요."}, {"n": "②", "en": "Alex was happy to return to his country.", "ko": "Alex는 그의 나라로 돌아가서 기뻤다.", "ok": false, "why": "감정(happy)의 원인을 말하는 부사적 용법이에요."}, {"n": "③", "en": "I went to the bank to open a bank account.", "ko": "나는 계좌를 열려고 은행에 갔다.", "ok": false, "why": "목적을 말하는 부사적 용법이에요."}, {"n": "④", "en": "He must be rude to ignore the elderly man.", "ko": "그는 그 노인을 무시하다니 무례함에 틀림없다.", "ok": false, "why": "판단의 근거를 말하는 부사적 용법이에요."}, {"n": "⑤", "en": "Danny's handwriting is impossible to read.", "ko": "Danny의 글씨는 읽기가 불가능하다.", "ok": false, "why": "형용사 impossible을 꾸미는 부사적 용법이에요."}], "pencil": "명사를 '~할'로 꾸미는 to부정사는 ___ 용법이다", "pencilKey": "형용사적", "page": 52, "sec": "s2", "k": "pick", "tr": "① 모든 사람은 자유롭게 (말하다) ___ 권리가 있다.\n② Alex는 그의 나라로 (돌아가다) ___ 기뻤다.\n③ 나는 계좌를 (열다) ___ 은행에 갔다.\n④ 그는 그 노인을 (무시하다) ___ 무례한 것이 틀림없다.\n⑤ Danny의 글씨는 (읽다) ___ 불가능하다.", "ex": ["right = 권리", "rude = 무례한", "handwriting = 글씨"]}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "유형 01, 03 형용사적 용법 / 부사적 용법", "type": "mc", "ans": "⑤", "concept": ["024", "025-2"], "gap": "", "words": [["buy", "사 주다"], ["baby", "아기"], ["toy", "장난감"], ["rest", "쉬다"], ["flight", "비행"], ["recover", "회복하다"], ["play with", "~을 가지고 놀다"]], "h1": "첫 문장은 장난감을 '가지고 놀'이라는 뜻이고, 둘째 문장은 비행에서 '회복하려고'라는 뜻이에요. 두 빈칸을 따로 따져 보세요.", "h2": "꾸밈을 받는 명사(toy)가 전치사의 목적어이면 전치사를 남겨요('장난감을 가지고 놀다'는 play with a toy). 두 번째는 '~하기 위해'의 목적이라 to + 동사원형이에요.", "why": "a toy to play with(원형 play 놀다)로 전치사 with를 남기고, '회복하려고'는 to recover(원형 recover 회복하다)예요.", "opts": [{"n": "①", "en": "to play - to recover", "ko": "놀 - 회복하기 위해", "ok": false, "why": "play 뒤에 전치사 with가 빠졌어요."}, {"n": "②", "en": "to play - recovering", "ko": "놀 - 회복하는 것", "ok": false, "why": "첫 칸에 with가 빠졌고, 둘째 칸의 -ing는 목적의 뜻이 안 돼요."}, {"n": "③", "en": "to play in - recovered", "ko": "안에서 놀 - 회복했다", "ok": false, "why": "toy와 어울리는 전치사는 in이 아니라 with고, recovered는 목적이 아니에요."}, {"n": "④", "en": "to play at - to recover", "ko": "~에서 놀 - 회복하기 위해", "ok": false, "why": "at은 '장난감을 가지고 놀다'에 맞지 않아요."}, {"n": "⑤", "en": "to play with - to recover", "ko": "가지고 놀 - 회복하기 위해", "ok": true, "why": "toy는 play with(~을 가지고 놀다)이고 목적의 to recover도 맞아요."}], "pencil": "장난감을 '가지고 놀'은 a toy to play ___로 쓴다", "pencilKey": "with", "page": 52, "sec": "s2", "k": "pick", "tr": "그들은 아기에게 (놀다) ___ 장난감을 사 주었다.\n나는 비행에서 (회복하다) ___ 집에서 쉬었다.", "ex": ["flight = 비행"]}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "유형 01, 03 형용사적 용법 / 부사적 용법 (통합형)", "type": "mc", "ans": "②, ⑤", "concept": ["031-2", "025-2", "024"], "gap": "", "words": [["need", "필요하다"], ["walk the dog", "개를 산책시키다"], ["nod", "끄덕이다"], ["in order to", "~하기 위해"], ["awake", "깨다"], ["wash", "씻다"]], "h1": "각 빈칸에 to를 넣어 읽어 보고, 문장이 이상해지는 것을 두 개 찾으세요. 빈칸 바로 앞의 동사나 단어의 종류를 살펴보세요.", "h2": "사역동사(make, have, let)는 목적어 뒤에 to 없이 동사원형을 써요. 또 뒤에 동사 -ing가 오면 그 앞은 to가 아니라 어떤 말이 와야 하는지 생각해 보세요.", "why": "② 사역동사 made(원형 make 시키다) 뒤에는 동사원형이 와서 to를 쓸 수 없어요. ⑤는 뒤에 -ing(washing)가 있어 for가 맞아요.", "opts": [{"n": "①", "en": "Everyone needs someone ___ love.", "ko": "모든 사람은 사랑할 누군가가 필요하다.", "ok": false, "why": "someone을 '사랑할'로 꾸미는 to love라서 to가 들어가요."}, {"n": "②", "en": "Dad made me ___ walk the dog.", "ko": "아빠는 내가 개를 산책시키게 했다.", "ok": true, "why": "사역동사 made 뒤에는 동사원형이 와서 to가 들어갈 수 없어요."}, {"n": "③", "en": "I nodded my head in order ___ show that I understood.", "ko": "나는 이해했다는 것을 보여 주기 위해 고개를 끄덕였다.", "ok": false, "why": "in order to로 to가 들어가요."}, {"n": "④", "en": "Dorothy awoke ___ see her baby smiling at her.", "ko": "Dorothy는 깨어서 아기가 자기에게 웃고 있는 것을 보았다.", "ok": false, "why": "결과의 to부정사라서 to가 들어가요."}, {"n": "⑤", "en": "This oil soap can be used ___ washing.", "ko": "이 오일 비누는 씻는 데 쓰일 수 있다.", "ok": true, "why": "뒤에 -ing가 있어서 for가 들어가야 하고 to는 안 돼요."}], "pencil": "사역동사 make 뒤의 동사에는 ___를 붙이지 않는다", "pencilKey": "to", "page": 52, "sec": "s2", "k": "pick", "tr": "① 모든 사람은 사랑할 누군가가 필요하다.\n② 아빠는 내가 개를 산책시키게 했다.\n③ 나는 이해했다는 것을 보여 주려고 고개를 끄덕였다.\n④ Dorothy는 깨어나서 아기가 자기에게 웃고 있는 것을 보았다.\n⑤ 이 오일 비누는 씻는 데 쓸 수 있다.", "ex": ["nodded(원형 nod) = 끄덕였다", "awoke(원형 awake) = 깨어났다", "oil soap = 오일 비누"]}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "유형 03 부사적 용법", "type": "mc", "ans": "④", "concept": ["025"], "gap": "", "words": [["pleased", "기쁜"], ["rule", "규칙"], ["follow", "따르다"], ["remember", "기억하다"], ["miss out on", "놓치다"], ["upset", "속상한"]], "h1": "<보기>의 to meet가 '기뻐서'의 이유예요. 같은 이유를 나타내는 보기를 찾으세요.", "h2": "감정을 나타내는 형용사(pleased, upset) 뒤의 to부정사는 감정의 원인이에요. 보기마다 to부정사 앞의 말이 감정 형용사인지 확인하세요.", "why": "<보기>는 pleased(기쁜) 뒤에서 감정의 원인을 말해요. ④도 upset(속상한) 뒤에서 '놓쳐서 속상했다'라는 감정의 원인이라 같아요.", "opts": [{"n": "①", "en": "Our school has many rules to follow.", "ko": "우리 학교에는 따라야 할 규칙이 많다.", "ok": false, "why": "rules를 '따를'로 꾸미는 형용사적 용법이에요."}, {"n": "②", "en": "The password is not easy to remember.", "ko": "그 비밀번호는 기억하기 쉽지 않다.", "ok": false, "why": "형용사 easy를 꾸미는 쓰임이에요."}, {"n": "③", "en": "I visited Egypt to see the pyramids.", "ko": "나는 피라미드를 보려고 이집트를 방문했다.", "ok": false, "why": "목적이라서 감정의 원인이 아니에요."}, {"n": "④", "en": "We were upset to miss out on the World Cup.", "ko": "우리는 월드컵을 놓쳐서 속상했다.", "ok": true, "why": "upset(속상한) 뒤에서 감정의 원인을 말해 <보기>와 같아요."}, {"n": "⑤", "en": "Deborah grew up to be a professional golfer.", "ko": "Deborah는 자라서 프로 골프 선수가 되었다.", "ok": false, "why": "결과라서 감정의 원인이 아니에요."}], "pencil": "감정 형용사 뒤의 to부정사는 감정의 ___을 말한다", "pencilKey": "원인", "page": 52, "sec": "s2", "k": "pick", "tr": "<보기> 나는 옛 친구를 (만나다) ___ 기뻤다.\n① 우리 학교에는 (따르다) ___ 규칙이 많다.\n② 그 비밀번호는 (기억하다) ___ 쉽지 않다.\n③ 나는 피라미드를 (보다) ___ 이집트를 방문했다.\n④ 우리는 월드컵을 (놓치다) ___ 속상했다.\n⑤ Deborah는 자라서 (프로 골프 선수가 되다) ___.", "ex": ["password = 비밀번호", "pyramid = 피라미드", "professional = 프로의, 전문적인"]}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "유형 01, 03 형용사적 용법 / 부사적 용법", "type": "mc", "ans": "②", "concept": ["024", "051", "025-2"], "gap": "", "words": [["lose", "잃다, 낭비하다"], ["lend", "빌려주다"], ["excited", "신이 난"], ["important", "중요한"], ["reduce", "줄이다"], ["protect", "보호하다"]], "h1": "ⓐ~ⓔ 다섯 문장을 하나씩 읽고, 어순이나 전치사 빠짐이 있는 틀린 문장을 먼저 골라 내세요.", "h2": "꾸밈을 받는 명사가 전치사의 목적어일 때(예: a chair to sit on)와 -thing을 꾸미는 형용사의 자리를 점검해 보세요.", "why": "ⓑ는 pen to write with(원형 write 쓰다)로 with가 필요해요. ⓓ는 something important로 형용사가 뒤에 와야 해요. 그래서 ⓐ, ⓒ, ⓔ가 옳아요.", "opts": [{"n": "①", "en": "ⓐ, ⓑ, ⓓ", "ko": "ⓐ 옳음, ⓑ 틀림, ⓓ 틀림", "ok": false, "why": "ⓑ와 ⓓ는 틀린 문장이라 묶으면 안 돼요."}, {"n": "②", "en": "ⓐ, ⓒ, ⓔ", "ko": "세 문장 모두 옳음", "ok": true, "why": "세 문장 모두 어법이 맞아요."}, {"n": "③", "en": "ⓑ, ⓒ, ⓓ", "ko": "ⓑ와 ⓓ는 틀림", "ok": false, "why": "ⓑ와 ⓓ는 틀린 문장이에요."}, {"n": "④", "en": "ⓑ, ⓓ, ⓔ", "ko": "ⓑ와 ⓓ는 틀림", "ok": false, "why": "ⓑ와 ⓓ는 틀린 문장이에요."}, {"n": "⑤", "en": "ⓒ, ⓓ, ⓔ", "ko": "ⓓ는 틀림", "ok": false, "why": "ⓓ가 something 앞에 형용사를 써서 틀렸어요."}], "pencil": "-thing 뒤에서 꾸미는 형용사의 자리는 -thing의 ___이다", "pencilKey": "뒤", "page": 52, "sec": "s2", "k": "pick", "tr": "ⓐ 우리는 허비할 시간이 없다.\nⓑ 나에게 쓸 펜을 빌려 줄 수 있니?\nⓒ Jessy는 새 직장을 얻어서 신이 났다.\nⓓ 나는 너에게 말해 줄 중요한 것이 있다.\nⓔ 우리는 지구를 보호하기 위해 음식물 쓰레기를 줄여야 한다.", "ex": ["lend = 빌려주다", "reduce = 줄이다", "food waste = 음식물 쓰레기"]}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "유형 02 「be + to부정사」", "type": "mc", "ans": "②", "concept": ["025-H1"], "gap": "", "words": [["hear", "듣다"], ["feed", "먹이를 주다"], ["appear in court", "법정에 출석하다"], ["be destined to", "~할 운명이다"], ["win trust", "신뢰를 얻다"], ["honest", "정직한"]], "h1": "짝지어진 두 문장 중 뜻이 다른 것을 찾아요. 각 문장의 be to가 예정, 의무, 가능, 운명, 의지 중 무엇인지 먼저 정하세요.", "h2": "be to의 뜻(예정, 의무, 가능, 운명, 의지)과 바꿔 쓴 표현(could, be going to, be destined to, intend to)이 서로 맞는지 하나씩 따져 보세요. not이 들어간 문장은 뜻을 특히 조심하세요.", "why": "②는 '먹이를 주면 안 된다'와 '먹이를 줄 필요가 없다'로 뜻이 달라요. 나머지는 be to가 가능, 예정, 운명, 의지로 서로 바꿔 쓴 말과 뜻이 같아요.", "opts": [{"n": "①", "en": "Not a single word was to be heard. = Not a single word could be heard.", "ko": "한 마디도 들리지 않았다. = 한 마디도 들릴 수 없었다.", "ok": false, "why": "be to가 가능이라서 could와 뜻이 같아요."}, {"n": "②", "en": "You are not to feed the animals in the zoo. = You don't have to feed the animals in the zoo.", "ko": "동물원 동물에게 먹이를 주면 안 된다. = 먹이를 줄 필요가 없다.", "ok": true, "why": "are not to는 금지, don't have to는 불필요라서 뜻이 달라요."}, {"n": "③", "en": "Michael is to appear in court tomorrow. = Michael is going to appear in court tomorrow.", "ko": "Michael은 내일 법정에 출석할 예정이다. = 출석할 예정이다.", "ok": false, "why": "be to가 예정이라서 be going to와 뜻이 같아요."}, {"n": "④", "en": "They were not to see each other again. = They were destined not to see each other again.", "ko": "그들은 다시는 서로를 보지 못할 운명이었다. = 못할 운명이었다.", "ok": false, "why": "be to가 운명이라서 뜻이 같아요."}, {"n": "⑤", "en": "If you are to win others' trust, you should be honest. = If you intend to win others' trust, you should be honest.", "ko": "다른 사람의 신뢰를 얻으려면 정직해야 한다. = 얻을 작정이라면 정직해야 한다.", "ok": false, "why": "be to가 의지라서 intend to와 뜻이 같아요."}], "pencil": "are not to는 ~하면 안 된다, don't have to는 ~할 ___이 없다", "pencilKey": "필요", "page": 52, "sec": "s2", "k": "pick", "tr": "① 한 마디도 들리 ___. = 한 마디도 들릴 수 없었다.\n② 너는 동물원에서 동물에게 먹이를 주 ___. = 너는 동물원에서 동물에게 먹이를 줄 필요가 없다.\n③ Michael은 내일 법정에 출석 ___. = Michael은 내일 법정에 출석할 예정이다.\n④ 그들은 서로를 다시 보지 못 ___. = 그들은 서로를 다시 보지 못할 운명이었다.\n⑤ 네가 다른 사람의 신뢰를 얻 ___ 정직해야 한다. = 네가 다른 사람의 신뢰를 얻을 작정이라면 정직해야 한다.", "ex": ["appear in court = 법정에 출석하다", "destined = 운명 지어진", "trust = 신뢰"]}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "유형 02 「be + to부정사」", "typ ) ___ 안도했다.\nⓒ 그들은 구급차를 (요청하다) ___ 119에 전화했다.\nⓓ 조심해. 이 개들은 (다루다) ___ 어렵다.\nⓔ 그녀는 경찰과 함께 돌아왔지만, (알게 되다) ___ 그는 이미 사라지고 없었다.", "ex": ["carol = 캐럴", "relieved = 안도한", "ambulance = 구급차"]}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "유형 04 too ~ to / enough to", "type": "mc", "ans": "②", "concept": ["062–063", "051-H2"], "gap": "", "words": [["weather", "날씨"], ["breathe", "숨 쉬다"], ["smart", "똑똑한"], ["quiz show", "퀴즈쇼"], ["polluted", "오염된"], ["recipe", "요리법"], ["follow", "따르다"]], "h1": "대화를 우리말로 해석해서 앞사람 말과 뒷사람 대답이 자연스럽게 이어지는지 하나씩 확인하세요.", "h2": "too ~ to는 '너무 ~해서 …할 수 없다'라는 뜻이고, ~ enough to는 '…할 만큼 충분히 ~하다'예요. 앞사람의 말과 뒷사람의 대답이 서로 이어지는지 보세요.", "why": "②는 'Olivia는 너무 똑똑해서 참가할 수 없다'가 되어 대답(이길 수 있겠다)과 이어지지 않아요. smart enough to ~가 자연스러워요.", "opts": [{"n": "①", "en": "A How was the weather in Hong Kong? B Well, it was so hot that I couldn't breathe.", "ko": "A 홍콩 날씨는 어땠어? B 너무 더워서 숨을 쉴 수 없었어.", "ok": false, "why": "날씨 질문에 맞는 대답이라서 자연스러워요."}, {"n": "②", "en": "A Olivia is too smart to take part in the quiz show. B Yeah, I think she'll be able to win.", "ko": "A Olivia는 너무 똑똑해서 퀴즈쇼에 참가할 수 없어. B 응, 이길 수 있을 것 같아.", "ok": true, "why": "too smart to는 '참가할 수 없다'라서 대답과 안 맞아요."}, {"n": "③", "en": "A These gloves aren't big enough for me to put on. B I'll get you bigger ones.", "ko": "A 이 장갑은 내가 끼기에 충분히 크지 않아. B 더 큰 것을 가져다줄게.", "ok": false, "why": "작다는 불평에 더 큰 것을 주겠다는 대답이라서 자연스러워요."}, {"n": "④", "en": "A The river is too polluted for people to swim in. B Oh, I'm sorry to hear that.", "ko": "A 강이 너무 오염돼서 사람들이 수영할 수 없어. B 아, 안됐다.", "ok": false, "why": "안타까운 소식에 위로하는 대답이라서 자연스러워요."}, {"n": "⑤", "en": "A Can you teach me how to make a cake? B Sure. The recipe is simple enough for you to follow.", "ko": "A 케이크 만드는 법을 가르쳐 줄래? B 그럼. 요리법이 따라 하기에 충분히 간단해.", "ok": false, "why": "부탁에 승낙하는 대답이라서 자연스러워요."}], "pencil": "too ~ to는 '너무 ~해서 …할 수 ___'는 뜻이다", "pencilKey": "없다", "page": 54, "sec": "s3", "k": "pick", "tr": "① A: 홍콩 날씨는 어땠어?\n   B: 음, 너무 더워서 숨을 쉴 수 없었어.\n② A: Olivia는 너무 똑똑해서 퀴즈쇼에 참가할 수 없어.\n   B: 응, 그 애는 이길 수 있을 것 같아.\n③ A: 이 장갑은 내가 끼기에 충분히 크지 않아.\n   B: 더 큰 걸 가져다줄게.\n④ A: 그 강은 너무 오염돼서 사람들이 수영할 수 없어.\n   B: 아, 안됐다.\n⑤ A: 케이크 만드는 법을 가르쳐 줄래?\n   B: 그럼. 요리법이 네가 따라 하기에 충분히 간단해.", "ex": ["polluted = 오염된", "recipe = 요리법", "breathe = 숨 쉬다"]}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "유형 04 too ~ to / enough to", "type": "mc", "ans": "③", "concept": ["061", "062–063"], "gap": "", "words": [["elderly", "나이 든"], ["yell", "소리치다"], ["loudly", "크게"], ["headphones", "헤드폰"], ["hear", "듣다"]], "h1": "문장은 '노인이 그녀가 들을 수 있을 만큼 크게 소리치는 것을 들었다'예요. to hear를 하는 사람이 누구인지 생각해 보세요.", "h2": "to부정사를 하는 사람(의미상 주어)은 「for + 목적격」으로 나타내요. of는 사람의 성격을 평가할 때만 써요.", "why": "③ of her는 for her로 고쳐야 해요. 듣는 사람을 나타내는 의미상 주어는 「for + 목적격」이에요.", "opts": [{"n": "①", "en": "yelling", "ko": "소리치고 있는", "ok": false, "why": "heard의 목적격 보어로 쓰인 -ing라서 맞아요."}, {"n": "②", "en": "loudly", "ko": "크게", "ok": false, "why": "enough 앞의 부사라서 맞아요."}, {"n": "③", "en": "of her", "ko": "그녀의", "ok": true, "why": "의미상 주어는 for her로 써야 해서 틀려요."}, {"n": "④", "en": "to hear", "ko": "듣기에", "ok": false, "why": "「부사 + enough + to부정사」라서 맞아요."}, {"n": "⑤", "en": "through her headphones", "ko": "헤드폰을 통해", "ok": false, "why": "전치사 through의 쓰임이 맞아요."}], "pencil": "to부정사의 의미상 주어는 「___ + 목적격」이다", "pencilKey": "for", "page": 54, "sec": "s3", "k": "pick", "tr": "그녀는 한 노인이 헤드폰을 통해서도 자신이 들을 수 있을 만큼 크게 소리치는 것을 들었다.", "ex": ["elderly = 나이 든", "yelling(원형 yell) = 소리치고 있는", "headphones = 헤드폰"]}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "유형 04 too ~ to / enough to", "type": "mc", "ans": "③", "concept": ["062–063"], "gap": "", "words": [["attend", "참석하다"], ["meeting", "회의"], ["manage to", "간신히 ~하다"], ["fail", "실패하다"], ["busy", "바쁜"]], "h1": "다섯 문장을 우리말로 해석해서 '바빠서 못 갔다'인지 '바빴지만 갔다'인지 구분하세요.", "h2": "too ~ to, so ~ that ~ couldn't, failed to, wasn't able to, managed to가 각각 '했다'인지 '못 했다'인지 정리해 보세요.", "why": "③ managed to attend(원형 manage 가까스로 해내다)는 바빴지만 참석했다는 뜻이고 나머지는 바빠서 참석하지 못했다는 뜻이에요.", "opts": [{"n": "①", "en": "I was too busy to attend the meeting.", "ko": "나는 너무 바빠서 회의에 참석할 수 없었다.", "ok": false, "why": "참석하지 못했다는 뜻이에요."}, {"n": "②", "en": "I was so busy that I couldn't attend the meeting.", "ko": "나는 너무 바빠서 회의에 참석할 수 없었다.", "ok": false, "why": "참석하지 못했다는 뜻이에요."}, {"n": "③", "en": "I managed to attend the meeting though I was busy.", "ko": "나는 바빴지만 가까스로 회의에 참석했다.", "ok": true, "why": "참석했다는 뜻이라서 나머지와 달라요."}, {"n": "④", "en": "I was very busy, so I failed to attend the meeting.", "ko": "나는 매우 바빠서 회의에 참석하지 못했다.", "ok": false, "why": "참석하지 못했다는 뜻이에요."}, {"n": "⑤", "en": "I wasn't able to attend the meeting because I was too busy.", "ko": "나는 너무 바빠서 회의에 참석할 수 없었다.", "ok": false, "why": "참석하지 못했다는 뜻이에요."}], "pencil": "「manage to + 동사」는 가까스로 ___했다는 뜻이다", "pencilKey": "해냈다", "page": 54, "sec": "s3", "k": "pick", "tr": "① 나는 회의에 (참석하다) ___ 너무 바빴다.\n② 나는 너무 바빠서 회의에 (참석하다) ___.\n③ 나는 바쁜데도 회의에 가까스로 (참석하다) ___.\n④ 나는 매우 바빠서 회의에 (참석하다) ___.\n⑤ 나는 너무 바빠서 회의에 (참석하다) ___.", "ex": ["attend = 참석하다"]}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "유형 05 seem to", "type": "mc", "ans": "④", "concept": ["065"], "gap": "", "words": [["honest", "정직한"], ["sick", "아픈"], ["meet", "만나다"], ["enjoy", "즐기다"], ["teacher", "교사"]], "h1": "두 문장의 시제를 하나씩 비교하세요. to be와 to have been이 어떤 때를 말하는지 먼저 정리해 보세요.", "h2": "단순부정사(to be)는 seem과 같은 때, 완료부정사(to have p.p.)는 seem보다 앞선 때예요. 그래서 that절의 시제가 정해져요.", "why": "④는 seemed와 was enjoying이 같은 때라서 단순부정사 to be enjoying(원형 enjoy 즐기다)과 뜻이 같아요.", "opts": [{"n": "①", "en": "James seems to be honest. = It seems that James was honest.", "ko": "James는 정직한 것 같다. = 정직했던 것 같다.", "ok": false, "why": "현재와 과거라서 시제가 달라 뜻이 달라요."}, {"n": "②", "en": "Scott seemed to be sick then. = It seemed that Scott had been sick then.", "ko": "Scott는 그때 아팠던 것 같았다. = 그전에 아팠던 것 같았다.", "ok": false, "why": "단순부정사(같은 때)와 과거완료(앞선 때)라서 달라요."}, {"n": "③", "en": "Nick seems to have met her. = Nick seems that he will meet her.", "ko": "Nick은 그녀를 만났던 것 같다. = 만날 것 같다.", "ok": false, "why": "과거와 미래라서 뜻이 달라요."}, {"n": "④", "en": "Jenny seemed to be enjoying her job. = It seemed that Jenny was enjoying her job.", "ko": "Jenny는 일을 즐기는 것 같았다. = 즐기고 있는 것 같았다.", "ok": true, "why": "두 문장 모두 같은 때(과거)라서 뜻이 같아요."}, {"n": "⑤", "en": "Sujin seemed to have been a teacher. = It seemed that Sujin was a teacher.", "ko": "Sujin은 교사였던 것 같았다. = 교사인 것 같았다.", "ok": false, "why": "완료부정사는 앞선 때인데 was는 같은 때라서 달라요."}], "pencil": "단순부정사는 seem과 같은 때, 완료부정사는 ___ 때이다", "pencilKey": "앞선", "page": 54, "sec": "s3", "k": "pick", "tr": "① James는 (정직하다) ___ 것 같다. = James가 (정직하다) ___ 것 같다.\n② Scott는 그때 (아프다) ___ 것 같았다. = Scott가 그때 (아프다) ___ 것 같았다.\n③ Nick은 그녀를 (만나다) ___ 것 같다. = Nick은 그가 그녀를 (만나다) ___ 것 같다.\n④ Jenny는 자기 일을 (즐기다) ___ 것 같았다. = Jenny가 자기 일을 (즐기다) ___ 것 같았다.\n⑤ Sujin은 (교사이다) ___ 것 같았다. = Sujin이 (교사이다) ___ 것 같았다.", "ex": ["enjoy = 즐기다", "honest = 정직한"]}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "유형 05 seem to", "type": "mc", "ans": "④", "concept": ["065"], "gap": "", "words": [["famous", "유명한"], ["young", "젊은"]], "h1": "'젊었을 때 유명했던'이 지금 추측하는 것보다 앞선 일인지 보세요. 그리고 seem이 현재인지 과거인지도 확인하세요.", "h2": "지금 추측하는 일보다 더 앞선 일은 완료부정사(to + have + p.p.)로 써요. seem이 현재인지 과거인지, to 뒤의 모양이 맞는지 확인하세요.", "why": "지금 '~인 것 같다'고 말하면서 젊었을 때(앞선 때)를 말하므로 seems to have been(원형 be ~이다) famous가 맞아요.", "opts": [{"n": "①", "en": "seems to be famous", "ko": "유명한 것 같다", "ok": false, "why": "지금 유명한 것이라 '유명했던'과 안 맞아요."}, {"n": "②", "en": "seemed to be famous", "ko": "유명한 것 같았다", "ok": false, "why": "때가 같은 단순부정사라서 앞선 일이 안 돼요."}, {"n": "③", "en": "seems to has been famous", "ko": "유명했던 것 같다", "ok": false, "why": "to 뒤에 has가 아니라 have를 써야 해요."}, {"n": "④", "en": "seems to have been famous", "ko": "유명했던 것 같다", "ok": true, "why": "현재 추측 + 앞선 때를 모두 나타내서 맞아요."}, {"n": "⑤", "en": "seemed to have been famous", "ko": "유명했던 것 같았다", "ok": false, "why": "seemed(과거)라서 지금 추측하는 말과 맞지 않아요."}], "pencil": "앞선 때를 말하는 완료부정사는 to ___ been처럼 쓴다", "pencilKey": "have", "page": 54, "sec": "s3", "k": "pick", "tr": "그녀는 젊었을 때 유명했던 것 같다. (우리말이 문제에 나와 있어요.)", "ex": []}, {"id": "S3-0  if(r.ok1===undefined){r.ok1=ok;r.d0=today();r.fast=(!ok&&r.shown&&t-r.shown<5000)?1:0;r.tfirst=t}
 r.tries=(r.tries||0)+1;
 if(ok){r.done=true;r.pt=t}
 sv();render()}
function submitPick(id){var d=byId(id),r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;
 var ok=(a===s);if(!ok){r.gone=(r.gone||[]);if(d.ans.indexOf(",")<0){r.gone.push(s)}r.sel=[]}else r.pick=s;grade(d,r,ok)}
function submitType(id){var d=byId(id),r=rec(id);var v=nz((document.getElementById("inp")||{}).value||r.val);if(!v)return;
 var ok=d.acc.some(function(a){return nz(a)===v});r.val=ok?r.val:"";grade(d,r,ok)}
function solvedView(d,r){
 var h='<div class="res ok">정답이에요</div>';
 if(d.k==="pick"){h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){var cls=o.ok?'ok':'',bd=o.ok?'정답':'';
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'})}
 else h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
 return h+penBlock(d,r)}
function penBlock(d,r){
 if(!d.pencil)return "";
 var must=(r.ok1===false||st.mode==="full");
 var h='<div class="pen"><div class="ph">'+PEN+'연필 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+((r.pen||!must)?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>';
 if(must&&!r.pen)h+='<div class="must">'+(r.ok1===false?'틀린 문제예요. ':'')+'빈칸을 책에 직접 써야 다음으로 가요</div><button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>';
 return h+'</div>'}
function penDone(id){var r=rec(id);r.pen=1;r.pt2=Date.now();if(r.pt&&r.pt2-r.pt<8000)r.pf=1;sv();render()}
function bodySelf(d,r){
 var h="";
 if(!r.done){h+=hintBlock(d,r,false);h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div><button class="btn p" onclick="selfDone(\''+d.id+'\')">책에 다 썼어요</button>';return h}
 h+=hintBlock(d,r,true);
 h+='<div class="res ok" style="background:#eef2ff;color:#3730a3">책에 쓴 답은 문제를 모두 끝내면 전체정답에서 확인해요</div>';
 return h+penBlock(d,r)}
function selfDone(id){var r=rec(id);r.done=1;r.d0=today();r.pt=Date.now();sv();render()}
function summary(){
 var its=items(st.tab),n=its.length;
 var gr=its.filter(function(d){return d.k!=="self"});
 var ok=gr.filter(function(d){return rec(d.id).ok1}).length,pct=gr.length?Math.round(ok/gr.length*100):100;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+n+' / '+n+'</span></div>';
 if(gr.length)h+='<div class="srow">처음에 맞힌 문제<span>'+ok+' / '+gr.length+' ('+pct+'%)</span></div>';
 var wrong=gr.filter(function(d){return rec(d.id).ok1===false});
 if(pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 연필 한 줄을 다시 읽어 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb red" onclick="goIdx('+its.indexOf(d)+')">'+d.no+'</button>'}).join("")+'</div>';
 }else h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>';
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 else h+='<button class="btn p" onclick="goTab('+STEPS.length+')">전체정답 보기</button>';
 return h+'</div>'}
function fullAns(){
 if(!allDone()){var left=DATA.filter(function(d){return !isDone(d)}).length;return '<div class="card">문제를 모두 끝내면 전체정답이 열려요.<div class="meter">남은 문제 '+left+'개</div></div>'}
 var h='<div class="card sum"><h2>전체정답</h2><div class="note" style="margin-top:0">책에 쓴 문제는 정답과 비교해서 표시해요.</div></div>';
 STEPS.forEach(function(s){
  h+='<div class="card"><div class="tag">'+esc(s.name)+'</div>';
  items(STEPS.indexOf(s)).forEach(function(d){var r=rec(d.id);
   h+='<div class="srow" style="display:block"><div>'+d.no+'번 · <span style="color:var(--ink)">'+esc(d.k==="pick"?d.ans:d.ans)+'</span></div>';
   if(r.ok1===false&&d.k!=="self")h+='<div class="meter" style="color:var(--bad)">처음에 틀렸어요</div>';
   if(d.k==="self"){h+='<div class="why">'+hl(d.why)+'</div><div class="nav"><button class="btn '+(r.mk===1?'p':'s')+'" onclick="mark(\''+d.id+'\',1)">맞게 썼어요</button><button class="btn '+(r.mk===0?'p':'g')+'" onclick="mark(\''+d.id+'\',0)">틀렸어요</button></div>'+(r.mk===0&&d.pencil&&!r.pen2?'<div class="must">틀렸으면 연필 한 줄을 책에 써요</div><button class="btn s" onclick="pen2(\''+d.id+'\')">책에 썼어요</button>':'')}
   h+='</div>'});
  h+='</div>'});
 return h}
function mark(id,v){var r=rec(id);r.mk=v;sv();render()}
function pen2(id){rec(id).pen2=1;sv();render()}
function teacher(){
 var h='<div class="card tp"><h2 style="font-size:20px">선생님 화면</h2>';
 var first=DATA.filter(function(d){return rec(d.id).ok1!==undefined&&d.k!=="self"});
 var ok=first.filter(function(d){return rec(d.id).ok1}).length;
 h+='<div class="srow">푼 문제<span>'+DATA.filter(isDone).length+' / '+DATA.length+'</span></div>';
 h+='<div class="srow">처음에 맞힘<span>'+ok+' / '+first.length+(first.length?' ('+Math.round(ok/first.length*100)+'%)':'')+'</span></div>';
 var fast=DATA.filter(function(d){return rec(d.id).fast}).map(function(d){return d.id}),wr=first.filter(function(d){return !rec(d.id).ok1}).map(function(d){return d.id});
 h+='<div class="srow">5초 안에 제출하고 틀림<span>'+(fast.join(", ")||"없음")+'</span></div>';
 h+='<div class="srow">처음에 틀린 문제<span>'+(wr.join(", ")||"없음")+'</span></div>';
 h+='<div class="srow">쓰기 모드<span>'+(st.mode==="full"?'전체 쓰기':'보통')+'</span></div>';
 h+='<button class="btn s" onclick="setMode(\''+(st.mode==="full"?'normal':'full')+'\')">'+(st.mode==="full"?'보통 모드로':'전체 쓰기 모드로')+'</button>';
 h+='<button class="btn g" onclick="resetAll()">이 단원 기록 지우기</button><button class="btn g" onclick="st.tmode=false;render()">닫기</button></div>';
 return h}
function setMode(m){st.mode=m;try{localStorage.setItem(MODEKEY,m)}catch(e){}render()}
function resetAll(){if(!confirm("이 단원 기록을 모두 지울까요?"))return;st.rec={};st.tab=0;st.idx=0;sv();render()}
function openT(){var p=prompt("선생님 번호");if(p==="7372"){st.tmode=true;render()}}
window.__gi=function(){
 var td=today(),T=DATA.filter(function(d){var r=st.rec[d.id];return r&&r.d0===td});
 if(!T.length)return "";
 var g=T.filter(function(d){return d.k!=="self"}),ok=g.filter(function(d){return st.rec[d.id].ok1}).length;
 var wr=g.filter(function(d){return !st.rec[d.id].ok1}).map(function(d){return d.id}),fs=T.filter(function(d){return st.rec[d.id].fast}).map(function(d){return d.id});
 var pn=T.filter(function(d){return st.rec[d.id].pen||st.rec[d.id].pen2}),pf=pn.filter(function(d){return st.rec[d.id].pf}).length;
 return "오늘 "+T.length+"문제 · 처음에 맞힘 "+ok+"/"+g.length+(wr.length?" · 틀린 문제 "+wr.join(","):"")+(fs.length?" · 5초 안에 제출하고 틀림 "+fs.join(","):"")+" · 연필 "+pn.length+"줄"+(pf?"(8초 안에 넘김 "+pf+"개)":"")+(st.mode==="full"?" · 전체 쓰기 모드":"")+" · 전체정답 "+(allDone()?"열림":"잠김")};
ld();
if(st.tab>=ST.length)st.tab=0;
render();
</script></body></html>
