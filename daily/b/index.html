The astronaut]] sent a photo of Earth.","[[그 우주비행사]]는 지구 사진을 보냈다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"improve","a":"1,4","e":"① boost: 끌어올리다, 신장시키다 (새 코치는 선수들이 단 한 달 만에 팀워크를 향상시키도록 도왔다.) / improve(나아지다, 개선하다)의 유의어.\n④ enhance: 향상시키다, 높이다","w":"② maintain: 유지하다, 지속하다\n③ worsen: 악화시키다, 더 나빠지게 하다","k":"새 코치는 선수들이 단 한 달 만에 팀워크를 향상시키도록 도왔다.","m":2,"s":"The new coach helped the players improve their teamwork in just one month.","h":"improve","c":["boost","maintain","worsen","enhance"],"mn":"나아지다, 개선하다","hk":"improve(나아지다)와 같은 편은 boost(끌어올리다), enhance(향상시키다). maintain(유지하다)은 그대로, worsen(악화시키다)은 반대 방향.","ex":[["Reading every day can [[improve your grades]].","매일 읽기는 [[성적을 올릴]] 수 있다.","improve (동) 나아지다, 개선하다"],["Good sleep can [[boost your energy]].","충분한 잠은 [[에너지를 끌어올릴]] 수 있다.","boost (동) 끌어올리다, 신장시키다"],["Music can [[enhance the mood]] of a party.","음악은 파티의 [[분위기를 높일]] 수 있다.","enhance (동) 향상시키다, 높이다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"media","a":"4","e":"④ media: 미디어, 매체 (많은 십 대들은 이제 신문보다 소셜 미디어에서 뉴스 대부분을 얻는다.)","w":"① magazine: 잡지\n② channel: 채널, 경로\n③ headline: (신문의) 표제, 주요 뉴스","k":"많은 십 대들은 이제 신문보다 소셜 미디어에서 뉴스 대부분을 얻는다.","m":0,"s":"Many teenagers now get most of their news from social ________ rather than from newspapers.","c":["magazine","channel","headline","media"],"mn":"미디어, 매체","hk":"social media(소셜 미디어)는 통째로 굳은 짝. media(매체)는 medium(매체)의 복수형. magazine(잡지), channel(채널), headline(표제)은 속임수.","ex":[["Teens spend hours on [[social media]].","십 대들은 [[소셜 미디어]]에서 몇 시간씩 보낸다."],["[[The news media]] reported the accident.","[[뉴스 매체]]가 그 사고를 보도했다."],["[[Mass media]] shape what people think.","[[대중 매체]]는 사람들의 생각을 만든다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"distribute","a":"1","e":"distribute (동) 분배하다, 나눠 주다 - distribution (명) 분배, 유통\n① confirm (동) 확인해 주다 - confirmation (명) 확인","w":"② kind (형) 친절한 - kindness (명) 친절\n③ fertile (형) 기름진, 비옥한 - fertility (명) 비옥함\n④ intelligent (형) 총명한, 지적인 - intelligence (명) 지능","m":0,"s":"distribute - distribution","c":["confirm - confirmation","kind - kindness","fertile - fertility","intelligent - intelligence"],"mn":"분배하다, 나눠 주다","hk":"관계는 동사에서 명사. distribute(분배하다)-distribution(분배)과 confirm(확인해 주다)-confirmation(확인). 나머지는 형용사에서 명사.","ex":[["Volunteers [[distribute food]] to poor families.","자원봉사자들은 가난한 가정에 [[음식을 나눠 준다]].","distribute (동) 분배하다, 나눠 주다"],["The [[distribution]] of masks started today.","마스크 [[분배]]가 오늘 시작되었다.","distribution (명) 분배, 유통"],["Please [[confirm your seat]] by Friday.","금요일까지 [[좌석을 확인해]] 주세요.","confirm (동) 확인해 주다"],["I am waiting for the [[confirmation]] email.","나는 [[확인]] 이메일을 기다리고 있다.","confirmation (명) 확인"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"industrious","a":"4","e":"④ idle: 게으른, 빈둥거리는 (그녀는 매우 부지런한 직원이라서 모든 일을 예정보다 일찍 끝낸다.) / industrious(근면한, 부지런한)의 반의어.","w":"① diligent: 부지런한, 성실한\n② devoted: 헌신적인\n③ hardworking: 근면한, 열심히 일하는","k":"그녀는 매우 부지런한 직원이라서 모든 일을 예정보다 일찍 끝낸다.","m":0,"s":"She is such an industrious worker that she finishes every task ahead of time.","h":"industrious","c":["diligent","devoted","hardworking","idle"],"mn":"근면한, 부지런한","hk":"industrious(근면한)의 반대편은 idle(게으른). diligent(부지런한), devoted(헌신적인), hardworking(근면한)은 같은 편 속임수.","ex":[["An [[industrious student]] studies every night.","[[부지런한 학생]]은 매일 밤 공부한다.","industrious (형) 근면한, 부지런한"],["He sat [[idle]] while others worked.","다른 사람들이 일하는 동안 그는 [[빈둥거리며]] 앉아 있었다.","idle (형) 게으른, 빈둥거리는"],["He lived [[an idle life]].","그는 [[게으른 삶]]을 살았다.","idle (형) 게으른, 빈둥거리는"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"bank","a":"bank","e":"bank (명) 둑, 제방 / (명) 은행","k":"폭우가 지난여름 강의 진흙 둑 일부를 쓸어가 버렸다.\n그 회사는 국내 위험을 줄이기 위해 비상 자금을 외국 은행에 보관한다.","m":0,"s":"Heavy rain washed away part of the muddy b______ of the river last summer.\nThe company keeps its emergency funds in a foreign b______ to reduce local risks.","mn":"둑, 제방 / 은행","hk":"bank(둑)와 bank(은행)는 철자가 같은 두 뜻. 첫 문장은 river(강) 둑, 둘째는 funds(자금)를 맡기는 은행.","ex":[["They had a picnic on [[the river bank]].","그들은 [[강둑]]에서 소풍을 했다.","bank (명) 둑, 제방"],["I opened [[a bank account]] last week.","나는 지난주 [[은행 계좌]]를 열었다.","bank (명) 은행"],["She put her savings in [[the bank]].","그녀는 저금을 [[은행]]에 넣었다.","bank (명) 은행"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"habitat","a":"3","e":"③ habitat: (자연 속의 장소 / 특정한 동물이나 식물이 보통 살고 자라는) 서식지","w":"① shelter: 피난처, 은신처\n② landscape: 풍경, 경치\n④ nest: 둥지","k":"자연 속의 장소 / 특정한 동물이나 식물이 보통 살고 자라는","m":0,"s":"\"the natural place where a particular animal or plant normally lives and grows\"","c":["shelter","landscape","habitat","nest"],"mn":"서식지","hk":"habitat(서식지)은 동식물이 사는 자연 속 자리. shelter(피난처), nest(둥지)는 숨는 곳이고 landscape(풍경)는 보이는 경치.","ex":[["Forests are [[the natural habitat]] of many birds.","숲은 많은 새의 [[자연 서식지]]이다."],["Pollution destroys [[wildlife habitats]].","오염은 [[야생 동물 서식지]]를 파괴한다."],["Polar bears are losing their [[habitat]].","북극곰은 [[서식지]]를 잃고 있다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"derive","a":"3","e":"③ originate: 비롯되다, 유래하다 (많은 영어 단어들은 라틴어와 그리스어에서 유래한다.) / derive(유래하다, 비롯되다)의 유의어.","w":"① differ: 다르다, 차이가 나다\n② depart: 떠나다, 출발하다\n④ emerge: 나타나다, 생겨나다","k":"많은 영어 단어들은 라틴어와 그리스어에서 유래한다.","m":0,"s":"Many English words derive from Latin and Greek.","h":"derive","c":["differ","depart","originate","emerge"],"mn":"유래하다, 비롯되다","hk":"derive from(유래하다)과 같은 편은 originate(비롯되다). differ(다르다), depart(떠나다)는 d(디)로 시작해 헷갈리게 하는 속임수.","ex":[["This word [[derives from]] an old French word.","이 단어는 오래된 프랑스어 단어에서 [[유래한다]]."],["The town's name [[derives from]] a nearby river.","그 마을의 이름은 근처 강에서 [[유래한다]]."],["Many customs [[are derived from]] old stories.","많은 관습은 옛이야기에서 [[유래한 것이다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"soil","a":"3","e":"③ soil: 흙, 토양 (농부들은 마른 토양을 다시 비옥하게 만들기 위해 천연 비료를 뿌린다.)","w":"① branch: 나뭇가지\n② root: 뿌리\n④ seed: 씨앗","k":"농부들은 마른 토양을 다시 비옥하게 만들기 위해 천연 비료를 뿌린다.","m":0,"s":"Farmers spread natural fertilizer to make the dry ________ rich again.","c":["branch","root","soil","seed"],"mn":"흙, 토양","hk":"soil(토양)은 fertilizer(비료)를 뿌려 rich(기름진) 만드는 대상. branch(나뭇가지), root(뿌리), seed(씨앗)는 식물 부분 속임수.","ex":[["Plants grow well in [[rich soil]].","식물은 [[기름진 흙]]에서 잘 자란다."],["Farmers test [[the soil]] before planting.","농부들은 심기 전에 [[토양]]을 검사한다."],["[[Poor soil]] makes farming hard.","[[척박한 토양]]은 농사를 어렵게 한다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"liberty","a":"4","e":"④ liberty: 자유, 해방","w":"① prejudice: 편견, 선입관\n② authority: 권위, 권한\n③ privacy: 사생활, 프라이버시","m":0,"s":"liberty","c":["편견, 선입관","권위, 권한","사생활, 프라이버시","자유, 해방"],"mn":"자유, 해방","hk":"liberty(자유)는 Statue of Liberty(자유의 여신상)로 기억. prejudice(편견), authority(권위), privacy(사생활)는 속임수.","ex":[["We saw [[the Statue of Liberty]] in New York.","우리는 뉴욕에서 [[자유의 여신상]]을 보았다."],["The prisoner finally got his [[liberty]].","그 죄수는 마침내 [[자유]]를 얻었다."],["People fought for [[liberty and justice]].","사람들은 [[자유와 정의]]를 위해 싸웠다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"pollution","a":"pollution","e":"pollution 오염, 공해","k":"강을 따라 있는 공장들이 이 지역 수질 오염의 주된 원인이다.","m":0,"s":"Factories along the river are the main cause of water p______ in this area.","mn":"오염, 공해","hk":"pollution(오염)은 ll(엘 두 개)가 겹치는 철자. pollute(오염시키다)에서 끝 글자를 빼고 명사 어미를 붙인 꼴.","ex":[["[[Air pollution]] is a problem in big cities.","[[대기 오염]]은 대도시의 문제이다."],["[[Noise pollution]] makes it hard to sleep.","[[소음 공해]]는 잠들기 어렵게 만든다."],["We must reduce [[plastic pollution]] in the sea.","우리는 바다의 [[플라스틱 오염]]을 줄여야 한다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"position","a":"1","e":"①직위, 일자리 / ②위치, 자리 / ③위치, 자리 / ④위치, 자리 [①번만 의미가 다름]","k":"①그녀는 그 박물관의 연구 조교 자리를 제안받았다.\n②군인들은 돌담 뒤의 안전한 위치를 잡았다.\n③이 위치에서는 아래의 계곡 전체를 볼 수 있다.\n④정원사는 그 무거운 화분을 벽 근처의 더 볕이 잘 드는 자리로 옮겼다.","m":0,"c":["She was offered a position as a research assistant at the museum.","The soldiers took up a safe position behind the stone wall.","From this position you can see the whole valley below.","The gardener moved the heavy pot to a sunnier position near the wall."],"hc":"position|position|position|position","mn":"위치, 자리 / 직위, 일자리","hk":"position(위치, 자리)이 세 문장의 뜻이고, assistant(조교) 자리 문장만 position(직위, 일자리).","ex":[["The soldiers took [[a safe position]] behind the wall.","군인들은 벽 뒤의 [[안전한 위치]]를 잡았다.","position (명) 위치, 자리"],["Move your chair to [[a better position]].","의자를 [[더 좋은 자리]]로 옮겨라.","position (명) 위치, 자리"],["She applied for [[a position]] at the bank.","그녀는 은행의 [[일자리]]에 지원했다.","position (명) 직위, 일자리"]]}]},{"day":68,"q":[{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"direct","a":"1","e":"① indirect: 간접적인, 에두르는 (그 관리자는 질문을 피하는 대신 우리에게 직접적인 대답을 해 주었다.) / direct(직접적인, 단도직입적인)의 반의어.","w":"② frank: 솔직한, 숨김없는\n③ straight: 솔직한, 곧은\n④ blunt: 직설적인, 무뚝뚝한","k":"그 관리자는 질문을 피하는 대신 우리에게 직접적인 대답을 해 주었다.","m":0,"s":"The manager gave us a direct answer instead of avoiding the question.","h":"direct","c":["indirect","frank","straight","blunt"],"mn":"직접적인, 단도직입적인","hk":"direct(직접적인)의 반대편은 접두사 in-(아닌)이 붙은 indirect(간접적인). frank(솔직한), straight(솔직한), blunt(직설적인)는 같은 편.","ex":[["She gave me [[a direct answer]].","그녀는 나에게 [[직접적인 대답]]을 주었다.","direct (형) 직접적인, 단도직입적인"],["He gave [[an indirect answer]] to avoid trouble.","그는 문제를 피하려고 [[에둘러 한 대답]]을 했다.","indirect (형) 간접적인, 에두르는"],["We took [[an indirect route]] to the beach.","우리는 해변까지 [[돌아가는 길]]을 택했다.","indirect (형) 간접적인, 에두르는"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"meanwhile","a":"4","e":"④ meanwhile: 그동안에, 그 사이에 (아빠는 설거지를 하고 계셨다. 그동안 아이들은 저녁 식탁을 차리고 있었다.)","w":"① moreover: 게다가, 더욱이\n② nevertheless: 그럼에도 불구하고\n③ otherwise: 그렇지 않으면","k":"아빠는 설거지를 하고 계셨다. 그동안 아이들은 저녁 식탁을 차리고 있었다.","m":0,"s":"Dad was washing the dishes. ________, the children were setting the table for dinner.","c":["moreover","nevertheless","otherwise","meanwhile"],"mn":"그동안에, 그 사이에","hk":"meanwhile(그동안에)은 두 일이 동시에 벌어질 때. moreover(게다가)는 덧붙임, nevertheless(그럼에도 불구하고)는 반전, otherwise(그렇지 않으면)는 조건.","ex":[["Mom cooked dinner. [[Meanwhile]], I cleaned the room.","엄마는 저녁을 만드셨다. [[그동안]] 나는 방을 청소했다."],["Cook the rice. [[Meanwhile]], cut the vegetables.","밥을 지어라. [[그동안]] 채소를 썰어라."],["I waited outside. [[Meanwhile]], it started to rain.","나는 밖에서 기다렸다. [[그 사이]] 비가 오기 시작했다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"caution","a":"1","e":"caution (명) 조심, 주의 - cautious (형) 조심스러운\n① comfort (명) 편안함, 위로 - comfortable (형) 편안한","w":"② happy (형) 행복한 - happiness (명) 행복\n③ slow (형) 느린 - slowly (부) 느리게\n④ wide (형) 넓은 - widen (동) 넓히다","m":0,"s":"caution - cautious","c":["comfort - comfortable","happy - happiness","slow - slowly","wide - widen"],"mn":"조심, 주의","hk":"관계는 명사에서 형용사. caution(조심)-cautious(조심스러운)와 comfort(편안함)-comfortable(편안한). 나머지는 품사 방향이 다름.","ex":[["Drive with [[caution]] in the rain.","비 오는 날에는 [[조심해서]] 운전하라.","caution (명) 조심, 주의"],["He is [[a cautious driver]].","그는 [[조심스러운 운전자]]이다.","cautious (형) 조심스러운"],["I love the [[comfort]] of home.","나는 집의 [[편안함]]을 사랑한다.","comfort (명) 편안함, 위로"],["I wear [[comfortable shoes]] to school.","나는 학교에 [[편안한 신발]]을 신고 간다.","comfortable (형) 편안한"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"status","a":"4","e":"④ status: 지위, 신분","w":"① reputation: 평판, 명성\n② skill: 기술, 능력\n③ income: 소득, 수입","m":0,"s":"\"지위, 신분\"","c":["reputation","skill","income","status"],"mn":"지위, 신분","hk":"status(지위, 신분)는 사회에서 차지하는 자리. reputation(평판)은 남들의 평가, income(소득)은 버는 돈, skill(기술)은 능력.","ex":[["Doctors have a high [[social status]].","의사는 높은 [[사회적 지위]]를 가진다."],["The singer reached [[star status]] at 18.","그 가수는 18세에 [[스타의 지위]]에 올랐다."],["Everyone has equal [[status]] in this club.","이 동아리에서는 모두가 같은 [[지위]]를 가진다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"symbol","a":"symbol","e":"symbol 상징","k":"많은 문화권에서 흰 비둘기는 오랫동안 평화와 희망의 상징이었다.","m":0,"s":"In many cultures, the white dove has long been a s______ of peace and hope.","mn":"상징","hk":"symbol(상징)은 y(와이)가 두 번째 글자이고 bol(볼)로 끝남. 소리가 같은 cymbal(심벌즈)과 구분.","ex":[["The dove is [[a symbol of peace]].","비둘기는 [[평화의 상징]]이다."],["A red heart is [[a symbol of love]].","빨간 하트는 [[사랑의 상징]]이다."],["The owl is [[the school symbol]].","올빼미는 [[학교의 상징]]이다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"benefit","a":"1,3","e":"① advantage: 이점, 장점\n③ merit: 장점, 가치 (규칙적인 운동은 몸과 마음 둘 다에 진정한 이익을 가져다준다.) / benefit(이익, 이점)의 유의어.","w":"② expense: 비용, 지출\n④ burden: 부담, 짐","k":"규칙적인 운동은 몸과 마음 둘 다에 진정한 이익을 가져다준다.","m":2,"s":"Regular exercise brings a real benefit to both the body and the mind.","h":"benefit","c":["advantage","expense","merit","burden"],"mn":"이익, 이점","hk":"benefit(이익)과 같은 편은 advantage(이점)와 merit(장점). expense(비용)와 burden(부담)은 드는 쪽 반대편.","ex":[["Exercise has many [[health benefits]].","운동은 많은 [[건강상의 이점]]이 있다.","benefit (명) 이익, 이점"],["Being tall is [[an advantage]] in basketball.","키가 큰 것은 농구에서 [[이점]]이다.","advantage (명) 이점, 장점"],["Each plan has its own [[merits]].","각각의 계획에는 나름의 [[장점]]이 있다.","merit (명) 장점, 가치"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"operation","a":"3","e":"③ operation: (의학적 치료 / 의사가 환자의 몸을 절개하는 / 한 부분을 고치거나 제거하기 위해) 수술","w":"① recovery: 회복\n② prescription: 처방(전)\n④ diagnosis: 진단","k":"의학적 치료 / 의사가 환자의 몸을 절개하는 / 한 부분을 고치거나 제거하기 위해","m":0,"s":"\"a medical treatment in which a doctor cuts open a patient's body to repair or remove a part\"","c":["recovery","prescription","operation","diagnosis"],"mn":"수술","hk":"operation(수술)은 의사가 몸을 절개해 고치는 치료. 동사 operate(수술하다)와 한 뿌리. recovery(회복), diagnosis(진단)는 다른 단계.","ex":[["My grandfather had [[a heart operation]].","할아버지는 [[심장 수술]]을 받으셨다."],["The doctor will [[perform the operation]] tomorrow.","의사가 내일 [[수술을 할]] 것이다."],["[[The operation]] took three hours.","[[그 수술]]은 세 시간이 걸렸다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"round","a":"round","e":"round (형) 둥근, 원형의 / (명) (경기의) 회, 라운드","k":"고대 뱃사람들은 지구가 평평한 것이 아니라 둥글다고 이미 믿고 있었다.\n그 챔피언은 경기 3라운드에서 상대 선수를 쓰러뜨렸다.","m":0,"s":"Ancient sailors already believed that the earth was r______, not flat.\nThe champion knocked his opponent down in the third r______ of the match.","mn":"둥근, 원형의 / 회, 라운드","hk":"round(둥근)은 형용사, round(회)는 명사. third(세 번째) round(라운드)처럼 서수 다음엔 명사 round.","ex":[["We sat at [[a round table]].","우리는 [[둥근 탁자]]에 앉았다.","round (형) 둥근, 원형의"],["He has [[a round face]].","그는 [[둥근 얼굴]]이다.","round (형) 둥근, 원형의"],["She won the first [[round]] of the game.","그녀는 경기 첫 [[라운드]]를 이겼다.","round (명) 회, 라운드"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"attractive","a":"3","e":"③ unattractive: 매력 없는, 볼품없는 (그 호텔은 온라인 사진에서는 매력적으로 보였지만, 방들은 작고 어두웠다.) / attractive(매력적인, 마음을 끄는)의 반의어.","w":"① appealing: 마음을 끄는, 매력적인\n② pretty: 예쁜\n④ charming: 매력적인","k":"그 호텔은 온라인 사진에서는 매력적으로 보였지만, 방들은 작고 어두웠다.","m":0,"s":"The hotel looked attractive in the online photos, but the rooms were small and dark.","h":"attractive","c":["appealing","pretty","unattractive","charming"],"mn":"매력적인, 마음을 끄는","hk":"attractive(매력적인)의 반대편은 un-(아닌)이 붙은 unattractive(매력 없는). appealing(마음을 끄는), pretty(예쁜), charming(매력적인)은 같은 편.","ex":[["She has [[an attractive smile]].","그녀는 [[매력적인 미소]]를 가졌다.","attractive (형) 매력적인, 마음을 끄는"],["The old building looked [[dull and unattractive]].","그 낡은 건물은 [[칙칙하고 매력 없어]] 보였다.","unattractive (형) 매력 없는, 볼품없는"],["The salary was too low, so the job was [[unattractive]].","월급이 너무 낮아서 그 일은 [[매력 없었다]].","unattractive (형) 매력 없는, 볼품없는"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"schedule","a":"1","e":"① schedule: 일정, 스케줄 (오늘 가기 전에 벽에 붙은 훈련 일정을 확인해 주세요.)","w":"② income: 수입, 소득\n③ border: 국경, 경계, 가장자리\n④ session: 시간, 기간, 회기","k":"오늘 가기 전에 벽에 붙은 훈련 일정을 확인해 n② residence: 주택, 거주지\n④ venue: (행사) 장소","k":"건물, 방, 또는 서비스 / 사람들이 이용하도록 제공되는 / 특정한 목적을 위해","m":0,"s":"\"a building, room, or service that is provided for people to use for a particular purpose\"","c":["dormitory","residence","facility","venue"],"mn":"시설, 설비","hk":"facility(시설)는 사람들이 쓰도록 마련한 건물, 방, 서비스. dormitory(기숙사)와 residence(주택)는 사는 곳, venue(장소)는 행사 장소.","ex":[["The school has a new [[sports facility]].","학교에는 새 [[체육 시설]]이 있다."],["This hotel has [[a medical facility]].","이 호텔에는 [[의료 시설]]이 있다."],["The town built [[a recycling facility]].","마을은 [[재활용 시설]]을 지었다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"relationship","a":"relationship","e":"relationship 관계","k":"부모와 십 대 사이의 건강한 관계는 솔직한 대화 위에 세워진다.","m":0,"s":"A healthy r______ between parents and teenagers is built on honest conversation.","mn":"관계","hk":"relationship(관계)은 relation(관계)과 ship(상태) 두 덩어리로 기억.","ex":[["I have [[a good relationship]] with my teacher.","나는 선생님과 [[좋은 관계]]를 맺고 있다."],["They ended [[their relationship]] last year.","그들은 작년에 [[관계]]를 끝냈다."],["There is [[a close relationship]] between sleep and health.","수면과 건강 사이에는 [[밀접한 관계]]가 있다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"service","a":"4","e":"①서비스, 접대 / ②서비스, 접대 / ③서비스, 접대 / ④복무, 근무 [④번만 의미가 다름]","k":"①손님들은 식당의 느린 서비스에 대해 불평했다.\n②그 항공사는 많은 불만을 받은 후에 서비스를 바꾸었다.\n③그 호텔은 따뜻하고 정중한 서비스로 잘 알려져 있다.\n④나의 할아버지는 은퇴하기 전에 30년을 군 복무로 보내셨다.","m":0,"c":["Guests complained about the slow service in the dining room.","The airline changed its service after receiving many complaints.","The hotel is well known for its warm and polite service.","My grandfather spent thirty years in military service before he retired."],"hc":"service|service|service|service","mn":"서비스, 접대 / 복무, 근무","hk":"service(서비스, 접대)는 식당과 호텔 쪽이고 하나만 military service(군 복무). 나머지 세 문장은 손님 응대.","ex":[["The restaurant has [[slow service]].","그 식당은 [[서비스가 느리다]].","service (명) 서비스, 접대"],["The hotel is famous for its [[friendly service]].","그 호텔은 [[친절한 서비스]]로 유명하다.","service (명) 서비스, 접대"],["He retired after 30 years of [[military service]].","그는 30년간의 [[군 복무]] 후에 은퇴했다.","service (명) 복무, 근무"]]}]},{"day":69,"q":[{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"temporary","a":"3","e":"③ temporary: 일시적인, 임시의 (오래된 다리들이 수리 중이어서, 시는 운전자들을 위해 임시 다리들을 지었다.)","w":"① eternal: 영원한\n② permanent: 영구적인\n④ instant: 즉각적인","k":"오래된 다리들이 수리 중이어서, 시는 운전자들을 위해 임시 다리들을 지었다.","m":0,"s":"The old bridges are under repair, so the city built ________ ones for drivers.","c":["eternal","permanent","temporary","instant"],"mn":"일시적인, 임시의","hk":"temporary(일시적인)는 지금만 쓰는 임시. permanent(영구적인)가 반대편이고 eternal(영원한)과 instant(즉각적인)는 속임수.","ex":[["We found [[a temporary job]] for summer.","우리는 여름 동안 [[임시 일자리]]를 구했다."],["This is only [[a temporary solution]].","이것은 [[임시 해결책]]일 뿐이다."],["He lives in [[temporary housing]].","그는 [[임시 거처]]에 산다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"hostile","a":"2","e":"② unfriendly: 비우호적인, 쌀쌀맞은 (그 학급이 외부인에게 적대적이었기 때문에 새 학생은 외로움을 느꼈다.) / hostile(적대적인, 적의를 품은)의 유의어.","w":"① sociable: 사교적인\n③ cheerful: 쾌활한, 명랑한\n④ welcoming: 반기는, 환영하는","k":"그 학급이 외부인에게 적대적이었기 때문에 새 학생은 외로움을 느꼈다.","m":0,"s":"The new student felt lonely because the class was hostile toward outsiders.","h":"hostile","c":["sociable","unfriendly","cheerful","welcoming"],"mn":"적대적인, 적의를 품은","hk":"hostile(적대적인)과 같은 편은 unfriendly(비우호적인). sociable(사교적인), cheerful(쾌활한), welcoming(반기는)은 반대편 속임수.","ex":[["The crowd was [[hostile to]] the visitors.","군중은 방문객들에게 [[적대적이었다]]."],["He gave me [[a hostile look]].","그는 나에게 [[적대적인 눈빛]]을 보냈다."],["The new teacher faced [[a hostile class]].","새 선생님은 [[적대적인 반]]을 마주했다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"decade","a":"2","e":"② decade: 10년","w":"① millennium: 천 년\n③ century: 세기, 100년\n④ era: 시대, 시기","m":0,"s":"\"10년\"","c":["millennium","decade","century","era"],"mn":"10년","hk":"decade(10년)의 dec(10)는 decimal(십진법의)과 같은 뿌리. century(세기)는 100년, millennium(천 년)은 1000년.","ex":[["He lived abroad for [[a decade]].","그는 [[10년]] 동안 해외에서 살았다."],["[[The last decade]] brought big changes.","[[지난 10년]]은 큰 변화를 가져왔다."],["The shop has been here for [[two decades]].","그 가게는 [[20년]] 동안 여기에 있었다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"error","a":"error","e":"error 오류, 잘못","k":"선생님은 내 에세이의 모든 단락에서 철자 오류를 하나씩 동그라미 쳤다.","m":0,"s":"The teacher circled one spelling e______ in every paragraph of my essay.","mn":"오류, 잘못","hk":"error(오류)는 rr(알 두 개)가 겹치는 철자. mistake(실수)와 같은 편.","ex":[["I found [[a spelling error]] in my essay.","나는 에세이에서 [[철자 오류]]를 찾았다."],["The computer showed [[an error message]].","컴퓨터가 [[오류 메시지]]를 보여 주었다."],["[[Human error]] caused the accident.","[[인간의 실수]]가 사고를 일으켰다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"specific","a":"2","e":"② vague: 모호한, 애매한 (그냥 다음 주 언젠가라고 말하지 말고 회의 날짜를 구체적으로 알려 주세요.) / specific(구체적인, 명확한)의 반의어.","w":"① concrete: 구체적인\n③ precise: 정확한, 정밀한\n④ detailed: 상세한","k":"그냥 다음 주 언젠가라고 말하지 말고 회의 날짜를 구체적으로 알려 주세요.","m":0,"s":"Please give me a specific date for the meeting instead of just telling me it is sometime next week.","h":"specific","c":["concrete","vague","precise","detailed"],"mn":"구체적인, 명확한","hk":"specific(구체적인)의 반대편은 vague(모호한). concrete(구체적인), precise(정확한), detailed(상세한)는 같은 편.","ex":[["Please give [[a specific example]].","[[구체적인 예]]를 하나 들어 주세요.","specific (형) 구체적인, 명확한"],["The map was [[too vague]] to follow.","그 지도는 따라가기에 [[너무 모호했다]].","vague (형) 모호한, 애매한"],["She had only [[a vague idea]] of the plan.","그녀는 그 계획에 대해 [[막연한 생각]]만 있었다.","vague (형) 모호한, 애매한"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"clinic","a":"4","e":"④ clinic: (장소 / 사람들이 의료 처치나 조언을 받으러 가는 / 보통 병원보다 규모가 작은) 진료소, 개인 병원","w":"① pharmacy: 약국\n② nursery: 탁아소, 육아실\n③ ward: (병원의) 병동","k":"장소 / 사람들이 의료 처치나 조언을 받으러 가는 / 보통 병원보다 규모가 작은","m":0,"s":"\"a place where people go to get medical treatment or advice, usually smaller than a hospital\"","c":["pharmacy","nursery","ward","clinic"],"mn":"진료소, 개인 병원","hk":"clinic(진료소)은 보통 hospital(병원)보다 작은 의료 장소. pharmacy(약국), nursery(탁아소), ward(병동)는 속임수.","ex":[["She works at [[a dental clinic]].","그녀는 [[치과 병원]]에서 일한다."],["The village has [[a small clinic]].","그 마을에는 [[작은 진료소]]가 있다."],["Mom took me to [[the clinic]] when I had a fever.","열이 났을 때 엄마가 나를 [[진료소]]에 데려갔다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"persuade","a":"3","e":"persuade (동) 설득하다 - persuasion (명) 설득\n③ perceive (동) 인지하다, 감지하다 - perception (명) 인지, 지각","w":"① grateful (형) 고마워하는 - gratitude (명) 감사\n② consistent (형) 일관된 - consistency (명) 일관성\n④ optimistic (형) 낙관적인 - optimism (명) 낙관주의","m":0,"s":"persuade - persuasion","c":["grateful - gratitude","consistent - consistency","perceive - perception","optimistic - optimism"],"mn":"설득하다","hk":"관계는 동사에서 명사. persuade(설득하다)-persuasion(설득)과 perceive(인지하다)-perception(인지). 나머지는 형용사에서 명사.","ex":[["I tried to [[persuade my dad]] to buy a dog.","나는 개를 사자고 [[아빠를 설득하려]] 했다.","persuade (동) 설득하다"],["Gentle [[persuasion]] works better than anger.","부드러운 [[설득]]이 화내는 것보다 효과적이다.","persuasion (명) 설득"],["Dogs can [[perceive sounds]] we cannot hear.","개는 우리가 듣지 못하는 [[소리를 감지할]] 수 있다.","perceive (동) 인지하다, 감지하다"],["Light changes our [[perception]] of color.","빛은 색에 대한 우리의 [[인지]]를 바꾼다.","perception (명) 인지, 지각"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"assume","a":"1,2","e":"① suppose: 생각하다, 추측하다 (많은 사람들은 비싼 제품이 싼 것보다 항상 더 좋다고 생각한다.) / assume(추정하다, 가정하다)의 유의어.\n② presume: 추정하다, 가정하다","w":"③ prove: 증명하다\n④ verify: 사실인지 확인하다, 입증하다","k":"많은 사람들은 비싼 제품이 싼 것보다 항상 더 좋다고 생각한다.","m":2,"s":"Many people assume that expensive products are always better than cheap ones.","h":"assume","c":["suppose","presume","prove","verify"],"mn":"추정하다, 가정하다","hk":"assume(추정하다)과 같은 편은 suppose(생각하다)와 presume(추정하다). prove(증명하다)와 verify(입증하다)는 확인하는 반대 방향.","ex":[["Don't [[assume that]] everyone agrees.","모두가 동의한다고 [[가정하지]] 마라.","assume (동) 추정하다, 가정하다"],["I [[suppose]] he is at home now.","나는 그가 지금 집에 있다고 [[생각한다]].","suppose (동) 생각하다, 추측하다"],["I [[presume]] you have already eaten.","나는 네가 이미 먹었다고 [[추정한다]].","presume (동) 추정하다, 가정하다"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"monitor","a":"monitor","e":"monitor (명) 모니터, 화면 표시 장치 / (동) 감시하다, 추적 관찰하다","k":"침대 옆의 작은 모니터가 밤새 환자의 심장 박동을 보여 주었다.\n정부 관계자들은 매달 이 강의 수질을 감시한다.","m":0,"s":"A small m______ beside the bed showed the patient's heartbeat all night long.\nGovernment officials m______ the water quality of this river every month.","mn":"모니터, 화면 표시 장치 / 감시하다, 추적 관찰하다","hk":"monitor(모니터)는 명사, monitor(감시하다)는 동사. 관사 a(하나의) 뒤면 명사, 주어 바로 뒤는 동사 자리.","ex":[["He bought [[a new monitor]] for his computer.","그는 컴퓨터용 [[새 모니터]]를 샀다.","monitor (명) 모니터, 화면 표시 장치"],["The nurse checked [[the heart monitor]].","간호사는 [[심장 모니터]]를 확인했다.","monitor (명) 모니터, 화면 표시 장치"],["Teachers [[monitor]] students during exams.","선생님들은 시험 중에 학생들을 [[감시한다]].","monitor (동) 감시하다, 추적 관찰하다"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"distinct","a":"3","e":"③ distinct: 뚜렷한, 구별되는","w":"① identical: 똑같은\n② typical: 전형적인\n④ similar: 비슷한","m":0,"s":"distinct","c":["똑같은","전형적인","뚜렷한, 구별되는","비슷한"],"mn":"뚜렷한, 구별되는","hk":"distinct(뚜렷한)는 다른 것과 구분되는 느낌. 같은 뿌리 distinguish(구별하다)와 묶기. identical(똑같은), similar(비슷한)는 반대편.","ex":[["The twins have [[distinct personalities]].","그 쌍둥이는 [[뚜렷이 다른 성격]]을 가졌다."],["I heard [[a distinct sound]] outside.","나는 밖에서 [[뚜렷한 소리]]를 들었다."],["These two words have [[distinct meanings]].","이 두 단어는 [[구별되는 뜻]]을 가진다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"altitude","a":"4","e":"④ altitude: 고도, 높이 (조종사는 두꺼운 구름 위로 비행기의 고도를 천천히 높였다.)","w":"① magnitude: (지진의) 규모, 크기\n② longitude: 경도\n③ latitude: 위도","k":"조종사는 두꺼운 구름 위로 비행기의 고도를 천천히 높였다.","m":0,"s":"The pil onesty is [[a great virtue]].","정직은 [[훌륭한 미덕]]이다."],["Patience is [[a virtue]].","인내는 [[미덕]]이다."],["Parents teach children [[the virtue of kindness]].","부모는 아이들에게 [[친절의 미덕]]을 가르친다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"moderate","a":"3","e":"③ excessive: 지나친, 과도한 (의사는 그에게 매일 식사에서 소금을 적당한 양으로 유지하라고 말했다.) / moderate(적당한, 알맞은)의 반의어.","w":"① balanced: 균형 잡힌\n② reasonable: 적당한, 합리적인\n④ average: 평균의, 보통의","k":"의사는 그에게 매일 식사에서 소금을 적당한 양으로 유지하라고 말했다.","m":0,"s":"The doctor told him to keep a moderate amount of salt in his daily meals.","h":"moderate","c":["balanced","reasonable","excessive","average"],"mn":"적당한, 알맞은","hk":"moderate(적당한)의 반대편은 지나친 excessive(과도한). balanced(균형 잡힌), reasonable(적당한), average(평균의)는 같은 편.","ex":[["Eat [[a moderate amount]] of sugar.","설탕은 [[적당한 양]]만 먹어라.","moderate (형) 적당한, 알맞은"],["[[Excessive use]] of phones hurts your eyes.","휴대폰의 [[지나친 사용]]은 눈에 해롭다.","excessive (형) 지나친, 과도한"],["The shop charged [[excessive prices]].","그 가게는 [[과도한 가격]]을 받았다.","excessive (형) 지나친, 과도한"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"automatic","a":"4","e":"④ automatic: 자동의, 자동적인 (입구에 있는 문은 자동이라서, 아무도 손으로 열 필요가 없다.)","w":"① narrow: 좁은\n② manual: 수동의, 손으로 하는\n③ wooden: 나무로 된","k":"입구에 있는 문은 자동이라서, 아무도 손으로 열 필요가 없다.","m":0,"s":"The gate at the entrance is ________, so no one has to open it by hand.","c":["narrow","manual","wooden","automatic"],"mn":"자동의, 자동적인","hk":"automatic(자동의)은 손 없이 저절로. manual(수동의)이 반대편이고 문장 속 by hand(손으로)가 힌트. narrow(좁은), wooden(나무로 된)은 속임수.","ex":[["The store has [[an automatic door]].","그 가게에는 [[자동문]]이 있다."],["This is [[an automatic washing machine]].","이것은 [[자동 세탁기]]이다."],["Blinking is [[an automatic reaction]].","눈 깜빡임은 [[자동적인 반응]]이다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"pupil","a":"pupil","e":"pupil (명) 학생, 제자 / (명) 눈동자, 동공","k":"그 반의 모든 학생은 시험에 사전을 가져와야 했다.\n어두운 방에서는 눈의 동공이 훨씬 커진다.","m":0,"s":"Every p______ in the class had to bring a dictionary to the exam.\nIn a dark room, the p______ of your eye becomes much larger.","mn":"학생, 제자 / 눈동자, 동공","hk":"pupil(학생)과 pupil(눈동자)은 철자가 같은 두 뜻. 첫 문장은 class(반)가 단서, 둘째는 eye(눈)가 단서.","ex":[["The teacher knows every [[pupil]] by name.","선생님은 모든 [[학생]]의 이름을 안다.","pupil (명) 학생, 제자"],["She is [[a top pupil]] in her class.","그녀는 반에서 [[최고의 학생]]이다.","pupil (명) 학생, 제자"],["Bright light makes [[the pupil]] smaller.","밝은 빛은 [[동공]]을 작아지게 한다.","pupil (명) 눈동자, 동공"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"ancestor","a":"3","e":"③ descendant: 후손, 자손 (그가 아는 가장 오래된 조상의 사진이 벽난로 위에 걸려 있다.) / ancestor(조상, 선조)의 반의어.","w":"① forefather: 선조, 조상\n② relative: 친척\n④ founder: 설립자, 창립자","k":"그가 아는 가장 오래된 조상의 사진이 벽난로 위에 걸려 있다.","m":0,"s":"A photograph of his oldest known ancestor hangs above the fireplace.","h":"ancestor","c":["forefather","relative","descendant","founder"],"mn":"조상, 선조","hk":"ancestor(조상)의 반대편은 descendant(후손). forefather(조상)는 같은 편, relative(친척)와 founder(설립자)는 속임수.","ex":[["Our [[ancestors]] came from the north.","우리의 [[조상들]]은 북쪽에서 왔다.","ancestor (명) 조상, 선조"],["She is [[a descendant of]] a famous king.","그녀는 한 유명한 왕의 [[후손이다]].","descendant (명) 후손, 자손"],["The farm will pass to his [[descendants]].","그 농장은 그의 [[후손들]]에게 넘어갈 것이다.","descendant (명) 후손, 자손"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"broad","a":"3","e":"broad (형) 넓은 - broaden (동) 넓히다\n③ tight (형) 꽉 조인, 단단한 - tighten (동) 단단히 조이다","w":"① fright (명) 놀람, 공포 - frighten (동) 겁먹게 하다\n② length (명) 길이 - lengthen (동) 길게 하다\n④ height (명) 높이 - heighten (동) 높이다","m":0,"s":"broad - broaden","c":["fright - frighten","length - lengthen","tight - tighten","height - heighten"],"mn":"넓은","hk":"관계는 형용사에서 동사. broad(넓은)-broaden(넓히다)과 tight(꽉 조인)-tighten(조이다). 나머지는 명사에서 동사.","ex":[["He has [[broad shoulders]].","그는 [[넓은 어깨]]를 가졌다.","broad (형) 넓은"],["Travel can [[broaden your mind]].","여행은 [[시야를 넓혀]] 줄 수 있다.","broaden (동) 넓히다"],["These jeans are too [[tight]].","이 청바지는 너무 [[꽉 낀다]].","tight (형) 꽉 조인, 단단한"],["Please [[tighten the screw]].","[[나사를 조여]] 주세요.","tighten (동) 단단히 조이다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"wound","a":"4","e":"④ wound: 상처, 부상 (그녀는 붕대로 감기 전에 남동생의 팔에 있는 깊은 상처를 닦아 냈다.)","w":"① bruise: 멍\n② rash: 발진, 두드러기\n③ scar: 흉터","k":"그녀는 붕대로 감기 전에 남동생의 팔에 있는 깊은 상처를 닦아 냈다.","m":0,"s":"She cleaned the deep ________ on her brother's arm before wrapping it with a bandage.","c":["bruise","rash","scar","wound"],"mn":"상처, 부상","hk":"wound(상처)는 베이거나 찔려 생긴 deep(깊은) 상처. bruise(멍), rash(발진), scar(흉터)는 상처와 다른 피부 증상.","ex":[["The nurse cleaned [[the wound]].","간호사는 [[상처]]를 닦았다."],["He had [[a deep wound]] on his leg.","그는 다리에 [[깊은 상처]]가 있었다."],["The soldier died from [[a head wound]].","그 병사는 [[머리 부상]]으로 죽었다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"fatigue","a":"3","e":"③ fatigue: (심신의) 피로, 피곤","w":"① boredom: 지루함\n② dizziness: 어지러움\n④ hunger: 배고픔, 굶주림","m":0,"s":"\"(심신의) 피로, 피곤\"","c":["boredom","dizziness","fatigue","hunger"],"mn":"(심신의) 피로, 피곤","hk":"fatigue(피로)는 몸과 마음이 지친 상태. boredom(지루함), dizziness(어지러움), hunger(배고픔)는 느낌이 비슷해 보이는 속임수.","ex":[["She felt great [[fatigue]] after the trip.","그녀는 여행 후 심한 [[피로]]를 느꼈다."],["[[Chronic fatigue]] makes work hard.","[[만성 피로]]는 일을 어렵게 한다."],["Long runs cause [[muscle fatigue]].","긴 달리기는 [[근육 피로]]를 일으킨다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"conscious","a":"2","e":"② aware: 알고 있는, 인식하는 (대부분의 쇼핑객들은 이제 비닐봉지가 환경에 끼치는 해로움을 인식하고 있다.) / conscious(알아차리는, 의식하는)의 유의어.","w":"① confused: 혼란스러운\n③ asleep: 잠든\n④ ignorant: 모르는, 무지한","k":"대부분의 쇼핑객들은 이제 비닐봉지가 환경에 끼치는 해로움을 인식하고 있다.","m":0,"s":"Most shoppers are now conscious of the harm that plastic bags do to the environment.","h":"conscious","c":["confused","aware","asleep","ignorant"],"mn":"알아차리는, 의식하는","hk":"conscious of(~을 의식하는)와 같은 편은 aware of(~을 아는). asleep(잠든), ignorant(모르는)는 반대편이고 confused(혼란스러운)는 속임수.","ex":[["She is [[conscious of]] her mistakes.","그녀는 자기 실수를 [[의식하고 있다]]."],["He was [[conscious of]] being watched.","그는 누군가 지켜본다는 것을 [[의식하고 있었다]]."],["More teens are [[health-conscious]] today.","요즘 더 많은 십 대가 [[건강을 의식한다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"spill","a":"4","e":"④ spill: (실수로 액체를 흘러넘치게 하다 / 용기의 가장자리 너머로) 엎지르다, 흘리다","w":"① drain: 물을 빼다, 배수하다\n② soak: 흠뻑 적시다\n③ pour: 붓다, 따르다","k":"실수로 액체를 흘러넘치게 하다 / 용기의 가장자리 너머로","m":0,"s":"\"to accidentally make liquid flow over the edge of a container\"","c":["drain","soak","pour","spill"],"mn":"엎지르다, 흘리다","hk":"spill(엎지르다)은 실수로 쏟는 것이고, 일부러 따르는 pour(붓다)와 구분. drain(물을 빼다), soak(적시다)는 속임수.","ex":[["Don't [[spill the milk]].","우유를 [[엎지르지]] 마라."],["I [[spilled juice on]] my shirt.","나는 셔츠에 [[주스를 엎질렀다]]."],["The soup [[spilled onto]] the floor.","수프가 바닥에 [[쏟아졌다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"hollow","a":"hollow","e":"hollow 속이 빈","k":"그 오래된 참나무는 속이 완전히 비어 있어서, 올빼미 가족이 그 안에서 살았다.","m":0,"s":"The old oak tree was completely h______ inside, so a family of owls lived in it.","mn":"속이 빈","hk":"hollow(속이 빈)는 ll(엘 두 개) 겹침에 ow(오우)로 끝나는 철자. hole(구멍)처럼 하나만 쓰지 않기.","ex":[["The tree trunk was [[hollow inside]].","나무 몸통은 [[속이 비어]] 있었다."],["Chocolate eggs are often [[hollow]].","초콜릿 달걀은 흔히 [[속이 비어 있다]]."],["Birds have [[hollow bones]].","새는 [[속이 빈 뼈]]를 가졌다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"stock","a":"1","e":"①주식 / ②재고 / ③재고 / ④재고 [①번만 의미가 다름]","k":"①그는 주가가 떨어지기 전에 회사의 주식을 전부 팔았다.\n②그 가게는 뒷방에 겨울 코트 재고를 많이 보관하고 있다.\n③그 모델은 다음 달까지 재고가 없다.\n④그 관리자는 매주 월요일 창고의 재고를 점검한다.","m":0,"c":["He sold all his stock in the company before the price fell.","The shop keeps a large stock of winter coats in the back room.","That model is out of stock until next month.","The manager checks the stock in the warehouse every Monday."],"hc":"stock|stock|stock|stock","mn":"재고 / 주식","hk":"stock(재고)가 대부분의 문장이고 하나만 company(회사)의 stock(주식). out of stock(재고가 없는)은 재고 쪽 대표 짝.","ex":[["The store has [[a large stock]] of toys.","그 가게는 장난감 [[많은 재고]]를 갖고 있다.","stock (명) 재고"],["This item is [[out of stock]].","이 상품은 [[재고가 없다]].","stock (명) 재고"],["He sold all his [[stock]] in the company.","그는 회사의 [[주식]]을 전부 팔았다.","stock (명) 주식"]]}]},{"day":71,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"perspective","a":"1","e":"① perspective: 관점, 견해","w":"② argument: 논쟁, 주장\n③ assumption: 가정, 추정\n④ conclusion: 결론","m":0,"s":"\"관점, 견해\"","c":["perspective","argument","assumption","conclusion"],"mn":"관점, 견해","hk":"perspective(관점)는 사물을 바라보는 자리. argument(논쟁)·assumption(가정)·conclusion(결론)과 뜻을 구분.","ex":[["Try to see the problem from [[another perspective]].","그 문제를 [[다른 관점]]에서 보려고 해 봐."],["Travel gave him [[a new perspective]] on life.","여행은 그에게 인생에 대한 [[새로운 관점]]을 주었다."],["From [[a teacher's perspective]], homework is very important.","[[교사의 관점]]에서 보면 숙제는 매우 중요하다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"cooperate","a":"3","e":"③ compete: 경쟁하다 (모든 나라는 세계적인 기후 위기를 해결하기 위해 긴밀히 협력해야 한다.) / cooperate(협력하다, 협동하다)의 반의어.","w":"① participate: 참여하다\n② assist: 돕다, 지원하다\n④ collaborate: 협력하다, 공동 작업하다","k":"모든 나라는 세계적인 기후 위기를 해결하기 위해 긴밀히 협력해야 한다.","m":0,"s":"All nations must closely cooperate to solve the global climate crisis.","h":"cooperate","c":["participate","assist","compete","collaborate"],"mn":"협력하다, 협동하다","hk":"cooperate(협력하다)의 반대편은 compete(경쟁하다). collaborate(협력하다)는 같은 편 속임수, participate(참여하다)·assist(돕다)는 다른 뜻.","ex":[["Students must [[cooperate with]] each other in this project.","학생들은 이 프로젝트에서 서로 [[협력해야]] 한다.","cooperate (동) 협력하다, 협동하다"],["The two teams [[compete for]] the first prize.","두 팀은 우승 상을 [[놓고 경쟁한다]].","compete (동) 경쟁하다"],["Many stores [[compete on price]] to win more customers.","많은 가게가 손님을 더 얻으려고 [[가격으로 경쟁한다]].","compete (동) 경쟁하다"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"organ","a":"organ","e":"organ (명) (생물의) 장기, 기관 / (명) 매체, 기관지","k":"간은 인체에서 가장 큰 내부 장기이다.\n그 월간지는 그 교원 노조의 공식 기관지 역할을 했다.","m":0,"s":"The liver is the largest internal o______ in the human body.\nThe monthly magazine served as the official o______ of the teachers' union.","mn":"장기, 기관 / 매체, 기관지","hk":"organ(장기, 몸속 기관)과 organ(기관지, 단체의 매체)은 철자가 같고 뜻은 두 가지. 두 뜻을 함께 기억.","ex":[["The heart is [[an organ]] that pumps blood.","심장은 피를 보내는 [[장기]]이다.","organ (명) 장기, 기관"],["Doctors can give a sick patient [[a healthy organ]].","의사들은 아픈 환자에게 [[건강한 장기]]를 줄 수 있다.","organ (명) 장기, 기관"],["The newsletter is [[the official organ]] of our club.","그 소식지는 우리 동아리의 [[공식 기관지]]이다.","organ (명) 매체, 기관지"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"telescope","a":"3","e":"③ telescope: (관 모양으로 생긴 기구 / 멀리 있는 물체를 더 크고 가깝게 보이도록 만드는) 망원경","w":"① microphone: 마이크\n② compass: 나침반\n④ microscope: 현미경","k":"관 모양으로 생긴 기구 / 멀리 있는 물체를 더 크고 가깝게 보이도록 만드는","m":0,"s":"\"an instrument shaped like a tube that makes distant objects look larger and closer\"","c":["microphone","compass","telescope","microscope"],"mn":"망원경","hk":"telescope(망원경)는 먼 것을 크게 보는 기구. 철자가 비슷한 microscope(현미경), microphone(마이크), compass(나침반)와 구분.","ex":[["We looked at the moon through [[a telescope]].","우리는 [[망원경]]으로 달을 보았다."],["He bought [[a small telescope]] to watch the stars.","그는 별을 보려고 [[작은 망원경]]을 샀다."],["[[A space telescope]] sends pictures of far stars.","[[우주 망원경]]은 먼 별의 사진을 보낸다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"mechanic","a":"mechanic","e":"mechanic 정비사, 기계공","k":"차가 갑자기 멈춰서, 우리는 엔진을 점검해 줄 정비사를 불렀다.","m":0,"s":"The car suddenly stopped, so we called a m______ to check the engine.","mn":"정비사, 기계공","hk":"mechanic(정비사)은 ch가 [k] 소리라 철자가 헷갈림. m-e-c-h-a-n-i-c, 끝은 -ic.","ex":[["Our car broke down, so we called [[a mechanic]].","차가 고장 나서 우리는 [[정비사]]를 불렀다."],["She works as [[a car mechanic]] in a small shop.","그녀는 작은 가게에서 [[자동차 정비사]]로 일한다."],["My uncle is [[a good mechanic]].","우리 삼촌은 [[훌륭한 정비사]]이다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"genuine","a":"1,2","e":"① authentic: 진짜의, 진품의\n② real: 진짜의, 실제의 (미술 전문가는 벽에 걸린 그 오래된 그림이 진짜라고 확인해 주었다.) / genuine(진짜의, 진품의)의 유의어.","w":"③ false: 가짜의, 틀린\n④ doubtful: 의심스러운, 확신이 없는","k":"미술 전문가는 벽에 걸린 그 오래된 그림이 진짜라고 확인해 주었다.","m":2,"s":"The art expert confirmed that the old painting on the wall was genuine.","h":"genuine","c":["authentic","real","false","doubtful"],"mn":"진짜의, 진품의","hk":"genuine(진짜의)과 같은 편은 authentic(진짜의)·real(실제의). false(가짜의)는 반대편, doubtful(의심스러운)은 다른 뜻.","ex":[["This bag is made of [[genuine leather]], not plastic.","이 가방은 플라스틱이 아니라 [[진짜 가죽]]으로 만들어졌다."],["Is this [[a genuine painting]] by Picasso?","이것은 피카소의 [[진품 그림]]인가요?"],["I need [[genuine proof]] before I believe it.","나는 그것을 믿기 전에 [[진짜 증거]]가 필요하다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"obtain","a":"3","e":"③ obtain: 얻다, 획득하다 (너는 그 집을 짓기 시작하기 전에 특별 허가증을 받아야 한다.)","w":"① announce: 발표하다, 알리다\n② emphasize: 강조하다\n④ combine: 결합하다","k":"너는 그 집을 짓기 시작하기 전에 특별 허가증을 받아야 한다.","m":0,"s":"You must ________ a special permit before you begin building the house.","c":["announce","emphasize","obtain","combine"],"mn":"얻다, 획득하다","hk":"obtain(얻다)은 obtain a permit(허가증을 받다)처럼 쓰임. announce(발표하다)·emphasize(강조하다)·combine(결합하다)는 빈칸에 어색.","ex":[["You can [[obtain a license]] after passing the test.","시험에 합격하면 [[면허를 얻을]] 수 있다."],["He worked hard to [[obtain good grades]].","그는 [[좋은 성적을 얻으려고]] 열심히 공부했다."],["You can [[obtain information]] from the library website.","도서관 웹사이트에서 [[정보를 얻을]] 수 있다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"satisfy","a":"3","e":"satisfy (동) 만족시키다 - satisfaction (명) 만족\n③ deliver (동) 배달하다 - delivery (명) 배달","w":"① innocent (형) 무죄인, 결백한 - innocence (명) 결백, 무죄\n② safe (형) 안전한 - safety (명) 안전\n④ abundant (형) 풍부한 - abundance (명) 풍부함","m":0,"s":"satisfy - satisfaction","c":["innocent - innocence","safe - safety","deliver - delivery","abundant - abundance"],"mn":"만족시키다","hk":"satisfy(만족시키다, 동사)에서 satisfaction(만족, 명사)으로, deliver(배달하다, 동사)에서 delivery(배달, 명사)로. 동사가 명사가 되는 관계.","ex":[["Good food can [[satisfy]] hungry guests.","맛있는 음식은 배고픈 손님을 [[만족시킬]] 수 있다.","satisfy (동) 만족시키다"],["She smiled with [[great satisfaction]].","그녀는 [[큰 만족감]]을 느끼며 미소 지었다.","satisfaction (명) 만족"],["The shop will [[deliver the pizza]] to your home.","그 가게는 집으로 [[피자를 배달해]] 줄 것이다.","deliver (동) 배달하다"],["[[Free delivery]] takes two days.","[[무료 배달]]은 이틀이 걸린다.","delivery (명) 배달"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"endure","a":"1","e":"① endure: 견디다, 참다","w":"② ensure: 보장하다, 확실하게 하다\n③ endanger: 위태롭게 하다\n④ endorse: 지지하다, 보증하다","m":0,"s":"endure","c":["견디다, 참다","보장하다, 확실하게 하다","위태롭게 하다","지지하다, 보증하다"],"mn":"견디다, 참다","hk":"endure(견디다)는 고통을 참고 버팀. ensure(보장하다)·endanger(위태롭게 하다)·endorse(지지하다)는 철자만 비슷한 속임수.","ex":[["Some plants cannot [[endure cold weather]].","어떤 식물은 [[추운 날씨를 견디지]] 못한다."],["He could not [[endure the pain]] any longer.","그는 더 이상 [[고통을 견딜]] 수 없었다."],["They had to [[endure a long wait]] at the airport.","그들은 공항에서 [[오랜 기다림을 견뎌야]] 했다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"rapid","a":"3","e":"③ slow: 느린, 더딘 (그 도시는 지난 10년 동안 급속한 인구 증가를 겪었다.) / rapid(빠른, 급속한)의 반의어.","w":"① hasty: 성급한, 서두르는\n② swift: 신속한, 재빠른\n④ speedy: 빠른, 신속한","k":"그 도시는 지난 10년 동안 급속한 인구 증가를 겪었다.","m":0,"s":"The city has seen rapid growth in population over the last ten years.","h":"rapid","c":["hasty","swift","slow","speedy"],"mn":"빠른, 급속한","hk":"rapid(빠른)의 반대편은 slow(느린). swift(신속한)·speedy(빠른)는 같은 편, hasty(성급한)도 빠름 쪽 속임수.","ex":[["The city saw [[rapid growth]] last year.","그 도시는 작년에 [[급속한 성장]]을 보였다.","rapid (형) 빠른, 급속한"],["He is [[a slow runner]], but he never gives up.","그는 [[느린 주자]]이지만 포기하지 않는다.","slow (형) 느린, 더딘"],["Healing was [[a slow process]].","회복은 [[더딘 과정]]이었다.","slow (형) 느린, 더딘"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"crop","a":"1","e":"① crop: (쌀이나 밀 같은 식물 / 농부들이 많은 양으로 재배하는 / 식량을 얻기 위해) 농작물","w":"② stem: (식물의) 줄기\n③ weed: 잡초\n④ fertilizer: 비료","k":"쌀이나 밀 같은 식물 / 농부들이 많은 양으로 재배하는 / 식량을 얻기 위해","m":0,"s":"\"a plant such as rice or wheat that farmers grow in large amounts for food\"","c":["crop","stem","weed","fertilizer"],"mn":"농작물","hk":"crop(농작물)은 농부가 많이 재배하는 식물. weed(잡초)·stem(줄기)·fertilizer(비료)는 농작물 자체가 아님.","ex":[["Rice is [[an important crop]] in Asia.","쌀은 아시아에서 [[중요한 농작물]]이다."],["Farmers [[grow crops]] on the hills.","농부들은 언덕에서 [[농작물을 재배한다]]."],["Heavy rain destroyed [[the whole crop]] this year.","올해 폭우가 [[농작물 전체]]를 망쳤다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"ingredient","a":"ingredient","e":"ingredient 재료, 성분, 구성 요소","k":"그 요리사는 자신에게 필요한 모든 재료를 조리법 카드 뒷면에 적었다.","m":0,"s":"The chef wrote down every i______ he needed on the back of the recipe card.","mn":"재료, 성분, 구성 요소","hk":"ingredient(재료)의 끝은 -ent가 아니라 -ient. recipe(조리법)에 적힌 재료를 가리킴.","ex":[["Sugar is [[a key ingredient]] in this cake.","설탕은 이 케이크의 [[핵심 재료]]이다."],["Mix [[all the ingredients]] in a large bowl.","큰 그릇에 [[모든 재료]]를 섞어라."],["[[Fresh ingredients]] make the soup taste better.","[[신선한 재료]]가 수프를 더 맛있게 만든다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"aggressive","a":"2","e":"② fierce: 사나운, 격렬한 (그 다친 야생 동물은 연구자들이 가까이 올 때마다 공격적으로 변했다.) / aggressive(공격적인, 적극적인)의 유의어.","w":"① friendly: 다정한, 친절한\n③ rude: 무례한\n④ cruel: 잔인한","k":"그 다친 야생 동물은 연구자들이 가까이 올 때마다 공격적으로 변했다.","m":0,"s":"The injured wild animal became aggressive whenever the researchers came near.","h":"aggressive","c":["friendly","fierce","rude","cruel"],"mn":"공격적인, 적극적인","hk":"aggressive(공격적인)와 같은 편은 fierce(사나운). friendly(다정한)는 반대편, rude(무례한)·cruel(잔인한)은 유의어가 아닌 속임수.","ex":[["The dog was [[aggressive toward]] strangers.","그 개는 낯선 사람들에게 [[공격적이었다]]."],["Our team plays [[an aggressive style]] of soccer.","우리 팀은 [[공격적인 스타일]]의 축구를 한다."],["The company made [[an aggressive plan]] to grow fast.","그 회사는 빠르게 성장하려고 [[적극적인 계획]]을 세웠다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"capacity","a":"4","e":"④ capacity: 수용력, 정원 (이 작은 엘리베이터는 정원이 단 8명이다.)","w":"① depth: 깊이\n② speed: 속도\n③ weight: 무게","k":"이 작은 엘리베이터는 정원이 단 8명이다.","m":0,"s":"This small elevator has a ________ of only eight people.","c":["depth","speed","weight","capacity"],"mn":"수용력, 정원","hk":"capacity(수용력, 정원)는 담을 수 있는 최대량. depth(깊이)·speed(속도)·weight(무게)는 사람 수를 말하는 단어가 아님.","ex":[["The hall has [[a capacity of 500 people]].","그 홀은 [[정원이 500명]]이다."],["The stadium was [[filled to capacity]].","경기장은 [[정원까지 가득 찼다]]."],["This battery has [[a large capacity]].","이 배터리는 [[큰 용량]]을 가지고 있다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"leave","a":"2","e":"①떠나다 / ②남기다 / ③떠나다 / ④떠나다 [②번만 의미가 다름]","k":"①우리는 폭풍이 오기 전에 그 건물을 떠나야 한다.\n②제가 자리에 없으면 메시지를 남겨 주세요.\n③그들은 아침 7시에 그 역을 떠날 것이다.\n④그녀는 더 나은 직장을 찾기 위해 고향을 떠나야 했다.","m":0,"c":["We must leave the building before the storm arrives.","Please leave a message if I am not at my desk.","They will leave the station at seven in the morning.","She had to leave her hometown to find a better job."],"hc":"leave|leave|leave|leave","mn":"떠나다 / 남기다","hk":"leave(떠나다)는 장소를 벗어남. 2번 leave a message(메시지를 남기다)만 '남기다'로 뜻이 다름.","ex":[["Please [[leave the room]] quietly.","조용히 [[방을 나가]] 주세요.","leave (동) 떠나다"],["The bus will [[leave the station]] soon.","버스가 곧 [[역을 떠날]] 것이다.","leave (동) 떠나다"],["Please [[leave a note]] on my desk.","제 책상에 [[메모를 남겨]] 주세요.","leave (동) 남기다"]]}]},{"day":72,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"jail","a":"4","e":"④ jail: (건물 / 사람들이 갇혀 지내는 / 범죄에 대한 처벌로) 교도소, 감옥","w":"① temple: 사원, 절\n② court: 법정, 법원\n③ hospital: 병원","k":"건물 / 사람들이 갇혀 지내는 / 범죄에 대한 처벌로","m":0,"s":"\"a building where people are kept as a punishment for a crime\"","c":["temple","court","hospital","jail"],"mn":"교도소, 감옥","hk":"jail(교도소)은 범죄로 처벌받는 사람이 갇히는 건물. court(법정)은 재판하는 곳, temple(사원)·hospital(병원)과 구분.","ex":[["The thief was sent to [[jail]] for two years.","그 도둑은 2년 동안 [[교도소]]에 보내졌다."],["He spent a night [[in jail]] after the fight.","그는 싸움 뒤 하룻밤을 [[교도소에서]] 보냈다."],["The prisoner sat quietly in [[a jail cell]].","죄수는 [[교도소 감방]]에 조용히 앉아 있었다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"lack","a":"1,2","e":"① scarcity: 부족, 결핍, 희소성 (긴 가뭄이 든 여름 동안 비가 부족해서 많은 어린 나무들이 죽었다.) / lack(부족, 결핍)의 유의어.\n② absence: 부재, 없음, 결핍","w":"③ excess: 과잉, 초과\n④ plenty: 풍부, 많음","k":"긴 가뭄이 든 여름 동안 비가 부족해서 많은 어린 나무들이 죽었다.","m":2,"s":"Many young trees died because of the lack of rain during the long dry summer.","h":"lack","c":["scarcity","absence","excess","plenty"],"mn":"부족, 결핍","hk":"lack(부족)과 같은 편은 scarcity(부족)·absence(부재). excess(과잉)·plenty(풍부)는 반대편.","ex":[["Plants die from [[lack of water]].","식물은 [[물 부족]] 때문에 죽는다."],["There is [[a lack of]] parking space here.","여기는 주차 공간이 [[부족하다]]."],["His [[lack of sleep]] made him tired all day.","[[수면 부족]] 때문에 그는 하루 종일 피곤했다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"assess","a":"3","e":"③ assess: 평가하다, 가늠하다","w":"① assign: 배정하다, 할당하다\n② assemble: 조립하다\n④ assure: 확신시키다, 보장하다","m":0,"s":"assess","c":["배정하다, 할당하다","조립하다","평가하다, 가늠하다","확신시키다, 보장하다"],"mn":"평가하다, 가늠하다","hk":"assess(평가하다)는 가치·수준을 가늠함. assign(배정하다)·assemble(조립하다)·assure(확신시키다)는 as-로 시작해 철자만 비슷.","ex":[["Teachers [[assess students]] with a short test.","교사들은 짧은 시험으로 [[학생들을 평가한다]]."],["We need to [[assess the damage]] after the storm.","폭풍 뒤에 우리는 [[피해를 평가해야]] 한다."],["The doctor will [[assess your health]] today.","의사가 오늘 [[당신의 건강 상태를 평가할]] 것이다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"wander","a":"wander","e":"wander 거닐다, 헤매다","k":"길을 잃은 아이는 부모님을 찾아 어두운 거리를 헤매기 시작했다.","m":0,"s":"The lost child began to w______ through the dark streets looking for his parents.","mn":"거닐다, 헤매다","hk":"wander(헤매다)는 소리가 [원더]라 wonder(궁금하다)로 쓰기 쉬움. 가운데는 a: w-a-n-d-e-r.","ex":[["We [[wander through]] the old market on weekends.","우리는 주말마다 오래된 시장을 [[거닌다]]."],["Sheep [[wander across]] the green hills.","양들이 푸른 언덕을 [[돌아다닌다]]."],["Do not [[wander off]] alone at night.","밤에 혼자 [[헤매고 다니지]] 마라."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"encourage","a":"1","e":"① discourage: 낙담시키다, 의욕을 꺾다 (그 코치의 말은 어려운 경기 전에 늘 어린 선수들을 격려한다.) / encourage(격려하다, 북돋우다)의 반의어.","w":"② inspire: 고무하다, 영감을 주다\n③ motivate: 동기를 부여하다\n④ support: 지지하다, 응원하다","k":"그 코치의 말은 어려운 경기 전에 늘 어린 선수들을 격려한다.","m":0,"s":"The coach's words always encourage the young players before a difficult match.","h":"encourage","c":["discourage","inspire","motivate","support"],"mn":"격려하다, 북돋우다","hk":"encourage(격려하다)는 courage(용기)를 넣어 줌, discourage(낙담시키다)는 용기를 꺾음. inspire(고무하다)·motivate(동기를 부여하다)는 같은 편.","ex":[["Parents should [[encourage their children]] to read.","부모는 아이들이 책을 읽도록 [[격려해야]] 한다.","encourage (동) 격려하다, 북돋우다"],["Bad weather can [[discourage people]] from going out.","나쁜 날씨는 사람들이 외출하지 않게 [[의욕을 꺾을]] 수 있다.","discourage (동) 낙담시키다, 의욕을 꺾다"],["Do not let one mistake [[discourage you]].","한 번의 실수가 [[너를 낙담시키게]] 두지 마라.","discourage (동) 낙담시키다, 의욕을 꺾다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"distract","a":"3","e":"③ distract: (주의를) 산만하게 하다, 딴 데로 돌리다 (복도에서 나는 소음이 그녀의 숙제 집중을 흐트러뜨리기 시작했다.)","w":"① detach: 떼어 내다, 분리하다\n② remind: 상기시키다\n④ deprive: 빼앗다, 박탈하다","k":"복도에서 나는 소음이 그녀의 숙제 집중을 흐트러뜨리기 시작했다.","m":0,"s":"The noise from the hallway began to ________ her from her homework.","c":["detach","remind","distract","deprive"],"mn":"(주의를) 산만하게 하다, 딴 데로 돌리다","hk":"distract(산만하게 하다)는 주의를 딴 데로 돌림. remind(상기시키다)는 기억나게 함, detach(떼어 내다)·deprive(빼앗다)와 구분.","ex":[["Loud music can [[distract students]] during a test.","시끄러운 음악은 시험 중 [[학생들의 집중을 흐트러뜨릴]] 수 있다."],["Do not let your phone [[distract you]] from studying.","공부하는 동안 휴대폰이 [[너의 주의를 딴 데로 돌리지]] 않게 해라."],["Please do not [[distract the driver]].","[[운전자의 주의를 흐트러뜨리지]] 마세요."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"produce","a":"3","e":"produce (동) 생산하다 - productive (형) 생산적인\n③ create (동) 창조하다 - creative (형) 창의적인","w":"① kind (형) 친절한 - kindness (명) 친절\n② slow (형) 느린 - slowly (부) 느리게\n④ success (명) 성공 - succeed (동) 성공하다","m":0,"s":"produce - productive","c":["kind - kindness","slow - slowly","create - creative","success - succeed"],"mn":"생산하다","hk":"produce(생산하다, 동사)에 -ive가 붙어 productive(생산적인, 형용사), create(창조하다, 동사)는 creative(창의적인, 형용사). 동사에서 형용사로.","ex":[["The factory can [[produce 500 cars]] a day.","그 공장은 하루에 [[자동차 500대를 생산할]] 수 있다.","produce (동) 생산하다"],["It was [[a productive meeting]].","그것은 [[생산적인 회의]]였다.","productive (형) 생산적인"],["Artists [[create new things]] from simple ideas.","예술가들은 단순한 생각에서 [[새로운 것을 창조한다]].","create (동) 창조하다"],["She has [[a creative mind]].","그녀는 [[창의적인 생각]]을 가졌다.","creative (형) 창의적인"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"context","a":"context","e":"context (명) 문맥 / (명) (사건의) 배경","k":"문장의 문맥을 통해 새 단어의 뜻을 짐작할 수 있는 경우가 많다.\n그 소설은 당시 진행 중이던 전쟁이라는 배경 속에서 읽혀야 한다.","m":0,"s":"You can often guess the meaning of a new word from the c______ of the sentence.\nThe novel should be read in the c______ of the war that was going on at that time.","mn":"문맥 / 배경","hk":"context(문맥, 배경)는 글의 앞뒤 흐름이나 사건의 상황. in the context of(~의 맥락에서)가 대표 짝.","ex":[["Guess the meaning from [[the context]].","[[문맥]]에서 뜻을 짐작해 봐라.","context (명) 문맥"],["Words can change meaning in [[a different context]].","단어는 [[다른 문맥]]에서 뜻이 달라질 수 있다.","context (명) 문맥"],["Read the poem in [[the context of]] his life.","그 시를 그의 삶이라는 [[배경 속에서]] 읽어 봐라.","context (명) 배경"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"pessimistic","a":"4","e":"④ negative: 부정적인 (그는 그 팀이 결승에서 이길 가능성에 대해 꽤 비관적으로 말했다.) / pessimistic(비관적인, 부정적인)의 유의어.","w":"① relaxed: 느긋한, 여유 있는\n② stable: 안정된, 안정적인\n③ hopeful: 희망에 찬, 기대하는","k":"그는 그 팀이 결승에서 이길 가능성에 대해 꽤 비관적으로 말했다.","m":0,"s":"He sounded quite pessimistic about the team's chances of winning the final.","h":"pessimistic","c":["relaxed","stable","hopeful","negative"],"mn":"비관적인, 부정적인","hk":"pessimistic(비관적인)과 같은 편은 negative(부정적인). hopeful(희망에 찬)은 반대편, relaxed(느긋한)·stable(안정된)은 다른 뜻.","ex":[["She is [[pessimistic about]] her chances.","그녀는 자신의 가능성에 대해 [[비관적이다]]."],["Do not be so [[pessimistic]] about the future.","미래에 대해 너무 [[비관적으로]] 생각하지 마라."],["He gave [[a pessimistic answer]] about the plan.","그는 그 계획에 대해 [[비관적인 대답]]을 했다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"disaster","a":"4","e":"④ disaster: 재난, 참사, 천재지변","w":"① rescue: 구조, 구출\n② victim: 피해자, 희생자\n③ emergency: 비상사태, 응급 상황","m":0,"s":"\"재난, 참사, 천재지변\"","c":["rescue","victim","emergency","disaster"],"mn":"재난, 참사, 천재지변","hk":"disaster(재난)는 큰 피해를 주는 사건. rescue(구조)는 재난 뒤의 행동, victim(피해자)은 사람, emergency(비상사태)는 급한 상황으로 구분.","ex":[["The flood was [[a terrible disaster]].","그 홍수는 [[끔찍한 재난]]이었다."],["People helped each other after [[the natural disaster]].","사람들은 [[자연재해]] 뒤에 서로 도왔다."],["The plan ended in [[total disaster]].","그 계획은 [[완전한 참사]]로 끝났다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"element","a":"1","e":"① element: 요소, 성분 (신뢰는 오래가는 우정의 가장 중요한 요소이다.)","w":"② signal: 신호\n③ stage: 단계, 무대\n④ method: 방법, 방식","k":"신뢰는 오래가는 우정의 가장 중요한 요소이다.","m":0,"s":"Trust is the most important ________ of a lasting friendship.","c":["element","signal","stage","method"],"mn":"요소, 성분","hk":"element(요소)는 전체를 이루는 한 부분. key element(핵심 요소)가 대표 짝이고 signal(신호)·stage(단계)·method(방법)는 어색.","ex":[["Water is [[a key element]] of life.","물은 생명의 [[핵심 요소]]이다."],["Honesty is [[an important element]] of a good team.","정직은 좋은 팀의 [[중요한 요소]]이다."],["There is [[an element of truth]] in his story.","그의 이야기에는 [[일말의 진실]]이 있다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"achieve","a":"4","e":"④ fail: 실패하다 (수년간의 노력 끝에, 그녀는 마침내 자신의 목표를 달성할 수 있었다.) / achieve(이루다, 달성하다)의 반의어.","w":"① attain: 달성하다, 이루다\n② realize: 실현하다, 이루다\n③ fulfill: 이행하다, 실현하다","k":"수년간의 노력 끝에, 그녀는 마침내 자신의 목표를 달성할 수 있었다.","m":0,"s":"After years of hard work, she was finally able to achieve her goal.","h":"achieve","c":["attain","realize","fulfill","fail"],"mn":"이루다, 달성하다","hk":"achieve(이루다)의 반대편은 fail(실패하다). attain(달성하다)·realize(실현하다)·fulfill(이행하다)은 모두 같은 편 속임수.","ex":[["She worked hard to [[achieve her goal]].","그녀는 [[목표를 이루려고]] 열심히 노력했다.","achieve (동) 이루다, 달성하다"],["Many students [[fail the test]] the first time.","많은 학생들이 처음에는 [[시험에 떨어진다]].","fail (동) 실패하다"],["Do not be afraid to [[fail]] and try again.","[[실패하는]] 것을 두려워하지 말고 다시 해 봐라.","fail (동) 실패하다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"harvest","a":"3","e":"③ harvest: (밭에서 농작물을 거두어들이다 / 그것들이 먹을 수 있을 만큼 익었을 때) 수확하다, 거두어들이다","w":"① irrigate: 물을 대다, 관개하다\n② fertilize: 비료를 주다\n④ prune: 가지치기하다","k":"밭에서 농작물을 거두어들이다 / 그것들이 먹을 수 있을 만큼 익었을 때","m":0,"s":"\"to gather crops from the fields when they are ready to be eaten\"","c":["irrigate","fertilize","harvest","prune"],"mn":"수확하다, 거두어들이다","hk":"harvest(수확하다)는 다 익은 농작물을 거둠. irrigate(물을 대다)·fertilize(비료를 주다)·prune(가지치기하다)은 수확 전에 하는 일.","ex":[["Farmers [[harvest rice]] in the fall.","농부들은 가을에 [[벼를 수확한다]]."],["We [[harvest the apples]] when they turn red.","우리는 사과가 빨갛게 되면 [[사과를 수확한다]]."],["It takes weeks to [[harvest the whole field]].","[[밭 전체를 수확하는]] 데 몇 주가 걸린다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"occupation","a":"occupation","e":"occupation 직업","k":"지원서에 이름, 나이, 그리고 직업을 적어 주세요.","m":0,"s":"Please write your name, age, and o______ on the application form.","mn":"직업","hk":"occupation(직업)은 cc(c 두 개)에 p는 하나, 끝은 -tion. job(직업)의 격식 있는 말.","ex":[["What is [[your occupation]]?","[[당신의 직업]]은 무엇입니까?"],["[[His main occupation]] is teaching math.","[[그의 주된 직업]]은 수학을 가르치는 것이다."],["Farming is [[a common occupation]] in this village.","농업은 이 마을에서 [[흔한 직업]]이다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"spring","a":"3","e":"①샘 / ②샘 / ③용수철, 스프링 / ④샘 [③번만 의미가 다름]","k":"①차가운 신선한 물이 나오는 샘이 오래된 돌담 옆에서 솟아오른다.\n②그 마을은 언덕에 있는 맑은 샘에서 식수를 얻는다.\n③그 매트리스는 용수철 하나가 부러져서 불편하다.\n④여행자들은 물병을 채우기 위해 종종 그 샘에 들른다.","m":0,"c":["A cold spring of fresh water bubbles up beside the old stone wall.","The village gets its drinking water from a clear spring in the hills.","The mattress is uncomfortable because one spring is broken.","Travelers often stop at the spring to fill their water bottles."],"hc":"spring|spring|spring|spring","mn":"샘 / 용수철, 스프링","hk":"spring(샘)은 물이 솟는 곳. 3번 spring(용수철)만 튀어 오르는 쇠 부품으로 뜻이 다름.","ex":[["Cool water flows out of [[a mountain spring]].","시원한 물이 [[산속 샘]]에서 흘러나온다.","spring (명) 샘"],["They drank water from [[a natural spring]].","그들은 [[자연 샘]]의 물을 마셨다.","spring (명) 샘"],["The bed has [[a broken spring]].","그 침대에는 [[부러진 용수철]]이 있다.","spring (명) 용수철, 스프링"]]}]},{"day":73,"q":[{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"talent","a":"2","e":"② talent: 재능 (누구나 그림 그리는 법을 배울 수 있지만, 진짜 재능은 타고나는 것이다.)","w":"① practice: 연습\n③ courage: 용기\n④ effort: 노력","k":"누구나 그림 그리는 법을 배울 수 있지만, 진짜 재능은 타고나는 것이다.","m":0,"s":"Anyone can learn to draw, but real ________ is something you are born with.","c":["practice","talent","courage","effort"],"mn":"재능","hk":"talent(재능)는 타고난 능력. effort(노력)·practice(연습)는 쌓아 가는 쪽, courage(용기)는 마음가짐이라 '타고난 것'과 다름.","ex":[["She has [[a talent for]] music.","그녀는 음악에 [[재능이 있다]]."],["[[Natural talent]] is not enough; you must practice.","[[타고난 재능]]만으로는 충분하지 않고 연습해야 한다."],["The school looks for [[musical talent]].","그 학교는 [[음악적 재능]]을 찾는다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"refund","a":"refund","e":"refund 환불","k":"신발이 맞지 않으면, 반품하고 전액 환불을 받을 수 있다.","m":0,"s":"If the shoes do not fit, you can return them and get a full r______.","mn":"환불","hk":"refund(환불)
