var D=[{"n": 1, "tag": null, "en": "In 1963, as a high school student, Dick Fosbury took part on the national high school high jump competition. He jumped high but his body touched the bar, and the bar fell to the ground. He lost the competition.", "ko": "1963년, 고등학생이었던 Dick Fosbury는 전국 고등학교 높이뛰기 대회에 참가했다. 그는 높이 뛰었지만 몸이 바에 닿아 바가 땅으로 떨어졌다. 그는 대회에서 패배했다.", "ok": false, "foot": [], "fixes": [{"wrong": "on", "right": "in", "partial": false, "at": [11], "point": "take part in: take part in: ~에 참가하다", "topic": "take part in", "memo": "take part in: ~에 참가하다"}]}, {"n": 2, "tag": "올림픽 무대", "en": "Just five years later, Fosbury was taken part in the Olympic high jump final. He ran toward the bar, then he flew as high as a bird.", "ko": "딱 5년 후, Fosbury는 올림픽 높이뛰기 결승전에 참가하고 있었다. 그는 바를 향해 달려갔고, 새처럼 높이 날아올랐다.", "ok": false, "foot": [], "fixes": [{"wrong": "taken", "right": "taking", "partial": false, "at": [6], "point": "과거진행형: was + 현재분사 taking", "topic": "과거진행형", "memo": "was + 현재분사 taking"}]}, {"n": 3, "tag": null, "en": "And he easily cleared the bar. “No way!” “What is that?”", "ko": "그리고 손쉽게 바를 넘었다. “말도 안 돼!” “저게 뭐야?”", "ok": true, "foot": [], "fixes": []}, {"n": 4, "tag": null, "en": "Everyone were shocked by his jumping style and laughed at it. Fosbury went over the bar on his back!", "ko": "모든 사람들이 그의 점프 방식에 놀라며 그것을 비웃었다. Fosbury는 등으로 바를 넘었던 것이다!", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [1], "point": "주어와 동사의 수일치: Everyone은 단수 취급이라 was", "topic": "주어와 동사의 수일치", "memo": "Everyone은 단수 취급이라 was"}]}, {"n": 5, "tag": null, "en": "He sets a new high jump record at the 1968 Mexico Olympics. How did he do that and won a gold medal in just five years?", "ko": "그는 1968년 멕시코 올림픽에서 새로운 높이뛰기 기록을 세웠다. 그는 어떻게 단 5년 만에 이런 성과를 이루고 금메달을 딸 수 있었을까?", "ok": false, "foot": [], "fixes": [{"wrong": "sets", "right": "set", "partial": false, "at": [1], "point": "동사의 시제: 1968년의 일이라 과거형 set", "topic": "동사의 시제", "memo": "1968년의 일이라 과거형 set"}, {"wrong": "won", "right": "win", "partial": false, "at": [18], "point": "did 뒤 동사원형 병렬: did he do ~ and win: 동사원형으로 병렬", "topic": "did 뒤 동사원형 병렬", "memo": "did he do ~ and win: 동사원형으로 병렬"}]}, {"n": 6, "tag": "새로운 점프 방식", "en": "After Fosbury failed in the national competition, he was sadly. His records were not improving although he did his best.", "ko": "Fosbury는 전국 대회에서 실패한 후, 슬퍼했다. 그는 최선을 다했지만 기록이 나아지지 않았다.", "ok": false, "foot": [], "fixes": [{"wrong": "sadly", "right": "sad", "partial": false, "at": [9], "point": "보어 자리의 형용사: be동사 뒤 보어에는 형용사 sad", "topic": "보어 자리의 형용사", "memo": "be동사 뒤 보어에는 형용사 sad"}]}, {"n": 7, "tag": null, "en": "However, he did not gave up and began to thinking about his jumping style.", "ko": "하지만 그는 포기하지 않고 자신의 점프 방식에 대해 고민하기 시작했다.", "ok": false, "foot": [], "fixes": [{"wrong": "gave", "right": "give", "partial": false, "at": [4], "point": "did not 뒤 동사원형: did not 뒤에는 동사원형 give", "topic": "did not 뒤 동사원형", "memo": "did not 뒤에는 동사원형 give"}, {"wrong": "thinking", "right": "think", "partial": false, "at": [9], "point": "begin + to부정사: to 뒤에는 동사원형 think", "topic": "begin + to부정사", "memo": "to 뒤에는 동사원형 think"}]}, {"n": 8, "tag": null, "en": "'When I jump forward, my toes, stomach, or chest touch the bar. It's important for these parts not to touch the bar.", "ko": "‘앞으로 점프하면 발가락, 배, 가슴이 바에 닿아. 이 부위들이 바에 닿지 않는 것이 중요해.", "ok": false, "foot": [], "fixes": [{"wrong": "touch", "right": "touches", "partial": false, "at": [9], "point": "주어와 동사의 수일치: or로 연결된 주어는 가까운 chest에 맞춰 touches", "topic": "주어와 동사의 수일치", "memo": "or로 연결된 주어는 가까운 chest에 맞춰 touches"}]}, {"n": 9, "tag": null, "en": "How I should jump?' After much thought, he came up with an idea.", "ko": "어떻게 점프해야 할까?’ 그는 오랜 생각 끝에 한 가지 아이디어를 떠올렸다.", "ok": false, "foot": [], "fixes": [{"wrong": "I should", "right": "should I", "partial": false, "at": [1], "point": "의문문의 어순: 의문사 뒤 조동사 + 주어", "topic": "의문문의 어순", "memo": "의문사 뒤 조동사 + 주어"}]}, {"n": 10, "tag": null, "en": "'How about jump backward instead of jumping forward? My back doesn't have toes or a chest, so nothing will touch the bar!'", "ko": "‘앞으로 점프하는 대신 뒤로 점프하는 건 어떨까? 등에는 발가락이나 가슴이 없으니 바에 닿을 일이 없잖아!’", "ok": false, "foot": [], "fixes": [{"wrong": "jump", "right": "jumping", "partial": false, "at": [2], "point": "How about + 동명사: How about 뒤에는 동명사 jumping", "topic": "How about + 동명사", "memo": "How about 뒤에는 동명사 jumping"}]}, {"n": 11, "tag": null, "en": "Fosbury started jumping over the bar on his back. This great idea created a new jumping style.", "ko": "Fosbury는 등으로 바를 넘기 시작했다. 이 훌륭한 아이디어는 새로운 높이뛰기 방식을 탄생시켰다.", "ok": true, "foot": [], "fixes": []}, {"n": 12, "tag": "아이디어가 만든 영웅", "en": "Before Fosbury, high jumpers only tried to jump forward. But Fosbury showed a new style of clear the bar on his back.", "ko": "Fosbury 이전에는 높이뛰기 선수들이 앞으로 뛰기만 했다. 하지만 Fosbury는 등으로 바를 넘는 새로운 방식을 선보였다.", "ok": false, "foot": [], "fixes": [{"wrong": "clear", "right": "clearing", "partial": false, "at": [16], "point": "전치사 뒤 동명사: 전치사 of 뒤에는 동명사 clearing", "topic": "전치사 뒤 동명사", "memo": "전치사 of 뒤에는 동명사 clearing"}]}, {"n": 13, "tag": null, "en": "This new jumping style named the “Fosbury Flop” after him. Other jumpers who jumped forward could not jump as high than Fosbury.", "ko": "이 새로운 점프 방식은 그의 이름을 따서 “Fosbury Flop”이라고 불리게 되었다. 앞으로 점프했던 다른 선수들은 Fosbury만큼 높이 뛸 수 없었다.", "ok": false, "foot": [], "fixes": [{"wrong": "named", "right": "was named", "partial": false, "at": [4], "point": "수동태: 방식이 '불린' 것이라 was named", "topic": "수동태", "memo": "방식이 '불린' 것이라 was named"}, {"wrong": "than", "right": "as", "partial": false, "at": [20], "point": "원급 비교: as high as: ~만큼 높이", "topic": "원급 비교", "memo": "as high as: ~만큼 높이"}]}, {"n": 14, "tag": null, "en": "They started using the Fosbury Flop and could jump about 10 centimeters high than before. Many people once laughed at Fosbury's jumping style.", "ko": "그들은 Fosbury Flop을 사용하기 시작했고, 기존보다 약 10cm 더 높이 뛸 수 있었다. 한때 많은 사람들이 Fosbury의 점프 방식을 보고 비웃었다.", "ok": false, "foot": [], "fixes": [{"wrong": "high",  RNUM=73;var TITLE_EN="Creative Thinking Makes a Difference";var PASS_EN=["Creative Thinking Makes a Difference", "In 1963, as a high school student, Dick Fosbury took part in the national high school high jump competition. He jumped high but his body touched the bar, and the bar fell to the ground. He lost the competition.", "Standing on the Olympic Stage of Dreams", "Just five years later, Fosbury was taking part in the Olympic high jump final. He ran toward the bar, then he flew as high as a bird. And he easily cleared the bar. “No way!” “What is that?” Everyone was shocked by his jumping style and laughed at it. Fosbury went over the bar on his back! He set a new high jump record at the 1968 Mexico Olympics. How did he do that and win a gold medal in just five years?", "The Creation of a New Jumping Style", "After Fosbury failed in the national competition, he was sad. His records were not improving although he did his best. However, he did not give up and began to think about his jumping style. 'When I jump forward, my toes, stomach, or chest touches the bar. It's important for these parts not to touch the bar. How should I jump?' After much thought, he came up with an idea. 'How about jumping backward instead of jumping forward? My back doesn't have toes or a chest, so nothing will touch the bar!' Fosbury started jumping over the bar on his back. This great idea created a new jumping style.", "A Creative Idea Makes a Hero", "Before Fosbury, high jumpers only tried to jump forward. But Fosbury showed a new style of clearing the bar on his back. This new jumping style was named the “Fosbury Flop” after him. Other jumpers who jumped forward could not jump as high as Fosbury. They started using the Fosbury Flop and could jump about 10 centimeters higher than before. Many people once laughed at Fosbury's jumping style. Now this style is so popular that most high jumpers use it. Fosbury's creative thinking made him a hero of the high jump."];var PASS_KO=["창의적 사고가 변화를 만든다", "1963년, 고등학생이었던 Dick Fosbury는 전국 고등학교 높이뛰기 대회에 참가했다. 그는 높이 뛰었지만 몸이 바에 닿아 바가 땅으로 떨어졌다. 그는 대회에서 패배했다.", "꿈의 올림픽 무대에 서서", "딱 5년 후, Fosbury는 올림픽 높이뛰기 결승전에 참가하고 있었다. 그는 바를 향해 달려갔고, 새처럼 높이 날아올랐다. 그리고 손쉽게 바를 넘었다. “말도 안 돼!” “저게 뭐야?” 모든 사람들이 그의 점프 방식에 놀라며 그것을 비웃었다. Fosbury는 등으로 바를 넘었던 것이다! 그는 1968년 멕시코 올림픽에서 새로운 높이뛰기 기록을 세웠다. 그는 어떻게 단 5년 만에 이런 성과를 이루고 금메달을 딸 수 있었을까?", "새로운 높이뛰기 방식의 탄생", "Fosbury는 전국 대회에서 실패한 후, 슬퍼했다. 그는 최선을 다했지만 기록이 나아지지 않았다. 하지만 그는 포기하지 않고 자신의 점프 방식에 대해 고민하기 시작했다. ‘앞으로 점프하면 발가락, 배, 가슴이 바에 닿아. 이 부위들이 바에 닿지 않는 것이 중요해. 어떻게 점프해야 할까?’ 그는 오랜 생각 끝에 한 가지 아이디어를 떠올렸다. ‘앞으로 점프하는 대신 뒤로 점프하는 건 어떨까? 등에는 발가락이나 가슴이 없으니 바에 닿을 일이 없잖아!’ Fosbury는 등으로 바를 넘기 시작했다. 이 훌륭한 아이디어는 새로운 높이뛰기 방식을 탄생시켰다.", "창의적인 아이디어가 영웅을 만든다", "Fosbury 이전에는 높이뛰기 선수들이 앞으로 뛰기만 했다. 하지만 Fosbury는 등으로 바를 넘는 새로운 방식을 선보였다. 이 새로운 점프 방식은 그의 이름을 따서 “Fosbury Flop”이라고 불리게 되었다. 앞으로 점프했던 다른 선수들은 Fosbury만큼 높이 뛸 수 없었다. 그들은 Fosbury Flop을 사용하기 시작했고, 기존보다 약 10cm 더 높이 뛸 수 있었다. 한때 많은 사람들이 Fosbury의 점프 방식을 보고 비웃었다. 이제 이 방식은 너무나 널리 퍼져 대부분의 높이뛰기 선수들이 사용하고 있다. Fosbury의 창의적인 사고가 그를 높이뛰기의 영웅으로 만들었다."];var BG=[{"qs": [{"n": 6, "q": "윗글의 빈칸에 들어갈 말로 알맞은 것은?   He ran toward the bar, then he flew as high as a bird. And he easily ________ the bar.", "o": ["touched", "broke", "created", "cleaned", "cleared"], "a": 4, "ans": "cleared", "ko": ["닿았다", "부쉈다", "만들었다", "청소했다", "(장애물을) 넘었다"], "evs": [["He ran toward the bar, then he flew as high as a bird.", "그는 바를 향해 달려갔고, 새처럼 높이 날아올랐다."]], "ow": ["오답 ✕ — touched는 '닿았다'이다. 앞에서 바에 닿아서 졌는데, 이번에는 새처럼 높이 날아올랐으므로 닿지 않고 넘었다.", "오답 ✕ — broke는 '부쉈다'이다. 높이뛰기에서 바를 부수는 것은 성공이 아니다.", "오답 ✕ — created는 '만들었다'이다. 바를 만든 것이 아니다.", "오답 ✕ — cleaned는 '청소했다'이다. 문맥과 맞지 않는다.", "정답 ○ — 'he flew as high as a bird'(새처럼 높이 날아올랐다)이므로 바를 쉽게 넘었다, 즉 cleared이다."], "memo": ["정답 ⑤: cleared(넘었다)", "근거: He ran toward the bar, then he flew as high as a bird.(그는 바를 향해 달려갔고, 새처럼 높이 날아올랐다.)", "함정: 1963년에는 바에 닿아 실패했지만, 올림픽에서는 닿지 않고 성공 ✕ touched"], "why": "새처럼 높이 날아올라 바를 넘었다.", "ev": ["He ran toward the bar, then he flew as hig
