,"r":{"a":"4) 더 큰 바보 이론은 합리적인 전략처럼 보일 수 있지만 매우 위험할 수 있다.","ev":"8번 문장","s":[[8,"While it might seem like a rational investment strategy, the greater fool theory can be extremely hazardous.","그것이 합리적인 투자 전략처럼 보일 수 있는 한편, 더 큰 바보 이론은 극도로 위험할 수 있다."]],"w":"While은 '~이지만'이라는 대조예요. 앞부분은 합리적으로 보인다는 것이고, 뒷부분은 극도로 위험하다는 것이에요. 그래서 안전하다거나 더 낫다는 말은 맞지 않아요.","c":4},"h":"0be471bb76"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["더 큰 바보 이론은 뜨거운 감자 게임과 유사하다.","더 큰 바보 이론은 뜨거운 감자 게임과 정반대이다.","뜨거운 감자 게임은 마이클이 만들어 낸 개념이다.","뜨거운 감자 게임은 수집가들이 사용하는 일종의 투자 규칙이다."],"opts":["The greater fool theory is similar to the hot potato game.","The greater fool theory is the opposite of the hot potato game.","The hot potato game is a concept created by Michael.","The hot potato game is a kind of investment rule used by collectors."],"r":{"a":"1) The greater fool theory is similar to the hot potato game. (더 큰 바보 이론은 뜨거운 감자 게임과 유사하다.)","ev":"4~5번 문장","s":[[4,"This is a concept whereby an investor purchases an overvalued asset based on the belief that another person will buy it at a higher price.","이것은 투자자가 다른 사람이 더 높은 가격에 그것을 살 것이라는 믿음을 바탕으로 과대평가된 자산을 구매하는 개념이다."],[5,"Basically, it is similar to the hot potato game.","기본적으로, 이것은 뜨거운 감자 게임과 유사하다."]],"w":"5번 문장에서 이 개념(더 큰 바보 이론)은 뜨거운 감자 게임과 유사하다고 해요.","c":1},"h":"76f0c896b5"},{"n":9,"t":"sum","q":"In the greater fool theory, the asset’s price is (A) to rise, and the existence of a potential buyer is also (B).","ko":"더 큰 바보 이론에서 자산의 가격이 오를지는 (A), 잠재적 구매자의 존재 또한 (B).","oko":["(A) 확실하다 / (B) 예측 불가능하다","(A) 불확실하다 / (B) 예측 불가능하다","(A) 불확실하다 / (B) 확실하다","(A) 확실하다 / (B) 확실하다","(A) 값싸다 / (B) 예측 불가능하다"],"opts":["(A) sure / (B) unpredictable","(A) uncertain / (B) unpredictable","(A) uncertain / (B) certain","(A) sure / (B) certain","(A) cheap / (B) unpredictable"],"r":{"a":"2) (A) uncertain / (B) unpredictable ((A) 불확실하다 / (B) 예측 불가능하다)","ev":"9번 문장","s":[[9,"Not only is the asset’s price uncertain to rise, but also the existence of a potential buyer is unpredictable.","자산의 가격이 오를지는 불확실할 뿐만 아니라, 잠재적 구매자의 존재 또한 예측 불가능하다."]],"w":"9번 문장에서 자산의 가격이 오를지는 불확실하고(uncertain), 잠재적 구매자의 존재도 예측 불가능하다(unpredictable)고 해요.","c":2},"h":"17c8248176"},{"n":10,"t":"fill","q":"His [A] can be [B] by the greater fool theory.","ko":"그의 [A]은(는) 더 큰 바보 이론에 의해 [B] 수 있다.","bank":["behavior","explained","willing","rational","hazardous","extremely"],"bko":{"behavior":"행동","explained":"설명되다","willing":"기꺼이 하는","rational":"합리적인","hazardous":"위험한","extremely":"극도로"},"r":{"a":"[A] behavior (행동), [B] explained (설명되다)","ev":"3번 문장","s":[[3,"His behavior can be explained by the greater fool theory.","그의 행동은 더 큰 바보 이론으로 설명될 수 있다."]],"w":"3번 문장에서 마이클의 행동(behavior)은 더 큰 바보 이론으로 설명될(explained) 수 있다고 해요. 나머지 단어는 빈칸에 문법상 들어가지 않아요.","c":null},"h":"14b369b9a1"}]},{"u":3,"id":"ms3-03-3","no":3,"ko":"키스할 수도, 울 수도 있어","items":[{"n":1,"t":"tf","q":"The kiss-and-cry is often decorated like a TV set.","ko":"키스 앤 크라이는 종종 TV 세트처럼 장식된다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"It is often decorated like a TV set, with beautiful flowers, colorful backdrops, and special lighting, while cameras are set up to capture the skaters’ reactions.","그곳은 종종 아름다운 꽃, 다채로운 배경, 그리고 특수 조명으로 TV 세트장처럼 장식되며, 한편 카메라는 선수들의 반응을 포착하기 위해 설치된다."]],"w":"9번 문장에서 이 구역은 종종 TV 세트처럼 아름다운 꽃, 다채로운 배경, 특수 조명으로 장식된다고 해요. 맞는 내용이에요.","c":"T"},"h":"0b9bf01d5a"},{"n":2,"t":"tf","q":"Jane Erkko noticed that skaters usually showed no emotion in the waiting area.","ko":"Jane Erkko는 선수들이 대기 구역에서 보통 아무 감정도 드러내지 않는다는 것을 알아차렸다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"She noticed that when skaters received their scores in the waiting area, they tended to kiss someone to celebrate or burst into tears of joy or sorrow, depending on how well they did.","그녀는 선수들이 대기 구역에서 점수를 받을 때, 그들이 얼마나 잘했는지에 따라 축하하기 위해 누군가에게 키스하거나 기쁨 또는 슬픔의 눈물을 터뜨리는 경향이 있다는 것을 알아차렸다."]],"w":"5번 문장에서 선수들은 점수를 받을 때 키스를 하거나 기쁨 또는 슬픔의 눈물을 터뜨리는 경향이 있었어요. 감정을 드러내지 않았다는 말은 반대예요.","c":"F"},"h":"43b2bd19de"},{"n":3,"t":"tf","q":"Figure skaters face one more challenge before they begin their routine.","ko":"피겨 스케이팅 선수들은 연기를 시작하기 전에 한 가지 더 도전에 직면한다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"After finishing a routine full of stunning leaps and brilliant spins, figure skaters face one more challenge.","놀라운 도약과 화려한 회전으로 가득 찬 연기를 마친 후, 피겨 스케이트 선수들은 한 가지 더 도전에 직면한다."]],"w":"1번 문장에서 선수들은 연기를 '마친 뒤(After finishing a routine)' 한 가지 더 도전에 직면해요. 시작하기 전이라는 말은 틀려요.","c":"F"},"h":"f5a0189a03"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Since this name was quite appropriate, it became the official terminology in figure skating.)","ko":"이 이름은 꽤 적절했기 때문에, 그것은 피겨 스케이팅에서 공식 용어가 되었다.","opts":["낯선","적절한","어려운","우스운"],"word":"appropriate","r":{"a":"2) 적절한","ev":"7번 문장","s":[[7,"Since this name was quite appropriate, it became the official terminology in figure skating.","이 이름은 꽤 적절했기 때문에, 그것은 피겨 스케이팅에서 공식 용어가 되었다."]],"w":"이름이 공식 용어가 된 이유가 이 이름이 꽤 알맞았기 때문이에요. appropriate = 적절한이에요. '낯선'이나 '어려운'은 공식 용어가 된 이유가 되기 어려워요.","c":2},"h":"59c4af1d04"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They tended to kiss someone to celebrate or burst into tears of joy or sorrow.)","ko":"그들은 축하하기 위해 누군가에게 키스하거나 기쁨 또는 슬픔의 눈물을 터뜨리는 경향이 있었다.","opts":["~하는 경향이 있었다","~할 필요가 없었다","~하려고 시도했다","~하는 것을 잊었다"],"word":"tended","r":{"a":"1) ~하는 경향이 있었다","ev":"5번 문장","s":[[5,"She noticed that when skaters received their scores in the waiting area, they tended to kiss someone to celebrate or burst into tears of joy or sorrow, depending on how well they did.","그녀는 선수들이 대기 구역에서 점수를 받을 때, 그들이 얼마나 잘했는지에 따라 축하하기 위해 누군가에게 키스하거나 기쁨 또는 슬픔의 눈물을 터뜨리는 경향이 있다는 것을 알아차렸다."]],"w":"선수들이 점수를 받을 때 대체로 키스하거나 눈물을 터뜨리곤 했다는 뜻이에요. tend to-v = ~하는 경향이 있다예요.","c":1},"h":"5b68a8f018"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen someone asked her about the area, she called it the kiss-and-cry.","ko":"밑줄 친 it이 가리키는 것은?","sko":"누군가가 그녀에게 그 구역에 대해 물었을 때, 그녀는 그곳을 키스 앤 크라이라고 불렀다.","opts":["이름","질문","대기 구역","점수"],"r":{"a":"3) 대기 구역","ev":"5~6번 문장","s":[[5,"She noticed that when skaters received their scores in the waiting area, they tended to kiss someone to celebrate or burst into tears of joy or sorrow, depending on how well they did.","그녀는 선수들이 대기 구역에서 점수를 받을 때, 그들이 얼마나 잘했는지에 따라 축하하기 위해 누군가에게 키스하거나 기쁨 또는 슬픔의 눈물을 터뜨리는 경향이 있다는 것을 알아차렸다."],[6,"When someone asked her about the area, she called it the kiss-and-cry.","누군가가 그녀에게 그 구역에 대해 물었을 때, 그녀는 그곳을 키스 앤 크라이라고 불렀다."]],"w":"Erkko는 5번의 waiting area(대기 구역)를 보고 그곳을 키스 앤 크라이라고 불렀어요. 키스 앤 크라이라는 이름이 붙은 대상은 이름이 아니라 구역이에요.","c":3},"h":"2ceef39d91"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They must stand in the “kiss-and-cry” to receive their scores, with everyone watching them intently to see how they will react.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 점수를 받기 위해 ‘키스 앤 크라이’ 존에 서 있어야 하며, 모든 사람이 그들이 어떻게 반응할지 보기 위해 그들을 뚫어지게 쳐다본다.","opts":["선수들은 모든 사람이 자신을 지켜볼 때에만 점수를 받을 수 있다.","선수들은 사람들의 반응을 보기 위해 그곳에 선다.","사람들은 선수들이 점수를 받기 전에 그들을 평가하고 반응한다.","선수들은 점수를 받으려고 그곳에 서야 하고, 사람들은 선수들의 반응을 유심히 지켜본다."],"r":{"a":"4) 선수들은 점수를 받으려고 그곳에 서야 하고, 사람들은 선수들의 반응을 유심히 지켜본다.","ev":"2번 문장","s":[[2,"They must stand in the “kiss-and-cry” to receive their scores, with everyone watching them intently to see how they will react.","그들은 점수를 받기 위해 ‘키스 앤 크라이’ 존에 서 있어야 하며, 모든 사람이 그들이 어떻게 반응할지 보기 위해 그들을 뚫어지게 쳐다본다."]],"w":"to receive their scores는 선수들이 그곳에 서는 목적이고, to see how they will react는 사람들이 선수를 지켜보는 목적이에요. 반응을 보려는 쪽은 선수가 아니라 사람들이에요.","c":4},"h":"1f34c237cb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["핀란드의 한 스케이팅 임원이 1983년에 키스 앤 크라이라는 이름을 만들었다.","키스 앤 크라이는 TV 시청자에게 거의 보이지 않는다.","선수들은 키스 앤 크라이에서 어떻게 행동할지 전혀 연습하지 않는다.","그 구역은 Jane Erkko가 이름을 쓰기 전부터 키스 앤 크라이로 불렸다."],"opts":["A Finnish skating official coined the name kiss-and-cry in 1983.","The kiss-and-cry is rarely shown to TV viewers.","Skaters never practice how to behave in the kiss-and-cry.","The area was called kiss-and-cry before Jane Erkko used the name."],"r":{"a":"1) A Finnish skating official coined the name kiss-and-cry in 1983.","ev":"4번, 8번, 10번 문장","s":[[4,"This unusual name was coined by Finnish skating official Jane Erkko in 1983.","이 특이한 이름은 1983년 핀란드의 스케이팅 임원인 Jane Erkko에 의해 만들어졌다."],[8,"Nowadays, the kiss-and-cry is an important part of televised competitions.","오늘날, 키스 앤 크라이 존은 텔레비전으로 중계되는 대회의 중요한 부분이다."],[10,"Because of the importance of the area to a skater’s public image, some even receive special training on how to create a good impression while there!","선수의 대중적 이미지에 대한 그 구역의 중요성 때문에, 일부는 심지어 그곳에 있는 동안 어떻게 좋은 인상을 남길지에 대한 특별 훈련을 받기도 한다!"]],"w":"4번에서 핀란드의 스케이팅 임원 Jane Erkko가 1983년에 이름을 만들었어요. 8번에서 중계 대회의 중요한 부분이고, 10번에서 일부 선수는 특별 훈련을 받아요. 이름은 Erkko가 만든 것이라 그 전부터 불렸다는 말도 틀려요.","c":1},"h":"0b4843ff8c"},{"n":9,"t":"sum","q":"Nowadays, the kiss-and-cry has become an (A) part of (B) skating competitions.","ko":"오늘날 키스 앤 크라이는 (B) 피겨 대회의 (A) 부분이 되었다.","oko":["(A) 중요한 / (B) 텔레비전으로 중계되는","(A) 중요한 / (B) 비공개의","(A) 사소한 / (B) 텔레비전으로 중계되는","(A) 사소한 / (B) 비공개의","(A) 이상한 / (B) 비공개의"],"opts":["(A) important / (B) televised","(A) important / (B) private","(A) minor / (B) televised","(A) minor / (B) private","(A) strange / (B) private"],"r":{"a":"1) (A) important / (B) televised ((A) 중요한 / (B) 텔레비전으로 중계되는)","ev":"8번 문장","s":[[8,"Nowadays, the kiss-and-cry is an important part of televised competitions.","오늘날, 키스 앤 크라이 존은 텔레비전으로 중계되는 대회의 중요한 부분이다."]],"w":"8번 문장에서 키스 앤 크라이는 텔레비전으로 중계되는(televised) 대회의 중요한(important) 부분이라고 해요.","c":1},"h":"e54240133e"},{"n":10,"t":"fill","q":"Because the area matters to a skater's public image, some skaters receive [A] training on how to make a good [B] there.","ko":"그 구역이 선수의 대중적 이미지에 중요하기 때문에, 일부 선수들은 그곳에서 좋은 [B]을(를) 남기는 방법에 대한 [A] 훈련을 받는다.","bank":["special","impression","decorated","intently","sorrow","tears"],"bko":{"special":"특별한","impression":"인상","decorated":"장식된","intently":"뚫어지게","sorrow":"슬픔","tears":"눈물"},"r":{"a":"[A] special (특별한), [B] impression (인상)","ev":"10번 문장","s":[[10,"Because of the importance of the area to a skater’s public image, some even receive special training on how to create a good impression while there!","선수의 대중적 이미지에 대한 그 구역의 중요성 때문에, 일부는 심지어 그곳에 있는 동안 어떻게 좋은 인상을 남길지에 대한 특별 훈련을 받기도 한다!"]],"w":"10번 문장에 some even receive special training on how to create a good impression이 나와요. [A]는 training을 꾸미는 말이고 [B]는 good 뒤의 명사예요. 나머지 단어는 이 자리에 문법이나 뜻이 맞지 않아요.","c":null},"h":"9f4849ee9e"}]},{"u":3,"id":"ms3-03-4","no":4,"ko":"The Little Box That Started It All","items":[{"n":1,"t":"tf","q":"The idea of the street-corner bookshelves began with Todd Bol's love for his mother.","ko":"길모퉁이 책장이라는 아이디어는 토드 볼의 어머니에 대한 사랑에서 시작되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"This idea began with one man’s love for his mother.","이 아이디어는 한 남자의 어머니에 대한 사랑으로부터 시작되었다."]],"w":"4번 문장에서 이 아이디어는 한 남자의 어머니에 대한 사랑으로부터 시작되었다고 해요. 맞는 내용이에요.","c":"T"},"h":"38b54eb309"},{"n":2,"t":"tf","q":"Little Free Library users need a membership and must return books by a deadline.","ko":"Little Free Library 이용자는 회원 가입이 필요하고 기한 안에 책을 반납해야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"Unlike traditional libraries, there are no membership requirements, return deadlines, or maximum borrowing limits.","전통적인 도서관과 달리, 회원 가입 요건, 반납 기한, 또는 최대 대출 제한이 없다."]],"w":"14번 문장에서 전통적인 도서관과 달리 회원 가입 요건이나 반납 기한이 없다고 해요. 필요하다는 말은 반대예요.","c":"F"},"h":"f4ba8a0de2"},{"n":3,"t":"tf","q":"Todd Bol's small wooden box quickly became the talk of his neighborhood.","ko":"토드 볼의 작은 나무 상자는 빠르게 이웃의 화젯거리가 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"His small attempt quickly became the talk of the neighborhood.","그의 작은 시도는 빠르게 이웃들 사이의 화제가 되었다."]],"w":"9번 문장에서 그의 작은 시도가 빠르게 이웃들 사이의 화제가 되었다고 해요. 맞는 내용이에요.","c":"T"},"h":"827a90bfac"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 2009, Todd Bol wanted to honor his late mother in a special way.)","ko":"2009년에, 토드 볼은 고인이 된 그의 어머니를 특별한 방식으로 기리고 싶었다.","opts":["늦은","고인이 된","나이 든","아픈"],"word":"late","r":{"a":"2) 고인이 된","ev":"5번 문장","s":[[5,"In 2009, Todd Bol wanted to honor his late mother in a special way.","2009년에, 토드 볼은 고인이 된 그의 어머니를 특별한 방식으로 기리고 싶었다."]],"w":"어머니를 특별한 방식으로 기리고 싶다는 문장이라서, late는 '늦은'이 아니라 '고인이 된'이에요. 6번에서도 어머니가 과거에 독서를 사랑했다고 말해요.","c":2},"h":"f072e9e4d5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Its movement spread rapidly.)","ko":"이 움직임은 빠르게 퍼져나갔다.","opts":["빠르게","조용히","천천히","우연히"],"word":"rapidly","r":{"a":"1) 빠르게","ev":"11번 문장","s":[[11,"Its movement spread rapidly, and more than 200,000 community bookshelves have been installed in over 120 countries around the world.","이 움직임은 빠르게 퍼져나갔고, 전 세계 120개국 이상에 200,000개가 넘는 지역 사회 책장이 설치되었다."]],"w":"11번에서 움직임이 퍼져 200,000개 이상의 책장이 120개국 이상에 설치될 만큼 빨리 번졌어요. rapidly = 빠르게예요.","c":1},"h":"2c630d1647"},{"n":6,"t":"ref","q":"What does the underlined \"who\" refer to?\nThese libraries are managed by volunteers, who regularly organize the bookshelves and remove damaged books.","ko":"밑줄 친 who가 가리키는 것은?","sko":"이러한 도서관들은 자원봉사자들에 의해 관리되고, 그들은 정기적으로 책장을 정리하고 손상된 책들을 제거한다.","opts":["도서관들","자원봉사자들","손상된 책들","이웃들"],"r":{"a":"2) 자원봉사자들","ev":"15번 문장","s":[[15,"These libraries are managed by volunteers, who regularly organize the bookshelves and remove damaged books.","이러한 도서관들은 자원봉사자들에 의해 관리되고, 그들은 정기적으로 책장을 정리하고 손상된 책들을 제거한다."]],"w":"who 앞에 쉼표가 있어서 바로 앞의 volunteers를 설명해요. 책장을 정리하고 손상된 책을 제거하는 사람은 자원봉사자들이에요.","c":2},"h":"697e7f6dc5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Remembering how much she loved reading, he decided to share her passion for books with others in his community.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그녀가 독서를 얼마나 사랑했는지 기억하며, 그는 그녀의 책에 대한 열정을 지역 사회의 다른 사람들과 나누기로 결심했다.","opts":["어머니가 독서를 좋아했다는 것이 떠올라 가진 책을 모두 팔기로 마음먹었다.","어머니와 함께 읽던 책을 지역 도서관에 기증하기로 했다.","어머니가 독서를 얼마나 사랑했는지 떠올리며, 그 책 사랑을 지역 사람들과 나누기로 했다.","어머니가 독서를 사랑한 것을 이웃들이 기억해 달라고 부탁하기로 했다."],"r":{"a":"3) 어머니가 독서를 얼마나 사랑했는지 떠올리며, 그 책 사랑을 지역 사람들과 나누기 미국으로 이주했다."]],"w":"4번 문장에서 그는 시각 장애인을 위한 특수 학교에 다니기 위해 미국으로 이주했다고 해요.","c":1},"h":"08772c9734"},{"n":9,"t":"sum","q":"Shin worked at JP Morgan, a (A) financial (B) in the US.","ko":"신순규는 미국의 (A) 금융 (B)인 JP 모건에서 일했다.","oko":["(A) 선도적인 / (B) 기관","(A) 선도적인 / (B) 정책","(A) 작은 / (B) 기관","(A) 작은 / (B) 정책","(A) 실패하는 / (B) 학교"],"opts":["(A) leading / (B) institution","(A) leading / (B) policy","(A) small / (B) institution","(A) small / (B) policy","(A) failing / (B) school"],"r":{"a":"1) (A) leading / (B) institution ((A) 선도적인 / (B) 기관)","ev":"5번 문장","s":[[5,"Although he initially didn’t speak English, he eventually graduated from Harvard and worked at JP Morgan, a leading financial institution in the US.","비록 그는 처음에는 영어를 하지 못했지만, 그는 결국 하버드를 졸업했고 미국의 선도적인 금융 기관인 JP 모건에서 일했다."]],"w":"5번 문장에서 JP 모건은 미국의 선도적인(leading) 금융 기관(institution)이라고 해요.","c":1},"h":"df1bf38ab8"},{"n":10,"t":"fill","q":"On the competitive [A] of Wall Street, the heart of America’s financial industry, would you [B] that a blind analyst could succeed?","ko":"미국의 금융 산업의 심장인 월 스트리트의 치열한 [A]에서, 당신은 시각 장애인 애널리스트가 성공할 수 있었다는 것을 [B] 수 있겠는가?","bank":["battlefield","believe","memorize","calculator","surgeries","layout"],"bko":{"battlefield":"전장","believe":"믿다","memorize":"암기하다","calculator":"계산기","surgeries":"수술들","layout":"배치"},"r":{"a":"[A] battlefield (전장), [B] believe (믿다)","ev":"1번 문장","s":[[1,"On the competitive battlefield of Wall Street, the heart of America’s financial industry, would you believe that a blind analyst could succeed?","미국의 금융 산업의 심장인, 월 스트리트의 치열한 전장에서, 당신은 시각 장애인 애널리스트가 성공할 수 있었다는 것을 믿겠는가?"]],"w":"1번 문장은 월 스트리트의 치열한 전장(battlefield)에서 시각 장애인 애널리스트가 성공할 수 있었다는 것을 믿겠느냐(believe)고 묻고 있어요.","c":null},"h":"48c0fbefc8"}]},{"u":4,"id":"ms3-04-2","no":2,"ko":"빵! 쏘는 배를 줄 테니 톡! 쏘는 물을 다오","items":[{"n":1,"t":"tf","q":"Pepsi traded Pepsi-Cola for Soviet vodka.","ko":"펩시는 펩시콜라를 소련 보드카와 교환했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Instead, Pepsi entered into a barter agreement to trade Pepsi-Cola for Soviet vodka.","대신, 펩시는 펩시콜라와 소련 보드카를 교환하는 물물교환 계약을 체결했다."]],"w":"6번 문장에 Pepsi entered into a barter agreement to trade Pepsi-Cola for Soviet vodka라고 나와요. 콜라를 주고 보드카를 받았다는 내용과 일치해요.","c":"T"},"h":"b59f484128"},{"n":2,"t":"tf","q":"Pepsi started selling its products in the Soviet Union in the late 1980s.","ko":"펩시는 1980년대 후반에 소련에서 자사 제품을 팔기 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In 1972, Pepsi struck a deal to sell its trademark product in the Soviet Union.","1972년에 펩시는 소련에 자사의 상표 제품을 판매하기 위한 거래를 성사시켰다."]],"w":"4번 문장에서 펩시가 소련에서 판매하기로 거래를 성사시킨 해는 1972년이에요. 1980년대 후반은 1번에서 냉전과 해군을 말할 때 나온 시기예요.","c":"F"},"h":"3fb689a854"},{"n":3,"t":"tf","q":"One of the largest navies at the time belonged to the Soviet Union.","ko":"당시 가장 큰 해군들 중 하나는 소련에 속해 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"Surprisingly, one of the largest navies at the time did not belong to either nation.","놀랍게도, 당시 가장 큰 해군들 중 하나는 둘 중 어느 한 국가에도 속하지 않았다."],[3,"In fact, it did not belong to any country —it was owned by the American beverage company Pepsi!","사실, 그것은 어떤 나라에도 속하지 않았는데, 그것은 미국 음료 회사인 펩시에 의해 소유되었다!"]],"w":"2번 문장에서 당시 가장 큰 해군 중 하나는 미국과 소련 어느 쪽에도 속하지 않았다고 하고, 3번에서 펩시 소유라고 밝혀요.","c":"F"},"h":"7ae819a277"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the late 1980s, the United States and the Soviet Union were Cold War adversaries, …)","ko":"1980년대 후반, 미국과 소련은 냉전 적대국이었다.","word":"adversaries","opts":["동맹국","구경꾼","적대국","무역 상대"],"r":{"a":"3) 적대국","ev":"1번 문장","s":[[1,"In the late 1980s, the United States and the Soviet Union were Cold War adversaries, each with an incredibly powerful naval force.","1980년대 후반, 미국과 소련은 냉전 적대국이었고, 각각은 매우 강력한 해군력을 보유하고 있었다."]],"w":"미국과 소련은 냉전에서 서로 맞선 나라예요. each with an incredibly powerful naval force라는 설명에서도 서로 겨루는 관계임을 알 수 있어요. adversary = 적대국.","c":3},"h":"59e9edf32a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Soviet officials proposed trading retired vessels—17 submarines and three warships—for more Pepsi.)","ko":"소련 관리들은 17대의 잠수함과 3대의 군함을 포함해 퇴역 선박들을 더 많은 펩시와 교환하는 거래를 제안했다.","word":"retired","opts":["퇴역한","새로 만든","수리 중인","외국의"],"r":{"a":"1) 퇴역한","ev":"9번 문장","s":[[9,"In need of something else to offer, Soviet officials proposed trading retired vessels —17 submarines and three warships— for more Pepsi.","다른 제안이 필요했던 소련 관리들은 17대의 잠수함과 3대의 군함을 포함해 퇴역 선박들을 더 많은 펩시와 교환하는 거래를 제안했다."]],"w":"소련이 보드카 대신 내놓은 것이에요(8번 이후). 새로 만든 배가 아니라 더 이상 쓰지 않는 선박이라는 뜻이에요. retired = 퇴역한.","c":1},"h":"1e71ae56be"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nObviously, as a competitor in the beverage industry, it had no aspirations of becoming a naval superpower.","ko":"밑줄 친 it이 가리키는 것은?","sko":"당연하게도, 음료 업계의 한 경쟁사로서, 펩시는 해군 강국이 되겠다는 야망은 전혀 없었다.","opts":["소련 정부","펩시","음료 업계","미국 해군"],"r":{"a":"2) 펩시","ev":"10~11번 문장","s":[[10,"Pepsi gladly accepted the offer, but it soon sold all the vessels for scrap metal.","펩시는 그 제안을 기꺼이 받아들였지만, 곧 모든 선박을 고철로 판매했다."],[11,"Obviously, as a competitor in the beverage industry, it had no aspirations of becoming a naval superpower.","당연하게도, 음료 업계의 한 경쟁사로서, 펩시는 해군 강국이 되겠다는 야망은 전혀 없었다."]],"w":"10번에서 선박을 받아들이고 고철로 판 주체는 펩시예요. 11번의 it은 음료 업계의 경쟁사, 즉 펩시를 가리켜요.","c":2},"h":"f24742fba6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But the Soviets could not pay because the ruble, their currency, was not allowed to be used internationally due to the Soviet government’s closed monetary policy.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 소련은 지불할 수 없었는데, 그 이유는 소련의 폐쇄적 통화 정책으로 인해 그들의 화폐인 루블이 국제적으로 사용되는 것이 허용되지 않았기 때문이다.","opts":["소련의 화폐인 루블이 국제적으로 쓰일 수 없어서, 소련은 펩시에 대금을 지불할 수 없었다.","소련은 루블이 너무 많아서 펩시에 대금을 지불할 필요가 없었다.","펩시가 소련 정부의 통화 정책을 바꾸라고 요구해서 대금을 받지 못했다.","루블은 국제적으로 인기가 많아서 소련은 쉽게 대금을 지불했다."],"r":{"a":"1) 소련의 화폐인 루블이 국제적으로 쓰일 수 없어서, 소련은 펩시에 대금을 지불할 수 없었다.","ev":"5번 문장","s":[[5,"But the Soviets could not pay because the ruble, their currency, was not allowed to be used internationally due to the Soviet government’s closed monetary policy.","그러나 소련은 지불할 수 없었는데, 그 이유는 소련의 폐쇄적 통화 정책으로 인해 그들의 화폐인 루블이 국제적으로 사용되는 것이 허용되지 않았기 때문이다."]],"w":"5번 문장은 루블이 소련의 폐쇄적 통화 정책 때문에 국제적으로 사용될 수 없어서 소련이 대금을 지불할 수 없었다는 뜻이에요.","c":1},"h":"bc13afcdbb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["1980년대 말에는 소련이 미국인이 보드카를 원하는 것보다 펩시를 훨씬 더 원했다.","1980년대 말에는 미국인이 소련이 펩시를 원하는 것보다 보드카를 훨씬 더 원했다.","처음에는 이 거래가 양 측에 실패였다.","펩시는 소련 선박을 이용해 자신의 해군을 만들었다."],"opts":["By the end of the 1980s, the Soviets wanted Pepsi much more than Americans wanted vodka.","By the end of the 1980s, Americans wanted vodka much more than the Soviets wanted Pepsi.","At first, the deal was a failure for both sides.","Pepsi used the Soviet ships to build its own navy."],"r":{"a":"1) By the end of the 1980s, the Soviets wanted Pepsi much more than Americans wanted vodka. (1980년대 말에는 소련이 미국인이 보드카를 원하는 것보다 펩시를 훨씬 더 원했다.)","ev":"7번 문장","s":[[7,"At first, the deal was incredibly successful for both sides, but by the end of the 1980s, it was clear that the Soviets wanted Pepsi a lot more than Americans wanted vodka.","처음에는, 이 거래는 양 측에 엄청나게 성공적이었으나, 1980년대 말 무렵, 미국인들이 보드카를 원하는 것보다 소련인들이 펩시를 훨씬 많이 원한다는 것이 분명해졌다."]],"w":"7번 문장에서 1980년대 말에는 소련인들이 펩시를 미국인들이 보드카를 원하는 것보다 훨씬 많이 원했다고 해요.","c":1},"h":"fce51c1f4c"},{"n":9,"t":"sum","q":"Because of (A) in the US over the Soviet occupation of Afghanistan, vodka sales began to (B).","ko":"미국 내 소련의 아프가니스탄 점령에 대한 (A) 때문에, 보드카 판매가 (B)하기 시작했다.","oko":["(A) 항의 / (B) 하락","(A) 항의 / (B) 증가","(A) 지원 / (B) 하락","(A) 지원 / (B) 증가","(A) 계약 / (B) 증가"],"opts":["(A) protests / (B) decline","(A) protests / (B) rise","(A) support / (B) decline","(A) support / (B) rise","(A) contracts / (B) rise"],"r":{"a":"1) (A) protests / (B) decline ((A) 항의 / (B) 하락)","ev":"8번 문장","s":[[8,"Meanwhile, protests in the US over the Soviet occupation of Afghanistan had caused vodka sales to decline.","한편, 소련의 아프가니스탄 점령에 대한 미국 내 항의로 보드카 판매가 하락했다."]],"w":"8번 문장에서 소련의 아프가니스탄 점령에 대한 미국 내 항의(protests)로 보드카 판매가 하락했다(decline)고 해요.","c":1},"h":"f3392b7a97"},{"n":10,"t":"fill","q":"Pepsi gladly [A] the offer, but it soon [B] all the vessels for scrap metal.","ko":"펩시는 그 제안을 기꺼이 [A]. 하지만 곧 모든 선박을 고철로 [B].","bank":["accepted","sold","refused","lost","kept","ignored"],"bko":{"accepted":"받아들였다","sold":"팔았다","refused":"거절했다","lost":"잃었다","kept":"보관했다","ignored":"무시했다"},"r":{"a":"[A] accepted (받아들였다), [B] sold (팔았다)","ev":"10번 문장","s":[[10,"Pepsi gladly accepted the offer, but it soon sold all the vessels for scrap metal.","펩시는 그 제안을 기꺼이 받아들였지만, 곧 모든 선박을 고철로 판매했다."]],"w":"10번 문장에서 Pepsi gladly accepted the offer(기꺼이 받아들였다), but it soon sold all the vessels(곧 모든 선박을 팔았다)고 해요. refused·ignored는 gladly와 맞지 않고, kept·bought는 고철로 판 내용과 맞지 않아요.","c":null},"h":"0493a4857c"}]},{"u":4,"id":"ms3-04-3","no":3,"ko":"툭하면 배가 아파요","items":[{"n":1,"t":"tf","q":"Nearly 10 percent of the global population regularly suffers from digestive symptoms brought on by IBS.","ko":"전 세계 인구의 거의 10퍼센트가 IBS로 인한 소화기 증상을 정기적으로 겪는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Nearly 10 percent of the global population regularly suffers similar digestive symptoms brought on by Irritable Bowel Syndrome (IBS), a condition that affects the body’s digestive system.","전 세계 인구의 거의 10퍼센트가 과민성 대장 증후군(IBS)에 의해 야기되는 유사한 소화기 증상들을 정기적으로 겪는데, 이는 신체의 소화기 계통에 영향을 미치는 질환이다."]],"w":"2번 문장에 Nearly 10 percent of the global population regularly suffers similar digestive symptoms brought on by IBS라고 나와요. 본문과 일치해요.","c":"T"},"h":"7c7e77c013"},{"n":2,"t":"tf","q":"Doctors have found the definitive cause of IBS.","ko":"의사들은 IBS의 명확한 원인을 찾아냈다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Despite impacting so many people, doctors have not found a definitive cause of IBS.","그렇게 많은 사람들에게 영향을 미침에도 불구하고, 의사들은 IBS의 명확한 원인을 찾아내지 못했다."]],"w":"3번 문장은 doctors have not found a definitive cause of IBS, 즉 명확한 원인을 찾지 못했다고 해요. 반대예요.","c":"F"},"h":"64218fdff8"},{"n":3,"t":"tf","q":"The symptoms of IBS are easy to predict and control.","ko":"IBS의 증상은 예측하고 통제하기 쉽다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"IBS can have a distressing effect on people’s sense of well-being as the symptoms are unpredictable and challenging to control.","증상들이 예측 불가능하고 통제하기 힘들기 때문에 IBS는 사람들의 행복감에 괴로움을 주는 영향을 미칠 수 있다."]],"w":"8번 문장에서 증상은 unpredictable(예측 불가능)하고 challenging to control(통제하기 힘들다)이라고 해요. 쉽다는 말은 반대예요.","c":"F"},"h":"26d8d39c54"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… they may also kill off beneficial gut bacteria, upsetting the balance of gut microbes necessary for healthy digestion.)","ko":"그것들은 또한 유익한 장내 박테리아를 몰살시켜, 건강한 소화에 필요한 장내 미생물의 균형을 무너뜨릴지도 모른다.","word":"beneficial","opts":["해로운","유익한","값비싼","흔한"],"r":{"a":"2) 유익한","ev":"5번 문장","s":[[5,"Although they are prescribed to treat bacterial infections in the body, they may also kill off beneficial gut bacteria, upsetting the balance of gut microbes necessary for healthy digestion.","비록 그것들이 신체의 세균 감염을 치료하기 위해 처방되지만, 그것들은 또한 유익한 장내 박테리아를 몰살시켜, 건강한 소화에 필요한 장내 미생물의 균형을 무너뜨릴지도 모른다."]],"w":"유익한 박테리아를 죽이면 건강한 소화에 필요한 균형이 무너져요. 그래서 beneficial은 좋은 일을 하는, 즉 유익한이에요.","c":2},"h":"5740aac3a1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… medications that alleviate pain.)","ko":"통증을 완화하는 약물","word":"alleviate","opts":["악화시키는","숨기는","유발하는","완화하는"],"r":{"a":"4) 완화하는","ev":"9번 문장","s":[[9,"Fortunately, recent research suggests that people can at least manage them through diet modifications that avoid problematic foods, lifestyle changes that reduce stress, and medications that alleviate pain.","다행히도, 최근의 연구는 사람들이 문제가 되는 음식을 피하는 식단 수정, 스트레스를 줄이는 생활 방식의 변화, 그리고 통증을 완화하는 약물을 통해 적어도 그것들을 관리할 수 있다는 것을 시사한다."]],"w":"9번은 증상을 관리하는 세 가지 방법을 말해요. 약물이 통증에 하는 일은 통증을 줄여 주는 것이니 alleviate = 완화하다예요.","c":4},"h":"713b4ec000"},{"n":6,"t":"ref","q":"What does the underlined \"this syndrome\" refer to?\nAnother theory suggests that this syndrome may be a product of psychological factors, including childhood trauma or mental disorders such as depression.","ko":"밑줄 친 this syndrome이 가리키는 것은?","sko":"또 다른 이론은 이 증후군이 어린 시절의 트라우마나 우울증과 같은 정신 장애를 포함한 심리적 요인들의 산물일지도 모른다는 것을 시사한다.","opts":["항생제","우울증","과민성 대장 증후군(IBS)","정상적인 소화 기능"],"r":{"a":"3) 과민성 대장 증후군(IBS)","ev":"2·6번 문장","s":[[2,"Nearly 10 percent of the global population regularly suffers similar digestive symptoms brought on by Irritable Bowel Syndrome (IBS), a condition that affects the body’s digestive system.","전 세계 인구의 거의 10퍼센트가 과민성 대장 증후군(IBS)에 의해 야기되는 유사한 소화기 증상들을 정기적으로 겪는데, 이는 신체의 소화기 계통에 영향을 미치는 질환이다."],[6,"Another theory suggests that this syndrome may be a product of psychological factors, including childhood trauma or mental disorders such as depression.","또 다른 이론은 이 증후군이 어린 시절의 트라우마나 우울증과 같은 정신 장애를 포함한 심리적 요인들의 산물일지도 모른다는 것을 시사한다."]],"w":"2번에서 IBS를 소화기에 영향을 미치는 질환으로 소개했고, 6번에서 Another theory가 그 IBS의 원인을 심리적 요인으로 보는 거예요. 우울증은 그 원인 후보로 나온 예예요.","c":3},"pron":"this syndrome","h":"a5213d2e70"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Fortunately, recent research suggests that people can at least manage them through diet modifications that avoid problematic foods, lifestyle changes that reduce stress, and medications that alleviate pain.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다행히도, 최근의 연구는 사람들이 문제가 되는 음식을 피하는 식단 수정, 스트레스를 줄이는 생활 방식의 변화, 그리고 통증을 완화하는 약물을 통해 적어도 그것들을 관리할 수 있다는 것을 시사한다.","opts":["최근 연구에 따르면 식단, 생활 방식, 약물을 통해 증상을 적어도 관리할 수 있다.","최근 연구에 따르면 증상은 약물로만 완전히 치료할 수 있다.","최근 연구에 따르면 식단과 생활 방식은 증상과 관계가 없다.","최근 연구에 따르면 증상을 관리할 방법이 아직 전혀 없다."],"r":{"a":"1) 최근 연구에 따르면 식단, 생활 방식, 약물을 통해 증상을 적어도 관리할 수 있다.","ev":"9번 문장","s":[[9,"Fortunately, recent research suggests that people can at least manage them through diet modifications that avoid problematic foods, lifestyle changes that reduce stress, and medications that alleviate pain.","다행히도, 최근의 연구는 사람들이 문제가 되는 음식을 피하는 식단 수정, 스트레스를 줄이는 생활 방식의 변화, 그리고 통증을 완화하는 약물을 통해 적어도 그것들을 관리할 수 있다는 것을 시사한다."]],"w":"9번 문장은 문제가 되는 음식을 피하는 식단, 스트레스를 줄이는 생활 방식, 약물로 증상을 적어도 관리할 수 있다는 연구 결과예요.","c":1},"h":"043ef4f8d0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["유력한 가설 하나는 항생제가 IBS의 원인일 수 있다고 말한다.","의사들은 항생제가 장내 박테리아를 절대 해치지 않는다는 것을 증명했다.","유력한 가설 하나는 유제품이 IBS의 유일한 원인이라고 말한다.","IBS는 신체의 호흡기 계통에 영향을 미치는 질환이다."],"opts":["One leading hypothesis says that antibiotics may be a cause of IBS.","Doctors have proved that antibiotics never harm gut bacteria.","One leading hypothesis says that dairy products are the only cause of IBS.","IBS is a condition that affects the body’s breathing system."],"r":{"a":"1) One leading hypothesis says that antibiotics may be a cause of IBS. (유력한 가설 하나는 항생제가 IBS의 원인일 수 있다고 말한다.)","ev":"4번 문장","s":[[4,"One leading hypothesis blames antibiotics.","하나의 유력한 가설은 항생제를 탓한다."]],"w":"4번 문장에서 하나의 유력한 가설은 항생제를 원인으로 탓한다고 해요.","c":1},"h":"296d9bfdfd"},{"n":9,"t":"sum","q":"Strong (A) may cause the muscles in the stomach and intestines to (B) irregularly.","ko":"강한 (A)이(가) 위와 장의 근육을 불규칙하게 (B)하게 만들 수 있다.","oko":["(A) 불안감 / (B) 수축","(A) 불안감 / (B) 이완","(A) 배고픔 / (B) 수축","(A) 배고픔 / (B) 이완","(A) 운동 / (B) 이완"],"opts":["(A) anxiety / (B) contract","(A) anxiety / (B) relax","(A) hunger / (B) contract","(A) hunger / (B) relax","(A) exercise / (B) relax"],"r":{"a":"1) (A) anxiety / (B) contract ((A) 불안감 / (B) 수축)","ev":"7번 문장","s":[[7,"Due to the link between the brain and the gut, strong feelings of anxiety may cause muscles in the stomach and intestines to contract irregularly, interfering with normal digestive function.","뇌와 장 사이의 연결 때문에, 강한 불안감은 위와 장의 근육들이 불규칙하게 수축하게 하여, 정상적인 소화 기능을 방해할지도 모른다."]],"w":"7번 문장에서 강한 불안감(anxiety)은 위와 장의 근육이 불규칙하게 수축하게(contract) 할 수 있다고 해요.","c":1},"h":"cf52b26941"},{"n":10,"t":"fill","q":"For some people, [A] dairy products causes gas and bloating, while others experience [B] stomachaches from eating fried foods.","ko":"어떤 사람들에게는 유제품을 [A] 것이 가스와 복부 팽만을 유발하는 반면, 다른 사람들은 튀긴 음식을 먹는 것으로 [B] 복통을 겪는다.","bank":["consuming","intense","trauma","medications","hypothesis","digestion"],"bko":{"consuming":"섭취하는","intense":"극심한","trauma":"트라우마","medications":"약물","hypothesis":"가설","digestion":"소화"},"r":{"a":"[A] consuming (섭취하는), [B] intense (극심한)","ev":"1번 문장","s":[[1,"For some people, consuming dairy products causes gas and bloating, while others experience intense stomachaches from eating fried foods.","어떤 사람들에게는, 유제품을 섭취하는 것이 가스와 복부 팽만을 유발하는 반면, 다른 사람들은 튀긴 음식을 먹는 것으로부터 극심한 복통을 겪는다."]],"w":"1번 문장에서 유제품을 섭취하는(consuming) 것이 가스를 유발하고, 다른 사람들은 튀긴 음식으로 극심한(intense) 복통을 겪는다고 해요.","c":null},"h":"dd9d072d4e"}]},{"u":4,"id":"ms3-04-4","no":4,"ko":"You’ve Been Played by the Narrator","items":[{"n":1,"t":"tf","q":"Verbal Kint tells the detective a story that he made up himself.","ko":"버벌 킨트는 형사에게 자신이 직접 지어낸 이야기를 들려준다.","r":{"a":"T (본문과 맞는 내용)","ev":"5·7번 문장","s":[[5,"In The Usual Suspects, the main character Verbal Kint, a nervous, low-level gang member who walks with a limp, narrates a complex story about a mysterious and terrifying gang leader to a detective.","<유주얼 서스펙트>에서, 다리를 절며 걷는 불안하고 낮은 직급의 갱단 조직원인 주인공 버벌 킨트는 형사에게 신비롭고 무시무시한 갱단 두목에 대한 복잡한 이야기를 들려준다."],[7,"But in the film’s final moments, his limp vanishes as he walks away, revealing that he had fabricated the entire story.","하지만 영화의 마지막 순간에, 그가 걸어 나갈 때 그의 다리 저는 것이 사라지고, 그가 전체 이야기를 꾸며냈다는 것을 드러낸다."]],"w":"5번에서 킨트가 형사에게 복잡한 이야기를 들려주고, 7번에서 그가 이야기 전체를 꾸며냈다(fabricated)는 것이 드러나요.","c":"T"},"h":"4fab3835e0"},{"n":2,"t":"tf","q":"Arthur’s relationship with Sophie turns out to be real.","ko":"아서와 소피의 관계는 실제로 있었던 것으로 밝혀진다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"In the movie Joker, the main character Arthur believes he is in a romantic relationship with his neighbor Sophie.","영화 <조커>에서, 주인공 아서는 그가 그의 이웃인 소피와 로맨틱한 관계에 있다고 믿는다."],[12,"But it is later revealed that the relationship was nothing more than Arthur’s imagination.","그러나 나중에 그 관계는 아서의 상상에 불과했다는 것이 밝혀진다."]],"w":"11번에서 아서는 소피와 연애 중이라고 믿어요. 12번에서 그 관계가 아서의 상상에 불과했다고 밝혀져요.","c":"F"},"h":"c7803c791e"},{"n":3,"t":"tf","q":"One reason directors use unreliable narrators is to create suspense and plot twists.","ko":"감독들이 신뢰할 수 없는 화자를 쓰는 한 가지 이유는 긴장감과 줄거리 반전을 만들기 위해서이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"One major reason is to create suspense and shocking plot twists.","한 가지 주요한 이유는 긴장감과 충격적인 줄거리 반전을 만들기 위해서이다."]],"w":"4번 문장 One major reason is to create suspense and shocking plot twists와 일치해요.","c":"T"},"h":"dd20927fe6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… revealing that he had fabricated the entire story.)","ko":"그가 전체 이야기를 꾸며냈다는 것을 드러내며","word":"fabricated","opts":["확인했다","꾸며냈다","기록했다","잊어버렸다"],"r":{"a":"2) 꾸며냈다","ev":"7번 문장","s":[[7,"But in the film’s final moments, his limp vanishes as he walks away, revealing that he had fabricated the entire story.","하지만 영화의 마지막 순간에, 그가 걸어 나갈 때 그의 다리 저는 것이 사라지고, 그가 전체 이야기를 꾸며냈다는 것을 드러낸다."]],"w":"킨트의 다리 저는 것이 사라지면서 그가 한 이야기가 사실이 아니었음이 드러나요. 그래서 fabricate는 이야기를 사실처럼 꾸며냈다는 뜻이에요.","c":2},"h":"7aed29a9c0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As the story unfolds, the audience becomes fully immersed in his perspective.)","ko":"이야기가 전개됨에 따라, 관객은 그의 관점에 완전히 몰입하게 된다.","word":"immersed","opts":["지친","실망한","몰입한","의심하는"],"r":{"a":"3) 몰입한","ev":"6번 문장","s":[[6,"As the story unfolds, the audience becomes fully immersed in his perspective.","이야기가 전개됨에 따라, 관객은 그의 관점에 완전히 몰입하게 된다."]],"w":"fully immersed in his perspective는 그의 관점에 푹 빠졌다는 뜻이에요. 뒤의 7번에서 그 믿음이 뒤집히기 때문에 충격이 커져요. immerse = 몰입시키다.","c":3},"h":"e409fe194d"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nFilmmakers sometimes take advantage of this by using an unreliable narrator— a storytelling technique in which the person telling the story misleads the audience.","ko":"밑줄 친 which가 가리키는 것은?","sko":"영화 제작자들은 때때로 신뢰할 수 없는 화자, 즉 이야기를 말하는 사람이 관객을 오도하도록 하는 서술 기법을 사용함으로써 이것을 이용한다.","opts":["신뢰할 수 없는 화자라는 서술 기법","영화 제작자들","관객","이야기를 듣는 사람"],"r":{"a":"1) 신뢰할 수 없는 화자라는 서술 기법","ev":"2번 문장","s":[[2,"Filmmakers sometimes take advantage of this by using an unreliable narrator— a storytelling technique in which the person telling the story misleads the audience.","영화 제작자들은 때때로 신뢰할 수 없는 화자, 즉 이야기를 말하는 사람이 관객을 오도하도록 하는 서술 기법을 사용함으로써 이것을 이용한다."]],"w":"2번 문장에서 in which 앞의 a storytelling technique, 곧 신뢰할 수 없는 화자를 쓰는 서술 기법을 which가 가리켜요.","c":1,"k":"which = 신뢰할 수 없는 화자라는 서술 기법(a storytelling technique)"},"pron":"which","h":"73ec24ea5a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This revelation leaves viewers stunned and forces them to reconsider everything they believed about the story.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 폭로는 관객들을 망연자실하게 만들고 그들이 그 이야기에 대해 믿었던 모든 것을 재고하도록 강요한다.","opts":["이 폭로는 관객을 큰 충격에 빠뜨리고, 이야기에 대해 믿었던 모든 것을 다시 생각하게 만든다.","이 폭로는 관객이 이야기를 더 굳게 믿게 만든다.","관객은 이 폭로 때문에 영화를 끝까지 보지 않는다.","이 폭로는 관객이 이미 알고 있던 사실을 확인해 준다."],"r":{"a":"1) 이 폭로는 관객을 큰 충격에 빠뜨리고, 이야기에 대해 믿었던 모든 것을 다시 생각하게 만든다.","ev":"9번 문장","s":[[9,"This revelation leaves viewers stunned and forces them to reconsider everything they believed about the story.","이 폭로는 관객들을 망연자실하게 만들고 그들이 그 이야기에 대해 믿었던 모든 것을 재고하도록 강요한다."]],"w":"leaves viewers stunned는 관객을 망연자실한 상태로 둔다는 뜻이고, forces them to reconsider는 그들이 다시 생각하도록 만든다는 뜻이에요. everything they believed에서 believed는 믿었던(과거)이라 이전의 믿음이 뒤집혀요.","c":1},"h":"12bb25910d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["감독은 관객이 등장인물의 사고방식을 이해하도록 신뢰할 수 없는 화자를 쓸 수 있다.","감독은 현대 영화에서 신뢰할 수 없는 화자를 절대 쓰지 않는다.","신뢰할 수 없는 화자는 관객에게 사실인 이야기만 들려준다.","신뢰할 수 없는 화자는 항상 관객의 의견에 동의하는 사람이다."],"opts":["Directors may use an unreliable narrator to help the audience understand a character’s mindset.","Directors never use an unreliable narrator in modern movies.","An unreliable narrator tells the audience only true stories.","An unreliable narrator is a person who always agrees with the audience."],"r":{"a":"1) Directors may use an unreliable narrator to help the audience understand a character’s mindset. (감독은 관객이 등장인물의 사고방식을 이해하도록 신뢰할 수 없는 화자를 쓸 수 있다.)","ev":"10번 문장","s":[[10,"Directors occasionally include unreliable narrators to give the audience insight into a character’s mindset.","때때로 감독들은 관객에게 등장인물의 사고방식에 대한 통찰력을 주기 위해 신뢰할 수 없는 화자를 포함한다."]],"w":"10번 문장에서 감독들은 관객에게 등장인물의 사고방식에 대한 통찰력을 주기 위해 신뢰할 수 없는 화자를 포함하기도 한다고 해요.","c":1},"h":"8bda938a05"},{"n":9,"t":"sum","q":"An unreliable narrator allows audiences to form a (A) emotional (B) with the character.","ko":"신뢰할 수 없는 화자는 관객이 등장인물과 (A) 정서적 (B)을(를) 형성하게 해 준다.","oko":["(A) 더 깊은 / (B) 연결","(A) 더 깊은 / (B) 거리","(A) 더 약한 / (B) 연결","(A) 더 약한 / (B) 거리","(A) 더 짧은 / (B) 거리"],"opts":["(A) deeper / (B) connection","(A) deeper / (B) distance","(A) weaker / (B) connection","(A) weaker / (B) distance","(A) shorter / (B) distance"],"r":{"a":"1) (A) deeper / (B) connection ((A) 더 깊은 / (B) 연결)","ev":"14번 문장","s":[[14,"In essence, this narrative technique immerses audiences in the character’s story, allowing them to form a deeper emotional connection with the character.","본질적으로, 이러한 서사 기법은 관객들을 등장인물의 이야기에 몰입시키고, 그들이 등장인물과 더 깊은 정서적 연결을 형성할 수 있게 해 준다."]],"w":"14번 문장에서 이 서사 기법은 관객이 등장인물과 더 깊은(deeper) 정서적 연결(connection)을 형성할 수 있게 해 준다고 해요.","c":1},"h":"497aba9a81"},{"n":10,"t":"fill","q":"The audience experiences a mixture of [A] and discomfort toward Arthur, even when he commits [B] acts.","ko":"관객은 아서가 [B] 행동을 저지를 때조차도 그를 향한 [A]와(과) 불편함이 섞인 감정을 경험한다.","bank":["sympathy","violent","unfolds","reconsider","narrator","perspective"],"bko":{"sympathy":"연민","violent":"폭력적인","unfolds":"전개되다(unfold의 3인칭 단수)","reconsider":"재고하다","narrator":"화자","perspective":"관점"},"r":{"a":"[A] sympathy (연민), [B] violent (폭력적인)","ev":"13번 문장","s":[[13,"By seeing the delusions that Arthur experiences, the audience experiences a mixture of sympathy and discomfort toward him, even when he commits violent acts.","아서가 겪는 망상을 봄으로써, 관객은 그가 폭력적인 행동을 저지를 때조차도 그를 향한 연민과 불편함이 섞인 감정을 경험한다."]],"w":"13번 문장에 a mixture of sympathy and discomfort toward him, even when he commits violent acts가 나와요. 연민과 불편함이 섞인 감정이고 폭력적인 행동을 저지를 때조차 그렇다는 내용이에요.","c":null},"h":"3e02321de1"}]},{"u":5,"id":"ms3-05-1","no":1,"ko":"개가 왜 거기서 나와...?","items":[{"n":1,"t":"tf","q":"DINKWAD stands for Dual Income, No Kids, With a Dog.","ko":"딩크와드는 맞벌이, 무자녀, 개와 함께를 뜻한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"This couple exemplifies DINKWAD—Dual Income, No Kids, With a Dog.","이 커플은 맞벌이, 무자녀, 반려견 동반을 의미하는 딩크와드(DINKWAD)의 전형적인 예이다."]],"w":"4번 문장에서 DINKWAD를 Dual Income, No Kids, With a Dog으로 풀어 설명해요. 본문과 맞는 내용이에요.","c":"T"},"h":"da3ee42131"},{"n":2,"t":"tf","q":"The stroller in the park has a cute baby inside it.","ko":"공원의 유모차 안에는 귀여운 아기가 들어 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"You look over, expecting to see a cute baby inside.","당신은 안에 귀여운 아기가 있을 것을 기대하며, 건너다본다."],[3,"But instead, there’s a dog!","하지만 그 대신에, 개가 있다!"]],"w":"2번에서는 귀여운 아기를 볼 것이라 기대했지만, 3번에서 실제로는 개가 있다고 해요. 아기가 있다는 말은 본문과 달라요.","c":"F"},"h":"0b8fecd644"},{"n":3,"t":"tf","q":"For DINKWADs, a dog can give a sense of family without the long-term commitment of raising children.","ko":"딩크와드족에게 개는 아이를 키우는 장기적인 헌신 없이도 가족이라는 느낌을 줄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"For DINKWADs, the addition of pets marks a shift in priorities, with dogs providing companionship and a sense of family without the long-term commitments of child-rearing.","딩크와드족에게, 반려동물의 추가는 우선순위의 변화를 나타내는데, 개는 양육에 따르는 장기적인 헌신도 없이 동반자 관계와 가족이라는 느낌을 제공한다."]],"w":"8번에서 개가 양육에 따르는 장기적인 헌신 없이 동반자 관계와 가족이라는 느낌을 제공한다고 해요. 본문과 맞는 내용이에요.","c":"T"},"h":"478b83f0fe"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… couples decide to forgo children and instead make pets … the focus of their family life.)","ko":"… 커플들이 아이를 forgo하고 대신 반려동물을 가정생활의 중심으로 삼기로 결정하는 …","opts":["입양하다","포기하다","환영하다","가르치다"],"word":"forgo","r":{"a":"2) 포기하다","ev":"5번 문장","s":[[5,"The term describes an increasingly popular lifestyle where couples decide to forgo children and instead make pets, particularly dogs, the focus of their family life.","그 용어는 커플들이 아이를 갖는 것을 포기하고 대신에 반려동물, 특히 개를 그들의 가정생활의 중심으로 만들기로 결정하는 점점 더 인기 있는 생활 방식을 묘사한다."]],"w":"forgo children 뒤에 and instead(그 대신에)로 반려동물을 중심에 둔다는 말이 이어져요. 아이를 갖는 것을 하지 않는다는 뜻이므로 forgo = 포기하다예요.","c":2},"h":"0103132ab1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (With their concern about the rising costs of raising children and emphasis on personal freedom, …)","ko":"아이를 기르는 비용 상승에 대한 우려와 개인의 자유에 대한 emphasis 때문에, …","opts":["걱정","질문","강조","비용"],"word":"emphasis","r":{"a":"3) 강조","ev":"7번 문장","s":[[7,"With their concern about the rising costs of raising children and emphasis on personal freedom, these couples choose to focus on career development and leisure activities rather than on creating a traditional family.","아이를 기르는 비용의 상승에 대한 그들의 우려와 개인의 자유에 대한 강조 때문에, 이 커플들은 전통적인 가정을 꾸리는 것보다 경력 발전과 여가 활동에 집중하는 것을 선택한다."]],"w":"concern(걱정)과 나란히 쓰여 '자유를 중요하게 내세움'이라는 뜻이에요. emphasis = 강조. 걱정(concern)과 비용(costs)은 같은 문장에 있는 다른 단어예요.","c":3},"h":"91eddffec8"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThe concept of DINKWAD evolved from DINK, which refers to people who are employed and childless.","ko":"밑줄 친 which가 가리키는 것은?","sko":"딩크와드의 개념은 딩크에서 진화했는데, 이는 직업이 있고 자녀가 없는 사람들을 가리킨다.","opts":["딩크(DINK)","딩크와드(DINKWAD)","개념의 변화","자녀가 없는 커플의 반려견"],"r":{"a":"1) 딩크(DINK)","ev":"6번 문장","s":[[6,"The concept of DINKWAD evolved from DINK, which refers to people who are employed and childless.","딩크와드의 개념은 딩크(DINK)에서 진화했는데, 이는 직업이 있고 자녀가 없는 사람들을 가리킨다."]],"w":"which 바로 앞의 DINK를 덧붙여 설명하는 말이에요. 직업이 있고 자녀가 없는 사람들을 가리키는 것은 딩크이고, 딩크와드는 거기서 진화한 개념이에요.","c":1},"h":"12819d1f3f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This freedom affords them an autonomous lifestyle and allows them to invest in personal interests and experiences such as traveling.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 자유는 그들에게 자율적인 생활 방식을 제공하고 그들이 여행과 같은 개인적인 관심사와 경험에 투자하도록 허용한다.","opts":["이 자유 때문에 그들은 여행을 갈 수 없게 된다.","이 자유는 그들이 다른 사람들의 생활 방식을 따르게 한다.","이 자유 덕분에 그들은 자녀의 교육비를 모을 수 있다.","이 자유는 그들이 스스로 정한 생활을 하고 여행 같은 개인적 경험에 투자하게 해 준다."],"r":{"a":"4) 이 자유는 그들이 스스로 정한 생활을 하고 여행 같은 개인적 경험에 투자하게 해 준다.","ev":"10번 문장","s":[[10,"This freedom affords them an autonomous lifestyle and allows them to invest in personal interests and experiences such as traveling.","이 자유는 그들에게 자율적인 생활 방식을 제공하고 그들이 여행과 같은 개인적인 관심사와 경험에 투자하도록 허용한다."]],"w":"affords(제공한다)와 allows(허용한다)가 이어져서, 자율적인 생활과 여행 같은 개인적 관심사·경험에 투자할 수 있게 해 준다는 뜻이에요. 나머지 선지는 본문에 없거나 반대되는 내용이에요.","c":4},"h":"d00d212d7f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["평화로운 아침에, 글쓴이는 공원에서 유모차를 밀고 있는 한 커플을 본다.","평화로운 아침에, 글쓴이는 공원에서 자전거를 타고 있는 한 커플을 본다.","평화로운 아침에, 글쓴이는 공원에서 소풍을 즐기는 한 가족을 본다.","평화로운 아침에, 글쓴이는 잃어버린 개를 찾고 있는 한 커플을 본다."],"opts":["On a peaceful morning, the writer sees a couple pushing a stroller in the park.","On a peaceful morning, the writer sees a couple riding bicycles in the park.","On a peaceful morning, the writer sees a family having a picnic in the park.","On a peaceful morning, the writer sees a couple looking for a lost dog."],"r":{"a":"1) On a peaceful morning, the writer sees a couple pushing a stroller in the park. (평화로운 아침에, 글쓴이는 공원에서 유모차를 밀고 있는 한 커플을 본다.)","ev":"1번 문장","s":[[1,"On a peaceful morning in the park, you spot a couple pushing a stroller.","공원의 평화로운 아침에, 당신은 유모차를 밀고 있는 한 커플을 발견한다."]],"w":"1번 문장에서 공원의 평화로운 아침에 유모차를 밀고 있는 한 커플을 발견한다고 해요.","c":1},"h":"6c3fc68024"},{"n":9,"t":"sum","q":"This DINKWAD trend could lead to long-term (A) issues, such as declining (B) rates.","ko":"이 딩크와드 경향은 (B)율 감소 같은 장기적인 (A) 문제를 초래할 수 있다.","oko":["(A) 사회적 / (B) 출산","(A) 사회적 / (B) 사망","(A) 개인적 / (B) 출산","(A) 개인적 / (B) 사망","(A) 재정적 / (B) 사망"],"opts":["(A) societal / (B) birth","(A) societal / (B) death","(A) personal / (B) birth","(A) personal / (B) death","(A) financial / (B) death"],"r":{"a":"1) (A) societal / (B) birth ((A) 사회적 / (B) 출산)","ev":"11번 문장","s":[[11,"However, this trend could result in long-term societal issues, such as declining birth rates and a shortage of young people in the workforce to support a large aging population.","하지만, 이 경향은 장기적인 사회적 문제들을 초래할 수 있는데, 거대한 고령화 인구를 부양할 노동 인구 내 젊은이들의 부족과 출산율 감소 같은 것들이다."]],"w":"11번 문장에서 이 경향은 출산율(birth rates) 감소 같은 장기적인 사회적(societal) 문제를 초래할 수 있다고 해요.","c":1},"h":"0271204dd9"},{"n":10,"t":"fill","q":"DINKWAD couples usually have substantial [A] because both partners work, and they avoid the financial [B] of raising a child.","ko":"딩크와드 커플들은 부부 모두 일하고 아이를 기르는 재정적 [B]을(를) 피하기 때문에 보통 상당한 [A]을(를) 가진다.","bank":["assets","burden","population","lifestyle","habit","trend"],"bko":{"assets":"자산","burden":"부담","population":"인구","lifestyle":"생활 방식","habit":"습관","trend":"경향"},"r":{"a":"[A] assets (자산), [B] burden (부담)","ev":"9번 문장","s":[[9,"DINKWAD couples typically have substantial assets, because both partners work and they avoid the financial burden of raising a child to adulthood.","딩크와드 커플들은 일반적으로 상당한 자산을 가지고 있는데, 왜냐하면 부부 모두 일을 하고 그들은 아이를 성인으로 기르는 재정적 부담을 피하기 때문이다."]],"w":"9번에서 부부 모두 일해서 상당한 자산(assets)이 있고, 아이를 성인으로 기르는 재정적 부담(burden)을 피한다고 해요. 나머지 단어는 이 문장의 빈칸 의미와 맞지 않아요.","c":null},"h":"6eb6238806"}]},{"u":5,"id":"ms3-05-2","no":2,"ko":"그 안무가 진짜였어?","items":[{"n":1,"t":"tf","q":"The name whiplash comes from the fast lashing motion of a whip.","ko":"whiplash라는 이름은 채찍의 빠른 후려치는 움직임에서 유래했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The name whiplash actually comes from the lightning-fast lashing motion of a whip.","편타성 손상이라는 이름은 채찍의 번개처럼 빠른 후려치는 움직임에서 실제로 유래했다."]],"w":"5번 문장에서 whiplash라는 이름이 채찍의 번개처럼 빠른 후려치는 움직임에서 왔다고 해요. 본문과 맞는 내용이에요.","c":"T"},"h":"b95638cd7a"},{"n":2,"t":"tf","q":"Whiplash is a rare injury that is hardly ever reported.","ko":"편타성 손상은 거의 보고되지 않는 드문 부상이다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"It is a common neck injury, typically associated these days with traffic accidents, with over a million cases reported each year in the US alone.","그것은 흔한 목 부상인데, 오늘날 전형적으로 교통사고들과 연관되며, 미국에서만 매년 백만 건 넘게 보고된다."]],"w":"6번에서 whiplash는 흔한(common) 목 부상이고 미국에서만 매년 백만 건 넘게 보고된다고 해요. 드물다는 말은 반대예요.","c":"F"},"h":"24595712a7"},{"n":3,"t":"tf","q":"Recovery from surgery for severe whiplash can take months.","ko":"심각한 편타성 손상의 수술 후 회복에는 몇 달이 걸릴 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"But in more severe cases, surgery may be necessary to repair damage to the bones or nerves in the neck, which can take months to recover from.","하지만 더 심각한 경우들에는, 목의 뼈나 신경에 대한 손상을 치료하기 위해 수술이 필요할지도 모르는데, 그것은 회복하는 데 몇 달이 걸릴 수 있다."]],"w":"11번에서 더 심각한 경우 수술이 필요할 수 있고 회복하는 데 몇 달이 걸릴 수 있다고 해요. 본문과 맞는 내용이에요.","c":"T"},"h":"9147317407"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Should a vehicle abruptly decelerate during a collision, an individual’s neck may violently snap back and forth …)","ko":"충돌 중에 차량이 abruptly 감속한다면, 목이 격렬하게 앞뒤로 홱 움직일 수 있다.","opts":["갑자기","천천히","조용히","우연히"],"word":"abruptly","r":{"a":"1) 갑자기","ev":"7번 문장","s":[[7,"Should a vehicle abruptly decelerate during a collision, an individual’s neck may violently snap back and forth like a whip, thereby inducing the injury.","충돌 중에 차량이 갑자기 감속한다면, 개인의 목은 채찍처럼 앞뒤로 격렬하게 홱 움직일 수 있으며, 그로 인해 부상을 유발한다."]],"w":"충돌 순간 차량이 감속하면 목이 격렬하게 홱 움직인다는 상황이에요. 충돌은 순식간에 일어나므로 abruptly = 갑자기예요.","c":1},"h":"00fb03ad32"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Its symptoms generally include neck pain and stiffness.)","ko":"그것의 증상들은 일반적으로 목 통증과 stiffness를 포함한다.","opts":["떨림","가려움","뻣뻣함","차가움"],"word":"stiffness","r":{"a":"3) 뻣뻣함","ev":"8번 문장","s":[[8,"Its symptoms generally include neck pain and stiffness.","그것의 증상들은 일반적으로 목 통증과 뻣뻣함을 포함한다."]],"w":"목 통증과 함께 나오는 목의 증상이고, 목이 앞뒤로 홱 꺾이는 부상이므로 stiffness = 뻣뻣함이에요.","c":3},"h":"c2dea83e18"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIn “Whiplash,” a song by the K-pop group aespa, this line means to make such a strong impression that it feels like a physical jolt.","ko":"밑줄 친 it이 가리키는 것은?","sko":"K-pop 그룹 ‘에스파’의 노래인 “Whiplash”에서, 이 가사는 그것이 마치 물리적인 충격처럼 느껴질 정도로 너무나도 강한 인상을 남기는 것을 의미한다.","opts":["노래 ‘Whiplash’","에스파라는 그룹","이 가사가 남기는 강한 인상","물리적인 목 부상"],"r":{"a":"3) 이 가사가 남기는 강한 인상","ev":"2번 문장","s":[[2,"In “Whiplash,” a song by the K-pop group aespa, this line means to make such a strong impression that it feels like a physical jolt.","K-pop 그룹 ‘에스파’의 노래인 “Whiplash”에서, 이 가사는 그것이 마치 물리적인 충격처럼 느껴질 정도로 너무나도 강한 인상을 남기는 것을 의미한다."]],"w":"2번 문장에서 이 가사는 마치 물리적 충격처럼 느껴질 정도로 강한 인상을 남기는 것을 뜻해요. it은 그 강한 인상을 가리켜요.","c":3,"k":"it = 이 가사가 남기는 강한 인상"},"pron":"it","h":"6435697811"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Interestingly, this motion is not merely a piece of choreography incorporated to render a performance visually more dynamic.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"흥미롭게도, 이 움직임은 단지 공연을 시각적으로 더 역동적으로 보이게 만들기 위해 포함된 안무 동작에 불과한 것은 아니다.","opts":["이 움직임은 공연을 더 역동적으로 보이게 하려는 안무일 뿐이다.","이 움직임은 공연에서 완전히 빠져 있다.","이 움직임은 연습할 때만 쓰이는 동작이다.","이 움직임은 공연을 더 역동적으로 보이게 하는 안무 이상의 의미가 있다."],"r":{"a":"4) 이 움직임은 공연을 더 역동적으로 보이게 하는 안무 이상의 의미가 있다.","ev":"4번 문장","s":[[4,"Interestingly, this motion is not merely a piece of choreography incorporated to render a performance visually more dynamic.","흥미롭게도, 이 움직임은 단지 공연을 시각적으로 더 역동적으로 보이게 만들기 위해 포함된 안무 동작에 불과한 것은 아니다."]],"w":"not merely ~는 '단지 ~만은 아니다'라는 뜻이라서, 공연을 역동적으로 보이게 하려는 안무 이상의 의미가 있다는 말이에요. 뒤의 5번에서 그 의미(이름의 유래)가 이어져요.","c":4},"h":"5b7d6f7d69"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["에스파의 멤버들은 강력한 비트와 조화를 이루며 카리스마 있는 목 동작을 수행한다.","에스파의 멤버들은 음악 없이 목 동작을 수행한다.","에스파의 멤버들은 노래하는 동안 목을 전혀 움직이지 않는다.","목 동작은 노래의 마지막에만 수행된다."],"opts":["The members of aespa perform a charismatic neck movement in sync with the powerful beat.","The members of aespa perform the neck movement without any music.","The members of aespa never move their necks while they sing.","The neck movement is performed only at the end of the song."],"r":{"a":"1) The members of aespa perform a charismatic neck movement in sync with the powerful beat. (에스파의 멤버들은 강력한 비트와 조화를 이루며 카리스마 있는 목 동작을 수행한다.)","ev":"3번 문장","s":[[3,"In sync with the powerful beat, the members perform a charismatic neck movement.","강력한 비트와 조화를 이루며, 멤버들은 카리스마 있는 목 동작을 수행한다."]],"w":"3번 문장에서 멤버들은 강력한 비트와 조화를 이루며 카리스마 있는 목 동작을 수행한다고 해요.","c":1},"h":"7ebd5b7f76"},{"n":9,"t":"sum","q":"Automotive safety specialists say that the (A) remedy for whiplash lies in its (B).","ko":"자동차 안전 전문가들은 편타성 손상의 (A) 해결책이 그것의 (B)에 있다고 말한다.","oko":["(A) 최적의 / (B) 예방","(A) 최적의 / (B) 치료","(A) 최악의 / (B) 예방","(A) 최악의 / (B) 치료","(A) 가장 빠른 / (B) 수술"],"opts":["(A) optimal / (B) prevention","(A) optimal / (B) treatment","(A) worst / (B) prevention","(A) worst / (B) treatment","(A) quickest / (B) surgery"],"r":{"a":"1) (A) optimal / (B) prevention ((A) 최적의 / (B) 예방)","ev":"12번 문장","s":[[12,"Automotive safety specialists assert that the optimal remedy for whiplash lies in its prevention.","자동차 안전 전문가들은 편타성 손상에 대한 최적의 치료법은 그것의 예방에 있다고 주장한다."]],"w":"12번 문장에서 전문가들은 편타성 손상에 대한 최적의(optimal) 해결책이 예방(prevention)에 있다고 주장한다고 해요.","c":1},"h":"ec1beea9fc"},{"n":10,"t":"fill","q":"Experts recommend setting the seat [A] as close to the head as possible, which reduces the [B] of the neck snapping back.","ko":"전문가들은 좌석 [A]을(를) 가능한 한 머리에 가깝게 설정하라고 권하는데, 이는 목이 뒤로 홱 젖혀질 [B]을(를) 줄인다.","bank":["headrest","risk","vehicle","swelling","nausea","collision"],"bko":{"headrest":"머리 받침대","risk":"위험","vehicle":"차량","swelling":"부종","nausea":"메스꺼움","collision":"충돌"},"r":{"a":"[A] headrest (머리 받침대), [B] risk (위험)","ev":"13~14번 문장","s":[[13,"They recommend setting the seat headrest as close to the head as possible.","그들은 좌석 머리 받침대를 가능한 한 머리에 가깝게 설정하는 것을 권장한다."],[14,"This reduces the risk of the neck snapping back during a collision.","이것은 충돌 중에 목이 뒤로 홱 젖혀질 위험을 줄인다."]],"w":"13번에서 좌석 머리 받침대(headrest)를 머리에 가깝게 설정하라고 권하고, 14번에서 이것이 충돌 중 목이 뒤로 홱 젖혀질 위험(risk)을 줄인다고 해요.","c":null},"h":"0d0485d6b3"}]},{"u":5,"id":"ms3-05-3","no":3,"ko":"천사를 보여 주면 천사를 그리겠소","items":[{"n":1,"t":"tf","q":"The Desperate Man is a self-portrait by Gustave Courbet.","ko":"<절망하는 남자>는 귀스타브 쿠르베의 자화상이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This work is Gustave Courbet’s The Desperate Man, a self-portrait that reflects his personal struggles as well as the broader hardships of the human condition.","이 작품은 귀스타브 쿠르베의 <절망하는 남자>인데, 그의 개인적인 투쟁뿐만 아니라 인간 조건에 따른 더 광범위한 고난들을 반영하는 자화상이다."]],"w":"3번 문장에서 이 작품은 쿠르베의 <절망하는 남자>이고 그의 투쟁을 반영하는 자화상이라고 해요. 본문과 맞는 내용이에요.","c":"T"},"h":"0271416254"},{"n":2,"t":"tf","q":"Courbet is widely considered the father of European Romanticism.","ko":"쿠르베는 유럽 낭만주의의 아버지로 널리 여겨진다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Born in 1819, Courbet was a revolutionary French artist widely considered the father of European Realism.","1819년에 태어난, 쿠르베는 유럽 사실주의의 아버지로 널리 여겨지는 혁명적인 프랑스 예술가였다."]],"w":"4번에서 쿠르베는 유럽 사실주의(Realism)의 아버지로 널리 여겨진다고 해요. 낭만주의라는 말은 본문과 달라요.","c":"F"},"h":"23068e2994"},{"n":3,"t":"tf","q":"Critics of Courbet’s time accused him of establishing a “cult of ugliness.”","ko":"쿠르베 당대의 비평가들은 그가 ‘추함의 숭배’를 확립했다고 비난했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"However, critics of his time took a harsh view of Courbet’s work, accusing him of establishing a “cult of ugliness” because he focused on uncomfortable subject matter rather than noble figures or mythological beings.","하지만, 당대의 비평가들은 쿠르베의 작품에 대해 가혹한 견해를 취했고, 그가 고귀한 인물들이나 신화적인 존재들보다는 불편한 주제에 집중했기 때문에 그가 ‘추함의 숭배’를 확립했다고 비난했다."]],"w":"9번에서 당대 비평가들이 쿠르베가 '추함의 숭배'를 확립했다고 비난했다고 해요. 본문과 맞는 내용이에요.","c":"T"},"h":"e990d069aa"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Courbet created many masterpieces featuring regular people engaged in exhausting activities.)","ko":"쿠르베는 exhausting한 일을 하는 평범한 사람들을 특징으로 하는 많은 걸작을 창조했다.","opts":["즐거운","안전한","고단한","비밀스러운"],"word":"exhausting","r":{"a":"3) 고단한","ev":"6번 문장","s":[[6,"Courbet created many masterpieces featuring regular people engaged in exhausting activities.","쿠르베는 고단한 일을 하는 평범한 사람들을 특징으로 하는 많은 걸작을 창조했다."]],"w":"바로 뒤 7번에서 바위를 깨고 치우는 노동자의 예가 나와요. 힘들게 일하는 모습이므로 exhausting = 고단한이에요.","c":3},"h":"9aac83fe4b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This image reveals the difficulties that laborers faced in their daily lives.)","ko":"이 이미지는 노동자들이 일상생활에서 직면했던 어려움을 reveal한다.","opts":["드러낸다","숨긴다","바꾼다","잊게 한다"],"word":"reveals","r":{"a":"1) 드러낸다","ev":"8번 문장","s":[[8,"This image reveals the difficulties that laborers faced in their daily lives.","이 이미지는 노동자들이 그들의 일상생활에서 직면했던 어려움들을 드러낸다."]],"w":"그림이 노동자들의 어려움을 보여 주는 내용이에요. 그림이 어려움을 보여 주는 것이므로 reveals = 드러낸다예요.","c":1},"h":"7db9891a17"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhether his subjects were ugly or not did not matter; they were people he had seen and encountered.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그의 대상들이 추하든 아니든 중요하지 않았으며, 그들은 쿠르베가 보았고 마주쳤던 사람들이었다.","opts":["쿠르베가 그린 대상들","당대의 비평가들","신화적인 존재들","그림을 보는 관객들"],"r":{"a":"1) 쿠르베가 그린 대상들","ev":"12번 문장","s":[[12,"Whether his subjects were ugly or not did not matter; they were people he had seen and encountered.","그의 대상들이 추하든 아니든 중요하지 않았으며, 그들은 쿠르베가 보았고 마주쳤던 사람들이었다."]],"w":"12번 문장에서 they were people he had seen and encountered의 they는 앞에 나온 his subjects를 가리켜요.","c":1,"k":"they = 쿠르베가 그린 대상들(his subjects)"},"pron":"they","h":"51b35371ac"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He is grasping his hair with both hands, as if he has the weight of the world on his shoulders.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 마치 세상의 무게를 그의 어깨에 짊어진 것처럼, 양손으로 그의 머리카락을 움켜쥐고 있다.","opts":["그는 마치 세상의 무게를 짊어진 것처럼 양손으로 머리를 움켜쥐고 있다.","그는 양손으로 머리카락을 빗으며 즐거워하고 있다.","그는 어깨에 짐을 지고 먼 길을 걸어가고 있다.","그는 머리를 감싸고 잠을 자고 있다."],"r":{"a":"1) 그는 마치 세상의 무게를 짊어진 것처럼 양손으로 머리를 움켜쥐고 있다.","ev":"2번 문장","s":[[2,"He is grasping his hair with both hands, as if he has the weight of the world on his shoulders.","그는 마치 세상의 무게를 그의 어깨에 짊어진 것처럼, 양손으로 그의 머리카락을 움켜쥐고 있다."]],"w":"2번 문장은 그가 마치 세상의 무게를 어깨에 진 것처럼 양손으로 머리카락을 움켜쥐고 있다는 뜻이에요.","c":1},"h":"70c9caca14"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["<돌 깨는 사람들>은 들판에서 노는 두 아이를 보여 준다.","쿠르베는 주로 천사와 신화적인 존재를 그렸다.","<돌 깨는 사람들>은 도로를 만들기 위해 바위를 깨는 사람들을 보여 준다.","쿠르베의 그림은 이상화된 대상에 대한 낭만적 묘사를 선호한다."],"opts":["The Stonebreakers shows two children playing in a field.","Courbet mainly painted angels and mythological beings.","The Stonebreakers shows people breaking rocks to build a road.","Courbet’s paintings favor romantic portrayals of idealized subjects."],"r":{"a":"3) The Stonebreakers shows people breaking rocks to build a road.","ev":"7번 문장","s":[[7,"For example, The Stonebreakers shows an old man and a youth dressed in torn and stained clothes breaking and clearing rocks to build a road.","예를 들어, <돌 깨는 사람들>은 도로를 건설하기 위해 바위를 깨고 치우는, 찢어지고 얼룩진 옷을 입은 노인과 젊은이를 보여준다."]],"w":"7번에서 <돌 깨는 사람들>은 도로를 만들기 위해 바위를 깨고 치우는 노인과 젊은이를 보여 줘요. 쿠르베는 천사나 신화적 존재가 아니라 평범한 사람들을 그렸고(6, 9번), 사실주의는 낭만적 묘사를 거부해요(5번).","c":3},"h":"f37ed4aba0"},{"n":9,"t":"sum","q":"Critics attacked Courbet for showing (A) subjects, but he kept painting what he saw because his goal was to show real life (B).","ko":"비평가들은 쿠르베가 (A) 대상을 보여 준다고 비난했지만, 그의 목표는 실생활을 (B) 보여 주는 것이었기에 그는 본 대로 계속 그렸다.","oko":["(A) 고귀한 / (B) 정확하게","(A) 불편한 / (B) 정확하게","(A) 신화적인 / (B) 정확하게","(A) 불편한 / (B) 낭만적으로","(A) 고귀한 / (B) 낭만적으로"],"opts":["(A) noble / (B) accurately","(A) uncomfortable / (B) accurately","(A) mythological / (B) accurately","(A) uncomfortable / (B) romantically","(A) noble / (B) romantically"],"r":{"a":"2) (A) uncomfortable / (B) accurately","ev":"9번, 11번 문장","s":[[9,"However, critics of his time took a harsh view of Courbet’s work, accusing him of establishing a “cult of ugliness” because he focused on uncomfortable subject matter rather than noble figures or mythological beings.","하지만, 당대의 비평가들은 쿠르베의 작품에 대해 가혹한 견해를 취했고, 그가 고귀한 인물들이나 신화적인 존재들보다는 불편한 주제에 집중했기 때문에 그가 ‘추함의 숭배’를 확립했다고 비난했다."],[11,"What he meant by this was that his goal was to create accurate portrayals of real life.","이것으로 그가 의미했던 것은 그의 목표가 실생활의 정확한 묘사를 만들어내는 것이었다는 점이다."]],"w":"9번에서 비평가들은 고귀한 인물이나 신화적 존재 대신 불편한(uncomfortable) 주제에 집중했다고 비난했고, 11번에서 쿠르베의 목표는 실생활의 정확한(accurate) 묘사였어요.","c":2},"h":"256ea16a5d"},{"n":10,"t":"fill","q":"Standing before a painting, you see an [A] man [B] back at you.","ko":"그림 앞에 서서, 당신은 [A] 남자가 당신을 [B] 것을 본다.","bank":["anguished","staring","torn","stained","accused","difficulties"],"bko":{"anguished":"고뇌에 찬","staring":"쳐다보는","torn":"찢어진","stained":"얼룩진","accused":"비난한","difficulties":"어려움들"},"r":{"a":"[A] anguished (고뇌에 찬), [B] staring (쳐다보는)","ev":"1번 문장","s":[[1,"Standing before a painting, you see an anguished man staring back at you.","그림 앞에 서서, 당신은 당신을 쳐다보고 있는 고뇌에 찬 남자를 본다."]],"w":"1번 문장에서 그림 앞에 선 당신은 고뇌에 찬(anguished) 남자가 당신을 쳐다보는(staring) 모습을 본다고 해요.","c":null},"h":"f74d5ac7c6"}]},{"u":5,"id":"ms3-05-4","no":4,"ko":"Edison vs. Tesla: The Shocking Rivalry","items":[{"n":1,"t":"tf","q":"The DC system could not travel long distances without losing power.","ko":"직류 시스템은 전력 손실 없이 먼 거리를 전달될 수 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"While considered very safe to implement, the DC system had a significant limitation: it couldn’t travel long distances without losing power.","구현하기에 매우 안전하다고 여겨졌지만, 직류 시스템은 중대한 한계가 있었는데, 그것은 전력 손실 없이 먼 거리에 전달될 수 없었다."]],"w":"4번에서 직류 시스템은 전력을 잃지 않고서는 먼 거리를 갈 수 없다는 중대한 한계가 있었다고 해요. 본문과 맞는 내용이에요.","c":"T"},"h":"c2fcfe3acd"},{"n":2,"t":"tf","q":"Edison claimed that AC was safer than DC.","ko":"에디슨은 AC가 DC보다 더 안전하다고 주장했다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"So, he launched an aggressive campaign against AC, claiming it was dangerous.","그래서 그는 AC에 대한 공격적인 캠페인에 착수했고, 그것이 위험하다고 주장했다."]],"w":"10번에서 에디슨은 AC에 맞서 공격적인 캠페인을 하며 AC가 위험하다고 주장했어요. 더 안전하다는 말은 반대예요.","c":"F"},"h":"dc8fdff4fc"},{"n":3,"t":"tf","q":"Edison and Tesla fought a bitter battle known as the War of the Currents.","ko":"에디슨과 테슬라는 전류 전쟁이라고 알려진 치열한 전투를 벌였다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Thomas Edison and Nikola Tesla fought a bitter battle known as the War of the Currents that determined how electricity would power our world.","토마스 에디슨과 니콜라 테슬라는 어떻게 전기가 우리의 세상에 전력을 공급할 것인지를 결정한 전류 전쟁이라고 알려진 치열한 전투를 벌였다."]],"w":"2번에서 에디슨과 테슬라가 전류 전쟁이라고 알려진 치열한 전투를 벌였다고 해요. 본문과 맞는 내용이에요.","c":"T"},"h":"88e6715832"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This meant power plants needed to be built every few miles, making it impractical for widespread use, especially in rural areas.)","ko":"이것은 발전소가 몇 마일마다 건설되어야 함을 의미했고, 이는 광범위한 사용을 impractical하게 만들었다.","opts":["매우 안전한","비실용적인","저렴한","놀라운"],"word":"impractical","r":{"a":"2) 비실용적인","ev":"5번 문장","s":[[5,"This meant power plants needed to be built every few miles, making it impractical for widespread use, especially in rural areas.","이것은 발전소가 몇 마일마다 건설되어야 함을 의미했고, 이는 이 시스템의 특히 시골 지역에서의 광범위한 사용을 비실용적이게 만들었다."]],"w":"발전소를 몇 마일마다 지어야 하면 시골에서 널리 쓰기 어려워요. 그래서 impractical = 비실용적인이에요.","c":2},"h":"f809c73c7b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The difference between Edison and Tesla escalated into a public battle.)","ko":"에디슨과 테슬라의 차이는 공개적인 싸움으로 escalate했다.","opts":["격화되었다","해결되었다","줄어들었다","숨겨졌다"],"word":"escalated","r":{"a":"1) 격화되었다","ev":"8번 문장","s":[[8,"The difference between Edison and Tesla escalated into a public battle.","에디슨과 테슬라의 차이는 공개적인 전투로 격화되었다."]],"w":"둘의 차이가 '공개적인 싸움'이 되었다고 했고, 뒤의 9~11번에서 에디슨의 공격이 점점 커져요. 그래서 escalated = 격화되었다예요.","c":1},"h":"d257dbdf06"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nIn contrast, Tesla’s system relied on alternating current (AC), which is more like ocean waves flowing back and forth in both directions.","ko":"밑줄 친 which가 가리키는 것은?","sko":"대조적으로, 테슬라의 시스템은 교류(AC)에 의존했는데, 이는 양방향으로 오가는 바다의 파도와 더 비슷했다.","opts":["직류(DC)","테슬라","교류(AC)","바다의 파도"],"r":{"a":"3) 교류(AC)","ev":"6번 문장","s":[[6,"In contrast, Tesla’s system relied on alternating current (AC), which is more like ocean waves flowing back and forth in both directions.","대조적으로, 테슬라의 시스템은 교류(AC)에 의존했는데, 이는 양방향으로 오가는 바다의 파도와 더 비슷했다."]],"w":"6번 문장에서 which 바로 앞에 alternating current (AC)가 있어요. which는 이 교류를 가리켜요.","c":3,"k":"which = 교류(AC)(alternating current)"},"pron":"which","h":"ae788ee35c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It could send power over long distances with minimal loss, thanks to its ability to be easily transformed to higher voltages.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 더 높은 전압으로 쉽게 변환될 수 있는 능력 덕분에 최소한의 손실로 장거리에 걸쳐 전력을 보낼 수 있었다.","opts":["그것은 전압을 낮추기 어려워서 먼 거리에는 전력을 보낼 수 없었다.","그것은 전력을 보낼 때 많은 손실을 감수해야 했다.","그것은 가까운 거리에서만 전력을 보낼 수 있었다.","그것은 더 높은 전압으로 쉽게 바뀔 수 있어서 손실을 거의 내지 않고 먼 거리까지 전력을 보낼 수 있었다."],"r":{"a":"4) 그것은 더 높은 전압으로 쉽게 바뀔 수 있어서 손실을 거의 내지 않고 먼 거리까지 전력을 보낼 수 있었다.","ev":"7번 문장","s":[[7,"It could send power over long distances with minimal loss, thanks to its ability to be easily transformed to higher voltages.","그것은 더 높은 전압으로 쉽게 변환될 수 있는 능력 덕분에 최소한의 손실로 장거리에 걸쳐 전력을 보낼 수 있었다."]],"w":"thanks to ~(~ 덕분에) 뒤에 이유가 와요. 쉽게 더 높은 전압으로 변환되는 능력 덕분에 minimal loss(최소한의 손실)로 장거리 송전이 가능했다는 뜻이에요.","c":4},"h":"e030ed33ab"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["에디슨은 교류를 사용해 그의 전기 제국을 구축했다.","직류는 강처럼 한 방향으로 일정하게 흐른다.","테슬라의 시스템은 에디슨의 것보다 먼 거리에서 더 많은 전력을 잃었다.","에디슨은 그의 DC 특허권을 기꺼이 포기했다."],"opts":["Edison built his electrical empire using alternating current.","Direct current flows steadily in one direction like a river.","Tesla’s system lost more power over long distances than Edison’s.","Edison was happy to give up his DC patents."],"r":{"a":"2) Direct current flows steadily in one direction like a river.","ev":"3번 문장","s":[[3,"In the 1880s, Edison had already established his electrical empire using direct current (DC), a form of electricity that behaves like a steady river, flowing consistently in one direction.","1880년대에 에디슨은 일정하게 한 방향으로 흐르는, 안정적인 강처럼 작동하는 형태의 전기인 직류(DC)를 사용하는 그의 전기 제국을 이미 구축했다."]],"w":"3번에서 직류는 한 방향으로 일정하게 흐르는 안정적인 강 같다고 해요. 에디슨은 직류로 제국을 구축했고(3번), 테슬라의 교류가 장거리 손실이 적었으며(7번), 전류 전쟁은 AC가 표준이 되며 끝났어요(14번).","c":2},"h":"62ef38ffe3"},{"n":9,"t":"sum","q":"The War of the Currents (A) when AC became the (B) for power transmission worldwide.","ko":"전류 전쟁은 AC가 전 세계 전력 전송의 (B)이(가) 되었을 때 (A).","oko":["(A) 끝났다 / (B) 표준","(A) 끝났다 / (B) 예외","(A) 시작되었다 / (B) 표준","(A) 시작되었다 / (B) 예외","(A) 끝났다 / (B) 문제"],"opts":["(A) ended / (B) standard","(A) ended / (B) exception","(A) began / (B) standard","(A) began / (B) exception","(A) ended / (B) problem"],"r":{"a":"1) (A) ended / (B) standard ((A) 끝났다 / (B) 표준)","ev":"14번 문장","s":[[14,"This victory ended the War of the Currents, with AC becoming the standard for power transmission worldwide.","이 승리는 전류 전쟁을 끝냈고, AC는 전 세계적으로 전력 전송의 표준이 되었다."]],"w":"14번 문장에서 AC가 전 세계 전력 전송의 표준(standard)이 되면서 전류 전쟁이 끝났다(ended)고 해요.","c":1},"h":"6d6fee8267"},{"n":10,"t":"fill","q":"At the 1893 World’s Columbian Exposition, the host chose Tesla’s AC system to [A] the event because it was more [B].","ko":"1893년 세계 컬럼비아 박람회에서 주최 측은 행사를 [A] 목적으로 테슬라의 AC 시스템을 선택했는데, 그것이 더 [B] 시스템이었기 때문이다.","bank":["illuminate","affordable","dangerous","claim","campaign","voltages"],"bko":{"illuminate":"밝히다","affordable":"저렴한","dangerous":"위험한","claim":"주장하다","campaign":"캠페인","voltages":"전압"},"r":{"a":"[A] illuminate (밝히다), [B] affordable (저렴한)","ev":"13번 문장","s":[[13,"At the 1893 World’s Columbian Exposition in Chicago, the host chose Tesla’s more affordable AC system to illuminate the event.","1893년 시카고에서 열린 세계 컬럼비아 박람회에서, 주최 측은 행사를 밝히기 위해 테슬라의 더 저렴한 AC 시스템을 선택했다."]],"w":"13번에서 주최 측이 행사를 밝히기(illuminate) 위해 테슬라의 더 저렴한(affordable) AC 시스템을 선택했다고 해요. dangerous와 impractical은 에디슨이 AC를 깎아내리던 주장이나 DC의 한계와 관련된 말이라 맞지 않아요.","c":null},"h":"88138bfa1f"}]},{"u":6,"id":"ms3-06-1","no":1,"ko":"80살의 내가 뭐라고 할까?","items":[{"n":1,"t":"tf","q":"David E. Shaw was the founder and president of the company where Bezos worked.","ko":"데이비드 E. 쇼는 베조스가 일하던 회사의 창립자이자 사장이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Bezos sought advice from David E. Shaw, the founder and president of the company where he worked, about this aspiration.","베조스는 그가 일하던 회사의 창립자이자 사장인 데이비드 E. 쇼에게 이 포부에 관해 조언을 구했다."]],"w":"6번에서 쇼는 the founder and president of the company where he worked(그가 일하던 회사의 창립자이자 사장)라고 소개돼요. 본문과 맞는 내용이에요.","c":"T"},"h":"f7e414136b"},{"n":2,"t":"tf","q":"Shaw told Bezos to make his decision right away.","ko":"쇼는 베조스에게 결정을 바로 내리라고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Then he convinced Bezos to wait 48 hours before making a decision.","그런 다음 그는 베조스에게 결정을 내리기 전에 48시간을 기다리라고 설득했다."]],"w":"8번에서 쇼는 결정을 내리기 전에 48시간을 기다리라고 설득했어요(wait 48 hours before making a decision). 바로 내리라는 말은 반대예요.","c":"F"},"h":"c32c9d5723"},{"n":3,"t":"tf","q":"Bezos began his career by starting his own online bookstore.","ko":"베조스는 자신의 온라인 서점을 시작하며 경력을 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"After graduating from college, Bezos began to build an extraordinary career working at various financial firms.","대학을 졸업한 후, 베조스는 다양한 금융 회사들에서 일하며 비범한 경력을 쌓기 시작했다."]],"w":"3번에서 베조스는 대학 졸업 후 다양한 금융 회사에서 일하며 경력을 쌓기 시작했어요. 서점은 그 뒤 계획이에요. 본문과 달라요.","c":"F"},"h":"1b6fba9ef5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The answer was clearly “No,” even if he failed.)","ko":"비록 그가 실패할지라도, 답은 분명히 ‘아니오’였다.","opts":["성공했다","실패했다","포기했다","도착했다"],"word":"failed","r":{"a":"2) 실패했다","ev":"10번 문장","s":[[10,"The answer was clearly “No,” even if he failed.","비록 그가 실패할지라도, 답은 분명히 ‘아니오’였다."]],"w":"even if he failed는 '비록 실패할지라도'예요. 답이 No라는 것은, 실패해도 후회하지 않는다는 뜻이에요. fail = 실패하다.","c":2},"h":"20d7384f5a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…choosing this new challenge over stability once he was 80 years old.)","ko":"그가 80세가 되었을 때 안정보다 이 새로운 도전을 선택한 것을…","opts":["명성","자유","안정","경쟁"],"word":"stability","r":{"a":"3) 안정","ev":"9번 문장","s":[[9,"During this time, Bezos asked himself whether he would regret choosing this new challenge over stability once he was 80 years old.","이 시간 동안, 베조스는 자신이 80세가 되었을 때 안정보다 이 새로운 도전을 선택한 것을 후회할지 스스로에게 물었다."]],"w":"this new challenge over stability는 '안정보다 새로운 도전을 선택한 것'이에요. 도전과 대비되는 말이므로 stability = 안정이에요.","c":3},"h":"b515c9bf59"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhile we can’t completely prevent regrets, Jeff Bezos, the founder of Amazon, believes we can minimize them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"우리가 후회를 완전히 막을 수는 없지만, 아마존의 창립자인 제프 베조스는 우리가 그것들을 최소화할 수 있다고 믿는다.","opts":["과거의 결정들","베조스와 같은 사람들","금융 회사들","후회들"],"r":{"a":"4) 후회들","ev":"2번 문장","s":[[2,"While we can’t completely prevent regrets, Jeff Bezos, the founder of Amazon, believes we can minimize them.","우리가 후회를 완전히 막을 수는 없지만, 아마존의 창립자인 제프 베조스는 우리가 그것들을 최소화할 수 있다고 믿는다."]],"w":"앞에 나온 복수 명사 중 '최소화(minimize)'할 수 있는 것은 regrets(후회들)예요. 결정(decision)이 아니라 후회를 줄이는 이야기예요.","c":4},"h":"4f20f40c8c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"From that point forward, whenever he faced challenging crossroads, he applied the same approach, which he called the Regret Minimization Framework.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 시점부터, 그가 도전적인 갈림길에 직면할 때마다 동일한 접근법을 적용했으며, 이것을 후회 최소화 틀이라고 칭했다.","opts":["그 뒤로 어려운 선택의 순간마다 같은 방법을 썼고, 그 방법을 후회 최소화 틀이라고 불렀다.","그 뒤로 어려운 선택의 순간마다 매번 새로운 방법을 만들어 냈다.","후회 최소화 틀은 아마존을 세우기 전에 이미 유명한 방법이었다.","베조스는 갈림길을 피하려고 같은 방법을 쓰지 않았다."],"r":{"a":"1) 그 뒤로 어려운 선택의 순간마다 같은 방법을 썼고, 그 방법을 후회 최소화 틀이라고 불렀다.","ev":"13번 문장","s":[[13,"From that point forward, whenever he faced challenging crossroads, he applied the same approach, which he called the Regret Minimization Framework.","그 시점부터, 그가 도전적인 갈림길에 직면할 때마다 동일한 접근법을 적용했으며, 이것을 후회 최소화 틀이라고 칭했다."]],"w":"whenever는 '~할 때마다', the same approach는 '같은 방법'이에요. which he called ~는 그 방법에 붙인 이름을 설명해요.","c":1},"h":"d7ec50c8dc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["베조스는 대학을 졸업하자마자 자신의 서점을 열었다.","베조스는 26세에 한 회사의 부사장이 되었다.","베조스는 26세가 되기 전에 이미 온라인 서점을 시작했다.","베조스는 한 회사의 사장이 되어 쇼를 고용했다."],"opts":["Bezos opened his own bookstore right after graduating from college.","Bezos became the vice president of a company at the age of 26.","Bezos had already started an online bookstore before he was 26.","Bezos became a company president and hired Shaw."],"r":{"a":"2) Bezos became the vice president of a company at the age of 26.","ev":"4번 문장","s":[[4,"He even became the vice president of one company by the age of 26!","그는 심지어 26세의 나이에 한 회사의 부사장이 되었다!"]],"w":"4번에서 베조스는 26세에 한 회사의 부사장(vice president)이 되었어요. 졸업 후에는 금융 회사에서 일했고(3번), 사장은 쇼였어요(6번).","c":2},"h":"9759565f57"},{"n":9,"t":"sum","q":"Shaw (A) carefully to Bezos’s plan and said it would be an even (B) idea for someone without a promising career.","ko":"쇼는 베조스의 계획을 주의 깊게 (A), 유망한 직업이 없는 사람에게는 그것이 훨씬 더 (B) 생각일 것이라고 말했다.","oko":["(A) 무시했고 / (B) 좋은","(A) 들었고 / (B) 나쁜","(A) 끊었고 / (B) 나쁜","(A) 들었고 / (B) 좋은","(A) 무시했고 / (B) 나쁜"],"opts":["(A) ignored / (B) better","(A) listened / (B) worse","(A) interrupted / (B) worse","(A) listened / (B) better","(A) ignored / (B) worse"],"r":{"a":"4) (A) listened / (B) better ((A) 들었고 / (B) 좋은)","ev":"7번 문장","s":[[7,"When he explained his plan to quit his job and start an online bookstore, Shaw listened carefully and then told him that it was a good idea, but it would be an even better idea for someone who didn’t already have a promising career.","그가 직장을 그만두고 온라인 서점을 시작하겠다는 계획을 설명했을 때, 쇼는 주의 깊게 듣고 나서 그에게 그것이 좋은 생각이지만, 이미 유망한 직업을 가지고 있지 않은 사람에게 훨씬 더 좋은 생각이 될 것이라고 말했다."]],"c":4,"w":"7번에서 쇼는 listened carefully(주의 깊게 들었다)고 했고, 그 생각이 유망한 직업이 없는 사람에게 an even better idea(훨씬 더 좋은 생각)라고 말했어요. 그래서 (A) listened, (B) better예요. ignored(무시했다)·interrupted(끊었다)는 본문과 반대이고, worse는 better와 반대예요."},"h":"daf1b8062a"},{"n":10,"t":"fill","q":"This [A] made the difficult decision much easier, and he founded Amazon, which has become [B] successful.","ko":"이러한 [A]은(는) 어려운 결정을 훨씬 더 쉽게 만들었고, 그는 아마존을 설립했는데, 이는 [B] 성공적이게 되었다.","bank":["perspective","incredibly","minimize","prevent","carefully","quit"],"bko":{"perspective":"관점","incredibly":"놀랍도록","minimize":"최소화하다","prevent":"막다","carefully":"주의 깊게","quit":"그만두다"},"r":{"a":"[A] perspective (관점), [B] incredibly (놀랍도록)","ev":"12번 문장","s":[[12,"This perspective made the difficult decision much easier, and he founded Amazon, which has become incredibly successful.","이러한 관점은 어려운 결정을 훨씬 더 쉽게 만들었고, 그는 아마존을 설립했는데, 이는 놀랍도록 성공적이게 되었다."]],"c":null,"w":"12번에서 This perspective(이러한 관점)가 어려운 결정을 훨씬 더 쉽게 만들었고, 아마존은 incredibly successful(놀랍도록 성공적)이 되었어요. minimize·prevent·quit은 동사라서 This 뒤 명사 자리에 올 수 없고, carefully는 successful을 꾸미면 뜻이 맞지 않아요."},"h":"b97c468669"}]},{"u":6,"id":"ms3-06-2","no":2,"ko":"생각 안 한 죄, 사형입니다","items":[{"n":1,"t":"tf","q":"Arendt’s final work was published before she died.","ko":"아렌트의 마지막 저서는 그녀가 죽기 전에 출판되었다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"In The Life of the Mind, her final work published after her death in 1975, Arendt offers a profound philosophical perspective on thinking and morality.","1975년 그녀의 죽음 이후에 출판된 그녀의 마지막 저서인 <정신의 삶>에서, 아렌트는 사고와 도덕성에 대한 심오한 철학적 관점을 제공한다."]],"w":"9번에서 her final work published after her death in 1975라고 했어요. 죽음 '이후'에 출판되었으므로 본문과 달라요.","c":"F"},"h":"71e8c117af"},{"n":2,"t":"tf","q":"Eichmann claimed he had been following orders, but he was still found guilty.","ko":"아이히만은 자신이 명령을 따랐다고 주장했지만 여전히 유죄 판결을 받았다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Despite claiming he was merely following orders and bore no personal responsibility, Eichmann was found guilty and sentenced to death.","그가 단지 명령을 따르고 있었고 어떠한 개인적인 책임도 지지 않는다고 주장했음에도 불구하고, 아이히만은 유죄 판결을 받고 사형을 선고받았다."]],"w":"5번에서 그는 단지 명령을 따랐다고 주장했음에도 불구하고(Despite) 유죄 판결을 받고 사형을 선고받았어요. 본문과 맞는 내용이에요.","c":"T"},"h":"aea1247e78"},{"n":3,"t":"tf","q":"Arendt came to her realization about evil in 1975 while writing her last book.","ko":"아렌트는 마지막 책을 쓰는 동안인 1975년에 악에 관한 깨달음을 얻었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"She came to this realization in 1961 while reporting on the trial of Adolf Eichmann.","그녀는 1961년에 아돌프 아이히만의 재판을 보도하는 동안 이 깨달음에 도달했다."]],"w":"3번에서 깨달음은 1961년 아이히만의 재판을 보도하는 동안 얻은 것이에요. 1975년은 그녀가 죽은 해(9번)라서 본문과 달라요.","c":"F"},"h":"ff076b1a1a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…when performing mundane tasks thoughtlessly…)","ko":"…생각 없이 일상적인 과업들을 수행할 때…","opts":["위험한","일상적인","화려한","비밀의"],"word":"mundane","r":{"a":"2) 일상적인","ev":"8번 문장","s":[[8,"Controversial at the time, her analysis suggested that moral responsibility can be neglected when performing mundane tasks thoughtlessly, which can lead to evil consequences that the offender is unaware of.","그 당시에 논란이 많았던 그녀의 분석은 생각 없이 일상적인 과업들을 수행할 때 도덕적 책임이 무시될 수 있고, 이는 가해자가 인지하지 못하는 악한 결과들로 이어질 수 있다는 것을 시사했다."]],"w":"mundane tasks thoughtlessly는 생각 없이 하는 평범한 일을 말해요. 평소에 반복하는 일이므로 mundane = 일상적인이에요.","c":2},"h":"eb28008d49"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…evil does not reside solely in society’s worst monsters; it can emerge in anyone…)","ko":"…악은 사회의 최악의 괴물들에게만 존재하는 것이 아니며, 누구에게서든 나타날 수 있다…","opts":["사라지다","숨다","잠들다","나타나다"],"word":"emerge","r":{"a":"4) 나타나다","ev":"2번 문장","s":[[2,"According to philosopher Hannah Arendt, evil does not reside solely in society’s worst monsters; it can emerge in anyone whenever thought is absent.","철학자 한나 아렌트에 따르면, 악은 사회의 최악의 괴물들에게만 존재하는 것이 아니며, 그것은 생각이 부재할 때마다 누구에게서든 나타날 수 있다."]],"w":"악은 괴물에게만 있는 것이 아니라 누구에게서든 '나타날' 수 있다는 말이에요. emerge = 나타나다예요.","c":4},"h":"943ff09ea7"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nWhile Arendt agreed with the verdict, she argued that Eichmann, unlike other Nazis who passionately believed in their horrific ideologies, was a simple administrator who committed evil acts without the intention to cause harm to others.","ko":"밑줄 친 their가 가리키는 것은?","sko":"아렌트는 그 판결에 동의했지만, 그녀는 그들의 끔찍한 이데올로기를 열렬히 믿었던 다른 나치들과 달리, 아이히만은 타인에게 해를 끼치려는 의도 없이 악한 행동들을 저지른 단순한 관리자였다고 주장했다.","opts":["아이히만의","아렌트의","다른 나치들의","유대인들의"],"r":{"a":"3) 다른 나치들의","ev":"6번 문장","s":[[6,"While Arendt agreed with the verdict, she argued that Eichmann, unlike other Nazis who passionately believed in their horrific ideologies, was a simple administrator who committed evil acts without the intention to cause harm to others.","아렌트는 그 판결에 동의했지만, 그녀는 그들의 끔찍한 이데올로기를 열렬히 믿었던 다른 나치들과 달리, 아이히만은 타인에게 해를 끼치려는 의도 없이 악한 행동들을 저지른 단순한 관리자였다고 주장했다."]],"w":"their는 바로 앞의 who passionately believed in(열렬히 믿었던)의 주어, 곧 other Nazis(다른 나치들)를 받아요. 아이히만은 unlike(~와 달리)로 대비된 쪽이에요.","c":3},"h":"005a0cbc0a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Thus, it is through constant self-questioning that we consider the meaning and purpose of our actions.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서, 우리가 우리 행동의 의미와 목적을 고찰하는 것은 끊임없는 자기 질문을 통해서이다.","opts":["우리 행동의 의미와 목적은 한 번 정해지면 질문할 필요가 없다.","끊임없는 자기 질문은 우리 행동의 목적을 잊게 만든다.","우리는 다른 사람에게 계속 물어봄으로써 우리 행동의 의미를 알게 된다.","우리는 끊임없이 스스로에게 물음으로써 우리 행동의 의미와 목적을 생각하게 된다."],"r":{"a":"4) 우리는 끊임없이 스스로에게 물음으로써 우리 행동의 의미와 목적을 생각하게 된다.","ev":"11번 문장","s":[[11,"Thus, it is through constant self-questioning that we consider the meaning and purpose of our actions.","따라서, 우리가 우리 행동의 의미와 목적을 고찰하는 것은 끊임없는 자기 질문을 통해서이다."]],"w":"it is ~ that 강조 구문이 강조하는 것은 through constant self-questioning(끊임없는 자기 질문을 통해서)이에요. 남에게 묻는 것도, 한 번에 정해지는 것도 아니에요.","c":4},"h":"58a0c15b85"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아렌트는 사고를 한 번의 결정으로 정의했다.","아렌트는 사고를 자기 성찰의 지속적인 과정으로 정의했다.","아렌트는 사고가 도덕적 책임과 상관없다고 보았다.","아렌트는 사고를 다른 사람의 의견을 따르는 일로 정의했다."],"opts":["Arendt defined thinking as a single decision.","Arendt defined thinking as a continuous process of self-reflection.","Arendt believed thinking has nothing to do with moral responsibility.","Arendt defined thinking as following other people’s opinions."],"r":{"a":"2) Arendt defined thinking as a continuous process of self-reflection.","ev":"10번 문장","s":[[10,"She defined thinking as a continuous process of self-reflection essential to moral responsibility.","그녀는 사고를 도덕적 책임에 필수적인 자기 성찰의 지속적인 과정으로 정의했다."]],"w":"10번에서 사고는 도덕적 책임에 필수적인 자기 성찰의 지속적인 과정(a continuous process of self-reflection)이라고 정의돼요. 한 번의 결정이 아니고, 도덕적 책임과 관련이 깊어요.","c":2},"h":"3c6faf453f"},{"n":9,"t":"sum","q":"Arendt used the phrase “the banality of evil” to show that (A) people can do (B) acts when they fail to think critically.","ko":"아렌트는 “악의 평범성”이라는 표현으로, 비판적으로 생각하지 못할 때 (A) 사람들도 (B) 행동을 할 수 있음을 보여 주었다.","oko":["(A) 평범한 / (B) 너그러운","(A) 힘 있는 / (B) 비인간적인","(A) 부유한 / (B) 친절한","(A) 어린 / (B) 합법적인","(A) 평범한 / (B) 비인간적인"],"opts":["(A) ordinary / (B) generous","(A) powerful / (B) inhuman","(A) wealthy / (B) kind","(A) young / (B) legal","(A) ordinary / (B) inhuman"],"r":{"a":"5) (A) ordinary / (B) inhuman","ev":"7번 문장","s":[[7,"Arendt coined the phrase “the banality of evil” to describe how ordinary people could commit inhuman acts when they fail to think critically about their actions.","아렌트는 평범한 사람들이 그들의 행동에 대해 비판적으로 생각하지 못할 때 어떻게 비인간적인 행동들을 저지를 수 있는지를 묘사하기 위해 “악의 평범성”이라는 구절을 만들었다."]],"w":"7번에서 악의 평범성은 평범한 사람들(ordinary people)이 비판적으로 생각하지 못할 때 비인간적인 행동(inhuman acts)을 저지를 수 있음을 묘사해요. 그래서 (A) ordinary, (B) inhuman이에요.","c":5},"h":"be55ab1d1a"},{"n":10,"t":"fill","q":"Eichmann was [A] of war crimes for organizing the [B] of Jewish people to concentration camps during World War II.","ko":"아이히만은 제2차 세계 대전 동안 유대인들의 강제 수용소로의 [B]을(를) 조직한 것으로 전범 혐의로 [A] 상태였다.","bank":["accused","transportation","verdict","ideology","trial","banality"],"bko":{"accused":"기소된","transportation":"수송","verdict":"판결","ideology":"이데올로기","trial":"재판","banality":"평범함"},"r":{"a":"[A] accused, [B] transportation","ev":"4번 문장","s":[[4,"He was accused of war crimes for organizing the transportation of Jewish people to concentration camps during World War II.","그는 제2차 세계 대전 동안 유대인들을 강제 수용소로 수송하는 것을 조직한 것으로 전범 혐의로 기소되었다."]],"w":"4번의 He was accused of war crimes for organizing the transportation of Jewish people to concentration camps에서 가져왔어요. be accused of는 '~로 기소되다'이고, 수용소로 가는 것이므로 transportation(수송)이 맞아요. verdict·trial은 '수용소로의 ~'이라는 뜻에 맞지 않아요.","c":null},"h":"193608f26d"}]},{"u":6,"id":"m
