 thinking!","\"좋은 생각이다!",0],["That way, we can play it safe,\" said Annie.","그런 식으로, 우리는 신중을 기할 수 있어.\"라고 Annie가 말했다.",0],["Ethan continued, \"If straw is not the answer, we will have one more chance with the last coin.\"","Ethan이 이어 말했다, \"만약 짚이 답이 아니라면, 우리는 마지막 동전으로 한 번 더 기회를 갖게 될 거야.\"",0]];var RNUM=15;var TITLE_EN="The Family Puzzle";var PASS_EN=["The Family Puzzle","There once was a lovely family with three children. The children were very close. But as they got older, they slowly grew apart. One day, the parents called the children together. \"Do you remember this room? You used to play here. It was always filled with happiness,\" said the father. The mother continued, \"But now, you don't even talk to each other. So, we made a puzzle for you. Here are three silver coins. Go to the market and buy something to fill this room completely. If you succeed, you will get a big reward.\"","Ethan, the eldest child, said, \"We will do our best.\" The youngest of the family, Annie, was puzzled. \"Three silver coins aren't enough to fill this room!\" The father replied, \"If you work together, you can figure it out. Three heads are better than one.\" Patrick, the middle child, shouted, \"I know the answer!\" He grabbed a silver coin and ran out the door.","Patrick returned after he bought two bags of feathers from the market. He began to fill the room with feathers, but they barely covered the floor. Ethan said to Patrick, \"Why did you act on your own?\" Patrick dropped his head. \"I'm sorry. I thought I knew the answer.\" Annie sighed. \"Now we only have two coins left.\"","The children went to the market together. Patrick had another idea. \"How about straw? It's cheaper than feathers, but it takes up more space.\" Ethan said, \"Great idea! But let's only use one coin for now.\" \"Good thinking! That way, we can play it safe,\" said Annie. Ethan continued, \"If straw is not the answer, we will have one more chance with the last coin.\""];var PASS_KO=["가족 수수께끼","옛날에 세 아이가 있는 사랑스러운 가족이 있었다. 아이들은 매우 가까웠다. 하지만 나이가 들면서, 그들은 서서히 사이가 멀어졌다. 어느 날, 부모님이 아이들을 함께 불렀다. \"너희는 이 방을 기억하니? 너희가 여기서 놀곤 했잖니. 이곳은 항상 행복으로 가득 찼었지.\"라고 아버지가 말했다. 어머니가 이어 말했다, \"하지만 이제, 너희는 서로 대화조차 하지 않는구나. 그래서 우리는 너희를 위한 수수께끼 하나를 만들었단다. 여기 은화 세 개가 있어. 시장에 가서 이 방을 완전히 채울 무언가를 사렴. 만약 너희가 성공한다면, 너희는 큰 보상을 받을 거야.\"","첫째인 Ethan이 \"우리는 최선을 다할게요.\"라고 말했다. 가족의 막내인 Annie는 혼란스러웠다. \"은화 세 개는 이 방을 채우기에 충분하지 않아요!\" 아버지가 대답했다, \"만약 너희가 함께 한다면, 그것을 알아낼 수 있어. 세 명이 한 명보다 더 낫단다.\" 둘째인 Patrick이 \"난 답을 알아!\"라고 소리쳤다. 그는 은화 한 개를 쥐고 문밖으로 달려 나갔다.","Patrick은 시장에서 두 자루의 깃털을 산 후 돌아왔다. 그는 깃털로 방을 채우기 시작했지만, 깃털은 간신히 바닥을 덮었다. Ethan이 Patrick에게 말했다, \"왜 너 혼자서 행동했니?\" Patrick이 그의 머리를 떨구었다. \"미안해. 나는 답을 안다고 생각했어.\" Annie가 한숨을 쉬었다. \"이제 우리에게는 동전 두 개만이 남았어.\"","아이들은 함께 시장에 갔다. Patrick은 또 다른 아이디어가 있었다. \"짚은 어때? 그것은 깃털보다 더 싸지만, 더 많은 공간을 차지해.\" Ethan이 \"좋은 생각이야! 하지만 지금은 동전 한 개만 사용하자.\"라고 말했다. \"좋은 생각이다! 그런 식으로, 우리는 신중을 기할 수 있어.\"라고 Annie가 말했다. Ethan이 이어 말했다, \"만약 짚이 답이 아니라면, 우리는 마지막 동전으로 한 번 더 기회를 갖게 될 거야.\""];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["우주여행의 가능성","과학 보고서 주제 선정","과학 보고서를 쓰는 방법","과학 보고서를 위한 책 추천","우주여행에 대한 재미있는 정보"],"a":3,"ans":"과학 보고서를 위한 책 추천","evs":[["B: It’s about space. Can you recommend a book for me?","우주에 관한 거예요. 저에게 책을 추천해 주실 수 있나요?"],["W: How about Into Space? It’s one of my favorite books.","Into Space는 어때요? 제가 가장 좋아하는 책 중 하나예요."]],"ev":["B: It’s about space. Can you recommend a book for me?","우주에 관한 거예요. 저에게 책을 추천해 주실 수 있나요?"],"ow":["오답 ✕ — 'the book has a lot of interesting information about space travel'(그 책에는 우주여행에 관한 흥미로운 정보가 많이 있어요)라는 말은 있지만, 우주여행이 가능한지에 대한 이야기는 아니어서 틀림.","오답 ✕ — 소년은 이미 'It's about space.'(우주에 관한 거예요.)라고 보고서 주제를 정해 두었다. 주제를 고르는 대화가 아니어서 틀림.","오답 ✕ — 소년이 'Can you recommend a book for me?'(저에게 책을 추천해 주실 수 있나요?)라고 했을 뿐, 보고서를 쓰는 방법은 나오지 않아 틀림.","정답 ○ — 소년이 'Can you recommend a book for me?'(책을 추천해 주실 수 있나요?)라고 하자 여자가 'How about Into Space?'(Into Space는 어때요?)라며 추천해 주므로 주제로 알맞음.","오답 ✕ — 우주여행 정보는 추천한 책에 들어 있는 내용 중 일부일 뿐, 대화 전체의 주제는 책을 추천받는 것이라서 틀림."],"memo":["정답 ④: 과학 보고서를 위한 책 추천","근거: Can you recommend a book for me?(저에게 책을 추천해 주실 수 있나요?)","함정: ⑤ 우주여행 정보는 추천한 책의 내용일 뿐 주제가 아니다. ✕"],"why":"과학 보고서를 쓰는 소년이 서점 직원에게 책을 추천받는 대화이다."},{"n":2,"q":"대화의 내용을 요약한 다음 글의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["information - take","information - refuse","pictures - take","stories - refuse","jokes - sell"],"a":0,"ans":"information - take","evs":[["W: Well, the book has a lot of interesting information about space travel.","음, 그 책에는 우주여행에 관한 흥미로운 정보가 많이 있어요."],["B: That sounds really useful! I’ll take it.","정말 유용할 것 같네요! 그 책으로 할게요."]],"ev":["W: Well, the book has a lot of interesting information about space travel.","음, 그 책에는 우주여행에 관한 흥미로운 정보가 많이 있어요."],"ow":["정답 ○ — 'the book has a lot of interesting information about space travel'(그 책에는 우주여행에 관한 흥미로운 정보가 많이 있어요)이므로 (A)는 information이고, 'I'll take it.'(그 책으로 할게요.)이므로 (B)는 take임.","오답 ✕ — (A) information은 맞지만, 소년이 'That sounds really useful! I'll take it.'(정말 유용할 것 같네요! 그 책으로 할게요.)이라고 했으므로 refuse(거절하다)는 반대 뜻이라 틀림.","오답 ✕ — (B) take는 맞지만, 책에 많은 것은 'interesting information'(흥미로운 정보)이지 pictures(사진)가 아니라서 틀림.","오답 ✕ — 책에 있는 것은 'information'(정보)이지 stories(이야기)가 아니고, 소년이 책을 거절하지도 않았으므로 틀림.","오답 ✕ — 책에 있는 것은 'information'(정보)이지 jokes(농담)가 아니고, 소년이 책을 판다(sell)는 말도 없어서 틀림."],"memo":["정답 ①: information - take","근거: a lot of interesting information about space travel / I'll take it.","함정: I'll take it.은 '그것으로 할게요(사겠다)'라는 뜻 — refuse(거절)와 반대 ✕"],"why":"책에 우주여행 정보가 많다는 말을 듣고 소년이 그 책으로 하겠다고 한 요약이다.","sum":"The woman recommends Into Space because it has a lot of interesting (A)______ about space travel, so the boy decides to (B)______ it.","lab":"완성된 요약문 : "}],"dlg":[["W","Hello, how can I help you?","안녕하세요, 무엇을 도와드릴까요?"],["B","Hi, I’m looking for a book for a science report.","안녕하세요, 저는 과학 보고서를 위한 책을 찾고 있어요."],["W","Okay. What’s the report about?","그렇군요. 보고서는 무엇에 관한 건가요?"],["B","It’s about space. Can you recommend a book for me?","우주에 관한 거예요. 저에게 책을 추천해 주실 수 있나요?"],["W","How about Into Space? It’s one of
