완전한 시야(vision)를 가졌다고 생각하지만, 사실 그 일부는 뇌에 의해 만들어진다(created)고 해요.","c":null},"h":"d1ed6c3218"}]},{"u":4,"id":"hk3-04-4","no":4,"ko":"무엇을 무엇을 선택할까?","items":[{"n":1,"t":"tf","q":"People with Hamlet Syndrome are afraid they will make the wrong choice.","ko":"햄릿 증후군을 가진 사람들은 잘못된 선택을 할까 봐 두려워한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"People with this syndrome are afraid they will make the wrong choice.","이 증후군을 가진 사람들은 그들이 잘못된 선택을 할 것을 두려워한다."]],"w":"7번 문장에 People with this syndrome are afraid they will make the wrong choice라고 나와요. this syndrome은 6번의 Hamlet Syndrome이에요.","c":"T"},"h":"05f8c9d14c"},{"n":2,"t":"tf","q":"For people with Hamlet Syndrome, having many options makes them feel less stressed.","ko":"햄릿 증후군을 가진 사람들에게, 선택지가 많은 것은 스트레스를 덜 받게 한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"To these people, having many options means that they get more stressed!","이러한 사람들에게, 많은 선택지를 가지는 것은 그들이 더 스트레스를 받는다는 것을 의미한다!"]],"w":"9번에서 선택지를 많이 가지는 것은 그들이 더 스트레스를 받는다(more stressed)는 것을 의미한다고 해요. 덜 받는다는 말은 반대예요.","c":"F"},"h":"b06566a5ce"},{"n":3,"t":"tf","q":"Some restaurants provide a special menu with a single item each day.","ko":"일부 식당들은 매일 하나의 품목으로 된 특별 메뉴를 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"They provide a special menu each day with a single item for people who can’t make a choice.","그들은 선택을 하지 못하는 사람들을 위해 매일 하나의 품목으로 된 특별 메뉴를 제공한다."]],"w":"11번 문장에 They provide a special menu each day with a single item이라고 나와요. They는 10번의 some restaurants예요.","c":"T"},"h":"2200eb90d3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...Hamlet, the main character, faces a situation where he struggles to make a decision.)","ko":"...주인공인 햄릿은 그가 결정을 내리기 위해 ( ) 상황에 직면한다.","opts":["거절하는","즐기는","애쓰는","잊는"],"word":"struggles","r":{"a":"3) 애쓰는","ev":"3번 문장","s":[[3,"In the play, Hamlet, the main character, faces a situation where he struggles to make a decision.","그 연극에서, 주인공인 햄릿은 결정을 내리기 위해 애쓰는 상황에 직면한다."]],"w":"햄릿은 결정을 쉽게 못 내려서 힘들어하는 인물이에요. 「struggle + to-v」는 '~하려고 애쓰다'라는 뜻이에요.","c":3},"h":"19333aac05"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But if this happens frequently, you could have a condition known as Hamlet Syndrome.)","ko":"하지만 만약 이런 일이 ( ) 발생한다면, 당신은 햄릿 증후군이라고 알려져 있는 문제를 가지고 있을 수 있다.","opts":["드물게","자주","갑자기","천천히"],"word":"frequently","r":{"a":"2) 자주","ev":"6번 문장","s":[[6,"But if this happens frequently, you could have a condition known as Hamlet Syndrome.","하지만 만약 이런 일이 자주 발생한다면, 당신은 햄릿 증후군이라고 알려져 있는 문제를 가지고 있을 수 있다."]],"w":"증후군이라고 불릴 정도라면 가끔이 아니라 자주 그렇다는 말이에요. frequently는 '자주'라는 뜻이에요.","c":2},"h":"1cf5027652"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nLike him, you may have a hard time making decisions in some cases.","ko":"밑줄 친 him이 가리키는 것은?","sko":"그처럼, 당신은 어떤 경우 결정을 내리는 데 힘든 시간을 겪을 수도 있다.","opts":["당신","식당 주인","연극 관객","햄릿"],"r":{"a":"4) 햄릿","ev":"3~4번 문장","s":[[3,"In the play, Hamlet, the main character, faces a situation where he struggles to make a decision.","그 연극에서, 주인공인 햄릿은 결정을 내리기 위해 애쓰는 상황에 직면한다."],[4,"Like him, you may have a hard time making decisions in some cases.","그처럼, 당신은 어떤 경우 결정을 내리는 데 힘든 시간을 겪을 수도 있다."]],"w":"결정을 내리려고 애쓰던 사람은 3번의 Hamlet이에요. 4번의 him은 햄릿을 받아서 '햄릿처럼'이라는 뜻이에요.","c":4},"h":"81b8f5f344"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They even have a menu item for so-called Hamlets: Whatever.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 심지어 흔히 햄릿이라 불리는 이들을 위한 ‘아무거나’라는 메뉴 품목을 가지고 있다.","opts":["식당들은 선택을 못 하는 사람들을 위해 ‘아무거나’라는 이름의 메뉴를 가지고 있기도 하다.","식당들은 햄릿이라는 이름의 요리를 가장 비싸게 판다.","식당들은 손님이 아무거나 먹지 못하게 한다.","식당들은 메뉴를 고르지 못하는 사람을 내보낸다."],"r":{"a":"1) 식당들은 선택을 못 하는 사람들을 위해 ‘아무거나’라는 이름의 메뉴를 가지고 있기도 하다.","ev":"12번 문장","s":[[12,"They even have a menu item for so-called Hamlets: Whatever.","그들은 심지어 흔히 햄릿이라 불리는 이들을 위한 ‘아무거나’라는 메뉴 품목을 가지고 있다."]],"w":"so-called Hamlets는 '이른바 햄릿이라 불리는 사람들'로, 결정을 못 하는 사람들을 말해요. 그들을 위한 메뉴 이름이 Whatever(아무거나)라는 뜻이에요.","c":1},"h":"b6cebd67b6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["햄릿은 결정을 아주 빠르게 내리는 인물이다.","햄릿 증후군을 가진 사람들은 무엇을 마실지 고르는 일을 편안하게 느낀다.","“To be, or not to be”는 연극 <햄릿>의 가장 유명한 대사이다.","식당들은 햄릿 증후군을 가진 손님을 두려워한다."],"opts":["Hamlet always makes decisions quickly.","People with Hamlet Syndrome feel relaxed when choosing what to drink.","“To be, or not to be” is the most famous line from the play Hamlet.","Restaurants are afraid of customers with Hamlet Syndrome."],"r":{"a":"3) “To be, or not to be” is the most famous line from the play Hamlet.","ev":"2, 3, 8, 10번 문장","s":[[2,"This is the most famous line from the play Hamlet.","이것은 연극 <햄릿>의 가장 유명한 대사이다."],[3,"In the play, Hamlet, the main character, faces a situation where he struggles to make a decision.","그 연극에서, 주인공인 햄릿은 결정을 내리기 위해 애쓰는 상황에 직면한다."],[8,"Even an everyday decision like choosing what to drink can be stressful.","심지어 무엇을 마실지 선택하는 것과 같은 일상적인 결정도 스트레스를 일으킬 수 있다."],[10,"Interestingly, some restaurants see this phenomenon as an opportunity to attract more customers.","흥미롭게도, 일부 식당들은 이러한 현상을 더 많은 손님들을 끌어들일 기회로 여긴다."]],"w":"2번에서 이 대사가 연극 <햄릿>의 가장 유명한 대사라고 해요. 햄릿은 결정하려고 애쓰고(3번), 무엇을 마실지 고르는 일도 스트레스가 되며(8번), 식당들은 이 현상을 기회로 여겨요(10번).","c":3},"h":"c9938b5a5a"},{"n":9,"t":"sum","q":"Like Hamlet, you may have a hard time making decisions, so you might (A) making choices or let others (B) for you.","ko":"햄릿처럼, 당신은 결정을 내리는 데 힘든 시간을 겪을 수 있어서, 결정을 (A)하거나 다른 사람들이 당신을 위해 (B)하게 둘지도 모른다.","oko":["(A) 미루거나 / (B) 잊게","(A) 시작하거나 / (B) 결정하게","(A) 미루거나 / (B) 놀게","(A) 즐기거나 / (B) 지불하게","(A) 미루거나 / (B) 결정하게"],"opts":["(A) delay / (B) forget","(A) start / (B) decide","(A) delay / (B) play","(A) enjoy / (B) pay","(A) delay / (B) decide"],"r":{"a":"5) (A) delay / (B) decide","ev":"4~5번 문장","s":[[4,"Like him, you may have a hard time making decisions in some cases.","그처럼, 당신은 어떤 경우 결정을 내리는 데 힘든 시간을 겪을 수도 있다."],[5,"As a result, you might delay making choices or let others decide for you.","그 결과, 당신은 결정을 하는 것을 미루거나 다른 사람들이 당신을 위해 결정하게 둘지도 모른다."]],"w":"4번에서 햄릿처럼 결정이 힘들 수 있고, 5번에서 그 결과 결정을 하는 것을 미루거나(delay) 다른 사람들이 대신 결정하게(decide) 둘 수 있어요.","c":5},"h":"89591f5dca"},{"n":10,"t":"fill","q":"Some restaurants see this [A] as an [B] to attract more customers.","ko":"일부 식당들은 이 [A]을 더 많은 손님들을 끌어들일 [B]로 여긴다.","bank":["phenomenon","opportunity","frequently","customers","restaurants","afraid"],"bko":{"phenomenon":"현상","opportunity":"기회","frequently":"자주","customers":"손님들","restaurants":"식당들","afraid":"두려워하는"},"r":{"a":"[A] phenomenon, [B] opportunity","ev":"10번 문장","s":[[10,"Interestingly, some restaurants see this phenomenon as an opportunity to attract more customers.","흥미롭게도, 일부 식당들은 이러한 현상을 더 많은 손님들을 끌어들일 기회로 여긴다."]],"w":"10번에서 일부 식당들은 이 현상(phenomenon)을 더 많은 손님을 끌어들일 기회(opportunity)로 여겨요. 「see A as B」는 'A를 B로 여기다'예요.","c":null},"h":"2474098a12"}]},{"u":5,"id":"hk3-05-1","no":1,"ko":"변기가 예술이네","items":[{"n":1,"t":"tf","q":"Marcel Duchamp made Fountain in 1917.","ko":"마르셀 뒤샹은 1917년에 <샘>을 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In 1917, Marcel Duchamp created a work called Fountain.","1917년에, 마르셀 뒤샹은 <샘>이라고 불리는 작품을 만들었다."]],"w":"2번 문장에서 1917년에 뒤샹이 Fountain이라는 작품을 만들었다(created a work called Fountain)고 해요. 글의 내용과 같아요.","c":"T"},"h":"ff217d202c"},{"n":2,"t":"tf","q":"Cattelan’s toilet sculpture was made of stone.","ko":"카텔란의 변기 조각상은 돌로 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"More surprisingly, the sculpture was made entirely of gold!","더욱 놀랍게도, 그 조각상은 전부 금으로 만들어졌다!"]],"w":"8번 문장에서 조각상은 전부 금으로(entirely of gold) 만들어졌다고 해요. 돌이라는 말은 없어요.","c":"F"},"h":"8beca5ee59"},{"n":3,"t":"tf","q":"Another artist made a toilet-shaped sculpture a century after Duchamp’s work.","ko":"또 다른 예술가가 뒤샹의 작품 한 세기 후에 변기 모양의 조각상을 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"A century later, another artist named Maurizio Cattelan created a sculpture in the form of a toilet, too.","한 세기 후, 마우리치오 카텔란이라는 이름의 또 다른 예술가 역시 변기의 형태를 한 조각상을 만들었다."]],"w":"6번 문장에서 A century later(한 세기 후)에 카텔란이 변기 모양의 조각상을 만들었다고 해요. 글의 내용과 같아요.","c":"T"},"h":"c286e3ffc9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This challenged many people’s idea of what art could be.)","ko":"이것은 예술이 무엇일 수 있는지에 관한 많은 사람들의 관념에 ( ). (밑줄 친 단어의 뜻은?)","opts":["확인해 주었다","이의를 제기했다","더 널리 퍼뜨렸다","그대로 따랐다"],"word":"challenged","r":{"a":"2) 이의를 제기했다","ev":"3~4번 문장","s":[[3,"The piece was just a common urinal, but he turned it upside down to make it look like a fountain.","그 작품은 그냥 흔한 소변기였지만, 그는 그것을 샘처럼 보이게 만들기 위해 거꾸로 뒤집었다."],[4,"This challenged many people’s idea of what art could be.","이것은 예술이 무엇일 수 있는지에 관한 많은 사람들의 관념에 이의를 제기했다."]],"w":"3번에서 소변기를 뒤집어 놓고 예술이라고 했으니, 4번은 '예술은 이런 것'이라는 기존 생각에 이의를 제기했다는 말이에요. challenge = 이의를 제기하다.","c":2},"h":"c2805163fe"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…as long as they were modified in a creative way.)","ko":"…그것들이 창의적인 방식으로 ( ) 하기만 하면. (밑줄 친 단어의 뜻은?)","opts":["숨겨진","팔린","바뀐","잃어버린"],"word":"modified","r":{"a":"3) 바뀐","ev":"5번 문장","s":[[5,"And it showed that ordinary objects could be art as long as they were modified in a creative way.","그리고 그것은 일반적인 사물이 창의적인 방식으로 바뀌기만 하면 예술이 될 수 있다는 것을 보여줬다."]],"w":"5번은 평범한 사물이 창의적인 방식으로 바뀌면 예술이 될 수 있다는 뜻이에요. 3번에서 소변기를 뒤집은 것처럼 modify는 '바꾸다'예요. were modified = 바뀌어진.","c":3},"h":"f2d5bfb6bd"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was placed in a museum bathroom, and people could actually use it.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 박물관 화장실에 놓였고, 사람들은 그것을 실제로 사용할 수 있었다.","opts":["마우리치오 카텔란","박물관 화장실","<샘>이라는 작품","변기 모양의 조각상"],"r":{"a":"4) 변기 모양의 조각상","ev":"6~7번 문장","s":[[6,"A century later, another artist named Maurizio Cattelan created a sculpture in the form of a toilet, too.","한 세기 후, 마우리치오 카텔란이라는 이름의 또 다른 예술가 역시 변기의 형태를 한 조각상을 만들었다."],[7,"It was placed in a museum bathroom, and people could actually use it.","그것은 박물관 화장실에 놓였고, 사람들은 그것을 실제로 사용할 수 있었다."]],"w":"박물관 화장실에 놓인 것은 6번에서 카텔란이 만든 변기 모양의 조각상(a sculpture in the form of a toilet)이에요. 8번에서 the sculpture, 9번에서 it으로 이어져요.","c":4},"h":"c3281d9a65"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"And it showed that ordinary objects could be art as long as they were modified in a creative way.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그리고 그것은 일반적인 사물이 창의적인 방식으로 바뀌기만 하면 예술이 될 수 있다는 것을 보여줬다.","opts":["일반적인 사물도 창의적으로 바뀌기만 하면 예술이 될 수 있다는 것을 보여줬다.","일반적인 사물은 아무리 바꿔도 예술이 될 수 없다는 것을 보여줬다.","예술가는 반드시 유명한 사물만 사용해야 한다는 것을 보여줬다.","창의적인 사람만 사물을 바꿀 수 있다는 것을 보여줬다."],"r":{"a":"1) 일반적인 사물도 창의적으로 바뀌기만 하면 예술이 될 수 있다는 것을 보여줬다.","ev":"5번 문장","s":[[5,"And it showed that ordinary objects could be art as long as they were modified in a creative way.","그리고 그것은 일반적인 사물이 창의적인 방식으로 바뀌기만 하면 예술이 될 수 있다는 것을 보여줬다."]],"w":"ordinary objects could be art는 '일반적인 사물이 예술이 될 수 있다'이고, as long as ~는 '~하기만 하면'이라는 조건이에요. 조건은 '창의적인 방식으로 바뀌는 것'이에요.","c":1},"h":"3a28774f45"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["뒤샹은 금으로 된 샘을 거꾸로 뒤집어 <샘>을 만들었다.","<샘>은 <아메리카>가 만들어진 한 세기 후에 만들어졌다.","<아메리카>는 박물관 화장실에 놓였고, 사람들은 그것을 사용할 수 있었다.","카텔란은 돈을 많이 쓰는 사람들을 칭찬하려고 <아메리카>를 만들었다."],"opts":["Duchamp turned a golden fountain upside down to make Fountain.","Fountain was made a century after America.","America was placed in a museum bathroom, and people could use it.","Cattelan made America to praise people who spend a lot of money."],"r":{"a":"3) America was placed in a museum bathroom, and people could use it.","ev":"7번 문장","s":[[7,"It was placed in a museum bathroom, and people could actually use it.","그것은 박물관 화장실에 놓였고, 사람들은 그것을 실제로 사용할 수 있었다."]],"w":"7번에서 <아메리카>는 박물관 화장실에 놓였고 사람들이 실제로 사용할 수 있었어요. <샘>은 금이 아니라 소변기이고(3번), <샘>이 먼저예요(2번·6번). 카텔란은 낭비하는 사람들을 비판했어요(10번).","c":3},"h":"e66f72692a"},{"n":9,"t":"sum","q":"Through America, Cattelan (A) people who waste money on unnecessary things and made them (B) whether they really want luxurious things.","ko":"<아메리카>를 통해 카텔란은 불필요한 것에 돈을 낭비하는 사람들을 (A)했고, 사치스러운 것을 정말 원하는지 스스로에게 (B)하게 했다.","oko":["(A) 칭찬했다 / (B) 묻다","(A) 비판했다 / (B) 잊다","(A) 초대했다 / (B) 대답하다","(A) 비판했다 / (B) 묻다","(A) 무시했다 / (B) 사다"],"opts":["(A) praised / (B) ask","(A) criticized / (B) forget","(A) invited / (B) answer","(A) criticized / (B) ask","(A) ignored / (B) buy"],"r":{"a":"4) (A) criticized / (B) ask","ev":"10~11번 문장","s":[[10,"Through America, he tried to criticize those who waste money on unnecessary objects.","<아메리카>를 통해, 그는 불필요한 물건에 돈을 낭비하는 사람들을 비판하려 노력했다."],[11,"He also made people ask themselves whether they really desired overly luxurious things, like the golden toilet.","그는 또한 사람들이 금으로 된 변기와 같이, 지나치게 사치스러운 것들을 정말로 원했던 것인지 자신에게 묻도록 만들었다."]],"w":"10번에서 낭비하는 사람들을 비판하려 했고(criticize), 11번에서 사람들이 스스로에게 묻게 만들었어요(ask). 칭찬이나 무시가 아니에요.","c":4},"h":"ae5b70a4e0"},{"n":10,"t":"fill","q":"Duchamp turned a common [A] upside down so that it looked like a [B].","ko":"뒤샹은 흔한 [A]을/를 거꾸로 뒤집어 [B]처럼 보이게 했다.","bank":["urinal","fountain","museum","gold","America","century"],"bko":{"urinal":"소변기","fountain":"샘","museum":"박물관","gold":"금","America":"<아메리카>","century":"세기"},"r":{"a":"[A] urinal, [B] fountain","ev":"3번 문장","s":[[3,"The piece was just a common urinal, but he turned it upside down to make it look like a fountain.","그 작품은 그냥 흔한 소변기였지만, 그는 그것을 샘처럼 보이게 만들기 위해 거꾸로 뒤집었다."]],"w":"3번에서 흔한 소변기(a common urinal)를 거꾸로 뒤집어 샘(fountain)처럼 보이게 했다고 해요. museum·gold·America는 카텔란의 조각상 이야기에 나오는 말이에요.","c":null},"h":"7755f709b0"}]},{"u":5,"id":"hk3-05-2","no":2,"ko":"당신의 생각은 어떻습니까?","items":[{"n":1,"t":"tf","q":"Some videos made by kids get millions of hits.","ko":"아이들이 만든 일부 영상은 수백만 조회 수를 얻는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Many of their videos become popular, and some even get millions of hits.","그들의 영상 중 많은 것이 인기를 얻고, 일부는 심지어 수백만의 조회 수를 얻는다."]],"w":"2번 문장에서 아이들의 영상 중 일부는 수백만 조회 수(millions of hits)를 얻는다고 해요. 글의 내용과 같아요.","c":"T"},"h":"dae854f496"},{"n":2,"t":"tf","q":"Emma thinks most comments on kids’ videos are harmful.","ko":"Emma는 아이들 영상의 대부분의 댓글이 해롭다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Most of the comments are not harmful, and many are even encouraging.","대부분의 댓글은 해롭지 않고 많은 것은 힘을 북돋아주기까지 해."]],"w":"10번 문장에서 Emma는 대부분의 댓글이 해롭지 않고(not harmful) 많은 댓글이 힘을 북돋아 준다고 말해요. 해롭다는 건 반대예요.","c":"F"},"h":"d4db46edee"},{"n":3,"t":"tf","q":"Andrew says kids can have lower self-esteem because of hateful comments.","ko":"Andrew는 아이들이 악의적인 댓글 때문에 더 낮은 자존감을 가질 수 있다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"As a result, they can become discouraged and have lower self-esteem.","그 결과, 그들은 좌절하게 되거나 더 낮은 자존감을 가질 수 있어."]],"w":"7번 문장에서 Andrew는 아이들이 좌절하게 되거나 더 낮은 자존감(lower self-esteem)을 가질 수 있다고 해요. 글의 내용과 같아요.","c":"T"},"h":"f40ae55183"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (That’s why a few websites have banned leaving comments for all videos posted by children.)","ko":"그것이 몇몇 웹사이트가 어린이들이 올린 모든 영상에 댓글을 남기는 것을 ( ) 이유이다. (밑줄 친 단어의 뜻은?)","opts":["장려해 온","금지해 온","기대해 온","잊어 온"],"word":"banned","r":{"a":"2) 금지해 온","ev":"3~4번 문장","s":[[3,"Unfortunately, people sometimes post hateful comments about these videos.","안타깝게도, 사람들은 가끔 이러한 영상에 악의적인 댓글을 올린다."],[4,"That’s why a few websites have banned leaving comments for all videos posted by children.","그것이 몇몇 웹사이트가 어린이들에 의해 올려진 모든 영상에 댓글을 남기는 것을 금지한 이유이다."]],"w":"3번에서 악의적인 댓글이 문제라고 했고, 4번은 그래서 웹사이트들이 댓글을 못 남기게 했다는 결과예요. ban = 금지하다.","c":2},"h":"d8cdc178b1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most of the comments are not harmful, and many are even encouraging.)","ko":"대부분의 댓글은 해롭지 않고, 많은 것은 심지어 ( ) 정도이다. (밑줄 친 단어의 뜻은?)","opts":["위험한","지루한","화가 난","힘을 북돋아 주는"],"word":"encouraging","r":{"a":"4) 힘을 북돋아 주는","ev":"10번 문장","s":[[10,"Most of the comments are not harmful, and many are even encouraging.","대부분의 댓글은 해롭지 않고 많은 것은 힘을 북돋아주기까지 해."]],"w":"not harmful(해롭지 않은)이라고 한 뒤 even(심지어)이 붙었으니 해롭지 않은 걸 넘어 좋은 댓글이라는 뜻이에요. encouraging = 힘을 북돋아 주는.","c":4},"h":"bfd547cba9"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAs a result, they can become discouraged and have lower self-esteem.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그 결과, 그들은 좌절하게 되거나 더 낮은 자존감을 가질 수 있어.","opts":["악의적인 댓글들","어린아이들","성인들","웹사이트들"],"r":{"a":"2) 어린아이들","ev":"6~7번 문장","s":[[6,"Andrew: Although these comments could be just jokes, young kids can be hurt by them much more easily than adults.","이러한 댓글이 단지 농담일 수도 있지만, 어린아이들은 그것들로 인해 성인보다 훨씬 더 쉽게 상처받을 수 있어."],[7,"As a result, they can become discouraged and have lower self-esteem.","그 결과, 그들은 좌절하게 되거나 더 낮은 자존감을 가질 수 있어."]],"w":"6번에서 상처받을 수 있는 쪽은 어린아이들(young kids)이에요. 7번의 they는 그 아이들이 좌절하고 자존감이 낮아진다는 뜻이에요. 댓글이 좌절하는 것은 아니에요.","c":2},"h":"fc9ef9588b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Banning all comments stops us from giving positive feedback.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"모든 댓글을 금지하는 것은 우리가 긍정적인 피드백을 주는 것을 막아.","opts":["모든 댓글을 금지하면 긍정적인 피드백이 더 늘어난다.","긍정적인 피드백을 주면 모든 댓글이 금지된다.","모든 댓글을 금지하면 우리가 긍정적인 피드백을 주지 못하게 된다.","우리가 금지한 댓글은 모두 긍정적인 피드백이다."],"r":{"a":"3) 모든 댓글을 금지하면 우리가 긍정적인 피드백을 주지 못하게 된다.","ev":"11번 문장","s":[[11,"Banning all comments stops us from giving positive feedback.","모든 댓글을 금지하는 것은 우리가 긍정적인 피드백을 주는 것을 막아."]],"w":"「stop A from v-ing」는 'A가 ~하는 것을 막다'라서 stops us from giving positive feedback은 '우리가 긍정적인 피드백을 주는 것을 막는다'예요. 금지가 원인이고 피드백을 못 주는 것이 결과예요.","c":3},"h":"3ee2d08023"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["어떤 웹사이트도 어린이들이 올린 영상에 댓글을 금지하지 않았다.","아이들은 온라인에 영상을 거의 올리지 않는다.","악의적인 댓글은 어른들의 영상에만 올라온다.","사람들이 가끔 악의적인 댓글을 올려서 일부 웹사이트가 댓글을 금지했다."],"opts":["No websites have banned comments on videos posted by children.","Kids hardly ever post videos online.","Hateful comments are posted only on adults’ videos.","Some websites banned comments because people sometimes post hateful comments."],"r":{"a":"4) Some websites banned comments because people sometimes post hateful comments.","ev":"3~4번 문장","s":[[3,"Unfortunately, people sometimes post hateful comments about these videos.","안타깝게도, 사람들은 가끔 이러한 영상에 악의적인 댓글을 올린다."],[4,"That’s why a few websites have banned leaving comments for all videos posted by children.","그것이 몇몇 웹사이트가 어린이들에 의해 올려진 모든 영상에 댓글을 남기는 것을 금지한 이유이다."]],"w":"3번에서 사람들이 가끔 악의적인 댓글을 올린다고 하고, 4번에서 그래서 몇몇 웹사이트가 어린이 영상의 댓글을 금지했다고 해요. 아이들은 영상을 많이 올리고(1번), 어른 영상에만 달린다는 말은 없어요.","c":4},"h":"37582f2fa8"},{"n":9,"t":"sum","q":"Andrew thinks hateful comments can (A) young kids, lower their self-esteem, and even lead to (B).","ko":"Andrew는 악의적인 댓글이 어린아이들에게 상처를 (A)하고, 자존감을 낮추며, 심지어 (B)까지 이를 수 있다고 생각한다.","oko":["(A) 도와준다 / (B) 우울증","(A) 상처를 준다 / (B) 인기","(A) 즐겁게 한다 / (B) 피드백","(A) 무시한다 / (B) 조회 수","(A) 상처를 준다 / (B) 우울증"],"opts":["(A) help / (B) depression","(A) hurt / (B) popularity","(A) amuse / (B) feedback","(A) ignore / (B) hits","(A) hurt / (B) depression"],"r":{"a":"5) (A) hurt / (B) depression","ev":"6~8번 문장","s":[[6,"Andrew: Although these comments could be just jokes, young kids can be hurt by them much more easily than adults.","이러한 댓글이 단지 농담일 수도 있지만, 어린아이들은 그것들로 인해 성인보다 훨씬 더 쉽게 상처받을 수 있어."],[7,"As a result, they can become discouraged and have lower self-esteem.","그 결과, 그들은 좌절하게 되거나 더 낮은 자존감을 가질 수 있어."],[8,"In extreme cases, they may even experience depression.","극단적인 경우에, 그들은 심지어 우울증을 겪을 수도 있어."]],"w":"6번에서 어린아이들은 댓글에 상처받을 수 있다(hurt)고 하고, 8번에서 극단적인 경우 우울증(depression)까지 겪을 수 있다고 해요.","c":5},"h":"55e307e057"},{"n":10,"t":"fill","q":"Without comments, kids lose the [A] to improve their content and find it hard to know how to make videos [B].","ko":"댓글이 없으면 아이들은 콘텐츠를 개선할 [A]을/를 잃고, 영상을 어떻게 [B] 만들지 알기 어렵다.","bank":["opportunity","better","jokes","depression","adults","millions"],"bko":{"opportunity":"기회","better":"더 좋게","depression":"우울증","adults":"성인","millions":"수백만","jokes":"농담"},"r":{"a":"[A] opportunity, [B] better","ev":"12~13번 문장","s":[[12,"For kids, this means they lose the opportunity to improve their content.","아이들에게, 이것은 그들의 콘텐츠를 개선할 기회를 잃는 것을 의미해."],[13,"It is difficult for them to know what people like or how to make their videos better.","그들이 사람들이 무엇을 좋아하는지 또는 그들의 영상을 어떻게 더 좋게 만들지 아는 것은 어려워."]],"w":"12번에서 아이들은 콘텐츠를 개선할 기회(opportunity)를 잃고, 13번에서 영상을 어떻게 더 좋게(better) 만들지 알기 어렵다고 해요. depression(우울증)은 Andrew의 걱정이고, jokes(농담)는 6번 댓글 이야기에 나와요.","c":null},"h":"78fa6de26f"}]},{"u":5,"id":"hk3-05-3","no":3,"ko":"무덤까지 들고 간 비밀","items":[{"n":1,"t":"tf","q":"Dr. James Barry was a British surgeon who served in the army.","ko":"James Barry 박사는 군대에서 복무한 영국의 외과 의사였다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Dr. James Barry was a famous British surgeon who served in the army in the 19th century.","James Barry 박사는 19세기에 군대에서 복무한 영국의 유명한 외과 의사였다."]],"w":"1번 문장에서 James Barry 박사는 19세기에 군대에서 복무한 영국의 유명한 외과 의사였다고 해요. 글의 내용과 같아요.","c":"T"},"h":"2908185b4c"},{"n":2,"t":"tf","q":"Bulkley entered medical school under her own name.","ko":"Bulkley는 자신의 이름으로 의과 대학에 입학했다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"She took her dead uncle’s name and dressed up like a man.","그녀는 죽은 삼촌의 이름을 썼고 남자처럼 옷을 입었다."]],"w":"9번 문장에서 Bulkley는 죽은 삼촌의 이름(her dead uncle’s name)을 쓰고 남자처럼 옷을 입었어요. 자기 이름이 아니에요.","c":"F"},"h":"de4b4a1eb5"},{"n":3,"t":"tf","q":"Bulkley became the second-highest medical officer in the army.","ko":"Bulkley는 군대에서 두 번째로 높은 군의관이 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"She eventually became the second-highest medical officer in the army.","그녀는 결국 군대에서 두 번째로 가장 높은 군의관이 되었다."]],"w":"12번 문장에서 그녀는 결국 군대에서 두 번째로 가장 높은 군의관(the second-highest medical officer)이 되었다고 해요. 글의 내용과 같아요.","c":"T"},"h":"48a35a2b38"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (After his death, it was revealed that Dr. James Barry was not a man but a woman!)","ko":"그의 죽음 이후, James Barry 박사가 남자가 아니라 여자였다는 것이 ( ). (밑줄 친 단어의 뜻은?)","opts":["숨겨졌다","밝혀졌다","잊혀졌다","금지되었다"],"word":"revealed","r":{"a":"2) 밝혀졌다","ev":"4~5번 문장","s":[[4,"For his entire professional life, however, he kept a great secret.","그러나, 그의 직업 생활 내내, 그는 큰 비밀을 간직했다."],[5,"After his death, it was revealed that Dr. James Barry was not a man but a woman!","그의 죽음 이후, James Barry 박사가 남자가 아니라 여자였다는 것이 밝혀졌다!"]],"w":"4번에서 오랫동안 큰 비밀을 간직했다고 했고, 5번은 죽은 뒤에야 그 비밀이 알려졌다는 뜻이에요. reveal = 밝히다, 드러내다.","c":2},"h":"cad9e78fe6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Her life shows that women are just as capable as men.)","ko":"그녀의 삶은 여자들도 남자들만큼 ( ) 것을 보여준다. (밑줄 친 단어의 뜻은?)","opts":["유능한","약한","느린","조용한"],"word":"capable","r":{"a":"1) 유능한","ev":"12~13번 문장","s":[[12,"She eventually became the second-highest medical officer in the army.","그녀는 결국 군대에서 두 번째로 가장 높은 군의관이 되었다."],[13,"Her life shows that women are just as capable as men.","그녀의 삶은 여자들도 남자들만큼 유능하다는 것을 보여준다."]],"w":"여자인 Bulkley가 군대에서 두 번째로 높은 군의관까지 되었으니, 여자도 남자만큼 해낼 수 있다는 뜻이에요. capable = 유능한.","c":1},"h":"4c1e582c0c"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nOne of them was promoting the importance of sanitation in hospitals.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그것들 중 하나는 병원에서의 공중위생의 중요성을 알린 것이었다.","opts":["병원들","군대의 의사들","그의 직업적인 공들","여자 의사들"],"r":{"a":"3) 그의 직업적인 공들","ev":"2~3번 문장","s":[[2,"He made many professional contributions during his career.","그의 경력 동안 그는 많은 직업적인 공을 세웠다."],[3,"One of them was promoting the importance of sanitation in hospitals.","그것들 중 하나는 병원에서의 공중위생의 중요성을 알린 것이었다."]],"w":"One of them은 '그것들 중 하나'예요. 바로 앞 2번에서 많은 공을 세웠다(made many professional contributions)고 했으니, them은 그 공들(contributions)이에요.","c":3},"h":"230fd8d083"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, Bulkley would not give up her dream.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, Bulkley는 꿈을 포기하려 하지 않았다.","opts":["하지만 Bulkley는 자신의 꿈을 포기하려 하지 않았다.","하지만 Bulkley는 꿈을 포기하기로 결심했다.","하지만 Bulkley는 의사가 될 수 있다고 믿지 않았다.","하지만 Bulkley는 다른 사람에게 꿈을 양보했다."],"r":{"a":"1) 하지만 Bulkley는 자신의 꿈을 포기하려 하지 않았다.","ev":"7~8번 문장","s":[[7,"She wanted to become a doctor, but women were not allowed to study medicine at the time.","그녀는 의사가 되고 싶었지만, 그 당시에 여자들은 의학을 공부하도록 허락되지 않았다."],[8,"However, Bulkley would not give up her dream.","하지만, Bulkley는 꿈을 포기하려 하지 않았다."]],"w":"would not give up은 '포기하려 하지 않았다'예요. 7번에서 여자는 의학 공부가 허락되지 않았지만, 8번의 However(하지만)로 꿈을 포기하지 않았다고 이어져요.","c":1},"h":"c36c03fe7a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Bulkley는 여자로서 의과 대학에 입학했다.","Bulkley는 삼촌의 이름을 쓰고 남자처럼 옷을 입은 뒤 의과 대학에 입학했다.","Bulkley는 1812년에 군대에 입대했다.","James Barry 박사의 비밀은 그가 살아 있는 동안 밝혀졌다."],"opts":["Bulkley entered medical school as a woman.","Bulkley entered medical school after taking her uncle’s name and dressing like a man.","Bulkley joined the army in 1812.","Dr. James Barry’s secret was revealed while he was alive."],"r":{"a":"2) Bulkley entered medical school after taking her uncle’s name and dressing like a man.","ev":"9~10번 문장","s":[[9,"She took her dead uncle’s name and dressed up like a man.","그녀는 죽은 삼촌의 이름을 썼고 남자처럼 옷을 입었다."],[10,"Then she entered the University of Edinburgh Medical School.","그 후 그녀는 에든버러 의과 대학에 입학했다."]],"w":"9번에서 삼촌의 이름을 쓰고 남자처럼 옷을 입었고, 10번(Then)에서 의과 대학에 입학했어요. 1812년은 학위를 받은 해이고 입대는 그다음 해예요(11번), 비밀은 죽은 뒤에 밝혀졌어요(5번).","c":2},"h":"d8442390c0"},{"n":9,"t":"sum","q":"Margaret Bulkley wanted to become a (A), but women (B) to study medicine at that time.","ko":"Margaret Bulkley는 (A)이/가 되고 싶었지만, 그 당시 여자들은 의학을 공부하도록 (B).","oko":["(A) 교사 / (B) 허락되지 않았다","(A) 의사 / (B) 격려받았다","(A) 군인 / (B) 요구받았다","(A) 의사 / (B) 허락되지 않았다","(A) 간호사 / (B) 초대받았다"],"opts":["(A) teacher / (B) were not allowed","(A) doctor / (B) were encouraged","(A) soldier / (B) were required","(A) doctor / (B) were not allowed","(A) nurse / (B) were invited"],"r":{"a":"4) (A) doctor / (B) were not allowed","ev":"7번 문장","s":[[7,"She wanted to become a doctor, but women were not allowed to study medicine at the time.","그녀는 의사가 되고 싶었지만, 그 당시에 여자들은 의학을 공부하도록 허락되지 않았다."]],"w":"7번에서 그녀는 의사가 되고 싶었지만(wanted to become a doctor), 그 당시 여자들은 의학을 공부하도록 허락되지 않았다(were not allowed)고 해요.","c":4},"h":"d141783ee6"},{"n":10,"t":"fill","q":"Dr. James Barry kept a great [A] for his whole professional life, and after his death it was revealed that he was not a man but a [B].","ko":"James Barry 박사는 직업 생활 내내 큰 [A]을/를 간직했고, 죽은 뒤에 그가 남자가 아니라 [B]였다는 것이 밝혀졌다.","bank":["secret","woman","man","degree","medicine","contributions"],"bko":{"secret":"비밀","woman":"여자","man":"남자","degree":"학위","medicine":"의학","contributions":"공들"},"r":{"a":"[A] secret, [B] woman","ev":"4~5번 문장","s":[[4,"For his entire professional life, however, he kept a great secret.","그러나, 그의 직업 생활 내내, 그는 큰 비밀을 간직했다."],[5,"After his death, it was revealed that Dr. James Barry was not a man but a woman!","그의 죽음 이후, James Barry 박사가 남자가 아니라 여자였다는 것이 밝혀졌다!"]],"w":"4번에서 직업 생활 내내 큰 비밀(secret)을 간직했고, 5번에서 그 비밀은 남자가 아니라 여자(woman)였다는 것이에요. not a man but a woman이므로 man은 들어갈 수 없어요.","c":null},"h":"df2a4b47f6"}]},{"u":5,"id":"hk3-05-4","no":4,"ko":"할 수 있어요, 함께라면","items":[{"n":1,"t":"tf","q":"In Pandemic, everyone has to work together to prevent diseases from spreading.","ko":"‘팬데믹’ 게임에서 모두가 질병이 퍼지는 것을 막기 위해 협업해야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Each player picks a role, and everyone has to work together to prevent four diseases from spreading across the world.","각각의 참가자는 역할을 고르고, 모두가 네 가지 질병이 전 세계로 퍼지는 것을 막기 위해 협업해야 한다."]],"w":"2번 문장에서 모두가 네 가지 질병이 전 세계로 퍼지는 것을 막기 위해 협업해야 한다(has to work together)고 해요. 글의 내용과 같아요.","c":"T"},"h":"3c270a54d1"},{"n":2,"t":"tf","q":"Most pandemics come from viruses that infect only animals.","ko":"대부분의 팬데믹은 동물만 감염시키는 바이러스에서 비롯된다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Most pandemics originate from viruses that infect both animals and humans.","대부분의 팬데믹은 동물과 인간 모두를 감염시키는 바이러스에서 비롯된다."]],"w":"5번 문장에서 대부분의 팬데믹은 동물과 인간 모두(both animals and humans)를 감염시키는 바이러스에서 비롯된다고 해요. 동물만이라는 말은 틀려요.","c":"F"},"h":"5dec79156b"},{"n":3,"t":"tf","q":"The swine flu was declared a pandemic in 2009.","ko":"돼지 독감은 2009년에 팬데믹으로 선언되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"It was declared a pandemic by the World Health Organization (WHO) in 2009.","그것은 2009년에 세계보건기구(WHO)에 의해 팬데믹으로 선언되었다."]],"w":"7번 문장에서 돼지 독감은 2009년에 세계보건기구에 의해 팬데믹으로 선언되었다고 해요. 글의 내용과 같아요.","c":"T"},"h":"743d2f759c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A pandemic is a disease that spreads across different regions of the world and infects a large proportion of the population.)","ko":"팬데믹은 세계의 여러 지역에 퍼져 인구의 많은 비율을 ( ) 질병이다. (밑줄 친 단어의 뜻은?)","opts":["치료하는","감염시키는","예방하는","발견하는"],"word":"infects","r":{"a":"2) 감염시키는","ev":"4번 문장","s":[[4,"A pandemic is a disease that spreads across different regions of the world and infects a large proportion of the population.","팬데믹은 세계의 여러 지역에 퍼져 인구의 많은 비율을 감염시키는 질병이다."]],"w":"4번은 팬데믹이 무엇인지 설명해요. 퍼지면서 사람들을 병들게 하는 질병이니 infects는 '감염시키다'예요.","c":2},"h":"fd4ba56398"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It was declared a pandemic by the World Health Organization (WHO) in 2009.)","ko":"그것은 2009년에 세계보건기구(WHO)에 의해 팬데믹으로 ( ). (밑줄 친 단어의 뜻은?)","opts":["숨겨졌다","거부당했다","선언되었다","금지되었다"],"word":"declared","r":{"a":"3) 선언되었다","ev":"6~7번 문장","s":[[6,"One example is the swine flu.","한 가지 예시가 돼지 독감이다."],[7,"It was declared a pandemic by the World Health Organization (WHO) in 2009.","그것은 2009년에 세계보건기구(WHO)에 의해 팬데믹으로 선언되었다."]],"w":"6번에서 돼지 독감을 예로 들고, 7번에서 WHO가 그것을 팬데믹이라고 공식적으로 알렸다는 뜻이에요. declare = 선언하다, was declared = 선언되었다.","c":3},"h":"114670e733"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis allowed doctors around the world to treat patients quickly and effectively.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 전 세계의 의사들이 환자를 빠르고 효과적으로 치료하도록 했다.","opts":["돼지 독감","세계보건기구의 선언","환자들의 빠른 회복","국가들이 정보를 공유하고 백신을 개발한 것"],"r":{"a":"4) 국가들이 정보를 공유하고 백신을 개발한 것","ev":"8~9번 문장","s":[[8,"After that, countries cooperated to share information about the virus and develop a vaccine.","그 이후, 국가들은 그 바이러스에 대한 정보를 공유하고 백신을 개발하기 위해 협력했다."],[9,"This allowed doctors around the world to treat patients quickly and effectively.","이것은 전 세계의 의사들이 환자를 빠르고 효과적으로 치료하도록 했다."]],"w":"9번의 This는 바로 앞 8번 내용이에요. 국가들이 협력해서 바이러스 정보를 공유하고 백신을 개발한 것 덕분에 의사들이 환자를 빠르게 치료할 수 있었어요.","c":4},"h":"e8bdb2ac7a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Just like in the game, the entire world has put its differences aside to fight the pandemic.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마치 그 게임에서처럼, 전 세계가 그 팬데믹과 맞서 싸우기 위해 차이점을 제쳐두었다.","opts":["게임에서처럼, 전 세계가 팬데믹과 싸우기 위해 서로의 차이를 제쳐두었다.","게임과 달리, 세계는 서로의 차이 때문에 팬데믹 앞에서도 싸웠다.","게임에서처럼, 전 세계가 팬데믹을 이기려고 새로운 규칙을 만들었다.","게임을 그만두고 전 세계가 팬데믹을 피해 도망쳤다."],"r":{"a":"1) 게임에서처럼, 전 세계가 팬데믹과 싸우기 위해 서로의 차이를 제쳐두었다.","ev":"11번 문장","s":[[11,"Just like in the game, the entire world has put its differences aside to fight the pandemic.","마치 그 게임에서처럼, 전 세계가 그 팬데믹과 맞서 싸우기 위해 차이점을 제쳐두었다."]],"w":"Just like in the game은 '게임에서처럼'이고, put its differences aside는 '차이점을 제쳐두다'예요. to fight the pandemic은 '팬데믹과 맞서 싸우기 위해'라는 목적이에요.","c":1},"h":"44f9ffbc3c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["팬데믹은 한 나라 안에서만 퍼지는 질병이다.","팬데믹은 인구의 아주 작은 부분만 감염시키는 질병이다.","팬데믹은 여러 지역에 퍼져 많은 사람을 감염시키는 질병이다.","팬데믹은 동물만 걸릴 수 있는 질병이다."],"opts":["A pandemic is a disease that spreads only inside one country.","A pandemic is a disease that infects only a small part of the population.","A pandemic is a disease that spreads across different regions and infects many people.","A pandemic is a disease that only animals can get."],"r":{"a":"3) A pandemic is a disease that spreads across different regions and infects many people.","ev":"4번 문장","s":[[4,"A pandemic is a disease that spreads across different regions of the world and infects a large proportion of the population.","팬데믹은 세계의 여러 지역에 퍼져 인구의 많은 비율을 감염시키는 질병이다."]],"w":"4번에서 팬데믹은 세계의 여러 지역에 퍼져 인구의 많은 비율을 감염시키는 질병이라고 해요. 한 나라 안이나 소수만 감염시키는 병이 아니에요.","c":3},"h":"f7fa5986f5"},{"n":9,"t":"sum","q":"After the swine flu was declared a pandemic, countries (A) information about the virus, and this allowed doctors around the world to (B) patients quickly.","ko":"돼지 독감이 팬데믹으로 선언된 후, 국가들은 바이러스에 대한 정보를 (A)했고, 그래서 전 세계의 의사들은 환자를 빠르게 (B)할 수 있었다.","oko":["(A) 숨겼다 / (B) 치료하다","(A) 공유했다 / (B) 치료하다","(A) 공유했다 / (B) 감염시키다","(A) 팔았다 / (B) 경쟁하다","(A) 숨겼다 / (B) 무시하다"],"opts":["(A) hid / (B) treat","(A) shared / (B) treat","(A) shared / (B) infect","(A) sold / (B) compete","(A) hid / (B) ignore"],"r":{"a":"2) (A) shared / (B) treat","ev":"8~9번 문장","s":[[8,"After that, countries cooperated to share information about the virus and develop a vaccine.","그 이후, 국가들은 그 바이러스에 대한 정보를 공유하고 백신을 개발하기 위해 협력했다."],[9,"This allowed doctors around the world to treat patients quickly and effectively.","이것은 전 세계의 의사들이 환자를 빠르고 효과적으로 치료하도록 했다."]],"w":"8번에서 국가들은 정보를 공유하고(share) 백신을 개발했고, 9번에서 그 덕분에 의사들이 환자를 빠르고 효과적으로 치료할(treat) 수 있었어요.","c":2},"h":"d569dff9de"},{"n":10,"t":"fill","q":"Just like in the game, the entire world has put its [A] aside to [B] the pandemic.","ko":"마치 게임에서처럼, 전 세계가 팬데믹과 [B]하기 위해 [A]을/를 제쳐두었다.","bank":["differences","fight","vaccine","virus","region","population"],"bko":{"differences":"차이점","fight":"싸우다","vaccine":"백신","virus":"바이러스","region":"지역","population":"인구"},"r":{"a":"[A] differences, [B] fight","ev":"11번 문장","s":[[11,"Just like in the game, the entire world has put its differences aside to fight the pandemic.","마치 그 게임에서처럼, 전 세계가 그 팬데믹과 맞서 싸우기 위해 차이점을 제쳐두었다."]],"w":"11번 문장에서 전 세계가 차이점(differences)을 제쳐두고 팬데믹과 맞서 싸우기(fight) 위해 협력했다고 해요. vaccine·virus·region·population은 이 문장에 쓰이지 않았어요.","c":null},"h":"792194ef59"}]},{"u":6,"id":"hk3-06-1","no":1,"ko":"쨍그랑! 결혼 축하해요!","items":[{"n":1,"t":"tf","q":"Karl told the writer to bring some plates.","ko":"Karl은 필자에게 접시 몇 장을 가져오라고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Karl told me to bring some plates.","Karl은 나에게 접시 몇 장을 가져오라고 말했다."]],"w":"3번 문장에서 Karl이 필자에게 접시 몇 장을 가져오라고 했어요(Karl told me to bring some plates). 글의 내용과 같아요.","c":"T"},"h":"9e6c11142d"},{"n":2,"t":"tf","q":"A guest said everyone broke the plates because they were angry at the couple.","ko":"한 손님은 모두가 부부에게 화가 나서 접시를 깼다고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"He said, “To wish the couple good luck in their marriage.”","그는 “부부에게 결혼 생활에 행운을 빌어주기 위해서예요.”라고 말했다."]],"w":"8번 문장에서 손님은 부부에게 결혼 생활에 행운을 빌어주기 위해서(To wish the couple good luck)라고 말해요. 화가 났다는 말은 반대예요.","c":"F"},"h":"72c64cee6a"},{"n":3,"t":"tf","q":"The guest said breaking a mirror brings seven years of good luck.","ko":"그 손님은 거울을 깨면 7년의 행운이 온다고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"“That means seven years of bad luck!”","“그것은 7년의 불행을 의미해요!”"]],"w":"12번 문장에서 거울을 부수는 것은 7년의 불행(seven years of bad luck)을 의미한다고 해요. 행운이 아니에요.","c":"F"},"h":"299fa88261"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It was a little odd, but I thought he needed extra plates for all the guests.)","ko":"그것은 조금 ( ) 했지만, 나는 그가 모든 손님들을 위한 여분의 접시가 필요하다고 생각했다. (밑줄 친 단어의 뜻은?)","opts":["평범한","이상한","즐거운","편리한"],"word":"odd","r":{"a":"2) 이상한","ev":"3~4번 문장","s":[[3,"Karl told me to bring some plates.","Karl은 나에게 접시 몇 장을 가져오라고 말했다."],[4,"It was a little odd, but I thought he needed extra plates for all the guests.","그것은 조금 이상했지만, 나는 그가 모든 손님들을 위한 여분의 접시가 필요하다고 생각했다."]],"w":"3번에서 파티에 접시를 가져오라는 말이 나왔어요. 보통은 접시를 가져가지 않으니 조금 이상하다고 느낀 거예요. 뒤의 but으로 이어지는 것도 맞아요. odd = 이상한.","c":2},"h":"850b644ba9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The ground became a mess, but everyone was smiling happily.)","ko":"바닥은 ( )이/가 되었지만, 모두가 행복하게 미소를 짓고 있었다. (밑줄 친 단어의 뜻은?)","opts":["선물","정원","무대","난장판"],"word":"mess","r":{"a":"4) 난장판","ev":"5~6번 문장","s":[[5,"However, once the party started, everyone gathered together and suddenly threw their dishes on the ground!","하지만, 파티가 시작되자마자, 모두 함께 모여 갑자기 접시를 바닥에 던졌다!"],[6,"The ground became a mess, but everyone was smiling happily.","바닥은 난장판이 되었지만, 모두가 행복하게 미소를 짓고 있었다."]],"w":"5번에서 모두가 접시를 바닥에 던졌으니 바닥은 어지럽고 지저분해졌겠죠. 뒤의 but으로 모두가 웃고 있다고 대조돼요. mess = 난장판.","c":4},"h":"4879aa7b53"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nGermans do this because of the old saying, “Shards bring luck.”","ko":"밑줄 친 this가 가리키는 것은?","sko":"독일인들은 ‘조각들이 행운을 가져온다.’라는 옛말 때문에 이것을 한다.","opts":["파티에 접시를 가져가는 것","결혼식을 올리는 것","결혼식 전날 밤에 접시를 부수는 것","거울을 깨지 않는 것"],"r":{"a":"3) 결혼식 전날 밤에 접시를 부수는 것","ev":"9~10번 문장","s":[[9,"This event is called Polterabend, a wedding tradition in Germany.","이 행사는 독일의 결혼식 전통인 ‘Polterabend’라고 불리는 것이었다."],[10,"Germans do this because of the old saying, “Shards bring luck.”","독일인들은 ‘조각들이 행운을 가져온다.’라는 옛말 때문에 이것을 한다."]],"w":"10번의 this는 독일인들이 하는 일이고, 그 이유가 '조각들이 행운을 가져온다'예요. 9번의 This event(Polterabend)와 7번에서 본 접시를 부수는 일을 가리켜요.","c":3},"h":"5353fdcd1d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It was a little odd, but I thought he needed extra plates for all the guests.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 조금 이상했지만, 나는 그가 모든 손님들을 위한 여분의 접시가 필요하다고 생각했다.","opts":["조금 이상했지만, 나는 그가 모든 손님을 위한 여분의 접시가 필요하다고 생각했다.","아주 편안했고, 나는 접시가 한 장도 필요 없다고 생각했다.","조금 이상했지만, 나는 그가 접시를 던지고 싶어 한다고 생각했다.","이상했지만, 나는 접시를 가져가지 않기로 결정했다."],"r":{"a":"1) 조금 이상했지만, 나는 그가 모든 손님을 위한 여분의 접시가 필요하다고 생각했다.","ev":"3~4번 문장","s":[[3,"Karl told me to bring some plates.","Karl은 나에게 접시 몇 장을 가져오라고 말했다."],[4,"It was a little odd, but I thought he needed extra plates for all the guests.","그것은 조금 이상했지만, 나는 그가 모든 손님들을 위한 여분의 접시가 필요하다고 생각했다."]],"w":"I thought 뒤에는 that이 생략돼 있어요. he needed extra plates for all the guests는 '그가 모든 손님들을 위한 여분의 접시가 필요하다'는 필자의 생각이에요. 던질 거라는 생각은 5번에서 놀라게 되는 일이라 이때는 몰랐어요.","c":1},"h":"bce4e7fce9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파티에서 모두가 접시를 바닥에 던지고 울었다.","Karl의 손님들은 파티가 시작될 때 접시를 조심스럽게 식탁에 놓았다.","필자는 결혼식 후에 파티에 초대를 받았다.","바닥이 난장판이 되었지만 모두가 행복하게 미소를 지었다."],"opts":["Everyone at the party threw their dishes on the ground and cried.","Karl’s guests carefully put their plates on the table at the start of the party.","The writer was invited to the party after the wedding.","Everyone smiled happily even though the ground became a mess."],"r":{"a":"4) Everyone smiled happily even though the ground became a mess.","ev":"5~6번 문장","s":[[5,"However, once the party started, everyone gathered together and suddenly threw their dishes on the ground!","하지만, 파티가 시작되자마자, 모두 함께 모여 갑자기 접시를 바닥에 던졌다!"],[6,"The ground became a mess, but everyone was smiling happily.","바닥은 난장판이 되었지만, 모두가 행복하게 미소를 짓고 있었다."]],"w":"5번에서 모두가 접시를 바닥에 던졌고, 6번에서 바닥은 난장판이 되었지만 모두가 행복하게 웃고 있었어요. 파티는 결혼식 전날 밤이었어요(2번).","c":4},"h":"80a1402a58"},{"n":9,"t":"sum","q":"Polterabend is a German wedding (A) in which people break plates because of the old saying that shards bring (B).","ko":"Polterabend는 사람들이 조각들이 (B)을/를 가져온다는 옛말 때문에 접시를 부수는 독일의 결혼식 (A)이다.","oko":["(A) 게임 / (B) 행운","(A) 전통 / (B) 문제","(A) 전통 / (B) 행운","(A) 식사 / (B) 행운","(A) 전통 / (B) 돈"],"opts":["(A) game / (B) luck","(A) tradition / (B) trouble","(A) tradition / (B) luck","(A) meal / (B) luck","(A) tradition / (B) money"],"r":{"a":"3) (A) tradition / (B) luck","ev":"9~10번 문장","s":[[9,"This event is called Polterabend, a wedding tradition in Germany.","이 행사는 독일의 결혼식 전통인 ‘Polterabend’라고 불리는 것이었다."],[10,"Germans do this because of the old saying, “Shards bring luck.”","독일인들은 ‘조각들이 행운을 가져온다.’라는 옛말 때문에 이것을 한다."]],"w":"9번에서 Polterabend는 독일의 결혼식 전통(a wedding tradition)이라고 하고, 10번에서 옛말 'Shards bring luck(조각들이 행운을 가져온다)' 때문이라고 해요.","c":3},"h":"84ab48b7a8"},{"n":10,"t":"fill","q":"Breaking plates brings good luck, but the guest said not to break a [A] because it means seven years of [B] luck.","ko":"접시를 부수면 행운이 오지만, 그 손님은 [A]을/를 부수면 7년의 [B] 운을 의미하니 부수지 말라고 했다.","bank":["mirror","bad","plate","party","wedding","saying"],"bko":{"mirror":"거울","bad":"나쁜","plate":"접시","party":"파티","wedding":"결혼식","saying":"옛말"},"r":{"a":"[A] mirror, [B] bad","ev":"11~12번 문장","s":[[11,"“But don’t break a mirror,” the guest said.","“하지만 거울은 부수지 마세요.”라고 그 손님이 말했다."],[12,"“That means seven years of bad luck!”","“그것은 7년의 불행을 의미해요!”"]],"w":"11번에서 손님은 거울(mirror)은 부수지 말라고 하고, 12번에서 그것은 7년의 불행(bad luck)을 의미한다고 해요. 접시(plate)는 부숴도 행운이라 들어갈 수 없어요.","c":null},"h":"daf78e6d1d"}]},{"u":6,"id":"hk3-06-2","no":2,"ko":"발 없는 말이 천 리 간다","items":[{"n":1,"t":"tf","q":"Oreo’s Daily Twist campaign is an example of viral marketing.","ko":"오레오의 Daily Twist 캠페인은 바이럴 마케팅의 예시이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The Daily Twist campaign by Oreo cookies is a good example of this.","오레오 쿠키가 진행한 Daily Twist 캠페인은 이것의 좋은 예시이다."]],"w":"3번 문장에서 Daily Twist 캠페인은 바이럴 마케팅(this)의 좋은 예시(a good example)라고 해요. 글의 내용과 같아요.","c":"T"},"h":"9630ef54cf"},{"n":2,"t":"tf","q":"The Daily Twist images were posted in newspapers.","ko":"Daily Twist 사진들은 신문에 실렸다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"From June 25 to October 2, the images were posted on its social media pages.","6월 25일부터 10월 2일까지, 사진들이 그것의 소셜 미디어 페이지에 올려졌다."]],"w":"6번 문장에서 사진들은 오레오의 소셜 미디어 페이지에 올려졌다(posted on its social media pages)고 해요. 신문은 나오지 않아요.","c":"F"},"h":"69a8532f55"},{"n":3,"t":"tf","q":"The images got 26 million “likes” within three days.","ko":"사진들은 3일 안에 2,600만 개의 ‘좋아요’를 얻었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Within three days, the images got 26 million “likes.”","3일 안에, 사진들은 2,600만 개의 ‘좋아요’를 얻었다."]],"w":"10번 문장에서 3일 안에(Within three days) 사진들이 2,600만 개의 좋아요를 얻었다고 해요. 글의 내용과 같아요.","c":"T"},"h":"f23756fecd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The term viral refers to the way product information spreads quickly and widely.)","ko":"‘바이럴’이라는 용어는 제품 정보가 빠르게 널리 퍼지는 방식을 ( ). (밑줄 친 단어의 뜻은?)","opts":["~을 피하다","~을 금지하다","~을 나타내다, 가리키다","~을 기다리다"],"word":"refers to","r":{"a":"3) ~을 나타내다, 가리키다","ev":"2번 문장","s":[[2,"The term viral refers to the way product information spreads quickly and widely, like the way a virus infects people.","‘바이럴’이라는 용어는 바이러스가 사람들을 감염시키는 방식처럼, 제품 정보가 빠르게 널리 퍼지는 방식을 나타낸다."]],"w":"2번은 viral이라는 말의 뜻을 설명하는 문장이에요. 그 용어가 '정보가 빠르게 퍼지는 방식'을 가리킨다는 뜻이에요. refer to = ~을 나타내다, 가리키다.","c":3},"h":"a454258f99"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It revealed a fun image of an Oreo inspired by pop culture.)","ko":"그것은 대중문화에서 ( ) 오레오의 재미있는 사진을 공개했다. (밑줄 친 단어의 뜻은?)","opts":["지친","영감을 얻은","숨겨진","팔린"],"word":"inspired","r":{"a":"2) 영감을 얻은","ev":"5번, 7번 문장","s":[[5,"It revealed a fun image of an Oreo inspired by pop culture once a day for 100 days.","그것은 100일 동안 하루에 한 번 대중문화에서 영감을 얻은 오레오의 재미있는 사진을 공개했다."],[7,"For example, a “Batman Oreo” image was posted when The Dark Knight Rises movie came out.","예를 들어, <다크 나이트 라이즈> 영화가 나왔을 때 ‘배트맨 오레오’ 사진이 올려졌다."]],"w":"5번에서 오레오 사진은 대중문화에서 나온 것이고, 7번에서 영화가 나왔을 때 올린 배트맨 오레오가 그 예예요. inspired by ~는 '~에서 영감을 얻은'이에요.","c":2},"h":"235f93725c"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nThe Daily Twist campaign by Oreo cookies is a good example of this.","ko":"밑줄 친 this가 가리키는 것은?","sko":"오레오 쿠키가 진행한 Daily Twist 캠페인은 이것의 좋은 예시이다.","opts":["오레오 쿠키의 새 제품","소셜 미디어 페이지","100주년 기념일","제품 정보가 빠르게 널리 퍼지는 바이럴 마케팅"],"r":{"a":"4) 제품 정보가 빠르게 널리 퍼지는 바이럴 마케팅","ev":"2~3번 문장","s":[[2,"The term viral refers to the way product information spreads quickly and widely, like the way a virus infects people.","‘바이럴’이라는 용어는 바이러스가 사람들을 감염시키는 방식처럼, 제품 정보가 빠르게 널리 퍼지는 방식을 나타낸다."],[3,"The Daily Twist campaign by Oreo cookies is a good example of this.","오레오 쿠키가 진행한 Daily Twist 캠페인은 이것의 좋은 예시이다."]],"w":"3번의 this는 바로 앞 2번에서 설명한 viral, 즉 제품 정보가 바이러스처럼 빠르게 널리 퍼지는 방식(바이럴 마케팅)이에요. Daily Twist 캠페인이 그 예시예요.","c":4},"h":"bd15486fed"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Though Oreo didn’t ask people to share the event, the images were all over social media, spreading as fast as a virus!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오레오가 사람들에게 이벤트를 공유해달라고 요청하지 않았는데도, 사진들은 바이러스만큼 빠르게 퍼지면서, 소셜 미디어 곳곳에 있었다!","opts":["오레오가 이벤트를 공유해 달라고 요청하지 않았는데도, 사진들은 바이러스만큼 빠르게 퍼지며 소셜 미디어 곳곳에 있었다.","오레오가 이벤트를 공유해 달라고 요청했기 때문에, 사진들이 소셜 미디어 곳곳에 퍼졌다.","오레오가 요청한 대로, 사진들은 소셜 미디어에서 아주 천천히 퍼졌다.","사람들은 소셜 미디어에서 오레오 사진을 보고 싶어 하지 않았다."],"r":{"a":"1) 오레오가 이벤트를 공유해 달라고 요청하지 않았는데도, 사진들은 바이러스만큼 빠르게 퍼지며 소셜 미디어 곳곳에 있었다.","ev":"11번 문장","s":[[11,"Though Oreo didn’t ask people to share the event, the images were all over social media, spreading as fast as a virus!","오레오가 사람들에게 이벤트를 공유해달라고 요청하지 않았는데도, 사진들은 바이러스만큼 빠르게 퍼지면서, 소셜 미디어 곳곳에 있었다!"]],"w":"Though는 '~하는데도'라서 오레오가 요청하지 않았는데도 사진들이 퍼졌다는 뜻이에요. spreading as fast as a virus는 '바이러스만큼 빠르게 퍼지면서'예요.","c":1},"h":"bebe2fc4f4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["강남 스타일 오레오는 유명한 고양이 춤을 보여줬다.","배트맨 오레오 사진은 <다크 나이트 라이즈>가 만들어지기 전에 올려졌다.","오레오는 매일 똑같은 쿠키 사진을 올렸다.","배트맨 오레오 사진은 <다크 나이트 라이즈>가 나왔을 때 올려졌다."],"opts":["The Gangnam Style Oreo showed a famous cat dance.","A Batman Oreo image was posted before The Dark Knight Rises was made.","Oreo posted images of the same cookie every day.","A Batman Oreo image was posted when The Dark Knight Rises came out."],"r":{"a":"4) A Batman Oreo image was posted when The Dark Knight Rises came out.","ev":"7~8번 문장","s":[[7,"For example, a “Batman Oreo” image was posted when The Dark Knight Rises movie came out.","예를 들어, <다크 나이트 라이즈> 영화가 나왔을 때 ‘배트맨 오레오’ 사진이 올려졌다."],[8,"There was also a “Gangnam Style Oreo” that showed the famous horse dance.","또한 그 유명한 말춤을 보여준 ‘강남 스타일 오레오’도 있었다."]],"w":"7번에서 영화 <다크 나이트 라이즈>가 나왔을 때(when ~ came out) 배트맨 오레오 사진이 올려졌어요. 8번에서 강남 스타일 오레오는 고양이 춤이 아니라 말춤을 보여줬어요.","c":4},"h":"62cc00edeb"},{"n":9,"t":"sum","q":"Oreo posted a fun image inspired by (A) once a day for 100 days on its (B) pages.","ko":"오레오는 100일 동안 하루에 한 번 (A)에서 영감을 얻은 재미있는 사진을 자신의 (B) 페이지에 올렸다.","oko":["(A) 역사 / (B) 소셜 미디어","(A) 대중문화 / (B) 학교","(A) 스포츠 / (B) 신문","(A) 과학 / (B) 잡지","(A) 대중문화 / (B) 소셜 미디어"],"opts":["(A) history / (B) social media","(A) pop culture / (B) school","(A) sports / (B) newspaper","(A) science / (B) magazine","(A) pop culture / (B) social media"],"r":{"a":"5) (A) pop culture / (B) social media","ev":"5~6번 문장","s":[[5,"It revealed a fun image of an Oreo inspired by pop culture once a day for 100 days.","그것은 100일 동안 하루에 한 번 대중문화에서 영감을 얻은 오레오의 재미있는 사진을 공개했다."],[6,"From June 25 to October 2, the images were posted on its social media pages.","6월 25일부터 10월 2일까지, 사진들이 그것의 소셜 미디어 페이지에 올려졌다."]],"w":"5번에서 대중문화(pop culture)에서 영감을 얻은 사진을 하루에 한 번 100일 동안 공개했고, 6번에서 그 사진들을 소셜 미디어(social media) 페이지에 올렸다고 해요.","c":5},"h":"403bc59ef7"},{"n":10,"t":"fill","q":"The Daily Twist campaign was a huge [A], and within three days the images got 26 million [B].","ko":"Daily Twist 캠페인은 엄청난 [A]이었고, 3일 안에 사진들은 2,600만 개의 [B]을/를 얻었다.","bank":["success","likes","virus","anniversary","culture","honor"],"bko":{"success":"성공","likes":"좋아요","virus":"바이러스","culture":"문화","honor":"영광","anniversary":"기념일"},"r":{"a":"[A] success, [B] likes","ev":"9~10번 문장","s":[[9,"The campaign was a huge success.","캠페인은 대성공이었다."],[10,"Within three days, the images got 26 million “likes.”","3일 안에, 사진들은 2,600만 개의 ‘좋아요’를 얻었다."]],"w":"9번에서 캠페인은 대성공(a huge success)이었고, 10번에서 3일 안에 2,600만 개의 좋아요(likes)를 얻었다고 해요.","c":null},"h":"6bf2dd1ef5"}]},{"u":6,"id":"hk3-06-3","no":3,"ko":"땀은 모든 걸 알고 있다","items":[{"n":1,"t":"tf","q":"A sweat sensor is small, thin, and flexible.","ko":"땀 센서는 작고, 얇고, 탄력 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"A sweat sensor is a patch that is small, thin, and flexible.","땀 센서는 작고, 얇고, 탄력 있는 패치이다."]],"w":"4번 문장에서 땀 센서는 작고, 얇고, 탄력 있는(small, thin, and flexible) 패치라고 해요. 글의 내용과 같아요.","c":"T"},"h":"a3059b4004"},{"n":2,"t":"tf","q":"You have to put a sweat sensor inside your body.","ko":"땀 센서는 몸속에 넣어야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"You stick it on your body, and it measures specific chemicals in your sweat.","그것을 당신의 몸에 붙이면, 땀속의 특정 화학 성분들을 측정한다."]],"w":"5번 문장에서 센서를 몸 위에 붙이면(stick it on your body) 된다고 해요. 몸속에 넣는다는 말은 없어요.","c":"F"},"h":"4cf372ef99"},{"n":3,"t":"tf","q":"A sweat sensor can help people predict heart attacks by checking potassium levels.","ko":"땀 센서는 칼륨 수치를 확인해서 사람들이 심장마비를 예측하도록 도울 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"It can even help people predict heart attacks by checking the potassium levels in their sweat.","그것은 심지어 땀 속의 칼륨 수치를 확인함으로써 사람들이 심장마비를 예측하도록 도울 수도 있다."]],"w":"9번 문장에서 땀 속의 칼륨 수치를 확인함으로써 심장마비를 예측하도록 도울 수 있다고 해요. 글의 내용과 같아요.","c":"T"},"h":"59f33531b7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Most people hate sweating because it makes them smell bad and feel sticky.)","ko":"대부분의 사람은 땀 흘리는 것이 안 좋은 냄새가 나게 하고 ( ) 느끼게 만들기 때문에 싫어한다. (밑줄 친 단어의 뜻은?)","opts":["가벼운","끈적거리는","시원한","졸린"],"word":"sticky","r":{"a":"2) 끈적거리는","ev":"1번 문장","s":[[1,"Most people hate sweating because it makes them smell bad and feel sticky.","대부분의 사람은 땀 흘리는 것이 안 좋은 냄새가 나게 하고 끈적거림을 느끼게 만들기 때문에 싫어한다."]],"w":"1번은 사람들이 땀을 싫어하는 이유예요. 냄새와 함께 나오는 나쁜 느낌이니 시원하거나 가벼운 것이 아니에요. sticky = 끈적거리는.","c":2},"h":"93b5f94160"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (it measures specific chemicals in your sweat)","ko":"그것은 땀 속의 특정 화학 성분들을 ( ). (밑줄 친 단어의 뜻은?)","opts":["숨긴다","던진다","측정한다","판매한다"],"word":"measures","r":{"a":"3) 측정한다","ev":"5~6번 문장","s":[[5,"You stick it on your body, and it measures specific chemicals in your sweat.","그것을 당신의 몸에 붙이면, 땀속의 특정 화학 성분들을 측정한다."],[6,"For example, it can show glucose levels.","예를 들어, 그것은 포도당 수치를 보여줄 수 있다."]],"w":"5번에서 센서를 몸에 붙이면 땀 속 화학 성분을 알아내고, 6번에서 포도당 수치를 보여준다고 해요. 수치를 알아내는 일이니 measure = 측정하다예요.","c":3},"h":"6d43805923"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWithout it, they have to get multiple blood tests throughout the day just to check their glucose levels.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그것이 없다면, 그들은 단지 포도당 수치를 확인하기 위해 하루 종일 다수의 혈액 검사를 받아야 한다.","opts":["땀 센서들","혈액 검사들","당뇨가 있는 사람들","의사들"],"r":{"a":"3) 당뇨가 있는 사람들","ev":"7~8번 문장","s":[[7,"This is particularly useful to those with diabetes.","이것은 당뇨가 있는 사람들에게 특히 유용하다."],[8,"Without it, they have to get multiple blood tests throughout the day just to check their glucose levels.","그것이 없다면, 그들은 단지 포도당 수치를 확인하기 위해 하루 종일 다수의 혈액 검사를 받아야 한다."]],"w":"8번은 센서가 없다면 어떻게 되는지 말해요. 혈액 검사를 하루 종일 받아야 하는 사람은 7번의 당뇨가 있는 사람들(those with diabetes)이에요.","c":3},"h":"c49b5e5a88"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Sweat sensors are able to reduce the time and effort required to check certain health conditions.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"땀 센서는 특정 건강 상태를 확인하기 위해 필요한 시간과 수고를 줄일 수 있다.","opts":["땀 센서는 건강 상태를 확인하는 데 더 많은 시간과 수고가 들게 한다.","땀 센서를 만들려면 많은 시간과 수고가 필요하다.","땀 센서는 특정한 건강 상태만 약하게 만들 수 있다.","땀 센서는 특정 건강 상태를 확인하는 데 필요한 시간과 수고를 줄일 수 있다."],"r":{"a":"4) 땀 센서는 특정 건강 상태를 확인하는 데 필요한 시간과 수고를 줄일 수 있다.","ev":"10번 문장","s":[[10,"Sweat sensors are able to reduce the time and effort required to check certain health conditions.","땀 센서는 특정 건강 상태를 확인하기 위해 필요한 시간과 수고를 줄일 수 있다."]],"w":"reduce는 '줄이다'이고, required to check ~는 앞의 the time and effort를 꾸며서 '~를 확인하는 데 필요한 시간과 수고'가 돼요. 센서가 그것을 줄여 준다는 뜻이에요.","c":4},"h":"cc55533959"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["땀 센서는 땀 속 화학 성분을 측정해서 포도당 수치를 보여줄 수 있다.","땀 센서는 집에 두어야 하는 큰 기계이다.","땀 센서는 의사가 몸속에 넣는다.","땀 센서는 포도당 수치를 보여줄 수 없다."],"opts":["A sweat sensor can show glucose levels by measuring chemicals in sweat.","A sweat sensor is a big machine that must be kept at home.","A sweat sensor is put inside the body by a doctor.","A sweat sensor cannot show glucose levels."],"r":{"a":"1) A sweat sensor can show glucose levels by measuring chemicals in sweat.","ev":"5~6번 문장","s":[[5,"You stick it on your body, and it measures specific chemicals in your sweat.","그것을 당신의 몸에 붙이면, 땀속의 특정 화학 성분들을 측정한다."],[6,"For example, it can show glucose levels.","예를 들어, 그것은 포도당 수치를 보여줄 수 있다."]],"w":"5번에서 센서는 땀 속 화학 성분을 측정하고, 6번에서 그 예로 포도당 수치를 보여줄 수 있다고 해요. 센서는 작은 패치이고(4번) 몸에 붙이는 것이에요(5번).","c":1},"h":"1ea46affd9"},{"n":9,"t":"sum","q":"A sweat sensor is (A) to people with diabetes because, without it, they would need many (B) tests during the day.","ko":"땀 센서는 당뇨가 있는 사람들에게 (A)한데, 그것이 없으면 그들은 하루 동안 많은 (B) 검사를 받아야 하기 때문이다.","oko":["(A) 해로운 / (B) 혈액","(A) 유용한 / (B) 눈","(A) 쓸모없는 / (B) 혈액","(A) 해가 없는 / (B) 수면","(A) 유용한 / (B) 혈액"],"opts":["(A) harmful / (B) blood","(A) useful / (B) eye","(A) useless / (B) blood","(A) harmless / (B) sleep","(A) useful / (B) blood"],"r":{"a":"5) (A) useful / (B) blood","ev":"7~8번 문장","s":[[7,"This is particularly useful to those with diabetes.","이것은 당뇨가 있는 사람들에게 특히 유용하다."],[8,"Without it, they have to get multiple blood tests throughout the day just to check their glucose levels.","그것이 없다면, 그들은 단지 포도당 수치를 확인하기 위해 하루 종일 다수의 혈액 검사를 받아야 한다."]],"w":"7번에서 센서는 당뇨가 있는 사람들에게 특히 유용하다(useful)고 하고, 8번에서 센서가 없으면 하루 종일 다수의 혈액(blood) 검사를 받아야 한다고 해요.","c":5},"h":"5caf41a008"},{"n":10,"t":"fill","q":"Sweat sensors reduce the time and [A] needed to check health conditions, and they make it possible to monitor the body in real [B].","ko":"땀 센서는 건강 상태를 확인하는 데 필요한 시간과 [A]을/를 줄이고, 몸을 실시간으로 확인할 수 있게 한다. (real [B])","bank":["effort","time","sweat","patch","chemical","diabetes"],"bko":{"effort":"수고","time":"시간","sweat":"땀","patch":"패치","chemical":"화학 성분","diabetes":"당뇨"},"r":{"a":"[A] effort, [B] time","ev":"10~11번 문장","s":[[10,"Sweat sensors are able to reduce the time and effort required to check certain health conditions.","땀 센서는 특정 건강 상태를 확인하기 위해 필요한 시간과 수고를 줄일 수 있다."],[11,"They can even make it possible to monitor the physical conditions in real time.","그것은 심지어 몸 상태를 실시간으로 확인하는 것을 가능하게 만들 수도 있다."]],"w":"10번에서 센서는 시간과 수고(effort)를 줄일 수 있고, 11번에서 몸 상태를 실시간(in real time)으로 확인할 수 있게 한다고 해요.","c":null},"h":"9149927346"}]},{"u":6,"id":"hk3-06-4","no":4,"ko":"이거 완전 내 얘기잖아~","items":[{"n":1,"t":"tf","q":"In the test, you check a box if the statement applies to you.","ko":"검사에서 그 말이 자신에게 해당하면 칸에 표시한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Check the box if the statement applies to you.","만약 그 말이 당신에게 해당한다면 칸에 표시를 해라."]],"w":"2번 문장에서 그 말이 당신에게 해당한다면(if the statement applies to you) 칸에 표시를 하라고 해요. 글의 내용과 같아요.","c":"T"},"h":"edba35f8b2"},{"n":2,"t":"tf","q":"The Barnum Effect happens because the descriptions are really very specific.","ko":"바넘 효과는 묘사가 정말로 매우 구체적이기 때문에 발생한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"This psychological effect happens because the descriptions sound specific, but only on the surface.","이러한 심리적인 효과는 그 묘사가 구체적이게 들리기 때문에 발생하지만, 그것은 겉보기에만 그렇다."]],"w":"10번 문장에서 묘사가 구체적이게 들리기 때문에 발생하지만 겉보기에만(only on the surface) 그렇다고 해요. 정말 구체적인 것은 아니에요.","c":"F"},"h":"b93736177f"},{"n":3,"t":"tf","q":"Horoscopes and fortune cookies also use the Barnum Effect.","ko":"점성술과 포춘 쿠키도 바넘 효과를 이용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"In fact, personality tests, horoscopes, and fortune cookies all use the Barnum Effect.","실제로, 성격 검사, 점성술, 그리고 포춘 쿠키 모두 바넘 효과를 이용한다."]],"w":"12번 문장에서 성격 검사, 점성술, 포춘 쿠키 모두 바넘 효과를 이용한다고 해요. 글의 내용과 같아요.","c":"T"},"h":"2c45ca0642"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You sometimes doubt if you have made the right decision.)","ko":"당신은 가끔 옳은 결정을 했는지 ( ). (밑줄 친 단어의 뜻은?)","opts":["확신하다","기억하다","의심하다","반복하다"],"word":"doubt","r":{"a":"3) 의심하다","ev":"4번 문장","s":[[4,"You sometimes doubt if you have made the right decision.","당신은 가끔 옳은 결정을 했는지 의심한다."]],"w":"4번은 '옳은 결정을 했는지(if ~)' 하는 말이에요. 가끔 그런지 아닌지 확신이 없어서 마음이 흔들린다는 뜻이에요. doubt = 의심하다.","c":3},"h":"a53a3e15e7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If we take a closer look, we discover they are so vague and general that they can apply to everyone.)","ko":"더 자세히 살펴보면, 우리는 그것들이 너무 ( ) 일반적이어서 누구에게나 해당할 수 있다는 것을 발견한다. (밑줄 친 단어의 뜻은?)","opts":["정확한","모호한","재미있는","위험한"],"word":"vague","r":{"a":"2) 모호한","ev":"10~11번 문장","s":[[10,"This psychological effect happens because the descriptions sound specific, but only on the surface.","이러한 심리적인 효과는 그 묘사가 구체적이게 들리기 때문에 발생하지만, 그것은 겉보기에만 그렇다."],[11,"If we take a closer look, we discover they are so vague and general that they can apply to everyone.","만약 더 자세히 살펴보면, 우리는 그것들이 너무모호하고 일반적이어서 누구에게나 해당할 수 있다는 것을 발견한다."]],"w":"10번에서 겉보기에만 구체적이라고 했으니 사실은 구체적이지 않다는 뜻이에요. 그래서 누구에게나 해당할 수 있다고 해요. vague = 모호한.","c":2},"h":"9b06506a38"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey will probably all say the statements describe them perfectly!","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 아마 모두 그 말이 그들을 완벽하게 묘사한다고 말할 것이다!","opts":["성격 검사들","그 말들","바넘 효과 연구자들","당신의 친구들"],"r":{"a":"4) 당신의 친구들","ev":"13~15번 문장","s":[[13,"Try it out on your friends.","당신의 친구들에게 그것을 시도해보아라."],[14,"Show the statements to each friend individually.","각 친구에게 개별적으로 그 말을보여줘라."],[15,"They will probably all say the statements describe them perfectly!","그들은 아마 모두 그 말이 그들을 완벽하게 묘사한다고 말할 것이다!"]],"w":"13~14번에서 당신의 친구들에게 그 말을 보여주라고 했고, 15번에서 그들이 아마 모두 그 말이 자신을 완벽하게 묘사한다고 말할 거라고 해요. 말하는 사람은 친구들이에요.","c":4},"h":"106b600365"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It refers to our tendency to believe that personality descriptions are accurate and apply specifically to us.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 성격 묘사가 정확하고 특히 우리에게 해당한다고 믿는 성향을 말한다.","opts":["그것은 성격 묘사가 정확하고 특히 우리에게 해당한다고 믿는 우리의 성향을 말한다.","그것은 성격 묘사가 틀렸다고 생각하는 우리의 성향을 말한다.","그것은 성격 묘사가 다른 사람에게만 해당한다고 믿는 성향을 말한다.","그것은 성격 묘사를 믿지 않으려고 노력하는 성향을 말한다."],"r":{"a":"1) 그것은 성격 묘사가 정확하고 특히 우리에게 해당한다고 믿는 우리의 성향을 말한다.","ev":"9번 문장","s":[[9,"It refers to our tendency to believe that personality descriptions are accurate and apply specifically to us.","그것은 성격 묘사가 정확하고 특히 우리에게 해당한다고 믿는 성향을 말한다."]],"w":"to believe ~는 our tendency를 꾸며서 '~을 믿는 성향'이에요. 믿는 내용은 성격 묘사가 정확하고(accurate) 특히 우리에게 해당한다는 것이에요.","c":1},"h":"4bc62ceb71"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["칸에 하나도 표시하지 않아도 바넘 효과를 경험한 것이다.","바넘 효과는 의학 검사의 결과이다.","그 말들은 구체적이게 들리지만, 자세히 보면 누구에게나 해당할 수 있다.","사람들은 성격 묘사를 절대 믿지 않는다."],"opts":["If you checked no boxes, you experienced the Barnum Effect.","The Barnum Effect is a result of a medical test.","The statements sound specific, but they can apply to everyone if we look closely.","People never believe personality descriptions."],"r":{"a":"3) The statements sound specific, but they can apply to everyone if we look closely.","ev":"10~11번 문장","s":[[10,"This psychological effect happens because the descriptions sound specific, but only on the surface.","이러한 심리적인 효과는 그 묘사가 구체적이게 들리기 때문에 발생하지만, 그것은 겉보기에만 그렇다."],[11,"If we take a closer look, we discover they are so vague and general that they can apply to everyone.","만약 더 자세히 살펴보면, 우리는 그것들이 너무모호하고 일반적이어서 누구에게나 해당할 수 있다는 것을 발견한다."]],"w":"10번에서 묘사는 구체적이게 들리지만 겉보기에만 그렇고, 11번에서 자세히 보면 너무 모호하고 일반적이라 누구에게나 해당할 수 있다고 해요. 바넘 효과를 경험하는 것은 네 개 모두에 표시했을 때예요(8번).","c":3},"h":"b0686e7592"},{"n":9,"t":"sum","q":"If you checked all four statements, you experienced the Barnum Effect, our tendency to believe that personality (A) are (B) and apply to us.","ko":"네 가지 말에 모두 표시했다면 바넘 효과를 경험한 것이고, 이는 성격 (A)이/가 (B)하고 우리에게 해당한다고 믿는 성향이다.","oko":["(A) 묘사 / (B) 틀린","(A) 검사 / (B) 모호한","(A) 친구들 / (B) 정확한","(A) 칸들 / (B) 일반적인","(A) 묘사 / (B) 정확한"],"opts":["(A) descriptions / (B) wrong","(A) tests / (B) vague","(A) friends / (B) accurate","(A) boxes / (B) general","(A) descriptions / (B) accurate"],"r":{"a":"5) (A) descriptions / (B) accurate","ev":"8~9번 문장","s":[[8,"If you checked all four of them, you’ve just experienced the Barnum Effect.","만약 당신이 그것들 네 개 모두에 표시했다면, 당신은 방금 바넘 효과를 경험하였다."],[9,"It refers to our tendency to believe that personality descriptions are accurate and apply specifically to us.","그것은 성격 묘사가 정확하고 특히 우리에게 해당한다고 믿는 성향을 말한다."]],"w":"8번에서 네 가지 모두 표시하면 바넘 효과를 경험한 것이고, 9번에서 바넘 효과는 성격 묘사(descriptions)가 정확하고(accurate) 우리에게 해당한다고 믿는 성향이라고 해요.","c":5},"h":"19f96da0b9"},{"n":10,"t":"fill","q":"Personality descriptions are so [A] and general that they can apply to [B].","ko":"성격 묘사는 너무 [A] 일반적이어서 [B]에게 해당할 수 있다.","bank":["vague","everyone","accurate","specific","boxes","cookies"],"bko":{"vague":"모호한","everyone":"모든 사람","accurate":"정확한","specific":"구체적인","boxes":"칸들","cookies":"쿠키들"},"r":{"a":"[A] vague, [B] everyone","ev":"11번 문장","s":[[11,"If we take a closer look, we discover they are so vague and general that they can apply to everyone.","만약 더 자세히 살펴보면, 우리는 그것들이 너무모호하고 일반적이어서 누구에게나 해당할 수 있다는 것을 발견한다."]],"w":"11번에서 자세히 살펴보면 성격 묘사는 너무 모호하고(vague) 일반적이어서 누구에게나(everyone) 해당할 수 있다고 해요. accurate·specific은 겉보기에만 그렇게 들리는 말이에요.","c":null},"h":"33e25d5abb"}]},{"u":7,"id":"hk3-07-1","no":1,"ko":"고생 끝에 한정판이 온다","items":[{"n":1,"t":"tf","q":"Some people even put up a tent in front of the store while waiting.","ko":"일부 사람들은 기다리는 동안 심지어 상점 앞에 텐트를 치기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Many people wait in line for hours, and some even put up a tent in front of the store.","많은 사람들이 몇 시간 동안 줄을 서서 기다리고, 일부는 심지어 상점 앞에 텐트를 치기도 한다."]],"w":"2번 문장에 some even put up a tent in front of the store(일부는 심지어 상점 앞에 텐트를 친다)가 그대로 나와요.","c":"T"},"h":"634c144e1e"},{"n":2,"t":"tf","q":"Most of the people waiting in line complain about the long wait.","ko":"줄 서서 기다리는 대부분의 사람들은 오랜 기다림에 대해 불평한다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Interestingly, none of these people complain.","흥미롭게도, 이 사람들 중 아무도 불평하지 않는다."]],"w":"3번 문장에서 none of these people complain(이 사람들 중 아무도 불평하지 않는다)이라고 해요. 대부분이 불평한다는 말은 반대예요.","c":"F"},"h":"a3587a9b65"},{"n":3,"t":"tf","q":"Limited-edition products are very common, so everyone can buy them.","ko":"한정판 제품은 매우 흔해서 모두가 살 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"These are very rare, and not everyone can buy them.","이것들은 매우 희귀하고, 모두가 그것들을 살 수 있는 것은 아니다."]],"w":"7번 문장에서 한정판은 very rare(매우 희귀)하고 not everyone can buy them(모두가 살 수 있는 것은 아니다)이라고 해요. 흔하다는 말은 반대예요.","c":"F"},"h":"a1a455fbae"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (What makes them willing to spend such a long time waiting?)","ko":"무엇이 그들이 그렇게 오랜 시간을 ( ) 기다리는 데 보내도록 만들까?","opts":["꺼리는","두려워하는","기꺼이 ~하는","어쩔 수 없이 ~하는"],"word":"willing","r":{"a":"3) 기꺼이 ~하는","ev":"3~4번 문장","s":[[3,"Interestingly, none of these people complain.","흥미롭게도, 이 사람들 중 아무도 불평하지 않는다."],[4,"What makes them willing to spend such a long time waiting?","무엇이 그들이 그렇게 오랜 시간을 기꺼이 기다리는 데 보내도록 만들까?"]],"w":"3번에서 사람들은 불평하지 않았어요. 4번은 '무엇이 그들을 기꺼이 오래 기다리게 만들까?'라는 질문이에요. be willing to = 기꺼이 ~하다.","c":3},"h":"a178505bd6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Because people feel more satisfied once they get them, they don’t mind waiting for these items.)","ko":"일단 사람들은 그것들을 갖게 되면 더 만족을 느끼기 때문에, 그들은 이러한 물건을 위해 기다리는 것을 ( ) 않는다.","opts":["꺼리다","즐기다","잊다","포기하다"],"word":"mind","r":{"a":"1) 꺼리다","ev":"8번 문장","s":[[8,"Because people feel more satisfied once they get them, they don’t mind waiting for these items.","일단 사람들은 그것들을 갖게 되면 더 만족을 느끼기 때문에, 그들은 이러한 물건을 위해 기다리는 것을 꺼리지 않는다."]],"w":"갖게 되면 더 만족해서 기다리는 걸 괜찮게 여겨요. mind(꺼리다)가 don't와 함께 쓰여 '꺼리지 않는다'가 돼요.","c":1},"h":"c9a9314639"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhat makes them willing to spend such a long time waiting?","ko":"밑줄 친 them가 가리키는 것은?","sko":"무엇이 그들이 그렇게 오랜 시간을 기꺼이 기다리는 데 보내도록 만들까?","opts":["한정판 제품들","줄을 서서 기다리는 사람들","브랜드와 예술가들","상점 직원들"],"r":{"a":"2) 줄을 서서 기다리는 사람들","ev":"3~4번 문장","s":[[3,"Interestingly, none of these people complain.","흥미롭게도, 이 사람들 중 아무도 불평하지 않는다."],[4,"What makes them willing to spend such a long time waiting?","무엇이 그들이 그렇게 오랜 시간을 기꺼이 기다리는 데 보내도록 만들까?"]],"w":"4번의 them은 기꺼이 오래 기다리는 사람들이에요. 바로 앞 3번 문장의 these people(줄 서서 불평하지 않는 사람들)이에요.","c":2},"h":"b453337287"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There are some products you can only buy for a short time or in limited numbers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 짧은 시간 동안만 또는 한정된 수량으로만 살 수 있는 몇몇 제품들이 있다.","opts":["어떤 제품들은 오래 기다리면 누구나 살 수 있다.","모든 제품은 원하는 때에 원하는 만큼 살 수 있다.","어떤 제품들은 값이 싸서 짧은 시간 동안만 팔린다.","어떤 제품들은 짧은 기간 동안만, 또는 한정된 수량으로만 살 수 있다."],"r":{"a":"4) 어떤 제품들은 짧은 기간 동안만, 또는 한정된 수량으로만 살 수 있다.","ev":"5번 문장","s":[[5,"There are some products you can only buy for a short time or in limited numbers.","당신이 짧은 시간 동안만 또는 한정된 수량으로만 살 수 있는 몇몇 제품들이 있다."]],"w":"you can only buy for a short time or in limited numbers는 짧은 시간 동안만, 또는 한정된 수량으로만 살 수 있다는 뜻이에요. 값이 싸다는 내용은 없어요.","c":4},"h":"83959c4370"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["줄에 선 사람들은 공통점이 하나도 없어서 절대 대화하지 않는다.","한정판 제품은 특별하지 않아서 사람들이 기다리지 않는다.","줄에 선 사람들은 공통의 관심사를 공유하기 때문에 서로 대화할 수 있다.","줄을 서서 기다리면 누구나 한정판 제품을 살 수 있다."],"opts":["The people in line have nothing in common, so they never talk.","Limited-edition products are not special, so people don't wait for them.","People in line may talk with each other because they share a common interest.","Everyone can buy limited-edition products if they wait in line."],"r":{"a":"3) People in line may talk with each other because they share a common interest.","ev":"7번, 10번 문장","s":[[7,"These are very rare, and not everyone can buy them.","이것들은 매우 희귀하고, 모두가 그것들을 살 수 있는 것은 아니다."],[10,"You and everyone else in the line share a common interest, so you can have a nice chat with them.","당신과 줄에 있는 다른 모든 사람들은 공통의 관심사를 가지고 있어서, 그들과 좋은 대화를 할 수 있다."]],"w":"10번 문장에서 줄에 선 사람들은 공통의 관심사가 있어서 좋은 대화를 할 수 있다고 해요. 7번에서 모두가 살 수 있는 것은 아니라고 했으니 ④는 틀려요.","c":3},"h":"e5704fcf0f"},{"n":9,"t":"sum","q":"People wait in line for limited-edition items because the items are (A), and they feel (B) once they get them.","ko":"사람들은 한정판 물건이 (A)하기 때문에 줄을 서서 기다리고, 일단 그것을 갖게 되면 (B)을 느낀다.","oko":["(A) 흔한 / (B) 만족한","(A) 값싼 / (B) 피곤한","(A) 희귀한 / (B) 화난","(A) 흔한 / (B) 지루한","(A) 희귀한 / (B) 만족한"],"opts":["(A) common / (B) satisfied","(A) cheap / (B) tired","(A) rare / (B) angry","(A) common / (B) bored","(A) rare / (B) satisfied"],"r":{"a":"5) (A) rare / (B) satisfied","ev":"7~8번 문장","s":[[7,"These are very rare, and not everyone can buy them.","이것들은 매우 희귀하고, 모두가 그것들을 살 수 있는 것은 아니다."],[8,"Because people feel more satisfied once they get them, they don’t mind waiting for these items.","일단 사람들은 그것들을 갖게 되면 더 만족을 느끼기 때문에, 그들은 이러한 물건을 위해 기다리는 것을 꺼리지 않는다."]],"w":"7번 문장에서 한정판은 very rare(매우 희귀)하고, 8번 문장에서 갖게 되면 more satisfied(더 만족)를 느낀다고 해요.","c":5},"h":"3fce524aad"},{"n":10,"t":"fill","q":"Waiting in line may not be so bad, because you can have a nice [A] with others who share a common [B].","ko":"줄을 서서 기다리는 것은 그렇게 나쁘지 않을 수 있는데, 공통의 [B]을 공유하는 다른 사람들과 좋은 [A]를 할 수 있기 때문이다.","bank":["chat","interest","complain","rare","satisfied","tent"],"bko":{"chat":"대화","interest":"관심사","complain":"불평하다","rare":"희귀한","satisfied":"만족한","tent":"텐트"},"r":{"a":"[A] chat, [B] interest","ev":"9~10번 문장","s":[[9,"Besides, waiting in line may not be so bad.","게다가, 줄을 서서 기다리는 것은 그렇게 나쁘지 않을 수도 있다."],[10,"You and everyone else in the line share a common interest, so you can have a nice chat with them.","당신과 줄에 있는 다른 모든 사람들은 공통의 관심사를 가지고 있어서, 그들과 좋은 대화를 할 수 있다."]],"w":"9번 문장에서 기다리는 것도 나쁘지 않다고 하고, 10번 문장에서 공통의 관심사(common interest) 덕분에 좋은 대화(nice chat)를 할 수 있다고 해요.","c":null},"h":"fddaca8757"}]},{"u":7,"id":"hk3-07-2","no":2,"ko":"다시 만난 ‘색’다른 세계","items":[{"n":1,"t":"tf","q":"The gift from William’s wife looked like a pair of ordinary sunglasses.","ko":"William의 부인이 준 선물은 한 쌍의 평범한 선글라스처럼 보였다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The gift looked like a pair of ordinary sunglasses.","그 선물은 한 쌍의 평범한 선글라스처럼 보였다."]],"w":"4번 문장에 The gift looked like a pair of ordinary sunglasses(그 선물은 평범한 선글라스처럼 보였다)가 있어요.","c":"T"},"h":"8ea4d7a60c"},{"n":2,"t":"tf","q":"William had always been able to see colors before he put on the glasses.","ko":"William은 그 안경을 쓰기 전에도 항상 색을 볼 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"It was the first time that he was able to see color because William was color-blind.","William은 색맹이었기 때문에 그가 색을 볼 수 있는 것은 처음이었다."],[7,"Until that moment, his life had always been in black and white.","그 순간까지, 그의 삶은 항상 흑백으로 되어 있었다."]],"w":"6번 문장에서 안경을 쓴 때가 색을 볼 수 있었던 첫 번째(the first time)였고, 7번 문장에서 그때까지 삶이 항상 흑백이었다고 해요.","c":"F"},"h":"d57bf7b751"},{"n":3,"t":"tf","q":"The special glasses work for all types of color blindness.","ko":"그 특수 안경은 모든 유형의 색맹에 효과가 있다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"For now, these glasses don’t work for all types of color blindness.","현재로서는, 이 안경이 모든 유형의 색맹에 효과가 있지는 않다."]],"w":"12번 문장에서 지금은 이 안경이 all types of color blindness(모든 유형의 색맹)에 효과가 있지는 않다고 해요.","c":"F"},"h":"131ef76bd2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The gift looked like a pair of ordinary sunglasses.)","ko":"그 선물은 한 쌍의 ( ) 선글라스처럼 보였다.","opts":["값비싼","화려한","평범한","낡은"],"word":"ordinary","r":{"a":"3) 평범한","ev":"4~5번 문장","s":[[4,"The gift looked like a pair of ordinary sunglasses.","그 선물은 한 쌍의 평범한 선글라스처럼 보였다."],[5,"William put them on, and all of a sudden, everything around him looked different!","William은 그것을 썼고, 갑자기 주위의 모든 것이 다르게 보였다!"]],"w":"4번에서 겉모습은 보통 선글라스 같았는데, 5번에서 쓰자 갑자기 모든 게 다르게 보였어요. 겉보기엔 특별하지 않았다는 뜻이라 ordinary는 '평범한'이에요.","c":3},"h":"01020c75ed"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This makes colors look much richer and more vivid.)","ko":"이것은 색이 훨씬 더 풍부하고 더 ( ) 보이도록 만든다.","opts":["희미한","차가운","단단한","선명한"],"word":"vivid","r":{"a":"4) 선명한","ev":"9~10번 문장","s":[[9,"The lenses are coated with a material that exaggerates certain wavelengths of light.","그 렌즈에는 빛의 특정 파장을 과장하는 물질이 칠해져 있다."],[10,"This makes colors look much richer and more vivid.","이것은 색이 훨씬 더 풍부하고 선명하게 보이도록 만든다."]],"w":"렌즈의 물질이 빛의 파장을 과장해서 색이 더 풍부하고 뚜렷하게 보여요. 그래서 vivid는 '선명한'이에요.","c":4},"h":"7800b512bd"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWilliam put them on, and all of a sudden, everything around him looked different!","ko":"밑줄 친 them가 가리키는 것은?","sko":"William은 그것을 썼고, 갑자기 주위의 모든 것이 다르게 보였다!","opts":["William의 가족","한 쌍의 선글라스","여러 가지 색깔","주위의 사물들"],"r":{"a":"2) 한 쌍의 선글라스","ev":"4~5번 문장","s":[[4,"The gift looked like a pair of ordinary sunglasses.","그 선물은 한 쌍의 평범한 선글라스처럼 보였다."],[5,"William put them on, and all of a sudden, everything around him looked different!","William은 그것을 썼고, 갑자기 주위의 모든 것이 다르게 보였다!"]],"w":"put them on은 '그것들을 쓰다'예요. 쓸 수 있는 것은 4번 문장의 a pair of ordinary sunglasses(선글라스)예요.","c":2},"h":"a595fd95f9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Until that moment, his life had always been in black and white.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 순간까지, 그의 삶은 항상 흑백으로 되어 있었다.","opts":["그 순간까지 그의 삶은 줄곧 색이 없는 흑백이었다.","그 순간부터 그의 삶은 흑백이 되었다.","그는 그 순간까지 흑백 영화를 자주 보았다.","그의 삶은 그 순간에 처음으로 색을 잃었다."],"r":{"a":"1) 그 순간까지 그의 삶은 줄곧 색이 없는 흑백이었다.","ev":"7번 문장","s":[[7,"Until that moment, his life had always been in black and white.","그 순간까지, 그의 삶은 항상 흑백으로 되어 있었다."]],"w":"Until that moment는 '그 순간까지'이고 had always been은 줄곧 계속된 상태예요. 그래서 삶은 그때까지 항상 흑백이었어요. 색을 잃은 것은 아니에요.","c":1},"h":"00522efeb5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 특수 안경은 모든 색을 잘 볼 수 있는 사람들을 위해 만들어졌다.","William은 그 안경을 친구에게 선물로 받았다.","그 렌즈에는 빛의 특정 파장을 과장하는 물질이 칠해져 있다.","그 안경은 색이 이전보다 덜 선명하게 보이게 한다."],"opts":["The special glasses are made for people who can see all colors well.","William got the glasses as a gift from his friend.","The lenses are coated with a material that exaggerates certain wavelengths of light.","The glasses make colors look less vivid than before."],"r":{"a":"3) The lenses are coated with a material that exaggerates certain wavelengths of light.","ev":"8~10번 문장","s":[[8,"What changed his world was a pair of special glasses made for color-blind people.","그의 세상을 바꾼 것은 색맹인 사람들을 위해 만들어진 한 쌍의 특수 안경이었다."],[9,"The lenses are coated with a material that exaggerates certain wavelengths of light.","그 렌즈에는 빛의 특정 파장을 과장하는 물질이 칠해져 있다."],[10,"This makes colors look much richer and more vivid.","이것은 색이 훨씬 더 풍부하고 선명하게 보이도록 만든다."]],"w":"9번 문장에서 렌즈에 빛의 파장을 과장하는 물질이 칠해져 있다고 해요. 8번에서 안경은 색맹인 사람들을 위한 것이고, 선물은 부인에게 받았고(2번), 10번에서 색이 더 선명해진다고 했어요.","c":3},"h":"8371654ea3"},{"n":9,"t":"sum","q":"William put on the sunglasses and could (A) colors for the first time, because he was (B).","ko":"William은 선글라스를 쓰고 처음으로 색을 (A)할 수 있었는데, 그는 (B)이었기 때문이다.","oko":["(A) 보다 / (B) 피곤한 사람","(A) 숨기다 / (B) 색맹인 사람","(A) 보다 / (B) 행복한 사람","(A) 듣다 / (B) 색맹인 사람","(A) 보다 / (B) 색맹인 사람"],"opts":["(A) see / (B) tired","(A) hide / (B) color-blind","(A) see / (B) happy","(A) hear / (B) color-blind","(A) see / (B) color-blind"],"r":{"
