var D=[{"n":1,"tag":null,"en":"Hi! I am an plastic duck and I am a bath toys.","ko":"안녕! 나는 플라스틱 오리이고 목욕 장난감이야.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[3],"point":"관사 a/an: plastic은 자음 소리로 시작하므로 a 사용","topic":"관사 a/an","memo":"plastic은 자음 소리로 시작하므로 a 사용"},{"wrong":"toys","right":"toy","partial":false,"at":[11],"point":"a + 단수명사: a 뒤에는 단수명사 toy 사용","topic":"a + 단수명사","memo":"a 뒤에는 단수명사 toy 사용"}]},{"n":2,"tag":null,"en":"But look! I is not in a bathroom.","ko":"하지만, 봐! 나는 목욕탕에 있지 않아.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"am","partial":false,"at":[3],"point":"be동사의 현재형: 주어 I에는 am 사용","topic":"be동사의 현재형","memo":"주어 I에는 am 사용"}]},{"n":3,"tag":null,"en":"I am in the middle on the ocean. How did I get here?","ko":"나는 바다 한가운데 있어. 내가 여기에 어떻게 오게 됐을까?","ok":false,"foot":[],"fixes":[{"wrong":"on","right":"of","partial":false,"at":[5],"point":"기본전치사: \"~의 한가운데\"는 in the middle of 사용","topic":"기본전치사","memo":"\"~의 한가운데\"는 in the middle of 사용"}]},{"n":4,"tag":null,"en":"I were from a factory with other ducks. People made we with plastic because it is light and lasts long.","ko":"나는 다른 오리들과 함께 공장에서 왔어. 사람들은 플라스틱이 가볍고 오래 가기 때문에 그것으로 우리를 만들었어.","ok":false,"foot":[],"fixes":[{"wrong":"were","right":"was","partial":false,"at":[1],"point":"be동사의 과거형: 주어 I의 과거형은 was: was (were 아님)","topic":"be동사의 과거형","memo":"주어 I의 과거형은 was: was (were 아님)"},{"wrong":"we","right":"us","partial":false,"at":[10],"point":"인칭대명사의 목적격: 동사 made 뒤에는 목적격 us 사용","topic":"인칭대명사의 목적격","memo":"동사 made 뒤에는 목적격 us 사용"}]},{"n":5,"tag":null,"en":"People put us in boxes and we goed out to sea. But the boxes falled into the ocean in an accident.","ko":"사람들은 우리를 상자 속에 넣었고 우리는 바다로 나갔지. 그러나 그 상자들이 사고로 바다에 빠진 거야.","ok":false,"foot":[],"fixes":[{"wrong":"goed","right":"went","partial":false,"at":[7],"point":"불규칙 과거형: go의 과거형은 went (goed 아님)","topic":"불규칙 과거형","memo":"go의 과거형은 went (goed 아님)"},{"wrong":"falled","right":"fell","partial":false,"at":[14],"point":"불규칙 과거형: fall의 ["What a long journey!","정말 긴 여행이었어!",1],["I am finally in a bathtub with this boy, Mike.","나는 드디어 Mike라는 이 소년과 함께 욕조에 있어.",0],["How lucky I am!","나는 얼마나 운이 좋은지!",0],["But sometimes I think about my other duck friends.","그러나 때때로 나는 나의 다른 오리 친구들을 생각해.",0],["Are they still in the ocean?","그들은 아직도 바다에 있을까?",0],["I hope to see them all someday.","나는 언젠가 그들 모두를 만나기를 바라.",0]];var RNUM=67;var TITLE_EN="What a Lucky Ducky!";var PASS_EN=["What a Lucky Ducky!","Hi! I am a plastic duck and I am a bath toy. But look! I am not in a bathroom. I am in the middle of the ocean. How did I get here?","I was from a factory with other ducks. People made us with plastic because it is light and lasts long. People put us in boxes and we went out to sea. But the boxes fell into the ocean in an accident.","Luckily, we could get out of the boxes. The wind was strong, so the waves took us apart. In the ocean, I met a lot of sea animals. But many of them were in trouble. One time, I met a sea turtle in a fishing net. \"Get me out of this,\" the sea turtle cried. I wanted to help, but I couldn't. I was so sad.","Then the waves took me to a giant trash island. I saw a lot of plastic waste. I wanted to get out of there.","One day, a strong storm freed me. After weeks, I finally reached land. There were a lot of people at the beach. Oh, someone picked me up. \"Where am I going now?,\" I thought.","What a long journey! I am finally in a bathtub with this boy, Mike. How lucky I am! But sometimes I think about my other duck friends. Are they still in the ocean? I hope to see them all someday."];var PASS_KO=["얼마나 운이 좋은 오리인가!","안녕! 나는 플라스틱 오리이고 목욕 장난감이야. 하지만, 봐! 나는 목욕탕에 있지 않아. 나는 바다 한가운데 있어. 내가 여기에 어떻게 오게 됐을까?","나는 다른 오리들과 함께 공장에서 왔어. 사람들은 플라스틱이 가볍고 오래 가기 때문에 그것으로 우리를 만들었어. 사람들은 우리를 상자 속에 넣었고 우리는 바다로 나갔지. 그러나 그 상자들이 사고로 바다에 빠진 거야.","운 좋게도, 우리는 상자들 밖으로 나올 수 있었어. 바람이 강해서 파도가 우리를 떨어뜨려 놓았어. 바다에서 나는 많은 바다 동물을 만났어. 하지만 그들 중 많은 이들이 어려움에 빠져 있었어. 한번은, 내가 낚시 그물에 걸린 바다거북을 만났어. “이것으로부터 나를 꺼내 줘,”라고 바다거북이 외쳤지. 나는 도와주고 싶었지만 할 수 없었어. 나는 매우 슬펐어.","그때 파도가 나를 거대한 쓰레기 섬으로 데리고 갔어. 나는 많은 플라스틱 쓰레기를 보았지. 나는 그곳에서 벗어나고 싶었어.","어느 날, 강한 폭풍이 나를 빼내 주었어. 몇 주 후에, 나는 마침내 육지에 도착했지. 해변에는 많은 사람들이 있었어. 아, 누군가가 나를 집어 들었어. “나는 지금 어디로 가고 있는 걸까?”라고 나는 생각했어.","정말 긴 여행이었어! 나는 드디어 Mike라는 이 소년과 함께 욕조에 있어. 나는 얼마나 운이 좋은지! 그러나 때때로 나는 나의 다른 오리 친구들을 생각해. 그들은 아직도 바다에 있을까? 나는 언젠가 그들 모두를 만나기를 바라."];var DG=[{"qs":[{"n":1,"q":"What does the man suggest to the woman?","o":["포스터 종이를 재활용하기","포스터 디자인을 다시 하기","학교 앞에서 포스터를 나눠주기","학교 웹사이트에 포스터를 게시하기","포스터를 인쇄해서 학교 주변에 붙이기"],"a":3,"ans":"학교 웹사이트에 포스터를 게시하기","evs":[["Why don't we post it on the school website?","학교 웹사이트에 올리는 게 어때?"],["that is a waste of paper","그건 종이 낭비야"]],"ev":["Why don't we post it on the school website?","학교 웹사이트에 올리는 게 어때?"],"ow":["오답 ✕ — 남자는 'that is a waste of paper'(그건 종이 낭비야)라고 했을 뿐, 포스터 종이를 재활용하자는 제안은 하지 않음.","오답 ✕ — 여자가 'Oh, it's cool.'(오, 멋지다.)이라고 했으므로 디자인은 마음에 들어 하고, 디자인을 다시 하자는 말은 지문에 없음.","오답 ✕ — 'put up posters around the school'(학교 주변에 포스터를 붙이자)은 있어도 학교 앞에서 나눠주자는 말은 지문에 없음.","정답 ○ — 남자는 'Why don't we post it on the school website?'(학교 웹사이트에 올리는 게 어때?)라고 제안했으므로 맞음.","오답 ✕ — '인쇄해서 학교 주변에 붙이자'는 'Let's print and put up posters around the school.'(포스터를 인쇄해서 학교 주변에 붙이자.)라고 말한 여자의 제안이고, 남자는 이를 종이 낭비라고 반대했음."],"memo":["정답 ④: 포스터를 학교 웹사이트에 게시하자고 제안했다.","근거: Why don't we post it on the school website?(학교 웹사이트에 올리는 게 어때?)","함정: ⑤는 여자의 제안이고 남자는 종이 낭비라고 반대해 ✕"],"why":"남자는 종이를 아끼기 위해 포스터를 학교 웹사이트에 올리자고 제안한다."}],"dlg":[["M","Look! This is the design for our concert poster.","봐! 이게 우리 콘서트 포스터 디자인이야."],["W","Oh, it's cool. Let's print and put up posters around the school.","오, 멋지다. 포스터를 인쇄해서 학교 주변에 붙이자."],["M","Well, that is a waste of paper. Why don't we post it on the school website?","음, 그건 종이 낭비야. 학교 웹사이트에 올리는 게 어때?"],["W","That's a good idea.","좋은 생각이야."]]},{"qs":[{"n":2,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["jeans - video","jeans - poster","shirts - video","jeans - song","socks - poster"],"a":0,"ans":"jeans - video","evs":[["I made it with my old jeans.","내 낡은 청바지로 만들었어."],["Why don't we make a short video about reusing old clothes together?","우리 같이 낡은 옷을 재사용하는 것에 대한 짧은 영상을 만들면 어때?"]],"ev":["I made it with my old jeans.","내 낡은 청바지로 만들었어."],"ow":["정답 ○ — 'I made it with my old jeans.'(내 낡은 청바지로 만들었어.)에서 (A)는 jeans, 'make a short video about reusing old clothes'(낡은 옷을 재사용하는 것에 대한 짧은 영상을 만들다)에서 (B)는 video이므로 맞다.","오답 ✕ — (A) jeans는 맞지만, 함께 만들자고 한 것은 'a short video'(짧은 영상)이지 poster(포스터)가 아니다.","오답 ✕ — (B) video는 맞지만, 가방은 'my old jeans'(낡은 청바지)로 만들었다고 했으므로 shirts(셔츠)는 틀림.","오답 ✕ — (A) jeans는 맞지만, 'a short video'(짧은 영상)를 만들자고 했으므로 song(노래)은 틀림.","오답 ✕ — 가방은 'my old jeans'(낡은 청바지)로 만들었으므로 socks(양말)가 틀리고, 'a short video'이므로 poster도 틀림."],"memo":["정답 ①: jeans - video","근거: I made it with my old jeans.(내 낡은 청바지로 만들었어.) / make a short video(짧은 영상을 만들다)","함정: poster, song 같은 다른 결과물은 대화에 없어서 ✕"],"why":"Jessica는 낡은 청바지로 가방을 만들었고, 둘은 재사용에 관한 짧은 영상을 만들기로 한다.","sum":"Jessica made a bag with her old (A)______ for Earth Day, and she and Toby will make a short (B)______ about reusing old clothes.","lab":"완성된 요약문 : "}],"dlg":[["M","Your bag is pretty, Jessica.","네 가방 예쁘다, Jessica."],["W","Thank you, Toby. I made it with my old jeans. It's my Earth Day project.","고마워, Toby. 내 낡은 청바지로 만들었어. 내 지구의 날 프로젝트야."],["M","That's cool. I want to do something on Earth Day.","멋지다. 나도 지구의 날에 뭔가 하고 싶어."],["W","Why don't we make a short video about reusing old clothes together?","우리 같이 낡은 옷을 재사용하는 것에 대한 짧은 영상을 만들면 어때?"],["M","That's a good idea.","좋은 생각이야."]]},{"qs":[{"n":3,"q":"다음 대화의 주제로 알맞은 것은?","o":["talking about the new teacher at school","planning a surprise party for Mr. Green","discussing about a trip to the U.S.","ideas for improving their grades","Mr. Green's teaching style"],"a":1,"ans":"planning a surprise party for Mr. Green","evs":[["Why don't we throw a surprise party for him?","우리 그분을 위해 깜짝 파티를 열어 드리는 게 어때?"],["Great idea. Let's prepare it together.","좋은 생각이야. 같이 준비하자."]],"ev":["Why don't we throw a surprise party for him?","우리 그분을 위해 깜짝 파티를 열어 드리는 게 어때?"],"ow":["오답 ✕ — Mr. Green은 새로 온 선생님이 아니라 'Tomorrow is Mr. Green's last day at school.'(내일이 마지막 날)인 선생님임.","정답 ○ — 'Why don't we throw a surprise party for him?'(그분을 위해 깜짝 파티를 열어 드리는 게 어때?)와 'Let's prepare it together.'(같이 준비하자.)에서 파티를 계획하는 대화임.","오답 ✕ — 'He will go back to the U.S.'(그분은 미국으로 돌아가실 거야.)는 선생님이 떠나는 이유일 뿐, 미국 여행을 의논하지는 않음.","오답 ✕ — 성적에 대한 이야기는 지문에 없음. 'I really liked his class.'(그분 수업이 정말 좋았어.)가 수업 이야기의 전부임.","오답 ✕ — 'I really liked his class.'(그분 수업이 정말 좋았어.)만 있을 뿐, Mr. Green의 수업 방식을 설명하는 대화는 아님."],"memo":["정답 ②: Mr. Green을 위한 깜짝 파티를 계획하는 것","근거: Why don't we throw a surprise party for him?(그분을 위해 깜짝 파티를 열어 드리는 게 어때?)","함정: ⑤는 수업을 좋아했다는 말만 있고 수업 방식 설명은 없어 ✕"],"why":"마지막 날을 맞는 Mr. Green을 위해 깜짝 파티를 준비하자는 대화이다."}],"dlg":[["M","Tomorrow is Mr. Green's last day at school. He will go back to the U.S.","내일은 Green 선생님이 학교에서 마지막으로 계시는 날이야. 그분은 미국으로 돌아가실 거야."],["W","I feel so sad. I really liked his class.","너무 슬프다. 나는 그분 수업이 정말 좋았어."],["M","Me, too. Why don't we throw a surprise party for him?","나도 그래. 우리 그분을 위해 깜짝 파티를 열어 드리는 게 어때?"],["W","Great idea. Let's prepare it together.","좋은 생각이야. 같이 준비하자."]]},{"qs":[{"n":4,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["Jessica는 북극곰에 대한 포스터를 그리는 중이다.","남자에게 포스터 속 북극곰의 표정은 슬퍼 보인다.","Jessica는 집을 잃어 가는 북극곰을 걱정하고 있다.","남자는 북극곰을 위해 무언가를 하고 싶어 한다.","Jessica는 자신과 남자가 북극곰을 도와줄 시간이 없다고 말하고 있다."],"a":4,"ans":"Jessica는 자신과 남자가 북극곰을 도와줄 시간이 없다고 말하고 있다.","evs":[["They may not have much time.","그들에게는 시간이 많지 않을지도 몰라."],["We need to do something for them.","우리가 그들을 위해 뭔가 해야 해."]],"ev":["They may not have much time.","그들에게는 시간이 많지 않을지도 몰라."],"ow":["오답 ✕ — 'I'm drawing a poster about polar bears.'(북극곰에 대한 포스터를 그리고 있어.)와 일치하므로 답이 아님.","오답 ✕ — 남자가 'the polar bears on the ice look so sad.'(얼음 위의 북극곰들이 정말 슬퍼 보여.)라고 했으므로 일치함.","오답 ✕ — 'I'm worried about the polar bears. They are losing their homes.'(북극곰들이 걱정돼. 집을 잃어 가고 있어.)와 일치함.","오답 ✕ — 남자가 'We need to do something for them.'(우리가 그들을 위해 뭔가 해야 해.)라고 했으므로 일치함.","정답 ○ — 제시카는 'They may not have much time.'(그들에게는 시간이 많지 않을지도 몰라.)라고 했다. 여기서 '그들'은 북극곰이므로, 두 사람이 도와줄 시간이 없다는 보기는 일치하지 않음."],"memo":["정답 ⑤: 시간이 없는 것은 두 사람이 아니라 북극곰이다.","근거: They may not have much time.(그들에게는 시간이 많지 않을지도 몰라.)","함정: They는 북극곰(polar bears)을 가리켜 ⑤는 ✕"],"why":"'시간이 많지 않다'는 말은 북극곰에 대한 것이지, 두 사람이 도울 시간이 없다는 뜻이 아니다."}],"dlg":[["M","What are you drawing, Jessica?","뭘 그리고 있니, Jessica?"],["W","I'm drawing a poster about polar bears.","북극곰에 대한 포스터를 그리고 있어."],["M","I see. Oh, the polar bears on the ice look so sad.","그렇구나. 오, 얼음 위의 북극곰들이 정말 슬퍼 보여."],["W","Yeah, I'm worried about the polar bears. They are losing their homes.","응, 나는 북극곰들이 걱정돼. 그들은 집을 잃어 가고 있어."],["M","You're right. We need to do something for them.","맞아. 우리가 그들을 위해 뭔가 해야 해."],["W","Right. They may not have much time.","맞아. 그들에게는 시간이 많지 않을지도 몰라."]]},{"qs":[{"n":5,"q":"Why is the woman worried about the birds?","o":["The bright nights can damage the birds' eyes.","Many cars on the street may lead to accidents.","The loud noises in Seoul hurt the birds' hearing.","The birds are not able to sleep due to the lights.","The birds cannot fly high because of the buildings."],"a":3,"ans":"The birds are not able to sleep due to the lights.","evs":[["It is bright all night, so they cannot sleep well.","밤새 밝아서 새들이 잠을 잘 못 자."]],"ev":["It is bright all night, so they cannot sleep well.","밤새 밝아서 새들이 잠을 잘 못 자."],"ow":["오답 ✕ — 'so they cannot sleep well'(그래서 잠을 잘 못 자)이라고 했을 뿐, 밝은 밤이 새의 눈을 해친다는 말은 지문에 없음.","오답 ✕ — 자동차나 사고에 대한 이야기는 지문에 없음. 이유는 'It is bright all night'(밤새 밝아서)임.","오답 ✕ — 시끄러운 소리는 지문에 없음. 'Seoul is so beautiful at night.'(서울은 밤에 아름다워.)처럼 밤의 밝은 빛이 문제임.","정답 ○ — 'It is bright all night, so they cannot sleep well.'(밤새 밝아서 새들이 잠을 잘 못 자.)이므로 불빛 때문에 잠을 못 자는 것이 걱정의 이유임.","오답 ✕ — 새들이 높이 날지 못한다는 말이나 건물 이야기는 지문에 없음."],"memo":["정답 ④: 밤새 불빛이 밝아서 새들이 잠을 잘 못 잔다.","근거: It is bright all night, so they cannot sleep well.(밤새 밝아서 잠을 잘 못 자.)","함정: ①은 눈을 해친다는 말이 없고 '잠'이 문제라서 ✕"],"why":"도시의 밝은 불빛 때문에 새들이 잠을 잘 못 자서 걱정이다."}],"dlg":[["M","Seoul is so beautiful at night.","서울은 밤에 정말 아름다워."],["W","Yeah, it is. But I'm worried about the birds.","응, 그렇지. 하지만 나는 새들이 걱정돼."],["M","Why?","왜?"],["W","It is bright all night, so they cannot sleep well.","밤새 밝아서 새들이 잠을 잘 못 자."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용을 요약하려고 한다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["fell - took","flew - took","fell - freed","stayed - saved","rose - caught"],"a":0,"ans":"fell - took","evs":[["But the boxes fell into the ocean in an accident.","그러나 그 상자들이 사고로 바다에 빠진 거야."],["The wind was strong, so the waves took us apart.","바람이 강해서 파도가 우리를 떨어뜨려 놓았어."]],"ev":["But the boxes fell into the ocean in an accident.","그러나 그 상자들이 사고로 바다에 빠진 거야."],"ow":["정답 ○ — 'the boxes fell into the ocean'(상자들이 바다에 빠졌다)이므로 (A)는 fell, 'the waves took us apart'(파도가 우리를 떨어뜨려 놓았다)이므로 (B)는 took임.","오답 ✕ — (B) took은 맞지만, 상자들은 날아간(flew) 것이 아니라 'fell into the ocean'(바다에 빠졌다).","오답 ✕ — (A) fell은 맞지만, 파도가 오리들을 풀어 준(freed) 것이 아니라 'the waves took us apart'(떨어뜨려 놓았다). 'freed'는 나중에 폭풍이 오리를 구해 준 장면에 나옴.","오답 ✕ — 'the boxes fell into the ocean'(상자들이 바다에 빠졌다)이므로 상자들이 그대로 머문(stayed) 것이 아님. 파도가 오리들을 구해(saved) 준 것도 아님.","오답 ✕ — 상자들은 떠오른(rose) 것이 아니라 'fell'(빠졌다)이고, 파도가 오리를 붙잡은(caught) 것이 아니라 'took us apart'임."],"memo":["정답 ①: 상자들이 바다에 빠지고(fell), 파도가 오리들을 떨어뜨려 놓았다(took apart).","근거: the boxes fell into the ocean / the waves took us apart","함정: ③은 파도가 오리를 '풀어 준' 것이 아니라 '떨어뜨려 놓은' 것이라 ✕"],"why":"오리 상자가 사고로 바다에 빠졌고 강한 파도가 오리들을 서로 떨어뜨려 놓았다.","sum":"The plastic ducks were put in boxes, but the boxes (A)______ into the ocean in an accident. Because the wind was strong, the waves (B)______ the ducks apart.","lab":"완성된 요약문 : "},{"n":7,"q":"윗글의 sea turtle에 관한 내용과 일치하는 것은?","o":["The sea turtle was in a fishing net.","The duck helped the sea turtle get out of the net.","The sea turtle took the duck to a trash island.","The sea turtle was happy to meet the duck.","The sea turtle was in a factory."],"a":0,"ans":"The sea turtle was in a fishing net.","evs":[["One time, I met a sea turtle in a fi
