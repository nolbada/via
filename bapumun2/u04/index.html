": "경험을 묻는 현재완료 의문문이라 Have로 시작하고, ever는 과거분사 앞에 와서 Have you ever seen이 돼요.", "opts": [], "pencil": "Have + 주어 + ever + ___", "pencilKey": "과거분사", "page": 39, "sec": "s1"}, {"id": "S1-08", "step": 1, "no": 8, "qtype": "유형 01 현재완료 시제의 형태와 쓰임", "type": "mc", "ans": "④", "concept": ["055-2", "054"], "gap": "", "words": [["Thai food", "태국 음식"], ["eaten", "먹은 (eat의 과거분사)"], ["ever", "지금까지, 한 번이라도"]], "h1": "단어 you / Thai food / have / ever / eaten을 배열하는 문제예요. 의문문이니 가장 먼저 올 단어는 무엇일까요?", "h2": "현재완료 의문문은 Have + 주어 + ever + 과거분사 순서예요. 이 순서대로 보기를 하나씩 맞춰 보세요.", "why": "Have you ever eaten Thai food?가 올바른 순서예요. Have가 맨 앞, ever는 과거분사 eaten 바로 앞에 와요.", "opts": [{"n": "①", "en": "You have eaten Thai food ever?", "ko": "너는 태국 음식을 지금까지 먹었니?", "ok": false, "why": "평서문 순서라서 의문문이 되지 않고, ever가 맨 끝에 있어 어색해요."}, {"n": "②", "en": "Have eaten Thai food you ever?", "ko": "먹었다 태국 음식 너는 지금까지?", "ok": false, "why": "Have 뒤에 바로 주어(you)가 와야 해요."}, {"n": "③", "en": "Have you Thai food ever eaten?", "ko": "너는 태국 음식을 지금까지 먹었니?", "ok": false, "why": "ever는 과거분사 eaten 바로 앞에 오고 Thai food는 eaten 뒤에 와야 해요."}, {"n": "④", "en": "Have you ever eaten Thai food?", "ko": "너는 태국 음식을 먹어 본 적이 있니?", "ok": true, "why": "Have + 주어 + ever + 과거분사 + 목적어 순서가 맞아요."}, {"n": "⑤", "en": "Have eaten you Thai food ever?", "ko": "먹었다 너는 태국 음식 지금까지?", "ok": false, "why": "주어 you가 Have 바로 뒤에 오지 않아서 틀려요."}], "pencil": "현재완료 의문문의 ever는 ___ 앞에 쓴다", "pencilKey": "과거분사", "page": 39, "sec": "s1"}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 01 현재완료 시제의 형태와 쓰임", "type": "write", "ans": "has been", "concept": ["054"], "gap": "", "words": [["get sick", "아프게 되다"], ["a week ago", "일주일 전에"], ["still", "여전히"]], "h1": "보기의 예시 문장과 비교해 보세요. 일주일 전에 아프기 시작해서 지금도 아픈 상태를 한 문장으로 말하는 거예요.", "h2": "과거부터 지금까지 이어지는 상태는 현재완료로 말해요. 주어 Mina에 맞는 have/has를 고르고, be동사의 과거분사를 써요.", "why": "일주일 전부터 지금까지 계속 아픈 상태라서 현재완료를 써요. Mina는 3인칭 단수라 has, be의 과거분사는 been이에요.", "opts": [], "pencil": "「have/has + ___」로 지금까지 계속된 상태를 말한다", "pencilKey": "과거분사", "page": 39, "sec": "s1"}, {"id": "S1-10", "step": 1, "no": 10, "qtype": "유형 01 현재완료 시제의 형태와 쓰임", "type": "mc", "ans": "④", "concept": ["054"], "gap": "", "words": [["began living", "살기 시작했다 (원형 begin 시작하다)"], ["Suncheon", "순천"], ["has lived", "살아 왔다 (원형 live 살다)"]], "h1": "두 문장을 합치면 '2년 전부터 지금까지 계속 살고 있다'는 뜻이에요. 과거에서 현재까지 이어지는 일에 쓰는 시제를 생각해 보세요.", "h2": "현재완료 형태는 「have/has + 과거분사」예요. 주어 He가 3인칭 단수라서 have와 has 중 어느 쪽인지 정해 보세요.", "why": "과거부터 지금까지 이어진 일이라서 현재완료예요. He는 3인칭 단수라서 has lived가 알맞아요.", "opts": [{"n": "①", "en": "lives", "ko": "산다(현재)", "ok": false, "why": "현재 시제라서 '2년 동안 살아 왔다'는 뜻을 만들지 못해요."}, {"n": "②", "en": "lived", "ko": "살았다(과거)", "ok": false, "why": "과거에 끝난 일이라서 지금도 살고 있다는 뜻이 빠져요."}, {"n": "③", "en": "have lived", "ko": "살아 왔다(복수 주어용)", "ok": false, "why": "현재완료는 맞지만 He에는 have가 아니라 has를 써요."}, {"n": "④", "en": "has lived", "ko": "살아 왔다(3인칭 단수)", "ok": true, "why": "2년 동안 지금까지 계속 산다는 뜻이고 주어 He에 has가 맞아요."}, {"n": "⑤", "en": "had lived", "ko": "살았었다(과거완료)", "ok": false, "why": "과거보다 더 앞선 일을 말할 때 쓰는 과거완료라 지금까지 이어지는 뜻이 아니에요."}], "pencil": "과거에 시작해 지금도 계속되면 「have/has + ___」", "pencilKey": "과거분사", "page": 40, "sec": "s1"}, {"id": "S1-11", "step": 1, "no": 11, "qtype": "유형 01 현재완료 시제의 형태와 쓰임", "type": "write", "ans": "have worked", "concept": ["054"], "gap": "", "words": [["started working", "일하기 시작했다 (원형 start 시작하다)"], ["a month ago", "한 달 전에"], ["office", "사무실"]], "h1": "한 달 전에 일을 시작해서 지금도 일하고 있어요. 이 두 문장을 한 문장으로 합치면 어떤 시제가 될까요?", "h2": "과거에 시작해 지금도 이어지는 일은 「have/has + 과거분사」예요. 주어 I에 맞는 말을 고르고 work(일하다)의 과거분사를 써요.", "why": "과거부터 지금까지 계속 일하고 있으니 현재완료예요. 주어가 I라서 have worked가 돼요.", "opts": [], "pencil": "I + have + ___ (work의 과거분사)", "pencilKey": "worked", "page": 40, "sec": "s1"}, {"id": "S1-12", "step": 1, "no": 12, "qtype": "유형 01 현재완료 시제의 형태와 쓰임", "type": "write", "ans": "Have [have]", "concept": ["055-2", "054"], "gap": "", "words": [["ridden", "탄 (ride의 과거분사)"], ["ride a horse", "말을 타다"], ["ever", "지금까지, 한 번이라도"]], "h1": "A의 질문 안에 ridden(탄)이 있어요. 이 모양은 어떤 시제일까요? 그리고 B의 대답은 A의 질문에 쓰인 말을 되풀이해요.", "h2": "ridden은 ride(타다)의 과거분사예요. 「___ you ever ridden ~?」에 대한 대답은 Yes, I ___.로 같은 단어를 써요.", "why": "A는 현재완료 의문문이라 Have로 시작하고, B도 같은 말을 써서 Yes, I have.라고 대답해요.", "opts": [], "pencil": "현재완료로 물으면 ___ 로 대답한다", "pencilKey": "have", "page": 40, "sec": "s1"}, {"id": "S1-13", "step": 1, "no": 13, "qtype": "유형 01 현재완료 시제의 형태와 쓰임", "type": "write", "ans": "(1) have been (2) you ever been to Disneyland", "concept": ["055-2", "054"], "gap": "", "words": [["have been to", "~에 가 본 적이 있다 (원형 be ~이다)"], ["three times", "세 번"], ["Disneyland", "디즈니랜드"]], "h1": "(1)은 경험을 말하는 평서문이고, (2)는 경험을 묻는 의문문이에요. 괄호 속 단어들 중 쓸 단어를 먼저 정해 보세요.", "h2": "평서문은 「주어 + have + 과거분사」, 의문문은 「Have + 주어 + ever + 과거분사」예요. be동사의 과거분사는 been이에요.", "why": "(1)은 I have been to Italy three times, (2)는 Have you ever been to Disneyland? 순서로 배열해요.", "opts": [], "pencil": "평서문은 주어 + have + ___, 의문문은 Have + 주어 + ever + ___", "pencilKey": "been / been", "page": 40, "sec": "s1"}, {"id": "S1-14", "step": 1, "no": 14, "qtype": "유형 02 현재완료 시제의 용법", "type": "mc", "ans": "①", "concept": ["054", "055"], "gap": "", "words": [["How long", "얼마나 오래"], ["stay", "머무르다"], ["since 2014", "2014년 이래로"], ["known", "알아 온 (know의 과거분사)"]], "h1": "보기의 have known ... since 2014는 '2014년부터 지금까지 이어진 일'이에요. 현재완료의 네 가지 용법(경험·계속·완료·결과) 중 무엇일지 생각해 보세요.", "h2": "계속은 since, for, how long과 함께 쓰이는 경우가 많아요. 보기 문장에서 이런 표현이 있는 문장을 찾아 보세요.", "why": "<보기>와 ①은 계속(지금까지 이어짐)이에요. ②, ⑤는 완료, ③, ④는 경험이에요.", "opts": [{"n": "①", "en": "How long have you stayed there?", "ko": "너는 거기에 얼마나 오래 머물렀니?", "ok": true, "why": "how long으로 기간을 묻는 계속 용법이라 <보기>와 같아요."}, {"n": "②", "en": "He has just finished his homework.", "ko": "그는 방금 숙제를 끝냈다.", "ok": false, "why": "just(방금)가 있는 완료 용법이라 <보기>와 달라요."}, {"n": "③", "en": "I have never moved into a new house.", "ko": "나는 새집으로 이사한 적이 없다.", "ok": false, "why": "never로 경험이 없다고 말하는 경험 용법이에요."}, {"n": "④", "en": "We have met her many times.", "ko": "우리는 그녀를 여러 번 만났다.", "ok": false, "why": "many times(여러 번)가 있는 경험 용법이에요."}, {"n": "⑤", "en": "Somebody has just taken my bag.", "ko": "누군가가 방금 내 가방을 가져갔다.", "ok": false, "why": "just가 있는 완료(결과) 용법이라 <보기>와 달라요."}], "pencil": "계속 용법은 since, for, ___ 와 자주 쓴다", "pencilKey": "how long", "page": 40, "sec": "s1"}, {"id": "S1-15", "step": 1, "no": 15, "qtype": "유형 02 현재완료 시제의 용법", "type": "mc", "ans": "①", "concept": ["054", "055"], "gap": "", "words": [["late for school", "학교에 지각한"], ["gone out", "나가고 없는 (go out 나가다의 과거분사)"], ["swum", "수영한 (swim의 과거분사)"], ["once", "한 번"]], "h1": "<보기> Have you ever been late for school?는 '지각한 적이 있니?'라는 경험이에요. 쓰임이 다른 하나를 찾는 문제예요.", "h2": "경험은 ever, never, once, before, several times와 같이 써요. '지금 그 자리에 없다'는 뜻의 결과 용법은 어떤 문장일지 찾아 보세요.", "why": "①은 '산책하러 나가고 없다'는 결과예요. <보기>와 ②~⑤는 모두 경험을 말해요.", "opts": [{"n": "①", "en": "He has gone out for a walk.", "ko": "그는 산책하러 나가고 없다.", "ok": true, "why": "지금 그 자리에 없다는 결과 용법이라 <보기>와 쓰임이 달라요."}, {"n": "②", "en": "I have never swum in the sea.", "ko": "나는 바다에서 수영해 본 적이 없다.", "ok": false, "why": "never가 있는 경험 용법이라 <보기>와 같아요."}, {"n": "③", "en": "She has worn glasses before.", "ko": "그녀는 전에 안경을 써 본 적이 있다.", "ok": false, "why": "before가 있는 경험 용법이라 <보기>와 같아요."}, {"n": "④", "en": "Ella has eaten a frog once.", "ko": "Ella는 개구리를 한 번 먹어 본 적이 있다.", "ok": false, "why": "once가 있는 경험 용법이라 <보기>와 같아요."}, {"n": "⑤", "en": "Tommy has been to London several times.", "ko": "Tommy는 런던에 여러 번 가 봤다.", "ok": false, "why": "several times가 있는 경험 용법이라 <보기>와 같아요."}], "pencil": "has gone(~에 가고 없다)은 ___ 용법이다", "pencilKey": "결과", "page": 40, "sec": "s1"}, {"id": "S1-16", "step": 1, "no": 16, "qtype": "유형 02 현재완료 시제의 용법", "type": "mc", "ans": "⑤", "concept": ["054"], "gap": "", "words": [["visit", "방문하다"], ["catch a fish", "물고기를 잡다"], ["dishes", "설거지거리, 접시"], ["since last week", "지난주 이래로"]], "h1": "다섯 문장 중 쓰임이 다른 하나를 찾아요. 각 문장에 never, ever, before, since 같은 단서가 있는지 살펴보세요.", "h2": "경험을 나타내는 단서(ever, never, before)와 계속을 나타내는 단서(since, for)를 구별해 보세요. 단서가 다른 문장이 하나 있어요.", "why": "⑤는 since last week(지난주 이래로) 끝냈다는 뜻이 되는 단어를 찾아 보세요.", "h2": "완료 용법에 자주 쓰이는 단서는 just(방금), already(이미), yet(아직)이에요. 이 중에서 보기에 있는 것을 고르세요.", "why": "I have just finished it.은 '나는 방금 그것을 끝냈어'예요. just는 완료 용법에 쓰는 단어예요.", "opts": [{"n": "①", "en": "just", "ko": "방금", "ok": true, "why": "have와 과거분사 사이에 오는 완료 용법의 단서예요."}, {"n": "②", "en": "since", "ko": "~ 이래로", "ok": false, "why": "since 뒤에는 시점이 와야 해서 이 자리에 맞지 않아요."}, {"n": "③", "en": "soon", "ko": "곧", "ok": false, "why": "미래를 가리키는 말이라 have finished와 어울리지 않아요."}, {"n": "④", "en": "very", "ko": "매우", "ok": false, "why": "정도를 강조하는 말이라 동사 앞에 놓기 어색해요."}, {"n": "⑤", "en": "once", "ko": "한 번", "ok": false, "why": "경험 용법의 단서라서 '방금 끝냈다'는 뜻과 맞지 않아요."}], "pencil": "완료 용법의 단서: ___, already, yet", "pencilKey": "just", "page": 42, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "현재완료 시제의 용법", "type": "write", "ans": "has gone", "concept": ["055", "054"], "gap": "", "words": [["went to Europe", "유럽에 갔다 (원형 go 가다)"], ["isn't here now", "지금 여기에 없다"], ["two days ago", "이틀 전에"]], "h1": "두 번째 문장이 'She isn't here now(지금 여기에 없다)'예요. 유럽에 가서 지금 여기 없다는 한 문장으로 만들어 보세요.", "h2": "'~에 가고 없다'는 has gone to, '~에 갔다 왔다'는 has been to예요. 지금 없다는 뜻이니 어느 쪽일까요?", "why": "유럽에 가서 지금 여기에 없는 상태라서 결과 용법 has gone을 써요.", "opts": [], "pencil": "지금 없다는 뜻은 has ___ to", "pencilKey": "gone", "page": 43, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "현재완료 시제의 용법", "type": "write", "ans": "ⓐ, ⓑ, ⓒ", "concept": ["054"], "gap": "", "words": [["childhood", "어린 시절"], ["raise", "기르다"], ["stand", "서 있다"], ["finish the wash", "빨래를 끝내다"]], "h1": "<보기> I have known him since childhood.는 '어린 시절부터 지금까지'라서 계속 용법이에요. 같은 계속 용법을 고르세요.", "h2": "for + 기간, since + 시점이 있으면 계속이에요. 반대로 finally(드디어), just(방금)가 있으면 완료예요.", "why": "ⓐ(for ten years), ⓑ(for 11 years), ⓒ(since 3 o'clock)는 계속이에요. ⓓ와 ⓔ는 완료 용법이에요.", "opts": [], "pencil": "계속 용법은 for와 ___ 가 단서이다", "pencilKey": "since", "page": 43, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "현재완료 시제의 용법", "type": "write", "ans": "has gone", "c 가 있으니 과거 시제를 써요. attend에 -ed를 붙여 attended가 돼요.", "opts": [], "pencil": "yesterday가 있으면 동사를 ___ 형으로 쓴다", "pencilKey": "과거", "page": 43, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "과거 시제 vs. 현재완료 시제", "type": "write", "ans": "How long have you lived in this house", "concept": ["055-2", "054", "053"], "gap": "", "words": [["How long", "얼마나 오래"], ["Since 2013", "2013년 이래로"], ["live", "살다"], ["lived", "산 (live의 과거분사)"]], "h1": "B의 대답이 'Since 2013.(2013년부터)'예요. 과거부터 지금까지 이어진 기간을 묻는 질문이 되어야 해요.", "h2": "기간을 묻는 말은 How long이에요. 현재완료 의문문 순서는 「How long + have + 주어 + 과거분사」예요.", "why": "since로 대답했으니 지금까지 이어진 기간을 묻는 현재완료 의문문을 써요.", "opts": [], "pencil": "기간을 묻는 현재완료 의문문은 How long + ___ + 주어 + 과거분사", "pencilKey": "have", "page": 43, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "과거 시제 vs. 현재완료 시제", "type": "write", "ans": "②, have graduated", "concept": ["055-H1", "054"], "gap": "", "words": [["founded", "설립되었다 (원형 found 설립하다)"], ["graduate from", "~을 졸업하다"], ["Since then", "그때 이후로"], ["thousands of", "수천의"]], "h1": "밑줄 친 ①~⑤ 중 시제가 어색한 것을 찾아요. Since then(그때 이후로)은 어떤 시제와 어울리는지 생각해 보세요.", "h2": "①은 1995년이라는 분명한 과거라서 was founded가 맞아요. since then 뒤에는 과거부터 지금까지 이어진 내용이라 현재완료가 필요해요.", "why": "②는 Since then(그때 이후로)이 있어서 과거에서 지금까지를 뜻하는 현재완료 have graduated로 써야 해요.", "opts": [], "pencil": "Since then + ___ 시제", "pencilKey": "현재완료", "page": 43, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "현재완료 시제의 용법", "type": "mc", "ans": "④", "concept": ["054", "055"], "gap": "", "words": [["already", "이미"], ["before", "전에"], ["yet", "아직"], ["since 2015", "2015년 이래로"], ["research", "연구, 조사"]], "h1": "(A)(B)(C)는 각각 어떤 용법인지, ⓐⓑⓒ도 어떤 용법인지 먼저 이름을 붙여 보세요. 이름이 같은 것끼리 짝을 지어요.", "h2": "already, yet은 완료, ever나 before는 경험, for·since는 계속이에요. 단서 단어를 찾아 하나씩 용법 이름을 정해 보세요.", "why": "(A) already는 완료로 ⓒ(yet), (B) before는 경험으로 ⓐ(ever), (C) for 20 years는 계속으로 ⓑ(since 2015)와 짝이에요.", "opts": [{"n": "①", "en": "(A) - ⓐ, (B) - ⓑ, (C) - ⓒ", "ko": "(A)는 ⓐ, (B)는 ⓑ, (C)는 ⓒ와 짝", "ok": false, "why": "(A)는 완료인데 ⓐ는 경험이라서 틀려요."}, {"n": "②", "en": "(A) - ⓐ, (B) - ⓒ, (C) - ⓑ", "ko": "(A)는 ⓐ, (B)는 ⓒ, (C)는 ⓑ와 짝", "ok": false, "why": "(A)와 (B)가 모두 틀렸어요. (A)는 완료이고 ⓐ는 경험이에요."}, {"n": "③", "en": "(A) - ⓑ, (B) - ⓐ, (C) - ⓒ", "ko": "(A)는 ⓑ, (B)는 ⓐ, (C)는 ⓒ와 짝", "ok": false, "why": "(A)는 완료인데 ⓑ는 계속이라서 틀려요."}, {"n": "④", "en": "(A) - ⓒ, (B) - ⓐ, (C) - ⓑ", "ko": "(A)는 ⓒ, (B)는 ⓐ, (C)는 ⓑ와 짝", "ok": true, "why": "(A) 완료는 ⓒ, (B) 경험은 ⓐ, (C) 계속은 ⓑ로 모두 맞아요."}, {"n": "⑤", "en": "(A) - ⓒ, (B) - ⓑ, (C) - ⓐ", "ko": "(A)는 ⓒ, (B)는 ⓑ, (C)는 ⓐ와 짝", "ok": false, "why": "(B)는 경험인데 ⓑ는 계속이라서 틀려요."}], "pencil": "already, yet은 완료 / before, ever는 경험 / for, since는 ___", "pencilKey": "계속", "page": 44, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "현재완료 시제의 용법", "type": "mc", "ans": "①", "concept": ["054", "055"], "gap": "", "words": [["has gone to", "~에 가고 없다 (원형 go 가다)"], ["never seen", "본 적이 없다 (원형 see 보다)"], ["snow", "눈"], ["thirty years", "30년"]], "h1": "밑줄 친 부분의 우리말 해석이 '옳지 않은 것'을 고르는 문제예요. has gone to의 뜻부터 다시 떠올려 보세요.", "h2": "has gone to는 '~에 가고 없다', has been to는 '~에 가 본 적이 있다'예요. 이 둘의 차이를 보기에 대입해 보세요.", "why": "①의 has gone to Mexico는 '멕시코에 가고 없다'라서 '간 적이 있다'는 해석은 틀려요.", "opts": [{"n": "①", "en": "Tony has gone to Mexico. - 간 적이 있다", "ko": "Tony는 멕시코에 갔다. - 간 적이 있다", "ok": true, "why": "has gone to는 '가고 없다'라서 '간 적이 있다'는 틀린 해석이에요."}, {"n": "②", "en": "They have never seen snow. - 본 적이 없다", "ko": "그들은 눈을 본 적이 없다. - 본 적이 없다", "ok": false, "why": "have never seen은 '본 적이 없다'라서 맞아요."}, {"n": "③", "en": "I have met the girl before. - 만난 적이 있다", "ko": "나는 그 소녀를 전에 만난 적이 있다. - 만난 적이 있다", "ok": false, "why": "before가 있는 경험이라서 해석이 맞아요."}, {"n": "④", "en": "The game has already started. - 이미 시작했다", "ko": "경기는 이미 시작되었다. - 이미 시작했다", "ok": false, "why": "already가 있는 완료라서 해석이 맞아요."}, {"n": "⑤", "en": "She has played the guitar for thirty years. - 연주해 왔다", "ko": "그녀는 30년 동안 기타를 쳐 왔다. - 연주해 왔다", "ok": false, "why": "for 30 years가 있는 계속이라서 해석이 맞아요."}], "pencil": "has gone to = ___ , has been to = 가 본 적이 있다", "pencilKey": "가고 없다", "page": 44, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "현재완료 시제의 용법", "type": "mc", "ans": "⑤", "concept": ["055", "054", "055-H1"], "gap": "", "words": [["just", "방금"], ["already", "이미"], ["before I expected", "내가 기대하기 전에"], ["a moment ago", "조금 전에"]], "h1": "각 보기의 위 문장(현재완료)과 아래 문장(과거나 다른 표현)이 같은 뜻인지 하나씩 비교해 보세요. 의미가 '다른' 것을 고르는 문제예요.", "h2": "has read ~ for three hours는 '3시간 동안 계속 읽어 왔다'예요. 이 말이 '3시간 전에 다 읽었다'와 같은 뜻인지 생각해 보세요.", "why": "⑤는 '3시간 동안 읽어 왔다'(계속)인데 '3시간 전에 다 읽었다'(과거)라서 뜻이 달라요.", "opts": [{"n": "①", "en": "Lucy has just read the book. / Lucy read the book a moment ago.", "ko": "Lucy는 방금 그 책을 읽었다. / Lucy는 조금 전에 그 책을 읽었다.", "ok": false, "why": "just는 '방금'이라서 a moment ago와 뜻이 같아요."}, {"n": "②", "en": "Lucy has already read the book. / Lucy read the book before I expected her to do it.", "ko": "Lucy는 이미 그 책을 읽었다. / Lucy는 내가 예상하기 전에 그 책을 읽었다.", "ok": false, "why": "already는 '이미'라서 뜻이 같아요."}, {"n": "③", "en": "Lucy hasn't read the book yet. / Up to now Lucy hasn't read the book.", "ko": "Lucy는 아직 그 책을 읽지 않았다. / 지금까지 Lucy는 그 책을 읽지 않았다.", "ok": false, "why": "yet은 '지금까지 아직'이라서 뜻이 같아요."}, {"n": "④", "en": "Lucy has never read the book. / Lucy hasn't read the book in her life.", "ko": "Lucy는 그 책을 읽은 적이 없다. / Lucy는 평생 그 책을 읽은 적이 없다.", "ok": false, "why": "never는 '한 번도 ~않다'라서 뜻이 같아요."}, {"n": "⑤", "en": "Lucy has read the book for three hours. / Lucy finished reading the book three hours ago.", "ko": "Lucy는 3시간 동안 그 책을 읽어 왔다. / Lucy는 3시간 전에 그 책을 다 읽었다.", "ok": true, "why": "계속(읽는 중)과 끝난 일(다 읽음)이라서 뜻이 달라요."}], "pencil": "for + 기간은 ___ 용법이라 '~ 전에 끝났다'와 뜻이 다르다", "pencilKey": "계속", "page": 44, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "현재완료 시제의 용법", "type": "mc", "ans": "①", "concept": ["054"], "gap": "", "words": [["lived in Sydney", "시드니에서 살았다 (원형 live 살다)"], ["a month", "한 달"], ["a long time", "오랜 시간"], ["so far", "지금까지"]], "h1": "세 문장의 빈칸 뒤에 a month(한 달), four years(4년), a long time(오랜 시간)이 있어요. 이 말들의 공통점을 찾아 보세요.", "h2": "기간 앞에는 for, 시점 앞에는 since를 써요. 세 문장의 빈칸 뒤 표현이 기간인지 시점인지 확인해 보세요.", "why": "세 문장의 빈칸 뒤가 모두 기간이라서 공통으로 for가 들어가요.", "opts": [{"n": "①", "en": "for", "ko": "~ 동안", "ok": true, "why": "기간(a month, four years, a long time) 앞에 쓰는 말이에요."}, {"n": "②", "en": "since", "ko": "~ 이래로", "ok": false, "why": "since 뒤에는 시점이 와야 해요. 세 문장 모두 기간이라서 맞지 않아요."}, {"n": "③", "en": "just", "ko": "방금", "ok": false, "why": "기간 앞에 쓸 수 없어요."}, {"n": "④", "en": "yet", "ko": "아직", "ok": false, "why": "부정문이나 의문문에서 쓰는 말이라서 이 자리에 맞지 않아요."}, {"n": "⑤", "en": "so far", "ko": "지금까지", "ok": false, "why": "그 뒤에 기간을 붙일 수 없어서 맞지 않아요."}], "pencil": "기간 앞에는 ___ , 시점 앞에는 since", "pencilKey": "for", "page": 44, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "과거 시제 vs. 현재완료 시제", "type": "mc", "ans": "①", "concept": ["054", "055-H1"], "gap": "", "words": [["taught", "가르쳐 왔다 (원형 teach 가르치다)"], ["the past three years", "지난 3년"], ["ago", "~ 전에"], ["when", "언제"]], "h1": "문장이 has taught(가르쳐 왔다)로 현재완료예요. 빈칸 뒤 the past three years는 기간인지 시점인지 확인하세요.", "h2": "ago와 when은 현재완료와 같이 쓸 수 없어요. 남은 for와 since 중 뒤에 '기간'이 올 때 쓰는 것은 무엇일까요?", "why": "the past three years(지난 3년)는 기간이라서 for를 써요. ago, when은 현재완료와 같이 쓸 수 없어요.", "opts": [{"n": "①", "en": "for", "ko": "~ 동안", "ok": true, "why": "기간 앞에 쓰는 말이라 알맞아요."}, {"n": "②", "en": "since", "ko": "~ 이래로", "ok": false, "why": "since 뒤에는 시점이 와요. '지난 3년'은 기간이라서 맞지 않아요."}, {"n": "③", "en": "ago", "ko": "~ 전에", "ok": false, "why": "ago는 분명한 과거라서 현재완료와 쓸 수 없어요."}, {"n": "④", "en": "when", "ko": "언제", "ok": false, "why": "when은 현재완료와 같이 쓸 수 없어요."}, {"n": "⑤", "en": "before", "ko": "~ 전에", "ok": false, "why": "before는 그 뒤에 기간을 붙여 쓰지 않아서 맞지 않아요."}], "pencil": "the past three years 같은 기간 앞에는 ___ 를 쓴다", "pencilKey": "for", "page": 44, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "과거 시제 vs. 현재완료 시제", "type": "mc", "ans": "②", "concept": ["055-H1", "054"], "gap": "", "words": [["eaten", "먹은 (eat의 과거분사)"], ["anything", "아무것도"], ["last night", "어젯밤"], ["so far", "지금까지"]], "h1": "'알맞지 않은 것'을 고르는 문제예요. I haven't eaten anything 뒤에 들어가는 말이 현재완료와 어울리는지 하나씩 확인해 보세요.", "h2": "현재완료는 지금과 이어지는 일이라 지난 한때만 콕 집는 말과는 어울리지 않아요. 보기 중 분명한 과거를 가리키는 말은 무엇일까요?", "why": "last night(어젯밤)은 분명한 과거라서 현재완료와 쓸 수 없어요. 나머지는 지금까지 이어지는 말이에요.", "opts": [{"n": "①", "en": "so far", "ko": "지금까지", "ok": false, "why": "지금까지 이어지는 일을 말하므로 현재완료와 어울려요."}, {"n": "②", "en": "last night", "ko": "어젯밤", "ok": true, "why": "분명한 과거라서 현재완료와 쓸 수 없어요. 이것이 답이에요."}, {"n": "③", "en": "for 24 hours", "ko": "24시간 동안", "ok": false, "why": "기간을 나타내서 현재완료와 어울려요."}, {"n": "④", "en": "yet", "ko": "아직", "ok": false, "why": "부정문과 쓰이는 단서라서 어울려요."}, {"n": "⑤", "en": "since I woke up", "ko": "내가 일어난 이후로", "ok": false, "why": "since + 시점이라서 현재완료와 어울려요."}], "pencil": "last night 같은 분명한 과거 표현은 현재완료와 ___", "pencilKey": "쓸 수 없다", "page": 44, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "과거 시제 vs. 현재완료 시제", "type": "mc", "ans": "③, ⑤", "concept": ["055-H1", "054"], "gap": "", "words": [["digital camera", "디지털 카메라"], ["since last year", "작년 이래로"], ["just now", "방금"], ["during the last weekend", "지난 주말 동안"]], "h1": "Mr. Kim has used ~는 현재완료예요. 빈칸에 알맞지 '않은' 것(현재완료와 못 쓰는 것) 두 개를 찾으세요.", "h2": "since last year(작년 이래로), before(전에), several times(여러 번)는 지금까지의 경험·계속이에요. just now(방금)와 during the last weekend(지난 주말 동안)는 어떤 때를 말하는지 생각해 보세요.", "why": "just now(방금 전)와 during the last weekend(지난 주말 동안)는 이미 지난 과거를 말해서 현재완료와 쓸 수 없어요.", "opts": [{"n": "①", "en": "since last year", "ko": "작년 이래로", "ok": false, "why": "since + 시점이라서 현재완료와 쓸 수 있어요."}, {"n": "②", "en": "before", "ko": "전에", "ok": false, "why": "경험을 나타내는 말이라서 현재완료와 쓸 수 있어요."}, {"n": "③", "en": "just now", "ko": "방금 전", "ok": true, "why": "분명히 지난 과거를 가리켜서 현재완료와 쓸 수 없어요."}, {"n": "④", "en": "several times", "ko": "여러 번", "ok": false, "why": "경험 횟수를 말해서 현재완료와 쓸 수 있어요."}, {"n": "⑤", "en": "during the last weekend", "ko": "지난 주말 동안", "ok": true, "why": "이미 끝난 과거의 기간이라서 현재완료와 쓸 수 없어요."}], "pencil": "just now와 지난 한때(during the last weekend)는 현재완료와 ___", "pencilKey": "쓸 수 없다", "page": 44, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "과거 시제 vs. 현재완료 시제", "type": "write", "ans": "saw, have not seen", "concept": ["055-H1", "054"], "gap": "", "words": [["see", "보다"], ["yesterday", "어제"], ["yet", "아직"], ["haven't seen", "보지 못했다 (원형 see 보다)"]], "h1": "A의 말에는 yesterday(어제)가, B의 말에는 yet(아직)이 있어요. 두 단서가 각각 어떤 시제와 어울리는지 보세요.", "h2": "yesterday는 분명한 과거라서 과거형을 써요. yet은 아직 하지 못한 일을 말하는 현재완료의 단서라서 「have not + 과거분사」예요.", "why": "A는 yesterday가 있어서 과거형 saw, B는 yet이 있어서 현재완료 부정 have not seen을 써요.", "opts": [], "pencil": "yesterday는 과거형, yet은 ___ 의 단서", "pencilKey": "현재완료", "page": 45, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "과거 시제 vs. 현재완료 시제", "type": "write", "ans": "⑤ have been → was", "concept": ["055-H1", "054"], "gap": "", "words": [["department store", "백화점"], ["strange", "이상한"], ["at about 3 o'clock", "3시쯤에"], ["was", "~였다 (원형 be ~이다)"]], "h1": "B의 마지막 말에 'At 3 o'clock?(3시?)'가 있어요. 이 말처럼 정확한 때를 말하는 문장에서 현재완료가 쓰여도 되는지 생각해 보세요.", "h2": "①~⑤ 중 정확한 과거를 가리키는 말(yesterday, at 3 o'clock)이 있는 문장을 찾아요. 그 문장의 시제가 과거인지 확인해 보세요.", "why": "⑤는 at 3 o'clock이라는 분명한 과거 시각이 있어서 have been이 아니라 과거형 was를 써야 해요.", "opts": [], "pencil": "정확한 때(at 3 o'clock)에는 현재완료 대신 ___ 를 쓴다", "pencilKey": "과거 시제", "page": 45, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "현재완료 시제의 용법", "type": "write", "ans": "① am lived → have lived, ③ knew → have known", "concept": ["054", "055-H1"], "gap": "", "words": [["since 2006", "2006년 이래로"], ["for a long time", "오랜 시간 동안"], ["recently", "최근에"], ["foreign", "외국의"]], "h1": "Yeosu 이야기에 since 2006(2006년 이래로)과 for a long time(오랜 시간 동안)이 있어요. 이 단서와 밑줄 친 동사 모양을 비교해 보세요.", "h2": "since와 for는 과거부터 지금까지 이어지는 일에 쓰는 현재완료의 단서예요. ①과 ③ 문장의 동사가 현재완료 모양인지 확인해 보세요.", "why": "①은 am lived가 틀려서 have lived로, ③은 for a long time이 있으니 knew가 아니라 have known으로 고쳐요.", "opts": [], "pencil": "since, for가 있으면 「have/has + ___」", "pencilKey": "과거분사", "page": 45, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "현재완료 시제의 형태와 쓰임", "type": "write", "ans": "Yes, I have.", "concept": ["055-2", "054"], "gap": "", "words": [["Star Wars series", "스타워즈 시리즈"], ["Have you ever seen ~?", "~을 본 적 있니?"], ["exciting", "신나는"]], "h1": "A는 Have you ever seen ~ ?로 물었어요. B의 두 번째 말 'It was really exciting.'으로 보아 봤는지 안 봤는지 생각해 보세요.", "h2": "현재완료 질문에는 같은 have로 대답해요. 3단어로 쓰라고 했으니 Yes, 주어 + have의 모양을 생각해 보세요.", "why": "재미있었다고 했으니 봤다는 뜻이에요. 질문이 Have you ~?라서 Yes, I have.로 대답해요.", "opts": [], "pencil": "Have you ever ~ ?의 긍정 대답은 Yes, I ___ .", "pencilKey": "have", "page": 45, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "현재완료 시제의 형태와 쓰임", "type": "write", "ans": "Have you ever been to", "concept": ["055-2", "054"], "gap": "", "words": [["Bangkok", "방콕"], ["last winter", "지난겨울"], ["been to", "~에 가 본 적이 있는 (원형 be ~이다)"]], "h1": "B가 '방콕에 지난겨울에 갔었다'고 답해요. A는 어떤 질문을 했을지 생각해 보세요. 5단어로 쓴다고 했어요.", "h2": "경험을 묻는 질문 모양을 떠올려 보세요. 단어를 세어 5개가 되는지 확인해 보세요.", "why": "방콕에 가 본 경험을 묻는 질문이라서 Have you ever been to(5단어)가 돼요.", "opts": [], "pencil": "경험을 물을 때는 Have you ever ___ to ~ ?", "pencilKey": "been", "page": 45, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "현재완료 시제의 형태와 쓰임", "type": "write", "ans": "She has worked here for 20 years.", "concept": ["054"], "gap": "", "words": [["work", "일하다"], ["for 20 years", "20년 동안"], ["has worked", "일해 왔다 (원형 work 일하다)"]], "h1": "'일해 왔다'는 과거에 시작해서 지금까지 이어지는 일이에요. 7단어로 쓴다고 했으니 각 단어를 세어 보세요.", "h2": "「주어 + has + 과거분사 + for + 기간」으로 써요. 주어 She에 맞는 have/has를 먼저 고르세요.", "why": "She has worked here for 20 years.는 7단어예요. 기간이 있어서 for를 써요.", "opts": [], "pencil": "기간이 있으면 「has/have + 과거분사 + ___ + 기간」", "pencilKey": "for", "page": 45, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "현재완료 시제의 용법", "type": "write", "ans": "gone → been", "concept": ["054", "055"], "gap": "", "words": [["gone to", "~에 가고 없다 (원형 go 가다)"], ["been to", "~에 가 본 적이 있다 (원형 be ~이다)"], ["Canada", "캐나다"], ["twice", "두 번"]], "h1": "B의 대답이 'I've been there twice.(두 번 가 봤어)'예요. A의 질문이 이 대답과 이어지는지 확인해 보세요.", "h2": "has gone to는 '가고 없다'라서 2인칭 상대에게 물을 수 없어요. 경험을 묻는 알맞은 모양으로 바꿔요.", "why": "have gone to(가고 없다)로 질문하면 대답이 이상해요. 경험을 묻는 been으로 고쳐요.", "opts": [], "pencil": "경험을 물을 때는 have ___ to, 가고 없을 때는 have gone to", "pencilKey": "been", "page": 45, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "현재완료 시제의 형태와 쓰임", "type": "write", "ans": "I have read Matilda twice.", "concept": ["054", "053"], "gap": "", "words": [["Matilda", "마틸다(책 이름)"], ["twice", "두 번"], ["read", "읽다 / 읽은 (과거분사도 read)"]], "h1": "'오늘 다시 읽었다'를 합치면 '지금까지 두 번 읽었다'예요. 5단어로 쓰라고 했어요.", "h2": "경험은 「have + 과거분사」로 써요. read의 과거분사는 원형과 똑같이 read예요. 횟수는 twice를 문장 끝에 써요.", "why": "I have read Matilda twice.는 5단어예요. read의 과거분사는 read예요.", "opts": [], "pencil": "경험은 「have + ___ + 횟수」", "pencilKey": "과거분사", "page": 45, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "현재완료 부정문과 의문문", "type": "mc", "ans": "③, ⑤", "concept": ["055-2", "054"], "gap": "", "words": [["love each other", "서로 사랑하다"], ["for a long time", "오랜 시간 동안"], ["We have loved", "우리는 사랑해 왔다 (원형 love 사랑하다)"]], "h1": "주어진 문장은 We have loved ~ 예요. 부정문과 의문문으로 바꿀 때 have의 위치가 어떻게 달라지는지 떠올려 보세요.", "h2": "부정문은 have 뒤에 not, 의문문은 Have를 주어 앞으로 보내요. 이때 동사는 계속 과거분사(loved)로 두어요.", "why": "부정문은 We have not loved ~ (③), 의문문은 Have we loved ~ ? (⑤)가 알맞아요.", "opts": [{"n": "①", "en": "We did not love each other for a long time.", "ko": "우리는 오랜 시간 서로 사랑하지 않았다.", "ok": false, "why": "과거 시제 부정문이라서 현재완료의 부정문이 아니에요."}, {"n": "②", "en": "We had not loved each other for a long time.", "ko": "우리는 오랜 시간 서로 사랑하지 않았었다.", "ok": false, "why": "had not loved는 과거완료의 부정문이에요."}, {"n": "③", "en": "We have not loved each other for a long time.", "ko": "우리는 오랜 시간 서로 사랑하지 않아 왔다.", "ok": true, "why": "have + not + 과거분사로 현재완료 부정문이에요."}, {"n": "④", "en": "Did we love each other for a long time?", "ko": "우리는 오랜 시간 서로 사랑했니?", "ok": false, "why": "과거 시제 의문문이라서 현재완료의 의문문이 아니에요."}, {"n": "⑤", "en": "Have we loved each other for a long time?", "ko": "우리는 오랜 시간 서로 사랑해 왔니?", "ok": true, "why": "Have + 주어 + 과거분사로 현재완료 의문문이에요."}], "pencil": "현재완료 부정문은 have + ___ + 과거분사", "pencilKey": "not", "page": 46, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "현재완료 용법 구별", "type": "mc", "ans": "①", "concept": ["054", "055"], "gap": "", "words": [["leave the platform", "승강장을 떠나다 (원형 leave 떠나다)"], ["lost", "잃어버린 (lose의 과거분사)"], ["since last weekend", "지난 주말 이래로"]], "h1": "<보기> The train has left the platform.은 열차가 떠나서 지금 없는 결과 용법이에요. 다섯 문장도 각각 용법을 하나씩 정해 보세요.", "h2": "has gone to는 결과, already/just는 완료, never/ever는 경험, since/for는 계속이에요. 결과인 문장이 몇 개인지 세어 보세요.", "why": "결과 용법은 Nick has gone to the library와 The girl has lost her dog at the park, 두 개예요.", "opts": [{"n": "①", "en": "2개", "ko": "두 개", "ok": true, "why": "Nick has gone(가고 없다)와 has lost her dog(개를 잃어버렸다)가 결과예요. 정답이에요."}, {"n": "②", "en": "3개", "ko": "세 개", "ok": false, "why": "has finished already는 완료, never seen은 경험이라서 결과가 아니에요."}, {"n": "③", "en": "4개", "ko": "네 개", "ok": false, "why": "경험, 계속, 완료가 섞여 있어서 결과는 네 개가 아니에요."}, {"n": "④", "en": "5개", "ko": "다섯 개", "ok": false, "why": "모든 문장이 결과 용법은 아니에요."}, {"n": "⑤", "en": "6개", "ko": "여섯 개", "ok": false, "why": "문장이 다섯 개뿐이라서 여섯 개일 수 없어요."}], "pencil": "has gone to, has lost는 ___ 용법이다", "pencilKey": "결과", "page": 46, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "과거와 현재완료 혼합 대화", "type": "mc", "ans": "②, ③, ④", "concept": ["055-H1", "054"], "gap": "", "words": [["Hot Pizza", "핫피자(가게 이름)"], ["eaten", "먹은 (eat의 과거분사)"], ["last Friday", "지난 금요일"], ["When did you ~?", "언제 ~했니?"]], "h1": "밑줄 친 ①~⑤를 하나씩 읽으면서 대화의 앞뒤 단서(Have you ever ~, When did you ~, last Friday)와 시제가 맞는지 확인해 보세요.", "h2": "①은 경험 질문이라 과거분사 맞아요. 하지만 When did you ~ 뒤는 동사원형, last Friday가 있으면 과거형이에요. 이 규칙으로 ②③④를 점검하세요.", "why": "②는 Yes, I have.여야 하고, ③은 did 뒤라서 eat, ④는 last Friday가 있어서 ate로 써야 해요.", "opts": [{"n": "①", "en": "Have you ever eaten at Hot Pizza?", "ko": "너는 핫피자에서 먹어 본 적 있니?", "ok": false, "why": "Have you ever ~ 뒤에는 과거분사 eaten이 맞아요."}, {"n": "②", "en": "Yes, I do.", "ko": "응, 먹어 봤어.", "ok": true, "why": "Have 질문에는 Yes, I have.로 대답해야 해서 틀려요. 정답이에요."}, {"n": "③", "en": "When did you eaten there?", "ko": "너는 거기에서 언제 먹었니?", "ok": true, "why": "did 뒤에는 동사원형 eat가 와야 해서 틀려요. 정답이에요."}, {"n": "④", "en": "My family has eaten there last Friday.", "ko": "우리 가족은 지난 금요일에 거기에서 먹었다.", "ok": true, "why": "last Friday가 있어서 과거형 ate여야 해서 틀려요. 정답이에요."}, {"n": "⑤", "en": "I have never eaten there.", "ko": "나는 거기에서 먹어 본 적이 없다.", "ok": false, "why": "경험이 없다는 현재완료 부정문이라 맞아요."}], "pencil": "When did you ~ 뒤에는 ___ 이 온다", "pencilKey": "동사원형", "page": 46, "sec": "s4"}, {"id": "S4-04", "step": 4, "no": 4, "qtype": "for / since / ago / last 구별", "type": "write", "ans": "(A) last (B) for (C) ago (D) since", "concept": ["054", "055-H1"], "gap": "", "words": [["last summer", "지난여름"], ["ago", "~ 전에"], ["for", "~ 동안"], ["since", "~ 이래로"]], "h1": "빈칸마다 앞뒤 문장의 시제와 뒤에 오는 표현(summer, 7 years, two years, last weekend)을 먼저 확인하세요.", "h2": "(A)와 (C)는 과거 시제 문장이에요. (B)와 (D)는 현재완료 문장이라서 기간에는 for, 시점에는 since를 써요.", "why": "(A) 과거 + summer라서 last, (B) 7 years(기간)라서 for, (C) 과거 + two years라서 ago, (D) last weekend(시점)라서 since예요.", "opts": [], "pencil": "기간은 for, 시점은 ___", "pencilKey": "since", "page": 46, "sec": "s4"}, {"id": "S4-05", "step": 4, "no": 5, "qtype": "현재완료 문장 합치기", "type": "write", "ans": "has used, for", "concept": ["054"], "gap": "", "words": [["bought", "샀다 (원형 buy 사다)"], ["three years ago", "3년 전에"], ["still uses", "아직도 사용한다 (원형 use 사용하다)"], ["smartphone", "스마트폰"]], "h1": "3년 전에 샀고 지금도 쓰고 있어요. 두 문장을 합치면 '3년 동안 써 왔다'는 뜻이에요. 빈칸 3개를 순서대로 생각해 보세요.", "h2": "She has used this smartphone ___ three years. 순서로 채워요. 앞의 두 칸은 have/has + 과거분사, 마지막 칸은 기간 앞에 쓰는 말이에요.", "why": "She has used this smartphone for three years.가 돼요. 3인칭 단수라서 has, use의 과거분사는 used, 기간 앞이라 for예요.", "opts": [], "pencil": "과거부터 지금까지 쓰면 「has/have + ___ + for + 기간」", "pencilKey": "과거분사", "page": 46, "sec": "s4"}, {"id": "S4-06", "st   h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
