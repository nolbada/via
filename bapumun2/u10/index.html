"gap": "", "words": [["get up late", "늦게 일어나다"], ["be late for", "~에 늦다"], ["meeting", "회의"], ["Getting up late", "늦게 일어나서"]], "h1": "Getting up late, I was late for the meeting.에서 밑줄 친 부분이 어떤 관계를 말하는지 앞뒤 내용으로 생각해 보세요.", "h2": "뒤 문장은 '회의에 늦었다'예요. 앞의 '늦게 일어난 일'과 어떤 사이일까요? 시간, 이유, 조건, 양보 중 골라 보세요.", "why": "늦게 일어난 것이 회의에 지각한 이유예요. 그래서 '늦게 일어났기 때문에'라고 해석해요.", "opts": [], "pencil": "분사구문은 문맥을 보고 시간·이유·조건·양보 중 ___을 정한다", "pencilKey": "뜻", "page": 103, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "분사구문의 의미", "type": "write", "ans": "창문을 열었을 때", "concept": ["072-2", "072", "041"], "gap": "", "words": [["open", "열다"], ["window", "창문"], ["strange sound", "이상한 소리"], ["Opening the window", "창문을 열 때"], ["I heard a strange sound", "나는 이상한 소리를 들었다"]], "h1": "Opening the window, I heard a strange sound.에서 밑줄 친 분사구문을 해석하는 문제예요. 앞뒤 일이 어떤 순서로 일어나는지 생각해 보세요.", "h2": "창문을 여는 일과 이상한 소리를 듣는 일이 거의 같은 때에 일어나요. '~할 때'로 해석할 수 있는지 확인하세요.", "why": "창문을 열었을 때 이상한 소리를 들은 거예요. 시간을 나타내는 분사구문이라 '~할 때'로 해석해요.", "opts": [], "pencil": "시간의 분사구문은 '~할 ___'로 해석한다", "pencilKey": "때", "page": 103, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "접속사가 있는 문장으로 전환하기", "type": "write", "ans": "While, waited", "concept": ["072-2", "072", "041"], "gap": "", "words": [["wait for", "~을 기다리다"], ["talk with", "~와 이야기하다"], ["while", "~하는 동안"], ["Waiting for the bus", "버스를 기다리면서"], ["I talked with Jisu", "나는 지수와 이야기했다"], ["because", "~이기 때문에"], ["although", "비록 ~지만"]], "h1": "Waiting for the bus, I talked with Jisu.를 접속사가 있는 문장으로 바꿔요. 보기의 while, because, although 중 뜻이 맞는 접속사를 찾아 보세요.", "h2": "첫 빈칸은 접속사, 둘째 빈칸은 wait(기다리다)의 모양이에요. 주절의 talked(원형 talk 이야기하다)가 과거이니 둘째 빈칸도 같은 시제로 써야 해요.", "why": "버스를 기다리는 동안 이야기한 거예요. 시간의 While과 과거 시제 waited(원형 wait 기다리다)를 써요.", "opts": [], "pencil": "분사구문을 부사절로 바꿀 때 시제는 ___와 같게 쓴다", "pencilKey": "주절", "page": 103, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "접속사가 있는 문장으로 전환하기", "type": "write", "ans": "Because [As] I thought", "concept": ["072-2", "072", "043"], "gap": "", "words": [["thinking", "생각하면서"], ["asleep", "잠든"], ["quietly", "조용히"], ["Thinking my mother was asleep", "어머니가 주무신다고 생각해서"], ["I walked quietly", "나는 조용히 걸었다"], ["Because", "~이기 때문에"]], "h1": "Thinking my mother was asleep, I walked quietly.를 Because나 As로 시작하는 문장으로 바꿔요. 빈칸에는 접속사와 주어, 동사가 모두 들어가요.", "h2": "주절의 주어가 I이고 시제가 과거(walked, 원형 walk 걷다)예요. 분사구문에서 사라졌던 주어와 think(생각하다)의 알맞은 시제를 써 보세요.", "why": "어머니가 주무신다고 생각했기 때문에 조용히 걸은 거예요. 이유의 Because [As] 뒤에 주어 I와 과거형 thought(원형 think 생각하다)를 써요.", "opts": [], "pencil": "분사구문을 부사절로 바꿀 때 빠진 ___를 다시 써 준다", "pencilKey": "주어", "page": 103, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "분사구문 만들기", "type": "mc", "ans": "⑤", "concept": ["072"], "gap": "", "words": [["go home", "집에 가다"], ["wise", "현명한"], ["lonely", "외로운"], ["Being", "~이므로 (be동사의 분사구문)"], ["As he was a wise man", "그가 현명한 사람이었기 때문에"]], "h1": "다섯 문장 중에서 부사절을 분사구문으로 바꾼 모양이 잘못된 것을 찾아야 해요. 각 문장에서 접속사와 주어가 어떻게 되었는지, 동사 모양이 -ing인지 확인하세요.", "h2": "특히 be동사(was)가 있던 문장은 분사구문에서 Being이 되는데, Being을 생략해도 되는 때가 정해져 있어요. 어떤 말이 뒤에 올 때인지 생각해 보세요.", "why": "⑤는 As he was a wise man에서 was(원형 be ~이다)가 사라진 채 A wise man이 되어 틀려요. 뒤에 분사가 오지 않고 명사가 오면 Being을 생략할 수 없어서 Being a wise man이어야 해요.", "opts": [{"n": "①", "en": "When she saw me, she said hello. = When seeing me, she said hello.", "ko": "그녀는 나를 보았을 때 인사했다.", "ok": false, "why": "접속사를 남기고 saw를 seeing으로 바꾼 분사구문이라 맞아요."}, {"n": "②", "en": "While he was going home, he met her. = While going home, he met her.", "ko": "그는 집에 가는 동안 그녀를 만났다.", "ok": false, "why": "접속사를 남기고 was를 뺀 모양이라 맞아요."}, {"n": "③", "en": "When she feels lonely, she plays the cello. = Feeling lonely, she plays the cello.", "ko": "그녀는 외로울 때 첼로를 켠다.", "ok": false, "why": "접속사를 빼고 feel(느끼다)을 feeling으로 바꿔 맞아요."}, {"n": "④", "en": "Because she was hungry, she ate the soup. = Being hungry, she ate the soup.", "ko": "그녀는 배고파서 수프를 먹었다.", "ok": false, "why": "be동사를 Being으로 바꾼 맞는 문장이에요."}, {"n": "⑤", "en": "As he was a wise man, he thought of a good plan. = A wise man, he thought of a good plan.", "ko": "그는 현명한 사람이라서 좋은 계획을 떠올렸다.", "ok": true, "why": "명사 앞의 Being은 생략할 수 없어서 틀려요."}], "pencil": "Being은 뒤에 ___가 올 때만 생략할 수 있다", "pencilKey": "분사", "page": 104, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "분사구문의 부정과 생략", "type": "mc", "ans": "①, ③", "concept": ["072", "043"], "gap": "", "words": [["enough money", "충분한 돈"], ["couldn't", "~할 수 없었다"], ["shoes", "신발"], ["never", "결코 ~하지 않는"], ["Not having", "가지고 있지 않아서"]], "h1": "우리말 'Christine은 돈이 충분하지 않아서 새 신발을 살 수 없었다'를 영어로 바르게 쓴 것을 모두 골라야 해요. 원인과 결과가 어느 쪽인지 먼저 정하세요.", "h2": "이유를 나타내는 접속사로 쓴 문장과 부정의 분사구문(분사 앞에 not이나 never)으로 쓴 문장을 찾아 보세요. 접속사 뜻과 원인·결과 순서도 확인하세요.", "why": "①은 이유의 접속사 as로 썼고, ③은 부정의 분사구문 Not having으로 썼어요. 둘 다 '돈이 없어서 신발을 못 샀다'는 뜻이에요.", "opts": [{"n": "①", "en": "As Christine didn't have enough money, she couldn't buy new shoes.", "ko": "Christine은 돈이 충분하지 않아서 새 신발을 살 수 없었다.", "ok": true, "why": "이유의 as를 써서 뜻이 맞아요."}, {"n": "②", "en": "Before Christine didn't have enough money, she couldn't buy new shoes.", "ko": "Christine은 돈이 충분하지 않기 전에 새 신발을 살 수 없었다.", "ok": false, "why": "Before는 '~하기 전에'라서 뜻이 어색해요."}, {"n": "③", "en": "Not having enough money, Christine couldn't buy new shoes.", "ko": "돈이 충분하지 않아서 Christine은 새 신발을 살 수 없었다.", "ok": true, "why": "Not 뒤에 현재분사가 있는 부정의 분사구문이라 맞아요."}, {"n": "④", "en": "Having enough money, Christine never could buy new shoes.", "ko": "돈이 충분해서 Christine은 결코 새 신발을 살 수 없었다.", "ok": false, "why": "부정이 아니라서 뜻이 반대가 돼요."}, {"n": "⑤", "en": "Because Christine couldn't buy new shoes, she didn't have enough money.", "ko": "Christine은 새 신발을 살 수 없어서 돈이 충분하지 않았다.", "ok": false, "why": "원인과 결과가 거꾸로예요."}], "pencil": "분사구문의 부정은 ___ + -ing 순서이다", "pencilKey": "Not", "page": 104, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "분사구문의 의미", "type": "mc", "ans": "①, ②", "concept": ["072-2", "072", "043"], "gap": "", "words": [["find", "찾다"], ["key", "열쇠"], ["get into", "~안으로 들어가다"], ["Not finding the key", "열쇠를 찾지 못해서"], ["he couldn't get into his house", "그는 집에 들어갈 수 없었다"], ["Because", "~이기 때문에"]], "h1": "Not finding the key, he couldn't get into his house.는 '열쇠를 못 찾아서 집에 못 들어갔다'는 뜻이에요. 앞과 뒤가 어떤 관계인지 정하고 접속사를 모두 고르세요.", "h2": "빈칸 뒤가 he didn't find the key라는 부정문이에요. 이유를 나타내는 접속사가 둘 있어요. If를 쓰면 왜 뜻이 달라지는지도 생각해 보세요.", "why": "열쇠를 못 찾은 것이 집에 못 들어간 이유예요. 이유의 As와 Because가 알맞아요.", "opts": [{"n": "①", "en": "As", "ko": "~이므로", "ok": true, "why": "이유를 나타내서 맞아요."}, {"n": "②", "en": "Because", "ko": "~이기 때문에", "ok": true, "why": "이유를 나타내서 맞아요."}, {"n": "③", "en": "Before", "ko": "~하기 전에", "ok": false, "why": "시간 순서를 말해 어색해요."}, {"n": "④", "en": "Though", "ko": "비록 ~지만", "ok": false, "why": "양보라 뜻이 반대가 돼요."}, {"n": "⑤", "en": "If", "ko": "만약 ~라면", "ok": false, "why": "조건이라 이미 일어난 일과 맞지 않아요."}], "pencil": "이유를 나타내는 접속사는 As 또는 ___이다", "pencilKey": "Because", "page": 104, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "분사구문의 의미", "type": "mc", "ans": "①", "concept": ["072-2", "072", "042"], "gap": "", "words": [["turn left", "왼쪽으로 돌다"], ["pharmacy", "약국"], ["unless", "~하지 않는다면"], ["Turning left", "왼쪽으로 돌면"], ["you'll see the pharmacy", "너는 약국을 볼 것이다"]], "h1": "Turning left, you'll see the pharmacy.는 '왼쪽으로 돌면 약국이 보일 거예요'라는 뜻이에요. 보기 중에서 같은 뜻을 가진 문장을 찾으세요.", "h2": "분사구문이 어떤 관계를 나타내는지 정한 다음, 그 관계의 접속사로 쓴 문장을 찾으세요. 문법이 틀린 문장은 먼저 지워도 돼요.", "why": "왼쪽으로 도는 것이 약국을 볼 조건이에요. 조건의 If를 써서 If you turn left, you'll see the pharmacy.가 같은 뜻이에요.", "opts": [{"n": "①", "en": "If you turn left, you'll see the pharmacy.", "ko": "왼쪽으로 돌면 약국이 보일 것이다.", "ok": true, "why": "조건의 If를 써서 뜻이 같아요."}, {"n": "②", "en": "As you don't turn left, you'll see the pharmacy.", "ko": "왼쪽으로 돌지 않으므로 약국이 보일 것이다.", "ok": false, "why": "부정이 되어 뜻이 달라져요."}, {"n": "③", "en": "You turn left, but you'll see the pharmacy.", "ko": "왼쪽으로 돌지만 약국이 보일 것이다.", "ok": false, "why": "but은 서로 반대되는 내용을 이어서 어색해요."}, {"n": "④", "en": "Unless you turn left, you'll see the pharmacy.", "ko": "왼쪽으로 돌지 않으면 약국이 보일 것이다.", "ok": false, "why": "Unless는 '~하지 않으면'이라 뜻이 반대예요."}, {"n": "⑤", "en": "You turning left, and see the pharmacy.", "ko": "(문법이 맞지 않는 문장)", "ok": false, "why": "주어와 동사가 맞지 않아 틀려요."}], "pencil": "조건을 나타내는 분사구문은 접속사 ___로 바꿀 수 있다", "pencilKey": "If", "page": 104, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "접속사가 있는 문장으로 전환하기", "type": "mc", "ans": "④", "concept": ["072-2", "072", "041"], "gap": "", "words": [["police officer", "경찰관"], ["scold", "꾸짖다"], ["gallery", "미술관"], ["saw", "보았다 (원형 see 보다)"], ["Visiting the gallery", "미술관을 방문했을 때"], ["I saw many great paintings", "나는 훌륭한 그림을 많이 보았다"], ["If I visited", "내가 방문했다면"], ["When I visited", "내가 방문했을 때"]], "h1": "분사구문을 부사절로 바꾼 것 중 '옳지 않은' 것을 찾아야 해요. 각 문장의 앞뒤 뜻을 보고 알맞은 접속사와 시제가 쓰였는지 확인하세요.", "h2": "주절이 과거(saw, 원형 see 보다)인데 부사절이 어떤 접속사와 시제로 되어 있는지 봐요. '미술관을 방문했을 때'라는 뜻에 어울리는 접속사는 무엇일까요?", "why": "④ Visiting the gallery, I saw many great paintings.는 '미술관을 방문했을 때 훌륭한 그림을 많이 봤다'는 시간의 뜻이에요. If I visited가 아니라 When I visited로 바꿔야 해요.", "opts": [{"n": "①", "en": "Seeing the police officer, he ran away. = When he saw the police officer", "ko": "경찰관을 보았을 때 그는 도망쳤다.", "ok": false, "why": "시간의 When과 과거 시제라 알맞아요."}, {"n": "②", "en": "Having dinner, she watched a show. = While she was having dinner", "ko": "저녁을 먹는 동안 그녀는 쇼를 보았다.", "ok": false, "why": "동시에 하는 일이라 While과 진행형이 알맞아요."}, {"n": "③", "en": "Being late, she was scolded by her teacher. = Because she was late", "ko": "늦어서 그녀는 선생님께 혼났다.", "ok": false, "why": "이유의 Because와 과거 시제라 알맞아요."}, {"n": "④", "en": "Visiting the gallery, I saw many great paintings. = If I visited the gallery", "ko": "미술관을 방문했다면 나는 훌륭한 그림을 많이 보았을 것이다.", "ok": true, "why": "시간의 뜻인데 조건의 If를 써서 옳지 않아요."}, {"n": "⑤", "en": "Listening to the music, she studied English. = While she was listening to the music", "ko": "음악을 들으면서 그녀는 영어를 공부했다.", "ok": false, "why": "동시에 하는 일이라 While과 진행형이 알맞아요."}], "pencil": "'~할 때'의 분사구문은 부사절로 바꿀 때 ___를 쓴다", "pencilKey": "When", "page": 104, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qty  var d=its[st.idx],r=rec(d.id);
 var h='<div class="nums">';
 its.forEach(function(x,i){var rr=rec(x.id);h+='<button class="nb'+(i===st.idx?' cur':'')+(rr.done?(rr.right?' ok':' ng'):'')+'" onclick="goIdx('+i+')">'+x.no+'</button>'});
 h+='<button class="nb" onclick="goIdx('+its.length+')" title="결과">결과</button></div>';
 h+='<div class="card"><span class="tag">'+esc(STEPS[st.tab].name)+' · '+d.no+'번</span><div class="qt">'+esc(d.qtype)+(d.page?' · 교재 '+d.page+'쪽':'')+'</div>';
 if(!r.done){
  h+='<button class="btn s" onclick="useHint(\''+d.id+'\',1)">'+(r.h>=1?'먼저 볼 것 (열려 있어요)':'먼저 볼 것 보기')+'</button>';
  if(r.h>=1){
   h+='<div class="hint">'+hl(d.h1)+'</div>';
   if(d.words&&d.words.length){h+='<div class="lab">단어 뜻</div><div class="chips">'+d.words.map(function(w){return '<span><b>'+esc(w[0])+'</b> '+esc(w[1])+'</span>'}).join("")+'</div>'}
   if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
   if(r.h<2)h+='<button class="btn g" onclick="useHint(\''+d.id+'\',2)">아직 막혀요 · 한 걸음 더</button>';
  }
  if(r.h>=2)h+='<div class="hint two">'+hl(d.h2)+'</div>';
  if(d.type==="mc"){
   var labs=d.opts.map(function(o){return o.n});
   var multi=d.ans.indexOf(",")>=0,sel=r.sel||[];
   h+='<div class="choices'+(labs.length===2?' two':'')+'">'+labs.map(function(l){return '<button class="ch" style="'+(multi&&sel.indexOf(l)>=0?'background:var(--soft);border-color:var(--a)':'')+'" onclick="'+(multi?'tog':'pick')+'(\''+d.id+'\',\''+l+'\')">'+esc(l)+'</button>'}).join("")+'</div>';
   h+=multi?'<div class="meter">정답이 두 개예요. 모두 누른 뒤 확인을 눌러요</div><button class="btn p" onclick="confirmMulti(\''+d.id+'\')">확인</button>':'<div class="meter">책의 답을 골라 누르면 바로 확인돼요</div>';
  }else{
   h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div>';
   h+='<button class="btn p" onclick="showW(\''+d.id+'\')">정답 확인</button>';
  }
 }else{
  h+=answerView(d,r);
 }
 h+='</div>';
 h+='<div class="nav">'+(st.idx>0?'<button class="btn g" onclick="goIdx('+(st.idx-1)+')">이전</button>':'')+'<button class="btn p" onclick="goIdx('+(st.idx+1)+')">'+(st.idx+1>=its.length?'결과 보기':'다음 문제')+'</button></div>';
 app.innerHTML=h;
}
function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
