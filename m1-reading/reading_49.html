nds—just like us!\" said Jo. El smiled.","El planted the flowers in her garden. It was growing season. All summer long, she cared for them.","On the last day of summer, Jo came to El's house. El and Jo ran to the garden and suddenly stopped. Something was DIFFERENT! There were flowers on the aster ... and El grew TALLER, TOO!"];var PASS_KO=["성장하는 시기","El과 Jo는 반에서 가장 작은 학생들이었다. 그들은 항상 함께였다. 그들은 혼자서는 화분에 닿을 수 없었기 때문에 심지어는 교실에서 함께 식물에 물을 주기도 했다.","하지만 봄에는 무언가가 달라졌다. Jo의 키가 더 커졌다! Jo는 El보다 키가 더 컸고, 그래서 Jo는 혼자 식물에 물을 줄 수 있었다. El은 매일 더 작아지는 기분이었다.","학교 마지막 날에 Diaz 선생님이 말씀하셨다. \"여러분, 꽃을 하나 집에 가져가서 여름 동안 돌보세요.\" 모든 학생이 창문으로 달려갔다. El의 학급 친구들은 작은 El 너머 화분에 손을 뻗었다. 그들은 형형색색의 꽃이 있는 화분을 모두 가져갔다.","El은 마지막 화분을 가져갔다. 그것은 꽃이 없는 가장 작은 식물을 가지고 있었다. \"나도 너와 같은 심정이야, 작은 식물아.\" El이 말했다. Diaz 선생님이 El을 보며 말씀하셨다. \"그것은 과꽃 식물이야. 시간이 지나면, 그것은 자라서 아름다운 꽃을 피울 거야.\"","\"하지만 그것은 작은 녹색 식물일 뿐이에요.\" El이 말했다. 그녀는 확신이 없었다.","\"너는 내 백일홍을 가져도 돼.\" Jo가 El에게 말했다. \"나는 여름 내내 할머니 댁에 있을 거야.\"","\"내가 내 과꽃과 너의 백일홍을 나란히 심을게.\" El이 말했다.","\"그것들은 좋은 친구가 될 거야—바로 우리처럼!\" Jo가 말했다. El은 미소 지었다.","El은 그녀의 정원에 꽃들을 심었다. 성장하는 시기였다. 여름 내내 그녀는 그것들을 돌보았다.","여름의 마지막 날, Jo가 El의 집에 왔다. El과 Jo는 정원으로 달려가다가 갑자기 멈췄다. 무엇인가가 달라졌다! 과꽃에 꽃들이 있었다 ... 그리고 El도 키가 더 커졌다!"];var DG=[{"qs":[{"n":1,"q":"위 대화에서 Isaac이 걱정하는 이유로 알맞은 것은?","o":["그의 개가 요즘 많이 먹지 않아서","그의 개가 집을 나가 버려서","시험을 잘 보지 못해서","남동생이 게임을 너무 많이 해서","내일 농구 경기가 있어서"],"a":0,"ans":"그의 개가 요즘 많이 먹지 않아서","evs":[["I'm worried about my dog. He isn't eating a lot these days.","내 개가 걱정돼. 요즘 많이 먹지 않아."]],"ev":["I'm worried about my dog. He isn't eating a lot these days.","내 개가 걱정돼. 요즘 많이 먹지 않아."],"ow":["정답 ○ — Isaac이 'I'm worried about my dog. He isn't eating a lot these days.'(내 개가 걱정돼. 요즘 많이 먹지 않아.)라고 했으므로 개가 잘 먹지 않아서 걱정하는 것이다.","오답 ✕ — 대화에서 개는 'isn't eating a lot'(많이 먹지 않는다)라고 했지, 집을 나갔다는 말은 없어서 틀림.","오답 ✕ — 시험 이야기는 다른 대화에 나오고, 이 대화에서는 'I'm worried about my dog.'(내 개가 걱정돼.)라고 해서 틀림.","오답 ✕ — 남동생의 게임은 다른 대화의 내용이고, 이 대화에서 Isaac은 'I'm worried about my dog.'(내 개가 걱정돼.)라고 해서 틀림.","오답 ✕ — 농구 경기
