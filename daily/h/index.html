<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>데일리보카 H</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1f2a24;--sub:#6b766f;--line:#dfe4de;--pri:#2f7d5b;--priInk:#fff;--ok:#2f7d5b;--okBg:#e4f3ea;--ng:#c0392b;--ngBg:#fbe9e6;--hi:#fff3cf;--star:#d9a400}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d231f;--ink:#e8eee9;--sub:#97a39b;--line:#2f3832;--pri:#4fb98a;--priInk:#0e1612;--ok:#58c28f;--okBg:#183024;--ng:#ec7a6c;--ngBg:#3a1f1b;--hi:#3a3216;--star:#f0c030}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.55}
#app{max-width:680px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:22px;margin:8px 0 0}
.subt{color:var(--sub);margin:2px 0 14px;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-weight:600}
.btn.pri{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row .btn{flex:1;min-width:130px}
.prog{font-size:14px;color:var(--sub);margin:4px 0 10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pri)}
.wk{margin:14px 0 4px;font-size:13px;color:var(--sub);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 2px;min-height:62px;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px}
.day b{font-size:13px}
.day.done{border-color:var(--pri);background:var(--okBg)}
.day.next{border:2px solid var(--pri);box-shadow:0 0 0 3px var(--okBg)}
.stamp{width:34px;height:34px;border-radius:50%;border:2px solid var(--pri);color:var(--pri);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.day small{color:var(--sub);font-size:10px;line-height:1.1}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .t{flex:1;font-size:14px;color:var(--sub)}
.sbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:14px}
.sbtn.on{color:var(--star);border-color:var(--star);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 0}
.tag{display:inline-block;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-bottom:8px}
.prompt{font-weight:700;margin:0 0 10px}
.stem{font-size:17px;margin:0 0 12px;padding:10px 12px;background:var(--bg);border-radius:10px;word-break:keep-all;overflow-wrap:anywhere}
u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.ch{display:flex;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin:7px 0;font-size:16px;align-items:flex-start}
.ch .n{font-weight:700;color:var(--sub);min-width:20px}
.ch.sel{border-color:var(--pri);background:var(--okBg)}
.ch.ok{border-color:var(--ok);background:var(--okBg)}
.ch.ng{border-color:var(--ng);background:var(--ngBg)}
.ch:disabled{opacity:1;color:inherit}
input.tx{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input.tx.ok{border-color:var(--ok);background:var(--okBg)}input.tx.ng{border-color:var(--ng);background:var(--ngBg)}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--okBg)}.fb.ng{background:var(--ngBg)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb .x{white-space:pre-wrap;margin:6px 0 0}
.fb .l{font-size:12px;color:var(--sub);margin-top:8px}
.nb{width:100%;margin-top:12px}
.score{font-size:40px;font-weight:800;margin:8px 0}
.wl{margin:0;padding:0;list-style:none}
.wl li{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.empty{color:var(--sub);text-align:center;padding:28px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D={"level":"H","sets":[{"day":1,"q":[{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"perceive","a":"1","e":"perceive (동) 인지하다 - perception (명) 인지\n① acquire (동) 습득하다 - acquisition (명) 습득","w":"② subtle (형) 미묘한 - subtly (부) 미묘하게\n③ arrogant (형) 오만한 - arrogance (명) 오만함\n④ valid (형) 유효한 - validate (동) 입증하다","m":0,"s":"perceive - perception","c":["acquire - acquisition","subtle - subtly","arrogant - arrogance","valid - validate"]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"extent","a":"2","e":"② extent: 정도, 규모, 범위","w":"① cuisine: 요리, 요리법\n③ murder: 살인\n④ deficiency: 부족, 결핍","m":0,"s":"\"정도, 범위\"","c":["cuisine","extent","murder","deficiency"]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"evacuate","a":"1","e":"① evacuate: 대피시키다, 비우다","w":"② 작동하다, 운영하다 (operate)\n③ 일치하다, 부합하다 (correspond)\n④ 끌어올리다, 높이다 (elevate)","m":0,"s":"evacuate","c":["대피시키다, 비우다","작동하다, 운영하다","일치하다, 부합하다","끌어올리다, 높이다"]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"novel","a":"novel","e":"novel (형) 참신한, 새로운 / (명) 소설","k":"과학자들은 해양의 플라스틱 폐기물을 줄이기 위해 참신한 접근법을 제안했다.\n그녀는 비 오는 오후를 가장 좋아하는 작가가 쓴 소설에 몰입해서 보냈다.","m":0,"s":"Scientists proposed a n______ approach to reduce plastic waste in the ocean.\nShe spent the rainy afternoon absorbed in a n______ written by her favorite author."},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"criticize","a":"4","e":"④ criticize: 비판하다, 비난하다 (누군가나 무언가에 대해 못마땅함을 나타내다)","w":"① fade: 바래다, 희미해지다\n② institute: 도입하다, 설립하다\n③ counsel: 상담하다, 조언하다","k":"누군가나 무언가에 대해 못마땅함을 나타내다","m":0,"s":"\"to express disapproval of someone or something\"","c":["fade","institute","counsel","criticize"]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"toxic","a":"1","e":"① toxic: 유독한, 독성이 있는 (생물에게 유독하거나 해로운)","w":"② hostile: 적대적인\n③ neutral: 중립적인\n④ decent: 괜찮은, 품위 있는","k":"생물에게 유독하거나 해로운","m":0,"s":"\"poisonous or harmful to living things\"","c":["toxic","hostile","neutral","decent"]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"prior","a":"1","e":"① prior: 이전의, 사전의 (학생들은 수업 토론 전에 그 챕터를 미리 읽어야 한다.)","w":"② minimal: 최소의\n③ enough: 충분한\n④ sacred: 신성한","k":"학생들은 수업 토론 전에 그 챕터를 미리 읽어야 한다.","m":0,"s":"Students must read the chapter _______ to the class discussion.","c":["prior","minimal","enough","sacred"]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"headquarters","a":"3","e":"③ headquarters: 본부, 본사 (그 거대한 글로벌 기술 기업은 새로운 대형 본사 건물을 지었다.)","w":"① consequence: 결과\n② greed: 탐욕, 욕심\n④ hook: 갈고리","k":"그 거대한 글로벌 기술 기업은 새로운 대형 본사 건물을 지었다.","m":0,"s":"The huge global tech company built a massive new _______ building.","c":["consequence","greed","headquarters","hook"]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"reveal","a":"4","e":"④ conceal: 숨기다 (그 보고서는 진실을 밝힐 것이다.) / reveal(폭로하다, 밝히다)의 반의어.","w":"① handle: 다루다, 처리하다\n② upgrade: 개선하다\n③ jail: 수감하다","k":"그 보고서는 진실을 밝힐 것이다.","m":0,"s":"The report will reveal the truth.","h":"reveal","c":["handle","upgrade","jail","conceal"]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"logical","a":"1","e":"① illogical: 비논리적인 (그의 주장은 완전히 논리적이었다.) / logical(논리적인)의 반의어.","w":"② fatal: 치명적인\n③ delicate: 연약한, 섬세한\n④ brutal: 잔혹한","k":"그의 주장은 완전히 논리적이었다.","m":0,"s":"His argument was completely logical.","h":"logical","c":["illogical","fatal","delicate","brutal"]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"vast","a":"1,3","e":"① huge: 거대한\n③ enormous: 거대한 (그 사막은 그 나라의 광대한 지역에 걸쳐 뻗어 있다.) / vast(거대한, 막대한)의 유의어.","w":"② linguistic: 언어의\n④ welcome: 반가운, 환영받는","k":"그 사막은 그 나라의 광대한 지역에 걸쳐 뻗어 있다.","m":2,"s":"The desert stretches across a vast area of the country.","h":"vast","c":["huge","linguistic","enormous","welcome"]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd" ginalize: 소외시키다, 주변부로 밀어내다 (불공정한 주택 정책은 가난한 지역사회를 계속 소외시키고 기본적인 서비스에 대한 접근을 제한한다.)","w":"② assimilate: 동화시키다, 흡수하다\n③ empower: 권한을 주다, 자율권을 주다\n④ subsidize: 보조금을 지급하다","k":"불공정한 주택 정책은 가난한 지역사회를 계속 소외시키고 기본적인 서비스에 대한 접근을 제한한다.","m":0,"s":"Unfair housing policies continue to ________ poor communities and restrict their access to basic services.","c":["marginalize","assimilate","empower","subsidize"]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"catalyzed","a":"4","e":"④ catalyzed: 촉발하다, 촉매 역할을 하다 (catalyze의 과거형) (저렴한 디지털 카메라의 등장은 사진 산업 전반에 걸쳐 광범위한 변화를 촉발했다.)","w":"① impeded: 방해하다, 지연시키다 (impede의 과거형)\n② reversed: 뒤집다, 역전시키다 (reverse의 과거형)\n③ stalled: 정체시키다, 멈추게 하다 (stall의 과거형)","k":"저렴한 디지털 카메라의 등장은 사진 산업 전반에 걸쳐 광범위한 변화를 촉발했다.","m":0,"s":"The arrival of cheap digital cameras ________ sweeping changes throughout the photography industry.","c":["impeded","reversed","stalled","catalyzed"]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"infer","a":"2,4","e":"② deduce: 추론하다, 연역하다\n④ surmise: 추측하다, 짐작하다 (도구에 남은 마모 흔적으로부터 고고학자들은 그 고대 작업장이 어떻게 사용되었는지 추론할 수 있었다.) / infer(추론하다, 추측하다)의 유의어.","w":"① affirm: 단언하다, 확언하다\n③ recount: 이야기하다, 자세히 말하다","k":"도구에 남은 마모 흔적으로부터 고고학자들은 그 고대 작업장이 어떻게 사용되었는지 추론할 수 있었다.","m":2,"s":"From the wear on the tools, archaeologists could infer how the ancient workshop had been used.","h":"infer","c":["affirm","deduce","recount","surmise"]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"liberal","a":"3","e":"③ conservative: 보수적인 (그 신문은 50년 넘게 이민 문제에 대해 일관되게 진보적인 입장을 취해 왔다.) / liberal(진보적인, 개방적인)의 반의어.","w":"① progressive: 진보적인(유의어 함정)\n② radical: 급진적인(유의어 함정)\n④ tolerant: 관대한, 아량 있는(유의어 함정)","k":"그 신문은 50년 넘게 이민 문제에 대해 일관되게 진보적인 입장을 취해 왔다.","m":0,"s":"The newspaper has taken a consistently liberal position on immigration for over fifty years.","h":"liberal","c":["progressive","radical","conservative","tolerant"]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 ropaganda","censorship","plagiarism","defamation"]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"infringe","a":"1","e":"① violate: 침해하다, 위반하다 (법원은 그 새로운 데이터 수집 법이 일반 시민들의 기본권을 침해할 것이라고 판결했다.) / infringe(침해하다, 위반하다)의 유의어.","w":"② observe: (법·규칙을) 준수하다\n③ waive: (권리를) 포기하다, 면제하다\n④ contest: 이의를 제기하다, 다투다","k":"법원은 그 새로운 데이터 수집 법이 일반 시민들의 기본권을 침해할 것이라고 판결했다.","m":0,"s":"The court ruled that the new data-collection law would infringe the basic rights of ordinary citizens.","h":"infringe","c":["violate","observe","waive","contest"]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"command","a":"4","e":"①명령, 지시 / ②명령, 지시 / ③명령, 지시 / ④(언어) 구사 능력 [④번만 의미가 다름]","k":"① 그 장군은 해가 지기 전에 철수하라는 분명한 명령을 내렸다.\n② 군인들은 주저 없이 모든 명령을 수행하도록 훈련받는다.\n③ 함장은 그 명령을 몇 초 만에 전 승무원에게 전달했다.\n④ 세 개 외국어를 자유자재로 구사하는 그녀의 뛰어난 능력은 면접관들에게 깊은 인상을 남겼다.","m":0,"c":["The general issued a clear command to withdraw before nightfall.","Soldiers are trained to carry out every command without hesitation.","The captain relayed the command to the entire crew within seconds.","Her remarkable command of three foreign languages impressed the interview panel."],"hc":"command|command|command|command"}]},{"day":24,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"cynical","a":"4","e":"④ skeptical: 회의적인 (자선 단체의 진짜 동기에 대한 그의 냉소적인 발언은 회의에 참석한 여러 자원봉사자들의 기분을 상하게 했다.) / cynical(냉소적인, 비꼬는)의 유의어.","w":"① solemn: 엄숙한, 근엄한\n② apathetic: 무관심한, 심드렁한\n③ wistful: 아쉬워하는, 애틋한","k":"자선 단체의 진짜 동기에 대한 그의 냉소적인 발언은 회의에 참석한 여러 자원봉사자들의 기분을 상하게 했다.","m":0,"s":"His cynical remarks about the charity's true motives offended several volunteers at the meeting.","h":"cynical","c":["solemn","apathetic","wistful","skeptical"]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"trajectory","a":"trajectory","e":"trajectory 궤적, 발전 방향","k":"그 나라의 경제 궤적은 지난 10년 동안 꾸준히 상승해 왔다.","m":0,"s":"The country's economic t______ has idely respected for making fair decisions.","Both teams agreed that the new rules were completely fair.","We still have a fair amount of work left before the deadline.","She complained that the punishment was not fair at all."],"hc":"fair|fair|fair|fair"}]},{"day":36,"q":[{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"exhale","a":"1","e":"① inhale: 숨을 들이쉬다 (요가 강사는 우리에게 입으로 천천히 숨을 내쉬라고 말했다.) / exhale(숨을 내쉬다)의 반의어.","w":"② swallow: 삼키다\n③ sigh: 한숨 쉬다\n④ pant: 헐떡거리다","k":"요가 강사는 우리에게 입으로 천천히 숨을 내쉬라고 말했다.","m":0,"s":"The yoga instructor told us to exhale slowly through the mouth.","h":"exhale","c":["inhale","swallow","sigh","pant"]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"foreshadowing","a":"2","e":"② foreshadowing: (이야기 초반에 주어지는 암시 / 나중에 일어날 어떤 일에 대한) 복선","w":"① trope: 비유, 전형적인 수사\n③ motif: 주제, 모티프\n④ verse: 운문, 시구","k":"이야기 초반에 주어지는 암시 / 나중에 일어날 어떤 일에 대한","m":0,"s":"\"a hint given early in a story about something that will happen later\"","c":["trope","foreshadowing","motif","verse"]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"extinction","a":"extinction","e":"extinction 멸종","k":"서식지의 상실은 종종 종의 갑작스러운 멸종을 초래한다.","m":0,"s":"Loss of habitat often results in the sudden e______ of a species."},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"descent","a":"4","e":"④ ascent: 상승, 오르기 (등반가들은 폭풍이 닥치기 직전에 천천히 하강을 시작했다.) / descent(하강, 내려가기)의 반의어.","w":"① plunge: 급락, 추락\n② slope: 경사지, 비탈\n③ dip: 하락, 내려감","k":"등반가들은 폭풍이 닥치기 직전에 천천히 하강을 시작했다.","m":0,"s":"The climbers began their slow descent just before the storm arrived.","h":"descent","c":["plunge","slope","dip","ascent"]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"socialization","a":"1","e":"① socialization: (과정 / 그것을 통해 아이들이 가치관과 행동을 배우는 / 그들의 사회가 그들에게 기대하는) 사회화","w":"② standardization: 표준화\n③ internalization: 내면화\n④ urbanization: 도시화","k":"과정 / 그것을 통해 아이들이 가치관과 행 e world consistently ________ the director's innovative vision, calling it a masterpiece.","c":["deride","chastise","disparage","extol"]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"select","a":"select","e":"select (동) 선택하다, 고르다 / (형) 엄선된, 훌륭한","k":"그 위원회는 200명이 넘는 지원자 중에서 단 세 명의 최종 후보만을 선발할 것이다.\n그 가게는 단 하나의 유기농 농장에서 직송된 엄선된 과일만을 판다.","m":0,"s":"The committee will s______ only three finalists from more than two hundred applicants.\nThe store sells s______ fruits that are shipped directly from a single organic farm."},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"uncover","a":"1","e":"① expose: 폭로하다, 드러내다 (기자들은 그 스캔들 뒤에 있는 진실을 밝혀내기 위해 몇 달 동안 일했다.) / uncover(밝혀내다, 드러내다)의 유의어.","w":"② disguise: 변장시키다, 위장하다\n③ camouflage: 위장하다\n④ misinterpret: 잘못 해석하다","k":"기자들은 그 스캔들 뒤에 있는 진실을 밝혀내기 위해 몇 달 동안 일했다.","m":0,"s":"The journalists worked for months to uncover the truth behind the scandal.","h":"uncover","c":["expose","disguise","camouflage","misinterpret"]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"holistic","a":"3","e":"③ holistic: 전체적인, 통합적인","w":"① inductive: 귀납적인\n② quantitative: 정량적인, 수량의\n④ reciprocal: 상호 간의, 호혜적인","m":0,"s":"holistic","c":["귀납적인","정량적인, 수량의","전체적인, 통합적인","상호 간의, 호혜적인"]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"Continual","a":"3,4","e":"③ repeated: 거듭되는, 반복되는\n④ frequent: 빈번한, 잦은 (거듭되는 방해로 그 보고서를 제시간에 끝내는 것이 불가능했다.) / continual(계속 반복되는, 빈번한)의 유의어.","w":"① occasional: 이따금의, 가끔의\n② brief: 짧은, 잠시의","k":"거듭되는 방해로 그 보고서를 제시간에 끝내는 것이 불가능했다.","m":2,"s":"Continual interruptions made it impossible to finish the report on time.","h":"Continual","c":["occasional","brief","repeated","frequent"]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"favor","a":"1","e":"①찬성, 지지 / ②호의, 부탁 / ③호의, 부탁 / ④호의, 부탁 [①번만 의미가 다름]","k":"①대부분의 회원들이 새 계획에 찬성표를 던졌다.\n②그는 지난 주말에 이웃에게 작은 부탁을 했다.\n③부탁 하나 },{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"match","a":"4","e":"①경기, 시합 / ②경기, 시합 / ③경기, 시합 / ④성냥 [④번만 의미가 다름]","k":"①토너먼트의 결승 경기는 일요일 오후에 열릴 것이다.\n②우리 팀은 단 1점 차로 그 경기를 졌다.\n③그 권투 시합은 12라운드 내내 이어졌다.\n④그는 낡은 기름 램프에 불을 붙이려고 성냥을 그었다.","m":0,"c":["The final match of the tournament will be held on Sunday afternoon.","Our team lost the match by a single point.","The boxing match lasted for all twelve rounds.","He struck a match to light the old oil lamp."],"hc":"match|match|match|match"}]},{"day":86,"q":[{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"buttress","a":"3","e":"③ buttress: 강화하다, 뒷받침하다 (규칙적인 훈련과 균형 잡힌 식단은 계절성 질병에 대한 신체의 방어력을 강화할 수 있다.)","w":"① abate: 약해지다, 완화되다\n② stymie: 방해하다, 좌절시키다\n④ hamper: 방해하다, 지장을 주다","k":"규칙적인 훈련과 균형 잡힌 식단은 계절성 질병에 대한 신체의 방어력을 강화할 수 있다.","m":0,"s":"Regular training and a balanced diet can ________ the body's defenses against seasonal illness.","c":["abate","stymie","buttress","hamper"]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"laud","a":"1","e":"① commend: 칭찬하다, 표창하다 (평론가들은 그 젊은 감독의 대담하고 독창적인 이야기 전개를 칭찬한다.) / laud(칭송하다, 찬양하다)의 유의어.","w":"② censure: 비난하다, 견책하다\n③ castigate: 혹평하다, 심하게 나무라다\n④ denigrate: 폄하하다, 헐뜯다","k":"평론가들은 그 젊은 감독의 대담하고 독창적인 이야기 전개를 칭찬한다.","m":0,"s":"Critics laud the young director for her bold and original storytelling.","h":"laud","c":["commend","censure","castigate","denigrate"]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"succinct","a":"4","e":"④ succinct: 간결한, 간명한","w":"① verbose: 장황한, 말이 많은\n② tangential: 지엽적인, 관계가 별로 없는\n③ equivocal: 모호한, 애매한","m":0,"s":"\"간결한, 간명한\"","c":["verbose","tangential","equivocal","succinct"]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"saturate","a":"saturate","e":"saturate 흠뻑 적시다, 포화시키다","k":"이틀간의 폭우가 마른 농지를 완전히 흠뻑 적실 것이다.","m":0,"s":"Two days of heavy rain will completely sat______ the dry farmland."},{"t":"REL "객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"mollify","a":"4","e":"④ soothe: 달래다, 진정시키다 (매니저는 두 시간을 기다린 고객들을 달래기 위해 부드럽게 말했다.) / mollify(달래다, 누그러뜨리다)의 유의어.","w":"① foment: 조장하다, 선동하다\n② rouse: 자극하다, 각성시키다\n③ perturb: 동요시키다, 불안하게 하다","k":"매니저는 두 시간을 기다린 고객들을 달래기 위해 부드럽게 말했다.","m":0,"s":"The manager spoke gently to mollify the customers who had waited two hours.","h":"mollify","c":["foment","rouse","perturb","soothe"]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"scrupulous","a":"2","e":"② scrupulous: (옳고 정직한 일을 하는 데 극도로 신중한 / 그리고 모든 세부사항에 주의를 기울이는) 세심한, 양심적인, 꼼꼼한","w":"① solicitous: 염려하는, 배려하는\n③ officious: 참견하기 좋아하는, 거들먹거리는\n④ obsequious: 아첨하는, 비굴한","k":"옳고 정직한 일을 하는 데 극도로 신중한 / 그리고 모든 세부사항에 주의를 기울이는","m":0,"s":"\"extremely careful to do what is right and honest, and paying attention to every detail\"","c":["solicitous","scrupulous","officious","obsequious"]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"gregarious","a":"1,3","e":"① reclusive: 은둔하는, 세상을 피하는\n③ aloof: 거리를 두는, 냉담한 (수줍음 많은 형과 달리, Tom은 매우 사교적이어서 몇 분 만에 친구를 사귄다.) / gregarious(사교적인, 남과 어울리기 좋아하는)의 반의어.","w":"② convivial: 유쾌한, 어울리기 좋아하는\n④ cordial: 다정한, 화기애애한","k":"수줍음 많은 형과 달리, Tom은 매우 사교적이어서 몇 분 만에 친구를 사귄다.","m":2,"s":"Unlike his shy brother, Tom is so gregarious that he makes friends within minutes.","h":"gregarious","c":["reclusive","convivial","aloof","cordial"]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"obfuscate","a":"4","e":"④ obfuscate: 혼란스럽게 하다, (일부러) 모호하게 만들다 (그 회사는 프로젝트의 실제 비용을 모호하게 만들기 위해 일부러 복잡한 도표를 사용했다.)","w":"① elucidate: 명료하게 설명하다\n② debunk: (틀렸음을) 폭로하다, 잘못된 통념을 깨다\n③ construe: 해석하다, 이해하다","k":"그 회사는 프로젝트의 실제 비용을 모호하게 만들기 위해 일부러 복잡한 도표를 사용했다.","m":0,"s":"The company used deliberately complicated charts to ________ the real cost of the project.","c":["elucidate","debunk","construe","obfuscate"]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"  동안 무기력함을 느꼈다.","m":0,"s":"After the twelve-hour flight, the whole team felt lethargic during the afternoon meeting.","h":"lethargic","c":["exuberant","ebullient","jubilant","languid"]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"incur","a":"incur","e":"incur (빚·손실 등을) 떠안다, 초래하다","k":"소규모 사업체들은 첫 2년 동안 종종 막대한 부채를 떠안는다.","m":0,"s":"Small businesses often i______ heavy debts during their first two years."},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"cover","a":"4","e":"①충당하다 / ②충당하다 / ③충당하다 / ④덮다 [④번만 의미가 다름]","k":"①보험이 수리 비용을 충당할 것이다.\n②그 장학금은 그의 등록금과 생활비를 충당할 것이다.\n③그 연구 지원금은 팀의 모든 여행 경비를 충당할 것이다.\n④두꺼운 눈이 좁은 산길을 덮기 시작했다.","m":0,"c":["The insurance will cover the cost of the repairs.","The scholarship should cover his tuition and living expenses.","The research grant will cover all travel expenses for the team.","Thick snow began to cover the narrow mountain path."],"hc":"cover|cover|cover|cover"}]},{"day":88,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"inexorable","a":"1","e":"① inexorable: 가차 없는, 냉혹한, 멈출 수 없는","w":"② lax: 느슨한, 해이한\n③ amenable: 순응하는, 잘 받아들이는\n④ conciliatory: 회유적인, 달래는","m":0,"s":"\"가차 없는, 냉혹한\"","c":["inexorable","lax","amenable","conciliatory"]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"parsimonious","a":"3","e":"③ parsimonious: (돈 쓰기를 꺼리는 / 심지어 돈이 많이 있을 때조차) 인색한, 지나치게 아끼는","w":"① profligate: 낭비가 심한, 방탕한\n② munificent: 후한, 아낌없이 베푸는\n④ philanthropic: 자선의, 인정 많은","k":"돈 쓰기를 꺼리는 / 심지어 돈이 많이 있을 때조차","m":0,"s":"\"unwilling to spend money, even when there is plenty of it\"","c":["profligate","munificent","parsimonious","philanthropic"]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"insipid","a":"2,3","e":"② piquant: 톡 쏘는, 풍미가 강한\n③ savory: 풍미 있는, 맛깔스러운 (그 수프는 너무 맛이 밋밋해서 손님의 절반이 손도 대지 않고 남겼다.) / insipid(맛이 밍밍한, 풍미 없는)의 반의어.","w":"① bland: 밋밋한, 자극적이지 않은\n④ vapid: 김빠진, 무미건조한","k":"그 수프는 너무 맛이 밋밋해서 손님의 절반이 손도 대지 않고 남겼다.","m":2,"s":"The soup was so insipid that half the guests left it untouched.","h":"insipid","c":["bland","piquant","savory","vapid"]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"corrode","a":"corrode","e":"corrode 부식시키다, 침식하다","k":"소금물이 오래된 다리의 금속 골조를 부식시키기 시작했다.","m":0,"s":"Salt water had begun to c______ the metal frame of the old bridge."},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"affable","a":"4","e":"affable (형) 상냥한, 사근사근한 - affability (명) 상냥함, 붙임성\n④ banal (형) 진부한, 평범한 - banality (명) 진부함, 상투적인 말","w":"① capitulate (동) 굴복하다, 항복하다 - capitulation (명) 굴복, 항복\n② acquiesce (동) 묵인하다, 마지못해 따르다 - acquiescence (명) 묵인, 순종\n③ relegate (동) 좌천시키다, 격하하다 - relegation (명) 좌천, 강등","m":0,"s":"affable - affability","c":["capitulate - capitulation","acquiesce - acquiescence","relegate - relegation","banal - banality"]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"cogent","a":"3","e":"③ cogent: 설득력 있는, 논리 정연한 (그 교수의 논증은 매우 설득력이 있어서 가장 혹독한 비평가들조차 동의해야 했다.)","w":"① specious: 그럴듯하지만 틀린, 허울만 좋은\n② tenuous: 빈약한, 미약한\n④ spurious: 가짜의, 근거 없는","k":"그 교수의 논증은 매우 설득력이 있어서 가장 혹독한 비평가들조차 동의해야 했다.","m":0,"s":"The professor's argument was so ________ that even his harshest critics had to agree.","c":["specious","tenuous","cogent","spurious"]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"apt","a":"apt","e":"apt (형) ~하기 쉬운, ~하는 경향이 있는 / (형) 적절한","k":"아침을 거르는 학생들은 정오 전에 집중력을 잃기 쉽다.\n깨지기 쉬운 평화에 대한 그녀의 논평은 그렇게 어린 사람치고는 유난히 적절했다.","m":0,"s":"Students who skip breakfast are a______ to lose concentration before noon.\nHer remark about the fragile peace was unusually a______ for someone so young."},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"vilify","a":"4","e":"④ malign: 비방하다, 헐뜯다 (경쟁 정치인들은 전국 신문에서 그 개혁가를 비방하려 했다.) / vilify(비방하다, 헐뜯다)의 유의어.","w":"① eulogize: 찬양하다, 칭송하다\n② absolve: 면제하다, 무죄를 선고하다\n③ indulge: 너그럽게 봐주다, 마음껏 하게 하다","k":"경쟁 정치인들은 전국 신문에서 그 개혁가를 비방하려 했다.","m":0,"s":"Rival politicians tried to vilify the reformer in the national newspapers.","h":"vilify","c":["eulogize","absolve","indulge","malign"]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"ostentatious","a":"4","e":"④ 과시하는, 겉만 화려한: ostentatious","w":"① 겸손한, 잘난 체하지 않는\n② 검소한, 절약하는\n③ 세련된, 정교한","m":0,"s":"ostentatious","c":["겸손한, 잘난 체하지 않는","검소한, 절약하는","세련된, 정교한","과시하는, 겉만 화려한"]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"assiduous","a":"1","e":"① assiduous: 근면한, 빈틈없는 (그 연구팀은 매우 근면해서 모든 수치를 세 번씩 확인했다.)","w":"② slothful: 나태한, 게으른\n③ torpid: 무기력한, 굼뜬\n④ dilatory: 꾸물거리는, 지연시키는","k":"그 연구팀은 매우 근면해서 모든 수치를 세 번씩 확인했다.","m":0,"s":"The research team was so ________ that they checked every figure three times.","c":["assiduous","slothful","torpid","dilatory"]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"nonchalant","a":"4","e":"④ flustered: 당황한, 허둥대는 (사라진 돈에 대해 질문받았을 때 그는 태연하게 어깨를 으쓱했다.) / nonchalant(태연한, 무심한)의 반의어.","w":"① unruffled: 침착한, 흐트러지지 않은\n② sedate: 차분한, 조용한\n③ placid: 잔잔한, 차분한","k":"사라진 돈에 대해 질문받았을 때 그는 태연하게 어깨를 으쓱했다.","m":0,"s":"He gave a nonchalant shrug when asked about the missing money.","h":"nonchalant","c":["unruffled","sedate","placid","flustered"]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"diatribe","a":"3","e":"③ diatribe: (길고 분노에 찬 연설 / 누군가나 무언가를 맹렬히 비판하는) 통렬한 비난, 혹평 연설","w":"① eulogy: 찬사, 추도사\n② platitude: 진부한 말, 상투적인 문구\n④ euphemism: 완곡어법, 완곡한 표현","k":"길고 분노에 찬 연설 / 누군가나 무언가를 맹렬히 비판하는","m":0,"s":"\"a long and angry speech that fiercely criticizes someone or something\"","c":["eulogy","platitude","diatribe","euphemism"]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"fickle","a":"4","e":"④ inconstant: 변하기 쉬운, 한결같지 않은 (대중음악에 대한 대중의 취향은 변덕스럽기로 악명 높다.) / fickle(변덕스러운, 변하기 쉬운)의 유의어.","w":"① steadfast: 확고한, 변함없는\n② immutable: 불변의, 바꿀 수 없는\n③ staunch: 충실한, 변함없는","k":"대중음악에 대한 대중의 취향은 변덕스럽기로 악명 높다.","m":0,"s":"Public taste in popular music is notoriously fickle.","h":"fickle","c":["steadfast","immutable","staunch","inconstant"]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"disparate","a":"disparate","e":"disparate 서로 다른, 이질적인","k":"두 목격자는 같은 사고에 대해 완전히 서로 다른 진술을 했다.","m":0,"s":"The two witnesses gave completely disp______ accounts of the same accident."},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"exercise","a":"1","e":"①운동하다 / ②행사하다 / ③행사하다 / ④발휘하다, 행사하다 [①번만 의미가 다름]","k":"①의사들은 노년층에게 하루 30분씩 운동하라고 권한다.\n②시민들은 모든 선거에서 투표권을 행사해야 한다.\n③위원회는 그 제안을 거부할 권한을 행사할 수 있다.\n④판사는 그런 민감한 사건을 판결할 때 신중을 기해야 한다.","m":0,"c":["Doctors advise older adults to exercise for thirty minutes a day.","Citizens should exercise their right to vote in every election.","The committee may exercise its power to reject the proposal.","Judges must exercise caution when ruling on such sensitive cases."],"hc":"exercise|exercise|exercise|exercise"}]},{"day":89,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"nadir","a":"3","e":"③ nadir: 최저점, 밑바닥","w":"① zenith: 정점, 절정\n② apex: 꼭대기, 정점\n④ pinnacle: 절정, 최고조","m":0,"s":"\"최저점, 밑바닥\"","c":["zenith","apex","nadir","pinnacle"]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"sanguine","a":"4","e":"④ sanguine: 낙관적인, 희망에 찬 (매출이 3년째 떨어졌을 때조차 그의 낙관적인 전망은 결코 변하지 않았다.)","w":"① lugubrious: 침울한, 우울한\n② despondent: 낙담한, 의기소침한\n③ pessimistic: 비관적인","k":"매출이 3년째 떨어졌을 때조차 그의 낙관적인 전망은 결코 변하지 않았다.","m":0,"s":"His ________ outlook never changed, even when sales fell for a third year.","c":["lugubrious","despondent","pessimistic","sanguine"]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"nebulous","a":"2","e":"② unequivocal: 명백한, 분명한 (그 보고서의 결론은 너무 모호해서 누구도 그것을 근거로 행동할 수 없었다.) / nebulous(모호한, 불분명한)의 반의 const KEY='dv_'+D.level;

try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.done=S.done||{};S.wrong=S.wrong||{};S.star=S.star||{};

const $=document.getElementById('app');
const QS={};D.sets.forEach(s=>s.q.forEach((q,i)=>{q.id=s.day+'-'+(i+1);q.day=s.day;QS[q.id]=q}));
const N=D.sets.length;
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function hl(t,w){t=esc(t);if(w){String(w).split('|').map(x=>x.trim()).filter(Boolean).forEach(x=>{t=t.replace(new RegExp('(^|[^\\w>])('+rx(esc(x))+')(?![\\w<])','gi'),'$1<u>$2</u>')})}return t.replace(/\n/g,'<br>')}
const CN=['①','②','③','④'];
const WD=['일','월','화','수','목','금','토'];
function dstr(ts){const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'}
let R=null,resetT=null,resetArm=false;

function home(){
  R=null;
  const doneN=Object.keys(S.done).length;
  let nxt=0;for(let d=1;d<=N;d++){if(!S.done[d]){nxt=d;break}}
  const wn=Object.keys(S.wrong).length,sn=Object.keys(S.star).length;

  }

  h+='<div class="row"><button class="btn" id="br">'+(resetArm?'한 번 더 누르면 모두 지워집니다':'처음부터 다시 (다음 학생)')+'</button></div>';

  };
}
function startDay(d){
  const set=D.sets[d-1];
  let i=0,res=[];
  if(S.cur&&S.cur.day===d){i=S.cur.i;res=S.cur.res}
  R={mode:'day',day:d,list:set.q.slice(),i:i,res:res,round:1};
  if(i>=set.q.length){result();return}
  quiz();
}
function startList(m){
  const ids=Object.keys(m==='wrong'?S.wrong:S.star).sort((a,b)=>{const [d1,n1]=a.split('-').map(Number),[d2,n2]=b.split('-').map(Number);return d1-d2||n1-n2});
  const list=ids.map(id=>QS[id]).filter(Boolean);
  if(!list.length){home();return}
  R={mode:m,list:list,i:0,res:[],round:1};
  quiz();
}
function title(){
  if(R.mode==='day')return R.day+'일'+(R.round===2?' · 다시 풀기':'');
  return R.mode==='wrong'?'오답노트':'별표 모음';
}
function quiz(){

  let h='<div class="top"><button class="sbtn" id="bh">홈</button><div class="t">'+title()+' · '+(R.i+1)+' / '+R.list.length+'</div><button class="sbtn'+(S.star[q.id]?' on':'')+'" id="bst">별표</button></div>';

    h+='<div id="fbk"></div>';

  }
  h+='</div>';
  $.innerHTML=h;
  window.scrollTo(0,0);
  document.getElementById('bh').onclick=home;
  document.getElementById('bst').onclick=e=>{if(S.star[q.id])delete S.star[q.id];else S.star[q.id]=1;save();e.target.classList.toggle('on',!!S.star[q.id])};
  if(sub){
    const tx=document.getElementById('tx'),ok=document.getElementById('ok');
    const go=()=>{if(!tx.value.trim())return;const n=s=>s.trim().toLowerCase().replace(/\s+/g,' ');const v=n(tx.value);const accept=[q.a].concat(q.al?q.al.split('|'):[]).map(n);const r=accept.indexOf(v)>=0;tx.disabled=true;tx.classList.add(r?'ok':'ng');ok.style.display='none';judged(q,r,q.a)};
    ok.onclick=go;tx.onkeydown=e=>{if(e.key==='Enter')go()};

    const sel=new Set(),ok=document.getElementById('ok');
    $.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(sel.has(k))sel.delete(k);else sel.add(k);b.classList.toggle('sel',sel.has(k));ok.disabled=!sel.size});
    ok.onclick=()=>{const ans=q.a.split(',').map(Number);const r=ans.length===sel.size&&ans.every(a=>sel.has(a));$.querySelectorAll('.ch').forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove('sel');if(ans.indexOf(k)>=0)b.classList.add('ok');else if(sel.has(k))b.classList.add('ng')});ok.style.display='none';judged(q,r)};
  } else {
    $.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,a=+q.a;$.querySelectorAll('.ch').forEach(x=>{x.disabled=true;if(+x.dataset.k===a)x.classList.add('ok')});if(k!==a)b.classList.add('ng');judged(q,k===a)});
  }
  if(sub)document.getElementById('tx').focus();
}

    R.res[R.i]=r?1:0;
    if(R.mode==='day'){S.cur={day:R.day,i:R.i+1,res:R.res.slice()}}
    if(r){const w=S.wrong[q.id];if(w){w.s=(w.s||0)+1;if(w.s>=2)delete S.wrong[q.id]}}
    else S.wrong[q.id]={s:0};
    save();
  } else R.res[R.i]=r?1:0;
  let h='<div class="fb '+(r?'ok':'ng')+'"><h3>'+(r?'정답':'오답')+(!r&&showAns?' · 정답: '+esc(showAns):'')+'</h3>';
  if(q.e)h+='<div class="x">'+esc(q.e)+'</div>';
  if(q.w)h+='<div class="x" style="margin-top:8px">'+esc(q.w)+'</div>';
  if(q.k&&(!q.e||q.e.indexOf(q.k)<0))h+='<div class="l">해석</div><div class="x">'+esc(q.k)+'</div>';
  h+='</div><button class="btn pri nb" id="nx">'+(R.i+1>=R.list.length?'결과 보기':'다음')+'</button>';
  document.getElementById('fbk').innerHTML=h;
  document.getElementById('nx').onclick=()=>{R.i++;if(R.i>=R.list.length)result();else quiz()};
  document.getElementById('nx').scrollIntoView({block:'nearest'});
}
function result(){
  const tot=R.list.length,ok=R.res.reduce((a,b)=>a+b,0);
  const wrongQ=R.list.filter((q,i)=>!R.res[i]);
  let h='<h1>'+title()+'</h1><div class="score">'+ok+' / '+tot+'</div>';
  if(R.mode==='day'){
    if(R.round===1){R.first=ok;}
    if(R.round===1&&wrongQ.length){
      h+=wlist(wrongQ)+'<button class="btn pri nb" id="rt">틀린 문제 다시 풀기</button><button class="btn nb" id="hm">홈으로</button>';
      save();$.innerHTML=h;
      document.getElementById('rt').onclick=()=>{R.list=wrongQ;R.i=0;R.res=[];R.round=2;quiz()};
      document.getElementById('hm').onclick=home;return;
    }
    S.done[R.day]={s:R.first+'/15',t:Date.now()};S.cur=null;
    save();
    if(wrongQ.length)h+=wlist(wrongQ);
    h+='<button class="btn pri nb" id="hm">홈으로</button>';
  } else {
    if(wrongQ.length)h+=wlist(wrongQ);
    h+='<button class="btn pri nb" id="hm">홈으로</button>';
  }
  $.innerHTML=h;document.getElementById('hm').onclick=home;
}
function wlist(l){return '<div class="card"><ul class="wl">'+l.map(q=>'<li><b>'+esc(q.wd)+'</b> · '+esc(q.tn)+'</li>').join('')+'</ul></div>'}
home();
</script>
</body>
</html>
