},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It refers to a situation where an attempt to hide information ironically helps spread it instead.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 정보를 숨기려는 시도가 얄궂게도 오히려 그것을 퍼뜨리는 것을 돕는 상황을 가리킨다.","opts":["정보를 숨기려는 시도가 항상 성공하는 상황","정보를 퍼뜨리려는 시도가 오히려 정보를 숨기게 되는 상황","정보를 숨기려는 시도가 오히려 정보를 퍼뜨리게 되는 상황","정보를 숨기는 방법을 사람들에게 가르쳐 주는 상황"],"r":{"a":"3) 정보를 숨기려는 시도가 오히려 정보를 퍼뜨리게 되는 상황","ev":"13번 문장","s":[[13,"It refers to a situation where an attempt to hide information ironically helps spread it instead.","이것은 정보를 숨기려는 시도가 얄궂게도 오히려 그것을 퍼뜨리는 것을 돕는 상황을 가리킨다."]],"w":"ironically(얄궂게도)와 instead(오히려)가 핵심이에요. 숨기려고 한 일이 반대로 정보를 퍼뜨리는 결과가 되는 상황이에요.","c":3},"h":"094ba59091"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사진가는 그녀가 요청하자마자 사진을 삭제했다.","스트라이샌드는 사진가가 그녀의 요청을 여러 차례 거절한 후 그에게 소송을 제기했다.","스트라이샌드는 사진가에게서 5천만 달러를 받아 냈다.","그 사진은 스트라이샌드가 온라인에 올려서 유명해졌다."],"opts":["The photographer deleted the picture as soon as she asked.","Streisand filed a lawsuit against the photographer after he repeatedly refused her request.","Streisand won 50 million dollars from the photographer.","The picture became famous because Streisand posted it online."],"r":{"a":"2) Streisand filed a lawsuit against the photographer after he repeatedly refused her request.","ev":"8~9번 문장","s":[[8,"But the photographer repeatedly refused.","하지만 사진가는 여러 차례 거절했다."],[9,"Eventually, she filed a 50-million-dollar lawsuit against him for invading her privacy.","결국, 그녀는 사생활을 침해한 것으로 그에게 5천만 달러짜리 소송을 제기했다."]],"w":"8번에서 사진가가 요청을 여러 차례 거절했고, 9번에서 결국 소송을 제기했어요. 사진을 바로 삭제하지도 않았고, 소송에서 이겼다는 말도 없고, 사진을 올린 사람은 스트라이샌드가 아니에요.","c":2},"h":"8dce1ae27d"},{"n":9,"t":"sum","q":"Because of Streisand’s (A), millions of people (B) the picture on the Internet.","ko":"스트라이샌드의 (A) 때문에, 수백만 명의 사람들이 인터넷에서 그 사진을 (B).","oko":["(A) 소송 / (B) 삭제했다","(A) 사진 / (B) 무시했다","(A) 휴가 / (B) 찾아봤다","(A) 기록 / (B) 숨겼다","(A) 소송 / (B) 찾아봤다"],"opts":["(A) lawsuit / (B) deleted","(A) photograph / (B) ignored","(A) vacation / (B) looked up","(A) record / (B) hid","(A) lawsuit / (B) looked up"],"r":{"a":"5) (A) lawsuit / (B) looked up","ev":"9~11번 문장","s":[[9,"Eventually, she filed a 50-million-dollar lawsuit against him for invading her privacy.","결국, 그녀는 사생활을 침해한 것으로 그에게 5천만 달러짜리 소송을 제기했다."],[10,"This incident was on the news.","이 사건은 뉴스에 나왔다."],[11,"Soon, millions of people heard about the picture and looked it up on the Internet.","곧, 수백만 명의 사람들이 그 사진에 대해 듣고 그것을 인터넷에서 찾아봤다."]],"w":"9번에서 스트라이샌드가 소송(lawsuit)을 제기했고, 10~11번에서 그 사건이 뉴스에 나오자 수백만 명이 사진을 인터넷에서 찾아봤어요(looked it up).","c":5},"h":"e56f7ad34e"},{"n":10,"t":"fill","q":"Streisand asked the photographer to [A] the picture from the website because she did not want the public to [B] her home.","ko":"스트라이샌드는 대중이 그녀의 집을 [B] 것을 원하지 않아서 사진가에게 그 사진을 웹사이트에서 [A] 달라고 요청했다.","bank":["remove","see","refuse","file","lawsuit","privacy"],"bko":{"remove":"지우다","see":"보다","refuse":"거절하다","file":"(소송을) 제기하다","lawsuit":"소송","privacy":"사생활"},"r":{"a":"[A] remove, [B] see","ev":"7번 문장","s":[[7,"Streisand asked the photographer to remove the picture from the website because she did not want the public to see her home.","스트라이샌드는 대중이 그녀의 집을 보기를 원하지 않았기 때문에 사진가에게 그 사진을 웹사이트에서 지워달라고 요청했다."]],"w":"7번 문장 Streisand asked the photographer to remove the picture ~ did not want the public to see her home에서 가져왔어요. [A], [B]는 to 뒤의 동사원형이 필요하고, 의미상 '지우다'와 '보다'만 알맞아요.","c":null},"h":"8ad1dba82c"}]},{"u":4,"id":"hk4-04-1","no":1,"ko":"버리지 마세요, 기부하세요\b","items":[{"n":1,"t":"tf","q":"About 1.5 billion or more phones are sold around the world each year.","ko":"매년 전 세계에서 15억 개 이상의 휴대폰이 팔린다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Each year, over 1.5 billion phones are sold worldwide.","매년, 15억 개가 넘는 휴대폰이 전 세계에서 팔린다."]],"w":"1번 문장에 Each year, over 1.5 billion phones are sold worldwide가 그대로 나와요.","c":"T"},"h":"b3274e0a04"},{"n":2,"t":"tf","q":"One ton of rocks gives more gold than one ton of phones.","ko":"암석 1톤은 휴대폰 1톤보다 더 많은 금을 준다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"If they are recycled, 400 grams of gold can be extracted from one ton of them.","만약 그것들이 재활용된다면, 1톤의 휴대폰으로부터 400그램의 금이 추출될 수 있다."],[6,"This is a great amount, considering only five grams of gold are extracted from the same weight of rocks.","같은 무게의 암석으로부터 5그램의 금만 추출되는 것을 고려하면, 이것은 굉장한 양이다."]],"w":"5번에서 휴대폰 1톤에서 금 400그램이 나오고, 6번에서 같은 무게의 암석에서는 5그램뿐이라고 해요. 그래서 휴대폰 쪽이 훨씬 많아요.","c":"F"},"h":"f85dd1b75e"},{"n":3,"t":"tf","q":"Old phones can be donated to a charity organization.","ko":"오래된 휴대폰은 자선 단체에 기부될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"You can donate them to a charity organization.","당신은 그것을 자선 단체에 기부할 수 있다."]],"w":"10번 문장에서 오래된 휴대폰을 자선 단체에 기부할 수 있다(You can donate them to a charity organization)고 해요.","c":"T"},"h":"dfaf43c205"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This means that about the same number of old phones are discarded.)","ko":"이것은 거의 같은 수의 오래된 휴대폰이 ( )는 것을 의미한다.","opts":["버려진다","수리된다","선물된다","보관된다"],"word":"discarded","r":{"a":"1) 버려진다","ev":"2번 문장","s":[[2,"This means that about the same number of old phones are discarded.","이것은 거의 같은 수의 오래된 휴대폰이 버려진다는 것을 의미한다."]],"w":"2번 문장은 새 휴대폰이 팔리는 만큼 오래된 휴대폰이 쓰고 나서 버려진다는 뜻이에요. 뒤에서 '재활용되는 것은 10퍼센트뿐'(3번)이라고 이어져요. discard = 버리다.","c":1},"h":"318a0263bf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…they usually end up in landfills and contaminate the surrounding soil and water with toxic materials.)","ko":"…보통 쓰레기 매립지에 가게 되고 주변 토양과 물을 독성 물질로 ( ).","opts":["정화한다","보호한다","오염시킨다","나눠 준다"],"word":"contaminate","r":{"a":"3) 오염시킨다","ev":"8번 문장","s":[[8,"When phones are discarded, they usually end up in landfills and contaminate the surrounding soil and water with toxic materials.","휴대폰이 버려지면, 보통 결국 쓰레기 매립지로 가게 되고 주변 토양과 물을 독성 물질로 오염시킨다."]],"w":"독성 물질(toxic materials)로 토양과 물에 무슨 일이 일어날까요? 오염시켜요. contaminate = 오염시키다. 그래서 7번에서 재활용이 환경에 이익이라고 한 거예요.","c":3},"h":"835c936d32"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIf they are recycled, 400 grams of gold can be extracted from one ton of them.","ko":"밑줄 친 they가 가리키는 것은?","sko":"만약 그것들이 재활용된다면, 1톤의 휴대폰으로부터 400그램의 금이 추출될 수 있다.","opts":["금","휴대폰","암석","자선 단체"],"r":{"a":"2) 휴대폰","ev":"4~5번 문장","s":[[4,"Phones contain many precious metals, including gold.","휴대폰에는 금을 포함하여 많은 값비싼 금속이 들어 있다."],[5,"If they are recycled, 400 grams of gold can be extracted from one ton of them.","만약 그것들이 재활용된다면, 1톤의 휴대폰으로부터 400그램의 금이 추출될 수 있다."]],"w":"4번에서 Phones contain many precious metals라고 했고 5번 If they are recycled의 they는 그 휴대폰이에요. 5번 끝의 them도 같은 휴대폰이에요.","c":2},"h":"76950a8e31"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But unfortunately, only 10 percent of these phones get recycled.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 불행히도, 이 휴대폰의 10퍼센트만이 재활용된다.","opts":["이 휴대폰의 90퍼센트가 재활용된다.","이 휴대폰의 10퍼센트만 팔린다.","이 휴대폰의 10퍼센트는 재활용될 수 없다.","이 휴대폰 중 10퍼센트만 재활용된다."],"r":{"a":"4) 이 휴대폰 중 10퍼센트만 재활용된다.","ev":"3번 문장","s":[[3,"But unfortunately, only 10 percent of these phones get recycled.","하지만 불행히도, 이 휴대폰의 10퍼센트만이 재활용된다."]],"w":"only 10 percent는 '겨우 10퍼센트'라서 나머지 대부분은 재활용되지 않는다는 말이에요. 'get recycled'는 재활용된다는 뜻이에요.","c":4},"h":"b763abeb6e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["휴대폰에는 금을 포함하여 많은 값비싼 금속이 들어 있다.","대부분의 오래된 휴대폰은 매년 새 휴대폰으로 재활용된다.","휴대폰에는 재활용할 가치가 있는 금속이 없다.","금은 휴대폰이 아니라 암석에서만 찾을 수 있다."],"opts":["Phones contain many precious metals, including gold.","Most old phones are recycled into new phones every year.","Phones contain no metals worth recycling.","Gold can only be found in rocks, not in phones."],"r":{"a":"1) Phones contain many precious metals, including gold.","ev":"4번 문장","s":[[4,"Phones contain many precious metals, including gold.","휴대폰에는 금을 포함하여 많은 값비싼 금속이 들어 있다."]],"w":"4번 문장에서 휴대폰에 금을 포함해 값비싼 금속이 많이 들어 있다고 해요. 재활용은 10퍼센트뿐이고(3번), 금은 휴대폰에서도 나와요(5번).","c":1},"h":"4544c1ebf0"},{"n":9,"t":"sum","q":"Recycling phones is good for the (A) because discarded phones can (B) the soil and water with toxic materials.","ko":"휴대폰을 재활용하는 것은 (A)에 좋은데, 버려진 휴대폰은 독성 물질로 토양과 물을 (B) 수 있기 때문이다.","oko":["(A) 경제 / (B) 깨끗하게 하다","(A) 어린이 / (B) 기부하다","(A) 환경 / (B) 오염시키다","(A) 암석 / (B) 추출하다","(A) 자선 / (B) 재활용하다"],"opts":["(A) economy / (B) clean","(A) children / (B) donate","(A) environment / (B) contaminate","(A) rocks / (B) extract","(A) charity / (B) recycle"],"r":{"a":"3) (A) environment / (B) contaminate","ev":"7~8번 문장","s":[[7,"Recycling phones also has ecological benefits.","휴대폰을 재활용하는 것에는 환경 보호의 이익도 있다."],[8,"When phones are discarded, they usually end up in landfills and contaminate the surrounding soil and water with toxic materials.","휴대폰이 버려지면, 보통 결국 쓰레기 매립지로 가게 되고 주변 토양과 물을 독성 물질로 오염시킨다."]],"w":"7번에서 재활용에는 환경 보호의 이익(ecological benefits)이 있다고 하고, 8번에서 버려진 휴대폰이 토양과 물을 오염시킨다(contaminate)고 이유를 설명해요.","c":3},"h":"02ebf0d538"},{"n":10,"t":"fill","q":"The [A] metals from old phones can be recycled, and the profits can help those who are in [B].","ko":"오래된 휴대폰에서 나온 [A] 금속이 재활용될 수 있고, 그 수익은 [B] 사람들을 돕는 데 쓰일 수 있다.","bank":["precious","need","donate","charity","weight","landfills"],"bko":{"precious":"값비싼","need":"도움이 필요함","donate":"기부하다","charity":"자선","weight":"무게","landfills":"쓰레기 매립지"},"r":{"a":"[A] precious, [B] need","ev":"11번 문장","s":[[11,"That way, the precious metals from the old phones can be recycled, and the profits can be used to help those who are in need.","그 방법으로, 오래된 휴대폰에서 나온 값비싼 금속이 재활용될 수 있고, 그 수익은 도움이 필요한 사람들을 돕기 위해 쓰일 수 있다."]],"w":"11번 문장 the precious metals ~ can be recycled, and the profits can be used to help those who are in need에서 가져왔어요. [A]는 metals를 꾸미는 형용사, [B]는 in 뒤의 need가 필요해서 나머지 단어들은 들어갈 수 없어요.","c":null},"h":"b5e4178254"}]},{"u":4,"id":"hk4-04-2","no":2,"ko":"죽은 화가의 신작 대공개\b","items":[{"n":1,"t":"tf","q":"Rembrandt, a great artist, died in 1669.","ko":"위대한 예술가인 렘브란트는 1669년에 사망했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Rembrandt, one of history’s greatest artists, died in 1669.","역사상 가장 위대한 예술가들 중 한 명인 렘브란트는 1669년에 사망했다."]],"w":"1번 문장에 Rembrandt, one of history’s greatest artists, died in 1669가 나와요.","c":"T"},"h":"1d75637613"},{"n":2,"t":"tf","q":"The AI analyzed only ten of Rembrandt’s paintings.","ko":"인공지능은 렘브란트의 그림 열 점만 분석했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"It analyzed all 346 paintings by Rembrandt using 3D scans and facial recognition technology.","그것은 3D 스캔과 얼굴 인식 기술을 사용하여 렘브란트가 그린 346점의 모든 그림을 분석했다."]],"w":"5번 문장에서 AI는 렘브란트가 그린 346점의 모든 그림(all 346 paintings)을 분석했어요. 열 점이 아니에요.","c":"F"},"h":"b243d0fabb"},{"n":3,"t":"tf","q":"The portrait was printed by a 3D printer after it was completed.","ko":"초상화는 완성된 후 3D 프린터로 인쇄되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"When the portrait was completed, it was then printed by a 3D printer.","초상화가 완성되었을 때, 그것은 그 후 3D 프린터로 인쇄되었다."]],"w":"10번 문장에서 초상화가 완성되었을 때(When the portrait was completed) 3D 프린터로 인쇄되었다고 해요.","c":"T"},"h":"7d71518b47"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The printer used 13 layers of paint to imitate the texture of Rembrandt’s paintings.)","ko":"프린터는 렘브란트의 그림의 질감을 ( ) 위해 13겹의 물감을 사용했다.","opts":["지우기","팔기","따라 하기","잃어버리기"],"word":"imitate","r":{"a":"3) 따라 하기","ev":"11번 문장","s":[[11,"The printer used 13 layers of paint to imitate the texture of Rembrandt’s paintings.","프린터는 렘브란트의 그림의 질감을 따라하기 위해 13겹의 물감을 사용했다."]],"w":"11번 문장은 프린터가 물감을 13겹 쓴 목적을 말해요. 12번에서 렘브란트 본인이 그린 것처럼 보였다고 하니 질감을 똑같이 '따라 한' 거예요. imitate = 따라 하다, 모방하다.","c":3},"h":"a36a5f652d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, a brand-new painting of his was recently released.)","ko":"하지만, 그의 새로운 그림이 최근에 ( ).","opts":["공개되었다","삭제되었다","도난당했다","복원되었다"],"word":"released","r":{"a":"1) 공개되었다","ev":"2번 문장","s":[[2,"However, a brand-new painting of his was recently released.","하지만, 그의 새로운 그림이 최근에 공개되었다."]],"w":"1번에서 렘브란트는 이미 죽었는데, 2번에서 새 그림이 최근에 세상에 나왔다는 반전이에요. release = 공개하다, 발표하다.","c":1},"h":"39fbbb3b3e"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey asked it to produce a portrait of a man in his thirties wearing black clothes and a black hat.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 그것에 검은색 옷과 모자를 착용한 30대 남성의 초상화를 제작할 것을 요청했다.","opts":["렘브란트의 그림들","연구원들","인공지능","비평가들"],"r":{"a":"2) 연구원들","ev":"7~8번 문장","s":[[7,"Then, the researchers decided to put the AI to the test.","그 후, 연구원들은 인공지능을 시험해보기로 결정했다."],[8,"They asked it to produce a portrait of a man in his thirties wearing black clothes and a black hat.","그들은 그것에 검은색 옷과 모자를 착용한 30대 남성의 초상화를 제작할 것을 요청했다."]],"w":"8번 They asked it to produce ~에서 They는 요청하는 사람이고, it(AI)에게 시켰어요. 바로 앞 7번에서 AI를 시험해 보기로 결정한 the researchers(연구원들)가 They예요.","c":2},"h":"199d31cd0a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Surprisingly, the portrait looked as though it had been done by Rembrandt himself!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"놀랍게도, 그 초상화는 마치 렘브란트 본인에 의해 완성된 것처럼 보였다!","opts":["그 초상화는 렘브란트가 직접 그린 것이었다.","그 초상화는 렘브란트의 그림과 전혀 달라 보였다.","렘브란트는 그 초상화를 보고 놀랐다.","그 초상화는 마치 렘브란트 본인이 그린 것처럼 보였다."],"r":{"a":"4) 그 초상화는 마치 렘브란트 본인이 그린 것처럼 보였다.","ev":"12번 문장","s":[[12,"Surprisingly, the portrait looked as though it had been done by Rembrandt himself!","놀랍게도, 그 초상화는 마치 렘브란트 본인에 의해 완성된 것처럼 보였다!"]],"w":"as though는 '마치 ~인 것처럼'이에요. 실제로는 AI가 만들었지만 렘브란트 본인이 그린 것처럼 보였다는 뜻이라서, 실제로 렘브란트가 그렸다는 선지는 틀려요.","c":4},"h":"3061463f29"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["인공지능은 렘브란트가 사람의 얼굴과 몸을 어떻게 그렸는지 학습했다.","인공지능은 그려야 할 초상화에 대한 많은 세부 사항을 받았다.","연구원들은 인공지능에게 빨간 드레스를 입은 여자를 그리라고 말했다.","그 초상화는 연구원들이 손으로 그렸다."],"opts":["The AI learned how Rembrandt painted human faces and bodies.","The AI was given many details about the portrait it had to paint.","The researchers told the AI to paint a woman in a red dress.","The portrait was drawn by hand by the researchers."],"r":{"a":"1) The AI learned how Rembrandt painted human faces and bodies.","ev":"6번 문장","s":[[6,"Based on that data, it learned how Rembrandt painted human faces and bodies in his portraits.","그 자료를 바탕으로, 그것은 렘브란트가 그의 초상화에서 어떻게 사람의 얼굴과 몸을 그렸는지 학습했다."]],"w":"6번 문장에서 AI가 자료를 바탕으로 렘브란트가 초상화에서 사람의 얼굴과 몸을 어떻게 그렸는지 학습했다고 해요. 연구원들은 검은 옷의 30대 남성을 요청했고(8번) 다른 세부 사항은 주지 않았어요(9번).","c":1},"h":"2faf6c9156"},{"n":9,"t":"sum","q":"The researchers asked the AI to paint a portrait of a (A) in his thirties without giving any other (B).","ko":"연구원들은 인공지능에게 다른 어떤 (B)도 주지 않고 30대 (A)의 초상화를 그리라고 요청했다.","oko":["(A) 여자 / (B) 세부 사항","(A) 남자 / (B) 상","(A) 화가 / (B) 겹","(A) 어린이 / (B) 옷","(A) 남자 / (B) 세부 사항"],"opts":["(A) woman / (B) details","(A) man / (B) prizes","(A) painter / (B) layers","(A) child / (B) clothes","(A) man / (B) details"],"r":{"a":"5) (A) man / (B) details","ev":"8~9번 문장","s":[[8,"They asked it to produce a portrait of a man in his thirties wearing black clothes and a black hat.","그들은 그것에 검은색 옷과 모자를 착용한 30대 남성의 초상화를 제작할 것을 요청했다."],[9,"They didn’t give it any other details.","그들은 그것에 다른 어떠한 세부 사항도 주지 않았다."]],"w":"8번에서 검은 옷과 모자를 착용한 30대 남성(a man in his thirties)의 초상화를 요청했고, 9번에서 다른 세부 사항(details)은 주지 않았다고 해요.","c":5},"h":"5e46e55a97"},{"n":10,"t":"fill","q":"The portrait was [A] by a 3D printer, which used 13 [B] of paint.","ko":"그 초상화는 3D 프린터에 의해 [A], 프린터는 13[B]의 물감을 사용했다.","bank":["printed","layers","scans","faces","researchers","hat"],"bko":{"printed":"인쇄되었다","layers":"겹","scans":"스캔","faces":"얼굴들","researchers":"연구원들","hat":"모자"},"r":{"a":"[A] printed, [B] layers","ev":"10~11번 문장","s":[[10,"When the portrait was completed, it was then printed by a 3D printer.","초상화가 완성되었을 때, 그것은 그 후 3D 프린터로 인쇄되었다."],[11,"The printer used 13 layers of paint to imitate the texture of Rembrandt’s paintings.","프린터는 렘브란트의 그림의 질감을 따라하기 위해 13겹의 물감을 사용했다."]],"w":"10번 it was then printed by a 3D printer, 11번 The printer used 13 layers of paint에서 가져왔어요. [A]는 was 뒤의 p.p.(동사), [B]는 '13 ~ of paint'에 맞는 명사가 필요해서 나머지 단어들은 들어갈 수 없어요.","c":null},"h":"504d6cd89f"}]},{"u":4,"id":"hk4-04-3","no":3,"ko":"KEEP CALM AND READ\b","items":[{"n":1,"t":"tf","q":"A meme is a popular image with text that is spread widely online for fun.","ko":"밈은 재미를 위해 온라인에서 널리 퍼지는 글이 있는 인기 있는 이미지이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"A meme is a popular image with text that is spread widely online for fun.","밈은 재미를 위해 온라인에서 널리 퍼지는 글이 있는 인기 있는 이미지이다."]],"w":"2번 문장에 A meme is a popular image with text that is spread widely online for fun이 그대로 나와요.","c":"T"},"h":"57dee0736b"},{"n":2,"t":"tf","q":"The 1939 poster had a picture of a bookstore on a green background.","ko":"1939년의 포스터에는 초록색 바탕에 서점 그림이 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It had a crown on a red background with the saying “Keep Calm and Carry On.”","그것에는 ‘침착함을 유지하고 하던 일을 계속해라’라는 문구와 함께 빨간색 바탕에 왕관이 있었다."]],"w":"7번 문장에서 포스터에는 빨간색 바탕에 왕관(a crown on a red background)과 문구가 있었다고 해요. 초록 바탕과 서점 그림은 나오지 않아요.","c":"F"},"h":"8d1b819668"},{"n":3,"t":"tf","q":"A bookstore owner found the poster in an old box in 2000.","ko":"2000년에 한 서점 주인이 오래된 상자에서 그 포스터를 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Then, in 2000, a bookstore owner found the poster in an old box and hung it in his store.","그 후, 2000년에, 한 서점 주인이 그 포스터를 오래된 상자에서 발견했고 그것을 가게에 걸었다."]],"w":"9번 문장에서 2000년에 서점 주인이 그 포스터를 오래된 상자에서 발견했다(found the poster in an old box)고 해요.","c":"T"},"h":"48785f9dac"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (British people were terrified that a war would begin at any minute.)","ko":"영국인들은 금방이라도 전쟁이 시작될까 봐 ( ).","opts":["기뻐했다","두려워했다","지루해했다","부끄러워했다"],"word":"terrified","r":{"a":"2) 두려워했다","ev":"5번 문장","s":[[5,"British people were terrified that a war would begin at any minute.","영국인들은 금방이라도 전쟁이 시작될 것을 두려워했다."]],"w":"5번 문장은 전쟁이 시작될까 하는 걱정이에요. 6번에서 정부가 불안감을 완화하려고(ease the public’s anxiety) 포스터를 만들었으니 terrified는 '두려워하는'이에요.","c":2},"h":"7f87d62b49"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…a bookstore owner found the poster in an old box and hung it in his store.)","ko":"…한 서점 주인이 그 포스터를 오래된 상자에서 발견했고 그것을 그의 가게에 ( ).","opts":["팔았다","숨겼다","버렸다","걸었다"],"word":"hung","r":{"a":"4) 걸었다","ev":"9번 문장","s":[[9,"Then, in 2000, a bookstore owner found the poster in an old box and hung it in his store.","그 후, 2000년에, 한 서점 주인이 그 포스터를 오래된 상자에서 발견했고 그것을 가게에 걸었다."]],"w":"hung는 hang(걸다)의 과거형이에요. 포스터를 가게에 걸었기 때문에 곧 손님들이 그 인쇄물에 관심을 보여요(10번).","c":4},"h":"6e58444b25"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt had a crown on a red background with the saying “Keep Calm and Carry On.”","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것에는 ‘침착함을 유지하고 하던 일을 계속해라’라는 문구와 함께 빨간색 바탕에 왕관이 있었다.","opts":["영국 정부","2차 세계 대전","정부가 디자인한 포스터","서점"],"r":{"a":"3) 정부가 디자인한 포스터","ev":"6~7번 문장","s":[[6,"So, the government designed a poster to ease the public’s anxiety.","그래서, 정부는 대중의 불안감을 완화하기 위해 포스터를 디자인했다."],[7,"It had a crown on a red background with the saying “Keep Calm and Carry On.”","그것에는 ‘침착함을 유지하고 하던 일을 계속해라’라는 문구와 함께 빨간색 바탕에 왕관이 있었다."]],"w":"6번에서 정부가 포스터(a poster)를 디자인했고, 7번 It had a crown on a red background는 그 포스터의 모양을 설명해요. 정부나 전쟁에 왕관이 있는 것은 아니에요.","c":3},"h":"15ad32cc42"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, it was never officially released to the public.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 그것은 한 번도 공식적으로 대중에게 공개되지 않았다.","opts":["그것은 한 번도 공식적으로 대중에게 공개되지 않았다.","그것은 공식적으로 대중에게 여러 번 공개되었다.","그것은 대중에게만 공개되고 정부에는 공개되지 않았다.","그것은 공개되었지만 대중은 관심이 없었다."],"r":{"a":"1) 그것은 한 번도 공식적으로 대중에게 공개되지 않았다.","ev":"8번 문장","s":[[8,"However, it was never officially released to the public.","하지만, 그것은 한 번도 공식적으로 대중에게 공개되지 않았다."]],"w":"never는 '한 번도 ~않다', officially released to the public은 '공식적으로 대중에게 공개되다'예요. 그래서 공식 공개가 한 번도 없었다는 뜻이고, 여러 번 공개되었다는 선지와는 반대예요.","c":1},"h":"a315ca2a14"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 포스터는 2차 세계 대전이 끝난 후에 제작되었다.","그 포스터는 전쟁 직전에 영국 정부에 의해 디자인되었다.","한 서점 주인이 2000년에 그 포스터를 디자인했다.","그 포스터는 전쟁이 시작될 때 영국인들에게 널리 공개되었다."],"opts":["The poster was produced after World War II ended.","The poster was designed by the British government just before the war.","A bookstore owner designed the poster in 2000.","The poster was widely shown to British people at the start of the war."],"r":{"a":"2) The poster was designed by the British government just before the war.","ev":"4번, 6번 문장","s":[[4,"It was originally a poster produced in 1939, just a few days before World War II.","그것은 원래 2차 세계 대전이 있기 불과 며칠 전, 1939년에 제작된 포스터였다."],[6,"So, the government designed a poster to ease the public’s anxiety.","그래서, 정부는 대중의 불안감을 완화하기 위해 포스터를 디자인했다."]],"w":"4번에서 포스터는 1939년, 2차 세계 대전 며칠 전에 제작되었고, 6번에서 정부가 디자인했다고 해요. 서점 주인은 2000년에 발견했을 뿐이고(9번), 포스터는 공식적으로 공개된 적이 없어요(8번).","c":2},"h":"3c7e8afea5"},{"n":9,"t":"sum","q":"A bookstore owner (A) the poster in an old box and hung it in his store, and people made (B) of it, so it became a meme.","ko":"한 서점 주인이 오래된 상자에서 그 포스터를 (A) 가게에 걸었고, 사람들이 그것의 (B)를 만들어서 그것은 밈이 되었다.","oko":["(A) 잃어버렸고 / (B) 선물","(A) 만들었고 / (B) 규칙","(A) 팔았고 / (B) 전쟁","(A) 태웠고 / (B) 왕관","(A) 발견했고 / (B) 패러디"],"opts":["(A) lost / (B) gifts","(A) made / (B) rules","(A) sold / (B) wars","(A) burned / (B) crowns","(A) found / (B) parodies"],"r":{"a":"5) (A) found / (B) parodies","ev":"9번, 11번 문장","s":[[9,"Then, in 2000, a bookstore owner found the poster in an old box and hung it in his store.","그 후, 2000년에, 한 서점 주인이 그 포스터를 오래된 상자에서 발견했고 그것을 가게에 걸었다."],[11,"People made parodies of it by changing the words and design, and it quickly became famous worldwide.","사람들은 글자와 디자인을 바꿔서 그것의 패러디를 만들었고, 그것은 전 세계적으로 빠르게 유명해졌다."]],"w":"9번에서 서점 주인이 오래된 상자에서 포스터를 발견했고(found), 11번에서 사람들이 글자와 디자인을 바꿔 패러디(parodies)를 만들어 유명해졌어요.","c":5},"h":"bd8ca914d3"},{"n":10,"t":"fill","q":"It had a [A] on a red [B] with the saying “Keep Calm and Carry On.”","ko":"그것에는 ‘침착함을 유지하고 하던 일을 계속해라’라는 문구와 함께 빨간 [B]에 [A]이 있었다.","bank":["crown","background","anxiety","parodies","government","war"],"bko":{"crown":"왕관","background":"바탕","anxiety":"불안","parodies":"패러디","government":"정부","war":"전쟁"},"r":{"a":"[A] crown, [B] background","ev":"7번 문장","s":[[7,"It had a crown on a red background with the saying “Keep Calm and Carry On.”","그것에는 ‘침착함을 유지하고 하던 일을 계속해라’라는 문구와 함께 빨간색 바탕에 왕관이 있었다."]],"w":"7번 문장 It had a crown on a red background with the saying에서 가져왔어요. [A]는 had의 목적어가 되는 물건, [B]는 'a red ___'로 쓰일 말이 필요해서 나머지 단어들은 알맞지 않아요.","c":null},"h":"cec5e947c3"}]},{"u":4,"id":"hk4-04-4","no":4,"ko":"이럴 땐 무조건 뛰어요!\b","items":[{"n":1,"t":"tf","q":"The beach was full of tourists.","ko":"해변은 관광객들로 가득 차 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The beach was full of tourists.","해변은 관광객들로 가득 차 있었다."]],"w":"2번 문장에 The beach was full of tourists가 그대로 나와요.","c":"T"},"h":"66b8ccda4f"},{"n":2,"t":"tf","q":"Most tourists ran away as soon as the water pulled back.","ko":"대부분의 관광객들은 물이 빠지자마자 도망쳤다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The fascinating sight drove many tourists to take pictures and videos with their phones.","이 매력적인 광경은 많은 관광객들이 휴대폰으로 사진과 동영상을 찍게 했다."]],"w":"5번 문장에서 이 광경 때문에 많은 관광객들이 휴대폰으로 사진과 동영상을 찍었다고 해요. 도망친 사람은 글쓴이 부부였어요.","c":"F"},"h":"20ce330400"},{"n":3,"t":"tf","q":"Tsunamis are huge waves created by earthquakes under the sea.","ko":"쓰나미는 바닷속 지진에 의해 만들어진 거대한 파도이다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"She explained that tsunamis are enormous waves created by earthquakes under the sea.","그녀는 쓰나미가 바닷속 지진에 의해 만들어진 거대한 파도라고 설명했다."]],"w":"14번 문장에서 쓰나미는 바닷속 지진에 의해 만들어진 거대한 파도(enormous waves created by earthquakes under the sea)라고 해요.","c":"T"},"h":"9914100439"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She held my hand and shouted urgently.)","ko":"그녀는 내 손을 잡고 ( ) 소리쳤다.","opts":["다급하게","천천히","조용히","즐겁게"],"word":"urgently","r":{"a":"1) 다급하게","ev":"7번 문장","s":[[7,"She held my hand and shouted urgently.","그녀는 내 손을 잡고 다급하게 소리쳤다."]],"w":"7번 문장은 바로 다음 8번에서 'Run!(뛰어요!)'이라고 외치는 상황이에요. 위험이 눈앞이니 천천히나 즐겁게가 아니라 '다급하게'예요. urgently = 다급하게.","c":1},"h":"67726b6ceb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When we returned to the hotel, we saw many people badly injured.)","ko":"호텔로 돌아왔을 때, 우리는 많은 사람들이 심하게 ( ) 것을 보았다.","opts":["잠든","즐거워하는","다친","지루해하는"],"word":"injured","r":{"a":"3) 다친","ev":"12번 문장","s":[[12,"When we returned to the hotel, we saw many people badly injured.","호텔로 돌아왔을 때, 우리는 많은 사람들이 심하게 다친 것을 보았다."]],"w":"12번은 쓰나미가 지나간 뒤에 호텔로 돌아와서 본 장면이에요. 파도가 모든 것을 파괴했으니(10번) 사람들이 badly injured, 즉 심하게 다쳤어요. injure = 다치게 하다.","c":3},"h":"4301c1327f"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat’s how she knew that something wasn’t right.","ko":"밑줄 친 That이 가리키는 것은?","sko":"그렇게 해서 그녀는 무언가 잘못되었다는 것을 알았다.","opts":["쓰나미가 지진으로 생긴다는 것","쓰나미 전에 바닷물이 매우 빠르게 뒤로 빠진다는 것","관광객들이 사진을 찍은 일","호텔로 돌아온 일"],"r":{"a":"2) 쓰나미 전에 바닷물이 매우 빠르게 뒤로 빠진다는 것","ev":"15~16번 문장","s":[[15,"The seawater pulls back very quickly before a tsunami occurs, and the larger the tsunami is, the faster the sea moves backwards.","쓰나미가 일어나기 전에 바닷물은 매우 빠르게 뒤로 빠지고, 쓰나미가 클수록, 바닷물은 더 빠르게 뒤로 움직인다."],[16,"That’s how she knew that something wasn’t right.","그렇게 해서 그녀는 무언가 잘못되었다는 것을 알았다."]],"w":"That's how ~는 '그렇게 해서 ~'라는 뜻이라서 바로 앞 15번의 내용을 받아요. 쓰나미가 일어나기 전에 바닷물이 빠르게 뒤로 빠지는 것을 보고 무언가 잘못되었다는 것을 알았어요.","c":2},"h":"da5c04400f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If we hadn’t fled, we might not be alive now.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 우리가 도망가지 않았다면, 우리는 지금 살아 있지 않을 수도 있다.","opts":["우리는 도망가지 않아서 지금 살아 있지 않다.","우리는 도망가서 지금 살아 있지 않다.","우리가 도망가면 살아 있지 않을 것이다.","우리가 도망가지 않았다면 지금 살아 있지 않을 수도 있다."],"r":{"a":"4) 우리가 도망가지 않았다면 지금 살아 있지 않을 수도 있다.","ev":"17번 문장","s":[[17,"If we hadn’t fled, we might not be alive now.","만약 우리가 도망가지 않았다면, 우리는 지금 살아 있지 않을 수도 있다."]],"w":"If we hadn’t fled는 실제로는 도망갔다는 뜻이에요. 그래서 '도망가지 않았다면 지금 살아 있지 않을 수도 있다'가 맞아요. 지금 살아 있다는 것이 전제예요.","c":4},"h":"43a1ee1900"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그들은 거대한 파도가 오기 전에 높은 언덕으로 달려갔다.","그들은 동영상을 찍으려고 바다 쪽으로 달려갔다.","그들은 파도가 지나갈 때까지 호텔 안에 숨어 있었다.","그들은 헤엄쳐 도망치려고 바다로 뛰어들었다."],"opts":["They ran toward a high hill before the giant wave came.","They ran toward the sea to take videos.","They hid inside the hotel until the wave passed.","They jumped into the sea to swim away."],"r":{"a":"1) They ran toward a high hill before the giant wave came.","ev":"9~10번 문장","s":[[9,"We ran toward a high hill.","우리는 높은 언덕을 향해 달려갔다."],[10,"Soon after, a giant wave crashed into the shore, destroying everything in its path.","곧이어, 거대한 파도가 해안에 부딪치고 나서, 그 경로에 있는 모든 것을 파괴했다."]],"w":"9번에서 높은 언덕을 향해 달렸고, 10번에서 곧이어 거대한 파도가 해안에 부딪쳤어요. 바다로 달려가거나 호텔에 숨은 것이 아니에요.","c":1},"h":"ea67130028"},{"n":9,"t":"sum","q":"A tsunami is a huge (A) made by an earthquake under the sea, and the seawater pulls (B) very quickly before it occurs.","ko":"쓰나미는 바닷속 지진으로 생긴 거대한 (A)이고, 쓰나미가 일어나기 전에 바닷물은 매우 빠르게 (B) 빠진다.","oko":["(A) 바람 / (B) 앞으로","(A) 폭풍 / (B) 뒤로","(A) 파도 / (B) 앞으로","(A) 관광객 / (B) 위로","(A) 파도 / (B) 뒤로"],"opts":["(A) wind / (B) forward","(A) storm / (B) back","(A) wave / (B) forward","(A) tourist / (B) up","(A) wave / (B) back"],"r":{"a":"5) (A) wave / (B) back","ev":"14~15번 문장","s":[[14,"She explained that tsunamis are enormous waves created by earthquakes under the sea.","그녀는 쓰나미가 바닷속 지진에 의해 만들어진 거대한 파도라고 설명했다."],[15,"The seawater pulls back very quickly before a tsunami occurs, and the larger the tsunami is, the faster the sea moves backwards.","쓰나미가 일어나기 전에 바닷물은 매우 빠르게 뒤로 빠지고, 쓰나미가 클수록, 바닷물은 더 빠르게 뒤로 움직인다."]],"w":"14번에서 쓰나미는 지진으로 생긴 거대한 파도(waves)이고, 15번에서 쓰나미 전에 바닷물이 매우 빠르게 뒤로 빠진다(pulls back)고 해요.","c":5},"h":"54b225f708"},{"n":10,"t":"fill","q":"Suddenly, a waiter [A] to the sea. The water was [B] back very fast.","ko":"갑자기, 한 종업원이 바다를 [A]. 물이 매우 빠르게 뒤로 [B] 있었다.","bank":["pointed","pulling","injured","tsunami","breakfast","hill"],"bko":{"pointed":"가리켰다","pulling":"빠지고","injured":"다친","tsunami":"쓰나미","breakfast":"아침 식사","hill":"언덕"},"r":{"a":"[A] pointed, [B] pulling","ev":"3~4번 문장","s":[[3,"Suddenly, a waiter pointed to the sea.","갑자기, 한 종업원이 바다를 가리켰다."],[4,"The water was pulling back very fast.","물이 매우 빠르게 뒤로 빠지고 있었다."]],"w":"3~4번 문장 a waiter pointed to the sea와 The water was pulling back very fast에서 가져왔어요. [A]는 과거 동사, [B]는 was 뒤의 -ing 동사가 필요해서 나머지 단어들은 들어갈 수 없어요.","c":null},"h":"3f2131673c"}]},{"u":5,"id":"hk4-05-1","no":1,"ko":"작은 목소리들이 모여\b","items":[{"n":1,"t":"tf","q":"More than 35,000 people signed the online petition.","ko":"3만 5천 명이 넘는 사람들이 온라인 청원에 서명했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Soon, over 35,000 people signed it.","곧, 3만 5천 명이 넘는 사람들이 그것에 서명했다."]],"w":"6번 문장에 over 35,000 people signed it(3만 5천 명이 넘는 사람이 서명했다)이라고 나와요. 맞는 내용이에요.","c":"T"},"h":"0b30f0ebe5"},{"n":2,"t":"tf","q":"Before the petition, every person printed on British money was a man, with no exception.","ko":"청원 전에는 영국 화폐에 인쇄된 모든 사람이 예외 없이 남자였다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In the U.K., all of the people printed on money were men, except for Queen Elizabeth II.","영국에서는, 엘리자베스 2세 여왕을 제외하고는, 화폐에 인쇄된 모든 사람들이 남자였다."]],"w":"4번 문장에서 엘리자베스 2세 여왕을 제외하고(except for Queen Elizabeth II) 모두 남자였다고 해요. 여왕이 있었으니 '예외 없이'는 틀려요.","c":"F"},"h":"5372c38625"},{"n":3,"t":"tf","q":"Governments around the world, including Korea, offer websites for petitions.","ko":"한국을 포함한 세계 곳곳의 정부는 청원을 위한 웹사이트를 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Governments around the world, including Korea, offer petition websites where citizens can directly express their opinions.","한국을 포함하여, 세계 곳곳의 정부는 시민들이 직접적으로 그들의 의견을 표현할 수 있는 청원 웹사이트를 제공한다."]],"w":"8번 문장에 Governments around the world, including Korea, offer petition websites가 그대로 나와요.","c":"T"},"h":"ea2802afa2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (By sharing an issue with people and collecting their signatures, you can turn your ideas into action.)","ko":"사람들과 문제를 공유하고 그들의 ( )을 모아서, 당신의 생각을 행동으로 바꿀 수 있다.","opts":["사진","서명","주소","용돈"],"word":"signatures","r":{"a":"2) 서명","ev":"3번 문장","s":[[3,"By sharing an issue with people and collecting their signatures, you can turn your ideas into action.","사람들과 문제를 공유하고 그들의 서명을 모아서, 당신의 생각을 행동으로 바꿀 수 있다."]],"w":"청원은 여러 사람이 이름을 적어 뜻을 모으는 거예요. 3번에서 문제를 공유하고 모으는 것은 서명(signature)이에요.","c":2},"h":"5f3d191fff"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Petitions draw attention to important issues that may be overlooked.)","ko":"청원은 ( ) 수도 있는 중요한 문제들에 관심을 끌어낸다.","opts":["간과되는","해결되는","기록되는","금지되는"],"word":"overlooked","r":{"a":"1) 간과되는","ev":"9번 문장","s":[[9,"Although leaders may not be able to reply to every opinion, petitions draw attention to important issues that may be overlooked.","비록 지도자들이 모든 의견에 답하지 못할 수도 있지만, 청원은 간과될 수도 있는 중요한 문제들에 관심을 끌어낸다."]],"w":"청원이 관심을 끌어내는 이유를 생각해 보세요. 사람들이 그냥 지나치기 쉬운 문제를 알리는 거예요. overlook은 '간과하다', overlooked는 '간과된'이에요.","c":1},"h":"316b0f7ace"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nOne woman wanted to change this, so she started an online petition.","ko":"밑줄 친 this가 가리키는 것은?","sko":"한 여성은 이것을 바꾸고 싶었고, 그래서 그녀는 온라인 청원을 시작했다.","opts":["온라인 청원을 시작하는 것","영국 화폐에 인쇄된 사람들이 거의 다 남자인 것","엘리자베스 2세 여왕이 화폐에 인쇄된 것","10파운드 지폐의 크기"],"r":{"a":"2) 영국 화폐에 인쇄된 사람들이 거의 다 남자인 것","ev":"4~5번 문장","s":[[4,"In the U.K., all of the people printed on money were men, except for Queen Elizabeth II.","영국에서는, 엘리자베스 2세 여왕을 제외하고는, 화폐에 인쇄된 모든 사람들이 남자였다."],[5,"One woman wanted to change this, so she started an online petition.","한 여성은 이것을 바꾸고 싶었고, 그래서 그녀는 온라인 청원을 시작했다."]],"w":"여성이 청원을 시작한 이유는 4번의 상황 때문이에요. 영국 화폐에 인쇄된 사람이 여왕을 빼고 모두 남자인 것이 바로 this예요.","c":2},"h":"2b894abef6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"One person's voice may not be enough to influence a government or a society, but online petitions can be.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"한 사람의 목소리는 정부나 사회에 영향을 주기에 충분하지 않을 수 있지만, 온라인 청원은 충분할 수 있다.","opts":["한 사람의 목소리도 온라인 청원만큼 정부에 큰 영향을 준다.","온라인 청원은 정부나 사회에 영향을 주기에 충분하지 않을 수 있다.","정부나 사회는 한 사람의 목소리에 영향을 받지 않으려고 청원을 만든다.","한 사람의 목소리로는 부족할 수 있어도, 온라인 청원은 정부나 사회에 영향을 줄 만큼 충분할 수 있다."],"r":{"a":"4) 한 사람의 목소리로는 부족할 수 있어도, 온라인 청원은 정부나 사회에 영향을 줄 만큼 충분할 수 있다.","ev":"2번 문장","s":[[2,"One person’s voice may not be enough to influence a government or a society, but online petitions can be.","정부나 사회에 영향을 주기에 한 사람의 목소리는 충분하지 않을 수 있지만, 온라인 청원은 충분할 수 있다."]],"w":"but을 기준으로 앞은 '한 사람의 목소리는 부족할 수 있다', 뒤는 '온라인 청원은 충분할 수 있다'예요. 뒤의 can be는 can be enough의 줄임이에요.","c":4},"h":"b0f8eedc0e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["청원이 실패해서 영국 화폐에는 변화가 없었다.","엘리자베스 2세 여왕의 얼굴이 10파운드 지폐에서 제인 오스틴으로 바뀌었다.","영국 은행은 찰스 다윈 대신 제인 오스틴의 얼굴을 10파운드 지폐에 인쇄하기로 했다.","청원 덕분에 10파운드 지폐에 찰스 다윈의 얼굴이 처음 인쇄되었다."],"opts":["The petition failed, so nothing changed on British money.","Queen Elizabeth II's face on the ten-pound bill was replaced by Jane Austen's.","The Bank of England decided to print Jane Austen's face on the ten-pound bill instead of Charles Darwin's.","Thanks to the petition, Charles Darwin's face was printed on the ten-pound bill for the first time."],"r":{"a":"3) The Bank of England decided to print Jane Austen's face on the ten-pound bill instead of Charles Darwin's.","ev":"7번 문장","s":[[7,"As a result, the Bank of England decided to print the face of Jane Austen, on the ten-pound bill, replacing Charles Darwin.","결과적으로, 영국 은행은 찰스 다윈을 대신하여, 제인 오스틴의 얼굴을 10파운드 지폐에 인쇄하기로 결정했다."]],"w":"7번에서 영국 은행이 찰스 다윈을 대신해 제인 오스틴의 얼굴을 10파운드 지폐에 인쇄하기로 했다고 해요. 청원은 성공했고, 바뀐 것은 다윈이지 여왕이 아니에요.","c":3},"h":"9dfed70fa5"},{"n":9,"t":"sum","q":"A woman started an online petition about British money, and many people (A) it. As a result, the Bank of England (B) to print a new face on a bill.","ko":"한 여성이 영국 화폐에 대한 온라인 청원을 시작했고, 많은 사람이 그것에 (A)했다. 그 결과 영국 은행은 지폐에 새 얼굴을 인쇄하기로 (B)했다.","oko":["(A) 무시 / (B) 거절","(A) 서명 / (B) 거절","(A) 무시 / (B) 결정","(A) 복사 / (B) 결정","(A) 서명 / (B) 결정"],"opts":["(A) ignored / (B) refused","(A) signed / (B) refused","(A) ignored / (B) decided","(A) copied / (B) decided","(A) signed / (B) decided"],"r":{"a":"5) (A) signed / (B) decided","ev":"5~7번 문장","s":[[5,"One woman wanted to change this, so she started an online petition.","한 여성은 이것을 바꾸고 싶었고, 그래서 그녀는 온라인 청원을 시작했다."],[6,"Soon, over 35,000 people signed it.","곧, 3만 5천 명이 넘는 사람들이 그것에 서명했다."],[7,"As a result, the Bank of England decided to print the face of Jane Austen, on the ten-pound bill, replacing Charles Darwin.","결과적으로, 영국 은행은 찰스 다윈을 대신하여, 제인 오스틴의 얼굴을 10파운드 지폐에 인쇄하기로 결정했다."]],"w":"5번에서 청원을 시작했고, 6번에서 많은 사람이 서명했고(signed), 7번에서 영국 은행이 인쇄하기로 결정했어요(decided).","c":5},"h":"ca0241afe3"},{"n":10,"t":"fill","q":"Petitions draw [A] to important issues, and as more people [B] in a petition, it becomes easier to inspire change.","ko":"청원은 중요한 문제들에 [A]을 끌어내고, 더 많은 사람들이 청원에 [B]할수록 변화를 일으키기가 더 쉬워진다.","bank":["attention","participate","replace","signature","bill","directly"],"bko":{"attention":"관심","participate":"참여하다","replace":"대신하다","signature":"서명","directly":"직접적으로","bill":"지폐"},"r":{"a":"[A] attention, [B] participate","ev":"9~10번 문장","s":[[9,"Although leaders may not be able to reply to every opinion, petitions draw attention to important issues that may be overlooked.","비록 지도자들이 모든 의견에 답하지 못할 수도 있지만, 청원은 간과될 수도 있는 중요한 문제들에 관심을 끌어낸다."],[10,"As more people participate in a petition, it becomes easier to inspire change for a better society.","더 많은 사람들이 청원에 참여함에 따라, 더 나은 사회를 위한 변화를 일으키는 것이 더 쉬워진다."]],"w":"9번에서 청원은 중요한 문제에 관심(attention)을 끌어낸다고 하고, 10번에서 더 많은 사람이 청원에 참여할수록(participate) 변화가 쉬워진다고 해요.","c":null},"h":"221b3d3b5b"}]},{"u":5,"id":"hk4-05-2","no":2,"ko":"레드, 화이트, 그리고 핑크\b","items":[{"n":1,"t":"tf","q":"Myoglobin stores oxygen and gives it to muscles when they need it.","ko":"미오글로빈은 산소를 저장하고 근육이 필요로 할 때 그것을 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Myoglobin stores and distributes oxygen to muscles when they need it.","미오글로빈은 산소를 저장하고 근육이 산소를 필요로 할 때(산소를) 근육에 분배한다."]],"w":"6번 문장에 Myoglobin stores and distributes oxygen to muscles when they need it이 나와요. 산소를 저장했다가 필요할 때 나누어 주는 일이 맞아요.","c":"T"},"h":"23c9caf209"},{"n":2,"t":"tf","q":"Red meat is red because of blood.","ko":"붉은 고기는 피 때문에 붉다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The reason red meat is red is not because of blood, as many people think.","붉은 고기가 붉은 이유는 많은 사람들이 생각하는 것처럼, 피 때문이 아니다."]],"w":"4번 문장은 붉은 고기가 붉은 이유가 많은 사람들이 생각하는 것처럼 피 때문이 아니라고 해요. 진짜 이유는 미오글로빈이에요.","c":"F"},"h":"50fbd02a47"},{"n":3,"t":"tf","q":"Chickens run and jump all day long.","ko":"닭은 하루 종일 달리고 뛴다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"They only occasionally run or jump.","그것들은 가끔씩 달리거나 뛰기만 한다."]],"w":"14번 문장은 닭이 가끔씩만(only occasionally) 달리거나 뛴다고 해요. '하루 종일'은 본문과 반대예요.","c":"F"},"h":"ad0c0bcf6a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Myoglobin stores and distributes oxygen to muscles when they need it.)","ko":"미오글로빈은 산소를 저장하고 근육이 산소를 필요로 할 때 근육에 ( ).","opts":["숨긴다","만든다","분배한다","빼앗는다"],"word":"distributes","r":{"a":"3) 분배한다","ev":"6번 문장","s":[[6,"Myoglobin stores and distributes oxygen to muscles when they need it.","미오글로빈은 산소를 저장하고 근육이 산소를 필요로 할 때(산소를) 근육에 분배한다."]],"w":"산소를 저장해 두었다가 근육이 필요할 때 근육에게 나누어 주는 거예요. distribute는 '분배하다'예요.","c":3},"h":"e8b98bc657"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They only occasionally run or jump.)","ko":"그것들은 ( ) 달리거나 뛰기만 한다.","opts":["매일","가끔씩","하루 종일","절대"],"word":"occasionally","r":{"a":"2) 가끔씩","ev":"14번 문장","s":[[14,"They only occasionally run or jump.","그것들은 가끔씩 달리거나 뛰기만 한다."]],"w":"닭은 소처럼 많이 움직이지 않아요(13번). 그래서 occasionally는 '가끔씩'이에요.","c":2},"h":"8e7a55d509"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes beef look very red.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 소고기가 매우 빨갛게 보이도록 만든다.","opts":["소가 서 있거나 걷는 것","닭이 가끔 달리거나 뛰는 것","소고기가 피 때문에 붉은 것","소의 근육에 미오글로빈이 더 많이 들어 있는 것"],"r":{"a":"4) 소의 근육에 미오글로빈이 더 많이 들어 있는 것","ev":"11~12번 문장","s":[[11,"Therefore, their muscles contain more myoglobin.","따라서, 그것들의 근육엔 더 많은 미오글로빈이 들어 있다."],[12,"This makes beef look very red.","이것은 소고기가 매우 빨갛게 보이도록 만든다."]],"w":"12번 바로 앞 11번에서 소의 근육에 더 많은 미오글로빈이 들어 있다고 했어요. 그래서 소고기가 매우 빨갛게 보이는 거예요.","c":4},"h":"67df987e88"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It depends on how long and how much they move.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 그것들이 얼마나 오래 그리고 얼마나 많이 움직이는지에 달려있다.","opts":["그것은 동물이 얼마나 오래, 얼마나 많이 움직이는지에 달려 있다.","그것은 동물이 얼마나 오래 사는지에 달려 있다.","그것은 동물이 무엇을 먹는지에 달려 있다.","그것은 동물이 얼마나 빨리 자라는지에 달려 있다."],"r":{"a":"1) 그것은 동물이 얼마나 오래, 얼마나 많이 움직이는지에 달려 있다.","ev":"7~8번 문장","s":[[7,"Some animals have lots of myoglobin in their muscles and others have less.","어떤 동물들은 근육에 많은 미오글로빈이 있고 다른 동물들은 더 적게 있다."],[8,"It depends on how long and how much they move.","그것은 그것들이 얼마나 오래 그리고 얼마나 많이 움직이는지에 달려있다."]],"w":"7번에서 동물마다 근육 속 미오글로빈의 양이 다르다고 했고, 8번의 It은 그 차이예요. 그 차이는 얼마나 오래, 얼마나 많이 움직이는지에 달려 있어요.","c":1},"h":"b776424b4a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["닭고기는 모두 소고기만큼 붉다.","닭의 다리 살은 약간 분홍색이고 날개와 가슴살은 흰색이다.","닭은 서 있거나 걷는 데 긴 시간을 보낸다.","닭의 날개는 다리보다 더 분홍색이다."],"opts":["All chicken meat is as red as beef.","The meat from chicken legs is slightly pink, but the wings and breast are white.","Chickens spend long periods of time standing or walking.","Chicken wings are pinker than chicken legs."],"r":{"a":"2) The meat from chicken legs is slightly pink, but the wings and breast are white.","ev":"15번 문장","s":[[15,"As a result, the meat from their legs is slightly pink, but everywhere else, including the wings and breast, is white.","그 결과, 그것들의 다리 살은 약간 분홍색이지만, 날개와 가슴살을 포함한 다른 모든 데는 흰색이다."]],"w":"15번에서 닭의 다리 살은 약간 분홍색이고, 날개와 가슴살을 포함한 다른 곳은 흰색이라고 해요. 서 있거나 걷는 데 긴 시간을 보내는 것은 소예요(9번).","c":2},"h":"96a6606fcd"},{"n":9,"t":"sum","q":"Cows spend a long time (A), so their muscles contain (B) myoglobin and the beef looks very red.","ko":"소는 긴 시간을 (A)하며 보내서 근육에 미오글로빈이 (B) 들어 있고, 소고기가 매우 빨갛게 보인다.","oko":["(A) 쉬며 / (B) 더 많은","(A) 쉬며 / (B) 더 적은","(A) 움직이며 / (B) 더 많은","(A) 움직이며 / (B) 더 적은","(A) 먹으며 / (B) 더 적은"],"opts":["(A) resting / (B) more","(A) resting / (B) less","(A) moving / (B) more","(A) moving / (B) less","(A) eating / (B) less"],"r":{"a":"3) (A) moving / (B) more","ev":"9~12번 문장","s":[[9,"Cows usually spend long periods of time standing or walking.","소는 보통 서 있거나 걷는 데 긴 시간을 보낸다."],[10,"This continuous activity requires them to use all of their body muscles.","이러한 지속적인 활동은 그것들로 하여금 모든 신체 근육을 사용할 것을 요구한다."],[11,"Therefore, their muscles contain more myoglobin.","따라서, 그것들의 근육엔 더 많은 미오글로빈이 들어 있다."],[12,"This makes beef look very red.","이것은 소고기가 매우 빨갛게 보이도록 만든다."]],"w":"9번에서 소는 서 있거나 걷는 데 긴 시간을 보내요(움직임). 10~11번에서 근육을 다 쓰니 미오글로빈이 더 많고, 12번에서 소고기가 매우 빨갛게 보여요.","c":3},"h":"10282c199d"},{"n":10,"t":"fill","q":"The meat from chicken legs is slightly [A], but the wings and breast are [B].","ko":"닭의 다리 살은 약간 [A]이지만, 날개와 가슴살은 [B]이다.","bank":["pink","white","oxygen","jump","blood","run"],"bko":{"pink":"분홍색","white":"흰색","oxygen":"산소","jump":"뛰다","blood":"피","run":"달리다"},"r":{"a":"[A] pink, [B] white","ev":"15번 문장","s":[[15,"As a result, the meat from their legs is slightly pink, but everywhere else, including the wings and breast, is white.","그 결과, 그것들의 다리 살은 약간 분홍색이지만, 날개와 가슴살을 포함한 다른 모든 데는 흰색이다."]],"w":"15번에서 닭의 다리 살은 약간 분홍색(pink)이고, 날개와 가슴살을 포함한 다른 곳은 흰색(white)이라고 해요.","c":null},"h":"6d769e8aae"}]},{"u":5,"id":"hk4-05-3","no":3,"ko":"월요일이 기다려지는 이유\b","items":[{"n":1,"t":"tf","q":"On the fourth Friday of November, stores and malls in the U.S. are full of chaos.","ko":"11월 넷째 주 금요일에 미국의 상점과 쇼핑몰은 혼란으로 가득 찬다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"On the fourth Friday of November, stores and malls in the U.S. are full of chaos.","11월의 넷째 주 금요일에, 미국의 상점과 쇼핑몰은 혼란으로 가득 찬다."]],"w":"1번 문장에 are full of chaos(혼란으로 가득 차다)가 그대로 나와요.","c":"T"},"h":"1bfa5acc19"},{"n":2,"t":"tf","q":"Cyber Monday is an event that takes place on the Monday before Black Friday.","ko":"사이버 먼데이는 블랙 프라이데이 전 월요일에 열리는 행사이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"It’s an online event that takes place on the Monday after Black Friday.","그것은 블랙 프라이데이의 다음 주 월요일에 열리는 온라인 행사이다."]],"w":"5번 문장은 블랙 프라이데이의 다음 주(the Monday after) 월요일에 열린다고 해요. before(전)는 틀려요.","c":"F"},"h":"5c408e8020"},{"n":3,"t":"tf","q":"Many companies offer discounts of up to 90% on Black Friday.","ko":"많은 기업이 블랙 프라이데이에 90퍼센트까지의 할인을 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"On this day, many companies offer discounts of up to 90% on products such as electronics, clothes, and toys.","이날에는, 많은 기업이 전자 기기, 의류, 그리고 장난감과 같은 상품에 대해 90퍼센트까지의 할인을 제공한다."]],"w":"3번 문장에서 many companies offer discounts of up to 90%라고 해요.","c":"T"},"h":"8154ee681c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These discount events are beneficial for companies as well as consumers.)","ko":"이러한 할인 행사는 소비자들에게뿐만 아니라 기업에도 ( ).","opts":["해가 되는","이익이 되는","지루한","위험한"],"word":"beneficial","r":{"a":"2) 이익이 되는","ev":"8번 문장","s":[[8,"These discount events are beneficial for companies as well as consumers.","이러한 할인 행사는 소비자들에게뿐만 아니라 기업에도 이익이 된다."]],"w":"할인 행사는 소비자뿐 아니라 기업에도 좋은 점이 있다는 말이에요. 뒤에서 기업이 얻는 이유를 설명해요. beneficial은 '이익이 되는'이에요.","c":2},"h":"b2a5bce331"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...which is usually high in the U.S. due to its vast size.)","ko":"...미국의 ( ) 크기 때문에 미국에서 보통 높다.","opts":["작은","평범한","광대한","변하는"],"word":"vast","r":{"a":"3) 광대한","ev":"10번 문장","s":[[10,"This results in an extra shipping cost, which is usually high in the U.S. due to its vast size.","이것은 추가적인 운송 비용을 야기하는데, 미국의 광대한 크기 때문에 미국에서 이것은 보통 높다."]],"w":"운송 비용이 높은 이유가 미국의 크기예요. 미국이 매우 넓어서 상품을 보내는 데 돈이 많이 들죠. vast는 '광대한, 매우 넓은'이에요.","c":3},"h":"7258ff4650"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen there are unsold items, companies have to send them to their other branches or to discount outlets.","ko":"밑줄 친 them이 가리키는 것은?","sko":"팔리지 않은 상품이 있을 때, 기업은 그것들을 다른 지점이나 할인 매장으로 보내야 한다.","opts":["소비자들","다른 지점들","팔리지 않은 상품들","할인 매장들"],"r":{"a":"3) 팔리지 않은 상품들","ev":"9번 문장","s":[[9,"When there are unsold items, companies have to send them to their other branches or to discount outlets.","팔리지 않은 상품이 있을 때, 기업은 그것들을 다른 지점이나 할인 매장으로 보내야 한다."]],"w":"보내지는 것은 앞에 나온 unsold items(팔리지 않은 상품)예요. 지점과 할인 매장은 보내는 장소예요.","c":3},"h":"7322f96707"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Consumers can easily shop on the Internet without having to visit a crowded store.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"소비자들은 사람들이 붐비는 가게에 방문할 필요 없이 인터넷상에서 쉽게 쇼핑할 수 있다.","opts":["소비자들은 인터넷에서 붐비는 가게의 위치를 쉽게 찾을 수 있다.","소비자들은 인터넷에서 쇼핑하려면 가게에 꼭 방문해야 한다.","소비자들은 붐비는 가게에서만 쉽게 쇼핑할 수 있다.","소비자들은 붐비는 가게에 방문하지 않아도 인터넷에서 쉽게 쇼핑할 수 있다."],"r":{"a":"4) 소비자들은 붐비는 가게에 방문하지 않아도 인터넷에서 쉽게 쇼핑할 수 있다.","ev":"6번 문장","s":[[6,"Consumers can easily shop on the Internet without having to visit a crowded store.","소비자들은 사람들이 붐비는 가게에 방문할 필요 없이 인터넷상에서 쉽게 쇼핑할 수 있다."]],"w":"without having to visit a crowded store는 '붐비는 가게에 방문할 필요 없이'예요. 인터넷으로 가게에 가지 않고 쇼핑한다는 뜻이에요.","c":4},"h":"0e312584d4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사이버 먼데이에는 블랙 프라이데이에 팔리지 않은 상품이 훨씬 더 낮은 가격에 팔린다.","사이버 먼데이에는 블랙 프라이데이에 팔린 상품이 더 비싼 가격에 다시 팔린다.","사이버 먼데이의 할인은 옷에만 최대 90퍼센트까지 적용된다.","사이버 먼데이에 팔리지 않은 상품은 블랙 프라이데이로 돌려보내진다."],"opts":["On Cyber Monday, goods that were not sold on Black Friday are sold at an even lower price.","On Cyber Monday, goods sold on Black Friday are sold again at a higher price.","The discounts of up to 90% on Cyber Monday are only for clothes.","Goods not sold on Cyber Monday are sent back to Black Friday."],"r":{"a":"1) On Cyber Monday, goods that were not sold on Black Friday are sold at an even lower price.","ev":"7번 문장","s":[[7,"And on Cyber Monday, goods that were not sold on Black Friday are sold at an even lower price.","그리고 사이버 먼데이에는, 블랙 프라이데이에 팔리지 않은 상품이 훨씬 더 낮은 가격에 팔린다."]],"w":"7번에서 블랙 프라이데이에 팔리지 않은 상품이 사이버 먼데이에 훨씬 더 낮은 가격에 팔린다고 해요.","c":1},"h":"31ea71a2bb"},{"n":9,"t":"sum","q":"Unsold goods have to be sent ignore the tics and just treat them as you would treat anyone else.","따라서, 할 수 있는 가장 좋은 것은 틱을 무시하고 그냥 그들을 다른 사람을 대하는 것처럼 대하는 것이다."]],"w":"멈추도록 강요하면 안 좋다고 했어요(10번). 그래서 가장 좋은 것은 틱에 신경 쓰지 않는 거예요. ignore는 '무시하다'예요.","c":2},"h":"a1373d95c3"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIt's not usually a serious matter, as the symptoms naturally disappear when they get older.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그들이 나이가 들면 증상이 자연스럽게 사라지기 때문에, 이것은 대개 심각한 문제는 아니다.","opts":["증상들","의사들","틱 장애","틱이 있는 아이들"],"r":{"a":"4) 틱이 있는 아이들","ev":"8~9번 문장","s":[[8,"Between 10 to 20 percent of children worldwide have tics.","전 세계에서 10에서 20퍼센트 사이의 아이들이 틱을 가지고 있다."],[9,"It’s not usually a serious matter, as the symptoms naturally disappear when they get older.","그들이 나이가 들면 증상이 자연스럽게 사라지기 때문에, 이것은 대개 심각한 문제는 아니다."]],"w":"나이가 드는 것은 증상이 아니라 사람이에요. 바로 앞 8번에서 틱을 가진 아이들을 말했으니, they는 틱이 있는 아이들이에요.","c":4},"h":"bb460eb492"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Tic disorders are much more common than we think.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"틱 장애는 우리가 생각하는 것보다 훨씬 더 흔하다.","opts":["틱 장애는 우리가 생각하는 것보다 훨씬 더 흔하다.","틱 장애는 우리가 생각하는 것보다 훨씬 더 드물다.","틱 장애는 우리가 생각하는 것만큼만 흔하다.","틱 장애는 어른에게만 흔하다."],"r":{"a":"1) 틱 장애는 우리가 생각하는 것보다 훨씬 더 흔하다.","ev":"7번 문장","s":[[7,"Tic disorders are much more common than we think.","틱 장애는 우리가 생각하는 것보다 훨씬 더 흔하다."]],"w":"much more common than we think는 '우리가 생각하는 것보다 훨씬 더 흔하다'예요. 바로 뒤 8번의 10~20퍼센트라는 숫자가 이를 보여 줘요.","c":1},"h":"c952bde6eb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Edward는 집에서만 소리를 낸다.","Edward는 반 친구들을 괴롭히려고 일부러 소리를 낸다.","Edward는 다른 사람들이 조용할 때나 수업 중에도 소리를 낸다.","Edward는 다른 사람들이 조용하면 소리를 멈춘다."],"opts":["Edward makes the sound only at home.","Edward makes the sound on purpose to bother his classmates.","Edward makes the noise when other people are quiet and even during class.","Edward stops making the sound when others are quiet."],"r":{"a":"3) Edward makes the noise when other people are quiet and even during class.","ev":"2~3번 문장","s":[[2,"He makes the noise when other people are quiet and even during class.","그는 다른 사람들이 조용할 때 그리고 심지어 수업 중에도 그 소리를 낸다."],[3,"However, he doesn’t do it on purpose.","하지만, 그는 그것을 고의로 하지 않는다."]],"w":"2번에서 다른 사람들이 조용할 때나 수업 중에도 소리를 낸다고 해요. 3번에서 고의로 하는 것은 아니라고 했으니 일부러 괴롭히려는 게 아니에요.","c":3},"h":"7b17678d5b"},{"n":9,"t":"sum","q":"If people with tics are (A) to stop, they can get stressed, so the best thing is to (B) the tics.","ko":"틱이 있는 사람들이 멈추도록 (A)받으면 스트레스를 받을 수 있어서, 가장 좋은 것은 틱을 (B)하는 것이다.","oko":["(A) 허락 / (B) 무시","(A) 강요 / (B) 흉내","(A) 허락 / (B) 흉내","(A) 강요 / (B) 무시","(A) 도움 / (B) 고치기"],"opts":["(A) allowed / (B) ignore","(A) forced / (B) copy","(A) allowed / (B) copy","(A) forced / (B) ignore","(A) helped / (B) fix"],"r":{"a":"4) (A) forced / (B) ignore","ev":"10~11번 문장","s":[[10,"But if you force people with tics to stop, they can get stressed, and this can make the symptoms worse.","하지만 만약 틱이 있는 사람들에게 멈추도록 강요한다면, 그들은 스트레스를 받을 수 있고, 이것은 증상을 더 악화시킬 수 있다."],[11,"Thus, the best thing to do is ignore the tics and just treat them as you would treat anyone else.","따라서, 할 수 있는 가장 좋은 것은 틱을 무시하고 그냥 그들을 다른 사람을 대하는 것처럼 대하는 것이다."]],"w":"10번에서 멈추도록 강요받으면(forced) 스트레스를 받을 수 있고, 11번에서 가장 좋은 것은 틱을 무시하는(ignore) 거라고 해요.","c":4},"h":"a5e575462c"},{"n":10,"t":"fill","q":"Tic disorders can cause [A] such as blinking eyes, and 10 to 20 percent of [B] worldwide have tics.","ko":"틱 장애는 눈 깜빡임 같은 [A]을 일으킬 수 있고, 전 세계 [B]의 10에서 20퍼센트가 틱을 가지고 있다.","bank":["symptoms","children","classroom","purpose","throats","percent"],"bko":{"symptoms":"증상들","children":"아이들","classroom":"교실","purpose":"목적","throats":"목구멍들","percent":"퍼센트"},"r":{"a":"[A] symptoms, [B] children","ev":"6, 8번 문장","s":[[6,"Those who suffer from it may experience a wide range of symptoms, such as blinking their eyes, shaking their heads, clearing their throats, or saying a particular word repeatedly.","그것을 앓는 사람들은 눈을 깜빡이는 것, 머리를 흔드는 것, 헛기침을 하는 것, 또는 특정한 단어를 반복적으로 말하는 것과 같은 다양한 증상을 겪을 수도 있다."],[8,"Between 10 to 20 percent of children worldwide have tics.","전 세계에서 10에서 20퍼센트 사이의 아이들이 틱을 가지고 있다."]],"w":"6번에서 눈 깜빡임 같은 다양한 증상(symptoms)을 말하고, 8번에서 전 세계 아이들(children)의 10~20퍼센트가 틱을 가진다고 해요.","c":null},"h":"50c50b8bac"}]},{"u":6,"id":"hk4-06-1","no":1,"ko":"한 달의 유혹\b","items":[{"n":1,"t":"tf","q":"Many movie and music streaming services offer free usage for a certain period of time.","ko":"많은 영화와 음악 스트리밍 서비스는 일정한 기간 동안 무료 이용을 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"A number of movie and music streaming services offer free usage for a certain period of time.","많은 영화와 음악 스트리밍 서비스는 일정한 기간 동안 무료 이용을 제공한다."]],"w":"2번 문장에 offer free usage for a certain period of time이 그대로 나와요.","c":"T"},"h":"2a6d5cedb5"},{"n":2,"t":"tf","q":"People who forget to cancel their subscriptions don't pay anything for the next term.","ko":"구독을 취소할 것을 잊은 사람들은 다음 기간에 아무것도 내지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"People who forget to cancel their subscriptions are automatically charged for another term.","구독을 취소할 것을 잊은 사람들은 다음 기간에 대해 자동적으로 요금이 부과된다."]],"w":"5번 문장은 취소를 잊은 사람들이 다음 기간에 대해 자동으로 요금이 부과된다(are automatically charged)고 해요. 내지 않는다는 말은 반대예요.","c":"F"},"h":"0fd25848e9"},{"n":3,"t":"tf","q":"You can call the customer service center at any time of the day.","ko":"하루 중 언제든지 고객 서비스 센터에 전화할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"For instance, you might have to call the customer service center only during office hours.","예를 들어, 당신은 영업시간 동안에만 고객 서비스 센터에 전화해야 할지도 모른다."]],"w":"8번 문장에서 고객 서비스 센터에는 영업시간에만(only during office hours) 전화해야 할 수도 있다고 해요.","c":"F"},"h":"686d62e200"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, problems occur when the free trial period is over and you don't want the service anymore.)","ko":"하지만, 무료 체험 기간이 끝나고 그 서비스를 더 이상 원치 않게 되면 문제가 ( ).","opts":["사라진다","해결된다","생긴다","줄어든다"],"word":"occur","r":{"a":"3) 생긴다","ev":"4번 문장","s":[[4,"However, problems occur when the free trial period is over and you don’t want the service anymore.","하지만, 무료 체험 기간이 끝나고 그 서비스를 더 이상 원치 않게 되면 문제가 생긴다."]],"w":"However 뒤에서 좋은 점과 반대되는 문제를 말해요. 체험이 끝났는데 서비스가 필요 없을 때 문제가 생기는 거예요. occur는 '생기다'예요.","c":3},"h":"3432d2945e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (People who forget to cancel their subscriptions are automatically charged for another term.)","ko":"구독을 취소할 것을 잊은 사람들은 다음 기간에 대해 ( ) 요금이 부과된다.","opts":["천천히","자동적으로","가끔","직접"],"word":"automatically","r":{"a":"2) 자동적으로","ev":"5번 문장","s":[[5,"People who forget to cancel their subscriptions are automatically charged for another term.","구독을 취소할 것을 잊은 사람들은 다음 기간에 대해 자동적으로 요금이 부과된다."]],"w":"취소를 잊었을 뿐인데 요금이 나가는 상황이에요. 내가 따로 하지 않아도 저절로 부과된다는 뜻이라서 automatically는 '자동적으로'예요.","c":2},"h":"d2e1cd7def"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nMoreover, some of them even make it hard to cancel subscriptions.","ko":"밑줄 친 them이 가리키는 것은?","sko":"게다가, 그들 중 일부는 심지어 구독을 취소하는 것을 어렵게 만든다.","opts":["구독을 취소하는 사람들","이용자들","직원들","무료 체험을 제공하는 회사들"],"r":{"a":"4) 무료 체험을 제공하는 회사들","ev":"6~7번 문장","s":[[6,"And few companies remind their users of when their free trial ends.","그리고 이용자에게 그들의 무료 체험이 언제 끝나는지를 다시 한번 알려주는 회사는 거의 없다."],[7,"Moreover, some of them even make it hard to cancel subscriptions.","게다가, 그들 중 일부는 심지어 구독을 취소하는 것을 어렵게 만든다."]],"w":"구독을 취소하기 어렵게 만드는 쪽은 서비스를 제공하는 회사예요. 바로 앞 6번의 few companies(회사들)가 them이에요.","c":4},"h":"b96461dae8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Also, mark your calendar so that you can cancel the unwanted service in time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"또한, 당신이 원치 않는 서비스를 제시간에 취소할 수 있도록 당신의 달력에 표시해둬라.","opts":["원치 않는 서비스를 제시간에 취소할 수 있도록 달력에 표시해 두어라.","원치 않는 서비스를 취소했다는 사실을 달력에 표시해 두어라.","달력에 표시하려면 원치 않는 서비스를 먼저 취소해야 한다.","달력에 표시한 날에만 원치 않는 서비스를 취소할 수 있다."],"r":{"a":"1) 원치 않는 서비스를 제시간에 취소할 수 있도록 달력에 표시해 두어라.","ev":"11번 문장","s":[[11,"Also, mark your calendar so that you can cancel the unwanted service in time.","또한, 당신이 원치 않는 서비스를 제시간에 취소할 수 있도록 당신의 달력에 표시해둬라."]],"w":"so that은 '~하도록'이라는 목적이에요. 달력에 표시하는 이유가 원치 않는 서비스를 제시간에 취소하기 위해서라는 뜻이에요.","c":1},"h":"137704fabd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["무료 체험은 돈을 내지 않아도 영원히 이어진다.","회사들은 항상 무료 체험이 끝나는 날을 이용자에게 알려 준다.","직원과 이야기하는 데만도 오랜 시간이 걸릴 수 있다.","버튼 하나로 어떤 구독이든 취소할 수 있다."],"opts":["A free trial continues forever without any payment.","Companies always remind users when their free trial ends.","Just speaking to an employee can take a long time.","You can cancel any subscription by pressing one button."],"r":{"a":"3) Just speaking to an employee can take a long time.","ev":"9번 문장","s":[[9,"And it could take a long time just to speak to an employee.","그리고 단지 직원과 이야기하는 것에도 오랜 시간이 걸릴 수 있다."]],"w":"9번에서 단지 직원과 이야기하는 것에도 오랜 시간이 걸릴 수 있다고 해요. 6번에서 알려 주는 회사는 거의 없다고 했으니 항상 알려 준다는 말은 틀려요.","c":3},"h":"33193be9e7"},{"n":9,"t":"sum","q":"If you forget to (A) a free trial, you are automatically (B) for another term, and few companies remind you of the end of the trial.","ko":"무료 체험을 (A)할 것을 잊으면 다음 기간에 대해 자동으로 (B)되고, 체험이 끝나는 때를 알려 주는 회사도 거의 없다.","oko":["(A) 시작 / (B) 환불","(A) 취소 / (B) 환불","(A) 시작 / (B) 요금 부과","(A) 공유 / (B) 요금 부과","(A) 취소 / (B) 요금 부과"],"opts":["(A) start / (B) refunded","(A) cancel / (B) refunded","(A) start / (B) charged","(A) share / (B) charged","(A) cancel / (B) charged"],"r":{"a":"5) (A) cancel / (B) charged","ev":"4~6번 문장","s":[[4,"However, problems occur when the free trial period is over and you don’t want the service anymore.","하지만, 무료 체험 기간이 끝나고 그 서비스를 더 이상 원치 않게 되면 문제가 생긴다."],[5,"People who forget to cancel their subscriptions are automatically charged for another term.","구독을 취소할 것을 잊은 사람들은 다음 기간에 대해 자동적으로 요금이 부과된다."],[6,"And few companies remind their users of when their free trial ends.","그리고 이용자에게 그들의 무료 체험이 언제 끝나는지를 다시 한번 알려주는 회사는 거의 없다."]],"w":"4번에서 체험 기간이 끝나고 문제가 생긴다고 하고, 5번에서 취소(cancel)를 잊으면 요금이 부과된다(charged)고 해요. 6번에서 끝나는 때를 알려 주는 회사는 거의 없다고 해요.","c":5},"h":"903ba992de"},{"n":10,"t":"fill","q":"Before you [A] up for a subscription, check the terms and conditions, and mark your [B].","ko":"구독을 신청하기 전에 이용 약관을 확인하고, 당신의 [B]에 표시해 두어라.","bank":["sign","calendar","employee","usage","charge","online"],"bko":{"sign":"신청하다(서명하다)","calendar":"달력","employee":"직원","usage":"이용","charge":"요금","online":"온라인의"},"r":{"a":"[A] sign, [B] calendar","ev":"10~11번 문장","s":[[10,"Thus, it’s important to check the terms and conditions of free trials before you sign up for a subscription.","그러므로, 구독을 신청하기 전에 무료 체험의 이용 약관을 확인하는 것이 중요하다."],[11,"Also, mark your calendar so that you can cancel the unwanted service in time.","또한, 당신이 원치 않는 서비스를 제시간에 취소할 수 있도록 당신의 달력에 표시해둬라."]],"w":"10번에서 구독을 신청하기(sign up) 전에 이용 약관을 확인하라고 하고, 11번에서 달력(calendar)에 표시하라고 해요.","c":null},"h":"265db981b3"}]},{"u":6,"id":"hk4-06-2","no":2,"ko":"시큰시큰, 내 손목이 위험해\b","items":[{"n":1,"t":"tf","q":"You should stay still for one minute during the test.","ko":"검사 중에는 1분 동안 가만히 있어야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Then, stay still for one minute.","그 다음, 1분 동안 가만히 있어라."]],"w":"3번 문장에 stay still for one minute(1분 동안 가만히 있어라)가 나와요.","c":"T"},"h":"ccec04240a"},{"n":2,"t":"tf","q":"In the beginning, you may feel severe pain in the entire wrist.","ko":"초기에는 손목 전체에 극심한 통증을 느낄 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"In the beginning, you might lose some feeling in your palm and fingers.","초기에는, 손바닥과 손가락에 감각을 잃을 수 있다."],[8,"However, later on, you can experience severe pain in the entire wrist.","하지만, 나중에는, 손목 전체에 극심한 통증을 겪을 수 있다."]],"w":"7번에서 초기에는 손바닥과 손가락의 감각을 잃는다고 하고, 극심한 통증은 8번에서 나중에(later on) 생긴다고 해요.","c":"F"},"h":"635f3e75b5"},{"n":3,"t":"tf","q":"People with this condition may often drop things.","ko":"이 질환을 가진 사람들은 물건을 자주 떨어뜨릴 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"You may often drop things or have difficulty in using chopsticks.","당신은 물건을 자주 떨어뜨리거나 젓가락을 사용하는 데 어려움을 겪을 수 있다."]],"w":"10번 문장에 You may often drop things가 나와요.","c":"T"},"h":"aff768e74d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Carpal tunnel syndrome occurs when this tunnel gets squeezed and puts pressure on the nerves.)","ko":"이 터널이 ( ) 신경에 압박을 가하면, 손목 터널 증후군이 발생한다.","opts":["넓어져","조여져","사라져","길어져"],"word":"squeezed","r":{"a":"2) 조여져","ev":"6번 문장","s":[[6,"Carpal tunnel syndrome occurs when this tunnel gets squeezed and puts pressure on the nerves.","이 터널이 조여져서 신경에 압박을 가하면, 손목 터널 증후군이 발생한다."]],"w":"터널이 신경을 누른다(put pressure)고 했으니 터널이 좁아져 눌린다는 뜻이에요. squeeze는 '조이다'이고 gets squeezed는 '조여지다'예요.","c":2},"h":"09ae8de635"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, later on, you can experience severe pain in the entire wrist.)","ko":"하지만, 나중에는, 손목 전체에 ( ) 통증을 겪을 수 있다.","opts":["가벼운","잠깐의","이상한","극심한"],"word":"severe","r":{"a":"4) 극심한","ev":"8번 문장","s":[[8,"However, later on, you can experience severe pain in the entire wrist.","하지만, 나중에는, 손목 전체에 극심한 통증을 겪을 수 있다."]],"w":"초기의 감각 저하(7번)와 대비해 However로 더 심한 증상을 말해요. severe는 '극심한'이에요.","c":4},"h":"23ee87a158"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis causes some problems in everyday life.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 일상생활에 몇몇 문제를 유발한다.","opts":["간단한 검사를 하는 것","젓가락을 사용하는 것","손바닥과 손가락의 감각 저하와 손목 전체의 극심한 통증","스마트폰을 사용하는 것"],"r":{"a":"3) 손바닥과 손가락의 감각 저하와 손목 전체의 극심한 통증","ev":"7~9번 문장","s":[[7,"In the beginning, you might lose some feeling in your palm and fingers.","초기에는, 손바닥과 손가락에 감각을 잃을 수 있다."],[8,"However, later on, you can experience severe pain in the entire wrist.","하지만, 나중에는, 손목 전체에 극심한 통증을 겪을 수 있다."],[9,"This causes some problems in everyday life.","이것은 일상생활에 몇몇 문제를 유발한다."]],"w":"일상생활에 문제를 일으키는 것은 바로 앞 7~8번의 증상이에요. 젓가락 사용은 그 문제의 예시로 10번에 나와요.","c":3},"h":"5838256139"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you feel pain in the palm and first three fingers, you may have carpal tunnel syndrome.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 손바닥과 첫 세 손가락에 통증을 느낀다면, 당신은 손목 터널 증후군을 가지고 있을지도 모른다.","opts":["손바닥과 첫 세 손가락에 통증이 느껴지면, 손목 터널 증후군일 수도 있다.","손바닥과 첫 세 손가락에 통증이 없으면, 손목 터널 증후군일 수도 있다.","손목 전체에 통증이 느껴지면, 반드시 손목 터널 증후군이다.","손가락 세 개에 통증이 느껴지면, 손목 터널 증후군이 나아진다."],"r":{"a":"1) 손바닥과 첫 세 손가락에 통증이 느껴지면, 손목 터널 증후군일 수도 있다.","ev":"4번 문장","s":[[4,"If you feel pain in the palm and first three fingers, you may have carpal tunnel syndrome.","만약 손바닥과 첫 세 손가락에 통증을 느낀다면, 당신은 손목 터널 증후군을 가지고 있을지도 모른다."]],"w":"If절은 '통증을 느낀다면', may have는 '가지고 있을지도 모른다'예요. 확실하다는 뜻이 아니고 가능성을 말해요.","c":1},"h":"a72e093fcc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["손목 터널 증후군을 가진 사람의 수는 요즘 줄어들고 있다.","이 질환을 가진 사람들의 수는 요즘 증가하고 있다.","손목 터널 증후군은 나이 든 사람만 걸린다.","스마트폰을 잠깐 쓰는 것이 위험성을 크게 높인다."],"opts":["The number of people with carpal tunnel syndrome is going down these days.","The number of people with this condition is increasing these days.","Only old people get carpal tunnel syndrome.","Using smartphones for a short time greatly raises the risk."],"r":{"a":"2) The number of people with this condition is increasing these days.","ev":"11번 문장","s":[[11,"These days, the number of people with this condition is increasing.","요즘에, 이 질환을 가진 사람들의 수가 증가하고 있다."]],"w":"11번에서 요즘 이 질환을 가진 사람들의 수가 증가하고 있다고 해요. 12번에서 이유는 스마트폰이나 키보드를 너무 오래 쓰기 때문이라고 했어요.","c":2},"h":"96d00f551b"},{"n":9,"t":"sum","q":"Carpal tunnel syndrome occurs when a narrow (A) in the wrist gets squeezed and puts pressure on the (B).","ko":"손목 터널 증후군은 손목에 있는 좁은 (A)가 조여져서 (B)에 압박을 가할 때 생긴다.","oko":["(A) 뼈 / (B) 신경","(A) 공간 / (B) 뼈","(A) 피부 / (B) 손가락","(A) 뼈 / (B) 피부","(A) 공간 / (B) 신경"],"opts":["(A) bone / (B) nerves","(A) space / (B) bones","(A) skin / (B) fingers","(A) bone / (B) skin","(A) space / (B) nerves"],"r":{"a":"5) (A) space / (B) nerves","ev":"5~6번 문장","s":[[5,"In the wrist, there is a narrow space like a tunnel, which nerves pass through.","손목에는, 터널과 같은 좁은 공간이 있는데, 신경이 이것을 통과해 지나간다."],[6,"Carpal tunnel syndrome occurs when this tunnel gets squeezed and puts pressure on the nerves.","이 터널이 조여져서 신경에 압박을 가하면, 손목 터널 증후군이 발생한다."]],"w":"5번에서 손목에는 터널 같은 좁은 공간(space)이 있고 신경(nerves)이 지나간다고 해요. 6번에서 이 터널이 조여져 신경을 누르면 증후군이 생겨요.","c":5},"h":"2bc3b6e249"},{"n":10,"t":"fill","q":"Using smartphones or typing on keyboards for too long causes [A] hand movements and increases the [B].","ko":"스마트폰이나 키보드를 너무 오래 사용하는 것은 [A] 손의 움직임을 유발하고 [B]을 증가시킨다.","bank":["repetitive","risk","palm","chopsticks","wrist","nerves"],"bko":{"repetitive":"반복적인","risk":"위험(성)","palm":"손바닥","chopsticks":"젓가락","wrist":"손목","nerves":"신경"},"r":{"a":"[A] repetitive, [B] risk","ev":"12~13번 문장","s":[[12,"This is because people use smartphones or type on keyboards for too long today.","이것은 오늘날 사람들이 너무 오랫동안 스마트폰을 사용하거나 키보드로 타자를 치기 때문이다."],[13,"These tasks cause repetitive hand movements and increase the risk.","이러한 일은 반복적인 손의 움직임을 유발해서 위험성을 증가시킨다."]],"w":"12~13번에서 스마트폰을 쓰거나 타자를 치는 일이 반복적인(repetitive) 손동작을 만들어 위험(risk)을 높인다고 해요.","c":null},"h":"80350c5a83"}]},{"u":6,"id":"hk4-06-3","no":3,"ko":"아직은 안 되는 이유\b","items":[{"n":1,"t":"tf","q":"In the first example, if the car goes straight, five people will be injured.","ko":"첫 번째 예시에서, 자동차가 직진하면 다섯 명이 부상을 당할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"If your car goes straight, five people will be injured.","만약 당신의 자동차가 직진하면, 다섯 명이 부상을 당할 것이다."]],"w":"5번 문장에 If your car goes straight, five people will be injured가 나와요. 직진하면 다섯 명이 부상을 당한다는 내용이 맞아요.","c":"T"},"h":"df63562686"},{"n":2,"t":"tf","q":"The passage says there is a clear right answer to each situation.","ko":"글은 각 상황에 분명한 정답이 있다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Of course, there is no right answer.","물론, 정답은 없다."]],"w":"10번 문장은 Of course, there is no right answer(물론, 정답은 없다)라고 해요. 정답이 있다는 말은 반대예요.","c":"F"},"h":"0fed138495"},{"n":3,"t":"tf","q":"Self-driving cars drive according to a program.","ko":"자율 주행 자동차는 프로그램에 따라 운전한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"However, self-driving cars must know what to do in advance because they drive according to a program.","하지만, 자율 주행 자동차는 무엇을 할지 사전에 알아야만 하는데, 왜냐하면 그것들은 프로그램에 따라 운전하기 때문이다."]],"w":"11번 문장에 they drive according to a program이 나와요.","c":"T"},"h":"914fcb39b0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But, if it makes a turn, you will get seriously injured.)","ko":"하지만, 방향을 바꾸면, 당신이 심각하게 ( ) 것이다.","opts":["부상을 당할","유명해질","도움을 받을","승리할"],"word":"injured","r":{"a":"1) 부상을 당할","ev":"8번 문장","s":[[8,"But, if it makes a turn, you will get seriously injured.","하지만, 만약 방향을 바꾸면, 당신이 심각하게 부상을 당할 것이다."]],"w":"방향을 바꾸는 상황은 위험한 결정의 예시예요. seriously(심각하게)와 어울리는 말은 다치는 것이라서 get injured는 '부상을 당하다'예요.","c":1},"h":"8a18e3bafb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Who is ultimately responsible—the software, the car company, or the human driver?)","ko":"소프트웨어, 자동차 회사, 또는 인간 운전자 중 누구에게 ( ) 책임이 있는가?","opts":["처음에는","궁극적으로","가끔","우연히"],"word":"ultimately","r":{"a":"2) 궁극적으로","ev":"14번 문장","s":[[14,"Who is ultimately responsible—the software, the car company, or the human driver?","소프트웨어, 자동차 회사, 또는 인간 운전자 중 누구에게 궁극적으로 책임이 있는가?"]],"w":"사고가 났을 때 결국 누구의 책임인지 묻는 질문이에요. ultimately는 '궁극적으로, 결국'이에요.","c":2},"h":"05b27a972a"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nEvery situation needs to be considered and programmed into them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"모든 상황이 고려되어 프로그램이 짜여야 한다.","opts":["다섯 명의 사람들","모든 상황들","자율 주행 자동차들","운전자들"],"r":{"a":"3) 자율 주행 자동차들","ev":"11~12번 문장","s":[[11,"However, self-driving cars must know what to do in advance because they drive according to a program.","하지만, 자율 주행 자동차는 무엇을 할지 사전에 알아야만 하는데, 왜냐하면 그것들은 프로그램에 따라 운전하기 때문이다."],[12,"Every situation needs to be considered and programmed into them.","모든 상황이 고려되어 프로그램이 짜여야 한다."]],"w":"프로그램을 짜 넣는 대상은 11번의 self-driving cars예요. 모든 상황(every situation)은 프로그램에 넣어지는 내용이에요.","c":3},"h":"c21153c897"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is because they cannot make difficult decisions yet.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그것들이 어려운 결정을 아직 내릴 수 없기 때문이다.","opts":["이것은 자율 주행 자동차가 이미 어려운 결정을 내릴 수 있기 때문이다.","이것은 자율 주행 자동차가 운전자를 아직 만나지 못했기 때문이다.","이것은 자율 주행 자동차가 어려운 결정을 내릴 필요가 없기 때문이다.","이것은 자율 주행 자동차가 어려운 결정을 아직 내릴 수 없기 때문이다."],"r":{"a":"4) 이것은 자율 주행 자동차가 어려운 결정을 아직 내릴 수 없기 때문이다.","ev":"4번 문장","s":[[4,"This is because they cannot make difficult decisions yet, like in the following examples.","이것은 그것들이 다음의 예시에서와 같이 어려운 결정을 아직 내릴 수 없기 때문이다."]],"w":"This is because는 '이것은 ~ 때문이다'이고, cannot ~ yet은 '아직 ~할 수 없다'예요. 그래서 아직은 어려운 결정을 내릴 수 없다는 뜻이에요.","c":4},"h":"da09678fdc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["차가 직진하면 다섯 명이 죽고, 방향을 바꾸면 당신은 안전하다.","차가 직진하면 당신이 심각하게 다치고, 방향을 바꾸면 한 명이 죽는다.","차가 직진하면 한 명이 죽고, 방향을 바꾸면 당신이 심각하게 다친다.","차가 직진하면 아무도 다치지 않는다."],"opts":["If the car goes straight, five people will be killed, and if it makes a turn, you will be safe.","If the car goes straight, you will get seriously injured, but if it makes a turn, one person will be killed.","If the car goes straight, one person will be killed, but if it makes a turn, you will get seriously injured.","If the car goes straight, nobody will be injured."],"r":{"a":"3) If the car goes straight, one person will be killed, but if it makes a turn, you will get seriously injured.","ev":"7~8번 문장","s":[[7,"If your car goes straight, one person will be killed.","만약 당신의 자동차가 직진하면, 한 명이 죽게 될 것이다."],[8,"But, if it makes a turn, you will get seriously injured.","하지만, 만약 방향을 바꾸면, 당신이 심각하게 부상을 당할 것이다."]],"w":"7번에서 직진하면 한 명이 죽고, 8번에서 방향을 바꾸면 당신이 심각하게 다친다고 해요. 두 경우를 서로 바꿔 쓴 선지가 함정이에요.","c":3},"h":"6646ef0255"},{"n":9,"t":"sum","q":"If an accident does occur, it is hard to say who is (A) : the software, the car company, or the human (B).","ko":"사고가 정말 일어난다면, 소프트웨어, 자동차 회사, 또는 인간 (B) 중 누가 (A)인지 말하기 어렵다.","oko":["(A) 부상 / (B) 운전자","(A) 책임 / (B) 승객","(A) 부상 / (B) 승객","(A) 유명 / (B) 운전자","(A) 책임 / (B) 운전자"],"opts":["(A) injured / (B) driver","(A) responsible / (B) passenger","(A) injured / (B) passenger","(A) famous / (B) driver","(A) responsible / (B) driver"],"r":{"a":"5) (A) responsible / (B) driver","ev":"13~14번 문장","s":[[13,"Besides, if an accident does occur, another problem arises.","게다가, 만약 사고가 정말 일어난다면, 또 다른 문제가 발생한다."],[14,"Who is ultimately responsible—the software, the car company, or the human driver?","소프트웨어, 자동차 회사, 또는 인간 운전자 중 누구에게 궁극적으로 책임이 있는가?"]],"w":"13번에서 사고가 정말 일어나면 또 다른 문제가 생긴다고 하고, 14번에서 소프트웨어, 자동차 회사, 인간 운전자(driver) 중 누구에게 책임(responsible)이 있는지 물어요.","c":5},"h":"c2c9bc2e20"},{"n":10,"t":"fill","q":"Self-driving cars must know what to do in [A] because they drive according to a [B].","ko":"자율 주행 자동차는 [A] 무엇을 할지 알아야 하는데, 그것들이 [B]에 따라 운전하기 때문이다.","bank":["advance","program","accident","example","issue","society"],"bko":{"advance":"사전, 미리","program":"프로그램","accident":"사고","example":"예시","issue":"문제","society":"사회"},"r":{"a":"[A] advance, [B] program","ev":"11~12번 문장","s":[[11,"However, self-driving cars must know what to do in advance because they drive according to a program.","하지만, 자율 주행 자동차는 무엇을 할지 사전에 알아야만 하는데, 왜냐하면 그것들은 프로그램에 따라 운전하기 때문이다."],[12,"Every situation needs to be considered and programmed into them.","모든 상황이 고려되어 프로그램이 짜여야 한다."]],"w":"11번에서 자율 주행 자동차는 미리(in advance) 무엇을 할지 알아야 하고, 프로그램(program)에 따라 운전한다고 해요.","c":null},"h":"4b2aa1159a"}]},{"u":6,"id":"hk4-06-4","no":4,"ko":"그냥 버리면 안 돼!\b","items":[{"n":1,"t":"tf","q":"The chemicals in drugs don't decompose easily.","ko":"약 속의 화학 물질은 쉽게 분해되지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Unfortunately, the chemicals in the drugs don’t decompose easily.","불행하게도, 약 속의 화학 물질은 쉽게 분해되지 않는다."]],"w":"5번 문장에 the chemicals in the drugs don't decompose easily가 나와요.","c":"T"},"h":"ed1ce36f72"},{"n":2,"t":"tf","q":"The passage says it is fine to flush medicine down the toilet.","ko":"글은 약을 변기에 내려버려도 괜찮다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"You might probably throw it in the trash can or flush it down the toilet.","아마 그것을 쓰레기통에 버렸거나 변기에 내려버렸을 수도 있다."],[3,"However, you shouldn’t do either!","하지만, 둘 다 해서는 안 된다!"]],"w":"2번에서 변기에 내려버리는 방법이 나오지만, 3번에서 However, you shouldn't do either(둘 다 해서는 안 된다)라고 해요.","c":"F"},"h":"fcaf433a42"},{"n":3,"t":"tf","q":"Local pharmacies usually have boxes where you can discard drugs safely.","ko":"동네 약국에는 보통 안전하게 약을 버릴 수 있는 상자가 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"They usually have boxes where you can discard drugs safely.","그곳에는 보통 안전하게 약을 버릴 수 있는 상자가 있다."]],"w":"12번 문장에 They usually have boxes where you can discard drugs safely가 나와요. They는 11번의 동네 약국이에요.","c":"T"},"h":"6a877f7b8f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Unfortunately, the chemicals in the drugs don't decompose easily.)","ko":"불행하게도, 약 속의 화학 물질은 쉽게 ( ) 않는다.","opts":["얼다","분해되다","폭발하다","자라다"],"word":"decompose","r":{"a":"2) 분해되다","ev":"5번 문장","s":[[5,"Unfortunately, the chemicals in the drugs don’t decompose easily.","불행하게도, 약 속의 화학 물질은 쉽게 분해되지 않는다."]],"w":"Unfortunately(불행하게도)로 안 좋은 소식이 오고, 6번에서 그래서 땅과 물에 오래 남는다고 해요. 쉽게 분해되지 않으니 오래 남는 거예요. decompose는 '분해되다'예요.","c":2},"h":"fe97593929"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If we keep drinking this contaminated water, it may harm our health.)","ko":"만약 우리가 계속해서 이 ( ) 물을 마신다면, 그것은 우리의 건강을 해칠 수도 있다.","opts":["깨끗한","차가운","오염된","따뜻한"],"word":"contaminated","r":{"a":"3) 오염된","ev":"9번 문장","s":[[9,"If we keep drinking this contaminated water, it may harm our health.","만약 우리가 계속해서 이 오염된 물을 마신다면, 그것은 우리의 건강을 해칠 수도 있다."]],"w":"건강을 해칠 수도 있는 물이니 약이 섞인 더러운 물이에요(8번). contaminated는 '오염된'이에요.","c":3},"h":"ad4f38524e"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey usually have boxes where you can discard drugs safely.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그곳에는 보통 안전하게 약을 버릴 수 있는 상자가 있다.","opts":["약들","화학 물질들","오래된 약을 버리는 사람들","동네 약국들"],"r":{"a":"4) 동네 약국들","ev":"11~12번 문장","s":[[11,"You can bring it to local pharmacies.","당신은 그것을 동네 약국에 가져갈 수 있다."],[12,"They usually have boxes where you can discard drugs safely.","그곳에는 보통 안전하게 약을 버릴 수 있는 상자가 있다."]],"w":"상자가 있는 곳은 바로 앞 11번의 local pharmacies(동네 약국)예요. 약은 상자에 버려지는 것이지 상자를 가지고 있는 것이 아니에요.","c":4},"h":"e511b5c5be"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Medicine disposed of this way eventually enters the environment.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 방식으로 처리된 약은 결국 자연환경으로 들어가게 된다.","opts":["이러한 방식으로 처리된 약은 결국 자연환경으로 들어가게 된다.","이러한 방식으로 처리된 약은 곧바로 사라진다.","이러한 방식으로 처리된 약은 자연환경에서 새로 만들어진다.","이러한 방식으로 약을 처리하면 환경이 깨끗해진다."],"r":{"a":"1) 이러한 방식으로 처리된 약은 결국 자연환경으로 들어가게 된다.","ev":"4번 문장","s":[[4,"Medicine disposed of this way eventually enters the environment.","이러한 방식으로 처리된 약은 결국 자연환경으로 들어가게 된다."]],"w":"disposed of this way는 '이런 방식으로 처리된'이고 eventually는 '결국'이에요. 약이 사라지는 게 아니라 결국 자연환경으로 들어간다는 뜻이에요.","c":1},"h":"251516a0ce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["호르몬 약은 암컷 물고기를 더 크게 만든다.","호르몬 약 속의 적은 양의 에스트로겐이 수컷 물고기를 암컷으로 바꿀 수 있다.","약 속의 에스트로겐은 암컷 물고기를 수컷으로 바꾼다.","호르몬 약은 물고기에게 아무런 영향을 주지 않는다."],"opts":["Hormone drugs make female fish bigger.","A small amount of estrogen in hormone drugs can change male fish into females.","Estrogen in drugs turns female fish into males.","Hormone drugs have no effect on fish."],"r":{"a":"2) A small amount of estrogen in hormone drugs can change male fish into females.","ev":"7번 문장","s":[[7,"For example, a small amount of estrogen in hormone drugs can change male fish into females!","예를 들어, 호르몬 약에 있는 적은 양의 에스트로겐은 수컷 물고기를 암컷으로 바꿀 수 있다!"]],"w":"7번에서 호르몬 약에 있는 적은 양의 에스트로겐이 수컷 물고기를 암컷으로 바꿀 수 있다고 해요. 암컷과 수컷을 바꿔 쓴 선지가 함정이에요.","c":2},"h":"707c27fb48"},{"n":9,"t":"sum","q":"Medicine that isn't (A) out can flow into our drinking water, and drinking this (B) water may harm our health.","ko":"걸러지지 (A) 않은 약이 우리의 식수로 흘러들어올 수 있고, 이 (B) 물을 마시면 우리의 건강을 해칠 수도 있다.","oko":["(A) 걸러 / (B) 깨끗한","(A) 버려 / (B) 오염된","(A) 발견되어 / (B) 깨끗한","(A) 걸러 / (B) 오염된","(A) 버려 / (B) 깨끗한"],"opts":["(A) filtered / (B) clean","(A) thrown / (B) contaminated","(A) found / (B) clean","(A) filtered / (B) contaminated","(A) thrown / (B) clean"],"r":{"a":"4) (A) filtered / (B) contaminated","ev":"8~9번 문장","s":[[8,"Also, medicine that isn’t filtered out can flow into our drinking water.","또한, 여과되지 않은 약이 우리의 식수로 흘러들어올 수 있다."],[9,"If we keep drinking this contaminated water, it may harm our health.","만약 우리가 계속해서 이 오염된 물을 마신다면, 그것은 우리의 건강을 해칠 수도 있다."]],"w":"8번에서 걸러지지 않은(isn't filtered out) 약이 식수로 흘러들어올 수 있고, 9번에서 오염된(contaminated) 물을 계속 마시면 건강을 해칠 수 있다고 해요.","c":4},"h":"125d13a56e"},{"n":10,"t":"fill","q":"You can bring old medicine to local [A], where there are boxes to [B] drugs safely.","ko":"당신은 오래된 약을 동네 [A]에 가져갈 수 있고, 그곳에는 약을 안전하게 [B]할 수 있는 상자가 있다.","bank":["pharmacies","discard","ecosystem","decompose","estrogen","flow"],"bko":{"pharmacies":"약국들","discard":"버리다","ecosystem":"생태계","decompose":"분해되다","estrogen":"에스트로겐","flow":"흐르다"},"r":{"a":"[A] pharmacies, [B] discard","ev":"11~12번 문장","s":[[11,"You can bring it to local pharmacies.","당신은 그것을 동네 약국에 가져갈 수 있다."],[12,"They usually have boxes where you can discard drugs safely.","그곳에는 보통 안전하게 약을 버릴 수 있는 상자가 있다."]],"w":"11번에서 오래된 약은 동네 약국(pharmacies)에 가져가고, 12번에서 그곳에 안전하게 약을 버릴(discard) 수 있는 상자가 있다고 해요.","c":null},"h":"17041ca203"}]},{"u":7,"id":"hk4-07-1","no":1,"ko":"잃어버린 턱을 찾아서\b","items":[{"n":1,"t":"tf","q":"Mewing is a tongue exercise named after Dr. John Mew.","ko":"뮤잉은 John Mew 박사의 이름을 따서 이름 지어진 혀 운동이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Thus, he developed a tongue exercise called mewing, named after himself.","따라서, 그는 자신의 이름을 따서 이름 지어진 뮤잉이라고 불리는 혀 운동을 개발했다."]],"w":"4번 문장에서 박사가 mewing이라는 혀 운동을 개발했고, 자신의 이름을 따서(named after himself) 지었다고 해요.","c":"T"},"h":"ddc947b04f"},{"n":2,"t":"tf","q":"In mewing, the tongue should touch the upper teeth.","ko":"뮤잉에서는 혀가 윗니에 닿아야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Make sure it doesn’t touch the upper teeth.","반드시 혀가 윗니에 닿지 않도록 해라."]],"w":"6번 문장은 혀가 윗니에 닿지 않게 하라(doesn’t touch the upper teeth)고 해요. 닿아야 한다는 말은 반대예요.","c":"F"},"h":"57bb7e0632"},{"n":3,"t":"tf","q":"Dr. Mew believed that the problems could be corrected without surgery.","ko":"Mew 박사는 그 문제들이 수술 없이 교정될 수 있다고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He believed that such problems could be corrected without surgery.","그는 그러한 문제가 수술 없이 교정될 수 있다고 믿었다."]],"w":"3번 문장 He believed that such problems could be corrected without surgery와 같은 내용이에요.","c":"T"},"h":"51e96d9c9b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…could result in a short chin or an uneven face.)","ko":"…짧은 턱 또는 ( ) 얼굴을 야기할 수 있었다.","opts":["평평한","비대칭인","깨끗한","둥근"],"word":"uneven","r":{"a":"2) 비대칭인","ev":"2번 문장","s":[[2,"For example, placing the tongue on the bottom of the mouth could result in a short chin or an uneven face.","예를 들어, 혀를 입의 바닥에 두는 것은 짧은 턱 또는 비대칭인 얼굴을 야기할 수 있었다."]],"w":"2번에서 혀를 입 바닥에 두는 나쁜 습관이 짧은 턱이나 uneven 얼굴로 이어진다고 해요. 좋지 않은 결과로 나온 말이라 '비대칭인, 고르지 않은'이 알맞아요. 10번의 even(고른)과 반대되는 말이에요.","c":2},"h":"39e3c55ee6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He believed that such problems could be corrected without surgery.)","ko":"그는 그러한 문제가 수술 없이 ( ) 수 있다고 믿었다.","opts":["교정될","설명될","발견될","금지될"],"word":"corrected","r":{"a":"1) 교정될","ev":"3번 문장","s":[[3,"He believed that such problems could be corrected without surgery.","그는 그러한 문제가 수술 없이 교정될 수 있다고 믿었다."]],"w":"수술 없이 문제를 '바로잡을' 수 있다는 내용이에요. could be corrected = 교정될 수 있다. correct = 교정하다.","c":1},"h":"a796b0eeeb"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis can strengthen facial muscles, help keep your teeth even, and change the shape of your face.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 얼굴 근육을 강화하고, 치아를 고르게 유지하는 데 도움이 되고, 얼굴 모양을 바꿀 수 있다.","opts":["수술을 받는 것","어린 시절의 나쁜 습관","혀, 입술, 볼의 근육을 쓰는 뮤잉","혀를 입의 바닥에 두는 것"],"r":{"a":"3) 혀, 입술, 볼의 근육을 쓰는 뮤잉","ev":"9~10번 문장","s":[[9,"During mewing, you use the muscles on your tongue, lips and cheeks.","뮤잉을 하는 동안, 당신은 혀, 입술, 그리고 볼에 있는 근육을 쓴다."],[10,"This can strengthen facial muscles, help keep your teeth even, and change the shape of your face.","이것은 얼굴 근육을 강화하고, 치아를 고르게 유지하는 데 도움이 되고, 얼굴 모양을 바꿀 수 있다."]],"w":"9번에서 뮤잉을 하는 동안 혀, 입술, 볼의 근육을 쓴다고 했어요. 10번의 This는 그것(근육을 쓰는 뮤잉)이 얼굴 근육을 강화한다는 말이에요.","c":3},"h":"180cc59a34"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For the best results, you should do this whenever your mouth is closed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"최상의 결과를 위해서, 당신은 이것을 입이 다물어져 있을 때마다 해야 한다.","opts":["입을 크게 벌릴 때에만 뮤잉을 해야 한다.","하루에 한 번만 뮤잉을 하면 충분하다.","입이 다물어져 있을 때마다 뮤잉을 하는 것이 가장 좋다.","입을 다물면 뮤잉을 멈춰야 한다."],"r":{"a":"3) 입이 다물어져 있을 때마다 뮤잉을 하는 것이 가장 좋다.","ev":"8번 문장","s":[[8,"For the best results, you should do this whenever your mouth is closed.","최상의 결과를 위해서, 당신은 이것을 입이 다물어져 있을 때마다 해야 한다."]],"w":"whenever는 '~할 때마다'예요. 입이 다물어져 있을 때마다 하는 것이 가장 좋은 결과를 낸다는 뜻이에요.","c":3},"h":"4d8129229f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["뮤잉을 하려면 아랫니를 윗니에 붙여야 한다.","뮤잉은 얼굴 근육을 강화할 수 있다.","뮤잉은 성인에게만 효과가 있다.","뮤잉은 수술이 꼭 필요한 사람을 위한 운동이다."],"opts":["In mewing, the lower teeth should touch the upper teeth.","Mewing can strengthen facial muscles.","Mewing works only on adults.","Mewing is an exercise for people who must have surgery."],"r":{"a":"2) Mewing can strengthen facial muscles.","ev":"3, 7, 10, 11번 문장","s":[[3,"He believed that such problems could be corrected without surgery.","그는 그러한 문제가 수술 없이 교정될 수 있다고 믿었다."],[7,"Then, close the lips while keeping the upper and lower teeth apart.","그 다음, 윗니와 아랫니를 떨어뜨린 상태를 유지하면서 입술을 다물어라."],[10,"This can strengthen facial muscles, help keep your teeth even, and change the shape of your face.","이것은 얼굴 근육을 강화하고, 치아를 고르게 유지하는 데 도움이 되고, 얼굴 모양을 바꿀 수 있다."],[11,"Mewing is especially effective on young children whose bones are still growing.","뮤잉은 특히 뼈가 아직 자라고 있는 어린아이들에게 효과적이다."]],"w":"10번에서 얼굴 근육을 강화할 수 있다고 해요. 7번은 윗니와 아랫니를 떨어뜨리라고 하고, 11번은 어린아이에게 특히 효과적이라고 하며,
