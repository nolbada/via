o save animals that might [B] from our planet.","ko":"드론은 [A]를 위한 것만은 아니다. 그것들은 지구에서 [B]할지도 모르는 동물들을 구하는 중요한 조력자들이다.","bank":["fun","disappear","appear","jungle","health","snot"],"bko":{"fun":"재미","disappear":"사라지다","appear":"나타나다","jungle":"정글","health":"건강","snot":"콧물"},"r":{"a":"[A] fun, [B] disappear","ev":"11~12번 문장","w":"11번 drones are not just for fun(재미), 12번 animals that might disappear(사라지다) from our planet. appear(나타나다)는 disappear의 반대라서 함정. jungle(정글), health(건강), snot(콧물)은 앞부분 예시에 나온 단어.","c":null,"s":[[11,"As you see, drones are not just for fun.","여러분이 보다시피, 드론은 재미를 위한 것만은 아니다."],[12,"They are important helpers to save animals that might disappear from our planet.","그것들은 지구에서 사라질지도 모르는 동물들을 구하는 중요한 조력자들이다."]]},"h":"e3948928ee"}]},{"u":10,"id":"rg2-10-1","no":1,"ko":"아기 때만 많은 지방, 몸을 따뜻하게 하는 갈색 지방","items":[{"n":1,"t":"tf","q":"Brown fat is usually found in newborn babies’ necks and shoulders.","ko":"갈색 지방은 보통 신생아의 목과 어깨에서 발견된다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It’s usually found in newborn babies’ necks and shoulders.","그것은 보통 신생아의 목과 어깨에서 발견된다."]],"w":"4번 문장에 It’s usually found in newborn babies’ necks and shoulders라고 나옴. It은 3번의 갈색 지방이라 T.","c":"T"},"h":"5dd3e4f539"},{"n":2,"t":"tf","q":"As we grow up, we lose most of our white fat and gain more brown fat.","ko":"우리는 자라면서 흰색 지방의 대부분을 잃고 갈색 지방을 더 많이 얻는다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"As we grow up, we lose most of our brown fat and gain more white fat instead.","우리는 자라는 동안, 갈색 지방의 대부분을 잃고 대신 흰색 지방을 더 많이 얻게 된다."]],"w":"6번에서는 자라면서 갈색 지방(brown fat)의 대부분을 잃고 흰색 지방(white fat)을 더 얻는다고 함. 두 지방이 서로 바뀐 진술이라 F. lose는 ‘잃다’, gain은 ‘얻다’.","c":"F"},"h":"eb899287b4"},{"n":3,"t":"tf","q":"Brown fat keeps our body warm because it burns lots of calories.","ko":"갈색 지방은 열량을 많이 태우기 때문에 우리 몸을 따뜻하게 유지해 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Brown fat is important for our body because it burns lots of calories and keeps us warm.","갈색 지방은 열량을 많이 태우고 우리를 따뜻하게 유지해 주기 때문에 우리 몸에 중요하다."]],"w":"5번에서 갈색 지방이 열량을 많이 태우고(burns lots of calories) 우리를 따뜻하게 유지해 준다(keeps us warm)고 함. burns는 burn(태우다)의 형태. T.","c":"T"},"h":"08d71776cf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But scientists found a way to increase brown fat in the body.)","ko":"하지만 과학자들은 몸속의 갈색 지방을 ‘늘리는’ 방법을 찾았다.","opts":["줄이다","늘리다, 증가시키다","없애다","바꾸다"],"word":"increase","r":{"a":"2) 늘리다, 증가시키다","ev":"7~8번 문장","s":[[7,"This can sometimes cause problems for our health.","이는 때때로 우리의 건강에 문제를 일으킬 수 있다."],[8,"But scientists found a way to increase brown fat in the body.","하지만 과학자들은 몸속의 갈색 지방을 늘리는 방법을 찾아냈다."]],"w":"7번에서 자라면서 갈색 지방이 줄어들어 문제가 생긴다고 했고, 8번 But 뒤에서 그 갈색 지방을 ‘늘리는’ 방법을 찾았음. 그래서 increase는 늘리다. found는 find(찾다)의 과거형.","c":2},"h":"18fd3b4547"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (With this information, the scientists hope to develop a similar medicine for humans.)","ko":"이 정보를 가지고, 과학자들은 사람을 위해 ‘비슷한’ 약을 개발하기를 바란다.","opts":["위험한","다른","비슷한","값비싼"],"word":"similar","r":{"a":"3) 비슷한","ev":"9~11번 문장","s":[[9,"They did an experiment on fat sheep by injecting them with brown fat.","그들은 살찐 양에게 갈색 지방을 주입하는 실험을 했다."],[10,"It helped the sheep to lose weight and become healthier.","그것은 양이 체중을 줄이고 더 건강해지도록 도와주었다."],[11,"With this information, the scientists hope to develop a similar medicine for humans.","이 정보를 가지고, 과학자들은 사람들을 위해 비슷한 약을 개발하기를 바란다."]],"w":"9~10번에서 양에게 갈색 지방을 주입하자 체중이 줄고 건강해졌음. 11번은 이 정보로 사람에게도 ‘비슷한’ 약을 만들고 싶다는 것. similar는 비슷한(the same처럼 닮은). 다른(different)과는 반대.","c":3},"h":"ad1735677b"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt helped the sheep to lose weight and become healthier.","ko":"밑줄 친 It이(가) 가리키는 것은?","sko":"그것은 양이 체중을 줄이고 더 건강해지도록 도와주었다.","opts":["양에게 갈색 지방을 주입한 실험","신생아의 목과 어깨","흰색 지방이 늘어나는 것","사람을 위해 개발할 약"],"r":{"a":"1) 양에게 갈색 지방을 주입한 실험","ev":"9~10번 문장","s":[[9,"They did an experiment on fat sheep by injecting them with brown fat.","그들은 살찐 양에게 갈색 지방을 주입하는 실험을 했다."],[10,"It helped the sheep to lose weight and become healthier.","그것은 양이 체중을 줄이고 더 건강해지도록 도와주었다."]],"w":"10번의 It helped the sheep… 바로 앞 9번에서 살찐 양에게 갈색 지방을 주입하는 실험을 했음. 그 실험이 양이 체중을 줄이고 더 건강해지게 도왔다는 말. 약은 11번에서 앞으로 개발하길 바라는 것이라 아직 아님. helped는 help(돕다)의 과거형.","c":1},"h":"5a17014435"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the future, this could help people with weight problems and diabetes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"미래에, 이것이 체중 문제나 당뇨병을 가진 사람들을 도와줄 수 있다.","opts":["당뇨병이 있는 사람들은 체중을 줄일 수 없다.","체중 문제가 있는 사람들은 이미 약을 먹고 있다.","양에게서 나온 연구는 사람에게 쓸 수 없다.","이 연구는 앞으로 체중 문제나 당뇨병이 있는 사람들에게 도움이 될 수 있다."],"r":{"a":"4) 이 연구는 앞으로 체중 문제나 당뇨병이 있는 사람들에게 도움이 될 수 있다.","ev":"11~12번 문장","s":[[11,"With this information, the scientists hope to develop a similar medicine for humans.","이 정보를 가지고, 과학자들은 사람들을 위해 비슷한 약을 개발하기를 바란다."],[12,"In the future, this could help people with weight problems and diabetes.","미래에, 이것이 체중 문제나 당뇨병을 가진 사람들을 도와줄 수 있다."]],"w":"12번의 In the future(미래에)와 could help(도울 수 있다)로 보아 아직 약이 나온 것이 아니라 앞으로 도움이 될 가능성을 말함. this는 11번의 비슷한 약. 약을 이미 먹고 있다거나 쓸 수 없다는 말은 나오지 않음.","c":4},"h":"3f8f8d52e6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["흰색 지방은 보통 신생아의 목과 어깨에서 발견된다.","갈색 지방은 열량을 많이 태워서 우리 몸을 더 춥게 만든다.","과학자들은 살찐 양에게 갈색 지방을 주입했고, 양은 체중이 줄었다.","우리는 자라면서 갈색 지방을 더 많이 얻는다."],"opts":["White fat is usually found in newborn babies’ necks and shoulders.","Brown fat makes our body colder because it burns lots of calories.","Scientists injected brown fat into fat sheep, and the sheep lost weight.","We gain more brown fat as we grow up."],"r":{"a":"3) Scientists injected brown fat into fat sheep, and the sheep lost weight.","ev":"4~6번, 9~10번 문장","s":[[4,"It’s usually found in newborn babies’ necks and shoulders.","그것은 보통 신생아의 목과 어깨에서 발견된다."],[5,"Brown fat is important for our body because it burns lots of calories and keeps us warm.","갈색 지방은 열량을 많이 태우고 우리를 따뜻하게 유지해 주기 때문에 우리 몸에 중요하다."],[6,"As we grow up, we lose most of our brown fat and gain more white fat instead.","우리는 자라는 동안, 갈색 지방의 대부분을 잃고 대신 흰색 지방을 더 많이 얻게 된다."],[9,"They did an experiment on fat sheep by injecting them with brown fat.","그들은 살찐 양에게 갈색 지방을 주입하는 실험을 했다."],[10,"It helped the sheep to lose weight and become healthier.","그것은 양이 체중을 줄이고 더 건강해지도록 도와주었다."]],"w":"9~10번에서 살찐 양에게 갈색 지방을 주입하자 체중을 줄였음. 신생아에게서 발견되는 것은 갈색 지방(4번), 갈색 지방은 몸을 따뜻하게 함(5번), 자라면 갈색 지방은 줄어듦(6번)이라 나머지는 모두 다름. injected는 inject(주입하다)의 과거형.","c":3},"h":"aaaacb697d"},{"n":9,"t":"sum","q":"As we grow up, we (A) most of our brown fat, but scientists found a way to (B) it.","ko":"우리는 자라면서 갈색 지방의 대부분을 (A), 하지만 과학자들은 그것을 (B) 방법을 찾았다.","oko":["(A) 얻는다 / (B) 태우는","(A) 잃는다 / (B) 태우는","(A) 얻는다 / (B) 늘리는","(A) 잃는다 / (B) 늘리는","(A) 유지한다 / (B) 없애는"],"opts":["(A) gain / (B) burn","(A) lose / (B) burn","(A) gain / (B) increase","(A) lose / (B) increase","(A) keep / (B) remove"],"r":{"a":"4) (A) lose / (B) increase","ev":"6번, 8번 문장","s":[[6,"As we grow up, we lose most of our brown fat and gain more white fat instead.","우리는 자라는 동안, 갈색 지방의 대부분을 잃고 대신 흰색 지방을 더 많이 얻게 된다."],[8,"But scientists found a way to increase brown fat in the body.","하지만 과학자들은 몸속의 갈색 지방을 늘리는 방법을 찾아냈다."]],"w":"6번에서 자라면서 갈색 지방의 대부분을 잃는다(lose). 8번에서 과학자들이 갈색 지방을 늘리는(increase) 방법을 찾았음. gain(얻다)은 6번의 흰색 지방 쪽, remove(없애다)는 반대 방향이라 오답.","c":4},"h":"50e79a1069"},{"n":10,"t":"fill","q":"Our bodies have two types of fat. [A] fat looks white or yellowish, and [B] fat is brown and burns lots of calories.","ko":"우리 몸에는 두 종류의 지방이 있다. [A] 지방은 희거나 노르스름하게 보이고, [B] 지방은 갈색이며 열량을 많이 태운다.","bko":{"white":"흰색의","brown":"갈색의","thin":"얇은, 마른","warm":"따뜻한","healthy":"건강한","new":"새로운"},"bank":["white","brown","thin","warm","healthy","new"],"r":{"a":"[A] white, [B] brown","ev":"2~3번, 5번 문장","s":[[2,"One type is called white fat, and it looks white or yellowish under our skin.","한 종류는 흰색 지방이라고 불리며, 우리 피부 아래에서 희거나 노르스름하게 보인다."],[3,"Another type is called brown fat, and it’s brown.","또 다른 종류는 갈색 지방이라고 불리며, 갈색이다."],[5,"Brown fat is important for our body because it burns lots of calories and keeps us warm.","갈색 지방은 열량을 많이 태우고 우리를 따뜻하게 유지해 주기 때문에 우리 몸에 중요하다."]],"w":"2번에서 white fat은 희거나 노르스름하게 보이고, 3번에서 brown fat은 갈색이며, 5번에서 갈색 지방이 열량을 많이 태운다고 함. warm, healthy는 본문에 나오지만 지방의 종류 이름이 아니라서 오답.","c":null},"h":"3d41f4d446"}]},{"u":10,"id":"rg2-10-2","no":2,"ko":"에펠탑 꼭대기에 아무도 모르게 숨겨 둔 방","items":[{"n":1,"t":"tf","q":"There is a secret apartment at the top of the Eiffel Tower.","ko":"에펠탑 꼭대기에는 비밀스러운 커다란 방이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"There is a secret apartment at the top of the tower!","그 탑 꼭대기에는 비밀스러운 커다란 방이 있다!"]],"w":"3번 문장에 There is a secret apartment at the top of the tower!라고 나옴. 같은 내용이라 T.","c":"T"},"h":"91ad56a678"},{"n":2,"t":"tf","q":"Many people offered Eiffel lots of money, and he accepted it.","ko":"많은 사람들이 에펠에게 많은 돈을 제안했고, 그는 그것을 받아들였다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"They offered him lots of money, but he said no.","그들은 그에게 많은 돈을 제안했지만, 그는 거절했다."]],"w":"8번에서 사람들이 많은 돈을 제안했지만(offered him lots of money) 에펠은 거절했음(he said no). 받아들였다는 진술은 반대라 F. offered는 offer(제안하다)의 과거형.","c":"F"},"h":"645e39d292"},{"n":3,"t":"tf","q":"Visitors today can go inside the secret apartment.","ko":"오늘날 방문객들은 비밀 방 안에 들어갈 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Unfortunately, you can’t go inside, but you can look at it through a special window.","유감스럽게도, 여러분은 안에 들어갈 수는 없지만, 특별한 창문을 통해 그것을 바라볼 수 있다."]],"w":"11번에서 Unfortunately, you can’t go inside라고 함. 안에는 들어갈 수 없고 특별한 창문으로 바라볼 수만 있음. 그래서 F.","c":"F"},"h":"2f43c5c22f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Secretly, he kept an apartment on the top floor.)","ko":"비밀스럽게, 그는 꼭대기 층에 커다란 방을 가지고 있었다.","opts":["큰 소리로","비밀스럽게","빠르게","우연히"],"word":"Secretly","r":{"a":"2) 비밀스럽게","ev":"3번, 5번 문장","s":[[3,"There is a secret apartment at the top of the tower!","그 탑 꼭대기에는 비밀스러운 커다란 방이 있다!"],[5,"Secretly, he kept an apartment on the top floor.","비밀스럽게, 그는 꼭대기 층에 커다란 방을 가지고 있었다."]],"w":"3번에서 탑 꼭대기에 ‘비밀스러운(secret)’ 방이 있다고 했고, 5번의 Secretly는 그 방을 몰래 가지고 있었다는 말. 그래서 비밀스럽게.","c":2},"h":"eee52fa06a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The apartment still remains at the top floor today.)","ko":"그 방은 오늘날에도 여전히 꼭대기 층에 남아 있다.","opts":["팔리다","사라지다","무너지다","남아 있다"],"word":"remains","r":{"a":"4) 남아 있다","ev":"10번 문장","s":[[10,"The apartment still remains at the top floor today.","그 커다란 방은 오늘날에도 여전히 꼭대기 층에 남아 있다."]],"w":"10번에 still(여전히)과 today(오늘날에도)가 함께 나옴. 아직도 꼭대기 층에 ‘남아 있다’는 뜻이라 remain은 남아 있다. 사라지다는 반대 뜻.","c":4},"h":"a10109d4bf"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHe wanted to keep it as a special place for himself.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"그는 그곳을 자신을 위한 특별한 장소로 유지하고 싶어 했다.","opts":["에펠탑 꼭대기 층의 방","에펠탑 전체","파리의 전망","사람들이 제안한 돈"],"r":{"a":"1) 에펠탑 꼭대기 층의 방","ev":"5번, 9번 문장","s":[[5,"Secretly, he kept an apartment on the top floor.","비밀스럽게, 그는 꼭대기 층에 커다란 방을 가지고 있었다."],[9,"He wanted to keep it as a special place for himself.","그는 그곳을 자신을 위한 특별한 장소로 유지하고 싶어 했다."]],"w":"9번의 keep it as a special place for himself에서 it은 5번에서 에펠이 꼭대기 층에 몰래 가지고 있던 방. 에펠은 그 방을 자기만의 특별한 장소로 두고 싶었음. 탑 전체나 돈이 아님.","c":1},"h":"b8bbc8c22d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This secret place makes the Eiffel Tower even more interesting to visit!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 비밀스러운 장소가 에펠탑을 방문하기에 훨씬 더 흥미롭게 만든다!","opts":["에펠탑을 방문하는 사람이 너무 많아서 더 시끄러워졌다.","이 비밀 장소를 방문하는 것은 에펠탑보다 덜 흥미롭다.","이 비밀 방 때문에 에펠탑은 방문하기에 훨씬 더 흥미로운 곳이 된다.","에펠탑에는 흥미로운 장소가 하나도 없다."],"r":{"a":"3) 이 비밀 방 때문에 에펠탑은 방문하기에 훨씬 더 흥미로운 곳이 된다.","ev":"12번 문장","s":[[12,"This secret place makes the Eiffel Tower even more interesting to visit!","이 비밀스러운 장소가 에펠탑을 방문하기에 훨씬 더 흥미롭게 만든다!"]],"w":"12번의 makes the Eiffel Tower even more interesting에서 make A 형용사는 ‘A를 ~하게 만든다’. 비밀 방이 에펠탑을 더 흥미롭게 만든다는 뜻. 시끄럽다거나 덜 흥미롭다는 말은 없음.","c":3},"h":"1ec711432d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Gustave Eiffel은 자신의 방을 많은 관광객들에게 주었다.","비밀 방은 탑의 1층에 있다.","방문객들은 특별한 창문을 통해 방 안으로 들어갈 수 있다.","에펠은 사람들이 많은 돈을 제안했는데도 그 방을 자신이 계속 가졌다."],"opts":["Gustave Eiffel gave his apartment to many tourists.","The secret apartment is on the first floor of the tower.","Visitors can go inside the apartment through a special window.","Eiffel kept the apartment for himself even though people offered lots of money."],"r":{"a":"4) Eiffel kept the apartment for himself even though people offered lots of money.","ev":"5번, 8~9번, 11번 문장","s":[[5,"Secretly, he kept an apartment on the top floor.","비밀스럽게, 그는 꼭대기 층에 커다란 방을 가지고 있었다."],[8,"They offered him lots of money, but he said no.","그들은 그에게 많은 돈을 제안했지만, 그는 거절했다."],[9,"He wanted to keep it as a special place for himself.","그는 그곳을 자신을 위한 특별한 장소로 유지하고 싶어 했다."],[11,"Unfortunately, you can’t go inside, but you can look at it through a special window.","유감스럽게도, 여러분은 안에 들어갈 수는 없지만, 특별한 창문을 통해 그것을 바라볼 수 있다."]],"w":"8~9번에서 사람들이 많은 돈을 제안했지만 에펠은 거절하고 그 방을 자신을 위해 두었음. 방은 꼭대기 층(5번)에 있고, 창문으로는 바라볼 수만 있음(11번)이라 나머지는 모두 다름.","c":4},"h":"367654c40f"},{"n":9,"t":"sum","q":"Gustave Eiffel had a (A) apartment at the top of his tower, and he (B) to rent it to other people.","ko":"귀스타브 에펠은 자신의 탑 꼭대기에 (A) 방을 가지고 있었고, 그것을 다른 사람들에게 빌려주기를 (B).","oko":["(A) 공개된 / (B) 거절했다","(A) 비밀스러운 / (B) 동의했다","(A) 위험한 / (B) 거절했다","(A) 오래된 / (B) 원했다","(A) 비밀스러운 / (B) 거절했다"],"opts":["(A) public / (B) refused","(A) secret / (B) agreed","(A) dangerous / (B) refused","(A) old / (B) wanted","(A) secret / (B) refused"],"r":{"a":"5) (A) secret / (B) refused","ev":"5번, 8~9번 문장","s":[[5,"Secretly, he kept an apartment on the top floor.","비밀스럽게, 그는 꼭대기 층에 커다란 방을 가지고 있었다."],[8,"They offered him lots of money, but he said no.","그들은 그에게 많은 돈을 제안했지만, 그는 거절했다."],[9,"He wanted to keep it as a special place for himself.","그는 그곳을 자신을 위한 특별한 장소로 유지하고 싶어 했다."]],"w":"5번에서 에펠은 비밀스럽게(Secretly) 꼭대기 층에 방을 가지고 있었고, 8~9번에서 많은 돈을 제안받았지만 거절했음. 그래서 (A) secret, (B) refused. 공개된 방이 아니고, 동의한 것도 아님.","c":5},"h":"5b9d346e1b"},{"n":10,"t":"fill","q":"The apartment was very [A] up, so it had a wonderful [B] of Paris.","ko":"그 방은 매우 [A]에 있어서 파리의 멋진 [B]을 가지고 있었다.","bko":{"high":"높은","view":"전망, 경치","famous":"유명한","money":"돈","window":"창문","floor":"층"},"bank":["high","view","famous","money","window","floor"],"r":{"a":"[A] high, [B] view","ev":"6번 문장","s":[[6,"It was very high up, so it had a wonderful view of Paris.","그곳은 매우 높은 곳에 있어서 파리의 멋진 전망을 가지고 있었다."]],"w":"6번에서 very high up(매우 높은 곳에 있어서) 파리의 멋진 view(전망)를 가졌다고 함. famous(유명한), window(창문), floor(층)는 본문에 나오는 말이지만 이 문장의 빈칸에는 뜻이 맞지 않음.","c":null},"h":"9bbe9fd6e3"}]},{"u":10,"id":"rg2-10-3","no":3,"ko":"귀여운 걸 보면 왜 깨물어 주고 싶을까?","items":[{"n":1,"t":"tf","q":"When we see something very cute, we usually want to care for it, but we might also feel a bit aggressive.","ko":"우리는 아주 귀여운 것을 보면 보통 돌보고 싶어지지만, 약간 공격적으로 느낄 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"When we see something very cute, we usually want to care for it.","우리는 아주 귀여운 무언가를 볼 때, 보통 그것을 돌보고 싶어진다."],[3,"But, we might also feel a bit aggressive.","하지만, 우리는 약간 공격적으로 느낄 수도 있다."]],"w":"2번에서 아주 귀여운 것을 보면 보통 돌보고 싶다고 했고, 3번 But 뒤에서 약간 공격적으로 느낄 수도 있다고 함. 둘 다 본문과 같아서 T.","c":"T"},"h":"2d538b9624"},{"n":2,"t":"tf","q":"Cute aggression means you really want to hurt someone.","ko":"귀여운 공격성은 여러분이 정말로 누군가를 다치게 하고 싶다는 뜻이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Cute aggression doesn’t mean you actually want to hurt anyone.","귀여운 공격성은 여러분이 실제로 누군가를 다치게 하고 싶다는 뜻이 아니다."]],"w":"5번에서 Cute aggression doesn’t mean you actually want to hurt anyone이라고 함. 실제로 다치게 하고 싶다는 뜻이 아니므로 F.","c":"F"},"h":"4fdc8b0c9c"},{"n":3,"t":"tf","q":"Cute aggression makes our strong positive feelings even stronger.","ko":"귀여운 공격성은 우리의 강한 긍정적인 감정을 훨씬 더 강하게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Sometimes, when it’s too much, cute aggression helps us handle these strong positive feelings.","때때로, 그 기쁨이 너무 많을 때, 귀여운 공격성은 우리가 이런 강한 긍정적인 감정들을 다루도록 도와준다."]],"w":"7번에서 귀여운 공격성은 우리가 강한 긍정적인 감정들을 ‘다루도록 도와준다(helps us handle)’고 함. 더 강하게 만드는 것이 아니라 감정을 다루게 도와주므로 F.","c":"F"},"h":"0be898c5e9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But, we might also feel a bit aggressive.)","ko":"하지만, 우리는 약간 ‘공격적으로’ 느낄 수도 있다.","opts":["공격적인","졸린","부끄러운","행복한"],"word":"aggressive","r":{"a":"1) 공격적인","ev":"3~4번 문장","s":[[3,"But, we might also feel a bit aggressive.","하지만, 우리는 약간 공격적으로 느낄 수도 있다."],[4,"This feeling is called “cute aggression” in psychology.","이러한 감정은 심리학에서 ‘귀여운 공격성’이라고 불린다."]],"w":"3번에서 귀여운 것을 보고 돌보고 싶다가 But 뒤에서 ‘약간 aggressive’하게 느낀다고 함. 4번에서 이 감정을 ‘cute aggression’이라고 부름. aggressive는 공격적인. 졸리거나 부끄럽거나 행복하다는 뜻이 아님.","c":1},"h":"54fa3b7e4d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Our brain tries to balance out strong feeling with the opposite.)","ko":"우리의 뇌는 강한 감정의 균형을 ‘정반대의 것’으로 맞추려고 노력한다.","opts":["비슷한 것","같은 것","정반대의 것","작은 것"],"word":"opposite","r":{"a":"3) 정반대의 것","ev":"8~9번 문장","s":[[8,"Our brain tries to balance out strong feeling with the opposite.","우리의 뇌는 강한 감정의 균형을 정반대의 감정으로 맞추려고 노력한다."],[9,"So, playful aggression can be seen as the opposite of cuteness.","그래서, 장난스러운 공격성은 귀여움의 정반대로 보여질 수 있다."]],"w":"8번에서 강한 감정을 opposite로 균형을 맞춘다고 하고, 9번에서 장난스러운 공격성이 귀여움의 opposite로 보여진다고 함. 귀여움과 반대되는 공격성이므로 opposite는 정반대의 것.","c":3},"h":"d112b3d913"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSometimes, when it’s too much, cute aggression helps us handle these strong positive feelings.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"때때로, 그 기쁨이 너무 많을 때, 귀여운 공격성은 우리가 이런 강한 긍정적인 감정들을 다루도록 도와준다.","opts":["귀여운 강아지","귀여운 공격성","우리의 뇌","큰 기쁨"],"r":{"a":"4) 큰 기쁨","ev":"6~7번 문장","s":[[6,"Your brain is just dealing with lots of joy.","여러분의 뇌는 단지 큰 기쁨을 다루고 있을 뿐이다."],[7,"Sometimes, when it’s too much, cute aggression helps us handle these strong positive feelings.","때때로, 그 기쁨이 너무 많을 때, 귀여운 공격성은 우리가 이런 강한 긍정적인 감정들을 다루도록 도와준다."]],"w":"7번의 when it’s too much에서 it은 바로 앞 6번의 lots of joy(큰 기쁨)를 가리킴. 기쁨이 너무 많을 때 귀여운 공격성이 감정을 다루도록 도와줌. 귀여운 공격성은 뒤에 나오는 주어이고, 너무 많은 것은 기쁨.","c":4},"h":"822f44ddca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, playful aggression can be seen as the opposite of cuteness.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서, 장난스러운 공격성은 귀여움의 정반대로 보여질 수 있다.","opts":["장난스러운 공격성은 귀여움을 더 크게 만든다.","장난스러운 공격성은 귀여움의 정반대로 보여질 수 있다.","장난스러운 공격성은 귀여움과 아무 관계가 없다.","장난스러운 공격성은 귀여운 강아지만 느낄 수 있다."],"r":{"a":"2) 장난스러운 공격성은 귀여움의 정반대로 보여질 수 있다.","ev":"8~9번 문장","s":[[8,"Our brain tries to balance out strong feeling with the opposite.","우리의 뇌는 강한 감정의 균형을 정반대의 감정으로 맞추려고 노력한다."],[9,"So, playful aggression can be seen as the opposite of cuteness.","그래서, 장난스러운 공격성은 귀여움의 정반대로 보여질 수 있다."]],"w":"9번의 So(그래서)는 8번 결과를 정리함. 뇌가 강한 감정(귀여움)을 정반대 감정으로 맞추려 하니 장난스러운 공격성은 the opposite of cuteness(귀여움의 정반대)로 보임. can be seen as는 ‘~로 보여질 수 있다’.","c":2},"h":"ff0f94f5dd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["귀여운 공격성은 뇌가 너무 많은 행복한 감정을 다루도록 도와준다.","귀여운 공격성은 우리가 귀여운 동물을 정말로 다치게 하고 싶다는 뜻이다.","우리는 귀여운 것을 볼 때 공격적으로 느끼는 일이 절대 없다.","뇌는 같은 감정으로 강한 감정을 더 크게 만든다."],"opts":["Cute aggression helps the brain handle too many happy feelings.","Cute aggression means we really want to hurt a cute animal.","We never feel aggressive when we see something cute.","The brain makes the strong feeling bigger with the same feeling."],"r":{"a":"1) Cute aggression helps the brain handle too many happy feelings.","ev":"3번, 5번, 7~8번 문장","s":[[3,"But, we might also feel a bit aggressive.","하지만, 우리는 약간 공격적으로 느낄 수도 있다."],[5,"Cute aggression doesn’t mean you actually want to hurt anyone.","귀여운 공격성은 여러분이 실제로 누군가를 다치게 하고 싶다는 뜻이 아니다."],[7,"Sometimes, when it’s too much, cute aggression helps us handle these strong positive feelings.","때때로, 그 기쁨이 너무 많을 때, 귀여운 공격성은 우리가 이런 강한 긍정적인 감정들을 다루도록 도와준다."],[8,"Our brain tries to balance out strong feeling with the opposite.","우리의 뇌는 강한 감정의 균형을 정반대의 감정으로 맞추려고 노력한다."]],"w":"7번에서 너무 많은 기쁨일 때 귀여운 공격성이 강한 긍정적인 감정을 다루도록 도와준다고 함. 실제로 다치게 하려는 뜻이 아니고(5번), 공격적으로 느낄 수 있으며(3번), 같은 감정이 아니라 정반대 감정으로 균형을 맞춤(8번)이라 나머지는 모두 다름.","c":1},"h":"a5b9323d1d"},{"n":9,"t":"sum","q":"Our brain uses cute aggression to (A) strong positive feelings with the (B) feeling.","ko":"우리의 뇌는 귀여운 공격성을 이용해 강한 긍정적인 감정을 (B) 감정으로 (A).","oko":["(A) 공유한다 / (B) 같은","(A) 숨긴다 / (B) 비슷한","(A) 균형을 맞춘다 / (B) 정반대의","(A) 늘린다 / (B) 정반대의","(A) 균형을 맞춘다 / (B) 같은"],"opts":["(A) share / (B) same","(A) hide / (B) similar","(A) balance out / (B) opposite","(A) increase / (B) opposite","(A) balance out / (B) same"],"r":{"a":"3) (A) balance out / (B) opposite","ev":"7~8번 문장","s":[[7,"Sometimes, when it’s too much, cute aggression helps us handle these strong positive feelings.","때때로, 그 기쁨이 너무 많을 때, 귀여운 공격성은 우리가 이런 강한 긍정적인 감정들을 다루도록 도와준다."],[8,"Our brain tries to balance out strong feeling with the opposite.","우리의 뇌는 강한 감정의 균형을 정반대의 감정으로 맞추려고 노력한다."]],"w":"7번에서 귀여운 공격성이 강한 긍정적인 감정을 다루도록 돕고, 8번에서 뇌는 강한 감정의 균형을 the opposite(정반대의 감정)로 맞추려 함. 그래서 (A) balance out, (B) opposite. 같은 감정이나 늘리는 것이 아님.","c":3},"h":"15149dd94d"},{"n":10,"t":"fill","q":"Cute aggression doesn’t mean you actually want to [A] anyone. Your brain just helps you [B] down after too many happy feelings.","ko":"귀여운 공격성은 여러분이 실제로 누군가를 [A] 싶다는 뜻이 아니다. 여러분의 뇌는 너무 많은 행복한 감정을 가진 후에 여러분이 [B]하도록 도와주고 있을 뿐이다.","bko":{"hurt":"다치게 하다","calm":"진정하다","care":"돌보다","deal":"다루다","balance":"균형을 맞추다","focus":"집중하다"},"bank":["hurt","calm","care","deal","balance","focus"],"r":{"a":"[A] hurt, [B] calm","ev":"5번, 10번 문장","s":[[5,"Cute aggression doesn’t mean you actually want to hurt anyone.","귀여운 공격성은 여러분이 실제로 누군가를 다치게 하고 싶다는 뜻이 아니다."],[10,"The next time you feel cute aggression, remember this: Your brain is just helping you calm down after you have too many happy feelings!","다음번에 여러분이 귀여운 공격성을 느낄 때, 이것을 기억하라: 여러분의 뇌는 여러분이 너무 많은 행복한 감정을 가진 후에 진정하도록 도와주고 있을 뿐이다!"]],"w":"5번에서 actually want to hurt anyone(실제로 누군가를 다치게 하고 싶다)이 아니라고 했고, 10번에서 뇌가 happy feelings 뒤에 calm down(진정하다)하도록 돕는다고 함. care(돌보다), deal(다루다), balance(균형을 맞추다), focus(집중하다)는 이 문장의 빈칸 자리에 말이 되지 않음.","c":null},"h":"28b2ed73bf"}]},{"u":11,"id":"rg2-11-1","no":1,"ko":"생일 파티는 언제부터 우리 곁에 있었을까?","items":[{"n":1,"t":"tf","q":"By the end of the 19th century, giving birthday cards also became common.","ko":"19세기 말 즈음에는, 생일 카드를 주는 것도 흔해졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"By the end of the 19th century, giving birthday cards also became common.","19세기 말 즈음에는, 생일 카드를 주는 것도 흔해졌다."]],"w":"11번 문장에 By the end of the 19th century, giving birthday cards also became common이 그대로 나옴. 같은 내용이라 T.","c":"T"},"h":"4bd04f440b"},{"n":2,"t":"tf","q":"People started the birthday tradition around 1,000 years ago.","ko":"사람들은 약 1,000년 전에 생일 전통을 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"But people only started this tradition around 100 years ago!","하지만 사람들은 고작 100년쯤 전에 이 전통을 시작했다!"]],"w":"3번에서 사람들은 이 전통을 약 100년 전에(around 100 years ago) 시작했다고 함. 1,000년이 아니라 100년이므로 F. started는 start(시작하다)의 과거형.","c":"F"},"h":"edcea9d70e"},{"n":3,"t":"tf","q":"Families started to put many small candles around the cake.","ko":"가족들은 케이크 주위에 작은 초를 많이 꽂기 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"On kids’ birthdays, families started to put a big candle in the middle of the cake.","아이들의 생일에, 가족들은 케이크 가운데에 큰 초를 꽂기 시작했다."]],"w":"10번에서 가족들은 케이크 가운데(in the middle of the cake)에 큰 초(a big candle) 하나를 꽂기 시작했다고 함. 작은 초 여러 개를 주위에 꽂은 것이 아니므로 F.","c":"F"},"h":"de832f970a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Birthday celebrations feel like a very old tradition.)","ko":"생일 축하 행사는 매우 오래된 ‘전통’처럼 느껴진다.","opts":["규칙","전통","발명품","숙제"],"word":"tradition","r":{"a":"2) 전통","ev":"2~3번 문장","s":[[2,"Birthday celebrations feel like a very old tradition.","생일 축하 행사는 매우 오래된 전통처럼 느껴진다."],[3,"But people only started this tradition around 100 years ago!","하지만 사람들은 고작 100년쯤 전에 이 전통을 시작했다!"]],"w":"2번에서 생일 축하 행사가 아주 오래된 tradition처럼 느껴진다고 하고, 3번에서 사람들이 ‘이 전통을 시작했다(started this tradition)’고 함. 오래 이어져 온 풍습이므로 tradition은 전통.","c":2},"h":"a53467947b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Families began to have fewer kids, so each kid was able to get more attention.)","ko":"가족들이 더 적은 수의 아이들을 갖기 시작했고, 그래서 각각의 아이는 더 많은 ‘관심’을 받을 수 있었다.","opts":["선물","용돈","관심","나이"],"word":"attention","r":{"a":"3) 관심","ev":"8번 문장","s":[[8,"Families began to have fewer kids, so each kid was able to get more attention.","가족들이 더 적은 수의 아이들을 갖기 시작했고, 그 결과 각각의 아이는 더 많은 관심을 받을 수 있었다."]],"w":"8번에서 아이 수가 줄어서(fewer kids) 각 아이가 more attention을 받았다고 함. 아이가 적어지면 부모의 관심을 더 받게 된다는 흐름이라 attention은 관심. 선물이나 용돈은 나오지 않음. began은 begin(시작하다)의 과거형.","c":3},"h":"a3642622ae"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis led to more birthday parties.","ko":"밑줄 친 This이(가) 가리키는 것은?","sko":"이것이 더 많은 생일 파티로 이어졌다.","opts":["케이크에 큰 초를 꽂은 것","생일 카드를 주는 것","부유한 사람들만 생일을 축하한 것","가족들이 아이를 적게 낳아 아이마다 더 많은 관심을 받게 된 것"],"r":{"a":"4) 가족들이 아이를 적게 낳아 아이마다 더 많은 관심을 받게 된 것","ev":"8~9번 문장","s":[[8,"Families began to have fewer kids, so each kid was able to get more attention.","가족들이 더 적은 수의 아이들을 갖기 시작했고, 그 결과 각각의 아이는 더 많은 관심을 받을 수 있었다."],[9,"This led to more birthday parties.","이것이 더 많은 생일 파티로 이어졌다."]],"w":"9번의 This led to more birthday parties 바로 앞 8번이 가족들이 아이를 적게 갖게 되어 각 아이가 관심을 더 받았다는 내용. 그것이 더 많은 생일 파티로 이어졌다는 말. 초(10번)와 카드(11번)는 9번보다 뒤에 나오는 내용.","c":4},"h":"513bdaee9c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even though birthday parties have a short history, they’re now a big part of our lives.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 생일 파티는 짧은 역사를 가지고 있지만, 그것들은 이제 우리 삶의 큰 부분을 차지한다.","opts":["생일 파티는 역사가 짧지만 지금은 우리 삶의 큰 부분이다.","생일 파티는 역사가 길어서 우리 삶의 큰 부분이다.","생일 파티는 역사가 짧아서 점점 사라지고 있다.","생일 파티는 우리 삶과 아무 관계가 없다."],"r":{"a":"1) 생일 파티는 역사가 짧지만 지금은 우리 삶의 큰 부분이다.","ev":"12번 문장","s":[[12,"Even though birthday parties have a short history, they’re now a big part of our lives.","비록 생일 파티는 짧은 역사를 가지고 있지만, 그것들은 이제 우리 삶의 큰 부분을 차지한다."]],"w":"Even though는 ‘비록 ~이지만’이라서 앞뒤 내용이 반대됨. 생일 파티는 짧은 역사를 가지고 있지만(앞), 지금은 우리 삶의 큰 부분이다(뒤). 역사가 길다는 것은 2~3번의 ‘오래된 느낌’과 헷갈리게 만든 함정.","c":1},"h":"b121f334ce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["19세기 중반에 가족들은 더 많은 아이를 갖기 시작했다.","생일 카드는 19세기 이전에 흔해졌다.","19세기 이전에 미국의 대부분의 사람들은 자신의 생일이 아니라 조지 워싱턴의 생일을 축하했다.","19세기 이전에는 모든 사람이 자신의 생일 파티를 했다."],"opts":["Families began to have more kids in the mid-19th century.","Birthday cards became common before the 19th century.","Before the 19th century, most people in the U.S. celebrated George Washington’s birthday, not their own.","Everyone had their own birthday party before the 19th century."],"r":{"a":"3) Before the 19th century, most people in the U.S. celebrated George Washington’s birthday, not their own.","ev":"5~6번, 8번, 11번 문장","s":[[5,"Before the 19th century, in the U.S., birthday celebrations were only for rich people or national heroes.","19세기 이전 미국에서, 생일 축하 행사는 오직 부자나 국가 영웅들을 위한 것이었다."],[6,"For example, most people would celebrate George Washington’s birthday, not their own.","예를 들어, 대부분의 사람들은 자신의 생일이 아니라 조지 워싱턴의 생일을 축하하곤 했다."],[8,"Families began to have fewer kids, so each kid was able to get more attention.","가족들이 더 적은 수의 아이들을 갖기 시작했고, 그 결과 각각의 아이는 더 많은 관심을 받을 수 있었다."],[11,"By the end of the 19th century, giving birthday cards also became common.","19세기 말 즈음에는, 생일 카드를 주는 것도 흔해졌다."]],"w":"5~6번에서 19세기 이전에는 부자나 영웅의 생일만 축하했고, 대부분의 사람들은 자기 생일이 아니라 조지 워싱턴의 생일을 축하했음. 아이는 더 ‘적게’ 갖기 시작했고(8번), 카드는 19세기 말에 흔해졌으며(11번), 모든 사람이 파티를 한 것도 아니라서 나머지는 모두 다름.","c":3},"h":"26f8d435f0"},{"n":9,"t":"sum","q":"Birthday parties increased in the U.S. when families had (A) kids, so each kid got more (B).","ko":"가족들이 아이를 (A) 갖게 되자 각각의 아이가 더 많은 (B)을 받아서 생일 파티가 늘어났다.","oko":["(A) 더 많이 / (B) 관심","(A) 더 적게 / (B) 돈","(A) 더 많이 / (B) 카드","(A) 더 적게 / (B) 초","(A) 더 적게 / (B) 관심"],"opts":["(A) more / (B) attention","(A) fewer / (B) money","(A) more / (B) cards","(A) fewer / (B) candles","(A) fewer / (B) attention"],"r":{"a":"5) (A) fewer / (B) attention","ev":"8~9번 문장","s":[[8,"Families began to have fewer kids, so each kid was able to get more attention.","가족들이 더 적은 수의 아이들을 갖기 시작했고, 그 결과 각각의 아이는 더 많은 관심을 받을 수 있었다."],[9,"This led to more birthday parties.","이것이 더 많은 생일 파티로 이어졌다."]],"w":"8번에서 가족들이 fewer kids(더 적은 수의 아이)를 갖자 each kid가 more attention(더 많은 관심)을 받았고, 9번에서 이것이 더 많은 생일 파티로 이어졌음. 아이를 더 많이 갖게 된 것이 아니고, 돈이나 초, 카드가 늘어서 파티가 늘어난 것도 아님.","c":5},"h":"f52441074a"},{"n":10,"t":"fill","q":"Before the 19th century, birthday celebrations were only for [A] people or national [B].","ko":"19세기 이전에는 생일 축하 행사가 오직 [A] 사람들이나 국가 [B]들을 위한 것이었다.","bko":{"rich":"부유한","heroes":"영웅들","kids":"아이들","candles":"초","cards":"카드","parents":"부모님"},"bank":["rich","heroes","kids","candles","cards","parents"],"r":{"a":"[A] rich, [B] heroes","ev":"5번 문장","s":[[5,"Before the 19th century, in the U.S., birthday celebrations were only for rich people or national heroes.","19세기 이전 미국에서, 생일 축하 행사는 오직 부자나 국가 영웅들을 위한 것이었다."]],"w":"5번에서 19세기 이전 미국의 생일 축하 행사는 오직 rich people(부자)이나 national heroes(국가 영웅들)를 위한 것이었음. kids, candles, cards는 8~11번(19세기 중반 이후) 이야기라서 이 문장과 맞지 않음.","c":null},"h":"bdf22658f3"}]},{"u":11,"id":"rg2-11-2","no":2,"ko":"스트레스가 쌓일 땐 벽에 붙은 파리가 되어 보세요","items":[{"n":1,"t":"tf","q":"Scientists at Ohio University found out that the fly on the wall method is effective.","ko":"오하이오 대학교의 과학자들은 벽에 붙은 파리 방법이 효과적이라는 것을 알아냈다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Scientists at Ohio University did a study and found out that this method is effective.","오하이오 대학교의 과학자들은 연구를 했고, 이 방법이 효과적이라는 것을 알아냈어요."]],"w":"4번 문장에 Scientists at Ohio University did a study and found out that this method is effective라고 나옴. 같은 내용이라 T. found는 find(찾다, 알아내다)의 과거형.","c":"T"},"h":"bf262b5f89"},{"n":2,"t":"tf","q":"The fly on the wall method makes you get caught up in bad feelings.","ko":"벽에 붙은 파리 방법은 여러분이 나쁜 감정에 사로잡히게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It stops you from getting caught up in bad feelings.","그것은 여러분이 나쁜 감정에 사로잡히지 않게 막아줘요."]],"w":"7번에서 이 방법은 나쁜 감정에 사로잡히지 않게 ‘막아 준다(stops you from getting caught up in bad feelings)’고 함. 사로잡히게 만든다는 진술은 반대라서 F. stop은 막다.","c":"F"},"h":"e3b0fb338d"},{"n":3,"t":"tf","q":"The fly on the wall method can be done only at home.","ko":"벽에 붙은 파리 방법은 집에서만 할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"This method can be done anywhere at any time and is great for reducing stress.","이 방법은 언제 어디서든 할 수 있고 스트레스를 줄이는 데 아주 좋아요."]],"w":"9번에서 이 방법은 anywhere at any time(언제 어디서든) 할 수 있다고 함. 집에서만 할 수 있다는 말은 틀려서 F.","c":"F"},"h":"438b6d7884"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists at Ohio University did a study and found out that this method is effective.)","ko":"오하이오 대학교의 과학자들은 연구를 했고, 이 방법이 ‘효과적’이라는 것을 알아냈다.","opts":["효과적인","쓸모없는","위험한","어려운"],"word":"effective","r":{"a":"1) 효과적인","ev":"3~5번 문장","s":[[3,"The “fly on the wall” method might sound funny, but it really works!","‘벽에 붙은 파리’ 방법은 우습게 들릴지도 모르지만, 실제로 효과가 있어요!"],[4,"Scientists at Ohio University did a study and found out that this method is effective.","오하이오 대학교의 과학자들은 연구를 했고, 이 방법이 효과적이라는 것을 알아냈어요."],[5,"People who tried it felt less angry and were also able to do their tasks 30% better.","이 방법을 시도해 본 사람들은 화가 덜 난다고 느꼈고 그들의 일을 30% 더 잘할 수 있었어요."]],"w":"3번에서 방법이 실제로 효과가 있다(really works)고 했고, 5번에서 화가 덜 나고 일도 30% 더 잘했다고 함. 4번의 effective는 효과적인. 쓸모없거나 위험하다는 내용은 나오지 않음.","c":1},"h":"78f9ab8440"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When you’re upset, seeing things from the outside can help you.)","ko":"여러분이 ‘속상할’ 때, 외부에서 상황을 바라보는 것이 도움이 될 수 있다.","opts":["신나는","졸린","속상한","배고픈"],"word":"upset","r":{"a":"3) 속상한","ev":"6~7번 문장","s":[[6,"When you’re upset, seeing things from the outside can help you.","여러분이 속상할 때, 외부에서 상황을 바라보는 것이 도움이 될 수 있어요."],[7,"It stops you from getting caught up in bad feelings.","그것은 여러분이 나쁜 감정에 사로잡히지 않게 막아줘요."]],"w":"6번 뒤 7번에서 나쁜 감정에 사로잡히지 않게 해 준다고 함. 그러니 upset은 마음이 상하고 나쁜 감정이 드는 상태, 즉 속상한. 신나는 상태에서는 이 방법이 필요하지 않음.","c":3},"h":"726fa3347b"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt stops you from getting caught up in bad feelings.","ko":"밑줄 친 It이(가) 가리키는 것은?","sko":"그것은 여러분이 나쁜 감정에 사로잡히지 않게 막아줘요.","opts":["벽에 붙은 파리","외부에서 상황을 바라보는 것","오하이오 대학교","스트레스"],"r":{"a":"2) 외부에서 상황을 바라보는 것","ev":"6~7번 문장","s":[[6,"When you’re upset, seeing things from the outside can help you.","여러분이 속상할 때, 외부에서 상황을 바라보는 것이 도움이 될 수 있어요."],[7,"It stops you from getting caught up in bad feelings.","그것은 여러분이 나쁜 감정에 사로잡히지 않게 막아줘요."]],"w":"7번의 It stops you from getting caught up in bad feelings 바로 앞 6번 주어가 seeing things from the outside(외부에서 상황을 바라보는 것). 그렇게 바라보는 것이 나쁜 감정에 사로잡히지 않게 막아 줌. 스트레스는 막아 주는 대상이 아님.","c":2},"h":"a1ade08b44"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of being a fly on the wall, you could also be a cloud in the sky, or a security camera.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"벽에 붙은 파리 대신에, 여러분은 하늘의 구름이나 보안용 카메라가 될 수도 있어요.","opts":["벽에 붙은 파리와 함께 구름과 카메라를 키울 수 있다.","하늘의 구름은 벽에 붙은 파리를 싫어한다.","보안용 카메라가 구름과 파리를 찍을 수 있다.","벽에 붙은 파리 대신 하늘의 구름이나 보안용 카메라가 되어 볼 수도 있다."],"r":{"a":"4) 벽에 붙은 파리 대신 하늘의 구름이나 보안용 카메라가 되어 볼 수도 있다.","ev":"8번 문장","s":[[8,"Instead of being a fly on the wall, you could also be a cloud in the sky, or a security camera.","벽에 붙은 파리 대신에, 여러분은 하늘의 구름이나 보안용 카메라가 될 수도 있어요."]],"w":"Instead of ~는 ‘~ 대신에’. 벽에 붙은 파리 대신 하늘의 구름이나 보안용 카메라가 될 수도 있다는 뜻으로, 바깥에서 지켜보는 다른 모습을 상상해도 된다는 말. 나머지 선지는 본문에 없는 내용.","c":4},"h":"9cc8461a3b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["사람들은 이 방법을 시도한 후에 더 화가 났다.","이 방법은 특별한 장소에서 해야 한다.","오하이오 대학교의 과학자들은 이 방법이 효과적이라는 것을 알아냈다.","여러분은 파리가 아니라 구름이라고 상상해야 한다."],"opts":["People felt angrier after they tried the method.","The method must be done in a special place.","Scientists at Ohio University found that the method is effective.","You should imagine yourself as a cloud, not as a fly."],"r":{"a":"3) Scientists at Ohio University found that the method is effective.","ev":"4~5번, 8~9번 문장","s":[[4,"Scientists at Ohio University did a study and found out that this method is effective.","오하이오 대학교의 과학자들은 연구를 했고, 이 방법이 효과적이라는 것을 알아냈어요."],[5,"People who tried it felt less angry and were also able to do their tasks 30% better.","이 방법을 시도해 본 사람들은 화가 덜 난다고 느꼈고 그들의 일을 30% 더 잘할 수 있었어요."],[8,"Instead of being a fly on the wall, you could also be a cloud in the sky, or a security camera.","벽에 붙은 파리 대신에, 여러분은 하늘의 구름이나 보안용 카메라가 될 수도 있어요."],[9,"This method can be done anywhere at any time and is great for reducing stress.","이 방법은 언제 어디서든 할 수 있고 스트레스를 줄이는 데 아주 좋아요."]],"w":"4번에서 오하이오 대학교 과학자들이 이 방법이 효과적이라는 것을 알아냈음. 사람들은 화가 ‘덜’ 났고(5번), 방법은 언제 어디서든 할 수 있으며(9번), 파리 대신 구름이 될 수도 있다고 했을 뿐 반드시 구름이어야 하는 것은 아님(8번).","c":3},"h":"a2a618f76f"},{"n":9,"t":"sum","q":"People who tried the “fly on the wall” method felt (A) angry and did their tasks (B).","ko":"‘벽에 붙은 파리’ 방법을 시도해 본 사람들은 화가 (A) 난다고 느꼈고 일을 (B) 했다.","oko":["(A) 더 / (B) 더 잘","(A) 덜 / (B) 더 못","(A) 덜 / (B) 더 잘","(A) 더 / (B) 더 못","(A) 덜 / (B) 더 느리게"],"opts":["(A) more / (B) better","(A) less / (B) worse","(A) less / (B) better","(A) more / (B) worse","(A) less / (B) slower"],"r":{"a":"3) (A) less / (B) better","ev":"5번 문장","s":[[5,"People who tried it felt less angry and were also able to do their tasks 30% better.","이 방법을 시도해 본 사람들은 화가 덜 난다고 느꼈고 그들의 일을 30% 더 잘할 수 있었어요."]],"w":"5번에서 방법을 시도한 사람들은 less angry(화가 덜 난다)고 느꼈고 일을 30% better(더 잘) 할 수 있었음. 그래서 (A) less, (B) better. more나 worse는 반대 뜻.","c":3},"h":"599f4816ee"},{"n":10,"t":"fill","q":"When you’re upset, seeing things from the [A] can help you. It [B] you from getting caught up in bad feelings.","ko":"여러분이 속상할 때, 상황을 [A]에서 바라보는 것이 도움이 될 수 있다. 그것은 여러분이 나쁜 감정에 사로잡히는 것을 [B].","bko":{"outside":"바깥, 외부","stops":"막아 준다 (stop: 막다)","helps":"돕는다 (help: 돕다)","makes":"만든다 (make: 만들다)","angry":"화난","funny":"우스운"},"bank":["outside","stops","helps","makes","angry","funny"],"r":{"a":"[A] outside, [B] stops","ev":"6~7번 문장","s":[[6,"When you’re upset, seeing things from the outside can help you.","여러분이 속상할 때, 외부에서 상황을 바라보는 것이 도움이 될 수 있어요."],[7,"It stops you from getting caught up in bad feelings.","그것은 여러분이 나쁜 감정에 사로잡히지 않게 막아줘요."]],"w":"6번에서 상황을 from the outside(외부에서) 바라보면 도움이 된다고 했고, 7번에서 It stops you from getting caught up(사로잡히지 않게 막아 준다)이라고 함. stop A from v-ing(A가 ~하지 못하게 막다)에서 from 앞에는 stops가 와야 하고, helps나 makes는 이 자리에서 말이 되지 않음. angry(화난), funny(우스운)는 빈칸 자리에 맞지 않음.","c":null},"h":"b5942fd237"}]},{"u":11,"id":"rg2-11-3","no":3,"ko":"돌고래가 몰아 주는 물고기, 브라질 어부의 특별한 친구","items":[{"n":1,"t":"tf","q":"The water in Laguna is not clear, so fishers have a hard time finding fish on their own.","ko":"Laguna의 물은 맑지 않아서, 어부들은 혼자 물고기를 찾는 데 어려움을 겪는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The water is not clear there, so fishers have a hard time finding the fish on their own.","그곳의 물은 맑지 않아서, 어부들은 혼자 물고기를 찾는 데 어려움을 겪는다."]],"w":"2번 문장에 The water is not clear there, so fishers have a hard time finding the fish on their own이라고 나옴. 같은 내용이라 T.","c":"T"},"h":"bed628a691"},{"n":2,"t":"tf","q":"The dolphins never take fish from the fishers’ nets.","ko":"돌고래들은 어부들의 그물에서 물고기를 절대 가져가지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The dolphins also become better at finding fish and sometimes take fish from the fishers’ nets!","돌고래들도 물고기를 찾는 것을 더 잘하게 되며, 때로는 어부의 그물에서 물고기를 가져가기도 한다!"]],"w":"7번에서 돌고래들이 때로는(sometimes) 어부들의 그물에서 물고기를 가져간다(take fish from the fishers’ nets)고 함. never(절대 ~않는다)는 본문과 반대라 F.","c":"F"},"h":"9036df66b2"},{"n":3,"t":"tf","q":"There are now more fish than before.","ko":"이제 예전보다 물고기가 더 많다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"There are now fewer fish than before.","이제 예전보다 물고기의 수가 더 적다."]],"w":"10번에서 There are now fewer fish than before라고 함. fewer(더 적은 수의)이지 more가 아니므로 F. 물고기가 줄어서 돌고래의 삶도 힘들어지고 있음.","c":"F"},"h":"0acb93dfff"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But thankfully, the dolphins help them with a special dive!)","ko":"하지만 ‘다행히도’, 돌고래들이 특별한 잠수로 그들을 도와준다!","opts":["다행히도","불행히도","천천히","조용히"],"word":"thankfully","r":{"a":"1) 다행히도","ev":"2~3번 문장","s":[[2,"The water is not clear there, so fishers have a hard time finding the fish on their own.","그곳의 물은 맑지 않아서, 어부들은 혼자 물고기를 찾는 데 어려움을 겪는다."],[3,"But thankfully, the dolphins help them with a special dive!","하지만 다행히도, 돌고래들이 특별한 잠수로 그들을 도와준다!"]],"w":"2번에서 어부들이 물고기를 찾기 어려운 상황이라고 했는데, 3번 But 뒤에서 돌고래들이 도와줌. 좋은 일이 생겼으니 thankfully는 다행히도. 불행히도(unfortunately)는 반대 뜻.","c":1},"h":"97fdd0aed0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Polluted water is harming the dolphins.)","ko":"‘오염된’ 물이 돌고래들을 해치고 있다.","opts":["맑은","차가운","오염된","따뜻한"],"word":"Polluted","r":{"a":"3) 오염된","ev":"8~9번 문장","s":[[8,"However, life is becoming tough for the dolphins.","그러나, 돌고래들에게 삶은 힘들어지고 있다."],[9,"Polluted water is harming the dolphins.","오염된 물이 돌고래들을 해치고 있다."]],"w":"8번에서 돌고래의 삶이 힘들어지고 있다고 했고, 9번은 그 이유로 Polluted water가 돌고래를 해치고 있다고 함. 돌고래를 해치는 물이므로 polluted는 오염된. 맑은 물은 해치지 않고, 2번에서도 물이 맑지 않다고 했음.","c":3},"h":"2326ecbb94"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt lets the fishers know when to throw their nets.","ko":"밑줄 친 It이(가) 가리키는 것은?","sko":"그것은 어부들이 언제 그물을 던져야 하는지 알게 해 준다.","opts":["Laguna의 맑은 물","돌고래의 특별한 잠수","어부의 그물","과학자들의 관찰"],"r":{"a":"2) 돌고래의 특별한 잠수","ev":"3~4번 문장","s":[[3,"But thankfully, the dolphins help them with a special dive!","하지만 다행히도, 돌고래들이 특별한 잠수로 그들을 도와준다!"],[4,"It lets the fishers know when to throw their nets.","그것은 어부들이 언제 그물을 던져야 하는지 알게 해 준다."]],"w":"4번의 It lets the fishers know when to throw their nets 바로 앞 3번에서 돌고래들이 special dive(특별한 잠수)로 어부들을 도와준다고 함. 그 잠수가 어부들에게 그물 던질 때를 알려 줌. 그물은 던지는 대상이고 과학자들의 관찰은 5번 내용.","c":2},"h":"78d9c017d2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If more people understand the importance of this friendship between fishers and dolphins, they might help to protect it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 더 많은 사람들이 어부들과 돌고래들 사이의 이 우정의 중요성을 이해한다면, 그들은 그것을 보호하는 데 도움을 줄지도 모른다.","opts":["어부와 돌고래의 우정은 이미 사람들에게 잘 보호받고 있다.","사람들이 돌고래를 많이 잡으면 우정이 더 깊어진다.","돌고래가 사람들의 중요성을 이해하면 어부를 도울 것이다.","더 많은 사람들이 이 우정의 중요성을 이해하면 그것을 보호하는 데 도움을 줄지도 모른다."],"r":{"a":"4) 더 많은 사람들이 이 우정의 중요성을 이해하면 그것을 보호하는 데 도움을 줄지도 모른다.","ev":"11번 문장","s":[[11,"If more people understand the importance of this friendship between fishers and dolphins, they might help to protect it.","만약 더 많은 사람들이 어부들과 돌고래들 사이의 이 우정의 중요성을 이해한다면, 그들은 그것을 보호하는 데 도움을 줄지도 모른다."]],"w":"If more people understand ~, they might help to protect it에서 If는 ‘만약 ~한다면’, it은 어부와 돌고래의 우정. 사람들이 우정의 중요성을 이해하면 그것을 보호하는 데 도울지도 모른다는 뜻. 이미 보호받는다는 말은 없고, 이해하는 쪽은 돌고래가 아니라 사람들.","c":4},"h":"d72bacdfc7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["어부들은 돌고래와 함께 일할 때 더 적은 물고기를 잡는다.","Laguna의 물은 맑아서 어부들이 쉽게 물고기를 찾는다.","Laguna의 돌고래들은 오염된 물 때문에 더 힘든 시간을 보내고 있다.","과학자들은 이 우정에 대해 흥미로운 것을 하나도 발견하지 못했다."],"opts":["Fishers catch fewer fish when they work with dolphins.","The water in Laguna is clear, so fishers easily find fish.","Dolphins in Laguna are having a harder time because of polluted water.","Scientists did not find anything interesting about this friendship."],"r":{"a":"3) Dolphins in Laguna are having a harder time because of polluted water.","ev":"2번, 5~6번, 8~9번 문장","s":[[2,"The water is not clear there, so fishers have a hard time finding the fish on their own.","그곳의 물은 맑지 않아서, 어부들은 혼자 물고기를 찾는 데 어려움을 겪는다."],[5,"Scientists watched this friendship and found something interesting.","과학자들은 이 우정을 관찰했고 흥미로운 것을 발견했다."],[6,"When the fishers and dolphins work together, the fishers catch more fish.","어부들과 돌고래들이 함께 일할 때, 어부들은 더 많은 물고기를 잡는다."],[8,"However, life is becoming tough for the dolphins.","그러나, 돌고래들에게 삶은 힘들어지고 있다."],[9,"Polluted water is harming the dolphins.","오염된 물이 돌고래들을 해치고 있다."]],"w":"8~9번에서 돌고래들에게 삶이 힘들어지고 있고 오염된 물이 돌고래들을 해치고 있다고 함. 어부들은 함께 일할 때 더 많은 물고기를 잡고(6번), 물은 맑지 않으며(2번), 과학자들은 흥미로운 것을 발견했다(5번)이라 나머지는 모두 다름.","c":3},"h":"ab5ac72870"},{"n":9,"t":"sum","q":"When fishers and dolphins work together, the fishers catch (A) fish, and the dolphins become (B) at finding fish.","ko":"어부들과 돌고래들이 함께 일할 때, 어부들은 (A) 물고기를 잡고, 돌고래들은 물고기를 찾는 데 (B).","oko":["(A) 더 적은 / (B) 더 잘하게 된다","(A) 더 많은 / (B) 더 못하게 된다","(A) 더 적은 / (B) 더 못하게 된다","(A) 더 많은 / (B) 더 느려진다","(A) 더 많은 / (B) 더 잘하게 된다"],"opts":["(A) fewer / (B) better","(A) more / (B) worse","(A) fewer / (B) worse","(A) more / (B) slower","(A) more / (B) better"],"r":{"a":"5) (A) more / (B) better","ev":"6~7번 문장","s":[[6,"When the fishers and dolphins work together, the fishers catch more fish.","어부들과 돌고래들이 함께 일할 때, 어부들은 더 많은 물고기를 잡는다."],[7,"The dolphins also become better at finding fish and sometimes take fish from the fishers’ nets!","돌고래들도 물고기를 찾는 것을 더 잘하게 되며, 때로는 어부의 그물에서 물고기를 가져가기도 한다!"]],"w":"6번에서 함께 일할 때 어부들은 more fish(더 많은 물고기)를 잡고, 7번에서 돌고래들도 물고기 찾기를 better(더 잘) 하게 된다고 함. fewer나 worse는 반대 뜻.","c":5},"h":"65a184dfc6"},{"n":10,"t":"fill","q":"[A] water is harming the dolphins, and there are now [B] fish than before.","ko":"[A] 물이 돌고래들을 해치고 있고, 이제 예전보다 [B] 수의 물고기가 있다.","bko":{"Polluted":"오염된","fewer":"더 적은","clear":"맑은","more":"더 많은","special":"특별한","wild":"야생의"},"bank":["Polluted","fewer","clear","more","special","wild"],"r":{"a":"[A] Polluted, [B] fewer","ev":"9~10번 문장","s":[[9,"Polluted water is harming the dolphins.","오염된 물이 돌고래들을 해치고 있다."],[10,"There are now fewer fish than before.","이제 예전보다 물고기의 수가 더 적다."]],"w":"9번에서 Polluted water(오염된 물)가 돌고래들을 해치고 있고, 10번에서 There are now fewer fish than before(예전보다 더 적은 수의 물고기)라고 함. clear(맑은)는 2번에서 물이 맑지 않다고 했으니 반대이고, more는 10번과 반대.","c":null},"h":"cfa170b0d4"}]},{"u":12,"id":"rg2-12-1","no":1,"ko":"포르투갈 사람들이 대구에 푹 빠진 이유","items":[{"n":1,"t":"tf","q":"Portuguese people eat more than 100,000 tons of salted dried cod every year.","ko":"포르투갈 사람들은 매년 소금에 절인 말린 대구를 10만 톤 이상 먹는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They eat more than 100,000 tons of salted dried cod every year.","그들은 매년 소금에 절인 말린 대구를 10만 톤 이상 먹는다."]],"w":"2번 문장에 They eat more than 100,000 tons of salted dried cod every year라고 나옴. 같은 내용이라 T.","c":"T"},"h":"5689530f57"},{"n":2,"t":"tf","q":"Most of the cod that people in Portugal eat nowadays comes from Portugal.","ko":"요즘 포르투갈 사람들이 먹는 대구의 대부분은 포르투갈에서 온다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Nowadays, most of the cod that people in Portugal eat actually comes from Norway.","요즘에, 포르투갈 사람들이 먹는 대부분의 대구는 사실 노르웨이에서 온다."]],"w":"7번에서 요즘 포르투갈 사람들이 먹는 대부분의 대구는 사실 노르웨이(Norway)에서 온다고 함. 포르투갈에서 온다는 진술은 틀려서 F.","c":"F"},"h":"cae0d87a35"},{"n":3,"t":"tf","q":"In the 1930s, Portuguese fishermen traveled to Norway and Greenland just to catch cod.","ko":"1930년대에, 포르투갈 어부들은 오직 대구를 잡기 위해 노르웨이와 그린란드에 갔다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"In the 1930s, Portuguese fishermen traveled to Canada and Greenland just to catch cod.","1930년대에, 포르투갈 어부들은 오직 대구를 잡기 위해 캐나다와 그린란드에 갔다."]],"w":"6번에서 포르투갈 어부들이 간 곳은 Canada(캐나다)와 Greenland(그린란드)였음. 노르웨이는 7번에서 요즘 대구가 오는 나라라서 헷갈리게 섞은 함정. 그래서 F. traveled는 travel(가다, 여행하다)의 과거형.","c":"F"},"h":"acb2748c84"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Portuguese people started eating cod in the 1300s when Portugal traded salt for codfish with England.)","ko":"포르투갈 사람들은 1300년대에 포르투갈이 영국과 소금을 대구로 ‘교환하면서’ 대구를 먹기 시작했다.","opts":["선물하다","교환하다, 거래하다","훔치다","요리하다"],"word":"traded","r":{"a":"2) 교환하다, 거래하다","ev":"5번 문장","s":[[5,"Portuguese people started eating cod in the 1300s when Portugal traded salt for codfish with England.","포르투갈 사람들은 1300년대에 포르투갈이 영국과 소금을 대구로 교환하면서 대구를 먹기 시작했다."]],"w":"5번에서 포르투갈이 영국에 소금을 주고 대구를 받았다는 흐름. trade A for B는 ‘A를 B와 교환하다’라서 trade는 교환하다, 거래하다. 훔치거나 요리한다는 내용은 나오지 않음.","c":2},"h":"e8b48effab"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Eating codfish is a big part of Portuguese culture.)","ko":"대구를 먹는 것은 포르투갈 ‘문화’의 큰 부분을 차지한다.","opts":["문화","경제","날씨","언어"],"word":"culture","r":{"a":"1) 문화","ev":"10~11번 문장","s":[[10,"But it’s not just about the taste.","하지만 그것은 단지 맛 때문만은 아니다."],[11,"Eating codfish is a big part of Portuguese culture.","대구를 먹는 것은 포르투갈 문화의 큰 부분을 차지한다."]],"w":"10번에서 대구는 단지 맛 때문만이 아니라고 했고, 11번에서 대구를 먹는 것이 포르투갈의 culture의 큰 부분이라고 함. 12~13번의 대구 요리, 크리스마스이브 식사 이야기도 문화에 해당. 그래서 culture는 문화.","c":1},"h":"a07456c897"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt’s a special meal that they always get excited about!","ko":"밑줄 친 It이(가) 가리키는 것은?","sko":"그것은 그들이 항상 신나하는 특별한 식사이다!","opts":["노르웨이에서 온 대구","대구를 잡으러 간 여행","크리스마스이브에 양배추, 달걀, 감자와 함께 대구를 먹는 것","대구의 좋은 맛"],"r":{"a":"3) 크리스마스이브에 양배추, 달걀, 감자와 함께 대구를 먹는 것","ev":"13~14번 문장","s":[[13,"They especially love having cod on Christmas Eve with cabbage, eggs, and potatoes.","그들은 특히 크리스마스이브에 양배추, 달걀, 그리고 감자와 함께 대구를 먹는 것을 아주 좋아한다."],[14,"It’s a special meal that they always get excited about!","그것은 그들이 항상 신나하는 특별한 식사이다!"]],"w":"14번의 It’s a special meal 바로 앞 13번에서 크리스마스이브에 양배추, 달걀, 감자와 함께 대구를 먹는 것을 아주 좋아한다고 함. 그 식사가 항상 신나게 기다리는 특별한 식사라는 말. 맛(9번)이나 노르웨이산 대구(7번)는 ‘식사’가 아님.","c":3},"h":"13d6b5295c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But it’s not just about the taste.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그것은 단지 맛 때문만은 아니다.","opts":["대구는 맛이 없지만 포르투갈 사람들은 그래도 먹는다.","포르투갈 사람들은 맛 때문에만 대구를 좋아한다.","대구의 맛은 포르투갈 사람들에게 전혀 상관이 없다.","포르투갈 사람들이 대구를 좋아하는 이유는 맛뿐만이 아니다."],"r":{"a":"4) 포르투갈 사람들이 대구를 좋아하는 이유는 맛뿐만이 아니다.","ev":"9~10번 문장","s":[[9,"Well, one reason is that it tastes great.","자, 한 가지 이유로는 대구의 맛이 굉장히 좋기 때문이다."],[10,"But it’s not just about the taste.","하지만 그것은 단지 맛 때문만은 아니다."]],"w":"9번에서 맛이 좋은 것을 한 가지 이유로 말했고, 10번 But it’s not just about the taste는 ‘하지만 맛 때문만은 아니다’라는 뜻. 맛도 이유이지만 그것만이 전부는 아님. 11번에서 두 번째 이유(문화)가 나옴.","c":4},"h":"a952213dd9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["포르투갈 사람들은 1930년대에 대구를 먹기 시작했다.","포르투갈 사람들은 대구가 자신들의 문화의 큰 부분이어서 대구를 먹는다.","소금에 절인 말린 대구는 오직 크리스마스이브에만 먹는다.","포르투갈 사람들은 대구가 맛있기 때문에만 대구를 먹는다."],"opts":["Portuguese people started eating cod in the 1930s.","Portuguese people eat cod because it is a big part of their culture.","Salted dried cod is eaten only on Christmas Eve.","Portuguese people eat cod only because it tastes great."],"r":{"a":"2) Portuguese people eat cod because it is a big part of their culture.","ev":"5번, 10~11번, 13번 문장","s":[[5,"Portuguese people started eating cod in the 1300s when Portugal traded salt for codfish with England.","포르투갈 사람들은 1300년대에 포르투갈이 영국과 소금을 대구로 교환하면서 대구를 먹기 시작했다."],[10,"But it’s not just about the taste.","하지만 그것은 단지 맛 때문만은 아니다."],[11,"Eating codfish is a big part of Portuguese culture.","대구를 먹는 것은 포르투갈 문화의 큰 부분을 차지한다."],[13,"They especially love having cod on Christmas Eve with cabbage, eggs, and potatoes.","그들은 특히 크리스마스이브에 양배추, 달걀, 그리고 감자와 함께 대구를 먹는 것을 아주 좋아한다."]],"w":"11번에서 대구를 먹는 것은 포르투갈 문화의 큰 부분이라고 함. 대구를 먹기 시작한 때는 1300년대(5번), 크리스마스이브는 특히 좋아하는 때일 뿐(13번), 맛 때문만은 아님(10번)이라 나머지는 모두 다름.","c":2},"h":"7bfd117d59"},{"n":9,"t":"sum","q":"Portuguese people love cod not only for its (A) but also because it is a big part of their (B).","ko":"포르투갈 사람들은 대구를 그 (A) 때문만이 아니라 자신들의 (B)의 큰 부분이기 때문에도 좋아한다.","oko":["(A) 크기 / (B) 문화","(A) 맛 / (B) 날씨","(A) 가격 / (B) 역사","(A) 색깔 / (B) 언어","(A) 맛 / (B) 문화"],"opts":["(A) size / (B) culture","(A) taste / (B) weather","(A) price / (B) history","(A) color / (B) language","(A) taste / (B) culture"],"r":{"a":"5) (A) taste / (B) culture","ev":"9~11번 문장","s":[[9,"Well, one reason is that it tastes great.","자, 한 가지 이유로는 대구의 맛이 굉장히 좋기 때문이다."],[10,"But it’s not just about the taste.","하지만 그것은 단지 맛 때문만은 아니다."],[11,"Eating codfish is a big part of Portuguese culture.","대구를 먹는 것은 포르투갈 문화의 큰 부분을 차지한다."]],"w":"9번에서 대구를 좋아하는 한 가지 이유는 taste(맛)이고, 10~11번에서 맛만이 아니라 포르투갈 culture(문화)의 큰 부분이라고 함. 그래서 (A) taste, (B) culture. 크기, 가격, 색깔, 날씨, 언어는 본문에 이유로 나오지 않음.","c":5},"h":"c124341bcf"},{"n":10,"t":"fill","q":"They especially love having cod on Christmas [A] with cabbage, eggs, and potatoes. It’s a [B] meal that they always get excited about!","ko":"그들은 특히 크리스마스 [A]에 양배추, 달걀, 그리고 감자와 함께 대구를 먹는 것을 아주 좋아한다. 그것은 그들이 항상 신나하는 [B] 식사이다!","bko":{"Eve":"(명절의) 전날, 이브","special":"특별한","tons":"톤 (무게 단위)","taste":"맛","culture":"문화","Norway":"노르웨이"},"bank":["Eve","special","tons","taste","culture","Norway"],"r":{"a":"[A] Eve, [B] special","ev":"13~14번 문장","s":[[13,"They especially love having cod on Christmas Eve with cabbage, eggs, and potatoes.","그들은 특히 크리스마스이브에 양배추, 달걀, 그리고 감자와 함께 대구를 먹는 것을 아주 좋아한다."],[14,"It’s a special meal that they always get excited about!","그것은 그들이 항상 신나하는 특별한 식사이다!"]],"w":"13번에서 크리스마스이브(Christmas Eve)에 양배추, 달걀, 감자와 함께 대구를 먹는다고 했고, 14번에서 그 식사가 항상 신나하는 special(특별한) 식사라고 함. tons(톤), taste(맛), culture(문화), Norway(노르웨이)도 본문에 나오는 말이지만 이 문장의 빈칸 자리에는 말이 되지 않음.","c":null},"h":"fd43d8923b"}]},{"u":12,"id":"rg2-12-2","no":2,"ko":"공룡 뼈에도 나이테가 있다고요?","items":[{"n":1,"t":"tf","q":"The T. rex gained around 15 to 20 kg per week.","ko":"티라노사우루스는 매주 약 15에서 20kg씩 체중이 늘었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The T. rex gained around 15 to 20 kg per week.","티라노사우루스는 매주 약 15에서 20kg씩 체중이 늘었다."]],"w":"5번 문장에 The T. rex gained around 15 to 20 kg per week라고 나옴. 같은 내용이라 T. gained는 gain(체중이 늘다)의 과거형.","c":"T"},"h":"61271bcd1e"},{"n":2,"t":"tf","q":"Mammals keep growing fast even after they become adults.","ko":"포유류는 성인이 된 후에도 계속 빠르게 성장한다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Then, they stop growing when they are adults.","그 후, 그들은 성인이 되면 성장하는 것을 멈춘다."]],"w":"2번에서 포유류는 어릴 때 빠르게 자라다가(1번), 성인이 되면 성장을 멈춘다(they stop growing when they are adults)고 함. 계속 자란다는 진술은 반대라서 F. stop은 멈추다.","c":"F"},"h":"b8f771750a"},{"n":3,"t":"tf","q":"A newly discovered dinosaur reached its full size when it was a teenager.","ko":"새롭게 발견된 공룡은 청소년기에 완전한 크기에 이르렀다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"These bones showed that it didn’t reach its full size until it was in its 30s or 40s!","이 뼈들은 그 공룡이 30대나 40대가 되기 전까지는 완전한 크기에 이르지 못했다는 것을 보여 준다!"]],"w":"14번에서 새롭게 발견된 공룡은 30대나 40대가 되기 전까지는 완전한 크기에 이르지 못했다고 함. 청소년기에 다 자란 것이 아니므로 F. reached는 reach(이르다)의 과거형.","c":"F"},"h":"45501b613f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But others that reach a similar size took longer in order to grow.)","ko":"하지만 비슷한 크기에 ‘이른’ 다른 공룡들은 성장하기 위해 더 오래 걸렸다.","opts":["이르다, 도달하다","피하다","가르치다","잃다"],"word":"reach","r":{"a":"1) 이르다, 도달하다","ev":"11~12번 문장","s":[[11,"Some, like the T. rex, grew quickly when they were young.","티라노사우루스와 같은 어떤 공룡들은 어릴 때 빠르게 성장했다."],[12,"But others that reach a similar size took longer in order to grow.","하지만 비슷한 크기에 이른 다른 공룡들은 성장하기 위해 더 오래 걸렸다."]],"w":"11~12번은 어떤 공룡은 어릴 때 빨리 자랐고 비슷한 크기에 이른 다른 공룡들은 더 오래 걸렸다는 내용. 크기에 ‘이르다’는 뜻이라 reach는 이르다, 도달하다. 14번에도 reach its full size(완전한 크기에 이르다)로 나옴.","c":1},"h":"a78d49885c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The scientists also studied bones from a newly discovered dinosaur.)","ko":"그 과학자들은 또한 새롭게 ‘발견된’ 공룡에서 나온 뼈들을 연구했다.","opts":["오래된","잃어버린","발견된","팔린"],"word":"discovered","r":{"a":"3) 발견된","ev":"13~14번 문장","s":[[13,"The scientists also studied bones from a newly discovered dinosaur.","그 과학자들은 또한 새롭게 발견된 공룡에서 나온 뼈들을 연구했다."],[14,"These bones showed that it didn’t reach its full size until it was in its 30s or 40s!","이 뼈들은 그 공룡이 30대나 40대가 되기 전까지는 완전한 크기에 이르지 못했다는 것을 보여 준다!"]],"w":"13번에서 과학자들이 newly discovered dinosaur의 뼈를 연구했다고 함. newly는 ‘새롭게’, discovered는 ‘발견된’이라 새롭게 발견된 공룡. 오래되었거나 잃어버렸다는 뜻이 아님.","c":3},"h":"1178542f79"},{"n":6,"t":"ref","q":"What does the underlined \"These rings\" refer to?\nThese rings help us understand how dinosaurs grew over time.","ko":"밑줄 친 These rings이(가) 가리키는 것은?","sko":"이 둥근 선들은 공룡이 시간이 지남에 따라 어떻게 성장했는지를 우리가 이해하도록 도와준다.","opts":["나무의 가지","공룡 뼈에 있는 둥근 선들","티라노사우루스의 체중","11개의 서로 다른 공룡"],"r":{"a":"2) 공룡 뼈에 있는 둥근 선들","ev":"8~9번 문장","s":[[8,"Just like tree rings, dinosaur bones also have rings.","꼭 나무의 나이테처럼, 공룡의 뼈에도 둥근 선들이 있다."],[9,"These rings help us understand how dinosaurs grew over time.","이 둥근 선들은 공룡이 시간이 지남에 따라 어떻게 성장했는지를 우리가 이해하도록 도와준다."]],"w":"9번의 These rings는 바로 앞 8번의 rings, 즉 공룡 뼈에도 있는 둥근 선들(나이테 같은 무늬)이다. 그 선이 공룡이 어떻게 성장했는지 알려 줌. 나무의 나이테는 비교를 위한 말이고, 체중은 5번 내용.","c":2},"h":"3e2aadd63a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But others that reach a similar size took longer in order to grow.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 비슷한 크기에 이른 다른 공룡들은 성장하기 위해 더 오래 걸렸다.","opts":["다른 공룡들은 티라노사우루스보다 훨씬 작게 자랐다.","비슷한 크기의 공룡들은 모두 같은 속도로 성장했다.","다른 공룡들은 성장을 일찍 멈췄다.","비슷한 크기에 이른 다른 공룡들은 성장하는 데 더 오래 걸렸다."],"r":{"a":"4) 비슷한 크기에 이른 다른 공룡들은 성장하는 데 더 오래 걸렸다.","ev":"11~12번 문장","s":[[11,"Some, like the T. rex, grew quickly when they were young.","티라노사우루스와 같은 어떤 공룡들은 어릴 때 빠르게 성장했다."],[12,"But others that reach a similar size took longer in order to grow.","하지만 비슷한 크기에 이른 다른 공룡들은 성장하기 위해 더 오래 걸렸다."]],"w":"12번의 But others는 11번의 Some(티라노사우루스처럼 빨리 자란 공룡)과 반대인 다른 공룡들. 비슷한 크기에 이르기까지 took longer(더 오래 걸렸다). 모두 같은 속도라면 11번과 12번이 ‘하지만’으로 이어질 수 없음.","c":4},"h":"6b7322467c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["과학자들은 11개의 서로 다른 종류의 공룡 뼈를 연구했다.","모든 공룡은 티라노사우루스만큼 빠르게 성장했다.","공룡의 뼈에는 둥근 선이 전혀 없다.","티라노사우루스는 청소년기에 느리게 성장했다."],"opts":["Scientists studied the bones of 11 different types of dinosaurs.","All dinosaurs grew as fast as the T. rex.","Dinosaur bones do not have any rings.","The T. rex grew slowly when it was a teenager."],"r":{"a":"1) Scientists studied the bones of 11 different types of dinosaurs.","ev":"4번, 7~8번, 11~12번 문장","s":[[4,"Scientists knew that the meat-eating Tyrannosaurus rex grew very fast when it was a teenager.","과학자들은 육식 공룡인 티라노사우루스가 청소년기에 매우 빠르게 성장했다는 것을 알고 있었다."],[7,"To find this out, some scientists studied the bones of 11 different types of dinosaurs.","이를 알아내기 위해, 몇몇 과학자들은 11개의 서로 다른 종류의 공룡 뼈를 연구했다."],[8,"Just like tree rings, dinosaur bones also have rings.","꼭 나무의 나이테처럼, 공룡의 뼈에도 둥근 선들이 있다."],[11,"Some, like the T. rex, grew quickly when they were young.","티라노사우루스와 같은 어떤 공룡들은 어릴 때 빠르게 성장했다."],[12,"But others that reach a similar size took longer in order to grow.","하지만 비슷한 크기에 이른 다른 공룡들은 성장하기 위해 더 오래 걸렸다."]],"w":"7번에서 과학자들이 11개의 서로 다른 종류의 공룡 뼈를 연구했음. 모든 공룡이 T. rex처럼 빠르지는 않았고(12번), 공룡 뼈에도 둥근 선이 있으며(8번), T. rex는 청소년기에 매우 빠르게 성장했음(4번)이라 나머지는 모두 다름.","c":1},"h":"15c504ed51"},{"n":9,"t":"sum","q":"Scientists studied dinosaur bones and found that dinosaurs didn’t grow in the (A) way: some grew (B) when they were young, but others took longer.","ko":"과학자들은 공룡 뼈를 연구해 공룡들이 (A) 방식으로 성장하지 않았다는 것을 알아냈다. 어떤 공룡은 어릴 때 (B) 성장했지만 다른 공룡들은 더 오래 걸렸다.","oko":["(A) 같은 / (B) 느리게","(A) 다른 / (B) 빠르게","(A) 다른 / (B) 느리게","(A) 같은 / (B) 빠르게","(A) 오래된 / (B) 빠르게"],"opts":["(A) same / (B) slowly","(A) different / (B) quickly","(A) different / (B) slowly","(A) same / (B) quickly","(A) old / (B) quickly"],"r":{"a":"4) (A) same / (B) quickly","ev":"10~12번 문장","s":[[10,"After studying these rings, the scientists found an answer.","이 둥근 선들을 연구한 후, 과학자들은 답을 찾았다."],[11,"Some, like the T. rex, grew quickly when they were young.","티라노사우루스와 같은 어떤 공룡들은 어릴 때 빠르게 성장했다."],[12,"But others that reach a similar size took longer in order to grow.","하지만 비슷한 크기에 이른 다른 공룡들은 성장하기 위해 더 오래 걸렸다."]],"w":"10번에서 둥근 선을 연구한 뒤 답을 찾았고, 11번에서 어떤 공룡은 어릴 때 quickly(빠르게) 성장했으며, 12번에서 다른 공룡들은 더 오래 걸렸음. 그래서 모든 공룡이 ‘같은(same)’ 방식으로 자라지 않았다는 뜻이 되어 (A) same, (B) quickly.","c":4},"h":"e201717bc8"},{"n":10,"t":"fill","q":"The meat-eating T. rex grew very [A] when it was a teenager, gaining around 15 to 20 kg per [B].","ko":"육식 공룡인 티라노사우루스는 청소년기에 매우 [A] 성장했고, 매[B] 약 15에서 20kg씩 체중이 늘었다.","bko":{"fast":"빠르게","week":"주(일주일)","slowly":"느리게","year":"해(1년)","small":"작은","adult":"성인, 어른"},"bank":["fast","week","slowly","year","small","adult"],"r":{"a":"[A] fast, [B] week","ev":"4~5번 문장","s":[[4,"Scientists knew that the meat-eating Tyrannosaurus rex grew very fast when it was a teenager.","과학자들은 육식 공룡인 티라노사우루스가 청소년기에 매우 빠르게 성장했다는 것을 알고 있었다."],[5,"The T. rex gained around 15 to 20 kg per week.","티라노사우루스는 매주 약 15에서 20kg씩 체중이 늘었다."]],"w":"4번에서 T. rex는 청소년기에 very fast(매우 빠르게) 성장했고, 5번에서 per week(매주) 약 15~20kg씩 체중이 늘었다고 함. slowly(느리게)는 반대이고, year(해)는 본문의 단위(week)와 다름.","c":null},"h":"a38139907a"}]},{"u":12,"id":"rg2-12-3","no":3,"ko":"문어가 조개껍데기를 던진 진짜 이유","items":[{"n":1,"t":"tf","q":"The scientists watched 10 octopuses for 24 hours by using cameras.","ko":"과학자들은 카메라를 사용해 10마리의 문어를 24시간 동안 관찰했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"By using cameras, they watched 10 octopuses for 24 hours.","카메라를 사용해, 그들은 24시간 동안 10마리의 문어를 관찰했다."]],"w":"2번 문장에 By using cameras, they watched 10 octopuses for 24 hours라고 나옴. they는 1번의 과학자들이라 T. watched는 watch(관찰하다)의 과거형.","c":"T"},"h":"84d152b513"},{"n":2,"t":"tf","q":"The darker the octopuses’ skin became, the worse they threw.","ko":"문어의 피부가 어두워질수록, 그것들은 더 못 던졌다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The darker their skin became, the better they threw.","그것들의 피부가 어두워질수록, 그것들은 더 잘 던졌다."]],"w":"7번에서 The darker their skin became, the better they threw라고 함. ‘더 잘(better)’ 던졌는데 ‘더 못(worse)’ 던졌다고 바꾼 진술이라 F. the 비교급 ~, the 비교급 …은 ‘~할수록 더 …하다’.","c":"F"},"h":"778a61c0b5"},{"n":3,"t":"tf","q":"The octopuses were trying to stop having relationships with each other.","ko":"문어들은 서로 관계를 끊으려고 노력하고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Either way, they were trying to build relationships with each other.","어느 쪽이든, 그것들은 서로 관계를 맺으려고 노력하고 있었다."]],"w":"11번에서 문어들은 서로 relationships를 build(맺다)하려고 노력하고 있었다고 함. 끊으려 한 것이 아니라 맺으려 한 것이므로 F. were trying은 try(노력하다)의 과거진행형.","c":"F"},"h":"f9b0d2a7b2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This wasn’t an accident. They were hitting other octopuses on purpose.)","ko":"이것은 ‘우연’이 아니었다. 그것들은 다른 문어들을 고의로 맞히고 있었다.","opts":["계획","우연, 사고","실험","선물"],"word":"accident","r":{"a":"2) 우연, 사고","ev":"4~5번 문장","s":[[4,"This wasn’t an accident.","이것은 우연이 아니었다."],[5,"They were hitting other octopuses on purpose.","그것들은 다른 문어들을 고의로 맞히고 있었다."]],"w":"4번의 accident는 바로 뒤 5번 on purpose(고의로)와 반대되는 말. 일부러가 아니라 ‘우연히’ 생긴 일이라 accident는 우연, 사고. 5번의 hitting은 hit(맞히다)의 진행형.","c":2},"h":"53bcf7f838"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, they even copied each other’s throwing actions.)","ko":"또한, 그것들은 심지어 서로의 던지는 동작을 ‘따라 했다’.","opts":["숨겼다","멈췄다","따라 했다","가르쳤다"],"word":"copied","r":{"a":"3) 따라 했다","ev":"8~9번 문장","s":[[8,"Also, they even copied each other’s throwing actions.","또한, 그것들은 심지어 서로의 던지는 동작을 따라 하기도 했다."],[9,"When one octopus lifted a leg to throw, the other did the same thing.","한 마리의 문어가 던지기 위해 다리를 들어 올렸을 때, 다른 한 마리도 같은 동작을 했다."]],"w":"9번에서 한 마리가 던지려고 다리를 들어 올리자 다른 한 마리도 같은 동작(the same thing)을 했음. 같은 동작을 했으니 copy는 따라 하다. copied는 copy의 과거형.","c":3},"h":"8876dd721b"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey were hitting other octopuses on purpose.","ko":"밑줄 친 They이(가) 가리키는 것은?","sko":"그것들은 다른 문어들을 고의로 맞히고 있었다.","opts":["호주의 과학자들","문어들","카메라들","조개껍데기들"],"r":{"a":"2) 문어들","ev":"3번, 5번 문장","s":[[3,"They saw the octopuses throwing shells at each other!","그들은 문어들이 서로에게 조개껍데기를 던지는 것을 보았다!"],[5,"They were hitting other octopuses on purpose.","그것들은 다른 문어들을 고의로 맞히고 있었다."]],"w":"5번의 They were hitting other octopuses on purpose에서 hitting의 대상이 other octopuses(다른 문어들)이니, 때린 쪽도 문어들. 3번의 They는 문어들을 ‘본’ 과학자들이라 헷갈리기 쉬운 함정. 카메라나 조개껍데기는 맞히는 행동의 주어로 나오지 않음.","c":2},"h":"5400dc3947"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The darker their skin became, the better they threw.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것들의 피부가 어두워질수록, 그것들은 더 잘 던졌다.","opts":["피부가 어두워질수록 문어들이 던지는 힘이 약해졌다.","피부가 밝아질수록 문어들은 더 잘 던졌다.","문어들은 피부색과 상관없이 똑같이 던졌다.","피부가 어두워질수록 문어들은 더 잘 던졌다."],"r":{"a":"4) 피부가 어두워질수록 문어들은 더 잘 던졌다.","ev":"6~7번 문장","s":[[6,"When the octopuses were angry, their skin turned darker.","문어들이 화났을 때, 그것들의 피부는 더 어두워졌다."],[7,"The darker their skin became, the better they threw.","그것들의 피부가 어두워질수록, 그것들은 더 잘 던졌다."]],"w":"The 비교급 ~, the 비교급 …은 ‘~할수록 더 …하다’. 6번에서 화나면 피부가 더 어두워진다고 했고, 7번은 어두워질수록 더 잘(better) 던졌다는 뜻. 약해졌거나 밝아질수록이라는 말은 본문과 반대.","c":4},"h":"59e8d7668c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["문어들이 화났을 때, 그것들의 피부는 더 어두워졌다.","과학자들은 100마리의 문어를 24시간 동안 관찰했다.","문어들은 우연히 서로에게 조개껍데기를 던졌다.","한 마리의 문어만 다리를 들어 올렸고, 다른 문어는 아무도 따라 하지 않았다."],"opts":["When octopuses were angry, their skin turned darker.","The scientists watched 100 octopuses for 24 hours.","Octopuses threw shells at each other by accident.","Only one octopus lifted a leg, and no other octopus copied it."],"r":{"a":"1) When octopuses were angry, their skin turned darker.","ev":"2번, 4번, 6번, 9번 문장","s":[[2,"By using cameras, they watched 10 octopuses for 24 hours.","카메라를 사용해, 그들은 24시간 동안 10마리의 문어를 관찰했다."],[4,"This wasn’t an accident.","이것은 우연이 아니었다."],[6,"When the octopuses were angry, their skin turned darker.","문어들이 화났을 때, 그것들의 피부는 더 어두워졌다."],[9,"When one octopus lifted a leg to throw, the other did the same thing.","한 마리의 문어가 던지기 위해 다리를 들어 올렸을 때, 다른 한 마리도 같은 동작을 했다."]],"w":"6번에서 문어들이 화났을 때 피부가 더 어두워졌다고 함. 관찰한 문어는 10마리(2번), 던지는 것은 우연이 아니라 고의(4번), 한 마리가 다리를 들자 다른 한 마리도 같은 동작을 함(9번)이라 나머지는 모두 다름.","c":1},"h":"0423dc7785"},{"n":9,"t":"sum","q":"Octopuses throw things to show that they are (A) or want to talk, which shows that octopuses are (B) animals.","ko":"문어들은 자신들이 (A) 또는 이야기하고 싶다는 것을 보여 주려고 물건을 던지며, 이는 문어가 (B) 동물임을 보여 준다.","oko":["(A) 행복하다 / (B) 사회적인","(A) 화났다 / (B) 수줍은","(A) 화났다 / (B) 사회적인","(A) 피곤하다 / (B) 무례한","(A) 겁난다 / (B) 호기심 많은"],"opts":["(A) happy / (B) social","(A) mad / (B) shy","(A) mad / (B) social","(A) tired / (B) rude","(A) scared / (B) curious"],"r":{"a":"3) (A) mad / (B) social","ev":"10번, 12번 문장","s":[[10,"By throwing things, octopuses could show that they’re mad or they just want to talk to others.","물건을 던짐으로써, 문어들은 자신들이 화가 났거나 다른 문어들과 이야기하고 싶어 한다는 것을 보여 줄 수 있었다."],[12,"This behavior shows that octopuses are social animals.","이 행동은 문어가 사회적인 동물이라는 것을 보여 준다."]],"w":"10번에서 문어들이 물건을 던져 자신들이 mad(화났다)거나 다른 문어들과 이야기하고 싶다는 것을 보여 줄 수 있었고, 12번에서 이 행동이 문어가 social(사회적인) 동물임을 보여 준다고 함. 행복하거나 피곤하다는 말은 나오지 않고, shy나 rude는 본문과 맞지 않음.","c":3},"h":"a5abd367ff"},{"n":10,"t":"fill","q":"When the octopuses were angry, their skin turned [A], and the more their skin changed, the [B] they threw.","ko":"문어들이 화났을 때 그것들의 피부는 [A] 변했고, 피부가 변할수록 그것들은 더 [B] 던졌다.","bko":{"darker":"더 어두운","better":"더 잘","lighter":"더 밝은","worse":"더 못","bigger":"더 큰","softer":"더 부드러운"},"bank":["darker","better","lighter","worse","bigger","softer"],"r":{"a":"[A] darker, [B] better","ev":"6~7번 문장","s":[[6,"When the octopuses were angry, their skin turned darker.","문어들이 화났을 때, 그것들의 피부는 더 어두워졌다."],[7,"The darker their skin became, the better they threw.","그것들의 피부가 어두워질수록, 그것들은 더 잘 던졌다."]],"w":"6번에서 문어들이 화났을 때 피부가 더 어두워졌고(darker), 7번에서 피부가 어두워질수록 더 잘(better) 던졌다고 함. lighter(더 밝은)는 6번과 반대이고, worse(더 못)는 7번과 반대. bigger(더 큰)와 softer(더 부드러운)는 본문에 나오지 않는 말.","c":null},"h":"d527453837"}]}];

var LAB={tf:"T / F",vocab:"어휘",ref:"지칭",sense:"문장 이해",match:"내용 일치",sum:"요약문 (A)(B)",fill:"요약문 완성"};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function units(){var u=document.getElementById("units");u.innerHTML="";UNITS.forEach(function(i){var b=el("button","ub","Chapter "+i);b.setAttribute("aria-pressed",String(i===unit));b.onclick=function(){unit=i;cur=null;units();tabs();view()};u.appendChild(b)})}
function list(){return P.filter(function(p){return p.u===unit})}
function tabs(){var t=document.getElementById("tabs");t.innerHTML="";var l=list();if(!cur)cur=l[0].id;l.forEach(function(p){var b=el("button","tab");b.setAttribute("role","tab");b.setAttribute("aria-selected",String(p.id===cur));b.innerHTML="<b>Reading "+p.no+"</b><span>"+esc(p.ko)+"</span>";b.onclick=function(){cur=p.id;tabs();view();document.getElementById("view").scrollIntoView({block:"start"})};t.appendChild(b)})}
function pr(){return P.filter(function(p){return p.id===cur})[0]}
function answered(p,it){var a=(ans[p.id]||{})[it.n];if(it.t==="fill")return a&&a[0]&&a[1];return a!=null&&a!==""}
function setAns(p,it,v){ans[p.id]=ans[p.id]||{};ans[p.id][it.n]=v}
function view(){var p=pr(),v=document.getElementById("view");v.innerHTML="";var fin=!!done[p.id];
 if(fin){var d0=done[p.id],pass=d0.s*10>=70,wr0=p.items.filter(function(it){return !d0.ok[it.n]}).map(function(it){return it.n});var bn=el("div","banner "+(pass?"pass":"fail"));bn.id="bn";bn.appendChild(el("span","vd",pass?"PASS":"FAIL"));bn.appendChild(el("span","sc",(d0.s*10)+"점 ("+d0.s+" / 10)"));bn.appendChild(el("span","wr",wr0.length?"틀린 문항: "+wr0.join(", ")+"번":"전 문항 정답"));bn.appendChild(el("span","rule",pass?"70점 이상 통과":"70점 미만: 클래스카드 추가학습을 하세요."));v.appendChild(bn)}
 var box=el("div",fin?"locked":"");
 p.items.forEach(function(it){
  var q=el("section","q");var h=el("div","qh");h.appendChild(el("span","qn",it.n));h.appendChild(el("span",null,LAB[it.t]));var okm=fin?done[p.id].ok[it.n]:null;if(fin){h.appendChild(el("span","mk "+(okm?"o1":"x1"),okm?"O":"X"));if(!okm)q.className+=" wrong"}q.appendChild(h);
  var qt=el("p","qt");
  if(it.t==="fill"){var parts=it.q.split(/(\[A\]|\[B\])/);parts.forEach(function(s){if(s==="[A]"||s==="[B]"){var k=s==="[A]"?0:1;var sel=el("select");var o0=el("option",null,s);o0.value="";sel.appendChild(o0);it.bank.forEach(function(w){var o=el("option",null,w);o.value=w;sel.appendChild(o)});var cu=(ans[p.id]||{})[it.n];if(cu&&cu[k])sel.value=cu[k];sel.onchange=function(){var c=((ans[p.id]||{})[it.n]||["",""]).slice();c[k]=sel.value;setAns(p,it,c);foot()};qt.appendChild(sel)}else qt.appendChild(document.createTextNode(s))});q.appendChild(qt)}
  else{if(it.t==="vocab"&&it.word){qt.innerHTML=esc(it.q).replace(esc(it.word),"<b>"+esc(it.word)+"</b>")}else qt.textContent=it.q;q.appendChild(qt)}
  if(it.t==="tf"){var g=el("div","tf");["T","F"].forEach(function(x){var b=el("button","o",x);b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===x));b.onclick=function(){setAns(p,it,x);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.opts){var g=el("div","opts");it.opts.forEach(function(t,i){var b=el("button","o");b.innerHTML="<i>"+(i+1)+"</i><span></span>";b.lastChild.textContent=t;b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===i+1));b.onclick=function(){setAns(p,it,i+1);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.t==="fill"){q.appendChild(el("p","bank","보기: "+it.bank.join(" / ")))}
  if(fin){var pk=(ans[p.id]||{})[it.n];if(it.t==="tf"){Array.prototype.forEach.call(q.querySelector(".tf").children,function(b){var v=b.textContent;if(v===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(v===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}else if(it.opts){Array.prototype.forEach.call(q.querySelector(".opts").children,function(b,i){if(i+1===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(i+1===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}}
  if(fin&&it.r){var rv=el("div","rv");
   var z1=el("div","zone z-tr");z1.appendChild(el("h4",null,"한글 해석"));
   function ln(l,t){var p2=el("p","ln");p2.appendChild(el("b",null,l));p2.appendChild(document.createTextNode(t));z1.appendChild(p2)}
   if(it.ko)ln("문제",it.ko);if(it.sko)ln("문장",it.sko);
   if(it.oko){var ol=el("ol");it.oko.forEach(function(x){ol.appendChild(el("li",null,x))});var lb=el("p","ln");lb.appendChild(el("b",null,"선택지"));z1.appendChild(lb);z1.appendChild(ol)}
   if(it.bko){var bl=el("p","ln");bl.appendChild(el("b",null,"보기 단어"));bl.appendChild(document.createTextNode(it.bank.map(function(w){return w+" "+(it.bko[w]||"")}).join(" / ")));z1.appendChild(bl)}
   if(z1.children.length>1)rv.appendChild(z1);
   var z2=el("div","zone z-an");z2.appendChild(el("h4",null,"정답 · 해설"));z2.appendChild(el("p","ra","정답: "+it.r.a));z2.appendChild(el("div","rl","교재 근거 ("+it.r.ev+")"));it.r.s.forEach(function(x){var d=el("div","rs");var e=el("span","en");e.appendChild(el("span","sn",x[0]+"번"));e.appendChild(document.createTextNode(x[1]));d.appendChild(e);d.appendChild(el("span","ko",x[2]));z2.appendChild(d)});z2.appendChild(el("div","rl","정리"));z2.appendChild(el("p","rw",it.r.w));rv.appendChild(z2);if(okm){rv.style.display="none";var tg=el("button","tgl","해설 보기");tg.onclick=function(){var s=rv.style.display==="none";rv.style.display=s?"block":"none";tg.textContent=s?"해설 닫기":"해설 보기"};q.appendChild(tg)}q.appendChild(rv)}
  box.appendChild(q)});
 v.appendChild(box);
 var sb=el("div","sbar");sb.id="sbar";v.appendChild(sb);foot();
 if(fin)showScore(p)}
function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
function showScore(p){var sb=document.getElementById("sbar");sb.innerHTML="";var d=done[p.id];var c=el("div","score");c.appendChild(el("span",null,"Reading "+p.no+" 점수"));c.appendChild(el("b",null,(d.s*10)+"점"));c.appendChild(el("span",null,d.s+" / 10 문항"));sb.style.display="block";sb.appendChild(c);var rb=el("button","rs-btn","처음부터 다시 (다음 학생)");var armed=false;rb.onclick=function(){if(!armed){armed=true;rb.textContent="한 번 더 누르면 모든 Reading 기록이 지워집니다";rb.className+=" arm";return}ans={};done={};unit=UNITS[0];cur=null;units();tabs();view();window.scrollTo(0,0)};sb.appendChild(rb)}
units();tabs();view();
</script>
