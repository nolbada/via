<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 스타터 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.gl{margin:2px 0 10px;color:var(--muted);font-size:14px}.gl2{color:var(--muted);font-weight:400;font-size:.92em}.sq{margin:0 0 2px;font-size:16px}.sq u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}.rw{margin:6px 0;font-weight:700}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>
</head>

<script>
var P=[{"u":1,"id":"hs2-01-1","no":1,"ko":"오늘의 날씨는요~","items":[{"n":1,"t":"tf","q":"A closed pine cone means that it is going to rain soon.","ko":"닫힌 솔방울은 곧 비가 올 것이라는 것을 의미한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"If a pine cone is closed tight, it is going to rain soon.","만약 솔방울이 단단히 닫혀있다면, 곧 비가 올 것이다."]],"w":"6번 문장에서 솔방울이 단단히 닫혀 있으면 곧 비가 올 것이라고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"7471bf6cf3"},{"n":2,"t":"tf","q":"Pine cones open in the rain to spread their seeds.","ko":"솔방울은 씨앗을 퍼뜨리기 위해 비 오는 날에 열린다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"In dry weather, they open to spread their seeds.","건조한 날씨에는, 그것들은 씨앗들을 퍼뜨리기 위해 열린다."]],"w":"8번 문장에서 솔방울이 씨앗을 퍼뜨리려고 여는 때는 건조한 날씨(dry weather)예요. 비 오는 날이라는 말은 반대예요.","c":"F"},"h":"8f7c1768c4"},{"n":3,"t":"tf","q":"The wind carries the seeds of pine cones far away.","ko":"바람이 솔방울의 씨앗을 멀리 운반한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"The seeds are carried far away by the wind and set on the ground.","씨앗들은 바람에 의해 멀리 운반되어 땅에 놓인다."]],"w":"9번 문장에서 씨앗들은 바람에 의해 멀리 운반된다(carried far away by the wind)고 해요. 본문과 맞아요.","c":"T"},"h":"d014a944c5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Pine cones close to protect the seeds from getting wet.)","ko":"솔방울은 씨앗이 젖는 것으로부터 protect하기 위해 닫힌다.","opts":["퍼뜨리다","모으다","보호하다","씻다"],"word":"protect","r":{"a":"3) 보호하다","ev":"11번 문장","s":[[11,"When it is about to rain, pine cones close to protect the seeds from getting wet.","막 비가 오려고 할 때, 솔방울은 씨앗들을 젖는 것으로부터 보호하기 위해 닫힌다."]],"w":"비가 오려고 할 때 솔방울이 닫혀서 씨앗이 젖지 않게 해요. 그러니 protect는 '보호하다'예요.","c":3},"h":"6311fc4336"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Pine cones are nature’s weather forecasters!)","ko":"솔방울은 자연의 weather forecasters이다!","opts":["예보관","요리사","농부","경찰"],"word":"forecasters","r":{"a":"1) 예보관","ev":"2번 문장","s":[[2,"Pine cones are nature’s weather forecasters!","솔방울은 자연의 일기 예보관이다!"]],"w":"솔방울이 열리고 닫히는 모습으로 앞으로의 날씨를 알려 주니까 forecaster는 '예보관'이에요.","c":1},"h":"5df0354fd4"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt means the weather will be sunny and dry.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 날씨가 화창하고 건조할 것이라는 것을 의미한다.","opts":["열린 솔방울","뉴스","닫힌 솔방울","바람"],"r":{"a":"1) 열린 솔방울","ev":"4~5번 문장","s":[[4,"You see an open pine cone.","당신은 열린 솔방울을 본다."],[5,"It means the weather will be sunny and dry.","그것은 날씨가 화창하고 건조할 것이라는 것을 의미한다."]],"c":1,"k":"It = 열린 솔방울"},"h":"b0b0b8fdbe","pron":"It"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The next time you see a pine cone, check it for a weather report!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다음에 당신이 솔방울을 본다면, 일기 예보를 (얻기) 위해 그것을 확인해라!","opts":["솔방울을 볼 때마다 뉴스를 켜 보아라.","솔방울을 보면 땅에 심어 보아라.","솔방울이 닫혀 있으면 확인하지 말아라.","다음에 솔방울을 보면, 그것으로 날씨를 확인해 보아라."],"r":{"a":"4) 다음에 솔방울을 보면, 그것으로 날씨를 확인해 보아라.","ev":"12번 문장","s":[[12,"The next time you see a pine cone, check it for a weather report!","다음에 당신이 솔방울을 본다면, 일기 예보를 (얻기) 위해 그것을 확인해라!"]],"c":4},"h":"935cc61a9c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["솔방울은 비 오는 날에 씨앗을 퍼뜨린다.","건조한 날씨에 씨앗은 솔방울 안에 그대로 머문다.","솔방울은 비가 오려고 할 때 씨앗이 젖지 않도록 보호한다.","단단히 닫힌 솔방울은 날씨가 화창할 것이라는 뜻이다."],"opts":["Pine cones spread their seeds on rainy days.","The seeds stay inside the pine cone in dry weather.","Pine cones protect their seeds from getting wet when it is about to rain.","A tightly shut pine cone means the weather will be sunny."],"r":{"a":"3) Pine cones protect their seeds from getting wet when it is about to rain. (솔방울은 비가 오려고 할 때 씨앗이 젖지 않도록 보호한다.)","ev":"11번 문장","s":[[11,"When it is about to rain, pine cones close to protect the seeds from getting wet.","막 비가 오려고 할 때, 솔방울은 씨앗들을 젖는 것으로부터 보호하기 위해 닫힌다."]],"c":3},"h":"dc0f19f443"},{"n":9,"t":"sum","q":"Pine cones (A) in dry weather to spread their seeds, and they (B) when it is about to rain to protect the seeds.","ko":"솔방울은 건조한 날씨에는 씨앗을 퍼뜨리기 위해 (A), 비가 오려고 할 때는 씨앗을 보호하기 위해 (B).","oko":["A 닫힌다 / B 열린다","A 닫힌다 / B 닫힌다","A 열린다 / B 열린다","A 떨어진다 / B 닫힌다","A 열린다 / B 닫힌다"],"opts":["(A) close / (B) open","(A) close / (B) close","(A) open / (B) open","(A) fall / (B) close","(A) open / (B) close"],"r":{"a":"5) (A) open / (B) close (A 열린다 / B 닫힌다)","ev":"8번, 11번 문장","s":[[8,"In dry weather, they open to spread their seeds.","건조한 날씨에는, 그것들은 씨앗들을 퍼뜨리기 위해 열린다."],[11,"When it is about to rain, pine cones close to protect the seeds from getting wet.","막 비가 오려고 할 때, 솔방울은 씨앗들을 젖는 것으로부터 보호하기 위해 닫힌다."]],"c":5},"h":"c2e7f4eb1e"},{"n":10,"t":"fill","q":"The seeds are [A] far away by the wind and set on the ground. They [B] into new trees.","ko":"씨앗들은 바람에 의해 멀리 [A] 땅에 놓인다. 그것들은 새로운 나무로 [B].","bank":["carried","grow","protect","open","wet","soon"],"bko":{"carried":"운반되어","grow":"자란다","protect":"보호하다","open":"열리다","wet":"젖은","soon":"곧"},"r":{"a":"[A] carried (운반되어), [B] grow (자란다)","ev":"9~10번 문장","s":[[9,"The seeds are carried far away by the wind and set on the ground.","씨앗들은 바람에 의해 멀리 운반되어 땅에 놓인다."],[10,"They grow into new trees.","그것들은 새로운 나무로 자란다."]],"c":null},"h":"2651bb4211"}]},{"u":1,"id":"hs2-01-2","no":2,"ko":"세상에 이런 파이가?","items":[{"n":1,"t":"tf","q":"Because of the snow, people could not travel.","ko":"눈 때문에 사람들은 이동할 수 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The snow made travel impossible.","눈은 이동을 불가능하게 만들었다."]],"w":"5번 문장에서 눈이 이동을 불가능하게 만들었다(The snow made travel impossible)고 해요. 본문과 맞아요.","c":"T"},"h":"80ac9b3a0b"},{"n":2,"t":"tf","q":"The fisherman returned from the sea with only one type of fish.","ko":"어부는 오직 한 종류의 생선만 가지고 바다에서 돌아왔다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Luckily, a brave fisherman went out to sea and returned with seven types of fish!","운 좋게도, 한 용감한 어부가 바다로 나가서 일곱 종류의 생선을 가지고 돌아왔다!"]],"w":"7번 문장에서 어부는 일곱 종류의 생선(seven types of fish)을 가지고 돌아왔어요. 한 종류라는 말은 틀려요.","c":"F"},"h":"5b0c4bfbda"},{"n":3,"t":"tf","q":"Most people think pies are sweet desserts.","ko":"대부분의 사람들은 파이가 달콤한 디저트라고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Most people think pies are sweet desse 3,"s":[[7,"They also noticed a planet that was red.","그들은 또한 붉은 색인 행성을 알아차렸어요."]]},"h":"99cab8bdcf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Isn’t it the perfect name?)","ko":"perfect한 이름 아닌가요?","opts":["어려운","완벽한","오래된","위험한"],"word":"perfect","r":{"a":"2) 완벽한","ev":"13번 문장","w":"12번에서 지구라는 이름이 '땅'을 뜻하는 단어에서 왔다고 했어요. 그래서 13번에서 '딱 맞는, 완벽한 이름 아닌가요?'라고 물어요. perfect = 완벽한.","c":2,"s":[[13,"Isn’t it the perfect name?","완벽한 이름 아닌가요?"]]},"h":"289ce0fd8e"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nFor example, they saw one planet move very fast.","ko":"밑줄 친 they가 가리키는 것은?","sko":"예를 들어, 그들은 한 행성이 매우 빠르게 움직이는 것을 보았어요.","opts":["행성들","고대 로마인들","질문한 학생","과학자들"],"r":{"c":2,"ev":"4~5번 문장","s":[[4,"The ancient Romans named many planets after their gods.","고대 로마인들은 그들의 신들의 이름을 따서 많은 행성의 이름을 지었어요."],[5,"For example, they saw one planet move very fast.","예를 들어, 그들은 한 행성이 매우 빠르게 움직이는 것을 보았어요."]],"k":"they = 고대 로마인들","a":"2) 고대 로마인들"},"pron":"they","h":"f74e5ce0c1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They thought red, the color of blood, was the color of this god.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 피의 색인 붉은색이 이 신의 색이라고 생각했죠.","opts":["그들은 피가 붉은 이유가 신 때문이라고 생각했다.","그들은 속도의 신이 붉은색을 싫어한다고 생각했다.","그들은 붉은 행성이 피처럼 뜨겁다고 생각했다.","그들은 피의 색인 붉은색이 전쟁의 신의 색이라고 생각했다."],"r":{"a":"4) 그들은 피의 색인 붉은색이 전쟁의 신의 색이라고 생각했다.","ev":"8~9번 문장","c":4,"s":[[8,"So they used the name of the god of war, Mars.","그래서 그들은 전쟁의 신 Mars의 이름을 사용했어요."],[9,"They thought red, the color of blood, was the color of this god.","그들은 피의 색인 붉은색이 이 신의 색이라고 생각했죠."]]},"h":"7604de9ee2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["로마인들은 지구에 신의 이름을 붙였다.","붉은 행성은 속도의 신의 이름을 따서 지어졌다.","Earth의 이름은 라틴어 단어에서 왔다.","붉은 행성은 전쟁의 신의 이름을 딴 것이다."],"opts":["The Romans named Earth after a god.","The red planet was named after the god of speed.","The name Earth came from a Latin word.","The red planet was named after the god of war."],"r":{"a":"4) The red planet was named after the god of war. (붉은 행성은 전쟁의 신의 이름을 딴 것이다.)","ev":"7~8번 문장","s":[[7,"They also noticed a planet that was red.","그들은 또한 붉은 색인 행성을 알아차렸어요."],[8,"So they used the name of the god of war, Mars.","그래서 그들은 전쟁의 신 Mars의 이름을 사용했어요."]],"c":4},"h":"60c7eba5e6"},{"n":9,"t":"sum","q":"The Romans named the fast planet (A) and the red planet (B).","ko":"로마인들은 빠른 행성에 (A)(이)라는 이름을, 붉은 행성에 (B)(이)라는 이름을 붙였다.","oko":["A Mars / B Mercury","A Earth / B Mars","A Mercury / B Earth","A Earth / B Mercury","A Mercury / B Mars"],"opts":["(A) Mars / (B) Mercury","(A) Earth / (B) Mars","(A) Mercury / (B) Earth","(A) Earth / (B) Mercury","(A) Mercury / (B) Mars"],"r":{"a":"5) (A) Mercury / (B) Mars (A Mercury / B Mars)","ev":"5~8번 문장","s":[[5,"For example, they saw one planet move very fast.","예를 들어, 그들은 한 행성이 매우 빠르게 움직이는 것을 보았어요."],[6,"They named it after the god of speed, Mercury.","그들은 속도의 신 Mercury의 이름을 따서 그것의 이름을 지었어요."],[7,"They also noticed a planet that was red.","그들은 또한 붉은 색인 행성을 알아차렸어요."],[8,"So they used the name of the god of war, Mars.","그래서 그들은 전쟁의 신 Mars의 이름을 사용했어요."]],"c":5},"h":"d859717392"},{"n":10,"t":"fill","q":"That’s a [A] [B]!","ko":"그거 [A] [B]이네요!","bank":["good","question","came","saw","noticed","how"],"bko":{"good":"좋은","question":"질문","came":"왔다","saw":"보았다","noticed":"알아차렸다","how":"어떻게"},"r":{"a":"[A] good (좋은), [B] question (질문)","ev":"3번 문장","s":[[3,"That’s a good question!","그거 좋은 질문이네요!"]],"c":null},"h":"f731f3a941"}]},{"u":2,"id":"hs2-02-2","no":2,"ko":"‘구글’해 봐!","items":[{"n":1,"t":"tf","q":"Verbing means using a noun as a verb.","ko":"verbing은 명사를 동사로 사용하는 것을 뜻한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에 verbing: using a noun as a verb라고 있어요. 콜론(:) 뒤가 verbing의 뜻이에요.","c":"T","s":[[2,"This is an example of verbing: using a noun as a verb.","이것은 명사를 동사로 사용하는 동사화의 예시이다."]]},"h":"f220dbd5e0"},{"n":2,"t":"tf","q":"Gift, text, and friend were first used as verbs.","ko":"gift, text, friend는 처음에 동사로 사용되었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","w":"5번 문장에서 gift, text, friend는 원래 명사로만 사용되었다(originally used only as nouns)고 해요. 처음에 동사였다는 말은 반대예요.","c":"F","s":[[5,"For instance, gift, text, and friend were originally used only as nouns.","예를 들어, ‘gift’, ‘text’, 그리고 ‘friend’는 원래 명사로만 사용되었었다."]]},"h":"0f783695f6"},{"n":3,"t":"tf","q":"In English, it is very easy to turn a noun into a verb.","ko":"영어에서는 명사를 동사로 바꾸는 것이 매우 쉽다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","w":"9번 문장에 it is very easy to do in English가 있어요. it은 명사를 동사로 바꾸는 일이에요.","c":"T","s":[[9,"Also, it is very easy to do in English.","또한, 영어에서 그것은 매우 하기 쉽다."]]},"h":"20783bfa3f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Gift, text, and friend were originally used only as nouns.)","ko":"gift, text, friend는 originally 명사로만 사용되었다.","opts":["요즘","원래","가끔","곧바로"],"word":"originally","r":{"a":"2) 원래","ev":"5~6번 문장","w":"5번에서 '원래 명사로만 쓰였다'고 하고, 6번에서 But now(하지만 오늘날)로 지금은 동사로도 쓴다고 이어져요. originally = 원래, 처음에는.","c":2,"s":[[5,"For instance, gift, text, and friend were originally used only as nouns.","예를 들어, ‘gift’, ‘text’, 그리고 ‘friend’는 원래 명사로만 사용되었었다."],[6,"But now we use them as verbs, too.","하지만 오늘날 우리는 그것들을 동사로도 사용한다."]]},"h":"d4307f0d04"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It can make the meaning clearer.)","ko":"그것은 의미를 더 clear하게 만들 수 있다.","opts":["더 짧은","더 어려운","더 조용한","더 명확한"],"word":"clearer","r":{"a":"4) 더 명확한","ev":"8번 문장","w":"8번은 명사를 동사로 바꾸는 이유(7번의 대답)예요. 이유가 되려면 의미가 더 '명확해진다'는 뜻이어야 해요. clearer = 더 명확한.","c":4,"s":[[8,"It can make the meaning clearer.","그것은 의미를 더 명확하게 만들 수 있다."]]},"h":"4f446666c9"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIt often happens in English.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것은 영어에서 종종 발생한다.","opts":["영어라는 언어","구글 검색","명사를 동사로 사용하는 것","동사를 명사로 바꾸는 것"],"r":{"a":"3) 명사를 동사로 사용하는 것","ev":"2~3번 문장","c":3,"s":[[2,"This is an example of verbing: using a noun as a verb.","이것은 명사를 동사로 사용하는 동사화의 예시이다."],[3,"It often happens in English.","그것은 영어에서 종종 발생한다."]],"k":"it = 명사를 동사로 사용하는 것"},"h":"b7e98c6c10","pron":"it"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"All you have to do is put the noun in a verb position in the sentence.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 해야 하는 모든 것은 문장에서 명사를 동사 위치에 놓는 것이다.","opts":["명사를 문장의 동사 자리에 놓기만 하면 된다.","명사의 철자를 동사 모양으로 바꿔야 한다.","명사 앞에 동사를 하나 더 붙여야 한다.","문장에서 동사를 모두 없애야 한다."],"r":{"a":"1) 명사를 문장의 동사 자리에 놓기만 하면 된다.","ev":"10번 문장","c":1,"s":[[10,"All you have to do is put the noun in a verb position in the sentence.","당신이 해야 하는 모든 것은 문장에서 명사를 동사 위치에 놓는 것이다."]]},"h":"8c52c7060e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["gift, text, friend는 오늘날에도 명사로만 사용된다.","영어에서 동사화는 거의 일어나지 않는다.","영어는 변하지 않는 언어이다.","많은 동사가 명사로 시작되었다."],"opts":["Gift, text, and friend are used only as nouns today.","Verbing rarely happens in English.","The English language does not change.","Many verbs began as nouns."],"r":{"a":"4) Many verbs began as nouns. (많은 동사가 명사로 시작되었다.)","ev":"4번 문장","s":[[4,"In fact, many verbs began as nouns.","사실, 많은 동사가 명사로 시작되었다."]],"c":4},"h":"0e5ab8e885"},{"n":9,"t":"sum","q":"Turning a noun into a verb can make the meaning (A), and it is very (B) to do in English.","ko":"명사를 동사로 바꾸면 의미를 (A) 만들 수 있고, 영어에서 그것은 하기 매우 (B).","oko":["A 더 어렵게 / B 어렵다","A 더 명확하게 / B 어렵다","A 더 어렵게 / B 쉽다","A 더 짧게 / B 쉽다","A 더 명확하게 / B 쉽다"],"opts":["(A) harder / (B) hard","(A) clearer / (B) hard","(A) harder / (B) easy","(A) shorter / (B) easy","(A) clearer / (B) easy"],"r":{"a":"5) (A) clearer / (B) easy (A 더 명확하게 / B 쉽다)","ev":"8~9번 문장","s":[[8,"It can make the meaning clearer.","그것은 의미를 더 명확하게 만들 수 있다."],[9,"Also, it is very easy to do in English.","또한, 영어에서 그것은 매우 하기 쉽다."]],"c":5},"h":"2209df5118"},{"n":10,"t":"fill","q":"More nouns will become verbs in the [A]. The English language [B] changing!","ko":"더 많은 명사가 [A]에 동사가 될 것이다. 영어는 변화하기를 [B]!","bank":["future","keeps","gift","text","friend","Google"],"bko":{"future":"미래","keeps":"계속한다","gift":"선물","text":"문자 메시지","friend":"친구","Google":"구글"},"r":{"a":"[A] future (미래), [B] keeps (계속한다)","ev":"11~12번 문장","s":[[11,"More nouns will become verbs in the future.","미래에는 더 많은 명사가 동사가 될 것이다."],[12,"The English language keeps changing!","영어는 계속해서 변화한다!"]],"c":null},"h":"62448e8dff"}]},{"u":2,"id":"hs2-02-3","no":3,"ko":"물방울무늬를 좋아하시나요?","items":[{"n":1,"t":"tf","q":"Most people did not like polka dots in the 1700s.","ko":"1700년대에 대부분의 사람들은 물방울무늬를 좋아하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","w":"4번 문장에 In the 1700s, most people did not like polka dots.가 있어요. 그대로 맞는 내용이에요.","c":"T","s":[[4,"In the 1700s, most people did not like polka dots.","1700년대에, 대부분의 사람들은 물방울무늬를 좋아하지 않았다."]]},"h":"83bcf9e365"},{"n":2,"t":"tf","q":"The pattern became popular in Asia in the 1800s.","ko":"그 무늬는 1800년대에 아시아에서 인기 있어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","w":"6번 문장에서 1800년대에 유럽(Europe)에서 인기 있어졌다고 해요. 아시아라는 말은 본문에 없어요.","c":"F","s":[[6,"In the 1800s, the pattern became popular in Europe.","1800년대에, 그 무늬는 유럽에서 인기를 얻게 되었다."]]},"h":"948c6e335a"},{"n":3,"t":"tf","q":"Sewing machines could create perfect circles.","ko":"재봉틀은 완벽한 원을 만들어 낼 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10~11번 문장","w":"10번에서 재봉틀이 발명되었다고 하고, 11번에서 They(재봉틀)는 완벽한 원을 만들어 낼 수 있었다고 해요.","c":"T","s":[[10,"Also, sewing machines were invented during this period.","또한, 이 시기 동안 재봉틀이 발명되었다."],[11,"They could create perfect circles.","그것들은 완벽한 원을 만들어 낼 수 있었다."]]},"h":"57ef1d04e1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (People thought the pattern matched the lively energy of the dance.)","ko":"사람들은 그 무늬가 그 춤의 lively한 기운과 어울린다고 생각했다.","opts":["조용한","느린","활기찬","어두운"],"word":"lively","r":{"a":"3) 활기찬","ev":"8번 문장","w":"8번은 무늬가 춤의 기운과 어울린다는 말이에요. 춤의 기운과 어울린다고 했으니 '활기찬'이 알맞아요. lively = 활기찬.","c":3,"s":[[8,"People thought the pattern matched the lively energy of the dance.","사람들은 그 무늬가 그 춤의 활기찬 기운과 어울린다고 생각했다."]]},"h":"29717b1d44"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, sewing machines were invented during this period.)","ko":"또한, 이 시기 동안 재봉틀이 invent되었다.","opts":["팔렸다","수리되었다","사라졌다","발명되었다"],"word":"invented","r":{"a":"4) 발명되었다","ev":"10번 문장","w":"10번은 1800년대에 재봉틀이 생겼다는 말이에요. 이어지는 11번에서 재봉틀이 완벽한 원을 만들어 낼 수 있었다고 하니, '발명되었다'가 알맞아요. be invented = 발명되다.","c":4,"s":[[10,"Also, sewing machines were invented during this period.","또한, 이 시기 동안 재봉틀이 발명되었다."]]},"h":"7de8431b70"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSpots made them think of diseases like smallpox.","ko":"밑줄 친 them이 가리키는 것은?","sko":"점들은 그들로 하여금 천연두와 같은 질병들을 떠올리게 했다.","opts":["물방울무늬들","대부분의 사람들","질병들","재봉틀들"],"r":{"a":"2) 대부분의 사람들","ev":"4~5번 문장","s":[[4,"In the 1700s, most people did not like polka dots.","1700년대에, 대부분의 사람들은 물방울무늬를 좋아하지 않았다."],[5,"Spots made them think of diseases like smallpox.","점들은 그들로 하여금 천연두와 같은 질병들을 떠올리게 했다."]],"c":2,"k":"them = 대부분의 사람들"},"pron":"them","h":"12302548cd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"People thought the pattern matched the lively energy of the dance.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사람들은 그 무늬가 그 춤의 활기찬 기운과 어울린다고 생각했다.","opts":["사람들은 그 무늬가 춤의 활기찬 분위기와 잘 어울린다고 생각했다.","사람들은 그 무늬가 춤을 추기 어렵게 만든다고 생각했다.","사람들은 그 무늬가 춤과 아무 관계가 없다고 생각했다.","사람들은 그 무늬가 조용하고 슬픈 분위기와 어울린다고 생각했다."],"r":{"a":"1) 사람들은 그 무늬가 춤의 활기찬 분위기와 잘 어울린다고 생각했다.","ev":"8번 문장","s":[[8,"People thought the pattern matched the lively energy of the dance.","사람들은 그 무늬가 그 춤의 활기찬 기운과 어울린다고 생각했다."]],"c":1},"h":"f3da49d0b4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["물방울무늬는 미니마우스의 드레스에 처음 나타났다.","물방울무늬는 오늘날 거의 볼 수 없다.","1800년대 사람들은 그 무늬가 춤과 어울리지 않는다고 생각했다.","polka dots라는 이름은 춤에서 유래했다."],"opts":["Polka dots first appeared on Minnie Mouse’s dress.","Polka dots are rarely seen today.","People in the 1800s thought the pattern did not match the dance.","The name polka dots came from the dance."],"r":{"a":"4) The name polka dots came from the dance. (polka dots라는 이름은 춤에서 유래했다.)","ev":"1번 문장, 3번 문장, 8~9번 문장","c":4,"s":[[1,"Today, polka dots are everywhere, from clothing to party decorations.","오늘날, 물방울무늬는 의류부터 파티 장식품들까지 어디에나 있다."],[3,"But the pattern wasn’t popular at first.","하지만 이 무늬는 처음에는 인기가 없었다."],[8,"People thought the pattern matched the lively energy of the dance.","사람들은 그 무늬가 그 춤의 활기찬 기운과 어울린다고 생각했다."],[9,"Even the name polka dots came from the dance.","물방울무늬라는 이름조차 그 춤에서 유래했다."]]},"h":"89aeb6672b"},{"n":9,"t":"sum","q":"Polka dots were (A) in the 1700s, but they became (B) in the 1800s.","ko":"물방울무늬는 1700년대에는 (A) 무늬였지만, 1800년대에는 (B) 무늬가 되었다.","oko":["A 인기 있는 / B 인기 있는","A 인기 없는 / B 인기 없는","A 인기 있는 / B 인기 없는","A 활기찬 / B 인기 있는","A 인기 없는 / B 인기 있는"],"opts":["(A) popular / (B) popular","(A) unpopular / (B) unpopular","(A) popular / (B) unpopular","(A) lively / (B) popular","(A) unpopular / (B) popular"],"r":{"a":"5) (A) unpopular / (B) popular (A 인기 없는 / B 인기 있는)","ev":"4번 문장, 6번 문장","c":5,"s":[[4,"In the 1700s, most people did not like polka dots.","1700년대에, 대부분의 사람들은 물방울무늬를 좋아하지 않았다."],[6,"In the 1800s, the pattern became popular in Europe.","1800년대에, 그 무늬는 유럽에서 인기를 얻게 되었다."]]},"h":"249edfbd03"},{"n":10,"t":"fill","q":"Today, polka dots are [A], from [B] to party decorations.","ko":"오늘날, 물방울무늬는 [A] 있다, [B]부터 파티 장식품들까지.","bank":["everywhere","clothing","think","create","came","like"],"bko":{"everywhere":"어디에나","clothing":"의류","think":"생각하다","create":"만들다","came":"왔다(come의 과거)","like":"좋아하다"},"r":{"a":"[A] everywhere (어디에나), [B] clothing (의류)","ev":"1번 문장","s":[[1,"Today, polka dots are everywhere, from clothing to party decorations.","오늘날, 물방울무늬는 의류부터 파티 장식품들까지 어디에나 있다."]],"c":null},"h":"699677f2b6"}]},{"u":3,"id":"hs2-03-1","no":1,"ko":"제가 대신 해보겠습니다","items":[{"n":1,"t":"tf","q":"The driver had heard Einstein’s lecture more than 30 times.","ko":"운전기사는 아인슈타인의 강의를 30번 이상 들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장에서 운전기사가 I have heard your lecture more than 30 times라고 말해요. 30번 이상 들었다는 내용과 일치해요.","c":"T","s":[[3,"“Professor Einstein, I have heard your lecture more than 30 times.","“아인슈타인 교수님, 저는 당신의 강의를 30번 이상 들어왔어요."]]},"h":"34c1e301ad"},{"n":2,"t":"tf","q":"Einstein put on the driver’s hat at the next university.","ko":"아인슈타인은 다음 대학에서 운전기사의 모자를 썼다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","w":"6번 문장에서 모자를 쓴 사람은 운전기사이고, 쓴 것도 아인슈타인의 모자예요. 주어와 모자 주인이 뒤바뀌었어요.","c":"F","s":[[6,"So at the next university, the driver put on Einstein’s hat as a disguise.","그래서 다음 대학에서, 운전기사는 아인슈타인의 모자를 변장 도구로 썼다."]]},"h":"5f8bc46380"},{"n":3,"t":"tf","q":"Einstein stood up and responded to the question at the end.","ko":"아인슈타인은 마지막에 일어서서 질문에 대답했다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","w":"13번 문장에 Einstein stood up and responded to the question이 그대로 나와요. 일치해요.","c":"T","s":[[13,"Then, Einstein stood up and responded to the question!","그러자, 아인슈타인이 일어서서 그 질문에 대답했다!"]]},"h":"34b30d483e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So at the next university, the driver put on Einstein’s hat as a disguise.)","ko":"그래서 다음 대학에서, 운전기사는 아인슈타인의 모자를 disguise로 썼다.","opts":["기념품","변장 도구","선물","명찰"],"word":"disguise","r":{"a":"2) 변장 도구","ev":"6번 문장","w":"운전기사가 아인슈타인처럼 보이려고 아인슈타인의 모자를 쓴 거예요. 그래서 disguise = 변장(도구)이에요.","c":2,"s":[[6,"So at the next university, the driver put on Einstein’s hat as a disguise.","그래서 다음 대학에서, 운전기사는 아인슈타인의 모자를 변장 도구로 썼다."]]},"h":"57867b62f9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (One day, his driver said something interesting.)","ko":"어느 날, 그의 운전기사가 interesting한 무언가를 말했다.","opts":["지루한","위험한","슬픈","흥미로운"],"word":"interesting","r":{"a":"4) 흥미로운","ev":"2번 문장","w":"운전기사가 '내가 강의할 수 있다'는 뜻밖의 말을 꺼내요(3~4번). 그래서 interesting = 흥미로운이에요.","c":4,"s":[[2,"One day, his driver said something interesting.","어느 날, 그의 운전기사가 흥미로운 무언가를 말했다."]]},"h":"d4a5db2fce"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nEinstein decided to let him try.","ko":"밑줄 친 him이 가리키는 것은?","sko":  leather to make shoes!","아디다스와 같은 유명한 브랜드들은 신발을 만들기 위해 이제 버섯 가죽을 사용하고 있다!"]]},"h":"151de1422a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (As they grow, the threads combine and naturally form a solid foam.)","ko":"그것들이 자라면서, 줄기들이 결합하고 solid한 거품을 자연적으로 형성한다.","opts":["투명한","견고한","차가운","얇은"],"word":"solid","r":{"a":"2) 견고한","ev":"6번 문장","w":"줄기들이 결합해서 만들어진 거품이 이어서 압축되어 직물이 돼요(7번). 그러니 solid foam은 단단한(견고한) 거품이에요.","c":2,"s":[[6,"As they grow, the threads combine and naturally form a solid foam.","그것들이 자라면서, 줄기들이 결합하고 견고한 거품을 자연적으로 형성한다."]]},"h":"105d6b2011"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, it is very soft and good for sensitive skin.)","ko":"또한, 그것은 매우 부드럽고 sensitive한 피부에 좋다.","opts":["튼튼한","건조한","가벼운","민감한"],"word":"sensitive","r":{"a":"4) 민감한","ev":"10번 문장","w":"very soft(매우 부드러운)와 함께 피부에 좋다고 하니 sensitive skin은 민감한 피부예요. 튼튼한(strong)과 가벼운(lightweight)은 9번에 나오는 다른 단어예요.","c":4,"s":[[10,"Also, it is very soft and good for sensitive skin.","또한, 그것은 매우 부드럽고 민감한 피부에 좋다."]]},"h":"a20c02a5a9"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAs they grow, the threads combine and naturally form a solid foam.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그것들이 자라면서, 줄기들이 결합하고 견고한 거품을 자연적으로 형성한다.","opts":["실험실","직물","균사체","버섯 가죽"],"r":{"a":"3) 균사체","ev":"5~6번 문장","c":3,"s":[[5,"To make leather, mycelia are grown in a lab.","가죽을 만들기 위해, 균사체는 실험실에서 재배된다."],[6,"As they grow, the threads combine and naturally form a solid foam.","그것들이 자라면서, 줄기들이 결합하고 견고한 거품을 자연적으로 형성한다."]],"k":"they = 균사체"},"h":"9bc179beff","pron":"they"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Mushrooms are not just used in delicious dishes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"버섯이 단지 맛있는 요리에만 사용되는 것은 아니다.","opts":["버섯은 맛있는 요리에만 쓰이는 것은 아니다.","버섯은 맛있는 요리에 전혀 쓰이지 않는다.","버섯은 요리에만 쓰여야 한다.","버섯은 요리에서 가장 맛있는 재료이다."],"r":{"a":"1) 버섯은 맛있는 요리에만 쓰이는 것은 아니다.","ev":"1번 문장","c":1,"s":[[1,"Mushrooms are not just used in delicious dishes.","버섯이 단지 맛있는 요리에만 사용되는 것은 아니다."]]},"h":"783f362eb9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["버섯 가죽은 주방에서 만들어진다.","거품은 저어져서 직물이 된다.","버섯 가죽은 무겁고 약하다.","균사체는 뿌리처럼 역할을 하는 버섯의 가는 줄기이다."],"opts":["Mushroom leather is made in a kitchen.","The foam is stirred to become a fabric.","Mushroom leather is heavy and weak.","Mycelia are thin threads that act like the roots of mushrooms."],"r":{"a":"4) Mycelia are thin threads that act like the roots of mushrooms. (균사체는 뿌리처럼 역할을 하는 버섯의 가는 줄기이다.)","ev":"4번 문장","c":4,"s":[[4,"Mycelia are thin threads on mushrooms that act like their roots.","균사체는 뿌리와 같은 역할을 하는 버섯의 가는 줄기이다."]]},"h":"7b923f2989"},{"n":9,"t":"sum","q":"Mushroom leather is (A) and strong. It is also very soft, so it is good for (B) skin.","ko":"버섯 가죽은 (A) 튼튼하다. 또한 매우 부드러워서 (B) 피부에 좋다.","oko":["A 무겁고 / B 민감한","A 가볍고 / B 민감한","A 가볍고 / B 건조한","A 무겁고 / B 건조한","A 비싸고 / B 민감한"],"opts":["(A) heavy / (B) sensitive","(A) lightweight / (B) sensitive","(A) lightweight / (B) dry","(A) heavy / (B) dry","(A) expensive / (B) sensitive"],"r":{"a":"2) (A) lightweight / (B) sensitive (A 가볍고 / B 민감한)","ev":"9~10번 문장","c":2,"s":[[9,"It is lightweight and strong.","그것은 가볍고 튼튼하다."],[10,"Also, it is very soft and good for sensitive skin.","또한, 그것은 매우 부드럽고 민감한 피부에 좋다."]]},"h":"81e40920b7"},{"n":10,"t":"fill","q":"This is because little [A] is used for its [B].","ko":"이는 그것의 [B]에 [A]이(가) 거의 사용되지 않기 때문이다.","bank":["water","production","grown","soft","strong","famous"],"bko":{"water":"물","production":"생산","grown":"자란","soft":"부드러운","strong":"튼튼한","famous":"유명한"},"r":{"a":"[A] water (물), [B] production (생산)","ev":"12번 문장","s":[[12,"This is because little water is used for its production.","이는 그것의 생산에 물이 거의 사용되지 않기 때문이다."]],"c":null},"h":"b4f3627f2d"}]},{"u":3,"id":"hs2-03-3","no":3,"ko":"아테나?! 아테네!","items":[{"n":1,"t":"tf","q":"The name of Athens came from a Greek myth.","ko":"아테네의 이름은 그리스 신화에서 유래했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장에서 It came from a Greek myth라고 해요. 도시의 이름이 신화에서 왔다는 내용과 일치해요.","c":"T","s":[[3,"It came from a Greek myth.","그것은 그리스 신화에서 유래했다."]]},"h":"716ded3dc3"},{"n":2,"t":"tf","q":"The water of Poseidon’s spring was sweet.","ko":"포세이돈의 샘물은 달콤했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","w":"8번 문장에서 샘의 물은 매우 짰다(very salty)고 해요. 달콤했다는 말은 반대예요.","c":"F","s":[[8,"But the water of the spring was very salty.","하지만 그 샘의 물은 매우 짰다."]]},"h":"8b97bb7f2c"},{"n":3,"t":"tf","q":"Many olive trees are found near Athens today.","ko":"오늘날 아테네 근처에서는 많은 올리브 나무가 발견된다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","w":"13번 문장에 Even today, many olive trees are found near Athens라고 그대로 나와요. 일치해요.","c":"T","s":[[13,"Even today, many olive trees are found near Athens.","오늘날에도, 많은 올리브 나무들이 아테네 근처에서 발견된다."]]},"h":"50def1d575"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They both wanted to be the guardian of the city.)","ko":"그들 둘 다 도시의 guardian이 되고 싶어 했다.","opts":["시민","수호자","여신","선물"],"word":"guardian","r":{"a":"2) 수호자","ev":"5번 문장","w":"아테나와 포세이돈 둘 다 되고 싶어 한 것이고, 뒤에서 선택된 아테나의 이름을 따라 도시 이름이 지어져요(12번). 그래서 guardian = 수호자예요.","c":2,"s":[[5,"They both wanted to be the guardian of the city.","그들 둘 다 도시의 수호자가 되고 싶어 했다."]]},"h":"57d0989cfa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But the water of the spring was very salty.)","ko":"하지만 그 샘의 물은 매우 salty했다.","opts":["단","매운","신","짠"],"word":"salty","r":{"a":"4) 짠","ev":"8~9번 문장","w":"물이 짜서 사람들이 마실 수 없었다는 흐름이에요(9번). 그래서 salty = 짠이에요.","c":4,"s":[[8,"But the water of the spring was very salty.","하지만 그 샘의 물은 매우 짰다."],[9,"People couldn’t drink it.","사람들은 그것을 마실 수 없었다."]]},"h":"1cd4c5b692"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey both wanted to be the guardian of the city.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들 둘 다 도시의 수호자가 되고 싶어 했다.","opts":["아테네 시민들","그리스 신화 속 사람들","아테나와 포세이돈","올리브 나무와 샘"],"r":{"c":3,"ev":"4~5번 문장","s":[[4,"Athena, the goddess of wisdom, fought with Poseidon, the god of the sea.","지혜의 여신 아테나는 바다의 신 포세이돈과 싸웠다."],[5,"They both wanted to be the guardian of the city.","그들 둘 다 도시의 수호자가 되고 싶어 했다."]],"k":"They = 아테나와 포세이돈","a":"3) 아테나와 포세이돈"},"pron":"They","h":"f875caf9c8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Athena was chosen as the guardian, and the city was named after her.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아테나는 수호자로 선택되었고, 그 도시는 그녀의 이름을 따서 이름 지어졌다.","opts":["아테나는 수호자로 선택되었고, 도시는 그녀의 이름을 따서 지어졌다.","아테나는 도시의 이름을 따서 수호자가 되었다.","아테나는 수호자를 선택했고, 도시에 이름을 주었다.","아테나는 수호자로 선택되었지만, 도시는 포세이돈의 이름을 따랐다."],"r":{"a":"1) 아테나는 수호자로 선택되었고, 도시는 그녀의 이름을 따서 지어졌다.","ev":"12번 문장","c":1,"s":[[12,"Athena was chosen as the guardian, and the city was named after her.","아테나는 수호자로 선택되었고, 그 도시는 그녀의 이름을 따서 이름 지어졌다."]]},"h":"f32c640da0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Poseidon was the god of wisdom.","The water of Poseidon’s spring was sweet.","Athens is the capital of Greece.","Athens is the capital of Italy."],"oko":["포세이돈은 지혜의 신이었다.","포세이돈의 샘물은 달콤했다.","아테네는 그리스의 수도이다.","아테네는 이탈리아의 수도이다."],"r":{"c":3,"ev":"1번 문장","s":[[1,"Athens is the capital of Greece.","아테네는 그리스의 수도이다."]],"a":"3) Athens is the capital of Greece. (아테네는 그리스의 수도이다.)"},"h":"d6e0fad3cf"},{"n":9,"t":"sum","q":"People couldn’t (A) the salty water of Poseidon’s spring. They (B) Athena’s olive tree because it gave them food and oil.","ko":"사람들은 포세이돈의 샘의 짠 물을 (A) 수 없었다. 그들은 음식과 기름을 주었기 때문에 아테나의 올리브 나무를 (B).","oko":["A 마실 / B 싫어했다","A 살 / B 좋아했다","A 찾을 / B 두려워했다","A 심을 / B 잊었다","A 마실 / B 좋아했다"],"opts":["(A) drink / (B) hated","(A) buy / (B) loved","(A) find / (B) feared","(A) plant / (B) forgot","(A) drink / (B) loved"],"r":{"a":"5) (A) drink / (B) loved (A 마실 / B 좋아했다)","ev":"8~11번 문장","c":5,"s":[[8,"But the water of the spring was very salty.","하지만 그 샘의 물은 매우 짰다."],[9,"People couldn’t drink it.","사람들은 그것을 마실 수 없었다."],[10,"On the other hand, Athena planted an olive tree.","반면에, 아테나는 올리브 나무를 심었다."],[11,"People loved the tree because it provided food and oil.","그것이 음식과 기름을 제공했기 때문에 사람들은 그 나무를 좋아했다."]]},"h":"2b0b44a742"},{"n":10,"t":"fill","q":"They tried to [A] the citizens with gifts, and Poseidon [B] a spring.","ko":"그들은 선물로 시민들의 마음을 [A] 위해 노력했고, 포세이돈은 샘을 [B].","bank":["attract","created","planted","drink","chosen","fought"],"bko":{"attract":"끌기","created":"만들어 냈다","planted":"심었다","drink":"마시다","chosen":"선택된","fought":"싸웠다"},"r":{"a":"[A] attract (끌기), [B] created (만들어 냈다)","ev":"6~7번 문장","c":null,"s":[[6,"So they tried to attract the citizens with gifts.","그래서 그들은 선물로 시민들의 마음을 끌기 위해 노력했다."],[7,"Poseidon created a spring.","포세이돈은 샘을 만들어 냈다."]]},"h":"72d202de56"}]},{"u":4,"id":"hs2-04-1","no":1,"ko":"종이와 가위만 있으면 돼!","items":[{"n":1,"t":"tf","q":"Henri Matisse was a great artist in the 20th century.","ko":"앙리 마티스는 20세기에 위대한 예술가였다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He was a great artist in the 20th century.","그는 20세기에 위대한 예술가였다."]],"w":"3번 문장에 He was a great artist in the 20th century.라고 그대로 나와요. 일치해요.","c":"T"},"h":"bdf26c6537"},{"n":2,"t":"tf","q":"Matisse could still go to the swimming pool when he made The Swimming Pool.","ko":"마티스는 <수영장>을 만들 때 아직 수영장에 갈 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Matisse wanted to make his own swimming pool with art because he couldn’t go to the swimming pool anymore.","마티스는 더 이상 수영장에 갈 수 없었기 때문에 예술로 그 자신만의 수영장을 만들고 싶어 했다."]],"w":"7번에서 마티스는 더 이상 수영장에 갈 수 없었기 때문에(he couldn’t go to the swimming pool anymore) 자기만의 수영장을 만들고 싶어 했어요. 갈 수 있었다는 말은 반대예요.","c":"F"},"h":"5b1e13d5cc"},{"n":3,"t":"tf","q":"Matisse began to cut color paper before he became weak.","ko":"마티스는 몸이 약해지기 전에 색종이를 자르기 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"When he got older, he became too weak to paint.","그가 더 나이가 들었을 때, 그는 그림을 그리기에 신체적으로 너무 약해졌다."],[5,"So he began to cut color paper and create shapes.","그래서 그는 색종이를 자르고 모양들을 만들기 시작했다."]],"w":"4번에서 몸이 너무 약해졌고, 5번에서 So(그래서) 색종이를 자르기 시작했어요. 약해진 뒤에 시작한 거라서 순서가 반대예요.","c":"F"},"h":"9a5d40ccc3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When he got older, he became too weak to paint.)","ko":"그가 더 나이가 들었을 때, 그는 그림을 그리기에 너무 weak해졌다.","opts":["유명한","신체적으로 약한","매우 바쁜","아주 젊은"],"word":"weak","r":{"a":"2) 신체적으로 약한","ev":"4번 문장","s":[[4,"When he got older, he became too weak to paint.","그가 더 나이가 들었을 때, 그는 그림을 그리기에 신체적으로 너무 약해졌다."]],"w":"4번은 나이가 들어 그림을 그리기에 너무 약해졌다는 문장이에요. weak는 몸에 힘이 없는 '약한'이에요.","c":2},"h":"6679093753"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (One of his famous cut-out works is The Swimming Pool.)","ko":"그의 famous한 잘라낸 작품들 중 하나는 <수영장>이다.","opts":["오래된","비싼","유명한","무서운"],"word":"famous","r":{"a":"3) 유명한","ev":"6번 문장","s":[[6,"One of his famous cut-out works is The Swimming Pool.","그의 유명한 잘라낸 작품들 중 하나는 <수영장>이다."]],"w":"6번은 마티스의 잘라낸 작품들 중 대표적인 하나로 <수영장>을 소개해요. 많은 사람이 아는 작품이라는 뜻의 famous는 '유명한'이에요.","c":3},"h":"3de3279b61"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThe people and animals look like they are swimming!","ko":"밑줄 친 they가 가리키는 것은?","sko":"그 사람들과 동물들은 마치 수영하고 있는 것처럼 보인다!","opts":["마티스와 친구들","그 사람들과 동물들","거실의 벽들","수영장의 학생들"],"r":{"a":"2) 그 사람들과 동물들","ev":"10번 문장","s":[[10,"The people and animals look like they are swimming!","그 사람들과 동물들은 마치 수영하고 있는 것처럼 보인다!"]],"c":2,"k":"they = 그 사람들과 동물들"},"h":"e1ac9b616f","pron":"they"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Matisse found a fun way to bring the pool to him!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마티스는 수영장을 그에게 가져올 재미있는 방법을 찾았다!","opts":["마티스는 수영장을 그에게 가져올 재미있는 방법을 찾았다.","마티스는 수영장에 빨리 가는 방법을 찾았다.","마티스는 친구들을 수영장으로 데려갈 방법을 찾았다.","마티스는 수영장을 다른 사람에게 팔 방법을 찾았다."],"r":{"a":"1) 마티스는 수영장을 그에게 가져올 재미있는 방법을 찾았다.","ev":"11번 문장","s":[[11,"Matisse found a fun way to bring the pool to him!","마티스는 수영장을 그에게 가져올 재미있는 방법을 찾았다!"]],"c":1},"h":"680eb4e746"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마티스는 나이가 들자 예술 활동을 멈췄다.","마티스는 종이 모 임은 가장 (A) 보드게임들 중 하나였고, 사람들은 그 게임이 미래를 (B) 수 있다고 생각했다.","oko":["A 새로운 / B 알려 줄","A 오래된 / B 숨길","A 작은 / B 바꿀","A 쉬운 / B 잊을","A 오래된 / B 알려 줄"],"opts":["(A) newest / (B) tell","(A) oldest / (B) hide","(A) smallest / (B) change","(A) easiest / (B) forget","(A) oldest / (B) tell"],"r":{"a":"5) (A) oldest / (B) tell (A 오래된 / B 알려 줄)","ev":"3번, 10번 문장","c":5,"s":[[3,"It is one of the oldest board games!","그것은 가장 오래된 보드게임들 중 하나이다!"],[10,"People thought the game told the future.","사람들은 그 게임이 미래를 알려 준다고 생각했다."]]},"h":"b2cb0652bc"},{"n":10,"t":"fill","q":"They [A] pyramid-shaped [B].","ko":"그들은 피라미드 모양의 [B]을(를) [A].","bank":["rolled","dice","future","fortune","meaning","entertainment"],"bko":{"rolled":"굴렸다","dice":"주사위","future":"미래","fortune":"운","meaning":"의미","entertainment":"오락"},"r":{"a":"[A] rolled (굴렸다), [B] dice (주사위)","ev":"6번 문장","s":[[6,"They rolled pyramid-shaped dice.","그들은 피라미드 모양의 주사위를 굴렸다."]],"c":null},"h":"deee894d9a"}]},{"u":6,"id":"hs2-06-2","no":2,"ko":"토마토는 억울해","items":[{"n":1,"t":"tf","q":"Wealthy Europeans in the 1700s got sick after eating tomatoes.","ko":"1700년대에 부유한 유럽인들은 토마토를 먹은 후 병에 걸렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장에 In the 1700s, wealthy Europeans got sick ... after eating tomatoes라고 나와요.","c":"T","s":[[3,"In the 1700s, wealthy Europeans got sick and sometimes died after eating tomatoes.","1700년대에, 부유한 유럽인들이 토마토를 먹은 후에 병에 걸리고 때때로 사망했다."]]},"h":"c36c26ab2c"},{"n":2,"t":"tf","q":"Today, tomatoes are known as a dangerous food.","ko":"오늘날 토마토는 위험한 음식으로 알려져 있다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","w":"1번 문장에서 오늘날 토마토는 슈퍼푸드(superfood)로 알려져 있다고 해요. 위험한 음식은 과거의 오해였어요.","c":"F","s":[[1,"Today, tomatoes are known as a superfood.","오늘날, 토마토는 슈퍼푸드로 알려져 있다."]]},"h":"f505c61f60"},{"n":3,"t":"tf","q":"People began eating pizza in Italy.","ko":"사람들은 이탈리아에서 피자를 먹기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","w":"11번 문장에 In Italy, people began eating pizza가 있어요.","c":"T","s":[[11,"In Italy, people began eating pizza, and they liked it!","이탈리아에서, 사람들은 피자를 먹기 시작했고, 그들은 그것을 좋아했다!"]]},"h":"18d7cd4dd6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They blamed the fruit!)","ko":"그들은 그 과일을 blame했다!","opts":["칭찬했다","탓했다","숨겼다","팔았다"],"word":"blamed","r":{"a":"2) 탓했다","ev":"3~4번 문장","w":"3번에서 토마토를 먹은 후 사람들이 병에 걸렸고, 4번에서 그 과일을 blame했어요. 5번에서 ‘토마토가 문제가 아니었다’고 하니 blame은 ‘탓하다’예요.","c":2,"s":[[3,"In the 1700s, wealthy Europeans got sick and sometimes died after eating tomatoes.","1700년대에, 부유한 유럽인들이 토마토를 먹은 후에 병에 걸리고 때때로 사망했다."],[4,"They blamed the fruit!","그들은 그 과일을 탓했다!"]]},"h":"754162ea47"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (they realized tomatoes weren’t dangerous)","ko":"그들은 토마토가 위험하지 않다는 것을 realize했다","opts":["잊었다","거절했다","걱정했다","깨달았다"],"word":"realized","r":{"a":"4) 깨달았다","ev":"10번 문장","w":"과학을 더 배우면서(As people learned more about science) 알게 된 것이므로 realize는 ‘깨닫다’예요.","c":4,"s":[[10,"As people learned more about science, they realized tomatoes weren’t dangerous.","사람들이 과학에 대해 더 많이 배우면서, 그들은 토마토가 위험하지 않다는 것을 깨달았다."]]},"h":"759ee8683a"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey blamed the fruit!","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 그 과일을 탓했다!","opts":["토마토들","접시들","부유한 유럽인들","과학자들"],"r":{"c":3,"ev":"3~4번 문장","s":[[3,"In the 1700s, wealthy Europeans got sick and sometimes died after eating tomatoes.","1700년대에, 부유한 유럽인들이 토마토를 먹은 후에 병에 걸리고 때때로 사망했다."],[4,"They blamed the fruit!","그들은 그 과일을 탓했다!"]],"k":"They = 부유한 유럽인들","a":"3) 부유한 유럽인들"},"pron":"They","h":"a6f9ec88f1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But tomatoes were not the problem.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 토마토가 문제가 아니었다.","opts":["문제의 원인은 토마토가 아니었다.","토마토가 유일한 문제였다.","토마토가 큰 문제를 해결했다.","그 문제는 아직 해결되지 않았다."],"r":{"a":"1) 문제의 원인은 토마토가 아니었다.","ev":"5번 문장","c":1,"s":[[5,"But tomatoes were not the problem.","하지만 토마토가 문제가 아니었다."]]},"h":"75ba0f6c99"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["부유한 사람들은 은 접시로 음식을 먹었다.","토마토 안에 납이 들어 있어서 병에 걸렸다.","이탈리아 사람들은 토마토를 먹지 않게 되었다.","토마토는 전 세계적으로 인기 있어졌다."],"opts":["Wealthy people ate food from silver plates.","The lead in tomatoes made people sick.","People in Italy stopped eating tomatoes.","Tomatoes became popular around the world."],"r":{"a":"4) Tomatoes became popular around the world. (토마토는 전 세계적으로 인기 있어졌다.)","ev":"12번 문장","c":4,"s":[[12,"Soon, tomatoes became popular around the world.","머지않아, 토마토는 전 세계적으로 인기 있어졌다."]]},"h":"577e5921e0"},{"n":9,"t":"sum","q":"People got sick not because of tomatoes but because of the lead in their (A) plates, and later they learned that tomatoes were (B).","ko":"사람들은 토마토 때문이 아니라 그들의 (A) 접시 속 납 때문에 병에 걸렸고, 나중에 토마토가 (B)하다는 것을 알게 되었다.","oko":["A 유리 / B 안전","A 백랍 / B 위험","A 나무 / B 위험","A 유리 / B 위험","A 백랍 / B 안전"],"opts":["(A) glass / (B) safe","(A) pewter / (B) dangerous","(A) wooden / (B) dangerous","(A) glass / (B) dangerous","(A) pewter / (B) safe"],"r":{"a":"5) (A) pewter / (B) safe (A 백랍 / B 안전)","ev":"6번, 7번, 10번 문장","c":5,"s":[[6,"At that time, wealthy people ate food from pewter plates.","그 당시에, 부유한 사람들은 백랍 접시로부터 음식을 먹었다."],[7,"Pewter has poisonous lead in it.","백랍은 그것 안에 독성이 있는 납이 있다."],[10,"As people learned more about science, they realized tomatoes weren’t dangerous.","사람들이 과학에 대해 더 많이 배우면서, 그들은 토마토가 위험하지 않다는 것을 깨달았다."]]},"h":"7556546e86"},{"n":10,"t":"fill","q":"Today, tomatoes are [A] as a [B].","ko":"오늘날, 토마토는 [B](으)로 [A].","bank":["known","superfood","sick","plates","lead","pizza"],"bko":{"known":"알려져 있다","superfood":"슈퍼푸드","sick":"병에 걸린","plates":"접시","lead":"납","pizza":"피자"},"r":{"a":"[A] known (알려져 있다), [B] superfood (슈퍼푸드)","ev":"1번 문장","s":[[1,"Today, tomatoes are known as a superfood.","오늘날, 토마토는 슈퍼푸드로 알려져 있다."]],"c":null},"h":"4cbc38d0a7"}]},{"u":6,"id":"hs2-06-3","no":3,"ko":"똑똑! 존경합니다, 선생님~","items":[{"n":1,"t":"tf","q":"Students in German universities knock on their desks at the end of class.","ko":"독일 대학의 학생들은 수업의 끝 무렵에 책상을 두드린다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","w":"1번 문장에 students gently knock on their desks at the end of class가 그대로 나와요.","c":"T","s":[[1,"In universities in Germany, students gently knock on their desks at the end of class.","독일의 대학들에서는, 수업의 끝 무렵에 학생들이 책상을 약하게 두드린다."]]},"h":"ec5654766b"},{"n":2,"t":"tf","q":"German students clap loudly for their teachers.","ko":"독일 학생들은 선생님들을 위해 크게 박수를 친다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","w":"6번에서 학생들은 선생님들을 위해 박수를 치지 않았다(didn’t clap)고 해요. 박수 대신 책상을 두드려요.","c":"F","s":[[6,"So students didn’t clap for their teachers.","그래서 학생들은 그들의 선생님들을 위해 박수를 치지 않았다."]]},"h":"f1163c6830"},{"n":3,"t":"tf","q":"German students knock on their desks to say thanks for the lecture.","ko":"독일 학생들은 강의에 대한 감사를 말하기 위해 책상을 두드린다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에서 They do this to say “Thanks for the great lecture, Teacher.”라고 해요. 두드리는 것은 강의에 감사하다고 말하는 행동이에요.","c":"T","s":[[2,"They do this to say “Thanks for the great lecture, Teacher.”","그들은 “선생님, 좋은 강의 감사합니다”라고 말하기 위해 이렇게 한다."]]},"h":"072df519c6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (students gently knock on their desks)","ko":"학생들은 책상을 gently 두드린다","opts":["큰 소리로","약하게","화가 나서","빠르게"],"word":"gently","r":{"a":"2) 약하게","ev":"1번 문장","w":"gently는 ‘약하게, 부드럽게’예요. 학생들이 책상을 두드리는 방식을 말해 줘요.","c":2,"s":[[1,"In universities in Germany, students gently knock on their desks at the end of class.","독일의 대학들에서는, 수업의 끝 무렵에 학생들이 책상을 약하게 두드린다."]]},"h":"7a90a56259"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (they started knocking on their desks to show greater respect)","ko":"그들은 더 큰 respect를 보여 주려고 책상을 두드리기 시작했다","opts":["두려움","실망","피곤함","존경"],"word":"respect","r":{"a":"4) 존경","ev":"7번 문장","w":"2번에서 선생님께 감사를 전하는 행동이고, 7번에서 더 큰 respect를 보여 준다고 하니 ‘존경’이에요.","c":4,"s":[[7,"Instead, they started knocking on their desks to show greater respect.","대신에, 그들은 더 큰 존경을 보여주기 위해 그들의 책상을 두드리기 시작했다."]]},"h":"0757d07e37"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nBack then, they were considered less important than teachers in society.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그 당시에, 그들은 사회에서 선생님들보다 덜 중요하다고 여겨졌다.","opts":["학생들","배우들과 음악가들","독일의 대학들","강의를 하는 선생님들"],"r":{"a":"2) 배우들과 음악가들","ev":"4~5번 문장","s":[[4,"In the past, clapping was used to cheer for actors and musicians.","과거에, 박수는 배우들과 음악가들을 응원하기 위해 사용되었다."],[5,"Back then, they were considered less important than teachers in society.","그 당시에, 그들은 사회에서 선생님들보다 덜 중요하다고 여겨졌다."]],"c":2,"k":"they = 배우들과 음악가들"},"pron":"they","h":"cdc1b65a71"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They do this to say “Thanks for the great lecture, Teacher.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 “선생님, 좋은 강의 감사합니다”라고 말하기 위해 이렇게 한다.","opts":["그들은 선생님께 강의에 대한 고마움을 전하려고 그렇게 한다.","그들은 선생님께 강의를 더 해 달라고 부탁하려고 그렇게 한다.","그들은 강의가 지루했다고 말하려고 그렇게 한다.","그들은 선생님께 질문이 있다고 알리려고 그렇게 한다."],"r":{"a":"1) 그들은 선생님께 강의에 대한 고마움을 전하려고 그렇게 한다.","ev":"2번 문장","s":[[2,"They do this to say “Thanks for the great lecture, Teacher.”","그들은 “선생님, 좋은 강의 감사합니다”라고 말하기 위해 이렇게 한다."]],"c":1},"h":"dfca005615"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Students leave the classroom without saying anything.","Students say thanks to their teacher at the end of class.","Actors were considered more important than teachers in society.","Students stand up and sing at the end of class."],"oko":["학생들은 아무 말 없이 교실을 떠난다.","학생들은 수업이 끝날 때 선생님께 감사를 전한다.","배우들은 사회에서 선생님들보다 더 중요하게 여겨졌다.","학생들은 수업이 끝날 때 일어나서 노래를 부른다."],"r":{"c":2,"ev":"1~2번 문장","s":[[1,"In universities in Germany, students gently knock on their desks at the end of class.","독일의 대학들에서는, 수업의 끝 무렵에 학생들이 책상을 약하게 두드린다."],[2,"They do this to say “Thanks for the great lecture, Teacher.”","그들은 “선생님, 좋은 강의 감사합니다”라고 말하기 위해 이렇게 한다."]],"a":"2) Students say thanks to their teacher at the end of class. (학생들은 수업이 끝날 때 선생님께 감사를 전한다.)"},"h":"ba706ac972"},{"n":9,"t":"sum","q":"Students don’t (A) for their teachers. Instead, they (B) on their desks to show respect.","ko":"학생들은 선생님들을 위해 (A) 않는다. 대신에 존경을 보여 주려고 책상 위에서 (B).","oko":["A 응원하지 / B 글씨를 쓴다","A 두드리지 / B 박수 친다","A 박수 치지 / B 잔다","A 응원하지 / B 말한다","A 박수 치지 / B 두드린다"],"opts":["(A) cheer / (B) write","(A) knock / (B) clap","(A) clap / (B) sleep","(A) cheer / (B) talk","(A) clap / (B) knock"],"r":{"a":"5) (A) clap / (B) knock (A 박수 치지 / B 두드린다)","ev":"6번, 7번 문장","c":5,"s":[[6,"So students didn’t clap for their teachers.","그래서 학생들은 그들의 선생님들을 위해 박수를 치지 않았다."],[7,"Instead, they started knocking on their desks to show greater respect.","대신에, 그들은 더 큰 존경을 보여주기 위해 그들의 책상을 두드리기 시작했다."]]},"h":"e65ca421b4"},{"n":10,"t":"fill","q":"They need to take notes, so they can’t [A] with [B] hands.","ko":"그들은 필기를 해야 해서, [B] 손으로 [A] 수 없다.","bank":["clap","both","one","desks","respect","easier"],"bko":{"clap":"박수를 칠","both":"두","one":"한","desks":"책상","respect":"존경","easier":"더 쉬운"},"r":{"a":"[A] clap (박수를 칠), [B] both (두)","ev":"9번 문장","c":null,"s":[[9,"They need to take notes, so they can’t clap with both hands.","그들은 필기를 해야 해서, 두 손으로 박수를 칠 수 없다."]]},"h":"fb824d185d"}]},{"u":7,"id":"hs2-07-1","no":1,"ko":"왜 잠이 안 오지?","items":[{"n":1,"t":"tf","q":"Diego could not fall asleep after watching some videos.","ko":"Diego는 몇 개의 동영상을 본 후에 잠들 수 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"Diego: I didn’t sleep well.","나는 잘 못 잤어."],[4,"I couldn’t fall asleep after watching some videos.","몇 개의 동영상을 본 후에 잠들 수 없었어."]],"w":"4번 문장에 I couldn’t fall asleep after watching some videos가 그대로 나와요. 동영상을 본 뒤 잠들 수 없었다는 내용과 일치해요.","c":"T"},"h":"e5a183bff2"},{"n":2,"t":"tf","q":"Ari says that blue light comes only from the sun.","ko":"Ari는 블루라이트가 태양에서만 나온다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"Ari: It is a type of light that comes from the sun.","그것은 태양에서 나오는 빛의 한 종류야."],[8,"It also comes from electronic devices like smartphones and computers.","그것은 스마트폰과 컴퓨터와 같은 전자기기들에서도 나와."]],"w":"7번에서 태양에서 나온다고 했지만, 8번에서 also(또한) 스마트폰과 컴퓨터 같은 전자기기에서도 나온다고 해요. 태양에서'만 "},"h":"d13bdf2557"},{"n":3,"t":"tf","q":"The monkeys help Charlie Chaplin keep his balance on the rope.","ko":"원숭이들은 찰리 채플린이 줄 위에서 균형을 유지하도록 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"12~13번 문장","s":[[12,"They climb all over his body.","그것들은 그의 온몸을 기어오른다."],[13,"He struggles to keep his balance.","그는 그의 균형을 유지하기 위해 애쓴다."]],"w":"12번에서 원숭이들은 채플린의 온몸을 기어올라요. 그래서 13번에서 채플린은 균형을 유지하려고 애쓰는 거예요. 원숭이들이 돕는다는 말은 본문에 없어요.","c":"F"},"h":"ddb167d86a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He struggles to keep his balance.)","ko":"그는 그의 균형을 유지하기 위해 struggle한다.","opts":["포기한다","즐긴다","애쓴다","도와준다"],"word":"struggles","r":{"a":"3) 애쓴다","ev":"13번 문장","s":[[13,"He struggles to keep his balance.","그는 그의 균형을 유지하기 위해 애쓴다."]],"w":"원숭이들이 온몸을 기어오르는 상황(12번)에서 균형을 유지하기 위해 힘쓰는 거예요. struggle = 애쓰다.","c":3},"h":"0c6765dcf7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (And the monkeys remove his pants!)","ko":"그리고 원숭이들은 그의 바지를 remove한다!","opts":["입힌다","벗긴다","빌린다","씻는다"],"word":"remove","r":{"a":"2) 벗긴다","ev":"14번 문장","s":[[14,"And the monkeys remove his pants!","그리고 원숭이들은 그의 바지를 벗긴다!"]],"w":"원숭이들이 바지를 벗겨서 모두가 웃음을 멈추지 못해요(15번). remove his pants = 그의 바지를 벗기다.","c":2},"h":"0b3ca32c65"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey climb all over his body.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 그의 온몸을 기어오른다.","opts":["찰리 채플린","관객들","서커스 단원들","원숭이들"],"r":{"a":"4) 원숭이들","ev":"11~12번 문장","s":[[11,"A bunch of monkeys join him on the rope.","많은 원숭이들이 줄 위에서 그와 합류한다."],[12,"They climb all over his body.","그것들은 그의 온몸을 기어오른다."]],"c":4,"k":"They = 원숭이들"},"h":"cf158d952a","pron":"They"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They might fall, slip, or get a pie in the face.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 넘어지거나, 미끄러지거나, 얼굴에 파이를 맞을 수도 있다.","opts":["그들은 반드시 넘어지고 파이를 먹는다.","그들은 넘어지거나, 미끄러지거나, 얼굴에 파이를 맞을 수도 있다.","그들은 얼굴에 파이를 던지고 도망간다.","그들은 넘어지지 않으려고 조심한다."],"r":{"a":"2) 그들은 넘어지거나, 미끄러지거나, 얼굴에 파이를 맞을 수도 있다.","ev":"8번 문장","s":[[8,"They might fall, slip, or get a pie in the face.","그들은 넘어지거나, 미끄러지거나, 얼굴에 파이를 맞을 수도 있다."]],"c":2},"h":"8abd60e36c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["찰리 채플린은 슬랩스틱 코미디로 유명하다.","슬랩스틱 코미디는 많은 대사와 말로 웃음을 만든다.","<톰과 제리>에서 제리가 갈퀴를 밟는다.","<서커스>에서 원숭이들이 찰리 채플린의 바지를 지켜 준다."],"opts":["Charlie Chaplin is famous for slapstick comedy.","Slapstick comedy makes people laugh with many words.","In Tom and Jerry, Jerry steps on a rake.","In The Circus, the monkeys keep Charlie Chaplin's pants on."],"r":{"a":"1) Charlie Chaplin is famous for slapstick comedy. (찰리 채플린은 슬랩스틱 코미디로 유명하다.)","ev":"9번 문장","s":[[9,"One actor that is famous for slapstick comedy is Charlie Chaplin.","슬랩스틱 코미디로 유명한 한 배우는 찰리 채플린이다."]],"c":1},"h":"876dfa441e"},{"n":9,"t":"sum","q":"In slapstick comedy, actors use (A) actions instead of talking. In The Circus, Charlie Chaplin (B) to keep his balance while monkeys climb on him.","ko":"슬랩스틱 코미디에서 배우들은 말하는 대신 (A) 동작을 사용한다. <서커스>에서 찰리 채플린은 원숭이들이 그의 몸을 기어오르는 동안 균형을 유지하려고 (B).","oko":["A 지루한 / B 애쓴다","A 신체적인 / B 거부한다","A 신체적인 / B 애쓴다","A 무서운 / B 즐긴다","A 지루한 / B 넘어진다"],"opts":["(A) boring / (B) struggles","(A) physical / (B) refuses","(A) physical / (B) struggles","(A) scary / (B) enjoys","(A) boring / (B) falls"],"r":{"a":"3) (A) physical / (B) struggles (A 신체적인 / B 애쓴다)","ev":"6~7번, 12~13번 문장","s":[[6,"Actors don’t talk.","배우들은 말을 하지 않는다."],[7,"They make humorous faces and use dramatic actions.","그들은 재미있는 표정을 짓고 과장된 동작을 사용한다."],[12,"They climb all over his body.","그것들은 그의 온몸을 기어오른다."],[13,"He struggles to keep his balance.","그는 그의 균형을 유지하기 위해 애쓴다."]],"c":3},"h":"b628584d02"},{"n":10,"t":"fill","q":"This [A] of [B] is slapstick comedy.","ko":"이러한 [B]의 [A]은(는) 슬랩스틱 코미디이다.","bank":["type","humor","tightrope","monkeys","pie","rake"],"bko":{"type":"종류","humor":"유머","tightrope":"줄타기 줄","monkeys":"원숭이들","pie":"파이","rake":"갈퀴"},"r":{"a":"[A] type (종류), [B] humor (유머)","ev":"4번 문장","s":[[4,"This type of humor is slapstick comedy.","이러한 유머의 종류는 슬랩스틱 코미디이다."]],"c":null},"h":"60995c8d76"}]},{"u":8,"id":"hs2-08-2","no":2,"ko":"황금알을 낳는 거위","items":[{"n":1,"t":"tf","q":"The paper microscope was used to find harmful bacteria in drinking water.","ko":"종이 현미경은 식수에서 해로운 박테리아를 찾는 데 사용되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"It was even used to find harmful bacteria in drinking water.","그것은 심지어 식수에서 해로운 박테리아를 찾기 위해 사용되었다."]],"w":"10번 문장에 종이 현미경이 식수에서 해로운 박테리아를 찾는 데 쓰였다는 말이 그대로 있어요.","c":"T"},"h":"1e737f4e1c"},{"n":2,"t":"tf","q":"A paper microscope is heavy and costs a lot to make.","ko":"종이 현미경은 무겁고 만드는 데 많은 돈이 든다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"A paper microscope costs only $1 to make and is very light.","종이 현미경은 만드는 데 겨우 1달러가 들고 아주 가볍다."]],"w":"9번 문장에서 종이 현미경은 만드는 데 겨우 1달러가 들고 아주 가볍다고 해요. 무겁고 비싼 것은 보통의 현미경이에요(6번).","c":"F"},"h":"7f5c81b61e"},{"n":3,"t":"tf","q":"The goose in the story looked golden on the outside.","ko":"이야기 속 거위는 겉으로 황금색으로 보였다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"The goose seemed normal from the outside, but it laid golden eggs!","그 거위는 겉으로는 평범해 보였지만, 그것은 황금알을 낳았다!"]],"w":"13번 문장에서 거위는 겉으로는 평범해 보였지만(seemed normal) 황금알을 낳았어요. 거위가 황금색으로 보인 것이 아니에요.","c":"F"},"h":"7041c80a58"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 2022, the inventors of a paper microscope won the award.)","ko":"2022년에 종이 현미경의 inventors가 그 상을 탔다.","opts":["수리공들","판매원들","발명가들","관객들"],"word":"inventors","r":{"a":"3) 발명가들","ev":"3번 문장","s":[[3,"In 2022, the inventors of a paper microscope won the award.","2022년에, 종이 현미경의 발명가들이 그 상을 탔다."]],"w":"종이 현미경을 만들어 낸 사람들이 상을 탔어요. 6~8번에서 대학 연구자들이 종이 현미경을 만들었으니 inventor = 발명가예요.","c":3},"h":"be0c877100"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It might sound silly.)","ko":"그것은 silly하게 들릴 수도 있다.","opts":["위험한","우스꽝스러운","당연한","슬픈"],"word":"silly","r":{"a":"2) 우스꽝스러운","ev":"3~5번 문장","s":[[3,"In 2022, the inventors of a paper microscope won the aw
