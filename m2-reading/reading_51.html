<style>

.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "Monday, August 1", "en": "After a nine-hour flight, my family finally arrived at the international airport in Honolulu.", "ko": "아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "When we came through the gate, I heard someone to call my name.", "ko": "우리가 게이트를 통과했을 때, 나는 누군가 내 이름을 부르는 소리를 들었다.", "ok": false, "foot": [], "fixes": [{"wrong": "to call", "right": "calling", "partial": false, "at": [9], "point": "지각동사: hear+목적어의 목적격보어로는 원형부정사나 현재분사를 쓰므로 to call 대신 calling 사용", "topic": "지각동사", "memo": "hear+목적어의 목적격보어로는 원형부정사나 현재분사를 쓰므로 to call 대신 calling 사용"}]}, {"n": 3, "tag": null, "en": "My cousin Soobin and her family was waiting for us.", "ko": "내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "was", "right": "were", "partial": false, "at": [6], "point": "수일치: 주어 Soobin and her family(복수)에 맞춰 were 사용", "topic": "수일치", "memo": "주어 Soobin and her family(복수)에 맞춰 were 사용"}]}, {"n": 4, "tag": null, "en": "When we saw each other, we hugged and jumping together in a circle.", "ko": "우리가 서로를 보았을 때, 우리는 껴안고 함께 원을 그리며 뛰었다.", "ok": false, "foot": [], "fixes": [{"wrong": "jumping", "right": "jumped", "partial": false, "at": [8], "point": "병렬구조: hugged와 and로 연결되므로 동일한 과거형 jumped 사용", "topic": "병렬구조", "memo": "hugged와 and로 연결되므로 동일한 과거형 jumped 사용"}]}, {"n": 5, "tag": null, "en": "Then Soobin put a prettily flower necklace around my neck.", "ko": "그때 수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다.", "ok": false, "foot": [], "fixes": [{"wrong": "prettily", "right": "pretty", "partial": false, "at": [4], "point": "형용사 vs 부사: 명사 necklace를 수식하므로 형용사 pretty 사용", "topic": "형용사 vs 부사", "memo": "명사 necklace를 수식하므로 형용사 pretty 사용"}]}, {"n": 6, "tag": null, "en": "She called it a lei and told that \"lei\" meant \"warm welcome.\"", "ko": "그녀는 그것을 레이(lei)라고 불렀고 lei는 따뜻한 환영을 의미한다고 말했다.", "ok": false, "foot": [], "fixes": [{"wrong": "told", "right": "said", "partial": false, "at": [6], "point": "어휘: told 뒤에는 사람 목적어가 필요하므로 접속사 that절이 바로 이어지는 said 사용", "topic": "어휘", "memo": "told 뒤에는 사람 목적어가 필요하므로 접속사 that절이 바로 이어지는 said 사용"}, {"wrong": "meant", "right": "means", "partial": false, "at": [9], "point": "시제: 일반적 사실(정의)을 말할 때는 주절 시제와 상관없이 현재시제 means 사용", "topic": "시제", "memo": "일반적 사실(정의)을 말할 때는 주절 시제와 상관없이 현재시제 means 사용"}]}, {"n": 7, "tag": null, "en": "We visit Diamond Head first.", "ko": "우리는 먼저 다이아몬드 헤드를 방문했다.", "ok": false, "foot": [], "fixes": [{"wrong": "visit", "right": "visited", "partial": false, "at": [1], "point": "시제: 글 전체가 과거시제이므로 과거형 visited 사용", "topic": "시제", "memo": "글 전체가 과거시제이므로 과거형 visited 사용"}]}, {"n": 8, "tag": null, "en": "It is an famous hiking place.", "ko": "그곳은 유명한 하이킹 장소이다.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [2], "point": "관사: famous는 자음 발음[f]으로 시작하므로 부정관사 a 사용", "topic": "관사", "memo": "famous는 자음 발음[f]으로 시작하므로 부정관사 a 사용"}]}, {"n": 9, "tag": null, "en": "My uncle told us how it got it's name.", "ko": "삼촌이 우리에게 그것이 어떻게 그런 이름을 갖게 되었는지 말해 주셨다.", "ok": false, "foot": [], "fixes": [{"wrong": "it's", "right": "its", "partial": false, "at": [7], "point": "어휘: it's(it is의 축약형)와 소유격 its 구분 — 명사 name을 수식하므로 소유격 its 사용", "topic": "어휘", "memo": "it's(it is의 축약형)와 소유격 its 구분 — 명사 name을 수식하므로 소유격 its 사용"}]}, {"n": 10, "tag": null, "en": "In the past, people thought its shiny rocks were as brighter as diamonds.", "ko": "과거에, 사람들은 그것의 반짝이는 돌들이 다이아몬드만큼 밝다고 생각했다.", "ok": false, "foot": [], "fixes": [{"wrong": "brighter", "right": "bright", "partial": false, "at": [10], "point": "원급비교: as ~ as 사이에는 형용사의 원급을 쓰므로 brighter(비교급) 대신 bright 사용", "topic": "원급비교", "memo": "as ~ as 사이에는 형용사의 원급을 쓰므로 brighter(비교급) 대신 bright 사용"}]}, {"n": 11, "tag": null, "en": "So, they named the place as Diamond Head. How interesting!", "ko": "그래서 그들은 그 장소를 다이아몬드 헤드라고 이름 붙였다. 정말 흥미로웠다!", "ok": false, "foot": [], "fixes": [{"wrong": "as Diamond Head", "right": "Diamond Head", "partial": false, "at": [5], "point": "5형식: name+목적어+목적격보어 구조에서는 목적격보어 앞에 as를 쓰지 않음", "topic": "5형식", "memo": "name+목적어+목적격보어 구조에서는 목적격보어 앞에 as를 쓰지 않음"}]}, {"n": 12, "tag": null, "en": "The view from the top was too amazing that Soobin and I took many pictures there!", "ko": "정상에서 바라본 경치는 너무 놀라워서 수빈이와 나는 거기서 많은 사진을 찍었다!", "ok": false, "foot": [], "fixes": [{"wrong": "too", "right": "so", "partial": false, "at": [6], "point": "so ~ that 구문: '너무 ~해서 …하다'라는 결과를 나타낼 때는 so ~ that 사용", "topic": "so ~ that 구문", "memo": "'너무 ~해서 …하다'라는 결과를 나타낼 때는 so ~ that 사용"}]}, {"n": 13, "tag": "Tuesday, August 2", "en": "Today we go to an culture center.", "ko": "오늘 우리는 문화 센터에 갔다.", "ok": false, "foot": [], "fixes": [{"wrong": "go", "right": "went", "partial": false, "at": [2], "point": "시제: 이야기 전체가 과거시제이므로 went 사용", "topic": "시제", "memo": "이야기 전체가 과거시제이므로 went 사용"}, {"wrong": "an", "right": "a", "partial": false, "at": [4], "point": "관사: culture는 자음 발음[k]으로 시작하므로 부정관사 a 사용", "topic": "관사", "memo": "culture는 자음 발음[k]으로 시작하므로 부정관사 a 사용"}]}, {"n": 14, "tag": null, "en": "We learned about traditional Hawaiian culture there.", "ko": "우리는 거기에서 하와이 전통문화에 대해 배웠다.", "ok": true, "foot": [], "fixes": []}, {"n": 15, "tag": null, "en": "First, we learned what do some Hawaiian words mean.", "ko": "먼저, 우리는 몇몇 하와이 단어들이 무엇을 의미하는지 배웠다.", "ok": false, "foot": [], "fixes": [{"wrong": "do some Hawaiian words mean", "right": "some Hawaiian words mean", "partial": false, "at": [4], "point": "간접의문문: 의문사절이 목적어로 쓰일 때는 '의문사+주어+동사' 어순 사용", "topic": "간접의문문", "memo": "의문사절이 목적어로 쓰일 때는 '의문사+주어+동사' 어순 사용"}]}, {"n": 16, "tag": null, "en": "\"Aloha\" uses to say \"hello\" or \"goodbye,\" and \"mahalo\" means \"thank you.\"", "ko": "Aloha는 안녕 또는 잘 가라는 인사를 하는 데 사용되고, mahalo는 고마워를 의미한다.", "ok": false, "foot": [], "fixes": [{"wrong": "uses", "right": "is used", "partial": false, "at": [1], "point": "수동태: Aloha는 '~하는 데 사용되는' 대상이므로 수동태 is used 사용", "topic": "수동태", "memo": "Aloha는 '~하는 데 사용되는' 대상이므로 수동태 is used 사용"}]}, {"n": 17, "tag": null, "en": "Then it was hula dance time! Surprisingly, much of the movements stand for things in nature.", "ko": "그다음은 훌라 춤 시간이었다! 놀랍게도, 많은 동작들이 자연의 것들을 상징했다.", "ok": false, "foot": ["1hula 하와이 전통 춤"], "fixes": [{"wrong": "much", "right": "many", "partial": false, "at": [7], "point": "가산명사: movements는 셀 수 있는 명사(복수)이므로 many 사용", "topic": "가산명사", "memo": "movements는 셀 수 있는 명사(복수)이므로 many 사용"}, {"wrong": "stand", "right": "stood", "partial": false, "at": [11], "point": "시제: 과거 이야기 흐름에 맞춰 과거형 stood 사용", "topic": "시제", "memo": "과거 이야기 흐름에 맞춰 과거형 stood 사용"}]}, {"n": 18, "tag": null, "en": "For example, if you rise your arms above your head in a circle, it stands for the moon.", "ko": "예를 들어, 팔을 머리 위로 원을 그리며 들면, 그것은 달을 의미한다.", "ok": false, "foot": [], "fixes": [{"wrong": "rise", "right": "raise", "partial": false, "at": [4], "point": "어휘: rise(자동사, 오르다)와 raise(타동사, ~을 들어올리다) 구분 — 목적어 your arms가 있으므로 raise 사용", "topic": "어휘", "memo": "rise(자동사, 오르다)와 raise(타동사, ~을 들어올리다) 구분 — 목적어 your arms가 있으므로 raise 사용"}]}, {"n": 19, "tag": null, "en": "When I danced hula, I could feel the love what the Hawaiian people have for nature.", "ko": "훌라 춤을 출 때, 나는 하와이 사람들이 자연에 대해 가진 사랑을 느낄 수 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "what", "right": "that", "partial": false, "at": [9], "point": "관계대명사: 선행사 the love가 있으므로 관계대명사 that(또는 which) 사용, 선행사 없는 what은 불가", "topic": "관계대명사", "memo": "선행사 the love가 있으므로 관계대명사 that(또는 which) 사용, 선행사 없는 what은 불가"}]}, {"n": 20, "tag": null, "en": "On the way back to Soobin's house, we saw an big, beautifully rainbow.", "ko": "수빈이네 집으로 돌아가는 길에, 우리는 크고 아름다운 무지개를 보았다.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [9], "point": "관사: big은 자음 발음[b]으로 시작하므로 부정관사 a 사용", "topic": "관사", "memo": "big은 자음 발음[b]으로 시작하므로 부정관사 a 사용"}, {"wrong": "beautifully", "right": "beautiful", "partial": false, "at": [11], "point": "형용사 vs 부사: 명사 rainbow를 수식하는 병렬 형용사이므로 beautiful 사용", "topic": "형용사 vs 부사", "memo": "명사 rainbow를 수식하는 병렬 형용사이므로 beautiful 사용"}]}, {"n": 21, "tag" +형용사+to부정사 구조이므로 seeing 대신 to see 사용", "topic": "가주어 it - 진주어 to부정사", "memo": "It was+형용사+to부정사 구조이므로 seeing 대신 to see 사용"}]}, {"n": 26, "tag": null, "en": "We saw lots of colorful fish and a turtle to swim there. It was amazed!", "ko": "우리는 거기서 형형색색의 많은 물고기들과 헤엄치는 바다거북 한 마리를 보았다. 정말 놀라웠다!", "ok": false, "foot": [], "fixes": [{"wrong": "to swim", "right": "swimming", "partial": false, "at": [9], "point": "지각동사: see+목적어의 목적격보어로는 원형부정사나 현재분사를 쓰므로 to swim 대신 swimming 사용", "topic": "지각동사", "memo": "see+목적어의 목적격보어로는 원형부정사나 현재분사를 쓰므로 to swim 대신 swimming 사용"}, {"wrong": "amazed", "right": "amazing", "partial": false, "at": [14], "point": "감정형용사: 주어 It(수중 세계)이 감정을 일으키는 주체이므로 능동의 amazing 사용", "topic": "감정형용사", "memo": "주어 It(수중 세계)이 감정을 일으키는 주체이므로 능동의 amazing 사용"}]}, {"n": 27, "tag": null, "en": "It is yet the latest day of our trip.", "ko": "벌써 우리 여행의 마지막 날이다.", "ok": false, "foot": [], "fixes": [{"wrong": "yet", "right": "already", "partial": false, "at": [2], "point": "어휘: yet은 주로 부정문/의문문에 쓰이고 긍정문에서 '이미'는 already 사용", "topic": "어휘", "memo": "yet은 주로 부정문/의문문에 쓰이고 긍정문에서 '이미'는 already 사용"}, {"wrong": "latest", "right": "last", "partial": false, "at": [4], "point": "어휘: latest(최신의)와 last(마지막의) 구분 — 문맥상 '마지막 날'이므로 last 사용", "topic": "어휘", "memo": "latest(최신의)와 last(마지막의) 구분 — 문맥상 '마지막 날'이므로 last 사용"}]}, {"n": 28, "tag": null, "en": "Despite I'm sad to go home, I will always remember Hawaii. Aloha, Soobin! Mahalo, Hawaii!", "ko": "비록 집에 돌아가야 해서 슬프지만, 나는 항상 하와이를 기억할 것이다. 알로하, 수빈! 마할로, 하와이!", "ok": false, "foot": [], "fixes": [{"wrong": "Despite", "right": "Although", "partial": false, "at": [0], "point": "접속사 vs 전치사: 뒤에 '주어+동사'의 절이 이어지므로 접속사 Although 사용(Despite는 전치사)", "topic": "접속사 vs 전치사", "memo": "뒤에 '주어+동사'의 절이 이어지므로 접속사 Although 사용(Despite는 전치사)"}]}];var PP=[["After a nine-hour flight, my family finally arrived at the international airport in Honolulu.", "아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다.", 0], ["When we came through the gate, I heard someone calling my name.", "우리가 게이트를 통과했을 때, 나는 누군가 내 이름을 부르는 소리를 들었다.", 0], ["My cousin Soobin and her family were waiting for us.", "내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다.", 0], ["When we saw each other, we hugged and jumped together in a circle.", "우리가 서로를 보았을 때, 우리는 껴안고 함께 원을 그리며 뛰었다.", 0], ["Then Soobin put a pretty flower necklace around my neck.", "그때 수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다.", 0], ["She called it a lei and said that \"lei\" means \"warm welcome.\"", "그녀는 그것을 레이(lei)라고 불렀고 lei는 따뜻한 환영을 의미한다고 말했다.", 0], ["We visited Diamond Head first.", "우리는 먼저 다이아몬드 헤드를 방문했다.", 0], ["It is a famous hiking place.", "그곳은 유명한 하이킹 장소이다.", 0], ["My uncle told us how it got its name.", "삼촌이 우리에게 그것이 어떻게 그런 이름을 갖게 되었는지 말해 주셨다.", 0], ["In the past, people thought its shiny rocks were as bright as diamonds.", "과거에, 사람들은 그것의 반짝이는 돌들이 다이아몬드만큼 밝다고 생각했다.", 0], ["So, they named the place Diamond Head. How interesting!", "그래서 그들은 그 장소를 다이아몬드 헤드라고 이름 붙였다. 정말 흥미로웠다!", 0], ["The view from the top was so amazing that Soobin and I took many pictures there!", "정상에서 바라본 경치는 너무 놀라워서 수빈이와 나는 거기서 많은 사진을 찍었다!", 0], ["Today we went to a culture center.", "오늘 우리는 문화 센터에 갔다.", 0], ["We learned about traditional Hawaiian culture there.", "우리는 거기에서 하와이 전통문화에 대해 배웠다.", 0], ["First, we learned what some Hawaiian words mean.", "먼저, 우리는 몇몇 하와이 단어들이 무엇을 의미하는지 배웠다.", 0], ["\"Aloha\" is used to say \"hello\" or \"goodbye,\" and \"mahalo\" means \"thank you.\"", "Aloha는 안녕 또는 잘 가라는 인사를 하는 데 사용되고, mahalo는 고마워를 의미한다.", 0], ["Then it was hula dance time! Surprisingly, many of the movements stood for things in nature.", "그다음은 훌라 춤 시간이었다! 놀랍게도, 많은 동작들이 자연의 것들을 상징했다.", 0], ["For example, if you raise your arms above your head in a circle, it stands for the moon.", "예를 들어, 팔을 머리 위로 원을 그리며 들면, 그것은 달을 의미한다.", 0], ["When I danced hula, I could feel the love that the Hawaiian people have for nature.", "훌라 춤을 출 때, 나는 하와이 사람들이 자연에 대해 가진 사랑을 느낄 수 있었다.", 0], ["On the way back to Soobin's house, we saw a big, beautiful rainbow.", "수빈이네 집으로 돌아가는 길에, 우리는 크고 아름다운 무지개를 보았다.", 0], ["Soobin explained, \"You can often see rainbows in Hawaii. So, Hawaii is called the Rainbow State.\"", "수빈이는 \"하와이에서는 무지개를 자주 볼 수 있어. 그래서 하와이는 무지개 주라고 불려.\"라고 설명해 주었다.", 0], ["Today, we headed to Hanauma Bay to go snorkeling.", "오늘 우리는 스노클링을 하러 하나우마 베이로 향했다.", 0], ["Before snorkeling, we watched an educational video.", "스노클링을 하기 전에, 우리는 교육용 영상을 시청했다.", 0], ["We learned not to harm the sea animals or touch the coral.", "우리는 바다 동물들을 해치거나 산호를 만지지 말아야 한다는 것을 배웠다.", 0], ["It was wonderful to see the underwater world.", "수중 세계를 보는 것은 멋졌다.", 0], ["We saw lots of colorful fish and a turtle swimming there. It was amazing!", "우리는 거기서 형형색색의 많은 물고기들과 헤엄치는 바다거북 한 마리를 보았다. 정말 놀라웠다!", 0], ["It is already the last day of our trip.", "벌써 우리 여행의 마지막 날이다.", 0], ["Although I'm sad to go home, I will always remember Hawaii. Aloha, Soobin! Mahalo, Hawaii!", "비록 집에 돌아가야 해서 슬프지만, 나는 항상 하와이를 기억할 것이다. 알로하, 수빈! 마할로, 하와이!", 0]];var RNUM=51;var TITLE_EN="Yeji's Family Trip to the Rainbow State";var PASS_EN=["Yeji's Family Trip to the Rainbow State", "After a nine-hour flight, my family finally arrived at the international airport in Honolulu. When we came through the gate, I heard someone calling my name. My cousin Soobin and her family were waiting for us. When we saw each other, we hugged and jumped together in a circle. Then Soobin put a pretty flower necklace around my neck. She called it a lei and said that \"lei\" means \"warm welcome.\" We visited Diamond Head first. It is a famous hiking place. My uncle told us how it got its name. In the past, people thought its shiny rocks were as bright as diamonds. So, they named the place Diamond Head. How interesting! The view from the top was so amazing that Soobin and I took many pictures there!", "Today we went to a culture center. We learned about traditional Hawaiian culture there. First, we learned what some Hawaiian words mean. \"Aloha\" is used to say \"hello\" or \"goodbye,\" and \"mahalo\" means \"thank you.\" Then it was hula dance time! Surprisingly, many of the movements stood for things in nature. For example, if you raise your arms above your head in a circle, it stands for the moon. When I danced hula, I could feel the love that the Hawaiian people have for nature. On the way back to Soobin's house, we saw a big, beautiful rainbow. Soobin explained, \"You can often see rainbows in Hawaii. So, Hawaii is called the Rainbow State.\"", "Today, we headed to Hanauma Bay to go snorkeling. Before snorkeling, we watched an educational video. We learned not to harm the sea animals or touch the coral. It was wonderful to see the underwater world. We saw lots of colorful fish and a turtle swimming there. It was amazing! It is already the last day of our trip. Although I'm sad to go home, I will always remember Hawaii. Aloha, Soobin! Mahalo, Hawaii!"];var PASS_KO=["예지의 무지개 주 가족 여행", "아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다. 우리가 게이트를 통과했을 때, 나는 누군가 내 이름을 부르는 소리를 들었다. 내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다. 우리가 서로를 보았을 때, 우리는 껴안고 함께 원을 그리며 뛰었다. 그때 수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다. 그녀는 그것을 레이(lei)라고 불렀고 lei는 따뜻한 환영을 의미한다고 말했다. 우리는 먼저 다이아몬드 헤드를 방문했다. 그곳은 유명한 하이킹 장소이다. 삼촌이 우리에게 그것이 어떻게 그런 이름을 갖게 되었는지 말해 주셨다. 과거에, 사람들은 그것의 반짝이는 돌들이 다이아몬드만큼 밝다고 생각했다. 그래서 그들은 그 장소를 다이아몬드 헤드라고 이름 붙였다. 정말 흥미로웠다! 정상에서 바라본 경치는 너무 놀라워서 수빈이와 나는 거기서 많은 사진을 찍었다!", "오늘 우리는 문화 센터에 갔다. 우리는 거기에서 하와이 전통문화에 대해 배웠다. 먼저, 우리는 몇몇 하와이 단어들이 무엇을 의미하는지 배웠다. Aloha는 안녕 또는 잘 가라는 인사를 하는 데 사용되고, mahalo는 고마워를 의미한다. 그다음은 훌라 춤 시간이었다! 놀랍게도, 많은 동작들이 자연의 것들을 상징했다. 예를 들어, 팔을 머리 위로 원을 그리며 들면, 그것은 달을 의미한다. 훌라 춤을 출 때, 나는 하와이 사람들이 자연에 대해 가진 사랑을 느낄 수 있었다. 수빈이네 집으로 돌아가는 길에, 우리는 크고 아름다운 무지개를 보았다. 수빈이는 \"하와이에서는 무지개를 자주 볼 수 있어. 그래서 하와이는 무지개 주라고 불려.\"라고 설명해 주었다.", "오늘 우리는 스노클링을 하러 하나우마 베이로 향했다. 스노클링을 하기 전에, 우리는 교육용 영상을 시청했다. 우리는 바다 동물들을 해치거나 산호를 만지지 말아야 한다는 것을 배웠다. 수중 세계를 보는 것은 멋졌다. 우리는 거기서 형형색색의 많은 물고기들과 헤엄치는 바다거북 한 마리를 보았다. 정말 놀라웠다! 벌써 우리 여행의 마지막 날이다. 비록 집에 돌아가야 해서 슬프지만, 나는 항상 하와이를 기억할 것이다. 알로하, 수빈! 마할로, 하와이!"];var DG=[{"dlg": [["G", "Dad, let’s plan our trip to Australia!", "아빠, 우리 호주 여행 계획 세워요!"], ["M", "Okay, Yumi. Where would you like to go?", "좋아, 유미야. 어디에 가고 싶니?"], ["G", "I’d like to visit the Sydney Opera House.", "저는 시드니 오페라 하우스에 가 보고 싶어요."], ["M", "Then how about taking a tour of the Sydney Opera House on the first day? We can learn about the history of the building.", "그럼 첫날에 시드니 오페라 하우스 투어를 하는 게 어떠니? 그 건물의 역사에 대해 배울 수 있어."], ["G", "That sounds perfect! I’d like to watch a live performance, too.", "완벽해요! 저는 라이브 공연도 보고 싶어요."], ["M", "Of course! We can buy tickets to an opera or a classical music concert.", "물론이지! 오페라나 클래식 음악 콘서트 표를 살 수 있단다."], ["G", "I want to see an opera.", "저는 오페라를 보고 싶어요."], ["M", "Okay. I’ll look for tickets to an opera.", "알았다. 오페라 표를 찾아볼게."], ["G", "Thank you, Dad. I hope we have a great time.", "고마워요, 아빠. 우리가 즐거운 시간을 보내면 좋겠어요."]], "qs": [{"n": 1, "q": "위 대화의 주제로 알맞은 것은?", "o": ["choosing a travel destination", "making travel plans for Australia", "recommending a travel destination", "famous tourist attractions in Australia", "the history of the Sydney Opera House"], "a": 1, "ans": "making travel plans for Australia", "evs": [["G: Dad, let’s plan our trip to Australia!", "아빠, 우리 호주 여행 계획 세워요!"], ["M: Then how about taking a tour of the Sydney Opera House on the first day? We can learn about the history of the building.", "그럼 첫날에 시드니 오페라 하우스 투어를 하는 게 어떠니? 그 건물의 역사에 대해 배울 수 있어."]], "ev": ["G: Dad, let’s plan our trip to Australia!", "아빠, 우리 호주 여행 계획 세워요!"], "memo": ["G: Dad, let’s plan our trip to Australia!  (아빠, 우리 호주 여행 계획 세워요!)", "M: Then how about taking a tour of the Sydney Opera House on the first day? We can learn about the history of the building.  (그럼 첫날에 시드니 오페라 하우스 투어를 하는 게 어떠니? 그 건물의 역사에 대해 배울 수 있어.)"]}]}, {"dlg": [["W", "We’re finally here, the lantern festival in Thailand!", "드디어 왔구나, 태국의 등불 축제에!"], ["B", "There are already a lot of people here.", "벌써 여기에 사람들이 많이 있네요."], ["W", "Yes. I’m excited to see the bright lanterns in the sky.", "그래. 하늘에 떠 있는 밝은 등불들을 볼 생각에 신이 나."], ["B", "Me too! Bu   if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});
var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});

}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});

function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
