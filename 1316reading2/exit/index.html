Scents can have a powerful effect on our memory.","향기는 우리 기억에 강력한 영향을 미칠 수 있다."]],"w":"1번 문장이 그대로 나와요. 기억에 강력한 영향(powerful effect)이라는 글의 주제예요.","c":"T"},"h":"0bd82947a7"},{"n":2,"t":"tf","q":"Singapore Airlines uses its vents to spread the smell of grilling burgers.","ko":"싱가포르 항공은 버거를 굽는 냄새를 퍼뜨리기 위해 통풍구를 이용한다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"Another example is Burger King.","또 다른 예는 버거킹이다."],[8,"It uses its vents to spread the smell of grilling burgers.","버거킹은 버거를 굽는 냄새를 퍼뜨리기 위해 그곳의 통풍구를 이용한다."]],"w":"통풍구로 버거 굽는 냄새를 퍼뜨리는 것은 버거킹이에요(7~8번). 싱가포르 항공은 꽃으로 만든 향기를 써요(4번).","c":"F"},"h":"f9809f9ac2"},{"n":3,"t":"tf","q":"The scent of Singapore Airlines is used on flight attendant uniforms.","ko":"싱가포르 항공의 향기는 승무원 제복에 사용된다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The scent is used on flight attendant uniforms and in various places on the plane.","그 향기는 승무원 제복과 기내의 여러 장소에 사용된다."]],"w":"5번에서 향기가 flight attendant uniforms(승무원 제복)와 기내 여러 장소에 쓰인다고 해요.","c":"T"},"h":"b303c47aab"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They used six kinds of flowers that are native to Singapore to create a signature scent.)","ko":"그들은 대표 향기를 만들기 위해 싱가포르가 □□□인 여섯 종류의 꽃을 사용했다.","opts":["수입된","원산지의","인공의","희귀한"],"word":"native","r":{"a":"2) 원산지의","ev":"4번 문장","s":[[4,"They used six kinds of flowers that are native to Singapore to create a signature scent.","그들은 자신을 대표하는 향기를 만들기 위해 싱가포르가 원산지인 여섯 종류의 꽃을 사용했다."]],"w":"싱가포르 항공이 싱가포르의 꽃으로 자기들의 대표 향기를 만든 거예요. native to Singapore는 ‘싱가포르가 원산지인’이라는 뜻이에요.","c":2},"h":"bc3bdfe29f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It uses its vents to spread the smell of grilling burgers.)","ko":"버거킹은 버거를 굽는 냄새를 퍼뜨리기 위해 그곳의 □□□를 이용한다.","opts":["간판","문","메뉴판","통풍구"],"word":"vents","r":{"a":"4) 통풍구","ev":"8번 문장","s":[[8,"It uses its vents to spread the smell of grilling burgers.","버거킹은 버거를 굽는 냄새를 퍼뜨리기 위해 그곳의 통풍구를 이용한다."]],"w":"냄새를 퍼뜨리려고 사용하는 것이므로 공기가 나가는 통로예요. vent = 통풍구, 환기구.","c":4},"h":"dcae0ece9a"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes people nearby feel hungry and think of the restaurant.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 근처에 있는 사람들이 배고픔을 느끼고 그 식당을 생각하게 만든다.","opts":["버거킹이 통풍구로 버거 굽는 냄새를 퍼뜨리는 것","승무원이 제복을 입는 것","싱가포르의 꽃을 심는 것","사람들이 배고픔을 참는 것"],"r":{"a":"1) 버거킹이 통풍구로 버거 굽는 냄새를 퍼뜨리는 것","ev":"8~9번 문장","s":[[8,"It uses its vents to spread the smell of grilling burgers.","버거킹은 버거를 굽는 냄새를 퍼뜨리기 위해 그곳의 통풍구를 이용한다."],[9,"This makes people nearby feel hungry and think of the restaurant.","이것은 (식당) 근처에 있는 사람들이 배고픔을 느끼고 그 식당을 생각하게 만든다."]],"w":"9번 This는 바로 앞 8번의 내용이에요. 통풍구로 냄새를 퍼뜨리니까 근처 사람들이 배고프고 식당이 떠오르는 거예요.","c":1},"h":"4852d4a47c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This makes passengers think of the scent as part of the Singapore Airlines brand image.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 승객들이 그 향기를 싱가포르 항공 브랜드 이미지의 일부로 생각하게 한다.","opts":["승객들은 그 향기를 싫어해서 싱가포르 항공을 타지 않게 된다.","이것은 승객들이 싱가포르 항공의 브랜드 이미지를 향기로만 만든다.","이것은 승객들이 그 향기를 싱가포르 항공 브랜드 이미지의 일부로 생각하게 한다.","승객들은 이 향기가 다른 항공사의 브랜드 이미지라고 생각한다."],"r":{"a":"3) 이것은 승객들이 그 향기를 싱가포르 항공 브랜드 이미지의 일부로 생각하게 한다.","ev":"6번 문장","s":[[6,"This makes passengers think of the scent as part of the Singapore Airlines brand image.","이것은 승객들이 그 향기를 싱가포르 항공 브랜드 이미지의 일부로 생각하도록 한다."]],"w":"think of A as B는 ‘A를 B로 생각하다’예요. 향기(the scent)를 브랜드 이미지의 일부(part of …)로 생각하게 한다는 뜻이에요.","c":3},"h":"8259a890a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["싱가포르 항공은 버거를 굽는 냄새를 퍼뜨린다.","기업들은 향기의 힘을 잊어버렸다.","싱가포르 항공은 여러 나라의 꽃을 사용했다.","버거킹의 냄새는 근처 사람들이 그 식당을 생각하게 한다."],"opts":["Singapore Airlines spreads the smell of grilling burgers.","Companies have forgotten the power of scents.","Singapore Airlines used flowers from many countries.","Burger King’s smell makes people nearby think of the restaurant."],"r":{"a":"4) Burger King’s smell makes people nearby think of the restaurant.","ev":"4, 8~10번 문장","s":[[4,"They used six kinds of flowers that are native to Singapore to create a signature scent.","그들은 자신을 대표하는 향기를 만들기 위해 싱가포르가 원산지인 여섯 종류의 꽃을 사용했다."],[8,"It uses its vents to spread the smell of grilling burgers.","버거킹은 버거를 굽는 냄새를 퍼뜨리기 위해 그곳의 통풍구를 이용한다."],[9,"This makes people nearby feel hungry and think of the restaurant.","이것은 (식당) 근처에 있는 사람들이 배고픔을 느끼고 그 식당을 생각하게 만든다."],[10,"Clearly, companies have learned the power of scents!","분명히 기업들은 향기의 위력을 알게 된 것이다!"]],"w":"9번에서 근처 사람들이 배고픔을 느끼고 그 식당을 생각하게 된다고 해요. 버거 냄새는 버거킹이에요(8번). 기업들은 향기의 힘을 알게 되었고(10번), 꽃은 싱가포르가 원산지예요(4번).","c":4},"h":"7c11dca432"},{"n":9,"t":"sum","q":"Scents can strongly affect our (A), so some companies use specific scents to stay in the minds of (B).","ko":"향기는 우리의 (A)에 강하게 영향을 줄 수 있어서, 몇몇 회사들은 (B)의 마음속에 머물기 위해 특정한 향기를 사용한다.","oko":["(A) 돈 / (B) 고객","(A) 기억 / (B) 고객","(A) 기억 / (B) 직원","(A) 날씨 / (B) 항공사","(A) 시력 / (B) 식당"],"opts":["(A) money / (B) customers","(A) memory / (B) customers","(A) memory / (B) employees","(A) weather / (B) airlines","(A) vision / (B) restaurants"],"r":{"a":"2) (A) memory / (B) customers","ev":"1~2번 문장","s":[[1,"Scents can have a powerful effect on our memory.","향기는 우리 기억에 강력한 영향을 미칠 수 있다."],[2,"For this reason, some companies use specific scents to stay in the minds of customers.","이런 이유로 몇몇 회사들은 고객의 마음속에 머물기 위해 특정한 향기를 사용한다."]],"w":"1번에서 향기가 우리 memory(기억)에 영향을 준다고 하고, 2번에서 회사들이 customers(고객)의 마음속에 머물기 위해 향기를 쓴다고 해요.","c":2},"h":"fa40bd76cd"},{"n":10,"t":"fill","q":"Singapore Airlines uses a [A] scent made from flowers, and it is used on [B] and in various places on the plane.","ko":"싱가포르 항공은 꽃으로 만든 [A] 향기를 쓰고, 그것은 [B]와 기내의 여러 장소에 사용된다.","bank":["signature","uniforms","burgers","vents","brand","memory"],"bko":{"signature":"대표하는, 특유의","uniforms":"제복","burgers":"버거","vents":"통풍구","brand":"브랜드","memory":"기억"},"r":{"a":"[A] signature, [B] uniforms","ev":"4~5번 문장","s":[[4,"They used six kinds of flowers that are native to Singapore to create a signature scent.","그들은 자신을 대표하는 향기를 만들기 위해 싱가포르가 원산지인 여섯 종류의 꽃을 사용했다."],[5,"The scent is used on flight attendant uniforms and in various places on the plane.","그 향기는 승무원 제복과 기내의 여러 장소에 사용된다."]],"w":"4번 a signature scent(대표 향기), 5번 on flight attendant uniforms and in various places on the plane에서 가져왔어요. burgers와 vents는 버거킹 이야기예요.","c":null},"h":"8157aa73e9"}]},{"u":4,"id":"nl2-04-2","no":2,"ko":"누군가 쳐다보는 기분이 들어","items":[{"n":1,"t":"tf","q":"Pareidolia makes people see faces in everyday objects.","ko":"변상증은 사람들이 일상적인 물건에서 얼굴을 보게 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It causes people to see faces in everyday objects.","그것은 사람들이 일상적인 물건에서 얼굴을 보게 한다."]],"w":"3번 문장에 cause people to see faces in everyday objects가 있어요.","c":"T"},"h":"f8b4b7a4e9"},{"n":2,"t":"tf","q":"Pareidolia is a disease that stops the brain from working.","ko":"변상증은 뇌가 작동하지 못하게 하는 병이다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Also, it is a normal function of the brain.","또한, 그것은 뇌의 정상적인 기능이다."]],"w":"10번에서 pareidolia는 뇌의 normal function(정상적인 기능)이라고 해요. 병이 아니에요.","c":"F"},"h":"c0e1afe9d5"},{"n":3,"t":"tf","q":"Recognizing faces in the dark was not a useful skill long ago.","ko":"오래전에 어둠 속에서 얼굴을 알아보는 것은 유용한 기술이 아니었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Being able to recognize faces in the dark or hidden in the jungle was a useful skill.","어둠 속에 있거나 정글에 숨겨진 얼굴을 알아볼 수 있는 것은 유용한 기술이었다."]],"w":"8번에서 어둠 속이나 정글에 숨은 얼굴을 알아보는 것은 a useful skill(유용한 기술)이었다고 해요.","c":"F"},"h":"5b71a36165"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Being able to recognize faces in the dark or hidden in the jungle was a useful skill.)","ko":"어둠 속에 있거나 정글에 숨겨진 얼굴을 □□ 수 있는 것은 유용한 기술이었다.","opts":["잊어버리다","만들다","알아보다","그리다"],"word":"recognize","r":{"a":"3) 알아보다","ev":"8번 문장","s":[[8,"Being able to recognize faces in the dark or hidden in the jungle was a useful skill.","어둠 속에 있거나 정글에 숨겨진 얼굴을 알아볼 수 있는 것은 유용한 기술이었다."]],"w":"숨은 얼굴을 찾아서 ‘알아보는’ 능력이 적을 막는 데 도움이 되었어요(9번). recognize = 알아보다, 인식하다.","c":3},"h":"569a070d4e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It prevented our enemies from sneaking up on us.)","ko":"그것은 우리의 적이 우리에게 □□□ 것을 막았다.","opts":["도망가는","몰래 다가가는","소리치는","잠드는"],"word":"sneaking","r":{"a":"2) 몰래 다가가는","ev":"9번 문장","s":[[9,"It prevented our enemies from sneaking up on us.","그것은 우리의 적이 우리에게 몰래 접근하는 것을 막았다."]],"w":"적이 우리에게 몰래 다가오는 것을 막았다는 뜻이에요. 얼굴을 알아보면 숨어서 다가오는 적을 미리 알 수 있기 때문이에요.","c":2},"h":"ea0878d889"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is why we see the three holes of the bowling ball as a shocked face!","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 우리가 볼링공의 세 개의 구멍을 충격받은 얼굴로 보는 이유이다!","opts":["볼링공이 충격을 받은 것","구름 속에서 얼굴을 보는 것","적이 몰래 다가오는 것","뇌가 부분들을 합쳐 완전한 이미지를 만들려고 하는 것"],"r":{"a":"4) 뇌가 부분들을 합쳐 완전한 이미지를 만들려고 하는 것","ev":"11~12번 문장","s":[[11,"Our brain regularly tries to put parts together to form a full image.","우리의 뇌는 완전한 이미지를 형성하기 위해 부분들을 합치려고 자주 애쓴다."],[12,"This is why we see the three holes of the bowling ball as a shocked face!","이것이 우리가 볼링공의 세 개의 구멍을 충격받은 얼굴로 보는 이유이다!"]],"w":"This is why ~는 바로 앞 내용이 이유라는 뜻이에요. 11번의 뇌가 부분들을 합쳐 완전한 이미지를 만들려고 한다는 것이 구멍 세 개를 얼굴로 보는 이유예요.","c":4},"h":"20b8d6eb2c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It prevented our enemies from sneaking up on us.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 우리의 적이 우리에게 몰래 접근하는 것을 막았다.","opts":["그것은 우리의 적이 우리에게 몰래 다가오는 것을 막아 주었다.","그것은 우리가 적에게 몰래 다가가는 것을 막았다.","그것은 우리의 적이 우리를 알아보지 못하게 했다.","그것은 우리가 적에게 숨는 것을 도왔다."],"r":{"a":"1) 그것은 우리의 적이 우리에게 몰래 다가오는 것을 막아 주었다.","ev":"9번 문장","s":[[9,"It prevented our enemies from sneaking up on us.","그것은 우리의 적이 우리에게 몰래 접근하는 것을 막았다."]],"w":"prevent A from v-ing는 ‘A가 ~하는 것을 막다’예요. A는 our enemies이고 sneaking up on us는 우리에게 몰래 다가오는 것이라서, 적이 다가오는 것을 막았다는 뜻이에요.","c":1},"h":"b7620771f1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["변상증은 구름을 볼 때만 일어난다.","볼링공에서는 어떤 얼굴도 볼 수 없다.","변상증은 오래전에 사람들이 살아남도록 도왔다.","우리의 뇌는 이미지를 부분으로 나누려고 한다."],"opts":["Pareidolia happens only when we look at clouds.","People can never see a face in a bowling ball.","Pareidolia helped people survive long ago.","Our brain tries to separate an image into parts."],"r":{"a":"3) Pareidolia helped people survive long ago.","ev":"1, 3, 5, 7, 11번 문장","s":[[1,"Have you ever seen a face in the clouds?","당신은 구름 속에서 얼굴을 본 적이 있는가?"],[3,"It causes people to see faces in everyday objects.","그것은 사람들이 일상적인 물건에서 얼굴을 보게 한다."],[5,"You can probably see a shocked face.","당신은 아마 충격을 받은 얼굴을 볼 수 있을 것이다."],[7,"One reason is because it helped us survive long ago.","한 가지 이유는 그것이 오래전에 우리가 생존하도록 도와주었기 때문이다."],[11,"Our brain regularly tries to put parts together to form a full image.","우리의 뇌는 완전한 이미지를 형성하기 위해 부분들을 합치려고 자주 애쓴다."]],"w":"7번에서 변상증이 오래전에 우리가 생존하도록 도왔다고 해요. 변상증은 일상적인 물건에서도 생기고(3번), 볼링공에서는 충격받은 얼굴이 보이며(5번), 뇌는 부분을 합치려고 해요(11번).","c":3},"h":"21d75bf015"},{"n":9,"t":"sum","q":"We see faces in objects because it helped us (A) long ago, and because our brain tries to (B) parts together.","ko":"우리가 물체에서 얼굴을 보는 것은 그것이 오래전에 우리가 (A)하도록 도왔고, 우리의 뇌가 부분들을 함께 (B)려고 하기 때문이다.","oko":["(A) 잊어버리다 / (B) 놓다","(A) 살아남다 / (B) 가져가다","(A) 숨다 / (B) 놓다","(A) 여행하다 / (B) 부수다","(A) 살아남다 / (B) 놓다"],"opts":["(A) forget / (B) put","(A) survive / (B) take","(A) hide / (B) put","(A) travel / (B) break","(A) survive / (B) put"],"r":{"a":"5) (A) survive / (B) put","ev":"7, 10~11번 문장","s":[[7,"One reason is because it helped us survive long ago.","한 가지 이유는 그것이 오래전에 우리가 생존하도록 도와주었기 때문이다."],[10,"Also, it is a normal function of the brain.","또한, 그것은 뇌의 정상적인 기능이다."],[11,"Our brain regularly tries to put parts together to form a full image.","우리의 뇌는 완전한 이미지를 형성하기 위해 부분들을 합치려고 자주 애쓴다."]],"w":"7번에서 오래전에 survive(살아남다)하도록 도왔다고 하고, 11번에서 뇌가 put parts together(부분들을 합치다)한다고 해요.","c":5},"h":"521e8e66f0"},{"n":10,"t":"fill","q":"Being able to [A] faces in the dark was a useful skill because it [B] our enemies from sneaking up on us.","ko":"어둠 속에서 얼굴을 [A] 수 있는 것은 그것이 적이 우리에게 몰래 다가오는 것을 [B] 때문에 유용한 기술이었다.","bank":["recognize","prevented","forget","jungle","decided","enjoyed"],"bko":{"recognize":"알아보다","prevented":"막았다","forget":"잊다","jungle":"정글","decided":"결정했다","enjoyed":"즐겼다"},"r":{"a":"[A] recognize, [B] prevented","ev":"8~9번 문장","s":[[8,"Being able to recognize faces in the dark or hidden in the jungle was a useful skill.","어둠 속에 있거나 정글에 숨겨진 얼굴을 알아볼 수 있는 것은 유용한 기술이었다."],[9,"It prevented our enemies from sneaking up on us.","그것은 우리의 적이 우리에게 몰래 접근하는 것을 막았다."]],"w":"8번 Being able to recognize faces …, 9번 It prevented our enemies from sneaking up on us에서 가져왔어요.","c":null},"h":"f2703dfdf6"}]},{"u":4,"id":"nl2-04-3","no":3,"ko":"이젠 사용 금지!","items":[{"n":1,"t":"tf","q":"Microbeads are usually bigger than two millimeters wide.","ko":"마이크로비즈는 보통 폭이 2밀리미터보다 크다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"These microbeads are usually less than two millimeters wide.","이런 마이크로비즈는 보통 폭이 2밀리미터도 안 된다."]],"w":"2번에서 microbeads는 usually less than two millimeters wide(보통 폭이 2밀리미터도 안 된다)라고 해요.","c":"F"},"h":"20380b233e"},{"n":2,"t":"tf","q":"Microbeads go down the bathroom drain and end up in lakes, rivers, and oceans.","ko":"마이크로비즈는 화장실 하수구로 내려가 결국 호수, 강, 바다로 흘러 들어간다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"As you wash, microbeads go down the bathroom drain.","당신이 씻을 때 마이크로비즈는 화장실 하수구로 내려간다."],[6,"Eventually, they end up in lakes, rivers, and oceans.","결국 그것들은 호수, 강, 바다로 흘러 들어가게 된다."]],"w":"5번에서 하수구로 내려가고, 6번에서 결국 호수, 강, 바다로 간다고 해요.","c":"T"},"h":"73f27be644"},{"n":3,"t":"tf","q":"Only the United States has banned the use of microbeads.","ko":"미국만이 마이크로비즈 사용을 금지했다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"For this reason, the United States banned companies from using microbeads in their products in 2015.","이런 이유로 미국은 2015년에 기업들이 제품에 마이크로비즈를 사용하는 것을 금지했다."],[10,"Many other countries have also done the same.","다른 많은 나라들 역시 똑같이 해 오고 있다."]],"w":"9번에서 미국이 금지했고, 10번에서 다른 많은 나라도 똑같이 해 왔다고 해요. 미국만 한 것은 아니에요.","c":"F"},"h":"993868f861"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (There, they absorb dangerous chemicals in the water and are eaten by fish.)","ko":"그곳에서 그것들은 물속에 있는 위험한 화학 물질을 □□□ 물고기에게 먹힌다.","opts":["씻어 내다","흡수하다","버리다","만들다"],"word":"absorb","r":{"a":"2) 흡수하다","ev":"7번 문장","s":[[7,"There, they absorb dangerous chemicals in the water and are eaten by fish.","그곳에서 그것들은 물속에 있는 위험한 화학 물질을 흡수하고 물고기에게 먹힌다."]],"w":"마이크로비즈가 물속의 화학 물질을 몸에 빨아들인 채 물고기에게 먹혀요. 그래서 사람에게까지 피해가 이어져요(8번). absorb = 흡수하다.","c":2},"h":"3a9b1d9281"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (For this reason, the United States banned companies from using microbeads in their products in 2015.)","ko":"이런 이유로 미국은 2015년에 기업들이 제품에 마이크로비즈를 사용하는 것을 □□□.","opts":["허락했다","돕기로 했다","광고했다","금지했다"],"word":"banned","r":{"a":"4) 금지했다","ev":"8~9번 문장","s":[[8,"This means that people who eat seafood could be harmed by microbeads.","이는 해산물을 먹는 사람들이 마이크로비즈에 의해 해를 입을 수 있다는 것을 의미한다."],[9,"For this reason, the United States banned companies from using microbeads in their products in 2015.","이런 이유로 미국은 2015년에 기업들이 제품에 마이크로비즈를 사용하는 것을 금지했다."]],"w":"8번에서 마이크로비즈가 사람을 해칠 수 있다고 했으니, 미국은 사용을 못 하게 ‘금지한’ 거예요. ban A from v-ing = A가 ~하는 것을 금지하다.","c":4},"h":"f97e8e0635"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nCompanies use them because they help people feel cleaner.","ko":"밑줄 친 them이 가리키는 것은?","sko":"기업들은 그것들이 사람들이 더 깨끗하다고 느끼도록 돕기 때문에 그것들을 사용한다.","opts":["마이크로비즈","물고기","비누와 바디 워시","기업들"],"r":{"a":"1) 마이크로비즈","ev":"2~3번 문장","s":[[2,"These microbeads are usually less than two millimeters wide.","이런 마이크로비즈는 보통 폭이 2밀리미터도 안 된다."],[3,"Companies use them because they help people feel cleaner.","기업들은 그것들(마이크로비즈)이 사람들이 더 깨끗하다고 느끼도록 돕기 때문에 그것들을 사용한다."]],"w":"2번 These microbeads에 이어 3번에서 기업들이 그것들(them)을 쓰고, they도 마이크로비즈예요. 비누와 바디 워시는 마이크로비즈가 들어 있는 제품이에요.","c":1},"h":"d5ffb13471"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This means that people who eat seafood could be harmed by microbeads.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 해산물을 먹는 사람들이 마이크로비즈에 의해 해를 입을 수 있다는 것을 의미한다.","opts":["이는 해산물을 먹지 않는 사람들만 마이크로비즈에 의해 해를 입을 수 있다는 것을 의미한다.","이는 마이크로비즈가 해산물을 먹는 사람들에게 도움이 된다는 것을 의미한다.","이는 해산물을 먹는 사람들이 마이크로비즈에 의해 해를 입을 수 있다는 것을 의미한다.","이는 해산물을 먹는 사람들이 마이크로비즈를 만들 수 있다는 것을 의미한다."],"r":{"a":"3) 이는 해산물을 먹는 사람들이 마이크로비즈에 의해 해를 입을 수 있다는 것을 의미한다.","ev":"8번 문장","s":[[8,"This means that people who eat seafood could be harmed by microbeads.","이는 해산물을 먹는 사람들이 마이크로비즈에 의해 해를 입을 수 있다는 것을 의미한다."]],"w":"could be harmed by는 ‘~에 의해 해를 입을 수 있다’는 수동이에요. 마이크로비즈를 먹은 물고기를 먹는 사람에게 해가 갈 수 있다는 뜻이에요.","c":3},"h":"677a39a429"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마이크로비즈는 목욕 제품을 더 싸게 만들려고 사용된다.","물고기는 마이크로비즈를 절대 먹지 않는다.","마이크로비즈는 욕실에 남아 물에 들어가지 않는다.","많은 현대의 목욕 제품에는 작은 플라스틱 조각이 들어 있다."],"opts":["Microbeads are used to make bath products cheaper.","Fish never eat microbeads.","Microbeads stay in the bathroom and never go into the water.","Many modern bath products contain small pieces of plastic."],"r":{"a":"4) Many modern bath products contain small pieces of plastic.","ev":"1, 3, 5, 7번 문장","s":[[1,"Many modern bath products, such as soaps and body washes, contain small pieces of plastic known as “microbeads.”","비누와 바디 워시 같은 많은 현대의 목욕 제품에 ‘마이크로비즈’라고 알려진 작은 플라스틱 조각이 들어 있다."],[3,"Companies use them because they help people feel cleaner.","기업들은 그것들(마이크로비즈)이 사람들이 더 깨끗하다고 느끼도록 돕기 때문에 그것들을 사용한다."],[5,"As you wash, microbeads go down the bathroom drain.","당신이 씻을 때 마이크로비즈는 화장실 하수구로 내려간다."],[7,"There, they absorb dangerous chemicals in the water and are eaten by fish.","그곳에서 그것들은 물속에 있는 위험한 화학 물질을 흡수하고 물고기에게 먹힌다."]],"w":"1번에서 많은 현대의 목욕 제품에 작은 플라스틱 조각이 들어 있다고 해요. 사용 이유는 사람들이 더 깨끗하다고 느끼게 하려는 것이고(3번), 물고기가 먹기도 하며(7번), 하수구를 따라 물로 들어가요(5번).","c":4},"h":"de7eadd7ef"},{"n":9,"t":"sum","q":"Microbeads go into the water and absorb (A) chemicals, so (B) who eat seafood can be harmed.","ko":"마이크로비즈는 물에 들어가 (A) 화학 물질을 흡수해서, 해산물을 먹는 (B)이 해를 입을 수 있다.","oko":["(A) 깨끗한 / (B) 사람들","(A) 위험한 / (B) 비누","(A) 위험한 / (B) 기업들","(A) 자연의 / (B) 사람들","(A) 위험한 / (B) 사람들"],"opts":["(A) clean / (B) people","(A) dangerous / (B) soaps","(A) dangerous / (B) companies","(A) natural / (B) people","(A) dangerous / (B) people"],"r":{"a":"5) (A) dangerous / (B) people","ev":"7~8번 문장","s":[[7,"There, they absorb dangerous chemicals in the water and are eaten by fish.","그곳에서 그것들은 물속에 있는 위험한 화학 물질을 흡수하고 물고기에게 먹힌다."],[8,"This means that people who eat seafood could be harmed by microbeads.","이는 해산물을 먹는 사람들이 마이크로비즈에 의해 해를 입을 수 있다는 것을 의미한다."]],"w":"7번에서 마이크로비즈가 dangerous chemicals(위험한 화학 물질)를 흡수하고, 8번에서 해산물을 먹는 people(사람들)이 해를 입을 수 있다고 해요.","c":5},"h":"8bbd8dffc7"},{"n":10,"t":"fill","q":"In 2015, the United States [A] companies from using microbeads, and many other countries have also done the [B].","ko":"2015년에 미국은 기업들이 마이크로비즈를 사용하는 것을 [A]고, 다른 많은 나라도 [B] 것을 해 왔다.","bank":["banned","same","washed","opposite","sold","different"],"bko":{"banned":"금지했다","same":"같은","washed":"씻었다","opposite":"반대인","sold":"팔았다","different":"다른"},"r":{"a":"[A] banned, [B] same","ev":"9~10번 문장","s":[[9,"For this reason, the United States banned companies from using microbeads in their products in 2015.","이런 이유로 미국은 2015년에 기업들이 제품에 마이크로비즈를 사용하는 것을 금지했다."],[10,"Many other countries have also done the same.","다른 많은 나라들 역시 똑같이 해 오고 있다."]],"w":"9번 the United States banned companies from using microbeads, 10번 Many other countries have also done the same에서 가져왔어요. opposite는 금지의 반대라서 맞지 않아요.","c":null},"h":"794a478bef"}]},{"u":4,"id":"nl2-04-4","no":4,"ko":"바그다드 동물원 구출 작전","items":[{"n":1,"t":"tf","q":"Lawrence Anthony saw a news report about the Iraq War.","ko":"Lawrence Anthony는 이라크 전쟁에 대한 뉴스 보도를 보았다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In 2003, a South African environmentalist named Lawrence Anthony saw a news report about the Iraq War.","2003년에 Lawrence Anthony(로렌스 앤서니)라는 남아프리카 공화국의 환경 운동가는 이라크 전쟁에 대한 뉴스 보도를 보았다."]],"w":"1번 문장에 saw a news report about the Iraq War가 그대로 나와요.","c":"T"},"h":"87aa778a10"},{"n":2,"t":"tf","q":"The Baghdad Zoo reopened to the public after five years.","ko":"바그다드 동물원은 5년 후에 대중에게 다시 문을 열었다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Thanks to everyone’s efforts, the Baghdad Zoo reopened to the public just six months later.","모두의 노력 덕택에, 바그다드 동물원은 6개월 만에 대중에게 다시 문을 열었다."]],"w":"12번에서 바그다드 동물원은 just six months later(6개월 만에) 다시 열었다고 해요.","c":"F"},"h":"05d49340d9"},{"n":3,"t":"tf","q":"Iraqi and US soldiers worked together to help the animals.","ko":"이라크군과 미군은 동물들을 돕기 위해 함께 일했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Iraqi and US soldiers worked together to help the animals, even though they had been fighting just weeks earlier.","비록 이라크군과 미군은 몇 주 전만 해도 싸우고 있었지만, 동물들을 돕기 위해 함께 일했다."]],"w":"9번 문장 Iraqi and US soldiers worked together to help the animals가 그대로 나와요.","c":"T"},"h":"3784362bee"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Anthony immediately flew to Baghdad, Iraq, to help.)","ko":"Anthony는 도와주기 위해 □□ 이라크의 바그다드로 날아갔다.","opts":["천천히","즉시","나중에","우연히"],"word":"immediately","r":{"a":"2) 즉시","ev":"2~3번 문장","s":[[2,"Due to the war, animals in the country’s biggest zoo were dying.","그 전쟁으로 인해 그 나라의 가장 큰 동물원에 있는 동물들이 죽어가고 있었다."],[3,"Anthony immediately flew to Baghdad, Iraq, to help.","Anthony는 도와주기 위해 즉시 이라크의 바그다드로 날아갔다."]],"w":"2번에서 동물들이 죽어 가고 있었기 때문에 Anthony는 서둘러 간 거예요. immediately = 즉시, 곧바로.","c":2},"h":"21579a1ac7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (International organizations around the world sent supplies and money to the zoo.)","ko":"세계의 국제기구들이 동물원에 □□□과 돈을 보냈다.","opts":["동물들","편지","보급품","경비원"],"word":"supplies","r":{"a":"3) 보급품","ev":"11번 문장","s":[[11,"International organizations around the world sent supplies and money to the zoo.","세계의 국제기구들이 동물원에 보급품과 돈을 보냈다."]],"w":"국제기구들이 동물원을 돕기 위해 돈과 함께 보낸 것이므로, supplies는 필요한 물건인 ‘보급품’이에요.","c":3},"h":"d8619cd8e1"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?
