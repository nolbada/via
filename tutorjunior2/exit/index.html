<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩튜터 주니어 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"rj2-01-1","no":1,"ko":"왜 잠그지 않는 거야!","items":[{"n":1,"t":"tf","q":"Jackets are made to fit the body loosely.","ko":"재킷은 몸에 헐렁하게 맞도록 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Jackets are made to fit the body tightly.","재킷은 몸에 꼭 맞게 만들어진다."]],"w":"4번 문장에서 재킷은 몸에 꼭 맞게(tightly) 만들어진다고 해요. 헐렁하다는 말은 반대예요.","c":"F"},"h":"852fc6b605"},{"n":2,"t":"tf","q":"Edward VII couldn't close the bottom button of his jacket.","ko":"에드워드 7세는 재킷의 맨 아래 단추를 잠글 수 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"He couldn’t close the bottom button of his jacket!","그는 재킷의 맨 아래 단추를 잠글 수가 없었다!"]],"w":"11번 문장에 He couldn't close the bottom button of his jacket!이 그대로 나와요.","c":"T"},"h":"86e3a2454f"},{"n":3,"t":"tf","q":"People kept buttoning their bottom button to show respect to Edward VII.","ko":"사람들은 에드워드 7세에게 존경을 보이기 위해 맨 아래 단추를 계속 잠갔다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"To show respect to him, people stopped buttoning their bottom button as well.","그에 대한 존경을 표하기 위해, 사람들도 역시 맨 아래 단추를 잠그는 것을 멈췄다."]],"w":"12번 문장에서 사람들은 존경을 보이려고 맨 아래 단추 잠그는 것을 멈췄어요(stopped buttoning). 계속 잠갔다는 말은 반대예요.","c":"F"},"h":"11e207f6ca"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One simple theory behind this is that it is practical.)","ko":"이것 뒤에 숨겨진 한 가지 간단한 이론은 그것이 ( )이라는 것이다.","opts":["위험한","비싼","실용적인","유행하는"],"word":"practical","r":{"a":"3) 실용적인","ev":"3번, 5번 문장","s":[[3,"One simple theory behind this is that it is practical.","이것 뒤에 숨겨진 한 가지 간단한 이론은 그것이 실용적이라는 것이다."],[5,"With the bottom button open, the person can move more easily.","맨 아래 단추가 열려 있어서, 사람은 더 쉽게 움직일 수 있다."]],"w":"3번은 첫 번째 이론이고, 5번에서 단추가 열려 있으면 더 쉽게 움직일 수 있다고 해요. 쓸모가 있다는 뜻의 '실용적인'이 알맞아요.","c":3},"h":"f4d642bfa9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Edward VII loved eating so much that he was overweight.)","ko":"에드워드 7세는 먹는 것을 너무 좋아해서 ( )이었다.","opts":["과체중인","키가 큰","유명한","게으른"],"word":"overweight","r":{"a":"1) 과체중인","ev":"10~11번 문장","s":[[10,"However, Edward VII loved eating so much that he was overweight.","하지만, 에드워드 7세는 먹는 것을 너무 좋아해서 과체중이었다."],[11,"He couldn’t close the bottom button of his jacket!","그는 재킷의 맨 아래 단추를 잠글 수가 없었다!"]],"w":"먹는 것을 너무 좋아해서 단추를 잠그지 못했다고 하니(11번) '체중이 많이 나가는'이라는 뜻의 과체중이에요.","c":1},"h":"ea24ed38a3"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is especially true for sitting down.","ko":"밑줄 친 This이(가) 가리키는 것은?","sko":"이것은 특히 앉을 때에 해당된다.","opts":["재킷이 몸에 꼭 맞게 만들어진다는 것","맨 아래 단추가 열려 있으면 더 쉽게 움직일 수 있다는 것","에드워드 7세가 과체중이었다는 것","사람들이 단추를 잠그지 않는다는 것"],"r":{"a":"2) 맨 아래 단추가 열려 있으면 더 쉽게 움직일 수 있다는 것","ev":"5~6번 문장","s":[[5,"With the bottom button open, the person can move more easily.","맨 아래 단추가 열려 있어서, 사람은 더 쉽게 움직일 수 있다."],[6,"This is especially true for sitting down.","이것은 특히 앉을 때에 해당된다."]],"w":"This는 바로 앞 5번 문장 내용을 가리켜요. 단추가 열려 있으면 더 쉽게 움직이는데, 앉을 때 특히 그렇다는 뜻이에요.","c":2},"h":"655b5dd8a0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Over time, this has become today's practice for jacket buttons.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시간이 지나면서, 이것은 재킷 단추에 대한 오늘날의 관행이 되었다.","opts":["이 관행은 오늘날 완전히 사라졌다.","에드워드 7세는 오늘날의 재킷 단추를 처음 만들었다.","재킷 단추는 시간이 지나면서 점점 더 커졌다.","시간이 지나면서 이것은 오늘날 재킷 단추를 다루는 관행이 되었다."],"r":{"a":"4) 시간이 지나면서 이것은 오늘날 재킷 단추를 다루는 관행이 되었다.","ev":"13번 문장","s":[[13,"Over time, this has become today’s practice for jacket buttons.","시간이 지나면서, 이것은 재킷 단추에 대한 오늘날의 관행이 되었다."]],"w":"has become today's practice는 '오늘날의 관행이 되었다'는 뜻이에요. 사라졌다는 말도, 단추 크기 이야기도 아니에요.","c":4},"h":"5eb5502276"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우아한 정장은 에드워드 7세가 웨일스의 왕자였을 때 궁정에서 인기가 있었다.","재킷의 맨 아래 단추는 만들기 어려워서 열어 둔다.","사람들은 화가 나서 왕에게 항의하려고 단추를 잠그지 않았다.","에드워드 7세는 말랐기 때문에 재킷이 너무 컸다."],"opts":["Elegant suits were popular in court when Edward VII was the Prince of Wales.","The bottom button of a jacket is left open because it is hard to make.","People stopped buttoning their jackets to protest against the king.","Edward VII was thin, so his jackets were too big."],"r":{"a":"1) Elegant suits were popular in court when Edward VII was the Prince of Wales.","ev":"9~10번, 12번 문장","s":[[9,"When he was the Prince of Wales, elegant suits were popular in court.","그가 웨일스의 왕자였을 때, 우아한 정장은 궁정에서 인기가 있었다."],[10,"However, Edward VII loved eating so much that he was overweight.","하지만, 에드워드 7세는 먹는 것을 너무 좋아해서 과체중이었다."],[12,"To show respect to him, people stopped buttoning their bottom button as well.","그에 대한 존경을 표하기 위해, 사람들도 역시 맨 아래 단추를 잠그는 것을 멈췄다."]],"w":"9번에 그대로 나와요. 단추를 열어 둔 이유는 만들기 어려워서가 아니고(3~6번), 사람들은 존경을 보이려고 따라 했고(12번), 에드워드 7세는 과체중이었어요(10번).","c":1},"h":"0e1f2643b8"},{"n":9,"t":"sum","q":"One theory says an open bottom button helps people (A) more easily. Another says Edward VII could not (B) his bottom button, so people copied him.","ko":"한 이론은 맨 아래 단추가 열려 있으면 사람들이 더 쉽게 (A)할 수 있다고 한다. 다른 이론은 에드워드 7세가 맨 아래 단추를 (B)할 수 없어서 사람들이 그를 따라 했다고 한다.","oko":["(A) 먹다 / (B) 잠그다","(A) 움직이다 / (B) 열다","(A) 움직이다 / (B) 사다","(A) 숨다 / (B) 잠그다","(A) 움직이다 / (B) 잠그다"],"opts":["(A) eat / (B) close","(A) move / (B) open","(A) move / (B) buy","(A) hide / (B) close","(A) move / (B) close"],"r":{"a":"5) (A) move / (B) close","ev":"5번, 11~12번 문장","s":[[5,"With the bottom button open, the person can move more easily.","맨 아래 단추가 열려 있어서, 사람은 더 쉽게 움직일 수 있다."],[11,"He couldn’t close the bottom button of his jacket!","그는 재킷의 맨 아래 단추를 잠글 수가 없었다!"],[12,"To show respect to him, people stopped buttoning their bottom button as well.","그에 대한 존경을 표하기 위해, 사람들도 역시 맨 아래 단추를 잠그는 것을 멈췄다."]],"w":"5번에서 단추가 열려 있으면 더 쉽게 움직일 수 있어요(move). 11번에서 에드워드 7세는 단추를 잠그지 못했고(close), 12번에서 사람들이 따라 했어요.","c":5},"h":"0a7ba5d7a1"},{"n":10,"t":"fill","q":"King Edward VII [A] eating, so he became [B] and could not close the bottom button of his jacket.","ko":"에드워드 7세는 먹는 것을 [A]해서 [B]이(가) 되었고, 재킷의 맨 아래 단추를 잠글 수 없었다.","bank":["popular","loved","hated","overweight","elegant","practical"],"bko":{"popular":"인기 있는","loved":"좋아했다","hated":"싫어했다","overweight":"과체중인","elegant":"우아한","practical":"실용적인"},"r":{"a":"[A] loved, [B] overweight","ev":"10번 문장","s":[[10,"However, Edward VII loved eating so much that he was overweight.","하지만, 에드워드 7세는 먹는 것을 너무 좋아해서 과체중이었다."]],"w":"10번 He loved eating so much that he was overweight에서 가져왔어요. 먹는 것을 싫어했다면 과체중이 되기 어렵고, popular나 elegant는 단추를 못 잠그는 이유가 되지 않아요.","c":null},"h":"8eeb341649"}]},{"u":1,"id":"rj2-01-2","no":2,"ko":"작은 삼각형의 비밀","items":[{"n":1,"t":"tf","q":"The triangle shape was on the very first sweatshirts.","ko":"그 삼각형 모양은 최초의 맨투맨 티에 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This shape was on the very first sweatshirts.","이 모양은 최초의 맨투맨 티에 있었다."]],"w":"3번 문장에 This shape was on the very first sweatshirts가 그대로 나와요.","c":"T"},"h":"19d137be7d"},{"n":2,"t":"tf","q":"Sweatshirts were first made as party clothes.","ko":"맨투맨 티는 처음에 파티복으로 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Sweatshirts were exercise clothing.","맨투맨 티는 운동복이었다."]],"w":"7번 문장에서 맨투맨 티는 운동복(exercise clothing)이었다고 해요. 파티복은 본문에 없는 내용이에요.","c":"F"},"h":"48c09b5443"},{"n":3,"t":"tf","q":"Companies stopped using the triangle as a design feature.","ko":"회사들은 삼각형을 디자인 특징으로 사용하는 것을 그만두었다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"But many companies still include the triangle as a classic design feature.","그러나 많은 회사들이 여전히 이 삼각형을 고전적인 디자인 특징으로 포함시킨다."]],"w":"12번 문장에서 많은 회사가 여전히(still) 삼각형을 고전적인 디자인 특징으로 넣는다고 해요. 그만두었다는 말은 반대예요.","c":"F"},"h":"667214bc13"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is made from stretchable material, like the waistband on a pair of shorts.)","ko":"그것은 한 벌의 반바지에 있는 허리 밴드처럼 ( ) 소재로 만들어진다.","opts":["단단한","신축성 있는","투명한","무거운"],"word":"stretchable","r":{"a":"2) 신축성 있는","ev":"5번 문장","s":[[5,"It is made from stretchable material, like the waistband on a pair of shorts.","그것은 한 벌의 반바지에 있는 허리 밴드처럼 신축성 있는 소재로 만들어진다."]],"w":"반바지 허리 밴드는 몸에 맞게 늘어나는 소재예요. stretch(늘이다)에 가능을 뜻하는 -able이 붙어 '늘어나는, 신축성 있는'이에요.","c":2},"h":"a131df2d92"},{"n":5,"t":"vocab","  (B) wooden","(A) wiping / (B) soft"],"r":{"a":"3) (A) wiping / (B) metal","ev":"4~5번, 8번 문장","s":[[4,"His soldiers often wiped their noses on the sleeves of their jackets.","그의 군인들은 종종 재킷 소매에 콧물을 닦았다."],[5,"Napoleon didn’t like this dirty habit.","나폴레옹은 이 더러운 습관을 좋아하지 않았다."],[8,"He had metal buttons sewn onto the sleeves.","그는 소매에 금속 단추를 꿰매게 했다."]],"w":"4번에서 군인들은 소매에 코를 닦았고(wiping), 5번에서 나폴레옹이 그 습관을 싫어했어요. 8번에서 소매에 금속(metal) 단추를 꿰매게 했어요.","c":3},"h":"ba1564682f"},{"n":10,"t":"fill","q":"When the soldiers tried to wipe their noses, the rough metal [A] their faces, so they started to use [B] instead of their sleeves.","ko":"군인들이 코를 닦으려 할 때, 거친 금속이 그들의 얼굴을 [A]했고, 그래서 그들은 소매 대신 [B]을(를) 사용하기 시작했다.","bank":["scratched","soft","handkerchiefs","cleaned","equipment","wiped"],"bko":{"scratched":"긁었다","soft":"부드러운","handkerchiefs":"손수건","cleaned":"청소했다","equipment":"장비","wiped":"닦았다"},"r":{"a":"[A] scratched, [B] handkerchiefs","ev":"9번, 11번 문장","s":[[9,"Whenever the soldiers tried to wipe their noses with their sleeves, the rough metal scratched their faces.","군인들이 소매로 그들의 코를 닦으려 할 때마다, 거친 금속이 그들의 얼굴을 긁었다."],[11,"So they started to use handkerchiefs instead of their sleeves.","그래서 그들은 소매 대신에 손수건을 사용하기 시작했다."]],"w":"9번에서 거친 금속이 얼굴을 긁었고(scratched), 11번에서 그래서 소매 대신 손수건(handkerchiefs)을 쓰기 시작했어요. 장비(equipment)는 이 이야기의 흐름과 관계없는 단어예요.","c":null},"h":"171bb24755"}]},{"u":1,"id":"rj2-01-4","no":4,"ko":"수염을 기르려면 세금을~","items":[{"n":1,"t":"tf","q":"Russian men had to pay money to have beards.","ko":"러시아 남성들은 수염을 갖기 위해 돈을 내야 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Interestingly, Russian men had to pay money to have beards under the rule of Peter the Great, a powerful Russian czar.","흥미롭게도, 러시아 남성들은 강력한 러시아 군주인 표트르 대제의 통치하에서 수염을 갖기 위해 돈을 내야 했다."]],"w":"2번 문장에 Russian men had to pay money to have beards가 나와요.","c":"T"},"h":"d0a7ab60c3"},{"n":2,"t":"tf","q":"The token showed that a man had refused to pay the tax.","ko":"징표는 어떤 남성이 세금 내기를 거부했다는 것을 보여 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"And he had to carry a token which showed that he had already paid the tax.","그리고 그는 이미 세금을 지불했었다는 것을 보여주는 징표를 가지고 다녀야 했다."]],"w":"8번 문장에서 징표는 이미 세금을 냈다(had already paid)는 것을 보여 줘요. 거부했다는 말은 반대예요.","c":"F"},"h":"cfb048ea0f"},{"n":3,"t":"tf","q":"If a man refused to pay, the police shaved his beard off.","ko":"어떤 남성이 지불하기를 거부하면, 경찰은 그의 수염을 깎아 버렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"If a man refused to pay, the police shaved his beard off!","만약 어떤 남성이 (세금을) 지불하기를 거부했다면, 경찰은 그의 수염을 깎아 버렸다!"]],"w":"10번 문장에 그대로 나와요. 세금을 안 내려는 남성의 수염을 경찰이 깎아 버렸어요.","c":"T"},"h":"ab425368e4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If a man wanted to grow a beard, he had to pay a tax.)","ko":"어떤 남성이 수염을 기르기를 원했다면, 그는 ( )을 지불해야 했다.","opts":["상","세금","편지","허락"],"word":"tax","r":{"a":"2) 세금","ev":"7번, 9번 문장","s":[[7,"If a man wanted to grow a beard, he had to pay a tax.","만약 어떤 남성이 수염을 기르기를 원했다면, 그는 세금을 지불해야 했다."],[9,"Peter the Great even hired beard police to collect the beard tax.","표트르 대제는 심지어 수염 세금을 징수하기 위해 수염 경찰을 고용했다."]],"w":"수염을 기르려면 내야 하는 것이고, 9번에서 수염 경찰이 이것을 걷어(collect) 가요. 그래서 tax는 '세금'이에요.","c":2},"h":"b1c30970a3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Peter the Great even hired beard police to collect the beard tax.)","ko":"표트르 대제는 심지어 수염 세금을 ( ) 위해 수염 경찰을 고용했다.","opts":["가르치다","없애다","숨기다","징수하다"],"word":"collect","r":{"a":"4) 징수하다","ev":"9~10번 문장","s":[[9,"Peter the Great even hired beard police to collect the beard tax.","표트르 대제는 심지어 수염 세금을 징수하기 위해 수염 경찰을 고용했다."],[10,"If a man refused to pay, the police shaved his beard off!","만약 어떤 남성이 (세금을) 지불하기를 거부했다면, 경찰은 그의 수염을 깎아 버렸다!"]],"w":"경찰을 고용한 이유가 수염 세금을 '걷기' 위해서예요. 세금을 안 내면 수염을 깎았다는 내용(10번)으로도 알 수 있어요. 여기서 collect는 '징수하다'예요.","c":4},"h":"0a5d944763"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nAnd he had to carry a token which showed that he had already paid the tax.","ko":"밑줄 친 he이(가) 가리키는 것은?","sko":"그리고 그는 이미 세금을 지불했었다는 것을 보여주는 징표를 가지고 다녀야 했다.","opts":["표트르 대제","수염 경찰","수염을 기르고 싶은 남성","서유럽 남성"],"r":{"a":"3) 수염을 기르고 싶은 남성","ev":"7~8번 문장","s":[[7,"If a man wanted to grow a beard, he had to pay a tax.","만약 어떤 남성이 수염을 기르기를 원했다면, 그는 세금을 지불해야 했다."],[8,"And he had to carry a token which showed that he had already paid the tax.","그리고 그는 이미 세금을 지불했었다는 것을 보여주는 징표를 가지고 다녀야 했다."]],"w":"he는 앞 7번의 a man who wanted to grow a beard예요. 세금을 낸 사람이 그 사실을 보여 주는 징표를 가지고 다녀야 했어요.","c":3},"h":"8cef7ba525"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"At that time, many Western European men shaved, but Russian men grew long beards.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 당시에, 많은 서유럽 남성들은 면도를 했지만, 러시아 남성들은 긴 수염을 길렀다.","opts":["그 당시 서유럽 남성들은 많이 면도했지만, 러시아 남성들은 긴 수염을 길렀다.","그 당시 서유럽 남성들은 긴 수염을 길렀지만, 러시아 남성들은 면도를 했다.","그 당시 서유럽과 러시아 남성들은 모두 면도를 했다.","그 당시 서유럽 남성들은 수염 때문에 세금을 냈다."],"r":{"a":"1) 그 당시 서유럽 남성들은 많이 면도했지만, 러시아 남성들은 긴 수염을 길렀다.","ev":"5번 문장","s":[[5,"At that time, many Western European men shaved, but Russian men grew long beards.","그 당시에, 많은 서유럽 남성들은 면도를 했지만, 러시아 남성들은 긴 수염을 길렀다."]],"w":"but을 기준으로 서유럽 남성은 면도(shaved), 러시아 남성은 긴 수염(grew long beards)이에요. 두 나라가 서로 바뀌거나 같은 것은 아니고, 세금은 러시아 이야기예요(7번).","c":1},"h":"b98f70b05e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["표트르 대제는 모든 러시아 남성들에게 수염을 기르게 했다.","그 당시 서유럽 남성들은 긴 수염을 길렀다.","수염 경찰은 수염을 기른 남성들에게 돈을 주었다.","표트르 대제는 모든 러시아 남성들이 면도하게 하려고 노력했다."],"opts":["Peter the Great made all Russian men grow beards.","Western European men grew long beards at that time.","Beard police gave money to men with beards.","Peter the Great tried to make all Russian men shave."],"r":{"a":"4) Peter the Great tried to make all Russian men shave.","ev":"5~6번, 9번 문장","s":[[5,"At that time, many Western European men shaved, but Russian men grew long beards.","그 당시에, 많은 서유럽 남성들은 면도를 했지만, 러시아 남성들은 긴 수염을 길렀다."],[6,"So Peter the Great tried to make all Russian men shave.","그래서 표트르 대제는 모든 러시아 남성들이 면도하게 하려고 노력했다."],[9,"Peter the Great even hired beard police to collect the beard tax.","표트르 대제는 심지어 수염 세금을 징수하기 위해 수염 경찰을 고용했다."]],"w":"6번에 그대로 나와요. 서유럽 남성들은 면도를 했고(5번), 수염 경찰은 돈을 주는 것이 아니라 세금을 걷었어요(9번).","c":4},"h":"5e76a26576"},{"n":9,"t":"sum","q":"A Russian man with a beard had to pay a tax. Beard police (A) the tax, and men who refused had their beards (B).","ko":"수염을 기른 러시아 남성은 세금을 내야 했다. 수염 경찰은 세금을 (A)했고, 거부한 남성들은 수염을 (B)당했다.","oko":["(A) 잃어버렸다 / (B) 깎였다","(A) 징수했다 / (B) 칠해졌다","(A) 냈다 / (B) 깎였다","(A) 징수했다 / (B) 길러졌다","(A) 징수했다 / (B) 깎였다"],"opts":["(A) lost / (B) shaved off","(A) collected / (B) painted","(A) paid / (B) shaved off","(A) collected / (B) grown","(A) collected / (B) shaved off"],"r":{"a":"5) (A) collected / (B) shaved off","ev":"9~10번 문장","s":[[9,"Peter the Great even hired beard police to collect the beard tax.","표트르 대제는 심지어 수염 세금을 징수하기 위해 수염 경찰을 고용했다."],[10,"If a man refused to pay, the police shaved his beard off!","만약 어떤 남성이 (세금을) 지불하기를 거부했다면, 경찰은 그의 수염을 깎아 버렸다!"]],"w":"9번에서 수염 경찰이 세금을 징수했고(collected), 10번에서 거부하면 수염을 깎아 버렸어요(shaved off). 경찰이 세금을 냈다는 말은 없어요.","c":5},"h":"259fcd13c9"},{"n":10,"t":"fill","q":"Peter the Great wanted Russia to be [A] Western Europe. At that time, many Western European men [B], but Russian men grew long beards.","ko":"표트르 대제는 러시아가 서유럽과 [A] 나라가 되기를 원했다. 그 당시 많은 서유럽 남성들은 [B]했지만, 러시아 남성들은 긴 수염을 길렀다.","bank":["like","police","shaved","tax","grew","richer"],"bko":{"like":"~와 비슷한","police":"경찰","shaved":"면도했다","tax":"세금","grew":"길렀다","richer":"더 부유한"},"r":{"a":"[A] like, [B] shaved","ev":"3번, 5번 문장","s":[[3,"Peter the Great wanted to make the country more like Western Europe.","표트르 대제는 국가를 서유럽과 더 비슷하게 만들기를 원했다."],[5,"At that time, many Western European men shaved, but Russian men grew long beards.","그 당시에, 많은 서유럽 남성들은 면도를 했지만, 러시아 남성들은 긴 수염을 길렀다."]],"w":"3번에서 러시아를 서유럽과 '더 비슷하게(more like)' 만들고 싶어 했고, 5번에서 서유럽 남성은 면도했어요(shaved). 러시아 남성은 길렀으니(grew) [B]에는 shaved가 맞아요.","c":null},"h":"7add548746"}]},{"u":2,"id":"rj2-02-1","no":1,"ko":"파인애플은 맛있기만 한 게 아니야","items":[{"n":1,"t":"tf","q":"The outside of the unusual fruit was rough like a pinecone.","ko":"그 특이한 과일의 겉은 솔방울처럼 거칠었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The outside was rough like a pinecone.","겉은 솔방울처럼 거칠었다."]],"w":"6번 문장에 The outside was rough like a pinecone이 나와요. 속은 사과 같았어요(7번).","c":"T"},"h":"3597dde10f"},{"n":2,"t":"tf","q":"European farmers could grow pineapples easily.","ko":"유럽의 농부들은 파인애플을 쉽게 재배할 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"However, the environment was not good for growing them.","그러나 환경이 파인애플을 재배하기에 좋지 않았다."]],"w":"10번 문장에서 환경이 파인애플을 재배하기에 좋지 않았다고 해요. 쉽게 키웠다는 말은 반대예요.","c":"F"},"h":"edf86f0063"},{"n":3,"t":"tf","q":"Hosts used pineapples as decorations or in dishes.","ko":"주인들은 파인애플을 장식으로 또는 요리에 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"Hosts used pineapples as decorations or in dishes when guests visited them.","손님들이 방문하면 주인은 장식으로 또는 요리에 파인애플을 사용했다."]],"w":"13번 문장에 Hosts used pineapples as decorations or in dishes가 나와요.","c":"T"},"h":"bdb34d7efe"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For this reason, pineapples were very rare, and they became the perfect gift for guests.)","ko":"이러한 이유로, 파인애플은 매우 ( ), 그것은 손님을 위한 완벽한 선물이 되었다.","opts":["흔한","값싼","희귀한","달콤한"],"word":"rare","r":{"a":"3) 희귀한","ev":"11~12번 문장","s":[[11,"It took almost two hundred years to successfully cultivate pineapples.","성공적으로 파인애플을 재배하는 데 거의 200년이 걸렸다."],[12,"For this reason, pineapples were very rare, and they became the perfect gift for guests.","이러한 이유로, 파인애플은 매우 희귀했고, 그것은 손님을 위한 완벽한 선물이 되었다."]],"w":"11번에서 재배에 거의 200년이 걸렸다고 했으니 파인애플은 구하기 어려웠어요. 그래서 완벽한 선물이 되었고, rare는 '희귀한'이에요.","c":3},"h":"31a32c016d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It took almost two hundred years to successfully cultivate pineapples.)","ko":"성공적으로 파인애플을 ( ) 데 거의 200년이 걸렸다.","opts":["수입하다","재배하다","요리하다","판매하다"],"word":"cultivate","r":{"a":"2) 재배하다","ev":"9~11번 문장","s":[[9,"Later, European farmers tried to grow pineapples.","후에, 유럽의 농부들은 파인애플을 재배하려고 노력했다."],[10,"However, the environment was not good for growing them.","그러나 환경이 파인애플을 재배하기에 좋지 않았다."],[11,"It took almost two hundred years to successfully cultivate pineapples.","성공적으로 파인애플을 재배하는 데 거의 200년이 걸렸다."]],"w":"9번에서 농부들이 파인애플을 grow(기르다)하려 했고, 10번에서 환경이 재배에 좋지 않았다고 해요. 그래서 cultivate는 '재배하다'예요.","c":2},"h":"d88c09849e"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis showed how much the hosts valued their guests.","ko":"밑줄 친 This이(가) 가리키는 것은?","sko":"이것은 그 주인이 얼마나 손님을 소중하게 생각하는지 보여 주었다.","opts":["주인이 파인애플을 장식이나 요리에 사용한 것","콜럼버스가 파인애플을 발견한 것","파인애플이 유럽에서 자라지 못한 것","농부들이 파인애플을 재배한 것"],"r":{"a":"1) 주인이 파인애플을 장식이나 요리에 사용한 것","ev":"13~14번 문장","s":[[13,"Hosts used pineapples as decorations or in dishes when guests visited them.","손님들이 방문하면 주인은 장식으로 또는 요리에 파인애플을 사용했다."],[14,"This showed how much the hosts valued their guests.","이것은 그 주인이 얼마나 손님을 소중하게 생각하는지 보여 주었다."]],"w":"This는 바로 앞 13번 내용을 가리켜요. 손님이 오면 장식이나 요리에 파인애플을 쓰는 모습이 주인이 손님을 소중히 여기는 마음을 보여 줘요.","c":1},"h":"5bebfcabe8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For this reason, pineapples were very rare, and they became the perfect gift for guests.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 이유로, 파인애플은 매우 희귀했고, 그것은 손님을 위한 완벽한 선물이 되었다.","opts":["파인애플은 아주 흔해서 손님에게 아무 때나 주는 선물이 되었다.","파인애플은 희귀했지만 손님에게 선물하기에는 알맞지 않았다.","이러한 이유로 손님들이 파인애플을 직접 재배하게 되었다.","이 때문에 파인애플은 아주 귀했고, 손님에게 주기에 완벽한 선물이 되었다."],"r":{"a":"4) 이 때문에 파인애플은 아주 귀했고, 손님에게 주기에 완벽한 선물이 되었다.","ev":"12번 문장","s":[[12,"For this reason, pineapples were very rare, and they became the perfect gift for guests.","이러한 이유로, 파인애플은 매우 희귀했고, 그것은 손님을 위한 완벽한 선물이 되었다."]],"w":"For this reason은 '이러한 이유로'예요. 앞의 재배가 어려웠던 이유 때문에 희귀해졌고, 그래서 손님을 위한 완벽한 선물이 되었다는 뜻이에요.","c":4},"h":"c68caed68d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["콜럼버스의 선원들은 카리브해에서 그 과일을 전부 먹어 버렸다.","파인애플의 속은 솔방울처럼 거칠다.","콜럼버스의 선원들은 그 특이한 과일을 유럽으로 가져왔다.","유럽의 농부들은 파인애플을 곧바로 성공적으로 재배했다."],"opts":["Columbus's crew ate all of the fruit in the Caribbean.","The inside of a pineapple is rough like a pinecone.","Columbus's crew brought the unusual fruit back to Europe.","European farmers grew pineapples successfully right away."],"r":{"a":"3) Columbus's crew brought the unusual fruit back to Europe.","ev":"5~6번, 8번, 11번 문장","s":[[5,"His crew found an unusual fruit.","그의 선원들은 특이한 과일을 발견했다."],[6,"The outside was rough like a pinecone.","겉은 솔방울처럼 거칠었다."],[8,"They brought the unique fruit back to Europe.","그들은 그 독특한 과일을 유럽으로 가져왔다."],[11,"It took almost two hundred years to successfully cultivate pineapples.","성공적으로 파인애플을 재배하는 데 거의 200년이 걸렸다."]],"w":"8번에 그대로 나와요. 거친 것은 속이 아니라 겉(6번)이고, 속은 사과 같았어요(7번). 재배에는 거의 200년이 걸렸어요(11번).","c":3},"h":"905586ee1f"},{"n":9,"t":"sum","q":"Pineapples were very (A) in Europe because they were hard to grow, so hosts used them to show that they (B) their guests.","ko":"파인애플은 재배하기 어려웠기 때문에 유럽에서 매우 (A)했고, 그래서 주인들은 손님을 (B)한다는 것을 보여 주려고 그것을 사용했다.","oko":["(A) 값쌌고 / (B) 소중히 여긴다","(A) 희귀했고 / (B) 잊는다","(A) 흔했고 / (B) 두려워한다","(A) 희귀했고 / (B) 소중히 여긴다","(A) 값쌌고 / (B) 잊는다"],"opts":["(A) cheap / (B) valued","(A) rare / (B) forgot","(A) common / (B) feared","(A) rare / (B) valued","(A) cheap / (B) forgot"],"r":{"a":"4) (A) rare / (B) valued","ev":"10번, 12번, 14번 문장","s":[[10,"However, the environment was not good for growing them.","그러나 환경이 파인애플을 재배하기에 좋지 않았다."],[12,"For this reason, pineapples were very rare, and they became the perfect gift for guests.","이러한 이유로, 파인애플은 매우 희귀했고, 그것은 손님을 위한 완벽한 선물이 되었다."],[14,"This showed how much the hosts valued their guests.","이것은 그 주인이 얼마나 손님을 소중하게 생각하는지 보여 주었다."]],"w":"10~11번에서 재배가 어려웠고 12번에서 매우 희귀했어요(rare). 14번에서 주인이 손님을 소중히 여긴다(valued)는 것을 보여 줬어요.","c":4},"h":"fba09d9fa9"},{"n":10,"t":"fill","q":"The outside of a pineapple was [A] like a pinecone, but the inside was like an [B].","ko":"파인애플의 겉은 솔방울처럼 [A]했지만, 속은 [B] 같았다.","bank":["rough","sweet","outside","soft","apple","rare"],"bko":{"rough":"거친","sweet":"달콤한","soft":"부드러운","apple":"사과","rare":"희귀한","outside":"겉"},"r":{"a":"[A] rough, [B] apple","ev":"6~7번 문장","s":[[6,"The outside was rough like a pinecone.","겉은 솔방울처럼 거칠었다."],[7,"However, the inside was like an apple.","하지만 속은 사과 같았다."]],"w":"6번에서 겉은 솔방울처럼 거칠었고(rough), 7번에서 속은 사과(apple) 같았다고 해요.","c":null},"h":"6eed4c2e10"}]},{"u":2,"id":"rj2-02-2","no":2,"ko":"무시무시한 음력 7월!","items":[{"n":1,"t":"tf","q":"Some Chinese people call the seventh month of the lunar calendar the “ghost month.”","ko":"어떤 중국인들은 음력 7월을 ‘귀신의 달’이라고 부른다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"So they call the seventh month the “ghost month.”","그래서 그들은 7월을 ‘귀신의 달’이라고 부른다."]],"w":"4번 문장에 they call the seventh month the 'ghost month'가 나와요. 죽은 사람들의 영혼이 이승으로 돌아올 수 있다고 믿기 때문이에요(3번).","c":"T"},"h":"490e5b74a3"},{"n":2,"t":"tf","q":"Chinese people often move into a new house or get married in the ghost month.","ko":"중국인들은 귀신의 달에 새집으로 이사하거나 결혼을 자주 한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"So they do not move into a new house or get married.","그래서 그들은 새집으로 이사를 하거나 결혼을 하지 않는다."]],"w":"6번 문장에서 이 기간에는 새집으로 이사하거나 결혼하지 않는다고 해요. 자주 한다는 말은 반대예요.","c":"F"},"h":"eda6fad885"},{"n":3,"t":"tf","q":"Some people burn paper money to give the ghosts comfort.","ko":"어떤 사람들은 귀신들에게 위안을 주기 위해 지폐를 태운다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Others burn paper money to give the ghosts comfort.","다른 사람들은 귀신들에게 위안을 주기 위해 지폐를 태운다."]],"w":"9번 문장에 Others burn paper money to give the ghosts comfort가 나와요.","c":"T"},"h":"33ceb318fb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some Chinese people are superstitious about the seventh month of the lunar calendar.)","ko":"어떤 중국인들은 음력 7월에 대해 ( ).","opts":["미신을 믿는","용감한","부유한","친절한"],"word":"superstitious","r":{"a":"1) 미신을 믿는","ev":"1~2번 문장","s":[[1,"Some Chinese people are superstitious about the seventh month of the lunar calendar.","어떤 중국인들은 음력 7월에 대한 미신을 믿는다."],[2,"They believe the gate to the world of the dead opens at that time.","그들은 그때에 죽은 사람들의 세계로 가는 문이 열린다고 믿는다."]],"w":"음력 7월에 문이 열려 귀신이 돌아온다고 믿는 이야기가 이어져요(2번). 그래서 superstitious는 '미신을 믿는'이에요.","c":1},"h":"4eb23b9c45"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Others burn paper money to give the ghosts comfort.)","ko":"다른 사람들은 귀신들에게 ( )을 주기 위해 지폐를 태운다.","opts":["음식","벌","위안","그림"],"word":"comfort","r":{"a":"3) 위안","ev":"8~9번 문장","s":[[8,"Some people make lots of food for the ghosts.","어떤 사람들은 귀신들을 위해 많은 음식을 만든다."],[9,"Others burn paper money to give the ghosts comfort.","다른 사람들은 귀신들에게 위안을 주기 위해 지폐를 태운다."]],"w":"귀신을 기쁘게 하려는 노력(7번) 중 하나로, 지폐를 태워 귀신에게 주는 것은 '위안'이에요. comfort는 마음을 편하게 해 주는 것이에요.","c":3},"h":"85c6cb236a"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat means the spirits of the dead can return to earth.","ko":"밑줄 친 That이(가) 가리키는 것은?","sko":"그것은 죽은 사람들의 영혼이 이승으로 돌아올 수 있다는 것을 의미한다.","opts":["음력 7월을 귀신의 달이라고 부르는 것","그때 죽은 사람들의 세계로 가는 문이 열린다는 것","중국인들이 새집으로 이사하지 않는 것","15일에 귀신제를 여는 것"],"r":{"a":"2) 그때 죽은 사람들의 세계로 가는 문이 열린다는 것","ev":"2~3번 문장","s":[[2,"They believe the gate to the world of the dead opens at that time.","그들은 그때에 죽은 사람들의 세계로 가는 문이 열린다고 믿는다."],[3,"That means the spirits of the dead can return to earth.","그것은 죽은 사람들의 영혼이 이승으로 돌아올 수 있다는 것을 의미한다."]],"w":"That은 바로 앞 2번 문장 내용을 가리켜요. 죽은 사람들의 세계로 가는 문이 열리니 영혼이 이승으로 돌아올 수 있다는 뜻이에요.","c":2},"h":"97828df39c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So they do not move into a new house or get married.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 그들은 새집으로 이사를 하거나 결혼을 하지 않는다.","opts":["그래서 그들은 새집으로 이사하고 결혼도 서둘러 한다.","그래서 그들은 새집으로 이사하지만 결혼은 하지 않는다.","그래서 그들은 새집에서 나와 결혼식에 가지 않는다.","그래서 그들은 새집으로 이사도, 결혼도 하지 않는다."],"r":{"a":"4) 그래서 그들은 새집으로 이사도, 결혼도 하지 않는다.","ev":"5~6번 문장","s":[[5,"During this time, Chinese people worry that bad things will happen.","이 기간 동안에, 중국인들은 나쁜 일들이 일어날 것을 걱정한다."],[6,"So they do not move into a new house or get married.","그래서 그들은 새집으로 이사를 하거나 결혼을 하지 않는다."]],"w":"do not move into a new house or get married는 이사도 결혼도 하지 않는다는 뜻이에요. 나쁜 일이 생길까 걱정해서예요(5번).","c":4},"h":"1d20c97d74"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사람들은 귀신을 쫓아내려고 강에 종이등을 띄운다.","귀신제는 음력 7월 15일에 열린다.","귀신제는 음력 7월 1일에 열린다.","사람들은 귀신을 위해 만든 음식을 모두 버린다."],"opts":["People put paper lights on rivers to drive the ghosts away.","The ghost festival is held on the fifteenth day of the month.","The ghost festival is held on the first day of the month.","People throw away all the food made for the ghosts."],"r":{"a":"2) The ghost festival is held on the fifteenth day of the month.","ev":"8번, 10~11번 문장","s":[[8,"Some people make lots of food for the ghosts.","어떤 사람들은 귀신들을 위해 많은 음식을 만든다."],[10,"They even have a special “ghost festival” on the fifteenth day of the month.","그들은 심지어 그달의 15일에는 특별한 ‘귀신제’를 열기도 한다."],[11,"On that day, people put paper lights on rivers to help the ghosts find their way back home.","그날, 사람들은 귀신들이 그들의 집으로 돌아가는 길을 찾는 것을 돕기 위해 강에 종이등을 띄운다."]],"w":"10번에 그달의 15일에 귀신제를 연다고 해요. 종이등은 귀신이 집으로 돌아가는 길을 돕기 위한 것이고(11번), 음식은 귀신을 위해 만들어요(8번).","c":2},"h":"1856ae3efe"},{"n":9,"t":"sum","q":"To make the ghosts (A), some people make lots of (B) and others burn paper money.","ko":"귀신들을 (A)하게 만들기 위해, 어떤 사람들은 많은 (B)을(를) 만들고 다른 사람들은 지폐를 태운다.","oko":["(A) 화난 / (B) 음식","(A) 기쁜 / (B) 옷","(A) 기쁜 / (B) 음식","(A) 두려워하는 / (B) 등","(A) 화난 / (B) 옷"],"opts":["(A) angry / (B) food","(A) happy / (B) clothes","(A) happy / (B) food","(A) afraid / (B) lights","(A) angry / (B) clothes"],"r":{"a":"3) (A) happy / (B) food","ev":"7~9번 문장","s":[[7,"Instead, they try to make the ghosts happy.","대신에, 그들은 귀신들을 기쁘게 만들려고 노력한다."],[8,"Some people make lots of food for the ghosts.","어떤 사람들은 귀신들을 위해 많은 음식을 만든다."],[9,"Others burn paper money to give the ghosts comfort.","다른 사람들은 귀신들에게 위안을 주기 위해 지폐를 태운다."]],"w":"7번에서 귀신들을 기쁘게(happy) 하려고 노력하고, 8번에서 어떤 사람들은 음식(food)을 많이 만들고 9번에서 다른 사람들은 지폐를 태워요.","c":3},"h":"94dd3c1c9a"},{"n":10,"t":"fill","q":"On the fifteenth day of the month, people put paper [A] on rivers to help the ghosts find their way back [B].","ko":"그달 15일에, 사람들은 귀신들이 돌아가는 길을 찾는 것을 돕기 위해 강에 종이 [A]을(를) 띄운다. 돌아가는 곳은 [B]이다.","bank":["earth","lights","house","month","food","home"],"bko":{"lights":"등","house":"집(건물)","month":"달","food":"음식","home":"집","earth":"이승"},"r":{"a":"[A] lights, [B] home","ev":"10~11번 문장","s":[[10,"They even have a special “ghost festival” on the fifteenth day of the month.","그들은 심지어 그달의 15일에는 특별한 ‘귀신제’를 열기도 한다."],[11,"On that day, people put paper lights on rivers to help the ghosts find their way back home.","그날, 사람들은 귀신들이 그들의 집으로 돌아가는 길을 찾는 것을 돕기 위해 강에 종이등을 띄운다."]],"w":"10번에서 15일에 귀신제를 열고, 11번에서 그날 귀신들이 집으로 돌아가는 길을 돕기 위해 강에 종이등(lights)을 띄워요. back 뒤에는 home이 와서 '집으로 돌아가는'이 돼요.","c":null},"h":"3fe733eca5"}]},{"u":2,"id":"rj2-02-3","no":3,"ko":"빗자루를 왜 뛰어넘지?","items":[{"n":1,"t":"tf","q":"The MC said, “Let’s jump the broom!”","ko":"사회자가 “빗자루를 넘자고요!”라고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"“Let’s jump the broom!” the MC said.","“빗자루를 넘자고요!”라고 사회자가 말했다."]],"w":"5번 문장에 'Let's jump the broom!' the MC said가 그대로 나와요.","c":"T"},"h":"61d7101f19"},{"n":2,"t":"tf","q":"John and Olivia did not let their guests try jumping the broom.","ko":"John과 Olivia는 하객들이 빗자루를 넘어 보게 하지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"They even let guests try it!","그들은 심지어 하객들이 그것(빗자루 넘기)을 시도해 보게 했다!"]],"w":"14번 문장에서 John과 Olivia는 심지어 하객들이 해 보게 했어요(let guests try it). 하지 않았다는 말은 반대예요.","c":"F"},"h":"4f25714a13"},{"n":3,"t":"tf","q":"Slaves jumped over a broom to secretly show their love.","ko":"노예들은 그들의 사랑을 비밀스럽게 보여 주기 위해 빗자루를 뛰어넘었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"To secretly show their love, slaves jumped over a broom.","그들의 사랑을 비밀스럽게 보여주기 위해, 노예들은 빗자루를 뛰어넘었다."]],"w":"11번 문장에 To secretly show their love, slaves jumped over a broom이 나와요.","c":"T"},"h":"b74627ca7e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (During the 1800s, marriage was banned among African American slaves.)","ko":"1800년대 동안에, 아프리카계 미국인 노예들 사이에서 결혼은 ( ).","opts":["금지되었다","허락되었다","잊혀졌다","축하받았다"],"word":"banned","r":{"a":"1) 금지되었다","ev":"10~11번 문장","s":[[10,"During the 1800s, marriage was banned among African American slaves.","1800년대 동안에, 아프리카계 미국인 노예들 사이에서 결혼은 금지되었다."],[11,"To secretly show their love, slaves jumped over a broom.","그들의 사랑을 비밀스럽게 보여주기 위해, 노예들은 빗자루를 뛰어넘었다."]],"w":"11번에서 노예들이 사랑을 '비밀스럽게' 보여 주려고 빗자루를 뛰어넘었어요. 결혼이 허락되었다면 숨길 필요가 없으니 banned는 '금지되었다'예요.","c":1},"h":"e8c6fe7692"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This symbolized sweeping the past away and linking families.)","ko":"이것은 과거를 털어 버리고 가족을 잇는 것을 ( ).","opts":["방해했다","상징했다","숨겼다","바꿨다"],"word":"symbolized","r":{"a":"2) 상징했다","ev":"11~12번 문장","s":[[11,"To secretly show their love, slaves jumped over a broom.","그들의 사랑을 비밀스럽게 보여주기 위해, 노예들은 빗자루를 뛰어넘었다."],[12,"This symbolized sweeping the past away and linking families.","이것은 과거를 털어 버리고 가족을 잇는 것을 상징했다."]],"w":"11번에서 노예들이 빗자루를 뛰어넘었고, 12번에서 그 행동이 어떤 뜻을 나타냈는지 말해요. symbolize는 '상징하다'예요.","c":2},"h":"348a92fbcb"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis symbolized sweeping the past away and linking families.","ko":"밑줄 친 This이(가) 가리키는 것은?","sko":"이것은 과거를 털어 버리고 가족을 잇는 것을 상징했다.","opts":["결혼이 금지된 것","반지를 서로 주는 것","노예들이 빗자루를 뛰어넘은 것","시대가 바뀐 것"],"r":{"a":"3) 노예들이 빗자루를 뛰어넘은 것","ev":"11~12번 문장","s":[[11,"To secretly show their love, slaves jumped over a broom.","그들의 사랑을 비밀스럽게 보여주기 위해, 노예들은 빗자루를 뛰어넘었다."],[12,"This symbolized sweeping the past away and linking families.","이것은 과거를 털어 버리고 가족을 잇는 것을 상징했다."]],"w":"This는 바로 앞 11번 문장 내용을 가리켜요. 노예들이 사랑을 비밀스럽게 보여 주려고 빗자루를 뛰어넘은 것이 과거를 털어 버리고 가족을 잇는 것을 상징했어요.","c":3},"h":"0e029b9afc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Times have changed, but John and Olivia wanted to keep this tradition in their wedding.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시대가 바뀌었지만, John과 Olivia는 그들의 결혼식에서 이 전통을 지키기를 tion이 나와요. 문제를 풀어 주는 것이니 '해결책'이에요.","c":3},"h":"6cdd8aa0d9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Up to 783 million people regularly go hungry.)","ko":"7억 8천 3백만 명에 이르는 사람들이 ( ) 굶주리고 있다.","opts":["가끔","정기적으로","갑자기","처음으로"],"word":"regularly","r":{"a":"2) 정기적으로","ev":"2번 문장","s":[[2,"Up to 783 million people regularly go hungry.","7억 8천 3백만 명에 이르는 사람들이 정기적으로 굶주리고 있다."]],"w":"2번은 식량 위기가 심각하다는 설명이에요. 많은 사람들이 늘 때가 되면 굶주린다는 뜻이라 regularly는 '정기적으로'예요.","c":2},"h":"78013ced01"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are used to make porridge and bread.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 포리지와 빵을 만드는 데 사용된다.","opts":["다른 식물들의 열매","엔셋의 열매","엔셋의 뿌리와 줄기","바나나 나무들"],"r":{"a":"3) 엔셋의 뿌리와 줄기","ev":"7~8번 문장","s":[[7,"Unlike the fruits of other plants, the fruit of the enset cannot be eaten, but its roots and stems can.","다른 식물들의 열매들과 달리, 엔셋의 열매는 먹을 수 없지만, 그것의 뿌리와 줄기는 먹을 수 있다."],[8,"They are used to make porridge and bread.","그것들은 포리지와 빵을 만드는 데 사용된다."]],"w":"7번에서 엔셋의 열매는 못 먹지만 its roots and stems(뿌리와 줄기)는 먹을 수 있다고 했어요. 그래서 8번의 They는 뿌리와 줄기예요.","c":3},"h":"d3356c3e49"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It can also live up to seven years without water!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 또한 물 없이도 7년까지 살 수 있다!","opts":["7년마다 물을 한 번 줘야 한다.","물이 있어야만 7년 동안 살 수 있다.","물 없이는 7년 안에 죽는다.","물이 없는 상태에서도 최대 7년 동안 살아남을 수 있다."],"r":{"a":"4) 물이 없는 상태에서도 최대 7년 동안 살아남을 수 있다.","ev":"12번 문장","s":[[12,"It can also live up to seven years without water!","또한 물 없이도 7년까지 살 수 있다!"]],"w":"without water는 '물 없이'이고, live up to seven years는 '7년까지 살다'예요. 물이 없어도 오래 산다는 엔셋의 이점이에요.","c":4},"h":"fcd70264c8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["엔셋은 바나나 나무처럼 생겼지만 열매는 먹을 수 없다.","엔셋의 열매만 포리지와 빵을 만드는 데 쓰인다.","엔셋은 브라질의 주식이다.","엔셋은 쉽게 병에 걸린다."],"opts":["Enset looks like a banana tree, but its fruit cannot be eaten.","Only the fruit of the enset is used to make porridge and bread.","Enset is a staple food in Brazil.","Enset catches diseases easily."],"r":{"a":"1) Enset looks like a banana tree, but its fruit cannot be eaten.","ev":"5~7번, 11번 문장","s":[[5,"Enset is a staple food in Ethiopia.","엔셋은 에티오피아의 주식이다."],[6,"It looks like a banana tree and can grow to a height of about 4 to 13 meters.","그것은 바나나 나무처럼 생겼고 약 4미터에서 13미터까지의 높이까지 자랄 수 있다."],[7,"Unlike the fruits of other plants, the fruit of the enset cannot be eaten, but its roots and stems can.","다른 식물들의 열매들과 달리, 엔셋의 열매는 먹을 수 없지만, 그것의 뿌리와 줄기는 먹을 수 있다."],[11,"The plant does not catch diseases easily.","이 식물은 쉽게 병에 걸리지 않는다."]],"w":"6번에서 바나나 나무처럼 생겼고, 7번에서 열매는 먹을 수 없다고 해요. 주식인 나라는 에티오피아(5번)이고, 포리지와 빵은 뿌리와 줄기로 만들며(7~8번), 병에는 쉽게 걸리지 않아요(11번).","c":1},"h":"066f0d04bf"},{"n":9,"t":"sum","q":"Enset is a (A) food in Ethiopia. People cannot eat its fruit, but they use its (B) to make porridge and bread.","ko":"엔셋은 에티오피아의 (A) 식량이다. 사람들은 열매는 먹을 수 없지만, (B)로 포리지와 빵을 만든다.","oko":["(A) 드문 / (B) 열매","(A) 주된 / (B) 열매","(A) 드문 / (B) 뿌리와 줄기","(A) 위험한 / (B) 잎","(A) 주된 / (B) 뿌리와 줄기"],"opts":["(A) rare / (B) fruits","(A) staple / (B) fruits","(A) rare / (B) roots and stems","(A) dangerous / (B) leaves","(A) staple / (B) roots and stems"],"r":{"a":"5) (A) staple / (B) roots and stems","ev":"5번, 7~8번 문장","s":[[5,"Enset is a staple food in Ethiopia.","엔셋은 에티오피아의 주식이다."],[7,"Unlike the fruits of other plants, the fruit of the enset cannot be eaten, but its roots and stems can.","다른 식물들의 열매들과 달리, 엔셋의 열매는 먹을 수 없지만, 그것의 뿌리와 줄기는 먹을 수 있다."],[8,"They are used to make porridge and bread.","그것들은 포리지와 빵을 만드는 데 사용된다."]],"w":"5번에서 엔셋은 staple food(주식)이고, 7~8번에서 열매는 먹을 수 없지만 뿌리와 줄기로 포리지와 빵을 만든다고 해요.","c":5},"h":"c25563b8ce"},{"n":10,"t":"fill","q":"Enset can be [A] in any season, and it can live up to seven years [B] water.","ko":"엔셋은 어떤 계절에도 [A] 수 있고, 물 [B] 7년까지 살 수 있다.","bank":["harvested","without","quickly","diseases","benefits","despite"],"bko":{"harvested":"수확된","without":"~ 없이","quickly":"빨리","diseases":"질병","benefits":"이점","despite":"~에도 불구하고"},"r":{"a":"[A] harvested, [B] without","ev":"10번, 12번 문장","s":[[10,"It grows quickly and can be harvested in any season.","그것은 빨리 자라고 어떤 계절에도 수확할 수 있다."],[12,"It can also live up to seven years without water!","또한 물 없이도 7년까지 살 수 있다!"]],"w":"10번 can be harvested in any season, 12번 live up to seven years without water에서 가져왔어요. despite(~에도 불구하고)는 water 앞에 오면 뜻이 맞지 않아요.","c":null},"h":"ccd0decc7c"}]},{"u":3,"id":"rj2-03-2","no":2,"ko":"버터가 다 떨어졌다고요? 걱정 마세요!","items":[{"n":1,"t":"tf","q":"You should shake the heavy cream in a jar for a long time.","ko":"유지가 많은 크림을 병에 넣고 오랫동안 흔들어야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"First, fill half a jar with heavy cream and shake it for a long time.","먼저, 유지가 많은 크림으로 병의 반을 채우고 그것을 오랫동안 흔들어라."]],"w":"2번 문장에 fill half a jar with heavy cream and shake it for a long time이 있어요. 병에 크림을 넣고 오랫동안 흔들라는 내용과 일치해요.","c":"T"},"h":"79ccce1f98"},{"n":2,"t":"tf","q":"You should rinse the butter only one time.","ko":"버터를 한 번만 헹궈야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Rinse the butter at least two times in this way.","이런 방법으로 버터를 최소 두 번 헹궈라."]],"w":"10번 문장에서 버터를 at least two times, 즉 최소 두 번 헹구라고 해요. 한 번만이라는 말은 맞지 않아요.","c":"F"},"h":"f99618d23e"},{"n":3,"t":"tf","q":"Butter that still has water in it will quickly go bad.","ko":"물이 아직 남아 있는 버터는 빨리 상할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"If you don’t get all the water out, your butter will quickly go bad.","만약 당신이 물을 모두 나오게 하지 못하면, 당신의 버터는 빠르게 상할 것이다."]],"w":"12번 문장에서 물을 모두 빼내지 못하면 버터가 빨리 상한다(go bad)고 해요.","c":"T"},"h":"744d5211ac"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The cream will start to thicken.)","ko":"크림이 ( ) 시작할 것이다.","opts":["얇아지다","차가워지다","걸쭉해지다","사라지다"],"word":"thicken","r":{"a":"3) 걸쭉해지다","ev":"3번, 5~6번 문장","s":[[3,"The cream will start to thicken.","크림이 걸쭉해지기 시작할 것이다."],[5,"It’s because cream is a mixture of milk fat and water.","크림은 유지방과 물의 혼합물이기 때문이다."],[6,"When you shake i
