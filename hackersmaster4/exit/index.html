<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 마스터 4 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"ms4-01-1","no":1,"ko":"손 씻기가 사람을 살린다고?!","items":[{"n":1,"t":"tf","q":"Semmelweis’s findings were later supported by scientists such as Louis Pasteur and Joseph Lister.","ko":"제멜바이스의 연구 결과는 이후 루이 파스퇴르와 조셉 리스터 같은 과학자들에 의해 뒷받침되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Semmelweis’s findings were validated by later scientists like Louis Pasteur, credited with developing modern germ theory, and Joseph Lister, who invented an antiseptic system for use during surgeries.","제멜바이스의 연구 결과는 현대 세균설을 발전시킨 공로를 인정받는 루이 파스퇴르와 수술 중 사용할 소독 시스템을 발명한 조셉 리스터 같은 후대 과학자들에 의해 입증되었다."]],"w":"10번 문장에서 제멜바이스의 연구 결과는 파스퇴르, 리스터 같은 후대 과학자들에 의해 입증되었다(validated)고 해요. '뒷받침되었다'와 같은 뜻이에요.","c":"T"},"h":"87e2bf6006"},{"n":2,"t":"tf","q":"Semmelweis’s fellow physicians easily accepted his idea because the results were so clear.","ko":"제멜바이스의 동료 의사들은 결과가 매우 분명했기 때문에 그의 생각을 쉽게 받아들였다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Despite this remarkable outcome, Semmelweis faced strong resistance from his fellow physicians, who were offended by the idea that they themselves could be causing their patients harm.","이러한 놀라운 결과에도 불구하고, 제멜바이스는 동료 의사들로부터 거센 저항에 직면했는데, 그들은 자신들이 환자에게 해를 끼칠 수 있다는 생각에 불쾌해했다."]],"w":"7번 문장에서 놀라운 결과에도 불구하고(Despite) 동료 의사들은 거센 저항을 했다고 해요. 쉽게 받아들였다는 말은 반대예요.","c":"F"},"h":"289bde1882"},{"n":3,"t":"tf","q":"Pregnant women had lower mortality rates when doctors treated them than when midwives did.","ko":"임산부들은 조산사가 치료할 때보다 의사가 치료할 때 사망률이 더 낮았다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"No one understood why until 1847, when Semmelweis made an important observation at his hospital—pregnant women had higher mortality rates when treated by doctors than by midwives.","1847년 제멜바이스가 그의 병원에서 중요한 관찰을 할 때까지 아무도 그 이유를 이해하지 못했는데, 그것은 임산부들이 조산사보다 의사에게 치료받을 때 사망률이 더 높다는 것이었다."]],"w":"4번 문장에서는 임산부들이 의사에게 치료받을 때 사망률이 더 높았다고 해요. 의사와 조산사가 서로 바뀐 진술이에요.","c":"F"},"h":"3e350d6022"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Until the mid-19th century, death during childbirth was alarmingly common throughout Europe.)","ko":"19세기 중반까지, 출산 중 사망은 유럽 전역에서 놀라울 정도로 흔했다.","opts":["다행히도","놀랄 만큼","거의","천천히"],"word":"alarmingly","r":{"a":"2) 놀랄 만큼","ev":"3번 문장","s":[[3,"Until the mid-19th century, death during childbirth was alarmingly common throughout Europe.","19세기 중반까지, 출산 중 사망은 유럽 전역에서 놀라울 정도로 흔했다."]],"w":"3번은 이 이야기가 풀어야 할 문제를 보여 줘요. 출산 중 사망이 걱정될 만큼 흔했다는 뜻이라 '놀랄 만큼'이 맞아요.","c":2},"h":"d6a5ef7ade"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... even accusing them of being careless murderers.)","ko":"... 심지어 그들을 부주의한 살인자라고 비난하기까지 했다.","opts":["돕는","초대하는","비난하는","칭찬하는"],"word":"accusing","r":{"a":"3) 비난하는","ev":"8번 문장","s":[[8,"Frustrated by the rejection of his ideas, Semmelweis publicly criticized members of the medical community in open letters that circulated across Europe, even accusing them of being careless murderers.","자신의 아이디어가 거부당한 것에 좌절한 제멜바이스는 유럽 전역에 유포된 공개 서한에서 의료계 구성원들을 공개적으로 비판했으며, 심지어 그들을 부주의한 살인자라고 비난하기까지 했다."]],"w":"8번에서 제멜바이스는 의사들을 공개적으로 비판했고, even(심지어) 뒤에 '부주의한 살인자'라는 말이 와요. 그러니 accuse(비난하다)가 맞아요. 돕거나 칭찬하는 말은 살인자와 어울리지 않아요.","c":3},"h":"c8bb333db5"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nConvinced that doctors who had performed autopsies were transferring harmful substances to the women, Semmelweis ordered them to wash their hands with a chlorinated lime solution before assisting with childbirth.","ko":"밑줄 친 them이 가리키는 것은?","sko":"부검을 수행한 의사들이 해로운 물질을 여성들에게 옮기고 있다고 확신한 그는, 그들에게 출산을 돕기 전에 염화석회 용액으로 손을 씻으라고 지시했다.","opts":["조산사들","부검을 수행한 의사들","임산부들","동료 과학자들"],"r":{"a":"2) 부검을 수행한 의사들","ev":"5번 문장","s":[[5,"Convinced that doctors who had performed autopsies were transferring harmful substances to the women, Semmelweis ordered them to wash their hands with a chlorinated lime solution before assisting with childbirth.","부검을 수행한 의사들이 해로운 물질을 여성들에게 옮기고 있다고 확신한 그는, 그들에게 출산을 돕기 전에 염화석회 용액으로 손을 씻으라고 지시했다."]],"w":"제멜바이스가 손을 씻으라고 지시한 대상은 해로운 물질을 옮긴다고 확신한 '부검을 한 의사들(doctors who had performed autopsies)'이에요. 임산부는 물질이 옮겨지는 쪽이라 지시를 받는 사람이 아니에요.","c":2},"h":"e253f85ce2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Not all medical breakthroughs are recognized at the time they are made.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"모든 의학적 돌파구가 그것이 이루어진 당시에 인정받는 것은 아니다.","opts":["모든 의학적 돌파구는 이루어진 때에 곧바로 인정받는다.","의학적 돌파구는 이루어진 후에야 비로소 시작된다.","인정받지 못한 의학적 돌파구는 하나도 없다.","의학적 돌파구 중에는 이루어진 당시에는 인정받지 못하는 것도 있다."],"r":{"a":"4) 의학적 돌파구 중에는 이루어진 당시에는 인정받지 못하는 것도 있다.","ev":"1번 문장","s":[[1,"Not all medical breakthroughs are recognized at the time they are made.","모든 의학적 돌파구가 그것이 이루어진 당시에 인정받는 것은 아니다."]],"w":"Not all은 '모두 ~인 것은 아니다'라는 부분 부정이에요. 인정받는 것도 있고 당시에는 인정받지 못하는 것도 있다는 뜻이라 4번이 맞아요. 1번은 all(모두), 3번은 none(하나도)처럼 반대로 말해요.","c":4},"h":"e638e57e72"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["제멜바이스는 유럽을 떠나 1865년까지 해외에서 연구를 계속했다.","제멜바이스는 결국 정신 병원에 보내졌고 1865년에 그곳에서 사망했다.","제멜바이스는 1865년에 공개 서한으로 상을 받았다.","제멜바이스의 직업 생활은 서한이 발표된 후 더 수월해졌다."],"opts":["Semmelweis left Europe and continued his research abroad until 1865.","Semmelweis was eventually sent to an asylum, where he died in 1865.","Semmelweis was awarded a prize for his open letters in 1865.","Semmelweis’s career became easier after his letters were published."],"r":{"a":"2) Semmelweis was eventually sent to an asylum, where he died in 1865.","ev":"8~9번 문장","s":[[8,"Frustrated by the rejection of his ideas, Semmelweis publicly criticized members of the medical community in open letters that circulated across Europe, even accusing them of being careless murderers.","자신의 아이디어가 거부당한 것에 좌절한 제멜바이스는 유럽 전역에 유포된 공개 서한에서 의료계 구성원들을 공개적으로 비판했으며, 심지어 그들을 부주의한 살인자라고 비난하기까지 했다."],[9,"This led to struggles in his professional life, and he was eventually committed to an asylum, where he died in 1865.","이것은 그의 직업적 삶에 고난을 초래했고, 그는 결국 정신 병원에 수감되어 1865년에 그곳에서 사망했다."]],"w":"9번에서 직업적 삶의 고난을 겪다가 결국 정신 병원에 수감되어 1865년에 그곳에서 죽었다고 해요. 8번의 공개 서한은 의사들을 비난한 것이라 상이나 쉬운 직업 생활로 이어지지 않았어요. 유럽을 떠났다는 말은 본문에 없어요.","c":2},"h":"9e5aa345e3"},{"n":9,"t":"sum","q":"At first, Semmelweis’s hand-washing rule was (A) by his fellow doctors, but today it is (B) in hospitals.","ko":"처음에 제멜바이스의 손 씻기 규칙은 동료 의사들에게 (A)되었지만, 오늘날 병원에서는 (B)이다.","oko":["(A) 환영받음 / (B) 폐지됨","(A) 칭찬받음 / (B) 금지됨","(A) 거부당함 / (B) 폐지됨","(A) 환영받음 / (B) 표준임","(A) 거부당함 / (B) 표준임"],"opts":["(A) welcomed / (B) abandoned","(A) praised / (B) forbidden","(A) rejected / (B) abandoned","(A) welcomed / (B) standard","(A) rejected / (B) standard"],"r":{"a":"5) (A) rejected / (B) standard","ev":"7번, 11번 문장","s":[[7,"Despite this remarkable outcome, Semmelweis faced strong resistance from his fellow physicians, who were offended by the idea that they themselves could be causing their patients harm.","이러한 놀라운 결과에도 불구하고, 제멜바이스는 동료 의사들로부터 거센 저항에 직면했는데, 그들은 자신들이 환자에게 해를 끼칠 수 있다는 생각에 불쾌해했다."],[11,"Today, the principle of hygiene that Semmelweis pioneered has evolved into standard medical practices that significantly reduce infection rates in hospitals.","오늘날, 제멜바이스가 개척한 위생 원칙은 병원 내 감염률을 크게 낮추는 표준 의료 관행으로 발전했다."]],"w":"7번에서 동료 의사들은 거센 저항을 했으니 (A)는 rejected(거부당한)예요. 11번에서 오늘날 위생 원칙은 표준 의료 관행으로 발전했으니 (B)는 standard(표준인)예요.","c":5},"h":"cafaf86891"},{"n":10,"t":"fill","q":"Doctors were told to [A] their hands, and the [B] rates dropped from 18 percent to less than 2 percent.","ko":"의사들은 손을 [A]하라는 지시를 받았고, [B]은 18퍼센트에서 2퍼센트 미만으로 떨어졌다.","bank":["wash","mortality","resistance","criticize","circulate","validate"],"bko":{"wash":"씻다","mortality":"사망률","resistance":"저항","criticize":"비판하다","circulate":"유포되다","validate":"입증하다"},"r":{"a":"[A] wash, [B] mortality","ev":"5~6번 문장","s":[[5,"Convinced that doctors who had performed autopsies were transferring harmful substances to the women, Semmelweis ordered them to wash their hands with a chlorinated lime solution before assisting with childbirth.","부검을 수행한 의사들이 해로운 물질을 여성들에게 옮기고 있다고 확신한 그는, 그들에게 출산을 돕기 전에 염화석회 용액으로 손을 씻으라고 지시했다."],[6,"The results were immediate and dramatic: mortality rates dropped from 18 percent to less than 2 percent.","결과는 즉각적이고 극적이었다. 사망률이 18퍼센트에서 2퍼센트 미만으로 떨어졌다."]],"w":"5번에서 제멜바이스는 의사들에게 손을 씻으라고(wash their hands) 지시했고, 6번에서 사망률(mortality rates)이 18퍼센트에서 2퍼센트 미만으로 떨어졌어요. resistance(저항)는 7번 내용이라 수치와 어울리지 않아요.","c":null},"h":"7af12728a3"}]},{"u":1,"id":"ms4-01-2","no":2,"ko":"예쁜데 별도 만들어?","items":[{"n":1,"t":"tf","q":"New stars are born and nurtured in the Pillars of Creation over millions of years.","ko":"새로운 별들은 수백만 년에 걸쳐 창조의 기둥 안에서 태어나고 양육된다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"These cosmic regions are where new stars are born and nurtured over millions of years.","이 우주 영역은 수백만 년에 걸쳐 새로운 별들이 태어나고 양육되는 곳이다."]],"w":"6번 문장에서 이 우주 영역은 수백만 년에 걸쳐 새로운 별들이 태어나고 양육되는 곳이라고 해요.","c":"T"},"h":"0e7ace43ef"},{"n":2,"t":"tf","q":"The Pillars of Creation were first observed by the James Webb Space Telescope in 1995.","ko":"창조의 기둥은 1995년에 제임스 웹 우주 망원경에 의해 처음 관측되었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The Pillars of Creation were first observed in visible light by the Hubble Telescope in 1995.","창조의 기둥은 1995년 허블 망원경에 의해 가시광선으로 처음 관측되었다."]],"w":"7번 문장에서 1995년에 처음 관측한 것은 허블 망원경이에요. 제임스 웹 우주 망원경은 2022년 이미지(8번)에 나와요.","c":"F"},"h":"874b68085b"},{"n":3,"t":"tf","q":"The energy from young stars adds more dust and gas to the pillars.","ko":"어린 별들이 내는 에너지는 기둥에 먼지와 가스를 더 보탠다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"As these stars are born and grow, they emit energy that clears away light dust and gas, leaving only the denser clouds that form the pillars.","이 별들이 태어나고 자라면서, 그들은 가벼운 먼지와 가스를 밀어내는 에너지를 방출하며, 기둥을 형성하는 더 빽빽한 구름만 남긴다."]],"w":"9번 문장에서 별들이 내는 에너지는 가벼운 먼지와 가스를 밀어내요(clears away). 더하는 것이 아니라 치우는 거예요.","c":"F"},"h":"40a8aea141"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They get their name from the role they play as a star nursery.)","ko":"그것들은 별의 보육원이라는 그것들이 하는 역할에서 그 이름을 얻었다.","opts":["별을 부수는 곳","별을 숨기는 곳","별을 키우는 곳","별을 구경하는 곳"],"word":"nursery","r":{"a":"3) 별을 키우는 곳","ev":"5~6번 문장","s":[[5,"They get their name from the role they play as a star nursery.","그것들은 별의 보육원이라는 그것들이 하는 역할에서 그 이름을 얻었다."],[6,"These cosmic regions are where new stars are born and nurtured over millions of years.","이 우주 영역은 수백만 년에 걸쳐 새로운 별들이 태어나고 양육되는 곳이다."]],"w":"6번이 '새로운 별들이 태어나고 양육되는 곳'이라고 풀어 줘요. 아기를 돌보는 보육원처럼 별을 길러 내는 곳이라는 뜻이에요.","c":3},"h":"54d5f467b3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... three towering celestial formations—spanning nearly five light-years—that resemble rocky cliffs.)","ko":"... 거의 5광년에 걸쳐 뻗어 있는, 바위 절벽을 닮은 세 개의 우뚝 솟은 천체 구조물이다.","opts":["무너뜨리다","피하다","둘러싸다","닮다"],"word":"resemble","r":{"a":"4) 닮다","ev":"3~4번 문장","s":[[3,"Located about 6,500 light-years from Earth, the Pillars of Creation are three towering celestial formations—spanning nearly five light-years—that resemble rocky cliffs.","지구로부터 약 6,500광년 떨어진 곳에 위치한 창조의 기둥은 거의 5광년에 걸쳐 뻗어 있는, 바위 절벽을 닮은 세 개의 우뚝 솟은 천체 구조물이다."],[4,"In reality, they are made of dense clouds of gas and dust.","사실, 그것들은 가스와 먼지의 빽빽한 구름으로 이루어져 있다."]],"w":"3번은 창조의 기둥이 어떻게 생겼는지 설명해요. 4번의 In reality(사실은)가 실제는 구름이라고 바로잡으니, 3번은 겉모습이 바위 절벽 같다는 말이고 resemble은 '닮다'예요.","c":4},"h":"0cd86b1526"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nFurthermore, they provide crucial data for astronomers, helping them to refine models of star formation and deepening our understanding of how stars form and evolve.","ko":"밑줄 친 them이 가리키는 것은?","sko":"게다가, 그것들은 천문학자들에게 중요한 데이터를 제공하여, 그들이 별 형성 모델을 정교하게 다듬고 어떻게 별이 형성되고 진화하는지에 대한 우리의 이해를 심화시키는 것을 돕는다.","opts":["창조의 기둥","어린 별들","천문학자들","영화 관객들"],"r":{"a":"3) 천문학자들","ev":"11번 문장","s":[[11,"Furthermore, they provide crucial data for astronomers, helping them to refine models of star formation and deepening our understanding of how stars form and evolve.","게다가, 그것들은 천문학자들에게 중요한 데이터를 제공하여, 그들이 별 형성 모델을 정교하게 다듬고 어떻게 별이 형성되고 진화하는지에 대한 우리의 이해를 심화시키는 것을 돕는다."]],"w":"데이터를 받아 모델을 다듬는 사람은 바로 앞의 for astronomers(천문학자들)예요. 데이터를 제공하는 쪽은 they(창조의 기둥)라서 them과는 서로 달라요.","c":3},"h":"e5bb932218"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The Pillars of Creation are so fascinating and beautiful that they have appeared in movies and television shows, on T-shirts and pillows, and even on a postage stamp.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"창조의 기둥은 너무나 매혹적이고 아름다워서 영화와 텔레비전 쇼, 티셔츠와 베개, 그리고 심지어 우표에도 등장했다.","opts":["창조의 기둥은 영화에 등장하고 난 뒤에야 매혹적이고 아름답다는 평가를 받게 되었다.","창조의 기둥은 영화와 티셔츠에 쓰이기에는 너무 평범하다.","창조의 기둥은 너무 매혹적이고 아름다워서 영화, 티셔츠, 우표 등에 등장했다.","창조의 기둥은 우표에만 쓰였을 뿐 영화에는 등장하지 않았다."],"r":{"a":"3) 창조의 기둥은 너무 매혹적이고 아름다워서 영화, 티셔츠, 우표 등에 등장했다.","ev":"10번 문장","s":[[10,"The Pillars of Creation are so fascinating and beautiful that they have appeared in movies and television shows, on T-shirts and pillows, and even on a postage stamp.","창조의 기둥은 너무나 매혹적이고 아름다워서 영화와 텔레비전 쇼, 티셔츠와 베개, 그리고 심지어 우표에도 등장했다."]],"w":"so ~ that …은 '너무 ~해서 …하다'예요. 매혹적이고 아름답기 때문에 영화, TV 쇼, 티셔츠, 베개, 우표에까지 등장했다는 뜻이에요. 영화에 나온 뒤에 매혹적이 된 것이라고 하면 이유와 결과가 거꾸로 돼요.","c":3},"h":"40b9ea8a4e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["2022년의 이미지는 기둥이 오직 바위 절벽으로만 이루어졌음을 보여 주었다.","2022년의 이미지는 근처의 어린 별들이 기둥의 형성에 영향을 주었음을 밝혀냈다.","허블 망원경이 2022년에 기둥의 적외선 이미지를 촬영했다.","2022년의 이미지는 별이 기둥에 아무 영향을 주지 않는다는 것을 증명했다."],"opts":["The 2022 images showed that the pillars are made only of rocky cliffs.","The 2022 images revealed that nearby young stars helped shape the pillars.","The Hubble Telescope took infrared images of the pillars in 2022.","The 2022 images proved that stars have no effect on the pillars."],"r":{"a":"2) The 2022 images revealed that nearby young stars helped shape the pillars.","ev":"8번 문장","s":[[8,"Then, in 2022, more advanced infrared images taken by the James Webb Space Telescope revealed that the pillars themselves have been shaped in part by a set of nearby young stars.","그 후, 2022년에 제임스 웹 우주 망원경이 촬영한 더 향상된 적외선 이미지는 기둥들 자체가 근처의 어린 별 무리에 의해 부분적으로 형성되었음을 밝혀냈다."]],"w":"8번에서 2022년의 적외선 이미지는 기둥이 근처의 어린 별 무리에 의해 부분적으로 형성되었음을 밝혀냈어요. 2022년 이미지를 찍은 것은 허블이 아니라 제임스 웹 우주 망원경이고, 별이 아무 영향도 주지 않는다는 말은 반대예요.","c":2},"h":"6dca838352"},{"n":9,"t":"sum","q":"The Pillars of Creation look like (A), but they are really clouds of gas and dust, and new stars are (B) there.","ko":"창조의 기둥은 (A)처럼 보이지만 실제로는 가스와 먼지의 구름이며, 그곳에서 새로운 별들이 (B).","oko":["(A) 바위 절벽 / (B) 파괴된다","(A) 반짝이는 별 / (B) 태어난다","(A) 바위 절벽 / (B) 숨겨진다","(A) 블랙홀 / (B) 파괴된다","(A) 바위 절벽 / (B) 태어난다"],"opts":["(A) rocky cliffs / (B) destroyed","(A) twinkling stars / (B) born","(A) rocky cliffs / (B) hidden","(A) black holes / (B) destroyed","(A) rocky cliffs / (B) born"],"r":{"a":"5) (A) rocky cliffs / (B) born","ev":"3~4번, 6번 문장","s":[[3,"Located about 6,500 light-years from Earth, the Pillars of Creation are three towering celestial formations—spanning nearly five light-years—that resemble rocky cliffs.","지구로부터 약 6,500광년 떨어진 곳에 위치한 창조의 기둥은 거의 5광년에 걸쳐 뻗어 있는, 바위 절벽을 닮은 세 개의 우뚝 솟은 천체 구조물이다."],[4,"In reality, they are made of dense clouds of gas and dust.","사실, 그것들은 가스와 먼지의 빽빽한 구름으로 이루어져 있다."],[6,"These cosmic regions are where new stars are born and nurtured over millions of years.","이 우주 영역은 수백만 년에 걸쳐 새로운 별들이 태어나고 양육되는 곳이다."]],"w":"3번에서 기둥은 바위 절벽을 닮았지만, 4번 In reality 뒤에서 실제로는 가스와 먼지 구름이라고 해요. 6번에서 새로운 별들이 태어나고 양육되는 곳이라고 하니 (A)는 rocky cliffs, (B)는 born이에요. black holes는 본문에 나오지 않아요.","c":5},"h":"9b71ac772c"},{"n":10,"t":"fill","q":"The Pillars are so [A] and beautiful that they have appeared in movies, and they give [B] data to astronomers.","ko":"창조의 기둥은 너무 [A]하고 아름다워서 영화에도 등장했고, 천문학자들에게 [B] 데이터를 준다.","bank":["fascinating","crucial","rocky","dense","nearby","twinkling"],"bko":{"fascinating":"매혹적인","crucial":"중요한","rocky":"바위로 된","dense":"빽빽한","nearby":"근처의","twinkling":"반짝이는"},"r":{"a":"[A] fascinating, [B] crucial","ev":"10~11번 문장","s":[[10,"The Pillars of Creation are so fascinating and beautiful that they have appeared in movies and television shows, on T-shirts and pillows, and even on a postage stamp.","창조의 기둥은 너무나 매혹적이고 아름다워서 영화와 텔레비전 쇼, 티셔츠와 베개, 그리고 심지어 우표에도 등장했다."],[11,"Furthermore, they provide crucial data for astronomers, helping them to refine models of star formation and deepening our understanding of how stars form and evolve.","게다가, 그것들은 천문학자들에게 중요한 데이터를 제공하여, 그들이 별 형성 모델을 정교하게 다듬고 어떻게 별이 형성되고 진화하는지에 대한 우리의 이해를 심화시키는 것을 돕는다."]],"w":"10번에서 so fascinating and beautiful that ~로 영화에 등장했다고 하고, 11번에서 천문학자들에게 crucial data(중요한 데이터)를 준다고 해요. rocky와 dense는 기둥의 모양과 구성(3·4번), nearby는 어린 별(8번)을 설명하는 말이에요.","c":null},"h":"9d0766c2f3"}]},{"u":1,"id":"ms4-01-3","no":3,"ko":"기왕 넘은 거, 내가 책임질게","items":[{"n":1,"t":"tf","q":"The idea of leaving nature alone influenced how people thought about conservation and wildlife protection.","ko":"자연을 내버려 두어야 한다는 생각은 사람들이 보존과 야생 동물 보호에 대해 생각하는 방식에 영향을 주었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This idea became widely accepted, shaping how people thought about conservation, wildlife protection, and even scientific research.","이 생각은 널리 받아들여져서, 사람들이 보존, 야생 동물 보호, 그리고 심지어 과학적 연구에 대해 생각하는 방식을 형성했다."]],"w":"3번 문장에서 이 생각이 널리 받아들여져서 보존, 야생 동물 보호, 과학적 연구에 대해 사람들이 생각하는 방식을 형성했다고 해요.","c":"T"},"h":"38c1998576"},{"n":2,"t":"tf","q":"Many scientists and ethicists say that humans have not yet crossed many boundaries in nature.","ko":"많은 과학자와 윤리학자들은 인간이 자연에서 아직 많은 경계를 넘지 않았다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Many scientists and ethicists now argue that humans have already crossed too many boundaries to claim the role of distant observers.","많은 과학자와 윤리학자들은 이제 인간이 거리를 둔 관찰자의 역할을 자처하기에는 이미 너무 많은 경계를 넘었다고 주장한다."]],"w":"5번 문장에서 인간은 이미 너무 많은 경계를 넘었다고 주장해요. 아직 넘지 않았다는 말은 반대예요.","c":"F"},"h":"bb046efb85"},{"n":3,"t":"tf","q":"Some people still worry that intervening in nature could repeat the mistakes that caused harm before.","ko":"일부 사람들은 자연에 개입하는 것이 이전에 해를 끼쳤던 실수를 반복할 수 있다고 여전히 걱정한다.","r":{"a":"T (본문과 맞는 내용)","ev":"15번 문장","s":[[15,"Some still warn that intervention risks repeating the same mistakes that caused harm in the first place.","일부는 여전히 개입이 애초에 해를 끼쳤던 것과 똑같은 실수를 반복할 위험이 있다고 경고한다."]],"w":"15번 문장에서 일부는 여전히 개입이 애초에 해를 끼쳤던 것과 똑같은 실수를 반복할 위험이 있다고 경고해요.","c":"T"},"h":"60f5169c0a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Recently, however, this principle has begun to lose its certainty.)","ko":"그러나 최근에 이 원칙은 확실성을 잃기 시작했다.","opts":["인기","비용","확실성","역사"],"word":"certainty","r":{"a":"3) 확실성","ev":"4번 문장","s":[[4,"Recently, however, this principle has begun to lose its certainty.","그러나 최근에 이 원칙은 확실성을 잃기 시작했다."]],"w":"4번의 however는 흐름을 뒤집어요. 1~3번에서 널리 받아들여졌던 원칙이 이제 흔들리기 시작했다는 뜻이라서, lose its certainty는 '확실성을 잃다'예요.","c":3},"h":"d232d906e2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Even actions meant to protect nature ... involve deliberate human decisions.)","ko":"자연을 보호하기 위한 행동들조차 의도적인 인간의 결정을 포함한다.","opts":["우연한","의도적인","비밀스러운","갑작스러운"],"word":"deliberate","r":{"a":"2) 의도적인","ev":"8번 문장","s":[[8,"Even actions meant to protect nature, such as listing species as endangered or restoring damaged habitats, involve deliberate human decisions.","멸종 위기종으로 종들을 등록하거나 훼손된 서식지를 복원하는 것과 같이 자연을 보호하기 위한 행동들조차 의도적인 인간의 결정을 포함한다."]],"w":"자연을 보호하려는 행동도 사람이 일부러 내린 결정을 포함한다는 말이에요. 그래서 deliberate는 '의도적인'이에요. 우연이나 갑작스러운 결정이라면 보호하려는 행동과 어울리지 않아요.","c":2},"h":"a434dcbc9f"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nInstead of asking whether humans should intervene in nature at all, they ask how humans should intervene responsibly.","ko":"밑줄 친 they가 가리키는 것은?","sko":"인간이 자연에 개입해야 하는지 말아야 하는지를 묻는 대신, 그들은 인간이 어떻게 책임감 있게 개입해야 하는지를 묻는다.","opts":["자연 속의 동물들","점점 더 많은 사람들의 목소리","대규모 개발 사업들","과거의 환경 윤리학자들"],"r":{"a":"2) 점점 더 많은 사람들의 목소리","ev":"10~11번 문장","s":[[10,"As a result, a growing number of voices suggest that the ethical question has shifted.","결과적으로, 점점 더 많은 수의 목소리가 윤리적 질문이 바뀌었다고 말한다."],[11,"Instead of asking whether humans should intervene in nature at all, they ask how humans should intervene responsibly.","인간이 자연에 개입해야 하는지 말아야 하는지를 묻는 대신, 그들은 인간이 어떻게 책임감 있게 개입해야 하는지를 묻는다."]],"w":"11번의 they는 바로 앞 10번의 a growing number of voices(점점 더 많은 목소리), 즉 질문이 바뀌었다고 말하는 사람들이에요. 질문을 하는 쪽은 사람이라서 동물이나 개발 사업은 아니에요.","c":2},"h":"147672423c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"From this perspective, human involvement is no longer an exception—it is the norm.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 관점에서 볼 때, 인간의 개입은 더 이상 예외가 아니라 일반적인 것이다.","opts":["인간의 개입은 이제 예외가 아니라 일반적인 것이다.","인간의 개입은 여전히 예외적인 일이다.","인간의 개입은 언제나 사회의 규범에 어긋난다.","인간의 개입은 점점 줄어드는 것이 일반적이다."],"r":{"a":"1) 인간의 개입은 이제 예외가 아니라 일반적인 것이다.","ev":"7번 문장","s":[[7,"From this perspective, human involvement is no longer an exception—it is the norm.","이러한 관점에서 볼 때, 인간의 개입은 더 이상 예외가 아니라 일반적인 것이다."]],"w":"no longer ~ it is ...는 '더 이상 ~가 아니라 …이다'예요. 개입이 예전에는 예외였지만 지금은 일반적인 것(the norm)이라는 뜻이에요. 여기서 norm은 '규범'이 아니라 '일반적인 것, 표준'이라서 3번은 틀려요.","c":1},"h":"dfa3d6c599"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["오늘날 아무도 인간이 자연을 내버려 두어야 한다고 믿지 않는다.","행동하지 않는 것은 자연 세계에서 일어나는 일에 아무 영향도 주지 않는다.","관점이 바뀌었지만 “자연을 내버려 두라”는 요구가 완전히 사라진 것은 아니다.","인간은 생태계를 크게 변화시킨 적이 없다."],"opts":["Today, no one believes that humans should leave nature alone.","Choosing not to act has no effect on what happens in the natural world.","Even though views have changed, the call to “leave nature alone” has not completely disappeared.","Humans have never changed ecosystems in a major way."],"r":{"a":"3) Even though views have changed, the call to “leave nature alone” has not completely disappeared.","ev":"6번, 13~15번 문장","s":[[6,"Large-scale development, climate change, and genetic engineering have altered ecosystems so deeply that the idea of an untouched natural world is increasingly unrealistic.","대규모 개발, 기후 변화, 그리고 유전 공학은 생태계를 너무 깊이 변화시켜서, 손대지 않은 자연 세계라는 생각은 점점 더 비현실적이게 되고 있다."],[13,"In many cases, choosing not to act can still shape outcomes in the natural world.","많은 경우에, 행동하지 않기로 선택하는 것 또한 여전히 자연 세계의 결과에 영향을 미칠 수 있다."],[14,"Even so, this does not mean that the call to “leave nature alone” has disappeared.","그렇다 하더라도, 이것은 “자연을 내버려 두라”는 요구가 사라졌다는 것을 의미하지는 않는다."],[15,"Some still warn that intervention risks repeating the same mistakes that caused harm in the first place.","일부는 여전히 개입이 애초에 해를 끼쳤던 것과 똑같은 실수를 반복할 위험이 있다고 경고한다."]],"w":"14번에서 변화가 있어도 “자연을 내버려 두라”는 요구가 사라진 것은 아니라고 하고, 15번에서 일부는 여전히 경고한다고 해요. 13번은 행동하지 않아도 자연 세계의 결과에 영향을 줄 수 있다고 하므로 2번은 반대이고, 6번은 인간이 생태계를 깊이 바꿨다고 하므로 4번도 틀려요.","c":3},"h":"4fb4299548"},{"n":9,"t":"sum","q":"Because humans have already (A) nature deeply, many now think that leaving nature alone is (B).","ko":"인간이 이미 자연을 깊이 (A)했기 때문에, 많은 사람들은 이제 자연을 내버려 두는 것이 (B)고 생각한다.","oko":["(A) 무시 / (B) 쉽다","(A) 보호 / (B) 현실적이다","(A) 변화시켜 놓았다 / (B) 쉽다","(A) 무시 / (B) 비현실적이다","(A) 변화시켜 놓았다 / (B) 비현실적이다"],"opts":["(A) ignored / (B) easy","(A) protected / (B) realistic","(A) changed / (B) easy","(A) ignored / (B) unrealistic","(A) changed / (B) unrealistic"],"r":{"a":"5) (A) changed / (B) unrealistic","ev":"5~6번 문장","s":[[5,"Many scientists and ethicists now argue that humans have already crossed too many boundaries to claim the role of distant observers.","많은 과학자와 윤리학자들은 이제 인간이 거리를 둔 관찰자의 역할을 자처하기에는 이미 너무 많은 경계를 넘었다고 주장한다."],[6,"Large-scale development, climate change, and genetic engineering have altered ecosystems so deeply that the idea of an untouched natural world is increasingly unrealistic.","대규모 개발, 기후 변화, 그리고 유전 공학은 생태계를 너무 깊이 변화시켜서, 손대지 않은 자연 세계라는 생각은 점점 더 비현실적이게 되고 있다."]],"w":"5번에서 인간은 이미 너무 많은 경계를 넘었다고 하고, 6번에서 생태계를 너무 깊이 변화시켜(altered) 손대지 않은 자연이라는 생각이 비현실적(unrealistic)이라고 해요. 그래서 (A)는 changed, (B)는 unrealistic이에요.","c":5},"h":"93371a80a3"},{"n":10,"t":"fill","q":"Even actions meant to [A] nature involve deliberate human decisions, and doing [B] does not preserve nature as it once was.","ko":"자연을 [A]하려는 행동조차 의도적인 인간의 결정을 포함하고, [B] 하지 않는 것은 자연을 예전 그대로 보존하지 않는다.","bank":["protect","nothing","destroy","alone","repeat","continue"],"bko":{"protect":"보호하다","nothing":"아무것도 (~ 않음)","destroy":"파괴하다","alone":"혼자, 그대로","repeat":"반복하다","continue":"계속하다"},"r":{"a":"[A] protect, [B] nothing","ev":"8~9번 문장","s":[[8,"Even actions meant to protect nature, such as listing species as endangered or restoring damaged habitats, involve deliberate human decisions.","멸종 위기종으로 종들을 등록하거나 훼손된 서식지를 복원하는 것과 같이 자연을 보호하기 위한 행동들조차 의도적인 인간의 결정을 포함한다."],[9,"Doing nothing, in such cases, does not preserve nature as it once was; it simply allows existing damage to continue.","그러한 경우에, 아무것도 하지 않는 것은 자연을 예전 그대로 보존하는 것이 아니며, 그것은 단지 기존의 피해가 계속되도록 허용할 뿐이다."]],"w":"8번에서 자연을 보호하려는(meant to protect) 행동조차 인간의 결정을 포함한다고 하고, 9번에서 Doing nothing(아무것도 하지 않는 것)은 자연을 예전 그대로 보존하지 않는다고 해요. destroy는 Even으로 시작하는 문맥(보호 행동조차)과 맞지 않아요.","c":null},"h":"89306b840b"}]},{"u":1,"id":"ms4-01-4","no":4,"ko":"The One Word That Defines a Nation","items":[{"n":1,"t":"tf","q":"Finnish people can easily describe the people of their nation using one word.","ko":"핀란드 사람들은 자기 나라 사람들을 한 단어로 쉽게 묘사할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It seems like a difficult task, but the people of Finland can do it easily.","그것은 어려운 과제처럼 보이지만, 핀란드 사람들은 그것을 쉽게 할 수 있다."]],"w":"2번 문장에서 한 단어로 묘사하는 일은 어려운 과제처럼 보이지만 핀란드 사람들은 그것을 쉽게 할 수 있다고 해요.","c":"T"},"h":"f3b4c3d521"},{"n":2,"t":"tf","q":"Sisu originally meant mental and emotional strength in times of peace.","ko":"sisu는 원래 평화로운 시기의 정신적이고 정서적인 힘을 뜻했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"It derives from an old Finnish word for one’s physical courage in times of war but has developed over time into a larger concept that includes mental and emotional strength.","그것은 전쟁 시의 육체적 용기를 뜻하는 핀란드 고어에서 유래했지만, 시간이 지나면서 정신적이고 정서적인 힘을 포함하는 더 큰 개념으로 발전해왔다."]],"w":"5번 문장에서 sisu는 전쟁 시의 육체적 용기를 뜻하는 옛 핀란드어 단어에서 유래했고, 시간이 지나 정신적·정서적 힘까지 포함하게 되었다고 해요. 원래 뜻과 나중 뜻이 뒤바뀐 진술이에요.","c":"F"},"h":"2a54af917c"},{"n":3,"t":"tf","q":"The Finns were badly outnumbered, but they still caused heavy losses to the Soviet side.","ko":"핀란드인들은 수적으로 심하게 열세였지만, 그래도 소련 측에 막대한 손실을 입혔다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"Badly outnumbered but filled with sisu, the Finns exacted heavy losses on the Soviet side, thus discovering that sisu functioned almost as a collective survival strategy.","수적으로는 심하게 열세였지만 sisu 로 가득 찬 핀란드인들은 소련 측에 막대한 손실을 입혔고, 이로써 sisu 가 거의 집단적인 생존 전략으로서 기능한다는 것을 발견했다."]],"w":"14번 문장에서 핀란드인들은 수적으로 심하게 열세였지만(Badly outnumbered) sisu로 가득 차 소련 측에 막대한 손실을 입혔다고 해요.","c":"T"},"h":"4bc678eb62"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The first is extraordinary perseverance in the face of seemingly overwhelming odds.)","ko":"첫 번째는 겉보기에 압도적인 역경에 직면했을 때의 비범한 인내심이다.","opts":["사소한","즐거운","압도적인","익숙한"],"word":"overwhelming","r":{"a":"3) 압도적인","ev":"7번 문장","s":[[7,"The first is extraordinary perseverance in the face of seemingly overwhelming odds.","첫 번째는 겉보기에 압도적인 역경에 직면했을 때의 비범한 인내심이다."]],"w":"7번의 첫째 요소는 인내심이에요. 인내심이 필요한 것은 견디기 어려운 상황이니, overwhelming odds는 '압도적인 역경'이에요. 사소하거나 즐거운 일이라면 인내심을 말할 이유가 없어요.","c":3},"h":"6441bee53a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... the Finnish public needed something positive to rally around.)","ko":"... 핀란드 대중은 하나로 뭉칠 수 있는 긍정적인 무언가가 필요했다.","opts":["~에서 도망치다","~에 반대하다","~을 비웃다","~을 중심으로 뭉치다"],"word":"rally around","r":{"a":"4) ~을 중심으로 뭉치다","ev":"11번 문장","s":[[11,"By this time, weary from centuries of occupation by various foreign powers, the Finnish public needed something positive to rally around.","이때쯤, 다양한 외세에 의한 수세기에 걸친 점령으로 지친 핀란드 대중은 하나로 뭉칠 수 있는 긍정적인 무언가가 필요했다."]],"w":"지친 대중이 필요로 한 것은 something positive(긍정적인 무언가)예요. 12번에서 지식인들이 sisu를 되살렸다고 하니, 대중이 하나로 뭉칠 수 있는 구심점이라는 뜻이에요.","c":4},"h":"af2a4fabd3"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis proved fortunate when the newly formed Soviet Union invaded Finland in 1939.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 1939년 신생 소련이 핀란드를 침공했을 때 다행스러운 일로 판명되었다.","opts":["핀란드가 1917년 러시아로부터 독립을 이룬 것","핀란드 지식인들이 sisu를 민족 의식 속에 되살리는 것을 도운 일","소련이 1939년 핀란드를 침공한 것","핀란드 대중이 수세기 동안의 점령에 지친 것"],"r":{"a":"2) 핀란드 지식인들이 sisu를 민족 의식 속에 되살리는 것을 도운 일","ev":"12~13번 문장","s":[[12,"Finnish intellectuals seized upon the idea of sisu and helped revive it in the national consciousness.","핀란드 지식인들은 sisu 라는 개념을 포착하여 그것을 민족 의식 속에 되살리는 것을 도왔다."],[13,"This proved fortunate when the newly formed Soviet Union invaded Finland in 1939.","이것은 1939년 신생 소련이 핀란드를 침공했을 때 다행스러운 일로 판명되었다."]],"w":"13번의 This는 바로 앞 12번의 내용, 곧 지식인들이 sisu를 민족 의식 속에 되살린 일이에요. 그 일이 소련이 침공했을 때 '다행스러운 일로 판명되었다'는 뜻이라서, 침공 자체(when 뒤)는 This가 아니에요.","c":2},"h":"1e0fc29fde"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Ask any Finnish person, and the answer will always be the same, sisu!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"어떤 핀란드 사람에게 물어보더라도, 대답은 항상 똑같이 sisu 일 것이다!","opts":["어떤 핀란드 사람에게 물어봐도 대답은 늘 sisu로 똑같을 것이다.","핀란드 사람에게 물으면 사람마다 전혀 다른 대답이 나올 것이다.","핀란드 사람 중 sisu를 아는 사람은 단 한 명뿐이다.","핀란드 사람에게 sisu에 대해 물으면 아무도 대답하지 않을 것이다."],"r":{"a":"1) 어떤 핀란드 사람에게 물어봐도 대답은 늘 sisu로 똑같을 것이다.","ev":"3번 문장","s":[[3,"Ask any Finnish person, and the answer will always be the same, sisu!","어떤 핀란드 사람에게 물어보더라도, 대답은 항상 똑같이 sisu 일 것이다!"]],"w":"Ask any Finnish person, and ~는 '어떤 핀란드 사람에게 물어봐도 ~'라는 뜻이에요(명령문, and ~). always the same(항상 똑같은)이라서 대답이 사람마다 다르다는 말은 틀려요.","c":1},"h":"c6201170c2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["sisu는 1939년 소련이 핀란드를 침공한 뒤에 처음 나타났다.","핀란드는 1917년에 소련으로부터 독립했다.","sisu는 핀란드가 러시아로부터 독립한 뒤에 재부상했다.","핀란드 지식인들이 1917년에 sisu라는 말을 처음 만들었다."],"opts":["Sisu first appeared after the Soviet Union invaded Finland in 1939.","Finland gained independence from the Soviet Union in 1917.","Sisu experienced a resurgence after Finland became independent from Russia.","Finnish intellectuals invented the word sisu in 1917."],"r":{"a":"3) Sisu experienced a resurgence after Finland became independent from Russia.","ev":"10번, 12~13번 문장","s":[[10,"While sisu had long been in the backdrop of Finnish society, it experienced a resurgence after Finland achieved independence from Russia in 1917.","sisu 는 오랫동안 핀란드 사회의 배경에 있었지만, 1917년 핀란드가 러시아로부터 독립을 달성한 후 재부상했다."],[12,"Finnish intellectuals seized upon the idea of sisu and helped revive it in the national consciousness.","핀란드 지식인들은 sisu 라는 개념을 포착하여 그것을 민족 의식 속에 되살리는 것을 도왔다."],[13,"This proved fortunate when the newly formed Soviet Union invaded Finland in 1939.","이것은 1939년 신생 소련이 핀란드를 침공했을 때 다행스러운 일로 판명되었다."]],"w":"10번에서 sisu는 오랫동안 핀란드 사회의 배경에 있었고, 1917년 핀란드가 러시아로부터 독립한 뒤에 재부상했다고 해요. 1번은 처음 나타난 시기가, 2번은 독립한 상대(러시아)가, 4번은 sisu를 만든 사람이 본문과 달라요(12번의 지식인들은 되살리는 것을 도왔어요).","c":3},"h":"edb624ba8c"},{"n":9,"t":"sum","q":"Sisu, which first meant (A) courage in war, grew into a broader idea, and in 1939 it helped the Finns (B) a larger enemy.","ko":"처음에 전쟁에서의 (A) 용기를 뜻했던 sisu는 더 넓은 개념으로 자랐고, 1939년에 핀란드인들이 더 큰 규모의 적에 (B) 도왔다.","oko":["(A) 정신적 / (B) 맞서 싸우도록","(A) 육체적 / (B) 항복하도록","(A) 육체적 / (B) 맞서 싸우도록","(A) 정서적 / (B) 항복하도록","(A) 정신적 / (B) 협력하도록"],"opts":["(A) mental / (B) fight back against","(A) physical / (B) surrender to","(A) physical / (B) fight back against","(A) emotional / (B) surrender to","(A) mental / (B) cooperate with"],"r":{"a":"3) (A) physical / (B) fight back against","ev":"5번, 14번 문장","s":[[5,"It derives from an old Finnish word for one’s physical courage in times of war but has developed over time into a larger concept that includes mental and emotional strength.","그것은 전쟁 시의 육체적 용기를 뜻하는 핀란드 고어에서 유래했지만, 시간이 지나면서 정신적이고 정서적인 힘을 포함하는 더 큰 개념으로 발전해왔다."],[14,"Badly outnumbered but filled with sisu, the Finns exacted heavy losses on the Soviet side, thus discovering that sisu functioned almost as a collective survival strategy.","수적으로는 심하게 열세였지만 sisu 로 가득 찬 핀란드인들은 소련 측에 막대한 손실을 입혔고, 이로써 sisu 가 거의 집단적인 생존 전략으로서 기능한다는 것을 발견했다."]],"w":"5번에서 sisu는 원래 전쟁 시의 육체적(physical) 용기를 뜻했어요. 14번에서 핀란드인들은 수적으로 심하게 열세였지만 sisu로 가득 차 소련 측에 막대한 손실을 입혔으니, 맞서 싸웠다(fight back against)는 뜻이에요. 항복(surrender)이나 협력(cooperate)이라면 막대한 손실을 입혔다는 내용과 맞지 않아요.","c":3},"h":"8f66972ce8"},{"n":10,"t":"fill","q":"Sisu is like a hidden well of power that can be [A] upon in times of physical or mental [B].","ko":"sisu는 신체적 또는 정신적 [B]의 시기에 [A] 쓸 수 있는 숨겨진 힘의 원천과 같다.","bank":["drawn","duress","derived","outnumbered","independence","backdrop"],"bko":{"drawn":"끌어다 (draw)","duress":"압박","derived":"유래한","outnumbered":"수적으로 열세인","independence":"독립","backdrop":"배경"},"r":{"a":"[A] drawn, [B] duress","ev":"9번 문장","s":[[9,"Finally, sisu is closely linked to the idea of inner strength—it is like a hidden well of power that can be drawn upon in times of physical or mental duress.","마지막으로, sisu 는 내면의 힘이라는 개념과 밀접하게 연관되어 있는데, 그것은 신체적 또는 정신적 압박의 시기에 끌어다 쓸 수 있는 숨겨진 힘의 원천과 같다."]],"w":"9번에서 sisu는 신체적 또는 정신적 압박(duress)의 시기에 끌어다 쓸(drawn upon) 수 있는 숨겨진 힘의 원천과 같다고 해요. independence(독립)와 backdrop(배경)은 10번의 재부상 이야기에 나오는 말이라 이 문장과 어울리지 않아요.","c":null},"h":"9c09288643"}]},{"u":2,"id":"ms4-02-1","no":1,"ko":"갑자기 신이 나타나서 다 해결해 준다고?","items":[{"n":1,"t":"tf","q":"In ancient Greek theater, gods were sometimes lowered onto the stage by mechanical devices.","ko":"고대 그리스 연극에서 신들은 때때로 기계 장치에 의해 무대 위로 내려왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In ancient Greek theater, gods were sometimes lowered onto the stage by mechanical devices, resolving otherwise impossible situations and signaling that the play had reached its end.","고대 그리스 연극에서, 신들은 때때로 기계 장치에 의해 무대 위로 내려와, 그렇지 않으면 불가능한 상황들을 해결하고 연극이 끝에 도달했음을 알렸다."]],"w":"5번 문장에 gods were sometimes lowered onto the stage by mechanical devices가 그대로 나와요. 신이 기계 장치로 내려오는 것이 이 용어의 뜻 ‘기계에서 나온 신’과도 이어져요.","c":"T"},"h":"1debe4259f"},{"n":2,"t":"tf","q":"In modern storytelling, deus ex machina is mostly welcomed without any criticism.","ko":"현대 스토리텔링에서 ‘데우스 엑스 마키나’는 대체로 아무 비판 없이 환영받는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"In modern storytelling, however, deus ex machina is often viewed critically.","그러나 현대 스토리텔링에서, ‘데우스 엑스 마키나’는 종종 비판적으로 간주된다."]],"w":"7번 문장에서 현대 스토리텔링에서는 종종 비판적으로 간주된다(is often viewed critically)고 했어요. 비판 없이 환영받는다는 말은 반대예요.","c":"F"},"h":"c64f0b4b98"},{"n":3,"t":"tf","q":"The two hobbits save themselves from the lava by their own plan.","ko":"두 호빗은 자신들의 계획으로 용암에서 스스로 벗어난다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Then, without warning, giant eagles appear and carry them to safety.","그때, 경고도 없이, 거대한 독수리들이 나타나 그들을 안전한 곳으로 실어 나른다."]],"w":"2번 문장에서 거대한 독수리들이 나타나 호빗들을 안전한 곳으로 실어 나른다고 했어요. 호빗들이 스스로 벗어난 것이 아니라 뜻밖의 도움으로 구해진 거예요.","c":"F"},"h":"d224d40df6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Yet, some writers employ deus ex machina deliberately.)","ko":"그러나 어떤 작가들은 ‘데우스 엑스 마키나’를 의도적으로 사용한다. (employ의 문맥상 뜻)","word":"employ","opts":["고용하다","비난하다","이용하다, 사용하다","삭제하다"],"r":{"a":"3) 이용하다, 사용하다","ev":"10번 문장","s":[[10,"Yet, some writers employ deus ex machina deliberately.","그러나, 어떤 작가들은 ‘데우스 엑스 마키나’ 를 의도적으로 사용한다."]],"w":"10번에서 작가들이 ‘데우스 엑스 마키나’를 의도적으로 쓴다는 문장이에요. 사람을 쓴다는 ‘고용’이 아니라 기법을 쓴다는 뜻이라 employ = 사용하다예요.","c":3},"h":"dbc29a6df4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…an abrupt resolution can redirect attention away from the solution itself…)","ko":"갑작스러운 해결은 주의를 해결책 그 자체에서 멀어지게 돌릴 수 있다. (redirect의 문맥상 뜻)","word":"redirect","opts":["(방향을) 다른 쪽으로 돌리다","(앞으로) 더 키우다","완전히 막다","처음부터 다시 쓰다"],"r":{"a":"1) (방향을) 다른 쪽으로 돌리다","ev":"12번 문장","s":[[12,"In this way, an abrupt resolution can redirect attention away from the solution itself and toward the questions that remain unanswered.","이런 식으로, 갑작스러운 해결은 해결책 그 자체에서 멀어져 여전히 답해지지 않은 질문들로 주의를 돌릴 수 있다."]],"w":"12번에서 주의를 해결책에서 답해지지 않은 질문들 쪽으로 옮겨 놓는다고 했어요. redirect = 방향을 돌리다예요.","c":1},"h":"a248db43a4"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAt the end of The Lord of the Rings, two hobbits complete an exhausting journey and fulfill their mission, only to face certain death as lava closes in around them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"<반지의 제왕>의 결말에서, 두 호빗은 고된 여정을 마치고 그들의 임무를 완수하지만, 용암이 그들 주위로 옥죄어 오면서 확실한 죽음에 직면하게 된다.","opts":["용암","두 호빗","거대한 독수리들","관객들"],"r":{"a":"2) 두 호빗","ev":"1번 문장","s":[[1,"At the end of The Lord of the Rings, two hobbits complete an exhausting journey and fulfill their mission, only to face certain death as lava closes in around them.","<반지의 제왕>의 결말에서, 두 호빗은 고된 여정을 마치고 그들의 임무를 완수하지만, 용암이 그들 주위로 옥죄어 오면서 확실한 죽음에 직면하게 된다."]],"w":"용암이 주위로 옥죄어 오는 상황에 놓인 것은 앞에 나온 two hobbits예요. close in around them은 ‘호빗들 주위로 다가온다’는 뜻이에요.","c":2},"h":"a24c6af06e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"What causes dissatisfaction is not the presence of a miraculous resolution, but the sense in the audience that it has not been earned.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"불만족을 유발하는 것은 기적적인 해결의 존재가 아니라, 그것이 정당하게 얻어진 것이 아니라는 관객들의 느낌이다.","opts":["관객이 불만을 느끼는 이유는 기적적인 해결이 등장하기 때문이다.","관객들은 기적적인 해결이 나오면 언제나 만족한다.","기적적인 해결이 나오지 않아서 관객들은 이야기를 이해하지 못한다.","관객을 불만스럽게 하는 것은 기적 자체가 아니라, 그 해결이 정당하게 얻어지지 않았다는 느낌이다."],"r":{"a":"4) 관객을 불만스럽게 하는 것은 기적 자체가 아니라, 그 해결이 정당하게 얻어지지 않았다는 느낌이다.","ev":"9번 문장","s":[[9,"What causes dissatisfaction is not the presence of a miraculous resolution, but the sense in the audience that it has not been earned.","불만족을 유발하는 것은 기적적인 해결의 존재가 아니라, 그것이 정당하게 얻어진 것이 아니라는 관객들의 느낌이다."]],"w":"not A but B 구조예요. A(기적적인 해결의 존재)가 아니라 B(정당하게 얻어지지 않았다는 느낌)가 불만의 원인이에요. ①은 A를 원인으로 말해서 반대예요.","c":4},"h":"464aa89c6f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고대 그리스 연극에서 ‘데우스 엑스 마키나’는 현실적으로 느껴지도록 만들어졌다.","‘데우스 엑스 마키나’는 언제나 관객에게 긍정적으로 여겨져 왔다.","고대 그리스 연극에서 이 기법은 이야기를 명확한 결말로 이끌기 위해 쓰였다.","작가들은 ‘데우스 엑스 마키나’를 일부러 쓰는 일이 절대 없다."],"opts":["In ancient Greek theater, deus ex machina was designed to feel realistic.","Deus ex machina has always been viewed positively by audiences.","In ancient Greek theater, the technique was used to bring the story to a clear conclusion.","Writers never use deus ex machina on purpose."],"r":{"a":"3) In ancient Greek theater, the technique was used to bring the story to a clear conclusion.","ev":"6번 문장","s":[[6,"At the time, this technique was not intended to feel realistic, but rather to bring the story to a clear conclusion.","그 당시에, 이 기법은 현실적으로 느껴지도록 의도된 것이 아니라, 오히려 이야기를 명확한 결말로 이끌기 위한 것이었다."]],"w":"6번 문장에서 그 당시 이 기법은 현실적으로 느껴지게 하려는 것이 아니라 이야기를 명확한 결말로 이끌기 위한 것이었다고 했어요. ①은 반대, ②는 7번과 반대, ④는 10번과 반대예요.","c":3},"h":"9e0e194f5c"},{"n":9,"t":"sum","q":"A story does not always exist to (A) its audience; in some cases, it is meant to keep the audience (B) even after the ending.","ko":"이야기는 항상 관객을 (A)하기 위해 존재하는 것은 아니며, 어떤 경우에는 결말 뒤에도 관객이 계속 (B)하게 하려는 것이다.","oko":["(A) 겁주다 / (B) 웃다","(A) 위로하다 / (B) 잊다","(A) 가르치다 / (B) 자다","(A) 위로하다 / (B) 생각하다","(A) 칭찬하다 / (B) 응원하다"],"opts":["(A) scare / (B) laughing","(A) comfort / (B) forgetting","(A) teach / (B) sleeping","(A) comfort / (B) thinking","(A) praise / (B) cheering"],"r":{"a":"4) (A) comfort / (B) thinking","ev":"13~14번 문장","s":[[13,"A story, then, does not always exist to comfort its audience.","그렇다면, 이야기는 항상 관객을 위로하기 위해 존재하는 것은 아니다."],[14,"In some cases, it seeks to ensure that the thinking continues long after the ending has arrived.","어떤 경우에는, 그것은 결말이 도달한 후에도 오랫동안 사고가 계속되도록 보장하기를 추구한다."]],"w":"13번에서 이야기는 항상 관객을 위로(comfort)하려는 것은 아니라고 했고, 14번에서 결말 뒤에도 생각(thinking)이 계속되게 하려 한다고 했어요.","c":4},"h":"54063060ec"},{"n":10,"t":"fill","q":"A deus ex machina feels weak when a problem is solved by an unexpected force without enough [A], so audiences feel the story has [B] its own logic.","ko":"예상치 못한 힘이 충분한 [A] 없이 문제를 해결하면 그 기법은 힘이 약하게 느껴지고, 관객은 이야기가 스스로의 논리를 [B]했다고 느낀다.","bank":["buildup","comfort","conclusion","violated","earned","solved"],"bko":{"buildup":"사전 준비","comfort":"위로","conclusion":"결말","violated":"위반했다","earned":"정당하게 얻었다","solved":"해결했다"},"r":{"a":"[A] buildup, [B] violated","ev":"8번 문장","s":[[8,"When a problem is solved by an unexpected force introduced without sufficient buildup, audiences may feel that the narrative has violated its own logic.","충분한 사전 준비 없이 도입된 예상치 못한 힘에 의해 문제가 해결될 때, 관객들은 서사가 그 자체의 논리를 위반했다고 느낄지도 모른다."]],"w":"8번에서 충분한 사전 준비(buildup) 없이 예상치 못한 힘으로 문제가 해결되면 서사가 자신의 논리를 위반했다(violated)고 느낀다고 했어요. earned는 9번에서 ‘얻어지지 않았다’고 부정되는 쪽이라 맞지 않아요.","c":null},"h":"e3351bae68"}]},{"u":2,"id":"ms4-02-2","no":2,"ko":"플라스틱의 천적이 될 테야!","items":[{"n":1,"t":"tf","q":"I. sakaiensis releases an enzyme that breaks down plastic so that it can use the carbon in the plastic as energy.","ko":"I. sakaiensis는 플라스틱 속 탄소를 에너지로 쓰기 위해 플라스틱을 분해하는 효소를 내놓는다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"This bacterium secretes a special enzyme that degrades plastic in order to metabolize the carbon within it as an energy source.","이 박테리아는 에너지원으로 이것 내부의 탄소를 대사하기 위해 플라스틱을 분해하는 특별한 효소를 분비한다."]],"w":"4번 문장에 special enzyme that degrades plastic, in order to metabolize the carbon … as an energy source가 나와요. 효소로 분해해서 탄소를 에너지로 쓴다는 내용과 같아요.","c":"T"},"h":"1111f5d5a6"},{"n":2,"t":"tf","q":"The researchers were pleased with the speed at which the bacteria consumed the plastic.","ko":"연구원들은 박테리아가 플라스틱을 소비하는 속도에 만족했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"However, such a long time was disappointing given the results obtained.","그러나, 얻어진 결과를 고려할 때 그렇게 긴 시간은 실망스러웠다."]],"w":"6번 문장에서 얻어진 결과에 비해 그렇게 긴 시간은 실망스러웠다(disappointing)고 했어요. 만족했다는 말은 반대예요.","c":"F"},"h":"5d76817e1f"},{"n":3,"t":"tf","q":"Scientists are trying to combine the DNA of I. sakaiensis with that of a bacterium that thrives in salt water.","ko":"과학자들은 I. sakaiensis의 DNA를 소금물에서 번성하는 박테리아의 DNA와 결합하려고 시도하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Scientists are attempting to integrate the DNA of I. sakaiensis with that of Vibrio natriegens, a bacterium known to thrive in salt water.","과학자들은 I. sakaiensis의 DNA를 소금물에서 번성하는 것으로 알려진 박테리아인 비브리오 나트리에겐스(Vibrio natriegens)의 DNA와 통합하려고 시도하고 있다."]],"w":"11번 문장에서 I. sakaiensis의 DNA를 소금물에서 번성하는 것으로 알려진 Vibrio natriegens의 DNA와 통합하려 한다고 했어요. integrate = 통합하다예요.","c":"T"},"h":"bfd0540964"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…a marine environment, where large amounts of microplastics have accumulated.)","ko":"미세 플라스틱이 많이 쌓인 해양 환경 (accumulated의 문맥상 뜻)","word":"accumulated","opts":["사라졌다","흩어졌다","쌓였다","분해되었다"],"r":{"a":"3) 쌓였다","ev":"10번 문장","s":[[10,"Genetic research may also enable I. sakaiensis to function in a marine environment, where large amounts of microplastics have accumulated.","유전적 연구는 또한 I. sakaiensis가 많은 양의 미세 플라스틱이 축적된 해양 환경에서 기능할 수 있게 해줄지도 모른다."]],"w":"10번에서 해양 환경은 많은 양의 미세 플라스틱이 모여 있는 곳이에요. have accumulated = 쌓여 있다예요.","c":3},"h":"45e3e7c5a1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Despite efforts to curb plastic consumption, global production still exceeds 380 million tons annually.)","ko":"플라스틱 소비를 억제하려는 노력에도 불구하고 전 세계 생산량은 여전히 연간 3억 8천만 톤을 넘는다. (curb의 문맥상 뜻)","word":"curb","opts":["억제하다, 줄이다","늘리다","찾아내다","판매하다"],"r":{"a":"1) 억제하다, 줄이다","ev":"1번 문장","s":[[1,"Despite efforts to curb plastic consumption, global production still exceeds 380 million tons annually.","플라스틱 소비를 억제하려는 노력에도 불구하고, 전 세계 생산량은 여전히 연간 3억 8천만 톤을 초과한다."]],"w":"1번 문장은 Despite(~에도 불구하고)로 시작해서, 소비를 줄이려는 노력이 있는데도 생산량이 여전히 많다는 뜻이에요. curb = 억제하다예요.","c":1},"h":"e08f87dac3"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen placed in a dry container with a small piece of plastic weighing only 200 milligrams, the bacteria took about seven weeks to consume it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"200밀리그램밖에 나가지 않는 작은 플라스틱 조각이 있는 건조한 용기에 놓였을 때, 그 박테리아가 그것을 소비하는 데 약 7주가 걸렸다.","opts":["박테리아","건조한 용기","작은 플라스틱 조각","7주라는 시간"],"r":{"a":"3) 작은 플라스틱 조각","ev":"5번 문장","s":[[5,"When placed in a dry container with a small piece of plastic weighing only 200 milligrams, the bacteria took about seven weeks to consume it.","200밀리그램밖에 나가지 않는 작은 플라스틱 조각이 있는 건조한 용기에 놓였을 때, 그 박테리아가 그것을 소비하는 데 약 7주가 걸렸다."]],"w":"박테리아가 소비한(consume) 대상은 용기 안에 있던 작은 플라스틱 조각이에요. weighing only 200 milligrams가 그 조각을 꾸며 줘요.","c":3},"h":"d5856d4f6c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By applying thousands of random mutations to the enzyme and then evaluating their effects, researchers hope to create a version of the bacterium that can break down plastic quickly and effectively.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"효소에 수천 개의 무작위 돌연변이를 적용하고 그 효과를 평가함으로써, 연구원들은 플라스틱을 빠르고 효과적으로 분해할 수 있는 그 박테리아의 한 유형을 만들어 내기를 희망한다.","opts":["효소 하나에 정확히 한 가지 변화만 주어 그 효과를 확인한다.","수천 개의 무작위 돌연변이를 효소에 적용하고 그 효과를 평가해, 플라스틱을 빠르고 효과적으로 분해하는 박테리아를 만들려 한다.","박테리아를 수천 개로 늘려서 플라스틱을 한꺼번에 먹게 한다.","무작위로 고른 플라스틱의 효과를 평가해 효소의 종류를 줄인다."],"r":{"a":"2) 수천 개의 무작위 돌연변이를 효소에 적용하고 그 효과를 평가해, 플라스틱을 빠르고 효과적으로 분해하는 박테리아를 만들려 한다.","ev":"9번 문장","s":[[9,"By applying thousands of random mutations to the enzyme and then evaluating their effects, researchers hope to create a version of the bacterium that can break down plastic quickly and effectively.","효소에 수천 개의 무작위 돌연변이를 적용하고 그 효과를 평가함으로써, 연구원들은 플라스틱을 빠르고 효과적으로 분해할 수 있는 그 박테리아의 한 유형을 만들어 내기를 희망한다."]],"w":"By applying A and then evaluating B는 ‘A를 적용하고 B를 평가함으로써’예요. 효소에 수천 개의 무작위 돌연변이를 적용하고 효과를 평가해서 빠르게 분해하는 박테리아를 만들려는 거예요.","c":2},"h":"45bb7a83a9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["I. sakaiensis는 효소를 전혀 쓰지 않고 플라스틱을 분해한다.","과학자들은 이미 그 박테리아로 바다의 플라스틱 쓰레기를 제거했다.","박테리아는 작은 플라스틱 조각을 하루 안에 다 먹었다.","일본 과학자 팀이 2016년에 I. sakaiensis를 발견했다."],"opts":["I. sakaiensis breaks down plastic without using any enzyme.","Scientists have already removed plastic waste from the oceans with the bacterium.","The bacteria finished eating the small plastic piece within one day.","A team of Japanese scientists discovered I. sakaiensis in 2016."],"r":{"a":"4) A team of Japanese scientists discovered I. sakaiensis in 2016.","ev":"3번 문장","s":[[3,"In 2016, a team of Japanese scientists discovered Ideonella sakaiensis (I. sakaiensis), a bacterium with the ability to break down polyethylene terephthalate (PET), the plastic commonly used in bottles and packaging, within a laboratory setting.","2016년에, 한 일본 과학자 팀이 실험실 환경 내에서 병과 포장에 흔히 사용되는 플라스틱인 폴리에틸렌 테레프탈레이트(PET)를 분해하는 능력을 갖춘 박테리아인 ‘이데오넬라 사카이엔시스’(I. sakaiensis)를 발견했다."]],"w":"3번 문장에서 2016년에 일본 과학자 팀이 I. sakaiensis를 발견했다고 했어요. ①은 4번과 반대(효소를 써요), ②는 12번에서 아직 미래의 가능성이고, ③은 5번에서 약 7주가 걸렸다고 해요.","c":4},"h":"79fe7e0225"},{"n":9,"t":"sum","q":"If the DNA experiments are successful, they could pave the way for (A) plastic waste from the planet’s (B) in the future.","ko":"DNA 실험이 성공하면, 미래에 지구의 (B)에서 플라스틱 쓰레기를 (A)하는 길을 열 수 있다.","oko":["(A) 생산하는 / (B) 바다","(A) 제거하는 / (B) 실험실","(A) 재활용하는 / (B) 공장","(A) 제거하는 / (B) 바다","(A) 태우는 / (B) 숲"],"opts":["(A) producing / (B) oceans","(A) removing / (B) laboratories","(A) recycling / (B) factories","(A) removing / (B) oceans","(A) burning / (B) forests"],"r":{"a":"4) (A) removing / (B) oceans","ev":"12번 문장","s":[[12,"If these experiments are successful, it could pave the way for removing plastic waste from the planet’s oceans in the future.","만약 이 실험들이 성공한다면, 미래에 지구의 바다에서 플라스틱 쓰레기를 제거하는 것을 가능케 할 길을 열 수 있을 것이다."]],"w":"12번 문장에서 실험이 성공하면 미래에 지구의 바다(oceans)에서 플라스틱 쓰레기를 제거하는(removing) 길을 열 수 있다고 했어요.","c":4},"h":"d0b2b7bdf1"},{"n":10,"t":"fill","q":"Scientists believe genetically modifying bacteria could [A] plastic decomposition, and one approach is to change the [B] produced by I. sakaiensis.","ko":"과학자들은 박테리아를 유전적으로 변형하면 플라스틱 분해를 [A]할 수 있다고 믿고, 한 가지 접근법은 I. sakaiensis가 만드는 [B]를 바꾸는 것이다.","bank":["accelerate","enzyme","curb","bacterium","container","consume"],"bko":{"accelerate":"가속하다","enzyme":"효소","curb":"억제하다","bacterium":"박테리아","container":"용기","consume":"소비하다"},"r":{"a":"[A] accelerate, [B] enzyme","ev":"7~8번 문장","s":[[7,"Fortunately, other scientists believe they have found a way to address this issue—genetically modifying bacteria to accelerate plastic decomposition.","다행히도, 다른 과학자들은 이 문제를 해결할 방법을 찾았다고 믿는데, 그것은 플라스틱 분해를 가속하기 위해 박테리아를 유전적으로 변형하는 것이다."],[8,"One approach involves genetically modifying the enzyme produced by I. sakaiensis.","한 가지 접근법은 I. sakaiensis에 의해 생성되는 효소를 유전적으로 변형하는 것을 포함한다."]],"w":"7번에서 박테리아를 유전적으로 변형해 플라스틱 분해를 가속하는(accelerate) 방법을 찾았다고 했고, 8번에서 I. sakaiensis가 만드는 효소(enzyme)를 변형하는 접근법을 말해요. curb(억제하다)는 분해를 늦추는 뜻이라 반대예요.","c":null},"h":"133783beac"}]},{"u":2,"id":"ms4-02-3","no":3,"ko":"불가능을 깨뜨린 4분의 기적","items":[{"n":1,"t":"tf","q":"While studying to become a doctor, Bannister also spent time on running.","ko":"의사가 되기 위해 공부하는 동안, 배니스터는 달리기에도 시간을 썼다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"While studying at Oxford University Medical School to become a doctor, he also devoted time to pursuing an entirely different passion—running.","의사가 되기 위해 옥스퍼드 의과대학에서 공부하는 동안, 그는 또한 완전히 다른 열정인 달리기를 추구하는 데 시간을 쏟았다."]],"w":"3번 문장에 While studying … to become a doctor, he also devoted time to pursuing … running이 나와요. 의대 공부와 달리기를 함께 한 거예요.","c":"T"},"h":"b16ac18824"},{"n":2,"t":"tf","q":"At that time, experts said that running a mile in under four minutes would be good for the heart.","ko":"그 당시 전문가들은 1마일을 4분 미만에 달리는 것이 심장에 좋을 것이라고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"At that time, some experts claimed that running that fast could put excessive strain on the heart, potentially leading to death.","그 당시, 일부 전문가들은 그렇게 빨리 달리는 것이 심장에 과도한 부담을 주어 자칫하면 사망에 이르게 할 수 있다고 주장했다."]],"w":"7번 문장에서 일부 전문가들은 그렇게 빨리 달리면 심장에 과도한 부담을 주어 사망에 이를 수 있다고 주장했어요. 심장에 좋다는 말은 반대예요.","c":"F"},"h":"63b5a5c7a7"},{"n":3,"t":"tf","q":"Bannister ran a mile in under four minutes for the first time in human history.","ko":"배니스터는 인류 역사상 처음으로 1마일을 4분 미만에 달렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Finally, for the first time in human history, he crossed the finish line in under 4 minutes, with a record of 3 minutes 59.4 seconds.","마침내, 인류 역사상 처음으로, 그는 3분 59.4초의 기록으로 4분 미만에 결승선을 통과했다."]],"w":"10번 문장에 for the first time in human history, he crossed the finish line in under 4 minutes가 그대로 나와요. 기록은 3분 59.4초예요.","c":"T"},"h":"775c7665ed"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (After relentless efforts, on May 6, 1954, Bannister participated in a mile race.)","ko":"끊임없는 노력 끝에, 1954년 5월 6일 배니스터는 1마일 경주에 참가했다. (relentless의 문맥상 뜻)","word":"relentless","opts":["가벼운","끊임없는","짧은","우연한"],"r":{"a":"2) 끊임없는","ev":"9번 문장","s":[[9,"After relentless efforts, on May 6, 1954, Bannister participated in a mile race.","끊임없는 노력 끝에, 1954년 5월 6일, 배니스터는 1마일 경주에 참가했다."]],"w":"9번은 경주에 나가기까지 쉬지 않고 계속한 노력을 말해요. relentless efforts = 끊임없는 노력이에요.","c":2},"h":"5af40204ea"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Born in England in 1929, Roger Bannister was a gifted young man.)","ko":"1929년 영국에서 태어난 로저 배니스터는 재능 있는 청년이었다. (gifted의 문맥상 뜻)","word":"gifted","opts":["가난한","외로운","평범한","재능 있는"],"r":{"a":"4) 재능 있는","ev":"2번 문장","s":[[2,"Born in England in 1929, Roger Bannister was a gifted young man.","1929년 영국에서 태어난 로저 배니스터는 재능 있는 청년이었다."]],"w":"2번은 배니스터를 소개하는 문장이고, 이어서 4번에서 타고난 재능(natural talent)이 나와요. gifted = 재능 있는이에요.","c":4},"h":"b46726f5a8"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nHis natural talent and consistent effort led him to win the British championship in the mile in 1951, which resulted in him qualifying for the Helsinki Olympics the following year.","ko":"밑줄 친 which가 가리키는 것은?","sko":"그의 타고난 재능과 꾸준한 노력은 그가 1951년 1마일 달리기 영국 선수권 대회에서 우승하도록 이끌었고, 이는 그가 다음 해 헬싱키 올림픽 자격을 얻는 결과를 낳았다.","opts":["1951년 영국 선수권 대회 1마일 달리기에서 우승한 일","옥스퍼드 의과대학에서 공부한 일","헬싱키 올림픽에서 4위를 한 일","달리기라는 열정을 추구한 일"],"r":{"a":"1) 1951년 영국 선수권 대회 1마일 달리기에서 우승한 일","ev":"4번 문장","s":[[4,"His natural talent and consistent effort led him to win the British championship in the mile in 1951, which resulted in him qualifying for the Helsinki Olympics the following year.","그의 타고난 재능과 꾸준한 노력은 그가 1951년 1마일 달리기 영국 선수권 대회에서 우승하도록 이끌었고, 이는 그가 다음 해 헬싱키 올림픽 자격을 얻는 결과를 낳았다."]],"w":"계속적 용법의 which는 앞 내용 전체를 받아요. 1951년 영국 선수권에서 우승한 일이 그 다음 해 헬싱키 올림픽 자격을 얻는 결과를 낳았어요.","c":1},"h":"2144c6c601"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Although his record was broken less than two months later, his spirit of challenge has inspired others to achieve what was previously thought impossible in human performance.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 그의 기록은 두 달도 안 되어 깨졌지만, 그의 도전 정신은 이전에 인간의 수행 능력에서 불가능하다고 생각되었던 것을 성취하도록 다른 사람들에게 영감을 주었다.","opts":["배니스터의 기록은 두 달 넘게 깨지지 않아 다른 사람들이 포기했다.","배니스터의 기록이 깨지자 그의 도전 정신도 사라졌다.","기록은 두 달도 안 되어 깨졌지만, 그의 도전 정신은 불가능하다고 여겨지던 일을 해내도록 다른 사람들에게 영감을 주었다.","배니스터는 다른 사람들이 불가능하다고 믿도록 영감을 주었다."],"r":{"a":"3) 기록은 두 달도 안 되어 깨졌지만, 그의 도전 정신은 불가능하다고 여겨지던 일을 해내도록 다른 사람들에게 영감을 주었다.","ev":"11번 문장","s":[[11,"Although his record was broken less than two months later, his spirit of challenge has inspired others to achieve what was previously thought impossible in human performance.","비록 그의 기록은 두 달도 안 되어 깨졌지만, 그의 도전 정신은 이전에 인간의 수행 능력에서 불가능하다고 생각되었던 것을 성취하도록 다른 사람들에게 영감을 주었다."]],"w":"Although(비록 ~이지만) 뒤가 양보예요. 기록은 일찍 깨졌지만 도전 정신은 남아 사람들에게 영감을 줬어요. 영감의 내용은 ‘불가능하다고 생각되던 것을 이루는 것’이라 ④와는 반대예요.","c":3},"h":"9a7766d69f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["배니스터는 일주일에 하루, 하루에 다섯 시간씩 훈련했다.","배니스터는 꾸준한 훈련이 그가 장벽을 깨게 해 줄 것이라고 믿었다.","배니스터는 헬싱키 올림픽 이후 달리기를 포기했다.","배니스터는 전문가들의 경고 때문에 장벽을 깨려는 시도를 그만두었다."],"opts":["Bannister trained for five hours a day, one day a week.","Bannister believed that his steady training would allow him to break the barrier.","Bannister gave up running after the Helsinki Olympics.","Bannister stopped trying to break the barrier because experts warned him."],"r":{"a":"2) Bannister believed that his steady training would allow him to break the barrier.","ev":"8번 문장","s":[[8,"However, he believed that his steady approach to training—one hour of running, five days a week—would allow him to break the barrier.","그러나, 그는 일주일에 5일, 한 시간씩 달리는 자신의 꾸준한 훈련 방식이 그 장벽을 깰 수 있게 해줄 것이라고 믿었다."]],"w":"8번 문장에서 배니스터는 꾸준한 훈련 방식이 장벽을 깨게 해 줄 거라고 믿었어요. 훈련은 하루 한 시간, 일주일에 5일이라 ①은 반대예요. ③과 ④는 6번에서 그가 더 큰 목표를 세웠다는 내용과 달라요.","c":2},"h":"2d2dd1a477"},{"n":9,"t":"sum","q":"After failing to win a gold medal, Bannister refused to let this failure (A) his passion and aimed to break the four-minute (B).","ko":"금메달을 따지 못한 뒤에도, 배니스터는 이 실패가 열정을 (A)하도록 두지 않고 4분의 (B)을 깨는 것을 목표로 삼았다.","oko":["(A) 강하게 하다 / (B) 장벽","(A) 무디게 하다 / (B) 메달","(A) 무디게 하다 / (B) 장벽","(A) 숨기다 / (B) 거리","(A) 늘리다 / (B) 선수권 대회"],"opts":["(A) strengthen / (B) barrier","(A) dull / (B) medal","(A) dull / (B) barrier","(A) hide / (B) distance","(A) increase / (B) championship"],"r":{"a":"3) (A) dull / (B) barrier","ev":"5~6번 문장","s":[[5,"Unfortunately, he failed to achieve the goal of winning a gold medal and finished in fourth place.","불행히도, 그는 금메달을 따겠다는 목표를 달성하는 데 실패했고, 4위로 경기를 마쳤다."],[6,"However, Bannister refused to let this setback dull his passion; he aimed for an even greater goal—breaking the “four-minute barrier” in the mile.","그러나, 배니스터는 이 좌절이 그의 열정을 무디게 하도록 내버려 두지 않았고, 그는 훨씬 더 큰 목표, 즉 1마일 달리기에서 “4분의 장벽”을 깨는 것을 목표로 삼았다."]],"w":"5번에서 금메달을 따지 못했고, 6번에서 이 좌절이 열정을 무디게(dull) 하도록 내버려 두지 않으며 4분의 장벽(barrier)을 깨는 것을 목표로 삼았다고 했어요.","c":3},"h":"e5234dcf78"},{"n":10,"t":"fill","q":"When everyone said it was [A], one runner stood on the athletic track with the [B] to achieve what no one had done before.","ko":"모두가 그것이 [A]하다고 말했을 때, 한 주자는 아무도 해내지 못한 것을 성취하겠다는 [B]을 가지고 육상 트랙에 섰다.","bank":["impossible","conviction","setback","steady","gifted","relentless"],"bko":{"impossible":"불가능한","conviction":"확신","setback":"좌절","steady":"꾸준한","gifted":"재능 있는","relentless":"끊임없는"},"r":{"a":"[A] impossible, [B] conviction","ev":"1번 문장","s":[[1,"When everyone said it was impossible, one runner stood on the athletic track with the conviction to achieve what no one had done before.","모두가 불가능하다고 말했을 때, 한 주자가 아무도 해내지 못한 것을 성취하겠다는 확신을 가지고 육상 트랙에 섰다."]],"w":"1번 문장에서 모두가 불가능하다(impossible)고 말할 때 한 주자가 확신(conviction)을 가지고 트랙에 섰어요. 나머지 단어는 다른 문장에서 쓰인 말이라 이 자리에 들어가지 않아요.","c":null},"h":"11d3e99f54"}]},{"u":2,"id":"ms4-02-4","no":4,"ko":"Why Bother Counting the Cold?","items":[{"n":1,"t":"tf","q":"The Roman New Year did not begin on January 1.","ko":"로마의 새해는 1월 1일에 시작되지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Unlike today, the Roman New Year did not begin on January 1.","오늘날과 달리, 로마의 새해는 1월 1일에 시작되지 않았다."]],"w":"1번 문장에 Unlike today, the Roman New Year did not begin on January 1이 그대로 있어요. 2번에서 3월에 시작했다고 설명해요.","c":"T"},"h":"740cb6b620"},{"n":2,"t":"tf","q":"In the early Roman calendar, winter was carefully recorded.","ko":"초기 로마 달력에서 겨울은 꼼꼼하게 기록되었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Winter—a season in which little to no activity took place—was left out entirely and simply passed without being recorded.","활동이 거의 또는 전혀 일어나지 않는 계절인 겨울은 완전히 배제되었고 기록되지 않은 채 단순히 지나갔다."]],"w":"3번 문장에서 겨울은 완전히 배제되었고 기록되지 않은 채 단순히 지나갔다(passed without being recorded)고 했어요. 꼼꼼히 기록했다는 말은 반대예요.","c":"F"},"h":"2e6d226f3d"},{"n":3,"t":"tf","q":"The two new months were added to the beginning of the calendar, not to the end.","ko":"두 개의 새로운 달은 달력의 끝이 아니라 시작에 추가되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"But instead of being placed at the end, they were added to the beginning, reflecting the Roman belief that winter marked both the end of one year and a time of preparation for the next.","그러나 끝에 배치되는 대신, 겨울이 한 해의 끝이자 다음 해를 위한 준비의 시간을 나타낸다는 로마인들의 믿음을 반영하여 그것들은 시작에 추가되었다."]],"w":"10번 문장에서 끝에 배치되는 대신 시작에 추가되었다(they were added to the beginning)고 했어요. 겨울이 한 해의 끝이면서 다음 해를 준비하는 시간이라는 믿음을 반영한 거예요.","c":"T"},"h":"69a11bfd81"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…it began in March, when the ground thawed and activities such as farming and warfare could begin.)","ko":"땅이 녹고 농사와 전쟁 같은 활동이 시작될 수 있는 3월 (thawed의 문맥상 뜻)","word":"thawed","opts":["녹았다","얼었다","갈라졌다","말랐다"],"r":{"a":"1) 녹았다","ev":"2번 문장","s":[[2,"In ancient Rome, it began in March, when the ground thawed and activities such as farming and warfare could begin.","고대 로마에서, 그것은 땅이 녹고 농사와 전쟁 같은 활동이 시작될 수 있는 3월에 시작되었다."]],"w":"2번에서 겨울이 끝나고 농사 같은 활동을 시작할 수 있는 3월이 되었다는 흐름이에요. 땅이 thaw = 얼었던 땅이 녹는다는 뜻이에요.","c":1},"h":"7ff5c83937"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He incorporated the previously excluded winter period by adding two new months.)","ko":"그는 두 개의 새로운 달을 추가함으로써 이전에 제외된 겨울 기간을 포함했다. (incorporated의 문맥상 뜻)","word":"incorporated","opts":["제거했다","숨겼다","포함했다","번역했다"],"r":{"a":"3) 포함했다","ev":"9번 문장","s":[[9,"He incorporated the previously excluded winter period by adding two new months.","그는 두 개의 새로운 달을 추가함으로써 이전에 제외된 겨울 기간을 포함했다."]],"w":"9번은 이전에 제외된(excluded) 겨울을 두 달을 더해 달력 안에 넣었다는 문장이에요. incorporate = 포함하다예요.","c":3},"h":"fe02654358"},{"n":6,"t":"ref","q":"What does the underlined \"this mismatch\" refer to?\nBecause of this mismatch, the beginning and end of the year were not clearly defined, leading to confusion in administrative matters and in the dates of religious events.","ko":"밑줄 친 this mismatch가 가리키는 것은?","sko":"이 불일치 때문에, 연초와 연말이 명확하게 정의되지 않았고, 행정 업무와 종교 행사의 날짜에 혼란을 초래했다.","opts":["로마인의 종교 행사와 농사 시기의 차이","1년은 12개월인데 로마 달력에는 10개월만 표시된 것","1월 1일과 3월 1일 사이의 날짜 차이","한 달이 29일인지 31일인지의 차이"],"r":{"a":"2) 1년은 12개월인데 로마 달력에는 10개월만 표시된 것","ev":"6~7번 문장","s":[[6,"In other words, although 12 months elapsed in a full year, the Roman calendar displayed only 10.","다시 말해, 비록 1년 동안 12 개월이 경과했지만, 로마 달력은 오직 10개월만 표시했다."],[7,"Because of this mismatch, the beginning and end of the year were not clearly defined, leading to confusion in administrative matters and in the dates of religious events.","이 불일치 때문에, 연초와 연말이 명확하게 정의되지 않았고, 행정 업무와 종교 행사의 날짜에 혼란을 초래했다."]],"w":"7번의 this mismatch는 바로 앞 6번의 내용이에요. 1년 동안 12개월이 지나는데 로마 달력은 10개월만 보여 줬어요. 그래서 연초와 연말이 분명하지 않았어요.","c":2},"h":"124d3d17a1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Janus had two faces, one looking back to the past and another toward the future, symbolizing a moment that is both an ending and a beginning.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"야누스는 두 개의 얼굴을 가졌는데, 하나는 과거를 뒤돌아보고 다른 하나는 미래를 향해 있어서, 끝이자 시작인 순간을 상징했다.","opts":["야누스는 얼굴이 하나뿐이어서 과거만 바라본다.","야누스는 두 얼굴로 서로 다른 두 신을 나타낸다.","야누스의 두 얼굴은 미래의 두려움을 상징해 사람들이 새해를 피하게 했다.","야누스는 한쪽 얼굴로 과거를, 다른 쪽 얼굴로 미래를 바라보며, 끝이자 시작인 순간을 상징한다."],"r":{"a":"4) 야누스는 한쪽 얼굴로 과거를, 다른 쪽 얼굴로 미래를 바라보며, 끝이자 시작인 순간을 상징한다.","ev":"12번 문장","s":[[12,"Janus had two faces, one looking back to the past and another toward the future, symbolizing a moment that is both an ending and a beginning.","야누스는 두 개의 얼굴을 가졌는데, 하나는 과거를 뒤돌아보고 다른 하나는 미래를 향해 있어서, 끝이자 시작인 순간을 상징했다."]],"w":"one looking back to the past and another toward the future는 한 얼굴은 과거를, 다른 얼굴은 미래를 본다는 뜻이에요. 그래서 끝이면서 시작인 순간을 상징해요.","c":4},"h":"b0f16bf361"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["누마 폼필리우스 왕이 기원전 713년경 로마 달력을 개혁했다.","1월은 로마의 전쟁의 신의 이름을 따서 지어졌다.","로마인들은 겨울이 한 해를 끝낸다고 생각해서 새 달을 끝에 배치했다.","고대 로마에서 농사와 전쟁은 겨울에 시작되었다."],"opts":["King Numa Pompilius reformed the Roman calendar around 713 BC.","January was named after the Roman god of war.","The Romans placed the new months at the end because winter ended the year.","Farming and warfare began in winter in ancient Rome."],"r":{"a":"1) King Numa Pompilius reformed the Roman calendar around 713 BC.","ev":"8번 문장","s":[[8,"To address this issue, King Numa Pompilius reformed the Roman calendar in around 713 BC.","이 문제를 해결하기 위해, 누마 폼필리우스 왕은 기원전 713년경에 로마 달력을 개혁했다."]],"w":"8번 문장에서 누마 폼필리우스 왕이 기원전 713년경에 로마 달력을 개혁했다고 해요. ②는 11번에서 1월이 문과 시작의 신 야누스에서 온 이름이라 달라요. ③은 10번에서 시작에 추가했다고 하고, ④는 2번에서 땅이 녹는 3월에 시작했다고 해요.","c":1},"h":"d8e65c0734"},{"n":9,"t":"sum","q":"Winter came to be seen not as an (A) stretch of time but as a (B) period, so January took its place at the start of the calendar.","ko":"겨울은 (A) 시간이 아니라 (B) 기간으로 여겨지게 되었고, 그래서 1월은 달력의 시작에 자리를 잡았다.","oko":["(A) 바쁜 / (B) 과도기의","(A) 비어 있는 / (B) 과도기의","(A) 비어 있는 / (B) 영구적인","(A) 추운 / (B) 위험한","(A) 긴 / (B) 종교적인"],"opts":["(A) busy / (B) transitional","(A) empty / (B) transitional","(A) empty / (B) permanent","(A) cold / (B) dangerous","(A) long / (B) religious"],"r":{"a":"2) (A) empty / (B) transitional","ev":"13번 문장","s":[[13,"In this way, winter came to be seen not as an empty stretch of time, but as a transitional period, and January ultimately took its place at the start of the calendar as the month that opens the new year.","이런 식으로, 겨울은 비어 있는 시간이 아니라 과도기로 여겨지게 되었고, 1월은 마침내 새해를 여는 달로서 달력의 시작 부분에 자리를 잡았다."]],"w":"13번 문장에서 겨울은 비어 있는(empty) 시간이 아니라 과도기(transitional)로 여겨지게 되었고, 1월은 새해를 여는 달로서 달력의 시작에 자리를 잡았다고 했어요.","c":2},"h":"1daa975963"},{"n":10,"t":"fill","q":"Among the newly added months, January was named after [A], the god of doors and [B].","ko":"새롭게 추가된 달 중에서, 1월은 문과 [B]의 신인 [A]의 이름을 따서 지어졌다.","bank":["Janus","beginnings","Numa","winter","calendar","thawed"],"bko":{"Janus":"야누스","beginnings":"시작","Numa":"누마","winter":"겨울","calendar":"달력","thawed":"녹았다"},"r":{"a":"[A] Janus, [B] beginnings","ev":"11번 문장","s":[[11,"Among the newly added months, January was named after Janus, the god of doors and beginnings.","새롭게 추가된 달 중에서, 1월은 문과 시작의 신인 야누스의 이름을 따서 지어졌다."]],"w":"11번 문장에서 1월은 문과 시작의 신인 야누스(Janus)의 이름을 따서 지어졌다고 했어요. Numa는 8번에서 달력을 개혁한 왕이라 신이 아니에요.","c":null},"h":"c81975f06b"}]},{"u":3,"id":"ms4-03-1","no":1,"ko":"사자 옆집에 삽니다~","items":[{"n":1,"t":"tf","q":"In the early West African kingdoms, hunting was seen as an activity shaped by what the community expected.","ko":"초기 서아프리카 왕국에서 사냥은 공동체가 기대하는 바에 의해 형성된 활동으로 여겨졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Hunting was not viewed as an individual choice but as an activity shaped by communal expectations.","사냥은 개인의 선택이 아니라 공동의 기대에 의해 형성된 활동으로 간주되었다."]],"w":"6번 문장에서 사냥은 개인의 선택이 아니라 공동의 기대(communal expectations)에 의해 형성된 활동으로 간주되었다고 해요. 진술문은 이 내용과 같아요.","c":"T"},"h":"cc52dc7814"},{"n":2,"t":"tf","q":"The hunting practices were kept going mainly by written laws and formal administrative bodies.","ko":"사냥 관행은 주로 성문법과 공식적인 행정 기구에 의해 유지되었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Such practices were sustained not by written laws or formal administrative bodies, but by shared customs, religious beliefs, and collective social pressure.","그러한 관행들은 성문법이나 공식적인 행정 기구가 아니라, 공유된 관습, 종교적 신념, 그리고 집단적인 사회적 압력에 의해 유지되었다."]],"w":"8번 문장에서 관행은 성문법이나 공식 행정 기구가 아니라(not by ~) 공유된 관습, 종교적 신념, 집단의 사회적 압력으로 유지되었다고 해요. 정반대 내용이에요.","c":"F"},"h":"61503485e6"},{"n":3,"t":"tf","q":"Local leaders used their power by deciding who could hunt, when hunting could happen, and which animals could be hunted.","ko":"지역 지도자들은 누가 사냥할 수 있는지, 언제 사냥할 수 있는지, 어떤 동물을 사냥할 수 있는지를 정함으로써 권력을 행사했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~11번 문장","s":[[9,"The authority to oversee these arrangements typically rested with local leaders, chiefs, or kings.","이러한 제도를 감독하는 권한은 일반적으로 지역 지도자, 추장, 또는 왕에게 있었다."],[10,"Their power did not derive from direct ownership of land or animals.","그들의 권력은 땅이나 동물에 대한 직접적인 소유권에서 나오지 않았다."],[11,"Instead, it was exercised through the regulation of access—determining who was permitted to hunt, when hunting could occur, and which animals could be targeted.","대신에, 그것은 접근에 대한 규제, 즉 누가 사냥하도록 허용되는지, 언제 사냥이 일어날 수 있는지, 그리고 어떤 동물이 목표가 될 수 있는지를 결정하는 것을 통해 행사되었다."]],"w":"9번에서 감독 권한은 지역 지도자 등에게 있었고, 11번에서 그 권력은 누가·언제·어떤 동물을 사냥할 수 있는지를 정하는 접근 규제로 행사되었다고 해요.","c":"T"},"h":"f9559f185e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…these kingdoms developed social mechanisms that regulated human interaction with animals.)","ko":"…이 왕국들은 인간과 동물의 상호작용을 규제하는 사회적 메커니즘을 발전시켰다. (regulate는 규제하다)","word":"regulated","opts":["늘려 주었던","규제했던","숨겨 두었던","가르쳐 주었던"],"r":{"a":"2) 규제했던","ev":"5번 문장","s":[[5,"Rather than attempting to eliminate wildlife or impose direct control over it, these kingdoms developed social mechanisms that regulated human interaction with animals.","야생 동물을 제거하거나 그것에 대해 직접적인 통제를 가하려고 시도하기보다는, 이 왕국들은 인간과 동물의 상호작용을 규제하는 사회적 메커니즘을 발전시켰다."]],"w":"5번에서 왕국들은 야생 동물을 없애거나 직접 통제하는 대신, 인간과 동물의 관계를 다스리는 사회적 제도를 만들었어요. 그 제도가 하는 일이 regulate = 규제하다예요.","c":2},"h":"66cc0a2f40"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…while others could be hunted only during designated seasons.)","ko":"…반면에 다른 동물들은 지정된 계절 동안에만 사냥될 수 있었다. (designate는 지정하다)","word":"designated","opts":["지정된","일 년 내내 이어지는","무작위로 바뀌는","사냥꾼이 정하지 못한"],"r":{"a":"1) 지정된","ev":"7번 문장","s":[[7,"Certain animals were protected through long-standing traditions, while others could be hunted only during designated seasons.","특정 동물들은 오래된 전통을 통해 보호받았고, 반면에 다른 동물들은 지정된 계절 동안에만 사냥될 수 있었다."]],"w":"7번에서 어떤 동물은 보호받고, 다른 동물은 only(오직) designated seasons에만 사냥할 수 있었어요. 정해 놓은 때에만 가능하다는 뜻이라 '지정된'이에요.","c":1},"h":"c09f28f8a5"},{"n":6,"t":"ref","q":"What does the underlined \"Their\" refer to?\nTheir power did not derive from direct ownership of land or animals.","ko":"밑줄 친 Their가 가리키는 것은?","sko":"그들의 권력은 땅이나 동물에 대한 직접적인 소유권에서 나오지 않았다.","opts":["야생 동물들","초기 왕국의 사냥꾼들","지역 지도자, 추장, 또는 왕","사헬 지역의 농부들"],"r":{"a":"3) 지역 지도자, 추장, 또는 왕","ev":"9~10번 문장","s":[[9,"The authority to oversee these arrangements typically rested with local leaders, chiefs, or kings.","이러한 제도를 감독하는 권한은 일반적으로 지역 지도자, 추장, 또는 왕에게 있었다."],[10,"Their power did not derive from direct ownership of land or animals.","그들의 권력은 땅이나 동물에 대한 직접적인 소유권에서 나오지 않았다."]],"w":"10번 문장의 Their power(그들의 권력)는 바로 앞 9번의 local leaders, chiefs, or kings를 받아요. 감독 권한이 있던 사람들의 권력이 소유권에서 나오지 않았다는 말이에요.","c":3},"h":"17ec242ba7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Leadership was defined less by coercive force than by maintaining balance between human needs and the environment, shaping both daily life and social structure.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"리더십은 강압적 힘보다는 인간의 필요와 환경 간 균형을 유지하는 데 의해 정의되었으며, 이는 일상생활과 사회 구조를 형성했다.","opts":["리더십은 강압적인 힘으로 환경을 다스리는 것으로 정의되었다.","리더십은 강압적인 힘과 균형 유지를 똑같이 중요하게 여겼다.","리더십은 인간의 필요를 줄이고 환경을 개발하는 것으로 정의되었다.","리더십은 강압적인 힘보다는 인간의 필요와 환경 사이의 균형을 유지하는 것으로 정의되었다."],"r":{"a":"4) 리더십은 강압적인 힘보다는 인간의 필요와 환경 사이의 균형을 유지하는 것으로 정의되었다.","ev":"15번 문장","s":[[15,"Leadership was defined less by coercive force than by maintaining balance between human needs and the environment, shaping both daily life and social structure.","리더십은 강압적 힘보다는 인간의 필요와 환경 간 균형을 유지하는 데 의해 정의되었으며, 이는 일상생활과 사회 구조를 형성했다."]],"w":"less A than B는 'A보다는 B'예요. A는 강압적인 힘, B는 인간의 필요와 환경의 균형을 유지하는 것이에요. 둘을 똑같이 중요하게 본다는 뜻이 아니에요.","c":4},"h":"e157418026"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사냥은 사람들이 스스로 결정하는 개인의 선택이었다.","생존이 협력과 자제에 달려 있었기 때문에 공동의 가치가 개인의 자유보다 더 중시되는 경향이 있었다.","초기 서아프리카 왕국들은 직접 통제로 야생 동물을 없애려 했다.","통치자들의 정치적 권력은 땅과 동물을 직접 소유하는 데서 나왔다."],"opts":["Hunting was an individual choice that people made for themselves.","Communal values tended to outweigh individual freedom because survival depended on cooperation and restraint.","Early West African kingdoms tried to eliminate wildlife by direct control.","The political power of rulers came from owning the land and the animals directly."],"r":{"a":"2) Communal values tended to outweigh individual freedom because survival depended on cooperation and restraint.","ev":"14번 문장","s":[[14,"Because survival depended on cooperation and restraint, communal values tended to outweigh individual freedom.","생존이 협력과 자제에 달려 있었기 때문에, 공동의 가치가 개인의 자유보다 더 중시되는 경향이 있었다."]],"w":"14번에서 생존이 협력과 자제에 달려 있어서 공동의 가치가 개인의 자유보다 더 중시되었다고 해요. 사냥은 개인의 선택이 아니었고(6번), 왕국들은 야생 동물을 없애려 하지 않았으며(5번), 권력은 소유가 아니라 접근 규제에서 나왔어요(10~11번).","c":2},"h":"018765f06a"},{"n":9,"t":"sum","q":"Instead of controlling wildlife directly, early West African kingdoms (A) hunting through communal rules, and rulers strengthened their authority by (B) access to valuable resources.","ko":"야생 동물을 직접 통제하는 대신, 초기 서아프리카 왕국들은 공동의 규칙으로 사냥을 (A)했고, 통치자들은 귀중한 자원에 대한 접근을 (B)함으로써 권위를 강화했다.","oko":["(A) 무시했다 / (B) 통제하는","(A) 장려했다 / (B) 파는","(A) 규제했다 / (B) 나눠 주는","(A) 무시했다 / (B) 나눠 주는","(A) 규제했다 / (B) 통제하는"],"opts":["(A) ignored / (B) controlling","(A) encouraged / (B) selling","(A) regulated / (B) giving away","(A) ignored / (B) giving away","(A) regulated / (B) controlling"],"r":{"a":"5) (A) regulated / (B) controlling","ev":"5번, 11~12번 문장","s":[[5,"Rather than attempting to eliminate wildlife or impose direct control over it, these kingdoms developed social mechanisms that regulated human interaction with animals.","야생 동물을 제거하거나 그것에 대해 직접적인 통제를 가하려고 시도하기보다는, 이 왕국들은 인간과 동물의 상호작용을 규제하는 사회적 메커니즘을 발전시켰다."],[11,"Instead, it was exercised through the regulation of access—determining who was permitted to hunt, when hunting could occur, and which animals could be targeted.","대신에, 그것은 접근에 대한 규제, 즉 누가 사냥하도록 허용되는지, 언제 사냥이 일어날 수 있는지, 그리고 어떤 동물이 목표가 될 수 있는지를 결정하는 것을 통해 행사되었다."],[12,"Furthermore, by controlling access to valuable resources such as ivory or meat from large game, rulers reinforced their political legitimacy and preserved social order.","게다가, 상아나 큰 사냥감의 고기와 같은 귀중한 자원에 대한 접근을 통제함으로써, 통치자들은 그들의 정치적 정당성을 강화하고 사회 질서를 보존했다."]],"w":"5번에서 왕국들은 사냥을 포함한 인간과 동물의 관계를 규제했어요(regulate). 12번에서 통치자들은 상아·고기 같은 자원에 대한 접근을 통제해서(control) 정당성을 강화했어요. 무시하거나 장려했다는 말, 접근을 팔거나 나눠 줬다는 말은 본문에 없어요.","c":5},"h":"a5acb1d275"},{"n":10,"t":"fill","q":"Because survival depended on [A] and restraint, [B] values tended to outweigh individual freedom.","ko":"생존이 [A]와 자제에 달려 있었기 때문에, [B] 가치가 개인의 자유보다 더 중시되는 경향이 있었다.","bank":["cooperation","communal","competition","written","wildlife","ownership"],"bko":{"cooperation":"협력","communal":"공동의","competition":"경쟁","written":"문서로 된","wildlife":"야생 동물","ownership":"소유권"},"r":{"a":"[A] cooperation, [B] communal","ev":"14번 문장","s":[[14,"Because survival depended on cooperation and restraint, communal values tended to outweigh individual freedom.","생존이 협력과 자제에 달려 있었기 때문에, 공동의 가치가 개인의 자유보다 더 중시되는 경향이 있었다."]],"w":"14번 문장에서 가져왔어요. restraint 앞에는 명사 cooperation(협력)이 오고, values 앞에는 '공동의'라는 형용사 communal이 와야 해요. competition(경쟁)은 협력과 반대 뜻이고, written·wildlife·ownership은 이 문장의 뜻과 맞지 않아요.","c":null},"h":"097d4726bb"}]},{"u":3,"id":"ms4-03-2","no":2,"ko":"100세 시대의 비밀을 쥔 유전자","items":[{"n":1,"t":"tf","q":"Experts say genes may decide about half of how long we live.","ko":"전문가들은 유전자가 우리가 얼마나 오래 사는지의 약 절반을 결정할 수 있다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"While this is attributed in part to medical advance
