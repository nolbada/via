W("SW","C",1,"다음 그림을 보고 관계대명사와 보기의 말을 이용하여 문장을 완성하시오. (단, that은 쓰지 말 것)<br>(그림: 동물원. 호랑이, 입을 크게 벌리고 포효하는 사자, 기린 세 마리가 보이고, Mina와 사육사 Kim, 아이스크림을 먹는 남자아이가 있다.)<br>보기: job is a zookeeper / is roaring loudly / is eating ice cream / has three giraffes<br>Mina is at a zoo ___.","which has three giraffes","Mina is at a zoo which has three giraffes.","Mina는 기린이 세 마리 있는 동물원에 있다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스를 펴세요.",
 "1) a zoo(동물원)는 사물/장소 명사이고, 뒤에 동사로 시작하는 말이 와요.  2) 보기에서 동물원을 설명하는 말을 고르고, 그림에서 기린이 몇 마리인지 세어 봐요.",
 "관계대명사는 w로 시작하는 다섯 글자예요. 보기 중 동물원이 ‘가지고 있는’ 것을 말하는 쪽을 고르세요.","사물 + which + 동사 (주격)",["job is a zookeeper","is roaring loudly","is eating ice cream","has three giraffes"]);
W("SW","C",2,"다음 그림을 보고 관계대명사와 보기의 말을 이용하여 문장을 완성하시오. (단, that은 쓰지 말 것)<br>(그림: 동물원. 호랑이, 입을 크게 벌리고 포효하는 사자, 기린 세 마리가 보이고, Mina와 사육사 Kim, 아이스크림을 먹는 남자아이가 있다.)<br>보기: job is a zookeeper / is roaring loudly / is eating ice cream / has three giraffes<br>The boy ___ is Mina’s younger brother.","who is eating ice cream","The boy who is eating ice cream is Mina’s younger brother.","아이스크림을 먹고 있는 그 남자아이는 Mina의 남동생이다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스에서 사람 선행사를 보세요.",
 "1) The boy(남자아이)는 사람이에요.  2) 그림에서 그 남자아이가 무엇을 하고 있는지 보고, 보기 중 알맞은 동작을 골라요.",
 "관계대명사는 w로 시작하는 세 글자예요. is로 시작하는 두 보기 가운데 그 남자아이의 동작을 고르세요.","The boy + who + is -ing (주격)",["job is a zookeeper","is roaring loudly","is eating ice cream","has three giraffes"]);
W("SW","C",3,"다음 그림을 보고 관계대명사와 보기의 말을 이용하여 문장을 완성하시오. (단, that은 쓰지 말 것)<br>(그림: 동물원. 호랑이, 입을 크게 벌리고 포효하는 사자, 기린 세 마리가 보이고, Mina와 사육사 Kim, 아이스크림을 먹는 남자아이가 있다.)<br>보기: job is a zookeeper / is roaring loudly / is eating ice cream / has three giraffes<br>Mina has an aunt ___. Her name is Kim.","whose job is a zookeeper","Mina has an aunt whose job is a zookeeper. Her name is Kim.","Mina에게는 직업이 사육사인 이모[고모]가 있다. 그녀의 이름은 Kim이다.",
 "본책 p.158 3번 ‘소유격 관계대명사’ 박스를 펴세요.",
 "1) 이모의 ‘직업’을 말하는 거라서 ‘~의’ 뜻이 필요해요.  2) 보기에서 명사로 시작하는 말을 찾아요.",
 "보기 중 명사 job으로 시작하는 말이에요. 앞에 w로 시작하는 다섯 글자 관계대명사를 붙여요.","소유격 → whose + 명사 + 동사",["job is a zookeeper","is roaring loudly","is eating ice cream","has three giraffes"]);
W("SW","C",4,"다음 그림을 보고 관계대명사와 보기의 말을 이용하여 문장을 완성하시오. (단, that은 쓰지 말 것)<br>(그림: 동물원. 호랑이, 입을 크게 벌리고 포효하는 사자, 기린 세 마리가 보이고, Mina와 사육사 Kim, 아이스크림을 먹는 남자아이가 있다.)<br>보기: job is a zookeeper / is roaring loudly / is eating ice cream / has three giraffes<br>The lion ___ scared the children.","which is roaring loudly","The lion which is roaring loudly scared the children.","크게 포효하고 있는 그 사자가 아이들을 겁먹게 했다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스에서 사물/동물 선행사를 보세요.",
 "1) The lion(사자)은 동물이라서 who가 아니에요.  2) 사자가 하는 행동을 보기에서 찾아요. scared(원형 scare: 겁주다)의 주어가 사자예요.",
 "관계대명사는 w로 시작하는 다섯 글자예요. is로 시작하는 보기 가운데 사자가 하는 동작을 고르세요.","동물 + which + 동사 (주격)",["job is a zookeeper","is roaring loudly","is eating ice cream","has three giraffes"]);

W("SW","D",1,"다음 대화를 읽고 밑줄 친 부분이 어법상 옳은지 판단한 후, 틀리면 바르게 고치시오.<br>A: Hey! Are you ready for the talent show?<br>B: Almost. My team and I are still practicing the dance.<br>A: Cool. So what is ① <u>the song that you will be dancing to</u>?<br>B: It’s a surprise, but it’s a song from Eighteen.<br>A: Oh really? I have ② <u>a friend whom is a huge fan</u> of that group. I think she’ll really like your performance.<br>B: I hope so too. I also know ③ <u>a lot of people that really like this group</u>. That’s ④ <u>the reason what we chose</u> one of their songs.<br>A: Nice. I can’t wait to see you guys on stage.<br>① ( O / X )","O","So what is the song that you will be dancing to?","그럼 네가 같이 춤출 노래는 뭐니?",
 "본책 p.160 ‘관계대명사 that’ 박스의 목적격 that 예문을 펴세요.",
 "1) the song(노래)은 선행사이고, that 뒤에 you will be dancing to(네가 ~에 맞춰 춤출)가 와요.  2) to 뒤에 목적어가 빠져 있나요? 그러면 that은 어떤 격일까요?",
 "목적어가 빠진 목적격 that이고 사물에도 쓸 수 있어요. 고칠 곳이 없어요.","목적격 that은 사물에도 OK");
W("SW","D",2,"다음 대화를 읽고 밑줄 친 부분이 어법상 옳은지 판단한 후, 틀리면 바르게 고치시오.<br>A: Hey! Are you ready for the talent show?<br>B: Almost. My team and I are still practicing the dance.<br>A: Cool. So what is ① <u>the song that you will be dancing to</u>?<br>B: It’s a surprise, but it’s a song from Eighteen.<br>A: Oh really? I have ② <u>a friend whom is a huge fan</u> of that group. I think she’ll really like your performance.<br>B: I hope so too. I also know ③ <u>a lot of people that really like this group</u>. That’s ④ <u>the reason what we chose</u> one of their songs.<br>A: Nice. I can’t wait to see you guys on stage.<br>② ( O / X )","X, a friend who[that] is a huge fan","I have a friend who is a huge fan of that group. / I have a friend that is a huge fan of that group.","정말? 나는 그 그룹의 열렬한 팬인 친구가 있어.",
 "본책 p.158 ‘주격/목적격 관계대명사’ 박스에서 who와 whom의 차이를 보세요.",
 "1) whom 바로 뒤에 동사 is(원형 be: 이다)가 와요.  2) 동사 앞은 주어 자리니까 어떤 격이 필요할까요?",
 "X예요. whom을 사람 주격 관계대명사(w로 시작하는 세 글자, 또는 t로 시작하는 네 글자)로 고쳐요.","주격(+동사)엔 who, whom 아님");
W("SW","D",3,"다음 대화를 읽고 밑줄 친 부분이 어법상 옳은지 판단한 후, 틀리면 바르게 고치시오.<br>A: Hey! Are you ready for the talent show?<br>B: Almost. My team and I are still practicing the dance.<br>A: Cool. So what is ① <u>the song that you will be dancing to</u>?<br>B: It’s a surprise, but it’s a song from Eighteen.<br>A: Oh really? I have ② <u>a friend whom is a huge fan</u> of that group. I think she’ll really like your performance.<br>B: I hope so too. I also know ③ <u>a lot of people that really like this group</u>. That’s ④ <u>the reason what we chose</u> one of their songs.<br>A: Nice. I can’t wait to see you guys on stage.<br>③ ( O / X )","O","I also know a lot of people that really like this group.","나는 이 그룹을 정말 좋아하는 사람들도 많이 알아.",
 "본책 p.160 POINT 1의 첫 설명 문장과 표 첫 줄을 보세요.",
 "1) a lot of people(많은 사람들)은 사람 선행사예요.  2) that 뒤에 really like(정말 좋아한다)가 바로 이어져요. 주격이에요.",
 "관계대명사 that은 사람에게도 쓸 수 있어요. 고칠 곳이 없어요.","that은 사람·사물 모두 가능");
W("SW","D",4,"다음 대화를 읽고 밑줄 친 부분이 어법상 옳은지 판단한 후, 틀리면 바르게 고치시오.<br>A: Hey! Are you ready for the talent show?<br>B: Almost. My team and I are still practicing the dance.<br>A: Cool. So what is ① <u>the song that you will be dancing to</u>?<br>B: It’s a surprise, but it’s a song from Eighteen.<br>A: Oh really? I have ② <u>a friend whom is a huge fan</u> of that group. I think she’ll really like your performance.<br>B: I hope so too. I also know ③ <u>a lot of people that really like this group</u>. That’s ④ <u>the reason what we chose</u> one of their songs.<br>A: Nice. I can’t wait to see you guys on stage.<br>④ ( O / X )","X, the reason why we chose","That’s the reason why we chose one of their songs.","그것이 우리가 그들의 노래 중 하나를 고른 이유야.",
 "본책 p.162 ‘관계부사의 종류’ 표에서 the reason 줄을 보세요.",
 "1) the reason(이유)이라는 선행사가 있어요.  2) what은 선행사를 포함하는 말이라서 앞에 선행사를 쓰지 않아요. 이유 뒤에 맞는 관계부사로 바꿔야 해요.",
 "what을 w로 시작하는 세 글자 관계부사로 고쳐요.","the reason + why (what 아님)");

C("NS","N",1,"[1-5] 빈칸에 들어갈 알맞은 말을 고르시오.<br>Ben is talking to the man ___ is sitting on the chair.",["① who","② whom","③ which","④ what","⑤ whose"],"① who","Ben is talking to the man who is sitting on the chair.","Ben은 의자에 앉아 있는 남자에게 말하고 있다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스를 펴세요.",
 "1) the man(남자)은 사람이에요.  2) 빈칸 바로 뒤에 동사 is가 와서 주어가 없어요. 주격 자리예요.",

C("NS","N",2,"[1-5] 빈칸에 들어갈 알맞은 말을 고르시오.<br>Look at the dogs ___ are playing with the ball.",["① who","② whom","③ that","④ what","⑤ whose"],"③ that","Look at the dogs that are playing with the ball.","공을 가지고 놀고 있는 개들을 봐.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스에서 사물/동물 칸을 보세요.",

C("NS","N",3,"[1-5] 빈칸에 들어갈 알맞은 말을 고르시오.<br>I visited a village ___ people were really friendly.",["① who","② whom","③ which","④ what","⑤ whose"],"⑤ whose","I visited a village whose people were really friendly.","나는 사람들이 정말 친절한 마을을 방문했다.",
 "본책 p.158 3번 ‘소유격 관계대명사’ 박스를 펴세요.",
 "1) 빈칸 바로 뒤에 people(사람들)이라는 명사가 와요.  2) ‘그 마을의 사람들’처럼 ‘~의’ 뜻이 필요해요.",
 "마지막 보기예요. 뒤에 명사가 바로 오는 말이에요.","빈칸 뒤 명사 people → 소유격 whose");
C("NS","N",4,"[1-5] 빈칸에 들어갈 알맞은 말을 고르시오.<br>I can’t believe ___ you told me.",["① who","② whom","③ which","④ what","⑤ whose"],"④ what","I can’t believe what you told me.","나는 네가 나에게 말한 것을 믿을 수 없다.",
 "본책 p.160 ‘관계대명사 what’ 박스를 펴세요.",
 "1) believe(믿다) 뒤에 꾸며 줄 선행사가 없어요.  2) ‘네가 나에게 말한 것’이라는 뜻의 명사절이 목적어예요.",
 "선행사를 포함한 w로 시작하는 네 글자예요. 네 번째 보기예요.","선행사 없음 + ~한 것 → what");
C("NS","N",5,"[1-5] 빈칸에 들어갈 알맞은 말을 고르시오.<br>Youth is a time ___ everything seems exciting.",["① how","② when","③ why","④ where","⑤ what"],"② when","Youth is a time when everything seems exciting.","젊음은 모든 것이 신나 보이는 시기이다.",
 "본책 p.162 ‘관계부사의 종류’ 표를 펴세요.",
 "1) a time(시기)은 시간을 나타내요.  2) 빈칸 뒤 everything seems exciting(모든 것이 신나 보인다)은 완전한 문장이에요.",
 "시간에 쓰는 관계부사예요. 두 번째 보기예요.","time(시간) + when + 완전한 문장");
C("NS","N",6,"생략된 관계대명사의 위치로 알맞은 곳은?<br>The television ① I ② bought ③ last month ④ isn’t ⑤ working.",["①","②","③","④","⑤"],"①","The television (which[that]) I bought last month isn’t working.","내가 지난달에 산 텔레비전은 작동하지 않는다.",
 "본책 p.160 ‘관계대명사의 생략’ 박스의 목적격 생략 예문을 보세요.",
 "1) The television이 주어이고 isn’t working(작동하지 않는다)이 큰 동사예요.  2) I bought last month(내가 지난달에 샀다)가 television을 꾸며 줘요. 꾸미는 절 앞에 관계대명사가 있어야 해요.",
 "꾸밈절이 시작하는 곳, 즉 television 바로 뒤이면서 I 앞이에요. 첫 번째예요.","목적격 생략 자리: 선행사 뒤, 주어 앞");
C("NS","N",7,"빈칸에 관계대명사 that이 쓰일 수 없는 것은?<br>① ___ surprised me was his behavior.<br>② This is the thing ___ I made yesterday.<br>③ There is a cat ___ has black and white spots.<br>④ There are many people ___ are swimming in the pool.<br>⑤ Brushing my teeth is the first thing ___ I do every morning.",["① ___ surprised me was his behavior.","② This is the thing ___ I made yesterday.","③ There is a cat ___ has black and white spots.","④ There are many people ___ are swimming in the pool.","⑤ Brushing my teeth is the first thing ___ I do every morning."],"① ___ surprised me was his behavior.","What surprised me was his behavior.","나를 놀라게 한 것은 그의 행동이었다.",
 "본책 p.160 ‘관계대명사 that’과 ‘관계대명사 what’ 박스를 비교해 보세요.",
 "1) 각 문장의 빈칸 앞에 선행사가 있는지 확인해요.  2) 선행사가 없는 문장은 that이 아니라 선행사를 포함한 말을 써야 해요.",
 "빈칸이 문장 맨 앞에 있어 꾸밀 명사가 없는 문장을 찾아요. 첫 번째 보기예요.","선행사 없는 주어절 → what (that 안 됨)");
C("NS","N",8,"밑줄 친 부분을 생략할 수 있는 것은?<br>① I have a friend <u>who is</u> a teacher.<br>② I know <u>what</u> you ate for lunch.<br>③ Try to understand <u>how</u> I feel.<br>④ She found a dog <u>which was</u> lost in the park.<br>⑤ This is my favorite store <u>which</u> sells great burgers.",["① I have a friend who is a teacher.","② I know what you ate for lunch.","③ Try to understand how I feel.","④ She found a dog which was lost in the park.","⑤ This is my favorite store which sells great burgers."],"④ She found a dog which was lost in the park.","She found a dog (which was) lost in the park.","그녀는 공원에서 길을 잃은 개를 발견했다.",
 "본책 p.160 ‘관계대명사의 생략’ 박스의 두 번째 경우(「주격 관계대명사 + be동사」)를 보세요.",
 "1) 「주격 관계대명사 + be동사」 뒤에 분사나 형용사(구)가 올 때만 생략돼요.  2) 각 보기에서 밑줄 뒤에 오는 말의 품사를 확인해요.",
 "① 뒤는 명사 a teacher라 안 돼요. ② what과 ③ how는 생략할 수 없고, ⑤는 바로 뒤가 일반동사 sells예요.","who/which + be + 분사·형용사 → 생략");
M("NS","N",9,"[9-10] 밑줄 친 부분과 쓰임이 같은 것을 모두 고르시오.<br>Tim is a student <u>who</u> studies chemistry in Germany.<br>① <u>Who</u> is your sister?<br>② I’m not sure <u>who</u> I should trust.<br>③ My mom is a doctor <u>who</u> helps the sick.<br>④ She told me <u>who</u> to invite to the party.<br>⑤ I have a brother <u>who</u> is an actor.",["① Who is your sister?","② I’m not sure who I should trust.","③ My mom is a doctor who helps the sick.","④ She told me who to invite to the party.","⑤ I have a brother who is an actor."],["③ My mom is a doctor who helps the sick.","⑤ I have a brother who is an actor."],"My mom is a doctor who helps the sick. / I have a brother who is an actor.","우리 엄마는 아픈 사람들을 돕는 의사이다. / 나는 배우인 남자 형제가 있다.",
 "본책 p.156 ‘관계대명사 vs. 의문사’ 박스를 펴세요.",
 "1) 문제의 who는 앞의 a student(학생)를 꾸미는 주격 관계대명사예요.  2) 각 보기에서 who 앞에 꾸밀 선행사가 있는지, who 뒤에 동사가 바로 오는지 확인해요.",
 "선행사가 있고 who 바로 뒤에 동사가 오는 것을 찾아요. ‘누구’ 뜻의 who는 선행사가 없어요.","선행사 + who + 동사 = 주격 관계대명사");
M("NS","N",10,"[9-10] 밑줄 친 부분과 쓰임이 같은 것을 모두 고르시오.<br>The sandwich <u>that</u> you made was delicious.<br>① Everyone knows <u>that</u> the earth is round.<br>② The car <u>that</u> he bought needs repairs.<br>③ His watch is more expensive than <u>that</u> one.<br>④ I think <u>that</u> exercising regularly is important.<br>⑤ The man <u>that</u> they are looking at is my dad.",["① Everyone knows that the earth is round.","② The car that he bought needs repairs.","③ His watch is more expensive than that one.","④ I think that exercising regularly is important.","⑤ The man that they are looking at is my dad."],["② The car that he bought needs repairs.","⑤ The man that they are looking at is my dad."],"The car that he bought needs repairs. / The man that they are looking at is my dad.","그가 산 차는 수리가 필요하다. / 그들이 보고 있는 남자는 내 아빠이다.",
 "본책 p.160 ‘다양한 that의 쓰임을 구분할 수 있어야 한다’ 표를 펴세요.",
 "1) 문제의 that은 the sandwich를 꾸미는데, 뒤 you made(네가 만들었다)에 목적어가 없는 목적격이에요.  2) 보기마다 that 앞에 선행사가 있는지, that 뒤에 목적어가 빠졌는지 확인해요.",
 "접속사 that(뒤가 완전한 문장)과 ‘저것’ 뜻의 that은 소거해요. 남는 두 개를 고르세요.","선행사 + that + 주어 + 동사(목적어 없음) → 목적격");
C("NS","N",11,"우리말을 영어로 바르게 옮긴 것은?<br>나는 우리 할머니가 나를 위해 구워 주신 쿠키를 먹었다.",["① I ate the cookies who my grandmother baked for me.","② I ate the cookies whom my grandmother baked for me.","③ I ate the cookies which my grandmother baked for me.","④ I ate the cookies which is my grandmother baked for me.","⑤ I ate the cookies which my grandmother baked them for me."],"③ I ate the cookies which my grandmother baked for me.","I ate the cookies which my grandmother baked for me.","나는 우리 할머니가 나를 위해 구워 주신 쿠키를 먹었다.",
 "본책 p.158 2번 ‘목적격 관계대명사’ 박스와 아래 ‘목적어를 중복해서 쓰지 않도록 주의’ 부분을 보세요.",
 "1) the cookies(쿠키)는 사물이라 who, whom은 안 돼요.  2) baked(원형 bake: 굽다)의 목적어는 관계대명사가 대신하니 them이 또 오면 안 돼요.  3) 관계대명사절 안에 is가 따로 들어가도 안 돼요.",
 "사물 목적격 which를 쓰고, 군더더기 is나 them이 없는 보기는 세 번째예요.","사물 목적격 which, 목적어 중복 금지");
C("NS","N",12,"밑줄 친 부분이 어법상 옳지 않은 것은?<br>① The city <u>that</u> I visited last year was wonderful.<br>② I saw a turtle <u>whose</u> age was over two hundred.<br>③ Ben is reading a book <u>which are</u> very thick.<br>④ The man <u>whom</u> I wanted to see was not at the party.<br>⑤ I don’t know the girl <u>who is</u> standing by the window.",["① The city that I visited last year was wonderful.","② I saw a turtle whose age was over two hundred.","③ Ben is reading a book which are very thick.","④ The man whom I wanted to see was not at the party.","⑤ I don’t know the girl who is standing by the window."],"③ Ben is reading a book which are very thick.","Ben is reading a book which is very thick.","Ben은 아주 두꺼운 책을 읽고 있다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스 아래 ‘동사는 선행사의 인칭과 수에 맞춰 쓴다’ 부분을 보세요.",
 "1) 주격 관계대명사 뒤의 동사는 선행사에 수를 맞춰요.  2) 각 보기의 선행사가 하나인지 여럿인지, 그 뒤 동사와 맞는지 하나씩 확인해요.",
 "선행사가 a book(하나)인데 동사가 복수형인 문장이에요. 세 번째 보기예요.","주격 관계대명사 뒤 동사 = 선행사에 수 일치");
W("NS","N",13,"[13-14] 두 문장의 의미가 같도록 빈칸에 알맞은 관계부사를 쓰시오.<br>She visited the nursing home at which she volunteered once a month.<br>= She visited the nursing home ___ she volunteered once a month.","where","She visited the nursing home where she volunteered once a month.","그녀는 한 달에 한 번 자원봉사를 했던 요양원을 방문했다.",
 "본책 p.162 ‘관계부사는 「전치사 + 관계대명사 which」로 바꿔 쓸 수 있다’ 부분을 보세요.",
 "1) at which는 ‘장소 앞 전치사 + which’ 꼴이에요.  2) the nursing home(요양원)은 장소 선행사예요. 표에서 장소 관계부사를 찾아요.",
 "w로 시작하는 다섯 글자예요.","at which = where");
W("NS","N",14,"[13-14] 두 문장의 의미가 같도록 빈칸에 알맞은 관계부사를 쓰시오.<br>He told me the reason for which he made that decision.<br>= He told me the reason ___ he made that decision.","why","He told me the reason why he made that decision.","그는 나에게 그가 그 결정을 내린 이유를 말해 주었다.",
 "본책 p.162 POINT 2 ‘관계부사의 종류’ 표의 이유 줄과, 그 아래 Suzy 예문 끝의 괄호를 보세요.",
 "1) for which 앞의 선행사 the reason(이유)을 보세요.  2) 이유를 나타내는 관계부사를 표에서 찾아요.",
 "w로 시작하는 세 글자이고 y로 끝나요.","for which = why");
C("NS","N",15,"그림의 상황을 바르게 영작한 것은?<br>(그림: 무대 앞쪽에서 노란 우비를 입고 우산을 든 소녀들이 노래를 부르고 있고, 뒤쪽에서는 지팡이를 든 남자들이 춤을 추고 있다.)",["① The girls who is holding canes are dancing.","② The girls who are holding canes are singing.","③ The girls who is holding umbrellas are singing.","④ The girls who are holding umbrellas are dancing.","⑤ The girls who are holding umbrellas are singing."],"⑤ The girls who are holding umbrellas are singing.","The girls who are holding umbrellas are singing.","우산을 들고 있는 소녀들이 노래를 부르고 있다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스 아래 ‘동사는 선행사의 인칭과 수에 맞춰 쓴다’ 부분을 보세요.",
 "1) 선행사 The girls는 여러 명이라서 who 뒤 동사가 is가 아니라 are여야 해요.  2) 그림에서 소녀들이 들고 있는 물건과 하고 있는 동작(노래/춤)을 확인해요.",
 "is가 나오는 ①, ③은 소거해요. 남은 보기에서 소녀들이 든 물건과 동작을 그림과 맞춰 보세요.","복수 선행사 + who + are");
W("NS","N",16,"빈칸에 공통으로 들어갈 말을 쓰시오.<br>• Look at ___ fancy car!<br>• Everything ___ people say about the old man is true.<br>• It’s true ___ dogs can be good friends to humans.","that","Look at that fancy car! / Everything that people say about the old man is true. / It’s true that dogs can be good friends to humans.","저 멋진 차를 봐! / 사람들이 그 노인에 대해 하는 모든 말은 사실이다. / 개가 인간의 좋은 친구가 될 수 있다는 것은 사실이다.",
 "본책 p.160 POINT 1 아래 내신 적중 박스(한 단어의 여러 쓰임을 비교한 표)를 펴세요.",
 "1) 첫 번째는 fancy car(멋진 차) 앞에서 ‘저’라는 뜻이에요.  2) 두 번째는 Everything(모든 것)을 꾸미는 목적격 관계대명사예요.  3) 세 번째는 뒤에 완전한 문장이 오는 접속사예요.",
 "t로 시작하는 네 글자예요. 세 문장에 모두 같은 단어가 들어가요.","지시형용사·목적격 관계대명사·접속사 → that");
C("NS","N",17,"빈칸에 관계부사가 쓰일 수 없는 것은?<br>① She told me the reason ___ she quit her job.<br>② Sam is someone ___ I trust and respect.<br>③ The guide explained ___ Monet made his famous paintings.<br>④ Tomorrow is the day ___ I start my new job.<br>⑤ New York is a city ___ many tourists travel to every year.",["① She told me the reason ___ she quit her job.","② Sam is someone ___ I trust and respect.","③ The guide explained ___ Monet made his famous paintings.","④ Tomorrow is the day ___ I start my new job.","⑤ New York is a city ___ many tourists travel to every year."],"② Sam is someone ___ I trust and respect.","Sam is someone who(m)[that] I trust and respect.","Sam은 내가 믿고 존경하는 사람이다.",
 "본책 p.162 ‘관계부사의 종류’ 표(시간·장소·이유·방법)를 펴세요.",
 "1) 관계부사 뒤에는 완전한 문장이 와요.  2) 빈칸 뒤 I trust and respect(내가 믿고 존경한다)에 목적어가 빠져 있는 문장이 있는지 찾아요.",
 "선행사가 someone(사람)이고 뒤 문장에 목적어가 없는 보기예요. 두 번째 보기예요.","관계부사 뒤 = 완전한 문장");
W("NS","N",18,"[18-19] 관계사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>• Spider-Man is the movie.<br>• I like that movie the most.","Spider-Man is the movie which[that] I like the most.","Spider-Man is the movie which I like the most. / Spider-Man is the movie that I like the most.","Spider-Man은 내가 가장 좋아하는 영화이다.",
 "본책 p.158 2번 ‘목적격 관계대명사’ 박스와 ‘목적어를 중복해서 쓰지 않도록 주의’ 부분을 보세요.",
 "1) 두 번째 문장의 that movie는 like(좋아하다)의 목적어예요.  2) 이 목적어를 관계대명사로 바꿔 the movie 바로 뒤로 보내고 원래 자리는 지워요.",
 "the movie 뒤에 사물 목적격 관계대명사(w로 시작하는 다섯 글자, 또는 t로 시작하는 네 글자)를 붙이고, like 뒤의 that movie는 지워요.","사물 목적어 → which[that]");
W("NS","N",19,"[18-19] 관계사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>• Lisa told us the way.<br>• She cooked the lasagna in that way.","Lisa told us how she cooked the lasagna.","Lisa told us how she cooked the lasagna.","Lisa는 우리에게 그녀가 라자냐를 요리한 방법을 말해 주었다.",
 "본책 p.162 ‘관계부사의 종류’ 표 아래 the way와 how를 함께 쓰지 않는다는 박스를 보세요.",
 "1) in that way(그런 방법으로)를 방법의 관계부사로 바꿔요.  2) the way와 how는 함께 쓰지 않으니 하나만 남겨요.",
 "the way는 빼고, 방법의 관계부사(h로 시작하는 세 글자)로 시작하는 절을 told us 뒤에 붙여요. 끝의 in that way도 사라져요.","the way 또는 how 하나만");
C("NS","N",20,"빈칸에 들어갈 말이 순서대로 짝지어진 것은?<br>• I have a special camera ___ works well underwater.<br>• Sam helped the woman ___ legs were hurt.",["① that — who","② that — whom","③ who — whose","④ which — which","⑤ which — whose"],"⑤ which — whose","I have a special camera which works well underwater. / Sam helped the woman whose legs were hurt.","나는 물속에서 잘 작동하는 특별한 카메라를 가지고 있다. / Sam은 다리를 다친 여자를 도왔다.",
 "본책 p.156 ‘관계대명사의 종류’ 표와 p.158 1·3번 박스를 펴세요.",
 "1) 첫 문장은 a special camera(사물)이고 빈칸 뒤에 동사 works가 와요(주격).  2) 둘째 문장은 빈칸 뒤에 명사 legs가 와요(소유격).  3) 사물에 who를 쓸 수 없고 whom 뒤에는 명사가 바로 오지 않아요.",
 "첫째 칸은 사물 주격, 둘째 칸은 소유격이에요. 정답은 마지막 보기예요.","사물 주격 which / 소유격 whose");
C("NS","N",21,"대화의 빈칸에 들어갈 말로 알맞은 것은?<br>A: I heard that your boyfriend proposed to you. How romantic!<br>B: Yes! I’ll never forget the day ___ he proposed to me.",["① how","② when","③ whose","④ where","⑤ the reason"],"② when","I’ll never forget the day when he proposed to me.","응! 그가 나에게 청혼한 날을 절대 잊지 못할 거야.",
 "본책 p.162 ‘관계부사의 종류’ 표를 펴세요.",
 "1) 빈칸 앞 the day(날)는 시간을 나타내는 선행사예요.  2) 빈칸 뒤 he proposed to me는 완전한 문장이에요.",
 "시간의 관계부사예요. 두 번째 보기예요.","the day + when + 완전한 문장");
C("NS","N",22,"[22-23] 다음 대화를 읽고 질문에 답하시오. 위 대화의 밑줄 친 ⓐ~ⓔ 중 쓰임이 보기와 같은 것의 개수는?<br>A: Look over there! ⓐ <u>That</u> is my favorite painting.<br>B: Oh, Café Terrace at Night. I also like this painting.<br>A: I think it is one of the best paintings ⓑ <u>that</u> was made by Vincent van Gogh.<br>B: I think so too. I know ⓒ <u>that</u> The Starry Night is more famous, but I think this painting is more interesting.<br>A: I agree. You know, his art really changed the world. <u>그는 그의 작품이 20세기 예술에 엄청난 영향을 미쳤던 화가였어.</u><br>B: Yes, he was an amazing artist ⓓ <u>that</u> was able to really capture his emotions in his paintings.<br>A: Right. ⓔ <u>That</u> is the reason why people love his artwork.<br>보기: She bought a hairband <u>that</u> is popular these days.",["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],"② 2개","ⓑ와 ⓓ가 보기와 같은 주격 관계대명사 that이다.","ⓑ와 ⓓ가 보기와 같은 주격 관계대명사 that이다. (ⓐ, ⓔ는 ‘저것/그것’, ⓒ는 접속사)",
 "본책 p.160 ‘다양한 that의 쓰임을 구분할 수 있어야 한다’ 표를 펴세요.",
 "1) 보기의 that은 a hairband(머리띠)를 꾸미고 바로 뒤에 동사 is가 오는 주격 관계대명사예요.  2) ⓐ~ⓔ에서 앞에 선행사가 있고 뒤에 동사가 바로 오는 that을 찾아요.",
 "문장 맨 앞의 That(ⓐ, ⓔ)과 뒤에 완전한 문장이 오는 that(ⓒ)은 빼요. 남은 개수를 세어 보세요.","선행사 + that + 동사 → 주격 관계대명사");
W("NS","N",23,"[22-23] 위 대화의 밑줄 친 우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>(그는 그의 작품이 20세기 예술에 엄청난 영향을 미쳤던 화가였어.)<br>(artwork / had / influence / whose / huge / a / on)<br>He was a painter ___ twentieth-century art.","whose artwork had a huge influence on","He was a painter whose artwork had a huge influence on twentieth-century art.","그는 그의 작품이 20세기 예술에 엄청난 영향을 미쳤던 화가였다.",
 "본책 p.158 3번 ‘소유격 관계대명사’ 박스를 펴세요.",
 "1) 선행사 a painter(화가) 뒤에 ‘그의 작품’이 이어지니 소유격 관계대명사 + 명사로 시작해요.  2) ‘영향을 미쳤다’는 have(가지다)의 과거형 + a + 형용사 + 명사로 나타내요.  3) ‘~에’에 해당하는 전치사는 맨 끝, twentieth-century art 바로 앞에 와요.",
 "whose로 시작해서 on으로 끝나요. 모두 7단어이고, had(원형 have: 가지다)는 세 번째 자리예요.","화가 + whose + 명사 + 동사",["artwork","had","influence","whose","huge","a","on"]);
C("NS","N",24,"관계대명사 what을 이용하여 우리말을 영어로 옮길 때, what은 몇 번째 오는가?<br>이 사진은 나의 아빠가 나에게 주신 것이다.",["① 첫 번째","② 두 번째","③ 세 번째","④ 네 번째","⑤ 다섯 번째"],"④ 네 번째","This picture is what my father gave me.","이 사진은 나의 아빠가 나에게 주신 것이다.",
 "본책 p.160 ‘관계대명사 what’ 박스의 That is what I want to say. 예문을 보세요.",
 "1) ‘이 사진은 ~이다’를 먼저 영어로 써요.  2) ‘나의 아빠가 나에게 주신 것’이 보어가 되는 what절이에요.  3) 단어를 하나씩 세어 보세요.",
 "This(1) picture(2) is(3) 다음에 what이 나와요.","be동사 + what + 주어 + 동사 → ~한 것(보어)");
C("NS","N",25,"밑줄 친 부분을 생략할 수 있는 것의 개수는?<br>• The man <u>that</u> Katie loves is handsome.<br>• He was a lawyer <u>that</u> helped the poor.<br>• She sold the vase <u>that</u> she made a week ago.<br>• My dad is a person <u>that</u> I really respect.",["① 0개","② 1개","③ 2개","④ 3개","⑤ 4개"],"④ 3개","The man (that) Katie loves is handsome. / She sold the vase (that) she made a week ago. / My dad is a person (that) I really respect.","Katie가 사랑하는 남자는 잘생겼다. / 그녀는 일주일 전에 만든 꽃병을 팔았다. / 우리 아빠는 내가 정말 존경하는 사람이다.",
 "본책 p.160 ‘관계대명사의 생략’ 박스를 펴세요.",
 "1) that 뒤에 ‘주어 + 동사’가 오고 목적어가 빠져 있으면 목적격이라 생략할 수 있어요.  2) that 바로 뒤에 동사가 오면 주격이라 생략할 수 없어요.  3) 네 문장을 하나씩 확인해요.",
 "주격은 한 문장뿐이에요(helped). 나머지 세 문장은 생략할 수 있어요.","목적격 that만 생략 가능");
M("NS","N",26,"어법상 옳은 것을 모두 고르시오.<br>① Do you know a man who won an Oscar?<br>② The bag which have a silver handle is mine.<br>③ I met a girl whose wears a red dress.<br>④ The man whom you met yesterday is my uncle.<br>⑤ His honesty is that I like about him.",["① Do you know a man who won an Oscar?","② The bag which have a silver handle is mine.","③ I met a girl whose wears a red dress.","④ The man whom you met yesterday is my uncle.","⑤ His honesty is that I like about him."],["① Do you know a man who won an Oscar?","④ The man whom you met yesterday is my uncle."],"Do you know a man who won an Oscar? / The man whom you met yesterday is my uncle.","너는 오스카상을 받은 남자를 아니? / 네가 어제 만난 남자는 우리 삼촌이다.",
 "본책 p.158 ‘주격/목적격/소유격 관계대명사’ 박스와 p.160 what 박스를 펴세요.",
 "1) ②는 which 뒤 동사의 수가 선행사 The bag과 맞는지 보세요.  2) ③은 whose 뒤에 명사가 오는지 보세요.  3) ⑤는 선행사 없이 ‘~한 것’을 말해야 하는데 무엇을 써야 할지 생각해요.",
 "②, ③, ⑤는 각각 동사 수 일치, whose 뒤 명사, what 자리 문제가 있어요. 틀리지 않은 두 개를 고르세요.","수 일치 / whose + 명사 / 선행사 없으면 what");
M("NS","N",27,"다음 그림을 묘사한 글을 읽고 어법상 옳지 않은 것을 모두 고르시오.<br>(그림: 식당에서 종업원이 볶음국수를 서빙하고 있고, 안경 쓴 소년이 새우 만두를 먹고 있다.)<br>We are at a restaurant ① <u>where</u> serves delicious dim sum. The woman ② <u>that</u> has short hair is serving fried egg noodles to a man. The boy ③ <u>who</u> is wearing glasses is eating a basket of shrimp dumplings. The shrimp dumplings ④ <u>which</u> he is eating look amazing. I want to know ⑤ <u>the way how</u> they make them.",["① where","② that","③ who","④ which","⑤ the way how"],["① where","⑤ the way how"],"We are at a restaurant which[that] serves delicious dim sum. / I want to know the way[how] they make them.","우리는 맛있는 딤섬을 파는 식당에 있다. / 나는 그들이 그것들을 어떻게 만드는지 알고 싶다.",
 "본책 p.162 ‘관계부사’ 박스의 관계부사 뒤 완전한 문장, 그리고 the way와 how 주의 박스를 보세요.",
 "1) ①: 뒤에 동사 serves(원형 serve: 제공하다)가 바로 와서 주어가 없어요. 관계부사 뒤는 완전한 문장이어야 해요.  2) ⑤: the way와 how를 함께 쓸 수 있는지 확인해요.  3) ②, ③, ④는 주어/목적어 역할이 맞는지 봐요.",
 "①과 ⑤가 틀린 이유를 찾으세요. ②, ③, ④는 모두 문제가 없어요.","관계부사 뒤 완전한 문장 / the way, how 중 하나만");
W("NS","N",28,"보기에서 알맞은 관계대명사를 골라 표의 내용과 일치하는 문장을 완성하시오.<br>(표) Title: The Wonderful Wizard of Oz / Author: L. Frank Baum / Main Character: Dorothy<br>보기: whose, which<br>• The Wonderful Wizard of Oz is a book ___ ___ ___ by L. Frank Baum.<br>• The Wonderful Wizard of Oz is a book ___ ___ ___ is Dorothy.","which was written / whose main character","The Wonderful Wizard of Oz is a book which was written by L. Frank Baum. / The Wonderful Wizard of Oz is a book whose main character is Dorothy.","오즈의 마법사는 L. Frank Baum이 쓴 책이다. / 오즈의 마법사는 주인공이 Dorothy인 책이다.",
 "본책 p.158 1번 ‘주격 관계대명사’와 3번 ‘소유격 관계대명사’ 박스를 펴세요.",
 "1) 첫 문장은 ‘저자(Author)’ 정보예요. a book(책)을 설명하며 by L. Frank Baum(~에 의해)이 이어지니 수동 표현이 필요해요.  2) 둘째 문장은 ‘Main Character’ 정보이고 책의 주인공이라는 ‘~의’ 관계예요.",
 "첫 문장은 which + was + 과거분사(write의 과거분사), 둘째는 whose + 명사 두 단어예요.","which was written / whose main character",["whose","which"]);
W("NS","N",29,"[29-30] 우리말과 일치하도록 주어진 조건에 맞게 영작하시오.<br>조건: 관계대명사를 이용하여 한 문장으로 쓸 것 (단, that은 쓰지 말 것) / 주어진 단어를 모두 사용할 것 / 필요시 단어를 변형하거나 추가할 것 / 빈칸당 1단어만 쓸 것<br>그 소년은 너의 마음을 감동하게 할 아름다운 목소리를 가지고 있다.<br>(boy, have, beautiful, voice, will, touch, heart)","The boy has a beautiful voice which will touch your heart.","The boy has a beautiful voice which will touch your heart.","그 소년은 너의 마음을 감동하게 할 아름다운 목소리를 가지고 있다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스에서 사물 선행사 예문을 펴세요.",
 "1) 먼저 ‘그 소년은 아름다운 목소리를 가지고 있다’를 영어로 써요. 현재형이고 주어가 3인칭 단수예요.  2) 선행사는 a beautiful voice(사물)이고, 뒤 will touch(감동시킬 것이다)가 이어져요.  3) ‘너의 마음’은 소유격 + heart예요.",
 "사물 선행사 뒤 관계대명사는 that 대신 w로 시작하는 다섯 글자를 쓰고, ‘너의’를 나타내는 단어를 추가해요. 모두 11단어예요.","사물 선행사 + which + will + 동사원형");
W("NS","N",30,"[29-30] 우리말과 일치하도록 주어진 조건에 맞게 영작하시오.<br>조건: 관계대명사를 이용하여 한 문장으로 쓸 것 (단, that은 쓰지 말 것) / 주어진 단어를 모두 사용할 것 / 필요시 단어를 변형하거나 추가할 것 / 빈칸당 1단어만 쓸 것<br>내가 어제 본 의사는 매우 친절했다.<br>(doctor, see, yesterday, very, nice)","The doctor who(m) I saw yesterday was very nice.","The doctor who I saw yesterday was very nice. / The doctor whom I saw yesterday was very nice.","내가 어제 본 의사는 매우 친절했다.",
 "본책 p.158 2번 ‘목적격 관계대명사’ 박스를 펴세요.",
 "1) 주어는 ‘내가 어제 본 의사’, 즉 The doctor + 꾸미는 절이에요.  2) 의사는 사람이고, saw(원형 see: 보다)의 목적어가 빠진 목적격이에요.  3) 큰 동사는 과거형 was예요.",
 "관계대명사는 that 대신 w로 시작하는 사람 목적격을 써요. 주어진 단어에 없는 ‘나는’과 큰 동사를 추가해요. 모두 9단어예요.","사람 목적격 → who(m), 큰 동사는 맨 뒤");
// ===== 문법정리노트 =====
W("GN","G",1,"주격 관계대명사: My brother goes to ① ___ is in Switzerland.<br>(나의 남자 형제는 스위스에 있는 학교에 다닌다.)","a school which[that]","My brother goes to a school which[that] is in Switzerland.","나의 남자 형제는 스위스에 있는 학교에 다닌다.",
 "본책 p.170 ‘관계대명사 - 주격’ 줄을 펴서 「선행사 + who/which/that + 동사」 틀을 보세요.",
 "1) 빈칸 뒤에 동사 is가 바로 와요. 주격이에요.  2) school(학교)은 사물이라서 who는 안 되고, 선행사와 관계대명사 두 가지가 필요해요.",
 "첫 칸은 a, 둘째 칸은 ‘학교’, 셋째 칸은 사물 주격 관계대명사(w로 시작하는 다섯 글자, 또는 t로 시작하는 네 글자)예요.","선행사 + which[that] + 동사");
W("GN","G",2,"목적격 관계대명사: Erica is ② ___ I can trust.<br>(Erica는 내가 믿을 수 있는 친구이다.)","a friend who(m)[that]","Erica is a friend who(m)[that] I can trust.","Erica는 내가 믿을 수 있는 친구이다.",
 "본책 p.170 ‘관계대명사 - 목적격’ 줄을 펴서 「선행사 + who(m)/which/that + 주어 + 동사」 틀을 보세요.",
 "1) 빈칸 뒤에 I can trust(내가 믿을 수 있다)가 와요. ‘주어 + 동사’라서 목적격이에요.  2) 우리말에 ‘친구’라는 선행사가 있어요.",
 "첫 칸은 a, 둘째 칸은 ‘친구’, 셋째 칸은 사람 목적격 관계대명사(w로 시작, 또는 t로 시작하는 네 글자)예요.","선행사 + who(m) + 주어 + 동사");
W("GN","G",3,"소유격 관계대명사: We visited ③ ___ walls were blue.<br>(우리는 벽이 파란색인 건물을 방문했다.)","a building whose","We visited a building whose walls were blue.","우리는 벽이 파란색인 건물을 방문했다.",
 "본책 p.170 ‘관계대명사 - 소유격’ 줄을 펴서 「선행사 + whose + 명사 + 동사」 틀을 보세요.",
 "1) 빈칸 뒤에 walls(벽들)라는 명사가 바로 와요.  2) ‘건물의 벽’처럼 ‘~의’ 관계예요. 선행사도 같이 써야 해요.",
 "첫 칸은 a, 둘째 칸은 ‘건물’, 셋째 칸은 w로 시작하는 다섯 글자 소유격 관계대명사예요.","a building whose walls = 벽이 ~인 건물");
W("GN","G",4,"관계대명사 what: What(= ④ ___) she bought was a new cell phone.<br>(그녀가 산 것은 새로운 휴대전화였다.)","The thing which[that]","What she bought was a new cell phone. = The thing which[that] she bought was a new cell phone.","그녀가 산 것은 새로운 휴대전화였다.",
 "본책 p.170 ‘관계대명사 - what’ 줄과 p.160 ‘관계대명사 what’ 박스를 펴세요.",
 "1) what은 선행사를 포함한 관계대명사예요.  2) 그래서 ‘선행사 + 관계대명사’ 두 부분으로 풀어 쓸 수 있어요. ‘~한 것’에 해당하는 명사를 생각해요.",
 "‘것’을 뜻하는 t로 시작하는 명사 앞에 The를 붙이고, 셋째 칸은 사물 목적격 관계대명사예요.","what = the thing which[that]");
W("GN","G",5,"관계부사 when: Do you remember ⑤ ___ we first met?<br>(너는 우리가 처음 만났던 날을 기억하니?)","the day when","Do you remember the day when we first met?","너는 우리가 처음 만났던 날을 기억하니?",
 "본책 p.170 ‘관계부사 - 종류’ 의 when 줄과 p.162 ‘관계부사의 종류’ 표를 보세요.",
 "1) 우리말 ‘만났던 날’에서 선행사는 시간을 나타내는 말이에요.  2) 시간 선행사 뒤에는 시간의 관계부사를 써요.",
 "the d... 로 시작하는 두 단어 + w로 시작하는 네 글자예요.","the day when = 우리가 처음 만난 날");
W("GN","G",6,"관계부사 where: This is ⑥ ___ I was born.<br>(이곳은 내가 태어난 도시이다.)","the city where","This is the city where I was born.","이곳은 내가 태어난 도시이다.",
 "본책 p.170 ‘관계부사 - 종류’ 의 where 줄과 p.162 표의 장소 줄을 보세요.",
 "1) 우리말에 ‘도시’라는 장소 선행사가 있어요.  2) 장소 선행사 뒤에는 장소의 관계부사를 써요. 뒤 문장 I was born은 완전해요.",
 "the c... 로 시작하는 두 단어 + w로 시작하는 다섯 글자예요.","the city where = 내가 태어난 곳");

 "본책 p.170 ‘관계부사 - 종류’ 의 why 줄과 p.162 표의 이유 줄을 보세요.",
 "1) 우리말 ‘울고 있었던 이유’에서 선행사는 ‘이유’예요.  2) 이유 선행사 뒤에 쓰는 관계부사를 찾아요.",
