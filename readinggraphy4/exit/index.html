너는 바위 밑에 사니?”라고 물으면, 그것은 네가 주변에서 무슨 일이 일어나고 있는지 모른다는 뜻이다."]],"w":"1번 문장은 When people ask “Do you live under a rock?” it means ...로, 사람들이 묻는 그 질문 전체가 it으로 이어짐. 그 질문이 '주변에서 무슨 일이 일어나는지 모른다'는 뜻이라는 말임.","a":"1) “Do you live under a rock?”라는 질문","c":1,"k":"it = “Do you live under a rock?”라는 질문"},"h":"7e59186153"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s because Catholic rulers tried seven times to take the town back from the Moors in the 15th century.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 가톨릭 통치자들이 15세기에 무어인들로부터 그 마을을 되찾으려고 일곱 번 시도했기 때문이다.","opts":["그 이유는 가톨릭 통치자들이 15세기에 무어인들에게서 그 마을을 되찾으려고 일곱 번 시도했기 때문이다.","그 이유는 가톨릭 통치자들이 15세기에 그 마을을 일곱 번 새로 지었기 때문이다.","그 이유는 무어인들이 15세기에 가톨릭 통치자들에게서 그 마을을 일곱 번 빼앗았기 때문이다.","그 이유는 가톨릭 통치자들이 일곱 번 시도해서 결국 마을을 성공적으로 되찾았기 때문이다."],"r":{"ev":"7번 문장","s":[[7,"That’s because Catholic rulers tried seven times to take the town back from the Moors in the 15th century.","그것은 가톨릭 통치자들이 15세기에 무어인들로부터 그 마을을 되찾으려고 일곱 번 시도했기 때문이다."]],"w":"That's because ~는 '그것은 ~ 때문이다'. tried seven times to take the town back from the Moors는 '무어인들에게서 마을을 되찾으려고 일곱 번 시도했다'는 뜻. 새로 지었다거나 성공했다는 말은 본문에 없음.","a":"1) 그 이유는 가톨릭 통치자들이 15세기에 무어인들에게서 그 마을을 되찾으려고 일곱 번 시도했기 때문이다.","c":1},"h":"41bf83e175"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["‘Bodegas’는 스페인어로 ‘와인 저장고’를 뜻한다.","‘Bodegas’는 스페인어로 ‘바위로 만든 집’을 뜻한다.","‘Bodegas’는 영어로 ‘와인 저장고’를 뜻한다.","‘Bodegas’는 스페인어로 ‘올리브를 두는 곳’을 뜻한다."],"opts":["“Bodegas” means “a storehouse for wine” in Spanish.","“Bodegas” means “a house made of rocks” in Spanish.","“Bodegas” means “a storehouse for wine” in English.","“Bodegas” means “a place for olives” in Spanish."],"r":{"ev":"8번 문장","s":[[8,"“Bodegas” means “a storehouse for wine” in Spanish.","‘Bodegas’는 스페인어로 ‘와인 저장고’를 뜻한다."]],"w":"8번 문장에 “Bodegas” means “a storehouse for wine” in Spanish가 나옴. 스페인어로 와인 저장고라는 ①이 맞고, 영어라는 말이나 바위집, 올리브라는 말은 없음.","a":"1) “Bodegas” means “a storehouse for wine” in Spanish. (‘Bodegas’는 스페인어로 ‘와인 저장고’를 뜻한다.)","c":1},"h":"d2879f246e"},{"n":9,"t":"sum","q":"The town is still (A) for its delicious olives and (B).","ko":"그 마을은 맛있는 올리브와 (B)(으)로 여전히 (A).","oko":["(A) 두려워한다 / (B) 아몬드","(A) 유명하다 / (B) 돌","(A) 지쳐 있다 / (B) 길","(A) 두려워한다 / (B) 돌","(A) 유명하다 / (B) 아몬드"],"opts":["(A) afraid / (B) almonds","(A) famous / (B) stones","(A) tired / (B) roads","(A) afraid / (B) stones","(A) famous / (B) almonds"],"r":{"ev":"11번 문장","s":[[11,"But the town is still famous for its delicious olives and almonds!","하지만 그 마을은 맛있는 올리브와 아몬드로 여전히 유명하다!"]],"w":"11번 문장 the town is still famous for its delicious olives and almonds에서 (A)는 famous(유명한), (B)는 almonds(아몬드). 두려워하거나 지쳐 있다는 말, 돌이나 길은 본문에 없음.","a":"5) (A) famous / (B) almonds ((A) 유명하다 / (B) 아몬드)","c":5},"h":"c720b785be"},{"n":10,"t":"fill","q":"“Setenil” comes from the [A] words for “seven times [B].”","ko":"‘Setenil’은 ‘7번의 [B]’를 뜻하는 [A] 단어에서 왔다.","bank":["Latin","nothing","because","inside","under","against"],"bko":{"Latin":"라틴어의","nothing":"무(無), 아무것도 없음","because":"~때문에","inside":"~안에","under":"~아래에","against":"~에 반대하여"},"r":{"ev":"6번 문장","s":[[6,"“Setenil” comes from the Latin words for “seven times nothing.”","‘Setenil’은 ‘7번의 무(無)’를 뜻하는 라틴어에서 왔다."]],"w":"6번 문장 “Setenil” comes from the Latin words for “seven times nothing.”에서 [A]는 Latin, [B]는 nothing. 나머지는 전치사나 접속사라서 words 앞 수식어 자리와 times 뒤 자리에 들어갈 수 없음.","a":"[A] Latin (라틴어의), [B] nothing (무(無), 아무것도 없음)","c":null},"h":"c4887fa15b"}]},{"u":4,"id":"rg4-04-2","no":2,"ko":"악몽(nightmare)의 night 뒤에 숨은 유령 이야기","items":[{"n":1,"t":"tf","q":"The word “night” was added later to show that the spirits visited at night.","ko":"‘night’라는 단어는 그 유령들이 밤에 방문했다는 것을 보여 주려고 나중에 추가되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The word “night” was added later to show that these spirits visited at night.","이러한 유령들이 밤에 방문했다는 것을 보여 주기 위해 ‘night’라는 단어가 나중에 추가되었다."]],"w":"3번 문장에 The word “night” was added later to show that these spirits visited at night라고 나옴. 같은 내용이라 T.","c":"T"},"h":"5657290009"},{"n":2,"t":"tf","q":"The word “mare” originally meant any scary dream.","ko":"‘mare’라는 단어는 원래 어떤 무서운 꿈이든 의미했다.","r":{"a":"F (본문과 다른 내용)","ev":"2번, 4번 문장","s":[[2,"The word “nightmare” originated from the Middle English word “mare,” which meant an evil spirit that bothered people during sleep.","‘nightmare’라는 단어는 중세 영어 단어인 ‘mare’에서 유래했는데, 그것은 잠자는 동안 사람들을 괴롭히는 사악한 유령을 의미했다."],[4,"Nowadays, we use the word “nightmare” to describe any scary dream.","오늘날 우리는 어떤 무서운 꿈이든 묘사하기 위해 ‘nightmare’라는 단어를 사용한다."]],"w":"2번에서 mare는 잠자는 동안 사람들을 괴롭히는 사악한 유령이었음. 어떤 무서운 꿈이든 가리키는 것은 오늘날의 nightmare(4번). 원래 뜻이 아니라서 F.","c":"F"},"h":"2f6b7b1e45"},{"n":3,"t":"tf","q":"In Germany, some people put shoes near the door to keep nightmare creatures away.","ko":"독일에서는 어떤 사람들이 악몽을 일으키는 생물을 쫓으려고 문 근처에 신발을 둔다.","r":{"a":"T (본문과 맞는 내용)","ev":"8~9번 문장","s":[[8,"In Germany, there are various creatures believed to bring nightmares.","독일에는 악몽을 일으킨다고 믿어지는 다양한 생물체가 있다."],[9,"To keep them away, some people put shoes near the door, cover the keyhole, or put something made of steel in their bed.","그것들을 멀리하기 위해, 어떤 사람들은 문 근처에 신발을 두거나, 열쇠 구멍을 막거나, 강철로 만든 무언가를 침대에 놓는다."]],"w":"8~9번에서 독일에는 악몽을 일으킨다고 믿어지는 생물이 있고, 쫓으려고 some people put shoes near the door. 같은 내용이라 T.","c":"T"},"h":"975a9fda6d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... there is an ancient story about King Vanlandi, ...)","ko":"... Vanlandi 왕에 대한 ( ) 이야기가 있다.","opts":["현대의","새로운","고대의","유명한"],"word":"ancient","r":{"a":"3) 고대의","ev":"6번 문장","s":[[6,"For example, in Scandinavia, there is an ancient story about King Vanlandi, who was killed by a mare.","예를 들어, 스칸디나비아에는 mare에게 죽임을 당한 Vanlandi 왕에 대한 고대의 이야기가 있다."]],"w":"6번의 ancient story는 오래전부터 전해 온 이야기. 스칸디나비아의 옛 왕 이야기라서 ancient = 고대의. 현대의·새로운은 반대 방향.","c":3},"h":"b5c6a287d7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... spirits or creatures that cause bad dreams.)","ko":"... 나쁜 꿈을 ( ) 유령이나 생물체","opts":["막다","일으키다","잊다","끝내다"],"word":"cause","r":{"a":"2) 일으키다","ev":"5번 문장","s":[[5,"Different cultures have their own stories about spirits or creatures that cause bad dreams.","다양한 문화들은 나쁜 꿈을 일으키는 유령이나 생물체에 대한 자신들만의 이야기를 가지고 있다."]],"w":"5번에서 유령이나 생물체가 나쁜 꿈의 원인이 된다는 말. cause = 일으키다. 8번의 ‘악몽을 가져온다고 믿어지는 생물’과도 같은 뜻 흐름. 막거나 끝낸다는 뜻이 아님.","c":2},"h":"c7c0d688f1"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThis creature used to sit on the chests of people who were sleeping, so they found it hard to breathe.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이 생물체는 자고 있던 사람들의 가슴 위에 앉곤 했고, 그래서 사람들은 숨쉬기가 어렵다고 여겼다.","pron":"they","opts":["자고 있던 사람들","이 생물체들","독일 사람들","Vanlandi 왕과 유령"],"r":{"ev":"7번 문장","s":[[7,"This creature used to sit on the chests of people who were sleeping, so they found it hard to breathe.","이 생물체는 자고 있던 사람들의 가슴 위에 앉곤 했고, 그래서 사람들은 숨쉬기가 어렵다고 여겼다."]],"w":"7번 문장은 This creature used to sit on the chests of people who were sleeping, so they found it hard to breathe. 숨쉬기 어렵다고 느낀 것은 가슴 위에 눌린 people who were sleeping임.","a":"1) 자고 있던 사람들","c":1,"k":"they = 자고 있던 사람들"},"h":"ed3fc222ea"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"According to other traditions, mares can even suck the life out of people, just like vampires!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다른 전통에 따르면, mare는 심지어 마치 흡혈귀처럼 사람들의 생명을 빨아들일 수도 있다!","opts":["다른 전통에 따르면, mare는 심지어 흡혈귀처럼 사람들의 생명을 빨아들일 수도 있다.","다른 전통에 따르면, mare는 흡혈귀에게서 사람들의 생명을 지켜 준다.","다른 전통에 따르면, 흡혈귀는 mare를 보면 도망간다.","다른 전통에 따르면, 사람들은 mare 때문에 흡혈귀가 되었다."],"r":{"ev":"10번 문장","s":[[10,"According to other traditions, mares can even suck the life out of people, just like vampires!","다른 전통에 따르면, mare는 심지어 마치 흡혈귀처럼 사람들의 생명을 빨아들일 수도 있다!"]],"w":"suck the life out of people은 '사람들의 생명을 빨아들이다', just like vampires는 '마치 흡혈귀처럼'이라는 뜻. 생명을 지켜 준다거나 사람이 흡혈귀가 되었다는 말은 본문에 없음.","a":"1) 다른 전통에 따르면, mare는 심지어 흡혈귀처럼 사람들의 생명을 빨아들일 수도 있다.","c":1},"h":"6d05dae72b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Vanlandi 왕은 mare였다.","Vanlandi 왕은 mare를 죽였다.","Vanlandi 왕은 mare에게 죽임을 당했다.","Vanlandi 왕은 유명한 의사였다."],"opts":["King Vanlandi was a mare.","King Vanlandi killed a mare.","King Vanlandi was killed by a mare.","King Vanlandi was a famous doctor."],"r":{"ev":"6번 문장","s":[[6,"For example, in Scandinavia, there is an ancient story about King Vanlandi, who was killed by a mare.","예를 들어, 스칸디나비아에는 mare에게 죽임을 당한 Vanlandi 왕에 대한 고대의 이야기가 있다."]],"w":"6번 문장 King Vanlandi, who was killed by a mare에서 Vanlandi 왕은 mare에게 죽임을 당했음. mare를 죽였다는 말(반대 방향)이나 의사였다는 말은 본문에 없음.","a":"3) King Vanlandi was killed by a mare. (Vanlandi 왕은 mare에게 죽임을 당했다.)","c":3},"h":"0c69e48bf8"},{"n":9,"t":"sum","q":"Different (A) have their own (B) about spirits or creatures that bring bad dreams.","ko":"서로 다른 (A)은(는) 나쁜 꿈을 가져오는 유령이나 생물체에 대한 자신들만의 (B)을(를) 가지고 있다.","oko":["(A) 신발들 / (B) 이야기들","(A) 문화들 / (B) 열쇠들","(A) 문들 / (B) 열쇠들","(A) 문화들 / (B) 침대들","(A) 문화들 / (B) 이야기들"],"opts":["(A) shoes / (B) stories","(A) cultures / (B) keys","(A) doors / (B) keys","(A) cultures / (B) beds","(A) cultures / (B) stories"],"r":{"ev":"5번 문장","s":[[5,"Different cultures have their own stories about spirits or creatures that cause bad dreams.","다양한 문화들은 나쁜 꿈을 일으키는 유령이나 생물체에 대한 자신들만의 이야기를 가지고 있다."]],"w":"5번 문장 Different cultures have their own stories about spirits or creatures에서 (A)는 cultures(문화들), (B)는 stories(이야기들). 신발, 문, 열쇠, 침대가 이야기를 가진다는 말은 말이 안 됨.","a":"5) (A) cultures / (B) stories ((A) 문화들 / (B) 이야기들)","c":5},"h":"8569a1ecc4"},{"n":10,"t":"fill","q":"[A], we use the word “nightmare” to [B] any scary dream.","ko":"[A] 우리는 어떤 무서운 꿈이든 [B]하기 위해 ‘nightmare’라는 단어를 사용한다.","bank":["Nowadays","describe","Germany","steel","keyhole","chests"],"bko":{"Nowadays":"오늘날","describe":"묘사하다","Germany":"독일","steel":"강철","keyhole":"열쇠 구멍","chests":"가슴들"},"r":{"ev":"4번 문장","s":[[4,"Nowadays, we use the word “nightmare” to describe any scary dream.","오늘날 우리는 어떤 무서운 꿈이든 묘사하기 위해 ‘nightmare’라는 단어를 사용한다."]],"w":"4번 문장 Nowadays, we use the word “nightmare” to describe any scary dream에서 [A]는 Nowadays, [B]는 describe. to 뒤에는 동사 원형이 와야 해서 명사들은 들어갈 수 없음.","a":"[A] Nowadays (오늘날), [B] describe (묘사하다)","c":null},"h":"72312f2177"}]},{"u":4,"id":"rg4-04-3","no":3,"ko":"몸속에 넣는 배터리가 암과 싸운다고?","items":[{"n":1,"t":"tf","q":"No other healthy cells are harmed during the process.","ko":"그 과정에서 다른 건강한 세포는 손상되지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"During the process, no other healthy cells are harmed.","그 과정에서, 어떠한 건강한 세포도 손상되지 않는다."]],"w":"7번 문장에 During the process, no other healthy cells are harmed가 나옴. 같은 내용이라 T.","c":"T"},"h":"da2325c2bf"},{"n":2,"t":"tf","q":"Strong medicine for cancer patients can make them feel sick.","ko":"암 환자를 위한 강한 약은 그들을 아프게 할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Cancer patients get strong medicine which can make them feel sick or cause various side effects.","암 환자들은 그들을 아프게 하거나 여러 가지 부작용을 일으킬 수 있는 강한 약을 받는다."]],"w":"1번 문장에 Cancer patients get strong medicine which can make them feel sick or cause various side effects. 같은 내용이라 T.","c":"T"},"h":"05d1e4632b"},{"n":3,"t":"tf","q":"Some significant side effects were observed in the mice.","ko":"쥐들에게서 몇몇 중대한 부작용이 관찰되었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Also, no significant side effects were observed.","또한, 어떠한 중대한 부작용도 관찰되지 않았다."]],"w":"10번 문장은 no significant side effects were observed(중대한 부작용이 관찰되지 않았다)임. 부작용이 관찰됐다는 말은 반대라서 F.","c":"F"},"h":"26ad1080d1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Also, no significant side effects were observed.)","ko":"또한, 어떠한 ( ) 부작용도 관찰되지 않았다.","opts":["작은","중대한","이상한","오래된"],"word":"significant","r":{"a":"2) 중대한","ev":"10번 문장","s":[[10,"Also, no significant side effects were observed.","또한, 어떠한 중대한 부작용도 관찰되지 않았다."]],"w":"10번은 부작용이 아주 중요한 수준으로는 나타나지 않았다는 말. significant = 중대한, 중요한. 앞의 1번에서 부작용이 문제였다는 흐름과도 이어짐.","c":2},"h":"f882230eff"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... it reduced the tumor size by 90 percent in most of the mice.)","ko":"... 그것은 쥐 대부분에서 종양의 크기를 90퍼센트까지 ( ).","opts":["늘렸다","바꿨다","줄였다","찾았다"],"word":"reduced","r":{"a":"3) 줄였다","ev":"9번 문장","s":[[9,"In just two weeks, it reduced the tumor size by 90 percent in most of the mice.","단 2주 만에, 그것은 쥐 대부분에서 종양의 크기를 90퍼센트까지 줄였다."]],"w":"9번에서 종양 크기가 90퍼센트 변했다는 것은 작아졌다는 뜻이고, 6번의 make the cancer smaller와도 같은 흐름. reduced = 줄였다. 늘렸다는 반대 뜻.","c":3},"h":"8bef464235"},{"n":6,"t":"ref","q":"What does the underlined “it” refer to?\nWhen the battery finds cancer, it uses the medicine to make the cancer smaller.","ko":"밑줄 친 it이 가리키는 것은?","sko":"배터리가 암을 발견하면, 그것은 암을 더 작게 만들기 위해 약을 사용한다.","opts":["암","약","환자","배터리"],"r":{"a":"4) 배터리","ev":"3번, 6번 문장","s":[[3,"They have developed a battery system that can be put inside the body.","그들은 몸속에 넣을 수 있는 배터리 시스템을 개발했다."],[6,"When the battery finds cancer, it uses the medicine to make the cancer smaller.","배터리가 암을 발견하면, 그것은 암을 더 작게 만들기 위해 약을 사용한다."]],"w":"6번에서 it uses the medicine에서 약을 쓰는 주체는 앞의 the battery(3번의 배터리 시스템). 약과 암은 쓰이는 대상이라 it이 아니고, 환자도 아님.","c":4},"h":"b89442fed9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It targets low-oxygen areas of the body that support tumor growth.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 종양 성장을 돕는 몸속의 저산소 구역을 목표로 삼는다.","opts":["산소가 많은 건강한 부위를 목표로 삼는다.","종양이 자라도록 돕는 산소가 적은 몸속 부위를 목표로 삼는다.","종양이 자라지 못하게 산소를 더 많이 보낸다.","산소가 적은 부위를 피해 건강한 세포만 찾아간다."],"r":{"a":"2) 종양이 자라도록 돕는 산소가 적은 몸속 부위를 목표로 삼는다.","ev":"4~5번 문장","s":[[4,"It targets low-oxygen areas of the body that support tumor growth.","그것은 종양 성장을 돕는 몸속의 저산소 구역을 목표로 삼는다."],[5,"Cancer cells and their surrounding areas have less oxygen compared to healthy cells.","암세포와 그 주변은 건강한 세포에 비해 산소가 더 적다."]],"w":"targets는 ‘목표로 삼는다’, low-oxygen areas는 산소가 적은 구역, that support tumor growth는 종양 성장을 돕는 구역을 꾸밈. 5번에서 암 주변은 산소가 적다고 했으므로 2번. 산소를 보내거나 피한다는 말은 본문에 없음.","c":2},"h":"4a44dc5513"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["과학자들은 암에 걸린 쥐들에게 이 시스템을 실험했다.","푸단 대학은 서울에 있는 대학이다.","이 시스템은 건강한 세포도 함께 손상시킨다.","이 방법은 이미 인간에게 성공적으로 실험되었다."],"opts":["Scientists tested this system on mice with cancer.","Fudan University is in Seoul.","This system harms healthy cells, too.","This method has already been successfully tested on humans."],"r":{"a":"1) Scientists tested this system on mice with cancer.","ev":"2번, 7~8번, 11번 문장","s":[[2,"Scientists from Fudan University in Shanghai found a potentially safer way to help these patients.","상하이에 있는 푸단 대학의 과학자들은 이러한 환자들을 돕는, 잠재적으로 더 안전한 방법을 찾아냈다."],[7,"During the process, no other healthy cells are harmed.","그 과정에서, 어떠한 건강한 세포도 손상되지 않는다."],[8,"Scientists tested this system on mice with cancer, and the results were amazing!","과학자들은 암에 걸린 쥐들에게 이 시스템을 실험했는데, 그 결과는 놀라웠다!"],[11,"This method hasn’t been tested on humans yet.","이 방법은 아직 인간에게는 실험되지 않았다."]],"w":"8번에서 암에 걸린 쥐들에게 이 시스템을 실험했다고 함. 푸단 대학은 상하이(2번), 건강한 세포는 손상되지 않고(7번), 인간에게는 아직 실험되지 않았으므로(11번) 나머지는 모두 본문과 다름.","c":1},"h":"a6555526a5"},{"n":9,"t":"sum","q":"Cancer cells and their (A) areas have (B) oxygen compared to healthy cells.","ko":"암세포와 그 (A) 구역은 건강한 세포에 비해 산소가 (B).","oko":["(A) 숨겨진 / (B) 더 많다","(A) 화려한 / (B) 더 적다","(A) 주변의 / (B) 더 많다","(A) 숨겨진 / (B) 더 적다","(A) 주변의 / (B) 더 적다"],"opts":["(A) hidden / (B) more","(A) colorful / (B) less","(A) surrounding / (B) more","(A) hidden / (B) less","(A) surrounding / (B) less"],"r":{"ev":"5번 문장","s":[[5,"Cancer cells and their surrounding areas have less oxygen compared to healthy cells.","암세포와 그 주변은 건강한 세포에 비해 산소가 더 적다."]],"w":"5번 문장 Cancer cells and their surrounding areas have less oxygen compared to healthy cells에서 (A)는 surrounding(주변의), (B)는 less(더 적은). 더 많다는 말은 반대이고 숨겨진, 화려한 구역이라는 말은 없음.","a":"5) (A) surrounding / (B) less ((A) 주변의 / (B) 더 적다)","c":5},"h":"aabfd6a080"},{"n":10,"t":"fill","q":"However, more [A] is [B] to prepare the battery system for human use.","ko":"하지만, 인간이 사용할 수 있는 배터리 시스템을 준비하려면 더 많은 [A]이(가) [B].","bank":["research","required","potentially","inside","during","just"],"bko":{"research":"연구","required":"필요하다고 요구되는(require의 과거분사)","potentially":"잠재적으로","inside":"~안에","during":"~동안","just":"단지"},"r":{"ev":"13번 문장","s":[[13,"However, more research is required to prepare the battery system for human use.","하지만, 인간이 사용할 수 있는 배터리 시스템을 준비하려면 더 많은 연구가 필요하다."]],"w":"13번 문장 However, more research is required to prepare the battery system for human use.에서 [A]는 research, [B]는 required. more 뒤에는 명사, is 뒤에는 과거분사가 와야 해서 부사나 전치사는 들어갈 수 없음.","a":"[A] research (연구), [B] required (필요하다고 요구되는(require의 과거분사))","c":null},"h":"e958ad382b"}]},{"u":5,"id":"rg4-05-1","no":1,"ko":"실수를 잘 살펴보는 아이가 더 빨리 배운다","items":[{"n":1,"t":"tf","q":"The study looked at 123 children aged six to eight.","ko":"그 연구는 6세에서 8세 사이의 아이들 123명을 대상으로 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"A psychologist at Michigan State University studied 123 children aged six to eight.","미시간 주립 대학의 한 심리학자가 6세에서 8세 사이의 아이들 123명을 연구했다."]],"w":"3번 문장에 studied 123 children aged six to eight가 나옴. 같은 내용이라 T.","c":"T"},"h":"64642b3b45"},{"n":2,"t":"tf","q":"All the children believed that their intelligence can change.","ko":"모든 아이들은 자신의 지능이 바뀔 수 있다고 믿었다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"Some of the children believed that they are born with a certain level of intelligence and it cannot change.","아이들 중 몇몇은 자신들이 특정한 수준의 지능을 가지고 태어나며 그것이 바뀔 수 없다고 믿었다."],[5,"Others believed that they can grow and become smarter through hard work.","다른 아이들은 고된 노력을 통해 자신들이 성장할 수 있고 더 똑똑해질 수 있다고 믿었다."]],"w":"4번의 아이들 중 몇몇은 지능이 타고나서 바뀔 수 없다고 믿었고, 5번의 다른 아이들만 바뀔 수 있다고 믿었음. 모든 아이들이 그렇게 믿은 것은 아니므로 F.","c":"F"},"h":"743bb7b998"},{"n":3,"t":"tf","q":"The children wore special hats that recorded their brain activity.","ko":"아이들은 자신의 뇌 활동을 기록하는 특수한 모자를 썼다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"They wore special hats that recorded their brain activity.","그들은 자신의 뇌 활동을 기록하는 특수한 모자를 썼다."]],"w":"7번 문장에 They wore special hats that recorded their brain activity가 나옴. 같은 내용이라 T.","c":"T"},"h":"347af73ccf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... children with a fixed mindset tended to ignore their mistakes.)","ko":"... 고정된 사고방식을 지닌 아이들은 자신의 실수를 ( ) 경향이 있었다.","opts":["기억하다","무시하다","부러워하다","따라 하다"],"word":"ignore","r":{"a":"2) 무시하다","ev":"10번 문장","s":[[10,"On the other hand, children with a fixed mindset tended to ignore their mistakes.","반면에, 고정된 사고방식을 지닌 아이들은 자신의 실수를 무시하는 경향이 있었다."]],"w":"10번은 8~9번(실수에 주의를 기울임)과 반대되는 그룹 이야기. 그래서 ignore = 무시하다. 기억하거나 따라 한다는 뜻이면 반대 그룹이 되어 버림.","c":2},"h":"659e911b5a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They were also better at correcting their mistakes on the next try.)","ko":"그들은 또한 다음번 시도에서 자신의 실수를 ( ) 데 더 우수했다.","opts":["바로잡는","숨기는","반복하는","잊는"],"word":"correcting","r":{"a":"1) 바로잡는","ev":"9번 문장","s":[[9,"They were also better at correcting their mistakes on the next try.","그들은 또한 다음번 시도에서 자신의 실수를 바로잡는 데 더 우수했다."]],"w":"9번은 실수에 주의를 기울인 아이들이 다음 시도에서 더 잘한다는 흐름. correct = 바로잡다, 고치다. 숨기거나 반복하거나 잊는다면 ‘잘했다’는 뜻과 맞지 않음.","c":1},"h":"88bac3906e"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nThe results showed that children with a growth mindset paid more attention to their mistakes.","ko":"밑줄 친 their가 가리키는 것은?","sko":"결과는 성장하는 사고방식을 지닌 아이들이 자신의 실수에 더 많은 주의를 기울였다는 것을 보여 주었다.","pron":"their","opts":["성장하는 사고방식을 지닌 아이들","고정된 사고방식을 지닌 아이들","연구를 한 심리학자","컴퓨터 게임 속 동물들"],"r":{"ev":"8번 문장","s":[[8,"The results showed that children with a growth mindset paid more attention to their mistakes.","결과는 성장하는 사고방식을 지닌 아이들이 자신의 실수에 더 많은 주의를 기울였다는 것을 보여 주었다."]],"w":"8번 문장은 children with a growth mindset paid more attention to their mistakes. 실수에 더 많은 주의를 기울인 쪽은 성장하는 사고방식을 지닌 아이들이므로 their는 그 아이들을 가리킴.","a":"1) 성장하는 사고방식을 지닌 아이들","c":1,"k":"their = 성장하는 사고방식을 지닌 아이들"},"h":"bbb3d2e875"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It’s true that we can learn from our mistakes!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리가 실수로부터 배울 수 있다는 것은 사실이다!","opts":["우리가 실수로부터 배울 수 있다는 것은 사실이다.","우리가 실수를 하면 아무것도 배울 수 없다는 것은 사실이다.","우리가 실수로부터 배운다는 것은 거짓이다.","우리는 다른 사람들의 실수로부터만 배울 수 있다."],"r":{"ev":"1번 문장","s":[[1,"It’s true that we can learn from our mistakes!","우리가 실수로부터 배울 수 있다는 것은 사실이다!"]],"w":"It's true that ~은 '~라는 것은 사실이다', we can learn from our mistakes는 '우리는 실수로부터 배울 수 있다'는 뜻. 아무것도 배울 수 없다거나 거짓이라는 말은 본문과 반대임.","a":"1) 우리가 실수로부터 배울 수 있다는 것은 사실이다.","c":1},"h":"278f1de223"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["변할 수 없다고 믿으면, 실수로부터 더 많이 배우게 된다.","스스로 더 똑똑해질 수 있다고 믿으면, 실수로부터 배울 가능성이 더 높다.","실수를 하지 않으면, 더 똑똑해질 가능성이 더 높다.","실수로부터 배우면, 더 똑똑해질 수 없다고 믿게 된다."],"opts":["If you believe you cannot change, you will learn more from your mistakes.","If you believe you can get smarter, you will be more likely to learn from your mistakes.","If you do not make mistakes, you will be more likely to get smarter.","If you learn from your mistakes, you will believe you cannot get smarter."],"r":{"ev":"11번 문장","s":[[11,"This study shows that if you believe you can get smarter, you will be more likely to learn from your mistakes.","이 연구는 당신이 스스로 더 똑똑해질 수 있다고 믿는다면, 당신이 자신의 실수로부터 배울 가능성이 더 높다는 것을 보여 준다."]],"w":"11번 문장에 if you believe you can get smarter, you will be more likely to learn from your mistakes가 나옴. 똑똑해질 수 있다고 믿는 쪽이 실수에서 더 잘 배운다는 ②가 맞음.","a":"2) If you believe you can get smarter, you will be more likely to learn from your mistakes. (스스로 더 똑똑해질 수 있다고 믿으면, 실수로부터 배울 가능성이 더 높다.)","c":2},"h":"0cc1093721"},{"n":9,"t":"sum","q":"A new study shows that kids who pay attention to their mistakes (A) learn (B) than those who don’t.","ko":"새로운 연구는 자신의 실수에 주의를 기울이는 아이들이 그렇지 않은 아이들보다 (A) 더 (B) 배운다는 것을 보여 준다.","oko":["(A) 실제로 / (B) 느리게","(A) 절대 / (B) 빠르게","(A) 거의 ~않게 / (B) 느리게","(A) 거의 ~않게 / (B) 빠르게","(A) 실제로 / (B) 빠르게"],"opts":["(A) actually / (B) slower","(A) never / (B) faster","(A) hardly / (B) slower","(A) hardly / (B) faster","(A) actually / (B) faster"],"r":{"ev":"2번 문장","s":[[2,"A new study shows that kids who pay attention to their mistakes actually learn faster than those who don’t.","새로운 연구는 자신의 실수에 주의를 기울이는 아이들이 그렇지 않은 아이들보다 실제로 더 빠르게 배운다는 것을 보여 준다."]],"w":"2번 문장 kids who pay attention to their mistakes actually learn faster than those who don’t에서 (A)는 actually(실제로), (B)는 faster(더 빠르게). 더 느리게 배운다거나 절대 안 배운다는 말은 본문과 반대임.","a":"5) (A) actually / (B) faster ((A) 실제로 / (B) 빠르게)","c":5},"h":"dea662db37"},{"n":10,"t":"fill","q":"In the study, the children [A] a computer game to [B] animals.","ko":"연구에서, 아이들은 동물을 [B]기 위한 컴퓨터 게임을 [A].","bank":["played","catch","computer","animals","hats","brain"],"bko":{"played":"했다(play의 과거)","catch":"잡다","computer":"컴퓨터","animals":"동물들","hats":"모자들","brain":"뇌"},"r":{"ev":"6번 문장","s":[[6,"In the study, the children played a computer game to catch animals.","연구에서, 아이들은 동물을 잡는 컴퓨터 게임을 했다."]],"w":"6번 문장 the children played a computer game to catch animals에서 [A]는 played(play의 과거형), [B]는 catch. 주어 뒤에는 동사, to 뒤에는 동사 원형이 와야 해서 명사들은 들어갈 수 없음.","a":"[A] played (했다(play의 과거)), [B] catch (잡다)","c":null},"h":"6977bb3f11"}]},{"u":5,"id":"rg4-05-2","no":2,"ko":"배 속 박테리아가 기분을 바꾼다고?","items":[{"n":1,"t":"tf","q":"When we are anxious, we might have an upset stomach.","ko":"우리가 불안할 때, 배탈이 날 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"For example, when we’re anxious, we might have an upset stomach.","예를 들어, 우리가 불안할 때, 배탈이 날 수도 있다."]],"w":"2번 문장에 when we’re anxious, we might have an upset stomach이 나옴. 같은 내용이라 T.","c":"T"},"h":"3f4376227a"},{"n":2,"t":"tf","q":"Researchers added bad bacteria to the guts of mice.","ko":"연구원들은 쥐의 소화기관에 나쁜 박테리아를 넣었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In a study with mice, researchers removed good bacteria from their guts.","쥐를 대상으로 한 연구에서, 연구원들은 그것들의 소화기관에서 좋은 박테리아를 제거했다."]],"w":"4번에서 연구원들이 한 일은 쥐의 소화기관에서 good bacteria(좋은 박테리아)를 제거한 것. 나쁜 박테리아를 넣었다는 말은 본문에 없어서 F.","c":"F"},"h":"5516aeee6a"},{"n":3,"t":"tf","q":"Giving good bacteria to stressed mice made them less stressed.","ko":"스트레스 받은 쥐에게 좋은 박테리아를 주자 쥐들은 스트레스를 덜 받았다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"But when they gave the stressed mice good bacteria, which are called probiotics, the mice became less stressed and their anxiety disappeared.","그러나 그들이 프로바이오틱스라고 불리는 좋은 박테리아를 스트레스 받은 쥐에게 주었을 때, 쥐들은 스트레스를 덜 받았고 불안감이 사라졌다."]],"w":"6번에서 좋은 박테리아(probiotics)를 스트레스 받은 쥐에게 주자 the mice became less stressed라고 함. 같은 내용이라 T.","c":"T"},"h":"59f31ac7da"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This made the mice more stressed and anxious.)","ko":"이것은 쥐를 더 스트레스받고 ( )하게 만들었다.","opts":["졸린","불안한","행복한","배고픈"],"word":"anxious","r":{"a":"2) 불안한","ev":"2번, 5번 문장","s":[[2,"For example, when we’re anxious, we might have an upset stomach.","예를 들어, 우리가 불안할 때, 배탈이 날 수도 있다."],[5,"This made the mice more stressed and anxious.","이것은 쥐를 더 스트레스받고 불안하게 만들었다."]],"w":"5번은 좋은 박테리아가 사라진 쥐가 stressed(스트레스받은)와 함께 anxious해졌다는 말. 2번의 ‘불안할 때 배탈이 난다’와 같은 단어. anxious = 불안한. 행복한은 반대.","c":2},"h":"685620f8c5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... consuming fermented foods such as yogurt, pickles, and kimchi can reduce these anxious feelings.)","ko":"... 요구르트, 피클, 김치와 같은 발효 식품을 ( ) 것이 이러한 불안한 감정을 줄일 수 있다.","opts":["만드는 것","파는 것","먹는 것","버리는 것"],"word":"consuming","r":{"a":"3) 먹는 것","ev":"8번 문장","s":[[8,"In fact, researchers also found that consuming fermented foods such as yogurt, pickles, and kimchi can reduce these anxious feelings.","사실, 연구원들은 요구르트, 피클, 그리고 김치와 같은 발효 식품을 먹는 것이 이러한 불안한 감정을 줄일 수 있다는 것도 발견했다."]],"w":"8번은 발효 식품을 consuming하면 불안한 감정이 줄어든다는 말. 음식을 먹어서 몸에 들어가야 효과가 있으므로 consuming = 먹는. 만들거나 파는 것으로는 감정이 줄지 않음.","c":3},"h":"c1f6cb3fdd"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThey think that these good bacteria might work similarly to medicines that improve our mood.","ko":"medicines that의 밑줄 친 that이 가리키는 것은?","sko":"그들은 이 좋은 박테리아가 우리의 기분을 향상시키는 약과 비슷하게 작용할지도 모른다고 생각한다.","pron":"that","opts":["약","좋은 박테리아","기분","연구원들"],"r":{"ev":"10번 문장","s":[[10,"They think that these good bacteria might work similarly to medicines that improve our mood.","그들은 이 좋은 박테리아가 우리의 기분을 향상시키는 약과 비슷하게 작용할지도 모른다고 생각한다."]],"w":"10번 문장은 medicines that improve our mood. 관계대명사 that은 바로 앞 명사 medicines(약)를 받아서 '기분을 향상시키는 약'이라는 뜻이 됨.","a":"1) 약","c":1,"k":"that = 약"},"h":"a0d7724f01"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For a long time, people have known that our feelings can affect our stomachs.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오랫동안 사람들은 우리의 감정이 위에 영향을 미칠 수 있다는 것을 알아 왔다.","opts":["사람들은 위가 감정에 영향을 준다는 것을 오래전부터 알았다.","사람들은 감정이 위에 영향을 준다는 것을 최근에야 알았다.","오랫동안 사람들은 위가 아프면 감정도 사라진다고 믿었다.","오랫동안 사람들은 감정이 위에 영향을 줄 수 있다는 것을 알아 왔다."],"r":{"a":"4) 오랫동안 사람들은 감정이 위에 영향을 줄 수 있다는 것을 알아 왔다.","ev":"1번, 3번 문장","s":[[1,"For a long time, people have known that our feelings can affect our stomachs.","오랫동안 사람들은 우리의 감정이 위(胃)에 영향을 미칠 수 있다는 것을 알아 왔다."],[3,"But now, researchers are discovering that our stomachs affect our feelings too: The many tiny bacteria in our guts can influence how we feel.","하지만 이제, 연구원들은 위가 우리의 감정에도 영향을 미친다는 것을 알아내고 있다. 즉, 우리 소화기관 내의 많은 아주 작은 박테리아는 우리가 느끼는 방식에 영향을 줄 수 있다."]],"w":"For a long time(오랫동안)이 ‘최근에야’와 다르고, our feelings can affect our stomachs는 감정 → 위 방향. 위 → 감정은 3번에서 But now로 새로 알아내고 있는 내용이라 1번 선지는 방향이 뒤바뀜.","c":4},"h":"c6585116f5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["쥐의 소화기관에서 좋은 박테리아를 없애도 쥐의 스트레스는 변하지 않았다.","발효 식품 속 작은 박테리아는 소화와 정신 건강에 도움을 준다.","발효 식품을 먹으면 나쁜 감정이 더 늘어난다.","배탈은 감정과 아무 관계가 없다."],"opts":["Removing good bacteria from the guts of mice did not change their stress.","The tiny bacteria in fermented foods help with digestion and mental health.","Eating fermented foods makes bad feelings grow.","An upset stomach has nothing to do with feelings."],"r":{"ev":"2, 5, 8, 9번 문장","s":[[2,"For example, when we’re anxious, we might have an upset stomach.","예를 들어, 우리가 불안할 때, 배탈이 날 수도 있다."],[5,"This made the mice more stressed and anxious.","이것은 쥐를 더 스트레스받고 불안하게 만들었다."],[8,"In fact, researchers also found that consuming fermented foods such as yogurt, pickles, and kimchi can reduce these anxious feelings.","사실, 연구원들은 요구르트, 피클, 그리고 김치와 같은 발효 식품을 먹는 것이 이러한 불안한 감정을 줄일 수 있다는 것도 발견했다."],[9,"The tiny bacteria in these foods help with digestion and our mental health.","이 음식들에 있는 아주 작은 박테리아가 소화와 우리의 정신 건강에 도움을 준다."]],"w":"9번 문장에 The tiny bacteria in these foods help with digestion and our mental health가 나옴. ①은 5번(스트레스가 더 심해짐), ③은 8번(감정을 줄일 수 있음), ④는 2번(감정이 배에 영향)과 어긋남.","a":"2) The tiny bacteria in fermented foods help with digestion and mental health. (발효 식품 속 작은 박테리아는 소화와 정신 건강에 도움을 준다.)","c":2},"h":"1da40ef2ff"},{"n":9,"t":"sum","q":"Researchers are (A) that the bacteria in our guts can (B) how we feel.","ko":"연구원들은 우리 소화기관 속 박테리아가 우리가 느끼는 방식에 (B) 수 있다는 것을 (A).","oko":["(A) 숨기고 있다 / (B) 영향을 줄","(A) 알아내고 있다 / (B) 멈출","(A) 잊고 있다 / (B) 멈출","(A) 숨기고 있다 / (B) 멈출","(A) 알아내고 있다 / (B) 영향을 줄"],"opts":["(A) hiding / (B) influence","(A) discovering / (B) stop","(A) forgetting / (B) stop","(A) hiding / (B) stop","(A) discovering / (B) influence"],"r":{"ev":"3번 문장","s":[[3,"But now, researchers are discovering that our stomachs affect our feelings too: The many tiny bacteria in our guts can influence how we feel.","하지만 이제, 연구원들은 위가 우리의 감정에도 영향을 미친다는 것을 알아내고 있다. 즉, 우리 소화기관 내의 많은 아주 작은 박테리아는 우리가 느끼는 방식에 영향을 줄 수 있다."]],"w":"3번 문장 researchers are discovering that ... bacteria in our guts can influence how we feel에서 (A)는 discovering(알아내다), (B)는 influence(영향을 주다). 숨기거나 멈춘다는 말은 본문에 없음.","a":"5) (A) discovering / (B) influence ((A) 알아내고 있다 / (B) 영향을 줄)","c":5},"h":"145cf5e933"},{"n":10,"t":"fill","q":"Do these [A] [B] to humans?","ko":"이 [A]이(가) 사람에게 [B]까?","bank":["findings","apply","tiny","mental","fermented","upset"],"bko":{"findings":"연구 결과들","apply":"적용되다","tiny":"아주 작은","mental":"정신의","fermented":"발효된","upset":"속상한"},"r":{"ev":"7번 문장","s":[[7,"Do these findings apply to humans?","이 연구 결과가 사람에게 적용될까?"]],"w":"7번 문장 Do these findings apply to humans?에서 [A]는 findings, [B]는 apply. these 뒤에는 복수 명사, findings 뒤에는 동사가 와야 해서 형용사들은 들어갈 수 없음.","a":"[A] findings (연구 결과들), [B] apply (적용되다)","c":null},"h":"d26009f7cb"}]},{"u":5,"id":"rg4-05-3","no":3,"ko":"과학자들도 예쁜 식물만 좋아한다고?","items":[{"n":1,"t":"tf","q":"Blue plants received the most research attention because they are very rare.","ko":"파란색 식물들은 매우 드물기 때문에 연구 관심을 가장 많이 받았다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Blue plants received the most research attention because they’re very rare.","파란색 식물들은 매우 드물기 때문에 연구 관심을 가장 많이 받았다."]],"w":"4번 문장에 Blue plants received the most research attention because they’re very rare가 나옴. 같은 내용이라 T.","c":"T"},"h":"8e579c1a66"},{"n":2,"t":"tf","q":"Ugly plants often get more attention from scientists because of their appearance.","ko":"못생긴 식물들은 겉모습 때문에 과학자들로부터 종종 더 많은 관심을 받는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Despite their importance, these plants often get less attention from scientists due to their appearance.","그것들의 중요성에도 불구하고, 이 식물들은 겉모습 때문에 과학자들로부터 종종 더 적은 관심을 받는다."]],"w":"8번 문장은 these plants often get less attention(더 적은 관심) from scientists due to their appearance임. 더 많은 관심이라고 하면 반대라서 F.","c":"F"},"h":"ae8cf7358c"},{"n":3,"t":"tf","q":"Colors influenced which plants scientists chose to research.","ko":"색은 과학자들이 어떤 식물을 연구할지 고르는 데 영향을 주었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Interestingly, when plant scientists chose what to research, colors really influenced their choice, too.","흥미롭게도, 식물 과학자들이 무엇을 연구할지 선택할 때, 색이 그들의 선택에도 정말로 영향을 미쳤다."]],"w":"2번 문장에 when plant scientists chose what to research, colors really influenced their choice가 나옴. 같은 내용이라 T.","c":"T"},"h":"c2aa5308fd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Blue plants received the most research attention because they’re very rare.)","ko":"파란색 식물들은 매우 ( ) 때문에 연구 관심을 가장 많이 받았다.","opts":["흔한","드문","큰","비싼"],"word":"rare","r":{"a":"2) 드문","ev":"4번, 7번 문장","s":[[4,"Blue plants received the most research attention because they’re very rare.","파란색 식물들은 매우 드물기 때문에 연구 관심을 가장 많이 받았다."],[7,"For instance, in Australia, milkweed is an important food source for butterflies, and the grassy mat rushes are homes for the rare sun moth.","예를 들어, 호주에서 박주가리는 나비들에게 중요한 식량원이고, 풀처럼 생긴 매트러시(골풀류)는 희귀한 태양 나방의 서식지이다."]],"w":"4번은 파란색 식물이 흔하지 않아서 오히려 관심을 가장 많이 받았다는 말. rare = 드문. 7번의 the rare sun moth(희귀한 태양 나방)도 같은 뜻. 흔한은 반대 뜻.","c":2},"h":"b7a6f01c17"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, some “ugly” plants deserve more attention for their role in nature.)","ko":"하지만, 일부 ‘못생긴’ 식물들은 자연에서의 역할 때문에 더 많은 관심을 ( ).","opts":["~을 받을 만하다","~을 피하다","~을 잃다","~을 바꾸다"],"word":"deserve","r":{"a":"1) ~을 받을 만하다","ev":"6번 문장","s":[[6,"However, some “ugly” plants deserve more attention for their role in nature.","하지만, 일부 ‘못생긴’ 식물들은 자연에서의 역할 때문에 더 많은 관심을 받을 만하다."]],"w":"6번 However 뒤에서 못생긴 식물도 자연에서 중요한 역할을 하므로 더 많은 관심을 ‘받을 자격이 있다’는 말. deserve = ~을 받을 만하다. 피하거나 잃는다는 뜻은 문장 흐름과 맞지 않음.","c":1},"h":"1de7fc16da"},{"n":6,"t":"ref","q":"What does the underlined \"those\" refer to?\nTherefore, it’s important for scientists to focus on ugly plants as well, especially those in danger due to environmental threats.","ko":"밑줄 친 those가 가리키는 것은?","sko":"그러므로, 과학자들이 특히 환경적 위협으로 인해 위험에 처한 못생긴 식물들에도 초점을 맞추는 것이 중요하다.","pron":"those","opts":["못생긴 식물들","과학자들","환경적 위협들","나비들"],"r":{"ev":"11번 문장","s":[[11,"Therefore, it’s important for scientists to focus on ugly plants as well, especially those in danger due to environmental threats.","그러므로, 과학자들이 특히 환경적 위협으로 인해 위험에 처한 못생긴 식물들에도 초점을 맞추는 것이 중요하다."]],"w":"11번 문장은 focus on ugly plants as well, especially those in danger. those는 앞의 ugly plants(못생긴 식물들) 중 위험에 처한 것들을 가리킴.","a":"1) 못생긴 식물들","c":1,"k":"those = 못생긴 식물들"},"h":"15926d536f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Scientists can truly understand how important a species is only after thorough research.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"과학자들은 철저한 연구를 한 후에야 하나의 종이 얼마나 중요한지 진정으로 이해할 수 있다.","opts":["과학자들은 연구 없이도 종의 중요성을 알 수 있다.","중요한 종은 연구를 하면 사라진다.","과학자들은 종이 얼마나 중요한지 연구하기 전에만 이해할 수 있다.","철저한 연구를 한 뒤에야 과학자들은 한 종이 얼마나 중요한지 진정으로 이해할 수 있다."],"r":{"a":"4) 철저한 연구를 한 뒤에야 과학자들은 한 종이 얼마나 중요한지 진정으로 이해할 수 있다.","ev":"9번 문장","s":[[9,"Scientists can truly understand how important a species is only after thorough research.","과학자들은 철저한 연구를 한 후에야 하나의 종(種)이 얼마나 중요한지 진정으로 이해할 수 있다."]],"w":"only after thorough research는 ‘철저한 연구를 한 뒤에야’라는 뜻이라 연구가 먼저, 이해가 나중. 연구 없이 안다거나 연구 전에만 안다는 선지는 순서가 반대이고, 사라진다는 말은 본문에 없음.","c":4},"h":"0a653f2dc6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["파란색 식물은 가장 적게 연구되었다.","호주에서 풀처럼 생긴 매트러시(골풀류)는 태양 나방의 서식지이다.","박주가리는 나비들에게 중요한 식량원이 아니다.","초록색과 갈색 식물들이 흰색, 빨간색, 분홍색 꽃들보다 더 많이 연구되었다."],"opts":["Blue plants were studied the least.","In Australia, the grassy mat rushes are homes for the sun moth.","Milkweed is not an important food source for butterflies.","Green and brown plants were studied more than white, red, and pink flowers."],"r":{"ev":"3, 4, 7번 문장","s":[[3,"White, red, and pink flowers were studied more than green and brown ones.","흰색, 빨간색, 분홍색 꽃들이 초록색과 갈색 꽃들보다 더 많이 연구되었다."],[4,"Blue plants received the most research attention because they’re very rare.","파란색 식물들은 매우 드물기 때문에 연구 관심을 가장 많이 받았다."],[7,"For instance, in Australia, milkweed is an important food source for butterflies, and the grassy mat rushes are homes for the rare sun moth.","예를 들어, 호주에서 박주가리는 나비들에게 중요한 식량원이고, 풀처럼 생긴 매트러시(골풀류)는 희귀한 태양 나방의 서식지이다."]],"w":"7번 문장에 the grassy mat rushes are homes for the rare sun moth가 나옴(보기에서는 rare를 뺌). ①은 4번(가장 많이 연구됨), ③은 7번(박주가리는 중요한 식량원), ④는 3번(흰색·빨간색·분홍색이 더 많이 연구됨)과 어긋남.","a":"2) In Australia, the grassy mat rushes are homes for the sun moth. (호주에서 풀처럼 생긴 매트러시(골풀류)는 태양 나방의 서식지이다.)","c":2},"h":"0a6148caf4"},{"n":9,"t":"sum","q":"How plants look can also (A) scientists’ (B) of studies.","ko":"식물들이 어떻게 생겼는지도 과학자들의 연구 (B)에 (A) 수 있다.","oko":["(A) 피할 / (B) 선택","(A) 영향을 줄 / (B) 가격","(A) 잊을 / (B) 가격","(A) 피할 / (B) 가격","(A) 영향을 줄 / (B) 선택"],"opts":["(A) avoid / (B) choice","(A) affect / (B) price","(A) forget / (B) price","(A) avoid / (B) price","(A) affect / (B) choice"],"r":{"ev":"5번 문장","s":[[5,"How plants look can also affect scientists’ choice of studies.","식물들이 어떻게 생겼는지도 과학자들의 연구 선택에 영향을 줄 수 있다."]],"w":"5번 문장 How plants look can also affect scientists’ choice of studies에서 (A)는 affect(영향을 주다), (B)는 choice(선택). 피하거나 잊는다는 말, 가격이라는 말은 본문에 없음.","a":"5) (A) affect / (B) choice ((A) 영향을 줄 / (B) 선택)","c":5},"h":"ed93d5db41"},{"n":10,"t":"fill","q":"Losing even one [A] species could mean the [B] of an environmentally important plant.","ko":"[A] 종 하나라도 잃는 것은 환경적으로 중요한 식물의 [B]을(를) 의미할 수 있다.","bank":["unnoticed","loss","especially","truly","only","also"],"bko":{"unnoticed":"눈에 띄지 않는","loss":"손실, 잃음","especially":"특히","truly":"진정으로","only":"오직","also":"또한"},"r":{"ev":"10번 문장","s":[[10,"Losing even one unnoticed species could mean the loss of an environmentally important plant.","눈에 띄지 않는 종 하나라도 잃는 것은 환경적으로 중요한 식물을 잃는다는 것을 의미할 수 있다."]],"w":"10번 문장 Losing even one unnoticed species could mean the loss of an environmentally important plant에서 [A]는 unnoticed, [B]는 loss. 부사들은 one 뒤 형용사 자리와 the 뒤 명사 자리에 들어갈 수 없음.","a":"[A] unnoticed (눈에 띄지 않는), [B] loss (손실, 잃음)","c":null},"h":"1c34fb241c"}]},{"u":6,"id":"rg4-06-1","no":1,"ko":"가장 달콤한 도시와 중력이 사라지는 도시","items":[{"n":1,"t":"tf","q":"The best slogans tell a story in a few powerful words.","ko":"최고의 슬로건은 몇 개의 강력한 단어로 이야기를 들려준다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The best slogans tell a story in a few powerful words.","최고의 슬로건은 몇 개의 강력한 단어로 이야기를 들려준다."]],"w":"2번 문장에 The best slogans tell a story in a few powerful words가 그대로 나옴. T.","c":"T"},"h":"e5fe514c00"},{"n":2,"t":"tf","q":"All city slogans are created by the city to attract tourists.","ko":"모든 도시 슬로건은 관광객을 끌어모으기 위해 시에 의해 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Some slogans are created by the city to attract tourists, while others are created by residents who noticed something interesting about the city life.","일부 슬로건은 관광객을 끌어모으기 위해 시(市)에 의해 만들어지는 반면, 다른 슬로건은 도시 생활에 대해 흥미로운 점을 알아차린 주민들에 의해 만들어진다."]],"w":"3번에서 일부 슬로건은 시가 관광객을 끌려고 만들지만(Some), 다른 슬로건(others)은 흥미로운 점을 알아차린 주민들이 만든다고 함. ‘모든’ 슬로건이 아니라서 F.","c":"F"},"h":"fa286e8f52"},{"n":3,"t":"tf","q":"“Down to earth” actually means being practical.","ko":"‘Down to earth’는 실제로는 현실적인 것을 의미한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"They played on the words “down to earth,” which actually means being practical, and the word “gravity.”","그들은 실제로는 현실적인 것을 의미하는 ‘down to earth’라는 말과 ‘gravity’라는 단어에 말장난을 쳤다."]],"w":"11번 문장에 down to earth, which actually means being practical이 나옴. 같은 내용이라 T.","c":"T"},"h":"1195cba953"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... others are created by residents who noticed something interesting about the city life.)","ko":"... 다른 슬로건은 도시 생활에 대해 흥미로운 점을 알아차린 ( )에 의해 만들어진다.","opts":["관광객들","주민들","시장들","학생들"],"word":"residents","r":{"a":"2) 주민들","ev":"3~4번 문장","s":[[3,"Some slogans are created by the city to attract tourists, while others are created by residents who noticed something interesting about the city life.","일부 슬로건은 관광객을 끌어모으기 위해 시(市)에 의해 만들어지는 반면, 다른 슬로건은 도시 생활에 대해 흥미로운 점을 알아차린 주민들에 의해 만들어진다."],[4,"What residents call the city can sometimes tell more about it.","주민들이 도시를 어떻게 부르는지는 때때로 그것에 대해 더 많은 것을 알려 줄 수 있다."]],"w":"3번에서 residents는 시(the city)와 짝을 이루는, 도시 생활을 직접 아는 사람들. 4번에서도 주민들이 도시를 부르는 이름을 말함. residents = 주민들. 관광객은 슬로건으로 끌어오는 대상이라 다름.","c":2},"h":"34273c1b62"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Some cities have used humor to celebrate their unique features and attractions.)","ko":"어떤 도시들은 독특한 특징과 명소를 ( ) 위해 유머를 사용해 왔다.","opts":["기념하다","숨기다","바꾸다","비교하다"],"word":"celebrate","r":{"a":"1) 기념하다","ev":"5번 문장","s":[[5,"Some cities have used humor to celebrate their unique features and attractions.","어떤 도시들은 독특한 특징과 명소를 기념하기 위해 유머를 사용해 왔다."]],"w":"5번은 도시가 자기만의 독특한 특징과 명소를 유머로 자랑스럽게 드러낸다는 말. celebrate = 기념하다, 축하하다. 숨기거나 바꾸면 특징을 알리려는 슬로건의 목적과 맞지 않음.","c":1},"h":"de8466ab90"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nCities use slogans to tell others about who they are.","ko":"밑줄 친 they가 가리키는 것은?","sko":"도시들은 다른 사람들에게 자신이 누구인지를 알리기 위해 슬로건을 사용한다.","pron":"they","opts":["도시들","슬로건들","다른 사람들","관광객들"],"r":{"ev":"1번 문장","s":[[1,"Cities use slogans to tell others about who they are.","도시들은 다른 사람들에게 자신이 누구인지를 알리기 위해 슬로건을 사용한다."]],"w":"1번 문장은 Cities use slogans to tell others about who they are. 자신이 누구인지를 알리려는 쪽은 슬로건을 쓰는 주체인 Cities이므로 they는 도시들.","a":"1) 도시들","c":1,"k":"they = 도시들"},"h":"f2b4196a7f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"People in Gravity, Iowa use the slogan “We’re Down to Earth. If Gravity Goes, We All Go.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아이오와주에 있는 그래비티의 사람들은 “우리는 현실적이다(또는 지구에 내디뎠다). 그래비티(또는 중력)가 사라지면 우리 모두 사라진다.”라는 슬로건을 사용한다.","opts":["그래비티의 사람들은 ‘우리는 현실적이다. 그래비티(중력)가 사라지면 우리 모두 사라진다.’라는 슬로건을 사용한다.","그래비티의 사람들은 중력이 사라질 때를 대비하라는 슬로건을 사용한다.","그래비티의 사람들은 땅 아래에서 살자는 슬로건을 사용한다.","그래비티의 사람들은 ‘다 함께 떠나자’는 슬로건으로 관광객을 끌어모은다."],"r":{"ev":"10번 문장","s":[[10,"People in Gravity, Iowa use the slogan “We’re Down to Earth. If Gravity Goes, We All Go.”","아이오와주에 있는 그래비티의 사람들은 “우리는 현실적이다(또는 지구에 내디뎠다). 그래비티(또는 중력)가 사라지면 우리 모두 사라진다.”라는 슬로건을 사용한다."]],"w":"People in Gravity, Iowa use the slogan은 '아이오와주 그래비티의 사람들이 그 슬로건을 사용한다'는 뜻. Down to Earth(현실적이다)와 Gravity(마을 이름이자 중력)를 이용한 슬로건이라서 ①이 맞음.","a":"1) 그래비티의 사람들은 ‘우리는 현실적이다. 그래비티(중력)가 사라지면 우리 모두 사라진다.’라는 슬로건을 사용한다.","c":1},"h":"bc0760611b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["허쉬는 아이오와주에 있다.","허쉬의 슬로건은 ‘지구상에서 가장 달콤한 곳’이다.","그래비티는 펜실베이니아주에 있다.","모든 도시 슬로건은 관광객들이 만든다."],"opts":["Hershey is in Iowa.","The slogan of Hershey is “The Sweetest Place On Earth.”","Gravity is in Pennsylvania.","All city slogans are created by tourists."],"r":{"a":"2) The slogan of Hershey is “The Sweetest Place On Earth.”","ev":"3번, 7번, 10번 문장","s":[[3,"Some slogans are created by the city to attract tourists, while others are created by residents who noticed something interesting about the city life.","일부 슬로건은 관광객을 끌어모으기 위해 시(市)에 의해 만들어지는 반면, 다른 슬로건은 도시 생활에 대해 흥미로운 점을 알아차린 주민들에 의해 만들어진다."],[7,"The slogan of Hershey, Pennsylvania is “The Sweetest Place On Earth.”","펜실베이니아주에 있는 허쉬의 슬로건은 “지구상에서 가장 달콤한 곳”이다."],[10,"People in Gravity, Iowa use the slogan “We’re Down to Earth. If Gravity Goes, We All Go.”","아이오와주에 있는 그래비티의 사람들은 “우리는 현실적이다(또는 지구에 내디뎠다). 그래비티(또는 중력)가 사라지면 우리 모두 사라진다.”라는 슬로건을 사용한다."]],"w":"7번에서 허쉬의 슬로건은 ‘The Sweetest Place On Earth’. 허쉬는 펜실베이니아주(7번), 그래비티는 아이오와주(10번), 슬로건은 시나 주민이 만든다(3번)라서 나머지는 모두 본문과 다름.","c":2},"h":"b15192a910"},{"n":9,"t":"sum","q":"These city slogans show the unique (A) and (B) of the people who live there.","ko":"이러한 도시 슬로건들은 그곳에 사는 사람들의 독특한 (A)과(와) (B)을(를) 보여 준다.","oko":["(A) 가격 / (B) 창의성","(A) 정체성 / (B) 게으름","(A) 도로 / (B) 게으름","(A) 가격 / (B) 두려움","(A) 정체성 / (B) 창의성"],"opts":["(A) prices / (B) creativity","(A) identities / (B) laziness","(A) roads / (B) laziness","(A) prices / (B) fear","(A) identities / (B) creativity"],"r":{"ev":"12번 문장","s":[[12,"These city slogans show the unique identities and creativity of the people who live there.","이러한 도시 슬로건들은 그곳에 사는 사람들의 독특한 정체성과 창의성을 보여 준다."]],"w":"12번 문장 These city slogans show the unique identities and creativity of the people who live there에서 (A)는 identities(정체성), (B)는 creativity(창의성). 가격, 도로, 게으름, 두려움을 보여 준다는 말은 본문에 없음.","a":"5) (A) identities / (B) creativity ((A) 정체성 / (B) 창의성)","c":5},"h":"c221231068"},{"n":10,"t":"fill","q":"Hershey is home to the Hershey chocolate [A] and the whole town [B] like chocolate!","ko":"허쉬는 허쉬 초콜릿 [A]의 본거지이고 마을 전체에 초콜릿처럼 [B]!","bank":["factory","smells","sweetest","powerful","practical","unique"],"bko":{"factory":"공장","smells":"냄새가 나다(smell의 3인칭 단수)","sweetest":"가장 달콤한","powerful":"강력한 은다","ev":"2번 문장","s":[[2,"It gathers about 3,000 pairs of twins from around the world.","그것은 전 세계에서 약 3,000쌍의 쌍둥이들을 모은다."]],"w":"2번은 전 세계에서 약 3,000쌍의 쌍둥이가 Twins Days로 온다는 말이라 gathers = 모은다. 4번에서 36쌍이 3,000쌍으로 성장했다는 흐름과도 이어짐. 나누거나 숨긴다는 뜻이 아님.","c":3},"h":"8bf3e55c88"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (During the festival, twins dress the same and participate in various activities.)","ko":"축제 동안, 쌍둥이들은 똑같이 옷을 입고 다양한 활동에 ( ).","opts":["참여하다","구경하다","거절하다","끝내다"],"word":"participate","r":{"a":"1) 참여하다","ev":"5~6번, 9번 문장","s":[[5,"During the festival, twins dress the same and participate in various activities.","축제 동안, 쌍둥이들은 똑같이 옷을 입고 다양한 활동에 참여한다."],[6,"They join contests, parades, talent shows, and group photos.","그들은 대회, 퍼레이드, 장기 자랑, 그리고 단체 사진에 참여한다."],[9,"Although they may line up for a long time to participate, twins enjoy the rewards and the chance to contribute to scientific research.","그들은 참여하기 위해 오랫동안 줄을 설 수도 있지만, 쌍둥이들은 보상과 과학 연구에 기여하는 기회를 즐긴다."]],"w":"5번에서 쌍둥이들이 다양한 활동에 참여하고, 6번에서 대회, 퍼레이드 등에 join한다고 설명함. 9번의 to participate도 같은 뜻. participate = 참여하다. 구경하거나 거절한다면 활동을 한다는 말과 맞지 않음.","c":1},"h":"e4fc59ec1d"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nIn a large tent, twins volunteer for studies that help scientists learn about topics such as genetics and aging.","ko":"밑줄 친 that이 가리키는 것은?","sko":"커다란 텐트에서, 쌍둥이들은 유전학과 노화와 같은 주제에 관해 과학자들이 배울 수 있도록 도와주는 연구에 자원한다.","pron":"that","opts":["연구들","쌍둥이들","과학자들","커다란 텐트"],"r":{"ev":"8번 문장","s":[[8,"In a large tent, twins volunteer for studies that help scientists learn about topics such as genetics and aging.","커다란 텐트에서, 쌍둥이들은 유전학과 노화와 같은 주제에 관해 과학자들이 배울 수 있도록 도와주는 연구에 자원한다."]],"w":"8번 문장은 twins volunteer for studies that help scientists learn ~. 관계대명사 that은 바로 앞 명사 studies(연구들)를 받아서 '과학자들이 배우도록 돕는 연구들'이라는 뜻이 됨.","a":"1) 연구들","c":1,"k":"that = 연구들"},"h":"41159cd640"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But there’s more to Twins Days  with just 36 pairs of twins and has (B) fast since then.","ko":"그 축제는 1976년에 단 36쌍의 쌍둥이로 (A), 그 이후로 빠르게 (B).","oko":["(A) 끝났고 / (B) 성장해 왔다","(A) 시작했고 / (B) 줄어들었다","(A) 멈췄고 / (B) 잠들어 있다","(A) 끝났고 / (B) 줄어들었다","(A) 시작했고 / (B) 성장해 왔다"],"opts":["(A) ended / (B) grown","(A) began / (B) shrunk","(A) stopped / (B) slept","(A) ended / (B) shrunk","(A) began / (B) grown"],"r":{"ev":"4번 문장","s":[[4,"The festival began in 1976 with just 36 pairs of twins and has grown fast since then.","그 축제는 1976년에 단 36쌍의 쌍둥이로 시작하여 그 이후로 빠르게 성장해 왔다."]],"w":"4번 문장 The festival began in 1976 with just 36 pairs of twins and has grown fast since then에서 (A)는 began(시작했다), (B)는 grown(grow의 과거분사, 성장했다). 끝났거나 줄어들었다는 말은 본문과 반대임.","a":"5) (A) began / (B) grown ((A) 시작했고 / (B) 성장해 왔다)","c":5},"h":"8f1d39adcc"},{"n":10,"t":"fill","q":"They may get a year’s worth of [A] in just four [B]!","ko":"그들은 단 4[B] 만에 1년 치의 [A]을(를) 얻을 수도 있다!","bank":["information","hours","valuable","efficient","rare","fast"],"bko":{"information":"정보","hours":"시간","valuable":"귀중한","efficient":"효율적인","rare":"희귀한","fast":"빠르게"},"r":{"ev":"11번 문장","s":[[11,"They may get a year’s worth of information in just four hours!","그들은 단 4시간 만에 1년 치의 정보를 얻을 수도 있다!"]],"w":"11번 문장 a year’s worth of information in just four hours에서 [A]는 information, [B]는 hours. of 뒤와 four 뒤에는 명사가 와야 해서 형용사와 부사는 들어갈 수 없음.","a":"[A] information (정보), [B] hours (시간)","c":null},"h":"3e2de20763"}]},{"u":6,"id":"rg4-06-3","no":3,"ko":"붕대 없이 발견된 2,500년 된 악어 미라","items":[{"n":1,"t":"tf","q":"The crocodile mummies might be over 2,500 years old.","ko":"그 악어 미라들은 2,500년 이상 되었을지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They might be over 2,500 years old but were in great shape.","그것들은 2,500년 이상 되었을지도 모르지만 상태가 아주 좋았다."]],"w":"2번 문장에 They might be over 2,500 years old가 나옴. 같은 내용이라 T.","c":"T"},"h":"2e91f04b97"},{"n":2,"t":"tf","q":"Like most mummies, the crocodile mummies were wrapped in bandages.","ko":"대부분의 미라처럼, 그 악어 미라들도 붕대로 싸여 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Most mummies are wrapped in bandages, but these crocodiles weren’t.","대부분의 미라는 붕대로 싸여 있지만, 이 악어들은 그렇지 않았다."]],"w":"3번에서 대부분의 미라는 붕대로 싸여 있지만 these crocodiles weren’t(이 악어들은 그렇지 않았다)라고 함. 다른 점이 핵심이라 F.","c":"F"},"h":"2fd35adad5"},{"n":3,"t":"tf","q":"Ancient Egyptians asked Sobek to give good soil for their crops.","ko":"고대 이집트인들은 Sobek에게 농작물을 위한 좋은 토양을 달라고 요청했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Ancient Egyptians asked Sobek to give good soil for their crops and to keep them safe from dangerous reptiles.","고대 이집트인들은 Sobek에게 농작물을 위한 좋은 토양을 제공해 주고 위험한 파충류로부터 그들을 안전하게 보호해 주기를 요청했다."]],"w":"8번 문장에 Ancient Egyptians asked Sobek to give good soil for their crops가 나옴. 같은 내용이라 T.","c":"T"},"h":"cfb1858588"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Experts recently discovered ten crocodile mummies near the Nile River in Egypt.)","ko":"전문가들이 최근에 이집트 나일강 근처에서 악어 미라 열 구를 ( ).","opts":["잃어버렸다","발견했다","만들었다","팔았다"],"word":"discovered","r":{"a":"2) 발견했다","ev":"1번, 11번 문장","s":[[1,"Experts recently discovered ten crocodile mummies near the Nile River in Egypt.","전문가들이 최근에 이집트 나일강 근처에서 악어 미라 열 구를 발견했다."],[11,"This discovery gives us a new understanding of the ancient Egyptian religion and how these animals were used as offerings.","이 발견은 우리에게 고대 이집트의 종교와 이 동물들이 제물로 어떻게 사용되었는지에 대한 새로운 이해를 준다."]],"w":"1번에서 전문가들이 악어 미라를 찾아냈다는 말이고, 11번에서도 This discovery(이 발견)로 이어짐. discovered = 발견했다. 잃어버리거나 만든 것이 아니라 이미 있던 것을 찾아낸 것.","c":2},"h":"0bd0f49d3c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... or he might not answer their requests.)","ko":"... 그렇지 않으면 그가 그들의 ( )을 들어주지 않을지도 모른다.","opts":["명령","대답","요청","약속"],"word":"requests","r":{"a":"3) 요청","ev":"8~9번 문장","s":[[8,"Ancient Egyptians asked Sobek to give good soil for their crops and to keep them safe from dangerous reptiles.","고대 이집트인들은 Sobek에게 농작물을 위한 좋은 토양을 제공해 주고 위험한 파충류로부터 그들을 안전하게 보호해 주기를 요청했다."],[9,"They believed they had to give him something, or he might not answer their requests.","그들은 자신들이 그에게 무언가를 바쳐야 하며, 그렇지 않으면 그가 그들의 요청을 들어주지 않을지도 모른다고 믿었다."]],"w":"8번에서 이집트인들이 Sobek에게 좋은 토양과 안전을 asked(부탁했다)고 하고, 9번의 requests는 그 부탁들. requests = 요청. 신이 이집트인에게 내리는 명령이 아니라 이집트인이 신에게 하는 것.","c":3},"h":"6fe57eddb9"},{"n":6,"t":"ref","q":"What does the underlined \"a powerful god\" refer to?\nThese crocodiles could have been special offerings to Sobek, the creator of the Nile and a powerful god.","ko":"밑줄 친 a powerful god이 가리키는 것은?","sko":"이 악어들은 나일강의 창조자이자 강력한 신인 Sobek에게 바치는 특별한 제물이었을 수도 있다.","pron":"a powerful god","opts":["Sobek","나일강","고대 이집트인들","연구원들"],"r":{"ev":"6번 문장","s":[[6,"These crocodiles could have been special offerings to Sobek, the creator of the Nile and a powerful god.","이 악어들은 나일강의 창조자이자 강력한 신인 Sobek에게 바치는 특별한 제물이었을 수도 있다."]],"w":"6번 문장은 Sobek, the creator of the Nile and a powerful god. 쉼표로 이어진 the creator of the Nile and a powerful god은 모두 바로 앞의 Sobek을 설명하는 말임.","a":"1) Sobek","c":1,"k":"a powerful god = Sobek"},"h":"59518677be"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This allowed the researchers to study them right away without using special technology.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 연구원들이 특별한 기술을 사용하지 않고 바로 그것들을 연구할 수 있게 했다.","opts":["이것은 연구원들이 특별한 기술을 쓰지 않고도 바로 그것들을 연구할 수 있게 해 주었다.","이것은 연구원들이 특별한 기술을 써야만 그것들을 연구할 수 있게 했다.","이것은 연구원들이 그것들을 연구하는 것을 막았다.","이것은 연구원들이 그것들을 신에게 바치도록 만들었다."],"r":{"ev":"4번 문장","s":[[4,"This allowed the researchers to study them right away without using special technology.","이것은 연구원들이 특별한 기술을 사용하지 않고 바로 그것들을 연구할 수 있게 했다."]],"w":"allowed the researchers to study them right away는 '연구원들이 바로 그것들을 연구할 수 있게 해 주었다', without using special technology는 '특별한 기술을 쓰지 않고'라는 뜻. 기술이 필요했다거나 막았다는 말은 본문과 반대임.","a":"1) 이것은 연구원들이 특별한 기술을 쓰지 않고도 바로 그것들을 연구할 수 있게 해 주었다.","c":1},"h":"1616325bca"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["악어 미라들은 붕대로 단단히 싸여 있었다.","Sobek은 종종 악어 머리를 가진 모습으로 보였다.","고대 이집트에서 동물 미라를 만드는 것은 드문 일이었다.","이집트에서 발견된 악어 미라는 100구였다."],"opts":["The crocodile mummies were tightly wrapped in bandages.","Sobek was often shown with a crocodile head.","Making animal mummies was rare in ancient Egypt.","One hundred crocodile mummies were found in Egypt."],"r":{"a":"2) Sobek was often shown with a crocodile head.","ev":"1번, 3번, 5번, 7번 문장","s":[[1,"Experts recently discovered ten crocodile mummies near the Nile River in Egypt.","전문가들이 최근에 이집트 나일강 근처에서 악어 미라 열 구를 발견했다."],[3,"Most mummies are wrapped in bandages, but these crocodiles weren’t.","대부분의 미라는 붕대로 싸여 있지만, 이 악어들은 그렇지 않았다."],[5,"In ancient Egypt, it was common to make animal mummies as offerings for the gods.","고대 이집트에서는, 신들에게 바치는 제물로서 동물 미라를 만드는 것이 흔했다."],[7,"Sobek was often shown with a crocodile head.","Sobek은 악어 머리를 가진 모습으로 종종 보였다."]],"w":"7번에서 Sobek은 악어 머리를 가진 모습으로 종종 보였다고 함. 악어 미라는 붕대가 없었고(3번), 동물 미라를 만드는 것은 흔했고(5번), 발견된 것은 열 구(1번)라서 나머지는 모두 본문과 다름.","c":2},"h":"6fcbf4d8f7"},{"n":9,"t":"sum","q":"So, these crocodile mummies might have been their (A) of asking for (B) from the gods.","ko":"그래서, 이 악어 미라들은 신들에게서 (B)을(를) 구하는 그들의 (A)이었을지도 모른다.","oko":["(A) 두려움 / (B) 도움","(A) 방식 / (B) 돈","(A) 비용 / (B) 돈","(A) 두려움 / (B) 장난감","(A) 방식 / (B) 도움"],"opts":["(A) fear / (B) help","(A) way / (B) money","(A) cost / (B) money","(A) fear / (B) toys","(A) way / (B) help"],"r":{"ev":"10번 문장","s":[[10,"So, these crocodile mummies might have been their way of asking for help from the gods.","그래서, 이 악어 미라들은 신들로부터 도움을 요청하는 그들의 방식이었을지도 모른다."]],"w":"10번 문장 these crocodile mummies might have been their way of asking for help from the gods에서 (A)는 way(방식), (B)는 help(도움). 두려움이나 비용, 돈이나 장난감을 구했다는 말은 본문에 없음.","a":"5) (A) way / (B) help ((A) 방식 / (B) 도움)","c":5},"h":"3b52ee0e96"},{"n":10,"t":"fill","q":"In ancient Egypt, it was [A] to [B] animal mummies as offerings for the gods.","ko":"고대 이집트에서는, 신들에게 바치는 제물로서 동물 미라를 [B]은(는) 것이 [A].","bank":["common","make","bandages","reptiles","technology","soil"],"bko":{"common":"흔한","make":"만들다","bandages":"붕대","reptiles":"파충류","technology":"기술","soil":"토양"},"r":{"ev":"5번 문장","s":[[5,"In ancient Egypt, it was common to make animal mummies as offerings for the gods.","고대 이집트에서는, 신들에게 바치는 제물로서 동물 미라를 만드는 것이 흔했다."]],"w":"5번 문장 In ancient Egypt, it was common to make animal mummies as offerings for the gods에서 [A]는 common, [B]는 make. it was 뒤에는 형용사, to 뒤에는 동사 원형이 와야 해서 명사들은 들어갈 수 없음.","a":"[A] common (흔한), [B] make (만들다)","c":null},"h":"6e43329141"}]},{"u":7,"id":"rg4-07-1","no":1,"ko":"물 한 컵으로 산호를 지킨다고?","items":[{"n":1,"t":"tf","q":"Scientists collect water or soil near coral reefs without harming the corals.","ko":"과학자들은 산호를 해치지 않으면서 산호초 근처의 물이나 토양을 수집한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They collect water or soil near the reefs to learn about the sea life there, without harming the corals.","그들은 산호를 손상시키지 않으면서, 산호초 근처의 해양 생물에 대해 알아내기 위해 그곳의 물이나 토양을 수집한다."]],"w":"6번 문장에 collect water or soil near the reefs ... without harming the corals가 그대로 나옴. 산호를 해치지 않고 모은다는 내용과 일치.","c":"T"},"h":"eec379e5dc"},{"n":2,"t":"tf","q":"Many coral reefs around the world are growing because the water is getting warmer.","ko":"바닷물이 더 따뜻해지고 있어서 전 세계의 많은 산호초가 자라고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"Coral is extremely sensitive to water temperature, but the water is getting warmer.","산호는 수온에 극도로 민감하지만, 바닷물은 점점 더 따뜻해지고 있다."],[3,"So, many of them around the world are dying.","그래서 전 세계의 많은 산호초가 죽어가고 있다."]],"w":"2번에서 산호는 수온에 극도로 민감한데 바닷물이 더 따뜻해진다고 하고, 3번에서 그래서 산호초가 죽어 가고 있다고 함. 자라는 게 아니라 죽어 가는 것이라 반대.","c":"F"},"h":"e902149642"},{"n":3,"t":"tf","q":"The DNA library will help scientists know where coral species live.","ko":"DNA 도서관은 과학자들이 산호 종이 어디에 사는지 알도록 도울 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"It will let the scientists know where various coral species live and which species are most threatened.","그것은 과학자들이 다양한 산호 종이 어디에 사는지와 어떤 종이 가장 위협받는지를 알 수 있게 해 줄 것이다."]],"w":"11번 문장에서 DNA 도서관이 과학자들에게 다양한 산호 종이 어디에 사는지 알게 해 줄 것이라고 함. 본문과 일치.","c":"T"},"h":"c7349c2e98"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Coral is extremely sensitive to water temperature, but the water is getting warmer.)","ko":"(산호는 수온에 극도로 ( )하지만, 바닷물은 점점 더 따뜻해지고 있다.)","opts":["둔감한","민감한","튼튼한","건강한"],"word":"sensitive","r":{"a":"2) 민감한","ev":"2번 문장","s":[[2,"Coral is extremely sensitive to water temperature, but the water is getting warmer.","산호는 수온에 극도로 민감하지만, 바닷물은 점점 더 따뜻해지고 있다."]],"w":"2번 문장에서 산호는 수온에 sensitive한데 바닷물이 따뜻해져서 산호초가 죽어 간다고 이어짐. 수온 변화에 약하다는 뜻이니 sensitive = 민감한. 둔감한은 반대 뜻.","c":2},"h":"5bb419bedf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They’re creating a large DNA library from various coral reefs.)","ko":"(그들은 ( ) 산호초로부터 대형 DNA 도서관을 만들고 있다.)","opts":["비슷한","작은","오래된","다양한"],"word":"various","r":{"a":"4) 다양한","ev":"9번 문장","s":[[9,"They’re creating a large DNA library from various coral reefs.","그들은 다양한 산호초로부터 대형 DNA 도서관을 만들고 있다."]],"w":"9번 문장에서 여러 산호초에서 DNA를 모아 큰 도서관을 만든다고 함. various = 다양한. 11번의 various coral species도 '여러 종류의 산호 종'이라는 뜻.","c":4},"h":"af240aaa45"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWith the help of eDNA, scientists can better understand which corals are in danger and the effects of climate change on them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"eDNA의 도움으로 과학자들은 어떤 산호들이 위험에 처했는지와 기후 변화가 그것들에 미치는 영향을 더 잘 이해할 수 있다.","opts":["위험에 처한 산호들","과학자들","기후 변화","eDNA 방법"],"r":{"a":"1) 위험에 처한 산호들","ev":"8번 문장","s":[[8,"With the help of eDNA, scientists can better understand which corals are in danger and the effects of climate change on them.","eDNA의 도움으로 과학자들은 어떤 산호들이 위험에 처했는지와 기후 변화가 그것들에 미치는 영향을 더 잘 이해할 수 있다."]],"w":"8번에서 which corals are in danger(어떤 산호들이 위험에 처했는지) 뒤의 the effects of climate change on them(기후 변화가 그것들에 미치는 영향)에서 them은 산호들. 과학자들이나 방법이 아님.","c":1},"h":"b874b98a1f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This means they can fix damaged reefs and protect the many types of life depending on them.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그들이 손상된 산호초를 복구할 수 있고 그것들에 의존하는 많은 종류의 생물을 보호할 수 있다는 것을 의미한다.","opts":["이것은 산호초가 스스로 고쳐지고 과학자들을 보호할 수 있다는 뜻이다.","이것은 과학자들이 산호초를 떠나 다른 생물에게 의존할 수 있다는 뜻이다.","이것은 손상된 산호초가 모두 저절로 살아난다는 뜻이다.","이것은 과학자들이 손상된 산호초를 복구하고 산호초에 의존하는 많은 생물을 보호할 수 있다는 뜻이다."],"r":{"a":"4) 이것은 과학자들이 손상된 산호초를 복구하고 산호초에 의존하는 많은 생물을 보호할 수 있다는 뜻이다.","ev":"12번 문장","s":[[12,"This means they can fix damaged reefs and protect the many types of life depending on them.","이것은 그들이 손상된 산호초를 복구할 수 있고 그것들에 의존하는 많은 종류의 생물을 보호할 수 있다는 것을 의미한다."]],"w":"12번의 they는 과학자들. can fix(fix: 고치다) damaged reefs(손상된 산호초), protect(protect: 보호하다) life depending on them(산호초에 의존하는 생물). 산호초가 과학자를 보호한다는 말은 없음.","c":4},"h":"f94eabb1ab"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["과학자들은 산호가 살아 있도록 도와줄 새로운 기술을 발견했다.","과학자들은 바닷물을 더 차갑게 만드는 방법을 발견했다.","과학자들은 산호를 돕는 것을 포기했다.","과학자들은 산호 위에 사는 새로운 동물들을 발견했다."],"opts":["Scientists have discovered new techniques to help keep corals alive.","Scientists have discovered a way to make the water colder.","Scientists have given up on helping corals.","Scientists have discovered new animals living on corals."],"r":{"ev":"4번 문장","s":[[4,"Fortunately, scientists have discovered new techniques to help keep corals alive.","다행스럽게도, 과학자들은 산호가 살아 있도록 도와줄 새로운 기술을 발견했다."]],"w":"4번 문장에 scientists have discovered new techniques to help keep corals alive가 나옴. 산호를 살아 있게 돕는 새로운 기술을 발견했다는 ①이 맞음.","a":"1) Scientists have discovered new techniques to help keep corals alive. (과학자들은 산호가 살아 있도록 도와줄 새로운 기술을 발견했다.)","c":1},"h":"29139d8c94"},{"n":9,"t":"sum","q":"Coral reefs are (A) because of climate change, and they are home to many sea (B).","ko":"산호초는 기후 변화 때문에 (A), 많은 바다 (B)의 서식지이다.","oko":["(A) 번성하고 있고 / (B) 가게들","(A) 고군분투하고 있고 / (B) 도로들","(A) 번성하고 있고 / (B) 생물들","(A) 춤추고 있고 / (B) 생물들","(A) 고군분투하고 있고 / (B) 생물들"],"opts":["(A) growing / (B) shops","(A) struggling / (B) roads","(A) growing / (B) creatures","(A) dancing / (B) creatures","(A) struggling / (B) creatures"],"r":{"ev":"1번 문장","s":[[1,"Coral reefs, home to many sea creatures, are struggling because of climate change.","많은 바다 생물들의 서식지인 산호초는 기후 변화 때문에 고군분투하고 있다."]],"w":"1번 문장 Coral reefs, home to many sea creatures, are struggling because of climate change에서 (A)는 struggling(고군분투하다), (B)는 creatures(생물들). 번성하거나 춤춘다는 말, 가게나 도로가 산다는 말은 말이 안 됨.","a":"5) (A) struggling / (B) creatures ((A) 고군분투하고 있고 / (B) 생물들)","c":5},"h":"8ba4cab953"},{"n":10,"t":"fill","q":"They’re trying a new [A] using [B] DNA (eDNA).","ko":"그들은 [B] DNA(eDNA)를 사용하는 새로운 [A]을(를) 시도하고 있다.","bank":["method","environmental","collect","protect","monitor","understand"],"bko":{"method":"방법","environmental":"환경의","collect":"수집하다","protect":"보호하다","monitor":"추적 관찰하다","understand":"이해하다"},"r":{"ev":"5번 문장","s":[[5,"They’re trying a new method using environmental DNA (eDNA).","그들은 환경 DNA(eDNA)를 사용하는 새로운 방법을 시도하고 있다."]],"w":"5번 문장 They’re trying a new method using environmental DNA (eDNA)에서 [A]는 method, [B]는 environmental. 나머지는 동사 원형이라서 a new 뒤 명사 자리와 DNA 앞 형용사 자리에 들어갈 수 없음.","a":"[A] method (방법), [B] environmental (환경의)","c":null},"h":"ab9a0cdb76"}]},{"u":7,"id":"rg4-07-2","no":2,"ko":"귀여운 얼굴 뒤에 독을 숨긴 동물","items":[{"n":1,"t":"tf","q":"Slow lorises make their poison by licking glands on their arms.","ko":"늘보로리스는 팔에 있는 분비샘을 핥아서 독을 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Strangely, to produce the poison, they raise their arms above their head and quickly lick poisonous oil-producing glands on their arms.","이상하게도, 그들은 독을 만들기 위해 머리 위로 팔을 올려서 팔에 있는 독성 기름을 만드는 분비샘을 재빨리 핥는다."]],"w":"3번 문장에서 팔을 올려 poisonous oil-producing glands on their arms(팔에 있는 독성 기름 분비샘)를 핥는다고 함. 본문과 일치.","c":"T"},"h":"0a6c63c426"},{"n":2,"t":"tf","q":"Female slow lorises were bitten more often than males.","ko":"암컷 늘보로리스가 수컷보다 더 자주 물렸다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Males suffered more frequent bites than females.","수컷들이 암컷들보다 더 자주 물리는 일을 겪었다."]],"w":"8번 문장에서 수컷(Males)이 암컷보다 더 자주 물렸다고 함. 암컷과 수컷이 뒤바뀐 선지라 본문과 반대.","c":"F"},"h":"553137f6fd"},{"n":3,"t":"tf","q":"About 20% of the slow lorises in the study had new bite wounds.","ko":"연구 대상 늘보로리스 중 약 20%가 새로 생긴 물린 상처가 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"They noticed that 20% of them had new bite wounds, sometimes very serious.","그들은 늘보로리스의 20%가 새로 생긴 물린 상처가 있고, 그 상처가 때로는 매우 심각하다는 것을 알게 되었다."]],"w":"7번 문장에 20% of them had new bite wounds가 나옴. 숫자까지 본문과 일치.","c":"T"},"h":"a39511194f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Males suffered more frequent bites than females.)","ko":"(수컷들이 암컷들보다 ( ) 물리는 일을 겪었다.)","opts":["드문","빈번한","작은","심각한"],"word":"frequent","r":{"a":"2) 빈번한","ev":"8번 문장","s":[[8,"Males suffered more frequent bites than females.","수컷들이 암컷들보다 더 자주 물리는 일을 겪었다."]],"w":"8번 문장에서 수컷이 암컷보다 more frequent bites를 겪었다고 함. 더 자주 물렸다는 뜻이니 frequent = 빈번한. 드문은 반대 뜻.","c":2},"h":"5dc5dcc56e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…use their poison to fight over things like mates or territory.)","ko":"(…짝이나 ( ) 같은 것을 두고 싸우기 위해 독을 사용한다.)","opts":["음식","짝","영역","나이"],"word":"territory","r":{"a":"3) 영역","ev":"9번 문장","s":[[9,"These bite wounds showed that slow lorises are very protective of their own area and use their poison to fight over things like mates or territory.","이러한 물린 상처는 늘보로리스가 자기 영역에 대해 매우 방어적이며 짝이나 영역 같은 것을 두고 싸우기 위해 독을 사용한다는 것을 보여 주었다."]],"w":"9번 문장에서 mates(짝) or territory를 두고 싸운다고 함. 자기 영역을 지킨다는 앞부분(their own area)과 이어져서 territory = 영역.","c":3},"h":"6cc1eaaa0c"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThey found something surprising: these animals often use their poison on each other, which is unusual.","ko":"밑줄 친 which이 가리키는 것은?","sko":"그들은 놀라운 것을 발견했는데, 이 동물들은 종종 서로에게 독을 사용하며, 이는 흔치 않은 일이다.","opts":["늘보로리스가 귀여운 것","동물들이 서로에게 독을 사용하는 것","연구원들이 놀란 것","독이 이빨로 들어가는 것"],"r":{"a":"2) 동물들이 서로에게 독을 사용하는 것","ev":"6번 문장","s":[[6,"They found something surprising: these animals often use their poison on each other, which is unusual.","그들은 놀라운 것을 발견했는데, 이 동물들은 종종 서로에게 독을 사용하며, 이는 흔치 않은 일이다."]],"w":"which 앞에 these animals often use their poison on each other(동물들이 서로에게 독을 사용한다)가 있고, 그 일이 unusual(흔치 않은)하다는 뜻. which는 앞 내용 전체를 가리킴.","c":2},"h":"c5e7bb4306"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This study is important because it’s rare to see animals use poison against their own species.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 연구는 동물이 자신의 종을 향해 독을 사용하는 것을 보는 일이 드물기 때문에 중요하다.","opts":["이 연구는 늘보로리스의 독이 너무 약해서 중요하다.","이 연구는 동물들이 독을 쓰는 일이 아주 흔해서 중요하다.","이 연구는 늘보로리스가 같은 종을 보호해서 중요하다.","이 연구는 동물이 같은 종에게 독을 쓰는 일이 드물기 때문에 중요하다."],"r":{"a":"4) 이 연구는 동물이 같은 종에게 독을 쓰는 일이 드물기 때문에 중요하다.","ev":"10번 문장","s":[[10,"This study is important because it’s rare to see animals use poison against their own species.","이 연구는 동물이 자신의 종을 향해 독을 사용하는 것을 보는 일이 드물기 때문에 중요하다."]],"w":"because it's rare(드물기 때문에) to see animals use poison against their own species(같은 종에게 독을 쓰는 것). 드물기 때문에 중요한 것이지 흔해서가 아님.","c":4},"h":"ae3ce23cba"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["연구원들은 인도네시아에서 28마리의 늘보로리스를 연구했다.","연구원들은 인도네시아에서 82마리의 늘보로리스를 연구했다.","연구원들은 아프리카에서 82마리의 늘보로리스를 연구했다.","연구원들은 인도네시아에서 82마리의 반려 고양이를 연구했다."],"opts":["Researchers studied 28 slow lorises in Indonesia.","Researchers studied 82 slow lorises in Indonesia.","Researchers studied 82 slow lorises in Africa.","Researchers studied 82 pet cats in Indonesia."],"r":{"ev":"5번 문장","s":[[5,"Researchers studied 82 slow lorises in Indonesia.","연구원들은 인도네시아에서 82마리의 늘보로리스를 연구했다."]],"w":"5번 문장에 Researchers studied 82 slow lorises in Indonesia가 나옴. 숫자(82마리), 동물(늘보로리스), 장소(인도네시아)가 모두 맞는 것은 ②임.","a":"2) Researchers studied 82 slow lorises in Indonesia. (연구원들은 인도네시아에서 82마리의 늘보로리스를 연구했다.)","c":2},"h":"19ca18c42f"},{"n":9,"t":"sum","q":"Slow lorises are (A), night-active animals from (B).","ko":"늘보로리스는 (B)에 사는 (A) 야행성 동물이다.","oko":["(A) 거대한 / (B) 아시아","(A) 작은 / (B) 아프리카","(A) 시끄러운 / (B) 유럽","(A) 거대한 / (B) 아프리카","(A) 작은 / (B) 아시아"],"opts":["(A) huge / (B) Asia","(A) small / (B) Africa","(A) loud / (B) Europe","(A) huge / (B) Africa","(A) small / (B) Asia"],"r":{"ev":"1번 문장","s":[[1,"Slow lorises are small, night-active animals from Asia.","늘보로리스는 아시아에 사는 작은 야행성 동물이다."]],"w":"1번 문장 Slow lorises are small, night-active animals from Asia에서 (A)는 small(작은), (B)는 Asia(아시아). 거대하거나 시끄럽다는 말, 아프리카나 유럽이라는 말은 본문에 없음.","a":"5) (A) small / (B) Asia ((A) 작은 / (B) 아시아)","c":5},"h":"fa75df67f3"},{"n":10,"t":"fill","q":"Animals use poison for hunting, [A] themselves, and fighting [B] a species.","ko":"동물들은 사냥, 자기를 [A]하는 것, 그리고 한 종 [B]에서 싸우는 일에 독을 쓴다.","bko":{"protecting":"보호하기","within":"~ 안에서","raise":"들어 올리다","lick":"핥다","produce":"만들다","notice":"알아차리다"},"bank":["protecting","within","raise","lick","produce","notice"],"r":{"a":"[A] protecting, [B] within","ev":"11번 문장","s":[[11,"It helps us understand that animals use poison not only for hunting or protecting themselves but also for fighting within a species.","그것은 동물들이 사냥이나 자기 보호뿐만 아니라 같은 종 내에서 싸우는 데에도 독을 사용한다는 것을 우리가 이해하도록 도와준다."]],"w":"11번 문장에서 동물들은 hunting or protecting themselves(사냥이나 자기 보호)뿐 아니라 fighting within a species(같은 종 안에서 싸우는 일)에도 독을 쓴다고 함. raise(들어 올리다), lick(핥다), produce(만들다)는 3번에서 독을 만드는 동작이라 이 문장과 상관없음.","c":null},"h":"4a9523c37c"}]},{"u":7,"id":"rg4-07-3","no":3,"ko":"전기 없이 집을 식히는 사막의 굴뚝","items":[{"n":1,"t":"tf","q":"Many houses in Iran’s desert cities still use a cooling device that does not need electricity.","ko":"이란의 사막 도시에 있는 많은 집은 전기가 필요 없는 냉각 장치를 여전히 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"But in Iran’s desert cities, many houses still use a traditional, electricity-free cooling device known as a windcatcher.","그러나 이란의 사막 도시들에서는, 많은 집이 윈드캐처라고 알려진 전통적이고 전기를 사용하지 않는 냉각 장치를 여전히 사용한다."]],"w":"2번 문장에 many houses still use a traditional, electricity-free cooling device(전통적이고 전기를 쓰지 않는 냉각 장치)가 나옴. 본문과 일치.","c":"T"},"h":"e0830e2b9a"},{"n":2,"t":"tf","q":"A windcatcher is built under y.","ko":"(A) 여름에, 사람들은 에어컨을 더 자주 사용하는데, 그것은 많은 전기를 (B)한다.","oko":["(A) 더운 / (B) 절약","(A) 추운 / (B) 소비","(A) 더운 / (B) 소비","(A) 추운 / (B) 절약","(A) 더운 / (B) 생산"],"opts":["(A) hot / (B) save","(A) cold / (B) consume","(A) hot / (B) consume","(A) cold / (B) save","(A) hot / (B) produce"],"r":{"a":"3) (A) hot / (B) consume (더운 / 소비)","ev":"1번 문장","s":[[1,"In the hot summer, people often use air conditioners more, which consume a lot of electricity.","더운 여름에, 사람들은 에어컨을 더 자주 사용하는데, 그것은 많은 전기를 소비한다."]],"w":"1번 문장: In the hot summer(더운 여름에) 사람들이 에어컨을 더 자주 쓰고, 에어컨은 많은 전기를 consume(소비한다). save(절약하다)와 produce(생산하다)는 의미가 반대이고, cold(추운)는 summer에 맞지 않음.","c":3},"h":"263a427b69"},{"n":10,"t":"fill","q":"The exact [A] of windcatchers is not clear, though they appear in [B] Egyptian art over 3,000 years old.","ko":"윈드캐처의 정확한 [A]은(는) 분명하지 않지만, 그것은 3,000년이 넘은 [B] 이집트 미술품에 나타난다.","bko":{"origin":"기원","ancient":"고대의","modern":"현대의","symbol":"상징","scholars":"학자들","temple":"사원"},"bank":["origin","ancient","modern","symbol","scholars","temple"],"r":{"a":"[A] origin (기원), [B] ancient (고대의)","ev":"10번 문장","s":[[10,"The exact origin of windcatchers is not clear, though they appear in ancient Egyptian art over 3,000 years old.","윈드캐처의 정확한 기원은 분명하지 않지만, 3,000년이 넘은 고대 이집트의 미술품에 나타난다."]],"w":"10번 문장: The exact origin(정확한 기원)은 분명하지 않지만 ancient Egyptian art(고대 이집트 미술품)에 나타남. 3,000년이 넘은 미술품이니 modern(현대의)은 맞지 않고, symbol(상징)은 4번, temple(사원)과 scholars(학자들)는 11번에 나오는 말이라 이 자리에 맞지 않음.","c":null},"h":"3755b067f1"}]},{"u":8,"id":"rg4-08-1","no":1,"ko":"컴퓨터의 열로 수영장 물을 데운다고?","items":[{"n":1,"t":"tf","q":"Deep Green uses the heat from its data center to warm a pool.","ko":"Deep Green은 자사 데이터 센터에서 나오는 열로 수영장을 데운다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In the U.K., a start-up named Deep Green is using the waste heat from its data center to warm a pool in Devon.","영국에서는 Deep Green이라는 이름의 스타트업이 Devon에 있는 수영장 물을 데우기 위해 자사 데이터 센터에서 나오는 폐열을 이용하고 있다."]],"w":"3번 문장에 using the waste heat from its data center to warm a pool이 나옴. 본문과 일치.","c":"T"},"h":"59e249a0a4"},{"n":2,"t":"tf","q":"Deep Green’s data center is placed on the roof of the pool building.","ko":"Deep Green의 데이터 센터는 수영장 건물 지붕 위에 놓여 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"This center, about the size of a washing machine, has been installed underneath the pool.","세탁기 크기만 한 이 센터는 수영장 밑에 설치되었다."]],"w":"4번 문장에서 센터는 수영장 underneath(밑)에 설치되었다고 함. 지붕 위가 아니라 밑이라 반대.","c":"F"},"h":"7449a3d26f"},{"n":3,"t":"tf","q":"Deep Green also saves money by spending less on cooling its computers.","ko":"Deep Green도 컴퓨터를 식히는 데 돈을 덜 써서 돈을 절약한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Deep Green saves money too, by cutting expenses on cooling its computers.","Deep Green도 컴퓨터를 냉각하는 데 드는 비용을 줄여서 돈을 절약한다."]],"w":"9번 문장에서 cutting expenses on cooling its computers(컴퓨터 냉각에 드는 비용을 줄임)로 돈을 절약한다고 함. 본문과 일치.","c":"T"},"h":"2dc78d9d74"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The pool gets free heat, cutting its gas consumption by 62%.)","ko":"(수영장은 무료로 열을 얻어 가스 ( )를 62% 줄인다.)","opts":["생산","가격","소비","온도"],"word":"consumption","r":{"a":"3) 소비","ev":"8번 문장","s":[[8,"The pool gets free heat, cutting its gas consumption by 62%.","수영장은 무료로 열을 얻어 가스 소비를 62% 줄인다."]],"w":"8번에서 수영장이 공짜 열을 얻어서 gas consumption을 62% 줄인다고 함. 가스를 덜 쓰게 된다는 뜻이니 consumption = 소비.","c":3},"h":"23b66d00f5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It has computers surrounded by oil that captures their heat.)","ko":"(그곳에는 열을 가두는 기름으로 ( ) 컴퓨터들이 있다.)","opts":["가득 찬","떨어진","숨겨진","둘러싸인"],"word":"surrounded","r":{"a":"4) 둘러싸인","ev":"5번 문장","s":[[5,"It has computers surrounded by oil that captures their heat.","그곳에는 열을 가두는 기름으로 둘러싸인 컴퓨터들이 있다."]],"w":"5번에서 컴퓨터들이 기름 안에 있고 그 기름이 열을 가둠. 컴퓨터 둘레에 기름이 있는 모습이라 surrounded = 둘러싸인.","c":4},"h":"06bf93c99a"},{"n":6,"t":"ref","q":"What does the underlined \"ones\" refer to?\nEven small ones produce a lot of waste heat.","ko":"밑줄 친 ones이 가리키는 것은?","sko":"작은 것들도 많은 폐열을 생산한다.","opts":["데이터 센터들","수영장들","스타트업들","가스 회사들"],"pron":"ones","r":{"a":"1) 데이터 센터들","ev":"1~2번 문장","s":[[1,"Data centers are places where computers and machines store lots of information.","데이터 센터는 컴퓨터와 기계가 많은 정보를 저장하는 장소이다."],[2,"Even small ones produce a lot of waste heat.","작은 것들도 많은 폐열을 생산한다."]],"w":"1번에서 Data centers(데이터 센터)를 소개하고, 2번에서 small ones(작은 것들)로 이어짐. 폐열을 많이 만드는 것은 데이터 센터.","c":1,"k":"ones = 데이터 센터들"},"h":"4c011b745e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This smart setup helps both the pool and the data center.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 똑똑한 장치는 수영장과 데이터 센터 둘 다에게 도움이 된다.","opts":["이 영리한 장치는 수영장과 데이터 센터 둘 다에게 도움이 된다.","이 영리한 장치는 수영장에게만 도움이 되고 데이터 센터에는 해가 된다.","이 영리한 장치는 데이터 센터에게만 도움이 된다.","이 영리한 장치는 수영장과 데이터 센터 둘 다에게 비용이 든다."],"r":{"a":"1) 이 영리한 장치는 수영장과 데이터 센터 둘 다에게 도움이 된다.","ev":"7번 문장","s":[[7,"This smart setup helps both the pool and the data center.","이 똑똑한 장치는 수영장과 데이터 센터 둘 다에게 도움이 된다."]],"w":"helps both the pool and the data center = 수영장과 데이터 센터 둘 다 돕는다. 8번에서 수영장이, 9번에서 회사가 이득을 본다고 이어지므로 한쪽만 돕는다는 선지는 틀림.","c":1},"h":"5033888d49"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Deep Green은 더 많은 수영장에 이것을 할 계획이다.","Deep Green은 자사 데이터 센터 사용을 중단할 계획이다.","Deep Green은 자사 데이터 센터를 수영장에 팔 것이다.","Deep Green은 미국에 있는 큰 회사이다."],"opts":["Deep Green plans to do this for more pools.","Deep Green plans to stop using its data center.","Deep Green will sell its data center to the pool.","Deep Green is a large company in the U.S."],"r":{"a":"1) Deep Green plans to do this for more pools. (Deep Green은 더 많은 수영장에 이것을 할 계획이다.)","ev":"11번 문장","s":[[11,"This idea is so good that Deep Green plans to do this for more pools, which will help both itself and the environment.","이 아이디어는 아주 훌륭해서 Deep Green은 더 많은 수영장에 이것을 실행할 계획인데, 그것은 그 자체와 환경 둘 다에 도움이 될 것이다."]],"w":"11번 문장: Deep Green plans to do this for more pools(더 많은 수영장에 이것을 할 계획). 3번에서 영국의 스타트업이라고 했으므로 미국의 큰 회사라는 선지는 틀리고, 나머지도 본문에 없는 내용.","c":1},"h":"d0fe8f0bae"},{"n":9,"t":"sum","q":"The heat from the computers is (A) into a heat exchanger and warms the pool’s (B).","ko":"컴퓨터에서 나온 열은 열 교환 장치로 (A) 수영장의 (B)을(를) 데운다.","oko":["(A) 옮겨져 / (B) 가스","(A) 옮겨져 / (B) 기름","(A) 사라져 / (B) 물","(A) 팔려 / (B) 물","(A) 옮겨져 / (B) 물"],"opts":["(A) transferred / (B) gas","(A) transferred / (B) oil","(A) lost / (B) water","(A) sold / (B) water","(A) transferred / (B) water"],"r":{"a":"5) (A) transferred / (B) water (옮겨져 / 물)","ev":"6번 문장","s":[[6,"This heat is then transferred into a heat exchanger and warms the pool’s water.","이 열은 그다음 열 교환 장치로 옮겨져 수영장의 물을 데운다."]],"w":"6번 문장: This heat is then transferred(옮겨진다) into a heat exchanger and warms the pool’s water(수영장의 물). lost(사라지다)와 sold(팔리다)는 본문에 없고, gas(가스)는 8번, oil(기름)은 5번에 나오는 말이라 데워지는 대상이 아님.","c":5},"h":"5835b8bb76"},{"n":10,"t":"fill","q":"Data centers are places where computers and machines [A] lots of [B].","ko":"데이터 센터는 컴퓨터와 기계가 많은 [B]을(를) [A] 장소이다.","bko":{"store":"저장하다","information":"정보","melted":"녹았다","installed":"설치된","captures":"가두다","warm":"데우다"},"bank":["store","information","melted","installed","captures","warm"],"r":{"a":"[A] store (저장하다), [B] information (정보)","ev":"1번 문장","s":[[1,"Data centers are places where computers and machines store lots of information.","데이터 센터는 컴퓨터와 기계가 많은 정보를 저장하는 장소이다."]],"w":"1번 문장: Data centers are places where computers and machines store lots of information(많은 정보를 저장하는 장소). 나머지 단어는 이 자리에 문법적으로나 의미상 맞지 않음.","c":null},"h":"1b9d80805f"}]},{"u":8,"id":"rg4-08-2","no":2,"ko":"달에도 시간대가 필요한 이유는?","items":[{"n":1,"t":"tf","q":"The country that launches a spaceship decides the time zone of its mission.","ko":"우주선을 발사하는 나라가 그 임무의 시간대를 결정한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"That’s because the country that launches the spaceship decides it.","우주선을 발사하는 나라가 그것을 결정하기 때문이다."]],"w":"4번 문장에서 the country that launches the spaceship decides it(우주선을 발사하는 나라가 그것(시간대)을 결정한다)이라고 함. 본문과 일치.","c":"T"},"h":"5125e4bdc9"},{"n":2,"t":"tf","q":"The European Space Agency wants to make a special time zone for Mars.","ko":"유럽 우주국은 화성을 위한 특별한 시간대를 만들고 싶어 한다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"The European Space Agency (ESA) wants to make a special time zone for the moon.","유럽 우주국(ESA)은 달을 위한 특별한 시간대를 만들고 싶어 한다."]],"w":"1번 문장에서 special time zone for the moon(달을 위한 특별한 시간대)이라고 함. 화성이 아니라 달이라 틀림. 화성이나 다른 행성 이야기는 11번에서 나중에 나오는 것.","c":"F"},"h":"5b4c84e4fd"},{"n":3,"t":"tf","q":"Once a standard time system is made for the moon, it can also be made for other planets.","ko":"달의 표준 시간 체계가 만들어지면, 다른 행성을 위해서도 만들 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"But once they set up a standard time system for the moon, they can quickly make and manage the same system for other planets too.","그러나 일단 달의 표준 시간 체계를 마련하면, 다른 행성들에서도 같은 체계를 빠르게 만들고 관리할 수 있다."]],"w":"11번 문장에서 일단 달의 표준 시간 체계를 마련하면 다른 행성의 같은 체계도 빠르게 만들고 관리할 수 있다고 함. 본문과 일치.","c":"T"},"h":"4c42ba8a19"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the country that launches the spaceship decides it.)","ko":"(…우주선을 ( ) 나라가 그것을 결정한다.)","opts":["발사하다","착륙하다","수리하다","관찰하다"],"word":"launches","r":{"a":"1) 발사하다","ev":"4번 문장","s":[[4,"That’s because the country that launches the spaceship decides it.","우주선을 발사하는 나라가 그것을 결정하기 때문이다."]],"w":"4번에서 어느 나라가 spaceship을 launch하느냐에 따라 시간대가 정해짐. 우주선을 우주로 쏘아 올리는 나라이니 launch = 발사하다.","c":1},"h":"66b837ffd4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…once they set up a standard time system for the moon…)","ko":"(…일단 그들이 달의 ( ) 시간 체계를 마련하면…)","opts":["특별한","위험한","표준의","작은"],"word":"standard","r":{"a":"3) 표준의","ev":"11번 문장","s":[[11,"But once they set up a standard time system for the moon, they can quickly make and manage the same system for other planets too.","그러나 일단 달의 표준 시간 체계를 마련하면, 다른 행성들에서도 같은 체계를 빠르게 만들고 관리할 수 있다."]],"w":"11번에서 달의 standard time system을 마련하면 다른 행성에서도 같은 체계를 만들 수 있다고 함. 모두가 같이 쓰는 기준 체계라서 standard = 표준의.","c":3},"h":"0668a16953"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nBut finding the best way to make this happen is not easy.","ko":"밑줄 친 this이 가리키는 것은?","sko":"하지만 이것을 실현하기 위한 최선의 방법을 찾는 것은 쉽지 않다.","opts":["달에서의 새로운 시간 체계를 만드는 것","우주선을 새로 만드는 것","달에서 지구로 돌아오는 것","지구의 하루를 늘리는 것"],"pron":"this","r":{"a":"1) 달에서의 새로운 시간 체계를 만드는 것","ev":"5~6번 문장","s":[[5,"A new system for time on the moon would make things easier for everyone.","달에서의 새로운 시간 체계는 모두에게 일을 더 쉽게 만들 것이다."],[6,"But finding the best way to make this happen is not easy.","하지만 이것을 실현하기 위한 최선의 방법을 찾는 것은 쉽지 않다."]],"w":"5번에서 달에서의 새로운 시간 체계가 모두에게 일을 쉽게 해 줄 거라고 했고, 6번 But으로 이어져 이것을 실현하기가 쉽지 않다고 함. make this happen = 그 새로운 시간 체계를 만드는 일.","c":1,"k":"this = 달에서의 새로운 시간 체계를 만드는 것"},"h":"5f269e9e50"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"One of the problems is that clocks work differently on the moon and in space around the moon.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"문제들 중 하나는 달과 달 주변의 우주에서 시계가 다르게 작동한다는 것이다.","opts":["문제 중 하나는 달과 그 주변 우주에서 시계가 다르게 작동한다는 것이다.","문제 중 하나는 달에서 시계가 아예 작동하지 않는다는 것이다.","달과 그 주변 우주에서 시계가 똑같이 작동해서 문제가 없다.","문제 중 하나는 우주선 안의 시계가 너무 비싸다는 것이다."],"r":{"a":"1) 문제 중 하나는 달과 그 주변 우주에서 시계가 다르게 작동한다는 것이다.","ev":"7번 문장","s":[[7,"One of the problems is that clocks work differently on the moon and in space around the moon.","문제들 중 하나는 달과 달 주변의 우주에서 시계가 다르게 작동한다는 것이다."]],"w":"One of the problems(문제들 중 하나)는 clocks work differently(시계가 다르게 작동한다)는 것. 달과 달 주변 우주에서 다르다는 뜻이고, 아예 작동하지 않는다는 말은 없음.","c":1},"h":"296462c19b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["달은 지구만큼 크다.","모든 달 임무는 이미 같은 시간대를 쓰고 있다.","달의 하루는 지구의 29.5일과 같다.","달의 하루는 지구의 하루보다 짧다."],"opts":["The moon is as big as Earth.","Every moon mission already uses the same time zone.","A day on the moon is the same as 29.5 Earth days.","A day on the moon is shorter than a day on Earth."],"r":{"a":"3) A day on the moon is the same as 29.5 Earth days. (달의 하루는 지구의 29.5일과 같다.)","ev":"9번 문장","s":[[9,"Ano
