<style>

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "One day, Emily received an invitation from a museum.", "ko": "어느 날, Emily는 박물관에서 초대장을 받았다.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "This museum wasn’t a ordinary museum.", "ko": "이 박물관은 평범한 박물관이 아니었다.", "ok": false, "foot": [], "fixes": [{"wrong": "a", "right": "an", "partial": false, "at": [3], "point": "관사: 모음 발음으로 시작하는 ordinary 앞에는 부정관사 an 사용", "topic": "관사", "memo": "모음 발음으로 시작하는 ordinary 앞에는 부정관사 an 사용"}]}, {"n": 3, "tag": null, "en": "It had rooms who celebrated great peoples.", "ko": "그곳에는 위대한 사람들을 기념하는 방들이 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "who", "right": "that", "partial": false, "at": [3], "point": "관계대명사: 선행사 rooms는 사물이므로 who 대신 that(또는 which) 사용", "topic": "관계대명사", "memo": "선행사 rooms는 사물이므로 who 대신 that(또는 which) 사용"}, {"wrong": "peoples", "right": "people", "partial": false, "at": [6], "point": "어휘: people은 이미 '사람들'을 뜻하는 복수형, peoples는 '민족들'이라는 다른 의미", "topic": "어휘", "memo": "people은 이미 '사람들'을 뜻하는 복수형, peoples는 '민족들'이라는 다른 의미"}]}, {"n": 4, "tag": null, "en": "It was exciting for her begin her exploration.", "ko": "그녀가 자신의 탐험을 시작하게 된 것은 신나는 일이었다.", "ok": false, "foot": [], "fixes": [{"wrong": "begin", "right": "to begin", "partial": false, "at": [5], "point": "to부정사의 명사적 용법: It(형식주어) ~ for 목적격 to부정사(진주어) 구문에서 begin 앞에 to 필요", "topic": "to부정사의 명사적 용법", "memo": "It(형식주어) ~ for 목적격 to부정사(진주어) 구문에서 begin 앞에 to 필요"}]}, {"n": 5, "tag": "비행기 조종사의 방", "en": "Her first stop was a room that looked as an old airplane garage.", "ko": "그녀의 첫 번째 방문지는 오래된 비행기 격납고처럼 보이는 방이었다.", "ok": false, "foot": [], "fixes": [{"wrong": "looked as", "right": "looked like", "partial": false, "at": [7], "point": "어법/어휘: '~처럼 보이다'는 look like + 명사, look as는 부적절", "topic": "어법/어휘", "memo": "'~처럼 보이다'는 look like + 명사, look as는 부적절"}]}, {"n": 6, "tag": null, "en": "Model airplanes were hung from the ceilings.", "ko": "모형 비행기들이 천장에 매달려 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "hung", "right": "hanging", book.", "책장들 중 하나에서, Emily는 빛나는 책을 발견했다.", 0], ["She picked it up and saw the name Jean-Henri Fabre on its cover.", "그녀는 그것을 집어 들고 표지에서 Jean-Henri Fabre라는 이름을 보았다.", 0], ["When she opened the book, she found an old letter from Charles Darwin.", "그녀가 책을 열었을 때, 그녀는 Charles Darwin에게서 온 오래된 편지를 발견했다.", 0], ["It said, \"Thank you for sending me your book. I truly love your work about insects.\"", "그것에는 \"당신의 책을 보내 주셔서 감사합니다. 저는 곤충에 관한 당신의 연구를 진심으로 사랑합니다.\"라고 쓰여 있었다.", 0], ["Emily learned that Fabre wrote many books about insects for more than thirty years.", "Emily는 Fabre가 30년 넘게 곤충에 관한 많은 책을 썼다는 것을 알게 되었다.", 0], ["His true love for nature was shown clearly in every corner of the room.", "자연에 대한 그의 진정한 사랑은 방의 모든 구석에서 분명하게 드러났다.", 0], ["Emily stepped out of the last room.", "Emily는 마지막 방에서 나왔다.", 0], ["She was so excited that she could not wait to tell her friends about her adventure.", "그녀는 너무 신이 나서 친구들에게 자신의 모험에 대해 빨리 이야기하고 싶었다.", 0]];var RNUM=60;var TITLE_EN="Exploring Greatness";var PASS_EN=["Exploring Greatness", "One day, Emily received an invitation from a museum. This museum wasn’t an ordinary museum. It had rooms that celebrated great people. It was exciting for her to begin her exploration.", "Her first stop was a room that looked like an old airplane garage. Model airplanes were hanging from the ceiling. A leather pilot jacket and goggles were displayed. The leather jacket looked as old as the airplane models around it. When Emily put them on, she could hear the airplane engines roar. She looked around the room in surprise. On the wall, there was a picture of a woman. She looked brave and strong. Her name was Kwon Ki-ok. She was the first female pilot in Korea. Emily also found an old newspaper on the desk. It read, \"Although women couldn’t enter flight schools at that time, Kwon Ki-ok didn’t give up and worked hard to achieve her dream.\" Kwon Ki-ok did not just fly airplanes. She also fought against Japan for Korea’s independence. Emily was moved by the great life story of Kwon Ki-ok.", "Emily stepped into the next room. The room was filled with many books and drawings of insects and plants. It looked like a small forest. When she closed the door, drawings on the desk suddenly started to fly around the room. She caught one of them. It was a drawing of a honeybee. It was so detailed that the honeybee looked alive. From one of the bookshelves, Emily found a shining book. She picked it up and saw the name Jean-Henri Fabre on its cover. When she opened the book, she found an old letter from Charles Darwin. It said, \"Thank you for sending me your book. I truly love your work about insects.\" Emily learned that Fabre wrote many books about insects for more than thirty years. His true love for nature was shown clearly in every corner of the room. Emily stepped out of the last room. She was so excited that she could not wait to tell her friends about her adventure."];var PASS_KO=["위대함을 탐험하기", "어느 날, Emily는 박물관에서 초대장을 받았다. 이 박물관은 평범한 박물관이 아니었다. 그곳에는 위대한 사람들을 기념하는 방들이 있었다. 그녀가 자신의 탐험을 시작하게 된 것은 신나는 일이었다.", "그녀의 첫 번째 방문지는 오래된 비행기 격납고처럼 보이는 방이었다. 모형 비행기들이 천장에 매달려 있었다. 가죽 비행사 재킷과 고글이 전시되어 있었다. 그 가죽 재킷은 주변의 모형 비행기들만큼이나 오래되어 보였다. Emily가 그것들을 입었을 때, 그녀는 비행기 엔진이 굉음을 내는 것을 들을 수 있었다. 그녀는 놀라서 방을 둘러보았다. 그 벽에는 한 여성의 사진이 있었다. 그녀는 용감하고 강인해 보였다. 그녀의 이름은 권기옥이었다. 그녀는 한국 최초의 여성 비행사였다. Emily는 책상 위에서 오래된 신문도 발견했다. 그것에는 \"당시에 여성들은 비행 학교에 입학할 수 없었지만, 권기옥은 포기하지 않고 꿈을 이루기 위해 열심히 노력했다.\"라고 적혀 있었다. 권기옥은 단순히 비행기만 조종한 것이 아니었다. 그녀는 한국의 독립을 위해 일본에 맞서서 싸우기도 했다. Emily는 권기옥의 위대한 인생 이야기에 감동을 받았다.", "Emily는 다음 방으로 들어갔다. 그 방은 많은 책들과 곤충과 식물의 그림들로 가득 차 있었다. 그곳은 작은 숲처럼 보였다. 그녀가 문을 닫았을 때, 책상 위의 그림들이 갑자기 방 안 여기저기를 날아다니기 시작했다. 그녀는 그것들 중 하나를 잡았다. 그것은 꿀벌 한 마리의 그림이었다. 그것은 너무 세밀해서 꿀벌이 살아 있는 것처럼 보였다. 책장들 중 하나에서, Emily는 빛나는 책을 발견했다. 그녀는 그것을 집어 들고 표지에서 Jean-Henri Fabre라는 이름을 보았다. 그녀가 책을 열었을 때, 그녀는 Charles Darwin에게서 온 오래된 편지를 발견했다. 그것에는 \"당신의 책을 보내 주셔서 감사합니다. 저는 곤충에 관한 당신의 연구를 진심으로 사랑합니다.\"라고 쓰여 있었다. Emily는 Fabre가 30년 넘게 곤충에 관한 많은 책을 썼다는 것을 알게 되었다. 자연에 대한 그의 진정한 사랑은 방의 모든 구석에서 분명하게 드러났다. Emily는 마지막 방에서 나왔다. 그녀는 너무 신이 나서 친구들에게 자신의 모험에 대해 빨리 이야기하고 싶었다."];var DG=[{"dlg": [["Junho", "Minji, what are you reading?", "민지야, 뭐 읽고 있어?"], ["Minji", "I’m reading this book My Life with the Chimpanzees.", "나는 이 책 「침팬지와 함께한 나의 삶」을 읽고 있어."], ["Junho", "Are you interested in chimpanzees?", "너 침팬지에 관심 있어?"], ["Minji", "Yes, I am. This book is about the life of Jane Goodall and her love for chimpanzees.", "응, 관심 있어. 이 책은 Jane Goodall의 삶과 침팬지에 대한 그녀의 사랑에 관한 거야."], ["Alex", "I read the book, too. She’s an animal scientist who studied chimpanzees for many years.", "나도 그 책 읽었어. 그녀는 오랫동안 침팬지를 연구한 동물 과학자야."], ["Minji", "You’re right. She’s the first person to study chimpanzees in the wild. She’s my role model.", "맞아. 그녀는 야생에서 침팬지를 연구한 최초의 사람이야. 그녀는 내 롤 모델이야."], ["Junho", "Wow, that’s great!", "와, 멋지다!"], ["Minji", "Like Jane Goodall, I’m very interested in animal behavior. And I want to study animals in the wild and help them, too.", "Jane Goodall처럼, 나는 동물의 행동에 관심이 아주 많아. 그리고 나도 야생에서 동물들을 연구하고 그들을 돕고 싶어."], ["Alex", "I hope your dream comes true.", "네 꿈이 이루어지길 바라."]], "qs": [{"n": 1, "q": "위 대화를 읽고 알 수 없는 것은?", "o": ["the content of My Life with the Chimpanzees", "Jane Goodall's achievements", "Alex's dream job", "Minji's role model", "Minji's interest"], "a": 2, "ans": "Alex's dream job", "evs": [["Alex: I read the book, too. She’s an animal scientist who studied chimpanzees for many years.", "나도 그 책 읽었어. 그녀는 오랫동안 침팬지를 연구한 동물 과학자야."], ["Alex: I hope your dream comes true.", "네 꿈이 이루어지길 바라."]], "ev": ["Alex: I read the book, too. She’s an animal scientist who studied chimpanzees for many years.", "나도 그 책 읽었어. 그녀는 오랫동안 침팬지를 연구한 동물 과학자야."], "memo": ["Alex: I read the book, too. She’s an animal scientist who studied chimpanzees for many years.  (나도 그 책 읽었어. 그녀는 오랫동안 침팬지를 연구한 동물 과학자야.)", "Alex: I hope your dream comes true.  (네 꿈이 이루어지길 바라.)"]}]}, {"dlg": [["Junho", "Minji, what are you reading?", "민지야, 뭐 읽고 있어?"], ["Minji", "I’m reading this book My Life with the C   if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
