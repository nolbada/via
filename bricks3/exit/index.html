에서 자신의 말을 움직인다."],[11,"The game continues until all except one player lose all their money, and the last player left is the winner.","한 명을 제외한 모든 플레이어가 돈을 전부 잃을 때까지 게임이 계속되고, 마지막에 남은 플레이어가 승자이다."]],"w":"7번 문장에서 two dice(주사위 두 개)를 굴리고, 11번 문장에서 한 명을 빼고 모두 돈(money)을 잃을 때까지 게임이 계속됨. 카드는 본문에 없고, 말(token)은 굴리는 것이 아니라 움직이는 것.","c":5},"h":"97f590f747"},{"n":10,"t":"fill","q":"Monopoly teaches players how [A] and business work, and shows how smart [B] can lead to success.","ko":"모노폴리는 플레이어에게 [A]과 사업이 어떻게 돌아가는지 가르쳐 주고, 현명한 [B]이 성공으로 이어질 수 있음을 보여 준다.","bank":["money","decisions","rent","dice","winner","hotels"],"bko":{"money":"돈","decisions":"결정","rent":"임대료","dice":"주사위","hotels":"호텔","winner":"승자"},"r":{"a":"[A] money, [B] decisions","ev":"3, 12번 문장","s":[[3,"It teaches players how money and business work.","그것은 플레이어에게 돈과 사업이 어떻게 돌아가는지 가르쳐 준다."],[12,"Although the game seems simple, Monopoly shows how money flows and how smart decisions can lead to success.","게임은 단순해 보이지만, 모노폴리는 돈이 어떻게 흐르는지와 현명한 결정이 어떻게 성공으로 이어질 수 있는지를 보여 준다."]],"w":"3번 문장 how money and business work, 12번 문장 how smart decisions can lead to success에서 가져옴. rent, dice, winner, hotels는 게임 규칙에 나오는 단어라 이 빈칸에는 맞지 않음.","c":null},"h":"b748896d7a"}]},{"u":9,"id":"b3-09-3","no":3,"ko":"영화 앞에 나오는 ‘트레일러’, 왜 이름이 ‘뒤따르는 것’일까?","items":[{"n":1,"t":"tf","q":"Nils Granlund made a short video to promote a musical in 1913.","ko":"닐스 그랜룬드는 1913년에 뮤지컬을 홍보하기 위한 짧은 영상을 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In 1913, he made a short video to promote an upcoming musical called The Pleasure Seekers and played it after another performance.","1913년에 그는 곧 있을 〈The Pleasure Seekers〉라는 뮤지컬을 홍보하기 위한 짧은 영상을 만들어 다른 공연이 끝난 후에 상영했다."]],"w":"3번 문장에 In 1913, he made a short video to promote an upcoming musical이 있음. 본문과 일치.","c":"T"},"h":"9451c2145d"},{"n":2,"t":"tf","q":"The word “trailer” comes from a word meaning “to go first.”","ko":"‘트레일러’라는 단어는 ‘먼저 가다’를 뜻하는 단어에서 왔다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The word comes re performances.","그래서 극장들은 공연 전에 영상을 보여 주기 시작했다."],[11,"They kept the name “trailer,” even though it no longer played at the end.","그것이 더 이상 끝에 상영되지 않는데도 그들은 ‘트레일러’라는 이름을 유지했다."]],"w":"10번 문장의 주어가 theaters(극장들)이고, 공연 전에 영상을 보여 주기 시작한 것도 극장들. 11번 They는 그 극장들.","c":3},"h":"ea1a425d7a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By the time the trailer came on, many audience members had already left.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"트레일러가 나올 때쯤이면, 많은 관객이 이미 떠난 상태였다.","opts":["트레일러가 나올 때쯤 많은 관객은 이미 자리를 떠난 뒤였다.","트레일러가 나오자 많은 관객이 다시 자리로 돌아왔다.","많은 관객이 트레일러를 보려고 일찍 도착했다.","트레일러가 끝나자 관객들이 모두 박수를 쳤다."],"r":{"a":"1) 트레일러가 나올 때쯤 많은 관객은 이미 자리를 떠난 뒤였다.","ev":"9번 문장","s":[[9,"By the time the trailer came on, many audience members had already left.","트레일러가 나올 때쯤이면, 많은 관객이 이미 떠난 상태였다."]],"w":"by the time ~는 ‘~할 때쯤에는’, had already left(leave(떠나다)의 완료형)는 ‘이미 떠난 상태’. 시간 순서상 관객이 먼저 떠나고 트레일러가 나옴. 돌아왔다거나 박수를 쳤다는 말은 없음.","c":1},"h":"653d24159b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["닐스 그랜룬드는 런던의 극장에서 일했다.","첫 트레일러는 영화가 시작되기 전에 상영되었다.","트레일러는 처음부터 늘 공연 전에 상영되었다.","처음에 홍보 영상이 끝에 상영되어서 트레일러라는 이름이 붙었다."],"opts":["Nils Granlund worked at a theater in London.","The first trailer was shown before a movie began.","Trailers have always been shown before performances.","The first promotional videos were shown at the end, which is how trailers got their name."],"r":{"a":"4) The first promotional videos were shown at the end, which is how trailers got their name.","ev":"1, 3, 6, 10번 문장","s":[[1,"A man named Nils Granlund worked as an advertising manager at a theater in New York which showed live stage performances and films.","닐스 그랜룬드라는 남자는 라이브 무대 공연과 영화를 상영하는 뉴욕의 한 극장에서 광고 담당자로 일했다."],[3,"In 1913, he made a short video to promote an upcoming musical called The Pleasure Seekers and played it after another performance.","1913년에 그는 곧 있을 〈The Pleasure Seekers〉라는 뮤지컬을 홍보하기 위한 짧은 영상을 만들어 다른 공연이 끝난 후에 상영했다."],[6,"Since these promotional videos were shown at the end, they were called “trailers.”","이 홍보 영상들은 끝에 상영되었기 때문에 ‘트레일러’라고 불렸다."],[10,"So theaters began showing the videos before performances.","그래서 극장들은 공연 전에 영상을 보여 주기 시작했다."]],"w":"6번 문장에서 홍보 영상이 끝에 상영되어 trailer라고 불렸다고 해서 ④가 정답. ①은 1번에서 뉴욕, ②는 3번에서 다른 공연이 끝난 후, ③은 10번에서 나중에 앞으로 옮겼다고 해 틀림.","c":4},"h":"e1ce4d1438"},{"n":9,"t":"sum","q":"Because many people had already (A) by the time the trailer came on, theaters began showing the videos (B) performances.","ko":"트레일러가 나올 때쯤 많은 사람이 이미 (A)했기 때문에, 극장들은 공연 (B)에 영상을 보여 주기 시작했다.","oko":["(A) 도착 / (B) 후","(A) 떠남 / (B) 후","(A) 도착 / (B) 전","(A) 남음 / (B) 전","(A) 떠남 / (B) 전"],"opts":["(A) arrived / (B) after","(A) left / (B) after","(A) arrived / (B) before","(A) stayed / (B) before","(A) left / (B) before"],"r":{"a":"5) (A) left / (B) before","ev":"9~10번 문장","s":[[9,"By the time the trailer came on, many audience members had already left.","트레일러가 나올 때쯤이면, 많은 관객이 이미 떠난 상태였다."],[10,"So theaters began showing the videos before performances.","그래서 극장들은 공연 전에 영상을 보여 주기 시작했다."]],"w":"9번 문장에서 관객이 이미 떠났고(left), 10번 문장에서 극장들이 영상을 공연 전(before)에 보여 주기 시작함. 이미 떠났다는 말과 반대인 arrived, stayed는 틀림.","c":5},"h":"50cb8fb0af"},{"n":10,"t":"fill","q":"The word “trailer” comes from “trail,” which means to [A] behind, and Granlund made a short video to [B] a musical.","ko":"‘트레일러’는 뒤에서 [A]한다는 뜻의 ‘trail’에서 왔고, 그랜룬드는 뮤지컬을 [B]하려고 짧은 영상을 만들었다.","bank":["follow","promote","attract","notice","ignore","arrive"],"bko":{"follow":"따라가다","promote":"홍보하다","attract":"끌어들이다","notice":"알아차리다","ignore":"무시하다","arrive":"도착하다"},"r":{"a":"[A] follow, [B] promote","ev":"3, 7번 문장","s":[[3,"In 1913, he made a short video to promote an upcoming musical called The Pleasure Seekers and played it after another performance.","1913년에 그는 곧 있을 〈The Pleasure Seekers〉라는 뮤지컬을 홍보하기 위한 짧은 영상을 만들어 다른 공연이 끝난 후에 상영했다."],[7,"The word comes from “trail,” which means “to follow behind.”","그 단어는 ‘뒤에서 따라가다’를 뜻하는 ‘trail’에서 왔다."]],"w":"7번 문장에 which means “to  and clean.","즐거운 분위기와 함께, 이 행사는 우리에게 바다를 건강하고 깨끗하게 지키라고 일깨워 준다."]],"w":"With its joyful mood는 ‘즐거운 분위기와 함께’, reminds us to ~는 ‘~하라고 일깨워 준다’. 잊게 만든다는 반대 뜻이고, 무거운 분위기나 행사를 열지 말라는 말은 없음.","c":2},"h":"70b2f38c9d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["대부분의 참가자는 전문 음악가이다.","축제는 매년 1월에 열린다.","콘서트가 시작되기 전에 참가자들은 배를 타고 암초로 나간다.","노래는 해변 근처 스피커에서 나온다."],"opts":["Most participants are professional musicians.","The festival is held every January.","Before the concert starts, participants ride boats out to the reef.","The songs are played from speakers on the beach."],"r":{"a":"3) Before the concert starts, participants ride boats out to the reef.","ev":"3, 4, 5, 7번 문장","s":[[3,"Every July, the Florida Keys Underwater Music Festival takes place at Looe Key Reef.","매년 7월, 플로리다 키스 수중 음악 축제가 루키 암초에서 열린다."],[4,"Most participants are scuba divers or snorkelers.","대부분의 참가자는 스쿠버 다이버나 스노클러이다."],[5,"Before the concert starts, they gather together and ride boats out to the reef.","콘서트가 시작되기 전에, 그들은 함께 모여 배를 타고 암초로 나간다."],[7,"Ocean-themed songs play through waterproof speakers under the water.","바다를 주제로 한 노래들이 물속의 방수 스피커를 통해 흘러나온다."]],"w":"5번 문장에 Before the concert starts, they gather together and ride boats out to the reef가 있어 ③이 정답. ①은 4번에서 다이버·스노클러, ②는 3번에서 7월, ④는 7번에서 물속 스피커라 틀림.","c":3},"h":"7b4069aa89"},{"n":9,"t":"sum","q":"Participants listen to ocean-themed songs through (A) speakers under the water while they (B) the colorful underwater scene.","ko":"참가자들은 물속의 (A) 스피커로 바다 노래를 들으면서 알록달록한 수중 풍경을 (B).","oko":["(A) 방수 / (B) 무시한다","(A) 시끄러운 / (B) 둘러본다","(A) 고장 난 / (B) 피한다","(A) 무선 / (B) 떠난다","(A) 방수 / (B) 둘러본다"],"opts":["(A) waterproof / (B) ignore","(A) loud / (B) explore","(A) broken / (B) avoid","(A) wireless / (B) leave","(A) waterproof / (B) explore"],"r":{"a":"5) (A) waterproof / (B) explore","ev":"7~8번 문장","s":[[7,"Ocean-themed songs play through waterproof speakers under the water.","바다를 주제로 한 노래들이 물속의 방수 스피커를 통해 흘러나온다."],[8," 편지는 퍼즐 푸는 것을 좋아하는지 물었다고 함. 라디오를 고칠 수 있는지 묻지 않음.","c":"F"},"h":"0a4301f555"},{"n":3,"t":"tf","q":"The story of the women was known to the world before the book Code Girls was published.","ko":"그 여성들의 이야기는 《코드 걸스》라는 책이 출간되기 전에 세상에 알려져 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Not until the book called Code Girls was published did their story become known to the world.","《코드 걸스》라는 책이 출간되고 나서야 비로소 그들의 이야기가 세상에 알려졌다."]],"w":"10번 문장 Not until … was published did their story become known는 책이 나오고 나서야 알려졌다는 뜻. 책이 나오기 전에 알려졌다는 말과 반대.","c":"F"},"h":"9e5569332a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...the military started recruiting women.)","ko":"... 군은 여성들을 모집하기 시작했다.","opts":["해고하다","숨기다","모집하다","칭찬하다"],"word":"recruiting","r":{"a":"3) 모집하다","ev":"5번 문장","s":[[5,"Many men were away fighting, so the military started recruiting women.","많은 남성들이 전투를 하러 멀리 나가 있었기 때문에, 군은 여성들을 모집하기 시작했다."]],"w":"5번 문장은 남성들이 전쟁터에 가서 일할 사람이 부족하자 여성들을 불러 모은 상황이라 recruit = 모집하다. 6번에서 여성들이 육군과 해군에 들어간 것과 이어짐.","c":3},"h":"d35e9a8f75"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...they are remembered as brave and brilliant women...)","ko":"... 그들은 용감하고 뛰어난 여성들로 기억된다.","opts":["평범한","뛰어난","게으른","수줍은"],"word":"brilliant","r":{"a":"2) 뛰어난","ev":"11번 문장","s":[[11,"Today, they are remembered as brave and brilliant women who helped win the war in silence.","오늘날 그들은 조용히 전쟁을 승리로 이끄는 데 도움을 준 용감하고 뛰어난 여성들로 기억된다."]],"w":"brave(용감한)와 함께 쓰여 칭찬하는 말이고, 암호를 풀어 전쟁을 승리로 이끈 사람들이니 brilliant = 뛰어난, 훌륭한. 평범한이나 게으른은 반대 뜻.","c":2},"h":"ca3835a78e"},{"n":6,"t":"ref","q":"What does the underlined \"These efforts\" refer to?\nThese efforts saved thousands of lives in the Pacific…","ko":"밑줄 친 These efforts가 가리키는 것은?","sko":"이런 노력은 태평양에서 수천 명의 목숨을 구했다…","opts":["남성들이 전투에 나가 싸운 일","여성들에게 편지를 보낸 일","미군이 일본을 공격한 일","여성들이 암호를 풀고 적을 속인 일"],"r":{"a":"4) 여성들이 암호를 풀고 적을 속인 일","ev":"7~9번 문장","s":[[7,"They listened to enemy radio messages and looked for repeated symbols and secret clues.","그들은 적의 무전 메시지를 듣고 반복되는 기호와 비밀 단서를 찾았다."],[8,"They even helped create false messages to trick the enemy.","그들은 심지어 적을 속이기 위한 가짜 메시지를 만드는 것을 돕기도 했다."],[9,"These efforts saved thousands of lives in the Pacific and, according to some historians, may have shortened the war by about two years.","이런 노력은 태평양에서 수천 명의 목숨을 구했고, 일부 역사학자들에 따르면 전쟁을 약 2년 단축시켰을 수도 있다."]],"w":"9번 These efforts는 바로 앞 7~8번에서 여성들이 한 일(무전 듣기, 기호·단서 찾기, 가짜 메시지 만들기)을 가리킴. 남성들의 전투나 편지는 9번의 결과와 이어지지 않음.","c":4},"h":"0c20450141"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Not until the book called Code Girls was published did their story become known to the world.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"《코드 걸스》라는 책이 출간되고 나서야 비로소 그들의 이야기가 세상에 알려졌다.","opts":["《코드 걸스》라는 책이 나오기 전에 이미 그들의 이야기는 널리 알려져 있었다.","《코드 걸스》라는 책이 출간되고 나서야 비로소 그들의 이야기가 세상에 알려졌다.","《코드 걸스》라는 책은 그들의 이야기를 세상에 알리지 않으려고 쓰였다.","그들의 이야기가 알려지자마자 《코드 걸스》라는 책은 사라졌다."],"r":{"a":"2) 《코드 걸스》라는 책이 출간되고 나서야 비로소 그들의 이야기가 세상에 알려졌다.","ev":"10번 문장","s":[[10,"Not until the book called Code Girls was published did their story become known to the world.","《코드 걸스》라는 책이 출간되고 나서야 비로소 그들의 이야기가 세상에 알려졌다."]],"w":"Not until A, did B ~는 ‘A하고 나서야 비로소 B하다’. 책이 나온 뒤에야 이야기가 알려졌다는 뜻. 책이 나오기 전에 알려졌다는 것은 반대.","c":2},"h":"66fa4d1f95"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["육군과 해군에 들어간 여성들은 일본군 암호를 푸는 훈련을 받았다.","남성들이 집에 너무 많아서 미군은 여성들을 모집했다.","여성들의 노력은 전쟁을 약 2년 더 길어지게 했다.","여성들의 이야기는 전쟁 직후부터 유명했다."],"opts":["Women who joined the Army and Navy were trained to break Japanese military codes.","The U.S. military recruited women because too many men were at home.","The women’s efforts made the war about two years longer.","The women’s story was famous right after the war."],"r":{"a":"1) Women who joined the Army and Navy were trained to break Japanese military codes.","ev":"5, 6, 9, 10번 문장","s":[[5,"Many men were away fighting, so the military started recruiting women.","많은 남성들이 전투를 하러 멀리 나가 있었기 때문에, 군은 여성들을 모집하기 시작했다."],[6,"Over 10,000 women joined the Army and Navy and were trained to break Japanese military codes.","1만 명이 넘는 여성들이 육군과 해군에 들어가 일본군 암호를 푸는 훈련을 받았다."],[9,"These efforts saved thousands of lives in the Pacific and, according to some historians, may have shortened the war by about two years.","이런 노력은 태평양에서 수천 명의 목숨을 구했고, 일부 역사학자들에 따르면 전쟁을 약 2년 단축시켰을 수도 있다."],[10,"Not until the book called Code Girls was published did their story become known to the world.","《코드 걸스》라는 책이 출간되고 나서야 비로소 그들의 이야기가 세상에 알려졌다."]],"w":"6번 문장에서 육군과 해군에 들어간 여성들이 일본군 암호를 푸는 훈련을 받았다고 해 ①이 정답. ②는 5번에서 남성들이 전투하러 멀리 나가 있었다, ③은 9번에서 전쟁을 단축시켰을 수도 있다, ④는 10번에서 책이 나오고서야 알려졌다고 해 틀림.","c":1},"h":"860211cdb8"},{"n":9,"t":"sum","q":"The women listened to enemy radio messages and looked for repeated (A), and they even helped create (B) messages to trick the enemy.","ko":"여성들은 적의 무전 메시지를 듣고 반복되는 (A)를 찾았고, 적을 속이기 위한 (B) 메시지를 만드는 것을 돕기도 했다.","oko":["(A) 지도 / (B) 진짜","(A) 기호 / (B) 진짜","(A) 기호 / (B) 가짜","(A) 지도 / (B) 가짜","(A) 숫자 / (B) 실제"],"opts":["(A) maps / (B) true","(A) symbols / (B) true","(A) symbols / (B) false","(A) maps / (B) false","(A) numbers / (B) real"],"r":{"a":"3) (A) symbols / (B) false","ev":"7~8번 문장","s":[[7,"They listened to enemy radio messages and looked for repeated symbols and secret clues.","그들은 적의 무전 메시지를 듣고 반복되는 기호와 비밀 단서를 찾았다."],[8,"They even helped create false messages to trick the enemy.","그들은 심지어 적을 속이기 위한 가짜 메시지를 만드는 것을 돕기도 했다."]],"w":"7번 문장에서 repeated symbols(반복되는 기호)를 찾았고, 8번 문장에서 적을 속이려고 false messages(가짜 메시지)를 만드는 것을 도왔음. 진짜(true, real) 메시지로는 적을 속일 수 없고, 지도는 본문에 없음.","c":3},"h":"69d3c78e48"},{"n":10,"t":"fill","q":"These efforts saved thousands of [A] in the Pacific, and today the women are remembered as brave and [B] women.","ko":"이런 노력은 태평양에서 수천 명의 [A]을 구했고, 오늘날 그 여성들은 용감하고 [B] 여성들로 기억된다.","bank":["lives","brilliant","codes","symbols","radio","silence"],"bko":{"lives":"목숨, 생명","brilliant":"뛰어난","codes":"암호","symbols":"기호","silence":"침묵","radio":"무전, 라디오"},"r":{"a":"[A] lives, [B] brilliant","ev":"9, 11번 문장","s":[[9,"These efforts saved thousands of lives in the Pacific and, according to some historians, may have shortened the war by about two years.","이런 노력은 태평양에서 수천 명의 목숨을 구했고, 일부 역사학자들에 따르면 전쟁을 약 2년 단축시켰을 수도 있다."],[11,"Today, they are remembered as brave and brilliant women who helped win the war in silence.","오늘날 그들은 조용히 전쟁을 승리로 이끄는 데 도움을 준 용감하고 뛰어난 여성들로 기억된다."]],"w":"9번 문장 saved thousands of lives, 11번 문장 brave and brilliant women에서 가져옴. codes, symbols는 암호를 푸는 일(6~7번), radio는 무전, silence는 11번 끝 in silence에 쓰인 말이라 이 빈칸에는 맞지 않음.","c":null},"h":"8cf7e028fb"}]},{"u":10,"id":"b3-10-2","no":2,"ko":"보스턴 거리를 덮친 끈적끈적한 파도의 정체는?","items":[{"n":1,"t":"tf","q":"The molasses tank exploded at 12:40 p.m. on January 15.","ko":"당밀 탱크는 1월 15일 오후 12시 40분에 폭발했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"At 12:40 p.m. on January 15, the tank exploded!","1월 15일 오후 12시 40분, 탱크가 폭발했다!"]],"w":"6번 문장에 At 12:40 p.m. on January 15, the tank exploded!가 나옴. 본문과 일치.","c":"T"},"h":"be2418a2c1"},{"n":2,"t":"tf","q":"The company that owned the tank fixed the problem when it heard strange noises.","ko":"탱크를 소유한 회사는 이상한 소리를 들었을 때 문제를 고쳤다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The tank began to produce strange noises, but the company that owned it ignored these danger signs.","탱크가 이상한 소리를 내기 시작했지만, 그것을 소유한 회사는 이런 위험 신호를 무시했다."]],"w":"5번 문장에서 회사는 이런 위험 신호를 무시했다(ignored)고 함. 문제를 고쳤다는 말과 반대.","c":"F"},"h":"80cb445bb2"},{"n":3,"t":"tf","q":"The disaster killed 150 people and injured 21.","ko":"그 참사로 150명이 죽고 21명이 다쳤다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Unfortunately, the disaster killed 21 people and injured 150.","안타깝게도, 이 참사로 21명이 죽고 150명이 다쳤다."]],"w":"10번 문장에서 21명이 죽고 150명이 다쳤다고 함. 숫자가 서로 바뀌어 있어서 본문과 다름.","c":"F"},"h":"9d988c6655"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The 4.5-meter-high wave trapped horses and people...)","ko":"높이 4.5미터의 파도가 말과 사람들을 가두었고...","opts":["구했다","도왔다","가두었다","따라갔다"],"word":"trapped","r":{"a":"3) 가두었다","ev":"9번 문장","s":[[9,"The 4.5-meter-high wave trapped horses and people, and fire even broke out in the city.","높이 4.5미터의 파도가 말과 사람들을 가두었고, 도시에는 화재까지 발생했다."]],"w":"9번 문장은 거대한 당밀 파도가 말과 사람들을 꼼짝 못 하게 덮친 상황이라 trap = 가두다. 바로 뒤 10~11번에서 피해와 구조가 어려웠다는 내용과 이어짐.","c":3},"h":"bd7b483994"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the company that owned it ignored these danger signs.)","ko":"... 그것을 소유한 회사는 이런 위험 신호를 무시했다.","opts":["알아차렸다","고쳤다","설명했다","무시했다"],"word":"ignored","r":{"a":"4) 무시했다","ev":"5번 문장","s":[[5,"The tank began to produce strange noises, but the company that owned it ignored these danger signs.","탱크가 이상한 소리를 내기 시작했지만, 그것을 소유한 회사는 이런 위험 신호를 무시했다."]],"w":"5번 문장은 탱크가 이상한 소리를 내는데도 회사가 신경 쓰지 않은 상황이고, 이어서 폭발(6번)이 일어남. ignore = 무시하다.","c":4},"h":"87ec3a6c28"},{"n":6,"t":"ref","q":"What does the underlined \"these danger signs\" refer to?\n…the company that owned it ignored these danger signs.","ko":"밑줄 친 these danger signs가 가리키는 것은?","sko":"… 그것을 소유한 회사는 이런 위험 신호를 무시했다.","opts":["당밀이 거리로 쏟아진 것","날씨가 따뜻해진 것","내부 압력이 오르고 탱크가 이상한 소리를 낸 것","구조 작업이 어려워진 것"],"r":{"a":"3) 내부 압력이 오르고 탱크가 이상한 소리를 낸 것","ev":"4~5번 문장","s":[[4,"As the gas filled the tank, the internal pressure rose.","가스가 탱크를 채우면서 내부 압력이 올라갔다."],[5,"The tank began to produce strange noises, but the company that owned it ignored these danger signs.","탱크가 이상한 소리를 내기 시작했지만, 그것을 소유한 회사는 이런 위험 신호를 무시했다."]],"w":"4번 문장의 내부 압력 상승과 5번 문장의 탱크의 이상한 소리가 폭발 전 위험 신호. 거리로 쏟아진 일과 구조 작업은 폭발 뒤에 일어난 일이라 신호가 될 수 없음.","c":3},"h":"088b597e2e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The sticky liquid also made rescue efforts extremely difficult.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"끈적끈적한 액체는 구조 작업도 매우 어렵게 만들었다.","opts":["끈적끈적한 액체 덕분에 구조 작업이 더 빨라졌다.","구조 작업이 시작되기도 전에 액체가 모두 말라 버렸다.","끈적끈적한 액체는 구조 작업과 아무 상관이 없었다.","끈적끈적한 액체 때문에 구조 작업이 매우 힘들어졌다."],"r":{"a":"4) 끈적끈적한 액체 때문에 구조 작업이 매우 힘들어졌다.","ev":"11번 문장","s":[[11,"The sticky liquid also made rescue efforts extremely difficult.","끈적끈적한 액체는 구조 작업도 매우 어렵게 만들었다."]],"w":"made A difficult는 ‘A를 어렵게 만들었다’. 끈적끈적한 액체가 구조를 방해했다는 뜻. 빨라졌다거나 말라 버렸다는 말은 본문에 없음.","c":4},"h":"1e87949987"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["탱크는 7월에 폭발했다.","당밀은 시속 56킬로미터로 거리에 쏟아져 나왔다.","탱크는 1919년에 지어졌다.","거리를 청소하는 데는 몇 시간밖에 걸리지 않았다."],"opts":["The tank exploded in July.","The molasses flooded the streets at 56 kilometers per hour.","The tank was built in 1919.","It took only a few hours to clean the streets."],"r":{"a":"2) The molasses flooded the streets at 56 kilometers per hour.","ev":"1, 6, 8, 12번 문장","s":[[1,"Near the harbor in Boston, Massachusetts, a huge tank was built in 1915 to store a sticky liquid known as molasses.","1915년 매사추세츠주 보스턴의 항구 근처에, 당밀이라고 알려진 끈적끈적한 액체를 저장하기 위한 거대한 탱크가 세워졌다."],[6,"At 12:40 p.m. on January 15, the tank exploded!","1월 15일 오후 12시 40분, 탱크가 폭발했다!"],[8,"Over 9,500 tons of molasses flooded the streets at 56 kilometers per hour.","9,500톤이 넘는 당밀이 시속 56킬로미터로 거리에 쏟아져 나왔다."],[12,"It took weeks to clean the streets and repair the damage.","거리를 청소하고 피해를 복구하는 데 몇 주가 걸렸다."]],"w":"8번 문장에 flooded the streets at 56 kilometers per hour가 있어 ②가 정답. ①은 6번에서 1월 15일, ③은 1번에서 1915년, ④는 12번에서 몇 주가 걸렸다고 해 틀림.","c":2},"h":"ba15748e26"},{"n":9,"t":"sum","q":"The warm weather caused the molasses to create a lot of (A), so the (B) inside the tank rose.","ko":"따뜻한 날씨 때문에 당밀이 많은 (A)를 만들어 냈고, 그래서 탱크 안의 (B)이 올라갔다.","oko":["(A) 연기 / (B) 압력","(A) 가스 / (B) 무게","(A) 물 / (B) 압력","(A) 연기 / (B) 소음","(A) 가스 / (B) 압력"],"opts":["(A) smoke / (B) pressure","(A) gas / (B) weight","(A) water / (B) pressure","(A) smoke / (B) noise","(A) gas / (B) pressure"],"r":{"a":"5) (A) gas / (B) pressure","ev":"3~4번 문장","s":[[3,"This heat caused the sugary molasses to break down and create a lot of gas.","이 열기 때문에 달콤한 당밀이 분해되어 많은 가스가 생겨났다."],[4,"As the gas filled the tank, the internal pressure rose.","가스가 탱크를 채우면서 내부 압력이 올라갔다."]],"w":"3번 문장에서 and comfortable.","ko":"아돌프 픽 박사가 만든 최초의 콘택트렌즈는 부드럽고 편안했다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"Unfortunately, they were made of heavy glass and covered the entire eye, so they were very uncomfortable.","안타깝게도 그것들은 무거운 유리로 만들어졌고 눈 전체를 덮었기 때문에 매우 불편했다."],[11,"Finally, in the 1900s, plastic helped create soft, comfortable contact lenses.","마침내 1900년대에 플라스틱이 부드럽고 편안한 콘택트렌즈를 만드는 데 도움이 되었다."]],"w":"10번 문장에서 최초의 렌즈는 무거운 유리로 만들어져 매우 불편했다고 함. 부드럽고 편안한 렌즈는 11번에서 1900년대 플라스틱 덕분에 나옴.","c":"F"},"h":"1ac199d5f4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...things that were blurry to his eyes became clear.)","ko":"... 그의 눈에 흐릿했던 것들이 선명해졌다.","opts":["선명한","흐릿한","밝은","거대한"],"word":"blurry","r":{"a":"2) 흐릿한","ev":"2번 문장","s":[[2,"In the 1500s, when Leonardo da Vinci looked through a bowl of water, things that were blurry to his eyes became clear.","1500년대에 레오나르도 다 빈치가 물이 담긴 그릇을 통해 보았을 때, 그의 눈에 흐릿했던 것들이 선명해졌다."]],"w":"2번 문장에서 물 그릇을 통해 보자 ‘blurry’했던 것이 clear(선명한)해졌다고 하니 blurry는 clear의 반대인 흐릿한.","c":2},"h":"b5f488cfc2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...they were very uncomfortable.)","ko":"... 그것들은 매우 불편했다.","opts":["편안한","투명한","불편한","가벼운"],"word":"uncomfortable","r":{"a":"3) 불편한","ev":"10번 문장","s":[[10,"Unfortunately, they were made of heavy glass and covered the entire eye, so they were very uncomfortable.","안타깝게도 그것들은 무거운 유리로 만들어졌고 눈 전체를 덮었기 때문에 매우 불편했다."]],"w":"10번 문장에서 무거운 유리가 눈 전체를 덮었으니 불편했다는 뜻. comfortable(편안한)에 un-이 붙어 반대가 됨. 11번에서 플라스틱 렌즈가 ‘편안하다’고 한 것과 대비.","c":3},"h":"b415800198"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was supposed to sit right on the eye.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 눈 바로 위에 올려놓도록 되어 있었다.","opts":["다 빈치의 아이디어","1888년의 콘택트렌즈","플라스틱 렌즈","물로 채운 망원경 모양의 장치"],"r":{"a":"4) 물로 채운 망원경 모양의 장치","ev":"6~7번 문장","s":[[6,"He designed a telescope-shaped device filled with water.","그는 물로 채운 망원경 모양의 장치를 설계했다."],[7,"It was supposed to sit right on the eye.","그것은 눈 바로 위에 올려놓도록 되어 있었다."]],"w":"7번 It은 바로 앞 6번에서 데카르트가 설계한 물로 채운 망원경 모양의 장치(a telescope-shaped device filled with water). 눈 위에 올려놓는 것은 이 장치.","c":4},"h":"a1ab370030"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But it was never more than an idea because the design didn’t allow people to blink.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그 설계는 사람들이 눈을 깜박일 수 없게 했기 때문에 아이디어에 불과했을 뿐이었다.","opts":["그 설계는 사람들이 눈을 깜박일 수 없었기 때문에 아이디어에만 머물렀다.","그 설계는 너무 훌륭해서 많은 사람이 곧바로 사용하게 되었다.","사람들이 눈을 깜박일 수 있어서 설계가 완성되었다.","그 아이디어는 설계가 나오기 전에 이미 널리 쓰이고 있었다."],"r":{"a":"1) 그 설계는 사람들이 눈을 깜박일 수 없었기 때문에 아이디어에만 머물렀다.","ev":"8번 문장","s":[[8,"But it was never more than an idea because the design didn’t allow people to blink.","하지만 그 설계는 사람들이 눈을 깜박일 수 없게 했기 때문에 아이디어에 불과했을 뿐이었다."]],"w":"never more than an idea는 ‘생각에 불과했다’, because 뒤가 이유. 깜박이지 못해서 실제로 쓰이지 못했다는 뜻. 많은 사람이 사용했다는 말은 본문과 반대.","c":1},"h":"aea8b278e0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["레오나르도 다 빈치가 최초의 콘택트렌즈를 만들었다.","르네 데카르트는 1500년대에 다 빈치의 아이디어를 발전시켰다.","아돌프 픽 박사의 렌즈는 무거운 유리로 만들어졌다.","플라스틱 콘택트렌즈는 1888년에 등장했다."],"opts":["Leonardo da Vinci made the first contact lenses.","René Descartes developed da Vinci’s idea in the 1500s.","Dr. Adolf Fick’s lenses were made of heavy glass.","Plastic contact lenses appeared in 1888."],"r":{"a":"3) Dr. Adolf Fick’s lenses were made of heavy glass.","ev":"2, 5, 9, 10, 11번 문장","s":[[2,"In the 1500s, when Leonardo da Vinci looked through a bowl of water, things that were blurry to his eyes became clear.","1500년대에 레오나르도 다 빈치가 물이 담긴 그릇을 통해 보았을 때, 그의 눈에 흐릿했던 것들이 선명해졌다."],[5,"In the 1600s, René Descartes developed da Vinci’s idea.","1600년대에 르네 데카르트가 다 빈치의 아이디어를 발전시켰다."],[9,"In 1888, Dr. Adolf Fick made the first contact lenses.","1888년, 아돌프 픽 박사가 최초의 콘택트렌즈를 만들었다."],[10,"Unfortunately, they were made of heavy glass and covered the entire eye, so they were very uncomfortable.","안타깝게도 그것들은 무거운 유리로 만들어졌고 눈 전체를 덮었기 때문에 매우 불편했다."],[11,"Finally, in the 1900s, plastic helped create soft, comfortable contact lenses.","마침내 1900년대에 플라스틱이 부드럽고 편안한 콘택트렌즈를 만드는 데 도움이 되었다."]],"w":"10번 문장에 they were made of heavy glass가 있어 ③이 정답. ①은 9번에서 최초의 렌즈는 픽 박사가 만들었음, ②는 5번에서 데카르트는 1600년대, ④는 11번에서 플라스틱은 1900년대라 틀림.","c":3},"h":"ac6f03d808"},{"n":9,"t":"sum","q":"The first contact lenses of 1888 were made of heavy (A) and covered the whole eye, but (B) helped make soft, comfortable lenses in the 1900s.","ko":"1888년의 최초 콘택트렌즈는 무거운 (A)로 만들어져 눈 전체를 덮었지만, 1900년대에는 (B)이 부드럽고 편안한 렌즈를 만드는 데 도움이 되었다.","oko":["(A) 플라스틱 / (B) 유리","(A) 유리 / (B) 물","(A) 물 / (B) 플라스틱","(A) 플라스틱 / (B) 물","(A) 유리 / (B) 플라스틱"],"opts":["(A) plastic / (B) glass","(A) glass / (B) water","(A) water / (B) plastic","(A) plastic / (B) water","(A) glass / (B) plastic"],"r":{"a":"5) (A) glass / (B) plastic","ev":"10~11번 문장","s":[[10,"Unfortunately, they were made of heavy glass and covered the entire eye, so they were very uncomfortable.","안타깝게도 그것들은 무거운 유리로 만들어졌고 눈 전체를 덮었기 때문에 매우 불편했다."],[11,"Finally, in the 1900s, plastic helped create soft, comfortable contact lenses.","마침내 1900년대에 플라스틱이 부드럽고 편안한 콘택트렌즈를 만드는 데 도움이 되었다."]],"w":"10번 문장에서 최초의 렌즈는 heavy glass(무거운 유리)로 만들어졌고, 11번 문장에서 1900년대에 plastic(플라스틱)이 편안한 렌즈를 만드는 데 도움이 됨. 물은 다 빈치와 데카르트 시대(2, 6번)에 나온 재료.","c":5},"h":"c8828d831e"},{"n":10,"t":"fill","q":"Leonardo da Vinci realized that [A] could bend light, and René Descartes designed a [B]-shaped device filled with water.","ko":"레오나르도 다 빈치는 [A]이 빛을 굴절시킬 수 있다는 것을 깨달았고, 르네 데카르트는 물로 채운 [B] 모양의 장치를 설계했다.","bank":["water","telescope","blink","vision","century","invention"],"bko":{"water":"물","telescope":"망원경","blink":"눈을 깜박이다","vision":"시력","century":"세기, 100년","invention":"발명품"},"r":{"a":"[A] water, [B] telescope","ev":"3, 6번 문장","s":[[3,"He realized that water could bend light to help the eye focus.","그는 물이 빛을 굴절시켜 눈이 초점을 맞추는 것을 도울 수 있다는 것을 깨달았다."],[6,"He designed a telescope-shaped device filled with water.","그는 물로 채운 망원경 모양의 장치를 설계했다."]],"w":"3번 문장 water could bend light, 6번 문장 a telescope-shaped device filled with water에서 가져옴. blink는 8번에서 깜박이지 못한 문제, vision은 4번 렌즈의 목적, century와 invention은 1번에서 나온 말이라 이 빈칸에는 맞지 않음.","c":null},"h":"299c18b7c8"}]},{"u":10,"id":"b3-10-4","no":4,"ko":"지도도 GPS도 없이 태평양을 건넌 사람들","items":[{"n":1,"t":"tf","q":"People from Southeast Asia moved across the Pacific Ocean around 3000 BCE to find new land.","ko":"동남아시아에서 온 사람들은 기원전 3000년경 새로운 땅을 찾아 태평양을 건너 이동했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Around 3000 BCE, people from Southeast Asia moved across the Pacific Ocean to find new land.","기원전 3000년경, 동남아시아에서 온 사람들이 새로운 땅을 찾아 태평양을 건너 이동했다."]],"w":"1번 문장에 Around 3000 BCE, people from Southeast Asia moved across the Pacific Ocean to find new land가 있음. 본문과 일치.","c":"T"},"h":"f141b20be1"},{"n":2,"t":"tf","q":"Polynesians used maps and GPS to find their way.","ko":"폴리네시아인들은 길을 찾기 위해 지도와 GPS를 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"They had no maps or GPS.","그들에게는 지도도 GPS도 없었다."],[8,"Instead, they followed the stars, ocean waves, and seabirds to find their way.","그 대신, 그들은 길을 찾기 위해 별과 바다의 파도, 바닷새를 따라갔다."]],"w":"7번 문장에서 지도도 GPS도 없었다(had no maps or GPS)고 하고, 8번에서 대신 별과 파도, 바닷새를 따라갔다고 함. 지도와 GPS를 썼다는 말과 반대.","c":"F"},"h":"7b8459b2f8"},{"n":3,"t":"tf","q":"The Polynesian Triangle includes only three islands.","ko":"폴리네시아 삼각형에는 세 개의 섬만 포함되어 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"These three islands mark the corners of a huge region called the Polynesian Triangle.","이 세 섬은 폴리네시아 삼각형이라고 불리는 거대한 지역의 꼭짓점을 이룬다."],[12,"This area includes over a thousand islands.","이 지역에는 천 개가 넘는 섬이 포함되어 있다."]],"w":"11번 문장에서 세 섬은 삼각형의 꼭짓점일 뿐이고, 12번 문장에서 그 지역에는 천 개가 넘는 섬이 포함된다고 함. 세 개뿐이라는 말은 틀림.","c":"F"},"h":"8cf85db254"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (As their population grew, Polynesians sailed east to find more islands.)","ko":"인구가 늘어나자, 폴리네시아인들은 더 많은 섬을 찾아 동쪽으로 항해했다.","opts":["문화","인구","언어","기후"],"word":"population","r":{"a":"2) 인구","ev":"5번 문장","s":[[5,"As their population grew, Polynesians sailed east to find more islands.","인구가 늘어나자, 폴리네시아인들은 더 많은 섬을 찾아 동쪽으로 항해했다."]],"w":"5번 문장은 ‘늘어나자 더 많은 섬을 찾아 나섰다’는 원인이라 population = 인구. 사람이 많아져 살 곳이 더 필요했다는 흐름.","c":2},"h":"2b0e350892"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They eventually reached Hawaii around 950 CE...)","ko":"그들은 결국 서기 950년경 하와이에 도달했다...","opts":["갑자기","거의","가끔","결국"],"word":"eventually","r":{"a":"4) 결국","ev":"10번 문장","s":[[10,"They eventually reached Hawaii around 950 CE, Easter Island by 1000 CE, and New Zealand by 1300 CE.","그들은 결국 서기 950년경 하와이에, 1000년까지 이스터 섬에, 1300년까지 뉴질랜드에 도달했다."]],"w":"10번 문장은 섬에서 섬으로 오랫동안 이동한 뒤 마침내 닿았다는 뜻이라 eventually = 결국. 9번의 오랜 이동에 이어지는 말.","c":4},"h":"8a4eff470d"},{"n":6,"t":"ref","q":"What does the underlined \"These three islands\" refer to?\nThese three islands mark the corners of a huge region called the Polynesian Triangle.","ko":"밑줄 친 These three islands가 가리키는 것은?","sko":"이 세 섬은 폴리네시아 삼각형이라고 불리는 거대한 지역의 꼭짓점을 이룬다.","opts":["하와이, 이스터 섬, 뉴질랜드","통가, 사모아, 하와이","하와이, 통가, 뉴질랜드","이스터 섬, 사모아, 뉴질랜드"],"r":{"a":"1) 하와이, 이스터 섬, 뉴질랜드","ev":"10~11번 문장","s":[[10,"They eventually reached Hawaii around 950 CE, Easter Island by 1000 CE, and New Zealand by 1300 CE.","그들은 결국 서기 950년경 하와이에, 1000년까지 이스터 섬에, 1300년까지 뉴질랜드에 도달했다."],[11,"These three islands mark the corners of a huge region called the Polynesian Triangle.","이 세 섬은 폴리네시아 삼각형이라고 불리는 거대한 지역의 꼭짓점을 이룬다."]],"w":"11번의 These three islands는 바로 앞 10번에 나온 Hawaii, Easter Island, New Zealand. 통가와 사모아는 2번에서 먼저 도착한 섬이라 세 꼭짓점이 아님.","c":1},"h":"f34715d5c0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead, they followed the stars, ocean waves, and seabirds to find their way.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 대신, 그들은 길을 찾기 위해 별과 바다의 파도, 바닷새를 따라갔다.","opts":["그들은 길을 찾기 위해 지도와 GPS를 사용했다.","그들은 별과 파도와 바닷새를 피해서 항해했다.","그 대신, 그들은 길을 찾을 때 별과 파도와 바닷새를 따라갔다.","그들은 길을 찾을 때 이웃 섬 사람들에게 길을 물었다."],"r":{"a":"3) 그 대신, 그들은 길을 찾을 때 별과 파도와 바닷새를 따라갔다.","ev":"7~8번 문장","s":[[7,"They had no maps or GPS.","그들에게는 지도도 GPS도 없었다."],[8,"Instead, they followed the stars, ocean waves, and seabirds to find their way.","그 대신, 그들은 길을 찾기 위해 별과 바다의 파도, 바닷새를 따라갔다."]],"w":"Instead는 앞 문장(지도도 GPS도 없었다)을 받아 ‘그 대신’, follow(따라가다)의 과거형 followed는 ‘따라갔다’. 지도와 GPS는 7번에서 없었다고 했고, 피했다거나 이웃에게 물었다는 말은 본문에 없음.","c":3},"h":"a460b5ebfc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["폴리네시아인들은 더 많은 섬을 찾아 서쪽으로 항해했다.","폴리네시아인들은 큰 파도를 견딜 수 있는 카누를 사용했다.","폴리네시아 삼각형에는 열 개도 안 되는 섬이 있다.","폴리네시아인들은 통가에 닿기 전에 이스터 섬에 도달했다."],"opts":["Polynesians sailed west to find more islands.","Polynesians used canoes that could handle big waves.","The Polynesian Triangle includes fewer than ten islands.","Polynesians reached Easter Island before they reached Tonga."],"r":{"a":"2) Polynesians used canoes that could handle big waves.","ev":"2, 5, 6, 10, 12번 문장","s":[[2,"By 1000 BCE, their families reached Tonga and Samoa in the western Pacific.","기원전 1000년까지, 그들의 가족은 서태평양의 통가와 사모아에 도달했다."],[5,"As their population grew, Polynesians sailed east to find more islands.","인구가 늘어나자, 폴리네시아인들은 더 많은 섬을 찾아 동쪽으로 항해했다."],[6,"They used double-hulled canoes that could handle big waves.","그들은 큰 파도를 견딜 수 있는 이중 선체의 카누를 사용했다."],[10,"They eventually reached Hawaii around 950 CE, Easter Island by 1000 CE, and New Zealand by 1300 CE.","그들은 결국 서기 950년경 하와이에, 1000년까지 이스터 섬에, 1300년까지 뉴질랜드에 도달했다."],[12,"This area includes over a thousand islands.","이 지역에는 천 개가 넘는 섬이 포함되어 있다."]],"w":"6번 문장에 They used double-hulled canoes that could handle big waves가 있어 ②가 정답. ①은 5번에서 동쪽, ③은 12번에서 천 개가 넘는 섬, ④는 2번 통가가 먼저, 10번 이스터 섬이 나중이라 틀림.","c":2},"h":"6b94db6195"},{"n":9,"t":"sum","q":"Polynesians used (A) canoes that could handle big waves, and they found their way by following the stars, waves, and (B).","ko":"폴리네시아인들은 큰 파도를 견딜 수 있는 (A) 카누를 사용했고, 별과 파도, (B)를 따라 길을 찾았다.","oko":["(A) 작은 / (B) 지도","(A) 이중 선체의 / (B) GPS","(A) 작은 / (B) 바닷새","(A) 이중 선체의 / (B) 지도","(A) 이중 선체의 / (B) 바닷새"],"opts":["(A) small / (B) maps","(A) double-hulled / (B) GPS","(A) small / (B) seabirds","(A) double-hulled / (B) maps","(A) double-hulled / (B) seabirds"],"r":{"a":"5) (A) double-hulled / (B) seabirds","ev":"6, 8번 문장","s":[[6,"They used double-hulled canoes that could handle big waves.","그들은 큰 파도를 견딜 수 있는 이중 선체의 카누를 사용했다."],[8,"Instead, they followed the stars, ocean waves, and seabirds to find their way.","그 대신, 그들은 길을 찾기 위해 별과 바다의 파도, 바닷새를 따라갔다."]],"w":"6번 문장의 double-hulled canoes(이중 선체의 카누)와 8번 문장의 stars, ocean waves, and seabirds(바닷새)에서 가져옴. 지도와 GPS는 7번에서 없었다고 했고, 작은 카누라는 말은 본문에 없음.","c":5},"h":"39e8cfe9e4"},{"n":10,"t":"fill","q":"These three islands mark the [A] of a huge region called the Polynesian Triangle, and their amazing journey shows how [B] can change history.","ko":"이 세 섬은 폴리네시아 삼각형이라는 거대한 지역의 [A]을 이루고, 그들의 놀라운 여정은 [B]가 역사를 바꿀 수 있음을 보여 준다.","bank":["corners","courage","canoes","maps","waves","stars"],"bko":{"corners":"꼭짓점","courage":"용기","canoes":"카누","maps":"지도","waves":"파도","stars":"별"},"r":{"a":"[A] corners, [B] courage","ev":"11, 15번 문장","s":[[11,"These three islands mark the corners of a huge region called the Polynesian Triangle.","이 세 섬은 폴리네시아 삼각형이라고 불리는 거대한 지역의 꼭짓점을 이룬다."],[15,"Their amazing journey shows us how courage can change history.","그들의 놀라운 여정은 용기가 어떻게 역사를 바꿀 수 있는지 우리에게 보여 준다."]],"w":"11번 문장 mark the corners of a huge region, 15번 문장 how courage can change history에서 가져옴. canoes는 6번 배, maps는 7번에서 없었던 것, waves와 stars는 8번 길 찾기에 쓰인 자연의 단서라 이 빈칸에는 맞지 않음.","c":null},"h":"fc393563c5"}]}];

async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
