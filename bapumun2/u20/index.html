alse, "why": "Who는 '누구'라는 뜻이라서 의미가 통하지 않아요."}], "pencil": "때를 나타내는 접속사 ___ 뒤에는 「주어 + 동사」가 온다", "pencilKey": "When", "page": 199, "sec": "s1"}, {"id": "S1-03", "step": 1, "no": 3, "qtype": "유형 01 시간을 나타내는 접속사", "type": "mc", "ans": "②", "concept": ["014", "041", "042"], "gap": "", "words": [["news", "소식"], ["tell", "말해 주다"], ["come", "오다"]], "h1": "I'll tell him the news 뒤의 when절은 '그가 집에 올 때'라는 뜻이에요. 아직 일어나지 않은 일인데도 when 뒤에서는 동사를 어떻게 쓰는지 떠올려 보세요.", "h2": "때를 나타내는 접속사(when, after, before 등)가 이끄는 절에서는 미래를 말해도 will을 쓰지 않아요. 주어 he는 하나(3인칭 단수)라는 점도 확인하세요.", "why": "when이 이끄는 시간 부사절에서는 미래의 일도 현재시제로 써요. 주어가 he라서 동사에 -s를 붙인 comes(원형 come 오다)가 알맞아요.", "opts": [{"n": "①", "en": "come", "ko": "오다 (동사원형)", "ok": false, "why": "주어 he가 하나라서 동사 끝에 -s가 있어야 해요."}, {"n": "②", "en": "comes", "ko": "온다 (현재형)", "ok": true, "why": "시간 부사절에서 미래를 현재시제로 쓰고, he에 맞게 -s가 붙었어요."}, {"n": "③", "en": "will come", "ko": "올 것이다", "ok": false, "why": "시간 부사절에서는 will을 쓰지 않아요."}, {"n": "④", "en": "came", "ko": "왔다 (과거형)", "ok": false, "why": "앞으로 올 일을 말하는데 과거형이라 시간이 맞지 않아요."}, {"n": "⑤", "en": "has come", "ko": "왔다 (현재완료)", "ok": false, "why": "이미 도착한 일을 말하는 모양이라 '올 때'와 맞지 않아요."}], "pencil": "when 같은 시간 접속사 뒤에서는 미래를 ___ 시제로 쓴다", "pencilKey": "현재", "page": 199, "sec": "s1"}, {"id": "S1-04", "step": 1, "no": 4, "qtype": "유형 01 시간을 나타내는 접속사", "type": "mc", "ans": "④", "concept": ["014", "041", "042"], "gap": "", "words": [["event", "행사"], ["canceled", "취소된다 (원형 cancel 취소하다)"], ["rain", "비가 오다"]], "h1": "When이 이끄는 절의 주어는 it이고, 빈칸에는 '비가 오다'라는 뜻의 동사가 들어가요. 빈칸 앞뒤의 주어와 시제를 확인하세요.", "h2": "주절의 동사 are canceled(원형 cancel 취소하다)는 현재형이에요. 시간 부사절에서는 will을 쓰지 않으니, it(하나)에 맞는 현재형 동사를 찾아보세요.", "why": "'비가 올 때 행사가 취소된다'는 평소에 하는 일이에요. 주어 it에 맞게 동사에 -s를 붙인 rains(원형 rain 비가 오다)가 알맞아요.", "opts": [{"n": "①", "en": "rainy", "ko": "비 오는 (형용사)", "ok": false, "why": "형용사라서 동사 자리에 올 수 없어요."}, {"n": "②", "en": "rain", "ko": "비가 오다 (동사원형)", "ok": false, "why": "주어 it이 하나라서 -s가 필요해요."}, {"n": "③", "en": "will be rainy", "ko": "비가 올 것이다", "ok": false, "why": "시간 부사절에는 will을 쓰지 않아요."}, {"n": "④", "en": "rains", "ko": "비가 온다", "ok": true, "why": "주어 it에 맞는 현재형이라서 알맞아요."}, {"n": "⑤", "en": "will rains", "ko": "비가 올 것이다 (틀린 표현)", "ok": false, "why": "will 뒤에는 동사원형이 와야 해서 will rains는 틀려요."}], "pencil": "주어가 it이면 현재형 동사에 ___을 붙인다", "pencilKey": "-s", "page": 199, "sec": "s1"}, {"id": "S1-05", "step": 1, "no": 5, "qtype": "유형 01 시간을 나타내는 접속사", "type": "mc", "ans": "②", "concept": ["041", "094"], "gap": "", "words": [["snowing", "눈이 오는 것 (원형 snow 눈이 오다)"], ["grow up", "자라다"], ["arrives", "도착한다 (원형 arrive 도착하다)"]], "h1": "밑줄 친 when이 모두 '~할 때'로 풀리는지 하나씩 해석해 보세요. 한 문장만 '언제'라는 질문의 뜻을 품고 있어요.", "h2": "문장 안에서 when이 '~할 때'로 시간을 이어 주면 접속사예요. 'I wonder when he comes(그가 언제 오는지 궁금하다)'처럼 동사 뒤에서 '언제 ~인지'를 말하면 의문사예요.", "why": "②의 when은 '언제 눈이 오기 시작했는지'라는 뜻으로 know(알다)의 목적어가 되는 의문사예요. 나머지는 모두 '~할 때'를 뜻하는 접속사예요.", "opts": [{"n": "①", "en": "It was raining when I went out.", "ko": "내가 나갔을 때 비가 오고 있었다.", "ok": false, "why": "when이 '~할 때'로 시간을 이어 주는 접속사예요."}, {"n": "②", "en": "I don't know when it started snowing.", "ko": "나는 눈이 언제 오기 시작했는지 모른다.", "ok": true, "why": "when이 '언제'라는 뜻으로 know의 목적어 역할을 하는 의문사라서 나머지와 달라요."}, {"n": "③", "en": "I will be a singer when I grow up.", "ko": "나는 자라면 가수가 될 거야.", "ok": false, "why": "when이 '~할 때'로 시간을 이어 주는 접속사예요."}, {"n": "④", "en": "When he arrives, I will tell him the truth.", "ko": "그가 도착하면 나는 그에게 진실을 말할 것이다.", "ok": false, "why": "when이 '~할 때'로 시간을 이어 주는 접속사예요."}, {"n": "⑤", "en": "When I get home, my dog always sits at the door.", "ko": "내가 집에 오면 우리 개는 늘 문 앞에 앉아 있다.", "ok": false, "why": "when이 '~할 때'로 시간을 이어 주는 접속사예요."}], "pencil": "when이 '언제'라는 질문의 뜻이면 ___, '~할 때'이면 접속사", "pencilKey": "의문사", "page": 199, "sec": "s1"}, {"id": "S1-06", "step": 1, "no": 6, "qtype": "유형 01 시간을 나타내는 접속사", "type": "write", "ans": "When [when]", "concept": ["041"], "gap": "", "words": [["feel tired", "피곤하다"], ["get some rest", "휴식을 취하다"], ["rang", "울렸다 (원형 ring 울리다)"], ["turned off", "껐다 (원형 turn off 끄다)"]], "h1": "두 문장 모두 빈칸 뒤에 「주어 + 동사」가 이어져요. '피곤할 때'와 '불을 껐을 때'에 공통으로 쓸 수 있는 말을 떠올려 보세요.", "h2": "첫 문장은 '~할 때 쉬어라', 둘째 문장은 '~했을 때 벨이 울렸다'예요. 두 문장 모두 '때'를 나타내는 접속사 한 단어가 들어가요.", "why": "두 문장 모두 '~할 때'라는 뜻이 필요하므로 접속사 when이 공통으로 들어가요.", "opts": [], "pencil": "'~할 때'라는 뜻의 접속사는 ___", "pencilKey": "when", "page": 199, "sec": "s1"}, {"id": "S1-07", "step": 1, "no": 7, "qtype": "유형 01 시간을 나타내는 접속사", "type": "mc", "ans": "①", "concept": ["041", "094"], "gap": "", "words": [["begin", "시작하다"], ["vacation", "방학"], ["gets dark", "어두워진다 (원형 get 되다)"]], "h1": "〈보기〉의 When does your school begin?에서 When은 '언제'를 묻는 말이에요. 밑줄 친 when이 이와 같은 뜻인 문장을 찾아보세요.", "h2": "when이 '~할 때'로 시간을 이어 주면 접속사, '언제'라는 질문의 뜻이면 의문사예요. 〈보기〉와 같은 쪽의 뜻으로 해석되는 문장을 찾아보세요.", "why": "〈보기〉의 When은 '언제'를 묻는 의문사예요. ①의 when도 '방학이 언제 시작했는지'라는 뜻의 의문사이고, 나머지는 모두 '~할 때'를 뜻하는 접속사예요.", "opts": [{"n": "①", "en": "He asked me when the vacation started.", "ko": "그는 방학이 언제 시작했는지 내게 물었다.", "ok": true, "why": "'언제'라는 뜻의 의문사라서 〈보기〉와 같아요."}, {"n": "②", "en": "When I am late for class, I take a taxi.", "ko": "나는 수업에 늦을 때 택시를 탄다.", "ok": false, "why": "'~할 때'를 뜻하는 접속사라서 〈보기〉와 달라요."}, {"n": "③", "en": "They go home when it gets dark.", "ko": "그들은 어두워지면 집에 간다.", "ok": false, "why": "'~할 때'를 뜻하는 접속사라서 〈보기〉와 달라요."}, {"n": "④", "en": "When he has time, he goes to the movies.", "ko": "그는 시간이 있을 때 영화를 보러 간다.", "ok": false, "why": "'~할 때'를 뜻하는 접속사라서 〈보기〉와 달라요."}, {"n": "⑤", "en": "I'll call you when I get home from work.", "ko": "나는 퇴근해서 집에 오면 네게 전화할게.", "ok": false, "why": "'~할 때'를 뜻하는 접속사라서 〈보기〉와 달라요."}], "pencil": "when이 '언제'라는 질문 뜻이면 ___", "pencilKey": "의문사", "page": 199, "sec": "s1"}, {"id": "S1-08", "step": 1, "no": 8, "qtype": "유형 01 시간을 나타내는 접속사", "type": "write", "ans": "since", "concept": ["054-2", "041", "054"], "gap": "", "words": [["has lived", "살고 있다 (원형 live 살다)"], ["moved", "이사했다 (원형 move 이사하다)"]], "h1": "우리말은 '여기에 이사 온 이후로 저 집에서 살고 있다'예요. 과거의 한 시점부터 지금까지 이어지는 일을 말해요. '~ 이후로'에 해당하는 말을 찾아보세요.", "h2": "주절의 has lived(원형 live 살다)는 현재완료예요. 현재완료와 잘 어울리면서 '~ 이후로'라는 뜻을 가진 접속사는 무엇일까요?", "why": "'~ 이후로'라는 뜻의 접속사 since를 써요. since가 이끄는 절에는 과거의 시작 시점이 오고, 주절에는 현재완료를 써요.", "opts": [], "pencil": "'~ 이후로'라는 뜻의 접속사는 ___", "pencilKey": "since", "page": 199, "sec": "s1"}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 02 조건을 나타내는 접속사", "type": "mc", "ans": "③", "concept": ["042"], "gap": "", "words": [["market", "시장"], ["buy", "사다"], ["fruit", "과일"]], "h1": "'시장에 가면 과일을 살 거야'라는 뜻이에요. 한 가지 일이 일어나면 다른 일을 한다는 관계를 이어 주는 말을 찾아보세요.", "h2": "'만약 ~라면'이라는 조건의 뜻을 가진 접속사가 필요해요. 보기 중에서 그 뜻을 가진 단어는 무엇일까요?", "why": "'시장에 가면'이라는 조건을 나타내므로 '만약 ~라면'이라는 뜻의 If가 알맞아요.", "opts": [{"n": "①", "en": "That", "ko": "~라는 것", "ok": false, "why": "That은 명사절을 이끌어서 '만약'의 뜻이 없어요."}, {"n": "②", "en": "Though", "ko": "비록 ~이지만", "ok": false, "why": "Though는 반대되는 내용을 이어서 '가면 사겠다'와 어울리지 않아요."}, {"n": "③", "en": "If", "ko": "만약 ~라면", "ok": true, "why": "조건을 나타내는 접속사라서 알맞아요."}, {"n": "④", "en": "Until", "ko": "~까지", "ok": false, "why": "Until은 '~까지'라는 뜻이라 조건을 나타내지 못해요."}, {"n": "⑤", "en": "Whether", "ko": "~인지 아닌지", "ok": false, "why": "Whether는 '~인지 아닌지'라는 뜻이라 이 문장에는 어울리지 않아요."}], "pencil": "'만약 ~라면'이라는 뜻의 접속사는 ___", "pencilKey": "if", "page": 200, "sec": "s1"}, {"id": "S1-10", "step": 1, "no": 10, "qtype": "유형 02 조건을 나타내는 접속사", "type": "mc", "ans": "③", "concept": ["014", "041", "042"], "gap": "", "words": [["shopping", "쇼핑, 장보기"], ["finishes", "끝난다 (원형 finish 끝나다)"], ["early", "일찍"]], "h1": "if절은 현재형(finishes, 원형 finish 끝나다)으로 쓰였어요. 주절은 '학교가 일찍 끝나면 나는 쇼핑하러 갈 것이다'라는 앞으로의 일이에요.", "h2": "if가 이끄는 절은 현재형으로 미래를 말하지만, 주절에는 미래를 나타내는 조동사를 써야 해요. 보기에서 미래의 뜻을 만드는 말을 찾아보세요.", "why": "if절은 현재시제로 미래를 나타내지만 주절은 앞으로의 일이므로 will go가 알맞아요.", "opts": [{"n": "①", "en": "go", "ko": "가다 (동사원형)", "ok": false, "why": "미래의 뜻이 없어서 '갈 것이다'가 되지 않아요."}, {"n": "②", "en": "going", "ko": "가는 중인", "ok": false, "why": "동사 자리에 -ing만 혼자 올 수 없어요."}, {"n": "③", "en": "will go", "ko": "갈 것이다", "ok": true, "why": "미래를 나타내는 will 뒤에 동사원형이 와서 알맞아요."}, {"n": "④", "en": "goes", "ko": "간다 (3인칭 현재형)", "ok": false, "why": "주어 I에는 goes를 쓰지 않아요."}, {"n": "⑤", "en": "am going to", "ko": "(갈) 예정이다", "ok": false, "why": "뒤에 동사원형이 있어야 해요. 빈칸 뒤 shopping과 연결이 어색해요."}], "pencil": "if절은 현재형, 주절에는 ___를 써서 미래를 말한다", "pencilKey": "will", "page": 200, "sec": "s1"}, {"id": "S1-11", "step": 1, "no": 11, "qtype": "유형 02 조건을 나타내는 접속사", "type": "mc", "ans": "③", "concept": ["042"], "gap": "", "words": [["late", "늦은"], ["catch", "잡다, (버스를) 타다"], ["walk faster", "더 빨리 걷다"]], "h1": "B의 말은 '우리가 더 빨리 걸으면, 버스를 탈 수 있어'예요. 첫 빈칸은 조건을 이어 주는 말, 둘째 빈칸은 그 결과를 말하는 동사 자리예요.", "h2": "'더 빨리 걷는다'는 '버스를 탈 수 있다'를 위한 조건이에요. 앞 빈칸에 알맞은 접속사와 뒤 빈칸의 '~할 수 있다' 표현을 짝지어 보세요.", "why": "'~하면'을 뜻하는 If와, '탈 수 있다'를 뜻하는 can catch(원형 catch 잡다)가 어울려요.", "opts": [{"n": "①", "en": "If - caught", "ko": "만약 ~라면 - 잡았다", "ok": false, "why": "caught는 과거형이라 '탈 수 있다'는 뜻이 되지 않아요."}, {"n": "②", "en": "Before - catch", "ko": "~ 전에 - 잡다", "ok": false, "why": "Before는 '~ 전에'라서 '빨리 걸으면'과 뜻이 맞지 않아요."}, {"n": "③", "en": "If - can catch", "ko": "만약 ~라면 - 탈 수 있다", "ok": true, "why": "조건 접속사와 '~할 수 있다'가 자연스럽게 이어져요."}, {"n": "④", "en": "Unless - will catch", "ko": "만일 ~ 아니라면 - 탈 것이다", "ok": false, "why": "Unless는 '아니라면'이라서 '빨리 걸으면'의 뜻과 반대가 돼요."}, {"n": "⑤", "en": "Unless - can't catch", "ko": "만일 ~ 아니라면 - 탈 수 없다", "ok": false, "why": "'빨리 걸으면'이라는 B의 말과 뜻이 맞지 않아요."}], "pencil": "'~하면'이라는 조건은 ___로 나타낸다", "pencilKey": "if", "page": 200, "sec": "s1"}, {"id": "S1-12", "step": 1, "no": 12, "qtype": "유형 02 조건을 나타내는 접속사", "type": "mc", "ans": "④", "concept": ["042", "092"], "gap": "", "words": [["ring", "반지"], ["believe", "믿다"], ["thirsty", "목마른"], ["attended", "참석했다 (원형 attend 참석하다)"]], "h1": "밑줄 친 if를 하나씩 '만약 ~라면'으로 바꿔 읽어 보세요. 한 문장만 '만약 ~라면'으로 읽으면 어색해요.", "h2": "if는 '만약 ~라면' 말고 또 다른 뜻으로 쓰일 때가 있어요. 동사 뒤에서 목적어 역할을 하는 절을 이끄는 if는 어떤 뜻인지 떠올려 보세요.", "why": "④의 if는 '그가 회의에 참석했는지 아닌지'라는 뜻으로 know(알다)의 목적어가 되는 명사절 접속사예요. 나머지는 모두 '만약 ~라면'을 뜻해요.", "opts": [{"n": "①", "en": "If you don't like the ring, I'll take it.", "ko": "그 반지가 마음에 들지 않으면 내가 가질게.", "ok": false, "why": "'만약 ~라면'을 뜻하는 조건 접속사예요."}, {"n": "②", "en": "They'll believe if you tell them the story.", "ko": "네가 그들에게 이야기해 주면 그들은 믿을 거야.", "ok": false, "why": "'만약 ~라면'을 뜻하는 조건 접속사예요."}, {"n": "③", "en": "If you are thirsty, you can get some drinks.", "ko": "목이 마르면 음료를 가져올 수 있어요.", "ok": false, "why": "'만약 ~라면'을 뜻하는 조건 접속사예요."}, {"n": "④", "en": "Do you know if he attended the meeting?", "ko": "그가 회의에 참석했는지 아니?", "ok": true, "why": "'~인지 아닌지'를 뜻하는 명사절 접속사라서 나머지와 달라요."}, {"n": "⑤", "en": "If you read this book, you'll get to know more about Korean history.", "ko": "이 책을 읽으면 한국 역사에 대해 더 알게 될 거야.", "ok": false, "why": "'만약 ~라면'을 뜻하는 조건 접속사예요."}], "pencil": "know 같은 동사 뒤의 if는 '___'라는 뜻의 명사절을 이끈다", "pencilKey": "~인지 아닌지", "page": 200, "sec": "s1"}, {"id": "S1-13", "step": 1, "no": 13, "qtype": "유형 02 조건을 나타내는 접속사", "type": "mc", "ans": "①", "concept": ["014", "041", "042"], "gap": "", "words": [["apologize", "사과하다"], ["again", "다시"], ["Unless", "만일 ~ 아니라면"]], "h1": "문장은 Unless로 시작하는 부사절과 주절로 이루어져 있어요. Unless 뒤 절의 동사가 미래를 나타내는 자리에서 어떤 모양이어야 하는지 살펴보세요.", "h2": "Unless도 if처럼 조건을 나타내는 접속사라서, 이 접속사가 이끄는 절에서는 미래를 말할 때 쓰는 시제가 정해져 있어요. ①~⑤ 각 부분의 동사 모양을 살펴보세요.", "why": "Unless가 이끄는 조건 부사절에서는 미래를 현재시제로 나타내요. will apologize는 apologizes로 고쳐야 해요.", "opts": [{"n": "①", "en": "will apologize", "ko": "사과할 것이다", "ok": true, "why": "조건 부사절에서는 will을 쓰지 않아요. 현재형으로 고쳐야 해서 어색한 부분이에요."}, {"n": "②", "en": "to me", "ko": "내게", "ok": false, "why": "apologize to me는 '내게 사과하다'라는 자연스러운 표현이에요."}, {"n": "③", "en": "I", "ko": "나는", "ok": false, "why": "주절의 주어라서 맞아요."}, {"n": "④", "en": "see him", "ko": "그를 보다", "ok": false, "why": "won't 뒤에 동사원형이 와서 맞아요."}, {"n": "⑤", "en": "again", "ko": "다시", "ok": false, "why": "문장 끝의 부사로 자연스러워요."}], "pencil": "조건을 나타내는 Unless절에서는 will 대신 ___ 시제를 쓴다", "pencilKey": "현재", "page": 200, "sec": "s1"}, {"id": "S1-14", "step": 1, "no": 14, "qtype": "유형 02 조건을 나타내는 접속사", "type": "write", "ans": "She will give me some advice if she knows my problem.", "concept": ["014", "041", "042"], "gap": "", "words": [["advice", "조언"], ["problem", "문제"], ["knows", "안다 (원형 know 알다)"]], "h1": "문장 속에서 if가 이끄는 절을 먼저 찾아보세요. 그 절 안의 동사 모양이 조건 부사절 규칙에 맞는지 확인하세요.", "h2": "조건을 나타내는 if절에서는 미래의 일도 현재형으로 써요. 주어 she에 맞는 현재형 동사로 고쳐 보세요.", "why": "if절에서는 미래를 현재시제로 나타내요. 그래서 will know를 주어 she에 맞게 knows(원형 know 알다)로 고쳐요.", "opts": [], "pencil": "if절에서는 will을 빼고 ___시제로 쓴다", "pencilKey": "현재", "page": 200, "sec": "s1"}, {"id": "S1-15", "step": 1, "no": 15, "qtype": "유형 02 조건을 나타내는 접속사", "type": "mc", "ans": "②", "concept": ["042"], "gap": "", "words": [["Hurry up", "서둘러라 (원형 hurry 서두르다)"], ["on time", "제시간에"], ["you'll be", "너는 ~일 것이다"]], "h1": "'서둘러라, 그러면 제시간에 도착할 거야'를 '~하면 도착할 거야'로 바꾸는 문제예요. 명령문 뒤의 and는 어떤 관계를 나타내는지 생각해 보세요.", "h2": "명령문 + and는 '~해라, 그러면 …할 거야'라는 조건의 뜻이에요. 이 조건을 나타내는 접속사를 찾아보세요.", "why": "명령문 + and는 '~하면 …할 것이다'라는 뜻이라 조건 접속사 If로 바꿔 쓸 수 있어요.", "opts": [{"n": "①", "en": "Since", "ko": "~ 이후로 / ~이므로", "ok": false, "why": "이유나 시작 시점을 나타내서 '서두르면'과 맞지 않아요."}, {"n": "②", "en": "If", "ko": "만약 ~라면", "ok": true, "why": "'서두르면'이라는 조건을 나타내서 알맞아요."}, {"n": "③", "en": "Unless", "ko": "만일 ~ 아니라면", "ok": false, "why": "'서두르지 않으면'이라는 뜻이 돼서 반대가 돼요."}, {"n": "④", "en": "While", "ko": "~하는 동안", "ok": false, "why": "동시에 하는 일을 나타내서 어울리지 않아요."}, {"n": "⑤", "en": "Though", "ko": "비록 ~이지만", "ok": false, "why": "반대되는 내용을 이어서 뜻이 맞지 않아요."}], "pencil": "'~해라, 그러면 …' 명령문은 ___ 부사절로 바꿀 수 있다", "pencilKey": "조건", "page": 200, "sec": "s1"}, {"id": "S1-16", "step": 1, "no": 16, "qtype": "유형 02 조건을 나타내는 접속사", "type": "mc", "ans": "①", "concept": ["042", "092"], "gap": "", "words": [["sure", "확신하는"], ["drops by", "잠깐 들르다 (원형 drop 떨어뜨리다, drop by 들르다)"], ["guess", "짐작하다"], ["free", "공짜로"]], "h1": "밑줄 친 if를 하나씩 '만약 ~라면'으로 읽어 보세요. 자연스럽게 읽히지 않는 문장이 하나 있어요.", "h2": "'만약'이 아닌 뜻으로 쓰인 if는 '모른다, 묻는다, 확신하지 못한다' 같은 말 뒤에서 자주 보여요. 그런 앞부분이 있는지 보세요.", "why": "①의 if는 '날씨가 좋을지 아닐지'라는 뜻의 명사절 접속사예요. 나머지는 모두 '만약 ~라면'을 뜻하는 조건 접속사예요.", "opts": [{"n": "①", "en": "I'm not sure if the weather will be fine.", "ko": "날씨가 좋을지 잘 모르겠다.", "ok": true, "why": "'~인지 아닌지'를 뜻하는 명사절 접속사라서 나머지와 달라요."}, {"n": "②", "en": "If he drops by the store, give it to him.", "ko": "그가 가게에 들르면 그것을 그에게 줘라.", "ok": false, "why": "'만약 ~라면'이라는 조건이에요."}, {"n": "③", "en": "You can leave now if you want to.", "ko": "원하면 지금 가도 돼.", "ok": false, "why": "'만약 ~라면'이라는 조건이에요."}, {"n": "④", "en": "We can guess the time if we look at the sun.", "ko": "태양을 보면 시간을 짐작할 수 있다.", "ok": false, "why": "'만약 ~라면'이라는 조건이에요."}, {"n": "⑤", "en": "If you buy one, you can get another one free.", "ko": "하나를 사면 하나를 공짜로 받을 수 있다.", "ok": false, "why": "'만약 ~라면'이라는 조건이에요."}], "pencil": "'~인지 아닌지'를 뜻하는 if는 ___절을 이끈다", "pencilKey": "명사", "page": 200, "sec": "s1"}, {"id": "S1-17", "step": 1, "no": 17, "qtype": "유형 02 조건을 나타내는 접속사", "type": "write", "ans": "If you feel sleepy", "concept": ["042"], "gap": "", "words": [["sleepy", "졸린"], ["feel", "느끼다"], ["go to bed", "잠자리에 들다"]], "h1": "주어진 단어 you, if, sleepy, feel로 '졸리면'이라는 부사절을 만들어요. 조건 접속사는 절의 맨 앞에 와요.", "h2": "「접속사 + 주어 + 동사 ...」 순서로 놓고, 느낌을 말하는 feel 뒤에는 상태를 설명하는 형용사 sleepy를 써요.", "why": "조건 접속사 If가 맨 앞에 오고 「주어 + 동사 + 보어」 순서인 If you feel sleepy가 돼요.", "opts": [], "pencil": "조건절은 「___ + 주어 + 동사 ...」 순서로 쓴다", "pencilKey": "접속사", "page": 200, "sec": "s1"}, {"id": "S1-18", "step": 1, "no": 18, "qtype": "유형 02 조건을 나타내는 접속사", "type": "write", "ans": "if you don't want to read it", "concept": ["042"], "gap": "", "words": [["want to", "~하고 싶다"], ["read", "읽다"], ["give", "주다"]], "h1": "'그 책을 읽고 싶지 않다면'이라는 부사절을 만들어요. 단어를 모아 '~라면 + 주어 + 동사' 순서로 놓아 보세요.", "h2": "부정은 don't를 want 앞에 넣고, want 뒤에는 to read가 이어져요. read의 목적어 it은 맨 뒤에 놓아요.", "why": "If가 맨 앞에서 시작해 「if + you + don't want to read + it」 순서가 돼요.", "opts": [], "pencil": "조건절의 부정은 동사 앞에 ___를 넣어 만든다", "pencilKey": "don't", "page": 201, "sec": "s1"}, {"id": "S1-19", "step": 1, "no": 19, "qtype": "유형 02 조건을 나타내는 접속사", "type": "write", "ans": "Unless", "concept": ["042"], "gap": "", "words": [["take good care of", "~을 잘 돌보다"], ["raise", "키우다"], ["should not", "~하면 안 된다"]], "h1": "위 문장의 If ... doesn't take는 '돌보지 않는다면'이에요. 같은 뜻을 부정어 없이 한 단어로 나타내는 접속사를 떠올려 보세요.", "h2": "if ~ not은 '만일 ~ 아니라면'이라는 뜻의 한 단어로 바꿀 수 있어요. 아래 문장의 동사 takes에는 부정어가 없다는 점도 확인하세요.", "why": "if ~ not은 Unless 한 단어와 같아요. Unless에는 이미 '아니라면'의 뜻이 들어 있어서 뒤 절에는 not을 쓰지 않아요.", "opts": [], "pencil": "if ~ not은 한 단어 ___와 같다", "pencilKey": "unless", "page": 201, "sec": "s1"}, {"id": "S1-20", "step": 1, "no": 20, "qtype": "유형 02 조건을 나타내는 접속사", "type": "write", "ans": "unless", "concept": ["042"], "gap": "", "words": [["stay", "머물다"], ["stops raining", "비가 그친다 (원형 stop 멈추다)"], ["if", "만약 ~라면"], ["unless", "만일 ~ 아니라면"]], "h1": "우리말은 '비가 그치지 않는 한'이에요. 괄호 속 두 접속사의 뜻을 비교하고, 문장에 부정어(not)가 있는지 확인하세요.", "h2": "unless는 이미 '~ 아니라면'이라는 부정의 뜻을 품고 있어요. '그치지 않는 한'이라는 뜻을 만드는 쪽은 어느 것일까요?", "why": "'비가 그치지 않는 한'은 '~ 아니라면'이라는 뜻의 unless가 알맞아요. if를 쓰려면 it doesn't stop처럼 not이 있어야 하고, 뜻도 달라져요.", "opts": [], "pencil": "'~ 아니라면'은 not 없이 ___로 쓴다", "pencilKey": "unless", "page": 201, "sec": "s1"}, {"id": "S1-21", "step": 1, "no": 21, "qtype": "유형 03 이유, 양보를 나타내는 접속사", "type": "mc", "ans": "①", "concept": ["093"], "gap": "", "words": [["got up", "일어났다 (원형 get up 일어나다)"], ["missed", "놓쳤다 (원형 miss 놓치다)"], ["got out of", "~에서 내렸다 (원형 get out of 나오다)"], ["was going", "가는 중이었다 (원형 be 이다, go 가다)"]], "h1": "접속사 as는 뜻이 여러 가지예요. 밑줄 친 as를 하나씩 '~ 때문에'와 '~할 때'로 바꿔 읽어 보세요.", "h2": "'~할 때'로 읽으면 자연스러운 문장이 몇 개인지 세어 보세요. 한 문장만 그렇게 읽으면 어색해요.", "why": "①의 as는 '늦게 일어났기 때문에'라는 이유를 나타내요. 나머지는 모두 '~할 때'라는 시간을 나타내는 as예요.", "opts": [{"n": "①", "en": "As I got up late, I missed the train.", "ko": "나는 늦게 일어나서 기차를 놓쳤다.", "ok": true, "why": "as가 '~ 때문에'라는 이유를 나타내서 나머지와 달라요."}, {"n": "②", "en": "She looked at me as I got out of the car.", "ko": "내가 차에서 내릴 때 그녀는 나를 쳐다보았다.", "ok": false, "why": "as가 '~할 때'라는 시간을 나타내요."}, {"n": "③", "en": "I wanted to listen to music as I had lunch.", "ko": "나는 점심을 먹을 때 음악을 듣고 싶었다.", "ok": false, "why": "as가 '~할 때'라는 시간을 나타내요."}, {"n": "④", "en": "As I got on the bus, I said hello to the driver.", "ko": "나는 버스에 탈 때 기사님께 인사했다.", "ok": false, "why": "as가 '~할 때'라는 시간을 나타내요."}, {"n": "⑤", "en": "Yuri called Jinho as he was going to the library.", "ko": "유리는 진호가 도서관에 가는 중에 그에게 전화했다.", "ok": false, "why": "as가 '~할 때'라는 시간을 나타내요."}], "pencil": "as는 '~ 때문에'(이유)와 '~할 때'(___)의 뜻이 있다", "pencilKey": "시간", "page": 201, "sec": "s1"}, {"id": "S1-22", "step": 1, "no": 22, "qtype": "유형 03 이유, 양보를 나타내는 접속사", "type": "write", "ans": "though", "concept": ["043"], "gap": "", "words": [["headache", "두통"], ["break", "휴식"], ["had", "가지고 있었다 (원형 have 가지다)"]], "h1": "원래 문장은 '두통이 있었지만 쉬지 못했다'예요. 두통이 있으면 쉬는 게 보통인데 쉬지 않았다는 점이 힌트예요.", "h2": "반대되는 내용을 이어 주는 접속사는 '비록 ~이지만'이라는 양보를 나타내요. because와 though 중 알맞은 쪽을 골라 보세요.", "why": "'두통이 있었지만(양보) 쉬지 않았다'는 뜻이므로 though가 알맞아요. because를 쓰면 '두통 때문에 쉬지 않았다'가 되어 어색해요.", "opts": [], "pencil": "반대되는 내용을 잇는 '비록 ~이지만'은 ___", "pencilKey": "though", "page": 201, "sec": "s1"}, {"id": "S1-23", "step": 1, "no": 23, "qtype": "유형 03 이유, 양보를 나타내는 접속사", "type": "mc", "ans": "③", "concept": ["043"], "gap": "", "words": [["healthier", "더 건강한 (원형 healthy 건강한)"], ["pocket money", "용돈"], ["save", "모으다, 아끼다"], ["anymore", "더 이상"]], "h1": "빈칸이 있는 절 '나는 더 이상 버스를 타지 않는다'가 뒤 절 '용돈을 모을 수 있다'의 어떤 관계인지 생각해 보세요.", "h2": "버스를 안 타서 돈을 아낄 수 있다는 흐름이에요. 이유를 나타내는 접속사를 찾아보세요.", "why": "버스를 타지 않기 때문에 용돈을 모을 수 있다는 이유가 되므로 '~ 때문에'를 뜻하는 Because가 알맞아요.", "opts": [{"n": "①", "en": "Though", "ko": "비록 ~이지만", "ok": false, "why": "양보를 나타내서 '버스를 안 타지만 용돈을 모을 수 있다'로 뜻이 이상해져요."}, {"n": "②", "en": "Unless", "ko": "만일 ~ 아니라면", "ok": false, "why": "'버스를 타지 않는다면'이 되어 문맥과 맞지 않아요."}, {"n": "③", "en": "Because", "ko": "~ 때문에", "ok": true, "why": "이유를 나타내서 알맞아요."}, {"n": "④", "en": "Before", "ko": "~ 전에", "ok": false, "why": "시간 순서를 나타내서 뜻이 맞지 않아요."}, {"n": "⑤", "en": "So", "ko": "그래서", "ok": false, "why": "So는 앞 절의 결과를 뒤에 이어 말할 때 써서 문장 맨 앞에 두면 어색해요."}], "pencil": "'~ 때문에'라는 이유는 ___로 나타낸다", "pencilKey": "because", "page": 201, "sec": "s1"}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 03 이유, 양보를 나타내는 접속사", "type": "write", "ans": "Even though I have no money", "concept": ["043"], "gap": "", "words": [["even though", "비록 ~이지만"], ["have", "가지고 있다"], ["no money", "돈이 없다"]], "h1": "주어진 말 no, I, even though, have, money로 '돈이 하나도 없지만'이라는 부사절을 만들어요. 접속사를 맨 앞에 두세요.", "h2": "「접속사 + 주어 + 동사 + 목적어」 순서로 놓고, '돈이 없다'는 have no money로 써요.", "why": "Even though는 양보의 접속사라서 맨 앞에 두고 「I + have + no money」를 이어 쓰면 돼요. 문장 첫 글자는 대문자예요.", "opts": [], "pencil": "even though 뒤에는 「주어 + ___」가 온다", "pencilKey": "동사", "page": 201, "sec": "s1"}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 03 이유, 양보를 나타내는 접속사", "type": "mc", "ans": "⑤", "concept": ["043"], "gap": "", "words": [["a pair of gloves", "장갑 한 켤레"], ["lost", "잃어버렸다 (원형 lose 잃다)"], ["looked up to", "존경했다 (원형 look up to 존경하다)"]], "h1": "첫 문장은 '새 장갑을 샀는데 옛 장갑을 잃어버렸다'는 이유 관계, 둘째 문장은 '좋아하지 않았지만 존경했다'는 반대 관계예요.", "h2": "첫째 빈칸에는 이유를 나타내는 접속사, 둘째 빈칸에는 양보를 나타내는 접속사를 넣어 보세요. 순서를 맞춰야 해요.", "why": "첫째는 '옛 장갑을 잃어버려서(이유)'라 because, 둘째는 '좋아하지 않았지만(양보)'이라 Though가 알맞아요.", "opts": [{"n": "①", "en": "until - Although", "ko": "~까지 - 비록 ~이지만", "ok": false, "why": "첫째 빈칸에 until을 쓰면 '잃어버릴 때까지'가 되어 뜻이 맞지 않아요."}, {"n": "②", "en": "though - As", "ko": "비록 ~이지만 - ~ 때문에", "ok": false, "why": "두 접속사의 순서가 서로 바뀌었어요."}, {"n": "③", "en": "because - Since", "ko": "~ 때문에 - ~ 때문에", "ok": false, "why": "둘째 빈칸에는 양보의 접속사가 필요한데 이유의 Since라서 틀려요."}, {"n": "④", "en": "while - When", "ko": "~하는 동안 - ~할 때", "ok": false, "why": "둘 다 시간의 접속사라서 이유와 양보에 맞지 않아요."}, {"n": "⑤", "en": "because - Though", "ko": "~ 때문에 - 비록 ~이지만", "ok": true, "why": "첫째는 이유, 둘째는 양보라서 모두 알맞아요."}], "pencil": "이유는 because, 양보는 ___로 나타낸다", "pencilKey": "though", "page": 201, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "시간 / 조건을 나타내는 접속사", "type": "mc", "ans": "③", "concept": ["041"], "gap": "", "words": [["had lunch", "점심을 먹었다 (원형 have 먹다)"], ["went out", "나갔다 (원형 go out 나가다)"]], "h1": "'~ 후에'를 뜻하는 After 문장을 같은 뜻의 다른 접속사로 바꾸는 문제예요. 두 문장 모두 점심을 먹은 일과 나간 일 중 무엇이 먼저인지 비교해 보세요.", "h2": "After he had lunch, he went out은 점심을 먼저 먹었다는 뜻이에요. 고쳐 쓴 문장은 점심 문장이 앞에 있으니 접속사 뜻이 반대가 되어야 해요.", "why": "After가 붙으면 먼저 일어난 일이 '점심'이에요. 바뀐 문장에서는 점심이 앞에 놓여 있으니 '나가기 전에 점심을 먹었다'가 되는 before가 알맞아요.", "opts": [{"n": "①", "en": "until", "ko": "~까지", "ok": false, "why": "'나갈 때까지'라는 뜻이 되어 맞지 않아요."}, {"n": "②", "en": "when", "ko": "~할 때", "ok": false, "why": "시간 순서가 아니라 동시에 일어나는 때를 말해서 정확한 뜻이 아니에요."}, {"n": "③", "en": "before", "ko": "~ 전에", "ok": true, "why": "'그가 나가기 전에 점심을 먹었다'가 되어 같은 뜻이에요."}, {"n": "④", "en": "after", "ko": "~ 후에", "ok": false, "why": "그대로 쓰면 '나간 후에 점심을 먹었다'가 되어 뜻이 반대예요."}, {"n": "⑤", "en": "since", "ko": "~ 이후로", "ok": false, "why": "'나간 이후로'라는 뜻이 되어 맞지 않아요."}], "pencil": "After A, B는 B 전에 A가 일어난 일이라서 ___로 바꿀 수 있다", "pencilKey": "before", "page": 202, "sec": "s2"}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "시간 / 조건을 나타내는 접속사", "type": "mc", "ans": "⑤", "concept": ["014", "041", "042"], "gap": "", "words": [["wait", "기다리다"], ["cross", "건너다"], ["follow", "따라가다"], ["goes outside", "밖에 나간다 (원형 go 가다)"]], "h1": "밑줄 친 부분을 하나씩 읽으며 시간이나 조건을 나타내는 부사절에서 미래를 어떻게 말하는지 살펴보세요.", "h2": "if나 when이 이끄는 절에는 미래를 말할 때 쓰는 시제가 정해져 있어요. 밑줄 친 절 안의 동사 모양이 그 규칙에 맞는지 보세요.", "why": "⑤의 if절 안에 will go가 있어요. 조건 부사절에서는 미래를 현재시제로 쓰므로 If you go outside가 되어야 해요.", "opts": [{"n": "①", "en": "Let's wait until the sun comes out.", "ko": "해가 나올 때까지 기다리자.", "ok": false, "why": "until절이 현재형이라 알맞아요."}, {"n": "②", "en": "What do you usually do after dinner?", "ko": "너는 보통 저녁 식사 후에 무엇을 하니?", "ok": false, "why": "after 뒤에 명사 dinner가 와서 전치사로 알맞아요."}, {"n": "③", "en": "What do you think she said to me?", "ko": "그녀가 내게 뭐라고 말했다고 생각하니?", "ok": false, "why": "do you think가 끼어든 자연스러운 문장이에요."}, {"n": "④", "en": "We won't cross the river, if the weather is bad.", "ko": "날씨가 나쁘면 우리는 강을 건너지 않을 것이다.", "ok": false, "why": "if절이 현재형 is로 알맞아요."}, {"n": "⑤", "en": "If you will go outside, your dog will follow you.", "ko": "네가 밖에 나가면 네 개가 너를 따라갈 것이다.", "ok": true, "why": "조건 부사절에서 will을 써서 어색해요."}], "pencil": "if절에는 will 대신 ___ 시제를 쓴다", "pencilKey": "현재", "page": 202, "sec": "s2"}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "시간 / 조건을 나타내는 접속사", "type": "mc", "ans": "③", "concept": ["014", "041", "042"], "gap": "", "words": [["forgive", "용서하다"], ["bake", "굽다"], ["drive", "운전하다"], ["went out for a walk", "산책하러 나갔다 (원형 go 가다)"]], "h1": "각 보기의 접속사가 이끄는 절에서 시제가 알맞은지 살펴보세요. 시간·조건 부사절에서 미래는 현재형으로 써요.", "h2": "when, if, before가 이끄는 절에 will이 들어 있는지 보세요. 그리고 while절은 주절과 같은 시제인지 확인하세요.", "why": "③의 if절에 will drive가 쓰여서 어색해요. 조건 부사절에서는 미래를 현재시제로 나타내서 if you drive로 써야 해요.", "opts": [{"n": "①", "en": "Before you arrive, they will be there.", "ko": "네가 도착하기 전에 그들이 거기 있을 것이다.", "ok": false, "why": "before절이 현재형이라 알맞아요."}, {"n": "②", "en": "If she forgives me, I will help her.", "ko": "그녀가 나를 용서하면 내가 그녀를 도울 것이다.", "ok": false, "why": "if절이 현재형이고 주절이 will이라 알맞아요."}, {"n": "③", "en": "We can go there if you will drive the car.", "ko": "네가 그 차를 운전하면 우리는 거기에 갈 수 있다.", "ok": true, "why": "조건절에 will이 있어서 어색해요."}, {"n": "④", "en": "When I finish my homework, it will be dark outside.", "ko": "내가 숙제를 끝낼 때쯤 밖은 어두울 것이다.", "ok": false, "why": "when절이 현재형이라 알맞아요."}, {"n": "⑤", "en": "I baked the cookies while she went out for a walk.", "ko": "그녀가 산책하러 나간 동안 나는 쿠키를 구웠다.", "ok": false, "why": "while절과 주절이 모두 과거라 알맞아요."}], "pencil": "조건을 나타내는 if절에는 ___를 쓰지 않는다", "pencilKey": "will", "page": 202, "sec": "s2"}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "시간 / 조건을 나타내는 접속사", "type": "mc", "ans": "②", "concept": ["041"], "gap": "", "words": [["stopped eating", "먹기를 멈췄다 (원형 stop 멈추다, eat 먹다)"], ["come back", "돌아오다"], ["visited", "방문했다 (원형 visit 방문하다)"], ["plant", "심다"]], "h1": "밑줄 친 When을 하나씩 '~할 때'로 읽어 보세요. 그렇게 읽으면 어색한 문장이 하나 있어요.", "h2": "'언제'라고 묻는 When은 접속사가 아니라 의문사예요. 질문을 만드는 문장이 어느 것인지 보세요.", "why": "②의 When은 '언제 돌아올까?'라고 묻는 의문사예요. 나머지는 모두 '~할 때'를 뜻하는 부사절 접속사예요.", "opts": [{"n": "①", "en": "When I saw him, he stopped eating.", "ko": "내가 그를 봤을 때 그는 먹기를 멈췄다.", "ok": false, "why": "'~할 때'를 뜻하는 접속사예요."}, {"n": "②", "en": "When will Christine come back here?", "ko": "크리스틴은 언제 여기로 돌아올까?", "ok": true, "why": "'언제'를 묻는 의문사라서 나머지와 달라요."}, {"n": "③", "en": "When I came home, Mom was sleeping.", "ko": "내가 집에 왔을 때 엄마는 주무시고 계셨다.", "ok": false, "why": "'~할 때'를 뜻하는 접속사예요."}, {"n": "④", "en": "What was Minju doing when Liam visited her?", "ko": "리암이 그녀를 방문했을 때 민주는 무엇을 하고 있었니?", "ok": false, "why": "when 뒤에 「주어 + 동사」가 이어지는 접속사예요."}, {"n": "⑤", "en": "When spring comes, my father will plant trees.", "ko": "봄이 오면 아버지는 나무를 심으실 것이다.", "ok": false, "why": "'~할 때'를 뜻하는 접속사예요."}], "pencil": "질문의 뜻을 가진 When은 ___이다", "pencilKey": "의문사", "page": 202, "sec": "s2"}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "시간 / 조건을 나타내는 접속사", "type": "mc", "ans": "③, ⑤", "concept": ["014", "041", "042"], "gap": "", "words": [["snow", "눈이 오다"], ["go skiing", "스키 타러 가다"], ["sounds good", "좋게 들린다 (원형 sound 들리다)"], ["tomorrow", "내일"]], "h1": "A의 If it ___ tomorrow는 내일의 일을 말하지만 if가 이끄는 절이에요. 주어 it에 맞는 현재형 표현을 찾아보세요. 정답은 두 개예요.", "h2": "If절에서는 will을 쓰지 않아요. 주어 it에 맞는 현재형을 찾되, 동사를 쓰는 경우와 be동사 뒤에 말을 붙이는 경우를 모두 살펴보세요.", "why": "if절은 미래도 현재형으로 써서 it snows(원형 snow 눈이 오다)나 it is snowy가 알맞아요.", "opts": [{"n": "①", "en": "be snowy", "ko": "눈이 오는 (be + 형용사)", "ok": false, "why": "be동사 원형은 주어 it 뒤에 올 수 없어요."}, {"n": "②", "en": "snow", "ko": "눈이 오다 (동사원형)", "ok": false, "why": "주어 it에는 -s가 붙어야 해요."}, {"n": "③", "en": "snows", "ko": "눈이 온다", "ok": true, "why": "주어 it에 맞는 현재형이에요."}, {"n": "④", "en": "will snow", "ko": "눈이 올 것이다", "ok": false, "why": "조건절에서는 will을 쓰지 않아요."}, {"n": "⑤", "en": "is snowy", "ko": "눈이 오는 상태이다", "ok": true, "why": "주어 it에 맞는 be동사 현재형이에요."}], "pencil": "if절의 미래는 현재형으로 나타내며, 주어 it에는 동사에 ___를 붙인다", "pencilKey": "-s", "page": 202, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "이유, 양보를 나타내는 접속사", "type": "mc", "ans": "④", "concept": ["041", "043", "064"], "gap": "", "words": [["yelled", "소리쳤다 (원형 yell 소리치다)"], ["dishes", "설거지거리"], ["cooked", "요리했다 (원형 cook 요리하다)"], ["broken", "고장 난 (원형 break 고장 내다)"]], "h1": "세 문장의 괄호 안에서 '~ 때문에', '비록 ~이지만', '만약 ~라면' 중 어떤 관계인지 문장마다 정하세요.", "h2": "첫 문장은 '소리쳤는데 못 들었다'(반대), 둘째는 '네가 요리했으니 내가 설거지'(이유), 셋째는 '전화기가 고장 나서 못 했다'(이유)예요.", "why": "첫째는 양보 Though, 둘째는 이유 since, 셋째는 이유 because가 알맞아요.", "opts": [{"n": "①", "en": "If - since - unless", "ko": "만약 - ~ 때문에 - ~ 아니라면", "ok": false, "why": "첫째 If가 '소리치면 못 들었다'가 되어 틀려요."}, {"n": "②", "en": "If - as soon as - because", "ko": "만약 - ~하자마자 - ~ 때문에", "ok": false, "why": "첫째 If와 둘째 as soon as가 모두 틀려요."}, {"n": "③", "en": "Though - since - unless", "ko": "비록 ~이지만 - ~ 때문에 - ~ 아니라면", "ok": false, "why": "셋째 unless가 '고장 나지 않았다면 못 했다'가 되어 틀려요."}, {"n": "④", "en": "Though - since - because", "ko": "비록 ~이지만 - ~ 때문에 - ~ 때문에", "ok": true, "why": "세 문장의 의미 관계에 모두 알맞아요."}, {"n": "⑤", "en": "Though - as soon as - because", "ko": "비록 ~이지만 - ~하자마자 - ~ 때문에", "ok": false, "why": "둘째에서 as soon as는 '요리하자마자 설거지'가 되어 어색해요."}], "pencil": "반대 내용은 though, 이유는 ___와 since로 이어 준다", "pencilKey": "because", "page": 202, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "이유, 양보를 나타내는 접속사", "type": "mc", "ans": "③, ⑤", "concept": ["043"], "gap": "", "words": [["astronomer", "천문학자"], ["discover", "발견하다"], ["secrets", "비밀들 (원형 secret 비밀)"], ["universe", "우주"]], "h1": "빈칸 뒤의 절은 '당신이 우주비행사(천문학자)라도 우주의 모든 비밀을 알아낼 수는 없다'예요. 두 절의 내용이 서로 부딪치는지 확인하세요. 답은 두 개예요.", "h2": "반대되는 내용을 이어 주는 접속사는 '비록 ~이지만'이라는 뜻이에요. 같은 뜻의 단어가 보기에 두 개 있어요.", "why": "두 절이 반대되는 관계라서 '비록 ~이지만'을 뜻하는 Although와 Though가 알맞아요.", "opts": [{"n": "①", "en": "Since", "ko": "~ 때문에", "ok": false, "why": "이유를 나타내서 '천문학자이므로 알아낼 수 없다'가 되어 어색해요."}, {"n": "②", "en": "But", "ko": "그러나", "ok": false, "why": "But은 문장을 이어 주는 접속사라서 뒤에 절이 이어지는 자리에 쓰지 않아요."}, {"n": "③", "en": "Although", "ko": "비록 ~이지만", "ok": true, "why": "양보의 접속사라서 알맞아요."}, {"n": "④", "en": "Because", "ko": "~ 때문에", "ok": false, "why": "이유를 나타내서 뜻이 맞지 않아요."}, {"n": "⑤", "en": "Though", "ko": "비록 ~이지만", "ok": true, "why": "Although와 같은 뜻이라 알맞아요."}], "pencil": "although와 ___는 같은 뜻의 양보 접속사이다", "pencilKey": "though", "page": 202, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "시간 / 조건을 나타내는 접속사", "type": "write", "ans": "They ran away as soon as they saw the bear in the forest.", "concept": ["041", "043", "064"], "gap": "", "words": [["ran away", "도망쳤다 (원형 run away 도망치다)"], ["saw", "보았다 (원형 see 보다)"], ["bear", "곰"]], "h1": "as soon as는 '~하자마자'라는 뜻의 한 덩어리 접속사예요. 곰을 본 일과 도망친 일 중 무엇이 먼저인지 생각해 보세요.", "h2": "문장은 「주어 + 동사 + as soon as + 주어 + 동사」 순서예요. 도망친 문장(They ran away)을 앞에, as soon as 뒤에 곰을 본 내용을 이어 보세요.", "why": "They ran away가 주절이고, as soon as가 이끄는 부사절 they saw the bear가 뒤에 와요. 곰을 보자마자 도망쳤다는 뜻이에요.", "opts": [], "pencil": "'~하자마자'는 ___로 나타낸다", "pencilKey": "as soon as", "page": 203, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "이유, 양보를 나타내는 접속사", "type": "write", "ans": "(1) Because [Since, As] (2) If", "concept": ["043", "042"], "gap": "", "words": [["had a bad cold", "심한 감기에 걸렸다 (원형 have 가지다)"], ["run faster", "더 빨리 달리다"], ["winner", "우승자"]], "h1": "(1)은 '감기에 걸렸다'와 '학교에 가지 않았다'의 관계를, (2)는 '지금보다 조금 더 빨리 달린다'와 '우승자가 된다'의 관계를 따져 보세요.", "h2": "(1)에는 이유의 접속사, (2)에는 조건의 접속사가 어울려요. 각각 어떤 단어일지 떠올려 보세요.", "why": "(1)은 감기에 걸린 것이 학교에 못 간 이유라서 Because(Since, As도 가능)가 알맞아요. (2)는 더 빨리 달리면 우승할 수 있다는 조건이라서 If가 알맞아요.", "opts": [], "pencil": "이유는 because, 조건은 ___로 나타낸다", "pencilKey": "if", "page": 203, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "시간 / 이유 접속사 since", "type": "write", "ans": "since [Since]", "concept": ["054-2", "041", "043"], "gap": "", "words": [["has lived", "살고 있다 (원형 live 살다)"], ["moved", "이사했다 (원형 move 이사하다)"], ["broke", "부러뜨렸다 (원형 break 부러뜨리다)"], ["give up", "포기하다"], ["role", "역할"]], "h1": "첫 문장은 '2015년에 이사 온 이후로 서울에 살고 있다', 둘째 문장은 '다리를 다쳐서 역할을 포기해야 했다'예요. 두 문장 모두에 쓸 수 있는 단어를 찾아보세요.", "h2": "이 접속사는 '~ 이후로'라는 시간의 뜻과 '~ 때문에'라는 이유의 뜻을 둘 다 가질 수 있어요. 어떤 단어일까요?", "why": "since는 '~ 이후로'(시간)와 '~ 때문에'(이유)의 뜻이 모두 있어서 두 문장에 공통으로 들어가요.", "opts": [], "pencil": "'~ 이후로'와 '~ 때문에'를 모두 뜻할 수 있는 접속사는 ___", "pencilKey": "since", "page": 203, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "시간 / 조건을 나타내는 접속사", "type": "write", "ans": "If you exercise regularly", "concept": ["042"], "gap": "", "words": [["exercise", "운동하다"], ["regularly", "규칙적으로"], ["healthy", "건강한"]], "h1": "'규칙적으로 운동해라, 그러면 건강해질 것이다'는 '규칙적으로 운동하면 건강해질 것이다'와 같아요. 접속사와 주어, 동사를 포함해 조건절로 써 보세요.", "h2": "명령문 + and는 If절로 바꿀 수 있어요. 명령문에는 주어가 없으니 you를 넣고, 현재형 동사를 쓰세요.", "why": "명령문의 내용을 if를 이용해 If you exercise regularly로 바꿔요. 조건절은 현재시제로 써요.", "opts": [], "pencil": "명령문, and ...는 ___ you ...로 바꿔 쓴다", "pencilKey": "If", "page": 203, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "시간 / 조건을 나타내는 접속사", "type": "write", "ans": "When I get some allowance, I'll buy new sneakers.", "concept": ["014", "041", "042"], "gap": "", "words": [["allowance", "용돈"], ["sneakers", "운동화"], ["will get", "받을 것이다 (원형 get 받다)"]], "h1": "When이 이끄는 절에서 어색한 부분이 어디인지 찾으세요. 시간을 나타내는 부사절에서 미래는 어떻게 쓰는지 떠올려 보세요.", "h2": "when이 이끄는 시간 부사절 안의 동사 모양이 규칙에 맞는지 확인하고, will get(원형 get 받다) 부분을 살펴보세요.", "why": "시간 부사절에서는 미래의 일도 현재시제로 나타내서 When I will get을 When I get으로 고쳐요.", "opts": [], "pencil": "when절에서 미래는 ___시제로 쓴다", "pencilKey": "현재", "page": 203, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "시간 / 조건을 나타내는 접속사", "type": "write", "ans": "Before", "concept": ["041"], "gap": "", "words": [["finishes", "끝낸다 (원형 finish 끝내다)"], ["goes", "간다 (원형 go 가다)"], ["movies", "영화"]], "h1": "위 문장은 일을 끝낸 뒤에 영화를 보러 간다는 뜻이에요. 아래 문장은 영화를 보러 가기 '전에' 일을 끝낸다는 뜻이 되어야 해요.", "h2": "after 문장과 같은 뜻으로 순서를 뒤집어 쓸 때는 반대 뜻의 접속사를 써요. '~ 전에'를 뜻하는 한 단어를 떠올려 보세요.", "why": "After he finishes his work, he will go to the movies는 '일을 끝낸 뒤에 영화를 보러 간다'는 뜻이에요. 같은 일을 순서만 바꿔 말하면 '영화를 보러 가기 전에 일을 끝낼 것이다'라서 Before를 써요.", "opts": [], "pencil": "after의 반대 뜻으로 '~ 전에'는 ___", "pencilKey": "before", "page": 203, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "이유, 양보를 나타내는 접속사", "type": "write", "ans": "even though", "concept": ["043"], "gap": "", "words": [["strict", "엄격한"], ["like", "좋아하다"], ["even though", "비록 ~이지만"]], "h1": "'매우 엄격한 선생님이지만 많은 학생들이 그를 좋아한다'에서 '~이지만'은 반대되는 내용을 이어요. 두 단어로 된 접속사를 쓰라고 했어요.", "h2": "though의 뜻을 더 강하게 만든 두 단어짜리 접속사를 떠올려 보세요.", "why": "'~이지만'이라는 양보의 뜻이고 두 단어로 쓰라고 했으므로 even though가 알맞아요.", "opts": [], "pencil": "양보의 접속사 though를 강조한 두 단어는 ___", "pencilKey": "even though", "page": 203, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "이유, 양보를 나타내는 접속사", "type": "write", "ans": "As [as]", "concept": ["093"], "gap": "", "words": [["rides", "탄다 (원형 ride 타다)"], ["sings", "부른다 (원형 sing 부르다)"], ["might", "~일지도 모른다"], ["bad", "상한"]], "h1": "첫 문장은 '자전거를 타면서'라는 동시 동작, 둘째 문장은 '상했을지도 모르니까'라는 이유의 뜻이에요. 두 뜻을 모두 가진 접속사를 찾아보세요.", "h2": "as는 '~하면서', '~할 때', '~ 때문에' 등 여러 뜻을 가진 접속사예요. 두 문장 모두에 들어갈 수 있는 한 단어를 떠올려 보세요.", "why": "as는 '~하면서'와 '~ 때문에'의 뜻을 동시에 나타낼 수 있어서 두 빈칸에 공통으로 들어가요.", "opts": [], "pencil": "as는 '~하면서'와 '~ ___'의 뜻을 모두 가진다", "pencilKey": "때문에", "page": 203, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "while과 during 구별", "type": "mc", "ans": "⑤", "concept": ["093-H1", "041"], "gap": "", "words": [["meal", "식사"], ["fell asleep", "잠들었다 (원형 fall 떨어지다, fall asleep 잠들다)"], ["movie", "영화"]], "h1": "빈칸 뒤에 무엇이 오는지 보세요. 첫째 빈칸 뒤에는 「주어 + 동사」, 둘째 빈칸 뒤에는 명사구 the movie가 있어요.", "h2": "while은 접속사라서 뒤에 절이 오고, during은 전치사라서 뒤에 명사(구)가 와요. 두 빈칸을 각각 맞춰 보세요.", "why": "첫째 빈칸 뒤에는 절 we have a meal이 오므로 접속사 while, 둘째 빈칸 뒤에는 명사구 the movie가 오므로 전치사 during이 알맞아요.", "opts": [{"n": "①", "en": "when - while", "ko": "~할 때 - ~하는 동안", "ok": false, "why": "둘째 빈칸 뒤에 명사구가 오는데 while은 접속사라서 틀려요."}, {"n": "②", "en": "during - for", "ko": "~ 동안 - ~ 동안", "ok": false, "why": "첫째 빈칸 뒤에 절이 오는데 during은 전치사라서 틀려요."}, {"n": "③", "en": "while - when", "ko": "~하는 동안 - ~할 때", "ok": false, "why": "둘째 빈칸 뒤에 명사구가 오는데 when은 접속사라서 틀려요."}, {"n": "④", "en": "during - while", "ko": "~ 동안 - ~하는 동안", "ok": false, "why": "순서가 거꾸로예요. 절 앞에 during, 명사구 앞에 while을 쓸 수 없어요."}, {"n": "⑤", "en": "while - during", "ko": "~하는 동안 - ~ 동안", "ok": true, "why": "절 앞에 while, 명사구 앞에 during을 써서 알맞아요."}], "pencil": "절 앞에는 while, 명사(구) 앞에는 ___을 쓴다", "pencilKey": "during", "page": 204, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "when의 쓰임 구별", "type": "mc", "ans": "②", "concept": ["041", "094"], "gap": "", "words": [["passport", "여권"], ["abroad", "해외로"], ["go", "가다"]], "h1": "〈보기〉의 when은 '해외에 갈 때'라는 뜻으로 시간을 이어 주는 접속사예요. 밑줄 친 when의 쓰임이 같은 문장을 찾으세요.", "h2": "when이 '~할 때'로 풀리면 접속사, '언제'로 풀리면 의문사예요. 해석해 보며 접속사로 쓰인 것을 찾아보세요.", "why": "〈보기〉와 ②의 when은 '~할 때'를 뜻하는 접속사예요. 나머지는 '언제'를 뜻하는 의문사(명사절)예요.", "opts": [{"n": "①", "en": "I don't know when to go.", "ko": "나는 언제 가야 할지 모르겠다.", "ok": false, "why": "'언제'를 뜻하는 의문사라서 〈보기〉와 달라요."}, {"n": "②", "en": "Time goes fast when I am busy.", "ko": "내가 바쁠 때 시간은 빨리 간다.", "ok": true, "why": "'~할 때'를 뜻하는 접속사라서 〈보기〉와 같아요."}, {"n": "③", "en": "Ask her when she will come back.", "ko": "그녀가 언제 돌아올지 그녀에게 물어봐.", "ok": false, "why": "'언제'를 뜻하는 의문사라서 〈보기〉와 달라요."}, {"n": "④", "en": "Please tell me when you will leave.", "ko": "네가 언제 떠날지 내게 말해 줘.", "ok": false, "why": "'언제'를 뜻하는 의문사라서 〈보기〉와 달라요."}, {"n": "⑤", "en": "When did she promise to meet him?", "ko": "그녀는 언제 그를 만나기로 약속했니?", "ok": false, "why": "'언제'를 묻는 의문사라서 〈보기〉와 달라요."}], "pencil": "when은 접속사일 수도, ___일 수도 있다", "pencilKey": "의문사", "page": 204, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "since의 의미 구별", "type": "mc", "ans": "③", "concept": ["054-2", "043", "041"], "gap": "", "words": [["acne", "여드름"], ["wash", "씻다"], ["was late for", "~에 늦었다 (원형 be 이다)"], ["was born", "태어났다 (원형 be born 태어나다)"]], "h1": "〈보기〉의 Since I have acne는 '여드름이 있으니까'라는 이유의 뜻이에요. 밑줄 친 Since를 '~ 때문에'와 '~ 이후로'로 각각 바꿔 읽어 보세요. 뜻이 다른 것을 찾아요.", "h2": "since가 시간의 뜻으로 쓰이면 주절의 동사 모양이 이유의 뜻일 때와 달라져요. 각 보기의 동사 모양을 비교해 보세요.", "why": "③의 since는 '태어난 이후로'라는 시간의 뜻이에요. 나머지는 모두 〈보기〉처럼 '~ 때문에'라는 이유를 나타내요.", "opts": [{"n": "①", "en": "Since I was late for school, I ran fast.", "ko": "나는 학교에 늦어서 빨리 달렸다.", "ok": false, "why": "'~ 때문에'라는 이유라서 〈보기〉와 같아요."}, {"n": "②", "en": "Everyone likes her since she is funny.", "ko": "그녀는 웃기기 때문에 모두가 그녀를 좋아한다.", "ok": false, "why": "'~ 때문에'라는 이유라서 〈보기〉와 같아요."}, {"n": "③", "en": "I have lived in Busan since I was born.", "ko": "나는 태어난 이후로 부산에서 살고 있다.", "ok": true, "why": "'~ 이후로'라는 시간의 뜻이라서 〈보기〉와 달라요."}, {"n": "④", "en": "Since it's raining outside, I'll stay at home.", "ko": "밖에 비가 오니까 나는 집에 있을 거야.", "ok": false, "why": "'~ 때문에'라는 이유라서 〈보기〉와 같아요."}, {"n": "⑤", "en": "His restaurant is popular since the food is delicious.", "ko": "음식이 맛있어서 그의 식당은 인기가 있다.", "ok": false, "why": "'~ 때문에'라는 이유라서 〈보기〉와 같아요."}], "pencil": "since는 '~ 이후로'와 '~ 때문에'의 두 가지 뜻이 있고, '~ 이후로'는 주절에 ___ 시제와 함께 쓴다", "pencilKey": "현재완료", "page": 204, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "조건 부사절 시제", "type": "mc", "ans": "③", "concept": ["014", "041", "042"], "gap": "", "words": [["wiser", "더 현명한 (원형 wise 현명한)"], ["picnic", "소풍"], ["upset", "속상한"], ["keeps making fun of", "계속 놀린다 (원형 keep 계속하다, make fun of 놀리다)"], ["museum", "박물관"]], "h1": "각 보기에서 if가 이끄는 절의 시제와 주절의 시제를 살펴보세요. 조건 부사절에서 미래는 현재시제로 써요.", "h2": "if절 안에 will이 들어 있거나, 현재를 말하는 것 같은데 과거형인 문장을 찾아 먼저 제외해 보세요.", "why": "③은 if절이 현재형이고 주절이 will이라서 자연스러워요. ②와 ④는 if절에 will이 들어 있고, ①과 ⑤는 if절이 과거형이라 어색해요.", "opts": [{"n": "①", "en": "If he read a lot of books, he'll be wiser.", "ko": "그가 책을 많이 읽었다면 더 현명해질 것이다.", "ok": false, "why": "if절은 과거형, 주절은 미래라서 시제가 어울리지 않아요."}, {"n": "②", "en": "If it will be fine today, I'll go on a picnic.", "ko": "오늘 날씨가 좋으면 나는 소풍을 갈 거야.", "ok": false, "why": "if절에 will을 써서 어색해요."}, {"n": "③", "en": "I'll be upset if she keeps making fun of me.", "ko": "그녀가 계속 나를 놀리면 나는 속상할 거야.", "ok": true, "why": "if절이 현재형이고 주절이 미래라서 자연스러워요."}, {"n": "④", "en": "If Harry will come in time, I'll go with him.", "ko": "해리가 제때 오면 나는 그와 함께 갈 거야.", "ok": false, "why": "if절에 will을 써서 어색해요."}, {"n": "⑤", "en": "If you went there, you can visit the museum.", "ko": "네가 거기 갔다면 박물관을 방문할 수 있다.", "ok": false, "why": "if절은 과거형, 주절은 can이라 시제가 맞지 않아요."}], "pencil": "if절의 동사는 현재형, 주절에는 ___를 쓸 수 있다", "pencilKey": "will", "page": 204, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "조건 접속사 unless 영작", "type": "mc", "ans": "③", "concept": ["014", "041", "042"], "gap": "", "words": [["hurry up", "서두르다"], ["miss", "놓치다"], ["flight", "항공편"]], "h1": "우리말은 '서두르지 않으면 항공편을 놓칠 것이다'예요. '~하지 않으면'을 영어로 어떻게 나타내는지 보기를 하나씩 비교해 보세요.", "h2": "unless는 이미 부정의 뜻이 있어서 뒤에 not을 쓰지 않아요. 또 조건절에서는 will을 쓰지 않아요. 두 가지를 모두 지킨 보기를 찾아요.", "why": "'서두르지 않으면'은 Unless I hurry up(원형 hurry 서두르다)으로 쓰고 주절은 I'll miss the flight예요. 조건절에 will이 없고 not도 없어요.", "opts": [{"n": "①", "en": "If I will hurry up, I'll miss the flight.", "ko": "내가 서두르면 비행기를 놓칠 것이다.", "ok": false, "why": "조건절에 will이 있고 뜻도 반대예요."}, {"n": "②", "en": "If I won't hurry up, I'll miss the flight.", "ko": "내가 서두르지 않을 거라면 비행기를 놓칠 것이다.", "ok": false, "why": "조건절에 will(won't)이 있어서 틀려요."}, {"n": "③", "en": "Unless I hurry up, I'll miss the flight.", "ko": "서두르지 않으면 나는 비행기를 놓칠 것이다.", "ok": true, "why": "unless + 현재시제라서 알맞아요."}, {"n": "④", "en": "Unless I will hurry up, I'll miss the flight.", "ko": "서두르지 않으면 나는 비행기를 놓칠 것이다 (틀린 문장)", "ok": false, "why": "unless절에 will이 있어서 틀려요."}, {"n": "⑤", "en": "Although I don't hurry up, I'll miss the flight.", "ko": "비록 서두르지 않지만 나는 비행기를 놓칠 것이다.", "ok": false, "why": "Although는 양보라서 뜻이 어색해요."}], "pencil": "'~하지 않으면'은 ___ + 현재형 동사로 쓴다", "pencilKey": "unless", "page": 204, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "조건 / 이유 접속사 짝짓기", "type": "mc", "ans": "③", "concept": ["042", "043"], "gap": "", "words": [["tired", "피곤한"], ["go to bed early", "일찍 자다"], ["fishing", "낚시"], ["satisfied", "만족한"], ["pay for", "값을 지불하다"]], "h1": "(A)~(C)의 조건절마다 알맞은 결과를 ⓐ~ⓒ에서 하나씩 짝지어요. 우리말로 읽어서 자연스러운 것끼리 연결해 보세요.", "h2": "(A), (B), (C) 각 조건절의 우리말 뜻을 먼저 만든 다음, ⓐ~ⓒ 중 그 조건 뒤에 자연스럽게 이어지는 결과를 하나씩 찾아 연결해 보세요.", "why": "(A) 피곤하다면 - ⓒ 일찍 자는 게 좋겠다, (B) 내일 비가 오면 - ⓐ 낚시를 가지 않을 것이다, (C) 만족하지 않으면 - ⓑ 값을 낼 필요 없다가 자연스러워요.", "opts": [{"n": "①", "en": "(A)-ⓐ (B)-ⓑ (C)-ⓒ", "ko": "(A) 피곤하면 낚시를 안 간다 (B) 비 오면 값을 안 내도 된다 (C) 만족 못 하면 일찍 자라", "ok": false, "why": "(A)에서 '피곤하면 낚시를 가지 않을 것이다'가 되어 어색해요."}, {"n": "②", "en": "(A)-ⓑ (B)-ⓐ (C)-ⓒ", "ko": "(A) 피곤하면 값을 안 내도 된다 (B) 비 오면 낚시를 안 간다 (C) 만족 못 하면 일찍 자라", "ok": false, "why": "(A)에서 '피곤하면 값을 낼 필요 없다'가 되어 어색해요."}, {"n": "③", "en": "(A)-ⓒ (B)-ⓐ (C)-ⓑ", "ko": "(A) 피곤하면 일찍 자라 (B) 비 오면 낚시를 안 간다 (C) 만족 못 하면 값을 안 내도 된다", "ok": true, "why": "세 조건절과 결과가 모두 자연스럽게 이어져요."}, {"n": "④", "en": "(A)-ⓐ (B)-ⓒ (C)-ⓑ", "ko": "(A) 피곤하면 낚시를 안 간다 (B) 비 오면 일찍 자라 (C) 만족 못 하면 값을 안 내도 된다", "ok": false, "why": "(A)에서 '피곤하면 낚시를 가지 않을 것이다'가 되어 어색해요."}, {"n": "⑤", "en": "(A)-ⓒ (B)-ⓑ (C)-ⓐ", "ko": "(A) 피곤하면 일찍 자라 (B) 비 오면 값을 안 내도 된다 (C) 만족 못 하면 낚시를 안 간다", "ok": false, "why": "(B)에서 '비가 오면 값을 낼 필요 없다'가 되어 어색해요."}], "pencil": "조건절은 뒤에 이어지는 ___과 뜻이 자연스러워야 한다", "pencilKey": "결과", "page": 204, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "if의 쓰임 구별", "type": "mc", "ans": "②", "concept": ["042", "092"], "gap": "", "words": [["laundry", "빨래"], ["bored", "지루한"], ["staff", "직원"], ["sunny", "화창한"]], "h1": "밑줄 친 if를 하나씩 '만약 ~라면'으로 바꿔 읽어 보세요. 어색하게 읽히는 문장이 하나 있어요.", "h2": "동사 뒤에서 목적어 역할을 하는 if는 '만약'과 다른 뜻이에요. 그 뜻으로 읽히는 문장을 찾아보세요.", "why": "②의 if는 '그들이 내 생각을 좋아하는지 아닌지'라는 뜻으로 tell의 목적어를 이끄는 명사절 접속사예요. 나머지는 모두 '만약 ~라면'이에요.", "opts": [{"n": "①", "en": "I'll do the laundry if it is sunny.", "ko": "날씨가 화창하면 내가 빨래를 할게.", "ok": false, "why": "'만약 ~라면'을 뜻하는 조건 접속사예요."}, {"n": "②", "en": "Can you tell me if they like my idea?", "ko": "그들이 내 생각을 좋아하는지 말해 줄 수 있니?", "ok": true, "why": "'~인지 아닌지'를 뜻하는 명사절 접속사라서 나머지와 달라요."}, {"n": "③", "en": "If you feel bored, you can watch TV.", "ko": "지루하면 TV를 봐도 돼.", "ok": false, "why": "'만약 ~라면'을 뜻하는 조건 접속사예요."}, {"n": "④", "en": "If you go to the school, you will meet Fred.", "ko": "학교에 가면 프레드를 만날 거야.", "ok": false, "why": "'만약 ~라면'을 뜻하는 조건 접속사예요."}, {"n": "⑤", "en": "You can't enter the room if you are not one of the staff.", "ko": "직원이 아니면 그 방에 들어갈 수 없다.", "ok": false, "why": "'만약 ~라면'을 뜻하는 조건 접속사예요."}], "pencil": "tell 뒤의 if는 '~인지 ___'라는 뜻이다", "pencilKey": "아닌지", "page": 204, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "after로 두 문장 합치기", "type": "write", "ans": "I will go to the movies after I visit my friend in the hospital. / After I visit my friend in the hospital, I will go to the movies.", "concept": ["014", "041", "042"], "gap": "", "words": [["visit", "방문하다"], ["hospital", "병원"], ["movies", "영화"]], "h1": "두 문장의 순서는 '병원 친구 방문' 다음에 '영화 보러 가기'예요. 먼저 한 일이 after 뒤에 가는지, 나중에 한 일이 가는지 정리해 보세요.", "h2": "after는 먼저 일어난 일 앞에 붙어요. 미래의 일이지만 after절에는 will을 쓰지 않아요. 부사절은 앞에 와도 뒤에 와도 돼요.", "why": "after 뒤에 먼저 한 일 I visit my friend in the hospital을 현재형으로 쓰고, 주절에 I will go to the movies를 써요.", "opts": [], "pencil": "after절에는 먼저 한 일을 쓰고 시제는 ___로 한다", "pencilKey": "현재", "page": 205, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "since와 현재완료", "type": "write", "ans": "I have learned music from Mr. Jeong since I entered this school.", "concept": ["054-2", "041", "054"], "gap": "", "words": [["learn", "배우다"], ["entered", "들어갔다 (원형 enter 들어가다)"], ["since", "~ 이후로"]], "h1": "since I entered this school(이 학교에 들어온 이후로)은 과거의 한 시점부터 지금까지를 뜻해요. 주절의 learn이 이 뜻과 어울리는 시제인지 확인하세요.", "h2": "since가 이끄는 절의 과거 시점부터 지금까지 이어지는 일은 현재완료 「have + p.p.」로 써요. learn을 알맞게 바꿔 보세요.", "why": "since(~ 이후로)와 호응하는 주절은 현재완료 have learned(원형 learn 배우다)를 써요.", "opts": [], "pencil": "since 주절에는 「have + ___」 형태를 쓴다", "pencilKey": "p.p.", "page": 205, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "접속사 골라 쓰기", "type": "write", "ans": "(1) While you were sleeping (2) until he comes back home", "concept": ["014", "041", "042"], "gap": "", "words": [["walked", "산책시켰다 (원형 walk 걷게 하다)"], ["parents", "부모님"], ["be able to", "~할 수 있다"], ["comes back", "돌아온다 (원형 come back 돌아오다)"]], "h1": "(1) '네가 자고 있는 동안', (2) '그가 집에 돌아올 때까지'라는 뜻을 만들어요. 보기의 while, as, until, as soon as 중 뜻이 맞는 것을 골라요.", "h2": "(1)은 진행 중인 일 동안이라 while, (2)는 어느 시점까지 계속된다는 뜻이라 until이에요. (2)는 미래의 일이지만 시간 부사절이라 현재형으로 써요.", "why": "(1) 동안을 뜻하는 while + you were sleeping(원형 be 이다, sleep 자다), (2) ~까지를 뜻하는 until + he comes back home(원형 come 오다)이 알맞아요.", "opts": [], "pencil": "'~까지'는 ___, '~하는 동안'은 while", "pencilKey": "until", "page": 205, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "when으로 부사구 바꾸기", "type": "write", "ans": "When I was a child", "concept": ["041"], "gap": "", "words": [["childhood", "어린 시절"], ["bookstores", "서점들 (원형 bookstore 서점)"], ["a child", "어린아이"]], "h1": "during my childhood(유년 시절 동안)를 '내가 아이였을 때'라는 절로 바꾸는 문제예요. 주어진 단어는 when, a child예요.", "h2": "절은 「접속사 + 주어 + 동사」 순서예요. 주절이 과거 시제이므로 be동사도 과거형으로 쓰세요.", "why": "when 뒤에 주어 I와 be동사 과거형 was, 보어 a child를 놓아 When I was a child가 돼요.", "opts": [], "pencil": "'내가 아이였을 때'는 When I ___ a child", "pencilKey": "was", "page": 205, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "if로 조건 영작", "type": "write", "ans": "If you are over 18, you can get a driver's license.", "concept": ["042"], "gap": "", "words": [["over 18", "18세 이상"], ["get", "얻다"], ["driver's license", "운전면허증"]], "h1": "'네가 18살 이상이면'이 조건이에요. 조건을 나타내는 접속사를 맨 앞에 두고 그 뒤에 주어와 be동사를 쓰세요.", "h2": "if절에서는 현재형을 쓰고, 쉼표 뒤 주절에는 can get(원형 get 얻다)을 써서 '딸 수 있다'를 말해요.", "why": "조건을 나타내는 if를 이용해 If you are over 18, you can get a driver's license로 써요.", "opts": [], "pencil": "조건은 ___ 절을 앞에 쓰고 쉼표로 이어 준다", "pencilKey": "if", "page": 205, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "if절 시제 고치기", "type": "write", "ans": "If you do not [don't] pay attention to your teacher, you cannot get good grades.", "concept": ["014", "041", "042"], "gap": "", "words": [["pay attention to", "~에 주의를 기울이다"], ["grades", "성적들 (원형 grade 성적)"], ["teacher", "선생님"]], "h1": "if가 이끄는 절에서 어색한 부분을 찾으세요. 앞으로의 일이어도 조건 부사절에서는 시제 표현이 달라져요.", "h2": "if절의 미래는 어떤 시제로 쓰는지 떠올려 보세요. 주어 you의 현재형 부정은 do not이나 don't로 써요.", "why": "조건 부사절에서는 미래를 현재시제로 나타내서 will not pay를 do not [don't] pay로 고쳐요.", "opts": [], "pencil": "if절의 will not은 ___ 형태로 고친다", "pencilKey": "do not", "page": 205, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "since로 이유 문장 배열", "type": "write", "ans": "Since I went to bed early last night, I got up early. / I got up early since I went to bed early last night.", "concept": ["043", "040"], "gap": "", "words": [["went to bed", "잠자리에 들었다 (원형 go to bed 잠자리에 들다)"], ["got up", "일어났다 (원형 get up 일어나다)"], ["last night", "어젯밤"]], "h1": "'어젯밤에 일찍 잠자리에 들었기 때문에 일찍 일어났다'는 이유와 결과의 문장이에요. 이유가 되는 부분이 어느 것인지 먼저 정하세요.", "h2": "since는 이유를 이끄는 접속사라서 이유에 해당하는 절 앞에 붙여요. 부사절은 주절 앞에 와도 되고 뒤에 와도 돼요.", "why": "이유 부분 'I went to bed early last night' 앞에 since를 붙여 Since I went to bed early last night, I got up early 또는 I got up early since I went ...로 써요.", "opts": [], "pencil": "since가 이끄는 이유절은 주절 ___에도 올 수 있다", "pencilKey": "뒤", "page": 205, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "because로 바꾸기", "type": "write", "ans": "their service is fast", "concept": ["043"], "gap": "", "words": [["fast food", "패스트푸드"], ["service", "서비스"], ["popular", "인기 있는"]], "h1": "because of 뒤에는 명사구가, because 뒤에는 「주어 + 동사」 절이 와요. 그래서 their fast service를 절로 바꿔야 해요.", "h2": "their fast service에서 형용사 fast가 명사 service를 꾸미고 있어요. 이것을 '그들의 서비스는 빠르다'는 절 형태로 바꿔 4단어로 쓰세요.", "why": "because 뒤에는 절이 와요. their fast service를 their service is fast로 바꾸면 4단어가 돼요.", "opts": [], "pencil": "because of 뒤에는 명사구, because 뒤에는 ___이 온다", "pencilKey": "절", "page": 205, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "as의 뜻 구별", "type": "mc", "ans": "②", "concept": ["093"], "gap": "", "words": [["knitting", "뜨개질하는 (원형 knit 뜨다)"], ["weak", "약한"], ["listened to", "들었다 (원형 listen to 듣다)"], ["prepared", "준비했다 (원형 prepare 준비하다)"], ["practiced", "연습했다 (원형 practice 연습하다)"]], "h1": "ⓐ~ⓔ의 as를 하나씩 '~하면서(시간)'와 '~ 때문에(이유)' 중 어느 쪽으로 해석되는지 정해서 같은 뜻끼리 묶어 보세요.", "h2": "시간의 뜻이면 두 가지 일이 같은 때에 함께 일어나는 모습이고, 이유의 뜻이면 앞이나 뒤 문장이 원인을 설명해요. 문장마다 어느 쪽인지 따져 보세요.", "why": "ⓐ(TV를 보면서)와 ⓒ(음악을 들으면서)는 '~하면서'이고, ⓑ(약하기 때문에), ⓓ(추웠기 때문에), ⓔ(이기고 싶었기 때문에)는 '~ 때문에'예요.", "opts": [{"n": "①", "en": "ⓐ, ⓑ / ⓒ, ⓓ, ⓔ", "ko": "시간: ⓐ, ⓑ / 이유: ⓒ, ⓓ, ⓔ", "ok": false, "why": "ⓑ는 이유라서 ⓐ와 같은 묶음이 될 수 없어요."}, {"n": "②", "en": "ⓐ, ⓒ / ⓑ, ⓓ, ⓔ", "ko": "시간: ⓐ, ⓒ / 이유: ⓑ, ⓓ, ⓔ", "ok": true, "why": "시간 ⓐ, ⓒ와 이유 ⓑ, ⓓ, ⓔ로 정확히 나뉘어서 알맞아요."}, {"n": "③", "en": "ⓐ, ⓒ, ⓓ / ⓑ, ⓔ", "ko": "시간: ⓐ, ⓒ, ⓓ / 이유: ⓑ, ⓔ", "ok": false, "why": "ⓓ는 이유라서 시간 묶음에 들어갈 수 없어요."}, {"n": "④", "en": "ⓐ, ⓑ, ⓔ / ⓒ, ⓓ", "ko": "시간: ⓐ, ⓑ, ⓔ / 이유: ⓒ, ⓓ", "ok": false, "why": "ⓑ와 ⓔ는 이유이고 ⓐ는 시간이라서 묶음이 틀려요."}, {"n": "⑤", "en": "ⓐ, ⓑ, ⓓ, ⓔ / ⓒ", "ko": "시간: ⓐ, ⓑ, ⓓ, ⓔ / 이유: ⓒ", "ok": false, "why": "ⓐ가 시간인데 이유 묶음에 들어가서 틀려요."}], "pencil": "as는 '~하면서'(시간)와 '~ ___'(이유)의 두 뜻으로 구별한다", "pencilKey": "때문에", "page": 206, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "조건 부사절 어색한 문장", "type": "mc", "ans": "①", "concept": ["014", "041", "042"], "gap": "", "words": [["start to rain", "비가 오기 시작하다"], ["Statue of Liberty", "자유의 여신상"], ["won't have to", "~할 필요가 없을 것이다"], ["worry", "걱정하다"]], "h1": "각 보기의 밑줄 친 if절을 읽고, 조건을 나타내는 부사절이면 주어에 맞는 현재형 동사가 쓰였는지 살펴보세요.", "h2": "if절이 부사절이면 will 없이 현재형으로 쓰고, 주어가 3인칭 단수면 -s가 필요해요. 어색한 곳은 동사의 모양이에요.", "why": "①의 if절은 조건 부사절이므로 주어 it에 맞게 start를 starts로 고쳐야 해요. ④의 if절은 명사절이라서 이 규칙에 해당하지 않아요.", "opts": [{"n": "①", "en": "What will you do if it start to rain?", "ko": "비가 오기 시작하면 너는 무엇을 할 거니?", "ok": true, "why": "주어 it에 동사 start가 와서 -s가 빠졌어요."}, {"n": "②", "en": "If I finish my work, I'll play basketball.", "ko": "내 일을 끝내면 나는 농구를 할 거야.", "ok": false, "why": "if절이 현재형이라 알맞아요."}, {"n": "③", "en": "If I go to New York, I will visit the Statue of Liberty.", "ko": "내가 뉴욕에 가면 자유의 여신상을 방문할 거야.", "ok": false, "why": "if절이 현재형이라 알맞아요."}, {"n": "④", "en": "Do you know if the store will be closed?", "ko": "그 가게가 문을 닫을지 아니?", "ok": false, "why": "if절이 명사절이라서 will을 써도 돼요."}, {"n": "⑤", "en": "If you think that way, you won't have to worry.", "ko": "그렇게 생각하면 걱정할 필요가 없을 거야.", "ok": false, "why": "if절이 현재형이라 알맞아요."}], "pencil": "조건 부사절의 3인칭 단수 주어에는 동사에 ___를 붙인다", "pencilKey": "-s", "page": 206, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "접속사 종합 고르기", "type": "mc", "ans": "②", "concept": ["042", "041", "043"], "gap": "", "words": [["ticket", "표"], ["terminal", "터미널"], ["arrive", "도착하다"], ["playing tennis", "테니스를 치는 중"]], "h1": "세 문장의 괄호마다 문장의 앞뒤 내용이 어떤 관계인지 먼저 생각해 보세요. 조건, 때, 동시 동작 중 하나예요.", "h2": "(A) 표가 없으면 못 들어간다, (B) 네가 도착할 때까지 기다리겠다, (C) 내가 테니스를 치는 동안 무엇을 할 거니?라는 뜻이에요.", "why": "(A) '표가 없으면'은 Unless, (B) '도착할 때까지'는 until, (C) '테니스를 치는 동안'은 while이 알맞아요.", "opts": [{"n": "①", "en": "If - until - although", "ko": "만약 - ~까지 - 비록 ~이지만", "ok": false, "why": "(A)에 If를 쓰면 '표가 있으면 들어갈 수 없다'가 되어 틀려요."}, {"n": "②", "en": "Unless - until - while", "ko": "~ 아니라면 - ~까지 - ~하는 동안", "ok": true, "why": "세 칸이 모두 문맥에 맞아요."}, {"n": "③", "en": "Unless - while - although", "ko": "~ 아니라면 - ~하는 동안 - 비록 ~이지만", "ok": false, "why": "(B)에 while을 쓰면 '도착하는 동안 기다릴게'가 되어 의미가 달라요."}, {"n": "④", "en": "Since - though - while", "ko": "~ 때문에 - 비록 ~이지만 - ~하는 동안", "ok": false, "why": "(A)에 Since를 쓰면 '표가 있어서 들어갈 수 없다'가 되어 틀려요."}, {"n": "⑤", "en": "Since - though - unless", "ko": "~ 때문에 - 비록 ~이지만 - ~ 아니라면", "ok": false, "why": "(A), (B), (C) 모두 의미가 맞지 않아요."}], "pencil": "조건 not은 unless, '~까지'는 until, '~하는 동안'은 ___로 쓴다", "pencilKey": "while", "page": 206, "sec": "s4"}, {"id": "S4-04", "step": 4, "no": 4, "qtype": "시간표 보고 접속사 쓰기", "type": "write", "ans": "(1) before (2) When [After] (3) I watch TV (4) I have dinner", "concept": ["041"], "gap": "", "words": [["dinner", "저녁 식사"], ["homework", "숙제"], ["online games", "온라인 게임"], ["wash", "씻다"]], "h1": "표의 시간 순서를 읽어요. 17:00 하교, 18:00 집 도착과 세면, 18:30 저녁, 19:00 TV, 20:30 숙제, 21:30 게임이에요.", "h2": "(1)과 (2)는 표의 시간 순서를 보고 알맞은 때의 접속사를 고르세요. (3)과 (4)는 접속사 뒤에 어떤 일이 들어갈지 표에서 찾아 절로 쓰세요.", "why": "(1) 저녁(18:30)을 먹은 뒤 TV(19:00)를 보니까 before, (2) 숙제 후 게임이니 When [After], (3) TV를 본 뒤에 숙제를 하니 After I watch TV, (4) 세수는 저녁 전에 하니 Before I have dinner가 맞아요.", "opts": [], "pencil": "먼저 한 일 뒤에는 after, 나중 일 뒤에는 ___를 쓴다", "pencilKey": "before", "page": 206, "sec":  }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
