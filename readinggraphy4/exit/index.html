ther problem is that a day on the moon is the same as 29.5 Earth days.","또 다른 문제는 달에서의 하루가 지구의 29.5일과 같다는 것이다."]],"w":"9번 문장: 달에서의 하루는 지구의 29.5일과 같음. 3번에서 임무마다 시간대가 다르다고 했고, 달이 지구만큼 크다는 말은 없으며, 하루는 지구보다 훨씬 길어서 나머지는 모두 틀림.","c":3},"h":"3e19326b4c"},{"n":9,"t":"sum","q":"On the moon, clocks go (A) than on Earth, so it is (B) to know the correct time.","ko":"달에서는 시계가 지구보다 (A) 가기 때문에 정확한 시간을 알기가 (B).","oko":["(A) 느리게 / (B) 쉽다","(A) 느리게 / (B) 어렵다","(A) 빠르게 / (B) 쉽다","(A) 똑같이 / (B) 어렵다","(A) 빠르게 / (B) 어렵다"],"opts":["(A) slower / (B) easy","(A) slower / (B) hard","(A) faster / (B) easy","(A) the same / (B) hard","(A) faster / (B) hard"],"r":{"a":"5) (A) faster / (B) hard","ev":"8, 10번 문장","s":[[8,"Clocks on the moon go 56 microseconds faster than on Earth each day.","달에서의 시계는 지구에서보다 매일 56마이크로초 더 빨리 간다."],[10,"These problems make it hard to know the correct time on the moon.","이 문제들은 달에서의 정확한 시간을 알기 어렵게 만든다."]],"w":"8번: 달의 시계는 지구보다 매일 56마이크로초 faster(더 빨리) 감. 10번: 그래서 정확한 시간을 아는 것이 hard(어렵다). slower(더 느리게)나 the same(똑같이)은 8번과 다르고, easy(쉬운)는 10번과 반대.","c":5},"h":"15e7c53b5f"},{"n":10,"t":"fill","q":"They think it will [A] people from different countries work [B] on moon missions.","ko":"그들은 그것이 다양한 나라의 사람들이 달 임무에서 [B] 일하는 것을 [A] 것이라고 생각한다.","bko":{"help":"돕다","together":"함께","repair":"수리하다","special":"특별한","microseconds":"마이크로초","correct":"정확한"},"bank":["help","together","repair","special","microseconds","correct"],"r":{"a":"[A] help (돕다), [B] together (함께)","ev":"2번 문장","s":[[2,"They think it will help people from different countries work together on moon missions.","그들은 그것이 다양한 나라의 사람들이 달 임무를 함께하는 것을 도울 것이라고 생각한다."]],"w":"2번 문장: They think it will help(돕다) people from different countries work together(함께 일하다) on moon missions. repair(수리하다)나 special(특별한) 등은 이 자리에 문법적으로 맞지 않음.","c":null},"h":"1b84e35ab4"}]},{"u":8,"id":"rg4-08-3","no":3,"ko":"일부러 자신을 묶어 둔 영웅 이야기","items":[{"n":1,"t":"tf","q":"One group in the experiment was given strict deadlines.","ko":"실험에서 한 그룹은 엄격한 마감 기한이 주어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"One group was given strict deadlines, while another could turn in their reports anytime.","한 그룹은 엄격한 마감 기한이 주어진 반면, 또 다른 그룹은 리포트를 언제든 제출할 수 있었다."]],"w":"3번 문장에 One group was given strict deadlines가 그대로 나옴. 본문과 일치.","c":"T"},"h":"534d63c79b"},{"n":2,"t":"tf","q":"In the third group, the professor chose the deadlines for the students.","ko":"세 번째 그룹에서는 교수가 학생들을 위해 마감 기한을 정해 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In the third group, he allowed students to choose their own deadlines.","세 번째 그룹에서는, 그는 학생들이 각자 자신의 마감 기한을 선택하도록 허락했다."]],"w":"4번 문장에서 세 번째 그룹은 students가 own deadlines(자신의 마감 기한)를 choose(고르다)하도록 허락받았다고 함. 교수가 정해 준 것이 아니라 학생들이 직접 정함.","c":"F"},"h":"959a519846"},{"n":3,"t":"tf","q":"Ulysses did not want to hear the Sirens’ songs at all.","ko":"율리시스는 세이렌의 노래를 전혀 듣고 싶어 하지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Ulysses really wanted to hear Sirens’ songs, but Sirens were believed to use their songs to attract sailors and make their ships sink.","율리시스는 세이렌의 노래를 정말 듣고 싶었지만, 세이렌은 자신들의 노래로 선원들의 마음을 끌어 배를 가라앉게 하는 것으로 여겨졌다."]],"w":"8번 문장에서 Ulysses really wanted to hear Sirens’ songs(정말 듣고 싶었다)라고 함. 전혀 듣고 싶어 하지 않았다는 말은 반대. 그래서 위험을 피하려고 10번의 방법을 썼음.","c":"F"},"h":"ff93407ca2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One group was given strict deadlines…)","ko":"(한 그룹은 ( ) 마감 기한이 주어졌다…)","opts":["엄격한","느슨한","친절한","짧은"],"word":"strict","r":{"a":"1) 엄격한","ev":"3번 문장","s":[[3,"One group was given strict deadlines, while another could turn in their reports anytime.","한 그룹은 엄격한 마감 기한이 주어진 반면, 또 다른 그룹은 리포트를 언제든 제출할 수 있었다."]],"w":"3번에서 strict deadlines를 받은 그룹과, 언제든 제출할 수 있는(anytime) 그룹이 while로 대조됨. 제출 시기를 꼭 지켜야 하는 마감이니 strict = 엄격한. 느슨한은 반대.","c":1},"h":"9395eb5d20"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…Sirens were believed to use their songs to attract sailors and make their ships sink.)","ko":"(…세이렌은 자신들의 노래로 선원들을 ( ) 배를 가라앉게 하는 것으로 여겨졌다.)","opts":["밀어내다","끌어들이다","무시하다","가르치다"],"word":"attract","r":{"a":"2) 끌어들이다","ev":"8번 문장","s":[[8,"Ulysses really wanted to hear Sirens’ songs, but Sirens were believed to use their songs to attract sailors and make their ships sink.","율리시스는 세이렌의 노래를 정말 듣고 싶었지만, 세이렌은 자신들의 노래로 선원들의 마음을 끌어 배를 가라앉게 하는 것으로 여겨졌다."]],"w":"8번에서 율리시스가 세이렌의 노래를 듣고 싶어 했고, 그 노래가 선원들을 attract해서 배가 가라앉는다고 함. 선원들을 끌어당긴다는 뜻이니 attract = 끌어들이다.","c":2},"h":"c6f1a9ae1c"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nInterestingly, most of the third group knew they might be lazy, so they set specific deadlines for each report to work harder.","ko":"밑줄 친 they가 가리키는 것은?","sko":"흥미롭게도, 세 번째 그룹의 학생들 대부분은 자신들이 게으를 수도 있다는 것을 알아서, 더 열심히 하려고 각 리포트마다 구체적인 마감 기한을 정했다.","opts":["교수","첫 번째 그룹의 학생들","세 번째 그룹의 학생들","세이렌들"],"r":{"a":"3) 세 번째 그룹의 학생들","ev":"5번 문장","s":[[5,"Interestingly, most of the third group knew they might be lazy, so they set specific deadlines for each report to work harder.","흥미롭게도, 세 번째 그룹의 학생들 대부분은 자신들이 게으를 수도 있다는 것을 알아서, 더 열심히 하려고 각 리포트마다 구체적인 마감 기한을 정했다."]],"w":"5번에서 most of the third group knew they might be lazy, so they set specific deadlines. so 뒤의 they는 같은 주어, 즉 세 번째 그룹의 학생들. 교수는 4번에서 허락한 사람일 뿐임.","c":3},"h":"a4edcb60f2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The “present Ulysses” was in control and made plans for the “future Ulysses.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"'현재의 율리시스'가 통제권을 가지고 '미래의 율리시스'를 위한 계획을 세웠다.","opts":["현재의 율리시스가 미래의 율리시스에게 통제를 받았다.","현재의 율리시스는 계획 없이 행동했다.","미래의 율리시스가 현재의 율리시스를 위해 계획을 세웠다.","현재의 율리시스가 통제권을 쥐고 미래의 율리시스를 위한 계획을 세웠다."],"r":{"a":"4) 현재의 율리시스가 통제권을 쥐고 미래의 율리시스를 위한 계획을 세웠다.","ev":"11번 문장","s":[[11,"The “present Ulysses” was in control and made plans for the “future Ulysses.”","'현재의 율리시스'가 통제권을 가지고 '미래의 율리시스'를 위한 계획을 세웠다."]],"w":"present Ulysses was in control(현재의 율리시스가 통제권을 가졌다) and made plans for the future Ulysses(미래의 율리시스를 위해 계획을 세웠다). 계획을 세운 쪽이 현재, 혜택 받는 쪽이 미래라 두 선지는 방향이 뒤바뀌어 틀림.","c":4},"h":"f7be926ff1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["율리시스는 자신의 귀를 밀랍으로 채웠다.","율리시스는 선원들을 배에 묶게 했다.","율리시스는 자신을 배에 묶게 했다.","선원들은 세이렌의 노래를 직접 들었다."],"opts":["Ulysses had his own ears filled with wax.","Ulysses had his sailors tied to the ship.","Ulysses had himself tied to his ship.","The sailors listened to the Sirens’ songs."],"r":{"a":"3) Ulysses had himself tied to his ship.","ev":"10번 문장","s":[[10,"So, Ulysses had himself tied to his ship and had his sailors’ ears filled with wax.","그래서 율리시스는 자신을 자기 배에 묶도록 하고 선원들의 귀를 밀랍으로 채우도록 했다."]],"w":"10번 문장: Ulysses had himself tied to his ship and had his sailors’ ears filled with wax. 묶인 것은 율리시스 자신이고, 귀를 밀랍으로 채운 것은 선원들. 나머지 선지는 이 둘을 뒤바꿨거나 선원들이 노래를 들었다고 해서 틀림.","c":3},"h":"57fd93de4e"},{"n":9,"t":"sum","q":"A Ulysses contract is a (A) that is (B) to what the Greek hero Ulysses did.","ko":"율리시스 계약은 그리스의 영웅 율리시스가 했던 것과 (B) (A)이다.","oko":["(A) 전략 / (B) 비슷한","(A) 전략 / (B) 다른","(A) 실수 / (B) 비슷한","(A) 실수 / (B) 다른","(A) 노래 / (B) 비슷한"],"opts":["(A) strategy / (B) similar","(A) strategy / (B) different","(A) mistake / (B) similar","(A) mistake / (B) different","(A) song / (B) similar"],"r":{"a":"1) (A) strategy / (B) similar (전략 / 비슷한)","ev":"6~7번 문장","s":[[6,"This strategy for controlling oneself is called a “Ulysses contract.”","자신을 통제하는 이 전략은 '율리시스 계약'이라고 불린다."],[7,"It’s similar to what the Greek hero Ulysses did.","그것은 그리스의 영웅 율리시스가 했던 것과 비슷하다."]],"w":"6번에서 Ulysses contract는 strategy(전략)라고 하고, 7번에서 그리스 영웅 율리시스가 했던 것과 similar(비슷하다)고 함. mistake(실수)와 song(노래)은 본문과 맞지 않고, different(다른)는 7번과 반대.","c":1},"h":"b07ac1f91d"},{"n":10,"t":"fill","q":"Ulysses contracts are a great way to improve [A] and [B] our goals.","ko":"율리시스 계약은 [A]을(를) 향상시키고 우리의 목표를 [B](하는) 훌륭한 방법이다.","bko":{"self-control":"자제력","achieve":"달성하다","lazy":"게으른","allow":"허락하다","sink":"가라앉다","wax":"밀랍"},"bank":["self-control","achieve","lazy","allow","sink","wax"],"r":{"a":"[A] self-control, [B] achieve","ev":"12번 문장","s":[[12,"Ulysses contracts are a great way to improve self-control and achieve our goals.","율리시스 계약은 자제력을 향상시키고 우리의 목표를 달성하는 훌륭한 방법이다."]],"w":"12번 문장: improve self-control(자제력을 향상시키다) and achieve our goals(우리의 목표를 달성하다). lazy(게으른)는 5번, sink(가라앉다)와 wax(밀랍)는 8~10번의 세이렌 이야기에 나오는 단어이고, allow(허락하다)는 4번에서 마감 선택을 허락한 것.","c":null},"h":"6dcf4acefb"}]},{"u":9,"id":"rg4-09-1","no":1,"ko":"마시멜로처럼 가벼운 거대 행성","items":[{"n":1,"t":"tf","q":"TOI-3757 b is about 580 light years away from us.","ko":"TOI-3757 b는 우리로부터 약 580광년 떨어져 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"This planet, named TOI-3757 b, is floating in space far away, about 580 light years from us.","TOI-3757 b라는 이름의 이 행성은 우리로부터 약 580광년 떨어진 먼 우주에 떠 있다."]],"w":"2번 문장에 about 580 light years from us가 나옴. 본문과 일치.","c":"T"},"h":"d0df7ff9de"},{"n":2,"t":"tf","q":"TOI-3757 b is a little smaller than Jupiter.","ko":"TOI-3757 b는 목성보다 약간 더 작다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"It’s so big that it’s a little larger than Jupiter.","그것은 정말 커서 목성보다도 약간 더 크다."]],"w":"3번 문장에서 it’s a little larger than Jupiter(목성보다 약간 더 크다)라고 함. smaller와 larger가 바뀐 선지라 본문과 반대.","c":"F"},"h":"f4c428d144"},{"n":3,"t":"tf","q":"TOI-3757 b is so light that it would float in a huge bathtub of water.","ko":"TOI-3757 b는 아주 가벼워서 거대한 욕조의 물 위에 뜰 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"It’s so light that it would float in a huge bathtub of water!","그것은 아주 가벼워서 거대한 욕조 물 위에 뜰 것이다!"]],"w":"6번 문장에 so light that it would float in a huge bathtub of water가 나옴. 본문과 일치.","c":"T"},"h":"165a9a8441"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In other words, this “marshmallow” is so huge that it could fit more than 1,300 Earths inside!)","ko":"(다시 말해, 이 '마시멜로'는 너무 ( ) 그 안에 지구가 1,300개 이상 들어갈 수 있다!)","opts":["작은","거대한","가벼운","오래된"],"word":"huge","r":{"a":"2) 거대한","ev":"4번 문장","s":[[4,"In other words, this “marshmallow” is so huge that it could fit more than 1,300 Earths inside!","다시 말해, 이 '마시멜로'는 너무 거대해서 그 안에 지구가 1,300개 이상 들어갈 수 있다!"]],"w":"4번에서 안에 지구가 1,300개 넘게 들어간다고 했으니 아주 크다는 뜻. 3번의 big을 In other words로 다시 말한 것이라 huge = 거대한.","c":2},"h":"20b0e6496c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To discover TOI-3757 b is a surprise to astronomers.)","ko":"(TOI-3757 b를 ( ) 것은 천문학자들에게 놀라운 일이다.)","opts":["만들다","잃어버리다","발견하다","측정하다"],"word":"discover","r":{"a":"3) 발견하다","ev":"7번 문장","s":[[7,"To discover TOI-3757 b is a surprise to astronomers.","TOI-3757 b를 발견한 것은 천문학자들에게 놀라운 일이다."]],"w":"1번에서 천문학자들이 행성을 found(발견했다)고 했고, 7번에서 TOI-3757 b를 discover한 것이 놀라운 일이라고 함. 같은 일을 가리키므로 discover = 발견하다.","c":3},"h":"ebc0983532"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThat’s because they thought it was hard for giant planets to form around red dwarf stars.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그들은 거대 행성이 적색 왜성 주변에서 형성되기 어렵다고 생각했기 때문이다.","opts":["천문학자들","거대 행성들","적색 왜성들","애리조나의 주민들"],"pron":"they","r":{"a":"1) 천문학자들","ev":"7~8번 문장","s":[[7,"To discover TOI-3757 b is a surprise to astronomers.","TOI-3757 b를 발견한 것은 천문학자들에게 놀라운 일이다."],[8,"That’s because they thought it was hard for giant planets to form around red dwarf stars.","그들은 거대 행성이 적색 왜성 주변에서 형성되기 어렵다고 생각했기 때문이다."]],"w":"7번에서 TOI-3757 b의 발견이 astronomers(천문학자들)에게 놀라운 일이라고 했고, 8번 That’s because가 그 이유를 설명함. 거대 행성이 형성되기 어렵다고 생각한 주체는 천문학자들.","c":1,"k":"they = 천문학자들"},"h":"37cd102be0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even though this planet is as big as Jupiter, it’s much lighter.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 이 행성은 목성만큼 크지만, 훨씬 더 가볍다.","opts":["이 행성은 목성만큼 크지만 훨씬 더 가볍다.","이 행성은 목성만큼 크고 훨씬 더 무겁다.","이 행성은 목성과 무게가 완전히 똑같다.","이 행성은 목성의 위성이라서 훨씬 더 가볍다."],"r":{"a":"1) 이 행성은 목성만큼 크지만 훨씬 더 가볍다.","ev":"5번 문장","s":[[5,"Even though this planet is as big as Jupiter, it’s much lighter.","비록 이 행성은 목성만큼 크지만, 훨씬 더 가볍다."]],"w":"Even though(비록 ~이지만) 뒤에 as big as Jupiter(목성만큼 큼)가 오고, 뒤에서 much lighter(훨씬 가볍다)로 대조됨. 크기는 같지만 무게는 훨씬 가볍다는 뜻.","c":1},"h":"1ab8ed102a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["애리조나의 천문학자들이 거대 행성을 발견했다.","텍사스의 천문학자들이 거대 행성을 발견했다.","애리조나의 천문학자들이 아주 작은 행성을 발견했다.","애리조나의 천문학자들이 새로운 별을 발견했다."],"opts":["Astronomers in Arizona found a giant planet.","Astronomers in Texas found a giant planet.","Astronomers in Arizona found a tiny planet.","Astronomers in Arizona found a new star."],"r":{"a":"1) Astronomers in Arizona found a giant planet. (애리조나의 천문학자들이 거대 행성을 발견했다.)","ev":"1번 문장","s":[[1,"Astronomers in Arizona found a giant planet that’s as light as a marshmallow!","애리조나주의 천문학자들이 마시멜로만큼 가벼운 거대 행성을 발견했다!"]],"w":"1번 문장: Astronomers in Arizona found a giant planet(애리조나의 천문학자들이 거대 행성을 발견함). 텍사스, 아주 작은 행성, 새로운 별은 모두 본문과 다름.","c":1},"h":"e5026f05ab"},{"n":9,"t":"sum","q":"Finding more such systems with giant planets is part of their (A) to (B) how planets form.","ko":"이처럼 거대 행성을 가진 행성계를 더 많이 찾는 것은 행성이 어떻게 형성되는지 (B) 그들의 (A)의 일부이다.","oko":["(A) 목표 / (B) 이해하려는","(A) 목표 / (B) 잊으려는","(A) 두려움 / (B) 이해하려는","(A) 두려움 / (B) 잊으려는","(A) 놀라움 / (B) 잊으려는"],"opts":["(A) goal / (B) understand","(A) goal / (B) forget","(A) fear / (B) understand","(A) fear / (B) forget","(A) surprise / (B) forget"],"r":{"a":"1) (A) goal / (B) understand (목표 / 이해하려는)","ev":"10번 문장","s":[[10,"Finding more such systems with giant planets is part of their goal to understand how planets form.","이처럼 거대 행성을 가진 행성계를 더 많이 발견하는 것은 행성이 어떻게 형성되는지 이해하려는 그들의 목표의 일부이다."]],"w":"10번 문장: 거대 행성을 가진 행성계를 더 찾는 것은 part of their goal(그들의 목표의 일부)이고, 그 목표는 to understand(이해하려는 것) how planets form. fear(두려움)나 forget(잊다)은 본문과 맞지 않음.","c":1},"h":"17907ba189"},{"n":10,"t":"fill","q":"Until now, astronomers have [A] been able to find giant Jupiter-sized planets [B] away from red dwarf stars.","ko":"지금까지 천문학자들은 적색 왜성에서 [B] 떨어진 곳의 목성 크기 거대 행성을 [A] 발견할 수 있었다.","bko":{"only":"오직","far":"멀리","marshmallow":"마시멜로","surprise":"놀라운 일","bathtub":"욕조","light":"가벼운"},"bank":["only","far","marshmallow","surprise","bathtub","light"],"r":{"a":"[A] only (오직), [B] far (멀리)","ev":"9번 문장","s":[[9,"Until now, astronomers have only been able to find giant Jupiter-sized planets far away from red dwarf stars.","지금까지 천문학자들은 적색 왜성에서 멀리 떨어진 곳에서만 목성 크기의 거대 행성을 발견할 수 있었다."]],"w":"9번 문장: astronomers have only been able to find(오직 ~만 발견할 수 있었다) giant Jupiter-sized planets far away from red dwarf stars(적색 왜성에서 멀리 떨어진). 나머지 단어는 이 자리에 문법적으로 맞지 않음.","c":null},"h":"08b0101fbf"}]},{"u":9,"id":"rg4-09-2","no":2,"ko":"70년 전 당근이 더 영양이 많았다고?","items":[{"n":1,"t":"tf","q":"A carrot grown today has lower nutrient levels than a carrot from 70 years ago.","ko":"오늘날 재배되는 당근은 70년 전의 당근보다 영양소 수준이 더 낮다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"If you compare a carrot from 70 years ago with one that is grown today, you’ll find that today’s carrot has lower nutrient levels than its ancestor.","70년 전의 당근과 오늘날 재배되는 당근을 비교해 보면, 오늘날의 당근이 그것의 조상보다 더 낮은 영양소 수준을 가지고 있다는 것을 알게 될 것이다."]],"w":"2번 문장에서 today’s carrot has lower nutrient levels than its ancestor(오늘날의 당근이 조상보다 더 낮은 영양소 수준을 가진다)라고 함. 본문과 일치.","c":"T"},"h":"ecee55f5f4"},{"n":2,"t":"tf","q":"The major reason is that farmers now grow food slowly and carefully.","ko":"가장 주요한 이유는 농부들이 이제 식량을 천천히 신중하게 재배한다는 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The major reason is that farmers now focus on growing lots of food quickly.","가장 주요한 이유는 농부들이 이제 많은 식량을 빠르게 재배하는 데 주력한다는 것이다."]],"w":"4번 문장에서 농부들이 now focus on growing lots of food quickly(많은 식량을 빠르게 재배하는 데 주력한다)고 함. 천천히 신중하게라는 말은 반대.","c":"F"},"h":"e20afb483f"},{"n":3,"t":"tf","q":"Farmers should avoid a farming method that takes away minerals.","ko":"농부들은 미네랄을 없애는 농작법을 피해야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Also, farmers should avoid a farming method that takes away minerals.","또한 농부들은 미네랄을 없애는 농작법을 피해야 한다."]],"w":"9번 문장에 farmers should avoid a farming method that takes away minerals가 나옴. 본문과 일치.","c":"T"},"h":"e8a464aabd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…today’s carrot has lower nutrient levels than its ancestor.)","ko":"(…오늘날의 당근이 그것의 ( )보다 더 낮은 영양소 수준을 가지고 있다.)","opts":["후손","조상","농부","이웃"],"word":"ancestor","r":{"a":"2) 조상","ev":"2번 문장","s":[[2,"If you compare a carrot from 70 years ago with one that is grown today, you’ll find that today’s carrot has lower nutrient levels than its ancestor.","70년 전의 당근과 오늘날 재배되는 당근을 비교해 보면, 오늘날의 당근이 그것의 조상보다 더 낮은 영양소 수준을 가지고 있다는 것을 알게 될 것이다."]],"w":"2번에서 70년 전의 당근과 오늘날의 당근을 비교하는데, 오늘날 당근의 ancestor는 오래전의 당근. 먼저 있었던 쪽이라 ancestor = 조상.","c":2},"h":"9292c35784"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…when farmers grow too much food in the same soil, it can damage the soil.)","ko":"(…농부들이 같은 토양에서 너무 많은 식량을 재배하면, 그것이 토양을 ( ) 수 있다.)","opts":["비옥하게 하다","옮기다","손상을 주다","쉬게 하다"],"word":"damage","r":{"a":"3) 손상을 주다","ev":"6번 문장","s":[[6,"Another reason is that when farmers grow too much food in the same soil, it can damage the soil.","또 다른 이유는 농부들이 같은 토양에서 너무 많은 식량을 재배하면 그것이 토양을 손상시킬 수 있다는 것이다."]],"w":"6번에서 같은 땅에서 너무 많이 재배하는 것이 토양에 어떤 영향을 주는지를 말하고, 7번에서 식물이 건강하게 자라기 어렵다고 함. 나쁜 영향을 주는 것이라 damage = 손상을 주다. 쉬게 하는 것은 8번의 해결책(rest).","c":3},"h":"e88db1c709"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nIt means plants can’t get enough nutrients from the soil or make their own nutrients.","ko":"밑줄 친 their가 가리키는 것은?","sko":"그것은 식물들이 토양으로부터 충분한 영양소를 얻을 수 없거나 스스로 영양소를 만들 수 없다는 것을 의미한다.","opts":["식물들","농부들","당근들","토양"],"pron":"their","r":{"a":"1) 식물들","ev":"5번 문장","s":[[5,"It means plants can’t get enough nutrients from the soil or make their own nutrients.","그것은 식물들이 토양으로부터 충분한 영양소를 얻을 수 없거나 스스로 영양소를 만들 수 없다는 것을 의미한다."]],"w":"5번 문장: plants can’t get enough nutrients from the soil or make their own nutrients. 스스로 영양소를 만들지 못하는 주체는 plants(식물들)이므로 their = 식물들의.","c":1,"k":"their = 식물들"},"h":"263b9d609c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This makes it difficult for the plants to grow healthy.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 식물들이 건강하게 자라는 것을 어렵게 만든다.","opts":["이것 때문에 식물들이 건강하게 자라기가 어려워진다.","이것 때문에 식물들이 더 쉽게 자란다.","이것은 식물들이 건강한 이유를 설명한다.","이것 때문에 농부들이 건강하게 일하기 어려워진다."],"r":{"a":"1) 이것 때문에 식물들이 건강하게 자라기가 어려워진다.","ev":"6~7번 문장","s":[[6,"Another reason is that when farmers grow too much food in the same soil, it can damage the soil.","또 다른 이유는 농부들이 같은 토양에서 너무 많은 식량을 재배하면 그것이 토양을 손상시킬 수 있다는 것이다."],[7,"This makes it difficult for the plants to grow healthy.","이것은 식물들이 건강하게 자라는 것을 어렵게 만든다."]],"w":"This는 6번에서 말한 토양 손상. makes it difficult for the plants to grow healthy = 식물이 건강하게 자라기 어렵게 만든다. 농부의 건강 이야기는 없음.","c":1},"h":"18b0c985e8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["식물은 필요한 영양소를 모두 스스로 만들 수 있다.","농부들은 해마다 같은 토양에서 더 많은 식량을 재배해야 한다.","재배할 식물의 종류를 바꾸면 다음 농작물을 위해 토양이 더 좋아질 수 있다.","해마다 같은 식물만 키우면 토양이 더 좋아진다."],"opts":["Plants can make all the nutrients they need by themselves.","Farmers should grow more food in the same soil every year.","Changing the types of plants to grow can make the soil better for the next crops.","Growing the same plants every year makes the soil better."],"r":{"a":"3) Changing the types of plants to grow can make the soil better for the next crops. (재배할 식물의 종류를 바꾸면 다음 농작물을 위해 토양이 더 좋아질 수 있다.)","ev":"10번 문장","s":[[10,"Instead, changing the types of plants to grow can make the soil better for the next crops.","대신에, 재배할 식물의 종류를 바꾸는 것은 다음 농작물을 위해 토양을 더 좋게 만들 수 있다."]],"w":"10번 문장: changing the types of plants to grow(재배할 식물의 종류를 바꾸는 것)가 다음 농작물을 위해 토양을 더 좋게 만들 수 있다고 함. 5번에서 식물은 스스로 영양소를 만들 수 없다고 했고, 6번에서 같은 토양에 너무 많이 재배하면 토양이 손상된다고 했으므로 나머지는 틀림.","c":3},"h":"9c73ca665c"},{"n":9,"t":"sum","q":"Several (A) have shown that the levels of vitamins and minerals in fruits and vegetables have (B) since the early 20th century.","ko":"여러 (A)이(가) 보여 준 바에 따르면, 20세기 초 이후 과일과 채소의 비타민과 미네랄 수준은 (B).","oko":["(A) 연구 / (B) 늘어났다","(A) 연구 / (B) 그대로였다","(A) 농부 / (B) 줄어들었다","(A) 농부 / (B) 늘어났다","(A) 연구 / (B) 줄어들었다"],"opts":["(A) studies / (B) increased","(A) studies / (B) stayed","(A) farmers / (B) reduced","(A) farmers / (B) increased","(A) studies / (B) reduced"],"r":{"a":"5) (A) studies / (B) reduced (연구 / 줄어들었다)","ev":"1번 문장","s":[[1,"Several studies have shown that the levels of vitamins and minerals in fruits and vegetables have reduced since the early 20th century.","여러 연구는 20세기 초 이후로 과일과 채소의 비타민과 미네랄 수준이 줄어들었다는 것을 보여 주었다."]],"w":"1번 문장: Several studies have shown(여러 연구가 보여 주었다) that the levels of vitamins and minerals ... have reduced(비타민과 미네랄 수준이 줄어들었다). 늘어났거나 그대로라는 말은 본문과 반대이고, 보여 준 주체도 농부가 아니라 연구.","c":5},"h":"673311581c"},{"n":10,"t":"fill","q":"To fix this [A], the [B] thing to do is to let the soil rest.","ko":"이 [A]을(를) 해결하기 위해, 해야 할 [B] 일은 토양을 쉬게 하는 것이다.","bko":{"problem":"문제","first":"첫 번째의","minerals":"미네랄","quickly":"빠르게","crops":"농작물","vitamins":"비타민"},"bank":["problem","first","minerals","quickly","crops","vitamins"],"r":{"a":"[A] problem (문제), [B] first (첫 번째의)","ev":"8번 문장","s":[[8,"To fix this problem, the first thing to do is to let the soil rest.","이 문제를 해결하기 위해, 가장 먼저 해야 할 일은 토양을 쉬게 하는 것이다."]],"w":"8번 문장: To fix this problem(이 문제를 해결하기 위해), the first thing to do(가장 먼저 해야 할 일)는 let the soil rest(토양을 쉬게 하는 것). 나머지 단어는 이 자리에 문법적으로 맞지 않음.","c":null},"h":"29593044e1"}]},{"u":9,"id":"rg4-09-3","no":3,"ko":"대변으로 환자를 치료한다고?","items":[{"n":1,"t":"tf","q":"The new method puts healthy bacteria from a healthy person’s poo into a sick person’s gut.","ko":"새로운 방법은 건강한 사람의 대변에서 얻은 건강한 박테리아를 아픈 사람의 장에 넣는다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This unusual method involves taking healthy bacteria from a healthy person’s poo and putting them into a sick person’s gut.","이 특이한 방법은 건강한 사람의 대변에서 건강한 박테리아를 가져와 아픈 사람의 장에 넣는 것을 포함한다."]],"w":"3번 문장에 taking healthy bacteria from a healthy person’s poo and putting them into a sick person’s gut이 나옴. 본문과 일치.","c":"T"},"h":"b33d5f8fd6"},{"n":2,"t":"tf","q":"The treatment is mainly for patients who have never had a bone marrow transplant.","ko":"이 치료법은 주로 골수 이식을 한 번도 받지 않은 환자들을 위한 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The treatment is particularly aimed at patients who have had bone marrow transplants.","이 치료법은 특히 골수 이식을 받은 환자들을 대상으로 한다."]],"w":"5번 문장에서 patients who have had bone marrow transplants(골수 이식을 받은 환자들)를 대상으로 한다고 함. 한 번도 받지 않은 환자라는 말은 반대.","c":"F"},"h":"b60a441152"},{"n":3,"t":"tf","q":"Many patients with the side effect stay in the hospital for a long time.","ko":"부작용이 있는 많은 환자들은 오랫동안 병원에 머문다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Many patients with this side effect end up in the hospital for a long time.","이 부작용이 있는 많은 환자들은 결국 오랫동안 병원에 입원하게 된다."]],"w":"8번 문장에 Many patients with this side effect end up in the hospital for a long time이 나옴. 본문과 일치.","c":"T"},"h":"76a82ad8f9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The treatment is particularly aimed at patients who have had bone marrow transplants.)","ko":"(이 치료법은 ( ) 골수 이식을 받은 환자들을 대상으로 한다.)","opts":["거의","가끔","특히","결코"],"word":"particularly","r":{"a":"3) 특히","ev":"5번 문장","s":[[5,"The treatment is particularly aimed at patients who have had bone marrow transplants.","이 치료법은 특히 골수 이식을 받은 환자들을 대상으로 한다."]],"w":"4번까지 치료법의 효과를 말한 뒤, 5번에서 그중 가장 중요한 대상은 골수 이식을 받은 환자들이라고 좁혀 줌. 여러 환자 중에서 콕 집어 말하는 표현이라 particularly = 특히.","c":3},"h":"51e384c8d3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…to make the treatment safe and effective.)","ko":"(…치료법을 안전하고 ( ) 것으로 만들기 위해…)","opts":["위험한","효과적인","비싼","낯선"],"word":"effective","r":{"a":"2) 효과적인","ev":"10번 문장","s":[[10,"The scientists have been working hard so that they can make the treatment safe and effective.","과학자들은 그 치료법을 안전하고 효과적으로 만들 수 있도록 열심히 연구해 왔다."]],"w":"10번에서 과학자들이 치료법을 safe and effective하게 만들려고 열심히 연구함. safe(안전한)와 함께 나오는 좋은 뜻이라 effective = 효과적인.","c":2},"h":"8857adecdf"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAlthough a bone marrow transplant is common for some cancers, it can sometimes cause a serious side effect.","ko":"밑줄 친 it이 가리키는 것은?","sko":"비록 골수 이식이 일부 암에는 흔하지만, 그것은 때때로 심각한 부작용을 일으킬 수 있다.","opts":["골수 이식","대변","건강한 세포","병원"],"pron":"it","r":{"a":"1) 골수 이식","ev":"6번 문장","s":[[6,"Although a bone marrow transplant is common for some cancers, it can sometimes cause a serious side effect.","비록 골수 이식이 일부 암에는 흔하지만, 그것은 때때로 심각한 부작용을 일으킬 수 있다."]],"w":"6번 문장: 골수 이식이 일부 암에는 흔하지만 it(그것)이 때때로 심각한 부작용을 일으킬 수 있다는 내용. 부작용을 일으키는 것은 a bone marrow transplant(골수 이식).","c":1,"k":"it = 골수 이식"},"h":"5033d02a97"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It might sound strange, but it’s true!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이상하게 들릴지도 모르지만, 그것은 사실이다!","opts":["이상하게 들릴 수 있지만 사실이다.","이상하게 들려서 사실이 아니다.","이상하지 않기 때문에 사실이다.","사실이 아니지만 이상하게 들리지 않는다."],"r":{"a":"1) 이상하게 들릴 수 있지만 사실이다.","ev":"2번 문장","s":[[2,"It might sound strange, but it’s true!","이상하게 들릴지도 모르지만, 그것은 사실이다!"]],"w":"It might sound strange(이상하게 들릴지도 모른다), but it’s true(하지만 사실이다). but 앞뒤가 대조되어 '이상해 보여도 진짜'라는 뜻.","c":1},"h":"cd9b23dc67"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["호주의 과학자들이 혈액암에 걸린 사람들을 돕기 위해 대변을 실험하고 있다.","호주의 과학자들이 식물로 만든 새 약을 실험하고 있다.","일본의 과학자들이 뼈가 부러진 사람들을 돕기 위해 대변을 실험하고 있다.","새로운 치료법은 이미 모든 병원에서 쓰인다."],"opts":["Scientists in Australia are testing poo to help people with blood cancer.","Scientists in Australia are testing a new medicine made from plants.","Scientists in Japan are testing poo to help people with a broken bone.","The new treatment is already used in every hospital."],"r":{"a":"1) Scientists in Australia are testing poo to help people with blood cancer. (호주의 과학자들이 혈액암에 걸린 사람들을 돕기 위해 대변을 실험하고 있다.)","ev":"1번 문장","s":[[1,"Can you believe that scientists in Australia are testing “poo” to help people with blood cancer?","호주의 과학자들이 혈액암에 걸린 사람들을 돕기 위해 '대변'을 실험하고 있다는 것이 믿어지는가?"]],"w":"1번 문장: 호주의 과학자들이 혈액암에 걸린 사람들을 돕기 위해 poo(대변)를 실험 중. 식물로 만든 약, 일본, 모든 병원에서 이미 쓰인다는 말은 본문에 없음.","c":1},"h":"1b3b22bcc1"},{"n":9,"t":"sum","q":"Putting healthy bacteria into a sick person’s gut can (A) the immune system and help (B) diseases.","ko":"아픈 사람의 장에 건강한 박테리아를 넣으면 면역 체계를 (A) 수 있고 질병과 (B) 것을 도울 수 있다.","oko":["(A) 약화시킬 / (B) 싸우는","(A) 향상시킬 / (B) 일으키는","(A) 약화시킬 / (B) 일으키는","(A) 향상시킬 / (B) 무시하는","(A) 향상시킬 / (B) 싸우는"],"opts":["(A) weaken / (B) fight","(A) improve / (B) cause","(A) weaken / (B) cause","(A) improve / (B) ignore","(A) improve / (B) fight"],"r":{"a":"5) (A) improve / (B) fight (향상시킬 / 싸우는)","ev":"3~4번 문장","s":[[3,"This unusual method involves taking healthy bacteria from a healthy person’s poo and putting them into a sick person’s gut.","이 특이한 방법은 건강한 사람의 대변에서 건강한 박테리아를 가져와 아픈 사람의 장에 넣는 것을 포함한다."],[4,"This can improve a person’s immune system and help fight diseases.","이것은 사람의 면역 체계를 향상시킬 수 있고 질병과 싸우는 것을 도울 수 있다."]],"w":"3번에서 건강한 박테리아를 아픈 사람의 장에 넣는다고 했고, 4번에서 This can improve(향상시킬 수 있다) a person’s immune system and help fight diseases(질병과 싸우는 것을 돕는다)라고 함. weaken(약화시키다), cause(일으키다), ignore(무시하다)는 본문과 반대.","c":5},"h":"54ab7bb6a9"},{"n":10,"t":"fill","q":"After a bone marrow transplant, the new cells can see the person’s own tissue as [A] and [B] the healthy cells.","ko":"골수 이식 후에, 새로운 세포들은 그 사람 자신의 조직을 [A] 것으로 여겨 건강한 세포들을 [B] 수 있다.","bko":{"unfamiliar":"낯선","attack":"공격하다","safe":"안전한","hospital":"병원","bacteria":"박테리아","patients":"환자들"},"bank":["unfamiliar","attack","safe","hospital","bacteria","patients"],"r":{"a":"[A] unfamiliar (낯선), [B] attack (공격하다)","ev":"7번 문장","s":[[7,"After a bone marrow transplant, the new cells can see the person’s own tissue as unfamiliar and attack the healthy cells.","골수 이식 후에, 새로운 세포들은 그 사람 자신의 조직을 낯선 것으로 여겨 건강한 세포들을 공격할 수 있다."]],"w":"7번 문장: 새로운 세포들이 자기 조직을 unfamiliar(낯선 것)로 여겨 healthy cells(건강한 세포들)를 attack(공격하다)할 수 있다고 함. safe(안전한)로 여기면 공격할 이유가 없고, 나머지는 문법적으로 맞지 않음.","c":null},"h":"d3b7b3f8e7"}]},{"u":10,"id":"rg4-10-1","no":1,"ko":"해변에서 발견된 푸른 돌의 정체는?","items":[{"n":1,"t":"tf","q":"Santos found strange blue-green rocks on Trindade island.","ko":"Santos는 트린다지 섬에서 이상한 청록색 바위들을 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"However, in 2019, geologist Fernanda Avelar Santos found something unusual there: strange blue-green rocks!","그러나 2019년에 지질학자 Fernanda Avelar Santos가 그곳에서 특이한 것을 발견했는데, 바로 이상한 청록색 바위들이었다!"]],"w":"3번 문장에 Santos가 there(그 섬)에서 strange blue-green rocks를 발견했다고 나옴. 같은 내용이라 T.","c":"T"},"h":"433983be99"},{"n":2,"t":"tf","q":"The rocks were made only from natural rock material.","ko":"그 바위들은 자연적인 암석 물질로만 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"After analysis, she realized these weren’t ordinary rocks, but a mix of natural rock material and plastic trash.","분석 후, 그녀는 이것들이 평범한 바위가 아니라 자연적인 암석 물질과 플라스틱 쓰레기가 섞인 것임을 알게 되었다."]],"w":"5번 문장에서 바위는 자연 암석 물질과 플라스틱 쓰레기가 섞인 것(a mix of natural rock material and plastic trash)이라고 함. 자연 물질로만 됐다는 말은 틀려서 F.","c":"F"},"h":"5a584ba82d"},{"n":3,"t":"tf","q":"Santos said that the plastic rocks will leave a lasting mark in Earth’s geological record.","ko":"Santos는 플라스틱 바위가 지구의 지질학적 기록에 지속적인 흔적을 남길 것이라고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"They will leave a lasting mark in Earth’s geological record.”","그것들은 지구의 지질학적 기록에 지속적인 흔적을 남길 것입니다.”라고 말했다."]],"w":"10번 문장에 They will leave a lasting mark in Earth’s geological record라고 나옴. will leave는 leave(남기다)의 미래 표현. 같은 내용이라 T.","c":"T"},"h":"6633fc1720"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Under the hot sun, this plastic melted and stuck to the beach…)","ko":"뜨거운 태양 아래에서, 이 플라스틱이 녹아 해변에 ( )…","opts":["떠났다","달라붙었다","가라앉았다","사라졌다"],"word":"stuck","r":{"a":"2) 달라붙었다","ev":"7번 문장","s":[[7,"Under the hot sun, this plastic melted and stuck to the beach, forming these unique rocks.","뜨거운 태양 아래에서 이 플라스틱이 녹아 해변에 달라붙었고, 이 독특한 바위들을 만들었다."]],"w":"7번에서 플라스틱이 뜨거운 태양에 녹아 해변에 달라붙어(stuck) 바위를 만들었음. stuck은 stick(달라붙다)의 과거형. 떠나거나 사라졌다면 바위가 생길 수 없음.","c":2},"h":"bbb8e77782"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Santos’s discovery shows human impact on even remote areas.)","ko":"Santos의 발견은 심지어 ( ) 지역에까지 미치는 인간의 영향을 보여 준다.","opts":["가까운","붐비는","외딴","새로운"],"word":"remote","r":{"a":"3) 외딴","ev":"1번, 8번 문장","s":[[1,"There are few places on Earth as remote as Trindade island, needing a three- or four-day boat trip off the coast of Brazil.","브라질 해안에서 3~4일 보트 여행이 필요한 트린다지(Trindade) 섬만큼 외딴 곳은 지구상에 거의 없다."],[8,"Santos’s discovery shows human impact on even remote areas.","Santos의 발견은 심지어 외딴 지역에까지 미치는 인간의 영향력을 보여 준다."]],"w":"1번에서 remote는 트린다지 섬이 사람 거의 없는 외딴 곳이라는 뜻이고, 8번에서도 그런 외딴 지역에까지 인간의 영향이 미친다는 뜻. 가깝거나 붐빈다는 뜻이면 ‘심지어(even)’와 맞지 않음.","c":3},"h":"b1a88fa387"},{"n":6,"t":"ref","q":"What does the underlined \"She\" refer to?\nShe said, “These plastic rocks are evidence of how human actions are changing natural processes.”","ko":"밑줄 친 She가 가리키는 것은?","sko":"그녀는 “이 플라스틱 바위들은 인간의 행동이 자연적 과정을 어떻게 바꾸고 있는지에 대한 증거입니다.”라고 말했다.","opts":["지질학자 Santos","해류","섬의 희귀 동물","실험실의 동료"],"pron":"She","r":{"a":"1) 지질학자 Santos","ev":"8~9번 문장","s":[[8,"Santos’s discovery shows human impact on even remote areas.","Santos의 발견은 심지어 외딴 지역에까지 미치는 인간의 영향력을 보여 준다."],[9,"She said, “These plastic rocks are evidence of how human actions are changing natural processes.","그녀는 “이 플라스틱 바위들은 인간의 행동이 자연적 과정을 어떻게 바꾸고 있는지에 대한 증거입니다."]],"w":"8번에서 Santos의 발견을 이야기하고, 9번 She said로 이어짐. 플라스틱 바위가 인간 행동의 증거라고 말한 사람은 지질학자 Santos.","c":1,"k":"She = 지질학자 Santos"},"h":"8c3102a799"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"She was curious about them and took some back to her lab.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그녀는 그것들이 궁금해서 몇 개를 자신의 실험실로 가져갔다.","opts":["그녀는 그것들이 궁금해서 몇 개를 실험실로 가져갔다.","그녀는 그것들에 관심이 없어서 모두 버렸다.","그녀는 실험실에서 가져온 몇 개를 섬에 두고 왔다.","그녀는 그것들이 무서워서 몇 개를 다른 사람에게 보냈다."],"r":{"a":"1) 그녀는 그것들이 궁금해서 몇 개를 실험실로 가져갔다.","ev":"4번 문장","s":[[4,"She was curious about them and took some back to her lab.","그녀는 그것들이 궁금해서 몇 개를 자신의 실험실로 가져갔다."]],"w":"She was curious about them(그녀는 그것들이 궁금했다) and took some back to her lab(몇 개를 실험실로 가져갔다). 궁금해서 가져갔다는 뜻이고, 버렸거나 두고 왔다는 말은 없음.","c":1},"h":"1b87911f5c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["브라질에서 트린다지 섬까지 가려면 배로 3~4일이 걸린다.","트린다지 섬은 브라질에서 배로 한 시간밖에 걸리지 않는다.","트린다지 섬은 큰 도시들로 유명하다.","트린다지 섬으로 가는 배는 매시간 있다."],"opts":["It takes three or four days by boat to reach Trindade island from Brazil.","Trindade island is only one hour away from Brazil by boat.","Trindade island is famous for its large cities.","A boat goes to Trindade island every hour."],"r":{"a":"1) It takes three or four days by boat to reach Trindade island from Brazil. (브라질에서 트린다지 섬까지 가려면 배로 3~4일이 걸린다.)","ev":"1번 문장","s":[[1,"There are few places on Earth as remote as Trindade island, needing a three- or four-day boat trip off the coast of Brazil.","브라질 해안에서 3~4일 보트 여행이 필요한 트린다지(Trindade) 섬만큼 외딴 곳은 지구상에 거의 없다."]],"w":"1번 문장: 브라질 해안에서 three- or four-day boat trip(3~4일 보트 여행)이 필요함. 한 시간, 큰 도시, 매시간 배는 본문과 맞지 않고, 2번에서 사람이 거의 없는 섬이라고 했음.","c":1},"h":"2ba1408f56"},{"n":9,"t":"sum","q":"Ocean currents had (A) and piled plastic trash like fishing nets and (B) to the island.","ko":"해류가 어망과 (B) 같은 플라스틱 쓰레기를 그 섬으로 (A) 쌓아 놓았다.","oko":["(A) 실어 나르고 / (B) 새","(A) 실어 나르고 / (B) 병","(A) 멈추고 / (B) 병","(A) 태우고 / (B) 병","(A) 실어 나르고 / (B) 모래"],"opts":["(A) carried / (B) birds","(A) carried / (B) bottles","(A) stopped / (B) bottles","(A) burned / (B) bottles","(A) carried / (B) sand"],"r":{"a":"2) (A) carried / (B) bottles (실어 나르고 / 병)","ev":"6번 문장","s":[[6,"Santos found that ocean currents had carried and piled plastic trash like fishing nets and bottles to the island.","Santos는 해류가 어망과 병 같은 플라스틱 쓰레기를 그 섬으로 실어 나르고 쌓아 놓았다는 것을 알아냈다."]],"w":"6번 문장: ocean currents had carried and piled(해류가 실어 나르고 쌓아 놓았다) plastic trash like fishing nets and bottles(어망과 병 같은 플라스틱 쓰레기). stopped(멈추다)와 burned(태우다)는 본문과 다르고, 새와 모래는 플라스틱 쓰레기의 예가 아님.","c":2},"h":"be21cdf075"},{"n":10,"t":"fill","q":"The island is [A] to rare [B] and a place with almost no humans.","ko":"그 섬은 희귀한 [B]의 [A]이고 사람이 거의 없는 곳이다.","bko":{"home":"서식지","animals":"동물들","lab":"실험실","sun":"태양","boat":"보트","coast":"해안"},"bank":["home","animals","lab","sun","boat","coast"],"r":{"a":"[A] home (서식지), [B] animals (동물들)","ev":"2번 문장","s":[[2,"The island is home to rare animals and a place with almost no humans.","그 섬은 희귀 동물들의 서식지이고 사람이 거의 없는 곳이다."]],"w":"2번 문장: The island is home to rare animals(그 섬은 희귀 동물들의 서식지)이고 almost no humans(사람이 거의 없는 곳). lab, sun, boat, coast는 이 자리에 문법적으로나 의미상 맞지 않음.","c":null},"h":"9d629d8d49"}]},{"u":10,"id":"rg4-10-2","no":2,"ko":"화성에서 들은 소리는 어떻게 다를까?","items":[{"n":1,"t":"tf","q":"The speed of sound on Earth is about 343 meters per second.","ko":"지구에서 소리의 속도는 초당 약 343미터이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"On Earth, sound travels at a speed of 343 meters per second.","지구에서는 소리가 초당 343미터의 속도로 이동한다."]],"w":"5번 문장에 On Earth, sound travels at a speed of 343 meters per second라고 나옴. travels는 travel(이동하다)의 형태. 같은 내용이라 T.","c":"T"},"h":"874f8f5795"},{"n":2,"t":"tf","q":"Sound travels faster on Mars than on Earth.","ko":"소리는 지구에서보다 화성에서 더 빨리 이동한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번, 6번 문장","s":[[4,"Scientists found that the speed of sound on Mars is slower than on Earth.","과학자들은 화성에서 소리의 속도가 지구에서보다 느리다는 것을 발견했다."],[6,"On Mars, it travels at around 240 meters per second.","화성에서는 초당 약 240미터의 속도로 이동한다."]],"w":"4번 문장에서 화성의 소리 속도가 지구보다 느리다고 하고, 6번에서 화성은 약 240미터로 지구(343미터)보다 느림. 빠르다는 진술은 반대라서 F.","c":"F"},"h":"ec3cd8592d"},{"n":3,"t":"tf","q":"The violin sound would be heard before the double bass on Mars.","ko":"화성에서는 바이올린 소리가 더블 베이스 소리보다 먼저 들릴 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"If an orchestra played on Mars, you would hear the violins first and the double bass later.","만약 오케스트라가 화성에서 연주한다면, 여러분은 바이올린 소리를 먼저 듣고 더블 베이스 소리를 나중에 들을 것이다."]],"w":"10번 문장에 you would hear the violins first and the double bass later라고 나옴. hear는 듣다. 높은 음이 먼저 들리므로 T.","c":"T"},"h":"5a3c3df211"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Mars’ thin atmosphere of mostly carbon dioxide doesn’t carry sound very well.)","ko":"이산화탄소로 이루어진 화성의 ( ) 대기는 소리를 잘 전달하지 못한다.","opts":["희박한","두꺼운","따뜻한","무거운"],"word":"thin","r":{"a":"1) 희박한","ev":"7번 문장","s":[[7,"This is because Mars’ thin atmosphere of mostly carbon dioxide doesn’t carry sound very well.","이는 대부분 이산화탄소로 이루어진 화성의 희박한 대기가 소리를 잘 전달하지 못하기 때문이다."]],"w":"7번에서 화성의 thin atmosphere가 소리를 잘 전달하지 못한다고 함. 대기가 얇고 희박해서 소리를 못 전하는 것이라 ‘희박한’. 두껍거나 무거우면 오히려 소리를 잘 전할 것임.","c":1},"h":"c473848ed5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They also found that higher-pitched sounds can be heard slightly faster on Mars.)","ko":"그들은 또한 더 높은 음조의 소리가 화성에서 ( ) 더 빨리 들릴 수 있다는 것을 발견했다.","opts":["아주 많이","절대 안","천천히","약간, 조금"],"word":"slightly","r":{"a":"4) 약간, 조금","ev":"9번 문장","s":[[9,"They also found that higher-pitched sounds can be heard slightly faster on Mars.","그들은 또한 화성에서 더 높은 음조의 소리가 좀 더 빨리 들릴 수 있다는 것을 발견했다."]],"w":"9번에서 높은 음이 faster(더 빨리) 들린다고 하는데, 10번 예시에서 바이올린이 ‘먼저’ 들릴 뿐 큰 차이는 아니라서 slightly는 ‘약간’. 아주 많이라면 둘의 차이가 크다는 뜻이라 맞지 않음.","c":4},"h":"9170970dfe"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nIf someone spoke next to you, their voice would sound so quiet.","ko":"밑줄 친 their가 가리키는 것은?","sko":"만약 누군가가 여러분 옆에서 말을 한다면, 그들의 목소리는 매우 조용하게 들릴 것이다.","opts":["옆에서 말하는 누군가","화성의 로버","NASA의 과학자들","여러분"],"pron":"their","r":{"a":"1) 옆에서 말하는 누군가","ev":"8번 문장","s":[[8,"If someone spoke next to you, their voice would sound so quiet.","만약 누군가가 여러분 옆에서 말을 한다면, 그들의 목소리는 매우 조용하게 들릴 것이다."]],"w":"8번 문장: If someone spoke next to you, their voice would sound so quiet. 목소리가 조용하게 들리는 사람은 옆에서 말하는 someone(누군가)이므로 their = 누군가의.","c":1,"k":"their = 옆에서 말하는 누군가"},"h":"6c78d24297"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For the first time, humans could hear sounds from another planet!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"처음으로 인간은 다른 행성의 소리를 들을 수 있었다!","opts":["처음으로 인간이 다른 행성의 소리를 들을 수 있었다.","인간은 이미 오래전부터 다른 행성의 소리를 들어 왔다.","인간은 다른 행성의 소리를 들을 수 없었다.","처음으로 인간이 다른 행성에 도착했다."],"r":{"a":"1) 처음으로 인간이 다른 행성의 소리를 들을 수 있었다.","ev":"3번 문장","s":[[3,"For the first time, humans could hear sounds from another planet!","처음으로 인간은 다른 행성의 소리를 들을 수 있었다!"]],"w":"For the first time(처음으로), humans could hear sounds from another planet(인간이 다른 행성의 소리를 들을 수 있었다). 소리를 듣게 된 것이 처음이라는 뜻이고, 행성에 도착했다는 말은 없음.","c":1},"h":"688657532d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["퍼서비어런스 로버는 2021년 2월 이후로 화성에서 소리를 녹음해 왔다.","퍼서비어런스 로버는 지구에서 소리를 녹음했다.","퍼서비어런스 로버는 소리를 녹음할 수 없다.","퍼서비어런스 로버는 2012년에 화성에 상륙했다."],"opts":["The Perseverance rover has recorded sounds on Mars since February 2021.","The Perseverance rover recorded sounds on Earth.","The Perseverance rover cannot record sounds.","The Perseverance rover landed on Mars in 2012."],"r":{"a":"1) The Perseverance rover has recorded sounds on Mars since February 2021. (퍼서비어런스 로버는 2021년 2월 이후로 화성에서 소리를 녹음해 왔다.)","ev":"1번 문장","s":[[1,"NASA’s space robot called the Perseverance rover has recorded sounds on Mars since its landing in February 2021.","NASA의 우주 로봇인 퍼서비어런스 로버(Perseverance rover)는 2021년 2월 상륙한 이후로 화성에서 소리를 녹음해 왔다."]],"w":"1번 문장: 퍼서비어런스 로버는 2021년 2월 상륙한 이후로 화성에서 소리를 녹음해 왔음. 지구에서 녹음했다거나, 녹음할 수 없다거나, 2012년에 상륙했다는 말은 본문과 다름.","c":1},"h":"0f315c8483"},{"n":9,"t":"sum","q":"Measuring the speed of sound can give scientists a (A) way to learn about Mars’ atmosphere and (B).","ko":"소리의 속도를 측정하는 것은 과학자들에게 화성의 대기와 (B)에 대해 배울 수 있는 (A) 방법을 제공할 수 있다.","oko":["(A) 더 나은 / (B) 환경","(A) 더 나쁜 / (B) 환경","(A) 더 나은 / (B) 날씨","(A) 더 나쁜 / (B) 날씨","(A) 더 어려운 / (B) 환경"],"opts":["(A) better / (B) environment","(A) worse / (B) environment","(A) better / (B) weather","(A) worse / (B) weather","(A) harder / (B) environment"],"r":{"a":"1) (A) better / (B) environment (더 나은 / 환경)","ev":"12번 문장","s":[[12,"Measuring the speed of sound can give scientists a better way to learn about Mars’ atmosphere and environment.","소리의 속도를 측정하는 것은 과학자들에게 화성의 대기와 환경에 대해 배울 수 있는 더 나은 방법을 제공할 수 있다."]],"w":"12번 문장: Measuring the speed of sound(소리의 속도를 측정하는 것)가 과학자들에게 a better way(더 나은 방법)를 줘서 Mars’ atmosphere and environment(화성의 대기와 환경)를 배울 수 있게 함. worse(더 나쁜), harder(더 어려운), weather(날씨)는 본문과 맞지 않음.","c":1},"h":"71939f254e"},{"n":10,"t":"fill","q":"This means they wouldn’t be able to [A] [B] as they do on Earth.","ko":"이것은 그들이 지구에서처럼 [B]을(를) [A] 수 없을 것이라는 것을 의미한다.","bko":{"create":"만들어 내다","harmony":"화음","orchestra":"오케스트라","speed":"속도","landing":"상륙","loud":"시끄러운"},"bank":["create","harmony","orchestra","speed","landing","loud"],"r":{"a":"[A] create (만들어 내다), [B] harmony (화음)","ev":"11번 문장","s":[[11,"This means they wouldn’t be able to create harmony as they do on Earth.","이것은 그들이 지구에서처럼 화음을 만들어 낼 수 없을 것이라는 것을 의미한다."]],"w":"11번 문장: they wouldn’t be able to create harmony(화음을 만들어 낼 수 없을 것) as they do on Earth. 나머지 단어는 이 자리에 문법적으로나 의미상 맞지 않음.","c":null},"h":"f16bcf038f"}]},{"u":10,"id":"rg4-10-3","no":3,"ko":"평생 빨래로 모은 돈, 어디에 썼을까?","items":[{"n":1,"t":"tf","q":"The banker asked McCarty to divide the coins.","ko":"은행가는 McCarty에게 동전을 나누어 달라고 요청했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The banker gave her 10 coins, each worth 10 percent of her savings, and asked her to divide the coins.","그 은행가는 그녀에게 각각 그녀의 저축액의 10퍼센트만큼 가치가 있는 동전 10개를 주었고, 그녀에게 그 동전들을 나누어 달라고 요청했다."]],"w":"3번 문장에 The banker gave her 10 coins and asked her to divide the coins라고 나옴. gave는 give(주다), asked는 ask(요청하다)의 과거형. 같은 내용이라 T.","c":"T"},"h":"a15d0fc3c3"},{"n":2,"t":"tf","q":"McCarty gave three coins to her church.","ko":"McCarty는 교회에 동전 세 개를 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"McCarty distributed one coin to her church, three coins to her cousins, and the remaining six to the University of Southern Mississippi.","McCarty는 동전 한 개를 그녀의 교회에, 동전 세 개를 그녀의 사촌들에게, 그리고 나머지 여섯 개는 남미시시피 대학에 분배했다."]],"w":"4번 문장에서 교회에는 one coin(한 개)을, 세 개는 사촌들(her cousins)에게 줌. 숫자가 바뀌어서 F.","c":"F"},"h":"67895bd1f4"},{"n":3,"t":"tf","q":"The group’s symbol is a tree with six coins.","ko":"그 그룹의 상징은 동전 여섯 개가 달린 나무이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"The group’s symbol is a tree with six coins at the end of its branches.","그 그룹의 상징은 나뭇가지 끝에 여섯 개의 동전이 달린 한 그루의 나무이다."]],"w":"10번 문장에 The group’s symbol is a tree with six coins at the end of its branches라고 나옴. 같은 내용이라 T.","c":"T"},"h":"864f1d9372"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (McCarty distributed one coin to her church, three coins to her cousins, and the remaining six to the University of Southern Mississippi.)","ko":"McCarty는 동전 한 개를 교회에, 세 개를 사촌들에게, 그리고 남은 여섯 개는 남미시시피 대학에 ( ).","opts":["모으다","숨기다","분배했다","빌려 주다"],"word":"distributed","r":{"a":"3) 분배했다","ev":"4번 문장","s":[[4,"McCarty distributed one coin to her church, three coins to her cousins, and the remaining six to the University of Southern Mississippi.","McCarty는 동전 한 개를 그녀의 교회에, 동전 세 개를 그녀의 사촌들에게, 그리고 나머지 여섯 개는 남미시시피 대학에 분배했다."]],"w":"4번에서 McCarty는 동전 10개를 교회(1), 사촌들(3), 대학(6)에 나누어 주었음. distributed는 distribute(분배하다)의 과거형. 모으거나 숨기거나 빌려 준 것이 아니라 나누어 준 것.","c":3},"h":"deb00c00b1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It symbolizes McCarty’s generous contribution to the university.)","ko":"그것은 McCarty가 대학에 한 ( ) 기여를 상징한다.","opts":["너그러운","화난","가난한","짧은"],"word":"generous","r":{"a":"1) 너그러운","ev":"5번, 11번 문장","s":[[5,"She donated $150,000 to the university for African American students who couldn’t afford college fees.","그녀는 대학 학비를 낼 형편이 안 되는 아프리카계 미국인 학생들을 위해 15만 달러를 그 대학에 기부했다."],[11,"It symbolizes McCarty’s generous contribution to the university.","그것은 McCarty가 그 대학에 한 너그러운 기여를 상징한다."]],"w":"11번의 generous contribution은 5번에서 15만 달러를 학비 낼 형편이 안 되는 학생들을 위해 기부한 일을 가리킴. 많은 돈을 선뜻 내놓은 것이라 ‘너그러운’. 화나거나 가난하거나 짧다는 뜻은 맞지 않음.","c":1},"h":"099350b6ff"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\n“They can have the chance that I didn’t have,” said McCarty.","ko":"밑줄 친 They가 가리키는 것은?","sko":"“그들은 제가 가지지 못했던 기회를 가질 수 있어요.”라고 McCarty는 말했다.","opts":["은행가와 사촌들","동전 여섯 개","대학 학비를 낼 형편이 안 되는 학생들","McCarty Legacy Society 회원들"],"r":{"a":"3) 대학 학비를 낼 형편이 안 되는 학생들","ev":"5번, 8번 문장","s":[[5,"She donated $150,000 to the university for African American students who couldn’t afford college fees.","그녀는 대학 학비를 낼 형편이 안 되는 아프리카계 미국인 학생들을 위해 15만 달러를 그 대학에 기부했다."],[8,"They can have the chance that I didn’t have,” said McCarty.","그들은 제가 가지지 못했던 기회를 가질 수 있어요.”라고 McCarty는 말했다."]],"w":"8번 They can have the chance that I didn’t have에서 They는 바로 앞 6번의 them(교육받기를 원하는 대상)이고, 5번의 African American students who couldn’t afford college fees를 가리킴. 그 학생들이 McCarty가 갖지 못한 기회를 갖게 됨.","c":3,"k":"They = 대학 학비를 낼 형편이 안 되는 학생들"},"pron":"They","h":"9990dd9f2b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"I had to work hard all my life.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"저는 제 평생 일해야만 했거든요.","opts":["McCarty는 일하는 것을 좋아해서 평생 일했다.","McCarty는 평생 열심히 일해야만 했다.","McCarty는 평생 한 번도 일하지 않았다.","McCarty는 일을 하는 학생들을 도왔다."],"r":{"a":"2) McCarty는 평생 열심히 일해야만 했다.","ev":"7번 문장","s":[[7,"I had to work hard all my life.","저는 제 평생 일해야만 했거든요."]],"w":"7번의 had to work hard all my life는 평생 열심히 일해야 했다는 뜻. had to는 have to(~해야 한다)의 과거형이라 ‘어쩔 수 없이 해야 했던’ 일. 좋아서 한 것이 아님. 이 문장은 학생들은 자기처럼 고생하지 않고 공부했으면 하는 마음(6번, 8번)으로 이어짐.","c":2},"h":"0cb87d33a0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["McCarty는 다른 사람들을 위해 빨래를 해서 25만 달러 이상을 저축했다.","McCarty는 소도시의 은행가였다.","McCarty는 평생 2,500달러만 저축했다.","McCarty는 대학에서 가르치며 생계를 꾸렸다."],"opts":["McCarty saved more than $250,000 by doing laundry for others.","McCarty was a banker in a small town.","McCarty saved only $2,500 in her life.","McCarty made her living by teaching at a university."],"r":{"a":"1) McCarty saved more than $250,000 by doing laundry for others. (McCarty는 다른 사람들을 위해 빨래를 해서 25만 달러 이상을 저축했다.)","ev":"1번 문장","s":[[1,"An elderly lady named Oseola McCarty had spent her whole life doing laundry for others and saved more than $250,000.","Oseola McCarty라는 이름의 한 노년의 여성은 다른 사람들을 위해 옷을 세탁하는 데 평생을 보냈고 25만 달러 이상을 저축했다."]],"w":"1번 문장: McCarty는 평생 다른 사람들을 위해 doing laundry(빨래를 해서) 25만 달러 이상을 저축함. 은행가는 2번에 나오는 다른 사람이고, 2,500달러나 대학 강의는 본문에 없음.","c":1},"h":"e87d6931de"},{"n":9,"t":"sum","q":"Today, those who donate to the university are (A) of a group (B) as the McCarty Legacy Society.","ko":"오늘날, 그 대학에 기부하는 사람들은 McCarty Legacy Society로 (B) 그룹의 (A)이다.","oko":["(A) 일부 / (B) 알려진","(A) 일부 / (B) 숨겨진","(A) 적 / (B) 알려진","(A) 적 / (B) 숨겨진","(A) 주인 / (B) 숨겨진"],"opts":["(A) part / (B) known","(A) part / (B) hidden","(A) enemies / (B) known","(A) enemies / (B) hidden","(A) owners / (B) hidden"],"r":{"a":"1) (A) part / (B) known (일부 / 알려진)","ev":"9번 문장","s":[[9,"Today, those who donate to the university are part of a group known as the McCarty Legacy Society.","오늘날, 그 대학에 기부하는 사람들은 McCarty Legacy Society로 알려진 그룹의 일원이다."]],"w":"9번 문장: 대학에 기부하는 사람들은 are part of a group known as(~로 알려진 그룹의 일부) the McCarty Legacy Society. enemies(적)와 owners(주인)는 본문과 다르고, hidden(숨겨진)이라는 말도 없음.","c":1},"h":"5e4cb45db9"},{"n":10,"t":"fill","q":"One day, she [A] to donate her [B], so she asked for help from a small-town banker.","ko":"어느 날, 그녀는 자신의 [B]을(를) 기부하기를 [A], 그래서 소도시의 은행가에게 도움을 청했다.","bko":{"wanted":"원했다","money":"돈","tree":"나무","church":"교회","cousins":"사촌들","symbol":"상징"},"bank":["wanted","money","tree","church","cousins","symbol"],"r":{"a":"[A] wanted (원했다), [B] money (돈)","ev":"2번 문장","s":[[2,"One day, she wanted to donate her money, so she asked for help from a small-town banker.","어느 날, 그녀는 돈을 기부하고 싶어서 소도시의 은행가에게 도움을 청했다."]],"w":"2번 문장: she wanted to donate her money(자신의 돈을 기부하고 싶었다)고 해서 은행가에게 도움을 청함. tree(나무)와 symbol(상징)은 10번, church(교회)와 cousins(사촌들)는 4번에 나오는 말이라 이 자리에 맞지 않음.","c":null},"h":"e7d62f34b5"}]},{"u":11,"id":"rg4-11-1","no":1,"ko":"화성에 감자로 집을 짓는다고?","items":[{"n":1,"t":"tf","q":"Sending one brick to Mars could cost $2 million.","ko":"벽돌 하나를 화성에 보내는 데 2백만 달러가 들 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Surprisingly, sending just one brick there could cost $2 million!","놀랍게도, 단지 벽돌 하나를 그곳에 보내는 것에 2백만 달러가 들 수 있다!"]],"w":"2번 문장에 sending just one brick there could cost $2 million이라고 나옴. 같은 내용이라 T.","c":"T"},"h":"87b1817496"},{"n":2,"t":"tf","q":"StarCrete uses sugar as a glue.","ko":"StarCrete는 접착제로 설탕을 사용한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"StarCrete is unique because it uses starch as a glue.","스타크리트는 접착제로 전분을 사용하기 때문에 독특하다."]],"w":"6번 문장에서 StarCrete가 접착제(glue)로 쓰는 것은 starch(전분)라고 함. 설탕(sugar)이 아니라서 F. 전분은 감자에서 얻음(4번 potato starch).","c":"F"},"h":"2abd55cb4d"},{"n":3,"t":"tf","q":"Everything sent to space needs to be light.","ko":"우주로 보내는 모든 것은 가벼워야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Everything we send to space, like satellites or building materials, needs to be light.","위성이나 건축 자재와 같이 우리가 우주로 보내는 모든 것은 가벼워야 한다."]],"w":"9번 문장에 Everything we send to space, like satellites or building materials, needs to be light라고 나옴. 같은 내용이라 T.","c":"T"},"h":"c8b11fdfc7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Surprisingly, sending just one brick there could cost $2 million!)","ko":"( ), 단지 벽돌 하나를 그곳에 보내는 데 2백만 달러가 들 수 있다!","opts":["천천히","놀랍게도","조용히","다행히"],"word":"Surprisingly","r":{"a":"2) 놀랍게도","ev":"2번 문장","s":[[2,"Surprisingly, sending just one brick there could cost $2 million!","놀랍게도, 단지 벽돌 하나를 그곳에 보내는 것에 2백만 달러가 들 수 있다!"]],"w":"2번에서 벽돌 하나가 2백만 달러라니 놀라운 일. Surprisingly는 ‘놀랍게도’. 이어지는 3번에서 그래서 StarCrete를 발명했다고 하니 천천히나 조용히는 맞지 않음.","c":2},"h":"70400577ae"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Since StarCrete won’t need any additional technology or equipment, astronauts’ missions could be simpler and cheaper.)","ko":"스타크리트는 ( ) 기술이나 장비를 필요로 하지 않을 것이기 때문에, 우주 비행사의 임무는 더 단순하고 더 저렴해질 수 있다.","opts":["더 이상 없는","오래된","추가의","위험한"],"word":"additional","r":{"a":"3) 추가의","ev":"13번 문장","s":[[13,"Since StarCrete won’t need any additional technology or equipment, astronauts’ missions could be simpler and cheaper.","스타크리트는 추가적인 기술이나 장비를 필요로 하지 않을 것이기 때문에, 우주 비행사의 임무는 더 단순해지고 비용이 더 적게 들 수 있다."]],"w":"13번에서 StarCrete는 additional technology or equipment(추가적인 기술이나 장비)가 필요 없다고 함. 그래서 임무가 단순하고 싸짐. 오래되거나 위험한 기술이라는 뜻이 아님.","c":3},"h":"a15ef52216"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nImagine making houses on Mars from potatoes — it sounds like a funny science fiction story, but it could happen!","ko":"밑줄 친 it이 가리키는 것은?","sko":"감자로 화성에 집을 짓는 것을 상상해 보라. 재미있는 공상 과학 이야기처럼 들리지만, 그것은 일어날 수 있다!","opts":["우주 먼지","감자","재미있는 공상 과학 이야기","화성에서 감자로 집을 짓는 일"],"r":{"a":"4) 화성에서 감자로 집을 짓는 일","ev":"5번 문장","s":[[5,"Imagine making houses on Mars from potatoes — it sounds like a funny science fiction story, but it could happen!","감자로 화성에 집을 짓는 것을 상상해 보라. 재미있는 공상 과학 이야기처럼 들리지만, 그것은 일어날 수 있다!"]],"w":"5번에서 Imagine(상상해 보라) 뒤의 making houses on Mars from potatoes(감자로 화성에 집을 짓는 일)가 공상 과학처럼 들리지만 일어날 수 있다는 말. but it could happen의 it은 그 일을 가리킴. 감자나 우주 먼지 자체가 일어난다는 뜻은 아님.","c":4},"pron":"it","h":"abc6f4aa18"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The heavier it is, the more it costs to send up there.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 무거우면 무거울수록, 그곳으로 올려 보내는 데 비용이 더 많이 든다.","opts":["우주로 보내는 물건이 가벼울수록 비용이 더 든다.","우주로 보내는 물건이 무거울수록 비용이 더 든다.","우주로 보내는 비용은 무게와 관계없다.","무거운 물건은 우주로 보낼 수 없다."],"r":{"a":"2) 우주로 보내는 물건이 무거울수록 비용이 더 든다.","ev":"9~10번 문장","s":[[9,"Everything we send to space, like satellites or building materials, needs to be light.","위성이나 건축 자재와 같이 우리가 우주로 보내는 모든 것은 가벼워야 한다."],[10,"The heavier it is, the more it costs to send up there.","그것이 무거우면 무거울수록, 그곳으로 올려 보내는 데 비용이 더 많이 든다."]],"w":"10번은 the heavier, the more 구조로 ‘무거울수록 더 많이 든다’는 뜻. 9번에서 우주로 보내는 것은 가벼워야 한다고 한 이유이기도 함. 가벼울수록 비용이 든다는 것은 반대.","c":2},"h":"8987aa67f3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["StarCrete는 영국 과학자들이 발명했다.","StarCrete의 가장 큰 장점은 오직 내구력이다.","StarCrete는 미국 과학자들이 발명했다.","StarCrete는 접착제를 따로 구매해야 한다."],"opts":["StarCrete was invented by scientists in the U.K.","The only good thing about StarCrete is its strength.","StarCrete was invented by scientists in the U.S.","StarCrete needs to be bought with a separate glue."],"r":{"a":"1) StarCrete was invented by scientists in the U.K. (StarCrete는 영국 과학자들이 발명했다.)","ev":"3번 문장","s":[[3,"That’s why scientists in the U.K. invented “StarCrete.”","그것이 영국의 과학자들이 ‘스타크리트(StarCrete)’를 발명한 이유이다."]],"w":"3번 문장: scientists in the U.K.(영국의 과학자들)가 StarCrete를 발명했다고 함. 8번에서 가장 좋은 점은 단지 내구력만이 아니라고 했고, 6번에서 전분을 접착제로 쓴다고 했으므로 나머지는 틀림.","c":1},"h":"9fa3b6baf6"},{"n":9,"t":"sum","q":"Just 25 kilograms of (A) potatoes could be used to (B) about 500 kilograms of StarCrete.","ko":"단 25킬로그램의 (A) 감자로 약 5백 킬로그램의 StarCrete를 (B) 데 사용될 수 있다.","oko":["(A) 말린 / (B) 만드는","(A) 신선한 / (B) 만드는","(A) 말린 / (B) 없애는","(A) 신선한 / (B) 없애는","(A) 말린 / (B) 먹는"],"opts":["(A) dried / (B) produce","(A) fresh / (B) produce","(A) dried / (B) destroy","(A) fresh / (B) destroy","(A) dried / (B) eat"],"r":{"a":"1) (A) dried / (B) produce (말린 / 만드는)","ev":"12번 문장","s":[[12,"Just 25 kilograms of dried potatoes could be used to produce about 500 kilograms of StarCrete!","단 25킬로그램의 말린 감자가 약 5백 킬로그램의 스타크리트를 만드는 데 사용될 수 있다!"]],"w":"12번 문장: Just 25 kilograms of dried potatoes(말린 감자)로 about 500 kilograms of StarCrete를 produce(만들어 내다)할 수 있다고 함. fresh(신선한)라는 말은 없고, destroy(없애다)와 eat(먹다)은 본문과 맞지 않음.","c":1},"h":"7691e12cb0"},{"n":10,"t":"fill","q":"It’s concrete made from a special [A] of space dust, [B], and potato starch.","ko":"그것은 우주 먼지, [B], 그리고 감자 전분의 특별한 [A](으)로 만들어진 콘크리트이다.","bko":{"combination":"조합","salt":"소금","invented":"발명했다","strong":"단단한","simpler":"더 단순한","twice":"두 배"},"bank":["combination","salt","invented","strong","simpler","twice"],"r":{"a":"[A] combination (조합), [B] salt (소금)","ev":"4번 문장","s":[[4,"It’s concrete made from a special combination of space dust, salt, and potato starch.","그것은 우주 먼지, 소금, 그리고 감자 전분의 특별한 조합으로 만들어진 콘크리트이다."]],"w":"4번 문장: concrete made from a special combination(특별한 조합) of space dust, salt(소금), and potato starch. 나머지 단어는 이 자리에 문법적으로 맞지 않음.","c":null},"h":"9bf835ceb4"}]},{"u":11,"id":"rg4-11-2","no":2,"ko":"호주 지폐에서 영국 여왕이 사라진다고?","items":[{"n":1,"t":"tf","q":"Countries such as Canada, Australia, and New Zealand were once ruled by Britain.","ko":"캐나다, 호주, 뉴질랜드 같은 나라들은 한때 영국의 지배를 받았다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"A long time ago, countries such as Canada, Australia, and New Zealand were ruled by Britain.","오래전에, 캐나다, 호주, 그리고 뉴질랜드와 같은 나라들은 영국의 지배를 받았다."]],"w":"4번 문장에 A long time ago, countries such as Canada, Australia, and New Zealand were ruled by Britain이라고 나옴. were ruled는 rule(지배하다)의 수동형. 같은 내용이라 T.","c":"T"},"h":"818f5dfae3"},{"n":2,"t":"tf","q":"Queen Elizabeth II passed away in 2022 and her daughter became the British king.","ko":"엘리자베스 2세 여왕은 2022년에 서거했고 그녀의 딸이 영국의 왕이 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"However, there’s a movement in Australia to change this tradition, especially after Queen Elizabeth II passed away in 2022.","그러나, 호주에서는 특히 2022년에 엘리자베스 2세 여왕이 서거한 후 이 전통을 바꾸려는 움직임이 있다."],[7,"Following her death, her son, King Charles III, became the British king.","그녀의 서거 이후, 아들인 찰스 3세가 영국의 왕이 되었다."]],"w":"6번에서 여왕이 2022년에 서거했고, 7번에서 왕이 된 사람은 her son, King Charles III(아들 찰스 3세). 딸이 아니라서 F.","c":"F"},"h":"8c60ecbb15"},{"n":3,"t":"tf","q":"Australia has decided not to replace the Queen’s image with King Charles III’s on its 5-dollar note.","ko":"호주는 5달러 지폐의 여왕 그림을 찰스 3세의 그림으로 대체하지 않기로 결정했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Despite this change, Australia has decided not to replace the Queen’s image with King Charles III’s on its 5-dollar note.","이 변화에도 불구하고, 호주는 5달러짜리 지폐의 여왕의 그림을 찰스 3세의 그림으로 대체하지 않기로 결정했다."]],"w":"8번 문장에 Australia has decided not to replace the Queen’s image with King Charles III’s라고 나옴. has decided는 decide(결정하다)의 현재완료. 같은 내용이라 T.","c":"T"},"h":"7f5951c59b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The new design will better represent Australia’s history and heritage.)","ko":"새로운 디자인은 호주의 역사와 유산을 더 잘 ( ) 것이다.","opts":["가리다","나타내다","잊다","바꾸다"],"word":"represent","r":{"a":"2) 나타내다","ev":"2번 문장","s":[[2,"The new design will better represent Australia’s history and heritage.","새로운 디자인은 호주의 역사와 유산을 더 잘 나타낼 것이다."]],"w":"2번에서 새 디자인이 호주의 역사와 유산을 ‘더 잘 보여 준다’는 흐름. represent는 ‘나타내다, 대표하다’. 가리거나 잊는 것은 목적과 반대.","c":2},"h":"4cbb4b7755"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But it could be a chance for Australia to be more independent and show its own identity.)","ko":"하지만 그것은 호주가 더 ( )이 되고 그것만의 독자성을 보여 주는 기회일 수도 있다.","opts":["의존하는","화난","독립적인","가난한"],"word":"independent","r":{"a":"3) 독립적인","ev":"10번 문장","s":[[10,"But it could be a chance for Australia to be more independent and show its own identity.","하지만 그것은 호주가 더 독립적이 되고 그것만의 독자성을 보여 주는 기회일 수도 있다."]],"w":"10번에서 영국 여왕 그림 중심이던 것에서 벗어나 호주만의 독자성을 보이는 기회라는 흐름. independent는 ‘독립적인’이고, 반대말은 dependent(의존하는).","c":3},"h":"ac31666df7"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nSo, these countries have honored the British monarchy by putting their image on money.","ko":"밑줄 친 their가 가리키는 것은?","sko":"그래서, 이 나라들은 영국 왕실을, 그들의 이미지를 화폐에 넣음으로써 예우해 왔다.","opts":["영국 왕실","이 나라들","호주 중앙은행","엘리자베스 2세 여왕의 아들"],"pron":"their","r":{"a":"1) 영국 왕실","ev":"4~5번 문장","s":[[4,"A long time ago, countries such as Canada, Australia, and New Zealand were ruled by Britain.","오래전에, 캐나다, 호주, 그리고 뉴질랜드와 같은 나라들은 영국의 지배를 받았다."],[5,"So, these countries have honored the British monarchy by putting their image on money.","그래서, 이 나라들은 영국 왕실의 이미지를 화폐에 넣음으로써 그들을 예우해 왔다."]],"w":"4번에서 캐나다, 호주, 뉴질랜드가 영국의 지배를 받았다고 했고, 5번에서 이 나라들이 the British monarchy(영국 왕실)를 예우하려고 화폐에 their image를 넣었다고 함. 화폐에 들어간 것은 영국 왕실의 이미지.","c":1,"k":"their = 영국 왕실"},"h":"358724cffe"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But why was the Queen of England’s image on Australian money?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그런데 왜 영국 여왕의 그림이 호주 화폐에 그려져 있던 걸까?","opts":["그런데 왜 영국 여왕의 그림이 호주 화폐에 있었는지 묻고 있다.","그런데 왜 호주 여왕의 그림이 영국 화폐에 있었는지 묻고 있다.","그런데 영국 여왕이 왜 호주를 방문했는지 묻고 있다.","그런데 호주 화폐를 누가 만들었는지 묻고 있다."],"r":{"a":"1) 그런데 왜 영국 여왕의 그림이 호주 화폐에 있었는지 묻고 있다.","ev":"3번 문장","s":[[3,"But why was the Queen of England’s image on Australian money?","그런데 왜 영국 여왕의 그림이 호주 화폐에 그려져 있던 걸까?"]],"w":"But why was the Queen of England’s image on Australian money?는 '왜 영국 여왕의 그림이 호주 화폐에 있었을까?'라는 질문. 영국과 호주의 위치가 바뀐 선지는 틀림.","c":1},"h":"2c019f5cd5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["호주는 5달러 지폐에서 엘리자베스 2세 여왕의 그림을 교체할 것이다.","호주는 5달러 지폐에서 찰스 3세의 그림을 교체할 것이다.","뉴질랜드 중앙은행은 여왕의 그림을 교체할 것이라고 말했다.","호주는 5달러 지폐를 동전으로 바꿀 것이다."],"opts":["Australia will replace the image of Queen Elizabeth II from its 5-dollar note.","Australia will replace the image of King Charles III from its 5-dollar note.","New Zealand’s central bank said it will replace the Queen’s image.","Australia will replace its 5-dollar note with a coin."],"r":{"a":"1) Australia will replace the image of Queen Elizabeth II from its 5-dollar note. (호주는 5달러 지폐에서 엘리자베스 2세 여왕의 그림을 교체할 것이다.)","ev":"1번 문장","s":[[1,"Australia will replace the image of Queen Elizabeth II from its 5-dollar note, said the country’s central bank.","호주 중앙은행은 호주가 5달러짜리 지폐에서 엘리자베스 2세 여왕의 그림을 교체할 것이라고 말했다."]],"w":"1번 문장: 호주 중앙은행은 5달러 지폐에서 엘리자베스 2세 여왕의 그림을 교체할 것이라고 말함. 찰스 3세의 그림, 뉴질랜드 중앙은행, 동전으로 바꾼다는 말은 본문에 없음.","c":1},"h":"4af747e7af"},{"n":9,"t":"sum","q":"Queen Elizabeth’s image has been on Australian money since (A), so a new money design will be a (B) change.","ko":"엘리자베스 여왕의 초상화는 (A)년 이후 호주 화폐에 계속 있었기 때문에, 새로운 화폐 디자인은 (B) 변화가 될 것이다.","oko":["(A) 1953 / (B) 큰","(A) 2022 / (B) 큰","(A) 1953 / (B) 작은","(A) 1999 / (B) 작은","(A) 2022 / (B) 작은"],"opts":["(A) 1953 / (B) big","(A) 2022 / (B) big","(A) 1953 / (B) small","(A) 1999 / (B) small","(A) 2022 / (B) small"],"r":{"a":"1) (A) 1953 / (B) big (1953 / 큰)","ev":"9번 문장","s":[[9,"Queen Elizabeth’s image has been on Australian money since 1953, so a new money design will be a big change.","1953년 이후 엘리자베스 여왕의 초상화가 호주 화폐에 계속 있었기 때문에, 새로운 화폐 디자인은 큰 변화가 될 것이다."]],"w":"9번 문장: Queen Elizabeth’s image has been on Australian money since 1953(1953년 이후 계속), so a new money design will be a big change(큰 변화). 2022년은 여왕이 서거한 해이고, small(작은)은 big과 반대.","c":1},"h":"4a0e95c559"},{"n":10,"t":"fill","q":"However, there’s a [A] in Australia to change this [B], especially after Queen Elizabeth II passed away in 2022.","ko":"그러나, 호주에서는 특히 2022년에 엘리자베스 2세 여왕이 서거한 후 이 [B]을(를) 바꾸려는 [A]이(가) 있다.","bko":{"movement":"움직임","tradition":"전통","central":"중앙의","ruled":"지배했다","decided":"결정했다","honored":"예우했다"},"bank":["movement","tradition","central","ruled","decided","honored"],"r":{"a":"[A] movement (움직임), [B] tradition (전통)","ev":"6번 문장","s":[[6,"However, there’s a movement in Australia to change this tradition, especially after Queen Elizabeth II passed away in 2022.","그러나, 호주에서는 특히 2022년에 엘리자베스 2세 여왕이 서거한 후 이 전통을 바꾸려는 움직임이 있다."]],"w":"6번 문장: there’s a movement(움직임) in Australia to change this tradition(이 전통을 바꾸려는). 나머지 단어는 이 자리에 문법적으로 맞지 않음.","c":null},"h":"4e80ffefea"}]},{"u":11,"id":"rg4-11-3","no":3,"ko":"구멍 난 오존층, 지금은 어떨까?","items":[{"n":1,"t":"tf","q":"The ozone layer protects us from the sun’s harmful rays.","ko":"오존층은 태양의 해로운 광선으로부터 우리를 보호한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It protects us from the sun’s harmful rays, which can cause skin cancer and damage crops.","그것은 태양의 해로운 광선으로부터 우리를 보호해 주는데, 그것은 피부암을 유발하고 농작물에 피해를 줄 수 있다."]],"w":"2번 문장에 It protects us from the sun’s harmful rays라고 나옴. protect A from B는 A를 B로부터 보호하다. 같은 내용이라 T.","c":"T"},"h":"34831d318b"},{"n":2,"t":"tf","q":"The Montreal Protocol was signed in 1980.","ko":"몬트리올 의정서는 1980년에 서명되었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번, 8번 문장","s":[[5,"In 1987, countries around the world signed the Montreal Protocol.","1987년, 전 세계의 국가들은 몬트리올 의정서에 서명했다."],[8,"It is expected to be as healthy as it was in 1980 by the year 2066.","그것은 2066년쯤에는 1980년이었을 때만큼 건강할 것으로 예상된다."]],"w":"5번 문장에서 몬트리올 의정서는 1987년에 서명되었음. 1980은 8번에서 오존층이 2066년쯤 회복될 건강 수준의 기준 연도라 서명 연도와 다름. 그래서 F.","c":"F"},"h":"82325a9119"},{"n":3,"t":"tf","q":"Healing the ozone hole has been saving two million people from skin cancer every year.","ko":"오존 구멍을 치유하는 것은 매년 2백만 명의 사람들을 피부암으로부터 구하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The director of the UN Environment Program said that healing the ozone hole has been saving two million people from skin cancer every year.","유엔 환경 계획의 책임자는 오존 구멍을 치유하는 것이 매년 2백만 명의 사람들을 피부암으로부터 구하고 있다고 말했다."]],"w":"11번 문장의 that healing the ozone hole has been saving two million people from skin cancer every year와 같은 내용. 책임자가 한 말이라 T.","c":"T"},"h":"a7941861aa"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This layer was destroyed by pollution, but now it’s healing slowly.)","ko":"이 층은 오염으로 ( ) 그러나 지금은 천천히 회복되고 있다.","opts":["파괴되었다","보호되었다","측정되었다","팔렸다"],"word":"destroyed","r":{"a":"1) 파괴되었다","ev":"3번 문장","s":[[3,"This layer was destroyed by pollution, but now it’s healing slowly.","이 층은 오염으로 파괴되었지만, 지금은 천천히 회복되고 있다."]],"w":"3번에서 오염 때문에 ‘파괴되었다’가 but 뒤의 ‘회복되고 있다’와 반대로 연결됨. destroyed는 destroy(파괴하다)의 수동 표현. 보호되었다면 회복될 필요가 없음.","c":1},"h":"76952f7ecc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It’s an agreement whose terms include stopping the use of chemicals damaging the ozone layer.)","ko":"그것은 오존층에 손상을 주는 화학물질의 사용을 중단하는 것을 포함하는 ( )이 있는 협약이다.","opts":["조건","취미","질문","가격"],"word":"terms","r":{"a":"1) 조건","ev":"5~6번 문장","s":[[5,"In 1987, countries around the world signed the Montreal Protocol.","1987년, 전 세계의 국가들은 몬트리올 의정서에 서명했다."],[6,"It’s an agreement whose terms include stopping the use of chemicals damaging the ozone layer.","그것은 오존층에 손상을 주는 화학물질의 사용을 중단하는 것을 포함하는 조건이 있는 협약이다."]],"w":"6번의 an agreement(협약)의 terms는 협약에 포함된 ‘조건’. 이어서 include stopping the use of chemicals(화학물질 사용 중단)가 그 조건의 내용임.","c":1},"h":"3a7492e8be"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAccording to a new UN report, it will fully recover the big hole over Antarctica in about 50 years.","ko":"밑줄 친 it이 가리키는 것은?","sko":"새로운 유엔 보고서에 따르면, 그것은 약 50년 안에 남극 대륙 위의 큰 구멍을 완전히 회복할 것이다.","opts":["오존층","유엔 보고서","남극 대륙","몬트리올 의정서"],"pron":"it","r":{"a":"1) 오존층","ev":"3~4번 문장","s":[[3,"This layer was destroyed by pollution, but now it’s healing slowly.","이 층은 오염으로 파괴되었지만, 지금은 천천히 회복되고 있다."],[4,"According to a new UN report, it will fully recover the big hole over Antarctica in about 50 years.","새로운 유엔 보고서에 따르면, 그것은 약 50년 안에 남극 대륙 위의 큰 구멍을 완전히 회복할 것이다."]],"w":"3번에서 오염으로 파괴된 이 층(오존층)이 천천히 회복되고 있다고 했고, 4번의 it은 그 오존층. 큰 구멍을 완전히 회복하는 것은 보고서가 아니라 오존층.","c":1,"k":"it = 오존층"},"h":"b31d4849a9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because of that, the ozone layer is getting healthier, but it takes time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것 때문에, 오존층은 점점 건강해지고 있지만, 시간이 걸린다.","opts":["협약 때문에 오존층이 더 건강해지고 있지만, 회복에는 시간이 걸린다.","협약 때문에 오존층이 하루 만에 회복되었다.","협약이 있어도 오존층은 점점 나빠지고 있다.","오존층이 건강해지는 것은 시간이 걸리지 않는다."],"r":{"a":"1) 협약 때문에 오존층이 더 건강해지고 있지만, 회복에는 시간이 걸린다.","ev":"6~7번 문장","s":[[6,"It’s an agreement whose terms include stopping the use of chemicals damaging the ozone layer.","그것은 오존층에 손상을 주는 화학물질의 사용을 중단하는 것을 포함하는 조건이 있는 협약이다."],[7,"Because of that, the ozone layer is getting healthier, but it takes time.","그것 때문에, 오존층은 점점 건강해지고 있지만, 시간이 걸린다."]],"w":"7번의 Because of that(그것 때문에)은 6번의 협약 내용을 가리키고, getting healthier는 점점 건강해지는 중. but it takes time은 ‘하지만 시간이 걸린다’. 하루 만에 회복되었다거나 시간이 걸리지 않는다는 말은 반대임.","c":1},"h":"6c033884a2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["오존층은 지구 표면 위 높은 곳에 있는 가스의 담요이다.","오존층은 바다 밑에 있는 물의 담요이다.","오존층은 지구 표면에 있는 구멍이다.","오존층은 구름 위에 있는 산이다."],"opts":["The ozone layer is a blanket of gas high above the Earth’s surface.","The ozone layer is a blanket of water under the sea.","The ozone layer is a hole in the Earth’s surface.","The ozone layer is a mountain above the clouds."],"r":{"a":"1) The ozone layer is a blanket of gas high above the Earth’s surface. (오존층은 지구 표면 위 높은 곳에 있는 가스의 담요이다.)","ev":"1번 문장","s":[[1,"The ozone layer is a blanket of gas high above the Earth’s surface.","오존층은 지구 표면 위 높은 곳에 가스로 덮여 있는 것이다."]],"w":"1번 문장: The ozone layer is a blanket of gas high above the Earth’s surface(지구 표면 위 높은 곳의 가스 담요). 물, 구멍, 산이라는 선지는 본문에 없음.","c":1},"h":"c8c78614d0"},{"n":9,"t":"sum","q":"Healing the ozone layer shows what is (A) when everyone works together to (B) our planet.","ko":"오존층을 치유하는 것은 모두가 함께 지구를 (B) 위해 일할 때 무엇이 (A)한지를 보여 준다.","oko":["(A) 가능 / (B) 돕기","(A) 불가능 / (B) 돕기","(A) 가능 / (B) 해치기","(A) 불가능 / (B) 해치기","(A) 위험 / (B) 돕기"],"opts":["(A) possible / (B) help","(A) impossible / (B) help","(A) possible / (B) hurt","(A) impossible / (B) hurt","(A) dangerous / (B) help"],"r":{"a":"1) (A) possible / (B) help (가능 / 돕기)","ev":"10번 문장","s":[[10,"Healing the ozone layer shows what’s possible when everyone works together to help our planet.","오존층을 치유하는 것은 모두가 지구를 돕기 위해 함께 할 때 무엇이 가능한지를 보여 준다."]],"w":"10번 문장: 오존층을 치유하는 것은 모두가 지구를 help(돕기) 위해 함께 일할 때 what’s possible(무엇이 가능한지)을 보여 준다고 함. impossible(불가능한), hurt(해치다), dangerous(위험한)는 본문과 반대이거나 맞지 않음.","c":1},"h":"82ff15a83b"},{"n":10,"t":"fill","q":"Scientists say this agreement is one of the [A] environmental [B] for humans.","ko":"과학자들은 이 협약이 인류에게 [A] 환경적 [B] 중 하나라고 말한다.","bko":{"biggest":"가장 큰","victories":"승리들","skin":"피부","layer":"층","crops":"농작물","report":"보고서"},"bank":["biggest","victories","skin","layer","crops","report"],"r":{"a":"[A] biggest (가장 큰), [B] victories (승리들)","ev":"9번 문장","s":[[9,"Scientists say this agreement is one of the biggest environmental victories for humans.","과학자들은 이 협약이 인류에게 가장 큰 환경적 승리 중 하나라고 말한다."]],"w":"9번 문장: this agreement is one of the biggest environmental victories(가장 큰 환경적 승리들 중 하나). one of the 뒤에는 복수형이 와야 해서 skin, layer, report는 맞지 않고, crops(농작물)는 의미가 맞지 않음.","c":null},"h":"579b8b0218"}]},{"u":12,"id":"rg4-12-1","no":1,"ko":"바다에 뚫린 거대한 구멍, 블루 홀","items":[{"n":1,"t":"tf","q":"The deepest blue hole is about 300 meters deep.","ko":"가장 깊은 블루 홀은 약 300미터 깊이이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The deepest one is about 300 meters deep!","가장 깊은 것은 약 300미터 깊이이다!"]],"w":"3번 문장에 The deepest one is about 300 meters deep이라고 나옴. deepest는 deep(깊은)의 최상급. 같은 내용이라 T.","c":"T"},"h":"57a5b9ce6d"},{"n":2,"t":"tf","q":"Submarines are usually sent down into blue holes.","ko":"잠수함은 보통 블루 홀 안으로 내려보내진다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Since submarines cannot be sent down, explorers must enter the blue holes.","잠수함이 내려보내질 수 없기 때문에, 반드시 탐험가들이 블루 홀로 들어가야 한다."]],"w":"8번에서 Since submarines cannot be sent down(잠수함을 내려보낼 수 없다)이라고 함. 그래서 탐험가들이 직접 들어가야 함. 내려보낸다는 말은 반대라서 F.","c":"F"},"h":"e5edfd1be4"},{"n":3,"t":"tf","q":"More than 100 divers have died in one of the blue holes.","ko":"한 블루 홀에서 100명 이상의 잠수부가 죽었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"For example, in one of the blue holes, more than 100 divers have died.","예를 들면, 블루 홀 중 한 곳에서는 100명 이상의 잠수부들이 죽었다."]],"w":"10번 문장에 in one of the blue holes, more than 100 divers have died라고 나옴. have died는 die(죽다)의 현재완료. 같은 내용이라 T.","c":"T"},"h":"90b8bde76f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists once discovered two dead smalltooth sawfish there, which are an endangered species.)","ko":"과학자들은 한때 ( ) 종인 작은이빨톱가오리 두 마리의 사체를 거기서 발견했다.","opts":["흔한","멸종 위기에 처한","큰","재미있는"],"word":"endangered","r":{"a":"2) 멸종 위기에 처한","ev":"5번 문장","s":[[5,"Scientists once discovered two dead smalltooth sawfish there, which are an endangered species.","과학자들은 한때 멸종 위기종인 작은이빨톱가오리 두 마리의 사체를 거기서 발견했다."]],"w":"5번에서 톱가오리 사체를 발견했고 which are an endangered species라고 함. 죽은 톱가오리가 의미 있는 발견이라는 점에서 개체 수가 적은 ‘멸종 위기에 처한’ 종. 흔하다면 특별한 발견이 아님.","c":2},"h":"7e1e4060ee"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Therefore, proper training and equipment are necessary to carry out research in a blue hole.)","ko":"그러므로, 블루 홀에서 연구를 수행하기 위해 적절한 훈련과 장비는 ( )이다.","opts":["쓸모없는","위험한","값싼","필수적인"],"word":"necessary","r":{"a":"4) 필수적인","ev":"10~11번 문장","s":[[10,"For example, in one of the blue holes, more than 100 divers have died.","예를 들면, 블루 홀 중 한 곳에서는 100명 이상의 잠수부들이 죽었다."],[11,"Therefore, proper training and equipment are necessary to carry out research in a blue hole.","그러므로, 블루 홀에서 연구를 수행하기 위해 적절한 훈련과 장비는 필수적이다."]],"w":"10번에서 100명 이상의 잠수부가 죽을 만큼 위험하다고 했고, 11번에서 그러므로 훈련과 장비가 ‘꼭 필요하다(필수적이다)’는 흐름. necessary는 ‘필수적인’. 쓸모없다면 Therefore로 이어지지 않음.","c":4},"h":"10c4e859d5"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nScientists are really interested in blue holes because they are full of different kinds of sea life.","ko":"밑줄 친 they가 가리키는 것은?","sko":"과학자들은 블루 홀에 정말로 관심이 많은데, 이는 그것들이 다양한 종류의 해양 생물로 가득하기 때문이다.","opts":["블루 홀","과학자들","잠수함","잠수부들"],"pron":"they","r":{"a":"1) 블루 홀","ev":"4번 문장","s":[[4,"Scientists are really interested in blue holes because they are full of different kinds of sea life.","블루 홀은 다양한 종류의 해양 생물로 가득하기 때문에 과학자들은 그것들에 정말로 관심이 많다."]],"w":"4번 문장: 과학자들이 블루 홀에 관심이 많은 이유는 they가 full of different kinds of sea life(다양한 해양 생물로 가득)이기 때문. 해양 생물로 가득한 것은 블루 홀이지 과학자들이 아님.","c":1,"k":"they = 블루 홀"},"h":"6de5410cdb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The unique environment makes these underwater caves one of the least studied natural wonders today.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 독특한 환경은 이 수중 동굴들을 오늘날 연구가 가장 덜 된 경이로운 자연경관 중 하나로 만든다.","opts":["이 수중 동굴들은 가장 많이 연구된 자연경관이다.","독특한 환경 때문에 이 수중 동굴들은 오늘날 연구가 가장 덜 된 자연경관 중 하나이다.","수중 동굴들은 독특하지 않아서 연구되지 않았다.","수중 동굴의 환경은 오늘날 모두 연구가 끝났다."],"r":{"a":"2) 독특한 환경 때문에 이 수중 동굴들은 오늘날 연구가 가장 덜 된 자연경관 중 하나이다.","ev":"12번 문장","s":[[12,"The unique environment makes these underwater caves one of the least studied natural wonders today.","그 독특한 환경은 이 수중 동굴들을 오늘날 연구가 가장 덜 된 경이로운 자연경관 중 하나로 만든다."]],"w":"12번은 The unique environment makes A B(독특한 환경이 A를 B로 만든다) 구조. B는 one of the least studied natural wonders(가장 덜 연구된 자연경관 중 하나). least studied는 ‘가장 덜 연구된’이라 가장 많이 연구되었다는 것은 반대.","c":2},"h":"abc85744d6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["블루 홀은 수천 년 전에 형성된 것으로 여겨진다.","블루 홀은 불과 몇 년 전에 형성되었다.","블루 홀은 해수면이 훨씬 더 높았을 때 형성되었다.","블루 홀은 높은 산에서만 발견된다."],"opts":["Blue holes are believed to have formed thousands of years ago.","Blue holes were formed only a few years ago.","Blue holes were formed when sea levels were much higher.","Blue holes are found only on high mountains."],"r":{"a":"1) Blue holes are believed to have formed thousands of years ago. (블루 홀은 수천 년 전에 형성된 것으로 여겨진다.)","ev":"7번 문장","s":[[7,"It is believed that blue holes were formed thousands of years ago when sea levels were much lower.","블루 홀은 해수면이 훨씬 더 낮았을 때인 수천 년 전에 형성된 것으로 여겨진다."]],"w":"7번 문장: 블루 홀은 해수면이 훨씬 더 낮았을 때인 수천 년 전에 형성된 것으로 여겨짐. 몇 년 전, 해수면이 높았을 때, 높은 산은 본문과 다름.","c":1},"h":"e0b6cfd18e"},{"n":9,"t":"sum","q":"In addition, the holes show how the sea and (A) life have (B) over time.","ko":"게다가, 그 구멍들은 바다와 (A) 생물이 시간이 지나면서 어떻게 (B)는지를 보여 준다.","oko":["(A) 해양 / (B) 변해 왔","(A) 해양 / (B) 사라져 왔","(A) 인간 / (B) 변해 왔","(A) 인간 / (B) 사라져 왔","(A) 숲 / (B) 변해 왔"],"opts":["(A) marine / (B) changed","(A) marine / (B) disappeared","(A) human / (B) changed","(A) human / (B) disappeared","(A) forest / (B) changed"],"r":{"a":"1) (A) marine / (B) changed (해양 / 변해 왔)","ev":"6번 문장","s":[[6,"In addition, the holes show how the sea and marine life have changed over time.","게다가, 그 구멍들은 바다와 해양 생물이 시간이 지나면서 어떻게 변해 왔는지를 보여 준다."]],"w":"6번 문장: the holes show how the sea and marine life(바다와 해양 생물) have changed over time(시간이 지나면서 변해 왔는지). 인간이나 숲 생물 이야기는 없고, disappeared(사라지다)도 본문과 다름.","c":1},"h":"1cdde3145b"},{"n":10,"t":"fill","q":"Blue holes are underwater caves that look like deep, [A] [B] in the sea.","ko":"블루 홀은 바다에 있는 깊고 [A] [B]처럼 보이는 수중 동굴이다.","bko":{"dark":"어두운","circles":"원형","explore":"탐험하다","explorers":"탐험가들","proper":"적절한","equipment":"장비"},"bank":["dark","circles","explore","explorers","proper","equipment"],"r":{"a":"[A] dark (어두운), [B] circles (원형)","ev":"2번 문장","s":[[2,"Blue holes are underwater caves that look like deep, dark circles in the sea.","블루 홀은 바다에 있는 깊고 어두운 원형처럼 보이는 수중 동굴이다."]],"w":"2번 문장: Blue holes are underwater caves that look like deep, dark circles(깊고 어두운 원형) in the sea. explore(탐험하다)는 동사라 맞지 않고, explorers(탐험가들)와 equipment(장비)는 의미가 맞지 않으며, proper(적절한)는 어두운 원형이라는 뜻과 맞지 않음.","c":null},"h":"a14c1bc2b9"}]},{"u":12,"id":"rg4-12-2","no":2,"ko":"땅을 파지 않고 유적지를 찾는 기술","items":[{"n":1,"t":"tf","q":"Lidar works by sending laser beams from a helicopter down to the ground.","ko":"라이다는 헬리콥터에서 땅을 향해 레이저 광선을 보내서 작동한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Lidar works by sending laser beams from a helicopter down to the ground.","라이다는 헬리콥터에서 땅을 향해 레이저 광선을 보내서 작동한다."]],"w":"2번 문장에 Lidar works by sending laser beams from a helicopter down to the ground라고 나옴. by sending은 ‘보냄으로써’. 같은 내용이라 T.","c":"T"},"h":"fb86d178dd"},{"n":2,"t":"tf","q":"Before Lidar, ancient sites could be mapped in less than a day.","ko":"라이다 이전에는 고대 유적지의 지도를 하루도 안 되어 만들 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"Before Lidar, ancient sites took years to dig up.","라이다 이전에는 고대 유적지는 파내는 데만 수년이 걸렸다."],[9,"But now, 3D maps for the places can be made in less than a day.","하지만 이제 그 장소들을 위한 3D 지도가 하루도 안 되어서 만들어질 수 있다."]],"w":"8번에서 라이다 이전에는 유적지를 파내는 데 수년이 걸렸고, 9번에서 이제는 하루도 안 되어 3D 지도를 만들 수 있다고 함. 하루도 안 걸린 것은 라이다 ‘이후’라서 F.","c":"F"},"h":"086132a2fd"},{"n":3,"t":"tf","q":"Lidar can see through trees and make clear pictures of what is below.","ko":"라이다는 나무들을 관통해서 볼 수 있고 아래에 있는 것의 선명한 그림을 만들 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Lidar is really helpful because it can see through trees and make clear pictures of what’s below.","라이다는 나무들을 관통해서 볼 수 있고 아래에 있는 것의 선명한 그림들을 만들어 낼 수 있기 때문에 정말로 유용하다."]],"w":"5번 문장에 it can see through trees and make clear pictures of what’s below라고 나옴. what’s below는 ‘아래에 있는 것’. 같은 내용이라 T.","c":"T"},"h":"8188c26bbd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then, it measures how long it takes for the beams to bounce back to a sensor.)","ko":"그다음, 그것은 광선이 센서로 다시 반사되어 오는 데 얼마나 걸리는지를 ( ).","opts":["표시하다","측정하다","숨기다","만들다"],"word":"measures","r":{"a":"2) 측정하다","ev":"3번 문장","s":[[3,"Then, it measures how long it takes for the beams to bounce back to a sensor.","그다음, 그것은 광선이 센서로 다시 반사되어 오는 데 얼마나 걸리는지를 측정한다."]],"w":"3번에서 라이다는 광선이 센서로 되돌아오는 데 걸리는 시간(how long it takes)을 잰다는 뜻. measure는 ‘측정하다’. 이 시간을 이용해 4번에서 3D 지도를 만듦.","c":2},"h":"a1030199b1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In archaeology, Lidar helps to find ancient buildings and roads hidden under forests or deep in the jungle.)","ko":"고고학에서 라이다는 숲 아래나 정글 깊숙이 숨겨진 ( ) 건물과 도로를 찾는 데 도움을 준다.","opts":["새로운","고대의","현대의","작은"],"word":"ancient","r":{"a":"2) 고대의","ev":"7~8번 문장","s":[[7,"In archaeology, Lidar helps to find ancient buildings and roads hidden under forests or deep in the jungle.","고고학에서 라이다는 숲 아래나 정글 깊숙이 숨겨진 고대의 건물과 도로를 찾는 데 도움을 준다."],[8,"Before Lidar, ancient sites took years to dig up.","라이다 이전에는 고대 유적지는 파내는 데만 수년이 걸렸다."]],"w":"7번에서 숲 아래 숨겨진 ancient buildings and roads는 8번의 ancient sites(유적지)와 이어지는 오래된 것. ancient는 ‘고대의’. 현대의 건물을 고고학에서 찾지 않음.","c":2},"h":"c28c312a2c"},{"n":6,"t":"ref","q":"What does the underlined \"This way\" refer to?\nThis way, scientists and explorers can discover new things about our world and history without digging up everything.","ko":"밑줄 친 This way이 가리키는 것은?","sko":"이 방식으로 과학자들과 탐험가들은 모든 것을 파내지 않고도 우리의 세계와 역사에 대한 새로운 것을 발견할 수 있다.","opts":["라이다 기술을 사용하는 것","헬리콥터를 직접 타고 땅을 파는 것","땅속의 모든 것을 직접 파내는 것","오래된 지도를 손으로 베껴 그리는 것"],"pron":"This way","r":{"a":"1) 라이다 기술을 사용하는 것","ev":"5~6번 문장","s":[[5,"Lidar is really helpful because it can see through trees and make clear pictures of what’s below.","라이다는 나무들을 관통해서 볼 수 있고 아래에 있는 것의 선명한 그림들을 만들어 낼 수 있기 때문에 정말로 유용하다."],[6,"This way, scientists and explorers can discover new things about our world and history without digging up everything.","이 방식으로 과학자들과 탐험가들은 모든 것을 파내지 않고도 우리의 세계와 역사에 대한 새로운 것을 발견할 수 있다."]],"w":"5번에서 Lidar가 나무를 통과해 아래를 선명하게 보여 준다고 했고, 6번 This way(이 방식으로)는 그 Lidar를 쓰는 방식. 파내지 않고도 발견한다고 했으므로 땅을 파는 방식은 아님.","c":1,"k":"This way = 라이다 기술을 사용하는 것"},"h":"c765d5b921"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Lidar technology — short for Light Detection and Ranging — is changing how we explore history.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Light Detection and Ranging(빛을 이용한 탐지 및 거리 측정)의 줄임말인 라이다(Lidar) 기술은 우리가 역사를 탐구하는 방식을 바꾸고 있다.","opts":["라이다는 역사를 연구하는 방식을 바꾸고 있다.","라이다는 새로운 도로를 만들고 있다.","라이다는 역사를 지우고 있다.","라이다는 헬리콥터를 연구하고 있다."],"r":{"a":"1) 라이다는 역사를 연구하는 방식을 바꾸고 있다.","ev":"1~2번 문장","s":[[1,"Lidar technology — short for Light Detection and Ranging — is changing how we explore history.","Light Detection and Ranging(빛을 이용한 탐지 및 거리 측정)의 줄임말인 라이다(Lidar) 기술은 우리가 역사를 탐구하는 방식을 바꾸고 있다."],[2,"Lidar works by sending laser beams from a helicopter down to the ground.","라이다는 헬리콥터에서 땅을 향해 레이저 광선을 보내서 작동한다."]],"w":"1번의 is changing how we explore history는 ‘우리가 역사를 탐구하는 방식을 바꾸고 있다’는 뜻. 2번에서 헬리콥터는 라이다 장비를 싣는 수단일 뿐이고, 도로를 만들거나 역사를 지운다는 말은 없음.","c":1},"h":"91117abc5b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["라이다는 상세한 3D 지도를 만들어 낸다.","라이다는 단순한 2D 그림만 만들어 낸다.","라이다는 종이 지도를 손으로 만든다.","라이다는 밤에만 사용할 수 있다."],"opts":["Lidar creates detailed 3D maps.","Lidar creates only simple 2D drawings.","Lidar makes paper maps by hand.","Lidar can only be used at night."],"r":{"a":"1) Lidar creates detailed 3D maps. (라이다는 상세한 3D 지도를 만들어 낸다.)","ev":"4번 문장","s":[[4,"This creates detailed 3D maps fast.","이것은 상세한 3D 지도를 빠르게 만들어 낸다."]],"w":"4번 문장: This(라이다)가 creates detailed 3D maps(상세한 3D 지도를 만들어 냄). 2D 그림, 손으로 만든 종이 지도, 밤에만 사용한다는 말은 본문에 없음.","c":1},"h":"bd1a6a300c"},{"n":9,"t":"sum","q":"Lidar just might be the (A) way to find new (B) from the human past.","ko":"라이다는 인간의 과거에서 새로운 (B)을(를) 찾는 (A) 방법일지도 모른다.","oko":["(A) 가장 좋은 / (B) 이야기","(A) 가장 나쁜 / (B) 이야기","(A) 가장 좋은
