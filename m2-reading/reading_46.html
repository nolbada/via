 and so many things to see. Nowadays, the number of foreign tourists who visit Chuncheon is growing. I want to share the history of Chuncheon and tips for visitors from around the world. So, I started this blog.","Best Places to Visit in Chuncheon","Gimyujeong Rail Bike","Soyanggang Skywalk","Memorial Hall for Ethiopian Soldiers in the Korean War","Dakgalbi Restaurants","Today's focus is the Memorial Hall for Ethiopian Soldiers in the Korean War. On the first floor of the hall, visitors can see the names and pictures of the brave soldiers. On the second floor, Ethiopian cultural items are displayed. If you want to know about the special history between Korea and Ethiopia, please click on the link below."];var PASS_KO=["나의 고향, 춘천","제 블로그인 '행복한 유진!'에 오신 것을 환영합니다.","안녕하세요, 제 이름은 유진이고, 저는 제 고향인 춘천을 소개하기 위해서 블로그를 쓰고 있어요. 당신은 춘천을 방문해 본 적이 있나요? 춘천은 아름다운 산과 호수로 유명해요. 할 것이 정말 많고, 볼 것도 정말 많답니다. 요즘에는 춘천을 방문하는 외국인 관광객들의 수가 늘고 있어요. 저는 춘천의 역사와 전 세계 방문객들을 위한 조언을 공유하고 싶어요. 그래서 저는 이 블로그를 시작했답니다.","춘천에서 방문할 만한 최고의 장소들","김유정 레일바이크","소양강 스카이워크","에티오피아 한국전 참전 기념관","닭갈비 식당","오늘 중점적으로 소개할 곳은 에티오피아군의 한국전 참전 기념관이에요. 기념관 1층에서 방문객들은 용감한 군인들의 이름과 사진을 볼 수 있어요. 2층에는 에티오피아의 문화 유물들이 전시되어 있어요. 한국과 에티오피아 사이의 특별한 역사에 대해 알고 싶으면, 아래 링크를 클릭해 주세요."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["The speakers are looking at a photo.","The girl has never been to Busan.","Henry learned to surf during summer vacation.","Milmyeon is a warm dish.","Henry was satisfied with milmyeon."],"a":3,"ans":"Milmyeon is a warm dish.","evs":[["I ate milmyeon. It was a bit cold but tasted really great.","밀면을 먹었어. 조금 차가웠지만 정말 맛있었어."],["You look great in this photo.","이 사진에서 너 멋져 보인다."]],"ev":["I ate milmyeon. It was a bit cold but tasted really great.","밀면을 먹었어. 조금 차가웠지만 정말 맛있었어."],"ow":["오답 ✕ — 'You look great in this photo.'(이 사진에서 너 멋져 보인다.)라고 했으므로 사진을 보며 이야기하는 것이 맞음. 일치하는 내용이라 답이 아님.","오답 ✕ — 소녀가 'No, I haven't.'(아니, 없어.)라고 했으므로 부산에 가 본 적이 없다는 보기는 일치함. 답이 아님.","오답 ✕ — 헨리는 'I learned to surf at Songjeong Beach.'
