 위쪽의 고리라는 두 개의 주요 부품으로 ( ).","opts":["판매된다","설치된다","구성되어 있다","멈춘다"],"word":"consists","r":{"a":"3) 구성되어 있다","ev":"7번 문장","s":[[7,"The fan consists of two main parts: a base and an upper ring.","그 선풍기는 받침대와 위쪽의 고리라는 두 개의 주요 부품으로 구성되어 있다."]],"w":"consist of는 ‘~으로 구성되다’예요. 뒤에 두 개의 주요 부품(받침대와 고리)이 이어지므로 ‘구성되어 있다’가 알맞아요.","c":3},"h":"7230810aa2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, a bladeless fan can be a good alternative on a hot summer day.)","ko":"그래서, 날개 없는 선풍기는 더운 여름날에 좋은 ( )이 될 수 있다.","opts":["대안","광고","습관","위험"],"word":"alternative","r":{"a":"1) 대안","ev":"13번 문장","s":[[13,"So, a bladeless fan can be a good alternative on a hot summer day.","그래서, 날개 없는 선풍기는 더운 여름날에 좋은 대안이 될 수 있다."]],"w":"13번은 장점과 원리를 설명한 뒤의 결론이에요. 보통 선풍기 대신 쓸 수 있는 좋은 ‘대안’이라는 뜻이에요.","c":1},"h":"68e263c658"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt has many advantages over a regular fan with blades.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 날개가 있는 보통 선풍기보다 많은 장점을 가지고 있다.","opts":["날개 없는 선풍기","날개가 있는 보통 선풍기","받침대","전기 모터"],"pron":"It","r":{"a":"1) 날개 없는 선풍기","ev":"1~2번 문장","s":[[1,"Have you ever seen a bladeless fan?","당신은 날개 없는 선풍기를 본 적이 있는가?"],[2,"It has many advantages over a regular fan with blades.","그것은 날개가 있는 보통 선풍기보다 많은 장점을 가지고 있다."]],"w":"1번에서 날개 없는 선풍기(a bladeless fan)를 본 적이 있는지 물었어요. 2번의 It은 그 날개 없는 선풍기예요.","c":1,"k":"It = 날개 없는 선풍기"},"h":"94e845d866"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When the motor is activated, the blades spin, and it sucks in the surrounding air through holes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"모터가 작동하면, 날개가 돌아가고, 모터는 구멍을 통해 주변의 공기를 빨아들인다.","opts":["모터가 작동하면 날개가 돌면서 구멍으로 주변 공기를 빨아들인다.","모터가 멈추면 날개가 돌면서 구멍으로 공기를 내보낸다.","모터가 작동하면 날개가 멈추고 구멍이 닫힌다.","날개가 돌면 모터가 고장 나서 공기가 새어 나온다."],"r":{"a":"1) 모터가 작동하면 날개가 돌면서 구멍으로 주변 공기를 빨아들인다.","ev":"9번 문장","s":[[9,"When the motor is activated, the blades spin, and it sucks in the surrounding air through holes.","모터가 작동하면, 날개가 돌아가고, 모터는 구멍을 통해 주변의 공기를 빨아들인다."]],"w":"activated는 작동되다라는 뜻이에요. 모터가 작동하면 날개가 돌고(spin), 구멍(holes)으로 주변 공기를 빨아들인다(sucks in)는 선지가 정답이에요.","c":1},"h":"14823609f2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["날개 없는 선풍기는 보통 선풍기보다 열기를 더 잘 식혀 주고 전력을 더 적게 사용한다.","날개 없는 선풍기는 열기를 덜 잘 식혀 주지만 전력을 더 적게 사용한다.","날개 없는 선풍기는 보통 선풍기보다 전력을 더 많이 사용한다.","날개 없는 선풍기는 열기를 더 잘 식혀 주지만 전력을 더 많이 사용한다."],"opts":["A bladeless fan cools you off better and uses less electricity than a regular fan.","A bladeless fan cools you off worse but uses less electricity.","A bladeless fan uses more electricity than a regular fan.","A bladeless fan cools you off better but uses more electricity."],"r":{"a":"1) A bladeless fan cools you off better and uses less electricity than a regular fan. (날개 없는 선풍기는 보통 선풍기보다 열기를 더 잘 식혀 주고 전력을 더 적게 사용한다.)","ev":"3번 문장","s":[[3,"Not only does a bladeless fan cool you off better, but it also uses less electricity.","날개 없는 선풍기는 당신의 열기를 더 잘 식혀 줄 뿐만 아니라, 더 적은 전력을 사용하기도 한다."]],"w":"3번에서 날개 없는 선풍기는 열기를 더 잘 식혀 줄 뿐만 아니라(cool you off better) 더 적은 전력(less electricity)을 사용한다고 해요.","c":1},"h":"e0b5c6cb14"},{"n":9,"t":"sum","q":"The air coming out of the ring makes a very (A) (B).","ko":"고리에서 나오는 공기는 매우 (A) (B)을(를) 만든다.","opts":["(A) strong / (B) airflow","(A) strong / (B) noise","(A) weak / (B) airflow","(A) weak / (B) noise","(A) heavy / (B) noise"],"oko":["(A) 강력한 / (B) 기류","(A) 강력한 / (B) 소음","(A) 약한 / (B) 기류","(A) 약한 / (B) 소음","(A) 무거운 / (B) 소음"],"r":{"a":"1) (A) strong / (B) airflow","ev":"11번 문장","s":[[11,"This creates a very strong airflow.","이것은 매우 강력한 기류를 만들어낸다."]],"w":"11번에서 이것(고리로 나오는 공기)이 매우 강력한(strong) 기류(airflow)를 만든다고 해요.","c":1},"h":"2b0bf434e0"},{"n":10,"t":"fill","q":"But how does a bladeless fan [A] a cool [B] without blades?","ko":"하지만 날개 없는 선풍기는 어떻게 날개 없이 시원한 [B]을(를) [A]할까?","bank":["create","breeze","worry","hurt","motor","ring"],"bko":{"create":"만들다","breeze":"바람","worry":"걱정하다","hurt":"다치게 하다","motor":"모터","ring":"고리"},"r":{"a":"[A] create (만들다), [B] breeze (바람)","ev":"6번 문장","s":[[6,"But how does a bladeless fan create a cool breeze without blades?","하지만 날개 없는 선풍기는 어떻게 날개 없이 시원한 바람을 만들까?"]],"w":"6번에서 날개 없는 선풍기가 어떻게 날개 없이 시원한 바람(breeze)을 만들까(create)라고 물어요.","c":null},"h":"ad082b8f0e"}]},{"u":9,"id":"hk4-09-3","no":3,"ko":"공룡이 사라졌다, 왜?\b","items":[{"n":1,"t":"tf","q":"The rock samples from the crater had no sulfur in them.","ko":"분화구의 암석 표본에는 황이 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Then, they found out that there was no sulfur in them, while the area surrounding the crater was rich in sulfur.","그 후, 그들은 암석 표본에는 황이 없는데, 반면에 그 분화구를 둘러싼 지역에는 황이 많았다는 것을 발견했다."]],"w":"6번 문장에서 과학자들은 암석 표본에는 황이 없다는 것(there was no sulfur in them)을 발견했어요.","c":"T"},"h":"7a1fae4d2e"},{"n":2,"t":"tf","q":"The global winter would have lasted for only a few days.","ko":"지구의 겨울은 단 며칠만 지속되었을 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"This global winter would have lasted for decades.","이러한 지구의 겨울은 수십 년 동안 지속되었을 것이다."]],"w":"9번 문장에서 지구의 겨울은 수십 년(decades) 동안 지속되었을 것이라고 해요. 며칠이 아니에요.","c":"F"},"h":"f2317c11a3"},{"n":3,"t":"tf","q":"Scientists assume that about 75% of all life on the planet was killed off.","ko":"과학자들은 지구상의 모든 생명체의 약 75퍼센트가 몰살되었다고 추정한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The scientists assume this event killed off not only the dinosaurs but also about 75% of all life on the planet!","과학자들은 이 사건이 공룡뿐만 아니라 지구상의 모든 생명체의 약 75퍼센트를 몰살시켰을 것이라고 추정한다!"]],"w":"11번 문장에서 이 사건이 공룡뿐만 아니라 모든 생명체의 약 75퍼센트를 몰살시켰다고 추정한다고 해요.","c":"T"},"h":"d4c1b0008b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists uncovered new information that might solve the mystery.)","ko":"과학자들은 그 수수께끼를 풀어 줄 수도 있는 새로운 정보를 ( ).","opts":["숨겼다","알아냈다","잃어버렸다","팔았다"],"word":"uncovered","r":{"a":"2) 알아냈다","ev":"4번 문장","s":[[4,"However, recently, scientists uncovered new information that might solve the mystery.","하지만, 최근에, 과학자들은 그 수수께끼를 풀어 줄 수도 있는 새로운 정보를 알아냈다."]],"w":"4번은 ‘수수께끼를 풀어 줄 새 정보’를 이야기해요. 정보를 ‘알아낸다(uncover)’는 흐름이에요.","c":2},"h":"9b3ebdd71b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The impact caused a huge amount of sulfur to evaporate into the atmosphere.)","ko":"그 충돌이 막대한 양의 황이 대기로 ( ) 만들었다.","opts":["가라앉도록","얼도록","쌓이도록","증발하도록"],"word":"evaporate","r":{"a":"4) 증발하도록","ev":"7번 문장","s":[[7,"This led them to assume the impact caused a huge amount of sulfur from the crater to evaporate into the atmosphere.","이것은 그들로 하여금 그 충돌이 분화구로부터 막대한 양의 황이 대기로 증발하도록 만들었다고 추정하게 했다."]],"w":"황이 분화구에서 대기로 올라가 구름이 되었다는 흐름이에요(8번). evaporate는 ‘증발하다’예요.","c":4},"h":"e4fa30e595"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey first collected and analyzed rock samples from the crater.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 먼저 분화구에서 암석 표본을 수집하고 분석했다.","opts":["공룡들","과학자들","소행성들","멕시코만 사람들"],"pron":"They","r":{"a":"2) 과학자들","ev":"4~5번 문장","s":[[4,"However, recently, scientists uncovered new information that might solve the mystery.","하지만, 최근에, 과학자들은 그 수수께끼를 풀어 줄 수도 있는 새로운 정보를 알아냈다."],[5,"They first collected and analyzed rock samples from the crater.","그들은 먼저 분화구에서 암석 표본을 수집하고 분석했다."]],"w":"4번에서 과학자들(scientists)이 새로운 정보를 알아냈다고 했어요. 5번의 They는 그 과학자들이에요.","c":2,"k":"They = 과학자들"},"h":"2fab00102e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A large cloud of sulfur would have blocked the sun, and the average temperature of the planet may have decreased by about 15°C.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"거대한 황 구름이 태양을 가렸을 것이고, 지구의 평균 기온이 약 15도 정도 떨어졌을 수도 있다.","opts":["황 구름이 태양을 가렸고 그 때문에 지구의 기온이 떨어졌을 것으로 추측된다.","황 구름이 태양을 가렸고 그 때문에 지구의 기온이 15도 올랐다.","황 구름이 태양을 가리지 못해서 기온이 변하지 않았을 것이다.","태양이 황 구름을 가려서 지구가 따뜻해졌을 것이다."],"r":{"a":"1) 황 구름이 태양을 가렸고 그 때문에 지구의 기온이 떨어졌을 것으로 추측된다.","ev":"8번 문장","s":[[8,"A large cloud of sulfur would have blocked the sun, and the average temperature of the planet may have decreased by about 15°C.","거대한 황 구름이 태양을 가렸을 것이고, 지구의 평균 기온이 약 15도 정도 떨어졌을 수도 있다."]],"w":"would have blocked는 ‘가렸을 것이다’, may have decreased는 ‘떨어졌을 수도 있다’로 과거 일에 대한 추측이에요. 태양이 가려지니 기온이 떨어졌다는 뜻이에요.","c":1},"h":"577063ca7e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["소행성은 약 6만 6천 년 전에 지구를 강타했다.","지구의 겨울 동안 식물이 죽고 먹이사슬이 붕괴되었을 것이다.","분화구를 둘러싼 지역에는 황이 없었다.","과학자들은 충돌이 어떻게 공룡을 죽게 했는지 이미 정확히 알고 있었다."],"opts":["The asteroid hit the Earth about 66 thousand years ago.","Plants would have died and the food chain would have broken down during the global winter.","The area surrounding the crater had no sulfur.","Scientists already knew exactly how the impact killed the dinosaurs."],"r":{"a":"2) Plants would have died and the food chain would have broken down during the global winter.","ev":"10번 문장","s":[[10,"During this period, plants would have died, and the food chain would have broken down.","이 기간 동안, 식물이 죽고, 먹이사슬은 붕괴되었을 것이다."]],"w":"10번 문장에서 이 기간 동안 식물이 죽고 먹이사슬이 붕괴되었을 것이라고 해요. 소행성은 6천 6백만 년 전이고(1번), 황이 없는 곳은 암석 표본이며(6번), 어떻게 멸종했는지는 불명확했어요(3번).","c":2},"h":"e6b580b80b"},{"n":9,"t":"sum","q":"Many believed that this caused the (A) of the dinosaurs, but exactly how it happened was (B).","ko":"많은 이들이 이것이 공룡의 (A)을(를) 야기했다고 믿었지만, 그것이 정확히 어떻게 일어났는지는 (B).","opts":["(A) extinction / (B) unclear","(A) extinction / (B) famous","(A) birth / (B) unclear","(A) birth / (B) famous","(A) size / (B) famous"],"oko":["(A) 멸종 / (B) 불명확했다","(A) 멸종 / (B) 유명했다","(A) 탄생 / (B) 불명확했다","(A) 탄생 / (B) 유명했다","(A) 크기 / (B) 유명했다"],"r":{"a":"1) (A) extinction / (B) unclear","ev":"3번 문장","s":[[3,"Many believed that this caused the extinction of the dinosaurs, but it was unclear exactly how it happened.","많은 이들이 이것이 공룡의 멸종을 야기했다고 믿었지만, 정확히 그것이 어떻게 일어났는지는 불명확했다."]],"w":"3번에서 많은 이들이 이것이 공룡의 멸종(extinction)을 야기했다고 믿었지만, 어떻게 일어났는지는 불명확했다(unclear)고 해요.","c":1},"h":"53ff9be7ad"},{"n":10,"t":"fill","q":"The impact created a massive crater [A] the Gulf of [B].","ko":"그 충돌은 [B]만 [A] 거대한 분화구를 만들었다.","bank":["beneath","Mexico","during","since","Earth","sulfur"],"bko":{"beneath": ":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["탑독은 경기에서 이길 것 같은 팀이나 사람이다.","언더독은 경기에서 이길 것 같은 팀이나 사람이다.","탑독은 경기에 전혀 나가지 않는 팀이나 사람이다.","탑독은 상대 팀을 응원하는 사람이다."],"opts":["A top dog is a team or person that is likely to win in a match.","An underdog is a team or person that is likely to win in a match.","A top dog is a team or person that never plays in a match.","A top dog is a person who cheers for the other team."],"r":{"a":"1) A top dog is a team or person that is likely to win in a match. (탑독은 경기에서 이길 것 같은 팀이나 사람이다.)","ev":"3번 문장","s":[[3,"A team or person that is likely to win in a match is called a top dog.","경기에서 이길 것 같은 팀이나 사람은 탑독(강자)이라고 불린다."]],"w":"3번에서 경기에서 이길 것 같은(likely to win) 팀이나 사람을 탑독이라고 부른다고 해요.","c":1},"h":"e8979b6c62"},{"n":9,"t":"sum","q":"The top dog winning is not that (A), but the underdog winning is far more surprising and (B).","ko":"탑독이 이기는 것은 그렇게 (A)지 않지만, 언더독이 이기는 것은 훨씬 더 놀랍고 (B).","opts":["(A) exciting / (B) pleasing","(A) exciting / (B) painful","(A) expensive / (B) pleasing","(A) expensive / (B) painful","(A) cheap / (B) painful"],"oko":["(A) 흥미진진하 / (B) 만족스럽다","(A) 흥미진진하 / (B) 고통스럽다","(A) 비싸 / (B) 만족스럽다","(A) 비싸 / (B) 고통스럽다","(A) 싸 / (B) 고통스럽다"],"r":{"a":"1) (A) exciting / (B) pleasing","ev":"6번 문장","s":[[6,"While the top dog winning is not that exciting, the underdog winning is far more surprising and pleasing.","탑독이 이기는 것은 그렇게 흥미진진하지 않은 반면, 언더독이 이기는 것은 훨씬 더 놀랍고 만족스럽다."]],"w":"6번에서 탑독이 이기는 것은 그렇게 흥미진진하지(exciting) 않은 반면, 언더독이 이기는 것은 훨씬 더 놀랍고 만족스럽다(pleasing)고 해요.","c":1},"h":"492f5f3b52"},{"n":10,"t":"fill","q":"Then you’ve [A] the underdog [B].","ko":"그렇다면 당신은 언더독 [B]을(를) [A]한 것이다.","bank":["experienced","effect","cheered","related","brains","unfair"],"bko":{"experienced":"경험했다","effect":"효과","cheered":"응원했다","related":"공감했다","brains":"뇌","unfair":"불공평한"},"r":{"a":"[A] experienced (경험했다), [B] effect (효과)","ev":"2번 문장","s":[[2,"Then you’ve experienced the underdog effect.","그렇다면 당신은 언더독 효과를 경험해본 것이다."]],"w":"2번에서 그렇다면 당신은 언더독 효과(effect)를 경험해 본(experienced) 것이라고 해요.","c":null},"h":"57dcf693b6"}]},{"u":10,"id":"hk4-10-2","no":2,"ko":"집 나간 벌을 찾습니다\b","items":[{"n":1,"t":"tf","q":"The remaining bees, including the queen, survive after the worker bees leave.","ko":"여왕벌을 포함해 남아 있는 벌들은 일벌이 떠난 뒤에도 살아남는다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"The remaining bees, including the queen and the young bees, starve to death.","여왕벌과 어린 벌을 포함하여, 남아 있는 벌은 굶어 죽는다."]],"w":"3번 문장에서 여왕벌과 어린 벌을 포함해 남아 있는 벌은 굶어 죽는다고 해요. 살아남는다는 말은 반대예요.","c":"F"},"h":"aca10c6a8a"},{"n":2,"t":"tf","q":"Some researchers blame electronic signals from mobile phones.","ko":"몇몇 연구원들은 휴대폰의 전자 신호를 탓한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Some researchers also blame electronic signals from mobile phones.","몇몇 연구원들은 휴대폰의 전자 신호를 탓하기도 한다."]],"w":"11번 문장에 Some researchers also blame electronic signals from mobile phones가 그대로 있어요.","c":"T"},"h":"741713a0b8"},{"n":3,"t":"tf","q":"Honey bees play a vital role in helping plants reproduce.","ko":"꿀벌은 식물이 번식하도록 돕는 중요한 역할을 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"This can cause a serious problem because honey bees play a vital role in helping plants reproduce.","이것은 심각한 문제를 야기할 수 있는데, 왜냐하면 꿀벌이 식물이 번식하도록 돕는 것에 있어 중요한 역할을 하기 때문이다."]],"w":"6번 문장에서 꿀벌이 식물이 번식하도록 돕는 중요한 역할(a vital role)을 한다고 해요.","c":"T"},"h":"5ce49c7e7c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The remaining bees, including the queen and the young bees, starve to death.)","ko":"여왕벌과 어린 벌을 포함하여, 남아 있는 벌은 ( ) 죽는다.","opts":["굶어","얼어","병들어","늙어"],"word":"starve","r":{"a":"1) 굶어","ev":"3번 문장","s":[[3,"The remaining bees, including the queen and the young bees, starve to death.","여왕벌과 어린 벌을 포함하여, 남아 있는 벌은 굶어 죽는다."]],"w":"일벌이 먹이를 찾으러 나가 돌아오지 않으니 남은 벌들은 먹을 것이 없어요. starve to death는 ‘굶어 죽다’예요.","c":1},"h":"629b2f953e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (There are numerous theories about why such a phenomenon is occurring.)","ko":"왜 그러한 현상이 일어나고 있는지에 대해 ( ) 이론이 있다.","opts":["거의 없는","믿기 어려운","수많은","오래된"],"word":"numerous","r":{"a":"3) 수많은","ev":"9~10번 문장","s":[[9,"There are numerous theories about why such a phenomenon is occurring.","왜 그러한 현상이 일어나고 있는지에 대해 수많은 이론이 있다."],[10,"Many of them suggest that environmental pollution, diseases, or exposure to harmful agricultural chemicals could be the main causes.","그 중 많은 것이 환경 오염, 질병, 또는 해로운 농약에의 노출이 주요 원인일 수 있다고 제시한다."]],"w":"9번은 왜 이런 현상이 일어나는지에 대한 이론이 ‘수많이’ 있다는 말이에요. 10~11번에서 여러 가지 원인이 줄줄이 나오는 것과 이어져요. numerous = 수많은.","c":3},"h":"c0f500742b"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nMany of them suggest that environmental pollution, diseases, or exposure to harmful agricultural chemicals could be the main causes.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그 중 많은 것이 환경 오염, 질병, 또는 해로운 농약에의 노출이 주요 원인일 수 있다고 제시한다.","opts":["꿀벌들","그러한 현상에 대한 이론들","연구원들","식량 작물들"],"pron":"them","r":{"a":"2) 그러한 현상에 대한 이론들","ev":"9~10번 문장","s":[[9,"There are numerous theories about why such a phenomenon is occurring.","왜 그러한 현상이 일어나고 있는지에 대해 수많은 이론이 있다."],[10,"Many of them suggest that environmental pollution, diseases, or exposure to harmful agricultural chemicals could be the main causes.","그 중 많은 것이 환경 오염, 질병, 또는 해로운 농약에의 노출이 주요 원인일 수 있다고 제시한다."]],"w":"9번에서 그러한 현상이 왜 일어나는지에 대한 이론(theories)이 있다고 했어요. 10번의 Many of them은 그 이론들 중 많은 것이에요.","c":2,"k":"them = 그러한 현상에 대한 이론들"},"h":"39697205b1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without them, we wouldn’t be able to grow fruits and vegetables!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"꿀벌이 없다면, 우리는 과일과 채소를 기를 수 없을 것이다!","opts":["꿀벌이 없다면 우리는 과일과 채소를 더 많이 기를 수 있을 것이다.","꿀벌이 있으면 우리는 과일과 채소를 기를 수 없을 것이다.","우리가 과일과 채소를 기르지 않으면 꿀벌이 없어질 것이다.","꿀벌이 없다면 우리는 과일과 채소를 기를 수 없을 것이다."],"r":{"a":"4) 꿀벌이 없다면 우리는 과일과 채소를 기를 수 없을 것이다.","ev":"8번 문장","s":[[8,"Without them, we wouldn’t be able to grow fruits and vegetables!","꿀벌이 없다면, 우리는 과일과 채소를 기를 수 없을 것이다!"]],"w":"Without them은 ‘꿀벌이 없다면’이고 wouldn’t be able to grow는 ‘기를 수 없을 것이다’예요. 7번에서 꿀벌이 식량 작물의 70퍼센트를 수분시키기 때문이에요.","c":4},"h":"8102873d22"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["꿀벌은 우리의 주요 식량 작물의 70퍼센트를 수분시킨다.","일벌은 꽃을 찾은 뒤 벌집으로 돌아온다.","그 문제가 2006년에 처음 보고된 뒤에 80만 개가 넘는 군집이 사라졌다.","연구원들은 꿀벌이 사라지는 한 가지 분명한 원인을 찾았다."],"opts":["Honey bees pollinate 70% of our main food crops.","Worker bees return to their hive after searching for flowers.","Over 800,000 colonies died out after the problem was first reported in 2006.","Researchers have found one clear cause of the disappearing bees."],"r":{"a":"1) Honey bees pollinate 70% of our main food crops.","ev":"7번 문장","s":[[7,"As a matter of fact, honey bees pollinate 70% of our main food crops, including most fruits and vegetables.","실제로, 꿀벌은 대부분의 과일과 채소를 포함하여 주요 식량 작물의 70퍼센트를 수분시킨다."]],"w":"7번 문장에서 꿀벌은 주요 식량 작물의 70퍼센트를 수분시킨다고 해요. 일벌은 돌아오지 않고(2번), 80만 개가 넘는 군집은 처음 보고되었을 때 이미 사라진 상태였고(5번), 원인에 대한 이론은 수없이 많아요(9번).","c":1},"h":"a7b6f43db4"},{"n":9,"t":"sum","q":"Eventually, the (A) honey bee colony (B).","ko":"결국, (A) 꿀벌 군집이 (B).","opts":["(A) entire / (B) collapses","(A) entire / (B) travels","(A) tiny / (B) collapses","(A) tiny / (B) travels","(A) sweet / (B) travels"],"oko":["(A) 전체 / (B) 붕괴된다","(A) 전체 / (B) 여행한다","(A) 작은 / (B) 붕괴된다","(A) 작은 / (B) 여행한다","(A) 달콤한 / (B) 여행한다"],"r":{"a":"1) (A) entire / (B) collapses","ev":"4번 문장","s":[[4,"Eventually, the entire honey bee colony collapses.","결국, 꿀벌 군집 전체가 붕괴된다."]],"w":"4번에서 결국 꿀벌 군집 전체(entire)가 붕괴된다(collapses)고 해요.","c":1},"h":"c8c8da7384"},{"n":10,"t":"fill","q":"Electronic signals [A] the bees’ sense of direction, so the bees have [B] finding their way home.","ko":"전자 신호가 벌의 방향 감각을 [A]해서, 벌은 집으로 가는 길을 찾는 데 [B]을(를) 겪는다.","bank":["disrupt","difficulty","pollinate","starve","hive","crops"],"bko":{"disrupt":"방해하다","difficulty":"어려움","pollinate":"수분시키다","starve":"굶주리다","hive":"벌집","crops":"작물들"},"r":{"a":"[A] disrupt, [B] difficulty","ev":"11~12번 문장","s":[[11,"Some researchers also blame electronic signals from mobile phones.","몇몇 연구원들은 휴대폰의 전자 신호를 탓하기도 한다."],[12,"They disrupt the bees’ sense of direction, so the bees have difficulty finding their way home.","그것이 벌의 방향 감각을 방해해서, 벌은 집으로 가는 길을 찾는 데 어려움을 겪는다."]],"w":"12번 문장 They disrupt the bees’ sense of direction, so the bees have difficulty finding their way home에서 가져왔어요. pollinate, collapse는 방향 감각을 방해한다는 뜻이 아니고, hive와 crops는 명사라 동사 자리에 맞지 않아요.","c":null},"h":"6206298551"}]},{"u":10,"id":"hk4-10-3","no":3,"ko":"이 검은색은 ‘찐’이야\b","items":[{"n":1,"t":"tf","q":"Vantablack absorbs 90% of light.","ko":"반타블랙은 빛의 90퍼센트를 흡수한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"For example, a color called Vantablack absorbs up to 99.965% of light.","예를 들어, 반타블랙이라고 불리는 색은 빛의 99.965퍼센트까지 흡수한다."]],"w":"7번 문장에서 반타블랙은 빛의 99.965퍼센트까지 흡수한다고 해요. 90퍼센트는 평범한 검은색이에요(5번).","c":"F"},"h":"4fa5aedaaa"},{"n":2,"t":"tf","q":"Newly developed black materials look darker because they take in more light.","ko":"새롭게 개발된 검은색 물질은 더 많은 빛을 흡수하기 때문에 더 어둡게 보인다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"But newly developed black materials can take in more light, so they look darker.","하지만 새롭게 개발된 검은색 물질들은 더 많은 빛을 흡수할 수 있어서, 더 어둡게 보인다."]],"w":"6번 문장에서 새 검은색 물질은 더 많은 빛을 흡수할 수 있어서 더 어둡게 보인다고 해요.","c":"T"},"h":"f70e18f67b"},{"n":3,"t":"tf","q":"The new black colors can be used only for space telescopes.","ko":"새로운 검은색은 우주 망원경에만 쓰일 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11, 14번 문장","s":[[11,"These new black colors can be used for different purposes.","이러한 새로운 검은색은 다양한 용도로 쓰일 수 있다."],[14,"Also, they can be used on sculptures to create wonderful pieces of art and on clothes to make unique designs.","또한, 그것들은 훌륭한 예술 작품들을 만들기 위해 조각상에 그리고 독특한 디자인을 만들기 위해 옷에 쓰일 수 있다."]],"w":"11번에서 다양한 용도로 쓰일 수 있다고 하고, 14번에서 조각상과 옷에도 쓸 수 있다고 해요. 우주 망원경에만 쓰인다는 말은 틀려요.","c":"F"},"h":"7546cbba7d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A color called Vantablack absorbs up to 99.965% of light.)","ko":"반타블랙이라고 불리는 색은 빛의 99.965퍼센트까지 ( ).","opts":["반사한다","흡수한다","만든다","숨긴다"],"word":"absorbs","r":{"a":"2) 흡수한다","ev":"4, 7번 문장","s":[[4,"The darkness of a color depends on how much visible light is absorbed by it.","색의 어두움은 얼마나 많은 가시광선이 그것에 의해 흡수되는지에 달려 있다."],[7,"For example, a color called Vantablack absorbs up to 99.965% of light.","예를 들어, 반타블랙이라고 불리는 색은 빛의 99.965퍼센트까지 흡수한다."]],"w":"4번에서 색의 어두움은 빛이 얼마나 많이 흡수되는지에 달려 있다고 했어요. 반타블랙이 아주 어두운 이유는 빛을 99.965퍼센트까지 ‘흡수하기’ 때문이에요.","c":2},"h":"89ff43c018"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, they can be used on sculptures to create wonderful pieces of art and on clothes to make unique designs.)","ko":"또한, 그것들은 훌륭한 예술 작품들을 만들기 위해 조각상에 그리고 ( ) 디자인을 만들기 위해 옷에 쓰일 수 있다.","opts":["독특한","흔한","낡은","값싼"],"word":"unique","r":{"a":"1) 독특한","ev":"14번 문장","s":[[14,"Also, they can be used on sculptures to create wonderful pieces of art and on clothes to make unique designs.","또한, 그것들은 훌륭한 예술 작품들을 만들기 위해 조각상에 그리고 독특한 디자인을 만들기 위해 옷에 쓰일 수 있다."]],"w":"새 검은색을 옷에 쓰면 다른 옷과 다른, 나만의 디자인을 만들 수 있다는 흐름이에요. unique = 독특한.","c":1},"h":"627dda3ae4"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen a sparkling diamond was coated with this material, it seemed to become invisible!","ko":"밑줄 친 it이 가리키는 것은?","sko":"반짝이는 다이아몬드가 이 물질로 칠해졌을 때, 그것은 눈에 보이지 않게 된 것처럼 보였다!","opts":["이 검은색 물질","우주 망원경","반짝이는 다이아몬드","평범한 검은색 물감"],"r":{"a":"3) 반짝이는 다이아몬드","ev":"10번 문장","s":[[10,"When a sparkling diamond was coated with this material, it seemed to become invisible!","반짝이는 다이아몬드가 이 물질로 칠해졌을 때, 그것은 눈에 보이지 않게 된 것처럼 보였다!"]],"w":"물질로 칠해진 것은 다이아몬드이고, 칠해진 뒤 보이지 않게 된 것처럼 보인 것도 그 다이아몬드예요. it은 a sparkling diamond를 가리켜요.","c":3},"h":"ef0d9f4ea1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The darkness of a color depends on how much visible light is absorbed by it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"색의 어두움은 얼마나 많은 가시광선이 그것에 의해 흡수되는지에 달려 있다.","opts":["색이 얼마나 어두운지는 그 색이 가시광선을 얼마나 많이 흡수하느냐에 달려 있다.","색이 얼마나 어두운지는 그 색의 이름에 달려 있다
