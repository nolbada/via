<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>말하기 대비 샘플</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#222;--sub:#777;--line:#e6e2d9;--pri:#1f5c4a;--warn:#c47a1a;--bad:#b4402f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;line-height:1.5}
.w{max-width:520px;margin:0 auto;padding:14px 16px 60px}
.demo{background:#fbefd9;color:#6b3f06;font-size:12px;padding:8px 12px;border-radius:10px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button,.seg button{flex:1;padding:11px 0;border:1px solid var(--line);background:var(--card);border-radius:12px;font:inherit;font-size:14px;color:var(--ink)}
.tabs button.on,.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
h1{font-size:19px;margin:4px 2px 2px}.sub{color:var(--sub);font-size:13px;margin:0 2px 12px}
.seg{display:flex;gap:8px;margin:0 0 12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.r1{display:flex;align-items:center;gap:10px}
.wd{font-size:20px;font-weight:700;flex:1}.mn{color:var(--ink);font-size:15px;margin-top:2px}
.snd{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;color:var(--pri)}
.rel{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px}
.rel b{display:inline-block;min-width:44px;color:var(--sub);font-weight:500;font-size:12px}
.rel div{margin:3px 0}
.big{font-size:26px;font-weight:700;text-align:center;margin:22px 0 6px}
.btn{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;font:inherit;font-size:15px;margin-top:8px}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.g3{display:flex;gap:8px;margin-top:12px}
.g3 button{flex:1;padding:16px 0;border-radius:14px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;font-weight:700}
.g3 .o{color:var(--pri)}.g3 .h{color:var(--warn)}.g3 .x{color:var(--bad)}
.res{margin-top:12px;padding:10px 12px;border-radius:12px;background:#eef5f1;font-size:13.5px}
.cnt{color:var(--sub);font-size:13px;text-align:center;margin-bottom:6px}
.hide{display:none}
</style></head><body><div class="w">
<div class="demo">샘플 화면 · 기록은 저장되지 않음 · 단어와 유의어·반의어는 예시</div>
<div class="tabs"><button id="t1" class="on">학생 화면</button><button id="t2">선생님 화면</button></div>
<div id="app"></div></div>
<script>
var W=[
['inhabit','거주하다',['live in','dwell'],[]],
['regard','~로 여기다',['consider','view'],['disregard']],
['generate','발생시키다',['produce','create'],[]],
['decline','거절하다',['refuse','reject'],['accept']],
['deserve','~받을 만하다',['merit','earn'],[]],
['approve','승인하다',['authorize','endorse'],['reject','disapprove']],
['increase','증가하다',['rise','grow'],['decrease','decline']],
['reduce','줄이다',['cut','lower'],['increase','raise']],
['ancient','고대의',['old','archaic'],['modern']],
['fragile','깨지기 쉬운',['delicate','breakable'],['sturdy','durable']]];
var app=document.getElementById('app'),mode='stu',sub='list',i=0,shown=false,open={},tc=0,res=null;
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function rel(w){var h='<div class="rel">';h+='<div><b>유의어</b>'+(w[2].length?w[2].join(', '):'-')+'</div>';h+='<div><b>반의어</b>'+(w[3].length?w[3].join(', '):'-')+'</div></div>';return h}
function stu(){
  var h='<h1>금요일 말하기 대비</h1><div class="sub">단어 '+W.length+'개</div>';
  h+='<div class="seg"><button data-s="list" class="'+(sub==='list'?'on':'')+'">단어 목록</button><button data-s="say" class="'+(sub==='say'?'on':'')+'">말해보기</button></div>';
  if(sub==='list'){
    W.forEach(function(w,k){h+='<div class="c" data-k="'+k+'"><div class="r1"><div class="wd">'+w[0]+'</div><button class="snd" data-p="'+k+'">듣기</button></div><div class="mn">'+w[1]+'</div>'+(open[k]?rel(w):'')+'</div>'});
  }else{
    var w=W[i];
    h+='<div class="cnt">'+(i+1)+' / '+W.length+'</div><div class="c"><div class="big">'+w[1]+'</div>';
    if(shown){h+='<div class="big" style="margin-top:6px;color:var(--pri)">'+w[0]+'</div><div style="text-align:center"><button class="snd" data-p="'+i+'">듣기</button></div>'+rel(w)}
    h+='</div>';
    h+=shown?'<button class="btn pri" id="nx">다음</button>':'<button class="btn" id="sh">확인</button>';
  }
  app.innerHTML=h;
  app.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){sub=b.dataset.s;i=0;shown=false;stu()}});
  app.querySelectorAll('.snd').forEach(function(b){b.onclick=function(e){e.stopPropagation();say(W[+b.dataset.p][0])}});
  app.querySelectorAll('.c[data-k]').forEach(function(c){c.onclick=function(){var k=+c.dataset.k;open[k]=!open[k];stu()}});
  var sh=document.getElementById('sh');if(sh)sh.onclick=function(){shown=true;say(W[i][0]);stu()};
  var nx=document.getElementById('nx');if(nx)nx.onclick=function(){i=(i+1)%W.length;shown=false;stu()};
}
function tch(){
  var w=W[tc];
  var h='<h1>금요일 말하기 시험</h1><div class="sub">홍길동</div><div class="cnt">'+(tc+1)+' / '+W.length+'</div>';
  h+='<div class="c"><div class="r1"><div class="wd" style="font-size:24px">'+w[0]+'</div><button class="snd" id="sd">듣기</button></div><div class="mn">'+w[1]+'</div>'+rel(w)+'</div>';
  if(!res){h+='<div class="g3"><button class="o" data-r="o">O</button><button class="h" data-r="h">반쪽</button><button class="x" data-r="x">X</button></div>'}
  else{
    var m={o:'정답 · 다음 복습 단계로 올라감 (예: 3일 뒤 → 7일 뒤)',h:'반쪽 · 단계 그대로 (예: 3일 뒤 복습 유지)',x:'오답 · 1일 뒤 복습부터 다시'};
    h+='<div class="res">'+m[res]+'</div><button class="btn pri" id="nt">'+(tc<W.length-1?'다음 단어':'처음으로')+'</button>';
  }
  app.innerHTML=h;
  document.getElementById('sd').onclick=function(){say(w[0])};
  app.querySelectorAll('.g3 button').forEach(function(b){b.onclick=function(){res=b.dataset.r;tch()}});
  var nt=document.getElementById('nt');if(nt)nt.onclick=function(){tc=(tc+1)%W.length;res=null;tch()};
}
function draw(){document.getElementById('t1').className=mode==='stu'?'on':'';document.getElementById('t2').className=mode==='tch'?'on':'';mode==='stu'?stu():tch()}
document.getElementById('t1').onclick=function(){mode='stu';draw()};document.getElementById('t2').onclick=function(){mode='tch';draw()};
draw();
</script></body></html>
