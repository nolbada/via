 시원한 / (B) 수분","(A) 시원한 / (B) 색","(A) 차가운 / (B) 향기"],"opts":["(A) warm / (B) moisture","(A) warm / (B) color","(A) cool / (B) moisture","(A) cool / (B) color","(A) cold / (B) scent"],"r":{"a":"1) (A) warm / (B) moisture ((A) 따뜻한 / (B) 수분)","ev":"9번 문장","s":[[9,"By afternoon, however, warm temperatures and a decrease in light result in the petals losing their moisture and closing.","하지만 오후쯤이 되면, 따뜻한 온도와 빛의 감소가 꽃잎들이 수분을 잃고 닫혀버리는 결과로 이어진다."]],"w":"9번에서 오후쯤이 되면 따뜻한(warm) 온도와 빛의 감소 때문에 꽃잎이 수분(moisture)을 잃고 닫힌다고 해요.","c":1},"h":"afc1243d40"},{"n":10,"t":"fill","q":"This may sound like a [A], but it’s actually a [B] of the petals of a morning glory!","ko":"이것은 [A]처럼 들릴 수 있지만, 그것은 사실 나팔꽃 꽃잎에 대한 [B]이다!","bank":["riddle","description","absorb","unfold","respond","activate"],"bko":{"riddle":"수수께끼","description":"설명","absorb":"흡수하다","unfold":"펼쳐지다","respond":"반응하다","activate":"활성화하다"},"r":{"a":"[A] riddle (수수께끼), [B] description (설명)","ev":"2번 문장","s":[[2,"This may sound like a riddle, but it’s actually a description of the petals of a morning glory!","이것은 수수께끼처럼 들릴 수 있지만, 그것은 사실 나팔꽃 꽃잎에 대한 설명이다!"]],"w":"2번은 이것이 수수께끼(riddle)처럼 들릴 수 있지만 사실은 나팔꽃 꽃잎에 대한 설명(description)이라는 내용이에요. 나머지 단어는 동사라서 a 뒤의 빈칸에 넣으면 문법이 맞지 않아요.","c":null},"h":"c23025ab49"}]},{"u":9,"id":"ms2-09-3","no":3,"ko":"도시가 싫어서 도시를 설계한 사람","items":[{"n":1,"t":"tf","q":"The model of Broadacre City was first put on display in 1935.","ko":"브로드에이커 시티의 모형은 1935년에 처음 전시되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"His design was revealed in the form of a massive model that was first put on display in 1935.","그의 설계는 1935년에 처음으로 전시된 거대한 모형의 형태로 공개되었다."]],"w":"7번 문장에 massive model that was first put on display in 1935라고 나와요.","c":"T"},"h":"765587d27f"},{"n":2,"t":"tf","q":"Broadacre City was built in many cities around the world.","ko":"브로드에이커 시티는 전 세계 많은 도시에 지어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Although Broadacre City was never realized, it has significantly influenced modern urban planning.","비록 브로드에이커 시티는 결코 실현되지 않았지만, 그것은 현대 도시 계획에 상당한 영향을 미쳤다."]],"w":"12번 문장에서 Broadacre City was never realized, 즉 결코 실현되지 않았다고 해요. 많은 도시에서 흔한 것은 브로드에이커 시티가 아니라 그 영향을 받은 교외 지역이에요(13번).","c":"F"},"h":"ec78ab15ac"},{"n":3,"t":"tf","q":"Suburbs with extensive green space and public transportation are common in many cities today.","ko":"넓은 녹지 공간과 대중교통을 갖춘 교외 지역은 오늘날 많은 도시에서 흔하다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"For instance, suburbs with extensive green space and public transportation are now common in many cities around the world.","예를 들어, 광범위한 녹지 공간과 대중교통을 갖춘 교외 지역은 이제 전 세계 많은 도시에서 흔하다."]],"w":"13번 문장에 suburbs with extensive green space and public transportation are now common in many cities라고 나와요.","c":"T"},"h":"217f156db4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So he began planning a decentralized community with the right conditions for people to live happily.)","ko":"그래서 그는 사람들이 행복하게 살 수 있는 적절한 조건을 갖춘 분산된 공동체를 계획하기 시작했다.","opts":["집중된","파괴된","분산된","오래된"],"word":"decentralized","r":{"a":"3) 분산된","ev":"6번 문장","s":[[6,"So he began planning a decentralized community with the right conditions for people to live happily.","그래서 그는 사람들이 행복하게 살 수 있는 적절한 조건을 갖춘 분산된 공동체를 계획하기 시작했다."]],"w":"6번의 decentralized community는 한곳에 모이지 않고 넓게 흩어진 공동체예요. 4~5번에서 라이트가 사람이 밀집한 도시를 싫어했던 것과 이어져요. decentralized = 분산된.","c":3},"h":"f17293609c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Wright envisioned thousands of these communities linked together by superhighways and air transport.)","ko":"라이트는 초고속도로와 항공 운송으로 연결된 수천 개의 공동체들을 구상했다.","opts":["거절했다","잊었다","후회했다","구상했다"],"word":"envisioned","r":{"a":"4) 구상했다","ev":"11번 문장","s":[[11,"Wright envisioned thousands of these communities linked together by superhighways and air transport.","라이트는 초고속도로와 항공 운송으로 연결된 수천 개의 공동체들을 구상했다."]],"w":"11번은 라이트가 수천 개의 공동체가 연결된 모습을 머릿속에 그렸다는 뜻이에요. 실현되지 않은 계획이므로 envision = 구상하다, 마음속에 그리다.","c":4},"h":"77827cd8c8"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nHe felt they limited residents’ freedom and lowered their quality of life.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그는 그것들이 주민들의 자유를 제한하고 그들의 삶의 질을 낮춘다고 느꼈다.","opts":["주민들","인구 밀도가 높고 고도로 산업화된 도시들","라이트의 설계들","현대 도시의 건물들과 거리들"],"r":{"a":"2) 인구 밀도가 높고 고도로 산업화된 도시들","ev":"4~5번 문장","s":[[4,"Wright’s motivation was his strong dislike of densely populated, heavily industrialized cities.","라이트의 동기는 인구 밀도가 높고 고도로 산업화된 도시들에 대한 그의 강한 반감이었다."],[5,"He felt they limited residents’ freedom and lowered their quality of life.","그는 그것들이 주민들의 자유를 제한하고 그들의 삶의 질을 낮춘다고 느꼈다."]],"w":"5번의 they가 '주민들의 자유를 제한하고 삶의 질을 낮춘다'고 했으니 주어는 도시들이에요. 바로 앞 4번에서 라이트가 싫어한 densely populated, heavily industrialized cities를 가리켜요. residents는 they가 아니라 limited의 목적어 쪽에 나오는 말이에요.","c":2},"h":"c818f0f365"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There are various facilities such as farms, factories, and schools, all connected by road and rail systems.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"도로 및 철도 시스템으로 모두 연결된 농장, 공장, 학교 같은 다양한 시설들이 있다.","opts":["농장, 공장, 학교 같은 여러 시설이 도로와 철도로 모두 이어져 있다.","도로와 철도가 농장, 공장, 학교를 서로 떼어 놓는다.","학교는 있지만 농장과 공장은 없다.","시설들은 도로로만 이어지고 철도는 없다."],"r":{"a":"1) 농장, 공장, 학교 같은 여러 시설이 도로와 철도로 모두 이어져 있다.","ev":"9번 문장","s":[[9,"There are various facilities such as farms, factories, and schools, all connected by road and rail systems.","도로 및 철도 시스템으로 모두 연결된 농장, 공장, 학교 같은 다양한 시설들이 있다."]],"w":"such as farms, factories, and schools는 농장, 공장, 학교 같은 시설이라는 뜻이고, all connected by road and rail systems는 도로와 철도로 모두 연결되어 있다는 뜻이에요.","c":1},"h":"b30deb6f42"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["라이트는 1,400가구를 하나의 큰 아파트 건물에 모으려고 했다.","브로드에이커 시티의 공동체들은 도로와 철도 없이 서로 떨어져 있도록 계획되었다.","브로드에이커 시티는 1935년에 완성된 실제 도시로 처음 공개되었다.","브로드에이커 시티의 각 구조물은 주변 경관의 일부처럼 보이도록 디자인되었다."],"opts":["Wright planned to gather all 1,400 families in one large apartment building.","The communities in Broadacre City were planned to stand apart with no roads or railways.","Broadacre City was first shown to the public in 1935 as a finished real city.","Each structure in Broadacre City was designed to seem part of the surrounding landscape."],"r":{"a":"4) Each structure in Broadacre City was designed to seem part of the surrounding landscape.","ev":"10번 문장","s":[[10,"In addition, each structure has an organic design that makes it seem part of the surrounding landscape.","게다가, 각 구조물은 그것이 주변 경관의 일부처럼 보이게 만드는 유기적인 디자인을 가지고 있다."]],"w":"10번 문장에서 각 구조물이 주변 경관의 일부처럼 보이게 만드는 유기적인 디자인을 가진다고 해요. ①은 8번(가구마다 집이 있음), ②는 9번·11번(도로·철도와 항공으로 연결), ③은 7번(실제 도시가 아니라 모형)과 달라요.","c":4},"h":"0565c6d40b"},{"n":9,"t":"sum","q":"But the famed architect Frank Lloyd Wright designed an (A) called Broadacre City, with space for people to help them (B) from urban environments.","ko":"그러나 유명한 건축가 프랭크 로이드 라이트는 사람들이 도시 환경에서 (B) 수 있도록 돕는 공간이 있는, 브로드에이커 시티라고 불리는 (A)을(를) 설계했다.","oko":["(A) 대안 / (B) 벗어날","(A) 대안 / (B) 고통받을","(A) 모방 / (B) 벗어날","(A) 모방 / (B) 고통받을","(A) 적 / (B) 고통받을"],"opts":["(A) alternative / (B) escape","(A) alternative / (B) suffer","(A) imitation / (B) escape","(A) imitation / (B) suffer","(A) enemy / (B) suffer"],"r":{"a":"1) (A) alternative / (B) escape ((A) 대안 / (B) 벗어날)","ev":"3번 문장","s":[[3,"But the famed architect Frank Lloyd Wright designed an alternative called Broadacre City, with space for people to help them escape from urban environments.","그러나 유명한 건축가 프랭크 로이드 라이트는 사람들이 도시 환경에서 벗어날 수 있도록 돕는 공간이 있는 브로드에이커 시티라고 불리는 대안을 설계했다."]],"w":"3번에서 라이트는 사람들이 도시 환경에서 벗어날(escape) 수 있도록 돕는 공간이 있는 대안(alternative)인 브로드에이커 시티를 설계했다고 해요.","c":1},"h":"e654953772"},{"n":10,"t":"fill","q":"Broadacre City is a community of four [A] miles that is home to 1,400 families, each with a house on a one-[B] plot of land.","ko":"브로드에이커 시티는 4 [A] 마일 크기의 공동체로, 1,400가구가 살고 각 가구가 1[B] 대지에 집을 가진다.","bank":["square","acre","metric","families","factories","highways"],"bko":{"square":"제곱의","acre":"에이커","metric":"미터법의","families":"가구","factories":"공장들","highways":"고속도로"},"r":{"a":"[A] square, [B] acre","ev":"8번 문장","s":[[8,"It shows a community of four square miles that is home to 1,400 families, each with a house on a one-acre plot of land.","그것은 각각 1에이커의 대지에 집을 가진 1,400가구가 살고 있는 4제곱마일의 공동체를 보여준다."]],"w":"8번 문장은 four square miles(4제곱마일)의 공동체이고, 각 가구가 one-acre plot(1에이커 대지)에 집을 가진다고 해요. cubic, floor, metric, hundred는 이 크기를 나타내는 말이 아니에요.","c":null},"h":"625272806e"}]},{"u":9,"id":"ms2-09-4","no":4,"ko":"From Ashes to Stones","items":[{"n":1,"t":"tf","q":"Justin Crowe came up with the idea of turning ashes into rocks after his grandfather died.","ko":"저스틴 크로우는 할아버지가 돌아가신 뒤 유골을 돌로 바꾸는 아이디어를 생각해 냈다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"After his grandfather died in 2015, he came up with the idea of turning ashes into beautiful rocks.","그의 할아버지가 2015년에 돌아가신 후, 그는 유골을 아름다운 돌로 바꾸는 아이디어를 생각해 냈다."]],"w":"4번 문장에 After his grandfather died in 2015, he came up with the idea of turning ashes into beautiful rocks라고 나와요.","c":"T"},"h":"3b39440c7f"},{"n":2,"t":"tf","q":"Most of the stones made by Parting Stone are dark green.","ko":"파팅 스톤이 만든 돌 대부분은 짙은 녹색이다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Most are white, but some are dark green or reddish-brown.","대부분은 흰색이지만, 일부는 짙은 녹색이나 붉은 갈색이다."]],"w":"10번 문장에서 대부분(Most)은 흰색이고, 일부(some)만 짙은 녹색이나 붉은 갈색이라고 해요.","c":"F"},"h":"516b8942d1"},{"n":3,"t":"tf","q":"The ashes are processed in a laboratory to remove impurities, including metals from medical implants.","ko":"유골은 의료용 삽입기기의 금속을 포함한 불순물을 제거하기 위해 실험실에서 처리된다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The ashes are first processed in a laboratory to remove any impurities, including metals from medical implants.","유골은 먼저 의료용 삽입기기의 금속을 포함한 불순물을 제거하기 위해 실험실에서 처리된다."]],"w":"6번 문장에 The ashes are first processed in a laboratory to remove any impurities, including metals from medical implants라고 나와요.","c":"T"},"h":"9002397c52"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Entrepreneur Justin Crowe wanted to add another option.)","ko":"기업가 저스틴 크로우는 또 다른 선택지를 추가하고 싶었다.","opts":["기업가","건축가","의사","교사"],"word":"Entrepreneur","r":{"a":"1) 기업가","ev":"3번 문장","s":[[3,"Entrepreneur Justin Crowe wanted to add another option.","기업가 저스틴 크로우는 또 다른 선택지를 추가하고 싶었다."]],"w":"3번의 Entrepreneur Justin Crowe는 새 선택지를 더하고 싶어 했고, 5번에서 회사 파팅 스톤을 세웠어요. 회사를 세워 사업을 하는 사람이라 entrepreneur = 기업가.","c":1},"h":"8402c6f22e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (And because they are just as hard as regular stones, they don’t break easily or dissolve in water.)","ko":"그리고 그것들은 평범한 돌만큼 단단하기 때문에 쉽게 부서지거나 물에 녹지 않는다.","opts":["얼다","흐르다","가라앉다","녹다"],"word":"dissolve","r":{"a":"4) 녹다","ev":"11번 문장","s":[[11,"And because they are just as hard as regular stones, they don’t break easily or dissolve in water.","그리고 그것들은 평범한 돌만큼 단단하기 때문에 쉽게 부서지거나 물에 녹지 않는다."]],"w":"11번은 완성된 돌이 단단해서 쉽게 부서지지 않고 물에도 '녹지' 않는다는 내용이에요. dissolve = 녹다, 용해되다.","c":4},"h":"4eb89d7129"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nSo in 2019, Crowe founded Parting Stone, a company that converts ashes into solid stones using a process similar to that used in making ceramics.","ko":"밑줄 친 that이 가리키는 것은?","sko":"그래서 2019년에, 크로우는 도자기 제작에 사용되는 것과 유사한 과정을 사용해 유골을 단단한 돌로 변환시키는 회사인 파팅 스톤을 설립했다.","opts":["유골","과정","회사","단단한 돌"],"r":{"a":"2) 과정","ev":"5번 문장","s":[[5,"So in 2019, Crowe founded Parting Stone, a company that converts ashes into solid stones using a process similar to that used in making ceramics.","그래서 2019년에, 크로우는 도자기 제작에 사용되는 것과 유사한 과정을 사용해 유골을 단단한 돌로 변환시키는 회사인 파팅 스톤을 설립했다."]],"w":"5번의 similar to that used in making ceramics에서 that은 바로 앞의 a process를 가리켜요. 도자기를 만들 때 쓰는 과정과 비슷한 과정을 사용한다는 뜻이에요.","c":2},"h":"0d1b5c4fe2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It seems there are few choices beyond visiting a cemetery or displaying an urn.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"묘지를 방문하거나 유골함을 전시하는 것 외에는 선택지가 거의 없는 것처럼 보인다.","opts":["묘지를 방문하거나 유골함을 전시하는 것 말고도 선택지가 매우 많은 것 같다.","묘지를 방문하거나 유골함을 전시하는 것 말고는 선택지가 거의 없는 것처럼 보인다.","묘지를 방문하는 것은 유골함을 전시하는 것보다 훨씬 흔한 선택이다.","유골함을 전시하려면 반드시 묘지를 방문해야 한다."],"r":{"a":"2) 묘지를 방문하거나 유골함을 전시하는 것 말고는 선택지가 거의 없는 것처럼 보인다.","ev":"2번 문장","s":[[2,"It seems there are few choices beyond visiting a cemetery or displaying an urn.","묘지를 방문하거나 유골함을 전시하는 것 외에는 선택지가 거의 없는 것처럼 보인다."]],"w":"few choices는 '선택지가 거의 없다'는 뜻이고, beyond ~ 는 '~ 외에는'이라는 뜻이에요. It seems ~ 는 '~인 것처럼 보인다'예요. 그래서 묘지 방문과 유골함 전시 말고는 선택지가 거의 없어 보인다는 말이에요.","c":2},"h":"bcf8285e10"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["완성된 돌은 모양과 크기가 독특할 뿐 아니라 색도 다양하다.","파팅 스톤이 만든 모든 돌은 똑같이 생겼다.","조각들은 특수 오븐에서 단단해지기 전에 광이 입혀진다.","크로우는 할아버지가 돌아가시기 전에 파팅 스톤을 설립했다."],"opts":["The finished stones are not only unique in shape and size but also different in color.","All stones made by Parting Stone look exactly the same.","The pieces are polished before they are hardened in a special oven.","Crowe founded Parting Stone before his grandfather died."],"r":{"a":"1) The finished stones are not only unique in shape and size but also different in color.","ev":"9번 문장","s":[[9,"The finished products are not only unique in terms of shape and size, but they also vary in color.","완성된 제품들은 모양과 크기 면에서 독특할 뿐만 아니라 색상도 다양하다."]],"w":"9번 문장에서 완성된 제품은 모양과 크기가 독특할 뿐 아니라 색도 다양하다고 해요. ②는 9번(독특하고 색도 다양함)과 반대이고, ③은 8번(단단하게 한 뒤 세척하고 광을 냄), ④는 4~5번(할아버지가 돌아가신 뒤 회사를 설립)과 달라요.","c":1},"h":"5e1053e9a1"},{"n":9,"t":"sum","q":"Parting Stone offers a new way to (A) loved ones by turning their ashes into stones that people can (B) forever.","ko":"파팅 스톤은 유골을 사람들이 영원히 (B)할 수 있는 돌로 만들어 사랑하는 사람들을 (A)하는 새로운 방법을 제공한다.","oko":["(A) 잊다 / (B) 간직","(A) 기억 / (B) 잃다","(A) 잊다 / (B) 잃다","(A) 기억 / (B) 간직","(A) 묻다 / (B) 간직"],"opts":["(A) forget / (B) hold","(A) remember / (B) lose","(A) forget / (B) lose","(A) remember / (B) hold","(A) bury / (B) hold"],"r":{"a":"4) (A) remember / (B) hold","ev":"1번, 12번 문장","s":[[1,"When loved ones pass away, how can we remember and cherish them?","사랑하는 사람들이 세상을 떠날 때, 우리는 어떻게 그들을 기억하고 소중히 여길 수 있을까?"],[12,"Thanks to technologies like Parting Stone’s, those who have lost their loved ones can now hold a small piece of them forever.","파팅 스톤과 같은 기술 덕분에, 사랑하는 자들을 잃은 사람들은 이제 그들의 작은 일부를 영원히 간직할 수 있다."]],"w":"1번은 사랑하는 사람들을 어떻게 기억하고(remember) 소중히 여길지 묻고, 12번은 파팅 스톤 덕분에 그들의 작은 일부를 영원히 간직할(hold) 수 있다고 답해요. 잊거나 잃거나 묻는다는 말은 본문과 맞지 않아요.","c":4},"h":"e05afdb3c3"},{"n":10,"t":"fill","q":"Next, a [A] is added to the ashes to create a clay-like [B] that can be shaped into stones.","ko":"다음으로, 유골에 [A]이(가) 첨가되어 돌 형태로 만들어질 수 있는 점토와 같은 [B]이(가) 만들어진다.","bank":["binder","material","impurity","oven","laboratory","cemetery"],"bko":{"binder":"결합제","material":"물질, 재료","impurity":"불순물","oven":"오븐","laboratory":"실험실","cemetery":"묘지"},"r":{"a":"[A] binder, [B] material","ev":"7번 문장","s":[[7,"Then a binder is added to create a clay-like material that can be shaped into stones.","그런 다음 돌 형태로 만들어질 수 있는 점토와 같은 물질을 만들기 위해 결합제가 첨가된다."]],"w":"7번 문장은 결합제(binder)를 넣어 돌로 만들 수 있는 점토 같은 재료(material)를 만든다는 내용이에요. 불순물(impurity)은 6번에서 오히려 제거하는 것이고, 오븐·실험실·묘지는 첨가하는 대상이 될 수 없어요.","c":null},"h":"b949597b09"}]},{"u":10,"id":"ms2-10-1","no":1,"ko":"잘 맞을수록 왜 더 싫어지지...?","items":[{"n":1,"t":"tf","q":"The music speeds up when the cat suddenly races after the mouse.","ko":"고양이가 갑자기 쥐를 쫓아 달리면 음악이 빨라진다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"As the cat suddenly races after the mouse, the music speeds up, matching the action on screen.","고양이가 갑자기 쥐를 쫓아 달리면서, 음악은 빨라지고, 화면 위의 동작과 일치한다."]],"w":"3번 문장에서 고양이가 갑자기 쥐를 쫓아 달리면(races after) 음악이 빨라진다(speeds up)고 해요.","c":"T"},"h":"d2de3d754c"},{"n":2,"t":"tf","q":"Walt Disney productions invented the technique in the late 1920s.","ko":"월트 디즈니 제작사는 1920년대 후반에 그 기법을 처음 만들어 냈다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The technique was popularized by Walt Disney productions in the late 1920s, though similar synchronization methods appeared in earlier animated films as well.","이 기법은 1920년대 후반에 월트 디즈니 제작사에 의해 대중화되었지만, 비슷한 동기화 방법들은 앞선 애니메이션 영화들에서도 등장하였다."]],"w":"5번 문장에서 디즈니는 이 기법을 '대중화했다(popularized)'고 했고, 비슷한 방법이 앞선 애니메이션 영화에도 있었다고 해요. 처음 만든 것이 아니에요.","c":"F"},"h":"9ef5f31dfe"},{"n":3,"t":"tf","q":"Directors today prefer dialogue and other elements to convey characters’ emotions.","ko":"오늘날의 감독들은 등장인물의 감정을 전하기 위해 대화와 다른 요소들을 선호한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Accordingly, directors today prefer to use dialogue and other elements to convey characters’ emotions.","따라서, 오늘날의 감독들은 등장인물들의 감정을 전달하기 위해 대화와 다른 요소들을 사용하는 것을 선호한다."]],"w":"11번 문장에 directors today prefer to use dialogue and other elements가 그대로 있어요.","c":"T"},"h":"de64c6e604"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Each slow step is accompanied by a single drumbeat.)","ko":"각각의 느린 발걸음은 한 번의 드럼 비트가 동반된다.","opts":["방해된다","대체된다","동반된다","설명된다"],"word":"accompanied","r":{"a":"3) 동반된다","ev":"2번 문장","s":[[2,"Each slow step is accompanied by a single drumbeat.","각각의 느린 발걸음은 한 번의 드럼 비트가 동반된다."]],"w":"느린 발걸음마다 드럼 소리가 한 번씩 함께 나는 장면이에요. accompany는 '함께 따라가다, 동반하다'라서 is accompanied는 '동반된다'예요.","c":3},"h":"a049c48740"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…added dramatic, intense, or humorous effects that complemented the on-screen action…)","ko":"…화면 위 동작을 보완하는 극적이고, 강렬하거나, 유머러스한 효과를 더하는…","opts":["보완했다","방해했다","대체했다","반복했다"],"word":"complemented","r":{"a":"1) 보완했다","ev":"6번 문장","s":[[6,"Filmmakers liked how it added dramatic, intense, or humorous effects that complemented the on-screen action in animated and live-action movies.","영화 제작자들은 이것이 애니메이션과 실사 영화에서 화면 위 동작을 보완하는 극적이고, 강렬하거나, 유머러스한 효과를 더하는 방식을 좋아했다."]],"w":"효과를 더한 목적은 화면 속 동작을 더 살려 주는 것이에요. complement(보완하다)는 부족한 부분을 채워 더 좋게 만든다는 뜻이라 '보완했다'가 맞아요.","c":1},"h":"8a7c317307"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nFor audiences watching a film, it helped them engage with a scene.","ko":"밑줄 친 them이 가리키는 것은?","sko":"영화를 보는 관객들에게, 그것은 그들이 장면에 몰입하도록 도왔다.","opts":["등장인물들","영화 제작자들","영화 속 고양이와 쥐","영화를 보는 관객들"],"r":{"a":"4) 영화를 보는 관객들","ev":"7번 문장","s":[[7,"For audiences watching a film, it helped them engage with a scene.","영화를 보는 관객들에게, 그것은 그들이 장면에 몰입하도록 도왔다."]],"w":"같은 문장 앞쪽의 audiences watching a film(영화를 보는 관객들)을 them으로 받았어요. 장면에 몰입하도록 도움을 받는 사람은 관객이에요.","c":4},"h":"b406d6576f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Despite this, some modern films occasionally feature this technique to add tension or comedic relief.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그럼에도 불구하고, 일부 현대 영화들은 긴장감이나 희극적 완화를 더하기 위해 때때로 이 기법을 특징으로 삼는다.","opts":["그럼에도 일부 현대 영화는 긴장감이나 희극적 효과를 위해 가끔 이 기법을 쓴다.","그래서 현대 영화는 이 기법을 더 이상 전혀 쓰지 않는다.","그럼에도 모든 현대 영화는 이 기법을 항상 쓴다.","현대 영화는 긴장감을 없애기 위해 이 기법을 비판한다."],"r":{"a":"1) 그럼에도 일부 현대 영화는 긴장감이나 희극적 효과를 위해 가끔 이 기법을 쓴다.","ev":"12번 문장","s":[[12,"Despite this, some modern films occasionally feature this technique to add tension or comedic relief.","그럼에도 불구하고, 일부 현대 영화들은 긴장감이나 희극적 완화를 더하기 위해 때때로 이 기법을 특징으로 삼는다."]],"w":"Despite this는 '그럼에도 불구하고', some은 '일부', occasionally는 '때때로'예요. 전혀 안 쓴다(②)거나 모두 항상 쓴다(③)는 말은 아니에요.","c":1},"h":"a4ba32ead8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["미키 마우징은 실사 영화에서만 사용되었다.","음악은 관객의 주의를 등장인물의 감정에서 멀어지게 했다.","음악은 관객이 핵심 줄거리와 등장인물의 감정에 주목하도록 도왔는데, 말이 없는 장면에서 특히 그러했다.","오늘날의 감독들은 모든 영화에서 감정을 전하려고 미키 마우징을 쓴다."],"opts":["Mickey Mousing was used only in live-action movies.","The music pulled the audience’s attention away from the characters’ emotions.","The music helped the audience notice key story details and the characters’ emotions, especially in non-verbal scenes.","Directors today use Mickey Mousing in every film to convey emotions."],"r":{"a":"3) The music helped the audience notice key story details and the characters’ emotions, especially in non-verbal scenes.","ev":"8번 문장","s":[[8,"The music guided their attention to key narrative details and to the characters’ emotional states, especially during non-verbal sequences.","음악은 그들의 주의를 핵심 서사의 세부사항과 등장인물들의 감정 상태로 인도했는데, 비언어적 장면들에서는 특히 그러했다."]],"w":"8번에서 음악이 관객의 주의를 핵심 줄거리와 등장인물의 감정으로 이끌었고, 비언어적 장면에서 특히 그러했다고 해요. ①은 6번(애니메이션과 실사 모두), ②는 방향이 반대, ④는 11~12번(대화를 선호하고 일부만 가끔 사용)과 달라요.","c":3},"h":"fb7dbd9e35"},{"n":9,"t":"sum","q":"The technique of (A) music to on-screen action is (B) as “Mickey Mousing.”","ko":"음악을 화면 위 동작에 (A)하는 이 기법은 ‘미키 마우징’으로 (B) 있다.","oko":["(A) 동기화 / (B) 알려져","(A) 동기화 / (B) 팔려","(A) 녹음 / (B) 알려져","(A) 녹음 / (B) 팔려","(A) 무시 / (B) 팔려"],"opts":["(A) synchronizing / (B) known","(A) synchronizing / (B) sold","(A) recording / (B) known","(A) recording / (B) sold","(A) ignoring / (B) sold"],"r":{"a":"1) (A) synchronizing / (B) known ((A) 동기화 / (B) 알려져)","ev":"4번 문장","s":[[4,"This technique of synchronizing music to on-screen action is known as “Mickey Mousing.”","음악을 화면 위 동작에 동기화하는 이 기법은 ‘미키 마우징’으로 알려져 있다."]],"w":"4번에서 음악을 화면 위 동작에 동기화하는(synchronizing) 이 기법은 ‘미키 마우징’으로 알려져(known) 있다고 해요.","c":1},"h":"5a80d4a658"},{"n":10,"t":"fill","q":"Mickey Mousing was criticized because every action and feeling was matched too [A] with the music, leaving little room for [B].","ko":"미키 마우징은 모든 행동과 감정이 음악과 너무 [A] 일치되어 [B]의 여지를 거의 남기지 않는다고 비판받았다.","bank":["obviously","interpretation","suddenly","overuse","humorous","intense"],"bko":{"obviously":"뻔하게, 명백하게","interpretation":"해석","suddenly":"갑자기","overuse":"남용","humorous":"유머러스한","intense":"강렬한"},"r":{"a":"[A] obviously, [B] interpretation","ev":"10번 문장","s":[[10,"They argued that this technique undermined the depth and subtlety of storytelling, as every action and feeling is matched too obviously with the music, leaving little room for interpretation or nuance.","그들은 이 기법이 스토리텔링의 깊이와 미묘함을 약화시켰다고 주장했는데, 모든 행동과 감정이 음악과 너무 명백하게 일치되어 해석이나 뉘앙스의 여지를 거의 남기지 않기 때문이다."]],"w":"10번 문장 as every action and feeling is matched too obviously with the music, leaving little room for interpretation or nuance에서 가져왔어요. [A]는 동사 matched를 꾸미는 부사 자리라 obviously, [B]는 room for 뒤의 명사 자리라 interpretation이에요. 나머지 단어는 부사·명사 자리에 의미가 맞지 않아요.","c":null},"h":"5887b3b3c8"}]},{"u":10,"id":"ms2-10-2","no":2,"ko":"길은 찾았는데 내 뇌는 길을 잃었네?","items":[{"n":1,"t":"tf","q":"After training, the London taxi drivers’ hippocampus grew larger.","ko":"훈련 후 런던 택시 운전사들의 해마는 더 커졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"After training, the drivers exhibited an increase in hippocampal size.","훈련 후, 운전사들은 해마 크기의 증가를 보였다."]],"w":"9번 문장에 the drivers exhibited an increase in hippocampal size(해마 크기의 증가를 보였다)라고 해요.","c":"T"},"h":"3acc1f209d"},{"n":2,"t":"tf","q":"Before training, the taxi drivers’ hippocampus was already much larger than an average person’s.","ko":"훈련 전에 택시 운전사들의 해마는 이미 보통 사람의 것보다 훨씬 컸다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Before beginning training, each driver’s hippocampus was comparable in size to that of an average person.","훈련을 시작하기 전에, 각 운전사의 해마는 평균적인 사람의 것과 크기가 비슷했다."]],"w":"7번 문장에서 훈련 전에는 해마가 평균적인 사람의 것과 크기가 비슷했다(comparable in size)고 해요. 훨씬 컸다는 말은 없어요.","c":"F"},"h":"d9fccbc760"},{"n":3,"t":"tf","q":"Some scientists think that a smaller hippocampus can protect against Alzheimer’s.","ko":"일부 과학자들은 더 작은 해마가 알츠하이머병을 막아 준다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Since Alzheimer’s often begins by affecting the hippocampus, some scientists theorize that a larger or stronger hippocampus might offer some protection against the progression of the disease.","알츠하이머병이 종종 해마에 영향을 미침으로써 시작되기 때문에, 일부 과학자들은 더 크거나 더 강한 해마가 질병의 진행에 대해 어느 정도 보호를 제공할 수 있을 것이라는 이론을 제시한다."]],"w":"11번 문장에서 과학자들은 '더 크거나 더 강한(larger or stronger)' 해마가 보호를 제공할 수 있다고 해요. 작은 해마가 아니라 반대예요.","c":"F"},"h":"4afd0fe704"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This was demonstrated in an observational study of aspiring London taxi drivers.)","ko":"이것은 런던 택시 운전사 지망생들에 대한 관찰 연구에서 입증되었다.","opts":["숨겨졌다","입증되었다","반박되었다","잊혀졌다"],"word":"demonstrated","r":{"a":"2) 입증되었다","ev":"6번 문장","s":[[6,"This was demonstrated in an observational study of aspiring London taxi drivers.","이것은 런던 택시 운전사 지망생들에 대한 관찰 연구에서 입증되었다."]],"w":"6번은 4~5번 내용(길 찾기 연습이 해마를 자극함)이 연구로 확인되었다는 말이에요. demonstrate는 '증명하다, 입증하다'라서 was demonstrated는 '입증되었다'예요.","c":2},"h":"3efff2f856"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (After training, the drivers exhibited an increase in hippocampal size.)","ko":"훈련 후, 운전사들은 해마 크기의 증가를 보였다.","opts":["줄였다","숨겼다","막았다","보였다"],"word":"exhibited","r":{"a":"4) 보였다","ev":"9번 문장","s":[[9,"After training, the drivers exhibited an increase in hippocampal size.","훈련 후, 운전사들은 해마 크기의 증가를 보였다."]],"w":"훈련 뒤 해마가 커진 결과를 드러냈다는 뜻이에요. exhibit은 '(모습·결과를) 보이다'라서 exhibited an increase는 '증가를 보였다'예요.","c":4},"h":"3448b3a04b"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nRecently, researchers have begun studying self-guided navigation as a way to prevent cognitive diseases like Alzheimer’s, which damages tissue and causes early symptoms of disorientation and memory loss.","ko":"밑줄 친 which가 가리키는 것은?","sko":"최근, 연구자들은 자기 주도적 길 찾기를 조직을 손상시키고 방향 감각 상실과 기억 상실의 초기 증상을 일으키는 병인 알츠하이머병과 같은 인지 질환을 예방하는 방법으로 연구하기 시작했다.","opts":["알츠하이머병","자기 주도적 길 찾기","연구자들","조직"],"r":{"a":"1) 알츠하이머병","ev":"10번 문장","s":[[10,"Recently, researchers have begun studying self-guided navigation as a way to prevent cognitive diseases like Alzheimer’s, which damages tissue and causes early symptoms of disorientation and memory loss.","최근, 연구자들은 자기 주도적 길 찾기를 조직을 손상시키고 방향 감각 상실과 기억 상실의 초기 증상을 일으키는 병인 알츠하이머병과 같은 인지 질환을 예방하는 방법으로 연구하기 시작했다."]],"w":"10번에서 which 뒤의 동사 damages(손상시킨다)와 causes(일으킨다)는 단수 주어를 받아요. 조직을 손상시키고 방향 감각 상실과 기억 상실을 일으키는 것은 Alzheimer’s(알츠하이머병)예요.","c":1,"k":"which = 알츠하이머병"},"pron":"which","h":"5caa72a2a8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This process takes very little effort compared to the past, when going to an unfamiliar place meant checking a map, learning streets and landmarks, and remembering directions from others.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 과정은 과거와 비교해 매우 적은 노력을 필요로 하는데, 그때는 익숙하지 않은 장소로 가는 것이 지도를 확인하고, 거리와 랜드마크를 익히고, 다른 사람들로부터의 길 안내를 기억하는 것을 의미했다.","opts":["과거에는 낯선 곳에 가려면 지도를 확인하고 거리를 익히고 길 안내를 기억해야 했다.","과거에는 낯선 곳에 가는 데 노력이 거의 필요 없었지만 지금은 많이 필요하다.","과거와 비교하면 지금은 지도를 확인하는 데 시간이 더 많이 든다.","낯선 곳에 갈 때 다른 사람의 길 안내만 들으면 충분했다."],"r":{"a":"1) 과거에는 낯선 곳에 가려면 지도를 확인하고 거리를 익히고 길 안내를 기억해야 했다.","ev":"2번 문장","s":[[2,"This process takes very little effort compared to the past, when going to an unfamiliar place meant checking a map, learning streets and landmarks, and remembering directions from others.","이 과정은 과거와 비교해 매우 적은 노력을 필요로 하는데, 그때는 익숙하지 않은 장소로 가는 것이 지도를 확인하고, 거리와 랜드마크를 익히고, 다른 사람들로부터의 길 안내를 기억하는 것을 의미했다."]],"w":"compared to the past는 '과거와 비교해', meant 뒤 세 가지(지도 확인, 거리·랜드마크 익히기, 길 안내 기억)가 예전 방식이에요. 지금은 노력이 아주 적게 든다는 말이라 ②는 반대예요.","c":1},"h":"42dc3a1963"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["런던 택시 운전사 지망생들은 시험을 4개월 동안 준비했다.","해마는 공간 기억과 정신적 지도 만들기를 담당하는 뇌의 영역이다.","정신적 지도 만들기를 연습하면 해마의 활동이 줄어든다.","연구자들은 자기 주도적 길 찾기 연구를 그만두었다."],"opts":["The London taxi drivers prepared for the test for four months.","The hippocampus is the region of the brain responsible for spatial memory and mental mapping.","Practicing mental mapping lowers activity in the hippocampus.","Researchers have stopped studying self-guided navigation."],"r":{"a":"2) The hippocampus is the region of the brain responsible for spatial memory and mental mapping.","ev":"4번 문장","s":[[4,"For example, the hippocampus is the region of the brain responsible for spatial memory and mental mapping, which can be developed through independent navigation.","해마는 공간 기억과 정신적 지도 만들기를 담당하는 뇌의 영역인데, 이 능력은 독립적인 길 찾기를 통해 발달될 수 있다."]],"w":"4번 문장에 the hippocampus is the region of the brain responsible for spatial memory and mental mapping이 그대로 있어요. ①은 8번(4년), ③은 5번(활동을 자극), ④는 10번(연구를 시작했다)과 달라요.","c":2},"h":"3db81c7ec0"},{"n":9,"t":"sum","q":"Nowadays, when we want to go somewhere new, we simply (A) the (B) into a GPS device.","ko":"오늘날, 우리가 어딘가 새로운 곳에 가고자 할 때, 우리는 단순히 (B)을(를) GPS 기기에 (A)한다.","oko":["(A) 입력 / (B) 목적지","(A) 입력 / (B) 배터리","(A) 은닉 / (B) 목적지","(A) 은닉 / (B) 배터리","(A) 판매 / (B) 배터리"],"opts":["(A) enter / (B) destination","(A) enter / (B) battery","(A) hide / (B) destination","(A) hide / (B) battery","(A) sell / (B) battery"],"r":{"a":"1) (A) enter / (B) destination ((A) 입력 / (B) 목적지)","ev":"1번 문장","s":[[1,"Nowadays, when we want to go somewhere new, we simply enter the destination into a GPS device.","오늘날, 우리가 어딘가 새로운 곳에 가고자 할 때, 우리는 단순히 목적지를 GPS 기기에 입력한다."]],"w":"1번에서 오늘날 우리는 어딘가 새로운 곳에 가고자 할 때 목적지(destination)를 GPS 기기에 입력한다(enter)고 해요.","c":1},"h":"e9f9f85222"},{"n":10,"t":"fill","q":"Although [A] and inconvenient, navigating without using a GPS can [B] the health of our brain.","ko":"비록 [A] 불편하지만, GPS를 사용하지 않고 길을 찾는 것은 우리의 뇌의 건강을 [B] 수 있다.","bank":["time-consuming","improve","prevent","memorize","taxi","efficiently"],"bko":{"time-consuming":"시간이 많이 들고","improve":"향상시키다","prevent":"예방하다","memorize":"암기하다","taxi":"택시","efficiently":"효율적으로"},"r":{"a":"[A] time-consuming (시간이 많이 들고), [B] improve (향상시키다)","ev":"3번 문장","s":[[3,"Although time-consuming and inconvenient, navigating without using a GPS can improve the health of our brain.","비록 시간이 소요되고 불편하지만, GPS를 사용하지 않고 길을 찾는 것은 우리의 뇌의 건강을 향상시킬 수 있다."]],"w":"3번은 GPS 없이 길을 찾는 것이 시간이 많이 들고(time-consuming) 불편하지만 뇌의 건강을 향상시킬(improve) 수 있다는 내용이에요. 나머지 단어는 이 빈칸에 넣으면 뜻이나 문법이 맞지 않아요.","c":null},"h":"06ee90cde8"}]},{"u":10,"id":"ms2-10-3","no":3,"ko":"벽을 쳐서 벽을 허무는 게임?!","items":[{"n":1,"t":"tf","q":"Padel is played by more than 25 million people in over 100 countries.","ko":"빠델은 100개 이상의 국가에서 2,500만 명 이상의 사람들이 즐긴다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Invented in Mexico in 1969, padel is now one of the fastest-growing sports globally, played by over 25 million people across more than 100 countries!","1969년 멕시코에서 만들어진 빠델은 현재 전 세계적으로 가장 빠르게 성장하는 스포츠 중 하나이며, 100개 이상의 국가에서 2,500만 명 이상의 사람들이 즐기고 있다!"]],"w":"3번 문장에 played by over 25 million people across more than 100 countries가 그대로 있어요.","c":"T"},"h":"755df469bf"},{"n":2,"t":"tf","q":"A padel court is larger than a regular doubles tennis court.","ko":"빠델 코트는 일반 복식 테니스 코트보다 크다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"A padel court is about three-quarters the size of a regular doubles tennis court, and it is enclosed by glass walls and metal mesh fencing.","빠델 코트는 일반 복식 테니스 코트 크기의 약 4분의 3 정도이며, 그 코트는 유리 벽과 금속 메시 울타리로 둘러싸여 있다."]],"w":"7번 문장에서 빠델 코트는 일반 복식 테니스 코트 크기의 약 4분의 3(three-quarters)이라고 해요. 더 작아요.","c":"F"},"h":"3f2aa1a6e8"},{"n":3,"t":"tf","q":"Padel clubs welcome only players with high skill levels.","ko":"빠델 클럽은 실력이 높은 선수들만 환영한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Furthermore, padel clubs have developed a reputation for their laid-back, inclusive atmosphere, welcoming players regardless of their skill levels to have a good time.","더욱이, 빠델 클럽들은 실력 수준에 상관없이 선수들이 즐거운 시간을 보낼 수 있도록 환영하는 편안하고 포용적인 분위기로 명성을 쌓아왔다."]],"w":"10번 문장에서 클럽은 실력 수준에 상관없이(regardless of their skill levels) 선수들을 환영한다고 해요.","c":"F"},"h":"6df5ce1bed"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…players use their padel rackets to bounce the ball against the walls and floor…)","ko":"…선수들이 빠델 라켓을 사용하여 벽과 바닥에 공을 튀기면서…","opts":["멈추다","잡다","튀기다","숨기다"],"word":"bounce","r":{"a":"3) 튀기다","ev":"5번 문장","s":[[5,"As players use their padel rackets to bounce the ball against the walls and floor, the action is fast-paced and thrilling.","선수들이 빠델 라켓을 사용하여 벽과 바닥에 공을 튀기면서, 그 동작은 빠른 속도로 진행되고 스릴이 넘친다."]],"w":"공을 벽과 바닥에 맞혀서 계속 움직이게 하는 경기예요. bounce는 '튀기다, 튕기다'라서 bounce the ball against the walls는 '벽에 공을 튀기다'예요.","c":3},"h":"a228ad848b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…it is enclosed by glass walls and metal mesh fencing.)","ko":"…그 코트는 유리 벽과 금속 메시 울타리로 둘러싸여 있다.","opts":["열려 있다","둘러싸여 있다","낮아져 있다","나뉘어 있다"],"word":"enclosed","r":{"a":"2) 둘러싸여 있다","ev":"7번 문장","s":[[7,"A padel court is about three-quarters the size of a regular doubles tennis court, and it is enclosed by glass walls and metal mesh fencing.","빠델 코트는 일반 복식 테니스 코트 크기의 약 4분의 3 정도이며, 그 코트는 유리 벽과 금속 메시 울타리로 둘러싸여 있다."]],"w":"코트 둘레에 유리 벽과 철망 울타리가 있다는 말이에요. enclose는 '둘러싸다'라서 is enclosed by는 '~로 둘러싸여 있다'예요.","c":2},"h":"dfa0880e70"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is usually played with two players on each team, and the teammates often chat and joke with each other as well as their opponents.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 보통 각 팀에 두 명의 선수가 출전하며, 팀원들은 종종 서로뿐만 아니라 그들의 상대방과도 대화하고 농담을 주고받는다.","opts":["사교적 요소","한 팀","테니스","빠델"],"r":{"a":"4) 빠델","ev":"8~9번 문장","s":[[8,"People are also attracted to the social element of padel.","사람들은 또한 빠델의 사교적 요소에 빠져든다."],[9,"It is usually played with two players on each team, and the teammates often chat and joke with each other as well as their opponents.","그것은 보통 각 팀에 두 명의 선수가 출전하며, 팀원들은 종종 서로뿐만 아니라 그들의 상대방과도 대화하고 농담을 주고받는다."]],"w":"8번에서 빠델의 사교적 요소를 말하고, 9번 It is usually played with two players on each team에서 '경기를 하는' 것은 빠델이에요. 사교적 요소는 경기를 하는 대상이 아니에요.","c":4},"h":"e02ed70bdf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The ball never seems to stop moving around the tiny court!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"공은 작은 코트 주변에서 결코 움직임을 멈추지 않는 것처럼 보인다!","opts":["공은 작은 코트 안에서 쉬지 않고 계속 움직이는 것처럼 보인다.","공은 코트 밖으로 자주 나가 버리는 것처럼 보인다.","코트가 작아서 공이 거의 움직이지 않는 것처럼 보인다.","공이 한 번 멈추면 다시는 움직이지 않는 것처럼 보인다."],"r":{"a":"1) 공은 작은 코트 안에서 쉬지 않고 계속 움직이는 것처럼 보인다.","ev":"6번 문장","s":[[6,"The ball never seems to stop moving around the tiny court!","공은 작은 코트 주변에서 결코 움직임을 멈추지 않는 것처럼 보인다!"]],"w":"never seems to stop moving은 '결코 멈추지 않고 움직이는 것처럼 보인다'는 뜻이에요. 작은 코트(tiny court) 안에서 공이 계속 오가는 모습을 말해요.","c":1},"h":"751ff73090"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["글쓴이는 새로운 스포츠를 찾고 있다면 빠델의 세계에 합류해 보라고 권한다.","글쓴이는 빠델이 초보자에게 너무 어렵다고 말한다.","글쓴이는 모든 사람이 빠델을 그만해야 한다고 말한다.","글쓴이는 테니스가 빠델보다 더 좋은 스포츠라고 말한다."],"opts":["The writer suggests joining the world of padel if you are looking for a new sport.","The writer says padel is too difficult for beginners.","The writer says everyone should stop playing padel.","The writer says tennis is a better sport than padel."],"r":{"a":"1) The writer suggests joining the world of padel if you are looking for a new sport. (글쓴이는 새로운 스포츠를 찾고 있다면 빠델의 세계에 합류해 보라고 권한다.)","ev":"11번 문장","s":[[11,"If you are looking for a new sport, consider joining the world of padel.","만약 당신이 새로운 스포츠를 찾고 있다면, 빠델의 세계에 합류하는 것을 고려해보라."]],"w":"11번에서 글쓴이는 새로운 스포츠를 찾고 있다면 빠델의 세계에 합류하는 것을 고려해 보라고 해요. 초보자에게 어렵다거나 그만해야 한다는 말, 테니스가 더 낫다는 말은 본문에 없어요.","c":1},"h":"d8d52fd516"},{"n":9,"t":"sum","q":"Padel’s popularity is growing because the game is (A) and the sport offers a (B) experience.","ko":"빠델의 인기는 경기가 (A)하고 이 스포츠가 (B)한 경험을 주기 때문에 커지고 있다.","oko":["(A) 느리고 / (B) 사교적인","(A) 짜릿하고 / (B) 외로운","(A) 느리고 / (B) 외로운","(A) 비싸고 / (B) 경쟁적인","(A) 짜릿하고 / (B) 사교적인"],"opts":["(A) slow / (B) social","(A) thrilling / (B) lonely","(A) slow / (B) lonely","(A) expensive / (B) competitive","(A) thrilling / (B) social"],"r":{"a":"5) (A) thrilling / (B) social","ev":"4~5, 8~9번 문장","s":[[4,"One reason for its explosive rise in popularity is that it is incredibly exciting both to play and to watch.","폭발적인 인기 상승의 한 이유는 그것이 플레이하고 관람하는 데 모두 엄청나게 흥미롭다는 것이다."],[5,"As players use their padel rackets to bounce the ball against the walls and floor, the action is fast-paced and thrilling.","선수들이 빠델 라켓을 사용하여 벽과 바닥에 공을 튀기면서, 그 동작은 빠른 속도로 진행되고 스릴이 넘친다."],[8,"People are also attracted to the social element of padel.","사람들은 또한 빠델의 사교적 요소에 빠져든다."],[9,"It is usually played with two players on each team, and the teammates often chat and joke with each other as well as their opponents.","그것은 보통 각 팀에 두 명의 선수가 출전하며, 팀원들은 종종 서로뿐만 아니라 그들의 상대방과도 대화하고 농담을 주고받는다."]],"w":"5번에서 경기가 빠르고 스릴이 넘친다(thrilling)고 하고, 8~9번에서 팀원·상대와 대화하고 농담하는 사교적(social) 요소에 끌린다고 해요. slow, lonely, expensive, competitive는 본문과 반대이거나 근거가 없어요.","c":5},"h":"3ff105c3df"},{"n":10,"t":"fill","q":"You’re sure to make new [A] while you enjoy this [B] game.","ko":"당신은 이 [B] 게임을 즐기는 동안 반드시 새로운 [A]을(를) 만들게 될 것이다.","bank":["friends","exciting","incredibly","usually","regardless","bounce"],"bko":{"friends":"친구들","exciting":"흥미진진한","incredibly":"엄청나게","usually":"보통","regardless":"상관없이","bounce":"튀기다"},"r":{"a":"[A] friends (친구들), [B] exciting (흥미진진한)","ev":"12번 문장","s":[[12,"You’re sure to make new friends while you enjoy this exciting game.","당신은 이 흥미진진한 게임을 즐기는 동안 반드시 새로운 친구들을 만들게 될 것이다."]],"w":"12번은 이 흥미진진한(exciting) 게임을 즐기는 동안 반드시 새로운 친구들(friends)을 만들게 될 것이라는 내용이에요. 나머지 단어는 이 빈칸에 넣으면 뜻이나 문법이 맞지 않아요.","c":null},"h":"e62d001d11"}]},{"u":10,"id":"ms2-10-4","no":4,"ko":"A Name Worth Cutting Out","items":[{"n":1,"t":"tf","q":"People began making inexpensive portraits by cutting out profiles from black paper.","ko":"사람들은 검은 종이에서 옆모습을 오려내어 저렴한 초상화를 만들기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"His connection to the silhouette art form arose when people began creating simple, inexpensive portraits by cutting out profiles from black paper.","실루엣 예술 형식과 그의 연결은 사람들이 검은 종이에서 옆모습을 오려내어 단순하고 저렴한 초상화를 만들기 시작했을 때 발생했다."]],"w":"7번 문장에 people began creating simple, inexpensive portraits by cutting out profiles from black paper가 그대로 있어요.","c":"T"},"h":"9f7696eedb"},{"n":2,"t":"tf","q":"Étienne de Silhouette was popular because of his cost-cutting measures.","ko":"Étienne de Silhouette는 비용 절감 조치 덕분에 인기가 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"He was notorious for his cost-cutting measures during a period of economic struggle, which led to his unpopularity.","그는 경제적 어려움의 시기 동안 그의 비용 절감 조치로 악명이 높았는데, 그것은 그의 인기 없음으로 이어졌다."]],"w":"5번 문장에서 그는 비용 절감 조치로 악명이 높았고(notorious) 그것이 인기 없음(unpopularity)으로 이어졌다고 해요.","c":"F"},"h":"a72b798d26"},{"n":3,"t":"tf","q":"Professional shadow portrait artists only worked in one city.","ko":"전문 그림자 초상화 예술가들은 한 도시에서만 일했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Soon, professional shadow portrait artists emerged, either touring Europe and America or opening their own studios in cities.","곧, 전문적인 그림자 초상화 예술가들이 등장하였고, 유럽과 미국을 순회하거나 도시에 자신들의 스튜디오를 열었다."]],"w":"8번 문장에서 예술가들은 유럽과 미국을 순회하거나(touring) 여러 도시에 스튜디오를 열었다고 해요. 한 도시에서만 일했다는 말은 없어요.","c":"F"},"h":"b588456aeb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He was notorious for his cost-cutting measures during a period of economic struggle…)","ko":"그는 경제적 어려움의 시기 동안 그의 비용 절감 조치로 악명이 높았는데…","opts":["악명 높은","존경받는","인기 많은","부유한"],"word":"notorious","r":{"a":"1) 악명 높은","ev":"5번 문장","s":[[5,"He was notorious for his cost-cutting measures during a period of economic struggle, which led to his unpopularity.","그는 경제적 어려움의 시기 동안 그의 비용 절감 조치로 악명이 높았는데, 그것은 그의 인기 없음으로 이어졌다."]],"w":"뒤에 which led to his unpopularity(인기 없음으로 이어졌다)가 오므로 나쁜 쪽으로 유명했다는 뜻이에요. notorious는 '악명 높은'이에요.","c":1},"h":"a2fd021457"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Soon, professional shadow portrait artists emerged…)","ko":"곧, 전문적인 그림자 초상화 예술가들이 등장하였고…","opts":["사라졌다","돌아갔다","등장했다","싸웠다"],"word":"emerged","r":{"a":"3) 등장했다","ev":"8번 문장","s":[[8,"Soon, professional shadow portrait artists emerged, either touring Europe and America or opening their own studios in cities.","곧, 전문적인 그림자 초상화 예술가들이 등장하였고, 유럽과 미국을 순회하거나 도시에 자신들의 스튜디오를 열었다."]],"w":"7번에서 사람들이 초상화를 만들기 시작한 뒤, 곧 전문 예술가가 생겨났다는 흐름이에요. emerge는 '나타나다, 등장하다'라서 emerged는 '등장했다'예요.","c":3},"h":"83b3952f40"},{"n":6,"t":"ref","q":"What does the underlined \"these artists\" refer to?\nUsing just scissors and paper, these artists could create incredibly accurate profile images known as silhouettes.","ko":"밑줄 친 these artists가 가리키는 것은?","sko":"단지 가위와 종이를 이용해서, 이 예술가들은 실루엣이라고 알려진 믿을 수 없을 정도로 정확한 옆모습 이미지를 만들 수 있었다.","opts":["그림자 초상화 예술가들","사진사들","재무장관들","실루엣들"],"r":{"a":"1) 그림자 초상화 예술가들","ev":"3번 문장","s":[[3,"Using just scissors and paper, these artists could create incredibly accurate profile images known as silhouettes.","단지 가위와 종이를 이용해서, 이 예술가들은 실루엣이라
