<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>능률 1316 Reading 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"nl2-01-1","no":1,"ko":"영어에도 줄임말이 있어","items":[{"n":1,"t":"tf","q":"An acronym is made from the first letters of the words in a phrase.","ko":"두문자어는 구절 속 단어들의 첫 글자로 만들어진다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Acronyms are made up of the first letters of the words in a phrase or a sentence.","두문자어는 구절이나 문장의 첫 번째 글자들로 구성된다."]],"w":"4번 문장에서 두문자어는 구절이나 문장 속 단어들의 첫 글자로 구성된다(are made up of the first letters)고 해요. 첫 글자로 만든다는 내용과 맞아요.","c":"T"},"h":"c3d00e6bd7"},{"n":2,"t":"tf","q":"Acronyms are rarely used in text messages.","ko":"두문자어는 문자 메시지에 거의 쓰이지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Acronyms are commonly used online and in text messages.","두문자어는 온라인이나 문자 메시지에 흔히 사용된다."]],"w":"7번 문장에서 두문자어는 온라인이나 문자 메시지에 흔히(commonly) 쓰인다고 해요. '거의 쓰이지 않는다'는 반대 내용이에요.","c":"F"},"h":"c8bce1e22e"},{"n":3,"t":"tf","q":"The person who answers the question likes Bruno Mars.","ko":"질문에 대답하는 사람은 Bruno Mars를 좋아한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10~11번 문장","s":[[10,"Who is your favorite singer?","네가 가장 좋아하는 가수는 누구야?"],[11,"TBH, I like Bruno Mars.","THB(솔직히 말해서), 나는 Bruno Mars(브루노 마스)를 좋아해."]],"w":"10번에서 가장 좋아하는 가수를 물었고, 11번에서 대답하는 사람이 TBH, I like Bruno Mars(솔직히 나는 브루노 마스를 좋아해)라고 해요.","c":"T"},"h":"abf0d28129"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Are you confused by the words TBH, GOAT, and so on?)","ko":"TBH, GOAT 등의 단어들로 인해 ____가? (밑줄 친 단어의 뜻은?)","word":"confused","opts":["행복해하는","피곤해하는","혼란스러워하는","화가 난"],"r":{"a":"3) 혼란스러워하는","ev":"2번 문장","s":[[2,"Are you confused by the words TBH, GOAT, and so on?","TBH, GOAT 등의 단어들로 인해 혼란스러운가?"]],"w":"2번 문장은 낯선 줄임말 때문에 헷갈리지 않느냐고 묻고 있어요. confused = 혼란스러워하는, 헷갈리는이에요.","c":3},"h":"1c9ed6bc19"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Oh, I forgot it was released today!)","ko":"아, 그것이 오늘 ____ 것을 잊었어! (밑줄 친 단어의 뜻은?)","word":"released","opts":["발표된","숨겨진","잃어버린","지워진"],"r":{"a":"1) 발표된","ev":"14~15번 문장","s":[[14,"BTW, did you listen to his new song?","BTW(그런데), 그의 신곡을 들었어?"],[15,"Oh, I forgot it was released today!","아, 그것이 오늘 발매되었다는 것을 잊었어!"]],"w":"14번에서 그의 신곡을 이야기하고 15번에서 그것이 오늘 나왔다는 걸 잊었다고 해요. release(발표하다, 공개하다)의 수동형 was released = 발표되었다예요.","c":1},"h":"3baea46a5b"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIMO, you should listen to it RN.","ko":"밑줄 친 it이 가리키는 것은?","sko":"내 생각에는, 넌 그것을 지금 당장 들어야 해.","opts":["브루노 마스","그의 신곡","두문자어","문자 메시지"],"r":{"a":"2) 그의 신곡","ev":"14번, 16번 문장","s":[[14,"BTW, did you listen to his new song?","BTW(그런데), 그의 신곡을 들었어?"],[16,"IMO, you should listen to it RN.","IMO(내 생각에는), 넌 RN(지금 당장) 그것을 들어야 해."]],"w":"14번에서 his new song(그의 신곡)을 들었는지 물었고, 16번에서 그걸 지금 당장 들으라고 해요. 듣는 대상이니까 사람이나 두문자어가 아니라 신곡이에요.","c":2},"h":"1339f0764a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They make it easy to type short messages.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것들은 짧은 메시지를 입력하는 것을 쉽게 해 준다.","opts":["짧은 메시지를 지우기 쉽게 해 준다.","짧은 메시지를 읽는 것을 어렵게 만든다.","긴 메시지를 쉽게 보낼 수 있게 해 준다.","짧은 메시지를 입력하는 것을 쉽게 해 준다."],"r":{"a":"4) 짧은 메시지를 입력하는 것을 쉽게 해 준다.","ev":"8번 문장","s":[[8,"They make it easy to type short messages.","그것들은 짧은 메시지를 입력하는 것을 쉽게 해 준다."]],"w":"make it easy to type은 '입력하는 것을 쉽게 만든다'는 뜻이에요. 읽기나 지우기, 긴 메시지가 아니라 짧은 메시지를 입력하는 일이 쉬워진다는 말이에요.","c":4},"h":"647d8f56fb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Acronyms are used only in books.","TBH is the acronym of “to be honest.”","Acronyms are made up of the last letters of words.","GOAT is the acronym of “by the way.”"],"r":{"a":"2) TBH is the acronym of “to be honest.”","ev":"6번 문장","s":[[6,"For example, the acronym of “to be honest” is TBH.","예를 들어, ‘to be honest(솔직히 말해서)’의 두문자어는 TBH이다."]],"w":"6번 문장에서 to be honest의 두문자어가 TBH라고 해요. 두문자어는 온라인과 문자 메시지에 쓰이고(7번), 첫 글자로 만들며(4번), by the way는 BTW예요(14번).","c":2},"oko":["두문자어는 책에서만 쓰인다.","TBH는 ‘to be honest’의 두문자어이다.","두문자어는 단어들의 마지막 글자로 구성된다.","GOAT는 ‘by the way’의 두문자어이다."],"h":"65e96d2a52"},{"n":9,"t":"sum","q":"An acronym is made from the (A) letters of the words in a phrase, and it makes typing short messages (B).","ko":"두문자어는 구절 속 단어들의 (A) 글자로 만들어지고, 짧은 메시지를 입력하는 것을 (B)하게 해 준다.","opts":["(A) last / (B) easy","(A) first / (B) slow","(A) middle / (B) difficult","(A) last / (B) slow","(A) first / (B) easy"],"r":{"a":"5) (A) first / (B) easy","ev":"4번, 8번 문장","s":[[4,"Acronyms are made up of the first letters of the words in a phrase or a sentence.","두문자어는 구절이나 문장의 첫 번째 글자들로 구성된다."],[8,"They make it easy to type short messages.","그것들은 짧은 메시지를 입력하는 것을 쉽게 해 준다."]],"w":"4번에서 첫(first) 글자를 모아 만들고, 8번에서 짧은 메시지를 입력하는 것을 쉽게(easy) 해 준다고 해요.","c":5},"oko":["(A) 마지막 / (B) 쉽게","(A) 첫 / (B) 느리게","(A) 가운데 / (B) 어렵게","(A) 마지막 / (B) 느리게","(A) 첫 / (B) 쉽게"],"h":"e346036a02"},{"n":10,"t":"fill","q":"Acronyms are all [A], like TBH, the acronym of “to be [B].”","ko":"두문자어는 TBH처럼 모두 [A]이고, TBH는 ‘to be [B]’의 두문자어이다.","bank":["capitalized","honest","confused","phrase","online","first"],"bko":{"capitalized":"대문자로 쓰인","honest":"솔직한","confused":"혼란스러워하는","phrase":"구절","online":"온라인에서","first":"첫 번째의"},"r":{"a":"[A] capitalized, [B] honest","ev":"5~6번 문장","s":[[5,"That’s why they are all capitalized.","그래서 그것들은 모두 대문자로 쓰인다."],[6,"For example, the acronym of “to be honest” is TBH.","예를 들어, ‘to be honest(솔직히 말해서)’의 두문자어는 TBH이다."]],"w":"5번에서 두문자어는 모두 대문자로 쓰인다(capitalized)고 하고, 6번에서 to be honest의 두문자어가 TBH라고 해요.","c":null},"h":"30be54d4b8"}]},{"u":1,"id":"nl2-01-2","no":2,"ko":"페트병 모양이 다른 이유","items":[{"n":1,"t":"tf","q":"Plastic bottles that contain water or juice do not have bumps on the bottom.","ko":"물이나 주스가 든 페트병은 바닥에 돌기가 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"However, you won’t find them on plastic bottles that contain water or juice.","하지만, 물이나 주스가 들어 있는 페트병에서는 그것들을 찾을 수 없을 것이다."]],"w":"2번 문장에서 물이나 주스가 들어 있는 페트병에서는 돌기를 찾을 수 없을 것(you won’t find them)이라고 해요. 그래서 돌기가 없다는 말은 맞아요.","c":"T"},"h":"475dd148e4"},{"n":2,"t":"tf","q":"If a bottle has a greater area, there will be more pressure in it.","ko":"병의 면적이 더 넓으면 병 속 압력이 더 커질 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"If the bottle has a greater area, there will be less pressure in it.","만약 병의 면적이 더 넓으면, 병 속의 압력이 더 적어질 것이다."]],"w":"7번 문장에서 면적이 더 넓으면 압력이 less(더 적다)라고 해요. '더 커진다'는 반대 내용이에요.","c":"F"},"h":"d43d5d011b"},{"n":3,"t":"tf","q":"Without the bumps, the pressure would push the bottom inward.","ko":"돌기가 없으면 압력이 바닥을 안쪽으로 밀 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"The pressure would push the bottom outward.","압력이 바닥을 밖으로 밀어낼 것이다."]],"w":"11번 문장에서 압력이 바닥을 outward(바깥쪽으로) 밀 것이라고 해요. inward(안쪽으로)는 반대예요.","c":"F"},"h":"e582423dc4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The bottle must be able to resist this pressure.)","ko":"그 병은 이 압력에 ____ 할 수 있어야 한다. (밑줄 친 단어의 뜻은?)","word":"resist","opts":["만들어 내다","저항하다, 견디다","늘리다","담다"],"r":{"a":"2) 저항하다, 견디다","ev":"6번 문장","s":[[6,"The bottle must be able to resist this pressure.","그 병은 이 압력에 저항할 수 있어야 한다."]],"w":"6번 문장은 병이 이산화탄소가 만드는 압력을 견뎌야 한다는 말이에요. resist = 저항하다, 견디다예요.","c":2},"h":"e4ec61d789"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then the bottle would lose balance and eventually fall over.)","ko":"그러면 병은 균형을 잃고 ____ 넘어질 것이다. (밑줄 친 단어의 뜻은?)","word":"eventually","opts":["결국","갑자기","가끔","천천히"],"r":{"a":"1) 결국","ev":"12번 문장","s":[[12,"Then the bottle would lose balance and eventually fall over.","그러면 병은 균형을 잃고 결국 넘어질 것이다."]],"w":"12번 문장은 돌기가 없으면 균형을 잃고 마지막에 넘어진다는 흐름이에요. eventually = 결국, 마침내예요.","c":1},"h":"b82afe5815"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey increase the area of the bottle and spread the pressure out.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들이 병의 면적을 늘리고 압력을 분산시킨다.","opts":["탄산음료","페트병","이산화탄소","돌기들"],"r":{"a":"4) 돌기들","ev":"8~9번 문장","s":[[8,"That’s why the bumps are added.","그래서 돌기가 추가된 것이다."],[9,"They increase the area of the bottle and spread the pressure out.","그것들이 병의 면적을 늘리고 압력을 분산시킨다."]],"w":"8번에서 돌기가 추가되는 이유를 말하고, 9번 They가 그 돌기들이에요. 면적을 늘리고 압력을 분산시키는 것은 돌기예요.","c":4},"h":"df8866dc72"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If the bottle has a greater area, there will be less pressure in it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 병의 면적이 더 넓으면, 병 속의 압력이 더 적어질 것이다.","opts":["병의 면적이 넓어질수록 병 속 압력이 커진다.","병 속의 압력이 적으면 병의 면적이 넓어진다.","병의 면적이 더 넓으면 병 속 압력이 더 적어진다.","병의 면적이 넓든 좁든 병 속 압력은 같다."],"r":{"a":"3) 병의 면적이 더 넓으면 병 속 압력이 더 적어진다.","ev":"7번 문장","s":[[7,"If the bottle has a greater area, there will be less pressure in it.","만약 병의 면적이 더 넓으면, 병 속의 압력이 더 적어질 것이다."]],"w":"If는 '만약 ~라면'이에요. 면적이 더 넓으면(원인) 압력이 더 적어진다(결과)는 뜻이고, 원인과 결과를 뒤집은 선지는 오답이에요.","c":3},"h":"a3895fe930"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Water bottles always have five bumps on the bottom.","The bumps spread out the pressure inside a soda bottle.","The bumps make the area of the bottle smaller.","Carbon dioxide is found in plastic bottles of juice."],"r":{"a":"2) The bumps spread out the pressure inside a soda bottle.","ev":"9번 문장","s":[[9,"They increase the area of the bottle and spread the pressure out.","그것들이 병의 면적을 늘리고 압력을 분산시킨다."]],"w":"9번 문장에서 돌기가 병의 면적을 늘리고 압력을 분산시킨다고 해요. 물이나 주스 병에는 돌기가 없고(2번), 이산화탄소는 탄산음료에 들어 있어요(4번).","c":2},"oko":["물병은 항상 바닥에 다섯 개의 돌기가 있다.","돌기들은 탄산음료 병 속의 압력을 분산시킨다.","돌기들은 병의 면적을 더 작게 만든다.","이산화탄소는 주스가 든 페트병에서 발견된다."],"h":"758b3feb3b"},{"n":9,"t":"sum","q":"Soda contains (A), which makes a lot of pressure. The bumps on the bottom make the area of the bottle (B) and spread the pressure out.","ko":"탄산음료에는 (A)가 들어 있어 큰 압력을 만든다. 바닥의 돌기는 병의 면적을 (B)하게 하고 압력을 분산시킨다.","opts":["(A) water / (B) bigger","(A) gas / (B) smaller","(A) juice / (B) smaller","(A) gas / (B) bigger","(A) water / (B) smaller"],"r":{"a":"4) (A) gas / (B) bigger","ev":"4~5번, 9번 문장","s":[[4,"It’s because soda has carbon dioxide in it.","왜냐하면 탄산음료에는 이산화탄소가 들어 있기 때문이다."],[5,"This gas creates a lot of pressure inside the plastic bottle.","이 가스는 페트병 안에 많은 압력을 만들어 낸다."],[9,"They increase the area of the bottle and spread the pressure out.","그것들이 병의 면적을 늘리고 압력을 분산시킨다."]],"w":"4~5번에서 탄산음료 속 이산화탄소 가스가 큰 압력을 만들고, 9번에서 돌기가 병의 면적을 늘려요(bigger).","c":4},"oko":["(A) 물 / (B) 더 크게","(A) 가스 / (B) 더 작게","(A) 주스 / (B) 더 작게","(A) 가스 / (B) 더 크게","(A) 물 / (B) 더 작게"],"h":"a353abfd4d"},{"n":10,"t":"fill","q":"Without the bumps, the [A] would push the bottom [B], and the bottle would fall over.","ko":"돌기가 없으면 [A]이(가) 바닥을 [B] 밀어서 병이 넘어질 것이다.","bank":["pressure","outward","balance","bumps","bottom","easy"],"bko":{"pressure":"압력","outward":"밖으로","balance":"균형","bumps":"돌기들","bottom":"바닥","easy":"쉬운"},"r":{"a":"[A] pressure, [B] outward","ev":"11~12번 문장","s":[[11,"The pressure would push the bottom outward.","압력이 바닥을 밖으로 밀어낼 것이다."],[12,"Then the bottle would lose balance and eventually fall over.","그러면 병은 균형을 잃고 결국 넘어질 것이다."]],"w":"11번에서 압력(pressure)이 바닥을 밖으로(outward) 밀고, 12번에서 병이 균형을 잃고 넘어진다고 해요.","c":null},"h":"4af9087369"}]},{"u":1,"id":"nl2-01-3","no":3,"ko":"특별한 집을 만드는 거미","items":[{"n":1,"t":"tf","q":"A diving bell held air for divers to breathe.","ko":"잠수종은 잠수부들이 숨 쉴 공기를 담고 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"These devices were shaped like a bell and held air for divers to breathe.","이 장치는 종과 같은 모양이었고 잠수부들이 호흡할 공기를 담고 있었다."]],"w":"2번 문장에서 잠수종(these devices)은 종과 같은 모양이었고 잠수부들이 호흡할 공기를 담고 있었다고 해요.","c":"T"},"h":"c8f3973540"},{"n":2,"t":"tf","q":"The spider makes its web on the surface of the water.","ko":"그 거미는 수면 위에 거미줄을 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"First, it makes an underwater web between plants.","먼저 그것은 식물들 사이에 수중 거미줄을 만든다."]],"w":"5번 문장에서 거미는 식물들 사이에 수중(underwater) 거미줄을 만든다고 해요. 수면 위가 아니라 물속이에요. 수면에서는 공기 방울만 모아 와요(6번).","c":"F"},"h":"252db18b4a"},{"n":3,"t":"tf","q":"The diving bell spider is one of many spiders that live underwater all their lives.","ko":"물거미는 평생 물속에서 사는 많은 거미 중 하나이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It is the only species of spider that spends its whole life underwater.","그것은 물속에서 평생을 보내는 유일한 거미 종(種)이다."]],"w":"4번 문장에서 물거미는 물속에서 평생을 보내는 the only species(유일한 종)라고 해요. '많은 거미 중 하나'는 틀린 말이에요.","c":"F"},"h":"3f3f1a46af"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then it collects air bubbles from the surface using its legs and belly.)","ko":"그러고 나서 그것은 다리와 배를 사용하여 ____에서 공기 방울을 모은다. (밑줄 친 단어의 뜻은?)","word":"surface","opts":["바닥","수면","식물","거미줄"],"r":{"a":"2) 수면","ev":"6번 문장","s":[[6,"Then it collects air bubbles from the surface using its legs and belly.","그러고 나서 그것은 다리와 배를 사용하여 수면에서 공기 방울을 모은다."]],"w":"거미가 공기 방울을 가져오는 곳이니까 물의 위쪽 면, 즉 수면이에요. surface = 표면, 수면이에요.","c":2},"h":"1b848cb08f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Over time, air leaks out, and the spider must gather more bubbles.)","ko":"시간이 지나면서 공기는 새어 나가고, 거미는 더 많은 공기 방울을 ____ 한다. (밑줄 친 단어의 뜻은?)","word":"gather","opts":["버리다","나누다","모으다","세다"],"r":{"a":"3) 모으다","ev":"11번 문장","s":[[11,"Over time, air leaks out, and the spider must gather more bubbles.","시간이 지나면서 공기는 새어 나가고, 거미는 더 많은 공기 방울을 모아야 한다."]],"w":"공기가 새어 나가서 줄었으니 방울을 더 모아야 한다는 흐름이에요. gather = 모으다예요.","c":3},"h":"13fd1269f0"},{"n":6,"t":"ref","q":"What does the underlined \"These body parts\" refer to?\nThese body parts are covered in hairs.","ko":"밑줄 친 These body parts가 가리키는 것은?","sko":"이 몸의 부위들은 털로 덮여 있다.","opts":["공기 방울","거미줄","식물","다리와 배"],"r":{"a":"4) 다리와 배","ev":"6~7번 문장","s":[[6,"Then it collects air bubbles from the surface using its legs and belly.","그러고 나서 그것은 다리와 배를 사용하여 수면에서 공기 방울을 모은다."],[7,"These body parts are covered in hairs.","이 몸의 부위들은 털로 덮여 있다."]],"w":"6번 문장에서 거미가 using its legs and belly(다리와 배를 사용하여) 공기 방울을 모은다고 했고, 7번의 These body parts가 그 다리와 배예요.","c":4},"h":"4f9e18e54a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It spends most of its life living inside its bubble house.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 생애 대부분을 공기 방울 집에서 살며 보낸다.","opts":["거미는 공기 방울 집을 만드는 데 일생을 쓴다.","거미는 공기 방울 집 밖에서 대부분 지낸다.","거미는 생애 대부분을 공기 방울 집 안에서 살며 보낸다.","거미는 공기 방울 집이 완성되면 곧 떠난다."],"r":{"a":"3) 거미는 생애 대부분을 공기 방울 집 안에서 살며 보낸다.","ev":"12번 문장","s":[[12,"It spends most of its life living inside its bubble house.","그것은 생애 대부분을 공기 방울 집에서 살며 보낸다."]],"w":"spends most of its life living inside는 '생애 대부분을 안에서 살며 보낸다'는 뜻이에요. inside는 '안에'라서 집 밖에서 지낸다는 선지는 틀려요.","c":3},"h":"50186117ca"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["People never used diving bells in the past.","The hairs on the spider’s body help trap the bubbles.","The spider gets air bubbles from the plants.","The spider leaves its home after it makes the bubble house."],"r":{"a":"2) The hairs on the spider’s body help trap the bubbles.","ev":"7~8번 문장","s":[[7,"These body parts are covered in hairs.","이 몸의 부위들은 털로 덮여 있다."],[8,"The hairs help trap the bubbles.","그 털은 공기 방울을 가두는 것을 돕는다."]],"w":"7~8번에서 몸에 있는 털이 공기 방울을 가두는 것을 돕는다고 해요. 사람들은 과거에 잠수종을 썼고(1번), 공기 방울은 수면에서 모으며(6번), 거미는 집 안에서 살아요(12번).","c":2},"oko":["사람들은 과거에 잠수종을 전혀 사용하지 않았다.","거미 몸의 털은 공기 방울을 가두는 것을 돕는다.","거미는 식물에서 공기 방울을 얻는다.","거미는 공기 방울 집을 만든 뒤 집을 떠난다."],"h":"88635cf285"},{"n":9,"t":"sum","q":"The diving bell spider (A) air bubbles from the surface and (B) them in its web to make a home.","ko":"물거미는 수면에서 공기 방울을 (A)하고, 거미줄에서 그것들을 (B)하여 집을 만든다.","opts":["(A) collects / (B) eats","(A) eats / (B) releases","(A) loses / (B) traps","(A) collects / (B) hides","(A) collects / (B) releases"],"r":{"a":"5) (A) collects / (B) releases","ev":"6번, 9번 문장","s":[[6,"Then it collects air bubbles from the surface using its legs and belly.","그러고 나서 그것은 다리와 배를 사용하여 수면에서 공기 방울을 모은다."],[9,"The spider brings these bubbles to the web and releases them.","그 거미는 이 공기 방울을 거미줄로 가져와 풀어 놓는다."]],"w":"6번에서 수면의 공기 방울을 모으고(collects), 9번에서 그 방울을 거미줄로 가져와 풀어 놓는다(releases)고 해요.","c":5},"oko":["(A) 모으고 / (B) 먹어","(A) 먹고 / (B) 풀어 놓아","(A) 잃고 / (B) 가두어","(A) 모으고 / (B) 숨겨","(A) 모으고 / (B) 풀어 놓아"],"h":"8355b7a162"},{"n":10,"t":"fill","q":"Over time, air [A] out, so the spider must [B] more bubbles.","ko":"시간이 지나면 공기는 밖으로 [A], 그래서 거미는 더 많은 공기 방울을 [B]해야 한다.","bank":["leaks","gather","web","hairs","breathe","bubble"],"bko":{"leaks":"새어 나간다","gather":"모으다","web":"거미줄","hairs":"털","breathe":"숨 쉬다","bubble":"공기 방울"},"r":{"a":"[A] leaks, [B] gather","ev":"11번 문장","s":[[11,"Over time, air leaks out, and the spider must gather more bubbles.","시간이 지나면서 공기는 새어 나가고, 거미는 더 많은 공기 방울을 모아야 한다."]],"w":"11번 문장에서 공기가 새어 나가고(leaks out), 그래서 거미가 더 많은 방울을 모아야(gather) 한다고 해요.","c":null},"h":"69e60ba04a"}]},{"u":1,"id":"nl2-01-4","no":4,"ko":"머리핀으로 집을 샀다고?","items":[{"n":1,"t":"tf","q":"Demi Skipper decided to try the same thing after she watched a TED Talk.","ko":"Demi Skipper는 TED Talk를 본 뒤 같은 일을 해 보기로 결심했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~6번 문장","s":[[4,"One day, she watched a man’s TED Talk.","어느 날, 그녀는 한 남자의 TED Talk(테드 토크)를 봤다."],[5,"He traded up from a paper clip to a house.","그는 종이를 끼우는 클립에서 집으로 교환했다."],[6,"She was greatly impressed and decided to try the same thing.","그녀는 크게 감명받았고 같은 것을 해 보기로 결심했다."]],"w":"4번에서 TED Talk를 보았고, 5번에서 그 남자가 클립에서 집까지 바꿨으며, 6번에서 감명받은 Skipper가 같은 일을 해 보기로 결심했다(decided to try the same thing)고 해요.","c":"T"},"h":"7f65d1f5a5"},{"n":2,"t":"tf","q":"First, Skipper exchanged her hairpin for four glasses.","ko":"먼저 Skipper는 머리핀을 안경 네 개와 바꾸었다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"First, she exchanged a hairpin for a pair of earrings.","우선, 그녀는 머리핀을 귀걸이 한 쌍으로 바꾸었다."],[8,"She then traded the earrings for four glasses.","그러고 나서 그녀는 그 귀걸이를 네 쌍의 안경과 맞바꾸었다."]],"w":"7번에서 머리핀은 귀걸이 한 쌍으로 바뀌었고, 안경 네 개는 8번에서 귀걸이와 바뀐 물건이에요. 머리핀과 안경을 바로 바꾼 게 아니에요.","c":"F"},"h":"95527fe907"},{"n":3,"t":"tf","q":"It was easy to find trading partners when the items became more valuable.","ko":"물건의 가치가 더 커졌을 때 물물 교환 상대를 찾기가 쉬웠다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"However, as the items became more valuable, it became harder to find trading partners.","하지만 그 물건들의 가치가 더 커질수록 물물 교환 상대를 찾기가 더 어려워졌다."]],"w":"10번 문장에서 물건의 가치가 커질수록 교환 상대를 찾기가 harder(더 어려워졌다)고 해요. '쉬웠다'는 반대 내용이에요.","c":"F"},"h":"20bb5719a2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She was greatly impressed and decided to try the same thing.)","ko":"그녀는 크게 ____ 같은 것을 해 보기로 결심했다. (밑줄 친 단어의 뜻은?)","word":"impressed","opts":["지루해하는","감명받은","화가 난","무서워하는"],"r":{"a":"2) 감명받은","ev":"6번 문장","s":[[6,"She was greatly impressed and decided to try the same thing.","그녀는 크게 감명받았고 같은 것을 해 보기로 결심했다."]],"w":"TED Talk를 보고 같은 일을 해 보기로 결심했으니 좋은 인상을 받은 거예요. impressed = 감명받은이에요.","c":2},"h":"726a031c63"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But it was hard to bring it across the border.)","ko":"하지만 그것을 ____을(를) 넘어 가지고 오는 것은 어려웠다. (밑줄 친 단어의 뜻은?)","word":"border","opts":["국경","다리","항구","시장"],"r":{"a":"1) 국경","ev":"15번 문장","s":[[15,"But it was hard to bring it across the border.","하지만 그것을 국경을 넘어 가지고 오는 것은 어려웠다."]],"w":"캐나다인에게서 받은 트럭을 미국으로 들여오는 일이 어려웠다는 내용이에요(16번). 두 나라를 가르는 선이니까 border = 국경이에요.","c":1},"h":"03333bb1cf"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt got lots of attention.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 많은 관심을 받았다.","opts":["머리핀","TED Talk","그녀가 소셜 미디어에 올린 이야기","캐나다인의 트럭"],"r":{"a":"3) 그녀가 소셜 미디어에 올린 이야기","ev":"11~12번 문장","s":[[11,"So Skipper posted her story on social media.","그래서 Skipper는 자신의 이야기를 소셜 미디어에 게시했다."],[12,"It got lots of attention.","그것은 많은 관심을 받았다."]],"w":"11번에서 Skipper가 her story(자신의 이야기)를 소셜 미디어에 올렸고, 12번 It이 그 이야기예요. 관심을 받은 건 소셜 미디어에 올린 이야기예요.","c":3},"h":"c0d54b5133"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, she was able to make 28 trades in 18 months, although she had a problem with her 27th trade.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 결과, 비록 27번째 물물 교환에 문제가 생기긴 했지만, 그녀는 18개월 만에 28번의 물물 교환을 할 수 있었다.","opts":["그 결과 그녀는 18개월 동안 28번 교환했고, 27번째 교환에는 문제가 없었다.","비록 27번째 교환에 문제가 있었지만, 그녀는 18개월 만에 28번 교환할 수 있었다.","그 결과 그녀는 28개월 동안 18번의 교환을 했다.","27번째 교환에서 문제가 생겨 그녀는 더 이상 교환을 못 했다."],"r":{"a":"2) 비록 27번째 교환에 문제가 있었지만, 그녀는 18개월 만에 28번 교환할 수 있었다.","ev":"13번 문장","s":[[13,"As a result, she was able to make 28 trades in 18 months, although she had a problem with her 27th trade.","그 결과, 비록 27번째 물물 교환에 문제가 생기긴 했지만, 그녀는 18개월 만에 28번의 물물 교환을 할 수 있었다."]],"w":"although는 '비록 ~이지만'이에요. 27번째 교환에 문제가 있었지만 18개월에 28번을 교환했다는 뜻이라서, 28번까지 이어졌고 문제가 없었다는 선지도, 교환을 멈췄다는 선지도 틀려요.","c":2},"h":"77aba4867c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Skipper made 28 trades in five months.","Skipper’s first trade was a hairpin for a truck.","In the end, Skipper traded a house for a truck.","Skipper got the idea for her trades from a man’s TED Talk."],"r":{"a":"4) Skipper got the idea for her trades from a man’s TED Talk.","ev":"4~6번 문장","s":[[4,"One day, she watched a man’s TED Talk.","어느 날, 그녀는 한 남자의 TED Talk(테드 토크)를 봤다."],[5,"He traded up from a paper clip to a house.","그는 종이를 끼우는 클립에서 집으로 교환했다."],[6,"She was greatly impressed and decided to try the same thing.","그녀는 크게 감명받았고 같은 것을 해 보기로 결심했다."]],"w":"4~6번에서 Skipper는 한 남자의 TED Talk를 보고 같은 일을 해 보기로 했어요. 28번은 18개월(13번), 첫 교환은 머리핀과 귀걸이(7번), 마지막은 트럭을 집으로 바꾼 것(18번)이에요.","c":4},"oko":["Skipper는 5개월 동안 28번 교환했다.","Skipper의 첫 교환은 머리핀을 트럭과 바꾼 것이었다.","결국 Skipper는 집을 트럭과 바꾸었다.","Skipper는 한 남자의 TED Talk에서 교환에 대한 아이디어를 얻었다."],"h":"0d43c641a0"},{"n":9,"t":"sum","q":"Skipper began with a (A) and traded up many times. Her story got (B) on social media, and finally she got a house.","ko":"Skipper는 (A)(으)로 시작해 여러 번 교환해 나갔다. 그녀의 이야기는 소셜 미디어에서 (B)을(를) 받았고, 마침내 집을 얻었다.","opts":["(A) paper clip / (B) attention","(A) truck / (B) attention","(A) hairpin / (B) trouble","(A) earrings / (B) money","(A) hairpin / (B) attention"],"r":{"a":"5) (A) hairpin / (B) attention","ev":"7번, 12번, 18번 문장","s":[[7,"First, she exchanged a hairpin for a pair of earrings.","우선, 그녀는 머리핀을 귀걸이 한 쌍으로 바꾸었다."],[12,"It got lots of attention.","그것은 많은 관심을 받았다."],[18,"She exchanged the truck for a house!","그녀는 그 트럭을 집과 바꾸었다!"]],"w":"7번에서 Skipper는 머리핀(hairpin)으로 교환을 시작했고, 12번에서 소셜 미디어에 올린 이야기가 많은 관심(attention)을 받았으며, 18번에서 트럭을 집으로 바꿨어요. 클립은 TED Talk 남자의 것이에요(5번).","c":5},"oko":["(A) 종이 클립 / (B) 관심","(A) 트럭 / (B) 관심","(A) 머리핀 / (B) 문제","(A) 귀걸이 / (B) 돈","(A) 머리핀 / (B) 관심"],"h":"ef204d2ce4"},{"n":10,"t":"fill","q":"The trade for a [A] was hard because it took five months to bring it across the [B].","ko":"[A]과(와) 바꾼 교환은 그것을 [B]을(를) 넘어 가져오는 데 5개월이 걸려서 힘들었다.","bank":["truck","border","social","attention","months","partners"],"bko":{"truck":"트럭","border":"국경","social":"사회적인","attention":"관심","months":"개월","partners":"상대들"},"r":{"a":"[A] truck, [B] border","ev":"14~16번 문장","s":[[14,"The trade was for a truck from a Canadian.","그 거래품은 캐나다인의 트럭이었다."],[15,"But it was hard to bring it across the border.","하지만 그것을 국경을 넘어 가지고 오는 것은 어려웠다."],[16,"It took five months for her to get it into the US.","그녀가 그것을 미국으로 들여오는 데 5개월이 걸렸다."]],"w":"14번에서 27번째 교환은 캐나다인의 트럭(truck)이었고, 15번에서 그것을 국경(border) 너머로 가져오기 어려웠으며, 16번에서 5개월이 걸렸다고 해요.","c":null},"h":"5dd73c7943"}]},{"u":2,"id":"nl2-02-1","no":1,"ko":"일을 제때 끝내고 싶다면?","items":[{"n":1,"t":"tf","q":"At The Deadline Café, you write your name, your work goal, and the time you need on a form.","ko":"The Deadline Café에서는 이름, 업무 목표, 필요한 시간을 양식에 적는다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When you enter, you fill out a form with your name, your work goal, and the time you need.","당신은 (카페에) 입장할 때 이름, 업무 목표, 필요한 시간으로 양식을 작성합니다."]],"w":"3번 문장에서 들어갈 때 이름, 업무 목표, 필요한 시간으로 양식을 작성한다고 해요.","c":"T"},"h":"0cb8a8784e"},{"n":2,"t":"tf","q":"With “hard,” the staff will only check your progress before you leave.","ko":"‘hard’를 선택하면 직원은 당신이 나가기 전에 진행 상황만 확인할 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번, 7번 문장","s":[[5,"With “mild,” the staff will only check your progress before you leave.","‘mild(가벼운)’를 선택하면 직원은 당신이 나가기 전에 진행 상황만 확인할 것입니다."],[7,"And with “hard,” they will keep watching you until you finish your work.","그리고 ‘hard(강력한)’를 선택하면 직원은 당신이 일을 마칠 때까지 계속 당신을 지켜볼 것입니다."]],"w":"나가기 전에 진행 상황만 확인하는 단계는 mild예요(5번). hard는 일을 마칠 때까지 계속 지켜봐요(7번).","c":"F"},"h":"c7c7b88caf"},{"n":3,"t":"tf","q":"You have to pay extra for Wi-Fi at the café.","ko":"그 카페에서 와이파이를 쓰려면 추가 요금을 내야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Free Wi-Fi is provided.","무료 와이파이가 제공됩니다."]],"w":"9번 문장에서 Free Wi-Fi is provided(무료 와이파이가 제공된다)고 해요. 추가 요금을 낸다는 말은 틀려요.","c":"F"},"h":"050507ee16"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Do you have a deadline to meet?)","ko":"당신이 ____ 마감 기한이 있습니까? (밑줄 친 단어의 뜻은?)","word":"meet","opts":["만나다","(기한 등을) 지키다","떠나다","잊다"],"r":{"a":"2) (기한 등을) 지키다","ev":"1번 문장","s":[[1,"Do you have a deadline to meet?","당신이 지켜야 할 마감 기한이 있습니까?"]],"w":"deadline(마감 기한)과 함께 쓰인 meet는 사람을 만나는 게 아니라 기한을 지킨다는 뜻이에요. a deadline to meet = 지켜야 할 마감 기한이에요.","c":2},"h":"088b1ed464"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (With “mild,” the staff will only check your progress before you leave.)","ko":"‘mild’를 선택하면 직원은 당신이 나가기 전에 ____만 확인할 것이다. (밑줄 친 단어의 뜻은?)","word":"progress","opts":["실수","가격","좌석","진행 상황"],"r":{"a":"4) 진행 상황","ev":"5번 문장","s":[[5,"With “mild,” the staff will only check your progress before you leave.","‘mild(가벼운)’를 선택하면 직원은 당신이 나가기 전에 진행 상황만 확인할 것입니다."]],"w":"직원이 확인하는 대상은 일이 어디까지 되었는지예요. 7번에서도 일을 마칠 때까지 지켜본다고 해요. progress = 진행, 진행 상황이에요.","c":4},"h":"6e8cb0003d"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAnd with “hard,” they will keep watching you until you finish your work.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그리고 ‘hard’를 선택하면 그들은 당신이 일을 마칠 때까지 계속 당신을 지켜볼 것이다.","opts":["손님들","마감 기한들","카페 직원들","좌석들"],"r":{"a":"3) 카페 직원들","ev":"5번, 7번 문장","s":[[5,"With “mild,” the staff will only check your progress before you leave.","‘mild(가벼운)’를 선택하면 직원은 당신이 나가기 전에 진행 상황만 확인할 것입니다."],[7,"And with “hard,” they will keep watching you until you finish your work.","그리고 ‘hard(강력한)’를 선택하면 직원은 당신이 일을 마칠 때까지 계속 당신을 지켜볼 것입니다."]],"w":"5번에서 the staff(직원)가 진행 상황을 확인한다고 했고, 7번 they는 계속 당신을 지켜보는 쪽, 즉 직원들이에요. you는 손님이에요.","c":3},"h":"77ee2c8f32"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"“Normal” means they will check it hourly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"‘normal(보통의)’은 직원이 매시간 진행 상황을 확인한다는 의미입니다.","opts":["‘normal’은 직원이 한 시간마다 진행 상황을 확인한다는 뜻이다.","‘normal’은 직원이 나갈 때만 진행 상황을 확인한다는 뜻이다.","‘normal’은 직원이 끝날 때까지 계속 지켜본다는 뜻이다.","‘normal’은 직원이 하루에 한 번만 확인한다는 뜻이다."],"r":{"a":"1) ‘normal’은 직원이 한 시간마다 진행 상황을 확인한다는 뜻이다.","ev":"6번 문장","s":[[6,"“Normal” means they will check it hourly.","‘normal(보통의)’은 직원이 매시간 진행 상황을 확인한다는 의미입니다."]],"w":"hourly는 '매시간'이에요. 나가기 전에만 확인하는 것은 mild(5번), 끝날 때까지 계속 지켜보는 것은 hard(7번)예요.","c":1},"h":"021e87d8a5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Customers must pay $10 to enter the café.","You can get as much coffee and tea as you want.","With “mild,” the staff will check your progress every hour.","The café has seats for fifty people."],"r":{"a":"2) You can get as much coffee and tea as you want.","ev":"11번 문장","s":[[11,"Coffee and tea are self-serve and unlimited.","커피와 차는 셀프로 제공되며 무제한입니다."]],"w":"11번 문장에서 커피와 차는 셀프이고 무제한(unlimited)이라고 해요. 요금은 처음 30분 1달러부터이고(12번), mild는 나가기 전에만 확인하며(5번), 좌석은 15개예요(10번).","c":2},"oko":["손님은 카페에 들어가려면 10달러를 내야 한다.","커피와 차를 원하는 만큼 마실 수 있다.","‘mild’를 선택하면 직원은 매시간 진행 상황을 확인한다.","그 카페에는 50명이 앉을 좌석이 있다."],"h":"6a5f083247"},{"n":9,"t":"sum","q":"At The Deadline Café, you choose how much (A) you want, and the café offers free (B) and unlimited coffee and tea.","ko":"The Deadline Café에서는 원하는 (A)의 양을 고르고, 카페는 무료 (B)와 무제한 커피와 차를 제공한다.","opts":["(A) time / (B) Wi-Fi","(A) pressure / (B) seats","(A) pressure / (B) Wi-Fi","(A) money / (B) snacks","(A) goal / (B) seats"],"r":{"a":"3) (A) pressure / (B) Wi-Fi","ev":"4번, 9번, 11번 문장","s":[[4,"You also choose the amount of pressure you want.","또한 당신이 원하는 압박의 양도 선택합니다."],[9,"Free Wi-Fi is provided.","무료 와이파이가 제공됩니다."],[11,"Coffee and tea are self-serve and unlimited.","커피와 차는 셀프로 제공되며 무제한입니다."]],"w":"4번에서 원하는 압박(pressure)의 양을 고르고, 9번에서 무료 와이파이(Wi-Fi), 11번에서 커피와 차가 무제한이라고 해요. 좌석은 15개뿐이고 무료라는 말도 없어요(10번).","c":3},"oko":["(A) 시간 / (B) 와이파이","(A) 압박 / (B) 좌석","(A) 압박 / (B) 와이파이","(A) 돈 / (B) 간식","(A) 목표 / (B) 좌석"],"h":"a53de9f9d8"},{"n":10,"t":"fill","q":"The first [A] minutes cost $1 and each [B] afterward costs $2.50.","ko":"처음 [A]분은 1달러이고 그 후에는 [B]마다 2.5달러입니다.","bank":["thirty","hour","free","unlimited","pressure","mild"],"bko":{"thirty":"30","hour":"한 시간","free":"무료의","unlimited":"무제한의","pressure":"압박","mild":"가벼운"},"r":{"a":"[A] thirty, [B] hour","ev":"12번 문장","s":[[12,"The first thirty minutes cost $1 and each hour afterward costs $2.50.","처음 30분은 1달러이고 그 후에는 시간당 2.5달러입니다."]],"w":"12번 문장에서 처음 thirty(30)분은 1달러이고, 그 후에는 each hour(한 시간마다) 2.5달러예요.","c":null},"h":"a857b90415"}]},{"u":2,"id":"nl2-02-2","no":2,"ko":"눈 덮인 세상의 고요함","items":[{"n":1,"t":"tf","q":"Snowflakes have six sides.","ko":"눈송이는 6개의 변을 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They have six sides.","눈송이는 6개의 변을 가지고 있다."]],"w":"4번 문장에서 눈송이는 6개의 변(six sides)을 가지고 있다고 해요.","c":"T"},"h":"c827c738f7"},{"n":2,"t":"tf","q":"The empty spaces in snowflakes reflect sound waves.","ko":"눈송이의 빈 공간은 음파를 반사한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"These spaces absorb sound waves.","이 공간들은 음파를 흡수한다."]],"w":"6번 문장에서 빈 공간은 음파를 반사하는 게 아니라 흡수한다(absorb)고 해요. 반사는 얼음 표면이 하는 일이에요(11번).","c":"F"},"h":"81dc602fbe"},{"n":3,"t":"tf","q":"When the snow starts to melt, the special feeling will disappear.","ko":"눈이 녹기 시작하면 그 특별한 느낌이 사라질 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"When the snow starts to melt, the special feeling will disappear.","눈이 녹기 시작하면, 그 특별한 느낌은 사라질 것이다."]],"w":"14번 문장에서 눈이 녹기 시작하면 그 특별한 느낌은 사라질 것이라고 해요.","c":"T"},"h":"a27460531f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These spaces absorb sound waves.)","ko":"이 공간들은 음파를 ____. (밑줄 친 단어의 뜻은?)","word":"absorb","opts":["흡수하다","반사하다","만들다","보내다"],"r":{"a":"1) 흡수하다","ev":"6번 문장","s":[[6,"These spaces absorb sound waves.","이 공간들은 음파를 흡수한다."]],"w":"빈 공간이 음파를 받아들여서 주변이 조용해진다는 내용이에요. 반대로 반사는 reflect예요(11번). absorb = 흡수하다예요.","c":1},"h":"8c408133c4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As the snow melts, the spaces in the snowflakes get smaller.)","ko":"눈이 ____, 눈송이 속의 공간은 더 작아진다. (밑줄 친 단어의 뜻은?)","word":"melts","opts":["얼다","쌓이다","녹다","내리다"],"r":{"a":"3) 녹다","ev":"8번 문장","s":[[8,"As the snow melts, the spaces in the snowflakes get smaller.","눈이 녹으면서, 눈송이 속의 공간은 더 작아진다."]],"w":"눈이 녹으면서 눈송이 속 공간이 작아진다는 내용이고, 10번에서 녹은 눈이 다시 언다고 해요. melt = 녹다예요.","c":3},"h":"bec57af78b"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis changes the shape of the snowflakes.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 눈송이의 모양을 바꾼다.","opts":["눈송이가 6개의 변을 가진 것","눈이 모든 것을 조용하게 만드는 것","녹은 눈이 다시 어는 것","눈이 녹으면서 눈송이 속 공간이 작아지는 것"],"r":{"a":"4) 눈이 녹으면서 눈송이 속 공간이 작아지는 것","ev":"8~9번 문장","s":[[8,"As the snow melts, the spaces in the snowflakes get smaller.","눈이 녹으면서, 눈송이 속의 공간은 더 작아진다."],[9,"This changes the shape of the snowflakes.","이것이 눈송이의 모양을 바꾼다."]],"w":"8번에서 눈이 녹으면서 눈송이 속 공간이 더 작아진다고 했고, 9번 This가 그 일이에요. 다시 어는 일은 10번에서 나와요.","c":4},"h":"167a850f98"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This actually makes sounds seem louder.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 실제로 소리를 더 크게 들리게 한다.","opts":["이것은 소리를 실제로 더 작게 만든다.","이것은 실제로 소리를 더 크게 들리게 한다.","이것은 소리가 들리지 않게 한다.","이것은 소리를 내는 눈송이를 늘린다."],"r":{"a":"2) 이것은 실제로 소리를 더 크게 들리게 한다.","ev":"12번 문장","s":[[12,"This actually makes sounds seem louder.","이는 실제로 소리를 더 크게 들리게 한다."]],"w":"makes sounds seem louder는 '소리가 더 크게 들리게 한다'는 뜻이에요. louder는 '더 큰', seem은 '~처럼 들리다, 보이다'예요.","c":2},"h":"2a3288050c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Snowflakes have eight sides.","Snowflakes absorb sound waves even after the melted snow freezes again.","Snowflakes with empty spaces make the surroundings quieter.","Snow makes everything louder."],"r":{"a":"3) Snowflakes with empty spaces make the surroundings quieter.","ev":"5~7번 문장","s":[[5,"Each side has lots of empty spaces.","각 변에는 많은 빈 공간이 있다."],[6,"These spaces absorb sound waves.","이 공간들은 음파를 흡수한다."],[7,"As a result, everything nearby becomes quieter.","그 결과, 인근의 모든 것이 더 조용해진다."]],"w":"5~7번에서 빈 공간이 있는 눈송이가 음파를 흡수해서 주변이 더 조용해진다고 해요. 변은 6개(4번), 다시 얼면 능력을 잃고(10번), 눈은 모든 것을 더 조용하게 해요(2번).","c":3},"oko":["눈송이는 8개의 변을 가지고 있다.","눈송이는 녹은 눈이 다시 언 뒤에도 음파를 흡수한다.","빈 공간이 있는 눈송이는 주변을 더 조용하게 만든다.","눈은 모든 것을 더 시끄럽게 만든다."],"h":"82f3e04f4d"},{"n":9,"t":"sum","q":"Snowflakes have (A) spaces that absorb sound waves, so snowy nights are (B).","ko":"눈송이는 음파를 흡수하는 (A) 공간을 가지고 있어서, 눈 오는 밤은 (B).","opts":["(A) full / (B) loud","(A) empty / (B) loud","(A) full / (B) quiet","(A) small / (B) warm","(A) empty / (B) quiet"],"r":{"a":"5) (A) empty / (B) quiet","ev":"5~7번 문장","s":[[5,"Each side has lots of empty spaces.","각 변에는 많은 빈 공간이 있다."],[6,"These spaces absorb sound waves.","이 공간들은 음파를 흡수한다."],[7,"As a result, everything nearby becomes quieter.","그 결과, 인근의 모든 것이 더 조용해진다."]],"w":"5번에서 눈송이의 각 변에는 빈(empty) 공간이 많고, 6~7번에서 그 공간이 음파를 흡수해서 주변이 더 조용해진다(quiet)고 해요.","c":5},"oko":["(A) 가득 찬 / (B) 시끄럽다","(A) 빈 / (B) 시끄럽다","(A) 가득 찬 / (B) 조용하다","(A) 작은 / (B) 따뜻하다","(A) 빈 / (B) 조용하다"],"h":"a3c9d1446b"},{"n":10,"t":"fill","q":"When the melting snow freezes again, the snowflakes become an [A] surface and [B] sound waves.","ko":"녹은 눈이 다시 얼면, 눈송이는 [A] 표면이 되어 음파를 [B].","bank":["icy","reflect","hear","special","nearby","calm"],"bko":{"icy":"얼음으로 덮인","reflect":"반사한다","hear":"듣는다","special":"특별한","nearby":"인근의","calm":"고요한"},"r":{"a":"[A] icy, [B] reflect","ev":"10~11번 문장","s":[[10,"When the melting snow freezes again, the snowflakes completely lose their special ability.","녹은 눈이 다시 얼면, 그 눈송이는 그것의 특별한 능력을 모조리 잃는다."],[11,"They become an icy surface and reflect sound waves instead.","그 대신 눈송이는 표면이 얼음으로 덮여 음파를 반사한다."]],"w":"10번에서 녹은 눈이 다시 얼면 능력을 잃고, 11번에서 얼음으로 덮인(icy) 표면이 되어 음파를 반사한다(reflect)고 해요.","c":null},"h":"b9e196e0ea"}]},{"u":2,"id":"nl2-02-3","no":3,"ko":"기억에 남는 회사 로고가 있나요?","items":[{"n":1,"t":"tf","q":"Amazon’s logo is its name in capital letters.","ko":"Amazon의 로고는 대문자로 쓴 이름이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Its logo is its name in lowercase and an orange arrow.","그것의 로고는 소문자로 쓰인 이름과 주황색 화살표이다."]],"w":"4번 문장에서 Amazon의 로고는 소문자(lowercase)로 쓴 이름과 주황색 화살표라고 해요. 대문자가 아니에요.","c":"F"},"h":"3c32aea925"},{"n":2,"t":"tf","q":"The arrow in Amazon’s logo shows that Amazon sells everything.","ko":"Amazon 로고의 화살표는 Amazon이 모든 것을 판다는 것을 보여 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"6~7번 문장","s":[[6,"First, the arrow starts at the letter a and ends at the letter z.","첫 번째는 화살표가 글자 ‘a’에서 시작하고 글자 ‘z’에서 끝난다."],[7,"This shows that Amazon sells everything.","이것은 Amazon이 모든 것을 판다는 것을 보여 준다."]],"w":"6번에서 화살표가 a에서 시작해 z에서 끝난다고 하고, 7번에서 이것이 Amazon이 모든 것을 판다는 것을 보여 준다고 해요.","c":"T"},"h":"34d72372a0"},{"n":3,"t":"tf","q":"Domino’s is the smallest pizza company in the world.","ko":"Domino’s는 세계에서 가장 작은 피자 회사이다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Domino’s, the largest pizza company in the world, also has a unique logo.","세계에서 가장 큰 피자 회사인 Domino’s(도미노스) 또한 독특한 로고를 가지고 있다."]],"w":"10번 문장에서 Domino’s는 세계에서 the largest(가장 큰) 피자 회사라고 해요. smallest(가장 작은)는 반대예요.","c":"F"},"h":"ca671e5f26"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The dots represent the company’s original three stores.)","ko":"그 점들은 회사의 세 개의 본점을 ____. (밑줄 친 단어의 뜻은?)","word":"represent","opts":["나타내다","사다","섞다","지우다"],"r":{"a":"1) 나타내다","ev":"12번 문장","s":[[12,"The dots represent the company’s original three stores.","그 점들은 회사의 세 개의 본점을 나타낸다."]],"w":"점 세 개가 무엇을 가리키는지 설명하는 문장이에요. represent = 나타내다, 의미하다예요.","c":1},"h":"6176fb777f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That was a good decision, because there are now about 20,000 stores!)","ko":"그것은 좋은 ____이었는데, 왜냐하면 지금은 약 20,000개의 점포가 있기 때문이다! (밑줄 친 단어의 뜻은?)","word":"decision","opts":["실수","질문","결정","광고"],"r":{"a":"3) 결정","ev":"14~15번 문장","s":[[14,"However, the company changed its mind.","하지만 그 회사는 생각을 바꿨다."],[15,"That was a good decision, because there are now about 20,000 stores!","그것은 좋은 결정이었는데, 왜냐하면 지금은 약 20,000개의 점포가 있기 때문이다!"]],"w":"14번에서 회사가 생각을 바꿨고, 15번에서 그것이 good decision이라고 해요. 마음을 정해서 내린 선택이니까 decision = 결정이에요.","c":3},"h":"098f570dae"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis shows that Amazon sells everything.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 Amazon이 모든 것을 판다는 것을 보여 준다.","opts":["Amazon이 고객을 행복하게 해 주고 싶어 하는 것","화살표가 글자 a에서 시작해 글자 z에서 끝나는 것","화살표가 구부러져 있는 것","로고가 소문자로 쓰여 있는 것"],"r":{"a":"2) 화살표가 글자 a에서 시작해 글자 z에서 끝나는 것","ev":"6~7번 문장","s":[[6,"First, the arrow starts at the letter a and ends at the letter z.","첫 번째는 화살표가 글자 ‘a’에서 시작하고 글자 ‘z’에서 끝난다."],[7,"This shows that Amazon sells everything.","이것은 Amazon이 모든 것을 판다는 것을 보여 준다."]],"w":"a부터 z까지 이어지는 화살표가 '모든 것을 판다'는 뜻이에요. 7번 This는 바로 앞 6번의 내용이에요. 고객을 행복하게 하려는 것은 두 번째 의미예요(8~9번).","c":2},"h":"125196b45d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Through its logo, a company shows what it is.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"로고를 통해, 회사는 자기가 어떤 회사인지 보여 준다.","opts":["로고는 회사가 무엇을 팔지 숨기기 위해 만든다.","회사는 로고를 보고 자기가 어떤 회사인지 정한다.","로고는 회사의 주소를 알려 준다.","회사는 로고를 통해 자신이 어떤 회사인지 보여 준다."],"r":{"a":"4) 회사는 로고를 통해 자신이 어떤 회사인지 보여 준다.","ev":"2번 문장","s":[[2,"Through its logo, a company shows what it is.","로고를 통해, 회사는 자기가 어떤 회사인지 보여 준다."]],"w":"Through는 '~을 통해', shows what it is는 '자기가 어떤 회사인지 보여 준다'예요. 로고가 회사의 정체를 보여 주는 도구라는 말이에요.","c":4},"h":"fb5c4d6ed4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Amazon’s logo has a blue arrow.","Domino’s logo has three dots because it has three kinds of pizza.","Amazon’s arrow is curved, so it looks like a smile.","Domino’s added a dot for every new store."],"r":{"a":"3) Amazon’s arrow is curved, so it looks like a smile.","ev":"8번 문장","s":[[8,"Second, the arrow is curved, so it looks like a smile.","두 번째는 화살표가 구부러져 있어서, 마치 미소처럼 보인다."]],"w":"8번 문장에서 Amazon의 화살표는 구부러져 있어서 미소처럼 보인다고 해요. 화살표는 주황색(4번), 점 세 개는 처음 가게 세 곳(12번), 점 추가는 하지 않기로 했어요(14번).","c":3},"oko":["Amazon의 로고에는 파란색 화살표가 있다.","Domino’s 로고에는 피자 종류가 세 가지라서 점이 세 개 있다.","Amazon의 화살표는 구부러져 있어서 미소처럼 보인다.","Domino’s는 새로운 가게마다 점을 추가했다."],"h":"44992d0350"},{"n":9,"t":"sum","q":"Amazon’s arrow shows that it sells (A), and Domino’s three dots stand for its original (B).","ko":"Amazon의 화살표는 (A)을(를) 판다는 것을 보여 주고, Domino’s의 점 세 개는 원래의 (B)을(를) 나타낸다.","opts":["(A) nothing / (B) stores","(A) everything / (B) pizzas","(A) books / (B) customers","(A) pizza / (B) stores","(A) everything / (B) stores"],"r":{"a":"5) (A) everything / (B) stores","ev":"7번, 12번 문장","s":[[7,"This shows that Amazon sells everything.","이것은 Amazon이 모든 것을 판다는 것을 보여 준다."],[12,"The dots represent the company’s original three stores.","그 점들은 회사의 세 개의 본점을 나타낸다."]],"w":"7번에서 화살표는 Amazon이 모든 것(everything)을 판다는 것을 보여 주고, 12번에서 점 세 개는 회사의 원래 가게(stores) 세 곳을 나타내요.","c":5},"oko":["(A) 아무것도 / (B) 가게","(A) 모든 것 / (B) 피자","(A) 책 / (B) 고객","(A) 피자 / (B) 가게","(A) 모든 것 / (B) 가게"],"h":"1087d279fb"},{"n":10,"t":"fill","q":"At first, Domino’s wanted to [A] a dot for every new store, but the company [B] its mind.","ko":"처음에 Domino’s는 새로운 가게마다 점을 [A]하고 싶어 했지만, 회사는 생각을 [B].","bank":["add","changed","wanted","decision","stores","largest"],"bko":{"add":"추가하다","changed":"바꿨다","wanted":"원했다","decision":"결정","stores":"가게들","largest":"가장 큰"},"r":{"a":"[A] add, [B] changed","ev":"13~14번 문장","s":[[13,"At first, Domino’s wanted to add a dot for every new store.","처음에 Domino’s는 모든 새로운 가게에 점을 추가하길 원했다."],[14,"However, the company changed its mind.","하지만 그 회사는 생각을 바꿨다."]],"w":"13번에서 처음에는 새 가게마다 점을 추가하고(add) 싶어 했고, 14번에서 회사가 생각을 바꿨다(changed its mind)고 해요.","c":null},"h":"06f0695896"}]},{"u":2,"id":"nl2-02-4","no":4,"ko":"망한 요리를 살리는 법","items":[{"n":1,"t":"tf","q":"Stéphanie worked as a chef in her hotel.","ko":"Stéphanie는 자신의 호텔에서 주방장으로 일했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Stéphanie worked as a chef in the hotel.","Stéphanie는 호텔에서 주방장으로 일했다."]],"w":"3번 문장에서 Stéphanie는 호텔에서 주방장(chef)으로 일했다고 해요.","c":"T"},"h":"2fe6c08410"},{"n":2,"t":"tf","q":"Stéphanie’s apple tart was not popular with hotel guests.","ko":"Stéphanie의 사과 타르트는 호텔 손님들에게 인기가 없었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Her tart was a big hit with hotel guests, as it was tender and sweet.","그녀의 타르트는 부드럽고 달콤해서 호텔의 손님들에게 큰 인기를 끌었다."]],"w":"5번 문장에서 그녀의 타르트는 부드럽고 달콤해서 호텔 손님들에게 big hit(큰 인기)였다고 해요.","c":"F"},"h":"b5203bfa21"},{"n":3,"t":"tf","q":"Stéphanie put the dough under the sliced apples.","ko":"Stéphanie는 반죽을 얇게 썬 사과 조각 아래에 놓았다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"She simply put the dough on top of the sliced apples!","그녀는 그냥 얇게 썬 사과 조각 위에 반죽을 올렸다!"]],"w":"10번 문장에서 반죽을 얇게 썬 사과 조각 위(on top of)에 올렸다고 해요. 아래가 아니에요.","c":"F"},"h":"a0836f4fa4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A slight mistake led to Stéphanie Tatin’s creation of a delicious dessert.)","ko":"____ 실수가 Stéphanie Tatin의 맛있는 디저트의 창조로 이어졌다. (밑줄 친 단어의 뜻은?)","word":"slight","opts":["거대한","위험한","사소한","유명한"],"r":{"a":"3) 사소한","ev":"1번 문장","s":[[1,"A slight mistake led to Stéphanie Tatin’s creation of a delicious dessert.","사소한 실수가 Stéphanie Tatin(스테파니 타탱)의 맛있는 디저트의 창조로 이어졌다."]],"w":"실수가 디저트를 만든 계기가 되었다는 흐름이에요. 반죽을 깜빡한 정도의 작은 실수이므로 slight = 약간의, 사소한이에요.","c":3},"h":"2debd804cc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Baking it in this way helped the apples absorb the sugar better.)","ko":"이러한 방식으로 타르트를 굽는 것은 사과가 설탕을 더 잘 ____ 데 도움이 되었다. (밑줄 친 단어의 뜻은?)","word":"absorb","opts":["흡수하다","거절하다","저장하다","섞다"],"r":{"a":"1) 흡수하다","ev":"12번 문장","s":[[12,"Baking it in this way helped the apples absorb the sugar better.","이러한 방식으로 타르트를 굽는 것은 사과가 설탕을 더 잘 흡수하는 데 도움이 되었다."]],"w":"설탕이 사과에 스며들어서 더 달고 맛있어졌다는 흐름이에요. absorb = 흡수하다, 빨아들이다예요.","c":1},"h":"788cd71c4a"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHer tart was a big hit with hotel guests, as it was tender and sweet.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그녀의 타르트는 부드럽고 달콤해서 호텔의 손님들에게 큰 인기를 끌었다.","opts":["호텔","그녀의 타르트","그녀의 여동생","호텔 손님"],"r":{"a":"2) 그녀의 타르트","ev":"5번 문장","s":[[5,"Her tart was a big hit with hotel guests, as it was tender and sweet.","그녀의 타르트는 부드럽고 달콤해서 호텔의 손님들에게 큰 인기를 끌었다."]],"w":"부드럽고 달콤하다고 묘사할 수 있는 것은 음식이에요. 문장 앞부분의 Her tart(그녀의 타르트)를 받아서 as it was tender and sweet라고 한 거예요.","c":2},"h":"fc49261248"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But many customers were waiting for the dish, so she couldn’t start over.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 많은 손님들이 그 요리를 기다리고 있어서 다시 시작할 수 없었다.","opts":["손님이 없어서 다시 시작해도 괜찮았다.","손님들이 기다리다 돌아가서 다시 시작했다.","요리가 늦어져서 손님들이 화를 냈다.","많은 손님이 기다리고 있어서 처음부터 다시 만들 수 없었다."],"r":{"a":"4) 많은 손님이 기다리고 있어서 처음부터 다시 만들 수 없었다.","ev":"8번 문장","s":[[8,"But many customers were waiting for the dish, so she couldn’t start over.","하지만 많은 손님들이 그 요리를 기다리고 있어서 다시 시작할 수 없었다."]],"w":"so는 '그래서'이고 couldn’t start over는 '다시 시작할 수 없었다'예요. 손님이 많이 기다리고 있다는 이유 때문에 처음부터 다시 만들 수 없었다는 뜻이에요.","c":4},"h":"5afa6ad3f3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Stéphanie ran a restaurant alone in Italy.","The new tart tasted richer and sweeter than her tarts before.","She baked the tart without any apples.","She made tarte Tatin by planning it carefully."],"r":{"a":"2) The new tart tasted richer and sweeter than her tarts before.","ev":"13번 문장","s":[[13,"Stéphanie’s new tart tasted richer and sweeter than ever!","Stéphanie의 새 타르트는 그 어느 때보다 맛이 더 풍부하고 달콤했다!"]],"w":"13번에서 새 타르트가 than ever(그 어느 때보다) 풍부하고 달콤했다고 해요. 그녀는 프랑스에서 여동생과 호텔을 운영했고(2번), 사과 조각을 사용했으며(7번), 실수에서 시작되었어요(1번).","c":2},"oko":["Stéphanie는 이탈리아에서 혼자 식당을 운영했다.","새 타르트는 이전의 타르트보다 맛이 더 풍부하고 달콤했다.","그녀는 사과 없이 타르트를 구웠다.","그녀는 신중하게 계획해서 타르트 타탱을 만들었다."],"h":"ed0c07bec4"},{"n":9,"t":"sum","q":"Stéphanie forgot the (A) by mistake and later put it on top of the apples. Baking in this way made a (B) tart, which became tarte Tatin.","ko":"Stéphanie는 실수로 (A)을(를) 잊었다가 나중에 그것을 사과 위에 올렸다. 이렇게 구운 방식은 (B) 타르트를 만들었고, 그것이 타르트 타탱이 되었다.","opts":["(A) sugar / (B) sweeter","(A) dough / (B) sourer","(A) apples / (B) colder","(A) sugar / (B) plainer","(A) dough / (B) sweeter"],"r":{"a":"5) (A) dough / (B) sweeter","ev":"6번, 10번, 13번 문장","s":[[6,"One day, Stéphanie was busy and forgot about the tart dough.","어느 날 Stéphanie는 바빠서 타르트 반죽을 잊어버렸다."],[10,"She simply put the dough on top of the sliced apples!","그녀는 그냥 얇게 썬 사과 조각 위에 반죽을 올렸다!"],[13,"Stéphanie’s new tart tasted richer and sweeter than ever!","Stéphanie의 새 타르트는 그 어느 때보다 맛이 더 풍부하고 달콤했다!"]],"w":"6번에서 Stéphanie는 타르트 반죽(dough)을 잊었고, 10번에서 반죽을 사과 위에 올렸으며, 13번에서 새 타르트가 더 달콤하다(sweeter)고 해요.","c":5},"oko":["(A) 설탕 / (B) 더 달콤한","(A) 반죽 / (B) 더 신","(A) 사과 / (B) 더 차가운","(A) 설탕 / (B) 더 평범한","(A) 반죽 / (B) 더 달콤한"],"h":"454366ec44"},{"n":10,"t":"fill","q":"When the tart was baked, she [A] it upside down and [B] it.","ko":"타르트가 구워지자 그녀는 그것을 거꾸로 [A] 그것을 [B].","bank":["flipped","served","tender","dough","creation","sweet"],"bko":{"flipped":"뒤집었고","served":"제공했다","tender":"부드러운","dough":"반죽","creation":"창조","sweet":"달콤한"},"r":{"a":"[A] flipped, [B] served","ev":"11번 문장","s":[[11,"When it was baked, she just flipped the tart upside down and served it.","그것이 구워졌을 때 그녀는 타르트를 거꾸로 뒤집어서 제공했다."]],"w":"11번 문장에서 구워진 뒤 타르트를 거꾸로 뒤집고(flipped) 손님에게 냈다(served)고 해요.","c":null},"h":"d808f4e02b"}]},{"u":3,"id":"nl2-03-1","no":1,"ko":"눈길에 필요한 이것!","items":[{"n":1,"t":"tf","q":"These chemicals can cause problems for fish if they flow into lakes and streams.","ko":"이런 화학 물질이 호수나 시내로 흘러 들어가면 물고기에게 문제를 일으킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"These chemicals can also cause problems for fish if they flow into lakes and streams.","또한 이런 화학 물질이 호수나 시내로 흘러 들어가면 물고기에게 문제를 일으킬 수 있다."]],"w":"4번 문장에 cause problems for fish(물고기에게 문제를 일으키다)가 그대로 나와요. flow(흐르다) into lakes and streams도 같아요.","c":"T"},"h":"37ff19cdb0"},{"n":2,"t":"tf","q":"Ecotraction is made from heating wires.","ko":"Ecotraction은 전열선으로 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"Another example is Ecotraction.","또 다른 예는 Ecotraction(에코트랙션)이다."],[8,"It is made from volcanic minerals.","그것은 화산 광물로 만들어진다."]],"w":"heating wires(전열선)는 6번에서 눈과 얼음을 녹이는 도로의 이야기예요. 7~8번에서 Ecotraction은 화산 광물(volcanic minerals)로 만들어진다고 해요.","c":"F"},"h":"8b8ee19073"},{"n":3,"t":"tf","q":"De-icing products help us walk and drive safely after winter storms.","ko":"제설제는 겨울 폭풍 이후에 우리가 안전하게 걷고 운전하게 도와준다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"De-icing products allow us to safely walk on sidewalks and drive on roads after winter storms.","제설제는 겨울 폭풍 이후에 우리가 안전하게 인도 위를 걷고 도로 위에서 운전할 수 있게 해 준다."]],"w":"1번 문장 allow us to safely walk … and drive …가 같은 내용이에요. allow(허락하다, ~하게 해 주다)가 help(돕다)와 비슷한 뜻이에요.","c":"T"},"h":"12d0007d98"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They contain chemicals that are bad for the soil.)","ko":"그것은 토양에 안 좋은 화학 물질을 □□ 있다.","opts":["~을 막다","~을 녹이다","~이 들어 있다","~을 피하다"],"word":"contain","r":{"a":"3) ~이 들어 있다","ev":"3번 문장","s":[[3,"They contain chemicals that are bad for the soil.","제설제는 토양에 안 좋은 화학 물질을 포함하고 있다."]],"w":"3번에서 제설제 안에 토양에 안 좋은 화학 물질이 ‘들어 있다’는 뜻이에요. contain = 포함하다, ~이 들어 있다.","c":3},"h":"97e333e769"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Fortunately, people have made alternatives to these harmful chemicals.)","ko":"다행히 사람들은 이러한 해로운 화학 물질의 □□을 만들어 왔다.","opts":["대안","원인","피해","경고"],"word":"alternatives","r":{"a":"1) 대안","ev":"5번 문장","s":[[5,"Fortunately, people have made alternatives to these harmful chemicals.","다행히 사람들은 이러한 해로운 화학 물질의 대안을 만들어 왔다."]],"w":"해로운 화학 물질 문제 다음에 Fortunately가 오고, 그 뒤에 전열선 도로와 Ecotraction이 나와요. 그러니 alternative는 ‘대신 쓸 수 있는 것, 대안’이에요.","c":1},"h":"db21962b44"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt prevents people and cars from sliding on slippery roads.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 사람들과 자동차가 미끄러운 도로에서 미끄러지지 않게 해 준다.","opts":["전열선이 있는 도로","제설제","화산 광물","Ecotraction(에코트랙션)"],"r":{"a":"4) Ecotraction(에코트랙션)","ev":"7~9번 문장","s":[[7,"Another example is Ecotraction.","또 다른 예는 Ecotraction(에코트랙션)이다."],[8,"It is made from volcanic minerals.","그것은 화산 광물로 만들어진다."],[9,"It prevents people and cars from sliding on slippery roads.","그것은 사람들과 자동차가 미끄러운 도로에서 미끄러지지 않게 해 준다."]],"w":"7번에서 Another example is Ecotraction이라고 하고, 8번 It is made from volcanic minerals도 같은 대상이에요. 9번 It도 Ecotraction이에요. 화산 광물은 Ecotraction의 재료일 뿐이에요.","c":4},"h":"6511d5a66d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"One example is a type of road with heating wires that can melt snow and ice.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"전열선이 들어 있어 눈과 얼음을 녹일 수 있는 도로 형태가 하나의 예이다.","opts":["눈과 얼음 때문에 전열선이 녹아 버리는 도로가 하나의 예이다.","전열선이 들어 있어 눈과 얼음을 녹일 수 있는 도로 형태가 하나의 예이다.","눈과 얼음 위에 전열선을 던져서 길을 만드는 것이 하나의 예이다.","전열선을 도로 밖에 걸어 두어 눈이 쌓이지 않게 하는 것이 하나의 예이다."],"r":{"a":"2) 전열선이 들어 있어 눈과 얼음을 녹일 수 있는 도로 형태가 하나의 예이다.","ev":"6번 문장","s":[[6,"One example is a type of road with heating wires that can melt snow and ice.","눈과 얼음을 녹일 수 있는 전열선이 있는 도로의 형태가 하나의 예이다."]],"w":"that can melt snow and ice는 heating wires를 꾸며서, 전열선이 눈과 얼음을 녹인다는 뜻이에요. 전열선이 녹는 게 아니에요.","c":2},"h":"7e0849903e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Ecotraction은 토양에 해롭다.","제설제는 호수의 물고기에게 안전하다.","전열선이 있는 도로는 눈 위에 화학 물질을 뿌린다.","Ecotraction은 환경에 해가 없다."],"opts":["Ecotraction is harmful to the soil.","De-icing products are safe for fish in lakes.","A road with heating wires covers snow with chemicals.","Ecotraction is harmless to the environment."],"r":{"a":"4) Ecotraction is harmless to the environment.","ev":"4, 6, 10번 문장","s":[[4,"These chemicals can also cause problems for fish if they flow into lakes and streams.","또한 이런 화학 물질이 호수나 시내로 흘러 들어가면 물고기에게 문제를 일으킬 수 있다."],[6,"One example is a type of road with heating wires that can melt snow and ice.","눈과 얼음을 녹일 수 있는 전열선이 있는 도로의 형태가 하나의 예이다."],[10,"And it is harmless to the environment!","그리고 그것은 환경에 무해하다!"]],"w":"10번에서 Ecotraction은 환경에 harmless(무해)하다고 해요. 물고기에게 문제를 일으키는 것은 제설제의 화학 물질이고(4번), 전열선 도로는 열로 눈과 얼음을 녹여요(6번).","c":4},"h":"32d2b173ec"},{"n":9,"t":"sum","q":"De-icing products (A) the environment, so people have made (B) such as heated roads and Ecotraction.","ko":"제설제는 환경에 (A)해서, 사람들은 열선 도로와 Ecotraction 같은 (B)을 만들어 왔다.","oko":["(A) 도움이 된다 / (B) 대안","(A) 해를 끼친다 / (B) 문제","(A) 보호한다 / (B) 화학 물질","(A) 깨끗하게 한다 / (B) 폭풍","(A) 해를 끼친다 / (B) 대안"],"opts":["(A) help / (B) alternatives","(A) harm / (B) problems","(A) protect / (B) chemicals","(A) clean / (B) storms","(A) harm / (B) alternatives"],"r":{"a":"5) (A) harm / (B) alternatives","ev":"2, 5~7번 문장","s":[[2,"However, they harm the environment.","그러나 제설제는 환경에 해를 끼친다."],[5,"Fortunately, people have made alternatives to these harmful chemicals.","다행히 사람들은 이러한 해로운 화학 물질의 대안을 만들어 왔다."],[6,"One example is a type of road with heating wires that can melt snow and ice.","눈과 얼음을 녹일 수 있는 전열선이 있는 도로의 형태가 하나의 예이다."],[7,"Another example is Ecotraction.","또 다른 예는 Ecotraction(에코트랙션)이다."]],"w":"2번에서 제설제는 환경에 해를 끼치고(harm), 5번에서 그 대안(alternatives)을 만들어 왔다고 해요. 6~7번이 그 예예요.","c":5},"h":"ce68919b05"},{"n":10,"t":"fill","q":"Ecotraction, made from [A] minerals, [B] people and cars from sliding on slippery roads.","ko":"[A] 광물로 만들어진 Ecotraction은 사람들과 자동차가 미끄러운 도로에서 미끄러지는 것을 [B].","bank":["volcanic","prevents","harmful","slippery","melts","allows"],"bko":{"volcanic":"화산의","prevents":"막아 준다","harmful":"해로운","slippery":"미끄러운","melts":"녹인다","allows":"허락한다"},"r":{"a":"[A] volcanic, [B] prevents","ev":"8~9번 문장","s":[[8,"It is made from volcanic minerals.","그것은 화산 광물로 만들어진다."],[9,"It prevents people and cars from sliding on slippery roads.","그것은 사람들과 자동차가 미끄러운 도로에서 미끄러지지 않게 해 준다."]],"w":"8번에서 volcanic minerals로 만들어지고, 9번에서 prevent A from v-ing(A가 ~하는 것을 막다)라고 해요. slippery는 도로를 꾸미는 말이라 광물에 맞지 않아요.","c":null},"h":"599140384c"}]},{"u":3,"id":"nl2-03-2","no":2,"ko":"한번 꽂히면 계속 생각날걸","items":[{"n":1,"t":"tf","q":"The shopper thinks the shoes for $150 are too expensive.","ko":"쇼핑하는 사람은 150달러짜리 신발이 너무 비싸다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"Imagine you go shopping and find cool shoes for $150.","당신이 쇼핑하러 가서 150달러짜리의 멋진 신발을 찾았다고 상상해 봐라."],[2,"You think they are too expensive.","당신은 그것이 너무 비싸다고 생각한다."]],"w":"1번에서 150달러짜리 신발을 찾고, 2번에서 You think they are too expensive라고 해요.","c":"T"},"h":"dd7bb2708c"},{"n":2,"t":"tf","q":"The shopper buys the shoes for $150.","ko":"쇼핑하는 사람은 150달러짜리 신발을 산다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"Next, you see different shoes for $80.","다음으로 당신은 80달러짜리의 다른 신발을 본다."],[4,"You think they’re pretty cheap, so you buy them.","당신은 그것이 꽤 싸다고 생각해서 그것을 구입한다."]],"w":"150달러 신발은 너무 비싸다고 했어요(2번). 3~4번에서 80달러짜리 다른 신발을 보고 꽤 싸다고 생각해서 그것을 사요.","c":"F"},"h":"947d4078ee"},{"n":3,"t":"tf","q":"The anchoring effect occurs when people make decisions based on the first information they receive.","ko":"닻 내림 효과는 사람들이 받은 첫 번째 정보에 근거해 결정을 내릴 때 일어난다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The anchoring effect occurs when people make decisions based on the first information they receive.","닻 내림 효과는 사람들이 받은 첫 번째 정보에 근거하여 결정을 내릴 때 일어난다."]],"w":"6번 문장을 그대로 옮긴 내용이에요. first information(첫 번째 정보)에 근거해 결정을 내리는 것이 닻 내림 효과예요.","c":"T"},"h":"1217366a27"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The anchoring effect occurs when people make decisions based on the first information they receive.)","ko":"닻 내림 효과는 사람들이 처음 받은 정보에 근거하여 결정을 내릴 때 □□□.","opts":["사라진다","일어난다","멈춘다","퍼진다"],"word":"occurs","r":{"a":"2) 일어난다","ev":"6번 문장","s":[[6,"The anchoring effect occurs when people make decisions based on the first information they receive.","닻 내림 효과는 사람들이 받은 첫 번째 정보에 근거하여 결정을 내릴 때 일어난다."]],"w":"when 이하 상황에서 닻 내림 효과가 ‘생긴다, 일어난다’는 뜻이에요. occur = 일어나다, 발생하다.","c":2},"h":"cf89da118b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Stores often use the anchoring effect by showing the discounted price above the original price.)","ko":"상점들은 흔히 정가 위에 □□□ 가격을 보여 줌으로써 닻 내림 효과를 이용한다.","opts":["숨겨진","올라간","추가된","할인된"],"word":"discounted","r":{"a":"4) 할인된","ev":"8번 문장","s":[[8,"Stores often use the anchoring effect by showing the discounted price above the original price.","상점들은 흔히 정가 위에 할인된 가격을 보여 줌으로써 닻 내림 효과를 이용한다."]],"w":"original price(정가)와 나란히 쓰여, 값을 깎아 준 가격이라는 뜻이에요. discount(할인하다)의 -ed형으로 ‘할인된’이에요.","c":4},"h":"4bcd499410"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIn other words, they become “anchored” to this information.","ko":"밑줄 친 they가 가리키는 것은?","sko":"다시 말해서, 그들은 이 정보에 ‘닻을 내리게’ 된다.","opts":["사람들","상점들","신발들","결정들"],"r":{"a":"1) 사람들","ev":"6~7번 문장","s":[[6,"The anchoring effect occurs when people make decisions based on the first information they receive.","닻 내림 효과는 사람들이 받은 첫 번째 정보에 근거하여 결정을 내릴 때 일어난다."],[7,"In other words, they become “anchored” to this information.","다시 말해서, 그들은 이 정보에 ‘닻을 내리게’ 된다."]],"w":"6번에서 정보를 받고 결정을 내리는 주체는 people(사람들)이에요. 7번 they는 그 사람들이에요.","c":1},"h":"d410312094"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, consumers are more likely to buy the item, and stores make more money.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로 소비자들은 그 상품을 살 가능성이 더 높고, 상점들은 더 많은 돈을 번다.","opts":["소비자들은 그 상품을 사지 않게 되고, 상점들은 돈을 잃는다.","소비자들은 그 상품을 살 가능성이 더 높아지고, 상점들은 더 많은 돈을 번다.","소비자들은 그 상품을 꼭 사야 하고, 상점들은 가격을 내려야 한다.","소비자들은 그 상품을 살 가능성이 높지만, 상점들이 버는 돈은 같다."],"r":{"a":"2) 소비자들은 그 상품을 살 가능성이 더 높아지고, 상점들은 더 많은 돈을 번다.","ev":"10번 문장","s":[[10,"As a result, consumers are more likely to buy the item, and stores make more money.","결과적으로 소비자들은 그 상품을 살 가능성이 더 높고 상점들은 더 많은 돈을 번다."]],"w":"be likely to-v는 ‘~할 가능성이 높다’이고, make more money는 ‘더 많은 돈을 벌다’예요.","c":2},"h":"50b808698e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["80달러 신발이 쇼핑하는 사람에게 비싸게 느껴진다.","상점들은 할인된 가격 위에 정가를 보여 준다.","쇼핑하는 사람은 쇼핑 중에 닻 내림 효과를 경험한다.","닻 내림 효과는 사람들이 첫 정보를 무시하게 만든다."],"opts":["The $80 shoes seem expensive to the shopper.","Stores show the original price above the discounted price.","The shopper experiences the anchoring effect while shopping.","The anchoring effect makes people ignore the first information."],"r":{"a":"3) The shopper experiences the anchoring effect while shopping.","ev":"4~6, 8번 문장","s":[[4,"You think they’re pretty cheap, so you buy them.","당신은 그것이 꽤 싸다고 생각해서 그것을 구입한다."],[5,"You have just experienced the anchoring effect!","당신은 방금 닻 내림 효과를 경험하였다!"],[6,"The anchoring effect occurs when people make decisions based on the first information they receive.","닻 내림 효과는 사람들이 받은 첫 번째 정보에 근거하여 결정을 내릴 때 일어난다."],[8,"Stores often use the anchoring effect by showing the discounted price above the original price.","상점들은 흔히 정가 위에 할인된 가격을 보여 줌으로써 닻 내림 효과를 이용한다."]],"w":"5번에서 신발 이야기가 닻 내림 효과의 경험이라고 해요. 80달러 신발은 꽤 싸다고 했고(4번), 할인가가 정가 위에 있어요(8번). 첫 정보에 닻을 내리는 거지 무시하는 게 아니에요(6~7번).","c":3},"h":"ac3102e2ed"},{"n":9,"t":"sum","q":"The anchoring effect means that people make decisions based on the (A) information they receive. Stores use it by showing the (B) price above the original price.","ko":"닻 내림 효과는 사람들이 받은 (A) 정보에 근거해 결정을 내리는 것이다. 상점들은 정가 위에 (B) 가격을 보여 줌으로써 이를 이용한다.","oko":["(A) 마지막 / (B) 할인된","(A) 첫 번째 / (B) 정가의","(A) 가짜 / (B) 비싼","(A) 마지막 / (B) 정가의","(A) 첫 번째 / (B) 할인된"],"opts":["(A) last / (B) discounted","(A) first / (B) original","(A) false / (B) expensive","(A) last / (B) original","(A) first / (B) discounted"],"r":{"a":"5) (A) first / (B) discounted","ev":"6, 8번 문장","s":[[6,"The anchoring effect occurs when people make decisions based on the first information they receive.","닻 내림 효과는 사람들이 받은 첫 번째 정보에 근거하여 결정을 내릴 때 일어난다."],[8,"Stores often use the anchoring effect by showing the discounted price above the original price.","상점들은 흔히 정가 위에 할인된 가격을 보여 줌으로써 닻 내림 효과를 이용한다."]],"w":"6번에서 the first information(첫 번째 정보), 8번에서 정가 위에 the discounted price(할인된 가격)를 보여 준다고 해요.","c":5},"h":"14307dcb6f"},{"n":10,"t":"fill","q":"The shopper thinks the $150 shoes are too [A], but the $80 shoes are pretty [B], so the shopper buys the $80 shoes.","ko":"쇼핑하는 사람은 150달러 신발은 너무 [A]고, 80달러 신발은 꽤 [B]다고 생각해서 80달러 신발을 산다.","bank":["expensive","cheap","price","decide","buy","experience"],"bko":{"expensive":"비싼","cheap":"싼","price":"가격","decide":"결정하다","buy":"사다","experience":"경험"},"r":{"a":"[A] expensive, [B] cheap","ev":"2~4번 문장","s":[[2,"You think they are too expensive.","당신은 그것이 너무 비싸다고 생각한다."],[3,"Next, you see different shoes for $80.","다음으로 당신은 80달러짜리의 다른 신발을 본다."],[4,"You think they’re pretty cheap, so you buy them.","당신은 그것이 꽤 싸다고 생각해서 그것을 구입한다."]],"w":"2번에서 150달러 신발은 too expensive, 4번에서 80달러 신발은 pretty cheap이라고 하고 그래서 사요.","c":null},"h":"7e86144be5"}]},{"u":3,"id":"nl2-03-3","no":3,"ko":"희귀병을 가진 식물이 있다고?","items":[{"n":1,"t":"tf","q":"Albinism affects both people and animals.","ko":"백색증은 사람과 동물 모두에게 발병한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It affects both people and animals.","그것은 사람과 동물 모두에게 발병한다."]],"w":"2번 문장 It affects both people and animals가 그대로 나와요.","c":"T"},"h":"3e0ee67fce"},{"n":2,"t":"tf","q":"Plants cannot be affected by albinism.","ko":"식물은 백색증에 걸릴 수 없다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Surprisingly, plants can be affected by albinism as well!","놀랍게도, 식물 역시 백색증이 발병할 수 있다!"]],"w":"5번에서 Surprisingly, plants can be affected by albinism as well이라고 해요. 식물도 걸릴 수 있어요.","c":"F"},"h":"951f8a031c"},{"n":3,"t":"tf","q":"Albino redwoods remove toxins from the soil.","ko":"백색증에 걸린 삼나무는 토양에서 독소를 제거한다.","r":{"a":"T (본문과 맞는 내용)","ev":"15번 문장","s":[[15,"They remove toxins from the soil.","그것은 토양에서 독소를 제거한다."]],"w":"15번 문장 They remove toxins from the soil에서 They는 백색증 삼나무예요.","c":"T"},"h":"5cacba7ef8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The albino redwoods survive by attaching their roots to the roots of other trees.)","ko":"백색증에 걸린 삼나무는 자신의 뿌리를 다른 나무의 뿌리에 □□□ 살아남는다.","opts":["자르는 것","뽑는 것","붙이는 것","심는 것"],"word":"attaching","r":{"a":"3) 붙이는 것","ev":"11번 문장","s":[[11,"The albino redwoods survive by attaching their roots to the roots of other trees.","백색증에 걸린 삼나무는 자신의 뿌리를 다른 나무의 뿌리에 붙임으로써 살아남는다."]],"w":"뿌리를 다른 나무 뿌리에 붙여서 영양분을 얻는다는 내용이에요(12번). attach A to B는 ‘A를 B에 붙이다’예요.","c":3},"h":"ae2827f323"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They remove toxins from the soil.)","ko":"그것은 토양에서 독소를 □□□.","opts":["제거하다","만들다","더하다","모으다"],"word":"remove","r":{"a":"1) 제거하다","ev":"14~15번 문장","s":[[14,"But the albino redwoods help the other trees, too.","하지만 백색증에 걸린 삼나무는 다른 나무들을 돕기도 한다."],[15,"They remove toxins from the soil.","그것은 토양에서 독소를 제거한다."]],"w":"14번에서 다른 나무를 돕는다고 했고, 15번은 그 방법이에요. 독소를 흙에서 없애야 나무들이 살아남을 수 있어요(16번). remove = 제거하다, 없애다.","c":1},"h":"7f7c9f1061"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThis allows them to get the nutrients they need.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이는 그것이 필요한 영양분을 얻게 해 준다.","opts":["다른 나무들","백색증에 걸린 삼나무","뿌리들","영양분"],"r":{"a":"2) 백색증에 걸린 삼나무","ev":"11~12번 문장","s":[[11,"The albino redwoods survive by attaching their roots to the roots of other trees.","백색증에 걸린 삼나무는 자신의 뿌리를 다른 나무의 뿌리에 붙임으로써 살아남는다."],[12,"This allows them to get the nutrients they need.","이는 그것이 필요한 영양분을 얻게 해 준다."]],"w":"11번에서 뿌리를 붙여 살아남는 것은 the albino redwoods예요. 12번 them은 그 삼나무이고, 그들이 필요한 영양분을 얻는 거예요.","c":2},"h":"c7769edd96"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You may think these trees are parasites because they take nutrients from the trees around them.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신은 이 나무가 주변의 나무로부터 영양분을 빼앗기 때문에 기생충이라고 생각할 수도 있다.","opts":["당신은 이 나무들이 주변 나무에게 영양분을 나눠 주기 때문에 기생충이라고 생각할 수도 있다.","당신은 이 나무들이 기생충 때문에 영양분을 얻지 못한다고 생각할 수도 있다.","당신은 주변 나무들이 이 나무의 영양분을 가져가서 기생충이라고 생각할 수도 있다.","당신은 이 나무들이 주변 나무에서 영양분을 가져가기 때문에 기생충이라고 생각할 수도 있다."],"r":{"a":"4) 당신은 이 나무들이 주변 나무에서 영양분을 가져가기 때문에 기생충이라고 생각할 수도 있다.","ev":"13번 문장","s":[[13,"You may think these trees are parasites because they take nutrients from the trees around them.","당신은 이 나무가 주변의 나무로부터 영양분을 빼앗기 때문에 기생충이라고 생각할 수도 있다."]],"w":"take nutrients from the trees around them은 주변 나무에서 영양분을 가져간다는 뜻이에요. 영양분을 가져가는 쪽이 백색증 삼나무라서 기생충이라고 생각할 수 있다는 말이에요.","c":4},"h":"c393d5df9e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["백색증에 걸린 삼나무는 다른 나무의 뿌리에 자기 뿌리를 붙인다.","백색증에 걸린 식물은 보통 다른 식물보다 오래 산다.","백색증에 걸린 삼나무의 잎은 겨울에도 초록색이다.","엽록소는 식물이 영양분을 만드는 것을 막는다."],"opts":["Albino redwoods attach their roots to the roots of other trees.","Albino plants usually live longer than other plants.","The leaves of albino redwoods are green in winter.","Chlorophyll prevents plants from making nutrients."],"r":{"a":"1) Albino redwoods attach their roots to the roots of other trees.","ev":"6~7, 10~11번 문장","s":[[6,"Plants with albinism don’t have any chlorophyll, which helps plants make nutrients.","백색증에 걸린 식물은 엽록소를 가지고 있지 않은데, 그것(엽록소)은 식물이 영양분을 만드는 것을 돕는다."],[7,"For this reason, most albino plants have short lives.","이러한 이유로, 대부분의 백색증에 걸린 식물은 수명이 짧다."],[10,"They have white leaves that turn brown in winter.","그것들은 겨울에 갈색으로 변하는 흰색 잎을 가지고 있다."],[11,"The albino redwoods survive by attaching their roots to the roots of other trees.","백색증에 걸린 삼나무는 자신의 뿌리를 다른 나무의 뿌리에 붙임으로써 살아남는다."]],"w":"11번에서 백색증 삼나무는 뿌리를 다른 나무의 뿌리에 붙여요. 대부분의 백색증 식물은 수명이 짧고(7번), 잎은 겨울에 갈색으로 변하며(10번), 엽록소는 영양분 만드는 것을 도와요(6번).","c":1},"h":"146b92943d"},{"n":9,"t":"sum","q":"Plants with albinism have no (A), so most of them have short lives. But albino redwoods survive by getting nutrients through the (B) of other trees.","ko":"백색증 식물은 (A)가 없어서 대부분 수명이 짧다. 하지만 백색증 삼나무는 다른 나무의 (B)을 통해 영양분을 얻어 살아남는다.","oko":["(A) 깃털 / (B) 잎","(A) 피부 / (B) 뿌리","(A) 엽록소 / (B) 뿌리","(A) 엽록소 / (B) 잎","(A) 독소 / (B) 뿌리"],"opts":["(A) feathers / (B) leaves","(A) skin / (B) roots","(A) chlorophyll / (B) roots","(A) chlorophyll / (B) leaves","(A) toxins / (B) roots"],"r":{"a":"3) (A) chlorophyll / (B) roots","ev":"6~7, 11번 문장","s":[[6,"Plants with albinism don’t have any chlorophyll, which helps plants make nutrients.","백색증에 걸린 식물은 엽록소를 가지고 있지 않은데, 그것(엽록소)은 식물이 영양분을 만드는 것을 돕는다."],[7,"For this reason, most albino plants have short lives.","이러한 이유로, 대부분의 백색증에 걸린 식물은 수명이 짧다."],[11,"The albino redwoods survive by attaching their roots to the roots of other trees.","백색증에 걸린 삼나무는 자신의 뿌리를 다른 나무의 뿌리에 붙임으로써 살아남는다."]],"w":"6~7번에서 엽록소(chlorophyll)가 없어서 수명이 짧다고 하고, 11번에서 뿌리(roots)를 다른 나무의 뿌리에 붙여 살아남는다고 해요.","c":3},"h":"dd5d5f37bd"},{"n":10,"t":"fill","q":"Albino redwoods [A] toxins from the soil, so all of the trees in the area can [B].","ko":"백색증에 걸린 삼나무는 토양에서 독소를 [A]서, 그 지역의 모든 나무가 [B] 수 있다.","bank":["remove","survive","attach","affect","produce","change"],"bko":{"remove":"제거하다","survive":"살아남다","attach":"붙이다","affect":"영향을 미치다","produce":"만들어 내다","change":"변하다"},"r":{"a":"[A] remove, [B] survive","ev":"15~16번 문장","s":[[15,"They remove toxins from the soil.","그것은 토양에서 독소를 제거한다."],[16,"As a result, all of the trees in the area can survive.","결과적으로 그 지역의 모든 나무가 살아남을 수 있다."]],"w":"15번 They remove toxins from the soil, 16번 all of the trees in the area can survive에서 가져왔어요. produce toxins는 본문과 반대 내용이에요.","c":null},"h":"ccb78d9511"}]},{"u":3,"id":"nl2-03-4","no":4,"ko":"옛날에는 물감을 어떻게 보관했을까?","items":[{"n":1,"t":"tf","q":"Long ago, artists kept their paint in pig bladders.","ko":"오래전에 화가들은 물감을 돼지 방광에 보관했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Long ago, artists stored their paint in pig bladders.","오래전에 화가들은 물감을 돼지 방광에 보관했다."]],"w":"1번 문장에 stored their paint in pig bladders가 나와요. store(보관하다)와 keep(두다, 유지하다)이 비슷한 뜻이에요.","c":"T"},"h":"44721023c5"},{"n":2,"t":"tf","q":"Rand’s metal tubes made the paint dry out quickly.","ko":"Rand의 금속 튜브는 물감이 빠르게 마르게 했다.","r":{"a":"F (본문과 다른 내용)","ev":"2, 8번 문장","s":[[2,"But the bladders were hard to carry, and the paint dried out quickly.","하지만 방광은 가지고 다니기 어려웠고 물감은 빠르게 말라버렸다."],[8,"They were easy to carry and kept paint moist.","그것들은 가지고 다니기 쉽고 물감을 촉촉하게 유지해 줬다."]],"w":"물감이 빨리 마른 것은 방광을 쓸 때예요(2번). 금속 튜브는 물감을 촉촉하
