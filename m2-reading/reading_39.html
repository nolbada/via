.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Aloha! Welcome to Hawaii! Aloha mean “hello” or “goodbye” in the Hawaiian languages.", "ko": "알로하! 하와이에 오신 것을 환영해요! ‘알로하’는 하와이어로 ‘안녕하세요’ 또는 ‘안녕히 가세요’라는 뜻이에요.", "ok": false, "foot": [], "fixes": [{"wrong": "mean", "right": "means", "partial": false, "at": [5], "point": "수일치: 주어 Aloha(3인칭 단수)에 맞춰 동사 means 사용", "topic": "수일치", "memo": "주어 Aloha(3인칭 단수)에 맞춰 동사 means 사용"}, {"wrong": "languages", "right": "language", "partial": false, "at": [12], "point": "어휘: 하와이어라는 특정 언어를 가리키므로 단수 language 사용", "topic": "어휘", "memo": "하와이어라는 특정 언어를 가리키므로 단수 language 사용"}]}, {"n": 2, "tag": null, "en": "I’m Malia, and I’m your hula teacher for today.", "ko": "저는 Malia이고 오늘 당신의 훌라 선생님이에요.", "ok": true, "foot": [], "fixes": []}, {"n": 3, "tag": null, "en": "Have you hear of hula before?", "ko": "훌라에 대해 전에 들어 본 적이 있나요?", "ok": false, "foot": [], "fixes": [{"wrong": "hear", "right": "heard", "partial": false, "at": [2], "point": "현재완료 의문문: Have + 주어 + 과거분사(heard) 사용", "topic": "현재완료 의문문", "memo": "Have + 주어 + 과거분사(heard) 사용"}]}, {"n": 4, "tag": null, "en": "How many do you know about hula?", "ko": "훌라에 대해 얼마나 알고 있나요?", "ok": false, "foot": [], "fixes": [{"wrong": "many", "right": "much", "partial": false, "at": [1], "point": "어휘: 아는 정도(양)를 물을 때는 How much 사용 (How many는 셀 수 있는 명사의 개수)", "topic": "어휘", "memo": "아는 정도(양)를 물을 때는 How much 사용 (How many는 셀 수 있는 명사의 개수)"}]}, {"n": 5, "tag": null, "en": "Before we start our lesson, I want telling you about it.", "ko": "수업을 시작하기 전에 그것에 대해 말씀드리고 싶어요.", "ok": false, "foot": [], "fixes": [{"wrong": "telling", "right": "to tell", "partial": false, "at": [7], "point": "동명사 vs to부정사: want는 목적어로 to부정사(to tell)를 취함", "topic": "동명사 vs to부정사", "memo": "want는 목적어로 to부정사(to tell)를 취함"}]}, {"n": 6, "tag": null, "en": "Hula is a traditionally dance from Hawaii, and it have been a part of Hawaiian life for a long time.", "ko": "훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요.", "ok": false, "foot": [], "fixes": [{"wrong": "traditionally", "right": "traditional", "partial": false, "at": [3], "point": "어법: 명사(dance) 앞을 꾸미므로 형용사 traditional 사용 (traditionally는 부사)", "topic": "어법", "memo": "명사(dance) 앞을 꾸미므로 형용사 traditional 사용 (traditionally는 부사)"}, {"wrong": "have", "right": "has", "partial": false, "at": [9], "point": "수일치: 주어 it(단수)에 맞춰 동사 has 사용", "topic": "수일치", "memo": "주어 it(단수)에 맞춰 동사 has 사용"}]}, {"n": 7, "tag": null, "en": "The early Hawaiians, which didn’t have a writing system, used hula to tell stories.", "ko": "초기 하와이인들은 문자가 없었기 때문에, 이야기를 전하기 위해 훌라를 사용했어요.", "ok": false, "foot": [], "fixes": [{"wrong": "which", "right": "who", "partial": false, "at": [3], "point": "주격 관계대명사: 선행사가 사람 (Hawaiians)이므로 관계대명사 who 사용", "topic": "주격 관계대명사", "memo": "선행사가 사람 (Hawaiians)이므로 관계대명사 who 사용"}]}, {"n": 8, "tag": null, "en": "Hula is a language through body movements, and it has passed down stories from one generation to the next.", "ko": "훌라는 몸의 움직임을 통한 언어로, 한 세대에서 다음 세대로 이야기를 전해 왔습니다.", "ok": true, "foot": [], "fixes": []}, {"n": 9, "tag": null, "en": "Now it’s time to dancing!", "ko": "이제 춤을 출 시간이에요!", "ok": false, "foot": [], "fixes": [{"wrong": "dancing", "right": "dance", "partial": false, "at": [4], "point": "to부정사: it’s time to 뒤에는 동사원형 dance 사용", "topic": "to부정사", "memo": "it’s time to 뒤에는 동사원형 dance 사용"}]}, {"n": 10, "tag": null, "en": "Remember that you became a storyteller when you dance hula.", "ko": "훌라를 출 때는 당신이 이야기꾼이 된다는 것을 기억하세요.", "ok": false, "foot": [], "fixes": [{"wrong": "became", "right": "become", "partial": false, "at": [3], "point": "시제: 훌라를 출 때마다 반복되는 사실이므로 현재시제 become 사용", "topic": "시제", "memo": "훌라를 출 때마다 반복되는 사실이므로 현재시제 become 사용"}]}, {"n": 11, "tag": null, "en": "You tell a story with your hand, feet, and hips.", "ko": "당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요.", "ok": false, "foot": [], "fixes": [{"wrong": "hand", "right": "hands", "partial": false, "at": [6], "point": "병렬구조/수일치: feet, hips와 같이 나열되므로 복수형 hands 사용", "topic": "병렬구조/수일치", "memo": "feet, hips와 같이 나열되므로 복수형 hands 사용"}]}, {"n": 12, "tag": null, "en": "Oh, you needs to take off your shoe and socks!", "ko": "아, 신발과 양말을 벗어야 해요!", "ok": false, "foot": [], "fixes": [{"wrong": "needs", "right": "need", "partial": false, "at": [2], "point": "수일치: 주어 you에는 동사원형 need 사용", "topic": "수일치", "memo": "주어 you에는 동사원형 need 사용"}, {"wrong": "shoe", "right": "shoes", "partial": false, "at": [7], "point": "어휘/수일치: 신발은 짝을 이루므로 복수형 shoes 사용", "topic": "어휘/수일치", "memo": "신발은 짝을 이루므로 복수형 shoes 사용"}]}, {"n": 13, "tag": null, "en": "Hula is always did barefoot.", "ko": "훌라는 항상 맨발로 해요.", "ok": false, "foot": [], "fixes": [{"wrong": "did", "right": "done", "partial": false, "at": [3], "point": "수동태: be동사(is) + 과거분사(done) 사용", "topic": "수동태", "memo": "be동사(is) + 과거분사(done) 사용"}]}, {"n": 14, "tag": null, "en": "Let’s starting with the hand gestures.", "ko": "손동작부터 시작할게요.", "ok": false, "foot": [], "fixes": [{"wrong": "starting", "right": "start", "partial": false, "at": [1], "point": "어법: Let’s 뒤에는 동사원형 start 사용", "topic": "어법", "memo": "Let’s 뒤에는 동사원형 start 사용"}]}, {"n": 15, "tag": null, "en": "Every gesture in hula have a meaning.", "ko": "훌라의 모든 동작에는 의미가 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "have", "right": "has", "partial": false, "at": [4], "point": "수일치: Every + 단수명사(gesture) 뒤에는 단수동사 has 사용", "topic": "수일치", "memo": "Every + 단수명사(gesture) 뒤에는 단수동사 has 사용"}]}, {"n": 16, "tag": null, "en": "Wave your fingers while you moving your arms up and down.", "ko": "팔을 위아래로 움직이면서 손가락을 흔들어 보세요.", "ok": false, "foot": [], "fixes": [{"wrong": "moving", "right": "move", "partial": false, "at": [5], "point": "어법: while + 주어 + 동사의 완전한 절이 이어져야 하므로 move 사용", "topic": "어법", "memo": "while + 주어 + 동사의 완전한 절이 이어져야 하므로 move 사용"}]}, {"n": 17, "tag": null, "en": "This gesture is called ua in the Hawaii language, and it meaning “rain.”", "ko": "이 동작은 하와이어로 ‘ua’라고 불리고, ‘비’를 뜻해요.", "ok": false, "foot": ["1ua 하와이어로 ‘비’라는 뜻"], "fixes": [{"wrong": "Hawaii", "right": "Hawaiian", "partial": false, "at": [7], "point": "어휘: ‘하와이의’라는 뜻의 형용사 Hawaiian 사용 (Hawaii는 명사)", "topic": "어휘", "memo": "‘하와이의’라는 뜻의 형용사 Hawaiian 사용 (Hawaii는 명사)"}, {"wrong": "meaning", "right": "means", "partial": false, "at": [11], "point": "수일치/어법: 주어 it 뒤에는 동사 means 필요(meaning은 명사/분사)", "topic": "수일치/어법", "memo": "주어 it 뒤에는 동사 means 필요(meaning은 명사/분사)"}]}, {"n": 18, "tag": null, "en": "What about the sun? Hawaiians make a circles with their arms above their heads.", "ko": "태양은 어떨까요? 하와이 사람들은 팔을 머리 위로 올려 원을 만들어요.", "ok": false, "foot": [], "fixes": [{"wrong": "circles", "right": "circle", "partial": false, "at": [7], "point": "관사: 부정관사 a 뒤에는 단수명사 circle 사용", "topic": "관사", "memo": "부정관사 a 뒤에는 단수명사 circle 사용"}]}, {"n": 19, "tag": null, "en": "That’s ka lā, the “sun.” These gestures are such simple that you can easily remember them.", "ko": "그것이 ‘태양’인 ‘ka lā’예요. 이 동작들은 매우 간단해서 당신은 그것들을 쉽게 기억할 수 있어요.", "ok": false, "foot": ["1ka lā 하와이어로 ‘태양’이라는 뜻"], "fixes": [{"wrong": "such", "right": "so", "partial": false, "at": [8], "point": "어법: so + 형용사 + that ~ (such는 명사(구)를 수식, so는 형용사·부사를 수식)", "topic": "어법", "memo": "so + 형용사 + that ~ (such는 명사(구)를 수식, so는 형용사·부사를 수식)"}]}, {"n": 20, "tag": null, "en": "Next, bend your knees a little and stepping from side to side.", "ko": "다음으로, 무릎을 약간 구부리고 좌우로 걸음을 옮기세요.", "ok": false, "foot": [], "fixes": [{"wrong": "stepping", "right": "step", "partial": false, "at": [7], "point": "병렬구조: 명령문에서 and로 연결된 동사는 동일하게 동사원형(step) 사용", "topic": "병렬구조", "memo": "명령문에서 and로 연결된 동사는 동일하게 동사원형(step) 사용"}]}, {"n": 21, "tag": null, "en": "While you step to the side, move your hip natural.", "ko": "옆으로 내딛는 동안 엉덩이를 자연스럽게 움직이세요.", "ok": false, "foot": [], "fixes": [{"wrong": "hip", "right": "hips", "partial": false, "at": [8], "point": "어휘/수일치: 양쪽 엉덩이를 움직이므로 복수형 hips 사용", "topic": "어휘/수일치", "memo": "양쪽 엉덩이를 움직이므로 복수형 hips 사용"}, {"wrong": "natural", "right": "naturally", "partial": false, "at": [9], "point": "어법: 동사(move)를 수식하므로 부사 naturally 사용 (natural은 형용사)", "topic": "어법", "memo": "동사(move)를 수식하므로 부사 naturally 사용 (natural은 형용사)"}]}, {"n": 22, "tag": null, "en": "Now move your hand with your hips and feet!", "ko": "이제 엉덩이와 발과 함께 손을 움직이세요!", "ok": false, "foot": [], "fixes": [{"wrong": "hand", "right": "hands", "partial": false, "at": [3], "point": "병렬구조/수일치: hips, feet와 같이 나열되므로 복수형 hands 사용", "topic": "병렬구조/수일치", "memo": "hips, feet와 같이 나열되므로 복수형 hands 사용"}]}, {"n": 23, "tag": null, "en": "Well, time’s up! That’s all for todays.", "ko": "자, 시간이 다 되었네요! 오늘은 여기까지예요.", "ok": false, "foot": [], "fixes": [{"wrong": "todays", "right": "today", "partial": false, "at": [6], "point": "어휘: today는 복수형으로 쓰지 않는 시간 표현", "topic": "어휘", "memo": "today는 복수형으로 쓰지 않는 시간 표현"}]}, {"n": 24, "tag": null, "en": "Remember that hula are not only a dance.", "ko": "훌라는 단순한 춤이 아니라는 것을 기억하세요.", "ok": false, "foot": [], "fixes": [{"wrong": "are", "right": "is", "partial": false, "at": [3], "point": "수일치: 주어 hula(단수)에 맞춰 동사 is 사용", "topic": "수일치", "memo": "주어 hula(단수)에 맞춰 동사 is 사용"}, {"wrong": "not only", "right": "not just", "partial": false, "at": [4], "point": "어법: not only는 보통 but also와 짝을 이루므로 단순 부정에는 not just 사용", "topic": "어법", "memo": "not only는 보통 but also와 짝을 이루므로 단순 부정에는 not just 사용"}]}, {"n": 25, "tag": null, "en": "Hula is a language and a ways of tell stories, so it is important to Hawaiians.", "ko": "훌라는 언어이자 이야기를 전하는 한 방법이어서, 그것은 하와이 사람들에게 중요해요.", "ok": false, "foot": [], "fixes": [{"wrong": "ways", "right": "way", "partial": false, "at": [6], "point": "관사: 부정관사 a 뒤에는 단수명사 way 사용", "topic": "관사", "memo": "부정관사 a 뒤에는 단수명사 way 사용"}, {"wrong": "tell", "right": "telling", "partial": false, "at": [8], "point": "전치사(of) 뒤에는 동명사 telling 사용 (동사원형 불가)", "topic": "어법", "memo": "전치사(of) 뒤에는 동명사 telling 사용 (동사원형 불가)"}]}, {"n": 26, "tag": null, "en": "As a hula teacher, I always trying to continue the history and culture of Hawaii.", "ko": "훌라 선생님으로서 저는 항상 하와이의 역사와 문화를 이어가기 위해 노력해요.", "ok": false, "foot": [], "fixes": [{"wrong": "trying", "right": "try", "partial": false, "at": [6], "point": "어법: 주어 I의 본동 s, who didn’t have a writing system, used hula to tell stories. Hula is a language through body movements, and it has passed down stories from one generation to the next. Now it’s time to dance! Remember that you become a storyteller when you dance hula. You tell a story with your hands, feet, and hips. Oh, you need to take off your shoes and socks! Hula is always done barefoot. Let’s start with the hand gestures. Every gesture in hula has a meaning. Wave your fingers while you move your arms up and down. This gesture is called ua in the Hawaiian language, and it means “rain.” What about the sun? Hawaiians make a circle with their arms above their heads. That’s ka lā, the “sun.” These gestures are so simple that you can easily remember them. Next, bend your knees a little and step from side to side. While you step to the side, move your hips naturally. Now move your hands with your hips and feet! Well, time’s up! That’s all for today. Remember that hula is not just a dance. Hula is a language and a way of telling stories, so it is important to Hawaiians. As a hula teacher, I always try to continue the history and culture of Hawaii. If you want to learn more, come to my next class. Everyone is welcome. Aloha!"];var PASS_KO=["단순한 춤 그 이상인 훌라", "알로하! 하와이에 오신 것을 환영해요! ‘알로하’는 하와이어로 ‘안녕하세요’ 또는 ‘안녕히 가세요’라는 뜻이에요. 저는 Malia이고 오늘 당신의 훌라 선생님이에요. 훌라에 대해 전에 들어 본 적이 있나요? 훌라에 대해 얼마나 알고 있나요? 수업을 시작하기 전에 그것에 대해 말씀드리고 싶어요. 훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요. 초기 하와이인들은 문자가 없었기 때문에, 이야기를 전하기 위해 훌라를 사용했어요. 훌라는 몸의 움직임을 통한 언어로, 한 세대에서 다음 세대로 이야기를 전해 왔습니다. 이제 춤을 출 시간이에요! 훌라를 출 때는 당신이 이야기꾼이 된다는 것을 기억하세요. 당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요. 아, 신발과 양말을 벗어야 해요! 훌라는 항상 맨발로 해요. 손동작부터 시작할게요. 훌라의 모든 동작에는 의미가 있어요. 팔을 위아래로 움직이면서 손가락을 흔들어 보세요. 이 동작은 하와이어로 ‘ua’라고 불리고, ‘비’를 뜻해요. 태양은 어떨까요? 하와이 사람들은 팔을 머리 위로 올려 원을 만들어요. 그것이 ‘태양’인 ‘ka lā’예요. 이 동작들은 매우 간단해서 당신은 그것들을 쉽게 기억할 수 있어요. 다음으로, 무릎을 약간 구부리고 좌우로 걸음을 옮기세요. 옆으로 내딛는 동안 엉덩이를 자연스럽게 움직이세요. 이제 엉덩이와 발과 함께 손을 움직이세요! 자, 시간이 다 되었네요! 오늘은 여기까지예요. 훌라는 단순한 춤이 아니라는 것을 기억하세요. 훌라는 언어이자 이야기를 전하는 한 방법이어서, 그것은 하와이 사람들에게 중요해요. 훌라 선생님으로서 저는 항상 하와이의 역사와 문화를 이어가기 위해 노력해요. 더 배우고 싶다면 제 다음 수업에 오세요. 모두 환영해요. 알로하!"];var DG=[{"dlg": [["Mia", "Ben, I can’t believe we’re in New York!", "Ben, 우리가 뉴욕에 있다니 믿을 수가 없어!"], ["Ben", "Yeah. This is my first time here.", "그래. 나는 여기 처음 와 봐."], ["Mia", "Me, too. There are many places to visit. Where should we start?", "나도 그래. 가 볼 곳이 정말 많네. 어디부터 시작할까?"], ["Ben", "How about the Statue of Liberty?", "자유의 여신상은 어때?"], ["Mia", "Pardon?", "뭐라고?"], ["Ben", "The Statue of Liberty. You know the big green statue of a woman.", "자유의 여신상 말이야. 커다란 초록색 여인 동상 알잖아."], ["Mia", "Of course. It’s a landmark of New York. Let’s visit there first.", "물론이지. 그건 뉴욕의 상징물이잖아. 거기부터 가 보자."], ["Ben", "Good. After that, maybe we can go to the Empire State Building. It’s famous for the fantastic view.", "좋아. 그다음에는 엠파이어 스테이트 빌딩에 가도 될 것 같아. 그곳은 멋진 전망으로 유명해."], ["Mia", "That sounds great!", "그거 좋다!"]], "qs": [{"n": 1, "q": "위 대화의 주제로 알맞은 것은?", "o": ["experience of visiting another country", "the history of the Statue of Liberty", "famous attractions in the world", "my plans for summer vacation", "where to visit in New York"], "a": 4, "ans": "where to visit in New York", "evs": [["Mia: Me, too. There are many places to visit. Where should we start?", "나도 그래. 가 볼 곳이 정말 많네. 어디부터 시작할까?"], ["Mia: Of course. It’s a landmark of New York. Let’s visit there first.", "물론이지. 그건 뉴욕의 상징물이잖아. 거기부터 가 보자."]], "ev": ["Mia: Me, too. There are many places to visit. Where should we start?", "나도 그래. 가 볼 곳이 정말 많네. 어디부터 시작할까?"], "memo": ["Mia: Me, too. There are many places to visit. Where should we start?  (나도 그래. 가 볼 곳이 정말 많네. 어디부터 시작할까?)", "Mia: Of course. It’s a landmark of New York. Let’s visit there first.  (물론이지. 그건 뉴욕의 상징물이잖아. 거기부터 가 보자.)"]}]}, {"dlg": [["Mia", "Ben, I can’t believe we’re in New York!", "Ben, 우리가 뉴욕에 있다니 믿을 수가 없어!"], ["Ben", "Yeah. This is my first time here.", "그래. 나는 여기 처음 와 봐."], ["Mia", "Me, too. There are many places to visit. Where should w  return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}

 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}

var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});

var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
