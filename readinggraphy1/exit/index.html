<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>브릭스 중학독해 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"rg1-01-1","no":1,"ko":"닭을 태워서 ‘치킨 버스’라고?","items":[{"n":1,"t":"tf","q":"Chicken buses got their name because they sometimes carry live chickens.","ko":"치킨 버스는 때때로 살아 있는 닭을 싣고 다녀서 그런 이름을 얻었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They got this name because sometimes they carry live chickens!","그것들은 때때로 살아 있는 닭들을 실어 나르기 때문에 이런 이름을 얻게 되었다!"]],"w":"2번 문장에서 They got this name because sometimes they carry live chickens라고 함. 닭을 싣고 다녀서 붙은 이름이라 맞다.","c":"T"},"h":"28cf1d4bbc"},{"n":2,"t":"tf","q":"People in Guatemala buy the buses for a high price.","ko":"과테말라 사람들은 그 버스를 비싼 가격에 구입한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"People in Guatemala buy them for a low price.","과테말라 사람들은 그것들을 저렴한 가격에 구입한다."]],"w":"7번 문장은 buy them for a low price(저렴한 가격에 산다)라고 함. 비싼(high)이 아니라 저렴한(low)이라서 틀린 문장.","c":"F"},"h":"5ff98e54b0"},{"n":3,"t":"tf","q":"Many chicken buses in Guatemala are very old and need fixing.","ko":"과테말라의 많은 치킨 버스는 매우 오래되어 수리가 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Many chicken buses in Guatemala are very old and need fixing.","과테말라의 많은 치킨 버스들은 매우 오래되어 수리가 필요하다."]],"w":"10번 문장에 그대로 나옴. very old(매우 낡음)와 need fixing(수리될 필요가 있다)이 본문과 같다.","c":"T"},"h":"c843836381"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then, they paint them with bright colors and designs.)","ko":"그다음, 그들은 그것들을 (   )색과 디자인으로 칠한다.","opts":["어두운","낡은","선명한","조용한"],"word":"bright","r":{"a":"3) 선명한","ev":"8번 문장","s":[[8,"Then, they paint them with bright colors and designs.","그다음, 그들은 그것들을 밝은색과 디자인으로 칠한다."]],"w":"8번 문장의 bright colors는 ‘밝고 선명한 색’. 낡은 버스를 칠해서 눈에 띄게 한다는 흐름이라 ‘선명한’이 맞다. ‘어두운’은 반대말(dark)이다.","c":3},"h":"ef9fab8d34"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These buses run all over the country.)","ko":"이 버스들은 전국에서 (   ).","opts":["달리기를 하다","운행하다","도망치다","운영하다"],"word":"run","r":{"a":"2) 운행하다","ev":"3번 문장","s":[[3,"These buses run all over the country.","이 버스들은 전국에서 운행된다."]],"w":"버스가 주어이고 all over the country(전국에)가 뒤에 있으므로 run은 ‘(버스가) 운행하다, 다니다’. 사람이 뛴다는 뜻이 아니다.","c":2},"h":"c867ee4286"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nPeople in Guatemala buy them for a low price.","ko":"밑줄 친 them이 가리키는 것은?","sko":"과테말라 사람들은 그것들을 저렴한 가격에 구입한다.","opts":["닭들","과테말라 사람들","미국의 스쿨버스들","밝은색과 디자인"],"r":{"a":"3) 미국의 스쿨버스들","ev":"6~7번 문장","s":[[6,"These buses were once school buses in America.","이 버스들은 예전에는 미국의 스쿨버스였다."],[7,"People in Guatemala buy them for a low price.","과테말라 사람들은 그것들을 저렴한 가격에 구입한다."]],"w":"6번에서 These buses were once school buses in America라고 했고, 7번의 them은 그 버스들. 사는 주체는 과테말라 사람들이라 ②는 아니다.","c":3},"h":"8ca6b4709d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"People can’t imagine Guatemala without chicken buses.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사람들은 치킨 버스가 없는 과테말라를 상상할 수 없다.","opts":["치킨 버스는 과테말라 밖에서도 인기가 있다.","치킨 버스는 과테말라에서 없어도 되는 존재이다.","과테말라 사람들은 치킨 버스를 상상 속에서만 본다.","치킨 버스는 과테말라에서 빠질 수 없을 만큼 중요하다."],"r":{"a":"4) 치킨 버스는 과테말라에서 빠질 수 없을 만큼 중요하다.","ev":"11~12번 문장","s":[[11,"But they are still very special to the country.","그러나 그것들은 여전히 그 나라에게 매우 특별하다."],[12,"People can’t imagine Guatemala without chicken buses.","사람들은 치킨 버스가 없는 과테말라를 상상할 수 없다."]],"w":"can’t imagine A without B는 ‘B 없는 A는 상상할 수 없다’. 11번에서 여전히 특별하다고 했으니 치킨 버스가 매우 중요하다는 뜻이다.","c":4},"h":"7dc0b0eaa9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["치킨 버스는 예전에 미국의 스쿨버스였다.","치킨 버스는 수도에서만 운행된다.","치킨 버스는 미국 사람들이 밝게 칠한다.","치킨 버스 안에는 TV가 한 대도 없다."],"opts":["Chicken buses were once school buses in America.","Chicken buses only run in the capital city.","Chicken buses are painted by people in America.","There are no TVs inside chicken buses."],"r":{"a":"1) Chicken buses were once school buses in America.","ev":"3번, 6번, 8~9번 문장","s":[[3,"These buses run all over the country.","이 버스들은 전국에서 운행된다."],[6,"These buses were once school buses in America.","이 버스들은 예전에는 미국의 스쿨버스였다."],[8,"Then, they paint them with bright colors and designs.","그다음, 그들은 그것들을 밝은색과 디자인으로 칠한다."],[9,"Inside the buses, there are fun decorations and sometimes flat-screen TVs!","버스 안에는 재미있는 장식들이 있고, 때로는 평면 스크린 TV도 있다!"]],"w":"6번에서 치킨 버스는 예전에 미국의 스쿨버스였다고 함. ②는 3번 all over the country와 반대, ③은 8번에서 칠하는 사람이 과테말라 사람들(they), ④는 9번에서 TV도 있다고 함.","c":1},"h":"bcea4207e8"},{"n":9,"t":"sum","q":"Chicken buses were once (A) buses in America, but in Guatemala people (B) them with bright colors and designs.","ko":"치킨 버스는 예전에 미국의 (A) 버스였는데, 과테말라에서는 사람들이 밝은색과 디자인으로 (B).","oko":["(A) 스쿨 / (B) 팔았다","(A) 스쿨 / (B) 칠한다","(A) 도시 / (B) 칠한다","(A) 장난감 / (B) 부순다","(A) 스쿨 / (B) 숨긴다"],"opts":["(A) school / (B) sell","(A) school / (B) paint","(A) city / (B) paint","(A) toy / (B) break","(A) school / (B) hide"],"r":{"a":"2) (A) school / (B) paint","ev":"6~8번 문장","s":[[6,"These buses were once school buses in America.","이 버스들은 예전에는 미국의 스쿨버스였다."],[7,"People in Guatemala buy them for a low price.","과테말라 사람들은 그것들을 저렴한 가격에 구입한다."],[8,"Then, they paint them with bright colors and designs.","그다음, 그들은 그것들을 밝은색과 디자인으로 칠한다."]],"w":"6번 once school buses in America(예전엔 스쿨버스), 8번 paint them with bright colors and designs(밝은색과 디자인으로 칠한다)에서 가져옴. ①은 파는 쪽이 아니라 사는 쪽이라 틀림.","c":2},"h":"0dfaf20c69"},{"n":10,"t":"fill","q":"Chicken buses got their name because they sometimes [A] live chickens, and many people use them because riding them is very [B].","ko":"치킨 버스는 때때로 살아 있는 닭을 [A]서 그런 이름이 붙었고, 타는 값이 매우 [B]서 많은 사람이 이용한다.","bko":{"carry":"나르다","cheap":"값싼","paint":"칠하다","special":"특별한","imagine":"상상하다","fix":"고치다"},"bank":["carry","cheap","paint","special","imagine","fix"],"r":{"a":"[A] carry, [B] cheap","ev":"2번, 4~5번 문장","s":[[2,"They got this name because sometimes they carry live chickens!","그것들은 때때로 살아 있는 닭들을 실어 나르기 때문에 이런 이름을 얻게 되었다!"],[4,"Riding a chicken bus is also very cheap.","치킨 버스를 타는 것은 또한 매우 저렴하다."],[5,"So many people use them to go to work, school, and other places.","그래서 많은 사람들이 직장, 학교, 그리고 다른 곳으로 가기 위해 그것들을 이용한다."]],"w":"2번 sometimes  a surprise — they also need other things, like salt.","하지만 여기 놀라운 점이 있다 — 그들은 소금과 같은 다른 것들도 필요로 한다."],[7,"They’re actually getting salt from our sweat!","그들은 사실 우리의 땀에서 소금을 얻고 있는 것이다!"],[10,"Some butterflies, like the Julia butterfly, even drink tears from animals like crocodiles for similar reasons.","줄리아 나비와 같은 일부 나비들은 비슷한 이유로 악어와 같은 동물의 눈물까지 마신다."]],"w":"7번에서 They’re actually getting salt from our sweat(우리의 땀에서 소금을 얻고 있다)이라고 함. ①은 5번에서 소금도 필요, ③은 10번에서 눈물, ④는 2번에서 피부에 앉기도 한다.","c":2},"h":"4562ca56be"},{"n":9,"t":"sum","q":"Butterflies don’t land on us just to (A); they are actually getting (B) from our sweat.","ko":"나비가 우리에게 앉는 것은 단지 (A)하려는 것이 아니고, 사실은 우리의 땀에서 (B)을 얻는 것이다.","oko":["(A) 날아가 / (B) 소금","(A) 쉬어 / (B) 물","(A) 먹이를 먹어 / (B) 꿀","(A) 잠을 자 / (B) 설탕","(A) 쉬어 / (B) 소금"],"opts":["(A) fly / (B) salt","(A) rest / (B) water","(A) eat / (B) nectar","(A) sleep / (B) sugar","(A) rest / (B) salt"],"r":{"a":"5) (A) rest / (B) salt","ev":"6~7번 문장","s":[[6,"When butterflies land on us, they’re not just resting.","나비가 우리에게 앉을 때, 그들은 단지 쉬고 있는 것이 아니다."],[7,"They’re actually getting salt from our sweat!","그들은 사실 우리의 땀에서 소금을 얻고 있는 것이다!"]],"w":"6번 they’re not just resting(단지 쉬는 것이 아니다)에서 (A)는 rest, 7번 getting salt from our sweat(땀에서 소금을 얻음)에서 (B)는 salt. 꿀은 4번 사람들의 생각이다.","c":5},"h":"57397a71ed"},{"n":10,"t":"fill","q":"Butterflies usually need salt for [A], and some butterflies even drink [B] from animals like crocodiles.","ko":"나비는 보통 [A]을 위해 소금이 필요하고, 일부 나비는 악어와 같은 동물의 [B]까지 마신다.","bko":{"reproduction":"번식","tears":"눈물","crocodiles":"악어들","skin":"피부","gardens":"정원","spring":"봄"},"bank":["reproduction","tears","crocodiles","skin","gardens","spring"],"r":{"a":"[A] reproduction, [B] tears","ev":"9~10번 문장","s":[[9,"They usually need salt and other minerals for reproduction.","그들은 주로 번식을 위해 소금과 다른 미네랄이 필요하다."],[10,"Some butterflies, like the Julia butterfly, even drink tears from animals like crocodiles for similar reasons.","줄리아 나비와 같은 일부 나비들은 비슷한 이유로 악어와 같은 동물의 눈물까지 마신다."]], 릿을 사지 않아서 어두운 면이 사라질 것이다.","더 많은 사람이 그것을 사면 초콜릿 산업의 문제가 나아질 수 있다.","초콜릿 산업은 원래 밝은 면만 갖고 있었다."],"r":{"a":"3) 더 많은 사람이 그것을 사면 초콜릿 산업의 문제가 나아질 수 있다.","ev":"11~13번 문장","s":[[11,"This new chocolate is better for the Earth and people.","이 새로운 초콜릿은 지구와 사람들에게 더 좋다."],[12,"It might be a bit expensive.","그것은 약간 비쌀지도 모른다."],[13,"But if more people buy it, the dark side of the chocolate industry might become brighter!","하지만 더 많은 사람들이 그것을 산다면, 초콜릿 산업의 어두운 측면은 더 밝아지게 될지도 모른다!"]],"w":"if more people buy it(더 많은 사람이 산다면)이 조건이고, dark side might become brighter(어두운 면이 더 밝아질지도)가 결과. 문제가 나아질 수 있다는 뜻이다.","c":3},"h":"59efd6334c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["가짜 초콜릿은 카카오빈으로 만들어진다.","가짜 초콜릿은 지구와 사람들에게 더 좋다.","미국의 한 회사가 가짜 초콜릿을 만들었다.","가짜 초콜릿은 일반 초콜릿과 맛이 전혀 다르다."],"opts":["Fake chocolate is made from cacao beans.","Fake chocolate is better for the Earth and people.","A company in the U.S. made fake chocolate.","Fake chocolate tastes very different from regular chocolate."],"r":{"a":"2) Fake chocolate is better for the Earth and people.","ev":"7~9번, 11번 문장","s":[[7,"So, a company in the U.K. made a new kind of chocolate: “fake” chocolate.","그래서, 영국의 한 회사는 새로운 종류의 초콜릿인 ‘가짜’ 초콜릿을 만들었다."],[8,"It looks and tastes like regular chocolate.","그것은 일반적인 초콜릿처럼 보이며, 그와 같은 맛이 난다."],[9,"However, it doesn’t use any cacao beans!","그러나 그것은 카카오빈을 전혀 사용하지 않는다!"],[11,"This new chocolate is better for the Earth and people.","이 새로운 초콜릿은 지구와 사람들에게 더 좋다."]],"w":"11번에서 This new chocolate is better for the Earth and people이라고 함. ①은 9번에서 카카오빈을 쓰지 않고, ③은 7번에서 영국(U.K.) 회사, ④는 8번에서 같은 맛이 난다.","c":2},"h":"266607a090"},{"n":9,"t":"sum","q":"A company in the U.K. made (A) chocolate that looks like regular chocolate but uses (B) instead of cacao beans.","ko":"영국의 한 회사는 일반 초콜릿처럼 보이지만 카카오빈 대신 (B)을 사용하는 (A) 초콜릿을 만들었다.","oko":["(A) 가짜 / (B) 카카오빈","(A) 진짜 / (B) 보리와 캐럽","(A) 진짜 / (B) 카카오빈","(A) 값싼 / (B) 설탕","(A) 가짜 / (B) 보리와 캐럽"],"opts":["(A) fake / (B) cacao beans","(A 었죠."],[12,"I learned from this experience that we should save the turtles’ eggs, not hunt them.","저는 이 경험을 통해 우리는 바다거북알을 사냥하는 것이 아니라 구해야 한다는 것을 배웠어요."]],"w":"10번에서 They gave me some money for collecting the eggs라고 함. ①은 5번에서 더 이상 하지 않고, ③은 12번에서 구해야 한다고 배웠고, ④는 11번에서 알을 안전하게 지켰다.","c":2},"h":"e80ef3a13b"},{"n":9,"t":"sum","q":"Johnny used to hunt sea turtle eggs, but he learned that we should (A) the eggs and not (B) them.","ko":"Johnny는 예전에 바다거북알을 사냥했지만, 우리가 알을 (A)해야 하고 (B)하면 안 된다는 것을 배웠다.","oko":["(A) 사냥 / (B) 구조","(A) 판매 / (B) 구조","(A) 구조 / (B) 판매","(A) 사냥 / (B) 판매","(A) 구조 / (B) 사냥"],"opts":["(A) hunt / (B) save","(A) sell / (B) save","(A) save / (B) sell","(A) hunt / (B) sell","(A) save / (B) hunt"],"r":{"a":"5) (A) save / (B) hunt","ev":"4번, 12번 문장","s":[[4,"My job was to hunt sea turtle eggs for money.","제 일은 돈을 벌기 위해 바다거북알을 사냥하는 것이었어요."],[12,"I learned from this experience that we should save the turtles’ eggs, not hunt them.","저는 이 경험을 통해 우리는 바다거북알을 사냥하는 것이 아니라 구해야 한다는 것을 배웠어요."]],"w":"12번 we should save the turtles’ eggs, not hunt them에서 (A)는 save, (B)는 hunt. 4번에서 예전에는 hunt했으므로 순서를 거꾸로 고르지 말 것. 판매는 본문에 없다.","c":5},"h":"59442c2298"},{"n":10,"t":"fill","q":"Johnny learned about CURMA, which gave him [A] for collecting the eggs and released the baby turtles back into the [B].","ko":"Johnny는 CURMA에 대해 알게 되었는데, 그 기관은 알을 모으는 것의 대가로 [A]을 주었고 새끼 바다거북들을 다시 [B]로 놓아주었다.","bko":{"money":"돈","ocean":"바다","turtles":"거북들","hunters":"사냥꾼들","poaching":"밀렵","organization":"기관"},"bank":["money","ocean","turtles","hunters","poaching","organization"],"r":{"a":"[A] money, [B] ocean","ev":"9~11번 문장","s":[[9,"Later, I learned about an organization called CURMA.","나중에 저는 CURMA라고 불리는 기관에 대해 알게 되었어요."],[10,"They gave me some money for collecting the eggs.","그들은 제게 알을 모으는 것의 대가로 돈을 좀 주었어요."],[11,"They kept the eggs safe and then released the baby turtles back into the ocean.","그들은 알들을 안전하게 보관한 다음 새끼 바다거북들을 바다로 다시 놓아주었죠."]],"w":"10번 gave me some money for collecting the eggs, 11번 rele ws can see them, they may not attack.)","ko":"그래서 만약 그것들이 소가 그것들을 볼 수 있다고 생각한다면, 그것들은 (   ) 않을지도 모른다.","opts":["도망치다","숨다","공격하다","따라가다"],"word":"attack","r":{"a":"3) 공격하다","ev":"6~7번 문장","s":[[6,"When lions and leopards hunt, they usually sneak up and surprise their prey.","사자와 표범이 사냥할 때, 그것들은 보통 살금살금 다가가서 먹이를 기습한다."],[7,"So if they think the cows can see them, they may not attack.","그래서 만약 그것들이 소가 그것들을 볼 수 있다고 생각한다면, 그것들은 공격하지 않을지도 모른다."]],"w":"6번에서 사냥하는 사자와 표범이 소가 자기들을 본다고 생각하면 may not attack이라고 했으니 ‘공격하다’. 눈 그림으로 공격을 막는다는 흐름이다.","c":3},"h":"3fb18f7ba8"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSo if they think the cows can see them, they may not attack.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그래서 만약 그것들이 소가 그것들을 볼 수 있다고 생각한다면, 그것들은 공격하지 않을지도 모른다.","opts":["사자와 표범","소들","농부들","나비들"],"r":{"a":"1) 사자와 표범","ev":"6~7번 문장","s":[[6,"When lions and leopards hunt, they usually sneak up and surprise their prey.","사자와 표범이 사냥할 때, 그것들은 보통 살금살금 다가가서 먹이를 기습한다."],[7,"So if they think the cows can see them, they may not attack.","그래서 만약 그것들이 소가 그것들을 볼 수 있다고 생각한다면, 그것들은 공격하지 않을지도 모른다."]],"w":"6번에서 사냥하는 쪽은 사자와 표범이고, 7번 they는 사자와 표범, them도 그 사자와 표범이다. 소가 보는 대상이 곧 them이다.","c":1},"h":"6364b5bd9d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A little paint makes a big difference!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"약간의 물감이 큰 차이를 만드는 것이다!","opts":["물감을 아주 많이 써야 차이가 난다.","큰 그림이 물감을 줄인다.","물감이 조금이라 아무 차이도 없다.","약간의 물감이 큰 변화를 가져온다."],"r":{"a":"4) 약간의 물감이 큰 변화를 가져온다.","ev":"11~12번 문장","s":[[11,"Since cows aren’t born with them, farmers can just draw eyes on cow’s butts.","소는 가짜 눈을 가지고 태어나지 않기 때문에, 농부들은 그저 소의 엉덩이에 눈을 그려 주면 된다."],[12,"A little paint makes a big difference!","약간의 물감이 큰 차이를 만드는 것이다!"]],"w":"a little paint는 ‘약간의 물감’, make a big difference는 ‘큰 차이를 만들다’. 눈 그림 하나로 소가 안전해진다는 뜻이다.","c":4},"h":"3c953760b5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["소는 가짜 눈을 가지고 태어난다.","몇몇 나비들은 다리에 가짜 눈을 afety":"안전"},"bank":["butterflies","enemies","cows","farmers","leopards","safety"],"r":{"a":"[A] butterflies, [B] enemies","ev":"9~10번 문장","s":[[9,"Some butterflies have fake eyes on their wings.","몇몇 나비들은 그들의 날개에 가짜 눈을 가지고 있다."],[10,"These fake eyes help to scare away their enemies, like birds.","이 가짜 눈이 새와 같은 그것들의 천적을 쫓아내는 데 도움을 준다."]],"w":"9번 Some butterflies have fake eyes on their wings, 10번 scare away their enemies, like birds에서 가져옴. cows·leopards는 소와 사자·표범을 말하는 다른 문장의 단어라 이 빈칸에는 맞지 않는다.","c":null},"h":"0822dd9ee1"}]},{"u":4,"id":"rg1-04-1","no":1,"ko":"이메일을 지우면 지구가 좋아진다고?","items":[{"n":1,"t":"tf","q":"Deleting your old emails can help save energy.","ko":"오래된 이메일을 지우는 것은 에너지를 절약하는 데 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"If you delete your old emails, you can save energy.","당신이 오래된 이메일을 지운다면, 에너지를 절약할 수 있어요."]],"w":"10번 문장에 If you delete your old emails, you can save energy가 있음. delete(지우다)하면 save(절약하다)할 수 있다는 같은 내용이라 T.","c":"T"},"h":"11147057b5"},{"n":2,"t":"tf","q":"Many people clean their inbox often.","ko":"많은 사람들은 받은 편지함을 자주 정리한다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"Do you clean it often?","당신은 그것을 자주 정리하나요?"],[3,"Many people don’t for various reasons.","많은 사람들은 여러 가지 이유로 그렇게 하지 않아요."]],"w":"2번에서 자주 정리하느냐고 묻고, 3번에서 Many people don’t for various reasons(많은 사람들은 여러 이유로 그러지 않는다)라고 함. 자주 정리하는 것이 아니라 하지 않는 것이라 F.","c":"F"},"h":"9dabe9df1a"},{"n":3,"t":"tf","q":"Information on the internet, including emails, is stored in data centers.","ko":"이메일을 포함한 인터넷 정보는 데이터 센터에 저장된다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When you use the internet, all the information, including emails, is stored in data centers.","당신이 인터넷을 사용할 때, 이메일을 포함한 모든 정보는 데이터 센터에 저장돼요."]],"w":"6번 문장에 all the information, including emails, is stored in data centers가 있음. store(저장하다)의 수동태 is stored가 '저장된다'이므로 같은 내용이라 T.","c":"T"},"h":"fd2f55d54d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Think of them as huge libraries for computers.)","ko":"그것들을 컴퓨터를 위한 거대한 도서관이라고 생각해 보세요.","opts":["아주 작은","거대한","오래된","조용한"],"word":"huge","r":{"a":"2) 거대한","ev":"7번 문장","s":[[7,"Think of them as huge libraries for computers.","그것들을 컴퓨터를 위한 거대한 도서관이라고 생각해 보세요."]],"w":"7번에서 데이터 센터를 huge libraries(거대한 도서관)에 비유함. 정보가 아주 많이 쌓여 있다는 뜻이라 '거대한'. '아주 작은'은 반대 뜻.","c":2},"h":"2244b183b6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Many people don’t for various reasons.)","ko":"많은 사람들은 여러 가지 이유로 그렇게 하지 않아요.","opts":["단 하나의","위험한","쉬운","여러 가지의"],"word":"various","r":{"a":"4) 여러 가지의","ev":"3번 문장","s":[[3,"Many people don’t for various reasons.","많은 사람들은 여러 가지 이유로 그렇게 하지 않아요."]],"w":"3번의 various reasons는 '여러 가지 이유'. 이메일을 정리하지 않는 이유가 한 가지가 아니라 여럿이라는 뜻이라 '여러 가지의'.","c":4},"h":"a4a514aa30"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThink of them as huge libraries for computers.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그것들을 컴퓨터를 위한 거대한 도서관이라고 생각해 보세요.","opts":["이메일들","컴퓨터들","데이터 센터들","전구들"],"r":{"a":"3) 데이터 센터들","ev":"6~7번 문장","s":[[6,"When you use the internet, all the information, including emails, is stored in data centers.","당신이 인터넷을 사용할 때, 이메일을 포함한 모든 정보는 데이터 센터에 저장돼요."],[7,"Think of them as huge libraries for computers.","그것들을 컴퓨터를 위한 거대한 도서관이라고 생각해 보세요."]],"w":"6번 문장 끝에 data centers(데이터 센터들)가 나오고, 바로 다음 7번에서 them으로 받음. 정보가 저장되는 곳을 도서관에 비유한 것이라 '데이터 센터들'.","c":3},"h":"9cf61dc04f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Deleting just one email is like turning off 54 million light bulbs for an hour!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"단지 한 통의 이메일을 삭제하는 것은 5천4백만 개의 전구를 한 시간 동안 끄는 것과 같아요!","opts":["이메일 한 통을 지우는 것은 전구 5천4백만 개를 한 시간 동안 끄는 것만큼 에너지를 아끼는 효과가 있다.","이메일 한 통을 지우면 전구 5천4백만 개가 한 시간 동안 켜진다.","이메일 5천4백만 통을 지우려면 한 시간이 걸린다.","전구 한 개를 끄면 이메일 5천4백만 통이 사라진다."],"r":{"a":"1) 이메일 한 통을 지우는 것은 전구 5천4백만 개를 한 시간 동안 끄는 것만큼 에너지를 아끼는 효과가 있다.","ev":"11번 문장","s":[[11,"Deleting just one email is like turning off 54 million light bulbs for an hour!","단지 한 통의 이메일을 삭제하는 것은 5천4백만 개의 전구를 한 시간 동안 끄는 것과 같아요!"]],"w":"is like ~는 '~와 같다'. 이메일 한 통을 지우는 것의 효과를 전구 5천4백만 개를 끄는 것에 비유함. 켜진다(2번), 시간(3번), 전구가 이메일을 지운다(4번)는 말은 본문에 없음.","c":1},"h":"b044e40c6d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["데이터 센터는 낮에만 켜져 있다.","인터넷의 정보는 개인 컴퓨터에만 저장된다.","이메일을 지우면 데이터 센터가 더 많은 에너지를 쓴다.","이메일을 많이 저장하면 데이터 센터가 에너지를 더 쓴다."],"opts":["Data centers are turned on only during the day.","Information on the internet is stored only on personal computers.","Deleting emails makes data centers use more energy.","Storing lots of emails makes data centers use more energy."],"r":{"a":"4) Storing lots of emails makes data centers use more energy.","ev":"6번, 8~10번 문장","s":[[6,"When you use the internet, all the information, including emails, is stored in data centers.","당신이 인터넷을 사용할 때, 이메일을 포함한 모든 정보는 데이터 센터에 저장돼요."],[8,"These data centers use a lot of power because they are always turned on.","이런 데이터 센터들은 항상 켜져 있기 때문에 많은 전력을 사용해요."],[9,"Storing lots of emails means that these centers use more energy.","많은 이메일을 저장하는 것은 이 센터들이 더 많은 에너지를 사용한다는 것을 의미해요."],[10,"If you delete your old emails, you can save energy.","당신이 오래된 이메일을 지운다면, 에너지를 절약할 수 있어요."]],"w":"9번에서 이메일을 많이 저장하면 센터가 에너지를 더 쓴다고 함. 8번은 항상 켜져 있다(낮에만이 아님), 6번은 데이터 센터에 저장(개인 컴퓨터가 아님), 10번은 지우면 에너지 절약(더 쓴다가 아님)이라 나머지는 본문과 다름.","c":4},"h":"6b736a7f9e"},{"n":9,"t":"sum","q":"Data centers use a lot of (A) because they are always turned on, so if we (B) old emails, we can save energy.","ko":"데이터 센터는 항상 켜져 있어서 많은 (A)을 사용하므로, 오래된 이메일을 (B)하면 에너지를 절약할 수 있다.","oko":["(A) 전력 / (B) 저장하다","(A) 시간 / (B) 지우다","(A) 전력 / (B) 지우다","(A) 공간 / (B) 보관하다","(A) 시간 / (B) 보내다"],"opts":["(A) power / (B) store","(A) time / (B) delete","(A) power / (B) delete","(A) space / (B) keep","(A) time / (B) send"],"r":{"a":"3) (A) power / (B) delete","ev":"8번, 10번 문장","s":[[8,"These data centers use a lot of power because they are always turned on.","이런 데이터 센터들은 항상 켜져 있기 때문에 많은 전력을 사용해요."],[10,"If you delete your old emails, you can save energy.","당신이 오래된 이메일을 지운다면, 에너지를 절약할 수 있어요."]],"w":"8번에서 항상 켜져 있어서 use a lot of power(많은 전력을 사용한다), 10번에서 delete(지우다) old emails하면 save energy(에너지를 절약한다). 저장(store)이나 보관(keep)은 에너지를 더 쓰게 하는 쪽이라 반대.","c":3},"h":"7e31cb28f4"},{"n":10,"t":"fill","q":"Deleting just one email is like [A] off 54 million light bulbs for an hour, so if you want to help our planet, start by [B] your inbox.","ko":"이메일 한 통을 지우는 것은 5천4백만 개의 전구를 한 시간 동안 [A] 것과 같으니, 지구를 돕고 싶다면 받은 편지함을 [B] 것부터 시작하세요.","bko":{"turning":"turn(끄다)의 -ing형, 끄는 것","cleaning":"clean(정리하다)의 -ing형, 정리하는 것","storing":"store(저장하다)의 -ing형","buying":"buy(사다)의 -ing형","opening":"open(열다)의 -ing형","saving":"save(저장하다, 아끼다)의 -ing형"},"bank":["turning","cleaning","storing","buying","opening","saving"],"r":{"a":"[A] turning, [B] cleaning","ev":"11~12번 문장","s":[[11,"Deleting just one email is like turning off 54 million light bulbs for an hour!","단지 한 통의 이메일을 삭제하는 것은 5천4백만 개의 전구를 한 시간 동안 끄는 것과 같아요!"],[12,"So, if you want to help our planet, start by cleaning your inbox!","따라서, 당신이 우리 지구를 돕기를 원한다면, 받은 편지함을 정리하는 것부터 시작해보세요!"]],"w":"11번 like turning off 54 million light bulbs(5천4백만 개의 전구를 끄는 것과 같다), 12번 start by cleaning your inbox(받은 편지함을 정리하는 것부터 시작하라). storing(저장하기)과 saving(저장하기)은 이메일을 쌓아 두는 쪽이라 반대 방향이고, buying(사기)과 opening(열기)은 본문과 관계없음.","c":null},"h":"9d2f784b1a"}]},{"u":4,"id":"rg1-04-2","no":2,"ko":"레모네이드를 만들었는데 피부가 따갑다?","items":[{"n":1,"t":"tf","q":"After squeezing lemons, it is very important to wash our hands well.","ko":"레몬을 짠 후에는 손을 잘 씻는 것이 매우 중요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"After doing this, it’s very important to wash our hands well.","이것을 한 후에는, 손을 잘 씻는 것이 매우 중요하다."]],"w":"5번 문장에 After doing this, it’s very important to wash our hands well이 있음. this는 레몬을 짜는 것(4번)이라 같은 내용이라 T.","c":"T"},"h":"3f7c255e8b"},{"n":2,"t":"tf","q":"If you get a sunburn from lemon juice, you must go to the hospital right away.","ko":"레몬즙으로 인해 햇볕 화상을 입으면 즉시 병원에 가야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"If you get a sunburn from lemon juice, you can take care of it at home.","만약 당신이 레몬즙으로 인해 화상을 입는다면, 집에서 관리할 수 있다."]],"w":"9번 문장에서 you can take care of it at home(집에서 관리할 수 있다)이라고 함. 반드시 병원에 가야 한다는 말은 없어서 F.","c":"F"},"h":"1df4a0916b"},{"n":3,"t":"tf","q":"Putting a cool, wet towel on the skin can help itchiness and pain.","ko":"차갑고 젖은 수건을 피부에 올려 두는 것은 가려움과 통증에 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11~12번 문장","s":[[11,"Then, put a cool, wet towel on your skin a few times a day.","그다음, 하루에 여러 번 당신의 피부 위에 차가운 젖은 수건을 얹어라."],[12,"This will help your itchiness and pain.","이는 당신의 가려움증과 통증에 도움이 될 것이다."]],"w":"11번에서 차갑고 젖은 수건을 피부에 올려 두라고 하고(put 놓다), 12번 This will help your itchiness and pain으로 효과를 말함. 같은 내용이라 T.","c":"T"},"h":"37c930ffe1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Wash the area with mild soap and water.)","ko":"순한 비누와 물로 그 부위를 씻어라.","opts":["강한","순한","비싼","뜨거운"],"word":"mild","r":{"a":"2) 순한","ev":"10번 문장","s":[[10,"Wash the area with mild soap and water.","순한 비누와 물로 그 부위를 씻어라."]],"w":"10번은 화상 입은 피부를 씻는 방법이라 피부에 자극이 적은 mild soap(순한 비누)가 알맞음. '강한'은 반대 뜻이고, 피부가 아픈 상황과 맞지 않음.","c":2},"h":"c6cf0ef515"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (We squeeze lemons to make lemonade.)","ko":"우리는 레모네이드를 만들기 위해 레몬을 짠다.","opts":["(즙을) 짜다","씻다","얼리다","자르다"],"word":"squeeze","r":{"a":"1) (즙을) 짜다","ev":"4번 문장","s":[[4,"We squeeze lemons to make lemonade.","우리는 레모네이드를 만들기 위해 레몬을 짠다."]],"w":"4번은 레몬으로 레모네이드를 만드는 과정이라, 레몬 즙을 내려고 꾹 누르는 행동인 squeeze(짜다)가 맞음. 5번에서 이 행동을 한 뒤 손을 씻으라고 한 점도 단서.","c":1},"h":"5c7943e5fa"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIf you get a sunburn from lemon juice, you can take care of it at home.","ko":"밑줄 친 it이 가리키는 것은?","sko":"만약 당신이 레몬즙으로 인해 화상을 입는다면, 집에서 관리할 수 있다.","opts":["레몬즙","햇볕으로 인한 화상","젖은 수건","집"],"r":{"a":"2) 햇볕으로 인한 화상","ev":"9번 문장","s":[[9,"If you get a sunburn from lemon juice, you can take care of it at home.","만약 당신이 레몬즙으로 인해 화상을 입는다면, 집에서 관리할 수 있다."]],"w":"take care of it(그것을 관리하다)에서 관리하는 대상은 바로 앞의 a sunburn(햇볕으로 인한 화상). 레몬즙을 관리하는 것이 아니라 화상을 관리하는 이야기.","c":2},"h":"b9e4da7b59"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If we don’t and go out in the sun, we might get a sunburn!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 우리가 그러지 않고 햇볕에 나간다면, 우리는 햇볕으로 인한 화상을 입을지도 모른다!","opts":["손을 씻고 햇볕에 나가면 반드시 화상을 입는다.","손을 씻지 않으면 햇볕에 나갈 수 없다.","손을 씻지 않은 채 햇볕에 나가면 화상을 입을 수도 있다.","햇볕에 나가지 않아도 손에 화상이 생긴다."],"r":{"a":"3) 손을 씻지 않은 채 햇볕에 나가면 화상을 입을 수도 있다.","ev":"5~6번 문장","s":[[5,"After doing this, it’s very important to wash our hands well.","이것을 한 후에는, 손을 잘 씻는 것이 매우 중요하다."],[6,"If we don’t and go out in the sun, we might get a sunburn!","만약 우리가 그러지 않고 햇볕에 나간다면, 우리는 햇볕으로 인한 화상을 입을지도 모른다!"]],"w":"If we don’t는 5번의 '손을 잘 씻는 것'을 하지 않으면이라는 뜻. might(~일지도 모른다)는 가능성이라 반드시가 아님. 씻고 나가는 경우(1번), 나갈 수 없다(2번), 안 나가도 생긴다(4번)는 본문과 다름.","c":3},"h":"4efa1f3916"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["심한 햇볕 화상은 발진으로 변할 수도 있다.","레몬즙 화상은 반드시 병원에서 치료해야 한다.","레모네이드를 만들기 전에 손을 씻어야 한다.","차갑고 마른 수건이 가려움에 도움이 된다."],"opts":["A bad sunburn can even turn into a rash.","A sunburn from lemon juice must be treated at a hospital.","We should wash our hands before making lemonade.","A cool, dry towel helps itchiness and pain."],"r":{"a":"1) A bad sunburn can even turn into a rash.","ev":"5번, 7번, 9번, 11번 문장","s":[[5,"After doing this, it’s very important to wash our hands well.","이것을 한 후에는, 손을 잘 씻는 것이 매우 중요하다."],[7,"The sunburn can even turn into a rash if it’s really bad.","햇볕으로 인한 화상은 심지어 그것이 아주 심하면 발진으로 변할 수도 있다."],[9,"If you get a sunburn from lemon juice, you can take care of it at home.","만약 당신이 레몬즙으로 인해 화상을 입는다면, 집에서 관리할 수 있다."],[11,"Then, put a cool, wet towel on your skin a few times a day.","그다음, 하루에 여러 번 당신의 피부 위에 차가운 젖은 수건을 얹어라."]],"w":"7번에서 화상이 아주 심하면 rash(발진)로 변할 수도 있다고 함. 9번은 집에서 관리 가능(병원이 아님), 5번은 레몬을 짠 '후'에 씻기(전이 아님), 11번은 '젖은' 수건(마른 수건이 아님)이라 나머지는 본문과 다름.","c":1},"h":"176dd037a3"},{"n":9,"t":"sum","q":"If you get a sunburn from lemon juice, you can (A) it at home with mild soap and water and a cool, (B) towel.","ko":"레몬즙으로 화상을 입으면 집에서 순한 비누와 물, 그리고 차가운 (B) 수건으로 (A)할 수 있다.","oko":["(A) 피하다 / (B) 마른","(A) 무시하다 / (B) 젖은","(A) 치료하다 / (B) 마른","(A) 치료하다 / (B) 젖은","(A) 무시하다 / (B) 뜨거운"],"opts":["(A) avoid / (B) dry","(A) ignore / (B) wet","(A) treat / (B) dry","(A) treat / (B) wet","(A) ignore / (B) hot"],"r":{"a":"4) (A) treat / (B) wet","ev":"9~11번 문장","s":[[9,"If you get a sunburn from lemon juice, you can take care of it at home.","만약 당신이 레몬즙으로 인해 화상을 입는다면, 집에서 관리할 수 있다."],[10,"Wash the area with mild soap and water.","순한 비누와 물로 그 부위를 씻어라."],[11,"Then, put a cool, wet towel on your skin a few times a day.","그다음, 하루에 여러 번 당신의 피부 위에 차가운 젖은 수건을 얹어라."]],"w":"9번 take care of it(그것을 관리하다 = 치료하다), 10~11번에서 순한 비누와 물로 씻고 cool, wet towel(차갑고 젖은 수건)을 올림. 무시하거나 피하는 것은 본문과 반대이고, 수건은 마른 것이 아니라 젖은 것.","c":4},"h":"06e140b30d"},{"n":10,"t":"fill","q":"Lemon juice can [A] our skin in the sun, so we might get a [B] if we don’t wash our hands.","ko":"레몬즙은 햇볕 속에서 우리 피부를 [A] 수 있어서, 손을 씻지 않으면 [B]을 입을지도 모른다.","bko":{"burn":"태우다, 화상을 입히다","sunburn":"햇볕에 의한 화상","towel":"수건","squeeze":"짜다","soap":"비누","lemonade":"레모네이드(마시는 음료)"},"bank":["burn","sunburn","lemonade","towel","squeeze","soap"],"r":{"a":"[A] burn, [B] sunburn","ev":"3번, 6번 문장","s":[[3,"Lemon juice can burn our skin in the sun!","레몬즙은 우리의 피부를 햇볕에 타게 할 수 있다!"],[6,"If we don’t and go out in the sun, we might get a sunburn!","만약 우리가 그러지 않고 햇볕에 나간다면, 우리는 햇볕으로 인한 화상을 입을지도 모른다!"]],"w":"3번 Lemon juice can burn our skin in the sun(레몬즙은 햇볕 속에서 피부를 태울 수 있다), 6번 we might get a sunburn(햇볕 화상을 입을지도 모른다). lemonade(레모네이드), towel(수건), soap(비누)은 화상이나 피부를 태우는 일과 관계없고, squeeze(짜다)는 레몬을 짜는 행동이라 빈칸에 맞지 않음.","c":null},"h":"e313524998"}]},{"u":4,"id":"rg1-04-3","no":3,"ko":"알프스를 점령하는 선인장이라고?","items":[{"n":1,"t":"tf","q":"Prickly pear cactuses originally came from America.","ko":"부채선인장은 원래 미국에서 왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"This cactus originally came from America.","이 선인장은 원래 미국에서 왔다."]],"w":"2번 문장에 This cactus originally came from America가 있음. came은 come(오다)의 과거형이라 같은 내용이라 T.","c":"T"},"h":"e660ba872b"},{"n":2,"t":"tf","q":"Prickly pear cactuses have always grown well in the Swiss Alps.","ko":"부채선인장은 스위스 알프스에서 항상 잘 자라왔다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"For a long time, they couldn’t grow in the Swiss Alps.","오랜 시간 동안, 그것들은 스위스 알프스에서 자랄 수 없었다."]],"w":"6번 문장에 For a long time, they couldn’t grow in the Swiss Alps(오랫동안 알프스에서 자랄 수 없었다)라고 함. 항상 잘 자란 것이 아니라서 F.","c":"F"},"h":"78955edec1"},{"n":3,"t":"tf","q":"Each pad of the cactus covers the soil like a blanket.","ko":"선인장의 각 넓적한 잎은 담요처럼 토양을 덮는다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Each pad of the cactus covers the soil like a blanket.","선인장의 각 넓적한 잎들이 담요처럼 토양을 덮어 버린다."]],"w":"10번 문장 Each pad of the cactus covers the soil like a blanket과 같은 내용이라 T. cover는 '덮다'.","c":"T"},"h":"5fa7ec14e4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It now covers at least 25 percent of the land in the area!)","ko":"그것은 이제 그 지역의 땅에서 적어도 25%를 차지하고 있다!","opts":["~을 팔다","~을 차지하다, 덮다","~을 심다","~을 피하다"],"word":"covers","r":{"a":"2) ~을 차지하다, 덮다","ev":"4번 문장","s":[[4,"It now covers at least 25 percent of the land in the area!","그것은 이제 그 지역의 땅에서 적어도 25%를 차지하고 있다!"]],"w":"4번에서 선인장이 땅의 25% 이상을 covers한다고 함. 땅의 일부를 뒤덮어 차지하고 있다는 뜻이라 '차지하다, 덮다'. 10번에서 토양을 덮는(cover the soil) 장면과도 같은 뜻.","c":2},"h":"4b76d5e9b2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This prevents other plants from growing.)","ko":"이것이 다른 식물들을 자라지 못하게 막는다.","opts":["돕는다","바꾼다","막는다","보여 준다"],"word":"prevents","r":{"a":"3) 막는다","ev":"10~11번 문장","s":[[10,"Each pad of the cactus covers the soil like a blanket.","선인장의 각 넓적한 잎들이 담요처럼 토양을 덮어 버린다."],[11,"This prevents other plants from growing.","이것이 다른 식물들을 자라지 못하게 막는다."]],"w":"10번에서 선인장 잎이 땅을 담요처럼 덮는다고 했고, 11번에서 그래서 다른 식물이 자라지 못한다고 함. prevent A from v-ing는 'A가 ~하지 못하게 막다'.","c":3},"h":"cf4114e328"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey hope to solve this problem soon.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 이 문제를 곧 해결하기를 바란다.","opts":["부채선인장들","Valais의 사람들","스위스 알프스의 눈","다른 식물들"],"r":{"a":"2) Valais의 사람들","ev":"12~13번 문장","s":[[12,"So, people in Valais are working hard to stop these cactuses from spreading.","그래서, Valais의 사람들은 이 선인장들이 번지는 것을 막기 위해 열심히 노력하고 있다."],[13,"They hope to solve this problem soon.","그들은 이 문제를 곧 해결하기를 바란다."]],"w":"해결하기를 바라는(hope to solve) 주체는 바로 앞 12번에서 선인장이 번지는 것을 막으려고 노력하는 people in Valais. 선인장은 문제를 만드는 쪽이라 문제를 해결하고 싶어 하지 않음.","c":2},"h":"3fd01c6730"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, these cactuses are growing more and more even in Switzerland.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로, 이 선인장들이 스위스에서도 점점 더 많이 자라고 있다.","opts":["그 결과, 스위스에서는 선인장이 점점 줄어들고 있다.","이 선인장들은 스위스를 제외한 곳에서만 자란다.","스위스에서 선인장이 자라려면 더 많은 시간이 필요하다.","그 결과, 스위스에서도 이 선인장들이 점점 더 늘어나고 있다."],"r":{"a":"4) 그 결과, 스위스에서도 이 선인장들이 점점 더 늘어나고 있다.","ev":"7~8번 문장","s":[[7,"But now, the world is getting warmer, and there’s less snow in the Alps.","그러나 지금 세계는 점점 더 따뜻해지고 있고, 알프스에는 더 적은 양의 눈이 있다."],[8,"As a result, these cactuses are growing more and more even in Switzerland.","결과적으로, 이 선인장들이 스위스에서도 점점 더 많이 자라고 있다."]],"w":"7번에서 세계가 따뜻해지고 눈이 줄었고, 그 결과(As a result) 선인장이 스위스에서도 more and more(점점 더 많이) 자란다는 뜻. 줄어든다(1번), 스위스를 제외(2번)는 본문과 반대이고, 시간이 필요하다는 말은 없음.","c":4},"h":"46dba9276e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["부채선인장은 보통 춥고 습한 곳에서 산다.","선인장은 Valais 땅의 25%보다 적게 차지하고 있다.","알프스에 눈이 줄어서 선인장이 그곳에서 더 많이 자랄 수 있다.","Valais 사람들은 이미 이 문제를 모두 해결했다."],"opts":["Prickly pear cactuses usually live in cold and wet places.","The cactuses cover less than 25 percent of the land in Valais.","The Alps have less snow now, so cactuses can grow there more.","People in Valais have already solved the problem."],"r":{"a":"3) The Alps have less snow now, so cactuses can grow there more.","ev":"4~5번, 7~8번, 13번 문장","s":[[4,"It now covers at least 25 percent of the land in the area!","그것은 이제 그 지역의 땅에서 적어도 25%를 차지하고 있다!"],[5,"Prickly pear cactuses usually live in hot and dry places.","부채선인장은 보통 덥고 건조한 곳에서 산다."],[7,"But now, the world is getting warmer, and there’s less snow in the Alps.","그러나 지금 세계는 점점 더 따뜻해지고 있고, 알프스에는 더 적은 양의 눈이 있다."],[8,"As a result, these cactuses are growing more and more even in Switzerland.","결과적으로, 이 선인장들이 스위스에서도 점점 더 많이 자라고 있다."],[13,"They hope to solve this problem soon.","그들은 이 문제를 곧 해결하기를 바란다."]],"w":"7~8번에서 눈이 줄고 따뜻해져 선인장이 알프스에서도 더 많이 자란다고 함. 5번은 덥고 건조한 곳(춥고 습한 곳이 아님), 4번은 at least 25 percent(25% 이상), 13번은 곧 해결하기를 바라는 중(이미 해결하지 않음)이라 나머지는 본문과 다름.","c":3},"h":"98de8e66ac"},{"n":9,"t":"sum","q":"When prickly pear cactuses grow, they cover the soil like a (A), so other plants cannot (B).","ko":"부채선인장이 자라면 담요처럼 토양을 덮어서, 다른 식물들은 (B)할 수 없다.","oko":["(A) 담요 / (B) 죽다","(A) 돌 / (B) 자라다","(A) 벽 / (B) 죽다","(A) 길 / (B) 번지다","(A) 담요 / (B) 자라다"],"opts":["(A) blanket / (B) die","(A) stone / (B) grow","(A) wall / (B) die","(A) road / (B) spread","(A) blanket / (B) grow"],"r":{"a":"5) (A) blanket / (B) grow","ev":"9~11번 문장","s":[[9,"When the cactuses grow, they don’t allow anything else to grow around them.","그 선인장들이 자랄 때, 그것들은 주변에 다른 어떤 것들도 자라게 두지 않는다."],[10,"Each pad of the cactus covers the soil like a blanket.","선인장의 각 넓적한 잎들이 담요처럼 토양을 덮어 버린다."],[11,"This prevents other plants from growing.","이것이 다른 식물들을 자라지 못하게 막는다."]],"w":"10번에서 like a blanket(담요처럼) 토양을 덮고, 9번과 11번에서 다른 것들이 grow(자라다)하지 못하게 막는다고 함. blanket만 맞고 (B)가 die(죽다)인 1번은 식물이 죽는다는 말이 본문에 없어서 틀림. stone(돌), wall(벽), road(길)는 본문에 나오지 않음.","c":5},"h":"927168fdc0"},{"n":10,"t":"fill","q":"So, people in Valais are working hard to [A] these cactuses from [B].","ko":"그래서 Valais의 사람들은 이 선인장들이 [B] 것을 [A] 위해 열심히 노력하고 있다.","bko":{"stop":"멈추다, 막다","spreading":"spread(번지다)의 -ing형","dying":"die(죽다)의 -ing형","allow":"허락하다","solve":"해결하다","cover":"덮다"},"bank":["stop","spreading","dying","allow","solve","cover"],"r":{"a":"[A] stop, [B] spreading","ev":"12번 문장","s":[[12,"So, people in Valais are working hard to stop these cactuses from spreading.","그래서, Valais의 사람들은 이 선인장들이 번지는 것을 막기 위해 열심히 노력하고 있다."]],"w":"12번 문장 people in Valais are working hard to stop these cactuses from spreading. stop A from v-ing는 'A가 ~하지 못하게 막다'. allow는 허락한다는 뜻이라 반대이고, dying(죽는 것)은 본문에 없는 내용. 사람들이 막으려는 것은 선인장이 번지는 것임.","c":null},"h":"a460798724"}]},{"u":5,"id":"rg1-05-1","no":1,"ko":"가로등 기둥에 매달린 코트의 비밀","items":[{"n":1,"t":"tf","q":"The notes on the coats said that the coats were not lost.","ko":"코트에 붙은 쪽지는 그 코트들이 분실된 것이 아니라고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The notes said, “I’m not lost! If you feel cold, please take me to stay warm!”","쪽지에는 “저는 분실된 게 아니에요! 만약 당신이 춥다면, 저를 가져가 따뜻하게 지내세요!”라고 적혀 있었다."]],"w":"4번에 I’m not lost!(저는 분실된 게 아니에요!)라는 쪽지 내용이 있음. 코트들이 잃어버린 것이 아니라는 같은 내용이라 T.","c":"T"},"h":"f62340c3a1"},{"n":2,"t":"tf","q":"Tara Smith-Atkins asks the homeless to tie coats on lamp poles.","ko":"Tara Smith-Atkins는 노숙자들에게 가로등 기둥에 코트를 묶어 달라고 부탁한다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"First, she asks for donations of coats, scarves, and mittens.","먼저, 그녀는 코트, 목도리, 그리고 벙어리장갑을 기부해달라고 요청한다."],[10,"Then, she asks local children to come and help her.","그 후, 그녀는 지역의 아이들에게 와서 자신을 도와달라고 부탁한다."]],"w":"9번에서 Tara가 기부를 요청하고, 10번에서 도와 달라고 부탁하는 대상은 local children(지역 아이들). 노숙자에게 묶어 달라고 하는 것이 아니라서 F.","c":"F"},"h":"8c6e82a514"},{"n":3,"t":"tf","q":"Tara works to help the homeless during the cold winter in Canada.","ko":"Tara는 캐나다의 추운 겨울 동안 노숙자들을 돕기 위해 일한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"So, during the cold winter in Canada, she works to help the homeless.","그래서 캐나다의 추운 겨울 동안, 그녀는 노숙자들을 돕기 위해 일한다."]],"w":"8번 문장 she works to help the homeless와 같은 내용. work(일하다), help(돕다)가 그대로 쓰여 T.","c":"T"},"h":"035cac3754"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Together, they tie warm clothes on lamp poles.)","ko":"함께, 그들은 가로등 기둥에 따뜻한 옷들을 묶어 놓는다.","opts":["묶다","팔다","씻다","찾다"],"word":"tie","r":{"a":"1) 묶다","ev":"11번 문장","s":[[11,"Together, they tie warm clothes on lamp poles.","함께, 그들은 가로등 기둥에 따뜻한 옷들을 묶어 놓는다."]],"w":"1번에 coats tied to the poles(기둥에 묶인 코트들)가 나옴. 가로등 기둥에 옷을 매달아 두는 행동이라 tie는 '묶다'.","c":1},"h":"20e402ad7b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (First, she asks for donations of coats, scarves, and mittens.)","ko":"먼저, 그녀는 코트, 목도리, 그리고 벙어리장갑을 기부해달라고 요청한다.","opts":["수리","광고","기부","주문"],"word":"donations","r":{"a":"3) 기부","ev":"9번, 12번 문장","s":[[9,"First, she asks for donations of coats, scarves, and mittens.","먼저, 그녀는 코트, 목도리, 그리고 벙어리장갑을 기부해달라고 요청한다."],[12,"These clothes are for anyone who needs help.","이 옷들은 도움이 필요한 누구나를 위한 것이다."]],"w":"9번에서 코트·목도리·벙어리장갑을 요청해서 모은 뒤 12번처럼 도움이 필요한 누구나를 위해 쓴다. 대가 없이 내놓는 것이라 donation은 '기부'.","c":3},"h":"f825b25a9b"},{"n":6,"t":"ref","q":"What does the underlined \"me\" refer to?\nThe notes said, “I’m not lost! If you feel cold, please take me to stay warm!”","ko":"밑줄 친 me가 가리키는 것은?","sko":"쪽지에는 “저는 분실된 게 아니에요! 만약 당신이 춥다면, 저를 가져가 따뜻하게 지내세요!”라고 적혀 있었다.","opts":["쪽지","코트","Tara","가로등"],"r":{"a":"2) 코트","ev":"1번, 4번 문장","s":[[1,"In Halifax, Canada, people saw something interesting: coats tied to the poles of street lamps.","캐나다 Halifax에서 사람들은 흥미로운 것을 보았다: 가로등 기둥에 묶인 코트들이었다."],[4,"The notes said, “I’m not lost! If you feel cold, please take me to stay warm!”","쪽지에는 “저는 분실된 게 아니에요! 만약 당신이 춥다면, 저를 가져가 따뜻하게 지내세요!”라고 적혀 있었다."]],"w":"쪽지는 가로등 기둥에 묶인 코트(1번)가 말하는 것처럼 쓰여 있음. 추운 사람이 가져가 따뜻하게 지낼 수 있는 것은 coat라서 me는 코트.","c":2},"h":"76ae5d9190"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These clothes are for anyone who needs help.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 옷들은 도움이 필요한 누구나를 위한 것이다.","opts":["이 옷들은 Tara의 가족만을 위한 것이다.","이 옷들은 아이들이 다시 가져가야 하는 것이다.","이 옷들은 남을 도울 수 있는 사람들이 입는 것이다.","이 옷들은 도움이 필요한 사람이면 누구에게나 주어진다."],"r":{"a":"4) 이 옷들은 도움이 필요한 사람이면 누구에게나 주어진다.","ev":"11~12번 문장","s":[[11,"Together, they tie warm clothes on lamp poles.","함께, 그들은 가로등 기둥에 따뜻한 옷들을 묶어 놓는다."],[12,"These clothes are for anyone who needs help.","이 옷들은 도움이 필요한 누구나를 위한 것이다."]],"w":"anyone who needs help는 '도움이 필요한 누구든지'. 11번에서 묶어 놓은 옷을 필요한 사람이 가져가는 것이라 4번. 가족만(1번), 아이들이 도로 가져감(2번), 도울 수 있는 사람(3번)은 본문과 다름.","c":4},"h":"f45fa19f8a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["가로등 기둥의 코트들은 정말 누군가 잃어버린 것이다.","Tara는 코트, 목도리, 벙어리장갑을 기부해달라고 요청한다.","Tara는 노숙자들에게 코트를 묶어 달라고 부탁한다.","기둥의 코트들은 아이들만을 위한 것이다."],"opts":["The coats on the lamp poles were really lost by someone.","Tara asks for donations of coats, scarves, and mittens.","Tara asks the homeless to tie coats on lamp poles.","The coats on the poles are only for children."],"r":{"a":"2) Tara asks for donations of coats, scarves, and mittens.","ev":"4번, 9~12번 문장","s":[[4,"The notes said, “I’m not lost! If you feel cold, please take me to stay warm!”","쪽지에는 “저는 분실된 게 아니에요! 만약 당신이 춥다면, 저를 가져가 따뜻하게 지내세요!”라고 적혀 있었다."],[9,"First, she asks for donations of coats, scarves, and mittens.","먼저, 그녀는 코트, 목도리, 그리고 벙어리장갑을 기부해달라고 요청한다."],[10,"Then, she asks local children to come and help her.","그 후, 그녀는 지역의 아이들에게 와서 자신을 도와달라고 부탁한다."],[11,"Together, they tie warm clothes on lamp poles.","함께, 그들은 가로등 기둥에 따뜻한 옷들을 묶어 놓는다."],[12,"These clothes are for anyone who needs help.","이 옷들은 도움이 필요한 누구나를 위한 것이다."]],"w":"9번에서 Tara가 코트, 목도리, 벙어리장갑의 기부를 요청함. 4번은 분실된 게 아니라는 쪽지, 10~11번은 지역 아이들과 함께 묶는 것, 12번은 도움이 필요한 누구나를 위한 옷이라 나머지는 본문과 다름.","c":2},"h":"7d1abf042c"},{"n":9,"t":"sum","q":"In winter, Tara and local children tie warm (A) on lamp poles for people who (B) help.","ko":"겨울에 Tara와 지역 아이들은 도움이 (B)한 사람들을 위해 가로등 기둥에 따뜻한 (A)을 묶어 놓는다.","oko":["(A) 쪽지 / (B) 주다","(A) 옷 / (B) 주다","(A) 쪽지 / (B) 필요하다","(A) 장난감 / (B) 필요하다","(A) 옷 / (B) 필요하다"],"opts":["(A) notes / (B) give","(A) clothes / (B) give","(A) notes / (B) need","(A) toys / (B) need","(A) clothes / (B) need"],"r":{"a":"5) (A) clothes / (B) need","ev":"11~12번 문장","s":[[11,"Together, they tie warm clothes on lamp poles.","함께, 그들은 가로등 기둥에 따뜻한 옷들을 묶어 놓는다."],[12,"These clothes are for anyone who needs help.","이 옷들은 도움이 필요한 누구나를 위한 것이다."]],"w":"11번에서 tie warm clothes on lamp poles(따뜻한 옷을 기둥에 묶는다), 12번에서 anyone who needs help(도움이 필요한 사람). 쪽지(notes)는 코트에 붙은 것이고 묶는 것은 옷이며, 장난감 얘기는 없음.","c":5},"h":"9762eace72"},{"n":10,"t":"fill","q":"Helping [A] in need is [B] for the community!","ko":"어려움에 처한 [A]을 돕는 것은 지역 사회에 [B]!","bko":{"others":"다른 사람들","important":"중요한","local":"지역의","lesson":"교훈","donation":"기부","scarves":"목도리들"},"bank":["others","important","local","lesson","donation","scarves"],"r":{"a":"[A] others, [B] important","ev":"14번 문장","s":[[14,"Helping others in need is important for the community!","어려움에 처한 다른 사람들을 돕는 것은 지역 사회에 중요하다!"]],"w":"14번 문장 Helping others in need is important for the community!(어려움에 처한 다른 사람들을 돕는 것은 지역 사회에 중요하다). lesson(교훈)은 13번에 나오는 말이지만 이 빈칸 자리에는 '다른 사람들'과 '중요한'이 들어가야 뜻이 통함.","c":null},"h":"f0abe7d9b5"}]},{"u":5,"id":"rg1-05-2","no":2,"ko":"옛날 사진 속 사람들은 왜 웃지 않았을까?","items":[{"n":1,"t":"tf","q":"It took about 20 minutes to take one picture in the late 18th and early 19th centuries.","ko":"18세기 후반과 19세기 초에는 사진 한 장을 찍는 데 약 20분이 걸렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It took about 20 minutes to take one picture!","한 장의 사진을 찍는 데 약 20분이 걸렸다!"]],"w":"4번 문장 It took about 20 minutes to take one picture!와 같은 내용. took은 take(걸리다)의 과거형이라 T.","c":"T"},"h":"ea53b38059"},{"n":2,"t":"tf","q":"In old paintings, big smiles were very common.","ko":"옛날 그림에서 활짝 웃는 모습은 매우 흔했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"In these paintings, big smiles weren’t common.","이런 그림들에서, 활짝 웃는 것은 흔하지 않았다."]],"w":"8번에서 In these paintings, big smiles weren’t common(그림에서 큰 미소는 흔하지 않았다)이라고 함. 매우 흔했다는 말은 반대라서 F.","c":"F"},"h":"1ae4d50d54"},{"n":3,"t":"tf","q":"The tradition slowly began to change, and smiles became more common.","ko":"그 전통은 서서히 바뀌기 시작했고, 미소가 더 흔해졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"However, the tradition slowly began to change, and smiles became more common.","그러나 그 전통은 서서히 바뀌기 시작했고, 미소가 더 흔해지게 되었다."]],"w":"13번 문장 the tradition slowly began to change, and smiles became more common과 같은 내용이라 T. begin(시작하다), become(되다)의 과거형이 쓰였음.","c":"T"},"h":"e76df0dae0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Many people believed that showing big smiles wasn’t appropriate.)","ko":"많은 사람들이 함박웃음을 보여주는 것은 적절하지 않다고 믿었다.","opts":["적절한","흔한","어리석은","행복한"],"word":"appropriate","r":{"a":"1) 적절한","ev":"9번 문장","s":[[9,"Many people believed that showing big smiles wasn’t appropriate.","많은 사람들이 함박웃음을 보여주는 것은 적절하지 않다고 믿었다."]],"w":"9번에서 큰 미소를 보이는 것을 wasn’t appropriate라고 믿어서 그림에서도 흔하지 않았음(8번). '큰 미소를 보이는 게 알맞지 않다'는 뜻이라 appropriate는 '적절한'.","c":1},"h":"3f43d3f4ff"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, they kept a serious face.)","ko":"그래서, 그들은 심각한 표정을 유지했다.","opts":["웃는","화난","재미있는","심각한"],"word":"serious","r":{"a":"4) 심각한","ev":"11~12번 문장","s":[[11,"They thought that only silly or lower-class people smiled in photos.","그들은 오직 어리석거나 하위 계층의 사람들만이 사진에서 미소 짓는다고 생각했다."],[12,"So, they kept a serious face.","그래서, 그들은 심각한 표정을 유지했다."]],"w":"11번에서 웃는 사람은 어리석거나 하위 계층이라 생각해서(So) 웃지 않는 표정을 유지함. 웃는 표정의 반대인 진지한 얼굴이라 serious는 '심각한, 진지한'.","c":4},"h":"787ccb35d6"},{"n":6,"t":"ref","q":"What does the underlined \"this tradition\" refer to?\nWhen cameras were invented, people continued this tradition.","ko":"밑줄 친 this tradition이 가리키는 것은?","sko":"카메라가 발명되었을 때, 사람들은 이 전통을 계속 이어갔다.","opts":["카메라를 발명하는 것","그림에서 큰 미소를 흔하게 보여 주지 않던 것","결혼식에서 사진을 찍는 것","20분 동안 가만히 앉아 있는 것"],"r":{"a":"2) 그림에서 큰 미소를 흔하게 보여 주지 않던 것","ev":"8~10번 문장","s":[[8,"In these paintings, big smiles weren’t common.","이런 그림들에서, 활짝 웃는 것은 흔하지 않았다."],[9,"Many people believed that showing big smiles wasn’t appropriate.","많은 사람들이 함박웃음을 보여주는 것은 적절하지 않다고 믿었다."],[10,"When cameras were invented, people continued this tradition.","카메라가 발명되었을 때, 사람들은 이 전통을 계속 이어갔다."]],"w":"10번의 this tradition은 바로 앞 8~9번 내용. 그림 속에서 큰 미소가 흔하지 않았고 보이는 것이 적절하지 않다고 믿던 관습을 사진에서도 이어간 것임. 카메라를 발명하는 것(1번)은 전통이 아님.","c":2},"h":"72b48b5e11"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, people had to sit very still for a long time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서, 사람들은 오랫동안 아주 가만히 앉아 있어야 했다.","opts":["그래서 사람들은 오랫동안 서 있어도 괜찮았다.","그래서 사람들은 시간을 아끼려고 빨리 앉았다.","그래서 사람들은 오랫동안 아주 가만히 앉아 있어야 했다.","그래서 사람들은 사진을 찍기 전에 오래 쉬어야 했다."],"r":{"a":"3) 그래서 사람들은 오랫동안 아주 가만히 앉아 있어야 했다.","ev":"4~5번 문장","s":[[4,"It took about 20 minutes to take one picture!","한 장의 사진을 찍는 데 약 20분이 걸렸다!"],[5,"So, people had to sit very still for a long time.","그래서, 사람들은 오랫동안 아주 가만히 앉아 있어야 했다."]],"w":"4번에서 사진 한 장에 20분이 걸린다고 했으므로, 그래서(So) had to(have to ~해야 한다의 과거) sit very still(아주 가만히 앉아 있다). 서 있어도 된다(1번), 빨리 앉았다(2번), 찍기 전에 쉬었다(4번)는 본문과 다름.","c":3},"h":"f010675d69"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["사람들은 옛날 사진 속 결혼식에서 자주 웃었다.","옛날에는 오늘날보다 사진을 더 빨리 찍었다.","어리석거나 하위 계층의 사람들만 사진에서 심각한 표정을 지었다.","많은 사람들은 큰 미소를 보여 주는 것이 적절하지 않다고 믿었다."],"opts":["People often smiled at weddings in old photos.","People took pictures faster in the past than today.","Only silly or lower-class people kept a serious face in photos.","Many people believed that showing big smiles wasn’t appropriate."],"r":{"a":"4) Many people believed that showing big smiles wasn’t appropriate.","ev":"2~3번, 9번, 11번 문장","s":[[2,"They didn’t smile even at happy events like weddings.","그들은 결혼식과 같은 행복한 행사에서조차 웃지 않았다."],[3,"Back then, taking a picture took much longer than today.","그 당시에, 사진을 찍는 것은 오늘날보다 시간이 훨씬 더 오래 걸렸다."],[9,"Many people believed that showing big smiles wasn’t appropriate.","많은 사람들이 함박웃음을 보여주는 것은 적절하지 않다고 믿었다."],[11,"They thought that only silly or lower-class people smiled in photos.","그들은 오직 어리석거나 하위 계층의 사람들만이 사진에서 미소 짓는다고 생각했다."]],"w":"9번에서 많은 사람들이 큰 미소를 보이는 것은 적절하지 않다고 믿었다고 함. 2번은 결혼식에서도 웃지 않음, 3번은 오늘날보다 훨씬 오래 걸림, 11번은 어리석거나 하위 계층만 '웃는다'고 생각했다는 것이라 나머지는 본문과 다름.","c":4},"h":"94e8ef1f9f"},{"n":9,"t":"sum","q":"Taking a picture took much (A) than today, so people had to sit very (B) in photos.","ko":"그 당시 사진을 찍는 것은 오늘날보다 훨씬 (A) 걸려서, 사람들은 사진에서 아주 (B) 앉아 있어야 했다.","oko":["(A) 짧게 / (B) 가만히","(A) 오래 / (B) 빠르게","(A) 짧게 / (B) 행복하게","(A) 오래 / (B) 행복하게","(A) 오래 / (B) 가만히"],"opts":["(A) shorter / (B) still","(A) longer / (B) fast","(A) shorter / (B) happy","(A) longer / (B) happy","(A) longer / (B) still"],"r":{"a":"5) (A) longer / (B) still","ev":"3~5번 문장","s":[[3,"Back then, taking a picture took much longer than today.","그 당시에, 사진을 찍는 것은 오늘날보다 시간이 훨씬 더 오래 걸렸다."],[4,"It took about 20 minutes to take one picture!","한 장의 사진을 찍는 데 약 20분이 걸렸다!"],[5,"So, people had to sit very still for a long time.","그래서, 사람들은 오랫동안 아주 가만히 앉아 있어야 했다."]],"w":"3번 taking a picture took much longer than today(훨씬 더 오래 걸렸다), 5번 sit very still(아주 가만히 앉아 있다). 짧게(shorter)는 반대이고, 빠르게·행복하게는 5번의 내용과 맞지 않음.","c":5},"h":"fa88a53304"},{"n":10,"t":"fill","q":"People thought that only [A] or lower-class people smiled in photos, so they kept a [B] face.","ko":"사람들은 오직 [A] 또는 하위 계층의 사람들만이 사진에서 웃는다고 생각해서, [B] 표정을 유지했다.","bko":{"silly":"어리석은","serious":"심각한, 진지한","appropriate":"적절한","big":"큰","wedding":"결혼식","tradition":"전통"},"bank":["silly","serious","appropriate","big","wedding","tradition"],"r":{"a":"[A] silly, [B] serious","ev":"11~12번 문장","s":[[11,"They thought that only silly or lower-class people smiled in photos.","그들은 오직 어리석거나 하위 계층의 사람들만이 사진에서 미소 짓는다고 생각했다."],[12,"So, they kept a serious face.","그래서, 그들은 심각한 표정을 유지했다."]],"w":"11번 only silly or lower-class people smiled(어리석거나 하위 계층만 웃는다), 12번 kept a serious face(심각한 표정을 유지했다). appropriate(적절한), big(큰), wedding(결혼식), tradition(전통)은 본문에 나오는 말이지만 이 두 빈칸에 넣으면 뜻이 맞지 않음.","c":null},"h":"d94e1cae00"}]},{"u":5,"id":"rg1-05-3","no":3,"ko":"오래된 책에서 왜 달콤한 냄새가 날까?","items":[{"n":1,"t":"tf","q":"Lignin is a chemical found in paper.","ko":"리그닌은 종이에서 발견되는 화학물질이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Lignin is a chemical found in paper.","리그닌은 종이에서 발견되는 화학물질이다."]],"w":"5번 문장이 Lignin is a chemical found in paper. found는 find(발견하다)의 과거분사로 '발견되는'이라는 뜻이라 같은 내용이라 T.","c":"T"},"h":"9972682125"},{"n":2,"t":"tf","q":"Lignin turns the pages of books white over time.","ko":"리그닌은 시간이 지나면서 책의 페이지를 하얗게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"It also turns the pages yellow.","그것은 책의 페이지들을 노랗게 만든다."]],"w":"10번에서 It also turns the pages yellow(페이지를 노랗게 만든다)라고 함. 하얗게가 아니라 노랗게라서 F.","c":"F"},"h":"f2c9ea3a85"},{"n":3,"t":"tf","q":"Many people said that old books smelled like chocolate or coffee.","ko":"많은 사람들은 오래된 책이 초콜릿이나 커피 같은 냄새가 난다고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"In a study, many people said old books smelled like chocolate or coffee.","한 연구에서, 많은 사람들이 오래된 책이 초콜릿이나 커피 같은 냄새가 난다고 말했다."]],"w":"7번 문장 In a study, many people said old books smelled like chocolate or coffee와 같은 내용이라 T. smelled like는 smell like(~ 같은 냄새가 나다)의 과거형.","c":"T"},"h":"59e51c1954"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When a book gets older, lignin breaks down and makes a unique smell.)","ko":"책이 점점 더 오래되면, 리그닌이 분해되어 독특한 냄새가 난다.","opts":["흔한","독특한","나쁜","강한"],"word":"unique","r":{"a":"2) 독특한","ev":"6~7번 문장","s":[[6,"When a book gets older, lignin breaks down and makes a unique smell.","책이 점점 더 오래되면, 리그닌이 분해되어 독특한 냄새가 난다."],[7,"In a study, many people said old books smelled like chocolate or coffee.","한 연구에서, 많은 사람들이 오래된 책이 초콜릿이나 커피 같은 냄새가 난다고 말했다."]],"w":"6번의 unique smell은 오래된 책만의 특별한 냄새. 7번에서 초콜릿이나 커피 같다고 한 것처럼 다른 곳에서 쉽게 맡을 수 없는 냄새라 '독특한'. '흔한'은 반대 뜻.","c":2},"h":"8ef07990e8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This isn’t surprising because lignin is also in chocolate and coffee!)","ko":"이것은 리그닌이 초콜릿과 커피에도 들어 있기 때문에 놀라운 일이 아니다!","opts":["지루한","어려운","당연한","놀라운"],"word":"surprising","r":{"a":"4) 놀라운","ev":"8번 문장","s":[[8,"This isn’t surprising because lignin is also in chocolate and coffee!","리그닌은 초콜릿과 커피에도 들어 있기 때문에 이는 놀라운 일이 아니다!"]],"w":"8번은 isn’t surprising(놀랍지 않다)이므로 surprising 자체의 뜻은 '놀라운'. 리그닌이 초콜릿과 커피에도 있으니 냄새가 같은 것이 놀랍지 않다는 흐름임. '당연한'은 not surprising과 비슷해 보이는 함정.","c":4},"h":"d097035e0b"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat means books might not have that sweet smell in the future.","ko":"밑줄 친 That이 가리키는 것은?","sko":"그것은 앞으로 책에서 그 달콤한 냄새가 나지 않을 수도 있다는 것을 의미한다.","opts":["오늘날의 책들이 리그닌이 더 적게 들어 있는 종이를 사용하는 것","리그닌이 초콜릿에도 들어 있는 것","책의 페이지가 노랗게 변하는 것","오래된 책에서 특별한 냄새가 나는 것"],"r":{"a":"1) 오늘날의 책들이 리그닌이 더 적게 들어 있는 종이를 사용하는 것","ev":"11~12번 문장","s":[[11,"So, books today use paper with less lignin.","그래서, 오늘날의 책들은 리그닌이 더 적게 들어있는 종이를 사용한다."],[12,"That means books might not have that sweet smell in the future.","그것은 앞으로 책에서 그 달콤한 냄새가 나지 않을 수도 있다는 것을 의미한다."]],"w":"12번 That means ~의 That은 바로 앞 11번 내용. 리그닌이 더 적은 종이를 쓰면 책에서 달콤한 냄새(리그닌이 분해되며 나는 냄새)가 줄어든다는 뜻으로 이어짐.","c":1},"h":"e062455a94"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But lignin doesn’t only make books smell good.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 리그닌은 책들이 좋은 냄새가 나게 하지만은 않는다.","opts":["리그닌은 책이 좋은 냄새가 나는 것을 막아 준다.","리그닌은 책에서 아무 냄새도 나지 않게 만든다.","리그닌은 책에서 좋은 냄새가 나게 하는 것 외에 다른 작용도 한다.","리그닌 때문에 책에서는 항상 나쁜 냄새가 난다."],"r":{"a":"3) 리그닌은 책에서 좋은 냄새가 나게 하는 것 외에 다른 작용도 한다.","ev":"9~10번 문장","s":[[9,"But lignin doesn’t only make books smell good.","하지만 리그닌은 책들이 좋은 냄새가 나게 하지만은 않는다."],[10,"It also turns the pages yellow.","그것은 책의 페이지들을 노랗게 만든다."]],"w":"not only ~는 '~만은 아니다'. 9번 뒤 10번에서 페이지를 노랗게 만드는 다른 작용을 설명함. 막는다(1번), 냄새가 안 난다(2번), 항상 나쁘다(4번)는 본문과 다름.","c":3},"h":"1a113bc2fb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["책이 오래되면 리그닌이 분해된다.","리그닌은 초콜릿과 커피에서만 발견된다.","오늘날의 책들은 리그닌이 더 많은 종이를 사용한다.","종이, 잉크, 접착제에는 화학물질이 없다."],"opts":["Lignin breaks down when a book gets older.","Lignin is only found in chocolate and coffee.","Books today use paper with more lignin.","Paper, ink, and glue have no chemicals."],"r":{"a":"1) Lignin breaks down when a book gets older.","ev":"3~4번, 6번, 8번, 11번 문장","s":[[3,"Paper, ink, and glue are used to make books.","종이, 잉크, 그리고 접착제는 책을 만드는 데 사용된다."],[4,"These materials have many different chemicals in them, and one of the chemicals is lignin.","이 재료들에는 많은 다양한 화학물질들이 있고, 그 화학물질 중 하나가 리그닌이다."],[6,"When a book gets older, lignin breaks down and makes a unique smell.","책이 점점 더 오래되면, 리그닌이 분해되어 독특한 냄새가 난다."],[8,"This isn’t surprising because lignin is also in chocolate and coffee!","리그닌은 초콜릿과 커피에도 들어 있기 때문에 이는 놀라운 일이 아니다!"],[11,"So, books today use paper with less lignin.","그래서, 오늘날의 책들은 리그닌이 더 적게 들어있는 종이를 사용한다."]],"w":"6번 When a book gets older, lignin breaks down이라고 함. 8번 리그닌은 초콜릿·커피에도 있고 종이에서도 발견됨(5번), 11번 오늘날 책은 리그닌이 less(더 적은) 종이를 쓰고, 3~4번 재료에는 많은 화학물질이 있어 나머지는 본문과 다름.","c":1},"h":"9876ebec2b"},{"n":9,"t":"sum","q":"Lignin is a (A) found in paper, and when a book gets older, lignin (B) and makes a unique smell.","ko":"리그닌은 종이에서 발견되는 (A)이고, 책이 오래되면 리그닌이 (B) 독특한 냄새가 난다.","oko":["(A) 식물 / (B) 분해되어","(A) 화학물질 / (B) 자라서","(A) 색깔 / (B) 남아서","(A) 식물 / (B) 사라져서","(A) 화학물질 / (B) 분해되어"],"opts":["(A) plant / (B) breaks down","(A) chemical / (B) grows","(A) color / (B) stays","(A) plant / (B) disappears","(A) chemical / (B) breaks down"],"r":{"a":"5) (A) chemical / (B) breaks down","ev":"5~6번 문장","s":[[5,"Lignin is a chemical found in paper.","리그닌은 종이에서 발견되는 화학물질이다."],[6,"When a book gets older, lignin breaks down and makes a unique smell.","책이 점점 더 오래되면, 리그닌이 분해되어 독특한 냄새가 난다."]],"w":"5번 Lignin is a chemical found in paper, 6번 lignin breaks down and makes a unique smell. 식물이나 색깔이라는 말은 없고, 자라거나 남거나 사라진다는 말도 본문에 없음.","c":5},"h":"23d1090ab7"},{"n":10,"t":"fill","q":"Books today use paper with [A] lignin, so the books might not have that [B] smell in the future.","ko":"오늘날의 책들은 리그닌이 [A] 든 종이를 사용해서, 앞으로 책에서 그 [B] 냄새가 나지 않을 수도 있다.","bko":{"less":"더 적은","sweet":"달콤한","more":"더 많은","yellow":"노란","future":"미래","different":"다른"},"bank":["less","sweet","more","yellow","future","different"],"r":{"a":"[A] less, [B] sweet","ev":"11~12번 문장","s":[[11,"So, books today use paper with less lignin.","그래서, 오늘날의 책들은 리그닌이 더 적게 들어있는 종이를 사용한다."],[12,"That means books might not have that sweet smell in the future.","그것은 앞으로 책에서 그 달콤한 냄새가 나지 않을 수도 있다는 것을 의미한다."]],"w":"11번 paper with less lignin(리그닌이 더 적은 종이), 12번 that sweet smell(그 달콤한 냄새). more는 less의 반대 뜻이라 맞지 않고, yellow는 10번에서 페이지 색을 말한 것이라 냄새와 어울리지 않음. future(미래)와 different(다른)는 빈칸에 넣으면 뜻이 통하지 않음.","c":null},"h":"6d743d2f92"}]},{"u":6,"id":"rg1-06-1","no":1,"ko":"섬에서 캠핑하다 게에게 음식을 뺏긴다고?","items":[{"n":1,"t":"tf","q":"Robber crabs have a strong sense of smell.","ko":"강도 게는 뛰어난 후각을 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"These crabs have a strong sense of smell.","이 게들은 뛰어난 후각을 가지고 있다."]],"w":"4번 문장 These crabs have a strong sense of smell과 같은 내용이라 T. have(가지다)가 그대로 쓰였음.","c":"T"},"h":"fad99f7683"},{"n":2,"t":"tf","q":"Robber crabs hurt campers when they gather around food.","ko":"강도 게는 음식 주위에 모일 때 캠핑객을 다치게 한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"They don’t hurt people.","그것들은 사람을 해치지 않는다."]],"w":"8번에서 They don’t hurt people(그것들은 사람을 해치지 않는다)이라고 함. 캠핑객을 다치게 한다는 말은 반대라서 F.","c":"F"},"h":"f6415349f9"},{"n":3,"t":"tf","q":"Smart campers usually hang their food in trees.","ko":"현명한 캠핑객들은 보통 음식을 나무에 걸어둔다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Smart campers usually hang their food in trees.","현명한 캠핑객들은 보통 그들의 음식을 나무에 걸어둔다."]],"w":"9번 문장 Smart campers usually hang their food in trees와 같은 내용. hang(걸다)이 그대로 쓰여 T.","c":"T"},"h":"8868c3c9e0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When people start cooking, the crabs smell the food and quickly gather around.)","ko":"사람들이 요리하기 시작할 때, 그 게들은 음식 냄새를 맡고 빠르게 주위에 모인다.","opts":["모이다","도망가다","잠자다","싸우다"],"word":"gather","r":{"a":"1) 모이다","ev":"6번 문장","s":[[6,"When people start cooking, the crabs smell the food and quickly gather around.","사람들이 요리하기 시작할 때, 그 게들은 음식 냄새를 맡고 빠르게 주위에 모인다."]],"w":"6번에서 요리 냄새를 맡은 게들이 gather around(주위에 모인다)하는 장면. 5번에서 음식을 가져가려고 다가온다고 했으므로 gather는 '모이다'.","c":1},"h":"d0cb0cd212"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The people on the island look after these crabs and treat them with respect.)","ko":"그 섬의 사람들은 이 게들을 돌보고 존중으로 그것들을 대한다.","opts":["그리다","대하다","잡다","던지다"],"word":"treat","r":{"a":"2) 대하다","ev":"14번 문장","s":[[14,"The people on the island look after these crabs and treat them with respect.","그 섬의 사람들은 이 게들을 돌보고 존중으로 그것들을 대한다."]],"w":"14번에서 look after(돌보다)와 함께 with respect(존중으로) treat한다고 함. 게를 존중하며 다룬다는 뜻이라 treat는 '대하다'.","c":2},"h":"7f105fd8c6"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey sometimes take food from campers!","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 때때로 캠핑객들로부터 음식을 가져간다!","opts":["캠핑객들","강도 게들","섬 사람들","호주 사람들"],"r":{"a":"2) 강도 게들","ev":"4~5번 문장","s":[[4,"These crabs have a strong sense of smell.","이 게들은 뛰어난 후각을 가지고 있다."],[5,"They sometimes take food from campers!","그것들은 때때로 캠핑객들로부터 음식을 가져간다!"]],"w":"5번의 They가 음식을 가져가는 주체는 바로 앞 4번의 These crabs(이 게들). 음식을 빼앗기는 쪽이 캠핑객들이라서 They는 캠핑객이 될 수 없음.","c":2},"h":"72574b034a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They also set up their tents far away from their cooking spots.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 또한 그들의 텐트를 그들의 조리 장소에서 멀리 떨어진 곳에 설치한다.","opts":["그들은 텐트를 조리 장소 바로 옆에 설치한다.","그들은 조리 장소를 텐트 안으로 옮긴다.","그들은 텐트를 조리하는 장소에서 멀리 떨어진 곳에 설치한다.","그들은 텐트를 게가 많은 곳에 설치한다."],"r":{"a":"3) 그들은 텐트를 조리하는 장소에서 멀리 떨어진 곳에 설치한다.","ev":"9~10번 문장","s":[[9,"Smart campers usually hang their food in trees.","현명한 캠핑객들은 보통 그들의 음식을 나무에 걸어둔다."],[10,"They also set up their tents far away from their cooking spots.","그들은 또한 그들의 텐트를 그들의 조리 장소에서 멀리 떨어진 곳에 설치한다."]],"w":"set up은 '설치하다', far away from은 '~에서 멀리 떨어져'. 9번에서 음식을 나무에 걸어두는 것에 이어(also) 텐트를 조리 장소에서 멀리 둔다는 뜻. 바로 옆(1번)은 반대.","c":3},"h":"dcbbe89980"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["호주에서는 강도 게를 먹어도 된다.","강도 게는 텐트가 멀리 있어도 밤마다 텐트 근처에 온다.","강도 게는 크리스마스섬에서 사람들을 다치게 한다.","강도 게는 때때로 캠핑객에게서 음식을 가져간다."],"opts":["In Australia, people are allowed to eat robber crabs.","Robber crabs come near the tents every night, even when the tents are far away.","Robber crabs hurt people on Christmas Island.","Robber crabs sometimes take food from campers."],"r":{"a":"4) Robber crabs sometimes take food from campers.","ev":"5번, 8번, 11번, 13번 문장","s":[[5,"They sometimes take food from campers!","그것들은 때때로 캠핑객들로부터 음식을 가져간다!"],[8,"They don’t hurt people.","그것들은 사람을 해치지 않는다."],[11,"Then, the crabs won’t come near the tents at night.","그러면, 그 게들은 밤에 텐트 근처에 오지 않을 것이다."],[13,"But, these crabs are not for eating in Australia.","하지만, 호주에서 이 게들은 식용이 아니다."]],"w":"5번 They sometimes take food from campers가 맞음. 13번은 호주에서 먹는 용도가 아님, 11번은 텐트를 멀리 두면 밤에 게가 오지 않음, 8번은 사람을 해치지 않는다고 하므로 나머지는 본문과 다름.","c":4},"h":"b67f131b11"},{"n":9,"t":"sum","q":"Smart campers hang their food in trees and set up their tents (A) from their cooking spots, so the crabs won’t come near the tents (B).","ko":"현명한 캠핑객들은 음식을 나무에 걸고 텐트를 조리 장소에서 (A) 설치해서, 게들은 (B) 텐트 근처에 오지 않을 것이다.","oko":["(A) 가까이 / (B) 밤에","(A) 멀리 / (B) 정오에","(A) 가까이 / (B) 아침에","(A) 가까이 / (B) 정오에","(A) 멀리 / (B) 밤에"],"opts":["(A) close / (B) at night","(A) far away / (B) at noon","(A) close / (B) in the morning","(A) close / (B) at noon","(A) far away / (B) at night"],"r":{"a":"5) (A) far away / (B) at night","ev":"9~11번 문장","s":[[9,"Smart campers usually hang their food in trees.","현명한 캠핑객들은 보통 그들의 음식을 나무에 걸어둔다."],[10,"They also set up their tents far away from their cooking spots.","그들은 또한 그들의 텐트를 그들의 조리 장소에서 멀리 떨어진 곳에 설치한다."],[11,"Then, the crabs won’t come near the tents at night.","그러면, 그 게들은 밤에 텐트 근처에 오지 않을 것이다."]],"w":"10번 set up their tents far away from their cooking spots(조리 장소에서 멀리 텐트를 설치), 11번 the crabs won’t come near the tents at night(밤에 게들이 텐트 근처에 오지 않을 것이다). 가까이 설치하면 게가 올 수 있고, 정오·아침은 본문에 없음.","c":5},"h":"4f2ede19b7"},{"n":10,"t":"fill","q":"These crabs are not for [A] in Australia, and the people there treat them with [B].","ko":"이 게들은 호주에서 [A] 용도가 아니며, 그곳 사람들은 게들을 [B]으로 대한다.","bko":{"eating":"eat(먹다)의 -ing형, 먹는 것","respect":"존중","gathering":"gather(모이다)의 -ing형","camping":"camp(캠핑하다)의 -ing형","trees":"나무들","smell":"냄새"},"bank":["eating","respect","gathering","camping","trees","smell"],"r":{"a":"[A] eating, [B] respect","ev":"13~14번 문장","s":[[13,"But, these crabs are not for eating in Australia.","하지만, 호주에서 이 게들은 식용이 아니다."],[14,"The people on the island look after these crabs and treat them with respect.","그 섬의 사람들은 이 게들을 돌보고 존중으로 그것들을 대한다."]],"w":"13번 these crabs are not for eating(이 게들은 식용이 아니다), 14번 treat them with respect(존중으로 대한다). gathering(모이는 것)과 camping(캠핑하는 것)은 이 게들의 용도로 맞지 않고, trees(나무들)와 smell(냄새)로 대한다는 말은 뜻이 통하지 않음.","c":null},"h":"774a75628a"}]},{"u":6,"id":"rg1-06-2","no":2,"ko":"타자기로 그린 그림이라고?","items":[{"n":1,"t":"tf","q":"James Cook uses an old machine called a typewriter.","ko":"James Cook은 타자기라고 불리는 오래된 기계를 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He uses an old machine called a typewriter.","그는 타자기라고 불리는 오래된 기계를 사용한다."]],"w":"3번 문장 He uses an old machine called a typewriter와 같은 내용. use(사용하다)의 3인칭형 uses가 그대로 쓰여 T.","c":"T"},"h":"a7382871ab"},{"n":2,"t":"tf","q":"James Cook mostly uses AI to make his art.","ko":"James Cook은 주로 AI를 이용해 예술 작품을 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"1~2번 문장","s":[[1,"These days, some artists use new technology, like AI (Artificial Intelligence), to make their art.","요즘, 몇몇 예술가들은 예술 작품을 만들기 위해 AI(인공 지능)와 같은 새로운 과학기술을 이용한다."],[2,"But James Cook likes doing things in a more traditional way.","하지만 James Cook은 좀 더 전통적인 방식으로 일을 하는 것을 좋아한다."]],"w":"1번은 '몇몇 예술가들'이 AI를 쓴다는 것이고, 2번에서 James Cook은 더 전통적인 방식을 좋아한다고 함. 3번에서 쓰는 것은 AI가 아니라 타자기라서 F.","c":"F"},"h":"51e0acc5f3"},{"n":3,"t":"tf","q":"One picture can take James four to five days to finish.","ko":"그림 하나를 완성하는 데 James는 4일에서 5일이 걸릴 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"In fact, one picture can take him four to five days to finish.","사실, 그림 하나를 완성하는 데 그는 4일에서 5일이 걸릴 수 있다."]],"w":"9번 문장 one picture can take him four to five days to finish와 같은 내용. take A 시간 to-v는 'A가 ~하는 데 시간이 걸리다'라 T.","c":"T"},"h":"9e4e392a56"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But James Cook likes doing things in a more traditional way.)","ko":"하지만 James Cook은 좀 더 전통적인 방식으로 일을 하는 것을 좋아한다.","opts":["현대적인","전통적인","빠른","쉬운"],"word":"traditional","r":{"a":"2) 전통적인","ev":"1~2번 문장","s":[[1,"These days, some artists use new technology, like AI (Artificial Intelligence), to make their art.","요즘, 몇몇 예술가들은 예술 작품을 만들기 위해 AI(인공 지능)와 같은 새로운 과학기술을 이용한다."],[2,"But James Cook likes doing things in a more traditional way.","하지만 James Cook은 좀 더 전통적인 방식으로 일을 하는 것을 좋아한다."]],"w":"1번에서 요즘 예술가들은 new technology를 쓰지만(But) 2번 James는 more traditional way를 좋아함. 새 기술과 반대되는 오래된 방식이라 traditional은 '전통적인'. '현대적인'은 반대 뜻.","c":2},"h":"6d00a7400e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (For example, he uses the brackets to draw a curvy line.)","ko":"예를 들어, 그는 곡선을 그리기 위해 괄호를 사용한다.","opts":["곧은","굵은","구불구불한","짧은"],"word":"curvy","r":{"a":"3) 구불구불한","ev":"7번 문장","s":[[7,"For example, he uses the brackets to draw a curvy line.","예를 들어, 그는 곡선을 그리기 위해 괄호를 사용한다."]],"w":"7번에서 괄호 ( ) 기호로 선을 그리는 장면. 괄호는 둥글게 휘어진 모양이라 curvy line은 '구불구불한 선'. 곧은 선은 반대 뜻.","c":3},"h":"ba8de6a9b1"},{"n":6,"t":"ref","q":"What does the underlined \"these pictures\" refer to?\nHowever, these pictures aren’t made quickly.","ko":"밑줄 친 these pictures가 가리키는 것은?","sko":"하지만, 이 그림들은 빠르게 만들어지지는 않는다.","opts":["AI가 만든 그림들","James가 타자기로 만든 그림들","유명한 사람들의 사진들","타자기의 글자들"],"r":{"a":"2) James가 타자기로 만든 그림들","ev":"7~8번 문장","s":[[7,"For example, he uses the brackets to draw a curvy line.","예를 들어, 그는 곡선을 그리기 위해 괄호를 사용한다."],[8,"However, these pictures aren’t made quickly.","하지만, 이 그림들은 빠르게 만들어지지는 않는다."]],"w":"앞 7번까지 설명한 것은 James가 타자기의 기호로 곡선 등을 그려 만드는 방법. 이어서 이 그림들이 빨리 만들어지지 않는다고 하므로 these pictures는 James가 타자기로 만든 그림들.","c":2},"h":"bd0145e890"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He believes “some technologies never die.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 “어떤 기술들은 절대 사라지지 않는다”고 믿는다.","opts":["그는 오래된 기술 중 일부는 결코 사라지지 않는다고 믿는다.","그는 모든 기술이 언젠가는 사라진다고 믿는다.","그는 새로운 기술이 오래된 기술을 곧 대신한다고 믿는다.","그는 기술이 사람을 해칠 수 있다고 믿는다."],"r":{"a":"1) 그는 오래된 기술 중 일부는 결코 사라지지 않는다고 믿는다.","ev":"10~11번 문장","s":[[10,"James enjoys using typewriters to create his art.","James는 자신의 예술 작품을 만들기 위해 타자기를 사용하는 것을 즐긴다."],[11,"He believes “some technologies never die.”","그는 “어떤 기술들은 절대 사라지지 않는다”고 믿는다."]],"w":"never die는 '절대 사라지지 않는다'. 10번에서 타자기를 계속 쓰는 James가 타자기 같은 기술은 사라지지 않는다고 믿는다는 뜻. 모든 기술이 사라진다(2번)는 반대이고, 3번·4번 내용은 본문에 없음.","c":1},"h":"28c0a4bee3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["James Cook은 주로 동물 그림을 그린다.","James Cook은 타자기로 한 시간 만에 그림 하나를 완성한다.","James Cook은 괄호를 이용해 곡선을 그린다.","James Cook은 오래된 기계로는 놀라운 예술을 만들 수 없다고 생각한다."],"opts":["James Cook mainly draws pictures of animals.","James Cook finishes one picture with a typewriter in an hour.","James Cook uses the brackets to draw a curvy line.","James Cook thinks old machines cannot make amazing art."],"r":{"a":"3) James Cook uses the brackets to draw a curvy line.","ev":"4번, 7번, 9번, 12번 문장","s":[[4,"James usually makes pictures of buildings, landscapes, and faces of famous people.","James는 주로 건물, 풍경, 그리고 유명인들의 얼굴을 그림으로 그린다."],[7,"For example, he uses the brackets to draw a curvy line.","예를 들어, 그는 곡선을 그리기 위해 괄호를 사용한다."],[9,"In fact, one picture can take him four to five days to finish.","사실, 그림 하나를 완성하는 데 그는 4일에서 5일이 걸릴 수 있다."],[12,"His goal is to show us that old machines like typewriters can make amazing art.","그의 목표는 타자기와 같은 오래된 기계가 놀라운 예술을 만들 수 있다는 것을 우리에게 보여주는 것이다."]],"w":"7번에서 괄호로 곡선을 그린다고 함. 4번은 건물·풍경·유명인의 얼굴(동물이 아님), 9번은 4~5일(한 시간이 아님), 12번은 오래된 기계도 놀라운 예술을 만들 수 있다고 보여 주고 싶어 해서 나머지는 본문과 다름.","c":3},"h":"00ffcb95c9"},{"n":9,"t":"sum","q":"James types letters, numbers, and special marks to (A) an image, and he uses the (B) to draw a curvy line.","ko":"James는 이미지를 (A) 위해 글자, 숫자, 특수 기호를 치고, 곡선을 그리기 위해 (B)를 사용한다.","oko":["(A) 지우기 / (B) 숫자","(A) 만들기 / (B) 숫자","(A) 지우기 / (B) 괄호","(A) 만들기 / (B) 괄호","(A) 베끼기 / (B) 글자"],"opts":["(A) erase / (B) numbers","(A) shape / (B) numbers","(A) erase / (B) brackets","(A) shape / (B) brackets","(A) copy / (B) letters"],"r":{"a":"4) (A) shape / (B) brackets","ev":"6~7번 문장","s":[[6,"He types different letters, numbers, and special marks like punctuation to shape an image.","그는 이미지를 만들기 위해 다양한 글자, 숫자, 그리고 구두점과 같은 특수 기호를 타이핑한다."],[7,"For example, he uses the brackets to draw a curvy line.","예를 들어, 그는 곡선을 그리기 위해 괄호를 사용한다."]],"w":"6번 to shape an image(이미지를 만들기 위해), 7번 he uses the brackets to draw a curvy line(곡선을 그리기 위해 괄호를 사용). 곡선을 그리는 데 쓰는 것은 괄호이고, 숫자나 글자가 아님. erase(지우다)와 copy(베끼다)는 본문에 없음.","c":4},"h":"594dbbcec9"},{"n":10,"t":"fill","q":"His goal is to [A] us that old machines like typewriters can make amazing [B].","ko":"그의 목표는 타자기와 같은 오래된 기계가 놀라운 [B]을 만들 수 있다는 것을 우리에게 [A] 것이다.","bko":{"show":"보여 주다","art":"예술, 예술 작품","hide":"숨기다","buy":"사다","days":"날들, 며칠","machine":"기계"},"bank":["show","art","hide","buy","days","machine"],"r":{"a":"[A] show, [B] art","ev":"12번 문장","s":[[12,"His goal is to show us that old machines like typewriters can make amazing art.","그의 목표는 타자기와 같은 오래된 기계가 놀라운 예술을 만들 수 있다는 것을 우리에게 보여주는 것이다."]],"w":"12번 문장 His goal is to show us that old machines like typewriters can make amazing art. show A that ~은 'A에게 ~라는 것을 보여 주다'. 오래된 기계가 만드는 것은 art(예술 작품)이고, hide(숨기다)와 buy(사다)는 목표의 뜻과 맞지 않음. days(날들)와 machine(기계)은 '놀라운 ~을 만들 수 있다'에 어울리지 않음.","c":null},"h":"45a9e5cffe"}]},{"u":6,"id":"rg1-06-3","no":3,"ko":"우주에서는 어떤 냄새가 날까?","items":[{"n":1,"t":"tf","q":"A comet is a big icy ball of dust and rocks.","ko":"혜성은 먼지와 바위로 이루어진 커다란 얼음덩어리이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"A comet is a big icy ball of dust and rocks.","혜성은 먼지와 바위로 이루어진 커다란 얼음덩어리이다."]],"w":"6번 문장 A comet is a big icy ball of dust and rocks와 같은 내용이라 T.","c":"T"},"h":"426357b5f6"},{"n":2,"t":"tf","q":"The cloud around comet 67P smells like raspberries.","ko":"혜성 67P 주변의 구름은 라즈베리 같은 냄새가 난다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Scientists discovered that the cloud around this comet has some unique smells like rotten eggs and almonds!","과학자들은 이 혜성 주변의 구름이 썩은 달걀과 아몬드와 같은 몇몇 독특한 냄새를 가지고 있다는 것을 발견했다!"]],"w":"7번에서 67P 주변 구름은 rotten eggs and almonds(썩은 달걀과 아몬드) 같은 냄새라고 함. 라즈베리는 10번의 Sagittarius B2의 냄새라서 F.","c":"F"},"h":"af40931def"},{"n":3,"t":"tf","q":"A NASA researcher says that the smell of space is the same everywhere.","ko":"NASA의 한 연구원은 우주의 냄새는 어디서나 같다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"A NASA researcher says, “The smell of space differs from place to place. Space might smell like a buffet restaurant with all kinds of smells.”","NASA의 한 연구원은 “우주의 냄새는 장소마다 달라요. 우주는 온갖 종류의 냄새를 가지고 있는 뷔페 레스토랑과 같은 냄새가 날지도 몰라요.”라고 말한다."]],"w":"12번에서 연구원은 The smell of space differs from place to place(우주의 냄새는 장소마다 다르다)라고 함. differ는 '다르다'라서 어디서나 같다는 말은 반대라 F.","c":"F"},"h":"99bf97c3d9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists discovered that the cloud around this comet has some unique smells like rotten eggs and almonds!)","ko":"과학자들은 이 혜성 주변의 구름이 썩은 달걀과 아몬드와 같은 몇몇 독특한 냄새를 가지고 있다는 것을 발견했다!","opts":["신선한","썩은","삶은","작은"],"word":"rotten","r":{"a":"2) 썩은","ev":"7번 문장","s":[[7,"Scientists discovered that the cloud around this comet has some unique smells like rotten eggs and almonds!","과학자들은 이 혜성 주변의 구름이 썩은 달걀과 아몬드와 같은 몇몇 독특한 냄새를 가지고 있다는 것을 발견했다!"]],"w":"7번에서 우주 냄새의 예로 rotten eggs(썩은 달걀)를 듦. 썩은 달걀은 좋지 않은 독특한 냄새가 나는 것이라 rotten은 '썩은'. '신선한'은 반대 뜻.","c":2},"h":"bf143a3cd8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The smell of space differs from place to place.)","ko":"우주의 냄새는 장소마다 달라요.","opts":["같다","사라진다","다르다","생긴다"],"word":"differs","r":{"a":"3) 다르다","ev":"12번 문장","s":[[12,"A NASA researcher says, “The smell of space differs from place to place. Space might smell like a buffet restaurant with all kinds of smells.”","NASA의 한 연구원은 “우주의 냄새는 장소마다 달라요. 우주는 온갖 종류의 냄새를 가지고 있는 뷔페 레스토랑과 같은 냄새가 날지도 몰라요.”라고 말한다."]],"w":"12번 differs from place to place는 장소마다 다르다는 뜻. 7번(썩은 달걀·아몬드)과 10번(라즈베리)처럼 냄새가 서로 다른 점과 이어짐. differ는 '다르다'.","c":3},"h":"34d19ffacd"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt smells like raspberries.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 라즈베리 같은 냄새가 난다.","opts":["혜성 67P","우주 비행사","Sagittarius B2라는 큰 성운","NASA의 연구원"],"r":{"a":"3) Sagittarius B2라는 큰 성운","ev":"9~10번 문장","s":[[9,"There’s also a big space cloud named Sagittarius B2.","Sagittarius B2라는 이름의 큰 성운도 있다."],[10,"It smells like raspberries.","그것은 라즈베리 같은 냄새가 난다."]],"w":"10번 바로 앞 9번에서 소개한 것이 a big space cloud named Sagittarius B2. 냄새가 나는 대상이므로 It은 이 성운. 혜성 67P는 7번에서 다른 냄새를 가진 것으로 나옴.","c":3},"h":"cb6c2779a5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As the comet gets closer to the sun, these smells can change.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 혜성이 태양에 점점 더 가까워지면서, 이 냄새들은 바뀔 수 있다.","opts":["혜성이 태양에서 멀어지면 냄새가 사라진다.","혜성이 태양에 점점 가까워지면 이 냄새들이 달라질 수 있다.","혜성이 태양과 만나면 새로운 혜성이 생긴다.","태양이 가까워지면 혜성의 크기가 변한다."],"r":{"a":"2) 혜성이 태양에 점점 가까워지면 이 냄새들이 달라질 수 있다.","ev":"7~8번 문장","s":[[7,"Scientists discovered that the cloud around this comet has some unique smells like rotten eggs and almonds!","과학자들은 이 혜성 주변의 구름이 썩은 달걀과 아몬드와 같은 몇몇 독특한 냄새를 가지고 있다는 것을 발견했다!"],[8,"As the comet gets closer to the sun, these smells can change.","그 혜성이 태양에 점점 더 가까워지면서, 이 냄새들은 바뀔 수 있다."]],"w":"get closer to는 '~에 더 가까워지다', can change는 '바뀔 수 있다'. 7번의 썩은 달걀·아몬드 냄새들이 태양에 가까워지면 달라질 수 있다는 뜻. 멀어지면 사라진다(1번), 새 혜성(3번), 크기(4번)는 본문에 없음.","c":2},"h":"0a735eeab9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["우주의 냄새는 장소마다 다를 수 있다.","과학자들은 혜성이 뜨거운 불덩어리라고 말한다.","혜성 67P 주변 구름에는 아무 냄새도 없다.","우주 비행사들은 우주에서 아무 냄새도 나지 않는다고 말한다."],"opts":["The s
