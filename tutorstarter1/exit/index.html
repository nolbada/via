<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩튜터 스타터 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<header><p style="margin:0 0 6px"><a href="../" style="font-weight:700;color:inherit">← 클래스 활동</a></p><h1>리딩튜터 스타터 1 Exit Test</h1><p class="sub">Reading별 10문항</p></header>

<script>
var P=[{"u":1,"id":"rt1-01-1","no":1,"ko":"나를 맞혀봐!","items":[{"n":1,"t":"tf","q":"The speaker does not have colors or a shape.","ko":"말하는 '나'는 색깔이나 형태가 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"I don’t have colors.","나는 색깔이 없다."],[5,"I don’t have a shape.","나는 형태가 없다."]],"w":"4번에서 색깔이 없다(don’t have colors), 5번에서 형태가 없다(don’t have a shape)고 해요. 본문과 같아요.","c":"T"},"h":"2c0b73b2ea"},{"n":2,"t":"tf","q":"The speaker is an animal.","ko":"말하는 '나'는 동물이다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"I am not an animal.","나는 동물이 아니다."]],"w":"2번 문장에서 I am not an animal(나는 동물이 아니다)이라고 해요. 동물이라는 말은 반대예요.","c":"F"},"h":"13372bca65"},{"n":3,"t":"tf","q":"You can’t cut the speaker.","ko":"당신은 말하는 '나'를 자를 수 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"You can’t cut me.","당신은 나를 자를 수 없다."]],"w":"11번 문장 You can’t cut me(당신은 나를 자를 수 없다)와 같은 내용이에요.","c":"T"},"h":"38eb439724"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You can hardly see me in the desert.)","ko":"당신은 사막에서 나를 거의 볼 수 없다. (hardly는 거의 ~ 않다)","opts":["아주 잘","거의 ~ 않게","항상","빠르게"],"word":"hardly","r":{"a":"2) 거의 ~ 않게","ev":"9번 문장","s":[[9,"You can hardly see me in the desert.","당신은 사막에서 나를 거의 볼 수 없다."]],"w":"hardly는 '거의 ~ 않다'예요. 사막에서는 '나'를 거의 볼 수 없다는 뜻이에요. 바다·강·호수와 달라진 점이에요.","c":2},"h":"073387265b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You need me. I don’t need you.)","ko":"당신은 나를 필요로 한다. 나는 당신이 필요하지 않다.","opts":["보다","자르다","필요로 하다","움직이다"],"word":"need","r":{"a":"3) 필요로 하다","ev":"14~15번 문장","s":[[14,"You need me.","당신은 나를 필요로 한다."],[15,"I don’t need you.","나는 당신이 필요하지 않다."]],"w":"14번은 당신이 나를 필요로 한다는 말이고, 15번은 나는 당신이 필요하지 않다는 말이에요. need = 필요로 하다.","c":3},"h":"40725fe45d"},{"n":6,"t":"ref","q":"What does the underlined \"me\" refer to?\nThe wind can move me.","ko":"밑줄 친 me가 가리키는 것은?","sko":"바람은 나를 움직일 수 있다.","opts":["당신","바람","사막","글 속의 '나'"],"r":{"a":"4) 글 속의 '나'(말하는 이)","ev":"12~13번 문장","s":[[12,"I am weak.","나는 약하다."],[13,"The wind can move me.","바람은 나를 움직일 수 있다."]],"w":"13번의 me는 바람이 아니라 움직여지는 쪽이에요. 이 글에서 I, me는 모두 수수께끼를 말하는 '나'를 가리켜요.","c":4},"h":"40c955f285"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"I don’t need you.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"나는 당신이 필요하지 않다.","opts":["나는 당신이 필요하지 않다.","당신은 나를 필요로 하지 않는다.","나는 당신을 필요로 한다.","나는 당신을 알지 못한다."],"r":{"a":"1) 나는 당신이 필요하지 않다.","ev":"15번 문장","s":[[15,"I don’t need you.","나는 당신이 필요하지 않다."]],"w":"I don’t need you는 나는 당신이 필요하지 않다는 뜻이에요. 14번 You need me(당신은 나를 필요로 한다)와 반대예요.","c":1},"h":"afd316c0cc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["나는 색깔과 형태가 있다.","당신은 나를 쉽게 자를 수 있다.","당신은 바다, 강, 호수에서 나를 볼 수 있다.","바람은 나를 움직일 수 없다."],"opts":["I have colors and a shape.","You can cut me easily.","You can see me in the sea, in rivers, and in lakes.","The wind cannot move me."],"r":{"a":"3) You can see me in the sea, in rivers, and in lakes.","ev":"6~8번 문장","s":[[6,"You can see me in the sea.","당신은 바다에서 나를 볼 수 있다."],[7,"You can see me in rivers.","당신은 강에서 나를 볼 수 있다."],[8,"You can see me in lakes.","당신은 호수에서 나를 볼 수 있다."]],"w":"6~8번에서 바다, 강, 호수에서 '나'를 볼 수 있다고 해요. 나머지는 4~5번(색과 형태 없음), 11번(자를 수 없음), 13번(바람이 움직임)과 달라요.","c":3},"h":"f626f2b4a2"},{"n":9,"t":"sum","q":"I am strong, so you can’t cut me, but the wind can (A) me. You (B) me, but I don’t need you.","ko":"나는 강해서 당신은 나를 자를 수 없지만, 바람은 나를 (A) 수 있다. 당신은 나를 (B)하지만, 나는 당신이 필요하지 않다.","oko":["(A) 숨기다 / (B) 필요로 하다","(A) 움직이다 / (B) 싫어하다","(A) 숨기다 / (B) 싫어하다","(A) 멈추다 / (B) 필요로 하다","(A) 움직이다 / (B) 필요로 하다"],"opts":["(A) hide / (B) need","(A) move / (B) hate","(A) hide / (B) hate","(A) stop / (B) need","(A) move / (B) need"],"r":{"a":"5) (A) move / (B) need","ev":"13~15번 문장","s":[[13,"The wind can move me.","바람은 나를 움직일 수 있다."],[14,"You need me.","당신은 나를 필요로 한다."],[15,"I don’t need you.","나는 당신이 필요하지 않다."]],"w":"13번에서 바람은 나를 움직일 수 있어요(move). 14번에서 당신은 나를 필요로 하고(need), 15번에서 나는 당신이 필요하지 않아요. hide, stop, hate는 본문에 그런 내용이 없어요.","c":5},"h":"fd5d03d6eb"},{"n":10,"t":"fill","q":"You can see me in the [A], in rivers, and in lakes, but you can hardly see me in the [B].","ko":"당신은 [A], 강, 호수에서 나를 볼 수 있지만, [B]에서는 나를 거의 볼 수 없다.","bank":["sea","desert","shape","plant","animal","colors"],"bko":{"sea":"바다","desert":"사막","shape":"형태","animal":"동물","colors":"색깔","plant":"식물"},"r":{"a":"[A] sea, [B] desert","ev":"6~9번 문장","s":[[6,"You can see me in the sea.","당신은 바다에서 나를 볼 수 있다."],[7,"You can see me in rivers.","당신은 강에서 나를 볼 수 있다."],[8,"You can see me in lakes.","당신은 호수에서 나를 볼 수 있다."],[9,"You can hardly see me in the desert.","당신은 사막에서 나를 거의 볼 수 없다."]],"w":"6번에서 바다(the sea), 7·8번에서 강과 호수에서 볼 수 있다고 해요. 9번에서 사막(the desert)에서는 거의 볼 수 없어요. shape나 animal은 이 문장과 상관없어요.","c":null},"h":"8807bc5c15"}]},{"u":1,"id":"rt1-01-2","no":2,"ko":"오~ 감이 있어!","items":[{"n":1,"t":"tf","q":"We hear music with our ears.","ko":"우리는 귀로 음악을 듣는다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"We hear music with our ears.","우리는 귀로 음악을 듣는다."]],"w":"6번 문장 We hear music with our ears(우리는 귀로 음악을 듣는다)와 똑같아요.","c":"T"},"h":"bfff95d5b7"},{"n":2,"t":"tf","q":"We see colors with our ears.","ko":"우리는 귀로 색을 본다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"We see colors with our eyes.","우리는 눈으로 색을 본다."]],"w":"4번 문장에서 우리는 눈(eyes)으로 색을 본다고 해요. 귀(ears)는 5~6번에서 음악을 듣는 데 쓰여요.","c":"F"},"h":"5d7754bfdb"},{"n":3,"t":"tf","q":"Sight, hearing, taste, touch, and smell are our five senses.","ko":"시각, 청각, 미각, 촉각, 후각은 우리의 다섯 가지 감각이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They are sight, hearing, taste, touch, and smell.","그것들은 시각, 청각, 미각, 촉각, 그리고 후각이다."]],"w":"2번 문장에서 They are sight, hearing, taste, touch, and smell이라고 해요. 이 다섯 가지가 five senses예요.","c":"T"},"h":"351dad0ff6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (We taste sweet chocolate with our tongue.)","ko":"우리는 혀로 달콤한 초콜릿을 맛본다.","opts":["쓴","달콤한","차가운","매운"],"word":"sweet","r":{"a":"2) 달콤한","ev":"8번 문장","s":[[8,"We taste sweet chocolate with our tongue.","우리는 혀로 달콤한 초콜릿을 맛본다."]],"w":"혀로 맛보는 초콜릿이니까 sweet는 맛을 말해요. sweet = 달콤한.","c":2},"h":"390d15d272"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (We feel puppies’ fur with our skin.)","ko":"우리는 피부로 강아지의 털을 느낀다.","opts":["발톱","소리","털","냄새"],"word":"fur","r":{"a":"3) 털","ev":"10번 문장","s":[[10,"We feel puppies’ fur with our skin.","우리는 피부로 강아지의 털을 느낀다."]],"w":"피부로 느끼는 강아지의 fur는 부드러운 털이에요. fur = 털.","c":3},"h":"b3a305334a"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are sight, hearing, taste, touch, and smell.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 시각, 청각, 미각, 촉각, 그리고 후각이다.","opts":["우리의 눈과 귀","여러 가지 사물","강아지들","다섯 가지 감각"],"r":{"a":"4) 다섯 가지 감각","ev":"1~2번 문장","s":[[1,"We have five senses.","우리는 다섯 가지 감각을 가지고 있다."],[2,"They are sight, hearing, taste, touch, and smell.","그것들은 시각, 청각, 미각, 촉각, 그리고 후각이다."]],"w":"2번의 They는 바로 앞 1번 문장의 five senses(다섯 가지 감각)를 가리켜요. 뒤에 나오는 sight, hearing 등이 그 감각의 이름이에요.","c":4},"h":"b9262b4a9b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Our nose helps us smell things.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리의 코는 우리가 사물의 냄새를 맡는 것을 돕는다.","opts":["우리의 코는 우리가 사물의 냄새를 맡는 것을 돕는다.","우리의 코는 우리가 사물을 보는 것을 돕는다.","우리는 코로 음식을 맛본다.","우리의 코는 우리가 냄새 맡는 것을 막는다."],"r":{"a":"1) 우리의 코는 우리가 사물의 냄새를 맡는 것을 돕는다.","ev":"11번 문장","s":[[11,"Our nose helps us smell things.","우리의 코는 우리가 사물의 냄새를 맡는 것을 돕는다."]],"w":"help us smell은 우리가 냄새 맡는 것을 돕는다는 뜻이에요. 코는 후각을 맡는 부위예요.","c":1},"h":"01028dbd28"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우리는 여섯 가지 감각을 가지고 있다.","우리는 코로 음악을 듣는다.","우리는 피부로 사물을 느낀다.","우리는 귀로 색을 본다."],"opts":["We have six senses.","We hear music with our nose.","We feel things with our skin.","We see colors with our ears."],"r":{"a":"3) We feel things with our skin.","ev":"9~10번 문장","s":[[9,"Our skin helps us feel things.","우리의 피부는 우리가 사물을 느끼는 것을 돕는다."],[10,"We feel puppies’ fur with our skin.","우리는 피부로 강아지의 털을 느낀다."]],"w":"9~10번에서 피부로 사물과 강아지의 털을 느낀다고 해요. 나머지는 1번(다섯 감각), 4번(눈으로 색), 6번(귀로 음악)과 달라요.","c":3},"h":"7064ad0521"},{"n":9,"t":"sum","q":"Our eyes help us (A) things, and our tongue helps us (B) food.","ko":"우리의 눈은 우리가 사물을 (A) 것을 돕고, 우리의 혀는 우리가 음식을 (B) 것을 돕는다.","oko":["(A) 듣다 / (B) 맛보다","(A) 보다 / (B) 냄새 맡다","(A) 느끼다 / (B) 맛보다","(A) 보다 / (B) 맛보다","(A) 듣다 / (B) 느끼다"],"opts":["(A) hear / (B) taste","(A) see / (B) smell","(A) feel / (B) taste","(A) see / (B) taste","(A) hear / (B) feel"],"r":{"a":"4) (A) see / (B) taste","ev":"3번, 7번 문장","s":[[3,"Our eyes help us see things.","우리의 눈은 우리가 사물을 보는 것을 돕는다."],[7,"Our tongue helps us taste food.","우리의 혀는 우리가 음식을 맛보는 것을 돕는다."]],"w":"3번에서 눈은 사물을 보는 것(see)을 돕고, 7번에서 혀는 음식을 맛보는 것(taste)을 도와요. 듣기는 귀(5번), 냄새는 코(11번), 느끼기는 피부(9번)가 맡아요.","c":4},"h":"99fede3d84"},{"n":10,"t":"fill","q":"We feel puppies’ fur with our [A], and we taste sweet chocolate with our [B].","ko":"우리는 [A]로 강아지의 털을 느끼고, 우리는 [B]로 달콤한 초콜릿을 맛본다.","bank":["skin","tongue","nose","ears","eyes","fur"],"bko":{"skin":"피부","tongue":"혀","nose":"코","ears":"귀","eyes":"눈","fur":"털"},"r":{"a":"[A] skin, [B] tongue","ev":"8번, 10번 문장","s":[[8,"We taste sweet chocolate with our tongue.","우리는 혀로 달콤한 초콜릿을 맛본다."],[10,"We feel puppies’ fur with our skin.","우리는 피부로 강아지의 털을 느낀다."]],"w":"10번에서 강아지의 털은 피부(skin)로 느끼고, 8번에서 달콤한 초콜릿은 혀(tongue)로 맛본다고 해요. 코·귀·눈은 이 일을 하는 부위가 아니에요.","c":null},"h":"5b7e9666d3"}]},{"u":1,"id":"rt1-01-3","no":3,"ko":"낙타가 아닙니다만","items":[{"n":1,"t":"tf","q":"Llamas live in South America.","ko":"라마는 남아메리카에 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Llamas live in South America.","라마는 남아메리카에 산다."]],"w":"9번 문장 Llamas live in South America(라마는 남아메리카에 산다)와 똑같아요.","c":"T"},"h":"47d2a5ec90"},{"n":2,"t":"tf","q":"Each foot of a llama has three toenails.","ko":"라마의 각각의 발은 세 개의 발톱을 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Each foot has two toenails.","각각의 발은 두 개의 발톱을 가지고 있다."]],"w":"8번 문장에서 각각의 발은 두 개(two)의 발톱을 가지고 있다고 해요. 세 개는 틀려요.","c":"F"},"h":"b17b6a2720"},{"n":3,"t":"tf","q":"Llamas have long ears and four long legs.","ko":"라마는 긴 귀와 네 개의 긴 다리를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6~7번 문장","s":[[6,"They have long ears.","그들은 긴 귀를 가지고 있다."],[7,"They also have four long legs.","그들은 또한 네 개의 긴 다리를 가지고 있다."]],"w":"6번에서 긴 귀(long ears), 7번에서 네 개의 긴 다리(four long legs)를 가지고 있다고 해요.","c":"T"},"h":"339e1a03d1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They carry heavy things for people.)","ko":"그들은 사람들을 위해 무거운 것들을 나른다.","opts":["던지다","팔다","나르다","만들다"],"word":"carry","r":{"a":"3) 나르다","ev":"12번 문장","s":[[12,"They carry heavy things for people.","그들은 사람들을 위해 무거운 것들을 나른다."]],"w":"무거운 것들을 사람들을 위해 옮겨 주는 일이에요. carry = 나르다.","c":3},"h":"7ddf5e2db6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But llamas don’t have humps.)","ko":"하지만 라마는 혹이 없다.","opts":["혹","목","귀","발톱"],"word":"humps","r":{"a":"1) 혹","ev":"3번 문장","s":[[3,"But llamas don’t have humps.","하지만 라마는 혹이 없다."]],"w":"낙타처럼 보이는 라마의 다른 점이에요. 낙타 등에 있는 볼록한 부분이 hump(혹)예요.","c":1},"h":"53cfb40f08"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey look like camels.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 낙타처럼 보인다.","opts":["낙타들","사람들","남아메리카","라마들"],"r":{"a":"4) 라마들","ev":"1~2번 문장","s":[[1,"Do you know about llamas?","당신은 라마에 관해 아는가?"],[2,"They look like camels.","그들은 낙타처럼 보인다."]],"w":"2번의 They는 1번 문장에서 묻는 대상인 llamas(라마)를 가리켜요. camels(낙타)는 라마가 닮은 동물이에요.","c":4},"h":"8231596394"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They walk up to 26 kilometers a day.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 하루에 26킬로미터까지 걷는다.","opts":["그들은 26일 동안 쉬지 않고 걷는다.","그들은 하루에 최대 26킬로미터까지 걷는다.","그들은 26킬로미터를 걷는 데 하루가 걸린다.","그들은 하루에 26킬로미터 이상 걷는다."],"r":{"a":"2) 그들은 하루에 최대 26킬로미터까지 걷는다.","ev":"10번 문장","s":[[10,"They walk up to 26 kilometers a day.","그들은 하루에 26킬로미터까지 걷는다."]],"w":"up to는 '~까지'이고 a day는 '하루에'예요. 26킬로미터는 넘지 않는 거리의 최대치예요.","c":2},"h":"1b5dbabbac"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["라마는 큰 머리 e like hot, sunny summer days.","어떤 사람들은 덥고 화창한 여름 날들을 좋아한다."]],"w":"hot(더운)과 summer(여름) 사이에서 날씨를 꾸미는 말이에요. sunny = 화창한.","c":2},"h":"824470195d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They enjoy winter activities like skiing.)","ko":"그들은 스키와 같은 겨울 활동을 즐긴다. (activities는 activity의 복수)","opts":["계절","옷","장소","활동"],"word":"activities","r":{"a":"4) 활동","ev":"13번 문장","s":[[13,"They enjoy winter activities like skiing.","그들은 스키와 같은 겨울 활동을 즐긴다."]],"w":"스키(skiing)는 겨울에 하는 '활동'이에요. activity = 활동.","c":4},"h":"bb77091f00"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey go to the beach.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 해변으로 간다.","opts":["겨울인들","모래성들","여름인들","눈사람들"],"r":{"a":"3) 여름인들","ev":"5~6번 문장","s":[[5,"Summer people go outside in hot weather.","여름인들은 더운 날씨에 밖으로 나간다."],[6,"They go to the beach.","그들은 해변으로 간다."]],"w":"6번의 They는 바로 앞 5번 문장의 Summer people(여름인들)이에요. 해변으로 가는 사람은 여름인들이고, 겨울인들은 10번부터 나와요.","c":3},"h":"4bf37d9758"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"On the other hand, winter people like the cold weather.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"반면에, 겨울인들은 추운 날씨를 좋아한다.","opts":["반면에, 겨울인들은 추운 날씨를 좋아한다.","게다가, 겨울인들은 더운 날씨를 좋아한다.","결과적으로, 겨울인들은 추운 날씨를 싫어한다.","예를 들어, 여름인들은 추운 날씨를 좋아한다."],"r":{"a":"1) 반면에, 겨울인들은 추운 날씨를 좋아한다.","ev":"10번 문장","s":[[10,"On the other hand, winter people like the cold weather.","반면에, 겨울인들은 추운 날씨를 좋아한다."]],"w":"On the other hand는 '반면에'예요. 여름인 이야기 뒤에 겨울인들이 추운 날씨를 좋아한다고 대조하는 문장이에요.","c":1},"h":"a86f088fd0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["여름인들은 춥고 눈이 오는 날을 좋아한다.","여름인들은 해변에서 모래성을 만든다.","여름인들은 눈사람을 만든다.","겨울인들은 더운 날씨에 해변에 간다."],"opts":["Summer people like cold, snowy days.","Summer people build sandcastles at the beach.","Summer people build snowmen.","Winter people go to the beach in hot weather."],"r":{"a":"2) Summer people build sandcastles at the beach.","ev":"1, 5~7, 12번 문장","s":[[1,"Some people like hot, sunny summer days.","어떤 사람들은 덥고 화창한 여름 날들을 좋아한다."],[5,"Summer people go outside in hot weather.","여름인들은 더운 날씨에 밖으로 나간다."],[6,"They go to the beach.","그들은 해변으로 간다."],[7,"They build sandcastles.","그들은 모래성을 만든다."],[12,"They build snowmen.","그들은 눈사람을 만든다."]],"w":"여름인들은 해변에서 모래성을 만들어요(6~7번). 여름인들은 덥고 화창한 날을 좋아하고(1번), 눈사람은 겨울인들이 만들며(12번), 더운 날씨에 밖으로 나가는 사람은 여름인들이에요(5번).","c":2},"h":"26e3b9fea9"},{"n":9,"t":"sum","q":"Summer people go to the beach and enjoy (A). Winter people build snowmen and enjoy winter activities like (B).","ko":"여름인들은 해변에 가서 (A)를 즐긴다. 겨울인들은 눈사람을 만들고 (B)와 같은 겨울 활동을 즐긴다.","oko":["(A) 스키 타기 / (B) 수영","(A) 모래성 / (B) 수영","(A) 수영 / (B) 스키 타기","(A) 눈사람 / (B) 스키 타기","(A) 수영 / (B) 모래성"],"opts":["(A) skiing / (B) swimming","(A) sandcastles / (B) swimming","(A) swimming / (B) skiing","(A) snowmen / (B) skiing","(A) swimming / (B) sandcastles"],"r":{"a":"3) (A) swimming / (B) skiing","ev":"6, 8, 12~13번 문장","s":[[6,"They go to the beach.","그들은 해변으로 간다."],[8,"They enjoy swimming.","그들은 수영하는 것을 즐긴다."],[12,"They build snowmen.","그들은 눈사람을 만든다."],[13,"They enjoy winter activities like skiing.","그들은 스키와 같은 겨울 활동을 즐긴다."]],"w":"6번과 8번에서 여름인들은 해변에 가서 수영(swimming)을 즐기고, 12번과 13번에서 겨울인들은 눈사람을 만들고 스키(skiing) 같은 겨울 활동을 즐겨요.","c":3},"h":"29cc19b879"},{"n":10,"t":"fill","q":"Summer people like hot and [A] days, but winter people like cold and [B] days.","ko":"여름인들은 덥고 [A] 날을 좋아하지만, 겨울인들은 춥고 [B] 날을 좋아한다.","bank":["sunny","snowy","outside","beach","skiing","water"],"bko":{"sunny":"화창한","snowy":"눈이 오는","outside":"바깥에","beach":"해변","skiing":"스키","water":"물"},"r":{"a":"[A] sunny, [B] snowy","ev":"1, 3번 문장","s":[[1,"Some people like hot, sunny summer days.","어떤 사람들은 덥고 화창한 여름 날들을 좋아한다."],[3,"Others like cold, snowy winter days.","다른 사람들은 춥고 눈이 오는 겨울 날들을 좋아한다."]],"w":"1번 hot, sunny summer days(덥고 화창한 여름 날들)와 3번 cold, snowy winter days(춥고 눈이 오는 겨울 날들)에서 가져왔어요. outside(바깥에), beach(해변), skiing(스키), water(물)는 days를 꾸미는 날씨 말이 아니라서 빈칸에 맞지 않아요.","c":null},"h":"c7c63da2ac"}]},{"u":2,"id":"rt1-02-3","no":3,"ko":"비둘기는 내 친구","items":[{"n":1,"t":"tf","q":"The elderly man named the pigeon Blanchon.","ko":"노인은 비둘기에게 Blanchon이라는 이름을 지어 주었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"He named the pigeon Blanchon.","그는 그 비둘기를 Blanchon이라고 이름 지었다."]],"w":"6번 문장에 He named the pigeon Blanchon이 나와요. He는 노인이에요.","c":"T"},"h":"8447df9509"},{"n":2,"t":"tf","q":"Blanchon watches the man in his kitchen.","ko":"Blanchon은 부엌에서 노인을 지켜본다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"She watches him in his workshop.","그녀는 그의 작업장에서 그를 지켜본다."]],"w":"9번 문장에서 비둘기가 노인을 지켜보는 곳은 부엌(kitchen)이 아니라 그의 작업장(workshop)이에요.","c":"F"},"h":"10b99fbfd5"},{"n":3,"t":"tf","q":"The man brought the pigeon home after his wife told him to.","ko":"아내가 말한 뒤에 노인은 비둘기를 집으로 데려왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"She said, “Bring it home!”","그녀는 “집으로 데려와요!”라고 말했다."],[5,"So he did.","그래서 그는 그렇게 했다."]],"w":"4번에서 아내가 '집으로 데려와요!'라고 말했고, 5번 So he did(그래서 그는 그렇게 했다)에서 노인이 그대로 했어요.","c":"T"},"h":"5e88d0a1b0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (An elderly man saw it.)","ko":"한 노인이 그것을 보았다. (elderly는 연세가 드신)","opts":["어린","연세가 드신","키가 큰","화가 난"],"word":"elderly","r":{"a":"2) 연세가 드신","ev":"2번 문장","s":[[2,"An elderly man saw it.","한 노인이 그것을 보았다."]],"w":"나무에서 떨어진 비둘기를 본 사람은 아내가 있는 한 어르신이에요. elderly = 연세가 드신.","c":2},"h":"bed51d1b3b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He just respects the bird.)","ko":"그는 그저 그 새를 존중한다. (respect는 존중하다)","opts":["무시한다","두려워한다","존중한다","가르친다"],"word":"respects","r":{"a":"3) 존중한다","ev":"12~13번 문장","s":[[12,"He says it’s easy.","그는 그것이 쉽다고 말한다."],[13,"He just respects the bird.","그는 그저 그 새를 존중한다."]],"w":"12번에서 새와 친구가 되는 건 쉽다고 하고, 13번에서 그 이유로 새를 respect한다고 해요. respect = 존중하다.","c":3},"h":"125df9e818"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHe says it’s easy.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그는 그것이 쉽다고 말한다.","opts":["새와 친구가 되는 것","새를 키우는 것","작업장에서 일하는 것","나무에서 떨어지는 것"],"r":{"a":"1) 새와 친구가 되는 것","ev":"11~12번 문장","s":[[11,"People ask, “How can you be friends with a bird?”","사람들은 “당신은 어떻게 새와 친구가 될 수 있나요?”라고 묻는다."],[12,"He says it’s easy.","그는 그것이 쉽다고 말한다."]],"w":"앞 11번 문장에서 사람들이 '어떻게 새와 친구가 될 수 있나요?'라고 물어요. 12번에서 노인은 그것(새와 친구가 되는 것)이 쉽다고 말해요.","c":1},"h":"0dbe25dfd4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So he did.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 그는 그렇게 했다.","opts":["그래서 그는 비둘기를 나무 위에 올려놓았다.","그래서 그는 비둘기를 집으로 데려왔다.","그래서 그는 비둘기를 놓아 주었다.","그래서 그는 아내에게 말하지 않았다."],"r":{"a":"2) 그래서 그는 비둘기를 집으로 데려왔다.","ev":"4~5번 문장","s":[[4,"She said, “Bring it home!”","그녀는 “집으로 데려와요!”라고 말했다."],[5,"So he did.","그래서 그는 그렇게 했다."]],"w":"did는 앞 4번 문장에서 아내가 말한 Bring it home(집으로 데려와요)을 대신해요. 그래서 노인은 비둘기를 집으로 데려왔다는 뜻이에요.","c":2},"h":"23e4b86b88"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["노인의 아내가 새끼 비둘기를 처음 발견했다.","노인은 새끼 비둘기를 나무 아래에 두고 떠났다.","Blanchon은 집에만 있고 노인과 함께 나가지 않는다.","Blanchon은 이제 노인과 함께 모든 곳에 간다."],"opts":["The man’s wife found the baby pigeon first.","The man left the baby pigeon under the tree.","Blanchon stays at home and never goes out with the man.","Blanchon goes everywhere with the man now."],"r":{"a":"4) Blanchon goes everywhere with the man now.","ev":"2~3, 5, 7번 문장","s":[[2,"An elderly man saw it.","한 노인이 그것을 보았다."],[3,"He told his wife.","그는 그의 아내에게 말했다."],[5,"So he did.","그래서 그는 그렇게 했다."],[7,"She goes everywhere with him now.","그녀는 이제 그와 함께 모든 곳에 간다."]],"w":"2번에서 비둘기를 처음 본 사람은 노인이고, 5번에서 비둘기를 집으로 데려왔으며, 7번에서 비둘기는 이제 노인과 모든 곳에 함께 가요.","c":4},"h":"70f2de5da4"},{"n":9,"t":"sum","q":"An elderly man’s wife said to bring the baby pigeon (A), and he did. He says being friends with a bird is easy because he just (B) the bird.","ko":"노인의 아내는 새끼 비둘기를 (A) 데려오라고 말했고, 그는 그렇게 했다. 그는 새와 친구가 되는 것이 쉽다고 말하는데, 그는 그저 그 새를 (B)하기 때문이다.","oko":["(A) 나무로 / (B) 존중한다","(A) 집으로 / (B) 두려워한다","(A) 집으로 / (B) 가르친다","(A) 작업장으로 / (B) 존중한다","(A) 집으로 / (B) 존중한다"],"opts":["(A) to a e (B) heroes.","ko":"소방관들은 때때로 응급처치를 (A)하고 밤낮으로 일한다. 그들은 (B) 영웅이다.","oko":["(A) 한다 / (B) 게으른","(A) 받는다 / (B) 용감한","(A) 잃는다 / (B) 용감한","(A) 한다 / (B) 수줍음 많은","(A) 한다 / (B) 용감한"],"opts":["(A) give / (B) lazy","(A) take / (B) brave","(A) lose / (B) brave","(A) give / (B) shy","(A) give / (B) brave"],"r":{"a":"5) (A) give / (B) brave","ev":"11~13번 문장","w":"11번에서 응급처치를 하고(give first aid), 12번에서 밤낮으로 일하고, 13번에서 용감한(brave) 영웅이라고 해요.","c":5,"s":[[11,"Sometimes, they give first aid.","때때로, 그들은 응급처치를 한다."],[12,"They work day and night.","그들은 밤낮으로 일한다."],[13,"Firefighters are brave heroes!","소방관들은 용감한 영웅이다!"]]},"h":"cb5c17dce7"},{"n":10,"t":"fill","q":"Firefighters [A] people from danger, and they also save [B].","ko":"소방관들은 사람들을 위험으로부터 [A]하고, [B]도 구한다.","bank":["save","animals","drive","spray","wear","heroes"],"bko":{"save":"구하다","animals":"동물들","drive":"운전하다","spray":"뿌리다","wear":"입다","heroes":"영웅들"},"r":{"a":"[A] save, [B] animals","ev":"2~3번 문장","w":"2번에서 사람들을 위험으로부터 구하고(save), 3번에서 동물들(animals)도 구한다고 해요. heroes는 1번에 나오지만 구하는 대상이 아니에요.","c":null,"s":[[2,"They save people from danger.","그들은 사람들을 위험으로부터 구한다."],[3,"They also save animals.","그들은 동물들도 구한다."]]},"h":"9140f29fe5"}]},{"u":4,"id":"rt1-04-3","no":3,"ko":"세상에서 가장 특별한 연주","items":[{"n":1,"t":"tf","q":"The writer's old skateboard became a guitar.","ko":"글쓴이의 오래된 스케이트보드는 기타가 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~4번 문장","w":"2번에서 오래된 스케이트보드를 가져왔고, 3번에서 기타 줄을 추가했고, 4번에서 기타가 되었다(It became a guitar)고 해요.","c":"T","s":[[2,"I brought my old skateboard.","나는 내 오래된 스케이트보드를 가져왔다."],[3,"I added guitar strings to it.","나는 그것에 기타 줄을 추가했다."],[4,"It became a guitar!","그것은 기타가 되었다!"]]},"h":"f1997c6ded"},{"n":2,"t":"tf","q":"Jack put beans in cans.","ko":"Jack은 깡통에 콩을 넣었다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","w":"Jack이 가져온 것은 깡통이 아니라 플라스틱 병(plastic bottles)이고, 콩은 그 병에 넣었어요(8~9번). 깡통은 Elsa가 가져왔어요.","c":"F","s":[[8,"My friend Jack brought plastic bottles.","내 친구 Jack은 플라스틱 병들을 가져왔다."],[9,"He put beans in them.","그는 그것들에 콩을 넣었다."]]}," ar your helmet next time!”","아빠는 ‘다음에는 헬멧을 써라!’라고 말씀하셨다."]],"w":"Wear는 명령문 동사이고 next time은 다음에는이에요. 다음에는 헬멧을 쓰라는 뜻이에요.","c":4},"h":"a764cf1b2b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Mike의 친구들이 그에게 은색 자전거를 주었다.","Mike의 자전거는 빨간색이었다.","Mike는 자전거를 매우 빠르게 타다가 넘어졌다.","Mike는 공원에 가기 전에 집에 갔다."],"opts":["Mike's friends gave him a silver bike.","Mike's bike was red.","Mike rode his bike really fast and then he fell.","Mike went home before he went to the park."],"r":{"a":"3) Mike rode his bike really fast and then he fell.","ev":"12~13번 문장","s":[[12,"He rode it really fast.","그는 그것을 매우 빠르게 탔다."],[13,"Then he fell.","그리고서 그는 넘어졌다."]],"w":"12번에서 매우 빠르게 탔고, 13번에서 Then he fell(그리고서 넘어졌다)이라고 해요.","c":3},"h":"25e154e8b0"},{"n":9,"t":"sum","q":"Mike did not (A) to his dad, so he got hurt. His dad said to (B) a helmet next time.","ko":"Mike는 아빠의 말씀을 (A)하지 않아서 다쳤다. 아빠는 다음에는 헬멧을 (B)라고 말씀하셨다.","oko":["(A) 말하다 / (B) 사다","(A) 듣다 / (B) 쓰다","(A) 웃다 / (B) 벗다","(A) 소리치다 / (B) 만들다","(A) 대답하다 / (B) 잃어버리다"],"opts":["(A) talk / (B) buy","(A) listen / (B) wear","(A) laugh / (B) take off","(A) yell / (B) make","(A) answer / (B) lose"],"r":{"a":"2) (A) listen / (B) wear","ev":"7~8번, 14번, 17번 문장","s":[[7,"His dad yelled, “Put on your helmet!”","그의 아빠는 ‘헬멧을 쓰렴!’이라고 소리쳤다."],[8,"Mike didn’t listen.","Mike는 듣지 않았다."],[14,"He hurt his forehead.","그는 이마를 다쳤다."],[17,"His dad said, “Wear your helmet next time!”","아빠는 ‘다음에는 헬멧을 써라!’라고 말씀하셨다."]],"w":"8번에서 Mike didn't listen(듣지 않았다), 17번에서 Wear your helmet next time(다음에는 헬멧을 써라)이라고 해요.","c":2},"h":"c613817a4d"},{"n":10,"t":"fill","q":"It was Mike’s [A]. His mom and dad gave him a [B], and it was silver.","ko":"Mike의 [A]이었다. 그의 엄마와 아빠는 그에게 [B]를 주었고, 그것은 은색이었다.","bank":["birthday","bike","park","wound","forehead","excited"],"bko":{"birthday":"생일","bike":"자전거","park":"공원","wound":"상처","forehead":"이마","excited":"신이 난"},"r":{"a":"[A] birthday, [B] bike","ev":"1~4번 문장","s":[[1,"It was Mike’s birthday.","Mike의 생일이었다." c":4},"h":"c2fb5c8b9d"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is one of the largest crocodiles on Earth.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 지구에서 가장 큰 악어들 중 하나이다.","opts":["나일강","나일악어","지중해","지구"],"r":{"a":"2) 나일악어","ev":"12~13번 문장","s":[[12,"For example, the Nile crocodile lives in the river.","예를 들면, 나일악어는 그 강에서 살고 있다."],[13,"It is one of the largest crocodiles on Earth.","그것은 지구에서 가장 큰 악어들 중 하나이다."]],"w":"13번의 It은 바로 앞 12번 문장의 주어 the Nile crocodile(나일악어)이에요. 가장 큰 악어들 중 하나라는 뜻이라서 강이 아니라 악어예요.","c":2},"h":"f4dbd867ac"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is about 6,650 kilometers long.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 길이가 약 6,650킬로미터이다.","opts":["그것은 너비가 약 6,650미터이다.","그것은 약 6,650개의 나라를 지난다.","그것은 길이가 약 6,650킬로미터이다.","그것은 깊이가 약 6,650킬로미터이다."],"r":{"a":"3) 그것은 길이가 약 6,650킬로미터이다.","ev":"3번 문장","s":[[3,"It is about 6,650 kilometers long.","그것은 길이가 약 6,650킬로미터이다."]],"w":"about은 '약', kilometers long은 '킬로미터 길이'예요. 나라 수는 11개국(4번)이고, 너비나 깊이 이야기는 없어요.","c":3},"h":"12cd43dcaa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["나일강은 홍해에서 끝난다.","고대 이집트인들은 나일강을 이동에만 이용했다.","오늘날 나일강을 이용하는 사람은 아무도 없다.","나일악어는 그 강에서 산다."],"opts":["The Nile River ends in the Red Sea.","Ancient Egyptians used the Nile only for travel.","Nobody uses the Nile River today.","The Nile crocodile lives in the river."],"r":{"a":"4) The Nile crocodile lives in the river.","ev":"5번, 7번, 8번, 12번 문장","s":[[5,"It ends in the Mediterranean Sea.","그것은 지중해에서 끝난다."],[7,"They also used it for farming.","그들은 농사에도 그것을 이용했다."],[8,"Many people still use it today.","오늘날에도 많은 사람들이 여전히 그것을 이용한다."],[12,"For example, the Nile crocodile lives in the river.","예를 들면, 나일악어는 그 강에서 살고 있다."]],"w":"12번 문장에 나일악어가 그 강에서 산다고 해요. 지중해에서 끝나고(5번), 이집트인은 농사에도 썼고(7번), 오늘날에도 많은 사람들이 이용해요(8번).","c":4},"h":"6ef597598e"},{"n":9,"t":"sum","q":"The Nile River is the (A) river in the world, and a lot of (B) live in it.","ko":"나일강은 세계에서 가장 (A) 강이고, 많은 (B)이 그곳에서 산다.","oko":["(A) 가장 짧은 / (B) 야생 생물","(A) 가장 긴 / (B) 배들","(A) 가장 넓은 / (B) 농사","(A) 가장 짧은 / (B) 관광객들","(A) 가장 긴 / (B) 야생 생물"],"opts":["(A) shortest / (B) wildlife","(A) longest / (B) ships","(A) widest / (B) farming","(A) shortest / (B) tourists","(A) longest / (B) wildlife"],"r":{"a":"5) (A) longest / (B) wildlife","ev":"2번, 10번 문장","s":[[2,"It is the longest river in the world.","그것은 세계에서 가장 긴 강이다."],[10,"A lot of wildlife live in the river.","그 강에는 많은 야생 생물이 살고 있다."]],"w":"2번에서 세계에서 가장 긴(longest) 강이고, 10번에서 많은 야생 생물(wildlife)이 산다고 해요.","c":5},"h":"8bc85bbc9b"},{"n":10,"t":"fill","q":"Ancient Egyptians used the Nile River for [A] and [B].","ko":"고대 이집트인들은 나일강을 [A]과 [B]에 이용했다.","bank":["travel","farming","wildlife","crocodile","countries","kilometers"],"bko":{"travel":"이동","farming":"농사","wildlife":"야생 생물","crocodile":"악어","countries":"나라들","kilometers":"킬로미터"},"r":{"a":"[A] travel, [B] farming","ev":"6~7번 문장","s":[[6,"Ancient Egyptians used it for travel.","고대 이집트인들은 이동에 그것을 이용했다."],[7,"They also used it for farming.","그들은 농사에도 그것을 이용했다."]],"w":"6번에서 for travel(이동에), 7번에서 for farming(농사에)이라고 해요. 나머지 단어도 본문에 나오지만 이집트인이 강을 이용한 목적은 아니에요.","c":null},"h":"a5efae1910"}]},{"u":6,"id":"rt1-06-2","no":2,"ko":"진심을 받아주세요!","items":[{"n":1,"t":"tf","q":"Tom handed in his math homework on Monday.","ko":"Tom은 월요일에 수학 숙제를 제출했다.","r":{"a":"F (본문과 다른 내용)","ev":"1~2번 문장","s":[[1,"Our math homework was due on Monday.","우리의 수학 숙제는 월요일까지였습니다."],[2,"But I couldn’t hand it in.","하지만 저는 그것을 제출할 수 없었습니다."]],"w":"1번에서 숙제는 월요일까지였지만, 2번에서 제출할 수 없었다(couldn’t hand it in)고 해요. 제출했다는 말은 반대예요.","c":"F"},"h":"30b82d5140"},{"n":2,"t":"tf","q":"Tom had a high fever.","ko":"Tom은 고열이 났다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"I had a high fever.","저는 고열이 났습니다."]],"w":"6번 문장에 I had a high fever가 그대로 있어요.","c":"T"},"h":"6cd4f73482"},{"n":3,"t":"tf","q":"Tom’s friends took him to the hospital.","ko":"Tom의 친구들이 그를 병원에 데려갔다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"My parents took me to the hospital.","부모님은 저를 병원으로 데려갔습니다."]],"w":"7번에서 병원에 데려간 사람은 친구들이 아니라 My parents(부모님)예요.","c":"F"},"h":"afc7b710dd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Our math homework was due on Monday.)","ko":"우리의 수학 숙제는 월요일까지였습니다. (due는 ~하기로 되어 있는)","opts":["어려운","재미있는","제출하기로 되어 있는","잃어버린"],"word":"due","r":{"a":"3) 제출하기로 되어 있는","ev":"1~2번 문장","s":[[1,"Our math homework was due on Monday.","우리의 수학 숙제는 월요일까지였습니다."],[2,"But I couldn’t hand it in.","하지만 저는 그것을 제출할 수 없었습니다."]],"w":"월요일이 숙제 마감일이었다는 말이에요. 다음 문장에서 hand it in(제출하다)을 못 했다고 해서 due는 '제출하기로 되어 있는'이에요.","c":3},"h":"0b6ba2f4cb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (I hope you accept my apology.)","ko":"선생님께서 사과를 받아주셨으면 좋겠습니다. (apology는 사과)","opts":["선물","사과","숙제","약속"],"word":"apology","r":{"a":"2) 사과","ev":"3번, 11번 문장","s":[[3,"I am writing to say I’m sorry.","죄송하다고 말씀드리기 위해 글을 쓰고 있습니다."],[11,"I hope you accept my apology.","선생님께서 사과를 받아주셨으면 좋겠습니다."]],"w":"3번에서 I’m sorry(죄송합니다)라고 쓴 글이에요. 그 마음을 받아주길 바란다는 말이니 apology는 사과예요.","c":2},"h":"502035b327"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBut I couldn’t hand it in.","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만 저는 그것을 제출할 수 없었습니다.","opts":["수학 숙제","병원","고열","월요일"],"r":{"a":"1) 수학 숙제","ev":"1~2번 문장","s":[[1,"Our math homework was due on Monday.","우리의 수학 숙제는 월요일까지였습니다."],[2,"But I couldn’t hand it in.","하지만 저는 그것을 제출할 수 없었습니다."]],"w":"hand in(제출하다)할 수 있는 것은 1번의 Our math homework(수학 숙제)예요.","c":1},"h":"6c441ba02d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This will never happen again.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다시는 이런 일이 일어나지 않을 것입니다.","opts":["이런 일은 자주 일어날 것이다.","이런 일은 다시는 일어나지 않을 것이다.","이런 일은 어제 처음 일어났다.","이런 일이 내일 다시 일어날 것이다."],"r":{"a":"2) 이런 일은 다시는 일어나지 않을 것이다.","ev":"10번 문장","s":[[10,"This will never happen again.","다시는 이런 일이 일어나지 않을 것입니다."]],"w":"never는 '결코 ~ 않다', again은 '다시'예요. 숙제를 늦게 낸 일이 다시는 없을 것이라는 약속이에요.","c":2},"h":"7ce282110d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Tom은 월요일에 숙제를 제출했다.","Tom은 지금도 매우 아프다.","Tom은 이런 일이 다시 일어날 것이라고 생각한다.","Tom은 목요일까지 숙제를 제출할 것이다."],"opts":["Tom handed in his homework on Monday.","Tom is still very sick now.","Tom thinks this will happen again.","Tom will hand in his homework by Thursday."],"r":{"a":"4) Tom will hand in his homework by Thursday.","ev":"2번, 8번, 9번, 10번 문장","s":[[2,"But I couldn’t hand it in.","하지만 저는 그것을 제출할 수 없었습니다."],[8,"I am okay now.","저는 이제 괜찮습니다."],[9,"I promise to hand in my homework by Thursday.","목요일까지 숙제를 제출하겠다고 약속하겠습니다."],[10,"This will never happen again.","다시는 이런 일이 일어나지 않을 것입니다."]],"w":"9번에서 목요일까지 숙제를 제출하겠다고 약속해요. 월요일에는 못 냈고(2번), 이제 괜찮고(8번), 다시는 이런 일이 없을 것이라고 해요(10번).","c":4},"h":"d4d555b1d0"},{"n":9,"t":"sum","q":"Tom could not (A) his homework on time because he was (B), but he promises to hand it in by Thursday.","ko":"Tom은 (B) 상태여서 숙제를 제때 (A)하지 못했지만, 목요일까지 제출하겠다고 약속한다.","oko":["(A) 잊다 / (B) 바쁜","(A) 베끼다 / (B) 게으른","(A) 제출하다 / (B) 아픈","(A) 잃어버리다 / (B) 피곤한","(A) 끝내다 / (B) 화난"],"opts":["(A) forget / (B) busy","(A) copy / (B) lazy","(A) hand in / (B) sick","(A) lose / (B) tired","(A) finish / (B) angry"],"r":{"a":"3) (A) hand in / (B) sick","ev":"2번, 5번, 9번 문장","s":[[2,"But I couldn’t hand it in.","하지만 저는 그것을 제출할 수 없었습니다."],[5,"I was very sick.","저는 매우 아팠습니다."],[9,"I promise to hand in my homework by Thursday.","목요일까지 숙제를 제출하겠다고 약속하겠습니다."]],"w":"2번에서 hand it in(제출)을 못 했고, 5번에서 very sick(매우 아팠다)이 이유예요. 9번에서 목요일까지 내겠다고 약속해요.","c":3},"h":"01a2e65b35"},{"n":10,"t":"fill","q":"Tom hopes you [A] his [B], and he thanks you for understanding.","ko":"Tom은 선생님께서 자신의 [B]를 [A]주시길 바라고, 이해해 주셔서 감사하다고 말한다.","bank":["accept","apology","promise","fever","homework","hospital"],"bko":{"accept":"받아들이다","apology":"사과","promise":"약속하다","fever":"열","homework":"숙제","hospital":"병원"},"r":{"a":"[A] accept, [B] apology","ev":"11~12번 문장","s":[[11,"I hope you accept my apology.","선생님께서 사과를 받아주셨으면 좋겠습니다."],[ "n":6,"t":"ref","q":"What does the underlined \"Others\" refer to?\nOthers are bright and cheerful, like daisies.","ko":"밑줄 친 Others가 가리키는 것은?","sko":"다른 꽃들은 데이지처럼 밝고 생기를 준다.","opts":["다른 사람들","다른 꽃들","다른 색깔들","다른 선물들"],"r":{"a":"2) 다른 꽃들","ev":"2~3번 문장","s":[[2,"Some flowers smell nice, like roses.","어떤 꽃들은 장미꽃처럼 좋은 냄새가 난다."],[3,"Others are bright and cheerful, like daisies.","다른 꽃들은 데이지처럼 밝고 생기를 준다."]],"w":"2번에서 Some flowers(어떤 꽃들)라고 했고, 3번의 Others는 '다른 꽃들'이에요. 밝고 생기를 주는 데이지 같은 꽃이에요.","c":2},"h":"57b5768b63"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Why don’t you give flowers to someone special today?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오늘 특별한 사람에게 꽃을 주는 건 어떤가?","opts":["너는 왜 오늘 꽃을 주지 않았니?","오늘 누가 꽃을 주었는지 묻고 있다.","특별한 사람은 오늘 꽃을 받고 싶어 하지 않는다.","오늘 특별한 사람에게 꽃을 주는 건 어때?"],"r":{"a":"4) 오늘 특별한 사람에게 꽃을 주는 건 어때?","ev":"10번 문장","s":[[10,"Why don’t you give flowers to someone special today?","오늘 특별한 사람에게 꽃을 주는 건 어떤가?"]],"w":"「Why don’t you+동사원형?」은 이유를 묻는 말이 아니라 '~하는 게 어때?'라고 권하는 표현이에요. someone special은 특별한 사람이에요.","c":4},"h":"58b560af77"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우리는 생일이나 휴일에 꽃을 줄 수 있다.","꽃은 한 가지 모양으로만 나타난다.","모든 꽃에서 장미 같은 냄새가 난다.","사람들은 사과하기 위해서만 꽃을 준다."],"opts":["We can give flowers on birthdays or holidays.","Flowers come in only one shape.","All flowers smell like roses.","People give flowers only to say sorry."],"r":{"a":"1) We can give flowers on birthdays or holidays.","ev":"1번, 2번, 5번, 7번, 8번 문장","s":[[1,"Flowers come in many colors and shapes.","꽃은 많은 색깔과 모양으로 나타난다."],[2,"Some flowers smell nice, like roses.","어떤 꽃들은 장미꽃처럼 좋은 냄새가 난다."],[5,"People give flowers to show love and kindness.","사람들은 사랑과 친절을 보여주기 위해 꽃을 준다."],[7,"We can give flowers on birthdays or holidays.","우리는 생일이나 휴일에 꽃을 줄 수 있다."],[8,"Sometimes, we give flowers to say thank you.","때때로 우리는 감사함을 표현하기 위해 꽃을 준다."]],"w":"7번에서 생일이나 휴일에 꽃을 줄 수 있다고 해요. 꽃은 많은 모양으로 나오고(1번), 장미 냄새가 나는 꽃은 일부(Some)일 뿐이고(2번), 사랑·친절·감사를 위해 준다고 해요(5, 8번).","c":1},"h":"5e1f1edeff"},{"n":9,"t":"sum","q":"Giving flowers is a (A) tradition, and people give flowers to show love and (B).","ko":"꽃을 주는 것은 (A) 전통이고, 사람들은 사랑과 (B)을 보여주기 위해 꽃을 준다.","oko":["(A) 새로운 / (B) 돈","(A) 지루한 / (B) 친절","(A) 특별한 / (B) 화","(A) 값싼 / (B) 두려움","(A) 특별한 / (B) 친절"],"opts":["(A) new / (B) money","(A) boring / (B) kindness","(A) special / (B) anger","(A) cheap / (B) fear","(A) special / (B) kindness"],"r":{"a":"5) (A) special / (B) kindness","ev":"4~5번 문장","s":[[4,"Giving flowers is a special tradition.","꽃을 주는 것은 특별한 전통이다."],[5,"People give flowers to show love and kindness.","사람들은 사랑과 친절을 보여주기 위해 꽃을 준다."]],"w":"4번에서 꽃을 주는 것은 special(특별한) 전통이고, 5번에서 love and kindness(사랑과 친절)를 보여주기 위해 준다고 해요.","c":5},"h":"5eed265867"},{"n":10,"t":"fill","q":"Flowers come in many [A] and shapes, and giving flowers is a wonderful way to spread [B].","ko":"꽃은 많은 [A]과 모양으로 나타나고, 꽃을 주는 것은 [B]을 퍼뜨리는 멋진 방법이다.","bank":["colors","joy","roses","daisies","tradition","birthdays"],"bko":{"colors":"색깔","joy":"기쁨","roses":"장미","daisies":"데이지","tradition":"전통","birthdays":"생일"},"r":{"a":"[A] colors, [B] joy","ev":"1번, 9번 문장","s":[[1,"Flowers come in many colors and shapes.","꽃은 많은 색깔과 모양으로 나타난다."],[9,"It’s a wonderful way to spread joy.","그것은 기쁨을 퍼뜨리는 멋진 방법이다."]],"w":"1번에서 many colors and shapes(많은 색깔과 모양)이고, 9번에서 a wonderful way to spread joy(기쁨을 퍼뜨리는 멋진 방법)라고 해요.","c":null},"h":"077f31cbb5"}]},{"u":7,"id":"rt1-07-1","no":1,"ko":"크리스마스 다음 날은 무슨 날?","items":[{"n":1,"t":"tf","q":"Everyone knows the exact origin of the name Boxing Day.","ko":"박싱 데이라는 이름의 정확한 기원은 모든 사람이 안다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"No one knows the exact origin.","아무도 정확한 기원을 알지 못한다."],[4,"Maybe it came from churches.","어쩌면 그것은 교회에서 왔을 수도 있다."]],"w":"3번 문장에서 No one knows the exact origin(아무도 정확한 기원을 알지 못한다)이라고 함. 4번도 Maybe(어쩌면)로 짐작만 말함.","c":"F"},"h":"92293fe221"},{"n":2,"t":"tf","q":"People in churches used boxes to collect things for the poor.","ko":"교회의 사람들은 가난한 사람들을 위해 물건을 ning of the sentence?\n\"Or maybe it came from gift boxes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"또는 아마도 그것은 선물 상자들에서 왔을 수도 있다.","opts":["어쩌면 박싱 데이라는 이름은 선물 상자에서 생겼을 수도 있다.","박싱 데이라는 이름은 선물 상자에서 생긴 것이 확실하다.","크리스마스 선물 상자는 박싱 데이 때문에 생겼다.","선물 상자는 교회에서 가난한 사람들에게 받았다."],"r":{"a":"1) 어쩌면 박싱 데이라는 이름은 선물 상자에서 생겼을 수도 있다.","ev":"7번 문장","s":[[7,"Or maybe it came from gift boxes.","또는 아마도 그것은 선물 상자들에서 왔을 수도 있다."]],"w":"it은 박싱 데이라는 이름이고, maybe는 '어쩌면'이라 확실하지 않은 짐작임. 확실하다는 선지는 틀림. 7번은 이름이 선물 상자에서 왔을 수도 있다는 뜻.","c":1},"h":"d0c32a9b2c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["박싱 데이는 크리스마스 하루 전날이다.","교회 사람들은 부자들을 위해 물건을 모았다.","오늘날 박싱 데이에는 사람들이 싼 가격에 많은 물건을 살 수 있다.","박싱 데이 날에는 TV에서 스포츠 경기를 하지 않는다."],"opts":["Boxing Day is the day before Christmas.","People in churches collected things for the rich.","On Boxing Day, people can buy many items at low prices.","There are no sports events on TV on Boxing Day."],"r":{"a":"3) On Boxing Day, people can buy many items at low prices.","ev":"13~14번 문장","s":[[13,"There are many sales, too.","할인 판매 또한 많이 한다."],[14,"People can buy many items at low prices.","사람들은 많은 물건을 저렴한 가격에 살 수 있다."]],"w":"14번에서 사람들이 많은 물건을 저렴한 가격에 살 수 있다고 함. ①은 1번 문장에서 크리스마스 다음 날이라고 해서 틀림. ②는 5번 문장에서 가난한 사람들(the poor)을 위해서라고 해서 틀림. ④는 11번 문장에서 TV에 스포츠 경기가 많이 나온다고 해서 틀림.","c":3},"h":"f356c023cd"},{"n":9,"t":"sum","q":"Boxing Day may have gotten its name from boxes that churches used to help the (A), or from gift boxes for people who (B) on Christmas Day.","ko":"박싱 데이라는 이름은 교회가 (A)을(를) 돕는 데 쓴 상자에서, 또는 크리스마스에 (B)한 사람들을 위한 선물 상자에서 생겼을 수도 있다.","oko":["(A) 부자들 / (B) 쉬었다","(A) 아픈 사람들 / (B) 쉬었다","(A) 부자들 / (B) 일했다","(A) 아픈 사람들 / (B) 일했다","(A) 가난한 사람들 / (B) 일했다"],"opts":["(A) rich / (B) rested","(A) sick / (B) rested","(A) rich / (B) worked","(A) sick / (B) worked","(A) poor / (B) worked"],"r":{"a":"5) (A) poor / (B) worked","ev":"5~6번, 8~9번 문장","s":[[5,"People in churches collected things for the poor.","교회의 사람들은 가난한 사람들을 위해 물건들을 모았다."],[6,"They used boxes.","그들은 상자들을 사용했다."],[8,"Some people had to work on Christmas Day.","몇몇 사람들은 크리스마스에 일을 해야 했다."],[9,"They received gift boxes after work.","그들은 일이 끝난 후에 선물 상자를 받았다."]],"w":"5번에서 교회의 사람들은 the poor(가난한 사람들)를 위해 물건을 모았고(상자 사용, 6번), 8~9번에서 크리스마스에 일한(work) 사람들이 선물 상자를 받았다. 그래서 poor와 worked.","c":5},"h":"98fc834333"},{"n":10,"t":"fill","q":"On Boxing Day today, people watch [A] events on TV, and they can buy many items at [B] prices.","ko":"오늘날 박싱 데이에는 사람들이 TV에서 [A] 경기를 보고, [B] 가격에 많은 물건을 살 수 있다.","bko":{"sports":"스포츠","low":"저렴한","high":"높은","gift":"선물","exact":"정확한","boxes":"상자들"},"bank":["sports","low","boxes","high","gift","exact"],"r":{"a":"[A] sports, [B] low","ev":"11번, 14번 문장","s":[[11,"There are many sports events on TV.","TV에 많은 스포츠 경기가 나온다."],[14,"People can buy many items at low prices.","사람들은 많은 물건을 저렴한 가격에 살 수 있다."]],"w":"11번 There are many sports events on TV, 14번 People can buy many items at low prices에서 가져옴. high는 low와 반대이고 boxes, gift, exact는 문맥에 맞지 않음.","c":null},"h":"f5489b3dd5"}]},{"u":7,"id":"rt1-07-2","no":2,"ko":"고기를 먹는 벌이 있다고?","items":[{"n":1,"t":"tf","q":"Most bees get food from meat.","ko":"대부분의 벌은 고기에서 먹이를 얻는다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Most bees get food from flowers.","대부분의 벌은 꽃으로부터 먹이를 얻는다."]],"w":"1번 문장에서 Most bees get food from flowers(대부분의 벌은 꽃에서 먹이를 얻는다)라고 함. 고기를 먹는 건 2번의 몇몇 벌.","c":"F"},"h":"3367dc0d6d"},{"n":2,"t":"tf","q":"Vulture bees find dead animals such as birds, monkeys, or snakes.","ko":"독수리 벌은 새, 원숭이, 뱀 같은 죽은 동물을 찾는다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"They find dead animals.","그들은 죽은 동물들을 찾는다."],[6,"These are usually birds, monkeys, or snakes.","이것들은 보통 새, 원숭이, 또는 뱀이다."]],"w":"5번에서 죽은 동물들을 찾고, 6번에서 these(죽은 동물들)가 보통 새, 원숭이, 또는 뱀이라고 함.","c":"T"},"h":"24c5088d93"},{"n":3,"t":"tf","q":"Vulture bees store the meat inside the dead animals.","ko":"독수리 벌은 고기를 죽은 동물의 몸 안에 저장한다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"The bees bring the meat to their hive.","그 벌들은 고기를 벌집으로 가져온다."],[12,"They store the meat there.","그들은 고기를 그곳에 저장한다."]],"w":"11번에서 고기를 벌집(hive)으로 가져오고, 12번에서 there(그곳=벌집)에 저장한다고 함. 죽은 동물의 몸 안이 아님.","c":"F"},"h":"de8d324c4f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The vulture bees chase away flies.)","ko":"독수리 벌은 파리들을 쫓아낸다.","opts":["불러 모으다","잡아먹다","쫓아내다","따라가다"],"word":"chase away","r":{"a":"3) 쫓아내다","ev":"7번 문장","s":[[7,"The vulture bees chase away flies.","독수리 벌은 파리들을 쫓아낸다."]],"w":"7번에서 파리를 chase away한 뒤 8번의 Then(그러고 나서) 동물의 몸으로 들어감. 파리가 방해되니 '쫓아내다'가 맞음. 잡아먹는다는 말은 본문에 없음.","c":3},"h":"a746444e39"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The bees bring the meat to their hive.)","ko":"그 벌들은 고기를 벌집으로 가져온다.","opts":["꽃밭","벌집","동굴","새 둥지"],"word":"hive","r":{"a":"2) 벌집","ev":"11~12번 문장","s":[[11,"The bees bring the meat to their hive.","그 벌들은 고기를 벌집으로 가져온다."],[12,"They store the meat there.","그들은 고기를 그곳에 저장한다."]],"w":"11번에서 벌들이 고기를 가져가는 곳이고, 12번에서 there(그곳)로 이어져 고기를 저장하는 곳. 벌들이 사는 곳인 벌집임.","c":2},"h":"23d405ac6e"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThen they enter the animal’s body.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그러고 나서 그들은 동물의 몸으로 들어간다.","opts":["파리들","죽은 동물들","새, 원숭이, 뱀","독수리 벌들"],"r":{"a":"4) 독수리 벌들","ev":"7~8번 문장","s":[[7,"The vulture bees chase away flies.","독수리 벌은 파리들을 쫓아낸다."],[8,"Then they enter the animal’s body.","그러고 나서 그들은 동물의 몸으로 들어간다."]],"w":"바로 앞 7번 문장의 The vulture bees를 가리킴. 파리를 쫓아낸 뒤 동물의 몸에 들어가는 것은 독수리 벌들.","c":4},"h":"8a5dbe2487"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Later, baby vulture bees eat it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"나중에, 새끼 독수리 벌들이 그것을 먹는다.","opts":["나중에 새끼 독수리 벌들이 저장해 둔 고기를 먹는다.","나중에 독수리 벌들이 새끼 벌들을 먹는다.","새끼 독수리 벌들이 먼저 고기를 찾아 나선다.","나중에 새끼 벌들이 꽃에서 먹이를 얻는다."],"r":{"a":"1) 나중에 새끼 독수리 벌들이 저장해 둔 고기를 먹는다.","ev":"12~13번 문장","s":[[12,"They store the meat there.","그들은 고기를 그곳에 저장한다."],[13,"Later, baby vulture bees eat it.","나중에, 새끼 독수리 벌들이 그것을 먹는다."]],"w":"13번의 it은 12번에서 저장한 the meat. 먹는 쪽은 새끼 독수리 벌들이고 먹는 것은 고기. 새끼를 먹거나 꽃에서 먹이를 얻는다는 말은 없음.","c":1},"h":"769cafdf1a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["독수리 벌은 추운 곳에 산다.","독수리 벌은 동물의 몸에 먼저 들어간 뒤 파리를 쫓아낸다.","독수리 벌은 고기를 다리로 옮긴다.","독수리 벌은 고기를 벌집에 가져가지 않고 동물의 몸 안에서만 먹는다."],"opts":["Vulture bees live in cold places.","Vulture bees enter the animal’s body first and then chase away flies.","Vulture bees carry the meat with their legs.","Vulture bees eat the meat inside the animal’s body and never bring it to the hive."],"r":{"a":"3) Vulture bees carry the meat with their legs.","ev":"10번 문장","s":[[10,"They carry it with their legs.","그들은 그것을 다리로 옮긴다."]],"w":"10번에서 They carry it with their legs(그들은 그것을 다리로 옮긴다)라고 함. ①은 4번 hot places와 반대, ②는 7번 파리를 쫓아낸 뒤 8번에서 들어가는 순서와 반대, ④는 11번에서 벌집으로 가져온다는 내용과 반대.","c":3},"h":"a9183ecb33"},{"n":9,"t":"sum","q":"Most bees get food from flowers, but vulture bees (A) meat from dead animals and (B) it to their hive.","ko":"대부분의 벌은 꽃에서 먹이를 얻지만, 독수리 벌은 죽은 동물에게서 고기를 (A)하고 그것을 벌집으로 (B)한다.","oko":["(A) 쫓아낸다 / (B) 버린다","(A) 구입한다 / (B) 가져온다","(A) 쫓아낸다 / (B) 가져온다","(A) 모은다 / (B) 버린다","(A) 모은다 / (B) 가져온다"],"opts":["(A) chase / (B) throw away","(A) buy / (B) bring","(A) chase / (B) bring","(A) collect / (B) throw away","(A) collect / (B) bring"],"r":{"a":"5) (A) collect / (B) bring","ev":"1~2번, 9번, 11번 문장","s":[[1,"Most bees get food from flowers.","대부분의 벌은 꽃으로부터 먹이를 얻는다."],[2,"But some eat meat.","하지만 몇몇은 고기를 먹는다."],[9,"They collect meat.","그들은 고기를 모은다."],[11,"The bees bring the meat to their hive.","그 벌들은 고기를 벌집으로 가져온다."]],"w":"9번 They collect meat(고기를 모은다), 11번 The bees bring the meat to their hive(벌집으로 가져온다)에서 가져옴. 쫓아내는 것(chase away)은 파리이고, 고기를 버린다는 말은 없음.","c":5},"h":"5a33913313"},{"n":10,"t":"fill","q":"Vulture bees live in [A] places and find dead [B] to get meat.","ko":"독수리 벌은 [A] 곳에 살며 고기를 얻으려고 죽은 [B]을(를) 찾는다.","bko":{"hot":"더운","animals":"동물들","cold":"추운","flowers":"꽃들","hive":"벌집","legs":"다리들"},"bank":["hot","animals","cold","flowers","hive","legs"],"r":{"a":"[A] hot, [B] animals","ev":"4번, 5번 문장","s":[[4,"Vulture bees live in hot places.","독수리 벌은 더운 곳에 산다."],[5,"They find dead animals.","그들은 죽은 동물들을 찾는다."]],"w":"4번 Vulture bees live in hot places, 5번 They find dead animals에서 가져옴. cold는 hot과 반대이고, flowers는 일반 벌의 먹이(1번)이며, hive와 legs는 문맥에 맞지 않음.","c":null},"h":"a8ba30b7e4"}]},{"u":7,"id":"rt1-07-3","no":3,"ko":"안내를 읽어주세요","items":[{"n":1,"t":"tf","q":"Visitors must return the books within two weeks.","ko":"방문자들은 2주 이내에 책을 반납해야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"You must return the books within two weeks.","당신은 2주 이내에 책을 반납해야 합니다."]],"w":"3번 문장에서 You must return the books within two weeks(2주 이내에 책을 반납해야 한다)라고 함. must는 의무.","c":"T"},"h":"068ccaea78"},{"n":2,"t":"tf","q":"Pets are always welcome in the library.","ko":"반려동물은 도서관에서 언제나 환영받는다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Pets are not allowed, except for service dogs.","보조견을 제외한 반려동물은 허용되지 않습니다."]],"w":"6번 문장에서 Pets are not allowed(반려동물은 허용되지 않는다)라고 함. 보조견만 예외임.","c":"F"},"h":"66f4bb33b4"},{"n":3,"t":"tf","q":"Visitors should not disturb others.","ko":"방문자들은 다른 사람들을 방해하지 않아야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Please do not disturb others.","다른 분들을 방해하지 말아 주세요."]],"w":"8번 문장에서 Please do not disturb others(다른 분들을 방해하지 말아 주세요)라고 함.","c":"T"},"h":"c7eb080acb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You can borrow three books at a time.)","ko":"당신은 한 번에 세 권의 책을 빌릴 수 있습니다.","opts":["사다","빌리다","팔다","만들다"],"word":"borrow","r":{"a":"2) 빌리다","ev":"2번 문장","s":[[2,"You can borrow three books at a time.","당신은 한 번에 세 권의 책을 빌릴 수 있습니다."]],"w":"2번은 한 번에 세 권의 책을 빌릴 수 있다는 뜻이고, 3번에서 그 책을 반납해야 한다고 이어짐. 반납해야 하니 사는 것이 아니라 빌리는 것임.","c":2},"h":"41dc8665c3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Please speak quietly.)","ko":"조용히 말씀해 주세요.","opts":["크게","빨리","천천히","조용하게"],"word":"quietly","r":{"a":"4) 조용하게","ev":"7~8번 문장","s":[[7,"Please speak quietly.","조용히 말씀해 주세요."],[8,"Please do not disturb others.","다른 분들을 방해하지 말아 주세요."]],"w":"7번 Please speak quietly 뒤 8번에서 다른 사람을 방해하지 말라고 이어짐. 도서관에서 방해하지 않으려면 조용하게 말해야 함.","c":4},"h":"775f249610"},{"n":6,"t":"ref","q":"What does the underlined \"others\" refer to?\nPlease do not disturb others.","ko":"밑줄 친 others가 가리키는 것은?","sko":"다른 분들을 방해하지 말아 주세요.","opts":["다른 도서관들","보조견들","도서관의 다른 이용자들","다른 책들"],"r":{"a":"3) 도서관의 다른 이용자들","ev":"7~8번 문장","s":[[7,"Please speak quietly.","조용히 말씀해 주세요."],[8,"Please do not disturb others.","다른 분들을 방해하지 말아 주세요."]],"w":"7번에서 조용히 말하라고 한 뒤 8번에서 다른 사람을 방해하지 말라고 함. 조용히 해야 방해받는 사람은 같은 도서관에 함께 있는 다른 이용자들임. 보조견이나 책, 다른 도서관은 '방해받는 사람'이 될 수 없음.","c":3},"h":"05e59251f8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"All phones must be in mute mode.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"모든 전화기는 무음 설정되어야 합니다.","opts":["모든 전화기는 소리가 나지 않게 해 두어야 한다.","전화기는 도서관 안에서 쓸 수 없다.","전화기로는 큰 소리로 통화해도 된다.","전화기는 직원에게 맡겨야 한다."],"r":{"a":"1) 모든 전화기는 소리가 나지 않게 해 두어야 한다.","ev":"9번 문장","s":[[9,"All phones must be in mute mode.","모든 전화기는 무음 설정되어야 합니다."]],"w":"must는 '~해야 한다'는 의무이고 mute mode는 무음 설정. 전화기를 무음으로 해 두라는 뜻임. 사용 금지나 맡기라는 말은 없고, 큰 소리 통화는 반대임.","c":1},"h":"49f3ec32ea"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["한 번에 다섯 권을 빌릴 수 있다.","뚜껑이 있는 음료는 괜찮다.","도서관은 일주일 내내 매일 문을 연다.","전화기로 큰 소리로 통화해도 된다."],"opts":["You can borrow five books at a time.","Drinks with a lid are okay.","The library is open every day of the week.","You can talk loudly on the phone."],"r":{"a":"2) Drinks with a lid are okay.","ev":"5번 문장","s":[[5,"Drinks with a lid are okay.","뚜껑이 있는 음료는 괜찮습니다."]],"w":"5번에서 Drinks with a lid are okay(뚜껑이 있는 음료는 괜찮다)라고 함. ①은 2번에서 세 권이라 틀림. ③은 1번에서 매주 월요일 휴무라 틀림. ④는 9번에서 전화기를 무음으로 하라고 해서 틀림.","c":2},"h":"7e2c614c3d"},{"n":9,"t":"sum","q":"Visitors can borrow (A) books at a time, and they should speak (B) in the library.","ko":"방문자들은 한 번에 (A)권의 책을 빌릴 수 있고, 도서관에서는 (B) 말해야 한다.","oko":["(A) 세 "c":"T"},"h":"5c0830dde6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is the symbol of the country.)","ko":"그것은 그 나라의 상징이다. (symbol은 상징)","opts":["지도","상징","규칙","선물"],"word":"symbol","r":{"a":"2) 상징","ev":"1~2번 문장","s":[[1,"The Eiffel Tower is in Paris, France.","에펠탑은 프랑스 파리에 있다."],[2,"It is the symbol of the country.","그것은 그 나라의 상징이다."]],"w":"1번에서 에펠탑이 프랑스 파리에 있다고 하고, 2번에서 그것이 그 나라의 symbol이라고 해요. 한 나라를 대표하는 것이니 '상징'이에요.","c":2},"h":"721265e624"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The heat makes the iron expand!)","ko":"열이 철을 팽창하게 한다!","opts":["줄어들다","멈추다","녹다","팽창하다"],"word":"expand","r":{"a":"4) 팽창하다","ev":"10~12번 문장","s":[[10,"However, it gets bigger in the summer.","하지만 그것은 여름에 더 커진다."],[11,"Do you know why?","왜 그런지 아는가?"],[12,"The heat makes the iron expand!","열이 철을 팽창하게 한다!"]],"w":"10번에서 탑이 여름에 더 커진다고 하고, 12번에서 그 이유로 열이 철을 expand하게 한다고 해요. 더 커지는 것이니 '팽창하다(늘어나다)'예요.","c":4},"h":"686d73a81a"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHowever, it gets bigger in the summer.","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만 그것은 여름에 더 커진다.","opts":["여름","철","에펠탑","프랑스"],"r":{"a":"3) 에펠탑","ev":"9~10번 문장","s":[[9,"The Eiffel Tower is 324 meters tall.","에펠탑의 높이는 324미터이다."],[10,"However, it gets bigger in the summer.","하지만 그것은 여름에 더 커진다."]],"w":"9번 문장에서 에펠탑(The Eiffel Tower)의 높이를 말하고, 10번에서 그 에펠탑을 it으로 받아요. 여름에 더 커지는 것은 탑이에요.","c":3},"h":"55bd8615e8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It took two years to finish it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것을 완성하는 데 2년이 걸렸다.","opts":["탑을 완성하는 데 2년이 걸렸다.","탑을 완성하는 데 20년이 걸렸다.","탑은 2년 전에 완성되었다.","탑을 2년 동안 쉬었다가 다시 지었다."],"r":{"a":"1) 탑을 완성하는 데 2년이 걸렸다.","ev":"4번 문장","s":[[4,"It took two years to finish it.","그것을 완성하는 데 2년이 걸렸다."]],"w":"'it takes + 시간 + to-v'는 '~하는 데 (시간이) 걸리다'예요. took two years to finish는 완성하는 데 2년이 걸렸다는 뜻이에요.","c":1},"h":"2735e9e6e8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["에펠탑은 이탈리아 로마에 있다.","에펠탑은 여름에 더 작아진다.","에펠탑 안에는 1,665개의 층이 있다.","에펠탑의 높이는 324미터이다."],"opts":["The Eiffel Tower is in Rome, Italy.","The Eiffel Tower gets smaller in the summer.","There are 1,665 floors in the Eiffel Tower.","The Eiffel Tower is 324 meters tall."],"r":{"a":"4) The Eiffel Tower is 324 meters tall.","ev":"9번 문장","s":[[9,"The Eiffel Tower is 324 meters tall.","에펠탑의 높이는 324미터이다."]],"w":"9번 문장에 The Eiffel Tower is 324 meters tall.이 그대로 있어요. 탑은 로마가 아니라 파리에 있고(1번), 여름에 더 커지고(10번), 1,665개는 계단이에요(7번).","c":4},"h":"8a77b7f3ac"},{"n":9,"t":"sum","q":"The Eiffel Tower is made of (A), and it gets (B) in the summer.","ko":"에펠탑은 (A)로 만들어졌고, 여름에는 (B).","oko":["(A) 돌 / (B) 더 커진다","(A) 철 / (B) 더 작아진다","(A) 나무 / (B) 더 작아진다","(A) 돌 / (B) 더 높아진다","(A) 철 / (B) 더 커진다"],"opts":["(A) stone / (B) bigger","(A) iron / (B) smaller","(A) wood / (B) smaller","(A) stone / (B) taller","(A) iron / (B) bigger"],"r":{"a":"5) (A) iron / (B) bigger","ev":"5번, 10번 문장","s":[[5,"The tower is made of iron.","그 탑은 철로 만들어졌다."],[10,"However, it gets bigger in the summer.","하지만 그것은 여름에 더 커진다."]],"w":"5번에서 탑은 철(iron)로 만들어졌고, 10번에서 여름에 더 커진다(gets bigger)고 해요.","c":5},"h":"3953940f0f"},{"n":10,"t":"fill","q":"Gustave Eiffel started to [A] the tower in 1887, and it took [B] years to finish it.","ko":"Gustave Eiffel은 1887년에 그 탑을 [A]하기 시작했고, 완성하는 데 [B]년이 걸렸다.","bank":["build","two","three","iron","floors","summer"],"bko":{"build":"짓다","two":"2, 둘","three":"3, 셋","iron":"철","floors":"층들","summer":"여름"},"r":{"a":"[A] build, [B] two","ev":"3~4번 문장","s":[[3,"Gustave Eiffel started to build the tower in 1887.","Gustave Eiffel은 1887년에 그 탑을 짓기 시작했다."],[4,"It took two years to finish it.","그것을 완성하는 데 2년이 걸렸다."]],"w":"3번 started to build the tower(탑을 짓기 시작했다), 4번 took two years(2년이 걸렸다)에서 가져왔어요. three는 6번의 층 수예요.","c":null},"h":"b9638c8553"}]},{"u":8,"id":"rt1-08-2","no":2,"ko":"아무거나 먹지 말아요!","items":[{"n":1,"t":"tf","q":"Healthy foods help us grow.","ko":"건강에 좋은 음식은 우리가 성장하도록 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They help us grow.","그것들은 우리가 성장하도록 돕는다."]],"w":"4번 문장 They help us grow.에서 They는 건강에 좋은 음식이에요. 성장하도록 돕는다는 내용과 맞아요.","c":"T"},"h":"b68daa7f8b"},{"n":2,"t":"tf","q":"Most people drink water very often.","ko":"대부분의 사람들은 물을 아주 자주 마신다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"But many people don’t drink water often.","하지만 많은 사람들이 물을 자주 마시지 않는다."]],"w":"6번 문장에서 많은 사람들이 물을 자주 마시지 않는다(don't drink water often)고 해요. 반대 내용이에요.","c":"F"},"h":"19bb14fec4"},{"n":3,"t":"tf","q":"Some people drink sweet sodas instead of water.","ko":"어떤 사람들은 물 대신 달콤한 탄산음료를 마신다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Some drink sweet sodas instead.","어떤 사람들은 달콤한 탄산음료를 대신 마신다."]],"w":"7번 문장에 Some drink sweet sodas instead.가 있어요. instead는 '물 대신'이라는 뜻이라 맞아요.","c":"T"},"h":"840ee457d0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Drinking enough water is necessary, too.)","ko":"충분한 물을 마시는 것도 필요하다.","opts":["위험한","필요한","불가능한","유명한"],"word":"necessary","r":{"a":"2) 필요한","ev":"5번 문장","s":[[5,"Drinking enough water is necessary, too.","충분한 물을 마시는 것도 필요하다."]],"w":"5번은 물을 충분히 마시는 것이 건강에 필요하다는 말이에요. 음식 이야기에 'too(도)'로 덧붙였으니 '필요한'이에요.","c":2},"h":"6214df17aa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Some drink sweet sodas instead.)","ko":"어떤 사람들은 달콤한 탄산음료를 대신 마신다.","opts":["자주","갑자기","대신에","함께"],"word":"instead","r":{"a":"3) 대신에","ev":"6~7번 문장","s":[[6,"But many people don’t drink water often.","하지만 많은 사람들이 물을 자주 마시지 않는다."],[7,"Some drink sweet sodas instead.","어떤 사람들은 달콤한 탄산음료를 대신 마신다."]],"w":"6번에서 많은 사람이 물을 자주 마시지 않는다고 하고, 7번에서 어떤 사람들은 탄산음료를 instead 마신다고 해요. 물 '대신에'라는 뜻이에요.","c":3},"h":"1ca381d282"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey make our body strong.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 우리의 몸을 튼튼하게 만든다.","opts":["우리의 몸","좋은 식습관","에너지","과일과 채소 같은 건강에 좋은 음식"],"r":{"a":"4) 과일과 채소 같은 건강에 좋은 음식","ev":"2~3번 문장","s":[[2,"Healthy foods like fruit and vegetables give us energy.","과일과 채소와 같은 건강에 좋은 음식은 우리에게 에너지를 준다."],[3,"They make our body strong.","그것들은 우리의 몸을 튼튼하게 만든다."]],"w":"2번에서 건강에 좋은 음식(Healthy foods)이 우리에게 에너지를 준다고 하고, 3번 They가 그 음식을 다시 가리켜요. 몸을 튼튼하게 만드는 것은 음식이에요.","c":4},"h":"64999b59fc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This helps us stay strong and healthy!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 우리가 튼튼하고 건강하게 지내는 것을 돕는다!","opts":["이것은 우리가 튼튼하고 건강하게 지내도록 돕는다.","이것은 우리를 약하고 아프게 만든다.","이것은 우리가 건강한 음식을 먹지 못하게 막는다.","이것은 튼튼한 몸이 있어야 할 수 있다."],"r":{"a":"1) 이것은 우리가 튼튼하고 건강하게 지내도록 돕는다.","ev":"9번 문장","s":[[9,"This helps us stay strong and healthy!","이것은 우리가 튼튼하고 건강하게 지내는 것을 돕는다!"]],"w":"'help + 목적어 + 동사원형'은 '~가 …하는 것을 돕다'예요. helps us stay strong and healthy는 우리가 튼튼하고 건강하게 지내도록 돕는다는 뜻이에요.","c":1},"h":"285303cf71"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["좋은 식습관은 건강에 중요하지 않다.","물을 마시면 우리 몸이 약해진다.","우리는 매일 건강에 좋은 음식을 먹어야 한다.","과일과 채소는 우리에게 에너지를 주지 않는다."],"opts":["Good eating habits are not important for health.","Drinking water makes our body weak.","We should eat healthy food every day.","Fruit and vegetables give us no energy."],"r":{"a":"3) We should eat healthy food every day.","ev":"8번 문장","s":[[8,"We should eat healthy food every day.","우리는 매일 건강에 좋은 음식을 먹어야 한다."]],"w":"8번 문장에 We should eat healthy food every day.가 그대로 있어요. 식습관은 중요하고(1번), 물은 필요하고(5번), 과일과 채소는 에너지를 줘요(2번).","c":3},"h":"9906529b55"},{"n":9,"t":"sum","q":"Healthy foods give us (A), and we should drink enough (B) as well.","ko":"건강에 좋은 음식은 우리에게 (A)를 주고, 우리는 충분한 (B)도 마셔야 한다.","oko":["(A) 에너지 / (B) 물","(A) 에너지 / (B) 탄산음료","(A) 잠 / (B) 물","(A) 통증 / (B) 탄산음료","(A) 잠 / (B) 탄산음료"],"opts":["(A) energy / (B) water","(A) energy / (B) sodas","(A) sleep / (B) water","(A) pain / (B) sodas","(A) sleep / (B) sodas"],"r":{"a":"1) (A) energy / (B) water","ev":"2번, 5번 문장","s":[[2,"Healthy foods like fruit and vegetables give us energy.","과일과 채소와 같은 건강에 좋은 음식은 우리에게 에너지를 준다."],[5,"Drinking enough water is necessary, too.","충분한 물을 마시는 것도 필요하다."]],"w":"2번에서 건강에 좋은 음식은 에너지를 주고, 5번에서 충분한 물을 마시는 것도 필요하다고 해요. 탄산음료는 물 대신 마시는 것으로만 나와요(7번).","c":1},"h":"4c454f4008"},{"n":10,"t":"fill","q":"Healthy foods make our body [A] and help us [B].","ko":"건강에 좋은 음식은 우리의 몸을 [A]하게 만들고 우리가 [B]하도록 돕는다.","bank":["strong","grow","sweet","water","energy","necessary"],"bko":{"strong":"튼튼한","grow":"성장하다","sweet":"달콤한","water":"물","energy":"에너지","necessary":"필요한"},"r":{"a":"[A] strong, [B] grow","ev":"3~4번 문장","s":[[3,"They make our body strong.","그것들은 우리의 몸을 튼튼하게 만든다."],[4,"They help us grow.","그것들은 우리가 성장하도록 돕는다."]],"w":"3번 make our body strong, 4번 help us grow에서 가져왔어요. sweet은 탄산음료(7번), necessary는 물(5번)을 설명하는 말이고, water와 energy는 이 문장의 빈칸에 들어가면 뜻이 이어지지 않아요.","c":null},"h":"dcac981780"}]},{"u":8,"id":"rt1-08-3","no":3,"ko":"우리가 사는 이 대륙","items":[{"n":1,"t":"tf","q":"Russia is the largest country in Asia.","ko":"러시아는 아시아에서 가장 큰 나라이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Russia is the largest country in Asia.","러시아는 아시아에서 가장 큰 나라이다."]],"w":"4번 문장에 Russia is the largest country in Asia.가 그대로 있어요.","c":"T"},"h":"c8ee9c5e87"},{"n":2,"t":"tf","q":"There are 84 countries in Asia.","ko":"아시아에는 84개국이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"There are 48 countries in Asia.","아시아에는 48개국이 있다."]],"w":"3번 문장에서 아시아에는 48개국(48 countries)이 있다고 해요. 84개가 아니에요.","c":"F"},"h":"8129863b39"},{"n":3,"t":"tf","q":"Mount Everest is the highest mountain in the world.","ko":"에베레스트산은 세계에서 가장 높은 산이다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"It’s also the highest mountain in the world.","그것은 또한 세계에서 가장 높은 산이다."]],"w":"7번 문장 It's also the highest mountain in the world.에서 It's는 에베레스트산이에요. 세계에서 가장 높은 산이라는 내용과 맞아요.","c":"T"},"h":"10a5062220"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Asia is the largest continent in the world.)","ko":"아시아는 세계에서 가장 큰 대륙이다.","opts":["가장 작은","가장 큰","가장 긴","가장 높은"],"word":"largest","r":{"a":"2) 가장 큰","ev":"1번 문장","s":[[1,"Asia is the largest continent in the world.","아시아는 세계에서 가장 큰 대륙이다."]],"w":"largest는 large(큰)의 최상급으로 '가장 큰'이에요. 아시아가 세계에서 가장 큰 대륙이라는 말이에요.","c":2},"h":"30ebdb4fcf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The highest mountain in Asia is Mount Everest.)","ko":"아시아에서 가장 높은 산은 에베레스트산이다.","opts":["가장 낮은","가장 먼","가장 높은","가장 깊은"],"word":"highest","r":{"a":"3) 가장 높은","ev":"6~7번 문장","s":[[6,"The highest mountain in Asia is Mount Everest.","아시아에서 가장 높은 산은 에베레스트산이다."],[7,"It’s also the highest mountain in the world.","그것은 또한 세계에서 가장 높은 산이다."]],"w":"highest는 high(높은)의 최상급이에요. 에베레스트산은 산이라서 '가장 높은'이 맞아요.","c":3},"h":"4aaba1f45e"},{"n":6,"t":"ref","q":"What does the underlined \"there\" refer to?\nAbout 60% of people in the world live there.","ko":"밑줄 친 there가 가리키는 것은?","sko":"세계의 약 60%의 사람들이 그곳에 산다.","opts":["세계","에베레스트산","러시아","아시아"],"r":{"a":"4) 아시아","ev":"1~2번 문장","s":[[1,"Asia is the largest continent in the world.","아시아는 세계에서 가장 큰 대륙이다."],[2,"About 60% of people in the world live there.","세계의 약 60%의 사람들이 그곳에 산다."]],"w":"1번에서 아시아를 세계에서 가장 큰 대륙이라고 하고, 2번 there가 그곳(아시아)을 가리켜요. 세계(the world)는 사람의 범위를 말하는 말이에요.","c":4},"h":"b4505ce818"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is the third longest river in the world.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 세계에서 세 번째로 긴 강이다.","opts":["그것은 세계에서 세 번째로 긴 강이다.","그것은 세계에서 가장 긴 강이다.","그것은 세 개의 강 중에서 가장 짧은 강이다.","그것은 세계에서 세 번째로 큰 나라이다."],"r":{"a":"1) 그것은 세계에서 세 번째로 긴 강이다.","ev":"10번 문장","s":[[10,"It is the third longest river in the world.","그것은 세계에서 세 번째로 긴 강이다."]],"w":"'the + 서수 + 최상급'은 '~번째로 (가장) …한'이에요. the third longest river는 세 번째로 긴 강이고, 가장 긴 강은 아시아 안에서의 이야기예요(8번).","c":1},"h":"bc33051370"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아시아는 세계에서 가장 작은 대륙이다.","몰디브는 아시아에서 가장 작은 나라이다.","러시아는 아시아에서 가장 작은 나라이다.","양쯔강은 아시아에서 가장 짧은 강이다."],"opts":["Asia is the smallest continent in the world.","The Maldives is the smallest country in Asia.","Russia is the smallest country in Asia.","The Yangtze is the shortest river in Asia."],"r":{"a":"2) The Maldives is the smallest country in Asia.","ev":"4~5번 문장","s":[[4,"Russia is the largest country in Asia.","러시아는 아시아에서 가장 큰 나라이다."],[5,"The Maldives is the smallest country in Asia.","몰디브는 아시아에서 가장 작은 나라이다."]],"w":"5번 문장에 The Maldives is the smallest country in Asia.가 그대로 있어요. 러시아는 가장 큰 나라이고(4번), 아시아는 가장 큰 대륙이고(1번), 양쯔강은 가장 긴 강이에요(8번).","c":2},"h":"ac982a3c3b"},{"n":9,"t":"sum","q":"Asia is the (A) continent in the world, and the Yangtze is the (B) river in Asia.","ko":"아시아는 세계에서 (A) 대륙이고, 양쯔강은 아시아에서 (B) 강이다.","oko":["(A) 가장 작은 / (B) 가장 긴","(A) 가장 큰 / (B) 가장 짧은","(A) 가장 작은 / (B) 가장 짧은","(A) 가장 큰 / (B) 가장 높은","(A) 가장 큰 / (B) 가장 긴"],"opts":["(A) smallest / (B) longest","(A) largest / (B) shortest","(A) smallest / (B) shortest","(A) largest / (B) highest","(A) largest / (B) longest"],"r":{"a":"5) (A) largest / (B) longest","ev":"1번, 8번 문장","s":[[1,"Asia is the largest continent in the world.","아시아는 세계에서 가장 큰 대륙이다."],[8,"The Yangtze is the longest river in Asia.","양쯔강은 아시아에서 가장 긴 강이다."]],"w":"1번에서 아시아는 가장 큰(largest) 대륙이고, 8번에서 양쯔강은 가장 긴(longest) 강이에요. highest는 산(6번)에 쓴 말이에요.","c":5},"h":"0a2ae30ec5"},{"n":10,"t":"fill","q":"Mount Everest is the [A] mountain in Asia and in the [B].","ko":"에베레스트산은 아시아와 [B]에서 [A] 산이다.","bank":["highest","world","longest","smallest","Asia","river"],"bko":{"highest":"가장 높은","world":"세계","longest":"가장 긴","smallest":"가장 작은","Asia":"아시아","river":"강"},"r":{"a":"[A] highest, [B] world","ev":"6~7번 문장","s":[[6,"The highest mountain in Asia is Mount Everest.","아시아에서 가장 높은 산은 에베레스트산이다."],[7,"It’s also the highest mountain in the world.","그것은 또한 세계에서 가장 높은 산이다."]],"w":"6번 the highest mountain in Asia, 7번 the highest mountain in the world에서 가져왔어요. longest는 강(8번), smallest는 나라(5번)에 쓴 말이에요.","c":null},"h":"586e8b777c"}]}];
