var D=[{"n":1,"tag":"수빈이의 여행 이야기","en":"I can't wait to tell you about my trip to London. The flight taked 15 hours from Incheon.","ko":"런던으로 다녀온 나의 여행에 대해 너에게 어서 말해 주고 싶다. 비행은 인천에서부터 15시간이 걸렸다.","ok":false,"foot":[],"fixes":[{"wrong":"taked","right":"took","partial":false,"at":[13],"point":"불규칙 과거형: take의 과거형은 took (taked 아님)","topic":"불규칙 과거형","memo":"take의 과거형은 took (taked 아님)"}]},{"n":2,"tag":null,"en":"When I met my friend Amelia at the airport, I was so excitedly. I have known her for I was 10 years old.","ko":"내가 내 친구 Amelia를 공항에서 만났을 때, 나는 매우 신이 났다. 내가 10살이었을 때부터 나는 그녀와 알고 지냈다.","ok":false,"foot":[],"fixes":[{"wrong":"excitedly","right":"excited","partial":false,"at":[12],"point":"형용사와 부사: be동사 뒤 보어 자리에는 형용사 excited 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어 자리에는 형용사 excited 사용"},{"wrong":"for","right":"since","partial":false,"at":[17],"point":"접속사 since: '~한 이후로'는 접속사 since 사용","topic":"접속사 since","memo":"'~한 이후로'는 접속사 since 사용"}]},{"n":3,"tag":null,"en":"She took me to many places in London. Come with I on my amazing trip!","ko":"그녀는 나를 런던의 많은 곳에 데려가 주었다. 나의 굉장한 여행에 나와 함께 가 봐!","ok":false,"foot":[],"fixes":[{"wrong":"I","right":"me","partial":false,"at":[10],"point":"인칭대명사의 목적격: 전치사 with 뒤에는 목적격 me 사용","topic":"인칭대명사의 목적격","memo":"전치사 with 뒤에는 목적격 me 사용"}]},{"n":4,"tag":"아름다운 궁전","en":"We got on the famous red bus and the first stop were Buckingham Palace. The King and his family lives there.","ko":"우리는 유명한 빨간색 버스에 올라탔고 첫 번째 정류장은 버킹엄 궁전이었다. 왕과 그의 가족이 그곳에 산다.","ok":false,"foot":[],"fixes":[{"wrong":"were","right":"was","partial":false,"at":[11],"point":"be동사의 수일치: 주어 stop(단수)에는 was 사용","topic":"be동사의 수일치","memo":"주어 stop(단수)에는 was 사용"},{"wrong":"lives","right":"live","partial":false,"at":[19],"point":"주어와 동사의 수일치: The King and his family(복수)에는 live 사용","topic":"주어와 동사의 수일치","memo":"The King and his family(복수)에는 live 사용"}]},{"n":5,"tag":null,"en":"We saw the King's Guard. The guards were wearing red jackets and tall black hats.","ko":"우리는 국왕 근위대를 보았다. 근위병들은 빨간색 재킷과 높은 검은색 모자를 쓰고 있었다.","ok":true,"foot":[],"fixes":[]},{"n":6,"tag":null,"en":"We took pictures near they, but they didn't smile or move. They were like statues!","ko":"우리는 그들 근처에서 사진을 찍었지만, 그들은 웃거나 움직이지 않았다. 그들은 조각상들 같았다!","ok":false,"foot":[],"fixes":[{"wrong":"they","right":"them","partial":false,"at":[4],"point":"인칭대명사의 목적격: 전치사 near 뒤에는 목적격 them 사용","topic":"인칭대명사의 목적격","memo":"전치사 near 뒤에는 목적격 them 사용"}]},{"n":7,"tag":"맛있는 식사","en":"Next, we went to Camden Market. These market is known for its food from around the world.","ko":"다음으로, 우리는 캠던 마켓에 갔다. 이 시장은 세계 곳곳의 음식으로 알려져 있다.","ok":false,"foot":[],"fixes":[{"wrong":"These","right":"This","partial":false,"at":[6],"point":"지시형용사: 단수명사 market 앞에는 This 사용","topic":"지시형용사","memo":"단수명사 market 앞에는 This 사용"}]},{"n":8,"tag":null,"en":"Amelia told me try the fish and chips. I thought, \"What strange!","ko":"Amelia는 나에게 피시앤칩스를 먹어 보라고 말했다. 나는 생각했다, \"이상하네!","ok":false,"foot":[],"fixes":[{"wrong":"try","right":"to try","partial":false,"at":[3],"point":"to부정사: tell + 목적어 + to V: to try (try 아님)","topic":"to부정사","memo":"tell + 목적어 + to V: to try (try 아님)","alt":[2]},{"wrong":"What","right":"How","partial":false,"at":[10],"point":"감탄문: 형용사 strange 앞에는 How 사용","topic":"감탄문","memo":"형용사 strange 앞에는 How 사용"}]},{"n":9,"tag":null,"en":"I have ate fish many times. But I've never tried it with potato chips.\"","ko":"나는 생선을 여러 번 먹어 봤어. 하지만 나는 감자칩과 함께 먹어 본 적은 없어.\"","ok":false,"foot":[],"fixes":[{"wrong":"ate","right":"eaten","partial":false,"at":[2],"point":"현재완료: have 뒤에는 과거분사 eaten (ate 아님)","topic":"현재완료","memo":"have 뒤에는 과거분사 eaten (ate 아님)"}]},{"n":10,"tag":null,"en":"But when the food came out, I found out that they calls French fries \"chips\" on London!","ko":"그러나 음식이 나왔을 때, 나는 그들이 런던에서 프렌치프라이(감자튀김)를 '칩스'라고 부른다는 것을 알게 되었다!","ok":false,"foot":[],"fixes":[{"wrong":"calls","right":"call","partial":false,"at":[11],"point":"주어와 동사의 수일치: 주어 they에는 call 사용","topic":"주어와 동사의 수일치","memo":"주어 they에는 call 사용"},{"wrong":"on","right":"in","partial":false,"at":[15],"point":"기본전치사: '런던에서'는 전치사 in 사용","topic":"기본전치사","memo":"'런던에서'는 전치사 in 사용"}]},{"n":11,"tag":null,"en":"After an yummy British meal, we walked around the market. We saw the famous red phone booth and took more pictures.","ko":"맛있는 영국 음식을 먹은 후, 우리는 시장을 돌아다녔다. 우리는 유명한 빨간색 공중전화 부스를 보았고 더 많은 사진을 찍었다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[1],"point":"관사 a/an: yummy는 자음 소리이므로 a 사용","topic":"관사 a/an","memo":"yummy는 자음 소리이므로 a 사용"}]},{"n":12,"tag":null,"en":"Then I bought a prettily plate for my mom. What a fun day!","ko":"그러고 나서 나는 엄마를 위해 예쁜 접시를 하나 샀다. 정말 재밌는 하루였다!","ok":false,"foot":[],"fixes":[{"wrong":"prettily","right":"pretty","partial":false,"at":[4],"point":"형용사와 부사: 명사 plate 앞에는 형용사 pretty 사용","topic":"형용사와 부사","memo":"명사 plate 앞에는 형용사 pretty 사용"}]}];var PP=[["Subin's Travel Story","수빈이의 여행 이야기",1],["I can't wait to tell you about my trip to London.","런던으로 다녀온 나의 여행에 대해 너에게 어서 말해 주고 싶다.",1],["The flight took 15 hours from Incheon.","비행은 인천에서부터 15시간이 걸렸다.",0],["When I met my friend Amelia at the airport, I was so excited.","내가 내 친구 Amelia를 공항에서 만났을 때, 나는 매우 신이 났다.",0],["I have known her since I was 10 years old.","내가 10살이었을 때부터 나는 그녀와 알고 지냈다.",0],["She took me to many places in London.","그녀는 나를 런던의 많은 곳에 데려가 주었다.",0],["Come with me on my amazing trip!","나의 굉장한 여행에 나와 함께 가 봐!",0],["Beautiful Palace","아름다운 궁전",1],["We got on the famous red bus and the first stop was Buckingham Palace.","우리는 유명한 빨간색 버스에 올라탔고 첫 번째 정류장은 버킹엄 궁전이었다.",1],["The King and his family live there.","왕과 그의 가족이 그곳에 산다.",0],["We saw the King's Guard.","우리는 국왕 근위대를 보았다.",0],["The guards were wearing red jackets and tall black hats.","근위병들은 빨간색 재킷과 높은 검은색 모자를 쓰고 있었다.",0],["We took pictures near them, but they didn't smile or move.","우리는 그들 근처에서 사진을 찍었지만, 그들은 웃거나 움직이지 않았다.",0],["They were like statues!","그들은 조각상들 같았다!",0],["Yummy Meal","맛있는 식사",1],["Next, we went to Camden Market.","다음으로, 우리는 캠던 마켓에 갔다.",1],["This market is known for its food from around the world.","이 시장은 세계 곳곳의 음식으로 알려져 있다.",0],["Amelia told me to try the fish and chips.","Amelia는 나에게 피시앤칩스를 먹어 보라고 말했다.",0],["I thought, \"How strange!","나는 생각했다, \"이상하네!",0],["I have eaten fish many times.","나는 생선을 여러 번 먹어 봤어.",0],["But I've never tried it with potato chips.\"","하지만 나는 감자칩과 함께 먹어 본 적은 없어.\"",0],["But when the food came out, I found out that they call French fries \"chips\" in London!","그러나 음식이 나왔을 때, 나는 그들이 런던에서 프렌치프라이(감자튀김)를 '칩스'라고 부른다는 것을 알게 되었다!",0],["After a yummy British meal, we walked around the market.","맛있는 영국 음식을 먹은 후, 우리는 시장을 돌아다녔다.",0],["We saw the famous red phone booth and took more pictures.","우리는 유명한 빨간색 공중전화 부스를 보았고 더 많은 사진을 찍었다.",0],["Then I bought a pretty plate for my mom.","그러고 나서 나는 엄마를 위해 예쁜 접시를 하나 샀다.",0],["What a fun day!","정말 재밌는 하루였다!",0]];var RNUM=35;var TITLE_EN="See You in London!";var PASS_EN=["See You in London!","Subin's Travel Story","I can't wait to tell you about my trip to London. The flight took 15 hours from Incheon. When I met my friend Amelia at the airport, I was so excited. I have known her since I was 10 years old. She took me to many places in London. Come with me on my amazing trip!","Beautiful Palace","We got on the famous red bus and the first stop was Buckingham Palace. The King and his family live there. We saw the King's Guard. The guards were wearing red jackets and tall black hats. We took pictures near them, but they didn't smile or move. They were like statues!","Yummy Meal","Next, we went to Camden Market. This market is known for its food from around the world. Amelia told me to try the fish and chips. I thought, \"How strange! I have eaten fish many times. But I've never tried it with potato chips.\" But when the food came out, I found out that they call French fries \"chips\" in London! After a yummy British meal, we walked around the market. We saw the famous red phone booth and took more pictures. Then I bought a pretty plate for my mom. What a fun day!"];var PASS_KO=["런던에서 만나!","수빈이의 여행 이야기","런던으로 다녀온 나의 여행에 대해 너에게 어서 말해 주고 싶다. 비행은 인천에서부터 15시간이 걸렸다. 내가 내 친구 Amelia를 공항에서 만났을 때, 나는 매우 신이 났다. 내가 10살이었을 때부터 나는 그녀와 알고 지냈다. 그녀는 나를 런던의 많은 곳에 데려가 주었다. 나의 굉장한 여행에 나와 함께 가 봐!","아름다운 궁전","우리는 유명한 빨간색 버스에 올라탔고 첫 번째 정류장은 버킹엄 궁전이었다. 왕과 그의 가족이 그곳에 산다. 우리는 국왕 근위대를 보았다. 근위병들은 빨간색 재킷과 높은 검은색 모자를 쓰고 있었다. 우리는 그들 근처에서 사진을 찍었지만, 그들은 웃거나 움직이지 않았다. 그들은 조각상들 같았다!","맛있는 식사","다음으로, 우리는 캠던 마켓에 갔다. 이 시장은 세계 곳곳의 음식으로 알려져 있다. Amelia는 나에게 피시앤칩스를 먹어 보라고 말했다. 나는 생각했다, \"이상하네! 나는 생선을 여러 번 먹어 봤어. 하지만 나는 감자칩과 함께 먹어 본 적은 없어.\" 그러나 음식이 나왔을 때, 나는 그들이 런던에서 프렌치프라이(감자튀김)를 '칩스'라고 부른다는 것을 알게 되었다! 맛있는 영국 음식을 먹은 후, 우리는 시장을 돌아다녔다. 우리는 유명한 빨간색 공중전화 부스를 보았고 더 많은 사진을 찍었다. 그러고 나서 나는 엄마를 위해 예쁜 접시를 하나 샀다. 정말 재밌는 하루였다!"];var DG=[{"qs":[{"n":1,"q":"위 대화를 읽고 알 수 없는 것은?","o":["Mark의 국적","진수가 전통 시장을 추천하는 이유","전통 시장에서 가장 인기 있는 먹거리","전통 시장에 가는 방법","시장까지 버스로 가는 데 걸리는 소요 시간"],"a":2,"ans":"전통 시장에서 가장 인기 있는 먹거리","evs":[["Mark, my friend from Canada, wants to experience Korean culture.","캐나다에서 온 내 친구 Mark가 한국 문화를 경험해 보고 싶어 해."],["There are lots of things to eat and see.","먹을 것과 볼 것이 많아."]],"ev":["Mark, my friend from Canada, wants to experience Korean culture.","캐나다에서 온 내 친구 Mark가 한국 문화를 경험해 보고 싶어 해."],"ow":["오답 ✕ — 'Mark, my friend from Canada'(캐나다에서 온 내 친구 Mark)라고 했으므로 Mark의 국적은 알 수 있음.","오답 ✕ — 진수는 'There are lots of things to eat and see.'(먹을 것과 볼 것이 많아.)라며 추천 이유를 말했으므로 알 수 있음.","정답 ○ — 먹을 것이 많다고만 했을 뿐, 전통 시장에서 가장 인기 있는 먹거리가 무엇인지는 지문에 나오지 않으므로 알 수 없음.","오답 ✕ — 'Take the No. 11 bus in front of the school and get off at the fifth stop.'(학교 앞에서 11번 버스를 타고 다섯 번째 정류장에서 내려.)라고 했으므로 가는 방법은 알 수 있음.","오답 ✕ — 'It will take about 20 minutes.'(약 20분 걸릴 거야.)라고 했으므로 걸리는 시간은 알 수 있음."],"memo":["정답 ③: 전통 시장에서 가장 인기 있는 먹거리는 알 수 없다.","근거: There are lots of things to eat and see.(먹을 것과 볼 것이 많아.)","함정: '먹을 것이 많다'와 '가장 인기 있는 것'은 달라서 ③이 정답"],"why":"전통 시장에 먹거리가 많다는 말만 있고, 가장 인기 있는 먹거리는 나오지 않는다."},{"n":2,"q":"How should Sara get to the traditional market?","o":["By taking the No. 11 bus and getting off at the fifth stop","By taking the No. 5 bus and getting off at the eleventh stop","By taking the subway in front of the school","By walking for about 20 minutes","By taking a taxi from the airport"],"a":0,"ans":"By taking the No. 11 bus and getting off at the fifth stop","evs":[["Take the No. 11 bus in front of the school and get off at the fifth stop.","학교 앞에서 11번 버스를 타고 다섯 번째 정류장에서 내려."]],"ev":["Take the No. 11 bus in front of the school and get off at the fifth stop.","학교 앞에서 11번 버스를 타고 다섯 번째 정류장에서 내려."],"ow":["정답 ○ — 'Take the No. 11 bus in front of the school and get off at the fifth stop.'(학교 앞에서 11번 버스를 타고 다섯 번째 정류장에서 내려.)와 일치함.","오답 ✕ — 버스 번호와 정류장 숫자를 바꾼 함정이다. 지문은 'No. 11 bus'(11번 버스), 'fifth stop'(다섯 번째 정류장)임.","오답 ✕ — 'Take the No. 11 bus'(11번 버스를 타)라고 했으므로 지하철이 아니라 버스임.","오답 ✕ — 'It will take about 20 minutes.'(약 20분 걸릴 거야.)는 소요 시간이고, 걸어간다는 말은 지문에 없음.","오답 ✕ — 택시나 공항 이야기는 지문에 없음. 방법은 학교 앞에서 타는 버스임."],"memo":["정답 ①: 학교 앞에서 11번 버스를 타고 다섯 번째 정류장에서 내린다.","근거: Take the No. 11 bus ... get off at the fifth stop.(11번 버스 ... 다섯 번째 정류장에서 내려.)","함정: ②는 숫자를 바꿔 놓은 함정이라 ✕"],"why":"시장에 가려면 학교 앞에서 11번 버스를 타고 다섯 번째 정류장에서 내린다."}],"dlg":[["G","Hi, Jinsu. Can I ask you something?","안녕, 진수야. 뭐 하나 물어봐도 될까?"],["B","Sure, Sara. What's up?","물론이지, Sara. 무슨 일이야?"],["G","Mark, my friend from Canada, wants to experience Korean culture.","캐나다에서 온 내 친구 Mark가 한국 문화를 경험해 보고 싶어 해."],["B","How about taking him to the traditional market in our town? There are lots of things to eat and see.","우리 동네 전통 시장에 데려가는 게 어때? 먹을 것과 볼 것이 많아."],["G","That's a good idea! How can I get there?","좋은 생각이야! 거기에 어떻게 가?"],["B","Take the No. 11 bus in front of the school and get off at the fifth stop.","학교 앞에서 11번 버스를 타고 다섯 번째 정류장에서 내려."],["G","Okay. How long will it take to get to the market?","알겠어. 시장까지 가는 데 얼마나 걸려?"],["B","It will take about 20 minutes.","약 20분 걸릴 거야."],["G","All right. Thanks.","알겠어. 고마워."],["B","No problem. Have a good time with your friend!","천만에. 친구와 즐거운 시간 보내!"]]},{"qs":[{"n":3,"q":"위 대화의 주제로 알맞은 것은?","o":["공항 주변의 많은 교통량","선호하는 교통수단 종류","중앙역까지 가는 방법","공항으로 가는 교통편","약속 장소 정하기"],"a":2,"ans":"중앙역까지 가는 방법","evs":[["How can I get to Central Station?","중앙역에 어떻게 가나요?"],["You can take the bus or the train.","버스나 기차를 타실 수 있어요."]],"ev":["How can I get to Central Station?","중앙역에 어떻게 가나요?"],"ow":["오답 ✕ — 'there's a lot of traffic around the airport'(공항 주변에 교통량이 많아요)는 기차가 더 빠른 이유로 나온 한 마디일 뿐 대화의 주제가 아님.","오답 ✕ — 'Which one is faster?'(어느 쪽이 더 빠른가요?)라고 묻지만 어떤 교통수단을 좋아하는지 묻는 대화는 아님. 중심은 중앙역으로 가는 방법임.","정답 ○ — 'How can I get to Central Station?'(중앙역에 어떻게 가나요?)로 시작해 버스·기차, 걸리는 시간, 타는 곳을 안내하므로 중앙역까지 가는 방법이 주제임.","오답 ✕ — 공항 '주변'의 교통량이 나올 뿐, 공항으로 가는 교통편을 묻는 대화가 아님. 목적지는 'Central Station'(중앙역)임.","오답 ✕ — 약속 장소를 정하는 대화는 지문에 없음. 하나는 길을 묻고 점원이 안내하는 대화임."],"memo":["정답 ③: 중앙역까지 가는 방법","근거: How can I get to Central Station?(중앙역에 어떻게 가나요?)","함정: ④는 공항 '주변'의 교통량일 뿐, 목적지는 중앙역이라 ✕"],"why":"하나가 중앙역에 가는 방법을 묻고 점원이 버스·기차를 안내하는 대화이다."},{"n":4,"q":"Why does the clerk say the train is faster?","o":["Because the train runs every five minutes.","Because there is a lot of traffic around the airport at this time of day.","Because the bus station is too far away.","Because Central Station is near the airport.","Because the bus is always full."],"a":1,"ans":"Because there is a lot of traffic around the airport at this time of day.","evs":[["At this time of day, there's a lot of traffic around the airport. So, the train is faster.","이 시간대에는 공항 주변에 교통량이 많아요. 그래서 기차가 더 빨라요."]],"ev":["At this time of day, there's a lot of traffic around the airport. So, the train is faster.","이 시간대에는 공항 주변에 교통량이 많아요. 그래서 기차가 더 빨라요."],"ow":["오답 ✕ — 기차가 몇 분마다 오는지는 지문에 없음. 이유는 'there's a lot of traffic around the airport'(공항 주변에 교통량이 많아요)임.","정답 ○ — 'At this time of day, there's a lot of traffic around the airport. So, the train is faster.'(이 시간대에는 공항 주변에 교통량이 많아서 기차가 더 빨라요.)와 일치함.","오답 ✕ — 버스 정류장이 멀다는 말은 지문에 없음. 이유는 교통량임.","오답 ✕ — 중앙역이 공항 근처라는 말은 지문에 없음. 교통량이 많은 곳은 '공항 주변'임.","오답 ✕ — 버스가 늘 가득 찬다는 말은 지문에 없음. 'a lot of traffic'(교통량이 많다)이 이유임."],"memo":["정답 ②: 이 시간대에 공항 주변 교통량이 많기 때문이다.","근거: there's a lot of traffic around the airport. So, the train is faster.(교통량이 많아서 기차가 더 빠르다.)","함정: 이유는 교통량이지 버스가 가득 찬 것이 아니라 ⑤는 ✕"],"why":"공항 주변 교통량이 많아서 버스보다 기차가 더 빠르다."}],"dlg":[["Clerk","Hi, may I help you?","안녕하세요, 도와 드릴까요?"],["Hana","Yes. How can I get to Central Station?","네. 중앙역에 어떻게 가나요?"],["Clerk","There are two ways. You can take the bus or the train.","두 가지 방법이 있어요. 버스나 기차를 타실 수 있어요."],["Hana","Which one is faster?","어느 쪽이 더 빠른가요?"],["Clerk","At this time of day, there's a lot of traffic around the airport. So, the train is faster.","이 시간대에는 공항 주변에 교통량이 많아요. 그래서 기차가 더 빨라요."],["Hana","I see. How long will it take?","알겠어요. 얼마나 걸리나요?"],["Clerk","It will take about 30 minutes.","약 30분 걸릴 거예요."],["Hana","Great. Where can I take the train?","좋아요. 기차는 어디에서 탈 수 있나요?"],["Clerk","Go that way and follow the sign for the train.","저쪽으로 가셔서 기차 표지판을 따라가세요."],["Hana","Okay. Thanks for your help.","알겠어요. 도와주셔서 감사합니다."]]},{"qs":[{"n":5,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["The boy wants to find a bakery.","The girl tells the boy about a bakery on Blue Street.","The boy should go straight one block and turn right to find a bakery.","The boy can find a bookstore near the bakery.","It will take about 10 minutes to get to the bakery from the speakers' conversation spot."],"a":2,"ans":"The boy should go straight one block and turn right to find a bakery.","evs":[["Go straight one block and make a left.","한 블록 직진한 다음 왼쪽으로 도세요."]],"ev":["Go straight one block and make a left.","한 블록 직진한 다음 왼쪽으로 도세요."],"ow":["오답 ✕ — 소년이 'I'm looking for a bakery.'(저는 빵집을 찾고 있어요.)라고 했으므로 일치하는 내용이라 답이 아님.","오답 ✕ — 소녀가 'There is a bakery on Blue Street.'(Blue 거리에 빵집이 하나 있어요.)라고 했으므로 일치함.","정답 ○ — 소녀는 'Go straight one block and make a left.'(한 블록 직진한 다음 왼쪽으로 도세요.)라고 했다. 오른쪽(right)으로 돌라는 보기는 일치하지 않음.","오답 ✕ — 'It's between the bookstore and the fire station.'(서점과 소방서 사이에 있어요.)라고 했으므로 빵집 근처에서 서점을 찾을 수 있어 일치함.","오답 ✕ — 'It will take about or its food from around the world.","이 시장은 세계 곳곳의 음식으로 알려져 있다."],["Amelia told me to try the fish and chips.","Amelia는 나에게 피시앤칩스를 먹어 보라고 말했다."],["I thought, \"How strange!","나는 생각했다, \"이상하네!"],["I have eaten fish many times.","나는 생선을 여러 번 먹어 봤어."],["But I've never tried it with potato chips.\"","하지만 나는 감자칩과 함께 먹어 본 적은 없어.\""],["But when the food came out, I found out that they call French fries \"chips\" in London!","그러나 음식이 나왔을 때, 나는 그들이 런던에서 프렌치프라이(감자튀김)를 '칩스'라고 부른다는 것을 알게 되었다!"],["After a yummy British meal, we walked around the market.","맛있는 영국 음식을 먹은 후, 우리는 시장을 돌아다녔다."],["We saw the famous red phone booth and took more pictures.","우리는 유명한 빨간색 공중전화 부스를 보았고 더 많은 사진을 찍었다."],["Then I bought a pretty plate for my mom.","그러고 나서 나는 엄마를 위해 예쁜 접시를 하나 샀다."],["What a fun day!","정말 재밌는 하루였다!"]]}];

document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
