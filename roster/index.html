function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(n){return String(n||"").replace(/\s+/g,"")}
function groupOf(x){var g=x.grade||"";if(x.cls==="관리형")return "관리형";if(/^초/.test(g))return "초등";if(/^중/.test(g))return "중등";if(/^고/.test(g)||/고등/.test(x.cls||""))return "고등";return "기타"}
function gradeFromCls(c){c=c||"";var m=c.match(/(초6|초5|중1|중2|중3)/);if(m)return m[1];if(/고등/.test(c))return "고";return ""}

async function readSources(){

  var em={r:{},f:[]};
  var r=await fetch(B+"board/2000-01-03%7C_%EC%84%A4%EC%A0%95?key="+K).then(function(x){return x.json()});

}
var HWMAP={"M중3":"M중3A","T중3":"T중3B"};
function buildMerge(src){
  var by={},warn=[];
  function get(n){var k=norm(n);if(!by[k])by[k]={name:k,cls:"",grade:"",school:"",fri:false,sat:false,status:"on",src:{}};return by[k]}
  Object.keys(src.em.r).forEach(function(c){(src.em.r[c]||[]).forEach(function(n){if(!n||/^샘플/.test(n)||n==="열람")return;var o=get(n);o.cls=c;o.src.em=1})});
  src.hw.forEach(function(h){if(!h||!h.name)return;var o=get(h.name);o.src.hw=1;o.id=h.id;o.tok=h.tok;o.hw={xs:h.xs||[],vocalink:h.vocalink,bidanDays:h.bidanDays,cls:h.cls};if(h.off)o.status="off";if(!o.cls){var c=h.cls;Object.keys(HWMAP).forEach(function(k){if(HWMAP[k]===c)c=k});o.cls=c}});
  src.att.forEach(function(a){if(!a||!a.name||a.active==="N")return;var o=get(a.name);o.src.att=1;if(a.grade)o.grade=a.grade;if(a.group==="금")o.fri=true;if(a.group==="토")o.sat=true;if(norm(a.name)!==a.name)warn.push("출석부 이름에 띄어쓰기: \""+a.name+"\" 를 \""+norm(a.name)+"\" 로 통일")});
  var out=Object.keys(by).map(function(k){var o=by[k];if(!o.grade)o.grade=gradeFromCls(o.cls);o.school=defSchool(o.grade);if(!o.id)o.id=Math.random().toString(36).slice(2,10);return o});
  out.sort(function(a,b){return ko(a.name,b.name)});
  var miss=[];out.forEach(function(o){var s=o.src;var m=[];if(!s.em)m.push("EM보드");if(!s.hw&&groupOf(o)!=="고등"&&o.cls!=="관리형")m.push("숙제 REC");if(!s.att&&o.cls!=="관리형")m.push("출석부");if(m.length)miss.push(o.name+": "+m.join(", ")+" 에 없음")});
  return {students:out,warn:warn,miss:miss};
}

async function load(){
  var s=await getDoc(MASTER);
  if(!s.exists()){S.m=null;return}
  var d=JSON.parse(s.data().j);S.m=d;
  try{var h=await getDoc(HIST);S.hist=h.exists()?JSON.parse(h.data().j):[]}catch(e){S.hist=[]}
}
async function syncAtt(arr){
  try{
    var ch=0;
    await runTransaction(db,async function(tx){
      var r=await tx.get(ATT);if(!r.exists())return;var ros=JSON.parse(r.data().j),by={},c=0;
      ros.forEach(function(a){var k=norm(a.name);if(!by[k]||(a.active!=="N"&&by[k].active==="N"))by[k]=a});
      arr.forEach(function(x){
        var a=by[norm(x.an||x.name)],grp=x.fri?"금":x.sat?"토":"",act=(x.status==="on"&&grp)?"Y":"N";
        if(a){
          if(x.grade&&a.grade!==x.grade){a.grade=x.grade;c++}
          if(grp&&a.group!==grp){a.group=grp;c++}
          if((a.active||"Y")!==act){a.active=act;c++}
        }else if(x.status==="on"&&grp){var na={name:norm(x.name),group:grp,grade:x.grade||"",active:"Y"};ros.push(na);by[norm(na.name)]=na;c++}
      });
      ch=c;if(c)tx.set(ATT,Object.assign({},r.data(),{j:JSON.stringify(ros)}));
    });
    return ch;
  }catch(e){return -1}
}
async function audit(){
  S.drift=null;render();
  try{
    var m=S.m?S.m.s:[],by={},L=[];m.forEach(function(x){by[x.name]=x});
    var on=m.filter(function(x){return x.status==="on"});
    var d1=await getDoc(EMR),em=JSON.parse(JSON.parse(d1.data().chk).cfg.j).r||{};
    var emMap={};Object.keys(em).forEach(function(c){em[c].forEach(function(n){if(!n||/^샘플/.test(n)||n==="열람")return;var k=norm(n);if(emMap[k])L.push("EM보드에 두 반에 있음: "+k);emMap[k]=c})});
    on.forEach(function(x){if(x.cls==="관리형")return;if(!emMap[x.name])L.push("EM보드에 없음: "+x.name);else if(emMap[x.name]!==x.cls)L.push("EM보드 반 다름: "+x.name+" (EM보드 "+emMap[x.name]+" / 통합 명부 "+x.cls+")")});
    Object.keys(emMap).forEach(function(n){if(!by[n]||by[n].status!=="on")L.push("EM보드에만 있음: "+n)});
    var hw=JSON.parse((await getDoc(doc(db,"hw_c","main"))).data().roster),hn={};
    hw.forEach(function(h){if(!h||!h.name)return;var k=norm(h.name);hn[k]=h;var x=by[k];
      if(!x){if(!h.off)L.push("숙제 REC에만 있음: "+k);return}
      if(x.status==="on"&&h.off)L.push("숙제 REC에서 퇴원 상태: "+k);
      if(x.status!=="on"&&!h.off)L.push("숙제 REC에서 아직 재원: "+k);
      if(x.status==="on"&&!h.off&&x.hw&&x.hw.cls&&x.hw.cls!==h.cls)L.push("숙제 REC 반 다름: "+k+" (숙제 REC "+h.cls+" / 통합 명부 "+x.hw.cls+")")});
    on.forEach(function(x){if(groupOf(x)==="고등"||x.cls==="관리형")return;if(!hn[x.name])L.push("숙제 REC에 없음: "+x.name)});
    var ros=JSON.parse((await getDoc(ATT)).data().j),ab={},ba={};m.forEach(function(x){if(x.an)ba[norm(x.an)]=x});
    ros.forEach(function(a){var k=norm(a.name);if(a.active==="N")return;ab[k]=a;var x=by[k]||ba[k];
      if(!x||x.status!=="on")L.push("출석부에만 있음: "+k);
      else{if(x.grade&&a.grade!==x.grade)L.push("출석부 학년 다름: "+k);var g=x.fri?"금":x.sat?"토":"";if(g&&a.group!==g)L.push("출석부 요일 다름: "+k)}});
    on.forEach(function(x){if((x.fri||x.sat)&&!ab[norm(x.an||x.name)])L.push("출석부에 없음: "+x.name)});
    var n=new Date();S.drift={list:L,at:("0"+n.getHours()).slice(-2)+":"+("0"+n.getMinutes()).slice(-2)};
  }catch(e){S.drift={err:String(e&&e.message||e),list:[]}}
  render();
}

}
function hwDef(c){return {"M중3":"M중3A","T중3":"T중3B"}[c]||c}
function newTok(){var a=new Uint8Array(16),s="",ch="abcdefghijklmnopqrstuvwxyz0123456789";crypto.getRandomValues(a);for(var i=0;i<16;i++)s+=ch[a[i]%36];return s}
function hwClasses(cur){var o={};(S.m?S.m.s:[]).forEach(function(x){if(x.hw&&x.hw.cls)o[x.hw.cls]=1});if(cur)o[cur]=1;return Object.keys(o).sort(ko)}
function hwSel(ex){if(!ex.hw||!ex.hw.cls)return "";return "<span class=small>숙제 반</span><select id=eh>"+hwClasses(ex.hw.cls).map(function(c){return "<option"+(c===ex.hw.cls?" selected":"")+">"+esc(c)+"</option>"}).join("")+"</select>"}
async function syncHW(old,next){
  if(!old)return 0;
  try{
    var om={};old.forEach(function(x){om[x.id]=x});var ev=[];
    function elig(x){return x.cls!=="관리형"&&groupOf(x)!=="고등"}
    next.forEach(function(x){
      var o=om[x.id];
      if(!o){if(x.status==="on"&&elig(x))ev.push({k:"add",x:x});return}
      var on=o.status==="on",nn=x.status==="on";
      if(on&&!nn){ev.push({k:"out",id:x.id,n:o.name});return}
      if(!on&&nn){if(elig(x))ev.push({k:"back",x:x});return}
      if(!nn)return;
      if(o.name!==x.name)ev.push({k:"ren",id:x.id,n:x.name});
      var oc=o.hw&&o.hw.cls,nc=x.hw&&x.hw.cls;if(nc&&oc!==nc)ev.push({k:"cls",id:x.id,c:nc});
    });
    if(!ev.length)return 0;
    var cnt=0;
    await runTransaction(db,async function(tx){
      var d=await tx.get(HWM);if(!d.exists())return;
      var rows=JSON.parse(d.data().roster),k=0;
      function find(e){var id=e.id||e.x.id,nm=norm(e.n||(e.x&&e.x.name));for(var i=0;i<rows.length;i++){if(rows[i].id===id||norm(rows[i].name)===nm)return rows[i]}return null}
      ev.forEach(function(e){
        var r=find(e);
        if(e.k==="add"||e.k==="back"){var x=e.x;if(r){if(r.off){delete r.off;k++}}else{rows.push({id:x.id,name:x.name,cls:(x.hw&&x.hw.cls)||hwDef(x.cls),tok:x.tok||newTok(),xs:(x.hw&&x.hw.xs)||[]});k++}}
        else if(!r)return;
        else if(e.k==="out"){if(!r.off){r.off=true;k++}}
        else if(e.k==="ren"){r.name=e.n;k++}
        else if(e.k==="cls"){r.cls=e.c;k++}
      });
      if(!k)return;
      cnt=k;tx.update(HWM,{roster:JSON.stringify(rows)});
    });
    return cnt;
  }catch(e){return -1}
}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
async function syncEM(old,next){
  if(!old)return 0;
  try{
    var om={};old.forEach(function(x){om[x.id]=x});var ev=[];
    next.forEach(function(x){
      var o=om[x.id];
      if(!o){if(x.status==="on"&&x.cls)ev.push({k:"add",n:x.name,c:x.cls,f:!!x.fri});return}
      var on=o.status==="on",nn=x.status==="on";
      if(on&&!nn){ev.push({k:"out",n:o.name});return}
      if(!on&&nn){ev.push({k:"back",n:x.name,c:x.cls,f:!!x.fri});return}
      if(!nn)return;
      if(o.name!==x.name)ev.push({k:"ren",n:o.name,m:x.name});
      if(o.cls!==x.cls&&x.cls)ev.push({k:"mv",n:x.name,c:x.cls});
    });
    if(!ev.length)return 0;
    var cnt=0;
    await runTransaction(db,async function(tx){
      var d=await tx.get(EMR),dt=await tx.get(EMT);if(!d.exists())return;
      var v=d.data(),c=JSON.parse(v.chk),j=JSON.parse(c.cfg.j);j.r=j.r||{};j.s=j.s||{};j.f=j.f||[];
      var jt=null,ct=null,vt=null;if(dt.exists()){vt=dt.data();ct=JSON.parse(vt.chk);jt=JSON.parse(ct.tt.j);jt.o=jt.o||[]}
      var k=0,outs=[],backs=[];
      function find(n){for(var q in j.r){if(j.r[q].indexOf(n)>-1)return q}return ""}
      function drop(n){for(var q in j.r){var i=j.r[q].indexOf(n);if(i>-1)j.r[q].splice(i,1)}}
      function setF(n,on){var i=j.f.indexOf(n);if(on&&i<0)j.f.push(n);if(!on&&i>-1)j.f.splice(i,1)}
      function put(n,q){if(!j.r[q])j.r[q]=[];if(j.r[q].indexOf(n)<0)j.r[q].push(n)}
      ev.forEach(function(e){
        if(e.k==="add"||e.k==="back"){if(!find(e.n)){put(e.n,e.c);k++}if(e.k==="back"){backs.push(e.n);var oo=jt?jt.o.filter(function(y){return y.n===e.n})[0]:null;if(oo&&oo.fr)setF(e.n,true)}}
        else if(e.k==="out"){var q=find(e.n);if(q){outs.push({n:e.n,c:q,at:todayStr(),sk:(j.s[e.n]||[]).slice(),fr:j.f.indexOf(e.n)>-1});drop(e.n);delete j.s[e.n];setF(e.n,false);k++}}
        else if(e.k==="ren"){var q2=find(e.n);if(q2){var ix=j.r[q2].indexOf(e.n);j.r[q2][ix]=e.m;if(j.s[e.n]){j.s[e.m]=j.s[e.n];delete j.s[e.n]}var fi=j.f.indexOf(e.n);if(fi>-1)j.f[fi]=e.m;k++}}
        else if(e.k==="mv"){var q3=find(e.n);if(q3!==e.c){if(q3)drop(e.n);put(e.n,e.c);k++}}
      });
      if(!k&&!backs.length)return;
      cnt=k;
      j.u=Date.now();c.cfg.j=JSON.stringify(j);
      tx.update(EMR,{chk:JSON.stringify(c),seq:(v.seq||0)+1,t:new Date().toISOString()});
      if(jt&&(outs.length||backs.length)){
        jt.o=jt.o.filter(function(x){return backs.indexOf(x.n)<0});
        outs.forEach(function(x){jt.o=jt.o.filter(function(y){return y.n!==x.n});jt.o.push(x)});
        jt.u=Date.now();ct.tt.j=JSON.stringify(jt);
        tx.update(EMT,{chk:JSON.stringify(ct),seq:(vt.seq||0)+1,t:new Date().toISOString()});
      }
    });
    return cnt;
  }catch(e){return -1}
}
async function commit(next,desc){
  if(S.busy)return false;S.busy=true;render();
  try{
    var old=S.m?JSON.parse(JSON.stringify(S.m)):null;
    await runTransaction(db,async function(tx){
      var cur=await tx.get(MASTER);
      if(cur.exists()&&old){var cu=JSON.parse(cur.data().j).u;if(cu!==old.u)throw new Error("다른 기기에서 먼저 바뀜. 새로고침 후 다시 해 주세요")}
      var nd={u:Date.now(),s:next};tx.set(MASTER,{j:JSON.stringify(nd)});S.m=nd;
    });
    var h=S.hist.slice(-14);if(old)h.push({t:Date.now(),d:desc,s:old.s});S.hist=h;
    try{await setDoc(HIST,{j:JSON.stringify(h)})}catch(e){}
    S.busy=false;S.sel={};var an=await syncAtt(next),em=await syncEM(old&&old.s,next),hw=await syncHW(old&&old.s,next);msg(desc+" 완료"+(an>0?" · 출석부 "+an+"건 반영":"")+(an<0?" · 출석부 반영 실패(명부는 저장됨)":"")+(em>0?" · EM보드 "+em+"건 반영":"")+(em<0?" · EM보드 반영 실패(명부는 저장됨)":"")+(hw>0?" · 숙제 REC "+hw+"건 반영":"")+(hw<0?" · 숙제 REC 반영 실패(명부는 저장됨)":""));audit();return true;
  }catch(e){S.busy=false;msg(String(e&&e.message||e),true);return false}
}
function copy(a){return JSON.parse(JSON.stringify(a))}
function selNames(){return Object.keys(S.sel).filter(function(k){return S.sel[k]})}
function mutate(fn,desc){var n=selNames();if(!n.length){msg("학생을 먼저 선택해 주세요",true);return}var arr=copy(S.m.s);arr.forEach(function(x){if(S.sel[x.id])fn(x)});commit(arr,desc+" ("+n.length+"명)")}

function classes(){var o={};(S.m?S.m.s:[]).forEach(function(x){if(x.cls&&x.status==="on")o[x.cls]=1});return Object.keys(o).sort(ko)}
function schools(){var o={};(S.m?S.m.s:[]).forEach(function(x){if(x.school)o[x.school]=1});return Object.keys(o).sort(ko)}
function visible(){
  var q=norm(S.q);
  return S.m.s.filter(function(x){
    var off=x.status==="off";
    if(S.grp==="퇴원")return off;
    if(off)return false;
    if(S.grp!=="all"&&groupOf(x)!==S.grp)return false;
    if(q&&norm(x.name).indexOf(q)<0&&(x.cls||"").indexOf(S.q)<0)return false;
    return true;
  }).sort(function(a,b){return ko(a.name,b.name)});
}
function rowHtml(x){
  var t="";if(x.fri)t+="<span class=tag>금</span> ";if(x.sat)t+="<span class=tag>토</span> ";if(x.status==="off")t+="<span class='tag off'>퇴원</span>";
  return "<div class=row data-id=\""+x.id+"\"><input type=checkbox "+(S.sel[x.id]?"checked":"")+" data-sel=\""+x.id+"\"><span class=nm>"+esc(x.name)+"</span><span class=meta>"+esc(x.school||"-")+" · "+esc(x.grade||"-")+" · "+esc(x.cls||"반 없음")+"</span>"+t+"</div>";
}
var NX={"초5":"초6","초6":"중1","중1":"중2","중2":"중3","중3":"고1","고1":"고2","고2":"고3"};
function upPlan(){var p={mv:{},grad:[],none:[]};S.m.s.forEach(function(x){if(x.status!=="on")return;var g=x.grade;if(g==="고3"){p.grad.push(x.name);return}if(NX[g]){var k=g+" → "+NX[g];(p.mv[k]=p.mv[k]||[]).push(x.name)}else p.none.push(x.name)});return p}
function upHtml(){var p=upPlan(),h="<div class=card><b>새 학년 올리기</b><div class=small>재원생의 학년을 한 단계씩 올립니다. 반 이름은 바꾸지 않으니, 올린 뒤 반 이동으로 정해 주세요. 초6 → 중1, 중3 → 고1은 학교가 바뀌므로 학교 칸을 비웁니다.</div>";Object.keys(NX).forEach(function(g){var k=g+" → "+NX[g],a=p.mv[k];if(a)h+="<div class=small style='margin-top:6px'><b>"+esc(k)+" "+a.length+"명</b> "+esc(a.join(", "))+"</div>"});if(p.grad.length)h+="<div class=small style='margin-top:6px'><b>고3 졸업(퇴원 처리) "+p.grad.length+"명</b> "+esc(p.grad.join(", "))+"</div>";if(p.none.length)h+="<div class=small style='margin-top:6px'><b>학년이 비어 있어 그대로 "+p.none.length+"명</b> "+esc(p.none.join(", "))+"</div>";h+="<div class=bar><button class=pri id=upok "+(S.busy?"disabled":"")+">올리기</button><button id=upno>닫기</button></div></div>";return h}
function render(){
  var A=document.getElementById("app");
  if(!S.user){A.innerHTML="<h1>통합 명부</h1><div class=sub>선생님 구글 로그인이 필요합니다</div><button class=pri id=login>구글로 로그인</button><div class='msg "+(S.err?"err":"")+"'>"+esc(S.msg)+"</div>";return}
  if(!OK.includes(String(S.user.email||"").toLowerCase())){A.innerHTML="<h1>통합 명부</h1><div class='msg err'>허용되지 않은 계정입니다</div><button id=logout>로그아웃</button>";return}
  var h="<h1>통합 명부</h1><div class=sub>"+esc(S.user.email)+" · <a href=# id=logout>로그아웃</a></div>";
  if(S.msg)h+="<div class='msg "+(S.err?"err":"")+"'>"+esc(S.msg)+"</div>";
  if(!S.m){
    if(!S.merge){h+="<div class=card>아직 통합 명부가 없습니다. EM보드, 출석부, 숙제 REC 명단을 합쳐 처음 명부를 만듭니다. 옛 명단은 바꾸지 않고 읽기만 합니다.</div><button class=pri id=mk "+(S.busy?"disabled":"")+">세 명단 합쳐서 미리보기</button>"}
    else{
      var m=S.merge;
      h+="<div class=card><b>합친 결과 "+m.students.length+"명</b> (재원 "+m.students.filter(function(x){return x.status==="on"}).length+"명, 퇴원 "+m.students.filter(function(x){return x.status==="off"}).length+"명)</div>";
      if(m.warn.length)h+="<div class=card><b>이름 통일</b><div class=small>"+m.warn.map(esc).join("<br>")+"</div></div>";
      if(m.miss.length)h+="<div class=card><b>한쪽에만 있는 학생</b><div class=small>"+m.miss.map(esc).join("<br>")+"</div></div>";
      h+="<div class=bar><button class=pri id=mkok "+(S.busy?"disabled":"")+">이대로 통합 명부 만들기</button><button id=mkno>취소</button></div>";
    }
    A.innerHTML=h;return;
  }
  h+=driftHtml();
  var cnt={all:0,"초등":0,"중등":0,"고등":0,"관리형":0,"퇴원":0};
  S.m.s.forEach(function(x){if(x.status==="off")cnt["퇴원"]++;else{cnt.all++;var g=groupOf(x);if(cnt[g]!=null)cnt[g]++}});
  h+="<div class=bar>";["all","초등","중등","고등","관리형","퇴원"].forEach(function(g){h+="<button class='chip "+(S.grp===g?"on":"")+"' data-grp=\""+g+"\">"+(g==="all"?"전체":g)+" "+cnt[g]+"</button>"});h+="</div>";
  h+="<div class=bar><input type=search id=q placeholder=\"이름·반 검색\" value=\""+esc(S.q)+"\" style=\"flex:1\"><button id=addb>신규 추가</button><button id=undo "+(S.hist.length?"":"disabled")+">되돌리기</button><button id=upb>새 학년 올리기</button></div>";
  if(S.tab==="add"){
    h+="<div class=card><b>신규 학생</b><div class=bar><input type=text id=an placeholder=이름 style='width:90px'><select id=ag><option>초6</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>고2</option></select><input type=text id=as placeholder=학교 style='width:90px'><select id=ac>"+classes().map(function(c){return "<option>"+esc(c)+"</option>"}).join("")+"</select></div><div class=bar><button class=pri id=addok>추가</button><button id=addno>닫기</button></div></div>";
  }
  if(S.up){h+=upHtml()}
  if(S.edit){var ex=S.m.s.filter(function(z){return z.id===S.edit})[0];if(ex){var cl=classes();if(ex.cls&&cl.indexOf(ex.cls)<0)cl.push(ex.cls);h+='<div class=card><b>'+esc(ex.name)+' 수정</b><div class=bar><input type=text id=en value="'+esc(ex.name)+'" style="width:90px"><input type=text id=es value="'+esc(ex.school||'')+'" placeholder=학교 style="width:90px"><select id=eg>'+['','초5','초6','중1','중2','중3','고1','고2','고3'].map(function(g){return '<option'+(g===ex.grade?' selected':'')+'>'+g+'</option>'}).join('')+'</select><select id=ec>'+cl.map(function(c){return '<option'+(c===ex.cls?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select>'+hwSel(ex)+'<select id=ef><option value=none'+(!ex.fri&&!ex.sat?' selected':'')+'>출석 없음</option><option value=fri'+(ex.fri?' selected':'')+'>금요일</option><option value=sat'+(ex.sat?' selected':'')+'>토요일</option></select></div><div class=bar><button class=pri id=editok>저장</button><button id=editno>닫기</button></div></div>'}}
  var list=visible(),grp={};
  list.forEach(function(x){var k=x.cls||"반 없음";(grp[k]=grp[k]||[]).push(x)});
  Object.keys(grp).sort(ko).forEach(function(k){h+="<div class=gh>"+esc(k)+" "+grp[k].length+"명</div><div class=card style='padding:2px 8px'>"+grp[k].map(rowHtml).join("")+"</div>"});
  if(!list.length)h+="<div class=sub>해당하는 학생이 없습니다</div>";
  var n=selNames().length;
  h+="<div class=dock><div class=in><span class=small>선택 "+n+"명</span><button id=selall>보이는 학생 전체</button><button id=selno>해제</button>";
  if(S.grp==="퇴원")h+="<button class=pri id=restore>재원으로 복귀</button>";
  else h+="<select id=mvc><option value=''>반 이동</option>"+classes().map(function(c){return "<option>"+esc(c)+"</option>"}).join("")+"</select><select id=gr><option value=''>학년 변경</option><option>초5</option><option>초6</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>고2</option></select><select id=sc><option value=''>학교 변경</option>"+schools().map(function(s){return "<option>"+esc(s)+"</option>"}).join("")+"<option value='__new'>직접 입력</option></select><select id=fs><option value=''>출석 그룹</option><option value='fri'>금요일</option><option value='sat'>토요일</option><option value='none'>없음</option></select><button class=warn id=out>퇴원</button>";
  h+="</div></div>";
  A.innerHTML=h;
}

document.addEventListener("click",function(e){
  var t=e.target;
  if(t.id==="login"){var p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});signInWithPopup(auth,p).catch(function(er){var c=er&&er.code||"";if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment")signInWithRedirect(auth,p);else msg("로그인 실패: "+c,true)});return}
  if(t.id==="logout"){e.preventDefault();signOut(auth);return}
  if(t.id==="mk"){S.busy=true;render();readSources().then(function(src){S.merge=buildMerge(src);S.busy=false;S.msg="";render()}).catch(function(er){S.busy=false;msg(String(er.message||er),true)});return}
  if(t.id==="mkno"){S.merge=null;render();return}
  if(t.id==="mkok"){var arr=S.merge.students;S.merge=null;S.m=null;commit(arr,"통합 명부 생성").then(function(ok){if(ok)load().then(render)});return}
  if(t.dataset&&t.dataset.grp){S.grp=t.dataset.grp;S.sel={};render();return}
  if(t.dataset&&t.dataset.sel){S.sel[t.dataset.sel]=t.checked;render();return}
  if(t.id==="selall"){visible().forEach(function(x){S.sel[x.id]=true});render();return}
  if(t.id==="selno"){S.sel={};render();return}
  if(t.id==="addb"){S.tab="add";render();return}
  if(t.id==="addno"){S.tab="list";render();return}
  if(t.id==="addok"){
    var n=norm(document.getElementById("an").value);if(!n){msg("이름을 입력해 주세요",true);return}
    if(S.m.s.some(function(x){return x.name===n&&x.status==="on"})){msg("이미 재원생 중에 같은 이름이 있습니다",true);return}
    var g=document.getElementById("ag").value,sc=document.getElementById("as").value.trim(),c=document.getElementById("ac").value;
    var arr2=copy(S.m.s);var nx={id:Math.random().toString(36).slice(2,10),name:n,cls:c,grade:g,school:sc||defSchool(g),fri:false,sat:false,status:"on",src:{}};if(!/^고/.test(g)&&c!=="관리형"){nx.tok=newTok();nx.hw={xs:[],cls:hwDef(c)}}arr2.push(nx);
    S.tab="list";commit(arr2,"신규 추가 "+n);return}
  if(t.id==="out"){if(!selNames().length){msg("학생을 먼저 선택해 주세요",true);return}if(!confirm("선택한 "+selNames().length+"명을 퇴원 처리할까요? 기록은 남고 되돌릴 수 있습니다"))return;mutate(function(x){x.status="off"},"퇴원");return}
  if(t.id==="restore"){mutate(function(x){x.status="on"},"재원 복귀");return}
  if(t.id==="audb"){audit();return}
  if(t.id==="upb"){S.up=true;render();return}
  if(t.id==="upno"){S.up=false;render();return}
  if(t.id==="upok"){var arr4=copy(S.m.s),n4=0;arr4.forEach(function(x){if(x.status!=="on")return;var g=x.grade;if(g==="고3"){x.status="off";n4++;return}if(NX[g]){x.grade=NX[g];if(g==="초6"||g==="중3")x.school="";n4++}});S.up=false;commit(arr4,"새 학년 올리기 ("+n4+"명)");return}
  if(t.id==="editno"){S.edit=null;render();return}
  if(t.id==="editok"){var nn=norm(document.getElementById("en").value);if(!nn){msg("이름을 입력해 주세요",true);return}var arr3=copy(S.m.s),id3=S.edit,tg=arr3.filter(function(z){return z.id===id3})[0];if(!tg)return;if(arr3.some(function(z){return z.id!==id3&&z.name===nn&&z.status==="on"})){msg("이미 같은 이름의 재원생이 있습니다",true);return}var ef=document.getElementById("ef").value,old3=tg.name;if(nn!==old3&&!tg.an)tg.an=old3;tg.name=nn;tg.school=document.getElementById("es").value.trim();tg.grade=document.getElementById("eg").value;tg.cls=document.getElementById("ec").value;var eh=document.getElementById("eh");if(eh&&tg.hw)tg.hw.cls=eh.value;tg.fri=ef==="fri";tg.sat=ef==="sat";S.edit=null;commit(arr3,"개별 수정 "+old3);return}
  if(!t.dataset.sel&&t.type!=="checkbox"&&t.closest&&t.closest(".row")){S.edit=t.closest(".row").dataset.id;render();return}
  if(t.id==="undo"){var last=S.hist[S.hist.length-1];if(!last)return;if(!confirm("직전 변경을 되돌릴까요?"))return;var hh=S.hist.slice(0,-1);commit(last.s,"되돌리기").then(function(ok){if(ok){S.hist=hh;setDoc(HIST,{j:JSON.stringify(hh)}).catch(function(){});render()}});return}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="mvc"&&t.value){var c=t.value;mutate(function(x){x.cls=c},"반 이동 → "+c);return}
  if(t.id==="gr"&&t.value){var g=t.value;mutate(function(x){x.grade=g;if(!x.school)x.school=defSchool(g)},"학년 변경 → "+g);return}
  if(t.id==="sc"&&t.value){if(!selNames().length){msg("학생을 먼저 선택해 주세요",true);return}var sv=t.value;if(sv==="__new"){sv=(prompt("학교 이름")||"").trim();if(!sv){render();return}}mutate(function(x){x.school=sv},"학교 변경 → "+sv);return}
  if(t.id==="fs"&&t.value){var v=t.value;mutate(function(x){x.fri=v==="fri";x.sat=v==="sat"},"출석 그룹 → "+(v==="fri"?"금요일":v==="sat"?"토요일":"없음"));return}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;var p=e.target.selectionStart;render();var q=document.getElementById("q");q.focus();try{q.setSelectionRange(p,p)}catch(x){}}});

onAuthStateChanged(auth,function(u){
  S.user=u;
  if(u&&OK.includes(String(u.email||"").toLowerCase())){load().then(function(){render();audit()}).catch(function(er){msg("명부를 읽지 못함: "+(er&&er.code||er.message),true)})}else render();
});
