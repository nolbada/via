le phones.","몇몇 연구원들은 휴대폰의 전자 신호를 탓하기도 한다."]],"w":"11번 문장에 Some researchers also blame electronic signals from mobile phones가 그대로 있어요.","c":"T"},"h":"741713a0b8"},{"n":3,"t":"tf","q":"Honey bees play a vital role in helping plants reproduce.","ko":"꿀벌은 식물이 번식하도록 돕는 중요한 역할을 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"This can cause a serious problem because honey bees play a vital role in helping plants reproduce.","이것은 심각한 문제를 야기할 수 있는데, 왜냐하면 꿀벌이 식물이 번식하도록 돕는 것에 있어 중요한 역할을 하기 때문이다."]],"w":"6번 문장에서 꿀벌이 식물이 번식하도록 돕는 중요한 역할(a vital role)을 한다고 해요.","c":"T"},"h":"5ce49c7e7c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The remaining bees, including the queen and the young bees, starve to death.)","ko":"여왕벌과 어린 벌을 포함하여, 남아 있는 벌은 ( ) 죽는다.","opts":["굶어","얼어","병들어","늙어"],"word":"starve","r":{"a":"1) 굶어","ev":"3번 문장","s":[[3,"The remaining bees, including the queen and the young bees, starve to death.","여왕벌과 어린 벌을 포함하여, 남아 있는 벌은 굶어 죽는다."]],"w":"일벌이 먹이를 찾으러 나가 돌아오지 않으니 남은 벌들은 먹을 것이 없어요. starve to death는 ‘굶어 죽다’예요.","c":1},"h":"629b2f953e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (There are numerous theories about why such a phenomenon is occurring.)","ko":"왜 그러한 현상이 일어나고 있는지에 대해 ( ) 이론이 있다.","opts":["거의 없는","믿기 어려운","수많은","오래된"],"word":"numerous","r":{"a":"3) 수많은","ev":"9~10번 문장","s":[[9,"There are numerous theories about why such a phenomenon is occurring.","왜 그러한 현상이 일어나고 있는지에 대해 수많은 이론이 있다."],[10,"Many of them suggest that environmental pollution, diseases, or exposure to harmful agricultural chemicals could be the main causes.","그 중 많은 것이 환경 오염, 질병, 또는 해로운 농약에의 노출이 주요 원인일 수 있다고 제시한다."]],"w":"9번은 왜 이런 현상이 일어나는지에 대한 이론이 ‘수많이’ 있다는 말이에요. 10~11번에서 여러 가지 원인이 줄줄이 나오는 것과 이어져요. numerous = 수많은.","c":3},"h":"c0f500742b"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nMany of them suggest that environmental pollution, diseases, or exposure to harmful agricultural chemicals could be the main causes.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그 중 많은 것이 환경 오염, 질병, 또는 해로운 농약에의 노출이 주요 원인일 수 있다고 제시한다.","opts":["꿀벌들","수많은 이론들","연구원들","식량 작물들"],"r":{"a":"2) 수많은 이론들","ev":"9~10번 문장","s":[[9,"There are numerous theories about why such a phenomenon is occurring.","왜 그러한 현상이 일어나고 있는지에 대해 수많은 이론이 있다."],[10,"Many of them suggest that environmental pollution, diseases, or exposure to harmful agricultural chemicals could be the main causes.","그 중 많은 것이 환경 오염, 질병, 또는 해로운 농약에의 노출이 주요 원인일 수 있다고 제시한다."]],"w":"9번에서 ‘수많은 이론(numerous theories)’이 있다고 했어요. 원인을 제시하는 것은 그 이론들이고, Many of them은 ‘이론들 중 많은 것’이에요.","c":2},"h":"39697205b1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without them, we wouldn’t be able to grow fruits and vegetables!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"꿀벌이 없다면, 우리는 과일과 채소를 기를 수 없을 것이다!","opts":["꿀벌이 없다면 우리는 과일과 채소를 더 많이 기를 수 있을 것이다.","꿀벌이 있으면 우리는 과일과 채소를 기를 수 없을 것이다.","우리가 과일과 채소를 기르지 않으면 꿀벌이 없어질 것이다.","꿀벌이 없다면 우리는 과일과 채소를 기를 수 없을 것이다."],"r":{"a":"4) 꿀벌이 없다면 우리는 과일과 채소를 기를 수 없을 것이다.","ev":"8번 문장","s":[[8,"Without them, we wouldn’t be able to grow fruits and vegetables!","꿀벌이 없다면, 우리는 과일과 채소를 기를 수 없을 것이다!"]],"w":"Without them은 ‘꿀벌이 없다면’이고 wouldn’t be able to grow는 ‘기를 수 없을 것이다’예요. 7번에서 꿀벌이 식량 작물의 70퍼센트를 수분시키기 때문이에요.","c":4},"h":"8102873d22"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["꿀벌은 우리의 주요 식량 작물의 70퍼센트를 수분시킨다.","일벌은 꽃을 찾은 뒤 벌집으로 돌아온다.","그 문제가 2006년에 처음 보고된 뒤에 80만 개가 넘는 군집이 사라졌다.","연구원들은 꿀벌이 사라지는 한 가지 분명한 원인을 찾았다."],"opts":["Honey bees pollinate 70% of our main food crops.","Worker bees return to their hive after searching for flowers.","Over 800,000 colonies died out after the problem was first reported in 2006.","Researchers have found one clear cause of the disappearing bees."],"r":{"a":"1) Honey bees pollinate 70% of our main food crops.","ev":"7번 문장","s":[[7,"As a matter of fact, honey bees pollinate 70% of our main food crops, including most fruits and vegetables.","실제로, 꿀벌은 대부분의 과일과 채소를 포함하여 주요 식량 작물의 70퍼센트를 수분시킨다."]],"w":"7번 문장에서 꿀벌은 주요 식량 작물의 70퍼센트를 수분시킨다고 해요. 일벌은 돌아오지 않고(2번), 80만 개가 넘는 군집은 처음 보고되었을 때 이미 사라진 상태였고(5번), 원인에 대한 이론은 수없이 많아요(9번).","c":1},"h":"a7b6f43db4"},{"n":9,"t":"sum","q":"Worker bees (A) their hive and never return, so the remaining bees starve and the whole colony (B).","ko":"일벌이 벌집을 (A)하고 돌아오지 않아서, 남은 벌들은 굶어 죽고 군집 전체가 (B).","oko":["(A) 떠나 / (B) 자란다","(A) 들어가 / (B) 붕괴된다","(A) 짓고 / (B) 자란다","(A) 들어가 / (B) 자란다","(A) 떠나 / (B) 붕괴된다"],"opts":["(A) leave / (B) grows","(A) enter / (B) collapses","(A) build / (B) grows","(A) enter / (B) grows","(A) leave / (B) collapses"],"r":{"a":"5) (A) leave / (B) collapses","ev":"2~4번 문장","s":[[2,"Tens of thousands of worker bees leave their hive to search for flowers but never return.","수만 마리의 일벌이 꽃을 찾기 위해 벌집을 떠나지만, 다시 돌아오지 않는다."],[3,"The remaining bees, including the queen and the young bees, starve to death.","여왕벌과 어린 벌을 포함하여, 남아 있는 벌은 굶어 죽는다."],[4,"Eventually, the entire honey bee colony collapses.","결국, 꿀벌 군집 전체가 붕괴된다."]],"w":"2번에서 일벌이 벌집을 떠나(leave) 돌아오지 않고, 3번에서 남은 벌이 굶어 죽으며, 4번에서 군집 전체가 붕괴돼요(collapses).","c":5},"h":"db438cf61c"},{"n":10,"t":"fill","q":"Electronic signals [A] the bees’ sense of direction, so the bees have [B] finding their way home.","ko":"전자 신호가 벌의 방향 감각을 [A]해서, 벌은 집으로 가는 길을 찾는 데 [B]을 겪는다.","bank":["disrupt","difficulty","pollinate","collapse","hive","crops"],"bko":{"disrupt":"방해하다","difficulty":"어려움","pollinate":"수분시키다","collapse":"붕괴되다","hive":"벌집","crops":"작물들"},"r":{"a":"[A] disrupt, [B] difficulty","ev":"11~12번 문장","s":[[11,"Some researchers also blame electronic signals from mobile phones.","몇몇 연구원들은 휴대폰의 전자 신호를 탓하기도 한다."],[12,"They disrupt the bees’ sense of direction, so the bees have difficulty finding their way home.","그것이 벌의 방향 감각을 방해해서, 벌은 집으로 가는 길을 찾는 데 어려움을 겪는다."]],"w":"12번 문장 They disrupt the bees’ sense of direction, so the bees have difficulty finding their way home에서 가져왔어요. pollinate, collapse는 방향 감각을 방해한다는 뜻이 아니고, hive와 crops는 명사라 동사 자리에 맞지 않아요.","c":null},"h":"6206298551"}]},{"u":10,"id":"hk4-10-3","no":3,"ko":"이 검은색은 ‘찐’이야\b","items":[{"n":1,"t":"tf","q":"Vantablack absorbs 90% of light.","ko":"반타블랙은 빛의 90퍼센트를 흡수한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"For example, a color called Vantablack absorbs up to 99.965% of light.","예를 들어, 반타블랙이라고 불리는 색은 빛의 99.965퍼센트까지 흡수한다."]],"w":"7번 문장에서 반타블랙은 빛의 99.965퍼센트까지 흡수한다고 해요. 90퍼센트는 평범한 검은색이에요(5번).","c":"F"},"h":"4fa5aedaaa"},{"n":2,"t":"tf","q":"Newly developed black materials look darker because they take in more light.","ko":"새롭게 개발된 검은색 물질은 더 많은 빛을 흡수하기 때문에 더 어둡게 보인다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"But newly developed black materials can take in more light, so they look darker.","하지만 새롭게 개발된 검은색 물질들은 더 많은 빛을 흡수할 수 있어서, 더 어둡게 보인다."]],"w":"6번 문장에서 새 검은색 물질은 더 많은 빛을 흡수할 수 있어서 더 어둡게 보인다고 해요.","c":"T"},"h":"f70e18f67b"},{"n":3,"t":"tf","q":"The new black colors can be used only for space telescopes.","ko":"새로운 검은색은 우주 망원경에만 쓰일 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11, 14번 문장","s":[[11,"These new black colors can be used for different purposes.","이러한 새로운 검은색은 다양한 용도로 쓰일 수 있다."],[14,"Also, they can be used on sculptures to create wonderful pieces of art and on clothes to make unique designs.","또한, 그것들은 훌륭한 예술 작품들을 만들기 위해 조각상에 그리고 독특한 디자인을 만들기 위해 옷에 쓰일 수 있다."]],"w":"11번에서 다양한 용도로 쓰일 수 있다고 하고, 14번에서 조각상과 옷에도 쓸 수 있다고 해요. 우주 망원경에만 쓰인다는 말은 틀려요.","c":"F"},"h":"7546cbba7d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A color called Vantablack absorbs up to 99.965% of light.)","ko":"반타블랙이라고 불리는 색은 빛의 99.965퍼센트까지 ( ).","opts":["반사한다","흡수한다","만든다","숨긴다"],"word":"absorbs","r":{"a":"2) 흡수한다","ev":"4, 7번 문장","s":[[4,"The darkness of a color depends on how much visible light is absorbed by it.","색의 어두움은 얼마나 많은 가시광선이 그것에 의해 흡수되는지에 달려 있다."],[7,"For example, a color called Vantablack absorbs up to 99.965% of light.","예를 들어, 반타블랙이라고 불리는 색은 빛의 99.965퍼센트까지 흡수한다."]],"w":"4번에서 색의 어두움은 빛이 얼마나 많이 흡수되는지에 달려 있다고 했어요. 반타블랙이 아주 어두운 이유는 빛을 99.965퍼센트까지 ‘흡수하기’ 때문이에요.","c":2},"h":"89ff43c018"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, they can be used on sculptures to create wonderful pieces of art and on clothes to make unique designs.)","ko":"또한, 그것들은 훌륭한 예술 작품들을 만들기 위해 조각상에 그리고 ( ) 디자인을 만들기 위해 옷에 쓰일 수 있다.","opts":["독특한","흔한","낡은","값싼"],"word":"unique","r":{"a":"1) 독특한","ev":"14번 문장","s":[[14,"Also, they can be used on sculptures to create wonderful pieces of art and on clothes to make unique designs.","또한, 그것들은 훌륭한 예술 작품들을 만들기 위해 조각상에 그리고 독특한 디자인을 만들기 위해 옷에 쓰일 수 있다."]],"w":"새 검은색을 옷에 쓰면 다른 옷과 다른, 나만의 디자인을 만들 수 있다는 흐름이에요. unique = 독특한.","c":1},"h":"627dda3ae4"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen a sparkling diamond was coated with this material, it seemed to become invisible!","ko":"밑줄 친 it이 가리키는 것은?","sko":"반짝이는 다이아몬드가 이 물질로 칠해졌을 때, 그것은 눈에 보이지 않게 된 것처럼 보였다!","opts":["이 검은색 물질","우주 망원경","반짝이는 다이아몬드","평범한 검은색 물감"],"r":{"a":"3) 반짝이는 다이아몬드","ev":"10번 문장","s":[[10,"When a sparkling diamond was coated with this material, it seemed to become invisible!","반짝이는 다이아몬드가 이 물질로 칠해졌을 때, 그것은 눈에 보이지 않게 된 것처럼 보였다!"]],"w":"물질로 칠해진 것은 다이아몬드이고, 칠해진 뒤 보이지 않게 된 것처럼 보인 것도 그 다이아몬드예요. it은 a sparkling diamond를 가리켜요.","c":3},"h":"ef0d9f4ea1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The darkness of a color depends on how much visible light is absorbed by it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"색의 어두움은 얼마나 많은 가시광선이 그것에 의해 흡수되는지에 달려 있다.","opts":["색이 얼마나 어두운지는 그 색이 가시광선을 얼마나 많이 흡수하느냐에 달려 있다.","색이 얼마나 어두운지는 그 색의 이름에 달려 있다.","가시광선이 많이 흡수될수록 색은 더 밝아진다.","색이 어두울수록 가시광선을 더 많이 반사한다."],"r":{"a":"1) 색이 얼마나 어두운지는 그 색이 가시광선을 얼마나 많이 흡수하느냐에 달려 있다.","ev":"4번 문장","s":[[4,"The darkness of a color depends on how much visible light is absorbed by it.","색의 어두움은 얼마나 많은 가시광선이 그것에 의해 흡수되는지에 달려 있다."]],"w":"depend on은 ‘~에 달려 있다’이고 absorbed by it은 ‘그 색에 의해 흡수되는’이에요. 빛을 많이 흡수할수록 어두워진다는 뜻이에요.","c":1},"h":"577087dbd8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["평범한 검은색 물감은 빛의 99.995퍼센트를 흡수한다.","MIT 물질로 칠해진 반짝이는 다이아몬드는 눈에 보이지 않게 된 것처럼 보였다.","반타블랙은 MIT 물질보다 10배 더 어둡다.","새로운 검은색은 옷에 쓸 수 없다."],"opts":["Normal black paint takes in 99.995% of light.","A sparkling diamond coated with the MIT material seemed to become invisible.","Vantablack is 10 times darker than the MIT material.","The new black colors cannot be used on clothes."],"r":{"a":"2) A sparkling diamond coated with the MIT material seemed to become invisible.","ev":"8, 10번 문장","s":[[8,"In 2019, MIT engineers created a black material that can capture 99.995% of light.","2019년에, MIT 공학자들은 빛의 99.995퍼센트를 담을 수 있는 검은색 물질을 만들어냈다."],[10,"When a sparkling diamond was coated with this material, it seemed to become invisible!","반짝이는 다이아몬드가 이 물질로 칠해졌을 때, 그것은 눈에 보이지 않게 된 것처럼 보였다!"]],"w":"8번의 MIT 물질을 10번에서 다이아몬드에 칠하니 눈에 보이지 않게 된 것처럼 보였어요. 99.995%는 MIT 물질이고(8번), 10배 더 어두운 쪽도 MIT 물질이며(9번), 옷에도 쓸 수 있어요(14번).","c":2},"h":"e081b34ad4"},{"n":9,"t":"sum","q":"The more visible light a color (A), the (B) it looks. Normal black paint takes in about 90% of light, but newly developed black materials take in more.","ko":"색이 가시광선을 더 많이 (A)수록 더 (B) 보인다. 평범한 검은색 물감은 빛의 약 90퍼센트를 흡수하지만, 새롭게 개발된 검은색 물질은 더 많이 흡수한다.","oko":["(A) 흡수할 / (B) 어둡게","(A) 흡수할 / (B) 밝게","(A) 잃을 / (B) 밝게","(A) 만들 / (B) 밝게","(A) 만들 / (B) 어둡게"],"opts":["(A) absorbs / (B) darker","(A) absorbs / (B) brighter","(A) loses / (B) brighter","(A) creates / (B) brighter","(A) creates / (B) darker"],"r":{"a":"1) (A) absorbs / (B) darker","ev":"4~6번 문장","s":[[4,"The darkness of a color depends on how much visible light is absorbed by it.","색의 어두움은 얼마나 많은 가시광선이 그것에 의해 흡수되는지에 달려 있다."],[5,"Normal black paint takes in about 90% of light.","평범한 검은색은 빛의 약 90퍼센트를 흡수한다."],[6,"But newly developed black materials can take in more light, so they look darker.","하지만 새롭게 개발된 검은색 물질들은 더 많은 빛을 흡수할 수 있어서, 더 어둡게 보인다."]],"w":"4번에서 색의 어두움은 빛이 얼마나 많이 흡수되는지에 달려 있다고 했고, 5~6번에서 새 검은색은 더 많은 빛을 흡수해서 더 어둡게 보인다고 해요.","c":1},"h":"679aa6fdc4"},{"n":
