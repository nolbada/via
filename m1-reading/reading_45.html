<style>

.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"Amelia are from London. Last week, she goed to Sokcho with Subin's family.","ko":"Amelia는 런던 출신이다. 지난주에, 그녀는 수빈이의 가족과 함께 속초에 갔다.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[1],"point":"be동사의 수일치: 주어 Amelia(3인칭 단수)는 is (are 아님)","topic":"be동사의 수일치","memo":"주어 Amelia(3인칭 단수)는 is (are 아님)"},{"wrong":"goed","right":"went","partial":false,"at":[7],"point":"불규칙 과거형: go의 과거형은 went","topic":"불규칙 과거형","memo":"go의 과거형은 went"}]},{"n":2,"tag":null,"en":"Here is Amelia's travel diary.","ko":"이것은 Amelia의 여행기이다.","ok":true,"foot":[],"fixes":[]},{"n":3,"tag":"Amelia · 9월 5일","en":"It was sunnily today. Subin's family and me hiked Seoraksan and saw an very big rock.","ko":"오늘은 날씨가 화창했다. 수빈이의 가족과 나는 설악산을 등산했고 아주 큰 바위를 보았다.","ok":false,"foot":[],"fixes":[{"wrong":"sunnily","right":"sunny","partial":false,"at":[2],"point":"형용사와 부사: be동사 뒤 보어는 형용사 sunny 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어는 형용사 sunny 사용"},{"wrong":"me","right":"I","partial":false,"at":[7],"point":"인칭대명사의 주격: 주어 자리에는 주격 I 사용","topic":"인칭대명사의 주격","memo":"주어 자리에는 주격 I 사용"},{"wrong":"an","right":"a","partial":false,"at":[12],"point":"관사 a/an: 자음 소리 v 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 v 앞에는 a 사용"}]},{"n":4,"tag":null,"en":"It was Heundeulbawi. Subin and I pushed it.","ko":"그것은 흔들바위였다. 수빈이와 나는 그것을 밀었다.","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":null,"en":"The rock shook a few. It was scary, but I had a lot of funs!","ko":"그 바위는 조금 흔들렸다. 그것은 무서웠지만, 나는 정말 즐거웠다!","ok":false,"foot":[],"fixes":[{"wrong":"few","right":"little","partial":false,"at":[4],"point":"수량 형용사 a little/a few: 셀 수 없는 동작 정도는 a little 사용","topic":"수량 형용사 a little/a few","memo":"셀 수 없는 동작 정도는 a little 사용"},{"wrong":"funs","right":"fun","partial":false,"at":[14],"point":"셀 수 없는 명사: fun은 셀 수 없는 명사라 복수형 없음","topic":"셀 수 없는 명사","memo":"fun은 셀 수 없는 명사라 복수형 없음"}]},{"n":6,"tag":null,"en":"Next, we went at Sokcho Beach. We puts up two tents near the beach.","ko":"그다음에, 우리는 속초 해수욕장으로 갔다. 우리 morrow.","Saturday, September 6th","We woke up very early. It was dark outside. Subin and I ran to the beach. Slowly, the sky turned red. Subin said, \"The sun is rising. Make a wish!\" I closed my eyes and made a wish.","For lunch, we ate gamjajeon. It was like a pancake. I loved it. After lunch, we visited Sokcho Lighthouse Observatory. We walked up many steep stairs. Our legs were tired. But at the top, the view was beautiful. We saw the city, the ocean, and the mountains. Subin said, \"This lighthouse is about 70 years old. It still shines its light for ships at night.\" I said, \"Wow, that's amazing!\"","Every moment of this trip was wonderful. I took many pictures. I will always remember Korea."];var PASS_KO=["속초에서의 즐거움!","Amelia는 런던 출신이다. 지난주에, 그녀는 수빈이의 가족과 함께 속초에 갔다. 이것은 Amelia의 여행기이다.","9월 5일, 금요일","오늘은 날씨가 화창했다. 수빈이의 가족과 나는 설악산을 등산했고 아주 큰 바위를 보았다. 그것은 흔들바위였다. 수빈이와 나는 그것을 밀었다. 그 바위는 조금 흔들렸다. 그것은 무서웠지만, 나는 정말 즐거웠다!","그다음에, 우리는 속초 해수욕장으로 갔다. 우리는 해변 근처에 두 개의 텐트를 쳤다. 우리는 저녁 식사로 한우를 먹었다. 그것은 맛있었다! 우리 텐트 안에서, 수빈이와 나는 파도 소리를 들었다. 우리는 많이 이야기하고 웃었다. 나는 내일 해돋이를 정말 보고 싶다.","9월 6일, 토요일","우리는 아주 일찍 일어났다. 밖은 어두웠다. 수빈이와 나는 해변으로 달려갔다. 천천히, 하늘이 붉게 변했다. 수빈이가 \"해가 떠오르고 있어. 소원을 빌어!\"라고 말했다. 나는 눈을 감고 소원을 빌었다.","점심 식사로, 우리는 감자전을 먹었다. 그것은 팬케이크 같았다. 난 그것이 정말 좋았다. 점심 식사 후에, 우리는 속초 등대 전망대에 방문했다. 우리는 많은 가파른 계단을 걸어 올라갔다. 우리의 다리는 피곤했다. 하지만 꼭대기에서, 경치가 아름다웠다. 우리는 그 도시와 바다, 그리고 산들을 보았다. 수빈이는 \"이 등대는 약 70년이 되었어. 이것은 아직 밤에 선박들을 위해 빛을 비춰.\"라고 말했다. 나는 \"와, 그거 놀랍네!\"라고 말했다.","이 여행의 모든 순간이 훌륭했다. 나는 많은 사진을 찍었다. 나는 언제나 한국을 기억할 것이다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["취미 활동","방과 후 활동","장래 희망","주말 계획","등산을 다룬 책"],"a":3,"ans":"주말 계획","evs":[["B: That's great! What are you going to do this weekend, Sumin?","잘됐다! 수민아, 이번 주말에 뭐 할 거야?"],["G: I'm going to go hiking with my family.","나는 가족과 함께 등산을 갈 거야."]],"ev":["B: That's great! What are you going to do this weekend, Sumin?","잘됐다! 수민아, 이번 주말에 뭐 할 거야?"],"ow":["오답 ✕ — 대화에는 'I'm going to read some books.'(나는 책을 좀 읽을 거야.)처럼 앞으로 할 일이 나오지만, 평 ,"잘됐다! 수민아, 이번 주말에 뭐 할 거야?"],["G","I'm going to go hiking with my family.","나는 가족과 함께 등산을 갈 거야."],["B","That's wonderful!","멋지다!"],["G","Yes. We're going to hike Sobaeksan. What are you going to do, Oliver?","응. 우리는 소백산을 등산할 거야. 올리버, 너는 뭐 할 거야?"],["B","I'm going to read some books.","나는 책을 좀 읽을 거야."],["G","That sounds good. Have a nice weekend.","좋겠다. 즐거운 주말 보내."],["B","Thanks. You, too.","고마워. 너도."]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하는 것은?","o":["Kate와 Andy는 버스로 여행을 떠날 것이다.","Kate와 Andy는 여행 계획을 짜지 않았다.","길거리 음식을 먹고서 남산 서울 타워에 갈 예정이다.","Kate와 Andy는 주말에 서울을 여행할 것이다.","여행 내내 날씨가 좋지 않을 것이다."],"a":3,"ans":"Kate와 Andy는 주말에 서울을 여행할 것이다.","evs":[["Kate: Look! Here are our train tickets to Seoul!","봐! 여기 서울행 기차표가 있어!"],["Kate: On Saturday, we're going to go to Namsan Seoul Tower.","토요일에는 남산 서울 타워에 갈 거야."],["Andy: Great! It's going to be sunny and warm on Sunday.","좋아! 일요일에는 화창하고 따뜻할 거래."]],"ev":["Kate: Look! Here are our train tickets to Seoul!","봐! 여기 서울행 기차표가 있어!"],"ow":["오답 ✕ — 'Here are our train tickets to Seoul!'(여기 서울행 기차표가 있어!)라고 했으므로 버스가 아니라 기차로 간다. 틀림.","오답 ✕ — 'What are the plans for our family trip?'(우리 가족 여행 계획이 어떻게 돼?)에 케이트가 계획을 줄줄 말하므로 계획이 있다. 틀림.","오답 ✕ — 'On Saturday, we're going to go to Namsan Seoul Tower.' 다음에 'After that, we're going to try some street food.'(그다음에는 길거리 음식을 먹어 볼 거야.)라고 했으므로 순서가 반대라서 틀림.","정답 ○ — 서울행 기차표가 있고 'On Saturday'(토요일)와 'on Sunday'(일요일)의 계획을 말하므로 주말에 서울을 여행할 것이 맞음.","오답 ✕ — 'It's going to be sunny and warm on Sunday.'(일요일에는 화창하고 따뜻할 거래.)라고 했으므로 날씨가 좋지 않다는 보기는 틀림."],"memo":["정답 ④: 케이트와 앤디는 주말에 서울을 여행할 것이다.","근거: On Saturday, we're going to go to Namsan Seoul Tower.(토요일에는 남산 서울 타워에 갈 거야.)","함정: ③ 남산 서울 타워가 먼저, 길거리 음식이 그다음이다. ✕"],"why":"케이트와 앤디는 기차를 타고 서울에서 토요일과 일요일 여행을 한다."},{"n":4,"q":"What are Kate and Andy going to do on Sunday?","o":["They are going to go to Namsan Seoul Tower.","They are going to try some street food.","They are going to go to an amusement park.","They are going to take a train to Seoul.","They are going to stay home with Mom."],"a":2,"ans":"They are going to go to an amusement park.","evs":[["Andy: I can't wait! What are we going to do on Sunday?","너무 기대돼! 일요일에는 뭐 할 거야?"],["Kate: We're going to go to an amusement park.","우리는 놀이공원에 갈 거야."]],"ev":["Andy: I can't wait! What are we going to do on Sunday?","너무 기대돼! 일요일에는 뭐 할 거야?"],"ow":["오답 ✕ — 'On Saturday, we're going to go to Namsan Seoul Tower.'(토요일에는 남산 서울 타워에 갈 거야.)라고 했으므로 남산 서울 타워는 일요일이 아니라 토요일 일정이라 틀림.","오답 ✕ — 'After that, we're going to try some street food.'(그다음에는 길거리 음식을 먹어 볼 거야.)는 토요일 남산 서울 타워 다음 일정이라 틀림.","정답 ○ — 앤디가 'What are we going to do on Sunday?'(일요일에는 뭐 할 거야?)라고 묻자 케이트가 'We're going to go to an amusement park.'(우리는 놀이공원에 갈 거야.)라고 답했으므로 맞음.","오답 ✕ — 'Here are our train tickets to Seoul!'(여기 서울행 기차표가 있어!)에서 기차를 타는 것은 서울로 가는 이동이지, 일요일에 할 일로 말한 것이 아니라서 틀림.","오답 ✕ — 'We're going to have a great time.'(우리는 즐거운 시간을 보낼 거야.)이라고 했고 집에 머문다는 말은 없어서 틀림."],"memo":["정답 ③: 일요일에는 놀이공원에 간다.","근거: We're going to go to an amusement park.(우리는 놀이공원에 갈 거야.)","함정: ①②는 토요일 일정이다. ✕"],"why":"일요일 계획은 놀이공원에 가는 것이다."}],"dlg":[["Kate","Look! Here are our train tickets to Seoul!","봐! 여기 서울행 기차표가 있어!"],["Andy","Oh, yeah! What are the plans for our family trip?","아, 맞다! 우리 가족 여행 계획이 어떻게 돼?"],["Kate","On Saturday, we're going to go to Namsan Seoul Tower.","토요일에는 남산 서울 타워에 갈 거야."],["Andy","Mom really wanted to go there.","엄마가 정말 거기 가고 싶어 하셨어."],["Kate","After that, we're going to try some street food.","그다음에는 길거리 음식을 먹어 볼 거야."],["Andy","I can't wait! What are we going to do on Sunday?","너무 기대돼! 일요일에는 뭐 할 거야?"],["Kate","We're going to go to an amusement park.","우리는 놀이공원에 갈 거야."],["Andy","Great! It's going to be sunny and warm on Sunday.","좋아! 일요일에는 화창하고 따뜻할 거래."],["Kate","We're going to have a great time.","우리는 즐거운 시간을 보낼 거야."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["지호는 방과 후에 자전거를 탈 것이다.","지호는 방과 후에 강아지를 산책시킬 것이다.","여자아이는 방과 후에 강아지를 산책시킬 것이다.","두 사람은 방과 후에 함께 자전거를 탈 것이다.","지호는 방과 후에 집에서 쉴 것이다."],"a":1,"ans":"지호는 방과 후에 강아지를 산책시킬 것이다.","evs":[["B: I'm going to walk my dog. How about you?","나는 우리 강아지를 산책시킬 거야. 너는 어때?"],["G: I'm going to ride my bike.","나는 자전거를 탈 거야."]],"ev":["B: I'm going to walk my dog. How about you?","나는 우리 강아지를 산책시킬 거야. 너는 어때?"],"ow":["오답 ✕ — 'I'm going to ride my bike.'(나는 자전거를 탈 거야.)는 지호가 아니라 여자아이의 말이다. 지호는 강아지를 산책시킨다. 틀림.","정답 ○ — 지호가 'I'm going to walk my dog.'(나는 우리 강아지를 산책시킬 거야.)라고 했으므로 맞음.","오답 ✕ — 여자아이는 'I'm going to ride my bike.'(나는 자전거를 탈 거야.)라고 했으므로 자전거를 탄다. 강아지를 산책시키는 사람은 지호라서 틀림.","오답 ✕ — 지호는 'walk my dog'(강아지 산책), 여자아이는 'ride my bike'(자전거 타기)라고 해서 서로 다른 일을 하므로 틀림.","오답 ✕ — 지호는 'I'm going to walk my dog.'(강아지를 산책시킬 거야.)라고 했고 집에서 쉰다는 말은 없어서 틀림."],"memo":["정답 ②: 지호는 방과 후에 강아지를 산책시킬 것이다.","근거: I'm going to walk my dog.(나는 우리 강아지를 산책시킬 거야.)","함정: 자전거는 지호가 아니라 여자아이의 계획 ✕"],"why":"지호는 강아지를 산책시키고, 여자아이는 자전거를 탄다."}],"dlg":[["G","Jiho, what are you going to do after school today?","지호야, 오늘 방과 후에 뭐 할 거니?"],["B","I'm going to walk my dog. How about you?","나는 우리 강아지를 산책시킬 거야. 너는 어때?"],["G","I'm going to ride my bike.","나는 자전거를 탈 거야."]]}];var BG=[{"qs":[{"n":6,"q":"윗글을 읽고 흔들바위에 대해 알 수 있는 것은?","o":["얽힌 전설","이름의 유래","위치한 산","바위의 무게","표면의 색깔"],"a":2,"ans":"위치한 산","evs":[["Subin's family and I hiked Seoraksan and saw a very big rock.","수빈이의 가족과 나는 설악산을 등산했고 아주 큰 바위를 보았다."],["It was Heundeulbawi.","그것은 흔들바위였다."]],"ev":["Subin's family and I hiked Seoraksan and saw a very big rock.","수빈이의 가족과 나는 설악산을 등산했고 아주 큰 바위를 보았다."],"ow":["오답 ✕ — 본문에는 'It was Heundeulbawi.'(그것은 흔들바위였다.)라고만 나오고 흔들바위에 얽힌 전설은 언급되지 않아 알 수 없음.","오답 ✕ — 'The rock shook a little.'(그 바위는 조금 흔들렸다.)은 직접 밀어 본 경험일 뿐, 이름의 유래를 설명한 것이 아니라서 알 수 없음.","정답 ○ — \"Subin's family and I hiked Seoraksan and saw a very big rock. It was Heundeulbawi.\"에서 흔들바위가 설악산에 있음을 알 수 있음.","오답 ✕ — 'a very big rock'(아주 큰 바위)이라며 크기만 말했고 무게에 대한 언급은 없어서 알 수 없음.","오답 ✕ — 바위의 표면 색깔에 대한 설명은 본문에 없다. 'a very big rock'은 크기만 말하고 있어 알 수 없음."],"memo":["정답 ③: 흔들바위가 있는 산은 설악산이다.","근거: Subin's family and I hiked Seoraksan and saw a very big rock.(설악산을 등산했고 아주 큰 바 t of fun!(무서웠지만, 나는 정말 즐거웠다!)","함정: ① 설악산·② 해돋이는 글의 일부일 뿐이라 너무 좁다. ✕"],"why":"금요일의 등산과 해변 캠핑은 자연 속에서의 즐거운 경험이다."}],"pp":[["Friday, September 5th","9월 5일, 금요일"],["It was sunny today.","오늘은 날씨가 화창했다."],["Subin's family and I hiked Seoraksan and saw a very big rock.","수빈이의 가족과 나는 설악산을 등산했고 아주 큰 바위를 보았다."],["It was Heundeulbawi.","그것은 흔들바위였다."],["Subin and I pushed it.","수빈이와 나는 그것을 밀었다."],["The rock shook a little.","그 바위는 조금 흔들렸다."],["It was scary, but I had a lot of fun!","그것은 무서웠지만, 나는 정말 즐거웠다!"],["Next, we went to Sokcho Beach.","그다음에, 우리는 속초 해수욕장으로 갔다."],["We put up two tents near the beach.","우리는 해변 근처에 두 개의 텐트를 쳤다."],["We had Korean beef for dinner.","우리는 저녁 식사로 한우를 먹었다."],["It was delicious!","그것은 맛있었다!"],["In our tent, Subin and I heard the waves.","우리 텐트 안에서, 수빈이와 나는 파도 소리를 들었다."],["We talked and laughed a lot.","우리는 많이 이야기하고 웃었다."],["I really want to see the sunrise tomorrow.","나는 내일 해돋이를 정말 보고 싶다."]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["필자는 속초 등대 전망대에 가기 전에 감자전을 먹지 않았다.","계단을 올라간 뒤에도 필자의 다리는 전혀 피곤하지 않았다.","수빈이는 속초 등대가 약 70년 되었다고 말했다.","속초 등대는 낮에만 배를 위해 빛을 비춘다.","필자는 여행 중에 사진을 한 장도 찍지 않았다."],"a":2,"ans":"수빈이는 속초 등대가 약 70년 되었다고 말했다.","evs":[["Subin said, \"This lighthouse is about 70 years old.","수빈이는 \"이 등대는 약 70년이 되었어."]],"ev":["Subin said, \"This lighthouse is about 70 years old.","수빈이는 \"이 등대는 약 70년이 되었어."],"ow":["오답 ✕ — 'For lunch, we ate gamjajeon.'(점심 식사로, 우리는 감자전을 먹었다.)이고 'After lunch, we visited Sokcho Lighthouse Observatory.'(점심 식사 후에 속초 등대 전망대에 방문했다.)이므로 등대 전에 감자전을 먹었다.","오답 ✕ — 'Our legs were tired.'(우리의 다리는 피곤했다.)라고 했으므로 전혀 피곤하지 않았다는 말은 틀림.","정답 ○ — 'Subin said, \"This lighthouse is about 70 years old.'(수빈이는 \"이 등대는 약 70년이 되었어.\"라고 말했다.)이므로 맞다.","오답 ✕ — 'It still shines its light for ships at night.'(이것은 아직 밤에 선박들을 위해 빛을 비춰.)라고 했으므로 밤에 빛을 비춘다.","오답 ✕ — 'I took many pictures.'(나는 많은 사진을 찍었다.)라고 했으므로 한 장도 안 찍었다는 말은 틀림."],"memo":["정답 ③: 수빈이는 속초 등대가 약 70년 되었다고 말했다.","근거: This lighthouse is about 70 years old.(이 등대는 약 70년이 되었어.)","함정: ④ 등대는 '밤에
