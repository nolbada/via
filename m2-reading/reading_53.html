false,"at":[8],"point":"현재완료: put의 과거분사는 put: has put (putted 아님)","topic":"현재완료","memo":"put의 과거분사는 put: has put (putted 아님)"}]},{"n":13,"tag":null,"en":"We also taked some healthy baby corals from the sea and put them in tanks of seawater.","ko":"우리는 또한 바다에서 건강한 아기 산호들을 가져와 바닷물 수조에 넣었다.","ok":false,"foot":[],"fixes":[{"wrong":"taked","right":"took","partial":false,"at":[2],"point":"불규칙 과거형: take의 과거형은 took (taked 아님)","topic":"불규칙 과거형","memo":"take의 과거형은 took (taked 아님)"}]},{"n":14,"tag":null,"en":"We feed them clam parts and seaweed smoothies. This food helps baby corals grow more strong.","ko":"우리는 그것들에게 조개 부스러기와 해조류 스무디를 먹였다. 이 음식은 아기 산호들이 더 강하게 자라도록 돕는다.","ok":false,"foot":[],"fixes":[{"wrong":"more strong","right":"stronger","partial":false,"at":[14],"point":"비교급: 짧은 형용사는 -er: stronger","topic":"비교급","memo":"짧은 형용사는 -er: stronger"}]},{"n":15,"tag":null,"en":"When they are ready, we'll plant them onto the corals in the sea. Our goal is to growing many healthy corals.","ko":"아기 산호들이 준비되면, 우리는 그것들을 바다의 산호에 심을 것이다. 우리의 목표는 많은 건강한 산호들을 키우는 것이다.","ok":false,"foot":[],"fixes":[{"wrong":"growing","right":"grow","partial":false,"at":[17],"point":"to부정사: is to 뒤에는 동사원형: grow (growing 아님)","topic":"to부정사","memo":"is to 뒤에는 동사원형: grow (growing 아님)"}]},{"n":16,"tag":null,"en":"I look forward to see the results!","ko":"나는 결과를 볼 것을 기대한다!","ok":false,"foot":[],"fixes":[{"wrong":"see","right":"seeing","partial":false,"at":[4],"point":"동명사: look forward to 뒤에는 동명사: seeing (see 아님)","topic":"동명사","memo":"look forward to 뒤에는 동명사: seeing (see 아님)"}]},{"n":17,"tag":null,"en":"Date &amp; Time: November 27, 11:30 a.m.","ko":"날짜 및 시간: 11월 27일, 오전 11시 30분","ok":true,"foot":[],"fixes":[]},{"n":18,"tag":null,"en":"Last night, some healthily corals in the sea laid eggs during the full moon.","ko":"어젯밤, 바다의 일부 건강한 산호들이 보름달이 뜬 동안 알들을 낳았다.","ok":false,"foot":[],"fixes":[{"wrong":"healthily","right":"healthy","partial":false,"at":[3],"point":"형용사와 부사: 명사 corals를 꾸미는 형용사 healthy 사용","topic":" work.","비록 병든 산호들을 치료하고 건강한 산호들을 키우는 데 시간이 걸렸지만, 그 노력은 가치 있었다.",0]];var RNUM=53;var TITLE_EN="Living with Corals Again - A Diver's Diary";var PASS_EN=["Living with Corals Again - A Diver's Diary","Date &amp; Time: September 15, 5:30 p.m.","It's a sad day for me. This morning, I went scuba diving at my favorite spot in the sea. It was a place that was full of beautiful and colorful corals. But today, I saw that corals were getting sick. I was shocked. Because of the warm seawater, corals have turned white. Different types of waste have harmed the corals, too. Now the spot has lost its colors and beauty. I'm really worried.","Date &amp; Time: October 2, 10:00 a.m.","I have thought about how to help corals. My plan is to form a team of divers. My team can go underwater and take care of the sick corals. Many corals get sick because they don't get good care in time. I'm sure that other divers are worried about this, too. I'm going to post a message online to look for volunteer divers.","Date &amp; Time: November 7, 9:40 p.m.","For the last two weeks, my team has put ointment on sick corals. We also took some healthy baby corals from the sea and put them in tanks of seawater. We feed them clam parts and seaweed smoothies. This food helps baby corals grow stronger. When they are ready, we'll plant them onto the corals in the sea. Our goal is to grow many healthy corals. I look forward to seeing the results!","Date &amp; Time: November 27, 11:30 a.m.","Last night, some healthy corals in the sea laid eggs during the full moon. This morning, hundreds of baby corals were born from the eggs like magic. They were cute and amazing. I hope this miracle will happen to other sick corals, too. Although it took time to heal the sick corals and grow healthy ones, it was worth the hard work."];var PASS_KO=["산호와 다시 함께 살기 - 어느 잠수부의 일기","날짜 및 시간: 9월 15일, 오후 5시 30분","오늘은 내게 슬픈 날이다. 오늘 아침, 나는 바다에서 내가 가장 좋아하는 지점으로 스쿠버 다이빙을 갔다. 그곳은 아름답고 다채로운 산호들로 가득한 장소였다. 그런데 오늘, 나는 산호들이 병들어 가고 있는 것을 보았다. 나는 충격을 받았다. 따뜻한 바닷물 때문에 산호들이 흰색으로 변해버렸다. 여러 종류의 쓰레기도 산호에 해를 끼쳤다. 이제 그 지점은 색과 아름다움을 잃어버렸다. 나는 몹시 걱정이 된다.","날짜 및 시간: 10월 2일, 오전 10시","나는 산호를 돕는 방법에 대해 생각했다. 내 계획은 잠수부 팀을 만드는 것이다. 우리 팀은 바닷속으로 가서 병든 산호들을 돌볼 수 있다. 많은 산호들은 제때 좋은 치료를 받지 못하기 때문에 아프다. 나는 다른 잠수부들도 이것을 걱정하고 있다고 확신한다. 나는 자원봉사 잠수부를 찾기 위해 온라인에 메시지를 올릴 예정이다.","날짜 및 시간: 11월 7일, 오후 9시 40분","지난 두 주 동안, 우리 팀은 병든 산호에 연고를 발랐다. 우리는 또한 바다에서 건강한 아기 산호들을 가져와 바닷물 수조에 넣었다. 우리는 그것들에게 조개 부스러기와 해조류 스무디를 먹였다. 이 음식은 아기 산호들이 더 강하게 자라도록 돕는다. 아기 산호들이 준비되면, 우리는 그것들을 바다의 산호에 심을 것이다. 우리의 목표는 많은 건강한 산호들을 키우는 것이다. 나는 결과를 볼 것을 기대한다!","날짜 및 시간: 11월 27일, 오전 11시 30분","어젯밤, 바다의 일부 건강한 산호들이 보름달이 뜬 동안 알들을 낳았다. 오늘 아침, 그 알들에서 수백 마리의 아기 산호들이 마법처럼 태어났다. 그것들은 귀엽고 놀라웠다. 나는 이 기적이 다른 병든 산호들에게도 일어나기를 바란다. 비록 병든 산호들을 치료하고 건강한 산호들을 키우는 데 시간이 걸렸지만, 그 노력은 가치 있었다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["이메일의 환경 보호 효과","지구를 위한 이메일 정리","스팸과 광고 이메일 차단 설정","에너지를 절약하는 다양한 방법","지구를 지키기 위한 이메일 보내기"],"a":1,"ans":"지구를 위한 이메일 정리","evs":[["G: I'm deleting my emails.","내 이메일들을 지우고 있어."],["G: I heard that storing emails uses a lot of energy.","이메일을 저장하는 데 에너지가 많이 쓰인다고 들었거든."]],"ev":["G: I'm deleting my emails.","내 이메일들을 지우고 있어."],"ow":["오답 ✕ — 이메일이 환경을 보호한다는 말은 없다. 오히려 'storing emails uses a lot of energy'(이메일을 저장하면 에너지가 많이 쓰인다)며 지구에 나쁘다고 한다.","정답 ○ — 지나가 'I'm deleting my emails.'(내 이메일들을 지우고 있어.)라고 하며 'using too much energy is bad for the Earth'(에너지를 너무 많이 쓰는 건 지구에 나빠)라고 하므로 지구를 위해 이메일을 정리하는 것이 주제이다.","오답 ✕ — 'you should also block spam and ads'(스팸 메일과 광고 메일도 차단하는 게 좋아)는 마지막에 덧붙인 조언일 뿐이라서 주제로는 너무 좁다.","오답 ✕ — 에너지를 절약하는 방법은 이메일 지우기 하나만 나온다. '다양한 방법'이 나오지 않아서 틀림.","오답 ✕ — 이메일을 보내는 이야기는 없다. 지나는 이메일을 '지우고(deleting)' 있어서 틀림."],"memo":["정답 ②: 지구를 위한 이메일 정리","근거: I'm deleting my emails.(내 이메일들을 지우고 있어.) / using too much energy is bad for the Earth(에너지를 너무 많이 쓰는 건 지구에 나빠)","함정: ③ 스팸 차단은 마지막에 덧붙인 조언일 뿐이라서 ✕"],"why":"에너지를 아끼려고 이메일을 지우는 것이 지구를 위한 행동이라는 대화이다."}],"dlg":[["B","Hey, Jina. What are you doing?","안녕, 지나야. 뭐 하고 있어?"],["G","I'm deleting my emails.","내 이메일들을 지우고 있어."],["B","Why?","왜?"],["G","I heard that storing emails uses a lot of energy.","이메일을 저장하는 데 에너지가 많이 쓰인다고 들었거든."],["B","Really?","정말?"],["G","Yeah, using too much energy is bad for the Earth.","응, 에너지를 너무 많이 쓰는 건 지구에 나빠."],["B","Oh, I get it. I'll delete my emails, too.","아, 알겠다. 나도 내 이메일들을 지울게."],["G","And you should also block spam and ads.","그리고 스팸 메일과 광고 메일도 차단하는 게 좋아."]]},{"qs":[{"n":2,"q":"Why does Sumi use a hand towel?","o":["because it is cleaner","because it is a trend","because it protects the Earth","because it is more comfortable","because it helps to save money"],"a":2,"ans":"because it protects the Earth","evs":[["Sumi: Yeah, I heard that paper towels use a lot of trees.","응, 종이 타월을 만드는 데 나무가 많이 쓰인다고 들었어."],["Sumi: And trees make the Earth green.","그리고 나무는 지구를 푸르게 해 주잖아."]],"ev":["Sumi: Yeah, I heard that paper towels use a lot of trees.","응, 종이 타월을 만드는 데 나무가 많이 쓰인다고 들었어."],"ow":["오답 ✕ — 손수건이 더 깨끗하다는 말은 대화에 없다. 수미가 말한 이유는 종이 타월에 나무가 많이 쓰인다는 것이다.","오답 ✕ — 'I heard that paper towels use a lot of trees.'가 이유이고, 유행이라는 말은 대화에 나오지 않는다.","정답 ○ — 'paper towels use a lot of trees'(종이 타월에는 나무가 많이 쓰인다)와 'trees make the Earth green'(나무는 지구를 푸르게 해 준다)이라고 했으므로 지구를 지키기 위해서이다.","오답 ✕ — 손수건이 더 편하다는 말은 없다. 'And trees make the Earth green.'처럼 지구와 나무 이야기만 나온다.","오답 ✕ — 돈을 아낀다는 말은 없다. 대화에는 가격이나 돈에 대한 이야기가 전혀 없다."],"memo":["정답 ③: 수미는 지구를 지키기 위해 손수건을 쓴다.","근거: I heard that paper towels use a lot of trees.(종이 타월에는 나무가 많이 쓰인다고 들었어.)","함정: ⑤ 돈을 아끼려는 이유는 나오지 않아서 ✕"],"why":"종이 타월은 나무를 많이 쓰고, 나무는 지구를 푸르게 하므로 손수건을 쓴다."}],"dlg":[["Jina","Oh, you're using a hand towel.","오, 너 손수건을 쓰고 있구나."],["Sumi","Yeah, I heard that paper towels use a lot of trees.","응, 종이 타월을 만드는 데 나무가 많이 쓰인다고 들었어."],["Jina","That's right.","맞아."],["Sumi","And trees make the Earth green.","그리고 나무는 지구를 푸르게 해 주잖아."]]},{"qs":[{"n":3,"q":"What will the girl do for the Earth?","o":["She will eat more food.","She will stop eating snacks.","She will cook food by herself.","She will bring a proper amount of food.","She will not mix food waste with other trash."],"a":3,"ans":"She will bring a proper amount of food.","evs":[["B: Food waste makes greenhouse gases.","음식물 쓰레기는 온실가스를 만들어 내거든."],["G: Oh, I get it. I'll bring less food next time.","아, 알겠어. 다음에는 음식을 더 적게 가져올게."]],"ev":["B: Food waste makes greenhouse gases.","음식물 쓰레기는 온실가스를 만들어 내거든."],"ow":["오답 ✕ — 소녀는 'I can't finish this sandwich.'(샌드위치를 다 못 먹겠어.)라고 했고 'I'll bring less food next time.'(다음에는 음식을 더 적게 가져올게.)라고 했다. 더 먹는 것이 아니라서 틀림.","오답 ✕ — 간식을 그만 먹겠다는 말은 없다. 소녀는 음식을 '덜 가져오겠다'고 했다.","오답 ✕ — 직접 요리하겠다는 말은 대화에 없다. 소녀가 말한 것은 음식을 적게 가져오는 것이다.","정답 ○ — 'Wasting food is bad for the Earth.'(음식을 낭비하는 건 지구에 나빠.)를 듣고 'I'll bring less food next time.'(다음에는 음식을 더 적게 가져올게.)이라고 했으므로 알맞은 양의 음식을 가져올 것이다.","오답 ✕ — 'Food waste makes greenhouse gases.'(음식물 쓰레기는 온실가스를 만든다.)는 말은 있지만 다른 쓰레기와 섞지 않겠다는 말은 없다."],"memo":["정답 ④: 소녀는 알맞은 양의 음식을 가져올 것이다.","근거: I'll bring less food next time.(다음에는 음식을 더 적게 가져올게.)","함정: ⑤ 쓰레기를 섞지 않겠다는 말은 없어서 ✕"],"why":"음식물 쓰레기가 온실가스를 만든다는 말을 듣고 음식을 덜 가져오겠다고 한다."}],"dlg":[["G","I can't finish this sandwich.","나 이 샌드위치를 다 못 먹겠어."],["B","You know what? Wasting food is bad for the Earth.","그거 알아? 음식을 낭비하는 건 지구에 나빠."],["G","Why?","왜?"],["B","Food waste makes greenhouse gases.","음식물 쓰레기는 온실가스를 만들어 내거든."],["G","Oh, I get it. I'll bring less food next time.","아, 알겠어. 다음에는 음식을 더 적게 가져올게."]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["The girl wants to study at home.","The library is closed this week because they are painting the walls.","The boy will paint the library walls.","The girl already knew the library was closed.","They will study in the library after school."],"a":1,"ans":"The library is closed this week because they are painting the walls.","evs":[["B: We can't go. The library is closed this week.","우리 못 가. 도서관이 이번 주에 문을 닫아."],["B: I heard that they're painting the walls.","벽에 페인트칠을 하고 있다고 들었어."]],"ev":["B: We can't go. The library is closed this week.","우리 못 가. 도서관이 이번 주에 문을 닫아."],"ow":["오답 ✕ — 소녀는 'let's go to the library and study after school'(도서관에 가서 공부하자)이라고 했다. 집에서 공부하고 싶다는 말은 없다.","정답 ○ — 'The library is closed this week.'(도서관이 이번 주에 문을 닫아.)라고 했고, 이유는 'they're painting the walls'(벽에 페인트칠을 하고 있다)이다.","오답 ✕ — 소년은 'I heard that they're painting the walls.'(벽에 페인트칠을 하고 있다고 들었어.)라고 했다. 소년이 칠하는 것이 아니라 도서관에서 칠하는 중이다.","오답 ✕ — 소녀는 'Really? Why?'(정말? 왜?)라고 되물었다. 이미 알고 있었다면 이렇게 묻지 않으므로 틀림.","오답 ✕ — 소년이 'We can't go.'(우리 못 가.)라고 했으므로 도서관에서 공부할 수 없다."],"memo":["정답 ②: 도서관은 벽을 페인트칠하고 있어서 이번 주에 닫는다.","근거: I heard that they're painting the walls.(벽에 페인트칠을 하고 있다고 들었어.)","함정: ④ 소녀는 Really? Why?(정말? 왜?)라고 물어서 몰랐다"],"why":"도서관이 벽 페인트칠 때문에 이번 주에 문을 닫는다."}],"dlg":[["G","Hey, let's go to the library and study after school.","얘, 방과 후에 도서관에 가서 공부하자."],["B","We can't go. The library is closed this week.","우리 못 가. 도서관이 이번 주에 문을 닫아."],["G","Really? Why?","정말? 왜?"],["B","I heard that they're painting the walls.","벽에 페인트칠을 하고 있다고 들었어."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["Dolphins sleep with both eyes closed.","The boy already knew this fact about dolphins.","Dolphins sleep with one eye open to find food.","Dolphins keep one eye open to stay safe.","The girl learned this fact from the boy."],"a":3,"ans":"Dolphins keep one eye open to stay safe.","evs":[["G: They keep one eye open to stay safe.","돌고래는 안전하게 지내려고 한쪽 눈을 뜨고 있어."],["G: Did you know that dolphins sleep with one eye open?","너 돌고래가 한쪽 눈을 뜬 채로 잔다는 거 알고 있었니?"]],"ev":["G: They keep one eye open to stay safe.","돌고래는 안전하게 지내려고 한쪽 눈을 뜨고 있어."],"ow":["오답 ✕ — 'dolphins sleep with one eye open'(돌고래는 한쪽 눈을 뜬 채로 잔다)이다. 두 눈을 감고 자는 것이 아니라서 틀림.","오답 ✕ — 소년은 'Really? Why?'(정말? 왜?)라고 했다. 이미 알았다면 이렇게 말하지 않으므로 틀림.","오답 ✕ — 이유는 'to stay safe'(안전하게 지내려고)이다. 먹이를 찾기 위해서가 아니라서 틀림.","정답 ○ — 소녀가 'They keep one eye open to stay safe.'(안전하게 지내려고 한쪽 눈을 뜨고 있어.)라고 했으므로 맞다.","오답 ✕ — 이 사실을 알려 준 사람은 소녀('Did you know that dolphins sleep with one eye open?')이다. 소녀가 소년에게 배운 것이 아니라서 틀림."],"memo":["정답 ④: 돌고래는 안전하게 지내려고 한쪽 눈을 뜨고 있다.","근거: They keep one eye open to stay safe.(안전하게 지내려고 한쪽 눈을 뜨고 있어.)","함정: ③ 먹이를 찾으려는 게 아니라 안전하려고(to stay safe)라서 ✕"],"why":"돌고래는 안전을 위해 한쪽 눈을 뜬 채로 잔다."}],"dlg":[["G","Did you know that dolphins sleep with one eye open?","너 돌고래가 한쪽 눈을 뜬 채로 잔다는 거 알고 있었니?"],["B","Really? Why?","정말? 왜?"],["G","They keep one eye open to stay safe.","돌고래는 안전하게 지내려고 한쪽 눈을 뜨고 있어."],["B","Oh, I get it.","아, 그렇구나."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하지 않는 것은?","o":["글쓴이는 오늘 아침 스쿠버 다이빙을 했다.","글쓴이가 가장 좋아하는 지점은 산호가 많다.","오늘 산호들의 상태가 좋지 않았다.","따뜻한 바닷물 때문에 산호의 모양이 변했다.","글쓴이는 가장 좋아하는 지점을 걱정하고 있다."],"a":3,"ans":"따뜻한 바닷물 때문에 산호의 모양이 변했다.","evs":[["Because of the warm seawater, corals have turned white.","따뜻한 바닷물 때문에 산호들이 흰색으로 변해버렸다."],["I'm really worried.","나는 몹시 걱정이 된다."]],"ev":["Because of the warm seawater, corals have turned white.","따뜻한 바닷물 때문에 산호들이 흰색으로 변해버렸다."],"ow":["오답 ✕ — 지문과 일치한다. 'This morning, I went scuba diving'(오늘 아침 스쿠버 다이빙을 갔다)고 했다.","오답 ✕ — 지문과 일치한다. 'a place that was full of beautiful and colorful corals'(아름답고 다채로운 산호들로 가득한 장소)라고 했다.","오답 ✕ — 지문과 일치한다. 'corals were getting sick'(산호들이 병들어 가고 있었다)고 했다.","정답 ○ — 'corals have turned white'(산호들이 흰색으로 변해버렸다)라고 했다. 모양이 변한 것이 아니라 색이 변한 것이므로 지문과 다르다.","오답 ✕ — 지문과 일치한다. 'I'm really worried.'(나는 몹시 걱정이 된다.)라고 했다."],"memo":["정답 ④: 따뜻한 바닷물 때문에 산호의 모양이 아니라 색이 변했다(흰색).","근거: Because of the warm seawater, corals have turned white.(따뜻한 바닷물 때문에 산호들이 흰색으로 변해버렸다.)","함정: 모양(shape)이 변했다는 말은 없다"],"why":"따뜻한 바닷물 때문에 산호가 흰색으로 변했다."}],"pp":[["Date &amp; Time: September 15, 5:30 p.m.","날짜 및 시간: 9월 15일, 오후 5시 30분"],["It's a sad day for me.","오늘은 내게 슬픈 날이다."],["This morning, I went scuba diving at my favorite spot in the sea.","오늘 아침, 나는 바다에서 내가 가장 좋아하는 지점으로 스쿠버 다이빙을 갔다."],["It was a place that was full of beautiful and colorful corals.","그곳은 아름답고 다채로운 산호들로 가득한 장소였다."],["But today, I saw that corals were getting sick.","그런데 오늘, 나는 산호들이 병들어 가고 있는 것을 보았다."],["I was shocked.","나는 충격을 받았다."],["Because of the warm seawater, corals have turned white.","따뜻한 바닷물 때문에 산호들이 흰색으로 변해버렸다."],["Different types of waste have harmed the corals, too.","여러 종류의 쓰레기도 산호에 해를 끼쳤다."],["Now the spot has lost its colors and beauty.","이제 그 지점은 색과 아름다움을 잃어버렸다."],["I'm really worried.","나는 몹시 걱정이 된다."]]},{"qs":[{"n":7,"q":"윗글에 따르면 많은 산호가 아픈 이유로 알맞은 것은?","o":["Because they eat too many clam parts.","Because they don't get good care in time.","Because there are too many divers.","Because the sea is too cold.","Because baby corals are kept in tanks."],"a":1,"ans":"Because they don't get good care in time.","evs":[["Many corals get sick because they don't get good care in time.","많은 산호들은 제때 좋은 치료를 받지 못하기 때문에 아프다."],["My plan is to form a team of divers.","내 계획은 잠수부 팀을 만드는 것이다."]],"ev":["Many corals get sick because they don't get good care in time.","많은 산호들은 제때 좋은 치료를 받지 못하기 때문에 아프다."],"ow":["오답 ✕ — 조개 부스러기는 'We feed them clam parts and seaweed smoothies.'(아기 산호에게 먹인다)처럼 산호를 튼튼하게 하는 먹이이다. 병의 원인이 아니라서 틀림.","정답 ○ — 'Many corals get sick because they don't get good care in time.'(많은 산호들은 제때 좋은 치료를 받지 못하기 때문에 아프다.)라고 했다.","오답 ✕ — 잠수부는 오히려 산호를 돕는 사람들이다. 'My plan is to form a team of divers.'(잠수부 팀을 만드는 것이 계획이다.)","오답 ✕ — 앞의 일기에서 산호는 'the warm seawater'(따뜻한 바닷물) 때문에 흰색으로 변했다고 했다. 바다가 너무 차갑다는 말은 없다.","오답 ✕ — 수조는 병든 산호가 아니라 'healthy baby corals'(건강한 아기 산호)를 돌보는 곳이다. 아픈 원인이 아니라서 틀림."],"memo":["정답 ②: 많은 산호는 제때 좋은 돌봄을 받지 못해서 아프다.","근거: Many corals get sick because they don't get good care in time.(많은 산호들은 제때 좋은 치료를 받지 못하기 때문에 아프다.)","함정: ④ 바다가 차가운 게 아니라 따뜻해서 문제였다"],"why":"산호가 제때 돌봄을 받지 못해 아프기 때문에 잠수부 팀을 만들려 한다."},{"n":8,"q":"윗글의 내용과 일치하지 않는 것은?","o":["The writer's team has cured sick corals with ointment.","The writer's team put sick baby corals in tanks of seawater.","Clam parts and seaweed are good for baby corals.","The writer's team will send the baby corals to the sea.","The writer wants to grow many healthy corals."],"a":1,"ans":"The writer's team put sick baby corals in tanks of seawater.","evs":[["We also took some healthy baby corals from the sea and put them in tanks of seawater.","우리는 또한 바다에서 건강한 아기 산호들을 가져와 바닷물 수조에 넣었다."],["For the last two weeks, my team has put ointment on sick corals.","지난 두 주 동안, 우리 팀은 병든 산호에 연고를 발랐다."]],"ev":["We also took some healthy baby corals from the sea and put them in tanks of seawater.","우리는 또한 바다에서 건강한 아기 산호들을 가져와 바닷물 수조에 넣었다."],"ow":["오답 ✕ — 지문과 일치한다. 'my team has put ointment on sick corals'(병든 산호에 연고를 발랐다)고 했다.","정답 ○ — 수조에 넣은 것은 'healthy baby corals'(건강한 아기 산호)이다. 병든 아기 산호를 넣었다는 말은 지문과 다르다.","오답 ✕ — 지문과 일치한다. 'We feed them clam parts and seaweed smoothies. This food helps baby corals grow stronger.'(이 음식은 아기 산호가 더 강하게 자라도록 돕는다.)","오답 ✕ — 지문과 일치한다. 'When they are ready, we'll plant them onto the corals in the sea.'(준비되면 바다의 산호에 심을 것이다.)","오답 ✕ — 지문과 일치한다. 'Our goal is to grow many healthy corals.'(우리의 목표는 많은 건강한 산호들을 키우는 것이다.)"],"memo":["정답 ②: 수조에 넣은 것은 병든 아기 산호가 아니라 건강한 아기 산호이다.","근거: We also took some healthy baby corals from the sea and put them in tanks of seawater.(건강한 아기 산호들을 바닷물 수조에 넣었다.)","함정: 연고는 병든 산호에, 수조는 건강한 아기 산호에 쓴다"],"why":"병든 산호에는 연고를 바르고, 건강한 아기 산호는 수조에서 키운다."},{"n":9,"q":"윗글의 주제로 알맞은 것은?","o":["main food for baby corals","the results of taking care of sick corals","poor condition of the sea to grow corals","my team's efforts to save and grow corals","the best time to send baby corals back to the sea"],"a":3,"ans":"my team's efforts to save and grow corals","evs":[["My plan is to form a team of divers.","내 계획은 잠수부 팀을 만드는 것이다."],["Our goal is to grow many healthy corals.","우리의 목표는 많은 건강한 산호들을 키우는 것이다."]],"ev":["My plan is to form a team of divers.","내 계획은 잠수부 팀을 만드는 것이다."],"ow":["오답 ✕ — 'We feed them clam parts and seaweed smoothies.'(조개 부스러기와 해조류 스무디를 먹인다.)는 일부 내용일 뿐이다. 글 전체의 주제로는 너무 좁다.","오답 ✕ — 'I look forward to seeing the results!'(결과를 볼 것을 기대한다!)라고 했듯 이 부분에서는 아직 결과가 나오지 않았다. 계획과 노력이 중심이다.","오답 ✕ — 바다의 상태가 나쁘다는 이야기는 앞부분에 있고, 이 부분은 산호를 돕는 방법을 다룬다. 산호를 키울 바다 환경을 설명하는 글이 아니다.","정답 ○ — 잠수부 팀을 만들고('form a team of divers'), 연고를 바르고, 아기 산호를 키우는('Our goal is to grow many healthy corals') 팀의 노력을 이야
