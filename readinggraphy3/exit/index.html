이 의사들에게 준 정보는 좋은 것, 즉 valuable(귀중한). 쓸모없거나 위험한 정보라면 대조가 되지 않음.","c":3,"ev":"10번 문장","s":[[10,"Despite this result, the experiment gave doctors valuable information.","이 결과에도 불구하고, 그 실험은 의사들에게 귀중한 정보를 주었다."]]},"h":"b9cf4382fb"},{"n":6,"t":"ref","q":"What does the underlined \"these special pigs\" refer to?\nDavid's new heart came from one of these special pigs.","ko":"밑줄 친 these special pigs가 가리키는 것은?","sko":"데이비드의 새 심장은 이러한 특별한 돼지들 중 하나에서 왔다.","opts":["의사들","인간 심장 기증자들","데이비드의 가족들","유전자가 일부 변형된 특별한 돼지들"],"r":{"a":"4) 유전자가 일부 변형된 특별한 돼지들","w":"7번의 these special pigs는 바로 앞 6번에서 doctors used special pigs whose genes were partly changed라고 소개된 돼지들. 데이비드가 받은 심장은 사람이 아니라 그 돼지 중 하나에게서 온 것.","c":4,"ev":"6~7번 문장","s":[[6,"This time, doctors used special pigs whose genes were partly changed to make their organs work better in human bodies.","이번에는, 의사들이 돼지의 장기가 인간의 몸에서 더 잘 작동하도록 유전자가 일부 변형된 특별한 돼지들을 사용했다."],[7,"David’s new heart came from one of these special pigs.","데이비드의 새 심장은 이러한 특별한 돼지들 중 하나에서 왔다."]]},"h":"e0fd690490"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"His heart was so weak that he couldn't receive a human heart transplant.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그의 심장은 너무 약해서 그는 인간의 심장 이식을 받을 수 없었다.","opts":["그의 심장은 매우 튼튼해서 이식이 필요 없었다.","그는 약해서 의사들의 이식을 받기 싫어했다.","그의 심장이 너무 약해서 사람의 심장을 이식받는 것도 불가능했다.","그의 심장이 약했기 때문에 의사들은 사람의 심장을 이식해 주었다."],"r":{"a":"3) 그의 심장이 너무 약해서 사람의 심장을 이식받는 것도 불가능했다.","w":"so ~ that …은 '너무 ~해서 …하다'. 심장이 너무 약해서 인간 심장 이식을 받을 수 없었다(couldn't receive)는 뜻이고, 4번에서 그래서 돼지 심장을 쓰기로 했음. 튼튼하다(1), 받기 싫어했다(2), 사람 심장을 이식해 주었다(4)는 본문과 다름.","c":3,"ev":"3번 문장","s":[[3,"His heart was so weak that he couldn’t receive a human heart transplant.","그의 심장은 너무 약해서 그는 인간의 심장 이식을 받을 수 없었다."]]},"h":"7e27c4e639"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["의사들은 이전에 동물의 심장으로 여러 번 성공했다.","데이비드는 수술 후 1년 넘게 살았다.","돼지의 심장은 데이비드의 몸에서 완벽하게 작동했다.","데이비드는 돼지의 심장을 받은 지 60일 후에 세상을 떠났다."],"opts":["Doctors had succeeded with animal hearts many times before.","David lived for more than a year after the operation.","The pig's heart worked perfectly in David's body.","David died 60 days after he received the pig's heart."],"r":{"a":"4) David died 60 days after he received the pig's heart.","w":"8번에서 데이비드는 60일 후에 세상을 떠났음(passed away). 과거에는 성공하지 못했고(5번), 1년 넘게 산 것이 아니며(8번), 돼지의 심장은 제대로 작동하지 못했음(9번).","c":4,"ev":"5, 8~9번 문장","s":[[5,"In the past, doctors tried to use animal hearts but they didn’t succeed.","과거에, 의사들은 동물의 심장을 사용하려고 노력했지만 성공하지 못했다."],[8,"However, David passed away 60 days later.","그러나 데이비드는 60일 후에 세상을 떠났다."],[9,"The pig’s heart had trouble working properly in David’s body.","돼지의 심장은 데이비드의 몸에서 제대로 작동하는 데 어려움을 겪었다."]]},"h":"eecaea51c2"},{"n":9,"t":"sum","q":"Although the pig's heart did not (A) well in David's body, the experiment gave doctors valuable (B).","ko":"돼지의 심장이 데이비드의 몸에서 잘 (A)하지 못했지만, 그 실험은 의사들에게 귀중한 (B)를 주었다.","opts":["(A) work / (B) problems","(A) stop / (B) information","(A) grow / (B) money","(A) hurt / (B) patients","(A) work / (B) information"],"oko":["(A) 작동하다 / (B) 문제들","(A) 멈추다 / (B) 정보","(A) 자라다 / (B) 돈","(A) 해치다 / (B) 환자들","(A) 작동하다 / (B) 정보"],"r":{"a":"5) (A) work / (B) information","w":"9번에서 돼지의 심장은 데이비드의 몸에서 제대로 작동하는(work) 데 어려움을 겪었고, 10번에서 그럼에도 불구하고 귀중한 정보(information)를 주었다고 함. (A)work와 (B)information이 모두 맞는 것은 5번뿐.","c":5,"ev":"8~10번 문장","s":[[8,"However, David passed away 60 days later.","그러나 데이비드는 60일 후에 세상을 떠났다."],[9,"The pig’s heart had trouble working properly in David’s body.","돼지의 심장은 데이비드의 몸에서 제대로 작동하는 데 어려움을 겪었다."],[10,"Despite this result, the experiment gave doctors valuable information.","이 결과에도 불구하고, 그 실험은 의사들에게 귀중한 정보를 주었다."]]},"h":"4099fb617a"},{"n":10,"t":"fill","q":"Doctors used special pigs whose [A] were partly changed to make their [B] work better in human bodies.","ko":"의사들은 돼지의 [B]이 인간의 몸에서 더 잘 작동하도록 [A]가 일부 변형된 특별한 돼지들을 사용했다.","bank":["genes","organs","pigs","patients","days","information"],"bko":{"genes":"유전자들","organs":"장기들","pigs":"돼지들","patients":"환자들","days":"날들","information":"정보"},"r":{"a":"[A] genes, [B] organs","w":"6번: 유전자(genes)가 일부 변형된 돼지를 써서 돼지의 장기(organs)가 인간의 몸에서 더 잘 작동하게 함. pigs, patients, days, information은 6번의 이 문장에 어울리지 않는 말(돼지가 이미 주어이고, 환자·날짜·정보는 11번·8번·10번 내용).","c":null,"ev":"6번 문장","s":[[6,"This time, doctors used special pigs whose genes were partly changed to make their organs work better in human bodies.","이번에는, 의사들이 돼지의 장기가 인간의 몸에서 더 잘 작동하도록 유전자가 일부 변형된 특별한 돼지들을 사용했다."]]},"h":"9586586894"}]},{"u":12,"id":"rg3-12-3","no":3,"ko":"사람의 비만 유전자가 굶주림을 해결한다고?","items":[{"n":1,"t":"tf","q":"Every year, 9 million people around the world die from hunger.","ko":"매년, 전 세계에서 9백만 명의 사람들이 굶주림으로 사망한다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장과 같은 내용. die from hunger는 '굶주림으로 죽다'.","c":"T","ev":"1번 문장","s":[[1,"Every year, 9 million people around the world die from hunger.","매년, 전 세계에서 9백만 명의 사람들이 굶주림으로 사망한다."]]},"h":"9cc283b9ef"},{"n":2,"t":"tf","q":"The plants with the FTO gene grew much slower and smaller.","ko":"FTO 유전자를 가진 식물들은 훨씬 더 느리고 작게 자랐다.","r":{"a":"F (본문과 다른 내용)","w":"7번에서 이 유전자를 가진 식물들은 훨씬 더 빨리(faster), 더 크게(larger) 자람. slower, smaller로 반대로 쓴 진술이라 F.","c":"F","ev":"7번 문장","s":[[7,"The plants with this gene grew much faster and larger.","이 유전자를 가진 식물들은 훨씬 더 빨리 그리고 더 크게 자랐다."]]},"h":"4fce282172"},{"n":3,"t":"tf","q":"The FTO gene is related to being overweight in humans.","ko":"FTO 유전자는 인간이 비만이 되는 것과 관련되어 있다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장과 같은 내용. be related to는 '~와 관련되어 있다', overweight는 '과체중의, 비만의'.","c":"T","ev":"4번 문장","s":[[4,"The FTO gene is related to being overweight in humans.","FTO 유전자는 인간이 비만이 되는 것과 관련되어 있다."]]},"h":"310615e463"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The FTO gene is related to being overweight in humans.)","ko":"FTO 유전자는 인간이 비만이 되는 것과 ( ) 있다.","opts":["멀리 떨어진","관련된","금지된","오래된"],"word":"related","r":{"a":"2) 관련된","w":"4번은 FTO 유전자와 인간의 비만 사이의 관계를 말함. 그 관계 때문에 5번에서 이 유전자가 식물도 더 크게 자라게 할지 모른다는 아이디어가 나옴. 그래서 related는 관련된.","c":2,"ev":"4번 문장","s":[[4,"The FTO gene is related to being overweight in humans.","FTO 유전자는 인간이 비만이 되는 것과 관련되어 있다."]]},"h":"6e17d691b7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The experiment was a success!)","ko":"그 실험은 ( )이었다!","opts":["실패","사고","시작","성공"],"word":"success","r":{"a":"4) 성공","w":"6번 뒤 7번에서 유전자를 가진 식물들이 훨씬 더 빨리 크게 자랐다고 함. 좋은 결과이므로 success는 성공. 10번에서 '이것은 시작에 불과하다'고 하지만 실험 자체가 실패나 사고는 아님.","c":4,"ev":"6~7번 문장","s":[[6,"The experiment was a success!","그 실험은 성공이었다!"],[7,"The plants with this gene grew much faster and larger.","이 유전자를 가진 식물들은 훨씬 더 빨리 그리고 더 크게 자랐다."]]},"h":"4972a03c03"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis suggests that we might be able to produce more food from fewer plants.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 우리가 더 적은 식물로부터 더 많은 식량을 생산할 수 있을지도 모른다는 것을 시사한다.","opts":["9백만 명이 굶주림으로 사망하는 것","FTO 유전자가 인간의 비만과 관련된 것","이 유전자를 가진 식물들이 더 빨리, 더 크게 자라고 더 많이 생산한 실험 결과","과학자들이 농장에서 더 많은 실험을 하는 것"],"r":{"a":"3) 이 유전자를 가진 식물들이 더 빨리, 더 크게 자라고 더 많이 생산한 실험 결과","w":"9번의 This는 바로 앞 7~8번의 실험 결과(식물이 더 빨리 크게 자라고 벼는 세 배 더 생산한 것). 이 결과가 '더 적은 식물로 더 많은 식량을 만들 수 있을지도 모른다'는 것을 시사함. 더 많은 실험(11번)은 뒤에 나오는 내용.","c":3,"ev":"7~9번 문장","s":[[7,"The plants with this gene grew much faster and larger.","이 유전자를 가진 식물들은 훨씬 더 빨리 그리고 더 크게 자랐다."],[8,"Rice crops produced three times more, and the potatoes grew bigger.","벼는 세 배 더 많이 생산했고, 감자들은 더 크게 자랐다."],[9,"This suggests that we might be able to produce more food from fewer plants.","이는 우리가 더 적은 식물로부터 더 많은 식량을 생산할 수 있을지도 모른다는 것을 시사한다."]]},"h":"c8ee7882a0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Simply growing more food isn't always the solution because it requires lots of energy and can cause pollution.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"단순히 더 많은 식량을 재배하는 것은 많은 에너지가 필요하고 오염을 일으킬 수 있기 때문에 항상 해결책이 되지는 않는다.","opts":["더 많은 식량을 기르면 에너지가 절약되어 항상 해결책이 된다.","식량을 단순히 더 많이 기르는 것은 에너지가 많이 들고 오염을 일으킬 수 있어서 늘 답이 되지는 않는다.","식량을 기르는 것은 오염을 줄여 주기 때문에 좋은 해결책이다.","더 많은 식량을 기르는 일은 에너지가 거의 들지 않아서 쉽다."],"r":{"a":"2) 식량을 단순히 더 많이 기르는 것은 에너지가 많이 들고 오염을 일으킬 수 있어서 늘 답이 되지는 않는다.","w":"isn't always는 '항상 ~인 것은 아닌'. because 뒤에서 에너지가 많이 필요하고(requires lots of energy) 오염을 일으킬 수 있다(can cause pollution)고 이유를 말함. 에너지가 절약된다(1), 오염을 줄인다(3), 에너지가 거의 안 든다(4)는 반대.","c":2,"ev":"2번 문장","s":[[2,"Simply growing more food isn’t always the solution because it requires lots of energy and can cause pollution.","단순히 더 많은 식량을 재배하는 것은 많은 에너지가 필요하고 오염을 일으킬 수 있기 때문에 항상 해결책이 되지는 않는다."]]},"h":"afa74d3278"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["FTO 유전자를 가진 감자들은 더 작게 자랐다.","그 실험은 실패했다.","과학자들은 이미 모든 실험을 끝냈다.","벼는 세 배 더 많이 생산했다."],"opts":["Potatoes with the FTO gene grew smaller.","The experiment failed.","Scientists have already finished all the tests.","Rice crops produced three times more."],"r":{"a":"4) Rice crops produced three times more.","w":"8번에서 벼는 세 배 더 많이 생산했고 감자는 더 크게 자람. 감자가 작아지지 않았고(8번), 실험은 성공(6번), 과학자들은 앞으로 더 많은 실험을 할 것(10~11번).","c":4,"ev":"6, 8, 10~11번 문장","s":[[6,"The experiment was a success!","그 실험은 성공이었다!"],[8,"Rice crops produced three times more, and the potatoes grew bigger.","벼는 세 배 더 많이 생산했고, 감자들은 더 크게 자랐다."],[10,"However, this is just the beginning.","그러나 이것은 단지 시작에 불과하다."],[11,"Scientists will do more tests to make sure that these plants can grow well in farms and are safe.","과학자들은 이 식물들이 농장에서 잘 자랄 수 있고 안전한지 확실히 하기 위해 더 많은 실험을 할 것이다."]]},"h":"282b185f94"},{"n":9,"t":"sum","q":"Scientists think we might produce more food from (A) plants, but more (B) are needed before this discovery can become a new solution.","ko":"과학자들은 우리가 (A) 식물로 더 많은 식량을 생산할 수 있을지도 모른다고 생각하지만, 이 발견이 새로운 해결책이 되려면 더 많은 (B)이 필요하다.","opts":["(A) more / (B) tests","(A) fewer / (B) problems","(A) bigger / (B) farms","(A) more / (B) energy","(A) fewer / (B) tests"],"oko":["(A) 더 많은 / (B) 실험","(A) 더 적은 / (B) 문제","(A) 더 큰 / (B) 농장","(A) 더 많은 / (B) 에너지","(A) 더 적은 / (B) 실험"],"r":{"a":"5) (A) fewer / (B) tests","w":"9번: 더 적은(fewer) 식물로 더 많은 식량을 생산할 수 있을지도 모른다, 10~11번: 아직 시작이라 더 많은 실험(tests)을 할 것, 12번: 새로운 해결책이 될 수도 있다. (A)fewer와 (B)tests가 모두 맞는 것은 5번뿐.","c":5,"ev":"9~12번 문장","s":[[9,"This suggests that we might be able to produce more food from fewer plants.","이는 우리가 더 적은 식물로부터 더 많은 식량을 생산할 수 있을지도 모른다는 것을 시사한다."],[10,"However, this is just the beginning.","그러나 이것은 단지 시작에 불과하다."],[11,"Scientists will do more tests to make sure that these plants can grow well in farms and are safe.","과학자들은 이 식물들이 농장에서 잘 자랄 수 있고 안전한지 확실히 하기 위해 더 많은 실험을 할 것이다."],[12,"This discovery could be a new solution to the world’s hunger problems.","이 발견은 세계 기아 문제의 새로운 해결책이 될 수도 있다."]]},"h":"6fd597d05c"},{"n":10,"t":"fill","q":"Scientists tried transplanting the [A] gene from humans into [B].","ko":"과학자들은 인간의 [A] 유전자를 [B]에 이식해 보았다.","bank":["FTO","crops","hunger","energy","farms","pollution"],"bko":{"FTO":"FTO(비만 관련 유전자 이름)","crops":"농작물","hunger":"굶주림","energy":"에너지","farms":"농장들","pollution":"오염"},"r":{"a":"[A] FTO, [B] crops","w":"3번: 인간의 FTO 유전자를 농작물(crops)에 이식했음. hunger는 해결하려는 문제(1번), energy와 pollution은 단순히 식량을 기를 때의 문제(2번), farms는 11번에서 식물이 잘 자라는지 확인할 장소임.","c":null,"ev":"3번 문장","s":[[3,"Scientists have tried an interesting idea: transplanting the “FTO gene” from humans into crops.","과학자들은 인간의 ‘FTO 유전자’를 농작물에 이식하는 흥미로운 아이디어를 시도해 봤다."]]},"h":"360ff08007"}]}];

  else if(it.opts){var g=el("div","opts");it.opts.forEach(function(t,i){var b=el("button","o");b.innerHTML="<i>"+(i+1)+"</i><span></span>";b.lastChild.textContent=t;b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===i+1));b.onclick=function(){setAns(p,it,i+1);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.t==="fill"){q.appendChild(el("p","bank","보기: "+it.bank.join(" / ")))}
  if(fin){var pk=(ans[p.id]||{})[it.n];if(it.t==="tf"){Array.prototype.forEach.call(q.querySelector(".tf").children,function(b){var v=b.textContent;if(v===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(v===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}else if(it.opts){Array.prototype.forEach.call(q.querySelector(".opts").children,function(b,i){if(i+1===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(i+1===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}}
  if(fin&&it.r){var rv=el("div","rv");
   var z1=el("div","zone z-tr");z1.appendChild(el("h4",null,"한글 해석"));
   function ln(l,t){var p2=el("p","ln");p2.appendChild(el("b",null,l));p2.appendChild(document.createTextNode(t));z1.appendChild(p2)}
   if(it.ko)ln("문제",it.ko);if(it.sko)ln("문장",it.sko);
   if(it.oko){var ol=el("ol");it.oko.forEach(function(x){ol.appendChild(el("li",null,x))});var lb=el("p","ln");lb.appendChild(el("b",null,"선택지"));z1.appendChild(lb);z1.appendChild(ol)}
   if(it.bko){var bl=el("p","ln");bl.appendChild(el("b",null,"보기 단어"));bl.appendChild(document.createTextNode(it.bank.map(function(w){return w+" "+(it.bko[w]||"")}).join(" / ")));z1.appendChild(bl)}
   if(z1.children.length>1)rv.appendChild(z1);
   var z2=el("div","zone z-an");z2.appendChild(el("h4",null,"정답 · 해설"));z2.appendChild(el("p","ra","정답: "+it.r.a));z2.appendChild(el("div","rl","교재 근거 ("+it.r.ev+")"));it.r.s.forEach(function(x){var d=el("div","rs");var e=el("span","en");e.appendChild(el("span","sn",x[0]+"번"));e.appendChild(document.createTextNode(x[1]));d.appendChild(e);d.appendChild(el("span","ko",x[2]));z2.appendChild(d)});z2.appendChild(el("div","rl","정리"));z2.appendChild(el("p","rw",it.r.w));rv.appendChild(z2);if(okm){rv.style.display="none";var tg=el("button","tgl","해설 보기");tg.onclick=function(){var s=rv.style.display==="none";rv.style.display=s?"block":"none";tg.textContent=s?"해설 닫기":"해설 보기"};q.appendChild(tg)}q.appendChild(rv)}
  box.appendChild(q)});
 v.appendChild(box);

function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
function showScore(p){var sb=document.getElementById("sbar");sb.innerHTML="";var d=done[p.id];var c=el("div","score");c.appendChild(el("span",null,readName(p)+" 점수"));c.appendChild(el("b",null,(d.s*10)+"점"));c.appendChild(el("span",null,d.s+" / 10 문항"));sb.style.display="block";sb.appendChild(c);sb.appendChild(navBar())}
boot();

  var t=document.createElement("div");t.className="top";
  t.innerHTML='<span class="tk">EXIT TEST</span><h1></h1><p class="sub">Reading별 10문항</p>';t.querySelector("h1").textContent=document.title.replace(/ Exit Test$/,"");v.appendChild(t);
  var last=null;
  P.forEach(function(p){
    if(p.u!==last){last=p.u;var g=document.createElement("div");g.className="grp";g.textContent=secName(p.u);v.appendChild(g)}
    var ok=ready(p.id);
    var r=document.createElement(ok?"a":"div");r.className="pk"+(ok?"":" lk");if(ok)r.href="?r="+encodeURIComponent(p.id);
    var l=document.createElement("div");var b=document.createElement("b");b.textContent=readName(p);var s=document.createElement("span");s.className="t";s.textContent=p.ko;l.appendChild(b);l.appendChild(s);r.appendChild(l);
    var st=document.createElement("span");st.className="st";st.textContent=ok?"응시 가능":"잠김";r.appendChild(st);v.appendChild(r)});
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("홈으로","../",true));v.appendChild(n)}
function gate(p){var v=document.getElementById("view");v.innerHTML="";v.appendChild(testHead(p));
  var g=document.createElement("div");g.className="gate";g.innerHTML="<b>아직 응시할 수 없어요</b><p>지문 읽기와 문제 선지를 모두 마친 뒤에 열려요.</p>";v.appendChild(g);
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("이 Reading으로 돌아가기","../?r="+encodeURIComponent(p.id),true));n.appendChild(lnk("Exit test 목록","./"));v.appendChild(n)}
function boot(){var m=/[?&]r=([^&]+)/.exec(location.search);
  if(m){var id=decodeURIComponent(m[1]);var p=P.filter(function(x){return x.id===id})[0];
    if(p){cur=id;if(!ready(id)){gate(p);return}view();return}}
  picker()}
