<!doctype html>

<title>M1 Reading 77</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}

.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}

.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}

.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":"Emma Han 인터뷰","en":"When you watch a movies, what do you pay attention to? The story, the actors, or the music?","ko":"당신은 영화를 볼 때 무엇에 주목하나요? 줄거리, 배우, 아니면 음악?","ok":false,"foot":[],"fixes":[{"wrong":"movies","right":"movie","partial":false,"at":[4],"point":"명사의 복수형: a 뒤에는 단수명사 movie 사용","topic":"명사의 복수형","memo":"a 뒤에는 단수명사 movie 사용"}]},{"n":2,"tag":null,"en":"What about the sounds? Last week, I have a short interview with Emma Han, a famous Foley artist.","ko":"소리는 어떤가요? 지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다.","ok":false,"foot":[],"fixes":[{"wrong":"have","right":"had","partial":false,"at":[7],"point":"과거 시제: Last week는 과거 시점: had (have 아님)","topic":"과거 시제","memo":"Last week는 과거 시점: had (have 아님)"}]},{"n":3,"tag":null,"en":"Q. Hello, Ms. Han.","ko":"질문: 안녕하세요, Han 선생님.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"Can you tell I about your job?","ko":"당신의 직업에 관해 말해 주시겠어요?","ok":false,"foot":[],"fixes":[{"wrong":"I","right":"me","partial":false,"at":[3],"point":"인칭대명사의 목적격: 동사 tell 뒤에는 목적격 me 사용","topic":"인칭대명사의 목적격","memo":"동사 tell 뒤에는 목적격 me 사용"}]},{"n":5,"tag":null,"en":"Sure! Foley artists creates various sounds for movies because actual sounds are not clear enough for movie scenes.","ko":"그러죠! 폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요.","ok":false,"foot":[],"fixes":[{"wrong":"creates","right":"create","partial":false,"at":[3],"point":"동사의 수일치: 주어 Foley artists(복수)는 create (creates 아님)","topic":"동사의 수일치","memo":"주어 Foley artists(복수)는 create (creates 아님)"}]},{"n":6,"tag":null,"en":"Let's say there's a rainy scene. The actual sounds of rain are too softly, so we have to make rain sounds and add they to the scene.","ko":"비 오는 장면이 있다고 가정해 봅시다. 실제 빗소리는 너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요.","ok":false,"foot":[],"fixes":[{"wrong":"softly","right":"soft","partial":false,"at":[13],"point":"형용사와 부사: be동사 뒤 보어는 형용사 soft 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어는 형용사 soft 사용"},{"wrong":"they","right":"them","partial":false,"at":[23],"point":"인칭대명사의 목적격: 동사 add 뒤에는 목적격 them 사용","topic":"인칭대명사의 목적격","memo":"동사 add 뒤에는 목적격 them 사용"}]},{"n":7,"tag":null,"en":"Q. How does you make sounds?","ko":"질문: 어떻게 소리를 만드나요?","ok":false,"foot":[],"fixes":[{"wrong":"does","right":"do","partial":false,"at":[2],"point":"do/does 의문문: 주어 you에는 조동사 do 사용","topic":"do/does 의문문","memo":"주어 you에는 조동사 do 사용"}]},{"n":8,"tag":null,"en":"I use all kinds of everyday objects in fun and creatively ways. For example, I fry bacon to create rain sounds.","ko":"저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다. 예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요.","ok":false,"foot":[],"fixes":[{"wrong":"creatively","right":"creative","partial":false,"at":[10],"point":"형용사와 부사: 명사 ways 앞에는 형용사 creative 사용","topic":"형용사와 부사","memo":"명사 ways 앞에는 형용사 creative 사용"}]},{"n":9,"tag":null,"en":"For the sounds of ice skating, I move a pair of scissor across an desk.","ko":"얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요.","ok":false,"foot":[],"fixes":[{"wrong":"scissor","right":"scissors","partial":false,"at":[11],"point":"명사의 복수형: a pair of 뒤에는 복수명사 scissors 사용","topic":"명사의 복수형","memo":"a pair of 뒤에는 복수명사 scissors 사용"},{"wrong":"an","right":"a","partial":false,"at":[13],"point":"관사 a/an: 자음 소리 d 앞에는 a desk 사용","topic":"관사 a/an","memo":"자음 소리 d 앞에는 a desk 사용"}]},{"n":10,"tag":null,"en":"To make the sounds of an horse walking, I hit two coconut shell together.","ko":"말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[5],"point":"관사 a/an: 자음 소리 h 앞에는 a horse 사용","topic":"관사 a/an","memo":"자음 소리 h 앞에는 a horse 사용"},{"wrong":"shell","right":"shells","partial":false,"at":[12],"point":"명사의 복수형: two 뒤에는 복수명사 shells 사용","topic":"명사의 복수형","memo":"two 뒤에는 복수명사 shells 사용"}]},{"n":11,"tag":null,"en":"Q. How interesting!","ko":"질문: 정말 흥미롭네요!","ok":true,"foot":[],"fixes":[]},{"n":12,"tag":null,"en":"What can we do to becomes a Foley artist?","ko":"우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?","ok":false,"foot":[],"fixes":[{"wrong":"becomes","right":"become","partial":false,"at":[5],"point":"to부정사: to 뒤에는 동사원형 become 사용","topic":"to부정사","memo":"to 뒤에는 동사원형 become 사용"}]},{"n":13,"tag":null,"en":"You can just start by play with sounds. You don't have to use special tool to make different sounds.","ko":"여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요. 다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요.","ok":false,"foot":[],"fixes":[{"wrong":"play","right":"playing","partial":false,"at":[5],"point":"동명사: 전치사 by 뒤에는 동명사 playing 사용","topic":"동명사","memo":"전치사 by 뒤에는 동명사 playing 사용"},{"wrong":"tool","right":"tools","partial":false,"at":[14],"point":"명사의 복수형: 관사 없이는 복수형 tools 사용","topic":"명사의 복수형","memo":"관사 없이는 복수형 tools 사용"}]},{"n":14,"tag":null,"en":"Just try with everyday objects. Hit you desk with a pen and then with a pencil.","ko":"그냥 일상적인 물건들로 시도해 보세요. 책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요.","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[6],"point":"인칭대명사의 소유격: 명사 desk 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"명사 desk 앞에는 소유격 your 사용"}]},{"n":15,"tag":null,"en":"The two sounds are not the same. You should pay more attention for every sound around you.","ko":"이 두 가지 소리는 같지 않아요. 여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다.","ok":false,"foot":[],"fixes":[{"wrong":"for","right":"to","partial":false,"at":[12],"point":"기본전치사: '~에 주의하다'는 pay attention to 사용","topic":"기본전치사","memo":"'~에 주의하다'는 pay attention to 사용"}]},{"n":16,"tag":null,"en":"Then, you can find new ways of create sounds.","ko":"그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요.","ok":false,"foot":[],"fixes":[{"wrong":"create","right":"creating","partial":false,"at":[7],"point":"동명사: 전치사 of 뒤에는 동명사 creating 사용","topic":"동명사","memo":"전치사 of 뒤에는 동명사 creating 사용"}]},{"n":17,"tag":null,"en":"Q. It sounds like an interested job.","ko":"질문: 흥미로운 직업 같아요.","ok":false,"foot":[],"fixes":[{"wrong":"interested","right":"interesting","partial":false,"at":[5],"point":"분사: 직업이 '흥미로운'은 현재분사 interesting 사용","topic":"분사","memo":"직업이 '흥미로운'은 현재분사 interesting 사용"}]},{"n":18,"tag":null,"en":"Thank you of the interview, Ms. Han.","ko":"인터뷰해 주셔서 감사합니다, Han 선생님.","ok":false,"foot":[],"fixes":[{"wrong":"of","right":"for","partial":false,"at":[2],"point":"기본전치사: '~에 대해 감사'는 Thank you for 사용","topic":"기본전치사","memo":"'~에 대해 감사'는 Thank you for 사용"}]},{"n":19,"tag":null,"en":"Thank you for have me.","ko":"저를 인터뷰해 주셔서 감사합니다.","ok":false,"foot":[],"fixes":[{"wrong":"have","right":"having","partial":false,"at":[3],"point":"동명사: 전치사 for 뒤에는 동명사 having 사용","topic":"동명사","memo":"전치사 for 뒤에는 동명사 having 사용"}]}];var PP=[["Interview with Emma Han","Emma Han과의 인터뷰",1],["When you watch a movie, what do you pay attention to?","당신은 영화를 볼 때 무엇에 주목하나요?",1],["The story, the actors, or the music?","줄거리, 배우, 아니면 음악?",0],["What about the sounds?","소리는 어떤가요?",0],["Last week, I had a short interview with Emma Han, a famous Foley artist.","지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다.",0],["Q.","질문:",1],["Hello, Ms. Han.","안녕하세요, Han 선생님.",0],["Can you tell me about your job?","당신의 직업에 관해 말해 주시겠어요?",0],["Sure!","그러죠!",1],["Foley artists create various sounds for movies because actual sounds are not clear enough for movie scenes.","폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요.",0],["Let's say there's a rainy scene.","비 오는 장면이 있다고 가정해 봅시다.",0],["The actual sounds of rain are too soft, so we have to make rain sounds and add them to the scene.","실제 빗소리는 너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요.",0],["Q.","질문:",1],["How do you make sounds?","어떻게 소리를 만드나요?",0],["I use all kinds of everyday objects in fun and creative ways.","저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다.",1],["For example, I fry bacon to create rain sounds.","예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요.",0],["For the sounds of ice skating, I move a pair of scissors across a desk.","얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요.",0],["To make the sounds of a horse walking, I hit two coconut shells together.","말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.",0],["Q.","질문:",1],["How interesting!","정말 흥미롭네요!",0],["What can we do to become a Foley artist?","우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?",0],["You can just start by playing with sounds.","여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요.",1],["You don't have to use special tools to make different sounds.","다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요.",0],["Just try with everyday objects.","그냥 일상적인 물건들로 시도해 보세요.",0],["Hit your desk with a pen and then with a pencil.","책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요.",0],["The two sounds are not the same.","이 두 가지 소리는 같지 않아요.",0],["You should pay more attention to every sound around you.","여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다.",0],["Then, you can find new ways of creating sounds.","그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요.",0],["Q.","질문:",1],["It sounds like an interesting job.","흥미로운 직업 같아요.",0],["Thank you for the interview, Ms. Han.","인터뷰해 주셔서 감사합니다, Han 선생님.",0],["Thank you for having me.","저를 인터뷰해 주셔서 감사합니다.",1]];var RNUM=77;var TITLE_EN="Behind Movie Sounds";var PASS_EN=["Behind Movie Sounds","Interview with Emma Han","When you watch a movie, what do you pay attention to? The story, the actors, or the music? What about the sounds? Last week, I had a short interview with Emma Han, a famous Foley artist.","Q. Hello, Ms. Han. Can you tell me about your job?","Sure! Foley artists create various sounds for movies because actual sounds are not clear enough for movie scenes. Let's say there's a rainy scene. The actual sounds of rain are too soft, so we have to make rain sounds and add them to the scene.","Q. How do you make sounds?","I use all kinds of everyday objects in fun and creative ways. For example, I fry bacon to create rain sounds. For the sounds of ice skating, I move a pair of scissors across a desk. To make the sounds of a horse walking, I hit two coconut shells together.","Q. How interesting! What can we do to become a Foley artist?","You can just start by playing with sounds. You don't have to use special tools to make different sounds. Just try with everyday objects. Hit your desk with a pen and then with a pencil. The two sounds are not the same. You should pay more attention to every sound around you. Then, you can find new ways of creating sounds.","Q. It sounds like an interesting job. Thank you for the interview, Ms. Han.","Thank you for having me."];var PASS_KO=["영화 음향의 뒤에서","Emma Han과의 인터뷰","당신은 영화를 볼 때 무엇에 주목하나요? 줄거리, 배우, 아니면 음악? 소리는 어떤가요? 지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다.","질문: 안녕하세요, Han 선생님. 당신의 직업에 관해 말해 주시겠어요?","그러죠! 폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요. 비 오는 장면이 있다고 가정해 봅시다. 실제 빗소리는 너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요.","질문: 어떻게 소리를 만드나요?","저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다. 예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요. 얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요. 말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.","질문: 정말 흥미롭네요! 우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?","여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요. 다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요. 그냥 일상적인 물건들로 시도해 보세요. 책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요. 이 두 가지 소리는 같지 않아요. 여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다. 그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요.","질문: 흥미로운 직업 같아요. 인터뷰해 주셔서 감사합니다, Han 선생님.","저를 인터뷰해 주셔서 감사합니다."];var DG=[{"qs":[{"n":1,"q":"What would Minju like to do in the future?","o":["요리를 취미로 하고 싶어 한다.","요리를 가르치는 선생님이 되고 싶어 한다.","한국에서 미국 식당을 크게 내고 싶어 한다.","요리사가 되어 자신의 식당을 열고 싶어 한다.","한국에서 한식 전문 식당을 차리고 싶어 한다."],"a":3,"ans":"요리사가 되어 자신의 식당을 열고 싶어 한다.","evs":[["G: I want to be a cook and open my own restaurant.","나는 요리사가 되어서 내 식당을 열고 싶어요."]],"ev":["G: I want to be a cook and open my own restaurant.","나는 요리사가 되어서 내 식당을 열고 싶어요."],"ow":["오답 ✕ — 민주는 'I want to be a cook and open my own restaurant.'(나는 요리사가 되어서 내 식당을 열고 싶어요.)라고 했으므로 단순한 취미로 요리하고 싶다는 보기는 틀림.","오답 ✕ — 요리를 가르치는 선생님이 되고 싶다는 말은 대화에 없음. 민주는 'a cook'(요리사)이 되고 싶다고 했으므로 틀림.","오답 ✕ — 민주는 'I will open a big Korean restaurant in New York.'(저는 뉴욕에 큰 한식당을 열 거예요.)이라고 했으므로 한국이 아니라 뉴욕이고, 미국 식당도 아니라서 틀림.","정답 ○ — 'I want to be a cook and open my own restaurant.'(나는 요리사가 되어서 내 식당을 열고 싶어요.)라고 했으므로 맞음.","오답 ✕ — 한식당은 맞지만 장소가 틀림. 민주는 'in New York'(뉴욕에서)이라고 했는데 이 보기는 한국에서라고 해서 틀림."],"memo":["정답 ④: 요리사가 되어 자신의 식당을 열고 싶어 한다.","근거: I want to be a cook and open my own restaurant.(나는 요리사가 되어서 내 식당을 열고 싶어요.)","함정: ⑤ 한식당은 맞지만 한국이 아니라 뉴욕이라서 ✕"],"why":"민주는 요리사가 되어 뉴욕에 자기 한식당을 열고 싶어 한다."}],"dlg":[["M","Minju, what do you want to be in the future?","민주야, 너는 장래에 무엇이 되고 싶니?"],["G","I want to be a cook and open my own restaurant.","나는 요리사가 되어서 내 식당을 열고 싶어요."],["M","Sounds great! What kind of restaurant do you want to open?","멋지구나! 어떤 종류의 식당을 열고 싶니?"],["G","I will open a big Korean restaurant in New York.","저는 뉴욕에 큰 한식당을 열 거예요."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Kate's dog felt sick yesterday.","The boy feels sorry for Kate's dog.","Kate's dog is getting better thanks to a great vet.","The boy gives Kate information about a vet for her dog.","Kate's dream job is to be a vet."],"a":3,"ans":"The boy gives Kate information about a vet for her dog.","evs":[["B: I’m sorry, Kate. Is he okay now?","안됐다, Kate. 지금은 괜찮니?"],["G: He’s getting better. Luckily, I found a great vet.","점점 나아지고 있어. 다행히 훌륭한 수의사님을 찾았어."]],"ev":["B: I’m sorry, Kate. Is he okay now?","안됐다, Kate. 지금은 괜찮니?"],"ow":["오답 ✕ — 'My dog was very sick last night.'(우리 개가 어젯밤에 많이 아팠어.)라고 했으므로 Kate의 개가 아팠다는 보기는 일치함.","오답 ✕ — 소년이 'I’m sorry, Kate.'(안됐다, Kate.)라고 했으므로 안타까워한다는 보기는 일치함.","오답 ✕ — 'He’s getting better. Luckily, I found a great vet.'(점점 나아지고 있어. 다행히 훌륭한 수의사님을 찾았어.)라고 했으므로 일치함.","정답 ○ — 훌륭한 수의사를 찾은 사람은 Kate 자신('I found a great vet')이고 소년은 'I’m glad to hear that.'(그 말을 들으니 기쁘다.)이라고만 했으므로 소년이 정보를 줬다는 보기는 일치하지 않음.","오답 ✕ — 'When I grow up, I want to be a vet like her.'(나는 커서 그분 같은 수의사가 되고 싶어.)라고 했으므로 장래희망이 수의사라는 보기는 일치함."],"memo":["정답 ④ (일치하지 않는 것): 소년이 수의사 정보를 준 것(X) → Kate가 직접 수의사를 찾았다.","근거: Luckily, I found a great vet.(다행히 훌륭한 수의사님을 찾았어.)","함정: ⑤ Kate의 장래희망은 수의사가 맞는 말이라서 ✕"],"why":"훌륭한 수의사를 찾은 사람은 소년이 아니라 Kate 자신이다."}],"dlg":[["G","My dog was very sick last night.","우리 개가 어젯밤에 많이 아팠어."],["B","I’m sorry, Kate. Is he okay now?","안됐다, Kate. 지금은 괜찮니?"],["G","He’s getting better. Luckily, I found a great vet.","점점 나아지고 있어. 다행히 훌륭한 수의사님을 찾았어."],["B","I’m glad to hear that.","그 말을 들으니 기쁘다."],["G","When I grow up, I want to be a vet like her.","나는 커서 그분 같은 수의사가 되고 싶어."]]},{"qs":[{"n":3,"q":"위 대화의 제목으로 알맞은 것은?","o":["How Do Models Walk on Fashion Shows?","Let's Learn About Fashion Designers!","Keeping Secrets Between Friends","Dreaming of Living in Paris","What Is Your Dream Job?"],"a":4,"ans":"What Is Your Dream Job?","evs":[["G: What about you, Jake? What do you want to be?","너는 어때, Jake? 너는 뭐가 되고 싶어?"],["G: Thanks! My dream is to become a fashion designer. I want to have my own show in Paris.","고마워! 내 꿈은 패션 디자이너가 되는 거야. 나는 파리에서 내 쇼를 열고 싶어."]],"ev":["G: What about you, Jake? What do you want to be?","너는 어때, Jake? 너는 뭐가 되고 싶어?"],"ow":["오답 ✕ — 모델이 런웨이를 걷는 방법에 관한 내용은 대화에 없음. 'I want to be a model.'(나는 모델이 되고 싶어.)이라는 꿈만 말했으므로 틀림.","오답 ✕ — 패션 디자이너가 되는 방법을 배우는 내용이 아니라 두 친구가 각자 꿈을 말하는 대화라서 틀림. 하린이의 'My dream is to become a fashion designer.'(내 꿈은 패션 디자이너가 되는 거야.)는 그 중 하나일 뿐임.","오답 ✕ — 비밀에 관한 이야기는 대화에 전혀 없음. 'That’s a great dream.'(멋진 꿈이다.)처럼 서로의 꿈을 응원하는 내용이라서 틀림.","오답 ✕ — 'I want to have my own show in Paris.'(파리에서 내 쇼를 열고 싶어.)가 나오지만 파리에 사는 것이 꿈이라는 말은 아니고, 대화 전체를 담지 못해 틀림.","정답 ○ — 'What do you want to be?'(너는 뭐가 되고 싶어?)라는 질문에 하린이는 패션 디자이너, Jake는 모델이라고 답하므로 'What Is Your Dream Job?'이 제목으로 알맞음."],"memo":["정답 ⑤: What Is Your Dream Job?(너의 꿈의 직업은?)","근거: What do you want to be?(너는 뭐가 되고 싶어?) / My dream is to become a fashion designer.(내 꿈은 패션 디자이너가 되는 거야.)","함정: ④ 파리는 쇼를 여는 장소일 뿐 대화의 중심이 아니라서 ✕"],"why":"두 친구가 서로의 장래희망(꿈의 직업)을 이야기하는 대화이다."},{"n":4,"q":"위 대화에서 Jake가 장래에 되고 싶어 하는 것은?","o":["패션 디자이너","모델","사진작가","요리사","수의사"],"a":1,"ans":"모델","evs":[["B: I want to be a model. I enjoy being in front of the camera.","나는 모델이 되고 싶어. 나는 카메라 앞에 서는 걸 즐겨."],["B: That’s great! I hope I can be a model in your fashion shows.","좋아! 나는 내가 네 패션쇼에서 모델이 될 수 있기를 바라."]],"ev":["B: I want to be a model. I enjoy being in front of the camera.","나는 모델이 되고 싶어. 나는 카메라 앞에 서는 걸 즐겨."],"ow":["오답 ✕ — 패션 디자이너가 되고 싶은 사람은 Harin임. 'My dream is to become a fashion designer.'(내 꿈은 패션 디자이너가 되는 거야.)는 Harin의 말이라서 틀림.","정답 ○ — Jake가 'I want to be a model.'(나는 모델이 되고 싶어.)이라고 직접 말했으므로 맞음.","오답 ✕ — 사진작가 이야기는 대화에 없음. Jake는 'I enjoy being in front of the camera.'(카메라 앞에 서는 걸 즐겨.)라고 했으니 카메라 앞에 서는 모델이라서 틀림.","오답 ✕ — 요리사가 되고 싶다고 한 사람은 이 대화에 없음. 요리사는 다른 대화의 민주의 꿈임.","오답 ✕ — 수의사가 되고 싶다고 한 사람은 이 대화에 없음. Jake는 'I want to be a model.'(모델이 되고 싶어.)이라고 했으므로 틀림."],"memo":["정답 ②: Jake는 모델이 되고 싶어 한다.","근거: I want to be a model.(나는 모델이 되고 싶어.)","함정: ①은 패션 디자이너가 Jake가 아니라 Harin의 꿈이라서 ✕"],"why":"Jake의 꿈은 하린이의 패션쇼에서 서는 모델이다."}],"dlg":[["B","That’s a great drawing, Harin. You look like a designer.","정말 멋진 그림이야, 하린아. 너 디자이너 같아 보여."],["G","Thanks! My dream is to become a fashion designer. I want to have my own show in Paris.","고마워! 내 꿈은 패션 디자이너가 되는 거야. 나는 파리에서 내 쇼를 열고 싶어."],["B","That’s a great dream.","멋진 꿈이다."],["G","What about you, Jake? What do you want to be?","너는 어때, Jake? 너는 뭐가 되고 싶어?"],["B","I want to be a model. I enjoy being in front of the camera.","나는 모델이 되고 싶어. 나는 카메라 앞에 서는 걸 즐겨."],["G","Really? Maybe we can work together someday.","정말? 우리 언젠가 함께 일할 수도 있겠다."],["B","That’s great! I hope I can be a model in your fashion shows.","좋아! 나는 내가 네 패션쇼에서 모델이 될 수 있기를 바라."],["G","See you in Paris in 10 years!","10년 뒤에 파리에서 보자!"]]},{"qs":[{"n":5,"q":"What does the girl want to do in the future?","o":["예술가가 되고 싶어 한다.","개인 사업을 하고 싶어 한다.","경영학을 전공하고 싶어 한다.","가족 사업을 물려받고 싶어 한다.","다양한 예술을 즐기고 싶어 한다."],"a":1,"ans":"개인 사업을 하고 싶어 한다.","evs":[["G: I want to go to the business section. I want to run my own business someday.","나는 사업 구역에 가고 싶어. 언젠가 내 사업을 하고 싶거든."]],"ev":["G: I want to go to the business section. I want to run my own business someday.","나는 사업 구역에 가고 싶어. 언젠가 내 사업을 하고 싶거든."],"ow":["오답 ✕ — 'arts section'(예술 구역)에 가는 사람은 소년(Sam)임. 소녀는 'I want to go to the business section.'(나는 사업 구역에 가고 싶어.)이라고 했으므로 틀림.","정답 ○ — 소녀가 'I want to run my own business someday.'(언젠가 내 사업을 하고 싶거든.)라고 했으므로 개인 사업을 하고 싶어 한다는 보기가 맞음.","오답 ✕ — 'business section'(사업 구역)에 가고 싶다고 했을 뿐 경영학을 전공하고 싶다는 말은 없어서 틀림.","오답 ✕ — 'run my own business'(내 사업을 하다)라고 했지 가족 사업을 물려받는다는 말은 없어서 틀림.","오답 ✕ — 다양한 예술을 즐기고 싶다는 말은 없음. 예술 구역에 가는 사람은 소년이고 소녀는 사업 구역에 간다고 해서 틀림."],"memo":["정답 ②: 자기 사업(개인 사업)을 하고 싶어 한다.","근거: I want to run my own business someday.(언젠가 내 사업을 하고 싶거든.)","함정: ①은 예술 구역(arts section)에 가는 사람이 소년 Sam이라서 ✕"],"why":"소녀는 사업 구역에 가서 언젠가 자기 사업을 하고 싶어 한다."}],"dlg":[["G","I’m so excited for today’s job fair! Which section are you going to go to, Sam?","오늘 직업 박람회가 정말 기대돼! 너는 어느 구역에 갈 거니, Sam?"],["B","I’m going to go to the arts section. What about you?","나는 예술 구역에 갈 거야. 너는 어때?"],["G","I want to go to the business section. I want to run my own business someday.","나는 사업 구역에 가고 싶어. 언젠가 내 사업을 하고 싶거든."],["B","I hope we both get some useful information!","우리 둘 다 유용한 정보를 얻으면 좋겠다!"]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 제목으로 알맞은 것은?","o":["The Order of Editing Movies","What Makes an Artistic Scene?","Actor: The Key to Good Movies","The Power of Background Music","What Is the Role of a Foley Artist?"],"a":4,"ans":"What Is the Role of a Foley Artist?","evs":[["Last week, I had a short interview with Emma Han, a famous Foley artist.","지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다."],["Can you tell me about your job?","당신의 직업에 관해 말해 주시겠어요?"]],"ev":["Last week, I had a short interview with Emma Han, a famous Foley artist.","지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다."],"ow":["오답 ✕ — 영화 편집 순서 이야기는 글에 없음. 'Foley artists create various sounds for movies'(폴리 아티스트는 영화의 다양한 소리를 만들어요)처럼 소리를 만드는 직업 이야기라서 틀림.","오답 ✕ — 예술적인 장면이 만들어지는 이유는 글에 나오지 않음. 'Let's say there's a rainy scene.'(비 오는 장면이 있다고 가정해 봅시다.)은 소리를 만드는 예일 뿐이라서 틀림.","오답 ✕ — 'what do you pay attention to? The story, the actors, or the music?'(줄거리, 배우, 음악?)은 질문일 뿐, 글은 소리 담당 폴리 아티스트 이야기라서 배우가 핵심이라는 제목은 틀림.","오답 ✕ — 'or the music?'(음악?)이 한 번 나오지만 배경음악이 아니라 폴리 아티스트가 만드는 효과음이 중심이라서 틀림.","정답 ○ — 'Can you tell me about your job?'(당신의 직업에 관해 말해 주시겠어요?)로 시작해 폴리 아티스트가 하는 일을 설명하므로 폴리 아티스트의 역할이 제목으로 알맞음."],"memo":["정답 ⑤: What Is the Role of a Foley Artist?(폴리 아티스트의 역할은?)","근거: Can you tell me about your job?(당신의 직업에 관해 말해 주시겠어요?)","함정: ④ 음악은 도입 질문에만 나오고 글의 중심은 효과음이라서 ✕"],"why":"폴리 아티스트가 하는 일(역할)을 인터뷰로 소개하는 글이다."},{"n":7,"q":"윗글의 주제로 알맞은 것은?","o":["the differences in movie genres","types of staff in making a movie","the harmony of story and music","ways of becoming a movie director","the job of making sounds for movies"],"a":4,"ans":"the job of making sounds for movies","evs":[["Foley artists create various sounds for movies because actual sounds are not clear enough for movie scenes.","폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요."],["I use all kinds of everyday objects in fun and creative ways.","저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다."]],"ev":["Foley artists create various sounds for movies because actual sounds are not clear enough for movie scenes.","폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요."],"ow":["오답 ✕ — 영화 장르의 차이는 글에 전혀 나오지 않아 틀림. 글은 'Foley artists create various sounds for movies'(폴리 아티스트는 영화의 다양한 소리를 만들어요)에 관한 것임.","오답 ✕ — 영화를 만드는 여러 스태프를 소개하는 글이 아니라 한 직업(폴리 아티스트)의 일을 자세히 말하는 글이라서 범위가 어긋남.","오답 ✕ — 줄거리와 음악은 'The story, the actors, or the music?'(줄거리, 배우, 음악?)이라는 도입 질문에만 나오고 둘의 조화에 대한 내용은 없어서 틀림.","오답 ✕ — 영화감독이 되는 방법이 아니라 'What can we do to become a Foley artist?'(폴리 아티스트가 되려면?)에 관한 이야기라서 틀림.","정답 ○ — 폴리 아티스트가 일상의 물건으로 영화의 소리를 만드는 일에 대한 글이므로 영화를 위한 소리를 만드는 직업이 주제임."],"memo":["정답 ⑤: the job of making sounds for movies(영화를 위한 소리를 만드는 직업)","근거: Foley artists create various sounds for movies...(폴리 아티스트는 영화의 다양한 소리를 만들어요)","함정: ④ 영화감독이 아니라 폴리 아티스트가 되는 방법이라서 ✕"],"why":"영화 소리를 만드는 폴리 아티스트의 일이 주제이다."},{"n":8,"q":"윗글의 내용을 요약할 때, 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["clear - fry","clear - boil","loud - fry","soft - hit","real - cut"],"a":0,"ans":"clear - fry","evs":[["Foley artists create various sounds for movies because actual sounds are not clear enough for movie scenes.","폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요."],["For example, I fry bacon to create rain sounds.","예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요."]],"ev":["Foley artists create various sounds for movies because actual sounds are not clear enough for movie scenes.","폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요."],"ow":["정답 ○ — 'actual sounds are not clear enough'(실제 소리들이 충분히 분명하지 않아요)와 'I fry bacon to create rain sounds'(빗소리를 만들기 위해 베이컨을 튀겨요)가 그대로 나오므로 clear - fry가 맞음.","오답 ✕ — (A) clear는 맞지만 (B)가 틀림. 본문은 'I fry bacon'(베이컨을 튀겨요)이라고 했지 삶는다(boil)는 말은 없어서 틀림.","오답 ✕ — (B) fry는 맞지만 (A) loud가 틀림. 본문은 소리가 시끄럽지 않아서가 아니라 'not clear enough'(충분히 분명하지 않아서)라고 했으므로 틀림.","오답 ✕ — 빗소리가 'too soft'(너무 부드러워서)라는 말은 있지만 (A)는 'not clear enough'가 이유이고, (B)도 hit이 아니라 베이컨을 튀기는 것(fry)이라서 틀림.","오답 ✕ — 'actual sounds'(실제 소리)가 충분히 분명하지 않다는 것이지 real이 부족하다는 말이 아니고, 베이컨은 자르는(cut) 것이 아니라 튀기는(fry) 것이라서 틀림."],"memo":["정답 ①: clear - fry","근거: actual sounds are not clear enough(실제 소리들이 충분히 분명하지 않아요) / I fry bacon to create rain sounds(빗소리를 만들기 위해 베이컨을 튀겨요)","함정: ③ loud가 아니라 clear(분명한)가 본문의 단어라서 ✕"],"why":"실제 소리가 분명하지 않아서 베이컨을 튀기는 등 일상 물건으로 소리를 만든다.","sum":"Foley artists make sounds for movies because actual sounds are not (A)______ enough. For example, they (B)______ bacon to create rain sounds.","lab":"요약문 완성"},{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["I interviewed a famous art director, Ms. Han.","Real sounds are the best sounds for movies.","Ms. Han raises the volume of real rain sounds for a rainy scene.","Ms. Han uses coconut shells to make sounds.","You should first study unusual sounds to be a Foley artist."],"a":3,"ans":"Ms. Han uses coconut shells to make sounds.","evs":[["To make the sounds of a horse walking, I hit two coconut shells together.","말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠."]],"ev":["To make the sounds of a horse walking, I hit two coconut shells together.","말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠."],"ow":["오답 ✕ — 'a famous Foley artist'(유명한 폴리 아티스트)라고 했는데, 이 보기는 아트 디렉터라고 해서 틀림.","오답 ✕ — 'actual sounds are not clear enough'(실제 소리들은 충분히 분명하지 않아요)라고 했으므로 실제 소리가 가장 좋다는 보기는 반대로 말해서 틀림.","오답 ✕ — 'The actual sounds of rain are too soft, so we have to make rain sounds and add them to the scene.'(실제 빗소리는 너무 부드러워서 빗소리를 만들어 추가해요.)라고 했으므로 실제 빗소리의 볼륨을 키운다는 말은 없어서 틀림.","정답 ○ — 'To make the sounds of a horse walking, I hit two coconut shells together.'(말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.)라고 했으므로 Han 씨가 코코넛 껍질로 소리를 낸다는 보기가 맞음.","오답 ✕ — 'You can just start by playing with sounds.'(그저 소리를 가지고 노는 것으로 시작할 수 있어요.)라고 했는데, 이 보기는 특이한 소리를 먼저 공부하라고 해서 틀림."],"memo":["정답 ④: Han 씨는 코코넛 껍질로 소리를 만든다(말이 걷는 소리).","근거: I hit two coconut shells together.(코코넛 껍질 두 개를 맞부딪치죠.)","함정: ⑤ 공부가 아니라 소리를 가지고 놀며 시작하라고 했어서 ✕"],"why":"말이 걷는 소리를 코코넛 껍질 두 개를 맞부딪쳐서 만든다."},{"n":10,"q":"Ms. Han이 폴리 아티스트가 되고 싶은 사람에게 한 조언으로 알맞은 것은?","o":["특별한 도구를 반드시 사야 한다.","일상적인 물건으로 소리를 내며 놀아 보는 것으로 시작하면 된다.","영화를 많이 보는 것에만 집중해야 한다.","주변의 소리는 신경 쓰지 말아야 한다.","펜과 연필은 같은 소리가 나니 하나만 쓰면 된다."],"a":1,"ans":"일상적인 물건으로 소리를 내며 놀아 보는 것으로 시작하면 된다.","evs":[["You can just start by playing with sounds.","여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요."],["You don't have to use special tools to make different sounds.","다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요."]],"ev":["You can just start by playing with sounds.","여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요."],"ow":["오답 ✕ — 'You don't have to use special tools to make different sounds.'(다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요.)라고 했으므로 반드시 사야 한다는 보기는 반대로 말해서 틀림.","정답 ○ — 'You can just start by playing with sounds.'(그저 소리를 가지고 노는 것으로 시작할 수 있어요.)와 'Just try with everyday objects.'(그냥 일상적인 물건들로 시도해 보세요.)라고 했으므로 맞음.","오답 ✕ — 영화를 많이 보라는 말은 글에 없음. 조언은 소리를 가지고 놀아 보라는 것이라서 틀림.","오답 ✕ — 'You should pay more attention to every sound around you.'(주변의 모든 소리에 더 많이 귀를 기울여야 합니다.)라고 했으므로 신경 쓰지 말라는 보기는 반대로 말해서 틀림.","오답 ✕ — 'Hit your desk with a pen and then with a pencil. The two sounds are not the same.'(펜과 연필로 쳐 보세요. 두 소리는 같지 않아요.)라고 했으므로 같은 소리가 난다는 보기는 틀림."],"memo":["정답 ②: 일상적인 물건으로 소리를 내며 놀아 보는 것으로 시작한다.","근거: You can just start by playing with sounds.(그저 소리를 가지고 노는 것으로 시작할 수 있어요.)","함정: ⑤ 펜과 연필 소리는 같지 않다고(not the same) 해서 ✕"],"why":"특별한 도구 없이 일상 물건으로 소리를 가지고 놀며 시작하라는 조언이다."}],"pp":[["Interview with Emma Han","Emma Han과의 인터뷰"],["When you watch a movie, what do you pay attention to?","당신은 영화를 볼 때 무엇에 주목하나요?"],["The story, the actors, or the music?","줄거리, 배우, 아니면 음악?"],["What about the sounds?","소리는 어떤가요?"],["Last week, I had a short interview with Emma Han, a famous Foley artist.","지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다."],["Q.","질문:"],["Hello, Ms. Han.","안녕하세요, Han 선생님."],["Can you tell me about your job?","당신의 직업에 관해 말해 주시겠어요?"],["Sure!","그러죠!"],["Foley artists create various sounds for movies because actual sounds are not clear enough for movie scenes.","폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요."],["Let's say there's a rainy scene.","비 오는 장면이 있다고 가정해 봅시다."],["The actual sounds of rain are too soft, so we have to make rain sounds and add them to the scene.","실제 빗소리는 너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요."],["Q.","질문:"],["How do you make sounds?","어떻게 소리를 만드나요?"],["I use all kinds of everyday objects in fun and creative ways.","저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다."],["For example, I fry bacon to create rain sounds.","예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요."],["For the sounds of ice skating, I move a pair of scissors across a desk.","얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요."],["To make the sounds of a horse walking, I hit two coconut shells together.","말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠."],["Q.","질문:"],["How interesting!","정말 흥미롭네요!"],["What can we do to become a Foley artist?","우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?"],["You can just start by playing with sounds.","여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요."],["You don't have to use special tools to make different sounds.","다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요."],["Just try with everyday objects.","그냥 일상적인 물건들로 시도해 보세요."],["Hit your desk with a pen and then with a pencil.","책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요."],["The two sounds are not the same.","이 두 가지 소리는 같지 않아요."],["You should pay more attention to every sound around you.","여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다."],["Then, you can find new ways of creating sounds.","그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요."],["Q.","질문:"],["It sounds like an interesting job.","흥미로운 직업 같아요."],["Thank you for the interview, Ms. Han.","인터뷰해 주셔서 감사합니다, Han 선생님."],["Thank you for having me.","저를 인터뷰해 주셔서 감사합니다."]]}];

var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=partsHtml();
 document.getElementById('app').innerHTML=h;relayUp();if(typeof persist==='function')persist();

}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}

var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
