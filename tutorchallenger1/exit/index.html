opts":["The woman cannot find any phone to buy.","In the story, Goldilocks always picks the cheapest item.","Many companies take advantage of the Goldilocks effect.","Companies release only a low-budget version of their items."],"r":{"a":"3) Many companies take advantage of the Goldilocks effect. (많은 기업들이 골디락스 효과를 이용한다.)","ev":"1~1번 문장","s":[[11,"Many companies take advantage of the Goldilocks effect.","많은 기업들이 골디락스 효과를 이용한다."]],"w":"11번 Many companies take advantage of the Goldilocks effect(많은 기업들이 골디락스 효과를 이용한다)와 같아요.","c":3},"h":"3901548401"},{"n":9,"t":"sum","q":"A woman wants to buy a new phone, and there are many (A) to choose from, some with many (B).","ko":"한 여성이 새 휴대전화를 사길 원하는데, 고를 수 있는 (A)이(가) 많고 일부는 (B)이(가) 많다.","oko":["(A) 모델 / (B) 기능","(A) 모델 / (B) 문제","(A) 상점 / (B) 기능","(A) 상점 / (B) 문제","(A) 색깔 / (B) 가격"],"opts":["(A) models / (B) features","(A) models / (B) problems","(A) stores / (B) features","(A) stores / (B) problems","(A) colors / (B) prices"],"r":{"a":"1) (A) models / (B) features ((A) 모델 / (B) 기능)","ev":"1~2번 문장","s":[[1,"A woman wants to buy a new phone, but there are many models to choose from.","한 여성이 새 휴대전화를 사길 원하지만, 고를 수 있는 모델이 많다."],[2,"Some are expensive and have many features, while others are quite cheap but have few features.","일부는 비싸고 많은 기능이 있고, 반면 다른 것들은 상당히 저렴하지만 기능이 거의 없다."]],"w":"1번 there are many models to choose from(고를 수 있는 모델이 많다), 2번 have many features(많은 기능이 있다)를 줄인 문장이에요.","c":1},"h":"831d983351"},{"n":10,"t":"fill","q":"In the story, a girl named Goldilocks makes a series of [A], always choosing the [B] in the middle.","ko":"이 이야기에서 골디락스라는 소녀는 일련의 [A]을(를) 하는데 항상 중간에 있는 [B]을(를) 선택한다.","bank":["choices","option","extremes","effect","strategy","quality"],"bko":{"choices":"선택(choice의 복수형)","option":"옵션","extremes":"극단","effect":"효과","strategy":"전략","quality":"품질"},"r":{"a":"[A] choices (선택(choice의 복수형)), [B] option (옵션)","ev":"7번 문장","s":[[7,"In the story, a girl named Goldilocks makes a series of choices, always choosing the option in the middle.","이 이야기에서 골디락스라는 소녀는 일련의 선택을 하는데 항상 중간에 있는 옵션을 선택한다."]],"w":"7번 문장 그대로예요. a series of 뒤에는 복수명사 choices(선택들)가 오고, the ___ in the middle에는 단수명사 option(옵션)이 와요.","c":null},"h":"e9a95e041e"}]},{"u":4,"id":"ch1-04-1","no":1,"ko":"하나쯤은 괜찮다고?","items":[{"n":1,"t":"tf","q":"Old shells break down and provide nutrients for living things in the sand.","ko":"오래된 조개껍데기는 분해되어 모래 속에 사는 생물에게 영양분을 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Additionally, ocean birds can use them to build nests, and old shells break down and provide nutrients for organisms living in the sand.","게다가, 바닷새들이 둥지를 짓는 데 그것들을 사용할 수 있고, 오래된 조개껍데기들은 분해되어 모래에 살고 있는 유기체들에게 영양분을 제공한다."]],"w":"7번 문장과 같은 내용이에요. 오래된 껍데기는 분해되어 모래에 사는 생물에게 영양분을 줘요.","c":"T"},"h":"bfe4004f08"},{"n":2,"t":"tf","q":"Shells protect beach grass but cannot keep sand from blowing away.","ko":"조개껍데기는 해변의 풀을 보호하지만 모래가 날아가는 것은 막을 수 없다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Firstly, they protect beach grass and keep sand from blowing away.","우선, 조개껍데기들은 해변의 풀을 보호하고 모래가 날아가는 것을 막아 준다."]],"w":"5번 문장에서 껍데기는 풀을 보호하고 모래가 날아가는 것도 막아 준다고 해요. '막을 수 없다'는 틀려요.","c":"F"},"h":"d683d7db2e"},{"n":3,"t":"tf","q":"Researchers found that the number of shells on a popular beach in Spain had increased since 1978.","ko":"연구원들은 스페인의 인기 있는 해변에서 조개껍데기의 수가 1978년 이래로 증가했음을 알아냈다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Researchers studied a popular tourist beach in Spain and found that the number of shells had decreased by 60% since 1978, which will likely lead to a serious decline in the health of the beach.","연구원들은 스페인의 한 인기 있는 관광 해변을 연구했는데, 조개껍데기의 수가 1978년 이래로 60% 감소했음을 알아냈고, 이는 해변 건강의 심각한 쇠퇴를 초래할 수 있다."]],"w":"9번 문장에서 1978년 이래 60% '감소'했다고 해요. 증가했다는 것은 반대예요.","c":"F"},"h":"6fd262634c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Shells fulfill several crucial functions on beaches...)","ko":"조개껍데기들은 해변에서 몇 가지 중요한 기능을 수행한다...","opts":["사소한","우연한","중대한, 결정적인","인기 있는"],"word":"crucial","r":{"a":"3) 중대한, 결정적인","ev":"4번 문장","s":[[4,"Shells fulfill several crucial functions on beaches, so taking them can harm the environment.","조개껍데기들은 해변에서 몇 가지 중요한 기능을 수행하기 때문에, 그것들을 가져가는 것은 환경을 훼손할 수 있다."]],"w":"그래서(so) 가져가면 환경을 훼손할 수 있다고 이어지니, 껍데기가 하는 일은 매우 중요하다는 뜻이에요. crucial = 중대한, 결정적인.","c":3},"h":"1c6371ecc2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...this action may have consequences.)","ko":"...이 행동은 결과가 따를 수 있다.","opts":["이유","결과","기회","규칙"],"word":"consequences","r":{"a":"2) 결과","ev":"3번 문장","s":[[3,"Think again, because this action may have consequences.","다시 생각해 봐라, 왜냐하면 이 행동은 결과가 따르기 때문이다."]],"w":"this action(껍데기를 가져가는 행동) 뒤에 따라오는 일이므로 consequences = 결과예요. because 앞에 있어서 '이유'로 헷갈리기 쉬워요.","c":2},"h":"1666fd6219"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhy not pick up some seashells and take them home?","ko":"밑줄 친 them이 가리키는 것은?","sko":"조개껍데기를 조금 주워서 집으로 가져가는 건 어떤가?","opts":["조개껍데기","해변","집","사람들"],"r":{"a":"1) 조개껍데기","ev":"2번 문장","s":[[2,"Why not pick up some seashells and take them home?","조개껍데기를 조금 주워서 집으로 가져가는 건 어떤가?"]],"w":"pick up some seashells and take them home(조개껍데기를 주워서 집으로 가져가다)에서 them은 앞의 some seashells를 가리켜요.","c":1,"k":"them = 조개껍데기"},"pron":"them","h":"f7923dcd17"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Think of how many people visit beaches each year, and how many shells would go missing if everyone took just one.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"매년 얼마나 많은 사람들이 해변을 방문하는지, 그리고 모두 한 개씩 가져간다면 얼마나 많은 조개껍데기가 사라질 지 생각해 봐라.","opts":["한 사람이 한 개씩만 가져가도 방문객이 많으면 사라지는 조개껍데기는 아주 많다.","해변을 찾는 사람이 줄어들면 조개껍데기가 더 많아진다.","모두가 한 개씩만 가져가면 조개껍데기는 거의 사라지지 않는다.","조개껍데기를 하나 가져가면 해변의 생물이 곧바로 죽는다."],"r":{"a":"1) 한 사람이 한 개씩만 가져가도 방문객이 많으면 사라지는 조개껍데기는 아주 많다.","ev":"8번 문장","s":[[8,"Think of how many people visit beaches each year, and how many shells would go missing if everyone took just one.","매년 얼마나 많은 사람들이 해변을 방문하는지, 그리고 모두 한 개씩 가져간다면 얼마나 많은 조개껍데기가 사라질 지 생각해 봐라."]],"w":"each year는 해마다 찾는 사람이 많다는 뜻이고, if everyone took just one은 한 개씩만 가져가도 라는 가정이에요. 그러면 많은 껍데기가 go missing(사라지다) 해요.","c":1},"h":"bf98d2a2a3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["많은 사람들이 해변에서의 하루를 생각나게 해줄 무언가를 원할지도 모른다.","바닷새들은 오래된 조개껍데기를 주된 먹이로 먹는다.","연구원들은 스페인 해변의 조개껍데기 수가 1978년 이래로 변하지 않았다고 말한다.","조개껍데기를 하나쯤 가져가는 것은 해변에 영향을 주지 않는다."],"opts":["Many people might want something to remind them of a day at the beach.","Ocean birds eat old shells as their main food.","Researchers say the number of shells on a Spanish beach has not changed since 1978.","Taking just one shell home does not affect the beach."],"r":{"a":"1) Many people might want something to remind them of a day at the beach. (많은 사람들이 해변에서의 하루를 생각나게 해줄 무언가를 원할지도 모른다.)","ev":"1번 문장","s":[[1,"A day at the beach is a special and memorable occasion, and many people might want something to remind them of their visit.","해변에서의 하루는 특별하고 기억에 남는 일이며, 많은 사람들이 자신들의 방문을 생각나게 해줄 무언가를 원할지도 모른다."]],"w":"1번 many people might want something to remind them of their visit(많은 사람들이 방문을 생각나게 해줄 무언가를 원할지도 모른다)와 같아요. 바닷새들은 조개껍데기로 둥지를 지어요.","c":1},"h":"f50a96a2ba"},{"n":9,"t":"sum","q":"Shells also serve as (A) for hermit crabs and (B) places for small fish.","ko":"조개껍데기는 또한 소라게들의 (A)이(가) 되고 작은 물고기들의 (B) 장소가 되어 준다.","oko":["(A) 먹이 / (B) 수영하는","(A) 서식처 / (B) 숨는","(A) 먹이 / (B) 숨는","(A) 장난감 / (B) 수영하는","(A) 서식처 / (B) 쇼핑하는"],"opts":["(A) food / (B) swimming","(A) habitats / (B) hiding","(A) food / (B) hiding","(A) toys / (B) swimming","(A) habitats / (B) shopping"],"r":{"a":"2) (A) habitats / (B) hiding ((A) 서식처 / (B) 숨는)","ev":"6번 문장","s":[[6,"They also serve as essential habitats for hermit crabs and hiding places for small fish.","그것들은 또한 소라게들의 필수적인 서식처가 되고 작은 물고기들의 은신처로서의 역할을 한다."]],"w":"6번 essential habitats for hermit crabs and hiding places for small fish(소라게들의 필수적인 서식처와 작은 물고기들의 은신처)에서 habitats와 hiding이 답이에요.","c":2},"h":"074013349c"},{"n":10,"t":"fill","q":"So if you're interested in taking home a [A] memory of your day at a beautiful beach, take a [B] instead.","ko":"그러니 아름다운 해변에서 당신의 하루의 [A] 기억을 집으로 가져가고 싶다면, 대신에 [B]을(를) 찍어라.","bank":["permanent","photograph","nutrients","organisms","habitats","beaches"],"bko":{"permanent":"영구적인","photograph":"사진","nutrients":"영양분(nutrient의 복수형)","organisms":"유기체(organism의 복수형)","habitats":"서식처(habitat의 복수형)","beaches":"해변(beach의 복수형)"},"r":{"a":"[A] permanent (영구적인), [B] photograph (사진)","ev":"1~0번 문장","s":[[10,"So if you’re interested in taking home a permanent memory of your day at a beautiful beach, take a photograph instead.","그러니 아름다운 해변에서 당신의 하루의 영구적인 기억을 집으로 가져가고 싶다면, 대신에 사진을 찍어라."]],"w":"10번 a permanent memory(영구적인 기억)는 memory를 꾸미는 형용사, take a photograph(사진을 찍다)는 a 뒤에 단수 명사가 와요. 복수형 단어들은 a 뒤에 올 수 없어요.","c":null},"h":"2278022fd6"}]},{"u":4,"id":"ch1-04-2","no":2,"ko":"이보다 더 추울 순 없다!","items":[{"n":1,"t":"tf","q":"The lowest temperature ever recorded in Oymyakon was -71.2˚C.","ko":"오이먀콘에서 기록된 가장 낮은 기온은 섭씨 영하 71.2도였다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Oymyakon’s coldest recorded temperature was -71.2˚C.","오이먀콘의 기록된 최저 기온은 섭씨 영하 71.2도였다."]],"w":"4번 문장과 같은 내용이에요. 기록된 최저 기온이 -71.2˚C예요.","c":"T"},"h":"24acdc5b49"},{"n":2,"t":"tf","q":"In December, the daylight in Oymyakon lasts about twelve hours a day.","ko":"12월에 오이먀콘의 일광 시간은 하루 약 열두 시간 계속된다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"In December, the daylight lasts only three hours per day, and the town remains about -45˚C on average.","12월에는 일광 시간이 하루에 오직 세 시간 계속될 뿐이며, 마을은 평균적으로 대략 영하 45도를 유지한다."]],"w":"7번 문장에서 12월의 일광 시간은 하루 세 시간뿐이라고 해요. 열두 시간은 틀려요.","c":"F"},"h":"fc8bf45757"},{"n":3,"t":"tf","q":"Villagers often turn off their car engines because it is easy to restart them in freezing weather.","ko":"마을 사람들은 매우 추운 날씨에서 엔진의 시동을 다시 거는 것이 쉬워서 종종 차의 시동을 끈다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Cars are often left running because it’s hard to restart the engines in freezing weather.","차는 종종 시동을 건 채로 두는데, 매우 추운 날씨에서는 엔진의 시동을 다시 거는 것이 어렵기 때문이다."]],"w":"10번 문장에서 다시 시동을 걸기 어려워서 시동을 건 채로 둔다고 해요. 쉽다는 것은 반대예요.","c":"F"},"h":"10d8a6fedb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...water freezes immediately upon touching the air.)","ko":"...물은 공기에 닿자마자 즉시 얼어 버린다.","opts":["천천히","가끔","결국","즉시"],"word":"immediately","r":{"a":"4) 즉시","ev":"8번 문장","s":[[8,"It’s so cold that water freezes immediately upon touching the air.","날씨가 너무 추워서, 물은 공기에 닿자마자 즉시 얼어 버린다."]],"w":"너무 추워서(so cold that) 공기에 닿자마자(upon touching) 얼어 버린다는 흐름이에요. immediately = 즉시.","c":4},"h":"22a7dfe8a1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the cold prevents cell phones from working.)","ko":"...추위로 인해 휴대 전화가 작동되지 않는다.","opts":["돕다","막다, 방해하다","바꾸다","알리다"],"word":"prevents","r":{"a":"2) 막다, 방해하다","ev":"11번 문장","s":[[11,"Communication is also difficult because the cold prevents cell phones from working.","또한, 추위로 인해 휴대 전화가 작동되지 않아서 의사소통도 어렵다."]],"w":"prevent A from v-ing는 'A가 ~하는 것을 막다'예요. 추위가 휴대 전화의 작동을 막으니 prevent = 막다, 방해하다.","c":2},"h":"d1da137f98"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nIt is named after the nearby river, which does not freeze.","ko":"밑줄 친 which가 가리키는 것은?","sko":"이 이름은 근처의 강에서 따왔는데, 이 강은 얼지 않는다.","opts":["강","마을","이름","물"],"r":{"a":"1) 강","ev":"6번 문장","s":[[6,"It is named after the nearby river, which does not freeze.","이 이름은 근처의 강에서 따왔는데, 이 강은 얼지 않는다."]],"w":"the nearby river, which does not freeze(근처의 강, 그 강은 얼지 않는다)에서 which는 바로 앞의 the nearby river를 가리켜요.","c":1,"k":"which = 강"},"pron":"which","h":"c3ef30aad1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A visit to the Russian village of Oymyakon might change your ideas about the cold.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"러시아의 마을 오이먀콘으로의 방문은 추위에 대한 당신의 생각을 바꿀지도 모른다.","opts":["러시아의 마을 오이먀콘을 방문하면 추위에 대한 생각이 달라질 수도 있다.","오이먀콘에 가면 추위를 전혀 느끼지 않는다.","추위를 좋아하는 사람만 오이먀콘을 방문할 수 있다.","러시아의 다른 마을을 방문하면 추위가 덜 느껴질 것이다."],"r":{"a":"1) 러시아의 마을 오이먀콘을 방문하면 추위에 대한 생각이 달라질 수도 있다.","ev":"2번 문장","s":[[2,"A visit to the Russian village of Oymyakon might change your ideas about the cold.","러시아의 마을 오이먀콘으로의 방문은 추위에 대한 당신의 생각을 바꿀지도 모른다."]],"w":"might change your ideas about the cold는 '추위에 대한 생각을 바꿀지도 모른다'는 뜻이에요.","c":1},"h":"a7197d4982"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마을 주민들은 온기를 위해 나무나 석탄을 땐다.","마을에는 큰 가게가 여러 곳 있다.","마을 근처의 강은 겨울마다 얼어붙는다.","마을 사람들은 현대 도시와 같은 편의 시설을 누린다."],"opts":["Villagers burn wood or coal to keep warm.","There are several large stores in the town.","The river near the village freezes every winter.","Villagers enjoy the same conveniences as people in modern cities."],"r":{"a":"1) Villagers burn wood or coal to keep warm. (마을 주민들은 온기를 위해 나무나 석탄을 땐다.)","ev":"1~3번 문장","s":[[13,"They have to burn wood or coal for warmth, and they can only buy basic goods from the one and only store in town.","그들은 온기를 위해 나무나 석탄을 때야 하고, 마을의 단 하나뿐인 가게에서 기본 물품을 살 수밖에 없다."]],"w":"13번 They have to burn wood or coal for warmth(그들은 온기를 위해 나무나 석탄을 때야 한다)와 같아요. 가게는 마을에 단 하나뿐이에요.","c":1},"h":"abe8f4913f"},{"n":9,"t":"sum","q":"Oymyakon is the (A) village on earth, and batteries (B) their power very quickly there.","ko":"오이먀콘은 지구상에서 가장 (A) 마을이며, 그곳에서는 배터리가 매우 빠르게 힘을 (B).","oko":["(A) 따뜻한 / (B) 얻는다","(A) 추운 / (B) 잃는다","(A) 작은 / (B) 얻는다","(A) 추운 / (B) 얻는다","(A) 따뜻한 / (B) 잃는다"],"opts":["(A) warmest / (B) gain","(A) coldest / (B) lose","(A) smallest / (B) gain","(A) coldest / (B) gain","(A) warmest / (B) lose"],"r":{"a":"2) (A) coldest / (B) lose ((A) 추운 / (B) 잃는다)","ev":"3번, 9번 문장","s":[[3,"That’s because Oymyakon, “the Pole of Cold,” is the coldest village on earth!","그것은 ‘한극(寒極)’인 오이먀콘이 지구상에서 가장 추운 마을이기 때문이다!"],[9,"There are other issues: Batteries lose their power very quickly, pen ink freezes, and people cannot wear glasses because they will freeze!","다른 문제들도 있는데, 배터리가 매우 빨리 방전되고, 펜의 잉크는 얼어 버리며, 사람들은 안경이 얼어 버리기 때문에 쓸 수 없다!"]],"w":"3번 the coldest village on earth(지구상에서 가장 추운 마을), 9번 Batteries lose their power very quickly(배터리가 매우 빨리 방전된다)를 줄인 문장이에요.","c":2},"h":"e6887fcb11"},{"n":10,"t":"fill","q":"Oymyakon’s community has [A] to the harsh environment and [B] happy despite the town’s extreme conditions.","ko":"오이먀콘의 공동체는 혹독한 환경에 [A] 마을의 극심한 환경에도 불구하고 여전히 행복하게 [B].","bank":["adapted","remains","freezes","prevents","restart","burn"],"bko":{"adapted":"적응했다","remains":"~한 상태이다","freezes":"얼다","prevents":"막다","restart":"다시 시동 걸다","burn":"태우다"},"r":{"a":"[A] adapted, [B] remains","ev":"14번 문장","s":[[14,"Nevertheless, Oymyakon’s community of hunters, reindeer farmers, and fishermen has adapted to the harsh environment and remains happy despite the town’s extreme conditions.","그럼에도 불구하고, 오이먀콘의 사냥꾼, 순록 농장주, 어부들은 혹독한 환경에 적응해 왔으며, 마을의 극심한 환경에도 불구하고 여전히 행복하게 지낸다."]],"w":"14번 문장을 그대로 써요. has 뒤에는 과거분사 adapted가 오고, adapted to는 '~에 적응하다'예요. happy 앞에는 remain + 형용사(계속 ~한 상태이다)의 remains가 와요.","c":null},"h":"6b283f94c9"}]},{"u":4,"id":"ch1-04-3","no":3,"ko":"당신이 모르는 당근 이야기","items":[{"n":1,"t":"tf","q":"Most carrots were purple before the late 16th century.","ko":"16세기 후반 이전에는 대부분의 당근이 보라색이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Before that time, most carrots were purple.","그 시기 이전에는 대부분의 당근이 보라색이었다."]],"w":"5번 문장과 같은 내용이에요. 그 시기 이전에는 대부분의 당근이 보라색이었어요.","c":"T"},"h":"bdfc6cee1d"},{"n":2,"t":"tf","q":"Modern-day orange carrots are a cross of only purple and yellow carrots.","ko":"오늘날의 주황색 당근은 보라색 당근과 노란색 당근만의 교배종이다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[6,"There were a few, however, that were yellow or white.","하지만 적은 수의 노란색 또는 흰색이었던 당근이 있었다."],[7,"These mutations lacked the purple pigment found in other carrots.","이 변종들은 다른 당근에서 발견되는 보라색 색소가 없었다."],[8,"Modern-day orange carrots are a cross of these two types of mutations, along with some species of wild carrots.","오늘날의 주황색 당근은 몇 가지 야생 당근 종과 더불어 이 두 가지 종류의 변종들의 교배종이다."]],"w":"8번 문장에서 주황색 당근은 (노란색·흰색) 두 종류의 변종과 몇 가지 야생 당근 종의 교배종이라고 해요. 보라색과 노란색만이라는 말은 틀려요.","c":"F"},"h":"e26959562e"},{"n":3,"t":"tf","q":"Everyone agrees on why orange carrots became more popular than purple ones.","ko":"모든 사람이 왜 주황색 당근이 보라색 당근보다 더 인기 있게 되었는지에 동의한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"No one is sure exactly why orange carrots became so much more popular than traditional purple ones.","아무도 왜 주황색 당근이 전통적인 보라색 당근보다 훨씬 더 인기 있게 되었는지 정확히 모른다."]],"w":"9번 문장에서 아무도 정확한 이유를 모른다고 해요. 모두 동의한다는 것은 반대예요.","c":"F"},"h":"6636d8a147"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...modern carrots were not cultivated until the late 16th century...)","ko":"...오늘날의 당근은 16세기 후반이 되어서야 재배되었다...","opts":["수입된","요리된","재배된","수확된"],"word":"cultivated","r":{"a":"3) 재배된","ev":"4번 문장","s":[[4,"This is because modern carrots were not cultivated until the late 16th century, when Dutch farmers created them through cross-breeding.","이것은 오늘날의 당근이 16세기 후반이 되어서야 비로소 재배되었기 때문인데, 그때 네덜란드 농부들이 품종 간 교배를 통해 그것들을 만들어냈다."]],"w":"네덜란드 농부들이 교배로 오늘날의 당근을 만들어낸 시기를 말하니 cultivate = 재배하다예요.","c":3},"h":"5827ad917c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the real reason is a more practical one...)","ko":"...진짜 이유는 좀 더 실용적인 것이다...","opts":["실용적인","화려한","전통적인","비싼"],"word":"practical","r":{"a":"1) 실용적인","ev":"11번 문장","s":[[11,"However, others believe the real reason is a more practical one—orange carrots are simply sweeter and bigger than purple ones.","그러나, 다른 사람들은 진짜 이유는 좀 더 실용적인 것이라고 믿는데, 단순히 주황색 당근이 보라색 당근보다 더 달고 더 크기 때문이라는 것이다."]],"w":"뒤에서 주황색 당근이 더 달고 더 크다는 쓸모 있는 이유를 말해요. 왕실의 색깔 같은 이유와 대비되므로 practical = 실용적인.","c":1},"h":"95750661a5"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThere were a few, however, that were yellow or white.","ko":"밑줄 친 that이 가리키는 것은?","sko":"하지만 적은 수의 노란색 또는 흰색이었던 당근이 있었다.","opts":["대부분의 당근","소수의 당근","네덜란드 농부들","보라색 색소"],"r":{"a":"2) 소수의 당근","ev":"6번 문장","s":[[6,"There were a few, however, that were yellow or white.","하지만 적은 수의 노란색 또는 흰색이었던 당근이 있었다."]],"w":"There were a few, however, that were yellow or white에서 that은 a few(적은 수의 당근)를 가리켜요.","c":2,"k":"that = 소수의 당근"},"pron":"that","h":"d2aaed2eff"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But if you had asked people the same question before the 17th century, they probably would have said “purple.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 당신이 17세기 이전에 사람들에게 같은 질문을 했다면, 그들은 아마도 ‘보라색’이라고 했을 것이다.","opts":["17세기 이전에는 사람들에게 이런 질문을 한 적이 없어서 대답이 없었다.","17세기 이전 사람들은 이 질문에 실제로 ‘보라색’이라고 대답했다.","17세기 이전에 같은 질문을 했다면 사람들은 아마 ‘주황색’이라고 했을 것이다.","17세기 이전에 같은 질문을 했다면 사람들은 아마 ‘보라색’이라고 했을 것이다."],"r":{"a":"4) 17세기 이전에 같은 질문을 했다면 사람들은 아마 ‘보라색’이라고 했을 것이다.","ev":"3번 문장","s":[[3,"But if you had asked people the same question before the 17th century, they probably would have said “purple.”","그러나 당신이 17세기 이전에 사람들에게 같은 질문을 했다면, 그들은 아마도 ‘보라색’이라고 했을 것이다."]],"w":"if + had p.p., would have p.p.는 '만약 ~했다면 …했을 텐데'라는 과거 사실의 반대 가정이에요. 17세기 이전에 물었다면 대답은 '보라색'이었을 것이라는 뜻이에요.","c":4},"h":"4cf4afc290"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["오늘날 대부분의 사람들은 당근이 주황색이라고 대답할 것이다.","17세기 이전 사람들은 당근이 늘 주황색이라고 말했다.","당근은 보라색인 유일한 채소이다.","열 명의 사람들이 당근에 대해 열 가지 다른 대답을 했다."],"opts":["Most people today would probably say that carrots are orange.","People before the 17th century said carrots were always orange.","Carrots are the only vegetable that is purple.","Ten people gave ten different answers about carrots."],"r":{"a":"1) Most people today would probably say that carrots are orange. (오늘날 대부분의 사람들은 당근이 주황색이라고 대답할 것이다.)","ev":"2번 문장","s":[[2,"Ask ten people and they’ll all most likely give you the same answer: orange.","열 명에게 물어보라. 그러면 그들은 아마 주황색이라는 모두 똑같은 대답을 할 것이다."]],"w":"2번 Ask ten people and they'll all most likely give you the same answer: orange(열 명에게 물어보면 아마 모두 주황색이라는 똑같은 대답을 할 것이다)와 같아요.","c":1},"h":"71472ee2cb"},{"n":9,"t":"sum","q":"Yellow and white carrots (A) the purple (B) found in other carrots.","ko":"노란색과 흰색 당근에는 다른 당근에서 발견되는 보라색 (B)이(가) (A).","oko":["(A) 필요했다 / (B) 씨앗","(A) 없었다 / (B) 색소","(A) 없었다 / (B) 씨앗","(A) 필요했다 / (B) 색소","(A) 공유했다 / (B) 씨앗"],"opts":["(A) needed / (B) seed","(A) lacked / (B) pigment","(A) lacked / (B) seed","(A) needed / (B) pigment","(A) shared / (B) seed"],"r":{"a":"2) (A) lacked / (B) pigment ((A) 없었다 / (B) 색소)","ev":"7번 문장","s":[[7,"These mutations lacked the purple pigment found in other carrots.","이 변종들은 다른 당근에서 발견되는 보라색 색소가 없었다."]],"w":"7번 These mutations lacked the purple pigment found in other carrots(이 변종들은 다른 당근에서 발견되는 보라색 색소가 없었다)를 줄인 문장이에요.","c":2},"h":"3309422fd1"},{"n":10,"t":"fill","q":"Some believe that people in the Netherlands preferred them because orange is the [A] of the Dutch royal family. However, others believe the real reason is that orange carrots are simply [B] and bigger than purple ones.","ko":"일부는 주황색이 네덜란드 왕실의 [A] 때문에 사람들이 주황색 당근을 선호했다고 믿는다. 그러나 다른 이들은 진짜 이유가 주황색 당근이 단순히 보라색 당근보다 [B] 더 크기 때문이라고 믿는다.","bank":["color","sweeter","family","pigment","species","mutation"],"bko":{"color":"색깔","sweeter":"더 단(sweet의 비교급)","family":"가족","pigment":"색소","species":"종","mutation":"변종"},"r":{"a":"[A] color (색깔), [B] sweeter (더 단(sweet의 비교급))","ev":"10~11번 문장","s":[[10,"Some believe that people in the Netherlands preferred them because orange is the color of the Dutch royal family.","일부 사람들은 주황색이 네덜란드 왕실의 색깔이기 때문에 네덜란드 사람들이 그것들을 선호했다고 믿는다."],[11,"However, others believe the real reason is a more practical one—orange carrots are simply sweeter and bigger than purple ones.","그러나, 다른 사람들은 진짜 이유는 좀 더 실용적인 것이라고 믿는데, 단순히 주황색 당근이 보라색 당근보다 더 달고 더 크기 때문이라는 것이다."]],"w":"10번 orange is the color of the Dutch royal family(주황색은 네덜란드 왕실의 색깔이다), 11번 orange carrots are simply sweeter and bigger than purple ones(주황색 당근이 단순히 보라색 당근보다 더 달고 더 크다)의 sweeter는 sweet의 비교급이에요.","c":null},"h":"30360c5b27"}]},{"u":4,"id":"ch1-04-4","no":4,"ko":"수능:ON 도표","items":[{"n":1,"t":"tf","q":"The graph compares the share of the urban population by continent in 1950 and 2020.","ko":"그래프는 1950년과 2020년의 대륙별 도시 인구 점유율을 비교한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"The graph above shows the share of the urban population by continent in 1950 and 2020.","위 그래프는 1950년과 2020년의 대륙별 도시 인구 점유율을 보여 준다."]],"w":"1번 문장과 같은 내용이에요. 대륙별 도시 인구 점유율을 1950년과 2020년으로 보여 줘요.","c":"T"},"h":"4b80cf0bd9"},{"n":2,"t":"tf","q":"The share of the urban population in Asia was the lowest of the five continents in 1950.","ko":"아시아의 도시 인구 점유율은 1950년에 다섯 개 대륙 중 가장 낮았다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The share of the urban population in Asia was the second lowest in 1950 but not in 2020.","아시아의 도시 인구 점유율은 1950년에는 두 번째로 낮았지만, 2020년에는 그렇지 않았다."]],"w":"4번 문장에서 아시아는 1950년에 '두 번째로' 낮았다고 해요. 가장 낮다(the lowest)는 틀려요.","c":"F"},"h":"76fa77ed4d"},{"n":3,"t":"tf","q":"In 1950, Latin America and the Caribbean had a larger share than Europe, and the same was true in 2020.","ko":"1950년에 라틴 아메리카와 카리브해 지역이 유럽보다 점유율이 컸고, 2020년에도 마찬가지였다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"In 1950, the share of the urban population in Europe was larger than that in Latin America and the Caribbean, whereas the reverse was true in 2020.","1950년에는 유럽의 도시 인구 점유율이 라틴 아메리카와 카리브해 지역의 그것보다 더 컸지만, 2020년에는 그 반대가 사실이었다."]],"w":"5번 문장에서 1950년에는 유럽이 더 컸고, 2020년에는 그 반대(the reverse)였다고 해요.","c":"F"},"h":"251721eaa9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...the share of the urban population by continent...)","ko":"...대륙별 도시 인구 점유율...","opts":["공유","순위","점유율, 비율","감소"],"word":"share","r":{"a":"3) 점유율, 비율","ev":"1번 문장","s":[[1,"The graph above shows the share of the urban population by continent in 1950 and 2020.","위 그래프는 1950년과 2020년의 대륙별 도시 인구 점유율을 보여 준다."]],"w":"도시 인구가 전체 중 차지하는 몫을 말해요. 대륙별로 비교하는 수치이니 share = 점유율, 비율.","c":3},"h":"2d2fde5034"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...whereas the reverse was true in 2020.)","ko":"...반면에 2020년에는 그 반대가 사실이었다.","opts":["정반대","같은 것","다음 차례","일부"],"word":"reverse","r":{"a":"1) 정반대","ev":"5번 문장","s":[[5,"In 1950, the share of the urban population in Europe was larger than that in Latin America and the Caribbean, whereas the reverse was true in 2020.","1950년에는 유럽의 도시 인구 점유율이 라틴 아메리카와 카리브해 지역의 그것보다 더 컸지만, 2020년에는 그 반대가 사실이었다."]],"w":"whereas(반면에)로 1950년 상황과 대비하는 말이에요. the reverse = 앞의 상황과 반대인 것(정반대).","c":1},"h":"38c4e5beb2"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nFor each continent, the share of the urban population in 2020 was larger than that in 1950.","ko":"밑줄 친 that이 가리키는 것은?","sko":"각 대륙에서, 2020년의 도시 인구 점유율이 1950년의 그것보다 더 컸다.","opts":["1950년의 대륙","2020년의 도시 인구 점유율","각 대륙의 인구","1950년의 도시 인구 점유율"],"r":{"a":"4) 1950년의 도시 인구 점유율","ev":"2번 문장","s":[[2,"For each continent, the share of the urban population in 2020 was larger than that in 1950.","각 대륙에서, 2020년의 도시 인구 점유율이 1950년의 그것보다 더 컸다."]],"w":"비교하는 두 대상은 2020년의 the share of the urban population과 that in 1950이에요. that은 the share of the urban population을 대신하므로 1950년의 도시 인구 점유율이에요.","c":4},"h":"d5a57ae86c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"From 1950 to 2020, the share of the urban population in Africa increased from 14.3% to 43.5%.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"1950년부터 2020년까지 아프리카의 도시 인구 점유율은 14.3%에서 43.5%로 증가했다.","opts":["아프리카의 도시 인구 점유율은 14.3%에서 43.5%로 낮아졌다.","아프리카의 도시 인구는 43.5%에서 14.3%로 줄어들었다.","아프리카의 도시 인구 점유율은 14.3%에서 43.5%로 높아졌다.","아프리카에서는 1950년에 도시 인구가 43.5%를 차지했다."],"r":{"a":"3) 아프리카의 도시 인구 점유율은 14.3%에서 43.5%로 높아졌다.","ev":"3번 문장","s":[[3,"From 1950 to 2020, the share of the urban population in Africa increased from 14.3% to 43.5%.","1950년부터 2020년까지 아프리카의 도시 인구 점유율은 14.3%에서 43.5%로 증가했다."]],"w":"increased from 14.3% to 43.5%는 14.3%에서 43.5%로 늘었다는 뜻이에요. from A to B는 시작에서 끝으로, 1950년이 시작(14.3%)이에요.","c":3},"h":"657b13decc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["유럽은 1950년에도 2020년에도 라틴 아메리카와 카리브해 지역보다 점유율이 컸다.","아프리카의 도시 인구 점유율은 1950년부터 2020년까지 줄어들었다.","북아메리카는 1950년에도 2020년에도 도시 인구 점유율에서 1위였다.","북아메리카는 1950년에는 2위였지만 2020년에는 1위였다."],"opts":["Europe had a larger share than Latin America and the Caribbean in 1950 and in 2020.","The share of the urban population in Africa decreased from 1950 to 2020.","Northern America came first in the urban population share in 1950 and also in 2020.","Northern America was ranked second in 1950 and first in 2020."],"r":{"a":"3) Northern America came first in the urban population share in 1950 and also in 2020. (북아메리카는 1950년에도 2020년에도 도시 인구 점유율에서 1위였다.)","ev":"6번 문장","s":[[6,"Among the five continents, Northern America was ranked in the first position for the share of the urban population in both 1950 and 2020.","다섯 개 대륙 중, 북아메리카는 도시 인구 점유율에서 1950년과 2020년 모두 1위를 차지했다."]],"w":"6번 Northern America was ranked in the first position ... in both 1950 and 2020(북아메리카는 1950년과 2020년 모두 1위를 차지했다)과 같아요.","c":3},"h":"3de07e7377"},{"n":9,"t":"sum","q":"Between 1950 and 2020, the share of the urban population (A) in every continent, and Europe’s share, which was (B) than that of Latin America and the Caribbean in 1950, was not larger in 2020.","ko":"1950년과 2020년 사이에 모든 대륙에서 도시 인구 점유율이 (A)했고, 1950년에 라틴 아메리카와 카리브해 지역보다 (B) 유럽의 점유율은 2020년에는 더 크지 않았다.","oko":["(A) 감소 / (B) 더 컸던","(A) 증가 / (B) 더 컸던","(A) 증가 / (B) 더 작았던","(A) 감소 / (B) 더 작았던","(A) 그대로 / (B) 더 컸던"],"opts":["(A) decreased / (B) larger","(A) increased / (B) larger","(A) increased / (B) smaller","(A) decreased / (B) smaller","(A) stayed the same / (B) larger"],"r":{"a":"2) (A) increased / (B) larger","ev":"2번, 5번 문장","s":[[2,"For each continent, the share of the urban population in 2020 was larger than that in 1950.","각 대륙에서, 2020년의 도시 인구 점유율이 1950년의 그것보다 더 컸다."],[5,"In 1950, the share of the urban population in Europe was larger than that in Latin America and the Caribbean, whereas the reverse was true in 2020.","1950년에는 유럽의 도시 인구 점유율이 라틴 아메리카와 카리브해 지역의 그것보다 더 컸지만, 2020년에는 그 반대가 사실이었다."]],"w":"2번에서 모든 대륙에서 2020년 점유율이 더 컸고(증가), 5번에서 1950년에는 유럽이 라틴 아메리카와 카리브해보다 더 컸다고 해요.","c":2},"h":"5e2df0f257"},{"n":10,"t":"fill","q":"Among the five continents, Northern America was ranked in the first [A] for the share of the urban population in [B] 1950 and 2020.","ko":"다섯 개 대륙 중, 북아메리카는 도시 인구 점유율에서 1950년과 2020년 [B] 첫 번째 [A]에 올랐다.","bank":["position","both","decline","continent","lowest","reverse"],"bko":{"position":"순위","both":"둘 다","decline":"쇠퇴","continent":"대륙","lowest":"가장 낮은","reverse":"정반대"},"r":{"a":"[A] position (순위), [B] both (둘 다)","ev":"6번 문장","s":[[6,"Among the five continents, Northern America was ranked in the first position for the share of the urban population in both 1950 and 2020.","다섯 개 대륙 중, 북아메리카는 도시 인구 점유율에서 1950년과 2020년 모두 1위를 차지했다."]],"w":"6번 ranked in the first position(첫 번째 순위에 올랐다)과 in both 1950 and 2020(1950년과 2020년 둘 다)을 그대로 써요.","c":null},"h":"ed09d756a8"}]},{"u":5,"id":"ch1-05-1","no":1,"ko":"굴려야 사는 곤충","items":[{"n":1,"t":"tf","q":"Dung beetles can be divided into three main groups according to how they use dung.","ko":"쇠똥구리는 똥을 사용하는 방식에 따라 세 개의 주요 집단으로 나눠질 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"There are thousands of different species, but they can all be divided into three main groups: rollers, tunnelers, and dwellers.","수천 가지의 다양한 종이 있지만, 그것들은 모두 굴리기 집단, 굴 파기 집단, 거주 집단이라는 세 개의 주요 집단으로 나눠질 수 있다."],[6,"These terms describe how these beetles use the dung they find.","이 용어들은 이 쇠똥구리들이 그들이 발견한 똥을 어떻게 사용하는지를 묘사한다."]],"w":"5번에서 세 개의 주요 집단으로 나눠질 수 있다고 하고, 6번에서 그 용어들은 쇠똥구리가 똥을 어떻게 사용하는지를 묘사한다고 해요.","c":"T"},"h":"6caa285b6f"},{"n":2,"t":"tf","q":"Tunnelers bury balls of dung away from the dung pile.","ko":"굴 파기 집단은 똥 더미로부터 떨어진 곳에 똥 공을 묻는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번, 9번 문장","s":[[7,"Rollers turn bits of dung into balls and bury them away from the dung pile.","굴리기 집단은 똥 조각들을 공 모양으로 만들어 똥 더미로부터 떨어진 곳에 묻어 둔다."],[9,"Tunnelers dig underneath the pile to bury their treasures.","굴 파기 집단은 보물을 묻어 두기 위해 똥 더미 아래를 판다."]],"w":"똥을 공으로 만들어 더미에서 떨어진 곳에 묻는 쪽은 굴리기 집단(Rollers, 7번)이에요. 굴 파기 집단(Tunnelers)은 더미 아래를 파요(9번).","c":"F"},"h":"98e4f1fc30"},{"n":3,"t":"tf","q":"Dung beetles eat both animal waste and plants.","ko":"쇠똥구리는 동물의 배설물과 식물을 모두 먹는다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"They eat nothing but animal waste!","그것들은 오직 동물의 배설물만을 먹는다!"]],"w":"3번에서 쇠똥구리는 nothing but animal waste, 즉 오직 동물의 배설물만 먹는다고 해요. 식물을 먹는다는 말은 없어요.","c":"F"},"h":"0dc7f009fe"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…you can still appreciate the work they do.)","ko":"…당신은 그것들이 하는 일에 대해 감사할 수는 있을 것이다.","opts":["걱정하다","부러워하다","감사하다","무시하다"],"word":"appreciate","r":{"a":"3) 감사하다","ev":"17번 문장","s":[[17,"So, while you might not want to join them for a meal, you can still appreciate the work they do.","그러니, 그것들과 함께 식사를 하고 싶진 않겠지만, 당신은 그것들이 하는 일에 대해 감사할 수는 있을 것이다."]],"w":"함께 식사하고 싶진 않더라도(while) 쇠똥구리가 하는 일에는 고마워할 수 있다는 흐름이에요. 2번의 be grateful과 같은 방향의 말이에요.","c":3},"h":"ec4af299fc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Different species have different tastes.)","ko":"서로 다른 종은 서로 다른 취향을 가진다.","opts":["취향","온도","크기","무게"],"word":"tastes","r":{"a":"1) 취향","ev":"12번 문장","s":[[12,"Different species have different tastes.","서로 다른 종은 서로 다른 취향을 가진다."]],"w":"11번에서 어떤 똥을 선호하는지 묻고, 12번은 종마다 tastes가 다르다고 답해요. 여기서 taste는 맛이 아니라 좋아하는 것, 즉 취향이에요.","c":1},"h":"7b004a6b3a"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIt might be hard to believe, but dung beetles make an important contribution to the environment they live in.","ko":"밑줄 친 they가 가리키는 것은?","sko":"믿기 어려울지도 모르겠지만, 쇠똥구리들은 자신들이 살고 있는 환경에 중요한 기여를 한다.","opts":["쇠똥구리들","환경","동물들","토양"],"r":{"a":"1) 쇠똥구리들","ev":"15번 문장","s":[[15,"It might be hard to believe, but dung beetles make an important contribution to the environment they live in.","믿기 어려울지도 모르겠지만, 쇠똥구리들은 자신들이 살고 있는 환경에 중요한 기여를 한다."]],"w":"the environment they live in(그들이 살고 있는 환경)에서 they는 주어인 dung beetles(쇠똥구리들)를 가리켜요.","c":1,"k":"they = 쇠똥구리들"},"pron":"they","h":"6ec74d71fb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"No matter what type of dung it is, there is a dung beetle that likes feeding on it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 어떤 종류의 똥일지라도, 그것을 먹고 살기를 좋아하는 쇠똥구리가 있다.","opts":["어떤 종류의 똥이든 쇠똥구리는 모두 같은 똥만 좋아한다.","똥의 종류가 다르면 쇠똥구리는 그 똥을 먹지 못한다.","쇠똥구리는 오직 한 종류의 똥만 먹을 수 있다.","어떤 종류의 똥이든 그것을 먹고 살기를 좋아하는 쇠똥구리가 있다."],"r":{"a":"4) 어떤 종류의 똥이든 그것을 먹고 살기를 좋아하는 쇠똥구리가 있다.","ev":"14번 문장","s":[[14,"No matter what type of dung it is, there is a dung beetle that likes feeding on it.","그것이 어떤 종류의 똥일지라도, 그것을 먹고 살기를 좋아하는 쇠똥구리가 있다."]],"w":"no matter what은 '어떤 ~일지라도'예요. 어떤 똥이든 그것을 좋아하는 쇠똥구리가 있다는 뜻이고, 12번의 '종마다 취향이 다르다'와 이어져요.","c":4},"h":"cd25952ac8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["쇠똥구리는 세계 대부분의 지역에서 드물다.","모든 쇠똥구리는 육식동물의 똥을 가장 좋아한다.","쇠똥구리는 남극 대륙을 제외한 모든 대륙에서 발견된다.","거주 집단은 똥 더미 아래를 파서 똥을 묻는다."],"opts":["Dung beetles are rare in most parts of the world.","All dung beetles like the dung of meat-eaters best.","Dung beetles are found on every continent except Antarctica.","Dwellers dig underneath the pile to bury dung."],"r":{"a":"3) Dung beetles are found on every continent except Antarctica.","ev":"4번 문장","s":[[4,"Dung beetles are common across every continent except Antarctica.","쇠똥구리는 남극 대륙을 제외한 모든 대륙에서 흔하다."]],"w":"4번에서 남극 대륙을 제외한 모든 대륙에서 흔하다고 해요. 대부분은 초식동물의 똥을 선호하고(13번), 더미 아래를 파는 쪽은 굴 파기 집단(9번)이에요.","c":3},"h":"3b493aa8ab"},{"n":9,"t":"sum","q":"Dung beetles return (A) to the (B) by eating and burying other animals' waste.","ko":"쇠똥구리는 다른 동물들의 배설물을 먹고 묻어서 (B)에 (A)을(를) 되돌려 준다.","oko":["(A) 장난감 / (B) 토양","(A) 영양분 / (B) 물","(A) 영양분 / (B) 토양","(A) 물 / (B) 공기","(A) 장난감 / (B) 물"],"opts":["(A) toys / (B) soil","(A) nutrients / (B) water","(A) nutrients / (B) soil","(A) water / (B) air","(A) toys / (B) water"],"r":{"a":"3) (A) nutrients / (B) soil ((A) 영양분 / (B) 토양)","ev":"1~6번 문장","s":[[16,"By eating and burying other animals’ waste, they return nutrients to the soil.","다른 동물들의 배설물을 먹거나 묻어 둠으로써, 그들은 토양에 영양분을 되돌려 준다."]],"w":"16번 By eating and burying other animals' waste, they return nutrients to the soil(다른 동물들의 배설물을 먹거나 묻어 둠으로써 토양에 영양분을 되돌려 준다)에서 nutrients와 soil이 답이에요.","c":3},"h":"58a2b7fbed"},{"n":10,"t":"fill","q":"For example, most dung beetles [A] the dung of plant-eaters, but some specifically [B] out that of meat-eaters.","ko":"예를 들어, 대부분의 쇠똥구리는 초식동물의 똥을 [A] 일부는 특별히 육식동물의 똥을 [B].","bank":["prefer","seek","continents","tastes","groups","terms"],"bko":{"prefer":"선호하다","seek":"찾다(seek out: 찾아내다)","continents":"대륙(continent의 복수형)","tastes":"취향(taste의 복수형)","groups":"집단(group의 복수형)","terms":"용어(term의 복수형)"},"r":{"a":"[A] prefer (선호하다), [B] seek (찾다(seek out: 찾아내다))","ev":"1~3번 문장","s":[[13,"For example, most dung beetles prefer the dung of plant-eaters, but some specifically seek out that of meat-eaters.","예를 들어, 대부분의 쇠똥구리는 초식동물의 똥을 선호하지만, 일부는 특별히 육식동물의 똥을 찾기도 한다."]],"w":"13번 most dung beetles prefer the dung of plant-eaters(대부분의 쇠똥구리는 초식동물의 똥을 선호한다), some specifically seek out that of meat-eaters(일부는 특별히 육식동물의 똥을 찾아낸다)에서 둘 다 일반 동사예요.","c":null},"h":"1cb89a4067"}]},{"u":5,"id":"ch1-05-2","no":2,"ko":"두 개로는 부족해","items":[{"n":1,"t":"tf","q":"The parietal eye of a green iguana can notice movement and changes in light.","ko":"녹색 이구아나의 두정안은 움직임과 빛의 변화를 알아차릴 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"It is able to detect movement and changes in light.","그것은 움직임과 빛의 변화를 감지할 수 있다."]],"w":"8번에서 제3의 눈은 움직임과 빛의 변화를 감지할 수 있다(detect movement and changes in light)고 해요.","c":"T"},"h":"1c0e4552ea"},{"n":2,"t":"tf","q":"The iguana’s third eye has neither a lens nor a retina.","ko":"이구아나의 제3의 눈에는 수정체도 망막도 없다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"It has a lens and a retina like normal eyes, but they are not fully formed.","그것은 보통의 눈처럼 수정체와 망막을 가지고 있지만, 그것들은 완전히 형성된 것은 아니다."]],"w":"6번에서 제3의 눈도 보통의 눈처럼 수정체와 망막을 가지고 있다고 해요. 다만 완전히 형성된 것은 아니에요.","c":"F"},"h":"df212f418e"},{"n":3,"t":"tf","q":"Green iguanas are the only animals that have a parietal eye.","ko":"녹색 이구아나는 두정안을 가진 유일한 동물이다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"Iguanas aren’t the only animals with a parietal eye.","이구아나가 두정안을 가진 유일한 동물은 아니다."],[12,"Some other lizard species, as well as certain frogs and fish, also have one.","일부 다른 도마뱀 종들과 특정 개구리와 물고기도 이것을 가지고 있다."]],"w":"11번에서 이구아나가 두정안을 가진 유일한 동물은 아니라고 하고, 12번에서 다른 도마뱀과 특정 개구리와 물고기도 가진다고 해요.","c":"F"},"h":"d3def93762"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined phrase? (However, this third eye can still see to some extent.)","ko":"그러나, 이 제3의 눈은 그래도 어느 정도는 볼 수 있다.","opts":["어느 정도는","전혀 못","완벽하게","오랫동안"],"word":"to some extent","r":{"a":"1) 어느 정도는","ev":"7번 문장","s":[[7,"However, this third eye can still see to some extent.","그러나, 이 제3의 눈은 그래도 어느 정도는 볼 수 있다."]],"w":"6번에서 완전히 형성되지 않았다고 했으니, 7번은 완벽하진 않아도 어느 정도는 볼 수 있다는 뜻이에요. 완벽하게나 전혀 못 본다는 말과는 달라요.","c":1},"h":"73ec7596a4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Because of this, iguanas can use it to sense predators.)","ko":"이 때문에, 이구아나는 포식자를 감지하는 데 그것을 사용할 수 있다.","opts":["요리하다","쫓아내다","감지하다","키우다"],"word":"sense","r":{"a":"3) 감지하다","ev":"9번 문장","s":[[9,"Because of this, iguanas can use it to sense predators.","이 때문에, 이구아나는 포식자를 감지하는 데 그것을 사용할 수 있다."]],"w":"8번에서 움직임과 빛의 변화를 감지할 수 있기 때문에, 포식자도 알아차릴(sense) 수 있다는 흐름이에요.","c":3},"h":"07029f9087"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nCalled a parietal eye, it is not the same as their other two eyes.","ko":"밑줄 친 it이 가리키는 것은?","sko":"두정안이라고 불리는 이것은 이구아나의 다른 두 개의 눈과 똑같지는 않다.","opts":["제3의 눈(두정안)","다른 두 개의 눈","이구아나의 이마","포식자"],"r":{"a":"1) 제3의 눈(두정안)","ev":"5번 문장","s":[[5,"Called a parietal eye, it is not the same as their other two eyes.","두정안이라고 불리는 이것은 이구아나의 다른 두 개의 눈과 똑같지는 않다."]],"w":"Called a parietal eye, it is not the same as their other two eyes에서 it은 두정안이라고 불리는 눈, 즉 제3의 눈을 가리켜요.","c":1,"k":"it = 제3의 눈(두정안)"},"pron":"it","h":"06fa8603f5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since it is on top of their head, it is especially useful for escaping birds of prey, such as eagles and hawks.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 머리 위에 위치해 있기 때문에, 독수리와 매 같은 맹금류를 피하는 데 특히 유용하다.","opts":["머리 위에 있어서, 독수리와 매를 사냥하는 데 특히 유용하다.","독수리와 매가 이 눈을 이용해 이구아나를 찾아낸다.","머리 위에 있지만, 맹금류를 피하는 데는 거의 쓸모가 없다.","머리 위에 있어서, 독수리와 매 같은 맹금류를 피하는 데 특히 유용하다."],"r":{"a":"4) 머리 위에 있어서, 독수리와 매 같은 맹금류를 피하는 데 특히 유용하다.","ev":"10번 문장","s":[[10,"Since it is on top of their head, it is especially useful for escaping birds of prey, such as eagles and hawks.","이것은 머리 위에 위치해 있기 때문에, 독수리와 매 같은 맹금류를 피하는 데 특히 유용하다."]],"w":"Since는 이유(~이므로), escaping은 '피하는 것'이에요. 독수리와 매는 이구아나가 피할 대상이지 사냥할 대상이 아니에요.","c":4},"h":"aa0f5741ae"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["녹색 이구아나는 눈이 세 개이다.","녹색 이구아나는 눈이 두 개뿐이다.","이구아나의 제3의 눈은 아무것도 감지하지 못한다.","이구아나만 제3의 눈을 가지고 있다."],"opts":["A green iguana has three eyes.","A green iguana has only two eyes.","The third eye of an iguana cannot sense anything.","Only iguanas have a third eye."],"r":{"a":"1) A green iguana has three eyes. (녹색 이구아나는 눈이 세 개이다.)","ev":"3번 문장","s":[[3,"But, surprisingly, the answer is three!","그러나 놀랍게도, 정답은 세 개이다!"]],"w":"3번 the answer is three!(정답은 세 개이다!)와 같아요. 이구아나의 제3의 눈은 움직임과 빛의 변화를 감지하고, 두정안을 가진 동물은 이구아나만이 아니에요.","c":1},"h":"8841647c90"},{"n":9,"t":"sum","q":"The iguana's third eye is located in the (A) of its (B).","ko":"이구아나의 제3의 눈은 (B)의 (A)에 위치한다.","oko":["(A) 끝 / (B) 꼬리","(A) 중앙 / (B) 이마","(A) 옆 / (B) 등","(A) 중앙 / (B) 꼬리","(A) 끝 / (B) 이마"],"opts":["(A) end / (B) tail","(A) center / (B) forehead","(A) side / (B) back","(A) center / (B) tail","(A) end / (B) forehead"],"r":{"a":"2) (A) center / (B) forehead ((A) 중앙 / (B) 이마)","ev":"4번 문장","s":[[4,"Their third eye is located in the center of their forehead.","그들의 제3의 눈은 이마의 중앙에 위치한다."]],"w":"4번 Their third eye is located in the center of their forehead(그들의 제3의 눈은 이마의 중앙에 위치한다)에서 center와 forehead가 답이에요.","c":2},"h":"8e459b73ef"},{"n":10,"t":"fill","q":"Over time, however, it slowly [A] in most species, [B] as a parietal eye in only a few—including the green iguana.","ko":"그러나, 세월이 흐르면서, 그것은 대부분의 종에서 서서히 [A], 녹색 이구아나를 포함한 소수에만 두정안으로 [B].","bank":["disappeared","remaining","predators","ignoring","escaping","seeing"],"bko":{"disappeared":"사라졌다(disappear의 과거)","remaining":"남아 있으면서(remain의 -ing형)","predators":"포식자들","ignoring":"무시하는","escaping":"피하는","seeing":"보는"},"r":{"a":"[A] disappeared (사라졌다(disappear의 과거)), [B] remaining (남아 있으면서(remain의 -ing형))","ev":"1~4번 문장","s":[[14,"Over time, however, it slowly disappeared in most species, remaining as a parietal eye in only a few—including the green iguana.","그러나, 세월이 흐르면서, 그것은 대부분의 종에서 서서히 사라졌고, 녹색 이구아나를 포함한 소수에만 두정안으로 남게 되었다."]],"w":"14번 it slowly disappeared(그것은 서서히 사라졌다)는 과거 동사이고, remaining as a parietal eye(두정안으로 남으면서)는 동시에 일어난 상황을 나타내는 -ing 분사구문이에요.","c":null},"h":"4b99f0d373"}]},{"u":5,"id":"ch1-05-3","no":3,"ko":"순한 거인과 바다의 사냥꾼, 승자는?","items":[{"n":1,"t":"tf","q":"Whale sharks can grow up to eighteen meters long.","ko":"고래상어는 최대 18미터까지 자랄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Whale sharks can grow up to eighteen meters long, as long as a bowling lane.","고래상어는 볼링 레인만큼 길게, 18미터까지 자랄 수 있다."]],"w":"2번에서 고래상어는 볼링 레인만큼 긴 18미터까지 자랄 수 있다고 해요.","c":"T"},"h":"7e391a1d71"},{"n":2,"t":"tf","q":"Whale sharks are top predators that hunt large animals.","ko":"고래상어는 큰 동물을 사냥하는 최상위 포식자이다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"These giants are not top predators, eating only small shrimp, fish, and plankton with their meter-wide mouths.","이 거대한 생물은 최상위 포식자가 아닌데, 그들의 미터 너비의 입으로 오직 작은 새우, 물고기, 그리고 플랑크톤만 먹는다."]],"w":"3번에서 고래상어는 최상위 포식자가 아니고, 작은 새우, 물고기, 플랑크톤만 먹는다고 해요.","c":"F"},"h":"d21f03bf00"},{"n":3,"t":"tf","q":"After the orcas flip the whale shark over, its unprotected belly is exposed.","ko":"범고래가 고래상어를 뒤집은 뒤, 보호되지 않은 배가 노출된다.","r":{"a":"T (본문과 맞는 내용)","ev":"8~9번 문장","s":[[8,"Then the orcas work together to flip the startled fish upside down.","그리고 나서 범고래들은 깜짝 놀란 물고기를 거꾸로 뒤집기 위해 협력한다."],[9,"Once its unprotected belly is exposed, the whale shark is left vulnerable.","보호되지 않은 배가 노출되면, 고래상어는 취약한 상태에 놓이게 된다."]],"w":"8번에서 범고래들이 고래상어를 거꾸로 뒤집고, 9번에서 보호되지 않은 배가 노출되면 취약해진다고 해요.","c":"T"},"h":"1f395a4c21"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the whale shark is left vulnerable.)","ko":"…고래상어는 취약한 상태에 놓이게 된다.","opts":["강한","취약한","빠른","안전한"],"word":"vulnerable","r":{"a":"2) 취약한","ev":"9번 문장","s":[[9,"Once its unprotected belly is exposed, the whale shark is left vulnerable.","보호되지 않은 배가 노출되면, 고래상어는 취약한 상태에 놓이게 된다."]],"w":"뒤집혀서 보호되지 않은 배가 드러났으니 공격에 약한 상태가 되는 거예요. 강하거나 안전하다는 뜻이면 다음 문장의 공격과 맞지 않아요.","c":2},"h":"10a15885b8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The orcas first collide with the whale shark.)","ko":"범고래들은 먼저 고래상어와 충돌한다.","opts":["경쟁하다","헤어지다","인사하다","충돌하다"],"word":"collide","r":{"a":"4) 충돌하다","ev":"7번 문장","s":[[7,"The orcas first collide with the whale shark.","범고래들은 먼저 고래상어와 충돌한다."]],"w":"7번 다음에 8번에서 놀란 고래상어를 뒤집으니, 먼저 부딪쳐서 놀라게 한다는 흐름이에요. collide = 충돌하다.","c":4},"h":"649bc62a06"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhale sharks have very thick skin, especially on their backs, making it difficult for predators to bite them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"고래상어는 특히 그들의 등 쪽에, 매우 두꺼운 피부를 가지고 있는데, 이는 포식자들이 그들을 무는 것을 어렵게 만든다.","opts":["predators","whale sharks","backs","orcas"],"r":{"a":"2) whale sharks","ev":"5번 문장","s":[[5,"Whale sharks have very thick skin, especially on their backs, making it difficult for predators to bite them.","고래상어는 특히 그들의 등 쪽에, 매우 두꺼운 피부를 가지고 있는데, 이는 포식자들이 그들을 무는 것을 어렵게 만든다."]],"w":"포식자들이 물기 어려운 대상은 두꺼운 피부를 가진 고래상어예요. predators는 무는 쪽이라 them이 될 수 없어요.","c":2},"h":"01d5cf61ae"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Despite their gentle nature, they should not be misunderstood as easy prey.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들의 순한 천성에도 불구하고, 그들은 쉬운 사냥감으로 오해를 받아서는 안 된다.","opts":["고래상어는 순하지만 쉬운 사냥감으로 오해해서는 안 된다.","고래상어는 순해서 쉬운 사냥감이라고 이해해야 한다.","고래상어는 사납기 때문에 사냥감으로 오해받는다.","고래상어는 순한 성질 덕분에 사냥감을 놓치지 않는다."],"r":{"a":"1) 고래상어는 순하지만 쉬운 사냥감으로 오해해서는 안 된다.","ev":"4번 문장","s":[[4,"Despite their gentle nature, they should not be misunderstood as easy prey.","그들의 순한 천성에도 불구하고, 그들은 쉬운 사냥감으로 오해를 받아서는 안 된다."]],"w":"Despite는 '~에도 불구하고'라서 순한 천성과 반대로 쉬운 사냥감은 아니라는 뜻이에요. 이유는 5번의 두꺼운 피부예요.","c":1},"h":"7ab588b4af"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["범고래는 고래상어의 피부만 먹는다.","범고래는 내장과 간처럼 영양분이 많은 부분을 우선한다.","고래상어는 두꺼운 피부로 범고래를 물 수 있다.","범고래는 고래상어의 배가 드러나면 사냥을 멈춘다."],"opts":["Orcas eat only the skin of the whale shark.","Orcas prioritize nutritious parts such as the organs and the liver.","Whale sharks can bite orcas through their thick skin.","Orcas stop hunting when the whale shark’s belly is exposed."],"r":{"a":"2) Orcas prioritize nutritious parts such as the organs and the liver.","ev":"11번 문장","s":[[11,"Uncertain when their next meal will be, orcas prioritize the most nutritious parts, including the organs and the fish’s enormous fatty liver.","다음 식사가 언제일지 불확실해서, 범고래들은 가장 영양분이 많은 부분을 우선하는데, 내장과 그 물고기의 거대하고 지방이 많은 간을 포함한다."]],"w":"11번에서 범고래는 내장과 지방이 많은 간 같은 가장 영양분이 많은 부분을 우선한다고 해요. 배가 드러나면 오히려 공격해요(9~10번).","c":2},"h":"521e02e1da"},{"n":9,"t":"sum","q":"After the whale shark is flipped, the orcas can (A), causing the hunted fish to (B).","ko":"고래상어가 뒤집힌 뒤에 범고래들은 (A)할 수 있고, 그 결과 사냥당한 물고기가 (B)하게 된다.","oko":["(A) 도망치다 / (B) 죽다","(A) 공격하다 / (B) 죽다","(A) 공격하다 / (B) 자라다","(A) 도망치다 / (B) 헤엄치다","(A) 숨다 / (B) 자라다"],"opts":["(A) escape / (B) die","(A) attack / (B) die","(A) attack / (B) grow","(A) escape / (B) swim","(A) hide / (B) grow"],"r":{"a":"2) (A) attack / (B) die ((A) 공격하다 / (B) 죽다)","ev":"1~0번 문장","s":[[10,"The orcas can then attack, causing the hunted fish to die.","그리고 나면 범고래들은 공격할 수 있고, 사냥당한 물고기가 죽게 된다."]],"w":"10번 The orcas can then attack, causing the hunted fish to die(범고래들은 공격할 수 있고, 사냥당한 물고기가 죽게 된다)에서 attack과 die가 답이에요.","c":2},"h":"6d345fe473"},{"n":10,"t":"fill","q":"The scientists' lucky encounter helped them learn about orcas' remarkable [A] and teamwork. However, it came at the [B] of the whale shark.","ko":"과학자들의 운 좋은 만남은 그들이 범고래들의 놀라운 [A]와(과) 팀워크를 배울 수 있게 도왔다. 하지만, 그것은 고래상어의 [B]을(를) 대가로 한 것이었다.","bank":["intelligence","expense","belly","liver","mystery","event"],"bko":{"intelligence":"지능","expense":"희생, 비용","belly":"배","liver":"간","mystery":"미스터리","event":"사건"},"r":{"a":"[A] intelligence (지능), [B] expense (희생, 비용)","ev":"12~13번 문장","s":[[12,"The scientists’ lucky encounter helped them learn about orcas’ remarkable intelligence and teamwork.","과학자들의 운 좋은 만남은 그들이 범고래들의 놀라운 지능과 팀워크를 배울 수 있게 도왔다."],[13,"However, it came at the expense of the whale shark.","하지만, 그것은 고래상어의 희생을 대가로 한 것이었다."]],"w":"12번 remarkable intelligence and teamwork(놀라운 지능과 팀워크), 13번 at the expense of(~의 희생을 대가로)는 하나의 표현이에요.","c":null},"h":"a216c8d99a"}]},{"u":5,"id":"ch1-05-4","no":4,"ko":"수능:ON 짧은 어구 빈칸 추론","items":[{"n":1,"t":"tf","q":"The earliest forms of orchestral instruments were made from animal parts or hunting weapons.","ko":"관현악 악기의 초기 형태는 동물의 부분이나 사냥 무기로 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The various instruments in the orchestra can be traced back to this most basic of survival methods―their earliest forms were made either from the animal (horn, skin, gut, bone) or the weapons used in bringing the animal down (stick, bow).","교향악단에 있는 다양한 악기들은 이 가장 기본적인 생존 방식으로 거슬러 올라갈 수 있는데, 그것들의 초기 형태는 동물(뿔, 가죽, 내장, 뼈)이나 동물을 잡는 데 사용된 무기(막대, 활)로 만들어졌다."]],"w":"2번에서 악기의 초기 형태는 동물(뿔, 가죽, 내장, 뼈)이나 동물을 잡는 데 쓴 무기(막대, 활)로 만들어졌다고 해요.","c":"T"},"h":"ebecf03382"},{"n":2,"t":"tf","q":"The symphony orchestra has no connection with the legacy of the hunt.","ko":"교향악단은 사냥의 유산과 아무 관련이 없다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Even the most respectable of all musical institutions, the symphony orchestra, carries inside its DNA the legacy of the hunt.","심지어 모든 음악 단체 중 가장 훌륭한 단체인 교향악단도 자신의 DNA 안에 사냥의 유산을 지니고 있다."]],"w":"1번에서 가장 훌륭한 음악 단 용과 같은 것은?","oko":["초기 악기는 오직 돌로만 만들어졌다.","일부 관현악 악기는 처음에 동물의 뿔, 가죽, 내장, 또는 뼈로 만들어졌다.","글쓴이는 위대한 교향곡이 차분하고 부드럽게 들린다고 느낀다.","글쓴이는 사냥이 교향악단이 생긴 뒤에 시작되었다고 생각한다."],"opts":["The earliest instruments were made only from stone.","Some orchestral instruments were first made from animal horn, skin, gut, or bone.","The writer feels that great symphonies sound calm and gentle.","The writer thinks hunting began after orchestras were formed."],"r":{"a":"2) Some orchestral instruments were first made from animal horn, skin, gut, or bone. (일부 관현악 악기는 처음에 동물의 뿔, 가죽, 내장, 또는 뼈로 만들어졌다.)","ev":"2번 문장","s":[[2,"The various instruments in the orchestra can be traced back to this most basic of survival methods―their earliest forms were made either from the animal (horn, skin, gut, bone) or the weapons used in bringing the animal down (stick, bow).","교향악단에 있는 다양한 악기들은 이 가장 기본적인 생존 방식으로 거슬러 올라갈 수 있는데, 그것들의 초기 형태는 동물(뿔, 가죽, 내장, 뼈)이나 동물을 잡는 데 사용된 무기(막대, 활)로 만들어졌다."]],"w":"2번 their earliest forms were made either from the animal (horn, skin, gut, bone) or the weapons(그것들의 초기 형태는 동물(뿔, 가죽, 내장, 뼈)이나 무기로 만들어졌다)과 같아요.","c":2},"h":"bf217d9c23"},{"n":9,"t":"sum","q":"I can easily imagine bands of men starting to (A) animals, using sound as a source and symbol of (B).","ko":"나는 소리를 (B)의 원천이자 상징으로 사용하면서 동물을 (A) 시작하는 무리 지은 사람들을 쉽게 상상할 수 있다.","oko":["(A) 먹이는 / (B) 침묵","(A) 쫓는 / (B) 지배","(A) 먹이는 / (B) 지배","(A) 쫓는 / (B) 침묵","(A) 보호하는 / (B) 침묵"],"opts":["(A) feed / (B) silence","(A) chase / (B) dominance","(A) feed / (B) dominance","(A) chase / (B) silence","(A) protect / (B) silence"],"r":{"a":"2) (A) chase / (B) dominance ((A) 쫓는 / (B) 지배)","ev":"4번 문장","s":[[4,"Listening to Beethoven, Brahms, Mahler, Bruckner, Berlioz, Tchaikovsky, Shostakovich, and other great composers, I can easily imagine bands of men starting to chase animals, using sound as a source and symbol of dominance, an expression of the will to predatory power.","베토벤, 브람스, 말러, 브루크너, 베를리오즈, 차이코프스키, 쇼스타코비치 및 다른 위대한 작곡가들의 음악을 들으며, 나는 공격적인 힘에 대 s 60% or above.","좋은 영화의 토마토미터 지수는 60% 이상이다."]],"w":"7번 문장에서 신선한 빨간 토마토는 60% 이상인 좋은 영화에 붙어요. 50%는 60% 미만이에요.","c":"F"},"h":"30580abddc"},{"n":3,"t":"tf","q":"The writer says you should choose a movie with a rotten green tomato.","ko":"글쓴이는 썩은 녹색 토마토가 있는 영화를 고르라고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"So try using the website to choose a movie with a fresh red tomato.","따라서 신선한 빨간 토마토가 있는 영화를 선택하려면 그 웹사이트를 한번 이용해 봐라."]],"w":"13번 문장에서 고르라고 한 것은 신선한 빨간 토마토가 있는 영화예요. 썩은 녹색 토마토는 나쁜 영화(10번)예요.","c":"F"},"h":"d5c1cc2926"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (And it is marked with a fresh red tomato.)","ko":"그리고 그것은 신선한 빨간 토마토로 표시된다.","opts":["표시되다","던져지다","나뉘다","팔리다"],"word":"marked","r":{"a":"1) 표시되다","ev":"8번 문장","s":[[8,"And it is marked with a fresh red tomato.","그리고 그것은 신선한 빨간 토마토로 표시된다."]],"w":"be marked with는 '~으로 표시되다'예요. 토마토 그림이 영화에 붙는다는 뜻이에요.","c":1},"h":"d4999f4e41"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…is one source that collects other people’s opinions…)","ko":"…다른 사람들의 의견을 모으는 하나의 자료…","opts":["결과","가격","자료, 원천","상품"],"word":"source","r":{"a":"3) 자료, 원천","ev":"3번 문장","s":[[3,"Rotten Tomatoes, an American review website, is one source that collects other people’s opinions in a unique way.","로튼 토마토는, 미국의 리뷰 웹사이트로, 다른 사람들의 의견을 독특한 방식으로 모으는 하나의 자료이다."]],"w":"1~2번에서 영화를 알아보려고 확인하는 '많은 sources'와 이어져요. source는 정보를 얻는 자료예요.","c":3},"h":"409e8c9ecd"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nThey call this the Tomatometer score.","ko":"밑줄 친 this가 가리키는 것은?","sko":"그들은 이것을 토마토미터 지수라고 부른다.","opts":["미국의 리뷰 웹사이트","긍정적인 리뷰의 비율을 바탕으로 영화에 주는 점수","비평가 수백 명","신선한 빨간 토마토"],"r":{"a":"2) 긍정적인 리뷰의 비율을 바탕으로 영화에 주는 점수","ev":"5번 문장","s":[[5,"It then gives each movie a score based on the percentage of positive reviews it received.","그런 다음 영화가 받은 긍정적인 리뷰의 비율을 바탕으로 각 영화에 점수를 부여한다."],[6,"They call this the Tomatometer score.","그들은 이것을 토마토미터 지수라고 부른다."]],"w":"5번에서 영화에 점수를 준다고 했고, 6번에서 그 점수의 이름을 알려 줘요.","c":2},"h":"9af4d7e719"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So you check many sources to find out what other people think about the movie.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 다른 사람들이 그 영화에 관해 어떻게 생각하는지 알아내기 위해 당신은 많은 자료를 확인한다.","opts":["다른 사람들에게 영화 자료를 나눠 준다.","한 가지 자료만 믿고 영화를 고른다.","영화를 만든 사람이 누구인지 찾아낸다.","다른 사람들의 생각을 알아내려고 여러 자료를 확인한다."],"r":{"a":"4) 다른 사람들의 생각을 알아내려고 여러 자료를 확인한다.","ev":"2번 문장","s":[[2,"So you check many sources to find out what other people think about the movie.","그래서 다른 사람들이 그 영화에 관해 어떻게 생각하는지 알아내기 위해 당신은 많은 자료를 확인한다."]],"w":"to find out은 '알아내기 위해'이고 what 이하는 알아내려는 내용이에요. 그래서 다른 사람들의 생각을 알려고 자료를 확인하는 거예요.","c":4},"h":"70a1d4393b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["60% 미만의 영화에는 신선한 빨간 토마토가 붙는다.","로튼 토마토는 한 명의 비평가 의견만 모은다.","리뷰의 60% 미만이 긍정적이면 썩은 녹색 토마토가 붙는다.","관객들이 공연이 끝난 뒤 연기자들에게 신선한 토마토를 주었다."],"opts":["A movie with less than 60% positive reviews gets a fresh red tomato.","Rotten Tomatoes collects the opinion of only one critic.","When less than 60% of a movie’s reviews are positive, it gets a rotten green tomato.","Audiences gave performers fresh tomatoes after the shows."],"r":{"a":"3) When less than 60% of a movie’s reviews are positive, it gets a rotten green tomato.","ev":"9번, 10번 문장","s":[[9,"When less than 60% of a movie’s reviews are positive, it is considered bad.","영화의 리뷰 중 60% 미만이 긍정적인 경우에는, 나쁜 영화로 간주된다."],[10,"And it is marked with a rotten green tomato.","그리고 그것은 썩은 녹색 토마토로 표시된다."]],"w":"9~10번 내용과 같아요. 60% 미만이면 썩은 녹색 토마토예요. 빨간 토마토는 60% 이상(7~8번)이고, 의견을 모으는 사람은 비평가 수백 명(4번)이에요.","c":3},"h":"30b1fec090"},{"n":9,"t":"sum","q":"Rotten Tomatoes (A) the opinions of hundreds of critics and (B) them into positive and negative reviews.","ko":"로튼 토마토는 비평가 수백 명의 의견을 (A), 그 의견들을 긍정적인 리뷰와 부정적인 리뷰로 (B).","oko":["(A) 판다 / (B) 나눈다","(A) 모은다 / (B) 합친다","(A) 판다 / (B) 합친다","(A) 모은다 / (B) 나눈다","(A) 잃는다 / (B) 섞는다"],"opts":["(A) sells / (B) divides","(A) gathers / (B) joins","(A) sells / (B) joins","(A) gathers / (B) divides","(A) loses / (B) mixes"],"r":{"a":"4) (A) gathers / (B) divides ((A) 모은다 / (B) 나눈다)","ev":"4번 문장","s":[[4,"Rotten Tomatoes gathers the opinions of hundreds of critics and divides those opinions into positive and negative reviews.","로튼 토마토는 비평가 수백 명의 의견을 모아서 그 의견들을 긍정적인 리뷰와 부정적인 리뷰로 나눈다."]],"c":4,"k":null},"h":"65606f517c"},{"n":10,"t":"fill","q":"In the past, angry audience members would [A] rotten tomatoes at performers during [B] stage shows.","ko":"과거에, 화가 난 관중들은 [B] 무대 공연 중에 연기자들에게 썩은 토마토를 [A]곤 했다.","bank":["throw","terrible","avoid","mark","check","choose"],"bko":{"throw":"던지다","terrible":"형편없는","avoid":"피하다","mark":"표시하다","check":"확인하다","choose":"고르다"},"r":{"a":"[A] throw (던지다), [B] terrible (형편없는)","ev":"12번 문장","s":[[12,"In the past, angry audience members would throw rotten tomatoes at performers during terrible stage shows.","과거에, 화가 난 관중들은 형편없는 무대 공연 중에 연기자들에게 썩은 토마토를 던지곤 했다."]],"w":"12번 문장을 그대로 써요. would 뒤에는 동사원형 throw가 오고, 화난 관객이 토마토를 던진 공연이므로 terrible(형편없는)이에요.","c":null},"h":"5da996e417"}]},{"u":6,"id":"ch1-06-2","no":2,"ko":"두 마녀의 숨겨진 이야기","items":[{"n":1,"t":"tf","q":"Wicked has been amazing audiences since it opened in 2003.","ko":"「위키드」는 2003년 초연 이후로 관객들을 놀라게 해오고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"One of the best musicals of all time, Wicked, has been amazing audiences since opening in 2003.","역대 최고 뮤지컬 중 하나인 「위키드」는 2003년 초연 이후로 관객들을 놀라게 해오고 있다."]],"w":"3번 문장과 같은 내용이에요. 2003년부터 지금까지 관객을 놀라게 해 오고 있어요.","c":"T"},"h":"3ee31ce291"},{"n":2,"t":"tf","q":"Glinda becomes the Wicked Witch of the West.","ko":"글린다는 서쪽의 나쁜 마녀가 된다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The green-skinned Elphaba becomes the Wicked Witch of the West, and the pretty Glinda becomes the Good Witch of the North.","초록색 피부의 엘파바는 서쪽의 나쁜 마녀가 되고, 예쁜 글린다는 북쪽의 착한 마녀가 된다."]],"w":"7번 문장에서 서쪽의 나쁜 마녀가 되는 사람은 엘파바예요. 글린다는 북쪽의 착한 마녀가 돼요.","c":"F"},"h":"a9a1990a6c"},{"n":3,"t":"tf","q":"Elphaba and Glinda like each other when they first meet at university.","ko":"엘파바와 글린다는 대학에서 처음 만났을 때 서로를 좋아한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"The two first meet at university and dislike each other.","그 둘은 대학에서 처음 만나고 서로를 싫어한다."]],"w":"8번 문장에서 처음 만났을 때는 서로를 싫어해요. 친구가 되는 것은 나중이에요(9번).","c":"F"},"h":"e74b97e309"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But they eventually become friends.)","ko":"그러나 그들은 결국 친구가 된다.","opts":["갑자기","결국","거의","가끔"],"word":"eventually","r":{"a":"2) 결국","ev":"9번 문장","s":[[9,"But they eventually become friends.","그러나 그들은 결국 친구가 된다."]],"w":"앞 문장에서는 서로 싫어했는데 But 뒤에서 친구가 되었으니, eventually는 시간이 지난 끝에라는 뜻의 '결국'이에요.","c":2},"h":"d27854f3b4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Elphaba discovers he is an evil man and not a good ruler.)","ko":"엘파바는 그가 사악한 사람이며 좋은 통치자가 아니라는 것을 알게 된다.","opts":["유명한","친절한","사악한","어리석은"],"word":"evil","r":{"a":"3) 사악한","ev":"11번 문장","s":[[11,"Elphaba discovers he is an evil man and not a good ruler.","엘파바는 그가 사악한 사람이며 좋은 통치자가 아니라는 것을 알게 된다."]],"w":"and not a good ruler(좋은 통치자가 아닌)와 이어지고, 이후 마법사가 비밀이 드러날까 두려워해요. 그래서 evil은 '사악한'이에요.","c":3},"h":"6ba2c527e6"},{"n":6,"t":"ref","q":"What does the underlined \"his\" refer to?\nScared of her revealing his secret, the Wizard tells everyone that Elphaba is a “wicked witch.”","ko":"밑줄 친 his가 가리키는 것은?","sko":"그녀가 자신의 비밀을 폭로할까 봐 두려워서 마법사는 모두에게 엘파바가 ‘나쁜 마녀’라고 말한다.","opts":["마법사","엘파바","글린다","오즈의 사람들"],"r":{"a":"1) 마법사","ev":"12번 문장","s":[[12,"Scared of her revealing his secret, the Wizard tells everyone that Elphaba is a “wicked witch.”","그녀가 자신의 비밀을 폭로할까 봐 두려워서 마법사는 모두에게 엘파바가 ‘나쁜 마녀’라고 말한다."]],"w":"비밀을 폭로할까 봐 두려워하는 사람은 쉼표 뒤의 주어인 the Wizard예요. 폭로하는 쪽은 her(엘파바)예요.","c":1},"h":"83c71ba4bc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Wicked’s entertaining story includes references to some well-known scenes from the movie The Wizard of Oz.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"「위키드」의 흥미로운 이야기는 영화 「오즈의 마법사」에 나오는 유명한 몇몇 장면들의 인용을 포함한다.","opts":["「위키드」는 영화 「오즈의 마법사」보다 먼저 만들어졌다.","「위키드」에는 영화와 관계없는 새 장면만 나온다.","「위키드」는 영화 장면을 보여 주는 영화 소개 프로그램이다.","「위키드」에는 영화 속 유명한 장면이 인용되어 나온다."],"r":{"a":"4) 「위키드」에는 영화 속 유명한 장면이 인용되어 나온다.","ev":"14번 문장","s":[[14,"Wicked’s entertaining story includes references to some well-known scenes from the movie The Wizard of Oz.","「위키드」의 흥미로운 이야기는 영화 「오즈의 마법사」에 나오는 유명한 몇몇 장면들의 인용을 포함한다."]],"w":"includes references to는 '~의 인용을 포함한다'이고 well-known scenes는 유명한 장면이에요. 영화 장면이 「위키드」 안에 나온다는 뜻이에요.","c":4},"h":"f368a03f3b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["「위키드」는 마법사의 삶을 다룬 책이다.","「위키드」는 영화 「오즈의 마법사」에 나오는 두 마녀의 이야기를 말해 준다.","엘파바와 글린다는 극장에서 처음 만난다.","글린다는 마법사가 사악한 사람이라는 것을 알게 된다."],"opts":["Wicked is a book about the life of the Wizard.","Wicked tells the story of two witches from the movie The Wizard of Oz.","Elphaba and Glinda first meet at a theater.","Glinda finds out that the Wizard is an evil man."],"r":{"a":"2) Wicked tells the story of two witches from the movie The Wizard of Oz. (「위키드」는 영화 「오즈의 마법사」에 나오는 두 마녀의 이야기를 말해 준다.)","ev":"4번 문장","s":[[4,"It tells the story of the two witches from the famous movie The Wizard of Oz.","그것은 유명한 영화 「오즈의 마법사」에 나오는 두 마녀의 이야기를 말해 준다."]],"c":2,"k":null},"h":"b11011153f"},{"n":9,"t":"sum","q":"Wicked has (A) many awards so far, and it is about the (B) between Elphaba and Glinda.","ko":"「위키드」는 지금까지 많은 상을 (A), 엘파바와 글린다 간의 (B)에 관한 것이다.","oko":["(A) 잃었고 / (B) 관계","(A) 받았고 / (B) 차이","(A) 잃었고 / (B) 차이","(A) 받았고 / (B) 관계","(A) 팔았고 / (B) 이름"],"opts":["(A) lost / (B) relationship","(A) won / (B) difference","(A) lost / (B) difference","(A) won / (B) relationship","(A) sold / (B) name"],"r":{"a":"4) (A) won / (B) relationship ((A) 받았고 / (B) 관계)","ev":"5~6번 문장","s":[[5,"Wicked has won many awards so far, including a Grammy Award and several Tony Awards.","「위키드」는 지금까지 그래미 상과 몇몇 토니 상을 포함해서 많은 상을 받았다."],[6,"Wicked is about the relationship between Elphaba and Glinda.","「위키드」는 엘파바와 글린다 간의 관계에 관한 것이다."]],"c":4,"k":null},"h":"016eca920f"},{"n":10,"t":"fill","q":"Do you [A] you know the [B] story about The Wizard of Oz?","ko":"당신은 「오즈의 마법사」에 관한 [B] 이야기를 안다고 [A]?","bank":["think","whole","visit","listen","become","eventually"],"bko":{"think":"생각하다","whole":"전체의","visit":"방문하다","listen":"귀 기울이다","become":"되다","eventually":"결국"},"r":{"a":"[A] think (생각하다), [B] whole (전체의)","ev":"1번 문장","s":[[1,"Do you think you know the whole story about The Wizard of Oz?","당신은 「오즈의 마법사」에 관한 이야기 전부를 안다고 생각하는가?"]],"c":null,"k":null},"h":"fc49c6f70d"}]},{"u":6,"id":"ch1-06-3","no":3,"ko":"물감이 춤추는 순간","items":[{"n":1,"t":"tf","q":"Pollock laid his canvases flat on the floor and dripped paint onto them.","ko":"폴락은 캔버스를 바닥에 평평하게 놓고 그 위에 물감을 떨어뜨렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Unlike most painters, Pollock laid his canvases flat on the floor, then dripped paint onto them in interesting patterns.","대부분의 화가들과 달리, 폴락은 캔버스를 바닥에 평평하게 놓았고, 그러고 나서 흥미로운 모양으로 물감을 그 위에 떨어뜨렸다."]],"w":"3번 문장과 같은 내용이에요. 캔버스를 바닥에 평평하게 놓고 물감을 떨어뜨렸어요.","c":"T"},"h":"7328430856"},{"n":2,"t":"tf","q":"Only a genius like Pollock can paint using his style.","ko":"폴락 같은 천재만 그의 방식을 이용해 그림을 그릴 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Pollock was a genius, but anyone can paint using his style.","폴락은 천재였지만, 누구나 그의 방식을 이용해 그림을 그릴 수 있다."]],"w":"4번 문장에서 폴락은 천재였지만 누구나 그의 방식으로 그릴 수 있다고 해요.","c":"F"},"h":"0124749091"},{"n":3,"t":"tf","q":"You can use only paintbrushes to make the paint drip.","ko":"물감을 떨어뜨리려면 그림 붓만 사용할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"You can also use plastic squeeze bottles to do this—the kind restaurants use for ketchup and other sauces.","이것을 하기 위해, 음식점에서 케첩이나 다른 소스를 위해 사용하는 종류인, 짜서 쓰는 플라스틱 용기를 사용할 수도 있다."]],"w":"11번 문장의 also는 붓 말고도 짜는 플라스틱 병을 쓸 수 있다는 뜻이에요.","c":"F"},"h":"aa6b7d0709"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…dip one of your brushes in another color and wave it over the canvas.)","ko":"…붓 중 하나를 다른 색에 담갔다가 그것을 캔버스 위로 흔들어라.","opts":["닦다","부수다","흔들다","접다"],"word":"wave","r":{"a":"3) 흔들다","ev":"9번 문장","s":[[9,"After it dries, dip one of your brushes in another color and wave it over the canvas.","마르고 난 후에는, 붓 중 하나를 다른 색에 담갔다가 그것을 캔버스 위로 흔들어라."]],"w":"붓을 색에 담근 뒤 캔버스 위에서 움직여야 10번처럼 물감이 모양을 만들며 떨어져요. wave는 '흔들다'예요.","c":3},"h":"d0b03aa7a3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…repeat the process over and over until you’re satisfied.)","ko":"…만족할 때까지 이 과정을 계속해서 반복하라.","opts":["만족하는","걱정하는","지친","화가 난"],"word":"satisfied","r":{"a":"1) 만족하는","ev":"12번 문장","s":[[12,"Once the paint dries, repeat the process over and over until you’re satisfied.","물감이 마르고 나면, 만족할 때까지 이 과정을 계속해서 반복하라."]],"w":"그림을 계속 반복해서 그리다가 멈추는 때는 마음에 들 때예요. satisfied는 '만족하는'이에요.","c":1},"h":"b65b0030e4"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nOnce you’re ready, pick a color for the background of your painting and use it to cover your canvas.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"준비가 되면, 그림의 배경을 위한 색을 하나 고르고 캔버스를 칠하는 데 그것을 사용하라.","opts":["그림 배경으로 고른 색","캔버스","그림 붓","그림을 그릴 장소"],"r":{"a":"1) 그림 배경으로 고른 색","ev":"8번 문장","s":[[8,"Once you’re ready, pick a color for the background of your painting and use it to cover your canvas.","준비가 되면, 그림의 배경을 위한 색을 하나 고르고 캔버스를 칠하는 데 그것을 사용하라."]],"c":1,"k":"it = 그림 배경으로 고른 색"},"pron":"it","h":"e1ac1d7191"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You’ll need enough space to lay your canvas down and move around it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"캔버스를 놓고 그 주위로 돌아다닐 충분한 공간이 필요할 것이다.","opts":["캔버스를 벽에 걸 높은 공간이 필요하다.","캔버스를 놓고 그 주위를 돌아다닐 만큼 넓은 공간이 필요하다.","캔버스를 가릴 작은 공간이면 충분하다.","캔버스 없이 움직일 공간이 필요하다."],"r":{"a":"2) 캔버스를 놓고 그 주위를 돌아다닐 만큼 넓은 공간이 필요하다.","ev":"7번 문장","s":[[7,"You’ll need enough space to lay your canvas down and move around it.","캔버스를 놓고 그 주위로 돌아다닐 충분한 공간이 필요할 것이다."]],"w":"enough space는 충분한 공간이고, to lay … down and move around it은 캔버스를 내려놓고 주위를 움직이기 위한 것이에요.","c":2},"h":"6574859b02"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["잭슨 폴락은 드리핑 기법으로 알려져 있다.","폴락은 캔버스를 벽에 세워 놓고 그렸다.","물감이 마른 뒤에는 같은 색으로만 계속 칠한다.","폴락은 많이 생각할수록 좋은 그림이 나온다고 말했다."],"opts":["Jackson Pollock is known for the drip technique.","Pollock stood his canvases on the wall to paint.","After the paint dries, you use only the same color.","Pollock said more thinking makes a better painting."],"r":{"a":"1) Jackson Pollock is known for the drip technique.","ev":"2번 문장","s":[[2,"He is known for his unique style of painting, which is called the drip technique.","그는 그의 독특한 화법으로 알려져 있는데, 그것은 드리핑 기법이라고 불린다."]],"w":"2번 내용과 같아요. 폴락은 캔버스를 바닥에 놓았고(3번), 다른 색을 쓰며(9번), 많이 생각하지 말라고 했어요(13번).","c":1},"h":"3bd089ac43"},{"n":9,"t":"sum","q":"To start, you will need (A) colors of paint and a large (B) to protect your floor.","ko":"시작하려면 (A) 색의 물감과 바닥을 보호할 커다란 (B)이(가) 필요하다.","oko":["(A) 몇 가지 / (B) 벽","(A) 아무 / (B) 천","(A) 몇 가지 / (B) 천","(A) 아무 / (B) 벽","(A) 몇 가지 / (B) 칼"],"opts":["(A) several / (B) wall","(A) no / (B) cloth","(A) several / (B) cloth","(A) no / (B) wall","(A) several / (B) knife"],"r":{"a":"3) (A) several / (B) cloth ((A) 몇 가지 / (B) 천)","ev":"5번 문장","s":[[5,"To get started, you’ll need several colors of paint, some paintbrushes, a canvas, and a large cloth to protect your floor.","(그림 그리는 것을) 시작하기 위해서, 몇 가지 색의 물감과 그림 붓, 캔버스, 그리고 바닥을 보호할 커다란 천이 필요할 것이다."]],"c":3,"k":null},"h":"444eada71b"},{"n":10,"t":"fill","q":"Pollock believed that you can express your [A] feelings using this style, so [B] and follow your instincts.","ko":"폴락은 이 기법으로 [A] 감정을 표현할 수 있다고 믿었으므로, [B] 그리고 본능을 따르라.","bank":["unconscious","relax","repeat","protect","squeeze","cover"],"bko":{"unconscious":"무의식적인","relax":"긴장을 풀다","repeat":"반복하다","protect":"보호하다","squeeze":"짜다","cover":"덮다"},"r":{"a":"[A] unconscious, [B] relax","ev":"14번, 15번 문장","s":[[14,"Pollock believed that you can express your unconscious feelings using this style.","폴락은 이 기법을 사용해서 무의식적인 감정을 표현할 수 있다고 믿었다."],[15,"So relax and follow your instincts; you may be surprised by what you create.","그러니 긴장을 풀고 당신의 본능을 따르라. 당신은 당신이 만들어 낸 것에 놀랄지도 모른다."]],"w":"14번 express your unconscious feelings(무의식적인 감정)와 15번 So relax and follow your instincts를 그대로 써요. [A]는 feelings를 꾸미는 형용사 자리예요.","c":null},"h":"7e3488363e"}]},{"u":6,"id":"ch1-06-4","no":4,"ko":"수능:ON 무관한 문장","items":[{"n":1,"t":"tf","q":"After the idea came to him, Picasso only had to join the two objects together.","ko":"아이디어가 떠오르자, 피카소는 그 두 사물을 결합하기만 하면 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Once the idea came to him, all he had to do was join the two objects together.","일단 그에게 아이디어가 떠오르자, 그가 해야 할 일은 그 두 사물을 결합하는 것뿐이었다."]],"w":"4번 문장과 같은 내용이에요. 해야 할 일은 두 사물을 결합하는 것뿐이었어요.","c":"T"},"h":"e6b8fdf3af"},{"n":2,"t":"tf","q":"In 1942, Picasso was visiting a museum.","ko":"1942년에 피카소는 박물관을 방문하고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"In 1942, Pablo Picasso was looking through a pile of junk.","1942년에, 파블로 피카소는 쓰레기 더미를 살펴보고 있었다."]],"w":"1번 문장에서 피카소는 쓰레기 더미를 살펴보고 있었어요.","c":"F"},"h":"e8f677bc0d"},{"n":3,"t":"tf","q":"Tête de taureau means “bicycle seat” in French.","ko":"Tête de taureau는 프랑스어로 ‘자전거 안장’을 의미한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"He called it Tête de taureau, which simply means “bull’s head” in French.","그는 그것을 Tête de taureau라고 불렀는데, 이는 단순히 프랑스어로 ‘황소의 머리’를 의미한다."]],"w":"5번 문장에서 Tête de taureau는 프랑스어로 ‘황소의 머리’를 뜻해요.","c":"F"},"h":"90b91b7982"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…an old bicycle seat lying next to some rusty handlebars.)","ko":"…녹슨 핸들 옆에 놓인 낡은 자전거 안장…","opts":["부드러운","녹슨","반짝이는","새로운"],"word":"rusty","r":{"a":"2) 녹슨","ev":"2번 문장","s":[[2,"He saw an old bicycle seat lying next to some rusty handlebars.","그는 녹슨 핸들 옆에 놓인 낡은 자전거 안장을 보았다."]],"w":"쓰레기 더미 속의 낡은 자전거 안장 옆에 놓인 핸들이니 rusty는 '녹슨'이에요.","c":2},"h":"d20f72e625"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…found art is about seeing the beauty in existing objects.)","ko":"…파운드 아트는 기존의 사물들에서 아름다움을 보는 것에 관한 것이다.","opts":["미래의","가짜의","유일한","기존의"],"word":"existing","r":{"a":"4) 기존의","ev":"8번 문장","s":[[8,"While most art is about making beauty, found art is about seeing the beauty in existing objects.","대부분의 예술이 아름다움을 만들어 내는 것에 관한 것인 반면, 파운드 아트는 기존의 사물들에서 아름다움을 보는 것에 관한 것이다."]],"w":"새로 아름다움을 '만드는' 예술과 대비되므로, existing objects는 이미 있는 사물이에요.","c":4},"h":"fe8896fa7f"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt’s called “found art.”","ko":"밑줄 친 It이(가) 가리키는 것은?","sko":"그것은 ‘파운드 아트’라고 불린다.","opts":["이런 종류의 예술 형태","프랑스어로 된 제목","피카소가 살던 도시","쓰레기를 모아 둔 더미"],"r":{"a":"1) 이런 종류의 예술 형태","ev":"6~7번 문장","s":[[6,"It might sound strange, but this type of art has been around since the early 20th century.","이상하게 들릴지도 모르지만, 이런 예술 형태는 20세기 초 이후로 존재해 왔다."],[7,"It’s called “found art.”","그것은 ‘파운드 아트’라고 불린다."]],"c":1,"k":"It = 이런 종류의 예술 형태(this type of art)"},"pron":"It","h":"7e3f24de69"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But here’s the point—you didn’t!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 요점은 바로, 당신은 하지 않았다는 것이다!","opts":["요점은 당신은 실제로 그렇게 하지 않았다는 것이다.","요점은 피카소가 그것을 하지 않았다는 것이다.","요점은 그것이 너무 어려워서 아무도 할 수 없다는 것이다.","요점은 당신이 이미 그 작품을 만들었다는 것이다."],"r":{"a":"1) 요점은 당신은 실제로 그렇게 하지 않았다는 것이다.","ev":"10번 문장","s":[[10,"But here’s the point—you didn’t!","그러나 요점은 바로, 당신은 하지 않았다는 것이다!"]],"w":"앞의 9번에서 ‘나도 할 수 있었겠다’고 생각할 수 있다고 했어요. 10번은 But으로 반박해서, 할 수 있었어도 실제로 하지는 않았다는 뜻이에요.","c":1},"h":"b43c7e39d4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파운드 아트는 없던 아름다움을 만들어 내는 예술이다.","피카소는 쓰레기에서 황소 머리의 가능성을 본 유일한 사람이었다.","피카소는 자전거 안장과 핸들을 버렸다.","Tête de taureau는 프랑스어로 ‘자전거’를 뜻한다."],"opts":["Found art is about making beauty that did not exist before.","Picasso was the only person who saw a bull’s head in the junk.","Picasso threw away the bicycle seat and the handlebars.","Tête de taureau means “bicycle” in French."],"r":{"a":"2) Picasso was the only person who saw a bull’s head in the junk.","ev":"11번 문장","s":[[11,"Picasso was the only person who saw the possibility of a bull’s head in a couple of pieces of junk.","피카소는 몇 개의 쓰레기에서 황소 머리가 될 가능성을 본 유일한 사람이었다."]],"w":"11번과 같아요. 피카소만 쓰레기에서 황소 머리의 가능성을 봤어요. 파운드 아트는 아름다움을 만드는 것이 아니라 보는 것이고(8번), 사물은 결합했으며(4번), 이름은 ‘황소의 머리’예요(5번).","c":2},"h":"db9a83dfb8"},{"n":9,"t":"sum","q":"Tête de taureau is a (A) work of art because of Picasso’s imaginative (B).","ko":"Tête de taureau는 피카소의 상상력이 풍부한 (B) 덕분에 (A) 예술 작품이다.","oko":["(A) 특별한 / (B) 행운","(A) 지루한 / (B) 창의력","(A) 특별한 / (B) 창의력","(A) 지루한 / (B) 재산","(A) 평범한 / (B) 창의력"],"opts":["(A) special / (B) luck","(A) boring / (B) creativity","(A) special / (B) creativity","(A) boring / (B) wealth","(A) ordinary / (B) creativity"],"r":{"a":"3) (A) special / (B) creativity ((A) 특별한 / (B) 창의력)","ev":"12번 문장","s":[[12,"This imaginative creativity is what makes Tête de taureau such a special work of art.","이 상상력 넘치는 창의력이 Tête de taureau를 아주 특별한 예술 작품으로 만드는 것이다."]],"c":3,"k":null},"h":"e87743fd6d"},{"n":10,"t":"fill","q":"It might sound [A], but this type of art has been around [B] the early 20th century.","ko":"이상하게 [A] 들릴지도 모르지만, 이런 예술 형태는 20세기 초 [B] 존재해 왔다.","bank":["strange","since","rusty","among","against","existing"],"bko":{"strange":"이상한","since":"~ 이후로","rusty":"녹슨","among":"~ 사이에","against":"~에 맞서","existing":"기존의"},"r":{"a":"[A] strange, [B] since","ev":"6번 문장","s":[[6,"It might sound strange, but this type of art has been around since the early 20th century.","이상하게 들릴지도 모르지만, 이런 예술 형태는 20세기 초 이후로 존재해 왔다."]],"w":"6번을 그대로 써요. sound 뒤에는 형용사 strange가 오고, has been around(현재완료)와 함께 쓰는 ‘~ 이후로’는 since예요.","c":null},"h":"1b2c59a269"}]},{"u":7,"id":"ch1-07-1","no":1,"ko":"유령 부대를 아시나요?","items":[{"n":1,"t":"tf","q":"A ghost army existed in Europe during WWII.","ko":"제2차 세계대전 중에 유령 부대가 유럽에 존재했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Did you know that a ghost army existed in Europe during WWII?","제2차 세계대전 중에 유령 부대가 유럽에 존재했다는 것을 알고 있었는가?"]],"w":"1번 문장과 같은 내용이에요. 제2차 세계대전 중 유럽에 유령 부대(Ghost Army)가 있었어요.","c":"T"},"h":"2abb576e8b"},{"n":2,"t":"tf","q":"The members of the Ghost Army fought directly against the enemy.","ko":"고스트 아미의 구성원들은 적과 직접 싸웠다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Their purpose was not to fight.","그들의 목적은 싸우는 것이 아니었다."]],"w":"4번 문장에서 그들의 목적은 싸우는 것이 아니었다고 해요. 직접 싸웠다는 것은 반대예요.","c":"F"},"h":"b385805e3a"},{"n":3,"t":"tf","q":"The world learned about the Ghost Army’s mission soon after WWII ended.","ko":"세계는 제2차 세계대전이 끝난 직후 고스트 아미의 임무에 대해 알게 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"It was not until 1996 that the world learned of this creative mission.","1996년이 되어서야 비로소 세계가 이 기발한 임무에 대해 알게 되었다."]],"w":"13번 문장에서 1996년이 되어서야 비로소 세계가 알게 되었다고 해요. 전쟁 직후가 아니에요.","c":"F"},"h":"af91d539cb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (To accomplish this, they deceived the enemy with special effects.)","ko":"(이것을 달성하기 위해, 그들은 특수 효과로 적을 속였다.)","opts":["포기하다","시작하다","달성하다","설명하다"],"word":"accomplish","r":{"a":"3) 달성하다","ev":"6번 문장","s":[[6,"To accomplish this, they deceived the enemy with special effects.","이것을 달성하기 위해, 그들은 특수 효과로 적을 속였다."]],"w":"this는 5번의 임무(적을 속이는 것)예요. 그 임무를 이루기 위해 속였다는 흐름이라 accomplish는 '달성하다'예요.","c":3},"h":"37367f1b45"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The Ghost Army was often placed near the front lines of battle where it confused the enemy.)","ko":"(고스트 아미는 적을 혼란스럽게 만드는 최전방 근처에 종종 배치되었다.)","opts":["혼란스럽게 만들었다","안심시켰다","도와주었다","설득했다"],"word":"confused","r":{"a":"1) 혼란스럽게 만들었다","ev":"11번 문장","s":[[11,"The Ghost Army was often placed near the front lines of battle where it confused the enemy.","고스트 아미는 적을 혼란스럽게 만드는 최전방 근처에 종종 배치되었다."]],"w":"최전방 근처에서 가짜 탱크와 소음으로 적을 속이는 부대라서, 적은 혼란스러워졌어요. confuse = 혼란시키다.","c":1},"h":"3f629710fa"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey were inflatables, so the army could set up many of them in a few hours.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그것은 부풀릴 수 있는 것이었기 때문에, 부대는 몇 시간 내에 많은 가짜 탱크를 설치할 수 있었다.","opts":["예술가들","나치 부대","음향 전문가들","가짜 탱크"],"r":{"a":"4) 가짜 탱크","ev":"7~8번 문장","s":[[7,"Artists made fake tanks out of painted rubber.","예술가들은 색칠된 고무로 가짜 탱크를 만들었다."],[8,"They were inflatables, so the army could set up many of them in a few hours.","그것은 부풀릴 수 있는 것이었기 때문에, 부대는 몇 시간 내에 많은 가짜 탱크를 설치할 수 있었다."]],"w":"7번에서 예술가들이 만든 것은 가짜 탱크예요. 8번의 They와 them은 모두 이 가짜 탱크를 가리켜요.","c":4},"h":"a3ef190a50"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead, the Ghost Army’s mission was to fool the enemy so that they would believe that America had a larger and more powerful army than it really had.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"대신, 고스트 아미의 임무는 미국이 실제보다 더 크고 더 강력한 부대를 가지고 있다고 적들이 믿도록 그들을 속이는 것이었다.","opts":["미국은 적들보다 더 작고 약한 부대를 가지고 있었다.","고스트 아미의 임무는 미국 부대가 실제보다 더 크고 강하다고 적이 믿게 속이는 것이었다.","고스트 아미의 임무는 미국의 실제 병력을 적에게 정확히 알려 주는 것이었다.","고스트 아미는 적의 부대를 실제보다 더 크게 보이게 만드는 임무를 맡았다."],"r":{"a":"2) 고스트 아미의 임무는 미국 부대가 실제보다 더 크고 강하다고 적이 믿게 속이는 것이었다.","ev":"5번 문장","s":[[5,"Instead, the Ghost Army’s mission was to fool the enemy so that they would believe that America had a larger and more powerful army than it really had.","대신, 고스트 아미의 임무는 미국이 실제보다 더 크고 더 강력한 부대를 가지고 있다고 적들이 믿도록 그들을 속이는 것이었다."]],"w":"fool the enemy so that they would believe …는 '적이 …라고 믿도록 속이다'예요. 믿게 만드는 내용은 '미국 부대가 실제보다 더 크고 강하다'이고, ④처럼 적의 부대가 커 보이게 하는 것이 아니에요.","c":2},"h":"b12567d7da"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고스트 아미는 싸우도록 훈련받은 병사 1,100명으로 구성되었다.","고스트 아미는 진짜 금속 탱크를 만들어 최전방에 놓았다.","고스트 아미의 구성원들은 전쟁이 끝난 직후 자유롭게 임무를 이야기했다.","고스트 아미의 구성원들은 전쟁이 끝난 후에도 임무를 비밀로 해야 했다."],"opts":["The Ghost Army was made up of 1100 soldiers trained to fight.","The Ghost Army made real metal tanks and placed them at the front lines.","The members of the Ghost Army freely talked about their mission right after the war.","The members of the Ghost Army had to keep their mission a secret even after the war."],"r":{"a":"4) The members of the Ghost Army had to keep their mission a secret even after the war.","ev":"12번 문장","s":[[12,"The members of the Ghost Army were forced to keep their mission a secret for national security reasons, even after the war was over.","고스트 아미의 구성원들은 전쟁이 끝난 후에도 국가 보안상의 이유로 그들의 임무를 비밀로 유지해야 했다."]],"w":"12번 문장과 같아요. 3번의 구성원은 예술가와 전문가들이고, 4번에서 싸우는 것이 목적이 아니라고 했어요. 탱크는 색칠한 고무로 만든 가짜(7번)였어요.","c":4},"h":"542ae09af7"},{"n":9,"t":"sum","q":"Sound specialists blasted the (A) of vehicles and soldiers out of powerful (B).","ko":"음향 전문가들은 강력한 (B)을(를) 통해 차량과 병사들의 (A)이(가) 쾅쾅 울리게 했다.","oko":["(A) 소음 / (B) 탱크","(A) 사진 / (B) 스피커","(A) 소음 / (B) 스피커","(A) 사진 / (B) 탱크","(A) 색깔 / (B) 카메라"],"opts":["(A) noises / (B) tanks","(A) pictures / (B) speakers","(A) noises / (B) speakers","(A) pictures / (B) tanks","(A) colors / (B) cameras"],"r":{"a":"3) (A) noises / (B) speakers ((A) 소음 / (B) 스피커)","ev":"10번 문장","s":[[10,"Sound specialists blasted the noises of vehicles and soldiers out of powerful speakers.","음향 전문가들은 강력한 스피커를 통해 차량 및 병사들의 소음이 쾅쾅 울리게 했다."]],"c":3,"k":null},"h":"a70032e5b7"},{"n":10,"t":"fill","q":"The Ghost Army was a special [A] that America created, and its 1100 men were artists, sound specialists, and radio [B].","ko":"고스트 아미는 미국이 만든 특별한 [A]였고, 1,100명의 구성원은 예술가, 음향 전문가, 그리고 전파 [B]였다.","bank":["unit","experts","enemies","effects","rubber","airwaves"],"bko":{"unit":"부대","experts":"전문가들","enemies":"적들","effects":"효과","rubber":"고무","airwaves":"전파"},"r":{"a":"[A] unit, [B] experts","ev":"2~3번 문장","s":[[2,"The Ghost Army was a special unit that America created to get the better of the Nazi army.","고스트 아미는 미국이 나치 부대를 이기기 위해 만든 특수 부대이다."],[3,"The Ghost Army was actually made up of 1100 men, who were artists, sound specialists, and radio experts.","고스트 아미는 실제로 1,100명의 남성으로 구성되었는데, 그들은 예술가, 음향 전문가 및 전파 전문가였다."]],"w":"2번에서 a special unit(특수 부대)이라 했고, 3번에서 구성원이 artists, sound specialists, and radio experts라고 했어요. 사람을 나열하는 자리라 [B]에는 사람을 가리키는 experts만 맞아요.","c":null},"h":"bf3e9fcf20"}]},{"u":7,"id":"ch1-07-2","no":2,"ko":"함부로 쓸 수 없던 그 색깔","items":[{"n":1,"t":"tf","q":"Bright colors such as red and yellow are commonly used in national flags.","ko":"빨간색과 노란색 같은 밝은 색은 국기에 흔히 사용된다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Bright colors, such as red and yellow, are commonly used in national flags across the world.","빨간색과 노란색 같은 다양한 밝은 색상은 전 세계 국기에서 흔히 사용된다."]],"w":"1번 문장과 같은 내용이에요. 밝은 색은 국기에 흔히 쓰여요.","c":"T"},"h":"f5ef6529c4"},{"n":2,"t":"tf","q":"Until the 1800s, purple dye came from many different kinds of animals.","ko":"1800년대까지 보라색 염료는 여러 종류의 동물에게서 나왔다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Until the 1800s, purple dye only came from a special type of snail in the Mediterranean.","1800년대까지, 보라색 염료는 지중해의 특별한 종류의 달팽이에게서만 나왔다."]],"w":"5번 문장에서 보라색 염료는 지중해의 '특별한 한 종류의 달팽이'에게서만 나왔다고 해요. 여러 종류의 동물이 아니에요.","c":"F"},"h":"5d035fdc8e"},{"n":3,"t":"tf","q":"About 10,000 snails were needed to make one gram of purple dye.","ko":"보라색 염료 1g을 만드는 데 약 10,000마리의 달팽이가 필요했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"It took about 10,000 snails to make just one gram of dye!","단 1g의 염료를 만드는 데 약 10,000마리의 달팽이가 필요했다!"]],"w":"6번 문장과 같은 내용이에요. 1g에 약 10,000마리가 필요했어요.","c":"T"},"h":"79e717f258"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Perkin discovered a way to make purple dye artificially without using snails.)","ko":"(퍼킨은 달팽이를 사용하지 않고 인공적으로 보라색 염료를 만드는 방법을 발견했다.)","opts":["자연적으로","우연히","인공적으로","빠르게"],"word":"artificially","r":{"a":"3) 인공적으로","ev":"10번 문장","s":[[10,"However, in 1856, William Henry Perkin discovered a way to make purple dye artificially without using snails.","그러나 1856년, 윌리엄 헨리 퍼킨은 달팽이를 사용하지 않고 인공적으로 보라색 염료를 만드는 방법을 발견했다."]],"w":"without using snails(달팽이를 쓰지 않고)가 단서예요. 달팽이 없이 사람이 만들어 낸 방법이므로 artificially는 '인공적으로'예요.","c":3},"h":"775148875d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Only wealthy people, like royalty, could
