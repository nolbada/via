function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name||(secs.length>1?'도입':''))+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  if(done[si])h+=resultTop(S,si);
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=stepQHtml();
 document.getElementById('app').innerHTML=h;relayUp();persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function aDone(){return secs.every(function(S,si){return done[si]})}
function allAdv(){return QL.every(function(q){return qst[q.n]&&qst[q.n].adv})}
function relayUp(){var st=[aDone(),allAdv()],nm=['본문 오류 찾기','본문 '+QL.length+'문제'],f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 if(lock&&!it.ok){h='<div class="sent locked fixd" id="s'+i+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt" lang="en">'+diffHtml(it)+'</div></div><div class="gl kr">'+esc(it.ko)+'</div>';if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');return h+noteHtml(i)+'</div>'}
 h+='<div class="sent'+(lock?' locked':'')+'" id="s'+i+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt" lang="en">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongWords(i){var it=D[i],sp=span(it),toks=it.en.split(/\s+/),r=[];for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))r.push(t)}r.sort(function(a,b){return a-b});return r.map(function(t){return toks[t].replace(/^[^\w]+|[^\w]+$/g,'')})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function fixedHtml(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0001'+f.right+'\u0002');return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+'\u0001'+f.right+'\u0002'+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return esc(tk.join(' ').replace(/ ?\u0000/g,'')).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>')}
function diffHtml(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   var R=f.right?'\u0001'+f.right+'\u0002':'';
   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0003'+f.wrong+'\u0004'+R);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+'\u0003'+f.wrong+'\u0004'+(R?' '+R:'')+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return esc(tk.join(' ').replace(/ ?\u0000/g,'')).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>').replace(/\u0003/g,'<del>').replace(/\u0004/g,'</del>')}
function noteHtml(i){
 var it=D[i],wp=wrongPicks(i);
 if(it.ok){return '<div class="ac s1"><div class="ac-top fine"><b>맞는 문장</b><span class="ac-a">어법 오류 없음</span>'+(wp?'<span class="ac-x">틀리게 고른 곳 : <span lang="en">'+esc(wrongWords(i).join(', '))+'</span></span>':'')+'</div></div>'}

 var h='<div class="ac s1"><div class="ac-top'+(all?' g':'')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+'</b>'+(wp?'<span class="ac-x">틀리게 고른 곳 : <span lang="en">'+esc(wrongWords(i).join(', '))+'</span></span>':'')+'</div>';
 it.fixes.forEach(function(f,k){var ok=foundFix(i,k);
  h+='<div class="fc '+(ok?'f':'m')+'"><div><span class="tg2">'+(ok?'찾음':'놓침')+'</span>'+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr" lang="en">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt" lang="en">'+esc(f.right)+'</span></div><div class="fcb">'+pointHtml(f)+(f.gl?f.gl.map(function(g){return '<div class="fgl">'+esc(g)+'</div>'}).join(''):'')+'</div></div>'});
 return h+'<div style="height:12px"></div></div>';

function critHtml(f){var w=f.wrong.split(/\s+/),r=f.right.split(/\s+/);
 if(f.alt&&f.alt.length)return '<div class="crit">빠진 말 문제 : 빠진 자리 양옆 어느 단어를 눌러도 정답으로 인정</div>';
 if(w.length==2&&r.length==2&&w.slice().sort().join()==r.slice().sort().join()&&w.join()!=r.join())return '<div class="crit">어순 문제 : 옮겨진 말과 짝이 되는 단어, 어느 쪽을 눌러도 정답으로 인정</div>';return ''}
function pointHtml(f){var p=f.point,ix=p.indexOf(':');return (ix>0&&ix<24?'<b>'+esc(p.slice(0,ix))+'</b> : '+esc(p.slice(ix+1).trim()):'<b>'+esc(f.topic)+'</b> : '+esc(p))+critHtml(f)}
function resultTop(S,si){
 var tot=0,fo=0,ch='';
 S.items.forEach(function(i){var it=D[i],f=0,w=wrongPicks(i);it.fixes.forEach(function(x,k){tot++;if(foundFix(i,k)){fo++;f++}});
  var miss=it.fixes.length-f;
  if(miss||w)ch+='<button type="button" class="rchip'+(miss?' m':'')+'" data-jump="s'+i+'">'+String(it.n).padStart(2,'0')+'번 '+(miss?'놓침':'')+(miss&&w?' · ':'')+(w?'틀리게 고름':'')+'</button>'});
 return '<div class="rsum"><b>결과</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(ch?'<div class="rchips">'+ch+'</div>':'')+'</div>';

function rightCard(q){
 var h='<div class="ac"><div class="ac-top g"><b>정답</b><span class="ac-a">'+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<div class="ac-k">'+esc(q.ko[q.a])+'</div>':'')+'</div>';
 h+='<div class="ac-sec">본문 근거</div><div class="pass">';
 q.evs.forEach(function(e){h+='<div class="pl1"><div class="e" lang="en"><mark>'+esc(e[0])+'</mark></div><div class="k">'+esc(e[1])+'</div></div>'});
 h+='</div><div class="ac-sec">왜 정답일까</div><div class="oc g"><div class="why">'+reasonHtml(q.ow[q.a])+'</div></div>';
 h+='<div class="nx"><button type="button" data-next="'+q.n+'">다음 문제</button></div></div>';

function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 return '<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';

function load(){try{var v=localStorage.getItem(BK);return v==null?null:+v}catch(e){return null}}
function save(n){try{var b=load();if(b==null||n>b)localStorage.setItem(BK,n)}catch(e){}}
function ppHtml(pp){
 return '<div class="dlg"><div class="who">'+en(TITLE_EN)+' &middot; '+en(pp[0][0])+'</div><div class="ln"><div class="en" lang="en">'+esc(pp.slice(1).map(function(p){return p[0]}).join(' '))+'</div></div></div>';

function qVisible(i){if(!aDone())return false;for(var j=0;j<i;j++){var s=qst[QL[j].n];if(!(s&&s.adv))return false}return true}
function stepQHtml(){
 if(!aDone())return '';
 if(!qgo)return '<div class="gobar"><button type="button" data-go="1">문제 풀러 가기</button></div>';
 var h='<div class="stage">2 · 본문 '+QL.length+'문제</div>',lastG=null;

  var q=QL[i];

  h+=qCard(i);
 }

function doneRow(q){return '<div class="qd" id="q'+q.n+'"><span class="qn">'+q.dn+'</span><span>정답 '+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<span class="qk">'+esc(q.ko[q.a])+'</span>':'')+'</div>'}
function postHtml(q,st){var n=q.note;
 return '<div class="post"><div class="ph">노트에 쓰기 &middot; 요약문 완성</div><div class="pl" lang="en">'+esc(n.en)+'</div><div class="pk">'+esc(n.ko)+'</div><div class="pw">'+n.words.map(function(w){return '<span lang="en">'+esc(w[0])+'</span> = '+esc(w[1])}).join(' &nbsp;&middot;&nbsp; ')+'</div>'+(st.wrote?'<div class="pd">작성 완료</div>':'<button type="button" data-wrote="'+q.n+'">노트에 썼어요</button>')+'</div>';
}
function qCard(i){
 var q=QL[i],st=qst[q.n]||(qst[q.n]={w:[],ok:0,adv:0,t0:Date.now(),t1:0,wrote:0});
 if(st.adv&&!q.note&&!st.w.length)return doneRow(q);
 var h='<div class="q" id="q'+q.n+'"><div class="qt"><span class="lbl">'+LABEL+'</span><span class="qn">'+q.dn+'</span>'+neg(q.q)+'</div>';

 }

 var isEv=function(t){return q.evs.some(function(e){return t===e[0]||(t.length>8&&t.indexOf(e[0])>=0)})};

  h+='</div>';
 }
 h+='<div class="ac-sec">보기 풀이</div>';

 });

 if(!st.ok){

  h+='</div>';

 return h+'</div>';

function fastInfo(){

function lognote(q){var n=q.note;wlog('s','2단계 · 요약문 완성',[{n:q.dn,a:'정답 '+CN[q.a]+' '+q.ans,m:[n.en,n.ko].concat(n.words.map(function(w){return w[0]+' = '+w[1]}))}])}
