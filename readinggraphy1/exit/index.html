<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩그라피 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"rg1-01-1","no":1,"ko":"닭을 태워서 ‘치킨 버스’라고?","items":[{"n":1,"t":"tf","q":"Chicken buses got their name because they sometimes carry live chickens.","ko":"치킨 버스는 때때로 살아 있는 닭을 싣고 다녀서 그런 이름을 얻었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They got this name because sometimes they carry live chickens!","그것들은 때때로 살아 있는 닭들을 실어 나르기 때문에 이런 이름을 얻게 되었다!"]],"w":"2번 문장에서 They got this name because sometimes they carry live chickens라고 함. 닭을 싣고 다녀서 붙은 이름이라 맞다.","c":"T"},"h":"28cf1d4bbc"},{"n":2,"t":"tf","q":"People in Guatemala buy the buses for a high price.","ko":"과테말라 사람들은 그 버스를 비싼 가격에 구입한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"People in Guatemala buy them for a low price.","과테말라 사람들은 그것들을 저렴한 가격에 구입한다."]],"w":"7번 문장은 buy them for a low price(저렴한 가격에 산다)라고 함. 비싼(high)이 아니라 저렴한(low)이라서 틀린 문장.","c":"F"},"h":"5ff98e54b0"},{"n":3,"t":"tf","q":"Many chicken buses in Guatemala are very old and need fixing.","ko":"과테말라의 많은 치킨 버스는 매우 오래되어 수리가 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Many chicken buses in Guatemala are very old and need fixing.","과테말라의 많은 치킨 버스들은 매우 오래되어 수리가 필요하다."]],"w":"10번 문장에 그대로 나옴. very old(매우 낡음)와 need fixing(수리될 필요가 있다)이 본문과 같다.","c":"T"},"h":"c843836381"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then, they paint them with bright colors and designs.)","ko":"그다음, 그들은 그것들을 (   ) 색과 디자인으로 칠한다.","opts":["어두운","낡은","밝은","조용한"],"word":"bright","r":{"a":"3) 밝은","ev":"8번 문장","s":[[8,"Then, they paint them with bright colors and designs.","그다음, 그들은 그것들을 밝은색과 디자인으로 칠한다."]],"w":"8번 문장의 bright colors는 ‘밝은 색’. 낡은 버스를 칠해서 눈에 띄게 한다는 흐름이라 ‘밝은’이 맞다. ‘어두운’은 반대말(dark)이다.","c":3},"h":"ef9fab8d34"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These buses run all over the country.)","ko":"이 버스들은 전국에서 (   ).","opts":["달리기를 하다","운행하다","도망치다","주문하다"],"word":"run","r":{"a":"2) 운행하다","ev":"3번 문장","s":[[3,"These buses run all over the country.","이 버스들은 전국에서 운행된다."]],"w":"버스가 주어이고 all over the country(전국에)가 뒤에 있으므로 run은 ‘(버스가) 운행하다, 다니다’. 사람이 뛴다는 뜻이 아니다.","c":2},"h":"c867ee4286"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSo many people use them to go to work, school, and other places.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그래서 많은 사람들이 직장, 학교, 그리고 다른 곳으로 가기 위해 그것들을 이용한다.","opts":["과테말라 사람들","치킨 버스","직장과 학교","살아 있는 닭들"],"pron":"them","r":{"a":"2) 치킨 버스","ev":"4~5번 문장","s":[[4,"Riding a chicken bus is also very cheap.","치킨 버스를 타는 것은 또한 매우 저렴하다."],[5,"So many people use them to go to work, school, and other places.","그래서 많은 사람들이 직장, 학교, 그리고 다른 곳으로 가기 위해 그것들을 이용한다."]],"w":"5번 문장은 사람들이 직장과 학교에 가려고 them을 이용한다는 내용. 이용하는 교통수단은 4번에서 말한 치킨 버스이다.","c":2,"k":"them = 치킨 버스"},"h":"d25ecfd6ea"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"People can’t imagine Guatemala without chicken buses.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사람들은 치킨 버스가 없는 과테말라를 상상할 수 없다.","opts":["치킨 버스는 과테말라 밖에서도 인기가 있다.","치킨 버스는 과테말라에서 없어도 되는 존재이다.","과테말라 사람들은 치킨 버스를 상상 속에서만 본다.","치킨 버스는 과테말라에서 빠질 수 없을 만큼 중요하다."],"r":{"a":"4) 치킨 버스는 과테말라에서 빠질 수 없을 만큼 중요하다.","ev":"11~12번 문장","s":[[11,"But they are still very special to the country.","그러나 그것들은 여전히 그 나라에게 매우 특별하다."],[12,"People can’t imagine Guatemala without chicken buses.","사람들은 치킨 버스가 없는 과테말라를 상상할 수 없다."]],"w":"can’t imagine A without B는 ‘B 없는 A는 상상할 수 없다’. 11번에서 여전히 특별하다고 했으니 치킨 버스가 매우 중요하다는 뜻이다.","c":4},"h":"7dc0b0eaa9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["Chicken buses were once school buses in America.","Chicken buses only run in the capital city.","Chicken buses were first made in Guatemala.","Chicken buses never carry any people."],"oko":["치킨 버스는 예전에 미국의 스쿨버스였다.","치킨 버스는 수도에서만 운행된다.","치킨 버스는 처음부터 과테말라에서 만들어졌다.","치킨 버스는 사람을 전혀 태우지 않는다."],"r":{"a":"1) Chicken buses were once school buses in America. (치킨 버스는 예전에 미국의 스쿨버스였다.)","ev":"5~6번 문장","s":[[5,"So many people use them to go to work, school, and other places.","그래서 많은 사람들이 직장, 학교, 그리고 다른 곳으로 가기 위해 그것들을 이용한다."],[6,"These buses were once school buses in America.","이 버스들은 예전에는 미국의 스쿨버스였다."]],"w":"6번에서 치킨 버스는 예전에 미국의 스쿨버스였다고 함. ②는 전국에서 운행된다는 내용과 다르고, ③은 미국에서 온 버스라는 6번과 다르며, ④는 5번에서 많은 사람이 이용한다고 함.","c":1},"h":"bcea4207e8"},{"n":9,"t":"sum","q":"Riding a chicken bus is (A), and the buses are still very (B) to Guatemala.","ko":"치킨 버스를 타는 것은 (A)하고, 그 버스들은 여전히 과테말라에 매우 (B)하다.","opts":["(A) cheap / (B) special","(A) expensive / (B) special","(A) cheap / (B) dangerous","(A) expensive / (B) dangerous","(A) cheap / (B) boring"],"oko":["(A) 저렴한 / (B) 특별한","(A) 비싼 / (B) 특별한","(A) 저렴한 / (B) 위험한","(A) 비싼 / (B) 위험한","(A) 저렴한 / (B) 지루한"],"r":{"a":"1) (A) cheap / (B) special ((A) 저렴한 / (B) 특별한)","ev":"4번, 11번 문장","s":[[4,"Riding a chicken bus is also very cheap.","치킨 버스를 타는 것은 또한 매우 저렴하다."],[11,"But they are still very special to the country.","그러나 그것들은 여전히 그 나라에게 매우 특별하다."]],"w":"4번 Riding a chicken bus is also very cheap(타는 것은 매우 저렴하다), 11번 they are still very special to the country(그 나라에 여전히 매우 특별하다)에서 가져옴.","c":1},"h":"8dc915e498"},{"n":10,"t":"fill","q":"[A] the buses, there are fun [B] and sometimes flat-screen TVs!","ko":"버스 [A]에는 재미있는 [B]이(가) 있고, 때로는 평면 스크린 TV도 있다!","bank":["inside","decorations","imagine","fix","carry","decide"],"bko":{"inside":"~ 안에","decorations":"장식들","imagine":"상상하다","fix":"고치다","carry":"나르다","decide":"결정하다"},"r":{"a":"[A] inside (~ 안에), [B] decorations (장식들)","ev":"9번 문장","s":[[9,"Inside the buses, there are fun decorations and sometimes flat-screen TVs!","버스 안에는 재미있는 장식들이 있고, 때로는 평면 스크린 TV도 있다!"]],"w":"9번 Inside the buses, there are fun decorations and sometimes flat-screen TVs(버스 안에는 재미있는 장식들과 때로는 평면 스크린 TV도 있다)에서 가져옴. [A]에는 장소를 나타내는 말(inside), [B]에는 명사(decorations)만 들어갈 수 있다.","c":null},"h":"9564e097d2"}]},{"u":1,"id":"rg1-01-2","no":2,"ko":"호박으로 만든 배를 타고 강을 내려갔다고?","items":[{"n":1,"t":"tf","q":"Duane Hansen is a farmer from Nebraska.","ko":"Duane Hansen은 네브래스카 출신의 농부이다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Duane Hansen is a farmer from Nebraska, U.S.","Duane Hansen은 미국 네브래스카주의 농부이다."]],"w":"1번 문장에 Duane Hansen is a farmer from Nebraska라고 나옴. 농부이고 네브래스카 출신이라 맞다.","c":"T"},"h":"0673c7e6c3"},{"n":2,"t":"tf","q":"Duane’s big pumpkin weighed less than 380 kilograms.","ko":"Duane의 큰 호박은 무게가 380 kg보다 적었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It weighed over 380 kilograms.","그것은 무게가 380 kg이 넘었다."]],"w":"7번 문장에서 It weighed over 380 kilograms(380 kg이 넘었다)라고 함. ‘less than(~보다 적은)’이 아니라 ‘over(~가 넘는)’라서 틀린 문장.","c":"F"},"h":"03c1830e7b"},{"n":3,"t":"tf","q":"Duane stopped when water kept getting inside his pumpkin.","ko":"호박 안으로 물이 계속 들어오자 Duane은 멈췄다.","r":{"a":"F (본문과 다른 내용)","ev":"12~13번 문장","s":[[12,"Water from the waves kept getting inside his pumpkin.","파도로부터 오는 물이 그의 호박 안으로 계속 들어갔다."],[13,"Still, Duane didn’t stop.","그럼에도 불구하고, Duane은 멈추지 않았다."]],"w":"12번에서 물이 계속 들어왔지만 13번에서 Still, Duane didn’t stop(그럼에도 멈추지 않았다)이라고 함. 멈췄다는 말은 본문과 반대.","c":"F"},"h":"0eda310d6b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He likes growing huge pumpkins.)","ko":"그는 (   ) 호박을 키우는 것을 좋아한다.","opts":["작은","무거운","거대한","오래된"],"word":"huge","r":{"a":"3) 거대한","ev":"2번 문장","s":[[2,"He likes growing huge pumpkins.","그는 거대한 호박을 키우는 것을 좋아한다."]],"w":"huge pumpkins는 ‘엄청나게 큰 호박’. 3번의 really big pumpkin과 같은 흐름이라 ‘거대한’이 맞다. 무거운은 6번의 heavy와 헷갈린 함정.","c":3},"h":"46931b0abf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It weighed over 380 kilograms.)","ko":"그것은 380 kg이 넘게 (   ).","opts":["들어 올렸다","무게가 ~이었다","측정했다","운반했다"],"word":"weighed","r":{"a":"2) 무게가 ~이었다","ev":"7번 문장","s":[[7,"It weighed over 380 kilograms.","그것은 무게가 380 kg이 넘었다."]],"w":"weigh는 뒤에 무게(380 kilograms)가 나오면 ‘무게가 ~이다’. 6번에서 정말 무겁다고 한 뒤 그 무게를 알려 주는 문장이다.","c":2},"h":"218847d390"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSo, he thought of a fun idea: to make his pumpkin into a boat and ride it down the Missouri River.","ko":"밑줄 친 \"it\"이 가리키는 것은?","sko":"그래서, 그는 재미있는 아이디어를 생각해 냈다: 자신의 호박을 배로 만들어 미주리 강을 타고 내려가는 것이었다.","opts":["미주리 강","그의 카약","그 재미있는 아이디어","그의 호박(배)"],"r":{"a":"4) 그의 호박(배)","ev":"8번 문장","s":[[8,"So, he thought of a fun idea: to make his pumpkin into a boat and ride it down the Missouri River.","그래서, 그는 재미있는 아이디어를 생각해 냈다: 자신의 호박을 배로 만들어 미주리 강을 타고 내려가는 것이었다."]],"w":"ride it은 ‘그것을 타다’. 앞에서 his pumpkin을 boat로 만든다고 했으니 탈 수 있는 것은 호박 배. 강은 down 뒤에 따로 나온다.","c":4,"k":"it = 그의 호박(배)"},"pron":"it","h":"b924ce26e4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"And you won’t believe this — he made a boat out of a really big pumpkin and went out on a river!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그리고 당신은 이것을 믿지 못하겠지만 ― 그는 매우 큰 호박으로 배를 만들어 강으로 나갔다!","opts":["Duane이 큰 호박으로 배를 만들어 강에 나간 일은 믿기 어려울 만큼 놀랍다.","Duane의 이야기는 거짓말이니 믿으면 안 된다.","Duane은 호박을 배로 팔아서 큰돈을 벌었다.","Duane은 강에서 배를 타고 호박을 사 왔다."],"r":{"a":"1) Duane이 큰 호박으로 배를 만들어 강에 나간 일은 믿기 어려울 만큼 놀랍다.","ev":"3번 문장","s":[[3,"And you won’t believe this — he made a boat out of a really big pumpkin and went out on a river!","그리고 당신은 이것을 믿지 못하겠지만 ― 그는 매우 큰 호박으로 배를 만들어 강으로 나갔다!"]],"w":"3번의 you won’t believe this는 믿기 어려울 만큼 놀랍다는 뜻이고, 뒤에 그 놀라운 일(큰 호박으로 배를 만들어 강으로 나감)이 이어진다.","c":1},"h":"31791d383c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["Duane used a motor to move his pumpkin boat.","Duane’s pumpkin was small and light.","Duane traveled more than 61 kilometers in his pumpkin boat.","Duane grew his pumpkin in only one month."],"oko":["Duane은 호박 배를 모터로 움직였다.","Duane의 호박은 작고 가벼웠다.","Duane은 호박 배로 61 킬로미터 이상을 이동했다.","Duane은 단 한 달 만에 호박을 키웠다."],"r":{"a":"3) Duane traveled more than 61 kilometers in his pumpkin boat. (Duane은 호박 배로 61 킬로미터 이상을 이동했다.)","ev":"4번, 6번, 10번, 14번 문장","s":[[4,"Duane spent almost 10 years growing big pumpkins.","Duane은 큰 호박들을 키우는 데 거의 10년을 보냈다."],[6,"This pumpkin was 370 cm around and really heavy.","이 호박은 둘레가 370 cm였고 정말 무거웠다."],[10,"Then, he took paddles from his kayak.","그 후, 그는 그의 카약에서 노를 가져왔다."],[14," es carried him far out into the ocean.","바람과 파도가 그를 바다의 먼 곳으로 데리고 갔다."],[4,"Poor Elvis was lost in the Caribbean Sea!","불쌍한 Elvis는 카리브 해에서 길을 잃었다!"]],"w":"3번에서 바람과 파도가 그를 바다의 먼 곳으로 데리고 갔다고 함. ①은 갑자기 날씨가 변해 길을 잃은 상황과 맞지 않고, ③과 ④는 본문에 없는 내용이다.","c":2},"h":"daad513692"},{"n":9,"t":"sum","q":"Elvis said he only had a (A) of ketchup and some (B).","ko":"Elvis는 케첩 한 (A)와(과) 약간의 (B)만 가지고 있었다고 말했다.","opts":["(A) bottle / (B) seasonings","(A) bottle / (B) snacks","(A) box / (B) seasonings","(A) box / (B) snacks","(A) bottle / (B) plants"],"oko":["(A) 병 / (B) 양념들","(A) 병 / (B) 간식들","(A) 상자 / (B) 양념들","(A) 상자 / (B) 간식들","(A) 병 / (B) 식물들"],"r":{"a":"1) (A) bottle / (B) seasonings ((A) 병 / (B) 양념들)","ev":"8번 문장","s":[[8,"He explained, “I only had a bottle of ketchup and some seasonings.","그는 이렇게 설명했다, “저는 케첩 한 병과 약간의 양념들만 가지고 있었어요."]],"w":"8번 I only had a bottle of ketchup and some seasonings(저는 케첩 한 병과 약간의 양념만 가지고 있었어요)에서 가져옴.","c":1},"h":"e16cd88b95"},{"n":10,"t":"fill","q":"I [A] them with [B] and drank it.","ko":"저는 그것들을 [B]과(와) [A], 그것을 마셨죠.","bank":["mixed","rainwater","called","saw","navy","plane"],"bko":{"mixed":"섞었다 (mix의 과거)","rainwater":"빗물","called":"불렀다 (call의 과거)","saw":"보았다 (see의 과거)","navy":"해군","plane":"비행기"},"r":{"a":"[A] mixed (섞었다 (mix의 과거)), [B] rainwater (빗물)","ev":"9번 문장","s":[[9,"I mixed them with rainwater and drank it.","저는 그것들을 빗물과 섞어 마셨죠."]],"w":"9번 I mixed them with rainwater and drank it(그것들을 빗물과 섞어 마셨죠)에서 가져옴. 나머지는 mix 자리나 with 뒤에 들어가면 뜻이 맞지 않는다.","c":null},"h":"a675e30cfb"}]},{"u":2,"id":"rg1-02-1","no":1,"ko":"발이 파란색일수록 인기 폭발이라고?","items":[{"n":1,"t":"tf","q":"Baby blue-footed boobies have white feathers and fluffy bodies.","ko":"새끼 푸른발부비새는 하얀 깃털과 솜털로 뒤덮인 몸을 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When they’re babies, they have white feathers and fluffy bodies.","그들이 새끼일 때는 깃털이 하얗고 몸은 솜털로 뒤덮여 있다."]],"w":"3번 문장에 When they’re babies, they have white feathers and fluffy bodies라고 나옴. 새끼 때의 모습과 같아 맞다.","c":"T"},"h":"0997b65541"},{"n":2 ish / (B) enemy","(A) birds / (B) farmer"],"oko":["(A) 새 / (B) 짝","(A) 새 / (B) 적","(A) 물고기 / (B) 짝","(A) 물고기 / (B) 적","(A) 새 / (B) 농부"],"r":{"a":"1) (A) birds / (B) partner ((A) 새 / (B) 짝)","ev":"1번, 10번 문장","s":[[1,"The blue-footed boobies are birds.","푸른발부비새는 새이다."],[10,"Also, male boobies use their blue feet to attract a partner.","또한, 수컷 부비새들은 짝의 마음을 끌기 위해 그들의 푸른 발을 사용한다."]],"w":"1번 The blue-footed boobies are birds(푸른발부비새는 새이다), 10번 male boobies use their blue feet to attract a partner(수컷은 짝의 마음을 끌기 위해 푸른 발을 사용한다)에서 가져옴.","c":1},"h":"995c6fe6f0"},{"n":10,"t":"fill","q":"The dance might look [A] to [B].","ko":"그 춤은 [B]에게는 [A] 보일지도 모른다.","bank":["funny","humans","health","feathers","islands","pigments"],"bko":{"funny":"웃긴","humans":"사람들","health":"건강","feathers":"깃털들","islands":"섬들","pigments":"색소들"},"r":{"a":"[A] funny (웃긴), [B] humans (사람들)","ev":"14번 문장","s":[[14,"The dance might look funny to humans.","그 춤은 사람들에게는 웃겨 보일지도 모른다."]],"w":"14번 The dance might look funny to humans(그 춤은 사람들에게는 웃겨 보일지도 모른다)에서 가져옴. 나머지는 look 뒤에 올 수 없거나 to 뒤에 올 수 없다.","c":null},"h":"588de83734"}]},{"u":2,"id":"rg1-02-2","no":2,"ko":"고등학교 졸업하고 자전거로 알래스카에서 아르헨티나까지?","items":[{"n":1,"t":"tf","q":"Liam went on his adventure when he was 17 years old.","ko":"Liam은 17살이었을 때 모험을 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"When he was 17 years old, he went on a great adventure: riding his bike from Alaska to Argentina!","그는 17살이었을 때 굉장한 모험을 시작했다: 그것은 바로 알래스카에서 아르헨티나까지 자전거를 타고 가는 것이었다!"]],"w":"2번 문장에 When he was 17 years old, he went on a great adventure라고 나옴. 본문 그대로라 맞다.","c":"T"},"h":"6b887b19be"},{"n":2,"t":"tf","q":"Liam gave up after he had a bike accident in Colombia.","ko":"Liam은 콜롬비아에서 자전거 사고를 겪은 뒤 포기했다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"In Colombia, he even had a bike accident.","콜롬비아에서, 그는 심지어 자전거 사고를 겪기도 했다."],[9,"But he didn’t give up.","하지만 그는 포기하지 않았다."]],"w":"8번에서 콜롬비아에서 자전거 사고를 겪었지만, 9번에서 But he didn’t give up(포기하지 않았다)이라고 함. 포기했다는 말은 틀렸다.","c":"F"},"h": 리에게 가까이 다가와서, 우리 피부에 앉기도 한다."]],"w":"나비(they)가 주어이고 on our skin(우리 피부 위에)이 뒤에 있으므로 land는 ‘내려앉다’. 땅(land)이라는 명사의 뜻이 아니다.","c":2},"h":"b09cc1bd6f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Some butterflies… even drink tears from animals like crocodiles for similar reasons.)","ko":"일부 나비들은 … (   ) 이유로 악어와 같은 동물의 눈물까지 마신다.","opts":["다른","특별한","여러 가지의","비슷한"],"word":"similar","r":{"a":"4) 비슷한","ev":"9~10번 문장","s":[[9,"They usually need salt and other minerals for reproduction.","그들은 주로 번식을 위해 소금과 다른 미네랄이 필요하다."],[10,"Some butterflies, like the Julia butterfly, even drink tears from animals like crocodiles for similar reasons.","줄리아 나비와 같은 일부 나비들은 비슷한 이유로 악어와 같은 동물의 눈물까지 마신다."]],"w":"9번에서 소금·미네랄이 필요하다고 했고, 10번 눈물을 마시는 것도 비슷한 이유라는 흐름. similar = 비슷한이고 반대말은 different(다른)이다.","c":4},"h":"96438262bf"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSo, if a butterfly lands on you, it might just be looking for a tasty salt snack!","ko":"밑줄 친 it이 가리키는 것은?","sko":"따라서, 만약 나비가 당신에게 앉는다면, 그것은 그저 맛있는 소금 간식을 찾고 있는 것일지도 모른다!","opts":["나비","당신","악어","꽃"],"pron":"it","r":{"a":"1) 나비","ev":"11번 문장","s":[[11,"So, if a butterfly lands on you, it might just be looking for a tasty salt snack!","따라서, 만약 나비가 당신에게 앉는다면, 그것은 그저 맛있는 소금 간식을 찾고 있는 것일지도 모른다!"]],"w":"11번은 나비가 당신에게 앉으면 it이 맛있는 소금 간식을 찾고 있는 것일 수 있다는 내용. it은 앞의 a butterfly(나비)를 가리킨다.","c":1,"k":"it = 나비"},"h":"299f1a3966"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But here’s a surprise — they also need other things, like salt.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 여기 놀라운 점이 있다 — 그들은 소금과 같은 다른 것들도 필요로 한다.","opts":["나비는 꿀 외에 소금 같은 다른 것도 필요로 한다는 놀라운 사실이다.","나비가 소금을 싫어한다는 놀라운 사실이다.","나비가 꿀을 전혀 먹지 않는다는 놀라운 사실이다.","나비가 소금을 먹으면 곧 죽는다는 놀라운 사실이다."],"r":{"a":"1) 나비는 꿀 외에 소금 같은 다른 것도 필요로 한다는 놀라운 사실이다.","ev":"4~5번 문장","s":[[4,"Many people think butterflies only eat nectar from flowers.","많은 사람들이 나비가 꽃의 꿀만 먹는다고 생각한다."],[5,"But here’s a surprise — they also need other things, like salt.","하지만 여기 놀라운 점이 있다 — 그들은 소금과 같은 다른 것들도 필요로 한다."]],"w":"5번의 here’s a surprise 뒤에서, 나비가 꿀 말고도 소금 같은 다른 것들이 필요하다고 설명한다.","c":1},"h":"4ff3ebf2d9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["Butterflies usually need salt and other minerals for reproduction.","Butterflies need salt and other minerals only in winter.","Butterflies need salt only to fly faster.","Butterflies get minerals only from rocks."],"oko":["나비는 주로 번식을 위해 소금과 다른 미네랄이 필요하다.","나비는 겨울에만 소금과 다른 미네랄이 필요하다.","나비는 더 빨리 날기 위해서만 소금이 필요하다.","나비는 바위에서만 미네랄을 얻는다."],"r":{"a":"1) Butterflies usually need salt and other minerals for reproduction. (나비는 주로 번식을 위해 소금과 다른 미네랄이 필요하다.)","ev":"8~9번 문장","s":[[8,"Our sweat can also give them minerals and proteins.","우리의 땀은 또한 그들에게 미네랄과 단백질을 줄 수 있다."],[9,"They usually need salt and other minerals for reproduction.","그들은 주로 번식을 위해 소금과 다른 미네랄이 필요하다."]],"w":"9번에서 나비는 주로 번식을 위해 소금과 다른 미네랄이 필요하다고 함. ②, ③, ④는 본문에 없는 내용이고, 8번에서 땀도 미네랄을 줄 수 있다고 했다.","c":1},"h":"6b45df9a9c"},{"n":9,"t":"sum","q":"In the (A), we can see butterflies in (B) or parks.","ko":"(A)에 우리는 (B)이나 공원에서 나비들을 볼 수 있다.","opts":["(A) spring / (B) gardens","(A) spring / (B) deserts","(A) winter / (B) gardens","(A) winter / (B) deserts","(A) spring / (B) oceans"],"oko":["(A) 봄 / (B) 정원","(A) 봄 / (B) 사막","(A) 겨울 / (B) 정원","(A) 겨울 / (B) 사막","(A) 봄 / (B) 바다"],"r":{"a":"1) (A) spring / (B) gardens ((A) 봄 / (B) 정원)","ev":"1번 문장","s":[[1,"In the spring, we can see butterflies in gardens or parks.","봄에 우리는 정원이나 공원에서 나비들을 볼 수 있다."]],"w":"1번 In the spring, we can see butterflies in gardens or parks(봄에 우리는 정원이나 공원에서 나비들을 볼 수 있다)에서 가져옴.","c":1},"h":"415b8561cb"},{"n":10,"t":"fill","q":"Many people think butterflies only eat [A] from [B].","ko":"많은 사람들이 나비가 [B]에서 나오는 [A]만 먹는다고 생각한다.","bank":["nectar","flowers","crocodiles","parks","skin","sweat"],"bko":{"nectar":"꿀","flowers":"꽃들","crocodiles":"악어들","parks":"공원들","skin":"피부","sweat":"땀"},"r":{"a":"[A] nectar (꿀), [B] flowers (꽃들)","ev":"4번 문장","s":[[4,"Many people think butterflies only eat nectar from flowers.","많은 사람들이 나비가 꽃의 꿀만 먹는다고 생각한다."]],"w":"4번 Many people think butterflies only eat nectar from flowers(많은 사람들이 나비가 꽃의 꿀만 먹는다고 생각한다)에서 가져옴. 나머지는 이 문장의 뜻에 맞지 않는다.","c":null},"h":"cc89958399"}]},{"u":3,"id":"rg1-03-1","no":1,"ko":"카카오빈이 하나도 없는 초콜릿이라고?","items":[{"n":1,"t":"tf","q":"About 1.8 million children work on cacao farms around the world.","ko":"전 세계적으로 약 180만 명의 아이들이 카카오 농장에서 일한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Around the world, about 1.8 million children work on cacao farms.","전 세계적으로 약 180만 명의 아이들이 카카오 농장에서 일한다."]],"w":"4번 문장에 Around the world, about 1.8 million children work on cacao farms가 나옴. 본문 그대로라 맞다.","c":"T"},"h":"01570ea45b"},{"n":2,"t":"tf","q":"Big chocolate companies solved the problems very well.","ko":"대형 초콜릿 회사들은 그 문제들을 아주 잘 해결했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Big chocolate companies promised to solve these problems, but not much changed.","대형 초콜릿 회사들은 이런 문제들을 해결하기로 약속했지만, 크게 바뀌지는 않았다."]],"w":"6번에서 대형 회사들이 해결하기로 약속했지만 but not much changed(크게 바뀌지 않았다)라고 함. 잘 해결했다는 말은 반대이다.","c":"F"},"h":"01740df80d"},{"n":3,"t":"tf","q":"Fake chocolate uses barley and carob instead of cacao beans.","ko":"가짜 초콜릿은 카카오빈 대신 보리와 캐럽을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Instead, it uses barley and carob.","대신 그것은 보리와 캐럽을 사용한다."]],"w":"10번 문장에 Instead, it uses barley and carob가 나옴. 9번에서 카카오빈은 쓰지 않는다고 했으니 대신 보리와 캐럽을 쓰는 것이 맞다.","c":"T"},"h":"496677c7b6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It looks and tastes like regular chocolate.)","ko":"그것은 (   ) 초콜릿처럼 보이며 같은 맛이 난다.","opts":["깨끗한","일반적인","특별한","비싼"],"word":"regular","r":{"a":"2) 일반적인","ev":"7~8번 문장","s":[[7,"So, a company in the U.K. made a new kind of chocolate: “fake” chocolate.","그래서, 영국의 한 회사는 새로운 종류의 초콜릿인 ‘가짜’ 초콜릿을 만들었다."],[8,"It looks and tastes like regular chocolate.","그것은 일반적인 초콜릿처럼 보이며, 그와 같은 맛이 난다."]],"w":"8번은 가짜 초콜릿이 ‘진짜 보통 초콜릿’과 닮았다는 말이다. regular chocolate는 ‘일반적인 초콜릿’. regular는 ‘규칙적인’이라는 뜻으로도 쓰이니 문맥으로 구별할 것.","c":2},"h":"55ff4bad53"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But behind the sweet taste, there are some hidden problems.)","ko":"그러나 그 달콤한 맛 뒤에는 몇 가지 (   ) 문제들이 있다.","opts":["커다란","새로운","오래된","숨겨진"],"word":"hidden","r":{"a":"4) 숨겨진","ev":"3~5번 문장","s":[[3,"But behind the sweet taste, there are some hidden problems.","그러나 그 달콤한 맛 뒤에는 몇 가지 숨겨진 문제들이 있다."],[4,"Around the world, about 1.8 million children work on cacao farms.","전 세계적으로 약 180만 명의 아이들이 카카오 농장에서 일한다."],[5,"Plus, many trees get cut down to make space for these cacao farms.","게다가, 이런 카카오 농장을 위한 공간을 만들기 위해 많은 나무들이 베인다."]],"w":"달콤한 맛 뒤(behind)에 있는 문제이고, 4~5번에서야 드러나는 문제들이라 hidden은 ‘숨겨진’. 겉으로는 안 보이는 문제라는 뜻이다.","c":4},"h":"bc9aba47db"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt might be a bit expensive.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 약간 비쌀지도 모른다.","opts":["그 새로운 초콜릿","지구","아이들","나무"],"pron":"It","r":{"a":"1) 그 새로운 초콜릿","ev":"11~12번 문장","s":[[11,"This new chocolate is better for the Earth and people.","이 새로운 초콜릿은 지구와 사람들에게 더 좋다."],[12,"It might be a bit expensive.","그것은 약간 비쌀지도 모른다."]],"w":"12번은 It이 약간 비쌀지도 모른다는 내용. 11번에서 지구와 사람들에게 더 좋다고 한 이 새로운 초콜릿을 가리킨다.","c":1,"k":"It = 그 새로운 초콜릿"},"h":"bbbdb7b7d7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But if more people buy it, the dark side of the chocolate industry might become brighter!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 더 많은 사람들이 그것을 산다면, 초콜릿 산업의 어두운 측면은 더 밝아지게 될지도 모른다!","opts":["더 많은 사람이 그것을 사면 초콜릿 산업이 문을 닫을 것이다.","사람들이 초콜릿을 사지 않아서 어두운 면이 사라질 것이다.","더 많은 사람이 그것을 사면 초콜릿 산업의 문제가 나아질 수 있다.","초콜릿 산업은 원래 밝은 면만 갖고 있었다."],"r":{"a":"3) 더 많은 사람이 그것을 사면 초콜릿 산업의 문제가 나아질 수 있다.","ev":"11~13번 문장","s":[[11,"This new chocolate is better for the Earth and people.","이 새로운 초콜릿은 지구와 사람들에게 더 좋다."],[12,"It might be a bit expensive.","그것은 약간 비쌀지도 모른다."],[13,"But if more people buy it, the dark side of the chocola om butterflies가 나오고, 9번에서 나비의 날개에 가짜 눈이 있다고 설명함. 본문과 일치한다.","c":"T"},"h":"9cd464b8cf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When lions and leopards hunt, they usually sneak up and surprise their prey.)","ko":"사자와 표범이 사냥할 때, 그것들은 보통 살금살금 다가가서 (   )를 기습한다.","opts":["천적","먹이","친구","주인"],"word":"prey","r":{"a":"2) 먹이","ev":"6번 문장","s":[[6,"When lions and leopards hunt, they usually sneak up and surprise their prey.","사자와 표범이 사냥할 때, 그것들은 보통 살금살금 다가가서 먹이를 기습한다."]],"w":"사자와 표범이 사냥할 때 기습하는 대상이므로 prey는 ‘먹이, 사냥감’. 10번의 enemies(천적)와는 반대 입장이라 헷갈리지 말 것.","c":2},"h":"fc016a27d2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So if they think the cows can see them, they may not attack.)","ko":"그래서 만약 그것들이 소가 그것들을 볼 수 있다고 생각한다면, 그것들은 (   ) 않을지도 모른다.","opts":["도망치다","숨다","공격하다","따라가다"],"word":"attack","r":{"a":"3) 공격하다","ev":"6~7번 문장","s":[[6,"When lions and leopards hunt, they usually sneak up and surprise their prey.","사자와 표범이 사냥할 때, 그것들은 보통 살금살금 다가가서 먹이를 기습한다."],[7,"So if they think the cows can see them, they may not attack.","그래서 만약 그것들이 소가 그것들을 볼 수 있다고 생각한다면, 그것들은 공격하지 않을지도 모른다."]],"w":"6번에서 사냥하는 사자와 표범이 소가 자기들을 본다고 생각하면 may not attack이라고 했으니 ‘공격하다’. 눈 그림으로 공격을 막는다는 흐름이다.","c":3},"h":"3fb18f7ba8"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSince cows aren’t born with them, farmers can just draw eyes on cow’s butts.","ko":"밑줄 친 them이 가리키는 것은?","sko":"소는 가짜 눈을 가지고 태어나지 않기 때문에, 농부들은 그저 소의 엉덩이에 눈을 그려 주면 된다.","opts":["나비들","가짜 눈","농부들","사자와 표범"],"pron":"them","r":{"a":"2) 가짜 눈","ev":"9~11번 문장","s":[[9,"Some butterflies have fake eyes on their wings.","몇몇 나비들은 그들의 날개에 가짜 눈을 가지고 있다."],[10,"These fake eyes help to scare away their enemies, like birds.","이 가짜 눈이 새와 같은 그것들의 천적을 쫓아내는 데 도움을 준다."],[11,"Since cows aren’t born with them, farmers can just draw eyes on cow’s butts.","소는 가짜 눈을 가지고 태어나지 않기 때문에, 농부들은 그저 소의 엉덩이에 눈을 그려 주면 된다."]],"w":"11번은 소가 them을 갖고 태어나지 않아서 농부들이 눈을 그려 주면 된다는 내용. 앞(9~10번)에서 말한 나비의 날개에 있 [8,"These data centers use a lot of power because they are always turned on.","이런 데이터 센터들은 항상 켜져 있기 때문에 많은 전력을 사용해요."],[9,"Storing lots of emails means that these centers use more energy.","많은 이메일을 저장하는 것은 이 센터들이 더 많은 에너지를 사용한다는 것을 의미해요."]],"w":"9번은 이메일을 많이 저장하면 these centers가 에너지를 더 쓴다는 내용. 8번의 These data centers(데이터 센터들)를 가리킨다.","c":2,"k":"these centers = 데이터 센터들"},"h":"cbf5d69dd5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, if you want to help our planet, start by cleaning your inbox!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서, 당신이 우리 지구를 돕기를 원한다면, 받은 편지함을 정리하는 것부터 시작해보세요!","opts":["지구를 돕고 싶다면 받은 편지함을 정리하는 것부터 시작해 보라는 뜻이다.","지구를 돕고 싶다면 인터넷을 쓰지 말아야 한다는 뜻이다.","받은 편지함을 정리하면 이메일이 더 늘어난다는 뜻이다.","지구를 돕는 일은 편지함을 정리한 뒤에는 필요 없다는 뜻이다."],"r":{"a":"1) 지구를 돕고 싶다면 받은 편지함을 정리하는 것부터 시작해 보라는 뜻이다.","ev":"12번 문장","s":[[12,"So, if you want to help our planet, start by cleaning your inbox!","따라서, 당신이 우리 지구를 돕기를 원한다면, 받은 편지함을 정리하는 것부터 시작해 보세요!"]],"w":"12번은 지구를 돕고 싶다면 받은 편지함 정리부터 시작하라는 조언이다.","c":1},"h":"b044e40c6d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["Deleting emails is bad for our planet.","Deleting emails can help our planet.","Emails are stored only on personal phones.","Data centers are small libraries for people."],"oko":["이메일을 삭제하는 것은 우리 지구에 해롭다.","이메일을 삭제하는 것은 우리 지구를 도울 수 있다.","이메일은 개인 휴대전화에만 저장된다.","데이터 센터는 사람들을 위한 작은 도서관이다."],"r":{"a":"2) Deleting emails can help our planet. (이메일을 삭제하는 것은 우리 지구를 도울 수 있다.)","ev":"4번, 6~7번 문장","s":[[4,"But did you know that deleting emails can help our planet?","그러나 이메일을 삭제하는 것이 우리 지구를 도울 수 있다는 것을 알고 있었나요?"],[6,"When you use the internet, all the information, including emails, is stored in data centers.","당신이 인터넷을 사용할 때, 이메일을 포함한 모든 정보는 데이터 센터에 저장돼요."],[7,"Think of them as huge libraries for computers.","그것들을 컴퓨터를 위한 거대한 도서관이라고 생각해 보세요."]],"w":"4번에서 이메일을 삭제하는 것이 지구를 도울 수 있다고 함. ③은 6번에서 데이터 센터에 저장된다고 했고, ④는 7번에서 컴퓨터를 위한 거대한 도서관이라고 했다.","c":2},"h":"b498846ccb"},  sunburn from lemon juice, you must go to the hospital right away.","ko":"레몬즙으로 인해 햇볕 화상을 입으면 즉시 병원에 가야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"If you get a sunburn from lemon juice, you can take care of it at home.","만약 당신이 레몬즙으로 인해 화상을 입는다면, 집에서 관리할 수 있다."]],"w":"9번 문장에서 you can take care of it at home(집에서 관리할 수 있다)이라고 함. 반드시 병원에 가야 한다는 말은 없어서 F.","c":"F"},"h":"1df4a0916b"},{"n":3,"t":"tf","q":"Putting a cool, wet towel on the skin can help itchiness and pain.","ko":"차갑고 젖은 수건을 피부에 올려 두는 것은 가려움과 통증에 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11~12번 문장","s":[[11,"Then, put a cool, wet towel on your skin a few times a day.","그다음, 하루에 여러 번 당신의 피부 위에 차가운 젖은 수건을 얹어라."],[12,"This will help your itchiness and pain.","이는 당신의 가려움증과 통증에 도움이 될 것이다."]],"w":"11번에서 차갑고 젖은 수건을 피부에 올려 두라고 하고(put 놓다), 12번 This will help your itchiness and pain으로 효과를 말함. 같은 내용이라 T.","c":"T"},"h":"37c930ffe1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Wash the area with mild soap and water.)","ko":"순한 비누와 물로 그 부위를 씻어라.","opts":["강한","순한","비싼","뜨거운"],"word":"mild","r":{"a":"2) 순한","ev":"10번 문장","s":[[10,"Wash the area with mild soap and water.","순한 비누와 물로 그 부위를 씻어라."]],"w":"10번은 화상 입은 피부를 씻는 방법이라 피부에 자극이 적은 mild soap(순한 비누)가 알맞음. '강한'은 반대 뜻이고, 피부가 아픈 상황과 맞지 않음.","c":2},"h":"c6cf0ef515"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (We squeeze lemons to make lemonade.)","ko":"우리는 레모네이드를 만들기 위해 레몬을 짠다.","opts":["(즙을) 짜다","씻다","얼리다","자르다"],"word":"squeeze","r":{"a":"1) (즙을) 짜다","ev":"4번 문장","s":[[4,"We squeeze lemons to make lemonade.","우리는 레모네이드를 만들기 위해 레몬을 짠다."]],"w":"4번은 레몬으로 레모네이드를 만드는 과정이라, 레몬 즙을 내려고 꾹 누르는 행동인 squeeze(짜다)가 맞음. 5번에서 이 행동을 한 뒤 손을 씻으라고 한 점도 단서.","c":1},"h":"5c7943e5fa"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe sunburn can even turn into a rash if it’s really bad.","ko":"밑줄 친 it이 가리키는 것은?","sko":"햇볕으로 인한 화상은 심지어 그것이 아주 심하면 발진으로 변할 수도 있다.","opts":["햇볕으로 인한 화상","발진","레몬즙","피부"],"pron":"it","r":{"a":"1) 햇볕으로 인한 화상","ev":"6~7번 문장","s":[[6,"If we don’t and go out in the sun, we might get a sunburn!","만약 우리가 그러지 않고 햇볕에 나간다면, 우리는 햇볕으로 인한 화상을 입을지도 모른다!"],[7,"The sunburn can even turn into a rash if it’s really bad.","햇볕으로 인한 화상은 심지어 그것이 아주 심하면 발진으로 변할 수도 있다."]],"w":"7번은 The sunburn이 주어이고, 그것이 아주 심하면 발진으로 변할 수 있다는 내용. it은 The sunburn(햇볕으로 인한 화상)을 가리킨다.","c":1,"k":"it = 햇볕으로 인한 화상"},"h":"383c116aa8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If we don’t and go out in the sun, we might get a sunburn!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 우리가 그러지 않고 햇볕에 나간다면, 우리는 햇볕으로 인한 화상을 입을지도 모른다!","opts":["손을 씻고 햇볕에 나가면 반드시 화상을 입는다.","손을 씻지 않으면 햇볕에 나갈 수 없다.","손을 씻지 않은 채 햇볕에 나가면 화상을 입을 수도 있다.","햇볕에 나가지 않아도 손에 화상이 생긴다."],"r":{"a":"3) 손을 씻지 않은 채 햇볕에 나가면 화상을 입을 수도 있다.","ev":"5~6번 문장","s":[[5,"After doing this, it’s very important to wash our hands well.","이것을 한 후에는, 손을 잘 씻는 것이 매우 중요하다."],[6,"If we don’t and go out in the sun, we might get a sunburn!","만약 우리가 그러지 않고 햇볕에 나간다면, 우리는 햇볕으로 인한 화상을 입을지도 모른다!"]],"w":"If we don’t는 5번의 '손을 잘 씻는 것'을 하지 않으면이라는 뜻. might(~일지도 모른다)는 가능성이라 반드시가 아님. 씻고 나가는 경우(1번), 나갈 수 없다(2번), 안 나가도 생긴다(4번)는 본문과 다름.","c":3},"h":"4efa1f3916"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["Lemon juice is good for our skin in the sun.","Lemon juice can burn our skin in the sun.","Lemonade is made from oranges.","Lemon juice never changes our skin."],"oko":["레몬즙은 햇볕 아래에서 우리 피부에 좋다.","레몬즙은 햇볕 아래에서 우리 피부를 태울 수 있다.","레모네이드는 오렌지로 만든다.","레몬즙은 우리 피부를 전혀 변하게 하지 않는다."],"r":{"a":"2) Lemon juice can burn our skin in the sun. (레몬즙은 햇볕 아래에서 우리 피부를 태울 수 있다.)","ev":"3~4번 문장","s":[[3,"Lemon juice can burn our skin in the sun!","레몬즙은 우리의 피부를 햇볕에 타게 할 수 있다!"],[4,"We squeeze lemons to make lemonade.","우리는 레모네이드를 만들기 위해 레몬을 짠다."]],"w":"3번에서 레몬즙은 햇볕 아래에서 우리 피부를 태울 수 있다고 함. ①과 ④는 3번에서 햇볕 아래 피부를 태울 수 있다고 한 내용과 반대이고, ③은 4번에서 레몬을 짜서 만든다고 함.","c":2},"h":"d033a29450"},{"n":9,"t":"sum","q":"When we make lemonade, we need to  solve this problem soon.","그들은 이 문제를 곧 해결하기를 바란다."]],"w":"해결하기를 바라는(hope to solve) 주체는 바로 앞 12번에서 선인장이 번지는 것을 막으려고 노력하는 people in Valais. 선인장은 문제를 만드는 쪽이라 문제를 해결하고 싶어 하지 않음.","c":2,"k":"They = Valais의 사람들"},"pron":"They","h":"3fd01c6730"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, these cactuses are growing more and more even in Switzerland.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로, 이 선인장들이 스위스에서도 점점 더 많이 자라고 있다.","opts":["그 결과, 스위스에서는 선인장이 점점 줄어들고 있다.","이 선인장들은 스위스를 제외한 곳에서만 자란다.","스위스에서 선인장이 자라려면 더 많은 시간이 필요하다.","그 결과, 스위스에서도 이 선인장들이 점점 더 늘어나고 있다."],"r":{"a":"4) 그 결과, 스위스에서도 이 선인장들이 점점 더 늘어나고 있다.","ev":"7~8번 문장","s":[[7,"But now, the world is getting warmer, and there’s less snow in the Alps.","그러나 지금 세계는 점점 더 따뜻해지고 있고, 알프스에는 더 적은 양의 눈이 있다."],[8,"As a result, these cactuses are growing more and more even in Switzerland.","결과적으로, 이 선인장들이 스위스에서도 점점 더 많이 자라고 있다."]],"w":"7번에서 세계가 따뜻해지고 눈이 줄었고, 그 결과(As a result) 선인장이 스위스에서도 more and more(점점 더 많이) 자란다는 뜻. 줄어든다(1번), 스위스를 제외(2번)는 본문과 반대이고, 시간이 필요하다는 말은 없음.","c":4},"h":"46dba9276e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["Prickly pear cactuses usually live in cold and wet places.","Prickly pear cactuses usually live in hot and dry places.","The cactuses grow only in the Swiss Alps.","The world is getting colder, so the cactuses grow more."],"oko":["부채선인장은 보통 춥고 습한 곳에서 산다.","부채선인장은 보통 덥고 건조한 곳에서 산다.","선인장은 스위스 알프스에서만 자란다.","세계가 점점 추워져서 선인장이 더 많이 자란다."],"r":{"a":"2) Prickly pear cactuses usually live in hot and dry places. (부채선인장은 보통 덥고 건조한 곳에서 산다.)","ev":"2번, 5번, 7번 문장","s":[[2,"This cactus originally came from America.","이 선인장은 원래 미국에서 왔다."],[5,"Prickly pear cactuses usually live in hot and dry places.","부채선인장은 보통 덥고 건조한 곳에서 산다."],[7,"But now, the world is getting warmer, and there’s less snow in the Alps.","그러나 지금 세계는 점점 더 따뜻해지고 있고, 알프스에는 더 적은 양의 눈이 있다."]],"w":"5번에서 부채선인장은 보통 덥고 건조한 곳에서 산다고 함. ①은 5번과 반대이고, ③은 2번에서 미국에서 왔다고 했고, ④는 7번에서 세계가 점점 따뜻해지고 있다고 함.","c":2},"h":"0d9d5cd6dc"},{"n":9,"t":"sum","q":"The world is getting (A) and there is (B) snow in the Alps, so the cactus has become a big problem.","ko":"세계가 점점 더 (A) 상태가 되고 알프스에는 (B) 눈이 있어서, 그 선인장이 큰 문제가 되었다.","opts":["(A) warmer / (B) less","(A) warmer / (B) more","(A) colder / (B) less","(A) colder / (B) more","(A) wetter / (B) less"],"oko":["(A) 따뜻한 / (B) 더 적은","(A) 따뜻한 / (B) 더 많은","(A) 추운 / (B) 더 적은","(A) 추운 / (B) 더 많은","(A) 습한 / (B) 더 적은"],"r":{"a":"1) (A) warmer / (B) less ((A) 따뜻한 / (B) 더 적은)","ev":"1번, 7~8번 문장","s":[[1,"Valais, Switzerland has a problem with a plant called the prickly pear cactus.","스위스의 Valais는 부채선인장이라고 불리는 식물과 관련된 문제를 갖고 있다."],[7,"But now, the world is getting warmer, and there’s less snow in the Alps.","그러나 지금 세계는 점점 더 따뜻해지고 있고, 알프스에는 더 적은 양의 눈이 있다."],[8,"As a result, these cactuses are growing more and more even in Switzerland.","결과적으로, 이 선인장들이 스위스에서도 점점 더 많이 자라고 있다."]],"w":"7번 the world is getting warmer, and there’s less snow in the Alps(세계가 따뜻해지고 알프스에 눈이 줄었다)에서 가져옴.","c":1},"h":"b147dd40d7"},{"n":10,"t":"fill","q":"When the cactuses grow, they don’t [A] anything [B] to grow around them.","ko":"그 선인장들이 자랄 때, 그것들은 주변에 [B] 어떤 것도 자라도록 [A] 않는다.","bank":["allow","else","cover","solve","only","again"],"bko":{"allow":"허락하다","else":"다른","cover":"덮다","solve":"해결하다","only":"오직","again":"다시"},"r":{"a":"[A] allow (허락하다), [B] else (다른)","ev":"9번 문장","s":[[9,"When the cactuses grow, they don’t allow anything else to grow around them.","그 선인장들이 자랄 때, 그것들은 주변에 다른 어떤 것들도 자라게 두지 않는다."]],"w":"9번 they don’t allow anything else to grow around them(주변에 다른 어떤 것도 자라게 두지 않는다)에서 가져옴. 나머지는 이 자리에서 문법이나 의미가 맞지 않는다.","c":null},"h":"e5ef962416"}]},{"u":5,"id":"rg1-05-1","no":1,"ko":"가로등 기둥에 매달린 코트의 비밀","items":[{"n":1,"t":"tf","q":"The notes on the coats said that the coats were not lost.","ko":"코트에 붙은 쪽지는 그 코트들이 분실된 것이 아니라고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The notes said, “I’m not lost! If you feel cold, please take me to stay warm!”","쪽지에는 “저는 분실된 게 아니에요! 만약 당신이 춥다면, 저를 가져가 따뜻하게 지내세요!”라고 적혀 있었다."]],"w":"4번에 I’m not lost!(저는 분실된 게 아니에요!)라는 쪽지 내용이 있음. 코트들이 잃어버린 것이 아니라는 같은 내용이라 T.","c":"T"},"h":"f62340c3a1"},{"n":2,"t":"tf","q":"Tara Smith-Atkins asks the homeless to tie coats on lamp poles.","ko":"Tara Smith-Atkins는 노숙자들에게 가로등 기둥에 코트를 묶어 달라고 부탁한다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"First, she asks for donations of coats, scarves, and mittens.","먼저, 그녀는 코트, 목도리, 그리고 벙어리장갑을 기부해 달라고 요청한다."],[10,"Then, she asks local children to come and help her.","그 후, 그녀는 지역의 아이들에게 와서 자신을 도와 달라고 부탁한다."]],"w":"9번에서 Tara가 기부를 요청하고, 10번에서 도와 달라고 부탁하는 대상은 local children(지역 아이들). 노숙자에게 묶어 달라고 하는 것이 아니라서 F.","c":"F"},"h":"8c6e82a514"},{"n":3,"t":"tf","q":"Tara works to help the homeless during the cold winter in Canada.","ko":"Tara는 캐나다의 추운 겨울 동안 노숙자들을 돕기 위해 일한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"So, during the cold winter in Canada, she works to help the homeless.","그래서 캐나다의 추운 겨울 동안, 그녀는 노숙자들을 돕기 위해 일한다."]],"w":"8번 문장 she works to help the homeless와 같은 내용. work(일하다), help(돕다)가 그대로 쓰여 T.","c":"T"},"h":"035cac3754"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Together, they tie warm clothes on lamp poles.)","ko":"함께, 그들은 가로등 기둥에 따뜻한 옷들을 묶어 놓는다.","opts":["묶다","팔다","씻다","찾다"],"word":"tie","r":{"a":"1) 묶다","ev":"11번 문장","s":[[11,"Together, they tie warm clothes on lamp poles.","함께, 그들은 가로등 기둥에 따뜻한 옷들을 묶어 놓는다."]],"w":"1번에 coats tied to the poles(기둥에 묶인 코트들)가 나옴. 가로등 기둥에 옷을 매달아 두는 행동이라 tie는 '묶다'.","c":1},"h":"20e402ad7b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (First, she asks for donations of coats, scarves, and mittens.)","ko":"먼저, 그녀는 코트, 목도리, 그리고 벙어리장갑을 기부해달라고 요청한다.","opts":["수리","광고","기부","주문"],"word":"donations","r":{"a":"3) 기부","ev":"9번, 12번 문장","s":[[9,"First, she asks for donations of coats, scarves, and mittens.","먼저, 그녀는 코트, 목도리, 그리고 벙어리장갑을 기부해 달라고 요청한다."],[12,"These clothes are for anyone who needs help.","이 옷들은 도움이 필요한 누구나를 위한 것이다."]],"w":"9번에서 코트·목도리·벙어리장갑을 요청해서 모은 뒤 12번처럼 도움이 필요한 누구나를 위해 쓴다. 대가 없이 내놓는 것이라 donation은 '기부'.","c":3},"h":"f825b25a9b"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAt first, they thought someone forgot their coats.","ko":"밑줄 친 they가 가리키는 것은?","sko":"처음에 그들은 누군가 코트를 깜박 잊어버렸다고 생각했다.","opts":["Halifax의 사람들","코트들","쪽지들","Tara"],"pron":"they","r":{"a":"1) Halifax의 사람들","ev":"1~2번 문장","s":[[1,"In Halifax, Canada, people saw something interesting: coats tied to the poles of street lamps.","캐나다 Halifax에서 사람들은 흥미로운 것을 보았다: 가로등 기둥에 묶인 코트들이었다."],[2,"At first, they thought someone forgot their coats.","처음에 그들은 누군가 코트를 깜박 잊어버렸다고 생각했다."]],"w":"2번은 they가 처음에 코트를 보고 누군가 잊고 두고 갔다고 생각했다는 내용. 1번에서 가로등 기둥에 묶인 코트를 본 Halifax의 사람들이다.","c":1,"k":"they = Halifax의 사람들"},"h":"2b33ba3309"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These clothes are for anyone who needs help.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 옷들은 도움이 필요한 누구나를 위한 것이다.","opts":["이 옷들은 Tara의 가족만을 위한 것이다.","이 옷들은 아이들이 다시 가져가야 하는 것이다.","이 옷들은 남을 도울 수 있는 사람들이 입는 것이다.","이 옷들은 도움이 필요한 사람이면 누구에게나 주어진다."],"r":{"a":"4) 이 옷들은 도움이 필요한 사람이면 누구에게나 주어진다.","ev":"11~12번 문장","s":[[11,"Together, they tie warm clothes on lamp poles.","함께, 그들은 가로등 기둥에 따뜻한 옷들을 묶어 놓는다."],[12,"These clothes are for anyone who needs help.","이 옷들은 도움이 필요한 누구나를 위한 것이다."]],"w":"anyone who needs help는 '도움이 필요한 누구든지'. 11번에서 묶어 놓은 옷을 필요한 사람이 가져가는 것이라 4번. 가족만(1번), 아이들이 도로 가져감(2번), 도울 수 있는 사람(3번)은 본문과 다름.","c":4},"h":"f45fa19f8a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["Tara asks only adults to help her.","The coats on the poles were thrown away by Tara.","The experience teaches kids a lesson.","The little notes said the coats were for sale."],"oko":["Tara는 어른들에게만 도와달라고 부탁한다.","기둥의 코트들은 Tara가 버린 것이다.","이 경험은 아이들에게 교훈을 가르쳐 준다.","작은 쪽지들에는 코트가 판매용이라고 적혀 있었다."],"r":{"a":"3) The experience teaches kids a lesson. (이 경험은 아이들에게 교훈을 가르쳐 준다.)","ev":"4번, 10번, 12~13번 문장","s":[[4,"The notes said, “I’m not lost! If you feel cold, please take me to stay warm!”","쪽지에는 “저는 분실된 게 아니에요! 만약 당신이 춥다면, 저를 가져가 따뜻하게 지내세요!”라고 적혀 있었다."],[10,"Then, she asks local children to come and help her.","그 후, 그녀는 지역의 아이들에게 와서 자신을 도와 달라고 부탁한다."],[12,"These clothes are for anyone who needs help.","이 옷들은 도움이 필요한 누구나를 위한 것이다."],[13,"This experience teaches kids a lesson.","이 경험은 아이들에게 교훈을 가르쳐 준다."]],"w":"13번에서 이 경험이 아이들에게 교훈을 가르쳐 준다고 함. ①은 10번에서 지역 아이들에게 부탁한다고 했고, ②는 코트가 필요한 사람을 위한 것이라는 12번과 맞지 않고, ④는 쪽지에 take me(저를 가져가세요)라고 적혀 있다는 4번과 다르다.","c":3},"h":"29e027be2c"},{"n":9,"t":"sum","q":"Tara is a (A) lady who (B) helping people.","ko":"Tara는 사람들을 돕는 것을 (B) (A) 여성이다.","opts":["(A) nice / (B) loves","(A) nice / (B) hates","(A) rude / (B) loves","(A) rude / (B) hates","(A) nice / (B) forgets"],"oko":["(A) 친절한 / (B) 아주 좋아하는","(A) 친절한 / (B) 몹시 싫어하는","(A) 무례한 / (B) 아주 좋아하는","(A) 무례한 / (B) 몹시 싫어하는","(A) 친절한 / (B) 잊어버리는"],"r":{"a":"1) (A) nice / (B) loves ((A) 친절한 / (B) 아주 좋아하는)","ev":"5~7번 문장","s":[[5,"There’s a nice lady behind these notes.","이 쪽지 뒤에는 어느 친절한 여성이 있다."],[6,"Her name is Tara Smith-Atkins.","그녀의 이름은 Tara Smith-Atkins이다."],[7,"She loves helping people.","그녀는 사람들을 돕는 것을 아주 좋아한다."]],"w":"5번 There’s a nice lady(친절한 여성), 7번 She loves helping people(그녀는 사람들을 돕는 것을 아주 좋아한다)에서 가져옴.","c":1},"h":"3e32bc57c8"},{"n":10,"t":"fill","q":"Helping [A] in need is [B] for the community!","ko":"어려움에 처한 [A]을 돕는 것은 지역 사회에 [B]!","bko":{"others":"다른 사람들","important":"중요한","local":"지역의","lesson":"교훈","donation":"기부","scarves":"목도리들"},"bank":["others","important","local","lesson","donation","scarves"],"r":{"a":"[A] others, [B] important","ev":"14번 문장","s":[[14,"Helping others in need is important for the community!","어려움에 처한 다른 사람들을 돕는 것은 지역 사회에 중요하다!"]],"w":"14번 문장 Helping others in need is important for the community!(어려움에 처한 다른 사람들을 돕는 것은 지역 사회에 중요하다). lesson(교훈)은 13번에 나오는 말이지만 이 빈칸 자리에는 '다른 사람들'과 '중요한'이 들어가야 뜻이 통함.","c":null},"h":"f0abe7d9b5"}]},{"u":5,"id":"rg1-05-2","no":2,"ko":"옛날 사진 속 사람들은 왜 웃지 않았을까?","items":[{"n":1,"t":"tf","q":"It took about 20 minutes to take one picture in the 19th century.","ko":"19세기에는 사진 한 장을 찍는 데 약 20분이 걸렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It took about 20 minutes to take one picture!","한 장의 사진을 찍는 데 약 20분이 걸렸다!"]],"w":"4번 문장 It took about 20 minutes to take one picture!와 같은 내용. took은 take(걸리다)의 과거형이라 T.","c":"T"},"h":"ea53b38059"},{"n":2,"t":"tf","q":"In old paintings, big smiles were very common.","ko":"옛날 그림에서 활짝 웃는 모습은 매우 흔했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"In these paintings, big smiles weren’t common.","이런 그림들에서, 활짝 웃는 것은 흔하지 않았다."]],"w":"8번에서 In these paintings, big smiles weren’t common(그림에서 큰 미소는 흔하지 않았다)이라고 함. 매우 흔했다는 말은 반대라서 F.","c":"F"},"h":"1ae4d50d54"},{"n":3,"t":"tf","q":"The tradition slowly began to change, and smiles became more common.","ko":"그 전통은 서서히 바뀌기 시작했고, 미소가 더 흔해졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"However, the tradition slowly began to change, and smiles became more common.","그러나 그 전통은 서서히 바뀌기 시작했고, 미소가 더 흔해지게 되었다."]],"w":"13번 문장 the tradition slowly began to change, and smiles became more common과 같은 내용이라 T. begin(시작하다), become(되다)의 과거형이 쓰였음.","c":"T"},"h":"e76df0dae0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Many people believed that showing big smiles wasn’t appropriate.)","ko":"많은 사람들이 함박웃음을 보여주는 것은 적절하지 않다고 믿었다.","opts":["적절한","흔한","어리석은","행복한"],"word":"appropriate","r":{"a":"1) 적절한","ev":"9번 문장","s":[[9,"Many people believed that showing big smiles wasn’t appropriate.","많은 사람들이 함박웃음을 보여주는 것은 적절하지 않다고 믿었다."]],"w":"9번에서 큰 미소를 보이는 것을 wasn’t appropriate라고 믿어서 그림에서도 흔하지 않았음(8번). '큰 미소를 보이는 게 알맞지 않다'는 뜻이라 appropriate는 '적절한'.","c":1},"h":"3f43d3f4ff"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, they kept a serious face.)","ko":"그래서, 그들은 심각한 표정을 유지했다.","opts":["웃는","화난","재미있는","심각한"],"word":"serious","r":{"a":"4) 심각한","ev":"11~12번 문장","s":[[11,"They thought that only silly or lower-class people smiled in photos.","그들은 오직 어리석거나 하위 계층의 사람들만이 사진에서 미소 짓는다고 생각했다."],[12,"So, they kept a serious face.","그래서, 그들은 심각한 표정을 유지했다."]],"w":"11번에서 웃는 사람은 어리석거나 하위 계층이라 생각해서(So) 웃지 않는 표정을 유지함. 웃는 표정의 반대인 진지한 얼굴이라 serious는 '심각한, 진지한'.","c":4},"h":"787ccb35d6"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey thought that only silly or lower-class people smiled in photos.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 오직 어리석거나 하위 계층의 사람들만이 사진에서 미소 짓는다고 생각했다.","opts":["그 시대의 사람들","카메라","화가들","결혼식 하객들"],"pron":"They","r":{"a":"1) 그 시대의 사람들","ev":"10~11번 문장","s":[[10,"When cameras were invented, people continued this tradition.","카메라가 발명되었을 때, 사람들은 이 전통을 계속 이어갔다."],[11,"They thought that only silly or lower-class people smiled in photos.","그들은 오직 어리석거나 하위 계층의 사람들만이 사진에서 미소 짓는다고 생각했다."]],"w":"11번은 They가 오직 어리석거나 하위 계층의 사람들만 사진에서 웃는다고 생각했다는 내용. 10번에서 카메라가 발명되었을 때의 people, 즉 그 시대의 사람들을 가리킨다.","c":1,"k":"They = 그 시대의 사람들"},"h":"fce52c5342"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, people had to sit very still for a long time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서, 사람들은 오랫동안 아주 가만히 앉아 있어야 했다.","opts":["그래서 사람들은 오랫동안 서 있어도 괜찮았다.","그래서 사람들은 시간을 아끼려고 빨리 앉았다.","그래서 사람들은 오랫동안 아주 가만히 앉아 있어야 했다.","그래서 사람들은 사진을 찍기 전에 오래 쉬어야 했다."],"r":{"a":"3) 그래서 사람들은 오랫동안 아주 가만히 앉아 있어야 했다.","ev":"4~5번 문장","s":[[4,"It took about 20 minutes to take one picture!","한 장의 사진을 찍는 데 약 20분이 걸렸다!"],[5,"So, people had to sit very still for a long time.","그래서, 사람들은 오랫동안 아주 가만히 앉아 있어야 했다."]],"w":"4번에서 사진 한 장에 20분이 걸린다고 했으므로, 그래서(So) had to(have to ~해야 한다의 과거) sit very still(아주 가만히 앉아 있다). 서 있어도 된다(1번), 빨리 앉았다(2번), 찍기 전에 쉬었다(4번)는 본문과 다름.","c":3},"h":"f010675d69"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["In the 19th century, most people smiled big in photos.","In the 19th century, most people didn’t smile in photos.","Only children were allowed to smile in photos.","Photos from the past were all in color."],"oko":["19세기에는 대부분의 사람들이 사진에서 활짝 웃었다.","19세기에는 대부분의 사람들이 사진에서 미소를 짓지 않았다.","아이들만 사진에서 웃는 것이 허락되었다.","옛날 사진들은 모두 컬러였다."],"r":{"a":"2) In the 19th century, most people didn’t smile in photos. (19세기에는 대부분의 사람들이 사진에서 미소를 짓지 않았다.)","ev":"1번, 11번 문장","s":[[1,"In the 19th century, most people didn’t smile in photos.","19세기에는 대부분의 사람들이 사진에서 미소를 짓지 않았다."],[11,"They thought that only silly or lower-class people smiled in photos.","그들은 오직 어리석거나 하위 계층의 사람들만이 사진에서 미소 짓는다고 생각했다."]],"w":"1번에서 19세기에는 대부분의 사람들이 사진에서 미소를 짓지 않았다고 함. ①은 1번과 반대이고, ③과 ④는 본문에 없는 내용이다.","c":2},"h":"bde981c9ab"},{"n":9,"t":"sum","q":"Before cameras, people painted pictures to (A) special (B).","ko":"카메라가 생기기 전에, 사람들은 특별한 (B)을(를) (A) 위해 그림을 그렸다.","opts":["(A) remember / (B) moments","(A) remember / (B) animals","(A) sell / (B) moments","(A) sell / (B) animals","(A) forget / (B) moments"],"oko":["(A) 기억하다 / (B) 순간들","(A) 기억하다 / (B) 동물들","(A) 팔다 / (B) 순간들","(A) 팔다 / (B) 동물들","(A) 잊다 / (B) 순간들"],"r":{"a":"1) (A) remember / (B) moments ((A) 기억하다 / (B) 순간들)","ev":"7번 문장","s":[[7,"Before cameras, people painted pictures to remember special moments.","카메라가 생기기 전에, 사람들은 특별한 순간들을 기억하기 위해 그림을 그렸다."]],"w":"7번 Before cameras, people painted pictures to remember special moments(카메라가 생기기 전에 특별한 순간들을 기억하기 위해 그림을 그렸다)에서 가져옴.","c":1},"h":"77b474aa0c"},{"n":10,"t":"fill","q":"They didn’t smile even at [A] events like [B].","ko":"그들은 [B] 같은 [A] 행사에서조차 웃지 않았다.","bank":["happy","weddings","cameras","tradition","minutes","centuries"],"bko":{"happy":"행복한","weddings":"결혼식들","cameras":"카메라들","tradition":"전통","minutes":"분들","centuries":"세기들"},"r":{"a":"[A] happy (행복한), [B] weddings (결혼식들)","ev":"2번 문장","s":[[2,"They didn’t smile even at happy events like weddings.","그들은 결혼식과 같은 행복한 행사에서조차 웃지 않았다."]],"w":"2번 They didn’t smile even at happy events like weddings(결혼식 같은 행복한 행사에서조차 웃지 않았다)에서 가져옴. 나머지는 events를 꾸미거나 like 뒤에 올 수 없다.","c":null},"h":"38a366a21f"}]},{"u":5,"id":"rg1-05-3","no":3,"ko":"오래된 책에서 왜 달콤한 냄새가 날까?","items":[{"n":1,"t":"tf","q":"Lignin is a chemical found in paper.","ko":"리그닌은 종이에서 발견되는 화학물질이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Lignin is a chemical found in paper.","리그닌은 종이에서 발견되는 화학물질이다."]],"w":"5번 문장이 Lignin is a chemical found in paper. found는 find(발견하다)의 과거분사로 '발견되는'이라는 뜻이라 같은 내용이라 T.","c":"T"},"h":"9972682125"},{"n":2,"t":"tf","q":"Lignin turns the pages of books white over time.","ko":"리그닌은 시간이 지나면서 책의 페이지를 하얗게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"It also turns the pages yellow.","그것은 책의 페이지들을 노랗게 만든다."]],"w":"10번에서 It also turns the pages yellow(페이지를 노랗게 만든다)라고 함. 하얗게가 아니라 노랗게라서 F.","c":"F"},"h":"f2c9ea3a85"},{"n":3,"t":"tf","q":"Many people said that old books smelled like chocolate or coffee.","ko":"많은 사람들은 오래된 책이 초콜릿이나 커피 같은 냄새가 난다고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"In a study, many people said old books smelled like chocolate or coffee.","한 연구에서, 많은 사람들이 오래된 책이 초콜릿이나 커피 같은 냄새가 난다고 말했다."]],"w":"7번 문장 In a study, many people said old books smelled like chocolate or coffee와 같은 내용이라 T. smelled like는 smell like(~ 같은 냄새가 나다)의 과거형.","c":"T"},"h":"59e51c1954"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When a book gets older, lignin breaks down and makes a unique smell.)","ko":"책이 점점 더 오래되면, 리그닌이 분해되어 독특한 냄새가 난다.","opts":["흔한","독특한","나쁜","강한"],"word":"unique","r":{"a":"2) 독특한","ev":"6~7번 문장","s":[[6,"When a book gets older, lignin breaks down and makes a unique smell.","책이 점점 더 오래되면, 리그닌이 분해되어 독특한 냄새가 난다."],[7,"In a study, many people said old books smelled like chocolate or coffee.","한 연구에서, 많은 사람들이 오래된 책이 초콜릿이나 커피 같은 냄새가 난다고 말했다."]],"w":"6번의 unique smell은 오래된 책만의 특별한 냄새. 7번에서 초콜릿이나 커피 같다고 한 것처럼 다른 곳에서 쉽게 맡을 수 없는 냄새라 '독특한'. '흔한'은 반대 뜻.","c":2},"h":"8ef07990e8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This isn’t surprising because lignin is also in chocolate and coffee!)","ko":"이것은 리그닌이 초콜릿과 커피에도 들어 있기 때문에 놀라운 일이 아니다!","opts":["지루한","어려운","무서운","놀라운"],"word":"surprising","r":{"a":"4) 놀라운","ev":"8번 문장","s":[[8,"This isn’t surprising because lignin is also in chocolate and coffee!","리그닌은 초콜릿과 커피에도 들어 있기 때문에 이는 놀라운 일이 아니다!"]],"w":"8번은 isn’t surprising(놀랍지 않다)이므로 surprising 자체의 뜻은 '놀라운'. 리그닌이 초콜릿과 커피에도 있으니 냄새가 같은 것이 놀랍지 않다는 흐름임.","c":4},"h":"d097035e0b"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat means books might not have that sweet smell in the future.","ko":"밑줄 친 \"That\"이 가리키는 것은?","sko":"그것은 앞으로 책에서 그 달콤한 냄새가 나지 않을 수도 있다는 것을 의미한다.","opts":["오늘날의 책들이 리그닌이 더 적게 들어 있는 종이를 사용하는 것","리그닌이 초콜릿에도 들어 있는 것","책의 페이지가 노랗게 변하는 것","오래된 책에서 특별한 냄새가 나는 것"],"r":{"a":"1) 오늘날의 책들이 리그닌이 더 적게 들어 있는 종이를 사용하는 것","ev":"11~12번 문장","s":[[11,"So, books today use paper with less lignin.","그래서, 오늘날의 책들은 리그닌이 더 적게 들어있는 종이를 사용한다."],[12,"That means books might not have that sweet smell in the future.","그것은 앞으로 책에서 그 달콤한 냄새가 나지 않을 수도 있다는 것을 의미한다."]],"w":"12번 That means ~의 That은 바로 앞 11번 내용. 리그닌이 더 적은 종이를 쓰면 책에서 달콤한 냄새(리그닌이 분해되며 나는 냄새)가 줄어든다는 뜻으로 이어짐.","c":1,"k":"That = 오늘날의 책들이 리그닌이 더 적게 들어 있는 종이를 사용하는 것"},"pron":"That","h":"e062455a94"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But lignin doesn’t only make books smell good.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 리그닌은 책들이 좋은 냄새가 나게 하지만은 않는다.","opts":["리그닌은 책이 좋은 냄새가 나는 것을 막아 준다.","리그닌은 책에서 아무 냄새도 나지 않게 만든다.","리그닌은 책에서 좋은 냄새가 나게 하는 것 외에 다른 작용도 한다.","리그닌 때문에 책에서는 항상 나쁜 냄새가 난다."],"r":{"a":"3) 리그닌은 책에서 좋은 냄새가 나게 하는 것 외에 다른 작용도 한다.","ev":"9~10번 문장","s":[[9,"But lignin doesn’t only make books smell good.","하지만 리그닌은 책들이 좋은 냄새가 나게 하지만은 않는다."],[10,"It also turns the pages yellow.","그것은 책의 페이지들을 노랗게 만든다."]],"w":"not only ~는 '~만은 아니다'. 9번 뒤 10번에서 페이지를 노랗게 만드는 다른 작용을 설명함. 막는다(1번), 냄새가 안 난다(2번), 항상 나쁘다(4번)는 본문과 다름.","c":3},"h":"1a113bc2fb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["Old books never smell like anything.","The materials for making books have many different chemicals in them.","Lignin is only found in chocolate and coffee.","Books are made only from wood."],"oko":["오래된 책에서는 아무 냄새도 나지 않는다.","책을 만드는 재료들에는 많은 다양한 화학물질들이 들어 있다.","리그닌은 초콜릿과 커피에서만 발견된다.","책은 나무로만 만들어진다."],"r":{"a":"2) The materials for making books have many different chemicals in them. (책을 만드는 재료들에는 많은 다양한 화학물질들이 들어 있다.)","ev":"1번, 3~4번 문장","s":[[1,"When you walk into a library, you might notice a special smell from old books.","도서관으로 걸어 들어갈 때, 당신은 오래된 책에서 나는 특별한 냄새를 알아챌지도 모른다."],[3,"Paper, ink, and glue are used to make books.","종이, 잉크, 그리고 접착제는 책을 만드는 데 사용된다."],[4,"These materials have many different chemicals in them, and one of the chemicals is lignin.","이 재료들에는 많은 다양한 화학물질들이 있고, 그 화학물질 중 하나가 리그닌이다."]],"w":"4번에서 책을 만드는 재료들에 많은 다양한 화학물질이 있다고 함. ①은 1번에서 오래된 책에서 특별한 냄새가 난다고 했고, ③은 5번에서 종이에서도 발견된다고 했고, ④는 3번에서 종이, 잉크, 접착제가 쓰인다고 했다.","c":2},"h":"a9d413cd14"},{"n":9,"t":"sum","q":"In a (A), you might (B) a special smell from old books.","ko":"(A)에 걸어 들어가면, 오래된 책에서 나는 특별한 냄새를 (B) 수도 있다.","opts":["(A) library / (B) notice","(A) library / (B) ignore","(A) kitchen / (B) notice","(A) kitchen / (B) ignore","(A) library / (B) lose"],"oko":["(A) 도서관 / (B) 알아채다","(A) 도서관 / (B) 무시하다","(A) 부엌 / (B) 알아채다","(A) 부엌 / (B) 무시하다","(A) 도서관 / (B) 잃다"],"r":{"a":"1) (A) library / (B) notice ((A) 도서관 / (B) 알아채다)","ev":"1번 문장","s":[[1,"When you walk into a library, you might notice a special smell from old books.","도서관으로 걸어 들어갈 때, 당신은 오래된 책에서 나는 특별한 냄새를 알아챌지도 모른다."]],"w":"1번 When you walk into a library, you might notice a special smell from old books(도서관에 들어가면 오래된 책에서 나는 특별한 냄새를 알아챌지도 모른다)에서 가져옴.","c":1},"h":"07c344eb6d"},{"n":10,"t":"fill","q":"Paper, ink, and [A] are [B] to make books.","ko":"종이, 잉크, 그리고 [A]은(는) 책을 만드는 데 [B].","bank":["glue","used","smell","study","yellow","future"],"bko":{"glue":"접착제","used":"사용된다 (use의 과거분사)","smell":"냄새","study":"연구","yellow":"노란","future":"미래"},"r":{"a":"[A] glue (접착제), [B] used (사용된다 (use의 과거분사))","ev":"3번 문장","s":[[3,"Paper, ink, and glue are used to make books.","종이, 잉크, 그리고 접착제는 책을 만드는 데 사용된다."]],"w":"3번 Paper, ink, and glue are used to make books(종이, 잉크, 접착제는 책을 만드는 데 사용된다)에서 가져옴. 나머지는 책의 재료가 아니다.","c":null},"h":"71d105d3eb"}]},{"u":6,"id":"rg1-06-1","no":1,"ko":"섬에서 캠핑하다 게에게 음식을 뺏긴다고?","items":[{"n":1,"t":"tf","q":"Robber crabs have a strong sense of smell.","ko":"강도 게는 뛰어난 후각을 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"These crabs have a strong sense of smell.","이 게들은 뛰어난 후각을 가지고 있다."]],"w":"4번 문장 These crabs have a strong sense of smell과 같은 내용이라 T. have(가지다)가 그대로 쓰였음.","c":"T"},"h":"fad99f7683"},{"n":2,"t":"tf","q":"Robber crabs hurt campers when they gather around food.","ko":"강도 게는 음식 주위에 모일 때 캠핑객을 다치게 한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"They don’t hurt people.","그것들은 사람을 해치지 않는다."]],"w":"8번에서 They don’t hurt people(그것들은 사람을 해치지 않는다)이라고 함. 캠핑객을 다치게 한다는 말은 반대라서 F.","c":"F"},"h":"f6415349f9"},{"n":3,"t":"tf","q":"Smart campers usually hang their food in trees.","ko":"현명한 캠핑객들은 보통 음식을 나무에 걸어둔다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Smart campers usually hang their food in trees.","현명한 캠핑객들은 보통 그들의 음식을 나무에 걸어둔다."]],"w":"9번 문장 Smart campers usually hang their food in trees와 같은 내용. hang(걸다)이 그대로 쓰여 T.","c":"T"},"h":"8868c3c9e0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When people start cooking, the crabs smell the food and quickly gather around.)","ko":"사람들이 요리하기 시작할 때, 그 게들은 음식 냄새를 맡고 빠르게 주위에 모인다.","opts":["모이다","도망가다","잠자다","싸우다"],"word":"gather","r":{"a":"1) 모이다","ev":"6번 문장","s":[[6,"When people start cooking, the crabs smell the food and quickly gather around.","사람들이 요리하기 시작할 때, 그 게들은 음식 냄새를 맡고 빠르게 주위에 모인다."]],"w":"6번에서 요리 냄새를 맡은 게들이 gather around(주위에 모인다)하는 장면. 5번에서 음식을 가져가려고 다가온다고 했으므로 gather는 '모이다'.","c":1},"h":"d0cb0cd212"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The people on the island look after these crabs and treat them with respect.)","ko":"그 섬의 사람들은 이 게들을 돌보고 존중으로 그것들을 대한다.","opts":["그리다","대하다","잡다","던지다"],"word":"treat","r":{"a":"2) 대하다","ev":"14번 문장","s":[[14,"The people on the island look after these crabs and treat them with respect.","그 섬의 사람들은 이 게들을 돌보고 존중으로 그것들을 대한다."]],"w":"14번에서 look after(돌보다)와 함께 with respect(존중으로) treat한다고 함. 게를 존중하며 다룬다는 뜻이라 treat는 '대하다'.","c":2},"h":"7f105fd8c6"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey sometimes take food from campers!","ko":"밑줄 친 \"They\"가 가리키는 것은?","sko":"그것들은 때때로 캠핑객들로부터 음식을 가져간다!","opts":["캠핑객들","강도 게들","섬 사람들","호주 사람들"],"r":{"a":"2) 강도 게들","ev":"4~5번 문장","s":[[4,"These crabs have a strong sense of smell.","이 게들은 뛰어난 후각을 가지고 있다."],[5,"They sometimes take food from campers!","그것들은 때때로 캠핑객들로부터 음식을 가져간다!"]],"w":"5번의 They가 음식을 가져가는 주체는 바로 앞 4번의 These crabs(이 게들). 음식을 빼앗기는 쪽이 캠핑객들이라서 They는 캠핑객이 될 수 없음.","c":2,"k":"They = 강도 게들"},"pron":"They","h":"72574b034a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They also set up their tents far away from their cooking spots.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 또한 그들의 텐트를 그들의 조리 장소에서 멀리 떨어진 곳에 설치한다.","opts":["그들은 텐트를 조리 장소 바로 옆에 설치한다.","그들은 조리 장소를 텐트 안으로 옮긴다.","그들은 텐트를 조리하는 장소에서 멀리 떨어진 곳에 설치한다.","그들은 텐트를 게가 많은 곳에 설치한다."],"r":{"a":"3) 그들은 텐트를 조리하는 장소에서 멀리 떨어진 곳에 설치한다.","ev":"9~10번 문장","s":[[9,"Smart campers usually hang their food in trees.","현명한 캠핑객들은 보통 그들의 음식을 나무에 걸어둔다."],[10,"They also set up their tents far away from their cooking spots.","그들은 또한 그들의 텐트를 그들의 조리 장소에서 멀리 떨어진 곳에 설치한다."]],"w":"set up은 '설치하다', far away from은 '~에서 멀리 떨어져'. 9번에서 음식을 나무에 걸어두는 것에 이어(also) 텐트를 조리 장소에서 멀리 둔다는 뜻. 바로 옆(1번)은 반대.","c":3},"h":"dcbbe89980"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["People in Australia often eat robber crabs.","Robber crabs are not for eating in Australia.","Robber crabs live only on very cold islands.","Robber crabs are very small and quiet."],"oko":["호주 사람들은 강도 게를 자주 먹는다.","호주에서 강도 게는 식용이 아니다.","강도 게는 아주 추운 섬에서만 산다.","강도 게는 아주 작고 조용하다."],"r":{"a":"2) Robber crabs are not for ea e meaning of the underlined word? (For example, he uses the brackets to draw a curvy line.)","ko":"예를 들어, 그는 곡선을 그리기 위해 괄호를 사용한다.","opts":["곧은","굵은","구불구불한","짧은"],"word":"curvy","r":{"a":"3) 구불구불한","ev":"7번 문장","s":[[7,"For example, he uses the brackets to draw a curvy line.","예를 들어, 그는 곡선을 그리기 위해 괄호를 사용한다."]],"w":"7번에서 괄호 ( ) 기호로 선을 그리는 장면. 괄호는 둥글게 휘어진 모양이라 curvy line은 '구불구불한 선'. 곧은 선은 반대 뜻.","c":3},"h":"ba8de6a9b1"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe types different letters, numbers, and special marks like punctuation to shape an image.","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 이미지를 만들기 위해 다양한 글자, 숫자, 그리고 구두점과 같은 특수 기호를 타이핑한다.","opts":["James Cook","유명한 사람들","AI","타자기"],"pron":"He","r":{"a":"1) James Cook","ev":"3번, 6번 문장","s":[[3,"He uses an old machine called a typewriter.","그는 타자기라고 불리는 오래된 기계를 사용한다."],[6,"He types different letters, numbers, and special marks like punctuation to shape an image.","그는 이미지를 만들기 위해 다양한 글자, 숫자, 그리고 구두점과 같은 특수 기호를 타이핑한다."]],"w":"6번에서 He는 글자, 숫자, 특수 기호를 타이핑해 이미지를 만드는 사람이다. 3번에서 타자기를 사용한다고 소개된 James Cook이다.","c":1,"k":"He = James Cook"},"h":"8bd9e8e1eb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He believes “some technologies never die.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 “어떤 기술들은 절대 사라지지 않는다”고 믿는다.","opts":["그는 오래된 기술 중 일부는 결코 사라지지 않는다고 믿는다.","그는 모든 기술이 언젠가는 사라진다고 믿는다.","그는 새로운 기술이 오래된 기술을 곧 대신한다고 믿는다.","그는 기술이 사람을 해칠 수 있다고 믿는다."],"r":{"a":"1) 그는 오래된 기술 중 일부는 결코 사라지지 않는다고 믿는다.","ev":"10~11번 문장","s":[[10,"James enjoys using typewriters to create his art.","James는 자신의 예술 작품을 만들기 위해 타자기를 사용하는 것을 즐긴다."],[11,"He believes “some technologies never die.”","그는 “어떤 기술들은 절대 사라지지 않는다”고 믿는다."]],"w":"never die는 '절대 사라지지 않는다'. 10번에서 타자기를 계속 쓰는 James가 타자기 같은 기술은 사라지지 않는다고 믿는다는 뜻. 모든 기술이 사라진다(2번)는 반대이고, 3번·4번 내용은 본문에 없음.","c":1},"h":"28c0a4bee3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["James Cook enjoys using typewriters to create his art. t.","그의 목표는 타자기와 같은 오래된 기계가 놀라운 예술을 만들 수 있다는 것을 우리에게 보여주는 것이다."]],"w":"12번 His goal is to show us that old machines like typewriters can make amazing art(그의 목표는 오래된 기계도 놀라운 예술을 만들 수 있다는 것을 보여 주는 것이다)에서 가져옴.","c":null},"h":"0ba58ae976"}]},{"u":6,"id":"rg1-06-3","no":3,"ko":"우주에서는 어떤 냄새가 날까?","items":[{"n":1,"t":"tf","q":"A comet is a big icy ball of dust and rocks.","ko":"혜성은 먼지와 바위로 이루어진 커다란 얼음덩어리이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"A comet is a big icy ball of dust and rocks.","혜성은 먼지와 바위로 이루어진 커다란 얼음덩어리이다."]],"w":"6번 문장 A comet is a big icy ball of dust and rocks와 같은 내용이라 T.","c":"T"},"h":"426357b5f6"},{"n":2,"t":"tf","q":"The cloud around comet 67P smells like raspberries.","ko":"혜성 67P 주변의 구름은 라즈베리 같은 냄새가 난다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Scientists discovered that the cloud around this comet has some unique smells like rotten eggs and almonds!","과학자들은 이 혜성 주변의 구름이 썩은 달걀과 아몬드와 같은 몇몇 독특한 냄새를 가지고 있다는 것을 발견했다!"]],"w":"7번에서 67P 주변 구름은 rotten eggs and almonds(썩은 달걀과 아몬드) 같은 냄새라고 함. 라즈베리는 10번의 Sagittarius B2의 냄새라서 F.","c":"F"},"h":"af40931def"},{"n":3,"t":"tf","q":"A NASA researcher says that the smell of space is the same everywhere.","ko":"NASA의 한 연구원은 우주의 냄새는 어디서나 같다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"A NASA researcher says, “The smell of space differs from place to place. Space might smell like a buffet restaurant with all kinds of smells.”","NASA의 한 연구원은 “우주의 냄새는 장소마다 달라요. 우주는 온갖 종류의 냄새를 가지고 있는 뷔페 레스토랑과 같은 냄새가 날지도 몰라요.”라고 말한다."]],"w":"12번에서 연구원은 The smell of space differs from place to place(우주의 냄새는 장소마다 다르다)라고 함. differ는 '다르다'라서 어디서나 같다는 말은 반대라 F.","c":"F"},"h":"99bf97c3d9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists discovered that the cloud around this comet has some unique smells like rotten eggs and almonds!)","ko":"과학자들은 이 혜성 주변의 구름이 썩은 달걀과 아몬드와 같은 몇몇 독특한 냄새를 가지고 있다는 것을 발견했다!","opts":["신선한","썩은","삶은","작은"],"word":"rotten","r":{"a":"2) 썩은","ev":"7번 문장","s":[[7,"Scientists discovered that the cloud around this comet has some unique smells like rotten eggs and almonds!","과학자들은 이 혜성 주변의 구름이 썩은 달걀과 아몬드와 같은 몇몇 독특한 냄새를 가지고 있다는 것을 발견했다!"]],"w":"7번에서 우주 냄새의 예로 rotten eggs(썩은 달걀)를 듦. 썩은 달걀은 좋지 않은 독특한 냄새가 나는 것이라 rotten은 '썩은'. '신선한'은 반대 뜻.","c":2},"h":"bf143a3cd8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The smell of space differs from place to place.)","ko":"우주의 냄새는 장소마다 달라요.","opts":["같다","사라진다","다르다","생긴다"],"word":"differs","r":{"a":"3) 다르다","ev":"12번 문장","s":[[12,"A NASA researcher says, “The smell of space differs from place to place. Space might smell like a buffet restaurant with all kinds of smells.”","NASA의 한 연구원은 “우주의 냄새는 장소마다 달라요. 우주는 온갖 종류의 냄새를 가지고 있는 뷔페 레스토랑과 같은 냄새가 날지도 몰라요.”라고 말한다."]],"w":"12번 differs from place to place는 장소마다 다르다는 뜻. 7번(썩은 달걀·아몬드)과 10번(라즈베리)처럼 냄새가 서로 다른 점과 이어짐. differ는 '다르다'.","c":3},"h":"34d19ffacd"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nYou might think it doesn’t have any smell.","ko":"밑줄 친 it이 가리키는 것은?","sko":"당신은 그것이 어떤 냄새도 나지 않는다고 생각할지도 모른다.","opts":["우주","우주 비행사","NASA의 연구원","과학자들"],"pron":"it","r":{"a":"1) 우주","ev":"1~2번 문장","s":[[1,"Space is full of stars, planets, and many other things.","우주는 별, 행성, 그리고 다른 많은 것들로 가득 차 있다."],[2,"You might think it doesn’t have any smell.","당신은 그것이 어떤 냄새도 나지 않는다고 생각할지도 모른다."]],"w":"2번은 당신이 it에 냄새가 전혀 없다고 생각할지도 모른다는 내용. 1번에서 소개한 우주(Space)를 가리킨다.","c":1,"k":"it = 우주"},"h":"970dc3d414"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As the comet gets closer to the sun, these smells can change.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 혜성이 태양에 점점 더 가까워지면서, 이 냄새들은 바뀔 수 있다.","opts":["혜성이 태양에서 멀어지면 냄새가 사라진다.","혜성이 태양에 점점 가까워지면 이 냄새들이 달라질 수 있다.","혜성이 태양과 만나면 새로운 혜성이 생긴다.","태양이 가까워지면 혜성의 크기가 변한다."],"r":{"a":"2) 혜성이 태양에 점점 가까워지면 이 냄새들이 달라질 수 있다.","ev":"7~8번 문장","s":[[7,"Scientists discovered that the cloud around this comet has some unique smells like rotten eggs and almonds!","과학자들은 이 혜성 주변의 구름이 썩은 달걀과 아몬드와 같은 몇몇 독특한 냄새를 가지고 있다는 것을 발견했다!"],[8,"As the comet gets closer to the sun, these smells can change.","그 혜성이 태양에 점점 더 가까워지면서, 이 냄새들은 바뀔 수 있다."]],"w":"get closer to는 '~에 더 가까워지다', can change는 '바뀔 수 있다'. 7번의 썩은 달걀·아몬드 냄새들이 태양에 가까워지면 달라질 수 있다는 뜻. 멀어지면 사라진다(1번), 새 혜성(3번), 크기(4번)는 본문에 없음.","c":2},"h":"0a735eeab9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["Sagittarius B2 is a big space cloud.","Sagittarius B2 is a small moon near the sun.","Sagittarius B2 is the name of an astronaut.","Sagittarius B2 is a comet made of ice."],"oko":["Sagittarius B2는 큰 성운이다.","Sagittarius B2는 태양 근처의 작은 위성이다.","Sagittarius B2는 한 우주 비행사의 이름이다.","Sagittarius B2는 얼음으로 이루어진 혜성이다."],"r":{"a":"1) Sagittarius B2 is a big space cloud. (Sagittarius B2는 큰 성운이다.)","ev":"6번, 9번 문장","s":[[6,"A comet is a big icy ball of dust and rocks.","혜성은 먼지와 바위로 이루어진 커다란 얼음덩어리이다."],[9,"There’s also a big space cloud named Sagittarius B2.","Sagittarius B2라는 이름의 큰 성운도 있다."]],"w":"9번에서 Sagittarius B2라는 이름의 큰 성운이 있다고 함. ②와 ③은 본문에 없는 내용이고, ④는 6번에서 혜성은 얼음덩어리라고 했지만 B2는 성운(cloud)이라고 했다.","c":1},"h":"eef65099a6"},{"n":9,"t":"sum","q":"A big space cloud has a (A) smell that comes from a special (B) in the cloud.","ko":"큰 성운에는 구름 속의 특별한 (B)에서 나오는 (A) 냄새가 난다.","opts":["(A) sweet / (B) chemical","(A) sweet / (B) rock","(A) bad / (B) chemical","(A) bad / (B) rock","(A) sweet / (B) dust"],"oko":["(A) 달콤한 / (B) 화학 물질","(A) 달콤한 / (B) 바위","(A) 나쁜 / (B) 화학 물질","(A) 나쁜 / (B) 바위","(A) 달콤한 / (B) 먼지"],"r":{"a":"1) (A) sweet / (B) chemical ((A) 달콤한 / (B) 화학 물질)","ev":"9번, 11번 문장","s":[[9,"There’s also a big space cloud named Sagittarius B2.","Sagittarius B2라는 이름의 큰 성운도 있다."],[11,"This sweet smell comes from a special chemical in the cloud.","이 달콤한 냄새는 구름에 있는 특별한 화학 물질에서 나온다."]],"w":"11번 This sweet smell comes from a special chemical in the cloud(이 달콤한 냄새는 구름 속의 특별한 화학 물질에서 나온다)에서 가져옴.","c":1},"h":"f8e2d369d7"},{"n":10,"t":"fill","q":"Space is [A] of stars, [B], and many other things."," s have a calming effect.","이 세 가지 소리는 모두 마음을 진정시키는 효과가 있다."]],"w":"4번 문장의 calming effect는 마음을 가라앉히는 효과. 11번 relaxing(마음을 편안하게 하는)도 같은 방향의 말. 시끄럽다는 뜻이 아님.","c":3},"h":"f8d7e6015f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Brown noise is the deepest sound of the three.)","ko":"갈색 소음은 세 가지 중에서 deepest 소리이다.","opts":["가장 큰","가장 깊은","가장 높은","가장 짧은"],"word":"deepest","r":{"a":"2) 가장 깊은","ev":"12번 문장","s":[[12,"Brown noise is the deepest sound of the three.","갈색 소음은 세 가지 중에서 가장 깊은 소리이다."]],"w":"deepest는 deep(깊은)의 최상급이라 ‘가장 깊은’. 9번에서 분홍색이 백색보다 낮은 소리였고, 갈색은 그보다 더 깊은 소리. 높은 소리가 아님.","c":2},"h":"bed354e907"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSo, what’s the difference between them?","ko":"밑줄 친 \"them\"이 가리키는 것은?","sko":"그렇다면 그것들 사이의 차이점은 무엇일까?","opts":["선풍기와 진공청소기","우리가 사용하는 색깔들","빗소리와 파도 소리","백색 소음, 분홍색 소음, 갈색 소음"],"r":{"a":"4) 백색 소음, 분홍색 소음, 갈색 소음","ev":"3~5번 문장","s":[[3,"But did you know about pink noise and brown noise?","그런데 분홍색 소음과 갈색 소음에 대해서도 알고 있었는가?"],[4,"All these three sounds have a calming effect.","이 세 가지 소리는 모두 마음을 진정시키는 효과가 있다."],[5,"So, what’s the difference between them?","그렇다면 그것들 사이의 차이점은 무엇일까?"]],"w":"3번에서 pink noise와 brown noise를 소개하고 4번에서 ‘이 세 가지 소리(these three sounds)’라고 정리함. 5번의 them은 이 세 소음이고, 이 세 소음의 차이를 이어서 설명함.","c":4,"k":"them = 백색 소음, 분홍색 소음, 갈색 소음"},"pron":"them","h":"42530e8244"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It’s like a “shhh” sound and helps cover up other noise, so you can focus.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 ‘쉬이이’ 하는 소리 같고 다른 소음을 가려 주어서, 여러분이 집중할 수 있다.","opts":["‘쉬이이’ 소리 같고 다른 소음을 가려 주어서 집중할 수 있다.","‘쉬이이’ 소리가 다른 소음보다 커서 집중하기 어렵다.","다른 소음이 커져서 ‘쉬이이’ 소리가 들리지 않게 된다.","‘쉬이이’ 소리를 내면 모든 소음이 사라져 잠이 온다."],"r":{"a":"1) ‘쉬이이’ 소리 같고 다른 소음을 가려 주어서 집중할 수 있다.","ev":"8번 문장","s":[[8,"It’s like a “shhh” sound and helps cover up other noise, so you can focus.","그것은 ‘쉬이이’ 하는 소리 같고 다른 소음을 가려 주어서, 여러분이 집중할 수 있다."]],"w":"cover up은 ‘덮어서 가리다’이고 so는 ‘그래서’. 다른 소음이 가려지니 집중할 수 있다는 내용. 집중이 어려워진다거나 잠이 온다는 말은 없음.","c":1},"h":"b06512bab9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","opts":["Pink noise is deeper than brown noise.","White noise sounds like a loud drum.","Pink noise is similar to the sound of rain or waves on a beach.","All three sounds make people excited."],"oko":["분홍색 소음은 갈색 소음보다 더 깊은 소리이다.","백색 소음은 큰 북소리 같다.","분홍색 소음은 빗소리나 해변의 파도 소리와 비슷하다.","세 가지 소음은 모두 사람을 흥분시킨다."],"r":{"a":"3) Pink noise is similar to the sound of rain or waves on a beach. (분홍색 소음은 빗소리나 해변의 파도 소리와 비슷하다.)","ev":"4번, 10번, 12번 문장","s":[[4,"All these three sounds have a calming effect.","이 세 가지 소리는 모두 마음을 진정시키는 효과가 있다."],[10,"It’s similar to the sound of rain or waves on a beach.","그것은 빗소리나 해변의 파도 소리와 비슷하다."],[12,"Brown noise is the deepest sound of the three.","갈색 소음은 세 가지 중에서 가장 깊은 소리이다."]],"w":"10번에서 분홍색 소음은 빗소리나 해변의 파도 소리와 비슷하다고 함. ①은 12번에서 갈색 소음이 가장 깊다고 했고, ②는 본문에 없는 내용이고, ④는 4번에서 모두 마음을 진정시키는 효과가 있다고 함.","c":3},"h":"5f620815eb"},{"n":9,"t":"sum","q":"White noise is the most (A), and pink noise is (B) because it sounds like nature.","ko":"백색 소음은 가장 (A) 있고, 분홍색 소음은 자연처럼 들려서 (B).","opts":["(A) well-known / (B) relaxing","(A) well-known / (B) exciting","(A) rare / (B) relaxing","(A) rare / (B) exciting","(A) well-known / (B) scary"],"oko":["(A) 잘 알려져 / (B) 편안하다","(A) 잘 알려져 / (B) 신난다","(A) 드물게 알려져 / (B) 편안하다","(A) 드물게 알려져 / (B) 신난다","(A) 잘 알려져 / (B) 무섭다"],"r":{"a":"1) (A) well-known / (B) relaxing ((A) 잘 알려져 / (B) 편안하다)","ev":"6번, 11번 문장","s":[[6,"White noise is the most well-known.","백색 소음이 가장 잘 알려져 있다."],[11,"It’s relaxing because it sounds like nature.","그것은 자연처럼 들리기 때문에 마음을 편안하게 해 준다."]],"w":"6번 White noise is the most well-known(백색 소음이 가장 잘 알려져 있다), 11번 It’s relaxing because it sounds like nature(자연처럼 들려서 마음을 편안하게 해 준다)에서 가져옴.","c":1},"h":"1753e00557"},{"n":10,"t":"fill","q":"It’s like the sound of [A] rain or a [B].","ko":"그것은 [A] 비나 [B]의 소리 같다.","bank":["heavy","waterfall","improve","cover","de
