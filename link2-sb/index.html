:root{--ink:#1f2a37;--mut:#6b7280;--line:#e5e7eb;--pri:#2f6f5e;--bg:#f7f8f5}

#app{max-width:520px;margin:0 auto;padding:16px 16px 60px}h1{font-size:22px;margin:2px 0}h2{font-size:19px}
.small{font-size:13px;color:var(--mut)}.sub{color:var(--mut);font-size:14px}.top{padding:8px 0 12px}.ok{color:var(--pri)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0;font:inherit;text-align:left}
.pill{background:#eef0ec;border-radius:20px;padding:2px 10px;font-size:13px;white-space:nowrap}.pill.on{background:#d9efe6;color:var(--pri)}
.btn{display:block;width:100%;border:0;background:var(--pri);color:#fff;border-radius:10px;padding:12px;font:inherit;margin:10px 0}.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.pencil{background:#7a6a00;display:flex;align-items:center;justify-content:center;gap:8px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}.chip{flex:0 0 auto;min-width:38px;height:36px;border-radius:18px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;color:var(--ink)}.chip.dn{background:#d9efe6;color:var(--pri);border-color:#bfe3d4}.chip.cur{background:var(--pri);color:#fff;border-color:var(--pri)}.chip.lk{opacity:.4}
.ak{display:flex;justify-content:flex-end}.btn.mini{display:inline-block;width:auto;margin:0 0 8px;padding:6px 14px;font-size:14px}.btn:disabled{opacity:.35}
.at{width:100%;border-collapse:collapse;margin:8px 0 14px}.at td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}.at .sh{background:#eef0ec;font-weight:700;font-size:13px;color:var(--mut)}.at .nb{width:44px}.at .nb i{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:15px;background:#1f2a37;color:#fff;font-style:normal;font-size:14px}.chip2{display:inline-block;background:#fdecec;color:#c0392b;font-weight:700;border-radius:8px;padding:4px 10px}
.two{display:flex;gap:8px}.two .btn{margin:6px 0}
.bk{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px}.bk a,.foot a{color:var(--pri);text-decoration:underline;cursor:pointer}.foot{text-align:center;margin-top:24px;font-size:13px}
.q{font-size:19px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:6px 0 12px;line-height:1.8}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid #9aa5a0;margin:0 3px}
.opts{display:grid;gap:8px;margin:10px 0}.opt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;font:inherit;text-align:left}
.hint{margin:8px 0}.hp{background:#eef5f1;border-left:3px solid var(--pri);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:15px}
.note{background:#fff7e0;border-radius:8px;padding:9px 12px;font-size:14px;margin:8px 0}
.ans{background:#fff;border:1px solid var(--pri);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:18px}
.post{background:#fff3a3;box-shadow:2px 3px 8px rgba(0,0,0,.15);border-radius:4px;padding:14px 16px;margin:14px 0;transform:rotate(-.5deg)}.pt{display:flex;align-items:center;gap:6px;font-size:12px;color:#7a6a00;margin-bottom:6px}.pt2{font-size:12px;color:#7a6a00;margin-top:8px}.pl{margin:4px 0;font-size:17px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit}.tabs .on{background:var(--pri);color:#fff}
.dots{display:flex;gap:10px;justify-content:center;margin:14px 0}.dots i{width:14px;height:14px;border:2px solid var(--pri);border-radius:50%}.dots i.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}.pad button{padding:14px;font:inherit;font-size:20px;border:1px solid var(--line);background:#fff;border-radius:10px}

C(1,"B",3,"보기에서 알맞은 전치사를 골라 문장을 완성하시오.<br>She lent some money ___ her friend.",["to","for","of"],"to","She lent some money to her friend.","그녀는 친구에게 돈을 좀 빌려주었다.",

W(1,"C",1,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>He <u>looks seriously</u> today.","looks serious","He looks serious today.","그는 오늘 진지해 보인다.",
 S1,"1) looks(원형 look: ~해 보이다) 뒤에는 어떤 품사가 와야 하나요?  2) seriously(진지하게)는 -ly 부사예요. 맞을까요?","looks 뒤의 -ly 두 글자를 빼 보세요.","looks + 형용사 → seriously를 serious로");
W(1,"C",2,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>Her boyfriend gave a bunch of tulips <u>to her</u>.","○","Her boyfriend gave a bunch of tulips to her.","그녀의 남자친구는 그녀에게 튤립 한 다발을 주었다.",

W(1,"C",3,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>We wrote <u>our parents a poem</u>.","○","We wrote our parents a poem.","우리는 부모님께 시를 한 편 써 드렸다.",
 S2,"1) wrote(원형 write: 쓰다)도 ‘~에게 …을 써 주다’ 뜻의 수여동사예요.  2) 수여동사 뒤 순서는 ‘간접목적어(사람) + 직접목적어(물건)’예요. 이 문장은 그 순서일까요?","our parents(사람) 다음에 a poem(물건)이 왔어요. 순서가 맞아요. 고칠 곳이 없어요.","수여동사 + 사람 + 물건 → ○");
W(1,"C",4,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>This orange <u>tastes like sour</u>.","tastes sour","This orange tastes sour.","이 오렌지는 신 맛이 난다.",
 S1,"1) tastes(원형 taste: ~한 맛이 나다) 뒤에 sour(신)가 와요. sour는 명사일까요, 형용사일까요?  2) like는 어떤 말 앞에 쓰는 거였는지 빨간 박스에서 확인해요.","형용사 앞에는 like가 필요 없어요. 어떤 한 단어를 지우면 돼요.","like는 명사 앞에만 (taste + 형용사)");
W(1,"C",5,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>My mom bought a new coat <u>to me</u>.","for me","My mom bought a new coat for me.","엄마가 나에게 새 코트를 사 주셨다.",
 S3,"1) bought(원형 buy: 사다)는 표에서 to 줄일까요, for 줄일까요?  2) 직접목적어 뒤에 사람을 붙일 때 쓰는 전치사를 확인해요.","to 대신 f로 시작하는 세 글자 전치사를 써요.","buy + 직접목적어 + for + 사람");

W(1,"D",2,"두 문장의 의미가 같도록 알맞은 전치사를 이용하여 바꿔 쓰시오.<br>I will send my favorite singer a letter.","I will send a letter to my favorite singer.","I will send a letter to my favorite singer.","나는 내가 가장 좋아하는 가수에게 편지를 보낼 것이다.",

W(1,"D",3,"두 문장의 의미가 같도록 알맞은 전치사를 이용하여 바꿔 쓰시오.<br>She teaches high school students social studies.","She teaches social studies to high school students.","She teaches social studies to high school students.","그녀는 고등학생들에게 사회를 가르친다.",
 S3,"1) teaches(원형 teach: 가르치다)는 ‘~에게 …을 가르쳐 주다’ 뜻이에요.  2) 사람 high school students(고등학생들)와 물건 social studies(사회 과목)의 위치를 서로 바꿔요. teach는 표 어느 줄일까요?","teach는 to를 쓰는 동사예요. 사람 앞에 to를 붙여 문장 끝에 놓아요.","teach + 과목 + to + 사람");
W(1,"D",4,"두 문장의 의미가 같도록 알맞은 전치사를 이용하여 바꿔 쓰시오.<br>My grandmother cooked me some hot chicken soup.","My grandmother cooked some hot chicken soup for me.","My grandmother cooked some hot chicken soup for me.","우리 할머니는 나에게 따뜻한 닭고기 수프를 끓여 주셨다.",

W(2,"A",1,"목적어에 동그라미 표시하고 목적격 보어에 밑줄 치시오.<br>They called him a genius.","목적어 him / 목적격 보어 a genius","They called (him) _a genius_.","그들은 그를 천재라고 불렀다.",

W(2,"A",2,"목적어에 동그라미 표시하고 목적격 보어에 밑줄 치시오.<br>These boots keep my feet warm.","목적어 my feet / 목적격 보어 warm","These boots keep (my feet) _warm_.","이 부츠는 내 발을 따뜻하게 유지해 준다.",
 T3,"1) keep(유지하다)은 POINT 3 박스에 있는 동사예요.  2) ‘무엇을 어떻게’ 유지해 주는지 순서대로 나눠 봐요. 발은 따뜻한 상태가 돼요.","목적어는 두 단어(소유격 + 명사), 보어는 형용사 한 단어예요. 마지막 단어가 보어예요.","keep + 목적어 + 형용사 보어");

W(2,"A",4,"목적어에 동그라미 표시하고 목적격 보어에 밑줄 치시오.<br>Cory asked the taxi driver to take a left.","목적어 the taxi driver / 목적격 보어 to take a left","Cory asked (the taxi driver) _to take a left_.","코리는 택시 기사에게 좌회전하라고 요청했다.",

W(2,"B",2,"밑줄 친 부분을 어법에 맞게 고치시오.<br>Please tell them <u>wait</u> outside.","to wait","Please tell them to wait outside.","그들에게 밖에서 기다리라고 말해 주세요.",
 T4,"1) tell(말하다, ~하라고 말하다)은 POINT 4 박스에 들어 있어요.  2) 그 박스 동사들의 목적격 보어는 어떤 모양일까요?","wait 앞에 두 글자짜리 말 하나를 붙여요.","tell은 목적어 뒤에 to V (말하다 → ~하라고)");
W(2,"B",3,"밑줄 친 부분을 어법에 맞게 고치시오.<br>The restaurant always keeps its menu <u>interestingly</u>.","interesting","The restaurant always keeps its menu interesting.","그 식당은 항상 메뉴를 흥미롭게 유지한다.",

W(2,"B",4,"밑줄 친 부분을 어법에 맞게 고치시오.<br>My teacher encouraged me <u>writing</u> poetry.","to write","My teacher encouraged me to write poetry.","우리 선생님은 내가 시를 쓰도록 격려해 주셨다.",

 T4,"1) wants(원형 want: 원하다)는 POINT 4 박스 첫 번째 동사예요.  2) 그 뒤 ‘Tyler(목적어)’ 다음 보어는 to부정사예요. 문맥상 ‘~에게 사과하다’ 뜻의 동사는 보기 중 무엇일까요?","a로 시작해서 -ize로 끝나는 동사에 to를 붙여요.","want + 목적어 + to V (~가 …하기를 원하다)",["leave","retake","arrive","become","apologize"]);
W(2,"C",2,"보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오. (단, 한 번씩만 쓸 것)<br>(보기: leave / retake / arrive / become / apologize)<br>He ordered me ___ the room.","to leave","He ordered me to leave the room.","그는 나에게 방에서 나가라고 명령했다.",
 T4,"1) ordered(원형 order: 명령하다)도 POINT 4 박스에 있어요.  2) ‘방을 …하라고 명령했다’에서 방을 목적어로 받을 수 있는 동사를 보기에서 찾아요.","‘떠나다’ 뜻의 l로 시작하는 동사 앞에 to를 붙여요.","order + 목적어 + to V",["leave","retake","arrive","become","apologize"]);
W(2,"C",3,"보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오. (단, 한 번씩만 쓸 것)<br>(보기: leave / retake / arrive / become / apologize)<br>Mr. Goldberg allowed him ___ the test.","to retake","Mr. Goldberg allowed him to retake the test.","골드버그 선생님은 그가 시험을 다시 보도록 허락하셨다.",

W(2,"C",4,"보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오. (단, 한 번씩만 쓸 것)<br>(보기: leave / retake / arrive / become / apologize)<br>Lynn expects the delivery ___ before noon.","to arrive","Lynn expects the delivery to arrive before noon.","린은 배송이 정오 전에 도착하기를 기대한다.",
 T4,"1) expects(원형 expect: 기대하다)는 POINT 4 박스에 있어요.  2) 배송(the delivery)이 정오 전에 ‘무엇’하기를 기대하는지 생각해요.","‘도착하다’ 뜻의 a로 시작하는 동사에 to를 붙여요. apologize는 아니에요.","expect + 목적어 + to V",["leave","retake","arrive","become","apologize"]);
W(2,"C",5,"보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오. (단, 한 번씩만 쓸 것)<br>(보기: leave / retake / arrive / become / apologize)<br>My aunt advised me ___ an accountant.","to become","My aunt advised me to become an accountant.","우리 이모는 내가 회계사가 되라고 조언하셨다.",

C(2,"D",1,"밑줄 친 부분의 쓰임이 같은 것을 보기에서 골라 기호를 쓰시오.<br>ⓐ My father <u>made</u> me a lawyer.<br>ⓑ Rosa <u>made</u> her little brother a toy.<br>My dad <u>made</u> me a chair.",["ⓐ","ⓑ"],"ⓑ","My dad made me a chair. (= ⓑ, 수여동사 made)","우리 아빠는 나에게 의자를 만들어 주셨다.",
 T2,"1) 보기 ⓐ는 me = a lawyer(나 = 변호사)가 성립해요. ⓑ는 her little brother ≠ a toy예요.  2) 이 문장은 me와 a chair가 같은 사람/물건인지 확인해 봐요.","나는 의자가 아니에요. ‘~에게 …을 만들어 주다’ 뜻이라서 ⓑ 쪽이에요. 두 번째 보기예요.","me ≠ a chair → 수여동사(만들어 주다)");
C(2,"D",2,"밑줄 친 부분의 쓰임이 같은 것을 보기에서 골라 기호를 쓰시오.<br>ⓐ My father <u>made</u> me a lawyer.<br>ⓑ Rosa <u>made</u> her little brother a toy.<br>You <u>make</u> me a better person.",["ⓐ","ⓑ"],"ⓐ","You make me a better person. (= ⓐ, me = a better person)","너는 나를 더 나은 사람으로 만들어 준다.",
 T2,"1) 두 보기의 차이는 ‘목적어 = 뒤의 말’이 성립하느냐예요.  2) me와 a better person을 연결해서 ‘나는 더 나은 사람이다’가 되는지 확인해요.","‘나 = 더 나은 사람’이 말이 돼요. 첫 번째 보기예요.","me = a better person → 목적격 보어");
C(2,"D",3,"밑줄 친 부분의 쓰임이 같은 것을 보기에서 골라 기호를 쓰시오.<br>ⓐ My father <u>made</u> me a lawyer.<br>ⓑ Rosa <u>made</u> her little brother a toy.<br>Bob <u>made</u> me a beautiful pendant necklace.",["ⓐ","ⓑ"],"ⓑ","Bob made me a beautiful pendant necklace. (= ⓑ, 수여동사 made)","밥은 나에게 아름다운 펜던트 목걸이를 만들어 주었다.",
 T2,"1) me와 a beautiful pendant necklace가 같은 대상인지 비교해 봐요.  2) 사람과 목걸이는 같을 수 없어요. 그럼 ‘누구에게 무엇을 만들어 줬다’ 구조예요.","me ≠ necklace예요. 두 번째 보기예요.","me ≠ 물건 → ‘만들어 주다’");
C(2,"D",4,"밑줄 친 부분의 쓰임이 같은 것을 보기에서 골라 기호를 쓰시오.<br>ⓐ My father <u>made</u> me a lawyer.<br>ⓑ Rosa <u>made</u> her little brother a toy.<br>The director <u>made</u> her a celebrity.",["ⓐ","ⓑ"],"ⓐ","The director made her a celebrity. (= ⓐ, her = a celebrity)","그 감독은 그녀를 유명인으로 만들었다.",
 T2,"1) her와 a celebrity(유명인)를 ‘~는 …이다’로 이어 봐요.  2) 말이 되면 목적어와 목적격 보어 관계예요.","‘그녀 = 유명인’이 성립해요. 첫 번째 보기예요.","her = a celebrity → made는 ‘~로 만들다’");
C(2,"D",5,"밑줄 친 부분의 쓰임이 같은 것을 보기에서 골라 기호를 쓰시오.<br>ⓐ My father <u>made</u> me a lawyer.<br>ⓑ Rosa <u>made</u> her little brother a toy.<br>We <u>made</u> Tina the captain of the soccer team.",["ⓐ","ⓑ"],"ⓐ","We made Tina the captain of the soccer team. (= ⓐ, Tina = the captain)","우리는 티나를 축구팀의 주장으로 만들었다(뽑았다).",
 T2,"1) Tina와 the captain of the soccer team(축구팀 주장)이 같은 사람인지 살펴봐요.  2) 같은 사람이면 ‘목적어 = 보어’예요.","티나가 주장이 되는 거예요. 첫 번째 보기예요.","Tina = captain → 목적격 보어");

M(3,"A",1,"( ) 안에서 알맞은 말을 모두 고르시오.<br>Susan felt something (to bite / bite / biting) her leg.",["to bite","bite","biting"],["bite","biting"],"Susan felt something bite[biting] her leg.","수잰은 무언가가 자기 다리를 무는 것을 느꼈다.",
 R1,"1) felt(원형 feel: 느끼다)는 감각 기관으로 느끼는 지각동사예요.  2) 지각동사의 목적격 보어로는 동사원형이 오고, 진행 중인 동작을 강조하면 다른 모양도 가능해요. POINT 1 아래쪽 ‘진행 중인 동작을 강조하기 위해…’ 설명을 읽어 봐요.","to가 붙은 보기는 소거해요. 나머지 두 개가 모두 답이에요.","지각동사 + 목적어 + 동사원형/-ing");
M(3,"A",2,"( ) 안에서 알맞은 말을 모두 고르시오.<br>His parents let him (go / to go / going) to the concert.",["go","to go","going"],["go"],"His parents let him go to the concert.","그의 부모님은 그가 콘서트에 가도록 허락하셨다.",
 R2,"1) let(허락하다, ~하게 해 주다)은 사역동사예요.  2) POINT 2 박스에서 let, make, have 뒤의 보어는 어떤 모양인지 확인해요.","사역동사 뒤에는 한 가지 모양뿐이에요. to도 -ing도 아닌 쪽이에요.","let은 사역동사 → 목적어 뒤 to 없이 원형");
M(3,"A",3,"( ) 안에서 알맞은 말을 모두 고르시오.<br>Josh helped his mom (mow / to mow / mowing) the lawn.",["mow","to mow","mowing"],["mow","to mow"],"Josh helped his mom mow[to mow] the lawn.","조시는 엄마가 잔디를 깎는 것을 도왔다.",
 R2,"1) helped(원형 help: 돕다)는 POINT 2 아래쪽 동그란 설명에 따로 나와요.  2) help의 목적격 보어로는 두 가지 모양을 쓸 수 있다고 했어요.","-ing 모양만 아니에요. 나머지 두 보기가 모두 답이에요.","help + 목적어 + 동사원형 / to V");
M(3,"A",4,"( ) 안에서 알맞은 말을 모두 고르시오.<br>I saw the man (steal / to steal / stealing) the bracelet.",["steal","to steal","stealing"],["steal","stealing"],"I saw the man steal[stealing] the bracelet.","나는 그 남자가 팔찌를 훔치는 것을 보았다.",
 R1,"1) saw(원형 see: 보다)는 지각동사예요.  2) 지각동사의 목적격 보어로 쓸 수 있는 모양이 본책에 두 가지 나와 있어요.","to가 붙은 보기만 빼면 돼요. 나머지 두 개가 답이에요.","see + 목적어 + 동사원형/-ing");
M(3,"A",5,"( ) 안에서 알맞은 말을 모두 고르시오.<br>We got him (apologize / to apologize / apologizing) to us.",["apologize","to apologize","apologizing"],["to apologize"],"We got him to apologize to us.","우리는 그가 우리에게 사과하게 했다.",
 R2,"1) got(원형 get: ~하게 하다)은 사역동사처럼 해석돼요.  2) 하지만 POINT 2 아래 동그란 설명에서 get의 보어 모양은 사역동사와 다르다고 했어요.","to가 붙은 보기 하나만 답이에요.","get은 사역처럼 해석해도 보어는 to V");

W(3,"B",1,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>I heard someone <u>coughing</u> behind me.","○","I heard someone coughing behind me.","나는 누군가가 내 뒤에서 기침하는 소리를 들었다.",
 R1,"1) heard(원형 hear: 듣다)는 지각동사예요.  2) 지각동사의 목적격 보어 자리에 동사원형 또는 진행 중 동작을 강조하는 -ing가 올 수 있어요.","coughing은 진행 중인 동작을 강조하는 -ing 모양이에요. 고칠 곳이 없어요.","hear + 목적어 + -ing → ○");
W(3,"B",2,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>We watched the sheep <u>ate</u> grass.","eat[eating]","We watched the sheep eat[eating] grass.","우리는 양이 풀을 먹는 것을 지켜보았다.",
 R1,"1) watched(원형 watch: 지켜보다)는 지각동사예요.  2) 목적어 the sheep 뒤 보어에 과거형(ate)을 쓸 수 있을까요?","ate(원형 eat: 먹다)를 동사원형으로 되돌려요. -ing도 가능해요.","watch + 목적어 + 동사원형/-ing");
W(3,"B",3,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>I could smell the turkey <u>roasting</u>.","○","I could smell the turkey roasting.","나는 칠면조가 구워지는 냄새를 맡을 수 있었다.",
 R1,"1) smell(냄새를 맡다)도 지각동사 목록에 들어 있어요.  2) 진행 중인 동작 -ing를 보어로 쓴 예문 ‘bread baking’을 찾아봐요.","같은 구조예요. 고칠 곳이 없어요.","smell + 목적어 + -ing → ○");
W(3,"B",4,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>We heard <u>tap someone</u> on the window.","someone tap[tapping]","We heard someone tap[tapping] on the window.","우리는 누군가가 창문을 두드리는 소리를 들었다.",
 R1,"1) 지각동사 heard 뒤의 순서는 ‘목적어 + 목적격 보어’예요.  2) 누가 두드렸는지(목적어)와 두드리는 동작(보어) 중 무엇이 먼저 와야 할까요?","두 단어의 순서를 바꿔요. 사람이 먼저, 동작이 나중이에요.","지각동사 + 목적어 + 보어(순서)");

 R2,"1) let(허락하다)은 사역동사예요.  2) 뒤 목적어 me 다음에 오는 동사의 모양은 원래 모양이에요. ‘동아리(the club)’와 어울리는 동사를 골라요.","‘가입하다’ 뜻이고 j로 시작하는 네 글자예요.","Please let me + 동사원형 (~하게 해 주세요)",["check","join","take","try","clean"]);
W(3,"C",2,"보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오. (단, 한 번씩만 쓸 것)<br>(보기: check / join / take / try / clean)<br>I got her ___ macarons for the first time.","to try","I got her to try macarons for the first time.","나는 그녀가 처음으로 마카롱을 먹어 보게 했다.",
 R2,"1) got(원형 get: ~하게 하다)은 사역동사처럼 해석되지만 보어 모양이 달라요.  2) 마카롱을 ‘먹어 보다’ 뜻의 동사를 고르고, get의 규칙에 맞게 써요.","t로 시작하는 세 글자 동사 앞에 to를 붙여요.","get(~하게 하다)은 사역동사와 달리 to V",["check","join","take","try","clean"]);
W(3,"C",3,"보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오. (단, 한 번씩만 쓸 것)<br>(보기: check / join / take / try / clean)<br>They had an inspector ___ the house.","check","They had an inspector check the house.","그들은 조사관이 집을 점검하게 했다.",
 R2,"1) had(원형 have: ~하게 하다)는 사역동사예요.  2) 뒤에 the house(집)를 목적어로 받는 동작이 필요해요. 조사관(inspector)이 하는 일을 생각해요.","‘확인하다, 점검하다’ 뜻이에요. c로 시작하는 다섯 글자예요.","have(~하게 하다) + 목적어 + 동사원형",["check","join","take","try","clean"]);
W(3,"C",4,"보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오. (단, 한 번씩만 쓸 것)<br>(보기: check / join / take / try / clean)<br>Robert’s boss let him ___ a short break.","take","Robert’s boss let him take a short break.","로버트의 상사는 그가 잠깐 쉬도록 허락했다.",

W(3,"C",5,"보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오. (단, 한 번씩만 쓸 것)<br>(보기: check / join / take / try / clean)<br>My father made me ___ the windows.","clean","My father made me clean the windows.","우리 아버지는 내가 창문을 닦게 하셨다.",

W(3,"D",1,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그녀는 내가 정원에서 장미를 심는 것을 도와주었다. (helped / plant / roses / me)<br>She ___ in the garden.","helped me plant roses","She helped me plant roses in the garden.","그녀는 내가 정원에서 장미를 심는 것을 도와주었다.",
 R2,"1) ‘도와주었다’ 동사가 먼저 와요. help의 보어는 동사원형이나 to부정사 모양이에요.  2) 순서는 ‘동사 → 도움받는 사람 → 하는 동작 → 대상’이에요.","helped로 시작하고 roses가 맨 끝이에요. 가운데 두 단어의 순서만 정하면 돼요.","help + 목적어 + 동사원형 + 대상",["helped","plant","roses","me"]);
W(3,"D",2,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그 상사는 모두가 회의에 참여하게 했다. (attend / had / everyone)<br>The boss ___ a meeting.","had everyone attend","The boss had everyone attend a meeting.","그 상사는 모두가 회의에 참여하게 했다.",

W("SW","C",4,"다음 그림을 보고 보기에서 알맞은 말을 골라 문장을 완성하시오. (필요시 형태를 바꿀 것)<br>(그림: ① 제이든이 클로이에게 파스타를 만들어 접시에 담아 주는 모습 ② 클로이가 제이든이 요리 재료를 손질하는 것을 지켜보는 모습 ③ 클로이가 제이든에게 치즈를 더 올려 달라고 말하는 모습 ④ 파스타를 먹고 맛있다는 표정을 짓는 모습)<br>(보기: prepare / delicious / Chloe / put / pasta)<br>The pasta tasted really ___!","delicious","The pasta tasted really delicious!","그 파스타는 정말 맛있었다!",
 S1,"1) tasted(원형 taste: ~한 맛이 나다)는 감각동사예요.  2) 감각동사 뒤에는 형용사가 오죠. 보기 중 형용사를 찾아요.","‘맛있는’ 뜻이고 d로 시작해요. 고칠 필요 없이 그대로 써요.","taste + 형용사 (맛이 ~하다, 부사 X)",["prepare","delicious","Chloe","put","pasta"]);

W("SW","D",1,"Lisa와 엄마의 문자 메시지 대화를 읽고 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>엄마: Lisa, can you buy some milk and eggs on the way home? I’m going to make you a cake with them.<br>Lisa: Sure, Mom. I’ll stop by the supermarket and get them now.<br>엄마: Thank you. And if you have time later today, please clean your room. It’s too messy.<br>Lisa: Okay, I will. By the way, can I hang out with my friends after school?<br>엄마: Yes, but don’t hang out for too long. You have a test coming up soon.<br>Lisa’s mom ___ some milk and eggs. (ask, buy)","asked Lisa to buy","Lisa’s mom asked Lisa to buy some milk and eggs.","리사의 엄마는 리사에게 우유와 달걀을 좀 사 달라고 부탁했다.",
 T4,"1) 엄마가 ‘사 줄 수 있니?’라고 부탁했어요. ask(요청하다)는 POINT 4 박스에 있어요.  2) 이미 지난 일이니 과거형으로 쓰고, ‘누구에게 + to V’ 순서예요.","asked 다음에 부탁받은 사람 이름이 오고, buy 앞에는 두 글자짜리 말이 필요해요.","ask + 사람 + to V (~에게 …해 달라고 부탁)");
W("SW","D",2,"Lisa와 엄마의 문자 메시지 대화를 읽고 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>엄마: Lisa, can you buy some milk and eggs on the way home? I’m going to make you a cake with them.<br>Lisa: Sure, Mom. I’ll stop by the supermarket and get them now.<br>엄마: Thank you. And if you have time later today, please clean your room. It’s too messy.<br>Lisa: Okay, I will. By the way, can I hang out with my friends after school?<br>엄마: Yes, but don’t hang out for too long. You have a test coming up soon.<br>Lisa’s mom will ___. (make, for)","make a cake for Lisa","Lisa’s mom will make a cake for Lisa.","리사의 엄마는 리사에게 케이크를 만들어 줄 것이다.",
 S3,"1) will 뒤는 동사원형이에요. 엄마가 만들어 줄 것은 a cake(케이크)예요.  2) 괄호에 for가 있으니 ‘물건 → for + 사람’ 순서예요. make는 for를 쓰는 동사예요.","make 바로 뒤에는 만들 물건이 오고, 사람 이름은 for 뒤에 와요.","make + 물건 + for + 사람");
W("SW","D",3,"Lisa와 엄마의 문자 메시지 대화를 읽고 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>엄마: Lisa, can you buy some milk and eggs on the way home? I’m going to make you a cake with them.<br>Lisa: Sure, Mom. I’ll stop by the supermarket and get them now.<br>엄마: Thank you. And if you have time later today, please clean your room. It’s too messy.<br>Lisa: Okay, I will. By the way, can I hang out with my friends after school?<br>엄마: Yes, but don’t hang out for too long. You have a test coming up soon.<br>Lisa’s mom ___ her room. (tell, clean)","told Lisa to clean","Lisa’s mom told Lisa to clean her room.","리사의 엄마는 리사에게 방을 청소하라고 말했다.",
 T4,"1) 엄마가 ‘방을 치워’라고 말했어요. tell(말하다)은 POINT 4 박스에 있어요.  2) 과거형 told를 쓰고 ‘누구에게 + to V’ 순서예요.","told 다음에 시킨 사람 이름이 오고, clean 앞에는 두 글자짜리 말이 필요해요.","‘~해’라고 시킨 말 → told + 사람 + to V");
W("SW","D",4,"Lisa와 엄마의 문자 메시지 대화를 읽고 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>엄마: Lisa, can you buy some milk and eggs on the way home? I’m going to make you a cake with them.<br>Lisa: Sure, Mom. I’ll stop by the supermarket and get them now.<br>엄마: Thank you. And if you have time later today, please clean your room. It’s too messy.<br>Lisa: Okay, I will. By the way, can I hang out with my friends after school?<br>엄마: Yes, but don’t hang out for too long. You have a test coming up soon.<br>Lisa’s mom ___ with her friends. (let, hang out)","let Lisa hang out","Lisa’s mom let Lisa hang out with her friends.","리사의 엄마는 리사가 친구들과 어울려 놀게 해 주었다.",
 R2,"1) 엄마가 ‘놀아도 돼’라고 허락했어요. let(허락하다)은 사역동사예요.  2) 사역동사 뒤 보어 모양을 POINT 2에서 확인해요. let은 과거형도 같은 모양이에요.","let 다음에 허락받은 사람 이름이 오고, hang out은 to 없이 그대로 써요.","let + 사람 + 동사원형 (~가 …하게 허락)");

// ===== 내신 대비 실전문제 (pp.20-23) =====
const P23="Last month, I went on a trip to Switzerland with my family. The local tour guide <u>우리에게 많은 흥미로운 장소들을 보여주었다</u>. He encouraged us ① trying raclette, a popular Swiss dish. It tasted ② deliciously! On the last day, we hiked the Alps. The guide advised us ③ be careful near the cliff. It was a difficult hike, but the view from the summit was amazing. The guide showed white flowers ④ for me at the summit. They looked beautiful. We had a wonderful time there. I want to say thank you to him, so I will send ⑤ an email him.";
C("NS","N",1,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>The little kitten looks ___.",["① quietly","② slowly","③ lovely","④ nicely","⑤ strangely"],"③ lovely","The little kitten looks lovely.","그 작은 새끼 고양이는 사랑스러워 보인다.",
 S1,"1) looks(원형 look: ~해 보이다) 뒤에는 형용사가 와요.  2) 보기 다섯 개 중 -ly로 끝나지만 사실은 형용사인 단어가 하나 있어요. 나머지 넷은 ‘~하게’ 꼴 부사예요.","‘사랑스러운’ 뜻의 단어예요. 세 번째 보기예요.","look + 형용사 (lovely는 형용사)");
C("NS","N",2,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>Her parents ___ her to stay up late.",["① let","② had","③ call","④ sounded","⑤ allowed"],"⑤ allowed","Her parents allowed her to stay up late.","그녀의 부모님은 그녀가 늦게까지 깨어 있도록 허락하셨다.",
 T4,"1) 빈칸 뒤 ‘her(목적어) + to stay(to부정사)’가 있어요.  2) 그런 구조를 취하는 동사는 POINT 4 박스에 있어요. 보기 중 그 박스에 있는 동사를 찾아요.","let, had는 사역동사라 뒤에 to를 쓰지 않아요. call, sounded도 아니에요. 마지막 보기예요.","빈칸 뒤 목적어 + to V → allow 자리");
C("NS","N",3,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>They had Philip ___ on the stage.",["① dance","② dances","③ danced","④ to dance","⑤ dancing"],"① dance","They had Philip dance on the stage.","그들은 필립이 무대에서 춤을 추게 했다.",
 R2,"1) had(원형 have: ~하게 하다)는 사역동사예요.  2) POINT 2 박스에서 사역동사 뒤 보어의 모양을 확인해요.","to, -s, -ed, -ing가 붙지 않은 가장 기본 모양이에요. 첫 번째 보기예요.","have + 목적어 + 동사원형 (~가 …하게 시키다)");
C("NS","N",4,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>The old lady ___ children singing.",["① let","② heard","③ asked","④ made","⑤ ordered"],"② heard","The old lady heard children singing.","그 할머니는 아이들이 노래하는 소리를 들었다.",
 R1,"1) 빈칸 뒤 ‘children + singing(-ing)’ 구조예요.  2) -ing를 보어로 쓸 수 있는 동사는 지각동사예요. 보기 중 소리를 ‘듣다’ 뜻 동사를 찾아요.","h로 시작하는 동사예요. asked, ordered는 to부정사를 써요.","hear + 목적어 + 동사원형/-ing (소리 듣기)");
C("NS","N",5,"빈칸에 to가 쓰일 수 없는 것의 개수는?<br>• She got some concert tickets ___ me.<br>• Ms. Brown ordered us ___ stop immediately.<br>• I helped my dad ___ put up some shelves in the living room.<br>• They showed a nice picture ___ us.<br>• Dave let me ___ use his tablet.",["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],"② 2개","빈칸에 to를 쓸 수 없는 문장은 첫 번째(for me)와 다섯 번째(let me use) 두 개이다.","to를 쓸 수 없는 것은 She got some concert tickets for me / Dave let me use his tablet 두 문장이다.",
 S3,"1) 문장마다 빈칸이 ‘수여동사의 전치사’인지 ‘보어의 to’인지 구분해요.  2) get(구하다)은 for, order(명령하다)·help(돕다)는 to부정사, show(보여 주다)는 to, let(~하게 하다)은 동사원형이에요.","to가 못 들어가는 줄은 get(구해 주다)과 let(~하게 하다)이 있는 문장이에요.","get은 for / let은 to (X) → 2개");
C("NS","N",6,"밑줄 친 부분이 어법상 옳지 않은 것은?<br>① They helped me <u>clean</u> the kitchen.<br>② Dennis made me <u>to take out</u> the trash.<br>③ The judge had the man <u>pay</u> back the loan.<br>④ His parents allowed him <u>to study</u> abroad.<br>⑤ She forced herself <u>to laugh</u> at the bad joke.",["① They helped me clean the kitchen.","② Dennis made me to take out the trash.","③ The judge had the man pay back the loan.","④ His parents allowed him to study abroad.","⑤ She forced herself to laugh at the bad joke."],"② Dennis made me to take out the trash.","Dennis made me take out the trash.","데니스는 내가 쓰레기를 내다 버리게 했다.",
 R2,"1) 문장마다 동사를 먼저 보고, 그 동사가 사역동사 / help / to부정사를 쓰는 동사 중 어느 쪽인지 정해요.  2) made(원형 make: ~하게 하다)는 사역동사예요. POINT 2 박스를 확인해요.","두 번째 보기 문장의 to를 지워야 해요. 나머지는 모두 규칙에 맞아요.","make + 목적어 + 동사원형 (to (X))");
C("NS","N",7,"[7-8] 빈칸에 공통으로 들어갈 말로 알맞은 것을 고르시오.<br>• Sarah ___ a sandcastle for her brother.<br>• Brian ___ his sister wash the dishes.<br>• His success ___ his family proud.",["① let","② kept","③ made","④ ordered","⑤ showed"],"③ made","Sarah made a sandcastle for her brother. / Brian made his sister wash the dishes. / His success made his family proud.","세라는 남동생에게 모래성을 만들어 주었다. / 브라이언은 여동생이 설거지를 하게 했다. / 그의 성공은 그의 가족을 자랑스럽게 만들었다.",
 T2,"1) 세 문장 모두 ‘만들어 주다 / ~하게 시키다 / ~하게 만들다’ 뜻으로 쓸 수 있는 동사가 필요해요.  2) 첫 문장은 ‘for her brother’가 있어서 for를 쓰는 동사예요. 보기 중 for를 쓰는 동사를 찾아요.","m으로 시작하는 네 글자 동사예요. 세 번째 보기예요. 과거형이에요.","make: 만들어 주다 / ~하게 하다 / ~로 만들다");
C("NS","N",8,"[7-8] 빈칸에 공통으로 들어갈 말로 알맞은 것을 고르시오.<br>• When I was young, my mom read fairy tales ___ me.<br>• The doctor advised me ___ eat more vegetables.",["① in","② of","③ for","④ to","⑤ with"],"④ to","When I was young, my mom read fairy tales to me. / The doctor advised me to eat more vegetables.","내가 어렸을 때, 엄마는 나에게 동화를 읽어 주셨다. / 의사는 내가 채소를 더 먹으라고 조언했다.",
 S3,"1) 첫 문장은 수여동사 read(읽어 주다)의 직접목적어 뒤에 오는 전치사 자리예요.  2) 두 번째 문장은 advise(조언하다) 뒤 to부정사의 to 자리예요. 두 문장에 모두 들어가는 말을 찾아요.","t로 시작하는 두 글자예요.","read + 물건 + to + 사람 / advise + 목적어 + to V");
C("NS","N",9,"우리말을 영어로 바르게 옮긴 것은?<br>그녀는 언제나 그녀의 손자를 웃게 만든다.",["① She always makes laugh her grandson.","② She always makes her grandson laugh.","③ She always makes to laugh her grandson.","④ She always makes her grandson to laugh.","⑤ She always makes her grandson laughing."],"② She always makes her grandson laugh.","She always makes her grandson laugh.","그녀는 언제나 그녀의 손자를 웃게 만든다.",
 R2,"1) ‘~가 …하게 만든다’는 사역동사 makes(원형 make: ~하게 하다)예요.  2) 어순은 ‘동사 → 목적어(손자) → 동사원형’이에요. 보기에서 이 순서를 찾고, to나 -ing는 소거해요.","①, ③은 순서가 틀리고 ④는 to, ⑤는 -ing가 붙었어요. 남는 것은 두 번째 보기예요.","make + 목적어 + 동사원형 (~가 …하게 만들다)");
M("NS","N",10,"[10-11] 빈칸에 들어갈 말로 알맞지 않은 것을 모두 고르시오.<br>This fruit smells ___.",["① freshly","② sweet","③ an apple","④ great","⑤ strong"],["① freshly","③ an apple"],"This fruit smells sweet[great / strong]. 알맞지 않은 것: freshly(부사), an apple(명사, like 없음)","이 과일은 달콤한[멋진 / 강한] 냄새가 난다.",
 S1,"1) smells(원형 smell: 냄새가 나다)는 감각동사예요.  2) 감각동사 뒤에는 형용사가 오고, 명사가 오면 like가 필요해요. 보기를 품사별로 나눠 봐요.","-ly로 끝나는 부사 하나와, like 없이 쓴 명사 하나가 답이에요. 첫 번째와 세 번째 보기예요.","smell + 형용사 / smell like + 명사");
M("NS","N",11,"[10-11] 빈칸에 들어갈 말로 알맞지 않은 것을 모두 고르시오.<br>Mr. Johnson ___ a book to me last week.",["① sent","② lent","③ showed","④ made","⑤ bought"],["④ made","⑤ bought"],"Mr. Johnson sent[lent / showed] a book to me last week. 알맞지 않은 것: made, bought(for를 쓰는 동사)","존슨 선생님은 지난주에 나에게 책 한 권을 보내 주셨다[빌려주셨다 / 보여 주셨다].",
 S3,"1) 문장에 ‘a book to me’가 있으니 to를 쓰는 수여동사가 필요해요.  2) p.12 표에서 to를 쓰는 동사와 for를 쓰는 동사를 구분해요.","sent, lent, showed는 to를 써요. for를 쓰는 동사 두 개가 알맞지 않은 보기예요. 네 번째와 다섯 번째예요.","to: give/send/lend/show, for: make/buy");
C("NS","N",12,"빈칸에 들어갈 말이 순서대로 짝지어진 것은?<br>• I helped my grandfather ___ the seeds.<br>• I asked Rosa ___ my dog.",["① plant — walk","② to plant — walk","③ to plant — to walk","④ planting — walk","⑤ planting — to walk"],"③ to plant — to walk","I helped my grandfather to plant the seeds. / I asked Rosa to walk my dog.","나는 할아버지께서 씨앗을 심으시는 것을 도와드렸다. / 나는 로사에게 내 개를 산책시켜 달라고 부탁했다.",
 T4,"1) 첫 문장은 help(돕다)의 보어 자리, 두 번째는 ask(요청하다)의 보어 자리예요.  2) help는 두 가지 모양이 가능하고, ask는 POINT 4 박스 동사라 한 가지 모양만 써요.","두 번째 빈칸에는 to가 꼭 필요해요. 그러면 보기가 둘로 줄어요. 첫 번째 빈칸은 그 둘이 같은 모양이에요.","help는 (to) V / ask는 to V");
C("NS","N",13,"밑줄 친 부분과 쓰임이 같은 것은?<br>Emily <u>made</u> me brush my teeth.",["① She made me a sandwich.","② Her silence made me anxious.","③ Mike made a small tree house for his son.","④ His parents made him do his homework.","⑤ The company’s owner made his daughter the CEO."],"④ His parents made him do his homework.","His parents made him do his homework.","그의 부모님은 그가 숙제를 하게 하셨다.",
 R2,"1) 기준 문장 ‘made me brush’는 ‘~가 …하게 하다’ 뜻의 사역동사 make예요.  2) 보기마다 made 뒤에 어떤 모양이 오는지 보고, 같은 모양을 찾아요.","made 뒤에 ‘사람 + 동사원형’이 오는 보기 하나예요. 네 번째 보기예요.","make + 목적어 + 동사원형 (사역)");
C("NS","N",14,"그림의 상황을 영작할 때 빈칸에 들어갈 말로 알맞은 것은?<br>(그림: 한 소년이 밥을 먹다가 엄마에게 ‘Mom, give me more rice please.(엄마, 밥 좀 더 주세요.)’라고 말하고 있다.)<br>The boy ___.",["① asked his mom give him more rice","② asked his mom to give him more rice","③ allowed his mom give him more rice","④ wanted his mom give him more rice","⑤ wanted his mom giving him more rice"],"② asked his mom to give him more rice","The boy asked his mom to give him more rice.","그 소년은 엄마에게 밥을 더 달라고 부탁했다.",
 T4,"1) 그림 속 소년은 엄마에게 부탁(요청)하고 있어요.  2) ask(요청하다), want(원하다)는 모두 ‘목적어 + to V’를 써요. allow(허락하다)는 뜻이 어울리는지 따져 봐요.","to가 빠진 보기는 틀려요. 부탁한다는 뜻이 맞고 to가 있는 보기를 골라요. 두 번째 보기예요.","ask + 목적어 + to V (~에게 …해 달라고 부탁)");
W("NS","N",15,"[15-16] 우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>이 카메라 필터는 사람들을 더 어려 보이게 만든다. (people / camera / this / makes / younger / look / filter)","This camera filter makes people look younger","This camera filter makes people look younger.","이 카메라 필터는 사람들을 더 어려 보이게 만든다.",
 R2,"1) ‘~가 …하게 만든다’는 사역동사 makes(원형 make: ~하게 하다)예요.  2) 주어는 this + camera + filter, 그다음 동사 → 목적어 → 동사원형 순서예요. ‘어려 보이다’는 look(~해 보이다) + younger(더 어린)예요.","This camera filter가 주어예요. makes 뒤에는 사람들이 먼저 오고, ‘어려 보이다’는 맨 끝이에요.","makes + 목적어 + 원형 (this camera filter가 주어)",["people","camera","this","makes","younger","look","filter"]);
W("NS","N",16,"[15-16] 우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>사람들은 그 판다를 푸바오라고 불렀다. (called / panda / Fu Bao / people / the)","People called the panda Fu Bao","People called the panda Fu Bao.","사람들은 그 판다를 푸바오라고 불렀다.",
 T2,"1) ‘~를 …라고 불렀다’는 call(부르다)이에요. POINT 2 박스에 있어요.  2) 순서는 ‘주어 → 동사 → 목적어(the panda) → 이름(보어)’이에요.","People called로 시작해요. 불린 대상(판다)과 이름 중 무엇이 먼저 올까요?","call + 목적어 + 명사 보어",["called","panda","Fu Bao","people","the"]);
W("NS","N",17,"우리말과 일치하도록 ( ) 안에 주어진 말을 배열할 때 네 번째 오는 것을 쓰시오.<br>그녀는 그가 컵을 테이블 위에 두는 것을 보았다. (saw / him / the / cup / put / she / the / table / on)","put","She saw him put the cup on the table.","그녀는 그가 컵을 테이블 위에 두는 것을 보았다.",
 R1,"1) ‘보았다’는 지각동사 saw(원형 see: 보다)예요.  2) 문장 전체를 먼저 ‘주어 → 지각동사 → 목적어 → 동사원형 → 나머지’로 배열한 다음, 네 번째 칸을 세어요.","She, saw, him 다음 네 번째 자리예요. 컵을 ‘두는’ 동작을 나타내는 말이에요.","see + 목적어 + 동사원형 (She saw him put…)",["saw","him","the","cup","put","she","the","table","on"]);
C("NS","N",18,"(A)~(C)에 들어갈 말이 바르게 짝지어진 것은?<br>• We expect food prices (A) increase / to increase again.<br>• They let the workers (B) leave / leaving at 3:00 p.m.<br>• We watched the sheep (C) giving / to give birth to a lamb.",["① increase / leave / to give","② increase / to leave / giving","③ to increase / leave / to give","④ to increase / leave / giving","⑤ to increase / to leave / to give"],"④ to increase / leave / giving","We expect food prices to increase again. / They let the workers leave at 3:00 p.m. / We watched the sheep giving birth to a lamb.","우리는 식품 가격이 다시 오를 것으로 예상한다. / 그들은 직원들이 오후 3시에 퇴근하게 했다. / 우리는 양이 새끼 양을 낳는 것을 지켜보았다.",
 T4,"1) (A) expect(예상하다)는 POINT 4 박스 동사, (B) let은 사역동사, (C) watch는 지각동사예요.  2) 세 동사의 보어 모양을 각각 정해요. (C)는 지각동사라 to부정사는 쓸 수 없어요.","(A)는 to가 붙고, (B)는 to가 붙지 않은 동사원형이에요. (C)는 -ing 모양이에요. 이 조합이 있는 보기는 네 번째예요.","expect: to V / let: V / watch: V 또는 -ing");
C("NS","N",19,"어법상 옳은 것의 개수는?<br>• He is my stepdad, but I call him to Dad.<br>• Your huge scarf looks warmly.<br>• I bought a beautiful dress to my mom.<br>• Josh showed his brand-new camera to me.",["① 0개","② 1개","③ 2개","④ 3개","⑤ 4개"],"② 1개","옳은 문장은 마지막 문장(Josh showed his brand-new camera to me.) 하나뿐이다.","옳은 것은 ‘Josh showed his brand-new camera to me.’ 하나이다. (call him Dad / looks warm / bought a dress for my mom 으로 고쳐야 한다.)",
 T2,"1) 문장 네 개를 각각 따져요. call은 목적어 뒤에 명사, look은 감각동사, buy는 for, show는 to예요.  2) 본책 p.12(전치사 표), p.12 POINT 1(감각동사), p.14 POINT 2(call)를 차례로 대 보세요.","1번은 불필요한 to, 2번은 부사, 3번은 전치사가 틀려요. 맞는 문장은 하나예요.","call + 목적어 + 명사 / look + 형용사 / buy + for");
W("NS","N",20,"[20-21] 두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>Janice sent me a postcard from London.<br>→ Janice ___ from London.","sent a postcard to me","Janice sent a postcard to me from London.","재니스는 런던에서 나에게 엽서를 보냈다.",
 S3,"1) 원래 문장은 ‘간접목적어(me) + 직접목적어(a postcard)’ 순서예요.  2) 순서를 바꿔 ‘물건 + 전치사 + 사람’으로 만들어요. send는 표에서 어느 전치사 줄일까요?","sent 다음에 a postcard, 그리고 t로 시작하는 두 글자 전치사와 me예요.","send(보내다) 전환: 물건 뒤 사람 앞에 to");
W("NS","N",21,"[20-21] 두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>My mother bought me a new bike.<br>→ My mother ___.","bought a new bike for me","My mother bought a new bike for me.","우리 엄마는 나에게 새 자전거를 사 주셨다.",
 S3,"1) 원래 문장은 ‘간접목적어(me) + 직접목적어(a new bike)’ 순서예요.  2) 물건을 앞으로 보내고 사람 앞에 전치사를 써요. buy는 표에서 어느 줄일까요?","bought 다음에 a new bike, 그리고 f로 시작하는 전치사와 me예요.","buy + 물건 + for + 사람");
C("NS","N",22,"밑줄 친 부분의 쓰임이 나머지 넷과 다른 것은?<br>① The boring movie <u>made</u> James sleepy.<br>② Ben <u>made</u> Cindy a flower necklace.<br>③ His achievement <u>made</u> him Employee of the Year.<br>④ You <u>make</u> me a happier person.<br>⑤ Nothing will <u>make</u> Rose change her mind.",["① The boring movie made James sleepy.","② Ben made Cindy a flower necklace.","③ His achievement made him Employee of the Year.","④ You make me a happier person.","⑤ Nothing will make Rose change her mind."],"② Ben made Cindy a flower necklace.","Ben made Cindy a flower necklace. (수여동사: 신디에게 만들어 주었다)","벤은 신디에게 꽃 목걸이를 만들어 주었다.",
 T2,"1) 보기마다 made 뒤의 두 덩어리가 ‘목적어 = 보어’ 관계인지 따져 봐요.  2) James = sleepy, him = Employee of the Year처럼 이어지면 목적격 보어예요. 하나는 ‘~에게 …을 만들어 주다’예요.","Cindy ≠ a flower necklace예요. 두 번째 보기예요.","made 뒤 me ≠ 물건이면 수여동사(~에게 만들어 줌)");
C("NS","N",23,"[23-24] 다음 글을 읽고 질문에 답하시오.<br>"+P23+"<br>위 글의 밑줄 친 ①~⑤를 잘못 고친 것은?<br>① trying → try ② deliciously → delicious ③ be careful → to be careful ④ for → to ⑤ an email him → him an email",["① trying → try","② deliciously → delicious","③ be careful → to be careful","④ for → to","⑤ an email him → him an email"],"① trying → try","He encouraged us to try raclette, a popular Swiss dish.","그는 우리에게 인기 있는 스위스 음식인 라클레트를 먹어 보라고 권했다.",
 T4,"1) ①에는 encouraged(원형 encourage: 격려하다)가 있어요. POINT 4 박스에서 이 동사의 보어 모양을 확인해요.  2) 나머지 ②~⑤도 하나씩 규칙에 맞는지 확인해요.","②는 tasted + 형용사, ③은 advised + to V, ④는 show + to, ⑤는 수여동사 순서예요. 모두 맞으면 틀린 것은 ①이에요.","encourage + 목적어 + to V (try에 to 필요)");
W("NS","N",24,"[23-24] 다음 글을 읽고 질문에 답하시오.<br>"+P23+"<br>위 글의 밑줄 친 우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오. (us / interesting / showed / places / many)<br>The local tour guide ___.","showed us many interesting places","The local tour guide showed us many interesting places.","그 현지 관광 가이드는 우리에게 많은 흥미로운 장소들을 보여주었다.",
 S2,"1) ‘~에게 …을 보여 주었다’는 수여동사 showed(원형 show: 보여 주다)예요.  2) 보기에 전치사 to가 없으니 ‘사람 → 물건’ 순서로 쓰고, 물건 쪽은 ‘many + 형용사 + 명사’ 순이에요.","showed 바로 뒤에는 사람이 와요. 장소 쪽은 ‘many → 형용사 → 명사’로 묶어요.","show + 사람 + 물건 (~에게 …을 보여 주다)",["us","interesting","showed","places","many"]);
C("NS","N",25,"어법상 옳은 것끼리 바르게 짝지어진 것은?<br>ⓐ She wrote him a message on a sticky note.<br>ⓑ The director had the staff to set up more tables.<br>ⓒ I saw a dancer performing at the festival.<br>ⓓ She looks like your grandmother.<br>ⓔ Her friends encouraged her studying art.<br>ⓕ My dog feels uneasily around strangers.",["① ⓐ, ⓒ, ⓓ","② ⓐ, ⓑ, ⓔ","③ ⓑ, ⓒ, ⓔ","④ ⓒ, ⓓ, ⓕ","⑤ ⓓ, ⓔ, ⓕ"],"① ⓐ, ⓒ, ⓓ","옳은 문장은 ⓐ, ⓒ, ⓓ이다. (ⓑ had the staff set up / ⓔ encouraged her to study / ⓕ feels uneasy)","ⓐ 그녀는 그에게 접착식 메모지에 메시지를 써 주었다. ⓒ 나는 무용수가 축제에서 공연하는 것을 보았다. ⓓ 그녀는 너의 할머니를 닮았다.",
 S1,"1) 문장 여섯 개를 동사 종류별로 하나씩 확인해요. wrote는 수여동사, had는 사역동사, saw는 지각동사, looks는 감각동사, encouraged는 to부정사 동사예요.  2) ⓑ, ⓔ, ⓕ는 각 규칙을 어겼는지 살펴봐요.","ⓑ는 사역동사 뒤에 to, ⓔ는 -ing, ⓕ는 부사 때문에 틀려요. 옳은 것 세 개가 들어 있는 보기를 골라요.","틀린 것: ⓑ(to (X)), ⓔ(to V), ⓕ(형용사)");
C("NS","N",26,"문장의 전환이 바르지 않은 것은?<br>① Dr. Han showed us the results of the experiment. → Dr. Han showed the results of the experiment to us.<br>② Scott gave me some chocolates. → Scott gave some chocolates for me.<br>③ I told my mother a lie. → I told a lie to my mother.<br>④ My mom brought me a cup of lemon tea. → My mom brought a cup of lemon tea to me.<br>⑤ Daniel bought his girlfriend some flowers. → Daniel bought some flowers for his girlfriend.",["① Dr. Han showed us the results of the experiment. → Dr. Han showed the results of the experiment to us.","② Scott gave me some chocolates. → Scott gave some chocolates for me.","③ I told my mother a lie. → I told a lie to my mother.","④ My mom brought me a cup of lemon tea. → My mom brought a cup of lemon tea to me.","⑤ Daniel bought his girlfriend some flowers. → Daniel bought some flowers for his girlfriend."],"② Scott gave me some chocolates. → Scott gave some chocolates for me.","Scott gave me some chocolates. → Scott gave some chocolates to me.","스콧은 나에게 초콜릿을 좀 주었다.",
 S3,"1) 다섯 문장의 동사(show, give, tell, bring, buy)를 p.12 표에 하나씩 대 봐요.  2) 표에서 to 줄인지 for 줄인지 확인하고 전환 문장의 전치사와 비교해요.","buy만 for를 쓰고 나머지는 to를 써요. 전치사가 표와 다른 문장이 하나 있어요. 두 번째 보기예요.","give는 to, buy는 for");
M("NS","N",27,"빈칸에 들어갈 말로 알맞은 것을 모두 고르시오.<br>The doctor ___ him to do more exercise.",["① got","② let","③ had","④ allowed","⑤ encouraged"],["① got","④ allowed","⑤ encouraged"],"The doctor got[allowed / encouraged] him to do more exercise.","의사는 그가 운동을 더 하도록 시켰다[허락했다 / 격려했다].",
 R2,"1) 빈칸 뒤에 ‘him to do’가 있어요. 목적어 뒤에 to부정사를 쓰는 동사를 찾아요.  2) let, have는 사역동사라 동사원형을 쓰고, get은 해석은 사역이지만 to부정사를 써요.","let(②)과 had(③)는 제외해요. 나머지 세 개가 답이에요.","get/allow/encourage + 목적어 + to V");
W("NS","N",28,"[28-29] 어법상 틀린 부분을 찾아 바르게 고치시오.<br>I heard someone to call my name.","to call → call[calling]","I heard someone call[calling] my name.","나는 누군가가 내 이름을 부르는 것을 들었다.",
 R1,"1) heard(원형 hear: 듣다)는 지각동사예요.  2) 지각동사 뒤 목적어 someone 다음 보어에 to부정사를 쓸 수 있는지 POINT 1에서 확인해요.","to를 지우면 돼요. 진행 중 동작을 강조하면 -ing로도 써요.","hear + 목적어 + 동사원형/-ing");
W("NS","N",29,"[28-29] 어법상 틀린 부분을 찾아 바르게 고치시오.<br>I watched an Oscar-winning movie. I found the movie interest.","interest → interesting","I found the movie interesting.","나는 오스카상을 받은 영화를 보았다. 나는 그 영화가 흥미롭다고 생각했다.",
 T3,"1) found(원형 find: ~라고 생각하다)는 POINT 3 박스에 있는 동사예요.  2) 목적어 the movie 뒤 보어 자리에는 형용사가 와야 해요. interest(흥미)는 어떤 품사일까요?","interest에 -ing를 붙여 ‘흥미로운’ 뜻의 형용사로 만들어요.","find + 목적어 + 형용사 (…가 ~라고 생각하다)");
W("NS","N",30,"우리말과 일치하도록 주어진 조건에 맞게 영작하시오.<br>그는 내가 나의 자리를 찾는 것을 도와주었다.<br>조건 • 과거시제로 쓸 것 • help, find, seat을 이용할 것 • 총 7단어의 완전한 문장으로 쓸 것","He helped me to find my seat","He helped me to find my seat.","그는 내가 나의 자리를 찾는 것을 도와주었다.",
 R2,"1) help(돕다)를 과거형 helped로 써요. help의 보어는 동사원형이나 to부정사가 가능해요.  2) 단어 수가 7개여야 해요. 동사원형만 쓰면 단어가 몇 개인지 세어 봐요.","동사원형만 쓰면 6단어라서 한 단어가 모자라요. help의 두 가지 보어 모양 중 다른 하나를 골라요.","help + 목적어 + to V → 7단어");
W("NS","N",31,"보기와 같이 주어진 두 문장을 한 문장으로 연결하시오.<br>보기: • I entered the English speech contest. • My teacher told me to do it. → My teacher told me to enter the English speech contest.<br>• He communicates with many different people.<br>• His language skills permit him to do it.<br>→ His language skills ___ many different people.","permit him to communicate with","His language skills permit him to communicate with many different people.","그의 언어 능력은 그가 많은 다양한 사람들과 소통하도록 허용한다.",
 T4,"1) 보기처럼 ‘to do it’의 it에 첫 문장의 내용(communicates with …)을 넣어서 합쳐요.  2) permit(허용하다)은 POINT 4 박스에 있어요. 목적어 him 뒤 보어는 to부정사예요.","permit 다음에 him을 쓰고, communicates(원형 communicate: 소통하다)를 to부정사 모양으로 바꿔요. with도 빠뜨리지 말아요.","permit + 목적어 + to V");

W("GN","G",1,"빈칸을 채우시오. (감각동사 + 형용사)<br>You ① ___ amazing. 너는 굉장해 보인다.","look","You look amazing.","너는 굉장해 보인다.",

W("GN","G",2,"빈칸을 채우시오. (감각동사 + 형용사)<br>This perfume smells ② ___. 이 향수는 향이 강하다.","strong","This perfume smells strong.","이 향수는 향이 강하다.",
 "본책 p.24 문법정리노트 ‘감각동사’ 칸과 p.12 POINT 1 예문을 펴세요.","1) smells(원형 smell: 냄새가 나다) 뒤에는 품사가 정해져 있어요.  2) 한글 해석 ‘향이 강하다’에서 ‘강한’ 뜻의 단어를 써요.","s로 시작하는 여섯 글자 형용사예요.","smell + 형용사 (strong)");
W("GN","G",3,"빈칸을 채우시오. (수여동사)<br>My dad gave ③ ___. 우리 아빠는 나에게 선물을 주셨다.","me a present","My dad gave me a present.","우리 아빠는 나에게 선물을 주셨다.",
 "본책 p.24 문법정리노트 ‘수여동사’ 칸의 위쪽 도식과 p.12 POINT 2 표를 펴세요.","1) 위쪽 도식은 ‘수여동사 + 간접목적어 + 직접목적어’예요.  2) ‘나에게(사람) → 선물을(물건)’ 순서로 써요.","m으로 시작하는 두 글자 + a로 시작하는 관사 + 물건이에요.","수여동사 + 간접목적어(사람) + 직접목적어(물건)");
W("GN","G",4,"빈칸을 채우시오. (수여동사)<br>= My dad gave a present ④ ___.","to me","My dad gave a present to me.","우리 아빠는 나에게 선물을 주셨다.",
 "본책 p.24 문법정리노트 ‘수여동사’ 칸의 아래쪽 도식과 p.12 POINT 3을 펴세요.","1) 이번에는 ‘수여동사 + 직접목적어 + 전치사 + 간접목적어’ 순서예요.  2) gave(원형 give: 주다)는 to를 쓰는 동사 목록에 있어요.","t로 시작하는 두 글자 전치사 뒤에 me를 붙여요.","give + 물건 + to + 사람");

 "본책 p.24 문법정리노트 ‘사역동사’ 칸과 p.16 POINT 2 예문을 펴세요.","1) makes(원형 make: ~하게 하다)는 사역동사예요.  2) 사역동사 뒤는 ‘목적어 → 동사원형’ 순서예요. 목적어는 한글의 ‘그가’예요.","h로 시작하는 두 글자 + e로 시작하는 동사원형이에요.","makes + him + 동사원형 (그가 …하게 만든다)");

 ["Sandy는 지난주에 감기에 걸렸다. (catch a cold)<br>Sandy ___ last week.","caught a cold","Sandy caught a cold last week.","샌디는 지난주에 감기에 걸렸다.",

C(2,"Q",1,"현재 Sean이 하고 있는 행동은?<br>Sean is a taxi driver. He drives his taxi every day. He is eating his lunch right now.",["운전","점심 식사"],"점심 식사","Sean is eating his lunch right now.","션은 지금 점심을 먹고 있는 중이다.",
 "본책 p.28 ‘현재진행형’ POINT 1의 현재시제와 현재진행형 비교 표를 보세요.",
 "1) every day(매일)는 반복되는 일이고, right now(바로 지금)는 지금 하는 일이에요.  2) 지금 하는 일은 「be동사 + v-ing」로 말해요. 이 문장에서 is ~ing 모양은 어느 동사일까요?",
 "is eating(먹고 있다)이 지금 하는 행동이에요. 두 번째 보기예요.",
 "right now → be + v-ing (지금 하는 중)");

 ["I (eat / am eating) lunch at noon every day.","eat","I eat lunch at noon every day.","나는 매일 정오에 점심을 먹는다.",

 ["Jake (drinks / is drinking) soda right now.","is drinking","Jake is drinking soda right now.","제이크는 지금 탄산음료를 마시고 있다.",
  "본책 p.28 ‘현재진행형’ POINT 1의 정의(‘~하고 있다’)를 보세요.",

  "-ing가 들어간 두 번째 보기예요.","right now → is + v-ing"],
 ["They (are coming / coming) today.","are coming","They are coming today.","그들은 오늘 올 것이다.",

  "be동사 are가 들어 있는 첫 번째 보기예요.","be동사 + v-ing (be 없이 -ing만 X)"],
 ["Laura, (are / were) you still watching TV?","are","Laura, are you still watching TV?","로라, 너는 아직도 TV를 보고 있니?",

  "1) 지금도 보고 있냐고 묻는 말이에요. still(아직도)이 힌트예요.  2) 지금 하는 일은 현재진행형이니까 be동사도 현재형이어야 해요. 주어는 you예요.",
  "a로 시작하는 3글자 be동사예요.","still(지금도) + you → are + v-ing"],
 ["He is talking with her (now / yesterday).","now","He is talking with her now.","그는 지금 그녀와 이야기하고 있다.",

  "1) 문장의 동사는 is talking이에요. 현재진행형(지금 ~하는 중)이에요.  2) 현재진행형과 어울리는 때를 나타내는 말을 골라요. yesterday(어제)는 과거예요.",

 ["I ___ my hair when my mom called me.","was combing","I was combing my hair when my mom called me.","엄마가 나를 불렀을 때 나는 머리를 빗고 있었다.",

 ["My brother ___ tennis at five o’clock yesterday.","was playing","My brother was playing tennis at five o’clock yesterday.","내 남동생은 어제 다섯 시에 테니스를 치고 있었다.",

WP(2,"C",[

  "본책 p.28 ‘진행형으로 쓰지 않는 동사’ 표 아래의 ‘단, 같은 동사가 동작을 나타내는 경우’ 설명(I am having dinner)을 보세요.",

  "첫 칸은 I로 시작하는 2글자, 둘째 칸은 s로 시작하는 8글자예요.","진행형 의문문 → Be동사 + 주어 + v-ing"],
 ["그들은 네가 전화했을 때 책을 읽고 있었다. (read)<br>They ___ a book when you called.","were reading","They were reading a book when you called.","그들은 네가 전화했을 때 책을 읽고 있었다.",

 ["지호는 월요일마다 헬스장에서 운동한다. (at / Mondays / the gym / exercises / on)<br>Jiho ___ .","exercises at the gym on Mondays","Jiho exercises at the gym on Mondays.","지호는 월요일마다 헬스장에서 운동한다.",

 ["엽서 일부: I ___ . I have visited many famous places and eaten at many good restaurants.<br>(도착한 이래로 많은 것들을 해왔다. do, many things, arrive)","have done many things since I arrived","I have done many things since I arrived.","나는 도착한 이래로 많은 것들을 해 왔어.",
  "본책 p.34 ‘계속’ POINT 1의 since 설명과 예문을 보세요.",
  "1) ‘도착한 이래로’는 그때부터 지금까지를 말해요.  2) 현재완료를 쓰고, since 뒤에는 기준이 되는 때(I arrived)가 와요. arrive(도착하다)는 과거형으로 써요.",
  "have + do의 p.p.(d로 시작하는 4글자) + many things, 그다음 since + I + arrive의 과거형이에요.","since + 과거 시점 → have + p.p. (계속)"],
 ["엽서 일부: Last night, I watched a soccer game at the stadium. Tomorrow, ___ the Sagrada Familia.<br>(나는 방문할 것이다. visit)","I will[am going to] visit","Tomorrow, I will visit the Sagrada Familia.","내일 나는 사그라다 파밀리아를 방문할 것이다.",
  "본책 p.26 ‘미래시제’ POINT 3의 will / be going to를 보세요.",
  "1) Tomorrow(내일)는 앞으로 올 때예요.  2) 앞으로의 일은 「will + 동사원형」이나 「be going to + 동사원형」으로 써요. 주어는 I예요.",
  "주어 I 뒤에 w로 시작하는 4글자 조동사(또는 am going to), 그다음 v로 시작하는 동사원형이에요.","tomorrow → will + 동사원형"]
]);

// ===== 내신 대비 실전문제 (pp.38-41) =====
C("NS","N",1,"빈칸에 들어갈 알맞은 말을 고르시오.<br>The earth ___ around the sun.",["① go","② goes","③ is going","④ was going","⑤ has gone"],"② goes","The earth goes around the sun.","지구는 태양 주위를 돈다.",
 "본책 p.26 ‘현재시제’ POINT 1에서 ‘변함없는 진리’ 예문을 보세요.",
 "1) 지구가 태양 주위를 도는 건 변함없는 사실이에요.  2) 변함없는 진리는 현재형으로 써요. 주어 The earth는 하나(3인칭 단수)라서 동사 모양을 확인해요.",
 "현재형이면서 3인칭 단수의 -es가 붙은 보기예요. 두 번째 보기예요.","변함없는 진리 → 현재형, 3인칭 단수");
C("NS","N",2,"빈칸에 들어갈 알맞은 말을 고르시오.<br>They ___ a marathon last month.",["① run","② runs","③ ran","④ will run","⑤ has run"],"③ ran","They ran a marathon last month.","그들은 지난달에 마라톤을 뛰었다.",
 "본책 p.26 ‘과거시제’ POINT 2의 박스(last ~)를 보세요.",
 "1) last month(지난달)는 과거예요.  2) 과거 표현에는 과거시제를 써요. run(달리다)은 불규칙 동사라서 -ed를 붙이지 않아요.",
 "r로 시작하는 3글자 과거형이에요. 세 번째 보기예요.","last month → 과거형 (run의 과거형은 ran)");
C("NS","N",3,"빈칸에 들어갈 알맞은 말을 고르시오.<br>My brother ___ a model airplane now.",["① built","② has built","③ was built","④ is building","⑤ was building"],"④ is building","My brother is building a model airplane now.","내 남동생은 지금 모형 비행기를 만들고 있다.",
 "본책 p.28 ‘현재진행형’ POINT 1의 「be동사의 현재형 + v-ing」를 보세요.",
 "1) now(지금)가 있어요. 지금 하고 있는 일이에요.  2) 지금 진행 중인 일은 현재진행형이에요. 주어 My brother는 한 명이라 is를 써요.",
 "is와 -ing가 함께 있는 네 번째 보기예요.","now → is + v-ing");
C("NS","N",4,"빈칸에 들어갈 알맞은 말을 고르시오.<br>___ the kids ever been to an art gallery?",["① Did","② Are","③ Will","④ Has","⑤ Have"],"⑤ Have","Have the kids ever been to an art gallery?","그 아이들은 미술관에 가 본 적이 있니?",
 "본책 p.34 ‘경험’ POINT 2와 p.30 ‘현재완료의 의문문’을 보세요.",
 "1) ever been to(가 본 적이 있다)는 경험을 나타내는 현재완료예요.  2) 의문문은 「Have/Has + 주어 + p.p. ~?」예요. 주어 the kids는 여럿이라서 Have/Has 중 알맞은 쪽을 골라요.",
 "h로 시작하는 4글자예요. 마지막 보기예요.","주어(복수) + been → Have + 주어 + p.p. ~?");
C("NS","N",5,"어법상 옳지 않은 것을 고르시오.",["① I haven’t decided yet.","② Jisu is knowing the boy.","③ He always wears contact lenses.","④ She ate sushi for lunch yesterday.","⑤ They have lived together for a year."],"② Jisu is knowing the boy.","Jisu knows the boy. (옳은 문장)","지수는 그 소년을 알고 있다.",
 "본책 p.28 ‘현재진행형’ 아래 ‘진행형으로 쓰지 않는 동사’ 표를 보세요.",
 "1) 보기마다 시제를 확인해요(현재완료, 현재, 과거 등).  2) know(알다)는 인지 동사예요. 인지를 나타내는 동사는 진행형으로 쓸 수 있을까요?",
 "‘~ing’ 모양이 들어 있는 보기가 하나뿐이에요. 두 번째 보기예요.","know(인지) → 진행형 X");
C("NS","N",6,"어법상 옳지 않은 것을 고르시오.",["① He has been to Italy in 2018.","② The plane is leaving in an hour.","③ Jenny is going to meet Jack later.","④ I have already brushed my teeth.","⑤ He irons his clothes every morning."],"① He has been to Italy in 2018.","He went to Italy in 2018. (옳은 문장)","그는 2018년에 이탈리아에 갔다.",
 "본책 p.32 ‘과거시제 vs. 현재완료’ 아래 박스(in + 연도는 현재완료와 쓰지 않는다)를 보세요.",
 "1) 현재완료(have been)가 쓰인 보기부터 확인해요.  2) 현재완료는 yesterday, last ~, ~ ago, in + 연도 같은 구체적인 과거 표현과 함께 쓰지 못해요.",
 "in 2018이 있는 첫 번째 보기예요.","in + 연도(과거) → 과거시제");
W("NS","N",7,"그녀는 전에 멕시코 음식을 먹어본 적이 없다. (never, eat)<br>She ___ Mexican food before.","has never eaten","She has never eaten Mexican food before.","그녀는 전에 멕시코 음식을 먹어본 적이 없다.",
 "본책 p.34 ‘경험’ POINT 2의 표현 목록(never, before)과 예문(I have never seen a dolphin before)을 보세요.",
 "1) ‘~한 적이 없다’는 경험을 나타내는 현재완료예요.  2) 주어 She는 한 명이라 has를 쓰고, never는 has와 p.p. 사이에 넣어요. eat(먹다)은 불규칙 동사예요(p.30 표 A-B-C형).",
 "has never 뒤에 e로 시작하는 5글자를 써요.","has + never + p.p. (경험)");
W("NS","N",8,"내가 초인종을 눌렀을 때 그는 설거지를 하고 있었다. (wash the dishes)<br>He ___ when I rang the doorbell.","was washing the dishes","He was washing the dishes when I rang the doorbell.","내가 초인종을 눌렀을 때 그는 설거지를 하고 있었다.",
 "본책 p.28 ‘과거진행형’ POINT 2의 「be동사의 과거형 + v-ing」를 보세요.",
 "1) when I rang(내가 눌렀을 때)은 과거의 한 순간이에요.  2) 그 순간에 ‘~하고 있었다’는 과거진행형이에요. 주어 He는 한 명이에요.",
 "w로 시작하는 3글자 be동사 + wash의 -ing형 + the dishes예요.","when I rang(과거 순간) → was + v-ing");
W("NS","N",9,"그들은 아직 문제에 대한 해답을 찾지 못했다. (find, a solution)<br>They ___ to the problem yet.","have not[haven’t] found a solution","They have not found a solution to the problem yet.","그들은 아직 그 문제에 대한 해결책을 찾지 못했다.",
 "본책 p.34 ‘완료: 막 ~했다’ POINT 3의 예문(They have not finished their work yet)을 보세요.",
 "1) ‘아직 ~하지 못했다’는 yet이 쓰인 완료의 현재완료 부정문이에요.  2) 주어 They는 여럿이라 have not + p.p.예요. find(찾다)는 불규칙 동사라서 -ed를 붙이지 않아요.",
 "have not(또는 haven’t) 뒤에 find의 p.p.(f로 시작하는 5글자)와 a solution을 써요.","have + not + p.p. + yet (완료)");
M("NS","N",10,"빈칸에 들어갈 말로 알맞은 것을 모두 고르시오.<br>The author wrote her bestselling novel ___ .",["① in 2010","② soon","③ next year","④ since 2012","⑤ two years ago"],["① in 2010","⑤ two years ago"],"The author wrote her bestselling novel in 2010 / two years ago.","그 작가는 2010년에 / 2년 전에 자신의 베스트셀러 소설을 썼다.",
 "본책 p.26 ‘과거시제’ POINT 2 아래 박스(yesterday, last ~, ~ ago, in + 연도)를 보세요.",
 "1) 동사 wrote(원형 write: 쓰다)는 과거시제예요.  2) 과거시제 문장에는 과거를 나타내는 표현이 어울려요. 미래 표현(soon, next year)과 ‘계속’ 표현(since)은 맞지 않아요.",
 "두 개를 골라요. 연도로 말한 것 하나, ‘~ 전에’로 말한 것 하나예요.","과거시제 + in 연도 / ~ ago");
C("NS","N",11,"밑줄 친 부분이 어법상 옳은 것은?",["① I <u>am having</u> a cat.","② <u>Did</u> you ever been to Paris?","③ He <u>was singing</u> a song now.","④ I <u>will eat</u> Chinese food yesterday.","⑤ She <u>was sleeping</u> when I called her."],"⑤ She <u>was sleeping</u> when I called her.","She was sleeping when I called her.","내가 그녀에게 전화했을 때 그녀는 자고 있었다.",
 "본책 p.28 ‘현재진행형·과거진행형’과 ‘진행형으로 쓰지 않는 동사’ 표, p.32 박스를 함께 보세요.",
 "1) ①은 have(가지다), ②는 ever been(경험), ③은 now(지금), ④는 yesterday(어제)와 시제가 맞는지 하나씩 따져요.  2) ⑤는 when I called(내가 전화했을 때)라는 과거의 한 때에 하던 일이에요.",
 "①~④는 모두 시제나 동사 모양이 틀렸어요. 마지막 보기예요.","now는 현재진행, when I called는 과거진행");
C("NS","N",12,"밑줄 친 부분과 쓰임이 같은 것을 고르시오.<br>Susie <u>has seen</u> that movie twice.",["① She <u>hasn’t finished</u> her soup yet.","② Ben <u>has never been</u> to Europe before.","③ Mary <u>has been</u> a teacher for thirty years.","④ We <u>have just completed</u> our group project.","⑤ We <u>have lived</u> in Madrid since 2022."],"② Ben <u>has never been</u> to Europe before.","Ben has never been to Europe before.","벤은 전에 유럽에 가 본 적이 없다.",
 "본책 p.34 ‘현재완료의 쓰임’ POINT 1~4(계속·경험·완료·결과)를 보세요.",
 "1) 밑줄 문장은 twice(두 번)가 있어서 ‘~한 적이 있다’는 경험이에요.  2) 보기에서 ever, never, before, once, ~ times 같은 경험 표현이 있는 것을 찾아요.",
 "never와 before가 함께 있는 두 번째 보기예요.","twice, never, before → 경험");
C("NS","N",13,"밑줄 친 부분과 쓰임이 같은 것을 고르시오.<br>They <u>have already eaten</u> lunch.",["① Irene <u>has never tried</u> a coconut before.","② He <u>has traveled</u> to Japan five times.","③ I <u>have just finished</u> my homework.","④ I <u>have always been</u> interested in science.","⑤ She <u>has left</u> for Hong Kong with her family."],"③ I <u>have just finished</u> my homework.","I have just finished my homework.","나는 방금 막 숙제를 끝냈다.",
 "본책 p.34 ‘완료: 막 ~했다’ POINT 3의 just, already, yet을 보세요.",
 "1) 밑줄 문장은 already(이미)가 있어서 막 끝난 일을 말하는 ‘완료’예요.  2) 보기에서 just, already, yet 같은 표현이 있는 것을 찾아요.",
 "just가 들어 있는 세 번째 보기예요.","already, just, yet → 완료");
W("NS","N",14,"다음은 Jaden과 Emily가 경험해 본 것을 나타낸 표이다. 표의 내용과 일치하도록 현재완료 문장을 완성하시오.<br>(표: fly a drone - Jaden O, Emily X / take a tennis lesson - Jaden O, Emily O)<br>Jaden ___ before, but Emily has not. Both Jaden and Emily ___ before.","has flown a drone / have taken a tennis lesson","Jaden has flown a drone before, but Emily has not. Both Jaden and Emily have taken a tennis lesson before.","제이든은 전에 드론을 날려 본 적이 있지만 에밀리는 그렇지 않다. 제이든과 에밀리는 둘 다 전에 테니스 강습을 받아 본 적이 있다.",
 "본책 p.34 ‘경험: ~한 적이 있다’ POINT 2와 p.30 ‘현재완료란?’의 have/has 표를 보세요.",
 "1) 표에서 드론은 Jaden만 O이고 Emily는 X예요. 테니스 강습은 둘 다 O예요.  2) 첫 빈칸 주어는 Jaden 한 명(has), 둘째 빈칸 주어는 Both(둘 다, have)예요. fly(날리다)는 fly–flew–flown, take는 take–took–taken이에요.",
 "첫 칸은 has + f로 시작하는 5글자 p.p. + a drone, 둘째 칸은 have + t로 시작하는 5글자 p.p. + a tennis lesson이에요.","한 명 → has + p.p. / 둘 다 → have + p.p.");
C("NS","N",15,"빈칸에 들어갈 말이 나머지 넷과 다른 것은?",["① I have been busy ___ a week.","② They have known each other ___ elementary school.","③ I have studied English ___ an hour.","④ My father has worked here ___ twenty years.","⑤ Mike has joined every club meeting ___ the past five months."],"② They have known each other ___ elementary school.","They have known each other since elementary school. (나머지는 for)","그들은 초등학교 때부터 서로 알고 지냈다.",
 "본책 p.34 ‘계속’ POINT 1 아래 박스(since + 기준 시점 / for + 기간)를 보세요.",
 "1) 각 문장에서 빈칸 뒤의 말이 기간인지 시점인지 따져 봐요(a week, an hour, twenty years, the past five months…).  2) 기간이면 for, 시점이면 since예요. 하나만 다른 걸 찾으면 돼요.",
 "초등학교 ‘때부터’처럼 시작한 때를 말하는 문장이 하나 있어요. 두 번째 보기예요.","since elementary school(시점) / for a week(기간)");
C("NS","N",16,"우리말을 영어로 바르게 옮긴 것은?<br>그녀는 매일 저녁 개를 산책시킨다.",["① She walks her dog every evening.","② She walked her dog every evening.","③ She is walking her dog every evening.","④ She has walked her dog every evening.","⑤ She was walking her dog every evening."],"① She walks her dog every evening.","She walks her dog every evening.","그녀는 매일 저녁 개를 산책시킨다.",
 "본책 p.26 ‘현재시제’ POINT 1의 ‘반복되는 일이나 습관’을 보세요.",
 "1) every evening(매일 저녁)은 반복되는 습관이에요.  2) 반복되는 일은 현재시제로 써요. 진행형이나 완료형은 지금 하는 중이거나 과거와 이어지는 일에 써요.",
 "동사에 -s만 붙은 가장 단순한 모양이에요. 첫 번째 보기예요.","every evening(습관) → 현재시제");
C("NS","N",17,"밑줄 친 부분이 어법상 옳지 않은 것은?",["① It <u>has snowed</u> since yesterday.","② Maria <u>has never been</u> abroad.","③ They <u>have moved</u> here last month.","④ His brother <u>has gone</u> to Europe.","⑤ <u>Have you watched</u> this musical before?"],"③ They <u>have moved</u> here last month.","They moved here last month.","그들은 지난달에 이곳으로 이사 왔다.",
 "본책 p.32 ‘과거시제 vs. 현재완료’ 아래 박스(last ~와 현재완료는 함께 쓰지 않는다)를 보세요.",
 "1) 모두 현재완료예요. 뒤에 붙은 시간 표현이 알맞은지 하나씩 봐요(since yesterday, never, last month, before…).  2) 현재완료는 last ~ 같은 구체적인 과거 표현과 쓸 수 없어요.",
 "last month가 있는 세 번째 보기예요.","last ~ + 현재완료 X → 과거시제");
C("NS","N",18,"밑줄 친 부분의 쓰임이 나머지 넷과 다른 것은?",["① George <u>is going to</u> the market now.","② My sister <u>is going to</u> help me.","③ It <u>is going to</u> rain all weekend.","④ He <u>is going to</u> go buy new earphones.","⑤ My favorite actor <u>is going to</u> join the cast."],"① George <u>is going to</u> the market now.","George is going to the market now.","조지는 지금 시장에 가고 있는 중이다.",
 "본책 p.26 ‘미래시제’ POINT 3의 「be going to + 동사원형」과 p.28 현재진행형을 보세요.",
 "1) is going to 뒤에 동사원형이 오면 ‘~할 것이다’(미래)이고, 장소가 오면 ‘~에 가는 중이다’예요.  2) 각 문장의 to 뒤에 무엇이 오는지 확인해요(the market, help, rain, go, join).",
 "to 뒤에 장소(the market)가 오고 now가 있는 보기예요. 첫 번째 보기예요.","be going to + 동사원형 = 미래 / + 장소 = 가는 중");
M("NS","N",19,"어법상 옳은 것을 모두 고르시오.",["① I <u>has gone</u> to the rock concert tomorrow.","② The Korean War <u>broke out</u> in 1950.","③ My mom <u>is believing</u> in me.","④ Roy <u>is flying</u> to Paris next week.","⑤ They <u>were swimming</u> in the lake at that time."],["② The Korean War <u>broke out</u> in 1950.","④ Roy <u>is flying</u> to Paris next week.","⑤ They <u>were swimming</u> in the lake at that time."],"② The Korean War broke out in 1950. / ④ Roy is flying to Paris next week. / ⑤ They were swimming in the lake at that time.","② 한국전쟁은 1950년에 발발했다. ④ 로이는 다음 주에 파리로 날아간다. ⑤ 그들은 그때 호수에서 수영하고 있었다.",
 "본책 p.26 ‘과거시제’, p.28 ‘진행형’(가까운 미래의 계획, 진행형으로 쓰지 않는 동사), p.30 현재완료 형태를 보세요.",
 "1) ①은 주어 I와 has가 맞는지, tomorrow(내일)와 현재완료가 어울리는지 봐요.  2) ③은 believe(믿다)가 진행형이 되는 동사인지 봐요. 나머지 세 개는 시간 표현과 시제가 맞아요.",
 "답은 세 개예요. ①과 ③은 틀렸어요. 과거 연도, 가까운 미래 계획, 그때의 진행이 맞는 보기를 골라요.","연도 → 과거 / next week → 현재진행형 가능");
W("NS","N",20,"( ) 안의 말을 이용하여 대화를 완성하시오.<br>A What was your brother doing when you left the house?<br>B He ___ when I left the house. (take a nap)","was taking a nap","He was taking a nap when I left the house.","A 네가 집을 나올 때 네 남동생은 뭘 하고 있었니? B 내가 집을 나올 때 그는 낮잠을 자고 있었어.",
 "본책 p.28 ‘과거진행형’ POINT 2의 「be동사의 과거형 + v-ing」를 보세요.",
 "1) 질문이 What was your brother doing ~?로 과거진행형이에요.  2) 대답도 과거진행형이에요. 주어 He는 한 명이에요.",
 "w로 시작하는 3글자 be동사 + take의 -ing형(e를 빼요) + a nap이에요.","take a nap → taking a nap (e 빼고 -ing)");
C("NS","N",21,"빈칸에 들어갈 말이 순서대로 짝지어진 것을 고르시오.<br>• They ___ to the amusement park a week ago.<br>• Tom ___ sick since last Sunday.",["① go — is","② went — was","③ has gone — was","④ went — has been","⑤ will go — has been"],"④ went — has been","They went to the amusement park a week ago. / Tom has been sick since last Sunday.","그들은 일주일 전에 놀이공원에 갔다. / 톰은 지난 일요일부터 아팠다.",
 "본책 p.32 ‘과거시제 vs. 현재완료’ 표와 p.34 ‘계속’ POINT 1을 보세요.",
 "1) 첫 문장은 a week ago(일주일 전)가 있으니 과거시제예요.  2) 둘째 문장은 since last Sunday(지난 일요일부터)가 있어서 지금까지 이어지는 계속의 현재완료예요.",
 "앞 칸은 go의 과거형, 뒤 칸은 has + be의 p.p.예요. 네 번째 보기예요.","~ ago → 과거 / since ~ → 현재완료");
C("NS","N",22,"빈칸에 들어갈 말이 순서대로 짝지어진 것을 고르시오.<br>My family ___ to Incheon last September. We have lived here ___ six months.",["① moves — for","② moved — for","③ moved — since","④ has moved — for","⑤ has moved — since"],"② moved — for","My family moved to Incheon last September. We have lived here for six months.","우리 가족은 지난 9월에 인천으로 이사했다. 우리는 여기서 6개월 동안 살아왔다.",
 "본책 p.32 ‘과거시제 vs. 현재완료’ 아래 박스와 p.34 ‘계속’ POINT 1 아래 박스를 보세요.",
 "1) 첫 빈칸 뒤에 last September(지난 9월)가 있어 과거시제예요.  2) 둘째 빈칸 뒤 six months(6개월)는 기간이에요. 기간 앞에 오는 말을 골라요.",
 "앞 칸은 move의 과거형(m으로 시작하는 5글자), 뒤 칸은 f로 시작하는 3글자예요.","last ~ → 과거 / for + 기간");
C("NS","N",23,"대화의 밑줄 친 부분이 어법상 옳지 않은 것은?<br>A I ① <u>haven’t seen</u> Sara in ages. I’m so excited to see her again.<br>B ② <u>When have you last seen</u> each other?<br>A The last time we saw each other ③ <u>was</u> five years ago.<br>B That’s a long time. Look, the train ④ <u>is arriving</u> soon. Let’s go to the platform. She ⑤ <u>will be happy</u> to see us.",["① haven’t seen","② When have you last seen","③ was","④ is arriving","⑤ will be happy"],"② When have you last seen","When did you last see each other?","언제 마지막으로 만났어?",
 "본책 p.32 ‘과거시제 vs. 현재완료’ 아래 박스(의문사 when은 현재완료와 쓰지 않는다)를 보세요.",
 "1) ①은 in ages(오랫동안)로 지금까지의 일, ③은 five years ago(5년 전)로 과거, ④는 soon의 가까운 미래, ⑤는 앞으로의 일이라 모두 맞아요.  2) ②에서 의문사 when과 현재완료를 같이 써도 되는지 따져 봐요.",
 "When으로 시작하는 두 번째 보기예요.","when + 현재완료 X → When did ~?");
W("NS","N",24,"현재완료를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>Henry sold his watch. He doesn’t have it now.<br>Henry ___ .","has sold his watch","Henry has sold his watch.","헨리는 시계를 팔았다(그래서 지금은 없다).",
 "본책 p.34 ‘결과: ~했다’ POINT 4의 예문(Someone has stolen my wallet)을 보세요.",
 "1) 시계를 판 일의 결과로 지금은 시계가 없어요.  2) 과거에 한 일이 지금까지 영향을 줄 때는 현재완료예요. 주어 Henry는 한 명이라 has를 써요. sell(팔다)은 불규칙 동사라서 -ed를 붙이지 않아요.",
 "has 뒤에 s로 시작하는 4글자와 his watch를 써요.","과거의 일 + 지금 없음 → has + p.p. (결과)");
W("NS","N",25,"현재완료를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>Gina went to Prague. She is still in Prague.<br>Gina ___ .","has gone to Prague","Gina has gone to Prague.","지나는 프라하에 가 버리고 없다.",
 "본책 p.34 하단 박스(have been to = 경험, have gone to = 결과)를 보세요.",
 "1) 지나는 프라하에 갔고 지금도 그곳에 있어요.  2) 가서 지금 여기 없다는 뜻은 have gone to로 써요. 주어 Gina는 한 명이라 has예요.",
 "has 뒤에 g로 시작하는 4글자와 to Prague를 써요.","가 버리고 없다 → has gone to");
C("NS","N",26,"다음 글을 읽고 질문에 답하시오.<br>Our lives (A) ___ a lot since the pandemic. Before the pandemic, we (B) ___ wear masks. But now we all (C) ___ masks all the time. They help protect us and other people from getting sick. Nowadays, 많은 사람들이 이 변화에 적응하고 있다.<br>위 글의 빈칸 (A)~(C)에 들어갈 말이 바르게 짝지어진 것은? (A / B / C)",["① changed – have to – wore","② changed – didn’t have to – wear","③ have changed – didn’t have to – wore","④ have changed – didn’t have to – wear","⑤ have changed – haven’t had to – wear"],"④ have changed – didn’t have to – wear","Our lives have changed a lot since the pandemic. Before the pandemic, we didn’t have to wear masks. But now we all wear masks all the time.","팬데믹 이후 우리의 삶은 많이 변했다. 팬데믹 이전에 우리는 마스크를 쓸 필요가 없었다. 그러나 이제 우리는 모두 항상 마스크를 쓴다.",
 "본책 p.32 ‘현재완료’(과거 vs. 현재완료)와 p.34 ‘계속’ POINT 1(since)을 보세요.",
 "1) (A) since the pandemic(팬데믹 이후)이 있으니 지금까지 이어지는 일이에요.  2) (B) Before the pandemic(팬데믹 이전)은 과거 표현이고, (C) now(지금)는 현재예요. 각 칸에 시제를 하나씩 맞춰요.",
 "(A)는 현재완료, (B)는 과거 시점의 ‘~할 필요가 없었다’, (C)는 현재형이에요. 네 번째 보기예요.","since ~ → 현재완료 / Before ~ → 과거 / now → 현재");
W("NS","N",27,"위 글의 밑줄 친 우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오. (many, adapt)<br>Nowadays, 많은 사람들이 이 변화에 적응하고 있다. → Nowadays, ___ to this change.","many people are adapting","Nowadays, many people are adapting to this change.","오늘날 많은 사람들이 이 변화에 적응하고 있다.",
 "본책 p.28 ‘현재진행형’ POINT 1의 ‘~하고 있다, ~하는 중이다’ 설명을 보세요.",
 "1) ‘적응하고 있다’는 지금 진행 중인 변화예요.  2) 현재진행형을 써요. many 다음에 명사 people(사람들)이 필요하고, 복수 주어라서 are를 써요.",
 "many 뒤에 ‘사람들’이라는 p로 시작하는 6글자 명사, 그다음 복수 be동사와 adapt의 -ing형이에요.","적응하고 있다 → are + v-ing");
C("NS","N",28,"어법상 옳은 것의 개수는?<br>• I am having dinner with my family.<br>• The kids are making some cookies.<br>• Water consists of hydrogen and oxygen.<br>• Jenny travels to Busan last summer.<br>• The concert starts at seven o’clock.",["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],"④ 4개","Jenny traveled to Busan last summer. (이것만 틀림)","제니는 지난여름에 부산으로 여행을 갔다.",
 "본책 p.26 ‘현재시제’·‘과거시제’, p.28 ‘진행형으로 쓰지 않는 동사’ 표를 보세요.",
 "1) 문장마다 시제와 시간 표현이 맞는지 하나씩 확인해요.  2) 첫 문장 have는 ‘먹다’(동작)라 진행형이 가능해요. 둘째는 지금 하는 일, 셋째는 변함없는 사실, 다섯째는 정해진 일정이에요.",
 "틀린 문장은 last summer(지난여름)가 있는 문장 하나뿐이에요. 5개 중 몇 개일까요?","last ~ → 과거시제 (travels X)");
W("NS","N",29,"우리말과 일치하도록 밑줄 친 부분을 바르게 고치시오.<br>우리 엄마는 차 키를 찾고 계신다.<br>My mom <u>looks for</u> her car key.","is looking for","My mom is looking for her car key.","우리 엄마는 차 키를 찾고 계신다.",
 "본책 p.28 ‘현재진행형’ POINT 1의 「be동사의 현재형 + v-ing」와 ‘~하고 있다’ 설명을 보세요.",
 "1) 우리말이 ‘찾고 계신다’로 지금 진행 중인 일이에요.  2) 현재진행형으로 고쳐요. 주어 My mom은 한 명이라 is를 써요. look for는 ‘찾다’예요.",
 "i로 시작하는 2글자 be동사 + look의 -ing형 + for예요.","~하고 계신다 → is + v-ing");
W("NS","N",30,"우리말과 일치하도록 밑줄 친 부분을 바르게 고치시오.<br>그들이 언제 여행에서 돌아왔니?<br>When <u>have they come back</u> from the trip?","did they come back","When did they come back from the trip?","그들은 언제 여행에서 돌아왔니?",
 "본책 p.32 ‘과거시제 vs. 현재완료’ 아래 박스(의문사 when은 현재완료와 쓰지 않는다)를 보세요.",
 "1) 의문사 When(언제)은 구체적인 과거를 묻는 말이에요.  2) when과는 현재완료를 쓰지 않고 과거시제 의문문 「did + 주어 + 동사원형」을 써요.",
 "d로 시작하는 3글자 조동사 뒤에 주어, 그다음 동사원형 come back 순서예요.","When have ~? X → When did + 주어 + 동사원형?");
W("NS","N",31,"우리말과 일치하도록 주어진 조건에 맞게 영작하시오.<br>너는 비빔밥을 먹어본 적이 있니?<br>조건: 완료형으로 쓸 것 / ever, eat, bibimbap을 이용할 것 / 총 5단어의 완전한 문장으로 쓸 것","Have you ever eaten bibimbap?","Have you ever eaten bibimbap?","너는 비빔밥을 먹어본 적이 있니?",
 "본책 p.34 ‘경험: ~한 적이 있다’ POINT 2의 예문(Have you ever tried Thai food?)을 보세요.",
 "1) ‘~한 적이 있니?’는 경험을 묻는 현재완료 의문문이에요.  2) 어순은 「Have + 주어 + ever + p.p. + 목적어 ~?」이에요. eat(먹다)은 불규칙 동사예요(p.30 표 A-B-C형).",
 "H로 시작하는 4글자 + you + ever + e로 시작하는 5글자 p.p. + bibimbap, 모두 5단어예요.","Have + you + ever + p.p. + 목적어?");
W("NS","N",32,"그림의 상황과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오. (have, a dog)<br>(그림: 10년 전(Ten years ago)에도 한 남자아이가 개를 안고 있고, 지금(Now)도 어른이 된 그가 그 개와 함께 산책하고 있어요.)<br>He ___ .","has had a dog for ten years","He has had a dog for ten years.","그는 10년 동안 개를 길러 왔다.",
 "본책 p.34 ‘계속’ POINT 1과 아래 박스(for + 기간)를 보세요.",
 "1) 10년 전에도 개와 함께였고 지금도 함께예요.  2) 과거부터 지금까지 계속되는 일은 현재완료예요. 주어 He는 한 명이라 has를 써요. 기간 ten years 앞에는 for를 써요.",
 "has 뒤에 have의 p.p.(h로 시작하는 3글자) + a dog, 그다음 기간 앞 전치사 + ten years예요.","10년 전부터 지금까지 → has + p.p. + for + 기간");

// ===== 문법정리노트 (p.42) =====
W("GN","G",1,"[현재시제 - 현재의 사실이나 상태]<br>The weather ___ nice today.","is","The weather is nice today.","오늘 날씨가 좋다.",
 "본책 p.26 ‘현재시제’ POINT 1의 첫 번째 예문(현재의 사실이나 상태)을 보세요.",
 "1) today(오늘)는 현재를 말해요.  2) 날씨는 지금의 상태예요. 주어 The weather는 하나라서 be동사의 현재형을 써요.",
 "i로 시작하는 2글자 be동사예요.","현재의 상태 → 현재형 (The weather is)");
W("GN","G",2,"[현재시제 - 반복되는 일이나 습관]<br>Jenny ___ every morning.","stretches","Jenny stretches every morning.","제니는 매일 아침 스트레칭을 한다.",
 "본책 p.26 ‘현재시제’ POINT 1의 ‘반복되는 일이나 습관’ 예문을 보세요.",
 "1) every morning(매일 아침)은 반복되는 습관이에요.  2) 현재형을 쓰고, 주어 Jenny는 한 명(3인칭 단수)이에요. stretch(스트레칭하다)처럼 -ch로 끝나는 동사는 -es를 붙여요.",
 "s로 시작하는 stretch에 -es를 붙인 9글자예요.","습관 → 현재형, -ch로 끝나면 -es");
W("GN","G",3,"[현재시제 - 변함없는 진리]<br>Water ___ at 0°C.","freezes","Water freezes at 0°C.","물은 0°C에서 언다.",
 "본책 p.26 ‘현재시제’ POINT 1의 ‘변함없는 진리’ 예문을 보세요.",
 "1) 물이 0°C에서 어는 건 변하지 않는 과학적 사실이에요.  2) 변함없는 진리는 현재형으로 써요. 주어 Water는 하나(3인칭 단수)예요.",
 "f로 시작하는 freeze(얼다)에 -s를 붙인 7글자예요.","변함없는 진리 → 현재형");
W("GN","G",4,"[과거시제]<br>I ___ to the zoo yesterday.","went","I went to the zoo yesterday.","나는 어제 동물원에 갔다.",
 "본책 p.26 ‘과거시제’ POINT 2의 첫 번째 예문(과거의 일)을 보세요.",
 "1) yesterday(어제)는 과거를 알려 줘요.  2) 과거의 일은 동사의 과거형으로 써요. go(가다)는 불규칙 동사예요.",
 "w로 시작하는 4글자예요.","yesterday → 과거형 (go의 과거형은 went)");
W("GN","G",5,"[미래시제]<br>He ___ (= is going to) buy a new car soon.","will","He will buy a new car soon.","그는 곧 새 차를 살 것이다.",
