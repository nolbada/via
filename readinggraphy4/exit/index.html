 / (B) 규칙","(A) 가장 나쁜 / (B) 규칙","(A) 가장 느린 / (B) 이야기"],"opts":["(A) best / (B) stories","(A) worst / (B) stories","(A) best / (B) rules","(A) worst / (B) rules","(A) slowest / (B) stories"],"r":{"a":"1) (A) best / (B) stories (가장 좋은 / 이야기)","ev":"11번 문장","s":[[11,"Lidar just might be the best way to find new stories from the human past.","라이다는 정말 인간의 과거에서 새로운 이야기를 찾는 가장 좋은 방법일지도 모른다."]],"w":"11번 문장: Lidar just might be the best way(가장 좋은 방법일지도 모른다) to find new stories(새로운 이야기) from the human past. worst(가장 나쁜), slowest(가장 느린), rules(규칙)는 본문과 맞지 않음.","c":1},"h":"61162c8f5f"},{"n":10,"t":"fill","q":"In the U.K., an archaeologist used Lidar data to find [A] roads hidden for [B].","ko":"영국에서는, 한 고고학자가 라이다 자료를 사용하여 수 [B] 동안 숨겨진 [A] 도로를 찾았다.","bko":{"Roman":"로마의","centuries":"세기","helicopter":"헬리콥터","sensor":"센서","trees":"나무들","laser":"레이저"},"bank":["Roman","centuries","helicopter","sensor","trees","laser"],"r":{"a":"[A] Roman (로마의), [B] centuries (세기)","ev":"10번 문장","s":[[10,"In the U.K., an archaeologist used Lidar data to find Roman roads hidden for centuries.","영국에서는, 한 고고학자가 라이다 자료를 사용하여 수 세기 동안 숨겨진 로마의 도로를 찾았다."]],"w":"10번 문장: an archaeologist used Lidar data to find Roman roads(로마의 도로) hidden for centuries(수 세기 동안). helicopter, sensor, trees, laser는 이 자리에 문법적으로나 의미상 맞지 않음.","c":null},"h":"fdeb187638"}]},{"u":12,"id":"rg4-12-3","no":3,"ko":"우리 몸속에도 좀비가 있다고?","items":[{"n":1,"t":"tf","q":"Aging cells keep dividing until they die.","ko":"노화 세포는 죽을 때까지 계속 분열한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Instead, they stop dividing but don’t die.","대신에 그것들은 분열하는 것을 멈추지만 죽지는 않는다."]],"w":"4번 문장에서 노화 세포는 분열하는 것을 멈추지만 죽지는 않는다(stop dividing but don’t die)고 함. 분열을 계속하다 죽는다는 말은 틀려서 F. 정상 세포가 분열하다가 죽음(3번).","c":"F"},"h":"716fb2e31e"},{"n":2,"t":"tf","q":"As we get older, zombie cells increase in our bodies.","ko":"나이가 들수록 우리 몸에서 좀비 세포가 증가한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"As we get older, these zombie cells increase and might become one of the reasons why we age.","우리가 나이 들수록, 이 좀비 세포들은 증가하고 우리가 늙게 되는 이유 중 하나가 될지도 모른다."]],"w":"6번 문장에 As we get older, these zombie cells increase라고 나옴. increase는 증가하다. 같은 내용이라 T.","c":"T"},"h":"f8533c84af"},{"n":3,"t":"tf","q":"Before, the method for removing aging cells was only tested on mice.","ko":"이전에는 노화 세포를 제거하는 방법이 쥐에게만 실험되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Before, this method was only tested on mice, but now they know it does work on humans, too.","이전에는, 이 방법이 쥐들에게만 실험되었지만, 이제 그들은 그것이 인간에게도 정말 효과가 있다는 것을 안다."]],"w":"8번 문장에 Before, this method was only tested on mice라고 나옴. was tested on은 ‘~에 시험되었다’. 이제는 인간에게도 효과가 있다고 알게 됨. 같은 내용이라 T.","c":"T"},"h":"6445313046"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Normal cells are supposed to grow, divide, and eventually die…)","ko":"정상 세포들은 자라서 분열하며 ( ) 죽게 되어 있다…","opts":["갑자기","결국","거의 안","빨리"],"word":"eventually","r":{"a":"2) 결국","ev":"3번 문장","s":[[3,"Normal cells are supposed to grow, divide, and eventually die, but aging cells, like zombies, don’t follow this rule.","정상 세포들은 자라서 분열하며 결국에는 죽게 되어 있지만, 노화 세포들은 좀비처럼 이 규칙을 따르지 않는다."]],"w":"3번에서 정상 세포가 grow(자라다), divide(분열하다) 뒤에 마지막으로 die(죽다)한다는 순서. eventually는 ‘결국’. 4번에서 노화 세포는 대신에 죽지 않는다고 하니, 정상 세포는 ‘결국 죽는다’는 대조임.","c":2},"h":"966d0b5dfc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They want to find out exactly where these cells are, what they’re doing, and how they can remove them effectively.)","ko":"그들은 이 세포들이 ( ) 어디에 있는지, 무엇을 하는지, 그리고 그것들을 어떻게 효과적으로 제거할 수 있는지를 알아내길 원한다.","opts":["위험하게","대충","정확히","느리게"],"word":"exactly","r":{"a":"3) 정확히","ev":"10번 문장","s":[[10,"They want to find out exactly where these cells are, what they’re doing, and how they can remove them effectively.","그들은 이 세포들이 정확히 어디에 있는지, 그것들이 무엇을 하는지와 그들이 그것들을 어떻게 효과적으로 제거할 수 있는지를 알아내길 원한다."]],"w":"10번에서 연구원들이 세포가 ‘정확히’ 어디에 있는지 알고 싶어 한다는 문맥. 9번에서 몸 전체의 지도를 만들고 있다는 말과도 이어짐. exactly는 ‘정확히’이고, 대충이면 지도를 만들 필요가 없음.","c":3},"h":"a3832168e9"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nYou might have heard of zombies, which seem dead but never die.","ko":"밑줄 친 which이 가리키는 것은?","sko":"당신은 좀비에 대해 들어봤을지도 모르는데, 그것들은 죽은 것처럼 보이지만 절대 죽지 않는다.","opts":["좀비","당신","우리 몸","노화 세포"],"pron":"which","r":{"a":"1) 좀비","ev":"1번 문장","s":[[1,"You might have heard of zombies, which seem dead but never die.","죽은 것처럼 보이지만 절대 죽지 않는 좀비에 대해 당신은 들어봤을지도 모른다."]],"w":"1번 문장: 죽은 것처럼 보이지만 절대 죽지 않는 것은 zombies(좀비). which 앞의 명사가 가리키는 대상.","c":1,"k":"which = 좀비"},"h":"9db34ad47d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Their goal is to help us stay healthier as we get older by understanding and managing these zombie cells better.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들의 목표는 이 좀비 세포들을 더 잘 이해하고 관리함으로써 우리가 나이 들수록 건강을 더 잘 유지하도록 돕는 것이다.","opts":["그들의 목표는 좀비 세포를 없애서 우리가 젊어지게 하는 것이다.","그들의 목표는 좀비 세포를 더 잘 이해하고 관리하여 나이 들수록 더 건강하게 지내도록 돕는 것이다.","그들의 목표는 좀비 세포를 만들어 나이 든 사람에게 주는 것이다.","그들의 목표는 좀비 세포의 이름을 새로 짓는 것이다."],"r":{"a":"2) 그들의 목표는 좀비 세포를 더 잘 이해하고 관리하여 나이 들수록 더 건강하게 지내도록 돕는 것이다.","ev":"11번 문장","s":[[11,"Their goal is to help us stay healthier as we get older by understanding and managing these zombie cells better.","그들의 목표는 이 좀비 세포들을 더 잘 이해하고 관리함으로써 우리가 나이 들수록 건강을 더 잘 유지하도록 돕는 것이다."]],"w":"11번의 Their goal is to help us stay healthier는 ‘우리가 더 건강하게 지내도록 돕는 것’이고, by understanding and managing(이해하고 관리함으로써)이 방법. 젊어지게 한다는 말은 없고, 세포를 만들어 주는 것은 반대임.","c":2},"h":"c8c48b720b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["노화 세포는 우리 몸 안에서 돌아다닌다.","노화 세포는 우리 몸 안의 한 곳에 머문다.","노화 세포는 우리 몸 밖에서만 산다.","노화 세포는 다리에서만 발견된다."],"opts":["Aging cells move around in our bodies.","Aging cells stay in one place in our bodies.","Aging cells only live outside our bodies.","Aging cells are found only in the legs."],"r":{"a":"1) Aging cells move around in our bodies. (노화 세포는 우리 몸 안에서 돌아다닌다.)","ev":"5번 문장","s":[[5,"They move around in our bodies.","그것들은 우리 몸 안에서 돌아다닌다."]],"w":"5번 문장: They(노화 세포)가 move   else if(it.opts){var g=el("div","opts");it.opts.forEach(function(t,i){var b=el("button","o");b.innerHTML="<i>"+(i+1)+"</i><span></span>";b.lastChild.textContent=t;b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===i+1));b.onclick=function(){setAns(p,it,i+1);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.t==="fill"){q.appendChild(el("p","bank","보기: "+it.bank.join(" / ")))}
  if(fin){var pk=(ans[p.id]||{})[it.n];if(it.t==="tf"){Array.prototype.forEach.call(q.querySelector(".tf").children,function(b){var v=b.textContent;if(v===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(v===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}else if(it.opts){Array.prototype.forEach.call(q.querySelector(".opts").children,function(b,i){if(i+1===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(i+1===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}}
  if(fin&&it.r){var rv=el("div","rv");
   var z1=el("div","zone z-tr");z1.appendChild(el("h4",null,"한글 해석"));
   function ln(l,t){var p2=el("p","ln");p2.appendChild(el("b",null,l));p2.appendChild(document.createTextNode(t));z1.appendChild(p2)}
   if(it.ko)ln("문제",it.ko);if(it.sko)ln("문장",it.sko);
   if(it.oko){var ol=el("ol");it.oko.forEach(function(x){ol.appendChild(el("li",null,x))});var lb=el("p","ln");lb.appendChild(el("b",null,"선택지"));z1.appendChild(lb);z1.appendChild(ol)}
   if(it.bko){var bl=el("p","ln");bl.appendChild(el("b",null,"보기 단어"));bl.appendChild(document.createTextNode(it.bank.map(function(w){return w+" "+(it.bko[w]||"")}).join(" / ")));z1.appendChild(bl)}
   if(z1.children.length>1)rv.appendChild(z1);
   var z2=el("div","zone z-an");z2.appendChild(el("h4",null,"정답 · 해설"));z2.appendChild(el("p","ra","정답: "+it.r.a));z2.appendChild(el("div","rl","교재 근거 ("+it.r.ev+")"));it.r.s.forEach(function(x){var d=el("div","rs");var e=el("span","en");e.appendChild(el("span","sn",x[0]+"번"));e.appendChild(document.createTextNode(x[1]));d.appendChild(e);d.appendChild(el("span","ko",x[2]));z2.appendChild(d)});z2.appendChild(el("div","rl","정리"));z2.appendChild(el("p","rw",it.r.w));rv.appendChild(z2);if(okm){rv.style.display="none";var tg=el("button","tgl","해설 보기");tg.onclick=function(){var s=rv.style.display==="none";rv.style.display=s?"block":"none";tg.textContent=s?"해설 닫기":"해설 보기"};q.appendChild(tg)}q.appendChild(rv)}
  box.appendChild(q)});
 v.appendChild(box);

function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
function showScore(p){var sb=document.getElementById("sbar");sb.innerHTML="";var d=done[p.id];var c=el("div","score");c.appendChild(el("span",null,readName(p)+" 점수"));c.appendChild(el("b",null,(d.s*10)+"점"));c.appendChild(el("span",null,d.s+" / 10 문항"));sb.style.display="block";sb.appendChild(c);sb.appendChild(navBar())}
boot();

  var t=document.createElement("div");t.className="top";
  t.innerHTML='<span class="tk">EXIT TEST</span><h1></h1><p class="sub">Reading별 10문항</p>';t.querySelector("h1").textContent=document.title.replace(/ Exit Test$/,"");v.appendChild(t);
  var last=null;
  P.forEach(function(p){
    if(p.u!==last){last=p.u;var g=document.createElement("div");g.className="grp";g.textContent=secName(p.u);v.appendChild(g)}
    var ok=ready(p.id);
    var r=document.createElement(ok?"a":"div");r.className="pk"+(ok?"":" lk");if(ok)r.href="?r="+encodeURIComponent(p.id);
    var l=document.createElement("div");var b=document.createElement("b");b.textContent=readName(p);var s=document.createElement("span");s.className="t";s.textContent=p.ko;l.appendChild(b);l.appendChild(s);r.appendChild(l);
    var st=document.createElement("span");st.className="st";st.textContent=ok?"응시 가능":"잠김";r.appendChild(st);v.appendChild(r)});
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("홈으로","../",true));v.appendChild(n)}
function gate(p){var v=document.getElementById("view");v.innerHTML="";v.appendChild(testHead(p));
  var g=document.createElement("div");g.className="gate";g.innerHTML="<b>아직 응시할 수 없어요</b><p>지문 읽기와 문제 선지를 모두 마친 뒤에 열려요.</p>";v.appendChild(g);
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("이 Reading으로 돌아가기","../?r="+encodeURIComponent(p.id),true));n.appendChild(lnk("Exit test 목록","./"));v.appendChild(n)}
function boot(){var m=/[?&]r=([^&]+)/.exec(location.search);
  if(m){var id=decodeURIComponent(m[1]);var p=P.filter(function(x){return x.id===id})[0];
    if(p){cur=id;if(!ready(id)){gate(p);return}view();return}}
  picker()}
