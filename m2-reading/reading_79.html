old! Maybe I can helps you,” said Angus.", "ko": "Angus는 Bruce가 발을 한 쪽씩 들어 올리고 있는 것을 보았다. “네 발이 춥구나! 아마도 내가 널 도와줄 수 있을 거야.”라고 Angus가 말했다.", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "are", "partial": false, "at": [11], "point": "주어와 동사의 수일치: 주어 Your feet는 복수라 are", "topic": "주어와 동사의 수일치", "memo": "주어 Your feet는 복수라 are"}, {"wrong": "helps", "right": "help", "partial": false, "at": [16], "point": "조동사 + 동사원형: 조동사 can 뒤에는 동사원형 help", "topic": "조동사 + 동사원형", "memo": "조동사 can 뒤에는 동사원형 help"}]}, {"n": 7, "tag": null, "en": "After the store closed for the night, Angus sat in front the sock machine. Soon, a tiny pair of socks popped out.", "ko": "가게가 밤에 문을 닫은 후, Angus는 양말 기계 앞에 앉았다. 곧 작은 양말 한 켤레가 튀어나왔다.", "ok": false, "foot": [], "fixes": [{"wrong": "front", "right": "front of", "partial": false, "at": [10], "point": "전치사구: in front of: ~ 앞에", "topic": "전치사구", "memo": "in front of: ~ 앞에"}]}, {"n": 8, "tag": null, "en": "Warm and soft winter socks with red stripes! Angus made more and more socks because he knew other sparrows was shaking in the cold weather, too.", "ko": "빨간 줄무늬가 있는 따뜻하고 부드러운 겨울 양말이었다! Angus는 다른 참새들도 추운 날씨에 떨고 있다는 것을 알았기 때문에 점점 더 많은 양말을 만들었다.", "ok": false, "foot": [], "fixes": [{"wrong": "was", "right": "were", "partial": false, "at": [19], "point": "주어와 동사의 수일치: 주어 other sparrows는 복수라 were", "topic": "주어와 동사의 수일치", "memo": "주어 other sparrows는 복수라 were"}]}, {"n": 9, "tag": null, "en": "But he didn't realize that he used up all the wool in the machine.", "ko": "그러나 그는 기계 안의 모든 털실을 다 써 버렸다는 것을 깨닫지 못했다.", "ok": true, "foot": [], "fixes": []}, {"n": 10, "tag": "사라진 털실", "en": "The next day, the sparrows were wearing warm something. They were wearing cute socks with red stripes!", "ko": "다음 날, 참새들은 뭔가 따뜻한 것을 신고 있었다. 그들은 빨간 줄무늬가 있는 귀여운 양말을 신고 있었다!", "ok": false, "foot": [], "fixes": [{"wrong": "warm something", "right": "something warm", "partial": false, "at": [7], "point": "-thing + 형용사: -thing은 형용사가 뒤에서 꾸밈", "topic": "-thing + 형용사", "memo": "-thing은 형용사가 뒤에서 꾸밈"}]}, {"n": 11, "tag": null, "en": "As soon as people see the socks, they hurried to the department store.", "ko": "사람들은 그 양말을 보자마자 백화점으로 급히 갔다.", "ok": false, "foot": [], "fixes": [{"wrong": "see", "right": "saw", "partial": false, "at": [4], "point": "과거 시제: hurried와 같은 과거 시제 saw", "topic": "과거 시제", "memo": "hurried와 같은 과거 시제 saw"}]}, {"n": 12, "tag": null, "en": "They asked, “We want the socks that the sparrows is wearing. Where can we buying them?” But they couldn't find the same socks anywhere.", "ko": "그들은 “우리는 참새들이 신고 있는 양말을 원해요. 그것을 어디에서 살 수 있나요?”라고 물었다. 하지만 그들은 어디에서도 똑같은 양말을 찾을 수 없었다.", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "are", "partial": false, "at": [9], "point": "주어와 동사의 수일치: 주어 the sparrows는 복수라 are", "topic": "주어와 동사의 수일치", "memo": "주어 the sparrows는 복수라 are"}, {"wrong": "buying", "right": "buy", "partial": false, "at": [14], "point": "조동사 + 동사원형: 조동사 can 뒤에는 동사원형 buy", "topic": "조동사 + 동사원형", "memo": "조동사 can 뒤에는 동사원형 buy"}]}, {"n": 13, "tag": null, "en": "At the same time in the sock store, Angus's father called Angus. “Son, something strange happened. Someone taked all of our wool.”", "ko": "같은 시간에 양말 가게에서는 Angus의 아버지가 Angus를 불렀다. “아들아, 이상한 일이 일어났단다. 누군가 우리 털실을 전부 가져갔어.”", "ok": false, "foot": [], "fixes": [{"wrong": "taked", "right": "took", "partial": false, "at": [17], "point": "불규칙동사의 과거형: take의 과거형은 took", "topic": "불규칙동사의 과거형", "memo": "take의 과거형은 took"}]}, {"n": 14, "tag": null, "en": "Angus honest said, “Sorry, I made socks for sparrows. They were shaking in the cold weather.” Bruce was listen silently in Angus's pocket.", "ko": "Angus는 솔직하게 말했다. “죄송해요, 제가 참새들을 위해 양말을 만들었어요. 그들은 추운 날씨에 떨고 있었어요.” Bruce는 Angus의 주머니 속에서 조용히 듣고 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "honest", "right": "honestly", "partial": false, "at": [1], "point": "부사: 동사 said를 꾸미는 부사 honestly", "topic": "부사", "memo": "동사 said를 꾸미는 부사 honestly"}, {"wrong": "listen", "right": "listening", "partial": false, "at": [18], "poi ther and said, “We need to return the socks.”", "잠시 후, Bruce는 다른 참새들을 모아 말했다. “우리는 양말을 돌려줘야 해.”", 0], ["“Do we have to?", "“우리가 그래야 하니?", 0], ["We like these socks,” said the other sparrows.", "우리는 이 양말이 좋은데.”라고 다른 참새들이 말했다.", 0], ["Bruce added, “Angus is in trouble because of our socks.", "Bruce가 덧붙였다. “Angus가 우리 양말 때문에 곤란해졌어.", 0], ["We should help him.”", "우리가 그를 도와줘야 해.”", 0], ["The sparrows agreed, “Alright then.”", "참새들은 동의했다. “그러면 알겠어.”", 0], ["The sparrows flew into the sock store and piled their socks on the table.", "참새들은 양말 가게로 날아들어가 그들의 양말을 탁자 위에 쌓았다.", 0], ["Knock, knock, knock.", "똑똑똑.", 0], ["Just then, people rushed into the store.", "바로 그때, 사람들이 서둘러 가게로 들어갔다.", 0], ["Someone said, “Finally! These are the socks that I want!”", "누군가 말했다. “드디어! 이것들이 내가 원하는 양말들이야!”", 0], ["The store was crowded with customers.", "가게는 손님들로 붐볐다.", 0], ["“Angus, your kind heart has come back to us as a great gift!” said his father.", "“Angus, 너의 친절한 마음이 우리에게 큰 선물로 돌아왔구나!”라고 그의 아버지가 말했다.", 0], ["Now the villagers are all wearing warm socks with red stripes.", "이제 마을 사람들은 모두 빨간 줄무늬가 있는 따뜻한 양말을 신고 있다.", 0], ["Oh, dogs and cats are, too!", "아, 개들과 고양이들 또한!", 0]];var RNUM=79;var TITLE_EN="Sparrow Socks";var PASS_EN=["Sparrow Socks", "Years ago, there lived a boy in a small village in Scotland. His name was Angus. A sparrow, Bruce, was his close friend. When they played together, Bruce flew into Angus's pocket. Angus's father owned a small store that made socks, and Angus sometimes helped him. The store used to have many customers, but recently it lost a lot of them. Villagers started buying socks from a big department store.", "A Cold Winter Morning", "One cold winter morning, Bruce and the other sparrows were in a tree. The tree was covered with snow. Angus saw Bruce raising his feet one by one. “Your feet are cold! Maybe I can help you,” said Angus. After the store closed for the night, Angus sat in front of the sock machine. Soon, a tiny pair of socks popped out. Warm and soft winter socks with red stripes! Angus made more and more socks because he knew other sparrows were shaking in the cold weather, too. But he didn't realize that he used up all the wool in the machine.", "The Missing Wool", "The next day, the sparrows were wearing something warm. They were wearing cute socks with red stripes! As soon as people saw the socks, they hurried to the department store. They asked, “We want the socks that the sparrows are wearing. Where can we buy them?” But they couldn't find the same socks anywhere. At the same time in the sock store, Angus's father called Angus. “Son, something strange happened. Someone took all of our wool.” Angus honestly said, “Sorry, I made socks for sparrows. They were shaking in the cold weather.” Bruce was listening silently in Angus's pocket.", "Returning the Socks", "After a while, Bruce brought the other sparrows together and said, “We need to return the socks.” “Do we have to? We like these socks,” said the other sparrows. Bruce added, “Angus is in trouble because of our socks. We should help him.” The sparrows agreed, “Alright then.” The sparrows flew into the sock store and piled their socks on the table. Knock, knock, knock. Just then, people rushed into the store. Someone said, “Finally! These are the socks that I want!” The store was crowded with customers. “Angus, your kind heart has come back to us as a great gift!” said his father. Now the villagers are all wearing warm socks with red stripes. Oh, dogs and cats are, too!"];var PASS_KO=["참새 양말", "여러 해 전, 스코틀랜드의 작은 마을에 한 소년이 살았다. 그의 이름은 Angus였다. 참새 Bruce는 그의 친한 친구였다. 그들이 함께 놀았을 때, Bruce는 Angus의 주머니 속으로 날아들었다. Angus의 아버지는 양말을 만드는 작은 가게를 소유했고, Angus는 가끔 그를 도왔다. 그 가게는 한때 손님이 많았지만, 최근에는 많은 손님을 잃었다. 마을 사람들이 큰 백화점에서 양말을 사기 시작했다.", "추운 겨울 아침", "어느 추운 겨울 아침, Bruce와 다른 참새들은 나무에 앉아 있었다. 나무는 눈으로 덮여 있었다. Angus는 Bruce가 발을 한 쪽씩 들어 올리고 있는 것을 보았다. “네 발이 춥구나! 아마도 내가 널 도와줄 수 있을 거야.”라고 Angus가 말했다. 가게가 밤에 문을 닫은 후, Angus는 양말 기계 앞에 앉았다. 곧 작은 양말 한 켤레가 튀어나왔다. 빨간 줄무늬가 있는 따뜻하고 부드러운 겨울 양말이었다! Angus는 다른 참새들도 추운 날씨에 떨고 있다는 것을 알았기 때문에 점점 더 많은 양말을 만들었다. 그러나 그는 기계 안의 모든 털실을 다 써 버렸다는 것을 깨닫지 못했다.", "사라진 털실", "다음 날, 참새들은 뭔가 따뜻한 것을 신고 있었다. 그들은 빨간 줄무늬가 있는 귀여운 양말을 신고 있었다! 사람들은 그 양말을 보자마자 백화점으로 급히 갔다. 그들은 “우리는 참새들이 신고 있는 양말을 원해요. 그것을 어디에서 살 수 있나요?”라고 물었다. 하지만 그들은 어디에서도 똑같은 양말을 찾을 수 없었다. 같은 시간에 양말 가게에서는 Angus의 아버지가 Angus를 불렀다. “아들아, 이상한 일이 일어났단다. 누군가 우리 털실을 전부 가져갔어.” Angus는 솔직하게 말했다. “죄송해요, 제가 참새들을 위해 양말을 만들었어요. 그들은 추운 날씨에 떨고 있었어요.” Bruce는 Angus의 주머니 속에서 조용히 듣고 있었다.", "양말 돌려주기", "잠시 후, Bruce는 다른 참새들을 모아 말했다. “우리는 양말을 돌려줘야 해.” “우리가 그래야 하니? 우리는 이 양말이 좋은데.”라고 다른 참새들이 말했다. Bruce가 덧붙였다. “Angus가 우리 양말 때문에 곤란해졌어. 우리가 그를 도와줘야 해.” 참새들은 동의했다. “그러면 알겠어.” 참새들은 양말 가게로 날아들어가 그들의 양말을 탁자 위에 쌓았다. 똑똑똑. 바로 그때, 사람들이 서둘러 가게로 들어갔다. 누군가 말했다. “드디어! 이것들이 내가 원하는 양말들이야!” 가게는 손님들로 붐볐다. “Angus, 너의 친절한 마음이 우리에게 큰 선물로 돌아왔구나!”라고 그의 아버지가 말했다. 이제 마을 사람들은 모두 빨간 줄무늬가 있는 따뜻한 양말을 신고 있다. 아, 개들과 고양이들 또한!"];var BG=[{"qs": [{"n": 6, "q": "윗글의 내용과 일치하는 것은?", "o": ["Bruce and the other sparrows were on the ground.", "The tree was covered with snow.", "Angus made socks before the store closed.", "Angus stopped making socks after one pair.", "Angus knew that there was a lot of wool left."], "a": 1, "ans": "The tree was covered with snow.", "ko": ["Bruce와 다른 참새들은 땅 위에 있었다.", "나무는 눈으로 덮여 있었다.", "Angus는 가게가 문을 닫기 전에 양말을 만들었다.", "Angus는 한 켤레를 만든 뒤 양말 만들기를 멈췄다.", "Angus는 털실이 많이 남아 있다는 것을 알았다."], "evs": [["The tree was covered with snow.", "나무는 눈으로 덮여 있었다."]], "ow": ["오답 ✕ — 'Bruce and the other sparrows were in a tree.'(Bruce와 다른 참새들은 나무에 앉아 있었다.)라고 했다.", "정답 ○ — 'The tree was covered with snow.'(나무는 눈으로 덮여 있었다.)와 일치한다.", "오답 ✕ — 'After the store closed for the night'(가게가 밤에 문을 닫은 후)에 양말을 만들었다.", "오답 ✕ — 'Angus made more and more socks'(점점 더 많은 양말을 만들었다)라고 했다.", "오답 ✕ — 'he didn’t realize that he used up all the wool'(털실을 다 써 버린 것을 깨닫지 못했다)이라고 했다."], "memo": ["정답 ②: 나무는 눈으로 덮여 있었다.", "근거: The tree was covered with snow.(나무는 눈으로 덮여 있었다.)", "함정: 가게가 문을 닫은 '후'에 만들었고, 털실을 다 쓴 줄 몰랐음 ✕"], "why": "나무가 눈으로 덮여 있었 ocks because he knew other sparrows were shaking in the cold weather, too.", "Angus는 다른 참새들도 추운 날씨에 떨고 있다는 것을 알았기 때문에 점점 더 많은 양말을 만들었다."], ["But he didn't realize that he used up all the wool in the machine.", "그러나 그는 기계 안의 모든 털실을 다 써 버렸다는 것을 깨닫지 못했다."]]}, {"qs": [{"n": 8, "q": "윗글의 밑줄 친 that과 용법이 같은 것은?   We want the socks that the sparrows are wearing.", "o": ["We saw the stars that were shining in the sky.", "I like the boy that is wearing a red cap.", "This is the computer that is very fast.", "The food that he ordered was fried chicken.", "He has a dog that has a long tail."], "a": 3, "ans": "The food that he ordered was fried chicken.", "ko": ["우리는 하늘에서 빛나고 있는 별들을 보았다.", "나는 빨간 모자를 쓰고 있는 소년이 좋다.", "이것은 매우 빠른 컴퓨터이다.", "그가 주문한 음식은 프라이드치킨이었다.", "그는 꼬리가 긴 개를 가지고 있다."], "evs": [["We want the socks that the sparrows are wearing.", "우리는 참새들이 신고 있는 양말을 원해요."]], "ow": ["오답 ✕ — that 바로 뒤에 동사 were가 와서 that이 주어 역할을 하는 주격 관계대명사이다.", "오답 ✕ — that 바로 뒤에 동사 is가 와서 주격 관계대명사이다.", "오답 ✕ — that 바로 뒤에 동사 is가 와서 주격 관계대명사이다.", "정답 ○ — 'that he ordered'에서 that 뒤에 주어(he)가 오고 ordered의 목적어가 빠져 있으므로 목적격 관계대명사이다. 본문 'that the sparrows are wearing'도 같은 쓰임이다.", "오답 ✕ — that 바로 뒤에 동사 has가 와서 주격 관계대명사이다."], "memo": ["정답 ④: The food that he ordered ... (목적격 관계대명사)", "근거: that the sparrows are wearing → that 뒤에 주어(the sparrows) + 동사, wearing의 목적어가 빠짐", "팁: that 바로 뒤에 동사가 오면 주격, 주어 + 동사가 오면 목적격"], "why": "본문의 that은 목적격 관계대명사로 that 뒤에 주어가 이어진다.", "ev": ["We want the socks that the sparrows are wearing.", "우리는 참새들이 신고 있는 양말을 원해요."]}], "pp": [["The Missing Wool", "사라진 털실"], ["The next day, the sparrows were wearing something warm.", "다음 날, 참새들은 뭔가 따뜻한 것을 신고 있었다."], ["They were wearing cute socks with red stripes!", "그들은 빨간 줄무늬가 있는 귀여운 양말을 신고 있었다!"], ["As soon as people saw the socks, they hurried to the department store.", "사람들은 그 양말을 보자마자 백화점으로 급히 갔다."], ["They asked, “We want the socks that the sparrows are wearing.", "그들은 “우리는 참새들이 신고 있는 양말을 원해요."], ["Where can we buy them?”", "그것을 어디에서 살 수 있나요?  h+='<div class="rl">총 학습 시간 '+fmtT(TM.act)+'</div>';

 }
 h+='<div style="margin-top:14px"><a href="./" style="display:inline-block;background:var(--pri);color:#fff;text-decoration:none;font-weight:700;padding:9px 20px;border-radius:8px">M1 Reading 목록으로</a></div>';
 return h+'</div>';

function lognote(q){var n=q.note;wlog('s','2단계 · 요약문 완성',[{n:q.dn,a:'정답 '+CN[q.a]+' '+q.ans,m:[n.en,n.ko].concat(n.words.map(function(w){return w[0]+' = '+w[1]}))}])}
function pickOpt(n,j){var q=qById(n),st=qst[n];if(!st||st.ok)return;if(!st.t1)st.t1=Date.now();
 if(j===q.a){st.ok=1;if(q.note)lognote(q);}
 else if(st.w.indexOf(j)<0){st.w.push(j);st.ok=1;if(q.note)lognote(q)}

}
function advQ(n){var st=qst[n];if(!st||st.adv)return;st.adv=1;if(allAdv()){tmFlush();TM.done=1}
 render();var ix=QL.indexOf(qById(n)),nx=ix<QL.length-1?QL[ix+1]:null,el=nx?document.getElementById('q'+nx.n):document.querySelector('.res');
 if(el){var ty=el.getBoundingClientRect().top+window.pageYOffset-8;window.scrollTo(0,ty);setTimeout(function(){window.scrollTo(0,el.getBoundingClientRect().top+window.pageYOffset-8)},60)}

document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){var sb=+b.dataset.sub;s1t[sb]=Date.now()-mark;mark=Date.now();done[sb]=true;render();
  var fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(aDone())save(fo);
  var gs=document.querySelectorAll('section.grp');if(gs[sb])gs[sb].scrollIntoView({behavior:'smooth',block:'start'});return}
 var jb=e.target.closest('button[data-jump]');if(jb){var jt=document.getElementById(jb.dataset.jump);if(jt)jt.scrollIntoView({behavior:'smooth',block:'start'});return}
 var gb=e.target.closest('button[data-go]');if(gb){qgo=1;render();var sts=document.querySelectorAll('.stage');if(sts[1])sts[1].scrollIntoView({behavior:'smooth',block:'start'});return}
 var o=e.target.closest('.opt[data-q]');if(o){pickOpt(+o.dataset.q,+o.dataset.o);return}
 var nx=e.target.closest('button[data-next]');if(nx){advQ(+nx.dataset.next);return}
 var wr=e.target.closest('button[data-wrote]');if(wr){var qn=+wr.dataset.wrote;qst[qn].wrote=1;advQ(qn);return}
 var ck=e.target.closest('button[data-chk]');if(ck){chk=chk?0:1;var y2=window.scrollY;render();window.scrollTo(0,y2);return}
});
function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){if(window.__bsR)return;try{var any=Object.keys(sel).length||Object.keys(qst).length||Object.keys(done).length;
 if(any)localStorage.setItem(PK,JSON.stringify({v:2,sel:sel,done:done,qst:qst,chk:chk,s1t:s1t,tm:TM,go:qgo}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+(allAdv()?1:0);var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');
 if(n>=2){rs[RNUM]={p:Math.round(fcount()*100/QL.length),ok:1,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}
 localStorage.setItem('m2-res',JSON.stringify(rs));
 if(any){st[RNUM]=(n>=2?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none';
 try{if(any)BSYNC(RNUM,JSON.parse(localStorage.getItem(PK)),n>=2?3:n,n>=2)}catch(e){}}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv&&sv.v===2){sel=sv.sel||{};done=sv.done||{};qst=sv.qst||{};qgo=sv.go||0;if(!qgo&&Object.keys(qst).length)qgo=1;chk=sv.chk||0;s1t=sv.s1t||{};if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}}}catch(e){}
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}try{BSYNC(RNUM,null,0,true)}catch(x){}sel={};done={};qst={};chk=0;s1t={};qgo=0;mark=Date.now();TM={act:0,lv:0,lt:0,done:0};_last=Date.now();render();window.scrollTo(0,0)}}});
