awater samples.","아라온호 덕분에 저는 바닷물 표본을 채집할 수 있습니다.",0],["The Arctic Ocean has the answers to the climate crisis.","북극해는 기후 위기에 대한 해답을 가지고 있습니다.",0],["I hope that my work can help the Earth.","저는 제 일이 지구를 도울 수 있기를 바랍니다.",0]];var RNUM=59;var TITLE_EN="Joys of Working in Nature";var PASS_EN=["Joys of Working in Nature","Some people love to work in nature. They work in the sea, mountains, or even in the Arctic. Let’s meet them and listen to their stories.","I am Nari. I am a haenyeo in Geoje. I dive in the water and collect seafood. In the morning, I check the tide and the weather. I wear a diving suit and swimming glasses to work in the water. I love diving and spending time in the beautiful sea. I don’t collect too much seafood. This is good for the ocean. These days, I see a lot of trash in the water, so I pick up the trash. I believe that we should care about the ocean.","My name is Jihan. I am a vet at the wild animal care center in Jirisan. I take care of sick wild animals in the center and send them back to their homes. Also, I often climb the mountain to look after wild animals like bears. I’m proud of my job. I think that protecting wild animals is important. We should keep an eye on them and their homes to live together.","My name is Eun, and I am an Arctic scientist. I work at the Arctic Dasan Station in Norway. I study the soil, seawater, and ice in the Arctic. I often travel on the special ship, Araon. This ship is stronger than other ships. It can break thick ice across the ocean. Thanks to Araon, I can collect seawater samples. The Arctic Ocean has the answers to the climate crisis. I hope that my work can help the Earth."];var PASS_KO=["자연에서 일하는 즐거움","어떤 사람들은 자연에서 일하는 것을 아주 좋아한다. 그들은 바다, 산, 심지어 북극에서도 일한다. 그들을 만나 보고 그들의 이야기를 들어 보자.","저는 나리입니다. 저는 거제의 해녀입니다. 저는 물에 잠수해서 해산물을 채집합니다. 아침에, 저는 조수와 날씨를 확인합니다. 저는 물속에서 일하기 위해 잠수복을 입고 수경을 씁니다. 저는 잠수하는 것과 아름다운 바다에서 시간을 보내는 것을 아주 좋아합니다. 저는 너무 많은 해산물을 채집하지 않습니다. 이것이 바다에 좋습니다. 요즘은 물속에 쓰레기가 많이 보여서 쓰레기를 줍습니다. 저는 우리가 바다에 신
