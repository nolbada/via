 없었습니다.",0],["Tetan regretted everything and said to Boka, \"I am sorry.","Tetan은 모든 것을 후회하며 Boka에게 \"미안해요.",0],["I was foolish.","내가 어리석었어요.",0],["From now on, I will work hard, too.","이제부터는 나도 열심히 일할게요.",0],["I will also share things with you fairly.\"","그리고 당신과 공평하게 물건도 나눌게요.\"라고 말했습니다.",0]];var RNUM=38;var TITLE_EN="Half and Half";var PASS_EN=["Half and Half","Tetan Buri and Boka Buri lived next to each other. They were very poor. One day, Tetan said to Boka, \"Why don't we share things and live together? We will be happy.\"","\"Hmm, that's a good idea,\" said Boka.","They had one blanket, one cow, and one mango tree. Tetan set the sharing rules. She said to Boka, \"You can have the blanket during the day, and I will have it at night. For the cow, you can have the front half, and I will have the back half. For the mango tree, you can have the bottom half, and I will have the top half.\"","Boka agreed to all the rules. However, before long, she became very unhappy. She was cold during the night, but Tetan slept well under the warm blanket. She fed the cow all day, but Tetan got milk from the back half. She watered the tree every day, but Tetan ate all the mangoes from the top half.","Boka got tired and hungry, so she went to the village chief for help. He said, \"Soak the blanket and give it to Tetan. Don't feed the cow. Then, cut the tree in half.\"","Boka listened to him. Tetan couldn't sleep well during the night. She also couldn't go near the angry cow. She couldn't eat mangoes anymore. Tetan regretted everything and said to Boka, \"I am sorry. I was foolish. From now on, I will work hard, too. I will also share things with you fairly.\""];var PASS_KO=["반반으로","Tetan Buri와 Boka Buri는 서로 이웃에 살았습니다. 그들은 매우 가난했습니다. 어느 날 Tetan이 Boka에게 \"우리 물건을 나누고 함께 살면 어떨까요? 그럼 행복할 거예요.\"라고 말했습니다.","\"흠, 좋은 생각이네요.\"라고 Boka가 말했습니다.","그들에게는 담요 한 장, 소 한 마리, 망고나무 한 그루가 있었습니다. Tetan이 공유 규칙을 정했습니다. 그녀는 Boka에게 \"담요는 낮 동안에는 당신이 가져도 되고, 밤에는 내가 가질게요. 소는 앞쪽 반은 당신이 가져도 되고, 뒤쪽 반은 내가 가질게요. 망고나무는 당신이 아래쪽 반을 가지고 내가 위쪽 반을 가질게요.\"라고 말했습니다.","Boka는 모든 규칙에 동의했습니다. 그러나 얼마 지나지 않아, 그녀는 매우 불행해졌습니다. 그녀는 밤에 추웠지만, Tetan은 따뜻한 담요 아래에서 잘 잤습니다. 그녀는 하루 종일 소에게 먹이를 주었지만, Tetan은 소의 뒤쪽 반에서 우유를 얻었습니다. 그녀는 매일 나무에 물을 주었지만, Tetan은 위쪽 반의 망고를 모두 먹었습니다.","Boka는 피곤하고 배가 고파져서 도움을 청하러 마을 촌장에게 갔습니다. 그는 \"담요를 적셔서 Tetan에게 주게. 소에게는 먹이를 주지 말게. 그러고 나무를 반으로 자르게.\"라고 말했습니다.","Boka는 그의 말을 들었습니다. Tetan은 밤에 잠을 잘 수 없었습니다. 그녀는 성난 소 근처에도 갈 수 없었습니다. 망고도 더 이상 먹을 수 없었습니다. Tetan은 모든 것을 후회하며 Boka에게 \"미안해요. 내가 어리석었어요. 이제부터는 나도 열심히 일할게요. 그리고 당신과 공평하게 물건도 나눌게요.\"라고 말했습니다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["Kate was not at the park yesterday.","Kate saw Seojun and his friends at the park.","Seojun walked his dog at the park yesterday.","Kate and her friends went skateboarding at the park.","Seojun and his friends played soccer at the park."],"a":1,"ans":"Kate saw Seojun and his friends at the park.","evs":[["G: Hi, Seojun! I saw you with your friends yesterday at the park.","안녕, 서준아! 어제 공원에서 친구들과 같이 있는 걸 봤어."],["G: Yes, I walked my dog there.","응, 거기서 내 강아지를 산책시켰어."]],"ev":["G: Hi, Seojun! I saw you with your friends yesterday at the park.","안녕, 서준아! 어제 공원에서 친구들과 같이 있는 걸 봤어."],"ow":["오답 ✕ — 케이트는 'Yes, I walked my dog there.'(응, 거기서 내 강아지를 산책시켰어.)라고 했으므로 어제 공원에 있었다. 보기는 반대로 말해서 틀림.","정답 ○ — 케이트가 'I saw you with your friends yesterday at the park.'(어제 공원에서 친구들과 같이 있는 걸 봤어.)라고 했으므로 케이트는 공원에서 서준이와 친구들을 보았다.","오답 ✕ — 강아지를 산책시킨 사람은 서준이가 아니라 케이트다. 'Yes, I walked my dog there.'는 케이트의 말이다.","오답 ✕ — 스케이트보드를 탄 것은 서준이와 친구들이다. 'We went skateboarding.'(우리는 스케이트보드를 타러 갔어.)는 서준이의 말이고, 케이트는 강아지를 산책시켰다.","오답 ✕ — 서준이는 'We went skateboarding.'(우리는 스케이트보드를 타러 갔어.)라고 했다. 축구에 대한 언급은 없다."],"memo":["정답 ②: 케이트는 공원에서 서준이와 친구들을 봤다.","근거: I saw you with your friends yesterday at the park.(어제 공원에서 친구들과 같이 있는 걸 봤어.)","함정: ③ 강아지를 산책시킨 사람은 서준이가 아니라 케이트 ✕"],"why":"케이트가 어제 공원에서 서준이와 친구들을 보았다."},{"n":2,"q":"What did Kate do at the park yesterday?","o":["She skateboarded with her friends.","She watched Seojun on his skateboa  ✕ — 치즈를 만든 것은 할아버지 농장에서이다. 'We milked some cows and made cheese.'(소젖을 짜고 치즈를 만들었어.)라고 했고, 집에서 형제와 만든다는 말은 없다.","오답 ✕ — 캠핑 이야기는 이 대화에 나오지 않는다. 가장 가까운 문장은 'I visited my grandfather's farm with my family.'(가족과 함께 할아버지 농장에 갔어.)이다."],"memo":["정답 ③: 지호는 다음 달에 할아버지를 다시 찾아가 감자를 심을 것이다.","근거: I will visit him again next month and plant potatoes.(다음 달에 할아버지를 다시 찾아뵙고 감자를 심을 거야.)","함정: ② 소젖 짜기·치즈 만들기는 지난 주말에 한 일(과거)이다. ✕"],"why":"지호는 다음 달에 할아버지 농장에 다시 가서 감자를 심을 계획이다."}],"dlg":[["B","Hi, Emily, how was your weekend?","안녕, 에밀리, 주말 어땠어?"],["G","It was good. I played board games with my brother. What about you, Jiho?","좋았어. 오빠(남동생)랑 보드게임을 했어. 너는 어때, 지호야?"],["B","I visited my grandfather's farm with my family.","나는 가족과 함께 할아버지 농장에 갔어."],["G","That sounds interesting. What did you do there?","재미있겠다. 거기서 뭐 했어?"],["B","We milked some cows and made cheese. It was so much fun! I will visit him again next month and plant potatoes. You can join us.","우리는 소젖을 짜고 치즈를 만들었어. 정말 재미있었어! 나는 다음 달에 할아버지를 다시 찾아뵙고 감자를 심을 거야. 너도 같이 가도 돼."],["G","Can I? Thanks!","그래도 돼? 고마워!"]]},{"qs":[{"n":5,"q":"Why was Julie's day not good?","o":["Because she broke the glass window.","Because she sat on a friend's glasses.","Because her friend broke her glasses.","Because she broke her own glasses.","Because her dad is always upset with her."],"a":3,"ans":"Because she broke her own glasses.","evs":[["G: Dad, it was not good. I sat on my glasses and broke them.","아빠, 좋지 않았어요. 제 안경 위에 앉아서 부러뜨렸어요."],["M: Again? This is the second time.","또? 이번이 두 번째구나."]],"ev":["G: Dad, it was not good. I sat on my glasses and broke them.","아빠, 좋지 않았어요. 제 안경 위에 앉아서 부러뜨렸어요."],"ow":["오답 ✕ — 'I sat on my glasses and broke them.'(제 안경 위에 앉아서 부러뜨렸어요.)라고 했으므로 깨진 것은 유리창이 아니라 안경이다.","오답 ✕ — Julie는 친구의 안경이 아니라 'my glasses'(내 안경)에 앉았다. 친구는 대화에 나오지 않는다.","오답 ✕ — 안경을 부러뜨린 것은 친구가 아니라 Julie 자신이다. 'I sat on my glasses and broke them.'","정답 ○ — Julie는 'I sat on my glasses and broke them.'(제 안경 위에 앉아서 부러뜨렸어요.)라고 말했으므로 자기 안경을 망가뜨려서 하루가 좋지 않았다.","오답 ✕ — 아빠는 'Again? This is the second time.'(또? 이번이 두 번째구나.)이라고 놀랐을 뿐, 항상 화가 나 있다는 말은 없고, 하루가 나빴던 이유도 아니다."],"memo":["정답 ④: Julie가 자기 안경을 깔고 앉아 부러뜨렸다.","근거: I sat on my glasses and broke them.(제 안경 위에 앉아서 부러뜨렸어요.)","함정: ③ 친구가 아니라 Julie 본인이 망가뜨렸다 ✕"],"why":"Julie는 자기 안경 위에 앉아서 부러뜨려 하루가 좋지 않았다."}],"dlg":[["M","Hi, Julie. How was your day?","안녕, Julie. 오늘 하루 어땠니?"],["G","Dad, it was not good. I sat on my glasses and broke them.","아빠, 좋지 않았어요. 제 안경 위에 앉아서 부러뜨렸어요."],["M","Again? This is the second time.","또? 이번이 두 번째구나."],["G","Sorry, Dad. I'll be careful from now on.","죄송해요, 아빠. 이제부터 조심할게요."]]}];var BG=[{"qs":[{"n":6,"q":"Tetan이 정한 공유 규칙으로 알맞은 것은?","o":["담요는 낮에는 Tetan이, 밤에는 Boka가 가진다.","소는 앞쪽 반은 Boka가, 뒤쪽 반은 Tetan이 가진다.","망고나무는 아래쪽 반은 Tetan이, 위쪽 반은 Boka가 가진다.","망고는 모두 Boka가 가진다.","소는 낮에는 Boka가, 밤에는 Tetan이 돌본다."],"a":1,"ans":"소는 앞쪽 반은 Boka가, 뒤쪽 반은 Tetan이 가진다.","evs":[["For the cow, you can have the front half, and I will have the back half.","소는 앞쪽 반은 당신이 가져도 되고, 뒤쪽 반은 내가 가질게요."]],"ev":["For the cow, you can have the front half, and I will have the back half.","소는 앞쪽 반은 당신이 가져도 되고, 뒤쪽 반은 내가 가질게요."],"ow":["오답 ✕ — 본문에는 'You can have the blanket during the day, and I will have it at night.'(담요는 낮에는 당신이, 밤에는 내가 가질게요.)라고 했다. 이 보기는 낮과 밤이 바뀌어서 틀림.","정답 ○ — Tetan이 'For the cow, you can have the front half, and I will have the back half.'(소는 앞쪽 반은 당신이, 뒤쪽 반은 내가 가질게요.)라고 했다. Boka가 앞쪽, Tetan이 뒤쪽이다.","오답 ✕ — 'For the mango tree, you can have the bottom half, and I will have the top half.'(망고나무는 당신이 아래쪽 반, 내가 위쪽 반을 가질게요.)라고 했다. 이 보기는 위아래가 반대라서 틀림.","오답 ✕ — 망고나무도 'you can have the bottom half, and I will have the top half'(당신은 아래쪽 반, 나는 위쪽 반)으로 나누었다. 모두 Boka의 것이 아니다.","오답 ✕ — 소는 시간이 아니라 몸의 앞쪽/뒤쪽 반으로 나누었다. 'you can have the front half, and I will have the back half'라고 했다."],"memo":["정답 ②: 소는 앞쪽 반은 Boka, 뒤쪽 반은 Tetan이 가진다.","근거: For the cow, you can have the front half, and I will have the back half.(소는 앞쪽 반은 당신, 뒤쪽 반은 내가 가질게요.)","함정: ① 담요는 낮=Boka, 밤=Tetan이라 보기와 반대 ✕"],"why":"Tetan이 정한 규칙에서 Boka는 소의 앞쪽 반을 가진다."}],"pp":[["Tetan Buri and Boka Buri lived next to each other.","Tetan Buri와 Boka Buri는 서로 이웃에 살았습니다."],["They were very poor.","그들은 매우 가난했습니다."],["One day, Tetan said to Boka, \"Why don't we share things and live together?","어느 날 Tetan이 Boka에게 \"우리 물건을 나누고 함께 살면 어떨까요?"],["We will be happy.\"","그럼 행복할 거예요.\"라고 말했습니다."],["\"Hmm, that's a good idea,\" said Boka.","\"흠, 좋은 생각이네요.\"라고 Boka가 말했습니다."],["They had one blanket, one cow, and one mango tree.","그들에게는 담요 한 장, 소 한 마리, 망고나무 한 그루가 있었습니다."],["Tetan set the sharing rules.","Tetan이 공유 규칙을 정했습니다."],["She said to Boka, \"You can have the blanket during the day, and I will have it at night.","그녀는 Boka에게 \"담요는 낮 동안에는 당신이 가져도 되고, 밤에는 내가 가질게요."],["For the cow, you can have the front half, and I will have the back half.","소는 앞쪽 반은 당신이 가져도 되고, 뒤쪽 반은 내가 가질게요."],["For the mango tree, you can have the bottom half, and I will have the top half.\"","망고나무는 당신이 아래쪽 반을 가지고 내가 위쪽 반을 가질게요.\"라고 말했습니다."],["Boka agreed to all the rules.","Boka는 모든 규칙에 동의했습니다."]]},{"qs":[{"n":7,"q":"마을 촌장이 Boka에게 해 준 조언으로 알맞은 것은?","o":["담요를 Tetan에게 주고 소를 팔아라.","담요를 적셔서 Tetan에게 주고, 소에게 먹이를 주지 말고, 나무를 반으로 잘라라.","소에게 먹이를 더 많이 주고 나무에 물을 자주 줘라.","Tetan과 집을 바꿔서 살아라.","담요를 낮에도 Tetan에게 빌려줘라."],"a":1,"ans":"담요를 적셔서 Tetan에게 주고, 소에게 먹이를 주지 말고, 나무를 반으로 잘라라.","evs":[["Soak the blanket and give it to Tetan.","담요를 적셔서 Tetan에게 주게."],["Don't feed the cow.","소에게는 먹이를 주지 말게."],["Then, cut the tree in half.","그러고 나무를 반으로 자르게."]],"ev":["Soak the blanket and give it to Tetan.","담요를 적셔서 Tetan에게 주게."],"ow":["오답 ✕ — 촌장은 'Soak the blanket and give it to Tetan.'(담요를 적셔서 Tetan에게 주게.)라고 했지만 소를 팔라는 말은 없다. 소에 대해서는 'Don't feed the cow.'(먹이를 주지 말게.)라고 했다.","정답 ○ — 촌장이 'Soak the blanket and give it to Tetan.', 'Don't feed the cow.', 'Then, cut the tree in half.'라고 했다. 즉 담요를 적시고, 먹이를 주지 말고, 나무를 반으로 자르라는 조언이다.","오답 ✕ — 촌장은 'Don't feed the cow.'(소에게는 먹이를 주지 말게.)라고 했으므로 먹이를 더 주라는 것은 반대다. 나무도 'cut the tree in half.'(반으로 자르게.)이다.","오답 ✕ — 집을 바꾸라는 말은 없다. 촌장의 조언은 담요, 소, 나무에 관한 세 가지('Soak the blanket', 'Don't feed the cow', 'cut the tree in half')이다.","오답 ✕ — 담요를 빌려주라는 말이 아니라 'Soak the blanket and give it to Tetan.'(담요를 적셔서 Tetan에게 주게.)라고 했다. 적시라는 말이 핵심이다."],"memo":["정답 ②: 담요를 적셔서 주고, 소에게 먹이를 주지 말고, 나무를 반으로 잘라라.","근거: Soak the blanket and give it to Tetan.(담요를 적셔서 Tetan에게 주게.)","함정: ③ Don't feed the cow = 먹이를 주지 마라(반대로 읽지 말기) ✕"],"why":"촌장은 담요를 적시고, 소에게 먹이를 주지 않고, 나무를 반으로 자르라고 했다."}],"pp":[["Boka got tired and hungry, so she went to the village chief for help.","Boka는 피곤하고 배가 고파져서 도움을 청하러 마을 촌장에게 갔습니다."],["He said, \"Soak the blanket and give it to Tetan.","그는 \"담요를 적셔서 Tetan에게 주게."],["Don't feed the cow.","소에게는 먹이를 주지 말게."],["Then, cut the tree in half.\"","그러고 나무를 반으로 자르게.\"라고 말했습니다."],["Boka listened to him.","Boka는 그의 말을 들었습니다."],["Tetan couldn't sleep well during the night.","Tetan은 밤에 잠을 잘 수 없었습니다."],["She also couldn't go near the angry cow.","그녀는 성난 소 근처에도 갈 수 없었습니다."],["She couldn't eat mangoes anymore.","망고도 더 이상 먹을 수 없었습니다."]]},{"qs":[{"n":8,"q":"Tetan의 마지막 말을 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["sorry - share","proud - share","angry - keep","sorry - keep","happy - hide"],"a":0,"ans":"sorry - share","evs":[["I am sorry.","미안해요."],["I was foolish.","내가 어리석었어요."],["I will also share things with you fairly.","그리고 당신과 공평하게 물건도 나눌게요."]],"ev":["I am sorry.","미안해요."],"ow":["정답 ○ — Tetan은 'I am sorry.'(미안해요.)와 'I was foolish.'(내가 어리석었어요.)라고 후회했고, 'I will also share things with you fairly.'(공평하게 물건도 나눌게요.)라고 약속했다. 그래서 sorry - share이다.","오답 ✕ — 'share'는 맞지만 Tetan은 'I was foolish.'(내가 어리석었어요.)라고 했으므로 자랑스러워(proud)하지 않고 후회했다.","오답 ✕ — Tetan은 'I am sorry.'(미안해요.)라고 사과했으므로 화가 난(angry) 것이 아니다. 또 'I will also share things'(물건도 나눌게요)라고 했지 가지겠다(keep)가 아니다.","오답 ✕ — (A) sorry는 맞지만 (B)가 틀리다. Tetan은 'I will also share things with you fairly.'(공평하게 나눌게요.)라고 했으므로 keep이 아니라 share이다.","오답 ✕ — Tetan은 'I am sorry.'(미안해요.)라고 했으므로 happy가 아니고, 물건을 숨기겠다(hide)는 말도 없다. 'share things with you fairly'라고 했다."],"memo":["정답 ①: sorry - share","근거: I am sorry.(미안해요.) / I will also share things with you fairly.(공평하게 물건도 나눌게요.)","함정: keep(가진다)은 share(나눈다)와 반대 ✕"],"why":"Tetan은 어리석었던 것을 후회하며 공평하게 나누겠다고 약속한다.","sum":"Tetan felt (A)________ for being foolish and promised to (B)________ things with Boka fairly.","lab":"완성된 요약문 : "}],"pp":[["Tetan regretted everything and said to Boka, \"I am sorry.","Tetan은 모든 것을 후회하며 Boka에게 \"미안해요."],["I was foolish.","내가 어리석었어요."],["From now on, I will work hard, too.","이제부터는 나도 열심히 일할게요."],["I will also share things with you fairly.\"","그리고 당신과 공평하게 물건도 나눌게요.\"라고 말했습니다."]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["Tetan과 Boka는 서로 멀리 떨어진 곳에 살고 있었다.","Boka는 밤에 담요를 사용할 수 있었다.","Boka는 공유 규칙을 정했고, Tetan은 이에 동의했다.","Boka는 공유 규칙을 따르며 곧 더 행복해졌다.","Boka가 낮 동안 소에게 먹이를 주었지만, Tetan이 우유를 얻었다."],"a":4,"ans":"Boka가 낮 동안 소에게 먹이를 주었지만, Tetan이 우유를 얻었다.","evs":[["She fed the cow all day, but Tetan got milk from the back half.","그녀는 하루 종일 소에게 먹이를 주었지만, Tetan은 소의 뒤쪽 반에서 우유를 얻었습니다."]],"ev":["She fed the cow all day, but Tetan got milk from the back half.","그녀는 하루 종일 소에게 먹이를 주었지만, Tetan은 소의 뒤쪽 반에서 우유를 얻었습니다."],"ow":["오답 ✕ — 'Tetan Buri and Boka Buri lived next to each other.'(Tetan Buri와 Boka Buri는 서로 이웃에 살았습니다.)라고 했으므로 멀리 떨어져 살지 않았다.","오답 ✕ — 담요는 'You can have the blanket during the day, and I will have it at night.'(낮에는 당신, 밤에는 내가 가질게요.)이므로 Boka는 밤에 담요를 쓸 수 없었다. 'She was cold during the night'(그녀는 밤에 추웠다)도 근거다.","오답 ✕ — 규칙을 정한 사람은 Boka가 아니라 Tetan이다. 'Tetan set the sharing rules.'(Tetan이 공유 규칙을 정했습니다.) Boka는 'Boka agreed to all the rules.'(모든 규칙에 동의했습니다.)","오답 ✕ — 'However, before long, she became very unhappy.'(그러나 얼마 지나지 않아, 그녀는 매우 불행해졌습니다.)라고 했으므로 더 행복해진 것이 아니라 불행해졌다.","정답 ○ — 'She fed the cow all day, but Tetan got milk from the back half.'(하루 종일 소에게 먹이를 주었지만, Tetan은 소의 뒤쪽 반에서 우유를 얻었습니다.)와 일치한다."],"memo":["정답 ⑤: Boka는 소에게 먹이를 줬지만 우유는 Tetan이 얻었다.","근거: She fed the cow all day, but Tetan got milk from the back half.(하루 종일 소에게 먹이를 주었지만 Tetan이 뒤쪽에서 우유를 얻었다.)","함정: ③ 규칙은 Boka가 아니라 Tetan이 정했다 ✕"],"why":"Boka는 하루 종일 ","Tetan이 공유 규칙을 정했습니다."],["She said to Boka, \"You can have the blanket during the day, and I will have it at night.","그녀는 Boka에게 \"담요는 낮 동안에는 당신이 가져도 되고, 밤에는 내가 가질게요."],["For the cow, you can have the front half, and I will have the back half.","소는 앞쪽 반은 당신이 가져도 되고, 뒤쪽 반은 내가 가질게요."],["For the mango tree, you can have the bottom half, and I will have the top half.\"","망고나무는 당신이 아래쪽 반을 가지고 내가 위쪽 반을 가질게요.\"라고 말했습니다."],["Boka agreed to all the rules.","Boka는 모든 규칙에 동의했습니다."],["However, before long, she became very unhappy.","그러나 얼마 지나지 않아, 그녀는 매우 불행해졌습니다."],["She was cold during the night, but Tetan slept well under the warm blanket.","그녀는 밤에 추웠지만, Tetan은 따뜻한 담요 아래에서 잘 잤습니다."],["She fed the cow all day, but Tetan got milk from the back half.","그녀는 하루 종일 소에게 먹이를 주었지만, Tetan은 소의 뒤쪽 반에서 우유를 얻었습니다."],["She watered the tree every day, but Tetan ate all the mangoes from the top half.","그녀는 매일 나무에 물을 주었지만, Tetan은 위쪽 반의 망고를 모두 먹었습니다."],["Boka got tired and hungry, so she went to the village chief for help.","Boka는 피곤하고 배가 고파져서 도움을 청하러 마을 촌장에게 갔습니다."],["He said, \"Soak the blanket and give it to Tetan.","그는 \"담요를 적셔서 Tetan에게 주게."],["Don't feed the cow.","소에게는 먹이를 주지 말게."],["Then, cut the tree in half.\"","그러고 나무를 반으로 자르게.\"라고 말했습니다."],["Boka listened to him.","Boka는 그의 말을 들었습니다."],["Tetan couldn't sleep well during the night.","Tetan은 밤에 잠을 잘 수 없었습니다."],["She also couldn't go near the angry cow.","그녀는 성난 소 근처에도 갈 수 없었습니다."],["She couldn't eat mangoes anymore.","망고도 더 이상 먹을 수 없었습니다."],["Tetan regretted everything and said to Boka, \"I am sorry.","Tetan은 모든 것을 후회하며 Boka에게 \"미안해요."],["I was foolish.","내가 어리석었어요."],["From now on, I will work hard, too.","이제부터는 나도 열심히 일할게요."],["I will also share things with you fairly.\"","그리고 당신과 공평하게 물건도 나눌게요.\"라고 말했습니다."]]}];

var secs=[],cur=null;
D.forEach(function(it,i){if(it.tag||!cur){cur={name:it.tag||'',items:[]};secs.push(cur)}cur.items.push(i)});
var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});

  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=partsHtml();
 document.getElementById('app').innerHTML=h;relayUp();if(typeof persist==='function')persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
