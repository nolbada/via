he pots alone.","However, in the spring, something was DIFFERENT. Jo grew TALLER! Jo was taller than El, so Jo could water the plants alone. El felt smaller every day.","On the last day of school, Mr. Diaz said, “Class, you can take a flower home and care for it over the summer.” All the students ran to the window. El’s classmates reached for the pots over tiny El. They took all the pots with colorful flowers.","El took the last pot. It had the smallest plant with no flowers. “I feel just like you, little plant,” said El. Mr. Diaz looked at El and said, “That’s an aster plant. In time, it’ll grow and have beautiful flowers.”","“But it’s just a little green plant,” said El. She was not so sure.","“You can have my zinnia plant,” Jo said to El, “I’ll be at my grandma’s all summer.”","“I’ll plant my aster and your zinnia side by side,” El said.","“They’ll be good friends — just like us!” said Jo. El smiled.","El planted the flowers in her garden. It was growing season. All summer long, she cared for them.","On the last day of summer, Jo came to El’s house. El and Jo ran to the garden and suddenly stopped. Something was DIFFERENT! There were flowers on the aster ... and El grew TALLER, TOO!"];var PASS_KO=["성장하는 시기","El과 Jo는 반에서 가장 작은 학생들이었다. 그들은 항상 함께였다. 그들은 혼자서는 화분에 닿을 수 없었기 때문에 심지어는 교실에서 함께 식물에 물을 주기도 했다.","하지만 봄에는 무언가가 달라졌다. Jo의 키가 더 커졌다! Jo는 El보다 키가 더 컸고, 그래서 Jo는 혼자 식물에 물을 줄 수 있었다. El은 매일 더 작아지는 기분이었다.","학교 마지막 날에 Diaz 선생님이 말씀하셨다. “여러분, 꽃을 하나 집에 가져가서 여름 동안 돌보세요.” 모든 학생이 창문으로 달려갔다. El의 학급 친구들은 작은 El 너머 화분에 손을 뻗었다. 그들은 형형색색의 꽃이 있는 화분을 모두 가져갔다.","El은 마지막 화분을 가져갔다. 그것은 꽃이 없는 가장 작은 식물을 가지고 있었다. “나도 너와 같은 심정이야, 작은 식물아.” El이 말했다. Diaz 선생님이 El을 보며 말씀하셨다. “그것은 과꽃 식물이야. 시간이 지나면, 그것은 자라서 아름다운 꽃을 피울 거야.”","“하지만 그것은 작은 녹색 식물일 뿐이에요.” El이 말했다. 그녀는 확신이 없었다.","“너는 내 백일홍을 가져도 돼.” Jo가 El에게 말했다. “나는 여름 내내 할머니 댁에 있을 거야.”","“내가 내 과꽃과 너의 백일홍을 나란히 심을게.” El이 말했다.","“그것들은 좋은 친구가 될 거야 — 바로 우리처럼!” Jo가 말했다. El은 미소 지었다.","El은 그녀의 정원에 꽃들을 심었다. 성장하는 시기였다. 여름 내내 그녀는 그것들을 돌보았다.","여름의 마지막 날, Jo가 El의 집에 왔다. El과 Jo는 정원으로 달려가다가 갑자기 멈췄다. 무엇인가가 달라졌다! 과꽃에 꽃들이 있었다 ... 그리고 El도 키가 더 커졌다!"];var DLG=[["Eric","What’s the matter, Bomin?","무슨 일이니, Bomin?"],["Bomin","I’m too nervous about tomorrow’s basketball game, Eric.","나는 내일 농구 경기가 너무 긴장돼, Eric."],["Eric","I feel just like you, but we practiced a lot.","나도 너와 같은 기분이야, 하지만 우리는 연습을 많이 했잖아."],["Bomin","I missed the ball many times during the last game. So I’m worried about tomorrow’s game.","지난 경기에서 나는 공을 여러 번 놓쳤어. 그래서 내일 경기가 걱정돼."],["Eric","Don’t worry. We all learn from our mistakes. You’ll do better this time.","걱정하지 마. 우리 모두 실수에서 배우잖아. 이번에는 더 잘할 거야."],["Bomin","Thanks, Eric. I feel better now.","고마워, Eric. 이제 기분이 나아졌어."]];var BQ=[{"n":1,"q":"Bomin이 긴장하고 걱정하는 것은 무엇인가요?","o":["어제 본 시험","내일 있을 농구 경기","다음 주 캠프","내일 있을 발표","지난 경기의 결과"],"a":1,"ev":["I’m too nervous about tomorrow’s basketball game, Eric.","나는 내일 농구 경기가 너무 긴장돼, Eric."],"why":"nervous는 '긴장한'이라는 뜻이에요. 걱정하는 대상은 tomorrow's basketball game이에요.","ans":"내일 있을 농구 경기","memo":["Bomin의 걱정 = 내일 농구 경기","I’m too nervous about tomorrow’s basketball game, Eric. (나는 내일 농구 경기가 너무 긴장돼, Eric.)"]},{"n":2,"q":"Bomin이 지난 경기에서 한 실수는 무엇인가요?","o":["공을 여러 번 놓쳤다.","규칙을 어겼다.","다른 팀 선수를 다치게 했다.","공을 상대 팀에게 패스했다.","경기에 늦게 도착했다."],"a":0,"ev":["I missed the ball many times during the last game.","지난 경기에서 나는 공을 여러 번 놓쳤어."],"why":"missed는 miss(놓치다)의 과거형이에요. many times는 여러 번이라는 뜻이에요.","ans":"공을 여러 번 놓쳤다.","memo":["지난 경기의 실수 = 공을 여러 번 놓침","I missed the ball many times during the last game. (지난 경기에서 나는 공을 여러 번 놓쳤어.)"]},{"n":3,"q":"Eric은 팀이 무엇을 했다고 말하며 Bomin을 안심시켰나요?","o":["경기에서 이겼다.","새 공을 샀다.","감독님을 만났다.","연습을 많이 했다.","휴식을 오래 했다."],"a":3,"ev":["I feel just like you, but we practiced a lot.","나도 너와 같은 기분이야, 하지만 우리는 연습을 많이 했잖아."],"why":"practiced는 practice(연습하다)의 과거형이에요. a lot은 '많이'라는 뜻이에요.","ans":"연습을 많이 했다.","memo":["Eric의 위로 = 우리는 연습을 많이 함","I feel just like you, but we practiced a lot. (나도 너와 같은 기분이야, 하지만 우리는 연습을 많이 했잖아.)"]},{"n":4,"q":"Eric이 실수에 대해 한 말은 무엇인가요?","o":["실수는 절대 하면 안 된다.","실수한 사람은 경 function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})})});return r}

 });

function relayUp(){var st=[aDone(),!!qdone[0],!!qdone[1]],nm=['본문 오류 찾기','대화문 내용 5문제','본문 내용 5문제'],f=-1;for(var i=0;i<3;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}

function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){

 });

function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}

 var it=D[i],h='',wp=wrongPicks(i);

 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});

}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){

  show.forEach(function(i){var it=D[i];

  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}

  var tot=0,fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});
var QS=[{title:'대화문 내용 파악',groups:[{dlg:DLG,qs:BQ}]},{title:'본문 내용 파악',groups:[{pass:0,qs:DQ}]}];
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 return h;
}
function passHtml(si,lock){
 var h='<div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 PASS_EN.forEach(function(l){h+='<div class="ln"><div class="en">'+esc(l)+'</div></div>'});
 if(lock){h+='<div class="kr" style="white-space:pre-line">'+esc(PASS_KO.join('\n'))+'</div>'}
 return h+'</div>';
}
function dlgHtml(d,lock){
 var h='<div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pass!=null)h+=passHtml(g.pass,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/5</span><button data-subq="'+p+'">제출하기</button></div>';
 return h;
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div><div class="pt" style="margin-top:4px">'+esc(q.why)+'</div></div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 5문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">틀린 문제'+(ms.length>cap?' '+ms.length+'개 중 '+cap+'개':'')+'만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

render();
</script></body></html>
