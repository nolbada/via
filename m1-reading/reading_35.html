var D=[{"n":1,"tag":null,"en":"My name is Reena. I lives in a small village in Assam, India.","ko":"내 이름은 Reena야. 나는 인도 아삼(Assam)에 있는 작은 마을에 살아.","ok":false,"foot":[],"fixes":[{"wrong":"lives","right":"live","partial":false,"at":[5],"point":"일반동사의 현재형: 주어 I에는 lives가 아니라 live","topic":"일반동사의 현재형","memo":"주어 I에는 lives가 아니라 live"}]},{"n":2,"tag":null,"en":"There is a big forest near me village. There are many animals in the forest.","ko":"우리 마을 근처에는 큰 숲이 있어. 그 숲에는 많은 동물이 있어.","ok":false,"foot":[],"fixes":[{"wrong":"me","right":"my","partial":false,"at":[6],"point":"인칭대명사의 소유격: 명사 village 앞에는 소유격 my 사용","topic":"인칭대명사의 소유격","memo":"명사 village 앞에는 소유격 my 사용"}]},{"n":3,"tag":null,"en":"One morning, three elephants comes to my village. They could not found food in the forest.","ko":"어느 날 아침, 코끼리 세 마리가 우리 마을에 왔어. 그들은 숲에서 음식을 찾을 수 없었어.","ok":false,"foot":[],"fixes":[{"wrong":"comes","right":"came","partial":false,"at":[4],"point":"주어와 동사의 수일치: 주어 elephants는 복수: comes가 아니라 come(과거 came)","topic":"주어와 동사의 수일치","memo":"주어 elephants는 복수: comes가 아니라 come(과거 came)"},{"wrong":"found","right":"find","partial":false,"at":[11],"point":"조동사: 조동사 could not 뒤에는 동사원형 find 사용","topic":"조동사","memo":"조동사 could not 뒤에는 동사원형 find 사용"}]},{"n":4,"tag":null,"en":"So they ate the fruit and vegetables on our farms. Every day, more elephants came and eated our food.","ko":"그래서 그들은 우리의 농장에 있는 과일과 채소를 먹었어. 매일, 더 많은 코끼리들이 와서 우리의 음식을 먹었어.","ok":false,"foot":[],"fixes":[{"wrong":"eated","right":"ate","partial":false,"at":[16],"point":"불규칙 과거형: eat의 과거형은 eated가 아니라 ate","topic":"불규칙 과거형","memo":"eat의 과거형은 eated가 아니라 ate"}]},{"n":5,"tag":null,"en":"My father told everyone, \"We have to stop the elephants.\"","ko":"나의 아버지는 모두에게 \"우리는 코끼리들을 저지해야만 해요.\"라고 말씀하셨어.","ok":true,"foot":[],"fixes":[]},{"n":6,"tag":null,"en":"We tried many thing. We made loud noises.","ko":"우리는 많은 것을 시도해 봤어. 우리는 큰 소리를 냈어.","ok":false,"foot":[],"fixes":[{"wrong":"thing","right":"things","partial":false,"at":[3],"point":"수량 형용사 many/much: many 뒤에는 복수명사 things 사용","topic":"수량 형용사 many/much","memo":"many 뒤에는 복수명사 things 사용"}]},{"n":7,"tag":null,"en":"But the elephants was not scared. We used fire.","ko":"그러나 코끼리들은 무서워하지 않았어. 우리는 불을 사용했어.","ok":false,"foot":[],"fixes":[{"wrong":"was","right":"were","partial":false,"at":[3],"point":"be동사의 과거형: 복수 주어 the elephants에는 were 사용","topic":"be동사의 과거형","memo":"복수 주어 the elephants에는 were 사용"}]},{"n":8,"tag":null,"en":"But it was dangerous for we. The elephants always came back.","ko":"그러나 그것은 우리에게 위험했어. 코끼리들은 항상 돌아왔어.","ok":false,"foot":[],"fixes":[{"wrong":"we","right":"us","partial":false,"at":[5],"point":"인칭대명사의 목적격: 전치사 for 뒤에는 목적격 us 사용","topic":"인칭대명사의 목적격","memo":"전치사 for 뒤에는 목적격 us 사용"}]},{"n":9,"tag":null,"en":"One day, I said, \"Doesn't hurt the elephants! They're just hungrily.\"","ko":"어느 날, 나는 \"코끼리들을 다치게 하지 마세요! 그들은 그저 배가 고픈 거예요.\"라고 말했어.","ok":false,"foot":[],"fixes":[{"wrong":"Doesn't","right":"Don't","partial":false,"at":[4],"point":"부정 명령문: '~하지 마라'는 Don't + 동사원형 사용","topic":"부정 명령문","memo":"'~하지 마라'는 Don't + 동사원형 사용"},{"wrong":"hungrily","right":"hungry","partial":false,"at":[10],"point":"형용사와 부사: be동사 뒤 보어 자리에는 형용사 hungry 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어 자리에는 형용사 hungry 사용"}]},{"n":10,"tag":null,"en":"My father said, \"You're right. We can plant some food for they.\"","ko":"나의 아버지는 \"네 말이 맞아. 우리는 그들을 위한 음식을 좀 심을 수 있어.\"라고 말씀하셨어.","ok":false,"foot":[],"fixes":[{"wrong":"they","right":"them","partial":false,"at":[11],"point":"인칭대명사의 목적격: 전치사 for 뒤에는 목적격 them 사용","topic":"인칭대명사의 목적격","memo":"전치사 for 뒤에는 목적격 them 사용"}]},{"n":11,"tag":null,"en":"The people in my village planted rice and bananas near the forest. They growed quickly.","ko":"우리 마을의 사람들은 숲 근처에 벼와 바나나를 심었어. 그것들은 빨리 자랐어.","ok":false,"foot":[],"fixes":[{"wrong":"growed","right":"grew","partial":false,"at":[13],"point":"불규칙 과거형: grow의 과거형은 growed가 아니라 grew","topic":"불규칙 과거형","memo":"grow의 과거형은 growed가 아니라 grew"}]},{"n":12,"tag":null,"en":"The elephants loved us presents.","ko":"코끼리들은 우리의 선물을 아주 좋아했어.","ok":false,"foot":[],"fixes":[{"wrong":"us","right":"our","partial":false,"at":[3],"point":"인칭대명사의 소유격: 명사 presents 앞에는 소유격 our 사용","topic":"인칭대명사의 소유격","memo":"명사 presents 앞에는 소유격 our 사용"}]},{"n":13,"tag":null,"en":"Now, the elephants don't come to our village anymore. They are happily.","ko":"이제, 코끼리들은 더 이상 우리 마을에 오지 않아. 그들은 행복해.","ok":false,"foot":[],"fixes":[{"wrong":"happily","right":"happy","partial":false,"at":[11],"point":"형용사와 부사: be동사 뒤 보어 자리에는 형용사 happy 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어 자리에는 형용사 happy 사용"}]},{"n":14,"tag":null,"en":"We are happy, too. Elephants and people can be good neighbor.","ko":"우리도 행복해. 코끼리와 사람은 좋은 이웃이 될 수 있어.","ok":false,"foot":[],"fixes":[{"wrong":"neighbor","right":"neighbors","partial":false,"at":[10],"point":"명사의 복수형: 주어가 복수이므로 보어도 neighbors 사용","topic":"명사의 복수형","memo":"주어가 복수이므로 보어도 neighbors 사용"}]}];var PP=[["My name is Reena.","내 이름은 Reena야.",1],["I live in a small village in Assam, India.","나는 인도 아삼(Assam)에 있는 작은 마을에 살아.",0],["There is a big forest near my village.","우리 마을 근처에는 큰 숲이 있어.",0],["There are many animals in the forest.","그 숲에는 많은 동물이 있어.",0],["One morning, three elephants came to my village.","어느 날 아침, 코끼리 세 마리가 우리 마을에 왔어.",1],["They could not find food in the forest.","그들은 숲에서 음식을 찾을 수 없었어.",0],["So they ate the fruit and vegetables on our farms.","그래서 그들은 우리의 농장에 있는 과일과 채소를 먹었어.",0],["Every day, more elephants came and ate our food.","매일, 더 많은 코끼리들이 와서 우리의 음식을 먹었어.",0],["My father told everyone, \"We have to stop the elephants.\"","나의 아버지는 모두에게 \"우리는 코끼리들을 저지해야만 해요.\"라고 말씀하셨어.",0],["We tried many things.","우리는 많은 것을 시도해 봤어.",1],["We made loud noises.","우리는 큰 소리를 냈어.",0],["But the elephants were not scared.","그러나 코끼리들은 무서워하지 않았어.",0],["We used fire.","우리는 불을 사용했어.",0],["But it was dangerous for us.","그러나 그것은 우리에게 위험했어.",0],["The elephants always came back.","코끼리들은 항상 돌아왔어.",0],["One day, I said, \"Don't hurt the elephants!","어느 날, 나는 \"코끼리들을 다치게 하지 마세요!",1],["They're just hungry.\"","그들은 그저 배가 고픈 거예요.\"라고 말했어.",0],["My father said, \"You're right.","나의 아버지는 \"네 말이 맞아.",0],["We can plant some food for them.\"","우리는 그들을 위한 음식을 좀 심을 수 있어.\"라고 말씀하셨어.",0],["The people in my village planted rice and bananas near the forest.","우리 마을의 사람들은 숲 근처에 벼와 바나나를 심었어.",0],["They grew quickly.","그것들은 빨리 자랐어.",0],["The elephants loved our presents.","코끼리들은 우리의 선물을 아주 좋아했어.",0],["Now, the elephants don't come to our village anymore.","이제, 코끼리들은 더 이상 우리 마을에 오지 않아.",1],["They are happy.","그들은 행복해.",0],["We are happy, too.","우리도 행복해.",0],["Elephants and people can be good neighbors.","코끼리와 사람은 좋은 이웃이 될 수 있어.",0]];var RNUM=35;var TITLE_EN="My Neighbor, Elephants";var PASS_EN=["My Neighbor, Elephants","My name is Reena. I live in a small village in Assam, India. There is a big forest near my village. There are many animals in the forest.","One morning, three elephants came to my village. They could not find food in the forest. So they ate the fruit and vegetables on our farms. Every day, more elephants came and ate our food. My father told everyone, \"We have to stop the elephants.\"","We tried many things. We made loud noises. But the elephants were not scared. We used fire. But it was dangerous for us. The elephants always came back.","One day, I said, \"Don't hurt the elephants! They're just hungry.\" My father said, \"You're right. We can plant some food for them.\" The people in my village planted rice and bananas near the forest. They grew quickly. The elephants loved our presents.","Now, the elephants don't come to our village anymore. They are happy. We are happy, too. Elephants and people can be good neighbors."];var PASS_KO=["내 이웃, 코끼리","내 이름은 Reena야. 나는 인도 아삼(Assam)에 있는 작은 마을에 살아. 우리 마을 근처에는 큰 숲이 있어. 그 숲에는 많은 동물이 있어.","어느 날 아침, 코끼리 세 마리가 우리 마을에 왔어. 그들은 숲에서 음식을 찾을 수 없었어. 그래서 그들은 우리의 농장에 있는 과일과 채소를 먹었어. 매일, 더 많은 코끼리들이 와서 우리의 음식을 먹었어. 나의 아버지는 모두에게 \"우리는 코끼리들을 저지해야만 해요.\"라고 말씀하셨어.","우리는 많은 것을 시도해 봤어. 우리는 큰 소리를 냈어. 그러나 코끼리들은 무서워하지 않았어. 우리는 불을 사용했어. 그러나 그것은 우리에게 위험했어. 코끼리들은 항상 돌아왔어.","어느 날, 나는 \"코끼리들을 다치게 하지 마세요! 그들은 그저 배가 고픈 거예요.\"라고 말했어. 나의 아버지는 \"네 말이 맞아. 우리는 그들을 위한 음식을 좀 심을 수 있어.\"라고 말씀하셨어. 우리 마을의 사람들은 숲 근처에 벼와 바나나를 심었어. 그것들은 빨리 자랐어. 코끼리들은 우리의 선물을 아주 좋아했어.","이제, 코끼리들은 더 이상 우리 마을에 오지 않아. 그들은 행복해. 우리도 행복해. 코끼리와 사람은 좋은 이웃이 될 수 있어."];var DG=[{"qs":[{"n":1,"q":"What favor does Sumi ask Jason to do?","o":["Check the park with her","Buy dog food for Choco","Call her mother","Make posters for Choco","Look for Choco at school"],"a":0,"ans":"Check the park with her","evs":[["G: I lost him in the park. Can you do me a favor, Jason?","공원에서 잃어버렸어. 제이슨, 내 부탁 하나 들어줄래?"],["G: Can you check the park with me?","나랑 같이 공원을 살펴봐 줄 수 있니?"]],"ev":["G: I lost him in the park. Can you do me a favor, Jason?","공원에서 잃어버렸어. 제이슨, 내 부탁 하나 들어줄래?"],"ow":["정답 ○ — 수미는 'Can you do me a favor, Jason?'(제이슨, 내 부탁 하나 들어줄래?)이라고 한 뒤 'Can you check the park with me?'(나랑 같이 공원을 살펴봐 줄 수 있니?)라고 부탁했으므로 정답.","오답 ✕ — 수미는 'I can't find my dog, Choco.'(내 강아지 초코를 찾을 수가 없어.)라고 했을 뿐, 강아지 사료를 사 달라는 부탁은 하지 않았다.","오답 ✕ — 대화에는 엄마에게 전화해 달라는 말이 없다. 수미의 부탁은 'Can you check the park with me?'(나랑 같이 공원을 살펴봐 줄 수 있니?)이다.","오답 ✕ — 포스터를 만들자는 말은 대화에 없다. 수미는 공원을 같이 살펴봐 달라고 했다.","오답 ✕ — 수미는 'I lost him in the park.'(공원에서 잃어버렸어.)라고 했으므로 학교가 아니라 공원에서 찾아야 한다."],"memo":["정답 ①: 수미는 제이슨에게 같이 공원을 살펴봐 달라고 부탁했다.","근거: Can you check the park with me?(나랑 같이 공원을 살펴봐 줄 수 있니?)","함정: ⑤는 잃어버린 곳이 학교가 아니라 공원이라 ✕"],"why":"수미는 강아지를 찾기 위해 제이슨에게 함께 공원을 살펴봐 달라고 부탁했다."},{"n":2,"q":"What will Sumi and Jason do after this conversation?","o":["They will ask people near the park.","They will make posters for the dog.","They will call a police officer for help.","They will look around the school first.","They will go to the park to find the dog."],"a":4,"ans":"They will go to the park to find the dog.","evs":[["G: Can you check the park with me?","나랑 같이 공원을 살펴봐 줄 수 있니?"],["B: Of course. Let's go.","물론이지. 가자."]],"ev":["G: Can you check the park with me?","나랑 같이 공원을 살펴봐 줄 수 있니?"],"ow":["오답 ✕ — 'Can you check the park with me?'(나랑 같이 공원을 살펴봐 줄 수 있니?)라고 했으므로 지나가는 사람들에게 묻는 것이 아니라 직접 공원을 살펴본다. 사람들에게 묻는다는 말은 없다.","오답 ✕ — 대화에는 강아지 포스터를 만든다는 말이 전혀 없다. 'Let's go.'(가자.)로 바로 공원으로 간다.","오답 ✕ — 'Of course. Let's go.'(물론이지. 가자.)라고 했을 뿐, 경찰관에게 전화한다는 내용은 없다.","오답 ✕ — 수미는 'I lost him in the park.'(공원에서 잃어버렸어.)라고 했으므로 학교를 먼저 둘러보는 것이 아니라 공원으로 간다.","정답 ○ — 수미가 'Can you check the park with me?'(나랑 같이 공원을 살펴봐 줄 수 있니?)라고 부탁했고 제이슨이 'Of course. Let's go.'(물론이지. 가자.)라고 했으므로 둘은 강아지를 찾으러 공원에 갈 것이다."],"memo":["정답 ⑤: 두 사람은 강아지를 찾으러 공원에 갈 것이다.","근거: Can you check the park with me? / Of course. Let's go.(같이 공원을 살펴봐 줄래? / 물론이지. 가자.)","함정: ④는 잃어버린 곳이 공원이라 학교부터 가지 않아서 ✕"],"why":"수미의 부탁을 제이슨이 받아들였으므로 둘은 공원에 가서 강아지를 찾을 것이다."}],"dlg":[["B","Sumi, you look sad.","수미야, 슬퍼 보여."],["G","Yeah. I can't find my dog, Choco.","응. 내 강아지 초코를 찾을 수가 없어."],["B","Oh, no! You mean, your big brown dog?","이런! 네 크고 갈색인 강아지 말이니?"],["G","Yes. I'm so worried.","응. 너무 걱정돼."],["B","Where did you lose him?","어디서 잃어버렸는데?"],["G","I lost him in the park. Can you do me a favor, Jason?","공원에서 잃어버렸어. 제이슨, 내 부탁 하나 들어줄래?"],["B","Sure. What is it?","물론이지. 뭔데?"],["G","Can you check the park with me?","나랑 같이 공원을 살펴봐 줄 수 있니?"],["B","Of course. Let's go.","물론이지. 가자."]]},{"qs":[{"n":3,"q":"What will Kate do in the library?","o":["She'll find books for children.","She'll read books to the children.","She'll draw a picture on the paper.","She'll take the crayons to the art room.","She'll play with the children in the game room."],"a":4,"ans":"She'll play with the children in the game room.","evs":[["W: Jiho and Kate, can you play with the children in the game room?","지호와 케이트, 게임방에서 어린이들과 놀아 줄 수 있나요?"]],"ev":["W: Jiho and Kate, can you play with the children in the game room?","지호와 케이트, 게임방에서 어린이들과 놀아 줄 수 있나요?"],"ow":["오답 ✕ — 'Yena, can you read books to the children?'(예나, 어린이들에게 책을 읽어 줄 수 있나요?)처럼 책을 찾는 일은 맡지 않았고, 케이트의 일도 아니다.","오답 ✕ — 'Yena, can you read books to the children?'(예나, 어린이들에게 책을 읽어 줄 수 있나요?)는 예나가 맡은 일이다. 케이트의 일이 아니라서 틀림.","오답 ✕ — 그림을 그린다는 말은 지문에 없
