ery student joins the orchestra, the chorus, or the music band. Soon, we will have a concert in the music hall. I will play the violin in the orchestra. Tom will sing in the chorus, and Annie will play the guitar in the band. My parents are waiting for the concert. I'm nervous but excited!","Digital Writing Contest, Korea","We have a digital writing contest today. We write stories and take pictures with our smartphones. Then, we post our work on the school's online board. The topic is our school campus in the spring. I will write about the school garden and post pictures of the beautiful flowers. It will be fun!"];var PASS_KO=["세계의 재미있는 학교행사","크로스컨트리 경주 날, 뉴질랜드","오늘은 크로스컨트리 경주 날이야. 이것은 우리 학교의 큰 스포츠 행사야. 우리는 숲에서 4킬로미터를 달려. 코스에는 작은 언덕과 많은 나무들이 있어. 힘든 경주이지만 우리는 그것을 끝낼 수 있어. 이제 우리는 출발선에서 기다리고 있어!","국가 언어의 달, 필리핀","너희 나라에는 몇 개의 언어가 있니? 우리는 100개가 넘는 언어를 가지고 있어. 8월은 국가 언어의 달이야. 학교에서는 많은 행사가 있어. 우리는 말하기 대회를 해. 우리는 우리의 언어로 시를 읽고 연기를 해. 나는 우리의 언어가 자랑스러워!","연주회, 미국","우리 학교에서는 모든 학생이 오케스트라, 합창단, 또는 음악 밴드에 참여해. 곧, 우리는 음악 홀에서 연주회를 할 거야. 나는 오케스트라에서 바이올린을 연주할 거야. Tom은 합창단에서 노래를 부를 것이고, Annie는 밴드에서 기타를 연주할 거야. 나의 부모님은 연주회를 기다리고 계셔. 나는 긴장되지만 신나!","디지털 쓰기 대회, 대한민국","우리는 오늘 디지털 글쓰기 대회를 해. 우리는 스마트폰으로 이야기를 쓰고 사진을 찍어. 그런 다음, 우리의 작품을 학교의 온라인 게시판에 게시해. 주제는 봄철 우리 학교 캠퍼스야. 나는 학교 정원에 관해 쓰고 아름다운 꽃 사진을 올릴 거야. 재미있을 거야!"];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["Bella는 로봇을 잘 조종한다.","Bella는 드론을 날리고 있다.","Peter는 로봇을 조종하고 있다.","Bella는 Peter와 같은 장소에 있다.","Peter는 드론 날리기를 잘하지 못한다."],"a":3,"ans":"Bella는 Peter와 같은 장소에 있다.","evs":[["He is in the school garden with Bella.","그는 벨라와 함께 학교 정원에 있어."],["He is flying a drone. He's good at it.","그는 드론을 날리고 있어. 그는 그것을 잘해."],["No, she is controlling a robot.","아니, 그녀는 로봇을 조종하고 있어."],["No, she's not.","아니, 잘 못해."]],"ev":["He is in the school garden with Bella.","그는 벨라와 함께 학교 정원에 있어."],"ow":["오답 ✕ — 'Is she good at it?'(그녀는 그것을 잘하니?)라는 질문에 'No, she's not.'(아니, 잘 못해.)이라고 했는데, 이 보기는 Bella가 로봇을 잘 조종한다고 해서 틀림.","오답 ✕ — 'No, she is controlling a robot.'(아니, 그녀는 로봇을 조종하고 있어.)이라고 했는데, 이 보기는 Bella가 드론을 날린다고 해서 틀림. 드론을 날리는 사람은 Peter이다.","오답 ✕ — 'He is flying a drone.'(그는 드론을 날리고 있어.)이라고 했는데, 이 보기는 Peter가 로봇을 조종한다고 해서 틀림. 로봇을 조종하는 사람은 Bella이다.","정답 ○ — 'He is in the school garden with Bella.'(그는 벨라와 함께 학교 정원에 있어.)라고 했으므로 Bella는 Peter와 같은 장소에 있다.","오답 ✕ — 'He's good at it.'(그는 그것을 잘해.)이라고 했는데, 이 보기는 Peter가 드론 날리기를 잘하지 못한다고 해서 틀림."],"memo":["정답 ④: Bella는 Peter와 같은 장소에 있다.","근거: He is in the school garden with Bella.(그는 벨라와 함께 학교 정원에 있어.)","함정: ①은 'No, she's not.'(잘 못해)이라서 ✕, ②③은 하는 일이 서로 바뀌어서 ✕"],"why":"Peter는 Bella와 함께 학교 정원에 있다는 내용이 대화의 일치 보기이다."},{"n":2,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["flying - controlling","controlling - flying","flying - flying","controlling - controlling","watching - flying"],"a":0,"ans":"flying - controlling","evs":[["B: He is flying a drone. He's good at it.","그는 드론을 날리고 있어. 그는 그것을 잘해."],["B: No, she is controlling a robot.","아니, 그녀는 로봇을 조종하고 있어."]],"ev":["B: He is flying a drone. He's good at it.","그는 드론을 날리고 있어. 그는 그것을 잘해."],"ow":["정답 ○ — 'He is flying a drone'(그는 드론을 날리고 있다)이므로 (A)는 flying, 'she is controlling a robot'(그녀는 로봇을 조종하고 있다)이므로 (B)는 controlling이 맞음.","오답 ✕ — 'He is flying a drone'(드론을 날리고 있다)인데 (A)에 controlling을 넣고, 'she is controlling a robot'인데 (B)에 flying을 넣어 둘 다 서로 바뀌어 틀림.","오답 ✕ — (A) flying은 맞지만, 'No, she is controlling a robot'(그녀는 로봇을 조종하고 있다)이므로 (B)에 flying은 틀림.","오답 ✕ — (B) controlling은 맞지만, 드론에 대해 'He is flying a drone'(드론을 날리고 있다)이라고 했으므로 (A)에 controlling은 틀림.","오답 ✕ — 'He is flying a drone'이라고 했지 드론을 '보고 있다(watching)'고 하지 않았고, 로봇은 'controlling'이지 flying이 아니라서 둘 다 틀림."],"memo":["정답 ①: flying - controlling","근거: He is flying a drone(드론을 날린다) / she is controlling a robot(로봇을 조종한다)","함정: 드론은 fly, 로봇은 control. 둘을 바꾸면 ✕"],"why":"Peter는 드론을 날리고, Bella는 로봇을 조종하고 있다.","sum":"Peter is (A)______ a drone and he is good at it, but Bella is (B)______ a robot and she is not good at it.","lab":"완성된 요약문 : "}],"dlg":[["G","Where is Peter?","피터는 어디에 있니?"],["B","He is in the scho
