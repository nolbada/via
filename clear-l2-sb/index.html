A("T","T",19,"w",{q:"[서술형] [19-20] 괄호 안의 말을 이용하여 문장을 완성하시오. (출제 포인트 3)<br>19 The ending of the movie was ___. (shock)",ans:"shocking",full:"The ending of the movie was shocking.",ko:"그 영화의 결말은 충격적이었다.",
 h:["본책 p.66 ‘3 감정을 나타내는 분사’ 표(shocking 충격적인 / shocked 충격 받은)를 펴세요.","1) 주어는 The ending(결말)이에요. 결말은 충격을 받는 쪽일까요, 주는 쪽일까요?  2) 감정을 일으키는 대상에는 현재분사를 써요.","shock(원형 shock 충격을 주다)에 -ing를 붙인 말이에요. s로 시작해요."],
 pen:"사물이 충격을 일으킴 = 현재분사 shocking"});
A("T","T",20,"w",{q:"[서술형] [19-20] 괄호 안의 말을 이용하여 문장을 완성하시오. (출제 포인트 1)<br>20 They walked on the ___ leaves. (fall)",ans:"fallen",full:"They walked on the fallen leaves.",ko:"그들은 떨어진 나뭇잎 위를 걸었다.",
 h:["본책 p.66 ‘1 분사의 종류’ 표 옆의 fallen leaves(떨어진 나뭇잎) 예를 펴세요.","1) 이미 땅에 떨어져 있는 나뭇잎이에요. 완료의 뜻이에요.  2) 완료·수동의 뜻은 과거분사로 써요. fall(원형 fall 떨어지다)은 불규칙 동사예요.","fall - fell - ? 에서 세 번째 모양이에요. f로 시작하고 -n으로 끝나요."],
 pen:"떨어진(완료) = 과거분사 fallen (fall - fell - fallen)"});
A("T","T",21,"w",{q:"[서술형] [21-22] 밑줄 친 부분을 분사구문으로 바꿔 쓰시오. (출제 포인트 4)<br>21 <u>When I traveled abroad</u>, I enjoyed trying street food.<br>→ ___, I enjoyed trying street food.",ans:"Traveling abroad",full:"Traveling abroad, I enjoyed trying street food.",ko:"해외여행을 할 때 나는 길거리 음식을 먹어 보는 것을 즐겼다.",
 h:["본책 p.68 ‘1 분사구문’ 만드는 방법 ①②③을 펴세요.","1) 접속사 When(~할 때)과 같은 주어 I를 지워요.  2) traveled(원형 travel 여행하다)를 현재분사로 바꾸고 abroad(해외로)는 그대로 둬요.","travel에 -ing를 붙인 말 + abroad예요. T로 시작해요."],
 pen:"접속사·같은 주어 생략 + traveled → Traveling"});
A("T","T",22,"w",{q:"[서술형] [21-22] 밑줄 친 부분을 분사구문으로 바꿔 쓰시오. (출제 포인트 4)<br>22 <u>Because he was angry</u>, he didn’t say anything.<br>→ ___, he didn’t say anything.",ans:"Being angry",full:"Being angry, he didn’t say anything.",ko:"화가 나서 그는 아무 말도 하지 않았다.",
 h:["본책 p.68 아래쪽 ‘부사절의 동사가 be동사인 문장의 분사구문’ 상자를 펴세요.","1) 접속사 Because(~ 때문에)와 같은 주어 he를 지워요.  2) was는 be(원형 be 이다)동사이니 Being으로 시작해요.","B로 시작하는 두 단어예요. 두 번째 단어는 부사절의 형용사를 그대로 써요."],
 pen:"be동사 부사절 → Being + 형용사"});
A("T","T",23,"w",{q:"[서술형] 23 그림의 내용과 일치하도록 <보기>에서 알맞은 단어를 골라 대화를 완성하시오. (5점)<br>[그림: 세 소년이 어깨동무를 하고 나란히 서 있다. 가운데 소년에 ‘brother’라는 표시가 붙어 있고, 그는 분홍색 모자(cap)를 쓰고 농구공 무늬 티셔츠를 입었다. 왼쪽 소년은 빨간 옷, 오른쪽 소년은 안경(glasses)을 쓰고 있다.]<br>보기: cap  glasses  hold  wear<br>A Which one is your brother?<br>B The boy ___ is my brother.",ans:"wearing a cap",full:"The boy wearing a cap is my brother.",ko:"A: 어느 쪽이 네 남동생이니? B: 모자를 쓰고 있는 소년이 내 남동생이야.",
 h:["본책 p.66 ‘2 분사의 역할’ (1) 명사 수식(명사 뒤에서 수식)을 펴세요. (출제 포인트 1)","1) 그림에서 brother 표시가 있는 가운데 소년이 무엇을 쓰고 있는지 보세요.  2) 소년이 모자를 쓰고 있는 중이니 능동·진행이에요. wear(원형 wear 입다, 쓰다)를 현재분사로 바꿔 소년 뒤에서 꾸며요.","보기에서 두 개를 써요. wear에 -ing를 붙인 말 + 모자 단어예요. w로 시작해요."],
 pen:"~을 쓰고 있는(능동·진행) = 현재분사 wearing + 명사 뒤 수식"});
A("T","T",24,"w",{q:"[서술형] (최신기출) 24 <보기>에서 알맞은 접속사를 골라 밑줄 친 부분을 부사절로 바꿔 쓰시오. (4점)<br>보기: before  while  since<br><u>Knowing a shortcut</u>, I was able to get there in time. (* shortcut 지름길)<br>→ ___, I was able to get there in time.",ans:"Since I knew a shortcut",full:"Since I knew a shortcut, I was able to get there in time.",ko:"지름길을 알았기 때문에 나는 제시간에 그곳에 도착할 수 있었다.",
 h:["본책 p.68 ‘2 분사구문의 여러 가지 의미’의 (2) 이유(~ 때문에: because, since, as)를 펴세요. (출제 포인트 4)","1) 지름길을 안 것이 제시간에 도착할 수 있었던 원인이에요.  2) 보기 세 개 중 이유를 나타내는 접속사를 골라요. knowing(원형 know 알다)은 주절이 과거(was able to)이니 과거형으로 써요.","접속사 + 주어(I) + 과거 동사 + 목적어예요. 접속사는 s로 시작해요. 동사는 k로 시작해요."],
 pen:"이유의 분사구문 → Since + 주어 + 동사(주절과 같은 시제)"});
A("T","T",25,"w",{q:"[서술형] (고난도) 25 밑줄 친 ⓐ~ⓓ 중 어법상 틀린 것을 찾아 기호를 쓰고, 바르게 고쳐 쓰시오. (5점) (출제 포인트 1)<br>Last night, I was <u>ⓐ taking</u> a walk near the forest. Suddenly, somebody screamed, “Fire! Fire!” There was a <u>ⓑ burning</u> cabin in the forest. <u>ⓒ Seeing</u> the fire, I called 119. Soon firefighters arrived. After the fire, there was nothing <u>ⓓ leaving</u> in the cabin.<br>( ___ ) → ___",ans:"ⓓ, left",full:"ⓓ leaving → left (After the fire, there was nothing left in the cabin.)",ko:"지난밤에 나는 숲 근처에서 산책을 하고 있었다. 갑자기 누군가 “불이야! 불이야!”라고 소리쳤다. 숲에는 불타고 있는 오두막이 있었다. 불을 보고 나는 119에 전화를 했다. 곧 소방관들이 도착했다. 화재 후에 오두막 안에는 아무것도 남겨져 있지 않았다.",
 h:["본책 p.66 ‘1 분사의 종류’ 표(능동·진행 = 현재분사, 수동·완료 = 과거분사)를 펴세요.","1) 각 밑줄이 꾸미는 말과 능동인지 수동인지 확인해요. ⓑ 오두막은 불타고 있는 중, ⓒ 나는 불을 보는 중이에요.  2) 마지막 문장은 ‘아무것도 남겨져 있지 않았다’예요. leave(원형 leave 남기다)의 대상 nothing은 남겨진 쪽이에요.","틀린 것은 마지막 기호예요. 과거분사로 고쳐야 해요. l로 시작하는 불규칙 동사 형태예요."],
 pen:"nothing leaving (X) → nothing left (남겨진 = 수동 → 과거분사)"});
A("T","T",26,"w",{q:"[서술형] (출제 포인트 4) 26 주어진 문장과 의미가 같도록 빈칸에 알맞은 말을 쓰시오. (4점)<br>As he was making spaghetti, he sang a song.<br>→ ___ ___, he sang a song.",ans:"Making spaghetti",full:"Making spaghetti, he sang a song.",ko:"그는 스파게티를 만들면서 노래를 불렀다.",
 h:["본책 p.68 ‘1 분사구문’의 진행형 cf. 상자(be동사는 생략하고 현재분사로 시작)를 펴세요.","1) 접속사 As(~하면서)와 같은 주어 he를 지워요.  2) was making(원형 make 만들다)에서 be동사 was를 빼고 making만 남겨요.","빈칸 두 개: M으로 시작하는 현재분사 / s로 시작하는 음식 이름"],
 pen:"was making → Making (진행형은 be동사 생략)"});
A("T","T",27,"w",{q:"[서술형] (고난도, 출제 포인트 3) 27 다음 우리말을 <조건>에 맞게 영작하시오. (5점)<br>우리는 그 소식을 듣고 기뻐했다.<br>조건: 1. please, hear, the news를 이용할 것  2. 7단어로 쓸 것",ans:"We were pleased to hear the news.",full:"We were pleased to hear the news.",ko:"우리는 그 소식을 듣고 기뻐했다.",
 h:["본책 p.66 ‘3 감정을 나타내는 분사’ 표(pleasing 기쁘게 하는 / pleased 기쁜)를 펴세요.","1) 주어 We(우리)는 기쁨을 느끼는 사람이에요. 과거의 일이니 be동사도 과거형이에요.  2) 기쁜 이유(소식을 들어서)는 ‘to + 동사원형’으로 이어 말해요. hear(원형 hear 듣다)를 써요.","순서는 We + be동사 과거형 + 과거분사 + to hear + the news예요. 7단어를 세어 보세요."],
 pen:"사람이 느낌 = pleased, 감정의 원인 = to + 동사원형"});
A("T","T",28,"w",{q:"[서술형] (고난도, 출제 포인트 4) 28 어제 수민(Sumin)이가 한 일을 순서대로 나타낸 그림을 보고, <조건>에 맞게 영작하시오. (5점)<br>[그림: 12시에 소녀가 샌드위치로 점심을 먹는 모습(had lunch)과 화살표 다음, 2시에 같은 소녀가 헬멧을 쓰고 자전거를 타는 모습(rode her bicycle)이 나란히 그려져 있다.]<br>조건: 1. 접속사 after를 포함한 분사구문을 이용하여 7단어로 쓸 것  2. 과거시제로 쓸 것",ans:"After having lunch, Sumin rode her bicycle. 또는 After having lunch, she rode her bicycle.",full:"After having lunch, Sumin rode her bicycle. / After having lunch, she rode her bicycle.",ko:"점심을 먹은 후에 수민(그녀)은 자전거를 탔다.",
 h:["본책 p.68 ‘2 분사구문의 여러 가지 의미’ 아래 cf. 상자(After breaking the window, he ran away.)를 펴세요.","1) 그림 순서는 점심을 먹은 일이 먼저, 자전거를 탄 일이 나중이에요.  2) 먼저 한 일을 After + 분사구문으로 쓰고, 뒤에 주절을 과거시제로 써요. have(원형 have 먹다)는 -ing를 붙이고, ride(원형 ride 타다)의 과거형을 써요.","쉼표 앞은 After로 시작하는 세 단어, 쉼표 뒤는 주어(이름 또는 그녀) + ride의 과거형 + 탈것 두 단어예요. 모두 7단어예요."],
 pen:"After + 분사구문(having lunch), 주절은 과거시제"});
}

A(1,"CU",2,"c",{q:"A frog <u>was caught</u> by a boy.",opts:["잡았다","잡혔다"],ans:"잡혔다",full:"A frog was caught by a boy. = 개구리 한 마리가 한 소년에게 잡혔다.",ko:"개구리 한 마리가 한 소년에게 잡혔다.",

 pen:"was + p.p. = ~되었다 / ~당했다 (과거 수동태)"});
A(1,"A",1,"c",{q:"These cookies ( baked / were baked ) yesterday.",opts:["baked","were baked"],ans:"were baked",full:"These cookies were baked yesterday.",ko:"이 쿠키들은 어제 구워졌다.",

A(1,"A",2,"c",{q:"The photo ( took / was taken ) by a famous photographer.",opts:["took","was taken"],ans:"was taken",full:"The photo was taken by a famous photographer.",ko:"그 사진은 유명한 사진작가에 의해 찍혔다.",

A(1,"A",3,"c",{q:"A lot of tourists ( visit / are visited ) the museum every year.",opts:["visit","are visited"],ans:"visit",full:"A lot of tourists visit the museum every year.",ko:"많은 관광객들이 매년 그 박물관을 방문한다.",

 pen:"미래 수동태 = will be + p.p."});
A(1,"B",1,"w",{q:"다음 문장을 수동태로 바꿔 쓰시오.<br>People use the Internet almost every day.<br>→ The Internet ___ ___ (by people) almost every day.",ans:"is used",full:"The Internet is used (by people) almost every day.",ko:"인터넷은 거의 매일 (사람들에 의해) 사용된다.",

A(1,"B",2,"w",{q:"다음 문장을 수동태로 바꿔 쓰시오.<br>The teacher respected Emma’s opinion.<br>→ Emma’s opinion ___ ___ ___ the teacher.",ans:"was respected by",full:"Emma’s opinion was respected by the teacher.",ko:"Emma의 의견은 선생님에게 존중받았다.",
 h:["본책 p.78 ‘3 수동태의 시제 (2) 과거시제’와 ‘2 수동태의 형태와 의미’를 펴세요.","1) respected(원형 respect 존중하다)는 과거형이에요.  2) 주어 opinion(의견)은 단수이니 was를 쓰고, 행위자 앞에는 by를 붙여요.","빈칸 세 개: w로 시작 / respect에 -ed / b로 시작하는 두 글자"],

A(1,"B",3,"w",{q:"다음 문장을 수동태로 바꿔 쓰시오.<br>Big animals eat small animals.<br>→ Small animals ___ ___ ___ big animals.",ans:"are eaten by",full:"Small animals are eaten by big animals.",ko:"작은 동물들은 큰 동물들에게 먹힌다.",

A(1,"B",4,"w",{q:"다음 문장을 수동태로 바꿔 쓰시오.<br>He will translate this book.<br>→ This book ___ ___ ___ ___ ___.",ans:"will be translated by him",full:"This book will be translated by him.",ko:"이 책은 그에 의해 번역될 것이다.",

A(1,"C",1,"w",{q:"그 건물은 2002년에 지어졌다. (build)<br>→ The building ___ in 2002.",ans:"was built",full:"The building was built in 2002.",ko:"그 건물은 2002년에 지어졌다.",
 h:["본책 p.78 ‘3 수동태의 시제 (2) 과거시제: was / were + p.p.’를 펴세요.","1) 건물은 ‘지어지는’ 것이니 수동태예요.  2) in 2002(2002년에)는 과거이고 The building은 단수예요.","빈칸에는 두 단어가 들어가요. w로 시작하는 be동사 + build(짓다)의 과거분사(b로 시작, -t로 끝남)"],

A(1,"C",3,"w",{q:"그 노래는 전 세계에서 많은 사람들에 의해 불려진다. (sing)<br>→ The song ___ many people around the world.",ans:"is sung by",full:"The song is sung by many people around the world.",ko:"그 노래는 전 세계에서 많은 사람들에 의해 불려진다.",

 h:["본책 p.78 ‘3 수동태의 시제’ (1) 현재, (2) 과거, (3) 미래를 모두 펴세요.","1) 현재는 am / are / is + p.p.예요.  2) 과거는 was / were + p.p., 미래는 will be + p.p.예요. 주어가 단수인지 복수인지도 보세요.","순서대로: i로 시작하는 말 + loved / w로 시작하는 복수 be동사 + write의 과거분사 / will + b로 시작 + finish에 -ed"],

A("T","T",19,"w",{q:"[서술형] [19-20] 다음 문장을 수동태로 바꿀 때 빈칸에 알맞은 말을 쓰시오. (출제 포인트 1)<br>A superhero saved the world.<br>→ The world ___ ___ a superhero.",ans:"was saved by",full:"The world was saved by a superhero.",ko:"세상은 한 슈퍼히어로에 의해 구해졌다.",

A("T","T",21,"w",{q:"[서술형] [21-22] 우리말과 일치하도록 괄호 안의 말을 바르게 배열하시오. (출제 포인트 2)<br>인터넷은 언제 발명되었나요?<br>(the Internet, when, invented, was)<br>→ ___?",ans:"When was the Internet invented",full:"When was the Internet invented?",ko:"인터넷은 언제 발명되었나요?",

A("T","T",22,"w",{q:"[서술형] [21-22] 우리말과 일치하도록 괄호 안의 말을 바르게 배열하시오. (출제 포인트 3)<br>정크 푸드는 아이들에게 판매되어서는 안 된다.<br>(children, be, to, not, sold, should)<br>→ Junk food ___.",ans:"should not be sold to children",full:"Junk food should not be sold to children.",ko:"정크 푸드는 아이들에게 판매되어서는 안 된다.",
 h:["본책 p.80 ‘2 조동사가 있는 수동태’ 아래 ‘조동사 + not + be + p.p.’를 펴세요.","1) 조동사 should(~해야 한다)가 있는 수동태 부정문이에요.  2) 순서는 조동사 + not + be + p.p.이고, 그 뒤에 ‘~에게’ 부분이 와요.","should로 시작하고, 부정어 not의 자리를 먼저 정한 뒤 be + p.p.를 놓으세요. ‘아이들에게’는 맨 끝이에요."],

A("T","T",23,"w",{q:"[서술형] (최신기출, 출제 포인트 1) 다음 그림과 일치하도록 <보기>에서 알맞은 단어를 골라 문장을 완성하시오. (필요하면 형태를 바꿀 것)<br>[그림: (1) 분홍빛 하늘 아래 길이 이어진 풍경 그림 사진, 아래에 ‘Photo by Lisa Kim’. (2) 마법사가 그려진 책 표지 ‘The Wizard’, 아래에 ‘Book by John Brown’]<br>보기: break, take, read, write<br>(1) The photo ___ ___ ___ Lisa Kim.<br>(2) The book ___ ___ ___ John Brown.",ans:"was taken by, was written by",full:"(1) The photo was taken by Lisa Kim. / (2) The book was written by John Brown.",ko:"(1) 그 사진은 Lisa Kim에 의해 찍혔다. (2) 그 책은 John Brown에 의해 쓰였다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’ (be동사 + p.p. + by + 행위자)와 ‘3 (2) 과거시제’를 펴세요.","1) (1)은 ‘Photo by Lisa Kim’, 사진을 ‘찍은’ 사람이 Lisa Kim이에요.  2) (2)는 ‘Book by John Brown’, 책을 ‘쓴’ 사람이 John Brown이에요. 보기에서 take(찍다), write(쓰다)를 골라 과거분사로 바꿔요.","(1) was + t로 시작하는 과거분사 + by / (2) was + w로 시작하는 과거분사 + by"],
 pen:"사진은 찍히는 것(taken), 책은 쓰이는 것(written) → was + p.p. + by"});
A("T","T",24,"w",{q:"[서술형] 우리말과 일치하도록 괄호 안의 말을 이용하여 문장을 완성하시오.<br>월드컵이 내년에 개최될 것이다. (will, hold)<br>→ The World Cup ___ ___ ___ next year.",ans:"will be held",full:"The World Cup will be held next year.",ko:"월드컵이 내년에 개최될 것이다.",
 h:["본책 p.78 ‘3 수동태의 시제 (3) 미래시제: will be + p.p.’를 펴세요.","1) next year(내년)는 앞으로의 일이에요.  2) 월드컵은 ‘개최되는’ 것이니 수동태예요. will 다음에 be + p.p.를 써요.","빈칸 세 개: will / b로 시작 / hold(열다)의 과거분사(h로 시작, -eld)"],
 pen:"미래 수동태 = will be + p.p. (hold - held - held)"});
A("T","T",25,"w",{q:"[서술형] 표를 보고, 빈칸에 알맞은 말을 넣어 대화를 완성하시오. (출제 포인트 1)<br>[표: The Eiffel Tower - Designer: Gustave Eiffel / Built: - | The Leaning Tower of Pisa - Designer: - / Built: 12th century]<br>A Who designed the Eiffel Tower?<br>B The Eiffel Tower (1) ___ ___ ___ Gustave Eiffel.<br>A When was the Leaning Tower of Pisa built?<br>B The Leaning Tower of Pisa (2) ___ ___ in the 12th century.",ans:"was designed by, was built",full:"(1) The Eiffel Tower was designed by Gustave Eiffel. (2) The Leaning Tower of Pisa was built in the 12th century.",ko:"A 에펠탑은 누가 설계했니? B 에펠탑은 Gustave Eiffel에 의해 설계되었어. A 피사의 사탑은 언제 지어졌니? B 피사의 사탑은 12세기에 지어졌어.",
 h:["본책 p.78 ‘3 수동태의 시제 (2) 과거시제: was / were + p.p.’와 ‘2 수동태의 형태와 의미’를 펴세요.","1) (1)은 표에서 에펠탑의 설계자(Designer)가 Gustave Eiffel이니 ‘설계되었다’ 뒤에 by가 와요.  2) (2)는 피사의 사탑이 12세기에 ‘지어졌다’는 뜻이고, 행위자는 나오지 않아요. 둘 다 과거이고 주어는 단수예요.","(1) was + design(설계하다)에 -ed + by / (2) was + build(짓다)의 과거분사(b로 시작, -t로 끝남)"],
 pen:"과거 수동태 = was + p.p. (행위자가 중요하면 by)"});
A("T","T",26,"w",{q:"[서술형] (출제 포인트 3, 4) 우리말과 일치하도록 괄호 안의 단어를 이용하여 문장을 완성하시오.<br>그 제품에 만족하지 않으신다면, 일주일 이내에 환불 받을 것입니다.<br>If you (1) ___ ___ ___ ___ the product, the money (2) ___ ___ ___ within a week.<br>(satisfy, refund, will)",ans:"are not satisfied with, will be refunded",full:"If you are not satisfied with the product, the money will be refunded within a week.",ko:"그 제품에 만족하지 않으신다면, 일주일 이내에 환불 받을 것입니다.",
 h:["본책 p.82 ‘3 by 이외의 전치사를 쓰는 수동태 표현’ 표의 be satisfied with와 p.78 ‘3 (3) 미래시제’를 펴세요.","1) (1) ‘만족하지 않다’는 be동사 + not + satisfied(원형 satisfy 만족시키다의 과거분사) 뒤에 ‘~에’에 해당하는 전치사를 써요. 주어 you에 맞는 현재 be동사예요.  2) (2) ‘환불 받을 것이다’는 돈(the money)이 환불되는 미래 수동태예요.","(1) a로 시작 / n으로 시작 / satisfy에 -ed / w로 시작하는 전치사. (2) will / b로 시작 / refund에 -ed"],
 pen:"be not satisfied with / will be + p.p."});
A("T","T",27,"w",{q:"[서술형] (고난도) 다음 우리말을 <조건>에 맞게 영작하시오.<br>그 전쟁에서 많은 사람들이 죽었다.<br>조건 1. a lot of people, kill, in, the war를 이용할 것 (필요하면 형태를 바꿀 것) 2. 총 9단어로 쓸 것",ans:"A lot of people were killed in the war.",full:"A lot of people were killed in the war.",ko:"그 전쟁에서 많은 사람들이 죽었다.",
 h:["본책 p.78 ‘3 수동태의 시제 (2) 과거시제: was / were + p.p.’와 ‘2 수동태의 형태와 의미’의 상황이 중요할 때 by 생략 부분을 펴세요.","1) 누가 죽였는지보다 사람들이 죽었다는 상황이 중요하니 수동태예요.  2) 주어 a lot of people(많은 사람들)은 복수, 과거이니 be동사는 were이고, kill(죽이다)의 과거분사를 써요.","주어 A lot of people(4단어) + w로 시작하는 be동사 + kill에 -ed + in the war(3단어)로 9단어를 맞춰 보세요."],
 pen:"상황이 중요 → 수동태 (were killed), by 행위자 생략"});
A("T","T",28,"w",{q:"[서술형] (고난도) 밑줄 친 ⓐ~ⓓ 중 어법상 틀린 것을 찾아 기호를 쓰고, 바르게 고쳐 쓰시오.<br>A jewelry shop in my town ⓐ <u>was robbed</u> yesterday. The robbers ⓑ <u>were not caught</u> on the CCTV camera, but the police ⓒ <u>found</u> some fingerprints there. The robbers ⓓ <u>will catch</u> soon. (* rob (가게를) 털다, fingerprint 지문)<br>( ___ ) → ___",ans:"ⓓ, will be caught",full:"ⓓ will catch → will be caught (The robbers will be caught soon.)",ko:"어제 우리 동네의 보석 상점이 털렸다. 도둑들은 CCTV 카메라에 찍히지 않았지만 경찰은 그곳에서 지문 몇 개를 발견했다. 그 도둑들은 곧 잡힐 것이다.",
 h:["본책 p.80 ‘2 조동사가 있는 수동태: 조동사 + be + p.p.’와 p.78 ‘3 (3) 미래시제’를 펴세요.","1) ⓐ는 가게가 ‘털린’ 수동, ⓑ는 도둑들이 ‘찍히지 않은’ 수동, ⓒ는 경찰이 ‘발견한’ 능동이에요.  2) ⓓ의 주어 The robbers(도둑들)는 잡는 쪽일까요, 잡히는 쪽일까요? will 뒤의 모양도 확인해요.","틀린 것은 마지막 기호예요. will 뒤에 be + p.p.가 되도록 고쳐요."],
 pen:"will catch → will be caught (조동사 + be + p.p.)"});

A("SW","SW",9,"w",{q:"[배열 영작] 괄호 안의 말을 바르게 배열하시오. (them, of, made, both, were)<br>나는 시계가 두 개 있다. 두 개 다 한국에서 만든 것이다.<br>→ I have two watches. ___ in Korea.",ans:"Both of them were made",full:"I have two watches. Both of them were made in Korea.",ko:"나는 시계가 두 개 있다. 그 두 개 다 한국에서 만들어졌다.",

A("SW","SW",10,"w",{q:"[배열 영작] 괄호 안의 말을 바르게 배열하시오. (by, to, traveled, Europe, herself)<br>그녀는 혼자 한 번 유럽 여행을 다녀왔다.<br>→ She has ___ once.",ans:"traveled to Europe by herself",full:"She has traveled to Europe by herself once.",ko:"그녀는 혼자서 한 번 유럽을 여행한 적이 있다.",

A("T","T",13,"c",{q:"다음 중 어법상 올바른 문장의 개수는? (고난도)<br>ⓐ All the work were done yesterday.<br>ⓑ Some like dogs, and others like cats.<br>ⓒ Both of the products were made in China.<br>ⓓ Every students want to pass the test.<br>ⓔ The queen looked at herself in the mirror.",opts:o,ans:o[2],full:"③ 3개 (ⓑ, ⓒ, ⓔ가 옳다. ⓐ는 were → was, ⓓ는 Every student wants)",ko:"③ 3개. ⓐ 어제 모든 일이 끝났다(work는 단수 취급이라 was). ⓑ 어떤 이는 개를, 다른 어떤 이는 고양이를 좋아한다. ⓒ 그 제품들 둘 다 중국에서 만들어졌다. ⓓ 모든 학생은 시험에 통과하기를 원한다(every + 단수). ⓔ 여왕은 거울 속 자신을 보았다.",
 h:["본책 p.94 ‘1 each, every’와 ‘2 both, all’ 설명, p.96 ‘1 목적어로 쓰이는 재귀대명사’ 설명을 펴세요.","1) ⓐ는 all + 단수 명사 뒤 동사, ⓓ는 every 뒤 명사와 동사의 수를 확인해요.  2) ⓑ는 some … others, ⓒ는 both of + 복수 명사, ⓔ는 주어와 목적어가 같은 재귀대명사예요.","틀린 문장은 두 개예요. 다섯 개 중 두 개를 빼고 남은 개수를 고르세요."],
 pen:"all + 단수 → 단수 동사 / every + 단수 명사 + 단수 동사"}); }

A("T","T",14,"c",{q:"빈칸 ⓐ ~ ⓒ에 들어갈 말이 순서대로 바르게 짝지어진 것은?<br>A: Would you like ___ⓐ___ cake?<br>B: Yes, please. I haven’t had ___ⓑ___ food today. I’m hungry now.<br>A: Here you are. Help ___ⓒ___.",opts:o,ans:o[1],full:"② some – any – yourself",ko:"② A: 케이크 좀 드실래요? B: 네, 주세요. 저는 오늘 아무 음식도 먹지 못했어요. 지금 배가 고파요. A: 여기 있어요. 마음껏 드세요.",
 h:["본책 p.94 ‘3 some, any’ 설명과 p.96 ‘3 재귀대명사를 포함한 관용 표현’의 help oneself to를 펴세요.","1) ⓐ는 음식을 권하는 의문문, ⓑ는 haven’t(원형 have 가지다의 부정)가 있는 부정문이에요.  2) ⓒ ‘마음껏 드세요’는 help oneself로 쓰고, 명령문의 상대(you) 자신을 가리켜요.","권유 의문문은 some, 부정문은 any예요. 마지막은 you 대신 -self가 붙은 말이에요."],
 pen:"권유 의문문 some / 부정문 any / help oneself = 마음껏 먹다"}); }

A("T","T",15,"c",{q:"다음 중 우리말을 영어로 잘못 옮긴 것은?<br>① 나에게 종이가 좀 필요해. 네가 좀 갖고 있니? → I need some paper. Do you have any?<br>② 모든 돈은 옷에 쓰였다. → All the money was spent on clothes.<br>③ 그들 둘 다 나의 친구들이다. → Both them are my friends.<br>④ 각각의 소녀는 인형을 가지고 있다. → Each girl has a doll.<br>⑤ 저는 장미 다섯 송이를 원해요. 붉은 장미 두 송이와 흰 장미 세 송이요. → I want five roses. Two red ones and three white ones.",opts:o,ans:o[2],full:"③ Both them are my friends. (X) → Both of them are my friends.",ko:"③ 그들 둘 다 나의 친구들이다. (both 뒤에 대명사가 오면 both of them이 되어야 한다.)",
 h:["본책 p.94 ‘2 both, all’ 아래 상자(both of나 all of 뒤에 대명사가 올 때 of는 생략할 수 없다)를 펴세요.","1) 각 문장의 some, any, all, both, each의 쓰임을 하나씩 확인해요.  2) both나 all 다음에 대명사가 오면 어떤 말이 꼭 필요한지 떠올려요.","대명사 them이 나오는 문장을 찾으세요. 세 번째 보기예요."],

A("T","T",16,"c",{q:"밑줄 친 부분을 바르게 고친 것은?<br>① Don’t drink <u>any</u> water. (→ some)<br>② There is <u>some</u> milk in the bottle. (→ any)<br>③ I love your cap. I have a similar <u>one</u>. (→ ones)<br>④ I lent Jiho my camera. He still has <u>one</u>. (→ it)<br>⑤ My shoes are too old. I need new <u>ones</u>. (→ one)",opts:o,ans:o[3],full:"④ I lent Jiho my camera. He still has it.",ko:"④ 나는 지호에게 내 카메라를 빌려주었다. 그는 아직도 그것을 가지고 있다. (앞에 나온 바로 그 카메라이므로 it)",
 h:["본책 p.92 ‘1 one’ 아래 작은 상자(앞에서 언급된 것과 동일한 대상은 it)를 펴세요.","1) 문장마다 앞에 나온 명사가 단수인지 복수인지, 바로 그것인지 같은 종류의 다른 것인지 확인해요.  2) ①은 부정문, ②는 긍정문이라 any와 some이 이미 맞는지도 보세요.","내가 빌려준 바로 그 카메라를 그가 아직 가지고 있다는 뜻이에요. 네 번째 보기를 보세요."],
 pen:"바로 그것 = it (같은 종류의 다른 것 = one)"}); }

A("T","T",17,"c",{q:"밑줄 친 ⓐ ~ ⓔ 중 생략할 수 있는 것은? (출제 포인트 4)<br>My cousin is only six years old, but she can take care of ⓐ <u>herself</u>. She washes ⓑ <u>herself</u> and dresses ⓒ <u>herself</u>. She can even set the table by ⓓ <u>herself</u>. One day, she made sandwiches ⓔ <u>herself</u>.",opts:o,ans:o[4],full:"⑤ ⓔ (she made sandwiches herself. = 강조 용법이라 생략 가능)",ko:"⑤ ⓔ 내 사촌은 겨우 여섯 살이지만 자신을 돌볼 수 있다. 그녀는 스스로 씻고 옷을 입는다. 심지어 혼자서 식탁을 차릴 수도 있다. 어느 날 그녀는 직접 샌드위치를 만들었다.",
 h:["본책 p.96 아래 ‘비교 생략할 수 없는 재귀대명사 vs. 생략할 수 있는 재귀대명사’를 펴세요.","1) take care of ~(돌보다)와 washes(원형 wash 씻다), dresses(원형 dress 옷을 입히다) 뒤의 herself는 목적어예요.  2) by herself(혼자서)는 관용 표현의 일부예요.","남은 하나는 made(원형 make 만들다)의 목적어 sandwiches가 이미 있고 ‘직접’의 뜻으로 덧붙은 말이에요."],

A("T","T",18,"c",{q:"어법상 옳은 것을 모두 골라 짝지은 것은? (고난도)<br>ⓐ Some like baseball. Others like soccer.<br>ⓑ One of the three cups is empty. Others are not.<br>ⓒ Each worker is wearing a helmet.<br>ⓓ Every teams have their own flags.<br>ⓔ All the players did their best.",opts:o,ans:o[4],full:"⑤ ⓐ, ⓒ, ⓔ",ko:"⑤ ⓐ 어떤 이는 야구를, 다른 어떤 이는 축구를 좋아한다. ⓑ 세 개의 컵 중 하나는 비어 있고 나머지는 그렇지 않다(The others). ⓒ 각 작업자는 헬멧을 쓰고 있다. ⓓ 모든 팀은 자신들의 깃발이 있다(Every team has its own flag). ⓔ 선수들 모두 최선을 다했다.",
 h:["본책 p.92 ‘3 some, others, the others’와 p.94 ‘1 each, every’ 설명을 펴세요.","1) ⓑ는 세 개 중 하나를 말한 뒤 남은 모두를 가리켜요. 앞에 the가 필요한지 확인해요.  2) ⓓ는 every 뒤 명사와 동사가 단수여야 해요.","틀린 것은 두 개예요. 틀린 두 개를 뺀 나머지 셋이 들어 있는 보기를 고르세요."],
 pen:"나머지 모두 = the others / every + 단수 명사 + 단수 동사"}); }
A("T","T",19,"w",{q:"[서술형] 빈칸에 들어갈 알맞은 대명사를 쓰시오. (출제 포인트 2)<br>She has two daughters. ___ lives in Seoul, and ___ lives in Daegu.",ans:"One, the other",full:"She has two daughters. One lives in Seoul, and the other lives in Daegu.",ko:"그녀에게는 딸이 두 명 있다. 한 명은 서울에 살고, 나머지 한 명은 대구에 산다.",
 h:["본책 p.92 ‘2 one, another, the other’의 ‘(1) 둘 중에서’ 그림과 예문을 펴세요.","1) daughters(딸들)는 모두 two(두 명)예요.  2) 둘 중에서는 하나를 말하고 나머지 하나를 말해요. lives(원형 live 살다)가 단수 동사라 둘 다 단수예요.","첫 빈칸은 O로 시작하는 말, 둘째는 the로 시작하는 두 단어예요."],
 pen:"둘 중: One … the other"});
A("T","T",20,"w",{q:"[20-21] 우리말과 일치하도록 괄호 안의 말을 이용하여 문장을 완성하시오.<br>Jenny는 자신에게 “난 할 수 있어.”라고 말했다. (say to)<br>→ Jenny ___, “I can do it.”",ans:"said to herself",full:"Jenny said to herself, “I can do it.”",ko:"Jenny는 자신에게 “난 할 수 있어.”라고 말했다.",
 h:["본책 p.96 ‘1 목적어로 쓰이는 재귀대명사’ 설명(주어와 목적어가 같을 때)을 펴세요.","1) 말하는 사람 Jenny와 말을 듣는 대상이 같아요.  2) 과거 이야기이니 say(말하다)는 과거형 said로 쓰고, to 뒤에 Jenny를 대신하는 재귀대명사를 써요.","세 단어: say(말하다)의 과거형 / ‘~에게’ 뜻의 t로 시작하는 말 / she에 해당하는 -self 형태(h로 시작)"],
 pen:"주어 = 목적어 → 재귀대명사 (Jenny → herself)"});
A("T","T",21,"w",{q:"[20-21] 우리말과 일치하도록 괄호 안의 말을 이용하여 문장을 완성하시오.<br>저는 영어로 제 소개를 할 수 있습니다. (introduce)<br>→ I can ___ in English.",ans:"introduce myself",full:"I can introduce myself in English.",ko:"저는 영어로 제 소개를 할 수 있습니다.",
 h:["본책 p.96 ‘1 목적어로 쓰이는 재귀대명사’ 설명(We should learn to respect ourselves. 등)을 펴세요.","1) ‘나를 소개한다’이니 주어와 목적어가 같아요.  2) can 뒤라서 introduce(소개하다)는 원형 그대로 써요.","두 단어: introduce / I에 -self를 붙인 말(m으로 시작)"],
 pen:"introduce oneself = 자기소개하다 (I → myself)"});
A("T","T",22,"w",{q:"[서술형] 한 학급에서 과목에 대한 선호도를 조사한 결과이다. 표의 내용과 일치하도록 어법상 틀린 부분을 찾아 바르게 고쳐 쓰시오. (최신기출)<br>[그림: 막대그래프. What’s your favorite subject? (Total: 30 students) Math 10, English 12, Other subjects 8]<br>Some like math, and the others like English.<br>(틀린 부분 → 고친 말)",ans:"the others → others",full:"Some like math, and others like English.",ko:"어떤 학생들은 수학을 좋아하고, 다른 어떤 학생들은 영어를 좋아한다.",
 h:["본책 p.92 ‘3 some, others, the others’의 두 그림 설명을 펴세요.","1) 전체 30명 중 수학 10명, 영어 12명, 나머지 8명은 다른 과목이에요.  2) the others는 남은 모두를 뜻하는데, 영어를 좋아하는 학생 말고도 다른 과목 학생이 있어요.","남은 모두가 아니라 ‘다른 몇몇’이에요. 틀린 말에서 맨 앞의 한 단어만 빼면 돼요."],
 pen:"일부만 지칭: some … others / 남은 전부: some … the others"});
A("T","T",23,"w",{q:"[서술형] 글의 내용에 맞게 괄호 안의 말을 바르게 배열하시오.<br>Jack had to move a heavy box, but there was no one to help him. He decided to ( it, by, move, himself ).<br>→ He decided to ___.",ans:"move it by himself",full:"Jack had to move a heavy box, but there was no one to help him. He decided to move it by himself.",ko:"Jack은 무거운 상자를 옮겨야 했지만 그를 도와줄 사람이 아무도 없었다. 그는 그것을 혼자서 옮기기로 결심했다.",
 h:["본책 p.96 ‘3 재귀대명사를 포함한 관용 표현’의 by oneself 부분을 펴세요.","1) decided to 뒤에는 동사 원형 move(옮기다)가 와요.  2) 그 다음에 옮기는 대상 it, 맨 뒤에 ‘혼자서’를 뜻하는 말을 써요.","동사원형 다음에 옮기는 대상(대명사)을 바로 붙이고, ‘혼자서’(by + 재귀대명사)를 맨 뒤에 둬요."],
 pen:"by oneself = 혼자서 (move it by himself)"});
A("T","T",24,"w",{q:"[서술형] 각 그림과 일치하도록 빈칸에 알맞은 말을 <보기>에서 골라 쓰시오. (출제 포인트 2)<br>[보기] one / some / the other / others / the others<br>[그림: (1) 강아지와 고양이가 한 마리씩 나란히 있다. (2) 학생 여러 명이 나란히 서 있고 그중 몇 명만 안경을 쓰고 있다.]<br>(1) I have two pets. ___ is a dog, and ___ is a cat.<br>(2) ___ of the students are wearing glasses, and ___ are not.<br>(빈칸 4개를 차례로 쓰세요)",ans:"One, the other, Some, the others",full:"(1) I have two pets. One is a dog, and the other is a cat. (2) Some of the students are wearing glasses, and the others are not.",ko:"(1) 나는 애완동물이 두 마리 있다. 한 마리는 개이고, 나머지 한 마리는 고양이이다. (2) 학생들 중 몇몇은 안경을 쓰고 있고, 나머지 모두는 쓰고 있지 않다.",

A("T","T",18,"c",{q:"(고난도, 출제 포인트 1) 어법상 옳은 것끼리 짝지어진 것은?<br>ⓐ My hair is not as long as you.<br>ⓑ Sora is more diligent than her sister.<br>ⓒ He looks badder than you do.<br>ⓓ The Nile is the longest river in the world.<br>ⓔ The balloon became big and bigger.",opts:o,ans:o[2],full:"③ ⓑ, ⓓ",ko:"③ ⓑ Sora는 그녀의 언니보다 더 부지런하다. ⓓ 나일강은 세계에서 가장 긴 강이다. (ⓐ you를 yours로, ⓒ badder를 worse로, ⓔ big을 bigger로 고쳐야 한다.)",
 h:["본책 p.106 ‘비교 대상은 문법적으로 형태가 같아야 한다’와 ‘불규칙 비교급과 최상급’ 표, p.108 ‘2 비교급 + and + 비교급’을 펴세요.","1) ⓐ는 hair(머리카락)와 비교할 대상이 같은 종류인지 보세요.  2) ⓒ는 bad(나쁜)의 비교급, ⓔ는 and 앞뒤가 같은 말인지 확인해요.","옳은 문장은 두 개예요. 긴 형용사 diligent(부지런한)에 more를 쓴 문장과 the longest river 문장이에요."],
 pen:"비교 대상 일치, bad - worse, 비교급 and 비교급 (같은 말)"}); }
A("T","T",19,"w",{q:"[서술형] (출제 포인트 3) [19-20] 우리말과 일치하도록 괄호 안의 말을 이용하여 문장을 완성하시오.<br>우리의 삶은 점점 더 편리해지고 있다. (convenient)<br>→ Our lives are getting ___ .",ans:"more and more convenient",full:"Our lives are getting more and more convenient.",ko:"우리의 삶은 점점 더 편리해지고 있다.",
 h:["본책 p.108 ‘2 비교급 + and + 비교급’ 아래 주의 상자(more and more + 원급)를 펴세요.","1) ‘점점 더’는 같은 비교급을 and로 이어요.  2) convenient(편리한)는 긴 단어라 more를 앞에 붙여 비교급을 만들어요.","네 단어예요. 비교급을 만드는 m으로 시작하는 말을 and 앞뒤로 두 번 쓰고, 괄호 속 형용사를 그대로 붙여요."],
 pen:"more and more + 원급 = 점점 더 ~한"});
A("T","T",20,"w",{q:"[서술형] (출제 포인트 2) [19-20] 우리말과 일치하도록 괄호 안의 말을 이용하여 문장을 완성하시오.<br>나는 건강은 돈보다 훨씬 더 중요하다고 생각한다. (important)<br>→ I think health is ___ ___ ___ than money.",ans:"much more important (much 대신 even, far, a lot도 가능)",full:"I think health is much more important than money.",ko:"나는 건강은 돈보다 훨씬 더 중요하다고 생각한다.",
 h:["본책 p.106 ‘비교급 강조’ 설명을 펴세요.","1) ‘훨씬 더’는 비교급 앞에 much, even, far, a lot 중 하나를 써요.  2) important(중요한)는 긴 단어라 more를 앞에 붙여 비교급을 만들어요.","빈칸 세 개: m으로 시작하는 강조어(다른 것도 가능) / 비교급을 만드는 말 / 괄호 속 형용사"],
 pen:"much + 비교급 + than = ~보다 훨씬 더 …한"});
A("T","T",21,"w",{q:"[서술형] 주어진 문장을 한 문장으로 나타낼 때, 괄호 안의 말과 비교급을 이용하여 문장을 완성하시오.<br>I’m 13 years old. My grandmother is 65 years old.<br>→ My grandmother is ___ ___ ___ ___ me. (five, old)",ans:"five times older than",full:"My grandmother is five times older than me.",ko:"우리 할머니는 나보다 나이가 다섯 배 더 많으시다.",
 h:["본책 p.108 ‘1 배수 비교 표현: 배수사 + 비교급 + than’을 펴세요.","1) 13살의 5배가 65살이에요.  2) ‘몇 배 더 ~한’은 배수사(five times) + 비교급 + than 순서예요. old(나이 든)의 비교급을 써요.","빈칸 네 개: five / times / o로 시작하는 비교급 / than"],
 pen:"배수사 + 비교급 + than (five times older than)"});
A("T","T",22,"w",{q:"[서술형] (출제 포인트 1) 주어진 문장과 의미가 통하도록 <조건>에 맞게 문장을 완성하시오.<br>Your room is bigger than mine.<br>조건: as와 big을 이용할 것<br>→ My room is ___ yours.",ans:"not as big as 또는 not so big as",full:"My room is not as big as yours. / My room is not so big as yours.",ko:"내 방은 네 방만큼 크지 않다. (= 네 방은 내 방보다 더 크다)",
 h:["본책 p.106 ‘1 원급 비교’에서 not as 〔so〕 ~ as 설명과 ‘원급 비교 부정 vs. 우등 비교 vs. 열등 비교’를 펴세요.","1) 처음 문장은 ‘네 방이 더 크다’예요. 같은 뜻을 내 방을 주어로 말해야 해요.  2) 내 방은 네 방만큼 크지 ‘않다’이니 부정이에요.","부정어로 시작하고, 그 뒤에 원급 비교(as ~ as) 틀을 이어요. 첫 as 대신 so도 쓸 수 있어요."],
 pen:"A is bigger than B = B is not as big as A"});
A("T","T",23,"w",{q:"[서술형] (출제 포인트 1) 괄호 안의 단어를 이용하여 각 그림을 묘사하는 문장을 완성하시오.<br>[그림: (1) 초록색 푹신한 소파에 앉아 책을 읽는 소녀와, 나무 벤치에 앉아 있는 소년. (2) 가격표가 둘 다 $1000인 손목시계와 반지.]<br>(1) The sofa is ___ ___ the chair. (comfortable)<br>(2) The watch is ___ ___ the ring. (expensive)<br>(알맞은 말을 차례로 쓰세요)",ans:"more comfortable than, as expensive as",full:"(1) The sofa is more comfortable than the chair. (2) The watch is as expensive as the ring.",ko:"(1) 그 소파는 그 의자보다 더 편안하다. (2) 그 시계는 그 반지만큼 비싸다.",
 h:["본책 p.106 ‘2 비교급 비교’와 ‘1 원급 비교’ 설명을 펴세요.","1) (1)은 푹신한 소파와 딱딱한 벤치를 보면 한쪽이 더 편안해요.  2) (2)는 가격표가 둘 다 같아서 ‘같은 정도’예요. 같으면 원급 비교, 다르면 비교급 비교예요.","(1)은 긴 형용사의 비교급 + ‘~보다’, (2)는 같은 정도를 나타내는 원급 비교 틀이에요."],
 pen:"정도가 다르면 비교급 + than, 같으면 as + 원급 + as"});
A("T","T",24,"w",{q:"[서술형] (출제 포인트 2) [24-26] 우리말과 일치하도록 괄호 안의 말을 바르게 배열하시오.<br>내 점수는 너의 것보다 훨씬 더 높다. (yours, a lot, higher, than, is)<br>→ My score ___ .",ans:"is a lot higher than yours",full:"My score is a lot higher than yours.",ko:"내 점수는 너의 것보다 훨씬 더 높다.",
 h:["본책 p.106 ‘비교급 강조’ 설명을 펴세요.","1) 동사 is(원형 be 이다)가 주어 My score 바로 뒤에 와요.  2) ‘훨씬 더’의 a lot은 비교급 higher(원형 high 높은의 비교급) 바로 앞에 놓아요.","동사로 시작하고, ‘훨씬’(두 단어)을 비교급 바로 앞에 둔 뒤 ‘~보다 너의 것’으로 끝내요."],
 pen:"a lot + 비교급 + than = ~보다 훨씬 더 …한"});
A("T","T",25,"w",{q:"[서술형] (출제 포인트 4) [24-26] 우리말과 일치하도록 괄호 안의 말을 바르게 배열하시오.<br>뉴욕은 세계에서 가장 붐비는 도시들 중 하나이다. (crowded, most, the, one, cities, of)<br>→ New York is ___ in the world.",ans:"one of the most crowded cities",full:"New York is one of the most crowded cities in the world.",ko:"뉴욕은 세계에서 가장 붐비는 도시들 중 하나이다.",
 h:["본책 p.108 ‘4 one of the + 최상급 + 복수명사’를 펴세요.","1) 틀은 one of the + 최상급 + 복수명사예요.  2) crowded(붐비는)는 긴 단어라 most를 앞에 붙이고, cities(도시들)는 복수명사예요.","‘~ 중 하나’(세 단어)로 시작하고, ‘가장’ + 형용사 + 복수명사를 이어요."],
 pen:"one of the most + 원급 + 복수명사"});
A("T","T",26,"w",{q:"[서술형] (출제 포인트 3) [24-26] 우리말과 일치하도록 괄호 안의 말을 바르게 배열하시오.<br>우리가 동굴 안으로 더 깊이 들어갈수록 더 어두워졌다. (we, the cave, the deeper, the darker, went into)<br>→ ___ , ___ it became.",ans:"The deeper we went into the cave, the darker",full:"The deeper we went into the cave, the darker it became.",ko:"우리가 동굴 안으로 더 깊이 들어갈수록 더 어두워졌다.",
 h:["본책 p.108 ‘3 The + 비교급 ~, the + 비교급 ...’의 어순 설명을 펴세요.","1) 앞 절은 The + 비교급 + 주어 + 동사 순서예요.  2) 뒤 절은 the + 비교급 + it became(원형 become ~해지다)으로 이미 it이 있어요.","앞 빈칸은 The + 비교급 + 주어 + 동사 + 장소 순서, 뒤 빈칸은 남은 the + 비교급 한 덩어리예요."],
 pen:"The + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사"});
A("T","T",27,"w",{q:"[서술형] (고난도, 출제 포인트 1, 4) 밑줄 친 ⓐ ~ ⓓ 중 어법상 틀린 것 두 개를 찾아 기호를 쓰고 바르게 고쳐 쓰시오.<br>Sloths are ⓐ <u>more slow</u> than snails. Their eyesight is ⓑ <u>not very good</u>, and they spend ⓒ <u>most of their time</u> living in trees. This is why they are one of ⓓ <u>the slowest animal</u> in the world. (* sloth 나무늘보 snail 달팽이)<br>( ___ ) → ___<br>( ___ ) → ___",ans:"ⓐ slower, ⓓ the slowest animals",full:"ⓐ more slow → slower / ⓓ the slowest animal → the slowest animals",ko:"나무늘보는 달팽이보다 더 느리다. 그들의 시력은 매우 좋지는 않고, 그들은 대부분의 시간을 나무에서 사는 데 보낸다. 이것이 그들이 세계에서 가장 느린 동물들 중 하나인 이유이다.",
 h:["본책 p.106 ‘2 비교급 비교’와 p.108 ‘4 one of the + 최상급 + 복수명사’를 펴세요.","1) ⓐ는 slow(느린)처럼 짧은 단어의 비교급을 어떻게 만드는지 보세요.  2) ⓓ는 one of the 뒤의 명사가 단수인지 복수인지 확인해요. ⓑ와 ⓒ는 맞는 표현이에요.","ⓐ는 s로 시작하는 비교급 한 단어, ⓓ는 the slowest 뒤 명사 끝에 s를 붙여요."],
 pen:"짧은 형용사 비교급 = -er (slower) / one of the 최상급 + 복수명사"});
A("T","T",28,"w",{q:"[서술형] (최신기출) 표의 내용과 일치하도록 괄호 안의 말을 이용하여 지시대로 문장을 완성하시오.<br>[표: Giraffe 기린 — 몸무게 800 kg, 나이 10 / Lion 사자 — 200 kg, 8 / Monkey 원숭이 — 5 kg, 5]<br>(1) 배수사와 비교급을 사용한 문장<br>The giraffe is ___ ___ ___ ___ the lion. (heavy, four)<br>(2) 원급을 사용한 문장<br>The monkey is ___ ___ ___ ___ the giraffe. (old, not)<br>(알맞은 말을 차례로 쓰세요)",ans:"four times heavier than, not as old as 또는 not so old as",full:"(1) The giraffe is four times heavier than the lion. (2) The monkey is not as old as the giraffe.",ko:"(1) 기린은 사자보다 네 배 더 무겁다. (2) 원숭이는 기린만큼 나이가 많지 않다.",
 h:["본책 p.108 ‘1 배수 비교 표현’과 p.106 ‘1 원급 비교’의 not as 〔so〕 ~ as 설명을 펴세요.","1) (1) 기린 800 kg은 사자 200 kg의 네 배예요. 배수사 + 비교급 + than 틀이에요.  2) (2) 원숭이 나이 5는 기린 10보다 적어요. 원급을 써야 하니 not as ~ as예요.","(1)은 배수사(두 단어) + h로 시작하는 비교급 + ‘~보다’, (2)는 부정어 + 원급 비교(as ~ as) 틀이에요. heavy는 y를 i로 바꿔요."],
 pen:"배수사 + 비교급 + than / not as + 원급 + as"});

A("T","T",23,"w",{q:"[서술형] (출제 포인트 3) 우리말과 일치하도록 괄호 안의 말을 바르게 배열하시오.<br>나는 그에게 컴퓨터 기술을 배우라고 조언했다. (I, him, learn, advised, to, computer skills)<br>→ ___ .",ans:"I advised him to learn computer skills.",full:"I advised him to learn computer skills.",ko:"나는 그에게 컴퓨터 기술을 배우라고 조언했다.",

A("T","T",25,"w",{q:"[서술형] 밑줄 친 ⓐ ~ ⓔ 중 어법상 틀린 것을 두 개 찾아 기호를 쓰고, 바르게 고쳐 쓰시오.<br>Last Saturday, I hung out with my friends until late at night. The next morning, I felt ⓐ <u>cold and sick</u>. Mom wanted me ⓑ <u>get up</u> early, but I couldn’t. She saw me ⓒ <u>lying in bed</u> and made ⓓ <u>chicken soup me</u>. The hot soup made me ⓔ <u>feel much better</u>.<br>( ) → ___<br>( ) → ___",ans:"ⓑ → to get up, ⓓ → chicken soup for me 또는 me chicken soup",full:"ⓑ Mom wanted me to get up early. / ⓓ She made chicken soup for me. (또는 made me chicken soup)",ko:"지난 토요일에 나는 친구들과 밤늦게까지 어울려 놀았다. 다음 날 아침, 나는 춥고 몸이 안 좋았다. 엄마는 내가 일찍 일어나기를 원하셨지만, 나는 그럴 수 없었다. 엄마는 내가 침대에 누워 있는 것을 보고 내게 치킨 수프를 만들어 주셨다. 뜨거운 수프는 내가 훨씬 나아지게 해 주었다.",
 h:["본책 p.120 ‘1 목적격보어가 필요한 동사’(want는 to부정사)와 p.118 ‘2 수여동사’ 설명을 펴세요.","1) ⓐ felt(원형 feel 느끼다) + 형용사는 맞아요. ⓒ saw(원형 see 보다)는 지각동사 + -ing라서 맞아요. ⓔ made(원형 make 시키다)는 사역동사 + 동사원형이라 맞아요.  2) 나머지 둘은 wanted(원형 want 원하다) 뒤 보어 형태와, ‘made chicken soup me’의 어순이 어색해요.","틀린 것은 두 개예요. 하나는 앞에 한 단어(t로 시작)를 붙이면 되고, 다른 하나는 어순을 바꾸거나 전치사를 넣는 두 가지 방법으로 고칠 수 있어요."],

A(1,"A",1,"c",{q:"I set the table ( while / unless ) Dad was cooking pasta.",opts:["while","unless"],ans:"while",full:"I set the table while Dad was cooking pasta.",ko:"나는 아빠가 파스타를 요리하시는 동안 식탁을 차렸다.",
 h:["본책 p.130 ‘1 시간을 나타내는 접속사’ 표에서 while(~하는 동안)을 보세요.","1) 아빠가 요리하는 중(was cooking)에 내가 식탁을 차렸어요.  2) 두 가지 일이 같은 때에 일어났으니 시간 접속사가 필요해요.","unless(~하지 않으면)는 조건이라 어울리지 않아요. w로 시작하는 쪽이에요."],
 pen:"while = ~하는 동안 (같은 시간에 일어난 두 일)"});
A(1,"A",2,"c",{q:"Emily couldn’t call you ( until / because ) she was very busy.",opts:["until","because"],ans:"because",full:"Emily couldn’t call you because she was very busy.",ko:"Emily는 매우 바빴기 때문에 너에게 전화할 수 없었다.",
 h:["본책 p.130 ‘2 이유·결과를 나타내는 접속사’ 표를 펴서 because를 보세요.","1) 전화를 못 한 일(결과)과 매우 바빴다(원인)가 이어져요.  2) 뒤에 오는 말이 원인이 되면 ‘~때문에’를 써요.","until(~할 때까지)은 시간이라 맞지 않아요. b로 시작하는 쪽이에요."],
 pen:"because + 원인 = ~때문에 (이유)"});
A(1,"A",3,"c",{q:"It was so hot ( as / that ) I couldn’t do anything.",opts:["as","that"],ans:"that",full:"It was so hot that I couldn’t do anything.",ko:"너무 더워서 나는 아무것도 할 수 없었다.",
 h:["본책 p.130 ‘2 이유·결과를 나타내는 접속사’ 표의 so ~ that ... 줄을 펴세요.","1) 빈칸 앞에 so hot(너무 더운)이 있어요.  2) 「so ~ that ...」은 ‘매우 ~해서 …하다’라는 짝꿍 표현이에요.","so와 짝이 되는 한 단어는 t로 시작해요."],
 pen:"so + 형용사 + that + 주어 + 동사 = 매우 ~해서 …하다"});
A(1,"A",4,"c",{q:"Steve got good grades ( if / even though ) he didn’t study hard.",opts:["if","even though"],ans:"even though",full:"Steve got good grades even though he didn’t study hard.",ko:"Steve는 열심히 공부하지 않았지만 좋은 성적을 받았다.",
 h:["본책 p.130 ‘3 조건·양보를 나타내는 접속사’ 표의 though, although, even though 줄을 보세요.","1) 열심히 공부하지 않았다와 좋은 성적을 받았다는 서로 반대되는 내용이에요.  2) 반대되는 내용을 이으면 ‘비록 ~이지만’이라는 양보의 접속사가 필요해요.","조건의 if(~하면)는 어울리지 않아요. 두 단어로 된 쪽이에요."],
 pen:"even though = 비록 ~이지만 (앞뒤 내용이 반대)"});
A(1,"B",1,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>If you <u>will call</u> her, she will be pleased.",ans:"call",full:"If you call her, she will be pleased.",ko:"네가 그녀에게 전화하면 그녀는 기뻐할 것이다.",
 h:["본책 p.130 맨 아래 ‘시간·조건 부사절의 시제’ 설명을 펴세요.","1) If가 이끄는 부분은 조건을 나타내는 부사절이에요.  2) 조건 부사절에서는 앞일이어도 will(~할 것이다)을 쓰지 않고 현재시제를 써요.","will을 빼고 call(전화하다)만 쓰면 돼요. 한 단어예요."],
 pen:"시간·조건 부사절 = 미래 대신 현재시제 (If you call)"});
A(1,"B",2,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>Jack didn’t come <u>because of</u> he was sick.",ans:"because",full:"Jack didn’t come because he was sick.",ko:"Jack은 아팠기 때문에 오지 않았다.",
 h:["본책 p.130 ‘2 이유·결과를 나타내는 접속사’ 맨 아래 cf. 상자(because of + 명사(구))를 펴세요.","1) 밑줄 뒤에 he was sick(그는 아팠다)이라는 문장(주어 + 동사)이 와요.  2) because of는 뒤에 명사(구)만 올 수 있어요. 문장을 이으려면 접속사가 필요해요.","of를 빼면 돼요. b로 시작하는 한 단어예요."],
 pen:"because + 주어 + 동사 / because of + 명사(구)"});
A(1,"B",3,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>Unless you <u>don’t leave</u> now, you’ll be late for the meeting.",ans:"leave",full:"Unless you leave now, you’ll be late for the meeting.",ko:"네가 지금 떠나지 않으면 너는 회의에 늦을 것이다.",
 h:["본책 p.130 ‘3 조건·양보를 나타내는 접속사’ 아래 ‘주의’ 상자(unless에는 not을 함께 쓰지 않는다)를 펴세요.","1) unless는 이미 ‘~하지 않으면’이라는 부정의 뜻을 갖고 있어요.  2) 그러니 같은 문장에 don’t(원형 do 하다)를 또 쓰면 부정이 두 번이 돼요.","don’t를 빼고 leave(떠나다)만 남겨요. l로 시작해요."],
 pen:"Unless = if ~ not → 안에 not을 또 쓰지 않는다"});
A(1,"B",4,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>She’ll study abroad after she <u>will graduate</u> from high school.",ans:"graduates",full:"She’ll study abroad after she graduates from high school.",ko:"그녀는 고등학교를 졸업한 후에 외국에서 공부할 것이다.",
 h:["본책 p.130 맨 아래 ‘시간·조건 부사절의 시제’ 설명을 펴세요.","1) after(~한 후에)는 시간을 나타내는 접속사예요.  2) 시간 부사절에서는 앞일이어도 will을 쓰지 않고 현재시제를 써요. 주어 she는 3인칭 단수예요.","graduate(졸업하다)에 -s를 붙인 한 단어예요. g로 시작해요."],
 pen:"시간 부사절(after ~) = 현재시제 (after she graduates)"});
A(1,"C",1,"w",{q:"<보기>에서 알맞은 접속사를 골라 괄호 안의 말을 이용하여 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>보기: since / although / unless / when<br>두통이 있을 때 이 약을 먹어. (have)<br>→ Take this medicine ___ ___ ___ a headache.",ans:"when, you, have",full:"Take this medicine when you have a headache.",ko:"두통이 있을 때 이 약을 먹어.",
 h:["본책 p.130 ‘1 시간을 나타내는 접속사’ 표에서 ‘~할 때’를 뜻하는 말을 찾으세요.","1) ‘두통이 있을 때’는 때를 나타내요.  2) 접속사 다음에 주어 you(너)와 괄호 안의 have(원형 have 가지다, 있다)가 차례로 와요.","빈칸 세 개: w로 시작하는 접속사 / 주어 / 괄호 안의 동사 그대로"],
 pen:"when + 주어 + 동사 = ~할 때"});
A(1,"C",2,"w",{q:"<보기>에서 알맞은 접속사를 골라 괄호 안의 말을 이용하여 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>보기: since / although / unless / when<br>비밀번호를 잊어버려서 나는 그 파일을 열 수 없었다. (forget)<br>→ I couldn’t open the file ___ ___ ___ the password.",ans:"since, I, forgot",full:"I couldn’t open the file since I forgot the password.",ko:"비밀번호를 잊어버려서 나는 그 파일을 열 수 없었다.",
 h:["본책 p.130 ‘2 이유·결과를 나타내는 접속사’ 표에서 because와 같은 뜻의 접속사를 찾으세요.","1) 파일을 열 수 없었던 이유가 ‘비밀번호를 잊어버렸다’예요.  2) 지난 일이니 forget(잊어버리다)을 과거형으로 써요. 보기 중 ‘~이므로’(이유)를 뜻하는 말을 골라요.","빈칸 세 개: s로 시작하는 접속사 / 주어 I / f로 시작하는 과거형(불규칙 변화)"],
 pen:"since = ~이므로 (이유) / forget의 과거형 forgot"});
A(1,"C",3,"w",{q:"<보기>에서 알맞은 접속사를 골라 괄호 안의 말을 이용하여 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>보기: since / although / unless / when<br>비록 나는 피곤했지만 잠을 잘 수 없었다. (tired)<br>→ ___ ___ ___ ___, I couldn’t sleep.",ans:"Although, I, was, tired",full:"Although I was tired, I couldn’t sleep.",ko:"비록 나는 피곤했지만 잠을 잘 수 없었다.",
 h:["본책 p.130 ‘3 조건·양보를 나타내는 접속사’ 표에서 ‘비록 ~이지만’을 뜻하는 말을 찾으세요.","1) 피곤했다와 잠을 잘 수 없었다는 서로 반대되는 내용이에요.  2) 문장 맨 앞이니 대문자로 시작하고, ‘피곤했다’는 주어 I 뒤에 was(원형 be 이다) + tired가 와요.","빈칸 네 개: A로 시작하는 접속사 / 주어 / be동사 과거형 / 괄호 안의 말"],
 pen:"Although + 주어 + 동사 = 비록 ~이지만 (문장 맨 앞이면 대문자)"});
A(1,"C",4,"w",{q:"<보기>에서 알맞은 접속사를 골라 괄호 안의 말을 이용하여 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>보기: since / although / unless / when<br>네가 바쁘지 않으면 쇼핑하러 가자. (busy)<br>→ ___ ___ ___ ___, let’s go shopping.",ans:"Unless, you, are, busy",full:"Unless you are busy, let’s go shopping.",ko:"네가 바쁘지 않으면 쇼핑하러 가자.",
 h:["본책 p.130 ‘3 조건·양보를 나타내는 접속사’ 표의 unless 줄(= if ~ not)을 펴세요.","1) ‘바쁘지 않으면’은 부정의 조건이에요.  2) unless는 이미 ‘~하지 않으면’이라서 뒤에는 not 없이 긍정으로 써요. 주어 you(너)에는 are(원형 be 이다)를 써요.","빈칸 네 개: U로 시작하는 접속사 / 주어 / be동사 / 괄호 안의 말"],
 pen:"Unless you are busy = If you are not busy (not을 따로 쓰지 않음)"});
A(1,"MP",1,"w",{q:"시간: I’ll call you when I ( get / will get ) there.",ans:"get",full:"I’ll call you when I get there.",ko:"내가 거기에 도착하면 너에게 전화할게.",
 h:["본책 p.130 맨 아래 ‘시간·조건 부사절의 시제’ 설명을 펴세요.","1) when(~할 때)이 이끄는 부분은 시간 부사절이에요.  2) 시간 부사절에서는 앞일이어도 will을 쓰지 않아요.","will이 없는 쪽이에요. g로 시작해요."],
 pen:"when 시간 부사절 = 현재시제 (will 쓰지 않음)"});
A(1,"MP",2,"w",{q:"이유·결과: I wore a coat ( so / because ) it was cold outside.<br>He is ( so / as ) short that he can’t ride the roller coaster.<br>(알맞은 말 두 개를 차례로 쓰세요)",ans:"because, so",full:"I wore a coat because it was cold outside. / He is so short that he can’t ride the roller coaster.",ko:"밖이 추웠기 때문에 나는 코트를 입었다. / 그는 너무 키가 작아서 롤러코스터를 탈 수 없다.",
 h:["본책 p.130 ‘2 이유·결과를 나타내는 접속사’ 표의 because 줄과 so ~ that ... 줄을 펴세요.","1) 첫 문장은 코트를 입은 이유가 ‘밖이 추웠다’예요.  2) 둘째 문장은 뒤에 that이 있어요. 「so ~ that ...」으로 ‘너무 ~해서 …하다’가 돼요.","첫 번째는 b로 시작하는 이유의 접속사, 두 번째는 s로 시작하는 두 글자 단어예요."],
 pen:"because + 원인 / so + 형용사 + that ... (너무 ~해서 …하다)"});
A(1,"MP",3,"w",{q:"조건·양보: If you don’t hurry, you’ll be late. = ___ you hurry, you’ll be late.<br>( If / Although ) she is a millionaire, she lives in a small house.<br>(빈칸과 알맞은 말을 차례로 쓰세요)",ans:"Unless, Although",full:"If you don’t hurry, you’ll be late. = Unless you hurry, you’ll be late. / Although she is a millionaire, she lives in a small house.",ko:"서두르지 않으면 너는 늦을 것이다. = 서두르지 않으면 너는 늦을 것이다. / 그녀는 백만장자이지만 작은 집에서 산다.",
 h:["본책 p.130 ‘3 조건·양보를 나타내는 접속사’ 표를 펴세요. unless는 ‘if ~ not’과 같은 뜻이에요.","1) 첫 문장은 if ~ don’t(~하지 않으면)를 한 단어로 바꾸면 돼요.  2) 둘째 문장은 백만장자인데 작은 집에 산다는 반대되는 내용이에요.","첫 번째는 U로 시작하는 말, 두 번째는 A로 시작하는 ‘비록 ~이지만’이에요."],
 pen:"if ~ not = unless / 반대되는 내용 연결 = although"});

A(2,"CU",1,"c",{q:"택시를 타, 그러면 늦지 않을 거야.",opts:["Take a taxi, or you won’t be late.","Take a taxi, and you won’t be late."],ans:"Take a taxi, and you won’t be late.",full:"Take a taxi, and you won’t be late. = 택시를 타, 그러면 늦지 않을 거야.",ko:"택시를 타, 그러면 늦지 않을 거야.",
 h:["본책 p.132 ‘1 명령문, and / or ~’ 표를 펴세요.","1) 택시를 타면 어떤 좋은 결과가 생기는지 생각해 보세요.  2) 「명령문, and ~」는 ‘…해라, 그러면 ~’이고, 「명령문, or ~」는 ‘…해라, 그러지 않으면 ~’예요.","‘그러면’을 뜻하는 접속사가 있는 쪽이 답이에요. a로 시작해요."],
 pen:"명령문, and ~ = …해라, 그러면 ~ / 명령문, or ~ = …해라, 그러지 않으면 ~"});
A(2,"CU",2,"c",{q:"나는 여름도 겨울도 좋아하지 않는다.",opts:["I like either summer or winter.","I like neither summer nor winter."],ans:"I like neither summer nor winter.",full:"I like neither summer nor winter. = 나는 여름도 겨울도 좋아하지 않는다.",ko:"나는 여름도 겨울도 좋아하지 않는다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사(상관접속사)’ 표를 펴세요.","1) ‘A도 B도 아닌’은 둘 다 아니라는 뜻이에요.  2) either A or B는 ‘A나 B 둘 중 하나’라서 한쪽은 좋아한다는 말이 돼요.","둘 다 아니라는 뜻의 짝꿍은 n으로 시작하는 두 단어예요. 그 짝꿍이 들어 있는 문장을 고르세요."],
 pen:"neither A nor B = A도 B도 아닌 / either A or B = A나 B 둘 중 하나"});
A(2,"A",1,"c",{q:"Put on your coat, ( and / or ) you’ll be cold.",opts:["and","or"],ans:"or",full:"Put on your coat, or you’ll be cold.",ko:"코트를 입어라, 그러지 않으면 너는 추울 것이다.",
 h:["본책 p.132 ‘1 명령문, and / or ~’ 표를 펴세요.","1) 코트를 입으면 춥지 않고, 코트를 입지 않으면 추워요.  2) 뒤 문장이 ‘추울 것이다’이니 ‘입지 않으면’이라는 뜻이 되어야 해요.","‘그러지 않으면’을 뜻하는 쪽(두 글자, o로 시작)이 답이에요."],
 pen:"명령문, or ~ = …해라, 그러지 않으면 ~"});
A(2,"A",2,"c",{q:"I have been to ( either / both ) Spain and France.",opts:["either","both"],ans:"both",full:"I have been to both Spain and France.",ko:"나는 스페인과 프랑스에 둘 다 가 본 적이 있다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 표의 both A and B 줄을 펴세요.","1) 빈칸 뒤에 and가 있어요.  2) either(둘 중 하나)는 or와 짝이에요. and와 짝이 되는 말은 ‘A와 B 둘 다’라는 뜻이에요.","and와 짝이 되는 b로 시작하는 쪽이에요."],
 pen:"both A and B = A와 B 둘 다 (and와 짝) / either A or B (or와 짝)"});
A(2,"A",3,"c",{q:"Either Jack ( or / nor ) you have to clean the window.",opts:["or","nor"],ans:"or",full:"Either Jack or you have to clean the window.",ko:"Jack이나 너 둘 중 한 명이 창문을 닦아야 한다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 표의 either A or B 줄을 펴세요.","1) 빈칸 앞에 Either가 있어요.  2) either는 or와 짝이고, neither는 nor와 짝이에요.","Either와 짝이 되는 쪽은 두 글자 or예요."],
 pen:"either A or B (or와 짝) / neither A nor B (nor와 짝)"});
A(2,"A",4,"c",{q:"Neither Sally nor her brother ( like / likes ) baseball.",opts:["like","likes"],ans:"likes",full:"Neither Sally nor her brother likes baseball.",ko:"Sally도 그녀의 남동생도 야구를 좋아하지 않는다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 아래 수 일치 설명(both A and B는 복수, 나머지는 B에 일치)을 펴세요.","1) neither A nor B가 주어일 때 동사는 B에 맞춰요.  2) B는 her brother(그녀의 남동생)로 3인칭 단수예요.","3인칭 단수 현재형이니 s가 붙은 쪽이에요."],
 pen:"neither A nor B가 주어 = 동사는 B에 일치 (her brother → likes)"});
A(2,"B",1,"w",{q:"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>Jenny is good at not only running but also swimming.<br>→ Jenny is good at swimming ___ ___ ___ running.",ans:"as, well, as",full:"Jenny is good at swimming as well as running.",ko:"Jenny는 달리기뿐만 아니라 수영도 잘한다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 표의 not only A but (also) B 줄 오른쪽 (= B as well as A)를 펴세요.","1) not only A but also B는 순서를 바꿔 B as well as A로 쓸 수 있어요.  2) 본래 문장의 B는 swimming(수영), A는 running(달리기)이에요.","빈칸 세 개: a로 시작하는 말 / w로 시작하는 말 / 다시 a로 시작하는 말"],
 pen:"not only A but also B = B as well as A"});
A(2,"B",2,"w",{q:"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>Go straight, and you’ll find the restroom.<br>→ ___ ___ ___ straight, you’ll find the restroom.",ans:"If, you, go",full:"If you go straight, you’ll find the restroom.",ko:"곧장 가면 화장실을 찾을 것이다.",
 h:["본책 p.132 ‘1 명령문, and / or ~’ 표에서 「명령문, and ~」 = If ~ 줄을 펴세요.","1) 「명령문, and ~」는 ‘…하면 ~’이라는 조건의 뜻이에요.  2) 그래서 If 뒤에 주어 you와 명령문의 동사를 쓰면 같은 뜻이 돼요.","빈칸 세 개: I로 시작하는 접속사 / 주어 / go(가다)를 그대로"],
 pen:"명령문, and ~ = If you + 동사 ~ (…하면 ~)"});
A(2,"B",3,"w",{q:"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>Take this medicine, or you won’t get better.<br>→ ___ ___ ___ this medicine, you won’t get better.",ans:"Unless, you, take",full:"Unless you take this medicine, you won’t get better.",ko:"이 약을 먹지 않으면 너는 나아지지 않을 것이다.",
 h:["본책 p.132 ‘1 명령문, and / or ~’ 표에서 「명령문, or ~」 = Unless ~ 줄을 펴세요.","1) 「명령문, or ~」는 ‘…하지 않으면 ~’이라는 뜻이에요.  2) 빈칸은 세 칸이고, if ~ not의 뜻을 가진 한 단어가 맨 앞에 와요.","빈칸 세 개: U로 시작하는 접속사 / 주어 / take(먹다) 그대로. unless 뒤에는 not을 쓰지 않아요."],
 pen:"명령문, or ~ = Unless you + 동사 ~ (…하지 않으면 ~)"});
A(2,"C",1,"w",{q:"우리말과 일치하도록 괄호 안의 말과 접속사를 이용하여 문장을 완성하시오.<br>나는 행복하지도 슬프지도 않았다. (feel)<br>→ I ___ ___ happy ___ sad.",ans:"felt, neither, nor",full:"I felt neither happy nor sad.",ko:"나는 행복하지도 슬프지도 않았다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 표의 neither A nor B 줄을 펴세요.","1) ‘A도 B도 아닌’이므로 neither와 nor가 짝이에요.  2) 지난 일이니 feel(느끼다)을 과거형으로 써요.","빈칸 세 개: f로 시작하는 과거형(불규칙) / n으로 시작하는 말 / n으로 시작하는 말"],
 pen:"neither A nor B = A도 B도 아닌 / feel의 과거형 felt"});
A(2,"C",2,"w",{q:"우리말과 일치하도록 괄호 안의 말과 접속사를 이용하여 문장을 완성하시오.<br>언니와 나는 둘 다 뮤지컬 보는 것을 즐긴다. (enjoy)<br>→ ___ my sister ___ I ___ watching musicals.",ans:"Both, and, enjoy",full:"Both my sister and I enjoy watching musicals.",ko:"언니와 나는 둘 다 뮤지컬 보는 것을 즐긴다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 아래 수 일치 설명을 펴세요. both A and B는 항상 복수 취급해요.","1) ‘A와 B 둘 다’는 both A and B예요.  2) 주어가 둘이니 복수 취급이고, enjoy(즐기다)에는 -s를 붙이지 않아요.","빈칸 세 개: B로 시작하는 말 / a로 시작하는 말 / 괄호 안의 동사 그대로"],
 pen:"both A and B = 항상 복수 취급 (enjoy에 -s 안 붙임)"});
A(2,"C",3,"w",{q:"우리말과 일치하도록 괄호 안의 말과 접속사를 이용하여 문장을 완성하시오.<br>너는 점심으로 햄버거나 샌드위치 중 하나를 먹을 수 있다. (have)<br>→ You can ___ ___ a hamburger ___ a sandwich for lunch.",ans:"have, either, or",full:"You can have either a hamburger or a sandwich for lunch.",ko:"너는 점심으로 햄버거나 샌드위치 중 하나를 먹을 수 있다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 표의 either A or B 줄을 펴세요.","1) ‘A나 B 둘 중 하나’는 either A or B예요.  2) can(~할 수 있다) 뒤에는 동사원형이 오므로 괄호 안의 have(원형 have 먹다)를 그대로 써요.","빈칸 세 개: 괄호 안의 동사 / e로 시작하는 말 / 두 글자 or"],
 pen:"either A or B = A나 B 둘 중 하나 / can + 동사원형"});
A(2,"C",4,"w",{q:"우리말과 일치하도록 괄호 안의 말과 접속사를 이용하여 문장을 완성하시오.<br>너뿐만 아니라 Chris도 연극부에 가입하고 싶어 한다. (want)<br>→ ___ ___ you ___ ___ Chris ___ to join the drama club.",ans:"Not, only, but, also, wants",full:"Not only you but also Chris wants to join the drama club.",ko:"너뿐만 아니라 Chris도 연극부에 가입하고 싶어 한다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’의 not only A but (also) B 줄과 아래 수 일치 설명을 펴세요.","1) ‘A뿐만 아니라 B도’는 not only A but also B예요.  2) 주어일 때 동사는 B에 맞춰요. B는 Chris로 3인칭 단수예요. want(원하다)에도 -s가 필요해요.","빈칸 다섯 개: N / o / b / a로 시작하는 말 네 개와, 마지막은 want에 -s를 붙인 말"],
 pen:"not only A but also B가 주어 = 동사는 B에 일치 (Chris → wants)"});
A(2,"MP",1,"w",{q:"명령문, and / or: Go straight, ( and / or ) you’ll find the bank.<br>Go to bed early, ( and / or ) you’ll be tired tomorrow.<br>(알맞은 말 두 개를 차례로 쓰세요)",ans:"and, or",full:"Go straight, and you’ll find the bank. / Go to bed early, or you’ll be tired tomorrow.",ko:"곧장 가라, 그러면 은행이 보일 것이다. / 일찍 자라, 그러지 않으면 내일 피곤할 것이다.",
 h:["본책 p.132 ‘1 명령문, and / or ~’ 표를 펴세요.","1) 첫 문장은 곧장 가면 은행을 찾는다는 좋은 결과예요.  2) 둘째 문장은 ‘피곤할 것이다’이니 일찍 자지 않으면 생기는 결과예요.","첫 번째는 ‘그러면’ 쪽(a로 시작), 두 번째는 ‘그러지 않으면’ 쪽(o로 시작)이에요."],
 pen:"명령문, and = 그러면 / 명령문, or = 그러지 않으면"});
A(2,"MP",2,"w",{q:"짝을 이루는 접속사: Both Yuna and I ( am / are ) very hungry.<br>Either you or I ( am / are ) wrong.<br>I’m good at neither math ( or / nor ) English.<br>(알맞은 말 세 개를 차례로 쓰세요)",ans:"are, am, nor",full:"Both Yuna and I are very hungry. / Either you or I am wrong. / I’m good at neither math nor English.",ko:"Yuna와 나는 둘 다 매우 배고프다. / 너 아니면 내가 틀렸다. / 나는 수학도 영어도 잘하지 못한다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 표와 아래 수 일치 설명을 펴세요.","1) both A and B는 항상 복수 취급해요.  2) either A or B는 B에 맞춰요. B가 I(나)이니 I에 맞는 be동사(원형 be 이다)를 골라요. neither와 짝은 or가 아니에요.","첫 번째는 a로 시작하는 복수형, 두 번째는 I와 쓰는 짧은 말, 세 번째는 n으로 시작해요."],
 pen:"both A and B = 복수 / either A or B = B에 일치 / neither ~ nor"});

// ===================== 서술형 대비 (p.134) =====================
A("SW","SW",1,"w",{q:"[오류 수정] 어법에 맞게 문장 고쳐 쓰기<br><u>Unless Jack doesn’t come</u>, I won’t go to the party.<br>→ ___, I won’t go to the party.",ans:"Unless Jack comes 또는 If Jack doesn’t come",full:"Unless Jack comes, I won’t go to the party. 또는 If Jack doesn’t come, I won’t go to the party.",ko:"Jack이 오지 않으면 나는 파티에 가지 않을 것이다.",
 h:["본책 p.130 ‘3 조건·양보를 나타내는 접속사’ 아래 ‘주의’ 상자(unless에는 not을 함께 쓰지 않는다)를 펴세요.","1) Unless와 doesn’t가 함께 있어서 부정이 두 번이에요.  2) 고치는 방법은 두 가지예요. Unless를 살리고 not을 없애거나, Unless 대신 If를 써서 not을 살려요.","두 가지 모두 정답이에요. Jack 뒤에 오는 동사에 -s가 붙은 형태, 또는 If로 시작하는 문장이에요."],
 pen:"Unless 안에 not 또 쓰기 X → Unless + 긍정 또는 If + 부정"});
A("SW","SW",2,"w",{q:"[오류 수정] 어법에 맞게 문장 고쳐 쓰기<br>Emily brought her umbrella <u>because of it was cloudy</u>.<br>→ Emily brought her umbrella ___.",ans:"because it was cloudy",full:"Emily brought her umbrella because it was cloudy.",ko:"Emily는 날이 흐렸기 때문에 우산을 가져왔다.",
 h:["본책 p.130 ‘2 이유·결과를 나타내는 접속사’ 맨 아래 cf. 상자(because of + 명사(구))를 펴세요.","1) 뒤에 it was cloudy(날이 흐렸다)라는 문장(주어 + 동사)이 와요.  2) because of는 명사(구) 앞에만 쓰고, 문장 앞에는 because를 써요.","of만 빼고 나머지는 그대로 써요. 세 단어가 더 이어지는 형태예요."],
 pen:"because + 문장 / because of + 명사(구)"});
A("SW","SW",3,"w",{q:"[오류 수정] 어법에 맞게 문장 고쳐 쓰기<br>I’ll call you back <u>when the meeting will be over</u>.<br>→ I’ll call you back ___.",ans:"when the meeting is over",full:"I’ll call you back when the meeting is over.",ko:"회의가 끝나면 내가 다시 전화할게.",
 h:["본책 p.130 맨 아래 ‘시간·조건 부사절의 시제’ 설명을 펴세요.","1) when(~할 때)이 이끄는 부분은 시간 부사절이에요.  2) 시간 부사절에서는 앞일이어도 will be 대신 현재시제를 써요. 주어 the meeting은 3인칭 단수예요.","will be를 be동사 현재형 한 단어로 바꿔요. 두 글자 단어예요."],
 pen:"when 시간 부사절 = will be (X) → is (현재시제)"});
A("SW","SW",4,"w",{q:"[오류 수정] 어법에 맞게 문장 고쳐 쓰기<br>Henry as well as you <u>are responsible for the problem</u>.<br>→ Henry as well as you ___.",ans:"is responsible for the problem",full:"Henry as well as you is responsible for the problem.",ko:"너뿐만 아니라 Henry도 그 문제에 책임이 있다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 아래 수 일치 설명에서 ‘B as well as A’ 문장(Tom as well as you is wrong)을 보세요.","1) B as well as A는 not only A but also B와 같은 뜻이에요. 동사는 B에 맞춰요.  2) 여기서 B는 Henry예요. Henry는 3인칭 단수예요.","are를 바꿔요. be동사 3인칭 단수형(i로 시작하는 두 글자)을 써요."],
 pen:"B as well as A가 주어 = 동사는 B(Henry)에 일치 → is"});
A("SW","SW",5,"w",{q:"[문장 전환] 같은 의미의 문장으로 바꿔 쓰기<br>Speak loudly, or I won’t be able to hear you.<br>→ Unless ___, I won’t be able to hear you.",ans:"you speak loudly",full:"Unless you speak loudly, I won’t be able to hear you.",ko:"네가 크게 말하지 않으면 나는 네 말을 들을 수 없을 것이다.",
 h:["본책 p.132 ‘1 명령문, and / or ~’ 표에서 「명령문, or ~」 = Unless ~ 줄을 펴세요.","1) 「명령문, or ~」는 ‘…하지 않으면 ~’이라는 뜻이에요.  2) Unless 뒤에는 주어 you를 쓰고, 명령문의 동사를 긍정으로 이어요.","you로 시작해요. speak(말하다)와 부사 loudly(크게)가 이어져요."],
 pen:"명령문, or ~ = Unless you + 동사 ~ (not 없이)"});
A("SW","SW",6,"w",{q:"[문장 전환] 같은 의미의 문장으로 바꿔 쓰기<br>Judy hates insects, and her sister also hates insects.<br>→ Both ___.",ans:"Judy and her sister hate insects",full:"Both Judy and her sister hate insects.",ko:"Judy와 그녀의 언니(여동생)는 둘 다 곤충을 싫어한다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 표의 both A and B 줄을 펴세요.","1) 두 사람이 똑같이 곤충을 싫어하니 ‘A와 B 둘 다’로 합쳐요.  2) both A and B가 주어면 항상 복수 취급이라 hates(원형 hate 싫어하다)에서 -s를 빼요.","Judy로 시작해서 and를 넣고, 마지막에 insects까지 쓰는 한 문장 덩어리예요."],
 pen:"both A and B = 복수 취급 (hates → hate)"});
A("SW","SW",7,"w",{q:"[문장 전환] 같은 의미의 문장으로 바꿔 쓰기<br>Chris doesn’t know the answer. James doesn’t know the answer, either.<br>→ Neither ___.",ans:"Chris nor James knows the answer",full:"Neither Chris nor James knows the answer.",ko:"Chris도 James도 그 답을 모른다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 표의 neither A nor B 줄과 아래 수 일치 설명을 펴세요.","1) 두 사람 모두 모른다는 뜻이니 ‘A도 B도 아닌’이에요.  2) neither A nor B는 동사를 B에 맞춰요. B는 James로 3인칭 단수예요. know(알다)는 부정이 아니라 긍정형으로 써요.","Chris로 시작해서 nor가 오고, know(알다)에 -s를 붙여요."],
 pen:"neither A nor B = 동사는 B에 일치, 동사 자체는 긍정형 (knows)"});
A("SW","SW",8,"w",{q:"[문장 전환] 같은 의미의 문장으로 바꿔 쓰기<br>Unless you are an adult, you can’t watch this movie.<br>→ If ___, you can’t watch this movie.",ans:"you aren’t an adult 또는 you’re not an adult",full:"If you aren’t an adult, you can’t watch this movie. 또는 If you’re not an adult, you can’t watch this movie.",ko:"네가 성인이 아니면 너는 이 영화를 볼 수 없다.",
 h:["본책 p.130 ‘3 조건·양보를 나타내는 접속사’ 표의 unless 줄(= if ~ not)을 펴세요.","1) unless는 ‘if ~ not’과 같아요.  2) 그래서 If로 바꾸면 이번에는 not(부정)을 직접 넣어야 해요.","you로 시작해요. be동사 + not을 줄여 쓴 말로 두 가지 모두 가능해요."],
 pen:"Unless you are ~ = If you aren’t ~ (not을 직접 씀)"});
A("SW","SW",9,"w",{q:"[빈칸 완성] 괄호 안의 말을 이용하여 빈칸 완성하기<br>지하철을 타, 그러면 제시간에 그곳에 도착할 거야. (get there)<br>Take the subway, ___ on time.",ans:"and you’ll get there",full:"Take the subway, and you’ll get there on time.",ko:"지하철을 타, 그러면 제시간에 그곳에 도착할 거야.",
 h:["본책 p.132 ‘1 명령문, and / or ~’ 표의 「명령문, and ~」(…해라, 그러면 ~) 줄을 펴세요.","1) 지하철을 타면 좋은 결과가 생겨요.  2) ‘그러면’은 접속사로 이어 주고, 뒤에는 앞일이니 you’ll(= you will) 뒤에 괄호 안의 말을 써요.","‘그러면’을 뜻하는 a로 시작하는 접속사로 시작하고, 괄호 안의 get there(그곳에 도착하다)로 끝나요."],
 pen:"명령문, and + 주어 + will ~ = …해라, 그러면 ~"});
A("SW","SW",10,"w",{q:"[빈칸 완성] 괄호 안의 말을 이용하여 빈칸 완성하기<br>그는 너무 피곤해서 빨리 잠들었다. (tired, fall asleep)<br>He was ___ quickly.",ans:"so tired that he fell asleep",full:"He was so tired that he fell asleep quickly.",ko:"그는 너무 피곤해서 빨리 잠들었다.",

A("PT","PT",1,"w",{q:"(출제 포인트 1) 괄호 안의 말을 이용하여 대화를 완성하시오.<br>A Jack, how about going to the park tomorrow?<br>B If the weather ___ good, I’ll go with you. (be)",ans:"is",full:"B If the weather is good, I’ll go with you.",ko:"A Jack, 내일 공원에 가는 게 어때? B 날씨가 좋으면 너와 같이 갈게.",

 h:["본책 p.130 ‘2 이유·결과’ 표와 ‘3 조건·양보’ 표를 나란히 펴세요.","1) 다섯 문장을 하나씩 읽으며 앞뒤 내용이 이유·결과인지, 반대되는 내용인지 따져 보세요.  2) 반대되는 내용이면 Though·Although가 맞고, 원인과 결과이면 so·because·since가 맞아요.","①~④는 자연스러워요. 마지막 문장은 ‘피곤했지만 일찍 잤다’가 어울리는지 다시 읽어 보세요."],

 pen:"명령문, or ~ = If you don’t ~ = Unless you ~ (둘 다 가능)"}); }

 h:["본책 p.130 ‘1 시간’, ‘2 이유·결과’, ‘3 조건·양보’ 표를 차례로 펴세요.","1) 다섯 문장에 각각 보기의 접속사를 넣어 해석해 보세요.  2) 의미가 자연스럽지 않은 문장 하나만 있어요. 꽃이 죽는 문장은 ‘돌보지 않으면’이라는 조건이 어울려요.","마지막 문장(ⓔ)을 확인해 보세요. 나머지 네 개는 올바르게 짝지어졌어요."],

A("T","T",13,"c",{q:"(출제 포인트 1) [13-14] 밑줄 친 부분이 어법상 틀린 것을 고르시오.<br>① After the rain <u>will stop</u>, we will go out.<br>② If we <u>don’t leave</u> now, we’ll miss the train.<br>③ I can bake you cookies if you <u>want</u> some.<br>④ I’ll call you when I <u>arrive</u> at the airport.<br>⑤ If it <u>is</u> sunny tomorrow, let’s go on a picnic.",opts:o,ans:o[0],full:"① After the rain will stop, we will go out. (X) → After the rain stops, we will go out.",ko:"① 비가 그치면 우리는 외출할 것이다. (시간 부사절에서는 미래의 일도 현재시제로 쓴다: stops, 원형 stop 멈추다) ② 우리가 지금 떠나지 않으면 기차를 놓칠 것이다. ③ 네가 원하면 쿠키를 구워 줄 수 있다. ④ 나는 공항에 도착하면 너에게 전화할게. ⑤ 내일 날씨가 맑으면 소풍을 가자.",
 h:["본책 p.130 맨 아래 ‘시간·조건 부사절의 시제’ 설명을 펴세요.","1) 각 문장에서 After, If, when이 이끄는 부사절 안의 동사를 살펴보세요.  2) 시간·조건 부사절에는 앞일이어도 will을 쓰지 않아요.","will이 들어간 부사절이 있어요. 첫 번째 문장을 확인하세요."],
 pen:"시간·조건 부사절 = will 쓰지 않음 (After the rain stops)"}); }

A("T","T",14,"c",{q:"(출제 포인트 4) [13-14] 밑줄 친 부분이 어법상 틀린 것을 고르시오.<br>① Both Tom and Joe <u>were</u> late for school.<br>② Neither her father nor her mother <u>is</u> tall.<br>③ Not only Seoul but also Busan <u>is</u> a big city.<br>④ Either we or Jane <u>have</u> to go there.<br>⑤ Paul, as well as you, <u>is</u> important to me.",opts:o,ans:o[3],full:"④ Either we or Jane have to go there. (X) → Either we or Jane has to go there.",ko:"④ 우리나 Jane 둘 중 한 명이 그곳에 가야 한다. (either A or B가 주어일 때 동사는 B에 일치시킨다: has, 원형 have 가지다) ① Tom과 Joe는 둘 다 학교에 늦었다. ② 그녀의 아버지도 어머니도 키가 크지 않다. ③ 서울뿐만 아니라 부산도 큰 도시이다. ⑤ 너뿐만 아니라 Paul도 나에게 중요하다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 아래 수 일치 설명을 펴세요. both A and B는 복수, 나머지는 B에 일치해요.","1) 다섯 문장에서 짝을 이루는 접속사와 동사를 하나씩 확인하세요.  2) either A or B가 주어이면 동사는 B에 맞춰요. B가 단수인지 복수인지 따져 보세요.","B가 Jane(3인칭 단수)이어서 동사 모양이 달라져야 하는 문장이 있어요. ④번 보기를 확인하세요."],
 pen:"either A or B가 주어 = 동사는 B에 일치 (Jane → has)"}); }

A("T","T",15,"c",{q:"다음 중 밑줄 친 부분을 바르게 고친 것은? |4점|<br>① I was late, <u>but</u> I took a taxi. (→ because)<br>② I felt worse <u>after</u> I took the medicine. (→ if)<br>③ <u>Before</u> I was watching a movie, I fell asleep. (→ While)<br>④ He was hungry <u>unless</u> he didn’t have lunch. (→ though)<br>⑤ Exercise more, <u>or</u> you’ll be healthy. (→ so)",opts:o,ans:o[2],full:"③ Before I was watching a movie, I fell asleep. → While I was watching a movie, I fell asleep.",ko:"③ 나는 영화를 보는 동안 잠이 들었다. (While이 알맞다) ① 나는 늦었기 때문에 택시를 탔다. ② 나는 약을 먹은 후에 기분이 더 나빠졌다. ④ 그는 점심을 먹지 않았기 때문에 배가 고팠다. ⑤ 더 운동해라, 그러면 너는 건강해질 것이다.",
 h:["본책 p.130 ‘1 시간’, ‘2 이유·결과’, ‘3 조건·양보’ 표를 차례로 펴세요.","1) 원래 문장의 뜻을 먼저 생각하고, 괄호 안 말로 바꿨을 때 의미가 자연스러운지 확인하세요.  2) 틀린 것들은 원인과 결과, 조건 등이 어색해져요. 영화를 보던 중에 잠이 든 문장은 ‘~하는 동안’이 어울려요.","③번 보기는 ‘영화를 보는 동안 잠이 들었다’가 자연스러워요. 이 보기를 확인하세요."],
 pen:"영화를 보는 동안 = while + 진행 중인 일"}); }

A("T","T",17,"c",{q:"(고난도) 밑줄 친 ⓐ ~ ⓔ 중 대화의 흐름상 어색한 것은? |5점|<br>A I’m so worried about the English speaking test.<br>B ⓐ <u>Don’t worry.</u> ⓑ <u>You’ll do well.</u><br>A ⓒ <u>You are a good English speaker.</u> ⓓ <u>Please tell me how I can speak English well like you.</u><br>B ⓔ <u>Practice a lot, or you will be good at speaking English.</u>",opts:o,ans:o[4],full:"⑤ ⓔ Practice a lot, or you will be good at speaking English. (X) → Practice a lot, and you will be good at speaking English.",ko:"⑤ 많이 연습해라, 그러면 너는 영어 말하기를 잘하게 될 것이다. (or가 아닌 and로 말해야 한다) A: 나는 영어 말하기 시험이 너무 걱정돼. B: 걱정하지 마. 너는 잘할 거야. A: 너는 영어를 잘하잖아. 너처럼 영어를 잘 말하는 방법을 알려 줘.",

 pen:"not only A but also B = B as well as A ≠ either A or B"}); }
A("T","T",19,"w",{q:"[서술형] 우리말과 일치하도록 빈칸에 알맞은 말을 쓰시오. |2점|<br>그 영화가 너무 슬퍼서 모든 사람들이 울었다.<br>→ The movie was ___ sad ___ everyone cried.",ans:"so, that",full:"The movie was so sad that everyone cried.",ko:"그 영화가 너무 슬퍼서 모든 사람들이 울었다.",

 pen:"so + 형용사/부사 + that ... = 너무 ~해서 …하다"});
A("T","T",20,"w",{q:"[서술형] [20-21] <보기>에서 알맞은 접속사를 골라 괄호 안의 말을 이용하여 문장을 완성하시오. |6점, 각 3점|<br>보기: unless / though / since<br>흡연을 그만두지 않으면 너는 건강 문제가 생길 것이다. (stop smoking)<br>→ ___, you’ll have health problems.",ans:"Unless you stop smoking",full:"Unless you stop smoking, you’ll have health problems.",ko:"흡연을 그만두지 않으면 너는 건강 문제가 생길 것이다.",
 h:["본책 p.130 ‘3 조건·양보를 나타내는 접속사’ 표의 unless 줄을 펴세요.","1) ‘~하지 않으면’이라는 부정의 조건이에요.  2) unless는 이미 부정의 뜻이 있어서 뒤에 not을 쓰지 않아요. 주어 you(너)와 괄호 안의 말을 이어요.","U로 시작하는 접속사 + 주어 + 괄호 안의 말이에요. not은 넣지 않아요."],
 pen:"unless = ~하지 않으면 (not 따로 쓰지 않음)"});
A("T","T",21,"w",{q:"[서술형] [20-21] <보기>에서 알맞은 접속사를 골라 괄호 안의 말을 이용하여 문장을 완성하시오. |6점, 각 3점|<br>보기: unless / though / since<br>내 차는 오래되었음에도 불구하고 여전히 아주 잘 달린다. (my car, old)<br>→ ___, it still runs very well.",ans:"Though my car is old",full:"Though my car is old, it still runs very well.",ko:"내 차는 오래되었음에도 불구하고 여전히 아주 잘 달린다.",
 h:["본책 p.130 ‘3 조건·양보를 나타내는 접속사’ 표의 though 줄을 펴세요.","1) 오래되었다와 아주 잘 달린다는 반대되는 내용이에요.  2) 보기 중 ‘~에도 불구하고, 비록 ~이지만’을 뜻하는 말을 골라 my car(내 차) + be동사 + old를 이어요.","T로 시작하는 접속사 + my car + 현재형 be동사(i로 시작하는 두 글자) + old예요."],
 pen:"though + 주어 + 동사 = ~에도 불구하고, 비록 ~이지만"});
A("T","T",22,"w",{q:"[서술형] (출제 포인트 4) [22-23] <조건>에 맞게 우리말을 영작하시오. |8점, 각 4점|<br>나는 중국어를 읽지도 말하지도 못한다.<br>조건 1. read, speak, Chinese를 이용할 것 2. 접속사를 사용하여 5단어로 쓸 것<br>→ I can ___.",ans:"neither read nor speak Chinese",full:"I can neither read nor speak Chinese.",ko:"나는 중국어를 읽지도 말하지도 못한다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 표의 neither A nor B 줄을 펴세요.","1) ‘A도 B도 아닌’은 neither A nor B예요.  2) can(~할 수 있다) 뒤에 두 동사 read(읽다)와 speak(말하다)를 연결하고, 마지막에 Chinese(중국어)를 써요.","빈칸은 다섯 단어예요. n으로 시작하는 짝꿍 두 개 사이사이에 read(읽다)와 speak(말하다)가 들어가고, Chinese(중국어)로 끝나요."],
 pen:"can neither + 동사원형 nor + 동사원형 = ~도 ~도 할 수 없다"});
A("T","T",23,"w",{q:"[서술형] (출제 포인트 4) [22-23] <조건>에 맞게 우리말을 영작하시오. |8점, 각 4점|<br>Chris와 Helen은 둘 다 캐나다에서 태어났다.<br>조건 1. be born을 이용할 것 2. 접속사를 사용하여 6단어로 쓸 것<br>→ ___ in Canada.",ans:"Both Chris and Helen were born",full:"Both Chris and Helen were born in Canada.",ko:"Chris와 Helen은 둘 다 캐나다에서 태어났다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 표의 both A and B 줄과 아래 수 일치 설명을 펴세요.","1) ‘A와 B 둘 다’는 both A and B예요.  2) 둘 다 복수 취급이고 지난 일이니 be born(태어나다)의 과거형은 복수 주어에 맞는 were born이에요.","여섯 단어예요. B로 시작하는 짝꿍으로 두 사람을 묶고, 복수 주어에 맞는 be동사 과거형(w로 시작) + born을 써요."],
 pen:"both A and B = 복수 취급 (were born)"});
A("T","T",24,"w",{q:"[서술형] (출제 포인트 2) <보기>에서 알맞은 부사절을 골라 문장을 완성하시오. (단, 한 번씩만 사용할 것) |6점, 각 2점|<br>보기: because it snowed a lot / even though it was raining / until the movie ended<br>(1) They played soccer outside ___.<br>(2) I didn’t turn on my smartphone ___.<br>(3) We decided not to go out ___.<br>(1)(2)(3)의 답을 차례로 쓰세요.",ans:"even though it was raining, until the movie ended, because it snowed a lot",full:"(1) They played soccer outside even though it was raining. (2) I didn’t turn on my smartphone until the movie ended. (3) We decided not to go out because it snowed a lot.",ko:"(1) 비록 비가 오고 있었지만 그들은 밖에서 축구를 했다. (2) 영화가 끝날 때까지 나는 내 스마트폰을 켜지 않았다. (3) 눈이 많이 왔기 때문에 우리는 외출하지 않기로 했다.",
 h:["본책 p.130 ‘1 시간’, ‘2 이유·결과’, ‘3 조건·양보’ 표를 차례로 펴세요.","1) 각 문장의 앞부분 뜻을 읽고, 보기 세 가지 중 뜻이 이어지는 것을 찾으세요.  2) (1) 밖에서 축구를 한 일은 비가 와도 했다는 반대 관계, (2) 스마트폰을 켜지 않은 때는 영화가 끝날 때까지, (3) 외출하지 않은 이유는 눈이에요.","(1)은 e로 시작, (2)는 u로 시작, (3)은 b로 시작하는 보기예요."],
 pen:"even though = 비록 ~이지만 / until = ~할 때까지 / because = ~때문에"});
A("T","T",25,"w",{q:"[서술형] (최신기출) 다음 그림을 보고 <조건>에 맞게 그림을 묘사하는 두 개의 문장을 완성하시오. |4점, 각 2점|<br>[그림: 왼쪽 그림은 5:00 p.m.에 한 소년이 책상에 앉아 공책에 숙제를 하고 있는 모습이고, 오른쪽 그림은 7:00 p.m.에 같은 소년이 소파에 앉아 텔레비전을 보는 모습이다. 숙제를 먼저 하고 나중에 TV를 봤다.]<br>조건 do one’s homework와 watch TV를 이용할 것<br>(1) After I ___, I ___.<br>(2) I ___ before I ___.<br>(1)의 빈칸 두 개, (2)의 빈칸 두 개를 차례로 쓰세요.",ans:"did my homework, watched TV, did my homework, watched TV",full:"(1) After I did my homework, I watched TV. (2) I did my homework before I watched TV.",ko:"(1) 나는 숙제를 한 후에 TV를 보았다. (2) 나는 TV를 보기 전에 숙제를 했다.",
 h:["본책 p.130 ‘1 시간을 나타내는 접속사’ 표의 before(~하기 전에), after(~한 후에) 줄을 펴세요.","1) 그림에서 5시에 한 일(숙제)과 7시에 한 일(TV)의 순서를 확인하세요.  2) after 뒤에는 먼저 한 일, before 뒤에는 나중에 한 일이 와요. 모두 지난 일이니 과거형으로 써요.","(1)과 (2)의 빈칸 순서는 같아요. 먼저 숙제를 한 일, 그다음 TV를 본 일이에요. do(하다)와 watch(보다)를 과거형으로, one’s는 my로 바꿔요."],
 pen:"After + 먼저 한 일, 나중 일 / 먼저 한 일 before + 나중 일 (둘 다 과거)"});
A("T","T",26,"w",{q:"[서술형] (출제 포인트 4) 두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오. |2점|<br>She is not only a scientist but also a writer.<br>→ She is a writer ___ ___ ___ a scientist.",ans:"as, well, as",full:"She is a writer as well as a scientist.",ko:"그녀는 과학자일 뿐만 아니라 작가이기도 하다.",
 h:["본책 p.132 ‘2 짝을 이루는 접속사’ 표의 not only A but (also) B 줄 오른쪽 (= B as well as A)를 펴세요.","1) not only A but also B는 B as well as A로 바꿔 쓸 수 있어요.  2) 원래 문장에서 B는 a writer(작가), A는 a scientist(과학자)예요.","빈칸 세 개: a로 시작하는 말 / w로 시작하는 말 / 다시 a로 시작하는 말"],
 pen:"not only A but also B = B as well as A"});
A("T","T",27,"w",{q:"[서술형] (최신기출) 다음 글을 읽고 우리말과 일치하도록 괄호 안의 말을 바르게 배열하시오. |4점, 각 2점|<br>Last Sunday, I was home alone. My parents went out early. (1) 나는 너무 배가 고파서 기다릴 수 없었다 until they came home. I made a salad myself. (2) 그것은 신선할 뿐만 아니라 맛있었다.<br>(1) (that, couldn’t, hungry, so, I, wait) → I was ___ until they came home.<br>(2) (only, also, delicious, not, but, fresh) → It was ___.<br>(1)과 (2)를 차례로 쓰세요.",ans:"so hungry that I couldn’t wait, not only fresh but also delicious",full:"(1) I was so hungry that I couldn’t wait until they came home. (2) It was not only fresh but also delicious.",ko:"지난 일요일, 나는 집에 혼자 있었다. 부모님은 일찍 나가셨다. (1) 나는 너무 배가 고파서 부모님이 집에 오실 때까지 기다릴 수 없었다. 나는 샐러드를 직접 만들었다. (2) 그것은 신선할 뿐만 아니라 맛있었다.",
 h:["본책 p.130 ‘2 이유·결과’ 표의 so ~ that ... 줄과 p.132 ‘2 짝을 이루는 접속사’ 표의 not only A but also B 줄을 펴세요.","1) (1) ‘너무 ~해서 …할 수 없었다’는 「so + 형용사 + that + 주어 + couldn’t + 동사」 순서예요.  2) (2) ‘A뿐만 아니라 B도’는 not only A but also B이고, A와 B 자리에 fresh(신선한), delicious(맛있는)를 넣어요.","(1)은 so로 시작하고 wait(기다리다)로 끝나요. (2)는 not으로 시작하고 delicious(맛있는)로 끝나요."],
 pen:"so + 형용사 + that + 주어 + couldn’t ~ / not only A but also B"});
A("T","T",28,"w",{q:"[서술형] (고난도, 출제 포인트 1, 4) 밑줄 친 부분이 어법상 틀린 문장 두 개를 찾아 기호를 쓰고, 바르게 고쳐 쓰시오. |8점, 각 4점|<br>ⓐ The picnic will be canceled <u>if it will rain</u>.<br>ⓑ My friend called me several times <u>while I was sleeping</u>.<br>ⓒ Turn left, <u>and you will see a bank</u>.<br>ⓓ <u>Unless you don’t show your ID</u>, you can’t go inside.<br>틀린 기호와 고친 말을 차례로 쓰세요.",ans:"ⓐ → if it rains, ⓓ → Unless you show your ID 또는 If you don’t show your ID",full:"ⓐ The picnic will be canceled if it rains. / ⓓ Unless you show your ID, you can’t go inside. (또는 If you don’t show your ID, you can’t go inside.)",ko:"ⓐ 비가 오면 소풍은 취소될 것이다. ⓑ 내 친구는 내가 자는 동안 여러 번 전화했다. ⓒ 왼쪽으로 돌아라, 그러면 은행이 보일 것이다. ⓓ 신분증을 보여 주지 않으면 안에 들어갈 수 없다.",
 h:["본책 p.130 ‘3 조건·양보’ 표 아래 ‘주의’ 상자와 맨 아래 ‘시간·조건 부사절의 시제’ 설명을 펴세요.","1) if·when 같은 조건·시간 부사절 안에 will이 쓰였는지 확인해요.  2) unless(~하지 않으면)에는 이미 부정의 뜻이 있어요. 그 뒤에 not이 또 있는지 확인해요.","틀린 것은 두 개예요. 하나는 will을 빼고 현재시제로, 다른 하나는 not을 빼거나 접속사를 If로 바꾸는 두 가지 방법으로 고쳐요."],
 pen:"If/when 부사절 = will 쓰지 않음 / Unless + 긍정 (또는 If + 부정)"});
}

A(3,"B",3,"w",{q:"생략 가능한 부분에 동그라미하고, 없는 경우 ×를 쓰시오.<br>Billy has a friend who lives in New York.",ans:"×",full:"Billy has a friend who lives in New York. (생략 가능한 부분 없음)",ko:"Billy는 뉴욕에 사는 친구가 있다.",

A(3,"B",5,"w",{q:"생략 가능한 부분에 동그라미하고, 없는 경우 ×를 쓰시오.<br>The boy who is playing the drums is my brother.",ans:"who is",full:"The boy who is playing the drums is my brother. → The boy playing the drums is my brother.",ko:"드럼을 치고 있는 소년은 내 남동생이다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’의 (2) 설명(「주격 관계대명사 + be동사」)을 펴세요.","1) who 뒤에 is playing(치고 있는)처럼 현재분사(-ing)가 와요.  2) 분사(구)가 뒤따르면 주격 관계대명사와 be동사를 함께 생략할 수 있어요.","생략하는 말은 두 단어예요. 관계대명사 + be동사예요."],

A(3,"C",1,"w",{q:"우리말과 일치하도록 괄호 안의 말을 바르게 배열하시오.<br>검은색 재킷을 입고 있는 여자아이가 내 여동생이야. (wearing, is, a black jacket, the girl)<br>→ ___ my sister.",ans:"The girl wearing a black jacket is",full:"The girl wearing a black jacket is my sister.",ko:"검은색 재킷을 입고 있는 여자아이가 내 여동생이야.",

 h:["본책 p.146 ‘2 관계대명사의 생략’의 (1) 설명을 펴세요.","1) 주어 Paul 다음에 동사 lost(원형 lose 잃어버리다)가 와요.  2) 목적어 the wallet(그 지갑) 뒤에 ‘그가 산’(he bought)을 붙여요. 목적격 관계대명사가 생략된 모양이에요.","lost(원형 lose 잃어버리다)로 시작해요. ‘지갑’을 먼저 쓰고, 그 뒤에 ‘그가 샀다’를 붙여요."],

A("T","T",11,"c",{q:"(출제 포인트 3) 다음 문장에서 생략할 수 있는 것은?<br><u>The man</u>(①) <u>who is</u>(②) <u>cooking</u>(③) <u>in</u>(④) the kitchen <u>is</u>(⑤) my uncle.",opts:o,ans:o[1],full:"② The man who is cooking in the kitchen is my uncle. → The man cooking in the kitchen is my uncle.",ko:"② 부엌에서 요리하고 있는 남자는 나의 삼촌이다. (분사 앞의 「주격 관계대명사 + be동사」는 생략할 수 있다.)",
 h:["본책 p.146 ‘2 관계대명사의 생략’의 (2) 설명(「주격 관계대명사 + be동사」)을 펴세요.","1) who is 뒤에 cooking(요리하고 있는)처럼 현재분사(-ing)가 와요.  2) 분사가 뒤따르면 주격 관계대명사와 be동사를 함께 생략할 수 있어요.","생략하는 말은 두 단어예요. 관계대명사 + be동사가 있는 보기를 고르세요. 두 번째 보기예요."],
 pen:"주격 관계대명사 + be동사 + 분사 → 생략 가능"}); }
{ const o=mk(["I have a cousin ___ lives in London.","Look at the boy ___ is playing with a ball.","I know the girl ___ bike was stolen.","We’re looking for someone ___ can speak French.","The woman ___ we saw at the park was an actress."]);
A("T","T",12,"c",{q:"빈칸에 who가 들어갈 수 없는 것은?<br>① I have a cousin ___ lives in London.<br>② Look at the boy ___ is playing with a ball.<br>③ I know the girl ___ bike was stolen.<br>④ We’re looking for someone ___ can speak French.<br>⑤ The woman ___ we saw at the park was an actress.",opts:o,ans:o[2],full:"③ I know the girl whose bike was stolen. (who X → whose)",ko:"③ 나는 자전거를 도둑맞은 소녀를 안다. (소유격 whose를 써야 한다.)",
 h:["본책 p.144 ‘1 주격’, ‘2 목적격’, ‘3 소유격 관계대명사’ 설명을 펴세요.","1) 빈칸 바로 뒤가 동사이면 주격, 주어(we)이면 목적격, 명사(bike)이면 소유격이에요.  2) who는 주격(과 구어체 목적격)에 쓸 수 있지만 소유격 자리에는 쓸 수 없어요.","빈칸 뒤에 명사 bike(자전거)가 바로 오는 문장이에요. 세 번째 보기예요."],
 pen:"관계대명사 + 명사 = whose (who X)"}); }
{ const o=mk(["Technology changes how we live.","2010 is the year when I was born.","Justin is a singer that has many fans.","I know a boy whose nickname is AlphaGo.","I don’t believe which you said."]);
A("T","T",13,"c",{q:"(출제 포인트 1) 밑줄 친 부분이 어법상 틀린 것은?<br>① Technology changes <u>how</u> we live.<br>② 2010 is the year <u>when</u> I was born.<br>③ Justin is a singer <u>that</u> has many fans.<br>④ I know a boy <u>whose</u> nickname is AlphaGo.<br>⑤ I don’t believe <u>which</u> you said.",opts:o,ans:o[4],full:"⑤ I don’t believe which you said. (X) → I don’t believe what you said.",ko:"⑤ 나는 네가 한 말을 믿지 않는다. (선행사가 없으므로 what을 써야 한다.)",
 h:["본책 p.146 ‘관계대명사 what’의 주의 상자(what 앞에는 선행사를 쓰지 않는다)를 펴세요.","1) 각 밑줄 앞에 선행사가 있는지 확인하세요. ①은 방법, ②는 the year, ③은 a singer, ④는 a boy예요.  2) 선행사가 없는데 which를 쓴 문장이 있어요.","believe(믿다) 바로 뒤에 선행사 없이 which가 있는 문장이에요. 마지막 보기예요."],
 pen:"선행사 없음 = what (which X)"}); }
{ const o=mk(["He is a man who I can trust.","The girl who is wearing glasses is my sister.","I read a novel which was written in English.","I like boys who are good at singing.","The movie which I watched yesterday was boring."]);
A("T","T",14,"c",{q:"(출제 포인트 3) 다음 중 밑줄 친 부분을 생략할 수 없는 것은?<br>① He is a man <u>who</u> I can trust.<br>② The girl <u>who is</u> wearing glasses is my sister.<br>③ I read a novel <u>which was</u> written in English.<br>④ I like boys <u>who are</u> good at singing.<br>⑤ The movie <u>which</u> I watched yesterday was boring.",opts:o,ans:o[3],full:"④ I like boys who are good at singing. (생략 불가)",ko:"④ 나는 노래를 잘하는 소년들을 좋아한다. (who are 뒤에 분사가 아닌 형용사구가 와서 생략할 수 없다.)",
 h:["본책 p.146 ‘2 관계대명사의 생략’의 (1)과 (2) 설명을 펴세요.","1) ①과 ⑤는 관계대명사 뒤에 주어(I)가 와서 목적격이에요.  2) ②와 ③은 who is / which was 뒤에 분사(wearing, written)가 와요. 분사가 아닌 말이 오면 생략할 수 없어요.","남은 하나는 who are 뒤에 good at(~을 잘하는)이라는 형용사구가 와요. 네 번째 보기예요."],
 pen:"「주격 관계대명사 + be동사」는 뒤에 분사가 올 때만 생략"}); }
{ const o=mk(["who – which – that","who – whose – that","that – which – who","that – whose – who","which – whose – who"]);
A("T","T",15,"c",{q:"(A) ~ (C)에 들어갈 말이 바르게 짝지어진 것은?<br>A: Do you know the man and the dog (A) are walking over there?<br>B: Do you mean the dog (B) fur is brown?<br>A: Yes, I do.<br>B: He is my neighbor. I told you about the man (C) moved next door to me. He is that guy.",opts:o,ans:o[3],full:"④ (A) that (B) whose (C) who",ko:"④ A: 저기 걸어가고 있는 남자와 개를 아니? B: 털이 갈색인 개 말이니? A: 응, 맞아. B: 그는 내 이웃이야. 내가 너에게 말했던, 내 옆집으로 이사 온 남자야. 그가 저 사람이야.",
 h:["본책 p.142 ‘2 관계대명사의 종류’ 표의 마지막 줄(사람 + 동물 / 사물)과 p.144 ‘3 소유격 관계대명사’를 펴세요.","1) (A)의 선행사는 the man and the dog(사람과 동물)예요.  2) (B) 뒤에는 fur(털)라는 명사가 오고, (C)의 선행사는 the man(사람)이며 뒤에 동사가 와요.","(A)는 사람+동물이라 한 가지만 가능한 t로 시작하는 말, (B)는 w로 시작하는 5글자예요."],
 pen:"사람 + 동물 선행사 = that만 / 관계대명사 + 명사 = whose"}); }
{ const o=mk(["1개","2개","3개","4개","5개"]);
A("T","T",16,"c",{q:"(출제 포인트 1, 4) 어법상 옳은 문장의 개수는?<br>ⓐ I like the way how he talks.<br>ⓑ That I want is a glass of water.<br>ⓒ Busan is the city where I was born.<br>ⓓ The boy who is holding balloons is Ted.<br>ⓔ This is the laptop that I bought it yesterday.",opts:o,ans:o[1],full:"② 2개 (ⓒ, ⓓ가 옳다)",ko:"② 2개. ⓒ 부산은 내가 태어난 도시이다. ⓓ 풍선을 들고 있는 소년은 Ted이다.",
 h:["본책 p.148 ‘4 how’ 주의 상자, p.146 ‘관계대명사 what’ 주의 상자, p.144 ‘2 목적격 관계대명사’ 주의 상자를 펴세요.","1) ⓐ는 the way(방법)와 how를 함께 써도 되는지 보세요.  2) ⓑ는 선행사 없는 주어 자리에 That이 맞는지, ⓔ는 bought(원형 buy 사다)의 목적어가 두 번 나오지 않는지 확인해요.","틀린 문장은 세 개예요. 다섯 개에서 틀린 것을 빼고 남은 개수를 세어 보세요."],
 pen:"the way how X / 선행사 없는 주어 = What / 목적격절에 it 중복 X"}); }
{ const o=mk(["ⓐ: who","ⓑ: what","ⓒ: how","ⓓ: where","ⓔ: whose"]);
A("T","T",17,"c",{q:"(최신기출, 고난도, 출제 포인트 4) 빈칸 ⓐ ~ ⓔ에 들어갈 말이 잘못 짝지어진 것은?<br>• I have an uncle ⓐ is living in Canada.<br>• This is not ⓑ I want.<br>• That’s ⓒ I made the cookies.<br>• New York is a city ⓓ you must visit.<br>• A man ⓔ name was Jack lived there.",opts:o,ans:o[3],full:"④ ⓓ: where (X) → that 또는 which",ko:"④ 뉴욕은 네가 꼭 가 봐야 할 도시이다. (visit의 목적어 역할을 하므로 목적격 that / which를 써야 한다.)",
 h:["본책 p.148 아래 ‘비교 관계대명사 vs. 관계부사’ 상자와 p.144 ‘2 목적격 관계대명사’를 펴세요.","1) 빈칸 뒤 you must visit(네가 꼭 방문해야 한다)에 visit(방문하다)의 목적어가 빠져 있어요.  2) 목적어가 빠졌으면 관계부사가 아니라 관계대명사예요.","ⓐ, ⓑ, ⓒ, ⓔ는 맞아요. 네 번째 보기(ⓓ)에 where가 어색해요."],
 pen:"뒤에 목적어가 빠짐 = 목적격 관계대명사 (where X)"}); }
{ const o=mk(["Let me know the way you solved the problem.","2002 is the year when my parents got married.","This house is the place where I used to live in.","Do you know the reason why she was absent today?","I can’t focus on what I am reading now."]);
A("T","T",18,"c",{q:"(고난도) 우리말을 영어로 잘못 옮긴 것은?<br>① 네가 그 문제를 푼 방법을 알려줘. → Let me know the way you solved the problem.<br>② 2002년은 나의 부모님이 결혼한 해이다. → 2002 is the year when my parents got married.<br>③ 이 집은 내가 살았던 곳이다. → This house is the place where I used to live in.<br>④ 너는 그녀가 오늘 결석한 이유를 아니? → Do you know the reason why she was absent today?<br>⑤ 나는 지금 내가 읽고 있는 것에 집중할 수가 없다. → I can’t focus on what I am reading now.",opts:o,ans:o[2],full:"③ This house is the place where I used to live in. (X) → This house is the place where I used to live.",ko:"③ 이 집은 내가 살았던 곳이다. (관계부사 where가 부사구를 대신하므로 live 다음에 전치사 in을 쓰지 않는다.)",
 h:["본책 p.148 아래 ‘비교 관계대명사 vs. 관계부사’ 상자(관계부사 = 부사구 역할)를 펴세요.","1) 관계부사 where는 ‘~에서’의 뜻을 이미 가지고 있어요.  2) 그런데 끝에 전치사가 또 붙어 있으면 뜻이 중복돼요. live(살다) 뒤를 보세요.","used to live in에서 문제가 되는 말이 있어요. 세 번째 보기예요."],
 pen:"관계부사 = 전치사 + 명사 역할 → 뒤에 전치사 중복 X"}); }
A("T","T",19,"w",{q:"[19-20] 빈칸에 알맞은 관계사를 쓰시오.<br>Do you know the reason ___ they fought yesterday?",ans:"why",full:"Do you know the reason why they fought yesterday?",ko:"너는 그들이 어제 싸운 이유를 아니?",
 h:["본책 p.148 ‘2 관계부사의 종류’의 (3) why 설명을 펴세요.","1) 선행사가 the reason(이유)이에요.  2) 이유를 나타내는 선행사 다음에는 짝이 되는 관계부사를 써요. fought는 원형 fight(싸우다)의 과거형이에요.","w로 시작하는 3글자예요."],
 pen:"the reason + why"});
A("T","T",20,"w",{q:"(출제 포인트 1) [19-20] 빈칸에 알맞은 관계사를 쓰시오.<br>This music is ___ he played at the concert.",ans:"what",full:"This music is what he played at the concert.",ko:"이 음악은 그가 콘서트에서 연주한 것이다.",
 h:["본책 p.146 ‘관계대명사 what’의 (1)과 (2) 설명(보어로 쓰이는 what절)을 펴세요.","1) 빈칸 앞 This music is(이 음악은 ~이다)에 선행사가 없어요.  2) 빈칸 뒤 he played(그가 연주했다)에는 played(원형 play 연주하다)의 목적어가 빠져 있어요.","‘~하는 것’을 뜻하는 w로 시작하는 4글자예요."],
 pen:"선행사 없음 + ~하는 것 = what"});
A("T","T",21,"w",{q:"[21-22] 다음 두 문장을 관계사를 이용하여 한 문장으로 쓰시오.<br>I know a nice restaurant. The restaurant is open late at night.<br>→ I know ___ late at night.",ans:"a nice restaurant that is open 또는 a nice restaurant which is open",full:"I know a nice restaurant that is open late at night. / I know a nice restaurant which is open late at night.",ko:"나는 밤늦게까지 문을 여는 좋은 식당을 안다.",
 h:["본책 p.144 ‘1 주격 관계대명사’ 설명을 펴세요.","1) 두 번째 문장의 The restaurant(그 식당)는 주어로, 첫 문장의 a nice restaurant와 같은 대상이에요.  2) 같은 명사를 관계대명사로 바꿔 선행사 뒤에 붙여요. 사물이에요.","a nice restaurant(좋은 식당)로 시작하고 open(문을 연)으로 끝나요. 관계대명사는 t로 시작하는 말 또는 w로 시작하는 5글자예요."],
 pen:"선행사(사물) + that / which + be동사 + 형용사"});
A("T","T",22,"w",{q:"[21-22] 다음 두 문장을 관계사를 이용하여 한 문장으로 쓰시오.<br>Christmas is a day. People exchange gifts on that day.<br>→ Christmas is ___ .",ans:"a day when people exchange gifts",full:"Christmas is a day when people exchange gifts.",ko:"크리스마스는 사람들이 선물을 교환하는 날이다.",
 h:["본책 p.148 ‘2 관계부사의 종류’의 (1) when 설명을 펴세요.","1) 두 번째 문장의 on that day(그날에)는 부사구예요.  2) 부사구를 대신하는 것은 관계대명사가 아니라 관계부사예요. 선행사 a day(어떤 날)는 때예요.","a day 다음에 w로 시작하는 4글자 관계부사, 그 뒤에 people exchange gifts가 와요."],
 pen:"선행사(때) + when + 주어 + 동사 (on that day 대신)"});
A("T","T",23,"w",{q:"그림의 내용과 일치하도록 괄호 안의 말을 바르게 배열하여 문장을 완성하시오.<br>[그림 (1): 한 손이 사진을 들고 있고, 사진 속에는 에펠탑 앞에서 웃고 있는 여자가 있다.]<br>[그림 (2): 말풍선 안에 아기가 있고, 옆에는 ‘HOSPITAL(병원)’이라고 쓰인 건물이 있다.]<br>(1) (in Paris, was, which, a photo, taken)<br>→ She showed me ___ .<br>(2) (born, where, I, the hospital, was)<br>→ This is ___ .",ans:"(1) a photo which was taken in Paris, (2) the hospital where I was born",full:"(1) She showed me a photo which was taken in Paris. (2) This is the hospital where I was born.",ko:"(1) 그녀는 나에게 파리에서 찍은 사진을 보여 주었다. (2) 이곳은 내가 태어난 병원이다.",
 h:["본책 p.144 ‘1 주격 관계대명사’와 p.148 ‘2 관계부사의 종류’의 (2) where 설명을 펴세요.","1) (1)은 선행사 a photo(사진) 뒤에 사진을 꾸며 주는 주격 관계대명사절이 와요. 사진은 ‘찍힌’ 것이니 be동사 + 과거분사 taken(원형 take 찍다) 모양이에요.  2) (2)는 선행사 the hospital(병원) 뒤에 장소 관계부사절이 와요. ‘내가 태어났다’는 주어 + was born(태어났다)이에요.","(1)은 a photo로 시작해 in Paris로 끝나고, (2)는 the hospital로 시작해 born으로 끝나요."],
 pen:"사진 + which was taken / 장소 + where + 주어 + 동사"});
A("T","T",24,"w",{q:"(출제 포인트 3) 다음 문장에서 생략 가능한 부분을 생략하여 문장을 다시 쓰시오.<br>I am watching a movie which was made in the 1980s.",ans:"I am watching a movie made in the 1980s.",full:"I am watching a movie made in the 1980s.",ko:"나는 1980년대에 만들어진 영화를 보고 있다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’의 (2) 설명(「주격 관계대명사 + be동사」)을 펴세요.","1) which was 뒤에 made(원형 make 만들다의 과거분사)가 와요.  2) 과거분사가 뒤따르면 주격 관계대명사와 be동사를 함께 생략할 수 있어요.","which was 두 단어를 지우고 나머지는 그대로 다시 써요."],
 pen:"which was + 과거분사 → 생략 가능"});
A("T","T",25,"w",{q:"(출제 포인트 4) 어법상 틀린 부분을 찾아 바르게 고쳐 쓰시오.<br>I remember the day which I rode a roller coaster for the first time. It was really exciting.",ans:"which → when",full:"I remember the day when I rode a roller coaster for the first time. It was really exciting.",ko:"나는 롤러코스터를 처음 탔던 날을 기억한다. 그것은 정말 신났다.",

A(1,"C",3,"w",{q:"우리말과 일치하도록 괄호 안의 말을 이용하여 문장을 완성하시오.<br>우리에게 열쇠가 있다면, 그 사물함을 열 수 있을 텐데. (have, can, open)<br>→ If we ___ the key, we ___ ___ the locker.",ans:"had, could, open",full:"If we had the key, we could open the locker.",ko:"우리에게 열쇠가 있다면, 그 사물함을 열 수 있을 텐데.",

 h:["본책 p.162 ‘1 I wish 가정법’ (1) 아래 예문(I wish I were a lawyer. = I’m sorry that I am not a lawyer.)을 펴세요.","1) 위 문장이 가정법이고 아래 문장이 사실(직설법)이에요. 가정법은 사실과 반대로 상상해요.  2) 긍정으로 상상하면 사실은 부정이고, 부정으로 상상하면 사실은 긍정이에요.","I wish 문장이 들어간 보기를 보세요. 사실 부분에 not이 빠져 있어요."],

A("T","T",17,"c",{q:"(고난도) 밑줄 친 ⓐ~ⓔ 중 어법상 틀린 것은?<br>A: What’s up? ⓐ <u>You look upset.</u><br>B: ⓑ <u>I fought with Emily.</u><br>A: What happened?<br>B: ⓒ <u>She laughed at me.</u> ⓓ <u>If she hasn’t laughed, I wouldn’t have gotten angry.</u><br>A: I see. ⓔ <u>If I were you, I would talk to her about it.</u>",opts:["① ⓐ","② ⓑ","③ ⓒ","④ ⓓ","⑤ ⓔ"],ans:"④ ⓓ",full:"④ ⓓ If she hasn’t laughed → If she hadn’t laughed, I wouldn’t have gotten angry.",ko:"④ ⓓ 그녀가 비웃지 않았다면, 나는 화가 나지 않았을 텐데. (hasn’t → hadn’t)",

A("T","T",18,"c",{q:"(고난도) 다음 중 우리말을 영어로 잘못 옮긴 것은?<br>① 아빠가 담배를 끊으시면 좋을 텐데. → I wish my dad had stopped smoking.<br>② 그녀는 마치 어제 그곳에서 나를 봤던 것처럼 말한다. → She talks as if she had seen me there yesterday.<br>③ 내가 휴식을 취한다면, 나는 기분이 더 나아질 텐데. → If I got some rest, I would feel better.<br>④ 네가 이곳에 나와 함께 있다면 좋을 텐데. → I wish you were here with me.<br>⑤ 그가 진실을 알았다면, 너를 용서했을 텐데. → If he had known the truth, he would have forgiven you.",opts:["① 아빠가 담배를 끊으시면 좋을 텐데. → I wish my dad had stopped smoking.","② 그녀는 마치 어제 그곳에서 나를 봤던 것처럼 말한다. → She talks as if she had seen me there yesterday.","③ 내가 휴식을 취한다면, 나는 기분이 더 나아질 텐데. → If I got some rest, I would feel better.","④ 네가 이곳에 나와 함께 있다면 좋을 텐데. → I wish you were here with me.","⑤ 그가 진실을 알았다면, 너를 용서했을 텐데. → If he had known the truth, he would have forgiven you."],ans:"① 아빠가 담배를 끊으시면 좋을 텐데. → I wish my dad had stopped smoking.",full:"① I wish my dad had stopped smoking. → I wish my dad stopped smoking.",ko:"① ‘아빠가 담배를 끊으시면 좋을 텐데.’는 현재의 아쉬움이라서 「I wish + 가정법 과거」로 나타낸다. (had stopped → stopped)",
 h:["본책 p.162 ‘1 I wish 가정법’ (1) I wish + 가정법 과거와 (2) 과거완료 설명을 펴세요.","1) 우리말이 지금의 일인지 지난 일인지부터 구분하세요. ‘끊으시면 좋을 텐데’에는 지난 때를 뜻하는 말이 없어요.  2) 지금의 아쉬움은 과거형, 지난 일의 후회는 had + p.p.로 써요.","시제가 우리말과 안 맞는 하나는 ①~⑤ 중 맨 첫 번째 보기예요."],

A("T","T",22,"w",{q:"[서술형] [21-22] 우리말과 일치하도록 괄호 안의 말을 이용하여 문장을 완성하시오. (출제 포인트 2)<br>내가 더 일찍 일어났다면 아침을 먹을 수 있었을 텐데. (get up, have)<br>→ If I ___ earlier, I ___ breakfast.",ans:"had gotten up, could have had",full:"If I had gotten up earlier, I could have had breakfast.",ko:"내가 더 일찍 일어났다면 아침을 먹을 수 있었을 텐데.",

A("T","T",23,"w",{q:"[서술형] 그림을 보고 주어진 우리말과 일치하도록 문장을 완성하시오. (최신기출, 출제 포인트 4)<br>[그림: 흰 가운을 입고 클립보드를 든 소년이 의사처럼 서 있는 모습]<br>그 소년은 마치 의사인 것처럼 행동한다.<br>→ The boy acts ___.",ans:"as if he were a doctor",full:"The boy acts as if he were a doctor.",ko:"그 소년은 마치 의사인 것처럼 행동한다.",
 h:["본책 p.162 ‘2 as if 가정법’ (1) as if + 가정법 과거 설명을 펴세요.","1) 소년이 의사가 아닌데 의사인 것처럼 행동하는 모습이에요.  2) 행동하는 지금과 같은 시점이라 as if 뒤에 과거형(be동사는 하나로 정해짐)을 써요.","a로 시작해서 doctor(의사)로 끝나는 여섯 단어예요. doctor 앞에는 a가 와요."],

A("T","T",24,"w",{q:"[서술형] (고난도) 다음 글을 읽고, 괄호 안의 말을 이용하여 상황에 맞는 문장을 완성하시오. (출제 포인트 3)<br>Yesterday my family went to a popular restaurant for dinner. We didn’t make a reservation, so we had to wait for an hour. (* reservation 예약)<br>→ I wish we ___. (make a reservation)",ans:"had made a reservation",full:"I wish we had made a reservation.",ko:"어제 우리 가족은 저녁 식사를 위해 인기 있는 식당에 갔다. 우리는 예약을 하지 않아서, 한 시간을 기다려야 했다. → 우리가 예약을 했다면 좋을 텐데.",
 h:["본책 p.162 ‘1 I wish 가정법’ (2) I wish + 가정법 과거완료 설명을 펴세요.","1) 글에서 어제 예약하지 않아서 오래 기다렸다는 과거의 후회를 찾으세요.  2) 과거 일에 대한 유감은 I wish 뒤에 「had + p.p.」로 쓰고, 예약하는 쪽으로 바랄 거예요.","h로 시작하는 과거완료, make(만들다)의 p.p., 그리고 a reservation을 이어요."],
 pen:"과거 일의 유감·후회 = I wish + had + p.p."});
A("T","T",25,"w",{q:"[서술형] (고난도) 우리말과 일치하도록 <조건>에 맞게 문장을 완성하시오. (출제 포인트 4)<br>Emily는 마치 그녀가 아프지 않았던 것처럼 보인다.<br><조건> sick을 포함한 6단어로 쓸 것<br>→ Emily looks ___.",ans:"as if she hadn’t been sick",full:"Emily looks as if she hadn’t been sick.",ko:"Emily는 마치 그녀가 아프지 않았던 것처럼 보인다.",
 h:["본책 p.162 ‘2 as if 가정법’ (2) as if + 가정법 과거완료 설명을 펴세요.","1) ‘아프지 않았던 것처럼’은 보이는 지금보다 앞선 때의 일이에요.  2) 앞선 때를 반대로 상상할 때는 as if 뒤에 「had + p.p.」를 쓰고, 여기서는 부정이 들어가요.","as if로 시작해서 sick(아픈)으로 끝나요. be(이다)의 p.p.를 빠뜨리지 말고 여섯 단어를 맞춰 보세요."],

A("T","T",26,"w",{q:"[서술형] 그림의 내용과 일치하도록 괄호 안의 말을 이용하여 글을 완성하시오. (출제 포인트 1)<br>[그림: 롤러코스터 앞에서 키를 재는 눈금 표지판 옆에 서서 위를 올려다보는 소녀]<br>Emma wants to ride the roller coaster, but she can’t. If she ___ taller, she ___ the roller coaster. (be, can, ride)",ans:"were, could ride",full:"If she were taller, she could ride the roller coaster.",ko:"Emma는 롤러코스터를 타고 싶지만, 탈 수 없다. 그녀가 키가 더 크다면, 롤러코스터를 탈 수 있을 텐데.",

A("T","T",27,"w",{q:"[서술형] [27-28] 다음 글을 읽고, 밑줄 친 부분을 어법에 맞게 고쳐 쓰시오. (출제 포인트 4)<br>I have a friend from Russia. He has lived in Seoul for 10 years, and speaks Korean fluently. He can speak Korean <u>as if it is his native language</u>. (* fluently 유창하게, native language 모국어)",ans:"as if it were his native language",full:"He can speak Korean as if it were his native language.",ko:"나는 러시아에서 온 친구가 한 명 있다. 그는 서울에 10년째 살고 있고, 한국어를 유창하게 말한다. 그는 마치 그것(한국어)이 모국어인 것처럼 한국어를 말할 수 있다.",

const KEY="clear-l2-v1",PIN="7372";

function st(id){return S.it[id]||(S.it[id]={h:0,tries:0,ok:null,rev:0,pen:0})}
function IT(id){return ITEMS.find(x=>x.id==id)}

const doneOf=L=>L.filter(x=>st(x.id).pen).length;
