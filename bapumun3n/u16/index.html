mplain 불평하다) 뒤에 있어요.", "h2": "첫 문장은 '전쟁이 시작되었다는 소식'처럼 명사의 내용을 설명해 주고, 둘째 문장은 불평한 내용을 이끌어요. 두 곳 모두 '~라는 것'이라는 뜻이에요.", "why": "첫 빈칸은 The news의 내용을 설명하는 동격의 that이고, 둘째 빈칸은 complained의 목적어절을 이끄는 that이에요.", "opts": [{"n": "①", "en": "if", "ko": "~인지 아닌지", "ok": false, "why": "'~라는 것'의 뜻이 필요해서 틀려요."}, {"n": "②", "en": "whether", "ko": "~인지 아닌지", "ok": false, "why": "'~라는 것'의 뜻이 필요해서 틀려요."}, {"n": "③", "en": "that", "ko": "~라는 것", "ok": true, "why": "두 빈칸 모두 완전한 문장을 이끄는 접속사라서 맞아요."}, {"n": "④", "en": "what", "ko": "~하는 것", "ok": false, "why": "what 뒤에는 빠진 말이 있는 문장이 와야 해서 틀려요."}, {"n": "⑤", "en": "which", "ko": "어느 것", "ok": false, "why": "뒤에 빠진 말이 있는 문장이 와야 해서 틀려요."}], "pencil": "the news 뒤에서 내용을 설명하는 접속사는 ___이다", "pencilKey": "that", "page": 162, "sec": "s2", "k": "pick", "tr": "• 전쟁이 시작되었다 ___ 소식은 모두에게 충격을 주었다. • 그 손님은 수프가 너무 짜다 ___ 불평했다.", "ex": ["complain = 불평하다", "salty = 짠", "shocked(원형 shock) = 충격을 주었다"]}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "접속사 if / whether / 간접의문문", "type": "mc", "ans": "⑤", "concept": ["091", "092"], "gap": "", "words": [["get well", "건강해지다"], ["accident", "사고"], ["type", "종류"], ["shark", "상어"], ["supplies", "필수품"], ["certain", "확실한"]], "h1": "다섯 문장의 밑줄 친 부분이 어떤 절인지 하나씩 보세요. 문장 안에 들어간 의문문의 어순과 접속사를 확인해요.", "h2": "가주어 It이 쓰인 문장은 진주어절을 이끄는 접속사가 맞는지, 의문사가 있는 절은 어순이 맞는지 문장마다 확인하세요.", "why": "⑤는 가주어 It 뒤의 진주어절이라서 '~라는 것'의 that이어야 해요. whether를 that으로 고쳐요.", "opts": [{"n": "①", "en": "Ask them whether she will get well.", "ko": "그들에게 그녀가 건강해질지 물어봐라.", "ok": false, "why": "whether + 주어 + 동사라서 맞아요."}, {"n": "②", "en": "I don't know when the accident happened.", "ko": "나는 그 사고가 언제 일어났는지 모른다.", "ok": false, "why": "when + 주어 + 동사라서 맞아요."}, {"n": "③", "en": "Whether you like it or not doesn't matter.", "ko": "네가 그것을 좋아하든 아니든 상관없다.", "ok": false, "why": "주어 자리에 whether를 써서 맞아요."}, {"n": "④", "en": "I can tell how many types of sharks there are.", "ko": "나는 상어의 종류가 몇 가지 있는지 알 수 있다.", "ok": false, "why": "how many types of sharks there are로 어순이 맞아요."}
