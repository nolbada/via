<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동사형 연습 워크지</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--ink:#222;--sub:#667;--pri:#3b5bdb;--ok:#e8590c;--line:#e3e6ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Malgun Gothic",sans-serif;line-height:1.55}
.w{max-width:720px;margin:0 auto;padding:12px 12px 80px}
h1{font-size:19px;margin:6px 0 2px}.sub{color:var(--sub);font-size:13px;margin-bottom:10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.bar button,.chip{border:1px solid var(--line);background:var(--c);border-radius:20px;padding:7px 13px;font-size:14px;color:var(--ink)}
.bar button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sel{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:15px;background:#fff;margin-bottom:6px}
.it{background:var(--c);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.hd{display:flex;gap:10px;padding:12px;align-items:flex-start;cursor:pointer}
.no{flex:none;min-width:30px;height:30px;border-radius:15px;background:#edf0ff;color:var(--pri);font-weight:700;text-align:center;line-height:30px;font-size:14px;padding:0 6px}
.seen .no{background:var(--pri);color:#fff}
.tx{flex:1;font-size:16px}.tx .ko{color:var(--sub);font-size:13px;margin-top:3px}
.bl{display:inline-block;border-bottom:2px solid #999;min-width:42px;text-align:center;color:#888;font-size:14px;margin:0 2px}
.st{flex:none;font-size:24px;background:none;border:0;color:#bbb;padding:0 4px}.st.on{color:#f59f00}
.dt{display:none;border-top:1px dashed var(--line);padding:12px;background:#fbfcff}
.open .dt{display:block}
.ans b{color:var(--ok)}.ans{font-size:17px;margin-bottom:8px}
.why{font-size:14px;margin:6px 0;color:#444}.why li{margin:2px 0}.why b{color:var(--ok)}
.sec{font-size:12px;color:var(--sub);margin:10px 0 3px;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px}td{border:1px solid var(--line);padding:5px 7px;vertical-align:top}td:first-child{width:50%;background:#fff}td:last-child{background:#fffaf0;color:#444}
.stat{background:var(--c);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:14px}
.stat h3{margin:0 0 6px;font-size:15px}
.hint{font-size:13px;color:var(--sub)}
body.exam{background:#2b2d42}body.exam h1,body.exam .sub{color:#fff}body.exam .sub{display:none}
.exam .it{background:#fffbe6;border:2px solid #ffd43b}.exam .no{background:#ffd43b;color:#222}.exam .hd{cursor:default}.exam .tx{font-size:17px}.exam .tx .ko{color:#444;font-size:14px}
.mode{display:flex;gap:8px;margin:8px 0}.mode button{flex:1;padding:11px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:700}.mode button.on{background:var(--pri);color:#fff;border-color:var(--pri)}.exam .mode button{border-color:#555}.exam .mode button.on{background:#ffd43b;color:#222;border-color:#ffd43b}
.exbar{background:#ffd43b;color:#222;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;margin:8px 0}
button.lnk{background:none;border:0;color:var(--pri);font-size:13px;text-decoration:underline;padding:4px}
</style></head><body><div class="w">
<h1>동사형 연습 워크지</h1>
<div class="sub">번호를 눌러 아무 문장이나 연습하세요. 먼저 괄호를 머릿속으로(또는 소리 내어) 채운 뒤, 눌러서 정답을 확인!</div>
<div class="mode" id="mode"></div>
<select id="ls" class="sel"></select>
<div class="bar" id="bar"></div>
<div id="list"></div>
<div id="stat"></div>
</div>
<script src="data.js"></script>
<script>
var SCH=VERB.levels[0].schools[0],LS=SCH.lessons;
var KEY='verb_study_v1',S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||{};S.views=S.views||{};S.stars=S.stars||{};S.secs=S.secs||{};S.first=S.first||Date.now()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
var cur=0,onlyStar=false,showStat=false,hideKo=false;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
// 사용시간: 화면이 보이고 최근 60초 안에 터치가 있었던 시간만 집계
var lastAct=Date.now();
['touchstart','click','scroll','keydown'].forEach(function(e){addEventListener(e,function(){lastAct=Date.now()},{passive:true})});
setInterval(function(){if(document.hidden)return;if(Date.now()-lastAct>60000)return;var t=today();S.secs[t]=(S.secs[t]||0)+5;if(exam){S.esecs=S.esecs||{};S.esecs[t]=(S.esecs[t]||0)+5}save()},5000);
function fmt(s){var m=Math.round(s/60);return m<60?m+'분':Math.floor(m/60)+'시간 '+(m%60)+'분'}
var sel=document.getElementById('ls');
LS.forEach(function(L,i){var o=document.createElement('option');o.value=i;o.textContent='동아(윤) 중2 · '+L.name+' ('+L.items.length+'문장)';sel.appendChild(o)});
sel.onchange=function(){cur=+sel.value;render()};
var exam=false;
function key(li,i){return LS[li].name+':'+(i+1)}
function blankHTML(it){return esc(it.en).replace(/___\[([^\]]*)\]/g,function(m,b){return '<span class="bl">'+esc(b)+'</span>'})}
function ansHTML(it){var k=0;return esc(it.en).replace(/___\[[^\]]*\]/g,function(){return '<b>'+esc(it.ans[k++])+'</b>'})}
function jjHTML(it){var h='<table>';(it.jj||[]).forEach(function(s){s.e.forEach(function(c,i){h+='<tr><td>'+esc(c)+'</td><td>'+esc(s.k[i]||'')+'</td></tr>'})});return h+'</table>'}
function render(){
  document.body.className=exam?'exam':'';
  var md=document.getElementById('mode');
  md.innerHTML='<button id="m1" class="'+(exam?'':'on')+'">📘 연습모드</button><button id="m2" class="'+(exam?'on':'')+'">📝 시험모드</button>';
  document.getElementById('m1').onclick=function(){exam=false;render()};
  document.getElementById('m2').onclick=function(){exam=true;showStat=false;render();scrollTo(0,0)};
  if(exam){renderExam();return}
  var bar=document.getElementById('bar');
  bar.innerHTML='<button id="bs" class="'+(onlyStar?'on':'')+'">☆ 별표만 보기</button><button id="bk" class="'+(hideKo?'on':'')+'">한글 숨기기</button><button id="bt" class="'+(showStat?'on':'')+'">📊 내 기록</button>';
  document.getElementById('bs').onclick=function(){onlyStar=!onlyStar;render()};
  document.getElementById('bk').onclick=function(){hideKo=!hideKo;render()};
  document.getElementById('bt').onclick=function(){showStat=!showStat;render();if(showStat)scrollTo(0,document.body.scrollHeight)};
  var box=document.getElementById('list');box.innerHTML='';
  var idx=[+cur],n=0;
  idx.forEach(function(li){
    LS[li].items.forEach(function(it,i){
      var k=key(li,i);if(onlyStar&&!S.stars[k])return;n++;
      var d=document.createElement('div');d.className='it'+(S.views[k]?' seen':'');
      d.innerHTML='<div class="hd"><div class="no">'+(i+1)+'</div><div class="tx">'+blankHTML(it)+(hideKo?'':'<div class="ko">'+esc(it.ko)+'</div>')+'</div><button class="st'+(S.stars[k]?' on':'')+'">'+(S.stars[k]?'★':'☆')+'</button></div>'
       +'<div class="dt"><div class="sec">정답</div><div class="ans">'+ansHTML(it)+'</div><div class="sec">해석</div><div>'+esc(it.ko)+'</div>'
       +(it.why?'<div class="sec">왜 이 형태?</div><ul class="why">'+it.ans.map(function(a,j){return '<li><b>'+esc(a)+'</b> — '+esc(it.why[j]||'')+'</li>'}).join('')+'</ul>':'')
       +'<div class="sec">직독직해 (끊어 읽기)</div>'+jjHTML(it)+'</div>';
      d.querySelector('.hd').onclick=function(e){
        if(e.target.classList.contains('st'))return;
        var o=d.classList.toggle('open');
        if(o){S.views[k]=(S.views[k]||0)+1;d.classList.add('seen');save()}
      };
      d.querySelector('.st').onclick=function(e){
        e.stopPropagation();if(S.stars[k])delete S.stars[k];else S.stars[k]=1;save();
        e.target.className='st'+(S.stars[k]?' on':'');e.target.textContent=S.stars[k]?'★':'☆';
        if(onlyStar&&!S.stars[k])d.style.display='none';
      };
      box.appendChild(d);
    });
  });
  if(!n)box.innerHTML='<div class="stat hint">'+(onlyStar?'아직 ★ 별표한 문장이 없어요. 어려운 문장 오른쪽 ☆를 눌러 보세요.':'문장이 없습니다.')+'</div>';
  var st=document.getElementById('stat');st.innerHTML='';
  if(showStat){
    var tot=0,td=S.secs[today()]||0;for(var d2 in S.secs)tot+=S.secs[d2];
    var vc=Object.keys(S.views),stars=Object.keys(S.stars);
    var top=vc.sort(function(a,b){return S.views[b]-S.views[a]}).slice(0,5).map(function(k){return k+'번('+S.views[k]+'회)'}).join(', ');
    st.innerHTML='<div class="stat"><h3>📊 내 학습 기록 (이 폰에만 저장)</h3>오늘 사용: '+fmt(td)+' · 전체: '+fmt(tot)+'<br>시험모드 사용: '+fmt(Object.keys(S.esecs||{}).reduce(function(a,k){return a+S.esecs[k]},0))+'<br>살펴본 문장: '+vc.length+'개 · 별표: '+stars.length+'개'
     +'<br>자주 연 문장: '+(top||'-')+'<br>★ 문장: '+(stars.length?stars.join(', '):'-')
     +'<div class="hint" style="margin-top:6px">사용시간은 화면을 켜고 만지고 있는 시간만 셉니다. 카톡 앱 안에서 연 것과 크롬에서 연 것은 기록이 따로 저장돼요.</div>'
     +'<button class="lnk" id="rs">기록 지우기</button></div>';
    document.getElementById('rs').onclick=function(){if(confirm('기록을 모두 지울까요?')){S={};try{localStorage.removeItem(KEY)}catch(e){}load();render()}};
  }
}
function renderExam(){
  document.getElementById('bar').innerHTML='';document.getElementById('stat').innerHTML='';
  var box=document.getElementById('list');box.innerHTML='<div class="exbar">📝 시험모드 — '+LS[cur].name+' · 괄호 안 동사를 알맞은 형태로 바꿔 말해 보세요. (정답은 연습모드에서 확인)</div>';
  LS[cur].items.forEach(function(it,i){
    var d=document.createElement('div');d.className='it';
    d.innerHTML='<div class="hd"><div class="no">'+(i+1)+'</div><div class="tx">'+blankHTML(it)+'<div class="ko">'+esc(it.ko)+'</div></div></div>';
    box.appendChild(d)});
}
render();
</script></body></html>
