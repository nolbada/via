5,"en":"Mrs. Granger took out an letter. She said, \"I wrote this letter for your.","ko":"Granger 선생님은 편지 한 통을 꺼냈다. 그녀는 \"나는 너를 위해 이 편지를 썼단다.","fx":[{"w":"an","r":"a","at":4,"t":"관사 a/an","m":"자음 소리 letter 앞에는 a 사용"},{"w":"your","r":"you","at":13,"t":"인칭대명사의 목적격","m":"전치사 for 뒤에는 목적격 you 사용"}]},{"n":16,"en":"But I'm not going to give it to you today. I will send you these letter some day.\"","ko":"하지만 나는 그것을 네게 오늘 주지 않을 거야. 나는 이 편지를 언젠가 네게 보낼 거야.\"라고 말했다.","fx":[{"w":"these","r":"this","at":14,"t":"지시형용사","m":"단수명사 letter에는 this 사용"}]},{"n":17,"en":"The next morning, Mrs. Granger told to the class, \"Stop using frindle! Frindle is not a real word.\"","ko":"다음 날 아침, Granger 선생님은 학급에 \"'frindle'을 사용하는 것을 멈추거라! 'frindle'은 진짜 단어가 아니야.\"라고 말했다.","fx":[{"w":"to the","r":"the","at":6,"t":"수여동사 tell","m":"tell은 to 없이 목적어를 바로 취함"}]},{"n":18,"en":"But more and more student used it. Students in other schools started use it.","ko":"하지만 점점 더 많은 학생들이 그것을 사용했다. 다른 학교의 학생들이 그것을 사용하기 시작했다.","fx":[{"w":"student","r":"students","at":4,"t":"명사의 복수형","m":"more and more 뒤에는 복수명사 students 사용"},{"w":"use","r":"using","at":12,"t":"동명사","m":"start 뒤 목적어: using 또는 to use (use 아님)"}]},{"n":19,"en":"Soon, students in the whole countries were using it.","ko":"곧, 전국의 학생들이 그것을 사용하고 있었다.","fx":[{"w":"countries","r":"country","at":5,"t":"명사의 단수형","m":"the whole 뒤에는 단수명사 country 사용"}]},{"n":20,"en":"Time passed but Nick graduated. He forgetted about frindle.","ko":"시간이 흘렀고 Nick은 졸업했다. 그는 'frindle'에 대해 잊었다.","fx":[{"w":"but","r":"and","at":2,"t":"접속사","m":"시간이 흘러 졸업한 순접 관계는 and 사용"},{"w":"forgetted","r":"forgot","at":6,"t":"불규칙 과거형","m":"forget의 과거형은 forgot (forgetted 아님)"}]},{"n":21,"en":"When he turned 21, he received a packages from Mrs. Granger. It had a pen, a letter, and a dictionary.","ko":"그가 21살이 되었을 때, 그는 Granger 선생님으로부터 소포 하나를 받았다. 그것에는 펜 한 자루와 편지 한 통, 그리고 사전 하나가 있었다.","fx":[{"w":"packages","r":"package","at":7,"t":"명사의 단수형","m":"a 뒤에는 단수명사 package 사용"}]},{"n":22,"en":"There were a note on the dictionary.","ko":"사전 위에는 쪽지가 하나 있었다.","fx":[{"w":"were","r":"was","at":1,"t":"There is/are 구문","m":"단수 a note에는 There was 사용"}]}]},{"no":"76","t":"Trust String","q":[{"n":1,"en":"I'm blind. I walks with a stick.","ko":"나는 시각 장애인이다. 나는 지팡이를 이용하여 걷는다.","fx":[{"w":"walks","r":"walk","at":3,"t":"일반동사의 현재형","m":"주어 I는 3인칭 단수가 아니므로 walk (walks 아님)"}]},{"n":2,"en":"One day, me homeroom teacher said, \"There will be an school event, Friendship Marathon. In these event, two people run as a team.\"","ko":"어느 날, 나의 담임 선생님께서 \"'우정 마라톤'이라는 학교 행사가 있을 거예요. 이 행사에서는 두 명이 한 팀으로 뛰게 됩니다.\"라고 말씀하셨다.","fx":[{"w":"me","r":"my","at":2,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"},{"w":"an","r":"a","at":9,"t":"관사 a/an","m":"school은 자음 소리로 시작하므로 a 사용"},{"w":"these","r":"this","at":15,"t":"지시형용사","m":"단수명사 event에는 this 사용"}]},{"n":3,"en":"Everyone talk about it. I also got interesting.","ko":"모든 사람들이 그것에 대해 이야기했다. 나도 관심이 생겼다.","fx":[{"w":"talk","r":"talked","at":1,"t":"일반동사의 과거형","m":"과거 이야기이므로 talked 사용"},{"w":"interesting","r":"interested","at":7,"t":"분사형용사","m":"'흥미를 느끼는'은 interested 사용"}]},{"n":4,"en":"\"But can I run?\" I were not sure.","ko":"\"하지만 내가 뛸 수 있을까?\" 나는 확신할 수 없었다.","fx":[{"w":"were","r":"was","at":5,"t":"be동사의 과거형","m":"주어 I에는 was 사용"}]},{"n":5,"en":"So I talked about it with my most good friend, Junha. He said, \"Don't worry!","ko":"그래서 나는 그것에 대해 나의 가장 친한 친구 준하와 이야기했다. 그는 \"걱정하지마!","fx":[{"w":"most good","r":"best","at":7,"t":"최상급","m":"good의 최상급은 best 사용"}]},{"n":7,"en":"On the day of the marathon, we tied an string around our fingers to feeling each other's movement.","ko":"마라톤 날에, 우리는 서로의 움직임을 느끼기 위해 우리의 손가락에 끈을 묶었다.","fx":[{"w":"an","r":"a","at":8,"t":"관사 a/an","m":"string은 자음 소리로 시작하므로 a 사용"},{"w":"feeling","r":"feel","at":14,"t":"to부정사","m":"to 뒤에는 동사원형 feel 사용"}]},{"n":8,"en":"I listened to him very careful and ran with him. The wind was blowing through me and it felt greatly!","ko":"나는 그의 말을 매우 주의 깊게 들었고 그와 함께 뛰었다. 바람이 내게 불어오고 있었는데 그 느낌이 정말 좋았다.","fx":[{"w":"careful","r":"carefully","at":5,"t":"형용사와 부사","m":"동사 listened를 꾸미는 부사 carefully 사용"},{"w":"greatly","r":"great","at":19,"t":"형용사와 부사","m":"felt 뒤 보어 자리에는 형용사 great 사용"}]},{"n":9,"en":"At the finish line, everyone cheered for us. I was proud in myself.","ko":"결승선에서, 모든 사람들이 우리를 응원했다. 나는 내 자신이 자랑스러웠다.","fx":[{"w":"in","r":"of","at":11,"t":"기본전치사","m":"'~이 자랑스러운'은 proud of 사용"}]},{"n":10,"en":"Before the marathon, I thought that I couldn't do it. But now, I want to try another things.","ko":"마라톤 전에, 나는 그것을 할 수 없다고 생각했다. 그러나 지금, 나는 다른 것들을 해 보고 싶다.","fx":[{"w":"another","r":"other","at":16,"t":"수량 형용사","m":"복수명사 things 앞에는 other 사용"}]},{"n":11,"en":"I think that I can tries a bike ride next time!","ko":"나는 다음번에는 자전거 타기를 해 볼 수 있다고 생각한다.","fx":[{"w":"tries","r":"try","at":5,"t":"조동사 뒤 동사원형","m":"조동사 can 뒤에는 동사원형: try (tries 아님)"}]},{"n":12,"en":"Andy and I signed up of Friendship Marathon. I was his guide runner.","ko":"Andy와 나는 '우정 마라톤'에 등록했다. 나는 그의 가이드 러너였다.","fx":[{"w":"of","r":"for","at":5,"t":"기본전치사","m":"'~에 등록하다'는 sign up for 사용"}]},{"n":13,"en":"We runned together every day with a string. I told him, \"Andy, a bike are coming.","ko":"우리는 끈을 이용하여 매일 함께 뛰었다. 나는 \"Andy, 자전거가 오고 있어.","fx":[{"w":"runned","r":"ran","at":1,"t":"불규칙 과거형","m":"run의 과거형은 ran (runned 아님)"},{"w":"are","r":"is","at":14,"t":"be동사의 현재형","m":"주어 a bike는 단수: is (are 아님)"}]},{"n":14,"en":"So let's moving to the right.\" As a team, we practiced hard to win the marathon.","ko":"그러니까 오른쪽으로 움직이자.\"라고 그에게 말했다. 한 팀으로서, 우리는 마라톤에서 우승하기 위해 열심히 연습했다.","fx":[{"w":"moving","r":"move","at":2,"t":"청유문","m":"Let's 뒤에는 동사원형 move 사용"}]},{"n":15,"en":"During the marathon, I ran with Andy and guided him in the same time. It was hard, but we didn't stop running.","ko":"마라톤 동안, 나는 Andy와 함께 뛰면서 동시에 그를 안내했다. 그것은 힘들었지만, 우리는 뛰는 것을 멈추지 않았다.","fx":[{"w":"in","r":"at","at":10,"t":"기본전치사","m":"'동시에'는 at the same time 사용"}]},{"n":16,"en":"At last, we made it to the finish line! We didn't won the race.","ko":"마침내, 우리는 결승선에 도착했다! 우리는 그 경주에서 우승하지 못했다.","fx":[{"w":"won","r":"win","at":11,"t":"일반동사의 부정문","m":"didn't 뒤에는 동사원형 win 사용"}]},{"n":17,"en":"But I knew that us did our best.","ko":"하지만 나는 우리가 최선을 다했다는 것을 알았다.","fx":[{"w":"us","r":"we","at":4,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 we 사용"}]},{"n":18,"en":"Finish something was not easy for me. But this time I did it!","ko":"무언가를 끝내는 것은 나에게 쉽지 않았다. 그러나 이번에는 나는 해냈다!","fx":[{"w":"Finish","r":"Finishing","at":0,"t":"동명사","m":"동명사가 주어 역할: Finishing (Finish 아님)"}]},{"n":19,"en":"I was much happy. Andy looked happy, too.","ko":"나는 매우 행복했다. Andy도 행복해 보였다.","fx":[{"w":"much","r":"very","at":2,"t":"정도 부사 very/much","m":"형용사 happy 앞에는 very 사용"}]}]},{"no":"77","t":"Behind Movie Sounds","q":[{"n":1,"en":"When you watch a movies, what do you pay attention to? The story, the actors, or the music?","ko":"당신은 영화를 볼 때 무엇에 주목하나요? 줄거리, 배우, 아니면 음악?","fx":[{"w":"movies","r":"movie","at":4,"t":"명사의 복수형","m":"a 뒤에는 단수명사 movie 사용"}]},{"n":2,"en":"What about the sounds? Last week, I have a short interview with Emma Han, a famous Foley artist.","ko":"소리는 어떤가요? 지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다.","fx":[{"w":"have","r":"had","at":7,"t":"과거 시제","m":"Last week는 과거 시점: had (have 아님)"}]},{"n":4,"en":"Can you tell I about your job?","ko":"당신의 직업에 관해 말해 주시겠어요?","fx":[{"w":"I","r":"me","at":3,"t":"인칭대명사의 목적격","m":"동사 tell 뒤에는 목적격 me 사용"}]},{"n":5,"en":"Sure! Foley artists creates various sounds for movies because actual sounds are not clear enough for movie scenes.","ko":"그러죠! 폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요.","fx":[{"w":"creates","r":"create","at":3,"t":"동사의 수일치","m":"주어 Foley artists(복수)는 create (creates 아님)"}]},{"n":6,"en":"Let's say there's a rainy scene. The actual sounds of rain are too softly, so we have to make rain sounds and add they to the scene.","ko":"비 오는 장면이 있다고 가정해 봅시다. 실제 빗소리는 너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요.","fx":[{"w":"softly","r":"soft","at":13,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 soft 사용"},{"w":"they","r":"them","at":23,"t":"인칭대명사의 목적격","m":"동사 add 뒤에는 목적격 them 사용"}]},{"n":7,"en":"Q. How does you make sounds?","ko":"질문: 어떻게 소리를 만드나요?","fx":[{"w":"does","r":"do","at":2,"t":"do/does 의문문","m":"주어 you에는 조동사 do 사용"}]},{"n":8,"en":"I use all kinds of everyday objects in fun and creatively ways. For example, I fry bacon to create rain sounds.","ko":"저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다. 예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요.","fx":[{"w":"creatively","r":"creative","at":10,"t":"형용사와 부사","m":"명사 ways 앞에는 형용사 creative 사용"}]},{"n":9,"en":"For the sounds of ice skating, I move a pair of scissor across an desk.","ko":"얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요.","fx":[{"w":"scissor","r":"scissors","at":11,"t":"명사의 복수형","m":"a pair of 뒤에는 복수명사 scissors 사용"},{"w":"an","r":"a","at":13,"t":"관사 a/an","m":"자음 소리 d 앞에는 a desk 사용"}]},{"n":10,"en":"To make the sounds of an horse walking, I hit two coconut shell together.","ko":"말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.","fx":[{"w":"an","r":"a","at":5,"t":"관사 a/an","m":"자음 소리 h 앞에는 a horse 사용"},{"w":"shell","r":"shells","at":12,"t":"명사의 복수형","m":"two 뒤에는 복수명사 shells 사용"}]},{"n":12,"en":"What can we do to becomes a Foley artist?","ko":"우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?","fx":[{"w":"becomes","r":"become","at":5,"t":"to부정사","m":"to 뒤에는 동사원형 become 사용"}]},{"n":13,"en":"You can just start by play with sounds. You don't have to use special tool to make different sounds.","ko":"여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요. 다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요.","fx":[{"w":"play","r":"playing","at":5,"t":"동명사","m":"전치사 by 뒤에는 동명사 playing 사용"},{"w":"tool","r":"tools","at":14,"t":"명사의 복수형","m":"관사 없이는 복수형 tools 사용"}]},{"n":14,"en":"Just try with everyday objects. Hit you desk with a pen and then with a pencil.","ko":"그냥 일상적인 물건들로 시도해 보세요. 책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요.","fx":[{"w":"you","r":"your","at":6,"t":"인칭대명사의 소유격","m":"명사 desk 앞에는 소유격 your 사용"}]},{"n":15,"en":"The two sounds are not the same. You should pay more attention for every sound around you.","ko":"이 두 가지 소리는 같지 않아요. 여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다.","fx":[{"w":"for","r":"to","at":12,"t":"기본전치사","m":"'~에 주의하다'는 pay attention to 사용"}]},{"n":16,"en":"Then, you can find new ways of create sounds.","ko":"그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요.","fx":[{"w":"create","r":"creating","at":7,"t":"동명사","m":"전치사 of 뒤에는 동명사 creating 사용"}]},{"n":17,"en":"Q. It sounds like an interested job.","ko":"질문: 흥미로운 직업 같아요.","fx":[{"w":"interested","r":"interesting","at":5,"t":"분사","m":"직업이 '흥미로운'은 현재분사 interesting 사용"}]},{"n":18,"en":"Thank you of the interview, Ms. Han.","ko":"인터뷰해 주셔서 감사합니다, Han 선생님.","fx":[{"w":"of","r":"for","at":2,"t":"기본전치사","m":"'~에 대해 감사'는 Thank you for 사용"}]},{"n":19,"en":"Thank you for have me.","ko":"저를 인터뷰해 주셔서 감사합니다.","fx":[{"w":"have","r":"having","at":3,"t":"동명사","m":"전치사 for 뒤에는 동명사 having 사용"}]}]},{"no":"78","t":"Harry, the Hedgehog","q":[{"n":1,"en":"Harry were very excited. It was he first day at a new school.","ko":"Harry는 매우 신이 났습니다. 새로운 학교에서의 그의 첫날이었습니다.","fx":[{"w":"were","r":"was","at":1,"t":"be동사의 과거형","m":"주어 Harry(단수)에는 was 사용"},{"w":"he","r":"his","at":6,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 his 사용"}]},{"n":2,"en":"On his way to school, he think, 'I want to make a lot of friend.' When he entered the classroom, everyone looked at he.","ko":"학교로 가는 길에 그는 '많은 친구를 사귀고 싶어.'라고 생각했습니다. 그가 교실에 들어갔을 때, 모두 그를 쳐다봤습니다.","fx":[{"w":"think","r":"thought","at":6,"t":"동사의 과거형","m":"문장 전체가 과거이므로 thought 사용"},{"w":"friend","r":"friends","at":14,"t":"a lot of + 복수명사","m":"a lot of 뒤에는 복수명사 friends 사용"},{"w":"he","r":"him","at":23,"t":"인칭대명사의 목적격","m":"전치사 at 뒤에는 목적격 him 사용"}]},{"n":3,"en":"Harry said, \"Hi, I'm Harry. Nice to meet your.\"","ko":"Harry는 \"안녕, 나는 Harry야. 만나서 반가워.\"라고 말했습니다.","fx":[{"w":"your","r":"you","at":8,"t":"인칭대명사의 목적격","m":"meet 뒤에는 목적격 you 사용"}]},{"n":4,"en":"They looked at his spines curious.","ko":"그들은 그의 가시를 호기심을 갖고 바라봤습니다.","fx":[{"w":"curious","r":"curiously","at":5,"t":"형용사와 부사","m":"동사 looked를 꾸미는 부사 curiously 사용"}]},{"n":5,"en":"At lunchtime, Harry's classmates were play soccer. \"Harry, join we!\"","ko":"점심시간에 Harry의 반 친구들은 축구를 하고 있었습니다. \"Harry, 우리랑 같이 놀자!\"","fx":[{"w":"play","r":"playing","at":5,"t":"과거진행형","m":"were + 동사ing: playing (play 아님)"},{"w":"we","r":"us","at":9,"t":"인칭대명사의 목적격","m":"동사 join 뒤에는 목적격 us 사용"}]},{"n":6,"en":"Peter, the pig, kicked the soccer ball to Harry. When Harry jumped catch the ball, the ball went flat.","ko":"돼지 Peter가 Harry에게 축구공을 찼습니다. Harry가 공을 잡기 위해서 점프했을 때, 공이 터져 버렸습니다.","fx":[{"w":"catch","r":"to catch","at":12,"t":"to부정사의 부사적 용법","m":"\"잡으려고\"는 to catch (to부정사) 사용"}]},{"n":7,"en":"\"Oh, no! Us can't play soccer anymore.","ko":"\"오, 안 돼! 우리는 더 이상 축구를 못 하겠네.","fx":[{"w":"Us","r":"We","at":2,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 We 사용"}]},{"n":8,"en":"Let's goes inside.\" The classmates left the playground.","ko":"안으로 들어가자.\" 반 친구들은 운동장을 떠났습니다.","fx":[{"w":"goes","r":"go","at":1,"t":"Let's + 동사원형","m":"Let's 뒤에는 동사원형 go 사용"}]},{"n":9,"en":"Harry were alone.","ko":"Harry는 혼자였습니다.","fx":[{"w":"were","r":"was","at":1,"t":"be동사의 과거형","m":"주어 Harry(단수)에는 was 사용"}]},{"n":10,"en":"On the school bus, Harry found Ruby, the friend rabbit. \"Hi, Harry!\"","ko":"학교 버스에서 Harry는 친절한 토끼 Ruby를 발견했습니다. \"안녕, Harry!\"","fx":[{"w":"friend","r":"friendly","at":8,"t":"명사와 형용사","m":"명사 rabbit을 꾸미는 형용사 friendly 사용"}]},{"n":11,"en":"Ruby waved in him. Harry went to sit next with Ruby.","ko":"Ruby가 그에게 손을 흔들었습니다. Harry는 Ruby 옆에 앉기 위해 갔습니다.","fx":[{"w":"in","r":"at","at":2,"t":"기본전치사","m":"\"~에게 손을 흔들다\"는 wave at 사용"},{"w":"with","r":"to","at":9,"t":"숙어 표현","m":"\"~ 옆에\"는 next to 사용"}]},{"n":12,"en":"\"Ouch!\" Harry's spines hurts Ruby.","ko":"\"아야!\" Harry의 가시가 Ruby를 아프게 했습니다.","fx":[{"w":"hurts","r":"hurt","at":3,"t":"동사의 과거형","m":"과거 이야기이므로 과거형 hurt 사용 (hurts 아님)"}]},{"n":13,"en":"\"Oh, I'm sorry, Ruby.\" Harry went to the back seats.","ko":"\"오, 미안해, Ruby.\" Harry는 뒷자리로 갔습니다.","fx":[{"w":"seats","r":"seat","at":9,"t":"명사의 단수형","m":"the back seat: 뒷자리 하나이므로 단수 seat 사용"}]},{"n":14,"en":"He was alone again. \"Nobody likes me because these spines.\"","ko":"Harry는 다시 혼자였습니다. \"이 가시 때문에 아무도 나를 좋아하지 않아.\"","fx":[{"w":"these","r":"of these","at":8,"t":"접속사와 전치사","m":"뒤에 명사구(these spines)가 오면 because of 사용"}]},{"n":15,"en":"Harry felt really sadly.","ko":"Harry는 정말 슬프다고 느꼈습니다.","fx":[{"w":"sadly","r":"sad","at":3,"t":"형용사와 부사","m":"felt 뒤 보어 자리에는 형용사 sad 사용"}]},{"n":16,"en":"A few weeks later, Harry was sitting in the back of the classroom. It was him birthday.","ko":"몇 주 뒤, Harry는 교실 뒤에 앉아 있었습니다. 그의 생일이었습니다.","fx":[{"w":"him","r":"his","at":15,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 his 사용"}]},{"n":17,"en":"His classmates was talking about something. Then they left the classroom without Harry.","ko":"그의 반 친구들은 무언가에 대해 이야기하고 있었습니다. 그러더니 그들은 Harry 없이 교실을 떠났습니다.","fx":[{"w":"was","r":"were","at":2,"t":"be동사의 과거형","m":"주어 His classmates(복수)에는 were 사용"}]},{"n":18,"en":"Harry felt so lonelier.","ko":"Harry는 너무 외롭다고 느꼈습니다.","fx":[{"w":"lonelier","r":"lonely","at":3,"t":"비교급","m":"비교 대상이 없으므로 원급 lonely 사용"}]},{"n":20,"en":"When Harry went outside, his classmates were waiting for he. They were wearing sponge jacket.","ko":"Harry가 밖으로 나갔을 때 그의 반 친구들이 그를 기다리고 있었습니다. 그들은 스펀지 재킷을 입고 있었습니다.","fx":[{"w":"he","r":"him","at":9,"t":"인칭대명사의 목적격","m":"전치사 for 뒤에는 목적격 him 사용"},{"w":"jacket","r":"jackets","at":14,"t":"명사의 복수형","m":"여러 명이 입었으므로 복수 jackets 사용"}]},{"n":22,"en":"Ruby gived a box to him. Harry was surprised.","ko":"Ruby가 그에게 상자를 주었습니다. Harry는 놀랐습니다.","fx":[{"w":"gived","r":"gave","at":1,"t":"불규칙 과거형","m":"give의 과거형은 gave (gived 아님)"}]},{"n":23,"en":"Harry glad opened the box and looked inside. There were a jacket for Harry.","ko":"Harry는 기뻐하며 그 상자를 열어 안을 보았습니다. Harry를 위한 재킷이 있었습니다.","fx":[{"w":"glad","r":"gladly","at":1,"t":"형용사와 부사","m":"동사 opened를 꾸미는 부사 gladly 사용"},{"w":"were","r":"was","at":9,"t":"There is/are 구문의 수일치","m":"There + 단수명사 → was (were 아님)"}]},{"n":25,"en":"Then all the classmates hugged to Harry. A happily smile spread on Harry's face.","ko":"그러고 나서 모든 반 친구들이 Harry를 껴안았습니다. 행복한 미소가 Harry의 얼굴에 번졌습니다.","fx":[{"w":"to Harry","r":"Harry","at":5,"t":"타동사와 전치사","m":"hug는 타동사라 전치사 없이 Harry 사용"},{"w":"happily","r":"happy","at":8,"t":"형용사와 부사","m":"명사 smile 앞에는 형용사 happy 사용"}]},{"n":26,"en":"He weren't lonely anymore.","ko":"그는 더 이상 외롭지 않았습니다.","fx":[{"w":"weren't","r":"wasn't","at":1,"t":"be동사의 부정문","m":"주어 He에는 wasn't 사용"}]}]}],"m2":[{"no":"01","t":"What Kind of Friend Are You?","q":[{"n":1,"en":"An new school year started! You can makes new friends and be a good friend to others, too.","ko":"새로운 학년이 시작되었습니다! 여러분은 새로운 친구를 사귀고, 다른 이들에게 좋은 친구가 될 수도 있습니다.","fx":[{"w":"An","r":"A","at":0,"t":"관사 a/an","m":"new는 자음 소리라 a new 사용"},{"w":"makes","r":"make","at":7,"t":"조동사","m":"조동사 can 뒤에는 동사원형 make 사용"}]},{"n":2,"en":"What kind of friend do you want to be? Three student will tell you their stories.","ko":"여러분은 어떤 종류의 친구가 되고 싶은가요? 세 학생이 여러분에게 그들의 이야기를 들려줄 겁니다.","fx":[{"w":"student","r":"students","at":10,"t":"명사의 복수형","m":"Three 뒤에는 복수명사 students 사용"}]},{"n":3,"en":"I want to be someone who is happy about my friends' good news. Minji and me are both interested in art.","ko":"나는 친구의 좋은 소식에 기뻐하는 사람이 되고 싶어요. 민지와 나는 둘 다 미술에 관심이 있어요.","fx":[{"w":"me","r":"I","at":15,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 I 사용"}]},{"n":4,"en":"When she won first prize in the school's art competition, I felt jealously. I couldn't congratulate her at first.","ko":"그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요. 처음에 나는 그녀를 축하할 수 없었어요.","fx":[{"w":"jealously","r":"jealous","at":12,"t":"형용사와 부사","m":"feel 뒤 보어는 형용사 jealous 사용"}]},{"n":5,"en":"But I knew she worked really hard. Final, I congratulated her, and she was happy about it.","ko":"하지만 나는 그녀가 정말 열심히 노력한 것을 알았어요. 결국 나는 그녀를 축하해 주었고 그녀는 그것을 기뻐했어요.","fx":[{"w":"Final","r":"Finally","at":7,"t":"형용사와 부사","m":"문장을 꾸미는 부사 Finally 사용"}]},{"n":6,"en":"I want to be a friend who gives honest advices. One of my friends were always late.","ko":"나는 솔직한 충고를 해주는 친구가 되고 싶어요. 내 친구 중 하나는 항상 늦었어요.","fx":[{"w":"advices","r":"advice","at":9,"t":"셀 수 없는 명사","m":"advice는 셀 수 없어 복수형 안 씀"},{"w":"were","r":"was","at":14,"t":"be동사의 수일치","m":"주어 One(단수)이므로 was (were 아님)"}]},{"n":7,"en":"People has to wait for him, and it made everyone upset. So, I decided to talk to him.","ko":"사람들은 그를 기다려야 했고, 그게 모두를 속상하게 만들었어요. 그래서 나는 그에게 이야기하기로 마음을 먹었어요.","fx":[{"w":"has","r":"had","at":1,"t":"동사의 수일치","m":"주어 People(복수)은 have to (has 아님)"}]},{"n":8,"en":"\"Can you please being on time?\" I said.","ko":"나는 \"시간을 지켜주겠니?\" 라고 말했어요.","fx":[{"w":"being","r":"be","at":3,"t":"조동사","m":"Can you 뒤에는 동사원형 be 사용"}]},{"n":9,"en":"\"We want fully enjoy our time together.\" Talking to my friend about this problem were not easy.","ko":"\"우리는 우리의 시간을 온전히 함께 즐기고 싶어. 이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요.","fx":[{"w":"fully","r":"to fully","at":2,"t":"to부정사","m":"want 뒤에는 to부정사 to enjoy 사용"},{"w":"were","r":"was","at":14,"t":"be동사","m":"동명사 주어 Talking은 단수라 was 사용"}]},{"n":11,"en":"I try to cheer up my friends when them are having a hard time. One day, Jisu posted, \"It was a hard day,\" on her social media.","ko":"나는 친구들이 힘든 시간을 보낼 때 그들을 격려하려 노력해요. 어느 날 지수가 자신의 소셜 미디어에 \"힘든 하루였다.\"라고 게시했어요.","fx":[{"w":"them","r":"they","at":8,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 they 사용"}]},{"n":12,"en":"I wanted to do something to made her happy. So, I bought her chocolate cookies, her favorite snack.","ko":"나는 그녀를 기쁘게 하기 위해 무언가를 하고 싶었어요. 그래서 나는 그녀가 제일 좋아하는 간식인 초콜릿 쿠키를 그녀에게 사주었어요.","fx":[{"w":"made","r":"make","at":6,"t":"to부정사","m":"to 뒤에는 동사원형 make 사용"}]},{"n":13,"en":"Then we watched a movie that had an funny story and took pictures together at a photo booths.","ko":"그런 다음 우리는 재미있는 이야기로 된 영화를 보고, 사진 촬영 부스에서 함께 사진을 찍었어요.","fx":[{"w":"an","r":"a","at":7,"t":"관사 a/an","m":"funny는 자음 소리라 a funny 사용"},{"w":"booths","r":"booth","at":17,"t":"명사의 복수형","m":"a 뒤에는 단수명사 booth 사용"}]},{"n":14,"en":"We had a great time, and she said she felt more better.","ko":"우리는 좋은 시간을 보냈고, 그녀는 기분이 나아졌다고 말했어요.","fx":[{"w":"more better","r":"better","at":10,"t":"비교급","m":"better는 이미 비교급이라 more 불필요"}]}]},{"no":"02","t":"Sumin's Daily Routine with Luna","q":[{"n":1,"en":"I wake up to the sound of cheerful music. The curtains open, and sunlight fill my room.","ko":"나는 쾌활한 음악 소리에 잠에서 깬다. 커튼이 열리고 햇살이 내 방을 가득 채운다.","fx":[{"w":"fill","r":"fills","at":14,"t":"3인칭 단수 현재형","m":"주어 sunlight(3인칭 단수)는 fills (fill 아님)"}]},{"n":2,"en":"\"Good morning, Sumin. It's time to getting up!\"","ko":"\"좋은 아침이야, 수민. 일어날 시간이야!\"","fx":[{"w":"getting","r":"get","at":6,"t":"to부정사","m":"to 뒤에는 동사원형 get 사용"}]},{"n":3,"en":"\"Hi, Luna!\" I says to my AI friend.","ko":"\"안녕, 루나!\" 나는 내 AI 친구에게 말한다.","fx":[{"w":"says","r":"say","at":3,"t":"일반동사의 현재형","m":"주어 I에는 동사원형 say 사용"}]},{"n":4,"en":"I brush mine teeth and check today's schedule on the smartly mirror.","ko":"나는 양치를 하고 스마트 거울에서 오늘의 일정을 확인한다.","fx":[{"w":"mine","r":"my","at":2,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"},{"w":"smartly","r":"smart","at":10,"t":"형용사와 부사","m":"명사 mirror를 꾸미는 형용사 smart 사용"}]},{"n":6,"en":"\"It's sun today.\"","ko":"\"오늘은 맑아.\"","fx":[{"w":"sun","r":"sunny","at":1,"t":"형용사와 명사","m":"날씨 표현 It's 뒤에는 형용사 sunny 사용"}]},{"n":7,"en":"\"Great. I can play soccer while lunch break.\"","ko":"\"좋아. 점심시간에 축구할 수 있겠어.\"","fx":[{"w":"while","r":"during","at":5,"t":"전치사와 접속사","m":"명사구 앞에는 전치사 during 사용"}]},{"n":8,"en":"\"Good! You'll have funny with your friends!\"","ko":"\"좋아! 넌 친구들과 즐겁게 지낼 거야!\"","fx":[{"w":"funny","r":"fun","at":3,"t":"형용사와 명사","m":"have 뒤 목적어는 명사 fun 사용"}]},{"n":9,"en":"I enjoy an healthy breakfast with my family and walk to school.","ko":"나는 가족들과 건강한 아침 식사를 즐기고 학교로 걸어간다.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"자음 소리 healthy 앞에는 a 사용"}]},{"n":10,"en":"In history class, Ms. Shin guide us on a virtual trip to Egypt.","ko":"역사 시간에 신 선생님께서는 우리를 이집트로 가는 가상 여행으로 안내하신다.","fx":[{"w":"guide","r":"guides","at":5,"t":"3인칭 단수 현재형","m":"주어 Ms. Shin(3인칭 단수)은 guides (guide 아님)"}]},{"n":11,"en":"With our goggle on, we soon walks along the Nile River and enter a grand pyramid.","ko":"고글을 쓰자, 우리는 곧 나일강을 따라 걷고 웅장한 피라미드로 들어간다.","fx":[{"w":"goggle","r":"goggles","at":2,"t":"명사의 복수형","m":"goggles는 항상 복수형으로 사용"},{"w":"walks","r":"walk","at":6,"t":"일반동사의 현재형","m":"주어 we에는 동사원형 walk 사용"}]},{"n":12,"en":"\"Do you know about Pharaohs? They was the kings of ancient Egypt.","ko":"\"여러분은 파라오에 대해 알고 있나요? 그들은 고대 이집트의 왕들이었어요.","fx":[{"w":"was","r":"were","at":6,"t":"be동사의 수일치","m":"주어 They(복수)는 were (was 아님)"}]},{"n":13,"en":"You can see their lives in these wall paintings. The ancient Egyptians believed on life after death.\"","ko":"이 벽화들에서 그들의 삶을 볼 수 있어요. 고대 이집트인들은 사후 세계를 믿었어요.\"","fx":[{"w":"on","r":"in","at":13,"t":"기본전치사","m":"'~의 존재를 믿다'는 believe in 사용"}]},{"n":14,"en":"Exploring a new world in class is wonderfully!","ko":"수업 시간에 새로운 세계를 탐험하는 것은 놀랍다!","fx":[{"w":"wonderfully","r":"wonderful","at":7,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 wonderful 사용"}]},{"n":15,"en":"After lunch, I go outside to play soccer. I feel happy when my team win!","ko":"점심을 먹고, 나는 축구를 하기 위해 밖으로 나간다. 나는 나의 팀이 이기면 기분이 좋다!","fx":[{"w":"win","r":"wins","at":14,"t":"3인칭 단수 현재형","m":"주어 my team(3인칭 단수)은 wins (win 아님)"}]},{"n":16,"en":"\"Sumin! That was a great goals!\"","ko":"\"수민아! 정말 멋진 골이었어!\"","fx":[{"w":"goals","r":"goal","at":5,"t":"명사의 단수형","m":"a 뒤에는 단수명사 goal 사용"}]},{"n":17,"en":"\"Thanks, Minji. We did good together!\"","ko":"\"고마워, 민지야. 우리 같이 잘했어!\"","fx":[{"w":"good","r":"well","at":4,"t":"형용사와 부사","m":"동사 did를 꾸미는 부사 well 사용"}]},{"n":18,"en":"We both smile and cheering for each other.","ko":"우리는 둘 다 미소 짓고 서로를 응원한다.","fx":[{"w":"cheering","r":"cheer","at":4,"t":"병렬구조","m":"smile and cheer: 동사원형 병렬 (cheering 아님)"}]},{"n":20,"en":"In home, I review my studies with Luna.","ko":"집에서 나는 내가 공부한 내용을 루나와 복습한다.","fx":[{"w":"In","r":"At","at":0,"t":"기본전치사","m":"'집에서'는 at home 사용"}]},{"n":21,"en":"\"I couldn't solve these three question on the math test today. Can you explain them?\"","ko":"\"나는 오늘 수학 시험에서 이 세 문제를 못 풀었어. 그것들을 설명해 줄 수 있어?\"","fx":[{"w":"question","r":"questions","at":5,"t":"명사의 복수형","m":"three 뒤에는 복수명사 questions 사용"}]},{"n":22,"en":"\"OK. I'll give you a tips and problems to practice.\"","ko":"\"알겠어. 내가 몇 가지 조언과 연습할 문제들을 줄게.\"","fx":[{"w":"a","r":"some","at":4,"t":"수량 형용사","m":"복수명사 tips 앞에는 some 사용"}]}]},{"no":"03","t":"Different but Together","q":[{"n":2,"en":"I'm a thoughtfully character in the stories, and I'm kind with my friends. Now I'm looking at some old picture of them.","ko":"나는 이야기 속에서 사려 깊은 등장인물이고, 내 친구들에게 친절해. 지금 나는 그들의 오래된 사진 몇 장을 보고 있어.","fx":[{"w":"thoughtfully","r":"thoughtful","at":2,"t":"형용사와 부사","m":"명사 character 앞에는 형용사 thoughtful 사용"},{"w":"with","r":"to","at":10,"t":"기본전치사","m":"'~에게 친절한'은 kind to 사용"},{"w":"picture","r":"pictures","at":19,"t":"수량 형용사 some","m":"some 뒤에는 복수명사 pictures 사용"}]},{"n":3,"en":"They are the happier animals in the woods. Would you like take a look and hear about them?","ko":"그들은 숲에서 가장 행복한 동물들이지. 사진을 살펴보고 그들에 대한 이야기를 들어볼래?","fx":[{"w":"happier","r":"happiest","at":3,"t":"최상급","m":"'가장 행복한'은 최상급 the happiest 사용"},{"w":"take","r":"to take","at":11,"t":"to부정사","m":"would like 뒤에는 to take 사용"}]},{"n":4,"en":"This is Pooh and me. Pooh loves all kinds of food, but he like honey the best.","ko":"이건 Pooh와 나야. Pooh는 모든 종류의 음식을 좋아하지만, 꿀을 가장 좋아해.","fx":[{"w":"like","r":"likes","at":13,"t":"동사의 수일치","m":"주어 he(3인칭 단수)에는 likes 사용"}]},{"n":5,"en":"In this pictures, he is holding an big balloon and trying to get honey from a beehive. What happened next?","ko":"이 사진에서, 그는 커다란 풍선을 잡고 있고 벌집에서 꿀을 꺼내려고 하고 있어. 그 다음에는 무슨 일이 일어났을까?","fx":[{"w":"pictures","r":"picture","at":2,"t":"지시형용사","m":"this 뒤에는 단수명사 picture 사용"},{"w":"an","r":"a","at":6,"t":"관사 a/an","m":"자음 소리 b 앞에는 a big 사용"}]},{"n":6,"en":"The bees popped his balloon, so he couldn't got the honey. He failed, but he was cheerfully and hopeful.","ko":"벌들이 Pooh의 풍선을 터뜨렸고, 그래서 그는 꿀을 얻을 수 없었어. 그는 실패했지만, 쾌활하고 희망에 차 있었어.","fx":[{"w":"got","r":"get","at":8,"t":"조동사","m":"couldn't 뒤에는 동사원형: get (got 아님)"},{"w":"cheerfully","r":"cheerful","at":16,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 cheerful 사용"}]},{"n":8,"en":"This is an picture of a stormy day in the woods. The strong wind almost broke the door, so my friends had to holding it.","ko":"이것은 숲에 폭풍우가 몰아치던 날의 사진이야. 강한 바람이 문을 거의 부술 뻔해서, 내 친구들이 그것을 잡고 있어야 했어.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"자음 소리 p 앞에는 a picture 사용"},{"w":"holding","r":"hold","at":23,"t":"to부정사","m":"had to 뒤에는 동사원형: hold (holding 아님)"}]},{"n":9,"en":"Luckily, there was a rope to help. Pooh and Rabbit couldn't moved, but small, scared Piglet could.","ko":"다행히도, 도움이 될 밧줄이 하나 있었어. Pooh와 Rabbit은 움직일 수 없었지만, 작고 겁 많은 Piglet은 할 수 있었어.","fx":[{"w":"moved","r":"move","at":11,"t":"조동사","m":"couldn't 뒤에는 동사원형 move 사용"}]},{"n":10,"en":"They said to Piglet, \"Tie the door, please!\" He gathered him courage and tied it tightly.","ko":"그들은 Piglet에게 말했어. \"문 좀 묶어 줘!\" 그는 용기를 내어 문을 단단히 묶었어.","fx":[{"w":"him","r":"his","at":10,"t":"인칭대명사의 소유격","m":"명사 courage 앞에는 소유격 his 사용"}]},{"n":12,"en":"My friend in the last picture are Owl. Owl believes he is the smarter animal in the woods.","ko":"마지막 사진 속의 내 친구는 Owl이야. Owl은 자신이 숲에서 가장 똑똑한 동물이라고 믿어.","fx":[{"w":"are","r":"is","at":6,"t":"be동사의 수일치","m":"주어 My friend(단수)에는 is 사용"},{"w":"smarter","r":"smartest","at":13,"t":"최상급","m":"'가장 똑똑한'은 최상급 the smartest 사용"}]},{"n":13,"en":"He is proud of his knowledge. In this picture, Owl is telling us a long stories, and we are listen.","ko":"그는 자신의 지식을 자랑스러워하지. 이 사진에서, Owl은 우리에게 긴 이야기를 말해주고 있고, 우리는 듣고 있지.","fx":[{"w":"stories","r":"story","at":15,"t":"명사의 복수형","m":"a 뒤에는 단수명사 story 사용"},{"w":"listen","r":"listening","at":19,"t":"현재진행형","m":"are 뒤에는 -ing형 listening 사용"}]},{"n":15,"en":"We're not real following his story. He talks a lots, and sometimes his stories are hard to understanding.","ko":"우리는 그의 이야기를 잘 따라가고 있지는 않아. 그는 말을 많이 하고, 가끔 그의 이야기는 이해하기 어려워.","fx":[{"w":"real","r":"really","at":2,"t":"형용사와 부사","m":"동사 following 수식은 부사 really 사용"},{"w":"lots","r":"lot","at":9,"t":"수량 표현","m":"'많이'는 a lot 사용 (lots 앞에 a 없음)"},{"w":"understanding","r":"understand","at":17,"t":"to부정사","m":"to 뒤에는 동사원형 understand 사용"}]},{"n":16,"en":"But he loves giving us advices, and it's often helpful. Owl is always ready to help.","ko":"하지만 그는 우리에게 조언해 주는 것을 좋아하고, 그 조언은 종종 도움이 돼. Owl은 항상 도울 준비가 되어 있어.","fx":[{"w":"advices","r":"advice","at":5,"t":"셀 수 없는 명사","m":"advice는 셀 수 없으므로 advice 사용"}]},{"n":17,"en":"We're all different, but we're good friend. We love each other.","ko":"우리는 모두 다르지만, 좋은 친구들이야. 우리는 서로를 사랑해.","fx":[{"w":"friend","r":"friends","at":6,"t":"명사의 복수형","m":"주어 We(복수)에는 good friends 사용"}]}]},{"no":"04","t":"Live Freely and Happily Ever After!","q":[{"n":1,"en":"You can work with NGOs as an teenager. It is a great ways to learn about socially issues and make the world better.","ko":"여러분은 십 대 청소년으로서 NGO와 함께 활동할 수 있습니다. 그것은 사회 문제에 대해 배우고 세상을 더 좋게 만드는 좋은 방법입니다.","fx":[{"w":"an","r":"a","at":6,"t":"관사 a/an","m":"자음 소리 teenager 앞에는 a 사용"},{"w":"ways","r":"way","at":12,"t":"관사와 명사의 수","m":"a 뒤에는 단수명사 way 사용"},{"w":"socially","r":"social","at":16,"t":"형용사와 부사","m":"명사 issues를 꾸미는 형용사 social 사용"}]},{"n":3,"en":"I growed up in Jeju-do, so I had many chance to see dolphins. Then, I learned that much dolphins are in danger.","ko":"나는 제주도에서 자라서 돌고래를 볼 기회가 많았다. 그러다 많은 돌고래들이 위험에 처해 있다는 것을 알았다.","fx":[{"w":"growed","r":"grew","at":1,"t":"불규칙 과거형","m":"grow의 과거형은 grew"},{"w":"chance","r":"chances","at":9,"t":"명사의 복수형","m":"many 뒤에는 복수명사 chances 사용"},{"w":"much","r":"many","at":17,"t":"수량 형용사 many/much","m":"셀 수 있는 복수명사 앞에는 many 사용"}]},{"n":5,"en":"So, I searched the Internet and found a NGO, Dolphin Lovers.","ko":"그래서 인터넷을 검색하다가 NGO인 Dolphin Lovers를 찾았다.","fx":[{"w":"a","r":"an","at":7,"t":"관사 a/an","m":"모음 소리 NGO 앞에는 an 사용"}]},{"n":6,"en":"It does various activities such as cleaning up beaches and help dolphins. After some thought, I joined it today.","ko":"이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다. 고민 끝에, 나는 오늘 이곳에 가입했다.","fx":[{"w":"help","r":"helping","at":10,"t":"동명사","m":"such as 뒤 병렬구조로 helping 사용"}]},{"n":7,"en":"Many dolphins get sick or even die because plastic waste and fishing nets, so cleaning up beaches are important.","ko":"많은 돌고래들이 플라스틱 쓰레기와 어망 때문에 병에 걸리거나 심지어 죽기도 하므로 해변을 청소하는 것은 중요하다.","fx":[{"w":"plastic","r":"of plastic","at":8,"t":"전치사와 접속사","m":"명사구 앞에는 because of 사용"},{"w":"are","r":"is","at":17,"t":"동명사 주어","m":"동명사 주어 cleaning은 단수 취급, is 사용"}]},{"n":8,"en":"There were a beach cleanup party today, and I took part in it. Cleaning up the beach was not easily, but I enjoyed it.","ko":"오늘 해변 청소 모임이 있었고, 나는 그 모임에 참가했다. 해변을 청소하는 일이 쉽지는 않았지만 즐거웠다.","fx":[{"w":"were","r":"was","at":1,"t":"be동사의 수일치","m":"a beach cleanup party는 단수: were가 아니라 was"},{"w":"easily","r":"easy","at":19,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 easy 사용"}]},{"n":9,"en":"Oh, I saw Aunt Sumi there. Her is also a member of Dolphin Lovers.","ko":"아, 그곳에서 나는 수미 이모를 만났다. 그녀도 Dolphin Lovers 회원이다.","fx":[{"w":"Her","r":"She","at":6,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 She 사용"}]},{"n":11,"en":"This afternoon, I took part in a training class for Halla and Olle, two dolphin in a aquarium in Jeju-do.","ko":"오늘 오후에 나는 제주도의 한 수족관에 있는 돌고래 두 마리, 한라와 올레의 훈련 수업에 참여했다.","fx":[{"w":"dolphin","r":"dolphins","at":14,"t":"명사의 복수형","m":"two 뒤에는 복수명사 dolphins 사용"},{"w":"a","r":"an","at":16,"t":"관사 a/an","m":"모음 소리 aquarium 앞에는 an 사용"}]},{"n":12,"en":"The lately project of Dolphin Lovers is to return they to the sea. For this, Halla and Olle first need to learn some skills.","ko":"Dolphin Lovers의 최근 프로젝트는 그들을 바다로 돌려보내는 것이다. 이를 위해 한라와 올레는 먼저 몇 가지 기술을 배워야 한다.","fx":[{"w":"lately","r":"latest","at":1,"t":"형용사와 부사","m":"명사 project를 꾸미는 형용사 latest 사용"},{"w":"they","r":"them","at":9,"t":"인칭대명사의 목적격","m":"동사 return 뒤에는 목적격 them 사용"}]},{"n":13,"en":"Them will need them to survive in the wild. I really wanted be part of the project.","ko":"그들은 야생에서 살아남기 위해 이 기술들이 필요할 것이다. 나는 그 프로젝트에 정말 참여하고 싶었다.","fx":[{"w":"Them","r":"They","at":0,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 They 사용"},{"w":"be","r":"to be","at":12,"t":"to부정사","m":"want 뒤에는 to be: to가 빠짐"}]},{"n":14,"en":"Luckily, I got the chance. I just runned some errands in the training class today, but the experience made me so excited.","ko":"다행히 나는 기회를 얻었다. 나는 오늘 훈련 수업에서 그저 몇 가지 심부름을 했을 뿐이지만, 그 경험은 나를 매우 설레게 했다.","fx":[{"w":"runned","r":"ran","at":7,"t":"불규칙 과거형","m":"run의 과거형은 runned가 아니라 ran"}]}]},{"no":"05","t":"Have a Good Talk!","q":[{"n":1,"en":"The new school year is here! Do you get nervously when you talk to other students?","ko":"새 학년이 되었다! 당신은 다른 학생들과 대화할 때 긴장되는가?","fx":[{"w":"nervously","r":"nervous","at":9,"t":"형용사와 부사","m":"get 뒤 보어 자리에는 형용사 nervous 사용"}]},{"n":2,"en":"Do you have trouble starting conversations? Having a good conversation are not easy.","ko":"당신은 대화를 시작하는 데 어려움이 있는가? 대화를 잘하는 것은 쉽지 않다.","fx":[{"w":"are","r":"is","at":10,"t":"be동사 수일치·과거","m":"동명사 주어는 단수 취급: is (are 아님)"}]},{"n":3,"en":"But don't worry. Here is some tips to have a good conversation.","ko":"하지만 걱정하지 마라. 여기 좋은 대화를 나누기 위한 몇 가지 조언이 있다.","fx":[{"w":"is","r":"are","at":4,"t":"be동사 수일치·과거","m":"Here 뒤 주어 some tips(복수): are (is 아님)"}]},{"n":5,"en":"Begin conversations with a easy topic. Talk about the weather or hobbies.","ko":"쉬운 주제로 대화를 시작해라. 날씨나 취미에 관해 말해라.","fx":[{"w":"a","r":"an","at":3,"t":"관사 a/an","m":"모음 소리 easy 앞에는 an 사용"}]},{"n":6,"en":"For example, say, \"The weather is so nice today, doesn't it?\" Then the other person can answer easily.","ko":"예를 들면, \"오늘 날씨가 아주 좋아, 그렇지 않니?\"라고 말해라. 그러면 상대방은 쉽게 대답할 수 있다.","fx":[{"w":"doesn't","r":"isn't","at":9,"t":"부가의문문","m":"be동사 is에는 isn't it 사용"}]},{"n":7,"en":"Small talk can leads to other fun topics to talk about.","ko":"가벼운 대화는 대화할 다른 재미있는 주제로 이어질 수 있다.","fx":[{"w":"leads","r":"lead","at":3,"t":"조동사","m":"조동사 can 뒤에는 동사원형: lead (leads 아님)"}]},{"n":9,"en":"Don't just sit still and listen. Active listen.","ko":"그저 가만히 앉아서 듣지 마라. 적극적으로 들어라.","fx":[{"w":"Active","r":"Actively","at":6,"t":"형용사와 부사","m":"동사 listen을 꾸밀 때는 부사 Actively 사용"}]},{"n":10,"en":"Make eyes contact with the speaker. Nod you head from time to time.","ko":"화자와 눈을 맞춰라. 때때로 당신의 고개를 끄덕여라.","fx":[{"w":"eyes","r":"eye","at":1,"t":"명사의 복수형","m":"명사를 꾸미는 eye는 단수형 사용 (eye contact)"},{"w":"you","r":"your","at":7,"t":"인칭대명사의 격","m":"명사 앞 소유격 your 사용"}]},{"n":11,"en":"You can also say, \"Right,\" or \"I see.\" These things will shows that you're really listening.","ko":"당신은 또한 \"맞아.\" 또는 \"그렇구나.\"라고 말할 수 있다. 이러한 것들은 당신이 정말로 듣고 있다는 것을 보여줄 것이다.","fx":[{"w":"shows","r":"show","at":11,"t":"조동사","m":"조동사 will 뒤에는 동사원형: show (shows 아님)"}]},{"n":13,"en":"Use good gestures. When you say, \"I don't know,\" you can raising your shoulders and hands.","ko":"적절한 몸짓을 사용해라. 당신이 \"나는 모르겠어.\"라고 말할 때, 당신의 어깨와 손을 들어 올릴 수 있다.","fx":[{"w":"raising","r":"raise","at":11,"t":"조동사 뒤 동사원형","m":"can 뒤에는 동사원형 raise 사용"}]},{"n":14,"en":"You can also makes facial expressions. Lift your eyebrows or stick out your lower lip.","ko":"당신은 또한 얼굴 표정을 지을 수 있다. 눈썹을 올리거나 아랫입술을 내밀어라.","fx":[{"w":"makes","r":"make","at":3,"t":"조동사","m":"조동사 can 뒤에는 동사원형: make (makes 아님)"}]},{"n":15,"en":"Use good body language, and your message will be more stronger and clearer.","ko":"적절한 몸짓 언어를 사용해라, 그러면 당신의 메시지가 더 강력하고 더 명확해질 것이다.","fx":[{"w":"more stronger","r":"stronger","at":9,"t":"비교급","m":"stronger 앞에 more 중복 불가"}]},{"n":17,"en":"Be brave and tell you personal story. For example, you can talk at your childhood.","ko":"용기를 내어 당신의 개인적인 이야기를 말해라. 예를 들면, 당신은 어린 시절에 관해 말할 수 있다.","fx":[{"w":"you","r":"your","at":4,"t":"인칭대명사의 격","m":"명사 앞 소유격 your 사용"},{"w":"at","r":"about","at":12,"t":"기본전치사","m":"'~에 대해 말하다'는 talk about 사용"}]},{"n":18,"en":"You can say, \"When I was 10, I was the most slow runner on my class.\" When you open up, the other person will does the same.","ko":"당신은 \"내가 10살이었을 때, 나는 반에서 달리기가 가장 느린 주자였어.\"라고 말할 수 있다. 당신이 마음을 열 때, 상대방도 똑같이 할 것이다.","fx":[{"w":"most slow","r":"slowest","at":10,"t":"최상급","m":"slow의 최상급은 the slowest"},{"w":"on","r":"in","at":13,"t":"기본전치사","m":"'학급에서'는 전치사 in 사용"},{"w":"does","r":"do","at":24,"t":"조동사","m":"조동사 will 뒤에는 동사원형: do (does 아님)"}]},{"n":19,"en":"This can lead to an more meaningful conversation.","ko":"이것은 더 의미 있는 대화로 이어질 수 있다.","fx":[{"w":"an","r":"a","at":4,"t":"관사 a/an","m":"자음 소리 more 앞에는 a 사용"}]}]},{"no":"06","t":"Looking for Advice","q":[{"n":4,"en":"How can I gets a dog?cute_puppy","ko":"어떻게 하면 개를 키울 수 있을까?cute_puppy","fx":[{"w":"gets","r":"get","at":3,"t":"조동사","m":"조동사 can 뒤에는 동사원형 get 사용"}]},{"n":8,"en":"I can't decided on a school club. Last year, I were on the dance team.","ko":"나는 학교 동아리를 결정할 수가 없어. 작년에 나는 댄스 팀에 있었어.","fx":[{"w":"decided","r":"decide","at":2,"t":"조동사 뒤 동사원형","m":"조동사 can't 뒤에는 동사원형: decide"},{"w":"were","r":"was","at":10,"t":"be동사의 과거형","m":"주어 I에는 was 사용"}]},{"n":9,"en":"This year, I want to try new something. Actually, I'm interested at coding.","ko":"올해엔 뭔가 새로운 것을 시도해 보고 싶어. 사실, 나는 코딩에 관심이 있어.","fx":[{"w":"new something","r":"something new","at":6,"t":"형용사의 위치","m":"-thing 뒤에서 꾸미므로 something new 사용"},{"w":"at","r":"in","at":11,"t":"기본전치사","m":"'~에 관심 있는'은 interested in 사용"}]},{"n":10,"en":"However, all of my friend will stay on the dance team. What should I do?","ko":"그렇지만 내 친구들은 모두 댄스 팀에 계속 남아 있을 거야. 나는 어떻게 해야 할까?","fx":[{"w":"friend","r":"friends","at":4,"t":"명사의 복수형","m":"all of 뒤에는 복수명사 friends 사용"}]},{"n":11,"en":"↳ Re: Stay with you friends.","ko":"↳ 답변: 친구들과 함께 있어.","fx":[{"w":"you","r":"your","at":4,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 your 사용"}]},{"n":12,"en":"Club activity are all about spending time with your friends. You'll have so many fun with your friends on the dance team.","ko":"동아리 활동은 친구들과 시간을 보내는 것이 전부야. 너는 댄스 팀에서 친구들과 정말 재미있는 시간을 보낼 거야.","fx":[{"w":"activity","r":"activities","at":1,"t":"명사의 복수형","m":"are 앞 주어는 복수명사 activities 사용"},{"w":"many","r":"much","at":13,"t":"수량 형용사 many/much","m":"셀 수 없는 fun 앞에는 much 사용"}]},{"n":13,"en":"Imagine dancing together at the school festival! Those moment will make good memories.","ko":"학교 축제에서 함께 춤추는 것을 상상해 봐! 그러한 순간들은 좋은 추억이 될 거야.","fx":[{"w":"moment","r":"moments","at":8,"t":"지시형용사","m":"복수명사 앞 Those에는 moments 사용"}]},{"n":14,"en":"↳ Re: Try something differently!","ko":"↳ 답변: 다른 것을 시도해 봐!","fx":[{"w":"differently","r":"different","at":4,"t":"형용사와 부사","m":"-thing 뒤 꾸밈말은 형용사 different 사용"}]},{"n":15,"en":"You should try something that interests your. Who knows?","ko":"너는 네가 관심 있는 것을 시도해야 해. 혹시 알아?","fx":[{"w":"your","r":"you","at":6,"t":"인칭대명사의 목적격","m":"동사 interests 뒤에는 목적격 you 사용"}]},{"n":16,"en":"You might learn coding and create a fun apps. Maybe your friends will uses your app.","ko":"네가 코딩을 배워서 재미있는 앱을 만들 수도 있지. 아마 네 친구들이 너의 앱을 사용할 수도 있고.","fx":[{"w":"apps","r":"app","at":8,"t":"관사와 명사의 수","m":"a 뒤에는 단수명사 app 사용"},{"w":"uses","r":"use","at":13,"t":"조동사","m":"조동사 will 뒤에는 동사원형 use 사용"}]},{"n":19,"en":"Yesterday, I ran into a friend who were walking her dog. The dog's name are Gamja, and she's so cute!","ko":"어제 나는 자신의 개를 산책시키는 친구와 우연히 만났어. 그 개의 이름은 감자이고, 정말 귀여워!","fx":[{"w":"were","r":"was","at":7,"t":"be동사의 과거형","m":"선행사 a friend는 단수: was (were 아님)"},{"w":"are","r":"is","at":14,"t":"be동사의 현재형","m":"주어 The dog's name은 단수: is (are 아님)"}]},{"n":20,"en":"I wants a dog, too, but my parents won't allow it. What should I do?","ko":"나도 개를 키우고 싶지만, 나의 부모님은 그것을 허락하지 않으실 거야. 나는 어떻게 해야 할까?","fx":[{"w":"wants","r":"want","at":1,"t":"일반동사의 현재형","m":"주어 I는 3인칭 단수가 아니므로 want (wants 아님)"}]}]},{"no":"07","t":"My Bag, My School Life","q":[{"n":1,"en":"Welcome back to school, friends! Why don't we open up our bags and get to know each others?","ko":"학교로 돌아온 걸 환영해요, 친구들! 우리 가방을 열어서 서로를 알아 가는 시간을 가져보는 것이 어떨까요?","fx":[{"w":"others","r":"other","at":17,"t":"each other","m":"each other는 항상 other 단수형 사용"}]},{"n":2,"en":"Bora: I bring always my headphones in my bag. I like to listen to music because it makes me happy.","ko":"보라: 저는 항상 제 가방에 헤드폰을 가지고 다녀요. 저는 음악을 듣는 걸 좋아하는데 그건 저를 행복하게 하기 때문이에요.","fx":[{"w":"bring always","r":"always bring","at":2,"t":"빈도부사의 위치","m":"빈도부사 always는 일반동사 bring 앞에 위치"}]},{"n":3,"en":"My best friend, Lucy, and me share playlists and talk about our favorite singers. My favorite singer is Gina and this are her album.","ko":"저의 가장 친한 친구, Lucy와 저는 재생 목록을 공유하고 저희가 가장 좋아하는 가수들에 관해 이야기해요. 제가 가장 좋아하는 가수는 Gina이고 이것은 그녀의 앨범이에요.","fx":[{"w":"me","r":"I","at":5,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 I 사용"},{"w":"are","r":"is","at":21,"t":"be동사의 수일치","m":"주어 this에는 be동사 is 사용"}]},{"n":4,"en":"She is the more famous singer in Korea. I always listen her songs during lunch time.","ko":"그녀는 한국에서 가장 유명한 가수예요. 저는 점심시간 동안 항상 그녀의 노래를 들어요.","fx":[{"w":"more","r":"most","at":3,"t":"최상급","m":"in Korea 범위 비교이므로 the most famous 사용"},{"w":"her","r":"to her","at":11,"t":"기본전치사","m":"'~을 듣다'는 listen to 사용"}]},{"n":6,"en":"Seho: This is me soccer bag. My luckily soccer shoes are in the bag.","ko":"세호: 이것은 저의 축구 가방이에요. 제 행운의 축구화가 가방 안에 들어 있어요.","fx":[{"w":"me","r":"my","at":3,"t":"인칭대명사의 소유격","m":"bag 앞에는 소유격 my 사용"},{"w":"luckily","r":"lucky","at":7,"t":"형용사와 부사","m":"명사 shoes 앞에는 형용사 lucky 사용"}]},{"n":7,"en":"When I wear these shoes, I always win. So, I have them with I all the time and I keep them cleanly.","ko":"이 신발을 신을 때, 저는 항상 이겨요. 그래서, 저는 그것을 항상 가지고 다니고 그것을 깨끗하게 유지해요.","fx":[{"w":"I","r":"me","at":13,"t":"인칭대명사의 목적격","m":"전치사 with 뒤에는 목적격 me 사용"},{"w":"cleanly","r":"clean","at":21,"t":"형용사와 부사","m":"keep ~ 뒤 목적보어 자리에는 형용사 clean 사용"}]},{"n":8,"en":"I also have this soccer diary in my bag. All the greatest soccer players writes about their training.","ko":"또 제 가방 안에 이 축구 일기도 있어요. 모든 최고의 축구 선수들은 자신의 훈련에 대해 기록해요.","fx":[{"w":"writes","r":"write","at":14,"t":"주어와 동사의 수일치","m":"복수 주어 players에는 write 사용"}]},{"n":9,"en":"I write about my strongly and weak points in my diary. My dream is to becomes a world-famous soccer player.","ko":"저도 저의 강점과 약점을 일기에 적어요. 제 꿈은 세계적으로 유명한 축구 선수가 되는 거예요.","fx":[{"w":"strongly","r":"strong","at":4,"t":"형용사와 부사","m":"명사 points 앞에는 형용사 strong 사용"},{"w":"becomes","r":"become","at":15,"t":"to부정사","m":"to 뒤에는 동사원형: becomes가 아니라 become"}]},{"n":11,"en":"Hazel: I has this cute pouch in my bag. It's my snack pouch.","ko":"Hazel: 제 가방에는 이 귀여운 주머니가 있어요. 그것은 제 간식 주머니예요.","fx":[{"w":"has","r":"have","at":2,"t":"일반동사의 현재형","m":"주어 I에는 have 사용"}]},{"n":12,"en":"I put candies, jellies, and snack bars in it. I like try out the newest snacks.","ko":"저는 사탕, 젤리, 그리고 스낵 바를 그곳에 넣어요. 저는 최신 간식을 먹어 보는 걸 좋아해요.","fx":[{"w":"try","r":"to try","at":11,"t":"to부정사의 명사적 용법","m":"like 뒤에는 to try 사용"}]},{"n":13,"en":"This are ramyeon jellies. They look like ramyeon but taste sweet.","ko":"이것들은 라면 젤리예요. 그것들은 라면처럼 생겼지만 맛은 달콤해요.","fx":[{"w":"This","r":"These","at":0,"t":"지시대명사의 수일치","m":"복수 are 앞에는 These 사용"}]},{"n":14,"en":"My friends are also interested on my snacks. So, I bring extra snacks for them.","ko":"제 친구들도 저의 간식에 관심이 있어요. 그래서 저는 그들을 위해 추가 간식을 가져와요.","fx":[{"w":"on","r":"in","at":5,"t":"기본전치사","m":"'~에 관심이 있다'는 interested in 사용"}]},{"n":15,"en":"I share chocolate bars with Kate for some energies before P.E. class. Are you worry about my teeth?","ko":"저는 체육 수업 전에 에너지를 내기 위해 Kate와 초콜릿 바를 나눠 먹어요. 제 치아가 걱정되시나요?","fx":[{"w":"energies","r":"energy","at":8,"t":"셀 수 없는 명사","m":"energy는 셀 수 없는 명사로 단수 사용"},{"w":"worry","r":"worried","at":14,"t":"형용사와 동사 구분","m":"be동사 뒤에는 형용사 worried 사용"}]},{"n":16,"en":"Don't worry. I doesn't forget to brush them.","ko":"걱정 마세요. 저는 양치질을 잊지 않아요.","fx":[{"w":"doesn't","r":"don't","at":3,"t":"do동사의 부정문","m":"주어 I에는 don't 사용"}]},{"n":17,"en":"I always have an toothbrush in my bag.","ko":"제 가방에는 항상 칫솔이 있어요.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"toothbrush는 자음 소리이므로 a 사용"}]}]},{"no":"08","t":"What Makes You Happy?","q":[{"n":1,"en":"Hello, teens from all around the world! What is your favorite thing to do in you free time?","ko":"전 세계의 십 대 여러분, 안녕하세요! 여러분이 여가 시간에 하기 가장 좋아하는 것은 무엇인가요?","fx":[{"w":"you","r":"your","at":15,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 your 사용"}]},{"n":2,"en":"Does it makes you happy?","ko":"그것은 여러분을 행복하게 해 주나요?","fx":[{"w":"makes","r":"make","at":2,"t":"do동사의 의문문","m":"does 뒤 동사원형: make (makes 아님)"}]},{"n":3,"en":"I love excited dances in Bollywood movies. The powerful moves and rhythms are amazing.","ko":"저는 볼리우드 영화에서의 신나는 춤을 정말 좋아합니다. 힘찬 움직임과 리듬은 대단해요.","fx":[{"w":"excited","r":"exciting","at":2,"t":"현재분사와 과거분사","m":"dances를 꾸미는 '흥미진진한'은 exciting 사용"}]},{"n":4,"en":"At first, I copied the dance moves in me room. Now I am taking classes to learn Bollywood dances.","ko":"처음에 저는 제 방에서 그 춤 동작을 따라 했어요. 지금 저는 볼리우드 춤을 배우려고 수업을 받고 있어요.","fx":[{"w":"me","r":"my","at":8,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"}]},{"n":5,"en":"I love the feeling of moving to the rhythm. It makes I happy.","ko":"저는 리듬에 맞춰 움직이는 느낌을 정말 좋아해요. 그것은 저를 행복하게 만들어줘요.","fx":[{"w":"I","r":"me","at":11,"t":"인칭대명사의 목적격","m":"동사 makes의 목적어는 목적격 me 사용"}]},{"n":6,"en":"I want to perform in an Bollywood movie someday.","ko":"언젠가 저는 볼리우드 영화에서 공연하고 싶어요.","fx":[{"w":"an","r":"a","at":5,"t":"관사 a/an","m":"자음 소리 Bollywood 앞에는 a 사용"}]},{"n":8,"en":"Every weekend, I put on my mask and dives into the water.","ko":"주말마다 저는 마스크를 쓰고 바다로 뛰어들어요.","fx":[{"w":"dives","r":"dive","at":8,"t":"주어와 동사의 수일치","m":"주어 I: dive (dives 아님)"}]},{"n":9,"en":"When I swim with colorful fish and see beautifully coral reefs, I feels so happy.","ko":"다채로운 물고기와 수영을 하고 아름다운 산호초를 볼 때 저는 매우 행복합니다.","fx":[{"w":"beautifully","r":"beautiful","at":8,"t":"형용사와 부사","m":"명사 reefs를 꾸미는 말은 형용사 beautiful 사용"},{"w":"feels","r":"feel","at":12,"t":"일반동사 현재형","m":"주어 I에는 동사원형 feel 사용"}]},{"n":10,"en":"This year, I am going to starts a school project on coral reefs.","ko":"올해 저는 산호초에 관한 학교 프로젝트를 시작할 거예요.","fx":[{"w":"starts","r":"start","at":6,"t":"to부정사","m":"be going to 뒤 동사원형: start (starts 아님)"}]},{"n":12,"en":"In my town, we can see the colorful Northern Lights. I can still remember seeing they for the first time.","ko":"우리 마을에서는 화려한 오로라를 볼 수 있어요. 저는 오로라를 처음으로 보았던 것을 아직도 기억할 수 있어요.","fx":[{"w":"they","r":"them","at":15,"t":"인칭대명사의 목적격","m":"동명사 seeing의 목적어는 목적격 them 사용"}]},{"n":13,"en":"It was amazing! As I often watched the night beautiful sky, I began to enjoy observe stars.","ko":"그것은 멋졌어요! 아름다운 밤하늘을 자주 보면서 저는 별을 관찰하는 것을 즐기기 시작했죠.","fx":[{"w":"night beautiful","r":"beautiful night","at":8,"t":"형용사의 위치","m":"beautiful은 night sky 앞에 위치"},{"w":"observe","r":"observing","at":15,"t":"동명사를 목적어로 취하는 동사","m":"enjoy 뒤에는 동명사 observing 사용"}]},{"n":14,"en":"It makes me happy. I use star guide apps to find the names of star in the sky.","ko":"그것은 저를 행복하게 만들어줘요. 저는 하늘의 별 이름을 확인하기 위해 별 가이드 앱을 사용합니다.","fx":[{"w":"star","r":"stars","at":14,"t":"명사의 복수형","m":"names of 뒤에는 복수명사 stars 사용"}]},{"n":15,"en":"I also use a telescope to see stars good. Someday, I hope I can discover a new stars and name it after myself.","ko":"저는 또한 별을 더 잘 보기 위해 망원경을 사용합니다. 언젠가 저는 새로운 별을 발견해서 제 이름을 따서 그 별의 이름을 짓고 싶어요.","fx":[{"w":"good","r":"better","at":8,"t":"비교급","m":"'더 잘'은 부사 비교급 better 사용"},{"w":"stars","r":"star","at":17,"t":"부정관사와 단수명사","m":"a 뒤에는 단수명사 star 사용"}]}]},{"no":"09","t":"Better Sleep, Better Life","q":[{"n":1,"en":"Welcome back to school. How does you feel today?","ko":"학교에 다시 온 걸 환영해요. 오늘 기분은 어떤가요?","fx":[{"w":"does","r":"do","at":5,"t":"의문문의 do/does","m":"주어 you에는 do 사용"}]},{"n":2,"en":"Did you sleep good last night? Sleeping well can give you energy for the new school year.","ko":"어젯밤에 잘 잤나요? 잘 자는 것은 당신에게 새 학년을 위한 에너지를 줄 수 있어요.","fx":[{"w":"good","r":"well","at":3,"t":"형용사와 부사","m":"동사 sleep을 꾸미는 부사 well 사용"}]},{"n":3,"en":"Now, check you sleep habits with the list.","ko":"이제, 목록을 보면서 당신의 수면 습관을 확인해 보세요.","fx":[{"w":"you","r":"your","at":2,"t":"인칭대명사의 소유격","m":"명사 habits 앞에는 소유격 your 사용"}]},{"n":5,"en":"□ go to bed at different time","ko":"□ 다른 시각에 잠자리에 든다","fx":[{"w":"time","r":"times","at":6,"t":"명사의 복수형","m":"different 뒤에는 복수명사 times 사용"}]},{"n":6,"en":"□ drink a lots of energy drinks","ko":"□ 에너지 음료를 많이 마신다","fx":[{"w":"lots","r":"lot","at":3,"t":"수량 표현","m":"'많은'은 a lot of 사용 (a lots of 아님)"}]},{"n":9,"en":"How much habits did you check? These habits may causes sleep problems.","ko":"몇 개의 습관에 체크했나요? 이 습관들은 수면 문제를 일으킬 수 있습니다.","fx":[{"w":"much","r":"many","at":1,"t":"수량 형용사 many/much","m":"셀 수 있는 habits 앞에는 many 사용"},{"w":"causes","r":"cause","at":9,"t":"조동사","m":"조동사 may 뒤에는 동사원형: cause (causes 아님)"}]},{"n":10,"en":"Does you think you need a change? Let's find out what to do.","ko":"변화가 필요하다고 생각하나요? 무엇을 해야 할지 알아봅시다.","fx":[{"w":"Does","r":"Do","at":0,"t":"의문문의 do/does","m":"주어 you에는 Do 사용"}]},{"n":11,"en":"Have an regular sleep pattern.","ko":"규칙적인 수면 패턴을 가지세요.","fx":[{"w":"an","r":"a","at":1,"t":"관사 a/an","m":"regular는 자음 소리로 시작하므로 a 사용"}]},{"n":12,"en":"Your body has a \"clock.\" The body clock tells your when to wake up and sleep.","ko":"당신의 몸은 '시계'를 가지고 있어요. 그 생체 시계는 당신에게 언제 일어나고 자야 할지 말해 줍니다.","fx":[{"w":"your","r":"you","at":9,"t":"인칭대명사의 목적격","m":"동사 tells의 목적어는 목적격 you 사용"}]},{"n":13,"en":"For example, on the morning, your body starts to feel lively. In night, your body starts to feel sleepy.","ko":"예를 들어, 아침에 당신의 몸은 활기가 돌기 시작해요. 밤에 당신의 몸은 졸리기 시작해요.","fx":[{"w":"on","r":"in","at":2,"t":"기본전치사","m":"'아침에'는 in the morning 사용"},{"w":"In","r":"At","at":11,"t":"기본전치사","m":"'밤에'는 at night 사용"}]},{"n":14,"en":"Listen to your body clock and sleep regular. You will feels healthier.","ko":"당신의 생체 시계의 말을 듣고 규칙적으로 자도록 해요. 당신은 더 건강하게 느낄 거예요.","fx":[{"w":"regular","r":"regularly","at":7,"t":"형용사와 부사","m":"동사 sleep을 꾸미는 부사 regularly 사용"},{"w":"feels","r":"feel","at":10,"t":"조동사","m":"조동사 will 뒤에는 동사원형: feel (feels 아님)"}]},{"n":16,"en":"Caffeine can causes sleep problems. Do you know that even chocolate have caffeine?","ko":"카페인은 수면 문제를 유발할 수 있어요. 심지어 초콜릿에도 카페인이 있다는 것을 알고 있나요?","fx":[{"w":"causes","r":"cause","at":2,"t":"조동사","m":"조동사 can 뒤에는 동사원형: cause (causes 아님)"},{"w":"have","r":"has","at":11,"t":"3인칭 단수 현재형","m":"주어 chocolate(3인칭 단수)는 has (have 아님)"}]},{"n":17,"en":"Caffeine hide in many foods and drinks such as chocolate, coffee, tea, soda, and energy drinks. So, be careful!","ko":"카페인은 초콜릿, 커피, 차, 탄산음료, 그리고 에너지 음료 같은 많은 음식과 음료에 숨어 있어요. 그러니 조심하세요!","fx":[{"w":"hide","r":"hides","at":1,"t":"3인칭 단수 현재형","m":"주어 Caffeine(3인칭 단수)에는 hides 사용"}]}]},{"no":"10","t":"Light Up Your Days with Special Hobbies","q":[{"n":1,"en":"What do you usually does in your free time? How about trying some interested hobbies?","ko":"여러분은 여가에 보통 무엇을 하나요? 흥미로운 취미를 시도해 보는 것은 어떨까요?","fx":[{"w":"does","r":"do","at":4,"t":"do동사 의문문","m":"do 뒤 주어 이후 동사원형: do"},{"w":"interested","r":"interesting","at":13,"t":"현재분사와 과거분사","m":"취미가 흥미를 주므로 interesting 사용"}]},{"n":2,"en":"The activities below will adds something new to your life!","ko":"아래 활동은 여러분의 삶에 새로운 무언가를 더해 줄 거예요!","fx":[{"w":"adds","r":"add","at":4,"t":"조동사 will","m":"조동사 will 뒤에는 동사원형 add 사용"}]},{"n":3,"en":"Let's go hiking! Some people says, \"Why do we need to get to the top?","ko":"하이킹을 가요! 어떤 사람들은 \"우리가 왜 정상에 올라가야 하나요?","fx":[{"w":"says","r":"say","at":5,"t":"일반동사의 수일치","m":"복수 주어 people에는 say 사용"}]},{"n":4,"en":"We have to come back down anyway.\" Well, hiking a mountains is not just about reaching the top.","ko":"어차피 우리는 다시 내려와야 해요.\"라고 말합니다. 글쎄요, 등산하는 것은 단순히 정상에 오르는 것만이 아닙니다.","fx":[{"w":"mountains","r":"mountain","at":10,"t":"명사의 단수형","m":"a 뒤에는 단수명사 mountain 사용"}]},{"n":5,"en":"It is also about enjoying the journey. Look at the amazing views and take in the fresh airs.","ko":"그것은 여정을 즐기는 것이기도 합니다. 놀라운 경치를 보고 신선한 공기를 마셔 보세요.","fx":[{"w":"airs","r":"air","at":17,"t":"셀 수 없는 명사","m":"air는 셀 수 없는 명사라 복수형 없이 air 사용"}]},{"n":6,"en":"Why doesn't you go out and explore nature right now?","ko":"지금 바로 밖으로 나가서 자연을 탐험하는 건 어떨까요?","fx":[{"w":"doesn't","r":"don't","at":1,"t":"부정 의문문","m":"주어 you에는 don't 사용"}]},{"n":7,"en":"Now, take an break with puzzles. Careful put the pieces together, and you will forget of your worries.","ko":"이제 퍼즐로 휴식을 취하세요. 조심스럽게 조각들을 맞추세요, 그러면 여러분은 걱정을 잊어버릴 거예요.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"자음 소리 break 앞에는 a 사용"},{"w":"Careful","r":"Carefully","at":6,"t":"형용사와 부사","m":"동사 put을 꾸미는 말은 부사 Carefully 사용"},{"w":"of","r":"about","at":15,"t":"기본전치사","m":"'~에 대해 잊다'는 forget about 사용"}]},{"n":8,"en":"Doing puzzles are good for clearing your mind. And guess what?","ko":"퍼즐을 맞추는 것은 정신을 맑게 하는 데 좋아요. 그리고 그거 아세요?","fx":[{"w":"are","r":"is","at":2,"t":"be동사의 수일치","m":"동명사 주어는 단수 취급: is"}]},{"n":9,"en":"When you put in the last piece, you will feel greatly. It will give you a sense of successful.","ko":"마지막 조각을 맞출 때, 여러분은 기분이 아주 좋을 거예요. 그것은 여러분에게 성취감을 줄 거예요.","fx":[{"w":"greatly","r":"great","at":10,"t":"형용사와 부사","m":"feel 뒤 보어 자리에는 형용사 great 사용"},{"w":"successful","r":"success","at":18,"t":"품사","m":"전치사 of 뒤에는 명사 success 사용"}]},{"n":11,"en":"Lastly, head at the kitchen for some baking. You can make your own cookies.","ko":"마지막으로, 부엌으로 가서 베이킹을 하세요. 여러분은 자신만의 쿠키를 만들 수 있어요.","fx":[{"w":"at","r":"to","at":2,"t":"기본전치사","m":"'~로 향하다'는 head to 사용"}]},{"n":13,"en":"When you make cookies, try difference shapes like cats, flowers, or even your favorite characters. Just express you!","ko":"여러분이 쿠키를 만들 때, 고양이, 꽃, 심지어 여러분이 매우 좋아하는 캐릭터와 같은 다양한 모양을 시도해 보세요. 그저 여러분 자신을 표현해 보세요!","fx":[{"w":"difference","r":"different","at":5,"t":"품사","m":"명사 shapes를 꾸미는 말은 형용사 different 사용"},{"w":"you","r":"yourself","at":17,"t":"재귀대명사","m":"주어와 목적어가 같으면 yourself 사용"}]},{"n":14,"en":"And here is the highlight of baking. It give you the joy of sharing.","ko":"그리고 여기에 베이킹의 하이라이트가 있습니다. 그것은 여러분에게 나눔의 즐거움을 줍니다.","fx":[{"w":"give","r":"gives","at":8,"t":"3인칭 단수 현재형","m":"주어 It에는 gives 사용"}]},{"n":15,"en":"Bake something special for your friends or family. They will loves your cookies!","ko":"여러분의 친구들이나 가족을 위해 특별한 것을 구워 보세요. 그들은 여러분의 쿠키를 아주 좋아할 거예요!","fx":[{"w":"loves","r":"love","at":10,"t":"조동사 will","m":"will 뒤는 동사원형: love"}]},{"n":16,"en":"What do you think about this hobbies? Why don't you try one of them right away?","ko":"여러분은 이 취미들에 대해 어떻게 생각하나요? 그것들 중 하나를 바로 시도해 보는 것은 어떤가요?","fx":[{"w":"this","r":"these","at":5,"t":"지시형용사","m":"복수명사 hobbies 앞에는 these 사용"}]}]},{"no":"11","t":"Warm Hearts for Our Community","q":[{"n":2,"en":"Our club has solved some problems in our school and our community over the past few year. I want to share our stories.","ko":"우리 동아리는 지난 몇 년간 우리 학교 및 지역사회의 몇몇 문제를 해결해 왔어요. 저는 우리의 이야기를 여러분과 나누고 싶어요.","fx":[{"w":"year","r":"years","at":16,"t":"명사의 복수형","m":"few 뒤에는 복수명사 years 사용"}]},{"n":3,"en":"One day, our school principal announced, \"Our students often takes too much food and waste it at lunchtime.","ko":"어느 날 교장선생님이 \"점심시간에 학생들이 종종 음식을 너무 많이 가져가서 버립니다.","fx":[{"w":"takes","r":"take","at":9,"t":"주어와 동사의 수일치","m":"주어 students(복수)는 동사원형: take (takes 아님)"}]},{"n":5,"en":"The members of Warm Hearts gathered to solve these problem. We thought that adding lines to food trays would be helpfully.","ko":"'따뜻한 마음'의 회원들은 이 문제를 해결하기 위해 모였어요. 우리는 식판에 선을 표시하는 것이 도움이 될 거라 생각했어요.","fx":[{"w":"these","r":"this","at":8,"t":"지시형용사","m":"단수명사 problem 앞에는 this 사용"},{"w":"helpfully","r":"helpful","at":20,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 helpful 사용"}]},{"n":7,"en":"Our school principal liked this idea, so he change the food trays in the cafeteria. It was a success!","ko":"교장선생님은 이 생각을 마음에 들어 하셨고, 구내식당의 식판을 교체하셨어요. 그건 성공적이었죠!","fx":[{"w":"change","r":"changed","at":8,"t":"과거시제","m":"과거 사실이므로 changed 사용"}]},{"n":8,"en":"The new trays reduced a large number of food waste!","ko":"새 식판은 많은 양의 음식물 쓰레기를 줄였어요!","fx":[{"w":"number","r":"amount","at":6,"t":"수량 형용사","m":"food waste(셀 수 없음)에는 amount of 사용"}]},{"n":9,"en":"After we solved this problems at our school, we started look for problems in our community.","ko":"우리 학교의 이 문제를 해결한 뒤 우리는 우리 지역사회의 문제를 찾아보기 시작했어요.","fx":[{"w":"problems","r":"problem","at":4,"t":"명사의 복수형","m":"this 뒤에는 단수명사 problem 사용"},{"w":"look","r":"to look","at":10,"t":"to부정사의 명사적 용법","m":"started 뒤에는 to look 사용"}]},{"n":10,"en":"We found out that some roads around our school was very dark at night. We all agreed that the roads needed much lights.","ko":"우리는 우리 학교 주위의 일부 도로가 밤에 무척 어둡다는 걸 발견했어요. 우리는 모두 도로에 등이 더 필요하다고 동의했어요.","fx":[{"w":"was","r":"were","at":9,"t":"be동사 수일치","m":"주어 roads(복수)는 were (was 아님)"},{"w":"much","r":"more","at":21,"t":"수량 형용사","m":"셀 수 있는 lights 앞에는 more 사용"}]},{"n":11,"en":"With the help of a teacher, we putted up lights with sensors around the neighborhood. Now all our neighbors feel more safer than before!","ko":"한 선생님의 도움을 받아 우리는 인근에 센서가 있는 등을 설치했어요. 이제 모든 우리의 이웃들이 예전보다 더 안전하다고 느껴요!","fx":[{"w":"putted","r":"put","at":7,"t":"불규칙 과거형","m":"put의 과거형은 put (putted 아님)"},{"w":"more safer","r":"safer","at":20,"t":"비교급","m":"safer가 이미 비교급이므로 more 불필요"}]},{"n":13,"en":"But some people has trouble using kiosks.","ko":"하지만 어떤 사람들은 키오스크를 사용하는 데 어려움을 겪어요.","fx":[{"w":"has","r":"have","at":3,"t":"주어와 동사의 수일치","m":"복수 주어 people에는 have 사용"}]},{"n":14,"en":"To help they, we volunteered as digital guides at the community center.","ko":"그런 사람들을 돕기 위해 우리는 주민센터에서 디지털 가이드로 자원봉사를 했어요.","fx":[{"w":"they","r":"them","at":2,"t":"인칭대명사의 목적격","m":"help 뒤 목적어 자리에는 them 사용"}]},{"n":15,"en":"We explained every steps of ordering: starting a order, choosing from the menu, and paying.","ko":"우리는 주문을 시작하고, 메뉴에서 고르고, 결제하는 모든 주문 절차를 설명했어요.","fx":[{"w":"steps","r":"step","at":3,"t":"명사의 복수형","m":"every 뒤에는 단수명사 step 사용"},{"w":"a","r":"an","at":7,"t":"관사 a/an","m":"order는 모음 소리이므로 an 사용"}]},{"n":17,"en":"We felt very proudly.","ko":"우리는 정말 뿌듯했어요.","fx":[{"w":"proudly","r":"proud","at":3,"t":"형용사와 부사","m":"felt 뒤 보어 자리에는 형용사 proud 사용"}]},{"n":18,"en":"As you can see, your actions can makes positive changes. Even the smallest acts can make an big difference!","ko":"이렇듯 여러분의 행동은 긍정적인 변화를 만들 수 있어요. 가장 작은 행위일지라도 큰 차이를 만들 수 있어요!","fx":[{"w":"makes","r":"make","at":7,"t":"조동사 뒤 동사원형","m":"조동사 can 뒤에는 동사원형: make (makes 아님)"},{"w":"an","r":"a","at":16,"t":"관사 a/an","m":"big은 자음 소리이므로 a 사용"}]}]},{"no":"12","t":"Join Our Food Diary Project","q":[{"n":2,"en":"For last week, our school has introduced a Food Diary Project. Our slogan?","ko":"지난주부터 우리 학교에서 식사 일기 프로젝트를 도입했어요. 우리의 슬로건은?","fx":[{"w":"For","r":"Since","at":0,"t":"전치사 since/for","m":"since last week: 과거 한 시점부터 지금까지"}]},{"n":3,"en":"\"Low sugar, low salt, and low fat.\" Do you want to join these project?","ko":"'저당, 저염, 저지방'이에요. 이 프로젝트에 참여하고 싶나요?","fx":[{"w":"these","r":"this","at":12,"t":"지시형용사 this/these","m":"단수명사 project에는 this 사용"}]},{"n":4,"en":"Follow these step. Choose healthy foods for your meals, takes photos, and share them with us.","ko":"다음 단계를 따라보세요. 식사로 건강한 음식을 고르고, 사진을 찍어서 우리와 공유해 주세요.","fx":[{"w":"step","r":"steps","at":2,"t":"지시형용사와 복수명사","m":"these 뒤에는 복수명사 steps 사용"},{"w":"takes","r":"take","at":9,"t":"주어와 동사의 수일치","m":"명령문은 동사원형 병렬: take (takes 아님)"}]},{"n":5,"en":"Don't forget to leaving friendly comments on your friends' posts.","ko":"그리고 친구들의 게시물에 따뜻한 댓글 남기는 것도 잊지 마세요.","fx":[{"w":"leaving","r":"leave","at":3,"t":"to부정사","m":"forget to 뒤에는 동사원형: leave (leaving 아님)"}]},{"n":7,"en":"After an soccer game, I wanted to drink a cold soft drink.","ko":"축구 경기를 마친 후, 차가운 탄산음료를 마시고 싶었어요.","fx":[{"w":"an","r":"a","at":1,"t":"관사 a/an","m":"자음 소리 soccer 앞에는 a 사용"}]},{"n":8,"en":"But when I checked the ingredients, I realized that it have about 10 teaspoon of sugar.","ko":"하지만 재료를 확인해 보니 탄산음료에는 약 10티스푼의 설탕이 들어 있다는 것을 알게 되었어요.","fx":[{"w":"have","r":"has","at":10,"t":"수일치","m":"주어 it(3인칭 단수)에는 has 사용"},{"w":"teaspoon","r":"teaspoons","at":13,"t":"명사의 복수형","m":"10 뒤에는 복수명사 teaspoons 사용"}]},{"n":9,"en":"So, I decided to choose a cold herbal tea instead. It has far fewer sugar than a soft drink.","ko":"그래서 대신 차가운 허브차를 마시기로 했어요. 허브차는 탄산음료보다 설탕이 훨씬 적어요.","fx":[{"w":"fewer","r":"less","at":13,"t":"수량 형용사 less/fewer","m":"sugar는 셀 수 없어 less 사용"}]},{"n":10,"en":"I felt a lot healthy with the tea.","ko":"차 덕분에 훨씬 건강해진 느낌이었어요.","fx":[{"w":"healthy","r":"healthier","at":4,"t":"비교급","m":"a lot 뒤에는 비교급 healthier 사용"}]},{"n":11,"en":"↳ Wow, 10 teaspoons of sugar in an soft drink? Thanks for sharing this!","ko":"↳ 와, 탄산음료 하나에 설탕이 10티스푼이나 들어 있다고? 공유해 줘서 고마워!","fx":[{"w":"an","r":"a","at":7,"t":"관사 a/an","m":"자음 소리 soft 앞에는 a 사용"}]},{"n":12,"en":"↳ I've never try herbal tea after an exercise! I'll gives it a try next time.","ko":"↳ 나는 운동 후에 허브차를 마셔 본 적은 없어! 다음에 한번 시도해 볼게.","fx":[{"w":"try","r":"tried","at":3,"t":"현재완료","m":"have never 뒤에는 과거분사 tried 사용"},{"w":"gives","r":"give","at":10,"t":"조동사 뒤 동사원형","m":"will 뒤에는 동사원형: give (gives 아님)"}]},{"n":13,"en":"This afternoon, my friends and me had malatang. I thought it was a good choice because it had meat, vegetables, and noodles.","ko":"오늘 오후, 친구들과 저는 마라탕을 먹었어요. 고기, 채소, 국수가 들어 있어서 좋은 선택인 줄 알았죠.","fx":[{"w":"me","r":"I","at":5,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 I 사용"}]},{"n":14,"en":"But when I getted home, I felt really thirsty. I drank many water, but it didn't help.","ko":"하지만 집에 가서 너무 목이 말랐어요. 물을 많이 마셨는데도 도움이 되지 않았어요.","fx":[{"w":"getted","r":"got","at":3,"t":"불규칙 과거형","m":"get의 과거형은 got (getted 아님)"},{"w":"many","r":"a lot of","at":11,"t":"수량 형용사 many/much","m":"water는 셀 수 없어 a lot of/much 사용"}]},{"n":15,"en":"I think malatang was too salty for me. I've decided to eating less salty foods from now on.","ko":"마라탕이 저한테는 너무 짰던 것 같아요. 이제부터 짠 음식을 덜 먹기로 결심했어요.","fx":[{"w":"eating","r":"eat","at":11,"t":"to부정사","m":"decide to 뒤에는 동사원형: eat (eating 아님)"}]},{"n":17,"en":"↳ That's a great tips! I'll remember that!","ko":"↳ 정말 좋은 팁이네! 기억할게!","fx":[{"w":"tips","r":"tip","at":4,"t":"a/an 뒤 단수명사","m":"a 뒤에는 단수명사 tip 사용"}]}]},{"no":"13","t":"How's Your Neck Doing?","q":[{"n":1,"en":"Many student have \"turtle neck.\" This happens when their head stick forward.","ko":"많은 학생들이 '거북목'을 가지고 있다. 이것은 그들의 머리가 앞으로 나올 때 발생한다.","fx":[{"w":"student","r":"students","at":1,"t":"명사의 복수형","m":"Many 뒤에는 복수명사 students 사용"},{"w":"stick","r":"sticks","at":10,"t":"3인칭 단수 현재형","m":"주어 head(단수)에는 sticks 사용"}]},{"n":3,"en":"When you have turtle neck, you may gets neck pain, back pain, or headaches. But don't worry!","ko":"여러분이 거북목을 가지고 있을 때 여러분은 목 통증, 허리 통증, 또는 두통이 있을 수 있다. 그러나 걱정하지 마라!","fx":[{"w":"gets","r":"get","at":7,"t":"조동사","m":"조동사 may 뒤에는 동사원형 get 사용"}]},{"n":4,"en":"Here is some easy stretches to help with turtle neck.","ko":"여기 거북목에 도움이 되는 쉬운 스트레칭이 몇 가지 있다.","fx":[{"w":"is","r":"are","at":1,"t":"be동사의 긍정문","m":"stretches(복수)에는 are 사용"}]},{"n":5,"en":"Sit up straightly and move your head slowly from side to side. Put your right hand on the left side of your head.","ko":"똑바로 앉고 머리를 천천히 좌우로 움직여라. 오른손을 머리의 왼쪽에 두어라.","fx":[{"w":"straightly","r":"straight","at":2,"t":"형용사와 부사","m":"'똑바로'는 straight 사용 (straightly 아님)"}]},{"n":6,"en":"Then gently pull you head to the right. Hold for 5 second.","ko":"그러고 나서 머리를 오른쪽으로 부드럽게 당겨라. 5초 동안 유지하라.","fx":[{"w":"you","r":"your","at":3,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 your 사용"},{"w":"second","r":"seconds","at":11,"t":"명사의 복수형","m":"2 이상이므로 복수 seconds 사용"}]},{"n":7,"en":"Repeat on yours left side. Finally, put your hands together and hold your chin with your thumbs.","ko":"왼쪽에 반복하라. 마지막으로, 두 손을 함께 모으고 엄지손가락으로 턱을 잡아라.","fx":[{"w":"yours","r":"your","at":2,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 your 사용"}]},{"n":8,"en":"Push your head back slowly. Hold at 10 seconds.","ko":"머리를 천천히 뒤로 밀어라. 10초 동안 유지하라.","fx":[{"w":"at","r":"for","at":6,"t":"기본전치사","m":"'~동안'은 전치사 for 사용"}]},{"n":9,"en":"If you do this set of stretches, you'll felt better.","ko":"만약 이 스트레칭 세트를 하면, 여러분은 더 나아질 것이다.","fx":[{"w":"felt","r":"feel","at":8,"t":"조동사","m":"will 뒤에는 동사원형: feel (felt 아님)"}]},{"n":10,"en":"Stand and spread your feet. Bend your arms to makes a W shape.","ko":"서서 두 발을 벌려라. W 모양을 만들기 위해 팔을 구부려라.","fx":[{"w":"makes","r":"make","at":9,"t":"to부정사","m":"to 뒤에는 동사원형 make 사용"}]},{"n":11,"en":"Then lean your head backward. Look up at an 45-degree angle.","ko":"그런 다음 머리를 뒤로 젖혀라. 45도 각도로 위를 바라보라.","fx":[{"w":"an","r":"a","at":8,"t":"관사 a/an","m":"자음 소리 forty-five 앞에는 a 사용"}]},{"n":13,"en":"Lie on you bed with your head at the edge. Let your head hang off the bed.","ko":"머리를 침대의 가장자리에 두고 누워라. 머리를 침대 밖으로 늘어뜨려라.","fx":[{"w":"you","r":"your","at":2,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 your 사용"}]},{"n":14,"en":"Hold for 60 seconds. Don't do this for more longer than 60 seconds.","ko":"60초 동안 유지하라. 이것을 60초 이상 하지 마라.","fx":[{"w":"more longer","r":"longer","at":8,"t":"비교급","m":"long의 비교급은 longer (more 안 씀)"}]},{"n":15,"en":"It can make you feel dizzily. This stretch help relax your neck and back.","ko":"이것은 어지러움을 느끼게 만들 수 있다. 이 스트레칭은 목과 등을 이완하는 데 도움이 된다.","fx":[{"w":"dizzily","r":"dizzy","at":5,"t":"형용사와 부사","m":"feel 뒤 보어는 형용사 dizzy 사용"},{"w":"help","r":"helps","at":8,"t":"3인칭 단수 현재형","m":"주어 This stretch(3인칭 단수)는 helps (help 아님)"}]},{"n":16,"en":"One things is more important than stretching: good habits in everyday life. Don't look down at your smartphone or computer monitor.","ko":"한 가지가 스트레칭보다 더 중요하다: 일상생활에서의 좋은 습관이다. 스마트폰이나 컴퓨터 모니터를 내려다보지 마라.","fx":[{"w":"things","r":"thing","at":1,"t":"명사의 단수형","m":"One 뒤에는 단수명사 thing 사용"}]},{"n":17,"en":"Try to keep it at eye level. When you is sitting, sit up straight and keep your feet in the floor.","ko":"그것을 눈높이에 맞추려고 노력하라. 앉아 있을 때 똑바로 앉고 발을 바닥에 두어라.","fx":[{"w":"is","r":"are","at":9,"t":"be동사의 긍정문","m":"주어 you에는 are 사용"},{"w":"in","r":"on","at":18,"t":"기본전치사","m":"'바닥 위에'는 on the floor 사용"}]},{"n":18,"en":"If you are studying for a long time, you should stretches every 50 minutes. Good habits keep your neck health and strong.","ko":"오랜 시간 동안 공부할 때 50분마다 스트레칭을 해야 한다. 좋은 습관은 여러분의 목을 건강하고 강하게 유지시켜 준다.","fx":[{"w":"stretches","r":"stretch","at":10,"t":"조동사","m":"조동사 should 뒤에는 동사원형 stretch 사용"},{"w":"health","r":"healthy","at":19,"t":"품사 혼동","m":"보어 자리에는 형용사 healthy 사용"}]}]},{"no":"14","t":"Text Better, Communicate Better!","q":[{"n":1,"en":"Texting is the mainly way of communication for much people these days, especially for teenagers.","ko":"문자 메시지는 요즘 많은 사람들, 특히 십 대들의 주요 의사소통 수단이다.","fx":[{"w":"mainly","r":"main","at":3,"t":"형용사와 부사","m":"명사 way 앞에는 형용사 main 사용"},{"w":"much","r":"many","at":8,"t":"수량 형용사","m":"people 앞에는 many 사용"}]},{"n":2,"en":"Do you want to know how you can communicate more good through texting? Here are some useful tips.","ko":"문자 메시지를 통해 어떻게 의사소통을 더 잘할 수 있는지 알고 싶은가? 여기 몇 가지 유용한 팁이 있다.","fx":[{"w":"more good","r":"better","at":9,"t":"비교급","m":"good의 비교급은 better"}]},{"n":4,"en":"Henry just sended the following text message to his mother.","ko":"Henry는 방금 엄마에게 다음과 같은 문자 메시지를 보냈다.","fx":[{"w":"sended","r":"sent","at":2,"t":"불규칙 과거형","m":"send의 과거형은 sent (sended 아님)"}]},{"n":5,"en":"- Mom, I want you to wait just a few longer. BRT.","ko":"- 엄마, 조금만 더 기다려 주세요. BRT.","fx":[{"w":"few","r":"little","at":9,"t":"수량 형용사","m":"a little longer: 셀 수 없는 시간에는 a little 사용"}]},{"n":6,"en":"Do you think Henry's mother correct understood BRT? Probably not.","ko":"당신은 Henry의 엄마가 BRT를 정확히 이해했다고 생각하는가? 아마도 그렇지 않을 것이다.","fx":[{"w":"correct","r":"correctly","at":5,"t":"형용사와 부사","m":"동사 understood를 꾸밀 때는 부사 correctly 사용"}]},{"n":7,"en":"You can use expression like BRT (be right there), JK (just kidding), or LOL (laughing out loud) when you text your friends.","ko":"친구들에게 문자 메시지를 보낼 때 BRT(곧 갈게), JK(농담이야), 또는 LOL(소리 내어 웃음) 같은 표현들을 사용할 수 있다.","fx":[{"w":"expression","r":"expressions","at":3,"t":"명사의 복수형","m":"관사 없는 일반 의미는 복수 expressions 사용"}]},{"n":8,"en":"However, be carefully with such expressions when you text your teachers or parents.","ko":"하지만 선생님이나 부모님께 문자 메시지를 보낼 때는 그런 표현을 쓰는 것에 주의해라.","fx":[{"w":"carefully","r":"careful","at":2,"t":"형용사와 부사","m":"be 뒤 보어 자리에는 형용사 careful 사용"}]},{"n":9,"en":"You need to understand that some of them may not knows the meanings of such expressions.","ko":"그들 중 일부는 이런 표현의 의미를 모를 수도 있다는 것을 이해해야 한다.","fx":[{"w":"knows","r":"know","at":10,"t":"조동사","m":"조동사 may not 뒤 동사원형: know (knows 아님)"}]},{"n":10,"en":"2. You need to understand that people uses emojis differently.","ko":"2. 당신은 사람들이 이모지를 다르게 사용한다는 점을 이해해야 한다.","fx":[{"w":"uses","r":"use","at":7,"t":"be동사/일반동사 수일치","m":"people은 복수 취급, use 사용"}]},{"n":12,"en":"- I loved you gift. Thanks a lot. ","ko":"- 선물이 아주 마음에 들었어. 정말 고마워. ","fx":[{"w":"you","r":"your","at":3,"t":"인칭대명사의 격","m":"명사 앞 소유격 your 사용"}]},{"n":13,"en":"\"Only one smiling faces ()? I guess he didn't liked my gift,\" Jisu thought.","ko":"\"웃는 얼굴()이 하나뿐이네? 내 선물이 마음에 안 들었나 봐.\"라고 지수는 생각했다.","fx":[{"w":"faces","r":"face","at":3,"t":"명사의 복수형","m":"one 뒤에는 단수명사 face 사용"},{"w":"liked","r":"like","at":9,"t":"과거 부정문","m":"didn't 뒤에는 동사원형 like 사용"}]},{"n":15,"en":"Sometimes, a little emoji like  can speak louder than much words. The problem is that not everybody use emojis in the same way.","ko":"때때로  같은 작은 이모지가 많은 말보다 더 큰 의미를 말할 수 있다. 문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다.","fx":[{"w":"much","r":"many","at":10,"t":"수량 형용사","m":"words(복수) 앞에는 many 사용"},{"w":"use","r":"uses","at":18,"t":"주어와 동사의 수일치","m":"everybody는 단수 취급: uses (use 아님)"}]},{"n":16,"en":"Some people like to use them a lot, and some doesn't. In addition, the same emojis can mean different thing to different people.","ko":"어떤 사람들은 이모지를 많이 사용하는 것을 좋아하고, 어떤 사람들은 그렇지 않다. 게다가 같은 이모지도 사람마다 다른 것을 의미할 수 있다.","fx":[{"w":"doesn't","r":"don't","at":10,"t":"do/does","m":"복수 주어 some은 don't (doesn't 아님)"},{"w":"thing","r":"things","at":19,"t":"명사의 복수형","m":"different 뒤 복수명사 things 사용"}]}]},{"no":"15","t":"The Family Puzzle","q":[{"n":1,"en":"There once was an lovely family with three children. The children were very closely.","ko":"옛날에 세 아이가 있는 사랑스러운 가족이 있었다. 아이들은 매우 가까웠다.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"자음 소리 l 앞에는 a lovely 사용"},{"w":"closely","r":"close","at":13,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 close 사용"}]},{"n":2,"en":"But as they got more old, they slowly grew apart. One day, the parents called the childs together.","ko":"하지만 나이가 들면서, 그들은 서서히 사이가 멀어졌다. 어느 날, 부모님이 아이들을 함께 불렀다.","fx":[{"w":"more old","r":"older","at":4,"t":"비교급","m":"old의 비교급은 older 사용"},{"w":"childs","r":"children","at":16,"t":"불규칙 복수형","m":"child의 복수형은 children 사용"}]},{"n":4,"en":"It was always filled of happiness,\" said the father. The mother continued, \"But now, you don't even talk to each others.","ko":"이곳은 항상 행복으로 가득 찼었지.\"라고 아버지가 말했다. 어머니가 이어 말했다, \"하지만 이제, 너희는 서로 대화조차 하지 않는구나.","fx":[{"w":"of","r":"with","at":4,"t":"기본전치사","m":"'~로 가득 찬'은 filled with 사용"},{"w":"others","r":"other","at":20,"t":"대명사 each other","m":"each other는 복수형 없이 each other 사용"}]},{"n":5,"en":"So, we maked a puzzle for you. Here are three silver coins.","ko":"그래서 우리는 너희를 위한 수수께끼 하나를 만들었단다. 여기 은화 세 개가 있어.","fx":[{"w":"maked","r":"made","at":2,"t":"불규칙 과거형","m":"make의 과거형은 made (maked 아님)"}]},{"n":6,"en":"Go to the market and buy something to filling this room completely. If you succeeds, you will get a big reward.\"","ko":"시장에 가서 이 방을 완전히 채울 무언가를 사렴. 만약 너희가 성공한다면, 너희는 큰 보상을 받을 거야.\"","fx":[{"w":"filling","r":"fill","at":8,"t":"to부정사","m":"to 뒤에는 동사원형 fill 사용"},{"w":"succeeds","r":"succeed","at":14,"t":"조건절 동사의 수일치","m":"주어 you는 동사에 -s 없음: succeed"}]},{"n":7,"en":"Ethan, the eldest child, said, \"We will does our best.\" The youngest of the family, Annie, was puzzled.","ko":"첫째인 Ethan이 \"우리는 최선을 다할게요.\"라고 말했다. 가족의 막내인 Annie는 혼란스러웠다.","fx":[{"w":"does","r":"do","at":7,"t":"조동사","m":"will 뒤에는 동사원형 do 사용"}]},{"n":8,"en":"\"Three silver coins aren't enough to fill these room!\" The father replied, \"If you work together, you can figure it out.","ko":"\"은화 세 개는 이 방을 채우기에 충분하지 않아요!\" 아버지가 대답했다, \"만약 너희가 함께 한다면, 그것을 알아낼 수 있어.","fx":[{"w":"these","r":"this","at":7,"t":"지시형용사","m":"단수명사 room 앞에는 this 사용"}]},{"n":9,"en":"Three heads are more better than one.\" Patrick, the middle child, shouted, \"I knows the answer!\"","ko":"세 명이 한 명보다 더 낫단다.\" 둘째인 Patrick이 \"난 답을 알아!\"라고 소리쳤다.","fx":[{"w":"more better","r":"better","at":3,"t":"비교급","m":"better 자체가 비교급, more 없이 better 사용"},{"w":"knows","r":"know","at":13,"t":"동사의 수일치","m":"주어 I에는 know 사용"}]},{"n":12,"en":"He began to filling the room with feathers, but them barely covered the floor. Ethan said to Patrick, \"Why did you act on you own?\"","ko":"그는 깃털로 방을 채우기 시작했지만, 깃털은 간신히 바닥을 덮었다. Ethan이 Patrick에게 말했다, \"왜 너 혼자서 행동했니?\"","fx":[{"w":"filling","r":"fill","at":3,"t":"to부정사","m":"began to 뒤에는 동사원형 fill 사용"},{"w":"them","r":"they","at":9,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 they 사용"},{"w":"you","r":"your","at":23,"t":"인칭대명사의 소유격","m":"own 앞에는 소유격 your 사용"}]},{"n":14,"en":"I thought I knowed the answer.\" Annie sighed.","ko":"나는 답을 안다고 생각했어.\" Annie가 한숨을 쉬었다.","fx":[{"w":"knowed","r":"knew","at":3,"t":"불규칙 과거형","m":"know의 과거형은 knew 사용"}]},{"n":15,"en":"\"Now we only have two coin left.\"","ko":"\"이제 우리에게는 동전 두 개만이 남았어.\"","fx":[{"w":"coin","r":"coins","at":5,"t":"명사의 복수형","m":"two 뒤에는 복수명사 coins 사용"}]},{"n":16,"en":"The children went to the market together. Patrick had another ideas.","ko":"아이들은 함께 시장에 갔다. Patrick은 또 다른 아이디어가 있었다.","fx":[{"w":"ideas","r":"idea","at":10,"t":"수량 형용사 another","m":"another 뒤에는 단수명사 idea 사용"}]},{"n":17,"en":"\"How about straw? It's more cheaper than feathers, but it takes up more space.\"","ko":"\"짚은 어때? 그것은 깃털보다 더 싸지만, 더 많은 공간을 차지해.\"","fx":[{"w":"more cheaper","r":"cheaper","at":4,"t":"비교급","m":"cheap의 비교급은 cheaper, more 불필요"}]},{"n":18,"en":"Ethan said, \"Great idea! But let's only use one coins for now.\"","ko":"Ethan이 \"좋은 생각이야! 하지만 지금은 동전 한 개만 사용하자.\"라고 말했다.","fx":[{"w":"coins","r":"coin","at":9,"t":"명사의 복수형","m":"one 뒤에는 단수명사 coin 사용"}]},{"n":20,"en":"Ethan continued, \"If straw are not the answer, we will have one more chances with the last coin.\"","ko":"Ethan이 이어 말했다, \"만약 짚이 답이 아니라면, 우리는 마지막 동전으로 한 번 더 기회를 갖게 될 거야.\"","fx":[{"w":"are","r":"is","at":4,"t":"be동사의 수일치","m":"주어 straw(단수)에는 is 사용"},{"w":"chances","r":"chance","at":13,"t":"수량 형용사 another","m":"one more 뒤에는 단수명사 chance 사용"}]}]},{"no":"16","t":"Food Brings the World Together","q":[{"n":2,"en":"Me favorite food is tteokguk. It is an traditional food that we eat in New Year's Day.","ko":"내가 가장 좋아하는 음식은 떡국이야. 그것은 우리가 설날에 먹는 전통 음식이지.","fx":[{"w":"Me","r":"My","at":0,"t":"인칭대명사의 소유격","m":"favorite food 앞에는 소유격 My 사용"},{"w":"an","r":"a","at":7,"t":"관사 a/an","m":"자음 소리 traditional 앞에는 a 사용"},{"w":"in","r":"on","at":13,"t":"기본전치사","m":"특정한 날 앞에는 전치사 on 사용"}]},{"n":3,"en":"While people are eating it, they wish for a good, long life. Can you share some special dishes from a festival in you country?","ko":"사람들은 떡국을 먹으면서 건강하게 오래 살기를 기원해. 너희 나라 축제에서 먹는 특별한 음식 몇 가지를 알려 줄래?","fx":[{"w":"you","r":"your","at":22,"t":"인칭대명사의 소유격","m":"country 앞에는 소유격 your 사용"}]},{"n":5,"en":"Every spring, we holds maple syrup festivals. People gets *sap from maple trees and boil it to make maple syrup.","ko":"매년 봄에 우리는 메이플시럽 축제를 열어. 사람들은 단풍나무에서 수액을 채취하여 메이플시럽을 만들기 위해 그것을 끓여.","fx":[{"w":"holds","r":"hold","at":3,"t":"주어와 동사의 수일치","m":"주어 we는 hold (holds 아님)"},{"w":"gets","r":"get","at":8,"t":"주어와 동사의 수일치","m":"주어 People(복수)는 get (gets 아님)"}]},{"n":6,"en":"While the festivals, we enjoy pancakes with the syrup. Some people even drink it by itselves!","ko":"축제 동안, 시럽을 곁들인 팬케이크를 즐겨 먹어. 어떤 사람들은 시럽만 마시기도 해!","fx":[{"w":"While","r":"During","at":0,"t":"전치사와 접속사","m":"명사(구)가 오면 전치사 During 사용"},{"w":"itselves","r":"itself","at":15,"t":"재귀대명사","m":"단수 it의 재귀대명사는 itself 사용"}]},{"n":7,"en":"We enjoy maple candy, too. People also calls it \"sugar on snow.\"","ko":"우리는 메이플 사탕도 즐겨 먹어. 사람들은 그 사탕을 '눈 위의 설탕'이라고도 불러.","fx":[{"w":"calls","r":"call","at":7,"t":"3인칭 단수 현재형","m":"주어 People(복수)에는 call 사용"}]},{"n":8,"en":"To make it, just pour hotly syrup onto snow and wrap it around an stick. It's sweet and softly!","ko":"그것을 만들려면 눈 위에 뜨거운 시럽을 붓고 막대에 감기만 하면 돼. 그것은 달콤하고 부드러워!","fx":[{"w":"hotly","r":"hot","at":5,"t":"형용사와 부사","m":"명사 syrup 앞에는 형용사 hot 사용"},{"w":"an","r":"a","at":13,"t":"관사 a/an","m":"자음 소리 stick 앞에는 a 사용"},{"w":"softly","r":"soft","at":18,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 soft 사용"}]},{"n":10,"en":"I lives in Cairo, Egypt. I will introduces my country's oldest festival, Sham El-Nessim.","ko":"나는 이집트의 카이로에 살아. 나는 우리나라의 가장 오래된 축제인 샴 엘 네심(Sham El-Nessim)을 소개할게.","fx":[{"w":"lives","r":"live","at":1,"t":"3인칭 단수 현재형","m":"주어 I에는 live 사용"},{"w":"introduces","r":"introduce","at":7,"t":"조동사 뒤 동사원형","m":"will 뒤에는 introduce (introduces 아님)"}]},{"n":11,"en":"It means \"smelling the spring wind.\" The Egyptians whose you can see in our old paintings also enjoyed these festival.","ko":"이는 '봄바람의 향기 맡기'라는 뜻이야. 우리의 옛 그림에서 볼 수 있는 이집트 사람들 또한 이 축제를 즐겼어.","fx":[{"w":"whose","r":"whom","at":8,"t":"관계대명사","m":"목적격 관계대명사 whom: Egyptians를 수식"},{"w":"these","r":"this","at":18,"t":"지시형용사 this/these","m":"단수명사 festival에는 this 사용"}]},{"n":12,"en":"To celebrate the begin of spring, we spend all day outside. We go on picnics and enjoy our tradition meals.","ko":"봄의 시작을 기념하기 위해서, 우리는 하루 종일 밖에서 시간을 보내. 우리는 소풍을 가서 전통 음식을 맛있게 먹어.","fx":[{"w":"begin","r":"beginning","at":3,"t":"동사와 명사의 품사","m":"the 뒤에는 명사 beginning 사용"},{"w":"tradition","r":"traditional","at":18,"t":"형용사와 명사의 품사","m":"명사 meals를 꾸미는 형용사 traditional 사용"}]},{"n":13,"en":"The most importantly food is fesikh, a kind of fish dish that many Egyptians loves. My favorite food is colorful eggs.","ko":"가장 중요한 음식은 페시크(fesikh)인데, 많은 이집트 사람들이 아주 좋아하는 생선 요리의 한 종류야. 내가 가장 좋아하는 음식은 알록달록한 달걀이야.","fx":[{"w":"importantly","r":"important","at":2,"t":"형용사와 부사","m":"명사 food 수식은 important (importantly 아님)"},{"w":"loves","r":"love","at":14,"t":"주어와 동사의 수일치","m":"Egyptians(복수)는 love (loves 아님)"}]}]},{"no":"17","t":"Where's the Class Pet?","q":[{"n":1,"en":"Everyone have a job in my class. The most popular one is to feeding our class pet, Larry, the iguana.","ko":"우리 반에서는 모두가 맡은 일이 있다. 가장 인기 있는 것은 우리 반 반려동물인 이구아나 Larry에게 먹이를 주는 일이다.","fx":[{"w":"have","r":"has","at":1,"t":"3인칭 단수 현재형","m":"Everyone은 단수 취급: has (have 아님)"},{"w":"feeding","r":"feed","at":13,"t":"to부정사의 명사적 용법","m":"be동사 뒤 to 다음에는 동사원형 feed 사용"}]},{"n":2,"en":"This week, I have to take care of he.","ko":"이번 주에는 내가 그를 돌봐야 한다.","fx":[{"w":"he","r":"him","at":8,"t":"인칭대명사의 목적격","m":"전치사 of 뒤에는 목적격 him 사용"}]},{"n":3,"en":"It is Friday and I am walking back to home. I see an woman who is walking with her pet dog.","ko":"금요일이고 나는 집으로 걸어서 돌아가고 있다. 나는 반려견과 함께 걷고 있는 한 여자를 본다.","fx":[{"w":"to home","r":"home","at":8,"t":"부사 home","m":"home은 부사로 전치사 없이 back home 사용"},{"w":"an","r":"a","at":12,"t":"관사 a/an","m":"woman은 자음 소리이므로 a 사용"}]},{"n":6,"en":"I turn around and runs back to the classroom.","ko":"나는 돌아서서 교실로 다시 달려간다.","fx":[{"w":"runs","r":"run","at":4,"t":"동사의 시제·수일치","m":"주어 I에는 runs 아님: run"}]},{"n":7,"en":"The cage is open, and Larry are gone.","ko":"케이지(우리)가 열려 있고, Larry가 사라졌다.","fx":[{"w":"are","r":"is","at":6,"t":"be동사의 수일치","m":"주어 Larry(단수)에는 is 사용"}]},{"n":9,"en":"What should I told my classmates?","ko":"반 친구들에게 뭐라고 말해야 하지?","fx":[{"w":"told","r":"tell","at":3,"t":"조동사 뒤 동사원형","m":"조동사 should 뒤 동사원형: tell (told 아님)"}]},{"n":10,"en":"My mind turns into a worry machines. I begin to breathing quickly.","ko":"나의 머릿속은 걱정 기계로 변한다. 나는 빠르게 숨을 쉬기 시작한다.","fx":[{"w":"machines","r":"machine","at":6,"t":"명사의 복수형","m":"a 뒤에는 단수명사 machine 사용"},{"w":"breathing","r":"breathe","at":10,"t":"to부정사의 명사적 용법","m":"begin to 뒤에는 동사원형 breathe 사용"}]},{"n":12,"en":"I have friend who can help me.","ko":"나는 나를 도와줄 수 있는 친구들이 있다.","fx":[{"w":"friend","r":"friends","at":2,"t":"명사의 복수형","m":"관사 없는 가산명사는 복수 friends 사용"}]},{"n":14,"en":"After a while, Mike and Jenny runs into the classroom. \"Don't worry, Oliver.","ko":"잠시 후, Mike와 Jenny가 교실로 뛰어 들어온다. \"걱정 마, Oliver.","fx":[{"w":"runs","r":"run","at":6,"t":"주어와 동사의 수일치","m":"Mike and Jenny(복수)에는 run 사용"}]},{"n":15,"en":"We'll finds Larry together,\" Jenny says. First, Jenny tells me to breathe in and out slowly.","ko":"우리가 Larry를 함께 찾을 거야.\"라고 Jenny가 말한다. 먼저, Jenny는 나에게 천천히 숨을 들이쉬고 내쉬라고 말한다.","fx":[{"w":"finds","r":"find","at":1,"t":"조동사 뒤 동사원형","m":"will 뒤에는 동사원형 find 사용"}]},{"n":16,"en":"I feel much more calmer. Mike says, \"The windows is closed.","ko":"나는 훨씬 차분해진 걸 느낀다. Mike는 \"창문이 닫혀 있어.","fx":[{"w":"more calmer","r":"calmer","at":3,"t":"비교급","m":"calmer가 이미 비교급이므로 more 불필요"},{"w":"is","r":"are","at":9,"t":"be동사의 수일치","m":"복수 windows에는 are (is 아님)"}]},{"n":17,"en":"Larry must still be in here.\" We look everywhere on the classroom, but we can't find Larry.","ko":"Larry가 아직 이 안에 있는 게 분명해.\"라고 말한다. 우리는 교실 모든 곳을 찾아보지만, Larry를 찾지 못한다.","fx":[{"w":"on","r":"in","at":9,"t":"기본전치사","m":"'교실 안에서'는 in the classroom 사용"}]},{"n":18,"en":"\"How about play the recorder? Larry may come out,\" Mike says.","ko":"\"리코더를 불어 보는 건 어때? Larry가 나올지도 몰라.\"라고 Mike가 말한다.",
