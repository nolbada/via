o) enjoy로 형태를 맞춤"}]}, {"n": 5, "tag": null, "en": "I'm Peter, the director of photography for this movie. I'm in charge of all the camera.", "ko": "나는 이 영화의 촬영감독인 Peter예요. 나는 모든 카메라를 담당하고 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "camera", "right": "cameras", "partial": false, "at": [15], "point": "명사의 복수형: all the 뒤에는 복수명사 cameras 사용", "topic": "명사의 복수형", "memo": "all the 뒤에는 복수명사 cameras 사용"}]}, {"n": 6, "tag": null, "en": "Today, Tom and Max is going to play together with a ball on the beach. To capture they happy moments, I'm going to use drones.", "ko": "오늘, Tom과 Max는 해변에서 공을 가지고 함께 놀 예정이에요. 그들의 행복한 순간을 포착하기 위해, 나는 드론을 사용할 거예요.", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "are", "partial": false, "at": [4], "point": "be동사의 현재형: Tom and Max는 복수라 are 사용", "topic": "be동사의 현재형", "memo": "Tom and Max는 복수라 are 사용"}, {"wrong": "they", "right": "their", "partial": false, "at": [17], "point": "인칭대명사의 소유격: happy moments 앞에는 소유격 their 사용", "topic": "인칭대명사의 소유격", "memo": "happy moments 앞에는 소유격 their 사용"}]}, {"n": 7, "tag": null, "en": "I'm Jennifer. I trained and taked care of Max for a long time.", "ko": "나는 Jennifer예요. 나는 Max를 오랫동안 훈련하고 돌봤어요.", "ok": false, "foot": [], "fixes": [{"wrong": "taked", "right": "took", "partial": false, "at": [5], "point": "불규칙 과거형: take의 과거형은 took (taked 아님)", "topic": "불규칙 과거형", "memo": "take의 과거형은 took (taked 아님)"}]}, {"n": 8, "tag": null, "en": "Max is a great actors, but he sometimes get too excited when a lot of people are around. So, I use hand signals to calm him.", "ko": "Max는 훌륭한 배우이지만, 주변에 사람들이 많을 때 가끔 너무 흥분해요. 그래서, 나는 그를 진정시키기 위해 수신호를 사용해요.", "ok": false, "foot": [], "fixes": [{"wrong": "actors", "right": "actor", "partial": false, "at": [4], "point": "명사의 단수형: a 뒤에는 단수명사 actor 사용", "topic": "명사의 단수형", "memo": "a 뒤에는 단수명사 actor 사용"}, {"wrong": "get", "right": "gets", "partial": false, "at": [8], "point": "3인칭 단수 현재형: 주어 he(단수)에는 gets 사용", "topic": "3인칭 단수 현재형", "memo": "주어 he(단수)에는 gets 사용"}]}, {"n": 9,
