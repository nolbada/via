e meaning of the underlined word? (So don’t ignore those leftovers in the refrigerator.)","ko":"따라서 냉장고 속의 남은 음식들을 무시하지 마라.","opts":["먹다","데우다","무시하다","섞다"],"word":"ignore","r":{"a":"3) 무시하다","ev":"12~13번 문장","s":[[12,"So don’t ignore those leftovers in the refrigerator.","따라서 냉장고 속의 남은 음식들을 무시하지 마라."],[13,"They might make an excellent meal.","그것들은 훌륭한 식사가 될 수도 있다."]],"w":"13번에서 남은 음식이 훌륭한 식사가 될 수도 있다고 하니, 그냥 지나치지 말라는 뜻이에요. don’t ignore = 무시하지 마라예요.","c":3},"h":"75a8a8e816"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis increases the sweetness of the food.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 음식의 단맛을 증가시킨다.","opts":["지방과 양념이 섞이는 것","당이 분해되어 음식 전체에 퍼지는 것","음식이 냉장고에 남는 것","후각이 깨어나는 것"],"r":{"a":"2) 당이 분해되어 음식 전체에 퍼지는 것","ev":"9~10번 문장","s":[[9,"Additionally, sugar in the food breaks down and spreads throughout the dish.","게다가, 음식에 들어 있는 당이 분해되어 요리 전체에 퍼진다."],[10,"This increases the sweetness of the food.","이는 음식의 단맛을 증가시킨다."]],"w":"바로 앞 9번에서 음식 속 당이 분해되어 요리 전체에 퍼진다고 했어요. 그것이 단맛을 늘려요.","c":2},"h":"b3cf9cf109"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is because their taste continues to change after they are cooked.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그것의 맛이 요리가 된 이후 계속해서 변하기 때문이다.","opts":["이것은 요리하기 전에 맛이 변하기 때문이다.","이것은 음식이 요리된 뒤에는 맛이 변하지 않기 때문이다.","이것은 맛이 변하면 음식을 요리하기 때문이다.","이것은 음식이 요리된 뒤에도 맛이 계속 변하기 때문이다."],"r":{"a":"4) 이것은 음식이 요리된 뒤에도 맛이 계속 변하기 때문이다.","ev":"3번 문장","s":[[3,"This is because their taste continues to change after they are cooked.","이것은 그것의 맛이 요리가 된 이후 계속해서 변하기 때문이다."]],"w":"after they are cooked는 ‘요리가 된 뒤’이고 continues to change는 ‘계속 변한다’예요. 요리 전이나 변하지 않는다는 말은 틀려요.","c":4},"h":"2e695e883a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["남은 음식은 다음 날에는 언제나 맛이 없어진다.","남은 음식은 같은 날에 먹어야 한다.","수프, 스튜, 소스는 지방이 많은 음식에 속한다.","남은 음식은 곧바로 버려야 한다."],"opts":["Leftovers always taste worse the next day.","Leftovers must be eaten on the same day.","Soups, stews, and sauces are examples of fatty foods.","Leftovers should be thrown away at once."],"r":{"a":"3) Soups, stews, and sauces are examples of fatty foods. (수프, 스튜, 소스는 지방이 많은 음식에 속한다.)","ev":"4번 문장","s":[[4,"This is especially true with fatty foods, including soups, stews, and sauces.","이것은 특히 수프, 스튜, 소스를 포함한 지방이 많은 음식에 적용된다."]],"w":"4번 문장에서 fatty foods, including soups, stews, and sauces라고 했어요.","c":3},"h":"5bd084d52f"},{"n":9,"t":"sum","q":"When sugar (A) throughout the dish, the food gets sweeter and its taste is less (B).","ko":"당이 요리 전체에 (A) 음식은 더 달고 맛이 덜 (B).","oko":["(A) 퍼지면 / (B) 단","(A) 멈추면 / (B) 쓴","(A) 사라지면 / (B) 단","(A) 퍼지면 / (B) 쓴","(A) 멈추면 / (B) 짠"],"opts":["(A) spreads / (B) sweet","(A) stops / (B) bitter","(A) disappears / (B) sweet","(A) spreads / (B) bitter","(A) stops / (B) salty"],"r":{"a":"4) (A) spreads / (B) bitter ((A) 퍼지면 / (B) 쓴)","ev":"9~11번 문장","s":[[9,"Additionally, sugar in the food breaks down and spreads throughout the dish.","게다가, 음식에 들어 있는 당이 분해되어 요리 전체에 퍼진다."],[10,"This increases the sweetness of the food.","이는 음식의 단맛을 증가시킨다."],[11,"It also decreases its bitterness.","그것은 또한 쓴맛을 줄인다."]],"w":"9번에서 당이 분해되어 퍼지고(spreads), 10번에서 단맛이 늘고, 11번에서 쓴맛(bitterness)이 줄어든다고 했어요.","c":4},"h":"bd41f742e1"},{"n":10,"t":"fill","q":"The [A] in the dish mix with the fats. This gives the food a very nice [B].","ko":"음식에 든 [A]은(는) 지방질과 섞인다. 이는 그 음식에 매우 좋은 [B]이(가) 나게 한다.","bank":["spices","scent","refrigerator","meal","sense","day"],"bko":{"spices":"양념","scent":"냄새, 향","refrigerator":"냉장고","meal":"식사","sense":"감각","day":"날"},"r":{"a":"[A] spices (양념), [B] scent (냄새, 향)","ev":"5~6번 문장","s":[[5,"The spices in the dish mix with the fats.","음식에 든 양념은 지방질과 섞인다."],[6,"This gives the food a very nice scent.","이는 그 음식에 매우 좋은 냄새가 나게 한다."]],"w":"5~6번 문장에서 가져왔어요. spices(양념)가 fats(지방)와 섞여 nice scent(좋은 냄새)를 줘요.","c":null},"h":"7557d58816"}]},{"u":6,"id":"nl1-06-4","no":4,"ko":"얼음성이 실제로 존재했다고?","items":[{"n":1,"t":"tf","q":"Anna Ivanovna was the empress of Russia in the 1730s.","ko":"Anna Ivanovna는 1730년대 러시아의 여황제였다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Anna Ivanovna was the empress of Russia in the 1730s.","Anna Ivanovna(안나 이바노브나)는 1730년대 러시아의 여황제였다."]],"w":"1번에 Anna Ivanovna was the empress of Russia in the 1730s가 나와요.","c":"T"},"h":"7b47bb6203"},{"n":2,"t":"tf","q":"Anna Ivanovna was very interested in politics.","ko":"Anna Ivanovna는 정치에 매우 관심이 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"She wasn’t interested in politics.","그녀는 정치에 관심이 없었다."],[3,"She cared only about power.","그녀는 오직 권력에만 신경을 썼다."]],"w":"2번에서 She wasn’t interested in politics라고 해요. 3번에서 오직 권력에만 신경을 썼어요.","c":"F"},"h":"276a561361"},{"n":3,"t":"tf","q":"The empress locked the couple in the ice palace for a whole day.","ko":"여황제는 그 부부를 하루 종일 얼음 궁전에 가두었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Moreover, she locked the couple in the ice palace for a whole day.","게다가, 그녀는 그 부부를 하루 종일 얼음 궁전에 가두었다."]],"w":"12번에 she locked the couple in the ice palace for a whole day가 나와요.","c":"T"},"h":"cd34db79fd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day, she ordered the construction of an ice palace.)","ko":"어느 날, 그녀는 얼음 궁전의 건설을 명령했다.","opts":["거절했다","구경했다","명령했다","팔았다"],"word":"ordered","r":{"a":"3) 명령했다","ev":"4~5번 문장","s":[[4,"One day, she ordered the construction of an ice palace.","어느 날, 그녀는 얼음 궁전의 건설을 명령했다."],[5,"It was built to celebrate Russia’s victory over the Ottoman Empire.","그것은 오스만 제국을 상대로 한 러시아의 승리를 기념하기 위해 지어졌다."]],"w":"여황제가 건설을 시킨 장면이에요. order = 명령하다예요. 5번 It was built로 이어져요.","c":3},"h":"b8692ae6d3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The ice palace soon melted, and Anna died the next year.)","ko":"그 얼음 궁전은 머지않아 녹았고, 다음 해에 Anna는 죽었다.","opts":["얼었다","녹았다","무너졌다","커졌다"],"word":"melted","r":{"a":"2) 녹았다","ev":"14번 문장","s":[[14,"The ice palace soon melted, and Anna died the next year.","그 얼음 궁전은 머지않아 녹았고, 다음 해에 Anna는 죽었다."]],"w":"얼음으로 만든 궁전이 시간이 지나 어떻게 되는지를 묻는 거예요. 얼음이 열을 받으면 녹아요. melt = 녹다예요.","c":2},"h":"df0780f5de"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis made her angry.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 그녀를 화나게 만들었다.","opts":["왕자가 이탈리아 여성과 결혼하고 가톨릭 신자가 된 일","왕자가 여황제의 하녀와 결혼한 일","러시아가 오스만 제국에 승리한 일","얼음 궁전이 지어진 일"],"r":{"a":"1) 왕자가 이탈리아 여성과 결혼하고 가톨릭 신자가 된 일","ev":"8~9번 문장","s":[[8,"He had married a Catholic woman from Italy and then became Catholic himself.","그는 이탈리아 출신의 가톨릭 신자 여성과 결혼했고 이후 자신도 가톨릭 신자가 되었다."],[9,"This made her angry.","이것이 그녀를 화나게 만들었다."]],"w":"바로 앞 8번에서 왕자가 가톨릭 여성과 결혼하고 자신도 가톨릭 신자가 되었다고 했어요. 하녀와의 결혼은 11번에서 Anna가 시킨 일이에요.","c":1},"h":"20e1df8400"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But it really had a different purpose.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그것은 실제로 다른 목적이 있었다.","opts":["그러나 그것은 사실 아무 목적이 없었다.","그러나 그것은 사실 같은 목적을 가졌다.","그러나 그것은 사실 여러 목적이 있었다.","그러나 그것은 사실 겉으로 내세운 것과 다른 목적이 있었다."],"r":{"a":"4) 그러나 그것은 사실 겉으로 내세운 것과 다른 목적이 있었다.","ev":"5~7번 문장","s":[[5,"It was built to celebrate Russia’s victory over the Ottoman Empire.","그것은 오스만 제국을 상대로 한 러시아의 승리를 기념하기 위해 지어졌다."],[6,"But it really had a different purpose.","하지만 그것은 실제로 다른 목적이 있었다."],[7,"She wanted to punish a local prince.","그녀는 한 지역의 왕자를 벌하고 싶어 했다."]],"w":"different purpose는 ‘다른 목적’이에요. 5번의 겉목적(승리 기념)과 달리 7번에서 왕자를 벌주려는 실제 목적이 나와요.","c":4},"h":"e1d85d7f33"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["부부는 얼음 궁전에서 죽었다.","Anna의 잔인함은 오늘날에도 여전히 기억되고 있다.","왕자의 첫 부인은 러시아 공주였다.","Anna는 이탈리아의 여황제였다."],"opts":["The couple died in the ice palace.","Anna’s cruelty is still remembered today.","The prince’s first wife was a Russian princess.","Anna was the empress of Italy."],"r":{"a":"2) Anna’s cruelty is still remembered today. (Anna의 잔인함은 오늘날에도 여전히 기억되고 있다.)","ev":"15번 문장","s":[[15,"Her cruelty, however, is still remembered today.","하지만 그녀의 잔인함은 오늘날에도 여전히 기억되고 있다."]],"w":"15번 문장에서 Her cruelty, however, is still remembered today라고 했어요.","c":2},"h":"a4097c4187"},{"n":9,"t":"sum","q":"Anna was angry because a local prince became (A), so she (B) him to marry one of her maids.","ko":"Anna는 한 지역의 왕자가 (A)이(가) 되어 화가 났고, 그래서 그에게 자신의 하녀 중 한 명과 결혼하도록 (B).","oko":["(A) 가톨릭 신자 / (B) 강요했다","(A) 가톨릭 신자 / (B) 부탁했다","(A) 러시아인 / (B) 강요했다","(A) 부유한 사람 / (B) 부탁했다","(A) 이탈리아인 / (B) 강요했다"],"opts":["(A) Catholic / (B) forced","(A) Catholic / (B) asked","(A) Russian / (B) forced","(A) rich / (B) asked","(A) Italian / (B) forced"],"r":{"a":"1) (A) Catholic / (B) forced ((A) 가톨릭 신자 / (B) 강요했다)","ev":"8~9번, 11번 문장","s":[[8,"He had married a Catholic woman from Italy and then became Catholic himself.","그는 이탈리아 출신의 가톨릭 신자 여성과 결혼했고 이후 자신도 가톨릭 신자가 되었다."],[9,"This made her angry.","이것이 그녀를 화나게 만들었다."],[11,"After his wife died, the empress forced him to marry one of her maids.","그의 부인이 죽은 후에 여황제는 그가 자신의 하녀 중 한 명과 결혼할 것을 강요했다."]],"w":"8번에서 왕자가 가톨릭 신자가 되었고(became Catholic), 9번에서 Anna가 화났어요. 11번에서 하녀와 결혼하도록 강요했어요(forced).","c":1},"h":"9d78e459df"},{"n":10,"t":"fill","q":"The couple [A], but they both suffered from [B].","ko":"그 부부는 [A], 하지만 둘 다 [B](으)로 고통받았다.","bank":["survived","frostbite","melted","ordered","politics","victory"],"bko":{"survived":"살아남았다","frostbite":"동상","melted":"녹았다","ordered":"명령했다","politics":"정치","victory":"승리"},"r":{"a":"[A] survived (살아남았다), [B] frostbite (동상)","ev":"13번 문장","s":[[13,"Fortunately, they survived, but they both suffered from frostbite.","다행히도 그들은 살아남았지만, 둘 다 동상으로 고통받았다."]],"w":"13번 문장에서 가져왔어요. survived(살아남았다), frostbite(동상).","c":null},"h":"7c28c1b355"}]},{"u":7,"id":"nl1-07-1","no":1,"ko":"뽁뽁이에도 출생의 비밀이?!","items":[{"n":1,"t":"tf","q":"In 1957, two engineers wanted to make plastic wallpaper.","ko":"1957년에 두 기술자는 플라스틱 벽지를 만들고 싶었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In 1957, two engineers wanted to make three-dimensional plastic wallpaper.","1957년에 두 명의 기술자는 입체적인 플라스틱 벽지를 만들고 싶었다."]],"w":"5번 문장에 1957년 두 기술자가 입체적인 플라스틱 벽지를 만들고 싶었다고 나와요. 일치해요.","c":"T"},"h":"55e8f0e78f"},{"n":2,"t":"tf","q":"The engineers' wallpaper was a big success.","ko":"기술자들의 벽지는 큰 성공이었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Unfortunately, it was a big failure.","불행히도 그것은 대실패였다."]],"w":"6번 문장에서 벽지는 it was a big failure, 즉 대실패였다고 해요. 성공이라는 말은 반대예요.","c":"F"},"h":"532a68d700"},{"n":3,"t":"tf","q":"One engineer thought the air bubbles in the wallpaper could protect fragile items.","ko":"한 기술자는 벽지 속 기포가 깨지기 쉬운 물품을 보호할 수 있다고 생각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"He thought that people could use the air bubbles in the wallpaper to protect fragile items!","그는 사람들이 벽지에 들어 있는 기포를 깨지기 쉬운 물품을 보호하는 데 사용할 수 있다고 생각했다!"]],"w":"8번 문장이 그대로 이 내용이에요. 기포로 깨지기 쉬운 물품을 보호하자는 생각이에요.","c":"T"},"h":"a65d4d9d9d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...use the air bubbles in the wallpaper to protect fragile items!)","ko":"...벽지 속 기포를 사용해서 fragile한 물품을 보호하는 데...","opts":["단단한","값비싼","깨지기 쉬운","오래된"],"word":"fragile","r":{"a":"3) 깨지기 쉬운","ev":"7, 8번 문장","s":[[7,"Later, one of the engineers had a better idea.","나중에 그 기술자들 중 한 명이 더 나은 생각을 떠올렸다."],[8,"He thought that people could use the air bubbles in the wallpaper to protect fragile items!","그는 사람들이 벽지에 들어 있는 기포를 깨지기 쉬운 물품을 보호하는 데 사용할 수 있다고 생각했다!"]],"w":"7번에서 한 기술자가 더 나은 생각을 떠올리고, 8번에서 그 생각이 기포로 보호하는 것이에요. 보호해야 하는 물품이니 fragile = 깨지기 쉬운이에요.","c":3},"h":"6513f730f9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...but this was not its original use.)","ko":"...하지만 이것이 그것의 original 용도는 아니었다.","opts":["원래의","새로운","마지막의","유일한"],"word":"original","r":{"a":"1) 원래의","ev":"4, 5번 문장","s":[[4,"Bubble wrap is known for keeping items safe, but this was not its original use.","뽁뽁이는 물품을 안전하게 유지하는 것으로 알려져 있지만, 이것이 원래의 용도는 아니었다."],[5,"In 1957, two engineers wanted to make three-dimensional plastic wallpaper.","1957년에 두 명의 기술자는 입체적인 플라스틱 벽지를 만들고 싶었다."]],"w":"4번에서 뽁뽁이가 물품을 지키는 것으로 알려져 있지만 이것은 original use가 아니라고 하고, 5번에서 원래는 벽지를 만들려 했다고 해요. original = 원래의.","c":1},"h":"5e798783eb"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe thought that people could use the air bubbles in the wallpaper to protect fragile items!","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 사람들이 벽지에 들어 있는 기포를 깨지기 쉬운 물품을 보호하는 데 사용할 수 있다고 생각했다!","opts":["우편을 보내려는 사람","벽지를 만들던 두 기술자 중 한 명","뽁뽁이를 사는 손님","포장재 회사의 직원"],"r":{"a":"2) 벽지를 만들던 두 기술자 중 한 명","ev":"7, 8번 문장","s":[[7,"Later, one of the engineers had a better idea.","나중에 그 기술자들 중 한 명이 더 나은 생각을 떠올렸다."],[8,"He thought that people could use the air bubbles in the wallpaper to protect fragile items!","그는 사람들이 벽지에 들어 있는 기포를 깨지기 쉬운 물품을 보호하는 데 사용할 수 있다고 생각했다!"]],"w":"7번 문장에서 two engineers 중 one of the engineers가 더 나은 생각을 떠올렸다고 하고, 8번의 He가 그 사람이에요.","c":2},"h":"94e4122000"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Wrap it up in bubble wrap!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것을 뽁뽁이로 싸라!","opts":["뽁뽁이로 그것을 감싸라!","뽁뽁이를 그것에서 떼어 내라!","뽁뽁이를 사서 선물하라!","그것을 뽁뽁이 없이 그대로 보내라!"],"r":{"a":"1) 뽁뽁이로 그것을 감싸라!","ev":"3번 문장","s":[[3,"Wrap it up in bubble wrap!","그것을 뽁뽁이로 싸라!"]],"w":"Wrap it up in bubble wrap!에서 wrap ~ up은 ‘~을 감싸다’예요. 뽁뽁이로 감싸라는 뜻이에요.","c":1},"h":"286f097422"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["두 기술자는 1957년에 벽지를 팔아 부자가 되었다.","두 기술자의 벽지는 큰 성공을 거두었다.","한 기술자가 실패 뒤에 더 나은 생각을 떠올렸다.","그들의 포장재 사업은 몇 해 전에 문을 닫았다."],"opts":["The engineers sold wallpaper in 1957 and became rich.","The engineers' wallpaper was a big success.","One engineer had a better idea after the failure.","Their packaging business closed years ago."],"r":{"a":"3) One engineer had a better idea after the failure. (한 기술자가 실패 뒤에 더 나은 생각을 떠올렸다.)","ev":"6~7번 문장","s":[[6,"Unfortunately, it was a big failure.","불행히도 그것은 대실패였다."],[7,"Later, one of the engineers had a better idea.","나중에 그 기술자들 중 한 명이 더 나은 생각을 떠올렸다."]],"w":"6번에서 벽지는 실패였고, 7번에서 한 기술자가 더 나은 생각을 떠올렸어요.","c":3},"h":"b9a2dd3b3d"},{"n":9,"t":"sum","q":"The two engineers started a packaging (A) in 1960, and it still makes bubble wrap (B).","ko":"두 기술자는 1960년에 포장재 (A)을(를) 세웠고, 그것은 (B)도 여전히 뽁뽁이를 만든다.","oko":["(A) 회사 / (B) 오늘날","(A) 공장 / (B) 오늘날","(A) 회사 / (B) 어제","(A) 학교 / (B) 내일","(A) 가게 / (B) 어제"],"opts":["(A) company / (B) today","(A) factory / (B) today","(A) company / (B) yesterday","(A) school / (B) tomorrow","(A) store / (B) yesterday"],"r":{"a":"1) (A) company / (B) today ((A) 회사 / (B) 오늘날)","ev":"9~10번 문장","s":[[9,"In 1960, the two engineers started a packaging company.","1960년에 그 두 기술자들은 포장재 회사를 운영하기 시작했다."],[10,"Their company still makes bubble wrap today.","그들의 회사는 오늘날에도 여전히 뽁뽁이를 만든다."]],"w":"9번에서 포장재 회사(packaging company)를 시작했고, 10번에서 오늘날(today)에도 뽁뽁이를 만든다고 했어요.","c":1},"h":"656f9cbd65"},{"n":10,"t":"fill","q":"You need to send something by [A], but you’re afraid that it will [B].","ko":"당신은 무언가를 [A](으)로 보내야 하지만, 그것이 [B] 것이 걱정스럽다.","bank":["mail","break","wrapped","safe","idea","failure"],"bko":{"mail":"우편","break":"깨지다","wrapped":"쌌다(wrap의 과거)","safe":"안전한","idea":"생각","failure":"실패"},"r":{"a":"[A] mail (우편), [B] break (깨지다)","ev":"1번 문장","s":[[1,"You need to send something by mail, but you’re afraid that it will break.","당신은 무언가를 우편으로 보내야 하지만, 그것이 깨질까 봐 걱정스럽다."]],"w":"1번 문장에서 가져왔어요. send something by mail(우편으로 보내다), it will break(깨질 것이다).","c":null},"h":"bf77eb6fa7"}]},{"u":7,"id":"nl1-07-2","no":2,"ko":"향초 켤 때 꼭 알아둬~","items":[{"n":1,"t":"tf","q":"Scented candles create soft light and good smells.","ko":"향초는 부드러운 빛과 좋은 향기를 낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They are very relaxing, and they create soft light and good smells.","향초는 마음을 느긋하게 해 주고, 부드러운 빛과 좋은 향기를 낸다."]],"w":"2번 문장에서 향초는 soft light and good smells를 만든다고 해요. 일치해요.","c":"T"},"h":"1dd3ef1e99"},{"n":2,"t":"tf","q":"The chemicals in scented candles never react with gases in the air.","ko":"향초 속 화학 물질은 공기 중의 기체와 절대 반응하지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Some of these chemicals react with gases in the air.","이 화학 물질들의 일부는 공기 중의 기체와 반응한다."]],"w":"5번 문장에서 일부 화학 물질이 공기 중의 기체와 반응한다(react)고 해요. never는 반대예요.","c":"F"},"h":"3674d8739c"},{"n":3,"t":"tf","q":"Formaldehyde can seriously harm your health.","ko":"포름알데히드는 건강을 심각하게 해칠 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Formaldehyde causes cancer and can seriously harm your health.","포름알데히드는 암을 유발하고 당신의 건강을 심각하게 해칠 수 있다."]],"w":"9번 문장에서 포름알데히드는 암을 일으키고 건강을 심각하게 해칠 수 있다고 해요.","c":"T"},"h":"20cf755186"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some of these chemicals react with gases in the air.)","ko":"이 화학 물질들의 일부는 공기 중의 기체와 react한다.","opts":["사라진다","녹는다","팔린다","반응한다"],"word":"react","r":{"a":"4) 반응한다","ev":"5, 6번 문장","s":[[5,"Some of these chemicals react with gases in the air.","이 화학 물질들의 일부는 공기 중의 기체와 반응한다."],[6,"This makes the candles dangerous.","이것이 향초를 위험하게 만든다."]],"w":"5번 다음 6번에서 This makes the candles dangerous라고 해요. 화학 물질이 기체와 만나 변하면서 위험해진다는 뜻이니 react = 반응하다예요.","c":4},"h":"023473bd12"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Formaldehyde causes cancer and can seriously harm your health.)","ko":"포름알데히드는 암을 유발하고 건강을 심각하게 harm할 수 있다.","opts":["해를 끼치다","좋게 하다","바꾸다","알려 주다"],"word":"harm","r":{"a":"1) 해를 끼치다","ev":"9번 문장","s":[[9,"Formaldehyde causes cancer and can seriously harm your health.","포름알데히드는 암을 유발하고 당신의 건강을 심각하게 해칠 수 있다."]],"w":"포름알데히드가 암을 일으킨다고 한 문장이에요. 건강에 나쁜 일이니 harm = 해를 끼치다예요.","c":1},"h":"7a668d320a"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBut when it mixes with other gases, it makes formaldehyde.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그러나 그것이 다른 기체들과 섞이면 포름알데히드를 만든다.","opts":["레몬","리모넨이라는 화학 물질","향초","공기 중의 기체"],"r":{"a":"2) 리모넨이라는 화학 물질","ev":"7, 8번 문장","s":[[7,"For example, a chemical called limonene smells like lemons.","예를 들어, 리모넨이라고 불리는 화학 물질은 레몬 같은 향기가 난다."],[8,"But when it mixes with other gases, it makes formaldehyde.","그러나 그것이 다른 기체들과 섞이면 포름알데히드를 만든다."]],"w":"7번에서 a chemical called limonene이 나오고, 8번에서 But when it mixes ...로 이어져요. it은 리모넨이에요. 섞이는 상대는 other gases예요.","c":2},"h":"d6a7b49f40"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But few people know that they can be dangerous.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 그것들이 위험할 수 있다는 것을 아는 사람은 거의 없다.","opts":["향초가 위험하다는 것을 모르는 사람은 거의 없다.","향초가 위험할 수 있다는 것을 아는 사람은 거의 없다.","향초가 위험하다는 것을 아는 사람은 아주 많다.","향초는 위험하지 않다고 아는 사람이 거의 없다."],"r":{"a":"2) 향초가 위험할 수 있다는 것을 아는 사람은 거의 없다.","ev":"3번 문장","s":[[3,"But few people know that they can be dangerous.","그러나 그것들이 위험할 수 있다는 것을 아는 사람은 거의 없다."]],"w":"few people know는 '아는 사람이 거의 없다'예요. 그래서 위험할 수 있다는 사실을 아는 사람이 거의 없다는 ②예요. ①은 정반대로 읽은 것이에요.","c":2},"h":"6bcba5611a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["향초는 어느 방에서나 안전하다.","포름알데히드는 건강에 좋다.","이러한 향초에 사용되는 향료에는 화학 물질이 들어 있다.","향초는 공기를 더 차갑게 만든다."],"opts":["Scented candles are safe in any room.","Formaldehyde is good for your health.","The perfumes used in these candles contain chemicals.","Scented candles make the air colder."],"r":{"a":"3) The perfumes used in these candles contain chemicals. (이러한 향초에 사용되는 향료에는 화학 물질이 들어 있다.)","ev":"4번 문장","s":[[4,"The perfumes used in these candles contain chemicals.","이러한 향초에 사용되는 향료에는 화학 물질들이 들어 있다."]],"w":"4번 문장에서 The perfumes used in these candles contain chemicals라고 했어요.","c":3},"h":"632ad5b423"},{"n":9,"t":"sum","q":"Never light scented candles when all the doors and windows are (A). Always (B) a window before you light them.","ko":"모든 문과 창문이 (A) 있을 때는 향초를 켜지 말고, 켜기 전에 항상 창문을 (B).","oko":["(A) 닫혀 / (B) 열어라","(A) 열려 / (B) 닫아라","(A) 닫혀 / (B) 닫아라","(A) 부서져 / (B) 열어라","(A) 열려 / (B) 열어라"],"opts":["(A) closed / (B) open","(A) open / (B) close","(A) closed / (B) close","(A) broken / (B) open","(A) open / (B) open"],"r":{"a":"1) (A) closed / (B) open ((A) 닫혀 / (B) 열어라)","ev":"10~11번 문장","s":[[10,"To stay safe, never light scented candles when all the doors and windows are closed.","안전하게 지내기 위해서 문과 창문들이 모두 닫혀 있을 때는 절대로 향초를 켜지 마라."],[11,"Always open a window before you light them!","향초에 불을 붙이기 전에 항상 창문을 열어라!"]],"w"  the summer.","그것은 일 년 내내, 심지어 여름에도 연다."],[7,"Solar power prevents the ice from melting.","태양열 발전이 얼음이 녹는 것을 막는다."]],"w":"여름에도 연다(6번)는 말 다음 문장이에요. 얼음이 녹으면 곤란하니 녹는 것을 막는다는 뜻이고, prevent = 막다예요.","c":2},"h":"6a9fe336de"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Many of the rooms are built by famous artists and architects.)","ko":"많은 객실이 유명한 예술가와 architect들에 의해 만들어진다.","opts":["요리사","화가","직원","건축가"],"word":"architects","r":{"a":"4) 건축가","ev":"10번 문장","s":[[10,"Many of the rooms are built by famous artists and architects.","많은 객실이 유명한 예술가 및 건축가들에 의해 만들어진다."]],"w":"객실(rooms)을 짓는 사람이에요. 예술가와 함께 객실을 만든다고 했으니 architect = 건축가예요.","c":4},"h":"d022c05151"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nAt Icehotel 365 in Sweden, we can experience one in real life!","ko":"밑줄 친 one이 가리키는 것은?","sko":"스웨덴에 있는 Icehotel 365에서, 우리는 one을 실생활에서 경험할 수 있다!","opts":["영화 겨울왕국","엘사의 마법","스웨덴의 여름","엘사가 만든 얼음성"],"r":{"a":"4) 엘사가 만든 얼음성","ev":"2, 3번 문장","s":[[2,"Elsa made an ice castle with her magic!","Elsa(엘사)는 그녀의 마법으로 얼음성을 만들었다!"],[3,"At Icehotel 365 in Sweden, we can experience one in real life!","스웨덴에 있는 Icehotel(얼음호텔) 365에서, 우리는 얼음성을 실생활에서 경험할 수 있다!"]],"w":"2번에서 엘사가 만든 것은 an ice castle이에요. 3번 one은 그 얼음성이 실제로 있다는 뜻이에요.","c":4},"h":"b1ae9b072d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"And everything in the hotel is made of ice, even the books.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그리고 호텔에 있는 모든 것, 심지어 책까지 얼음으로 만들어진다.","opts":["호텔 안의 모든 것이 얼음으로 만들어지고, 책도 그렇다.","호텔 안의 책만 얼음으로 만들어진다.","호텔에는 얼음으로 만든 것이 하나도 없다.","호텔의 책을 얼음 위에 올려 둔다."],"r":{"a":"1) 호텔 안의 모든 것이 얼음으로 만들어지고, 책도 그렇다.","ev":"11번 문장","s":[[11,"And everything in the hotel is made of ice, even the books.","그리고 호텔에 있는 모든 것, 심지어 책까지 얼음으로 만들어진다."]],"w":"everything ... is made of ice는 모든 것이 얼음으로 만들어진다는 뜻이고, even the books는 '책까지도'예요. 책만이라는 ②는 틀려요.","c":1},"h":"4602ca3b00"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["여름에는 이 호텔에 침실이 50개가 넘는다.","겨울에는 이 호텔의 객실이 50개 넘게 늘어난다.","태양열 발전은 얼음을 녹이는 데 쓰인다.","투숙객은 따뜻한 음료를 직접 가져와야 한다."],"opts":["The hotel has more than fifty bedrooms in summer.","The hotel has more than fifty rooms in winter.","Solar power is used to melt the ice.","Guests must bring their own hot drinks."],"r":{"a":"2) The hotel has more than fifty rooms in winter.","ev":"7~9, 14번 문장","s":[[7,"Solar power prevents the ice from melting.","태양열 발전이 얼음이 녹는 것을 막는다."],[8,"The hotel has eighteen bedrooms, including nine art rooms and nine special rooms in summer.","여름에 이 호텔에는 예술실 9개와 특실 9개를 포함해 18개의 침실이 있다."],[9,"In winter, the total number of rooms increases to more than fifty.","겨울에 총 객실 수는 50개 넘게 늘어난다."],[14,"Also, the hotel staff prepares hot drinks for the guests.","또한 호텔 직원이 투숙객을 위해 따뜻한 음료를 준비해 준다."]],"w":"9번에서 겨울에 객실이 50개 넘게 늘어나요. 여름에는 18개이고(8번), 태양열은 얼음이 녹는 것을 막으며(7번), 음료는 직원이 준비해 줘요(14번).","c":2},"h":"d047e207e7"},{"n":9,"t":"sum","q":"In summer, the hotel has (A) bedrooms, including nine art rooms and nine (B) rooms.","ko":"여름에 이 호텔에는 예술실 9개와 (B)실 9개를 포함해 (A)개의 침실이 있다.","oko":["(A) 18 / (B) 특","(A) 50 / (B) 특","(A) 18 / (B) 뜨거운","(A) 9 / (B) 차가운","(A) 50 / (B) 여름"],"opts":["(A) eighteen / (B) special","(A) fifty / (B) special","(A) eighteen / (B) hot","(A) nine / (B) cold","(A) fifty / (B) summer"],"r":{"a":"1) (A) eighteen / (B) special ((A) 18 / (B) 특)","ev":"8번 문장","s":[[8,"The hotel has eighteen bedrooms, including nine art rooms and nine special rooms in summer.","여름에 이 호텔에는 예술실 9개와 특실 9개를 포함해 18개의 침실이 있다."]],"w":"8번 문장에서 eighteen bedrooms(18개의 침실), nine art rooms and nine special rooms(예술실 9개와 특실 9개)라고 했어요.","c":1},"h":"3bf3f55b80"},{"n":10,"t":"fill","q":"Animal furs will [A] you warm, and the hotel staff [B] hot drinks for the guests.","ko":"동물의 모피 제품이 당신을 따뜻하게 [A], 호텔 직원은 투숙객을 위해 따뜻한 음료를 [B].","bank":["keep","prepares","melt","climb","increase","built"],"bko":{"keep":"유지하다","prepares":"준비한다","melt":"녹다","climb":"오르다","built":"지어진","increase":"늘어나다"},"r":{"a":"[A] keep (유지하다), [B] prepares (준비한다)","ev":"13, 14번 문장","s":[[13,"Animal furs will keep you warm when you sleep.","동물의 모피 제품이 당신이 잘 때 따뜻하게 해 줄 것이다."],[14,"Also, the hotel staff prepares hot drinks for the guests.","또한 호텔 직원이 투숙객을 위해 따뜻한 음료를 준비해 준다."]],"w":"13번 will keep you warm, 14번 prepares hot drinks에서 가져왔어요. melt는 얼음 이야기(7번), increase는 객실 수(9번), climb는 얼음 계단(4번), built는 객실을 짓는 이야기(10번)에서 나온 말이라 알맞지 않아요.","c":null},"h":"0af28ce1a3"}]},{"u":7,"id":"nl1-07-4","no":4,"ko":"혼잣말의 긍정적 효과","items":[{"n":1,"t":"tf","q":"When we make a mistake, we may say something to ourselves.","ko":"우리는 실수를 할 때 스스로에게 무언가를 말하기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When we make a mistake, we may say to ourselves, “Oh no! What did I do?”","우리는 실수를 할 때 우리 자신에게 “세상에! 내가 뭘 한 거지?”라고 말하기도 한다."]],"w":"3번 문장에 실수를 할 때 우리 자신에게 말하기도 한다고 나와요.","c":"T"},"h":"3116479280"},{"n":2,"t":"tf","q":"Talking to ourselves is a strange thing to do.","ko":"혼잣말을 하는 것은 이상한 일이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Talking to ourselves is not strange.","혼잣말을 하는 것은 이상한 일이 아니다."]],"w":"7번 문장에서 혼잣말은 not strange, 즉 이상하지 않다고 해요. 정반대예요.","c":"F"},"h":"b74b4b75fb"},{"n":3,"t":"tf","q":"When we play sports, we may shout to ourselves.","ko":"우리는 운동 경기를 할 때 스스로에게 외치기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"When we play sports, we may shout to ourselves, “All right!” or “I did it!”","운동 경기를 할 때 우리 자신에게 “좋아!” 또는 “해냈어!”라고 외치기도 한다."]],"w":"10번 문장에 운동 경기를 할 때 '좋아!' 또는 '해냈어!'라고 외치기도 한다고 나와요.","c":"T"},"h":"0ef78ec34f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...what's the best way to solve this?)","ko":"...이것을 solve하는 최선의 방법이 뭘까?","opts":["해결하다","설명하다","피하다","질문하다"],"word":"solve","r":{"a":"1) 해결하다","ev":"9번 문장","s":[[9,"For example, when we think deeply about a problem, we may say, “Hmm... what’s the best way to solve this?”","예를 들어, 우리는 어떤 문제에 대해 깊이 생각할 때 “음… 이것을 해결하는 최선의 방법이 뭘까?”라고 말하기도 한다."]],"w":"문제를 깊이 생각할 때 하는 말이에요. 최선의 방법을 찾는 것이니 solve = 해결하다예요.","c":1},"h":"2dc9814f8c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Talking to ourselves is not strange.)","ko":"혼잣말을 하는 것은 strange하지 않다.","opts":["위험한","이상한","어려운","부끄러운"],"word":"strange","r":{"a":"2) 이상한","ev":"5, 7번 문장","s":[[5,"Do you feel bad about doing this or worry that other people think you’re strange?","이렇게 하는 것이 마음에 걸리거나 다른 사람들이 당신을 이상하다고 생각할까 봐 걱정이 되는가?"],[7,"Talking to ourselves is not strange.","혼잣말을 하는 것은 이상한 일이 아니다."]],"w":"5번에서 다른 사람들이 나를 strange하다고 생각할까 봐 걱정하는 상황이 나오고, 7번에서 혼잣말은 not strange라고 해요. strange = 이상한이에요.","c":2},"h":"6bef28327f"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen you hear new information, repeat it to yourself instead of writing it down.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"새로운 정보를 들을 때 그것을 받아 적는 대신 자신에게 반복해서 말해 보아라.","opts":["새로운 정보","혼잣말","실수","큰 소리"],"r":{"a":"1) 새로운 정보","ev":"13번 문장","s":[[13,"When you hear new information, repeat it to yourself instead of writing it down.","새로운 정보를 들을 때 그것을 받아 적는 대신 자신에게 반복해서 말해 보아라."]],"w":"13번 문장에서 repeat it to yourself의 it은 앞에 나온 new information(새로운 정보)을 가리켜요.","c":1,"k":"it = 새로운 정보"},"pron":"it","h":"6f2200c659"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So the next time you talk to yourself, don't feel like you're doing something wrong.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러니 다음 번에 혼잣말을 하게 되면 뭔가 잘못하고 있다고 느끼지 마라.","opts":["혼잣말을 하게 되면 다음부터는 하지 마라.","혼잣말은 잘못하고 있다는 신호이다.","혼잣말을 할 때는 더 큰 소리로 해야 한다.","혼잣말을 해도 잘못하고 있다고 느낄 필요가 없다."],"r":{"a":"4) 혼잣말을 해도 잘못하고 있다고 느낄 필요가 없다.","ev":"15번 문장","s":[[15,"So the next time you talk to yourself, don’t feel like you’re doing something wrong.","그러니 다음 번에 혼잣말을 하게 되면 뭔가 잘못하고 있다고 느끼지 마라."]],"w":"don't feel like ~는 '~라고 느끼지 마라'예요. 혼잣말을 해도 뭔가 잘못하는 것이 아니니 걱정하지 말라는 ④예요.","c":4},"h":"69aceb7435"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대부분의 사람들은 혼잣말을 한다.","새 정보는 받아 적는 것이 반복해서 말하는 것보다 낫다.","운동 경기를 할 때는 스스로에게 말하면 안 된다.","혼잣말은 심각한 문제의 신호이다."],"opts":["Most people talk to themselves.","Writing down new information is better than repeating it.","We should not talk to ourselves when we play sports.","Talking to ourselves is a sign of a serious problem."],"r":{"a":"1) Most people talk to themselves. (대부분의 사람들은 혼잣말을 한다.)","ev":"7~8번 문장","s":[[7,"Talking to ourselves is not strange.","혼잣말을 하는 것은 이상한 일이 아니다."],[8,"In fact, most people do it.","사실, 대부분의 사람들이 그렇게 한다."]],"w":"8번 문장에서 most people do it(대부분의 사람들이 그렇게 한다), 즉 혼잣말을 한다고 했어요.","c":1},"h":"1a2728dba2"},{"n":9,"t":"sum","q":"Repeating new information to yourself helps you (A) and (B) it.","ko":"새 정보를 자신에게 반복해서 말하면 그것을 (A)하고 (B)하는 데 도움이 된다.","oko":["(A) 이해 / (B) 기억","(A) 이해 / (B) 망각","(A) 무시 / (B) 기억","(A) 망각 / (B) 망각","(A) 필기 / (B) 망각"],"opts":["(A) understand / (B) remember","(A) understand / (B) forget","(A) ignore / (B) remember","(A) forget / (B) forget","(A) write / (B) forget"],"r":{"a":"1) (A) understand / (B) remember ((A) 이해 / (B) 기억)","ev":"14번 문장","s":[[14,"This will help you to understand and remember it.","이것은 당신이 그것을 이해하고 기억하는 데 도움이 될 것이다."]],"w":"14번 문장에서 This will help you to understand and remember it. 이해하고(understand) 기억하는(remember) 데 도움이 돼요.","c":1},"h":"1ee364bac1"},{"n":10,"t":"fill","q":"Talking to ourselves helps us [A] on our work and [B] ourselves to try again when we fail.","ko":"혼잣말은 우리가 일에 [A], 실패했을 때 다시 시도하도록 우리 자신을 [B] 데 도움이 된다.","bank":["concentrate","encourage","shout","solve","hear","worry"],"bko":{"concentrate":"집중하다","encourage":"격려하다","shout":"외치다","solve":"해결하다","worry":"걱정하다","hear":"듣다"},"r":{"a":"[A] concentrate (집중하다), [B] encourage (격려하다)","ev":"11번 문장","s":[[11,"Talking to ourselves helps us concentrate on our work and encourage ourselves to try again when we fail.","혼잣말은 우리가 일에 집중하게 하고, 실패했을 때에는 우리 자신이 다시 시도하도록 격려하는 데 도움이 된다."]],"w":"11번 helps us concentrate on our work and encourage ourselves to try again에서 가져왔어요. solve와 shout는 9~10번의 예에서, worry는 5번에서 나온 말이라 알맞지 않아요.","c":null},"h":"a5791e8c29"}]},{"u":8,"id":"nl1-08-1","no":1,"ko":"그냥 편식이 아니란 말야!","items":[{"n":1,"t":"tf","q":"Some people say that cucumbers taste bitter.","ko":"어떤 사람들은 오이가 쓴맛이 난다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They say cucumbers actually taste bitter.","그들은 오이가 실제로 쓴맛이 난다고 말한다."]],"w":"2번 문장에서 그들(오이를 싫어하는 사람들)이 오이가 실제로 쓴맛이 난다고 말한다고 해요.","c":"T"},"h":"e5600910ac"},{"n":2,"t":"tf","q":"In the past, many people believed that the reason was genetic.","ko":"과거에는 많은 사람들이 그 이유가 유전적이라고 믿었다.","r":{"a":"F (본문과 다른 내용)","ev":"3, 4번 문장","s":[[3,"In the past, many people believed that there were psychological reasons for this.","과거에는 많은 사람들이 이에 대해 심리적인 이유가 있다고 믿었다."],[4,"However, scientists say that the cause is genetic.","그러나 과학자들은 그 원인이 유전적인 것이라고 말한다."]],"w":"3번에서 과거에 많은 사람들이 믿은 것은 심리적인 이유예요. 유전적이라고 말하는 것은 과학자들이에요(4번).","c":"F"},"h":"b63466a451"},{"n":3,"t":"tf","q":"People with the TAS2R38 gene also find watermelon bitter.","ko":"TAS2R38 유전자를 가진 사람들은 수박도 쓰다고 여긴다.","r":{"a":"T (본문과 맞는 내용)","ev":"5, 6번 문장","s":[[5,"Cucumbers have certain things that only people with a gene called TAS2R38 can taste.","오이는 TAS2R38이라 불리는 유전자를 가진 사람만이 맛볼 수 있는 특정한 것들을 가진다."],[6,"These people also find some other foods bitter, including watermelon.","이러한 사람들은 또한 수박을 비롯한 몇몇 다른 음식들도 쓴맛이 난다고 여긴다."]],"w":"6번 문장의 These people은 5번의 TAS2R38 유전자를 가진 사람들이고, 이들은 수박을 비롯한 음식들도 쓰다고 여겨요.","c":"T"},"h":"0d5552e2f1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They say cucumbers actually taste bitter.)","ko":"그들은 오이가 실제로 bitter한 맛이 난다고 말한다.","opts":["단","쓴","짠","매운"],"word":"bitter","r":{"a":"2) 쓴","ev":"1, 2번 문장","s":[[1,"Some people hate the taste of cucumbers.","어떤 사람들은 오이의 맛을 싫어한다."],[2,"They say cucumbers actually taste bitter.","그들은 오이가 실제로 쓴맛이 난다고 말한다."]],"w":"1번에서 오이 맛을 싫어한다고 했고, 2번에서 그 이유로 bitter한 맛이 난다고 해요. 싫어하는 이유가 되는 맛이므로 bitter = (맛이) 쓴이에요.","c":2},"h":"10bccb9c95"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, scientists say that the cause is genetic.)","ko":"그러나 과학자들은 그 원인이 genetic이라고 말한다.","opts":["유전적인","심리적인","환경적인","인위적인"],"word":"genetic","r":{"a":"1) 유전적인","ev":"3~5번 문장","s":[[3,"In the past, many people believed that there were psychological reasons for this.","과거에는 많은 사람들이 이에 대해 심리적인 이유가 있다고 믿었다."],[4,"However, scientists say that the cause is genetic.","그러나 과학자들은 그 원인이 유전적인 것이라고 말한다."],[5,"Cucumbers have certain things that only people with a gene called TAS2R38 can taste.","오이는 TAS2R38이라 불리는 유전자를 가진 사람만이 맛볼 수 있는 특정한 것들을 가진다."]],"w":"3번에서 과거에는 심리적(psychological) 이유라고 믿었지만 However 뒤의 genetic은 반대되는 설명이에요. 5번에서 유전자(gene)가 나오므로 genetic = 유전적인이에요.","c":1},"h":"62f4a75865"},{"n":6,"t":"ref","q":"What does the underlined \"These people\" refer to?\nThese people also find some other foods bitter, including watermelon.","ko":"밑줄 친 These people이 가리키는 것은?","sko":"이러한 사람들은 또한 수박을 비롯한 몇몇 다른 음식들도 쓴맛이 난다고 여긴다.","opts":["오이를 싫어하는 모든 사람","과학자들","TAS2R38 유전자를 가진 사람들","수박을 좋아하는 사람들"],"r":{"a":"3) TAS2R38 유전자를 가진 사람들","ev":"5, 6번 문장","s":[[5,"Cucumbers have certain things that only people with a gene called TAS2R38 can taste.","오이는 TAS2R38이라 불리는 유전자를 가진 사람만이 맛볼 수 있는 특정한 것들을 가진다."],[6,"These people also find some other foods bitter, including watermelon.","이러한 사람들은 또한 수박을 비롯한 몇몇 다른 음식들도 쓴맛이 난다고 여긴다."]],"w":"5번에서 TAS2R38이라는 유전자를 가진 사람만 오이의 그 맛을 볼 수 있다고 했어요. 6번의 These people이 그 사람들이에요.","c":3},"h":"b7e36438c0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Some people hate the taste of cucumbers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"어떤 사람들은 오이의 맛을 싫어한다.","opts":["어떤 사람들은 오이의 맛을 아주 싫어한다.","모든 사람이 오이의 맛을 좋아한다.","어떤 사람들은 오이를 파는 일을 싫어한다.","오이는 어떤 사람들에게 팔리지 않는다."],"r":{"a":"1) 어떤 사람들은 오이의 맛을 아주 싫어한다.","ev":"1번 문장","s":[[1,"Some people hate the taste of cucumbers.","어떤 사람들은 오이의 맛을 싫어한다."]],"w":"1번 문장에서 hate the taste of cucumbers는 ‘오이의 맛을 싫어하다’예요.","c":1},"h":"f63ed2d56a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["누구나 오이에서 쓴 것을 맛볼 수 있다.","TAS2R38 유전자를 가진 사람만 오이의 특정한 것들을 맛볼 수 있다.","오이는 그 유전자를 가진 사람에게는 달게 느껴진다.","오이의 쓴맛은 수박에서 나온다."],"opts":["Everyone can taste the bitter thing in cucumbers.","Only people with the TAS2R38 gene can taste certain things in cucumbers.","Cucumbers taste sweet to people with the gene.","The bitter taste of cucumbers comes from watermelon."],"r":{"a":"2) Only people with the TAS2R38 gene can taste certain things in cucumbers. (TAS2R38 유전자를 가진 사람만 오이의 특정한 것들을 맛볼 수 있다.)","ev":"5번 문장","s":[[5,"Cucumbers have certain things that only people with a gene called TAS2R38 can taste.","오이는 TAS2R38이라 불리는 유전자를 가진 사람만이 맛볼 수 있는 특정한 것들을 가진다."]],"w":"5번 문장에서 only people with a gene called TAS2R38 can taste라고 했어요.","c":2},"h":"3705d9d5d3"},{"n":9,"t":"sum","q":"As the gene (A) more, these foods taste (B).","ko":"그 유전자가 (A)수록 이 음식들의 맛은 (B).","oko":["(A) 발달할 / (B) 더 나빠진다","(A) 발달할 / (B) 더 좋아진다","(A) 줄어들 / (B) 더 나빠진다","(A) 잠잘 / (B) 더 좋아진다","(A) 숨을 / (B) 더 달아진다"],"opts":["(A) develops / (B) worse","(A) develops / (B) better","(A) shrinks / (B) worse","(A) sleeps / (B) better","(A) hides / (B) sweeter"],"r":{"a":"1) (A) develops / (B) worse ((A) 발달할 / (B) 더 나빠진다)","ev":"7번 문장","s":[[7,"The more the gene develops, the worse these foods taste.","그 유전자가 더 발달할수록, 이 음식들의 맛은 더 나빠진다."]],"w":"7번 문장 The more the gene develops, the worse these foods taste. 유전자가 발달할수록(develops) 맛이 더 나빠져요(worse).","c":1},"h":"3eb363108e"},{"n":10,"t":"fill","q":"Scientists now [A] these people “[B].”","ko":"과학자들은 이제 이러한 사람들을 ‘[B]’(이)라고 [A].","bank":["call","supertasters","hate","believe","cause","find"],"bko":{"call":"부르다","supertasters":"미각이 뛰어난 사람들","hate":"싫어하다","believe":"믿다","cause":"일으키다","find":"여기다"},"r":{"a":"[A] call (부르다), [B] supertasters (미각이 뛰어난 사람들)","ev":"8번 문장","s":[[8,"Scientists now call these people “supertasters.”","과학자들은 이제 이러한 사람들을 ‘미각이 뛰어난 사람’이라 부른다."]],"w":"8번 문장에서 가져왔어요. call A “B”는 ‘A를 B라고 부르다’예요.","c":null},"h":"21e34cfefd"}]},{"u":8,"id":"nl1-08-2","no":2,"ko":"지상에서는 분명 맛있었는데?","items":[{"n":1,"t":"tf","q":"People often complain that airplane food doesn't taste good.","ko":"사람들은 종종 기내식이 맛있지 않다고 불평한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They often complain that the food doesn’t taste good.","그들은 종종 (기내에서 먹는) 음식이 맛있지 않다고 불평한다."]],"w":"2번 문장에서 사람들이 음식이 맛있지 않다고 종종 불평한다고 해요.","c":"T"},"h":"1d080fb175"},{"n":2,"t":"tf","q":"The air in a flying plane is very wet.","ko":"운항 중인 비행기 안의 공기는 매우 습하다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"First, the air in a flying plane is very dry, and the air pressure is low.","첫째로, 운항 중인 비행기 안의 공기는 매우 건조하고 기압이 낮다."]],"w":"5번 문장에서 비행기 안의 공기는 매우 건조하고(dry) 기압이 낮다고 해요. wet은 반대예요.","c":"F"},"h":"33948cfbbd"},{"n":3,"t":"tf","q":"The bad taste of airplane food is not the airlines' fault.","ko":"기내식이 맛없는 것은 항공사의 잘못이 아니다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But it’s not the airlines’ fault!","그러나 그것은 항공사의 잘못이 아니다!"]],"w":"3번 문장 But it's not the airlines' fault!가 그대로 이 내용이에요.","c":"T"},"h":"41d498e2c2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They often complain that the food doesn't taste good.)","ko":"그들은 종종 음식이 맛있지 않다고 complain한다.","opts":["감사하다","칭찬하다","불평하다","주문하다"],"word":"complain","r":{"a":"3) 불평하다","ev":"2, 3번 문장","s":[[2,"They often complain that the food doesn’t taste good.","그들은 종종 (기내에서 먹는) 음식이 맛있지 않다고 불평한다."],[3,"But it’s not the airlines’ fault!","그러나 그것은 항공사의 잘못이 아니다!"]],"w":"음식이 맛이 없다고 말하는 상황이고, 3번에서 항공사의 잘못이 아니라고 이어져요. complain = 불평하다예요.","c":3},"h":"e8308511cc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...there is one kind of taste that isn't affected by noise—umami.)","ko":"...소음에 affected되지 않는 한 가지 맛이 있는데, 바로 감칠맛이다.","opts":["영향을 받는","도움을 받는","방해하는","차가워진"],"word":"affected","r":{"a":"1) 영향을 받는","ev":"8, 9번 문장","s":[[8,"Studies show that food tastes less salty or sweet when it is eaten in a noisy place.","연구는 음식이 시끄러운 장소에서 섭취될 때 음식 맛이 덜 짜고 덜 달다는 것을 보여 준다."],[9,"Interestingly, there is one kind of taste that isn’t affected by noise—umami.","흥미롭게도, 소음에 영향을 받지 않는 한 가지 맛이 있는데, 바로 감칠맛이다."]],"w":"affect는 '영향을 미치다'라서 affected는 '영향을 받는'이에요. 8번에서 시끄러운 곳에서는 맛이 덜 짜고 덜 달게 느껴진다고 했고, 9번은 감칠맛만은 소음의 영향을 받지 않는다는 말이에요.","c":1},"h":"dce4123b8e"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nBecause of this, people can't taste or smell their food well.","ko":"밑줄 친 this가 가리키는 것은?","sko":"이 때문에 사람들은 그들의 음식을 제대로 맛보거나 냄새를 맡지 못한다.","opts":["비행기가 시끄러운 것","운항 중인 비행기 안의 공기가 매우 건조하고 기압이 낮은 것","항공사의 잘못","음식이 너무 짠 것"],"r":{"a":"2) 운항 중인 비행기 안의 공기가 매우 건조하고 기압이 낮은 것","ev":"5, 6번 문장","s":[[5,"First, the air in a flying plane is very dry, and the air pressure is low.","첫째로, 운항 중인 비행기 안의 공기는 매우 건조하고 기압이 낮다."],[6,"Because of this, people can’t taste or smell their food well.","이 때문에 사람들은 그들의 음식을 제대로 맛보거나 냄새를 맡지 못한다."]],"w":"6번 바로 앞 5번에서 공기가 매우 건조하고 기압이 낮다고 했어요. Because of this는 그 때문에라는 뜻이에요. 소음은 7번에서 따로 나와요.","c":2},"h":"6bc65a13ab"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Studies show that food tastes less salty or sweet when it is eaten in a noisy place.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"연구는 음식이 시끄러운 장소에서 섭취될 때 음식 맛이 덜 짜고 덜 달다는 것을 보여 준다.","opts":["시끄러운 곳에서 먹는 음식은 더 짜고 더 달게 느껴진다.","조용한 곳에서 먹는 음식은 덜 짜고 덜 달게 느껴진다.","연구에 따르면 소음은 음식의 맛과 관계가 없다.","시끄러운 곳에서 먹으면 음식이 덜 짜고 덜 달게 느껴진다."],"r":{"a":"4) 시끄러운 곳에서 먹으면 음식이 덜 짜고 덜 달게 느껴진다.","ev":"8번 문장","s":[[8,"Studies show that food tastes less salty or sweet when it is eaten in a noisy place.","연구는 음식이 시끄러운 장소에서 섭취될 때 음식 맛이 덜 짜고 덜 달다는 것을 보여 준다."]],"w":"less salty or sweet은 덜 짜거나 덜 달다는 뜻이고, in a noisy place는 시끄러운 곳이에요. 그래서 시끄러운 곳에서는 맛이 덜 느껴지는 ④예요.","c":4},"h":"9e6992ad86"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["기내식이 맛없는 것은 항공사의 실수 때문이다.","건조한 공기는 사람들이 음식을 더 잘 맛보게 도와준다.","소음은 음식을 더 짜고 더 달게 만든다.","항공사 주방장들은 감칠맛이 강한 음식을 자주 사용한다."],"opts":["Airplane food tastes bad because of the airlines' mistakes.","Dry air helps people taste their food better.","Noise makes food taste saltier and sweeter.","Airline chefs often use foods that have a strong umami flavor."],"r":{"a":"4) Airline chefs often use foods that have a strong umami flavor.","ev":"3, 5, 8, 10번 문장","s":[[3,"But it’s not the airlines’ fault!","그러나 그것은 항공사의 잘못이 아니다!"],[5,"First, the air in a flying plane is very dry, and the air pressure is low.","첫째로, 운항 중인 비행기 안의 공기는 매우 건조하고 기압이 낮다."],[8,"Studies show that food tastes less salty or sweet when it is eaten in a noisy place.","연구는 음식이 시끄러운 장소에서 섭취될 때 음식 맛이 덜 짜고 덜 달다는 것을 보여 준다."],[10,"For this reason, airline chefs often use foods that have a strong umami flavor, such as seaweed and mushrooms.","이런 이유로, 항공사 주방장들은 해초나 버섯과 같이 감칠맛이 강한 음식을 자주 사용한다."]],"w":"10번에서 항공사 주방장들이 감칠맛이 강한 음식을 자주 쓴다고 해요. 항공사의 잘못이 아니고(3번), 건조한 공기는 맛을 못 느끼게 하고(5~6번), 소음은 덜 짜고 덜 달게 느끼게 해요(8번).","c":4},"h":"68dc330aa9"},{"n":9,"t":"sum","q":"(A) people enjoy (B) on airplanes.","ko":"기내에서 (B)을(를) 즐기는 사람은 (A).","oko":["(A) 거의 없다 / (B) 먹는 것","(A) 많다 / (B) 먹는 것","(A) 거의 없다 / (B) 잠자는 것","(A) 많다 / (B) 잠자는 것","(A) 거의 없다 / (B) 요리하는 것"],"opts":["(A) few / (B) eating","(A) many / (B) eating","(A) few / (B) sleeping","(A) many / (B) sleeping","(A) few / (B) cooking"],"r":{"a":"1) (A) few / (B) eating ((A) 거의 없다 / (B) 먹는 것)","ev":"1번 문장","s":[[1,"Few people enjoy eating on airplanes.","기내에서 먹는 것을 즐기는 사람은 거의 없다."]],"w":"1번 문장 Few people enjoy eating on airplanes. 기내에서 먹는 것을 즐기는 사람은 거의 없어요(few).","c":1},"h":"125310ea48"},{"n":10,"t":"fill","q":"There are actually [A] reasons for this [B].","ko":"이 [B]에는 사실 [A] 이유들이 있다.","bank":["scientific","problem","seaweed","noisy","salty","chefs"],"bko":{"scientific":"과학적인","problem":"문제","seaweed":"해초","noisy":"시끄러운","salty":"짠","chefs":"주방장들"},"r":{"a":"[A] scientific (과학적인), [B] problem (문제)","ev":"4번 문장","s":[[4,"There are actually scientific reasons for this problem.","이 문제에는 사실 과학적인 이유들이 있다."]],"w":"4번 문장에서 가져왔어요. scientific reasons(과학적인 이유들), this problem(이 문제).","c":null},"h":"da5346029a"}]},{"u":8,"id":"nl1-08-3","no":3,"ko":"3.14159265358 ...","items":[{"n":1,"t":"tf","q":"Pi Day is celebrated on M okes","fun","machine","pet","ears","expect"],"bko":{"jokes":"농담","fun":"재미","machine":"기계","pet":"애완동물","ears":"귀","expect":"기대하다"},"r":{"a":"[A] jokes (농담), [B] fun (재미)","ev":"8번 문장","s":[[8,"“I don’t think that rats tell jokes. But they clearly like to have fun and laugh,” said one of the scientists.","“쥐가 농담을 한다고 생각하지는 않아요. 하지만 그들은 분명히 즐겁게 놀면서 웃는 것을 좋아해요.”라고 과학자 중 한 명이 말했다."]],"w":"8번 문장에서 가져왔어요. tell jokes(농담을 하다), have fun(재미있게 놀다).","c":null},"h":"1ac9099c9b"}]},{"u":9,"id":"nl1-09-1","no":1,"ko":"쿠키 맛이 왜 이래?","items":[{"n":1,"t":"tf","q":"The smog meringue cookies are made with real smog from large cities.","ko":"스모그 머랭 쿠키는 대도시의 실제 스모그로 만들어진다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Bakers mix real smog from large cities with sugar and eggs.","제빵사들은 대도시의 실제 스모그를 설탕과 달걀과 섞는다."]],"w":"5번 문장에서 제빵사들이 대도시의 실제 스모그를 설탕, 달걀과 섞는다고 해요(Bakers mix real smog from large cities with sugar and eggs). 본문과 같아요.","c":"T"},"h":"07c1d9a5c6"},{"n":2,"t":"tf","q":"The purpose of the cookies is to give people a new recipe.","ko":"그 쿠키의 목적은 사람들에게 새 조리법을 알려 주는 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The purpose of the cookies is to make people think about the dirty air they breathe every day.","그 쿠키의 목적은 사람들이 매일 들이마시는 더러운 공기에 대해 생각해 보도록 하는 것이다."]],"w":"7번 문장에서 쿠키의 목적은 사람들이 매일 들이마시는 더러운 공기에 대해 생각해 보게 하는 거예요. 조리법을 알려 주는 것이 아니에요.","c":"F"},"h":"1dcfb5e0db"},{"n":3,"t":"tf","q":"It is harder to ignore air pollution when it is in a cookie.","ko":"대기 오염이 쿠키 속에 있을 때는 무시하기 더 어렵다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"But it is harder to ignore it when it is in a cookie.","하지만 그것이 쿠키 속에 있을 때는 무시하기가 더 어렵다."]],"w":"9번 문장에서 대기 오염이 쿠키 속에 있을 때는 무시하기가 더 어렵다고 해요(it is harder to ignore it when it is in a cookie).","c":"T"},"h":"0d737b0533"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Each cookie has the unique flavor of a different city, ...)","ko":"각각의 쿠키는 도시 별로 독특한 맛을 지니고 있다, ...","opts":["독특한","흔한","값싼","오래된"],"word":"unique","r":{"a":"1) 독특한 지 말라고 한 뒤(11번) 위나 아래를 보라고 해요. 크게 돌리는 게 아니라 slightly = 약간이에요.","c":1},"h":"cca2d5029e"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey cannot show depth, so round shapes look smaller and flatter.","ko":"밑줄 친 They가 가리키는 것은?","sko":"사진은 깊이를 보여 줄 수 없어서 둥근 형태는 더 작고 더 납작해 보인다.","opts":["둥근 형태들","사진들","사람들의 눈","우리 모두"],"r":{"a":"2) 사진들","ev":"6~7번 문장","s":[[6,"However, photos only show things in two dimensions.","하지만 사진은 사물을 2차원으로만 보여 준다."],[7,"They cannot show depth, so round shapes look smaller and flatter.","사진은 깊이를 보여 줄 수 없어서 둥근 형태는 더 작고 더 납작해 보인다."]],"w":"깊이를 보여 주지 못하는 것은 사진이에요. 6번에서 사진(photos)이 2차원으로만 보여 준다고 했고, 7번에서 그 photos를 They로 받았어요.","c":2},"h":"6b43963b4b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In addition, your face also looks flatter than it is.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"게다가 당신의 얼굴 또한 실제보다 더 납작하게 보인다.","opts":["당신의 얼굴은 실제로 매우 납작하다.","당신의 얼굴은 사진에서 더 둥글어 보인다.","당신의 얼굴은 눈보다 더 크게 보인다.","당신의 얼굴도 실제보다 더 납작해 보인다."],"r":{"a":"4) 당신의 얼굴도 실제보다 더 납작해 보인다.","ev":"9번 문장","s":[[9,"In addition, your face also looks flatter than it is.","게다가 당신의 얼굴 또한 실제보다 더 납작하게 보인다."]],"w":"flatter than it is는 실제(it is flat)보다 더 납작하다는 뜻이에요. 얼굴도 눈처럼 사진에서는 실제보다 납작하게 보여요.","c":4},"h":"b2775fd88b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사람들은 종종 자신이 사진에서 이상하게 보인다고 생각한다.","사진에서 둥근 형태는 더 크고 더 둥글게 보인다.","사진 속 눈은 실제보다 더 크다.","카메라를 똑바로 보면 더 3차원적으로 보인다."],"opts":["People often think they look strange in photos.","In photos, round shapes look bigger and rounder.","Your eyes in photos are bigger than in real life.","Looking right at the camera makes you look more three dimensional."],"r":{"a":"1) People often think they look strange in photos.","ev":"2, 7, 8, 11, 13번 문장","s":[[2,"Often, people think they look strange in photos.","종종 사람들은 자신들이 사진에서 이상하게 보인다고 생각한다."],[7,"They cannot show depth, so round shapes look smaller and flatter.","사진은 깊이를 보여 줄 수 없어서 둥근 형태는 더 작고 더 납작해 보인다."],[8,"Therefore, your “flat” eyes in photos are only 70 to 80 percent of the size of your round eyes in real life.","그래서 사진 속 당신의 ‘납작한’ 눈은 실제 당신의 둥근 눈 크기의 70~80퍼센트밖에 되지 않는다."],[11,"When you take a picture, try not to look right at the camera.","사진을 찍을 때, 카메라를 똑바로 보지 않도록 해라."],[13,"Then you will look more three dimensional.","그러면 당신은 더 3차원적으로 보일 것이다."]],"w":"2번에서 사람들은 사진에서 이상하게 보인다고 생각해요. 둥근 형태는 더 작고 납작해 보이고(7번), 눈은 실제의 70~80퍼센트(8번)이며, 3차원적으로 보이려면 카메라를 똑바로 보지 말아야 해요(11, 13번).","c":1},"h":"e6946bb87f"},{"n":9,"t":"sum","q":"Do you (A) the way you look in (B)?","ko":"당신은 (B)에 나오는 자신의 모습을 (A)는가?","oko":["(A) 좋아하 / (B) 사진","(A) 싫어하 / (B) 사진","(A) 좋아하 / (B) 그림","(A) 싫어하 / (B) 거울","(A) 사랑하 / (B) 그림"],"opts":["(A) like / (B) photographs","(A) hate / (B) photographs","(A) like / (B) paintings","(A) hate / (B) mirrors","(A) love / (B) paintings"],"r":{"a":"1) (A) like / (B) photographs ((A) 좋아하 / (B) 사진)","ev":"1번 문장","s":[[1,"Do you like the way you look in photographs?","사진에 나오는 당신의 모습이 마음에 드는가?"]],"w":"1번 문장 Do you like the way you look in photographs? 사진(photographs)에 나오는 모습을 좋아하는지(like) 묻고 있어요.","c":1},"h":"a26e975a42"},{"n":10,"t":"fill","q":"But there is an [A] way to make your photos look [B].","ko":"하지만 당신의 사진을 더 [B] 보이게 하는 [A] 방법이 있다.","bank":["easy","better","depth","camera","dimensions","percent"],"bko":{"easy":"쉬운","better":"더 나아(좋아)","depth":"깊이","camera":"카메라","dimensions":"차원","percent":"퍼센트"},"r":{"a":"[A] easy (쉬운), [B] better (더 나아(좋아))","ev":"10번 문장","s":[[10,"But there is an easy way to make your photos look better.","하지만 당신의 사진을 더 나아 보이게 하는 한 가지 쉬운 방법이 있다."]],"w":"10번 문장에서 가져왔어요. an easy way(쉬운 방법), look better(더 나아 보이다).","c":null},"h":"9dc395f9ad"}]},{"u":10,"id":"nl1-10-1","no":1,"ko":"먹을수록 살이 빠지는 비밀","items":[{"n":1,"t":"tf","q":"Carrots and tomatoes are also negative calorie foods.","ko":"당근과 토마토도 네거티브 칼로리 음식이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Carrots, broccoli, strawberries, and tomatoes are also negative calorie foods.","당근, 브로콜리, 딸기, 그리고 토마토 또한 네거티브 칼로리 음식이다."]],"w":"10번 문장에서 당근, 브로콜리, 딸기, 토마토 또한 네거티브 칼로리 음식이라고 해요.","c":"T"},"h":"21ad7b1c40"},{"n":2,"t":"tf","q":"The body burns fewer than five calories to digest celery.","ko":"몸은 셀러리를 소화하는 데 5칼로리보다 적게 태운다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"But the body burns more than five calories to digest it.","그러나 몸은 그것을 소화하기 위해 5칼로리 넘게 태운다."]],"w":"8번 문장에서 몸은 소화하느라 5칼로리보다 더 많이 태운다(burns more than five calories)고 해요. 적게 태운다는 말은 반대예요.","c":"F"},"h":"fa33ef6ac9"},{"n":3,"t":"tf","q":"With negative calorie foods, people can lose weight on a full stomach.","ko":"네거티브 칼로리 음식으로는 배부른 채로 살을 뺄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"With these foods, people can lose weight on a full stomach!","이 음식들로 사람들은 배부른 채 살을 뺄 수 있다!"]],"w":"11번 문장 그대로예요. 이 음식들로 배부른 채 살을 뺄 수 있다고 해요.","c":"T"},"h":"86adafd236"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When people are trying to lose weight, food is a delicious-looking enemy.)","ko":"사람들이 살을 빼려고 애쓸 때, 음식은 맛있어 보이는 적이다.","opts":["친구","적","선생님","가족"],"word":"enemy","r":{"a":"2) 적","ev":"1~2번 문장","s":[[1,"When people are trying to lose weight, food is a delicious-looking enemy.","사람들이 살을 빼려고 애쓸 때, 음식은 맛있어 보이는 적이다."],[2,"But there are some foods that actually help you lose weight!","그러나 실제로 당신이 살 빼는 것을 돕는 몇 가지 음식들이 있다!"]],"w":"살을 빼려는 사람에게 맛있어 보이는 음식은 방해가 되는 존재예요. 2번에서 But으로 반대 이야기를 시작하는 걸 보면 enemy = 적이에요.","c":2},"h":"d057c8ea2d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A stick of uncooked celery contains about five calories.)","ko":"익히지 않은 셀러리 한 대는 약 5칼로리를 포함한다.","opts":["버리다","섞다","팔다","포함하다"],"word":"contains","r":{"a":"4) 포함하다","ev":"6번 문장","s":[[6,"A stick of uncooked celery contains about five calories.","익히지 않은 셀러리 한 대는 약 5칼로리를 포함한다."]],"w":"셀러리 한 대에 약 5칼로리가 들어 있다는 뜻이에요. contain = 포함하다, 들어 있다.","c":4},"h":"47dca3c270"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen you eat a whole stick of it, your body has five more calories.","ko":"밑줄 친 it가 가리키는 것은?","sko":"당신이 셀러리 한 대를 다 먹으면, 당신의 몸은 5칼로리를 더 얻는다.","opts":["셀러리","몸","칼로리","네거티브"],"r":{"a":"1) 셀러리","ev":"6~7번 문장","s":[[6,"A stick of uncooked celery contains about five calories.","익히지 않은 셀러리 한 대는 약 5칼로리를 포함한다."],[7,"When you eat a whole stick of it, your body has five more calories.","당신이 셀러리 한 대를 다 먹으면, 당신의 몸은 5칼로리를 더 얻는다."]],"w":"먹는 것은 셀러리예요. 6번에서 셀러리 한 대를 말했고, 7번의 it은 그 셀러리(celery)를 가리켜요.","c":1},"h":"654b64bc05"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, you actually lose calories overall.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러므로 당신은 사실 전체적으로는 칼로리를 잃는 셈이다.","opts":["그래서 당신은 칼로리를 계속 얻는다.","그래서 당신은 먹을 때만 칼로리를 잃는다.","그래서 당신은 결국 전체로는 칼로리를 잃는다.","그래서 당신은 셀러리를 먹지 않아야 한다."],"r":{"a":"3) 그래서 당신은 결국 전체로는 칼로리를 잃는다.","ev":"9번 문장","s":[[9,"So, you actually lose calories overall.","그러므로 당신은 사실 전체적으로는 칼로리를 잃는 셈이다."]],"w":"overall은 전체적으로라는 뜻이에요. 얻은 칼로리보다 소화에 쓴 칼로리가 많아서(8번) 결국 칼로리가 줄어요.","c":3},"h":"209203a10f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["셀러리 한 대는 약 50칼로리를 포함한다.","셀러리는 네거티브 칼로리 음식의 한 예이다.","모든 음식은 사람들을 살찌게 한다.","셀러리는 몸이 칼로리를 전혀 태우지 않게 한다."],"opts":["A stick of celery contains about fifty calories.","Celery is one example of negative calorie foods.","All foods make people gain weight.","Celery makes your body burn no calories."],"r":{"a":"2) Celery is one example of negative calorie foods. (셀러리는 네거티브 칼로리 음식의 한 예이다.)","ev":"2번, 4~5번 문장","s":[[2,"But there are some foods that actually help you lose weight!","그러나 실제로 당신이 살 빼는 것을 돕는 몇 가지 음식들이 있다!"],[4,"They are called “negative calorie” foods.","그것들은 ‘네거티브 칼로리’ 음식이라 불린다."],[5,"Celery is one example.","셀러리가 한 예이다."]],"w":"4번에서 negative calorie 음식이라 불리고, 5번에서 Celery is one example(셀러리가 한 예)이라고 했어요.","c":2},"h":"39daa3df4a"},{"n":9,"t":"sum","q":"But there are (A) foods that actually (B) you lose weight!","ko":"그러나 실제로 당신이 살 빼는 것을 (B) (A) 음식들이 있다!","oko":["(A) 몇몇 / (B) 돕는","(A) 몇몇 / (B) 막는","(A) 아무 ~도 없는 / (B) 돕는","(A) 몇 안 되는 / (B) 막는","(A) 많은 / (B) 해치는"],"opts":["(A) some / (B) help","(A) some / (B) stop","(A) no / (B) help","(A) few / (B) stop","(A) many / (B) hurt"],"r":{"a":"1) (A) some / (B) help ((A) 몇몇 / (B) 돕는)","ev":"2번 문장","s":[[2,"But there are some foods that actually help you lose weight!","그러나 실제로 당신이 살 빼는 것을 돕는 몇 가지 음식들이 있다!"]],"w":"2번 문장 But there are some foods that actually help you lose weight! 살 빼는 것을 돕는(help) 음식이 있다(some)고 했어요.","c":1},"h":"5ee6a3bd85"},{"n":10,"t":"fill","q":"Negative calorie foods [A] your body to lose calories when you [B] and digest them.","ko":"네거티브 칼로리 음식은 당신이 그것들을 [B] 소화할 때 몸이 칼로리를 잃도록 [A].","bank":["cause","eat","burn","gain","weigh","store"],"bko":{"cause":"~하게 하다","eat":"먹다","burn":"태우다","gain":"얻다","store":"저장하다","weigh":"무게를 재다"},"r":{"a":"[A] cause (~하게 하다), [B] eat (먹다)","ev":"3번 문장","s":[[3,"These foods cause your body to lose calories when you eat and digest them.","이 음식들은 당신이 그것들을 먹고 소화할 때, 당신의 몸이 칼로리를 잃게 한다."]],"w":"3번 These foods cause your body to lose calories when you eat and digest them에서 가져왔어요. gain은 몸이 잃는다는 내용과 반대이고, burn·weigh·store는 [A]나 [B] 자리에 뜻이 맞지 않아요.","c":null},"h":"40857ceb4d"}]},{"u":10,"id":"nl1-10-2","no":2,"ko":"상어의 고된 휴식","items":[{"n":1,"t":"tf","q":"Sharks need time to rest like any other animal.","ko":"상어는 다른 여느 동물처럼 휴식을 취할 시간이 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Sharks need time to rest like any other animal, but their sleep is very different from ours.","상어는 다른 여느 동물들처럼 휴식을 취할 시간이 필요하지만, 그들의 잠은 우리의 잠과 매우 다르다."]],"w":"2번 문장 그대로예요(Sharks need time to rest like any other animal).","c":"T"},"h":"730de568a2"},{"n":2,"t":"tf","q":"Sharks can lie down and close their eyes like humans.","ko":"상어는 인간처럼 누워서 눈을 감을 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Unlike humans, sharks can’t lie down and close their eyes.","인간과 달리, 상어는 누워서 눈을 감을 수 없다."]],"w":"3번 문장에서 인간과 달리(Unlike humans) 상어는 누워서 눈을 감을 수 없다고 해요.","c":"F"},"h":"ac7867aab7"},{"n":3,"t":"tf","q":"Yo-yo swimming is what sharks do when they want to sleep.","ko":"요요 헤엄은 상어가 잠을 자고 싶을 때 하는 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When sharks want to sleep, they do something called yo-yo swimming.","상어가 잠을 자고 싶을 때, 그들은 요요 헤엄이라고 불리는 것을 한다."]],"w":"6번 문장에서 상어가 자고 싶을 때 요요 헤엄이라고 불리는 것을 한다고 해요.","c":"T"},"h":"529628dcf3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If they’re not swimming, they can’t breathe!)","ko":"그들이 헤엄치지 않으면, 그들은 숨을 쉴 수 없다!","opts":["숨을 쉬다","잠을 자다","먹이를 먹다","눈을 감다"],"word":"breathe","r":{"a":"1) 숨을 쉬다","ev":"5번 문장","s":[[5,"If they’re not swimming, they can’t breathe!","그들이 헤엄치지 않으면, 그들은 숨을 쉴 수 없다!"]],"w":"헤엄을 안 치면 어떻게 되는지 말하는 문장이에요. 4번에서 계속 헤엄쳐야 한다고 한 이유가 5번이라서 breathe = 숨을 쉬다예요.","c":1},"h":"9e22112163"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This means that they stop actively swimming and let themselves slowly sink to the bottom of the ocean.)","ko":"이것은 그들이 활발하게 헤엄치기를 멈추고 자신을 바다 밑바닥으로 천천히 가라앉게 하는 것을 의미한다.","opts":["떠오르다","가라앉다","달리다","날아가다"],"word":"sink","r":{"a":"2) 가라앉다","ev":"7번 문장","s":[[7,"This means that they stop actively swimming and let themselves slowly sink to the bottom of the ocean.","이것은 그들이 활발하게 헤엄치기를 멈추고 자신을 바다 밑바닥으로 천천히 가라앉게 하는 것을 의미한다."]],"w":"바다 밑바닥(bottom)으로 천천히 내려간다는 말이에요. 8번의 swim back up(다시 올라오다)과 반대로 sink = 가라앉다예요.","c":2},"h":"994786f825"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis means that they stop actively swimming and let themselves slowly sink to the bottom of the ocean.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 그들이 활발하게 헤엄치기를 멈추고 자신을 바다 밑바닥으로 천천히 가라앉게 하는 것을 의미한다.","opts":["상어가 숨을 쉬는 것","요요 헤엄","상어가 눈을 감는 것","바다 밑바닥"],"r":{"a":"2) 요요 헤엄","ev":"6~7번 문장","s":[[6,"When sharks want to sleep, they do something called yo-yo swimming.","상어가 잠을 자고 싶을 때, 그들은 요요 헤엄이라고 불리는 것을 한다."],[7,"This means that they stop actively swimming and let themselves slowly sink to the bottom of the ocean.","이것은 그들이 활발하게 헤엄치기를 멈추고 자신을 바다 밑바닥으로 천천히 가라앉게 하는 것을 의미한다."]],"w":"This는 바로 앞 6번에서 나온 yo-yo swimming(요요 헤엄)을 가리켜요. 이어서 요요 헤엄이 무슨 뜻인지 설명해요.","c":2},"h":"a965b2e267"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While the sharks are slowly sinking towards the bottom of the ocean, they are able to get some sleep.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"상어가 바다 바닥을 향해 천천히 가라앉는 동안, 잠을 잘 수 있다.","opts":["상어는 바다 바닥에 닿은 뒤에만 잠을 잔다.","상어는 가라앉는 동안 잠을 잘 수 있다.","상어는 수면으로 올라가는 동안 잠을 잔다.","상어는 잠을 자지 않고 계속 가라앉는다."],"r":{"a":"2) 상어는 가라앉는 동안 잠을 잘 수 있다.","ev":"9번 문장","s":[[9,"While the sharks are slowly sinking towards the bottom of the ocean, they are able to get some sleep.","상어가 바다 바닥을 향해 천천히 가라앉는 동안, 잠을 잘 수 있다."]],"w":"While은 ~하는 동안이라는 뜻이에요. 바닥으로 천천히 가라앉는 동안 잠을 잘 수 있다는 내용이에요.","c":2},"h":"a36133a777"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["상어는 움직이지 않고 모래 위에서 잔다.","상어는 가라앉은 뒤 다시 헤엄쳐 올라오고 또 가라앉는다.","상어는 헤엄치지 않고도 숨을 쉴 수 있다.","상어는 수면까지 빠르게 헤엄치는 동안 잔다."],"opts":["Sharks sleep on the sand without moving.","Sharks swim back up after sinking and sink again.","Sharks can breathe without swimming.","Sharks sleep while swimming fast to the surface."],"r":{"a":"2) Sharks swim back up after sinking and sink again.","ev":"5, 8번 문장","s":[[5,"If they’re not swimming, they can’t breathe!","그들이 헤엄치지 않으면, 그들은 숨을 쉴 수 없다!"],[8,"Then they swim back up to the surface and sink back down again.","그러고 나면 그들은 수면으로 다시 헤엄쳐 올라오다가 다시 아래로 가라앉는다."]],"w":"8번에서 상어는 수면으로 다시 헤엄쳐 올라온 뒤 다시 가라앉아요. 헤엄치지 않으면 숨을 쉴 수 없어요(5번).","c":2},"h":"95c33e8425"},{"n":9,"t":"sum","q":"Did you (A) that sharks sleep? They need to (B) swimming.","ko":"상어가 잠을 잔다는 것을 (A)는가? 그들은 헤엄을 (B)해야 한다.","oko":["(A) 알고 있었 / (B) 계속","(A) 알고 있었 / (B) 멈춰","(A) 잊었 / (B) 계속","(A) 잊었 / (B) 멈춰","(A) 들었 / (B) 멈춰"],"opts":["(A) know / (B) keep","(A) know / (B) stop","(A) forget / (B) keep","(A) forget / (B) stop","(A) hear / (B) stop"],"r":{"a":"1) (A) know / (B) keep ((A) 알고 있었 / (B) 계속)","ev":"1번, 4번 문장","s":[[1,"Did you know that sharks sleep?","상어가 잠을 잔다는 것을 알고 있었는가?"],[4,"They need to keep swimming.","그들은 계속 헤엄을 쳐야 한다."]],"w":"1번 문장 Did you know that sharks sleep?, 4번 문장 They need to keep swimming. 알았는지(know) 묻고, 계속(keep) 헤엄쳐야 한다고 했어요.","c":1},"h":"87a9ce7619"},{"n":10,"t":"fill","q":"Sharks need time to rest like any other animal, but their sleep is very [A] from [B].","ko":"상어는 다른 여느 동물처럼 휴식을 취할 시간이 필요하지만, 그들의 잠은 [B]과(와) 매우 [A].","bank":["different","ours","surface","sink","breathe","bottom"],"bko":{"different":"다르다","ours":"우리의 것(잠)","surface":"수면","sink":"가라앉다","breathe":"숨 쉬다","bottom":"바닥"},"r":{"a":"[A] different (다르다), [B] ours (우리의 것(잠))","ev":"2번 문장","s":[[2,"Sharks need time to rest like any other animal, but their sleep is very different from ours.","상어는 다른 여느 동물들처럼 휴식을 취할 시간이 필요하지만, 그들의 잠은 우리의 잠과 매우 다르다."]],"w":"2번 문장에서 가져왔어요. different from ours(우리의 잠과 다르다).","c":null},"h":"dcbc512797"}]},{"u":10,"id":"nl1-10-3","no":3,"ko":"우리 아기 머리카락에 무슨 일이?","items":[{"n":1,"t":"tf","q":"Many babies are born with a full head of hair.","ko":"많은 아기들이 머리에 머리카락이 가득 나 있는 채로 태어난다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Many babies are born with a full head of hair.","많은 아기들이 머리에 머리카락이 가득 나 있는 채로 태어난다."]],"w":"1번 문장 그대로예요(Many babies are born with a full head of hair).","c":"T"},"h":"c815b4794b"},{"n":2,"t":"tf","q":"After birth, the hormone levels rise and hair growth starts.","ko":"출생 후 호르몬 수치가 올라가고 머리카락의 성장이 시작된다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"After birth, the hormone levels drop and hair growth stops.","출생 후, 호르몬 수치는 떨어지고 머리카락의 성장은 멈춘다."]],"w":"6번 문장에서 출생 후에는 호르몬 수치가 떨어지고(drop) 머리카락의 성장이 멈춘다(stops)고 해요. 오르고 시작한다는 말은 반대예요.","c":"F"},"h":"aa635187c4"},{"n":3,"t":"tf","q":"The parents were very surprised when their son was born.","ko":"아들이 태어났을 때 부모는 매우 놀랐다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Of course, they were very surprised!","물론 그들은 매우 놀랐다!"]],"w":"12번 문장에서 부모는 매우 놀랐다(they were very surprised)고 해요. 이유는 아들의 머리카락이 부모와 달랐기 때문이에요.","c":"T"},"h":"ed0c1399da"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Although this may worry parents, it’s perfectly natural.)","ko":"이것이 부모를 걱정시키기도 하지만 그것은 지극히 정상적인 것이다.","opts":["조금","완전히","가끔","거의"],"word":"perfectly","r":{"a":"2) 완전히","ev":"3번 문장","s":[[3,"Although this may worry parents, it’s perfectly natural.","이것이 부모를 걱정시키기도 하지만 그것은 지극히 정상적인 것이다."]],"w":"부모가 걱정해도(Although) 아주 자연스러운 일이라는 말이에요. perfectly = 완전히, 지극히.","c":2},"h":"e73b72b2e0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (For example, one pair of parents recently had a son.)","ko":"예를 들면, 한 쌍의 부모가 최근에 아들을 얻었다.","opts":["오래전에","최근에","언젠가","갑자기"],"word":"recently","r":{"a":"2) 최근에","ev":"9번 문장","s":[[9,"For example, one pair of parents recently had a son.","예를 들면, 한 쌍의 부모가 최근에 아들을 얻었다."]],"w":"For example(예를 들어)로 최근 있었던 한 부부의 이야기를 시작해요. recently = 최근에.","c":2},"h":"8c95ccf1ab"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nLater, when new hair starts to grow, it will often push out the old hair.","ko":"밑줄 친 it가 가리키는 것은?","sko":"나중에, 새 머리카락이 자라기 시작할 때 보통 이전에 있던 머리카락을 밀어내게 된다.","opts":["이전의 머리카락","새 머리카락","호르몬","부모님"],"r":{"a":"2) 새 머리카락","ev":"7번 문장","s":[[7,"Later, when new hair starts to grow, it will often push out the old hair.","나중에, 새 머리카락이 자라기 시작할 때 보통 이전에 있던 머리카락을 밀어내게 된다."]],"w":"it은 old hair를 밀어내는 쪽이에요. 앞에서 자라기 시작한다고 한 new hair가 it이에요.","c":2},"h":"f8671b5eb5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This hair, however, often falls out a short time later.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그런데 이 머리카락은 종종 시간이 조금 지나면 빠진다.","opts":["이 머리카락은 종종 시간이 조금 지나면 빠진다.","이 머리카락은 곧바로 더 길게 자란다.","이 머리카락은 종종 다른 색으로 바뀐다.","이 머리카락은 부모의 머리카락과 같아진다."],"r":{"a":"1) 이 머리카락은 종종 시간이 조금 지나면 빠진다.","ev":"2번 문장","s":[[2,"This hair, however, often falls out a short time later.","그런데 이 머리카락은 종종 시간이 조금 지나면 빠진다."]],"w":"falls out은 빠지다, a short time later는 시간이 조금 지난 뒤라는 뜻이에요. 1번에서 머리카락이 가득 태어난다고 한 뒤 2번에서 however로 반대되는 일(빠짐)을 말해요.","c":1},"h":"71f7ab916a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["새 머리카락은 언제나 원래 머리카락과 똑같다.","출생 후 호르몬 수치가 올라간다.","아기의 새 머리카락은 원래 머리카락과 다를 수 있다.","아기는 태어날 때 머리카락이 전혀 없다."],"opts":["New hair is always the same as the original hair.","Hormone levels go up after birth.","The new hair of a baby can be different from the original hair.","Babies never have any hair at birth."],"r":{"a":"3) The new hair of a baby can be different from the original hair. (아기의 새 머리카락은 원래 머리카락과 다를 수 있다.)","ev":"8번 문장","s":[[8,"Interestingly, this new hair can be different from their original hair.","흥미롭게도, 이 새 머리카락은 아기의 원래 머리카락과 다를 수 있다."]],"w":"8번 문장에서 this new hair can be different from their original hair라고 했어요.","c":3},"h":"776816eb74"},{"n":9,"t":"sum","q":"But it soon fell out, and (A) blond hair grew in its (B).","ko":"하지만 그것은 곧 빠졌고, 그 (B)에 (A) 금발 머리카락이 자라났다.","oko":["(A) 곱슬곱슬한 / (B) 자리","(A) 곱슬곱슬한 / (B) 방","(A) 곧은 / (B) 자리","(A) 흰 / (B) 방","(A) 흰 / (B) 손"],"opts":["(A) curly / (B) place","(A) curly / (B) room","(A) straight / (B) place","(A) white / (B) room","(A) white / (B) hand"],"r":{"a":"1) (A) curly / (B) place ((A) 곱슬곱슬한 / (B) 자리)","ev":"13번 문장","s":[[13,"But it soon fell out, and curly blond hair grew in its place.","하지만 그것은 곧 빠졌고 곱슬곱슬한 금발 머리카락이 그 자리에 자라났다."]],"w":"13번 문장 But it soon fell out, and curly blond hair grew in its place. 곱슬곱슬한(curly) 금발이 그 자리(place)에 자랐어요.","c":1},"h":"3a51edb586"},{"n":10,"t":"fill","q":"They both have thin, [A], blond hair. But their son was born with thick, straight, [B] hair.","ko":"그들은 둘 다 가늘고 [A] 금발 머리카락을 가지고 있다. 그런데 그들의 아들은 굵은 직모의 [B] 머리카락을 가지고 태어났다.","bank":["wavy","black","hormones","birth","parents","soon"],"bko":{"wavy":"구불구불한","black":"검은","hormones":"호르몬","birth":"출생","parents":"부모","soon":"곧"},"r":{"a":"[A] wavy (구불구불한), [B] black (검은)","ev":"10~11번 문장","s":[[10,"They both have thin, wavy, blond hair.","그들은 둘 다 가늘고 구불구불한 금발 머리카락을 가지고 있다."],[11,"But their son was born with thick, straight, black hair.","그런데 그들의 아들은 굵은 직모의 검은 머리카락을 가지고 태어났다."]],"w":"10~11번 문장에서 가져왔어요. thin, wavy, blond hair(가늘고 구불구불한 금발), thick, straight, black hair(굵은 직모의 검은 머리카락).","c":null},"h":"94cd0bcd8a"}]},{"u":10,"id":"nl1-10-4","no":4,"ko":"특별한 채소","items":[{"n":1,"t":"tf","q":"In the movie, Mark Watney grows potatoes to survive on Mars.","ko":"영화에서 Mark Watney는 화성에서 살아남기 위해 감자를 재배한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"To survive, he grows potatoes.","생존하기 위해, 그는 감자를 재배한다."]],"w":"2번 문장에서 살아남기 위해(To survive) 그는 감자를 재배한다고 해요.","c":"T"},"h":"af5a8f4ef9"},{"n":2,"t":"tf","q":"Michael Mautner went to Mars to get Martian vegetables.","ko":"Michael Mautner는 화성 채소를 얻으려고 화성에 갔다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"He says he has Martian vegetables, but he never went to Mars.","그는 자신이 화성의 채소를 가지고 있다고 하는데, 그는 결코 화성에 간 적이 없다."]],"w":"5번 문장에서 그는 화성 채소를 가지고 있다고 하지만 화성에 간 적이 없다(he never went to Mars)고 해요.","c":"F"},"h":"327efcf84d"},{"n":3,"t":"tf","q":"Mautner found two rocks that fell to Earth from Mars.","ko":"Mautner는 화성에서 지구로 떨어진 암석 두 개를 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"A few years ago, he found two rocks that fell to Earth from Mars thousands of years ago.","몇 년 전에 그는 수천 년 전 화성에서 지구로 떨어진 암석 두 개를 발견했다."]],"w":"8번 문장 그대로예요. 수천 년 전에 화성에서 지구로 떨어진 암석 두 개를 발견했어요.","c":"T"},"h":"51f6265b90"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (To survive, he grows potatoes.)","ko":"생존하기 위해, 그는 감자를 재배한다.","opts":["도망치다","사냥하다","살아남다","여행하다"],"word":"survive","r":{"a":"3) 살아남다","ev":"1~2번 문장","s":[[1,"In the movie The Martian, astronaut Mark Watney is left alone on Mars after a big storm.","영화 ‘마션’에서 우주 비행사 Mark Watney(마크 와트니)는 거대한 폭풍이 몰아친 이후 화성에 홀로 남게 된다."],[2,"To survive, he grows potatoes.","생존하기 위해, 그는 감자를 재배한다."]],"w":"화성에 혼자 남은 사람이 감자를 키우는 이유예요. 살아남기 위해서라서 survive = 살아남다(생존하다)예요.","c":3},"h":"8f987ae22a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then he planted and gave water to tiny bits of asparagus and potato plants.)","ko":"그런 var LAB={tf:"T / F",vocab:"어휘",ref:"지칭",sense:"문장 이해",match:"내용 일치",sum:"요약문 (A)(B)",fill:"요약문 완성"};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function pr(){return P.filter(function(p){return p.id===cur})[0]}
function answered(p,it){var a=(ans[p.id]||{})[it.n];if(it.t==="fill")return a&&a[0]&&a[1];return a!=null&&a!==""}
function setAns(p,it,v){ans[p.id]=ans[p.id]||{};ans[p.id][it.n]=v}
function view(){var p=pr(),v=document.getElementById("view");v.innerHTML="";var fin=!!done[p.id];v.appendChild(testHead(p));
 if(fin){var d0=done[p.id],pass=d0.s*10>=70,wr0=p.items.filter(function(it){return !d0.ok[it.n]}).map(function(it){return it.n});var bn=el("div","banner "+(pass?"pass":"fail"));bn.id="bn";bn.appendChild(el("span","vd",pass?"PASS":"FAIL"));bn.appendChild(el("span","sc",(d0.s*10)+"점 ("+d0.s+" / 10)"));bn.appendChild(el("span","wr",wr0.length?"틀린 문항: "+wr0.join(", ")+"번":"전 문항 정답"));bn.appendChild(el("span","rule",pass?"70점 이상 통과":"70점 미만: 클래스카드 추가학습을 하세요."));bn.appendChild(navBar());v.appendChild(bn)}
 var box=el("div",fin?"locked":"");
 p.items.forEach(function(it){
  var q=el("section","q");var h=el("div","qh");h.appendChild(el("span","qn",it.n));h.appendChild(el("span",null,LAB[it.t]));var okm=fin?done[p.id].ok[it.n]:null;if(fin){h.appendChild(el("span","mk "+(okm?"o1":"x1"),okm?"O":"X"));if(!okm)q.className+=" wrong"}q.appendChild(h);
  var qt=el("p","qt");
  if(it.t==="fill"){var parts=it.q.split(/(\[A\]|\[B\])/);parts.forEach(function(s){if(s==="[A]"||s==="[B]"){var k=s==="[A]"?0:1;var sel=el("select");var o0=el("option",null,s);o0.value="";sel.appendChild(o0);it.bank.forEach(function(w){var o=el("option",null,w);o.value=w;sel.appendChild(o)});var cu=(ans[p.id]||{})[it.n];if(cu&&cu[k])sel.value=cu[k];sel.onchange=function(){var c=((ans[p.id]||{})[it.n]||["",""]).slice();c[k]=sel.value;setAns(p,it,c);foot()};qt.appendChild(sel)}else qt.appendChild(document.createTextNode(s))});q.appendChild(qt)}
  else{if(it.t==="vocab"&&it.word){qt.innerHTML=esc(it.q).replace(esc(it.word),"<b>"+esc(it.word)+"</b>")}else qt.textContent=it.q;q.appendChild(qt)}
  if(it.t==="tf"){var g=el("div","tf");["T","F"].forEach(function(x){var b=el("button","o",x);b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===x));b.onclick=function(){setAns(p,it,x);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.opts){var g=el("div","opts");it.opts.forEach(function(t,i){var b=el("button","o");b.innerHTML="<i>"+(i+1)+"</i><span></span>";b.lastChild.textContent=t;b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===i+1));b.onclick=function(){setAns(p,it,i+1);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.t==="fill"){q.appendChild(el("p","bank","보기: "+it.bank.join(" / ")))}
  if(fin){var pk=(ans[p.id]||{})[it.n];if(it.t==="tf"){Array.prototype.forEach.call(q.querySelector(".tf").children,function(b){var v=b.textContent;if(v===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(v===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}else if(it.opts){Array.prototype.forEach.call(q.querySelector(".opts").children,function(b,i){if(i+1===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(i+1===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}}
  if(fin&&it.r){var rv=el("div","rv");
   var z1=el("div","zone z-tr");z1.appendChild(el("h4",null,"한글 해석"));
   function ln(l,t){var p2=el("p","ln");p2.appendChild(el("b",null,l));p2.appendChild(document.createTextNode(t));z1.appendChild(p2)}
   if(it.ko)ln("문제",it.ko);if(it.sko)ln("문장",it.sko);
   if(it.oko){var ol=el("ol");it.oko.forEach(function(x){ol.appendChild(el("li",null,x))});var lb=el("p","ln");lb.appendChild(el("b",null,"선택지"));z1.appendChild(lb);z1.appendChild(ol)}
   if(it.bko){var bl=el("p","ln");bl.appendChild(el("b",null,"보기 단어"));bl.appendChild(document.createTextNode(it.bank.map(function(w){return w+" "+(it.bko[w]||"")}).join(" / ")));z1.appendChild(bl)}
   if(z1.children.length>1)rv.appendChild(z1);
   var z2=el("div","zone z-an");z2.appendChild(el("h4",null,"정답 · 해설"));z2.appendChild(el("p","ra","정답: "+it.r.a));z2.appendChild(el("div","rl","교재 근거 ("+it.r.ev+")"));it.r.s.forEach(function(x){var d=el("div","rs");var e=el("span","en");e.appendChild(el("span","sn",x[0]+"번"));e.appendChild(document.createTextNode(x[1]));d.appendChild(e);d.appendChild(el("span","ko",x[2]));z2.appendChild(d)});z2.appendChild(el("div","rl","정리"));z2.appendChild(el("p","rw",it.r.w));rv.appendChild(z2);if(okm){rv.style.display="none";var tg=el("button","tgl","해설 보기");tg.onclick=function(){var s=rv.style.display==="none";rv.style.display=s?"block":"none";tg.textContent=s?"해설 닫기":"해설 보기"};q.appendChild(tg)}q.appendChild(rv)}
  box.appendChild(q)});
 v.appendChild(box);
 var sb=el("div","sbar");sb.id="sbar";v.appendChild(sb);foot();
 if(fin)showScore(p)}
function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
function showScore(p){var sb=document.getElementById("sbar");sb.innerHTML="";var d=done[p.id];var c=el("div","score");c.appendChild(el("span",null,readName(p)+" 점수"));c.appendChild(el("b",null,(d.s*10)+"점"));c.appendChild(el("span",null,d.s+" / 10 문항"));sb.style.display="block";sb.appendChild(c);sb.appendChild(navBar())}
boot();

function picker(){var v=document.getElementById("view");v.innerHTML="";
  var t=document.createElement("div");t.className="top";
  t.innerHTML='<span class="tk">EXIT TEST</span><h1></h1><p class="sub">Reading별 10문항</p>';t.querySelector("h1").textContent=document.title.replace(/ Exit Test$/,"");v.appendChild(t);
  var last=null;
  P.forEach(function(p){
    if(p.u!==last){last=p.u;var g=document.createElement("div");g.className="grp";g.textContent=secName(p.u);v.appendChild(g)}
    var ok=ready(p.id);
    var r=document.createElement(ok?"a":"div");r.className="pk"+(ok?"":" lk");if(ok)r.href="?r="+encodeURIComponent(p.id);
    var l=document.createElement("div");var b=document.createElement("b");b.textContent=readName(p);var s=document.createElement("span");s.className="t";s.textContent=p.ko;l.appendChild(b);l.appendChild(s);r.appendChild(l);
    var st=document.createElement("span");st.className="st";st.textContent=ok?"응시 가능":"잠김";r.appendChild(st);v.appendChild(r)});
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("홈으로","../",true));v.appendChild(n)}
function gate(p){var v=document.getElementById("view");v.innerHTML="";v.appendChild(testHead(p));
  var g=document.createElement("div");g.className="gate";g.innerHTML="<b>아직 응시할 수 없어요</b><p>지문 읽기와 문제 선지를 모두 마친 뒤에 열려요.</p>";v.appendChild(g);
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("이 Reading으로 돌아가기","../?r="+encodeURIComponent(p.id),true));n.appendChild(lnk("Exit test 목록","./"));v.appendChild(n)}
function boot(){var m=/[?&]r=([^&]+)/.exec(location.search);
  if(m){var id=decodeURIComponent(m[1]);var p=P.filter(function(x){return x.id===id})[0];
    if(p){cur=id;if(!ready(id)){gate(p);return}view();return}}
  picker()}
