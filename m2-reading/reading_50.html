 did you do this morning?\"","\"I played soccer, and I came back home around 11. I saw the box on the table and opened it. There was a cake inside, but I didn't eat it.\"","\"What did you do after that?\"","\"I just went to my room.\"","\"Hmm.... Then why do you have crumbs around your mouth?\"","\"Oh, I ate some chocolate cookies because I was hungry.\""];var PASS_KO=["사라진 케이크","오늘은 아빠의 생일이었다. 비밀 선물로, 엄마는 그에게 케이크를 구워 주셨다. 그녀는 상자에 케이크를 포장했고 그것을 부엌에 있는 식탁에 올려놓았다. 그러고 나서 그녀는 11시에 초를 사기 위해서 밖으로 나갔다. 그녀가 한 시간 후에 집에 돌아왔을 때, 그녀는 상자가 비어 있는 것을 발견했다. 누군가 케이크 전체를 먹었다!","엄마는 케이크를 먹은 사람을 찾기 위해 Ms. Jones에게 전화했다. Ms. Jones는 옆집에 사는 현명한 노부인이었다. 마을에 있는 모든 사람은 그들이 곤경에 처했을 때 그녀에게 왔다.","Ms. Jones는 다정한 미소를 지으며 왔다. \"걱정 마세요! 대식가를 알아냅시다!\"","그녀는 엄마에게 물었다, \"누가 오늘 아침에 집에 있었죠?\"","\"우리 아이들, Harry, Carol, 그리고 Tom이요.\"","처음에, Ms. Jones는 큰 아들 Harry와 이야기했다. \"누군가 너희 엄마의 케이크를 먹었어. 오늘 아침에 너는 무엇을 했니?\"","\"저는 축구를 했고, 11시쯤 집에 돌아왔어요. 저는 식탁 위에 있는 상자를 보았고 그것을 열었어요. 안에 케이크가 있었지만, 저는 그것을 먹지 않았어요.\"","\"그런 다음에 너는 무엇을 했니?\"","\"저는 그냥 제 방에 갔어요.\"","\"흠…. 그러면 네 입 주변에 왜 부스러기가 있지?\"","\"오, 저는 배가 고파서 초콜릿 쿠키를 조금 먹었어요.\""];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["여자의 우산은 전부 초록색이다.","남자는 여자의 우산을 보지 못했다.","여자의 우산은 우산꽂이에 있다.","여자는 우산을 버리고 갔다.","남자는 우산을 집에 가져갔다."],"a":2,"ans":"여자의 우산은 우산꽂이에 있다.","evs":[["It's green, and it has a brown handle.","초록색이고 갈색 손잡이가 있어요."],["Oh, I found it and put it in the umbrella stand.","아, 제가 찾아서 우산꽂이에 넣어 뒀어요."]],"ev":["It's green, and it has a brown handle.","초록색이고 갈색 손잡이가 있어요."],"ow":["오답 ✕ — 여자는 \"It's green, and it has a brown handle.\"(초록색이고 갈색 손잡이가 있어요.)라고 했는데, 이 보기는 전부 초록색이라고 해서 틀림. 손잡이는 갈색이다.","오답 ✕ — 남자가 \"Oh, I found it\"(아, 제가 찾았어요)라고 했는데, 이 보기는 보지 못했다고 해서 틀림.","정답 ○ — 남자가 \"I found it and put it in the umbrella stand.\"(제가 찾아서 우산꽂이에 넣어 뒀어요.)라고 했으므로 맞음.","오답 ✕ — 여자는 \"I think I left it here.\"(여기에 두고 간 것 같아요.)라고 했으므로 버린 것이 아니라 두고 간 것이라 틀림.","오답 ✕ — 남자는 \"put it in the umbrella stand\"(우산꽂이에 넣어 뒀어요)라고 했는데, 이 보기는 집에 가져갔다고 해서 틀림."],"memo":["정답 ③: 여자의 우산은 우산꽂이에 있다.", hone","finding a lost smartphone"],"a":4,"ans":"finding a lost smartphone","evs":[["I can't find my new smartphone. Can you help me?","내 새 스마트폰을 못 찾겠어. 도와줄래?"],["I turned it off before class. Then I think I put it in my backpack.","수업 전에 껐어. 그러고 나서 가방에 넣은 것 같아."],["Let's look around the classroom.","교실을 둘러보자."],["I found it! It was inside your textbook.","찾았어! 네 교과서 안에 있었어."]],"ev":["I can't find my new smartphone. Can you help me?","내 새 스마트폰을 못 찾겠어. 도와줄래?"],"ow":["오답 ✕ — 커버의 곰 캐릭터는 \"there's a brown bear character on the cover\"(커버에 갈색 곰 캐릭터가 있어)처럼 폰의 생김새를 설명할 뿐 커버를 고르는 이야기가 아니라서 틀림.","오답 ✕ — \"Let's look around the classroom.\"(교실을 둘러보자.)는 물건을 찾으려고 둘러보는 것이지 교실을 청소하는 것이 아니라서 틀림.","오답 ✕ — \"I put it in my backpack\"(가방에 넣은 것 같아)은 폰을 둔 곳을 기억해 내는 말일 뿐이고, 결국 폰은 교과서 안에서 찾았으므로 가방 속 물건 확인이 주제가 아니라서 틀림.","오답 ✕ — \"my new smartphone\"(내 새 스마트폰)은 이미 가진 물건이고 잃어버려서 찾는 중이므로 새로 사는 이야기가 아니라서 틀림.","정답 ○ — \"I can't find my new smartphone. Can you help me?\"(내 새 스마트폰을 못 찾겠어. 도와줄래?)로 시작해서 \"I found it!\"(찾았어!)으로 끝나므로 잃어버린 스마트폰을 찾는 것이 주제임."],"memo":["정답 ⑤: finding a lost smartphone","근거: I can't find my new smartphone. Can you help me? → I found it!(찾았어!)","함정: ③ 가방 확인은 단서일 뿐, 폰은 교과서 안에서 발견됨"],"why":"잃어버린 스마트폰을 친구들과 함께 찾는 대화이다."}],"dlg":[["Junho","I can't find my new smartphone. Can you help me?","내 새 스마트폰을 못 찾겠어. 도와줄래?"],["Kate","I'm sorry to hear that. I'll call you.","안됐구나. 내가 전화해 볼게."],["Junho","Actually, I turned it off.","사실, 꺼 놨어."],["Alex","What does it look like?","어떻게 생겼니?"],["Junho","It's black, and there's a brown bear character on the cover.","검은색이고 커버에 갈색 곰 캐릭터가 있어."],["Alex","When did you use it last?","마지막으로 언제 썼니?"],["Junho","I turned it off before class. Then I think I put it in my backpack.","수업 전에 껐어. 그러고 나서 가방에 넣은 것 같아."],["Kate","Let's look around the classroom.","교실을 둘러보자."],["상황","(a few minutes later)","(몇 분 후)"],["Kate","I found it! It was inside your textbook.","찾았어! 네 교과서 안에 있었어."],["Junho","Oh, thank you for helping me!","오, 도와줘서 고마워!"]]},{"qs":[{"n":4,"q":"What will the girl help the boy to do?","o":["to find the way to the basketball court","to choose a pattern for a backpack","to learn to play basketball","to find his lost backpack","to find his basketball"],"a":3,"ans":"to find his lost backpack","evs":[["Oh! I lost my backpack!","어! 내 배낭을 잃어버렸어!"],["Hmm.... I think I left it on the basketball court.","음… 농구장에 두고 온 것 같아."],["Oh, let's go to the basketball court and look for it.","아, 농구장에 가서 찾아보자."]],"ev":["Oh! I lost my backpack!","어! 내 배낭을 잃어버렸어!"],"ow":["오답 ✕ — 농구장 가는 길을 찾는 것이 아니다. 남자가 \"I think I left it on the basketball court.\"(농구장에 두고 온 것 같아.)라고 장소를 이미 알고 있고, 여자는 \"let's go to the basketball court and look for it\"(농구장에 가서 찾아보자)라고 가방을 찾는 것을 돕는다.","오답 ✕ — 별 무늬는 \"a blue backpack with a star pattern on it\"(별 무늬가 있는 파란색 배낭)처럼 가방의 생김새를 설명한 것이고, 무늬를 고르는 일을 돕는 것이 아니라서 틀림.","오답 ✕ — 농구장은 가방을 두고 온 장소일 뿐 농구를 배우는 이야기는 없어 틀림.","정답 ○ — 남자가 \"Oh! I lost my backpack!\"(어! 내 배낭을 잃어버렸어!)라고 하자 여자가 \"let's go to the basketball court and look for it\"(농구장에 가서 찾아보자)라고 하므로 잃어버린 가방을 찾는 것을 돕는다.","오답 ✕ — 잃어버린 것은 농구공이 아니라 배낭이다(\"I lost my backpack!\"). 농구는 가방이 있을 장소일 뿐이라 틀림."],"memo":["정답 ④: to find his lost backpack","근거: let's go to the basketball court and look for it.(농구장에 가서 찾아보자.)","함정: 농구장은 가방을 찾으러 가는 '장소'일 뿐 농구와 관련 없음"],"why":"여자는 남자가 잃어버린 배낭을 함께 찾아 주기로 한다."}],"dlg":[["B","Oh! I lost my backpack!","어! 내 배낭을 잃어버렸어!"],["G","I'm sorry to hear that. Where did you last see it?","안됐구나. 마지막으로 어디서 봤니?"],["B","Hmm.... I think I left it on the basketball court.","음… 농구장에 두고 온 것 같아."],["G","What does it look like?","어떻게 생겼니?"],["B","It's a blue backpack with a star pattern on it.","별 무늬가 있는 파란색 배낭이야."],["G","Oh, let's go to the basketball court and look for it.","아, 농구장에 가서 찾아보자."]]},{"qs":[{"n":5,"q":"Kevin의 강아지에 대한 설명으로 알맞은 것은?","o":["몸이 짧고 다리가 길다.","이 공원에서 잃어버렸다.","집에 혼자 있다.","털이 길고 갈색이다.","여자가 이미 찾았다."],"a":1,"ans":"이 공원에서 잃어버렸다.","evs":[["Well, I'm looking for my dog. I lost him in this park.","음, 내 강아지를 찾고 있어. 이 공원에서 잃어버렸어."],["He has a long body and short legs. Here's his picture.","몸이 길고 다리가 짧아. 여기 사진이야."],["Okay. Let's find your dog together.","좋아. 같이 네 강아지를 찾아보자."]],"ev":["Well, I'm looking for my dog. I lost him in this park.","음, 내 강아지를 찾고 있어. 이 공원에서 잃어버렸어."],"ow":["오답 ✕ — Kevin은 \"He has a long body and short legs.\"(몸이 길고 다리가 짧아.)라고 했는데, 이 보기는 반대로 말해서 틀림.","정답 ○ — Kevin이 \"I lost him in this park.\"(이 공원에서 잃어버렸어.)라고 했으므로 맞음.","오답 ✕ — 강아지는 \"I lost him in this park.\"(이 공원에서 잃어버렸어.)라고 했으므로 집이 아니라 공원에서 잃어버린 것이라 틀림.","오답 ✕ — 털에 대한 언급이 없다. 강아지의 생김새는 \"He has a long body and short legs.\"(몸이 길고 다리가 짧아.)뿐이다.","오답 ✕ — 여자는 \"Let's find your dog together.\"(같이 네 강아지를 찾아보자.)라고 했으므로 아직 찾지 못한 것이라 틀림."],"memo":["정답 ②: 이 공원에서 잃어버렸다.","근거: I'm looking for my dog. I lost him in this park.(내 강아지를 찾고 있어. 이 공원에서 잃어버렸어.)","함정: ①은 몸이 길고 다리가 '짧다(long body and short legs)'를 뒤집은 함정"],"why":"Kevin은 공원에서 잃어버린 몸이 길고 다리가 짧은 강아지를 찾고 있다."}],"dlg":[["G","Hi, Kevin. What are you doing?","안녕, 케빈. 뭐 하고 있니?"],["Kevin","Well, I'm looking for my dog. I lost him in this park.","음, 내 강아지를 찾고 있어. 이 공원에서 잃어버렸어."],["G","I'm sorry to hear that. What does he look like?","안됐구나. 어떻게 생겼니?"],["Kevin","He has a long body and short legs. Here's his picture.","몸이 길고 다리가 짧아. 여기 사진이야."],["G","Okay. Let's find your dog together.","좋아. 같이 네 강아지를 찾아보자."]]}];var BG=[{"qs":[{"n":6,"q":"What did Mom find when she came back home?","o":["The cake was still on the table.","The box was empty.","Dad was eating the cake.","The candles were missing.","Ms. Jones was waiting in the kitchen."],"a":1,"ans":"The box was empty.","evs":[["Then she went out to buy candles at 11. When she came back home one hour later, she found that the box was empty.","그러고 나서 그녀는 11시에 초를 사기 위해서 밖으로 나갔다. 그녀가 한 시간 후에 집에 돌아왔을 때, 그녀는 상자가 비어 있는 것을 발견했다."],["Someone ate the whole cake!","누군가 케이크 전체를 먹었다!"]],"ev":["Then she went out to buy candles at 11. When she came back home one hour later, she found that the box was empty.","그러고 나서 그녀는 11시에 초를 사기 위해서 밖으로 나갔다. 그녀가 한 시간 후에 집에 돌아왔을 때, 그녀는 상자가 비어 있는 것을 발견했다."],"ow":["오답 ✕ — 본문에는 \"she found that the box was empty\"(상자가 비어 있는 것을 발견했다)라고 했는데, 이 보기는 케이크가 그대로 있었다고 해서 틀림.","정답 ○ — \"When she came back home one hour later, she found that the box was empty.\"(한 시간 후에 집에 돌아왔을 때 상자가 비어 있는 것을 발견했다.)라고 했으므로 맞음.","오답 ✕ — 아빠가 케이크를 먹고 있었다는 말은 없다. 'Someone ate the whole cake!'(누군가 케이크 전체를 먹었다!)라고만 했다.","오답 ✕ — 초가 없어졌다는 말은 없다. 엄마는 'went out to buy candles at 11'(11시에 초를 사러 나갔다)고만 했다.","오답 ✕ — Ms. Jones는 엄마가 전화한 뒤에 오는 사람이고('Mom called Ms. Jones'), 엄마가 돌아왔을 때 부엌에서 기다린 것이 아니라서 틀림."],"memo":["정답 ②: The box was empty.","근거: she found that the box was empty. Someone ate the whole cake!(상자가 비어 있었다. 누군가 케이크 전체를 먹었다!)","함정: 케이크는 식탁 위 상자에 넣어 두었지만 돌아왔을 땐 비어 있었음"],"why":"엄마가 돌아오니 케이크 상자가 비어 있었다."}],"pp":[["Today was Dad's birthday.","오늘은 아빠의 생일이었다."],["As a secret gift, Mom baked him a cake.","비밀 선물로, 엄마는 그에게 케이크를 구워 주셨다."],["She wrapped the cake in a box and put it on the table in the kitchen.","그녀는 상자에 케이크를 포장했고 그것을 부엌에 있는 식탁에 올려놓았다."],["Then she went out to buy candles at 11. When she came back home one hour later, she found that the box was empty.","그러고 나서 그녀는 11시에 초를 사기 위해서 밖으로 나갔다. 그녀가 한 시간 후에 집에 돌아왔을 때, 그녀는 상자가 비어 있는 것을 발견했다."],["Someone ate the whole cake!","누군가 케이크 전체를 먹었다!"]]},{"qs":[{"n":7,"q":"Ms. Jones에 대한 설명으로 알맞은 것은?","o":["Harry의 선생님이다.","옆집에 사는 현명한 노부인이다.","케이크 가게를 운영한다.","엄마의 가장 친한 친구이다.","마을 사람들을 피해 다닌다."],"a":1,"ans":"옆집에 사는 현명한 노부인이다.","evs":[["Ms. Jones was a wise old lady who lived next door.","Ms. Jones는 옆집에 사는 현명한 노부인이었다."],["Everyone in town came to her when they were in trouble.","마을에 있는 모든 사람은 그들이 곤경에 처했을 때 그녀에게 왔다."]],"ev":["Ms. Jones was a wise old lady who lived next door.","Ms. Jones는 옆집에 사는 현명한 노부인이었다."],"ow":["오답 ✕ — 선생님이라는 말은 없다. \"Ms. Jones was a wise old lady who lived next door.\"(Ms. Jones는 옆집에 사는 현명한 노부인이었다.)라고만 했다.","정답 ○ — \"Ms. Jones was a wise old lady who lived next door.\"(Ms. Jones는 옆집에 사는 현명한 노부인이었다.)라고 했으므로 맞음.","오답 ✕ — 케이크 가게에 대한 언급이 없다. Ms. Jones는 문제를 해결해 주는 사람으로 eone ate your mom's cake.","처음에, Ms. Jones는 큰 아들 Harry와 이야기했다. \"누군가 너희 엄마의 케이크를 먹었어."],"ow":["오답 ✕ — 상자는 엄마가 케이크를 넣어 둔 것이고, Harry가 \"I saw the box on the table and opened it.\"(식탁 위의 상자를 보고 열었어요.)라고 했을 뿐 Harry가 상자를 잃어버렸다는 내용은 없어 틀림.","정답 ○ — Ms. Jones가 \"Someone ate your mom's cake. What did you do this morning?\"(누군가 엄마의 케이크를 먹었어. 오늘 아침에 뭘 했니?)라고 묻고, Harry는 \"There was a cake inside, but I didn't eat it.\"(안에 케이크가 있었지만 먹지 않았어요.)라고 했지만 입 주변에 부스러기가 있어 먹었는지 의심하는 내용이므로 맞음.","오답 ✕ — Harry는 \"I ate some chocolate cookies because I was hungry.\"(배가 고파서 초콜릿 쿠키를 조금 먹었어요.)라고 했을 뿐 케이크를 먹었다고 인정하지 않았고, 아직 먹었는지 확인되지 않아서 틀림.","오답 ✕ — 부스러기가 초콜릿 쿠키 때문이라고 말했지만 그 쿠키가 엄마가 만든 것이라는 말은 없고, 글의 중심은 Harry가 케이크를 먹었는지 의심하는 것이라서 틀림.","오답 ✕ — Harry는 케이크 맛에 대해 말하지 않았다. 지문에 케이크가 맛있다는 언급이 없다. 가장 가까운 문장은 \"There was a cake inside, but I didn't eat it.\"(안에 케이크가 있었지만 먹지 않았어요.)이다."],"memo":["정답 ②: Did Harry Eat the Cake or Not?","근거: There was a cake inside, but I didn't eat it. / Then why do you have crumbs around your mouth?","함정: ③은 Harry가 케이크를 먹었다고 인정한 적이 없어 ✕"],"why":"Harry가 케이크를 먹었는지 안 먹었는지를 Ms. Jones가 따져 묻는 내용이다."},{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["Harry stayed at home all morning.","Harry came back home around 11 after playing soccer.","Harry ate the cake in the box.","Harry went to the kitchen after he opened the box.","Ms. Jones found crumbs on the table."],"a":1,"ans":"Harry came back home around 11 after playing soccer.","evs":[["I played soccer, and I came back home around 11.","저는 축구를 했고, 11시쯤 집에 돌아왔어요."]],"ev":["I played soccer, and I came back home around 11.","저는 축구를 했고, 11시쯤 집에 돌아왔어요."],"ow":["오답 ✕ — Harry는 \"I played soccer, and I came back home around 11.\"(축구를 하고 11시쯤 돌아왔어요.)라고 했으므로 아침 내내 집에 있지 않았어서 틀림.","정답 ○ — \"I played soccer, and I came back home around 11.\"(저는 축구를 했고, 11시쯤 집에 돌아왔어요.)와 일치한다.","오답 ✕ — Harry는 \"There was a cake inside, but I didn't eat it.\"(안에 케이크가 있었지만 먹지 않았어요.)라고 했으므로 케이크를 먹었다는 보기는 틀림.","오답 ✕ — 상자를 연 뒤 \"I just went to my room.\"(그냥 제 방에 갔어요.)이라고 했지 부엌에  });

 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
