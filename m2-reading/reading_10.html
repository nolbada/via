<style>

. 지금 바로 밖으로 나가서 자연을 탐험하는 건 어떨까요?","이제 퍼즐로 휴식을 취하세요. 조심스럽게 조각들을 맞추세요, 그러면 여러분은 걱정을 잊어버릴 거예요. 퍼즐을 맞추는 것은 정신을 맑게 하는 데 좋아요. 그리고 그거 아세요? 마지막 조각을 맞출 때, 여러분은 기분이 아주 좋을 거예요. 그것은 여러분에게 성취감을 줄 거예요. 퍼즐을 잡고 즐겨 보세요!","마지막으로, 부엌으로 가서 베이킹을 하세요. 여러분은 자신만의 쿠키를 만들 수 있어요. 조리법을 따르되, 창의력을 발휘하는 것을 두려워하지 마세요. 여러분이 쿠키를 만들 때, 고양이, 꽃, 심지어 여러분이 매우 좋아하는 캐릭터와 같은 다양한 모양을 시도해 보세요. 그저 여러분 자신을 표현해 보세요! 그리고 여기에 베이킹의 하이라이트가 있습니다. 그것은 여러분에게 나눔의 즐거움을 줍니다. 여러분의 친구들이나 가족을 위해 특별한 것을 구워 보세요. 그들은 여러분의 쿠키를 아주 좋아할 거예요!","여러분은 이 취미들에 대해 어떻게 생각하나요? 그것들 중 하나를 바로 시도해 보는 것은 어떤가요? 그것은 여러분의 날들을 빛나게 해 줄 거예요."];var DG=[{"qs":[{"n":1,"q":"What are Junho's blog posts usually about?","o":["his friends","his daily life","his favorite hobbies","some dance moves","how to make a video"],"a":1,"ans":"his daily life","evs":[["Junho: I'm writing on my blog. I like writing about my everyday life.","블로그에 글을 쓰고 있어. 나는 내 일상에 대해 쓰는 걸 좋아해."]],"ev":["Junho: I'm writing on my blog. I like writing about my everyday life.","블로그에 글을 쓰고 있어. 나는 내 일상에 대해 쓰는 걸 좋아해."],"ow":["오답 ✕ — 대화에 준호의 친구들에 대한 글을 쓴다는 말이 없다. 'I like writing about my everyday life.'(나는 내 일상에 대해 쓰는 걸 좋아해.)라고 했음.","정답 ○ — 준호는 'I like writing about my everyday life.'(나는 내 일상에 대해 쓰는 걸 좋아해.)라고 했으므로 블로그 글은 보통 his daily life(그의 일상)에 대한 것임.","오답 ✕ — 취미는 이 대화의 큰 소재이지만, 준호가 블로그에 쓰는 내용은 'my everyday life'(내 일상)이지 좋아하는 취미가 아님.","오답 ✕ — 춤 동작은 Alex가 가르쳐 줄 수 있는 것('teach us some dance moves')이지 준호의 블로그 내용이 아님.","오답 ✕ — 영상 만들기는 Kate가 여가에 하는 일('I usually make videos')이므로 준호의 블로그와는 관계없음."],"memo":["정답 ②: 준호의 블로그 글은 보통 his daily life(그의 일상)에 대한 것이다.","근거: I like writing about my everyday life.(나는 내 일상에 대해 쓰는 걸 좋아해.)","함정: everyday life(일상)와 favorite hobbies(좋아하는 취미)는 다르다."],"why":"준호는 자기 일상에 대해 블로그에 쓴다고 직접 말한다."},{"n":2,"q":"위 대화의 주제로 알맞은 것은?","o":["importance of having free time","making a video of dance","good points of blogs","free-time activities","types of dance"],"a":3,"ans":"free-time activities","evs":[["Kate: That's a lot! How about you, Alex? What do you do in your free time?","정말 많이 joying the journey.","그것은 여정을 즐기는 것이기도 합니다."],["Look at the amazing views and take in the fresh air.","놀라운 경치를 보고 신선한 공기를 마셔 보세요."]],"ev":["Well, hiking a mountain is not just about reaching the top.","글쎄요, 등산하는 것은 단순히 정상에 오르는 것만이 아닙니다."],"ow":["오답 ✕ — 'Let's go hiking!'(하이킹을 가요!)라고 했으므로 글쓴이가 하이킹을 권한다는 보기는 일치함.","오답 ✕ — 'Some people say, \"Why do we need to get to the top?\"'(어떤 사람들은 \"우리가 왜 정상에 올라가야 하나요?\"라고 말합니다.)라고 했으므로 일치함.","정답 ○ — 'hiking a mountain is not just about reaching the top.'(등산하는 것은 단순히 정상에 오르는 것만이 아닙니다.)이라고 했다. 정상에 오르는 것이 가장 중요하다는 보기는 일치하지 않음.","오답 ✕ — 'It is also about enjoying the journey.'(그것은 여정을 즐기는 것이기도 합니다.)라고 했으므로 일치함.","오답 ✕ — 'Look at the amazing views and take in the fresh air.'(놀라운 경치를 보고 신선한 공기를 마셔 보세요.)라고 했으므로 일치함."],"memo":["정답 ③: 정상에 오르는 것이 하이킹에서 가장 중요하다. (✕ 불일치)","근거: hiking a mountain is not just about reaching the top.(등산은 단순히 정상에 오르는 것만이 아니다.)","함정: not just(~만이 아닌)는 '다른 것도 중요하다'는 뜻이다."],"why":"글쓴이는 정상에 오르는 것만이 아니라 여정을 즐기는 것도 하이킹이라고 말한다."},{"n":7,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["top - journey","top - weather","bottom - journey","trip - top","end - food"],"a":0,"ans":"top - journey","evs":[["Well, hiking a mountain is not just about reaching the top.","글쎄요, 등산하는 것은 단순히 정상에 오르는 것만이 아닙니다."],["It is also about enjoying the journey.","그것은 여정을 즐기는 것이기도 합니다."]],"ev":["Well, hiking a mountain is not just about reaching the top.","글쎄요, 등산하는 것은 단순히 정상에 오르는 것만이 아닙니다."],"ow":["정답 ○ — 'hiking a mountain is not just about reaching the top.'(정상에 오르는 것만이 아니다.)에서 (A)는 top, 'It is also about enjoying the journey.'(여정을 즐기는 것이기도 하다.)에서 (B)는 journey이므로 맞음.","오답 ✕ — (A)의 top은 맞지만, 즐기라고 한 것은 'the journey'(여정)이지 weather(날씨)가 아님.","오답 ✕ — 'reaching the top'(정상에 오르는 것)이므로 (A)의 bottom(맨 아래)은 틀림. (B)의 journey는 맞음.","오답 ✕ — 정상에 '오르는' 것이 top이고, 즐기는 것은 journey이다. trip과 top의 위치가 서로 바뀐 보기라서 틀림.","오답 ✕ — 글에 end(끝)나 food(음식)에 대한 언급이 없다. 'the top'과 'the journey'가 맞음."],"memo":["정답 ①: 하이킹은 정상(top)에 오르는 것만이 아니라 여정(journey)을 즐기는 것이다.","근거: It is also about enjoying the journey.(그것은 여정을 즐기는 것이기도 합니다.)","함정: journey(여정)는 오르는 과정 전체를 뜻한다."],"why":"하이킹의 핵심은 정상(top)이 아니라 여정(journey)을 즐기는 것이다.","sum":"Hiking is not just about reaching the (A) but also about enjoying the (B).","lab":"완성된 요약문 : "}],"pp":[["Let's go hiking!","하이킹을 가요!"],["Some people say, \"Why do we need to get to the top?","어떤 사람들은 \"우리가 왜 정상에 올라가야 하나요?"],["We have to come back down anyway.\"","어차피 우리는 다시 내려와야 해요.\"라고 말합니다."],["Well, hiking a mountain is not just about reaching the top.","글쎄요, 등산하는 것은 단순히 정상에 오르는 것만이 아닙니다."],["It is also about enjoying the journey.","그것은 여정을 즐기는 것이기도 합니다."],["Look at the amazing views and take in the fresh air.","놀라운 경치를 보고 신선한 공기를 마셔 보세요."],["Why don't you go out and explore nature right now?","지금 바로 밖으로 나가서 자연을 탐험하는 건 어떨까요?"]]},{"qs":[{"n":8,"q":"윗글에서 퍼즐 맞추기의 좋은 점으로 언급된 것은?","o":["친구를 많이 사귈 수 있다.","정신을 맑게 하는 데 좋다.","요리 실력이 좋아진다.","운동이 많이 된다.","시험 점수가 오른다."],"a":1,"ans":"정신을 맑게 하는 데 좋다.","evs":[["Doing puzzles is good for clearing your mind.","퍼즐을 맞추는 것은 정신을 맑게 하는 데 좋아요."],["It will give you a sense of success.","그것은 여러분에게 성취감을 줄 거예요."]],"ev":["Doing puzzles is good for clearing your mind.","퍼즐을 맞추는 것은 정신을 맑게 하는 데 좋아요."],"ow":["오답 ✕ — 글에 친구를 사귀는 것에 대한 언급이 없다. 퍼즐은 'Grab a puzzle and enjoy!'(퍼즐을 잡고 즐겨 보세요!)처럼 혼자 즐기는 활동으로 나옴.","정답 ○ — 'Doing puzzles is good for clearing your mind.'(퍼즐을 맞추는 것은 정신을 맑게 하는 데 좋아요.)라고 했으므로 맞음.","오답 ✕ — 요리는 마지막 취미인 베이킹에서 나오는 이야기이고 퍼즐과는 관계가 없음.","오답 ✕ — 'Carefully put the pieces together'(조심스럽게 조각들을 맞추세요)라는 앉아서 하는 활동이라 운동이 된다는 말은 없음.","오답 ✕ — 시험 점수에 대한 언급은 없다. 가장 가까운 문장은 'It will give you a sense of success.'(성취감을 줄 거예요.)로, 시험과는 무관함."],"memo":["정답 ②: 퍼즐 맞추기는 정신을 맑게 하는 데 좋다.","근거: Doing puzzles is good for clearing your mind.(퍼즐을 맞추는 것은 정신을 맑게 하는 데 좋아요.)","함정: 퍼즐의 또 다른 좋은 점은 마지막 조각을 맞출 때의 성취감(a sense of success)이다."],"why":"퍼즐은 정신을 맑게 하고 마지막 조각을 맞출 때 성취감을 준다."}],"pp":[["Now, take a break with puzzles.","이제 퍼즐로 휴식을 취하세요."],["Carefully put the pieces together, and you will forget about your worries.","조심스럽게 조각들을 맞추세요, 그러면 여러분은 걱정을 잊어버릴 거예요."],["Doing puzzles is good for clearing your mind.","퍼즐을 맞추는 것은 정신을 맑게 하는 데 좋아요."],["And guess what?","그리고 그거 아세요?"],["When you put in the last piece, you will feel great.","마지막 조각을 맞출 때, 여러분은 기분이 아주 좋을 거예요."],["It will give you a sense of success.","그것은 여러분에게 성취감을 줄 거예요."],["Grab a puzzle and enjoy!","퍼즐을 잡고 즐겨 보세요!"]]},{"qs":[{"n":9,"q":"윗글의 제목으로 알맞은 것은?","o":["Character Cookies","Recipe for Cookies","Fats in the Cookies","Bake and Share Cookies!","Baking Needs Just Recipes"],"a":3,"ans":"Bake and Share Cookies!","evs":[["It gives you the joy of sharing.","그것은 여러분에게 나눔의 즐거움을 줍니다."],["Bake something special for your friends or family.","여러분의 친구들이나 가족을 위해 특별한 것을 구워 보세요."],["They will love your cookies!","그들은 여러분의 쿠키를 아주 좋아할 거예요!"]],"ev":["It gives you the joy of sharing.","그것은 여러분에게 나눔의 즐거움을 줍니다."],"ow":["오답 ✕ — 'try different shapes like cats, flowers, or even your favorite characters'(고양이, 꽃, 좋아하는 캐릭터 같은 다양한 모양을 시도해 보세요)가 있지만 캐릭터는 일부 예일 뿐이고 나눔이 빠져서 좁음.","오답 ✕ — 'Follow the recipes, but don't be afraid to get creative.'(조리법을 따르되 창의력을 발휘하세요.)에서 조리법이 나오지만 조리법만 소개하는 글이 아님.","오답 ✕ — 쿠키에 들어 있는 지방(fats)에 대한 언급이 없어 엉뚱한 제목임.","정답 ○ — 'You can make your own cookies.'(자신만의 쿠키를 만들 수 있어요.)와 'It gives you the joy of sharing.'(나눔의 즐거움을 줍니다.)가 핵심이므로 Bake and Share Cookies!(쿠키를 굽고 나누자!)가 알맞음.","오답 ✕ — 'Follow the recipes, but don't be afraid to get creative.'(조리법을 따르되 창의력을 발휘하는 것을 두려워하지 마세요.)라고 했으므로 조리법만 필요하다는 제목은 반대임."],"memo":["정답 ④: Bake and Share Cookies!(쿠키를 굽고 나누자!)","근거: It gives you the joy of sharing.(그것은 여러분에게 나눔의 즐거움을 줍니다.)","함정: 조리법·캐릭터 모양은 글의 일부이고 핵심은 '굽기'와 '나눔'이다."],"why":"쿠키를 직접 굽고 친구와 가족에게 나누는 즐거움이 글의 핵심이다."},{"n":10,"q":"윗글의 내용과 일치하는 것은?","o":["베이킹을 위해 쿠킹 클래스에 가야 한다.","조리법 없이 창의적인 쿠키를 만들어야 한다.","한 가지 모양의 쿠키를 만드는 것이 좋다.","쿠키로 우리 자신을 표현할 수 있다.","우리 자신만을 위해 쿠키를 굽는 것이 좋다."],"a":3,"ans":"쿠키로 우리 자신을 표현할 수 있다.","evs":[["Just express yourself!","그저 여러분 자신을 표현해 보세요!"],["Follow the recipes, but don't be afraid to get creative.","조 function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}

function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){

 });

function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
