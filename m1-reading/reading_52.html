<style>

var D=[{"n":1,"tag":null,"en":"When you walk on snow, you leaves footprints. When you uses social media and visit websites, you leave data.","ko":"당신은 눈 위를 걸을 때, 발자국을 남깁니다. 당신이 소셜 미디어를 사용하고 웹사이트를 방문할 때, 데이터를 남깁니다.","ok":false,"foot":[],"fixes":[{"wrong":"leaves","right":"leave","partial":false,"at":[6],"point":"일반동사 현재형: 주어 you에는 동사원형: leave (leaves 아님)","topic":"일반동사 현재형","memo":"주어 you에는 동사원형: leave (leaves 아님)"},{"wrong":"uses","right":"use","partial":false,"at":[10],"point":"일반동사 현재형: 주어 you에는 동사원형 use 사용","topic":"일반동사 현재형","memo":"주어 you에는 동사원형 use 사용"}]},{"n":2,"tag":null,"en":"They are you digital footprints.","ko":"그것들이 당신의 디지털 발자국입니다.","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[2],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 your 사용"}]},{"n":3,"tag":null,"en":"Why should we think about our digital footprints? Let's read Hohyeon's, Jian's, and Minseo's stories.","ko":"우리는 왜 우리의 디지털 발자국에 관해 생각해야 할까요? 호현, 지안, 그리고 민서의 이야기를 읽어 봅시다.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":"호현이의 이야기","en":"Yesterday, my friend found an photo on the internet. It was me with a funnily face!","ko":"어제 내 친구가 인터넷에서 사진 하나를 찾았어. 그건 우스운 표정을 하고 있는 나였어!","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[4],"point":"관사 a/an: photo는 자음 소리로 시작하므로 a photo","topic":"관사 a/an","memo":"photo는 자음 소리로 시작하므로 a photo"},{"wrong":"funnily","right":"funny","partial":false,"at":[14],"point":"형용사와 부사: 명사 face를 꾸미는 형용사 funny 사용","topic":"형용사와 부사","memo":"명사 face를 꾸미는 형용사 funny 사용"}]},{"n":5,"tag":null,"en":"I wanted run away. I posted the photo on my social media account two year ago and forget about it.","ko":"나는 도망치고 싶었어. 나는 2년 전에 내 소셜 미디어 계정에 그 사진을 올렸고 그것에 대해 잊고 있었어.","ok":false,"foot":[],"fixes":[{"wrong":"run","right":"to run","partial":false,"at":[2],"point":"to부정사의 명사적 용법: want 뒤에는 to부정사 to run 사용","topic":"to부정사의 명사적 용법","memo":"want 뒤에는 to부정사 to run 사용","alt":[1]},{"wrong":"year","right":"ye  use social media and visit websites, you leave data. They are your digital footprints.","Why should we think about our digital footprints? Let's read Hohyeon's, Jian's, and Minseo's stories.","Hohyeon's Story","Yesterday, my friend found a photo on the internet. It was me with a funny face! I wanted to run away. I posted the photo on my social media account two years ago and forgot about it.","Jian's Story","I typed my name on the internet. Then, I found my address, phone number, and school name. Did I share that information? Is there other information about me on the internet? I'm not sure.","Minseo's Story","This afternoon, I logged into my email account on the library computer and printed my homework. Then, I met a friend and walked home with her. But wait a minute. Did I log out of my email account? Oh, no! I didn't.","What do these stories show? You should check your posts and comments on your social media account regularly. Don't post information like your address, phone number, or school name. Log out of your email or social media account when you are not using your own computer. Remember! The internet never forgets."];var PASS_KO=["우리의 디지털 발자국","당신은 눈 위를 걸을 때, 발자국을 남깁니다. 당신이 소셜 미디어를 사용하고 웹사이트를 방문할 때, 데이터를 남깁니다. 그것들이 당신의 디지털 발자국입니다.","우리는 왜 우리의 디지털 발자국에 관해 생각해야 할까요? 호현, 지안, 그리고 민서의 이야기를 읽어 봅시다.","호현이의 이야기","어제 내 친구가 인터넷에서 사진 하나를 찾았어. 그건 우스운 표정을 하고 있는 나였어! 나는 도망치고 싶었어. 나는 2년 전에 내 소셜 미디어 계정에 그 사진을 올렸고 그것에 대해 잊고 있었어.","지안이의 이야기","나는 인터넷에 내 이름을 쳤어. 그리고 나는 내 주소, 전화번호, 그리고 학교 이름을 발견했어. 내가 그 정보를 공유했었나? 인터넷에 나에 대한 다른 정보가 있을까? 난 잘 모르겠어.","민서의 이야기","오늘 오후, 나는 도서관 컴퓨터에서 내 이메일 계정에 로그인해서 숙제를 인쇄했어. 그리고 나는 친구를 만났고 그녀와 함께 집으로 걸어왔어. 하지만 잠시만. 내가 이메일 계정에서 로그아웃했었나? 어떡해! 안 했어.","이 이야기들은 무엇을 보여 주나요? 당신은 당신의 소셜 미디어 계정에 올려진 게시물과 댓글을 정기적으로 확인해야 합니다. 당신의 주소, 전화번호 또는 학교 이름과 같은 정보를 올리지 마세요. 자신의 컴퓨터를 사용하고 있지 않을 때는 이메일이나 소셜 미디어 계정에서 로그아웃하세요. 기억하세요! 인터넷은 절대 잊지 않아요."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["주호는 영어 시험이 걱정이다.","여자아이는 주호가 훌륭한 선수라고 말한다.","주호는 여자아이의 말에 화가 났다.","여자아 위를 걸을 때, 발자국을 남깁니다."],"ow":["오답 ✕ — 'When you walk on snow, you leave footprints.'(눈 위를 걸을 때 발자국을 남깁니다.)는 비유 설명이고, 'They are your digital footprints.'(그것들이 당신의 디지털 발자국입니다.)의 '그것들'은 인터넷에 남기는 데이터라서 틀림.","정답 ○ — 'When you use social media and visit websites, you leave data. They are your digital footprints.'(소셜 미디어를 사용하고 웹사이트를 방문할 때 데이터를 남깁니다. 그것들이 디지털 발자국입니다.)라고 했으므로 맞음.","오답 ✕ — 소리에 대한 언급은 전혀 없고, 디지털 발자국은 'you leave data'(데이터를 남깁니다)라고 설명되어 틀림.","오답 ✕ — 신발 사진에 대한 언급은 없고, 디지털 발자국은 'you leave data'(데이터를 남깁니다)라고 했으므로 틀림.","오답 ✕ — 'The internet never forgets.'(인터넷은 절대 잊지 않아요.)라는 내용과 반대이고, 사진을 지워도 사라진다는 설명은 없어서 틀림."],"memo":["정답 ②: 소셜 미디어를 사용하고 웹사이트를 방문할 때 남기는 데이터","근거: When you use social media and visit websites, you leave data.(소셜 미디어를 사용하고 웹사이트를 방문할 때 데이터를 남깁니다.)","핵심 어휘: digital footprint(디지털 발자국), leave data(데이터를 남기다)"],"why":"디지털 발자국은 인터넷을 사용하면서 남기는 데이터이다."},{"n":7,"q":"Hohyeon's Story의 내용과 일치하는 것은?","o":["어제 호현이는 인터넷에서 친구의 사진을 찾았다.","호현이는 우스운 표정의 자기 사진을 보고 도망치고 싶었다.","호현이는 그 사진을 오늘 소셜 미디어에 올렸다.","호현이는 사진을 올린 것을 잘 기억하고 있었다.","호현이의 친구가 그 사진을 지워 주었다."],"a":1,"ans":"호현이는 우스운 표정의 자기 사진을 보고 도망치고 싶었다.","evs":[["It was me with a funny face!","그건 우스운 표정을 하고 있는 나였어!"],["I wanted to run away.","나는 도망치고 싶었어."],["I posted the photo on my social media account two years ago and forgot about it.","나는 2년 전에 내 소셜 미디어 계정에 그 사진을 올렸고 그것에 대해 잊고 있었어."]],"ev":["It was me with a funny face!","그건 우스운 표정을 하고 있는 나였어!"],"ow":["오답 ✕ — 'Yesterday, my friend found a photo on the internet.'(어제 내 친구가 인터넷에서 사진 하나를 찾았어.)라고 했지만 그 사진은 'It was me with a funny face!'(그건 우스운 표정을 하고 있는 나였어!)처럼 호현이 자신의 사진이라 틀림.","정답 ○ — 'It was me with a funny face!'(그건 우스운 표정을 하고 있는 나였어!), 'I wanted to run away.'(나는 도망치고 싶었어.)라고 했으므로 맞음.","오답 ✕ — 'I posted the photo on my social media account two years ago'(나는 2년 전에 내 소셜 미디어 계정에 그 사진을 올렸고)라고 했으므로 오늘 올린 것이 아니라서 틀림.","오답 ✕ — 'and forgot about it'(그것에 대해 잊고 있었어)이라고 했으므로 잘 기억하고 있었다는 보기는 틀림.","오답 ✕ — 사진을 지워 주었다는 언급이 없고, 가장 가까운 문장 'I posted the photo on my social media account t
