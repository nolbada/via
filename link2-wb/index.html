// 공통 데이터 도우미. 각 챕터 파일(ch/chNN.js)이 BEGIN → A(...) 순서로 항목을 넣는다.
const ITEMS=[],CHAPS={},UN={};let CURCH=0;
function BEGIN(ch,name,units){CURCH=ch;CHAPS[ch]={name:name,units:Object.keys(units)};Object.keys(units).forEach(k=>{UN[ch+"-"+k]=Object.assign({ch:ch,k:k},units[k])})}
function A(u,sec,n,kind,o){const it=Object.assign({ch:CURCH,u:String(u),sec:sec,n:n,kind:kind},o);it.uk=CURCH+"-"+it.u;it.id=it.uk+"."+sec+"."+n;ITEMS.push(it)}
function SECLAB(it){const s=it.sec,L=s.slice(-1),lv=s.length==2?"심화":"기본";
 return(it.u=="CH"?"챕터 연습문제 ":"UNIT 연습 ")+lv+" "+L+" · "+it.n+"번"}
function SECSHORT(it){const s=it.sec,L=s.slice(-1);return(it.u=="CH"?"챕":"")+(s.length==2?"심":"기")+L+"-"+it.n}
function C(u,sec,n,q,opts,ans,full,ko,h1,h2,h3,pen){A(u,sec,n,"c",{q:q,opts:opts,ans:ans,full:full,ko:ko,h:[h1,h2,h3],pen:pen})}
function M(u,sec,n,q,opts,ans,full,ko,h1,h2,h3,pen){A(u,sec,n,"m",{q:q,opts:opts,ans:ans,full:full,ko:ko,h:[h1,h2,h3],pen:pen})}
function W(u,sec,n,q,ans,full,ko,h1,h2,h3,pen,bank){const o={q:q,ans:ans,full:full,ko:ko,h:[h1,h2,h3],pen:pen};if(bank)o.bank=bank;A(u,sec,n,"w",o)}

{
BEGIN(1,"여러 가지 동사",{

const sel=s=>{const m=[...s.matchAll(/\(([^)]*)\)/g)];return m[m.length-1][1].split(" / ")};

GA(1,"A",[
["My new sweater feels (soft / softly).","soft","My new sweater feels soft.","내 새 스웨터는 부드럽게 느껴진다.",S1,"1) feels(원형 feel: 느끼다)는 감각동사예요. 2) 감각동사 뒤는 어떤 품사 자리일까요? soft(부드러운)와 softly(부드럽게)를 비교해 봐요.","-ly가 안 붙은 쪽이에요.","feel + 형용사 (softly는 안 돼요)"],
["This soap (smells / smells like) flowers.","smells like","This soap smells like flowers.","이 비누는 꽃 같은 냄새가 난다.",S1,"1) 빈칸 뒤에 flowers(꽃들)가 와요. 형용사일까요, 명사일까요? 2) 감각동사 뒤에 명사가 올 때는 어떻게 이어야 하는지 ‘내신 적중’ 박스를 봐요.","like가 붙은 쪽이에요.","감각동사 + like + 명사"],
["The girl’s voice (sounded / sounded like) cheerful.","sounded","The girl’s voice sounded cheerful.","그 소녀의 목소리는 쾌활하게 들렸다.",S1,"1) 뒤에 cheerful(쾌활한)이 와요. 이 말은 명사일까요, 형용사일까요? 2) like를 붙이는 건 명사가 올 때뿐이에요.","like가 없는 쪽이에요.","sound 뒤에 형용사가 오면 like는 빼요"],
["Ashley and Mark look (sad / sadly).","sad","Ashley and Mark look sad.","애슐리와 마크는 슬퍼 보인다.",S1,"1) look(보이다)도 감각동사예요. 2) sad(슬픈)와 sadly(슬프게) 중 형용사는 어느 쪽일까요?","-ly 없는 짧은 쪽이에요.","look(~해 보이다) + 형용사"],
["Some parents ask too much (of / to) their children.","of","Some parents ask too much of their children.","어떤 부모들은 자녀에게 너무 많은 것을 요구한다.",S3,"1) ask(원형 ask: 요구하다)는 수여동사예요. 2) ‘너무 많은 것’을 먼저 쓰고 사람(their children)을 뒤로 보냈어요. 표에서 ask가 어느 줄에 있는지 찾아요.","ask는 표에서 혼자 한 줄을 차지하는 특별한 동사예요. o로 시작해요.","ask(요구하다)는 of를 쓰는 동사"],

["The man showed us his room.<br>→ The man showed his room ___ us.","to","The man showed his room to us.","그 남자는 우리에게 그의 방을 보여 주었다.",S3,"1) showed(원형 show: 보여 주다)는 수여동사예요. 2) 사람(us)을 뒤로 보냈으니 앞에 전치사가 필요해요. 표에서 show가 어느 줄에 있는지 찾아요.","t로 시작하는 두 글자예요.","show + 물건 + to + 사람"],

["우리 선생님은 항상 우리에게 숙제를 많이 내주신다. (us / a lot of / homework / gives)<br>My teacher always ___.","gives us a lot of homework","My teacher always gives us a lot of homework.","우리 선생님은 항상 우리에게 숙제를 많이 내주신다.",S2,"1) 주어 My teacher는 3인칭 단수이고 always(항상)가 있어서 현재형 동사에 s가 붙어요. 2) 전치사가 없으니 ‘우리에게’(사람) → ‘숙제를’(물건) 순서예요.","모두 네 덩어리예요. 동사로 시작하고 homework로 끝나요.","수여동사 + 사람 + 물건 (전치사 없음)",["us","a lot of","homework","gives"]],
["그 아기는 천사처럼 보인다. (like / an angel / the baby / looks)","The baby looks like an angel","The baby looks like an angel.","그 아기는 천사처럼 보인다.",S1,"1) 주어는 the baby(그 아기), 동사는 looks(원형 look: 보이다)예요. 2) 뒤에 an angel(천사)이라는 명사가 와요. 감각동사 뒤에 명사가 올 때의 규칙을 떠올려요.","The baby로 시작하고 an angel로 끝나요.","look like + 명사 (~처럼 보이다)",["like","an angel","the baby","looks"]],
["나는 엄마에게 문자 메시지를 보냈다. (to / a text message / I / sent / my mom)","I sent a text message to my mom","I sent a text message to my mom.","나는 엄마에게 문자 메시지를 보냈다.",S3,"1) 주어 I 뒤에 과거 동사 sent(원형 send: 보내다)가 와요. 2) to가 주어졌으니 ‘물건 + to + 사람’ 순서로 써요.","I로 시작하고 my mom으로 끝나요.","send + 물건 + to + 사람",["to","a text message","I","sent","my mom"]],

["I (want / keep / expect) you to be honest.",["want","expect"],"I want you to be honest. / I expect you to be honest.","나는 네가 정직하기를 바란다. / 나는 네가 정직하기를 기대한다.",T4,"1) 목적어 you 뒤에 to be가 이어져 있어요. 2) 이 형태(to부정사)를 보어로 쓰는 동사만 골라요. keep(유지하다)은 어떤 보어를 쓰는지도 떠올려요.","답은 두 개예요. keep은 제외예요.","want · expect는 to부정사 보어 동사"],
["My brother (found / told / asked) me to turn down the music.",["told","asked"],"My brother told me to turn down the music. / My brother asked me to turn down the music.","내 형은 내게 음악 소리를 줄이라고 말했다. / 부탁했다.",T4,"1) me 뒤에 to turn down(줄이다)이 와요. 2) ‘~하라고 말하다, 부탁하다’ 뜻으로 to부정사가 따라오는 동사를 찾아요. found(원형 find: 여기다)는 어떤 보어와 쓸까요?","답은 두 개예요. found는 제외예요.","tell · ask 뒤에 to V가 이어짐"],
["The news made him (sad / excitedly / depressed).",["sad","depressed"],"The news made him sad. / The news made him depressed.","그 소식은 그를 슬프게 했다. / 우울하게 했다.",T3,"1) made(원형 make: 만들다) 뒤 him을 설명하는 자리예요. 2) 이 자리에 오는 품사에 맞지 않는 보기를 먼저 지워요.","답은 두 개예요. -ly로 끝나는 보기를 빼요.","make + 목적어 + 형용사 (sad, depressed)"],
["She (advised / told / kept) me to drink more water.",["advised","told"],"She advised me to drink more water. / She told me to drink more water.","그녀는 내게 물을 더 마시라고 조언했다. / 말했다.",T4,"1) me 뒤에 to drink가 와요. 2) keep(유지하다)은 to부정사를 보어로 쓸 수 있는지 박스를 확인해요.","답은 두 개예요. kept(원형 keep)는 제외예요.","advise · tell + 목적어 + to V"],
["They always (keep / expect / make) this room warm for me.",["keep","make"],"They always keep this room warm for me. / They always make this room warm for me.","그들은 항상 이 방을 나를 위해 따뜻하게 해 둔다.",T3,"1) this room(목적어) 뒤에 warm(따뜻한)이라는 형용사가 와요. 2) 형용사를 보어로 쓰는 동사를 골라요. expect(기대하다)는 어떤 보어와 쓸까요?","답은 두 개예요. expect는 제외예요.","keep · make + 목적어 + 형용사"],
["We (called / named / thought) our cat Choco.",["called","named"],"We called our cat Choco. / We named our cat Choco.","우리는 우리 고양이를 초코라고 불렀다. / 이름 지었다.",T2,"1) Choco는 이름(명사)이에요. 2) 목적격 보어로 명사(이름)를 쓰는 동사를 골라요. thought(원형 think: 생각하다)는 형용사 보어와 어울리는 동사예요.","답은 두 개예요. thought는 제외예요.","call · name + 목적어 + 이름(명사)"],
["I (expected / found / thought) his performance amazing.",["found","thought"],"I found his performance amazing. / I thought his performance amazing.","나는 그의 공연이 놀랍다고 생각했다.",T3,"1) amazing(놀라운)은 형용사예요. 2) ‘~가 …하다고 여기다’ 뜻으로 형용사 보어를 쓰는 동사를 골라요. expected(원형 expect: 기대하다)는 to부정사와 써요.","답은 두 개예요. expected는 제외예요.","find · think + 목적어 + 형용사"],
["The members of the club (made / elected / forced) Sarah their new president.",["made","elected"],"The members of the club made Sarah their new president. / The members of the club elected Sarah their new president.","동아리 회원들은 사라를 새 회장으로 만들었다. / 선출했다.",T2,"1) their new president(그들의 새 회장)는 명사구예요. 2) 명사 보어를 쓰는 동사를 골라요. forced(원형 force: 강요하다)는 to부정사와 쓰는 동사예요.","답은 두 개예요. forced는 제외예요.","make · elect + 목적어 + 직책(명사)"]
]);

["Max encouraged me <u>play</u> the guitar again.","to play","Max encouraged me to play the guitar again.","맥스는 내가 기타를 다시 연주하도록 격려했다.",T4,"1) encouraged(원형 encourage: 격려하다)는 박스에 있는 to부정사 동사예요. 2) 밑줄 친 동사에 빠진 말이 있어요.","두 단어예요. t로 시작해요.","encourage + 목적어 + to V"],
["We named our daughter <u>Anna</u>.","O","We named our daughter Anna.","우리는 딸의 이름을 애나라고 지었다.",T2,"1) named(원형 name: 이름 짓다) 뒤에 목적어 our daughter가 있어요. 2) 이름(명사)이 보어로 바로 오는 게 맞는지 확인해요.","고칠 곳이 없어요. 정답은 한 글자 O예요.","name + 목적어 + 이름: 맞음"],
["His visit made his mother <u>happily</u>.","happy","His visit made his mother happy.","그의 방문은 그의 어머니를 행복하게 했다.",T3,"1) made(원형 make: 만들다) 뒤 his mother를 설명하는 자리예요. 2) 밑줄 친 말의 품사가 맞는지 봐요.","부사를 형용사로 바꿔요. h로 시작하는 다섯 글자예요.","made + 목적어 + 형용사 (happily X)"],
["I want you <u>get up</u> early tomorrow morning.","to get up","I want you to get up early tomorrow morning.","나는 네가 내일 아침 일찍 일어나기를 바란다.",T4,"1) want(원하다) 뒤 보어의 형태를 박스에서 확인해요. 2) 밑줄 친 get up 앞에 필요한 말이 있어요.","세 단어예요. t로 시작해요.","want + 목적어 + to V (get up도 같음)"],
["She always tells me <u>to be</u> positive.","O","She always tells me to be positive.","그녀는 항상 내게 긍정적이 되라고 말한다.",T4,"1) tells(원형 tell: 말하다) 뒤 me와 보어가 이어져요. 2) to be의 형태가 박스의 규칙과 맞는지 확인해요.","고칠 곳이 없어요. 정답은 한 글자 O예요.","tell + 목적어 + to be: 맞음"],
["The teacher ordered her <u>leave</u> the room.","to leave","The teacher ordered her to leave the room.","선생님은 그녀에게 교실에서 나가라고 명령했다.",T4,"1) ordered(원형 order: 명령하다)도 박스에 있는 동사예요. 2) leave(떠나다) 앞에 필요한 말이 있어요.","to를 앞에 붙여요. 두 단어예요.","order + 목적어 + to V (명령)"]
]);

["너는 그 우유를 차갑게 유지해야 한다. (should, keep, cold)<br>→ You ___.","should keep the milk cold","You should keep the milk cold.","너는 그 우유를 차갑게 유지해야 한다.",T3,"1) should(~해야 한다) 뒤에는 동사원형 keep(유지하다)이 와요. 2) ‘우유를’(목적어) → ‘차갑게’(형용사) 순서예요.","should로 시작해 cold로 끝나요. 모두 다섯 단어예요.","should keep + 목적어 + 형용사"],
["Luke는 나를 거짓말쟁이라고 불렀다. (call, a liar)<br>→ Luke ___.","called me a liar","Luke called me a liar.","루크는 나를 거짓말쟁이라고 불렀다.",T2,"1) 과거 이야기라서 call(부르다)을 과거형으로 써요. 2) ‘나를’(목적어) → ‘거짓말쟁이라고’(명사 보어) 순서예요.","c로 시작하는 과거형 동사로 시작해요. 모두 네 단어예요.","call + 사람 + 명사 (~라고 부르다)"],
["우리 부모님은 마침내 내가 개를 키우도록 허락하셨다. (allow, have a dog)<br>→ My parents finally ___.","allowed me to have a dog","My parents finally allowed me to have a dog.","우리 부모님은 마침내 내가 개를 키우도록 허락하셨다.",T4,"1) ‘허락하다’ allow는 과거형으로 써요. 2) 목적어 me 뒤에 ‘키우도록’을 to부정사로 이어요.","allow를 과거형으로 바꿔 시작해요. 모두 여섯 단어예요.","allow + 목적어 + to V (~하도록 허락)"],

GA(3,"A",[

["He saw her (running / to run) at the park.","running","He saw her running at the park.","그는 공원에서 그녀가 달리고 있는 것을 보았다.",R1,"1) saw(원형 see: 보다)는 지각동사예요. 2) 지각동사 뒤 보어는 동사원형이나 -ing예요. to부정사는 가능할까요?","-ing 쪽이에요.","see + 목적어 + V-ing (진행 중임을 강조)"],
["I heard your phone (ring / to ring) just a few minutes ago.","ring","I heard your phone ring just a few minutes ago.","나는 몇 분 전에 네 전화가 울리는 것을 들었다.",R1,"1) heard(원형 hear: 듣다)는 지각동사예요. 2) 지각동사의 보어 자리에 to를 붙일 수 있는지 확인해요.","to가 없는 쪽이에요.","hear + 목적어 + 동사원형 (to 없음)"],
["We smelled something (burning / is burning) in the kitchen.","burning","We smelled something burning in the kitchen.","우리는 부엌에서 무언가 타는 냄새를 맡았다.",R1,"1) smelled(원형 smell: 냄새를 맡다)가 이미 문장의 동사예요. 2) 동사를 한 문장에 또 하나(is burning) 넣을 수 있을까요?","is가 없는 쪽이에요.","something burning: 동사 하나만, 보어는 V-ing"],
["My mom won’t let me (go / to go) to the festival.","go","My mom won’t let me go to the festival.","우리 엄마는 내가 축제에 가도록 허락하지 않을 것이다.",R2,"1) let(허락하다, ~하게 하다)은 사역동사예요. 2) 사역동사 뒤 목적어(me) 다음 보어 형태를 박스에서 찾아요.","to가 없는 쪽이에요.","let + 목적어 + 동사원형 (to 안 씀)"],
["The teacher had us (clean / to clean) our lockers.","clean","The teacher had us clean our lockers.","선생님은 우리가 사물함을 청소하게 하셨다.",R2,"1) had(원형 have: ~하게 하다)는 사역동사로 쓰였어요. 2) 사역동사 let, make, have 뒤 보어의 모양을 떠올려요.","to가 없는 쪽이에요.","시키는 have: have + 목적어 + 동사원형"],
["Megan can never get her brother (do / to do) the laundry.","to do","Megan can never get her brother to do the laundry.","메건은 결코 남동생이 빨래를 하게 할 수가 없다.",R2,"1) get(원형 get: ~하게 하다)은 사역동사처럼 해석돼요. 2) 하지만 p.16 아래쪽 안내에서 get의 보어 형태가 특별하다고 말해요.","to가 붙은 쪽이에요.","get은 예외: get + 목적어 + to V"],

  "네 단어예요. one's는 Brad에 맞게 h로 시작하는 소유격으로 바꿔요.","지금 하는 일 → is + v-ing, one's는 his로"],

  "다섯 단어예요. knit에 -ing를 붙일 때 t를 한 번 더 써요.","~하고 있었다 → was + v-ing(t를 겹쳐요)"],
 ["우리말과 일치하도록 진행형과 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>내 동생은 거실에서 TV를 보고 있다. (watch TV, the living room)<br>My brother ___.","is watching TV in the living room","My brother is watching TV in the living room.","내 동생은 거실에서 TV를 보고 있다.",

WR(3,"A",[

  "has not 뒤에 s로 시작하는 4글자 p.p.를 써요.","has + not + p.p. (see-saw-seen)"],
 ["( ) 안의 말을 이용하여 현재완료 문장을 완성하시오.<br>My sister ___ her room yet. (not, clean)","has not cleaned / hasn't cleaned","My sister has not[hasn't] cleaned her room yet.","내 여동생은 아직 그녀의 방을 청소하지 않았다.",

  "본책 p.30 ‘현재완료란?’의 표(I/we/they/you + have)와 불규칙 p.p. 표(A-B-B형)를 보세요.",

  "본책 p.32 POINT 1 ‘현재완료의 개념과 형태’의 시간 그림(과거에서 현재까지)을 보세요.",

 ["보기에서 알맞은 말을 골라 현재완료 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>보기: be, take, arrive, play, fall<br>All the leaves ___ from this tree.","have fallen","All the leaves have fallen from this tree.","모든 나뭇잎이 이 나무에서 떨어졌다.",
  "본책 p.32 POINT 1 표와 본책 p.30 불규칙 p.p. 표를 보세요.",
  "1) 나뭇잎이 나무에서 ‘떨어졌다’이므로 fall(떨어지다)을 써요.  2) 주어 All the leaves는 복수라 have를 써요.  3) fall은 fall-fell-fallen으로 변해요.",
  "have + f로 시작하는 6글자예요.","복수 주어 → have + p.p. (fall-fell-fallen)"],
 ["보기에서 알맞은 말을 골라 현재완료 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>보기: be, take, arrive, play, fall<br>My parents ___ married for fifteen years.","have been","My parents have been married for fifteen years.","우리 부모님은 결혼한 지 15년이 되었다.",
  "본책 p.30 불규칙 p.p. 표의 A-B-C형 줄 맨 앞 동사를 보세요.",
  "1) married(결혼한 상태)는 형용사처럼 쓰이고, ‘~인 상태이다’는 be동사가 맡아요.  2) for fifteen years(15년 동안)는 계속이에요.  3) 주어 My parents는 복수예요.",
  "have + b로 시작하는 4글자예요.","be의 p.p. = been (계속)"],
 ["보기에서 알맞은 말을 골라 현재완료 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>보기: be, take, arrive, play, fall<br>She ___ swimming lessons since last month.","has taken","She has taken swimming lessons since last month.","그녀는 지난달부터 수영 수업을 들어 왔다.",
  "본책 p.30 불규칙 p.p. 표의 A-B-C형 줄 맨 끝 동사를 보세요.",
  "1) since last month(지난달 이후로)는 계속이에요.  2) 수업을 ‘듣다’는 take lessons예요.  3) 주어 She는 3인칭 단수라 has를 써요.",
  "has + t로 시작하는 5글자예요.","take-took-taken"],
 ["보기에서 알맞은 말을 골라 현재완료 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>보기: be, take, arrive, play, fall<br>I ___ the guitar since I was ten years old.","have played","I have played the guitar since I was ten years old.","나는 열 살 때부터 기타를 연주해 왔다.",
  "본책 p.32 POINT 1의 예문(I have lived in this house since last year.)을 보세요.",
  "1) 남은 동사 중 악기와 어울리는 것은 play(연주하다)예요.  2) since I was ten years old(열 살 때부터)는 계속이에요.  3) 주어 I는 have를 써요.",
  "have + p로 시작하는 6글자(played)예요.","since + 시점 → have + p.p."]
]);
WR(3,"SB",[
 ["밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>We <u>have just arrived</u> at the airport.","O","We have just arrived at the airport.","우리는 방금 공항에 도착했다.",
  "본책 p.30 ‘현재완료란?’의 표와 본책 p.34 POINT 3(완료: just, already, yet)를 보세요.",
  "1) just(막)는 완료를 나타내는 대표적인 말이에요.  2) 주어 We는 복수라 have를 쓰고, arrived는 규칙 변화 p.p.예요.",
  "모양이 모두 맞아요. 그대로 두면 돼요.","have + just + p.p. = 막 ~했다"],
 ["밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>She <u>has wrote</u> poems since she was in high school.","has written","She has written poems since she was in high school.","그녀는 고등학교 때부터 시를 써 왔다.",
  "본책 p.30 불규칙 p.p. 표를 보세요. write는 표에 없지만 같은 A-B-C형이에요.",
  "1) has 뒤에는 과거형이 아니라 p.p.가 와야 해요.  2) wrote는 write(쓰다)의 과거형이에요.  3) write-wrote-written으로 변해요.",
  "w로 시작하는 7글자예요.","write-wrote-written"],
 ["밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>Jason <u>has lost</u> his bike at the park yesterday.","lost","Jason lost his bike at the park yesterday.","Jason은 어제 공원에서 자전거를 잃어버렸다.",
  "본책 p.32 POINT 2 ‘과거시제 vs. 현재완료’ 아래 박스(yesterday와 현재완료를 같이 쓰지 않아요)를 보세요.",
  "1) yesterday(어제)는 구체적인 과거 시점을 나타내는 말이에요.  2) 이런 말이 있으면 현재완료를 쓸 수 없어요.",
  "has는 빼고 과거형 한 단어로 써요. l로 시작하는 4글자예요.","yesterday + 현재완료 X → 과거형 lost"],
 ["밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>We <u>haven't see</u> her for many years.","haven't seen","We haven't seen her for many years.","우리는 수년 동안 그녀를 보지 못했다.",
  "본책 p.30 ‘현재완료의 부정문’(have not은 haven't로)과 A-B-C형 표를 보세요.",
  "1) haven't는 have not의 줄임말이라 뒤에 p.p.가 와요.  2) see(보다)는 see-saw-seen으로 변해요. 원형 see는 p.p.가 아니에요.",
  "haven't 뒤에 s로 시작하는 4글자를 써요.","haven't + p.p. (see-saw-seen)"],
 ["밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>Where <u>you have been</u> all this time?","have you been","Where have you been all this time?","너 지금까지 내내 어디에 있었니?",
  "본책 p.32 POINT 1 표 아래 ‘의문사가 있는 현재완료의 의문문’ 설명을 보세요.",
  "1) 의문사가 있는 현재완료 의문문은 「의문사 + have + 주어 + p.p.」 순서예요.  2) 지금 문장은 you와 have의 순서가 거꾸로예요.",
  "주어와 have 중 무엇이 먼저 와야 할지, 두 단어의 순서만 바꿔 보세요.","의문사 + have/has + 주어 + p.p."],
 ["밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br><u>Have you tried</u> Mexican food before?","O","Have you tried Mexican food before?","너는 전에 멕시코 음식을 먹어 본 적이 있니?",
  "본책 p.30 ‘현재완료의 의문문’(Have/Has + 주어 + p.p. ~?)을 보세요.",
  "1) before(전에)는 경험을 묻는 데 자주 쓰여요.  2) Have 다음에 주어 you, 그리고 p.p. tried(원형 try: 시도하다)가 순서대로 왔어요.",
  "순서도 모양도 모두 맞아요. 그대로 두면 돼요.","Have + 주어 + p.p. ~? = ~한 적 있니?"],
 ["밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>Adrian <u>has never ate</u> these cookies before.","has never eaten","Adrian has never eaten these cookies before.","Adrian은 전에 이 쿠키를 먹어 본 적이 없다.",
  "본책 p.30 불규칙 p.p. 표의 A-B-C형 줄을 보세요.",
  "1) has never 뒤에는 p.p.가 와야 해요.  2) ate는 eat(먹다)의 과거형이에요.  3) eat의 p.p.는 다른 모양이에요.",
  "has never 뒤에 e로 시작하는 5글자예요.","eat-ate-eaten"]
]);
WR(3,"SC",[

 ["주어진 문장을 지시대로 바꿔 쓰시오.<br>They have known each other since they were young.<br>의문문으로","Have they known each other since they were young","Have they known each other since they were young?","그들은 어렸을 때부터 서로 알고 지냈니?",
  "본책 p.30 ‘현재완료의 의문문’을 보세요.",
  "1) have를 주어 they 앞으로 보내요.  2) 첫 글자는 대문자로 쓰고 끝에 물음표를 붙여요.",
  "Have they known ... ? 순서예요.","Have + they + known ~? (질문 순서)","","1(의문)"],
 ["주어진 문장을 지시대로 바꿔 쓰시오.<br>Rebecca has lived in New York all her life.<br>부정문으로","Rebecca has not lived in New York all her life","Rebecca has not[hasn't] lived in New York all her life.","Rebecca는 평생 New York에 살지 않았다.",
  "본책 p.30 ‘현재완료의 부정문’을 보세요.",
  "1) 주어 Rebecca는 3인칭 단수라 has를 써요.  2) has와 lived 사이에 not을 넣어요.",
  "Rebecca has not lived ... 로 시작해요.","3인칭 단수 부정: has not[hasn't] + p.p.","","2(부정)"],

  "1) has를 주어 Rebecca 앞으로 보내요.  2) 끝에 물음표를 붙여요.",
  "Has Rebecca lived ... ? 순서예요.","Has + 이름 주어 + p.p. ~?","","2(의문)"],
 ["주어진 문장을 지시대로 바꿔 쓰시오.<br>He has watched a lot of football games before.<br>부정문으로","He has not watched a lot of football games before","He has not[hasn't] watched a lot of football games before.","그는 전에 축구 경기를 많이 본 적이 없다.",
  "본책 p.30 ‘현재완료의 부정문’을 보세요.",
  "1) has 뒤에 not을 넣어요.  2) 나머지는 그대로 두고, watched(원형 watch: 보다)도 바꾸지 않아요.",
  "He has not watched ... 로 시작해요.","not은 has 바로 뒤 한 자리","","3(부정)"],
 ["주어진 문장을 지시대로 바꿔 쓰시오.<br>He has watched a lot of football games before.<br>의문문으로","Has he watched a lot of football games before","Has he watched a lot of football games before?","그는 전에 축구 경기를 많이 본 적이 있니?",
  "본책 p.30 ‘현재완료의 의문문’을 보세요.",
  "1) has를 주어 he 앞으로 보내요.  2) 대문자 He는 이제 문장 중간이니 소문자 he로 써요.",
  "Has he watched ... ? 순서예요.","Has he + p.p. ~? (He는 소문자로)","","3(의문)"],

  "본책 p.30 ‘현재완료의 부정문’을 보세요.",

CR(4,"A",[
 ["Have you (been / gone) to this place before?","been","Have you been to this place before?","너는 전에 이곳에 와 본 적이 있니?",
  "본책 p.34 POINT 2 ‘경험’과 POINT 4 아래 ‘내신 적중’ 박스(have been to와 have gone to 비교)를 보세요.",
  "1) before(전에)와 Have you ~?는 ‘~해 본 적 있니?’라는 경험을 물어요.  2) 두 표현 중 ‘가 본 적 있다’(경험)를 뜻하는 쪽을 골라요. 다른 하나는 ‘가 버리고 지금 없다’예요.",
  "be동사의 p.p.인 b로 시작하는 4글자예요.","have been to = 가 본 적 있다(경험)"],
 ["He has (been / gone) to the market. He will be back soon.","gone","He has gone to the market. He will be back soon.","그는 시장에 갔다. 그는 곧 돌아올 것이다.",
  "본책 p.34 POINT 4 ‘결과’와 그 아래 ‘내신 적중’ 박스를 보세요.",
  "1) 뒤 문장 He will be back soon(그는 곧 돌아올 거야)을 보면 지금 이곳에 없어요.  2) ‘가 버리고 지금 없다’는 결과를 나타내는 쪽을 골라요.",
  "go의 p.p. g로 시작하는 4글자예요.","have gone to = 가 버리고 없다(결과)"],
 ["The students have (yet / already) had lunch.","already","The students have already had lunch.","학생들은 이미 점심을 먹었다.",
  "본책 p.34 POINT 3 ‘완료’의 just, already, yet 설명을 보세요.",
  "1) yet(아직)은 부정문이나 의문문에서 써요.  2) 이 문장은 긍정문이고 ‘이미 먹었다’는 뜻이 되어야 해요.",
  "a로 시작하는 7글자예요.","긍정문 + 이미 → already"],
 ["It has not rained (for / since) two months.","for","It has not rained for two months.","두 달 동안 비가 오지 않았다.",
  "본책 p.34 POINT 1 ‘계속’ 아래 박스(since + 기준 시점, for + 기간)를 보세요.",
  "1) two months(두 달)는 시점이 아니라 기간이에요.  2) 기간 앞에는 for를 써요.",
  "since가 아닌 세 글자 보기예요.","for + 기간 / since + 시점"],
 ["She has worked here (for / since) she graduated from college.","since","She has worked here since she graduated from college.","그녀는 대학을 졸업한 이후로 여기서 일해 왔다.",
  "본책 p.34 POINT 1 ‘계속’ 아래 박스(since + 기준 시점)를 보세요.",
  "1) she graduated from college(그녀가 대학을 졸업했다)는 과거의 어느 한 시점이에요.  2) 어떤 시점부터 지금까지를 말할 때는 since를 써요.",
  "for가 아닌 s로 시작하는 5글자 보기예요.","since + 기준 시점(문장도 가능)"],
 ["I haven't received an invitation (yet / already).","yet","I haven't received an invitation yet.","나는 아직 초대장을 받지 못했다.",
  "본책 p.34 POINT 3 ‘완료’의 설명(just, already, yet이 쓰이는 문장)을 보세요.",
  "1) haven't(~하지 않았다)가 있는 부정문이에요.  2) 부정문에는 ‘아직’이라는 뜻의 말을 써요.",
  "y로 시작하는 3글자예요.","부정문 + 아직 → yet"]
]);
WR(4,"B",[
 ["주어진 문장을 현재완료 문장으로 바꿀 때, 빈칸에 알맞은 말을 쓰시오.<br>George went to Rome, and he is still there.<br>→ George ___ ___ to Rome.","has gone","George has gone to Rome.","George는 로마에 가 버렸다.",
  "본책 p.34 POINT 4 ‘결과’ 설명과 아래 ‘내신 적중’ 박스를 보세요.",
  "1) 로마에 가서 지금도 그곳에 있다는 이야기예요.  2) 과거에 가서 지금 여기에 없는 상태는 ‘결과’ 용법이에요.  3) 주어 George는 3인칭 단수예요.",
  "has + g로 시작하는 4글자예요.","have/has gone to = 가 버리고 없다"],

 "조동사는 c나 w로 시작해요(could는 이미 나왔으니 다른 것). 의미는 ㅇ으로 시작하는 두 글자예요.","요청 Could you ~? = 다른 조동사로 바꿔도 같은 뜻"],
["Emma is not able to understand French.<br>→ Emma ___ understand French.  (의미: 추측 / 능력)","cannot[can't], 능력","Emma cannot[can't] understand French. (능력)","엠마는 프랑스어를 이해하지 못한다. (능력)",
 "본책 p.44 POINT 1 can 표 ‘능력’ 줄의 부정 예문을 보세요.",
 "1) is not able to는 ‘~할 수 없다’예요.  2) 같은 뜻을 can의 부정으로 써요.  3) ‘할 수 없다’는 추측이 아니라 무엇을 나타낼까요?",
 "조동사는 c로 시작하고 줄임말도 돼요. 의미는 ㄴ으로 시작하는 두 글자예요.","is not able to = cannot (능력의 부정)"]
]);
WS(1,"SB",[
["Fish <u>can don't</u> live without water.","cannot[can't]","Fish cannot[can't] live without water.","물고기는 물 없이 살 수 없다.",
 "본책 p.44 POINT 1 can 표 ‘능력’ 줄의 부정 예문을 보세요.",
 "1) can과 don't가 나란히 붙어 있어요.  2) 조동사는 두 개를 겹쳐 쓰지 않아요.  3) ‘~할 수 없다’를 나타내는 조동사 하나로 바꿔요.",
 "c로 시작하는 can의 부정이에요(cannot 또는 줄임말).","can don't (X) → cannot[can't] (O)"],
["We were able <u>get</u> to the meeting on time.","to get","We were able to get to the meeting on time.","우리는 제시간에 회의에 도착할 수 있었다.",
 "본책 p.44 POINT 1 can 표 ‘능력’ 줄 괄호 속, be able 뒤에 오는 모양을 보세요.",
 "1) were able(~할 수 있었다) 뒤에 동사 get(도착하다)이 바로 왔어요.  2) be able 다음에는 꼭 있어야 하는 짝꿍이 있어요.  3) 그 짝꿍을 get 앞에 붙여요.",
 "get 앞에 t로 시작하는 두 글자를 붙여요.","be able to에서 to를 빠뜨리지 않기"],
["She will <u>spends</u> her vacation in Europe.","spend","She will spend her vacation in Europe.","그녀는 유럽에서 휴가를 보낼 것이다.",
 "본책 p.44 POINT 3 제목 ‘will + 동사원형’을 보세요.",
 "1) will은 조동사예요.  2) 주어가 She(3인칭 단수)여도 조동사 뒤 동사는 -s를 붙이지 않아요.  3) spends(원형 spend: 보내다)에서 -s를 떼요.",
 "s로 시작하는 다섯 글자예요.","주어가 She여도 will spend (spends (X))"],
["He may <u>is</u> interested in computer programming.","be","He may be interested in computer programming.","그는 컴퓨터 프로그래밍에 관심이 있을지도 모른다.",
 "본책 p.44 POINT 2 제목 ‘may + 동사원형’을 보세요.",
 "1) may(~일지도 모른다) 뒤에 is가 왔어요.  2) 조동사 뒤에는 동사원형만 와요.  3) be동사의 원래 모양을 써요.",
 "b로 시작하는 두 글자예요.","may 뒤 be동사는 be (may is (X))"],
["By the time he was six, he <u>can</u> read.","could","By the time he was six, he could read.","여섯 살 무렵에 그는 글을 읽을 수 있었다.",
 "본책 p.44 POINT 1 can 표 아래, 과거의 능력을 설명한 글을 보세요.",
 "1) By the time he was six(그가 여섯 살이었을 때쯤)는 과거 이야기예요.  2) can은 현재형이라 시제가 안 맞아요.  3) 과거의 능력을 나타내는 모양으로 고쳐요.",
 "c로 시작하는 다섯 글자예요(was able to도 가능해요).","과거의 능력은 could 또는 was able to"],
["<u>May</u> you get some butter at the store for me?","Will[Would, Can, Could]","Will[Would, Can, Could] you get some butter at the store for me?","나 대신 가게에서 버터 좀 사다 줄래?",
 "본책 p.44 POINT 2 may 표를 보고, ‘요청’ 줄이 있는 다른 두 표와 비교해 보세요.",
 "1) for me(나를 위해)가 있으니 상대에게 ‘~해 줄래?’ 하고 부탁하는 문장이에요.  2) may에는 ‘요청’ 뜻이 없어요.  3) 요청 뜻을 가진 조동사로 바꿔요.",
 "w나 c로 시작하는 조동사예요.","나 대신 사다 달라는 부탁 → Will you ~?"],
["<u>May</u> I have your name and address?","O","May I have your name and address?","당신의 이름과 주소를 알려 주시겠어요?",
 "본책 p.44 POINT 2 may 표 ‘허가’ 줄의 마지막 예문을 보세요.",
 "1) May I ~?는 ‘~해도 될까요?’ 하고 허락을 구하는 정중한 질문이에요.  2) 주어가 I이고 뒤에 동사원형 have(가지다)가 왔어요.  3) 규칙에 맞는지 확인해요.",
 "고칠 곳이 없어요. ○(O)라고 써요.","May I + 동사원형 ~?은 맞는 허락 질문"],
["Dan <u>might</u> call you tomorrow.","O","Dan might call you tomorrow.","댄이 내일 너에게 전화할지도 모른다.",
 "본책 p.44 POINT 2 ‘불확실한 추측’ 줄 오른쪽의 might 설명을 보세요.",
 "1) might는 may와 비슷한 추측의 조동사예요.  2) 뒤에 call(전화하다)이 동사원형으로 왔어요.  3) might가 쓰일 수 있는 자리인지 표에서 확인해요.",
 "고칠 곳이 없어요. ○(O)예요.","might는 may보다 약한 추측 (~일지도 모른다)"]
]);
WS(1,"SC",[
["그는 우리에게 동의하지 않을지도 몰라. (may, agree with)<br>He ___.","may not agree with us","He may not agree with us.","그는 우리에게 동의하지 않을지도 모른다.",
 "본책 p.44 POINT 2 may 표 ‘불확실한 추측’ 줄의 부정 예문을 보세요.",
 "1) ‘~일지도 모른다’ → may예요.  2) ‘동의하지 않을지도’는 may 바로 뒤에 not을 붙여요.  3) agree with(~에게 동의하다) 뒤에 ‘우리에게’에 해당하는 말을 써요.",
 "모두 5단어예요. 첫 단어는 may, 마지막은 ‘우리를’ 뜻의 한 단어예요.","may not + 동사원형 (~않을지도 모른다)"],
["Andrew는 그 시험을 쉽게 통과할 수 있었다. (be able to, pass the exam)<br>Andrew ___ easily.","was able to pass the exam","Andrew was able to pass the exam easily.","앤드루는 그 시험을 쉽게 통과할 수 있었다.",
 "본책 p.44 POINT 1 can 표 ‘능력’ 줄 괄호와 아래 설명 글을 보세요.",
 "1) ‘통과할 수 있었다’는 과거의 능력이에요.  2) be able to를 쓰되 be동사를 과거형으로 맞춰요.  3) 주어 Andrew는 한 명이에요.",
 "첫 단어는 w로 시작하는 be동사 과거형이고 모두 6단어예요(pass the exam은 3단어).","과거의 능력: was/were able to + 동사원형"],
["너희들은 이번 주말에 영화를 보러 가도 된다. (may, go to the movies)<br>You ___ this weekend.","may go to the movies","You may go to the movies this weekend.","너희는 이번 주말에 영화를 보러 가도 된다.",
 "본책 p.44 POINT 2 may 표의 ‘허가’ 줄을 보세요.",
 "1) ‘가도 된다’는 허락(허가)이에요.  2) 주어 You 뒤에 may + 동사원형(go: 가다)을 써요.  3) go to the movies(영화 보러 가다)는 주어진 말 그대로 이어서 써요.",
 "첫 단어는 may예요. 모두 5단어예요.","허가 may + 동사원형 (~해도 된다)"],
["오후 2시 이후에 내게 전화해 줄래? (can, call)<br>___ after 2:00 p.m.?","Can you call me","Can you call me after 2:00 p.m.?","오후 2시 이후에 내게 전화해 줄래?",
 "본책 p.44 POINT 1 can 표의 ‘요청’ 줄을 보세요.",
 "1) ‘~해 줄래?’는 부탁하는 말이에요.  2) 의문문은 조동사를 맨 앞에 써요: 조동사 + 주어 + 동사원형.  3) call(전화하다) 뒤에 ‘나에게’에 해당하는 말을 붙여요.",
 "모두 4단어예요. 첫 단어는 대문자 C, 마지막은 me예요.","요청 의문문은 Can you + 동사원형 ~?"]

CS(2,"A",[
["Ella is fine. You (must / don't have to) worry about her.",["must","don't have to"],"don't have to","Ella is fine. You don't have to worry about her.","엘라는 괜찮아. 너는 그녀를 걱정할 필요가 없다.",
 "본책 p.46 POINT 1 아래 ‘내신 적중’ 박스의 표를 보세요.",
 "1) Ella is fine(엘라는 괜찮다)이라서 걱정할 이유가 없어요.  2) 걱정하는 것이 ‘의무’일까요, ‘불필요’일까요?  3) ‘불필요’를 나타내는 말은 박스 표에서 찾아요.",
 "두 번째 보기예요.","엘라가 괜찮으면 걱정할 필요 없다 = don't have to"],
["You (has to / have to) be careful when you drive in the rain.",["has to","have to"],"have to","You have to be careful when you drive in the rain.","비 올 때 운전하면 조심해야 한다.",
 "본책 p.46 POINT 1 must 표 ‘의무’ 줄의 괄호 (= ...)를 보세요.",
 "1) 비 올 때 운전은 조심해야 한다는 ‘의무’예요.  2) 의무 표현의 모양은 주어에 따라 달라져요.  3) 주어 You(너)일 때 어느 쪽인지 골라요.",
 "첫 번째 보기(has)가 아닌 쪽이에요.","have to는 I/You/복수에, has to는 3인칭 단수에"],
["Before getting on the bus, you (should / shouldn't) buy your tickets first.",["should","shouldn't"],"should","Before getting on the bus, you should buy your tickets first.","버스를 타기 전에 표를 먼저 사는 게 좋다.",
 "본책 p.46 POINT 2 should 표를 보세요.",
 "1) Before getting on the bus는 ‘버스에 타기 전에’라는 뜻이에요.  2) 타기 전에 표를 사는 건 하는 게 좋은 일이에요.  3) ‘~하는 게 좋다’는 긍정이에요.",
 "n't가 안 붙은 첫 번째 보기예요.","충고 should = ~하는 게 좋다"],
["They (must not / don't have to) make any noise. The baby is sleeping.",["must not","don't have to"],"must not","They must not make any noise. The baby is sleeping.","그들은 어떤 소음도 내서는 안 된다. 아기가 자고 있다.",
 "본책 p.46 POINT 1 아래 ‘내신 적중’ 박스의 표를 보세요.",
 "1) 아기가 자고 있으니 소리를 내면 안 되는 상황이에요.  2) ‘~하면 안 된다’(강한 금지)와 ‘~할 필요 없다’(불필요) 중 어느 쪽일까요?  3) make noise(소음을 내다)는 하지 말아야 할 행동이에요.",
 "첫 번째 보기예요.","강한 금지 = must not (~해서는 안 된다)"],
["She looks like Chloe. She (must / can't) be her sister.",["must","can't"],"must","She looks like Chloe. She must be her sister.","그녀는 클로이를 닮았다. 그녀는 클로이의 자매임이 틀림없다.",
 "본책 p.46 POINT 1 must 표의 ‘강한 추측’ 줄을 보세요.",
 "1) looks like(원형 look like: ~처럼 보이다)라서 클로이와 닮았어요.  2) 닮았으니 자매일 가능성이 아주 높아요.  3) ‘~임이 틀림없다’와 ‘~일 리가 없다’ 중 알맞은 쪽을 골라요.",
 "첫 번째 보기예요.","강한 추측 must be = ~임이 틀림없다"],
["The children (should not / have to) swim in this river. It's dangerous.",["should not","have to"],"should not","The children should not swim in this river. It's dangerous.","아이들은 이 강에서 수영하지 않는 게 좋다. 위험하다.",
 "본책 p.46 POINT 2 should 표에서 부정 예문을 보세요.",
 "1) 뒤 문장 It's dangerous(위험하다)가 힌트예요.  2) 위험한 강에서 수영하는 건 하는 게 좋을까요, 안 하는 게 좋을까요?  3) ‘~하지 않는 게 좋다’를 나타내는 쪽을 골라요.",
 "첫 번째 보기예요.","should not = ~하지 않는 게 좋다 (충고)"],
["You (had to / don't have to) pick me up at the airport. I can take a taxi.",["had to","don't have to"],"don't have to","You don't have to pick me up at the airport. I can take a taxi.","나를 공항에 데리러 올 필요 없어. 나는 택시를 탈 수 있어.",
 "본책 p.46 POINT 1 내신 적중 박스의 표에서 ‘불필요’ 줄을 보세요.",
 "1) 뒤에 I can take a taxi(나는 택시를 탈 수 있어)라고 했어요.  2) 그러면 데리러 올 필요가 있을까요?  3) had to는 ‘~해야 했다’라는 과거 의무라서 지금 상황과 안 맞아요.",
 "두 번째 보기예요.","택시를 탈 수 있으면 데리러 올 필요 없음, 현재라서 had to (X)"]
]);
WS(2,"B",[
["우리는 그녀가 도착하기를 기다려야 했다.<br>We <u>have to</u> wait for her to arrive.","had to","We had to wait for her to arrive.","우리는 그녀가 도착하기를 기다려야 했다.",
 "본책 p.46 POINT 1 아래, must의 과거형을 설명한 글을 보세요.",
 "1) 우리말이 ‘기다려야 했다’라서 과거예요.  2) have to는 현재형이라 시제가 안 맞아요.  3) 의무 표현을 과거 모양으로 바꿔요.",
 "h로 시작하는 세 글자 + to예요.","과거의 의무는 had to"],
["그는 다음번에는 더 열심히 공부해야 할 것이다.<br>He <u>will must</u> study harder next time.","will have to","He will have to study harder next time.","그는 다음번에는 더 열심히 공부해야 할 것이다.",
 "본책 p.46 POINT 1 아래, 미래형을 설명한 글을 보세요.",
 "1) ‘공부해야 할 것이다’는 미래의 의무예요.  2) will과 must는 둘 다 조동사라서 연달아 쓸 수 없어요.  3) must 대신 같은 뜻의 다른 표현을 will 뒤에 써요.",
 "세 단어예요. will 뒤에 h로 시작하는 네 글자와 to가 와요.","will must (X) → will have to (O)"],
["우리 선생님이 틀렸을 리가 없다.<br>My teacher <u>shouldn't</u> be wrong.","cannot[can't]","My teacher cannot[can't] be wrong.","우리 선생님이 틀렸을 리가 없다.",
 "본책 p.46 POINT 1 아래, 강한 추측의 부정형을 설명한 글을 보세요.",
 "1) ‘~일 리가 없다’라는 뜻이에요.  2) shouldn't는 ‘~하지 않는 게 좋다’(충고)라서 뜻이 달라요.  3) ‘~임이 틀림없다’(must be)의 부정은 특별한 모양을 써요.",
 "c로 시작하는 말이에요. 줄임말도 돼요.","must be의 부정은 can't be (~일 리가 없다)"],
["너는 질문에 답해야 한다.<br>You <u>don't have to</u> answer the question.","must[have to, should]","You must[have to, should] answer the question.","너는 그 질문에 답해야 한다.",
 "본책 p.46 POINT 1 must 표의 ‘의무’ 줄을 보세요.",
 "1) 우리말은 ‘답해야 한다’(의무)예요.  2) don't have to는 ‘~할 필요 없다’(불필요)라서 반대 뜻이에요.  3) 의무를 나타내는 표현으로 바꿔요.",
 "m으로 시작하는 조동사를 쓰거나, have to나 should도 돼요.","의무 표현으로 고치기: 필요 없다 (X), 해야 한다 (O)"],
["너는 거짓말을 해서는 안 된다.<br>You <u>don't should</u> tell lies.","should not[shouldn't, must not]","You should not[shouldn't, must not] tell lies.","너는 거짓말을 해서는 안 된다.",
 "본책 p.46 POINT 2 should 표의 부정 예문을 보세요.",
 "1) should는 조동사라서 don't를 앞에 붙이지 않아요.  2) 조동사의 부정은 조동사 바로 뒤에 not이에요.  3) ‘해서는 안 된다’라는 뜻이 나오게 써요.",
 "s로 시작하는 두 단어(should + not)예요. 줄임말 한 단어도 돼요.","조동사 부정 = 조동사 + not (don't should (X))"]
]);
WS(2,"C",[
["나는 어제 일찍 일어나야 했다. (had / I / early / to / wake up)<br>→ ___ yesterday.","I had to wake up early","I had to wake up early yesterday.","나는 어제 일찍 일어나야 했다.",
 "본책 p.46 POINT 1 아래, 의무의 과거형을 설명한 글을 보세요.",

["그녀는 점심값을 낼 필요가 없었다. (have / she / didn't / to / pay / for lunch)<br>→ ___.","She didn't have to pay for lunch","She didn't have to pay for lunch.","그녀는 점심값을 낼 필요가 없었다.",

 "첫 단어는 She, 마지막 두 단어는 for lunch예요. 모두 7단어예요.","과거의 불필요 = didn't have to + 동사원형",["have","she","didn't","to","pay","for lunch"]],
["우리는 모든 야생 동물들을 보호해야 한다. (wild / animals / we / protect / should / all)<br>→ ___.","We should protect all wild animals","We should protect all wild animals.","우리는 모든 야생 동물들을 보호해야 한다.",

 "첫 단어는 We, 마지막 단어는 animals예요. 모두 6단어예요.","의무·충고 should + 동사원형 (protect)",["wild","animals","we","protect","should","all"]],
["Noah가 지금 학교에 있을 리가 없다. (can't / Noah / at school / be)<br>→ ___ now.","Noah can't be at school","Noah can't be at school now.","노아가 지금 학교에 있을 리가 없다.",
 "본책 p.46 POINT 1 아래, 강한 추측의 부정형을 설명한 글을 보세요.",

 "첫 단어는 Noah, 마지막 두 단어는 at school이에요. 모두 5단어예요.","~일 리가 없다 = can't be + 장소·상태",["can't","Noah","at school","be"]]

M(2,"SA",7,"We (should not / must not / have not to) go outside today. A storm is coming.",["should not","must not","have not to"],["should not","must not"],"We should not[must not] go outside today.","우리는 오늘 밖에 나가지 않는 게 좋다. 폭풍이 오고 있다.",

 "h로 시작하는 네 글자예요.","지금의 의무는 have to, 과거는 had to"],

["너의 부모님은 네가 매우 자랑스러움이 틀림없다.<br>Your parents must to be so proud of you.<br>(틀린 부분 → 바르게 고친 말)","to be → be","Your parents must be so proud of you.","너의 부모님은 네가 매우 자랑스러우신 것이 틀림없다.",

 "to를 빼면 b로 시작하는 두 글자만 남아요.","강한 추측 must be (must to be (X))"],
["우리는 물을 낭비하지 말아야 한다.<br>We don't waste water.<br>(틀린 부분 → 바르게 고친 말)","don't → must[should] not","We must[should] not waste water.","우리는 물을 낭비하지 말아야 한다.",

 "g로 시작하는 두 글자예요.","used to + 동사원형 (-ing (X))"],
["We would <u>to eat out</u> every Friday night as a family when I was young.","eat out","We would eat out every Friday night as a family when I was young.","내가 어렸을 때 우리는 매주 금요일 밤에 가족끼리 외식하곤 했다.",

["Emily <u>would</u> have long hair when she was in school.","used to","Emily used to have long hair when she was in school.","에밀리는 학교에 다닐 때 긴 머리였다.",

 ["(It / That) is not easy to finish a big project in a week.","It","It is not easy to finish a big project in a week.","일주일 안에 큰 프로젝트를 끝내는 것은 쉽지 않다.",
  a1+" 아래 ‘가주어 it’ 설명을 보세요.","1) 진짜 주어는 뒤에 있는 to finish a big project(큰 프로젝트를 끝내는 것)예요.  2) 이렇게 긴 주어는 뒤로 보내고, 앞 자리에 대신 앉는 말을 써요.","‘그것’이라는 뜻의 짧은 대명사예요. 두 글자예요.","긴 to부정사 주어 → 가주어 It + 진주어 to V"],
 ["His goal is (becomes / to become) a top soccer player.","to become","His goal is to become a top soccer player.","그의 목표는 최고의 축구 선수가 되는 것이다.",
  a3+"을 보세요. be동사 뒤에 오는 to부정사 설명이 있어요.","1) is(원형 be: ~이다) 뒤에서 주어 His goal(그의 목표)이 무엇인지 설명해 줘요.  2) 그런데 is가 이미 동사라서 또 동사가 올 수는 없어요.","becomes(원형 become: ~이 되다)는 동사 자리가 겹쳐서 안 돼요. to가 붙은 쪽이에요.","be동사 뒤 보어 → to V (~하는 것이다)"],

 ["To follow the rules (is / are) important.","is","To follow the rules is important.","규칙을 따르는 것은 중요하다.",
  a1+" 예문 아래 빨간 글씨 ‘단수 취급’ 설명을 보세요.","1) 주어는 rules(규칙들)가 아니라 To follow the rules(규칙을 따르는 것) 전체예요.  2) 이렇게 길게 이어진 주어는 하나의 일로 봐요.","하나로 보면 be동사는 단수형이에요. 두 글자 is예요.","주어로 쓴 to부정사구는 단수 취급 → is"],

 ["To <u>exercising</u> regularly is my goal this summer.","exercise","To exercise regularly is my goal this summer.","규칙적으로 운동하는 것이 이번 여름의 내 목표이다.",

 ["To visit a new country is an amazing experience.<br>[가주어 이용] ___ is ___ a new country.","It / an amazing experience to visit","It is an amazing experience to visit a new country.","새로운 나라를 방문하는 것은 놀라운 경험이다.",
  a1+" 아래 ‘To play this game is fun. = It is fun to play this game.’ 바꾸기를 보세요.","1) 문장 맨 앞의 긴 주어 To visit a new country(새로운 나라를 방문하는 것)를 뒤로 보내요.  2) 비어진 첫 자리에는 가주어를 쓰고, is 뒤에는 보어를 먼저 쓴 다음 to부정사를 이어요.","첫 칸은 I로 시작하는 두 글자예요. 둘째 칸은 다섯 단어로, 보어(놀라운 경험)를 먼저 쓰고 그 뒤에 to + 동사원형을 이어요.","긴 주어 → It is 보어 + to V"],

 ["Please let me know what I should do next.<br>[의문사 + to부정사 이용] Please let me know ___.","what to do next","Please let me know what to do next.","다음에 무엇을 해야 할지 제게 알려 주세요.",

 ["My goal is ___ the championship.","to win[winning]","My goal is to win[winning] the championship.","내 목표는 우승하는 것이다.",
  a3+"을 보세요. be동사 뒤에 오는 말을 확인해요.","1) My goal is 다음에는 목표가 ‘무엇’인지 설명하는 말이 와요.  2) 보기 중 ‘이기다’ 뜻의 동사가 문맥에 맞아요. 그리고 to를 붙인 모양으로 써요.","to 뒤에 w로 시작하는 세 글자가 와요. (-ing 모양도 정답으로 인정돼요.)","be동사 뒤 보어 → to V (~하는 것)",BK1],
 ["She taught the boy how ___ chopsticks.","to use","She taught the boy how to use chopsticks.","그녀는 그 소년에게 젓가락 사용하는 법을 가르쳤다.",
  a4+" 표에서 how 줄을 보세요.","1) taught(원형 teach: 가르치다)의 내용이 ‘젓가락을 어떻게 쓰는지’예요.  2) how 뒤는 to + 동사원형이에요. 보기에서 ‘사용하다’를 골라요.","to 뒤에 u로 시작하는 세 글자가 와요.","how to use = 사용하는 법",BK1],
 ["The girl refused ___ cucumbers.","to eat","The girl refused to eat cucumbers.","그 소녀는 오이 먹기를 거부했다.",
  a2+"을 펴서 목적어 자리에 쓰는 to부정사를 확인하세요.","1) refused(원형 refuse: 거부하다)는 ‘~하기를 거부하다’처럼 뒤에 할 일이 와요.  2) 오이(cucumbers)와 어울리는 동사를 보기에서 골라요.","to 뒤에 e로 시작하는 세 글자가 와요.","refuse + to V (~하기를 거부하다)",BK1],
 ["I decided not ___ to the library on Sunday.","to go","I decided not to go to the library on Sunday.","나는 일요일에 도서관에 가지 않기로 결정했다.",
  a2+" 아래 ‘not이나 never를 to 앞에’ 설명을 보세요.","1) not이 이미 앞에 나와 있어요. 부정은 to 바로 앞에 놓는 거예요.  2) 도서관(library)에 ‘가다’는 동사를 골라 to와 함께 써요.","not 뒤에 to를 쓰고 g로 시작하는 두 글자 동사가 와요.","not to V = ~하지 않기로",BK1],
 ["To have such good friends ___ a blessing.","is","To have such good friends is a blessing.","그렇게 좋은 친구들이 있다는 것은 축복이다.",
  a1+" 예문 아래 빨간 글씨 ‘단수 취급’ 설명을 보세요.","1) 주어는 To have such good friends(그런 좋은 친구들이 있는 것) 한 덩어리예요.  2) 문장에 동사가 하나도 없으니 be동사가 필요해요. 보기 be(~이다)를 알맞은 모양으로 써요.","현재형 단수 be동사예요. 두 글자예요.","주어 to부정사구 → 단수 동사 is",BK1],
 ["It was a mistake ___ this expensive car.","to buy","It was a mistake to buy this expensive car.","이렇게 비싼 차를 사는 것은 실수였다.",
  a1+" 아래 가주어 설명을 보세요.","1) It은 가주어예요. 진짜 주어는 빈칸에서 시작하는 ‘~하는 것’이에요.  2) 보기에서 ‘사다’를 고른 뒤 진주어 모양으로 써요.","to 뒤에 b로 시작하는 세 글자가 와요.","It was 명사 + to V (진주어)",BK1]
]);
WW(1,"SB",FX2,[
 ["I hope <u>see</u> you again soon.","to see","I hope to see you again soon.","곧 다시 만나기를 바라요.",
  a2+"의 ‘want, need, decide, promise, agree, expect 등’ 줄을 보세요.","1) hope(바라다)는 ‘~하기를 바란다’처럼 뒤에 하고 싶은 일이 와요.  2) 이런 동사 뒤에서는 동사 모양이 그냥 나오면 안 돼요.","see(보다) 앞에 t로 시작하는 두 글자를 더해요.","hope + to V (~하기를 바라다)"],
 ["My dream is <u>become</u> an astronaut.","to become","My dream is to become an astronaut.","내 꿈은 우주비행사가 되는 것이다.",
  a3+"을 펴세요. be동사 뒤 주격 보어 자리에 오는 모양을 확인해요.","1) is(원형 be) 뒤에서 My dream(내 꿈)이 무엇인지 설명해요.  2) 설명 자리에 올 수 있는 동사 모양을 떠올려요.","become(되다)은 그대로 두고, 앞에 t로 시작하는 두 글자를 더해요.","주격 보어 → to V"],
 ["We decided <u>to leave</u> our hometown when we grow up.","O","We decided to leave our hometown when we grow up.","우리는 크면 고향을 떠나기로 결정했다.",
  a2+"을 보세요. decide 뒤의 모양을 확인해요.","1) decided(원형 decide: 결정하다) 뒤에 밑줄 친 모양이 맞는지 봐요.  2) decide는 목적어로 to부정사만 쓰는 동사예요.","이미 올바른 모양이에요. 고칠 곳이 없으니 O를 써요.","decide + to V (이 문장은 O)"],
 ["To break bad habits <u>are</u> not easy.","is","To break bad habits is not easy.","나쁜 습관을 깨는 것은 쉽지 않다.",
  a1+" 예문 아래 빨간 글씨 ‘단수 취급’ 설명을 보세요.","1) 주어는 To break bad habits(나쁜 습관을 깨는 것) 전체예요.  2) 중간의 habits가 복수여도 덩어리는 하나의 일이에요.","are(원형 be: ~이다)를 단수 주어에 맞는 현재형으로 바꿔요. 두 글자예요.","주어 to부정사구는 단수 동사"],
 ["We agreed <u>to met</u> at the shopping mall yesterday.","to meet","We agreed to meet at the shopping mall yesterday.","우리는 어제 쇼핑몰에서 만나기로 합의했다.",
  a2+"을 보세요. to 뒤의 동사 모양이 핵심이에요.","1) agreed(원형 agree: 동의하다)는 to부정사를 목적어로 써요. to는 맞아요.  2) 그런데 to 뒤에는 과거형이 아니라 원래 모양이 와야 해요. met(원형 meet: 만나다)을 고쳐요.","met을 원래 모양 meet(m으로 시작하는 네 글자)으로 바꿔요.","to 뒤 동사는 항상 동사원형"],
 ["It is difficult <u>master</u> Chinese in a year.","to master","It is difficult to master Chinese in a year.","일 년 안에 중국어를 완전히 익히는 것은 어렵다.",
  a1+"의 It ~ to V 예문을 보세요.","1) It is difficult(어려운) 다음에는 ‘무엇이 어려운지’가 와요.  2) 그 부분은 진주어이니 to부정사 모양으로 써야 해요.","master(완전히 익히다) 앞에 t로 시작하는 두 글자를 더해 두 단어로 만들어요.","It is difficult + 진주어 to master"],
 ["She promised <u>to pick</u> Josh up from school.","O","She promised to pick Josh up from school.","그녀는 조시를 학교에서 데리러 가겠다고 약속했다.",
  a2+"의 ‘promise’ 예문을 보세요.","1) promised(원형 promise: 약속하다) 뒤에 to부정사가 쓰였어요.  2) pick up(데리러 가다)은 한 덩어리 표현이고 모양은 문제없어요.","올바른 문장이에요. O를 써요.","promise + to V (이 문장은 O)"],
 ["The teacher told us what <u>doing</u> in case of an emergency.","to do","The teacher told us what to do in case of an emergency.","선생님은 우리에게 비상시에 무엇을 해야 하는지 말씀해 주셨다.",
  a4+" 표의 what 줄을 보세요.","1) what(무엇을) 뒤에 동사가 바로 이어지는 덩어리예요.  2) ‘무엇을 ~할지’는 what 뒤에 -ing가 아니라 to부정사를 써요.","doing(하는 것)을 두 단어로 바꿔요. 첫 단어는 t로 시작하고, 둘째 단어는 원형이에요.","what + to V = 무엇을 ~할지"]
]);
WW(1,"SC","(주어진 문장을 지시대로 바꿔 쓰시오) ",[
 ["To eat too much candy is bad for your teeth.<br>[가주어 이용]","It is bad for your teeth to eat too much candy.","It is bad for your teeth to eat too much candy.","사탕을 너무 많이 먹는 것은 치아에 나쁘다.",
  a1+" 아래 ‘To play this game is fun. = It is fun to play this game.’를 보세요.","1) 긴 주어 To eat too much candy(사탕을 너무 많이 먹는 것)를 문장 뒤로 보내요.  2) 맨 앞에는 가주어를 두고 bad for your teeth(치아에 나쁜)는 is 바로 뒤에 써요.","I로 시작하는 열한 단어 문장이에요. ‘가주어 + is + 보어’를 먼저 쓰고 진주어는 맨 끝에 둬요.","긴 주어 → It ~ to V"],
 ["To raise a child requires patience and understanding.<br>[가주어 이용]","It requires patience and understanding to raise a child.","It requires patience and understanding to raise a child.","아이를 키우는 것은 인내심과 이해심을 필요로 한다.",
  a1+" 아래 가주어 바꾸기를 보세요.","1) 동사는 requires(원형 require: 필요로 하다)예요. be동사가 없다는 점을 눈여겨봐요.  2) 주어 To raise a child(아이를 키우는 것)만 뒤로 보내고 나머지는 그대로 둬요.","I로 시작해요. 동사 requires와 그 목적어는 그대로 두고, 원래 주어만 문장 맨 끝으로 옮겨요.","동사가 일반동사여도 It ~ to V 가능"],
 ["I have no idea what I should get my mom for her birthday.<br>[의문사 + to부정사 이용]","I have no idea what to get my mom for her birthday.","I have no idea what to get my mom for her birthday.","엄마 생신 선물로 무엇을 사 드려야 할지 모르겠다.",
  a4+" 아래 ‘의문사 + to부정사’ 바꿔 쓰기를 보세요.","1) what I should get(내가 무엇을 사야 할지)가 줄여야 할 부분이에요.  2) I should를 없애고 get(사다) 앞에 to를 넣어요.","I have no idea what까지는 그대로예요. what 뒤의 I should가 t로 시작하는 두 글자 한 단어로 바뀌어요.","의문사 + 주어 + should V → 의문사 + to V"],
 ["Would you show me how I should use the washing machine?<br>[의문사 + to부정사 이용]","Would you show me how to use the washing machine?","Would you show me how to use the washing machine?","세탁기 사용법을 보여 주시겠어요?",
  a4+" 표에서 how 줄을 보세요.","1) how I should use(내가 어떻게 사용해야 하는지)가 줄일 대상이에요.  2) how는 남기고 I should를 to로 바꿔요.","Would you show me how까지는 그대로예요. how 뒤의 I should가 두 글자 한 단어로 줄어요.","how I should ~ → how to ~ (주어·should 삭제)"],
 ["We can’t decide where we should stay in Sydney.<br>[의문사 + to부정사 이용]","We can’t decide where to stay in Sydney.","We can’t decide where to stay in Sydney.","우리는 시드니에서 어디에 머물러야 할지 정하지 못하고 있다.",
  a4+" 표에서 where 줄을 보세요.","1) where we should stay(어디에 머물러야 하는지)를 줄여요.  2) we should 두 단어가 사라지고 to가 들어가요.","완성하면 여덟 단어 문장이에요. where 뒤의 두 단어가 t로 시작하는 한 단어로 줄어요.","where we should V → where to V"]
]);

WW(2,"A","(밑줄 친 to부정사가 꾸며주는 말을 쓰시오) ",[
 ["It is the right thing <u>to do</u>.","the right thing","It is the right thing to do.","그것은 해야 할 올바른 일이다.",
  b1+"를 펴세요. to부정사가 어디를 꾸며 주는지 나와 있어요.","1) to do(할)는 형용사처럼 앞말을 꾸며 줘요. 꾸밈을 받는 말은 보통 to부정사 바로 앞에 있어요.  2) ‘무엇을 할’ 일인지 생각해 봐요. 앞의 명사 덩어리(관사 포함)를 찾아요.","is 뒤에 있는 세 단어짜리 덩어리예요. t로 시작해요.","to V는 바로 앞 명사를 꾸민다"],
 ["I am looking for cold water <u>to drink</u>.","cold water","I am looking for cold water to drink.","나는 마실 차가운 물을 찾고 있다.",
  b1+"의 예문 ‘snacks to eat’를 보세요.","1) to drink(마실)는 ‘무엇을’ 마시는지 설명해 줘요.  2) to drink 앞에서 ‘마실 것’에 해당하는 명사를 찾아요. 형용사가 붙어 있어요.","두 단어예요. 차가운 상태를 말하는 형용사와 명사예요.","명사(구) + to V = ~할 명사"],
 ["They don’t have enough food <u>to eat</u>.","enough food","They don’t have enough food to eat.","그들은 먹을 충분한 음식이 없다.",
  b1+" 예문을 다시 보세요.","1) to eat(먹을)는 먹을 대상이 되는 말을 꾸며요.  2) have(가지다)의 목적어 덩어리를 찾아요. 양을 나타내는 말이 앞에 붙어 있어요.","e로 시작하는 단어와 food를 합친 두 단어예요.","enough + 명사 + to V"],
 ["He has some clothes <u>to wash</u>.","some clothes","He has some clothes to wash.","그는 빨 옷이 좀 있다.",
  b1+"를 보세요. ‘~할’로 해석되는 모양이에요.","1) to wash(씻을, 빨)는 ‘무엇을’ 빠는지 알려 줘요.  2) has(원형 have: 가지다)의 목적어를 찾아요. 수량 말이 같이 붙어 있어요.","s로 시작하는 두 단어예요.","명사 + to V = ~할 명사"],
 ["I have nothing <u>to say</u> to you right now.","nothing","I have nothing to say to you right now.","나는 지금 너에게 할 말이 없다.",
  b1+" 아래 ‘-thing, -one, -body’ 설명을 보세요.","1) to say(말할)는 ‘말할 것’을 설명해요.  2) 대명사 중에 -thing으로 끝나는 말이 to say 바로 앞에 있어요. 한 단어예요.","n으로 시작하는 일곱 글자 대명사예요.","-thing 대명사 + to V"],
 ["She needs more time <u>to finish</u> her homework.","more time","She needs more time to finish her homework.","그녀는 숙제를 끝낼 시간이 더 필요하다.",
  b1+"를 보세요. 시간도 명사예요.","1) to finish(끝낼)는 ‘무엇을 끝내는 데’ 필요한 것을 꾸며요.  2) needs(원형 need: 필요하다)의 목적어 덩어리를 찾아요.","m으로 시작하는 단어와 time 두 단어예요.","time to V = ~할 시간"],
 ["Jessica has a lot of work <u>to do</u> today.","a lot of work","Jessica has a lot of work to do today.","제시카는 오늘 할 일이 많다.",
  b1+"를 보세요. ‘많은 ~’라는 표현도 한 덩어리로 봐요.","1) to do(할)는 ‘해야 할 것’을 설명해요.  2) 양을 나타내는 표현 ‘많은’과 명사가 한 덩어리로 앞에 있어요.","a로 시작해서 work로 끝나는 네 단어예요.","a lot of + 명사 + to V"],
 ["We need somebody <u>to help</u> us move these tables.","somebody","We need somebody to help us move these tables.","우리는 이 탁자들을 옮기는 것을 도와줄 사람이 필요하다.",
  b1+" 아래 ‘-thing, -one, -body’ 설명을 보세요.","1) to help(도와줄)는 ‘도와줄 사람’을 설명해요.  2) -body로 끝나는 대명사가 need(필요하다) 뒤에 있어요. 한 단어예요.","s로 시작하는 여덟 글자예요.","-body 대명사 + to V"]
]);
WW(2,"B",FX,[
 ["Here are some chairs <u>to sit to</u>.","to sit on","Here are some chairs to sit on.","여기 앉을 의자가 몇 개 있어요.",
  b2+"의 표를 펴세요. 표의 표현들이 왜 끝에 전치사를 달고 있는지 봐요.","1) 의자(chairs)는 ‘앉는’ 행동의 어디에 쓰일까요? ‘의자에 앉다’처럼 전치사가 필요해요.  2) sit(앉다)는 목적어를 바로 못 받는 동사라서 전치사를 붙여요. 밑줄 친 끝의 to가 맞는지 따져 봐요.","끝의 to를 ‘~ 위에’ 뜻의 두 글자 전치사로 바꿔요. o로 시작해요.","to V 뒤 전치사: sit on"],
 ["They kept their promise <u>buying</u> their son a dog.","to buy","They kept their promise to buy their son a dog.","그들은 아들에게 개를 사 주겠다는 약속을 지켰다.",
  b1+"를 보세요. 명사 뒤에서 꾸며 주는 모양을 확인해요.","1) promise(약속)가 ‘무엇을 한다는’ 약속인지 뒤에서 설명해요.  2) 명사 뒤에서 설명하는 말은 -ing가 아니라 to부정사 모양이에요.","buying에서 -ing를 떼고 앞에 t로 시작하는 두 글자를 붙여요.","명사 + to V (약속·계획 등)"],
 ["The old woman had no one <u>to talk</u>.","to talk to","The old woman had no one to talk to.","그 할머니는 이야기를 나눌 사람이 없었다.",
  b2+"의 표를 펴세요. 사람을 꾸미는 표현 끝에 무엇이 남는지 봐요.","1) talk(말하다)는 ‘누구에게’ 말하는지 전치사가 있어야 해요.  2) no one(아무도 ~않다)이 바로 그 ‘누구’ 역할이에요. 전치사가 하나 빠졌어요.","talk 뒤에 두 글자 전치사 t로 시작하는 말을 붙여요.","talk to someone → someone to talk to"],
 ["He may not have a pen <u>to write on</u>.","to write with","He may not have a pen to write with.","그는 쓸 펜이 없을지도 모른다.",
  b2+"의 표를 펴세요. ‘쓸 펜’과 ‘쓸 종이’는 끝에 붙는 전치사가 서로 달라요.","1) 펜은 ‘종이 위’가 아니라 ‘펜을 가지고’ 쓰는 도구예요.  2) 도구는 ‘~로, ~을 가지고’ 뜻의 전치사와 함께 써요.","on을 w로 시작하는 네 글자 전치사로 바꿔요.","a pen to write with (도구)"],
 ["Can I have <u>cold something</u> to drink?","something cold","Can I have something cold to drink?","마실 차가운 것 좀 주실래요?",
  b1+" 아래 ‘-thing + 형용사 + to부정사’ 순서 설명을 보세요.","1) something(어떤 것)처럼 -thing으로 끝나는 말은 형용사가 앞이 아니라 뒤에 와요.  2) 순서를 바꿔 쓰면 돼요.","두 단어의 순서만 서로 바꿔요. s로 시작하는 말이 먼저예요.","-thing + 형용사 + to V"],
 ["She has no desire <u>to eating</u> now.","to eat","She has no desire to eat now.","그녀는 지금 먹고 싶은 마음이 없다.",
  b1+"를 보세요. to 뒤의 동사 모양을 확인해요.","1) desire(바람)가 ‘무엇을 하려는’ 바람인지 to부정사가 설명해요.  2) to 뒤에는 -ing가 아니라 동사원형이 와요.","eating(먹는 것)에서 -ing 세 글자를 떼요.","desire to + 동사원형 (-ing 안 됨)"],
 ["You will have a chance <u>improve</u> your English.","to improve","You will have a chance to improve your English.","너는 영어 실력을 향상시킬 기회를 갖게 될 것이다.",
  b1+"를 보세요. ‘a chance to V’ 모양이에요.","1) chance(기회)가 ‘무엇을 할’ 기회인지 뒤에서 설명해야 해요.  2) 명사 뒤에서 꾸며 주는 동사에는 to가 필요해요.","improve(향상시키다) 앞에 t로 시작하는 두 글자를 더해요.","a chance to V = ~할 기회"]
]);
WW(2,"C","(우리말과 일치하도록 ( ) 안의 말을 바르게 배열하시오) ",[
 ["여행할 때 재미있는 읽을거리를 가져라. (to / take / interesting / read / something)<br>___ when you travel.","Take something interesting to read","Take something interesting to read when you travel.","여행할 때 재미있는 읽을거리를 가져가세요.",
  b1+" 아래 ‘-thing + 형용사 + to부정사’ 순서를 보세요.","1) 명령문이라서 동사 take(가지고 가다)가 맨 앞에 와요.  2) ‘재미있는 읽을거리’는 -thing 대명사 + 형용사 + to V 순서로 놓아요.","T로 시작하는 다섯 단어예요. 형용사 interesting(재미있는)이 -thing 대명사 앞에 오면 틀려요.","명령문 + -thing + 형용사 + to V",["to","take","interesting","read","something"]],
 ["그는 배우가 되는 그의 꿈을 마침내 실현했다. (finally realized / become / his dream / to / an actor / he)<br>___.","He finally realized his dream to become an actor","He finally realized his dream to become an actor.","그는 배우가 되겠다는 꿈을 마침내 이루었다.",
  b1+"를 보세요. 명사 뒤에 to부정사가 오는 순서예요.","1) 주어 He가 먼저, 그다음 finally realized(마침내 깨달았다/실현했다)가 와요.  2) his dream(그의 꿈) 바로 뒤에 ‘무엇이 되려는’ 꿈인지 설명하는 to부정사를 이어요.","He로 시작하는 여덟 단어예요. to부정사 덩어리는 꾸밈받는 명사 바로 뒤에 와요.","명사 + to V (꿈의 내용 설명)",["finally realized","become","his dream","to","an actor","he"]],
 ["그 아기는 따뜻한 입을 것이 필요하다. (needs / warm / the baby / something / to / wear)<br>___.","The baby needs something warm to wear","The baby needs something warm to wear.","그 아기는 입을 따뜻한 것이 필요하다.",
  b1+" 아래 ‘-thing + 형용사 + to부정사’를 보세요.","1) 주어는 the baby(그 아기), 동사는 needs(원형 need: 필요하다)예요.  2) ‘따뜻한 입을 것’은 -thing 대명사 + 형용사 + to V 순서예요.","The로 시작하는 여섯 단어예요. warm(따뜻한)은 -thing 대명사 앞이 아니라 뒤에 와요.","something warm to wear = 입을 따뜻한 것",["needs","warm","the baby","something","to","wear"]],
 ["스키를 탈 충분한 눈이 없다. (to / enough snow / there / isn’t / ski / on)<br>___.","There isn’t enough snow to ski on","There isn’t enough snow to ski on.","스키를 탈 만큼 충분한 눈이 없다.",
  b2+" 아래 표의 전치사 설명을 보세요.","1) ‘~이 없다’는 There isn’t로 시작해요.  2) enough snow(충분한 눈) 뒤에 to ski가 오고, ski(스키 타다)는 ‘눈 위에서’ 타니까 전치사가 필요해요.","There로 시작하는 일곱 단어예요. 전치사는 to부정사 뒤, 문장 맨 끝에 남아요.","명사 + to V + 전치사 (ski on)",["to","enough snow","there","isn’t","ski","on"]]
]);

WW(2,"SA","(to부정사에 밑줄 치고, 꾸며주는 말을 쓰시오) ",[

 ["Max doesn’t have anything to wear to the party.","anything","Max doesn’t have anything to wear to the party.","맥스는 파티에 입고 갈 것이 아무것도 없다.",
  b1+" 아래 ‘-thing’ 설명을 보세요.","1) to wear(입을)는 ‘입을 것’을 설명해요.  2) have(가지다)의 목적어인 -thing 대명사를 찾아요. 부정문에서 쓰는 말이에요.","a로 시작하는 여덟 글자예요.","anything + to V"],
 ["They gave him an opportunity to try again.","an opportunity","They gave him an opportunity to try again.","그들은 그에게 다시 시도할 기회를 주었다.",

 ["He has enough time to finish his essay.","time","He has enough time to finish his essay.","그는 에세이를 끝낼 충분한 시간이 있다.",

 ["I have something wonderful to give you.","something","I have something wonderful to give you.","나는 네게 줄 멋진 것이 있다.",
  b1+" 아래 ‘-thing + 형용사 + to부정사’ 설명을 보세요.","1) to give(줄)는 ‘줄 것’을 설명해요.  2) wonderful(멋진)은 형용사예요. 이 형용사가 꾸며 주는 -thing 대명사가 정답이에요.","s로 시작하는 아홉 글자예요.","something wonderful to give = 줄 멋진 것"],
 ["She has no desire to learn anything new.","desire","She has no desire to learn anything new.","그녀는 새로운 것을 배우고 싶은 마음이 없다.",
  b1+"를 보세요. ‘바람, 욕구’ 같은 명사도 꾸밈을 받아요.","1) to learn(배울)는 ‘배우고 싶은 마음’을 설명해요.  2) has no(~이 없다) 바로 뒤의 명사를 찾아요.","d로 시작하는 여섯 글자예요.","desire + to V = ~하려는 마음"]
]);
WW(2,"SB",FX2,[
 ["He is the best person <u>to talk to</u>.","O","He is the best person to talk to.","그는 이야기하기에 가장 좋은 사람이다.",
  b2+"를 펴세요. talk(말하다) 뒤에 사람이 오려면 무엇이 필요한지 확인해요.","1) person(사람)은 ‘누구에게’ 말하는 대상이에요. talk(말하다) 뒤에 전치사가 필요해요.  2) 밑줄 친 부분에 전치사가 제대로 붙어 있는지 확인해요.","to talk to로 전치사까지 갖췄어요. 고칠 곳이 없으니 O예요.","someone to talk to (이 문장은 O)"],
 ["We’re looking for <u>fun something to do</u>.","something fun to do","We’re looking for something fun to do.","우리는 할 만한 재미있는 것을 찾고 있다.",
  b1+" 아래 ‘-thing + 형용사 + to부정사’ 설명을 보세요.","1) something(어떤 것)처럼 -thing으로 끝나는 말은 형용사가 뒤에 와요.  2) 형용사 fun(재미있는)과 something의 순서를 점검해요.","fun과 something의 순서만 서로 바꿔요. s로 시작하는 말이 먼저예요.","something fun to do (fun은 뒤에)"],
 ["There is nothing <u>to be afraid</u>.","to be afraid of","There is nothing to be afraid of.","두려워할 것은 아무것도 없다.",

 ["Is there anything cold <u>to drink</u> in the fridge?","O","Is there anything cold to drink in the fridge?","냉장고에 마실 차가운 것이 있나요?",
  b1+" 아래 ‘-thing + 형용사 + to부정사’를 보세요.","1) anything cold to drink 순서가 -thing + 형용사 + to V예요.  2) drink(마시다)는 마실 것을 바로 목적어로 받으니 전치사는 필요 없어요.","순서도 모양도 맞아요. O예요.","anything cold to drink (이 문장은 O)"],
 ["I need a box <u>to store</u> this food in.","O","I need a box to store this food in.","나는 이 음식을 넣어 둘 상자가 필요하다.",
  b2+" 아래 ‘a house to live in’ 같은 예를 보세요.","1) 상자(box)는 음식을 ‘안에’ 넣어 두는 곳이에요. 그래서 문장 끝에 in이 있어요.  2) store(보관하다)는 food(음식)를 바로 목적어로 받으니 to store 자체는 그대로 맞아요.","밑줄 친 to store는 올바른 모양이에요. O예요.","a box to store food in (이 문장은 O)"],
 ["Permission <u>entering</u> this building is difficult to get.","to enter","Permission to enter this building is difficult to get.","이 건물에 들어가는 허가를 얻는 것은 어렵다.",
  b1+"를 보세요. ‘허가’ 같은 명사도 to부정사의 꾸밈을 받아요.","1) Permission(허가)이 ‘무엇을 할’ 허가인지 뒤에서 설명해요.  2) 명사 뒤에서 꾸며 주는 동사에는 to가 필요해요.","entering에서 -ing를 떼고 앞에 t로 시작하는 두 글자를 붙여요.","명사 + to V (허가 + ~할)"],
 ["One way <u>improve</u> your English is to read a lot of books.","to improve","One way to improve your English is to read a lot of books.","영어 실력을 키우는 한 가지 방법은 책을 많이 읽는 것이다.",
  b1+"의 ‘a way to succeed’ 예문을 보세요.","1) One way(한 가지 방법)가 ‘무엇을 하는’ 방법인지 설명해야 해요.  2) 방법 뒤에서 설명하는 동사에는 to가 필요해요.","improve(향상시키다) 앞에 t로 시작하는 두 글자를 더해요.","a way to V = ~하는 방법"]
]);
WW(2,"SC","(우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오) ",[
 ["내 여동생은 가지고 놀 새로운 장난감들을 원한다. (want, new toys)<br>My little sister ___.","wants new toys to play with","My little sister wants new toys to play with.","내 여동생은 가지고 놀 새 장난감을 원한다.",
  b2+"의 표를 펴세요. 사람·물건을 ‘가지고’ 노는 표현에 어떤 전치사가 붙는지 봐요.","1) 주어가 3인칭 단수라서 want(원하다)의 모양에 주의해요.  2) ‘가지고 놀’은 toys를 뒤에서 꾸미는 to부정사예요. play(놀다)는 ‘장난감을 가지고’ 노니까 전치사가 필요해요.","w로 시작하는 여섯 단어예요. 마지막 단어는 ‘~을 가지고’ 뜻의 전치사예요.","명사 + to V + 전치사 (play with)"],
 ["그녀는 부모님과 함께 살 멋진 집을 샀다. (buy, a nice house)<br>She ___ with her parents.","bought a nice house to live in","She bought a nice house to live in with her parents.","그녀는 부모님과 함께 살 멋진 집을 샀다.",
  b2+"의 표와 아래 내신 적중 박스를 펴세요. live(살다) 뒤에 왜 전치사가 필요한지 나와 있어요.","1) 과거 이야기예요. buy(사다)의 과거형을 써야 해요.  2) ‘살 집’은 house를 to live가 뒤에서 꾸며요. 집 ‘안에’ 사니 전치사가 필요해요.","b로 시작하는 과거형으로 시작하는 일곱 단어예요. 마지막은 ‘~ 안에’ 뜻의 두 글자 전치사예요.","a house to live in"],
 ["쓰레기를 줄이려는 그의 시도는 성공적이었다. (reduce waste, successful)<br>His attempt ___.","to reduce waste was successful","His attempt to reduce waste was successful.","쓰레기를 줄이려는 그의 시도는 성공적이었다.",
  b1+"를 펴세요. 명사 뒤에서 to부정사가 설명하는 모양이에요.","1) 주어는 His attempt(그의 시도)예요. ‘무엇을 줄이려는’ 시도인지 바로 뒤에서 설명해요.  2) 그 설명이 끝난 뒤에 was(원형 be: ~이었다)와 보어가 와요.","t로 시작하는 다섯 단어예요. 주어를 꾸미는 to부정사 덩어리가 끝난 뒤에 동사가 와요.","명사 + to V + 동사 (주어 꾸밈)"],
 ["당신은 이곳에서 다양한 해양 스포츠를 해 볼 기회를 얻을 것이다. (have a chance, try out)<br>You will ___ a variety of water sports here.","have a chance to try out","You will have a chance to try out a variety of water sports here.","당신은 이곳에서 다양한 수상 스포츠를 해 볼 기회를 갖게 될 것이다.",
  b1+"의 ‘a way to succeed’ 같은 명사 + to부정사를 보세요.","1) will 뒤에는 동사원형 have(가지다)가 와요.  2) ‘기회’라는 명사 chance 뒤에 ‘해 볼’이라는 to부정사를 이어요.","h로 시작하는 여섯 단어예요. 명사 chance(기회) 뒤에 to부정사가 붙어요.","have a chance to V"],
 ["어휘를 복습하라는 너의 충고가 내가 시험에 통과하도록 도왔다. (review the vocabulary, help)<br>Your advice ___ pass the exam.","to review the vocabulary helped me (to)","Your advice to review the vocabulary helped me (to) pass the exam.","어휘를 복습하라는 너의 충고가 내가 시험에 통과하도록 도와주었다.",
  b1+"를 보세요. 주어를 뒤에서 꾸미는 to부정사예요.","1) 주어 Your advice(너의 충고)가 ‘무엇을 하라는’ 충고인지 먼저 설명해요.  2) 그다음에 동사 help(돕다)의 과거형과 목적어 me가 와요. 시제는 과거예요.","t로 시작해요. 주어를 꾸미는 네 단어 덩어리 뒤에 h로 시작하는 과거형 동사와 ‘나를’ 뜻의 대명사가 와요. 끝의 to는 있어도 없어도 돼요.","명사 + to V + 동사 (충고의 내용)"]

WW(3,"A","(밑줄 친 부분에 유의하여 우리말 해석을 완성하시오) ",[
 ["A foreign language is <u>not easy to learn</u>.<br>외국어는 ___ 쉽지 않다.","배우기에","A foreign language is not easy to learn.","외국어는 배우기에 쉽지 않다.",
  c4+"을 펴세요. 형용사 뒤에 붙는 to부정사의 뜻이 나와 있어요.","1) easy(쉬운) 같은 형용사 바로 뒤의 to learn(배우다)은 ‘얼마나 쉬운지’를 말해 줘요.  2) ‘~하기에’라는 뜻으로 풀면 자연스러워요.","‘배우’로 시작하는 네 글자예요. 형용사를 꾸며 주는 ‘~하기에’ 꼴이에요.","형용사 + to V = ~하기에"],
 ["I was silly <u>to believe</u> him again.<br>그를 다시 ___ 내가 어리석었다.","믿다니","I was silly to believe him again.","그를 다시 믿다니 내가 어리석었다.",
  c5+"를 보세요. 사람의 성격이나 상태를 말하는 형용사 뒤의 뜻이 나와 있어요.","1) silly(어리석은)는 내가 어리석다고 ‘판단’하는 말이에요.  2) 그렇게 판단한 근거가 to believe him again(그를 다시 믿다니)이에요. ‘~하다니’로 풀어요.","‘믿’으로 시작하는 세 글자예요.","판단의 근거 = ~하다니"],
 ["He was surprised <u>to see</u> me.<br>그는 나를 ___ 놀랐다.","봐서","He was surprised to see me.","그는 나를 봐서 놀랐다.",
  c2+"을 보세요. 감정을 나타내는 형용사 뒤의 to부정사예요.","1) surprised(놀란)는 감정을 나타내는 말이에요.  2) to see me(나를 보는 것)가 그 감정이 생긴 원인이에요. ‘~해서’로 풀어요.","‘봐’로 시작하는 두 글자예요.","감정 형용사 + to V = ~해서(원인)"],
 ["Joe went to the café <u>to meet</u> his friend.<br>Joe는 친구를 ___ 카페에 갔다.","만나기 위해","Joe went to the café to meet his friend.","Joe는 친구를 만나기 위해 카페에 갔다.",
  c1+"을 보세요. 왜 갔는지를 말해 주는 to부정사예요.","1) went(원형 go: 가다)에서 ‘어디에 갔는지’는 이미 나왔어요. to meet은 ‘왜’ 갔는지 설명해요.  2) ‘갔다’ 앞에 ‘~하려고’라는 목적의 뜻을 넣어요.","‘만나’로 시작해요. 목적을 나타내는 ‘~하기 위해’ 꼴이고, 띄어쓰기를 빼면 다섯 글자예요.","동작 + to V = ~하기 위해(목적)"]
]);
WW(3,"B","(두 문장의 의미가 같도록 to부정사를 이용하여 문장을 완성하시오) ",[
 ["We wanted to get there on time, so we took a taxi.<br>We took a taxi ___ ___ ___ on time.","to get there","We took a taxi to get there on time.","우리는 제시간에 거기에 도착하기 위해 택시를 탔다.",
  c1+"을 보세요. ‘~하려고, so ~’를 to부정사로 바꾸는 법을 확인해요.","1) 앞 문장은 ‘거기에 가려고 했다, 그래서 택시를 탔다’예요.  2) 택시를 탄 목적을 to부정사로 바꿔서 taxi 뒤에 붙여요.","세 칸이에요. 첫 칸은 t로 시작하는 두 글자, 둘째 칸은 g로 시작하는 동사예요.","so + 문장 → 목적의 to V"],
 ["He wanted to watch his favorite show, so he turned on the TV.<br>He turned on the TV ___ ___ his favorite show.","to watch","He turned on the TV to watch his favorite show.","그는 좋아하는 프로그램을 보기 위해 TV를 켰다.",
  c1+"을 다시 보세요. 목적의 to부정사 예문이 있어요.","1) TV를 켠 ‘이유’가 좋아하는 프로그램을 보려는 거예요.  2) 그 이유를 to + 동사원형으로 바꿔 붙여요.","두 칸이에요. 첫 칸은 t로 시작하는 두 글자, 둘째 칸은 w로 시작하는 다섯 글자 동사예요.","켠 목적 → to + 동사원형"],
 ["I helped her, so I was happy.<br>I was happy ___ ___ ___.","to help her","I was happy to help her.","나는 그녀를 도와서 기뻤다.",
  c2+"을 보세요. happy(행복한) 같은 감정 형용사 뒤를 확인해요.","1) was happy(기뻤다)는 감정이에요.  2) 기쁜 ‘원인’은 그녀를 도운 것이에요. 원인을 to부정사로 이어 써요.","세 칸이에요. 첫 칸은 t로 시작하고, 마지막 칸은 ‘그녀를’ 뜻의 목적격 대명사예요.","감정 형용사 + to V(원인)"],
 ["Sharon grew up and became a famous artist.<br>Sharon grew up ___ ___ a famous artist.","to become","Sharon grew up to become a famous artist.","샤론은 자라서 유명한 예술가가 되었다.",
  c3+"를 보세요. grew up(원형 grow up: 자라다) 뒤에 오는 모양이에요.","1) ‘자라서 ~이 되었다’처럼 일이 이어서 일어난 ‘결과’를 말해요.  2) 결과는 to부정사로 나타내요. and became(되었다)을 바꿔요.","두 칸이에요. 첫 칸은 t로 시작하는 두 글자, 둘째 칸에는 became(원형 become: ~이 되다)을 원형으로 써요.","grow up to V = 자라서 ~이 되다(결과)"]
]);
WW(3,"C","(우리말과 일치하도록 ( ) 안의 말을 바르게 배열하시오) ",[
 ["네가 떠나는 것을 보니 슬프다. (am / sad / see / you / I / to / leave)<br>___.","I am sad to see you leave","I am sad to see you leave.","네가 떠나는 것을 보니 슬프다.",
  c2+"을 보세요. ‘슬픈’ 감정 뒤에 to부정사가 와요.","1) 주어 I와 am(원형 be) sad(슬픈)로 시작해요.  2) 슬픈 이유는 ‘네가 떠나는 것을 본 것’이에요. ‘~을 …하는 것을 보다’는 see + 목적어 + 동사원형이에요.","I로 시작하는 일곱 단어예요. see 뒤에는 목적어가 먼저, 동사원형은 맨 끝에 와요.","sad to see you leave = ~하니 슬픈",["am","sad","see","you","I","to","leave"]],
 ["나는 아기를 깨우지 않기 위해 조용히 말했다. (in order / I / spoke quietly / not / to wake)<br>___ the baby.","I spoke quietly in order not to wake","I spoke quietly in order not to wake the baby.","나는 아기를 깨우지 않기 위해 조용히 말했다.",
  c1+" 아래 in order to 설명과 p.58 POINT 2의 ‘to부정사의 부정’을 함께 보세요.","1) I spoke quietly(조용히 말했다)가 먼저 와요.  2) 목적을 강조하는 in order to에 ‘~하지 않기 위해’ 뜻을 넣으려면 not의 자리가 정해져 있어요.","I로 시작해요. 부정어는 to 바로 앞에 붙는다는 규칙을 그대로 지켜요.","in order not to V = ~하지 않기 위해",["in order","I","spoke quietly","not","to wake"]],
 ["나는 빠르게 달렸지만 결국 그 버스를 놓쳤다. (miss / to / the bus / only)<br>I ran fast, ___.","only to miss the bus","I ran fast, only to miss the bus.","나는 빠르게 달렸지만 결국 그 버스를 놓쳤다.",
  c3+" 아래 ‘only + to부정사’ 설명을 보세요.","1) ‘열심히 했지만 결국 ~했다’처럼 좋지 않은 결과를 말해요.  2) 그런 결과를 나타내는 덩어리의 첫 단어를 떠올려요.","o로 시작하는 다섯 단어예요. 동사 miss(놓치다) 앞에 두 글자 단어가 붙어요.","only to V = (~했지만) 결국 …하다",["miss","to","the bus","only"]],
 ["똑같은 실수를 다시 하다니 그는 바보임이 틀림없다. (a fool / he / must / be / make / to)<br>___ the same mistake again.","He must be a fool to make","He must be a fool to make the same mistake again.","똑같은 실수를 다시 하다니 그는 바보임이 틀림없다.",
  c5+"를 보세요. must be(~임이 틀림없다)와 함께 쓰이는 모양이에요.","1) ‘~임이 틀림없다’는 must be예요. 주어 He가 맨 앞에 와요.  2) 바보라고 판단한 근거는 ‘똑같은 실수를 다시 한 것’이에요. 근거는 to부정사로 뒤에 붙여요.","He로 시작하는 여섯 단어예요. 판단(바보임이 틀림없다)을 먼저 말하고 근거(to부정사)는 맨 뒤에 둬요.","must be ~ + to V = ~하다니 …임이 틀림없다",["a fool","he","must","be","make","to"]]
]);

// ===== UNIT 3 심화 (p.33) =====
const BK3=["목적","감정의 원인","판단의 근거","형용사 수식"];
WW(3,"SA","(밑줄 친 부분에 유의하여 우리말 해석을 완성하고, to부정사의 의미를 보기에서 골라 쓰시오. ‘해석 / 의미’로 쓸 것) ",[
 ["I turned the light on <u>to see</u> better.<br>나는 ___ 불을 켰다.","더 잘 보기 위해 / 목적","I turned the light on to see better.","나는 더 잘 보기 위해 불을 켰다.",
  c1+"을 펴세요. 목적의 to부정사 뜻을 확인해요.","1) turned the light on(불을 켰다)은 이미 끝난 행동이에요. to see better는 그 ‘이유’를 말해요.  2) 해석은 ‘~하기 위해’로 하고, 보기에서 같은 의미를 골라요.","해석은 ‘더 잘’로 시작하고 ‘~하기 위해’ 꼴이에요. 의미는 ‘감정의 원인’과 ‘형용사 수식’은 아니에요.","to see better = 더 잘 보기 위해(목적)",BK3],
 ["This city is dangerous <u>to visit</u> alone.<br>이 도시는 혼자 ___ 위험하다.","방문하기에 / 형용사 수식","This city is dangerous to visit alone.","이 도시는 혼자 방문하기에 위험하다.",
  c4+"을 보세요. 형용사 뒤에 붙는 to부정사예요.","1) dangerous(위험한)가 ‘어떤 점에서’ 위험한지 to visit(방문하다)이 설명해요.  2) 해석은 ‘~하기에’예요. 보기 중에서 형용사를 꾸며 주는 쪽을 골라요.","해석은 ‘방문하’로 시작하고 ‘~하기에’ 꼴이에요. 의미는 ‘목적’과 ‘감정의 원인’은 아니에요.","dangerous to visit = 방문하기에",BK3],
 ["He was disappointed <u>to hear</u> the test results.<br>그는 ___ 실망했다.","시험 결과를 들어서[듣고] / 감정의 원인","He was disappointed to hear the test results.","그는 시험 결과를 듣고 실망했다.",
  c2+"을 보세요. 감정 형용사 뒤의 to부정사예요.","1) disappointed(실망한)는 감정이에요.  2) 실망한 ‘원인’이 시험 결과를 들은 거예요. 해석은 ‘~해서’ 또는 ‘~하고’로 해요.","해석은 ‘시험 결과를’ 다음에 ‘들’로 시작하는 말이에요. 의미는 ‘목적’과 ‘형용사 수식’은 아니에요.","감정 형용사 + to V = ~해서",BK3],
 ["She must be rich <u>to own</u> such an expensive car.<br>그렇게 비싼 ___ 그녀는 부자임이 틀림없다.","차를 소유하다니 / 판단의 근거","She must be rich to own such an expensive car.","그렇게 비싼 차를 소유하다니 그녀는 부자임이 틀림없다.",
  c5+"를 보세요. must be(~임이 틀림없다) 뒤의 to부정사예요.","1) must be rich(부자임이 틀림없다)는 내가 ‘추측’하는 말이에요.  2) 그렇게 추측한 근거가 비싼 차를 소유한 것이에요. 해석은 ‘~하다니’예요.","해석은 ‘차를’ 다음에 ‘소유’로 시작하는 말이에요. 의미는 ‘목적’과 ‘감정의 원인’은 아니에요.","rich to own = 소유하다니(근거)",BK3]
]);
WW(3,"SB","(두 문장의 의미가 같도록 to부정사를 이용하여 문장을 완성하시오) ",[
 ["I wanted to tell you something important, so I called you.<br>I called you ___ ___ ___ ___ ___.","to tell you something important","I called you to tell you something important.","나는 네게 중요한 것을 말해 주려고 전화했다.",
  c1+"을 보세요. so로 이어진 두 문장을 to부정사로 줄여요.","1) 앞 문장의 ‘말해 주고 싶었다’가 전화한 목적이에요.  2) 목적을 to부정사로 바꾸고, 대상은 you, 말의 내용은 something important이에요.","다섯 칸이에요. 첫 칸은 t로 시작하는 두 글자, 둘째 칸은 t로 시작하는 동사예요. 나머지 세 칸은 앞 문장에서 그대로 가져와요.","called you to tell = 말하려고 전화"],
 ["She was back home, so she was pleased.<br>She was pleased ___ ___ ___ ___.","to be back home","She was pleased to be back home.","그녀는 집에 돌아와서 기뻤다.",
  c2+"을 보세요. pleased(기쁜)는 감정 형용사예요.","1) 기쁜 원인이 ‘집에 돌아온 것’이에요.  2) 원인은 감정 형용사 뒤에 to부정사로 붙여요. was(원형 be)를 to be로 바꿔요.","네 칸이에요. 첫 칸은 t로 시작하는 두 글자, 둘째 칸은 was의 원형(b로 시작하는 두 글자)이에요.","pleased to be back = 돌아와서 기쁜"],
 ["He went to the bakery, but he found it closed.<br>He went to the bakery, ___ ___ ___ it closed.","only to find","He went to the bakery, only to find it closed.","그는 빵집에 갔지만 문이 닫혀 있는 것을 알게 되었다.",
  c3+" 아래 ‘only + to부정사’ 설명을 보세요.","1) but(그러나)으로 이어진 부정적인 결과예요. ‘갔지만 결국 ~했다’는 뜻이에요.  2) 이런 결과는 쉼표 뒤에서 한 덩어리로 표현해요.","세 칸이에요. 첫 칸은 o로 시작하는 네 글자, 셋째 칸에는 found(원형 find: 알게 되다)를 원형으로 써요.","only to find = 결국 ~을 알게 되다"]
]);
WW(3,"SC","(우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오) ",[
 ["그는 자라서 성공한 사업가가 되었다. (grow up, be)<br>He ___ a successful businessman.","grew up to be","He grew up to be a successful businessman.","그는 자라서 성공한 사업가가 되었다.",
  c3+"를 보세요. ‘자라서 ~이 되다’ 예문이 있어요.","1) 이야기는 과거예요. grow up(자라다)의 시제에 주의해요.  2) ‘자라서 ~이 되다’는 결과를 to부정사로 이어 쓰고, be를 활용해요.","g로 시작하는 과거형으로 시작하는 네 단어예요. 마지막은 ‘~이 되다’ 뜻으로 주어진 be를 써요.","grow up to V = 자라서 ~이 되다"],
 ["우리는 교통 체증을 피하기 위해 일찍 떠났다. (leave, in order to, avoid)<br>We ___ traffic.","left early in order to avoid","We left early in order to avoid traffic.","우리는 교통 체증을 피하기 위해 일찍 떠났다.",
  c1+" 아래 in order to 설명을 보세요.","1) ‘떠났다’는 과거라서 leave(떠나다)의 과거형을 써요.  2) ‘일찍’은 early예요. 목적을 강조할 때 쓰는 in order to 뒤에 avoid(피하다)를 이어요.","l로 시작하는 과거형으로 시작하는 여섯 단어예요. 부사 early(일찍)는 동사 바로 뒤에 와요.","in order to V = ~하기 위해서"],
 ["그는 그 소식을 듣고 매우 놀랐다. (surprised, hear)<br>He ___ the news.","was very surprised to hear","He was very surprised to hear the news.","그는 그 소식을 듣고 매우 놀랐다.",
  c2+"을 보세요. 놀람 같은 감정과 to부정사예요.","1) ‘놀랐다’는 감정이에요. be동사 + surprised(놀란) 모양이에요. 과거라는 점에 주의해요.  2) 놀란 원인(소식을 들은 것)은 to hear로 이어요.","w로 시작하는 다섯 단어예요. ‘매우’를 뜻하는 v로 시작하는 단어가 감정 형용사 앞에 들어가요.","surprised to hear = 듣고 놀란"],
 ["그의 연설은 이해하기 어려웠다. (difficult, understand)<br>His speech ___.","was difficult to understand","His speech was difficult to understand.","그의 연설은 이해하기 어려웠다.",
  c4+"을 보세요. difficult 같은 형용사 뒤의 to부정사예요.","1) ‘~하기 어려웠다’는 형용사 뒤에 to부정사를 붙여요.  2) 과거라서 be동사의 모양에 주의해요.","w로 시작하는 네 단어예요. be동사 과거형 뒤에 형용사, 그 뒤에 to + 동사원형이에요.","difficult to understand = 이해하기 어려운"]
]);

// ===== UNIT 4 기본 (p.34) =====
CC(4,"A",[
 ["It was kind (of / for) you to help that blind man.","of","It was kind of you to help that blind man.","그 시각 장애인을 도와주다니 너는 친절했다.",
  d1+"를 펴세요. 의미상의 주어에 for를 쓰는지 of를 쓰는지 나와 있어요.","1) 앞의 kind(친절한)는 사람의 성격을 말하는 형용사예요.  2) 사람의 성격·성질을 말하는 형용사 뒤에는 정해진 전치사를 써요. 본책 속 목록에 kind가 있어요.","두 글자 전치사 o로 시작하는 쪽이에요.","kind 같은 성격 형용사 → of + 목적격"],
 ["It’s very difficult (of / for) me to believe you right now.","for","It’s very difficult for me to believe you right now.","지금은 내가 너를 믿기가 매우 어렵다.",
  d1+"를 보세요. 일의 상태를 말하는 형용사를 확인해요.","1) difficult(어려운)는 사람의 성격이 아니라 일이 얼마나 어려운지를 말해요.  2) 이런 형용사 뒤의 의미상의 주어는 기본형 for를 써요.","f로 시작하는 세 글자예요.","difficult 같은 일의 상태 → for + 목적격"],
 ["It was foolish (of / for) her to spend all her money already.","of","It was foolish of her to spend all her money already.","벌써 돈을 다 쓰다니 그녀는 어리석었다.",
  d1+"의 성격 형용사 목록을 보세요.","1) foolish(어리석은)는 사람의 성격·성질을 평가하는 말이에요.  2) 목록에 있는 형용사 뒤에서는 for가 아니라 다른 전치사를 써요.","o로 시작하는 두 글자예요.","foolish → of her"],
 ["It’s impossible (of / for) me to finish this book in a day.","for","It’s impossible for me to finish this book in a day.","하루 만에 이 책을 다 읽는 것은 내게 불가능하다.",
  d1+"의 첫 단락(for + 목적격)과 둘째 단락(of + 목적격)을 비교해 보세요.","1) impossible(불가능한)은 사람의 성격이 아니라 일의 상태를 말해요.  2) 일의 상태를 말하는 형용사는 for를 써요.","f로 시작하는 세 글자예요.","impossible → for me"],
 ["She was (so / too) tired to study.","too","She was too tired to study.","그녀는 너무 피곤해서 공부할 수 없었다.",
  d2+"를 보세요. 뒤에 to가 오는 모양을 확인해요.","1) 뒤에 that절이 없고 to study(공부하기에)가 바로 이어져요.  2) ‘너무 ~해서 …할 수 없다’를 to부정사로 쓰는 구문이에요.","t로 시작하는 세 글자예요.","too + 형용사 + to V"],
 ["It was (so / too) hot that I couldn’t wear my new coat.","so","It was so hot that I couldn’t wear my new coat.","너무 더워서 나는 새 코트를 입을 수 없었다.",
  d2+" 아래 ‘so + 형용사 + that’으로 바꿔 쓰는 설명을 보세요.","1) hot 뒤에 that I couldn’t…(내가 ~할 수 없었다)라는 절이 나와요.  2) that절과 짝이 되는 말을 고르세요.","s로 시작하는 두 글자예요.","so + 형용사 + that + 주어 + can’t"],
 ["I am (old enough / enough old) to decide for myself.","old enough","I am old enough to decide for myself.","나는 스스로 결정할 만큼 충분히 나이를 먹었다.",
  d3+"를 보세요. enough가 들어가는 위치를 확인해요.","1) ‘~할 만큼 충분히 …한’을 말할 때 enough는 형용사의 앞이 아니라 다른 쪽에 와요.  2) to decide(결정할) 바로 앞에 enough가 오는 쪽이에요.","o로 시작하는 보기예요. 형용사가 먼저 나와요.","형용사 + enough + to V"]
]);
WW(4,"B",FX,[
 ["The problem was hard <u>of me</u> to solve.","for me","The problem was hard for me to solve.","그 문제는 내가 풀기에 어려웠다.",
  d1+"를 보세요. 의미상의 주어 모양을 확인해요.","1) hard(어려운)는 문제가 어려운 정도를 말해요. 사람의 성격이 아니에요.  2) 이런 일의 상태를 말하는 형용사는 for를 써요.","of를 f로 시작하는 세 글자 전치사로 바꿔요.","hard 같은 일의 상태 → for + 목적격"],
 ["It was nice <u>for him</u> to lend you some money.","of him","It was nice of him to lend you some money.","네게 돈을 빌려주다니 그는 착했다.",
  d1+"의 성격 형용사 목록을 보세요.","1) nice(착한)는 사람의 성격을 칭찬하는 말이에요.  2) 목록에 있는 형용사 뒤에서는 for 대신 다른 전치사를 써요.","for를 o로 시작하는 두 글자로 바꿔요.","nice 같은 성격 형용사 → of + 목적격"],
 ["The children were <u>so sleepy</u> to wait up for their dad.","too sleepy","The children were too sleepy to wait up for their dad.","아이들은 너무 졸려서 아빠를 기다릴 수 없었다.",
  d2+"를 보세요. to부정사와 짝이 되는 말이에요.","1) 뒤에 to wait(기다리기에)가 바로 이어져요. that절이 아니에요.  2) ‘너무 ~해서 …할 수 없다’ 구문의 앞부분을 점검해요.","so를 t로 시작하는 세 글자로 바꿔요.","too sleepy to wait = 졸려서 못 기다림"],
 ["He is <u>too busy</u> that he can’t attend the meeting.","so busy","He is so busy that he can’t attend the meeting.","그는 너무 바빠서 회의에 참석할 수 없다.",
  d2+" 아래 ‘so + 형용사 + that’ 설명을 보세요.","1) 뒤에 that he can’t…라는 절이 나와요.  2) that절과 짝이 되는 말로 바꿔야 해요.","too를 s로 시작하는 두 글자로 바꿔요.","so busy that he can’t = 바빠서 못 ~"],
 ["You didn’t study <u>enough hard</u> to pass the test.","hard enough","You didn’t study hard enough to pass the test.","너는 시험에 통과할 만큼 충분히 열심히 공부하지 않았다.",
  d3+"를 보세요. enough의 위치를 확인해요.","1) enough는 형용사나 부사를 뒤에서 꾸며 줘요.  2) hard(열심히)와 enough의 순서가 바뀌었어요.","두 단어의 순서를 바꿔요. h로 시작하는 말이 먼저예요.","형용사/부사 + enough + to V"],
 ["She was so smart that she <u>can</u> skip a grade.","could","She was so smart that she could skip a grade.","그녀는 매우 똑똑해서 월반할 수 있었다.",
  d3+" 아래 ‘so ~ that’으로 바꿔 쓰는 설명을 보세요.","1) 앞부분이 was(원형 be의 과거)라서 이야기가 과거예요.  2) that절 안의 조동사도 시제를 맞춰야 해요.","can의 과거형이에요. c로 시작하는 다섯 글자예요.","시제 일치: was ~ that + could"],
 ["I was lucky enough <u>seeing</u> him again.","to see","I was lucky enough to see him again.","나는 운 좋게 그를 다시 만날 수 있었다.",
  d3+"를 보세요. enough 뒤에 오는 모양이에요.","1) lucky enough(충분히 운이 좋은) 뒤에는 ‘무엇을 할 만큼’인지 나와요.  2) 이 자리에 오는 동사 모양을 떠올려요.","seeing에서 -ing를 떼고 앞에 t로 시작하는 두 글자를 붙여요.","enough + to V (-ing 안 됨)"]
]);
WW(4,"C","(두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오) ",[
 ["My brother was so short that he couldn’t reach the switch.<br>My brother was ___ ___ ___ ___ the switch.","too short to reach","My brother was too short to reach the switch.","내 남동생은 키가 너무 작아서 스위치에 손이 닿지 않았다.",
  d2+" 아래 ‘so ~ that + 주어 + can’t’로 바꿔 쓰는 설명을 보세요.","1) so short that he couldn’t(너무 작아서 ~할 수 없었다)는 too ~ to ~로 바꿔 쓸 수 있어요.  2) 주어가 같으니 that절의 he couldn’t를 to부정사로 줄여요.","네 칸이에요. 첫 칸은 t로 시작하는 세 글자, 셋째 칸은 두 글자예요. couldn’t 뒤의 동사는 원형 그대로 써요.","so + 형용사 + that + can’t = too + 형용사 + to V"],
 ["It is so late that we can’t change our plans.<br>It is ___ ___ ___ ___ our plans.","too late to change","It is too late to change our plans.","우리의 계획을 바꾸기에는 너무 늦었다.",
  d2+"를 보세요. so ~ that ~ can’t와 같은 의미의 구문이에요.","1) so late that we can’t change(너무 늦어서 바꿀 수 없다)를 줄여 쓰는 문제예요.  2) 빈칸이 네 칸이라서 ‘너무 + 형용사 + to + 동사원형’ 순서를 채워요.","첫 칸은 t로 시작하는 세 글자예요. late가 둘째 칸이에요.","too late to change = 바꾸기엔 너무 늦음"],
 ["This soup is too hot for me to eat right now.<br>This soup is ___ ___ ___ ___ ___ eat it right now.","so hot that I can’t","This soup is so hot that I can’t eat it right now.","이 수프는 너무 뜨거워서 나는 지금 먹을 수 없다.",
  d2+" 아래 ‘의미상의 주어가 that절의 주어가 된다’는 설명을 보세요.","1) for me가 의미상의 주어예요. that절에서는 I가 주어가 돼요.  2) too는 so로 바꾸고, 부정의 뜻이 있으니 can’t를 써요. 주어 뒤에 목적어 it이 따로 있다는 점도 확인해요.","다섯 칸이에요. 첫 칸은 s로 시작하는 두 글자, 넷째 칸은 for me의 me를 주격으로 바꾼 말, 마지막 칸은 can의 줄임 부정형이에요.","too ~ for 목적격 to V = so ~ that 주어 can’t"],
 ["Sharon is smart enough to answer any question correctly.<br>Sharon is ___ ___ ___ ___ ___ answer any question correctly.","so smart that she can","Sharon is so smart that she can answer any question correctly.","샤론은 어떤 질문에도 정확히 답할 수 있을 만큼 똑똑하다.",
  d3+" 아래 ‘so + 형용사 + that + 주어 + can’으로 바꿔 쓰는 설명을 보세요.","1) ‘~할 만큼 충분히 …한’은 so ~ that + can으로 바꿔요.  2) 주어는 Sharon이라서 that절의 대명사는 여자로 받아요.","다섯 칸이에요. 첫 칸은 s로 시작하는 두 글자, 넷째 칸은 Sharon을 받는 대명사, 마지막 칸은 c로 시작하는 조동사예요.","enough to V = so ~ that 주어 can"]
]);

const BK4=["for","of","enough","too","so","that"];
WW(4,"SA","(보기에서 알맞은 말을 골라 문장을 완성하시오) ",[
 ["It was careless ___ her to leave the door open.","of","It was careless of her to leave the door open.","문을 열어 두다니 그녀는 부주의했다.",
  d1+"의 성격 형용사 목록을 보세요.","1) careless(부주의한)는 사람의 성격을 말하는 형용사예요.  2) 이런 형용사 뒤에는 for가 아니라 다른 전치사가 와요.","o로 시작하는 두 글자예요.","careless → of + 목적격",BK4],
 ["You are so smart ___ everything is easy for you.","that","You are so smart that everything is easy for you.","너는 매우 똑똑해서 모든 것이 네게 쉽다.",
  d2+"를 펴서 아래 바꿔 쓰기 설명을 보세요.","1) so smart(매우 똑똑한) 뒤에 완전한 문장(everything is easy…)이 나와요.  2) so와 짝이 되어 결과를 이끄는 말을 골라요.","t로 시작하는 네 글자예요.","so + 형용사 + that + 문장",BK4],
 ["It’s impossible ___ the children to figure out the answer.","for","It’s impossible for the children to figure out the answer.","아이들이 그 답을 알아내는 것은 불가능하다.",
  d1+"를 보세요. 의미상의 주어 앞 전치사예요.","1) impossible(불가능한)은 사람의 성격이 아니라 일의 상태를 말해요.  2) 이런 형용사 뒤에는 기본 전치사를 써요.","f로 시작하는 세 글자예요.","impossible → for + 목적격",BK4],
 ["The kiwis are not ripe ___ to eat.","enough","The kiwis are not ripe enough to eat.","그 키위들은 먹을 만큼 충분히 익지 않았다.",
  "본책 p.64 POINT 3의 예문을 보세요. 형용사 뒤에서 to부정사와 짝이 되는 말이에요.","1) ripe(익은) 뒤에 to eat이 이어져요. ‘~할 만큼 충분히’라는 뜻이 필요해요.  2) not이 앞에 있으니 ‘충분히 익지 않았다’가 돼요.","e로 시작하는 여섯 글자예요.","ripe enough to eat = 먹을 만큼 익은",BK4],
 ["He was ___ tired to finish all his homework.","too","He was too tired to finish all his homework.","그는 너무 피곤해서 숙제를 다 끝낼 수 없었다.",
  d2+"를 보세요. 뒤에 to부정사가 바로 이어지는 구문이에요.","1) tired(피곤한) 뒤에 that절이 아니라 to finish가 와요.  2) ‘너무 ~해서 …할 수 없다’ 뜻의 단어를 골라요.","t로 시작하는 세 글자예요.","too tired to finish = 피곤해서 못 끝냄",BK4],
 ["The music was ___ loud that I couldn’t study at all.","so","The music was so loud that I couldn’t study at all.","음악이 너무 시끄러워서 나는 전혀 공부할 수 없었다.",
  d2+" 아래 ‘so ~ that’ 설명을 보세요.","1) loud(시끄러운) 뒤에 that I couldn’t… 절이 이어져요.  2) that과 짝을 이루는 말을 골라요.","s로 시작하는 두 글자예요.","so + 형용사 + that",BK4]
]);
WW(4,"SB","(어법상 틀린 부분을 찾아 바르게 고치시오. ‘틀린 부분 → 고친 말’ 형식으로 쓸 것) ",[
 ["It was difficult of me to learn how to cook.","of → for","It was difficult for me to learn how to cook.","요리하는 법을 배우는 것은 내게 어려웠다.",
  d1+"를 보세요. 형용사의 종류에 따라 전치사가 달라져요.","1) difficult(어려운)는 사람의 성격이 아니라 일의 상태를 말해요.  2) 일의 상태를 말하는 형용사 뒤에는 기본 전치사를 써요.","of를 f로 시작하는 세 글자로 바꿔요.","difficult → for me"],
 ["It was polite for her to offer me a glass of water.","for → of","It was polite of her to offer me a glass of water.","내게 물 한 잔을 권하다니 그녀는 공손했다.",
  d1+"의 성격 형용사 목록을 보세요.","1) polite(공손한)는 사람의 성격을 말하는 형용사예요.  2) 이런 형용사 뒤에는 for 대신 다른 전치사를 써요.","for를 o로 시작하는 두 글자로 바꿔요.","polite → of her"],
 ["It is so late to go to the concert.","so → too","It is too late to go to the concert.","콘서트에 가기에는 너무 늦었다.",
  d2+"를 보세요. to부정사와 함께 쓰는 구문이에요.","1) 뒤에 that절이 없고 to go가 바로 이어져요.  2) so는 that절과 짝을 이루는 말이라서 이 문장에서는 어울리지 않아요.","so를 t로 시작하는 세 글자로 바꿔요.","so late to go → too late to go"],
 ["The boy was too fast for me to catching.","catching → catch","The boy was too fast for me to catch.","그 소년은 내가 잡기에는 너무 빨랐다.",
  d2+" 아래 ‘의미상의 주어’가 포함된 예문 ‘too expensive for her to buy’를 보세요.","1) for me(내가)는 의미상의 주어예요. 그 뒤에 to부정사가 와요.  2) to 뒤에는 -ing가 아니라 동사원형이 와야 해요.","catching에서 -ing 세 글자를 떼요.","for me to catch (to 뒤는 원형)"],
 ["It is to early for the children to go to bed.","to early → too early","It is too early for the children to go to bed.","아이들이 자러 가기에는 너무 이르다.",
  d2+"를 보세요. ‘너무 ~한’이라고 말할 때 쓰는 단어예요.","1) early(이른) 앞에 ‘너무’라는 뜻이 와야 해요.  2) 철자가 비슷한 두 단어 to와 too 중에서 어느 쪽이 ‘너무’인지 생각해요.","to 끝에 o를 하나 더 붙인 세 글자 단어로 바꿔요.","너무 ~한 = too + 형용사"],
 ["My brother is not old enough go to school.","go → to go","My brother is not old enough to go to school.","내 남동생은 학교에 갈 만큼 충분히 나이를 먹지 않았다.",
  d3+"를 보세요. enough 뒤에 필요한 모양이에요.","1) old enough(충분히 나이 든) 뒤에 ‘무엇을 할 만큼’인지 이어져요.  2) 이 자리의 동사에는 to가 필요해요.","go(가다) 앞에 t로 시작하는 두 글자를 더해요.","old enough to go (to가 필요)"],
 ["The tea was too hot that I couldn’t drink it.","too → so","The tea was so hot that I couldn’t drink it.","차가 너무 뜨거워서 나는 마실 수 없었다.",
  d2+" 아래 ‘so ~ that’ 설명을 보세요.","1) hot 뒤에 that I couldn’t… 절이 나와요.  2) that절과 짝이 되는 말은 too가 아니에요.","too를 s로 시작하는 두 글자로 바꿔요.","too hot that → so hot that"]
]);
WW(4,"SC","(두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오) ",[
 ["We arrived too late to see the doctor.<br>We ___.","arrived so late that we couldn’t see the doctor","We arrived so late that we couldn’t see the doctor.","우리는 너무 늦게 도착해서 의사를 만날 수 없었다.",
  d2+" 아래 ‘too ~ to’를 ‘so ~ that + 주어 + can’t’로 바꾸는 설명을 보세요.","1) arrived(원형 arrive: 도착하다)는 과거예요. 시제를 맞춰야 해요.  2) too는 so로 바꾸고 to see 부분을 that절로 풀어요. 부정의 뜻이 있어요.","arrived로 시작하는 아홉 단어예요. that 뒤 주어는 we이고, 과거라서 can의 과거 줄임 부정형을 써요.","too ~ to = so ~ that 주어 couldn’t"],
 ["I am so tired that I can’t go out tonight.<br>I ___.","am too tired to go out tonight","I am too tired to go out tonight.","나는 너무 피곤해서 오늘 밤에 외출할 수 없다.",
  d2+"를 보세요. so ~ that ~ can’t와 같은 뜻의 구문이에요.","1) 주어 I와 that절 안의 주어가 같아요.  2) that절을 to부정사로 줄이면 ‘너무 ~해서 …할 수 없다’가 돼요.","am으로 시작하는 일곱 단어예요. so는 t로 시작하는 세 글자로 바뀌고, that I can’t는 두 글자 한 단어로 줄어요.","so ~ that can’t = too ~ to V"],
 ["My brother is so clever that he can solve any puzzle.<br>My brother ___.","is clever enough to solve any puzzle","My brother is clever enough to solve any puzzle.","내 남동생은 어떤 퍼즐이든 풀 수 있을 만큼 영리하다.",
  d3+" 아래 ‘so ~ that + 주어 + can’과 바꿔 쓰기를 보세요.","1) so clever that he can(매우 영리해서 ~할 수 있다)은 enough 구문으로 바꿀 수 있어요.  2) enough는 형용사 바로 뒤에 두고 to부정사를 이어요.","is로 시작하는 일곱 단어예요. e로 시작하는 단어는 clever(영리한) 뒤에 와요.","so ~ that can = 형용사 + enough + to V"],
 ["She is rich enough to buy that building.<br>She ___.","is so rich that she can buy that building","She is so rich that she can buy that building.","그녀는 저 건물을 살 수 있을 만큼 부자이다.",
  d3+"를 보세요. enough 구문을 so ~ that 구문으로 바꿔요.","1) rich enough(충분히 부자인)를 so rich that + 주어 + can으로 바꿔요.  2) 주어는 she로 받아요. 현재 시제를 유지해요.","is로 시작하는 아홉 단어예요. that 뒤에는 주어 she와 c로 시작하는 조동사가 와요.","rich enough to = so rich that she can"],
 ["The driving test was too difficult for her to pass.<br>The driving test ___.","was so difficult that she couldn’t pass it","The driving test was so difficult that she couldn’t pass it.","운전면허 시험은 너무 어려워서 그녀는 합격할 수 없었다.",
  d2+" 아래 ‘문장의 주어가 to부정사의 목적어일 때 that절에 목적어를 꼭 써야 한다’는 설명을 보세요.","1) for her가 의미상의 주어라서 that절의 주어는 she예요.  2) 문장의 주어(시험)가 pass의 목적어이므로 that절 끝에 이를 받는 대명사를 꼭 써야 해요. 과거 시제예요.","was로 시작하는 여덟 단어예요. 마지막 단어는 the driving test를 받는 두 글자 대명사예요.","주어가 to V의 목적어 → that절에 it 필요"]
]);
