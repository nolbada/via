<html lang="ko">
<head>
<meta charset="UTF-8">

<body>
<div class="wrap">
  <h1>보카스위치 고교 말하기 테스트</h1>
  <div class="sub">오늘 DAY의 문장을 해석으로 말해요</div>

  <!-- 1. 시작 화면 -->
  <div class="screen on" id="sStart">
    <label for="name">이름</label>
    <input type="text" id="name" placeholder="이름을 입력하세요" autocomplete="off">
    <label for="book">DAY</label>
    <input type="hidden" id="book" value="">
    <div class="books" id="books" style="flex-wrap:wrap"><button type="button" class="bk" style="min-width:30%" data-b="DAY 1">DAY 1</button><button type="button" class="bk" style="min-width:30%" data-b="DAY 2">DAY 2</button><button type="button" class="bk" style="min-width:30%" data-b="DAY 3">DAY 3</button><button type="button" class="bk" style="min-width:30%" data-b="DAY 4">DAY 4</button><button type="button" class="bk" style="min-width:30%" data-b="DAY 5">DAY 5</button></div>
    <div class="bkinfo" id="bkinfo">DAY를 선택하세요</div>
    <div class="err" id="err"></div>
    <button class="big" id="startBtn">시험 시작</button>
    <div class="hint" id="rule"></div>
  </div>

  <!-- 2. 시험 화면 -->
  <div class="screen" id="sTest">
    <div class="progress" id="prog"></div>
    <div class="card spin" id="card">룰렛 돌리기를 누르세요</div>
    <div class="timer" id="timer"></div>
    <button class="big" id="spinBtn">룰렛 돌리기</button>
    <button class="big blue" id="micBtn" disabled>말하기 시작</button>
    <div class="heard"><b>인식된 내 말</b><span id="heard">-</span></div>
    <div class="result" id="result"></div>
    <button class="big" id="retryBtn" style="display:none">다시 말하기</button>
    <button class="big" id="nextBtn" style="display:none">다음 문장</button>
  </div>

  <!-- 3. 결과 화면 -->
  <div class="screen" id="sEnd">
    <div class="final" id="final"></div>
    <div class="meta" id="meta"></div>
    <div id="list"></div>
    <div id="writeBox"></div>
    <button class="big gray" id="againBtn">처음으로</button>
  </div>

  
</div>
