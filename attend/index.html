<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>출석부</title>
<meta name="apple-mobile-web-app-title" content="출석부">
<meta name="theme-color" content="#1d2333">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f1efea;--ink:#1c2230;--mut:#7b8494;--line:#e4e6ec;--card:#fff;--acc:#e8455a;--dark:#1d2333;
--mc:#3b5fe0;--mcl:#e6ecfd;--mcb:#b8c7f6;--fc:#a63d93;--fcl:#f8e6f4;--fcb:#e3b6da;--wtl:#fff4d9;--bad:#d6402f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-x:none}body{overflow-x:clip;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
button{font:inherit;font-size:16px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;min-height:44px;cursor:pointer;color:var(--ink)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.g{min-height:36px;padding:5px 10px;font-size:14px;color:var(--mut)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#252c40,#1a2030);color:#fff;padding:10px 16px;box-shadow:0 2px 14px rgba(20,26,40,.28)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px}
.tabs button{min-height:36px;padding:4px 16px;font-size:16px;font-weight:700;border:0;border-radius:999px;background:transparent;color:#aeb6c8}
.tabs button.on{background:linear-gradient(135deg,#ff6a74,#ff8f5a);color:#fff;box-shadow:0 2px 8px rgba(255,106,116,.45)}
.dbar{display:flex;align-items:center;gap:6px}
.dbar button{min-height:38px;min-width:38px;padding:2px 10px;font-size:22px;line-height:1;border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:10px}
.dbar button.g{font-size:14px;color:#cdd3e0;padding:2px 12px}
.dbar button:disabled{opacity:.3}
.dl{position:relative;display:inline-flex;align-items:center;min-height:38px;padding:4px 14px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(255,255,255,.1);font-size:18px;font-weight:700;white-space:nowrap;color:#fff}
.dl small{color:#aeb6c8;font-weight:500;font-size:13px;margin-left:8px}
.dl.past{border-color:#f2a31b;background:rgba(242,163,27,.2)}
.dl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.srch{margin-left:auto}
.srch input{width:170px;font:inherit;font-size:15px;padding:8px 14px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.1);color:#fff}
.srch input::placeholder{color:#99a2b6}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat>*{display:inline-flex;align-items:baseline;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:3px 14px;min-height:0;font:inherit;font-size:13px;color:#aeb6c8}
.stat b{font-size:18px;color:#fff;font-weight:800}
.stat .k{background:rgba(255,106,116,.2);border-color:rgba(255,106,116,.55);color:#ffcfd2;letter-spacing:.08em;font-weight:700}
.stat button.sb{cursor:pointer}
.stat button.sb::after{content:"\203A";margin-left:2px;opacity:.7;font-size:16px}
.bd{display:inline-block;font-size:11px;font-weight:700;color:#8a5400;background:#ffe6b0;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
main{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;height:calc(100vh - var(--hh,118px));height:calc(100dvh - var(--hh,118px))}
.loading{color:var(--mut);padding:30px 4px;text-align:center}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:900px){main{height:auto}.wrap{grid-template-columns:1fr 1fr}.stu{grid-column:1/-1}.col .lst{overflow:visible}}
@media(max-width:700px){main{height:calc(100vh - var(--hh,118px));height:calc(100dvh - var(--hh,118px));padding:8px}.wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:6px}.stu{grid-column:auto}.col .lst{overflow:auto}.grid{grid-template-columns:1fr;gap:5px}.chip{min-height:40px;padding:2px 2px 2px 8px}.chip .cn{font-size:15px}.chip .x{min-width:28px;min-height:30px}.pane,.room{padding:8px;border-radius:14px}.rt{font-size:16px}.rc b{font-size:20px}.rw{padding:2px 6px;min-height:40px;margin-bottom:5px}.rw .no,.rw .lv{display:none}.rw{flex-wrap:wrap}.rw .tm{flex-basis:100%;text-align:left;font-size:12px;padding:0;border:0;background:none;min-height:0}.rw .rn{font-size:15px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25}.rw .rn .gd{display:block;width:max-content;margin:2px 0 0}.dots{display:none}.rs{margin-bottom:4px}.srch{margin-left:0;width:100%}.srch input{width:100%}.pane>h2{margin-bottom:6px}.wl{grid-template-columns:1fr}.stat{margin-top:6px;gap:5px}.stat>*{padding:1px 9px}.stat b{font-size:15px}.top{gap:8px}header{padding:8px 10px}}
.pane,.room{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 1px 2px rgba(20,26,40,.06),0 8px 22px rgba(20,26,40,.05)}
.pane>h2{margin:0 2px 10px;font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.pane>h2 span{background:#eef0f4;color:var(--ink);border-radius:999px;padding:1px 10px;letter-spacing:0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}
.chip{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;min-height:46px;padding:3px 4px 3px 12px;background:#f6f7f9;border:1px solid var(--line);border-radius:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.chip:active{background:#e9edf5}
.chip .cn{flex:1;font-size:16px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .x{min-height:34px;min-width:34px;padding:0;border:0;border-radius:9px;background:transparent;color:#a3abba;font-size:13px;font-weight:700}
.chip .x:active{background:#fbe3df;color:var(--bad)}
.chip.gst{background:var(--wtl);border-color:#f1d28b}
.rw.gst{background:var(--wtl);border-color:#f1d28b}
.chip .bd{order:3;flex-basis:100%;width:fit-content;margin:0 0 3px;font-size:11px}
.col{display:flex;flex-direction:column;min-height:0}
.lst{overflow:auto;flex:1;min-height:0;padding:2px;-webkit-overflow-scrolling:touch}
.waitbar{flex:none}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.wc{display:flex;align-items:center;gap:6px;background:var(--wtl);border:1px solid #f1d28b;border-radius:14px;padding:6px 6px 6px 12px}
.wn{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;cursor:pointer}
.wn .cn{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wc button{min-width:58px;padding:4px 10px;font-weight:700;border:0;border-radius:12px;color:#fff}
.wc button.bc{min-width:46px;background:#e4e7ee;color:#566074}
button.bm{background:var(--mc);color:#fff;border:0}
button.bf{background:var(--fc);color:#fff;border:0}
.room{border-top:5px solid var(--mc)}
.room.f{border-top-color:var(--fc)}
.rh{display:flex;justify-content:space-between;align-items:baseline}
.rt{font-size:20px;font-weight:800}
.room.m .rt{color:var(--mc)}.room.f .rt{color:var(--fc)}
.rc{font-size:14px;color:var(--mut)}.rc b{font-size:26px;color:var(--ink);font-weight:800}
.dots{display:flex;gap:3px;margin:6px 0 4px}
.dots s{flex:1;height:6px;border-radius:3px;background:#e7e9ef;text-decoration:none}
.room.m .dots s.f{background:var(--mc)}.room.f .dots s.f{background:var(--fc)}
.rs{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:8px;min-height:16px}
.rs .warn{color:var(--bad)}.rs .full{color:#c47a00}
.rw{display:flex;align-items:center;gap:8px;min-height:44px;padding:3px 6px 3px 10px;border-radius:12px;border:1px solid var(--mcb);background:linear-gradient(180deg,#f7f9ff,var(--mcl));margin-bottom:6px}
.room.f .rw{border-color:var(--fcb);background:linear-gradient(180deg,#fff8fd,var(--fcl))}
.room .rw.over{border-color:var(--bad);background:repeating-linear-gradient(135deg,#ffecea,#ffecea 6px,#ffe0dc 6px,#ffe0dc 12px)}
.rw .no{font-style:normal;font-size:11px;font-weight:700;color:#97a0b3;min-width:16px;text-align:right}
.rn{flex:1;min-width:0;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd{font-size:10px;font-weight:700;color:#8a5400;background:#ffe6b0;border-radius:5px;padding:0 4px;margin-left:4px}
.rw .tm{font-size:14px;font-weight:700;padding:2px 8px;background:rgba(255,255,255,.85)}
.rw .tm.due{color:#c92a2a;border-color:#e03131;background:#fff0f0}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#e03131;margin-right:6px;vertical-align:middle}
.rw .rx{white-space:nowrap;min-height:34px;padding:0 10px;font-size:13px;font-weight:700;border-radius:10px;border:0;background:#e4e7ee;color:#566074}
.rvp h2 .bgc{margin-left:auto;min-height:28px;padding:0 10px;font-size:12px;font-weight:700;border-radius:9px;border:0;background:#e4e7ee;color:#566074;cursor:pointer}
.rv .rx{margin-left:auto}
.bgh{display:flex;align-items:center;gap:8px;padding:8px 4px 6px;font-weight:700;cursor:pointer;user-select:none}
.bgh i{font-style:normal;color:#8a93a6;width:14px}
.bgh b{color:#7a8396;font-size:13px}
.bgh button{margin-left:auto;min-height:30px;padding:0 12px;font-size:13px;font-weight:700;border-radius:10px;border:0;background:#e4e7ee;color:#566074}
.rw .lv{white-space:nowrap;min-height:34px;padding:0 12px;font-size:13px;font-weight:700;border-radius:10px;border:0;background:var(--dark);color:#fff}
.nm{font-size:18px;font-weight:700;flex:1;min-width:70px}
.tm{font-size:15px;color:var(--ink);background:#f2f4f7;border:1px solid var(--line);border-radius:8px;padding:2px 8px;cursor:pointer}
.tm.ed{border-color:#c9a23a;background:#fff7dd}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.card{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;margin-bottom:8px}
.mkc{margin-bottom:7px}
.empty{color:var(--mut);font-size:14px;padding:6px 4px;grid-column:1/-1}
.mkbox{grid-column:1/-1}
.mkf{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mkf label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
.mkf input,.mkf select,.mk-ctl input,.mk-ctl select{font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.mkf .full{grid-column:1/-1}
.mkh{margin:16px 2px 6px;font-size:16px;font-weight:800}
.mkh span{color:var(--mut);font-weight:400}
.mkh.late{color:#b4402c}
.mk-ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.mk-ctl input[type=date]{width:150px}.mk-ctl select{width:110px}
details.mkd summary{cursor:pointer;margin:16px 2px 6px;font-weight:700}
#msg{position:fixed;left:0;right:0;bottom:0;background:#3b2a24;color:#fff;padding:9px 14px;font-size:15px;display:none;z-index:9}
#modal,#amodal,#smodal,#lmodal{position:fixed;inset:0;background:rgba(20,26,40,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#smodal,#lmodal{z-index:15}
.box{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:380px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)}
#lmodal .box{max-width:460px}
.box h3{margin:0 0 12px;font-size:20px;font-weight:800}
.box h3 span{color:var(--mut);font-weight:500;font-size:15px}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--mut);font-size:14px}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtns button{min-height:52px;font-weight:700;border-radius:14px}
.sbtns .p{grid-column:1/-1}
.sbtns .g{min-height:44px;font-size:15px}
#modal input[type=time]{font:inherit;font-size:26px;width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;text-align:center}
.qk{display:flex;gap:8px;margin:10px 0}.qk button{flex:1}
#err{color:#b4402c;font-size:14px;min-height:20px}
.act{display:flex;gap:8px}.act button{flex:1}
#gate{max-width:340px;margin:18vh auto;padding:0 20px}
#gate input{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:10px 0}
.stat button.rst{margin-left:auto;font-size:13px;font-weight:700;color:#ffb3b8;border-color:rgba(255,106,116,.4)}
.stat button.rst::after{content:none}
.chip{-webkit-touch-callout:none}
.lrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;grid-column:1/-1}
.lrow span{font-size:14px;color:var(--mut);white-space:nowrap}
.lrow input{font:inherit;font-size:20px;flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:10px;text-align:center}
#mkview{padding:10px 14px 24px!important}
#mkview .mkf{padding:8px;gap:6px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border-radius:12px}
#mkview .mkf label{font-size:11px;gap:2px}
#mkview .mkf input,#mkview .mkf select{font-size:14px;padding:5px 7px}
#mkview .mkf button{min-height:34px;padding:4px 10px}
#mklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:4px 10px;align-items:start}
#mklist>.mkh,#mklist>details,#mklist>.empty,#mklist>.loading,#mklist>div[style]{grid-column:1/-1}
.mkh{margin:10px 2px 2px!important;font-size:13px!important}
details.mkd summary{margin:10px 2px 4px;font-size:13px}
.card.mkc{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;padding:5px 8px;margin-bottom:0;border-radius:10px}
.mkc .nm{font-size:15px;flex:0 0 auto;min-width:0}
.mkc .tm{font-size:12px;padding:1px 6px}
.mkc .sub{font-size:12px;margin:0;flex:1 1 140px;min-width:0}
.mkc .mk-ctl{margin:0;gap:4px;flex:0 0 auto}
.mkc .mk-ctl input[type=date]{width:118px;font-size:12px;padding:3px 4px}
.mkc .mk-ctl select{width:76px;font-size:12px;padding:3px 4px}
.mkc button{min-height:28px;padding:2px 8px;font-size:12px}
#dprev,#dnext,#drec{display:none!important}
.dl{cursor:default}
.dl input{display:none}
.cnt{cursor:pointer;min-width:26px;text-align:center}
#rmodal{position:fixed;inset:0;background:rgba(20,26,40,.5);display:none;align-items:center;justify-content:center;z-index:16;padding:16px}
#rmodal .box{max-width:520px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:50vh;overflow:auto;margin:8px 0 12px}
.ri{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 5px 3px 10px;border:1px solid var(--line);border-radius:10px;font-weight:600}
.ri button{min-height:30px;font-size:12px;padding:2px 8px}
.ri button.arm{color:var(--bad);border-color:var(--bad)}
.srch{display:flex;gap:8px;align-items:center}
.srch input{flex:1}
#rbtn{min-height:36px;padding:4px 14px;border-radius:999px;font-size:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff}
.rsep{grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--mut);margin:8px 2px 2px}
.ri.off{background:#f6f7f9;color:var(--mut)}
.undo{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 12px;margin:6px 0;border-radius:10px;background:#1e2540;color:#fff;font-weight:600}
.undo button{min-height:30px;font-size:13px;padding:2px 12px}
.card.mkc{cursor:pointer}
.card.mkc.sel{background:#fff1ec;border-color:#e8795a;box-shadow:inset 3px 0 0 #e8795a}
.undo .g{background:#fff}
.btabs{display:flex;gap:8px}
.btabs button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line,#d9dde6);background:#fff;font-weight:800;font-size:15px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.btabs button b{background:#eef0f4;border-radius:999px;padding:0 9px;font-size:13px}
.btabs button.on{background:#1e2540;color:#fff;border-color:#1e2540}
.btabs button.on b{background:rgba(255,255,255,.2);color:#fff}
.rvh{border-top:0;margin-top:0}
.rvl .rw{margin-bottom:6px}
@media(max-width:700px){.wrap .grid{grid-template-columns:minmax(0,1fr)}.bgh{padding:6px 2px;gap:4px}.bgh button{padding:0 8px;min-height:28px;font-size:12px;white-space:nowrap}.rvl .rx{min-height:28px;padding:0 6px;font-size:12px}.btabs{gap:5px}.btabs button{font-size:13px;gap:4px;padding:0 4px}.btabs button b{padding:0 6px;font-size:12px}}
.bobar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:#1e2540;color:#fff;font-weight:700}
.bobar span{margin-right:auto;white-space:nowrap}
.bobar button{min-height:34px;padding:2px 9px;font-size:13px;white-space:nowrap}
.chip.sel{background:#fff1ec;border-color:#e8795a;box-shadow:inset 3px 0 0 #e8795a}
.rw.rv{cursor:pointer;-webkit-touch-callout:none;user-select:none}
.rw.rv:active{background:#e9edf5}
.sb.undo{background:#fff;color:#1e2540;font-weight:800;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="gate" style="display:none">
  <h1>출석부</h1>
  <input id="pwin" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button class="p" id="pwok" style="width:100%">확인</button>
  <div id="gerr" style="color:#b4402c;margin-top:8px"></div>
</div>
<div id="app" style="display:none">
<header>
  <div class="top">
    <div class="tabs" id="tabs"><button data-g="금">금요일</button><button data-g="토">토요일</button><button data-g="mk">결석·보강</button><button data-g="보">일요일</button></div>
    <div class="dbar" id="dbar">
      <button id="dprev" aria-label="이전 주">&#8249;</button>
      <label class="dl" id="dl"><span id="dtxt"></span><small id="dsub"></small><input type="date" id="dpick"></label>
      <button id="dnext" aria-label="다음 주">&#8250;</button>
      <button class="g" id="drec">최근</button>
    </div>
    <div class="srch"><input id="q" type="search" placeholder="이름 검색" autocomplete="off"><button id="rbtn">명단</button></div>
  </div>
  <div class="stat" id="stat"></div>
</header>
<div id="mkview" style="display:none;padding:12px 14px 80px">
  <div class="mkf" id="mkform">
    <label>학생<input id="f_name" list="mknames" autocomplete="off"><datalist id="mknames"></datalist></label>
    <label>결석일<input id="f_abs" type="date"></label>
    <label>사유<select id="f_reason"></select></label>
    <label>보강일<input id="f_date" type="date"></label>
    <label>보강 시간대<select id="f_slot"></select></label>
    <label class="full">메모<input id="f_memo" autocomplete="off"></label>

(function(){

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function todayKey(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}

/* 처음 열 때 탭: 주소의 g 값이 있으면 그것, 없으면 오늘이 토요일일 때만 토요일 */

/* 로컬 반영 (서버 apply_와 동일 규칙) */
function recFor(g,n){var R=ST[g].rec;return R[n]||(R[n]={arrive:null,teacher:'',leave:null,status:'',memo:'',a0:null,l0:null});}
function applyLocal(op,g){

  else if(op.op==='leave'){if(!r.arrive)r.arrive=t;r.leave=t;r.status='left';}
  else if(op.op==='absent'){r.status='absent';}

  else if(op.op==='clear_day'){ST[g].rec={};}
  else if(op.op==='add_student'){if(!ST[g].roster.some(function(x){return x.name===op.name;}))ST[g].roster.push({name:op.name,grade:''});if(!r.status)delete ST[g].rec[op.name];}
  else if(op.op==='remove_student'){ST[g].roster=ST[g].roster.filter(function(x){return x.name!==op.name;});if(!r.status)delete ST[g].rec[op.name];}
  else if(op.op==='edit'){if(op.field==='arrive'){if(!r.a0)r.a0=r.arrive;r.arrive=t;}else{if(!r.l0)r.l0=r.leave;r.leave=t;}}
}
function memDec(m){m=String(m==null?'':m);if(m.indexOf('예약')===0)return m.slice(2);if(/(^|\D)0?3\s*[:시]\s*30/.test(m)||/T0?3:30/.test(m))return '3시30분';if(/(^|\D)0?2\s*[:시]\s*30/.test(m))return '2시30분';return m;}
function memEnc(m){return BOSL.indexOf(m)>=0?'예약'+m:m;}

}

}
var UNDO={'금':[],'토':[],'보':[]};

function undoLabel(ops){
  var o=ops[0],nm=o.name||'',more=ops.length>1?' 외 '+(ops.length-1)+'명':'',w;

function doUndo(){

}
function push(op){
  var g=G;

}

  saveQ(g);render();sync(g);
}
/* 지난 날짜에서는 등원·귀가 시각을 직접 입력 */
function needsTime(op){var r=ST[G].rec[op.name]||{};return op.op==='arrive'||op.op==='leave'||(op.op==='assign'&&!r.arrive);}
function act(op){

}

function gslot(n){var t=GM[n];if(!t)return '';t=memDec(String(t).trim());if(/^0?2\s*[시:]/.test(t))return '2시';if(/^0?3\s*[시:]\s*30/.test(t))return '3시30분';if(/^0?5\s*[시:]/.test(t))return '5시';return '';}
function rvSlot(n){var r=ST[G].rec[n];if(r&&!r.status&&BOSL.indexOf(r.memo)>=0)return r.memo;if(r&&r.status)return '';return gslot(n);}
function bucket(n){
  var r=ST[G].rec[n];if(!r||!r.status)return (G==='보'&&rvSlot(n))?'rv':'out';

function boOrd(g){if(g==='보강')return -1;if(g==='그 외')return 999;var k={'초':0,'중':1,'고':2}[g.charAt(0)];return (k===undefined?5:k)*10+(parseInt(g.slice(1),10)||0);}

function slotNow(){var d=new Date(),m=d.getHours()*60+d.getMinutes();return m<915?'2시':(m<1005?'3시30분':'5시');}
function curTab(){if(BOSL.indexOf(BTAB)<0)BTAB=(DATES[G]===todayKey())?slotNow():'2시';return BTAB;}

function boMain(B,all,outL){

function post(body){
  var c=new AbortController(),tm=setTimeout(function(){c.abort();},40000);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body),signal:c.signal}).then(function(r){clearTimeout(tm);return r.json();},function(e){clearTimeout(tm);throw e;});
}
function sync(g){
  g=g||G;
  var S=ST[g];
  if(S.busy||!pw)return;
  if(API.indexOf('__API')===0){errState='서버 주소 미설정';render();return;}
  S.busy=true;
  var sent=S.Q.slice(0,6),d=DATES[g];
  post({act:'ops',pw:pw,date:d,group:g,ops:sent.map(function(o){return (g==='보'&&o.op==='memo')?Object.assign({},o,{v:memEnc(o.v)}):o;})}).then(function(res){
    if(g==='보'&&res&&res.rec)recDec(res.rec);
    S.busy=false;
    if(!res.ok){
      if(res.err==='auth'){ls('att_pw',null);pw='';showGate('비밀번호가 맞지 않습니다');return;}
      errState='서버 오류';render();return;
    }
    errState='';
    S.Q.splice(0,sent.length);saveQ(g);
    if(res.errs&&res.errs.length)errState=res.errs[0];
    if(DATES[g]===d){
      if(!S.Q.length){S.roster=res.roster;S.rec=res.rec;S.mk=res.mk||[];S.loaded=true;ls(cacheKey(g,d),JSON.stringify({roster:S.roster,rec:S.rec,mk:S.mk}));}
      else if(!S.roster.length){S.roster=res.roster;}
    }
    render();
    if(S.Q.length||DATES[g]!==d)sync(g);
  }).catch(function(){S.busy=false;errState='연결 끊김 · 기록은 기기에 보관 중';render();});
}

  if(editing.field==='leave'&&r.arrive&&ms<r.arrive){er.textContent='귀가 시각이 등원 시각보다 빠릅니다';return;}
  if(editing.field==='arrive'&&r.leave&&ms>r.leave){er.textContent='등원 시각이 귀가 시각보다 늦습니다';return;}
  if(editing.field==='arrive'&&ms>Date.now()+60000){er.textContent='현재 시각보다 늦습니다';return;}
  var op;
  if(editing.mode==='new'){op=editing.op;op.t=ms;}
  else op={op:'edit',name:editing.name,field:editing.field,t:ms};
  closeEdit();push(op);
};


/* ===== 결석·보강 ===== */
var MKARM=null,MKINIT=false,MKOPEN=false,MKDEL=[],MKSEL={},MKDONE=[];
document.getElementById('mklist').addEventListener('toggle',function(ev){if(ev.target.tagName==='DETAILS')MKOPEN=ev.target.open;},true);
function mkPost(ops){
  MK.busy=true;
  return post({act:'mk',pw:pw,ops:ops||[]}).then(function(res){
    MK.busy=false;
    if(!res.ok){if(res.err==='auth'){ls('att_pw',null);pw='';showGate('비밀번호가 맞지 않습니다');return;}MK.err='서버 오류';render();return;}
    var nerr=(res.errs&&res.errs[0])||'',same=MK.loaded&&MK.err===nerr&&JSON.stringify(res.list)===JSON.stringify(MK.list);
    MK.list=res.list;MK.names=res.names;MK.loaded=true;MK.err=nerr;
    if(VIEW==='mk'&&!same)render();
    return res;
  }).catch(function(){MK.busy=false;MK.err='연결 끊김';if(VIEW==='mk')render();});
}
function mkLoad(){if(MK.busy||MKPEND>0||!pw)return;var a=document.activeElement;if(a&&document.getElementById('mklist').contains(a))return;mkPost([]);}
var MKPEND=0;
function mkOp(op){op.id=Date.now()+'-'+Math.random().toString(36).slice(2,8);MKPEND++;return mkPost([op]).then(function(r){MKPEND--;return r;},function(e){MKPEND--;throw e;});}
function mkOps(ops){ops.forEach(function(op,k){op.id=Date.now()+'-'+k+Math.random().toString(36).slice(2,8);});MKPEND++;return mkPost(ops).then(function(r){MKPEND--;return r;},function(e){MKPEND--;throw e;});}
function mkDelRows(rows){
  rows=rows.filter(function(r){return r>=0;}).sort(function(a,b){return b-a;});
  var items=rows.map(function(r){return MK.list.filter(function(m){return m.row===r;})[0];}).filter(Boolean);
  if(!items.length)return;
  MKDEL.unshift(JSON.parse(JSON.stringify(items)));MKDEL=MKDEL.slice(0,10);
  MKSEL={};MKDONE=[];
  MK.list=MK.list.filter(function(m){return rows.indexOf(m.row)<0;});
  renderMk();
  mkOps(items.map(function(m){return {op:'mk_del',row:m.row,name:m.name};}));
}
function mkLocal(row,f){MK.list.forEach(function(m){if(m.row===row){for(var k in f)m[k]=f[k];}});if(VIEW==='mk')renderMk();}
function cntOpts(){return '<option value="1">1회</option><option value="2">2회</option><option value="3">3회</option><option value="4">4회</option><option value="5">5회</option>';}
function opts(arr,sel,blank){return (blank?'<option value="">'+blank+'</option>':'')+arr.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';}).join('');}
function mkItem(m,kind){
  var late=kind==='late',nm=esc(m.name),rw=m.row,h='<div class="card mkc'+(MKSEL[rw]?' sel':'')+'" data-crow="'+rw+'" data-cname="'+nm+'"><span class="nm">'+nm+'</span>';
  h+=(m.date?'<span class="tm" style="cursor:default'+(late?';border-color:#b4402c;color:#b4402c':'')+'">'+dayLabel(m.date)+(m.slot?' '+esc(m.slot):'')+'</span>':'<span class="tm" style="cursor:default">보강일 미정</span>');
  var sub=((m.part||m.amt)?'<b>'+esc((m.part?m.part+' ':'')+(m.amt||''))+'</b> · ':'')+(m.abs?'결석 '+dayLabel(m.abs):'')+(m.reason?' · '+esc(m.reason):'')+(m.memo?' · '+esc(m.memo):'')+(m.kind?' · '+esc(m.kind):'')+(m.arr?' · 도착 '+esc(m.arr):'');
  h+='<span class="sub">'+sub+'</span><span class="mk-ctl">';
  if(!m.done){
    h+='<input type="date" data-mkf="date" data-row="'+rw+'" data-name="'+nm+'" value="'+m.date+'">';
    h+='<select data-mkf="slot" data-row="'+rw+'" data-name="'+nm+'">'+opts(SLOTS,m.slot,'시간대')+'</select>';
    h+='<button class="p" data-mk="done" data-row="'+rw+'" data-name="'+nm+'">완료</button>';
  }else{
    h+='<button class="g" data-mk="undo" data-row="'+rw+'" data-name="'+nm+'">완료 취소</button>';
  }
  var armed=MKARM&&MKARM.row===rw&&Date.now()-MKARM.t<4000;
  h+='<button class="g" data-mk="del" data-row="'+rw+'" data-name="'+nm+'"'+(armed?' style="color:#b4402c;border-color:#b4402c"':'')+'>'+(armed?'정말 삭제':'삭제')+'</button></span></div>';
  return h;
}
function renderMk(){
  if(!MKINIT){
    MKINIT=true;
    document.getElementById('f_reason').innerHTML=opts(REASONS,'','사유 선택');
    document.getElementById('f_slot').innerHTML=opts(SLOTS,'','선택 안 함');
    document.getElementById('f_abs').value=todayKey();
  }
  document.getElementById('mknames').innerHTML=MK.names.map(function(n){return '<option value="'+esc(n)+'">';}).join('');
  var L=document.getElementById('mklist'),t=todayKey();
  if(!MK.loaded){L.innerHTML='<div class="loading">'+(MK.err||'불러오는 중')+'</div>';return;}
  var pend=MK.list.filter(function(m){return !m.done&&m.kind!=='보강기회X';});
  var late=pend.filter(function(m){return m.date&&m.date<t;}).sort(function(a,b){return a.date<b.date?-1:1;});
  var tod=pend.filter(function(m){return m.date===t;});
  var up=pend.filter(function(m){return m.date&&m.date>t;}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
  var nod=pend.filter(function(m){return !m.date;});
  var done=MK.list.filter(function(m){return m.done;}).sort(function(a,b){return b.row-a.row;}).slice(0,30);
  function sec(title,arr,cls,kind){return arr.length?'<div class="mkh '+cls+'">'+title+' <span>'+arr.length+'</span></div>'+arr.map(function(m){return mkItem(m,kind);}).join(''):'';}
  Object.keys(MKSEL).forEach(function(k){if(!MK.list.some(function(m){return String(m.row)===k&&m.name===MKSEL[k];}))delete MKSEL[k];});
  var sn=Object.keys(MKSEL).length;
  var ub=(sn?'<div class="undo"><span>'+sn+'건 선택</span><span><button class="g" data-mk="clearsel">해제</button> <button class="p" data-mk="bulkdel">삭제</button></span></div>':'')+(MKDONE.length?'<div class="undo"><span>완료 처리됨 '+esc(MKDONE[0].name)+'</span><button class="p" data-mk="undodone">되돌리기</button></div>':'')+(MKDEL.length?'<div class="undo"><span>삭제됨 '+esc(MKDEL[0][0].name)+(MKDEL[0].length>1?' 외 '+(MKDEL[0].length-1)+'건':'')+'</span><button class="p" data-mk="restore">되돌리기</button></div>':'');
  var H=ub+(MK.err?'<div style="color:#b4402c;margin-top:8px">'+esc(MK.err)+'</div>':'')+
    '<div class="mkh">오늘 해야 할 보강 <span>'+tod.length+'</span></div>'+(tod.length?tod.map(function(m){return mkItem(m,'today');}).join(''):'<div class="empty">없음</div>')+sec('밀린 보강',late,'late','late')+sec('예정된 보강',up,'','up')+sec('보강일 미정',nod,'','nod')+
    
    '';
  if(L.__h!==H){L.__h=H;L.innerHTML=H;}
}
document.getElementById('f_save').onclick=function(){
  var name=document.getElementById('f_name').value.trim(),er=document.getElementById('f_err');
  if(!name){er.textContent='학생 이름을 입력하세요';return;}
  var op={op:'mk_add',name:name,abs:document.getElementById('f_abs').value,reason:document.getElementById('f_reason').value,date:document.getElementById('f_date').value,slot:document.getElementById('f_slot').value,memo:document.getElementById('f_memo').value.trim()};
  er.textContent='';
  mkOp(op).then(function(r){
    if(r&&r.errs&&r.errs.length){er.textContent=r.errs[0];return;}
    ['f_name','f_date','f_memo'].forEach(function(i){document.getElementById(i).value='';});
    document.getElementById('f_reason').value='';document.getElementById('f_slot').value='';
  });
};
document.getElementById('mklist').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-mk]');
  if(!b){
    var cd=ev.target.closest('.mkc');
    if(cd&&!ev.target.closest('input,select,button,summary')){var cr=Number(cd.getAttribute('data-crow'));if(cr>=0){if(MKSEL[cr])delete MKSEL[cr];else MKSEL[cr]=cd.getAttribute('data-cname');renderMk();}}
    return;
  }
  var a=b.getAttribute('data-mk'),row=Number(b.getAttribute('data-row')),name=b.getAttribute('data-name');
  if(row<0&&a!=='restore')return;
  if(a==='del'){
    mkDelRows([row]);
    return;
  }
  if(a==='undodone'){var d0=MKDONE.shift();if(!d0)return;mkLocal(d0.row,{done:false});mkOp({op:'mk_set',row:d0.row,name:d0.name,f:{done:false}});return;}
  if(a==='bulkdel'){mkDelRows(Object.keys(MKSEL).map(Number));return;}
  if(a==='clearsel'){MKSEL={};renderMk();return;}
  if(a==='restore'){
    var g=MKDEL.shift();if(!g)return;
    g.forEach(function(o){var oc=JSON.parse(JSON.stringify(o));oc.row=-1;MK.list.push(oc);});
    renderMk();
    var adds=g.map(function(o){return {op:'mk_add',name:o.name,abs:o.abs||'',reason:o.reason||'',date:o.date||'',slot:o.slot||'',memo:o.memo||''};});
    mkOps(adds).then(function(r){
      if(!r||!r.list)return;
      var used={};
      g.forEach(function(o){
        if(!o.done)return;
        var c=r.list.filter(function(m){return m.name===o.name&&(m.abs||'')===(o.abs||'')&&!m.done&&!used[m.row];}).sort(function(x,y){return y.row-x.row;})[0];
        if(c){used[c.row]=1;mkLocal(c.row,{done:true});mkOp({op:'mk_set',row:c.row,name:o.name,f:{done:true}});}
      });
    });
    return;
  }
  if(a==='done'){MKDONE.unshift({row:row,name:name});MKDONE=MKDONE.slice(0,10);mkLocal(row,{done:true});mkOp({op:'mk_set',row:row,name:name,f:{done:true}});}
  if(a==='undo'){mkLocal(row,{done:false});mkOp({op:'mk_set',row:row,name:name,f:{done:false}});}
});
document.getElementById('mklist').addEventListener('change',function(ev){
  var c=ev.target.closest('[data-mkf]');if(!c)return;
  var f={};f[c.getAttribute('data-mkf')]=c.value;
  mkLocal(Number(c.getAttribute('data-row')),f);
  mkOp({op:'mk_set',row:Number(c.getAttribute('data-row')),name:c.getAttribute('data-name'),f:f});
});

/* 결석·부족분 보강 팝업 */
function openAbs(mode,name){
  AB={mode:mode,name:name,g:G};
  document.getElementById('at').textContent=name+' · '+(mode==='absent'?'결석':'부족분 보강')+' ('+dayLabel(DATES[G])+')';
  document.getElementById('a_reason').innerHTML=opts(REASONS,mode==='short'?'미완료':'','사유 선택');
  document.getElementById('a_slot').innerHTML=opts(SLOTS,'','선택 안 함');
  document.getElementById('a_date').value='';document.getElementById('a_memo').value='';document.getElementById('a_err').textContent='';
  document.getElementById('a_only').style.display=mode==='absent'?'':'none';
  document.getElementById('amodal').style.display='flex';
}
document.getElementById('a_cancel').onclick=closeEdit;
document.getElementById('a_only').onclick=function(){
  if(!AB)return;var a=AB;closeEdit();push({op:'absent',name:a.name});
};
document.getElementById('a_ok').onclick=function(){
  if(!AB)return;
  var reason=document.getElementById('a_reason').value,er=document.getElementById('a_err');
  if(!reason){er.textContent='사유를 선택하세요';return;}
  var a=AB,memo=document.getElementById('a_memo').value.trim();
  var op={op:'mk_add',name:a.name,abs:DATES[a.g],reason:reason,date:document.getElementById('a_date').value,slot:document.getElementById('a_slot').value,memo:(a.mode==='short'?('부족분'+(memo?' '+memo:'')):memo)};
  closeEdit();
  if(a.mode==='absent')push({op:'absent',name:a.name});
  mkOp(op).then(function(r){
    if(!r||(r.errs&&r.errs.length)){errState='보강 등록 실패: '+((r&&r.errs&&r.errs[0])||'연결 확인')+' (결석 기록 탭에서 다시 등록)';render();}
  });
};

/* 명단 관리 */
var RV=false,REM=[];
function renderRoster(){
  var m=document.getElementById('rmodal');
  if(!RV||VIEW!=='att'){RV=false;m.style.display='none';return;}
  document.getElementById('rt2').textContent='명단 · '+G+'요일';
  var rm=REM.filter(function(n){return !ST[G].roster.some(function(x){return x.name===n;});});
  document.getElementById('rlist').innerHTML=(ST[G].roster.map(function(x){var e=esc(x.name);return '<div class="ri"><span>'+e+'</span><button class="g" data-rdel="'+e+'">빼기</button></div>';}).join('')||'<div class="empty">비어 있음</div>')+(rm.length?'<div class="rsep">방금 뺀 학생</div>'+rm.map(function(n){var e=esc(n);return '<div class="ri off"><span>'+e+'</span><button class="p" data-rres="'+e+'">복원</button></div>';}).join(''):'');
  m.style.display='flex';
}
function addStudent(){
  var i=document.getElementById('rname'),n=i.value.trim(),er=document.getElementById('rerr');
  if(!n)return;
  if(ST[G].roster.some(function(x){return x.name===n;})){er.textContent='이미 명단에 있습니다';return;}
  er.textContent='';i.value='';REM=REM.filter(function(x){return x!==n;});push({op:'add_student',name:n});
}
document.getElementById('rbtn').onclick=function(){RV=true;document.getElementById('rerr').textContent='';renderRoster();};
document.getElementById('radd').onclick=addStudent;
document.getElementById('rname').addEventListener('keydown',function(e){if(e.key==='Enter')addStudent();});
document.getElementById('rmodal').addEventListener('click',function(ev){
  if(ev.target===this||ev.target.closest('[data-close]')){RV=false;renderRoster();return;}
  var rs=ev.target.closest('[data-rres]');
  if(rs){var nr=rs.getAttribute('data-rres');REM=REM.filter(function(x){return x!==nr;});push({op:'add_student',name:nr});return;}
  var b=ev.target.closest('[data-rdel]');if(!b)return;
  var n=b.getAttribute('data-rdel');
  REM=[n].concat(REM.filter(function(x){return x!==n;})).slice(0,12);
  push({op:'remove_student',name:n});
});

function showGate(m){
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='block';
  document.getElementById('gerr').textContent=m||'';
}
document.getElementById('pwok').onclick=function(){
  var v=document.getElementById('pwin').value;if(!v)return;
  pw=v;ls('att_pw',v);start();
};
document.getElementById('pwin').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pwok').click();});

function start(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  render();syncAll();
}
pruneCache();
['금','토','보'].forEach(function(g){
  var S=ST[g];
  DATES[g]=defDate(g);
  try{S.Q=JSON.parse(ls('att_q_'+g)||'[]');}catch(e){S.Q=[];}
  loadCache(g);
});
pw=ls('att_pw')||'';
if(pw)start();else showGate('');
setInterval(syncAll,10000);
setInterval(function(){if(VIEW==='att'&&!document.hidden&&!SEL&&!editing&&!LV&&!RV&&!(G==='보'&&Object.keys(BSEL).length))render();},30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)syncAll();});
})();
