<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩그라피 6 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"rg6-01-1","no":1,"ko":"블루베리는 원래 파란색이 아니라고?","items":[{"n":1,"t":"tf","q":"If you cut a blueberry in half, you can see that its skin is actually dark red.","ko":"블루베리를 반으로 자르면 껍질이 사실은 짙은 붉은색인 것을 볼 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But if you cut one in half and take a closer look, you’ll notice that beneath its blue surface, the skin is actually dark red.","하지만 그것을 반으로 잘라서 자세히 살펴보면, 파란 표면 밑에 있는 껍질이 실제로는 짙은 붉은색인 것을 알게 될 것이다."]],"w":"3번 문장에 if you cut one in half ~ the skin is actually dark red가 있음. 반으로 자르면 껍질이 짙은 붉은색이라는 내용과 일치.","c":"T"},"h":"090fca162e"},{"n":2,"t":"tf","q":"Blueberries look blue because of the red pigment called anthocyanin.","ko":"블루베리는 안토시아닌이라는 붉은 색소 때문에 파랗게 보인다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Whereas blueberries contain a red pigment called anthocyanin, their blue color comes from a powdery coating on their skin, known as bloom.","블루베리는 안토시아닌이라는 붉은 색소를 포함하는 반면, 그들의 파란 색상은 과분으로 알려진, 껍질에 있는 가루 같은 코팅에서 나온다."]],"w":"5번 문장에서 안토시아닌은 붉은 색소이고, 파란 색상은 껍질 위의 가루 같은 코팅(bloom)에서 나온다고 함. 색소 때문이라는 말은 본문과 반대.","c":"F"},"h":"5037cb6892"},{"n":3,"t":"tf","q":"The writer thinks it is remarkable that such a tiny berry can spark big ideas.","ko":"필자는 그렇게 작은 열매가 큰 아이디어를 불러일으킬 수 있다는 것이 놀랍다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"It’s remarkable how such a tiny berry can spark big ideas for a greener future!","이처럼 작은 열매 하나가 더 친환경적인 미래를 위한 큰 아이디어를 불러일으킬 수 있다는 것은 정말 놀라운 일이다!"]],"w":"9번 문장 It's remarkable how such a tiny berry can spark big ideas에서 필자가 놀랍다고 말함. 본문과 일치.","c":"T"},"h":"5a70c5788a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... their blue color comes from a powdery coating on their skin ...)","ko":"... 그들의 파란 색상은 껍질에 있는 ( ) 코팅에서 나온다 ...","opts":["투명한","가루 같은","딱딱한","끈적한"],"word":"powdery","r":{"a":"2) 가루 같은","ev":"5번 문장","s":[[5,"Whereas blueberries contain a red pigment called anthocyanin, their blue color comes from a powdery coating on their skin, known as bloom.","블루베리는 안토시아닌이라는 붉은 색소를 포함하는 반면, 그들의 파란 색상은 과분으로 알려진, 껍질에 있는 가루 같은 코팅에서 나온다."]],"w":"5번 문장의 powdery coating은 known as bloom, 즉 껍질을 덮은 가루 같은 막. powdery = 가루 같은. 투명한·딱딱한·끈적한은 본문에 나오지 않는 설명.","c":2},"h":"40fb82199f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It's remarkable how such a tiny berry can spark big ideas ...)","ko":"이렇게 작은 열매가 큰 아이디어를 불러일으킬 수 있다는 것은 ( ) 일이다.","opts":["평범한","위험한","불가능한","놀라운"],"word":"remarkable","r":{"a":"4) 놀라운","ev":"9번 문장","s":[[9,"It’s remarkable how such a tiny berry can spark big ideas for a greener future!","이처럼 작은 열매 하나가 더 친환경적인 미래를 위한 큰 아이디어를 불러일으킬 수 있다는 것은 정말 놀라운 일이다!"]],"w":"9번 문장은 작은 열매가 큰 아이디어를 낳는다는 감탄문(끝에 !). remarkable = 놀라운. 평범한은 반대 느낌이고 위험한·불가능한은 글 흐름과 안 맞음.","c":4},"h":"9c80f34ce8"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nAmong the many colorful fruits in shades of red, orange, and yellow, one stands out for its rare color: the blueberry.","ko":"밑줄 친 its가 가리키는 것은?","sko":"빨강, 주황, 노랑 빛을 띠는 여러 가지 다양한 색의 과일들 중에서, 희귀한 색으로 눈에 띄는 과일이 하나 있는데, 바로 블루베리이다.","opts":["눈에 띄는 과일 하나(블루베리)","빨간색 과일들","노란색 과일들","여러 가지 다양한 과일 전체"],"r":{"a":"1) 눈에 띄는 과일 하나(블루베리)","ev":"1번 문장","s":[[1,"Among the many colorful fruits in shades of red, orange, and yellow, one stands out for its rare color: the blueberry.","빨강, 주황, 노랑 빛을 띠는 여러 가지 다양한 색의 과일들 중에서, 희귀한 색으로 눈에 띄는 과일이 하나 있는데, 바로 블루베리이다."]],"w":"5번 문장의 주어가 blueberries이고, their blue color는 '블루베리의 파란 색상'. 안토시아닌은 붉은 색소이고 코팅은 껍질 위에 있는 막이라, 파란 색상의 '주인'이 될 수 없음.","c":1,"k":"its = 눈에 띄는 과일 하나(블루베리)"},"pron":"its","h":"7f0dc686fe"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Blueberries are among the very few foods that appear blue.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"블루베리는 파란색으로 보이는 몇 안 되는 음식 중 하나이다.","opts":["블루베리는 파랗게 보이는 음식 중에서 아주 드문 편에 속한다.","블루베리는 세상에서 가장 파란 음식이다.","파랗게 보이는 음식은 블루베리 말고도 아주 많다.","블루베리는 파란색이라 다른 음식과 똑같다."],"r":{"a":"1) 블루베리는 파랗게 보이는 음식 중에서 아주 드문 편에 속한다.","ev":"2번 문장","s":[[2,"Blueberries are among the very few foods that appear blue.","블루베리는 파란색으로 보이는 몇 안 되는 음식 중 하나이다."]],"w":"among the very few foods는 '아주 적은 수의 음식 중에서'라는 뜻이라 파란 음식이 드물다는 말. 가장 파란 음식이라는 말도, 많다는 말도 아님.","c":1},"h":"d0081842ea"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["블루베리는 안쪽은 파랗고 바깥쪽은 붉다.","블루베리의 색 효과는 화장품, 음식, 플라스틱을 위한 친환경적인 파란색 착색제를 개발하는 데 활용될 수 있다.","블루베리 착색제는 이미 대부분의 화장품과 음식에 사용되고 있다.","블루베리는 파랗게 보이는 많은 음식 중 하나이다."],"opts":["Blueberries are blue inside and red on the outside.","The blueberry's color effect could be used to develop eco-friendly blue coloring for makeup, food, and plastic.","Blueberry coloring is already used in most makeup and food.","Blueberries are among the many foods that appear blue."],"r":{"a":"2) The blueberry's color effect could be used to develop eco-friendly blue coloring for makeup, food, and plastic. (블루베리의 색 효과는 화장품, 음식, 플라스틱을 위한 친환경적인 파란색 착색제를 개발하는 데 활용될 수 있다.)","ev":"8번 문장","s":[[8,"They could be used to develop eco-friendly blue coloring for makeup, food, and plastic.","그것들은 화장품, 음식, 플라스틱을 위한 친환경적인 파란색 착색제를 개발하는 데 활용될 수 있다."]],"w":"5번 문장에서 껍질의 가루 같은 코팅을 known as bloom이라 함. ①은 3번에서 파란 겉 표면 밑의 껍질이 붉다고 해서 안쪽이 파랗다는 말과 반대. ③은 6번에서 thinner than a sheet of paper(더 얇은)라 반대. ④는 2번에서 very few(아주 적은)라 반대.","c":2},"h":"cb07b0601d"},{"n":9,"t":"sum","q":"Researchers (A) that blueberries’ natural color effect could inspire new coloring techniques for (B) use.","ko":"연구자들은 블루베리의 천연 색 효과가 (B) 사용을 위한 새로운 색상 기술에 영감을 줄 수 있기를 (A).","oko":["(A) 바란다 / (B) 인간","(A) 두려워한다 / (B) 인간","(A) 바란다 / (B) 동물","(A) 두려워한다 / (B) 동물","(A) 부인한다 / (B) 인간"],"opts":["(A) hope / (B) human","(A) fear / (B) human","(A) hope / (B) animal","(A) fear / (B) animal","(A) deny / (B) human"],"r":{"a":"1) (A) hope / (B) human ((A) 바란다 / (B) 인간)","ev":"7번 문장","s":[[7,"Researchers hope that blueberries’ natural color effect could inspire new coloring techniques for human use.","연구자들은 블루베리의 천연 색 효과가 인간이 사용할 수 있는 새로운 색상 기술들에 영감을 줄 수 있기를 바란다."]],"w":"5번에서 붉은 색소(red pigment)를 가졌지만 파란 색은 가루 같은 코팅(coating)에서 나오고, 6번에서 그 코팅이 빛을 반사한다고 함. 따라서 (A) red, (B) coating.","c":1},"h":"053a277de7"},{"n":10,"t":"fill","q":"This coating has tiny, nearly [A] structures — thinner than a sheet of paper — that [B] light in a way that makes the berries appear blue to our eyes.","ko":"이 코팅은 종이 한 장보다 얇은, 아주 작고 거의 [A] 구조들을 가지고 있는데, 그 구조들은 우리 눈에 그 열매가 파랗게 보이게 만드는 방식으로 빛을 [B].","bko":{"invisible":"보이지 않는","reflect":"반사하다","coating":"코팅","pigment":"색소","surface":"표면","powder":"가루"},"bank":["invisible","reflect","coating","pigment","surface","powder"],"r":{"a":"[A] invisible (보이지 않는), [B] reflect (반사하다)","ev":"6번 문장","s":[[6,"This coating has tiny, nearly invisible structures — thinner than a sheet of paper — that reflect light in a way that makes the berries appear blue to our eyes.","이 코팅은 종이 한 장보다 얇은, 아주 작고 거의 보이지 않는 구조들을 가지고 있는데, 그 구조들은 우리 눈에 그 열매가 파랗게 보이게 만드는 방식으로 빛을 반사한다."]],"w":"7번 could inspire new coloring techniques(새로운 색상 기술에 영감을 주다), 8번 eco-friendly blue coloring(친환경 파란색 착색제)에서 가져옴. reflect·contain·appear는 [A] 자리에 뜻이 안 맞고, invisible은 블루베리 속 구조를 설명한 말이라 [B]에 안 맞음.","c":null},"h":"94afba6dee"}]},{"u":1,"id":"rg6-01-2","no":2,"ko":"팁은 어떻게 미국의 상징이 되었을까?","items":[{"n":1,"t":"tf","q":"Tipping in America began when wealthy Americans were influenced by English aristocrats.","ko":"미국의 팁 문화는 부유한 미국인들이 영국 귀족들에게 영향을 받으면서 시작되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It began in the 1800s when wealthy Americans traveled to Europe and were influenced by English aristocrats who tipped their servants.","그것은 부유한 미국인들이 유럽에 여행을 가서 하인에게 팁을 주던 영국 귀족들에게 영향을 받은 1800년대에 시작되었다."]],"w":"2번 문장에 It began in the 1800s when wealthy Americans traveled to Europe and were influenced by English aristocrats가 있음. 본문과 일치.","c":"T"},"h":"b4907ac385"},{"n":2,"t":"tf","q":"Many Americans thought tipping fit well with American values of equality.","ko":"많은 미국인들은 팁이 미국의 평등이라는 가치와 잘 어울린다고 생각했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Many Americans thought tipping made the workers seem inferior and went against American values of equality.","많은 미국인들은 팁이 노동자들을 열등해 보이게 하고 미국의 평등이라는 가치에 어긋난다고 생각했다."]],"w":"5번 문장에서 많은 미국인들이 팁이 노동자를 열등해 보이게 하고 평등의 가치에 went against(어긋난다)고 생각했다고 함. 어울린다는 말은 반대.","c":"F"},"h":"6a9253a3ee"},{"n":3,"t":"tf","q":"By the 1930s, tipping was banned by U.S. labor laws.","ko":"1930년대에 팁은 미국 노동법으로 금지되었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"By the 1930s, tipping was written into U.S. labor laws.","1930년대에는 팁이 미국 노동법에 명시되었다."]],"w":"10번 문장에서 1930년대에 팁은 노동법에 written into(명시되었다). 금지가 아니라 법에 포함되었다는 뜻. 금지법은 7번에서 일부 주가 만든 것.","c":"F"},"h":"8f5ccdcd9d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... tipping made the workers seem inferior and went against American values of equality.)","ko":"... 팁이 노동자들을 ( ) 해 보이게 하고 미국의 평등이라는 가치에 어긋난다 ...","opts":["우월한","부유한","열등한","정직한"],"word":"inferior","r":{"a":"3) 열등한","ev":"5번 문장","s":[[5,"Many Americans thought tipping made the workers seem inferior and went against American values of equality.","많은 미국인들은 팁이 노동자들을 열등해 보이게 하고 미국의 평등이라는 가치에 어긋난다고 생각했다."]],"w":"5번 문장은 팁에 반대한 이유. 노동자가 inferior해 보여서 평등에 어긋난다고 했으므로 inferior = 열등한. 우월한은 반대 뜻.","c":3},"h":"2fbbcc34ea"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... without having to hope for customer generosity.)","ko":"... 고객의 ( )을 바라지 않고도 ...","opts":["후한 인심","불만","요구","관심"],"word":"generosity","r":{"a":"1) 후한 인심","ev":"6번 문장","s":[[6,"Critics argued that workers should be paid fair wages without having to hope for customer generosity.","비판자들은 노동자들이 고객의 후한 인심을 바라지 않고도 공정한 임금을 받아야 한다고 주장했다."]],"w":"6번 문장은 노동자가 팁(손님의 마음) 없이도 공정한 임금을 받아야 한다는 주장. 손님이 베푸는 너그러움이 generosity = 후한 인심.","c":1},"h":"87e71cd201"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThough it has kept Americans arguing for centuries, tipping remains a unique tradition that refuses to fade away.","ko":"밑줄 친 it이 가리키는 것은?","sko":"비록 그것은 수백 년 동안 미국인들을 논쟁하게 해 왔지만, 팁은 여전히 사라지기를 거부하는 독특한 전통으로 남아 있다.","opts":["팁 문화","미국인들","노동법","서비스 경제"],"r":{"a":"1) 팁 문화","ev":"14번 문장","s":[[14,"Though it has kept Americans arguing for centuries, tipping remains a unique tradition that refuses to fade away.","팁 문화는 수백 년 동안 미국인들을 논쟁하게 해 왔지만, 여전히 사라지기를 거부하는 독특한 전통으로 남아 있다."]],"w":"2번에서 유럽에 여행 가서 영국 귀족들의 영향을 받은 사람은 wealthy Americans. 그들이 관습을 미국에 가져온 것(3번). 영국 귀족들은 팁을 준 쪽일 뿐 미국에 가져온 사람이 아님.","c":1,"k":"it = 팁 문화"},"pron":"it","h":"6015d49b5f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"With touchscreens at cafes and shops, customers are made to tip for even things like takeout and coffee.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"카페와 가게의 터치스크린을 통해, 손님들은 포장 판매 음식이나 커피 같은 것에도 팁을 내도록 강요받는다.","opts":["카페와 가게의 터치스크린 때문에, 손님들은 포장 음식이나 커피 같은 것에도 팁을 내라는 압박을 받는다.","터치스크린 덕분에 손님들은 포장 음식과 커피에는 팁을 내지 않아도 된다.","카페와 가게에서는 터치스크린 대신 직원에게 직접 팁을 건네야 한다.","터치스크린이 설치된 가게에서는 커피와 포장 음식 값이 더 저렴해진다."],"r":{"a":"1) 카페와 가게의 터치스크린 때문에, 손님들은 포장 음식이나 커피 같은 것에도 팁을 내라는 압박을 받는다.","ev":"12번 문장","s":[[12,"With touchscreens at cafes and shops, customers are made to tip for even things like takeout and coffee.","카페와 가게의 터치스크린을 통해, 손님들은 포장 판매 음식이나 커피 같은 것에도 팁을 내도록 강요받는다."]],"w":"Though(비록 ~이지만) 뒤가 '수백 년간 논쟁했지만', 주절이 '여전히 사라지지 않는 독특한 전통'. refuses to fade away는 사라지기를 거부한다는 뜻이라 지금도 남아 있다는 말.","c":1},"h":"4d08902bf8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["팁은 미국에서 시작되어 나중에 유럽으로 퍼졌다.","일부 주(州)들은 1900년대 초반에 팁을 금지하는 법을 통과시켰다.","고객들은 서비스 질을 떨어뜨린다는 이유로 팁을 거부했다.","팁은 1930년대에 미국 노동법에서 삭제되었다."],"opts":["Tipping began in the United States and later spread to Europe.","Some states passed laws to ban tipping in the early 1900s.","Customers refused tipping because it lowered service quality.","Tipping was removed from U.S. labor laws in the 1930s."],"r":{"a":"2) Some states passed laws to ban tipping in the early 1900s. (일부 주(州)들은 1900년대 초반에 팁을 금지하는 법을 통과시켰다.)","ev":"7번 문장","s":[[7,"In the early 1900s, some states even passed laws to ban tipping.","1900년대 초반에는 일부 주(州)들이 팁을 금지하는 법을 통과시키기까지 했다."]],"w":"6번 문장에서 비판자들이 공정한 임금을 받아야 한다고 주장함. ①은 2번에서 미국인이 유럽에서 배워 온 것이라 반대. ③은 9번에서 고객이 서비스 질을 높이는 수단으로 여겼다고 해 반대. ④는 10번에서 노동법에 명시되었다고 해 반대.","c":2},"h":"9d4cc3c325"},{"n":9,"t":"sum","q":"Tipping became a (A) of wealth and status in American culture, and it later gained overwhelming (B) within the service economy.","ko":"팁은 미국 문화에서 부와 지위의 (A)이(가) 되었고, 나중에 서비스 경제 내에서 압도적인 (B)을(를) 얻었다.","oko":["(A) 상징 / (B) 지지","(A) 상징 / (B) 반대","(A) 비용 / (B) 지지","(A) 규칙 / (B) 반대","(A) 비용 / (B) 법"],"opts":["(A) symbol / (B) support","(A) symbol / (B) opposition","(A) cost / (B) support","(A) rule / (B) opposition","(A) cost / (B) law"],"r":{"a":"1) (A) symbol / (B) support ((A) 상징 / (B) 지지)","ev":"3번, 8번 문장","s":[[3,"They brought the custom back, and tipping soon became a symbol of wealth and status in American culture.","그들은 그 관습을 미국에 가져왔고, 팁은 곧 미국 문화에서 부와 지위의 상징이 되었다."],[8,"Still, tipping gained overwhelming support within the service economy.","그럼에도 불구하고, 팁 문화는 서비스 경제 내에서 압도적인 지지를 얻었다."]],"w":"5번에서 팁이 미국의 평등(equality)이라는 가치에 어긋난다고 생각했고, 7번에서 일부 주가 팁을 금지(ban)하는 법을 통과시켰음. (A)가 부유함이면 5번과 다르고, (B)가 요구·환영·장려면 7번과 반대.","c":1},"h":"82c6585b1b"},{"n":10,"t":"fill","q":"Today, tipping has [A] beyond traditional settings, and this has sparked [B] about when tipping is appropriate.","ko":"오늘날 팁을 주는 행위는 전통적인 환경을 넘어 [A]. 이것은 팁이 언제 적절한지에 대한 [B]을(를) 불러일으켰다.","bko":{"expanded":"확장되었다","debates":"논쟁","welcomed":"환영했다","banned":"금지했다","inferior":"열등한","wages":"임금"},"bank":["expanded","debates","welcomed","banned","inferior","wages"],"r":{"a":"[A] expanded (확장되었다), [B] debates (논쟁)","ev":"11~13번 문장","s":[[11,"Today, tipping has expanded beyond traditional settings.","오늘날 팁을 주는 행위는 전통적인 환경을 넘어 확장되었다."],[12,"With touchscreens at cafes and shops, customers are made to tip for even things like takeout and coffee.","카페와 가게의 터치스크린을 통해, 손님들은 포장 판매 음식이나 커피 같은 것에도 팁을 내도록 강요받는다."],[13,"This has sparked debates about when tipping is appropriate.","이것은 팁을 주는 것이 언제 적절한지에 대한 논쟁을 불러일으켰다."]],"w":"11번 tipping has expanded beyond traditional settings, 13번 This has sparked debates about when tipping is appropriate에서 가져옴. welcomed·banned는 beyond(~을 넘어)와 안 어울리고, inferior·wages는 sparked 뒤에서 '언제 적절한지'에 대한 말이 될 수 없음.","c":null},"h":"0dd16d3734"}]},{"u":1,"id":"rg6-01-3","no":3,"ko":"왜 아이슬란드 사람들은 아기 새를 절벽에서 던질까?","items":[{"n":1,"t":"tf","q":"Puffins nest on high cliffs and care for their chicks there.","ko":"퍼핀은 높은 절벽에 둥지를 틀고 그곳에서 새끼들을 돌본다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They nest on high cliffs, where they care for their chicks, known as pufflings.","그들은 높은 절벽에 둥지를 틀고, 그곳에서 퍼플링(새끼 퍼핀)이라고 알려진 새끼들을 돌본다."]],"w":"4번 문장 They nest on high cliffs, where they care for their chicks에서 높은 절벽에서 새끼를 돌본다고 함. 본문과 일치.","c":"T"},"h":"4279885fb1"},{"n":2,"t":"tf","q":"Pufflings take their first journey during the day and follow the sun to the sea.","ko":"새끼 퍼핀들은 낮에 첫 여정을 떠나 태양을 따라 바다로 간다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"When pufflings are ready to leave, they take their first journey at night.","새끼 퍼핀들이 떠날 준비가 되면, 그들은 밤에 첫 여정을 떠난다."],[6,"They follow the moonlight to find their way to the sea.","그들은 바다로 가는 길을 찾기 위해 달빛을 따라간다."]],"w":"5번에서 새끼 퍼핀들은 at night(밤에) 첫 여정을 떠나고, 6번에서 moonlight(달빛)을 따라간다고 함. 낮, 태양은 틀림.","c":"F"},"h":"b54a4f271a"},{"n":3,"t":"tf","q":"Icelanders carefully take lost pufflings to the cliffs and give them a gentle toss.","ko":"아이슬란드 사람들은 길 잃은 새끼 퍼핀들을 조심스럽게 절벽으로 데려가 부드럽게 던져 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"10~11번 문장","s":[[10,"During the season when pufflings leave their nests, families and rescue teams walk the streets at night in search of lost pufflings.","새끼 퍼핀들이 둥지를 떠나는 계절 동안, 가족과 구조대는 길 잃은 새끼 퍼핀을 찾아 밤에 길거리를 걷는다."],[11,"They carefully bring the birds to the cliffs and give them a gentle toss.","그들은 조심스럽게 새들을 절벽으로 데려가 부드럽게 던져 준다."]],"w":"10번에서 길 잃은 새끼 퍼핀을 찾고, 11번에서 They carefully bring the birds to the cliffs and give them a gentle toss라고 함. 본문과 일치.","c":"T"},"h":"7c856afc95"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Although this may look brutal, it is actually a thoughtful tradition ...)","ko":"이것은 ( ) 보일 수 있지만, 사실 사려 깊은 전통이다.","opts":["사려 깊은","잔인한","아름다운","조용한"],"word":"brutal","r":{"a":"2) 잔인한","ev":"1~2번 문장","s":[[1,"In late summer or early autumn in Iceland, you might witness an unusual sight: people throwing baby birds off cliffs!","아이슬란드의 늦여름이나 초가을에, 당신은 사람들이 절벽에서 아기 새를 던지는 이색적인 광경을 목격할지도 모른다!"],[2,"Although this may look brutal, it is actually a thoughtful tradition that helps these young birds begin their first journey.","이것은 잔인해 보일 수 있지만, 사실 이 어린 새들이 첫 여정을 시작하도록 돕는 사려 깊은 전통이다."]],"w":"1번에서 아기 새를 절벽에서 던진다고 하고, 2번의 Although(비록 ~이지만)로 반전해 '사실은 사려 깊은 전통'이라고 함. 반전 앞에 오는 겉모습이니 brutal = 잔인한.","c":2},"h":"f8ac68101b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This gives the pufflings, exhausted from failed attempts, the boost ...)","ko":"이것은 실패한 시도들로 ( ) 새끼 퍼핀들에게 ... 추진력을 제공해 준다.","opts":["신난","배고픈","안전한","지친"],"word":"exhausted","r":{"a":"4) 지친","ev":"12번 문장","s":[[12,"This gives the pufflings, exhausted from failed attempts, the boost they need to take flight.","이것은 실패한 시도들로 지친 새끼 퍼핀들에게 날아오르는 데 필요한 추진력을 제공해 준다."]],"w":"12번은 여러 번 날아 보려다 실패한 새끼 퍼핀들에게 추진력을 준다는 내용. 계속 실패했으니 exhausted = 지친. 신난·안전한은 상황과 맞지 않음.","c":4},"h":"588e98f476"},{"n":6,"t":"ref","q":"What does the underlined \"these birds\" refer to?\nThe annual effort to guide pufflings safely to the sea not only helps conserve these birds but also brings the community together in a festive and meaningful way.","ko":"밑줄 친 these birds이 가리키는 것은?","sko":"새끼 퍼핀들을 안전하게 바다로 안내하기 위한 매년의 노력은 이 새들을 보호하는 데 도움이 될 뿐만 아니라, 축제 같고 뜻깊은 방식으로 지역 공동체를 함께 모이게 한다.","opts":["새끼 퍼핀들","아이슬란드 사람들","지역 공동체 사람들","바다의 물고기들"],"r":{"a":"1) 새끼 퍼핀들","ev":"14번 문장","s":[[14,"The annual effort to guide pufflings safely to the sea not only helps conserve these birds but also brings the community together in a festive and meaningful way.","새끼 퍼핀들을 안전하게 바다로 안내하기 위한 매년의 노력은 이 새들을 보호하는 데 도움이 될 뿐만 아니라, 축제 같고 뜻깊은 방식으로 지역 공동체를 함께 모이게 한다."]],"w":"11번의 the birds는 10번에서 가족과 구조대가 찾은 lost pufflings(길 잃은 새끼 퍼핀들). 절벽으로 데려가 던져 주는 대상이 them. 가족과 구조대는 던져 주는 사람임.","c":1,"k":"these birds = 새끼 퍼핀들"},"pron":"these birds","h":"a755f1e5cb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of flying to the ocean, they may head toward the city, which can lead to dangerous crashes or falls on buildings, streets, or harbors.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"바다로 날아가는 대신, 그들은 도시 쪽으로 향할 수도 있으며, 그로 인해 건물, 도로, 또는 항구에 충돌하거나 추락하는 위험한 사고로 이어질 수 있다.","opts":["바다로 가지 않고 도시로 가면 건물이나 도로, 항구에 부딪히거나 떨어질 위험이 있다.","도시로 날아가면 안전하게 살 수 있어서 바다에 가지 않아도 된다.","건물과 도로를 이용하면 바다로 더 빨리 날아갈 수 있다.","항구에서 쉬었다가 바다로 날아가는 것이 가장 안전하다."],"r":{"a":"1) 바다로 가지 않고 도시로 가면 건물이나 도로, 항구에 부딪히거나 떨어질 위험이 있다.","ev":"8번 문장","s":[[8,"Instead of flying to the ocean, they may head toward the city, which can lead to dangerous crashes or falls on buildings, streets, or harbors.","바다로 날아가는 대신, 그들은 도시 쪽으로 향할 수도 있으며, 그로 인해 건물, 도로, 또는 항구에 충돌하거나 추락하는 위험한 사고로 이어질 수 있다."]],"w":"Instead of ~는 '~ 대신에', which can lead to dangerous crashes는 위험한 사고로 이어질 수 있다는 뜻. 도시가 안전하다거나 건물·도로를 이용한다는 말은 없음.","c":1},"h":"c566d3c218"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["퍼핀은 해변에 둥지를 틀고 새끼들은 정오에 떠난다.","새끼 퍼핀들은 바다를 찾기 위해 도시의 밝은 불빛을 따라간다.","아이슬란드 사람들은 퍼핀에 대해 깊은 애정을 가지고 있다.","새끼 퍼핀을 돕는 매년의 노력은 지역 공동체에 해를 끼친다."],"opts":["Puffins nest on the beach and their chicks leave at noon.","Pufflings follow the bright lights of towns to find the sea.","Icelanders have a deep affection for puffins.","The yearly effort to help pufflings harms the local community."],"r":{"a":"3) Icelanders have a deep affection for puffins. (아이슬란드 사람들은 퍼핀에 대해 깊은 애정을 가지고 있다.)","ev":"9번 문장","s":[[9,"Fortunately, the people of Iceland have a deep affection for puffins.","다행히도, 아이슬란드 사람들은 퍼핀에 대해 깊은 애정을 가지고 있다."]],"w":"9번에서 사람들이 퍼핀에 깊은 애정(deep affection)을 가졌고, 10번에서 길 잃은 새끼 퍼핀을 찾아 돕는다고 함. ①은 4~5번에서 높은 절벽 둥지, 밤 출발이라 반대. ②는 6번에서 달빛을 따라간다고 하고 7번에서 도시 불빛은 오히려 혼란을 준다고 해서 반대. ④는 14번에서 공동체를 함께 모이게 한다고 해서 반대.","c":3},"h":"c0f355b5c9"},{"n":9,"t":"sum","q":"Puffins are small (A) beloved as a (B) of Iceland.","ko":"퍼핀은 아이슬란드의 (B)(으)로 사랑받는 작은 (A)이다.","oko":["(A) 바닷새 / (B) 상징","(A) 물고기 / (B) 상징","(A) 바닷새 / (B) 적","(A) 물고기 / (B) 적","(A) 곤충 / (B) 음식"],"opts":["(A) seabirds / (B) symbol","(A) fish / (B) symbol","(A) seabirds / (B) enemy","(A) fish / (B) enemy","(A) insects / (B) food"],"r":{"a":"1) (A) seabirds / (B) symbol ((A) 바닷새 / (B) 상징)","ev":"3번 문장","s":[[3,"Puffins are small seabirds beloved as a symbol of Iceland.","퍼핀은 아이슬란드의 상징으로 사랑받는 작은 바닷새이다."]],"w":"5~6번에서 새끼 퍼핀들은 밤에 moonlight(달빛)을 따라 바다로 가고, 7번에서 도시의 밝은 불빛이 그들을 confuse(혼란스럽게 한다)고 함. 햇빛·별은 본문에 없고 protect·help·feed는 7번과 반대.","c":1},"h":"6c904c07ee"},{"n":10,"t":"fill","q":"Once in the air, their wings [A] flap, and they are [B] safely to the ocean.","ko":"일단 공중에 뜨면, 그들의 날개는 [A] 퍼덕이고, 그들은 안전하게 바다로 [B].","bko":{"instinctively":"본능적으로","carried":"옮겨졌다","exhausted":"지친","brutal":"잔인한","bright":"밝은","dangerous":"위험한"},"bank":["instinctively","carried","exhausted","brutal","bright","dangerous"],"r":{"a":"[A] instinctively (본능적으로), [B] carried (옮겨졌다)","ev":"13번 문장","s":[[13,"Once in the air, their wings instinctively flap, and they are carried safely to the ocean.","일단 공중에 뜨면, 그들의 날개는 본능적으로 퍼덕이고, 그들은 안전하게 바다로 옮겨진다."]],"w":"11번 They carefully bring the birds to the cliffs and give them a gentle toss, 12번 the boost they need to take flight에서 가져옴. flap·crash는 사람이 새를 절벽에 '데려가는' 동작이 아니고, harbor·brutal은 날아오르는 데 필요한 것이 될 수 없음.","c":null},"h":"afd572b130"}]},{"u":2,"id":"rg6-02-1","no":1,"ko":"머리가 없는데 머리라고? 불가사리의 비밀","items":[{"n":1,"t":"tf","q":"Sea stars have a brain, blood, and a distinct head.","ko":"불가사리는 뇌, 혈액, 그리고 뚜렷한 머리를 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"They don’t have a brain, blood, or a distinct head.","그들은 뇌, 혈액, 또는 뚜렷한 머리를 가지고 있지 않다."]],"w":"2번 문장에서 They don't have a brain, blood, or a distinct head라고 함. 세 가지 모두 없다는 말이므로 본문과 반대.","c":"F"},"h":"8bee63f5cd"},{"n":2,"t":"tf","q":"Most animals, like humans, have bodies divided into a left side and a right side.","ko":"인간처럼 대부분의 동물들은 왼쪽과 오른쪽으로 나뉜 몸을 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Most animals, like humans, have bodies divided into two equal halves — a left side and a right side.","인간처럼 대부분의 동물들은 왼쪽과 오른쪽이라는 두 개의 동일한 절반으로 나뉜 몸을 가지고 있다."]],"w":"6번 문장에서 대부분의 동물은 두 개의 동일한 절반, 즉 왼쪽과 오른쪽으로 나뉜 몸을 가진다고 함. 본문과 일치.","c":"T"},"h":"1ee2c0c22a"},{"n":3,"t":"tf","q":"Sea stars have a head in only one part of their body.","ko":"불가사리는 몸의 한 부분에만 머리를 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"This suggests that, rather than having a head in one part of the body, sea stars distribute head-like functions throughout their entire body.","이것은 불가사리가 몸의 한 부분에 머리를 가지고 있기보다는, 머리와 같은 기능을 몸 전체에 분산시킨다는 것을 시사한다."]],"w":"9번 문장에서 rather than having a head in one part of the body, sea stars distribute head-like functions throughout their entire body라고 함. 한 부분에만 있다는 말과 반대.","c":"F"},"h":"d52233c9e1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... sea stars distribute head-like functions throughout their entire body.)","ko":"... 불가사리는 머리와 같은 기능을 몸 전체에 ( ) 것이다.","opts":["숨기다","잃다","분산시키다","바꾸다"],"word":"distribute","r":{"a":"3) 분산시키다","ev":"9번 문장","s":[[9,"This suggests that, rather than having a head in one part of the body, sea stars distribute head-like functions throughout their entire body.","이것은 불가사리가 몸의 한 부분에 머리를 가지고 있기보다는, 머리와 같은 기능을 몸 전체에 분산시킨다는 것을 시사한다."]],"w":"9번은 한 부분에 머리가 있기보다 몸 전체에 머리 같은 기능이 퍼져 있다는 내용. 그래서 distribute = 분산시키다. 숨기거나 잃는다는 말은 없음.","c":3},"h":"c824e35459"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... lead scientists to reconsider what a head truly is.)","ko":"... 과학자들로 하여금 머리가 진정 무엇인지 ( ) 만든다.","opts":["다시 생각하다","무시하다","증명하다","잊다"],"word":"reconsider","r":{"a":"1) 다시 생각하다","ev":"14번 문장","s":[[14,"These discoveries provide creative examples of how life can evolve, and lead scientists to reconsider what a head truly is.","이러한 발견들은 생명이 어떻게 진화할 수 있는지에 대한 창의적인 예시를 제공하며, 과학자들로 하여금 머리가 진정 무엇인지를 다시 생각하게 만든다."]],"w":"14번은 새 발견이 머리가 무엇인지 '다시 생각하게' 만든다는 내용. reconsider = 다시 생각하다. 무시·잊다는 글 흐름과 안 맞음.","c":1},"h":"6276b8612d"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhen scientists studied the genes of sea stars and compared them to the genes of other animals, they discovered that sea stars have genetic patterns similar to the ones that form the ‘head’ in other animals.","ko":"밑줄 친 they가 가리키는 것은?","sko":"과학자들이 불가사리의 유전자를 연구하고 그것을 다른 동물들의 유전자와 비교했을 때, 그들은 불가사리가 다른 동물에서 '머리'를 형성하는 것과 유사한 유전적 패턴을 가지고 있다는 것을 발견했다.","opts":["불가사리들","과학자들","다른 동물들","유전자들"],"r":{"a":"2) 과학자들","ev":"8번 문장","s":[[8,"When scientists studied the genes of sea stars and compared them to the genes of other animals, they discovered that sea stars have genetic patterns similar to the ones that form the ‘head’ in other animals.","과학자들이 불가사리의 유전자를 연구하고 그것을 다른 동물들의 유전자와 비교했을 때, 그들은 불가사리가 다른 동물에서 '머리'를 형성하는 것과 유사한 유전적 패턴을 가지고 있다는 것을 발견했다."]],"w":"9번의 This는 바로 앞 8번의 발견(유전자를 비교했더니 머리를 만드는 것과 비슷한 유전적 패턴이 있었다)을 가리킴. 그 발견이 '머리 기능이 몸 전체에 분산'이라는 결론의 근거가 됨.","c":2,"k":"they = 과학자들"},"pron":"they","h":"6025c7f6d6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since sea stars don’t have a visible head, scientists once thought they didn’t have one at all.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"불가사리는 눈에 보이는 머리가 없기 때문에, 과학자들은 한때 그들이 머리를 아예 갖고 있지 않다고 생각했다.","opts":["불가사리는 눈에 보이는 머리가 없어서 과학자들은 한때 머리가 아예 없다고 생각했다.","불가사리는 머리가 매우 커서 과학자들이 한때 머리만 연구했다.","과학자들은 불가사리에게 머리가 있다고 항상 확신해 왔다.","불가사리는 머리가 보이지만 과학자들은 한때 그것을 믿지 않았다."],"r":{"a":"1) 불가사리는 눈에 보이는 머리가 없어서 과학자들은 한때 머리가 아예 없다고 생각했다.","ev":"4번 문장","s":[[4,"Since sea stars don’t have a visible head, scientists once thought they didn’t have one at all.","불가사리는 눈에 보이는 머리가 없기 때문에, 과학자들은 한때 그들이 머리를 아예 갖고 있지 않다고 생각했다."]],"w":"9번에서 머리 기능이 몸 전체에 분산된다고 했으므로, '머리를 가진 것이 아니라 몸 자체가 머리'라는 말. 머리가 하나뿐이라는 말은 9번과 반대이고, 느끼지 못한다는 말은 12번과 반대.","c":1},"h":"eceefa1591"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["과학자들은 불가사리가 머리를 가지고 있다는 것을 항상 알고 있었다.","불가사리는 인간처럼 왼쪽과 오른쪽을 가지고 있다.","불가사리는 다섯 개의 동일한 부분을 가진 원형으로 배열된 몸을 가지고 있다.","불가사리의 발은 반응하기 위해 별개의 머리의 도움이 필요하다."],"opts":["Scientists have always known that sea stars have a head.","Sea stars have a left side and a right side like humans.","Sea stars have bodies arranged in a circular shape with five equal sections.","A sea star's feet need help from a distinct head to react."],"r":{"a":"3) Sea stars have bodies arranged in a circular shape with five equal sections.","ev":"4번, 6~7번, 13번 문장","s":[[4,"Since sea stars don’t have a visible head, scientists once thought they didn’t have one at all.","불가사리는 눈에 보이는 머리가 없기 때문에, 과학자들은 한때 그들이 머리를 아예 갖고 있지 않다고 생각했다."],[6,"Most animals, like humans, have bodies divided into two equal halves — a left side and a right side.","인간처럼 대부분의 동물들은 왼쪽과 오른쪽이라는 두 개의 동일한 절반으로 나뉜 몸을 가지고 있다."],[7,"In contrast, sea stars have bodies arranged in a circular shape with five equal sections.","반면에, 불가사리는 다섯 개의 동일한 부분을 가진 원형으로 배열된 몸을 가지고 있다."],[13,"For example, when their feet detect something, their feet simultaneously act as independent decision-makers, reacting without help from a distinct head.","예를 들어, 그들의 발이 무언가를 감지하면, 발은 동시에 독립적인 의사 결정자의 역할을 하며, 별개의 머리의 도움 없이 반응한다."]],"w":"7번 문장에서 불가사리의 몸은 다섯 개의 동일한 부분을 가진 원형이라고 함. ①은 4번에서 한때 머리가 없다고 생각했다고 해서 반대. ②는 6~7번에서 좌우로 나뉜 것은 대부분의 동물이고 불가사리는 아니라 반대. ④는 13번에서 별개의 머리의 도움 없이 반응한다고 해서 반대.","c":3},"h":"9b91372ab7"},{"n":9,"t":"sum","q":"Sea stars are one of the world’s most (A) marine creatures, and their strange (B) features have puzzled scientists.","ko":"불가사리는 세계에서 가장 (A) 해양 생물 중 하나이며, 그들의 이상한 (B) 특징은 과학자들을 당혹스럽게 해 왔다.","oko":["(A) 특이한 / (B) 생물학적","(A) 흔한 / (B) 생물학적","(A) 특이한 / (B) 인공적","(A) 흔한 / (B) 인공적","(A) 위험한 / (B) 인공적"],"opts":["(A) unusual / (B) biological","(A) common / (B) biological","(A) unusual / (B) artificial","(A) common / (B) artificial","(A) dangerous / (B) artificial"],"r":{"a":"1) (A) unusual / (B) biological ((A) 특이한 / (B) 생물학적)","ev":"1번, 3번 문장","s":[[1,"Sea stars, or starfish, are one of the world’s most unusual marine creatures.","바다별, 즉 불가사리는 세계에서 가장 특이한 해양 생물 중 하나이다."],[3,"For years, their strange biological features have puzzled scientists.","수년 동안, 그들의 이상한 생물학적 특징은 과학자들을 당혹스럽게 해 왔다."]],"w":"9번에서 sea stars distribute head-like functions throughout their entire body(머리와 같은 기능을 몸 전체에 분산시킨다)고 함. 그래서 (A) functions, (B) distributed. 사라졌거나 숨겨지거나 제거되었다는 말은 없음.","c":1},"h":"4a0fe6a5a5"},{"n":10,"t":"fill","q":"Each part of a sea star can sense, process, and [A] to information on its own, so a foot can act as an [B] decision-maker.","ko":"불가사리의 각 부위는 스스로 정보를 감지하고, 처리하고, [A]할 수 있어서, 발이 [B] 의사 결정자의 역할을 할 수 있다.","bko":{"respond":"반응하다","independent":"독립적인","circular":"원형의","genetic":"유전적인","marine":"해양의","visible":"눈에 보이는"},"bank":["respond","independent","circular","genetic","marine","visible"],"r":{"a":"[A] respond, [B] independent","ev":"12~13번 문장","s":[[12,"Each part — whether a foot, an arm, or a mouth — can sense, process, and respond to information on its own.","발이든, 팔이든, 입이든, 각각의 부위는 스스로 정보를 감지하고, 처리하고, 반응할 수 있다."],[13,"For example, when their feet detect something, their feet simultaneously act as independent decision-makers, reacting without help from a distinct head.","예를 들어, 그들의 발이 무언가를 감지하면, 발은 동시에 독립적인 의사 결정자의 역할을 하며, 별개의 머리의 도움 없이 반응한다."]],"w":"12번 can sense, process, and respond to information on its own, 13번 act as independent decision-makers에서 가져옴. circular·genetic·marine·visible은 불가사리 몸 모양이나 특징을 설명한 말이라 '반응하다'와 '의사 결정자를 꾸미는 말' 자리에 맞지 않음.","c":null},"h":"b99b16cf16"}]},{"u":2,"id":"rg6-02-2","no":2,"ko":"쉬엄쉬엄 운동해도 효과가 있다고?","items":[{"n":1,"t":"tf","q":"Zone 1 includes very light activities, like slow walking.","ko":"Zone 1은 느리게 걷기와 같은 매우 가벼운 활동을 포함한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Zone 1 includes very light activities, like slow walking, while Zone 5 involves maximum effort, such as sprinting.","Zone 1은 느리게 걷기와 같은 매우 가벼운 활동을 포함하는 반면, Zone 5는 전력 질주와 같은 최대한의 노력을 수반한다."]],"w":"3번 문장에서 Zone 1 includes very light activities, like slow walking이라고 함. 본문과 일치.","c":"T"},"h":"4e12190d8d"},{"n":2,"t":"tf","q":"Zone 2 exercise happens when your heart rate is at its maximum.","ko":"Zone 2 운동은 심박수가 최대일 때 이루어진다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Zone 2 exercise happens when your heart rate is 60 to 70 percent of its maximum.","Zone 2 운동은 심박수가 최대치의 60~70%일 때 이루어진다."]],"w":"6번 문장에서 Zone 2는 심박수가 최대치의 60~70%일 때라고 함. 최대일 때는 3번의 Zone 5(maximum effort) 쪽 설명이라 틀림.","c":"F"},"h":"55eeaefcfc"},{"n":3,"t":"tf","q":"Zone 2 training improves heart health by increasing the heart's ability to handle physical activity.","ko":"Zone 2 운동은 신체 활동을 감당하는 심장의 능력을 높여서 심장 건강을 향상시킨다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Zone 2 training also improves heart health by increasing its ability to handle physical activity.","Zone 2 운동은 또한 신체 활동을 감당하는 심장의 능력을 높임으로써 심장 건강을 향상시킨다."]],"w":"12번 문장 Zone 2 training also improves heart health by increasing its ability to handle physical activity와 일치. its는 심장을 가리킴.","c":"T"},"h":"4467ec9864"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (How intense are your workouts?)","ko":"당신의 운동은 얼마나 ( ) 한가?","opts":["부드러운","짧은","격렬한","따분한"],"word":"intense","r":{"a":"3) 격렬한","ev":"1~3번 문장","s":[[1,"How intense are your workouts?","당신의 운동은 얼마나 격렬한가?"],[2,"Exercise intensity is typically divided into five zones.","운동 강도는 일반적으로 다섯 개의 구간으로 나뉜다."],[3,"Zone 1 includes very light activities, like slow walking, while Zone 5 involves maximum effort, such as sprinting.","Zone 1은 느리게 걷기와 같은 매우 가벼운 활동을 포함하는 반면, Zone 5는 전력 질주와 같은 최대한의 노력을 수반한다."]],"w":"1번 질문 뒤 2번에서 운동 강도(intensity)가 다섯 구간으로 나뉜다고 하고, 3번에서 Zone 5는 전력 질주 같은 최대한의 노력이라고 함. intense = 격렬한. 부드러운은 반대 뜻.","c":3},"h":"cd91be64e7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... perfect for anyone wanting a steady, enjoyable workout.)","ko":"... ( ) 즐거운 운동을 원하는 누구에게나 알맞다.","opts":["꾸준한","갑작스러운","위험한","비싼"],"word":"steady","r":{"a":"1) 꾸준한","ev":"9번 문장","s":[[9,"It’s a pace you can maintain for a long time, which makes it perfect for anyone wanting a steady, enjoyable workout.","그것은 당신이 오랫동안 유지할 수 있는 속도이며, 꾸준하고 즐거운 운동을 원하는 누구에게나 알맞다."]],"w":"9번은 오랫동안 유지할 수 있는 속도(a pace you can maintain)라서 steady enjoyable workout은 꾸준하고 즐거운 운동. steady = 꾸준한. 갑작스러운·위험한은 글 흐름과 반대.","c":1},"h":"e350aa2603"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nOne of Zone 2’s biggest benefits is that it boosts energy use and endurance.","ko":"밑줄 친 it이 가리키는 것은?","sko":"Zone 2 운동의 가장 큰 이점 중 하나는 에너지 사용과 지구력을 신장시킨다는 점이다.","opts":["Zone 2 운동","에너지 사용","지구력","가장 큰 이점"],"r":{"a":"1) Zone 2 운동","ev":"10번 문장","s":[[10,"One of Zone 2’s biggest benefits is that it boosts energy use and endurance.","Zone 2 운동의 가장 큰 이점 중 하나는 에너지 사용과 지구력을 신장시킨다는 점이다."]],"w":"12번에서 heart health(심장 건강)를 향상시키는 방법이 '신체 활동을 감당하는 its ability를 높이는 것'. 신체 활동을 감당하는 능력을 가진 것은 심장이므로 its = heart.","c":1,"k":"it = Zone 2 운동"},"pron":"it","h":"673f75742c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A simple way to know if you're working out in Zone 2 is the “talk test” — you should be able to chat comfortably without losing your breath.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 Zone 2에서 운동하고 있는지를 알아보는 간단한 방법은 '말하기 테스트'인데, 숨이 차지 않으면서 편하게 대화할 수 있어야 한다.","opts":["운동 중에 대화를 하면 운동 효과가 떨어지므로 말을 하지 않아야 한다.","숨이 차지 않으면서 편하게 대화할 수 있다면 Zone 2에서 운동 중인 것이다.","말을 하지 못할 만큼 숨이 차야 Zone 2 운동이다.","Zone 2에서는 조용히 운동해야 한다."],"r":{"a":"2) 숨이 차지 않으면서 편하게 대화할 수 있다면 Zone 2에서 운동 중인 것이다.","ev":"8번 문장","s":[[8,"A simple way to know if you’re working out in Zone 2 is the “talk test” — you should be able to chat comfortably without losing your breath.","당신이 Zone 2에서 운동하고 있는지를 알아보는 간단한 방법은 '말하기 테스트'인데, 숨이 차지 않으면서 편하게 대화할 수 있어야 한다."]],"w":"a simple way to know if ~는 ~인지 아는 간단한 방법. 말하기 테스트: without losing your breath(숨이 차지 않고) 편하게 대화하면 Zone 2. 숨이 찰 만큼이면 Zone 2가 아님.","c":2},"h":"85c3a636d2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Zone 1은 전력 질주와 같은 최대한의 노력을 수반한다.","Zone 5 운동은 항상 최고의 결과를 낸다.","Zone 2 운동은 체중을 줄이려는 사람만을 위한 것이다.","Zone 2에서는 몸이 지방을 주요 에너지원으로 연소시킨다."],"opts":["Zone 1 involves maximum effort, such as sprinting.","Zone 5 workouts always produce the best results.","Zone 2 exercise is only for people who want to lose weight.","In Zone 2, your body burns fat as its main energy source."],"r":{"a":"4) In Zone 2, your body burns fat as its main energy source. (Zone 2에서는 몸이 지방을 주요 에너지원으로 연소시킨다.)","ev":"11번 문장","s":[[11,"At this level, your body burns fat as its main energy source, which not only helps with weight loss but also enhances stamina.","이 강도에서 당신의 신체는 지방을 주요 에너지원으로 연소시키는데, 이는 체중 감량에 도움을 줄 뿐만 아니라 체력도 향상시킨다."]],"w":"11번 문장에서 이 강도에서 몸은 지방을 주요 에너지원으로 연소시킨다고 함. ①은 3번에서 최대한의 노력은 Zone 5라서 반대. ②는 4번에서 항상 사실은 아니라고 해 반대. ③은 13번에서 욱신거리거나 지치지 않아 다음 날 운동할 수 있다고 해 반대.","c":4},"h":"cb4ee7b93c"},{"n":9,"t":"sum","q":"Zone 2 training, a (A)-to-moderate intensity exercise, helps you stay healthy and build (B) energy.","ko":"(A)강도에서 중간 강도까지의 운동인 Zone 2 운동은 건강을 유지하고 (B) 에너지를 쌓는 데 도움이 된다.","oko":["(A) 높은 / (B) 지속적인","(A) 낮은 / (B) 지속적인","(A) 낮은 / (B) 갑작스러운","(A) 최대 / (B) 지속적인","(A) 높은 / (B) 갑작스러운"],"opts":["(A) high / (B) lasting","(A) low / (B) lasting","(A) low / (B) sudden","(A) maximum / (B) lasting","(A) high / (B) sudden"],"r":{"a":"2) (A) low / (B) lasting","ev":"5번 문장","s":[[5,"Zone 2 training, a low-to-moderate intensity exercise, is one of the best ways to stay healthy and build lasting energy.","중저강도 운동인 Zone 2 운동은 건강을 유지하고 지속적인 에너지를 쌓는 가장 좋은 방법 중 하나이다."]],"w":"5번에서 Zone 2 training은 a low-to-moderate intensity exercise이고, 건강을 유지하고 lasting energy(지속적인 에너지)를 쌓는 좋은 방법이라고 함. 따라서 (A) low, (B) lasting.","c":2},"h":"c8a498f75d"},{"n":10,"t":"fill","q":"Unlike hard workouts, Zone 2 doesn't leave you [A] or worn out, so you can exercise again the [B] day.","ko":"격렬한 운동과 달리, Zone 2 운동은 당신을 [A] 상태나 지친 상태로 만들지 않아서 [B] 날에도 다시 운동할 수 있다.","bko":{"sore":"욱신거리는","next":"다음의","intense":"격렬한","moderate":"중간의","maximum":"최대의","simple":"간단한"},"bank":["sore","next","intense","moderate","maximum","simple"],"r":{"a":"[A] sore (욱신거리는), [B] next (다음의)","ev":"13번 문장","s":[[13,"Unlike intense workouts, Zone 2 doesn’t leave you sore or worn out, so you can exercise again the next day.","격렬한 운동과 달리, Zone 2 운동은 당신의 몸을 욱신거리거나 지치게 만들지 않아서 다음 날에도 다시 운동할 수 있다."]],"w":"13번 Zone 2 doesn't leave you sore or worn out, so you can exercise again the next day에서 가져옴. intense·lasting·maximum·simple은 몸 상태(욱신거림, 지침)나 '날'을 꾸미는 말이 될 수 없음.","c":null},"h":"9b95e12551"}]},{"u":2,"id":"rg6-02-3","no":3,"ko":"미로와 래버린스는 어떻게 다를까?","items":[{"n":1,"t":"tf","q":"Labyrinths offer a path with no choices to make or dead ends to fear.","ko":"래버린스는 선택할 것도, 두려워할 막다른 길도 없는 길을 제시한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Unlike mazes, which are meant to confuse and challenge, labyrinths offer a path with no choices to make or dead ends to fear.","사람들을 혼란스럽게 하고 도전하게 만들려고 의도된 미로와 달리, 래버린스는 선택할 것도, 두려워할 막다른 길도 없는 길을 제시한다."]],"w":"2번 문장 labyrinths offer a path with no choices to make or dead ends to fear와 일치. 미로(mazes)와 다른 점.","c":"T"},"h":"f8faa4093f"},{"n":2,"t":"tf","q":"In prehistoric times, labyrinths were used as places for travelers to rest.","ko":"선사 시대에 래버린스는 여행자들이 쉬는 장소로 사용되었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"In prehistoric times, they were used as traps for harmful spirits.","선사 시대에는, 그것들은 해로운 영혼을 가두는 덫으로 사용되었다."]],"w":"7번 문장에서 선사 시대에는 해로운 영혼을 가두는 덫(traps for harmful spirits)으로 사용되었다고 함. 쉬는 장소라는 말은 본문에 없음.","c":"F"},"h":"5686a6f24c"},{"n":3,"t":"tf","q":"Today, labyrinths have gained even more religious purpose than before.","ko":"오늘날 래버린스는 이전보다 훨씬 더 많은 종교적 목적을 갖게 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Today, labyrinths have lost much of their religious purpose and are mainly used to comfort the mind and soul.","오늘날, 래버린스는 종교적 목적을 대부분 잃었으며 주로 마음과 영혼을 안정시키는 데 사용된다."]],"w":"9번 문장에서 오늘날 래버린스는 종교적 목적을 대부분 잃었고(have lost much of their religious purpose) 주로 마음과 영혼을 안정시키는 데 쓰인다고 함. 더 많아졌다는 말과 반대.","c":"F"},"h":"db8a3a0d15"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They encourage walkers to slow down, reflect, and find a sense of inner peace.)","ko":"그것들은 걷는 사람들이 속도를 늦추고, ( ), 내면의 평화를 느끼도록 격려한다.","opts":["달리다","잊어버리다","곰곰이 생각하다","말다툼하다"],"word":"reflect","r":{"a":"3) 곰곰이 생각하다","ev":"3번 문장","s":[[3,"They encourage walkers to slow down, reflect, and find a sense of inner peace.","그것들은 걷는 사람들이 속도를 늦추고, 성찰하며, 내면의 평화를 느끼도록 격려한다."]],"w":"3번은 걷는 사람이 속도를 늦추고(slow down) reflect한 뒤 내면의 평화를 찾는다는 흐름. 차분히 자신을 돌아보는 reflect = 곰곰이 생각하다. 달리다는 slow down과 반대.","c":3},"h":"c061f0a378"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... labyrinths carry timeless wisdom that transcends time and culture.)","ko":"... 래버린스가 시대와 문화를 ( ) 변치 않는 지혜를 지니고 있다 ...","opts":["따르다","초월하다","잃다","막다"],"word":"transcends","r":{"a":"2) 초월하다","ev":"12번 문장","s":[[12,"It goes without saying that labyrinths carry timeless wisdom that transcends time and culture.","래버린스가 시대와 문화를 초월하는 변치 않는 지혜를 지니고 있다는 것은 말할 것도 없다."]],"w":"12번은 시대와 문화가 달라져도 변치 않는(timeless) 지혜라는 내용이므로 시대와 문화를 뛰어넘는다는 뜻. transcend(원형) = 초월하다. 따르거나 잃거나 막는다는 말은 timeless와 어울리지 않음.","c":2},"h":"76ca1c73ba"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nLabyrinths are ancient designs that lead people along a single, winding path to the center and back again.","ko":"밑줄 친 that이 가리키는 것은?","sko":"래버린스는 사람들을 하나의 구불구불한 길을 따라 중심까지 갔다가 다시 돌아오게 하는 고대의 디자인이다.","opts":["고대의 디자인(래버린스)","사람들","하나의 구불구불한 길","중심"],"r":{"a":"1) 고대의 디자인(래버린스)","ev":"1번 문장","s":[[1,"Labyrinths are ancient designs that lead people along a single, winding path to the center and back again.","래버린스는 사람들을 하나의 구불구불한 길을 따라 중심까지 갔다가 다시 돌아오게 하는 고대의 디자인이다."]],"w":"6번 These labyrinths played important roles ~ 에서 말한 주제가 래버린스. 7번에서 그 래버린스가 덫으로 사용되었다는 말. 해로운 영혼은 덫에 가두는 대상이라 they가 아님.","c":1,"k":"that = 고대의 디자인(래버린스)"},"pron":"that","h":"113ae03349"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Many people find labyrinth walking a meaningful way to lower stress, enhance focus, and promote emotional well-being.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"많은 사람들이 래버린스 걷기가 스트레스를 낮추고, 집중력을 높이고, 정서적 안녕을 증진하는 의미 있는 방법이라고 생각한다.","opts":["많은 사람들은 래버린스 걷기가 스트레스를 줄이고 집중력과 정서적 안녕을 높여 주는 의미 있는 방법이라고 생각한다.","많은 사람들은 래버린스 걷기가 스트레스를 높이고 집중력을 떨어뜨린다고 생각한다.","많은 사람들은 래버린스 걷기가 감정을 느끼지 못하게 하는 방법이라고 생각한다.","많은 사람들은 래버린스 걷기가 소수의 전문가만 할 수 있는 어려운 운동이라고 생각한다."],"r":{"a":"1) 많은 사람들은 래버린스 걷기가 스트레스를 줄이고 집중력과 정서적 안녕을 높여 주는 의미 있는 방법이라고 생각한다.","ev":"11번 문장","s":[[11,"Many people find labyrinth walking a meaningful way to lower stress, enhance focus, and promote emotional well-being.","많은 사람들이 래버린스 걷기가 스트레스를 낮추고, 집중력을 높이고, 정서적 안녕을 증진하는 의미 있는 방법이라고 생각한다."]],"w":"It goes without saying that ~은 ~은 말할 것도 없다(당연하다)는 뜻. timeless wisdom that transcends time and culture는 시대와 문화를 뛰어넘는 변치 않는 지혜. '바뀐다'는 timeless와 반대이고, 말하지 말라는 뜻도 아님.","c":1},"h":"433cf9adda"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["래버린스와 미로는 둘 다 사람들을 혼란스럽게 하려고 만들어졌다.","래버린스는 불과 수백 년 전에 처음 만들어졌다.","래버린스는 병원이나 학교의 바닥 무늬로도 볼 수 있다.","래버린스는 공원의 큰 돌길로만 존재한다."],"opts":["Labyrinths and mazes are both designed to confuse people.","Labyrinths were first created only a few hundred years ago.","Labyrinths can be found as floor patterns in hospitals or schools.","Labyrinths exist only as large stone paths in parks."],"r":{"a":"3) Labyrinths can be found as floor patterns in hospitals or schools. (래버린스는 병원이나 학교의 바닥 무늬로도 볼 수 있다.)","ev":"10번 문장","s":[[10,"They appear as stone paths in parks, floor patterns in hospitals or schools, and even small, portable “finger labyrinths” for tracing by hand.","그것들은 공원의 돌길, 병원이나 학교의 바닥 무늬, 그리고 손으로 따라가 볼 수 있는 작고 휴대 가능한 '손가락 래버린스'로도 나타난다."]],"w":"9번 문장에서 오늘날 래버린스는 주로 마음과 영혼을 안정시키는 데 사용된다고 함. ①은 2번에서 미로만 혼란을 의도한다고 해서 반대. ②는 4번에서 수천 년(thousands of years)이라 반대. ④는 10번에서 병원·학교 바닥 무늬, 손가락 래버린스로도 존재한다고 해서 반대.","c":3},"h":"e31faa5d73"},{"n":9,"t":"sum","q":"For thousands of years, labyrinths have been a part of human (A). These labyrinths played important (B) in spiritual and religious rituals.","ko":"수천 년 동안 래버린스는 인류 (A)의 일부였다. 이러한 래버린스는 영적이고 종교적인 의식에서 중요한 (B)을(를) 했다.","oko":["(A) 역사 / (B) 역할","(A) 미래 / (B) 역할","(A) 역사 / (B) 문제","(A) 미래 / (B) 문제","(A) 본성 / (B) 문제"],"opts":["(A) history / (B) roles","(A) future / (B) roles","(A) history / (B) problems","(A) future / (B) problems","(A) nature / (B) problems"],"r":{"a":"1) (A) history / (B) roles ((A) 역사 / (B) 역할)","ev":"4번, 6번 문장","s":[[4,"For thousands of years, labyrinths have been a part of human history.","수천 년 동안 래버린스는 인류 역사의 일부였다."],[6,"These labyrinths played important roles in spiritual and religious rituals.","이러한 래버린스는 영적이고 종교적인 의식에서 중요한 역할을 했다."]],"w":"2번에서 래버린스는 no choices to make(선택할 것이 없는) 길을 제시하고, 9번에서 오늘날은 주로 마음과 영혼을 comfort(안정시키는) 데 쓰인다고 함. confuse는 미로(mazes)의 목적이고, trap은 선사 시대의 쓰임임.","c":1},"h":"8f96b21595"},{"n":10,"t":"fill","q":"In prehistoric times, labyrinths were used as [A] for harmful spirits, and in the medieval period they served as symbolic [B].","ko":"선사 시대에 래버린스는 해로운 영혼을 위한 [A](으)로 사용되었고, 중세 시대에는 상징적인 [B]의 역할을 했다.","bko":{"traps":"덫","journeys":"여정","stress":"스트레스","focus":"집중력","benefits":"이점","walkers":"걷는 사람들"},"bank":["traps","journeys","stress","focus","benefits","walkers"],"r":{"a":"[A] traps (덫), [B] journeys (여정)","ev":"7~8번 문장","s":[[7,"In prehistoric times, they were used as traps for harmful spirits.","선사 시대에는, 그것들은 해로운 영혼을 가두는 덫으로 사용되었다."],[8,"During the medieval period, they served as symbolic journeys for those who couldn’t travel on long pilgrimages.","중세 시대에는, 그것들은 긴 순례를 떠날 수 없는 사람들을 위한 상징적인 여정의 역할을 했다."]],"w":"7번 used as traps for harmful spirits, 8번 served as symbolic journeys에서 가져옴. stress·focus·benefits는 11번에서 걷기의 효과로 나오는 말이고, walkers는 3번에서 래버린스를 걷는 사람을 가리키는 말이라 이 자리에 맞지 않음.","c":null},"h":"683abeae5d"}]},{"u":3,"id":"rg6-03-1","no":1,"ko":"시끄러운 매미가 프로방스의 상징이 된 이유는?","items":[{"n":1,"t":"tf","q":"In Provence, cicadas are cherished symbols of the region's sunny and relaxed spirit.","ko":"프로방스에서 매미는 그 지역의 햇살 가득하고 여유로운 기운을 나타내는 소중한 상징이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They’re cherished symbols of the region’s sunny and relaxed spirit.","그들은 그 지역의 햇살 가득하고 여유로운 기운을 나타내는 소중한 상징이다."]],"w":"2번 문장 They're cherished symbols of the region's sunny and relaxed spirit와 일치. 본문과 같은 내용.","c":"T"},"h":"714d8cab9e"},{"n":2,"t":"tf","q":"A popular fable made every artist in Provence see the cicada as a lazy creature.","ko":"인기 있는 우화 때문에 프로방스의 모든 예술가가 매미를 게으른 존재로 보게 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Even when a fable describing the cicada as a lazy creature gained popularity across France, they saw things differently.","매미를 게으른 존재로 묘사하는 우화가 프랑스 전역에서 인기를 얻었을 때조차, 그들은 다르게 보았다."]],"w":"6번 문장에서 매미를 게으르다고 묘사한 우화가 프랑스 전역에서 인기를 얻었을 때조차 프로방스의 예술가들은 they saw things differently(다르게 보았다)고 함. 모든 예술가가 그렇게 봤다는 말은 반대.","c":"F"},"h":"28cd40ff37"},{"n":3,"t":"tf","q":"Today, cicadas are rarely seen in Provence.","ko":"오늘날 프로방스에서는 매미를 거의 볼 수 없다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Today, cicadas appear everywhere in Provence, reminding people to embrace life’s simple pleasures and to keep the light-filled spirit of summer alive all year long.","오늘날, 매미는 프로방스 어디에서나 볼 수 있으며, 사람들에게 삶의 소소한 즐거움을 받아들이고 햇살 가득한 여름의 기운을 일 년 내내 간직하라고 상기시킨다."]],"w":"11번 문장에서 오늘날 매미는 프로방스 everywhere(어디에서나) 나타난다고 함. 거의 볼 수 없다는 말은 반대.","c":"F"},"h":"bd302c9260"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... locals and visitors are invited to join the cicadas' carefree way of life.)","ko":"... 지역 주민들과 방문객들은 매미의 ( ) 삶의 방식에 동참하도록 초대된다.","opts":["바쁜","엄격한","외로운","근심 없는"],"word":"carefree","r":{"a":"4) 근심 없는","ev":"3~4번 문장","s":[[3,"Each summer, as their chorus fills the warm air, locals and visitors are invited to join the cicadas’ carefree way of life.","매년 여름, 그들의 합창이 따뜻한 공기를 가득 채울 때, 지역 주민들과 방문객들은 매미의 근심 없는 삶의 방식에 동참하도록 초대된다."],[4,"They slow down, and enjoy the moment; just as cicadas spend their days bathing in the sun and singing their joyful song.","그들은 속도를 늦추고 그 순간을 즐기는데, 마치 매미가 햇볕을 쬐고 즐거운 노래를 부르며 하루를 보내는 것과 같다."]],"w":"4번에서 사람들은 속도를 늦추고 순간을 즐기며, 햇볕을 쬐고 노래하는 매미처럼 지낸다고 함. 그래서 carefree = 근심 없는. 바쁜·엄격한은 이 흐름과 반대.","c":4},"h":"2366a1aa3c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Poet Frederic Mistral further strengthened this regional identity ...)","ko":"시인 Frederic Mistral은 유명한 문구로 이 지역의 정체성을 더욱 ( ).","opts":["약화시켰다","강화했다","바꿨다","숨겼다"],"word":"strengthened","r":{"a":"2) 강화했다","ev":"10번 문장","s":[[10,"Poet Frederic Mistral further strengthened this regional identity with his well-known phrase, “the sun makes me sing.”","시인 프레데리크 미스트랄은 '태양이 나를 노래하게 한다'라는 유명한 문구로 이 지역의 정체성을 더욱 강화했다."]],"w":"10번에서 Mistral의 유명한 문구가 프로방스의 정체성을 further(더욱) ~했다는 흐름. 매미를 예찬하며 지역 이미지를 키워 온 이야기이므로 strengthen(원형) = 강화하다. 약화시켰다는 반대.","c":2},"h":"b92e3a4c0a"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nInspired by this, artists in Provence began featuring cicadas in their creations, from pottery and souvenirs to paintings and sculptures.","ko":"밑줄 친 their가 가리키는 것은?","sko":"이로부터 영감을 받아, 프로방스의 예술가들은 도자기와 기념품부터 그림과 조각품에 이르기까지 자신들의 작품에 매미를 담기 시작했다.","opts":["프로방스의 예술가들","매미들","지역 주민들","방문객들"],"r":{"a":"1) 프로방스의 예술가들","ev":"9번 문장","s":[[9,"Inspired by this, artists in Provence began featuring cicadas in their creations, from pottery and souvenirs to paintings and sculptures.","이로부터 영감을 받아, 프로방스의 예술가들은 도자기와 기념품부터 그림과 조각품에 이르기까지 자신들의 작품에 매미를 담기 시작했다."]],"w":"5번에서 매미를 예찬해 온 사람들은 artists and poets in Provence. 6번의 they는 이들이고, 게으르다는 우화와 달리 다르게 보았다는 내용. 프랑스의 일반 사람들은 우화에 인기를 준 쪽.","c":1,"k":"their = 프로방스의 예술가들"},"pron":"their","h":"244a1a58a4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They saw in these insects a reflection of their own love for music, sunshine, and the art of relaxation.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 이 곤충에서 음악, 햇빛, 그리고 휴식의 기술에 대한 자신들의 사랑이 반영된 모습을 보았다.","opts":["그들은 매미에게서 음악, 햇빛, 여유를 즐기는 자신들의 사랑이 그대로 비친 모습을 보았다.","그들은 매미가 음악과 햇빛을 싫어하는 곤충이라고 생각했다.","그들은 매미 때문에 음악과 휴식에 대한 사랑을 잃었다.","그들은 매미를 자신들과 전혀 닮지 않은 존재로 보았다."],"r":{"a":"1) 그들은 매미에게서 음악, 햇빛, 여유를 즐기는 자신들의 사랑이 그대로 비친 모습을 보았다.","ev":"8번 문장","s":[[8,"They saw in these insects a reflection of their own love for music, sunshine, and the art of relaxation.","그들은 이 곤충에서 음악, 햇빛, 그리고 휴식의 기술에 대한 자신들의 사랑이 반영된 모습을 보았다."]],"w":"appear everywhere in Provence는 프로방스 어디에나 나타난다는 뜻이고, reminding people to ~는 사람들에게 ~하라고 상기시킨다는 뜻. 사라졌다거나 바쁘게 일하라는 말은 없음.","c":1},"h":"4aaf38f593"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["프로방스 사람들은 매미가 피해야 할 게으른 존재라고 믿었다.","프로방스에서 매미는 단순히 시끄러운 곤충 이상의 존재로 여겨진다.","프레데리크 미스트랄은 달이 자신을 노래하게 한다고 썼다.","오늘날 프로방스에서 매미는 박물관에서만 볼 수 있다."],"opts":["People in Provence believed that cicadas were lazy creatures to be avoided.","In Provence, cicadas are seen as more than just noisy insects.","Frederic Mistral wrote that the moon makes him sing.","Cicadas in Provence are seen only in museums today."],"r":{"a":"2) In Provence, cicadas are seen as more than just noisy insects. (프로방스에서 매미는 단순히 시끄러운 곤충 이상의 존재로 여겨진다.)","ev":"1번 문장","s":[[1,"In Provence, France, cicadas are more than just noisy insects.","프랑스 프로방스에서 매미는 그저 시끄러운 곤충 이상의 존재이다."]],"w":"9번 문장에서 예술가들이 도자기와 기념품부터 그림과 조각품까지 작품에 매미를 담기 시작했다고 함. ①은 6번에서 우화에도 불구하고 예술가들은 다르게 봤다고 해서 반대. ③은 10번에서 the sun(태양)이라 반대. ④는 11번에서 어디에서나 나타난다고 해서 반대.","c":2},"h":"a0d5603e29"},{"n":9,"t":"sum","q":"For centuries, artists and poets in Provence have (A) cicadas. To them, the cicada was a symbol of (B) the present moment.","ko":"수 세기 동안, 프로방스의 예술가들과 시인들은 매미를 (A) 왔다. 그들에게 매미는 현재의 순간을 (B) 것의 상징이었다.","oko":["(A) 예찬해 / (B) 음미하는","(A) 무시해 / (B) 음미하는","(A) 예찬해 / (B) 잊는","(A) 무시해 / (B) 잊는","(A) 두려워해 / (B) 서두르는"],"opts":["(A) praised / (B) appreciating","(A) ignored / (B) appreciating","(A) praised / (B) forgetting","(A) ignored / (B) forgetting","(A) feared / (B) hurrying"],"r":{"a":"1) (A) praised / (B) appreciating ((A) 예찬해 / (B) 음미하는)","ev":"5번, 7번 문장","s":[[5,"For centuries, artists and poets in Provence have praised cicadas.","수 세기 동안, 프로방스의 예술가들과 시인들은 매미를 예찬해 왔다."],[7,"The cicada was a symbol of appreciating the present moment.","매미는 현재의 순간을 음미하는 것의 상징이었다."]],"w":"7번에서 매미는 appreciating the present moment(현재의 순간을 음미하는 것)의 상징이었고, 9번에서 예술가들이 작품에 매미를 feature(담다)하기 시작했다고 함. 비판하거나 피하거나 없앤다는 말은 본문과 반대.","c":1},"h":"159c01a9dd"},{"n":10,"t":"fill","q":"Today, cicadas appear [A] in Provence, reminding people to [B] life's simple pleasures.","ko":"오늘날 매미는 프로방스 [A] 볼 수 있으며, 사람들에게 \"삶의 소소한 즐거움을 [B]\"라고 상기시킨다.","bko":{"everywhere":"어디에서나","embrace":"받아들이다","pottery":"도자기","sculpture":"조각품","souvenir":"기념품","painting":"그림"},"bank":["everywhere","embrace","pottery","sculpture","souvenir","painting"],"r":{"a":"[A] everywhere (어디에서나), [B] embrace (받아들이다)","ev":"11번 문장","s":[[11,"Today, cicadas appear everywhere in Provence, reminding people to embrace life’s simple pleasures and to keep the light-filled spirit of summer alive all year long.","오늘날, 매미는 프로방스 어디에서나 볼 수 있으며, 사람들에게 삶의 소소한 즐거움을 받아들이고 햇살 가득한 여름의 기운을 일 년 내내 간직하라고 상기시킨다."]],"w":"11번 cicadas appear everywhere in Provence, reminding people to embrace life's simple pleasures에서 가져옴. pottery·sculpture·souvenir·painting은 9번에서 작품의 종류로 나온 명사라 '어디에서'나 '즐거움을 ~하라'는 동사 자리에 올 수 없음.","c":null},"h":"2121f1d65a"}]},{"u":3,"id":"rg6-03-2","no":2,"ko":"웨이터들이 쟁반을 들고 달리면 안 되는 경주?","items":[{"n":1,"t":"tf","q":"More than 200 waiters and waitresses gathered near Paris City Hall for the Waiters' Race.","ko":"200명이 넘는 웨이터와 웨이트리스들이 웨이터 경주를 위해 파리 시청 근처에 모였다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"On March 24, 2024, more than 200 waiters and waitresses gathered near Paris City Hall for the Waiters’ Race, Course des Cafés.","2024년 3월 24일, 200명이 넘는 웨이터와 웨이트리스들이 웨이터 경주인 Course des Cafés를 위해 파리 시청 근처에 모였다."]],"w":"1번 문장에서 more than 200 waiters and waitresses가 파리 시청 근처에서 웨이터 경주를 위해 모였다고 함. 본문과 일치.","c":"T"},"h":"6b69121249"},{"n":2,"t":"tf","q":"Participants were allowed to run to finish faster.","ko":"참가자들은 더 빨리 끝내기 위해 뛰는 것이 허용되었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Participants raced through a 2-kilometer course with one goal: to cross the finish line as quickly as possible without running.","참가자들은 하나의 목표를 가지고 2킬로미터의 코스를 경주했는데, 그것은 뛰지 않으면서 가능한 한 빨리 결승선을 통과하는 것이었다."]],"w":"4번 문장에서 가능한 한 빨리 결승선을 통과하되 without running(뛰지 않고)이라고 함. 뛰는 것이 허용된다는 말은 반대.","c":"F"},"h":"ac471ec24c"},{"n":3,"t":"tf","q":"Each of the winners received two tickets to the Paris Olympic opening ceremony.","ko":"각 우승자는 파리 올림픽 개막식 티켓 두 장을 받았다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Each of the winners received a medal, two tickets to the Paris Olympic opening ceremony, and a one-night stay at a luxurious Paris hotel.","각 우승자는 메달, 파리 올림픽 개막식 티켓 두 장, 그리고 호화로운 파리 호텔에서의 하루 숙박권을 받았다."]],"w":"7번 문장에서 우승자들은 메달, 파리 올림픽 개막식 티켓 두 장, 호화로운 호텔 1박을 받았다고 함. 본문과 일치.","c":"T"},"h":"fb71748c7f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This exciting race celebrates the elegance and skill of French service.)","ko":"이 흥미진진한 경주는 프랑스식 서비스의 ( )과 기술을 기념한다.","opts":["불편","가격","우아함","소음"],"word":"elegance","r":{"a":"3) 우아함","ev":"2~3번 문장","s":[[2,"This exciting race celebrates the elegance and skill of French service.","이 흥미진진한 경주는 프랑스식 서비스의 우아함과 기술을 기념한다."],[3,"Each participant carried a tray with a croissant, a glass of water, and an empty coffee cup, walking with quick yet graceful steps.","각 참가자는 크루아상 한 개, 물 한 잔, 그리고 빈 커피잔이 놓인 쟁반을 들고, 빠르면서도 우아한 걸음으로 걸었다."]],"w":"3번에서 참가자들이 quick yet graceful steps(빠르면서도 우아한 걸음)로 걷는다고 함. 경주는 이런 세련된 서비스를 기념하는 것이므로 elegance = 우아함. 불편·가격·소음은 skill 옆에서 어색함.","c":3},"h":"bea53bc1f5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The race not only celebrates their skill and dedication ...)","ko":"이 경주는 그들의 실력과 ( 능한 한 빨리, without running은 뛰지 않고. 따라서 뛰지 않으면서 최대한 빨리 걷는 경주. 달린다는 말은 without running과 반대.","c":1},"h":"e7cbb85bb6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["경주는 6월에 에펠탑 근처에서 열렸다.","참가자들은 오직 속도로만 평가받았다.","각 우승자는 메달만 받았다.","웨이터들은 크루아상, 물 한 잔, 빈 커피잔이 놓인 쟁반을 들었다."],"opts":["The race was held in June near the Eiffel Tower.","Participants were judged only on their speed.","Each winner received only a medal.","Waiters carried trays with a croissant, a glass of water, and an empty coffee cup."],"r":{"a":"4) Waiters carried trays with a croissant, a glass of water, and an empty coffee cup.","ev":"1번, 3번, 5번, 7번 문장","s":[[1,"On March 24, 2024, more than 200 waiters and waitresses gathered near Paris City Hall for the Waiters’ Race, Course des Cafés.","2024년 3월 24일, 200명이 넘는 웨이터와 웨이트리스들이 웨이터 경주인 Course des Cafés를 위해 파리 시청 근처에 모였다."],[3,"Each participant carried a tray with a croissant, a glass of water, and an empty coffee cup, walking with quick yet graceful steps.","각 참가자는 크루아상 한 개, 물 한 잔, 그리고 빈 커피잔이 놓인 쟁반을 들고, 빠르면서도 우아한 걸음으로 걸었다."],[5,"They were judged on their speed, how much liquid they spilled, and whether they managed to keep their dishes unbroken.","그들은 속도, 얼마나 많은 액체를 쏟았는지, 그리고 접시가 깨지지 않도록 유지했는지에 따라 평가받았다."],[7,"Each of the winners received a medal, two tickets to the Paris Olympic opening ceremony, and a one-night stay at a luxurious Paris hotel.","각 우승자는 메달, 파리 올림픽 개막식 티켓 두 장, 그리고 호화로운 파리 호텔에서의 하루 숙박권을 받았다."]],"w":"3번 문장에서 각 참가자가 크루아상, 물 한 잔, 빈 커피잔이 놓인 쟁반을 들었다고 함. ①은 1번에서 3월 24일 파리 시청 근처라 반대. ②는 5번에서 속도 외에 쏟은 액체와 접시도 평가한다고 해서 반대. ③은 7번에서 메달 외에 티켓과 숙박권도 받는다고 해서 반대.","c":4},"h":"53f67bb5c6"},{"n":9,"t":"sum","q":"The Waiters' Race honors the (A)-year history of Parisian cafés and restaurants and celebrates the proud (B) of Parisian dining culture.","ko":"웨이터 경주는 파리 카페와 레스토랑의 (A)년 역사를 기리고 파리 식문화의 자랑스러운 (B)을 기념한다.","oko":["(A) 30 / (B) 유산","(A) 300 / (B) 속도","(A) 100 / (B) 메달","(A) 3,000 / (B) 유산","(A) 300 / (B) 유산"],"opts":["( aste, and decaying bodies.","ko":"타이탄 아룸은 썩은 생선, 쓰레기, 그리고 부패한 시체를 섞어 놓은 듯한 냄새를 내뿜는다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Titan arum, known as the corpse flower, releases a smell that resembles a mix of rotten fish, waste, and decaying bodies.","시체꽃으로 알려진 타이탄 아룸(Titan arum)은 썩은 생선과 쓰레기, 그리고 부패한 시체를 섞어 놓은 듯한 냄새를 내뿜는다."]],"w":"1번 문장 releases a smell that resembles a mix of rotten fish, waste, and decaying bodies와 일치. resemble(닮다) = is like.","c":"T"},"h":"42dd0bed5d"},{"n":2,"t":"tf","q":"Benign masochism means enjoying discomfort in a dangerous and uncontrolled situation.","ko":"온건한 마조히즘은 위험하고 통제되지 않는 상황에서 불편함을 즐기는 것을 뜻한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"People enjoy discomfort when it occurs in a safe and controlled situation — a phenomenon known as “benign masochism.”","사람들은 안전하고 통제된 상황에서 불편함이 일어날 때 그것을 즐기는데, 이는 '온건한 마조히즘(benign masochism)'으로 알려진 현상이다."]],"w":"6번 문장에서 benign masochism은 안전하고 통제된(safe and controlled) 상황에서 불편함을 즐기는 현상이라고 함. 위험하고 통제되지 않은 상황이라는 말은 반대.","c":"F"},"h":"5603f6d175"},{"n":3,"t":"tf","q":"According to the passage, unpleasant smells can never cause positive emotions.","ko":"본문에 따르면 불쾌한 냄새는 결코 긍정적인 감정을 일으킬 수 없다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Even an unpleasant odor, when tied to a pleasant memory, can trigger positive emotions.","불쾌한 냄새조차도 기분 좋은 기억과 연결되면 긍정적인 감정을 일으킬 수 있다."]],"w":"11번 문장에서 불쾌한 냄새라도 기분 좋은 기억과 연결되면 긍정적인 감정을 trigger(일으킬) 수 있다고 함. 결코 못 한다는 말은 반대.","c":"F"},"h":"5197c47148"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... a smell that resembles a mix of rotten fish, waste, and decaying bodies.)","ko":"... 썩은 생선, 쓰레기, 부패한 시체를 섞어 놓은 것과 ( ) 냄새.","opts":["피하다","닮다","바꾸다","숨기다"],"word":"resembles","r":{"a":"2) 닮다","ev":"1번 문장","s":[[1,"Titan arum, known as the corpse flower, releases a smell that resembles a mix of rotten fish, waste, and decaying bodies.","시체꽃으로 알려진 타이탄 아룸(Titan arum)은 썩은 생선과 쓰레기, 그리고 부패한 시체를 섞어 놓은 듯한 냄새를 내뿜는다."]],"w":"1번은 시체꽃의 냄새가 어떤 냄새인지 비유로 설명하는 문장. a smell that resembles a mix of ~는 ~을 섞어 놓은 것을 닮은 냄새. resemble(원형) = 닮다.","c":2},"h":"38e5898a73"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Such a tendency is clear when we see people enjoying watching horror movies ...)","ko":"이러한 ( )은 사람들이 공포 영화를 보는 것을 즐기는 모습에서 분명히 드러난다.","opts":["실수","기술","규칙","경향"],"word":"tendency","r":{"a":"4) 경향","ev":"6~7번 문장","s":[[6,"People enjoy discomfort when it occurs in a safe and controlled situation — a phenomenon known as “benign masochism.”","사람들은 안전하고 통제된 상황에서 불편함이 일어날 때 그것을 즐기는데, 이는 '온건한 마조히즘(benign masochism)'으로 알려진 현상이다."],[7,"Such a tendency is clear when we see people enjoying watching horror movies or eating spicy food, despite the physical or emotional discomfort involved.","이러한 경향은 사람들이 신체적 또는 감정적 불편함이 따름에도 공포 영화를 보거나 매운 음식을 먹는 것을 즐기는 모습에서 분명히 드러난다."]],"w":"6번에서 사람들은 안전한 상황이면 불편함을 즐긴다고 했고, 7번은 Such a tendency(이러한 ~)로 그 예를 들어 줌. 그렇게 자주 보이는 성향이므로 tendency = 경향. 실수·기술·규칙은 6번 내용과 맞지 않음.","c":4},"h":"e2d9e25c20"},{"n":6,"t":"ref","q":"What does the underlined \"that contrast\" refer to?\nRiding a roller coaster is another example: your mind knows you're safe, but your body reacts as if you're in danger — and that contrast creates a sense of excitement.","ko":"밑줄 친 that contrast이 가리키는 것은?","sko":"롤러코스터를 타는 것도 또 다른 예이다. 당신의 머리는 당신이 안전하다는 것을 알지만, 몸은 마치 위험에 처한 것처럼 반응하며, 그 대조가 짜릿함을 만들어 낸다.","opts":["롤러코스터의 속도와 높이의 차이","공포 영화와 매운 음식의 차이","안전하다고 아는 머리와 위험한 것처럼 반응하는 몸의 차이","불쾌한 냄새와 좋은 냄새의 차이"],"r":{"a":"3) 안전하다고 아는 머리와 위험한 것처럼 반응하는 몸의 차이","ev":"8번 문장","s":[[8,"Riding a roller coaster is another example: your mind knows you’re safe, but your body reacts as if you’re in danger — and that contrast creates a sense of excitement.","롤러코스터를 타는 것도 또 다른 예이다. 당신의 머리는 당신이 안전하다는 것을 알지만, 몸은 마치 위험에 처한 것처럼 반응하며, 그 대조가 짜릿함을 만들어 낸다."]],"w":"8번 문장 안에서 but 앞뒤가 대조: 머리는 안전하다는 것을 알지만(your mind knows you're safe), 몸은 위험한 것처럼 반응(your body reacts as if you're in danger). 그 대조(that contrast)가 짜릿함을 만든다는 뜻.","c":3},"h":"6a00344d89"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For instance, the scent of an old basement might evoke memories of exploring their grandparents’ attic, while the smell of livestock odors might bring back memories of childhood visits to the countryside.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"예를 들어, 오래된 지하실의 냄새는 조부모님의 다락방을 탐험했던 기억을 떠올리게 할 수 있고, 가축의 냄새는 어린 시절 시골을 방문했던 추억을 되살릴 수도 있다.","opts":["오래된 지하실의 냄새는 조부모님 다락방을 탐험했던 기억을, 가축의 냄새는 어린 시절 시골에 갔던 기억을 떠올리게 할 수 있다.","오래된 지하실의 냄새는 항상 무서운 기억만을 떠올리게 하고, 가축의 냄새는 아무 기억도 떠올리게 하지 않는다.","조부모님의 다락방에서는 가축의 냄새가 나서 시골에 가고 싶어진다.","지하실과 시골의 냄새는 맡을수록 어린 시절의 기억을 잊게 만든다."],"r":{"a":"1) 오래된 지하실의 냄새는 조부모님 다락방을 탐험했던 기억을, 가축의 냄새는 어린 시절 시골에 갔던 기억을 떠올리게 할 수 있다.","ev":"12번 문장","s":[[12,"For instance, the scent of an old basement might evoke memories of exploring their grandparents’ attic, while the smell of livestock odors might bring back memories of childhood visits to the countryside.","예를 들어, 오래된 지하실의 냄새는 조부모님의 다락방을 탐험했던 기억을 떠올리게 할 수 있고, 가축의 냄새는 어린 시절 시골을 방문했던 추억을 되살릴 수도 있다."]],"w":"Even an unpleasant odor(불쾌한 냄새조차도) + when tied to a pleasant memory(기분 좋은 기억과 연결되면) + can trigger positive emotions(긍정적인 감정을 일으킬 수 있다). can은 가능성이라 '항상'이나 '결코'가 아님.","c":1},"h":"6bccfbb332"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["타이탄 아룸은 사람들이 피하려는 달콤한 냄새를 풍긴다.","롤러코스터를 타는 것은 머리와 몸이 모두 위험하다고 믿기 때문에 짜릿하다.","냄새는 기억과 밀접하게 연결되어 있으며 강한 감정적 반응을 불러일으킬 수 있다.","공포 영화와 매운 음식은 불편함이 전혀 없을 때에만 즐길 수 있다."],"opts":["Titan arum gives off a sweet smell that people try to avoid.","Riding a roller coaster is exciting because both mind and body believe they are in danger.","Smell is closely tied to memory and can bring up strong emotional responses.","Horror movies and spicy food are enjoyed only when there is no discomfort."],"r":{"a":"3) Smell is closely tied to memory and can bring up strong emotional responses. (냄새는 기억과 밀접하게 연결되어 있으며 강한 감정적 반응을 불러일으킬 수 있다.)","ev":"10번 문장","s":[[10,"Smell is closely tied to memory and can bring up strong emotional responses.","냄새는 기억과 밀접하게 연결되어 있으며 강한 감정적 반응을 불러일으킬 수 있다."]],"w":"10번 문장에서 냄새는 기억과 밀접하게 연결되어 강한 감정적 반응을 불러일으킬 수 있다고 함. ①은 1번에서 썩은 냄새라 반대. ②는 8번에서 머리는 안전하다는 것을 안다고 해서 반대. ④는 12번에서 가축 냄새가 어린 시절 시골 방문의 추억을 되살릴 수 있다고 해서 반대.","c":3},"h":"a521f05cde"},{"n":9,"t":"sum","q":"Although the odor is (A) unpleasant, many people visit the flower to (B) the smell for themselves.","ko":"그 악취는 (A) 불쾌하지만, 많은 사람들이 그 냄새를 직접 (B) 위해 그 꽃을 찾아간다.","oko":["(A) 유명하게 / (B) 경험하기","(A) 드물게 / (B) 경험하기","(A) 유명하게 / (B) 잊기","(A) 드물게 / (B) 잊기","(A) 결코 / (B) 무시하기"],"opts":["(A) famously / (B) experience","(A) rarely / (B) experience","(A) famously / (B) forget","(A) rarely / (B) forget","(A) never / (B) ignore"],"r":{"a":"1) (A) famously / (B) experience ((A) 유명하게 / (B) 경험하기)","ev":"2번 문장","s":[[2,"Although the odor is famously unpleasant, many people visit the flower to experience the smell for themselves.","그 악취는 불쾌하기로 유명하지만, 많은 사람들이 그 냄새를 직접 경험하기 위해 그 꽃을 찾아간다."]],"w":"6번에서 안전하고 통제된 상황에서는 discomfort(불편함)를 즐긴다고 하고, 11번에서 기분 좋은 기억과 연결되면 positive emotions(긍정적인 감정)를 일으킨다고 함. 따라서 (A) discomfort, (B) positive.","c":1},"h":"81d33682c2"},{"n":10,"t":"fill","q":"Likewise, many people intentionally [A] themselves to other bad smells, such as the damp scent of a basement or the [B] odor of a farm.","ko":"마찬가지로, 많은 사람들은 지하실의 축축한 냄새나 농장의 [B] 냄새 같은 다른 불쾌한 냄새에 일부러 자신을 [A].","bko":{"expose":"노출시키다","earthy":"흙내음이 나는","tendency":"경향","memory":"기억","psychology":"심리학","excitement":"짜릿함"},"bank":["expose","earthy","tendency","memory","psychology","excitement"],"r":{"a":"[A] expose (노출시키다), [B] earthy (흙내음이 나는)","ev":"3번 문장","s":[[3,"Likewise, many people intentionally expose themselves to other bad smells, such as the damp scent of a basement or the earthy odor of a farm.","마찬가지로, 많은 사람들은 지하실의 축축한 냄새나 농장의 흙내음 같은 다른 불쾌한 냄새에도 일부러 자신을 노출시킨다."]],"w":"1번 a smell that resembles a mix of ~, 2번 many people visit the flower to experience the smell for themselves에서 가져옴. tendency·memory·psychology·excitement는 명사라 that 뒤의 동사 자리나 to 뒤의 동사 자리에 올 수 없음.","c":null},"h":"16504d979d"}]},{"u":4,"id":"rg6-04-1","no":1,"ko":"나무들이 서로 거리를 두는 이유는?","items":[{"n":1,"t":"tf","q":"With gaps between the branches, sunlight can reach the lower branches and the forest floor.","ko":"가지 사이의 틈 덕분에 햇빛이 더 아래쪽 가지와 숲 바닥에 닿을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"With gaps formed between branches, sunlight can reach lower branches and the forest floor, thereby enhancing photosynthesis and promoting plant growth.","가지 사이에 틈이 생기면서, 햇빛이 더 아래쪽의 가지와 숲 바닥까지 닿을 수 있어, 그 결과 광합성이 향상되고 식물의 성장이 촉진된다."]],"w":"5번 문장에서 틈이 생기면 햇빛이 아래쪽 가지와 숲 바닥까지 닿는다고 함. 본문과 같은 내용.","c":"T"},"h":"d7ed7d1119"},{"n":2,"t":"tf","q":"Scientists have already proven that crown shyness is caused only by strong winds.","ko":"과학자들은 수관기피가 오직 강풍 때문에 생긴다는 것을 이미 증명했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Scientists are still studying whether crown shyness is driven by external forces, like branches colliding in strong winds, or by a survival strategy, such as ensuring fair distribution of resources and limiting the spread of disease.","과학자들은 수관기피가 강풍에 가지가 부딪치는 것과 같은 외부의 힘 때문인지, 아니면 자원의 공평한 분배와 질병 확산 억제 같은 생존 전략 때문인지를 아직 연구하고 있다."]],"w":"7번 문장에서 과학자들은 강풍 같은 외부의 힘 때문인지, 생존 전략 때문인지를 '아직 연구하고 있다'고 함. 이미 증명했다는 말은 틀림.","c":"F"},"h":"e113628e7e"},{"n":3,"t":"tf","q":"Crown shyness gives advantages to both individual trees and the whole forest.","ko":"수관기피는 각각의 나무와 숲 전체에 모두 이점을 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Crown shyness offers significant advantages to both individual trees and the forest as a whole.","수관기피는 각각의 나무들과 숲 전체에 상당한 이점들을 제공한다."]],"w":"4번 문장에서 individual trees와 the forest as a whole 둘 다에 이점이 있다고 함. 본문과 맞음.","c":"T"},"h":"f1a2bce8da"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… you might notice something extraordinary.)","ko":"… ( ) 것을 알아챌지도 모른다.","opts":["익숙한","특이한","불편한","사소한"],"word":"extraordinary","r":{"a":"2) 특이한","ev":"1번 문장","s":[[1,"Look up the next time you’re in a forest, and you might notice something extraordinary.","다음번에 숲에 있을 때 위를 올려다보면, 당신은 특이한 것을 발견할지도 모른다."]],"w":"1번 문장에서 숲에서 위를 올려다보면 something extraordinary를 발견할지도 모른다고 하고, 2번에서 퍼즐 같은 모양이 나옴. 평범하지 않은 '특이한' 것이므로 정답은 특이한.","c":2},"h":"993cb8a009"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… keeping the soil moist and creating habitats …)","ko":"… 토양을 ( ) 유지하고 서식지를 만들어준다.","opts":["메마른","얼어붙은","촉촉한","단단한"],"word":"moist","r":{"a":"3) 촉촉한","ev":"6번 문장","s":[[6,"In addition, these openings facilitate the flow of rainwater to the ground, keeping the soil moist and creating habitats for smaller plants and animals.","게다가, 이런 틈은 빗물이 땅으로 흐르는 것을 원활하게 하여, 토양을 촉촉하게 유지하고 더 작은 식물과 동물을 위한 서식지를 만들어준다."]],"w":"6번 문장에서 빗물이 땅으로 흘러 토양(soil)을 moist하게 유지한다고 함. 빗물이 스며드니 '촉촉한'. 메마른은 반대 뜻.","c":3},"h":"ee1bf027a6"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nIn some trees, the tops of their branches avoid contact, creating neat, puzzle-like patterns in the sky.","ko":"밑줄 친 their가 가리키는 것은?","sko":"어떤 나무들에서는 가지 끝부분이 서로 닿는 것을 피해서, 하늘에 정돈된 퍼즐 같은 모양을 만들어낸다.","opts":["어떤 나무들","하늘","퍼즐 조각들","숲 속 동물들"],"r":{"a":"1) 어떤 나무들","ev":"2번 문장","s":[[2,"In some trees, the tops of their branches avoid contact, creating neat, puzzle-like patterns in the sky.","어떤 나무들에서는 가지 끝부분이 서로 닿는 것을 피해서, 하늘에 정돈된 퍼즐 같은 모양을 만들어낸다."]],"w":"8번 문장의 this natural process(이 자연 과정)가 9번 It. 이 과정은 3번의 crown shyness. 생태계에 기여하는 것이 '증거'가 되는 주체는 수관기피.","c":1,"k":"their = 어떤 나무들"},"pron":"their","h":"bb1be77097"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Although the mysteries remain, this natural process undoubtedly contributes to a thriving ecosystem.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"미스터리는 여전히 남아 있지만, 이 자연 과정이 번영하는 생태계에 기여한다는 것은 확실하다.","opts":["아직 풀리지 않은 점이 있지만, 이 자연 현상이 숲 생태계가 잘 번성하는 데 도움이 되는 것은 분명하다.","미스터리가 모두 풀렸기 때문에 이 자연 현상은 생태계와 관련이 없다.","미스터리가 남아 있어서 이 자연 현상은 생태계에 해를 끼치는 것이 분명하다.","이 자연 현상은 번성하는 생태계 때문에만 생기는 것이 분명하다."],"r":{"a":"1) 아직 풀리지 않은 점이 있지만, 이 자연 현상이 숲 생태계가 잘 번성하는 데 도움이 되는 것은 분명하다.","ev":"8번 문장","s":[[8,"Although the mysteries remain, this natural process undoubtedly contributes to a thriving ecosystem.","미스터리는 여전히 남아 있지만, 이 자연 과정이 번영하는 생태계에 기여한다는 것은 확실하다."]],"w":"avoid contact는 '접촉을 피하다'. 가지 끝이 닿지 않아 틈이 생기고 그 틈이 퍼즐 같은 모양이 됨. 엉키거나 맞물리는 것은 반대.","c":1},"h":"95d4fd9a32"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["수관기피는 과학자들이 확인한 대로 주로 강풍 때문에 생긴다.","가지 사이의 틈은 햇빛이 숲 바닥에 닿는 것을 막는다.","가지 사이의 틈은 더 작은 식물과 동물에게 서식지를 제공한다.","수관기피는 작은 식물과 동물에게 해를 준다."],"opts":["Crown shyness is mainly caused by strong winds, as scientists have confirmed.","Gaps between branches stop sunlight from reaching the forest floor.","The gaps between branches provide habitats for smaller plants and animals.","Crown shyness harms smaller plants and animals."],"r":{"a":"3) The gaps between branches provide habitats for smaller plants and animals. (가지 사이의 틈은 더 작은 식물과 동물에게 서식지를 제공한다.)","ev":"6번 문장","s":[[6,"In addition, these openings facilitate the flow of rainwater to the ground, keeping the soil moist and creating habitats for smaller plants and animals.","게다가, 이런 틈은 빗물이 땅으로 흐르는 것을 원활하게 하여, 토양을 촉촉하게 유지하고 더 작은 식물과 동물을 위한 서식지를 만들어준다."]],"w":"6번 문장에서 틈이 빗물이 땅으로 흐르는 것을 원활하게 하고 토양을 촉촉하게 한다고 함. 나머지는 7번(아직 연구 중), 5번(햇빛이 닿음), 6번(서식지를 만들어 줌)과 반대.","c":3},"h":"a66941928a"},{"n":9,"t":"sum","q":"Scientists are still (A) whether crown shyness is driven by external (B), like branches colliding in strong winds, or by a survival strategy.","ko":"과학자들은 수관기피가 강풍에 가지가 부딪치는 것과 같은 외부의 (B) 때문인지, 아니면 생존 전략 때문인지를 아직 (A).","oko":["(A) 연구하고 있다 / (B) 힘","(A) 무시하고 있다 / (B) 힘","(A) 연구하고 있다 / (B) 색깔","(A) 증명하고 있다 / (B) 힘","(A) 무시하고 있다 / (B) 색깔"],"opts":["(A) studying / (B) forces","(A) ignoring / (B) forces","(A) studying / (B) colors","(A) proving / (B) forces","(A) ignoring / (B) colors"],"r":{"a":"1) (A) studying / (B) forces ((A) 연구하고 있다 / (B) 힘)","ev":"7번 문장","s":[[7,"Scientists are still studying wh
