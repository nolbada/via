gin of this popular design? Black and white balls comes out during the 1970 World Cup on Mexico.", "ko": "여러분은 이 인기 있는 디자인의 기원에 대해 들어 본 적 있나요? 검고 흰 축구공은 1970년 멕시코 월드컵 동안에 나왔습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "comes", "right": "came", "partial": false, "at": [14], "point": "일반동사의 과거형: 과거 이야기이므로 came 사용", "topic": "일반동사의 과거형", "memo": "과거 이야기이므로 came 사용"}, {"wrong": "on", "right": "in", "partial": false, "at": [21], "point": "기본전치사: '멕시코에서(나라 안)'는 in Mexico 사용", "topic": "기본전치사", "memo": "'멕시코에서(나라 안)'는 in Mexico 사용"}]}, {"n": 6, "tag": null, "en": "People could spotted them easily on their black and white TVs. Isn't that smart?", "ko": "사람들은 그들의 흑백 TV에서 그것들을 쉽게 발견할 수 있었어요. 그것은 똑똑하지 않나요?", "ok": false, "foot": [], "fixes": [{"wrong": "spotted", "right": "spot", "partial": false, "at": [2], "point": "조동사 뒤 동사원형: 조동사 could 뒤에는 동사원형: spot (spotted 아님)", "topic": "조동사 뒤 동사원형", "memo": "조동사 could 뒤에는 동사원형: spot (spotted 아님)"}]}, {"n": 7, "tag": null, "en": "Now we have color televisions, but we still kick the classic black and white soccer balls.", "ko": "이제 우리는 컬러텔레비전을 갖고 있지만, 우리는 여전히 이 고전적인 검고 흰 축구공을 찹니다.", "ok": true, "foot": [], "fixes": []}, {"n": 8, "tag": "유니폼 색깔", "en": "Players on each team wears uniforms with their own colors. Uniform colors have the power to unite the team under the same spirit.", "ko": "각 팀의 선수들은 자신들만의 색깔이 있는 유니폼을 입습니다. 유니폼 색깔은 팀을 같은 정신 아래 결속시키는 힘을 가졌습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "wears", "right": "wear", "partial": false, "at": [4], "point": "주어와 동사의 수일치: 주어 Players(복수)는 wear (wears 아님)", "topic": "주어와 동사의 수일치", "memo": "주어 Players(복수)는 wear (wears 아님)"}]}, {"n": 9, "tag": null, "en": "They are also usefully on the field. Players can spot each other and make quickly decisions thanks for their team's unique colors.", "ko": "그것들은 또한 경기장에서 유용합니다. 선수들은 그들의 팀의 고유한 색깔 덕분에 서로를 알아보고 빠른 결정을 내릴 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "usefully", "right": "useful", "partial": false, "at": [3], "point" E_EN="Colors in Soccer";var PASS_EN=["Colors in Soccer", "Soccer is a popular sport all over the world. It is also quite simple. You just need a ball, a small open space, and the desire to kick! Oh, don't forget one more thing. You need to understand the importance of colors!", "Black and White Soccer Balls", "Soccer balls today come in various colors, but black and white balls are quite common. Have you heard about the origin of this popular design? Black and white balls came out during the 1970 World Cup in Mexico. People could spot them easily on their black and white TVs. Isn't that smart? Now we have color televisions, but we still kick the classic black and white soccer balls.", "The Uniform Colors", "Players on each team wear uniforms with their own colors. Uniform colors have the power to unite the team under the same spirit. They are also useful on the field. Players can spot each other and make quick decisions thanks to their team's unique colors. On the field, referees wear uniforms with special colors because they need to stand out from the players. Among several colors, black has been their favorite. Black looks powerful, and it sends a strong \"Don't argue with me!\" message.", "Color Cards for Communication", "Referees have used yellow and red cards since 1970. Different color cards send different messages to players. Yellow cards say, \"Be careful with those fouls!\" Red cards mean \"You're out!\" All players from different countries clearly understand the meaning of these cards.", "Do you have a plan to watch a soccer match? Then check out the various colors on the field. It will be more fun!"];var PASS_KO=["축구에서의 색깔", "축구는 전 세계에서 인기 있는 운동입니다. 그것은 꽤 단순하기도 하죠. 여러분은 공, 작은 열린 공간, 그리고 (공을) 찰 욕구만이 필요해요! 아, 한 가지 더 잊지 마세요. 여러분은 색깔의 중요성을 이해해야 해요!", "검고 흰 축구공", "오늘날 축구공은 다양한 색깔로 나오지만, 검고 흰 축구공이 상당히 흔합니다. 여러분은 이 인기 있는 디자인의 기원에 대해 들어 본 적 있나요? 검고 흰 축구공은 1970년 멕시코 월드컵 동안에 나왔습니다. 사람들은 그들의 흑백 TV에서 그것들을 쉽게 발견할 수 있었어요. 그것은 똑똑하지 않나요? 이제 우리는 컬러텔레비전을 갖고 있지만, 우리는 여전히 이 고전적인 검고 흰 축구공을 찹니다.", "유니폼 색깔", "각 팀의 선수들은 자신들만의 색깔이 있는 유니폼을 입습니다. 유니폼 색깔은 팀을 같은 정신 아래 결속시키는 힘을 가졌습니다. 그것들은 또한 경기장에서 유용합니다. 선수들은 그들의 팀의 고유한 색깔 덕분에 서로를 알아보고 빠른 결정을 내릴 수 있습니다. 경기장에서, 심판들은 선수들로부터 눈에 띄어야 할 필요가 있기 때문에 특별한 색깔의 유니폼을 입습니다. 몇몇의 색깔 중에서, 검은색은 그들이 가장 좋아하는 것입니다. 검은색은 강력해 보이고 \"나와 논쟁하지 마시오!\"라는 강한 메시지를 전합니다.", "의사소통을 위한 색깔 카드", "심판은 1970년부터 노란색과 빨간색 카드를 사용해 왔습니다. 다른 색깔의 카드는 선수들에게 다른 메시지를 전합니다. 옐로카드는 \"그러한 반칙들을 조심하시오!\"라고 말합니다. 레드카드는 \"당신은 퇴장입니다!\"를 의미합니다. 다양한 나라 출신의 모든 선수들은 이 카드들의 의미를 분명하게 이해합니다.", "여러분은 축구 경기를 볼 계획이 있나요? 그렇다면 경기장에서의 다양한 색깔을 확인해 보세요. 그것은 더 재미있을 것입니다!"];
