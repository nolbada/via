 한다는 뜻이에요.","c":"T"},"h":"e9dd4e4691"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...the opposing airflow moves along the surface of the ball.)","ko":"...( ) 기류가 공의 표면을 따라서 움직인다.","opts":["빠른","부드러운","반대 방향의","차가운"],"word":"opposing","r":{"a":"3) 반대 방향의","ev":"7번 문장","s":[[7,"When a ball without stitches travels in the air, the opposing airflow moves along the surface of the ball.","실밥이 없는 공이 공중에서 이동할 때, 반대 방향의 기류가 공의 표면을 따라서 움직인다."]],"w":"공이 앞으로 날아가는데 기류는 공을 향해 마주 와요. 그래서 opposing은 '반대의(반대 방향의)'라는 뜻이에요.","c":3},"h":"327fcbde88"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...cause the air to change directions and bounce off the ball.)","ko":"...공기가 방향을 바꾸고 공에서 ( ) 나가도록 만든다.","opts":["가라앉아","튕겨","녹아","숨어"],"word":"bounce","r":{"a":"2) 튕겨","ev":"9번 문장","s":[[9,"But the stitches interrupt the airflow, which causes the air to change directions and bounce off the ball.","그러나 실밥은 그 기류를 방해하는데, 이는 공기가 방향을 바꿔 공에서 튕겨 나가도록 만든다."]],"w":"실밥 때문에 기류가 막히면 공기가 공에 붙지 않고 방향을 바꿔 공에서 튕겨 나가요. bounce(튕기다)는 부딪혀서 되튀는 모습이에요.","c":2},"h":"6d0916d40b"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis pulls the ball backward and makes it fly slower.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 공을 뒤로 잡아당기고 더 느리게 날아가게 만든다.","opts":["야구 경기","108개의 붉은 실밥","빠르게 날아가는 공","반대 방향의 기류가 공의 표면을 따라 움직이는 것"],"r":{"a":"4) 반대 방향의 기류가 공의 표면을 따라 움직이는 것","ev":"7~8번 문장","s":[[7,"When a ball without stitches travels in the air, the opposing airflow moves along the surface of the ball.","실밥이 없는 공이 공중에서 이동할 때, 반대 방향의 기류가 공의 표면을 따라서 움직인다."],[8,"This pulls the ball backward and makes it fly slower.","이것은 공을 뒤로 잡아당기고 더 느리게 날아가게 만든다."]],"w":"공을 뒤로 잡아당기는 것은 7번에서 말한 '반대 방향의 기류가 공의 표면을 따라 움직이는 것'이에요. 실밥은 오히려 이것을 막아요(9번).","c":4},"h":"cedf10646e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without them, the game of baseball wouldn’t be the same as it is now.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것들이 없다면, 야구 경기는 지금과 같지 않을 것이다.","opts":["실밥이 없다면 야구 경기는 지금과 같지 않을 것이다.","실밥이 없어도 야구 경기는 지금과 똑같을 것이다.","실밥이 없어서 야구 경기는 지금과 같지 않았다.","실밥이 많아지면 야구 경기는 지금과 달라질 것이다."],"r":{"a":"1) 실밥이 없다면 야구 경기는 지금과 같지 않을 것이다.","ev":"4번 문장","s":[[4,"Without them, the game of baseball wouldn’t be the same as it is now.","그것들이 없다면, 야구 경기는 지금과 같지 않을 것이다."]],"w":"Without them(그것들이 없다면)은 실밥이 없는 상황을 가정해요. wouldn’t be the same as it is now는 '지금과 같지 않을 것이다'라서 실밥이 야구에 꼭 필요하다는 뜻이에요.","c":1},"h":"be1b0292ed"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["야구공에는 실밥이 100개보다 적게 있다.","실밥은 야구공이 더 느리게 날아가게 만든다.","야구공의 실밥은 단지 보여주기 위한 것이 아니다.","실밥 때문에 선수들은 다양한 투구를 던지기 어렵다."],"opts":["A baseball has fewer than 100 stitches.","The stitches make a baseball fly more slowly.","The stitches on a baseball are not just for show.","The stitches make it hard for players to throw different pitches."],"r":{"a":"3) The stitches on a baseball are not just for show. (야구공의 실밥은 단지 보여주기 위한 것이 아니다.)","ev":"3번 문장","s":[[3,"Interestingly, these stitches aren’t just for show.","흥미롭게도, 이 실밥은 단지 보여주기 위한 것이 아니다."]],"w":"3번 문장에서 이 실밥은 단지 보여주기 위한 것이 아니라고 해요.","c":3,"k":null},"h":"b38d69ab2b"},{"n":9,"t":"sum","q":"The stitches (A) the airflow, so the air changes direction and cannot (B) the ball back.","ko":"실밥은 기류를 (A)해서, 공기는 방향을 바꾸고 공을 뒤로 (B)할 수 없다.","oko":["(A) 따라가서 / (B) 끌어당길","(A) 도와서 / (B) 던질","(A) 방해해서 / (B) 숨길","(A) 방해해서 / (B) 던질","(A) 방해해서 / (B) 끌어당길"],"opts":["(A) follow / (B) drag","(A) help / (B) throw","(A) interrupt / (B) hide","(A) interrupt / (B) throw","(A) interrupt / (B) drag"],"r":{"a":"5) (A) interrupt / (B) drag","ev":"9~10번 문장","s":[[9,"But the stitches interrupt the airflow, which causes the air to change directions and bounce off the ball.","그러나 실밥은 그 기류를 방해하는데, 이는 공기가 방향을 바꿔 공에서 튕겨 나가도록 만든다."],[10,"So, the air can’t drag the ball back.","그래서, 공기는 공을 뒤로 끌어당길 수 없다."]],"w":"9번에서 실밥이 기류를 방해하고(interrupt) 공기가 튕겨 나가요. 그래서 10번처럼 공기가 공을 뒤로 끌어당길(drag) 수 없어요.","c":5},"h":"22ba4e265d"},{"n":10,"t":"fill","q":"Generally, [A] surfaces have less air [B].","ko":"일반적으로, [A] 표면은 공기 [B]이(가) 더 적다.","bank":["smooth","resistance","backward","pitches","stitches","directions"],"bko":{"smooth":"매끄러운","resistance":"저항","backward":"뒤로","pitches":"투구들","stitches":"실밥들","directions":"방향들"},"r":{"a":"[A] smooth (매끄러운), [B] resistance (저항)","ev":"5번 문장","s":[[5,"Generally, smooth surfaces have less air resistance.","일반적으로, 매끄러운 표면은 더 적은 공기 저항을 가진다."]],"w":"5번 문장은 일반적으로 매끄러운(smooth) 표면은 공기 저항(resistance)이 더 적다는 뜻이에요.","c":null,"k":null},"h":"e9f7913361"}]},{"u":4,"id":"hk3-04-1","no":1,"ko":"단순한 인형극이 아냐","items":[{"n":1,"t":"tf","q":"Marionettes are a kind of puppet controlled by moving wires or strings.","ko":"마리오네트는 실 또는 줄을 움직여서 조종하는 일종의 인형이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"These are a kind of puppet controlled by moving wires or strings.","이것들은 실 또는 줄을 움직임으로써 조종되는 일종의 인형이다."]],"w":"2번 문장에 These are a kind of puppet controlled by moving wires or strings가 나와요. These는 1번의 마리오네트예요.","c":"T"},"h":"54b4c7e9b5"},{"n":2,"t":"tf","q":"Under Habsburg rule, people could use Czech freely in all documents.","ko":"합스부르크 왕가의 통치하에서, 사람들은 모든 문서에서 체코어를 자유롭게 쓸 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"During that time, people were forced to use German, the language of their invaders.","그 시기 동안, 사람들은 침략자의 언어인 독일어를 쓰도록 강요받았다."],[7,"Conversations, documents, and even plays had to be in German.","대화, 문서, 그리고 심지어 연극까지 독일어로 되어야만 했다."]],"w":"6번에서 사람들은 독일어를 쓰도록 강요받았고, 7번에서 대화, 문서, 심지어 연극까지 독일어로 해야 했다고 해요.","c":"F"},"h":"113fe7dc1e"},{"n":3,"t":"tf","q":"Czech people built up hopes and dreams for independence through puppet shows.","ko":"체코 사람들은 인형극을 통해 독립에 대한 희망과 꿈을 키웠다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"They also built up hopes and dreams for independence through these puppet shows.","그들은 또한 이 인형극들을 통해 독립에 대한 희망과 꿈을 키웠다."]],"w":"10번에 They also built up hopes and dreams for independence through these puppet shows라고 나와요.","c":"T"},"h":"ee7ba79904"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...people were forced to use German, the language of their invaders.)","ko":"사람들은 ( )의 언어인 독일어를 쓰도록 강요받았다.","opts":["친구들","상인들","침략자들","관광객들"],"word":"invaders","r":{"a":"3) 침략자들","ev":"6번 문장","s":[[6,"During that time, people were forced to use German, the language of their invaders.","그 시기 동안, 사람들은 침략자의 언어인 독일어를 쓰도록 강요받았다."]],"w":"독일어를 강요한 사람들이니 나라를 차지한 쪽이에요. 합스부르크 통치(5번) 아래에서 독일어를 쓰게 했으니 invaders는 '침략자들'이에요.","c":3},"h":"6670830818"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the marionettes have become a significant part of the culture.)","ko":"...마리오네트는 그 문화의 ( ) 부분이 되어왔다.","opts":["작은","중요한","오래된","이상한"],"word":"significant","r":{"a":"2) 중요한","ev":"11번 문장","s":[[11,"Since the country gained its freedom, the marionettes have become a significant part of the culture.","나라가 자유를 얻은 이후로, 마리오네트는 그 문화의 중요한 부분이 되어왔다."]],"w":"나라가 자유를 얻은 이후로 계속 문화의 한 부분이 되어 왔다는 말이에요. significant는 '중요한'이라는 뜻이에요.","c":2},"h":"0344c17e39"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis helped people preserve their native language.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 사람들이 그들의 모국어를 보존하도록 도왔다.","opts":["합스부르크 왕가의 통치","독일어를 써야 했던 것","나라가 자유를 얻은 것","소규모 인형극을 체코어로 공연할 수 있었던 것"],"r":{"a":"4) 소규모 인형극을 체코어로 공연할 수 있었던 것","ev":"8~9번 문장","s":[[8,"However, the small puppet shows that were held in homes and alleys could still be performed in Czech.","하지만, 주택과 골목에서 열렸던 소규모의 인형극들은 여전히 체코어로 공연될 수 있었다."],[9,"This helped people preserve their native language.","이것은 사람들이 그들의 모국어를 보존하도록 도왔다."]],"w":"모국어를 지키도록 도운 것은 8번에서 말한 '작은 인형극을 여전히 체코어로 공연할 수 있었던 것'이에요. 9번의 This는 이 내용을 받은 말이에요.","c":4},"h":"dc51b7e3ff"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But what do these puppet shows have to do with independence?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그런데 이 인형극들이 독립과 무슨 관련이 있을까?","opts":["그런데 이 인형극들이 독립과 무슨 관련이 있을까?","이 인형극들은 독립을 위해 무엇을 해야 할까?","이 인형극들은 독립 이후에 어떻게 바뀌었을까?","이 인형극들은 독립과 아무 관련이 없다."],"r":{"a":"1) 그런데 이 인형극들이 독립과 무슨 관련이 있을까?","ev":"4번 문장","s":[[4,"But what do these puppet shows have to do with independence?","그런데 이 인형극들이 독립과 무슨 관련이 있을까?"]],"w":"「have to do with」는 '~과 관련이 있다'예요. 그래서 what do these puppet shows have to do with independence는 '이 인형극들이 독립과 무슨 관련이 있을까?'라는 질문이에요.","c":1},"h":"a38e754773"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마리오네트극은 체코의 축제 기간에 절대 열리지 않는다.","합스부르크 통치 시기에 인형극은 금지되었다.","마리오네트극은 특히 나라의 독립을 축하하는 축제에서 흔하다.","인형극은 큰 극장에서만 열렸다."],"opts":["Marionette shows are never held during Czech festivals.","Puppet shows were banned during the Habsburg period.","Marionette shows are common during festivals that celebrate the nation’s independence.","Puppet shows were held only in big theaters."],"r":{"a":"3) Marionette shows are common during festivals that celebrate the nation’s independence.","ev":"3, 5, 8번 문장","s":[[3,"Marionette shows are common during Czech festivals, especially ones that celebrate the nation’s independence.","마리오네트극은 체코의 축제 기간 동안, 특히 나라의 독립을 축하하는 축제들에서 흔하다."],[5,"In the 17th century, Czech lands were under Habsburg rule.","17세기에, 체코의 영토는 합스부르크 왕가의 통치하에 있었다."],[8,"However, the small puppet shows that were held in homes and alleys could still be performed in Czech.","하지만, 주택과 골목에서 열렸던 소규모의 인형극들은 여전히 체코어로 공연될 수 있었다."]],"w":"3번에서 마리오네트극은 체코의 축제, 특히 독립을 축하하는 축제에서 흔하다고 해요. 합스부르크 통치는 17세기였고(5번), 작은 인형극은 주택과 골목에서 열렸어요(8번).","c":3},"h":"9dc4a4e1d7"},{"n":9,"t":"sum","q":"The small puppet shows held in homes and (A) could still be (B) in Czech.","ko":"주택과 (A)에서 열린 소규모 인형극은 여전히 체코어로 (B) 수 있었다.","oko":["A 골목 …… / B 공연될","A 극장 …… / B 공연될","A 골목 …… / B 팔릴","A 극장 …… / B 팔릴","A 학교 …… / B 잊힐"],"opts":["(A) alleys / (B) performed","(A) theaters / (B) performed","(A) alleys / (B) sold","(A) theaters / (B) sold","(A) schools / (B) forgotten"],"r":{"a":"1) (A) alleys / (B) performed (A 골목 …… / B 공연될)","ev":"8번 문장","s":[[8,"However, the small puppet shows that were held in homes and alleys could still be performed in Czech.","하지만, 주택과 골목에서 열렸던 소규모의 인형극들은 여전히 체코어로 공연될 수 있었다."]],"w":"8번 문장에서 주택과 골목(alleys)에서 열린 소규모 인형극은 여전히 체코어로 공연될(performed) 수 있었다고 해요.","c":1,"k":null},"h":"c74110d986"},{"n":10,"t":"fill","q":"In the 17th [A], Czech [B] were under Habsburg rule.","ko":"17[A]에, 체코의 [B]은(는) 합스부르크 왕가의 통치하에 있었다.","bank":["century","lands","preserve","celebrate","control","build"],"bko":{"century":"세기","lands":"영토(복수)","preserve":"보존하다","celebrate":"축하하다","control":"조종하다","build":"짓다"},"r":{"a":"[A] century (세기), [B] lands (영토(복수))","ev":"5번 문장","s":[[5,"In the 17th century, Czech lands were under Habsburg rule.","17세기에, 체코의 영토는 합스부르크 왕가의 통치하에 있었다."]],"w":"5번 문장은 17세기(century)에 체코의 영토(lands)가 합스부르크 왕가의 통치하에 있었다는 뜻이에요.","c":null,"k":null},"h":"1dce259b0b"}]},{"u":4,"id":"hk3-04-2","no":2,"ko":"made in 우주","items":[{"n":1,"t":"tf","q":"Veggie is a space garden on the International Space Station.","ko":"Veggie는 국제 우주 정거장에 있는 우주 정원이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Veggie—also known as the Vegetable Production System—is a space garden on the International Space Station.","채소 생산 시스템으로도 알려져 있는 Veggie는 국제 우주 정거장의 우주 정원이다."]],"w":"4번 문장에서 Veggie is a space garden on the International Space Station이라고 해요.","c":"T"},"h":"b73d250e02"},{"n":2,"t":"tf","q":"In Veggie, plants are grown in pots of soil.","ko":"Veggie에서 식물은 흙이 담긴 화분에서 길러진다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"Without gravity, the soil does not settle in pots around the plants.","중력 없이, 흙은 식물을 둘러싼 화분 안에 고정되지 않는다."],[8,"So Veggie’s plants are grown in a container of water.","그래서 Veggie의 식물은 물이 담긴 용기 안에서 길러진다."]],"w":"7번에서 중력이 없으면 흙이 화분 안에 고정되지 않는다고 하고, 8번에서 Veggie의 식물은 물이 담긴 용기 안에서 길러진다고 해요.","c":"F"},"h":"49e5bb4a50"},{"n":3,"t":"tf","q":"Astronauts have found ways to solve the problem of growing plants in space.","ko":"우주 비행사들은 우주에서 식물을 기르는 문제를 해결할 방법을 찾아냈다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Yet, astronauts have found ways to solve this problem!","그렇지만, 우주 비행사들은 이 문제를 해결할 방법을 찾아냈다!"]],"w":"3번에서 우주 비행사들이 이 문제(우주에서 식물에 물, 빛, 중력을 주기 힘든 것)를 해결할 방법을 찾아냈다고 해요.","c":"T"},"h":"f07e2cafa9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...it’s hard to provide plants with water, light, and gravity in space.)","ko":"...우주에서는 식물에 물, 빛, 그리고 중력을 ( ) 힘들기 때문이다.","opts":["빼앗기","제공하기","팔기","그리기"],"word":"provide","r":{"a":"2) 제공하기","ev":"2번 문장","s":[[2,"It seems impossible because it’s hard to provide plants with water, light, and gravity in space.","그것은 불가능하게 보이는데 왜냐하면 우주에서는 식물에 물, 빛, 그리고 중력을 제공하기가 힘들기 때문이다."]],"w":"우주에서 식물을 기르기 어려운 이유가 물, 빛, 중력을 식물에게 주기 힘들기 때문이에요. 「provide A with B」는 'A에게 B를 제공하다'예요.","c":2},"h":"8e79af314d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Their roots are fixed with a special gum...)","ko":"그것들의 뿌리는 특수한 고무로 ( ).","opts":["고정된다","잘린다","씻긴다","시든다"],"word":"fixed","r":{"a":"1) 고정된다","ev":"9번 문장","s":[[9,"Their roots are fixed with a special gum that helps the plants grow in one place.","그것들의 뿌리는 식물이 한 곳에서 자라도록 도와주는 특수한 고무로 고정된다."]],"w":"고무는 식물이 한 곳에서 자라도록 도와요. 그러니 뿌리는 그 고무로 움직이지 않게 고정돼요. fix는 '고정시키다'라는 뜻이에요.","c":1},"h":"8ddb5fabb5"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nHowever, this doesn’t work in space.","ko":"밑줄 친 this가 가리키는 것은?","sko":"하지만, 이것은 우주에서는 잘되지 않는다.","opts":["국제 우주 정거장","LED 조명으로 줄기를 위로 자라게 하는 일","지구에서 흙에 씨앗이나 뿌리를 놓고 물을 주어 식물을 기르는 방식","특수한 고무로 뿌리를 고정하는 일"],"r":{"a":"3) 지구에서 흙에 씨앗이나 뿌리를 놓고 물을 주어 식물을 기르는 방식","ev":"5~6번 문장","s":[[5,"To grow plants on the Earth, we only need to place a seed or roots in dirt and regularly provide water.","지구에서는 식물을 기르기 위해, 흙 안에 씨앗이나 뿌리를 놓고 주기적으로 물을 제공하기만 하면 된다."],[6,"However, this doesn’t work in space.","하지만, 이것은 우주에서는 잘되지 않는다."]],"w":"우주에서 잘되지 않는 것은 5번에서 말한 '지구에서 씨앗이나 뿌리를 흙에 놓고 물을 주어 식물을 기르는 방식'이에요. 7번에서 중력이 없어 흙이 고정되지 않는 이유가 나와요.","c":3},"h":"aad2d08e53"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Soon, we might be able to see a space farm with various plants!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"곧, 우리는 다양한 식물이 있는 우주 농장을 볼 수 있을지도 모른다!","opts":["우리는 곧 우주에서 다양한 식물이 있는 농장을 볼 수 없을 것이다.","우리는 이미 우주 농장에서 다양한 식물을 먹고 있다.","우리는 지구에서 다양한 식물이 있는 우주 농장을 만들었다.","곧 우리는 다양한 식물이 있는 우주 농장을 볼 수 있을지도 모른다."],"r":{"a":"4) 곧 우리는 다양한 식물이 있는 우주 농장을 볼 수 있을지도 모른다.","ev":"12번 문장","s":[[12,"Soon, we might be able to see a space farm with various plants!","곧, 우리는 다양한 식물이 있는 우주 농장을 볼 수 있을지도 모른다!"]],"w":"might be able to는 '~할 수 있을지도 모른다'는 약한 가능성이에요. 그래서 곧 다양한 식물이 있는 우주 농장을 볼 수 있을지도 모른다는 뜻이에요.","c":4},"h":"8f5c88a377"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우주에서 식물은 흙이 담긴 화분에서 길러진다.","우주에서 원예가 가능해졌다.","우주 비행사들은 우주에서 식물을 기르는 방법을 아직 찾지 못했다.","LED 조명은 줄기가 아래로 자라게 한다."],"opts":["Plants in space are grown in soil in pots.","Gardening has become possible in space.","Astronauts have not found a way to grow plants in space.","LED lights make the stems grow downward."],"r":{"a":"2) Gardening has become possible in space. (우주에서 원예가 가능해졌다.)","ev":"11번 문장","s":[[11,"In this way, gardening has become possible in space.","이러한 방식으로, 우주에서 원예가 가능하게 되었다."]],"w":"11번 문장에서 이러한 방식으로 우주에서 원예가 가능하게 되었다고 해요.","c":2,"k":null},"h":"ff4ce1d38b"},{"n":9,"t":"sum","q":"LED lights (A) above the plants guide the stems to grow (B).","ko":"식물 위에 (A) LED 조명은 줄기가 (B) 자라도록 유도한다.","oko":["A 설치된 …… / B 위로","A 설치된 …… / B 아래로","A 숨겨진 …… / B 위로","A 숨겨진 …… / B 아래로","A 팔린 …… / B 옆으로"],"opts":["(A) installed / (B) upward","(A) installed / (B) downward","(A) hidden / (B) upward","(A) hidden / (B) downward","(A) sold / (B) sideways"],"r":{"a":"1) (A) installed / (B) upward (A 설치된 …… / B 위로)","ev":"10번 문장","s":[[10,"Furthermore, LED lights installed above the plants guide the stems to grow upward.","게다가, 식물 위에 설치된 LED 조명은 줄기가 위로 자라도록 유도한다."]],"w":"10번 문장에서 식물 위에 설치된(installed) LED 조명이 줄기가 위로(upward) 자라도록 유도한다고 해요.","c":1,"k":null},"h":"fbf6032443"},{"n":10,"t":"fill","q":"To grow plants on the Earth, we only need to place a [A] or roots in [B] and regularly provide water.","ko":"지구에서는 식물을 기르기 위해, [B] 안에 [A]이나 뿌리를 놓고 주기적으로 물을 제공하기만 하면 된다.","bank":["seed","dirt","fixed","settle","guide","special"],"bko":{"seed":"씨앗","dirt":"흙","fixed":"고정된","settle":"가라앉다, 자리 잡다","guide":"유도하다","special":"특수한"},"r":{"a":"[A] seed (씨앗), [B] dirt (흙)","ev":"5번 문장","s":[[5,"To grow plants on the Earth, we only need to place a seed or roots in dirt and regularly provide water.","지구에서는 식물을 기르기 위해, 흙 안에 씨앗이나 뿌리를 놓고 주기적으로 물을 제공하기만 하면 된다."]],"w":"5번 문장은 지구에서는 흙(dirt) 안에 씨앗(seed)이나 뿌리를 놓고 물을 주면 된다는 뜻이에요.","c":null,"k":null},"h":"cc89d811d5"}]},{"u":4,"id":"hk3-04-3","no":3,"ko":"보이는 게 다가 아니야~","items":[{"n":1,"t":"tf","q":"Each human eye contains as many as 1.6 million nerve fibers.","ko":"인간의 각각의 눈은 무려 160만 개의 신경 섬유를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Each one contains as many as 1.6 million nerve fibers.","각각의 눈은 무려 160만 개의 신경 섬유들을 가지고 있다."]],"w":"2번 문장에 Each one contains as many as 1.6 million nerve fibers라고 나와요. Each one은 각각의 눈이에요.","c":"T"},"h":"6e64ee0b0f"},{"n":2,"t":"tf","q":"There are many nerves in the blind spot, so you can see everything clearly there.","ko":"맹점에는 신경이 많이 있어서 그곳에서는 모든 것을 또렷하게 볼 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4, 6번 문장","s":[[4,"However, there is a tiny spot in each eye that does not have any nerves.","하지만, 각각의 눈에는 조금의 신경도 가지고 있지 않은 작은 지점이 있다."],[6,"You cannot see anything that comes in this area.","당신은 이 영역에 들어오는 것은 아무것도 볼 수 없다."]],"w":"4번에서 맹점은 신경이 조금도 없는 작은 지점이라고 하고, 6번에서 그 영역에 들어오는 것은 아무것도 볼 수 없다고 해요.","c":"F"},"h":"8c1eea0f4a"},{"n":3,"t":"tf","q":"Nerve fibers send signals to your brain.","ko":"신경 섬유들은 당신의 뇌에 신호를 보낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"These fibers send signals to your brain, which processes what you see.","이 섬유들은 당신의 뇌에 신호를 보내는데, 그것은 당신이 보는 것을 처리한다."]],"w":"3번 문장에 These fibers send signals to your brain이라고 나와요.","c":"T"},"h":"68cb1529f6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The human eye is an incredible organ.)","ko":"인간의 눈은 ( ) 기관이다.","opts":["평범한","놀라운","작은","아픈"],"word":"incredible","r":{"a":"2) 놀라운","ev":"1번 문장","s":[[1,"The human eye is an incredible organ.","인간의 눈은 놀라운 기관이다."]],"w":"눈 하나에 신경 섬유가 160만 개나 있다는 이야기가 이어져요(2번). 그래서 incredible은 '놀라운'이라는 뜻이에요.","c":2},"h":"ac653c1841"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Your brain immediately fills in the image...)","ko":"당신의 뇌는 ( ) 그 이미지를 채워 넣는다.","opts":["천천히","가끔","나중에","즉각적으로"],"word":"immediately","r":{"a":"4) 즉각적으로","ev":"9번 문장","s":[[9,"Your brain immediately fills in the image using information gathered from the other eye.","당신의 뇌는 다른 한쪽 눈에서 모인 정보를 이용해서 즉각적으로 그 이미지를 채워 넣는다."]],"w":"안 보이는 것을 우리가 알아차리지 못하는 이유는 뇌가 바로바로 채워 넣기 때문이에요. immediately는 '즉각적으로'라는 뜻이에요.","c":4},"h":"3ca24cd5b8"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBut you normally do not realize it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만 당신은 보통 그것을 알아차리지 못한다.","opts":["당신의 뇌","신경 섬유","맹점 때문에 일부가 보이지 않는다는 사실","초록색 하트"],"r":{"a":"3) 맹점 때문에 일부가 보이지 않는다는 사실","ev":"6~7번 문장","s":[[6,"You cannot see anything that comes in this area.","당신은 이 영역에 들어오는 것은 아무것도 볼 수 없다."],[7,"But you normally do not realize it.","하지만 당신은 보통 그것을 알아차리지 못한다."]],"w":"6번에서 맹점에 들어오는 것은 볼 수 없다고 해요. 7번에서 우리가 보통 알아차리지 못하는 것은 바로 이 사실(일부가 안 보인다는 것)이에요.","c":3},"h":"be945ede20"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, there is a tiny spot in each eye that does not have any nerves.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 각각의 눈에는 조금의 신경도 가지고 있지 않은 작은 지점이 있다.","opts":["각각의 눈에는 조금의 신경도 없는 작은 지점이 있다.","각각의 눈에는 신경이 가장 많이 모인 작은 지점이 있다.","각각의 눈에는 신경이 하나만 들어 있다.","눈에는 신경이 전혀 없다."],"r":{"a":"1) 각각의 눈에는 조금의 신경도 없는 작은 지점이 있다.","ev":"4번 문장","s":[[4,"However, there is a tiny spot in each eye that does not have any nerves.","하지만, 각각의 눈에는 조금의 신경도 가지고 있지 않은 작은 지점이 있다."]],"w":"that does not have any nerves는 a tiny spot을 꾸며서 '조금의 신경도 없는'이라는 뜻이에요. 눈 전체가 아니라 작은 한 지점에만 신경이 없어요.","c":1},"h":"c221f527cd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["각각의 눈에는 신경 섬유가 하나도 없다.","맹점 안에서도 우리는 모든 것을 볼 수 있다.","초록색 하트는 맹점에 들어가면 사라진다.","빨간색 하트는 맹점 안에 있을 때 사라진다."],"opts":["Each eye has no nerve fibers.","You can see everything in your blind spot.","The green heart disappears when it is in your blind spot.","The red heart disappears when it is in your blind spot."],"r":{"a":"4) The red heart disappears when it is in your blind spot. (빨간색 하트는 맹점 안에 있을 때 사라진다.)","ev":"14~15번 문장","s":[[14,"At some point, you may suddenly notice that the red heart has disappeared.","어느 시점에, 당신은 갑자기 빨간색 하트가 사라진 것을 알아차릴 것이다."],[15,"This happens when the red heart is in your blind spot.","이것은 빨간색 하트가 당신의 맹점 안에 있을 때 발생한다."]],"w":"14~15번 문장에서 빨간색 하트가 맹점 안에 있을 때 사라진다고 해요.","c":4,"k":null},"h":"885ed3879d"},{"n":9,"t":"sum","q":"To do the test, cover your right eye and (A) at the green heart, and slowly move your face (B).","ko":"실험을 하려면, 오른쪽 눈을 가리고 초록색 하트를 (A), 천천히 얼굴을 (B) 움직여라.","oko":["A 응시하고 …… / B 더 가깝게","A 응시하고 …… / B 멀리","A 보며 웃고 …… / B 더 가깝게","A 보며 웃고 …… / B 멀리","A 향해 손을 흔들고 …… / B 멀리"],"opts":["(A) stare / (B) closer","(A) stare / (B) away","(A) laugh / (B) closer","(A) laugh / (B) away","(A) wave / (B) away"],"r":{"a":"1) (A) stare / (B) closer (A 응시하고 …… / B 더 가깝게)","ev":"12~13번 문장","s":[[12,"Cover your right eye and stare at the green heart.","오른쪽 눈을 가리고 초록색 하트를 응시해라."],[13,"Slowly move your face closer, but keep focusing on it.","천천히 얼굴을 더 가깝게 움직이되, 초록색 하트에 계속 초점을 맞춰라."]],"w":"12~13번 문장에서 오른쪽 눈을 가리고 초록색 하트를 응시하며(stare) 천천히 얼굴을 더 가깝게(closer) 움직이라고 해요.","c":1,"k":null},"h":"997c52c2bd"},{"n":10,"t":"fill","q":"You think you have full [A], but part of it is actually [B] by your brain.","ko":"당신은 완전한 [A]를 갖고 있다고 생각하지만, 그것의 일부는 사실 당신의 뇌에 의해 [B].","bank":["vision","created","nerves","signals","heart","spot"],"bko":{"vision":"시야","created":"만들어진","nerves":"신경들","signals":"신호들","heart":"하트","spot":"지점"},"r":{"a":"[A] vision, [B] created","ev":"10번 문장","s":[[10,"Therefore, you think you have full vision, but part of it is actually created by your brain.","따라서, 당신은 완전한 시야를 갖고 있다고 생각하지만, 시야의 일부는 사실 당신의 뇌에 의해 만들어진다."]],"w":"10번에서 우리는 완전한 시야(vision)를 가졌다고 생각하지만, 사실 그 일부는 뇌에 의해 만들어진다(created)고 해요.","c":null},"h":"d1ed6c3218"}]},{"u":4,"id":"hk3-04-4","no":4,"ko":"무엇을 무엇을 선택할까?","items":[{"n":1,"t":"tf","q":"People with Hamlet Syndrome are afraid they will make the wrong choice.","ko":"햄릿 증후군을 가진 사람들은 잘못된 선택을 할까 봐 두려워한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"People with this syndrome are afraid they will make the wrong choice.","이 증후군을 가진 사람들은 그들이 잘못된 선택을 할 것을 두려워한다."]],"w":"7번 문장에 People with this syndrome are afraid they will make the wrong choice라고 나와요. this syndrome은 6번의 Hamlet Syndrome이에요.","c":"T"},"h":"05f8c9d14c"},{"n":2,"t":"tf","q":"For people with Hamlet Syndrome, having many options makes them feel less stressed.","ko":"햄릿 증후군을 가진 사람들에게, 선택지가 많은 것은 스트레스를 덜 받게 한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"To these people, having many options means that they get more stressed!","이러한 사람들에게, 많은 선택지를 가지는 것은 그들이 더 스트레스를 받는다는 것을 의미한다!"]],"w":"9번에서 선택지를 많이 가지는 것은 그들이 더 스트레스를 받는다(more stressed)는 것을 의미한다고 해요. 덜 받는다는 말은 반대예요.","c":"F"},"h":"b06566a5ce"},{"n":3,"t":"tf","q":"Some restaurants provide a special menu with a single item each day.","ko":"일부 식당들은 매일 하나의 품목으로 된 특별 메뉴를 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"They provide a special menu each day with a single item for people who can’t make a choice.","그들은 선택을 하지 못하는 사람들을 위해 매일 하나의 품목으로 된 특별 메뉴를 제공한다."]],"w":"11번 문장에 They provide a special menu each day with a single item이라고 나와요. They는 10번의 some restaurants예요.","c":"T"},"h":"2200eb90d3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...Hamlet, the main character, faces a situation where he struggles to make a decision.)","ko":"...주인공인 햄릿은 그가 결정을 내리기 위해 ( ) 상황에 직면한다.","opts":["거절하는","즐기는","애쓰는","잊는"],"word":"struggles","r":{"a":"3) 애쓰는","ev":"3번 문장","s":[[3,"In the play, Hamlet, the main character, faces a situation where he struggles to make a decision.","그 연극에서, 주인공인 햄릿은 결정을 내리기 위해 애쓰는 상황에 직면한다."]],"w":"햄릿은 결정을 쉽게 못 내려서 힘들어하는 인물이에요. 「struggle + to-v」는 '~하려고 애쓰다'라는 뜻이에요.","c":3},"h":"19333aac05"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But if this happens frequently, you could have a condition known as Hamlet Syndrome.)","ko":"하지만 만약 이런 일이 ( ) 발생한다면, 당신은 햄릿 증후군이라고 알려져 있는 문제를 가지고 있을 수 있다.","opts":["드물게","자주","갑자기","천천히"],"word":"frequently","r":{"a":"2) 자주","ev":"6번 문장","s":[[6,"But if this happens frequently, you could have a condition known as Hamlet Syndrome.","하지만 만약 이런 일이 자주 발생한다면, 당신은 햄릿 증후군이라고 알려져 있는 문제를 가지고 있을 수 있다."]],"w":"증후군이라고 불릴 정도라면 가끔이 아니라 자주 그렇다는 말이에요. frequently는 '자주'라는 뜻이에요.","c":2},"h":"1cf5027652"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nLike him, you may have a hard time making decisions in some cases.","ko":"밑줄 친 him이 가리키는 것은?","sko":"그처럼, 당신은 어떤 경우 결정을 내리는 데 힘든 시간을 겪을 수도 있다.","opts":["당신","식당 주인","연극 관객","햄릿"],"r":{"a":"4) 햄릿","ev":"3~4번 문장","s":[[3,"In the play, Hamlet, the main character, faces a situation where he struggles to make a decision.","그 연극에서, 주인공인 햄릿은 결정을 내리기 위해 애쓰는 상황에 직면한다."],[4,"Like him, you may have a hard time making decisions in some cases.","그처럼, 당신은 어떤 경우 결정을 내리는 데 힘든 시간을 겪을 수도 있다."]],"w":"결정을 내리려고 애쓰던 사람은 3번의 Hamlet이에요. 4번의 him은 햄릿을 받아서 '햄릿처럼'이라는 뜻이에요.","c":4},"h":"81b8f5f344"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They even have a menu item for so-called Hamlets: Whatever.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 심지어 흔히 햄릿이라 불리는 이들을 위한 ‘아무거나’라는 메뉴 품목을 가지고 있다.","opts":["식당들은 선택을 못 하는 사람들을 위해 ‘아무거나’라는 이름의 메뉴를 가지고 있기도 하다.","식당들은 햄릿이라는 이름의 요리를 가장 비싸게 판다.","식당들은 손님이 아무거나 먹지 못하게 한다.","식당들은 메뉴를 고르지 못하는 사람을 내보낸다."],"r":{"a":"1) 식당들은 선택을 못 하는 사람들을 위해 ‘아무거나’라는 이름의 메뉴를 가지고 있기도 하다.","ev":"12번 문장","s":[[12,"They even have a menu item for so-called Hamlets: Whatever.","그들은 심지어 흔히 햄릿이라 불리는 이들을 위한 ‘아무거나’라는 메뉴 품목을 가지고 있다."]],"w":"so-called Hamlets는 '이른바 햄릿이라 불리는 사람들'로, 결정을 못 하는 사람들을 말해요. 그들을 위한 메뉴 이름이 Whatever(아무거나)라는 뜻이에요.","c":1},"h":"b6cebd67b6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["햄릿은 결정을 아주 빠르게 내리는 인물이다.","햄릿 증후군을 가진 사람들은 무엇을 마실지 고르는 일을 편안하게 느낀다.","“To be, or not to be”는 연극 <햄릿>의 가장 유명한 대사이다.","식당들은 햄릿 증후군을 가진 손님을 두려워한다."],"opts":["Hamlet always makes decisions quickly.","People with Hamlet Syndrome feel relaxed when choosing what to drink.","“To be, or not to be” is the most famous line from the play Hamlet.","Restaurants are afraid of customers with Hamlet Syndrome."],"r":{"a":"3) “To be, or not to be” is the most famous line from the play Hamlet.","ev":"2, 3, 8, 10번 문장","s":[[2,"This is the most famous line from the play Hamlet.","이것은 연극 <햄릿>의 가장 유명한 대사이다."],[3,"In the play, Hamlet, the main character, faces a situation where he struggles to make a decision.","그 연극에서, 주인공인 햄릿은 결정을 내리기 위해 애쓰는 상황에 직면한다."],[8,"Even an everyday decision like choosing what to drink can be stressful.","심지어 무엇을 마실지 선택하는 것과 같은 일상적인 결정도 스트레스를 일으킬 수 있다."],[10,"Interestingly, some restaurants see this phenomenon as an opportunity to attract more customers.","흥미롭게도, 일부 식당들은 이러한 현상을 더 많은 손님들을 끌어들일 기회로 여긴다."]],"w":"2번에서 이 대사가 연극 <햄릿>의 가장 유명한 대사라고 해요. 햄릿은 결정하려고 애쓰고(3번), 무엇을 마실지 고르는 일도 스트레스가 되며(8번), 식당들은 이 현상을 기회로 여겨요(10번).","c":3},"h":"c9938b5a5a"},{"n":9,"t":"sum","q":"Like Hamlet, you may have a hard time, so you might (A) making choices or let (B) decide for you.","ko":"햄릿처럼, 당신은 힘든 시간을 겪을 수 있어서, 선택을 (A)하거나 (B)이(가) 당신을 위해 결정하게 둘지도 모른다.","oko":["A 미루거나 …… / B 다른 사람들","A 미루거나 …… / B 아무도","A 즐기거나 …… / B 다른 사람들","A 즐기거나 …… / B 아무도","A 시작하거나 …… / B 동물들"],"opts":["(A) delay / (B) others","(A) delay / (B) nobody","(A) enjoy / (B) others","(A) enjoy / (B) nobody","(A) start / (B) animals"],"r":{"a":"1) (A) delay / (B) others (A 미루거나 …… / B 다른 사람들)","ev":"4~5번 문장","s":[[4,"Like him, you may have a hard time making decisions in some cases.","그처럼, 당신은 어떤 경우 결정을 내리는 데 힘든 시간을 겪을 수도 있다."],[5,"As a result, you might delay making choices or let others decide for you.","그 결과, 당신은 결정을 하는 것을 미루거나 다른 사람들이 당신을 위해 결정하게 둘지도 모른다."]],"w":"5번 문장에서 선택하는 것을 미루거나(delay) 다른 사람들(others)이 대신 결정하게 둘지도 모른다고 해요.","c":1,"k":null},"h":"af15ca8c63"},{"n":10,"t":"fill","q":"Some restaurants see this [A] as an [B] to attract more customers.","ko":"일부 식당들은 이 [A]을 더 많은 손님들을 끌어들일 [B]로 여긴다.","bank":["phenomenon","opportunity","frequently","customers","restaurants","afraid"],"bko":{"phenomenon":"현상","opportunity":"기회","frequently":"자주","customers":"손님들","restaurants":"식당들","afraid":"두려워하는"},"r":{"a":"[A] phenomenon, [B] opportunity","ev":"10번 문장","s":[[10,"Interestingly, some restaurants see this phenomenon as an opportunity to attract more customers.","흥미롭게도, 일부 식당들은 이러한 현상을 더 많은 손님들을 끌어들일 기회로 여긴다."]],"w":"10번에서 일부 식당들은 이 현상(phenomenon)을 더 많은 손님을 끌어들일 기회(opportunity)로 여겨요. 「see A as B」는 'A를 B로 여기다'예요.","c":null},"h":"2474098a12"}]},{"u":5,"id":"hk3-05-1","no":1,"ko":"변기가 예술이네","items":[{"n":1,"t":"tf","q":"Marcel Duchamp made Fountain in 1917.","ko":"마르셀 뒤샹은 1917년에 <샘>을 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In 1917, Marcel Duchamp created a work called Fountain.","1917년에, 마르셀 뒤샹은 <샘>이라고 불리는 작품을 만들었다."]],"w":"2번 문장에서 1917년에 뒤샹이 Fountain이라는 작품을 만들었다(created a work called Fountain)고 해요. 글의 내용과 같아요.","c":"T"},"h":"ff217d202c"},{"n":2,"t":"tf","q":"Cattelan’s toilet sculpture was made of stone.","ko":"카텔란의 변기 조각상은 돌로 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"More surprisingly, the sculpture was made entirely of gold!","더욱 놀랍게도, 그 조각상은 전부 금으로 만들어졌다!"]],"w":"8번 문장에서 조각상은 전부 금으로(entirely of gold) 만들어졌다고 해요. 돌이라는 말은 없어요.","c":"F"},"h":"8beca5ee59"},{"n":3,"t":"tf","q":"Another artist made a toilet-shaped sculpture a century after Duchamp’s work.","ko":"또 다른 예술가가 뒤샹의 작품 한 세기 후에 변기 모양의 조각상을 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"A century later, another artist named Maurizio Cattelan created a sculpture in the form of a toilet, too.","한 세기 후, 마우리치오 카텔란이라는 이름의 또 다른 예술가 역시 변기의 형태를 한 조각상을 만들었다."]],"w":"6번 문장에서 A century later(한 세기 후)에 카텔란이 변기 모양의 조각상을 만들었다고 해요. 글의 내용과 같아요.","c":"T"},"h":"c286e3ffc9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This challenged many people’s idea of what art could be.)","ko":"이것은 예술이 무엇일 수 있는지에 관한 많은 사람들의 관념에 ( ). (밑줄 친 단어의 뜻은?)","opts":["확인해 주었다","이의를 제기했다","더 널리 퍼뜨렸다","그대로 따랐다"],"word":"challenged","r":{"a":"2) 이의를 제기했다","ev":"3~4번 문장","s":[[3,"The piece was just a common urinal, but he turned it upside down to make it look like a fountain.","그 작품은 그냥 흔한 소변기였지만, 그는 그것을 샘처럼 보이게 만들기 위해 거꾸로 뒤집었다."],[4,"This challenged many people’s idea of what art could be.","이것은 예술이 무엇일 수 있는지에 관한 많은 사람들의 관념에 이의를 제기했다."]],"w":"3번에서 소변기를 뒤집어 놓고 예술이라고 했으니, 4번은 '예술은 이런 것'이라는 기존 생각에 이의를 제기했다는 말이에요. challenge = 이의를 제기하다.","c":2},"h":"c2805163fe"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…as long as they were modified in a creative way.)","ko":"…그것들이 창의적인 방식으로 ( ) 하기만 하면. (밑줄 친 단어의 뜻은?)","opts":["숨겨진","팔린","바뀐","잃어버린"],"word":"modified","r":{"a":"3) 바뀐","ev":"5번 문장","s":[[5,"And it showed that ordinary objects could be art as long as they were modified in a creative way.","그리고 그것은 일반적인 사물이 창의적인 방식으로 바뀌기만 하면 예술이 될 수 있다는 것을 보여줬다."]],"w":"5번은 평범한 사물이 창의적인 방식으로 바뀌면 예술이 될 수 있다는 뜻이에요. 3번에서 소변기를 뒤집은 것처럼 modify는 '바꾸다'예요. were modified = 바뀌어진.","c":3},"h":"f2d5bfb6bd"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was placed in a museum bathroom, and people could actually use it.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 박물관 화장실에 놓였고, 사람들은 그것을 실제로 사용할 수 있었다.","opts":["마우리치오 카텔란","박물관 화장실","<샘>이라는 작품","변기 모양의 조각상"],"r":{"a":"4) 변기 모양의 조각상","ev":"6~7번 문장","s":[[6,"A century later, another artist named Maurizio Cattelan created a sculpture in the form of a toilet, too.","한 세기 후, 마우리치오 카텔란이라는 이름의 또 다른 예술가 역시 변기의 형태를 한 조각상을 만들었다."],[7,"It was placed in a museum bathroom, and people could actually use it.","그것은 박물관 화장실에 놓였고, 사람들은 그것을 실제로 사용할 수 있었다."]],"w":"박물관 화장실에 놓인 것은 6번에서 카텔란이 만든 변기 모양의 조각상(a sculpture in the form of a toilet)이에요. 8번에서 the sculpture, 9번에서 it으로 이어져요.","c":4},"h":"c3281d9a65"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"And it showed that ordinary objects could be art as long as they were modified in a creative way.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그리고 그것은 일반적인 사물이 창의적인 방식으로 바뀌기만 하면 예술이 될 수 있다는 것을 보여줬다.","opts":["일반적인 사물도 창의적으로 바뀌기만 하면 예술이 될 수 있다는 것을 보여줬다.","일반적인 사물은 아무리 바꿔도 예술이 될 수 없다는 것을 보여줬다.","예술가는 반드시 유명한 사물만 사용해야 한다는 것을 보여줬다.","창의적인 사람만 사물을 바꿀 수 있다는 것을 보여줬다."],"r":{"a":"1) 일반적인 사물도 창의적으로 바뀌기만 하면 예술이 될 수 있다는 것을 보여줬다.","ev":"5번 문장","s":[[5,"And it showed that ordinary objects could be art as long as they were modified in a creative way.","그리고 그것은 일반적인 사물이 창의적인 방식으로 바뀌기만 하면 예술이 될 수 있다는 것을 보여줬다."]],"w":"ordinary objects could be art는 '일반적인 사물이 예술이 될 수 있다'이고, as long as ~는 '~하기만 하면'이라는 조건이에요. 조건은 '창의적인 방식으로 바뀌는 것'이에요.","c":1},"h":"3a28774f45"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["뒤샹은 금으로 된 샘을 거꾸로 뒤집어 <샘>을 만들었다.","<샘>은 <아메리카>가 만들어진 한 세기 후에 만들어졌다.","카텔란은 자신의 변기 조각상에 <아메리카>라는 이름을 붙였다.","카텔란은 돈을 많이 쓰는 사람들을 칭찬하려고 <아메리카>를 만들었다."],"opts":["Duchamp turned a golden fountain upside down to make Fountain.","Fountain was made a century after America.","Cattelan named his toilet sculpture America.","Cattelan made America to praise people who spend a lot of money."],"r":{"a":"3) Cattelan named his toilet sculpture America. (카텔란은 자신의 변기 조각상에 <아메리카>라는 이름을 붙였다.)","ev":"9번 문장","s":[[9,"Cattelan named it America.","카텔란은 그것에 <아메리카>라고 이름을 붙였다."]],"w":"9번 문장에서 카텔란은 그것(변기 조각상)에 <아메리카>라는 이름을 붙였다고 해요.","c":3,"k":null},"h":"e66f72692a"},{"n":9,"t":"sum","q":"Through America, Cattelan (A) people who waste money on unnecessary things and made them (B) whether they really want luxurious things.","ko":"<아메리카>를 통해 카텔란은 불필요한 것에 돈을 낭비하는 사람들을 (A)했고, 사치스러운 것을 정말 원하는지 스스로에게 (B)하게 했다.","oko":["(A) 칭찬했다 / (B) 묻다","(A) 비판했다 / (B) 잊다","(A) 초대했다 / (B) 대답하다","(A) 비판했다 / (B) 묻다","(A) 무시했다 / (B) 사다"],"opts":["(A) praised / (B) ask","(A) criticized / (B) forget","(A) invited / (B) answer","(A) criticized / (B) ask","(A) ignored / (B) buy"],"r":{"a":"4) (A) criticized / (B) ask","ev":"10~11번 문장","s":[[10,"Through America, he tried to criticize those who waste money on unnecessary objects.","<아메리카>를 통해, 그는 불필요한 물건에 돈을 낭비하는 사람들을 비판하려 노력했다."],[11,"He also made people ask themselves whether they really desired overly luxurious things, like the golden toilet.","그는 또한 사람들이 금으로 된 변기와 같이, 지나치게 사치스러운 것들을 정말로 원했던 것인지 자신에게 묻도록 만들었다."]],"w":"10번에서 낭비하는 사람들을 비판하려 했고(criticize), 11번에서 사람들이 스스로에게 묻게 만들었어요(ask). 칭찬이나 무시가 아니에요.","c":4},"h":"ae5b70a4e0"},{"n":10,"t":"fill","q":"The [B] was just a [A] urinal, but he turned it upside down to make it look like a fountain.","ko":"그 [B]은(는) 그냥 [A] 소변기였지만, 그는 그것을 샘처럼 보이게 만들기 위해 거꾸로 뒤집었다.","bank":["common","piece","waste","desire","exhibit","challenge"],"bko":{"common":"흔한","piece":"작품","waste":"낭비하다","desire":"원하다","exhibit":"전시하다","challenge":"이의를 제기하다"},"r":{"a":"[A] common (흔한), [B] piece (작품)","ev":"3번 문장","s":[[3,"The piece was just a common urinal, but he turned it upside down to make it look like a fountain.","그 작품은 그냥 흔한 소변기였지만, 그는 그것을 샘처럼 보이게 만들기 위해 거꾸로 뒤집었다."]],"w":"3번 문장은 그 작품(piece)이 그냥 흔한(common) 소변기였다는 뜻이에요.","c":null,"k":null},"h":"44a2f9a16b"}]},{"u":5,"id":"hk3-05-2","no":2,"ko":"당신의 생각은 어떻습니까?","items":[{"n":1,"t":"tf","q":"Some videos made by kids get millions of hits.","ko":"아이들이 만든 일부 영상은 수백만 조회 수를 얻는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Many of their videos become popular, and some even get millions of hits.","그들의 영상 중 많은 것이 인기를 얻고, 일부는 심지어 수백만의 조회 수를 얻는다."]],"w":"2번 문장에서 아이들의 영상 중 일부는 수백만 조회 수(millions of hits)를 얻는다고 해요. 글의 내용과 같아요.","c":"T"},"h":"dae854f496"},{"n":2,"t":"tf","q":"Emma thinks most comments on kids’ videos are harmful.","ko":"Emma는 아이들 영상의 대부분의 댓글이 해롭다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Most of the comments are not harmful, and many are even encouraging.","대부분의 댓글은 해롭지 않고 많은 것은 힘을 북돋아주기까지 해."]],"w":"10번 문장에서 Emma는 대부분의 댓글이 해롭지 않고(not harmful) 많은 댓글이 힘을 북돋아 준다고 말해요. 해롭다는 건 반대예요.","c":"F"},"h":"d4db46edee"},{"n":3,"t":"tf","q":"Andrew says kids can have lower self-esteem because of hateful comments.","ko":"Andrew는 아이들이 악의적인 댓글 때문에 더 낮은 자존감을 가질 수 있다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"As a result, they can become discouraged and have lower self-esteem.","그 결과, 그들은 좌절하게 되거나 더 낮은 자존감을 가질 수 있어."]],"w":"7번 문장에서 Andrew는 아이들이 좌절하게 되거나 더 낮은 자존감(lower self-esteem)을 가질 수 있다고 해요. 글의 내용과 같아요.","c":"T"},"h":"f40ae55183"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (That’s why a few websites have banned leaving comments for all videos posted by children.)","ko":"그것이 몇몇 웹사이트가 어린이들이 올린 모든 영상에 댓글을 남기는 것을 ( ) 이유이다. (밑줄 친 단어의 뜻은?)","opts":["장려해 온","금지해 온","기대해 온","허용해 온"],"word":"banned","r":{"a":"2) 금지해 온","ev":"3~4번 문장","s":[[3,"Unfortunately, people sometimes post hateful comments about these videos.","안타깝게도, 사람들은 가끔 이러한 영상에 악의적인 댓글을 올린다."],[4,"That’s why a few websites have banned leaving comments for all videos posted by children.","그것이 몇몇 웹사이트가 어린이들에 의해 올려진 모든 영상에 댓글을 남기는 것을 금지한 이유이다."]],"w":"3번에서 악의적인 댓글이 문제라고 했고, 4번은 그래서 웹사이트들이 댓글을 못 남기게 했다는 결과예요. ban = 금지하다.","c":2},"h":"d8cdc178b1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most of the comments are not harmful, and many are even encouraging.)","ko":"대부분의 댓글은 해롭지 않고, 많은 것은 심지어 ( ) 정도이다. (밑줄 친 단어의 뜻은?)","opts":["위험한","지루한","화가 난","힘을 북돋아 주는"],"word":"encouraging","r":{"a":"4) 힘을 북돋아 주는","ev":"10번 문장","s":[[10,"Most of the comments are not harmful, and many are even encouraging.","대부분의 댓글은 해롭지 않고 많은 것은 힘을 북돋아주기까지 해."]],"w":"not harmful(해롭지 않은)이라고 한 뒤 even(심지어)이 붙었으니 해롭지 않은 걸 넘어 좋은 댓글이라는 뜻이에요. encouraging = 힘을 북돋아 주는.","c":4},"h":"bfd547cba9"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAs a result, they can become discouraged and have lower self-esteem.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그 결과, 그들은 좌절하게 되거나 더 낮은 자존감을 가질 수 있어.","opts":["악의적인 댓글들","어린아이들","성인들","웹사이트들"],"r":{"a":"2) 어린아이들","ev":"6~7번 문장","s":[[6,"Andrew: Although these comments could be just jokes, young kids can be hurt by them much more easily than adults.","이러한 댓글이 단지 농담일 수도 있지만, 어린아이들은 그것들로 인해 성인보다 훨씬 더 쉽게 상처받을 수 있어."],[7,"As a result, they can become discouraged and have lower self-esteem.","그 결과, 그들은 좌절하게 되거나 더 낮은 자존감을 가질 수 있어."]],"w":"6번에서 상처받을 수 있는 쪽은 어린아이들(young kids)이에요. 7번의 they는 그 아이들이 좌절하고 자존감이 낮아진다는 뜻이에요. 댓글이 좌절하는 것은 아니에요.","c":2},"h":"fc9ef9588b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Banning all comments stops us from giving positive feedback.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"모든 댓글을 금지하는 것은 우리가 긍정적인 피드백을 주는 것을 막아.","opts":["모든 댓글을 금지하면 긍정적인 피드백이 더 늘어난다.","긍정적인 피드백을 주면 모든 댓글이 금지된다.","모든 댓글을 금지하면 우리가 긍정적인 피드백을 주지 못하게 된다.","우리가 금지한 댓글은 모두 긍정적인 피드백이다."],"r":{"a":"3) 모든 댓글을 금지하면 우리가 긍정적인 피드백을 주지 못하게 된다.","ev":"11번 문장","s":[[11,"Banning all comments stops us from giving positive feedback.","모든 댓글을 금지하는 것은 우리가 긍정적인 피드백을 주는 것을 막아."]],"w":"「stop A from v-ing」는 'A가 ~하는 것을 막다'라서 stops us from giving positive feedback은 '우리가 긍정적인 피드백을 주는 것을 막는다'예요. 금지가 원인이고 피드백을 못 주는 것이 결과예요.","c":3},"h":"3ee2d08023"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["어떤 웹사이트도 어린이들이 올린 영상에 댓글을 금지하지 않았다.","아이들은 온라인에 영상을 거의 올리지 않는다.","악의적인 댓글은 어른들의 영상에만 올라온다.","많은 아이들이 영상을 만들어 온라인에 올린다."],"opts":["No websites have banned comments on videos posted by children.","Kids hardly ever post videos online.","Hateful comments are posted only on adults’ videos.","Many kids create videos and post them online."],"r":{"a":"4) Many kids create videos and post them online. (많은 아이들이 영상을 만들어 온라인에 올린다.)","ev":"1번 문장","s":[[1,"Nowadays, many kids are creating videos and posting them online.","오늘날, 많은 아이들이 영상을 만들어 온라인에 올리고 있다."]],"w":"1번 문장에서 오늘날 많은 아이들이 영상을 만들어 온라인에 올리고 있다고 해요.","c":4,"k":null},"h":"37582f2fa8"},{"n":9,"t":"sum","q":"Andrew thinks hateful comments can (A) young kids, lower their self-esteem, and even lead to (B).","ko":"Andrew는 악의적인 댓글이 어린아이들에게 상처를 (A)하고, 자존감을 낮추며, 심지어 (B)까지 이를 수 있다고 생각한다.","oko":["(A) 도와준다 / (B) 우울증","(A) 상처를 준다 / (B) 인기","(A) 즐겁게 한다 / (B) 피드백","(A) 무시한다 / (B) 조회 수","(A) 상처를 준다 / (B) 우울증"],"opts":["(A) help / (B) depression","(A) hurt / (B) popularity","(A) amuse / (B) feedback","(A) ignore / (B) hits","(A) hurt / (B) depression"],"r":{"a":"5) (A) hurt / (B) depression","ev":"6~8번 문장","s":[[6,"Andrew: Although these comments could be just jokes, young kids can be hurt by them much more easily than adults.","이러한 댓글이 단지 농담일 수도 있지만, 어린아이들은 그것들로 인해 성인보다 훨씬 더 쉽게 상처받을 수 있어."],[7,"As a result, they can become discouraged and have lower self-esteem.","그 결과, 그들은 좌절하게 되거나 더 낮은 자존감을 가질 수 있어."],[8,"In extreme cases, they may even experience depression.","극단적인 경우에, 그들은 심지어 우울증을 겪을 수도 있어."]],"w":"6번에서 어린아이들은 댓글에 상처받을 수 있다(hurt)고 하고, 8번에서 극단적인 경우 우울증(depression)까지 겪을 수 있다고 해요.","c":5},"h":"55e307e057"},{"n":10,"t":"fill","q":"Without comments, kids lose the [A] to improve their content and find it hard to know how to make videos [B].","ko":"댓글이 없으면 아이들은 콘텐츠를 개선할 [A]을(를) 잃고, 영상을 어떻게 [B] 만들지 알기 어렵다.","bank":["opportunity","better","jokes","banned","adults","millions"],"bko":{"opportunity":"기회","better":"더 좋게","jokes":"농담","banned":"금지했다(ban의 과거형)","adults":"성인","millions":"수백만"},"r":{"a":"[A] opportunity (기회), [B] better (더 좋게)","ev":"12~13번 문장","s":[[12,"For kids, this means they lose the opportunity to improve their content.","아이들에게, 이것은 그들의 콘텐츠를 개선할 기회를 잃는 것을 의미해."],[13,"It is difficult for them to know what people like or how to make their videos better.","그들이 사람들이 무엇을 좋아하는지 또는 그들의 영상을 어떻게 더 좋게 만들지 아는 것은 어려워."]],"w":"12~13번 문장은 댓글이 없으면 아이들이 콘텐츠를 개선할 기회(opportunity)를 잃고 영상을 어떻게 더 좋게(better) 만들지 알기 어렵다는 뜻이에요.","c":null,"k":null},"h":"78fa6de26f"}]},{"u":5,"id":"hk3-05-3","no":3,"ko":"무덤까지 들고 간 비밀","items":[{"n":1,"t":"tf","q":"Dr. James Barry was a British surgeon who served in the army.","ko":"James Barry 박사는 군대에서 복무한 영국의 외과 의사였다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Dr. James Barry was a famous British surgeon who served in the army in the 19th century.","James Barry 박사는 19세기에 군대에서 복무한 영국의 유명한 외과 의사였다."]],"w":"1번 문장에서 James Barry 박사는 19세기에 군대에서 복무한 영국의 유명한 외과 의사였다고 해요. 글의 내용과 같아요.","c":"T"},"h":"2908185b4c"},{"n":2,"t":"tf","q":"Bulkley entered medical school under her own name.","ko":"Bulkley는 자신의 이름으로 의과 대학에 입학했다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"She took her dead uncle’s name and dressed up like a man.","그녀는 죽은 삼촌의 이름을 썼고 남자처럼 옷을 입었다."]],"w":"9번 문장에서 Bulkley는 죽은 삼촌의 이름(her dead uncle’s name)을 쓰고 남자처럼 옷을 입었어요. 자기 이름이 아니에요.","c":"F"},"h":"de4b4a1eb5"},{"n":3,"t":"tf","q":"Bulkley became the second-highest medical officer in the army.","ko":"Bulkley는 군대에서 두 번째로 높은 군의관이 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"She eventually became the second-highest medical officer in the army.","그녀는 결국 군대에서 두 번째로 가장 높은 군의관이 되었다."]],"w":"12번 문장에서 그녀는 결국 군대에서 두 번째로 가장 높은 군의관(the second-highest medical officer)이 되었다고 해요. 글의 내용과 같아요.","c":"T"},"h":"48a35a2b38"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (After his death, it was revealed that Dr. James Barry was not a man but a woman!)","ko":"그의 죽음 이후, James Barry 박사가 남자가 아니라 여자였다는 것이 ( ). (밑줄 친 단어의 뜻은?)","opts":["숨겨졌다","밝혀졌다","잊혀졌다","금지되었다"],"word":"revealed","r":{"a":"2) 밝혀졌다","ev":"4~5번 문장","s":[[4,"For his entire professional life, however, he kept a great secret.","그러나, 그의 직업 생활 내내, 그는 큰 비밀을 간직했다."],[5,"After his death, it was revealed that Dr. James Barry was not a man but a woman!","그의 죽음 이후, James Barry 박사가 남자가 아니라 여자였다는 것이 밝혀졌다!"]],"w":"4번에서 오랫동안 큰 비밀을 간직했다고 했고, 5번은 죽은 뒤에야 그 비밀이 알려졌다는 뜻이에요. reveal = 밝히다, 드러내다.","c":2},"h":"cad9e78fe6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Her life shows that women are just as capable as men.)","ko":"그녀의 삶은 여자들도 남자들만큼 ( ) 것을 보여준다. (밑줄 친 단어의 뜻은?)","opts":["유능한","약한","느린","조용한"],"word":"capable","r":{"a":"1) 유능한","ev":"12~13번 문장","s":[[12,"She eventually became the second-highest medical officer in the army.","그녀는 결국 군대에서 두 번째로 가장 높은 군의관이 되었다."],[13,"Her life shows that women are just as capable as men.","그녀의 삶은 여자들도 남자들만큼 유능하다는 것을 보여준다."]],"w":"여자인 Bulkley가 군대에서 두 번째로 높은 군의관까지 되었으니, 여자도 남자만큼 해낼 수 있다는 뜻이에요. capable = 유능한.","c":1},"h":"4c1e582c0c"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nOne of them was promoting the importance of sanitation in hospitals.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그것들 중 하나는 병원에서의 공중위생의 중요성을 알린 것이었다.","opts":["병원들","군대의 의사들","그의 직업적인 공들","여자 의사들"],"r":{"a":"3) 그의 직업적인 공들","ev":"2~3번 문장","s":[[2,"He made many professional contributions during his career.","그의 경력 동안 그는 많은 직업적인 공을 세웠다."],[3,"One of them was promoting the importance of sanitation in hospitals.","그것들 중 하나는 병원에서의 공중위생의 중요성을 알린 것이었다."]],"w":"One of them은 '그것들 중 하나'예요. 바로 앞 2번에서 많은 공을 세웠다(made many professional contributions)고 했으니, them은 그 공들(contributions)이에요.","c":3},"h":"230fd8d083"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, Bulkley would not give up her dream.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, Bulkley는 꿈을 포기하려 하지 않았다.","opts":["하지만 Bulkley는 자신의 꿈을 포기하려 하지 않았다.","하지만 Bulkley는 꿈을 포기하기로 결심했다.","하지만 Bulkley는 의사가 될 수 있다고 믿지 않았다.","하지만 Bulkley는 다른 사람에게 꿈을 양보했다."],"r":{"a":"1) 하지만 Bulkley는 자신의 꿈을 포기하려 하지 않았다.","ev":"7~8번 문장","s":[[7,"She wanted to become a doctor, but women were not allowed to study medicine at the time.","그녀는 의사가 되고 싶었지만, 그 당시에 여자들은 의학을 공부하도록 허락되지 않았다."],[8,"However, Bulkley would not give up her dream.","하지만, Bulkley는 꿈을 포기하려 하지 않았다."]],"w":"would not give up은 '포기하려 하지 않았다'예요. 7번에서 여자는 의학 공부가 허락되지 않았지만, 8번의 However(하지만)로 꿈을 포기하지 않았다고 이어져요.","c":1},"h":"c36c03fe7a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Bulkley는 여자로서 의과 대학에 입학했다.","Bulkley는 학위를 받은 다음 해에 군대에 입대했다.","Bulkley는 1812년에 군대에 입대했다.","James Barry 박사는 살아 있는 동안 여자라는 것이 밝혀졌다."],"opts":["Bulkley entered medical school as a woman.","Bulkley joined the army the year after she got her degree.","Bulkley joined the army in 1812.","Dr. James Barry was revealed to be a woman while he was alive."],"r":{"a":"2) Bulkley joined the army the year after she got her degree. (Bulkley는 학위를 받은 다음 해에 군대에 입대했다.)","ev":"11번 문장","s":[[11,"She got her degree in 1812, and she joined the army as a doctor the next year.","그녀는 1812년에 학위를 받았고, 그다음 해에 의사로 군대에 입대했다."]],"w":"11번 문장에서 1812년에 학위를 받고 그다음 해에 의사로 군대에 입대했다고 해요.","c":2,"k":null},"h":"d8442390c0"},{"n":9,"t":"sum","q":"Margaret Bulkley wanted to become a (A), but women (B) to study medicine at that time.","ko":"Margaret Bulkley는 (A)이/가 되고 싶었지만, 그 당시 여자들은 의학을 공부하도록 (B).","oko":["(A) 교사 / (B) 허락되지 않았다","(A) 의사 / (B) 격려받았다","(A) 군인 / (B) 요구받았다","(A) 의사 / (B) 허락되지 않았다","(A) 간호사 / (B) 초대받았다"],"opts":["(A) teacher / (B) were not allowed","(A) doctor / (B) were encouraged","(A) soldier / (B) were required","(A) doctor / (B) were not allowed","(A) nurse / (B) were invited"],"r":{"a":"4) (A) doctor / (B) were not allowed","ev":"7번 문장","s":[[7,"She wanted to become a doctor, but women were not allowed to study medicine at the time.","그녀는 의사가 되고 싶었지만, 그 당시에 여자들은 의학을 공부하도록 허락되지 않았다."]],"w":"7번에서 그녀는 의사가 되고 싶었지만(wanted to become a doctor), 그 당시 여자들은 의학을 공부하도록 허락되지 않았다(were not allowed)고 해요.","c":4},"h":"d141783ee6"},{"n":10,"t":"fill","q":"For his entire [A] life, however, he kept a great [B].","ko":"그러나, 그의 [A] 생활 내내, 그는 큰 [B]을(를) 간직했다.","bank":["professional","secret","revealed","promoting","joined","dressed"],"bko":{"professional":"직업적인","secret":"비밀","revealed":"밝혀졌다(reveal의 과거분사)","promoting":"알리는(promote의 -ing형)","joined":"입대했다(join의 과거형)","dressed":"옷을 입었다(dress의 과거형)"},"r":{"a":"[A] professional (직업적인), [B] secret (비밀)","ev":"4번 문장","s":[[4,"For his entire professional life, however, he kept a great secret.","그러나, 그의 직업 생활 내내, 그는 큰 비밀을 간직했다."]],"w":"4번 문장은 직업 생활 내내(professional life) 큰 비밀(secret)을 간직했다는 뜻이에요.","c":null,"k":null},"h":"e0cb4f5e8f"}]},{"u":5,"id":"hk3-05-4","no":4,"ko":"할 수 있어요, 함께라면","items":[{"n":1,"t":"tf","q":"In Pandemic, everyone has to work together to prevent diseases from spreading.","ko":"‘팬데믹’ 게임에서 모두가 질병이 퍼지는 것을 막기 위해 협업해야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Each player picks a role, and everyone has to work together to prevent four diseases from spreading across the world.","각각의 참가자는 역할을 고르고, 모두가 네 가지 질병이 전 세계로 퍼지는 것을 막기 위해 협업해야 한다."]],"w":"2번 문장에서 모두가 네 가지 질병이 전 세계로 퍼지는 것을 막기 위해 협업해야 한다(has to work together)고 해요. 글의 내용과 같아요.","c":"T"},"h":"3c270a54d1"},{"n":2,"t":"tf","q":"Most pandemics come from viruses that infect only animals.","ko":"대부분의 팬데믹은 동물만 감염시키는 바이러스에서 비롯된다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Most pandemics originate from viruses that infect both animals and humans.","대부분의 팬데믹은 동물과 인간 모두를 감염시키는 바이러스에서 비롯된다."]],"w":"5번 문장에서 대부분의 팬데믹은 동물과 인간 모두(both animals and humans)를 감염시키는 바이러스에서 비롯된다고 해요. 동물만이라는 말은 틀려요.","c":"F"},"h":"5dec79156b"},{"n":3,"t":"tf","q":"The swine flu was declared a pandemic in 2009.","ko":"돼지 독감은 2009년에 팬데믹으로 선언되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"It was declared a pandemic by the World Health Organization (WHO) in 2009.","그것은 2009년에 세계보건기구(WHO)에 의해 팬데믹으로 선언되었다."]],"w":"7번 문장에서 돼지 독감은 2009년에 세계보건기구에 의해 팬데믹으로 선언되었다고 해요. 글의 내용과 같아요.","c":"T"},"h":"743d2f759c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A pandemic is a disease that spreads across different regions of the world and infects a large proportion of the population.)","ko":"팬데믹은 세계의 여러 지역에 퍼져 인구의 많은 비율을 ( ) 질병이다. (밑줄 친 단어의 뜻은?)","opts":["치료하는","감염시키는","예방하는","발견하는"],"word":"infects","r":{"a":"2) 감염시키는","ev":"4번 문장","s":[[4,"A pandemic is a disease that spreads across different regions of the world and infects a large proportion of the population.","팬데믹은 세계의 여러 지역에 퍼져 인구의 많은 비율을 감염시키는 질병이다."]],"w":"4번은 팬데믹이 무엇인지 설명해요. 퍼지면서 사람들을 병들게 하는 질병이니 infects는 '감염시키다'예요.","c":2},"h":"fd4ba56398"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It was declared a pandemic by the World Health Organization (WHO) in 2009.)","ko":"그것은 2009년에 세계보건기구(WHO)에 의해 팬데믹으로 ( ). (밑줄 친 단어의 뜻은?)","opts":["숨겨졌다","거부당했다","선언되었다","금지되었다"],"word":"declared","r":{"a":"3) 선언되었다","ev":"6~7번 문장","s":[[6,"One example is the swine flu.","한 가지 예시가 돼지 독감이다."],[7,"It was declared a pandemic by the World Health Organization (WHO) in 2009.","그것은 2009년에 세계보건기구(WHO)에 의해 팬데믹으로 선언되었다."]],"w":"6번에서 돼지 독감을 예로 들고, 7번에서 WHO가 그것을 팬데믹이라고 공식적으로 알렸다는 뜻이에요. declare = 선언하다, was declared = 선언되었다.","c":3},"h":"114670e733"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis allowed doctors around the world to treat patients quickly and effectively.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 전 세계의 의사들이 환자를 빠르고 효과적으로 치료하도록 했다.","opts":["돼지 독감","세계보건기구의 선언","환자들의 빠른 회복","국가들이 정보를 공유하고 백신을 개발한 것"],"r":{"a":"4) 국가들이 정보를 공유하고 백신을 개발한 것","ev":"8~9번 문장","s":[[8,"After that, countries cooperated to share information about the virus and develop a vaccine.","그 이후, 국가들은 그 바이러스에 대한 정보를 공유하고 백신을 개발하기 위해 협력했다."],[9,"This allowed doctors around the world to treat patients quickly and effectively.","이것은 전 세계의 의사들이 환자를 빠르고 효과적으로 치료하도록 했다."]],"w":"9번의 This는 바로 앞 8번 내용이에요. 국가들이 협력해서 바이러스 정보를 공유하고 백신을 개발한 것 덕분에 의사들이 환자를 빠르게 치료할 수 있었어요.","c":4},"h":"e8bdb2ac7a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Just like in the game, the entire world has put its differences aside to fight the pandemic.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마치 그 게임에서처럼, 전 세계가 그 팬데믹과 맞서 싸우기 위해 차이점을 제쳐두었다.","opts":["게임에서처럼, 전 세계가 팬데믹과 싸우기 위해 서로의 차이를 제쳐두었다.","게임과 달리, 세계는 서로의 차이 때문에 팬데믹 앞에서도 싸웠다.","게임에서처럼, 전 세계가 팬데믹을 이기려고 새로운 규칙을 만들었다.","게임을 그만두고 전 세계가 팬데믹을 피해 도망쳤다."],"r":{"a":"1) 게임에서처럼, 전 세계가 팬데믹과 싸우기 위해 서로의 차이를 제쳐두었다.","ev":"11번 문장","s":[[11,"Just like in the game, the entire world has put its differences aside to fight the pandemic.","마치 그 게임에서처럼, 전 세계가 그 팬데믹과 맞서 싸우기 위해 차이점을 제쳐두었다."]],"w":"Just like in the game은 '게임에서처럼'이고, put its differences aside는 '차이점을 제쳐두다'예요. to fight the pandemic은 '팬데믹과 맞서 싸우기 위해'라는 목적이에요.","c":1},"h":"44f9ffbc3c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["팬데믹은 한 나라 안에서만 퍼지는 질병이다.","팬데믹은 인구의 아주 작은 부분만 감염시키는 질병이다.","실제 팬데믹이 발생하면, 전 세계 국가들은 같은 방식으로 대응한다.","팬데믹은 동물만 걸릴 수 있는 질병이다."],"opts":["A pandemic is a disease that spreads only inside one country.","A pandemic is a disease that infects only a small part of the population.","When real pandemics occur, countries around the world react in the same way.","A pandemic is a disease that only animals can get."],"r":{"a":"3) When real pandemics occur, countries around the world react in the same way. (실제 팬데믹이 발생하면, 전 세계 국가들은 같은 방식으로 대응한다.)","ev":"3번 문장","s":[[3,"When real pandemics occur, countries around the world react in the same way.","실제 팬데믹이 발생하면, 전 세계의 국가들은 같은 방식으로 대응한다."]],"w":"3번 문장에서 실제 팬데믹이 발생하면 전 세계 국가들이 같은 방식으로 대응한다고 해요.","c":3,"k":null},"h":"f7fa5986f5"},{"n":9,"t":"sum","q":"In the board game Pandemic, players must (A) rather than (B).","ko":"‘팬데믹’이라는 보드게임에서, 참가자들은 (B)하기보다는 (A)해야 한다.","oko":["A 협력 …… / B 경쟁","A 경쟁 …… / B 협력","A 협력 …… / B 잠자기","A 다투기 …… / B 경쟁","A 잠자기 …… / B 협력"],"opts":["(A) cooperate / (B) compete","(A) compete / (B) cooperate","(A) cooperate / (B) sleep","(A) argue / (B) compete","(A) sleep / (B) cooperate"],"r":{"a":"1) (A) cooperate / (B) compete (A 협력 …… / B 경쟁)","ev":"1번 문장","s":[[1,"In the board game Pandemic, players must cooperate rather than compete.","‘팬데믹’이라는 보드게임에서, 참가자들은 경쟁하기보다는 협력해야 한다."]],"w":"1번 문장에서 참가자들은 경쟁하기(compete)보다는 협력해야(cooperate) 한다고 해요.","c":1,"k":null},"h":"ba295d0d6a"},{"n":10,"t":"fill","q":"Recently, countries have [A] the [B] coronavirus disease-2019 (COVID-19).","ko":"최근에, 국가들은 [B] 코로나바이러스 감염증 2019(코로나19)와 [A].","bank":["battled","worldwide","vaccine","region","population","virus"],"bko":{"battled":"싸웠다(battle의 과거분사)"," extra plates for all the guests.","그것은 조금 이상했지만, 나는 그가 모든 손님들을 위한 여분의 접시가 필요하다고 생각했다."]],"w":"3번에서 파티에 접시를 가져오라는 말이 나왔어요. 보통은 접시를 가져가지 않으니 조금 이상하다고 느낀 거예요. 뒤의 but으로 이어지는 것도 맞아요. odd = 이상한.","c":2},"h":"850b644ba9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The ground became a mess, but everyone was smiling happily.)","ko":"바닥은 ( )이/가 되었지만, 모두가 행복하게 미소를 짓고 있었다. (밑줄 친 단어의 뜻은?)","opts":["선물","정원","무대","난장판"],"word":"mess","r":{"a":"4) 난장판","ev":"5~6번 문장","s":[[5,"However, once the party started, everyone gathered together and suddenly threw their dishes on the ground!","하지만, 파티가 시작되자마자, 모두 함께 모여 갑자기 접시를 바닥에 던졌다!"],[6,"The ground became a mess, but everyone was smiling happily.","바닥은 난장판이 되었지만, 모두가 행복하게 미소를 짓고 있었다."]],"w":"5번에서 모두가 접시를 바닥에 던졌으니 바닥은 어지럽고 지저분해졌겠죠. 뒤의 but으로 모두가 웃고 있다고 대조돼요. mess = 난장판.","c":4},"h":"4879aa7b53"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nGermans do this because of the old saying, “Shards bring luck.”","ko":"밑줄 친 this가 가리키는 것은?","sko":"독일인들은 ‘조각들이 행운을 가져온다.’라는 옛말 때문에 이것을 한다.","opts":["파티에 접시를 가져가는 것","결혼식을 올리는 것","결혼식 전날 밤에 접시를 부수는 것","거울을 깨지 않는 것"],"r":{"a":"3) 결혼식 전날 밤에 접시를 부수는 것","ev":"9~10번 문장","s":[[9,"This event is called Polterabend, a wedding tradition in Germany.","이 행사는 독일의 결혼식 전통인 ‘Polterabend’라고 불리는 것이었다."],[10,"Germans do this because of the old saying, “Shards bring luck.”","독일인들은 ‘조각들이 행운을 가져온다.’라는 옛말 때문에 이것을 한다."]],"w":"10번의 this는 독일인들이 하는 일이고, 그 이유가 '조각들이 행운을 가져온다'예요. 9번의 This event(Polterabend)와 7번에서 본 접시를 부수는 일을 가리켜요.","c":3},"h":"5353fdcd1d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"I was invited to his house for a party the night before the wedding.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"나는 결혼식 전날 밤 파티를 위해 그의 집에 초대를 받았다.","opts":["나는 결혼식 전날 밤에 그의 집에서 열리는 파티에 초대를 받았다.","나는 결혼식이 끝난 다음 날 아침에 그의 집에 초대를 받았다.","나는 결혼식 전날 밤에 파티를 열어 그를 초대했다.","나는 파티에 초대를 받았지만 결혼식 전날 밤에는 가지 못했다."],"r":{"a":"1) 나는 결혼식 전날 밤에 그의 집에서 열리는 파티에 초대를 받았다.","ev":"2번 문장","s":[[2,"I was invited to his house for a party the night before the wedding.","나는 결혼식 전날 밤 파티를 위해 그의 집에 초대를 받았다."]],"w":"2번에서 필자는 결혼식 전날 밤 파티를 위해 Karl의 집에 초대를 받았어요.","c":1},"h":"bce4e7fce9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["필자가 홈스테이를 하는 동안 집주인의 사촌인 Karl이 결혼식을 올렸다.","Karl은 필자의 사촌이었고 학교에서 결혼식을 올렸다.","Karl은 필자의 홈스테이가 시작되기 전에 결혼식을 올렸다.","필자는 오직 Karl의 결혼식에 가기 위해 홈스테이를 갔다."],"opts":["The writer was on a homestay when Karl, the host’s cousin, had a wedding.","Karl was the writer’s cousin and had a wedding at school.","Karl had a wedding before the writer’s homestay started.","The writer went on a homestay only to go to Karl’s wedding."],"r":{"a":"1) The writer was on a homestay when Karl, the host’s cousin, had a wedding. (필자가 홈스테이를 하는 동안 집주인의 사촌인 Karl이 결혼식을 올렸다.)","ev":"1번 문장","s":[[1,"During my homestay in Germany, my host’s cousin Karl had a wedding.","독일에서의 홈스테이 기간 동안, 집주인의 사촌인 Karl이 결혼식을 올렸다."]],"w":"1번에서 필자의 홈스테이 기간에 집주인의 사촌 Karl이 결혼식을 올렸다고 해요.","c":1},"h":"13b4cca427"},{"n":9,"t":"sum","q":"Polterabend is a wedding (A) in (B).","ko":"Polterabend는 (B)의 결혼식 (A)이다.","oko":["(A) 게임 / (B) 독일","(A) 전통 / (B) 스페인","(A) 노래 / (B) 프랑스","(A) 음식 / (B) 스페인","(A) 전통 / (B) 독일"],"opts":["(A) game / (B) Germany","(A) tradition / (B) Spain","(A) song / (B) France","(A) food / (B) Spain","(A) tradition / (B) Germany"],"r":{"a":"5) (A) tradition / (B) Germany ((A) 전통 / (B) 독일)","ev":"9번 문장","s":[[9,"This event is called Polterabend, a wedding tradition in Germany.","이 행사는 독일의 결혼식 전통인 ‘Polterabend’라고 불리는 것이었다."]],"w":"9번에서 Polterabend는 독일의 결혼식 전통(a wedding tradition in Germany)이라고 해요.","c":5},"h":"5be82b4847"},{"n":10,"t":"fill","q":"However, once the party started, everyone [A] together and suddenly [B] their dishes on the ground!","ko":"하지만, 파티가 시작되자마자, 모두 함께 [A] 갑자기 접시를 바닥에 [B]!","bank":["gathered","threw","invited","called","became","needed"],"bko":{"gathered":"모였다(gather의 과거)","threw":"던졌다(throw의 과거)","invited":"초대했다(invite의 과거)","call
