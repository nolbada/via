<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"hk1-01-1","no":1,"ko":"민트와 초코는 환상의 짝꿍","items":[{"n":1,"t":"tf","q":"Marilyn studied music at South Devon College.","ko":"Marilyn은 South Devon 대학에서 음악을 공부했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"She was studying cooking at South Devon College.","그녀는 South Devon 대학에서 요리를 공부하고 있었다."]],"w":"5번 문장에서 Marilyn은 South Devon 대학에서 요리(cooking)를 공부하고 있었다고 해요. 음악이 아니에요.","c":"F"},"h":"6f6bde42c2"},{"n":2,"t":"tf","q":"The royal family held a competition to find the best dessert.","ko":"영국 왕실은 최고의 디저트를 찾기 위해 대회를 열었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The family wanted to provide the best dessert for the celebration, so they held a competition.","왕실은 축하 행사를 위한 최고의 디저트를 제공하기를 원해서, 대회를 열었다."]],"w":"3번 문장에서 왕실은 축하 행사를 위한 최고의 디저트를 원해서 대회를 열었어요.","c":"T"},"h":"9433a423c9"},{"n":3,"t":"tf","q":"Mint Royale lost the contest, but it became popular later.","ko":"Mint Royale은 대회에서 졌지만, 나중에 인기를 얻었다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Marilyn eventually won the contest with Mint Royale, and it became the main dessert for the wedding.","Marilyn은 마침내 Mint Royale로 대회에서 우승했고, 그것은 결혼식의 주요 디저트가 되었다."]],"w":"9번 문장에서 Marilyn은 Mint Royale로 대회에서 우승했고, 그것은 결혼식의 주요 디저트가 되었어요. 졌다는 말은 반대예요.","c":"F"},"h":"b292154a1e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The family wanted to provide the best dessert ...)","ko":"왕실은 최고의 디저트를 제공하기를 원했다. (provide는 제공하다)","opts":["숨기다","제공하다","거절하다","주문하다"],"word":"provide","r":{"a":"2) 제공하다","ev":"3번 문장","s":[[3,"The family wanted to provide the best dessert for the celebration, so they held a competition.","왕실은 축하 행사를 위한 최고의 디저트를 제공하기를 원해서, 대회를 열었다."]],"w":"왕실은 축하 행사에 쓸 최고의 디저트를 마련하고 싶어 했어요. provide는 '제공하다'예요.","c":2},"h":"d71ea45231"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Marilyn eventually won the contest ...)","ko":"Marilyn은 마침내 대회에서 우승했다.","opts":["갑자기","가끔","거의","마침내"],"word":"eventually","r":{"a":"4) 마침내","ev":"9번 문장","s":[[9,"Marilyn eventually won the contest with Mint Royale, and it became the main dessert for the wedding.","Marilyn은 마침내 Mint Royale로 대회에서 우승했고, 그것은 결혼식의 주요 디저트가 되었다."]],"w":"새로운 디저트를 고민하던 Marilyn이 결국 대회에서 우승했다는 흐름이에요. eventually는 '마침내, 결국'이에요.","c":4},"h":"d05cd28d6e"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nMarilyn eventually won the contest with Mint Royale, and it became the main dessert for the wedding.","ko":"밑줄 친 it이 가리키는 것은?","sko":"Marilyn은 마침내 Mint Royale로 대회에서 우승했고, 그것은 결혼식의 주요 디저트가 되었다.","opts":["Mint Royale 아이스크림","대회","Marilyn Ricketts","South Devon 대학"],"r":{"a":"1) Mint Royale 아이스크림","ev":"7번, 9번 문장","s":[[7,"So she created an ice cream called Mint Royale.","그래서 그녀는 Mint Royale이라고 불리는 아이스크림을 만들어 냈다."],[9,"Marilyn eventually won the contest with Mint Royale, and it became the main dessert for the wedding.","Marilyn은 마침내 Mint Royale로 대회에서 우승했고, 그것은 결혼식의 주요 디저트가 되었다."]],"w":"결혼식의 주요 디저트가 된 것은 사람이나 대회가 아니라 아이스크림이에요. 7번의 Mint Royale을 9번에서 it으로 받았어요.","c":1},"h":"3a0bbadd9e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now, mint chocolate is one of the most popular flavors.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오늘날, 민트 초콜릿은 가장 인기 있는 맛 중 하나이다.","opts":["민트 초콜릿은 한 가지 맛만 있는 아이스크림이다.","민트 초콜릿은 요즘 거의 팔리지 않는 맛이다.","민트 초콜릿은 가장 인기 있는 맛들 중 하나이다.","민트 초콜릿은 가장 인기 있는 단 하나의 맛이다."],"r":{"a":"3) 민트 초콜릿은 가장 인기 있는 맛들 중 하나이다.","ev":"10번 문장","s":[[10,"Now, mint chocolate is one of the most popular flavors.","오늘날, 민트 초콜릿은 가장 인기 있는 맛 중 하나이다."]],"w":"one of the most popular flavors는 '가장 인기 있는 맛들 중 하나'예요. 4번처럼 '단 하나'라는 뜻이 아니에요.","c":3},"h":"e26b29dfe5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["왕실은 생일 파티를 위해 Marilyn의 디저트를 골랐다.","Marilyn의 아이스크림은 Anne 공주의 결혼식의 주요 디저트가 되었다.","Marilyn은 초콜릿 케이크를 만들어 대회에 나갔다.","Marilyn은 대회에서 졌지만 그녀의 아이스크림은 인기를 얻었다."],"opts":["The royal family chose Marilyn's dessert for a birthday party.","Marilyn's ice cream became the main dessert for Princess Anne's wedding.","Marilyn made a chocolate cake for the contest.","Marilyn lost the contest, but her ice cream became popular."],"r":{"a":"2) Marilyn's ice cream became the main dessert for Princess Anne's wedding.","ev":"2번, 9번 문장","s":[[2,"It was Princess Anne’s wedding.","그것은 Anne 공주의 결혼식이었다."],[9,"Marilyn eventually won the contest with Mint Royale, and it became the main dessert for the wedding.","Marilyn은 마침내 Mint Royale로 대회에서 우승했고, 그것은 결혼식의 주요 디저트가 되었다."]],"w":"9번에서 Mint Royale은 결혼식의 주요 디저트가 되었고, 2번에서 그 결혼식은 Anne 공주의 결혼식이에요. 생일 파티도, 케이크도 아니고(2번, 7번), 대회에서 졌다는 말도 없어요(9번).","c":2},"h":"2fe57f15b2"},{"n":9,"t":"sum","q":"Marilyn Ricketts created Mint Royale for a (A) held by the royal family. She (B) the contest, and the ice cream became the main dessert for the wedding.","ko":"Marilyn Ricketts는 왕실이 연 (A)를 위해 Mint Royale을 만들어 냈다. 그녀는 대회를 (B), 그 아이스크림은 결혼식의 주요 디저트가 되었다.","oko":["(A) 휴일 / (B) 우승했고","(A) 대회 / (B) 졌고","(A) 수업 / (B) 졌고","(A) 휴일 / (B) 참가했고","(A) 대회 / (B) 우승했고"],"opts":["(A) holiday / (B) won","(A) competition / (B) lost","(A) lesson / (B) lost","(A) holiday / (B) joined","(A) competition / (B) won"],"r":{"a":"5) (A) competition / (B) won","ev":"3번, 4번, 7번, 9번 문장","s":[[3,"The family wanted to provide the best dessert for the celebration, so they held a competition.","왕실은 축하 행사를 위한 최고의 디저트를 제공하기를 원해서, 대회를 열었다."],[4,"In this contest, a young student named Marilyn Ricketts participated.","이 대회에는, Marilyn Ricketts라는 한 젊은 학생이 참가했다."],[7,"So she created an ice cream called Mint Royale.","그래서 그녀는 Mint Royale이라고 불리는 아이스크림을 만들어 냈다."],[9,"Marilyn eventually won the contest with Mint Royale, and it became the main dessert for the wedding.","Marilyn은 마침내 Mint Royale로 대회에서 우승했고, 그것은 결혼식의 주요 디저트가 되었다."]],"w":"3~4번에서 왕실이 대회(competition)를 열었고 Marilyn이 참가했어요. 7번에서 Mint Royale을 만들었고, 9번에서 우승했어요(won). 'lost'는 반대 내용이에요.","c":5},"h":"5ea25a4cf6"},{"n":10,"t":"fill","q":"Mint Royale was the first ice cream with a [A] of mint and chocolate, and now mint chocolate is one of the most [B] flavors.","ko":"Mint Roya 문장","s":[[7,"Then, gently tap the left side and then the right.","그 다음, (흉부나 어깨의) 왼편과 오른편을 부드럽게 두드려라."]],"w":"마음을 달래는 동작이니 세게 치지 않아요. gently는 '부드럽게'예요.","c":3},"h":"11bc76b6cb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You can stop and relax when you start to feel some relief.)","ko":"안도감을 느끼기 시작할 때 멈추고 휴식을 취하면 된다.","opts":["걱정","안도감","피곤함","화남"],"word":"relief","r":{"a":"2) 안도감","ev":"10번 문장","s":[[10,"You can stop and relax when you start to feel some relief.","당신이 안도감을 느끼기 시작할 때 멈추고 휴식을 취하면 된다."]],"w":"허그의 목적은 불안을 줄이는 것이에요. 그래서 편안해지는 느낌, 즉 relief는 '안도감'이에요.","c":2},"h":"ff1218858d"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nYou can also place them on each shoulder if you want.","ko":"밑줄 친 them이 가리키는 것은?","sko":"당신이 원한다면 손을 각 어깨에 둘 수도 있다.","opts":["어깨","가슴","나비의 날개","당신의 손"],"r":{"a":"4) 당신의 손","ev":"5번, 6번 문장","s":[[5,"First, cross your hands and place them on your chest.","먼저, 당신의 손을 교차시켜서 흉부에 두어라."],[6,"You can also place them on each shoulder if you want.","당신이 원한다면 손을 각 어깨에 둘 수도 있다."]],"w":"5번에서 cross your hands and place them on your chest라고 했고, 6번에서 같은 them을 어깨에 둘 수도 있다고 해요. them = your hands예요.","c":4},"h":"6afc510813"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This simple self-hug will make your stress go away in just a few minutes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 간단한 셀프 허그는 단 몇 분 만에 당신의 스트레스가 사라지도록 만들 것이다.","opts":["이 간단한 셀프 허그는 단 몇 분 만에 스트레스를 사라지게 해 줄 것이다.","이 셀프 허그는 몇 시간을 해야 스트레스가 사라진다.","이 간단한 허그는 다른 사람과 함께 할 때만 스트레스를 없애 준다.","이 허그는 몇 분 동안 스트레스를 더 키울 것이다."],"r":{"a":"1) 이 간단한 셀프 허그는 단 몇 분 만에 스트레스를 사라지게 해 줄 것이다.","ev":"11번 문장","s":[[11,"This simple self-hug will make your stress go away in just a few minutes.","이 간단한 셀프 허그는 단 몇 분 만에 당신의 스트레스가 사라지도록 만들 것이다."]],"w":"make your stress go away는 스트레스가 사라지게 만든다는 뜻이고, in just a few minutes는 단 몇 분 안에라는 뜻이에요. self-hug는 혼자 하는 허그예요.","c":1},"h":"fe0592a080"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["한 손으로만 가슴을 한 번 치고 멈춘다.","친구의 어깨를 두드리며 숨을 참는다.","왼편과 오른편을 두드리며 심호흡을 한다.","한 시간이 지나기 전에는 멈추면 안 된다."],"opts":["You tap your chest only once with one hand and stop.","You tap a friend's shoulder and hold your breath.","You tap the left and right sides and take deep breaths.","You must not stop before one hour passes."],"r":{"a":"3) You tap the left and right sides and take deep breaths.","ev":"7번, 9번, 10번 문장","s":[[7,"Then, gently tap the left side and then the right.","그 다음, (흉부나 어깨의) 왼편과 오른편을 부드럽게 두드려라."],[9,"While you are doing this, take some deep breaths.","이것을 하고 있는 동안, 심호흡을 해라."],[10,"You can stop and relax when you start to feel some relief.","당신이 안도감을 느끼기 시작할 때 멈추고 휴식을 취하면 된다."]],"w":"7번에서 왼편과 오른편을 번갈아 두드리고, 9번에서 하는 동안 심호흡을 해요. 10번에서 안도감이 들 때 멈추면 되므로 '한 시간'이라는 조건은 없어요.","c":3},"h":"b140a1a615"},{"n":9,"t":"sum","q":"The Butterfly Hug is an easy way to ease (A). You cross your hands on your chest and gently (B) the left and right sides while you take deep breaths.","ko":"버터플라이 허그는 (A)를 줄이는 쉬운 방법이다. 손을 흉부에 교차해 두고 심호흡을 하면서 왼편과 오른편을 부드럽게 (B).","oko":["(A) 분노 / (B) 두드린다","(A) 불안 / (B) 교차시킨다","(A) 배고픔 / (B) 친다","(A) 분노 / (B) 숨긴다","(A) 불안 / (B) 두드린다"],"opts":["(A) anger / (B) tap","(A) anxiety / (B) cross","(A) hunger / (B) hit","(A) anger / (B) hide","(A) anxiety / (B) tap"],"r":{"a":"5) (A) anxiety / (B) tap","ev":"1번, 2번, 5번, 7번, 9번 문장","s":[[1,"If you are feeling upset or stressed, try the Butterfly Hug.","만약 당신이 속상하거나 스트레스를 받는다고 느끼고 있다면, 버터플라이 허그를 시도해 봐라."],[2,"It is an easy and effective technique which can help with your anxiety.","그것은 당신의 불안감에 도움이 될 수 있는 쉽고 효과적인 기법이다."],[5,"First, cross your hands and place them on your chest.","먼저, 당신의 손을 교차시켜서 흉부에 두어라."],[7,"Then, gently tap the left side and then the right.","그 다음, (흉부나 어깨의) 왼편과 오른편을 부드럽게 두드려라."],[9,"While you are doing this, take some deep breaths.","이것을 하고 있는 동안, 심호흡을 해라."]],"w":"1~2번에서 불안(anxiety)에 도움이 되는 기법이라 했고, 5~7번에서 손을 교차해 두고 왼편과 오른편을 부드럽게 두드려요(tap). cross(교차시키다)는 손을 교차하는 동작이지 양쪽 편을 두드리는 동작이 아니에요.","c":5},"h":"0beaf828c4"},{"n":10,"t":"fill","q":"Because you move your hands like the wings of a [A], it is named the Butterfly Hug. You can stop and [B] when you feel some relief.","ko":"당신이 손을 [A]의 날개처럼 움직이기 때문에 버터플라이 허그라고 이름이 지어졌다. 안도감을 느끼면 멈추고 [B]하면 된다.","bank":["butterfly","relax","bird","repeat","hide","tap"],"bko":{"butterfly":"나비","relax":"휴식을 취하다","bird":"새","repeat":"반복하다","hide":"숨기다","tap":"(톡톡) 두드리다"},"r":{"a":"[A] butterfly, [B] relax","ev":"3번, 4번, 10번 문장","s":[[3,"To do it, you move your hands like the wings of a butterfly.","그것을 하기 위해, 당신은 손을 나비의 날개처럼 움직인다."],[4,"This is why it is named the Butterfly Hug.","이것이 버터플라이 허그라고 이름이 지어진 이유이다."],[10,"You can stop and relax when you start to feel some relief.","당신이 안도감을 느끼기 시작할 때 멈추고 휴식을 취하면 된다."]],"w":"3~4번에서 손을 나비(butterfly)의 날개처럼 움직여서 이름이 붙었고, 10번에서 안도감이 들면 멈추고 쉬라(relax)고 해요. repeat은 8번 동작이라 10번의 멈추는 장면과 맞지 않아요.","c":null},"h":"f37c9b6765"}]},{"u":1,"id":"hk1-01-3","no":3,"ko":"숨겨왔던 나의...","items":[{"n":1,"t":"tf","q":"A penguin's legs are about half of its body length.","ko":"펭귄의 다리는 몸길이의 약 절반이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In fact, their legs are about half of their body length!","사실, 그것들의 다리는 몸길이의 약 절반이다!"]],"w":"5번 문장에서 their legs are about half of their body length라고 해요. 겉으로 짧아 보여도 실제로는 길어요.","c":"T"},"h":"f42bf3b2b4"},{"n":2,"t":"tf","q":"Penguins' leg bones are straight, so their legs look short.","ko":"펭귄의 다리뼈는 곧게 뻗어 있어서 다리가 짧아 보인다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Their legs look short because the leg bones are folded at a 90-degree angle.","그것들의 다리는 다리뼈가 90도로 접혀 있기 때문에 짧아 보인다."]],"w":"6번 문장에서 다리뼈가 90도로 접혀 있기(folded) 때문에 짧아 보인다고 해요. 곧게 뻗은 것이 아니에요.","c":"F"},"h":"605e91b168"},{"n":3,"t":"tf","q":"Walking with bent legs helps penguins keep their balance on ice.","ko":"구부러진 다리로 걷는 것은 펭귄이 얼음 위에서 균형을 유지하는 데 도움이 된다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"When penguins walk with their bent legs, they can move only a little with each step.","펭귄은 구부러진 다리로 걸을 때, 걸음마다 조금씩만 움직일 수 있다."],[10,"But on the ice, this is actually helpful for maintaining balance.","하지만 얼음 위에서, 이것은 사실 균형을 유지하는 데 도움이 된다."]],"w":"9번에서 구부러진 다리로 걸음마다 조금씩 움직인다고 했고, 10번에서 얼음 위에서는 이것이 균형을 유지하는 데 도움이 된다고 해요.","c":"T"},"h":"b593b8b34b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... because the leg bones are folded at a 90-degree angle.)","ko":"다리뼈가 90도로 접혀 있기 때문이다.","opts":["부러진","접힌","늘어난","자란"],"word":"folded","r":{"a":"2) 접힌","ev":"6번 문장","s":[[6,"Their legs look short because the leg bones are folded at a 90-degree angle.","그것들의 다리는 다리뼈가 90도로 접혀 있기 때문에 짧아 보인다."]],"w":"다리뼈가 90도로 꺾여 있어서 다리가 짧아 보인다는 흐름이에요. folded는 fold(접다)의 과거분사로 '접힌'이에요.","c":2},"h":"2b2108eabf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That's why penguins don't slip on ice easily.)","ko":"그것이 펭귄이 얼음 위에서 쉽게 미끄러지지 않는 이유이다.","opts":["점프하다","얼다","헤엄치다","미끄러지다"],"word":"slip","r":{"a":"4) 미끄러지다","ev":"11번 문장","s":[[11,"That’s why penguins don’t slip on ice easily.","그것이 펭귄이 얼음 위에서 쉽게 미끄러지지 않는 이유이다."]],"w":"얼음 위에서 균형을 유지하면 넘어지지 않아요. don't slip은 '미끄러지지 않는다'예요.","c":4},"h":"75999398aa"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nBut on the ice, this is actually helpful for maintaining balance.","ko":"밑줄 친 this가 가리키는 것은?","sko":"하지만 얼음 위에서, 이것은 사실 균형을 유지하는 데 도움이 된다.","opts":["구부러진 다리로 걸을 때 걸음마다 조금씩만 움직이는 것","펭귄이 얼음 위에서 사는 것","펭귄이 먹이를 얻으려고 수영하는 것","다리가 몸길이의 절반인 것"],"r":{"a":"1) 구부러진 다리로 걸을 때 걸음마다 조금씩만 움직이는 것","ev":"9번, 10번 문장","s":[[9,"When penguins walk with their bent legs, they can move only a little with each step.","펭귄은 구부러진 다리로 걸을 때, 걸음마다 조금씩만 움직일 수 있다."],[10,"But on the ice, this is actually helpful for maintaining balance.","하지만 얼음 위에서, 이것은 사실 균형을 유지하는 데 도움이 된다."]],"w":"this는 바로 앞 9번의 내용, 즉 구부러진 다리로 걸을 때 조금씩만 움직이는 것이에요. 그것이 얼음 위에서는 균형 유지에 도움이 돼요.","c":1},"h":"0597237a91"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Therefore, we can only see the bottom part of them.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서, 우리는 다리의 아랫부분만 볼 수 있다.","opts":["그래서 우리는 다리의 윗부분만 볼 수 있다.","그래서 우리는 펭귄의 다리를 전혀 볼 수 없다.","따라서 우리는 다리의 아랫부분만 볼 수 있다.","따라서 우리는 다리의 아랫부분을 볼 수 없다."],"r":{"a":"3) 따라서 우리는 다리의 아랫부분만 볼 수 있다.","ev":"7번, 8번 문장","s":[[7,"Their legs are mostly hidden within their bodies.","그것들의 다리는 주로 몸 안에 숨겨져 있다."],[8,"Therefore, we can only see the bottom part of them.","따라서, 우리는 다리의 아랫부분만 볼 수 있다."]],"w":"7번에서 다리가 대부분 몸 안에 숨겨져 있어서, 8번에서 아랫부분(bottom part)만 볼 수 있다고 해요. 전혀 안 보이는 것도 아니고 윗부분이 보이는 것도 아니에요.","c":3},"h":"d92d36dcab"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["펭귄의 다리 길이는 몸길이의 10분의 1밖에 되지 않는다.","펭귄의 다리는 대부분 몸 안에 숨겨져 있다.","펭귄은 다리가 구부러져 있어서 얼음 위에서 쉽게 미끄러진다.","펭귄은 걸음마다 아주 멀리 움직일 수 있다."],"opts":["Penguins' legs are only one-tenth of their body length.","Most of a penguin's legs are hidden inside its body.","Penguins slip easily on ice because their legs are bent.","Penguins can move very far with each step."],"r":{"a":"2) Most of a penguin's legs are hidden inside its body.","ev":"5번, 7번 문장","s":[[5,"In fact, their legs are about half of their body length!","사실, 그것들의 다리는 몸길이의 약 절반이다!"],[7,"Their legs are mostly hidden within their bodies.","그것들의 다리는 주로 몸 안에 숨겨져 있다."]],"w":"7번에서 펭귄의 다리는 대부분 몸 안에 숨겨져 있다고 해요. 5번에서 다리는 몸길이의 약 절반이고, 구부러진 다리 덕분에 오히려 미끄러지지 않아요(11번).","c":2},"h":"07610e35eb"},{"n":9,"t":"sum","q":"Penguins' legs are (A) than they look. The leg bones are (B) inside the body, so only the lower part can be seen.","ko":"펭귄의 다리는 보이는 것보다 (A). 다리뼈는 몸 안에서 (B) 있어서 아랫부분만 보인다.","oko":["(A) 더 짧다 / (B) 접혀","(A) 더 길다 / (B) 곧게 펴져","(A) 더 짧다 / (B) 부러져","(A) 더 길다 / (B) 얼어","(A) 더 길다 / (B) 접혀"],"opts":["(A) shorter / (B) folded","(A) longer / (B) stretched","(A) shorter / (B) broken","(A) longer / (B) frozen","(A) longer / (B) folded"],"r":{"a":"5) (A) longer / (B) folded","ev":"4번, 6번, 7번, 8번 문장","s":[[4,"However, penguins have quite long legs.","하지만, 펭귄은 꽤 긴 다리를 가지고 있다."],[6,"Their legs look short because the leg bones are folded at a 90-degree angle.","그것들의 다리는 다리뼈가 90도로 접혀 있기 때문에 짧아 보인다."],[7,"Their legs are mostly hidden within their bodies.","그것들의 다리는 주로 몸 안에 숨겨져 있다."],[8,"Therefore, we can only see the bottom part of them.","따라서, 우리는 다리의 아랫부분만 볼 수 있다."]],"w":"4번에서 사실 꽤 긴 다리라고 했고(longer), 6번에서 다리뼈가 접혀(folded) 있다고 했어요. 7~8번에서 그래서 아랫부분만 보여요.","c":5},"h":"6a6eeaea7b"},{"n":10,"t":"fill","q":"Penguins walk with their [A] legs, so they can move only a little with each step, and this helps them keep [B] on ice.","ko":"펭귄은 [A] 다리로 걷기 때문에 걸음마다 조금씩만 움직일 수 있고, 이것은 얼음 위에서 [B]을(를) 유지하는 데 도움이 된다.","bank":["bent","balance","hidden","food","fast","swim"],"bko":{"bent":"구부러진","balance":"균형","food":"먹이","fast":"빠르게","swim":"수영하다","hidden":"숨겨진"},"r":{"a":"[A] bent, [B] balance","ev":"9번, 10번 문장","s":[[9,"When penguins walk with their bent legs, they can move only a little with each step.","펭귄은 구부러진 다리로 걸을 때, 걸음마다 조금씩만 움직일 수 있다."],[10,"But on the ice, this is actually helpful for maintaining balance.","하지만 얼음 위에서, 이것은 사실 균형을 유지하는 데 도움이 된다."]],"w":"9번에서 구부러진(bent) 다리로 걸으면 걸음마다 조금씩만 움직이고, 10번에서 이것이 얼음 위에서 균형(balance)을 유지하는 데 도움이 된다고 해요. hidden은 7번에서 다리가 몸 안에 숨겨져 있다는 말이라 걷는 모습을 설명하는 [A]에 맞지 않아요.","c":null},"h":"86bab4c5b0"}]},{"u":1,"id":"hk1-01-4","no":4,"ko":"베개 휘날리며~","items":[{"n":1,"t":"tf","q":"International Pillow Fight Day is held on the first Saturday of April.","ko":"국제 베개 싸움의 날은 4월의 첫째 주 토요일에 개최된다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"It takes place on the first Saturday of April.","그것은 4월의 첫째 주 토요일에 개최된다."]],"w":"5번 문장에서 It takes place on the first Saturday of April라고 해요. It은 4번의 International Pillow Fight Day예요.","c":"T"},"h":"a1d8541c28"},{"n":2,"t":"tf","q":"You have to pay money to join the event.","ko":"행사에 참가하려면 돈을 내야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Participating in this event is free, but you should bring your own pillow.","이 행사에 참가하는 것은 무료이나, 자신의 베개를 가져와야 한다."]],"w":"6번 문장에서 이 행사에 참가하는 것은 무료(free)라고 해요. 필요한 것은 돈이 아니라 자기 베개예요.","c":"F"},"h":"b368f46450"},{"n":3,"t":"tf","q":"You should not hit people who don't have a pillow.","ko":"베개를 갖고 있지 않은 사람들은 치면 안 된다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"But don’t hit people who don’t have a pillow.","하지만 베개를 갖고 있지 않은 사람들은 치지 말아라."]],"w":"9번 문장에서 But don't hit people who don't have a pillow라고 해요.","c":"T"},"h":"c4d7c98338"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... so that it won't harm others.)","ko":"그것이 다른 사람들을 해치지 않도록 ...","opts":["돕다","웃기다","해치다","가르치다"],"word":"harm","r":{"a":"3) 해치다","ev":"7번 문장","s":[[7,"And it should be filled with soft feathers or cotton so that it won’t harm others.","그리고 그것은 다른 사람들을 해치지 않도록 부드러운 깃털이나 솜으로 채워져 있어야 한다."]],"w":"부드러운 깃털이나 솜 베개를 쓰는 이유는 다른 사람이 다치지 않게 하려는 거예요. harm은 '해치다'예요.","c":3},"h":"dd24ec059a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Participating in this event is free, ...)","ko":"이 행사에 참가하는 것은 무료이나, ...","opts":["무료의","어려운","위험한","오래된"],"word":"free","r":{"a":"1) 무료의","ev":"6번 문장","s":[[6,"Participating in this event is free, but you should bring your own pillow.","이 행사에 참가하는 것은 무료이나, 자신의 베개를 가져와야 한다."]],"w":"뒤에 but you should bring your own pillow(하지만 자기 베개를 가져와야 한다)가 이어져요. 참가에 돈이 들지 않는다는 뜻이라서 free는 '무료의'예요.","c":1},"h":"68bf51acbf"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThis is because they are probably just watching the fun fight.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이것은 그들이 아마 그 즐거운 싸움을 보고 있을 뿐이기 때문이다.","opts":["Emily와 친구들","베개를 가진 참가자들","행사를 여는 사람들","베개를 갖고 있지 않은 사람들"],"r":{"a":"4) 베개를 갖고 있지 않은 사람들","ev":"9번, 10번 문장","s":[[9,"But don’t hit people who don’t have a pillow.","하지만 베개를 갖고 있지 않은 사람들은 치지 말아라."],[10,"This is because they are probably just watching the fun fight.","이것은 그들이 아마 그 즐거운 싸움을 보고 있을 뿐이기 때문이다."]],"w":"10번은 9번(베개 없는 사람을 치지 말라)의 이유를 말해요. 구경만 하고 있는 사람은 people who don't have a pillow예요.","c":4},"h":"8afac666bd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Finally, don't forget to clean up the streets after the fight is over.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마지막으로, 싸움이 끝난 후에 거리를 치우는 것을 잊지 말아라.","opts":["마지막으로, 싸움을 시작하기 전에 거리를 청소해라.","마지막으로, 싸움이 끝난 후에 거리를 치우는 것을 잊지 말아라.","마지막으로, 싸움이 끝나면 거리에서 바로 집에 가라.","마지막으로, 거리를 청소한 것을 잊어버려라."],"r":{"a":"2) 마지막으로, 싸움이 끝난 후에 거리를 치우는 것을 잊지 말아라.","ev":"11번 문장","s":[[11,"Finally, don’t forget to clean up the streets after the fight is over.","마지막으로, 싸움이 끝난 후에 거리를 치우는 것을 잊지 말아라."]],"w":"don't forget to clean up은 '치우는 것을 잊지 말라'이고, after the fight is over는 '싸움이 끝난 후에'예요. 시작 전이 아니라 끝난 뒤예요.","c":2},"h":"379635fb35"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이 행사는 4월의 마지막 금요일에 열린다.","참가자는 딱딱한 베개를 가져와야 한다.","3시 정각에 사이렌이 울리자 사람들이 베개로 서로를 쳤다.","베개가 없는 사람만 싸움에 참가할 수 있다."],"opts":["The event is held on the last Friday of April.","Participants should bring a hard pillow.","When the siren rang at three o'clock, people hit each other with pillows.","Only people without pillows can join the fight."],"r":{"a":"3) When the siren rang at three o'clock, people hit each other with pillows.","ev":"3번, 4번 문장","s":[[3,"Then, at three o’clock, the siren rang, and people suddenly started hitting each other!","그때, 3시 정각에, 사이렌이 울렸고, 사람들이 갑자기 서로를 치기 시작했다!"],[4,"On International Pillow Fight Day, people have a big fight with pillows.","국제 베개 싸움의 날에, 사람들은 베개로 큰 싸움을 한다."]],"w":"3번에서 3시 정각에 사이렌이 울리자 사람들이 서로를 치기 시작했고, 4번에서 베개로 싸운다고 해요. 날짜는 첫째 주 토요일(5번), 베개는 부드러운 것(7번)이에요.","c":3},"h":"8542691b19"},{"n":9,"t":"sum","q":"On International Pillow Fight Day, people bring their own pillows and (A) each other. The pillows should be (B), and people without a pillow should not be hit.","ko":"국제 베개 싸움의 날에, 사람들은 자신의 베개를 가져와서 서로를 (A). 베개는 (B) 하고, 베개가 없는 사람은 치면 안 된다.","oko":["(A) 돕는다 / (B) 부드러워야","(A) 친다 / (B) 딱딱해야","(A) 친다 / (B) 무거워야","(A) 지켜본다 / (B) 부드러워야","(A) 친다 / (B) 부드러워야"],"opts":["(A) help / (B) soft","(A) hit / (B) hard","(A) hit / (B) heavy","(A) watch / (B) soft","(A) hit / (B) soft"],"r":{"a q":"Facekinis are made in only one color.","ko":"페이스키니는 한 가지 색으로만 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"They are made in many different colors and patterns.","그것들은 여러 다양한 색깔과 무늬로 만들어진다."]],"w":"10번 문장에서 페이스키니는 many different colors and patterns, 즉 여러 다양한 색깔과 무늬로 만들어진다고 해요. 한 가지 색이라는 말은 반대예요.","c":"F"},"h":"f6028d42c3"},{"n":3,"t":"tf","q":"Facekinis can help prevent jellyfish stings.","ko":"페이스키니는 해파리에게 쏘이는 것을 막는 데 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Facekinis can also prevent stings from jellyfish.","페이스키니는 해파리로부터 쏘이는 것도 방지할 수 있다."]],"w":"8번 문장에 Facekinis can also prevent stings from jellyfish가 나와요. prevent는 '막다'이고 sting은 '쏘임'이에요.","c":"T"},"h":"2d17e9ee8b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They cover the entire head except for the eyes, nose, and mouth.)","ko":"그것들은 눈, 코, 입을 제외하고 머리 전체를 덮는다. (entire는 전체의)","opts":["작은","전체의","뒤쪽의","둥근"],"word":"entire","r":{"a":"2) 전체의","ev":"6번 문장","s":[[6,"They cover the entire head except for the eyes, nose, and mouth, so you look like a robber or a wrestler.","그것들은 눈, 코, 입을 제외하고 머리 전체를 덮어서, 당신은 강도나 레슬링선수처럼 보인다."]],"w":"눈, 코, 입만 빼고 덮는다고 했으니 머리 '전체'를 덮는 거예요. entire head = 머리 전체.","c":2},"h":"2c48ff49e9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, they fully protect your face from the sun’s harmful rays.)","ko":"하지만, 그것들은 태양의 해로운 광선으로부터 당신의 얼굴을 완전히 보호한다. (harmful은 해로운)","opts":["따뜻한","약한","해로운","눈부신"],"word":"harmful","r":{"a":"3) 해로운","ev":"7번 문장","s":[[7,"However, they fully protect your face from the sun’s harmful rays.","하지만, 그것들은 태양의 해로운 광선으로부터 당신의 얼굴을 완전히 보호한다."]],"w":"페이스키니가 얼굴을 '보호'하는 대상이니 얼굴에 나쁜, 즉 해로운 광선이에요. harmful = 해로운.","c":3},"h":"5b53ac5736"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIn addition, they can be a great fashion item.","ko":"밑줄 친 they가 가리키는 것은?","sko":"게다가, 그것들은 훌륭한 패션 소품이 될 수 있다.","opts":["페이스키니","해파리","중국 사람들","햇볕 광선"],"r":{"a":"1) 페이스키니","ev":"8~9번 문장","s":[[8,"Facekinis can also prevent stings from jellyfish.","페이스키니는 해파리로부터 쏘이는 것도 방지할 수 있다."],[9,"In addition, they can be a great fashion item.","게다가, 그것들은 훌륭한 패션 소품이 될 수 있다."]],"w":"패션 소품이 되는 것은 8번에서 계속 이야기하던 facekinis예요. 해파리나 햇볕 광선이 패션 소품이 될 수는 없어요.","c":1},"h":"d3a4cf4614"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, some people like to match their facekinis with their swimsuits to show off their styles!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서, 어떤 사람들은 스타일을 뽐내기 위해 그들의 페이스키니를 수영복과 맞추는 것을 좋아한다!","opts":["어떤 사람들은 수영복을 사지 않으려고 페이스키니만 쓴다.","어떤 사람들은 친구의 수영복과 자신의 페이스키니를 바꿔 쓴다.","어떤 사람들은 페이스키니가 싫어서 수영복에 색을 칠한다.","어떤 사람들은 스타일을 뽐내려고 페이스키니를 수영복과 어울리게 맞춘다."],"r":{"a":"4) 어떤 사람들은 스타일을 뽐내려고 페이스키니를 수영복과 어울리게 맞춘다.","ev":"11번 문장","s":[[11,"So, some people like to match their facekinis with their swimsuits to show off their styles!","그래서, 어떤 사람들은 스타일을 뽐내기 위해 그들의 페이스키니를 수영복과 맞추는 것을 좋아한다!"]],"w":"match A with B는 'A를 B와 맞추다', to show off their styles는 '스타일을 뽐내기 위해'예요. 수영복을 사지 않는다거나 바꿔 쓴다는 말은 없어요.","c":4},"h":"7d110ec4e0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["페이스키니는 해변에서 착용할 수 없다.","페이스키니는 햇볕의 해로운 광선으로부터 얼굴을 보호한다.","페이스키니는 눈, 코, 입까지 완전히 덮는다.","페이스키니는 강도와 레슬링 선수만 착용한다."],"opts":["Facekinis cannot be worn at the beach.","Facekinis protect the face from harmful sun rays.","Facekinis cover the eyes, nose, and mouth, too.","Only robbers and wrestlers wear facekinis."],"r":{"a":"2) Facekinis protect the face from harmful sun rays.","ev":"7번 문장","s":[[7,"However, they fully protect your face from the sun’s harmful rays.","하지만, 그것들은 태양의 해로운 광선으로부터 당신의 얼굴을 완전히 보호한다."]],"w":"7번에서 페이스키니가 해로운 광선으로부터 얼굴을 완전히 보호한다고 해요. 해변에서 착용하고(4번), 눈·코·입은 덮지 않으며(6번), 강도처럼 '보일' 뿐이에요(6번).","c":2},"h":"91721fdac5"},{"n":9,"t":"sum","q":"A facekini is a (A) that you wear on your face, and it fully (B) your face from the sun.","ko":"페이스키니는 얼굴에 착용하는 (A)이며 태양으로부터 얼굴을 완전히 (B)한다.","oko":["(A) 수건 / (B) 숨긴다","(A) 비키니 / (B) 태운다","(A) 모자 / (B) 보호한다","(A) 마스크 / (B) 해친다","(A) 비키니 / (B) 보호한다"],"opts":["(A) towel / (B) hides","(A) bikini / (B) burns","(A) hat / (B) protects","(A) mask / (B) harms","(A) bikini / (B) protects"],"r":{"a":"5) (A) bikini / (B) protects","ev":"3번, 7번 문장","s":[[3,"Basically, it is a bikini that can be worn on your face!","기본적으로, 그것은 당신의 얼굴에 착용될 수 있는 비키니이다!"],[7,"However, they fully protect your face from the sun’s harmful rays.","하지만, 그것들은 태양의 해로운 광선으로부터 당신의 얼굴을 완전히 보호한다."]],"w":"3번에서 얼굴에 착용하는 비키니(bikini)라고 했고, 7번에서 햇볕으로부터 얼굴을 완전히 보호한다(protect)고 했어요.","c":5},"h":"deee81ffb2"},{"n":10,"t":"fill","q":"Facekinis are made in many different [A] and patterns, so some people like to [B] them with their swimsuits.","ko":"페이스키니는 여러 다양한 [A]과 무늬로 만들어져서, 어떤 사람들은 그것을 수영복과 [B]하는 것을 좋아한다.","bank":["colors","match","cover","sunburn","jellyfish","fashion"],"bko":{"colors":"색깔","match":"맞추다","cover":"덮다","sunburn":"햇볕에 탐","jellyfish":"해파리","fashion":"패션"},"r":{"a":"[A] colors, [B] match","ev":"10~11번 문장","s":[[10,"They are made in many different colors and patterns.","그것들은 여러 다양한 색깔과 무늬로 만들어진다."],[11,"So, some people like to match their facekinis with their swimsuits to show off their styles!","그래서, 어떤 사람들은 스타일을 뽐내기 위해 그들의 페이스키니를 수영복과 맞추는 것을 좋아한다!"]],"w":"10번에 many different colors and patterns, 11번에 like to match their facekinis with their swimsuits가 나와요. 나머지 단어는 글에 있지만 이 문장 흐름과 맞지 않아요.","c":null},"h":"c19d0a406d"}]},{"u":2,"id":"hk1-02-2","no":2,"ko":"나는 가끔 눈물을 흘려...","items":[{"n":1,"t":"tf","q":"People thought crocodiles were pretending to feel sorry for their prey.","ko":"사람들은 악어가 먹이를 안쓰러워하는 척을 하고 있다고 생각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They thought crocodiles were pretending to feel sorry for their prey, so the tears seemed fake.","그들은 악어가 먹이를 안쓰러워하는 척을 하고 있다고 생각했고, 그래서 그 눈물은 거짓되게 보였다."]],"w":"4번 문장에 They thought crocodiles were pretending to feel sorry for their prey가 나와요. 여기서 They는 사람들이에요.","c":"T"},"h":"f9c2cff5db"},{"n":2,"t":"tf","q":"Crocodiles cry only when they are very sad.","ko":"악어는 매우 슬플 때만 운다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"In fact, crocodiles do cry when they are not sad at all.","사실, 악어는 전혀 슬프지 않을 때 정말 운다."],[6,"However, this is not a trick and doesn’t have any meaning.","하지만, 이것은 속임수가 아니고 어떠한 의미도 없다."]],"w":"5번에서 악어는 전혀 슬프지 않을 때도 운다고 하고, 6번에서 그것은 속임수도 아니고 의미도 없다고 해요. 슬플 때만 운다는 말은 반대예요.","c":"F"},"h":"0f433e3b23"},{"n":3,"t":"tf","q":"Crocodiles open their mouths wide to chew their prey.","ko":"악어는 먹이를 씹기 위해 입을 크게 벌린다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"To chew their prey, crocodiles open their mouths wide.","먹이를 씹기 위해서, 악어는 입을 크게 벌린다."]],"w":"8번 문장의 To chew their prey, crocodiles open their mouths wide와 같아요. To chew ~는 '씹기 위해'라는 목적이에요.","c":"T"},"h":"b16516281a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is used to describe a person who cries fake tears to look sad or sorry.)","ko":"이것은 슬프거나 미안해하는 것처럼 보이기 위해 거짓된 눈물을 흘리는 사람을 묘사하기 위해 사용된다. (fake는 거짓된)","opts":["진짜의","거짓된","따뜻한","많은"],"word":"fake","r":{"a":"2) 거짓된","ev":"2번 문장","s":[[2,"It is used to describe a person who cries fake tears to look sad or sorry.","이것은 슬프거나 미안해하는 것처럼 보이기 위해 거짓된 눈물을 흘리는 사람을 묘사하기 위해 사용된다."]],"w":"슬프거나 미안해 '보이기' 위해 흘리는 눈물이라고 했으니 진짜가 아닌 거짓 눈물이에요. fake = 거짓된.","c":2},"h":"145459e01c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To chew their prey, crocodiles open their mouths wide.)","ko":"먹이를 씹기 위해서, 악어는 입을 크게 벌린다. (prey는 먹이)","opts":["친구","알","먹이","장난감"],"word":"prey","r":{"a":"3) 먹이","ev":"8번 문장","s":[[8,"To chew their prey, crocodiles open their mouths wide.","먹이를 씹기 위해서, 악어는 입을 크게 벌린다."]],"w":"악어가 씹는 대상이니 먹이예요. 4번 문장의 feel sorry for their prey(먹이를 안쓰러워하다)에서도 같은 단어가 나와요.","c":3},"h":"7bf4760fa8"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey thought crocodiles were pretending to feel sorry for their prey, so the tears seemed fake.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 악어가 먹이를 안쓰러워하는 척을 하고 있다고 생각했고, 그래서 그 눈물은 거짓되게 보였다.","opts":["악어들","먹이들","눈물들","사람들"],"r":{"a":"4) 사람들","ev":"3~4번 문장","s":[[3,"A long time ago, people observed crocodiles crying while they ate.","오래 전에, 사람들은 악어가 먹는 동안 울고 있는 것을 목격했다."],[4,"They thought crocodiles were pretending to feel sorry for their prey, so the tears seemed fake.","그들은 악어가 먹이를 안쓰러워하는 척을 하고 있다고 생각했고, 그래서 그 눈물은 거짓되게 보였다."]],"w":"악어를 관찰하고 생각한 쪽은 3번의 people(사람들)이에요. 악어는 They thought의 내용 속에 따로 나와요.","c":4},"h":"b2fca7b52b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is just a natural physical reaction.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 그냥 자연스러운 신체 반응이다.","opts":["그것은 몸에서 저절로 나타나는 반응일 뿐이다.","그것은 악어가 일부러 하는 행동이다.","그것은 먹이를 속이기 위한 방법이다.","그것은 악어가 아플 때만 나타나는 증상이다."],"r":{"a":"1) 그것은 몸에서 저절로 나타나는 반응일 뿐이다.","ev":"7번 문장","s":[[7,"It is just a natural physical reaction.","그것은 그냥 자연스러운 신체 반응이다."]],"w":"natural physical reaction은 '자연스러운 신체 반응'이에요. 6번에서 속임수가 아니라고 했으니 일부러 하거나 먹이를 속이는 것이 아니에요.","c":1},"h":"885ecb840e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["악어는 슬플 때만 눈물을 흘린다.","악어의 턱 근육이 눈물샘을 누르면 눈물이 저절로 나온다.","악어는 먹이를 씹을 때 입을 꼭 다문다.","사람들은 악어가 자는 동안 우는 것을 처음 보았다."],"opts":["Crocodiles cry only when they feel sad.","Crocodile tears automatically come out when jaw muscles press the tear ducts.","Crocodiles close their mouths tightly to chew their prey.","People first saw crocodiles crying while they were sleeping."],"r":{"a":"2) Crocodile tears automatically come out when jaw muscles press the tear ducts.","ev":"9~10번 문장","s":[[9,"This causes their jaw muscles to move a lot and put pressure on their tear ducts.","이것은 그들의 턱 근육이 많이 움직여 눈물샘에 압박을 가하도록 한다."],[10,"Then, the tears automatically come out of their tear ducts and start to fall!","그러면, 눈물이 그들의 눈물샘에서 저절로 나와 떨어지기 시작한다!"]],"w":"9번에서 턱 근육이 눈물샘을 누르고, 10번에서 눈물이 저절로 나와요. 슬플 때만 우는 게 아니고(5번), 입은 크게 벌리며(8번), 사람들이 본 것은 먹는 동안이에요(3번).","c":2},"h":"7adfcc32e0"},{"n":9,"t":"sum","q":"People thought crocodile tears were (A) because crocodiles cried while eating, but the tears are really a (B) reaction.","ko":"사람들은 악어가 먹는 동안 우는 것을 보고 악어의 눈물이 (A)이라고 생각했지만, 그 눈물은 사실 (B) 반응이다.","oko":["(A) 진짜 / (B) 자연스러운","(A) 거짓된 / (B) 슬픈","(A) 진짜 / (B) 속임수 같은","(A) 웃긴 / (B) 자연스러운","(A) 거짓된 / (B) 자연스러운"],"opts":["(A) real / (B) natural","(A) fake / (B) sad","(A) real / (B) tricky","(A) funny / (B) natural","(A) fake / (B) natural"],"r":{"a":"5) (A) fake / (B) natural","ev":"3~4번, 7번 문장","s":[[3,"A long time ago, people observed crocodiles crying while they ate.","오래 전에, 사람들은 악어가 먹는 동안 울고 있는 것을 목격했다."],[4,"They thought crocodiles were pretending to feel sorry for their prey, so the tears seemed fake.","그들은 악어가 먹이를 안쓰러워하는 척을 하고 있다고 생각했고, 그래서 그 눈물은 거짓되게 보였다."],[7,"It is just a natural physical reaction.","그것은 그냥 자연스러운 신체 반응이다."]],"w":"사람들은 눈물이 거짓(fake)처럼 보인다고 생각했어요(4번). 하지만 7번에서 그것은 자연스러운(natural) 신체 반응일 뿐이라고 해요.","c":5},"h":"336b897fe0"},{"n":10,"t":"fill","q":"Crocodiles open their mouths wide to [A] their prey, and their jaw muscles put [B] on their tear ducts.","ko":"악어는 먹이를 [A]하기 위해 입을 크게 벌리고, 턱 근육이 눈물샘에 [B]을 가한다.","bank":["chew","pressure","swim","sleep","fake","laugh"],"bko":{"chew":"씹다","pressure":"압박","swim":"수영하다","sleep":"자다","fake":"거짓된","laugh":"웃다"},"r":{"a":"[A] chew, [B] pressure","ev":"8~9번 문장","s":[[8,"To chew their prey, crocodiles open their mouths wide.","먹이를 씹기 위해서, 악어는 입을 크게 벌린다."],[9,"This causes their jaw muscles to move a lot and put pressure on their tear ducts.","이것은 그들의 턱 근육이 많이 움직여 눈물샘에 압박을 가하도록 한다."]],"w":"8번 To chew their prey, 9번 put pressure on their tear ducts에서 가져왔어요. swim, sleep, laugh는 글의 내용과 상관없고, fake는 눈물을 설명하는 말이라 이 문장에 맞지 않아요.","c":null},"h":"4fec441186"}]},{"u":2,"id":"hk1-02-3","no":3,"ko":"자, 깨워줬지?","items":[{"n":1,"t":"tf","q":"The girl wrote a message on a sticky note.","ko":"소녀는 포스트잇에 메시지를 적었다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"After much thought, she wrote a message on a sticky note.","많은 생각 후에, 그녀는 포스트잇에 메시지를 적었다."]],"w":"8번 문장에 she wrote a message on a sticky note가 그대로 있어요. sticky note는 포스트잇이에요.","c":"T"},"h":"f3eb8458d1"},{"n":2,"t":"tf","q":"The girl woke up at 8 a.m. the next day.","ko":"소녀는 다음 날 오전 8시에 일어났다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"The next day, she woke up at 11 a.m.!","다음 날, 그녀는 오전 11시에 일어났다!"]],"w":"11번 문장에서 소녀는 오전 11시에 일어났어요. 8시는 쪽지에 적은 깨워 달라는 시간이에요.","c":"F"},"h":"2f618fb411"},{"n":3,"t":"tf","q":"The girl didn’t want to talk to her mother first.","ko":"소녀는 엄마에게 먼저 말하기를 원하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"However, she didn’t want to talk first.","하지만, 그녀는 먼저 말하기를 원하지 않았다."]],"w":"6번 문장 she didn’t want to talk first가 그대로예요. 그래서 말 대신 쪽지를 썼어요.","c":"T"},"h":"be8e055c31"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She was going to meet her friend early in the morning, but she was a heavy sleeper.)","ko":"그녀는 아침 일찍 친구를 만날 계획이었지만, 그녀는 잠이 많은 사람이었다. (heavy sleeper는 잠이 깊이 드는 사람)","opts":["잠이 많은 사람","일찍 일어나는 사람","잠을 못 자는 사람","몸이 무거운 사람"],"word":"heavy sleeper","r":{"a":"1) 잠이 많은 사람","ev":"4번 문장","s":[[4,"She was going to meet her friend early in the morning, but she was a heavy sleeper.","그녀는 아침 일찍 친구를 만날 계획이었지만, 그녀는 잠이 많은 사람이었다."]],"w":"아침 일찍 만나야 하는데 but으로 문제를 말하고, 다음 문장에서 엄마의 도움이 있어야 일어난다고 했으니 잠이 깊이 들어 잘 못 일어나는 사람이에요.","c":1},"h":"37f67c454c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Instead, she found a note.)","ko":"대신에, 그녀는 쪽지를 발견했다. (instead는 대신에)","opts":["그리고","대신에","마침내","항상"],"word":"Instead","r":{"a":"2) 대신에","ev":"12~13번 문장","s":[[12,"She looked for her mother, but she wasn’t home.","그녀는 엄마를 찾았지만, 엄마는 집에 없었다."],[13,"Instead, she found a note.","대신에, 그녀는 쪽지를 발견했다."]],"w":"엄마를 찾았지만 없었어요(12번). 엄마 '대신' 쪽지를 발견한 거예요(13번).","c":2},"h":"daa179bfe0"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nShe put it on her mother’s phone and went to sleep.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그녀는 그것을 엄마의 휴대폰 위에 붙이고 잠이 들었다.","opts":["소녀의 친구","엄마","메시지를 적은 포스트잇","아침 8시"],"r":{"a":"3) 메시지를 적은 포스트잇","ev":"8~10번 문장","s":[[8,"After much thought, she wrote a message on a sticky note.","많은 생각 후에, 그녀는 포스트잇에 메시지를 적었다."],[9,"“Please wake me up at 8 a.m.”","“오전 8시에 저를 깨워주세요.”"],[10,"She put it on her mother’s phone and went to sleep.","그녀는 그것을 엄마의 휴대폰 위에 붙이고 잠이 들었다."]],"w":"8번에서 쓴 sticky note를 엄마의 휴대폰에 붙인 거예요. 휴대폰 위에 붙일 수 있는 것은 포스트잇뿐이에요.","c":3},"h":"65427857b5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"After much thought, she wrote a message on a sticky note.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"많은 생각 후에, 그녀는 포스트잇에 메시지를 적었다.","opts":["그녀는 생각 없이 곧바로 엄마에게 말했다.","그녀는 포스트잇을 사러 나가서 오래 걸렸다.","그녀는 엄마의 메시지를 읽고 오래 생각했다.","그녀는 오래 고민한 끝에 포스트잇에 메시지를 썼다."],"r":{"a":"4) 그녀는 오래 고민한 끝에 포스트잇에 메시지를 썼다.","ev":"8번 문장","s":[[8,"After much thought, she wrote a message on a sticky note.","많은 생각 후에, 그녀는 포스트잇에 메시지를 적었다."]],"w":"After much thought은 '많은 생각 후에'예요. 먼저 말하기 싫어서 고민하다가 쪽지를 쓴 거예요.","c":4},"h":"80187dcd00"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["소녀와 엄마는 온종일 많은 이야기를 나눴다.","소녀는 일어나기 위해 엄마의 도움이 필요했다.","소녀의 친구가 소녀의 엄마를 만날 예정이었다.","소녀는 아침에 집에서 엄마를 만났다."],"opts":["The girl and her mother talked a lot all day.","The girl needed her mother’s help to get up.","The girl’s friend was going to meet her mother.","The girl met her mother at home in the morning."],"r":{"a":"2) The girl needed her mother’s help to get up.","ev":"5번 문장","s":[[5,"She needed her mother’s help to get up.","그녀는 일어나기 위해 엄마의 도움이 필요했다."]],"w":"5번에 She needed her mother’s help to get up이 나와요. 둘은 온종일 말하지 않았고(2번), 친구를 만나는 쪽은 소녀이며(4번), 소녀가 일어났을 때 엄마는 집에 없었어요(12번).","c":2},"h":"baf4147e13"},{"n":9,"t":"sum","q":"The girl asked her mother to wake her up at (A) a.m., but she woke up at (B) a.m.","ko":"소녀는 엄마에게 오전 (A)시에 깨워 달라고 부탁했지만, 오전 (B)시에 일어났다.","oko":["(A) 11 / (B) 8","(A) 8 / (B) 8","(A) 7 / (B) 11","(A) 11 / (B) 11","(A) 8 / (B) 11"],"opts":["(A) 11 / (B) 8","(A) 8 / (B) 8","(A) 7 / (B) 11","(A) 11 / (B) 11","(A) 8 / (B) 11"],"r":{"a":"5) (A) 8 / (B) 11","ev":"9번, 11번 문장","s":[[9,"“Please ":"12번 문장","s":[[12,"Even just looking at them in pictures has a similar effect.","심지어 그들을 사진에서 보기만 하는 것도 유사한 효과를 가진다."]],"w":"12번 문장에서 사진으로만 봐도 비슷한 효과가 있다(has a similar effect)고 해요.","c":"T"},"h":"d472799ff7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Babies or baby animals can improve your concentration briefly.)","ko":"아기나 새끼 동물은 당신의 집중력을 잠시 향상시킬 수 있다. (briefly는 잠시)","opts":["영원히","잠시","자주","천천히"],"word":"briefly","r":{"a":"2) 잠시","ev":"10번 문장","s":[[10,"Babies or baby animals can improve your concentration briefly.","아기나 새끼 동물은 당신의 집중력을 잠시 향상시킬 수 있다."]],"w":"실험 직후 성공률이 오른 것이므로 집중력이 높아지는 시간이 짧다는 뜻이에요. briefly = 잠시.","c":2},"h":"e687042fd7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (you become extra careful and aware)","ko":"당신은 각별히 조심하고 의식하게 된다. (aware는 의식하는)","opts":["지루한","피곤한","의식하는","외로운"],"word":"aware","r":{"a":"3) 의식하는","ev":"11번 문장","s":[[11,"This is because when you take care of a baby, you become extra careful and aware.","이것은 아기를 돌볼 때 각별히 조심하고 의식하게 되기 때문이다."]],"w":"아기를 돌볼 때 careful(조심하는)과 함께 나오고, 집중력에 도움이 되는 상태이므로 주변을 의식하는 쪽이에요.","c":3},"h":"4a5e78006b"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nEven just looking at them in pictures has a similar effect.","ko":"밑줄 친 them이 가리키는 것은?","sko":"심지어 그들을 사진에서 보기만 하는 것도 유사한 효과를 가진다.","opts":["두 그룹","40개의 숫자","과제들","아기나 새끼 동물"],"r":{"a":"4) 아기나 새끼 동물","ev":"10~12번 문장","s":[[10,"Babies or baby animals can improve your concentration briefly.","아기나 새끼 동물은 당신의 집중력을 잠시 향상시킬 수 있다."],[11,"This is because when you take care of a baby, you become extra careful and aware.","이것은 아기를 돌볼 때 각별히 조심하고 의식하게 되기 때문이다."],[12,"Even just looking at them in pictures has a similar effect.","심지어 그들을 사진에서 보기만 하는 것도 유사한 효과를 가진다."]],"w":"사진으로 보는 대상은 10번의 babies or baby animals예요. 그것을 보는 효과를 말하고 있어요.","c":4},"h":"9dd7d806b2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A cute puppy or some delicious pasta can make us feel good when we see them.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"귀여운 강아지나 맛있는 파스타는 우리가 그것들을 볼 때 기분 좋게 만들 수 있다.","opts":["귀여운 강아지나 맛있는 파스타를 보면 기분이 좋아질 수 있다.","귀여운 강아지와 맛있는 파스타는 먹어야만 기분이 좋아진다.","귀여운 강아지를 보면 배가 고파질 수 있다.","맛있는 파스타를 보면 기분이 나빠질 수 있다."],"r":{"a":"1) 귀여운 강아지나 맛있는 파스타를 보면 기분이 좋아질 수 있다.","ev":"1번 문장","s":[[1,"A cute puppy or some delicious pasta can make us feel good when we see them.","귀여운 강아지나 맛있는 파스타는 우리가 그것들을 볼 때 기분 좋게 만들 수 있다."]],"w":"make us feel good은 '우리를 기분 좋게 만든다'이고, when we see them은 '우리가 그것들을 볼 때'예요. 먹어야만 좋아진다는 말은 없어요.","c":1},"h":"6f9f204458"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["A그룹은 음식 사진을 보았다.","B그룹의 성공률은 16퍼센트만큼 올랐다.","A그룹은 새끼 동물 사진을 본 뒤 성공률이 올랐다.","B그룹은 새끼 동물 사진을 보았다."],"opts":["Group A saw images of food.","Group B’s success rate went up by 16%.","Group A’s success rate went up after looking at baby animals.","Group B looked at pictures of baby animals."],"r":{"a":"3) Group A’s success rate went up after looking at baby animals.","ev":"6번, 9번 문장","s":[[6,"Afterwards, Group A looked at pictures of baby animals, and Group B looked at images of food.","이후, A그룹은 새끼 동물 사진을 보았고, B그룹은 음식 사진을 보았다."],[9,"However, Group A’s success rate increased by 16%!","하지만, A그룹의 성공률은 16퍼센트만큼 증가했다!"]],"w":"A그룹은 새끼 동물 사진을 보고(6번) 성공률이 16퍼센트 올랐어요(9번). 음식 사진은 B그룹이 봤고(6번), B그룹은 거의 변화가 없었어요(8번).","c":3},"h":"e96982fb7e"},{"n":9,"t":"sum","q":"Looking at (A) can make you more (B), so your concentration can get better for a short time.","ko":"(A)를 보면 당신이 더 (B)하게 될 수 있어서, 집중력이 잠시 나아질 수 있다.","oko":["(A) 음식 / (B) 조심","(A) 새끼 동물 / (B) 지루","(A) 숫자 / (B) 의식","(A) 파스타 / (B) 조심","(A) 새끼 동물 / (B) 조심"],"opts":["(A) food / (B) careful","(A) baby animals / (B) bored","(A) numbers / (B) aware","(A) pasta / (B) careful","(A) baby animals / (B) careful"],"r":{"a":"5) (A) baby animals / (B) careful","ev":"10번, 11번 문장","s":[[10,"Babies or baby animals can improve your concentration briefly.","아기나 새끼 동물은 당신의 집중력을 잠시 향상시킬 수 있다."],[11,"This is because when you take care of a baby, you become extra careful and aware.","이것은 아기를 돌볼 때 각별히 조심하고 의식하게 되기 때문이다."]],"w":"10번에서 아기나 새끼 동물이 집중력을 높이고, 11번에서 그 이유가 각별히 조심하고(careful) 의식하게 되기 때문이라고 해요.","c":5},"h":"9451b49724"},{"n":10,"t":"fill","q":"After looking at pictures of baby animals, Group A’s success rate [A] by 16%, but Group B’s performance had almost [B] change.","ko":"새끼 동물 사진을 본 뒤, A그룹의 성공률은 16퍼센트만큼 [A]했지만, B그룹의 성과는 거의 [B] 변화가 있었다.","bank":["increased","no","decreased","big","food","repeated"],"bko":{"increased":"증가했다","no":"없는","decreased":"감소했다","big":"큰","food":"음식","repeated":"반복했다"},"r":{"a":"[A] increased, [B] no","ev":"8~9번 문장","s":[[8,"Group B’s performance had almost no change.","B그룹의 성과는 거의 변화가 없었다."],[9,"However, Group A’s success rate increased by 16%!","하지만, A그룹의 성공률은 16퍼센트만큼 증가했다!"]],"w":"9번 Group A’s success rate increased by 16%, 8번 Group B’s performance had almost no change에서 가져왔어요. decreased는 반대 뜻이고, big이면 'B그룹이 크게 변했다'는 뜻이 되어 8번과 반대예요.","c":null},"h":"27020670b2"}]},{"u":3,"id":"hk1-03-1","no":1,"ko":"쓴맛은 싫어!","items":[{"n":1,"t":"tf","q":"The American soldiers did not like espresso because it was too bitter.","ko":"미국 군인들은 에스프레소가 너무 써서 좋아하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"However, they did not like the Italian coffee called espresso.","하지만, 그들은 에스프레소라고 불리는 이탈리아의 커피를 좋아하지 않았다."],[5,"It was too bitter for the American soldiers.","에스프레소는 미국 군인들에게는 너무 썼다."]],"w":"4번에서 군인들이 에스프레소를 좋아하지 않았다고 하고, 5번에서 그 이유가 군인들에게 너무 썼기(too bitter) 때문이라고 해요.","c":"T"},"h":"ddba15ae94"},{"n":2,"t":"tf","q":"The barista poured cold water into the espresso.","ko":"바리스타는 에스프레소에 차가운 물을 부었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Then, he poured hot water into it.","그러고 나서, 그는 그 안에 뜨거운 물을 부었다."]],"w":"8번 문장에서 바리스타가 부은 것은 뜨거운 물(hot water)이에요. 차가운 물이 아니에요.","c":"F"},"h":"7171ad0429"},{"n":3,"t":"tf","q":"Italians began to call the mild coffee “Americano.”","ko":"이탈리아인들은 그 순한 커피를 ‘아메리카노’라고 부르기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Italians started to call this mild coffee “Americano.”","이탈리아인들은 이 순한 커피를 ‘아메리카노’라고 부르기 시작했다."]],"w":"10번 문장에 Italians started to call this mild coffee “Americano.”라고 나와요. start to call = 부르기 시작하다.","c":"T"},"h":"a04d24a0f6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It was too bitter for the American soldiers.)","ko":"그것은 미국 군인들에게는 너무 썼다. (bitter는 맛이 쓴)","opts":["단","짠","쓴","매운"],"word":"bitter","r":{"a":"3) 쓴","ev":"5번 문장","s":[[5,"It was too bitter for the American soldiers.","에스프레소는 미국 군인들에게는 너무 썼다."]],"w":"에스프레소가 군인들에게 맞지 않은 이유예요. 뜨거운 물을 넣어 less bitter(덜 쓴)가 되었다고 하니 bitter = 쓴이에요.","c":3},"h":"ccf06272fd"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Fortunately, one barista found a solution.)","ko":"다행히, 한 바리스타가 해결책을 찾았다. (solution은 해결책)","opts":["질문","해결책","손님","가격"],"word":"solution","r":{"a":"2) 해결책","ev":"6~8번 문장","s":[[6,"Fortunately, one barista found a solution.","다행히, 한 바리스타가 해결책을 찾았다."],[7,"He put espresso in a large cup.","그는 큰 컵에 에스프레소를 넣었다."],[8,"Then, he poured hot water into it.","그러고 나서, 그는 그 안에 뜨거운 물을 부었다."]],"w":"쓴맛이라는 문제가 있었고 바리스타가 물을 넣는 방법을 찾았어요. 문제를 푸는 방법이니 solution = 해결책이에요.","c":2},"h":"e2bdb10556"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe coffee became less bitter, and the American soldiers loved it!","ko":"밑줄 친 it이 가리키는 것은?","opts":["에스프레소를 파는 카페","물을 넣어 덜 쓴 그 커피","이탈리아의 음식","큰 컵"],"sko":"그 커피는 맛이 덜 써졌고, 미국 군인들은 그것을 매우 좋아했다!","r":{"a":"2) 물을 넣어 덜 쓴 그 커피","ev":"9번 문장","s":[[9,"The coffee became less bitter, and the American soldiers loved it!","그 커피는 맛이 덜 써졌고, 미국 군인들은 그것을 매우 좋아했다!"]],"w":"군인들이 좋아한 것은 앞에서 덜 써진 그 커피(The coffee)예요. 카페나 컵을 좋아했다는 말은 아니에요.","c":2},"h":"5c882dc201"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now, the Americano is enjoyed by people around the world.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["아메리카노는 이제 세계 어디에서도 팔리지 않는다.","아메리카노는 이탈리아 사람들만 즐긴다.","아메리카노는 세계 사람들을 위해 처음 만들어졌다.","아메리카노는 오늘날 전 세계 사람들이 즐겨 마신다."],"sko":"오늘날, 아메리카노는 전세계 사람들에 의해 즐겨진다.","r":{"a":"4) 아메리카노는 오늘날 전 세계 사람들이 즐겨 마신다.","ev":"12번 문장","s":[[12,"Now, the Americano is enjoyed by people around the world.","오늘날, 아메리카노는 전세계 사람들에 의해 즐겨진다."]],"w":"is enjoyed by people around the world는 '전 세계 사람들에 의해 즐겨진다'예요. 이탈리아인만 즐기거나 팔리지 않는다는 뜻이 아니에요.","c":4},"h":"9b136f30af"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The barista made the coffee milder by adding hot water.","The soldiers did not like the food and wine in Italy.","The barista put cold milk into the espresso.","The Americano was first made in America before the war."],"oko":["바리스타는 뜨거운 물을 넣어 커피를 더 순하게 만들었다.","군인들은 이탈리아의 음식과 와인을 좋아하지 않았다.","바리스타는 에스프레소에 차가운 우유를 넣었다.","아메리카노는 전쟁 전에 미국에서 처음 만들어졌다."],"r":{"a":"1) The barista made the coffee milder by adding hot water.","ev":"7~9번 문장","s":[[7,"He put espresso in a large cup.","그는 큰 컵에 에스프레소를 넣었다."],[8,"Then, he poured hot water into it.","그러고 나서, 그는 그 안에 뜨거운 물을 부었다."],[9,"The coffee became less bitter, and the American soldiers loved it!","그 커피는 맛이 덜 써졌고, 미국 군인들은 그것을 매우 좋아했다!"]],"w":"7~9번에서 바리스타가 에스프레소에 뜨거운 물을 부어 덜 쓰게 만들었어요. 음식과 와인은 맛있었고(3번), 넣은 것은 차가운 우유가 아닌 뜨거운 물이며(8번), 아메리카노는 전쟁 중 이탈리아에서 만들어졌어요(1번, 6~10번).","c":1},"h":"6b3f28dc8d"},{"n":9,"t":"sum","q":"The American soldiers found espresso too (A), so a barista added (B) water to it, and the new coffee became the Americano.","ko":"미국 군인들은 에스프레소가 너무 (A)하다고 생각했고, 그래서 바리스타가 그것에 (B) 물을 더했고, 새 커피가 아메리카노가 되었다.","opts":["(A) sweet / (B) hot","(A) bitter / (B) cold","(A) expensive / (B) hot","(A) salty / (B) cold","(A) bitter / (B) hot"],"oko":["(A) 단 / (B) 뜨거운","(A) 쓴 / (B) 차가운","(A) 비싼 / (B) 뜨거운","(A) 짠 / (B) 차가운","(A) 쓴 / (B) 뜨거운"],"r":{"a":"5) (A) bitter / (B) hot","ev":"5번, 8번 문장","s":[[5,"It was too bitter for the American soldiers.","에스프레소는 미국 군인들에게는 너무 썼다."],[8,"Then, he poured hot water into it.","그러고 나서, 그는 그 안에 뜨거운 물을 부었다."]],"w":"5번에서 너무 썼고(bitter), 8번에서 뜨거운 물(hot water)을 부었어요. sweet, salty, expensive는 본문에 없고, cold는 8번과 반대예요.","c":5},"h":"b0fc80a81f"},{"n":10,"t":"fill","q":"The coffee became [A] bitter, and Italians started to [B] this mild coffee “Americano.”","ko":"그 커피는 [A] 쓴 맛이 되었고, 이탈리아인들은 이 순한 커피를 ‘아메리카노’라고 [B] 시작했다.","bank":["less","call","loved","poured","mild","put"],"bko":{"less":"덜","call":"부르다","loved":"매우 좋아했다","poured":"부었다","mild":"순한","put":"넣다"},"r":{"a":"[A] less, [B] call","ev":"9~10번 문장","s":[[9,"The coffee became less bitter, and the American soldiers loved it!","그 커피는 맛이 덜 써졌고, 미국 군인들은 그것을 매우 좋아했다!"],[10,"Italians started to call this mild coffee “Americano.”","이탈리아인들은 이 순한 커피를 ‘아메리카노’라고 부르기 시작했다."]],"w":"9번 became less bitter(덜 써졌다)와 10번 started to call(부르기 시작했다)에서 가져왔어요. loved, poured, put은 과거형이라 start to 뒤에 맞지 않고, mild는 뜻이 맞지 않아요.","c":null},"h":"1f95563c92"}]},{"u":3,"id":"hk1-03-2","no":2,"ko":"목이 말라요, 주인님!","items":[{"n":1,"t":"tf","q":"Lua has a screen and several sensors.","ko":"Lua는 화면과 여러 개의 센서를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It has a screen and several sensors.","그것은 한 화면과 여러 개의 센서들을 가지고 있다."]],"w":"4번 문장에 It has a screen and several sensors.가 있어요. It은 Lua예요.","c":"T"},"h":"55f6f26ec7"},{"n":2,"t":"tf","q":"A happy face appears when the plant has a lack of sunlight.","ko":"식물이 햇빛이 부족할 때 행복한 얼굴이 나타난다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"A vampire face is shown when the plant has a lack of sunlight.","식물이 햇빛이 부족할 때는 흡혈귀 얼굴이 보인다."],[9,"But if you water your plant and let it stay in the sun for some time, you will see a happy face.","하지만 당신이 식물에 물을 주고 얼마 동안 햇빛에 둔다면, 행복한 얼굴을 볼 것이다."]],"w":"햇빛이 부족할 때 나오는 것은 흡혈귀 얼굴이에요(8번). 행복한 얼굴은 물을 주고 햇빛에 얼마 동안 둘 때 나와요(9번).","c":"F"},"h":"069b4ae4a5"},{"n":3,"t":"tf","q":"Lua sometimes falls asleep, but it wakes up when someone comes near.","ko":"Lua는 가끔 잠이 들지만, 누군가 가까이 오면 깨어난다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"It sometimes falls asleep, but when you come near, it will wake up and look at you.","그것은 가끔 잠이 들지만, 당신이 가까이 올 때, 그것은 깨어나 당신을 바라볼 것이다."]],"w":"11번 문장에 sometimes falls asleep(가끔 잠이 든다)과 when you come near, it will wake up(가까이 오면 깨어난다)이 그대로 나와요.","c":"T"},"h":"c089510bfb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The sensors monitor moisture, the amount of sunshine, and the temperature.)","ko":"센서들은 습기, 일조량, 그리고 기온을 측정한다. (monitor는 측정하다)","opts":["숨기다","측정하다","만들다","팔다"],"word":"monitor","r":{"a":"2) 측정하다","ev":"5번 문장","s":[[5,"The sensors monitor moisture, the amount of sunshine, and the temperature.","센서들은 습기, 일조량, 그리고 기온을 측정한다."]],"w":"센서가 습기, 햇빛의 양, 기온을 재서 6번에서 식물의 상태를 보여줘요. 그래서 monitor = 측정하다예요.","c":2},"h":"484ddc29d3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A vampire face is shown when the plant has a lack of sunlight.)","ko":"식물이 햇빛이 부족할 때는 흡혈귀 얼굴이 보인다. (lack은 부족)","opts":["많음","색깔","냄새","부족"],"word":"lack","r":{"a":"4) 부족","ev":"8번 문장","s":[[8,"A vampire face is shown when the plant has a lack of sunlight.","식물이 햇빛이 부족할 때는 흡혈귀 얼굴이 보인다."]],"w":"흡혈귀는 햇빛을 싫어하지만 여기서는 식물이 햇빛이 모자랄 때 나오는 얼굴이에요. 9번에서 햇빛에 두면 행복해진다고 하니 lack = 부족이에요.","c":4},"h":"11a9f205a8"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIt’s hard to know what they need.","ko":"밑줄 친 they가 가리키는 것은?","opts":["식물들","센서들","화분들","우리"],"sko":"그것들이 무엇을 원하는지를 알기는 어렵다.","r":{"a":"1) 식물들","ev":"1~2번 문장","s":[[1,"Growing plants is not easy.","식물을 기르는 것은 쉽지 않다."],[2,"It’s hard to know what they need.","그것들이 무엇을 원하는지를 알기는 어렵다."]],"w":"2번의 they가 필요로 하는 것은 1번에서 말한 기르는 대상인 식물(plants)이에요. 알기 어려운 것은 식물이 무엇을 원하는지예요.","c":1},"h":"3548196626"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, we don’t have to guess anymore with Lua, the smart flowerpot.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["Lua는 우리가 추측을 더 잘하게 도와주는 게임이다.","우리는 Lua 때문에 식물을 더는 기를 수 없다.","스마트 화분 Lua가 있으면 우리는 더는 추측하지 않아도 된다.","우리는 Lua를 사려면 계속 추측해야 한다."],"sko":"하지만, 스마트 화분인 Lua와 함께라면, 우리는 더는 추측할 필요가 없다.","r":{"a":"3) 스마트 화분 Lua가 있으면 우리는 더는 추측하지 않아도 된다.","ev":"3번 문장","s":[[3,"However, we don’t have to guess anymore with Lua, the smart flowerpot.","하지만, 스마트 화분인 Lua와 함께라면, 우리는 더는 추측할 필요가 없다."]],"w":"don’t have to ~ anymore는 '더는 ~할 필요가 없다'예요. 스마트 화분 Lua가 식물이 원하는 것을 알려 주니 추측하지 않아도 된다는 뜻이에요.","c":3},"h":"12c266f3dd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Lua has no screen but has many speakers.","Lua’s sensors check moisture, sunshine, and temperature.","Lua shows a happy face when the plant needs water.","Lua always stays awake and ignores people."],"oko":["Lua는 화면이 없고 스피커가 많다.","Lua의 센서는 습기, 일조량, 기온을 확인한다.","Lua는 식물이 물이 필요할 때 행복한 얼굴을 보여준다.","Lua는 항상 깨어 있고 사람을 무시한다."],"r":{"a":"2) Lua’s sensors check moisture, sunshine, and temperature.","ev":"5번 문장","s":[[5,"The sensors monitor moisture, the amount of sunshine, and the temperature.","센서들은 습기, 일조량, 그리고 기온을 측정한다."]],"w":"5번에서 센서가 습기, 일조량, 기온을 측정한다고 해요. Lua는 화면이 있고(4번), 물이 필요하면 목마른 얼굴을 보이며(7번), 사람이 가까이 오면 깨어나 바라봐요(11번).","c":2},"h":"34c8ac5191"},{"n":9,"t":"sum","q":"Lua is a smart (A) that checks a plant’s needs with sensors and shows its feelings with different (B) on the screen.","ko":"Lua는 센서로 식물에게 필요한 것을 확인하고 화면의 서로 다른 (B)로 식물의 기분을 보여주는 스마트 (A)이다.","opts":["(A) pet / (B) sounds","(A) flowerpot / (B) songs","(A) screen / (B) faces","(A) flowerpot / (B) faces","(A) sensor / (B) lights"],"oko":["(A) 애완동물 / (B) 소리","(A) 화분 / (B) 노래","(A) 화면 / (B) 얼굴","(A) 화분 / (B) 얼굴","(A) 센서 / (B) 불빛"],"r":{"a":"4) (A) flowerpot / (B) faces","ev":"3번, 6번, 7번 문장","s":[[3,"However, we don’t have to guess anymore with Lua, the smart flowerpot.","하지만, 스마트 화분인 Lua와 함께라면, 우리는 더는 추측할 필요가 없다."],[6,"Then, Lua shows how your plant is feeling on its screen.","그러고 나서, Lua는 당신의 식물이 어떻게 느끼고 있는지를 화면에 보여준다."],[7,"If your plant needs water, a thirsty face appears.","만약 당신의 식물이 물을 필요로 하면, 목마른 얼굴이 나타난다."]],"w":"3번에서 Lua는 스마트 화분(flowerpot)이고, 6~7번에서 식물의 기분을 얼굴(face)로 보여줘요. pet은 12번의 비유일 뿐 Lua의 정체가 아니고, songs, sounds, lights는 본문에 없어요.","c":4},"h":"7eed47bf4b"},{"n":10,"t":"fill","q":"Lua [A] to movement: it sometimes falls [B], but it wakes up when you come near.","ko":"Lua는 움직임에 [A]한다. 가끔 [B] 들지만, 가까이 가면 깨어난다.","bank":["responds","asleep","grows","awake","guess","near"],"bko":{"responds":"반응하다","asleep":"잠든","grows":"자라다","awake":"깨어 있는","guess":"추측하다","near":"가까이"},"r":{"a":"[A] responds, [B] asleep","ev":"10~11번 문장","s":[[10,"In addition, Lua responds to movement.","게다가, Lua는 움직임에 반응한다."],[11,"It sometimes falls asleep, but when you come near, it will wake up and look at you.","그것은 가끔 잠이 들지만, 당신이 가까이 올 때, 그것은 깨어나 당신을 바라볼 것이다."]],"w":"10번 Lua responds to movement(움직임에 반응한다)와 11번 falls asleep(잠이 든다)에서 가져왔어요. awake는 falls 뒤에 오면 '잠이 들다'가 되지 않아요.","c":null},"h":"9a4f94412f"}]},{"u":3,"id":"hk1-03-3","no":3,"ko":"고인돌? 거인돌!","items":[{"n":1,"t":"tf","q":"The hungry animals asked the god Coyote to punish the giants.","ko":"굶주린 동물들은 Coyote 신에게 거인들을 벌해 달라고 부탁했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Eventually, the hungry animals asked the god Coyote to punish the giants.","결국, 굶주린 동물들은 Coyote 신에게 거인들을 벌해줄 것을 부탁했다."]],"w":"4번 문장에 the hungry animals asked the god Coyote to punish the giants가 그대로 있어요.","c":"T"},"h":"00cf77c7cf"},{"n":2,"t":"tf","q":"Coyote invited only the animals to the feast.","ko":"Coyote는 잔치에 동물들만 초대했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"A few days later, Coyote held a great feast and invited all the animals and the giants.","며칠 후, Coyote는 큰 잔치를 열었고 모든 동물들과 거인들을 초대했다."]],"w":"5번 문장에서 Coyote는 모든 동물들과 거인들(the animals and the giants)을 초대했어요. 동물들만 초대한 것이 아니에요.","c":"F"},"h":"ff708d75b4"},{"n":3,"t":"tf","q":"You can see the stone giants in the park if you visit it.","ko":"공원을 방문하면 돌이 된 거인들을 볼 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"If you visit the park, you can see the giants yourself!","만약 공원을 방문한다면, 그 거인들을 직접 볼 수 있다!"]],"w":"12번 문장에서 공원을 방문하면 그 거인들(the giants)을 직접 볼 수 있다고 해요.","c":"T"},"h":"7715754480"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Eventually, the hungry animals asked the god Coyote to punish the giants.)","ko":"결국, 굶주린 동물들은 Coyote 신에게 거인들을 벌해달라고 부탁했다. (eventually는 결국)","opts":["가끔","결국","어제","거의"],"word":"Eventually","r":{"a":"2) 결국","ev":"3~4번 문장","s":[[3,"They drank all the water and took every nut and fruit they saw.","그들은 모든 물을 마시고 그들이 본 모든 견과류와 과일을 먹어버렸다."],[4,"Eventually, the hungry animals asked the god Coyote to punish the giants.","결국, 굶주린 동물들은 Coyote 신에게 거인들을 벌해줄 것을 부탁했다."]],"w":"3번에서 거인들이 물과 열매를 모두 차지했고, 그 끝에 동물들이 부탁하게 돼요. 이어지는 결과를 말하는 eventually = 결국이에요.","c":2},"h":"250dee23d6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The legend is about the park’s huge stone pillars that stand like humans.)","ko":"그 전설은 사람처럼 서 있는 공원의 거대한 돌기둥들에 관한 것이다. (huge는 거대한)","opts":["작은","오래된","거대한","무서운"],"word":"huge","r":{"a":"3) 거대한","ev":"11번 문장","s":[[11,"The legend is about the park’s huge stone pillars that stand like humans.","그 전설은 사람처럼 서 있는 공원의 거대한 돌기둥들에 관한 것이다."]],"w":"거인들이 변한 돌기둥이 사람처럼 서 있다고 했으니 아주 큰 돌기둥이에요. 그래서 huge = 거대한이에요.","c":3},"h":"09840a81e0"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThe legend is about the park’s huge stone pillars that stand like humans.","ko":"밑줄 친 that이 가리키는 것은?","opts":["공원의 거대한 돌기둥들","그 전설","그 공원","사람들"],"sko":"그 전설은 사람처럼 서 있는 공원의 거대한 돌기둥들에 관한 것이다.","r":{"a":"1) 공원의 거대한 돌기둥들","ev":"11번 문장","s":[[11,"The legend is about the park’s huge stone pillars that stand like humans.","그 전설은 사람처럼 서 있는 공원의 거대한 돌기둥들에 관한 것이다."]],"w":"that stand like humans에서 사람처럼 서 있는 것은 바로 앞의 the park’s huge stone pillars(공원의 거대한 돌기둥들)예요. that은 이 돌기둥들을 꾸며 줘요.","c":1},"h":"5970041abd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since that day, they have stood there under the spell.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["그날 이후로 거인들은 그곳을 떠나 다른 곳으로 갔다.","그날 이후로 거인들은 주문을 풀고 자유로워졌다.","그날 이후로 주문은 한 번도 쓰이지 않았다.","그날 이후로 거인들은 주문에 걸린 채 계속 그곳에 서 있다."],"sko":"그날 이후로, 그들은 주문에 걸린 채 그곳에 서 있어 왔다.","r":{"a":"4) 그날 이후로 거인들은 주문에 걸린 채 계속 그곳에 서 있다.","ev":"8~9번 문장","s":[[8,"Suddenly, every giant turned into stone!","갑자기, 모든 거인이 돌로 변했다!"],[9,"Since that day, they have stood there under the spell.","그날 이후로, 그들은 주문에 걸린 채 그곳에 서 있어 왔다."]],"w":"have stood는 그날부터 지금까지 계속 서 있다는 뜻이고, under the spell은 '주문에 걸린 채'예요. 8번에서 거인들이 돌로 변했으니 떠나거나 풀려난 것이 아니에요.","c":4},"h":"963141c956"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The giants lived with animals and took good care of them.","The animals held a feast and invited the giants.","Coyote used a magical spell when the giants started to eat.","Bryce Canyon is a national park in Korea."],"oko":["거인들은 동물들과 살면서 동물들을 잘 돌봤다.","동물들이 잔치를 열고 거인들을 초대했다.","거인들이 먹기 시작했을 때 Coyote가 마법의 주문을 썼다.","브라이스캐니언은 한국에 있는 국립공원이다."],"r":{"a":"3) Coyote used a magical spell when the giants started to eat.","ev":"6~7번 문장","s":[[6,"As soon as the giants arrived, they started to eat like pigs.","거인들은 도착하자마자, 돼지처럼 먹기 시작했다."],[7,"At that moment, Coyote used a magical spell.","그 순간, Coyote가 마법의 주문을 사용했다."]],"w":"6번에서 거인들이 먹기 시작했고, 7번 At that moment(그 순간) Coyote가 마법의 주문을 썼어요. 거인들은 동물들을 신경 쓰지 않았고(2번), 잔치는 Coyote가 열었으며(5번), 브라이스캐니언은 미국에 있어요(10번).","c":3},"h":"79fd4fd77d"},{"n":9,"t":"sum","q":"The giants were (A), so Coyote (B) them at a feast.","ko":"거인들은 (A)했고, 그래서 Coyote는 잔치에서 그들을 (B).","opts":["(A) kind / (B) helped","(A) greedy / (B) punished","(A) greedy / (B) thanked","(A) lonely / (B) punished","(A) hungry / (B) helped"],"oko":["(A) 친절했고 / (B) 도왔다","(A) 욕심이 많았고 / (B) 벌했다","(A) 욕심이 많았고 / (B) 고마워했다","(A) 외로웠고 / (B) 벌했다","(A) 배고팠고 / (B) 도왔다"],"r":{"a":"2) (A) greedy / (B) punished","ev":"1번, 4번, 8번 문장","s":[[1,"A long time ago, there were greedy giants.","먼 옛날에, 욕심 많은 거인들이 있었다."],[4,"Eventually, the hungry animals asked the god Coyote to punish the giants.","결국, 굶주린 동물들은 Coyote 신에게 거인들을 벌해줄 것을 부탁했다."],[8,"Suddenly, every giant turned into stone!","갑자기, 모든 거인이 돌로 변했다!"]],"w":"1번에서 거인들은 욕심이 많았고(greedy), 4번에서 동물들의 부탁으로 벌을 받아(punish) 8번에서 돌이 되었어요. 거인들이 친절했거나 외로웠다는 말은 없고, 도움을 받거나 감사 인사를 받은 것도 아니에요."," ed word? (they bounce their bodies, shake their legs, and wave their arms)","ko":"그들은 몸을 튕기고, 다리를 떨고, 팔을 흔든다. (bounce는 튕기다)","opts":["멈추다","숨기다","튕기다","눕다"],"word":"bounce","r":{"a":"3) 튕기다","ev":"6번 문장","s":[[6,"At the same time, they bounce their bodies, shake their legs, and wave their arms to current popular songs.","그와 동시에, 그들은 최신 인기곡들에 맞춰 몸을 튕기고, 다리를 떨고, 팔을 흔든다."]],"w":"bounce, shake, wave는 모두 춤출 때 몸을 움직이는 동작이에요. 최신 인기곡에 맞춰 몸을 위아래로 튕기는 동작이니 bounce = 튕기다예요.","c":3},"h":"65f6fb783c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Ballet uses planned movements and precise postures.)","ko":"발레는 계획된 동작과 정확한 자세를 활용한다. (precise는 정확한)","opts":["정확한","느린","어두운","시끄러운"],"word":"precise","r":{"a":"1) 정확한","ev":"10번 문장","s":[[10,"Ballet uses planned movements and precise postures.","발레는 계획된 동작과 정확한 자세를 활용한다."]],"w":"발레는 정해 둔 대로 하는 춤이고, 힙합은 자유로운 형태라고 대조돼요(11번). 그래서 precise = 정확한이에요.","c":1},"h":"a1645a0334"},{"n":6,"t":"ref","q":"What does the underlined \"themselves\" refer to?\nHiplet ballerinas use the techniques of ballet, and they also move and express themselves freely with hip-hop motions.","ko":"밑줄 친 themselves가 가리키는 것은?","opts":["발레의 기술들","힙합 동작들","관객들","힙레 발레리나들"],"sko":"힙레 발레리나들은 발레의 기술을 활용하면서, 힙합 동작들로 자유롭게 움직이고 스스로를 표현하기도 한다.","r":{"a":"4) 힙레 발레리나들","ev":"13번 문장","s":[[13,"Hiplet ballerinas use the techniques of ballet, and they also move and express themselves freely with hip-hop motions.","힙레 발레리나들은 발레의 기술을 활용하면서, 힙합 동작들로 자유롭게 움직이고 스스로를 표현하기도 한다."]],"w":"express themselves는 '스스로를 표현하다'예요. 표현하는 사람과 표현되는 대상이 같으므로 주어 they, 즉 힙레 발레리나들을 가리켜요.","c":4},"h":"70210f984d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"And this is what makes hiplet interesting.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["그리고 이것은 힙레를 지루하게 만든다.","그리고 힙레는 이것을 흥미롭게 만든다.","그리고 이것이 힙레를 흥미롭게 만드는 점이다.","그리고 이것은 힙레가 흥미롭지 않다는 뜻이다."],"sko":"그리고 이것이 힙레를 흥미롭게 만든다.","r":{"a":"3) 그리고 이것이 힙레를 흥미롭게 만드는 점이다.","ev":"12번 문장","s":[[12,"And this is what makes hiplet interesting.","그리고 이것이 힙레를 흥미롭게 만든다."]],"w":"what makes hiplet interesting은 '힙레를 흥미롭게 만드는 것'이에요. 주어는 what(~하는 것)이고, 흥미롭게 되는 대상은 힙레예요.","c":3},"h":"1cb5ab18e7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Hiplet is danced only to old classical music.","Hiplet now interests people who did not care about classical ballet before.","Homer Bryant created hip-hop dance.","Ballet and hip-hop are very similar dance forms."],"oko":["힙레는 오래된 클래식 음악에만 맞춰 춘다.","힙레는 이제 이전에 고전 발레에 관심이 없던 사람들의 관심을 끈다.","Homer Bryant는 힙합 춤을 만들었다.","발레와 힙합은 매우 비슷한 춤 형태이다."],"r":{"a":"2) Hiplet now interests people who did not care about classical ballet before.","ev":"15번 문장","s":[[15,"Hiplet now attracts people who were not interested in classical ballet before.","힙레는 이제 이전에 고전 발레에는 관심이 없던 사람들의 마음을 끈다."]],"w":"15번에서 힙레가 이전에 고전 발레에 관심이 없던 사람들의 마음을 끈다고 해요. 힙레는 최신 인기곡에 맞춰 추고(6번), Homer Bryant가 만든 것은 힙레이며(7번), 두 춤은 매우 달라요(9번).","c":2},"h":"c5259a2f52"},{"n":9,"t":"sum","q":"Homer Bryant (A) classical ballet and hip-hop to create hiplet, and many people find it (B).","ko":"Homer Bryant는 힙레를 만들기 위해 고전 발레와 힙합을 (A)했고, 많은 사람들은 그것이 (B)하다고 생각한다.","opts":["(A) separated / (B) eye-catching","(A) combined / (B) boring","(A) combined / (B) eye-catching","(A) separated / (B) boring","(A) hated / (B) new"],"oko":["(A) 분리했고 / (B) 눈길을 끈다","(A) 결합했고 / (B) 지루하다","(A) 결합했고 / (B) 눈길을 끈다","(A) 분리했고 / (B) 지루하다","(A) 싫어했고 / (B) 새롭다"],"r":{"a":"3) (A) combined / (B) eye-catching","ev":"8번, 16번, 17번 문장","s":[[8,"He combined classical ballet and hip-hop dance.","그는 고전 발레와 힙합 춤을 결합했다."],[16,"They say, “Hiplet is different.","그들은 “힙레는 다르다."],[17,"It’s new and eye-catching.”","그것은 새롭고 눈길을 끈다.”라고 말한다."]],"w":"8번에서 Homer Bryant가 고전 발레와 힙합 춤을 결합했고(combined), 16~17번에서 사람들은 힙레가 새롭고 눈길을 끈다(eye-catching)고 말해요. separated, boring, hated는 본문과 반대이거나 없는 내용이에요.","c":3},"h":"298770f052"},{"n":10,"t":"fill","q":"Hiplet dancers use ballet [A] and postures, and they [B] their bodies to current popular songs.","ko":"힙레 무용수들은 발레 [A]과 자세를 활용하고, 최신 인기곡에 맞춰 몸을 [B].","bank":["motions","bounce","genre","bass","classical","perfect"],"bko":{"motions":"동작","bounce":"튕기다","genre":"장르","bass":"베이스","classical":"고전의","perfect":"완벽한"},"r":{"a":"[A] motions, [B] bounce","ev":"5~6번 문장","s":[[5,"Dancers use ballet motions and postures.","무용수들은 발레 동작과 자세를 활용한다."],[6,"At the same time, they bounce their bodies, shake their legs, and wave their arms to current popular songs.","그와 동시에, 그들은 최신 인기곡들에 맞춰 몸을 튕기고, 다리를 떨고, 팔을 흔든다."]],"w":"5번 ballet motions and postures(발레 동작과 자세)와 6번 bounce their bodies(몸을 튕긴다)에서 가져왔어요. genre, bass, classical, perfect는 [A]와 [B] 자리에 문법이나 뜻이 맞지 않아요.","c":null},"h":"1a4d34185f"}]},{"u":4,"id":"hk1-04-1","no":1,"ko":"도넛이 전부가 아니야","items":[{"n":1,"t":"tf","q":"The Munchkins in Oz are excellent farmers.","ko":"오즈의 먼치킨들은 훌륭한 농부들이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They are excellent farmers, but they are much smaller than other people.","그들은 훌륭한 농부들이지만, 다른 사람들보다 훨씬 더 작다."]],"w":"3번 문장에 They are excellent farmers가 있어요. 먼치킨들은 훌륭한 농부이고 다른 사람들보다 훨씬 작아요.","c":"T"},"h":"aaf6ddb673"},{"n":2,"t":"tf","q":"Dorothy’s house is taken to Munchkin Country by a tornado.","ko":"도로시의 집은 회오리바람에 의해 먼치킨 나라로 옮겨진다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In The Wonderful Wizard of Oz, a tornado picks up Dorothy’s house and takes it to a strange place named Munchkin Country.","<오즈의 마법사>에서, 회오리바람은 도로시의 집을 들어 올려 그것을 먼치킨 나라라는 이름의 낯선 곳으로 데려간다."]],"w":"1번 문장에서 회오리바람이 도로시의 집을 들어 올려 먼치킨 나라로 데려간다고 해요.","c":"T"},"h":"498dcea057"},{"n":3,"t":"tf","q":"Someone threw away the extra dough from the hole.","ko":"누군가 구멍에서 나온 여분의 반죽을 버렸다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Instead of throwing away the extra dough from the hole, someone decided to use it.","그 구멍에서 나온 여분의 반죽을 버리는 것 대신, 누군가 그것을 사용하기로 결심했다."]],"w":"9번 문장에서 누군가 여분의 반죽을 버리는 대신(Instead of throwing away) 쓰기로 결심했다고 해요. 버렸다는 말은 반대예요.","c":"F"},"h":"eb009fc513"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They are excellent farmers, but they are much smaller than other people.)","ko":"그들은 훌륭한 농부들이지만, 다른 사람들보다 훨씬 더 작다. (excellent는 훌륭한)","opts":["게으른","낯선","훌륭한","유명한"],"word":"excellent","r":{"a":"3) 훌륭한","ev":"3번 문장","s":[[3,"They are excellent farmers, but they are much smaller than other people.","그들은 훌륭한 농부들이지만, 다른 사람들보다 훨씬 더 작다."]],"w":"3번 문장에서 but 뒤에 '훨씬 작다'가 나와요. but은 앞뒤가 반대일 때 쓰므로, 앞은 좋은 내용이에요. excellent = 훌륭한.","c":3},"h":"a16661e932"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Instead of throwing away the extra dough from the hole, ...)","ko":"그 구멍에서 나온 여분의 반죽을 버리는 대신, ... (extra는 여분의)","opts":["여분의","끈적한","따뜻한","부드러운"],"word":"extra","r":{"a":"1) 여분의","ev":"9번 문장","s":[[9,"Instead of throwing away the extra dough from the hole, someone decided to use it.","그 구멍에서 나온 여분의 반죽을 버리는 것 대신, 누군가 그것을 사용하기로 결심했다."]],"w":"구멍을 낸 뒤 남은 반죽이라서 extra는 '여분의'예요. 이 남은 반죽을 버리는 대신 쓰기로 했다는 흐름이에요.","c":1},"h":"1e721383dc"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is also sometimes used as a nickname for kids.","ko":"밑줄 친 It이 가리키는 것은?","opts":["도로시","'먼치킨'이라는 이름","오즈의 마법사","회오리바람"],"sko":"그것은 가끔 아이들에 대한 별명으로도 쓰인다.","r":{"a":"2) '먼치킨'이라는 이름","ev":"4, 6번 문장","s":[[4,"Since then, when people see something small, they call it a “munchkin.”","그 이후로, 사람들은 무언가 작은 것을 볼 때, 그것을 ‘먼치킨’이라고 부른다."],[6,"It is also sometimes used as a nickname for kids.","그것은 가끔 아이들에 대한 별명으로도 쓰인다."]],"w":"4번에서 작은 것을 '먼치킨'이라고 부른다고 했어요. 6번의 It은 그 이름(munchkin)이고, 아이들의 별명으로도 쓰인다는 뜻이에요.","c":2},"h":"d8ea819850"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of throwing away the extra dough from the hole, someone decided to use it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["누군가 구멍에서 나온 여분의 반죽을 버리기로 결심했다.","누군가 구멍을 없애려고 반죽 전체를 썼다.","누군가 여분의 반죽을 구멍 대신 먹기로 했다.","누군가 구멍에서 나온 여분의 반죽을 버리지 않고 쓰기로 결심했다."],"sko":"그 구멍에서 나온 여분의 반죽을 버리는 대신, 누군가 그것을 사용하기로 결심했다.","r":{"a":"4) 누군가 구멍에서 나온 여분의 반죽을 버리지 않고 쓰기로 결심했다.","ev":"9번 문장","s":[[9,"Instead of throwing away the extra dough from the hole, someone decided to use it.","그 구멍에서 나온 여분의 반죽을 버리는 것 대신, 누군가 그것을 사용하기로 결심했다."]],"w":"Instead of ~ing는 '~하는 대신'이에요. 버리는 대신 쓰기로 했으니 '버리지 않고 쓰기로 결심했다'가 맞아요.","c":4},"h":"08158f97f2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The Munchkins in Oz are much taller than other people.","The word munchkin is used only for donuts.","The Munchkin donut ball came from the extra dough of a donut hole.","Dorothy’s house was taken away by the ocean."],"oko":["오즈의 먼치킨들은 다른 사람들보다 훨씬 크다.","먼치킨이라는 말은 도넛에만 쓰인다.","먼치킨 도넛 볼은 도넛 구멍에서 나온 여분의 반죽에서 나왔다.","도로시의 집은 바다에 휩쓸려 갔다."],"r":{"a":"3) The Munchkin donut ball came from the extra dough of a donut hole.","ev":"8~10번 문장","s":[[8,"To make a donut, a hole is made in the center of some dough.","도넛을 만들기 위해서는, 반죽의 중앙에 구멍이 만들어진다."],[9,"Instead of throwing away the extra dough from the hole, someone decided to use it.","그 구멍에서 나온 여분의 반죽을 버리는 것 대신, 누군가 그것을 사용하기로 결심했다."],[10,"This eventually became a tiny dessert ball and was named the Munchkin.","여분의 반죽은 결국 작은 디저트 볼이 되었고 먼치킨이라고 이름 지어졌다."]],"w":"8~10번에서 도넛의 구멍에서 나온 여분의 반죽이 작은 디저트 볼 먼치킨이 돼요. 먼치킨들은 훨씬 작고(3번), 먼치킨은 도넛 말고도 쓰이고(4~6번), 집은 회오리바람이 옮겼어요(1번).","c":3},"h":"7eb4d51d0a"},{"n":9,"t":"sum","q":"In Oz, the Munchkins are much (A) than other people, so people call (B) things “munchkins.”","ko":"오즈의 먼치킨들은 다른 사람들보다 훨씬 (A)해서, 사람들은 (B) 것들을 ‘먼치킨’이라고 부른다.","opts":["(A) smaller / (B) big","(A) bigger / (B) small","(A) bigger / (B) big","(A) smaller / (B) tasty","(A) smaller / (B) small"],"oko":["(A) 더 작아서 / (B) 큰","(A) 더 커서 / (B) 작은","(A) 더 커서 / (B) 큰","(A) 더 작아서 / (B) 맛있는","(A) 더 작아서 / (B) 작은"],"r":{"a":"5) (A) smaller / (B) small","ev":"3~4번 문장","s":[[3,"They are excellent farmers, but they are much smaller than other people.","그들은 훌륭한 농부들이지만, 다른 사람들보다 훨씬 더 작다."],[4,"Since then, when people see something small, they call it a “munchkin.”","그 이후로, 사람들은 무언가 작은 것을 볼 때, 그것을 ‘먼치킨’이라고 부른다."]],"w":"3번에서 먼치킨들은 다른 사람들보다 훨씬 작아요(smaller). 그래서 4번에서 사람들은 작은(small) 것을 먼치킨이라고 불러요.","c":5},"h":"ff1648dc33"},{"n":10,"t":"fill","q":"To make a donut, a [A] is made in the dough, and the extra dough became a tiny [B] ball.","ko":"도넛을 만들려면 반죽에 [A]이 만들어지고, 여분의 반죽은 작은 [B] 볼이 되었다.","bank":["hole","dessert","cats","farmers","nickname","kids"],"bko":{"hole":"구멍","dessert":"디저트","cats":"고양이들","farmers":"농부들","nickname":"별명","kids":"아이들"},"r":{"a":"[A] hole, [B] dessert","ev":"8, 10번 문장","s":[[8,"To make a donut, a hole is made in the center of some dough.","도넛을 만들기 위해서는, 반죽의 중앙에 구멍이 만들어진다."],[10,"This eventually became a tiny dessert ball and was named the Munchkin.","여분의 반죽은 결국 작은 디저트 볼이 되었고 먼치킨이라고 이름 지어졌다."]],"w":"8번에서 도넛을 만들 때 반죽에 구멍(hole)을 만들고, 10번에서 여분의 반죽이 작은 디저트(dessert) 볼이 돼요. cats, farmers, kids, nickname은 먼치킨의 다른 쓰임이라 도넛 만드는 과정과 달라요.","c":null},"h":"cf80b2bdf3"}]},{"u":4,"id":"hk1-04-2","no":2,"ko":"영화에선 히어로, 현실에선?","items":[{"n":1,"t":"tf","q":"Wolverines are only 70 centimeters long, but they are very strong for their size.","ko":"울버린은 길이가 70센티미터밖에 되지 않지만, 크기에 비해 매우 강하다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They are only 70 centimeters long, but they are extremely strong for their size.","그것들은 길이가 70센티미터밖에 되지 않지만, 크기에 비해 매우 강하다."]],"w":"6번 문장에 only 70 centimeters long, but extremely strong for their size가 나와요.","c":"T"},"h":"1c7a850e87"},{"n":2,"t":"tf","q":"Wolverines are afraid of bears and wolves and walk away from them.","ko":"울버린은 곰과 늑대를 무서워하여 그것들에게서 떠나 버린다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"When they come near, even bears and wolves stop eating and walk away!","그것들이 가까이 오면, 곰과 늑대조차 먹기를 멈추고 떠나 버린다!"]],"w":"11번 문장에서 울버린이 가까이 오면 곰과 늑대가 먹기를 멈추고 떠나 버려요. 떠나는 쪽은 울버린이 아니에요.","c":"F"},"h":"30eb156528"},{"n":3,"t":"tf","q":"Wolverines often attack large animals such as reindeer and sheep.","ko":"울버린은 종종 순록과 양 같은 큰 동물들을 공격한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"They often attack and kill large animals, such as reindeer and sheep.","그것들은 종종 순록과 양과 같
