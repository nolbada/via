<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>리딩그라피 3 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>

<script>
var P=[{"u":1,"id":"rg3-01-1","no":1,"ko":"유화 물감에 달걀노른자를 섞은 이유는?","items":[{"n":1,"t":"tf","q":"Famous artists like Botticelli and Leonardo da Vinci used egg yolk in their paint.","ko":"보티첼리와 레오나르도 다빈치 같은 유명한 화가들은 물감에 달걀노른자를 사용했다.","r":{"a":"T (본문과 맞는 내용)","w":"2~3번 문장에서 보티첼리와 다빈치 같은 유명한 화가들이 물감에 달걀노른자를 사용했다고 함. 본문과 일치.","c":"T","ev":"2~3번 문장","s":[[2,"But, famous artists like Botticelli and Leonardo da Vinci used something different.","하지만, 보티첼리와 레오나르도 다빈치와 같은 유명한 화가들은 무언가 다른 것을 이용했다."],[3,"They used egg yolk in their paint.","그들은 그들의 물감에 달걀노른자를 사용했다."]]},"h":"5c86fea148"},{"n":2,"t":"tf","q":"Egg yolk made the oil paint thinner.","ko":"달걀노른자는 유화 물감을 더 묽게 만들었다.","r":{"a":"F (본문과 다른 내용)","w":"6번 문장에서 달걀노른자를 섞으면 the paint becomes thicker(더 걸쭉해진다)라고 함. 묽어진다는 말은 반대 내용.","c":"F","ev":"6번 문장","s":[[6,"But if we mix egg yolk with oil paints, the paint becomes thicker.","하지만 만약 우리가 달걀노른자를 유화 물감과 섞는다면, 물감은 더 걸쭉해진다."]]},"h":"1de1fe4775"},{"n":3,"t":"tf","q":"Egg yolk protected the paint from water.","ko":"달걀노른자는 물로부터 물감을 보호했다.","r":{"a":"T (본문과 맞는 내용)","w":"10번 문장 It protected the paint from water.와 같은 내용. It은 9번의 egg yolk.","c":"T","ev":"10번 문장","s":[[10,"It protected the paint from water.","그것은 물로부터 물감을 보호했다."]]},"h":"fa8c55dc5d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Oil paint by itself changes color and wrinkles as it dries.)","ko":"밑줄 친 단어의 뜻은? (유화 물감 자체로는 마르면서 색이 변하고 wrinkles.)","opts":["번지다","녹다","주름이 지다","굳어 버리다"],"word":"wrinkles","r":{"a":"3) 주름이 지다","w":"5번 문장에서 유화 물감은 마르면서 색이 변하고 wrinkles한다. 7번의 crack(금이 가다)과 함께 나오는 말로, wrinkle = 주름이 지다.","c":3,"ev":"5번 문장","s":[[5,"Oil paint by itself changes color and wrinkles as it dries.","유화 물감 자체로는 마르면서 색이 변하고 주름이 진다."]]},"h":"84f351a772"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, egg yolk acted as a guard for the paint.)","ko":"밑줄 친 단어의 뜻은? (또한, 달걀노른자는 물감의 guard로 작용했다.)","opts":["보호물","장식","재료","경쟁자"],"word":"guard","r":{"a":"1) 보호물","w":"9번 문장 acted as a guard 다음 10번에서 물로부터 물감을 protect(보호하다)했다고 함. 그래서 guard = 보호물.","c":1,"ev":"9~10번 문장","s":[[9,"Also, egg yolk acted as a guard for the paint.","또한, 달걀노른자는 물감의 보호물로써 작용했다."],[10,"It protected the paint from water.","그것은 물로부터 물감을 보호했다."]]},"h":"5f3aada328"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis helped the paint not crack or wrinkle.","ko":"밑줄 친 This이 가리키는 것은?","pron":"This","opts":["달걀노른자를 섞어서 물감이 더 걸쭉해진 것","유화 물감이 마르면서 색이 변하는 것","화가들이 물감을 새로 발명한 것","물감이 물에 닿는 것"],"sko":"이것은 물감이 금이 가거나 주름지지 않도록 도와주었다.","r":{"a":"1) 달걀노른자를 섞어서 물감이 더 걸쭉해진 것","w":"6번에서 달걀노른자를 유화 물감과 섞으면 물감이 걸쭉해진다고 했고, 7번 This는 그렇게 섞은 것을 가리킴. 그 덕분에 물감이 금이 가거나 주름지지 않게 되었다는 내용.","c":1,"ev":"6~7번 문장","s":[[6,"But if we mix egg yolk with oil paints, the paint becomes thicker.","하지만 만약 우리가 달걀노른자를 유화 물감과 섞는다면, 물감은 더 걸쭉해진다."],[7,"This helped the paint not crack or wrinkle.","이것은 물감이 금이 가거나 주름지지 않도록 도와주었다."]],"k":"This = 달걀노른자를 섞어서 물감이 더 걸쭉해진 것"},"h":"a6196171e2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without it, we might not have the chance to see the famous artists’ great paintings today!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["달걀노른자 덕분에 화가들이 유명해질 기회를 얻었다.","달걀노른자가 없었다면 오늘날 유명한 화가들의 훌륭한 그림을 못 볼 수도 있었다.","오늘날 유명한 화가들은 달걀노른자 없이 그림을 그린다.","달걀노른자가 없어서 화가들이 그림을 그릴 기회가 없었다."],"sko":"그것 없이는, 우리는 오늘날 유명한 화가들의 위대한 작품들을 볼 기회가 없을지도 모른다!","r":{"a":"2) 달걀노른자가 없었다면 오늘날 유명한 화가들의 훌륭한 그림을 못 볼 수도 있었다.","w":"13번 Without it은 '그것(달걀노른자) 없이는'. 달걀노른자가 없었다면 유명한 화가들의 그림을 지금 볼 기회가 없을지도 모른다는 뜻.","c":2,"ev":"12~13번 문장","s":[[12,"This shows how important egg yolk was in art history.","이것은 미술사에서 달걀노른자가 얼마나 중요했는지를 보여준다."],[13,"Without it, we might not have the chance to see the famous artists’ great paintings today!","그것 없이는, 우리는 오늘날 유명한 화가들의 위대한 작품들을 볼 기회가 없을지도 모른다!"]]},"h":"ea57daa86c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Oil paint by itself does not change color when it dries.","Egg yolk made the paint crack and wrinkle more.","Egg yolk let water get into the paint.","The art stayed in good condition because egg yolk was mixed with the paint."],"oko":["유화 물감 자체로는 마르면서 색이 변하지 않는다.","달걀노른자는 물감이 더 금이 가고 주름지게 만들었다.","달걀노른자 때문에 물이 물감 속으로 들어갔다.","달걀노른자를 물감에 섞었기 때문에 예술품이 좋은 상태로 남았다."],"r":{"a":"4) The art stayed in good condition because egg yolk was mixed with the paint. (달걀노른자를 물감에 섞었기 때문에 예술품이 좋은 상태로 남았다.)","w":"6~8번에서 달걀노른자를 섞은 물감은 걸쭉해져 금이 가거나 주름지지 않았고 예술품이 좋은 상태로 남았다. ①은 5번과 반대, ②는 7번과 반대, ③은 11번과 반대.","c":4,"ev":"6~8번 문장","s":[[6,"But if we mix egg yolk with oil paints, the paint becomes thicker.","하지만 만약 우리가 달걀노른자를 유화 물감과 섞는다면, 물감은 더 걸쭉해진다."],[7,"This helped the paint not crack or wrinkle.","이것은 물감이 금이 가거나 주름지지 않도록 도와주었다."],[8,"As a result, the art stayed in good condition.","결과적으로, 예술품은 좋은 상태로 유지되었다."]]},"h":"6a517464b2"},{"n":9,"t":"sum","q":"The paint mix with egg yolk did not turn (A) over time, so the paintings (B) for a long time.","ko":"달걀노른자를 섞은 물감은 시간이 지나도 (A)(으)로 변하지 않았고, 그림들은 오랫동안 (B).","opts":["(A) blue / (B) lasted","(A) yellow / (B) lasted","(A) brown / (B) lasted","(A) yellow / (B) disappeared","(A) blue / (B) disappeared"],"oko":["(A) 파란색 / (B) 오래갔다","(A) 노란색 / (B) 오래갔다","(A) 갈색 / (B) 오래갔다","(A) 노란색 / (B) 사라졌다","(A) 파란색 / (B) 사라졌다"],"r":{"a":"2) (A) yellow / (B) lasted ((A) 노란색 / (B) 오래갔다)","w":"11번 문장: 물감 혼합체는 시간이 지나도 노란색으로 변하지 않았고(didn't turn yellow), 그림들은 오랫동안 지속되었다(lasted a long time).","c":2,"ev":"11번 문장","s":[[11,"So the paint mix didn’t turn yellow over time, and the paintings lasted a long time.","그래서 물감 혼합체는 시간이 지나면서 노란색으로 변하지 않았고, 그림들은 오랫동안 지속되었다."]]},"h":"bafd73d974"},{"n":10,"t":"fill","q":"This shows how [A] egg yolk was in art [B].","ko":"이것은 미술 [B]에서 달걀노른자가 얼마나 [A] 것이었는지를 보여준다.","bank":["important","history","protect","crack","wrinkle","mix"],"bko":{"important":"중요한","history":"역사","protect":"보호하다","crack":"금이 가다","wrinkle":"주름이 지다","mix":"섞다"},"r":{"a":"[A] important (중요한), [B] history (역사)","w":"12번 문장 This shows how important egg yolk was in art history.에서 가져옴. protect, crack, wrinkle, mix는 동사라 how ___ egg yolk was나 in art ___ 자리에 맞지 않음.","c":null,"ev":"12번 문장","s":[[12,"This shows how important egg yolk was in art history.","이것은 미술사에서 달걀노른자가 얼마나 중요했는지를 보여준다."]]},"h":"0ce675b628"}]},{"u":1,"id":"rg3-01-2","no":2,"ko":"탁구도 테니스도 아닌 피클볼의 정체는?","items":[{"n":1,"t":"tf","q":"A pickleball court is only a quarter the size of a tennis court.","ko":"피클볼 코트는 테니스 코트 크기의 단지 4분의 1이다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장 only a quarter the size of a tennis court와 같은 내용.","c":"T","ev":"4번 문장","s":[[4,"Also, a pickleball court is only a quarter the size of a tennis court, so it doesn’t take up a lot of space.","또한, 피클볼 코트는 테니스 코트 크기의 단지 4분의 1 크기여서 많은 공간을 차지하지 않아요."]]},"h":"c4e9e8bfe0"},{"n":2,"t":"tf","q":"To play pickleball, you need a square paddle and a heavy metal ball.","ko":"피클볼을 하려면 정사각형 라켓과 무거운 금속 공이 필요하다.","r":{"a":"F (본문과 다른 내용)","w":"3번 문장에서 필요한 것은 square paddle과 light plastic ball(가벼운 플라스틱 공). 무거운 금속 공이 아님.","c":"F","ev":"3번 문장","s":[[3,"To play, you need a square paddle and a light plastic ball with holes in it.","경기를 하기 위해, 여러분은 정사각형의 라켓과 구멍이 나 있는 가벼운 플라스틱 공이 필요해요."]]},"h":"777f4b4d92"},{"n":3,"t":"tf","q":"In the past, pickleball was mostly enjoyed by the elderly.","ko":"과거에 피클볼은 주로 노인들이 즐겼다.","r":{"a":"T (본문과 맞는 내용)","w":"7번 문장 In the past, pickleball was mostly enjoyed by the elderly. 와 같음.","c":"T","ev":"7번 문장","s":[[7,"In the past, pickleball was mostly enjoyed by the elderly.","과거에, 피클볼은 주로 노인들에 의해 즐겨졌어요."]]},"h":"0936f6332f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Pickleball is popular in the U.S. because it is easy to learn and gentle on the body.)","ko":"밑줄 친 단어의 뜻은? (피클볼은 배우기 쉽고 몸에 gentle해서 미국에서 인기가 있다.)","opts":["위험한","(몸에) 무리가 없는, 순한","비싼","시끄러운"],"word":"gentle","r":{"a":"2) (몸에) 무리가 없는, 순한","w":"5번에서 easy to learn(배우기 쉬운)과 함께 나오고, 6번에서 관절이 약한 사람들에게 좋다고 함. 그래서 gentle on the body = 몸에 무리가 가지 않는.","c":2,"ev":"5~6번 문장","s":[[5,"Pickleball is popular in the U.S. because it is easy to learn and gentle on the body.","피클볼은 배우기 쉽고 몸에 무리가 가지 않기 때문에 미국에서 인기가 있어요."],[6,"This makes it great for people with weak joints, especially for older people.","이는 관절이 약한 사람들, 특히 노년층에게 좋아요."]]},"h":"1005b984f0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the number of players under the age of 24 is increasing fast.)","ko":"밑줄 친 단어의 뜻은? (24세 이하의 선수 수가 빠르게 increasing하고 있다.)","opts":["줄어드는","멈추는","사라지는","증가하는"],"word":"increasing","r":{"a":"4) 증가하는","w":"9번에서 젊은 선수가 늘고 있다는 흐름(8번 young people도 한다). increase = 증가하다. 반대말은 decrease(줄다).","c":4,"ev":"8~9번 문장","s":[[8,"But now, young people are picking up the paddle too!","하지만 이제, 젊은 사람들도 라켓을 집어 들고 있어요!"],[9,"Recently, almost half of the players were under 55, and the number of players under the age of 24 is increasing fast.","최근, 선수들의 거의 절반은 55세 이하였으며, 24세 이하의 선수 수가 빠르게 증가하고 있어요."]]},"h":"ad4da47421"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis makes it great for people with weak joints, especially for older people.","ko":"밑줄 친 it이 가리키는 것은?","pron":"it","opts":["피클볼","관절","노년층","테니스"],"sko":"이는 관절이 약한 사람들, 특히 노년층에게 좋아요.","r":{"a":"1) 피클볼","w":"5번에서 피클볼이 배우기 쉽고 몸에 무리가 가지 않는다고 했고, 6번 This makes it great에서 it은 피클볼. 관절이 약한 사람에게 좋은 것은 피클볼임.","c":1,"ev":"5~6번 문장","s":[[5,"Pickleball is popular in the U.S. because it is easy to learn and gentle on the body.","피클볼은 배우기 쉽고 몸에 무리가 가지 않기 때문에 미국에서 인기가 있어요."],[6,"This makes it great for people with weak joints, especially for older people.","이는 관절이 약한 사람들, 특히 노년층에게 좋아요."]],"k":"it = 피클볼"},"h":"5133a96758"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You might enjoy this amazing sport for people of all ages.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["이 놀라운 스포츠는 나이 많은 사람들만 즐길 수 있다.","여러분은 모든 연령대를 위한 이 놀라운 스포츠를 즐길지도 모른다.","여러분은 이 놀라운 스포츠를 하기에는 이미 나이가 너무 많다.","모든 사람이 이 놀라운 스포츠를 이미 즐기고 있다."],"sko":"여러분은 모든 연령대의 사람들을 위한 이 놀라운 스포츠를 즐길지도 몰라요.","r":{"a":"2) 여러분은 모든 연령대를 위한 이 놀라운 스포츠를 즐길지도 모른다.","w":"11번 might enjoy는 리는 harmful 화학 물질이 들어 있었다.)","opts":["도움이 되는","해로운","흔한","아름다운"],"word":"harmful","r":{"a":"2) 해로운","w":"3번 But 뒤에서 색이 인기 있다는 앞 내용과 반대로 나쁜 이야기가 나옴. 그래서 harmful chemical = 해로운 화학 물질.","c":2,"ev":"3번 문장","s":[[3,"But emerald green had a harmful chemical called arsenic in it.","그러나 에메랄드그린 색에는 비소라고 불리는 해로운 화학 물질이 들어 있었다."]]},"h":"6e2ca2c929"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Just be careful and be aware of the danger.)","ko":"밑줄 친 단어의 뜻은? (단지 조심하고 그 위험을 aware 하세요.)","opts":["무서워하는","잊고 있는","알고 있는, 인식하는","자랑스러워하는"],"word":"aware","r":{"a":"3) 알고 있는, 인식하는","w":"12번에서 be careful(조심하다)과 함께 위험을 알고 있으라는 뜻. be aware of = ~을 알다, 인식하다.","c":3,"ev":"12번 문장","s":[[12,"Just be careful and be aware of the danger.”","단지 조심하시고 그 위험을 인식해 두세요.”라고 말한다."]]},"h":"8f75d21921"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nPeople used it everywhere, from clothes to book covers.","ko":"밑줄 친 it이 가리키는 것은?","pron":"it","opts":["에메랄드그린 색","옷","책 표지","900개의 책갈피"],"sko":"사람들은 옷에서부터 책 표지까지, 모든 곳에 그것을 사용했다.","r":{"a":"1) 에메랄드그린 색","w":"1번에서 에메랄드그린이라는 색이 인기 있었다고 했고, 2번 People used it everywhere에서 it은 그 색. 옷과 책 표지는 그 색을 사용한 곳.","c":1,"ev":"1~2번 문장","s":[[1,"In the 1800s, a color called emerald green was very popular.","1800년대에, 에메랄드그린이라고 불리는 색이 매우 인기가 있었다."],[2,"People used it everywhere, from clothes to book covers.","사람들은 옷에서부터 책 표지까지, 모든 곳에 그것을 사용했다."]],"k":"it = 에메랄드그린 색"},"h":"549f99fd85"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The books aren’t too dangerous, but touching them often could be bad.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["이 책들이 아주 위험하지는 않지만, 자주 만지는 것은 나쁠 수 있다.","이 책들은 매우 위험해서 절대 만지면 안 된다.","이 책들은 전혀 위험하지 않아서 얼마든지 만져도 된다.","이 책들은 위험하지 않지만 읽으면 나쁠 수 있다."],"sko":"그 책들은 아주 위험하지는 않지만, 그것들을 자주 만지는 것은 나쁠 수 있다.","r":{"a":"1) 이 책들이 아주 위험하지는 않지만, 자주 만지는 것은 나쁠 수 있다.","w":"aren’t too dangerous는 '너무(아주) 위험하지는 않다', but 뒤에 자주 만지는 것은 나쁠 수 있다는 내용. 읽는 것은 나오지 않음.","c":1,"ev":"10번 문장","s":[[10,"The books aren’t too dangerous, but touching them often could be bad.","그 책들은 아주 위험하지는 않지만, 그것들을 자주 만지는 것은 나쁠 수 있다."]]},"h":"836fc697ef"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Emerald green was first used in the 1900s.","The bookmarks were sent only to the U.S.","Books with arsenic were also found in other places.","Melissa Tedone studied old books from the 18th century."],"oko":["에메랄드그린은 1900년대에 처음 사용되었다.","책갈피는 미국에만 보내졌다.","비소가 있는 책들이 다른 장소에서도 발견되었다.","Melissa Tedone은 18세기의 오래된 책들을 연구했다."],"r":{"a":"3) Books with arsenic were also found in other places. (비소가 있는 책들이 다른 장소에서도 발견되었다.)","w":"9번 문장 books with arsenic were found in other places too와 같음. ①은 1번(1800년대), ②는 8번(미국과 18개 다른 나라), ④는 4번(19세기)과 다름.","c":3,"ev":"9번 문장","s":[[9,"As a result, books with arsenic were found in other places too.","그 결과, 다른 장소들에서도 비소가 있는 책들이 발견되었다."]]},"h":"2271eac46b"},{"n":9,"t":"sum","q":"So Melissa started a (A) to find more of these books around the (B).","ko":"그래서 Melissa는 이 책들을 (B) 곳곳에서 더 많이 찾아내기 위해 (A)을(를) 시작했다.","opts":["(A) project / (B) world","(A) game / (B) world","(A) project / (B) house","(A) game / (B) house","(A) trip / (B) world"],"oko":["(A) 프로젝트 / (B) 세계","(A) 게임 / (B) 세계","(A) 프로젝트 / (B) 집","(A) 게임 / (B) 집","(A) 여행 / (B) 세계"],"r":{"a":"1) (A) project / (B) world ((A) 프로젝트 / (B) 세계)","w":"6번 문장 So Melissa started a project to find more of these books around the world.에서 가져옴.","c":1,"ev":"6번 문장","s":[[6,"So Melissa started a project to find more of these books around the world.","그래서 Melissa는 세계 곳곳에서 이 책들을 더 많이 찾아내기 위해 한 프로젝트를 시작했다."]]},"h":"5f95e64bb4"},{"n":10,"t":"fill","q":"In the 1800s, a [A] called emerald green was very [B].","ko":"1800년대에, 에메랄드그린이라고 불리는 [A]은(는) 매우 [B] 것이었다.","bank":["color","popular","send","throw","touch","find"],"bko":{"color":"색","popular":"인기 있는","send":"보내다","throw":"던지다","touch":"만지다","find":"찾다"},"r":{"a":"[A] color (색), [B] popular (인기 있는)","w":"1번 문장 In the 1800s, a color called emerald green was very popular.에서 가져옴. send, throw, touch, find는 동사라 a ___ called나 very ___ 자리에 맞지 않음.","c":null,"ev":"1번 문장","s":[[1,"In the 1800s, a color called emerald green was very popular.","1800년대에, 에메랄드그린이라고 불리는 색이 매우 인기가 있었다."]]},"h":"390e0053c9"}]},{"u":2,"id":"rg3-02-1","no":1,"ko":"여름에도 모기가 없는 나라가 있다고?","items":[{"n":1,"t":"tf","q":"Mosquitoes can’t survive in Iceland.","ko":"모기는 아이슬란드에서 살아남을 수 없다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장 Mosquitoes can’t survive there.에서 there는 아이슬란드. 본문과 일치.","c":"T","ev":"6번 문장","s":[[6,"Mosquitoes can’t survive there.","모기는 그곳에서 살아남을 수 없어요."]]},"h":"7ed6405d40"},{"n":2,"t":"tf","q":"Mosquitoes can’t be found in Greenland and Norway.","ko":"그린란드와 노르웨이에서는 모기를 찾을 수 없다.","r":{"a":"F (본문과 다른 내용)","w":"8번 문장에서 mosquitoes can easily be found in other cold countries, like Greenland and Norway(쉽게 찾을 수 있다)라고 함. 찾을 수 없다는 말은 반대 내용.","c":"F","ev":"8번 문장","s":[[8,"However, mosquitoes can easily be found in other cold countries, like Greenland and Norway.","하지만, 모기는 그린란드나 노르웨이와 같은 다른 추운 나라들에서 쉽게 찾을 수 있어요."]]},"h":"5fdbb39046"},{"n":3,"t":"tf","q":"Mosquitoes kill about 725,000 people per year.","ko":"모기는 해마다 약 725,000명의 사람들을 죽음에 이르게 한다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장 They kill about 725,000 people per year.와 같은 내용. They는 3번의 mosquitoes.","c":"T","ev":"4번 문장","s":[[4,"They kill about 725,000 people per year.","그것들은 해마다 약 725,000명의 사람들을 죽음에 이르게 해요."]]},"h":"afe5f4e32b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Mosquitoes can’t survive there.)","ko":"밑줄 친 단어의 뜻은? (모기는 그곳에서 survive할 수 없다.)","opts":["도망치다","살아남다","퍼지다","숨다"],"word":"survive","r":{"a":"2) 살아남다","w":"5번에서 아이슬란드 사람들은 걱정 없다고 하고, 6번이 그 이유. 모기가 그곳에서 살아남을 수 없기 때문. survive = 살아남다.","c":2,"ev":"5~6번 문장","s":[[5,"But people in Iceland don’t have to worry about them!","하지만 아이슬란드의 사람들은 그것들에 대해 걱정할 필요가 없어요!"],[6,"Mosquitoes can’t survive there.","모기는 그곳에서 살아남을 수 없어요."]]},"h":"8b4705739a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If you want to escape from mosquitoes in summer, why don’t you visit Iceland?)","ko":"밑줄 친 단어의 뜻은? (여름에 모기로부터 escape하고 싶다면 아이슬란드를 방문하는 게 어때요?)","opts":["찾다","즐기다","방문하다","도망치다"],"word":"escape","r":{"a":"4) 도망치다","w":"12번에서 모기가 없는 아이슬란드를 방문하라고 권하고, 13번에서 모기에 물리지 않는다고 함. escape from mosquitoes = 모기로부터 도망치다.","c":4,"ev":"12~13번 문장","s":[[12,"If you want to escape from mosquitoes in summer, why don’t you visit Iceland?","만약 여러분이 여름에 모기로부터 도망치고 싶다면, 아이슬란드를 방문하는 것은 어떤가요?"],[13,"You can enjoy the beautiful nature and won’t get any mosquito bites.","여러분은 아름다운 자연을 즐길 수 있고 모기에 물린 상처는 하나도 얻지 않을 거예요."]]},"h":"fb06d79f8e"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nBut people in Iceland don’t have to worry about them!","ko":"밑줄 친 them이 가리키는 것은?","opts":["말라리아와 같은 병","아이슬란드 사람들","모기","과학자들"],"sko":"하지만 아이슬란드의 사람들은 그것들에 대해 걱정할 필요가 없어요!","r":{"a":"3) 모기","w":"3~4번에서 모기(mosquitoes)와 그것들(They)이 계속 이야기됨. 5번 them은 아이슬란드 사람들이 걱정하지 않아도 되는 모기들.","c":3,"ev":"3~5번 문장","s":[[3,"Mosquitoes are insects that can spread diseases, like malaria.","모기는 말라리아와 같은 병을 퍼트릴 수 있는 곤충이에요."],[4,"They kill about 725,000 people per year.","그것들은 해마다 약 725,000명의 사람들을 죽음에 이르게 해요."],[5,"But people in Iceland don’t have to worry about them!","하지만 아이슬란드의 사람들은 그것들에 대해 걱정할 필요가 없어요!"]]},"h":"8dbfe89172"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, for mosquitoes, the temperature in Iceland changes too quickly to hide from the cold.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["아이슬란드의 기온은 모기가 추위를 피해 숨기에는 너무 빨리 변한다.","아이슬란드의 기온은 너무 높아서 모기가 숨을 필요가 없다.","모기들은 너무 빨리 움직여서 추위로부터 숨을 수 있다.","아이슬란드의 기온은 느리게 변해서 모기가 숨기 쉽다."],"sko":"하지만 모기들에게, 아이슬란드의 기온은 너무 빨리 변해서 추위로부터 숨을 수 없어요.","r":{"a":"1) 아이슬란드의 기온은 모기가 추위를 피해 숨기에는 너무 빨리 변한다.","w":"too quickly to hide는 '너무 빨리 변해서 숨을 수 없다'. 10번의 다른 나라는 얼음 아래에 숨을 수 있지만 아이슬란드는 기온이 너무 빨리 변해 숨을 수 없다는 뜻.","c":1,"ev":"10~11번 문장","s":[[10,"In other countries, mosquitoes can hide under the ice in the winter and come out during the summer.","다른 나라에서, 모기들은 겨울철에는 빙판 아래에 숨었다가 여름에 나올 수 있어요."],[11,"However, for mosquitoes, the temperature in Iceland changes too quickly to hide from the cold.","하지만 모기들에게, 아이슬란드의 기온은 너무 빨리 변해서 추위로부터 숨을 수 없어요."]]},"h":"25cade2f97"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Scientists think Iceland is too hot for mosquitoes.","In Iceland, you won’t get any mosquito bites.","Mosquitoes are the safest animals in the world.","Mosquitoes in Iceland live under the snow all year."],"oko":["과학자들은 아이슬란드가 모기에게 너무 덥다고 생각한다.","아이슬란드에서는 모기에 물린 상처를 하나도 얻지 않을 것이다.","모기는 세계에서 가장 안전한 동물이다.","아이슬란드의 모기는 일 년 내내 눈 아래에서 산다."],"r":{"a":"2) In Iceland, you won’t get any mosquito bites. (아이슬란드에서는 모기에 물린 상처를 하나도 얻지 않을 것이다.)","w":"13번 문장 won’t get any mosquito bites(모기에 물린 상처는 하나도 얻지 않을 것)와 같음. ①은 7번(너무 추움), ③은 1~2번(가장 위험한 동물), ④는 11번(아이슬란드에선 숨을 수 없음)과 다름.","c":2,"ev":"13번 문장","s":[[13,"You can enjoy the beautiful nature and won’t get any mosquito bites.","여러분은 아름다운 자연을 즐길 수 있고 모기에 물린 상처는 하나도 얻지 않을 거예요."]]},"h":"0817fec142"},{"n":9,"t":"sum","q":"In other countries, mosquitoes can hide under the (A) in the (B) and come out during the summer.","ko":"다른 나라에서, 모기들은 (B)에는 (A) 아래에 숨었다가 여름에 나올 수 있다.","opts":["(A) ice / (B) winter","(A) ice / (B) night","(A) rock / (B) winter","(A) rock / (B) night","(A) ice / (B) spring"],"oko":["(A) 빙판 / (B) 겨울","(A) 빙판 / (B) 밤","(A) 바위 / (B) 겨울","(A) 바위 / (B) 밤","(A) 빙판 / (B) 봄"],"r":{"a":"1) (A) ice / (B) winter ((A) 빙판 / (B) 겨울)","w":"10번 문장: 다른 나라에서 모기들은 겨울에 빙판(ice) 아래에 숨었다가 여름에 나온다.","c":1,"ev":"10번 문장","s":[[10,"In other countries, mosquitoes can hide under the ice in the winter and come out during the summer.","다른 나라에서, 모기들은 겨울철에는 빙판 아래에 숨었다가 여름에 나올 수 있어요."]]},"h":"3c1cda39bc"},{"n":10,"t":"fill","q":"Mosquitoes are [A] that can [B] diseases, like malaria.","ko":"모기는 말라리아와 같은 병을 [B] 수 있는 [A]이다.","bko":{"insects":"곤충","spread":"퍼트리다","hide":"숨다","visit":"방문하다","countries":"나라들","summer":"여름"},"bank":["insects","spread","hide","visit","countries","summer"],"r":{"a":"[A] insects (곤충), [B] spread (퍼트리다)","w":"3번 Mosquitoes are insects that can spread diseases, like malaria에서 가져옴. hide(숨다)와 visit(방문하다)는 병(diseases)을 어떻게 한다는 말과 어울리지 않고, countries(나라들)와 summer(여름)는 모기가 무엇인지 설명하는 [A] 자리에 맞지 않음.","c":null,"ev":"3번 문장","s":[[3,"Mosquitoes are insects that can spread diseases, like malaria.","모기는 말라리아와 같은 병을 퍼트릴 수 있는 곤충이에요."]]},"h":"fbe9c7e710"}]},{"u":2,"id":"rg3-02-2","no":2,"ko":"셀피 한 장에 목숨을 걸어도 될까?","items":[{"n":1,"t":"tf","q":"Signs for safety are everywhere, but they are often ignored.","ko":"안전을 위한 표지판은 어디에나 있지만 자주 무시된다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장 Signs for safety are everywhere, but they are often ignored.와 같은 내용.","c":"T","ev":"2번 문장","s":[[2,"Signs for safety are everywhere, but they are often ignored.","안전을 위한 표지판은 어디에나 있지만, 그것들은 자주 무시된다."]]},"h":"3d826d361b"},{"n":2,"t":"tf","q":"Seeing wild animals in zoos makes them look more real and dangerous.","ko":"동물원에서 야생 동물을 보면 동물들이 더 현실적이고 더 위험해 보인다.","r":{"a":"F (본문과 다른 내용)","w":"5번 문장에서 동물원 같은 곳에서 자주 봐서 less real and dangerous(덜 현실적이고 덜 위험해) 보인다고 함. more가 아니라 less라서 반대.","c":"F","ev":"5번 문장","s":[[5,"We often see wild animals in places like zoos, so the animals seem less real and dangerous.","우리는 동물원과 같은 장소에서 야생 동물들을 자주 봐서 동물들이 덜 현실적이고 덜 위험해 보인다."]]},"h":"792f369d5d"},{"n":3,"t":"tf","q":"Getting too close to animals also puts them in danger.","ko":"동물들에게 너무 가까이 가는 것은 동물들도 위험에 빠뜨린다.","r":{"a":"T (본문과 맞는 내용)","w":"11번 문장 Getting too close to animals also puts them in danger와 같음. them은 동물들.","c":"T","ev":"11번 문장","s":[[11,"Getting too close to animals also puts them in danger because they might be killed to protect people.","동물들에게 너무 가까이 가는 것은 사람을 보호하기 위해 동물들이 죽게 될지도 모르기 때문에 동물들도 위험에 빠뜨린다."]]},"h":"c2d17a45bd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Signs for safety are everywhere, but they are often ignored.)","ko":"밑줄 친 단어의 뜻은? (안전을 위한 표지판은 어디에나 있지만 자주 ignored된다.)","opts":["무시되다","지켜지다","설치되다","사라지다"],"word":"ignored","r":{"a":"1) 무시되다","w":"2번 but 뒤에서 표지판이 있는데도 3번에서 사람들이 위험에 빠질 수 있다고 함. 표지판이 지켜지지 않고 무시된다는 흐름. ignore = 무시하다.","c":1,"ev":"2~3번 문장","s":[[2,"Signs for safety are everywhere, but they are often ignored.","안전을 위한 표지판은 어디에나 있지만, 그것들은 자주 무시된다."],[3,"This can put people in serious danger.","이것은 사람들을 심각한 위험에 빠뜨릴 수 있다."]]},"h":"962f1ba306"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This makes people take bigger risks, such as entering animals’ space!)","ko":"밑줄 친 단어의 뜻은? (이것은 사람들이 동물들의 공간에 들어가는 것과 같은 더 큰 risks를 무릅쓰게 한다!)","opts":["기회","위험","선물","관심"],"word":"risks","r":{"a":"2) 위험","w":"9번 such as entering animals’ space(동물들의 공간에 들어가기)는 위험한 행동이고, 10번에서 매우 위험하다고 이어짐. take a risk = 위험을 감수하다.","c":2,"ev":"9~10번 문장","s":[[9,"This makes people take bigger risks, such as entering animals’ space!","이것은 사람들이 동물들의 공간에 들어가는 것과 같은 더 큰 위험을 무릅쓰게 한다!"],[10,"It’s very dangerous because some people were actually attacked or killed by animals.","그것은 몇몇 사람들이 실제로 동물들에게 공격받았거나 죽임을 당했기 때문에 매우 위험하다."]]},"h":"9e48d7f45e"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nPeople could think that getting closer to them is ok.","ko":"밑줄 친 them이 가리키는 것은?","opts":["표지판들","동물원들","야생 동물들","셀피를 찍는 사람들"],"sko":"사람들은 그것들에게 더 가까이 가는 것이 괜찮다고 생각할 수 있다.","r":{"a":"3) 야생 동물들","w":"5번에서 동물원 같은 곳에서 야생 동물을 자주 봐서 동물들이 덜 위험해 보인다고 함. 6번 them은 그 동물들.","c":3,"ev":"5~6번 문장","s":[[5,"We often see wild animals in places like zoos, so the animals seem less real and dangerous.","우리는 동물원과 같은 장소에서 야생 동물들을 자주 봐서 동물들이 덜 현실적이고 덜 위험해 보인다."],[6,"People could think that getting closer to them is ok.","사람들은 그것들에게 더 가까이 가는 것이 괜찮다고 생각할 수 있다."]]},"h":"9df4103095"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A selfie is never more important than our lives or the lives of wild animals.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["셀피는 우리의 생명보다 더 중요할 때도 있다.","셀피는 야생 동물의 생명보다 항상 더 중요하다.","우리의 생명과 야생 동물의 생명은 셀피만큼 중요하지 않다.","셀피보다 우리의 생명이나 야생 동물의 생명이 더 중요하다."],"sko":"셀피는 우리의 생명이나 야생 동물들의 생명보다 절대 더 중요하지 않다.","r":{"a":"4) 셀피보다 우리의 생명이나 야생 동물의 생명이 더 중요하다.","w":"never more important than ~은 '~보다 절대 더 중요하지 않다'. 셀피는 생명보다 중요하지 않으니, 생명이 더 중요하다는 뜻.","c":4,"ev":"12~13번 문장","s":[[12,"So, never get too close to animals for selfies.","그러므로 절대로 셀피를 위해 동물들에게 너무 가까이 가지 마라."],[13,"A selfie is never more important than our lives or the lives of wild animals.","셀피는 우리의 생명이나 야생 동물들의 생명보다 절대 더 중요하지 않다."]]},"h":"ca3d2e9272"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["No one has ever been attacked by animals for a selfie.","Posting selfies with dangerous animals can get lots of Likes and comments.","Animals are never in danger when people get too close to them.","Most people follow the safety signs near wild animals."],"oko":["셀피 때문에 동물에게 공격받은 사람은 한 명도 없다.","위험한 동물과 찍은 셀피를 올리면 ‘좋아요’와 댓글을 많이 받을 수 있다.","사람들이 동물에게 너무 가까이 가도 동물은 전혀 위험하지 않다.","대부분의 사람들은 야생 동물 근처의 안전 표지판을 잘 따른다."],"r":{"a":"2) Posting selfies with dangerous animals can get lots of Likes and comments.","w":"8번 문장 Posting selfies with dangerous animals can get lots of Likes and comments와 같음. ①은 10번(공격받은 사람도 있음), ③은 11번(동물도 위험), ④는 2번(표지판이 자주 무시됨)과 다름.","c":2,"ev":"8번 문장","s":[[8,"Posting selfies with dangerous animals can get lots of Likes and comments.","위험한 동물들과의 셀피를 올리는 것은 ‘좋아요’와 댓글을 많이 받을 수 있다."]]},"h":"f90b49cc47"},{"n":9,"t":"sum","q":"Even if the animals seem (A), they could attack selfie-takers at any (B).","ko":"비록 동물들이 (A) 보일지라도, 그것들은 어느 (B)에라도 셀피 찍는 사람들을 공격할 수 있다.","opts":["(A) friendly / (B) moment","(A) dangerous / (B) moment","(A) friendly / (B) place","(A) dangerous / (B) place","(A) real / (B) moment"],"oko":["(A) 친근하게 / (B) 순간","(A) 위험하게 / (B) 순간","(A) 친근하게 / (B) 장소","(A) 위험하게 / (B) 장소","(A) 실제처럼 / (B) 순간"],"r":{"a":"1) (A) friendly / (B) moment ((A) 친근하게 / (B) 순간)","w":"4번 문장 Even if the animals seem friendly, they could attack selfie-takers at any moment.에서 가져옴. Even if(비록 ~일지라도)는 반대되는 내용이 이어지므로 friendly(친근한)와 어울림.","c":1,"ev":"4번 문장","s":[[4,"Even if the animals seem friendly, they could attack selfie-takers at any moment.","비록 동물들이 친숙해 보일지라도, 그것들은 셀피 찍는 사람들을 언제라도 공격할 수 있다."]]},"h":"d4e1ed3605"},{"n":10,"t":"fill","q":"Social [A] also plays a big [B].","ko":"소셜 [A]도 큰 [B]을(를) 한다.","bank":["media","role","signs","zoos","comments","risks"],"bko":{"media":"미디어","role":"역할","signs":"표지판","zoos":"동물원","comments":"댓글","risks":"위험"},"r":{"a":"[A] media (미디어), [B] role (역할)","w":"7번 문장 Social media also plays a big role.에서 가져옴. 나머지는 복수 명사라 단수 동사 plays 앞, 또는 a big 뒤에 맞지 않음.","c":null,"ev":"7번 문장","s":[[7,"Social media also plays a big role.","소셜 미디어도 큰 역할을 한다."]]},"h":"6be2cb5d3b"}]},{"u":2,"id":"rg3-02-3","no":3,"ko":"샤워할 때 아이디어가 떠오르는 이유는?","items":[{"n":1,"t":"tf","q":"Some of our best ideas can happen when we’re doing everyday things like taking a shower.","ko":"우리의 가장 좋은 아이디어 중 일부는 샤워하는 것과 같은 일상적인 일을 할 때 생길 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장 They can happen when we’re doing everyday things like taking a shower.와 같은 내용.","c":"T","ev":"4번 문장","s":[[4,"They can happen when we’re doing everyday things like taking a shower.","그것들은 우리가 샤워하는 것과 같은 일상적인 일들을 하고 있을 때 일어날 수 있다."]]},"h":"05af0d20a3"},{"n":2,"t":"tf","q":"Most of the time, the writers and scientists got their ideas while washing dishes.","ko":"대부분의 경우, 작가들과 과학자들은 설거지를 하는 동안 아이디어를 얻었다.","r":{"a":"F (본문과 다른 내용)","w":"7번에서 대부분은 직장(at work)에서 아이디어를 얻었고, 8번에서 설거지 같은 일을 할 때는 20%뿐이라고 함. 대부분이 설거지 중은 아님.","c":"F","ev":"7~8번 문장","s":[[7,"Most of the time, they got ideas at work.","대부분의 경우, 그들은 직장에서 아이디어를 얻었다."],[8,"But 20% of their best ideas came while they were doing something else like washing dishes!","그러나 그들의 가장 좋은 아이디어 중 20%는 그들이 설거지를 하는 것과 같이 또 다른 무언가를 하고 있는 동안 떠올랐다!"]]},"h":"4fb36e5809"},{"n":3,"t":"tf","q":"About 200 writers and scientists recorded their most creative ideas every day.","ko":"약 200명의 작가들과 과학자들은 그들의 가장 창의적인 아이디어를 매일 기록했다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장 about 200 writers and scientists recorded their most creative ideas every day와 같음.","c":"T","ev":"6번 문장","s":[[6,"In a study, about 200 writers and scientists recorded their most creative ideas every day.","한 연구에서, 약 200명의 작가들과 과학자들은 그들의 가장 창의적인 아이디어들을 매일 기록했다."]]},"h":"aecf4fc73c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then, your mind starts to wander, and you might start dreaming and wondering about all kinds of things.)","ko":"밑줄 친 단어의 뜻은? (그러면 당신의 생각은 wander하기 시작하고, 온갖 것들에 대해 꿈꾸고 궁금해하기 시작할지도 모른다.)","opts":["(생각이) 다른 데로 흐르다","멈추다","집중하다","사라지다"],"word":"wander","r":{"a":"1) (생각이) 다른 데로 흐르다","w":"10번에서 주의를 일부만 쓰므로 생각이 한곳에만 묶이지 않음. 11번 wander = 생각이 다른 곳으로 흐르다(떠돌다). 집중하는 것과 반대.","c":1,"ev":"10~11번 문장","s":[[10,"Those activities take some of your attention, but not all of it.","그 활동들은 전부는 아니지만, 당신의 주의 중 일부분을 끈다."],[11,"Then, your mind starts to wander, and you might start dreaming and wondering about all kinds of things.","그러면, 당신의 생각은 다른 곳으로 떠돌기 시작하고, 당신은 온갖 종류의 것들에 대해 꿈꾸고 궁금해하기 시작할지도 모른다."]]},"h":"d9a9813af6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In a study, about 200 writers and scientists recorded their most creative ideas every day.)","ko":"밑줄 친 단어의 뜻은? (한 연구에서, 약 200명의 작가들과 과학자들은 가장 창의적인 아이디어를 매일 recorded했다.)","opts":["잊었다","기록했다","팔았다","바꿨다"],"word":"recorded","r":{"a":"2) 기록했다","w":"6번에서 연구에 참여한 사람들이 아이디어를 매일 recorded했고, 7~8번에서 그 기록에서 아이디어를 언제 얻었는지 나옴. record = 기록하다.","c":2,"ev":"6~7번 문장","s":[[6,"In a study, about 200 writers and scientists recorded their most creative ideas every day.","한 연구에서, 약 200명의 작가들과 과학자들은 그들의 가장 창의적인 아이디어들을 매일 기록했다."],[7,"Most of the time, they got ideas at work.","대부분의 경우, 그들은 직장에서 아이디어를 얻었다."]]},"h":"57f187e551"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThose activities take some of your attention, but not all of it.","ko":"밑줄 친 it이 가리키는 것은?","opts":["당신의 마음","샤워 효과","창의적인 아이디어","당신의 주의"],"sko":"그 활동들은 전부는 아니지만, 당신의 주의 중 일부분을 끈다.","r":{"a":"4) 당신의 주의","w":"some of your attention, but not all of it에서 ‘주의의 일부는 쓰지만 전부는 아니다’라는 뜻. it = 앞에 나온 your attention(당신의 주의).","c":4,"ev":"10번 문장","s":[[10,"Those activities take some of your attention, but not all of it.","그 활동들은 전부는 아니지만, 당신의 주의 중 일부분을 끈다."]]},"h":"352485f285"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Some of our best ideas don’t just happen at work or school.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["우리의 가장 좋은 아이디어는 직장이나 학교에서만 생긴다.","우리의 가장 좋은 아이디어는 모두 직장이나 학교 밖에서만 생긴다.","우리의 가장 좋은 아이디어 중 일부는 직장이나 학교에서만 생기는 것이 아니다.","직장이나 학교에서는 좋은 아이디어가 전혀 생기지 않는다."],"sko":"우리의 몇몇 가장 좋은 아이디어들은 단지 직장이나 학교에서만 생기는 것이 아니다.","r":{"a":"3) 우리의 가장 좋은 아이디어 중 일부는 직장이나 학교에서만 생기는 것이 아니다.","w":"don’t just happen at work or school은 ‘직장이나 학교에서만 생기는 것은 아니다’. 4번에서 샤워 같은 일상적인 일을 할 때도 생긴다고 이어짐. 직장·학교에서 아예 안 생긴다는 뜻은 아님.","c":3,"ev":"3~4번 문장","s":[[3,"Some of our best ideas don’t just happen at work or school.","우리의 몇몇 가장 좋은 아이디어들은 단지 직장이나 학교에서만 생기는 것이 아니다."],[4,"They can happen when we’re doing everyday things like taking a shower.","그것들은 우리가 샤워하는 것과 같은 일상적인 일들을 하고 있을 때 일어날 수 있다."]]},"h":"bcff4b53a3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["The shower effect can happen only in the shower.","About 20% of the best ideas came while the people were doing something else.","Those activities take all of your attention.","The best ideas never come when we are doing everyday things."],"oko":["샤워 효과는 샤워장에서만 일어날 수 있다.","가장 좋은 아이디어의 약 20%는 사람들이 다른 일을 하는 동안 떠올랐다.","그 활동들은 당신의 주의를 전부 차지한다.","가장 좋은 아이디어는 일상적인 일을 할 때는 절대 떠오르지 않는다."],"r":{"a":"2) About 20% of the best ideas came while the people were doing something else.","w":"8번 20% of their best ideas came while they were doing something else와 같음. ①은 5번(샤워장 밖에서도), ③은 10번(전부는 아님), ④는 4번(일상적인 일 할 때 생김)과 다름.","c":2,"ev":"5번, 8번, 10번 문장","s":[[5,"Scientists call this the “shower effect,” and research shows that it can also occur outside the shower.","과학자들은 이것을 ‘샤워 효과’라고 부르고, 연구는 그것이 샤워장 밖에서도 발생할 수 있다는 것을 보여준다."],[8,"But 20% of their best ideas came while they were doing something else like washing dishes!","그러나 그들의 가장 좋은 아이디어 중 20%는 그들이 설거지를 하는 것과 같이 또 다른 무언가를 하고 있는 동안 떠올랐다!"],[10,"Those activities take some of your attention, but not all of it.","그 활동들은 전부는 아니지만, 당신의 주의 중 일부분을 끈다."]]},"h":"ceb9888906"},{"n":9,"t":"sum","q":"A good shower can (A) not only your (B) but also your mind.","ko":"좋은 샤워는 당신의 (B)뿐만 아니라 마음도 (A) 수 있다.","opts":["(A) relax / (B) body","(A) relax / (B) hand","(A) tire / (B) body","(A) tire / (B) hand","(A) wake / (B) body"],"oko":["(A) 편안하게 할 / (B) 몸","(A) 편안하게 할 / (B) 손","(A) 지치게 할 / (B) 몸","(A) 지치게 할 / (B) 손","(A) 깨울 / (B) 몸"],"r":{"a":"1) (A) relax / (B) body ((A) 편안하게 할 / (B) 몸)","w":"1번 문장 A good shower can relax not only your body but also your mind.에서 가져옴.","c":1,"ev":"1번 문장","s":[[1,"A good shower can relax not only your body but also your mind.","좋은 샤워는 당신의 몸뿐만 아니라 당신의 마음도 편안하게 할 수 있다."]]},"h":"76249a8f26"},{"n":10,"t":"fill","q":"It can help you [A] more [B] and have creative ideas.","ko":"그것은 당신이 더 [B] [A] 수 있고 창의적인 아이디어를 낼 수 있도록 도와준다.","bank":["think","clearly","attention","effect","dishes","school"],"bko":{"think":"생각하다","clearly":"명확하게","attention":"주의","effect":"효과","dishes":"접시들(dish의 복수형)","school":"학교"},"r":{"a":"[A] think (생각하다), [B] clearly (명확하게)","w":"2번 문장 It can help you think more clearly and have creative ideas.에서 가져옴. 나머지는 명사라 help you ___ 자리(동사)에 맞지 않음.","c":null,"ev":"2번 문장","s":[[2,"It can help you think more clearly and have creative ideas.","그것은 여러분이 더 명확하게 생각하고 창의적인 아이디어들을 낼 수 있도록 도와줄 수 있다."]]},"h":"90d7ece2d2"}]},{"u":3,"id":"rg3-03-1","no":1,"ko":"불타는 폭포를 놓치지 마세요!","items":[{"n":1,"t":"tf","q":"The Sun’s glow can make the waterfall look like fire.","ko":"태양의 불빛은 폭포를 불처럼 보이게 만들 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장 the Sun’s glow turns the waterfall into something that looks like fire와 같은 내용.","c":"T","ev":"2번 문장","s":[[2,"During the Firefall, the Sun’s glow turns the waterfall into something that looks like fire.","Firefall 동안, 태양의 불빛은 폭포를 불처럼 보이는 것으로 바꿔요."]]},"h":"3cc302b668"},{"n":2,"t":"tf","q":"The burning orange glow lasts for several hours before sunset.","ko":"타오르는 주황색 불빛은 일몰 전 몇 시간 동안 지속된다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 only lasts for a few minutes(단지 몇 분 동안만 지속됨)라고 함. 몇 시간이 아님.","c":"F","ev":"4번 문장","s":[[4,"But, this burning orange glow only lasts for a few minutes before sunset.","그러나, 이 타오르는 주황색 불빛은 일몰 전 몇 분 동안만 지속돼요."]]},"h":"120ff4fabe"},{"n":3,"t":"tf","q":"You need to make a reservation for entrance to the park.","ko":"공원에 입장하려면 예약해야 한다.","r":{"a":"T (본문과 맞는 내용)","w":"13번 문장 Make a reservation for entrance to the park와 같은 내용.","c":"T","ev":"13번 문장","s":[[13,"Requirements: Make a reservation for entrance to the park.","필요조건: 공원 입장을 위해 예약하세요."]]},"h":"06c9755bcd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (During the Firefall, the Sun’s glow turns the waterfall into something that looks like fire.)","ko":"밑줄 친 단어의 뜻은? (Firefall 동안, 태양의 glow는 폭포를 불처럼 보이는 것으로 바꾼다.)","opts":["그림자","불빛","소리","연기"],"word":"glow","r":{"a":"2) 불빛","w":"2번에서 폭포가 불처럼 보인다고 하고, 3번에서 burning orange glow(타오르는 주황색 불빛)라고 이어짐. glow = 은은한 불빛.","c":2,"ev":"2~3번 문장","s":[[2,"During the Firefall, the Sun’s glow turns the waterfall into something that looks like fire.","Firefall 동안, 태양의 불빛은 폭포를 불처럼 보이는 것으로 바꿔요."],[3,"In February, the Horsetail Fall turns into this beautiful Firefall, creating a burning orange glow.","2월에, Horsetail 폭포는 타오르는 주황색 불빛을 만들어 내면서 이러한 아름다운 Firefall로 변해요."]]},"h":"982542703b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The weather should be warm enough to melt the snow.)","ko":"밑줄 친 단어의 뜻은? (날씨는 눈을 melt할 만큼 충분히 따뜻해야 한다.)","opts":["쌓다","치우다","녹이다","얼리다"],"word":"melt","r":{"a":"3) 녹이다","w":"7번에서 눈이 충분히 있어야 하고, 8번에서 날씨가 따뜻해야 한다고 함. 따뜻해야 눈에게 하는 일 = 녹이다. melt = 녹다, 녹이다.","c":3,"ev":"7~8번 문장","s":[[7,"Snowfall: There must be enough snow.","강설량: 충분한 눈이 있어야만 해요."],[8,"Temperature: The weather should be warm enough to melt the snow.","기온: 눈을 녹일 만큼 날씨가 충분히 따뜻해야 해요."]]},"h":"0c596e16ec"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nSo, you need to be in the right spot at the right time to fully enjoy this.","ko":"밑줄 친 this이 가리키는 것은?","opts":["요세미티 국립공원","일몰 시간","적절한 장소","Firefall(불꽃처럼 보이는 폭포)"],"sko":"그래서, 여러분은 이것을 완전히 즐기기 위해서는 적절한 시간, 적절한 장소에 있어야 해요.","r":{"a":"4) Firefall(불꽃처럼 보이는 폭포)","w":"3~4번에서 몇 분만 지속되는 Firefall을 설명하고, 5번에서 그것을 완전히 즐기려면 적절한 시간과 장소에 있어야 한다고 함. this = 그 Firefall.","c":4,"ev":"3~5번 문장","s":[[3,"In February, the Horsetail Fall turns into this beautiful Firefall, creating a burning orange glow.","2월에, Horsetail 폭포는 타오르는 주황색 불빛을 만들어 내면서 이러한 아름다운 Firefall로 변해요."],[4,"But, this burning orange glow only lasts for a few minutes before sunset.","그러나, 이 타오르는 주황색 불빛은 일몰 전 몇 분 동안만 지속돼요."],[5,"So, you need to be in the right spot at the right time to fully enjoy this.","그래서, 여러분은 이것을 완전히 즐기기 위해서는 적절한 시간, 적절한 장소에 있어야 해요."]]},"h":"bb42dfb550"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Snowfall: There must be enough snow.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["눈이 충분히 있어야 한다.","눈이 너무 많이 오면 안 된다.","눈이 전혀 오지 않아야 한다.","눈이 오는 날에는 폭포를 볼 수 없다."],"sko":"강설량: 충분한 눈이 있어야만 해요.","r":{"a":"1) 눈이 충분히 있어야 한다.","w":"7번 문장 Snowfall: There must be enough snow.는 눈이 충분히 있어야 한다는 뜻.","c":1,"ev":"7번 문장","s":[[7,"Snowfall: There must be enough snow.","강설량: 충분한 눈이 있어야만 해요."]]},"h":"42c80a255c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["The Firefall can be seen all through the year.","People can see the Firefall at any time of day.","You can see the Firefall in the last two weeks of February.","Clouds are necessary to see the Firefall."],"oko":["Firefall은 일 년 내내 볼 수 있다.","사람들은 하루 중 아무 때나 Firefall을 볼 수 있다.","2월의 마지막 2주 동안 Firefall을 볼 수 있다.","Firefall을 보려면 구름이 필요하다."],"r":{"a":"3) You can see the Firefall in the last two weeks of February.","w":"11번 During the last two weeks of February와 같음. ①은 3번(2월), ②는 12번(일몰 5~15분 전), ④는 9번(구름 한 점 없는 하늘)과 다름.","c":3,"ev":"11번 문장","s":[[11,"When: During the last two weeks of February.","언제: 2월 마지막 2주 동안."]]},"h":"c647607028"},{"n":9,"t":"sum","q":"To see the Firefall, you need (A) skies, and the Sun has to hit the waterfall at the right (B).","ko":"Firefall을 보려면 (A) 하늘이 필요하고, 태양이 폭포에 적절한 (B)로 비춰야 한다.","opts":["(A) cloudy / (B) angle","(A) clear / (B) angle","(A) clear / (B) temperature","(A) cloudy / (B) temperature","(A) dark / (B) angle"],"oko":["(A) 흐린 / (B) 각도","(A) 맑은 / (B) 각도","(A) 맑은 / (B) 기온","(A) 흐린 / (B) 기온","(A) 어두운 / (B) 각도"],"r":{"a":"2) (A) clear / (B) angle","w":"9번 Clear and cloudless skies are necessary, 10번 The Sun has to hit the waterfall at the right angle. cloudy는 9번과 반대.","c":2,"ev":"9~10번 문장","s":[[9,"Sky conditions: Clear and cloudless skies are necessary.","하늘 상태: 맑고 구름 한 점 없는 하늘이 필요해요."],[10,"Sun angle: The Sun has to hit the waterfall at the right angle.","태양의 각도: 태양이 폭포에 적절한 각도로 비춰야 해요."]]},"h":"3eb8e57b8f"},{"n":10,"t":"fill","q":"In February, the Horsetail Fall turns into this [A] Firefall, [B] a burning orange glow.","ko":"2월에, Horsetail 폭포는 이 [A] Firefall로 변하고, 타오르는 주황색 불빛을 [B].","bank":["beautiful","creating","melting","hitting","snow","spot"],"bko":{"beautiful":"아름다운","creating":"만들어 내는 중(create의 -ing형)","melting":"녹이는 중(melt의 -ing형)","hitting":"비추는 중(hit의 -ing형)","snow":"눈","spot":"장소, 지점"},"r":{"a":"[A] beautiful (아름다운), [B] creating (만들어 내는 중(create의 -ing형))","w":"3번 문장 In February, the Horsetail Fall turns into this beautiful Firefall, creating a burning orange glow.에서 가져옴.","c":null,"ev":"3번 문장","s":[[3,"In February, the Horsetail Fall turns into this beautiful Firefall, creating a burning orange glow.","2월에, Horsetail 폭포는 타오르는 주황색 불빛을 만들어 내면서 이러한 아름다운 Firefall로 변해요."]]},"h":"3d6e3fc39e"}]},{"u":3,"id":"rg3-03-2","no":2,"ko":"티백은 어떻게 우연히 발명됐을까?","items":[{"n":1,"t":"tf","q":"Thomas Sullivan was a famous tea trader in New York.","ko":"Thomas Sullivan은 뉴욕의 유명한 차 상인이었다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장 Thomas Sullivan was a famous tea trader in New York.과 같음.","c":"T","ev":"1번 문장","s":[[1,"Thomas Sullivan was a famous tea trader in New York.","Thomas Sullivan은 뉴욕의 유명한 차(茶) 상인이었다."]]},"h":"3c3e4d65e1"},{"n":2,"t":"tf","q":"The silk bags were more expensive than the tins.","ko":"실크 주머니는 양철통보다 더 비쌌다.","r":{"a":"F (본문과 다른 내용)","w":"8번 문장에서 These bags were cheaper(더 저렴했다)라고 함. 더 비쌌다는 말은 반대 내용.","c":"F","ev":"8번 문장","s":[[8,"These bags were cheaper, and also looked fancy.","이 주머니는 더 저렴했고, 또한 고급스러워 보였다."]]},"h":"6db4ae95e0"},{"n":3,"t":"tf","q":"Some customers put the whole silk bag in boiling water.","ko":"어떤 고객들은 실크 주머니 전체를 끓는 물에 넣었다.","r":{"a":"T (본문과 맞는 내용)","w":"11번 문장 some customers put the whole silk bag in boiling water와 같음.","c":"T","ev":"11번 문장","s":[[11,"But instead, some customers put the whole silk bag in boiling water.","그러나 대신에, 어떤 고객들은 실크 주머니 전체를 끓는 물에 넣었다."]]},"h":"ec55276733"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They found this more convenient, and the tea still tasted great.)","ko":"밑줄 친 단어의 뜻은? (그들은 이것이 더 convenient하다는 것을 알게 되었고, 차는 여전히 맛이 아주 좋았다.)","opts":["편리한","비싼","위험한","복잡한"],"word":"convenient","r":{"a":"1) 편리한","w":"11번에서 주머니째 넣어 인퓨저 없이 차를 만들었고, 12번에서 그것이 이점이라고 함(맛도 좋음). convenient = 편리한.","c":1,"ev":"11~12번 문장","s":[[11,"But instead, some customers put the whole silk bag in boiling water.","그러나 대신에, 어떤 고객들은 실크 주머니 전체를 끓는 물에 넣었다."],[12,"They found this more convenient, and the tea still tasted great.","그들은 이것이 더 편리하다는 것을 알게 되었고, 차는 여전히 맛이 아주 좋았다."]]},"h":"0efcb858f5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Interestingly, what happened next accidentally led to the invention of tea bags!)","ko":"밑줄 친 단어의 뜻은? (흥미롭게도, 다음에 일어난 일은 accidentally 티백의 발명으로 이어졌다!)","opts":["일부러","빠르게","우연히","천천히"],"word":"accidentally","r":{"a":"3) 우연히","w":"10번에서 Thomas는 찻잎을 꺼낼 것이라고 예상했지만 11번에서 고객들이 다르게 해서 티백이 생김. 계획과 다른 일이라 accidentally = 우연히.","c":3,"ev":"9~11번 문장","s":[[9,"Interestingly, what happened next accidentally led to the invention of tea bags!", "n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Thomas wanted to stop sending samples to his customers.","All of Thomas’s customers took the tea leaves out of the silk bags.","Thomas used silk bags because tins were too cheap.","Thomas sent tea samples in silk bags instead of tins."],"oko":["Thomas는 고객들에게 샘플 보내는 것을 그만두고 싶어 했다.","Thomas의 모든 고객은 실크 주머니에서 찻잎을 꺼냈다.","Thomas는 양철통이 너무 싸서 실크 주머니를 사용했다.","Thomas는 양철통 대신 실크 주머니에 차 샘플을 담아 보냈다."],"r":{"a":"4) Thomas sent tea samples in silk bags instead of tins.","w":"7번 he decided to use silk bags for tea samples, instead of tins와 같음. ①은 5번(실망시키고 싶지 않았음), ②는 11번(어떤 고객들은 주머니째), ③은 3번(양철통이 너무 비쌈)과 다름.","c":4,"ev":"7번 문장","s":[[7,"In 1908, he decided to use silk bags for tea samples, instead of tins.","1908년, 그는 차 샘플을 위해 양철통 대신 실크 주머니를 사용하기로 결심했다."]]},"h":"8083d5b72c"},{"n":9,"t":"sum","q":"Thomas didn’t want to (A) his customers by not sending the samples (B).","ko":"Thomas는 샘플을 (B) 보내지 않음으로써 고객들을 (A) 싶지 않았다.","opts":["(A) disappoint / (B) anymore","(A) disappoint / (B) yesterday","(A) thank / (B) anymore","(A) thank / (B) yesterday","(A) call / (B) anymore"],"oko":["(A) 실망시키고 / (B) 더 이상","(A) 실망시키고 / (B) 어제","(A) 감사하고 / (B) 더 이상","(A) 감사하고 / (B) 어제","(A) 부르고 / (B) 더 이상"],"r":{"a":"1) (A) disappoint / (B) anymore ((A) 실망시키고 / (B) 더 이상)","w":"5번 문장 Thomas didn’t want to disappoint his customers by not sending the samples anymore.에서 가져옴.","c":1,"ev":"5번 문장","s":[[5,"Thomas didn’t want to disappoint his customers by not sending the samples anymore.","Thomas는 샘플을 더 이상 보내지 않음으로써 그의 고객들을 실망시키고 싶지 않았다."]]},"h":"bf39b06fb3"},{"n":10,"t":"fill","q":"However, he faced a [A]: The tins that he used to send samples became too expensive. He needed a cheaper [B].","ko":"하지만, 그는 [A]을(를) 맞닥뜨렸다: 그가 샘플을 보내는 데 사용했던 양철통이 너무 비싸진 것이다. 그는 비용이 더 적게 들어갈 [B]이(가) 필요했다.","bank":["problem","solution","tins","samples","became","used"],"bko":{"problem":"문제","solution":"해결책","tins":"양철통들(tin의 복수형)","samples":"샘플들(sample의 복수형)","became":"되었다(become의 과거형)","used":"사용했다(use의 과거형)"},"r":{"a":"[A] problem (문제), [B] solution (해결책)","w":"3~4번 문장에서 가져옴. faced a ___는 문제, needed a cheaper ___는 해결책. 나머지는 a 뒤에 맞지 않는 복수형 또는 동사.","c":null,"ev":"3~4번 문장","s":[[3,"However, he faced a problem: The tins that he used to send samples became too expensive.","하지만, 그는 문제를 맞닥뜨렸다: 그가 샘플을 보내는 데 사용했던 양철통이 너무 비싸진 것이다."],[4,"He needed a cheaper solution.","그는 비용이 더 적게 들어갈 해결책이 필요했다."]]},"h":"ebda7870e0"}]},{"u":3,"id":"rg3-03-3","no":3,"ko":"일주일에 신용카드 한 장을 먹는다고?","items":[{"n":1,"t":"tf","q":"Clothes we wear are the biggest source of microplastic pollution.","ko":"우리가 입는 옷은 미세플라스틱 오염의 가장 큰 원천이다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장 Clothes we wear are the biggest source와 같은 내용.","c":"T","ev":"4번 문장","s":[[4,"Clothes we wear are the biggest source, making up about 35% of the microplastic pollution.","우리가 입는 옷이 가장 큰 원천으로, 미세플라스틱 오염의 약 35퍼센트를 이루고 있다."]]},"h":"7b545c1f59"},{"n":2,"t":"tf","q":"Microplastics are found only in a few kinds of food.","ko":"미세플라스틱은 몇 가지 음식에서만 발견된다.","r":{"a":"F (본문과 다른 내용)","w":"3번 문장에서 found in almost everything we eat and drink(거의 모든 것에서 발견)라고 함. 몇 가지에서만이 아님.","c":"F","ev":"3번 문장","s":[[3,"Microplastics are found in almost everything we eat and drink.","미세플라스틱은 우리가 먹고 마시는 거의 모든 것에서 발견된다."]]},"h":"49fdab3c70"},{"n":3,"t":"tf","q":"Washing your clothes at a lower temperature can help reduce fibers.","ko":"더 낮은 온도에서 옷을 세탁하면 섬유를 줄이는 데 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"11번 문장 Wash your clothes at a lower temperature … to reduce fibers와 같은 내용.","c":"T","ev":"11번 문장","s":[[11,"Wash your clothes at a lower temperature and for a shorter time to reduce fibers.","섬유를 줄이기 위해 더 낮은 온도에서 더 짧은 시간 동안 당신의 옷을 세탁해라."]]},"h":"10a773af67"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When we make, wash, wear, or dry clothes, they release little fibers that can travel very far.)","ko":"밑줄 친 단어의 뜻은? (우리가 옷을 만들거나 세탁하거나 입거나 말릴 때, 그것들은 매우 멀리 이동할 수 있는 작은 섬유를 release한다.)","opts":["방출하다","보관하다","씻다","줄이다"],"word":"release","r":{"a":"1) 방출하다","w":"5번에서 옷이 작은 섬유를 내보내고, 그 섬유가 멀리 이동한다고 함. release = 방출하다, 내뿜다. 줄이다(reduce)는 11번 조언에 나오는 말.","c":1,"ev":"5번 문장","s":[[5,"When we make, wash, wear, or dry clothes, they release little fibers that can travel very far.","우리가 옷을 만들거나, 세탁하거나, 입거나, 또는 말릴 때, 그것들은 매우 멀리 이동할 수 있는 작은 섬유를 방출한다."]]},"h":"0379e75239"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They can even make people have trouble breathing and damage their lungs.)","ko":"밑줄 친 단어의 뜻은? (그것들은 심지어 사람들이 숨 쉬는 데 어려움을 겪게 하고 폐를 damage할 수 있다.)","opts":["치료하다","손상시키다","강하게 하다","깨끗이 하다"],"word":"damage","r":{"a":"2) 손상시키다","w":"6번 even(심지어)으로 더 나쁜 영향을 말하고, have trouble breathing(숨 쉬는 데 어려움)과 함께 나옴. damage = 손상을 주다.","c":2,"ev":"6번 문장","s":[[6,"They can even make people have trouble breathing and damage their lungs.","그것들은 심지어 사람들이 숨 쉬는 데 어려움을 겪게 하고 폐를 손상시킬 수 있다."]]},"h":"96d66c41fb"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis will keep you healthy and help the environment too.","ko":"밑줄 친 This이 가리키는 것은?","pron":"This","opts":["위의 방법들을 실천하는 것","옷을 입는 것","미세플라스틱을 먹는 것","플라스틱을 많이 쓰는 것"],"sko":"이것은 당신을 건강하게 유지하고 환경도 도울 것이다.","r":{"a":"1) 위의 방법들을 실천하는 것","w":"12번에서 위의 방법들(these things)을 하면 미세플라스틱을 멀리할 수 있다고 했고, 13번 This will keep you healthy의 This는 그 방법들을 실천하는 것.","c":1,"ev":"12~13번 문장","s":[[12,"If you do these things, you can keep some microplastics away from yourself.","만약 당신이 이것들을 한다면, 스스로를 일부 미세플라스틱으로부터 멀리할 수 있다."],[13,"This will keep you healthy and help the environment too.","이것은 당신을 건강하게 유지하고 환경도 도울 것이다."]],"k":"This = 위의 방법들을 실천하는 것"},"h":"2ee9333ad7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Clean your home often and let fresh air in to remove plastic fibers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["집을 자주 청소하고 신선한 공기를 들이면 플라스틱 섬유를 없앨 수 있다.","집을 자주 청소하면 플라스틱 섬유가 오히려 늘어난다.","신선한 공기가 들어오면 플라스틱 섬유가 더 많이 생긴다.","집은 청소할 필요 없이 창문만 닫아 두면 된다."],"sko":"당신의 집을 자주 청소하고 플라스틱 섬유들을 제거하기 위해 신선한 공기를 안으로 들여라.","r":{"a":"1) 집을 자주 청소하고 신선한 공기를 들이면 플라스틱 섬유를 없앨 수 있다.","w":"10번 문장: 집을 자주 청소하고 신선한 공기를 들여 플라스틱 섬유를 제거하라는 뜻.","c":1,"ev":"10번 문장","s":[[10,"Clean your home often and let fresh air in to remove plastic fibers.","당신의 집을 자주 청소하고 플라스틱 섬유들을 제거하기 위해 신선한 공기를 안으로 들여라."]]},"h":"9646ad5ad9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Microplastics are very large pieces of plastic.","We eat microplastics about the size of a plastic card in a week.","Wearing clothes does not release any fibers.","Washing your clothes at a higher temperature reduces fibers."],"oko":["미세플라스틱은 아주 큰 플라스틱 조각이다.","우리는 일주일에 플라스틱 카드 한 장 크기만큼의 미세플라스틱을 먹는다.","옷을 입는 것은 섬유를 전혀 방출하지 않는다.","더 높은 온도에서 옷을 세탁하면 섬유가 줄어든다."],"r":{"a":"2) We eat microplastics about the size of a plastic card in a week.","w":"2번 the microplastics we eat in a week add up to about the size of a plastic card와 같음. ①은 1번(아주 작은 조각), ③은 5번(입을 때도 방출), ④는 11번(낮은 온도)과 다름.","c":2,"ev":"1~2번, 5번, 11번 문장","s":[[1,"Microplastics are very small pieces of plastic from larger plastics that break down over time.","미세플라스틱은 시간이 지나면서 분해되는 더 큰 플라스틱에서 나온 아주 작은 플라스틱 조각이다."],[2,"Surprisingly, the microplastics we eat in a week add up to about the size of a plastic card!","놀랍게도, 우리가 일주일에 섭취하는 미세플라스틱의 양은 대략 플라스틱 카드 하나 정도의 크기가 된다!"],[5,"When we make, wash, wear, or dry clothes, they release little fibers that can travel very far.","우리가 옷을 만들거나, 세탁하거나, 입거나, 또는 말릴 때, 그것들은 매우 멀리 이동할 수 있는 작은 섬유를 방출한다."],[11,"Wash your clothes at a lower temperature and for a shorter time to reduce fibers.","섬유를 줄이기 위해 더 낮은 온도에서 더 짧은 시간 동안 당신의 옷을 세탁해라."]]},"h":"76c9f8f175"},{"n":9,"t":"sum","q":"Now, you might (A) how to keep yourself (B) from microplastics.","ko":"이제, 당신은 미세플라스틱으로부터 스스로를 (B) 지키는 방법이 (A) 수도 있다.","opts":["(A) wonder / (B) safe","(A) wonder / (B) sick","(A) hate / (B) safe","(A) hate / (B) sick","(A) wonder / (B) busy"],"oko":["(A) 궁금할 / (B) 안전하게","(A) 궁금할 / (B) 아프게","(A) 싫어할 / (B) 안전하게","(A) 싫어할 / (B) 아프게","(A) 궁금할 / (B) 바쁘게"],"r":{"a":"1) (A) wonder / (B) safe ((A) 궁금할 / (B) 안전하게)","w":"7번 문장 Now, you might wonder how to keep yourself safe from microplastics.에서 가져옴.","c":1,"ev":"7번 문장","s":[[7,"Now, you might wonder how to keep yourself safe from microplastics.","이제, 당신은 미세플라스틱으로부터 스스로를 안전하게 지키는 방법이 궁금할지도 모른다."]]},"h":"4d484e83be"},{"n":10,"t":"fill","q":"Choose clothes and items made from [A] [B].","ko":"[A] [B](으)로 만든 옷과 물건들을 골라라.","bank":["eco-friendly","materials","release","damage","wash","travel"],"bko":{"eco-friendly":"친환경적인","materials":"재료","release":"방출하다","damage":"손상시키다","wash":"세탁하다","travel":"이동하다"},"r":{"a":"[A] eco-friendly (친환경적인), [B] materials (재료)","w":"9번 문장 Choose clothes and items made from eco-friendly materials.에서 가져옴. 나머지는 동사라 made from 뒤 명사 자리에 맞지 않음.","c":null,"ev":"9번 문장","s":[[9,"Choose clothes and items made from eco-friendly materials.","친환경적인 재료들로 만든 옷과 물건들을 골라라."]]},"h":"1d5ab75397"}]},{"u":4,"id":"rg3-04-1","no":1,"ko":"빙하 위를 떼 지어 달리는 ‘쥐’의 정체는?","items":[{"n":1,"t":"tf","q":"The moss balls on glaciers move because of the sun.","ko":"빙하 위의 이끼 공들은 태양 때문에 움직인다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"They wanted to know what makes them move, and it turns out that they move because of the sun.","그들은 무엇이 그것들을 움직이게 만드는지 알고 싶었고, 태양 때문에 그것들이 움직이는 것으로 밝혀졌어요."]],"w":"5번 문장에 they move because of the sun이 있음. 태양 때문에 움직인다는 내용과 일치.","c":"T"},"h":"1341e61cec"},{"n":2,"t":"tf","q":"Glacier mice are real mice that live on glaciers in Iceland and Alaska.","ko":"빙하 쥐는 아이슬란드와 알래스카의 빙하에 사는 진짜 쥐이다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"They are not real mice, but rather small balls of moss that grow on glaciers.","그것들은 진짜 쥐가 아니라 오히려 빙하에서 자라는 작은 이끼 공들이에요."]],"w":"2번 문장에서 They are not real mice라고 함. 빙하 쥐는 진짜 쥐가 아니라 작은 이끼 공이므로 틀린 진술.","c":"F"},"h":"dbf8333bc2"},{"n":3,"t":"tf","q":"In summer, the moss balls move about 2.5 meters per day.","ko":"여름에 이끼 공들은 하루에 약 2.5미터씩 움직인다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"In summer, when the sun melts the glacier around them, they move about 2.5 centimeters per day.","여름에, 태양이 그것들 주변의 빙하를 녹일 때, 그것들은 하루에 약 2.5센티미터씩 움직여요."]],"w":"6번 문장에서 하루에 움직이는 거리는 about 2.5 centimeters(약 2.5센티미터)임. meters(미터)가 아니라 centimeters.","c":"F"},"h":"eaac89c006"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists also found that the moss balls can survive on glaciers for six years or more.)","ko":"과학자들은 이끼 공들이 빙하 위에서 6년 또는 그 이상 ( ) 있다는 것도 알아냈다.","opts":["사라지다","살아남다","움직이다","변하다"],"word":"survive","r":{"a":"2) 살아남다","ev":"7번 문장","s":[[7,"Scientists also found that the moss balls can survive on glaciers for six years or more.","과학자들은 이끼 공들이 빙하 위에서 6년 또는 그 이상 살아남을 수 있다는 것도 알아냈어요."]],"w":"7번에서 이끼 공이 빙하 위에서 6년 또는 그 이상(six years or more) 지낼 수 있다고 함. 그래서 survive는 살아남다. 움직이다는 move의 뜻이라 다름.","c":2},"h":"1bd7e46a12"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But the researchers noticed something strange about the movement.)","ko":"그러나 연구원들은 그 움직임에 대해 무언가 ( ) 것을 알아차렸다.","opts":["분명한","빠른","이상한","차가운"],"word":"strange","r":{"a":"3) 이상한","ev":"8~9번 문장","s":[[8,"But the researchers noticed something strange about the movement.","그러나 연구원들은 그 움직임에 대해 무언가 이상한 것을 알아차렸어요."],[9,"The moss balls moved together, and even changed direction together, like a herd of animals!","그 이끼 공들은 함께 움직였고, 심지어 동물 떼처럼 방향도 함께 바꿨어요!"]],"w":"8번의 something strange는 ‘무언가 이상한 것’이고, 바로 다음 9번에서 이끼 공들이 떼처럼 함께 움직인다는 이상한 점이 나옴. clear(분명한)는 10번에 나오는 다른 단어.","c":3},"h":"dab83dce9b"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nScientists are still trying to find out why they move this way, but haven’t found a clear answer yet.","ko":"밑줄 친 they가 가리키는 것은?","pron":"they","opts":["이끼 공들","과학자들","빙하","쥐들"],"sko":"과학자들은 왜 그것들이 이 방식으로 움직이는지 알아내려고 여전히 노력하고 있지만, 아직 분명한 답을 찾지 못했어요.","r":{"a":"1) 이끼 공들","w":"9번에서 이끼 공들이 함께 움직이고 방향도 함께 바꿨다고 했고, 10번의 why they move this way에서 they는 이끼 공들.","c":1,"ev":"9~10번 문장","s":[[9,"The moss balls moved together, and even changed direction together, like a herd of animals!","그 이끼 공들은 함께 움직였고, 심지어 동물 떼처럼 방향도 함께 바꿨어요!"],[10,"Scientists are still trying to find out why they move this way, but haven’t found a clear answer yet.","과학자들은 왜 그것들이 이 방식으로 움직이는지 알아내려고 여전히 노력하고 있지만, 아직 분명한 답을 찾지 못했어요."]],"k":"they = 이끼 공들"},"h":"704837105b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Have you ever heard of “glacier mice”?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["빙하 쥐에 대해 들어본 적이 있는지 묻고 있다.","빙하 쥐를 직접 본 적이 있는지 묻고 있다.","빙하 쥐가 어디에 사는지 묻고 있다.","빙하 쥐를 어떻게 잡는지 묻고 있다."],"sko":"여러분은 ‘빙하 쥐’에 대해 들어본 적이 있나요?","r":{"a":"1) 빙하 쥐에 대해 들어본 적이 있는지 묻고 있다.","w":"1번 문장 Have you ever heard of “glacier mice”?는 빙하 쥐에 대해 들어본 적이 있는지 묻는 말.","c":1,"ev":"1번 문장","s":[[1,"Have you ever heard of “glacier mice”?","여러분은 ‘빙하 쥐’에 대해 들어본 적이 있나요?"]]},"h":"8e211ce5b2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Glacier mice are small animals that live on glaciers in Iceland and Alaska.","The moss balls moved together like a herd of animals.","Each moss ball moves alone and never moves with the others.","Scientists have already found why the moss balls move together."],"oko":["빙하 쥐는 아이슬란드와 알래스카의 빙하에 사는 작은 동물이다.","이끼 공들은 동물 떼처럼 함께 움직였다.","각각의 이끼 공은 혼자서만 움직이고 다른 공들과는 절대 함께 움직이지 않는다.","과학자들은 이끼 공들이 함께 움직이는 이유를 이미 밝혀냈다."],"r":{"a":"2) The moss balls moved together like a herd of animals. (이끼 공들은 동물 떼처럼 함께 움직였다.)","w":"9번 문장: 이끼 공들은 함께 움직였고 동물 떼처럼 방향도 함께 바꿨다.","c":2,"ev":"9번 문장","s":[[9,"The moss balls moved together, and even changed direction together, like a herd of animals!","그 이끼 공들은 함께 움직였고, 심지어 동물 떼처럼 방향도 함께 바꿨어요!"]]},"h":"f6f3855f87"},{"n":9,"t":"sum","q":"Scientists were (A) to learn that the moss balls move (B) the ice.","ko":"과학자들은 이끼 공들이 얼음을 (B) 움직인다는 것을 알게 되어 (A).","opts":["(A) surprised / (B) across","(A) surprised / (B) under","(A) sleepy / (B) across","(A) sleepy / (B) under","(A) afraid / (B) across"],"oko":["(A) 놀랐다 / (B) 가로질러","(A) 놀랐다 / (B) 아래에서","(A) 졸렸다 / (B) 가로질러","(A) 졸렸다 / (B) 아래에서","(A) 무서웠다 / (B) 가로질러"],"r":{"a":"1) (A) surprised / (B) across ((A) 놀랐다 / (B) 가로질러)","w":"4번 문장 Scientists were surprised to learn that the moss balls move across the ice.에서 가져옴.","c":1,"ev":"4번 문장","s":[[4,"Scientists were surprised to learn that the moss balls move across the ice.","과학자들은 이끼 공들이 얼음을 가로질러 움직인다는 것을 알게 되어 놀랐어요."]]},"h":"413bd06cf3"},{"n":10,"t":"fill","q":"It’s a [A] mossy [B].","ko":"그것은 [A], 이끼로 뒤덮인 [B]이다.","bank":["mousy","mystery","noticed","wanted","learn","found"],"bko":{"mousy":"쥐를 닮은","mystery":"미스터리, 수수께끼","noticed":"알아차렸다(notice의 과거형)","wanted":"원했다(want의 과거형)","learn":"배우다","found":"찾았다(find의 과거형)"},"r":{"a":"[A] mousy (쥐를 닮은), [B] mystery (미스터리, 수수께끼)","w":"11번 문장 It’s a mousy mossy mystery.에서 가져옴. 나머지는 동사라 a ___ mossy ___ 자리에 맞지 않음.","c":null,"ev":"11번 문장","s":[[11,"It’s a mousy mossy mystery.","그것은 쥐를 닮은, 이끼로 뒤덮인 미스터리예요."]]},"h":"7c0858f8a8"}]},{"u":4,"id":"rg3-04-2","no":2,"ko":"한 명만 아픈데, 쌍둥이 둘 다 아프다고?","items":[{"n":1,"t":"tf","q":"Megan has stomach pain, back pain, and has lost weight like her sister.","ko":"Megan은 그녀의 자매처럼 복부 통증, 허리 통증이 있고 살이 빠졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Megan has stomach pain, back pain, and has lost weight just like her sister.","Megan은 복부 통증과 허리 통증이 있고 살이 빠졌는데, 꼭 그녀의 자매처럼 그렇다."]],"w":"4번 문장에 Megan has stomach pain, back pain, and has lost weight just like her sister가 있음. 자매처럼 같은 증상을 겪는다는 내용과 일치.","c":"T"},"h":"55ef47b448"},{"n":2,"t":"tf","q":"The doctors found a serious problem in Megan’s body after many tests.","ko":"의사들은 많은 검사 후에 Megan의 몸에서 심각한 문제를 찾았다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The doctors did many tests on Megan, but they found nothing wrong with her.","의사들은 Megan에게 많은 검사를 했지만, 그녀에게서 아무런 이상을 찾지 못했다."]],"w":"5번 문장에서 의사들은 많은 검사를 했지만 found nothing wrong with her(아무 이상도 찾지 못함). 심각한 문제를 찾았다는 것은 반대 내용.","c":"F"},"h":"4c9f8764c8"},{"n":3,"t":"tf","q":"Scientists know exactly why sympathy pain happens.","ko":"과학자들은 공감고통이 왜 일어나는지 정확히
