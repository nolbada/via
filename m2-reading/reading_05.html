<script>
var D=[{"n": 1, "tag": null, "en": "The new school year is here! Do you get nervously when you talk to other students?", "ko": "새 학년이 되었다! 당신은 다른 학생들과 대화할 때 긴장되는가?", "ok": false, "foot": [], "fixes": [{"wrong": "nervously", "right": "nervous", "partial": false, "at": [9], "point": "형용사와 부사: get 뒤 보어 자리에는 형용사 nervous 사용", "topic": "형용사와 부사", "memo": "get 뒤 보어 자리에는 형용사 nervous 사용"}]}, {"n": 2, "tag": null, "en": "Do you have trouble starting conversations? Having a good conversation are not easy.", "ko": "당신은 대화를 시작하는 데 어려움이 있는가? 대화를 잘하는 것은 쉽지 않다.", "ok": false, "foot": [], "fixes": [{"wrong": "are", "right": "is", "partial": false, "at": [10], "point": "be동사 수일치·과거: 동명사 주어는 단수 취급: is (are 아님)", "topic": "be동사 수일치·과거", "memo": "동명사 주어는 단수 취급: is (are 아님)"}]}, {"n": 3, "tag": null, "en": "But don't worry. Here is some tips to have a good conversation.", "ko": "하지만 걱정하지 마라. 여기 좋은 대화를 나누기 위한 몇 가지 조언이 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "are", "partial": false, "at": [4], "point": "be동사 수일치·과거: Here 뒤 주어 some tips(복수): are (is 아님)", "topic": "be동사 수일치·과거", "memo": "Here 뒤 주어 some tips(복수): are (is 아님)"}]}, {"n": 4, "tag": null, "en": "1. Start with small talk.", "ko": "1. 가벼운 대화로 시작해라.", "ok": true, "foot": [], "fixes": []}, {"n": 5, "tag": null, "en": "Begin conversations with a easy topic. Talk about the weather or hobbies.", "ko": "쉬운 주제로 대화를 시작해라. 날씨나 취미에 관해 말해라.", "ok": false, "foot": [], "fixes": [{"wrong": "a", "right": "an", "partial": false, "at": [3], "point": "관사 a/an: 모음 소리 easy 앞에는 an 사용", "topic": "관사 a/an", "memo": "모음 소리 easy 앞에는 an 사용"}]}, {"n": 6, "tag": null, "en": "For example, say, \"The weather is so nice today, doesn't it?\" Then the other person can answer easily.", "ko": "예를 들면, \"오늘 날씨가 아주 좋아, 그렇지 않니?\"라고 말해라. 그러면 상대방은 쉽게 대답할 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "doesn't", "right": "isn't", "partial": false, "at": [9], "point": "부가의문문: be동사 is에는 isn't it 사용", "topic": "부가의문문", "memo": "be동사 is에는 isn't it 사용"}]}, {"n": 7, "tag": null, "en": "Small talk can leads to other fun topics to talk about.", "ko": "가벼운 대화는 대화할 다른 재미있는 주제로 이어질 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "leads", "right": "lead", "partial": false, "at": [3], "point": "조동사: 조동사 can 뒤에는 동사원형: lead (leads 아님)", "topic": "조동사", "memo": "조동사 can 뒤에는 동사원형: lead (leads 아님)"}]}, {"n": 8, "tag": null, "en": "2. Listen actively.", "ko": "2. 적극적으로 들어라.", "ok": true, "foot": [], "fixes": []}, {"n": 9, "tag": null, "en": "Don't just sit still and listen. Active listen.", "ko": "그저 가만히 앉아서 듣지 마라. 적극적으로 들어라.", "ok": false, "foot": [], "fixes": [{"wrong": "Active", "right": "Actively", "partial": false, "at": [6], "point": "형용사와 부사: 동사 listen을 꾸밀 때는 부사 Actively 사용", "topic": "형용사와 부사", "memo": "동사 listen을 꾸밀 때는 부사 Actively 사용"}]}, {"n": 10, "tag": null, "en": "Make eyes contact with the speaker. Nod you head from time to time.", "ko": "화자와 눈을 맞춰라. 때때로 당신의 고개를 끄덕여라.", "ok": false, "foot": [], "fixes": [{"wrong": "eyes", "right": "eye", "partial": false, "at": [1], "point": "명사의 복수형: 명사를 꾸미는 eye는 단수형 사용 (eye contact)", "topic": "명사의 복수형", "memo": "명사를 꾸미는 eye는 단수형 사용 (eye contact)"}, {"wrong": "you", "right": "your", "partial": false, "at": [7], "point": "인칭대명사의 격: 명사 앞 소유격 your 사용", "topic": "인칭대명사의 격", "memo": "명사 앞 소유격 your 사용"}]}, {"n": 11, "tag": null, "en": "You can also say, \"Right,\" or \"I see.\" These things will shows that you're really listening.", "ko": "당신은 또한 \"맞아.\" 또는 \"그렇구나.\"라고 말할 수 있다. 이러한 것들은 당신이 정말로 듣고 있다는 것을 보여줄 것이다.", "ok": false, "foot": [], "fixes": [{"wrong": "shows", "right": "show", "partial": false, "at": [11], "point": "조동사: 조동사 will 뒤에는 동사원형: show (shows 아님)", "topic": "조동사", "memo": "조동사 will 뒤에는 동사원형: show (shows 아님)"}]}, {"n": 12, "tag": null, "en": "3. Use body language.", "ko": "3. 몸짓 언어를 사용해라.", "ok": true, "foot": [], "fixes": []}, {"n": 13, "tag": null, "en": "Use good gestures. When you say, \"I don't know,\" you can raising your shoulders and hands.", "ko": ght": "slowest", "partial": false, "at": [10], "point": "최상급: slow의 최상급은 the slowest", "topic": "최상급", "memo": "slow의 최상급은 the slowest"}, {"wrong": "on", "right": "in", "partial": false, "at": [13], "point": "기본전치사: '학급에서'는 전치사 in 사용", "topic": "기본전치사", "memo": "'학급에서'는 전치사 in 사용"}, {"wrong": "does", "right": "do", "partial": false, "at": [24], "point": "조동사: 조동사 will 뒤에는 동사원형: do (does 아님)", "topic": "조동사", "memo": "조동사 will 뒤에는 동사원형: do (does 아님)"}]}, {"n": 19, "tag": null, "en": "This can lead to an more meaningful conversation.", "ko": "이것은 더 의미 있는 대화로 이어질 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [4], "point": "관사 a/an: 자음 소리 more 앞에는 a 사용", "topic": "관사 a/an", "memo": "자음 소리 more 앞에는 a 사용"}]}];var PP=[["The new school year is here!", "새 학년이 되었다!", 1], ["Do you get nervous when you talk to other students?", "당신은 다른 학생들과 대화할 때 긴장되는가?", 0], ["Do you have trouble starting conversations?", "당신은 대화를 시작하는 데 어려움이 있는가?", 0], ["Having a good conversation is not easy.", "대화를 잘하는 것은 쉽지 않다.", 0], ["But don't worry.", "하지만 걱정하지 마라.", 0], ["Here are some tips to have a good conversation.", "여기 좋은 대화를 나누기 위한 몇 가지 조언이 있다.", 0], ["1. Start with small talk.", "1. 가벼운 대화로 시작해라.", 1], ["Begin conversations with an easy topic.", "쉬운 주제로 대화를 시작해라.", 1], ["Talk about the weather or hobbies.", "날씨나 취미에 관해 말해라.", 0], ["For example, say, \"The weather is so nice today, isn't it?\"", "예를 들면, \"오늘 날씨가 아주 좋아, 그렇지 않니?\"라고 말해라.", 0], ["Then the other person can answer easily.", "그러면 상대방은 쉽게 대답할 수 있다.", 0], ["Small talk can lead to other fun topics to talk about.", "가벼운 대화는 대화할 다른 재미있는 주제로 이어질 수 있다.", 0], ["2. Listen actively.", "2. 적극적으로 들어라.", 1], ["Don't just sit still and listen.", "그저 가만히 앉아서 듣지 마라.", 1], ["Actively listen.", "적극적으로 들어라.", 0], ["Make eye contact with the speaker.", "화자와 눈을 맞춰라.", 0], ["Nod your head from time to time.", "때때로 당신의 고개를 끄덕여라.", 0], ["You can also say, \"Right,\" or \"I see.\"", "당신은 또한 \"맞아.\" 또는 \"그렇구나. se good gestures. When you say, \"I don't know,\" you can raise your shoulders and hands. You can also make facial expressions. Lift your eyebrows or stick out your lower lip. Use good body language, and your message will be stronger and clearer.", "4. Share your story.", "Be brave and tell your personal story. For example, you can talk about your childhood. You can say, \"When I was 10, I was the slowest runner in my class.\" When you open up, the other person will do the same. This can lead to a more meaningful conversation."];var PASS_KO=["좋은 대화를 나눠라!", "새 학년이 되었다! 당신은 다른 학생들과 대화할 때 긴장되는가? 당신은 대화를 시작하는 데 어려움이 있는가? 대화를 잘하는 것은 쉽지 않다. 하지만 걱정하지 마라. 여기 좋은 대화를 나누기 위한 몇 가지 조언이 있다.", "1. 가벼운 대화로 시작해라.", "쉬운 주제로 대화를 시작해라. 날씨나 취미에 관해 말해라. 예를 들면, \"오늘 날씨가 아주 좋아, 그렇지 않니?\"라고 말해라. 그러면 상대방은 쉽게 대답할 수 있다. 가벼운 대화는 대화할 다른 재미있는 주제로 이어질 수 있다.", "2. 적극적으로 들어라.", "그저 가만히 앉아서 듣지 마라. 적극적으로 들어라. 화자와 눈을 맞춰라. 때때로 당신의 고개를 끄덕여라. 당신은 또한 \"맞아.\" 또는 \"그렇구나.\"라고 말할 수 있다. 이러한 것들은 당신이 정말로 듣고 있다는 것을 보여줄 것이다.", "3. 몸짓 언어를 사용해라.", "적절한 몸짓을 사용해라. 당신이 \"나는 모르겠어.\"라고 말할 때, 당신의 어깨와 손을 들어 올릴 수 있다. 당신은 또한 얼굴 표정을 지을 수 있다. 눈썹을 올리거나 아랫입술을 내밀어라. 적절한 몸짓 언어를 사용해라, 그러면 당신의 메시지가 더 강력하고 더 명확해질 것이다.", "4. 당신의 이야기를 공유해라.", "용기를 내어 당신의 개인적인 이야기를 말해라. 예를 들면, 당신은 어린 시절에 관해 말할 수 있다. 당신은 \"내가 10살이었을 때, 나는 반에서 달리기가 가장 느린 주자였어.\"라고 말할 수 있다. 당신이 마음을 열 때, 상대방도 똑같이 할 것이다. 이것은 더 의미 있는 대화로 이어질 수 있다."];

  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   var R=f.right?'\u0001'+f.right+'\u0002':'';
   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0003'+f.wrong+'\u0004'+R);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+'\u0003'+f.wrong+'\u0004'+(R?' '+R:'')+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return esc(tk.join(' ').replace(/ ?\u0000/g,'')).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>').replace(/\u0003/g,'<del>').replace(/\u0004/g,'</del>')}

 if(it.ok){return '<div class="ac s1"><div class="ac-top fine"><b>맞는 문장</b><span class="ac-a">어법 오류 없음</span>'+(wp?'<span class="ac-x">틀리게 고른 곳 : <span lang="en">'+esc(wrongWords(i).join(', '))+'</span></span>':'')+'</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});

 var h='<div class="ac s1"><div class="ac-top'+(all?' g':'')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+'</b>'+(wp?'<span class="ac-x">틀리게 고른 곳 : <span lang="en">'+esc(wrongWords(i).join(', '))+'</span></span>':'')+'</div>';
 it.fixes.forEach(function(f,k){var ok=foundFix(i,k);
  h+='<div class="fc '+(ok?'f':'m')+'"><div><span class="tg2">'+(ok?'찾음':'놓침')+'</span>'+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr" lang="en">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt" lang="en">'+esc(f.right)+'</span></div><div class="fcb">'+pointHtml(f)+(f.gl?f.gl.map(function(g){return '<div class="fgl">'+esc(g)+'</div>'}).join(''):'')+'</div></div>'});
 return h+'<div style="height:12px"></div></div>';

function critHtml(f){var w=f.wrong.split(/\s+/),r=f.right.split(/\s+/);
 if(f.alt&&f.alt.length)return '<div class="crit">빠진 말 문제 : 빠진 자리 양옆 어느 단어를 눌러도 정답으로 인정</div>';
 if(w.length==2&&r.length==2&&w.slice().sort().join()==r.slice().sort().join()&&w.join()!=r.join())return '<div class="crit">어순 문제 : 옮겨진 말과 짝이 되는 단어, 어느 쪽을 눌러도 정답으로 인정</div>';return ''}

 h+='</div><div class="ac-sec">왜 정답일까</div><div class="oc g"><div class="why">'+reasonHtml(q.ow[q.a])+'</div></div>';

function qCard(i){
 var q=QL[i],st=qst[q.n]||(qst[q.n]={w:[],ok:0,adv:0,t0:Date.now(),t1:0,wrote:0});

 if(q.sum)h+='<div class="sumbox" lang="en">'+esc(q.sum)+'</div>';
 if(!st.w.length){
  q.o.forEach(function(t,j){
   h+='<div class="opt'+(st.ok&&j===q.a?' good':'')+'"'+(st.ok?'':' data-q="'+q.n+'" data-o="'+j+'"')+'><span class="cn">'+CN[j]+'</span><span>'+(q.ko?en(t):esc(t))+'</span></div>';
  });

function wrongCard(q,st){
 var h='<div class="ac"><div class="ac-top"><b>오답</b><span class="ac-a">정답 '+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<div class="ac-k">'+esc(q.ko[q.a])+'</div>':'')+'</div>';

 }
 h+='<div class="ac-sec">보기 풀이</div>';
 q.o.forEach(function(t,j){var isA=j===q.a,isW=st.w.indexOf(j)>=0;
  h+='<div class="oc'+(isA?' g':isW?' r':'')+'"><div class="oh"><span class="cn">'+CN[j]+'</span><div class="ot">'+(q.ko?en(t):esc(t))+(q.ko?'<div class="okr">'+esc(q.ko[j])+'</div>':'')+'</div>'+(isA?'<span class="tg">정답</span>':isW?'<span class="tg">내가 고름</span>':'')+'</div><div class="why">'+reasonHtml(q.ow[j])+'</div></div>';
 });
 var tr=(q.memo||[]).filter(function(l){return /^함정/.test(l)})[0];
 if(tr)h+='<div class="trap"><b>함정</b> '+esc(tr.replace(/^함정\s*:\s*/,'').replace(/\s*✕/g,''))+'</div>';
 if(!st.ok){

  q.o.forEach(function(t,j){var xx=st.w.indexOf(j)>=0;h+='<div class="opt'+(xx?' xx':'')+'" data-q="'+q.n+'" data-o="'+j+'"><span class="cn">'+CN[j]+'</span><span>'+(q.ko?en(t):esc(t))+'</span></div>'});
  h+='</div>';
 } else {

 }
 return h+'</div>';

}
