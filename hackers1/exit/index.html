 것은?","sko":"그곳은 9만 석의 좌석과 2만 5천 명을 위한 입석을 가지고 있을 만큼 충분히 크다.","opts":["그곳은 너무 작아서 9만 석의 좌석을 가질 수 없다.","그곳은 9만 석의 좌석과 2만 5천 명이 서서 볼 자리를 가질 만큼 충분히 크다.","그곳은 2만 5천 석의 좌석과 9만 명을 위한 입석이 있다.","그곳은 좌석이 9만 석이고 입석은 없다."],"r":{"a":"2) 그곳은 9만 석의 좌석과 2만 5천 명이 서서 볼 자리를 가질 만큼 충분히 크다.","ev":"6번 문장","s":[[6,"It is big enough to have 90,000 seats and standing space for 25,000 people.","그곳은 9만 석의 좌석과 2만 5천 명을 위한 입석을 가지고 있을 만큼 충분히 크다."]],"w":"형용사 + enough to는 '~할 만큼 충분히 …한'이에요. 좌석 9만 석과 입석 2만 5천 명 자리가 모두 있다는 뜻이라 2번이에요. 숫자를 서로 바꾼 3번과 입석이 없다는 4번은 6번과 달라요.","c":2},"h":"e98fe32543"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["When a goal is scored, the lights in the arch flash.","When a goal is scored, the lights in the arch turn off.","The lights in the arch are on only during the daytime.","The lights in the arch are on only when a singer is on the stage."],"oko":["골이 득점되면 아치의 전등이 번쩍인다.","골이 득점되면 아치의 전등이 꺼진다.","아치의 전등은 낮 동안에만 켜져 있다.","아치의 전등은 가수가 무대에 있을 때만 켜져 있다."],"r":{"a":"1) When a goal is scored, the lights in the arch flash. (골이 득점되면 아치의 전등이 번쩍인다.)","ev":"4번 문장","s":[[4,"When a goal is scored, colored LED lights in the arch flash.","골이 득점되면, 아치에 있는 색이 입혀진 LED 전등이 번쩍인다."]],"c":1,"w":"4번 문장에서 골이 득점되면 아치에 있는 LED 전등이 번쩍인다고 해요."},"h":"f5b07c9363"},{"n":9,"t":"sum","q":"Wembley Stadium is also (A) among fans of (B) music.","ko":"웸블리 스타디움은 (B) 음악 팬들 사이에서도 (A).","opts":["(A) popular / (B) pop","(A) popular / (B) classical","(A) boring / (B) pop","(A) boring / (B) classical","(A) empty / (B) classical"],"oko":["(A) 인기가 있다 / (B) 대중","(A) 인기가 있다 / (B) 클래식","(A) 지루하다 / (B) 대중","(A) 지루하다 / (B) 클래식","(A) 비어 있다 / (B) 클래식"],"r":{"a":"1) (A) popular / (B) pop ((A) 인기가 있다 / (B) 대중)","ev":"8번 문장","s":[[8,"Wembley Stadium is also popular among fans of pop music.","웸블리 스타디움은 대중음악 팬들 사이에서도 인기가 있다."]],"c":1,"w":"8번 문장: 웸블리 스타디움은 대중음악(pop music) 팬들 사이에서도 인기가 있다(popular)."},"h":"c8e6d43fd5"},{"n":10,"t":"fill","q":"Wembley Stadium is a [A] football stadium in [B].","ko":"웸블리 스타디움은 [B]에 있는 [A] 축구 경기장이다.","bank":["famous","London","even","also","enough","there"],"bko":{"famous":"유명한","London":"런던","even":"심지어","also":"또한","enough":"충분히","there":"그곳에"},"r":{"a":"[A] famous (유명한), [B] London (런던)","ev":"1번 문장","s":[[1,"Wembley Stadium is a famous football stadium in London.","웸블리 스타디움은 런던에 있는 유명한 축구 경기장이다."]],"c":null,"w":"1번 문장: 웸블리 스타디움은 런던(London)에 있는 유명한(famous) 축구 경기장이에요."},"h":"9ada6cd831"}]},{"u":9,"id":"hk1-09-4","no":4,"ko":"눈사람도 추워요!","items":[{"n":1,"t":"tf","q":"The snowman Olaf stays frozen thanks to the snow queen.","ko":"눈사람 올라프는 눈의 여왕 덕분에 언 상태를 유지한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"The snowman Olaf stays frozen thanks to the snow queen.","눈사람 올라프는 눈의 여왕 덕분에 언 상태를 유지한다."]],"w":"1번 문장에 stays frozen thanks to the snow queen이 그대로 있어요. 눈의 여왕 덕분에 언 상태를 유지한다는 내용과 일치해요.","c":"T"},"h":"f07a46c7ca"},{"n":2,"t":"tf","q":"After about an hour, the snowman with the blanket melts first.","ko":"약 한 시간 후, 담요를 두른 눈사람이 먼저 녹는다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"After about an hour, one of them melts and falls apart.","약 한 시간 후, 그것들 중 하나는 녹아서 허물어진다."],[8,"Surprisingly, it is the snowman without the blanket.","놀랍게도, 그것은 담요가 없는 눈사람이다."]],"w":"7번에서 한 시간 뒤에 한 눈사람이 녹아 허물어진다고 하고, 8번에서 놀랍게도 그것은 담요가 없는 눈사람이라고 해요. 담요를 두른 쪽이 먼저 녹는다는 말은 반대예요.","c":"F"},"h":"ee212b62c8"},{"n":3,"t":"tf","q":"Heat always flows from a hot area to a colder one.","ko":"열은 항상 더운 곳에서 더 찬 곳으로 흐른다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Heat always flows from a hot area to a colder one.","열은 항상 더운 곳에서 더 찬 곳으로 흐른다."]],"w":"10번 문장에서 Heat always flows from a hot area to a colder one이라고 해요. from A to B는 'A에서 B로'예요.","c":"T"},"h":"4bcb7aa868"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (After about an hour, one of them melts and falls apart.)","ko":"약 한 시간 후, 그것들 중 하나는 녹아서 허물어진다.","opts":["녹다","얼다","자라다","날다"],"word":"melts","r":{"a":"1) 녹다","ev":"7번, 11번 문장","s":[[7,"After about an hour, one of them melts and falls apart.","약 한 시간 후, 그것들 중 하나는 녹아서 허물어진다."],[11,"If there is no blanket, the warm air reaches the snowman and melts it.","만약 담요가 없다면, 따뜻한 공기는 눈사람에 닿아서 그것을 녹인다."]],"w":"눈사람이 허물어진다고 했고, 11번에서 따뜻한 공기가 눈사람에 닿아 melts it(그것을 녹인다)이라고 해요. melt = 녹다, 녹이다.","c":1},"h":"1d2a237e2f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, the blanket prevents the warm air from reaching it.)","ko":"하지만, 담요는 따뜻한 공기가 눈사람에 닿는 것을 막는다.","opts":["가져온다","막는다","만든다","돕는다"],"word":"prevents","r":{"a":"2) 막는다","ev":"11~12번 문장","s":[[11,"If there is no blanket, the warm air reaches the snowman and melts it.","만약 담요가 없다면, 따뜻한 공기는 눈사람에 닿아서 그것을 녹인다."],[12,"However, the blanket prevents the warm air from reaching it.","하지만, 담요는 따뜻한 공기가 눈사람에 닿는 것을 막는다."]],"w":"11번은 담요가 없을 때 따뜻한 공기가 눈사람에 닿는 이야기이고, 12번은 However(하지만)로 그 반대를 말해요. 닿는 것을 '막는다'는 뜻이라서 prevent = 막다예요.","c":2},"h":"629b2ef348"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nJust cover him with a blanket!","ko":"밑줄 친 him가 가리키는 것은?","sko":"그를 담요로 덮기만 해라!","opts":["눈의 여왕","담요","마법의 힘","구해줄 눈사람"],"pron":"him","r":{"a":"4) 구해줄 눈사람","ev":"2~3번 문장","s":[[2,"But we can also save a snowman without magical powers.","하지만 우리도 마법의 힘 없이 눈사람을 구해줄 수 있다."],[3,"Just cover him with a blanket!","그를 담요로 덮기만 해라!"]],"c":4,"k":"him = 구해줄 눈사람","w":"2번 문장의 a snowman(눈사람)을 3번 문장의 him이 가리켜요. 그를 담요로 덮으라는 뜻이에요."},"h":"a8c45b0a05"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"How come?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"왜일까?","opts":["왜일까?","어떻게 오는가?","어디에서 왔는가?","누가 왔는가?"],"r":{"a":"1) 왜일까?","ev":"9번 문장","s":[[9,"How come?","왜일까?"]],"c":1,"w":"How come?은 왜 그런지 이유를 묻는 표현이에요."},"h":"458038d05d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["We can save a snowman without magical powers.","Only the snow queen can save a snowman.","A snowman can be saved only by magical powers.","We cannot save a snowman at all."],"oko":["우리는 마법의 힘 없이도 눈사람을 구해줄 수 있다.","눈의 여왕만이 눈사람을 구할 수 있다.","눈사람은 마법의 힘으로만 구해질 수 있다.","우리는 눈사람을 전혀 구할 수 없다."],"r":{"a":"1) We can save a snowman without magical powers. (우리는 마법의 힘 없이도 눈사람을 구해줄 수 있다.)","ev":"2번 문장","s":[[2,"But we can also save a snowman without magical powers.","하지만 우리도 마법의 힘 없이 눈사람을 구해줄 수 있다."]],"c":1,"w":"2번 문장에서 마법의 힘 없이도 눈사람을 구해줄 수 있다고 해요."},"h":"e346e6e67b"},{"n":9,"t":"sum","q":"The other is (A) (B).","ko":"나머지 하나는 (B)도 (A) 있지 않다.","opts":["(A) wearing / (B) nothing","(A) wearing / (B) something","(A) eating / (B) nothing","(A) eating / (B) something","(A) losing / (B) something"],"oko":["(A) 걸치고 / (B) 아무것","(A) 걸치고 / (B) 무언가","(A) 먹고 / (B) 아무것","(A) 먹고 / (B) 무언가","(A) 잃고 / (B) 무언가"],"r":{"a":"1) (A) wearing / (B) nothing ((A) 걸치고 / (B) 아무것)","ev":"6번 문장","s":[[6,"The other is wearing nothing.","나머지 하나는 아무것도 걸치고 있지 않다."]],"c":1,"w":"6번 문장: 나머지 하나는 아무것도(nothing) 걸치고(wearing) 있지 않다."},"h":"0dc8f3458a"},{"n":10,"t":"fill","q":"Let’s [A] there are two snowmen. [B] is covered with a blanket.","ko":"두 개의 눈사람이 있다고 [A]해보자. [B]은(는) 담요로 덮여 있다.","bank":["say","One","quickly","slowly","always","surprisingly"],"bko":{"say":"가정하다(say)","One":"하나","quickly":"빠르게","slowly":"천천히","always":"항상","surprisingly":"놀랍게도"},"r":{"a":"[A] say (가정하다(say)), [B] One (하나)","ev":"4~5번 문장","s":[[4,"Let’s say there are two snowmen.","두 개의 눈사람이 있다고 가정해보자."],[5,"One is covered with a blanket.","하나는 담요로 덮여 있다."]],"c":null,"w":"4~5번 문장: 눈사람이 두 개 있다고 해보자(say), 하나(One)는 담요로 덮여 있어요."},"h":"0a1b6bdf98"}]},{"u":10,"id":"hk1-10-1","no":1,"ko":"LA에서 만나요","items":[{"n":1,"t":"tf","q":"Ahn went to the United States in 1902 to study.","ko":"안창호 선생은 공부하기 위해 1902년에 미국으로 갔다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","w":"6번 문장에 In 1902, Ahn went to the United States to study.라고 그대로 나와요. 1902년, 미국, 공부하기 위해 모두 맞아요.","c":"T","s":[[6,"In 1902, Ahn went to the United States to study.","1902년에, 안창호 선생은 공부를 하기 위해 미국으로 갔다."]]},"h":"d45a6c2fe8"},{"n":2,"t":"tf","q":"Korean students and workers in the United States had many opportunities to become successful.","ko":"미국에 있던 한인 학생들과 노동자들에게는 성공할 수 있는 기회가 많았다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","w":"8번 문장은 They didn’t have many opportunities라고 해요. 기회가 많지 않았다는 말이라 '많았다'는 반대예요.","c":"F","s":[[7,"There, he found that Korean students and workers were living under poor conditions.","그곳에서, 그는 한인 학생들과 노동자들이 열악한 환경하에 살고 있었다는 것을 알게 되었다."],[8,"They didn’t have many opportunities to become successful.","그들에게는 성공할 수 있는 기회가 많지 않았다."]]},"h":"3acc40b2b0"},{"n":3,"t":"tf","q":"The people in Korea Town joined Ahn and fought with him.","ko":"한인타운의 사람들은 안창호 선생에게 동참해 그와 함께 투쟁했다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","w":"11번 문장에 joined and fought with him이 나와요. him은 안창호 선생이므로 맞는 말이에요.","c":"T","s":[[11,"The people in Korea Town joined and fought with him.","한인타운의 사람들도 동참해서 그와 함께 투쟁했다."]]},"h":"c0d66f3715"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They didn’t have many opportunities to become successful.)","ko":"그들에게는 성공할 수 있는 기회가 많지 않았다. (opportunities의 뜻은?)","opts":["문제들","기회들","비용","약속"],"word":"opportunities","r":{"a":"2) 기회들","ev":"8번 문장","w":"opportunity는 '기회'예요. 성공할 수 있는 ○○가 많지 않았다는 흐름이라, 문제나 비용이 아니라 '기회'가 알맞아요.","c":2,"s":[[8,"They didn’t have many opportunities to become successful.","그들에게는 성공할 수 있는 기회가 많지 않았다."]]},"h":"6a314e6de1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the people in Korea Town still remember and celebrate Ahn’s achievements.)","ko":"...한인타운의 사람들은 여전히 안창호 선생의 achievements를 기억하고 기념한다. (achievements의 뜻은?)","opts":["실수들","재산","약속","업적"],"word":"achievements","r":{"a":"4) 업적","ev":"12번 문장","w":"사람들이 지금까지 기억하고 기념하는 것은 선생이 이룬 일, 즉 '업적'이에요. 기념하는 대상으로 실수나 재산은 어울리지 않아요.","c":4,"s":[[12,"To this day, the people in Korea Town still remember and celebrate Ahn’s achievements.","지금까지도, 한인타운의 사람들은 여전히 안창호 선생의 업적을 기억하고 기념한다."]]},"h":"899ecb30e4"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nA post office and square are also named after him.","ko":"밑줄 친 him가 가리키는 것은?","sko":"우체국과 광장도 그의 이름을 따서 이름 지어졌다.","opts":["이름이 시내 곳곳에 보이는 그 남자","우체국 직원","광장에서 만난 관광객","교차로 표지판"],"pron":"him","r":{"a":"1) 이름이 시내 곳곳에 보이는 그 남자","ev":"1~3번 문장","s":[[1,"If you go to Korea Town in Los Angeles, you can see one man’s name throughout the town.","만약 당신이 로스앤젤레스의 한인타운에 간다면, 시내 도처에서 한 남자의 이름을 볼 수 있다."],[2,"An interchange sign includes his name.","교차로 표지판이 그의 이름을 포함하고 있다."],[3,"A post office and square are also named after him.","우체국과 광장도 그의 이름을 따서 이름 지어졌다."]],"c":1,"k":"him = 이름이 시내 곳곳에 보이는 그 남자","w":"1번 문장의 one man(한 남자)을 3번 문장의 him이 가리켜요. 그의 이름을 따서 우체국과 광장 이름을 지었어요."},"h":"1841f2a6d6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Ahn created a Korean community and tried to educate them and find them jobs.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"안창호 선생은 한인 공동체를 만들어서 그들을 교육하고 그들에게 일자리를 찾아 주기 위해 노력했다.","opts":["안창호 선생은 한인들에게 일자리를 얻은 뒤 공동체를 떠나라고 했다.","한인 공동체가 안창호 선생을 교육하고 일자리를 찾아 주었다.","안창호 선생은 한인 공동체를 만들어서 한인들을 교육하고 일자리를 찾아 주려고 노력했다.","안창호 선생은 일본인 공동체를 만들어서 그들을 가르쳤다."],"r":{"a":"3) 안창호 선생은 한인 공동체를 만들어서 한인들을 교육하고 일자리를 찾아 주려고 노력했다.","ev":"9번 문장","w":"주어는 Ahn이고, 그가 공동체를 만들고(created) 한인들을 교육하고 일자리를 찾아 주려고(tried to educate and find jobs) 했어요. 나머지는 주어나 대상이 바뀌었거나 본문에 없는 내용이에요.","c":3,"s":[[9,"Therefore, Ahn created a Korean community and tried to educate them and find them jobs.","그래서, 안창호 선생은 한인 공동체를 만들어서 그들을 교육하고 그들에게 일자리를 찾아 주기 위해 노력했다."]]},"h":"bf5521ece1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["안창호 선생은 공부하기 위해 1902년에 일본으로 갔다.","미국에 있던 한인 학생들과 노동자들은 성공할 기회가 많았다.","한인타운의 사람들은 안창호 선생의 투쟁에 동참하지 않았다.","안창호 선생은 일본이 한국을 점령했을 때 한국의 독립을 위해 투쟁했다."],"opts":["Ahn went to Japan to study in 1902.","Korean students and workers in the United States had many chances to become successful.","The people in Korea Town did not join Ahn’s fight.","Ahn fought for Korea’s independence when Japan took over Korea."],"r":{"a":"4) Ahn fought for Korea’s independence when Japan took over Korea.","ev":"6·8·10·11번 문장","w":"10번 문장에 일본이 한국을 점령했을 때 독립을 위해 투쟁했다고 나와요. 선생이 간 곳은 일본이 아니라 미국(6번), 기회는 많지 않았고(8번), 사람들은 동참했어요(11번).","c":4,"s":[[6,"In 1902, Ahn went to the United States to study.","1902년에, 안창호 선생은 공부를 하기 위해 미국으로 갔다."],[8,"They didn’t have many opportunities to become successful.","그들에게는 성공할 수 있는 기회가 많지 않았다."],[10,"Ahn also fought for Korea’s independence when Japan took over Korea.","안창호 선생은 또한 일본이 한국을 점령했을 때 한국의 독립을 위해 투쟁했다."],[11,"The people in Korea Town joined and fought with him.","한인타운의 사람들도 동참해서 그와 함께 투쟁했다."]]},"h":"0cc741b92b"},{"n":9,"t":"sum","q":"If you go to Korea Town in Los Angeles, you can see one (A)’s name (B) the town.","ko":"만약 당신이 로스앤젤레스의 한인타운에 간다면, 시내 (B)에서 한 (A)의 이름을 볼 수 있다.","opts":["(A) man / (B) throughout","(A) woman / (B) throughout","(A) man / (B) outside","(A) woman / (B) outside","(A) boy / (B) outside"],"oko":["(A) 남자 / (B) 도처","(A) 여자 / (B) 도처","(A) 남자 / (B) 바깥","(A) 여자 / (B) 바깥","(A) 소년 / (B) 바깥"],"r":{"a":"1) (A) man / (B) throughout ((A) 남자 / (B) 도처)","ev":"1번 문장","s":[[1,"If you go to Korea Town in Los Angeles, you can see one man’s name throughout the town.","만약 당신이 로스앤젤레스의 한인타운에 간다면, 시내 도처에서 한 남자의 이름을 볼 수 있다."]],"c":1,"w":"1번 문장: 시내 도처에서(throughout) 한 남자(man)의 이름을 볼 수 있어요."},"h":"a1e558e3f2"},{"n":10,"t":"fill","q":"An [A] sign [B] his name.","ko":"[A] 표지판이 그의 이름을 [B].","bank":["interchange","includes","still","also","therefore","never"],"bko":{"interchange":"교차로","includes":"포함하고 있다(include의 3인칭 단수)","still":"여전히","also":"또한","therefore":"그래서","never":"결코 ~ 않다"},"r":{"a":"[A] interchange (교차로), [B] includes (포함하고 있다(include의 3인칭 단수))","ev":"2번 문장","s":[[2,"An interchange sign includes his name.","교차로 표지판이 그의 이름을 포함하고 있다."]],"c":null,"w":"2번 문장: 교차로(interchange) 표지판이 그의 이름을 포함하고 있다(includes)."},"h":"e844660ff0"}]},{"u":10,"id":"hk1-10-2","no":2,"ko":"90초면 사르르~","items":[{"n":1,"t":"tf","q":"The writer was very angry and threw a phone.","ko":"글쓴이는 너무 화가 나서 전화기를 던졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에 I was very angry and even threw my phone.이 나와요. 화가 나서 전화기를 던졌다는 내용과 같아요.","c":"T","s":[[2,"I was very angry and even threw my phone.","저는 너무 화가 나서 제 전화기를 던지기까지 했어요."]]},"h":"6b91f75b6a"},{"n":2,"t":"tf","q":"Dr. Helper says that something is wrong with the writer.","ko":"Helper 박사는 글쓴이에게 문제가 있다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","w":"5번 Don’t worry, 6번 Nothing is wrong with you!라고 해요. 문제가 있다고 한 것이 아니라 아무 문제 없다고 안심시켜요.","c":"F","s":[[5,"Don’t worry.","걱정하지 말아요."],[6,"Nothing is wrong with you!","당신에게는 아무런 문제가 없어요!"]]},"h":"d998a634ef"},{"n":3,"t":"tf","q":"Many people become angry quickly and regret it later.","ko":"많은 사람들이 금방 화를 내고 나중에 그것을 후회한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","w":"7번 문장에 그대로 나와요. 글쓴이만 그런 것이 아니라 많은 사람이 같은 경험을 한다는 내용이에요.","c":"T","s":[[7,"Many people become angry quickly and regret it later.","많은 사람들이 금방 화를 내고 나중에 그것을 후회해요."]]},"h":"b1031a4483"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Many people become angry quickly and regret it later.)","ko":"많은 사람들이 금방 화를 내고 나중에 그것을 후회한다. (regret의 뜻은?)","opts":["후회하다","자랑하다","설명하다","기억하다"],"word":"regret","r":{"a":"1) 후회하다","ev":"3번, 7번 문장","w":"3번에서 글쓴이가 화낸 것을 feel bad(후회)한다고 했고, 7번은 많은 사람들도 그렇다는 말이에요. regret = 후회하다.","c":1,"s":[[3,"Now I feel bad for losing my temper.","지금 저는 화를 낸 것을 후회해요."],[7,"Many people become angry quickly and regret it later.","많은 사람들이 금방 화를 내고 나중에 그것을 후회해요."]]},"h":"fb857799f8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...just leave the area and clear your mind.)","ko":"...그냥 그 장소를 떠나서 마음을 clear하는 거예요. (clear의 뜻은?)","opts":["채우다","숨기다","비우다","따라 하다"],"word":"clear","r":{"a":"3) 비우다","ev":"13번 문장","w":"화가 난 마음을 가라앉히는 방법이므로 clear your mind는 '마음을 비우다'예요. 채우거나 숨긴다면 화가 풀리기 어려워요.","c":3,"s":[[13,"The best thing to do is to just leave the area and clear your mind.","당신이 할 수 있는 가장 좋은 것은 그냥 그 장소를 떠나서 마음을 비우는 거예요."]]},"h":"9b9654cd23"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nUsually, it goes back to a normal level after only 90 seconds.","ko":"밑줄 친 it이 가리키는 것은?","sko":"보통, 그것은 단 90초 후면 정상 수준으로 돌아가요.","opts":["당신의 몸","코르티솔(의 수치)","싸움","90초"],"r":{"a":"2) 코르티솔(의 수치)","ev":"8~9번 문장","w":"8번에서 화가 나면 몸이 cortisol을 많이 만들어 낸다고 했어요. 9번의 it은 그 코르티솔이 90초 후면 정상 수준으로 돌아간다는 뜻이에요.","c":2,"s":[[8,"When you get upset, your body produces a greater amount of cortisol, the anger hormone.","화가 났을 때, 당신의 몸은 더 많은 양의 분노 호르몬인 코르티솔을 만들어 내요."],[9,"Usually, it goes back to a normal level after only 90 seconds.","보통, 그것은 단 90초 후면 정상 수준으로 돌아가요."]]},"h":"ec3cd5f9f7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This means the physical reaction to anger doesn’t actually last long.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 분노에 대한 신체 반응이 사실상 오래 지속되지 않는다는 것을 의미해요.","opts":["분노에 대한 신체 반응은 아주 오랫동안 계속된다.","분노에 대한 신체 반응은 실제로는 일어나지 않는다.","분노에 대한 신체 반응은 90분 후에야 시작된다.","분노에 대한 신체 반응은 사실상 오래 가지 않는다."],"r":{"a":"4) 분노에 대한 신체 반응은 사실상 오래 가지 않는다.","ev":"9~10번 문장","w":"doesn’t actually last long은 '사실상 오래 지속되지 않는다'예요. 9번에서 90초면 정상으로 돌아간다고 했으니 짧게 끝난다는 뜻이에요.","c":4,"s":[[9,"Usually, it goes back to a normal level after only 90 seconds.","보통, 그것은 단 90초 후면 정상 수준으로 돌아가요."],[10,"This means the physical reaction to anger doesn’t actually last long.","이것은 분노에 대한 신체 반응이 사실상 오래 지속되지 않는다는 것을 의미해요."]]},"h":"7fbebff18b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Cortisol is a hormone that your body makes more of when you are upset.","Cortisol goes back to a normal level only after 90 minutes.","Dr. Helper tells the writer to stay angry all day.","The writer is proud of throwing the phone."],"oko":["코르티솔은 화가 났을 때 몸이 더 많이 만들어 내는 호르몬이다.","코르티솔은 90분이 지나야 정상 수준으로 돌아간다.","Helper 박사는 글쓴이에게 하루 종일 화를 내라고 말한다.","글쓴이는 전화기를 던진 것을 자랑스러워한다."],"r":{"a":"1) Cortisol is a hormone that your body makes more of when you are upset. (코르티솔은 화가 났을 때 몸이 더 많이 만들어 내는 호르몬이다.)","ev":"8, 9, 12번 문장","s":[[8,"When you get upset, your body produces a greater amount of cortisol, the anger hormone.","화가 났을 때, 당신의 몸은 더 많은 양의 분노 호르몬인 코르티솔을 만들어 내요."],[9,"Usually, it goes back to a normal level after only 90 seconds.","보통, 그것은 단 90초 후면 정상 수준으로 돌아가요."],[12,"And your cortisol level won’t go down!","그리고 당신의 코르티솔 수치는 낮아지지 않을 거예요!"]],"c":1,"w":"8번 문장에서 화가 났을 때 몸이 더 많은 양의 코르티솔을 만들어 낸다고 해요. 9번은 90초, 12번은 수치가 낮아지지 않는 경우예요."},"h":"29988e6a06"},{"n":9,"t":"sum","q":"(A) to 90 while you do this. Soon, you should feel (B).","ko":"이것을 하는 동안 90까지 (A). 곧, 기분이 (B) 거예요.","opts":["(A) Count / (B) better","(A) Count / (B) worse","(A) Run / (B) better","(A) Run / (B) worse","(A) Shout / (B) worse"],"oko":["(A) 세어보세요 / (B) 나아질","(A) 세어보세요 / (B) 나빠질","(A) 달려가세요 / (B) 나아질","(A) 달려가세요 / (B) 나빠질","(A) 소리치세요 / (B) 나빠질"],"r":{"a":"1) (A) Count / (B) better ((A) 세어보세요 / (B) 나아질)","ev":"14~15번 문장","s":[[14,"Count to 90 while you do this.","이것을 하는 동안 90까지 세어보세요."],[15,"Soon, you should feel better.","곧, 기분이 나아질 거예요."]],"c":1,"w":"14~15번 문장: 90까지 세어보세요(Count). 곧 기분이 나아질(better) 거예요."},"h":"b668de9c41"},{"n":10,"t":"fill","q":"However, if you keep [A] about the [B], you’ll keep making yourself angry.","ko":"하지만, 만약 그 [B]에 대해 계속 [A], 당신은 스스로를 계속 화나게 만들 거예요.","bank":["thinking","fight","quickly","usually","soon","actually"],"bko":{"thinking":"생각하는(think의 -ing형)","fight":"싸움","quickly":"빠르게","usually":"보통","soon":"곧","actually":"사실"},"r":{"a":"[A] thinking (생각하는(think의 -ing형)), [B] fight (싸움)","ev":"11번 문장","s":[[11,"However, if you keep thinking about the fight, you’ll keep making yourself angry.","하지만, 만약 계속 그 싸움에 대해 생각한다면, 당신은 계속 스스로를 화나게 만들 거예요."]],"c":null,"w":"11번 문장: 그 싸움(fight)에 대해 계속 생각하면(thinking) 스스로를 계속 화나게 만들어요."},"h":"b2d4118e45"}]},{"u":10,"id":"hk1-10-3","no":3,"ko":"쭉쭉 잡아당겨!","items":[{"n":1,"t":"tf","q":"People in Brazil pull on a birthday person’s ear because they hope the person will live a long life.","ko":"브라질 사람들은 생일을 맞은 사람이 오래 살기를 바라서 그 사람의 귀를 잡아당긴다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","w":"5번 문장에 they hope you will have a long life라고 나와요. 귀를 잡아당기는 이유가 장수를 바라는 마음이에요.","c":"T","s":[[5,"As they do so, they hope you will have a long life.","그들은 이렇게 하면서, 당신이 오래 살기를 바란다."]]},"h":"e3ffb4f58f"},{"n":2,"t":"tf","q":"Hungarians pull on a birthday person’s ankles.","ko":"헝가리 사람들은 생일을 맞은 사람의 발목을 잡아당긴다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","w":"6번에서 헝가리 사람들이 당기는 곳은 earlobes(귓불)예요. 발목(ankle)은 노래 가사에서 귀가 닿는 곳으로만 나와요.","c":"F","s":[[6,"Hungarians also pull on the birthday person’s earlobes for a similar reason.","헝가리 사람들도 비슷한 이유로 생일을 맞은 사람의 귓불을 잡아당긴다."],[7,"However, they sing a song with lyrics that mean “Live so long that your ears reach your ankles” at the same time.","하지만, 동시에 그들은 “매우 오래 살아서 귀가 발목에 닿게 되어라.”를 의미하는 가사가 있는 노래를 부른다."]]},"h":"b143eb387d"},{"n":3,"t":"tf","q":"Ear-pulling is similar to massage and helps the body relax.","ko":"귀를 잡아당기는 것은 마사지와 비슷하고 몸의 긴장을 푸는 것을 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"8~9번 문장","w":"8번에서 마사지와 비슷한 이점이 있다고 했고, 9번에서 몸의 긴장을 푸는 것을 돕는다고 했어요.","c":"T","s":[[8,"Recently, scientists have found that ear-pulling has similar benefits to massage.","최근에, 과학자들은 귀를 잡아당기는 것이 마사지와 비슷한 이점들을 가지는 것을 발견했다."],[9,"It helps to relieve stress and relax the body.","그것은 스트레스를 완화하고 몸의 긴장을 푸는 것을 돕는다."]]},"h":"76da462793"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But in Brazil, people do this to congratulate you.)","ko":"하지만 브라질에서는, 사람들이 당신을 congratulate하기 위해 이것을 한다. (congratulate의 뜻은?)","opts":["위로하다","축하하다","초대하다","놀리다"],"word":"congratulate","r":{"a":"2) 축하하다","ev":"2·3·5번 문장","w":"귀를 잡아당기는 것은 생일을 맞은 사람이 오래 살기를 바라는 좋은 뜻이에요(3·5번). 그래서 congratulate는 '축하하다'예요.","c":2,"s":[[2,"But in Brazil, people do this to congratulate you.","하지만 브라질에서는, 사람들이 당신을 축하하기 위해 이것을 한다."],[3,"They pull on a birthday person’s ear as many times as his or her age.","그들은 생일을 맞은 사람의 귀를 그 또는 그녀의 나이만큼 많이 잡아당긴다."],[5,"As they do so, they hope you will have a long life.","그들은 이렇게 하면서, 당신이 오래 살기를 바란다."]]},"h":"19ed3ac2ad"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...ear-pulling has similar benefits to massage.)","ko":"...귀를 잡아당기는 것은 마사지와 비슷한 benefits를 가진다. (benefits의 뜻은?)","opts":["단점","비용","경기","이점"],"word":"benefits","r":{"a":"4) 이점","ev":"8~9번 문장","w":"9번에서 스트레스를 줄이고 몸의 긴장을 푼다고 했어요. 이런 좋은 점이 benefits(이점)예요.","c":4,"s":[[8,"Recently, scientists have found that ear-pulling has similar benefits to massage.","최근에, 과학자들은 귀를 잡아당기는 것이 마사지와 비슷한 이점들을 가지는 것을 발견했다."],[9,"It helps to relieve stress and relax the body.","그것은 스트레스를 완화하고 몸의 긴장을 푸는 것을 돕는다."]]},"h":"8bc432e56f"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey pull on a birthday person’s ear as many times as his or her age.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 생일을 맞은 사람의 귀를 그 또는 그녀의 나이만큼 많이 잡아당긴다.","opts":["브라질 사람들","헝가리 사람들","과학자들","생일을 맞은 사람들"],"pron":"They","r":{"a":"1) 브라질 사람들","ev":"2~3번 문장","s":[[2,"But in Brazil, people do this to congratulate you.","하지만 브라질에서는, 사람들이 당신을 축하하기 위해 이것을 한다."],[3,"They pull on a birthday person’s ear as many times as his or her age.","그들은 생일을 맞은 사람의 귀를 그 또는 그녀의 나이만큼 많이 잡아당긴다."]],"c":1,"k":"They = 브라질 사람들","w":"2번 문장의 people in Brazil(브라질 사람들)을 3번 문장의 They가 가리켜요."},"h":"935590691c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So if you are 14 years old, friends and family will pull on your ears 14 times.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 만약 당신이 14살이라면, 친구들과 가족은 당신의 귀를 14번 잡아당길 것이다.","opts":["14살이 되면 친구들과 가족이 당신의 귀를 한 번만 잡아당긴다.","당신이 14살이면 당신이 가족의 귀를 14번 잡아당긴다.","당신이 14살이면 친구들과 가족이 당신의 귀를 14번 잡아당긴다.","14살이 되면 친구들과 가족이 당신의 발목을 14번 잡아당긴다."],"r":{"a":"3) 당신이 14살이면 친구들과 가족이 당신의 귀를 14번 잡아당긴다.","ev":"3~4번 문장","w":"3번의 규칙(나이만큼)을 14살에 적용한 문장이에요. 당기는 사람은 친구들과 가족, 당기는 곳은 당신의 귀, 횟수는 14번이에요.","c":3,"s":[[3,"They pull on a birthday person’s ear as many times as his or her age.","그들은 생일을 맞은 사람의 귀를 그 또는 그녀의 나이만큼 많이 잡아당긴다."],[4,"So if you are 14 years old, friends and family will pull on your ears 14 times.","그래서 만약 당신이 14살이라면, 친구들과 가족은 당신의 귀를 14번 잡아당길 것이다."]]},"h":"9b05cb0b3a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","
